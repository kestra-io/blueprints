id: pocketbase-api-engine-health-and-database-storage-sentinel
namespace: company.platform

description: "Continuously audits PocketBase backend engine responsiveness, monitors embedded SQLite database health and collection inventory, alerts via Slack, and prevents data layer outages."

inputs:
  - id: pocketbase_host
    type: STRING
    defaults: "localhost"
    description: "Hostname or IP address of the PocketBase backend instance."

  - id: pocketbase_port
    type: INT
    defaults: 8090
    description: "HTTP REST API port for PocketBase (default: 8090)."

  - id: max_collections_threshold
    type: INT
    defaults: 100
    description: "Maximum expected database collections before flagging unexpected schema growth or schema drift (default: 100)."

  - id: dry_run
    type: BOOL
    defaults: true
    description: "Safety gate: when true, audits and emits alerts without triggering automated diagnostic dumps or service restarts."

  - id: slack_channel
    type: STRING
    defaults: "#devops-alerts"
    description: "Target Slack channel for PocketBase engine health degradation and schema drift alerts."

triggers:
  - id: periodic_pocketbase_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_pocketbase_health
    type: io.kestra.plugin.core.http.Request
    description: "Polls PocketBase /api/health endpoint to verify Go runtime health, embedded SQLite connectivity, and disk read/write capability."
    uri: "http://{{ inputs.pocketbase_host }}:{{ inputs.pocketbase_port }}/api/health"
    method: GET
    options:
      timeout:
        readIdleTimeout: PT15S

  - id: probe_pocketbase_collections
    type: io.kestra.plugin.core.http.Request
    description: "Queries /api/collections to inspect the database schema catalog and verify collection accessibility."
    uri: "http://{{ inputs.pocketbase_host }}:{{ inputs.pocketbase_port }}/api/collections"
    method: GET
    options:
      timeout:
        readIdleTimeout: PT15S

  - id: classify_pocketbase_status
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates health API response payload and collection count to categorize status into ENGINE_UNHEALTHY, SCHEMA_DRIFT_WARNING, or HEALTHY."
    value: >-
      {% if outputs.probe_pocketbase_health.code != 200 or not ('"code":200' in outputs.probe_pocketbase_health.body) %}
      ENGINE_UNHEALTHY
      {% elif (fromJson(outputs.probe_pocketbase_collections.body).items ?? []) | length > inputs.max_collections_threshold %}
      SCHEMA_DRIFT_WARNING
      {% else %}
      HEALTHY
      {% endif %}
    cases:
      ENGINE_UNHEALTHY:
        - id: alert_engine_unhealthy_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches critical Slack alert when PocketBase health check reports degraded engine or database failure."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":rotating_light: *PocketBase Health Degraded: Engine or SQLite Failure*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *PocketBase Service Outage*\n*Host:* `http://{{ inputs.pocketbase_host }}:{{ inputs.pocketbase_port }}`\n*HTTP Code:* `{{ outputs.probe_pocketbase_health.code }}`\n*Response:* `{{ outputs.probe_pocketbase_health.body | trim }}`\n*Impact:* Client applications, real-time subscriptions, and database persistence are offline."
                  }
                }
              ]
            }

      SCHEMA_DRIFT_WARNING:
        - id: alert_schema_drift_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches operational warning when collection count exceeds the configured baseline threshold."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":warning: *PocketBase Warning: Collection Inventory Threshold Exceeded*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *PocketBase Schema Drift / Collection Growth*\n*Host:* `http://{{ inputs.pocketbase_host }}:{{ inputs.pocketbase_port }}`\n*Total Collections:* `{{ (fromJson(outputs.probe_pocketbase_collections.body).items ?? []) | length }}`\n*Threshold:* `{{ inputs.max_collections_threshold }}`\n*Action:* Verify whether recent migrations created unmanaged temporary collections."
                  }
                }
              ]
            }

        - id: check_dry_run_remediation
          type: io.kestra.plugin.core.flow.If
          description: "Safeguard check ensuring diagnostic logging only triggers according to dry-run configuration."
          condition: "{{ inputs.dry_run == true }}"
          then:
            - id: log_dry_run_notice
              type: io.kestra.plugin.core.log.Log
              message: "Dry-run active: collection threshold breach recorded without mutating database schema."
          else:
            - id: log_live_remediation_intent
              type: io.kestra.plugin.core.log.Log
              message: "Live mode: collection threshold exceeded on {{ inputs.pocketbase_host }}. Automated schema reconciliation logged."

      HEALTHY:
        - id: log_healthy_state
          type: io.kestra.plugin.core.log.Log
          description: "Logs nominal health when PocketBase responds with code 200 and collections operate within baseline bounds."
          message: "PocketBase service is healthy on {{ inputs.pocketbase_host }}:{{ inputs.pocketbase_port }}. Evaluated {{ (fromJson(outputs.probe_pocketbase_collections.body).items ?? []) | length }} collections."

  - id: log_sentinel_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Emits immutable audit record documenting PocketBase engine health status and execution lineage."
    message: "PocketBase sentinel evaluation complete for http://{{ inputs.pocketbase_host }}:{{ inputs.pocketbase_port }}. Status: {{ outputs.classify_pocketbase_status.value | trim }} | Response: {{ outputs.probe_pocketbase_health.code }} | Execution: {{ execution.id }}"

errors:
  - id: alert_pocketbase_network_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatches emergency Slack alert if the PocketBase container is down, unreachable, or network partitioned."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": ":fire: *PocketBase Network Unreachable Outage*",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": ":fire: *PocketBase Connection Refused*\nFailed to connect to PocketBase server at `http://{{ inputs.pocketbase_host }}:{{ inputs.pocketbase_port }}`. The daemon process may have crashed, volume unmounted, or container terminated."
            }
          }
        ]
      }

extend:
  title: PocketBase API Engine Health & Database Storage Sentinel
  metaTitle: PocketBase API Health & Database Storage Sentinel | Kestra
  shortDescription: Continuously audit PocketBase backend health, detect SQLite database lock contention and collection drift, and alert on Slack.
  metaDescription: Audit PocketBase API engine health, monitor embedded SQLite database responsiveness, and alert via Slack to prevent application data persistence failures.
  description: |
    PocketBase is an open-source, single-binary Go backend consisting of embedded SQLite database storage, real-time subscriptions, file storage, and a comprehensive REST API. Widely adopted across internal engineering tools, mobile applications, and edge services, PocketBase provides an all-in-one backend architecture with minimal operational footprint. However, in production microservices, uncheckpointed SQLite Write-Ahead Logging (WAL), unindexed full-text queries, or high write concurrency can cause SQLite database locks, resulting in HTTP 500 errors and degraded API responsiveness. This blueprint implements an automated operational sentinel that polls PocketBase core health endpoints, monitors database collection catalogs against capacity baselines, dispatches incident alerts to Slack, and maintains execution audit lineage.

    ## How it works

    1. `periodic_pocketbase_audit` (`io.kestra.plugin.core.trigger.Schedule`) initiates scheduled monitoring every 15 minutes. Shipped disabled so initial connectivity can be verified manually.
    2. `probe_pocketbase_health` (`io.kestra.plugin.core.http.Request`) invokes `GET /api/health` to confirm Go engine health, SQLite read/write capability, and storage volume integrity.
    3. `probe_pocketbase_collections` (`io.kestra.plugin.core.http.Request`) invokes `GET /api/collections` to audit active database tables and verify schema responsiveness.
    4. `classify_pocketbase_status` (`io.kestra.plugin.core.flow.Switch`) analyzes probe results:
       - `ENGINE_UNHEALTHY`: Fires if `/api/health` returns non-200 or an error code, routing an emergency Slack notification via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
       - `SCHEMA_DRIFT_WARNING`: Fires when total collection count exceeds `max_collections_threshold`, notifying the DevOps team of potential migration sprawl.
       - `HEALTHY`: Confirms that both the API runtime and embedded SQLite operate within nominal latency and capacity bounds.
    5. `log_sentinel_audit_summary` (`io.kestra.plugin.core.log.Log`) records an immutable audit record documenting operational status and collection tallies.
    6. Global `errors` handler catches connection drops, timeouts, or daemon crashes, immediately firing an outage alert to Slack.

    ## What you get

    - Automated continuous surveillance of PocketBase backend API responsiveness and SQLite database availability.
    - Proactive alerts on Slack before SQLite database lockups or disk saturation impact user-facing client applications.
    - Safe dry-run guarding: default `dry_run: true` prevents inadvertent mutations during health evaluations.
    - Centralized audit lineage within Kestra tracking database collection growth and uptime history.

    ## Who it's for

    - Platform Engineers and SREs hosting PocketBase backends on edge nodes, Docker, or Kubernetes clusters.
    - DevOps Teams running internal developer portals and lightweight database services requiring uptime guarantees.
    - Full-Stack Developers operating self-hosted PocketBase backends seeking automated failure notifications.

    ## Why orchestrate this with Kestra

    PocketBase exposes lightweight HTTP health endpoints but lacks built-in alerting, cron scheduling, and multi-channel incident escalation. Relying on standalone cron scripts introduces single points of failure, unprotected credentials, and zero execution tracking. Kestra delivers a declarative YAML blueprint featuring scheduled triggers, masked secret management, conditional branching, and comprehensive execution observability.

    ## Prerequisites

    - A running PocketBase instance (version 0.20.0+) accessible over HTTP. PocketBase provides an official open-source Docker image (`ghcr.io/muchobien/pocketbase:latest`) requiring zero commercial licensing.
    - An incoming Slack webhook URL for operational notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for operational notifications and incident routing.

    ## Quick start

    1. Start a local PocketBase test container:
       ```bash
       docker run -d --name pocketbase-test -p 8090:8090 ghcr.io/muchobien/pocketbase:latest
       ```
    2. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    3. Import this blueprint and execute with default inputs (`dry_run: true`).
    4. Confirm that `log_healthy_state` records a successful API response (`code: 200`).
    5. Test alerting by stopping the container (`docker stop pocketbase-test`) and re-running the flow to verify `alert_pocketbase_network_failure`.
    6. Enable `periodic_pocketbase_audit` to activate recurring 15-minute surveillance.

    ## How to extend

    - Add automated SQLite database backup sync to AWS S3 using `io.kestra.plugin.aws.s3.Upload`.
    - Integrate with PagerDuty via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for high-severity database outages.
    - Add automated container restart tasks via `io.kestra.plugin.docker` when `dry_run: false` to self-heal crashed daemons.

    ## Links

    - [PocketBase Official Documentation](https://pocketbase.io/docs/)
    - [PocketBase GitHub Repository](https://github.com/pocketbase/pocketbase)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
