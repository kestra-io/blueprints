    - [AWS Compute Optimizer GetEC2InstanceRecommendations API reference](https://docs.aws.amazon.com/compute-optimizer/latest/APIReference/API_GetEC2InstanceRecommendations.html)
    - [AWS Compute Optimizer Filter API reference](https://docs.aws.amazon.com/compute-optimizer/latest/APIReference/API_Filter.html)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
