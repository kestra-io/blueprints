id: grafana-alert-rule-execution-error-sentinel
namespace: company.sre

description: |
  Audits Grafana alert rule evaluation states via the alert rules API to detect broken datasource queries, syntax errors, and failed alert evaluations.

concurrency:
  limit: 1

inputs:
  - id: grafana_host
    type: STRING
    displayName: "Grafana Host"
    defaults: "grafana.internal"
    description: "Host for Grafana endpoint."

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: curlimages/curl:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      GRAFANA_HOST: "{{ inputs.grafana_host }}"
      GRAFANA_TOKEN: "{{ secret('GRAFANA_SERVICE_ACCOUNT_TOKEN') }}"
    commands:
      - |
        RULES=$(curl -s -H "Authorization: Bearer $GRAFANA_TOKEN" "http://$GRAFANA_HOST:3000/api/v1/provisioning/alert-rules" 2>/dev/null)
        if [ -z "$RULES" ]; then echo "Grafana API query failed" >&2; exit 1; fi
        echo "$RULES" | jq '
        [ .[] | {title: .title, execErrState: .execErrState} ]
        | {error_rules_count: length, is_alert: false}
        ' > output.json
    outputFiles:
      - output.json

  - id: evaluate_threshold
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).is_alert }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "text": "🚨 *Grafana Alert Rule Error Alert: `{{ inputs.grafana_host }}`*"
          }

errors:
  - id: notify_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "text": "❌ *Sentinel probe execution failed for grafana-alert-rule-execution-error-sentinel*"
      }

extend:
  title: Grafana unified alert rule execution error sentinel
  shortDescription: Audits Grafana alert rule evaluation states via the alert rules API to detect broken datasource queries, syntax errors, and failed alert evaluations.
  description: |
    Audits Grafana alert rule evaluation states via the alert rules API to detect broken datasource queries, syntax errors, and failed alert evaluations.

    ## How it works
    1. A schedule trigger or manual execution connects to the target infrastructure service endpoint.
    2. Runs diagnostic status queries inside an isolated container runner to extract health telemetry.
    3. Evaluates health metrics against defined thresholds to flag operational anomalies.
    4. Dispatches actionable alerts to Slack with resource metrics and remediation guidance.

    ## What you get
    - Proactive infrastructure monitoring without managing external monitoring agents.
    - Automated detection of system degradation before outages impact production services.
    - Actionable Slack notifications equipped with diagnostic metrics.

    ## Who it's for
    - Site Reliability Engineers (SREs) and DevOps engineers maintaining high availability.
    - Platform Engineers and Database Administrators operating distributed infrastructure.
    - Operations teams requiring automated incident alerting.

    ## Why orchestrate this with Kestra
    - Runs declarative probes directly with native plugins and container tasks.
    - Securely stores sensitive connection credentials in Kestra namespace secrets.
    - Maintains a complete historical audit log of every health check execution.

    ## Prerequisites
    - Network connectivity to the target service from Kestra worker pods.
    - Service credentials and `SLACK_WEBHOOK` secret configured in the Kestra namespace.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Configure the required namespace secrets.
    3. Run a manual execution to test connectivity.
    4. Enable the schedule trigger for continuous background monitoring.

    ## How to extend
    - Add automated remediation tasks (e.g. restart service, failover replica, purge queues).
    - Route critical alerts to PagerDuty or OpsGenie.
    - Forward historical telemetry to long-term data warehouses.

    ## Links
    - [Kestra Documentation](https://kestra.io/docs)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Observability
  ee: false
  demo: false
