id: weaviate-cross-class-reference-integrity-and-dangling-beacon-guard
namespace: company.ai

inputs:
  - id: weaviate_url
    type: STRING
    displayName: Weaviate URL
    description: HTTP endpoint of the target Weaviate instance.
    defaults: http://localhost:8080

  - id: parent_class
    type: STRING
    displayName: Parent Class Name
    description: Name of the Weaviate collection holding cross-reference beacons (e.g. Article).
    defaults: Article

  - id: reference_property
    type: STRING
    displayName: Reference Property Name
    description: Name of the cross-reference property on the parent class (e.g. hasAuthor).
    defaults: hasAuthor

  - id: target_class
    type: STRING
    displayName: Target Class Name
    description: Expected class name of the referenced target objects (e.g. Author).
    defaults: Author

  - id: sample_limit
    type: INT
    displayName: Sample Limit
    description: Maximum number of parent objects to scan for reference integrity.
    defaults: 200

  - id: max_tolerated_dangling_percent
    type: FLOAT
    displayName: Max Tolerated Dangling Percentage
    description: Maximum percentage of broken cross-reference beacons tolerated before flagging an integrity breach.
    defaults: 5.0

  - id: dry_run
    type: SELECT
    displayName: Dry Run
    description: When true, audit and catalog broken references without deleting dangling beacons from Weaviate.
    values:
      - "true"
      - "false"
    defaults: "false"

triggers:
  - id: periodic_beacon_integrity_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recurring audit pass to continuously detect and repair dangling cross-class reference beacons.
    cron: "0 */6 * * *"
    disabled: true

tasks:
  - id: query_parent_cross_references
    type: io.kestra.plugin.weaviate.Query
    description: Extract parent class instances and their cross-reference beacons via GraphQL.
    url: "{{ inputs.weaviate_url }}"
    apiKey: "{{ secret('WEAVIATE_API_KEY') }}"
    fetchType: FETCH
    query: |
      {
        Get {
          {{ inputs.parent_class }}(limit: {{ inputs.sample_limit }}) {
            _additional {
              id
            }
            {{ inputs.reference_property }} {
              ... on {{ inputs.target_class }} {
                _additional {
                  id
                }
              }
            }
          }
        }
      }

  - id: audit_and_reconcile_beacon_integrity
    type: io.kestra.plugin.scripts.python.Script
    description: Verify existence of referenced target UUIDs, compile broken beacon manifest, and safely unlink dangling pointers.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      WEAVIATE_API_KEY: "{{ secret('WEAVIATE_API_KEY') }}"
      QUERY_ROWS: "{{ outputs.query_parent_cross_references.rows is defined ? (outputs.query_parent_cross_references.rows | toJson) : '[]' }}"
    script: |
      import os
      import json
      import requests
      from kestra import Kestra

      weaviate_url = "{{ inputs.weaviate_url }}".rstrip("/")
      api_key = os.environ.get("WEAVIATE_API_KEY") or None
      parent_class = "{{ inputs.parent_class }}"
      ref_prop = "{{ inputs.reference_property }}"
      target_class = "{{ inputs.target_class }}"
      max_tolerated_pct = float("{{ inputs.max_tolerated_dangling_percent }}")
      dry_run = "{{ inputs.dry_run }}" == "true"

      headers = {"Content-Type": "application/json"}
      if api_key:
          headers["Authorization"] = f"Bearer {api_key}"

      raw_rows = json.loads(os.environ.get("QUERY_ROWS", "[]"))
      total_parents = len(raw_rows)

      if total_parents == 0:
          print(f"No objects found for parent class: {parent_class}")
          report = {
              "total_parents_inspected": 0,
              "total_references_checked": 0,
              "dangling_beacon_count": 0,
              "dangling_rate_percent": 0.0,
              "has_dangling_beacons": False,
              "integrity_status": "NO_PARENT_OBJECTS"
          }
          with open("dangling_beacons_manifest.json", "w") as f:
              json.dump(report, f, indent=2)
          Kestra.outputs(report)
          exit(0)

      reference_links = []
      distinct_target_ids = set()

      for row in raw_rows:
          parent_add = row.get("_additional", {})
          parent_id = parent_add.get("id") if isinstance(parent_add, dict) else None
          if not parent_id:
              continue

          refs = row.get(ref_prop) or []
          if isinstance(refs, dict):
              refs = [refs]

          for ref in refs:
              target_add = ref.get("_additional", {})
              target_id = target_add.get("id") if isinstance(target_add, dict) else None
              if target_id:
                  reference_links.append({"parent_id": parent_id, "target_id": target_id})
                  distinct_target_ids.add(target_id)

      total_refs = len(reference_links)
      if total_refs == 0:
          print(f"No cross-references populated on property: {ref_prop}")
          report = {
              "total_parents_inspected": total_parents,
              "total_references_checked": 0,
              "dangling_beacon_count": 0,
              "dangling_rate_percent": 0.0,
              "has_dangling_beacons": False,
              "integrity_status": "NO_REFERENCES_POPULATED"
          }
          with open("dangling_beacons_manifest.json", "w") as f:
              json.dump(report, f, indent=2)
          Kestra.outputs(report)
          exit(0)

      print(f"Auditing {total_refs} total references across {len(distinct_target_ids)} distinct target UUIDs...")

      existing_target_ids = set()
      for target_id in distinct_target_ids:
          endpoint = f"{weaviate_url}/v1/objects/{target_class}/{target_id}"
          try:
              resp = requests.get(endpoint, headers=headers, timeout=10)
              if resp.status_code == 200:
                  existing_target_ids.add(target_id)
          except Exception as e:
              print(f"Warning: Failed to probe target {target_id}: {e}")

      dangling_links = [
          link for link in reference_links if link["target_id"] not in existing_target_ids
      ]
      dangling_count = len(dangling_links)
      dangling_pct = round((dangling_count / total_refs) * 100.0, 2)
      has_dangling = dangling_count > 0
      integrity_status = "INTEGRITY_VIOLATION" if dangling_pct > max_tolerated_pct else ("WARNING" if has_dangling else "HEALTHY")

      print(f"Reference Integrity Audit Complete: {total_refs} links checked.")
      print(f"Dangling Beacons Found: {dangling_count} ({dangling_pct}%). Status: {integrity_status}")

      remediated_count = 0
      if not dry_run and has_dangling:
          for link in dangling_links:
              p_id = link["parent_id"]
              t_id = link["target_id"]
              del_endpoint = f"{weaviate_url}/v1/objects/{parent_class}/{p_id}/references/{ref_prop}"
              del_payload = {"beacon": f"weaviate://localhost/{target_class}/{t_id}"}
              try:
                  del_resp = requests.delete(del_endpoint, headers=headers, json=del_payload, timeout=10)
                  if del_resp.status_code in (200, 204):
                      remediated_count += 1
              except Exception as e:
                  print(f"Failed to unlink beacon from parent {p_id}: {e}")
          print(f"Remediation: Unlinked {remediated_count} dangling beacons from Weaviate.")
      elif dry_run and has_dangling:
          print(f"DRY RUN: {dangling_count} dangling beacons cataloged without deletion.")

      manifest = {
          "parent_class": parent_class,
          "reference_property": ref_prop,
          "target_class": target_class,
          "total_parents_inspected": total_parents,
          "total_references_checked": total_refs,
          "distinct_targets_checked": len(distinct_target_ids),
          "dangling_beacon_count": dangling_count,
          "dangling_rate_percent": dangling_pct,
          "max_tolerated_percent": max_tolerated_pct,
          "has_dangling_beacons": has_dangling,
          "integrity_status": integrity_status,
          "dry_run": dry_run,
          "remediated_count": remediated_count,
          "dangling_references": dangling_links[:100]
      }

      with open("dangling_beacons_manifest.json", "w") as f:
          json.dump(manifest, f, indent=2)

      Kestra.outputs(manifest)
    outputFiles:
      - dangling_beacons_manifest.json

  - id: evaluate_integrity_breach
    type: io.kestra.plugin.core.flow.If
    description: Dispatch high-priority notification to engineering channels when broken cross-reference beacons are detected.
    condition: "{{ outputs.audit_and_reconcile_beacon_integrity.vars.has_dangling_beacons }}"
    then:
      - id: alert_dangling_beacons_detected
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Notify Slack with exact counts of broken graph edges and remediation status.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *Weaviate Cross-Class Reference Integrity Alert*\n*Parent Class:* `{{ inputs.parent_class }}` (`{{ inputs.reference_property }}`)\n*Target Class:* `{{ inputs.target_class }}`\n*Broken Beacons:* `{{ outputs.audit_and_reconcile_beacon_integrity.vars.dangling_beacon_count }}` ({{ outputs.audit_and_reconcile_beacon_integrity.vars.dangling_rate_percent }}% error rate)\n*Remediated:* `{{ outputs.audit_and_reconcile_beacon_integrity.vars.remediated_count }}` (Dry Run: `{{ inputs.dry_run }}`)\n*Execution:* <{{ flow.url }}|{{ execution.id }}>"
          }

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record an immutable audit log entry capturing reference integrity telemetry and graph health.
    message: |
      [AUDIT] Weaviate Reference Integrity Audit Completed.
      Status: {{ outputs.audit_and_reconcile_beacon_integrity.vars.integrity_status }}
      Relationship: {{ inputs.parent_class }}.{{ inputs.reference_property }} -> {{ inputs.target_class }}
      Parents Inspected: {{ outputs.audit_and_reconcile_beacon_integrity.vars.total_parents_inspected }}
      References Checked: {{ outputs.audit_and_reconcile_beacon_integrity.vars.total_references_checked }}
      Dangling Beacons: {{ outputs.audit_and_reconcile_beacon_integrity.vars.dangling_beacon_count }} ({{ outputs.audit_and_reconcile_beacon_integrity.vars.dangling_rate_percent }}%)
      Remediated: {{ outputs.audit_and_reconcile_beacon_integrity.vars.remediated_count ?? 0 }}
      Dry Run: {{ inputs.dry_run }}

errors:
  - id: alert_execution_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Notify on-call channel if the Weaviate GraphQL query or audit runner encounters transport or authentication errors.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "❌ *Weaviate Reference Integrity Guard Failed*\nFlow `{{ flow.id }}` failed during execution `{{ execution.id }}` against Weaviate host `{{ inputs.weaviate_url }}`. Inspect execution logs for stack trace."
      }

extend:
  title: Weaviate Cross-Class Reference Integrity and Dangling Beacon Cleanup Guard
  metaTitle: Weaviate Reference Integrity & Beacon Guard | Kestra
  shortDescription: Audit Weaviate cross-class beacon references, detect dangling pointers to deleted target objects, and safely reconcile broken graph edges.
  metaDescription: Audit Weaviate cross-class beacon reference integrity, detect dangling pointers to deleted target objects, and alert Slack on broken knowledge graph edges.
  description: |
    In production vector search and GraphRAG knowledge bases built on Weaviate, entities frequently
    maintain cross-references across collections (such as `Article.hasAuthor -> Author` or
    `Product.inCategory -> Category`) represented as directional beacons (`weaviate://localhost/Class/UUID`).
    Because Weaviate operates as a distributed vector search engine without native relational cascading
    deletes, deleting target objects leaves the referencing objects with unresolved beacons pointing to
    non-existent UUIDs.

    When downstream Large Language Models (LLMs) or retrieval pipelines traverse these multi-hop graph
    relationships via GraphQL, Weaviate fails to resolve the missing target entities. This triggers GraphQL
    resolver warnings, degrades RAG context retrieval accuracy, and can cause runtime application crashes.

    This blueprint implements an automated Day 2 Operations reference integrity and cleanup guard for
    Weaviate. On a scheduled cadence, it queries parent collection entities and their cross-reference
    properties using native GraphQL, audits referenced target UUIDs against the target collection,
    calculates the dangling beacon corruption rate, alerts engineering channels when thresholds are
    breached, and surgically unlinks the broken pointers to restore graph referential integrity.

    ## How it works

    1. `periodic_beacon_integrity_schedule` (`io.kestra.plugin.core.trigger.Schedule`) invokes the audit every 6 hours (disabled by default for initial onboarding).
    2. `query_parent_cross_references` (`io.kestra.plugin.weaviate.Query`) queries the parent class using GraphQL with `fetchType: FETCH` to extract parent object IDs and their nested target object beacon references.
    3. `audit_and_reconcile_beacon_integrity` (`io.kestra.plugin.scripts.python.Script`) extracts distinct referenced target UUIDs, probes the target collection endpoint, identifies dangling pointers to deleted objects, calculates the error rate percentage, and outputs `dangling_beacons_manifest.json`.
    4. When `dry_run` is `false` and dangling beacons are detected, the audit task dispatches targeted `DELETE /v1/objects/{Class}/{id}/references/{property}` calls to Weaviate's REST API to cleanly unlink the broken references without altering other object properties.
    5. `evaluate_integrity_breach` (`io.kestra.plugin.core.flow.If`) evaluates whether broken beacons were detected, dispatching a structured incident alert to Slack via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
    6. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) writes an immutable summary entry to Kestra's execution history tracking total verified references, dangling counts, and remediation outcomes.
    7. A flow-level `errors` handler captures connection timeouts or authentication failures and routes an incident alert to Slack.

    ## What you get

    - Automated discovery of broken cross-reference beacons across Weaviate vector collections.
    - Graph referential integrity validation preventing GraphQL resolver failures in GraphRAG pipelines.
    - Zero-data-loss remediation: surgically removes invalid beacon references without modifying valid vector embeddings or object properties.
    - Built-in `dry_run` mode to safely preview orphaned relations before committing live graph modifications.
    - Structured forensic audit artifacts (`dangling_beacons_manifest.json`) recording every detected parent and missing target UUID.
    - Real-time Slack notifications detailing relationship names, broken edge counts, and remediation results.

    ## Who it's for

    - AI Platform Engineers and MLOps Teams operating GraphRAG and multi-class Weaviate knowledge graphs.
    - Data Engineers maintaining ETL ingestion and synchronization pipelines into vector databases.
    - Site Reliability Engineers ensuring high-availability and zero-error queries across vector retrieval clusters.

    ## Why orchestrate this with Kestra

    Maintaining cross-class referential integrity in Weaviate with standalone scripts requires managing bespoke GraphQL query pagination, credential security, error retry loops, and separate alerting mechanisms. Kestra provides native Weaviate GraphQL tasks, containerized script runners, centralized secret masking, conditional remediation branching, and turnkey Slack alerting in a single observable YAML blueprint.

    ## Prerequisites

    - A running Weaviate instance (version 1.20.0 or higher) reachable from the Kestra worker environment.
    - At least two Weaviate classes configured with a cross-reference property (e.g. `Article` referencing `Author`).
    - An incoming Slack webhook URL for operational notifications.
    - Docker enabled on the Kestra worker host for containerized script execution.

    ### Secrets

    - `WEAVIATE_API_KEY`: API key or Bearer token for authenticated Weaviate instances (leave blank or placeholder for local unauthenticated clusters).
    - `SLACK_WEBHOOK_URL`: Incoming Webhook URL for Slack incident and operational notifications.

    ## Quick start

    1. Configure `WEAVIATE_API_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local Weaviate container for testing:
       ```bash
       docker run -d --name weaviate-dev \
         -p 8080:8080 -p 50051:50051 \
         -e AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true \
         -e PERSISTENCE_DATA_PATH=/var/lib/weaviate \
         cr.weaviate.io/semitechnologies/weaviate:1.24.8
       ```
    3. Seed the local Weaviate instance with sample parent and target schema classes, insert objects, and delete a target entity to create a dangling beacon.
    4. Run a manual execution with `dry_run: "true"` to verify GraphQL connectivity and review the detected broken pointers in `dangling_beacons_manifest.json`.
    5. Set `dry_run: "false"` on a follow-up run to execute live beacon unlinking, and activate `periodic_beacon_integrity_schedule` for continuous background governance.

    ## How to extend

    - Add bidirectional validation: configure a downstream task to audit inverse cross-references and ensure reciprocal edges remain synchronized.
    - Quarantine missing references: export dangling target IDs to an S3 or MinIO bucket via `io.kestra.plugin.aws.s3.Upload` for upstream data source backfill.
    - Chain downstream cache invalidation: trigger a Redis cache purge task (`io.kestra.plugin.redis.string.Delete`) when knowledge graph relationships are pruned.

    ## Links

    - [Kestra Weaviate Plugin Documentation](https://kestra.io/plugins/plugin-weaviate)
    - [Weaviate Cross-References Documentation](https://weaviate.io/developers/weaviate/manage-data/cross-references)
    - [Weaviate REST API Reference - Object References](https://weaviate.io/developers/weaviate/api/rest#tag/objects/delete/objects/{className}/{id}/references/{propertyName})
  tags:
    - Data
    - AI
  subTags:
    - Vector Stores & RAG
    - Testing & Quality
  ee: false
  demo: false
