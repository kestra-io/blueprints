id: currency-rate-watcher
namespace: company.team

description: Fetches the daily USD/INR rate, extracts it with DuckDB, and branches on a threshold.

inputs:
  - id: threshold
    type: FLOAT
    defaults: 80
    description: Rate above which the "above" branch runs.

tasks:
  - id: fetch_rate
    type: io.kestra.plugin.core.http.Request
    description: Get the latest USD to INR rate from the free Frankfurter API (no key needed).
    uri: https://api.frankfurter.dev/v1/latest?base=USD&symbols=INR

  - id: extract_rate
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Read the rate out of the JSON response with DuckDB.
    inputFiles:
      rates.json: "{{ outputs.fetch_rate.body }}"
    sql: |
      SELECT rates.INR AS usd_inr, date AS rate_date
      FROM read_json_auto('rates.json');
    fetchType: FETCH_ONE

  - id: check_rate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.extract_rate.row.usd_inr > inputs.threshold }}"
    then:
      - id: above_threshold
        type: io.kestra.plugin.core.log.Log
        message: "USD/INR is {{ outputs.extract_rate.row.usd_inr }}, above {{ inputs.threshold }}"
    else:
      - id: below_threshold
        type: io.kestra.plugin.core.log.Log
        message: "USD/INR is {{ outputs.extract_rate.row.usd_inr }}, at or below {{ inputs.threshold }}"

triggers:
  - id: daily_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * *"
    timezone: Asia/Kolkata

extend:
  shortDescription: Fetch the daily USD/INR exchange rate, extract it with DuckDB, and branch on a threshold with an If task.
  title: Daily USD/INR exchange rate watcher with DuckDB and a threshold check
  metaTitle: USD/INR Exchange Rate Watcher with DuckDB in Kestra
  metaDescription: Fetch the daily USD/INR rate from a free API, extract it with DuckDB, and branch on a threshold using an If task and a daily schedule in Kestra.
  description: |
    Track a currency pair without standing up a database. This blueprint calls a free exchange-rate API every day, reads the USD to INR rate out of the JSON response with DuckDB, and uses an `If` task to log whether the rate is above or at-or-below a threshold you choose.

    ## How it works
    1. The `daily_check` trigger (`io.kestra.plugin.core.trigger.Schedule`) runs the flow every day at 09:00 Asia/Kolkata.
    2. `fetch_rate` uses `io.kestra.plugin.core.http.Request` to get the latest USD to INR rate from the Frankfurter API.
    3. `extract_rate` uses `io.kestra.plugin.jdbc.duckdb.Query` to mount the response as `rates.json` via `inputFiles`, then reads `rates.INR` and the date with `read_json_auto`. `fetchType: FETCH_ONE` returns a single row.
    4. `check_rate` uses `io.kestra.plugin.core.flow.If` to compare `outputs.extract_rate.row.usd_inr` with the `threshold` input, then runs `above_threshold` or `below_threshold`.

    ## What you get
    - A daily exchange-rate check with a configurable threshold.
    - A pattern for reading a JSON API response with SQL in DuckDB.
    - A starting point for rate alerts: replace the log tasks with a notification.

    ## Who it's for
    - Anyone who wants a simple, scheduled rate watcher.
    - Teams learning how HTTP, DuckDB, and flow-control tasks fit together in Kestra.

    ## Prerequisites
    - A running Kestra instance with the DuckDB JDBC plugin available.
    - Outbound network access to the Frankfurter API.

    ### Secrets
    This flow uses no secrets. The Frankfurter API needs no key.

    ## Inputs
    - `threshold` (FLOAT, default `80`): the rate to compare against.

    ## Quick start
    1. Add this flow to a Kestra namespace.
    2. Execute it, optionally changing `threshold`.
    3. Open the logs and look for the message from `above_threshold` or `below_threshold`.

    ## Expected outputs
    - `outputs.extract_rate.row.usd_inr`: the current USD to INR rate.
    - `outputs.extract_rate.row.rate_date`: the date of the rate.

    ## How to extend
    - Change `symbols=INR` and the SQL to watch another currency.
    - Replace the log tasks with a Slack or email notification.
    - Store each day's rate in a database to chart it over time.

    ## Links
    - [Frankfurter API](https://frankfurter.dev)
    - [DuckDB plugin docs](https://kestra.io/plugins/plugin-jdbc-duckdb)
  tags:
    - Data
  subTags:
    - File & Data Processing Basics
  ee: false
  demo: false
