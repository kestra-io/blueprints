id: cart-abandonment-recovery
namespace: company.team

description: |
  Abandoned carts leak revenue quietly, so this flow turns every abandoned-cart
  event into a qualified recovery push while the shopper's intent is still
  warm. A keyed webhook accepts the cart payload and a disabled hourly sweep
  stands ready as the fallback net; a shell step writes carts.json and a
  python step qualifies each cart against the min_value floor and the contact
  cooldown, dropping the carts that are under value, still cooling down or
  already recovered. Every qualifier gets a POST to the recovery-message
  endpoint plus a recovery email, the channel gets one Slack summary led by
  the revenue at risk, and a run with nothing to recover is logged as clear.
  Each run exposes the verdict, the recovery count, the qualifying carts and
  the revenue at risk as typed outputs, and any failure escalates to Slack.

triggers:
  - id: cart_abandoned
    type: io.kestra.plugin.core.trigger.Webhook
    description: Storefront or CDP POSTs here the moment a checkout is abandoned, carrying cart_id, email, value_usd, items_count and last_action_at, so recovery starts while intent is still warm.
    key: "{{ secret('CART_WEBHOOK_KEY') }}"
  - id: hourly_cart_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Hourly net that re-reads open carts for anything the webhook missed, stated as disabled until an operator reviews the thresholds and switches it on.
    cron: "0 * * * *"
    disabled: true

inputs:
  - id: min_value
    type: FLOAT
    defaults: 25.0
    description: Cart value in US dollars an abandoned cart must reach before a recovery message goes out, carts under this floor are left alone.
  - id: cooldown_hours
    type: INT
    defaults: 24
    description: Hours that must pass after the last recovery contact before the same shopper may be contacted again.

tasks:
  # --- 1. cart workspace ---
  - id: cart_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the cart fixture written by the shell step is the exact file the qualification script reads.
    tasks:
      # --- 2. cart fixture ---
      - id: write_carts
        type: io.kestra.plugin.scripts.shell.Commands
        description: Writes carts.json from a heredoc of five open carts with contact timestamps generated relative to now, two worth recovering, one under the value floor, one still inside its cooldown and one already recovered.
        commands:
          - |
            set -u
            cat > carts.json <<CARTS_EOF
            {
              "carts": [
                {"cart_id": "cart-7841", "email": "avery.norton@example.com", "value_usd": 148.5, "items_count": 3, "last_action_at": "$(date -u -d '-4 hours' +%Y-%m-%dT%H:%M:%SZ)", "contacted_at": "$(date -u -d '-96 hours' +%Y-%m-%dT%H:%M:%SZ)", "status": "open"},
                {"cart_id": "cart-7855", "email": "dinesh.rao@example.com", "value_usd": 62.0, "items_count": 1, "last_action_at": "$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)", "contacted_at": "$(date -u -d '-30 hours' +%Y-%m-%dT%H:%M:%SZ)", "status": "open"},
                {"cart_id": "cart-7862", "email": "lena.ortiz@example.com", "value_usd": 18.25, "items_count": 2, "last_action_at": "$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)", "contacted_at": null, "status": "open"},
                {"cart_id": "cart-7874", "email": "marco.silva@example.com", "value_usd": 210.0, "items_count": 5, "last_action_at": "$(date -u -d '-2 hours' +%Y-%m-%dT%H:%M:%SZ)", "contacted_at": "$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)", "status": "open"},
                {"cart_id": "cart-7888", "email": "priya.desai@example.com", "value_usd": 95.0, "items_count": 2, "last_action_at": "$(date -u -d '-20 hours' +%Y-%m-%dT%H:%M:%SZ)", "contacted_at": "$(date -u -d '-50 hours' +%Y-%m-%dT%H:%M:%SZ)", "status": "recovered"}
              ]
            }
            CARTS_EOF
            echo "wrote $(wc -c < carts.json) bytes of cart data"

      # --- 3. recovery qualification ---
      - id: assess_carts
        type: io.kestra.plugin.scripts.python.Script
        description: Reads carts.json with the json module, drops recovered carts, applies the min_value floor and the contact cooldown, and emits verdict, recovery_count, carts and revenue_at_risk_usd through the outputs protocol.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          MIN_VALUE: "{{ inputs.min_value }}"
          COOLDOWN_HOURS: "{{ inputs.cooldown_hours }}"
        script: |
          import json
          import os
          from datetime import datetime, timezone

          CART_FILE = "carts.json"
          REQUIRED = ("cart_id", "email", "value_usd", "items_count", "last_action_at")


          def as_float(value, fallback=0.0):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return fallback


          def as_int(value, fallback=0):
              try:
                  return int(float(value))
              except (TypeError, ValueError):
                  return fallback


          def parse_stamp(value):
              if value in (None, ""):
                  return None
              text = str(value).strip().replace("Z", "+00:00")
              try:
                  stamp = datetime.fromisoformat(text)
              except ValueError:
                  return None
              if stamp.tzinfo is None:
                  stamp = stamp.replace(tzinfo=timezone.utc)
              return stamp.astimezone(timezone.utc)


          def load_rows(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None
              try:
                  with open(path, "r", encoding="utf-8") as handle:
                      document = json.load(handle)
              except ValueError:
                  return None
              if isinstance(document, dict):
                  document = document.get("carts")
              if not isinstance(document, list):
                  return None
              return document


          min_value = as_float(os.environ.get("MIN_VALUE"), 25.0)
          cooldown = as_float(os.environ.get("COOLDOWN_HOURS"), 24.0)
          now = datetime.now(timezone.utc)
          rows = load_rows(CART_FILE)

          records = []
          usable = 0
          skipped_under_value = 0
          skipped_cooldown = 0
          skipped_recovered = 0
          skipped_malformed = 0

          for row in rows or []:
              if not isinstance(row, dict):
                  skipped_malformed += 1
                  continue
              cart_id = str(row.get("cart_id") or "").strip()
              email = str(row.get("email") or "").strip()
              last_action = str(row.get("last_action_at") or "").strip()
              if not cart_id or "@" not in email or not last_action:
                  skipped_malformed += 1
                  continue
              usable += 1
              value = round(as_float(row.get("value_usd"), 0.0), 2)
              items = as_int(row.get("items_count"), 0)
              status = str(row.get("status") or "open").strip().lower()
              if status == "recovered":
                  skipped_recovered += 1
                  continue
              if value < min_value:
                  skipped_under_value += 1
                  continue
              contacted = parse_stamp(row.get("contacted_at"))
              hours_since = None
              if contacted is not None:
                  hours_since = round((now - contacted).total_seconds() / 3600.0, 1)
                  if (now - contacted).total_seconds() / 3600.0 < cooldown:
                      skipped_cooldown += 1
                      continue
              records.append({
                  "cart_id": cart_id,
                  "email": email,
                  "value_usd": value,
                  "items_count": items,
                  "last_action_at": last_action,
                  "hours_since_contact": hours_since,
              })

          if rows is None or usable == 0:
              verdict = "NO_DATA"
              records = []
          else:
              records.sort(key=lambda entry: (-entry["value_usd"], entry["cart_id"]))
              verdict = "RECOVERY_REQUIRED" if records else "ALL_CLEAR"

          recovery_count = len(records)
          revenue_at_risk = float(round(sum(entry["value_usd"] for entry in records), 2))

          print("checked=%d qualified=%d under_value=%d cooldown=%d recovered=%d malformed=%d verdict=%s" % (
              usable, recovery_count, skipped_under_value, skipped_cooldown,
              skipped_recovered, skipped_malformed, verdict))
          print("::" + json.dumps({"outputs": {
              "verdict": verdict,
              "recovery_count": recovery_count,
              "carts": records,
              "revenue_at_risk_usd": revenue_at_risk,
          }}) + "::")

  # --- 4. recovery gate and escalation ---
  - id: recovery_gate
    type: io.kestra.plugin.core.flow.If
    description: Branches on the recovery count so qualifying carts escalate to API messages, recovery emails and one Slack summary, while a cart book with nothing to recover is recorded without waking anyone.
    condition: "{{ outputs.assess_carts.vars.recovery_count > 0 }}"
    then:
      # --- 5. contact every qualifier ---
      - id: notify_each_shopper
        type: io.kestra.plugin.core.flow.Loop
        description: Walks the qualifying carts one at a time so each shopper gets their own cart reference instead of one crowded digest.
        values: "{{ outputs.assess_carts.vars.carts }}"
        concurrencyLimit: 1
        tasks:
          - id: post_recovery_message
            type: io.kestra.plugin.core.http.Request
            description: POSTs the recovery-message payload for the current cart to the commerce API with a bearer token, so the in-app and push message fires while intent is warm.
            method: POST
            uri: "https://api.commerce.example.com/v1/carts/{{ item.value.cart_id }}/recovery-message"
            headers:
              Authorization: "Bearer {{ secret('COMMERCE_API_TOKEN') }}"
              Content-Type: application/json
            body: |
              {"cart_id": "{{ item.value.cart_id }}", "email": "{{ item.value.email }}", "value_usd": {{ item.value.value_usd }}, "items_count": {{ item.value.items_count }}, "last_action_at": "{{ item.value.last_action_at }}", "template": "abandoned_cart_24h", "source": "{{ flow.id }}"}
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT10S
              maxAttempts: 3

          - id: send_recovery_email
            type: io.kestra.plugin.email.MailSend
            description: Sends the same shopper the recovery email as the alternative touchpoint, for accounts that muted in-app and push messages.
            from: "{{ secret('SMTP_FROM') }}"
            to: "{{ item.value.email }}"
            host: "{{ secret('SMTP_HOST') }}"
            username: "{{ secret('SMTP_USERNAME') }}"
            password: "{{ secret('SMTP_PASSWORD') }}"
            port: 465
            subject: "Your cart of {{ item.value.items_count }} item(s) is still waiting - USD {{ item.value.value_usd }}"
            htmlTextContent: |
              <p>Hi,</p>
              <p>You left <strong>{{ item.value.items_count }}</strong> item(s) in your
              cart worth <strong>USD {{ item.value.value_usd }}</strong>, and the items
              are still reserved for you. Your cart last moved at
              <strong>{{ item.value.last_action_at }}</strong>.</p>
              <p>Finish checkout before the stock moves on, or reply to this message
              if something got in the way.</p>
              <p>Reference {{ item.value.cart_id }} - execution {{ execution.id }}</p>

      # --- 6. channel summary ---
      - id: alert_recovery_summary
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Posts one summary to the growth channel that leads with the recovery count and the revenue at risk, then names every cart that was worked.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "Cart recovery - {{ outputs.assess_carts.vars.recovery_count }} cart(s) worked, revenue at risk USD {{ outputs.assess_carts.vars.revenue_at_risk_usd }}, verdict {{ outputs.assess_carts.vars.verdict }}. {% for c in outputs.assess_carts.vars.carts %}{{ c.cart_id }} at USD {{ c.value_usd }} for {{ c.email }} ({{ c.items_count }} item(s)). {% endfor %}Floor USD {{ inputs.min_value }}, cooldown {{ inputs.cooldown_hours }}h. Execution {{ execution.id }}."}
    else:
      # --- 7. nothing to recover ---
      - id: log_nothing_to_recover
        type: io.kestra.plugin.core.log.Log
        description: Records the quiet outcome in execution history so a run with nothing to recover still leaves evidence that the cart book was checked.
        message: "No cart qualifies for recovery - verdict {{ outputs.assess_carts.vars.verdict }}, recovery_count {{ outputs.assess_carts.vars.recovery_count }}, revenue at risk USD {{ outputs.assess_carts.vars.revenue_at_risk_usd }}."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    description: RECOVERY_REQUIRED when at least one cart qualifies, ALL_CLEAR when every open cart was filtered out, NO_DATA when the fixture carries no usable rows.
    value: "{{ outputs.assess_carts.vars.verdict }}"
  - id: recovery_count
    type: INT
    description: Number of carts that passed the value floor and the contact cooldown, zero when nothing qualifies.
    value: "{{ outputs.assess_carts.vars.recovery_count }}"
  - id: carts
    type: ARRAY
    description: 'Recovery queue as objects, for example [{"cart_id": "cart-7841", "email": "avery.norton@example.com", "value_usd": 148.5, "items_count": 3, "last_action_at": "2026-01-01T09:00:00Z", "hours_since_contact": 96.0}].'
    value: "{{ outputs.assess_carts.vars.carts | toJson }}"
  - id: revenue_at_risk_usd
    type: FLOAT
    description: Total US dollar value of the qualifying carts, the revenue this run set out to recover, 0.0 when nothing qualifies.
    value: "{{ outputs.assess_carts.vars.revenue_at_risk_usd }}"

extend:
  title: Recover Abandoned Carts Before Shoppers Change Their Minds
  metaTitle: Abandoned Cart Recovery With Value and Cooldown Gates
  shortDescription: Qualify abandoned carts by value floor and contact cooldown, push a recovery message and email each qualifier, then summarize the revenue at risk on Slack.
  metaDescription: Filter abandoned carts by value floor and contact cooldown, push one recovery message and email per qualifier, then post the revenue at risk to Slack.
  description: |
    An abandoned cart is a shopper who was one click from paying, and every hour without a nudge makes that shopper a little colder. This blueprint keeps the recovery loop disciplined, so the store contacts the carts that are worth contacting and stays quiet on the ones that are not.

    ## How it works

    1. `cart_abandoned` (`io.kestra.plugin.core.trigger.Webhook`, keyed with the `CART_WEBHOOK_KEY` secret) accepts the storefront or CDP event carrying `cart_id`, `email`, `value_usd`, `items_count` and `last_action_at`, so recovery starts on the spot. `hourly_cart_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 * * * *`) is the hourly net for anything the webhook missed and ships `disabled: true` until an operator turns it on.
    2. `cart_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared filesystem so the fixture the shell step writes is the file the qualification script reads.
    3. `write_carts` (`io.kestra.plugin.scripts.shell.Commands`) drops `carts.json` through a heredoc of five carts whose `contacted_at` stamps come from `date -u -d` relative to now: two worth recovering, one under the value floor, one contacted three hours ago and one already marked `recovered`.
    4. `assess_carts` (`io.kestra.plugin.scripts.python.Script`) parses the file with `json`, drops malformed rows and recovered carts, compares `value_usd` against `min_value`, and skips any cart contacted within `cooldown_hours`. Qualifiers are sorted by value and printed as a single `::{"outputs": ...}::` line carrying `verdict`, `recovery_count`, `carts` and `revenue_at_risk_usd`, while an unreadable or empty fixture reports `NO_DATA`.
    5. `recovery_gate` (`io.kestra.plugin.core.flow.If`) branches on `recovery_count > 0`.
    6. Above zero, `notify_each_shopper` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) walks the qualifiers. `post_recovery_message` (`io.kestra.plugin.core.http.Request`) POSTs `https://api.commerce.example.com/v1/carts/{cart_id}/recovery-message` with a `Bearer` token from the `COMMERCE_API_TOKEN` secret and retries transient failures, and `send_recovery_email` (`io.kestra.plugin.email.MailSend`) sends that shopper the recovery email as the alternative touchpoint for accounts that muted messaging. `alert_recovery_summary` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) then posts the count, the revenue at risk and every cart to the channel. At zero, `log_nothing_to_recover` (`io.kestra.plugin.core.log.Log`) records the quiet outcome.
    7. The `errors` block posts to Slack whenever the fixture, the calculation or a notifier breaks, because a crashed recovery run must never look like a calm cart book.

    ## What you get

    - `verdict` (STRING): `RECOVERY_REQUIRED` when at least one cart qualifies, `ALL_CLEAR` when every cart was filtered out, `NO_DATA` when the fixture carries no usable rows.
    - `recovery_count` (INT): carts that cleared both gates, zero on a quiet cart book.
    - `carts` (ARRAY): one object per qualifier with `cart_id`, `email`, `value_usd`, `items_count`, `last_action_at` and `hours_since_contact`, sorted by value.
    - `revenue_at_risk_usd` (FLOAT): the dollar value this run set out to recover, `0.0` when nothing qualifies.
    - One API recovery message and one recovery email per qualifier, one Slack summary when there is something to recover, a log line when there is not, and a failure alert on any break.

    ## Who it's for

    - Growth and lifecycle marketers who own recovery revenue and refuse to spam shoppers who were contacted an hour ago.
    - Ecommerce operators who want the value floor enforced automatically instead of by whoever schedules the campaign.
    - Analytics teams that need the recovered count and the revenue at risk as typed numbers, not as lines in a chat thread.

    ## Why orchestrate this with Kestra

    A cron job plus a spreadsheet cannot tell the difference between a cart worth chasing and one that was already emailed ten minutes ago, and it cannot retry a flaky messaging API on its own. Kestra gives the event a keyed webhook and a disabled hourly sweep, a python qualification step that owns the value floor and the cooldown, a loop that turns one parse into one message and one email per qualifier, and a branch that keeps a quiet cart book from waking the channel. The verdict, the count, the queue and the revenue at risk are typed outputs, so a dashboard or a downstream campaign tool can read the state without scraping logs, and the `errors` handler keeps a broken run visible.

    ## Prerequisites

    - Python 3 and a shell on the Kestra worker with GNU `date`, the calculation uses only `json`, `os` and `datetime`.
    - A commerce API that exposes a recovery-message endpoint and accepts a bearer token.
    - An SMTP relay reachable from the worker, with a sender address allowed to use it.
    - A Slack incoming webhook for the recovery summary and for failure alerts.
    - Your own abandoned-cart export in place of the heredoc fixture, keeping the same six fields.

    ### Secrets

    - `CART_WEBHOOK_KEY`: key segment guarding the webhook URL, anyone holding it can start a recovery run.
    - `COMMERCE_API_TOKEN`: bearer token the recovery-message endpoint accepts.
    - `SMTP_FROM`, `SMTP_HOST`, `SMTP_USERNAME`, `SMTP_PASSWORD`: relay and credentials used by `send_recovery_email`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the recovery summary and for failure alerts.

    ## Quick start

    1. Add the seven secrets to your namespace and import the flow.
    2. Run once with the default inputs. The bundled fixture puts cart-7841 at USD 148.5 and cart-7855 at USD 62.0 in the queue, so the run reports `verdict: RECOVERY_REQUIRED`, `recovery_count: 2` and `revenue_at_risk_usd: 210.5`, sends two API messages and two emails, then posts the Slack summary.
    3. Raise `min_value` above 148.5 to watch the same run fall back to `ALL_CLEAR` with `recovery_count: 0` and a log line instead of the Slack summary.
    4. Raise `cooldown_hours` above 30 to push cart-7855 out of the queue on the next run, proving the cooldown gate is what kept a second nudge from going out.
    5. Trigger `cart_abandoned` at `/api/v1/{tenant}/executions/webhook/{namespace}/cart-abandonment-recovery/{CART_WEBHOOK_KEY}`, then enable `hourly_cart_sweep` once the webhook covers every storefront.

    ## How to extend

    - Replace the heredoc with `io.kestra.plugin.jdbc.postgresql.Queries` against the cart table, or with `io.kestra.plugin.aws.s3.Upload` handing the queue to a warehouse, and keep the same python verdict.
    - Add a discount input so `post_recovery_message` carries a promo code only for carts above a second, higher value tier.
    - Send the email through a marketing platform with `io.kestra.plugin.core.http.Request` instead of `io.kestra.plugin.email.MailSend` when the sending service already owns suppression lists.
    - Split the loop by channel with `io.kestra.plugin.core.flow.Parallel` when push and email should fire at the same time instead of in lockstep.
    - Open a `io.kestra.plugin.github.issues.Create` ticket for any cart that failed both channels, so recovery failures are worked as a queue.

    ## Links

    - [Kestra workflow triggers](https://kestra.io/docs/workflow-triggers)
    - [Kestra email plugin](https://kestra.io/plugins/plugin-email)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra looping and conditions](https://kestra.io/docs/workflow-components)
  tags:
    - Business
  subTags:
    - ecommerce
    - cart-recovery
    - retention
    - lifecycle
  ee: false
  demo: false
