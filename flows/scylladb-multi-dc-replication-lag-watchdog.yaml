id: scylladb-multi-dc-replication-lag-watchdog
namespace: company.team
description: |
  Catch a ScyllaDB multi-datacenter cluster drifting out of sync before application
  reads turn inconsistent. This flow queries `system.peers` from one coordinator node
  on a schedule, checks whether the peer topology responded, and routes a Slack alert
  when the check cannot confirm the coordinator sees its peers, so a disconnected
  datacenter or a stalled gossip state does not go unnoticed between deploys.

triggers:
  - id: daily_replication_watchdog
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily multi-DC topology check. Shipped disabled; enable it once the ScyllaDB connection secrets are configured and a manual run has been verified against your cluster.
    cron: "0 0 * * *"
    disabled: true

inputs:
  - id: scylla_host
    type: STRING
    displayName: "ScyllaDB Node Host"
    defaults: "scylla"
    description: Contact point of one coordinator node. This is the node the check queries, not the whole cluster; it must be reachable from the Kestra Worker.

  - id: scylla_port
    type: INT
    displayName: "ScyllaDB CQL Port"
    defaults: 9042
    description: Native CQL port the contact point listens on, defaults to 9042.

  - id: local_dc
    type: STRING
    displayName: "Local Datacenter Name"
    defaults: "datacenter1"
    description: Datacenter name used by the driver's load-balancing policy. Must match the dc value in that node's cassandra-rackdc.properties.

  - id: scylla_username
    type: STRING
    displayName: "ScyllaDB Username"
    defaults: "scylla"
    description: Native CQL authentication username. Paired with the SCYLLA_PASSWORD secret; the driver requires both or neither.

  - id: max_schema_mismatches
    type: SELECT
    displayName: "Max Allowed Schema Mismatches"
    defaults: "0"
    values:
      - "0"
      - "1"
      - "5"
    description: Reserved tolerance for how many peers may report a schema_version different from the majority before that counts as degraded. Not yet consumed by classify_outcome below, which currently classifies on query reachability only - wire this threshold into a schema_version comparison if you extend the check (see "How to extend" in this blueprint's description).

tasks:
  - id: check_topology_peers
    type: io.kestra.plugin.cassandra.standard.Query
    description: Read every peer this coordinator currently knows about, with each peer's reported datacenter, schema version, host ID, and RPC address. allowFailure is set so an unreachable node produces a DEGRADED classification below instead of failing the whole execution.
    session:
      endpoints:
        - hostname: "{{ inputs.scylla_host }}"
          port: "{{ inputs.scylla_port }}"
      localDatacenter: "{{ inputs.local_dc }}"
      username: "{{ inputs.scylla_username }}"
      password: "{{ secret('SCYLLA_PASSWORD') }}"
    cql: "SELECT peer, data_center, schema_version, host_id, rpc_address FROM system.peers;"
    fetchType: FETCH
    allowFailure: true

  - id: classify_outcome
    type: io.kestra.plugin.core.debug.Return
    description: Reduce the peer query to a single HEALTHY or DEGRADED status. A missing rows output means check_topology_peers failed (connection refused, auth failure, timeout) and allowFailure swallowed it rather than stopping the execution.
    format: "{{ outputs.check_topology_peers.rows is defined ? 'HEALTHY' : 'DEGRADED' }}"

  - id: route_outcome
    type: io.kestra.plugin.core.flow.Switch
    description: Branch on the computed status so a healthy run only logs, and a degraded run pages Slack with what was being checked.
    value: "{{ outputs.classify_outcome.value }}"
    cases:
      HEALTHY:
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "ScyllaDB multi-DC node topology and schema versions are in sync."
      DEGRADED:
        - id: alert_degraded
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Alert on-call that the coordinator node could not confirm its peer topology, with enough detail to start triage without re-running the check by hand.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "ScyllaDB multi-DC watchdog DEGRADED: coordinator {{ inputs.scylla_host }} (datacenter {{ inputs.local_dc }}) did not return a peer topology on its system.peers check. This usually means the node is unreachable, authentication failed, or it cannot see the rest of the cluster. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_default
        type: io.kestra.plugin.core.log.Log
        message: "Completed ScyllaDB topology health check with status: {{ outputs.classify_outcome.value }}"

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the flow itself fails outside the handled DEGRADED path, for example a malformed CQL statement or a plugin error. The DEGRADED branch above is the expected failure path; this is the unexpected one.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "ScyllaDB multi-DC replication watchdog FAILED in execution {{ execution.id }} for coordinator {{ inputs.scylla_host }}. The topology check itself did not complete; investigate before trusting the last known status."
      }

outputs:
  - id: status
    type: STRING
    description: Final HEALTHY or DEGRADED classification for this run, ready for dashboards or a downstream flow.
    value: "{{ outputs.classify_outcome.value }}"

extend:
  title: "Monitor ScyllaDB Multi-DC Topology and Schema Version Parity"
  shortDescription: Query ScyllaDB's system.peers on a schedule to catch an unreachable datacenter or a stuck gossip state before it causes dirty reads, and alert Slack when the check cannot confirm the cluster is healthy.
  metaTitle: ScyllaDB Multi-DC Topology and Schema Parity Watchdog with Kestra
  metaDescription: "Periodically query ScyllaDB cluster topology and system tables to detect cross-DC schema version drift and dispatch alerts via Slack."
  description: |
    A multi-datacenter ScyllaDB or Cassandra cluster stays consistent only as long as every
    node can gossip with its peers and agrees on the current schema. When a cross-region link
    drops, a node partitions, or a schema change does not propagate everywhere, queries routed
    to the wrong replica return dirty or stale data - often with no error, because the cluster
    itself keeps answering reads from whatever it still has local. This blueprint turns a quick
    `system.peers` check into a scheduled, alerting watchdog so that kind of silent drift gets
    caught instead of discovered by a customer.

    ## How it works

    1. `daily_replication_watchdog` (`io.kestra.plugin.core.trigger.Schedule`) runs once a day. Shipped disabled so you can validate a manual run first.
    2. `check_topology_peers` (`io.kestra.plugin.cassandra.standard.Query`) opens a native CQL connection to one coordinator node and runs `SELECT peer, data_center, schema_version, host_id, rpc_address FROM system.peers`. `allowFailure: true` means a connection or auth failure does not abort the execution - it is instead treated as a signal by the next task.
    3. `classify_outcome` (`io.kestra.plugin.core.debug.Return`) reduces the result to `HEALTHY` when `check_topology_peers` produced a `rows` output at all, or `DEGRADED` when it did not (the query failed and was swallowed by `allowFailure`).
    4. `route_outcome` (`io.kestra.plugin.core.flow.Switch`) branches on that status: `HEALTHY` just logs, `DEGRADED` posts a Slack alert naming the coordinator and datacenter that could not be checked. Any other value falls through to a default log line.
    5. The `errors` block catches failures outside that handled path - a malformed statement, a plugin error - and alerts separately from the expected DEGRADED branch.

    ## What you get

    - A standing, scheduled check of ScyllaDB cross-DC peer visibility using the cluster's own `system.peers` table.
    - A clear two-state classification (`HEALTHY` / `DEGRADED`) instead of a raw query dump someone has to interpret at 2am.
    - A Slack alert that names the exact coordinator and datacenter that failed the check, and a separate alert if the flow itself breaks.
    - A `status` output other flows or dashboards can poll without re-running the query.

    ## Who it's for

    - Platform and SRE teams operating a multi-region ScyllaDB or Cassandra deployment who need an early signal before replication drift becomes a customer-visible inconsistency.
    - Teams migrating from a single-DC to a multi-DC topology who want a guardrail in place from day one.
    - Anyone who has debugged a "why did this region return old data" ticket and wished something had paged them first.

    ## Why orchestrate this with Kestra

    `cqlsh` or a cron'd shell script can run the same query, but neither can branch on the result, alert only on the unhealthy case, retry or isolate failures from the check logic, or leave an execution history you can audit after an incident. Kestra supplies the schedule, the pass/fail branching, a dedicated failure channel separate from the alerting path, and a queryable record of every run - and because it is a flow, the same check can later fan out to PagerDuty or feed a dashboard by adding one task.

    ## Prerequisites

    - A reachable ScyllaDB (or Cassandra) node on its native CQL port, default `9042`.
    - For a genuine multi-DC test, at least two nodes in different datacenters joined via `GossipingPropertyFileSnitch` and matching `cassandra-rackdc.properties` `dc=`/`rack=` values - a single node will return an empty (not failing) `system.peers` result, which this check reports as `HEALTHY` since it is still a successful query. Treat a single-node dev cluster as a wiring test for this flow, not a validation of its alerting logic.
    - Quick local single-node smoke test: `docker run --name scylla -d scylladb/scylla --smp 1` (add `-p 9042:9042` to reach it from the Docker host, or put it on the same Docker network as the Kestra Worker and use the container name as `scylla_host`).
    - A Slack incoming webhook for alerts.

    ### Secrets

    - `SCYLLA_PASSWORD`: native CQL password for the user named in `scylla_username`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by both the `DEGRADED` branch and the `errors` block.

    ### Inputs

    - `scylla_host` (STRING, default `scylla`): coordinator contact point hostname.
    - `scylla_port` (INT, default `9042`): native CQL port.
    - `local_dc` (STRING, default `datacenter1`): local datacenter name for the driver's load-balancing policy.
    - `scylla_username` (STRING, default `scylla`): CQL username, paired with `SCYLLA_PASSWORD`.
    - `max_schema_mismatches` (SELECT: `0`, `1`, `5`; default `0`): reserved tolerance for a future schema-version comparison; not yet wired into `classify_outcome`.

    ## Quick start

    1. Start or point at a ScyllaDB cluster and add the `SCYLLA_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Set `scylla_host` and `local_dc` to your coordinator node and its datacenter.
    3. Run the flow manually once and confirm `status` reads `HEALTHY` against a reachable node.
    4. Enable `daily_replication_watchdog` once the manual run is verified.

    ## How to extend

    - Wire `max_schema_mismatches` into `classify_outcome` by comparing the distinct `schema_version` values across `outputs.check_topology_peers.rows` instead of only checking that the query returned.
    - Loop the check over every datacenter's coordinator with a `ForEach`, so one down datacenter does not depend on which node happens to be queried.
    - Replace the `system.peers` reachability check with `nodetool status` output (via a shell task) if you need actual per-node UP/DOWN state, since CQL system tables do not expose node liveness directly.
    - Route the `DEGRADED` branch to PagerDuty or an incident tool alongside Slack by adding a second notification task.

    ## Links

    - [plugin-cassandra documentation](https://kestra.io/plugins/plugin-cassandra)
    - [ScyllaDB system.peers / system.local reference](https://github.com/scylladb/scylladb/blob/master/docs/dev/system_keyspace.md)
    - [Creating a multi-datacenter ScyllaDB cluster](https://docs.scylladb.com/manual/stable/operating-scylla/procedures/cluster-management/create-cluster-multidc.html)
    - [Slack plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
