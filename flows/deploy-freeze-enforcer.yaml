id: deploy-freeze-enforcer
namespace: company.team
description: |
  Blocks production deployments while a declared freeze window is active, whether the
  window covers a holiday, an incident, or a major launch. A webhook receives pull
  request opened, synchronize, and labeled events alongside deployment events, a Python
  task parses the window against the current UTC time, and a frozen verdict escalates
  to a GitHub tracking issue and a Slack emergency-approval request while any failure
  is raised in the ops channel. Each run exposes the verdict, the window, and the days
  until the next opening as outputs a deploy pipeline can branch on.

triggers:
  - id: pull_request_and_deployment_events
    type: io.kestra.plugin.core.trigger.Webhook
    description: GitHub POSTs here when a pull request opens, pushes new commits, or gains a label, and when a deployment event lands, so every change meets the freeze check.
    key: "{{ secret('DEPLOY_FREEZE_WEBHOOK_KEY') }}"

  - id: weekly_freeze_preflight
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly pre-flight that recomputes the upcoming freeze windows for the calendar digest, shipped disabled until it is switched on after a manual run.
    cron: "0 6 * * 1"
    disabled: true

inputs:
  - id: freeze_start
    type: STRING
    defaults: "2026-12-24"
    description: Opening of the freeze window as an ISO date or timestamp in UTC, for example 2026-12-24T00:00:00Z.

  - id: freeze_end
    type: STRING
    defaults: "2026-12-26"
    description: Close of the freeze window as an ISO date or timestamp in UTC, where a bare date closes at 23:59:59Z.

  - id: repo
    type: STRING
    defaults: kestra-io/kestra
    description: Repository the freeze protects in owner/name form, which is where the tracking issue is opened.

variables:
  event_action: "{{ trigger is not defined ? '' : ((trigger.body ?? {}).action ?? '') }}"
  event_label: "{{ trigger is not defined ? '' : (((trigger.body ?? {}).label ?? {}).name ?? '') }}"

tasks:
  # --- 1. freeze window verdict ---
  - id: evaluate_freeze_window
    type: io.kestra.plugin.scripts.python.Script
    description: Parse the declared freeze window against the current UTC time and publish is_frozen, the days until the next opening, and the reason on the repo-standard outputs line.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    script: |
      import json
      from datetime import date, datetime, time, timedelta, timezone

      RAW_START = "{{ inputs.freeze_start }}".strip()
      RAW_END = "{{ inputs.freeze_end }}".strip()
      REPO = "{{ inputs.repo }}".strip()


      def parse_stamp(value, end_of_day=False):
          text = str(value or "").strip()
          if not text:
              return None
          if len(text) == 10 and text[4] == "-" and text[7] == "-":
              try:
                  day = date.fromisoformat(text)
              except ValueError:
                  return None
              moment = time(23, 59, 59) if end_of_day else time(0, 0)
              return datetime.combine(day, moment, tzinfo=timezone.utc)
          if text[-1:] in ("Z", "z"):
              text = text[:-1] + "+00:00"
          try:
              stamp = datetime.fromisoformat(text)
          except ValueError:
              return None
          if stamp.tzinfo is None:
              stamp = stamp.replace(tzinfo=timezone.utc)
          return stamp.astimezone(timezone.utc)


      def describe(stamp):
          return stamp.strftime("%Y-%m-%dT%H:%M:%SZ")


      def next_opening(stamp, now):
          candidate = stamp
          for _ in range(8):
              if candidate.date() > now.date():
                  return candidate
              try:
                  candidate = candidate.replace(year=candidate.year + 1)
              except ValueError:
                  candidate = candidate + timedelta(days=365)
          return candidate


      start = parse_stamp(RAW_START)
      end = parse_stamp(RAW_END, end_of_day=True)
      now = datetime.now(timezone.utc)

      if start is None or end is None or end < start:
          payload = {
              "verdict": "INVALID_WINDOW",
              "is_frozen": False,
              "window": "%s -> %s" % (RAW_START or "unset", RAW_END or "unset"),
              "days_until": 0,
              "reason": "the declared range is not a valid ISO 8601 freeze window, so nothing is frozen",
          }
      elif start <= now <= end:
          payload = {
              "verdict": "BLOCKED",
              "is_frozen": True,
              "window": "%s -> %s" % (describe(start), describe(end)),
              "days_until": 0,
              "reason": "current UTC time %s falls inside the window protecting %s" % (describe(now), REPO),
          }
      else:
          opening = start if now < start else next_opening(start, now)
          payload = {
              "verdict": "ALLOWED",
              "is_frozen": False,
              "window": "%s -> %s" % (describe(start), describe(end)),
              "days_until": max(0, (opening.date() - now.date()).days),
              "reason": "no active freeze for %s, the window opens again %s UTC" % (REPO, describe(opening)),
          }

      print("::" + json.dumps({"outputs": payload}, ensure_ascii=True) + "::")

  # --- 2. freeze gate ---
  - id: freeze_gate
    type: io.kestra.plugin.core.flow.If
    description: Branch on the is_frozen verdict so a frozen window escalates to a ticket and a channel request while a clear window is recorded as allowed.
    condition: "{{ outputs.evaluate_freeze_window.vars.is_frozen }}"
    then:
      - id: file_freeze_issue
        type: io.kestra.plugin.github.issues.Create
        description: Open a tracking issue in the protected repository whose title carries the active window, so the block shows up in the backlog engineers already watch.
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.repo }}"
        title: "Deploy freeze active for {{ inputs.repo }} window {{ outputs.evaluate_freeze_window.vars.window }}"
        labels:
          - deploy-freeze
          - change-freeze
        body: |
          ## Deploy freeze is active

          - Repository `{{ inputs.repo }}`
          - Window `{{ outputs.evaluate_freeze_window.vars.window }}`
          - Verdict `{{ outputs.evaluate_freeze_window.vars.verdict }}`
          - Reason {{ outputs.evaluate_freeze_window.vars.reason }}
          - Days until the next opening `{{ outputs.evaluate_freeze_window.vars.days_until }}`

          Deployments are held until this window closes. Apply the `emergency-approval`
          label to the pull request to take the allow path, or record an approved
          exception in this issue before the change ships.

          Flow `{{ flow.id }}`, execution `{{ execution.id }}`.

      - id: request_emergency_approval
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Ask the ops channel to apply the emergency-approval label when a hotfix really has to ship while the freeze holds.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "DEPLOY FREEZE active for {{ inputs.repo }}, window {{ outputs.evaluate_freeze_window.vars.window }}. Production deploys are blocked. Apply the emergency-approval label to the pull request to take the allow path. Verdict {{ outputs.evaluate_freeze_window.vars.verdict }}, execution {{ execution.id }}."}

      - id: route_event_action
        type: io.kestra.plugin.core.flow.ExclusiveChoice
        description: Evaluate the incoming event action exactly once, so the emergency-approval label takes the allow path while opened, synchronize, and unrelated label events stay blocked.
        choices:
          - id: emergency_approval_labeled
            condition: "{{ vars.event_action == 'labeled' and vars.event_label == 'emergency-approval' }}"
            tasks:
              - id: log_emergency_allow
                type: io.kestra.plugin.core.log.Log
                description: Record the allow path taken by the emergency-approval label while the freeze still holds.
                message: "Allow path for {{ inputs.repo }} - emergency-approval label present during window {{ outputs.evaluate_freeze_window.vars.window }}, the deploy ships under exception, execution {{ execution.id }}."

          - id: pull_request_opened
            condition: "{{ vars.event_action == 'opened' }}"
            tasks:
              - id: log_pull_request_opened
                type: io.kestra.plugin.core.log.Log
                description: Record that a pull request opened inside the freeze and is held until the window closes.
                message: "Blocked for {{ inputs.repo }} - pull request opened during window {{ outputs.evaluate_freeze_window.vars.window }}, hold until the freeze lifts, {{ outputs.evaluate_freeze_window.vars.days_until }} day(s) to the next opening."

          - id: pull_request_synchronize
            condition: "{{ vars.event_action == 'synchronize' }}"
            tasks:
              - id: log_pull_request_synchronize
                type: io.kestra.plugin.core.log.Log
                description: Record that new commits landed on a pull request inside the freeze, so the push is held too.
                message: "Blocked for {{ inputs.repo }} - new commits pushed during window {{ outputs.evaluate_freeze_window.vars.window }}, the pull request stays frozen, execution {{ execution.id }}."

          - id: other_label_applied
            condition: "{{ vars.event_action == 'labeled' }}"
            tasks:
              - id: log_label_not_exempt
                type: io.kestra.plugin.core.log.Log
                description: Record that a label other than emergency-approval was applied, which does not lift the freeze.
                message: "Blocked for {{ inputs.repo }} - label {{ vars.event_label }} applied during window {{ outputs.evaluate_freeze_window.vars.window }}, only emergency-approval takes the allow path."

        defaults:
          - id: log_preflight_digest
            type: io.kestra.plugin.core.log.Log
            description: Log the pre-flight digest line for deployment events and the weekly schedule, which carry no pull request action.
            message: "Freeze pre-flight for {{ inputs.repo }} - window {{ outputs.evaluate_freeze_window.vars.window }}, verdict {{ outputs.evaluate_freeze_window.vars.verdict }}, {{ outputs.evaluate_freeze_window.vars.days_until }} day(s) until the next opening."

    else:
      - id: log_deploy_allowed
        type: io.kestra.plugin.core.log.Log
        description: Record the allow verdict so a clear window still leaves evidence that the gate ran.
        message: "Deploy allowed for {{ inputs.repo }} - no freeze window covers the current UTC time, verdict {{ outputs.evaluate_freeze_window.vars.verdict }}, {{ outputs.evaluate_freeze_window.vars.days_until }} day(s) until the next window opens."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution id, because a gate that dies silently reads as a clear window.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: deploy freeze enforcement for {{ inputs.repo }} in flow {{ flow.id }}, execution {{ execution.id }}. No verdict was produced, verify the window inputs, GITHUB_TOKEN, and the webhook trigger key."}

outputs:
  - id: verdict
    type: STRING
    description: BLOCKED when the current UTC time sits inside the window, ALLOWED when it does not, INVALID_WINDOW when the declared range cannot be parsed.
    value: "{{ outputs.evaluate_freeze_window.vars.verdict }}"

  - id: is_frozen
    type: BOOL
    description: True only when the declared freeze window covers the current UTC time, which is the value the gate branches on.
    value: "{{ outputs.evaluate_freeze_window.vars.is_frozen }}"

  - id: window
    type: STRING
    description: The normalized freeze window as an open and close timestamp in UTC, echoed back raw when the declared range is invalid.
    value: "{{ outputs.evaluate_freeze_window.vars.window }}"

  - id: days_until
    type: INT
    description: Whole calendar days from now until the window next opens, zero while the freeze is active or the range is invalid.
    value: "{{ outputs.evaluate_freeze_window.vars.days_until }}"

extend:
  title: Hold Production Deploys While a Freeze Window Is Active
  metaTitle: Deploy Freeze Enforcement for Release Windows
  shortDescription: Parses a freeze window against the current UTC time, blocks frozen deploys with a GitHub issue and a Slack approval request, and reports the next opening.
  metaDescription: Holds production deploys during declared freeze windows, opens a GitHub issue, asks Slack for an emergency-approval label, and reports the next opening.
  description: |
    Release freezes are usually written down in a calendar nobody consults at the
    moment a deploy is queued. The window exists, the change still ships, and the
    incident the freeze was meant to prevent happens anyway. This blueprint turns
    the written window into a gate. A webhook receives pull request opened,
    synchronize, and labeled events plus deployment events, a Python task parses
    the declared window against the current UTC time, and a frozen verdict files a
    tracking issue, asks the channel for an emergency-approval label, and records
    which event action arrived. Any failure escalates to the ops channel, and every
    run publishes the verdict, the window, and the days until the next opening as
    outputs a deploy pipeline can read.

    ## How it works

    1. `pull_request_and_deployment_events` (`io.kestra.plugin.core.trigger.Webhook`, keyed with the `DEPLOY_FREEZE_WEBHOOK_KEY` secret) starts a run when a pull request opens, pushes new commits, gains a label, or when a deployment event lands. `weekly_freeze_preflight` (`io.kestra.plugin.core.trigger.Schedule`, `0 6 * * 1`) ships with `disabled: true` and recomputes the upcoming windows for the calendar digest once you enable it.
    2. `evaluate_freeze_window` (`io.kestra.plugin.scripts.python.Script` on `python:3.11-slim`) reads the three inputs, accepts ISO dates as well as ISO timestamps, treats a bare end date as 23:59:59Z, and compares the window with the current UTC time. A bare range is invalid and yields `INVALID_WINDOW` with `is_frozen` false, an elapsed window rolls forward a year to report the next opening, and the verdict is printed as a single `::{"outputs": ...}::` line.
    3. `freeze_gate` (`io.kestra.plugin.core.flow.If`) branches on `is_frozen`.
    4. Inside the frozen branch, `file_freeze_issue` (`io.kestra.plugin.github.issues.Create`) opens a `deploy-freeze` and `change-freeze` labeled issue whose title carries the window, and `request_emergency_approval` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) asks the channel to apply the `emergency-approval` label.
    5. `route_event_action` (`io.kestra.plugin.core.flow.ExclusiveChoice`) then evaluates the event action once. The labeled case with `emergency-approval` logs the allow path, `opened` and `synchronize` log why the change is held, any other label logs that it does not lift the freeze, and the default branch prints the pre-flight digest line for deployment events and the schedule.
    6. When no window covers the current time, `log_deploy_allowed` records the allow verdict, leaving proof the gate actually ran.
    7. The flow level `errors` handler (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) reports any failure with the execution id, because a gate that dies silently is indistinguishable from a clear window.

    ## What you get

    - A hard block on deploys for holidays, incidents, and launches, driven by the window you declare instead of by someone remembering the calendar.
    - One labeled GitHub issue per frozen run whose title carries the exact window, so the block is assignable work rather than a chat thread.
    - A Slack request naming the `emergency-approval` label, so the bypass is a reviewed label instead of a verbal exception.
    - An audit line per event action, distinguishing emergency approvals, fresh pull requests, new commits, unrelated labels, and the weekly pre-flight digest.
    - Four flow outputs (`verdict`, `is_frozen`, `window`, `days_until`) that a deploy pipeline, dashboard, or downstream subflow can branch on directly.

    ## Who it's for

    - Platform and release engineering teams that declare change freezes but have no gate enforcing them.
    - SRE groups that need a documented exception path for hotfixes during an incident window.
    - Product and infrastructure teams coordinating holiday freezes across several repositories.

    ## Why orchestrate this with Kestra

    A calendar entry cannot open a ticket, ask for an approval label, or tell a deploy pipeline why it was stopped. Kestra gives the freeze a webhook trigger, a conditional gate with an exclusive branch over the event action, real GitHub and Slack tasks, a failure path that pages instead of hiding, and typed outputs another flow can require before a deploy proceeds.

    ## Prerequisites

    - A Kestra instance with the GitHub and Slack plugins available.
    - A repository that allows issues, in the `repo` input.
    - A GitHub token that can open issues in that repository.
    - A webhook registration pointing GitHub pull request and deployment events at the trigger URL.
    - An ISO date or timestamp pair for the window you want to enforce.

    ### Secrets

    - `DEPLOY_FREEZE_WEBHOOK_KEY`: Key that authenticates the webhook trigger.
    - `GITHUB_TOKEN`: GitHub token used by the issue creation task.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the approval request and failure alerts.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `freeze_start`, `freeze_end`, and `repo` to the window you are enforcing and the repository it protects.
    3. Run the flow manually and read the outputs, expect `BLOCKED` with `is_frozen` true when the window covers now, `ALLOWED` with a positive `days_until` before it opens, and `INVALID_WINDOW` for a malformed pair.
    4. Point the GitHub webhook at the `pull_request_and_deployment_events` trigger URL, then enable `weekly_freeze_preflight` if you also want the Monday digest.

    ## How to extend

    - Chain this flow as a subflow in the deploy pipeline and block the release on `verdict` or `is_frozen`.
    - Maintain several windows by looping over a calendar file with `io.kestra.plugin.core.flow.ForEach` and taking the union of the ranges.
    - Add an `io.kestra.plugin.core.flow.Sleep` plus a re-check before the issue is filed, so a one minute window never raises a ticket.
    - Replace the Slack webhook with a PagerDuty or email task for incident freezes, or mirror the verdict to a dashboard with `io.kestra.plugin.core.http.Request`.
    - Extend the exclusive branch with a `closed` case that logs the release resuming when the window lapses.

    ## Links

    - Kestra triggers: https://kestra.io/docs/concepts/triggers
    - GitHub pull request webhook payload: https://docs.github.com/en/webhooks/webhook-events-and-payloads#pull_request
    - Kestra GitHub plugin: https://kestra.io/plugins/github
    - Kestra Slack notification plugin: https://kestra.io/plugins/notifications-slack
  tags:
    - Infrastructure
  subTags:
    - deployment
    - change-management
    - release-management
    - github
  ee: false
  demo: false
