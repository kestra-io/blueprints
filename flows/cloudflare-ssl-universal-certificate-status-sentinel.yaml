id: cloudflare-ssl-universal-certificate-status-sentinel
namespace: company.networking

inputs:
  - id: zone_id
    type: STRING
    description: Cloudflare Zone ID to audit.

tasks:
  - id: query_ssl_verification
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s -H "Authorization: Bearer {{ secret('CLOUDFLARE_API_TOKEN') }}"           "https://api.cloudflare.com/client/v4/zones/{{ inputs.zone_id }}/ssl/verification" > /tmp/ssl_status.json
        
        FAILING_CERTS=$(jq '[.result[]? | select(.certificate_status != "active") | {hostname: .hostname, status: .certificate_status, brand: .brand}]' /tmp/ssl_status.json)
        FAILING_COUNT=$(echo "$FAILING_CERTS" | jq 'length')
        
        echo "::set-output name=failing_count::$FAILING_COUNT::"
        echo "::set-output name=failing_certs::$FAILING_CERTS::"

  - id: evaluate_ssl_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_ssl_verification.vars.failing_count | int > 0 }}"
    then:
      - id: notify_security_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#sec-ops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Cloudflare Universal SSL Certificate Degradation Alert",
                "text": "Zone `{{ inputs.zone_id }}` has *{{ outputs.query_ssl_verification.vars.failing_count }}* hostnames with non-active SSL certificate status. Unverified certificates: {{ outputs.query_ssl_verification.vars.failing_certs }}. Impact: Public visitors will receive browser HTTPS warnings (ERR_SSL_VERSION_OR_CIPHER_MISMATCH) or invalid certificate security blocks.",
                "footer": "Kestra Security Sentinel • Cloudflare SSL"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#sec-ops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Cloudflare SSL Sentinel Execution Failed",
            "text": "The Cloudflare SSL verification query workflow failed. Please verify API token and zone ID.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Cloudflare Universal SSL Certificate Status and Ingress TLS Sentinel
  shortDescription: Audits Cloudflare zone SSL verification status to detect pending, expired, or invalid edge TLS certificates.
  description: |
    ## How it works
    This workflow connects to the Cloudflare API endpoint `/zones/{zone_id}/ssl/verification` to audit the issuance and active status of Universal SSL and advanced edge certificates across designated hostnames. When CAA records conflict, DNS verification records drift, or certificate authority orders fail, edge certificates transition to `pending_validation` or `expired`. An automated Slack incident alert is immediately dispatched.

    ## What you get
    - Proactive detection of failed edge TLS certificate renewals.
    - Prevents catastrophic browser security blocks and HTTPS downtime.
    - Comprehensive inventory of affected hostnames, verification statuses, and CA brands.

    ## Who it's for
    - Security Engineers and SREs governing public website and domain TLS certificates.
    - Infrastructure and DevOps teams managing Cloudflare domain routing.

    ## Why orchestrate this with Kestra
    - **Continuous Verification**: Schedule hourly SSL health checks with complete audit logging.
    - **Direct Alerting**: Route critical certificate warnings directly to security operations channels.
    - **Multi-Zone Fleet Management**: Easily parameterize and monitor across multiple corporate domains.

    ## Prerequisites
    - Cloudflare API token with `Zone.SSL and Certificates:Read` permissions.
    - Secrets `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Enter your Cloudflare Zone ID and credentials.
    3. Run the workflow to inspect active edge certificate statuses.

    ## How to extend
    - Query custom uploaded SSL certificates via `/zones/{zone_id}/custom_certificates`.
    - Automatically trigger certificate retry or validation re-check calls.

    ## Links
    - [Cloudflare SSL Verification API Documentation](https://developers.cloudflare.com/api/operations/ssl-verification-ssl-verification-details)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Cloud
    - Infrastructure
  ee: false
  demo: false
