id: consul-raft-leader-stability-sentinel
namespace: company.infra

inputs:
  - id: consul_addr
    type: STRING
    defaults: "http://consul.internal:8500"
    description: Host and port of the HashiCorp Consul HTTP API.

tasks:
  - id: inspect_raft_leader
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Consul Raft leader and peer configuration
        curl -s "{{ inputs.consul_addr }}/v1/status/leader" > /tmp/consul_leader.txt
        curl -s "{{ inputs.consul_addr }}/v1/operator/raft/configuration" > /tmp/consul_raft.json

        python3 -c "
        import json
        try:
            with open('/tmp/consul_leader.txt') as f:
                leader = f.read().strip().replace('\"', '')
            with open('/tmp/consul_raft.json') as f:
                raft = json.load(f)
            servers = raft.get('Servers', [])
            voter_count = len([s for s in servers if s.get('Voter', False)])
            is_healthy = 1 if leader and voter_count >= 3 else 0
            is_breach = 1 if is_healthy == 0 else 0
            print(f'{is_breach}|{leader}|{voter_count}')
        except Exception:
            print('1|none|0')
        " > /tmp/consul_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/consul_summary.txt)
        LEADER_ADDR=$(cut -d '|' -f 2 /tmp/consul_summary.txt)
        VOTER_COUNT=$(cut -d '|' -f 3 /tmp/consul_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=leader_addr::$LEADER_ADDR::"
        echo "::set-output name=voter_count::$VOTER_COUNT::"

  - id: evaluate_raft_quorum
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_raft_leader.vars.is_breach | int == 1 }}"
    then:
      - id: notify_infra_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infra-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 HashiCorp Consul Raft Quorum Degradation Alert",
                "text": "Consul Cluster at {{ inputs.consul_addr }} has lost leader stability (Leader: {{ outputs.inspect_raft_leader.vars.leader_addr }}, Active Voters: {{ outputs.inspect_raft_leader.vars.voter_count }}). Risk of split-brain or service discovery collapse.",
                "footer": "Kestra Infrastructure Sentinel • HashiCorp Consul"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infra-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Consul Sentinel Failure",
            "text": "Failed to communicate with HashiCorp Consul HTTP API at {{ inputs.consul_addr }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  metaDescription: "Audits HashiCorp Consul Raft consensus cluster leadership and voter quorum to prevent service discovery outages."
  metaTitle: HashiCorp Consul Raft Leader Stability and Quorum Sentinel with Kestra
  ee: false
  demo: false
  title: HashiCorp Consul Raft Leader Stability and Quorum Sentinel
  shortDescription: Audits HashiCorp Consul Raft consensus cluster leadership and voter quorum to prevent service discovery outages.
  description: |
    ## How it works
    This workflow connects to the HashiCorp Consul HTTP API (`/v1/status/leader` and `/v1/operator/raft/configuration`) to audit cluster Raft consensus health. In Consul, service discovery, health check registrations, and KV store operations rely entirely on a stable Raft leader and active voting quorum. When network partitions or unexpected node crashes reduce voter counts below majority threshold, leadership is lost, throwing the cluster into read-only or unreachable states. This sentinel verifies active leader presence, validates minimum voter counts, and dispatches incident alerts before service discovery collapses.

    ## What you get
    - Real-time detection of Consul Raft consensus leadership instability.
    - Early warning before service mesh and microservice routing failures.
    - Automated Slack incident notifications with leader address and voter counts.

    ## Who it's for
    - Infrastructure and Platform Engineers maintaining HashiCorp Consul clusters.
    - SREs safeguarding microservice discovery and service mesh connectivity.
    - DevOps Teams operating distributed multi-datacenter Consul topologies.

    ## Why orchestrate this with Kestra
    - **Scheduled Surveillance**: Periodically audits consensus health every 10 minutes.
    - **Native API Capabilities**: Interacts directly with standard REST endpoints without agents.
    - **Enterprise Secret Storage**: Secures Consul ACL management tokens inside Kestra secrets.

    ## Prerequisites
    - HashiCorp Consul cluster with accessible HTTP API (`8500`).
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `SLACK_WEBHOOK` to your namespace secrets.
    3. Specify `consul_addr`.
    4. Enable the schedule trigger for continuous consensus monitoring.

    ## How to extend
    - Query `/v1/health/state/critical` to identify specific failing service nodes.
    - Trigger automated server node replacement via cloud infrastructure APIs.
    - Alert to Microsoft Teams or PagerDuty.

    ## Links
    - [HashiCorp Consul Operator Raft API](https://developer.hashicorp.com/consul/api-docs/operator)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
