id: jenkins-plugin-security-warning-audit
namespace: company.team

description: |
  Daily audit of a Jenkins controller's installed plugins and core version against the security warnings
  that the Jenkins update center publishes. One download of update-center.actual.json, DuckDB applies each
  warning's version regex the way Jenkins does (full match), works out whether a fixed release exists, and
  Slack is alerted only for findings that were not reported before.

concurrency:
  limit: 1

inputs:
  - id: installed_plugins
    type: STRING
    displayName: Installed plugins
    description: |
      Paste one of: the JSON body of `<jenkins>/pluginManager/api/json?depth=1`, a `plugins.txt` (`name:version`,
      the format of jenkins-plugin-cli and the official Docker image), or CSV lines `name,version`. `#` comments,
      a header line and blank lines are ignored. Lines without a pinned version (`latest`, `experimental`, none) are
      listed but cannot be checked. The default list is SAMPLE DATA for a controller last patched in spring 2026.
    defaults: |
      # plugins.txt of a sample controller (sample data, replace with your own)
      script-security:1415.v9a_f9b_3a_c253d
      credentials-binding:719.v80e905ef14eb_
      git-client:6.6.0
      git:5.11.0
      github:1.47.0
      ldap:807.809.vd3a_4e5e4ec98
      htmlpublisher:429
      pipeline-groovy-lib:805.va_fc79344957d
      extended-choice-parameter:388.ve7b_d0b_920e10
      warnings:5.0.3
      job-dsl:latest

  - id: core_version
    type: STRING
    displayName: Jenkins core version
    description: Version shown in the footer or the `X-Jenkins` response header, e.g. `2.504.3`. Set to `none` to check plugins only. The default is sample data.
    defaults: "2.504.3"

  - id: acknowledged_warnings
    type: ARRAY
    itemType: STRING
    displayName: Acknowledged warning IDs
    description: Warning IDs (e.g. `SECURITY-3672`) you have accepted, like Jenkins' own "hide this warning" setting. They stay in the CSV but never alert.
    defaults: []

  - id: update_center_url
    type: URI
    displayName: Update center JSON
    description: The `current` site matches the latest weekly core; warnings are identical on every update site.
    defaults: https://updates.jenkins.io/current/update-center.actual.json

  - id: state_key
    type: STRING
    displayName: KV key of the reported findings
    description: Use one key per controller.
    defaults: jenkins_plugin_warning_state

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: The update center is regenerated several times a day; advisories are published on Wednesdays, so a daily run picks them up within hours.
    cron: "0 7 * * *"
    timezone: UTC

tasks:
  - id: read_state
    type: io.kestra.plugin.core.kv.Get
    description: Findings already reported for this controller. Missing on the first run, which then reports every finding as the initial audit.
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: download
    type: io.kestra.plugin.core.http.Download
    description: About 3.5 MB with 2,100+ plugins and 1,500+ warnings. The URL redirects to a mirror, so redirects are followed.
    uri: "{{ inputs.update_center_url }}"
    headers:
      User-Agent: "kestra-jenkins-plugin-security-audit/1.0 (https://kestra.io)"
    options:
      followRedirects: true
      retryOnStatusCodes: [429, 500, 502, 503, 504]
      retry:
        type: exponential
        interval: PT10S
        maxInterval: PT2M
        maxAttempts: 4

  - id: audit
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Parses the inventory in any of the three formats, refuses a truncated update-center file, applies every warning
      pattern with regexp_full_match (Jenkins uses Matcher.matches(), and some patterns are bare alternations), and
      classifies each finding as UPGRADE (the latest release is outside the vulnerable range), NO_FIX (the latest
      release still matches, so disable or remove the plugin) or NOT_DISTRIBUTED (plugin removed from the update center).
      It also flags fixes whose latest release needs a newer core than the one installed.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      uc.json: "{{ outputs.download.uri }}"
    outputFiles:
      - findings_csv
      - inventory_csv
    parameters:
      installed: "{{ inputs.installed_plugins }}"
      core: "{{ inputs.core_version }}"
      ack: "{{ inputs.acknowledged_warnings | toJson }}"
      prev: "{{ outputs.read_state.value ?? '[]' }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE MACRO vkey(v) AS list_transform(regexp_extract_all(v, '[0-9]+'), x -> CAST(x AS BIGINT));

      CREATE TABLE corev AS SELECT CASE WHEN lower(trim(CAST(:core AS VARCHAR))) IN ('', 'none', 'skip', '-') THEN '' ELSE trim(CAST(:core AS VARCHAR)) END AS v;
      CREATE TABLE src AS SELECT trim(CAST(:installed AS VARCHAR)) AS s;
      CREATE TABLE raw_lines AS
        SELECT generate_subscripts(string_split(replace(s, chr(13), ''), chr(10)), 1) AS line_no,
               unnest(string_split(replace(s, chr(13), ''), chr(10))) AS l
        FROM src WHERE left(s, 1) <> '{';
      CREATE TABLE from_text AS
        SELECT line_no, trim(p[1]) AS name, nullif(trim(coalesce(p[2], '')), '') AS version, CAST(NULL AS BOOLEAN) AS enabled
        FROM (SELECT line_no, regexp_split_to_array(trim(regexp_replace(l, '#.*$', '')), '[,;' || chr(58) || ' ]+') AS p FROM raw_lines)
        WHERE trim(p[1]) <> '' AND lower(trim(p[1])) NOT IN ('name', 'shortname', 'plugin', 'id');
      CREATE TABLE from_json AS
        SELECT row_number() OVER () AS line_no, p.shortName AS name, p.version, p.enabled
        FROM (SELECT unnest(from_json(json_extract(s, '$.plugins'), '[{"shortName":"VARCHAR","version":"VARCHAR","enabled":"BOOLEAN"}]')) AS p
              FROM src WHERE left(s, 1) = '{');
      CREATE TABLE inv AS
        SELECT *, count(*) OVER (PARTITION BY name) > 1 AS duplicated,
               CASE WHEN NOT regexp_full_match(name, '[A-Za-z0-9][A-Za-z0-9._-]*') THEN 'INVALID_NAME'
                    WHEN version IS NULL OR lower(version) IN ('latest', 'experimental') THEN 'UNPINNED'
                    WHEN NOT regexp_full_match(version, '[A-Za-z0-9][A-Za-z0-9._+-]*') THEN 'INVALID_VERSION' END AS skip_reason
        FROM (SELECT * FROM from_text UNION ALL SELECT * FROM from_json)
        QUALIFY row_number() OVER (PARTITION BY name ORDER BY line_no DESC) = 1;
      CREATE TABLE inv_check AS SELECT CASE WHEN count(*) = 0 THEN error('The installed plugin list is empty or could not be parsed.') END AS ok FROM inv;

      CREATE TABLE uc AS SELECT CAST(content AS JSON) AS doc FROM read_text('uc.json');
      CREATE TABLE uc_check AS SELECT CASE WHEN coalesce(json_array_length(json_extract(doc, '$.warnings')), 0) < 500
        THEN error('Update center file has no or too few warnings, refusing to report a clean result.') END AS ok FROM uc;
      CREATE TABLE warn0 AS
        SELECT w.id AS warning_id, w.message, w.name, w.type, w.url, unnest(w.versions) AS v
        FROM (SELECT unnest(from_json(json_extract(doc, '$.warnings'),
          '[{"id":"VARCHAR","message":"VARCHAR","name":"VARCHAR","type":"VARCHAR","url":"VARCHAR","versions":[{"lastVersion":"VARCHAR","pattern":"VARCHAR"}]}]')) AS w FROM uc);
      -- a few legacy patterns start with a Java negative lookahead (?!X) that DuckDB's RE2 engine cannot run,
      -- rewritten as "full match of the rest AND not starting with X", anything else RE2 cannot run is counted, never guessed
      CREATE TABLE warn1 AS
        SELECT *, regexp_extract(v.pattern, '^(\(\?!((?:[^()]|\((?:[^()]|\([^()]*\))*\))*)\))', 1) AS la_full,
                  regexp_extract(v.pattern, '^\(\?!((?:[^()]|\((?:[^()]|\([^()]*\))*\))*)\)', 1) AS la_inner
        FROM warn0;
      CREATE TABLE warn AS
        SELECT warning_id, message, name, type, url, v.lastVersion AS last_version, v.pattern AS pattern,
               CASE WHEN la_full <> '' THEN substr(v.pattern, length(la_full) + 1) ELSE v.pattern END AS re,
               nullif(la_inner, '') AS excl
        FROM warn1;
      ALTER TABLE warn ADD COLUMN supported BOOLEAN;
      UPDATE warn SET supported = NOT regexp_matches(re, '\(\?[=!<]');
      CREATE MACRO hit(ver, re, excl) AS regexp_full_match(ver, re) AND (excl IS NULL OR NOT regexp_matches(ver, '^(?' || chr(58) || excl || ')'));

      CREATE TABLE info AS
        SELECT i.*, json_extract_string(u.doc, '$.plugins."' || i.name || '".version') AS latest_version,
               json_extract_string(u.doc, '$.plugins."' || i.name || '".requiredCore') AS latest_requires_core,
               json_extract_string(u.doc, '$.deprecations."' || i.name || '".url') AS deprecation_url
        FROM inv i, uc u WHERE i.skip_reason IS NULL OR i.skip_reason = 'UNPINNED';
      CREATE TABLE checked AS
        SELECT name, version, enabled, latest_version, latest_requires_core, deprecation_url, 'plugin' AS type FROM info WHERE skip_reason IS NULL
        UNION ALL
        SELECT 'core', (SELECT v FROM corev), NULL, json_extract_string(doc, '$.core.version'), NULL, NULL, 'core' FROM uc WHERE (SELECT v FROM corev) <> '';

      CREATE TABLE ack AS SELECT DISTINCT upper(trim(a)) AS warning_id FROM unnest(from_json(:ack, '["VARCHAR"]')) AS t(a);
      CREATE TABLE prev AS SELECT unnest(from_json(:prev, '["VARCHAR"]')) AS k;
      CREATE TABLE ranges AS SELECT warning_id, name, string_agg(DISTINCT last_version, ' / ' ORDER BY last_version) AS last_affected FROM warn GROUP BY ALL;
      CREATE TABLE findings AS
        SELECT c.type, c.name, c.version AS installed_version, c.enabled, w.warning_id, any_value(w.message) AS message,
               r.last_affected, c.latest_version,
               CASE WHEN c.latest_version IS NULL THEN 'NOT_DISTRIBUTED' ELSE 'UPGRADE' END AS fix_status,
               CASE WHEN c.latest_requires_core IS NOT NULL AND (SELECT v FROM corev) <> ''
                         AND vkey((SELECT v FROM corev)) < vkey(c.latest_requires_core) THEN c.latest_requires_core END AS fix_needs_core,
               c.deprecation_url, upper(w.warning_id) IN (SELECT warning_id FROM ack) AS acknowledged,
               c.name || '|' || c.version || '|' || w.warning_id AS k, any_value(w.url) AS advisory_url
        FROM checked c JOIN warn w ON w.name = c.name AND w.type = c.type
        JOIN ranges r ON r.warning_id = w.warning_id AND r.name = w.name
        WHERE w.supported AND hit(c.version, w.re, w.excl)
        GROUP BY ALL;
      -- a warning can list several vulnerable ranges, NO_FIX if the latest release falls in any of them
      UPDATE findings f SET fix_status = 'NO_FIX' FROM checked c, warn w
        WHERE f.fix_status = 'UPGRADE' AND c.name = f.name AND w.name = f.name AND w.warning_id = f.warning_id
          AND w.supported AND hit(c.latest_version, w.re, w.excl);
      CREATE TABLE report AS SELECT *, NOT acknowledged AND k NOT IN (SELECT k FROM prev) AS is_new FROM findings;

      COPY (SELECT * EXCLUDE (k) FROM report ORDER BY is_new DESC, fix_status, name, warning_id) TO '{{ outputFiles.findings_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT i.line_no, i.name, i.version, i.enabled, coalesce(i.skip_reason, CASE WHEN f.latest_version IS NULL THEN 'NOT_IN_UPDATE_CENTER' ELSE 'CHECKED' END) AS status,
                   i.duplicated, f.latest_version, f.latest_requires_core, f.deprecation_url,
                   (SELECT count(*) FROM report r WHERE r.name = i.name) AS warnings
            FROM inv i LEFT JOIN info f ON f.name = i.name ORDER BY warnings DESC, i.name) TO '{{ outputFiles.inventory_csv }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT json_extract_string(doc, '$.generationTimestamp') FROM uc) AS generated_at,
        (SELECT count(DISTINCT warning_id) FROM warn) AS update_center_warnings,
        (SELECT count(*) FILTER (WHERE excl IS NOT NULL) FROM warn) AS lookahead_rewritten,
        (SELECT count(*) FILTER (WHERE NOT supported) FROM warn) AS unsupported_patterns,
        (SELECT count(*) FROM prev) = 0 AS first_run,
        (SELECT count(*) FROM inv) AS listed,
        (SELECT count(*) FROM checked WHERE type = 'plugin') AS checked_plugins,
        (SELECT coalesce(nullif(v, ''), 'not given') FROM corev) AS core_version,
        (SELECT coalesce(string_agg(name || ' (' || skip_reason || ')', ', ' ORDER BY name), 'none') FROM inv WHERE skip_reason IS NOT NULL) AS not_checked,
        (SELECT coalesce(string_agg(name, ', ' ORDER BY name), 'none') FROM checked WHERE type = 'plugin' AND latest_version IS NULL) AS not_in_update_center,
        (SELECT coalesce(string_agg(name, ', ' ORDER BY name), 'none') FROM checked WHERE deprecation_url IS NOT NULL) AS deprecated,
        (SELECT count(*) FROM report) AS findings,
        (SELECT count(DISTINCT name) FROM report) AS affected,
        (SELECT coalesce(string_agg(fix_status || ' ' || n, ', '), 'none') FROM (SELECT fix_status, count(*) AS n FROM report GROUP BY 1 ORDER BY 1)) AS by_fix_status,
        (SELECT count(*) FROM report WHERE acknowledged) AS acknowledged,
        (SELECT count(*) FROM report WHERE is_new) AS new_findings,
        (SELECT count(*) FROM prev WHERE k NOT IN (SELECT k FROM report WHERE NOT acknowledged)) AS resolved,
        (SELECT coalesce(string_agg('- ' || name || ' ' || installed_version || CASE WHEN enabled = false THEN ' (disabled)' ELSE '' END || ' | ' || warning_id || ' ' || message || ' | '
              || CASE WHEN type = 'core' THEN 'upgrade to a release after ' || last_affected
                      WHEN fix_status = 'UPGRADE' THEN 'upgrade to ' || latest_version || coalesce(' (needs core ' || fix_needs_core || ')', '')
                      WHEN fix_status = 'NO_FIX' THEN 'no fix released, disable or remove'
                      ELSE 'no longer distributed, remove' END || ' | ' || advisory_url, chr(10)), '')
           FROM (SELECT * FROM report WHERE is_new ORDER BY type = 'core' DESC, fix_status, name, warning_id LIMIT 25)) AS alert_lines,
        (SELECT CAST(coalesce(to_json(list(k ORDER BY k)), CAST('[]' AS JSON)) AS VARCHAR) FROM report WHERE NOT acknowledged) AS state;

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Update center generated {{ outputs.audit.outputs[0].row.generated_at }} with {{ outputs.audit.outputs[0].row.update_center_warnings }} warnings ({{ outputs.audit.outputs[0].row.lookahead_rewritten }} lookahead patterns rewritten for RE2, {{ outputs.audit.outputs[0].row.unsupported_patterns }} unsupported).
      Inventory: {{ outputs.audit.outputs[0].row.listed }} entries, {{ outputs.audit.outputs[0].row.checked_plugins }} plugins checked, core {{ outputs.audit.outputs[0].row.core_version }}. Not checked: {{ outputs.audit.outputs[0].row.not_checked }}.
      Not in the update center (removed, suspended or private): {{ outputs.audit.outputs[0].row.not_in_update_center }}. Deprecated: {{ outputs.audit.outputs[0].row.deprecated }}.
      Findings: {{ outputs.audit.outputs[0].row.findings }} on {{ outputs.audit.outputs[0].row.affected }} components ({{ outputs.audit.outputs[0].row.by_fix_status }}), {{ outputs.audit.outputs[0].row.acknowledged }} acknowledged.
      {% if outputs.audit.outputs[0].row.first_run %}FIRST RUN, every finding is reported as the initial audit.{% else %}New since last run: {{ outputs.audit.outputs[0].row.new_findings }}, resolved since last run: {{ outputs.audit.outputs[0].row.resolved }}.{% endif %}

  - id: route
    type: io.kestra.plugin.core.flow.If
    description: Slack only for findings not reported before. Known and acknowledged findings stay in the CSV.
    condition: "{{ outputs.audit.outputs[0].row.new_findings > 0 }}"
    then:
      - id: log_new
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.audit.outputs[0].row.alert_lines }}"
      - id: slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Fails softly when SLACK_WEBHOOK_URL is not configured, so the state is still saved and the WARN log and CSV are the record.
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :rotating_light: Jenkins security warnings: {{ outputs.audit.outputs[0].row.new_findings }} new finding(s) (first 25 below)
          {{ outputs.audit.outputs[0].row.alert_lines }}
          Execution {{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}
    else:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: No new security warnings for the installed plugins and core.

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: Written last, so a failed download or audit keeps the previous state and the same findings are reported again next run.
    key: "{{ inputs.state_key }}"
    kvType: STRING
    value: "{{ outputs.audit.outputs[0].row.state }}"

outputs:
  - id: summary
    type: JSON
    value:
      generated_at: "{{ outputs.audit.outputs[0].row.generated_at }}"
      first_run: "{{ outputs.audit.outputs[0].row.first_run }}"
      findings: "{{ outputs.audit.outputs[0].row.findings }}"
      by_fix_status: "{{ outputs.audit.outputs[0].row.by_fix_status }}"
      new_findings: "{{ outputs.audit.outputs[0].row.new_findings }}"
      resolved: "{{ outputs.audit.outputs[0].row.resolved }}"
  - id: findings_csv
    type: FILE
    value: "{{ outputs.audit.outputFiles.findings_csv }}"
  - id: inventory_csv
    type: FILE
    value: "{{ outputs.audit.outputFiles.inventory_csv }}"

extend:
  title: Jenkins Plugin and Core Security Warning Audit
  metaTitle: Jenkins Plugin Security Warning Audit with DuckDB | Kestra
  shortDescription: Check a Jenkins controller's plugins and core version against the update center's security warnings every day, with fix status per finding and Slack alerts only for new ones.
  metaDescription: Match installed Jenkins plugins and core against update-center security warnings in DuckDB, classify fixes and alert Slack on new findings.
  description: |
    Jenkins shows security warnings only to administrators who log in, one controller at a time. This flow runs the same check on a schedule: one download of the public update center file, every warning's version pattern applied to your plugin list and core version, a fix status per finding, and Slack alerts only for new findings. The default plugin list and core version are sample data; the warnings and latest versions come from the live update center.

    ## How it works

    1. A daily `Schedule` trigger (or a manual run) starts the flow. `kv.Get` loads the findings already reported for this controller.
    2. `http.Download` fetches `update-center.actual.json` (about 3.5 MB, 1,500+ warnings), following the mirror redirect, with retries.
    3. A DuckDB task parses the inventory in one of three formats: the JSON from `/pluginManager/api/json?depth=1`, a `plugins.txt` (`name:version`), or CSV. Unpinned (`latest`) or malformed lines are listed but not checked, and a truncated update center file stops the run instead of reading as "clean".
    4. Each warning pattern must match the whole version string, the same way Jenkins checks it. Six old patterns use a Java negative lookahead that DuckDB's RE2 engine cannot run; they are rewritten as "matches the rest and does not start with X", and any other unsupported pattern is counted in the log.
    5. Each finding is classified as `UPGRADE` (the latest release is outside the vulnerable range), `NO_FIX` (the latest release is still affected, so disable or remove the plugin) or `NOT_DISTRIBUTED` (the plugin was removed from the update center). Fixes that need a newer core than yours are flagged, and deprecated plugins are listed.
    6. An `If` task logs new findings at WARN and posts them to Slack. Findings already reported and acknowledged warning IDs never alert again. `kv.Set` saves the state last.

    ## What you get

    - A findings CSV (advisory URL, last affected and latest version, fix status, new flag) and an inventory CSV with the status of every line.
    - The first run reports every current finding as the initial audit. Later runs alert only on new advisories or newly installed vulnerable versions, and count findings resolved by upgrades.
    - Acknowledged warning IDs stay in the CSV but never alert.

    ## Who it's for

    - CI/CD platform and DevOps teams running one or more Jenkins controllers.
    - Security teams who need plugin patch evidence without admin access to every controller.

    ## Why orchestrate this with Kestra

    - Scheduled, retried and logged in one place instead of a cron script on the Jenkins host, with one state key per controller.
    - KV state turns a noisy daily scan into new-findings-only alerts, and the CSV outputs are kept with every execution as audit evidence.

    ## Prerequisites

    - Outbound HTTPS to `updates.jenkins.io` and its mirrors. No API key.
    - Your plugin list, e.g. the JSON from `<jenkins>/pluginManager/api/json?depth=1` or the `plugins.txt` your Docker image is built from.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for new findings (optional, the task fails softly without it).

    ## Quick start

    1. Execute the flow with the defaults (sample data) to see findings of every type.
    2. Paste your own plugin list into `installed_plugins` and set `core_version`, with a separate `state_key` per controller.
    3. Add `SLACK_WEBHOOK_URL` and enable the daily trigger.

    ## How to extend

    - Fetch the plugin JSON directly from each controller with `http.Request` and an API token, then loop over controllers with `ForEach`.
    - Fail a pipeline that builds a Jenkins image when `plugins.txt` has `NO_FIX` findings.

    ## Links

    - [Jenkins update center warnings](https://www.jenkins.io/doc/developer/publishing/marking-a-new-plugin-version-as-security-fix/)
    - [Jenkins security advisories](https://www.jenkins.io/security/advisories/)
    - [DuckDB Queries task](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack incoming webhook task](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
