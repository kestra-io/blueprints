id: cohort-retention-duckdb
namespace: company.team
description: |
  Build a weekly cohort retention matrix from an events parquet file with embedded DuckDB SQL, then let a small Python analyzer flag any cohort whose retention fell further than your threshold. Flagged cohorts post to Slack with the drops and a link to the full report.

inputs:
  - id: cohort_weeks
    type: INT
    defaults: 8
    description: How many of the newest weekly cohorts stay in the comparison window, newest included.

  - id: churn_drop_threshold_pct
    type: FLOAT
    defaults: 15.0
    description: Percentage points of retention loss against the trailing average that flags a cohort as churning.

tasks:
  # --- 1. seed a sample events parquet ---
  - id: seed_sample_events
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Write a deterministic sample events parquet with COPY TO so the flow runs before you point it at a warehouse.
    outputFiles:
      - events.parquet
    sql: |
      COPY (
        WITH cohort_offsets AS (
          SELECT
            generate_series AS weeks_ago,
            CAST(date_trunc('week', CURRENT_DATE) AS DATE)
              - CAST(7 * generate_series AS INTEGER) AS cohort_week
          FROM generate_series(1, 8)
        ),
        cohort_users AS (
          SELECT
            c.weeks_ago,
            c.cohort_week,
            100 * c.weeks_ago + u.generate_series AS user_num
          FROM cohort_offsets c, generate_series(1, 20) u
        ),
        user_weeks AS (
          SELECT
            cu.*,
            w.generate_series AS weeks_since
          FROM cohort_users cu, generate_series(0, 8) w
          WHERE w.generate_series <= cu.weeks_ago
        ),
        keep_prob AS (
          SELECT
            *,
            CASE weeks_since
              WHEN 0 THEN 100
              WHEN 1 THEN 85
              WHEN 2 THEN 70
              WHEN 3 THEN 60
              WHEN 4 THEN 50
              WHEN 5 THEN 45
              WHEN 6 THEN 40
              WHEN 7 THEN 35
              ELSE 30
            END - CASE WHEN weeks_ago = 1 AND weeks_since >= 1 THEN 40 ELSE 0 END AS keep_pct
          FROM user_weeks
        )
        SELECT
          'user_' || lpad(user_num::VARCHAR, 4, '0') AS user_id,
          cohort_week + CAST(7 * weeks_since AS INTEGER) AS event_date,
          'app_open' AS event_name
        FROM keep_prob
        WHERE (user_num * 37 + weeks_since * 13) % 100 < keep_pct
      ) TO '{{ outputFiles["events.parquet"] }}' (FORMAT parquet);

  # --- 2. cohort retention matrix ---
  - id: cohort_matrix
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Mount the events parquet through inputFiles, pivot it into one row per cohort and weeks-since pair, and COPY the matrix out as CSV.
    inputFiles:
      events.parquet: "{{ outputs.seed_sample_events.outputFiles['events.parquet'] }}"
    outputFiles:
      - cohort_matrix.csv
    sql: |
      COPY (
        WITH events AS (
          SELECT user_id, CAST(event_date AS TIMESTAMP) AS event_ts
          FROM read_parquet('events.parquet')
        ),
        first_activity AS (
          SELECT user_id, date_trunc('week', MIN(event_ts)) AS cohort_week
          FROM events
          GROUP BY user_id
        ),
        weekly AS (
          SELECT
            f.cohort_week,
            f.user_id,
            date_diff('week', f.cohort_week, date_trunc('week', e.event_ts)) AS weeks_since
          FROM events e
          JOIN first_activity f ON e.user_id = f.user_id
        ),
        retained AS (
          SELECT cohort_week, weeks_since, COUNT(DISTINCT user_id) AS retained_users
          FROM weekly
          WHERE weeks_since >= 0
          GROUP BY cohort_week, weeks_since
        ),
        sizes AS (
          SELECT cohort_week, COUNT(DISTINCT user_id) AS cohort_size
          FROM first_activity
          GROUP BY cohort_week
        )
        SELECT
          s.cohort_week,
          r.weeks_since,
          s.cohort_size,
          r.retained_users,
          ROUND(100.0 * r.retained_users / s.cohort_size, 1) AS retention_pct
        FROM retained r
        JOIN sizes s ON r.cohort_week = s.cohort_week
        ORDER BY s.cohort_week, r.weeks_since
      ) TO '{{ outputFiles["cohort_matrix.csv"] }}' (HEADER, DELIMITER ',');

  # --- 3. compare latest cohort against the trailing average ---
  - id: analyze_cohorts
    type: io.kestra.plugin.scripts.python.Script
    description: Read the matrix CSV, compare the newest cohort cell by cell with the trailing average, and emit the verdict through the json output protocol.
    containerImage: python:3.11-slim
    inputFiles:
      cohort_matrix.csv: "{{ outputs.cohort_matrix.outputFiles['cohort_matrix.csv'] }}"
      config.json: |
        {"cohort_weeks": {{ inputs.cohort_weeks }}, "churn_drop_threshold_pct": {{ inputs.churn_drop_threshold_pct }}}
    outputFiles:
      - cohort_report.json
    script: |
      import csv
      import json
      import os


      def read_config():
          if not os.path.exists("config.json"):
              return {}
          with open("config.json", encoding="utf-8") as handle:
              try:
                  return json.load(handle)
              except ValueError:
                  return {}


      def read_matrix():
          if not os.path.exists("cohort_matrix.csv"):
              return []
          cells = []
          try:
              with open("cohort_matrix.csv", newline="", encoding="utf-8") as handle:
                  for row in csv.DictReader(handle):
                      cohort = (row.get("cohort_week") or "").strip()
                      if not cohort:
                          continue
                      try:
                          weeks_since = int(float(row.get("weeks_since")))
                          retention_pct = float(row.get("retention_pct"))
                          cohort_size = int(float(row.get("cohort_size")))
                      except (TypeError, ValueError):
                          continue
                      if weeks_since < 0 or retention_pct < 0 or cohort_size <= 0:
                          continue
                      cells.append({
                          "cohort_week": cohort,
                          "weeks_since": weeks_since,
                          "cohort_size": cohort_size,
                          "retention_pct": retention_pct,
                      })
          except (csv.Error, UnicodeDecodeError):
              return []
          return cells


      config = read_config()
      try:
          threshold = float(config.get("churn_drop_threshold_pct", 15.0))
      except (TypeError, ValueError):
          threshold = 15.0
      try:
          cohort_weeks = int(config.get("cohort_weeks", 8))
      except (TypeError, ValueError):
          cohort_weeks = 8

      matrix = {}
      for cell in read_matrix():
          matrix.setdefault(cell["cohort_week"], {})[cell["weeks_since"]] = cell["retention_pct"]

      all_cohorts = sorted(matrix)
      cohorts = all_cohorts[-cohort_weeks:] if cohort_weeks > 0 else all_cohorts

      flagged_cohorts = {}
      worst_drop_pct = 0.0
      worst_weeks_since = None
      deltas = []

      if len(cohorts) >= 2:
          latest = cohorts[-1]
          earlier = cohorts[:-1]
          for weeks_since in sorted(matrix[latest]):
              trailing = [matrix[c][weeks_since] for c in earlier if weeks_since in matrix[c]]
              if not trailing:
                  continue
              trailing_avg = sum(trailing) / len(trailing)
              retention_pct = matrix[latest][weeks_since]
              drop = trailing_avg - retention_pct
              deltas.append(retention_pct - trailing_avg)
              if drop > worst_drop_pct:
                  worst_drop_pct = drop
                  worst_weeks_since = weeks_since
              if drop > threshold:
                  flagged_cohorts.setdefault(latest, []).append({
                      "weeks_since": weeks_since,
                      "retention_pct": round(retention_pct, 1),
                      "trailing_avg_pct": round(trailing_avg, 1),
                      "drop_pct": round(drop, 1),
                  })

      if not matrix or not deltas:
          verdict = "insufficient_data"
      elif flagged_cohorts:
          verdict = "churn_flagged"
      else:
          verdict = "healthy"

      flagged = bool(flagged_cohorts)

      if deltas:
          mean_delta = sum(deltas) / len(deltas)
          if mean_delta <= -1.0:
              overall_trend = "declining"
          elif mean_delta >= 1.0:
              overall_trend = "improving"
          else:
              overall_trend = "stable"
      else:
          overall_trend = "unknown"

      if flagged:
          parts = []
          for cohort in sorted(flagged_cohorts):
              worst_cell = max(flagged_cohorts[cohort], key=lambda item: item["drop_pct"])
              parts.append(
                  "%s down %s points at week %s"
                  % (cohort, worst_cell["drop_pct"], worst_cell["weeks_since"])
              )
          slack_line = "; ".join(parts) + "; trend " + overall_trend
      else:
          slack_line = (
              "no cohort fell more than %s points below the trailing average; trend %s"
              % (threshold, overall_trend)
          )

      report = {
          "verdict": verdict,
          "threshold_pct": threshold,
          "cohort_window": cohort_weeks,
          "cohorts_considered": cohorts,
          "flagged_cohorts": flagged_cohorts,
          "worst_drop_pct": round(worst_drop_pct, 1),
          "worst_weeks_since": worst_weeks_since,
          "overall_trend": overall_trend,
          "cohort_count": len(matrix),
          "matrix": matrix,
      }
      with open("cohort_report.json", "w", encoding="utf-8") as handle:
          json.dump(report, handle, indent=2, sort_keys=True)

      payload = {
          "outputs": {
              "verdict": verdict,
              "flagged": flagged,
              "flagged_cohorts": flagged_cohorts,
              "flagged_cohorts_json": json.dumps(flagged_cohorts, sort_keys=True),
              "worst_drop_pct": round(worst_drop_pct, 1),
              "worst_weeks_since": worst_weeks_since,
              "overall_trend": overall_trend,
              "cohort_count": len(matrix),
              "slack_line": slack_line,
          }
      }
      print("::" + json.dumps(payload) + "::")

  # --- 4. route on the verdict ---
  - id: route_churn
    type: io.kestra.plugin.core.flow.If
    description: Alert the channel only when at least one cohort dropped past the threshold, otherwise log a green result.
    condition: "{{ outputs.analyze_cohorts.vars.flagged }}"
    then:
      - id: notify_churn
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the flagged drops, the trend, and the report file reference to the team channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "COHORT CHURN {{ flow.id }} ({{ execution.id }}): {{ outputs.analyze_cohorts.vars.slack_line }}. Report {{ outputs.analyze_cohorts.outputFiles['cohort_report.json'] }}"
          }
      - id: log_flagged
        type: io.kestra.plugin.core.log.Log
        description: Record the flagged cohorts in the execution log for the audit trail.
        message: "flagged {{ outputs.analyze_cohorts.vars.cohort_count }} cohorts window, verdict {{ outputs.analyze_cohorts.vars.verdict }}, worst drop {{ outputs.analyze_cohorts.vars.worst_drop_pct }} points"
    else:
      - id: log_healthy
        type: io.kestra.plugin.core.log.Log
        description: Green path, no cohort fell further than the threshold against its trailing average.
        message: "ALL GREEN {{ flow.id }}, verdict {{ outputs.analyze_cohorts.vars.verdict }}, trend {{ outputs.analyze_cohorts.vars.overall_trend }}, worst drop {{ outputs.analyze_cohorts.vars.worst_drop_pct }} points"

triggers:
  - id: weekly_refresh
    type: io.kestra.plugin.core.trigger.Schedule
    description: Refresh the retention matrix every Monday morning, disabled until you are ready to schedule it.
    cron: "0 6 * * 1"
    disabled: true

errors:
  - id: slack_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED {{ flow.id }} run {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.analyze_cohorts.vars.verdict }}"

  - id: flagged_cohorts
    type: JSON
    value: "{{ outputs.analyze_cohorts.vars.flagged_cohorts_json }}"

  - id: worst_drop_pct
    type: STRING
    value: "{{ outputs.analyze_cohorts.vars.worst_drop_pct }}"

  - id: report
    type: STRING
    value: "{{ outputs.analyze_cohorts.outputFiles['cohort_report.json'] }}"

extend:
  shortDescription: DuckDB SQL builds the cohort retention matrix, a Python analyzer compares the newest cohort with the trailing average, and Slack gets the churn alert.
  title: Weekly Cohort Retention Matrix and Churn Watch with DuckDB
  metaTitle: Cohort Retention Analytics with DuckDB in Kestra
  metaDescription: Build a weekly cohort retention matrix from an events parquet file with DuckDB SQL, then alert Slack when the newest cohort drops past your threshold.
  description: |
    Weekly retention questions usually end in a spreadsheet that nobody trusts by the next quarter. This flow computes a cohort retention matrix straight from an events parquet file with embedded DuckDB SQL, judges the newest cohort cell by cell against the trailing average of the cohorts before it, and posts a Slack summary the moment retention falls further than the threshold you set. Everything lives in one declarative workflow, a disabled weekly schedule, a SQL matrix build, a small analyzer, and a conditional alert branch.

    ## How it works

    1. `seed_sample_events` (`io.kestra.plugin.jdbc.duckdb.Query`) writes a deterministic sample `events.parquet` with `COPY ... TO` and `outputFiles`, so the flow is runnable before you have a warehouse of your own.
    2. `cohort_matrix` (`io.kestra.plugin.jdbc.duckdb.Query`) mounts that parquet through `inputFiles`, assigns every user to the week of their first activity with `date_trunc`, and measures weeks since with `date_diff`.
    3. The same statement pivots the events into one row per cohort and weeks-since cell, then `COPY ... TO` writes `cohort_matrix.csv` through `outputFiles` so the matrix is a downloadable artifact as well as the next task's input.
    4. `analyze_cohorts` (`io.kestra.plugin.scripts.python.Script`) reads that CSV with the standard library, keeps the newest `cohort_weeks` cohorts, and compares every cell of the newest cohort with the average of the same weeks-since column across the earlier cohorts.
    5. Any cell that fell by more than `churn_drop_threshold_pct` points lands in `flagged_cohorts`, and the task emits its verdict with the `::json::` output protocol plus a one line Slack summary and a `cohort_report.json` artifact.
    6. `route_churn` (`io.kestra.plugin.core.flow.If`) branches on the flag, the true branch posts the drops and the report reference to Slack and the false branch logs a green result.
    7. The `errors` handler repeats the same webhook for failures, and the flow outputs the verdict, the flagged cohorts, the worst drop, and the report file.

    ## What you get

    - A retention matrix with one row per weekly cohort and weeks-since offset, ready to chart or hand to a dashboard.
    - A churn verdict of `churn_flagged`, `healthy`, or `insufficient_data` with the exact cells that caused it.
    - The worst single drop in percentage points, so a quick scan of the execution outputs answers the question.
    - A Slack message carrying the drops, the overall trend, and a reference to the full JSON report.
    - Two artifacts per run, the CSV matrix and the JSON report, both preserved in internal storage.

    ## Who it's for

    - Growth and product analysts who track weekly cohorts and need the numbers refreshed without manual spreadsheet work.
    - Data engineers who want retention logic living next to the ingestion pipeline instead of in a notebook.
    - Customer success and lifecycle teams who need an early warning when a recent cohort stops coming back.

    ## Why orchestrate this with Kestra

    DuckDB answers a retention question in milliseconds, but it does not know when to run, what to do with the answer, or who to tell. Wrapping the query in Kestra gives the analysis a weekly schedule, typed file handoffs between SQL and Python, a branch that only wakes the channel when the threshold is crossed, and an execution history that shows the exact matrix behind any past alert. Failures land in the same webhook instead of vanishing into a cron log, and the threshold and cohort window are inputs you can change without editing code. The result is a retention check that behaves like production monitoring rather than a one off query.

    ## Prerequisites

    - A Kestra instance with the DuckDB JDBC plugin available, since both SQL tasks run in process and need no server.
    - An events parquet file with a user identifier column and an activity date column, for example `user_id` and `event_date`.
    - The sample seed task only exists so the blueprint runs out of the box, you can delete it once your own parquet is mounted through `inputFiles`.
    - A Slack incoming webhook for the churn branch and the failure handler.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: the incoming webhook URL used by the alert branch and by the `errors` handler. Store it as a Kestra secret in your namespace, the flow never hardcodes a URL or token.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret to your namespace, either from the UI or in your version controlled namespace configuration.
    2. Execute the flow once with the defaults, the seeded sample includes a deliberate drop in the newest cohort so the alert branch shows itself.
    3. Open the `report` output to inspect `cohort_report.json`, then review the `verdict` and `worst_drop_pct` outputs on the execution overview.
    4. Enable the weekly schedule by pasting this snippet into the flow and removing `disabled: true` when you are ready:

    ```yaml
    triggers:
      - id: weekly_refresh
        type: io.kestra.plugin.core.trigger.Schedule
        cron: "0 6 * * 1"
        disabled: true
    ```

    5. Tune `cohort_weeks` and `churn_drop_threshold_pct` from the inputs panel on each run, no code change needed.

    ## How to extend

    - Point `cohort_matrix.inputFiles` at your own events parquet and delete the seed task, the rest of the flow is unchanged.
    - Change the SQL to bucket by month instead of week, or to split retention by plan tier with an extra grouping column.
    - Add a second threshold input that pages on call for a catastrophic drop while a smaller drop only posts to the analytics channel.
    - Store the matrix in a warehouse table with a JDBC load task so BI tools can query the same numbers the alert quotes.
    - Render the matrix as a chart image with a Python task and attach it to the Slack message.
    - Branch further with `io.kestra.plugin.core.flow.Switch` to open a ticket automatically on the flagged path.

    ## Links

    - https://kestra.io/plugins/plugin-jdbc-duckdb
    - https://duckdb.org/docs/core_extensions/parquet
    - https://kestra.io/docs/workflow-components/triggers
  tags:
    - Data
    - Business
  subTags:
    - Reporting & Digests
  ee: false
  demo: false
