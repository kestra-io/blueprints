id: gcp-iam-service-account-key-age-audit-sentinel
namespace: company.cloud

inputs:
  - id: project_id
    type: STRING
    description: Google Cloud Project ID to audit.
  - id: max_key_age_days
    type: INT
    defaults: 90
    description: Maximum acceptable service account key age in days before alerting (CIS benchmark 1.4).

tasks:
  - id: audit_service_account_keys
    type: io.kestra.plugin.gcp.cli.GCloudCLI
    projectId: "{{ inputs.project_id }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    commands:
      - |
        # List all service accounts in the project
        gcloud iam service-accounts list --format=json > /tmp/sa_list.json
        
        cat << 'EOF' > /tmp/audit_keys.py
        import json, subprocess, datetime, sys
        with open('/tmp/sa_list.json') as f:
            sas = json.load(f)
        
        now = datetime.datetime.now(datetime.timezone.utc)
        max_days = int(sys.argv[1])
        stale_keys = 0
        
        for sa in sas:
            email = sa.get('email')
            res = subprocess.run(['gcloud', 'iam', 'service-accounts', 'keys', 'list', f'--iam-account={email}', '--managed-by=user', '--format=json'], capture_output=True, text=True)
            if res.returncode == 0 and res.stdout.strip():
                try:
                    keys = json.loads(res.stdout)
                    for k in keys:
                        valid_after = k.get('validAfterTime')
                        if valid_after:
                            dt = datetime.datetime.fromisoformat(valid_after.replace('Z', '+00:00'))
                            age = (now - dt).days
                            if age >= max_days:
                                stale_keys += 1
                except:
                    pass
        print(stale_keys)
        EOF
        
        STALE_COUNT=$(python3 /tmp/audit_keys.py "{{ inputs.max_key_age_days }}" 2>/dev/null || echo 0)
        
        echo "::set-output name=stale_count::$STALE_COUNT::"

  - id: evaluate_key_rotation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_service_account_keys.vars.stale_count | int > 0 }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#security-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ Google Cloud IAM Service Account Stale Keys Alert",
                "text": "Project `{{ inputs.project_id }}` has *{{ outputs.audit_service_account_keys.vars.stale_count }}* user-managed service account keys exceeding {{ inputs.max_key_age_days }} days without rotation! Impact: Violates CIS GCP Benchmark 1.4 and SOC2 standards, increasing risk of credential exposure from hardcoded or leaked JSON key files.",
                "footer": "Kestra Security Sentinel • Google Cloud IAM"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#security-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Google Cloud IAM Service Account Key Age and Rotation Sentinel Pipeline Failure",
            "text": "Failed to audit GCP IAM service account keys. Check project permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      project_id: replace-with-your-project-id

extend:
  metaDescription: "Audits user-managed Google Cloud IAM service account keys to detect non-rotated credentials older than 90 days."
  metaTitle: Google Cloud IAM Service Account Key Age and Rotation Sentinel with Kestra
  title: Google Cloud IAM Service Account Key Age and Rotation Sentinel
  shortDescription: Audits user-managed Google Cloud IAM service account keys to detect non-rotated credentials older than 90 days.
  description: |
    ## How it works
    This workflow enumerates all service accounts in the project via `gcloud iam service-accounts list` and inspects user-managed keys with `gcloud iam service-accounts keys list --managed-by=user`. It calculates key ages against the configured rotation threshold (default 90 days per CIS Google Cloud Foundations Benchmark). Stale credentials represent significant security exposure if leaked. Slack is notified with the count of stale keys.

    ## What you get
    - Continuous audit of IAM service account key rotation compliance across your GCP project.
    - Enforces CIS GCP Benchmark 1.4 and SOC2 compliance mandates.
    - Prevents long-lived credential compromise from stale JSON key files.

    ## Who it's for
    - Cloud Security Engineers and Compliance Officers auditing GCP environments.
    - Platform Administrators maintaining IAM identity lifecycle hygiene.

    ## Why orchestrate this with Kestra
    - **Comprehensive Project-Wide Scanning**: Automatically iterates through all service accounts.
    - **Continuous Compliance Enforcement**: Run periodic audits without manual security reviews.
    - **Clear Actionable Diagnostics**: Dispatches precise compliance alerts directly to security teams.

    ## Prerequisites
    - GCP service account with `iam.serviceAccounts.list` and `iam.serviceAccountKeys.list`.
    - Secrets `GCP_SERVICE_ACCOUNT` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure project ID and max key age.
    3. Run the workflow to inspect service account key rotation.

    ## How to extend
    - Automatically disable keys exceeding 180 days after secondary notification.
    - Transition services to Workload Identity Federation to eliminate static keys entirely.

    ## Links
    - [CIS Google Cloud Platform Foundations Benchmark](https://cloud.google.com/security/compliance/cis-gcp-benchmark)
    - [Kestra GCloud CLI Plugin](https://kestra.io/plugins/plugin-gcp/io.kestra.plugin.gcp.gcloud.gcloudcli)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Policy & Compliance
    - GCP Services
  ee: false
  verified: false
  demo: false
