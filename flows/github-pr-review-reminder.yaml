id: github-pr-review-reminder
namespace: company.github

description: >-
  Monitor open GitHub pull requests, report overdue review requests and PRs
  without requested reviewers, and produce a Markdown report.

inputs:
  - id: repository_owner
    type: STRING
    displayName: GitHub Repository Owner
    description: GitHub organization or username that owns the repository.
    defaults: kestra-io
    required: true

  - id: repository_name
    type: STRING
    displayName: GitHub Repository Name
    description: Repository to monitor.
    defaults: blueprints
    required: true

  - id: review_threshold_hours
    type: INT
    displayName: Review Age Threshold (Hours)
    description: Flag requested reviews when the PR has been open at least this long.
    defaults: 48
    min: 1
    max: 720
    required: true

  - id: exclude_drafts
    type: BOOL
    displayName: Exclude Draft Pull Requests
    description: If true, omit draft PRs from both report sections.
    defaults: true
    required: true

triggers:
  - id: daily_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    description: Optional daily schedule; disabled until explicitly enabled.
    cron: "0 9 * * *"
    disabled: true

tasks:
  - id: collect_review_status
    type: io.kestra.plugin.scripts.python.Script
    description: Retrieve open PRs and review information, then create a Markdown report.
    timeout: PT15M
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install --quiet --no-cache-dir requests kestra
    env:
      GITHUB_TOKEN: "{{ secret('GITHUB_TOKEN') }}"
      REPOSITORY_OWNER: "{{ inputs.repository_owner }}"
      REPOSITORY_NAME: "{{ inputs.repository_name }}"
      REVIEW_THRESHOLD_HOURS: "{{ inputs.review_threshold_hours }}"
      EXCLUDE_DRAFTS: "{{ inputs.exclude_drafts }}"
    outputFiles:
      - review-report.md
    script: |
      import os
      import re
      import time
      from datetime import datetime, timezone
      from urllib.parse import quote

      import requests
      from requests.exceptions import RequestException
      from kestra import Kestra

      API_ROOT = "https://api.github.com"
      owner = os.environ.get("REPOSITORY_OWNER", "").strip()
      repo = os.environ.get("REPOSITORY_NAME", "").strip()
      token = os.environ.get("GITHUB_TOKEN", "").strip()
      threshold_raw = os.environ.get("REVIEW_THRESHOLD_HOURS", "48").strip()
      exclude_drafts = os.environ.get("EXCLUDE_DRAFTS", "true").strip().lower() == "true"

      # Validate inputs before making any network requests.
      if not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})", owner):
          raise ValueError("repository_owner must be a valid GitHub username or organization name.")
      if not re.fullmatch(r"[A-Za-z0-9._-]+", repo) or repo in {".", ".."}:
          raise ValueError("repository_name must be a valid GitHub repository name.")
      if not token:
          raise ValueError("GITHUB_TOKEN is empty. Configure the GITHUB_TOKEN secret in the company.github namespace.")
      try:
          threshold_hours = int(threshold_raw)
      except ValueError as exc:
          raise ValueError("review_threshold_hours must be an integer.") from exc
      if not 1 <= threshold_hours <= 720:
          raise ValueError("review_threshold_hours must be between 1 and 720.")

      session = requests.Session()
      session.headers.update({
          "Accept": "application/vnd.github+json",
          "Authorization": "Bearer " + token,
          "X-GitHub-Api-Version": "2022-11-28",
          "User-Agent": "kestra-pr-review-reminder",
      })

      def safe_error_message(response):
          # GitHub error bodies may contain implementation details; do not print headers or tokens.
          if response.status_code == 401:
              return "Authentication failed (HTTP 401). Check that GITHUB_TOKEN is valid."
          if response.status_code == 403:
              return "Access forbidden (HTTP 403). Check token permissions, repository access, and rate limits."
          if response.status_code == 404:
              return "Repository or API resource not found (HTTP 404). Check owner/name and token access."
          if response.status_code == 422:
              return "GitHub rejected the request (HTTP 422). Check the repository and request parameters."
          return f"GitHub API returned HTTP {response.status_code}. Check API status, permissions, and rate limits."

      def get_json(url, params=None, retries=4):
          """GET JSON with bounded retries for transient errors and GitHub rate limits."""
          last_error = None
          for attempt in range(retries):
              try:
                  response = session.get(url, params=params, timeout=(10, 30))
              except RequestException as exc:
                  last_error = exc
                  if attempt < retries - 1:
                      time.sleep(min(2 ** attempt, 8))
                      continue
                  raise RuntimeError(f"Network error contacting GitHub after {retries} attempts: {type(exc).__name__}.") from None

              remaining = response.headers.get("X-RateLimit-Remaining")
              is_primary_limit = response.status_code == 403 and remaining == "0"
              is_secondary_limit = response.status_code == 429 or (
                  response.status_code == 403 and "rate limit" in response.text.lower()
              )
              is_transient = response.status_code in (500, 502, 503, 504)

              if (is_primary_limit or is_secondary_limit or is_transient) and attempt < retries - 1:
                  retry_after = response.headers.get("Retry-After", "")
                  reset_at = response.headers.get("X-RateLimit-Reset", "")
                  if retry_after.isdigit():
                      wait_seconds = int(retry_after)
                  elif is_primary_limit and reset_at.isdigit():
                      wait_seconds = max(1, int(reset_at) - int(time.time()))
                  else:
                      wait_seconds = 2 ** attempt
                  # Avoid tying up a worker for a long time; fail clearly on the next attempt if still limited.
                  time.sleep(min(max(wait_seconds, 1), 30))
                  continue

              if not response.ok:
                  raise RuntimeError(safe_error_message(response))
              try:
                  return response.json()
              except ValueError:
                  raise RuntimeError("GitHub API returned a non-JSON response.") from None

          raise RuntimeError("GitHub API request failed after retries.")

      def paginated(url, params=None):
          """Use GitHub's Link header for pagination and guard against repeated pages."""
          items = []
          next_url = url
          next_params = dict(params or {})
          next_params["per_page"] = 100
          seen_urls = set()
          while next_url:
              response = get_response(next_url, next_params)
              if not isinstance(response, list):
                  raise RuntimeError("GitHub API returned an unexpected response; expected a list.")
              items.extend(response)
              link_header = response_response_headers.get("Link", "")
              next_link = None
              for part in link_header.split(","):
                  if 'rel="next"' in part:
                      match = re.search(r"<([^>]+)>", part)
                      if match:
                          next_link = match.group(1)
                      break
              if not next_link:
                  break
              if next_link in seen_urls:
                  raise RuntimeError("GitHub pagination repeated a page URL; stopping to avoid an infinite loop.")
              seen_urls.add(next_link)
              next_url = next_link
              next_params = None
          return items

      # Keep response metadata available to paginated() without leaking request headers.
      response_response_headers = {}
      def get_response(url, params=None):
          nonlocal_placeholder = None
          # Similar bounded retry behavior as get_json, while retaining Link headers.
          for attempt in range(4):
              try:
                  response = session.get(url, params=params, timeout=(10, 30))
              except RequestException as exc:
                  if attempt < 3:
                      time.sleep(min(2 ** attempt, 8))
                      continue
                  raise RuntimeError(f"Network error contacting GitHub after retries: {type(exc).__name__}.") from None
              limited = response.status_code == 429 or (
                  response.status_code == 403 and (
                      response.headers.get("X-RateLimit-Remaining") == "0" or "rate limit" in response.text.lower()
                  )
              )
              transient = response.status_code in (500, 502, 503, 504)
              if (limited or transient) and attempt < 3:
                  retry_after = response.headers.get("Retry-After", "")
                  reset_at = response.headers.get("X-RateLimit-Reset", "")
                  wait = int(retry_after) if retry_after.isdigit() else (
                      max(1, int(reset_at) - int(time.time())) if limited and reset_at.isdigit() else 2 ** attempt
                  )
                  time.sleep(min(max(wait, 1), 30))
                  continue
              if not response.ok:
                  raise RuntimeError(safe_error_message(response))
              try:
                  data = response.json()
              except ValueError:
                  raise RuntimeError("GitHub API returned a non-JSON response.") from None
              response_response_headers.clear()
              response_response_headers.update(response.headers)
              return data
          raise RuntimeError("GitHub API request failed after retries.")

      def parse_timestamp(value):
          if not value or not isinstance(value, str):
              return None
          try:
              parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=timezone.utc)
              return parsed.astimezone(timezone.utc)
          except (ValueError, TypeError):
              return None

      def markdown_cell(value):
          return str(value or "").replace("|", "\\|").replace("\r", " ").replace("\n", " ").strip()

      now = datetime.now(timezone.utc)
      threshold_seconds = threshold_hours * 3600
      base = f"{API_ROOT}/repos/{quote(owner, safe='')}/{quote(repo, safe='')}"
      pulls = paginated(base + "/pulls", {"state": "open", "sort": "created", "direction": "asc"})
      overdue_rows = []
      unassigned_rows = []
      skipped_drafts = 0
      skipped_invalid_dates = 0
      review_lookup_warnings = []

      for pr in pulls:
          if not isinstance(pr, dict):
              continue
          if exclude_drafts and pr.get("draft", False):
              skipped_drafts += 1
              continue

          number = pr.get("number")
          created_at = parse_timestamp(pr.get("created_at"))
          if not isinstance(number, int) or created_at is None:
              skipped_invalid_dates += 1
              continue

          # Future timestamps are clamped to age zero to avoid negative waiting times.
          age_seconds = max(0, int((now - created_at).total_seconds()))
          age_hours = age_seconds // 3600
          requested_users = sorted({
              item.get("login", "") for item in (pr.get("requested_reviewers") or [])
              if isinstance(item, dict) and item.get("login")
          }, key=str.lower)
          requested_teams = sorted({
              item.get("slug", "") for item in (pr.get("requested_teams") or [])
              if isinstance(item, dict) and item.get("slug")
          }, key=str.lower)
          reviewer_names = requested_users + [f"team:{team}" for team in requested_teams]

          latest_review_text = "Review history unavailable"
          reviews_url = base + f"/pulls/{number}/reviews"
          try:
              reviews = paginated(reviews_url)
              latest_by_user = {}
              for review in reviews:
                  if not isinstance(review, dict):
                      continue
                  login = (review.get("user") or {}).get("login") if isinstance(review.get("user"), dict) else None
                  submitted_at = parse_timestamp(review.get("submitted_at"))
                  if not login or submitted_at is None:
                      continue
                  old = latest_by_user.get(login)
                  if old is None or submitted_at > old["submitted_at"]:
                      latest_by_user[login] = {
                          "state": str(review.get("state") or "UNKNOWN").upper(),
                          "submitted_at": submitted_at,
                      }
              if not latest_by_user:
                  latest_review_text = "No submitted reviews"
              else:
                  login, latest = max(latest_by_user.items(), key=lambda item: item[1]["submitted_at"])
                  latest_review_text = f"{login}: {latest['state']} at {latest['submitted_at'].strftime('%Y-%m-%d %H:%M UTC')}"
          except RuntimeError as exc:
              review_lookup_warnings.append(f"PR #{number}: {str(exc)}")

          row = {
              "number": number,
              "title": pr.get("title") or "(untitled)",
              "url": pr.get("html_url") or f"https://github.com/{owner}/{repo}/pull/{number}",
              "age_hours": age_hours,
              "reviewers": reviewer_names,
              "last_review": latest_review_text,
          }
          if not reviewer_names:
              unassigned_rows.append(row)
          elif age_seconds >= threshold_seconds:
              overdue_rows.append(row)

      overdue_rows.sort(key=lambda item: (-item["age_hours"], item["number"]))
      unassigned_rows.sort(key=lambda item: (-item["age_hours"], item["number"]))

      lines = [
          f"# GitHub Pull Request Review Report: {owner}/{repo}", "",
          f"- Generated: {now.strftime('%Y-%m-%d %H:%M UTC')}",
          f"- Review threshold: {threshold_hours} hours",
          f"- Draft PRs excluded: {'Yes' if exclude_drafts else 'No'}",
          f"- Open PRs returned by GitHub: {len(pulls)}",
          f"- Draft PRs skipped: {skipped_drafts}",
          f"- PRs skipped due to missing/invalid number or creation timestamp: {skipped_invalid_dates}",
          f"- Overdue PRs with currently requested reviewers/teams: {len(overdue_rows)}",
          f"- PRs without currently requested reviewers/teams: {len(unassigned_rows)}", "",
          "## Overdue review requests", "",
      ]
      if overdue_rows:
          lines.extend([
              "| Pull request | Age since opened | Requested reviewers | Latest submitted review | Suggested action |",
              "|---|---:|---|---|---|",
          ])
          for row in overdue_rows:
              title = markdown_cell(row["title"])
              reviewers = markdown_cell(", ".join(row["reviewers"]))
              latest = markdown_cell(row["last_review"])
              lines.append(
                  f"| [#{row['number']} {title}]({row['url']}) | {row['age_hours']} h | {reviewers} | {latest} | Follow up with requested reviewer(s) |"
              )
      else:
          lines.append("No current review requests have reached the configured age threshold.")

      lines.extend(["", "## Open pull requests without requested reviewers", ""])
      if unassigned_rows:
          lines.extend([
              "| Pull request | Age since opened | Latest submitted review | Suggested action |",
              "|---|---:|---|---|",
          ])
          for row in unassigned_rows:
              title = markdown_cell(row["title"])
              latest = markdown_cell(row["last_review"])
              lines.append(
                  f"| [#{row['number']} {title}]({row['url']}) | {row['age_hours']} h | {latest} | Assign a reviewer/team if review is needed |"
              )
      else:
          lines.append("Every included open PR currently has at least one requested reviewer or team.")

      lines.extend(["", "## API warnings", ""])
      if review_lookup_warnings:
          lines.append("Some review histories could not be fetched; the report may be partial:")
          for warning in review_lookup_warnings:
              lines.append(f"- {markdown_cell(warning)}")
      else:
          lines.append("No per-PR review-history lookup errors.")

      lines.extend([
          "", "## Interpretation and limitations", "",
          "- Age is measured from PR creation time, not from when a draft became ready for review or when a reviewer was requested.",
          "- GitHub's current requested-reviewer fields are used; a submitted review does not necessarily clear a request in every repository workflow.",
          "- A PR without a requested reviewer is not automatically assumed to need review; the report flags it for triage.",
          "- If a review-history API call fails, the PR is still included but its latest-review field is marked unavailable.",
          "- This workflow is read-only: it does not comment, assign reviewers, change labels, or send notifications.",
          "",
      ])

      with open("review-report.md", "w", encoding="utf-8") as report_file:
          report_file.write("\n".join(lines))

      print("\n".join(lines))
      Kestra.outputs({
          "repository": f"{owner}/{repo}",
          "open_pull_requests_returned": len(pulls),
          "overdue_review_requests": len(overdue_rows),
          "pull_requests_without_requested_reviewers": len(unassigned_rows),
          "draft_pull_requests_skipped": skipped_drafts,
          "invalid_pull_requests_skipped": skipped_invalid_dates,
          "review_history_warnings": len(review_lookup_warnings),
          "report_file": "review-report.md",
      })

  - id: log_summary
    type: io.kestra.plugin.core.log.Log
    description: Log summary counts from the generated report.
    message: >-
      Repository {{ outputs.collect_review_status.vars.repository }}:
      {{ outputs.collect_review_status.vars.overdue_review_requests }} overdue review requests,
      {{ outputs.collect_review_status.vars.pull_requests_without_requested_reviewers }} PRs without requested reviewers.
      Review-history warnings: {{ outputs.collect_review_status.vars.review_history_warnings }}.
      See the review-report.md output file.

extend:
  title: GitHub Pull Request Review Reminder
  metaTitle: GitHub Pull Request Review Reminder with Kestra
  shortDescription: Monitor open GitHub pull requests for overdue review requests and missing reviewer assignments, then generate a Markdown report.
  metaDescription: Schedule read-only GitHub pull request monitoring with configurable review thresholds and a Markdown report using Kestra.
  description: |
    This Blueprint monitors open pull requests in a configurable GitHub repository, reports PRs with current review requests that have been open longer than a configurable threshold, separately lists PRs without requested reviewers, and creates a Markdown report. It uses read-only GitHub API access and does not modify repository data or send notifications.

    ## How it works
    1. Configure the repository inputs and the `GITHUB_TOKEN` Kestra secret.
    2. Run manually to test; the daily schedule is disabled by default.
    3. Fetch all pages of open pull requests and review histories.
    4. Optionally exclude draft pull requests.
    5. Report overdue PRs with requested reviewers and PRs without requested reviewers.
    6. Write `review-report.md` and log summary counts.

    ## Prerequisites
    - Kestra with the Python Script task and Docker task runner available.
    - Network access to `api.github.com` and Python package installation during task startup.
    - A GitHub token stored as the Kestra secret `GITHUB_TOKEN` in the flow's namespace. Grant only the read permissions needed for pull requests and reviews.

    ## Edge cases handled
    - Empty or malformed repository inputs and invalid review thresholds.
    - Missing token detected by the script; the Kestra secret itself must exist for template rendering.
    - Draft PR exclusion, missing reviewer arrays, missing titles, invalid timestamps, and future timestamps.
    - Pagination across multiple API pages with a repeated-page guard.
    - Bounded retries for transient network failures, HTTP 5xx responses, and rate limits.
    - Per-PR review-history failures are reported as warnings rather than silently hiding the PR.
    - Empty result sets produce explicit report messages.

    ## Limitations
    - Waiting time is measured from PR creation, not the time a reviewer was requested or a draft became ready.
    - The overdue list reflects currently requested reviewers/teams and does not infer ownership.
    - Notifications and reminder deduplication are outside this MVP.
  tags:
    - System
  subTags:
    - GitHub
  ee: false
  demo: false
