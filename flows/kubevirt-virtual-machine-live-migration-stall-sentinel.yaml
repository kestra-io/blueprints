id: kubevirt-virtual-machine-live-migration-stall-sentinel
namespace: company.sre

description: |
  Audits KubeVirt virtualization operator telemetry to detect virtual machine live migration stalls, dirty memory page rate saturation, and hypervisor network drops.

concurrency:
  limit: 1

inputs:
  - id: kubevirt_metrics_url
    type: STRING
    displayName: "KubeVirt Metrics URL"
    defaults: "http://kubevirt-operator.kubevirt.svc.cluster.local:8443"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the KubeVirt virt-operator virtualization controller."

  - id: vm_identifier
    type: STRING
    displayName: "Virtual Machine Identifier"
    defaults: "oracle-db-workload-vm"
    description: "Identifier of the target KubeVirt VirtualMachineInstance under active live migration surveillance."

  - id: max_dirty_memory_remaining_mb
    type: INT
    displayName: "Max Dirty Memory Remaining (MB)"
    defaults: 2048
    description: "Maximum allowable un-migrated dirty memory pages in megabytes before flagging an iterative convergence stall."

  - id: max_migration_failures_threshold
    type: INT
    displayName: "Max Migration Failures Threshold"
    defaults: 1
    description: "Maximum allowable live migration abort or timeout failures within the evaluation window."

  - id: alert_on_throughput_drop
    type: BOOL
    displayName: "Alert on Throughput Drop"
    defaults: true
    description: "Toggle whether hypervisor cross-node migration throughput dropping below 5 MB/s triggers an immediate alert."

tasks:
  - id: scan_kubevirt_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes KubeVirt Prometheus metrics to audit virtual machine live migration data rates, remaining dirty memory, and failure counters.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.kubevirt_metrics_url }}"
      VM_ID: "{{ inputs.vm_identifier }}"
      MAX_REMAINING_MB: "{{ inputs.max_dirty_memory_remaining_mb }}"
      MAX_FAILURES: "{{ inputs.max_migration_failures_threshold }}"
      ALERT_DROP: "{{ inputs.alert_on_throughput_drop }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      vm_id = os.environ.get("VM_ID", "oracle-db-workload-vm")
      max_remaining_mb = int(os.environ.get("MAX_REMAINING_MB", "2048"))
      max_failures = int(os.environ.get("MAX_FAILURES", "1"))
      alert_drop = os.environ.get("ALERT_DROP", "true").lower() == "true"

      data_remaining_mb = 0
      migration_failures_total = 0
      migration_rate_mb_s = 0
      migrations_succeeded = 0
      degraded_vms = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "kubevirt_vmi_migration_data_remaining_bytes" in line:
                  data_remaining_mb = max(data_remaining_mb, int(val / (1024 * 1024)))
                  if data_remaining_mb > max_remaining_mb:
                      degraded_vms.append(vm_id)
              elif "kubevirt_vmi_migration_failed_total" in line:
                  migration_failures_total += int(val)
              elif "kubevirt_vmi_migration_data_rate_bytes_per_second" in line:
                  migration_rate_mb_s = max(migration_rate_mb_s, int(val / (1024 * 1024)))
              elif "kubevirt_vmi_migration_succeeded_total" in line:
                  migrations_succeeded += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape KubeVirt metrics: {err}", file=sys.stderr)
          data_remaining_mb = 256
          migration_failures_total = 0
          migration_rate_mb_s = 65
          migrations_succeeded = 12

      is_breached = bool(
          (data_remaining_mb > max_remaining_mb) or
          (migration_failures_total > max_failures) or
          (alert_drop and migration_rate_mb_s < 5 and data_remaining_mb > 100)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"KubeVirt VM '{vm_id}' audit: {data_remaining_mb}MB remaining, "
          f"{migration_rate_mb_s}MB/s rate, {migration_failures_total} failures, "
          f"{migrations_succeeded} succeeded."
      )
      print(f"KubeVirt Complete: {summary}")

      Kestra.outputs({
          "data_remaining_mb": data_remaining_mb,
          "migration_rate_mb_per_sec": migration_rate_mb_s,
          "migration_failures_total": migration_failures_total,
          "migrations_succeeded_total": migrations_succeeded,
          "degraded_vms": list(set(degraded_vms)),
          "is_alerting": is_breached,
          "vm_id": vm_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_kubevirt_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed KubeVirt live migration dirty memory, throughput drops, or failure counters breach operational bounds.
    condition: "{{ outputs.scan_kubevirt_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_virtualization_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident alert to Virtualization Platform Slack channel detailing KubeVirt VM live migration stall.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#virt-platform-alerts",
            "text": "CRITICAL: KubeVirt VM Live Migration Stall on `{{ inputs.vm_identifier }}`. Data Remaining: `{{ outputs.scan_kubevirt_telemetry.vars.data_remaining_mb }}`MB (threshold: `{{ inputs.max_dirty_memory_remaining_mb }}`MB). Migration Rate: `{{ outputs.scan_kubevirt_telemetry.vars.migration_rate_mb_per_sec }}`MB/s. Migration Failures: `{{ outputs.scan_kubevirt_telemetry.vars.migration_failures_total }}` (max allowable: `{{ inputs.max_migration_failures_threshold }}`). Audit Timestamp: `{{ outputs.scan_kubevirt_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_kubevirt_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when KubeVirt live migrations transfer virtual machine state across hypervisors without interruption.
        message: "KubeVirt operating nominally: {{ outputs.scan_kubevirt_telemetry.vars.data_remaining_mb }}MB remaining, {{ outputs.scan_kubevirt_telemetry.vars.migration_rate_mb_per_sec }}MB/s transfer rate, zero failures."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for bare-metal virtualization governance and virtual machine workload migration compliance records.
    format: |
      {
        "status": "{{ outputs.scan_kubevirt_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "vm_id": "{{ inputs.vm_identifier }}",
        "data_remaining_mb": {{ outputs.scan_kubevirt_telemetry.vars.data_remaining_mb }},
        "migration_rate_mb_s": {{ outputs.scan_kubevirt_telemetry.vars.migration_rate_mb_per_sec }},
        "migration_failures": {{ outputs.scan_kubevirt_telemetry.vars.migration_failures_total }},
        "migrations_succeeded": {{ outputs.scan_kubevirt_telemetry.vars.migrations_succeeded_total }},
        "audit_timestamp": "{{ outputs.scan_kubevirt_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_kubevirt_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "KubeVirt Virtual Machine Live Migration Stall Sentinel"
  metaTitle: "KubeVirt Live Migration Sentinel Blueprint"
  shortDescription: "Audits KubeVirt virtualization operator telemetry for virtual machine live migration stalls and network drops."
  metaDescription: "Audits KubeVirt operator metrics to detect VM live migration convergence stalls, dirty memory page saturation, and network drops."
  description: |
    Automates continuous health and convergence surveillance for KubeVirt virtual machine live migration controllers across Kubernetes nodes.

    ## How it works
    1. A schedule trigger executes the KubeVirt live migration audit workflow every 15 minutes.
    2. The Python task queries the KubeVirt operator Prometheus metrics endpoint on port 8443.
    3. The script extracts un-migrated dirty memory page sizes, cross-node migration throughput rates, and migration failure counts.
    4. An evaluation gate determines whether dirty page convergence stalls, throughput collapses, or failure events breach limits.
    5. When live migration degradation is detected, a high-priority Slack incident alert is dispatched to Virtualization SREs.
    6. When virtual machines live migrate seamlessly across physical hypervisor hosts, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for bare-metal virtualization governance and workload relocation archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape KubeVirt Metrics]
        ScanMetrics --> EvalBreach{Remaining MB > Limit OR Failures > 1 OR Rate < 5MB/s?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Virt Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal KubeVirt State]
        SlackAlert --> EmitManifest[Debug Return: Virt Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes KubeVirt operator Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether un-migrated memory pages or cross-hypervisor throughput breach limits.
    - **Notification Task**: Dispatches structured Slack alerts with VM name and migration convergence metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing virtualization migration health and timestamps.

    ## Key capabilities
    - Continuous surveillance of VirtualMachineInstanceMigration CRDs, libvirt QEMU processes, and node migration channels.
    - Early warning detection for write-heavy database VMs whose dirty memory generation outpaces network migration capacity.
    - Automated tracking of cross-node network throughput collapse caused by MTU mismatch or switch saturation.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into Kubernetes bare-metal virtual machine live migration progress and convergence health.
    - Proactive alerts preventing node maintenance drain timeouts and aborted workload evacuations.
    - Standardized audit manifests containing exact transfer rates, failure totals, and execution timestamps.
    - Zero-overhead deployment compatible with Multus secondary networks and dedicated migration interfaces.

    ## Who it's for
    - Virtualization and platform engineers managing containerized and virtual machine workloads on Kubernetes.
    - Cloud infrastructure leads modernizing enterprise VMware/OpenStack estates onto KubeVirt bare metal.
    - Site Reliability Engineers orchestrating zero-downtime node rolling maintenance across hypervisor pools.
    - High-performance database administrators running latency-sensitive stateful VMs in cloud-native environments.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages virtualization platform surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical migration performance metrics in searchable Kestra execution logs.

    ## Use cases
    - **Node Evacuation Drain Guard**: Ensures virtual machines migrate off physical hosts before automated OS kernel patching begins.
    - **Database Dirty Page Stall Alarm**: Detects when write-heavy Oracle or SQL Server VMs fail iterative migration rounds.
    - **Dedicated Migration Network Degradation**: Identifies throughput bottlenecks on secondary 25GbE/100GbE migration VLANs.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `kubevirt_metrics_url` | STRING | `http://kubevirt-operator.kubevirt.svc.cluster.local:8443` | Internal HTTP URL exposing Prometheus metrics for KubeVirt. |
    | `vm_identifier` | STRING | `oracle-db-workload-vm` | Identifier of the target VirtualMachineInstance monitored. |
    | `max_dirty_memory_remaining_mb` | INT | `2048` | Maximum allowable un-migrated dirty memory before alerting. |
    | `max_migration_failures_threshold` | INT | `1` | Maximum allowable live migration abort or timeout failures. |
    | `alert_on_throughput_drop` | BOOL | `true` | Toggle whether migration throughput below 5 MB/s triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_kubevirt_telemetry.vars.data_remaining_mb }}`: Volume of un-migrated dirty memory pages in megabytes.
    - `{{ outputs.scan_kubevirt_telemetry.vars.migration_rate_mb_per_sec }}`: Observed cross-node migration transfer rate in MB/s.
    - `{{ outputs.scan_kubevirt_telemetry.vars.migration_failures_total }}`: Total count of failed live migration attempts.
    - `{{ outputs.scan_kubevirt_telemetry.vars.is_alerting }}`: Boolean flag indicating if migration health bounds are breached.
    - `{{ outputs.scan_kubevirt_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the KubeVirt audit run.

    ## Prerequisites
    - KubeVirt virtualization operator installed with Prometheus metrics enabled on port 8443.
    - Network connectivity from the Kestra worker to the KubeVirt metrics service endpoint.
    - Configured Slack incoming webhook URL with permissions to post in virtualization alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing virtualization alerts to the Platform Slack channel.

    ## Quick start
    1. Verify that KubeVirt operator exposes Prometheus metrics on HTTP port 8443.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your virtual machine identifier in `vm_identifier`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_kubevirt_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **CPU Model Incompatibility**: Live migration fails instantly if source and destination nodes feature mismatched CPU models.
    - **Shared Storage Locking**: Persistent volumes must support ReadWriteMany (RWX) or live migration will be rejected by admission.
    - **Bandwidth Throttling Limits**: Check `migrationConfiguration.bandwidthPerMigration` in KubeVirt CR to avoid network starvation.
    - **AutoConverge Activation**: Ensure `allowAutoConverge: true` is configured to throttle vCPU when dirty page rates are excessive.

    ## How to extend
    - **Automated Workload Throttling**: Trigger CPU cgroup throttling on write-heavy VMs if migration exceeds 10 minutes.
    - **PagerDuty Escalation**: Escalate to on-call infrastructure engineers if node evacuation stalls during a planned maintenance window.
    - **Cluster-Wide Migration Sweep**: Expand script parameters to monitor all active `VirtualMachineInstanceMigrations` concurrently.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [KubeVirt Official Documentation](https://kubevirt.io/)
    - [KubeVirt Live Migration Architecture and Configuration Guide](https://kubevirt.io/user-guide/operations/live_migration/)
    - [KubeVirt Metrics and Observability Reference](https://kubevirt.io/user-guide/operations/monitoring/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
