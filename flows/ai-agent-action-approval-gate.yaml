id: ai-agent-action-approval-gate
namespace: company.team
description: Put a human checkpoint in front of an AI agent's highest-impact actions. The agent platform
  submits each proposed action (shell command, database write, API call) before executing it; a deterministic
  Python classifier tiers the risk from the action itself, low and medium tiers are approved by policy
  and logged, and high and critical tiers pause the execution until a human approver resumes it, with
  kill or timeout meaning rejection. Every decision is written to an audit record and POSTed back to the
  platform, and critical approvals raise a Slack alert, so no destructive agent action ever runs on the
  agent's say-so alone.
triggers:
- id: on_agent_action
  type: io.kestra.plugin.core.trigger.Webhook
  description: 'The agent platform POSTs the proposed action before executing it: action id, agent name,
    action type, target, the exact command or payload, and the agent''s justification. Shipped with a
    keyed URL; treat the key as a secret.'
  key: '{{ secret(''ACTION_GATE_WEBHOOK_KEY'') }}'
inputs:
- id: callback_url
  type: STRING
  defaults: ''
  description: URL the verdict is POSTed to after a decision. Empty records the verdict in the audit output
    only (demo mode).
- id: decision_override
  type: STRING
  defaults: ''
  description: Leave empty in production. Reserved for demos and tests that drive the flow without a live
    agent platform.
tasks:
- id: gate_workspace
  type: io.kestra.plugin.core.flow.WorkingDirectory
  description: One shared directory so the verdict written by the classifier is exactly the record the
    callback task ships.
  tasks:
  - id: classify_risk
    type: io.kestra.plugin.scripts.python.Script
    description: Score the proposed action and tier it. Destructive operations, production targets, and
      privilege changes dominate the score; the weights are plain constants a reviewer can audit.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: "import json, re\nfrom kestra import Kestra\n\n# The proposed action arrives on the webhook\
      \ trigger body.\ntrigger = json.loads(\"\"\"{{ trigger.body }}\"\"\") if \"\"\"{{ trigger.body }}\"\
      \"\".strip() else {}\naction = {\n    \"action_id\": trigger.get(\"action_id\", \"demo-1\"),\n \
      \   \"agent\": trigger.get(\"agent\", \"demo-agent\"),\n    \"action_type\": trigger.get(\"action_type\"\
      , \"shell\"),\n    \"target\": trigger.get(\"target\", \"prod-db-1\"),\n    \"command\": trigger.get(\"\
      command\", \"DELETE FROM sessions WHERE expires < NOW()\"),\n    \"justification\": trigger.get(\"\
      justification\", \"Nightly cleanup of expired sessions.\"),\n}\n\ntext = (action[\"command\"] +\
      \ \" \" + action[\"target\"]).lower()\nscore = 0\nreasons = []\n\ndef hit(points, label, *patterns):\n\
      \    global score\n    for p in patterns:\n        if re.search(p, text):\n            score +=\
      \ points\n            reasons.append(label)\n            return\n\nhit(50, \"destructive data operation\"\
      , r\"\\bdrop\\s+(table|database)\\b\", r\"\\bdelete\\s+from\\b\", r\"\\btruncate\\b\", r\"rm\\s+-rf\"\
      , r\"\\bmkfs\\b\")\nhit(30, \"production target\", r\"\\bprod\\b\", r\"production\", r\"-prod-\"\
      , r\"prod-\")\nhit(25, \"privilege or access change\", r\"\\bsudo\\b\", r\"chmod\\s+777\", r\"\\\
      bgrant\\b\", r\"iam\", r\"passwd\")\nhit(20, \"bulk mutation\", r\"\\bupdate\\b.*\\bset\\b\", r\"\
      \\binsert\\s+into\\b\", r\"where\\s+1\\s*=\\s*1\")\nhit(15, \"network egress to unknown host\",\
      \ r\"curl\\s+https?://\", r\"wget\\s+https?://\", r\"nc\\s+\")\n\nif action[\"action_type\"] in\
      \ (\"shell\", \"database\"):\n    score += 10\n    reasons.append(\"executable action type: \" +\
      \ action[\"action_type\"])\n\ntier = \"critical\" if score >= 60 else \"high\" if score >= 35 else\
      \ \"medium\" if score >= 15 else \"low\"\nneeds_human = tier in (\"high\", \"critical\")\n\nwith\
      \ open(\"verdict.json\", \"w\") as f:\n    json.dump({\"action\": action, \"score\": score, \"tier\"\
      : tier, \"reasons\": reasons, \"needs_human\": needs_human}, f, indent=2)\n\nprint(\"action\", action[\"\
      action_id\"], \"score\", score, \"tier\", tier, \"needs_human\", needs_human)\nKestra.outputs({\"\
      tier\": tier, \"score\": score, \"needs_human\": needs_human, \"action_id\": action[\"action_id\"\
      ]})"
  - id: human_gate
    type: io.kestra.plugin.core.flow.If
    description: Only high and critical tiers wait for a person. Everything else is approved by policy
      and goes straight to the audit record.
    condition: '{{ outputs.classify_risk.vars.needs_human }}'
    then:
    - id: await_approver
      type: io.kestra.plugin.core.flow.Pause
      description: 'APPROVAL GATE. Review the action in the execution outputs (classify_risk): the exact
        command, its target, the risk tier and reasons, and the agent''s justification. Resume this execution
        to APPROVE. Kill it, or let it time out, to REJECT; a rejected action never runs.'
      timeout: PT4H
  - id: record_and_callback
    type: io.kestra.plugin.scripts.python.Script
    description: Write the audit record and POST the verdict to the platform callback. Reaching this task
      means APPROVED, either by policy or by a human resume.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: "import json, urllib.request\nfrom kestra import Kestra\n\nwith open(\"verdict.json\") as\
      \ f:\n    verdict = json.load(f)\n\ndecision = \"\"\"{{ inputs.decision_override }}\"\"\".strip()\
      \ or \"{{ flow.id }}\"\n# This task only runs on the path where the flow reached it:\n# auto-approved\
      \ (low/medium) or resumed by a human approver (high/critical).\nverdict[\"decision\"] = \"APPROVED\"\
      \nverdict[\"decided_by\"] = \"policy:auto\" if not verdict[\"needs_human\"] else \"human:resume\"\
      \n\npayload = json.dumps(verdict).encode()\nurl = \"\"\"{{ inputs.callback_url }}\"\"\"\nif url:\n\
      \    req = urllib.request.Request(url, data=payload, headers={\"Content-Type\": \"application/json\"\
      })\n    try:\n        urllib.request.urlopen(req, timeout=15)\n        print(\"callback delivered\"\
      )\n    except Exception as e:\n        print(\"callback failed (verdict still recorded):\", e)\n\
      \nwith open(\"audit.json\", \"w\") as f:\n    json.dump(verdict, f, indent=2)\nprint(json.dumps(verdict,\
      \ indent=2))\nKestra.outputs({\"decision\": verdict[\"decision\"], \"tier\": verdict[\"tier\"],\
      \ \"action_id\": verdict[\"action\"][\"action_id\"]})"
  - id: critical_alert_gate
    type: io.kestra.plugin.core.flow.If
    description: Critical-tier approvals are rare and risky by definition; the whole team hears about
      them.
    condition: '{{ outputs.classify_risk.vars.tier == ''critical'' }}'
    then:
    - id: slack_critical_approval
      type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
      description: Broadcast that a critical agent action was approved, with its id and tier.
      url: '{{ secret(''SLACK_WEBHOOK'') }}'
      payload: '{"text": ":warning: CRITICAL agent action APPROVED through the gate. Action {{ outputs.classify_risk.vars.action_id
        }}, tier critical. Full record in the execution audit output."}'
labels:
  system.template: 'true'
documentation:
- "    ## Why this blueprint exists\n\n\n    Agents are most dangerous at the moment they act: a shell\
  \ command, a database\n    write, a payment call. Prompt filters and output scanners help, but some\
  \ actions\n    should simply never run without a person saying yes. This blueprint is that\n    checkpoint.\
  \ The agent platform submits every proposed high-impact action before\n    executing it; a deterministic\
  \ risk classifier tiers the action; low and medium\n    tiers are approved by policy and logged, while\
  \ high and critical tiers pause\n    the execution until a human approver resumes it. Killing the paused\
  \ execution,\n    or letting it time out, is a rejection: deny by default.\n\n\n    ## How it works\n\
  \n\n    1. `on_agent_action` (`io.kestra.plugin.core.trigger.Webhook`) receives the\n    proposed action:\
  \ agent name, action type, target, the exact command or payload,\n    and the agent's own justification.\n\
  \n    2. `classify_risk` (`io.kestra.plugin.scripts.python.Script`) scores the action\n    with weighted\
  \ patterns (destructive data operations, production targets,\n    privilege changes, bulk mutations,\
  \ unknown egress) and assigns a tier: low,\n    medium, high, or critical.\n\n    3. `human_gate` (`io.kestra.plugin.core.flow.If`)\
  \ routes high and critical\n    tiers to `await_approver` (`io.kestra.plugin.core.flow.Pause`). The\
  \ execution\n    waits, showing the approver the full action and its risk reasons. Resume means\n  \
  \  approve; kill or timeout means reject, and the action never runs.\n\n    4. `record_and_callback`\
  \ (`io.kestra.plugin.scripts.python.Script`) writes the\n    audit record and POSTs the verdict to the\
  \ platform callback URL, so the agent\n    proceeds only on an explicit APPROVED decision.\n\n    5.\
  \ Critical approvals also raise a Slack alert, so the riskiest approvals are\n    visible to the whole\
  \ team, not only the approver.\n\n\n    ## Operating notes\n\n\n    - The four-AI-guardrail set: the\
  \ input firewall screens what reaches the agent,\n    the output gate screens what leaves it, the red-team\
  \ harness tests resistance\n    weekly, and this gate governs the actions themselves.\n\n    - Tune\
  \ the classifier weights to your estate; the pattern list is deliberately\n    readable so a security\
  \ engineer can defend every point in review.\n\n    - Webhook key, callback URL, and Slack webhook are\
  \ secrets in production.\n"
tags:
- AI
- Security
