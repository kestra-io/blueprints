id: dragonfly-snapshot-save-lag-sentinel
namespace: company.team
description: Audits Dragonfly cache persistence telemetry to flag prolonged background snapshot execution durations causing memory copy-on-write bloat.

inputs:
  - id: dragonfly_host
    type: STRING
    defaults: dragonfly.internal
  - id: dragonfly_port
    type: INT
    defaults: 6379
  - id: max_bgsave_sec_threshold
    type: INT
    defaults: 60

tasks:
  - id: audit_dragonfly
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects Dragonfly persistence statistics to detect background save execution lag.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install redis kestra
    env:
      DRAGONFLY_HOST: "{{ inputs.dragonfly_host }}"
      DRAGONFLY_PORT: "{{ inputs.dragonfly_port }}"
      DRAGONFLY_PASSWORD: "{{ secret('DRAGONFLY_PASSWORD') }}"
    outputFiles:
      - df_persist_health.json
    script: |
      import os
      import sys
      import json
      import redis
      from kestra import Kestra

      host = os.environ.get("DRAGONFLY_HOST", "dragonfly.internal")
      port = int(os.environ.get("DRAGONFLY_PORT", 6379))
      password = os.environ.get("DRAGONFLY_PASSWORD") or None

      try:
          client = redis.Redis(
              host=host,
              port=port,
              password=password,
              socket_connect_timeout=10,
              socket_timeout=10,
              decode_responses=True
          )
          persist = client.info(section="persistence")
      except Exception as err:
          print(f"ERROR: Failed to connect to Dragonfly at {host}:{port}: {err}", file=sys.stderr)
          sys.exit(1)

      save_in_progress = int(persist.get("rdb_bgsave_in_progress", 0))
      last_save_time = int(persist.get("rdb_last_bgsave_time_sec", 0))

      report = {
          "bgsave_in_progress": save_in_progress,
          "last_save_sec": last_save_time
      }
      with open("df_persist_health.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      print(f"Dragonfly persistence: in_progress={save_in_progress}, last_save={last_save_time}s")

      Kestra.outputs(report)

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_dragonfly.vars.last_save_sec > inputs.max_bgsave_sec_threshold }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "Dragonfly Snapshot Save Execution Lag\n*Host:* {{ inputs.dragonfly_host }}:{{ inputs.dragonfly_port }}\n*Last Bgsave Duration:* {{ outputs.audit_dragonfly.vars.last_save_sec }}s\n*Save in Progress:* {{ outputs.audit_dragonfly.vars.bgsave_in_progress }}\n*Threshold:* {{ inputs.max_bgsave_sec_threshold }}s\n*Risk:* High copy-on-write memory overhead during disk serialization."
          }

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Execution Failure: Dragonfly In-Memory Cache Snapshot Fork Duration Sentinel\n*Execution ID:* `{{ execution.id }}`\n*State:* `{{ execution.state.current }}`\n*Error:* Sentinel inspection encountered an unhandled execution error."
      }

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Dragonfly cache persistence telemetry via redis-cli to flag prolonged background snapshot execution durations causing memory copy-on-write bloat."
  metaTitle: Dragonfly In-Memory Cache Snapshot Fork Duration Sentinel with Kestra
  title: Dragonfly In-Memory Cache Snapshot Fork Duration Sentinel
  shortDescription: Audits Dragonfly cache persistence telemetry to flag prolonged background snapshot execution durations.
  description: |
    ## How it works
    This automated sentinel flow continuously assesses operational health, metrics, and capacity parameters for **Dragonfly In-Memory Cache Snapshot Fork Duration Sentinel**. It runs authentic CLI probes or REST telemetry inspections directly against the running infrastructure instance, parses the JSON response using native jq or schema tooling, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`, and triggers instant Slack notifications with actionable contextual diagnostics when anomalies or threshold violations occur.

    ## Prerequisites
    - Accessible network route from the Kestra worker to the target service instance.
    - Active Slack Incoming Webhook URL configured as `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into Kestra under the `company.team` namespace.
    2. Configure required secrets (`SLACK_WEBHOOK`, `DRAGONFLY_PASSWORD`).
    3. Review and adjust input parameters.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
