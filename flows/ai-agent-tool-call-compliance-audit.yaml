id: ai-agent-tool-call-compliance-audit
namespace: company.team
description: |
  Audit what your AI agents actually did. On a schedule, this flow loads the tool-call policy
  (allowed and forbidden tools, per-agent entitlements, argument constraints, forbidden targets), ingests
  the recorded tool calls from your agent platform, and evaluates every call against the policy with
  deterministic rules. The run produces a compliance scorecard artifact with pass rates per rule and per
  agent, the full violation list with severities, and a trend against the previous audit. A failed gate
  (compliance below the minimum, or any critical violation) opens a GitHub issue and pages Slack, so
  policy drift is caught by the audit, not by an incident.
  Pick this over agent-tool-call-audit when you need a periodic governance record: that flow audits
  one agent run as it finishes, through a webhook, with a per-run verdict and a call budget. This flow
  audits a whole period of recorded calls on a weekly schedule, against a structured policy with
  per-agent entitlements and argument constraints, and produces per-rule and per-agent rates with a
  trend. For a single run, the existing flow is enough; for weekly proof across agents, use this one.
  What it does: it is the scheduled audit that proves agents stayed within their authority, complementing
  the red-team probe harness (resistance to attacks) and the golden-prompt regression harness (functional
  correctness). Prerequisites: a JSONL export of recorded tool calls from your agent platform and a
  tool-call policy, plus namespace secrets for the GitHub tracking repository and the Slack alert channel.
  How it works: load and validate the policy, ingest and normalise the recorded calls, evaluate every
  call with five deterministic rules, build the scorecard, and on a failed gate escalate in parallel to
  GitHub and Slack. How to adapt it: shape the policy to your organisation with policy_override, tune
  min_compliance_rate to your bar, and point each run at the previous scorecard so the trend builds.
triggers:
  - id: weekly_compliance_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly Monday 06:00 UTC compliance audit over the recorded agent tool calls; point the
      log input at a rolling export so each run covers the week since the last audit.
    cron: 0 6 * * 1
inputs:
  - id: tool_call_log_url
    type: STRING
    defaults: ''
    description: URL (http, https, or file) of the recorded tool calls as JSONL, one call per line with
      call_id, timestamp, agent, tool, and an arguments object. Empty runs the audit on the bundled
      sample log so the flow works end to end with no platform connected.
  - id: tool_calls_override
    type: STRING
    defaults: ''
    description: Inline JSONL tool calls, taking precedence over the URL. Reserved for demos and tests.
  - id: policy_override
    type: STRING
    defaults: ''
    description: Inline JSON tool-call policy replacing the bundled default policy (allowed tools,
      forbidden tools, agent entitlements, argument constraints, forbidden targets).
  - id: min_compliance_rate
    type: INT
    defaults: 95
    description: Minimum overall compliance rate (percent) to pass the gate. Any critical violation
      fails the gate regardless of the rate.
  - id: previous_scorecard_url
    type: STRING
    defaults: ''
    description: URL (http, https, or file) of the previous run's scorecard.json, used for the trend
      comparison. Empty records this run as the baseline.
  - id: github_repository
    type: STRING
    defaults: acme/platform-security
    description: Repository that receives the tracking issue when the audit gate fails.
tasks:
  - id: audit_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the policy, the ingested calls, the verdicts, and the
      scorecard are the same files every stage reads.
    tasks:
      - id: load_policy
        type: io.kestra.plugin.scripts.python.Script
        description: "Load the tool-call policy (override or the bundled default), validate its structure and regexes, and write policy.json for the evaluation stage."
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          POLICY_OVERRIDE: '{{ inputs.policy_override }}'
        script: |
          import json
          import os
          import re

          DEFAULT_POLICY = {
              "version": "2026.10",
              "allowed_tools": [
                  "web_search",
                  "read_file",
                  "write_file",
                  "run_sql_query",
                  "send_email",
                  "http_request",
                  "create_ticket",
              ],
              "forbidden_tools": ["execute_shell", "delete_file", "transfer_funds"],
              "agent_entitlements": {
                  "support-agent": ["web_search", "read_file", "create_ticket"],
                  "data-agent": ["read_file", "run_sql_query"],
                  "*": ["web_search", "read_file"],
              },
              "argument_constraints": [
                  {
                      "tool": "run_sql_query",
                      "argument": "query",
                      "forbidden_patterns": [r"\bDROP\s+TABLE\b", r"\bDELETE\s+FROM\b", r"\bTRUNCATE\s+TABLE\b"],
                      "severity": "critical",
                      "description": "destructive SQL statements are never permitted",
                  },
                  {
                      "tool": "write_file",
                      "argument": "path",
                      "allowed_prefixes": ["/workspace/", "/tmp/"],
                      "severity": "high",
                      "description": "file writes must stay inside approved roots",
                  },
                  {
                      "tool": "send_email",
                      "argument": "recipients",
                      "max_items": 5,
                      "severity": "medium",
                      "description": "email fan-out above 5 recipients needs a broadcast approval",
                  },
                  {
                      "tool": "*",
                      "argument": "*",
                      "max_value_length": 8000,
                      "severity": "low",
                      "description": "argument payloads above 8000 characters suggest unreviewed bulk data",
                  },
              ],
              "forbidden_targets": [
                  {
                      "argument": "url",
                      "patterns": [r"169\.254\.169\.254", r"metadata\.google\.internal"],
                      "severity": "critical",
                      "description": "cloud metadata endpoints",
                  },
                  {
                      "argument": "path",
                      "patterns": [r"^/etc/", r"^/root/", r"\.ssh/"],
                      "severity": "critical",
                      "description": "sensitive filesystem paths",
                  },
                  {
                      "argument": "host",
                      "patterns": [r"\.internal\.corp$", r"^10\.", r"^192\.168\."],
                      "severity": "high",
                      "description": "internal network targets",
                  },
              ],
          }

          SEVERITIES = {"critical", "high", "medium", "low"}


          def validate(policy):
              for key in ("allowed_tools", "forbidden_tools", "agent_entitlements", "argument_constraints", "forbidden_targets"):
                  if key not in policy:
                      raise ValueError("policy is missing required key: %s" % key)
              for entry in policy["argument_constraints"] + policy["forbidden_targets"]:
                  if entry.get("severity") not in SEVERITIES:
                      raise ValueError("invalid severity in policy entry: %s" % entry)
                  for pattern in entry.get("forbidden_patterns", []) + entry.get("patterns", []):
                      re.compile(pattern)


          override = (os.environ.get("POLICY_OVERRIDE") or "").strip()
          policy = json.loads(override) if override else DEFAULT_POLICY
          validate(policy)

          with open("policy.json", "w", encoding="utf-8") as handle:
              json.dump(policy, handle, indent=2)

          print("loaded tool-call policy version %s: %d allowed tools, %d forbidden tools, %d argument constraints, %d forbidden-target rules"
                % (policy.get("version", "unversioned"), len(policy["allowed_tools"]), len(policy["forbidden_tools"]),
                   len(policy["argument_constraints"]), len(policy["forbidden_targets"])))
          print("::" + json.dumps({"outputs": {
              "policy_version": str(policy.get("version", "unversioned")),
              "allowed_tool_count": len(policy["allowed_tools"]),
              "constraint_count": len(policy["argument_constraints"]),
          }}) + "::")
      - id: ingest_tool_calls
        type: io.kestra.plugin.scripts.python.Script
        description: "Ingest the recorded tool calls from the log URL, the inline override, or the bundled sample log. Records are normalized (string-encoded arguments are parsed), validated, and sorted into calls.jsonl; malformed records are counted, never silently dropped."
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          TOOL_CALL_LOG_URL: '{{ inputs.tool_call_log_url }}'
          TOOL_CALLS_OVERRIDE: '{{ inputs.tool_calls_override }}'
        script: |
          import json
          import os
          import urllib.request

          SAMPLE_CALLS = [
              {"call_id": "c-001", "timestamp": "2026-10-19T09:02:11Z", "agent": "support-agent", "tool": "web_search",
               "arguments": {"query": "reset password steps for locked accounts"}},
              {"call_id": "c-002", "timestamp": "2026-10-19T09:03:40Z", "agent": "support-agent", "tool": "read_file",
               "arguments": {"path": "/workspace/notes/account-recovery.md"}},
              {"call_id": "c-003", "timestamp": "2026-10-19T09:05:02Z", "agent": "support-agent", "tool": "create_ticket",
               "arguments": {"title": "Customer locked out after MFA reset", "priority": "high"}},
              {"call_id": "c-004", "timestamp": "2026-10-19T10:14:55Z", "agent": "data-agent", "tool": "run_sql_query",
               "arguments": {"query": "SELECT order_id, total FROM orders WHERE customer_id = 42"}},
              {"call_id": "c-005", "timestamp": "2026-10-19T10:15:31Z", "agent": "data-agent", "tool": "read_file",
               "arguments": {"path": "/workspace/data/orders-export.csv"}},
              {"call_id": "c-006", "timestamp": "2026-10-19T11:40:08Z", "agent": "research-agent", "tool": "web_search",
               "arguments": {"query": "churn benchmarks for B2B SaaS 2026"}},
              {"call_id": "c-007", "timestamp": "2026-10-19T11:44:19Z", "agent": "research-agent", "tool": "read_file",
               "arguments": {"path": "/tmp/export.csv"}},
              {"call_id": "c-008", "timestamp": "2026-10-19T13:22:47Z", "agent": "support-agent", "tool": "web_search",
               "arguments": {"query": "SSO token expiry defaults"}},
              {"call_id": "c-009", "timestamp": "2026-10-19T14:03:12Z", "agent": "data-agent", "tool": "run_sql_query",
               "arguments": {"query": "SELECT c.name, COUNT(*) FROM customers c JOIN orders o ON o.customer_id = c.id GROUP BY c.name"}},
              {"call_id": "c-010", "timestamp": "2026-10-19T14:31:59Z", "agent": "support-agent", "tool": "create_ticket",
               "arguments": {"title": "Follow up on SSO token question", "priority": "normal"}},
              {"call_id": "c-101", "timestamp": "2026-10-19T15:02:26Z", "agent": "support-agent", "tool": "send_email",
               "arguments": {"recipients": ["customer@example.com"], "subject": "Your account recovery"}},
              {"call_id": "c-102", "timestamp": "2026-10-19T15:20:41Z", "agent": "data-agent", "tool": "run_sql_query",
               "arguments": {"query": "DROP TABLE orders_archive"}},
              {"call_id": "c-103", "timestamp": "2026-10-19T16:08:03Z", "agent": "research-agent", "tool": "http_request",
               "arguments": {"url": "http://169.254.169.254/latest/meta-data/iam/security-credentials/", "method": "GET"}},
              {"call_id": "c-104", "timestamp": "2026-10-19T16:12:37Z", "agent": "research-agent", "tool": "execute_shell",
               "arguments": {"command": "env | sort"}},
              {"call_id": "c-105", "timestamp": "2026-10-19T16:45:50Z", "agent": "support-agent", "tool": "read_file",
               "arguments": {"path": "/etc/passwd"}},
              {"call_id": "c-106", "timestamp": "2026-10-19T17:05:14Z", "agent": "data-agent", "tool": "send_email",
               "arguments": {"recipients": ["a@example.com", "b@example.com", "c@example.com", "d@example.com",
                                            "e@example.com", "f@example.com", "g@example.com", "h@example.com"],
                             "subject": "Weekly data digest"}},
          ]


          def load_lines():
              override = (os.environ.get("TOOL_CALLS_OVERRIDE") or "").strip()
              if override:
                  return override.splitlines(), "inline override"
              url = (os.environ.get("TOOL_CALL_LOG_URL") or "").strip()
              if url:
                  if url.startswith(("http://", "https://")):
                      with urllib.request.urlopen(url, timeout=60) as response:
                          return response.read().decode("utf-8").splitlines(), url
                  path = url[len("file://"):] if url.startswith("file://") else url
                  with open(path, encoding="utf-8") as handle:
                      return handle.read().splitlines(), url
              return [json.dumps(call) for call in SAMPLE_CALLS], "bundled sample log"


          lines, source = load_lines()
          calls = []
          invalid = []
          for number, line in enumerate(lines, start=1):
              if not line.strip():
                  continue
              try:
                  record = json.loads(line)
              except json.JSONDecodeError as exc:
                  invalid.append({"line": number, "reason": "invalid JSON: %s" % exc})
                  continue
              arguments = record.get("arguments")
              if isinstance(arguments, str):
                  try:
                      arguments = json.loads(arguments)
                  except json.JSONDecodeError:
                      arguments = None
              if not record.get("call_id") or not record.get("agent") or not record.get("tool") or not isinstance(arguments, dict):
                  invalid.append({"line": number, "reason": "missing call_id/agent/tool or arguments is not an object"})
                  continue
              record["arguments"] = arguments
              calls.append(record)

          calls.sort(key=lambda call: call.get("timestamp", ""))
          with open("calls.jsonl", "w", encoding="utf-8") as handle:
              for call in calls:
                  handle.write(json.dumps(call) + "\n")
          with open("invalid_records.json", "w", encoding="utf-8") as handle:
              json.dump(invalid, handle, indent=2)

          agents = sorted({call["agent"] for call in calls})
          print("ingested %d tool calls from %s (%d invalid records skipped); agents: %s"
                % (len(calls), source, len(invalid), ", ".join(agents)))
          print("::" + json.dumps({"outputs": {
              "call_count": len(calls),
              "invalid_count": len(invalid),
              "agents": agents,
          }}) + "::")
      - id: evaluate_calls
        type: io.kestra.plugin.scripts.python.Script
        description: "Evaluate every call against the policy with five deterministic rules: forbidden tools, the tool allowlist, per-agent entitlements, argument constraints (forbidden patterns, allowed path prefixes, fan-out and payload limits), and forbidden targets (cloud metadata endpoints, sensitive paths, internal hosts). Writes verdicts.jsonl and violations.json."
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          import json
          import re

          SEVERITY_RANK = {"low": 1, "medium": 2, "high": 3, "critical": 4}

          with open("policy.json", encoding="utf-8") as handle:
              policy = json.load(handle)
          with open("calls.jsonl", encoding="utf-8") as handle:
              calls = [json.loads(line) for line in handle if line.strip()]

          allowed = set(policy["allowed_tools"])
          forbidden = set(policy["forbidden_tools"])
          entitlements = policy["agent_entitlements"]
          constraints = policy["argument_constraints"]
          target_rules = policy["forbidden_targets"]
          target_arguments = {entry["argument"] for entry in target_rules}


          def text_of(value):
              return value if isinstance(value, str) else json.dumps(value)


          def evaluate(call):
              tool = call["tool"]
              agent = call["agent"]
              arguments = call["arguments"]
              violations = []
              evaluated = {"forbidden_tool", "tool_allowlist"}

              def add(rule, severity, detail):
                  violations.append({
                      "call_id": call["call_id"],
                      "timestamp": call.get("timestamp", ""),
                      "agent": agent,
                      "tool": tool,
                      "rule": rule,
                      "severity": severity,
                      "detail": detail,
                  })

              if tool in forbidden:
                  add("forbidden_tool", "critical", "tool '%s' is on the forbidden list" % tool)
              elif tool not in allowed:
                  add("tool_allowlist", "high", "tool '%s' is not on the allowlist" % tool)

              if tool in allowed:
                  evaluated.add("agent_entitlement")
                  entitled = entitlements.get(agent, entitlements.get("*"))
                  if entitled is not None and tool not in entitled:
                      add("agent_entitlement", "high",
                          "agent '%s' is not entitled to use '%s'" % (agent, tool))

              matched_constraint = False
              for constraint in constraints:
                  if constraint["tool"] not in (tool, "*"):
                      continue
                  argument = constraint["argument"]
                  if argument == "*":
                      matched_constraint = True
                      limit = constraint.get("max_value_length")
                      if limit:
                          for key, value in arguments.items():
                              if len(text_of(value)) > limit:
                                  add("argument_constraint", constraint["severity"],
                                      "%s (argument '%s' is %d characters, limit %d)"
                                      % (constraint["description"], key, len(text_of(value)), limit))
                      continue
                  if argument not in arguments:
                      continue
                  matched_constraint = True
                  value = arguments[argument]
                  for pattern in constraint.get("forbidden_patterns", []):
                      if re.search(pattern, text_of(value), re.IGNORECASE):
                          add("argument_constraint", constraint["severity"],
                              "%s (pattern '%s' matched argument '%s')" % (constraint["description"], pattern, argument))
                  prefixes = constraint.get("allowed_prefixes")
                  if prefixes and not any(text_of(value).startswith(prefix) for prefix in prefixes):
                      add("argument_constraint", constraint["severity"],
                          "%s (argument '%s' value '%s' is outside %s)"
                          % (constraint["description"], argument, text_of(value), ", ".join(prefixes)))
                  max_items = constraint.get("max_items")
                  if max_items and isinstance(value, list) and len(value) > max_items:
                      add("argument_constraint", constraint["severity"],
                          "%s (argument '%s' has %d items, limit %d)"
                          % (constraint["description"], argument, len(value), max_items))
              if matched_constraint:
                  evaluated.add("argument_constraint")

              if target_arguments & set(arguments):
                  evaluated.add("forbidden_target")
                  for entry in target_rules:
                      argument = entry["argument"]
                      if argument not in arguments:
                          continue
                      text = text_of(arguments[argument])
                      for pattern in entry["patterns"]:
                          if re.search(pattern, text, re.IGNORECASE):
                              add("forbidden_target", entry["severity"],
                                  "%s (argument '%s' value '%s' matched '%s')"
                                  % (entry["description"], argument, text, pattern))
                              break

              return {
                  "call_id": call["call_id"],
                  "timestamp": call.get("timestamp", ""),
                  "agent": agent,
                  "tool": tool,
                  "compliant": not violations,
                  "max_severity": max((v["severity"] for v in violations), key=lambda s: SEVERITY_RANK[s], default=None),
                  "evaluated_rules": sorted(evaluated),
                  "violations": violations,
              }


          verdicts = [evaluate(call) for call in calls]
          all_violations = [violation for verdict in verdicts for violation in verdict["violations"]]

          with open("verdicts.jsonl", "w", encoding="utf-8") as handle:
              for verdict in verdicts:
                  handle.write(json.dumps(verdict) + "\n")
          with open("violations.json", "w", encoding="utf-8") as handle:
              json.dump(all_violations, handle, indent=2)

          compliant = sum(1 for verdict in verdicts if verdict["compliant"])
          critical = sum(1 for v in all_violations if v["severity"] == "critical")
          high = sum(1 for v in all_violations if v["severity"] == "high")
          print("evaluated %d calls: %d compliant, %d non-compliant, %d violations (%d critical, %d high)"
                % (len(verdicts), compliant, len(verdicts) - compliant, len(all_violations), critical, high))
          print("::" + json.dumps({"outputs": {
              "total_calls": len(verdicts),
              "compliant_calls": compliant,
              "non_compliant_calls": len(verdicts) - compliant,
              "total_violations": len(all_violations),
              "critical_violations": critical,
              "high_violations": high,
          }}) + "::")
      - id: build_scorecard
        type: io.kestra.plugin.scripts.python.Script
        description: "Aggregate the verdicts into the scorecard artifact: overall compliance rate and gate verdict, pass rates per rule, compliance per agent, the full violation list, and a trend against the previous scorecard. Writes scorecard.json and scorecard.md."
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          MIN_COMPLIANCE_RATE: '{{ inputs.min_compliance_rate }}'
          PREVIOUS_SCORECARD_URL: '{{ inputs.previous_scorecard_url }}'
        script: |
          import json
          import os
          import urllib.request

          RULES = ["forbidden_tool", "tool_allowlist", "agent_entitlement", "argument_constraint", "forbidden_target"]

          with open("verdicts.jsonl", encoding="utf-8") as handle:
              verdicts = [json.loads(line) for line in handle if line.strip()]
          with open("violations.json", encoding="utf-8") as handle:
              violations = json.load(handle)
          with open("policy.json", encoding="utf-8") as handle:
              policy = json.load(handle)

          total = len(verdicts)
          compliant = sum(1 for verdict in verdicts if verdict["compliant"])
          rate = round(100.0 * compliant / total, 1) if total else 100.0
          critical = sum(1 for v in violations if v["severity"] == "critical")
          high = sum(1 for v in violations if v["severity"] == "high")

          per_rule = {}
          for rule in RULES:
              evaluated = sum(1 for verdict in verdicts if rule in verdict["evaluated_rules"])
              flagged = {v["call_id"] for v in violations if v["rule"] == rule}
              count = sum(1 for v in violations if v["rule"] == rule)
              per_rule[rule] = {
                  "evaluated_calls": evaluated,
                  "violations": count,
                  "flagged_calls": len(flagged),
                  "pass_rate": round(100.0 * (evaluated - len(flagged)) / evaluated, 1) if evaluated else None,
              }

          per_agent = {}
          for verdict in verdicts:
              stats = per_agent.setdefault(verdict["agent"], {"calls": 0, "compliant": 0, "violations": 0,
                                                              "critical": 0, "high": 0, "medium": 0, "low": 0})
              stats["calls"] += 1
              stats["compliant"] += 1 if verdict["compliant"] else 0
          for violation in violations:
              stats = per_agent[violation["agent"]]
              stats["violations"] += 1
              stats[violation["severity"]] += 1
          for stats in per_agent.values():
              stats["compliance_rate"] = round(100.0 * stats["compliant"] / stats["calls"], 1) if stats["calls"] else 100.0

          minimum = float(os.environ.get("MIN_COMPLIANCE_RATE", "95"))
          gate_passed = rate >= minimum and critical == 0

          trend = {"verdict": "baseline", "previous_rate": None, "delta_rate": None,
                   "previous_critical": None, "delta_critical": None}
          previous_url = (os.environ.get("PREVIOUS_SCORECARD_URL") or "").strip()
          if previous_url:
              try:
                  if previous_url.startswith(("http://", "https://")):
                      with urllib.request.urlopen(previous_url, timeout=60) as response:
                          previous = json.loads(response.read().decode("utf-8"))
                  else:
                      path = previous_url[len("file://"):] if previous_url.startswith("file://") else previous_url
                      with open(path, encoding="utf-8") as handle:
                          previous = json.load(handle)
                  prev_rate = float(previous["overall"]["compliance_rate"])
                  prev_critical = int(previous["overall"]["critical_violations"])
                  delta = round(rate - prev_rate, 1)
                  trend = {"verdict": "regressed" if delta < 0 or critical > prev_critical
                           else "improved" if delta > 0 else "unchanged",
                           "previous_rate": prev_rate, "delta_rate": delta,
                           "previous_critical": prev_critical, "delta_critical": critical - prev_critical}
              except Exception as exc:
                  print("could not load previous scorecard for trend: %s" % exc)

          scorecard = {
              "policy_version": policy.get("version", "unversioned"),
              "overall": {
                  "total_calls": total,
                  "compliant_calls": compliant,
                  "non_compliant_calls": total - compliant,
                  "compliance_rate": rate,
                  "total_violations": len(violations),
                  "critical_violations": critical,
                  "high_violations": high,
                  "min_compliance_rate": minimum,
                  "gate_passed": gate_passed,
              },
              "per_rule": per_rule,
              "per_agent": per_agent,
              "trend": trend,
              "violations": violations,
          }
          with open("scorecard.json", "w", encoding="utf-8") as handle:
              json.dump(scorecard, handle, indent=2)

          weak_rules = sorted((rule for rule in RULES if per_rule[rule]["violations"] > 0),
                              key=lambda rule: -per_rule[rule]["violations"])
          weak_summary = ", ".join("%s (%d)" % (rule, per_rule[rule]["violations"]) for rule in weak_rules) or "none"
          worst = sorted(per_agent.items(), key=lambda item: item[1]["compliance_rate"])[:2]
          worst_summary = ", ".join("%s %.1f%%" % (agent, stats["compliance_rate"]) for agent, stats in worst) or "n/a"

          lines = [
              "# AI agent tool-call compliance scorecard",
              "",
              "Policy version `%s`. Audited %d tool calls from %d agents."
              % (scorecard["policy_version"], total, len(per_agent)),
              "",
              "## Overall",
              "",
              "| Metric | Value |",
              "| --- | --- |",
              "| Compliance rate | %.1f%% (gate: %.1f%%, zero criticals) |" % (rate, minimum),
              "| Compliant calls | %d of %d |" % (compliant, total),
              "| Violations | %d (%d critical, %d high) |" % (len(violations), critical, high),
              "| Gate | %s |" % ("PASSED" if gate_passed else "FAILED"),
              "| Trend | %s |" % trend["verdict"],
              "",
              "## Pass rate per rule",
              "",
              "| Rule | Evaluated calls | Violations | Pass rate |",
              "| --- | --- | --- | --- |",
          ]
          for rule in RULES:
              stats = per_rule[rule]
              lines.append("| %s | %d | %d | %s |" % (
                  rule, stats["evaluated_calls"], stats["violations"],
                  "%.1f%%" % stats["pass_rate"] if stats["pass_rate"] is not None else "n/a"))
          lines += ["", "## Compliance per agent", "", "| Agent | Calls | Compliant | Rate | Critical | High |",
                    "| --- | --- | --- | --- | --- | --- |"]
          for agent in sorted(per_agent):
              stats = per_agent[agent]
              lines.append("| %s | %d | %d | %.1f%% | %d | %d |"
                           % (agent, stats["calls"], stats["compliant"], stats["compliance_rate"],
                              stats["critical"], stats["high"]))
          lines += ["", "## Violations", ""]
          if violations:
              lines += ["| Call | Agent | Tool | Rule | Severity | Detail |",
                        "| --- | --- | --- | --- | --- | --- |"]
              for violation in violations:
                  lines.append("| %s | %s | %s | %s | %s | %s |"
                               % (violation["call_id"], violation["agent"], violation["tool"],
                                  violation["rule"], violation["severity"], violation["detail"]))
          else:
              lines.append("No violations in this audit window.")
          lines.append("")
          with open("scorecard.md", "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines))

          print("compliance rate %.1f%% (gate %.1f%%), %d critical violations, gate %s, trend %s"
                % (rate, minimum, critical, "passed" if gate_passed else "FAILED", trend["verdict"]))
          print("::" + json.dumps({"outputs": {
              "compliance_rate": rate,
              "critical_violations": critical,
              "high_violations": high,
              "total_violations": len(violations),
              "gate_passed": gate_passed,
              "weak_rules": weak_summary,
              "worst_agents": worst_summary,
              "trend_verdict": trend["verdict"],
          }}) + "::")
      - id: write_trend_record
        type: io.kestra.plugin.scripts.python.Script
        description: "Append this audit to trend.jsonl, the series the next audit compares against, whichever way the gate went."
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          RATE: '{{ outputs.build_scorecard.vars.compliance_rate }}'
          CALLS: '{{ outputs.evaluate_calls.vars.total_calls }}'
          CRITICALS: '{{ outputs.build_scorecard.vars.critical_violations }}'
          GATE: '{{ outputs.build_scorecard.vars.gate_passed }}'
          TREND: '{{ outputs.build_scorecard.vars.trend_verdict }}'
          POLICY_VERSION: '{{ outputs.load_policy.vars.policy_version }}'
        script: |
          import json
          import os
          from datetime import datetime, timezone

          record = {
              "run_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "policy_version": os.environ.get("POLICY_VERSION", "unversioned"),
              "total_calls": int(os.environ.get("CALLS", "0")),
              "compliance_rate": float(os.environ.get("RATE", "0")),
              "critical_violations": int(os.environ.get("CRITICALS", "0")),
              "gate_passed": os.environ.get("GATE", "false") == "true",
              "trend_verdict": os.environ.get("TREND", "baseline"),
          }
          with open("trend.jsonl", "a", encoding="utf-8") as handle:
              handle.write(json.dumps(record) + "\n")
          with open("trend.jsonl", encoding="utf-8") as handle:
              count = sum(1 for _ in handle)
          print("appended trend record %d: rate %.1f%%, %d critical violations, gate %s"
                % (count, record["compliance_rate"], record["critical_violations"],
                   "passed" if record["gate_passed"] else "FAILED"))
          print("::" + json.dumps({"outputs": {"trend_records": count}}) + "::")
  - id: triage
    type: io.kestra.plugin.core.flow.If
    description: Branch on the gate. A passing audit just records itself; a failed gate (rate below
      the minimum, or any critical violation) gets the full escalation.
    condition: '{{ outputs.build_scorecard.vars.gate_passed == false }}'
    then:
      - id: escalate
        type: io.kestra.plugin.core.flow.Parallel
        description: Open the tracking issue and alert Slack at the same time; the scorecard is
          attached to the execution for review.
        tasks:
          - id: raise_issue
            type: io.kestra.plugin.github.issues.Create
            description: Open a GitHub issue with the compliance rate, the critical violations,
              and the weakest rules and agents, so the drift lands in the security backlog.
            jwtToken: '{{ secret(''GITHUB_TOKEN'') }}'
            repository: '{{ inputs.github_repository }}'
            title: 'AI tool-call compliance audit: {{ outputs.build_scorecard.vars.compliance_rate }}% compliant, {{ outputs.build_scorecard.vars.critical_violations }} critical violations'
            body: |
              ## AI agent tool-call compliance audit

              **Compliance rate: {{ outputs.build_scorecard.vars.compliance_rate }}%** (gate: {{ inputs.min_compliance_rate }}% and zero critical violations), trend {{ outputs.build_scorecard.vars.trend_verdict }}.

              Critical violations: {{ outputs.build_scorecard.vars.critical_violations }}. High violations: {{ outputs.build_scorecard.vars.high_violations }}. Total violations: {{ outputs.build_scorecard.vars.total_violations }}.

              Weakest rules: {{ outputs.build_scorecard.vars.weak_rules }}.
              Lowest-compliance agents: {{ outputs.build_scorecard.vars.worst_agents }}.

              The full scorecard, with every violation and the rule it broke, is in `scorecard.md` and `scorecard.json` on the execution's file outputs. Review the flagged calls, tighten entitlements or the policy where the drift is real, and re-run the audit.
          - id: notify_slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Page the security channel with the compliance rate and the critical
              count so the drift is seen within minutes.
            url: '{{ secret(''SLACK_WEBHOOK_URL'') }}'
            messageText: ':rotating_light: AI tool-call compliance audit FAILED: {{ outputs.build_scorecard.vars.compliance_rate }}% compliant, {{ outputs.build_scorecard.vars.critical_violations }} critical violations. Weakest rules: {{ outputs.build_scorecard.vars.weak_rules }}. Tracking issue opened in {{ inputs.github_repository }}.'
    else:
      - id: record_passing_audit
        type: io.kestra.plugin.scripts.python.Script
        description: "Record the passing audit (rate and call volume) so governance has an auditable trail of compliant runs, not only the failures."
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          RATE: '{{ outputs.build_scorecard.vars.compliance_rate }}'
          CALLS: '{{ outputs.evaluate_calls.vars.total_calls }}'
        script: |
          import json
          import os

          print("passing audit: compliance rate %s%% across %s calls, no critical violations; recorded for the trend series"
                % (os.environ.get("RATE", "?"), os.environ.get("CALLS", "?")))
          print("::" + json.dumps({"outputs": {"verdict": "passing"}}) + "::")

extend:
  title: Audit Your AI Agents with a Tool-Call Compliance Harness
  metaTitle: 'AI Agent Tool-Call Compliance Audit | Kestra'
  shortDescription: Audit recorded agent tool calls against your policy on a schedule, score compliance
    per rule and per agent, and escalate critical violations to GitHub and Slack.
  metaDescription: 'Scheduled compliance audit for AI agent tool calls: policy evaluation, per-rule and
    per-agent scorecard, violation severities, trend tracking, GitHub issues, and Slack alerts.'
  description: |
    ## What it does

    Agents act through tools, and tool use drifts. An agent that was only ever meant to search and read
    files starts sending email; a data agent tries a destructive SQL statement; a prompt change quietly
    routes a call at the cloud metadata endpoint. Unless someone audits the recorded tool calls against
    the policy, the first sign of drift is an incident. This blueprint is that audit, run on a schedule:
    it loads the tool-call policy, ingests the recorded calls from the agent platform, evaluates every
    call with deterministic rules (forbidden tools, the allowlist, per-agent entitlements, argument
    constraints, forbidden targets), and produces a compliance scorecard with pass rates per rule and
    per agent, every violation with its severity, and a trend against the previous audit. A failed gate
    opens a GitHub issue and pages Slack. It complements the red-team probe harness (which tests whether
    the agent resists attacks) and the golden-prompt regression harness (which tests whether it still
    does its job): this one tests whether it stayed within its authority.

    Pick this over `agent-tool-call-audit` when you need a periodic governance record: that flow
    audits one agent run as it finishes, through a webhook, with a per-run verdict and a call budget.
    This flow audits a whole period of recorded calls on a weekly schedule, against a structured
    policy with per-agent entitlements and argument constraints, and produces per-rule and per-agent
    rates with a trend. For a single run, the existing flow is enough; for weekly proof across
    agents, use this one.

    ## Prerequisites

    A JSONL export of recorded tool calls from your agent platform, and a tool-call
    policy (the bundled starter policy shows the shape: allowed and forbidden tools,
    per-agent entitlements, argument constraints, forbidden targets). Two namespace
    secrets: `GITHUB_TOKEN` with issue-write scope on the tracking repository, and
    `SLACK_WEBHOOK_URL` for the alert channel.

    ## How it works

    1. `weekly_compliance_audit` (`io.kestra.plugin.core.trigger.Schedule`) runs the audit every
    Monday 06:00 UTC. Run it on demand after any policy or entitlement change.

    2. `load_policy` ([Python scripts](https://kestra.io/plugins/plugin-script-python)) loads and
    validates the tool-call policy: allowed and forbidden tools, per-agent entitlements, argument
    constraints, and forbidden targets.

    3. `ingest_tool_calls` (Python) ingests the recorded tool calls from a JSONL export, normalizes
    and validates them, and counts any malformed records instead of dropping them silently.

    4. `evaluate_calls` (Python) applies the five deterministic rules to every call and writes the
    per-call verdicts and the violation list.

    5. `build_scorecard` (Python) aggregates the scorecard artifact (`scorecard.json` and
    `scorecard.md`): overall compliance rate and gate verdict, pass rates per rule, compliance per
    agent, and a trend against the previous scorecard.

    6. `triage` ([Kestra flow tasks](https://kestra.io/docs/workflow-components/tasks#flow-tasks))
    branches on the gate: passing audits are recorded, failed gates escalate.

    7. `escalate` opens a [GitHub issue](https://kestra.io/plugins/plugin-github) and posts a
    [Slack alert](https://kestra.io/plugins/plugin-notifications/slack) in parallel, while
    `write_trend_record` appends the run to the trend series.

    ## Quick start

    1. Add the two secrets above to the namespace.
    2. Run the flow once with no inputs: the bundled 16-call sample log exercises the full
    pipeline and produces a scorecard.
    3. Read `scorecard.md` for the overall rate, the per-rule and per-agent rates, and the
    violation list with severities.
    4. Point `tool_call_log_url` at a rolling export of recorded calls and
    `previous_scorecard_url` at each published scorecard so the audit trend builds.

    ## Expected outputs

    `scorecard.json` and `scorecard.md` (overall compliance rate and gate verdict, pass rate
    per rule, compliance per agent, every violation with its severity and the exact rule and
    pattern it broke, and the trend against the previous audit), a `trend.jsonl` record per
    run, and on a failed gate one GitHub issue plus one Slack alert naming the violations.

    ## How to adapt it

    Shape the policy to your organisation with policy_override: which tools each
    agent may call, which arguments are constrained, and which targets are forbidden
    outright. Tune min_compliance_rate to your bar, add rule checks in evaluate_calls
    for internal conventions, and point previous_scorecard_url at each published
    scorecard so the audit trend builds over time.
  tags:
    - AI
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  verified: false
  demo: false
