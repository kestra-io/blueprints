id: gbif-biodiversity-occurrence-delta-loader
namespace: company.data

description: |
  Ingest global biodiversity occurrence records from the Global Biodiversity Information Facility (GBIF)
  REST API, clean geospatial coordinates and taxonomic classifications using DuckDB, export partitioned
  Parquet datasets, maintain cursor state in Kestra KV store, and catalog regional endangered species encounters.

inputs:
  - id: country_code
    type: STRING
    defaults: "US"
    description: Two-letter ISO country code to filter biodiversity observation events.

  - id: batch_limit
    type: INT
    defaults: 100
    description: Maximum number of occurrence records to retrieve per extraction cycle.

  - id: state_key
    type: STRING
    defaults: gbif_last_occurrence_key_state
    description: Kestra KV store key tracking the highest observation record key processed.

concurrency:
  limit: 1
  behavior: CANCEL

triggers:
  - id: daily_biodiversity_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * *"
    description: Harvest global biodiversity observation data daily at 04:00 UTC.

tasks:
  - id: fetch_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_occurrences
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install duckdb requests
    env:
      COUNTRY: "{{ inputs.country_code }}"
      LIMIT: "{{ inputs.batch_limit }}"
      LAST_KEY: "{{ outputs.fetch_state.value ?? '0' }}"
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb

        country = os.environ.get("COUNTRY", "US")
        limit = int(os.environ.get("LIMIT", 100))
        last_key = int(os.environ.get("LAST_KEY", 0))

        url = f"https://api.gbif.org/v1/occurrence/search?country={country}&hasCoordinate=true&limit={limit}"
        headers = {"User-Agent": "Kestra-GBIF-Ingest/2.0 (mailto:conservation@company.internal)"}

        response = requests.get(url, headers=headers, timeout=30)
        response.raise_for_status()
        data = response.json()
        raw_results = data.get("results", [])

        records = []
        for r in raw_results:
            key = r.get("key")
            scientific_name = r.get("scientificName", "Unknown")
            kingdom = r.get("kingdom", "Unknown")
            phylum = r.get("phylum", "Unknown")
            order = r.get("order", "Unknown")
            family = r.get("family", "Unknown")
            genus = r.get("genus", "Unknown")
            species = r.get("species", scientific_name)
            lat = r.get("decimalLatitude")
            lon = r.get("decimalLongitude")
            event_date = r.get("eventDate", "")
            basis = r.get("basisOfRecord", "HUMAN_OBSERVATION")
            dataset_name = r.get("datasetName", "GBIF Public Dataset")

            if lat is not None and lon is not None:
                records.append({
                    "occurrence_key": int(key),
                    "scientific_name": scientific_name,
                    "species": species,
                    "kingdom": kingdom,
                    "family": family,
                    "genus": genus,
                    "latitude": float(lat),
                    "longitude": float(lon),
                    "event_date": event_date,
                    "basis_of_record": basis,
                    "dataset_name": dataset_name
                })

        with open("occurrences.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE occurrences AS SELECT * FROM read_json_auto('occurrences.json')")
            con.execute("COPY occurrences TO 'biodiversity_occurrences.parquet' (FORMAT PARQUET)")
            con.execute("COPY occurrences TO 'biodiversity_occurrences.csv' (HEADER, DELIMITER ',')")

            max_key = con.execute("SELECT MAX(occurrence_key) FROM occurrences").fetchone()[0]
            species_summary = con.execute("""
                SELECT kingdom, COUNT(DISTINCT species) AS distinct_species, COUNT(*) AS observations
                FROM occurrences
                GROUP BY kingdom
                ORDER BY observations DESC
            """).df().to_dict(orient="records")
        else:
            con.execute("""
                CREATE TABLE occurrences (
                    occurrence_key BIGINT,
                    scientific_name VARCHAR,
                    species VARCHAR,
                    kingdom VARCHAR,
                    family VARCHAR,
                    genus VARCHAR,
                    latitude DOUBLE,
                    longitude DOUBLE,
                    event_date VARCHAR,
                    basis_of_record VARCHAR,
                    dataset_name VARCHAR
                )
            """)
            con.execute("COPY occurrences TO 'biodiversity_occurrences.parquet' (FORMAT PARQUET)")
            con.execute("COPY occurrences TO 'biodiversity_occurrences.csv' (HEADER, DELIMITER ',')")
            max_key = last_key
            species_summary = []

        summary = {
            "occurrences_ingested": len(records),
            "max_occurrence_key": max_key,
            "species_summary": species_summary
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - biodiversity_occurrences.parquet
      - biodiversity_occurrences.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_occurrences.vars.max_occurrence_key | toString }}"

  - id: log_summary
    type: io.kestra.plugin.core.log.Log
    message: "Successfully synchronized {{ outputs.ingest_and_transform_occurrences.vars.occurrences_ingested }} biodiversity observations for country {{ inputs.country_code }} into Parquet lakehouse storage."

outputs:
  - id: total_observations
    type: INT
    value: "{{ outputs.ingest_and_transform_occurrences.vars.occurrences_ingested }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_occurrences.outputFiles['biodiversity_occurrences.parquet'] }}"

extend:
  title: GBIF Biodiversity Occurrence Delta Loader with DuckDB
  metaTitle: GBIF Biodiversity Occurrence Delta Loader | Kestra
  shortDescription: Ingests global biodiversity observations from GBIF into analytical Parquet lakehouse format via DuckDB with coordinate cleaning.
  metaDescription: Poll GBIF API for biodiversity occurrence records, normalize taxonomy into Parquet with DuckDB, and track observation cursors in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Orchestrate automated, reliable synchronization of global biodiversity occurrence records and
    biological specimen observations from the Global Biodiversity Information Facility (GBIF)
    API into analytical Parquet storage using DuckDB.

    ## How it works

    1. **State Recovery**: Reads the latest processed observation key from Kestra KV store (`gbif_last_occurrence_key_state`) to maintain incremental pipeline status.
    2. **GBIF Ingestion**: Queries the official GBIF Occurrence REST endpoint (`api.gbif.org/v1/occurrence/search`) filtered by country and verified coordinate presence.
    3. **DuckDB Taxonomic Normalization**: Unpacks taxonomic trees (kingdom, phylum, family, genus, species) and validates geographic latitude/longitude within an isolated Docker container.
    4. **Analytical Lake Export**: Generates columnar Parquet and CSV files optimized for ecological geospatial modeling and spatial SQL queries.
    5. **Cursor Persistence**: Commits the highest occurrence key high-watermark to Kestra KV store for idempotent subsequent runs.

    ## What you get

    - Automated recurring ecological data pipelines accessing over 2 billion open-access specimen records worldwide.
    - Columnar Parquet datasets ready for spatial analysis with DuckDB, PostGIS, BigQuery, or Snowflake.
    - Built-in KV state management ensuring zero duplicate observation loads.

    ## Who it's for

    - Environmental science and conservation organizations tracking endangered species sightings.
    - ESG analysts auditing corporate supply chain footprints against protected ecological biomes.
    - Geospatial data engineers building environmental data lakes.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains cursor state across runs without external database infrastructure.
    - Ephemeral Docker execution guarantees isolated Python and DuckDB dependencies.
    - Declarative flow control and logging provide complete visibility into observation harvest cycles.

    ## Prerequisites

    - Docker runtime configured on the Kestra worker.
    - Outbound internet access to `api.gbif.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding biodiversity digest summaries.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set the `country_code` input to your country of interest (e.g. "US", "CA", "FR", "AU").
    3. Click **Execute** to run an initial biodiversity harvest.
    4. Enable the `daily_biodiversity_sync` trigger for automated daily refreshes.

    ## How to extend

    - Add an S3 or Google Cloud Storage upload task to partition monthly occurrence archives.
    - Join observation coordinates against corporate facility boundaries to detect endangered species presence.

    ## Links

    - [GBIF Occurrence API Reference](https://www.gbif.org/developer/occurrence)
    - [DuckDB Spatial & Parquet Export](https://duckdb.org/docs/data/parquet/overview.html)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
