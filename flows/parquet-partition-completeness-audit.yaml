id: parquet-partition-completeness-audit
namespace: company.team

description: >
  Audit a date-partitioned Parquet lake against a calendar by reading only the file footers. Report the days that are
  missing, empty, short or possibly loaded twice, the partitions that are not valid days, and the date ranges to re-run.

inputs:
  - id: demo_scenario
    type: SELECT
    displayName: Demo scenario
    description: >
      Used only when lake_glob is empty. GAPS: a 90-day lake with 3 missing days, 1 empty, 1 short, 1 doubled and 3 stray
      partitions. CLEAN: a complete lake. EMPTY_LAKE: no files at all. WRONG_KEY: the lake is partitioned by ds, not dt.
      COMPACT_DATES: the folders are named like dt=20260819, which is not YYYY-MM-DD.
    values:
      - GAPS
      - CLEAN
      - EMPTY_LAKE
      - WRONG_KEY
      - COMPACT_DATES
    defaults: GAPS

  - id: lake_glob
    type: STRING
    required: false
    displayName: Parquet files to audit
    description: >
      Glob for your Parquet files, one folder per day, for example /data/events/*/*.parquet or s3://bucket/events/*/*.parquet.
      Leave empty to audit the demo lake that this flow builds itself. It must not contain a single quote.
    validator: "^[^']*$"

  - id: partition_key
    type: STRING
    displayName: Partition key
    description: Name of the folder level that holds the date, as in dt=2026-08-19. The value must be YYYY-MM-DD.
    defaults: dt
    validator: "^[A-Za-z_][A-Za-z0-9_]*$"

  - id: lookback_days
    type: INT
    displayName: Days to audit
    description: How many days to judge, ending settle_days ago. The demo seeds defects up to 29 days back, so use 30 or more to see all of them.
    defaults: 90
    min: 7

  - id: settle_days
    type: INT
    displayName: Settle days
    description: Most recent days that are not judged yet, because their partition may still be loading. 1 skips today and judges yesterday.
    defaults: 1
    min: 0

  - id: short_ratio
    type: FLOAT
    displayName: Short below
    description: A day with fewer rows than this share of the median of its previous same-weekday days is SHORT.
    defaults: 0.5
    min: 0
    max: 1

  - id: double_ratio
    type: FLOAT
    displayName: Doubled above
    description: A day with more rows than this multiple of that median is DOUBLE, which can mean it was loaded twice.
    defaults: 1.8
    min: 1

  - id: on_findings
    type: SELECT
    displayName: On findings
    description: REPORT ends the run SUCCESS and lists the findings. FAIL ends it FAILED when there is any finding, so a schedule can alert on it.
    values:
      - REPORT
      - FAIL
    defaults: REPORT

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled. In a real pipeline, set the lake_glob default to your lake and run this after the daily load.
    cron: "0 6 * * *"
    disabled: true

tasks:
  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Shares one working directory between the tasks, so the demo lake written by one task is visible to the next.
    tasks:
      - id: build_demo_lake
        type: io.kestra.plugin.jdbc.duckdb.Queries
        runIf: "{{ (inputs.lake_glob ?? '') == '' }}"
        captureOutputFiles: false
        description: >
          Stand-in for your lake, skipped when lake_glob is set. Writes one Parquet folder per day, fixed in time:
          the audit treats 2026-09-01 as today for this lake, so the results are the same every day.
        sql: |
          -- One row per calendar day: the audited days plus 28 days of history for the baseline.
          CREATE TABLE days AS
          SELECT DATE '2026-09-01' - CAST(k AS INTEGER) AS dt, k AS ago
          FROM range(0, {{ inputs.lookback_days }} + {{ inputs.settle_days }} + 29) t(k);

          -- Normal volume: about 1,000 rows on weekdays, 450 on Saturday, 300 on Sunday, with a fixed wobble of -6 to +6 percent.
          CREATE TABLE sized AS
          SELECT dt, ago,
                 CAST((CASE isodow(dt) WHEN 6 THEN 450 WHEN 7 THEN 300 ELSE 1000 + (isodow(dt) - 3) * 20 END)
                      * (94 + (ago * 7) % 13) / 100 AS INTEGER) AS normal_rows
          FROM days;

          -- Rows per day in this scenario. 0 means no folder at all. Days ago 0 is today, which is still loading.
          CREATE TABLE demo_days AS
          SELECT dt, ago,
                 CAST(CASE WHEN '{{ inputs.demo_scenario }}' = 'EMPTY_LAKE' THEN 0
                           WHEN ago = 0 THEN normal_rows * 40 // 100
                           WHEN '{{ inputs.demo_scenario }}' <> 'GAPS' THEN normal_rows
                           WHEN ago IN (4, 5, 29) THEN 0
                           WHEN ago = 13 THEN 1
                           WHEN ago = 21 THEN normal_rows * 30 // 100
                           WHEN ago = 9 THEN normal_rows * 250 // 100
                           ELSE normal_rows END AS BIGINT) AS n
          FROM sized;

          CREATE TABLE ev AS
          SELECT strftime(d.dt, CASE WHEN '{{ inputs.demo_scenario }}' = 'COMPACT_DATES' THEN '%Y%m%d' ELSE '%Y-%m-%d' END) AS dt,
                 CAST(i AS BIGINT) AS id, CAST(i % 50 AS INTEGER) AS k
          FROM demo_days d, range(d.n) r(i);

          -- Three stray partitions: a NULL date as Spark writes it, an epoch default, and a day in the future.
          INSERT INTO ev
          SELECT s.dt, CAST(i AS BIGINT), CAST(i % 50 AS INTEGER)
          FROM (VALUES ('__HIVE_DEFAULT_PARTITION__'), ('1970-01-01'), ('2026-09-04')) s(dt), range(5) r(i)
          WHERE '{{ inputs.demo_scenario }}' = 'GAPS';

          COPY (SELECT * FROM ev WHERE '{{ inputs.demo_scenario }}' <> 'WRONG_KEY')
          TO '{{ workingDir }}/lake' (FORMAT parquet, PARTITION_BY (dt), FILENAME_PATTERN 'part-{i}', OVERWRITE_OR_IGNORE);

          COPY (SELECT dt AS ds, id, k FROM ev WHERE '{{ inputs.demo_scenario }}' = 'WRONG_KEY')
          TO '{{ workingDir }}/lake' (FORMAT parquet, PARTITION_BY (ds), FILENAME_PATTERN 'part-{i}', OVERWRITE_OR_IGNORE);

      - id: add_empty_partition
        type: io.kestra.plugin.jdbc.duckdb.Queries
        runIf: "{{ (inputs.lake_glob ?? '') == '' and inputs.demo_scenario == 'GAPS' }}"
        captureOutputFiles: false
        description: >
          Demo only. PARTITION_BY cannot write a file with zero rows, so this overwrites the file of 2026-08-19
          (13 days before the demo date) with an empty one. That is the empty partition of the GAPS scenario.
        sql: |
          COPY (SELECT CAST(0 AS BIGINT) AS id, CAST(0 AS INTEGER) AS k WHERE false)
          TO '{{ workingDir }}/lake/dt=2026-08-19/part-0.parquet' (FORMAT parquet);

      - id: find_files
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: >
          List the files lake_glob matches and check that the folder level named by partition_key exists in their paths
          and holds dates. A wrong path, a wrong key or another date format would otherwise read as a lake with every day missing.
        fetchType: FETCH_ONE
        sql: |
          CREATE TABLE files AS
          SELECT file FROM glob(COALESCE(NULLIF('{{ inputs.lake_glob ?? '' }}', ''), '{{ workingDir }}/lake/*/*.parquet'));

          WITH c AS (
            SELECT count(*) AS files_total,
                   count(*) FILTER (WHERE regexp_matches(file, '/{{ inputs.partition_key }}=[^/]*/')) AS files_with_key,
                   count(*) FILTER (WHERE try_cast(regexp_extract(file, '/{{ inputs.partition_key }}=([^/]*)/', 1) AS DATE) IS NOT NULL) AS files_with_date
            FROM files
          )
          SELECT files_total, files_with_key, files_with_date,
                 CASE WHEN files_total = 0 THEN 'NO_FILES'
                      WHEN files_with_key = 0 THEN 'NO_PARTITION_KEY'
                      WHEN files_with_date = 0 THEN 'NO_DATES'
                      ELSE 'OK' END AS scan_status,
                 CASE WHEN files_total = 0 THEN 'lake_glob matched no Parquet files. A wrong path would otherwise look like a lake with every day missing. Nothing was audited.'
                      WHEN files_with_key = 0 THEN files_total || ' Parquet files matched, but none has a {{ inputs.partition_key }}= folder in its path. Check partition_key. Nothing was audited.'
                      WHEN files_with_date = 0 THEN files_with_key || ' Parquet files have a {{ inputs.partition_key }}= folder, but none of its values is a date such as 2026-08-19. Nothing was audited.'
                      ELSE files_total || ' Parquet files matched.' END AS reason
          FROM c;

      - id: scan_guard
        type: io.kestra.plugin.core.execution.Fail
        runIf: "{{ (outputs.find_files.outputs | last).row.scan_status != 'OK' }}"
        description: Stop before the audit when there is nothing valid to audit.
        errorMessage: "BLOCKED_{{ (outputs.find_files.outputs | last).row.scan_status }}: {{ (outputs.find_files.outputs | last).row.reason }}"

      - id: audit
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: >
          Read the row count of every file from its Parquet footer, group it by day, compare each day with the median of
          the previous four same-weekday days, and list the days that are missing, empty, short or doubled, the stray
          partitions, and the date ranges to re-run. It reads no data and changes nothing.
        fetchType: FETCH_ONE
        outputFiles:
          - findings
          - ranges
        sql: |
          -- Today is the demo date for the demo lake and the real date otherwise.
          CREATE TABLE ctx AS
          SELECT CASE WHEN COALESCE('{{ inputs.lake_glob ?? '' }}', '') = '' THEN DATE '2026-09-01' ELSE current_date END AS today;

          -- The audited window ends settle_days ago and is lookback_days long.
          CREATE TABLE win AS
          SELECT today - {{ inputs.settle_days }} AS d_to,
                 today - {{ inputs.settle_days }} - ({{ inputs.lookback_days }} - 1) AS d_from
          FROM ctx;

          -- Footer scan: one row per file with its row count. No data is read.
          CREATE TABLE meta AS
          SELECT file_name, num_rows
          FROM parquet_file_metadata(COALESCE(NULLIF('{{ inputs.lake_glob ?? '' }}', ''), '{{ workingDir }}/lake/*/*.parquet'));

          -- One row per partition folder. part is '' for a file that has no partition key in its path.
          CREATE TABLE inv AS
          SELECT regexp_extract(file_name, '/{{ inputs.partition_key }}=([^/]*)/', 1) AS part,
                 CAST(sum(num_rows) AS BIGINT) AS n_rows,
                 count(*) AS n_files
          FROM meta
          GROUP BY 1;

          -- Judge every day of the window. The 28 days before it only feed the baseline.
          CREATE TABLE judged AS
          WITH cal AS (
            SELECT CAST(g AS DATE) AS dt
            FROM win, generate_series(d_from - 28, d_to, INTERVAL 1 DAY) t(g)
          ), by_day AS (
            -- 2026-8-5 and 2026-08-05 are two folders but one day.
            SELECT try_cast(part AS DATE) AS dt, CAST(sum(n_rows) AS BIGINT) AS n_rows, CAST(sum(n_files) AS BIGINT) AS n_files
            FROM inv
            WHERE try_cast(part AS DATE) IS NOT NULL
            GROUP BY 1
          ), joined AS (
            SELECT c.dt, b.n_rows, b.n_files
            FROM cal c LEFT JOIN by_day b ON b.dt = c.dt
          ), based AS (
            SELECT *, median(n_rows) OVER w AS baseline, count(n_rows) OVER w AS base_points
            FROM joined
            WINDOW w AS (PARTITION BY isodow(dt) ORDER BY dt ROWS BETWEEN 4 PRECEDING AND 1 PRECEDING)
          )
          SELECT dt, n_rows, n_files, baseline, base_points,
                 CASE WHEN n_files IS NULL THEN 'MISSING'
                      WHEN n_rows = 0 THEN 'EMPTY'
                      WHEN base_points < 3 THEN 'NO_BASELINE'
                      WHEN n_rows < {{ inputs.short_ratio }} * baseline THEN 'SHORT'
                      WHEN n_rows > {{ inputs.double_ratio }} * baseline THEN 'DOUBLE'
                      ELSE 'OK' END AS status
          FROM based, win
          WHERE dt >= d_from;

          -- Partitions that are not a day of the calendar.
          CREATE TABLE stray AS
          SELECT CASE WHEN part = '' THEN '(no {{ inputs.partition_key }}= in the path)' ELSE part END AS part,
                 n_rows, n_files,
                 CASE WHEN part = '' THEN 'no partition key in the path'
                      WHEN try_cast(part AS DATE) IS NULL THEN 'not a date'
                      WHEN try_cast(part AS DATE) > today + 1 THEN 'more than a day in the future'
                      ELSE 'before 1971, usually a NULL timestamp cast to 0' END AS reason
          FROM inv, ctx
          WHERE part = ''
             OR try_cast(part AS DATE) IS NULL
             OR try_cast(part AS DATE) > today + 1
             OR try_cast(part AS DATE) < DATE '1971-01-01';

          CREATE TABLE findings AS
          SELECT CAST(dt AS VARCHAR) AS partition_value, status,
                 coalesce(n_rows, 0) AS row_count,
                 CAST(round(baseline) AS BIGINT) AS baseline_rows,
                 CASE WHEN baseline > 0 AND n_rows IS NOT NULL THEN round(n_rows / baseline, 2) END AS ratio,
                 coalesce(n_files, 0) AS files,
                 CASE status
                   WHEN 'MISSING' THEN 'no Parquet file for this day'
                   WHEN 'EMPTY' THEN 'files exist but hold 0 rows'
                   WHEN 'SHORT' THEN 'fewer rows than {{ inputs.short_ratio }} times the same-weekday median'
                   ELSE 'more rows than {{ inputs.double_ratio }} times the same-weekday median, possibly loaded twice' END AS note
          FROM judged
          WHERE status IN ('MISSING', 'EMPTY', 'SHORT', 'DOUBLE')
          UNION ALL
          SELECT part, 'STRAY', n_rows, NULL, NULL, n_files, reason FROM stray
          ORDER BY 1;

          -- Contiguous flagged days become one range each: a day minus its position in the list is constant inside a run.
          CREATE TABLE ranges AS
          WITH f AS (
            SELECT dt, status, dt - CAST(row_number() OVER (ORDER BY dt) AS INTEGER) AS grp
            FROM judged
            WHERE status IN ('MISSING', 'EMPTY', 'SHORT', 'DOUBLE')
          )
          SELECT CAST(min(dt) AS VARCHAR) AS start_date,
                 CAST(max(dt) AS VARCHAR) AS end_date,
                 count(*) AS days,
                 string_agg(DISTINCT status, ', ' ORDER BY status) AS statuses
          FROM f
          GROUP BY grp
          ORDER BY min(dt);

          COPY findings TO '{{ outputFiles.findings }}' (HEADER, DELIMITER ',');
          COPY ranges TO '{{ outputFiles.ranges }}' (HEADER, DELIMITER ',');

          WITH s AS (
            SELECT (SELECT count(*) FROM meta) AS files,
                   (SELECT count(*) FROM judged) AS days_audited,
                   (SELECT count(*) FROM judged WHERE status = 'OK') AS ok_days,
                   (SELECT count(*) FROM judged WHERE status = 'NO_BASELINE') AS no_baseline_days,
                   (SELECT count(*) FROM judged WHERE status = 'MISSING') AS missing_days,
                   (SELECT count(*) FROM judged WHERE status = 'EMPTY') AS empty_days,
                   (SELECT count(*) FROM judged WHERE status = 'SHORT') AS short_days,
                   (SELECT count(*) FROM judged WHERE status = 'DOUBLE') AS double_days,
                   (SELECT count(*) FROM stray) AS stray_partitions,
                   (SELECT count(*) FROM ranges) AS ranges,
                   (SELECT CAST(d_from AS VARCHAR) FROM win) AS audited_from,
                   (SELECT CAST(d_to AS VARCHAR) FROM win) AS audited_to,
                   (SELECT coalesce(string_agg(start_date || CASE WHEN end_date <> start_date THEN '..' || end_date ELSE '' END, ', ' ORDER BY start_date), '') FROM ranges) AS plan
          ), d AS (
            SELECT *,
                   CASE WHEN missing_days + empty_days + short_days + double_days + stray_partitions > 0 THEN 'FINDINGS' ELSE 'COMPLETE' END AS decision
            FROM s
          )
          SELECT *,
                 CASE decision
                   WHEN 'FINDINGS' THEN 'Audited ' || audited_from || ' to ' || audited_to || ' (' || days_audited || ' days): '
                                        || missing_days || ' missing, ' || empty_days || ' empty, ' || short_days || ' short, '
                                        || double_days || ' possibly loaded twice, ' || stray_partitions || ' stray partition(s).'
                   ELSE 'Audited ' || audited_from || ' to ' || audited_to || ' (' || days_audited || ' days): every day has data in line with its weekday baseline and there are no stray partitions.'
                 END
                 || CASE WHEN no_baseline_days > 0 THEN ' ' || no_baseline_days || ' day(s) had too little history for a volume check.' ELSE '' END AS reason
          FROM d;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      row: "{{ (outputs.audit.outputs | last).row | toJson }}"

  - id: log_audit
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.result.values.row | jq('.reason') | first }}
      Files read: {{ outputs.result.values.row | jq('.files') | first }}.
      Missing: {{ outputs.result.values.row | jq('.missing_days') | first }},
      empty: {{ outputs.result.values.row | jq('.empty_days') | first }},
      short: {{ outputs.result.values.row | jq('.short_days') | first }},
      doubled: {{ outputs.result.values.row | jq('.double_days') | first }},
      stray: {{ outputs.result.values.row | jq('.stray_partitions') | first }}.
      Ranges to re-run: {{ outputs.result.values.row | jq('.plan') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    description: COMPLETE logs and ends. FINDINGS lists the ranges and, when on_findings is FAIL, fails the run.
    value: "{{ outputs.result.values.row | jq('.decision') | first }}"
    cases:
      COMPLETE:
        - id: log_complete
          type: io.kestra.plugin.core.log.Log
          message: "The lake is complete for the audited window."

      FINDINGS:
        - id: log_findings
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: >-
            {{ outputs.result.values.row | jq('.ranges') | first }} range(s) to re-run, by day: {{ outputs.result.values.row | jq('.plan') | first }}.
            The details are in outputs.audit.outputFiles.findings and outputs.audit.outputFiles.ranges.

        - id: fail_on_findings
          type: io.kestra.plugin.core.execution.Fail
          runIf: "{{ inputs.on_findings == 'FAIL' }}"
          errorMessage: "FINDINGS: {{ outputs.result.values.row | jq('.reason') | first }}"

    defaults:
      - id: unexpected_decision
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Unexpected decision {{ outputs.result.values.row | jq('.decision') | first }}. Check the audit task logs."

errors:
  - id: report_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Partition audit failed in {{ flow.id }}, execution {{ execution.id }}. A BLOCKED_ message from scan_guard means the lake_glob or partition_key does not match any partition folder, which is the expected result for the EMPTY_LAKE, WRONG_KEY and COMPACT_DATES demo scenarios. A FINDINGS message means on_findings is FAIL. Otherwise read the audit task logs: an unreadable Parquet file stops the scan and its path is in the error."

extend:
  title: Audit a Parquet lake for missing, empty, short and doubled daily partitions
  metaTitle: Parquet Partition Completeness Audit for Data Lakes in Kestra
  shortDescription: Check a date-partitioned Parquet lake against a calendar from the file footers only, and list the missing, empty, short and doubled days, stray partitions and the date ranges to re-run.
  metaDescription: Kestra flow that audits a daily-partitioned Parquet lake from file footers with DuckDB and reports missing, empty, short and doubled days and ranges to re-run.
  description: |
    A daily load can finish green and still leave a hole: a day that never landed, a partition with zero rows, half a day of data, or a day loaded twice. Nothing in the orchestrator notices, because every task succeeded. This flow audits the lake itself. It reads the row count of every Parquet file from its footer, groups the counts by day, compares each day with the median of the previous four same-weekday days, and reports what does not fit. It reads no data and changes nothing. The demo builds its own lake in DuckDB, with no credentials.

    ## How it works

    1. `workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) shares one working directory between its tasks.
    2. `build_demo_lake` (`io.kestra.plugin.jdbc.duckdb.Queries`) writes a demo lake with one folder per day, and `add_empty_partition` adds the one partition that has zero rows. Both are skipped when `lake_glob` is set.
    3. `find_files` lists the files that `lake_glob` matches. `scan_guard` (`io.kestra.plugin.core.execution.Fail`) stops the run when no file matches, when no path has the partition key, or when no partition value is a date. A wrong path, key or date format would otherwise look like a lake with every day missing.
    4. `audit` reads the footers with `parquet_file_metadata`, joins the days to a calendar, judges each day and writes two files: the findings and the date ranges to re-run.
    5. `result` and `log_audit` report the counts. `route` (`io.kestra.plugin.core.flow.Switch`) logs `COMPLETE`, or lists the ranges for `FINDINGS` and fails the run when `on_findings` is `FAIL`.
    6. The `nightly` Schedule is disabled.

    ## What it reports

    | Status | Meaning |
    |---|---|
    | `MISSING` | no Parquet file for the day |
    | `EMPTY` | files exist and hold 0 rows |
    | `SHORT` | fewer rows than `short_ratio` times the median of the previous four same-weekday days |
    | `DOUBLE` | more rows than `double_ratio` times that median, which can mean the day was loaded twice |
    | `STRAY` | a partition folder that is not a day of the calendar: not a date (such as `__HIVE_DEFAULT_PARTITION__`), more than a day in the future, or before 1971 (usually a NULL timestamp cast to 0) |
    | `NO_BASELINE` | fewer than 3 same-weekday days of history, so the volume is not judged. A missing or empty day is still reported |

    The baseline is a median, so one bad day in the history does not move it, and it is taken per weekday, so a quiet Sunday is not reported as short. `DOUBLE` is only a volume signal, and a real spike looks the same.

    ## Prerequisites

    - A worker with DuckDB available through the Kestra DuckDB plugin. No Docker image, no network.
    - Secrets: none for the demo. For a lake on object storage, see below.

    ## Quick start

    1. Import the flow into the `company.team` namespace, or paste it into the editor.
    2. Run it with the defaults. Then run the other scenarios:

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | SUCCESS, decision `FINDINGS`. 2026-06-03 to 2026-08-31, 90 days: 3 missing, 1 empty, 1 short, 1 doubled, 3 stray partitions, 5 ranges to re-run. Today's partition, which holds 40 percent of a normal day, is not judged. |
    | 2 | `demo_scenario`: `CLEAN` | SUCCESS, decision `COMPLETE`. |
    | 3 | `on_findings`: `FAIL` | FAILED at `fail_on_findings` with the same findings. |
    | 4 | `demo_scenario`: `EMPTY_LAKE` | FAILED at `scan_guard`. `BLOCKED_NO_FILES`. |
    | 5 | `demo_scenario`: `WRONG_KEY` | FAILED at `scan_guard`. `BLOCKED_NO_PARTITION_KEY`. |
    | 6 | `demo_scenario`: `WRONG_KEY`, `partition_key`: `ds` | SUCCESS, decision `COMPLETE`. |
    | 7 | `demo_scenario`: `COMPACT_DATES` | FAILED at `scan_guard`. `BLOCKED_NO_DATES`. |
    | 8 | `settle_days`: `0` | SUCCESS, decision `FINDINGS`, now with 2 short days: the partition of the demo date that was still loading is judged. |
    | 9 | `short_ratio`: `0.2` | SUCCESS, decision `FINDINGS`, now with 0 short days: the short partition holds 30 percent of a normal day. |

    Failing runs 3, 4, 5 and 7 are the expected result. The `errors` block logs them.

    ## Inputs

    - `demo_scenario` (SELECT, default `GAPS`, allowed `GAPS`, `CLEAN`, `EMPTY_LAKE`, `WRONG_KEY`, `COMPACT_DATES`): the demo lake. Ignored when `lake_glob` is set.
    - `lake_glob` (STRING, optional): glob for your Parquet files, such as `/data/events/*/*.parquet`. Empty audits the demo lake. No single quote allowed.
    - `partition_key` (STRING, default `dt`): the folder level that holds the date, as in `dt=2026-08-19`. Values must be `YYYY-MM-DD`.
    - `lookback_days` (INT, default `90`, minimum `7`): days to judge, ending `settle_days` ago. The demo seeds defects up to 29 days back, so use 30 or more to see all of them.
    - `settle_days` (INT, default `1`, minimum `0`): recent days that are not judged because they may still be loading.
    - `short_ratio` (FLOAT, default `0.5`, from 0 to 1): below this share of the median a day is `SHORT`.
    - `double_ratio` (FLOAT, default `1.8`, minimum 1): above this multiple of the median a day is `DOUBLE`.
    - `on_findings` (SELECT, default `REPORT`, allowed `REPORT`, `FAIL`): `FAIL` ends the run FAILED when there is any finding.

    ## Outputs

    - `outputs.result.values.row`: `files`, `days_audited`, `ok_days`, `no_baseline_days`, `missing_days`, `empty_days`, `short_days`, `double_days`, `stray_partitions`, `ranges`, `audited_from`, `audited_to`, `plan`, `decision`, `reason`.
    - `outputs.audit.outputFiles.findings`: one line per finding with `partition_value`, `status`, `row_count`, `baseline_rows`, `ratio`, `files` and `note`.
    - `outputs.audit.outputFiles.ranges`: one line per range of consecutive flagged days with `start_date`, `end_date` (inclusive), `days` and `statuses`.

    ## Expected result

    With the defaults the execution ends in SUCCESS. `log_audit` reports a window from 2026-06-03 to 2026-08-31 of 90 days, 3 missing, 1 empty, 1 short, 1 doubled and 3 stray, with the ranges `2026-08-03`, `2026-08-11`, `2026-08-19`, `2026-08-23` and `2026-08-27..2026-08-28`. `log_findings` lists the same ranges as a warning.

    ## Using it with your lake

    1. Set `lake_glob` to your files, one folder per day, for example `/data/events/*/*.parquet`. With a different partition key, set `partition_key`.
    2. For `s3://`, `gs://` or Azure paths DuckDB needs its object storage extension and credentials, which this flow does not set up. Add the statements to the start of the `find_files` and `audit` SQL, and keep the values in `secret('NAME')`. Each file footer is one request, so a lake with very many files is slow. This is not tested here.
    3. Set `settle_days` to cover the time your daily load needs, and `lookback_days` to how far back you want to be told about gaps.
    4. To repair, pass the ranges to a backfill. `safe-backfill-controller` takes `start_date` and `end_date` (inclusive) with `granularity` `DAY`. It skips partitions its own KV checkpoints mark as done, so use `force` or a new `backfill_id` for days this audit found missing.
    5. Enable the `nightly` Schedule, and send the `errors` block to Slack or e-mail so a failed audit is seen.

    ## Limits

    - One date key, one folder per day, `YYYY-MM-DD` values. Another layout is an edit to the `regexp_extract` and the calendar in `audit`. Two folders that spell the same day differently, such as `2026-08-05` and `2026-8-5`, are added together as one day.
    - It counts every Parquet file that `lake_glob` matches. A Delta Lake or an Iceberg table keeps files that its log no longer references, so their counts are too high. Use plain Parquet folders. For Delta tables see `delta-lake-table-health-gate`.
    - It checks that data landed and how much of it, not that it is correct. A partition with the right row count and wrong values passes.
    - A volume baseline gives false `SHORT` flags on holidays and for the weeks after a step change in volume. Tune `short_ratio`.
    - An unreadable or zero-byte Parquet file stops the scan, and the error names the file.
    - A glob that covers only part of the lake reports the rest as missing days. With `on_findings` set to `FAIL` that is loud, not silent.
    - Dates are compared with the worker's date. A lake that is partitioned in a time zone ahead of the worker can show tomorrow's partition, which is accepted up to one day ahead.
    - Not tested: object storage, lakes with many thousands of files, and any DuckDB version other than the one the offline tests used.

