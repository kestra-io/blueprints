id: lightsail-idle-finder
namespace: company.finops

description: |
  Finds idle Lightsail instances: stopped instances still on the bill, and
  running instances with zero network traffic over 30 days. Reports bundle
  waste so small-project sprawl gets cleaned up.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for idle Lightsail instances.
  - id: lookback_days
    type: INT
    defaults: 30
    description: Network traffic window in days; zero traffic in this window counts as idle.
  - id: monthly_cost_usd
    type: STRING
    defaults: "5.00"
    description: Estimated monthly bundle cost in USD (tune for your bundle sizes; $5 is the common small bundle).

tasks:
  - id: check_instances
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit Lightsail instances region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List instances, check state and 30-day network traffic per instance.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            DAYS={{ inputs.lookback_days }}
            PRICE="{{ inputs.monthly_cost_usd }}"
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Checking Lightsail instances in $REGION (traffic window: last $DAYS days)"
            STOPPED_LIST=""
            IDLE_LIST=""
            TOTAL=0
            aws lightsail get-instances --region "$REGION" \
              --query 'instances[].[name,state.name,bundleId]' --output json > /tmp/ls.json
            while IFS= read -r line; do
              NAME=$(echo "$line" | python3 -c "import json,sys;print(json.load(sys.stdin)[0])")
              STATE=$(echo "$line" | python3 -c "import json,sys;print(json.load(sys.stdin)[1])")
              BUNDLE=$(echo "$line" | python3 -c "import json,sys;print(json.load(sys.stdin)[2])")
              if [ "$STATE" = "stopped" ]; then
                STOPPED_LIST="${STOPPED_LIST}${NAME} (${BUNDLE}, stopped), "
                TOTAL=$(python3 -c "print('{:.2f}'.format(float('$TOTAL') + float('$PRICE')))")
                continue
              fi
              if [ "$STATE" != "running" ]; then continue; fi
              BYTES=0
              for M in NetworkIn NetworkOut; do
                S=$(aws lightsail get-instance-metric-data --region "$REGION" \
                  --instance-name "$NAME" --metric-name "$M" \
                  --period 86400 --start-time "$START" --end-time "$END" \
                  --statistics Sum --unit Bytes \
                  --query 'sum(metricData[].sum)' --output text 2>/dev/null)
                case "$S" in ''|'None') S=0;; esac
                BYTES=$(python3 -c "print($BYTES + float('$S'))")
              done
              QUIET=$(python3 -c "print('y' if float('$BYTES') < 1048576 else 'n')")
              if [ "$QUIET" = "y" ]; then
                IDLE_LIST="${IDLE_LIST}${NAME} (${BUNDLE}, <1MB traffic in ${DAYS}d), "
                TOTAL=$(python3 -c "print('{:.2f}'.format(float('$TOTAL') + float('$PRICE')))")
              fi
            done < <(python3 -c "import json;[print(json.dumps(i)) for i in json.load(open('/tmp/ls.json'))]")
            if [ -n "$STOPPED_LIST$IDLE_LIST" ]; then HAS_FINDINGS=true; else HAS_FINDINGS=false; fi
            echo "HAS_FINDINGS=$HAS_FINDINGS"
            echo "STOPPED_INSTANCES=$STOPPED_LIST"
            echo "IDLE_INSTANCES=$IDLE_LIST"
            echo "EST_MONTHLY_WASTE=$TOTAL"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report stopped and idle instances, stay quiet when Lightsail is active.
        condition: "{{ outputs.audit_region.vars.HAS_FINDINGS == 'true' }}"
        then:
          - id: slack_findings
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":bulb: Lightsail audit `{{ outputs.audit_region.vars.REGION_DONE }}` (~${{ outputs.audit_region.vars.EST_MONTHLY_WASTE }}/mo waste)\n:octagonal_sign: Stopped: `{{ outputs.audit_region.vars.STOPPED_INSTANCES }}`\n:zzz: Running but <1MB traffic in {{ inputs.lookback_days }}d: `{{ outputs.audit_region.vars.IDLE_INSTANCES }}`\nSnapshot and delete what the project owners confirm is dead."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "All Lightsail instances in {{ outputs.audit_region.vars.REGION_DONE }} are running with real traffic."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: Lightsail Idle Finder
  metaTitle: Find Idle Lightsail Instances | Kestra
  shortDescription: Audit Lightsail instances across regions for stopped instances and zero-traffic running instances over 30 days, with bundle waste estimates.
  metaDescription: Forgotten Lightsail instances bill monthly. This flow finds stopped and idle ones via metrics and reports weekly.
  description: |
    Lightsail is where side projects go to be forgotten: a $5/month instance for a demo, a test WordPress, a prototype API. Individually trivial, collectively a slow leak across every region someone once clicked "create." This blueprint finds the stopped ones and the running-but-silent ones.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists instances with state and bundle.
    4. Stopped instances are flagged immediately; running instances get 30 days of `NetworkIn`/`NetworkOut` from Lightsail metrics, and under 1 MB total counts as idle.
    5. An `If` task posts a Slack report with both lists and the estimated monthly waste.

    ## What you get

    - Stopped instances called out — the easiest money to reclaim.
    - Running-but-silent instances with traffic evidence, so owners can't say "but it's running fine."
    - Bundle IDs per instance for quick cost lookup, silence on active weeks.

    ## Who it's for

    Teams and founders with Lightsail sprawl from experiments, demos, and client prototypes.

    ## Why orchestrate this with Kestra

    Lightsail lives outside most cloud cost tooling. As a scheduled flow it gets the same audit discipline as the rest of the estate, and the recurring Slack report is the nudge that finally gets old projects deleted.

    ## Prerequisites

    - AWS credentials with `lightsail:GetInstances` and `lightsail:GetInstanceMetricData`.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the Lightsail API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the Lightsail API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the instance report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` and tune `monthly_cost_usd` to your typical bundle.
    3. Run manually once and confirm idle instances with their owners.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Map bundle IDs to real prices with a lookup table for exact waste.
    - Auto-snapshot stopped instances older than 90 days before deleting.
    - Also audit Lightsail disks and static IPs detached from any instance.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [Lightsail pricing](https://aws.amazon.com/lightsail/pricing/)
    - [Lightsail get-instance-metric-data API](https://docs.aws.amazon.com/cli/latest/reference/lightsail/get-instance-metric-data.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
