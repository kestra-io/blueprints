id: graphql-multi-environment-schema-parity-sentinel
namespace: company.devops

inputs:
  - id: primary_graphql_endpoint
    type: URI
    displayName: Primary Environment Endpoint (e.g. Staging / UAT)
    defaults: "https://countries.trevorblades.com/graphql"
    description: URL of the staging or pre-production GraphQL endpoint to inspect.

  - id: reference_graphql_endpoint
    type: URI
    displayName: Reference Environment Endpoint (e.g. Production)
    defaults: "https://countries.trevorblades.com/graphql"
    description: URL of the reference or production GraphQL endpoint for parity comparison.

  - id: ignore_system_types
    type: BOOL
    displayName: Ignore System Schema Types
    defaults: true
    description: Filter out internal introspection types starting with double underscores (`__`).

triggers:
  - id: pre_release_parity_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Pre-release morning parity check executed Monday through Friday at 07:00 UTC. Shipped disabled by default.
    cron: "0 7 * * 1-5"
    disabled: true

tasks:
  - id: introspect_primary_schema
    type: io.kestra.plugin.graphql.Request
    description: Introspect types and query root fields on the primary pre-production environment.
    uri: "{{ inputs.primary_graphql_endpoint }}"
    headers:
      Authorization: "Bearer {{ secret('PRIMARY_GRAPHQL_TOKEN') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-Schema-Parity/1.0"
    failOnGraphQLErrors: false
    query: |
      query IntrospectTypes {
        __schema {
          types {
            name
            kind
            description
            fields {
              name
            }
          }
        }
      }

  - id: introspect_reference_schema
    type: io.kestra.plugin.graphql.Request
    description: Introspect types and query root fields on the reference production environment.
    uri: "{{ inputs.reference_graphql_endpoint }}"
    headers:
      Authorization: "Bearer {{ secret('REFERENCE_GRAPHQL_TOKEN') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-Schema-Parity/1.0"
    failOnGraphQLErrors: false
    query: |
      query IntrospectTypes {
        __schema {
          types {
            name
            kind
            description
            fields {
              name
            }
          }
        }
      }

  - id: compare_schema_parity
    type: io.kestra.plugin.scripts.python.Script
    description: Compare schema definitions between environments to detect unpromoted types or missing fields.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      PRIMARY_BODY: "{{ outputs.introspect_primary_schema.body }}"
      REFERENCE_BODY: "{{ outputs.introspect_reference_schema.body }}"
      PRIMARY_URI: "{{ inputs.primary_graphql_endpoint }}"
      REFERENCE_URI: "{{ inputs.reference_graphql_endpoint }}"
      IGNORE_SYSTEM: "{{ inputs.ignore_system_types }}"
    script: |
      import os
      import json
      from kestra import Kestra

      primary_raw = os.environ.get("PRIMARY_BODY", "{}")
      reference_raw = os.environ.get("REFERENCE_BODY", "{}")
      primary_uri = os.environ.get("PRIMARY_URI", "")
      reference_uri = os.environ.get("REFERENCE_URI", "")
      ignore_system = os.environ.get("IGNORE_SYSTEM", "true").lower() == "true"

      def extract_types(raw):
          try:
              data = json.loads(raw)
          except Exception:
              return {}
          type_list = data.get("data", {}).get("__schema", {}).get("types", [])
          type_map = {}
          for t in type_list:
              name = t.get("name")
              if not name:
                  continue
              if ignore_system and name.startswith("__"):
                  continue
              fields = {f.get("name") for f in (t.get("fields") or []) if f.get("name")}
              type_map[name] = {
                  "kind": t.get("kind"),
                  "fields": fields
              }
          return type_map

      primary_types = extract_types(primary_raw)
      ref_types = extract_types(reference_raw)

      added_in_primary = set(primary_types.keys()) - set(ref_types.keys())
      missing_in_primary = set(ref_types.keys()) - set(primary_types.keys())
      common_types = set(primary_types.keys()) & set(ref_types.keys())

      field_drift = []
      for t_name in common_types:
          p_fields = primary_types[t_name]["fields"]
          r_fields = ref_types[t_name]["fields"]
          added_fields = p_fields - r_fields
          removed_fields = r_fields - p_fields
          if added_fields or removed_fields:
              field_drift.append({
                  "type": t_name,
                  "added_fields": list(added_fields),
                  "removed_fields": list(removed_fields)
              })

      total_drift = len(added_in_primary) + len(missing_in_primary) + len(field_drift)
      summary = f"Compared primary ({primary_uri}) against reference ({reference_uri}): {total_drift} schema drift difference(s) detected ({len(added_in_primary)} new types, {len(missing_in_primary)} missing types, {len(field_drift)} types with field differences)."

      drift_notes = []
      if added_in_primary:
          drift_notes.append(f"• *New types in primary:* `{', '.join(sorted(list(added_in_primary))[:5])}`")
      if missing_in_primary:
          drift_notes.append(f"• *Missing types in primary:* `{', '.join(sorted(list(missing_in_primary))[:5])}`")
      for fd in field_drift[:3]:
          drift_notes.append(f"• Type `{fd['type']}`: +fields `{', '.join(fd['added_fields'])}` / -fields `{', '.join(fd['removed_fields'])}`")

      Kestra.outputs({
          "drift_count": total_drift,
          "has_drift": total_drift > 0,
          "added_types_count": len(added_in_primary),
          "missing_types_count": len(missing_in_primary),
          "field_drift_count": len(field_drift),
          "summary": summary,
          "details_formatted": "\n".join(drift_notes) if drift_notes else "Full schema parity confirmed between environments."
      })

  - id: check_schema_drift
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if any schema drift was detected between environments.
    condition: "{{ outputs.compare_schema_parity.vars.drift_count > 0 }}"
    then:
      - id: notify_slack_schema_drift
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch schema drift summary and diff details to Slack platform channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#api-platform-governance",
            "username": "Kestra Schema Parity Sentinel",
            "icon_emoji": ":arrows_counterclockwise:",
            "attachments": [
              {
                "color": "#3AA3E3",
                "title": "GraphQL Multi-Environment Schema Parity Report",
                "text": "{{ outputs.compare_schema_parity.vars.summary }}",
                "fields": [
                  {
                    "title": "Primary (Pre-Prod)",
                    "value": "`{{ inputs.primary_graphql_endpoint }}`",
                    "short": true
                  },
                  {
                    "title": "Reference (Prod)",
                    "value": "`{{ inputs.reference_graphql_endpoint }}`",
                    "short": true
                  },
                  {
                    "title": "Total Drift Differences",
                    "value": "{{ outputs.compare_schema_parity.vars.drift_count }}",
                    "short": true
                  },
                  {
                    "title": "Field-Level Drifts",
                    "value": "{{ outputs.compare_schema_parity.vars.field_drift_count }}",
                    "short": true
                  },
                  {
                    "title": "Drift Breakdown",
                    "value": "{{ outputs.compare_schema_parity.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Schema Governance Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch notification if introspection query or parity analysis encounters exceptions.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "GraphQL Schema Parity Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed during cross-environment GraphQL schema introspection.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  shortDescription: "Compare GraphQL schemas between staging and production environments via introspection, detecting type or field drift before customer-impacting releases."
  title: GraphQL multi-environment schema parity and drift sentinel
  metaTitle: GraphQL Multi-Environment Schema Parity Sentinel | Kestra
  metaDescription: Compare GraphQL schemas between staging and production environments via introspection, detecting type or field drift before customer-impacting releases.
  description: |
    Automates cross-environment schema audits by introspecting primary (staging/UAT) and reference (production) GraphQL gateways, computing structural type and field diffs in Python, and alerting API platform teams via Slack to prevent schema drift.

    ## What you get
    - Automated detection of unpromoted types or missing fields before deploying client applications.
    - Full introspection parsing comparing Object, Interface, and Union types across environments.
    - Contextual Slack alerts detailing added types, removed types, and field variations.
    - Elimination of broken mobile and frontend clients caused by unexpected schema differences.

    ## Who it's for
    - API Platform Engineers managing GraphQL gateways and Apollo Federation federated subgraphs.
    - DevOps and Release Engineers validating pre-production readiness before major releases.
    - Frontend and Mobile Engineers dependent on consistent GraphQL contracts between environments.

    ## Why orchestrate this with Kestra
    Verifying that Staging and Production schemas remain in sync usually requires manually running CLI tools like `rover` or `graphql-inspector`. Kestra runs scheduled, native GraphQL introspection requests against both endpoints simultaneously, performs deterministic diffing inside an isolated Python runtime, and dispatches drift alerts directly to engineering channels with zero local tooling setup.

    ## Prerequisites
    - Network connectivity to both primary (staging) and reference (production) GraphQL endpoints.
    - A Slack Incoming Webhook URL configured for platform alerts.

    ### Secrets
    - `PRIMARY_GRAPHQL_TOKEN`: Bearer token or API key for the primary (staging) GraphQL gateway.
    - `REFERENCE_GRAPHQL_TOKEN`: Bearer token or API key for the reference (production) GraphQL gateway.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to deliver schema drift reports.

    ## Quick start
    1. Define `PRIMARY_GRAPHQL_TOKEN`, `REFERENCE_GRAPHQL_TOKEN`, and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `primary_graphql_endpoint` and `reference_graphql_endpoint` to your respective gateway URLs.
    3. Trigger a manual execution from the Kestra UI to run the comparison and review output variables.
    4. Enable the `pre_release_parity_schedule` trigger to audit schema parity every weekday morning.

    ## How to extend
    - Fail pre-production CI/CD deployment pipelines using Kestra execution return statuses if unexpected drift is detected.
    - Generate schema diff snapshots and save them to AWS S3, Google Cloud Storage, or MinIO for compliance auditing.
    - Add automated schema registry synchronizations to push updated definitions to Apollo Studio or Hive.

    ## Links
    - [GraphQL Introspection Specification](https://spec.graphql.org/October2021/#sec-Introspection)
    - [Kestra GraphQL Plugin Documentation](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
