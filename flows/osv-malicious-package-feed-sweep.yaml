id: osv-malicious-package-feed-sweep
namespace: company.team

inputs:
  - id: ecosystems
    type: JSON
    displayName: OSV ecosystems to sweep
    description: Exact OSV ecosystem names, as listed in the bucket's ecosystems.txt (case-sensitive).
    defaults: '["npm", "PyPI"]'

  - id: inventory
    type: JSON
    displayName: Dependency inventory
    description: Every direct and transitive dependency your services ship, one object per lockfile entry. The default is SAMPLE data; export yours from your SBOM or lockfiles.
    defaults: |
      [
        {"service": "checkout-web", "ecosystem": "npm", "name": "express", "version": "4.21.2"},
        {"service": "checkout-web", "ecosystem": "npm", "name": "lodash", "version": "4.17.21"},
        {"service": "checkout-web", "ecosystem": "npm", "name": "@babel/core", "version": "7.26.0"},
        {"service": "docs-site", "ecosystem": "npm", "name": "markdown-it", "version": "14.1.0"},
        {"service": "ml-scoring", "ecosystem": "PyPI", "name": "requests", "version": "2.32.3"},
        {"service": "ml-scoring", "ecosystem": "PyPI", "name": "Scikit_Learn", "version": "1.5.2"},
        {"service": "ml-scoring", "ecosystem": "PyPI", "name": "pydantic", "version": "2.9.2"}
      ]

  - id: first_run_lookback_hours
    type: INT
    displayName: Lookback on the first run
    description: With no watermark in KV yet, entries modified in this many hours are swept (the baseline run).
    defaults: 72

  - id: feed_bytes
    type: INT
    displayName: Bytes of each feed to read
    description: modified_id.csv is sorted newest first and is several MB for npm, so only the head is fetched with an HTTP Range request. 131072 bytes is roughly 2,900 rows, weeks of npm history.
    defaults: 131072

  - id: max_advisories
    type: INT
    displayName: Max advisories per ecosystem per run
    description: Safety cap on api.osv.dev calls, per ecosystem. When more new MAL- entries are waiting, the oldest are processed and the watermark stops there, so the next run continues the backlog.
    defaults: 60

variables:
  state_key: osv_malicious_feed_watermarks

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: The OSV export refreshes the bucket roughly every 15 minutes; an hourly sweep keeps exposure to a freshly reported malicious package short.
    cron: "7 * * * *"

tasks:
  - id: get_watermarks
    type: io.kestra.plugin.core.kv.Get
    description: Per-ecosystem watermark (epoch microseconds of the newest feed row already handled). Missing on the first run.
    key: "{{ vars.state_key }}"
    errorOnMissing: false

  - id: known_ecosystems
    type: io.kestra.plugin.core.http.Request
    description: The bucket's own list of ecosystem folders. OSV names are case-sensitive (PyPI, crates.io, Packagist), and a typo would otherwise surface as a bare 404 deep inside a loop iteration.
    uri: https://osv-vulnerabilities.storage.googleapis.com/ecosystems.txt

  - id: check_ecosystems
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {% set known = outputs.known_ecosystems.body | trim | split('\R') %}{% set bad = [] %}{% for e in inputs.ecosystems %}{% if not (known contains e) %}{% set bad = bad | merge([e]) %}{% endif %}{% endfor %}{{ bad | length > 0 }}
    then:
      - id: unknown_ecosystem
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          {% set known = outputs.known_ecosystems.body | trim | split('\R') %}{% set bad = [] %}{% for e in inputs.ecosystems %}{% if not (known contains e) %}{% set bad = bad | merge([e]) %}{% endif %}{% endfor %}Unknown OSV ecosystem(s): {{ bad | join(', ') }}. Use the exact names from ecosystems.txt, e.g. npm, PyPI, Maven, Go, crates.io, RubyGems, NuGet. Watermarks were not touched.

  - id: feeds
    type: io.kestra.plugin.core.flow.Loop
    description: One iteration per ecosystem; each item carries its ecosystem, watermark and limits.
    values: >-
      [{% for e in inputs.ecosystems %}{"eco": "{{ e }}", "since_us": {{ (outputs.get_watermarks.value ?? {})[e] ?? -1 }}, "lookback_h": {{ inputs.first_run_lookback_hours }}, "bytes": {{ inputs.feed_bytes }}, "cap": {{ inputs.max_advisories }}}{% if not loop.last %},{% endif %}{% endfor %}]
    outputs:
      - id: feed
        type: JSON
        value: "{{ outputs.parse_feed.row | toJson }}"
    tasks:
      - id: download_feed
        type: io.kestra.plugin.core.http.Download
        description: Range request for the head of the newest-first feed. GCS answers 206 with exactly the requested bytes, so the last line is usually cut in half.
        uri: "https://osv-vulnerabilities.storage.googleapis.com/{{ fromJson(item.value).eco | replace({' ': '%20'}) }}/modified_id.csv"
        headers:
          Range: "bytes=0-{{ fromJson(item.value).bytes - 1 }}"

      - id: parse_feed
        type: io.kestra.plugin.jdbc.duckdb.Query
        description: >
          Drops the (possibly truncated) last line, keeps MAL- rows newer than the
          watermark, oldest first and capped, and works out the next watermark.
          If the oldest row read is still newer than the watermark, the byte window
          did not reach back far enough and the gap is flagged.
        timeZoneId: UTC
        inputFiles:
          feed.csv: "{{ outputs.download_feed.uri }}"
        fetchType: FETCH_ONE
        sql: |
          WITH raw AS (
            SELECT row_number() OVER () AS rn, modified_raw, id
            FROM read_csv('{{ workingDir }}/feed.csv', header = false, all_varchar = true, null_padding = true,
                          ignore_errors = true, columns = {'modified_raw': 'VARCHAR', 'id': 'VARCHAR'})
          ),
          feed AS (
            SELECT id, epoch_us(CAST(left(replace(replace(modified_raw, 'T', ' '), 'Z', ''), 26) AS TIMESTAMP)) AS modified_us
            FROM raw
            WHERE rn < (SELECT max(rn) FROM raw) AND id IS NOT NULL
          ),
          bounds AS (
            SELECT CASE WHEN {{ fromJson(item.value).since_us }} >= 0 THEN CAST({{ fromJson(item.value).since_us }} AS BIGINT)
                        ELSE epoch_us(now()) - CAST({{ fromJson(item.value).lookback_h }} AS BIGINT) * 3600000000 END AS since_us
          ),
          fresh AS (
            SELECT f.id, f.modified_us FROM feed f, bounds b
            WHERE f.modified_us > b.since_us AND f.id LIKE 'MAL-%'
          ),
          batch AS (
            SELECT * FROM fresh ORDER BY modified_us, id LIMIT {{ fromJson(item.value).cap }}
          )
          SELECT '{{ fromJson(item.value).eco }}' AS ecosystem,
                 (SELECT count(*) FROM feed) AS rows_read,
                 (SELECT count(*) FROM fresh) AS new_mal,
                 (SELECT min(modified_us) FROM feed) > (SELECT since_us FROM bounds) AS window_gap,
                 coalesce((SELECT list(id ORDER BY modified_us, id) FROM batch), []) AS ids,
                 CASE WHEN (SELECT count(*) FROM fresh) > {{ fromJson(item.value).cap }}
                      THEN (SELECT max(modified_us) FROM batch)
                      ELSE greatest((SELECT max(modified_us) FROM feed), (SELECT since_us FROM bounds)) END AS next_watermark_us

  - id: advisories
    type: io.kestra.plugin.core.flow.Loop
    description: Full OSV record for each new MAL- id, trimmed to what the join needs. A 404 (record not yet served by the API) is kept as a row, not a failure.
    values: >-
      {% set ids = [] %}{% for f in outputs.feeds.outputs %}{% for i in f.outputs.feed.ids %}{% set ids = ids | merge([i]) %}{% endfor %}{% endfor %}{{ ids | toJson }}
    outputs:
      - id: vuln
        type: JSON
        value: >-
          {% if outputs.get_vuln.code == 200 %}{{ outputs.get_vuln.body | jq('{id, summary, published, withdrawn, aliases: (.aliases // []), affected: [(.affected // [])[] | {ecosystem: .package.ecosystem, name: .package.name, versions: (.versions // []), bounded: ([(.ranges // [])[].events[] | select(.fixed or .last_affected or .limit)] | length > 0)}]}') | first | toJson }}{% else %}{"id": "{{ item.value }}", "http_code": {{ outputs.get_vuln.code }}, "affected": []}{% endif %}
    tasks:
      - id: get_vuln
        type: io.kestra.plugin.core.http.Request
        uri: "https://api.osv.dev/v1/vulns/{{ item.value }}"
        options:
          allowFailed: true
        retry:
          type: exponential
          interval: PT5S
          maxInterval: PT1M
          maxAttempts: 3

  - id: match_inventory
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      Joins every affected package of every new MAL- entry with the inventory.
      Names are compared case-insensitively, PyPI names after PEP 503
      normalisation (Scikit_Learn equals scikit-learn). A range with no fixed or
      last_affected event means every version is malicious; otherwise only the
      listed versions are, and a name-only hit is kept for review.
    timeZoneId: UTC
    inputFiles:
      inventory.json: "{{ inputs.inventory | toJson }}"
      vulns.json: "{{ (outputs.advisories.outputs ?? []) | jq('[.[].outputs.vuln]') | first | toJson }}"
    outputFiles:
      - new_entries_csv
    fetchType: FETCH
    sql: |
      CREATE TABLE v AS
      SELECT unnest(from_json(json, '["JSON"]')) AS j FROM read_json_objects('{{ workingDir }}/vulns.json', format = 'unstructured');

      CREATE TABLE entries AS
      SELECT json_extract_string(j, '$.id') AS mal_id,
             json_extract_string(j, '$.summary') AS summary,
             left(json_extract_string(j, '$.published'), 10) AS published,
             json_extract_string(j, '$.withdrawn') IS NOT NULL AS withdrawn,
             array_to_string(CAST(json_extract_string(j, '$.aliases[*]') AS VARCHAR[]), ' ') AS aliases,
             json_extract_string(a, '$.ecosystem') AS ecosystem,
             json_extract_string(a, '$.name') AS package,
             CAST(json_extract_string(a, '$.versions[*]') AS VARCHAR[]) AS versions,
             CAST(json_extract(a, '$.bounded') AS BOOLEAN) AS bounded
      FROM v, LATERAL unnest(CAST(json_extract(j, '$.affected[*]') AS JSON[])) AS t(a);

      CREATE TABLE inv AS
      SELECT service, ecosystem, name, version,
             CASE WHEN ecosystem = 'PyPI' THEN regexp_replace(lower(name), '[-_.]+', '-', 'g') ELSE lower(name) END AS norm
      FROM read_json('{{ workingDir }}/inventory.json',
                     columns = {service: 'VARCHAR', ecosystem: 'VARCHAR', name: 'VARCHAR', version: 'VARCHAR'});

      CREATE TABLE report AS
      SELECT e.mal_id, e.ecosystem, e.package, e.published, e.withdrawn, e.aliases, e.summary,
             i.service, i.name AS deployed_name, i.version AS deployed_version,
             CASE WHEN i.service IS NULL THEN NULL
                  WHEN list_contains(e.versions, i.version) THEN 'VERSION_LISTED'
                  WHEN NOT coalesce(e.bounded, false) THEN 'ALL_VERSIONS'
                  ELSE 'NAME_ONLY_REVIEW' END AS verdict
      FROM entries e
      LEFT JOIN inv i
        ON i.ecosystem = e.ecosystem
       AND i.norm = CASE WHEN e.ecosystem = 'PyPI' THEN regexp_replace(lower(e.package), '[-_.]+', '-', 'g') ELSE lower(e.package) END;

      COPY (SELECT * FROM report ORDER BY verdict NULLS LAST, ecosystem, mal_id) TO '{{ outputFiles.new_entries_csv }}' (HEADER, DELIMITER ',');

      SELECT * FROM report WHERE service IS NOT NULL AND NOT withdrawn ORDER BY verdict, service, package;

  - id: has_matches
    type: io.kestra.plugin.core.flow.If
    description: Alert only when a newly reported malicious package is in the inventory.
    condition: "{{ outputs.match_inventory.outputs[0].size > 0 }}"
    then:
      - id: log_matches
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          {{ outputs.match_inventory.outputs[0].size }} inventory entries match newly reported malicious packages:
          {% for r in outputs.match_inventory.outputs[0].rows %}- {{ r.service }}: {{ r.ecosystem }} {{ r.deployed_name }}@{{ r.deployed_version }} -> {{ r.mal_id }} [{{ r.verdict }}] {{ r.summary }}
          {% endfor %}

      - id: slack_incident
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Fails softly when SLACK_WEBHOOK_URL is not configured, so the watermark still advances.
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :rotating_light: *Malicious package in use* ({{ outputs.match_inventory.outputs[0].size }} hit(s) from the OSV MAL- feed)
          {% for r in outputs.match_inventory.outputs[0].rows %}• *{{ r.service }}* `{{ r.deployed_name }}@{{ r.deployed_version }}` ({{ r.ecosystem }}): <https://osv.dev/vulnerability/{{ r.mal_id }}|{{ r.mal_id }}> {{ r.verdict }}
          {% endfor %}Treat affected hosts and CI runners as compromised and rotate their secrets. Execution {{ execution.id }}
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        message: "No inventory package is among the {{ (outputs.advisories.outputs ?? []) | length }} new MAL- entries."

  - id: save_watermarks
    type: io.kestra.plugin.core.kv.Set
    description: Advances each ecosystem's watermark only after matching and alerting have run.
    key: "{{ vars.state_key }}"
    kvType: JSON
    value: >-
      {% set wm = outputs.get_watermarks.value ?? {} %}{% for f in outputs.feeds.outputs %}{% set wm = wm | merge({(f.outputs.feed.ecosystem): f.outputs.feed.next_watermark_us}) %}{% endfor %}{{ wm | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      {% for f in outputs.feeds.outputs %}{{ f.outputs.feed.ecosystem }}: {{ f.outputs.feed.rows_read }} feed rows read, {{ f.outputs.feed.new_mal }} new MAL- entries{% if f.outputs.feed.window_gap %} (WARNING: feed_bytes did not reach the watermark, older entries were skipped){% endif %}{% if f.outputs.feed.new_mal > (f.outputs.feed.ids | length) %} (capped, rest next run){% endif %}
      {% endfor %}Advisories fetched: {{ (outputs.advisories.outputs ?? []) | length }}, inventory hits: {{ outputs.match_inventory.outputs[0].size }}. CSV: {{ outputs.match_inventory.outputFiles.new_entries_csv }}

outputs:
  - id: inventory_hits
    type: INT
    value: "{{ outputs.match_inventory.outputs[0].size ?? 0 }}"
  - id: new_entries_csv
    type: FILE
    value: "{{ outputs.match_inventory.outputFiles.new_entries_csv }}"

extend:
  title: Sweep the OSV Malicious Package Feed Against Your Dependency Inventory
  metaTitle: OSV Malicious Package Feed Sweep with DuckDB and Slack | Kestra
  shortDescription: Every hour, read only the new MAL- entries from OSV's per-ecosystem modified_id.csv feed, fetch each record, match the affected packages against your lockfile inventory in DuckDB and raise a Slack incident when one of them is in use.
  metaDescription: Hourly incremental sweep of OSV's modified_id.csv for new malicious npm and PyPI packages, matched to your lockfile inventory in DuckDB with Slack alerts.
  description: |
    Malicious packages (typosquats, hijacked accounts, install-time stealers) reach OSV as `MAL-` entries, dozens a day for npm alone. A build-time scanner only sees them on the next build. This flow follows OSV's own export feed instead: every hour it picks up the new `MAL-` records and checks them against the packages you already ship.

    ## How it works

    1. An hourly `Schedule` starts the sweep. `get_watermarks` (KV) reads one watermark per ecosystem; the first run has none and sweeps the last `first_run_lookback_hours` as a baseline.
    2. `check_ecosystems` (If + Fail) compares the input with the bucket's `ecosystems.txt`; names are case-sensitive (`PyPI`, not `pypi`).
    3. `feeds` (Loop) downloads the head of `{ecosystem}/modified_id.csv` with an HTTP `Range` header (the file is newest first and several MB for npm). DuckDB drops the cut-off last line, keeps `MAL-` rows newer than the watermark, oldest first, up to `max_advisories`, and flags a gap if the bytes read do not reach back to the watermark.
    4. `advisories` (Loop) fetches each id from `api.osv.dev/v1/vulns/{id}` with retries and keeps only the fields the join needs. A 404 becomes a row, not a failure.
    5. `match_inventory` (DuckDB) joins affected packages with the inventory: npm names lowercase, PyPI names PEP 503 normalised. Verdicts: `VERSION_LISTED`, `ALL_VERSIONS` (no fixed or last_affected event) or `NAME_ONLY_REVIEW`. Withdrawn records never alert.
    6. `has_matches` (If) logs and posts a Slack incident; `save_watermarks` advances state only afterwards.

    ## What you get

    - A Slack incident within about an hour of OSV listing a package you run, with service, version, `MAL-` id and verdict.
    - A CSV of every new `MAL-` entry checked, matched or not.
    - Backlogs above the cap carry over to the next runs instead of being dropped.

    ## Who it's for

    - Application and supply-chain security teams.
    - Platform teams that own an SBOM or lockfile inventory.

    ## Why orchestrate this with Kestra

    - Watermarks live in the KV store and move only after the alert, so a failed run retries from the same point.
    - Retries per OSV call, loops per ecosystem and record, matching rules in plain SQL.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins.
    - Outbound HTTPS to `osv-vulnerabilities.storage.googleapis.com` and `api.osv.dev`; no API key.
    - The default `inventory` is sample data (seven popular npm and PyPI packages, none malicious); the feed and the OSV records come from the live services.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the Slack task fails softly and the watermarks still advance).

    ## Quick start

    1. Click **Execute**. The baseline sweeps 72 hours of npm and PyPI and lists every new `MAL-` entry in the CSV; the sample inventory normally has no hit.
    2. Execute again: 0 new entries.
    3. To see a match, add a package from the CSV to `inventory`, delete the KV key `osv_malicious_feed_watermarks` and run.
    4. Load your real inventory, add the secret and keep the hourly schedule.

    ## How to extend

    - Read `inventory` from a namespace file, a warehouse table or an SBOM.
    - Add `Maven`, `Go`, `crates.io` or `RubyGems` to `ecosystems`.
    - Open a Jira or PagerDuty incident next to the Slack message.

    ## Links

    - [OSV data dumps](https://google.github.io/osv.dev/data/) and [OSV API](https://google.github.io/osv.dev/api/)
    - [OpenSSF malicious-packages](https://github.com/ossf/malicious-packages)
    - [PEP 503 normalised names](https://peps.python.org/pep-0503/#normalized-names)
    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop), [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
