id: container-registry-retention-and-untagged-image-cleanup-gate
namespace: company.platform
description: |
  Audit OCI / Docker v2 container registries to identify stale tagged images and orphaned
  untagged manifests. Apply configurable retention policies, protect active deployments
  and release tags, calculate reclaimable space, generate JSON and Markdown audit reports,
  and safely gate manifest deletions behind explicit opt-in and human approval.

inputs:
  - id: registry_url
    type: STRING
    defaults: "http://registry.internal:5000"
    displayName: "Registry Base URL"
    description: "Base URL of the OCI / Docker Registry v2 endpoint (e.g. `http://registry.internal:5000` or `https://registry.example.com`)."

  - id: repository_filter
    type: STRING
    defaults: ".*"
    displayName: "Repository Filter Regex"
    description: "Regular expression filter to select specific repositories for audit and cleanup (e.g., `^services/.*` or `^frontend/.*`)."

  - id: registry_inventory_file
    type: FILE
    required: false
    displayName: "Offline Registry Inventory File"
    description: "Optional pre-generated registry inventory JSON file. When provided, evaluates retention against this dataset directly, enabling offline audits, testing, and execution without live registry network access."

  - id: keep_minimum_per_repository
    type: INT
    defaults: 5
    displayName: "Keep Minimum Images Per Repository"
    description: "Number of newest tagged images to retain per repository regardless of age."

  - id: tagged_stale_days
    type: INT
    defaults: 90
    displayName: "Tagged Image Stale Threshold (Days)"
    description: "Images with non-protected tags older than this threshold are marked for pruning if outside the keep minimum window."

  - id: untagged_retention_days
    type: INT
    defaults: 7
    displayName: "Untagged Grace Period (Days)"
    description: "Safety grace period for untagged (dangling digest) images. Untagged manifests pushed within this window are NEVER deleted."

  - id: protected_tag_regex
    type: STRING
    defaults: "^(latest|main|master|prod|production|staging|stable|v[0-9]+.*|release-.*)$"
    displayName: "Protected Tag Regex"
    description: "Regex pattern for tags that are permanently exempt from automated deletion."

  - id: active_deployment_digests
    type: ARRAY
    itemType: STRING
    defaults: []
    displayName: "Active Deployment Digests Allowlist"
    description: "Optional list of image digests currently running in Kubernetes/ECS clusters. Images matching these digests are strictly protected from deletion."

  - id: max_deletions_per_run
    type: INT
    defaults: 25
    displayName: "Maximum Deletions Per Run"
    description: "Blast-radius safeguard: maximum number of manifests that can be deleted in a single execution."

  - id: dry_run
    type: BOOL
    defaults: true
    displayName: "Dry Run Mode"
    description: "When true (default), audits the registry and generates the deletion plan without performing deletions."

  - id: enable_deletion
    type: BOOL
    defaults: false
    displayName: "Enable Deletion Gate"
    description: "Safety opt-in switch: must be explicitly set to true alongside dry_run=false to proceed to the approval gate and deletion step."

  - id: notify_slack
    type: BOOL
    defaults: false
    displayName: "Notify Slack"
    description: "Whether to dispatch Slack notifications with deletion plan summaries and execution outcomes."

  - id: slack_webhook_url
    type: STRING
    required: false
    displayName: "Slack Webhook URL"
    description: "Slack incoming webhook URL for notifications. If omitted, falls back to the SLACK_WEBHOOK_URL secret."

tasks:
  - id: discover_or_load_inventory
    type: io.kestra.plugin.scripts.python.Script
    description: Discover repositories and manifest metadata from registry v2 API or load provided inventory file.
    containerImage: python:3.12-slim
    inputFiles:
      uploaded_inventory.json: "{{ inputs.registry_inventory_file ?? '' }}"
    outputFiles:
      - raw_registry_inventory.json
    env:
      REGISTRY_URL: "{{ inputs.registry_url }}"
      REPOSITORY_FILTER: "{{ inputs.repository_filter }}"
      REGISTRY_USERNAME: "{{ secret('REGISTRY_USERNAME') ?? '' }}"
      REGISTRY_PASSWORD: "{{ secret('REGISTRY_PASSWORD') ?? '' }}"
    script: |
      import base64
      import json
      import os
      import re
      import sys
      import urllib.error
      import urllib.request

      def main():
          uploaded_file = "uploaded_inventory.json"
          if os.path.exists(uploaded_file) and os.path.getsize(uploaded_file) > 0:
              print(f"Loading provided offline registry inventory from '{uploaded_file}'...")
              try:
                  with open(uploaded_file, "r", encoding="utf-8") as src, open("raw_registry_inventory.json", "w", encoding="utf-8") as dst:
                      dst.write(src.read())
                  print("Offline inventory successfully staged.")
                  return
              except Exception as exc:
                  print(f"[ERROR] Failed to read uploaded inventory file: {exc}", file=sys.stderr)
                  sys.exit(1)

          registry_url = os.environ.get("REGISTRY_URL", "http://localhost:5000").rstrip("/")
          repo_filter = os.environ.get("REPOSITORY_FILTER", ".*")
          username = os.environ.get("REGISTRY_USERNAME", "").strip()
          password = os.environ.get("REGISTRY_PASSWORD", "").strip()

          headers = {
              "Accept": "application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json"
          }
          if username and password:
              auth_pair = f"{username}:{password}".encode("utf-8")
              headers["Authorization"] = f"Basic {base64.b64encode(auth_pair).decode('utf-8')}"

          try:
              repo_pattern = re.compile(repo_filter)
          except re.error as exc:
              print(f"[ERROR] Invalid repository filter regex '{repo_filter}': {exc}", file=sys.stderr)
              sys.exit(1)

          # Query catalog
          catalog_url = f"{registry_url}/v2/_catalog"
          print(f"Connecting to registry catalog at: {catalog_url}")
          try:
              req = urllib.request.Request(catalog_url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  catalog_data = json.loads(resp.read().decode("utf-8"))
          except Exception as exc:
              print(f"[ERROR] Failed to connect to registry catalog at {catalog_url}: {exc}", file=sys.stderr)
              sys.exit(1)

          raw_repos = catalog_data.get("repositories", [])
          matched_repos = [r for r in raw_repos if repo_pattern.search(r)]
          print(f"Discovered {len(raw_repos)} repositories ({len(matched_repos)} matched filter).")

          inventory = {"repositories": []}

          for repo in matched_repos:
              tags_url = f"{registry_url}/v2/{repo}/tags/list"
              try:
                  req = urllib.request.Request(tags_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      tags_data = json.loads(resp.read().decode("utf-8"))
                      tags = tags_data.get("tags") or []
              except Exception as exc:
                  print(f"[WARN] Could not retrieve tags for repository '{repo}': {exc}", file=sys.stderr)
                  tags = []

              manifest_records = []
              # Query manifests for each tag
              for tag in tags:
                  man_url = f"{registry_url}/v2/{repo}/manifests/{tag}"
                  try:
                      mreq = urllib.request.Request(man_url, headers=headers)
                      with urllib.request.urlopen(mreq, timeout=30) as mresp:
                          digest = mresp.headers.get("Docker-Content-Digest") or mresp.headers.get("ETag") or tag
                          raw_content = mresp.read().decode("utf-8")
                          mdata = json.loads(raw_content)
                          size = sum(int(l.get("size", 0)) for l in mdata.get("layers", []))
                          manifest_records.append({
                              "digest": digest.strip('"'),
                              "tags": [tag],
                              "size_bytes": size,
                              "pushed_at": None
                          })
                  except Exception as exc:
                      print(f"[WARN] Could not read manifest for '{repo}:{tag}': {exc}", file=sys.stderr)

              inventory["repositories"].append({
                  "name": repo,
                  "manifests": manifest_records
              })

          with open("raw_registry_inventory.json", "w", encoding="utf-8") as f:
              json.dump(inventory, f, indent=2)
          print("Registry inventory successfully generated.")

      if __name__ == "__main__":
          main()

  - id: evaluate_retention_policy
    type: io.kestra.plugin.scripts.python.Script
    description: Evaluate registry manifests against retention policies and produce dry-run deletion plan.
    containerImage: python:3.12-slim
    inputFiles:
      raw_registry_inventory.json: "{{ outputs.discover_or_load_inventory.outputFiles['raw_registry_inventory.json'] }}"
    outputFiles:
      - registry_retention_plan.json
      - registry_retention_audit.md
    env:
      KEEP_MINIMUM_PER_REPOSITORY: "{{ inputs.keep_minimum_per_repository }}"
      TAGGED_STALE_DAYS: "{{ inputs.tagged_stale_days }}"
      UNTAGGED_RETENTION_DAYS: "{{ inputs.untagged_retention_days }}"
      PROTECTED_TAG_REGEX: "{{ inputs.protected_tag_regex }}"
      ACTIVE_DEPLOYMENT_DIGESTS: "{{ inputs.active_deployment_digests | toJson }}"
      MAX_DELETIONS_PER_RUN: "{{ inputs.max_deletions_per_run }}"
    script: |
      import json
      import os
      import re
      import sys
      from datetime import datetime, timezone

      def parse_iso_time(ts_str):
          if not ts_str:
              return None
          try:
              cleaned = ts_str.replace("Z", "+00:00")
              return datetime.fromisoformat(cleaned)
          except Exception:
              return None

      def main():
          inventory_file = "raw_registry_inventory.json"
          if not os.path.exists(inventory_file):
              print(f"[ERROR] Inventory file '{inventory_file}' not found.", file=sys.stderr)
              sys.exit(1)

          if os.path.getsize(inventory_file) == 0:
              print(f"[ERROR] Inventory file '{inventory_file}' is empty (0 bytes).", file=sys.stderr)
              sys.exit(1)

          keep_min_str = os.environ.get("KEEP_MINIMUM_PER_REPOSITORY", "5")
          stale_days_str = os.environ.get("TAGGED_STALE_DAYS", "90")
          untagged_days_str = os.environ.get("UNTAGGED_RETENTION_DAYS", "7")
          max_del_str = os.environ.get("MAX_DELETIONS_PER_RUN", "25")
          protected_regex_str = os.environ.get("PROTECTED_TAG_REGEX", "^(latest|main|master|prod|production|staging|stable|v[0-9]+.*|release-.*)$")
          active_digests_raw = os.environ.get("ACTIVE_DEPLOYMENT_DIGESTS", "[]")

          try:
              keep_min = int(keep_min_str)
              stale_days = int(stale_days_str)
              untagged_days = int(untagged_days_str)
              max_del = int(max_del_str)
          except (ValueError, TypeError) as exc:
              print(f"[ERROR] Invalid numeric parameters: {exc}", file=sys.stderr)
              sys.exit(1)

          if keep_min < 0 or stale_days < 0 or untagged_days < 0:
              print("[ERROR] Retention thresholds must be non-negative.", file=sys.stderr)
              sys.exit(1)
          if max_del <= 0:
              print("[ERROR] max_deletions_per_run must be greater than zero.", file=sys.stderr)
              sys.exit(1)

          try:
              pattern = re.compile(protected_regex_str)
          except re.error as exc:
              print(f"[ERROR] Invalid protected_tag_regex: {exc}", file=sys.stderr)
              sys.exit(1)

          try:
              active_digests_list = json.loads(active_digests_raw)
              active_digests = set(active_digests_list if isinstance(active_digests_list, list) else [])
          except Exception:
              active_digests = set()

          try:
              with open(inventory_file, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"[ERROR] Failed to parse inventory JSON: {exc}", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data, dict):
              print(f"[ERROR] Root inventory must be an object/dict, got {type(data).__name__}.", file=sys.stderr)
              sys.exit(1)

          repositories = data.get("repositories", [])
          if not isinstance(repositories, list):
              print("[ERROR] 'repositories' property must be a list.", file=sys.stderr)
              sys.exit(1)

          now = datetime.now(timezone.utc)

          total_manifests = 0
          total_tagged = 0
          total_untagged = 0
          retained_items = []
          deletion_candidates = []

          for repo_entry in repositories:
              if not isinstance(repo_entry, dict):
                  continue
              repo_name = str(repo_entry.get("name", "unknown"))
              manifests = repo_entry.get("manifests", [])
              if not isinstance(manifests, list):
                  continue

              tagged_manifests = []
              untagged_manifests = []

              for m in manifests:
                  if not isinstance(m, dict):
                      continue
                  total_manifests += 1
                  digest = str(m.get("digest", "")).strip()
                  tags = m.get("tags") or []
                  if not isinstance(tags, list):
                      tags = [str(tags)]
                  size_bytes = int(m.get("size_bytes", 0))
                  pushed_at_str = m.get("pushed_at") or m.get("created_at") or ""
                  pushed_at = parse_iso_time(pushed_at_str)

                  record = {
                      "repository": repo_name,
                      "digest": digest,
                      "tags": tags,
                      "size_bytes": size_bytes,
                      "size_mb": round(size_bytes / (1024 * 1024), 2),
                      "pushed_at": pushed_at.isoformat() if pushed_at else None,
                      "age_days": (now - pushed_at).days if pushed_at else 0
                  }

                  if len(tags) > 0:
                      total_tagged += 1
                      tagged_manifests.append(record)
                  else:
                      total_untagged += 1
                      untagged_manifests.append(record)

              tagged_manifests.sort(key=lambda x: x["pushed_at"] or "", reverse=True)

              for idx, rec in enumerate(tagged_manifests):
                  if rec["digest"] in active_digests:
                      rec["decision"] = "RETAIN"
                      rec["reason"] = "Active deployment reference matches protected digest allowlist."
                      retained_items.append(rec)
                      continue

                  matched_protected = [t for t in rec["tags"] if pattern.search(t)]
                  if matched_protected:
                      rec["decision"] = "RETAIN"
                      rec["reason"] = f"Protected tag pattern matched: {', '.join(matched_protected)}"
                      retained_items.append(rec)
                      continue

                  if idx < keep_min:
                      rec["decision"] = "RETAIN"
                      rec["reason"] = f"Within newest {keep_min} tagged images for repository (rank #{idx+1})."
                      retained_items.append(rec)
                      continue

                  if rec["age_days"] <= stale_days:
                      rec["decision"] = "RETAIN"
                      rec["reason"] = f"Tagged image age ({rec['age_days']}d) is within stale retention threshold ({stale_days}d)."
                      retained_items.append(rec)
                  else:
                      rec["decision"] = "CANDIDATE_FOR_DELETION"
                      rec["reason"] = f"Tagged image age ({rec['age_days']}d) exceeds stale threshold ({stale_days}d) and is outside minimum keep window."
                      deletion_candidates.append(rec)

              for rec in untagged_manifests:
                  if rec["digest"] in active_digests:
                      rec["decision"] = "RETAIN"
                      rec["reason"] = "Active deployment reference matches protected digest allowlist."
                      retained_items.append(rec)
                      continue

                  if rec["age_days"] <= untagged_days:
                      rec["decision"] = "RETAIN"
                      rec["reason"] = f"Untagged image age ({rec['age_days']}d) is within safety grace period ({untagged_days}d)."
                      retained_items.append(rec)
                  else:
                      rec["decision"] = "CANDIDATE_FOR_DELETION"
                      rec["reason"] = f"Untagged dangling manifest age ({rec['age_days']}d) exceeds grace period ({untagged_days}d)."
                      deletion_candidates.append(rec)

          total_retained = len(retained_items)
          deletion_candidates.sort(key=lambda x: x["age_days"], reverse=True)

          planned_deletions = deletion_candidates[:max_del]
          deferred_deletions = deletion_candidates[max_del:]

          total_planned = len(planned_deletions)
          reclaimable_bytes = sum(item["size_bytes"] for item in planned_deletions)
          reclaimable_mb = round(reclaimable_bytes / (1024 * 1024), 2)

          if total_planned > 0:
              verdict = "ACTION_PLANNED"
              action_required = "APPROVAL_REQUIRED"
              summary = f"Identified {len(deletion_candidates)} stale/untagged deletion candidates across {len(repositories)} repositories. Planned {total_planned} deletions (capped by max_deletions_per_run={max_del}) to reclaim ~{reclaimable_mb} MB."
          else:
              verdict = "CLEAR"
              action_required = "NONE"
              summary = f"Registry retention audit clear: all {total_manifests} manifests satisfy retention policies across {len(repositories)} repositories. No deletions planned."

          report_payload = {
              "timestamp": now.isoformat(),
              "verdict": verdict,
              "action_required": action_required,
              "statistics": {
                  "repositories_scanned": len(repositories),
                  "total_manifests": total_manifests,
                  "tagged_manifests": total_tagged,
                  "untagged_manifests": total_untagged,
                  "retained_manifests": total_retained,
                  "total_candidates_found": len(deletion_candidates),
                  "planned_deletions_count": total_planned,
                  "deferred_deletions_count": len(deferred_deletions),
                  "estimated_reclaimable_mb": reclaimable_mb,
                  "estimated_reclaimable_bytes": reclaimable_bytes
              },
              "thresholds": {
                  "keep_minimum_per_repository": keep_min,
                  "tagged_stale_days": stale_days,
                  "untagged_retention_days": untagged_days,
                  "protected_tag_regex": protected_regex_str,
                  "active_digests_count": len(active_digests),
                  "max_deletions_per_run": max_del
              },
              "planned_deletions": planned_deletions,
              "deferred_deletions": deferred_deletions,
              "summary": summary
          }

          with open("registry_retention_plan.json", "w", encoding="utf-8") as f:
              json.dump(report_payload, f, indent=2)

          # Generate Markdown Audit Report
          md_lines = [
              "# Container Registry Retention & Untagged Image Audit Report",
              "",
              f"**Audit Timestamp:** `{report_payload['timestamp']}`  ",
              f"**Verdict:** `{verdict}`  ",
              f"**Action Required:** `{action_required}`  ",
              "",
              "## Retention & Cleanup Summary",
              "",
              "| Metric | Value |",
              "|:---|:---|",
              f"| **Repositories Scanned** | {len(repositories)} |",
              f"| **Total Manifests Scanned** | {total_manifests} |",
              f"| **Tagged Images (Active)** | {total_tagged} |",
              f"| **Untagged Manifests (Dangling)** | {total_untagged} |",
              f"| **Retained Manifests** | {total_retained} |",
              f"| **Planned Deletions (Capped)** | **{total_planned}** |",
              f"| **Deferred Deletions (Next Run)** | {len(deferred_deletions)} |",
              f"| **Estimated Reclaimable Space** | **{reclaimable_mb} MB** |",
              "",
              "## Policy Thresholds Applied",
              "",
              f"- **Minimum Retained Per Repo:** `{keep_min}` newest tagged images",
              f"- **Tagged Stale Days Threshold:** `{stale_days}` days",
              f"- **Untagged Safety Grace Period:** `{untagged_days}` days",
              f"- **Protected Tag Regex:** `{protected_regex_str}`",
              f"- **Active Deployment Digests Allowlist:** `{len(active_digests)}` digests protected",
              f"- **Max Deletions Per Run (Blast-Radius Ceiling):** `{max_del}` manifests",
              ""
          ]

          if total_planned > 0:
              md_lines.append("## Planned Manifest Deletions (Dry-Run Preview)")
              md_lines.append("")
              md_lines.append("| Repository | Digest | Tags | Age | Size (MB) | Deletion Rationale |")
              md_lines.append("|:---|:---|:---|:---|:---|:---|")
              for item in planned_deletions:
                  tag_display = ", ".join(item["tags"]) if item["tags"] else "*untagged*"
                  short_digest = item["digest"][:19] + "..." if len(item["digest"]) > 22 else item["digest"]
                  md_lines.append(f"| `{item['repository']}` | `{short_digest}` | `{tag_display}` | {item['age_days']}d | {item['size_mb']} MB | {item['reason']} |")
              md_lines.append("")

          if deferred_deletions:
              md_lines.append(f"## Deferred Deletions ({len(deferred_deletions)} items capped by blast-radius limit)")
              md_lines.append("")
              md_lines.append(f"> The policy ceiling `max_deletions_per_run={max_del}` prevented deleting these candidates in this run. They will be evaluated in the next scheduled execution.")
              md_lines.append("")

          md_lines.append("## Operational Recommendations & Safety Notes")
          md_lines.append("")
          if total_planned > 0:
              md_lines.append("- Review the planned deletion list above before approving the execution gate.")
              md_lines.append("- For private registries, verify that any out-of-band deploy pipelines have pinned their images.")
              md_lines.append("- Deleting manifests flags them for storage reclamation; remember to run registry garbage collection (`registry garbage-collect`) on self-hosted distributions to reclaim underlying blob disk space.")
          else:
              md_lines.append("- Registry retention is healthy and all images comply with policies.")
              md_lines.append("- Continue running automated weekly audits to prevent dangling untagged manifest buildup.")
          md_lines.append("")

          with open("registry_retention_audit.md", "w", encoding="utf-8") as f:
              f.write("\n".join(md_lines) + "\n")

          kestra_outputs = {
              "verdict": verdict,
              "action_required": action_required,
              "repositories_scanned": len(repositories),
              "total_manifests_scanned": total_manifests,
              "retained_count": total_retained,
              "planned_deletions_count": total_planned,
              "deferred_deletions_count": len(deferred_deletions),
              "estimated_reclaimable_mb": reclaimable_mb,
              "summary": summary
          }
          print("::" + json.dumps({"outputs": kestra_outputs}) + "::")

      if __name__ == "__main__":
          main()

  - id: check_slack_plan_notification
    type: io.kestra.plugin.core.flow.If
    description: Dispatch Slack notification when deletion candidates are identified.
    condition: "{{ inputs.notify_slack and outputs.evaluate_retention_policy.vars.planned_deletions_count > 0 }}"
    then:
      - id: send_slack_plan_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post structured retention audit summary to Slack.
        url: "{{ inputs.slack_webhook_url ?? secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":package: *Container Registry Retention Audit Alert - {{ inputs.registry_url }}*\n• *Verdict:* `{{ outputs.evaluate_retention_policy.vars.verdict }}`\n• *Repositories Scanned:* `{{ outputs.evaluate_retention_policy.vars.repositories_scanned }}`\n• *Total Manifests:* `{{ outputs.evaluate_retention_policy.vars.total_manifests_scanned }}`\n• *Planned Deletions:* `{{ outputs.evaluate_retention_policy.vars.planned_deletions_count }}`\n• *Estimated Reclaimable Space:* `{{ outputs.evaluate_retention_policy.vars.estimated_reclaimable_mb }} MB`\n• *Mode:* `{{ inputs.dry_run ? 'DRY-RUN (Advisory)' : 'APPROVAL-GATED EXECUTION' }}`\n• *Summary:* {{ outputs.evaluate_retention_policy.vars.summary }}\n• *Execution ID:* `{{ execution.id }}`"
          }

  - id: retention_execution_gate
    type: io.kestra.plugin.core.flow.If
    description: Execute deletions only when dry_run=false, enable_deletion=true, and candidates are planned.
    condition: "{{ not inputs.dry_run and inputs.enable_deletion and outputs.evaluate_retention_policy.vars.planned_deletions_count > 0 }}"
    then:
      - id: pause_for_human_approval
        type: io.kestra.plugin.core.flow.Pause
        description: Requires explicit human operator approval before executing planned manifest deletions.
        timeout: PT24H
        onResume:
          - id: approved
            type: BOOLEAN
            displayName: "Approve Deletion Execution"
            description: "Set to true to confirm deletion of planned stale and untagged manifests."
          - id: approval_reason
            type: STRING
            displayName: "Approval Reason / Ticket"
            description: "Change ticket ID or approval rationale for compliance audit logging."

      - id: execute_approved_deletions
        type: io.kestra.plugin.scripts.python.Script
        description: Execute deletion of approved manifests via registry v2 API and record results.
        containerImage: python:3.12-slim
        inputFiles:
          registry_retention_plan.json: "{{ outputs.evaluate_retention_policy.outputFiles['registry_retention_plan.json'] }}"
        outputFiles:
          - deletion_execution_outcomes.json
        env:
          IS_APPROVED: "{{ outputs.pause_for_human_approval.onResume.approved }}"
          REGISTRY_URL: "{{ inputs.registry_url }}"
          REGISTRY_USERNAME: "{{ secret('REGISTRY_USERNAME') ?? '' }}"
          REGISTRY_PASSWORD: "{{ secret('REGISTRY_PASSWORD') ?? '' }}"
        script: |
          import base64
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          def main():
              is_approved = os.environ.get("IS_APPROVED", "false").lower() == "true"
              if not is_approved:
                  print("Deletion execution rejected or unapproved by operator. No manifests deleted.")
                  result = {
                      "execution_status": "REJECTED_BY_OPERATOR",
                      "executed_deletions_count": 0,
                      "deletion_errors_count": 0,
                      "results": []
                  }
                  with open("deletion_execution_outcomes.json", "w", encoding="utf-8") as f:
                      json.dump(result, f, indent=2)
                  print("::" + json.dumps({"outputs": result}) + "::")
                  return

              plan_file = "registry_retention_plan.json"
              with open(plan_file, "r", encoding="utf-8") as f:
                  plan_data = json.load(f)

              planned_items = plan_data.get("planned_deletions", [])
              registry_url = os.environ.get("REGISTRY_URL", "http://localhost:5000").rstrip("/")
              username = os.environ.get("REGISTRY_USERNAME", "").strip()
              password = os.environ.get("REGISTRY_PASSWORD", "").strip()

              headers = {}
              if username and password:
                  auth_pair = f"{username}:{password}".encode("utf-8")
                  headers["Authorization"] = f"Basic {base64.b64encode(auth_pair).decode('utf-8')}"

              success_count = 0
              error_count = 0
              outcomes = []

              for item in planned_items:
                  repo = item.get("repository")
                  digest = item.get("digest")
                  delete_url = f"{registry_url}/v2/{repo}/manifests/{digest}"
                  print(f"Deleting manifest: {repo}@{digest}...")

                  try:
                      req = urllib.request.Request(delete_url, headers=headers, method="DELETE")
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          status = resp.status
                          success_count += 1
                          outcomes.append({
                              "repository": repo,
                              "digest": digest,
                              "status": "DELETED",
                              "http_code": status
                          })
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          # Manifest already removed
                          success_count += 1
                          outcomes.append({
                              "repository": repo,
                              "digest": digest,
                              "status": "ALREADY_DELETED",
                              "http_code": 404
                          })
                      else:
                          error_count += 1
                          outcomes.append({
                              "repository": repo,
                              "digest": digest,
                              "status": "FAILED",
                              "http_code": exc.code,
                              "error": str(exc)
                          })
                  except Exception as exc:
                      error_count += 1
                      outcomes.append({
                          "repository": repo,
                          "digest": digest,
                          "status": "ERROR",
                          "error": str(exc)
                      })

              execution_summary = {
                  "execution_status": "COMPLETED_WITH_ERRORS" if error_count > 0 else "SUCCESS",
                  "executed_deletions_count": success_count,
                  "deletion_errors_count": error_count,
                  "results": outcomes
              }

              with open("deletion_execution_outcomes.json", "w", encoding="utf-8") as f:
                  json.dump(execution_summary, f, indent=2)

              print("::" + json.dumps({"outputs": execution_summary}) + "::")

          if __name__ == "__main__":
              main()

      - id: check_slack_execution_result
        type: io.kestra.plugin.core.flow.If
        description: Post execution completion summary to Slack.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: send_slack_execution_alert
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Notify Slack of manifest deletion execution results.
            url: "{{ inputs.slack_webhook_url ?? secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":white_check_mark: *Container Registry Cleanup Executed - {{ inputs.registry_url }}*\n• *Status:* `{{ outputs.execute_approved_deletions.vars.execution_status }}`\n• *Executed Deletions:* `{{ outputs.execute_approved_deletions.vars.executed_deletions_count }}`\n• *Failed Deletions:* `{{ outputs.execute_approved_deletions.vars.deletion_errors_count }}`\n• *Approver:* `{{ outputs.pause_for_human_approval.onResume.approval_reason ?? 'Operator' }}`\n• *Execution ID:* `{{ execution.id }}`"
              }
    else:
      - id: log_dry_run_outcome
        type: io.kestra.plugin.core.log.Log
        description: Log audit completion status when running in dry-run mode or when no deletions are planned.
        message: >-
          Registry retention audit finished in advisory/dry-run mode for '{{ inputs.registry_url }}'.
          Planned candidate deletions: {{ outputs.evaluate_retention_policy.vars.planned_deletions_count }} (reclaimable: {{ outputs.evaluate_retention_policy.vars.estimated_reclaimable_mb }} MB).
          Summary: {{ outputs.evaluate_retention_policy.vars.summary }}

outputs:
  - id: verdict
    type: STRING
    description: Audit verdict (CLEAR, ACTION_PLANNED).
    value: "{{ outputs.evaluate_retention_policy.vars.verdict }}"

  - id: planned_deletions_count
    type: INT
    description: Count of stale/untagged manifests planned for deletion.
    value: "{{ outputs.evaluate_retention_policy.vars.planned_deletions_count }}"

  - id: estimated_reclaimable_mb
    type: FLOAT
    description: Estimated disk space reclaimable in megabytes.
    value: "{{ outputs.evaluate_retention_policy.vars.estimated_reclaimable_mb }}"

  - id: retention_plan_json
    type: FILE
    description: Detailed JSON deletion plan and manifest metrics.
    value: "{{ outputs.evaluate_retention_policy.outputFiles['registry_retention_plan.json'] }}"

  - id: retention_audit_md
    type: FILE
    description: Human-readable Markdown summary report.
    value: "{{ outputs.evaluate_retention_policy.outputFiles['registry_retention_audit.md'] }}"

extend:
  title: "Container Registry Retention and Untagged Image Cleanup Safety Gate"
  shortDescription: Audit OCI container registries, identify untagged and expired manifests, enforce retention policies with deployment protection, and gate deletions behind human approval.
  metaTitle: Container Registry Retention & Untagged Image Gate | Kestra
  metaDescription: "Audit OCI container registries for stale and untagged image bloat, enforce retention policies, and safeguard deletions behind approval gates."
  description: |
    Container registries steadily accumulate stale builds, obsolete branch tags, and orphaned
    untagged manifests over time. Untagged manifests are particularly problematic: whenever a tag
    such as `latest` or `staging` is overwritten by a new build, the previous manifest loses its tag
    pointer and remains as a dangling digest, silently consuming storage and increasing registry bills.

    Directly executing `DELETE` commands or relying on raw cron scripts introduces serious risks:
    deleting images currently referenced by active Kubernetes deployments causes `ImagePullBackOff`
    outages during pod rescheduling, while deleting recently pushed untagged intermediate layers
    breaks active build pipelines.

    This blueprint provides an enterprise safety gate for OCI and Docker Registry v2 storage hygiene.
    It combines multi-repository discovery, strict retention rule evaluation, active deployment protection,
    blast-radius deletion limits, downloadable JSON/Markdown audit reports, and human-in-the-loop approval.

    ## How it works

    1. **Catalog & Metadata Discovery**: `discover_or_load_inventory` queries `/v2/_catalog`, filters repositories against `repository_filter`, and collects tags and manifest digests with layer sizes and creation timestamps. Alternatively, an offline inventory JSON file can be provided via `registry_inventory_file` for air-gapped environments or CI validation.
    2. **Retention Policy Evaluation**: `evaluate_retention_policy` analyzes manifests against strict safety rules:
       - **Active Deployment Allowlist**: Any digest listed in `active_deployment_digests` is permanently protected from deletion.
       - **Protected Tag Regex**: Manifests bearing tags matching `protected_tag_regex` (e.g. `main`, `prod`, `v*`, `release-*`) are retained.
       - **Minimum Tagged Retention**: The newest `keep_minimum_per_repository` tagged images are retained regardless of age.
       - **Untagged Safety Grace Period**: Untagged manifests younger than `untagged_retention_days` (default: 7 days) are never deleted, ensuring ongoing CI builds and layer caches are undisturbed.
       - **Stale Tag Pruning**: Tagged images older than `tagged_stale_days` (default: 90 days) outside the minimum keep window are planned for deletion.
    3. **Blast-Radius Safeguard**: If deletion candidates exceed `max_deletions_per_run` (default: 25), only the oldest 25 candidates are planned, and remaining items are safely deferred to subsequent runs.
    4. **Audit Reporting**: Generates `registry_retention_plan.json` (machine-readable) and `registry_retention_audit.md` (human-readable table and metrics).
    5. **Slack Alerting**: Posts an audit summary to Slack when deletion candidates are identified.
    6. **Approval & Execution Gate**: In dry-run mode (`dry_run: true`, default), logs the plan without deleting anything. When `dry_run: false` and `enable_deletion: true`, enters a Kestra `Pause` task requiring explicit operator confirmation before issuing authenticated `DELETE /v2/<repo>/manifests/<digest>` calls.

    ## What you get

    - Automated discovery of dangling untagged manifests and stale tagged images.
    - Zero accidental outages: active deployment allowlists and protected tag regexes.
    - Configurable grace periods preventing premature deletion of active build artifacts.
    - Blast-radius limits capping max deletions per run.
    - Full audit trail with downloadable JSON and Markdown reports.
    - Slack notifications for planned candidate batches and verified execution outcomes.

    ## Who it's for

    - Platform and DevOps engineers managing private OCI or Docker registries (Harbor, Quay, Zot, Docker Registry v2, ECR, Artifact Registry).
    - FinOps teams curbing container registry cloud storage costs.
    - SRE teams requiring auditable, approval-gated artifact lifecycle automation.

    ## Why orchestrate this with Kestra

    Ad-hoc cleanup scripts lack state awareness, human approval controls, and verification. Orchestrating registry retention in Kestra provides:
    - **Safe Two-Stage Execution**: Decouple discovery and dry-run auditing from destructive deletion.
    - **Interactive Approvals**: Hold execution with Kestra's `Pause` task until an engineer reviews the generated Markdown table and approves.
    - **Auditable History**: Keep an immutable record of every audit report, approver identity, and deleted digest.

    ## Policy Defaults & Safety Scope

    - **Policy Defaults**: `keep_minimum_per_repository: 5`, `tagged_stale_days: 90`, and `untagged_retention_days: 7` are organizational baseline defaults. Customize them to fit your release cadence.
    - **Blob Garbage Collection**: Deleting manifests via the OCI Distribution API unlinks tags and manifest references. On self-hosted registries, run registry garbage collection (`registry garbage-collect`) during low-traffic maintenance windows to physically purge unreferenced blobs from disk.

    ## Prerequisites & Secrets

    - **Registry API Access**: HTTP/HTTPS network access to the registry endpoint from the Kestra worker.
    - **Registry Credentials**: For authenticated registries, configure `REGISTRY_USERNAME` and `REGISTRY_PASSWORD` secrets.
    - **Slack Webhook**: Required only when `notify_slack: true`. Provide via `slack_webhook_url` input or `SLACK_WEBHOOK_URL` secret.

    ## Quick start

    1. Set `registry_url` to your registry endpoint (e.g., `http://registry.internal:5000` or `https://harbor.example.com`).
    2. Leave `dry_run: true` to generate an initial advisory report without touching any images.
    3. Execute the flow and inspect `registry_retention_audit.md` in the Outputs tab.
    4. To enforce cleanup, set `dry_run: false`, `enable_deletion: true`, resume the paused execution upon review, and confirm execution outcomes.

    ## How to extend

    - **Kubernetes Cluster Integration**: Automatically populate `active_deployment_digests` by chaining this flow after a query to the Kubernetes API.
    - **Multi-Cloud Registry Sweeps**: Loop this blueprint across multiple regional registry mirrors using Kestra's `Loop` task.
    - **Scheduled Maintenance Windows**: Enable a weekly cron schedule during off-hours followed by an automated storage compaction task.

    ## Links

    - [OCI Distribution Specification](https://github.com/opencontainers/distribution-spec)
    - [Docker Registry v2 HTTP API](https://distribution.github.io/distribution/spec/api/)
    - [Kestra Pause Task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.pause)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
