id: iam-unused-identities-finder
namespace: company.security

description: |
  Finds orphaned IAM users and roles with zero activity. Identities nobody has
  used in `inactivity_days` are invisible attack surface — this flow checks
  console logins, access-key usage, and role assumptions, then posts a Slack
  report listing removal candidates with last-activity evidence. Report-only:
  nothing is ever deleted.

inputs:
  - id: inactivity_days
    type: INT
    defaults: 90
    description: Flag identities with no activity in this many days.
  - id: include_roles
    type: BOOLEAN
    defaults: true
    description: Also audit IAM roles (via RoleLastUsed). Set false for users only.

tasks:
  - id: fetch_identities
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: List IAM users and (optionally) roles, excluding service-linked ones.
    commands:
      - |
        python3 << 'EOF'
        import json, subprocess

        def aws(*args):
            p = subprocess.run(["aws"] + list(args), capture_output=True, text=True)
            return p.stdout.strip()

        users = json.loads(aws(
            "iam", "list-users", "--query", "Users[].UserName", "--output", "json",
        ) or "[]")

        roles = []
        if "{{ inputs.include_roles }}" == "true":
            all_roles = json.loads(aws(
                "iam", "list-roles", "--query", "Roles[].[RoleName,Path]", "--output", "json",
            ) or "[]")
            roles = [
                name for name, path in all_roles
                if not name.startswith("AWSServiceRole")
                and "/aws-service-role/" not in (path or "")
                and name != "OrganizationAccountAccessRole"
            ]

        identities = ["user:%s" % u for u in users] + ["role:%s" % r for r in roles]
        print("IDENTITY_LIST=" + " ".join(identities))
        print("USER_COUNT=%d" % len(users))
        print("ROLE_COUNT=%d" % len(roles))
        print("Listed %d user(s) and %d role(s)" % (len(users), len(roles)))
        EOF
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: us-east-1

  - id: audit_activity
    type: io.kestra.plugin.core.flow.ForEach
    description: Check each identity for any activity inside the inactivity window.
    values: "{{ outputs.fetch_identities.vars.IDENTITY_LIST | split(' ') }}"
    tasks:
      - id: audit_identity
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Find the most recent activity for one user or role.
        commands:
          - |
            python3 << 'EOF'
            import json, subprocess, datetime

            def aws(*args):
                p = subprocess.run(["aws"] + list(args), capture_output=True, text=True)
                return p.stdout.strip()

            ident = "{{ taskrun.value }}"
            inactivity_days = {{ inputs.inactivity_days }}
            now = datetime.datetime.now(datetime.timezone.utc)

            if not ident:
                print("IDENTITY=")
                print("INACTIVE=false")
                print("LAST_ACTIVITY=")
                print("AGE_DAYS=0")
                raise SystemExit

            kind, name = ident.split(":", 1)
            if kind == "user":
                info = json.loads(aws(
                    "iam", "get-user", "--user-name", name,
                    "--query", "User.{Created:CreateDate,Pwd:PasswordLastUsed}",
                    "--output", "json",
                ) or "{}")
                created = datetime.datetime.fromisoformat(info["Created"]) if info.get("Created") else now
                last = datetime.datetime.fromisoformat(info["Pwd"]) if info.get("Pwd") else None
                key_ids = json.loads(aws(
                    "iam", "list-access-keys", "--user-name", name,
                    "--query", "AccessKeyMetadata[].AccessKeyId", "--output", "json",
                ) or "[]")
                for key_id in key_ids:
                    lu = aws(
                        "iam", "get-access-key-last-used", "--access-key-id", key_id,
                        "--query", "AccessKeyLastUsed.LastUsedDate", "--output", "text",
                    )
                    if lu and lu != "None":
                        d = datetime.datetime.fromisoformat(lu)
                        if last is None or d > last:
                            last = d
                if last:
                    idle = (now - last).days
                    evidence = "last activity %dd ago (%s)" % (idle, last.date().isoformat())
                    inactive = idle >= inactivity_days
                else:
                    age = (now - created).days
                    evidence = "no console login or access-key use ever recorded; created %dd ago" % age
                    inactive = age >= inactivity_days
            else:
                info = json.loads(aws(
                    "iam", "get-role", "--role-name", name,
                    "--query", "Role.{Created:CreateDate,LastUsed:RoleLastUsed.LastUsedDate,Service:RoleLastUsed.ServiceName}",
                    "--output", "json",
                ) or "{}")
                created = datetime.datetime.fromisoformat(info["Created"]) if info.get("Created") else now
                if info.get("LastUsed"):
                    last = datetime.datetime.fromisoformat(info["LastUsed"])
                    idle = (now - last).days
                    evidence = "last assumed %dd ago by %s" % (idle, info.get("Service") or "unknown")
                    inactive = idle >= inactivity_days
                else:
                    age = (now - created).days
                    evidence = "never assumed since creation %dd ago" % age
                    inactive = age >= inactivity_days

            print("IDENTITY=" + ident)
            print("INACTIVE=" + ("true" if inactive else "false"))
            print("LAST_ACTIVITY=" + evidence)
            EOF
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: us-east-1

      - id: notify
        type: io.kestra.plugin.core.flow.If
        description: Report inactive identities to Slack; stay quiet for active ones.
        condition: "{{ outputs.audit_identity.vars.INACTIVE == 'true' }}"
        then:
          - id: slack_inactive_identity
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":ghost: *Unused IAM identity* — `{{ outputs.audit_identity.vars.IDENTITY }}` has no activity in {{ inputs.inactivity_days }}d.\nEvidence: {{ outputs.audit_identity.vars.LAST_ACTIVITY }}\nCandidate for removal — verify in the IAM console first. This flow is report-only; nothing was deleted."
              }
        else:
          - id: log_active_identity
            type: io.kestra.plugin.core.log.Log
            message: "Identity {{ outputs.audit_identity.vars.IDENTITY }} is active: {{ outputs.audit_identity.vars.LAST_ACTIVITY }}."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Monday at 04:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 4 * * 1"
    disabled: true

extend:
  title: IAM Unused Identities Finder
  metaTitle: Find Orphaned IAM Users and Roles | Kestra
  shortDescription: Audit IAM users and roles for any activity in the inactivity window and get a Slack report of orphaned identities with last-activity evidence.
  metaDescription: Find IAM users and roles with zero activity in 90 days — orphaned identities are invisible attack surface. Weekly Slack report with last-activity evidence.
  description: |
    Every AWS account accumulates identities nobody uses anymore: the contractor whose engagement ended, the role created for a migration that finished, the test user from 2022. Each one is a login or an assume-role call waiting to be abused, and IAM gives you no "unused identities" dashboard. This blueprint builds one.

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 04:00 UTC (shipped disabled).
    2. `fetch_identities` lists all IAM users and roles via the AWS CLI, excluding service-linked roles (which can't be removed anyway).
    3. A ForEach loop audits each identity: for users it checks `PasswordLastUsed` plus every access key's last-used date; for roles it checks `RoleLastUsed`.
    4. Identities with no activity inside `inactivity_days` (default 90) are flagged, with the evidence attached.
    5. An `If` task posts a Slack report per flagged identity — quiet for identities that are actually in use.

    ## What you get

    - A weekly list of orphaned IAM users and roles, each with last-activity evidence (last login, last key use, or last role assumption).
    - Service-linked and org-access roles automatically excluded so the report stays actionable.
    - A strictly report-only flow: it never deletes anything, so it's safe to run on production accounts.

    ## Who it's for

    Security engineers running access reviews, platform teams doing quarterly IAM cleanups, and anyone preparing for a SOC 2 audit.

    ## Why orchestrate this with Kestra

    One-off IAM audits rot within a quarter. As a scheduled Kestra flow the review runs itself every week, the inactivity window is an input, every run is logged as audit evidence, and the Slack report lands where the team already looks — no spreadsheet maintenance.

    ## Prerequisites

    - AWS credentials with `iam:ListUsers`, `iam:ListRoles`, `iam:GetUser`, `iam:ListAccessKeys`, `iam:GetAccessKeyLastUsed`, and `iam:GetRole`.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the IAM API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the IAM API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the orphaned-identity report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Run manually once and review the Slack report.
    3. Remove the flagged identities in the IAM console, then enable the weekly schedule to keep the account clean.

    ## How to extend

    - Auto-tag stale identities (`stale-review=true`) instead of only reporting, as a step toward automated cleanup.
    - Cross-reference identities against your HR/IdP directory to distinguish "left the company" from "quiet service account".
    - Add attached-policy analysis to flag orphaned identities that also hold `AdministratorAccess`.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [AWS: finding unused credentials](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_finding-unused.html)
    - [get-role API (RoleLastUsed)](https://docs.aws.amazon.com/cli/latest/reference/iam/get-role.html)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
