id: bitcoin-deposit-confirmation-tracker
namespace: company.team
description: |
  Track Bitcoin invoice payments from first sighting to final confirmation.
  Bitcoin Core calls the webhook whenever the wallet sees a transaction; the
  flow re-checks every open invoice, classifies it as paid, overpaid,
  underpaid, or expired, catches reorgs, and tells your app and Slack.

concurrency:
  limit: 1
  behavior: QUEUE

triggers:
  - id: wallet_notify
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Call this from Bitcoin Core's walletnotify so every incoming transaction triggers a check within seconds, e.g. walletnotify=curl -s -X POST https://kestra.example.com/api/v1/main/executions/webhook/company.team/bitcoin-deposit-confirmation-tracker/btc-deposits-change-me?txid=%s"
    key: btc-deposits-change-me
  - id: confirmation_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: walletnotify fires when a transaction arrives and when it first confirms, but not for later confirmations or reorgs. This sweep moves invoices across the confirmation threshold and catches reorgs. Shipped disabled.
    disabled: true
    cron: "*/10 * * * *"

inputs:
  - id: rpc_url
    type: STRING
    defaults: http://127.0.0.1:38332
    description: Bitcoin Core JSON-RPC endpoint. The default is the signet port; use 18443 for regtest and 8332 for mainnet.
  - id: wallet
    type: STRING
    defaults: deposits
    description: Bitcoin Core wallet that owns the invoice addresses.
  - id: required_confirmations
    type: INT
    defaults: 3
    description: Confirmations a payment needs before the invoice counts as paid.
  - id: overpay_tolerance_btc
    type: FLOAT
    defaults: 0.00001
    description: Payments above the amount due by more than this are flagged as overpaid so you can refund the difference.
  - id: reorg_window_hours
    type: INT
    defaults: 24
    description: How long paid invoices stay under watch for chain reorganizations.
  - id: max_invoices
    type: INT
    defaults: 200
    description: Maximum number of invoices checked in one run.
  - id: callback_url
    type: STRING
    defaults: ""
    description: Optional URL in your application that receives a JSON POST for every invoice status change. Leave empty to only use Slack.
  - id: explorer_address_url
    type: STRING
    defaults: https://mempool.space/signet/address/
    description: Block explorer prefix for address links in notifications.

tasks:
  - id: node_check
    type: io.kestra.plugin.core.http.Request
    description: Fail fast with a clear error when the node is unreachable, the credentials are wrong, or the wallet is not loaded, before any invoice is touched.
    uri: "{{ inputs.rpc_url }}/wallet/{{ inputs.wallet }}"
    method: POST
    body: '{"jsonrpc": "1.0", "id": "kestra", "method": "getwalletinfo", "params": []}'
    options:
      auth:
        type: BASIC
        username: "{{ secret('BITCOIN_RPC_USER') }}"
        password: "{{ secret('BITCOIN_RPC_PASSWORD') }}"
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT30S
      maxAttempts: 3

  - id: ensure_table
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Create the invoice table on first run. Your application inserts one row per invoice with a fresh address from getnewaddress.
    url: "{{ secret('POSTGRES_URL') }}"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      CREATE TABLE IF NOT EXISTS invoices (
        id              BIGSERIAL PRIMARY KEY,
        address         TEXT NOT NULL UNIQUE,
        amount_due_btc  NUMERIC(16, 8) NOT NULL CHECK (amount_due_btc > 0),
        status          TEXT NOT NULL DEFAULT 'awaiting_payment',
        received_btc    NUMERIC(16, 8) NOT NULL DEFAULT 0,
        confirmed_btc   NUMERIC(16, 8) NOT NULL DEFAULT 0,
        expires_at      TIMESTAMPTZ NOT NULL DEFAULT now() + interval '1 hour',
        paid_at         TIMESTAMPTZ,
        notified_status TEXT,
        previous_notified_status TEXT,
        created_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at      TIMESTAMPTZ NOT NULL DEFAULT now()
      )

  - id: load_open_invoices
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Invoices that can still change, plus recently paid ones that could be undone by a reorg.
    url: "{{ secret('POSTGRES_URL') }}"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT id, address FROM invoices
      WHERE status IN ('awaiting_payment', 'seen', 'underpaid')
         OR (status IN ('paid', 'overpaid') AND paid_at > now() - interval '{{ inputs.reorg_window_hours }} hours')
         OR status IS DISTINCT FROM coalesce(notified_status, 'awaiting_payment')
      ORDER BY id
      LIMIT {{ inputs.max_invoices }}

  - id: nothing_open
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.load_open_invoices.size == 0 }}"
    then:
      - id: no_open_invoices
        type: io.kestra.plugin.core.execution.Exit
        state: SUCCESS

  - id: check_invoices
    type: io.kestra.plugin.core.flow.Loop
    description: For each open invoice, ask the node what the address has received with and without enough confirmations, then let Postgres decide the new status. The node recomputes these totals from the current chain, so a reorg simply shows up as a lower confirmed amount.
    values: "{{ outputs.load_open_invoices.rows | toJson }}"
    concurrencyLimit: 5
    tasks:
      - id: received_any
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.rpc_url }}/wallet/{{ inputs.wallet }}"
        method: POST
        body: '{"jsonrpc": "1.0", "id": "kestra", "method": "getreceivedbyaddress", "params": ["{{ fromJson(item.value).address }}", 0]}'
        options:
          auth:
            type: BASIC
            username: "{{ secret('BITCOIN_RPC_USER') }}"
            password: "{{ secret('BITCOIN_RPC_PASSWORD') }}"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT30S
          maxAttempts: 3

      - id: received_confirmed
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.rpc_url }}/wallet/{{ inputs.wallet }}"
        method: POST
        body: '{"jsonrpc": "1.0", "id": "kestra", "method": "getreceivedbyaddress", "params": ["{{ fromJson(item.value).address }}", {{ inputs.required_confirmations }}]}'
        options:
          auth:
            type: BASIC
            username: "{{ secret('BITCOIN_RPC_USER') }}"
            password: "{{ secret('BITCOIN_RPC_PASSWORD') }}"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT30S
          maxAttempts: 3

      - id: update_status
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Classify the invoice and claim the notification in one statement. The UPDATE locks the row, so when two runs check the same invoice at once only the first sees a change; the second finds the new status already claimed and stays quiet.
        url: "{{ secret('POSTGRES_URL') }}"
        username: "{{ secret('POSTGRES_USER') }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        fetchType: FETCH_ONE
        sql: |
          WITH amounts AS (
            SELECT {{ outputs.received_any.body | jq('.result') | first }}::numeric AS seen,
                   {{ outputs.received_confirmed.body | jq('.result') | first }}::numeric AS confirmed
          ), classified AS (
            SELECT i.id, a.seen, a.confirmed,
                   CASE
                     WHEN a.confirmed > i.amount_due_btc + {{ inputs.overpay_tolerance_btc }} THEN 'overpaid'
                     WHEN a.confirmed >= i.amount_due_btc THEN 'paid'
                     WHEN a.seen >= i.amount_due_btc THEN 'seen'
                     WHEN a.seen > 0 THEN 'underpaid'
                     WHEN i.expires_at < now() THEN 'expired'
                     ELSE 'awaiting_payment'
                   END AS status
            FROM invoices i, amounts a
            WHERE i.id = {{ fromJson(item.value).id }}
          )
          UPDATE invoices i SET
            received_btc = c.seen,
            confirmed_btc = c.confirmed,
            status = c.status,
            paid_at = CASE WHEN c.status IN ('paid', 'overpaid') THEN coalesce(i.paid_at, now()) END,
            previous_notified_status = coalesce(i.notified_status, 'awaiting_payment'),
            notified_status = c.status,
            updated_at = now()
          FROM classified c
          WHERE i.id = c.id
          RETURNING i.id, i.address, i.amount_due_btc, i.received_btc, i.confirmed_btc,
                    greatest(i.confirmed_btc - i.amount_due_btc, 0) AS refund_btc,
                    greatest(i.amount_due_btc - i.received_btc, 0) AS shortfall_btc,
                    i.previous_notified_status AS old_status, i.status AS new_status,
                    i.previous_notified_status <> i.status AS changed,
                    i.previous_notified_status IN ('paid', 'overpaid') AND i.status NOT IN ('paid', 'overpaid') AS reorged

      - id: status_changed
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.update_status.row.changed }}"
        then:
          - id: deliver
            type: io.kestra.plugin.core.flow.Sequential
            description: Tell your application first, then Slack. If a step still fails after its retries, the local errors handler releases the claim and reports the failed delivery; allowFailure keeps one unreachable endpoint from failing the whole run, and the next walletnotify call or sweep delivers the change again.
            allowFailure: true
            tasks:
              - id: app_callback
                type: io.kestra.plugin.core.flow.If
                condition: "{{ inputs.callback_url != '' }}"
                then:
                  - id: post_callback
                    type: io.kestra.plugin.core.http.Request
                    description: Tell your application about the status change so it can ship goods, credit a balance, or show the customer an update. The Idempotency-Key header lets it ignore a change it already processed.
                    uri: "{{ inputs.callback_url }}"
                    method: POST
                    headers:
                      Content-Type: application/json
                      Idempotency-Key: "invoice-{{ outputs.update_status.row.id }}-{{ outputs.update_status.row.old_status }}-{{ outputs.update_status.row.new_status }}"
                    body: |
                      {"invoice_id": {{ outputs.update_status.row.id }}, "address": "{{ outputs.update_status.row.address }}", "old_status": "{{ outputs.update_status.row.old_status }}", "status": "{{ outputs.update_status.row.new_status }}", "amount_due_btc": {{ outputs.update_status.row.amount_due_btc }}, "received_btc": {{ outputs.update_status.row.received_btc }}, "confirmed_btc": {{ outputs.update_status.row.confirmed_btc }}}
                    retry:
                      type: exponential
                      interval: PT2S
                      maxInterval: PT30S
                      maxAttempts: 3

              - id: reorg_check
                type: io.kestra.plugin.core.flow.If
                description: A paid invoice whose confirmed amount dropped below the amount due was hit by a reorg.
                condition: "{{ outputs.update_status.row.reorged }}"
                then:
                  - id: alert_reorg
                    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                    messageText: "REORG: invoice #{{ outputs.update_status.row.id }} was {{ outputs.update_status.row.old_status }} and is now {{ outputs.update_status.row.new_status }} ({{ outputs.update_status.row.confirmed_btc }} of {{ outputs.update_status.row.amount_due_btc }} BTC confirmed). Hold any goods or credit released for it. {{ inputs.explorer_address_url }}{{ outputs.update_status.row.address }}"
                    retry:
                      type: exponential
                      interval: PT2S
                      maxInterval: PT30S
                      maxAttempts: 3

              - id: notify_by_status
                type: io.kestra.plugin.core.flow.Switch
                value: "{{ outputs.update_status.row.new_status }}"
                cases:
                  paid:
                    - id: notify_paid
                      type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                      url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                      messageText: "Invoice #{{ outputs.update_status.row.id }} paid: {{ outputs.update_status.row.confirmed_btc }} BTC with {{ inputs.required_confirmations }}+ confirmations. {{ inputs.explorer_address_url }}{{ outputs.update_status.row.address }}"
                      retry:
                        type: exponential
                        interval: PT2S
                        maxInterval: PT30S
                        maxAttempts: 3
                  overpaid:
                    - id: notify_overpaid
                      type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                      url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                      messageText: "Invoice #{{ outputs.update_status.row.id }} overpaid: received {{ outputs.update_status.row.confirmed_btc }} BTC for {{ outputs.update_status.row.amount_due_btc }} due. Refund {{ outputs.update_status.row.refund_btc }} BTC. {{ inputs.explorer_address_url }}{{ outputs.update_status.row.address }}"
                      retry:
                        type: exponential
                        interval: PT2S
                        maxInterval: PT30S
                        maxAttempts: 3
                  underpaid:
                    - id: notify_underpaid
                      type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                      url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                      messageText: "Invoice #{{ outputs.update_status.row.id }} underpaid: {{ outputs.update_status.row.received_btc }} of {{ outputs.update_status.row.amount_due_btc }} BTC received. Ask the customer for the remaining {{ outputs.update_status.row.shortfall_btc }} BTC. {{ inputs.explorer_address_url }}{{ outputs.update_status.row.address }}"
                      retry:
                        type: exponential
                        interval: PT2S
                        maxInterval: PT30S
                        maxAttempts: 3
                defaults:
                  - id: log_transition
                    type: io.kestra.plugin.core.log.Log
                    message: "Invoice #{{ outputs.update_status.row.id }}: {{ outputs.update_status.row.old_status }} -> {{ outputs.update_status.row.new_status }} ({{ outputs.update_status.row.received_btc }} BTC seen, {{ outputs.update_status.row.confirmed_btc }} confirmed)."
            errors:
              - id: release_claim
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: Delivery failed, so put the last delivered status back. The next run sees the change again and re-sends it. The WHERE clause leaves the row alone if a newer change was claimed in the meantime.
                url: "{{ secret('POSTGRES_URL') }}"
                username: "{{ secret('POSTGRES_USER') }}"
                password: "{{ secret('POSTGRES_PASSWORD') }}"
                sql: |
                  UPDATE invoices SET notified_status = '{{ outputs.update_status.row.old_status }}'
                  WHERE id = {{ outputs.update_status.row.id }} AND notified_status = '{{ outputs.update_status.row.new_status }}'
              - id: alert_delivery_failed
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                messageText: >-
                  Could not deliver the change of invoice #{{ outputs.update_status.row.id }} from {{ outputs.update_status.row.old_status }} to {{ outputs.update_status.row.new_status }} after 3 attempts.
                  Check that {{ inputs.callback_url }} is reachable. The change stays pending and is sent again on the next walletnotify call or sweep.

  - id: summary
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Count invoices by status for the execution logs and outputs.
    url: "{{ secret('POSTGRES_URL') }}"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT status, count(*) AS invoices, sum(confirmed_btc) AS confirmed_btc
      FROM invoices GROUP BY status ORDER BY status

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: >-
      Bitcoin deposit check failed in execution {{ execution.id }} at `{{ errorLogs()[0]['taskId'] ?? 'unknown task' }}`:
      {{ (errorLogs()[0]['message'] ?? 'see the execution logs') | split(' \[\[') | first }}.
      Nothing is lost: invoices this run did not reach are checked again on the next walletnotify call or sweep.

outputs:
  - id: invoices_by_status
    type: JSON
    description: Invoice counts and confirmed BTC per status after this run.
    value: "{{ outputs.summary.rows ?? [] }}"

extend:
  title: Track Bitcoin Invoice Payments to Final Confirmation with walletnotify
  shortDescription: Bitcoin Core walletnotify triggers a check of every open invoice, which is classified as paid, overpaid, underpaid, or expired, with reorg alerts and app callbacks.
  metaTitle: Bitcoin Deposit Confirmation Tracker with Kestra
  metaDescription: Track Bitcoin invoice payments from mempool to final confirmation, flag under- and overpayments, catch reorgs, and notify your app and Slack.
  description: |
    Accepting Bitcoin means answering the same questions for every invoice: has the customer paid, did they pay the right amount, is it confirmed enough to ship, and did a reorg just undo a payment you already counted? This blueprint answers them automatically. Bitcoin Core's `walletnotify` hook calls a Kestra webhook whenever the wallet sees a transaction, and the flow re-checks every open invoice against the node, updates its status in Postgres, and tells your application and Slack about every change.

    The node recomputes received amounts from the current chain on every check, so the flow never trusts stale data: a reorg shows up as a lower confirmed amount and is reported as such.

    ## How it works

    1. `wallet_notify` (`Webhook`) starts a run whenever Bitcoin Core sees a wallet transaction. `confirmation_sweep` (`Schedule`) catches later confirmations and reorgs, which `walletnotify` does not report.
    2. `node_check` confirms the node is reachable, the credentials work, and the wallet is loaded, before any invoice is touched.
    3. `ensure_table` creates the `invoices` table on first run. Your application inserts one row per invoice with a fresh address from `getnewaddress`, the amount due, and an expiry.
    4. `load_open_invoices` reads invoices that can still change, paid invoices inside the reorg window, and any invoice with a change not yet delivered.
    5. `check_invoices` (`Loop`) asks the node what each address has received, with and without `required_confirmations`, using `getreceivedbyaddress`.
    6. `update_status` classifies the invoice and claims the notification in a single SQL statement, returning the last delivered status and the new one:
       - `overpaid`: confirmed amount above the amount due plus the tolerance
       - `paid`: confirmed amount covers the amount due
       - `seen`: full amount in the mempool or below the confirmation threshold
       - `underpaid`: something received, but less than the amount due
       - `expired`: nothing received before `expires_at`
    7. When the status changed, `deliver` (`Sequential`) calls your application first (`post_callback`, with an `Idempotency-Key` header), then alerts Slack on reorgs (`reorg_check`) and posts paid, overpaid (with the refund amount), and underpaid (with the shortfall) messages (`notify_by_status`, a `Switch`).
    8. `summary` counts invoices by status for the logs and the `invoices_by_status` output.

    ## Error handling

    Payment notifications must arrive exactly when something changed, never twice, and never get lost. The flow is built around that:

    - **No duplicates under bursts.** One transaction can fire `walletnotify` several times, and runs can overlap. `update_status` records the delivered status in the same `UPDATE` that classifies the invoice. Postgres row locking then guarantees that only one run sees a given change; tested with ten simultaneous webhook calls.
    - **No lost notifications.** HTTP and Slack calls retry with exponential backoff. If delivery still fails, the local `errors` handler of `deliver` (`release_claim`) puts the previous status back. The next `walletnotify` call or sweep sends the change again, and `alert_delivery_failed` tells Slack which invoice is pending and which endpoint to check. Your application should use the `Idempotency-Key` header to ignore a change it already processed.
    - **One bad endpoint does not stop the rest.** `deliver` has `allowFailure: true`, so the other invoices in the run are still checked and notified.
    - **Fail fast on infrastructure problems.** `node_check` stops the run before touching invoices when the node is down or misconfigured. The flow-level `errors` alert names the failing task and the cause, for example ``failed at `node_check`: Connect to http://127.0.0.1:18443 failed: Connection refused``.
    - **The chain is the source of truth.** Amounts are recomputed by the node on every check, so a reorg lowers the confirmed amount and is reported as `REORG: invoice #2 was paid and is now seen`.

    ## What this blueprint teaches about Kestra

    - Pairing an event trigger (`Webhook`) with a `Schedule` sweep: events give speed, the sweep catches what the event source never reports.
    - Local error handling: `errors` on a flowable task (`Sequential`) runs compensation for just that block, while `allowFailure` keeps the run going.
    - `Loop` iterations run as sub-executions of the same flow. In testing, the flow-level `concurrency` limit did not keep overlapping runs apart once iterations were involved. The flow keeps the limit to smooth bursts, but relies on the database claim, not on Kestra, for correctness.
    - `errorLogs()` in an `errors` block to send actionable alerts.

    ## Prerequisites

    - A Bitcoin Core node (v24 or newer) with RPC enabled and a wallet that generates the invoice addresses. Start on signet or testnet4.
    - `walletnotify` configured to call the webhook, for example in `bitcoin.conf`:
      `walletnotify=curl -s -X POST https://kestra.example.com/api/v1/main/executions/webhook/company.team/bitcoin-deposit-confirmation-tracker/btc-deposits-change-me?txid=%s`
      Change the webhook `key` before exposing it.
    - A Postgres database for the invoices.
    - A Slack incoming webhook, and optionally an HTTP endpoint in your application for status callbacks.

    ### Secrets

    - `BITCOIN_RPC_USER`, `BITCOIN_RPC_PASSWORD`: Bitcoin Core RPC credentials.
    - `POSTGRES_URL`, `POSTGRES_USER`, `POSTGRES_PASSWORD`: JDBC URL (for example `jdbc:postgresql://db:5432/shop`) and credentials.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL.

    ### Inputs

    - `rpc_url`, `wallet` (STRING): node endpoint and invoice wallet.
    - `required_confirmations` (INT, default 3): confirmations before an invoice counts as paid.
    - `overpay_tolerance_btc` (FLOAT, default 0.00001): how far above the amount due a payment can be before it is flagged as overpaid.
    - `reorg_window_hours` (INT, default 24): how long paid invoices stay under watch.
    - `max_invoices` (INT, default 200): invoices checked per run.
    - `callback_url` (STRING, optional): your application's endpoint for status changes.
    - `explorer_address_url` (STRING): explorer prefix for links.

    ### Outputs

    - `invoices_by_status` (JSON): invoice count and confirmed BTC per status after the run.

    ### Callback payload

    `{"invoice_id": 2, "address": "tb1q...", "old_status": "seen", "status": "paid", "amount_due_btc": 0.02, "received_btc": 0.02, "confirmed_btc": 0.02}`

    ## Quick start

    1. Add the secrets (in the open-source edition, as base64-encoded `SECRET_*` environment variables) and change the webhook key.
    2. Run the flow once to create the `invoices` table.
    3. Create an invoice: `INSERT INTO invoices (address, amount_due_btc) VALUES ('<getnewaddress output>', 0.001);`
    4. Pay it from a signet wallet and watch the invoice move from `seen` to `paid` as it confirms.
    5. Add `walletnotify` to `bitcoin.conf` and enable `confirmation_sweep`.

    ## How to extend

    - Pair it with the `bitcoin-fee-aware-payout-batching` blueprint to refund overpayments automatically: insert a payout row for the refund amount when an invoice becomes `overpaid`.
    - Give large invoices more confirmations by storing a per-invoice threshold and comparing against it in `update_status`.
    - Expire `seen` invoices that never confirm by adding a rule for transactions dropped from the mempool.

    ## Links

    - [Bitcoin Core walletnotify](https://github.com/bitcoin/bitcoin/blob/master/doc/bitcoin-conf.md)
    - [getreceivedbyaddress RPC](https://developer.bitcoin.org/reference/rpc/getreceivedbyaddress.html)
    - [Kestra Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook)
    - [PostgreSQL plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
    - [Slack plugin](https://kestra.io/plugins/plugin-slack)
    - This blueprint has been created by [ram0verflow](https://github.com/ram0verflow)
  tags:
    - Business
    - Data
  subTags:
    - Realtime Events
    - Monitoring & Alerting
  ee: false
  demo: false
