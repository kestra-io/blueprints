id: kube-vip-virtual-ip-advertisement-and-arp-failure-sentinel
namespace: company.sre

description: |
  Audits kube-vip control plane and load balancer telemetry to detect virtual IP election instability, gratuitous ARP broadcast failures, and state flapping.

concurrency:
  limit: 1

inputs:
  - id: kube_vip_metrics_url
    type: STRING
    displayName: "kube-vip Metrics URL"
    defaults: "http://kube-vip.kube-system.svc.cluster.local:2112"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the kube-vip daemonset or static control plane pods."

  - id: virtual_ip_address
    type: STRING
    displayName: "Virtual IP Address"
    defaults: "192.168.1.200"
    description: "Configured virtual IP address or Kubernetes API service VIP monitored for advertisement and ARP binding status."

  - id: max_arp_failure_threshold
    type: INT
    displayName: "Max ARP Failure Threshold"
    defaults: 2
    description: "Maximum allowable gratuitous ARP broadcast failures or raw socket transmission drops before triggering an incident."

  - id: max_transitions_threshold
    type: INT
    displayName: "Max Leader Transitions Threshold"
    defaults: 3
    description: "Maximum allowable VRRP or Raft leader election transitions within the evaluation window before alerting on split-brain risk."

  - id: alert_on_election_loss
    type: BOOL
    displayName: "Alert on Election Loss"
    defaults: true
    description: "Toggle whether zero active virtual IP leaders or election loss across nodes triggers an immediate high-urgency alert."

tasks:
  - id: scan_kube_vip_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes kube-vip Prometheus metrics to audit virtual IP leader election status, gratuitous ARP announcements, and VRRP state flapping.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.kube_vip_metrics_url }}"
      VIP_ADDR: "{{ inputs.virtual_ip_address }}"
      MAX_ARP_FAILURES: "{{ inputs.max_arp_failure_threshold }}"
      MAX_TRANSITIONS: "{{ inputs.max_transitions_threshold }}"
      ALERT_ELECTION_LOSS: "{{ inputs.alert_on_election_loss }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      vip_addr = os.environ.get("VIP_ADDR", "192.168.1.200")
      max_arp_failures = int(os.environ.get("MAX_ARP_FAILURES", "2"))
      max_transitions = int(os.environ.get("MAX_TRANSITIONS", "3"))
      alert_election_loss = os.environ.get("ALERT_ELECTION_LOSS", "true").lower() == "true"

      metrics_endpoint = f"{base_url}/metrics"
      print(f"Scraping kube-vip metrics from {metrics_endpoint}...")
      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          resp.raise_for_status()
      except Exception as err:
          print(f"ERROR: Failed to scrape kube-vip metrics from {metrics_endpoint}: {err}", file=sys.stderr)
          sys.exit(1)

      leader_status = 1
      arp_failures_total = 0
      transitions_total = 0
      packets_egress_total = 0
      degraded_nodes = []

      for line in resp.text.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          match = re.search(r'([0-9.]+)\s*$', line)
          if not match:
              continue
          val = float(match.group(1))
          if "kube_vip_election_status" in line:
              leader_status = int(val)
              if leader_status == 0:
                  degraded_nodes.append("vip-leader-absent")
          elif "kube_vip_arp_request_failures_total" in line:
              arp_failures_total += int(val)
          elif "kube_vip_virtual_router_transitions_total" in line:
              transitions_total += int(val)
          elif "kube_vip_packets_egress_total" in line:
              packets_egress_total += int(val)

      is_alerting = bool(
          (arp_failures_total > max_arp_failures) or
          (transitions_total > max_transitions) or
          (alert_election_loss and leader_status == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      print(f"kube-vip VIP {vip_addr}: leader={leader_status}, arp_failures={arp_failures_total}, transitions={transitions_total}, egress={packets_egress_total}, is_alerting={is_alerting}")

      Kestra.outputs({
          "leader_status": leader_status,
          "arp_failures_total": arp_failures_total,
          "transitions_total": transitions_total,
          "packets_egress_total": packets_egress_total,
          "is_alerting": is_alerting,
          "virtual_ip": vip_addr,
          "audit_timestamp": now_iso
      })

  - id: evaluate_kube_vip_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether virtual IP leader election status, gratuitous ARP broadcasting, or state transitions breach limits.
    condition: "{{ outputs.scan_kube_vip_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_sre_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Slack channel detailing kube-vip failure.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#kubernetes-sre-alerts",
            "text": "CRITICAL: kube-vip Control Plane VIP Health Degradation for `{{ inputs.virtual_ip_address }}`. Leader Status: `{{ outputs.scan_kube_vip_telemetry.vars.leader_status }}` (1=active, 0=absent). Gratuitous ARP Failures: `{{ outputs.scan_kube_vip_telemetry.vars.arp_failures_total }}` (max allowable: `{{ inputs.max_arp_failure_threshold }}`). Leader Transitions: `{{ outputs.scan_kube_vip_telemetry.vars.transitions_total }}` (threshold: `{{ inputs.max_transitions_threshold }}`). Audit Timestamp: `{{ outputs.scan_kube_vip_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_kube_vip_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when kube-vip maintains stable leader election and advertises virtual IP cleanly.
        message: "kube-vip operating nominally for {{ inputs.virtual_ip_address }}: leader active, {{ outputs.scan_kube_vip_telemetry.vars.arp_failures_total }} ARP failures, {{ outputs.scan_kube_vip_telemetry.vars.transitions_total }} transitions."

triggers:
  - id: periodic_kube_vip_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: leader_status
    type: INT
    description: Active leader election status (1=elected, 0=absent).
    value: "{{ outputs.scan_kube_vip_telemetry.vars.leader_status }}"
  - id: arp_failures_total
    type: INT
    description: Count of gratuitous ARP broadcast failures.
    value: "{{ outputs.scan_kube_vip_telemetry.vars.arp_failures_total }}"
  - id: transitions_total
    type: INT
    description: Total VRRP/Raft leader state transitions.
    value: "{{ outputs.scan_kube_vip_telemetry.vars.transitions_total }}"
  - id: is_alerting
    type: BOOLEAN
    description: True if election was lost or failure thresholds breached.
    value: "{{ outputs.scan_kube_vip_telemetry.vars.is_alerting }}"

extend:
  title: "kube-vip Virtual IP Advertisement and ARP Failure Sentinel"
  metaTitle: "kube-vip Virtual IP Health Sentinel Blueprint"
  shortDescription: "Audits kube-vip control plane telemetry to detect virtual IP election instability, gratuitous ARP failures, and state flapping."
  metaDescription: "Audits kube-vip metrics to detect virtual IP election instability, gratuitous ARP broadcast failures, and state flapping."
  description: |
    Automates continuous health and virtual IP advertisement surveillance for kube-vip control plane load balancers and Kubernetes API VIPs.

    ## How it works
    1. A schedule trigger executes the kube-vip health audit workflow every 15 minutes.
    2. The Python task queries the kube-vip Prometheus metrics endpoint on port 2112.
    3. The script extracts virtual IP leader election status, gratuitous ARP announcement failure counters, and VRRP state transitions.
    4. An evaluation gate determines whether election loss, ARP broadcast failures, or state transitions breach limits.
    5. When virtual IP failure is detected, a high-priority Slack alert is dispatched to Kubernetes SRE teams.

    ## Prerequisites
    - kube-vip daemonset or static pod exposing Prometheus metrics.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK_URL` secret.
    3. Configure `kube_vip_metrics_url` and `virtual_ip_address`.
    4. Enable the schedule trigger for continuous VIP surveillance.

    ## Links
    - [kube-vip Documentation](https://kube-vip.io/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
