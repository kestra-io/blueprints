id: multi-city-weather-digest-discord
namespace: company.team

inputs:
  - id: cities
    type: ARRAY
    itemType: STRING
    description: City names to report on. Each name is resolved to coordinates with the Open-Meteo geocoding API.
    defaults:
      - Delhi
      - Mumbai
      - Bengaluru
      - Kolkata

  - id: heat_alert_celsius
    type: FLOAT
    description: Flag a city when the current temperature is at or above this value in degrees Celsius.
    defaults: 38

  - id: rain_alert_mm
    type: FLOAT
    description: Flag a city when the current precipitation is at or above this value in millimetres.
    defaults: 1

triggers:
  - id: every_morning
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run the digest every day at 08:00.
    cron: "0 8 * * *"

tasks:
  - id: loop_cities
    type: io.kestra.plugin.core.flow.Loop
    description: Process one city per iteration and collect one formatted line per city.
    values: "{{ inputs.cities }}"
    concurrencyLimit: 1
    fetchType: FETCH
    outputs:
      - id: line
        type: STRING
        value: "{{ outputs.format_line.value }}"
    tasks:
      - id: geocode
        type: io.kestra.plugin.core.http.Request
        description: Look up the latitude and longitude of the current city (no API key needed).
        uri: "https://geocoding-api.open-meteo.com/v1/search?name={{ item.value }}&count=1&language=en&format=json"
        retry:
          type: constant
          interval: PT5S
          maxAttempts: 3

      - id: forecast
        type: io.kestra.plugin.core.http.Request
        description: Read the current temperature and precipitation for the coordinates found by geocode.
        uri: "https://api.open-meteo.com/v1/forecast?latitude={{ fromJson(outputs.geocode.body).results[0].latitude }}&longitude={{ fromJson(outputs.geocode.body).results[0].longitude }}&current=temperature_2m,precipitation"
        retry:
          type: constant
          interval: PT5S
          maxAttempts: 3

      - id: format_line
        type: io.kestra.plugin.core.debug.Return
        description: Build one line per city and add a warning marker when a heat or rain threshold is reached.
        format: "{{ (fromJson(outputs.forecast.body).current.temperature_2m >= inputs.heat_alert_celsius or fromJson(outputs.forecast.body).current.precipitation >= inputs.rain_alert_mm) ? '⚠️' : '✅' }} {{ item.value }}: {{ fromJson(outputs.forecast.body).current.temperature_2m }}°C, rain {{ fromJson(outputs.forecast.body).current.precipitation }} mm"

  - id: send_to_discord
    type: io.kestra.plugin.notifications.discord.DiscordIncomingWebhook
    description: Join all city lines and post one combined message to the Discord channel behind the webhook.
    url: "{{ secret('DISCORD_WEBHOOK') }}"
    payload: |
      {{ {"content": "Daily weather digest: " ~ (loopOutputs(outputs.loop_cities.outputs, 'line') | join(" | "))} | toJson }}

extend:
  title: Daily Multi-City Weather Digest to Discord with Heat and Rain Alerts
  metaTitle: Multi-City Weather Digest to Discord with Heat and Rain Alerts | Kestra
  shortDescription: Loop over a list of cities, read live weather from Open-Meteo, flag heat and rain thresholds, and post one combined digest to Discord every morning.
  metaDescription: Fetch live weather for many cities with Open-Meteo, flag heat and rain alerts inside a Loop, and post a daily digest to Discord through a webhook.
  description: |
    This flow resolves each city to coordinates, reads the current temperature and precipitation from the free Open-Meteo APIs, marks the cities that cross your thresholds, and posts one combined digest to a Discord channel.

    ## How it works

    1. A Schedule trigger starts the flow every day at 08:00.
    2. A Loop task iterates over the cities input, one city at a time.
    3. For each city, geocode calls the Open-Meteo geocoding API and forecast reads the current temperature and precipitation. Both HTTP calls retry up to three times.
    4. format_line builds one line per city and adds a warning marker when the temperature or the rainfall reaches the thresholds.
    5. After the loop, send_to_discord joins every line and posts a single message through a Discord incoming webhook.

    ## What you get

    - One readable Discord message per day that covers all your cities.
    - Heat and rain thresholds that you can change at execution time without editing the flow.
    - Automatic retries on the HTTP calls, so a short API hiccup does not break the digest.
    - No API key for weather data.

    ## Who it's for

    - Platform and operations teams that want a simple daily conditions check for sites or offices.
    - Developers who are learning Loop, inputs, retries and secrets in Kestra 2.0.

    ## Why orchestrate this with Kestra

    Kestra gives you the schedule, retries, per-city isolation inside the Loop and masked secrets in one declarative file, instead of a cron job with a hand-written script.

    ## Prerequisites

    - A Discord server where you can create a webhook.
    - Outbound HTTPS access to api.open-meteo.com and geocoding-api.open-meteo.com.

    ### Secrets

    - `DISCORD_WEBHOOK`: the full Discord webhook URL used by send_to_discord. Never commit the real value.

    ## Quick start

    1. Create a webhook in your Discord channel and store its URL as the DISCORD_WEBHOOK secret. In the open-source edition, secrets are environment variables prefixed with SECRET_ and base64-encoded.
    2. Import this blueprint and click **Execute** with the default inputs.
    3. Check the Logs tab and your Discord channel, then keep the trigger enabled for the daily run.

    ## How to extend

    - Add more cities in the cities input, or change heat_alert_celsius and rain_alert_mm.
    - Swap the Discord task for a Slack or email notification.
    - Add wind speed or air quality to the Open-Meteo query and to the formatted line.

    ## Links

    - [Open-Meteo forecast API](https://open-meteo.com/en/docs)
    - [Open-Meteo geocoding API](https://open-meteo.com/en/docs/geocoding-api)
    - [Kestra plugins catalog](https://kestra.io/plugins)
    - [Kestra Loop task](https://kestra.io/docs/migration-guide/v2.0.0/foreach-loop)
  tags:
    - Core
  subTags:
    - Flow Control & Conditions
  ee: false
  demo: false
