id: popeye-kubernetes-cluster-hygiene-and-sanitizer-gate
namespace: company.infrastructure

inputs:
  - id: kubeconfig
    type: STRING
    displayName: Kubeconfig (Raw or Base64)
    description: Base64-encoded or raw YAML kubeconfig for the target cluster. If omitted, uses the KUBECONFIG_BASE64 secret or in-cluster service account.
    required: false
    defaults: ""

  - id: namespace
    type: STRING
    displayName: Target Namespace
    description: Scope sanitization to a specific Kubernetes namespace. Leave empty to audit the entire cluster.
    required: false
    defaults: ""

  - id: minScoreThreshold
    type: INT
    displayName: Minimum Hygiene Score Threshold
    description: Minimum acceptable Popeye cluster health score (0-100) before raising a hygiene warning.
    required: false
    defaults: 80

  - id: maxAllowedErrors
    type: INT
    displayName: Maximum Allowed Critical Errors
    description: Maximum tolerable Popeye critical (Level 3) errors before triggering a blocking gate failure.
    required: false
    defaults: 0

tasks:
  - id: popeye_scan
    type: io.kestra.plugin.scripts.shell.Commands
    description: Run Popeye Kubernetes cluster sanitizer container to scan cluster resources and save full JSON report.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: quay.io/derailed/popeye:v0.22.1
    env:
      KUBECONFIG_DATA: "{{ inputs.kubeconfig != '' ? inputs.kubeconfig : secret('KUBECONFIG_BASE64') }}"
      TARGET_NAMESPACE: "{{ inputs.namespace }}"
    commands:
      - |
        set -euo pipefail
        mkdir -p ~/.kube
        if [ -n "${KUBECONFIG_DATA:-}" ]; then
          if echo "$KUBECONFIG_DATA" | grep -q "apiVersion:"; then
            echo "$KUBECONFIG_DATA" > ~/.kube/config
          else
            echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config 2>/dev/null || echo "$KUBECONFIG_DATA" > ~/.kube/config
          fi
          chmod 600 ~/.kube/config
        fi

        NS_FLAG=""
        if [ -n "${TARGET_NAMESPACE:-}" ]; then
          NS_FLAG="-n ${TARGET_NAMESPACE}"
        fi

        echo "Executing Popeye cluster sanitizer..."
        export POPEYE_REPORT_DIR="$(pwd)"
        popeye ${NS_FLAG} --out json --save --output-file popeye-report.json || true

        if [ ! -f popeye-report.json ]; then
          echo '{"popeye":{"score":0,"grade":"F","sanitizers":[]}}' > popeye-report.json
        fi
        cp popeye-report.json "{{ outputDir }}/popeye-report.json"
    outputFiles:
      - popeye-report.json
  - id: triage_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    description: Parse Popeye JSON report, compute multi-dimensional health metrics, and classify cluster status.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-alpine
    commands:
      - |
        python3 - << 'PYEOF'
        import json
        import os

        report_file = "{{ outputs.popeye_scan.outputFiles['popeye-report.json'] }}"
        with open(report_file, 'r', encoding='utf-8') as f:
            data = json.load(f)

        popeye = data.get("popeye", {})
        score = popeye.get("score", 0)
        grade = popeye.get("grade", "F")

        errors = 0
        warnings = 0
        infos = 0
        top_errors = []

        sanitizers = popeye.get("sanitizers", [])
        for s in sanitizers:
            issues = s.get("issues", {})
            for resource_name, issue_list in issues.items():
                for issue in issue_list:
                    lvl = issue.get("level", 0)
                    msg = issue.get("message", "")
                    if lvl == 3:
                        errors += 1
                        if len(top_errors) < 5:
                            top_errors.append(f"{resource_name}: {msg}")
                    elif lvl == 2:
                        warnings += 1
                    elif lvl == 1:
                        infos += 1

        min_score = int("{{ inputs.minScoreThreshold }}")
        max_errors = int("{{ inputs.maxAllowedErrors }}")

        if errors > max_errors or score < 60:
            status = "CRITICAL_CLUSTER_VIOLATION"
        elif score < min_score:
            status = "WARNING_HYGIENE_DEGRADATION"
        else:
            status = "COMPLIANT_HEALTHY"

        kestra_env = os.environ.get("KESTRA_ENV")
        if kestra_env:
            with open(kestra_env, "a", encoding="utf-8") as env_file:
                env_file.write(f"score={score}\n")
                env_file.write(f"grade={grade}\n")
                env_file.write(f"errors={errors}\n")
                env_file.write(f"warnings={warnings}\n")
                env_file.write(f"infos={infos}\n")
                env_file.write(f"status={status}\n")
                env_file.write(f"top_errors={'; '.join(top_errors) if top_errors else 'None'}\n")

        print(f"Popeye Sanitizer Results: Score={score}/100, Grade={grade}, Errors={errors}, Warnings={warnings}, Infos={infos}, Status={status}")
        PYEOF
  - id: route_hygiene_status
    type: io.kestra.plugin.core.flow.Switch
    description: Route execution based on Popeye health grade and critical error triage.
    value: "{{ outputs.triage_metrics.vars.status }}"
    cases:
      COMPLIANT_HEALTHY:
        - id: log_compliant
          type: io.kestra.plugin.core.log.Log
          message: "Kubernetes cluster hygiene verified COMPLIANT. Score: {{ outputs.triage_metrics.vars.score }}/100 (Grade {{ outputs.triage_metrics.vars.grade }}), Critical Errors: {{ outputs.triage_metrics.vars.errors }}, Warnings: {{ outputs.triage_metrics.vars.warnings }}."

      WARNING_HYGIENE_DEGRADATION:
        - id: notify_hygiene_warning
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#platform-alerts",
              "text": ":warning: *Kubernetes Cluster Hygiene Warning*: Health score degraded to `{{ outputs.triage_metrics.vars.score }}/100` (Grade `{{ outputs.triage_metrics.vars.grade }}`). Warnings: `{{ outputs.triage_metrics.vars.warnings }}`, Info Notices: `{{ outputs.triage_metrics.vars.infos }}`. Review resource allocations and orphaned configs."
            }

        - id: log_warning
          type: io.kestra.plugin.core.log.Log
          message: "Cluster hygiene degraded below minimum threshold ({{ inputs.minScoreThreshold }}). Score: {{ outputs.triage_metrics.vars.score }}/100, Warnings: {{ outputs.triage_metrics.vars.warnings }}."

      CRITICAL_CLUSTER_VIOLATION:
        - id: notify_critical_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#platform-oncall",
              "text": ":rotating_light: *CRITICAL: Kubernetes Cluster Health Gate Tripped!*\n*Cluster Score*: `{{ outputs.triage_metrics.vars.score }}/100` (Grade `{{ outputs.triage_metrics.vars.grade }}`)\n*Critical Errors*: `{{ outputs.triage_metrics.vars.errors }}`\n*Offending Resources*: `{{ outputs.triage_metrics.vars.top_errors }}`\nImmediate remediation required to prevent service outages."
            }

        - id: fail_execution
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "Kubernetes cluster failed Popeye hygiene audit. Score {{ outputs.triage_metrics.vars.score }}/100, {{ outputs.triage_metrics.vars.errors }} critical error(s) detected."

triggers:
  - id: daily_cluster_hygiene_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1-5"
extend:
  title: Kubernetes Cluster Hygiene, Resource Quota & Sanitizer Gate with Popeye
  metaTitle: Kubernetes Cluster Hygiene & Sanitizer Gate with Popeye | Kestra
  shortDescription: Audit Kubernetes cluster resource hygiene, capacity waste, and misconfigurations using Derailed Popeye with automated triage and alerting.
  metaDescription: Audit Kubernetes cluster resource hygiene, capacity waste, and security misconfigurations with Derailed Popeye, triaging health grades with automated alerting.
  description: |
    Automate continuous Kubernetes cluster resource hygiene, capacity right-sizing, and misconfiguration auditing with [Popeye](https://popeyecli.io/). Over time, production Kubernetes clusters accumulate operational debt: containers provisioned without CPU/memory limits or with oversized requests that trigger unnecessary worker node scaling, unlinked services pointing to zero healthy endpoints, orphaned ConfigMaps and Secrets bloating etcd, and pods missing readiness or liveness probes.

    This blueprint runs a non-intrusive Popeye sanitizer scan across your live Kubernetes cluster or selected namespaces. It parses the resulting JSON diagnostic report, aggregates numeric health scores (0-100) and letter grades (A through F), counts severity levels (Critical Errors, Capacity Warnings, Hygiene Notices), and routes actions through a tri-state operational gate: logging compliant clusters, dispatching rightsizing warning digests to Slack for degraded clusters, and triggering on-call alerts while tripping deployment pipeline gates when critical operational defects are detected.

    ## How it works

    1. **Scheduled Audit Trigger**: Fires automatically on a recurring schedule (default: Monday through Friday at 06:00 UTC) before peak business hours, or triggers on-demand via manual execution or webhook from CI/CD deployment pipelines.
    2. **Cluster Sanitization Scan**: Launches the official `quay.io/derailed/popeye:v0.22.1` container using Kestra's Docker task runner. It authenticates via base64 kubeconfig secret or in-cluster service account credentials, scans cluster resources, and generates a structured JSON report saved as a Kestra artifact.
    3. **Multi-Dimensional Triage**: A lightweight Python task ingests `popeye-report.json`, counts Level 3 (Error), Level 2 (Warning), and Level 1 (Info) issues, evaluates the overall cluster grade, and isolates top failing resources. It classifies the cluster into one of three operational states: `COMPLIANT_HEALTHY`, `WARNING_HYGIENE_DEGRADATION`, or `CRITICAL_CLUSTER_VIOLATION`.
    4. **Flow Control & Routing**: A `Switch` task evaluates the classified status:
       - `COMPLIANT_HEALTHY`: Logs verified cluster health metrics and archives audit evidence.
       - `WARNING_HYGIENE_DEGRADATION`: Sends a Slack notification highlighting capacity leaks and orphaned resources for platform rightsizing, non-blocking.
       - `CRITICAL_CLUSTER_VIOLATION`: Dispatches an urgent alert to Slack `#platform-oncall` with offending resource identifiers and trips `Fail` to halt broken deployments.

    ## What you get

    - **Automated Cluster Sanitization**: Continuous visibility into orphaned secrets, dead pods, missing probes, and unlinked services without manual terminal runs.
    - **FinOps & Capacity Protection**: Early warning when workloads request excessive CPU/memory allocations that inflate cloud infrastructure bills.
    - **Tri-State Operational Gating**: Nuanced classification distinguishing non-blocking hygiene improvements from critical, production-halting service defects.
    - **Audit Artifact Storage**: The complete raw Popeye JSON report is retained in Kestra execution artifacts for retrospective auditing and compliance evidence.
    - **Instant Incident Notification**: Rich Slack alerts detailing exact failing resources and error messages so platform engineers can resolve issues immediately.

    ## Who it's for

    - **Kubernetes Platform Engineers**: Automating cluster hygiene scorecards and detecting configuration drift across multi-tenant clusters.
    - **Site Reliability Engineers (SREs)**: Enforcing production readiness standards (probes, limits, endpoint health) before incidents occur.
    - **FinOps & Cloud Operations Teams**: Identifying over-provisioned pods and orphaned resources driving up cloud node spend.

    ## Why orchestrate this with Kestra

    - **Declarative & Version-Controlled**: Manage cluster audit policies and notification thresholds in version-controlled YAML alongside your deployment infrastructure.
    - **Credential Isolation**: Securely inject kubeconfig credentials using Kestra's secret engine (`{{ secret('KUBECONFIG_BASE64') }}`) without exposing tokens in logs or scripts.
    - **Artifact Retention**: Automatically store, index, and download sanitizer audit reports from the Kestra UI without configuring external S3 storage backends.
    - **Unified Event-Driven Gating**: Chain this workflow directly into CI/CD promotion pipelines to prevent promoting applications into degraded clusters.

    ## Prerequisites

    - A running Kubernetes cluster (v1.22+) accessible via a kubeconfig or in-cluster service account.
    - Read-only RBAC permissions for cluster resources (Pods, Deployments, Services, ConfigMaps, Secrets, Nodes, Namespaces, Ingress).
    - An incoming Slack webhook URL for notification channels.

    ### Secrets

    - `KUBECONFIG_BASE64`: Base64-encoded kubeconfig file with read-only cluster access permissions (required if not passing via input).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL to deliver hygiene warnings and critical failure notifications (required).

    ## Quick start

    1. Generate a base64-encoded kubeconfig for a read-only service account: `base64 -w 0 ~/.kube/config`.
    2. Store the string in your Kestra namespace secrets as `KUBECONFIG_BASE64`.
    3. Configure your Slack webhook URL in namespace secrets as `SLACK_WEBHOOK_URL`.
    4. Import this blueprint into your Kestra instance and click **Execute** with default inputs.
    5. Check the **Execution Artifacts** tab in Kestra to review the generated `popeye-report.json`, then enable the scheduled trigger.

    ## How to extend

    - **Export to Metrics / Dashboard**: Send score and warning counts to Prometheus, Datadog, or Grafana using Kestra's push gateway tasks for trend visualization over time.
    - **Automated Ticket Creation**: Integrate `io.kestra.plugin.jira.issues.Create` to automatically open right-sizing Jira tickets assigned to the offending application team.
    - **Multi-Cluster Matrix**: Wrap the flow in a `ForEach` loop across a list of Kubernetes cluster credentials to sanitize dev, staging, and production clusters sequentially.

    ## Links

    - [Popeye Official Documentation](https://popeyecli.io/)
    - [Derailed Popeye GitHub Repository](https://github.com/derailed/popeye)
    - [Kestra Shell Plugin Documentation](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Approval Gates
  ee: false
  demo: false
