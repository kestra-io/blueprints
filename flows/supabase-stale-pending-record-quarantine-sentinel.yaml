id: supabase-stale-pending-record-quarantine-sentinel
namespace: company.team

description: |
  Audit Supabase tables for stale pending records, unconsumed webhook deliveries, or abandoned
  transactions lingering beyond an operational TTL. Evaluates backlog volume against SLA thresholds,
  dispatches structured Slack notifications, and safely transitions stale rows to a quarantined status.

inputs:
  - id: supabase_url
    type: STRING
    displayName: Supabase Project REST URL
    description: Base URL of the Supabase PostgREST API gateway, for example http://localhost:8000 for local development or https://<project-ref>.supabase.co for Supabase Cloud.
    defaults: "http://localhost:8000"

  - id: table_name
    type: STRING
    displayName: Target Table Name
    description: Name of the Supabase table to audit for stale pending records or unhandled webhook events.
    defaults: "webhook_events"

  - id: stale_threshold_hours
    type: INT
    displayName: Stale Threshold (Hours)
    description: Age threshold in hours beyond which records remaining in pending status are classified as stale.
    defaults: 24

  - id: critical_count_threshold
    type: INT
    displayName: Critical Accumulation Threshold
    description: Stale record count at or above which the sentinel escalates the classification from warning to critical backlog accumulation.
    defaults: 50

  - id: batch_size
    type: INT
    displayName: Evaluation Batch Limit
    description: Maximum number of candidate records to inspect in a single sentinel evaluation cycle.
    defaults: 100

  - id: auto_quarantine
    type: BOOL
    displayName: Automatic Quarantine Remediation
    description: When true and dry_run is false, patches stale pending records to status quarantined to unblock consumer queues.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, evaluates and logs stale records without applying database update mutations.
    defaults: true

  - id: alert_mode
    type: SELECT
    displayName: Sentinel Alert Mode
    description: Operating mode of the sentinel. ALERT dispatches a notification to Slack when thresholds breach; AUDIT_ONLY logs findings without paging on-call.
    values:
      - "ALERT"
      - "AUDIT_ONLY"
    defaults: "ALERT"

triggers:
  - id: periodic_stale_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs every 6 hours to audit Supabase tables for accumulating stale pending records. Shipped disabled by default for safe initial setup.
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      supabase_url: "http://localhost:8000"
      table_name: "webhook_events"
      stale_threshold_hours: 24
      critical_count_threshold: 50
      batch_size: 100
      auto_quarantine: false
      dry_run: true
      alert_mode: "ALERT"

tasks:
  - id: compute_stale_cutoff_timestamp
    type: io.kestra.plugin.core.debug.Return
    description: Compute the ISO-8601 timestamp cutoff based on current execution time and stale_threshold_hours.
    format: >-
      {{ (now() | dateAdd(-inputs.stale_threshold_hours, 'HOURS')) | date("yyyy-MM-dd'T'HH:mm:ssXXX") }}

  - id: probe_stale_pending_records
    type: io.kestra.plugin.supabase.Select
    description: Query the target Supabase table using PostgREST syntax for records with status pending created before the cutoff timestamp.
    url: "{{ inputs.supabase_url }}"
    apiKey: "{{ secret('SUPABASE_SERVICE_ROLE_KEY') }}"
    table: "{{ inputs.table_name }}"
    select: "id,status,created_at"
    filter: "status=eq.pending&created_at=lt.{{ outputs.compute_stale_cutoff_timestamp.value }}"
    order: "created_at.asc"
    limit: "{{ inputs.batch_size }}"

  - id: classify_stale_accumulation
    type: io.kestra.plugin.core.debug.Return
    description: Evaluate the count of matching records and classify backlog severity into HEALTHY, WARNING_STALE_DETECTED, or CRITICAL_ACCUMULATION.
    format: "{{ (outputs.probe_stale_pending_records.size | default(0)) == 0 ? 'HEALTHY' : ((outputs.probe_stale_pending_records.size | default(0)) >= inputs.critical_count_threshold ? 'CRITICAL_ACCUMULATION' : 'WARNING_STALE_DETECTED') }}" 

  - id: route_sentinel_classification
    type: io.kestra.plugin.core.flow.Switch
    description: Branch execution based on stale record backlog classification to notify on-call or execute safe quarantine updates.
    value: "{{ outputs.classify_stale_accumulation.value | trim }}"
    cases:
      CRITICAL_ACCUMULATION:
        - id: handle_critical_alert
          type: io.kestra.plugin.core.flow.If
          description: Verify alert_mode setting before dispatching critical backlog notification.
          condition: "{{ inputs.alert_mode == 'ALERT' }}"
          then:
            - id: send_critical_slack_alert
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              description: Dispatch critical stale record accumulation notification to Slack.
              url: "{{ secret('SLACK_WEBHOOK') }}"
              payload: |
                {
                  "text": "CRITICAL: Supabase Stale Pending Record Accumulation Breach",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "Supabase Critical Stale Records Breach"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Status:*\nCritical Accumulation"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Table:*\n`{{ inputs.table_name }}`"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Stale Records Count:*\n{{ outputs.probe_stale_pending_records.size }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Threshold Limit:*\n{{ inputs.critical_count_threshold }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Cutoff Timestamp:*\n`{{ outputs.compute_stale_cutoff_timestamp.value }}`"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Auto-Quarantine:*\n`{{ inputs.auto_quarantine and not inputs.dry_run }}`"
                        }
                      ]
                    },
                    {
                      "type": "context",
                      "elements": [
                        {
                          "type": "mrkdwn",
                          "text": "Execution ID: `{{ execution.id }}` | Namespace: `{{ flow.namespace }}`"
                        }
                      ]
                    }
                  ]
                }
          else:
            - id: log_critical_audit_only
              type: io.kestra.plugin.core.log.Log
              description: Record critical accumulation finding in audit log without paging on-call.
              message: "AUDIT ONLY: Critical stale record accumulation detected on Supabase table {{ inputs.table_name }}. Found {{ outputs.probe_stale_pending_records.size }} stale records older than {{ inputs.stale_threshold_hours }} hours."

        - id: evaluate_remediation_gate
          type: io.kestra.plugin.core.flow.If
          description: Verify that auto_quarantine is true and dry_run is false before applying database updates.
          condition: "{{ inputs.auto_quarantine and not inputs.dry_run }}"
          then:
            - id: quarantine_stale_records
              type: io.kestra.plugin.supabase.Update
              description: Update status of stale pending records to quarantined to prevent consumer retry storms.
              url: "{{ inputs.supabase_url }}"
              apiKey: "{{ secret('SUPABASE_SERVICE_ROLE_KEY') }}"
              table: "{{ inputs.table_name }}"
              data:
                status: "quarantined"
              filter: "status=eq.pending&created_at=lt.{{ outputs.compute_stale_cutoff_timestamp.value }}"
              select: "id,status"

            - id: log_quarantine_remediation
              type: io.kestra.plugin.core.log.Log
              description: Record count of successfully quarantined stale records.
              message: "REMEDIATION: Successfully transitioned {{ outputs.quarantine_stale_records.updatedCount }} records on table {{ inputs.table_name }} to status 'quarantined'."
          else:
            - id: log_remediation_skipped
              type: io.kestra.plugin.core.log.Log
              description: Log that remediation mutation was skipped due to dry_run or auto_quarantine configuration.
              message: "Remediation skipped for {{ outputs.probe_stale_pending_records.size }} stale records on table {{ inputs.table_name }}. auto_quarantine={{ inputs.auto_quarantine }}, dry_run={{ inputs.dry_run }}."

      WARNING_STALE_DETECTED:
        - id: handle_warning_alert
          type: io.kestra.plugin.core.flow.If
          description: Verify alert_mode setting before dispatching warning notification.
          condition: "{{ inputs.alert_mode == 'ALERT' }}"
          then:
            - id: send_warning_slack_alert
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              description: Dispatch warning stale record notification to Slack.
              url: "{{ secret('SLACK_WEBHOOK') }}"
              payload: |
                {
                  "text": "WARNING: Supabase Stale Pending Records Detected",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "Supabase Stale Pending Records Warning"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Status:*\nStale Records Detected"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Table:*\n`{{ inputs.table_name }}`"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Stale Count:*\n{{ outputs.probe_stale_pending_records.size }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Older Than:*\n{{ inputs.stale_threshold_hours }} hours"
                        }
                      ]
                    },
                    {
                      "type": "context",
                      "elements": [
                        {
                          "type": "mrkdwn",
                          "text": "Execution ID: `{{ execution.id }}` | Namespace: `{{ flow.namespace }}`"
                        }
                      ]
                    }
                  ]
                }
          else:
            - id: log_warning_audit_only
              type: io.kestra.plugin.core.log.Log
              description: Record warning finding in audit log without paging on-call.
              message: "AUDIT ONLY: Stale pending records detected on Supabase table {{ inputs.table_name }}. Found {{ outputs.probe_stale_pending_records.size }} records older than {{ inputs.stale_threshold_hours }} hours."

      HEALTHY:
        - id: log_healthy_status
          type: io.kestra.plugin.core.log.Log
          description: Record nominal audit entry confirming zero stale pending records.
          message: "HEALTHY: Zero stale pending records found on Supabase table {{ inputs.table_name }} older than {{ inputs.stale_threshold_hours }} hours. PostgREST endpoint is healthy."
    defaults:
      - id: log_unknown_classification
        type: io.kestra.plugin.core.log.Log
        description: Record fallback log entry for unanticipated classification value.
        message: "Unknown sentinel classification received: {{ outputs.classify_stale_accumulation.value }}"

  - id: log_sentinel_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Record final audit entry maintaining an unbroken execution history of sentinel verification passes.
    message: "Supabase stale record audit pass complete. Status: {{ outputs.classify_stale_accumulation.value | trim }} | Table: {{ inputs.table_name }} | Inspected Count: {{ outputs.probe_stale_pending_records.size }} | Execution: {{ execution.id }}."

errors:
  - id: on_failure_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Out-of-band error handler alerting on-call if the Supabase endpoint is unreachable or authentication fails.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Supabase stale record sentinel execution {{ execution.id }} FAILED for table {{ inputs.table_name }} in namespace {{ flow.namespace }}. Check Supabase endpoint reachability and service role credentials."
      }

extend:
  title: Supabase Stale Pending Record and Webhook Event Quarantine Sentinel
  metaTitle: Supabase Stale Pending Record and Webhook Event Quarantine Sentinel | Kestra
  shortDescription: Audit Supabase tables for stale pending webhook events and abandoned records with automated quarantine remediation.
  metaDescription: Audit Supabase PostgREST tables for stale pending webhook events and records. Alert Slack on backlog thresholds with automated quarantine updates.
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
  description: |
    Modern backend architectures built on Supabase rely heavily on transactional outbox patterns, asynchronous webhook triggers, and event queue tables to process customer activity, payments, and background notifications. When downstream API consumers fail, rate limits trip, or unhandled exceptions stall event processors, records frequently remain trapped in a `pending` or `processing` state.

    Without automated Day 2 governance, accumulated stale records create phantom inventory reservations, cause exponential polling load against PostgreSQL, and hide silent customer-facing processing stalls from operators.

    This blueprint implements a declarative governance sentinel for Supabase and PostgREST. On an automated schedule, Kestra queries the target Supabase table using native PostgREST filtering, calculates the age of pending records against operational TTL thresholds, evaluates backlog volume, dispatches structured Slack notifications on SLA breaches, and safely transitions stuck records to a `quarantined` state to prevent poison-pill retry loops.

    ## How it works

    1. `periodic_stale_audit_schedule` triggers the sentinel workflow on a 6-hour cron schedule (disabled by default for initial environment configuration).
    2. `compute_stale_cutoff_timestamp` calculates the ISO-8601 boundary timestamp using `io.kestra.plugin.core.debug.Return` based on `stale_threshold_hours`.
    3. `probe_stale_pending_records` executes a GET request against the Supabase PostgREST endpoint using `io.kestra.plugin.supabase.Select`, filtering for records where `status=eq.pending` and `created_at=lt.<cutoff>` ordered by `created_at.asc`.
    4. `classify_stale_accumulation` evaluates the retrieved row count (`outputs.probe_stale_pending_records.size`):
       - `HEALTHY`: When 0 stale pending records exist.
       - `WARNING_STALE_DETECTED`: When stale records are present below `critical_count_threshold`.
       - `CRITICAL_ACCUMULATION`: When stale records reach or exceed `critical_count_threshold`.
    5. `route_sentinel_classification` uses `io.kestra.plugin.core.flow.Switch` to branch on the evaluation:
       - On `CRITICAL_ACCUMULATION` and `WARNING_STALE_DETECTED`: Evaluates `alert_mode` and posts a structured block-kit notification to Slack via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
       - On `CRITICAL_ACCUMULATION`: Evaluates `auto_quarantine` and `dry_run`. When `auto_quarantine: true` and `dry_run: false`, executes `io.kestra.plugin.supabase.Update` to set `status: "quarantined"` on matching records, logging the updated count.
       - On `HEALTHY`: Records a nominal audit pass.
    6. `log_sentinel_audit_complete` runs at the conclusion of every execution to maintain an unbroken audit history in Kestra.
    7. A flow-level `errors` handler catches network partitions, invalid API tokens, or PostgREST gateway timeouts and alerts operators.

    ## What you get

    - Automated, continuous monitoring of Supabase tables for stuck or unconsumed records without running custom daemon scripts.
    - PostgREST-native filtering that audits database state over standard HTTP REST interfaces without requiring direct database port exposure.
    - Two-stage safety gating via `dry_run` and `auto_quarantine` to verify candidate records before enabling automated status mutation.
    - Dual alert operating modes: `ALERT` for active incident paging and `AUDIT_ONLY` for passive compliance logging.
    - Structured Slack notifications detailing table name, backlog count, and cutoff timestamps.

    ## Who it's for

    - Platform Engineers and Full-Stack Developers managing Supabase or self-hosted PostgREST backends.
    - SREs responsible for asynchronous webhook delivery reliability and event outbox hygiene.
    - Data Operations teams tracking transactional integrity across Supabase database tables.

    ## Why orchestrate this with Kestra

    Supabase provides real-time APIs and dashboard views, but does not natively schedule multi-step audit sweeps, evaluate complex SLA threshold logic, or safely coordinate automated quarantine updates with team alerts. Kestra provides declarative, version-controlled workflows with built-in secret masking, precise scheduling, conditional branching, native Slack alerts, and complete execution audit logging.

    ## Prerequisites

    - A running Supabase project (Supabase Cloud or self-hosted PostgREST instance) reachable from the Kestra worker environment.
    - A Supabase Service Role Key (`service_role` secret) authorized to select and update rows on the target table (bypassing RLS policies).
    - A target table containing at least `id` (UUID or integer), `status` (text), and `created_at` (timestamp) columns.
    - A Slack incoming webhook URL for dispatching alerts.

    ### Secrets

    - `SUPABASE_SERVICE_ROLE_KEY`: Service role API key for your Supabase project (required to read and update records regardless of RLS).
    - `SLACK_WEBHOOK`: Incoming webhook URL for the target Slack channel.

    In Kestra OSS installations, configure secrets as base64-encoded environment variables:

      SECRET_SUPABASE_SERVICE_ROLE_KEY=$(echo -n "your-service-role-key" | base64)
      SECRET_SLACK_WEBHOOK=$(echo -n "https://hooks.slack.com/services/T00/B00/XXXX" | base64)

    ## Quick start

    1. Start a local PostgreSQL and PostgREST container stack using Docker:

         docker network create kestra-supabase-net

         docker run -d \
           --name supabase-db \
           --network kestra-supabase-net \
           -e POSTGRES_PASSWORD=postgres \
           -p 5432:5432 \
           postgres:15-alpine

         docker run -d \
           --name supabase-rest \
           --network kestra-supabase-net \
           -p 8000:3000 \
           -e PGRST_DB_URI="postgres://postgres:postgres@supabase-db:5432/postgres" \
           -e PGRST_DB_SCHEMAS="public" \
           -e PGRST_DB_ANON_ROLE="postgres" \
           postgrest/postgrest:latest

    2. Connect the PostgREST container to your Kestra Docker network:

         docker network connect YOUR_KESTRA_NETWORK supabase-rest

       Verify active networks with `docker network ls`.

    3. Create the sample `webhook_events` table and seed test records:

         docker exec -i supabase-db psql -U postgres -d postgres -c "
           CREATE TABLE IF NOT EXISTS public.webhook_events (
             id SERIAL PRIMARY KEY,
             event_type TEXT NOT NULL,
             status TEXT NOT NULL DEFAULT 'pending',
             created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
           );
           INSERT INTO public.webhook_events (event_type, status, created_at)
           VALUES
             ('invoice.payment_failed', 'pending', NOW() - INTERVAL '36 hours'),
             ('customer.subscription_deleted', 'pending', NOW() - INTERVAL '30 hours'),
             ('order.created', 'pending', NOW() - INTERVAL '2 hours');
         "

    4. Configure the `SUPABASE_SERVICE_ROLE_KEY` and `SLACK_WEBHOOK` secrets in your Kestra environment.
    5. Import this blueprint into your Kestra instance.
    6. Execute the flow manually with `dry_run: true` to verify that the two 30+ hour records are detected as stale without being modified.
    7. Execute with `auto_quarantine: true` and `dry_run: false` to verify that the stale records are updated to `quarantined`.
    8. Enable `periodic_stale_audit_schedule` to begin automated 6-hour operational sweeps.

    ## How to extend

    - Add dead-letter archival by writing quarantined records to external object storage (AWS S3, Google Cloud Storage) before deleting them from the primary table using `io.kestra.plugin.supabase.Delete`.
    - Loop over multiple critical tables (e.g., `invitations`, `order_sessions`, `outbox_events`) using `io.kestra.plugin.core.flow.Loop`.
    - Integrate with PagerDuty or Opsgenie to escalate critical accumulation breaches based on business hours.
    - Implement automatic retry dispatch by publishing quarantined records back to an event broker like Apache Kafka or RabbitMQ.

    ## Links

    - Supabase Plugin Documentation: https://kestra.io/plugins/plugin-supabase
    - Supabase Select Task: https://kestra.io/plugins/plugin-supabase/tasks/io.kestra.plugin.supabase.select
    - Supabase Update Task: https://kestra.io/plugins/plugin-supabase/tasks/io.kestra.plugin.supabase.update
    - PostgREST Filtering Reference: https://postgrest.org/en/stable/references/api/tables_views.html#horizontal-filtering-rows
    - Slack Webhook Plugin: https://kestra.io/plugins/plugin-slack/tasks/io.kestra.plugin.slack.notifications.slackincomingwebhook

    ## Pitfalls

    - Service Role Key requirement: PostgREST applies PostgreSQL Row Level Security (RLS) policies by default. When querying administrative audit tables across all users, always provide the `service_role` key in `SUPABASE_SERVICE_ROLE_KEY` rather than the public `anon` key.
    - Timestamp timezone formatting: PostgREST requires ISO-8601 formatted timestamps (e.g. `2026-10-15T00:00:00+00:00`). Using space-separated timestamp strings will result in PostgREST HTTP 400 Bad Request query errors.
    - Two-stage safety gates: `auto_quarantine` requires `dry_run: false` to apply updates. If `dry_run` remains `true`, mutations are skipped regardless of `auto_quarantine` setting.
    - Container network routing: When running Kestra and Supabase/PostgREST in separate Docker containers, `http://localhost:8000` refers to the Kestra container itself. Use the container hostname `http://supabase-rest:3000` or the host gateway on a shared bridge network.
