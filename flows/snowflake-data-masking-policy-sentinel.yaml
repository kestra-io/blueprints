id: snowflake-data-masking-policy-sentinel
namespace: company.governance

inputs:
  - id: snowflake_account
    type: STRING
    defaults: xy12345.us-east-1
    description: Snowflake account identifier.
  - id: snowflake_username
    type: STRING
    defaults: kestra_monitor
    description: Snowflake service user.

tasks:
  - id: query_unmasked_columns
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ inputs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ inputs.snowflake_username }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    sql: |
      SELECT 
        c.TABLE_CATALOG || '.' || c.TABLE_SCHEMA || '.' || c.TABLE_NAME || '.' || c.COLUMN_NAME AS SENSITIVE_COLUMN,
        c.DATA_TYPE
      FROM SNOWFLAKE.ACCOUNT_USAGE.COLUMNS c
      WHERE c.DELETED IS NULL
        AND (LOWER(c.COLUMN_NAME) LIKE '%ssn%' 
          OR LOWER(c.COLUMN_NAME) LIKE '%credit_card%' 
          OR LOWER(c.COLUMN_NAME) LIKE '%password%'
          OR LOWER(c.COLUMN_NAME) LIKE '%email%')
        AND NOT EXISTS (
          SELECT 1 
          FROM SNOWFLAKE.ACCOUNT_USAGE.POLICY_REFERENCES p
          WHERE p.POLICY_KIND = 'MASKING_POLICY'
            AND p.REF_DATABASE_NAME = c.TABLE_CATALOG
            AND p.REF_SCHEMA_NAME = c.TABLE_SCHEMA
            AND p.REF_ENTITY_NAME = c.TABLE_NAME
            AND p.REF_COLUMN_NAME = c.COLUMN_NAME
        )
      LIMIT 10;
    fetchType: FETCH

  - id: evaluate_unmasked_sensitive_data
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_unmasked_columns.rows | length > 0 }}"
    then:
      - id: alert_governance_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":lock: *Snowflake Data Governance Alert*: Found {{ outputs.query_unmasked_columns.rows | length }} sensitive PII columns without active dynamic data masking policies (e.g. `{{ outputs.query_unmasked_columns.rows[0].SENSITIVE_COLUMN }}`). Apply masking policies to comply with privacy regulations."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Snowflake Governance Sentinel Failure*: Failed to query masking policy references."
      }

triggers:
  - id: weekly_governance_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true

extend:
  title: Snowflake Sensitive Column Data Masking Policy Coverage Sentinel
  shortDescription: Audits Snowflake tables to detect PII and sensitive data columns lacking active dynamic data masking policies.
  description: |
    ## How it works
    This sentinel leverages the JDBC Snowflake plugin to cross-reference table columns matching sensitive PII patterns against `SNOWFLAKE.ACCOUNT_USAGE.POLICY_REFERENCES`. It flags columns storing emails, credit cards, or identity identifiers that lack masking policies, preventing unauthorized plaintext exposure to analytical users.

    ## What you get
    - Continuous compliance auditing for GDPR, HIPAA, and PCI-DSS data privacy standards.
    - Early prevention of plaintext credential or PII leaks in analytical query results.
    - Automated Slack delivery tracking unmasked sensitive column names and schemas.

    ## Who it's for
    - Data governance leads, compliance officers, and data protection officers (DPOs).
    - Data architects enforcing column-level security policies in Snowflake.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled analytical health checks natively using the Snowflake JDBC plugin suite, combining SQL telemetry with declarative conditional logic and notification dispatching.

    ## Prerequisites
    - Snowflake account access with permissions on `ACCOUNT_USAGE.COLUMNS` and `POLICY_REFERENCES`.
    - Secrets `SNOWFLAKE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure Snowflake account, user, and credentials.
    3. Run manually to check current unmasked sensitive columns.

    ## How to extend
    - Query `TAG_REFERENCES` concurrently to match custom governance tags like `CONFIDENTIAL`.
    - Automatically attach dynamic masking policies via `ALTER TABLE ... MODIFY COLUMN ... SET MASKING POLICY`.
    - Export audit reports to a central compliance registry.

    ## Links
    - [Kestra Snowflake Plugin](https://kestra.io/plugins/plugin-jdbc-snowflake)
    - [Snowflake Dynamic Data Masking](https://docs.snowflake.com/en/user-guide/security-column-ddm-use)
  tags:
    - Data
    - Cloud
  subTags:
    - Governance & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
