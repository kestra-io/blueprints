id: apisix-route-health-and-upstream-drift-sentinel
namespace: company.team
description: |
  Audits Apache APISIX API Gateway instances on a schedule by probing Control
  API health and verifying canary route status across the Admin API, detecting
  route deletion, unauthorized disabling, or configuration drift, and dispatching
  actionable Slack alerts or safe remediation re-provisions.

triggers:
  - id: periodic_gateway_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodically probes APISIX control plane and canary route integrity. Shipped disabled by default; enable once apisix_host and admin credentials point to a running APISIX instance."
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      apisix_host: "localhost"
      apisix_control_port: 9092
      apisix_admin_port: 9180
      canary_route_id: "canary_health_route"
      canary_upstream_target: "127.0.0.1:8080"
      auto_restore_route: "false"
      dry_run: "true"

inputs:
  - id: apisix_host
    type: STRING
    displayName: "APISIX Gateway Host"
    defaults: "localhost"
    description: "Hostname or IP address of the Apache APISIX API Gateway instance."

  - id: apisix_control_port
    type: INT
    displayName: "Control API Port"
    defaults: 9092
    description: "Port exposed by the APISIX Control API for health checks (default: 9092)."

  - id: apisix_admin_port
    type: INT
    displayName: "Admin API Port"
    defaults: 9180
    description: "Port exposed by the APISIX Admin API for route and upstream management (default: 9180)."

  - id: canary_route_id
    type: STRING
    displayName: "Canary Route ID"
    defaults: "canary_health_route"
    description: "Identifier of the canary route monitored for drift and configuration state."

  - id: canary_upstream_target
    type: STRING
    displayName: "Canary Upstream Target"
    defaults: "127.0.0.1:8080"
    description: "Upstream host and port configured for the canary verification route."

  - id: auto_restore_route
    type: STRING
    displayName: "Auto-Restore Canary Route"
    defaults: "false"
    description: "Set to 'true' to automatically re-provision or re-enable the canary route when missing or disabled."

  - id: dry_run
    type: STRING
    displayName: "Dry Run Mode"
    defaults: "true"
    description: "When 'true', alerts on drift and logs intended remediations without altering APISIX route tables."

tasks:
  - id: probe_apisix_control_health
    type: io.kestra.plugin.core.http.Request
    description: "Queries APISIX Control API GET /v1/healthcheck endpoint to verify gateway process readiness and health."
    uri: "http://{{ inputs.apisix_host }}:{{ inputs.apisix_control_port }}/v1/healthcheck"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true

  - id: probe_canary_route_status
    type: io.kestra.plugin.core.http.Request
    description: "Queries APISIX Admin API GET /apisix/admin/routes/{id} to audit canary route existence and enabled status."
    uri: "http://{{ inputs.apisix_host }}:{{ inputs.apisix_admin_port }}/apisix/admin/routes/{{ inputs.canary_route_id }}"
    method: GET
    headers:
      X-API-KEY: "{{ secret('APISIX_ADMIN_KEY') }}"
      Accept: "application/json"
    options:
      allowFailed: true

  - id: classify_gateway_verdict
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates Control API health and Admin API route metadata to classify gateway operational state."
    value: >-
      {% if outputs.probe_apisix_control_health.status != 200 or (fromJson(outputs.probe_apisix_control_health.body).status ?? '') != 'ok' %}
      CONTROL_PLANE_UNHEALTHY
      {% elif outputs.probe_canary_route_status.status == 404 %}
      CANARY_ROUTE_MISSING
      {% elif (fromJson(outputs.probe_canary_route_status.body).value.status ?? 1) == 0 %}
      CANARY_ROUTE_DISABLED
      {% else %}
      HEALTHY
      {% endif %}
    cases:
      CONTROL_PLANE_UNHEALTHY:
        - id: alert_control_plane_unhealthy
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches high-severity alert when APISIX Control API reports degraded or unresponsive status."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#gateway-alerts",
              "text": ":rotating_light: *Apache APISIX Control Plane Unhealthy*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *APISIX Control Plane Unhealthy*\n*Host:* `{{ inputs.apisix_host }}:{{ inputs.apisix_control_port }}`\n*HTTP Status:* `{{ outputs.probe_apisix_control_health.status }}`\n*Reported Status:* `{{ fromJson(outputs.probe_apisix_control_health.body).status ?? 'UNKNOWN' }}`\nGateway data plane may fail to process traffic or reload configuration."
                  }
                }
              ]
            }

      CANARY_ROUTE_MISSING:
        - id: alert_canary_route_missing
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches alert when monitored canary route is absent from the APISIX route table."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#gateway-alerts",
              "text": ":warning: *Apache APISIX Canary Route Missing*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Canary Route Missing from Route Table*\n*Host:* `{{ inputs.apisix_host }}:{{ inputs.apisix_admin_port }}`\n*Route ID:* `{{ inputs.canary_route_id }}`\n*HTTP Status:* `{{ outputs.probe_canary_route_status.status }}`\nThe route was deleted or never synchronized. Ingress traffic for this endpoint will return 404."
                  }
                }
              ]
            }

        - id: evaluate_remediation_route_missing
          type: io.kestra.plugin.core.flow.If
          description: "Evaluates safety gates before re-provisioning missing canary route via Admin API."
          condition: "{{ inputs.auto_restore_route == 'true' and inputs.dry_run == 'false' }}"
          then:
            - id: restore_canary_route
              type: io.kestra.plugin.core.http.Request
              description: "Issues PUT /apisix/admin/routes/{id} to re-create the missing canary route with baseline upstream."
              uri: "http://{{ inputs.apisix_host }}:{{ inputs.apisix_admin_port }}/apisix/admin/routes/{{ inputs.canary_route_id }}"
              method: PUT
              headers:
                X-API-KEY: "{{ secret('APISIX_ADMIN_KEY') }}"
                Content-Type: "application/json"
              body: |
                {
                  "name": "{{ inputs.canary_route_id }}",
                  "uri": "/healthz",
                  "status": 1,
                  "upstream": {
                    "type": "roundrobin",
                    "nodes": {
                      "{{ inputs.canary_upstream_target }}": 1
                    }
                  }
                }
            - id: log_restore_missing
              type: io.kestra.plugin.core.log.Log
              message: "Re-provisioned missing canary route '{{ inputs.canary_route_id }}' on APISIX Admin API."
          else:
            - id: log_dry_run_missing
              type: io.kestra.plugin.core.log.Log
              message: "Dry-run active or auto_restore_route disabled. Suppressed automated route creation."

      CANARY_ROUTE_DISABLED:
        - id: alert_canary_route_disabled
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches alert when canary route exists but is administratively disabled (status=0)."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#gateway-alerts",
              "text": ":warning: *Apache APISIX Canary Route Disabled*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Canary Route Disabled (Status 0)*\n*Host:* `{{ inputs.apisix_host }}:{{ inputs.apisix_admin_port }}`\n*Route ID:* `{{ inputs.canary_route_id }}`\nThe route status is 0 (disabled). Ingress traffic is being dropped or bypassed."
                  }
                }
              ]
            }

        - id: evaluate_remediation_route_disabled
          type: io.kestra.plugin.core.flow.If
          description: "Evaluates safety gates before re-enabling disabled canary route via Admin API."
          condition: "{{ inputs.auto_restore_route == 'true' and inputs.dry_run == 'false' }}"
          then:
            - id: enable_canary_route
              type: io.kestra.plugin.core.http.Request
              description: "Issues PATCH /apisix/admin/routes/{id} to re-enable the route (status=1)."
              uri: "http://{{ inputs.apisix_host }}:{{ inputs.apisix_admin_port }}/apisix/admin/routes/{{ inputs.canary_route_id }}"
              method: PATCH
              headers:
                X-API-KEY: "{{ secret('APISIX_ADMIN_KEY') }}"
                Content-Type: "application/json"
              body: |
                {
                  "status": 1
                }
            - id: log_enable_route
              type: io.kestra.plugin.core.log.Log
              message: "Re-enabled canary route '{{ inputs.canary_route_id }}' (status=1) on APISIX Admin API."
          else:
            - id: log_dry_run_disabled
              type: io.kestra.plugin.core.log.Log
              message: "Dry-run active or auto_restore_route disabled. Suppressed automated route enablement."

      HEALTHY:
        - id: log_gateway_healthy
          type: io.kestra.plugin.core.log.Log
          message: "APISIX Gateway and canary route '{{ inputs.canary_route_id }}' are healthy (control_status=ok, route_status=enabled)."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Records execution audit lineage and parameter state across gateway verification steps."
    message: "APISIX Sentinel Audit Complete: Host={{ inputs.apisix_host }}, ControlPort={{ inputs.apisix_control_port }}, AdminPort={{ inputs.apisix_admin_port }}, CanaryRoute={{ inputs.canary_route_id }}, DryRun={{ inputs.dry_run }}."

errors:
  - id: alert_connectivity_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatches critical outage alert when network connection to APISIX endpoints fails completely."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#gateway-alerts",
        "text": ":rotating_light: *Apache APISIX Gateway Connection Failure*",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": ":rotating_light: *APISIX Ingress Unreachable*\n*Target Host:* `{{ inputs.apisix_host }}`\n*Control Port:* `{{ inputs.apisix_control_port }}`\n*Admin Port:* `{{ inputs.apisix_admin_port }}`\n*Execution ID:* `{{ execution.id }}`\nKestra was unable to establish an HTTP connection. Check container status, network routes, or firewall rules."
            }
          }
        ]
      }

extend:
  title: Apache APISIX Route Health & Upstream Drift Sentinel
  metaTitle: APISIX Route Health & Upstream Drift Sentinel | Kestra
  shortDescription: Audit Apache APISIX gateway health, detect canary route drift or disabled upstreams, and dispatch Slack alerts.
  metaDescription: Audit Apache APISIX gateway health and canary route status, detect configuration drift, and dispatch Slack alerts.
  description: |
    Continuously audits Apache APISIX API Gateway instances on a schedule by probing Control API health and interrogating Admin API route definitions, identifying missing canary endpoints, disabled routes, and control plane failures while providing dual-gated automated remediation.

    ## How it works

    1. `periodic_gateway_audit` (`io.kestra.plugin.core.trigger.Schedule`) triggers every 15 minutes, passing target host, port configurations, and canary route identifiers. Shipped disabled by default for safe initial setup.
    2. `probe_apisix_control_health` (`io.kestra.plugin.core.http.Request`) invokes the APISIX Control API endpoint `GET /v1/healthcheck` to verify daemon process readiness and runtime health.
    3. `probe_canary_route_status` (`io.kestra.plugin.core.http.Request`) queries the APISIX Admin API endpoint `GET /apisix/admin/routes/{id}` with administrative credentials (`X-API-KEY`) to inspect the operational status of the designated canary route.
    4. `classify_gateway_verdict` (`io.kestra.plugin.core.flow.Switch`) evaluates the responses:
       - `CONTROL_PLANE_UNHEALTHY`: Fires when the Control API returns non-200 or status is not `ok`, alerting `#gateway-alerts` via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
       - `CANARY_ROUTE_MISSING`: Fires when the canary route returns 404, indicating accidental deletion or desynchronized GitOps state. Dispatches a Slack alert and, if `auto_restore_route` is enabled and `dry_run` is false, provisions the canonical route via `PUT /apisix/admin/routes/{id}`.
       - `CANARY_ROUTE_DISABLED`: Fires when the route exists but its `status` is set to `0` (disabled), dropping ingress traffic. Dispatches a Slack alert and, if remediation gates pass, issues a `PATCH` request to restore `status: 1`.
       - `HEALTHY`: Confirms normal gateway operation and records compliant state via `io.kestra.plugin.core.log.Log`.
    5. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) records completion details and parameter state for regulatory compliance and audit lineage.
    6. The global `errors` block intercepts connection timeouts or refused sockets, alerting on-call engineers when the APISIX container or pod is down.

    ## What you get

    - Automated Day 2 health and drift monitoring for Apache APISIX API Gateway deployments.
    - Early warning when ingress routes are accidentally disabled, deleted, or de-synchronized from GitOps configurations.
    - Safe dual-key automated remediation (`auto_restore_route: true` and `dry_run: false`) preventing unintended production mutations.
    - Centralized audit lineage tracking gateway control plane availability over time.

    ## Who it's for

    - Platform Engineers and Site Reliability Engineers managing cloud-native API gateways and Kubernetes ingress controllers.
    - DevOps Teams operating Apache APISIX standalone or clustered topologies.
    - Security and Compliance Teams enforcing route availability and ingress baseline policies.

    ## Why orchestrate this with Kestra

    API gateways sit at the perimeter of production microservices architectures. A failure in the control plane or an accidental route deletion silently causes catastrophic outages for upstream consumers. Kestra provides declarative scheduled orchestration, robust multi-branch condition evaluation with Pebble expressions, built-in credential masking via secrets, and safe remediation execution without brittle custom cron scripts.

    ## Prerequisites

    - A running Apache APISIX instance (version 3.x+). The official open-source Docker image (`apache/apisix:3.9.1-debian`) is free and open-source under the Apache 2.0 license.
    - APISIX Control API enabled (port 9092) and Admin API enabled (port 9180).
    - An incoming Slack webhook URL for routing alerts.

    ### Secrets

    - `APISIX_ADMIN_KEY`: Administrative API key for APISIX Admin API authentication (passed in `X-API-KEY` header; default in open-source container is `edd1c9f034335f136f87ad84b625c8f1`).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by `alert_control_plane_unhealthy`, `alert_canary_route_missing`, `alert_canary_route_disabled`, and `alert_connectivity_failure`.

    ## Quick start

    1. Start a local Apache APISIX container:
       ```bash
       docker run -d --name apisix-quickstart -p 9080:9080 -p 9180:9180 -p 9092:9092 apache/apisix:3.9.1-debian
       ```
    2. Create a canary route on the APISIX Admin API:
       ```bash
       curl -i http://localhost:9180/apisix/admin/routes/canary_health_route -H 'X-API-KEY: edd1c9f034335f136f87ad84b625c8f1' -X PUT -d '{"uri":"/healthz","status":1,"upstream":{"type":"roundrobin","nodes":{"127.0.0.1:8080":1}}}'
       ```
    3. Configure `APISIX_ADMIN_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    4. Execute this workflow with default inputs (`dry_run: true`).
    5. Verify in the execution logs that `log_gateway_healthy` confirms healthy gateway operation.
    6. Enable `periodic_gateway_audit` to schedule continuous 15-minute evaluations.

    ## How to extend

    - Add multiple canary routes or upstream pool probes within a parallel task block to audit the entire route catalog.
    - Wire a downstream PagerDuty incident trigger via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` when `CONTROL_PLANE_UNHEALTHY` fires.
    - Combine with GitOps webhook triggers (`io.kestra.plugin.core.trigger.Webhook`) to automatically audit route integrity immediately after CI/CD deployment pipelines merge.

    ## Links

    - [Apache APISIX Official Documentation](https://apisix.apache.org/docs/apisix/getting-started/)
    - [Apache APISIX Admin API Reference](https://apisix.apache.org/docs/apisix/admin-api/)
    - [Apache APISIX Control API Reference](https://apisix.apache.org/docs/apisix/control-api/)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
