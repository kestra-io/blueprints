id: npm-outdated-major-bumps-digest
namespace: company.team
description: "Run `npm outdated` in a container and post a digest of dependencies\
  \ that have\na new major version waiting \u2014 the ones that actually carry breaking-change\
  \ risk.\n"
triggers:
- id: weekly_digest
  type: io.kestra.plugin.core.trigger.Schedule
  description: Weekly dependency freshness digest; shipped disabled until secrets
    and repo path are set.
  cron: 30 9 * * 3
  disabled: true
- id: pr_webhook
  type: io.kestra.plugin.core.trigger.Webhook
  description: Call after merging a dependency PR to confirm nothing else is silently
    stale.
  key: npm-outdated-check
inputs:
- id: repo_url
  type: STRING
  defaults: https://github.com/kestra-io/kestra.git
  description: Git URL cloned before running npm outdated.
- id: subdirectory
  type: STRING
  defaults: ui
  description: Subdirectory containing package.json (the JS app root). Use "." for
    repo root.
tasks:
- id: npm_outdated
  type: io.kestra.plugin.scripts.shell.Commands
  description: Clone the repo, install nothing (npm outdated only needs the registry),
    and emit parsed outdated-dependency JSON via the stdout outputs protocol.
  containerImage: node:20-bookworm
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  commands:
  - "set -eu\ngit clone --depth 1 \"{{ inputs.repo_url }}\" repo 2>/dev/null\ncd \"\
    repo/{{ inputs.subdirectory }}\"\nnpm outdated --json > outdated.json || true\n\
    node -e '\n  const fs = require(\"fs\");\n  let content = \"\";\n  try {\n   \
    \ content = fs.readFileSync(\"outdated.json\", \"utf8\").trim();\n  } catch (e)\
    \ {\n    console.error(\"Missing outdated.json:\", e);\n    process.exit(1);\n\
    \  }\n  let data = {};\n  if (content) {\n    try {\n      data = JSON.parse(content);\n\
    \    } catch (e) {\n      console.error(\"Invalid JSON in outdated.json:\", e);\n\
    \      process.exit(1);\n    }\n  }\n  const entries = Object.entries(data).map(([name,\
    \ v]) => ({\n    name, current: v.current, wanted: v.wanted, latest: v.latest,\n\
    \    major: String(v.current).split(\".\")[0] !== String(v.latest).split(\".\"\
    )[0],\n  }));\n  const majors = entries.filter(e => e.major);\n  console.log(\"\
    outdated: \" + entries.length + \", major bumps: \" + majors.length);\n  console.log(\"\
    ::\" + JSON.stringify({ outputs: { total: entries.length, majors: majors.length,\
    \ details: majors.slice(0, 10) } }) + \"::\");\n'\n"
- id: check_majors
  type: io.kestra.plugin.core.flow.If
  description: "Only interrupt the team when at least one major bump is pending \u2014\
    \ patch/minor drift gets logged."
  condition: '{{ outputs.npm_outdated.vars.majors > 0 }}'
  then:
  - id: post_digest
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: List the major bumps so the digest says which packages carry breaking-change
      risk.
    url: '{{ secret(''SLACK_WEBHOOK_URL'') }}'
    payload: "{\n  \"text\": \":package: npm outdated digest for {{ inputs.repo_url\
      \ }} ({{ inputs.subdirectory }}): {{ outputs.npm_outdated.vars.majors }} major\
      \ bump(s) out of {{ outputs.npm_outdated.vars.total }} outdated packages. Review\
      \ {{ inputs.subdirectory }}/package.json. Execution {{ execution.id }}.\"\n\
      }\n"
  else:
  - id: log_fresh
    type: io.kestra.plugin.core.log.Log
    description: Record the green week so stale weeks stand out in the execution history.
    message: No major npm bumps pending for {{ inputs.repo_url }} ({{ inputs.subdirectory
      }}); {{ outputs.npm_outdated.vars.total }} outdated total.
errors:
- id: alert_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  description: "Alert when the check itself fails \u2014 a broken audit must not look\
    \ like a fresh dependency tree."
  url: '{{ secret(''SLACK_WEBHOOK_URL'') }}'
  payload: "{\n  \"text\": \"npm outdated check FAILED in flow {{ flow.id }} (execution\
    \ {{ execution.id }}) for {{ inputs.repo_url }}. Verify the repo URL and subdirectory\
    \ input.\"\n}\n"
outputs:
- id: total
  type: INT
  value: '{{ outputs.npm_outdated.vars.total }}'
- id: majors
  type: INT
  value: '{{ outputs.npm_outdated.vars.majors }}'
extend:
  title: Weekly npm Outdated Major-Bump Digest
  shortDescription: Runs npm outdated against your JS subtree and posts a Slack digest
    of packages with major-version upgrades.
  metaTitle: npm Outdated Dependency Digest
  metaDescription: Weekly npm outdated audit that highlights major-version dependency
    risk and posts a digest to Slack.
  description: "Dependabot sends a PR per package; nobody reads sixty of them. A weekly\
    \ digest of what actually has a *major* bump pending is the signal you can act\
    \ on. This blueprint clones your repo, runs `npm outdated` in a throwaway Node\
    \ container, splits the results into major versus minor/patch drift, and posts\
    \ the majors to Slack.\n\n## How it works\n\n1. `npm_outdated` (`io.kestra.plugin.scripts.shell.Commands`\
    \ on Docker) clones the repo, runs `npm outdated --json` in the subdirectory,\
    \ and emits `total`, `majors`, and the first 10 major-bump details via the `::{\"\
    outputs\": ...}::` protocol.\n2. `check_majors` (`io.kestra.plugin.core.flow.If`)\
    \ branches: majors pending \u2192 `post_digest` lists the count and total to Slack;\
    \ otherwise `log_fresh` records the green week.\n3. The `errors` block alerts\
    \ Slack when the clone or npm call fails.\n4. Triggers: weekly `Schedule` (disabled\
    \ by default) plus a `Webhook` for post-merge checks.\n\n## What you get\n\n-\
    \ One weekly message that separates breaking-risk upgrades from routine drift.\n\
    - A dependency freshness trend in your execution history.\n- A `dependency_summary`\
    \ JSON output for dashboards.\n\n## Who it's for\n\n- Frontend teams drowning\
    \ in Dependabot PRs.\n- Maintainers who only want to hear about majors.\n- Platform\
    \ teams policing monorepo sub-packages.\n\n## Why orchestrate this with Kestra\n\
    \n`npm outdated` prints a table nobody reads. The flow turns it into a weekly,\
    \ branched, alerted digest \u2014 and the next step (open a tracking issue, pin\
    \ a Dependabot schedule, gate releases) is one task away.\n\n## Prerequisites\n\
    \n- A reachable git URL for your repo.\n- A Slack webhook.\n\n### Secrets\n\n\
    - `SLACK_WEBHOOK_URL`: webhook for the digest and failure alerts.\n\n## Quick\
    \ start\n\n1. Add the Slack webhook secret.\n2. Set `repo_url` and `subdirectory`\
    \ (e.g. `ui`).\n3. Run once and read `dependency_summary`.\n4. Enable `weekly_digest`.\n\
    \n## How to extend\n\n- Add `npm audit --json` parsing for vulnerability counts.\n\
    - Fan out over multiple subdirectories with a `ForEach`.\n- Store `dependency_summary`\
    \ in KV and alert only on growth.\n\n## Links\n\n- [npm outdated docs](https://docs.npmjs.com/cli/commands/npm-outdated)\n\
    - [Kestra Slack incoming webhook](https://kestra.io/plugins/notifications/slack)\n\
    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)\n"
  tags:
  - Infrastructure
  - Cloud
  subTags:
  - Security
  - CI/CD
  ee: false
  demo: false
