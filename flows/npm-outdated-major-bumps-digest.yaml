id: npm-outdated-major-bumps-digest
namespace: company.team
description: |
  Run `npm outdated` in a container and post a digest of dependencies that have
  a new major version waiting — the ones that actually carry breaking-change risk.

triggers:
  - id: weekly_digest
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly dependency freshness digest; shipped disabled until secrets and repo path are set.
    cron: "30 9 * * 3"
    disabled: true
  - id: pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call after merging a dependency PR to confirm nothing else is silently stale.
    key: npm-outdated-check

inputs:
  - id: repo_url
    type: STRING
    defaults: https://github.com/kestra-io/kestra.git
    description: Git URL cloned before running npm outdated.
  - id: subdirectory
    type: STRING
    defaults: ui
    description: Subdirectory containing package.json (the JS app root). Use "." for repo root.

tasks:
  - id: npm_outdated
    type: io.kestra.plugin.scripts.shell.Commands
    description: Clone the repo, install nothing (npm outdated only needs the registry), and emit parsed outdated-dependency JSON via the stdout outputs protocol.
    containerImage: node:20-bookworm
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        set -eu
        git clone --depth 1 "{{ inputs.repo_url }}" repo 2>/dev/null
        cd "repo/{{ inputs.subdirectory }}"
        npm outdated --json > outdated.json || true
        node -e '
          const fs = require("fs");
          let data = {};
          try { data = JSON.parse(fs.readFileSync("outdated.json", "utf8")); } catch (e) { data = {}; }
          const entries = Object.entries(data).map(([name, v]) => ({
            name, current: v.current, wanted: v.wanted, latest: v.latest,
            major: String(v.current).split(".")[0] !== String(v.latest).split(".")[0],
          }));
          const majors = entries.filter(e => e.major);
          console.log("outdated: " + entries.length + ", major bumps: " + majors.length);
          console.log("::" + JSON.stringify({ outputs: { total: entries.length, majors: majors.length, details: majors.slice(0, 10) } }) + "::");
        '

  - id: check_majors
    type: io.kestra.plugin.core.flow.If
    description: Only interrupt the team when at least one major bump is pending — patch/minor drift gets logged.
    condition: "{{ outputs.npm_outdated.vars.majors > 0 }}"
    then:
      - id: post_digest
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: List the major bumps so the digest says which packages carry breaking-change risk.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":package: npm outdated digest for {{ inputs.repo_url }} ({{ inputs.subdirectory }}): {{ outputs.npm_outdated.vars.majors }} major bump(s) out of {{ outputs.npm_outdated.vars.total }} outdated packages. Review {{ inputs.subdirectory }}/package.json. Execution {{ execution.id }}."
          }
    else:
      - id: log_fresh
        type: io.kestra.plugin.core.log.Log
        description: Record the green week so stale weeks stand out in the execution history.
        message: "No major npm bumps pending for {{ inputs.repo_url }} ({{ inputs.subdirectory }}); {{ outputs.npm_outdated.vars.total }} outdated total."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the check itself fails — a broken audit must not look like a fresh dependency tree.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "npm outdated check FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.repo_url }}. Verify the repo URL and subdirectory input."
      }

outputs:
  - id: dependency_summary
    type: JSON
    description: 'Total outdated packages and major-bump count, e.g. {"total": 12, "majors": 3}.'
    value: "{{ outputs.npm_outdated.vars | toJson }}"

extend:
  title: Weekly npm Outdated Major-Bump Digest
  shortDescription: Runs npm outdated against your JS subtree and posts a Slack digest of packages with major-version upgrades.
  metaTitle: npm Outdated Dependency Digest
  metaDescription: Weekly npm outdated audit that highlights major-version dependency risk and posts a digest to Slack.
  description: |
    Dependabot sends a PR per package; nobody reads sixty of them. A weekly digest of what actually has a *major* bump pending is the signal you can act on. This blueprint clones your repo, runs `npm outdated` in a throwaway Node container, splits the results into major versus minor/patch drift, and posts the majors to Slack.

    ## How it works

    1. `npm_outdated` (`io.kestra.plugin.scripts.shell.Commands` on Docker) clones the repo, runs `npm outdated --json` in the subdirectory, and emits `total`, `majors`, and the first 10 major-bump details via the `::{"outputs": ...}::` protocol.
    2. `check_majors` (`io.kestra.plugin.core.flow.If`) branches: majors pending → `post_digest` lists the count and total to Slack; otherwise `log_fresh` records the green week.
    3. The `errors` block alerts Slack when the clone or npm call fails.
    4. Triggers: weekly `Schedule` (disabled by default) plus a `Webhook` for post-merge checks.

    ## What you get

    - One weekly message that separates breaking-risk upgrades from routine drift.
    - A dependency freshness trend in your execution history.
    - A `dependency_summary` JSON output for dashboards.

    ## Who it's for

    - Frontend teams drowning in Dependabot PRs.
    - Maintainers who only want to hear about majors.
    - Platform teams policing monorepo sub-packages.

    ## Why orchestrate this with Kestra

    `npm outdated` prints a table nobody reads. The flow turns it into a weekly, branched, alerted digest — and the next step (open a tracking issue, pin a Dependabot schedule, gate releases) is one task away.

    ## Prerequisites

    - A reachable git URL for your repo.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for the digest and failure alerts.

    ## Quick start

    1. Add the Slack webhook secret.
    2. Set `repo_url` and `subdirectory` (e.g. `ui`).
    3. Run once and read `dependency_summary`.
    4. Enable `weekly_digest`.

    ## How to extend

    - Add `npm audit --json` parsing for vulnerability counts.
    - Fan out over multiple subdirectories with a `ForEach`.
    - Store `dependency_summary` in KV and alert only on growth.

    ## Links

    - [npm outdated docs](https://docs.npmjs.com/cli/commands/npm-outdated)
    - [Kestra Slack incoming webhook](https://kestra.io/plugins/notifications/slack)
    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - Developer Tools
    - Security
  subTags:
    - Dependencies
    - Supply Chain
  ee: false
  demo: false
