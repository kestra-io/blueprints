id: qdrant-vector-collection-snapshot-and-gcs-backup
namespace: company.ai

inputs:
  - id: qdrant_cluster_url
    type: STRING
    displayName: Qdrant Cluster URL
    required: true
    defaults: "https://qdrant-prod.internal.net:6333"
    description: "The HTTP endpoint of your Qdrant vector database instance."

  - id: collection_name
    type: STRING
    displayName: Collection Name
    required: true
    defaults: "enterprise-knowledge-base"
    description: "The vector collection to snapshot and archive."

  - id: gcs_bucket_name
    type: STRING
    displayName: Google Cloud Storage Bucket Name
    required: true
    defaults: "company-vector-db-backups"
    description: "Target Google Cloud Storage bucket destination for disaster recovery."

tasks:
  - id: log_backup_commencement
    type: io.kestra.plugin.core.log.Log
    message: "📦 Starting Qdrant snapshot backup for collection '{{ inputs.collection_name }}' to bucket '{{ inputs.gcs_bucket_name }}'"

  - id: create_collection_snapshot
    type: io.kestra.plugin.core.http.Request
    description: "Trigger Qdrant REST API to create an immutable point-in-time collection snapshot"
    uri: "{{ inputs.qdrant_cluster_url }}/collections/{{ inputs.collection_name }}/snapshots"
    method: POST
    headers:
      api-key: "{{ secret('QDRANT_API_KEY') }}"
      Content-Type: "application/json"
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: parse_snapshot_metadata
    type: io.kestra.plugin.scripts.python.Script
    description: "Extract snapshot name and archive size for audit telemetry"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    dependencies:
      - kestra
    inputFiles:
      snapshot_response.json: "{{ outputs.create_collection_snapshot.body }}"
    script: |
      import json
      from kestra import Kestra

      with open("snapshot_response.json") as f:
          data = json.load(f)

      result = data.get("result", {})
      snapshot_name = result.get("name", "unknown_snapshot")
      snapshot_size_bytes = result.get("size", 0)

      Kestra.outputs({
          "snapshot_name": snapshot_name,
          "snapshot_size_mb": round(snapshot_size_bytes / (1024 * 1024), 2)
      })

  - id: download_snapshot_archive
    type: io.kestra.plugin.core.http.Download
    description: "Stream the binary snapshot archive directly into Kestra internal storage"
    uri: "{{ inputs.qdrant_cluster_url }}/collections/{{ inputs.collection_name }}/snapshots/{{ outputs.parse_snapshot_metadata.vars.snapshot_name }}"
    headers:
      api-key: "{{ secret('QDRANT_API_KEY') }}"

  - id: upload_snapshot_to_gcs
    type: io.kestra.plugin.gcp.gcs.Upload
    description: "Persist the vector snapshot archive into Google Cloud Storage for disaster recovery"
    from: "{{ outputs.download_snapshot_archive.uri }}"
    to: "gs://{{ inputs.gcs_bucket_name }}/qdrant/{{ inputs.collection_name }}/{{ outputs.parse_snapshot_metadata.vars.snapshot_name }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT_JSON') }}"

  - id: notify_backup_success
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Broadcast snapshot backup completion to AI platform channel"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "blocks": [
          {
            "type": "header",
            "text": {
              "type": "plain_text",
              "text": "📦 Qdrant Snapshot Archived to GCS",
              "emoji": true
            }
          },
          {
            "type": "section",
            "fields": [
              {
                "type": "mrkdwn",
                "text": "*Collection:* `{{ inputs.collection_name }}`"
              },
              {
                "type": "mrkdwn",
                "text": "*Snapshot Size:* `{{ outputs.parse_snapshot_metadata.vars.snapshot_size_mb }} MB`"
              },
              {
                "type": "mrkdwn",
                "text": "*Archive:* `{{ outputs.parse_snapshot_metadata.vars.snapshot_name }}`"
              },
              {
                "type": "mrkdwn",
                "text": "*Destination:* `gs://{{ inputs.gcs_bucket_name }}`"
              }
            ]
          }
        ]
      }

errors:
  - id: alert_backup_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Emergency notification if vector backup pipeline fails"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "🚨 *Vector Backup Failed:* Execution `{{ execution.id }}` failed to snapshot or upload collection `{{ inputs.collection_name }}`."
      }

triggers:
  - id: nightly_backup_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"
    disabled: true

extend:
  title: Qdrant Vector Collection Snapshot and Google Cloud Storage Backup
  metaTitle: Qdrant Vector Snapshot to GCS Backup with Slack Notifications | Kestra
  shortDescription: Create point-in-time snapshots of Qdrant vector collections and archive them to Google Cloud Storage with Slack alerts.
  metaDescription: Snapshot Qdrant vector database collections via REST API, stream archives to GCS buckets, and broadcast status cards to Slack.
  description: |
    Generative AI and RAG applications rely heavily on vector databases like Qdrant for semantic search and embeddings storage. Corrupted collections or cluster outages can severely disrupt AI applications. This blueprint automates disaster recovery for Qdrant by triggering point-in-time collection snapshots via the Qdrant REST API, streaming the binary archive to Kestra internal storage, and persisting it to Google Cloud Storage (GCS) with automated Slack completion alerts.

    ## How it works

    1. **Inputs & Configuration**: Accepts the Qdrant cluster URL, target collection name, and destination Google Cloud Storage bucket.
    2. **Snapshot Creation**: The `create_collection_snapshot` task (`io.kestra.plugin.core.http.Request`) triggers an immutable snapshot via Qdrant's `/snapshots` API with retries.
    3. **Metadata Extraction**: The `parse_snapshot_metadata` task (`io.kestra.plugin.scripts.python.Script`) extracts the generated filename and file size in megabytes using `Kestra.outputs()`.
    4. **Streaming Download**: The `download_snapshot_archive` task (`io.kestra.plugin.core.http.Download`) streams the binary snapshot archive directly into Kestra internal storage without requiring local worker disk allocation.
    5. **GCS Cold Archive**: The `upload_snapshot_to_gcs` task (`io.kestra.plugin.gcp.gcs.Upload`) moves the archive to the target GCS bucket under a partitioned folder structure.
    6. **Slack Status Broadcast**: Dispatches an incident-ready backup summary card to Slack via `notify_backup_success` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
    7. **Pipeline Resilience**: An `errors` handler ensures immediate alerting if snapshot generation or GCS upload fails.

    ## What you get

    - Automated disaster recovery pipelines for mission-critical RAG and vector collections.
    - Zero glue-code binary file streaming between Qdrant and cloud object storage.
    - Full execution lineage, size audit metrics, and Slack delivery notifications.
    - A scheduled nightly trigger ready to be enabled.

    ## Who it's for

    - AI Platform Engineers and SREs maintaining production vector search infrastructure.
    - MLOps teams managing large-scale Qdrant embeddings clusters.
    - Data platform teams seeking automated compliance and backup verification.

    ## Why orchestrate this with Kestra

    Kestra natively handles HTTP authentication, binary file streaming across task boundaries without temporary disk leaks, GCP service account secret masking, and multi-channel notifications in declarative YAML.

    ## Prerequisites

    - A running Qdrant cluster (cloud or self-hosted) with API key access.
    - A Google Cloud Platform (GCP) project with a Cloud Storage bucket and a service account JSON key.
    - A Slack Incoming Webhook URL.

    ### Secrets

    - `QDRANT_API_KEY`: API key for Qdrant cluster authentication.
    - `GCP_SERVICE_ACCOUNT_JSON`: Service account JSON key with `Storage Object Admin` permissions.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for backup announcements.

    ## Quick start

    1. Configure `QDRANT_API_KEY`, `GCP_SERVICE_ACCOUNT_JSON`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Execute this flow with your Qdrant endpoint and collection name.
    3. Verify that the snapshot file appears in your Google Cloud Storage bucket.
    4. Enable the `nightly_backup_schedule` trigger for scheduled disaster recovery.

    ## How to extend

    - Add lifecycle retention tasks to automatically prune backups older than 30 days in GCS.
    - Add AWS S3 or Azure Blob Storage fallback tasks for multi-cloud redundancy.
    - Chain a downstream vector search health-check flow to verify collection index integrity after backup.

    ## Links

    - [Qdrant Snapshot API Documentation](https://qdrant.tech/documentation/concepts/snapshots/)
    - [Kestra GCP GCS Plugin](https://kestra.io/plugins/plugin-gcp/io.kestra.plugin.gcp.gcs.upload)
    - [Kestra HTTP Download Plugin](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.download)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - AI
    - Cloud
  subTags:
    - Vector Databases & Embeddings
    - Backup & Disaster Recovery
  ee: false
  demo: false
