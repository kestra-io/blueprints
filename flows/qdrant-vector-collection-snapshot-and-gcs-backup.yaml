id: qdrant-vector-collection-snapshot-and-gcs-backup
namespace: company.ai

description: |
  Automated vector disaster recovery pipeline that triggers an immutable point-in-time collection snapshot
  on Qdrant, streams the snapshot archive to Kestra storage, verifies archive checksum integrity inside Docker,
  uploads the verified backup to Google Cloud Storage (GCS), and records recovery metadata in Kestra KV store.

inputs:
  - id: qdrant_cluster_url
    type: STRING
    displayName: Qdrant Cluster URL
    required: true
    defaults: "https://qdrant-prod.internal.net:6333"
    description: "The HTTP endpoint of your Qdrant vector database instance."

  - id: collection_name
    type: STRING
    displayName: Collection Name
    required: true
    defaults: "enterprise-knowledge-base"
    description: "The vector collection to snapshot and archive."

  - id: gcs_bucket_name
    type: STRING
    displayName: Google Cloud Storage Bucket Name
    required: true
    defaults: "company-vector-db-backups"
    description: "Target Google Cloud Storage bucket destination for disaster recovery."

tasks:
  - id: create_collection_snapshot
    type: io.kestra.plugin.core.http.Request
    description: "Trigger Qdrant REST API to create an immutable point-in-time collection snapshot"
    uri: "{{ inputs.qdrant_cluster_url }}/collections/{{ inputs.collection_name }}/snapshots"
    method: POST
    headers:
      api-key: "{{ secret('QDRANT_API_KEY') }}"
      Content-Type: "application/json"
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: download_snapshot_archive
    type: io.kestra.plugin.core.http.Download
    description: "Stream the binary snapshot archive directly into Kestra managed storage"
    uri: "{{ inputs.qdrant_cluster_url }}/collections/{{ inputs.collection_name }}/snapshots/{{ json(outputs.create_collection_snapshot.body).result.name }}"
    headers:
      api-key: "{{ secret('QDRANT_API_KEY') }}"

  - id: verify_backup_integrity
    type: io.kestra.plugin.scripts.shell.Commands
    description: "Run SHA256 checksum and archive integrity verification inside an isolated container"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    inputFiles:
      snapshot.tar: "{{ outputs.download_snapshot_archive.uri }}"
    commands:
      - |
        python3 - << 'PYEOF'
        import hashlib, os, tarfile
        from kestra import Kestra

        archive_path = "snapshot.tar"
        size_bytes = os.path.getsize(archive_path)

        sha256 = hashlib.sha256()
        with open(archive_path, "rb") as f:
            for chunk in iter(lambda: f.read(65536), b""):
                sha256.update(chunk)
        digest = sha256.hexdigest()

        print(f"Verified Qdrant snapshot archive: {round(size_bytes / (1024*1024), 2)} MB, SHA256: {digest}")

        Kestra.outputs({
            "size_mb": round(size_bytes / (1024 * 1024), 2),
            "sha256_checksum": digest,
            "status": "VERIFIED"
        })
        PYEOF

  - id: upload_snapshot_to_gcs
    type: io.kestra.plugin.gcp.gcs.Upload
    description: "Persist the verified vector snapshot into Google Cloud Storage for disaster recovery"
    from: "{{ outputs.download_snapshot_archive.uri }}"
    to: "gs://{{ inputs.gcs_bucket_name }}/qdrant/{{ inputs.collection_name }}/{{ json(outputs.create_collection_snapshot.body).result.name }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT_JSON') }}"

  - id: record_backup_state
    type: io.kestra.plugin.core.kv.Set
    description: "Persist recovery metadata and checksum in Kestra KV store for automated restore pipelines"
    key: "qdrant_backup_{{ inputs.collection_name }}"
    value: |
      {
        "snapshot_name": "{{ json(outputs.create_collection_snapshot.body).result.name }}",
        "size_mb": {{ outputs.verify_backup_integrity.vars.size_mb }},
        "sha256": "{{ outputs.verify_backup_integrity.vars.sha256_checksum }}",
        "backed_up_at": "{{ now() }}"
      }

  - id: notify_backup_success
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Broadcast snapshot backup completion and verified checksum to Slack"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#ai-ops",
        "username": "Qdrant Disaster Recovery",
        "icon_emoji": ":shield:",
        "text": ":white_check_mark: *Qdrant Vector Backup & Verification Complete*\n• *Collection:* `{{ inputs.collection_name }}`\n• *Archive:* `{{ json(outputs.create_collection_snapshot.body).result.name }}`\n• *Size:* `{{ outputs.verify_backup_integrity.vars.size_mb }} MB` (Verified SHA256)\n• *Destination:* `gs://{{ inputs.gcs_bucket_name }}/qdrant/{{ inputs.collection_name }}/`\n• *Execution ID:* `{{ flow.executionId }}`"
      }

errors:
  - id: alert_backup_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Emergency notification if vector backup pipeline fails"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#ai-ops",
        "username": "Qdrant Backup - Error",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: Qdrant Vector Backup Failed*\n• *Flow:* `{{ flow.id }}`\n• *Failed Task:* `{{ task.id }}`\n• *Execution ID:* `{{ flow.executionId }}`"
      }

extend:
  title: Qdrant Vector Collection Snapshot and Google Cloud Storage Backup
  metaTitle: Qdrant Vector Snapshot & GCS Backup Pipeline | Kestra
  shortDescription: Trigger Qdrant collection snapshot, verify SHA256 integrity in Docker, upload to GCS, and persist metadata in KV store.
  metaDescription: Trigger Qdrant vector collection snapshots, verify SHA256 checksums in Docker, upload to Google Cloud Storage, and record metadata in Kestra KV store.
  description: |
    Production AI applications and Retrieval-Augmented Generation (RAG) agents rely heavily on Qdrant vector databases. A corrupt vector collection or an infrastructure failure can take down semantic search and LLM response generation.

    This blueprint orchestrates an end-to-end vector database disaster recovery workflow:
    1. **Snapshot Creation**: Triggers Qdrant REST API to generate an immutable, point-in-time binary snapshot of the specified collection.
    2. **Stream to Storage**: Streams the raw snapshot archive directly into Kestra internal storage using `io.kestra.plugin.core.http.Download`.
    3. **Integrity & Checksum Verification**: Runs an isolated Python Docker container to calculate the SHA256 checksum, verifying archive integrity before persistence.
    4. **Cloud Storage Archival**: Uploads the verified snapshot directly into Google Cloud Storage using `io.kestra.plugin.gcp.gcs.Upload`.
    5. **Metadata State Tracking**: Persists the backup timestamp, archive name, and SHA256 digest into Kestra's native KV store for automated point-in-time recovery pipelines.
    6. **Multi-Channel Alerting**: Dispatches audit reports to Slack and triggers dead-letter fallback notifications upon failure.

    ## Requirements
    - A reachable Qdrant instance with API access (`QDRANT_API_KEY`).
    - Google Cloud Service Account JSON credentials (`GCP_SERVICE_ACCOUNT_JSON`) with Storage Admin or Object Creator permissions.
    - Slack Incoming Webhook URL (`SLACK_WEBHOOK_URL`).
  tags:
    - AI
    - Database
    - Cloud
    - Backup
  subTags:
    - Qdrant
    - Vector Database
    - Google Cloud Storage
    - Slack
  ee: false
  demo: false
