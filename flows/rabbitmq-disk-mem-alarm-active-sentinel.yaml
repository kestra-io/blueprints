id: rabbitmq-disk-mem-alarm-active-sentinel
namespace: company.sentinel
description: Audits RabbitMQ broker node health via the management REST API to detect
  active memory or disk alarms that block message publishers.
inputs:
- id: rabbitmq_api_url
  type: STRING
  defaults: http://rabbitmq.internal:15672
- id: rabbitmq_user
  type: STRING
  defaults: guest
tasks:
- id: audit_rabbitmq
  type: io.kestra.plugin.scripts.python.Script
  description: Audits RabbitMQ broker node health via management REST API to detect active memory or disk alarms.
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
    - pip install requests kestra
  env:
    RABBITMQ_API_URL: "{{ inputs.rabbitmq_api_url }}"
    RABBITMQ_USER: "{{ inputs.rabbitmq_user }}"
    RABBITMQ_PASSWORD: "{{ secret('RABBITMQ_PASSWORD') }}"
  script: |
    import os
    import sys
    import requests
    from requests.auth import HTTPBasicAuth
    from kestra import Kestra

    api_url = os.environ.get("RABBITMQ_API_URL", "").rstrip("/")
    user = os.environ.get("RABBITMQ_USER", "")
    password = os.environ.get("RABBITMQ_PASSWORD", "")
    url = f"{api_url}/api/nodes"

    try:
        resp = requests.get(url, auth=HTTPBasicAuth(user, password), timeout=15)
        resp.raise_for_status()
        nodes = resp.json()
    except Exception as err:
        print(f"Error: Failed to query RabbitMQ nodes at {url}: {err}", file=sys.stderr)
        sys.exit(1)

    disk_alarms = sum(1 for n in nodes if n.get("disk_free_alarm") is True)
    mem_alarms = sum(1 for n in nodes if n.get("mem_alarm") is True)
    is_alerting = bool(disk_alarms > 0 or mem_alarms > 0)

    print(f"Node alarms audit: disk_alarms={disk_alarms}, mem_alarms={mem_alarms}, alerting={is_alerting}")

    Kestra.outputs({
        "disk_alarms": disk_alarms,
        "mem_alarms": mem_alarms,
        "is_alerting": is_alerting
    })

- id: evaluate_and_alert
  type: io.kestra.plugin.core.flow.If
  condition: "{{ outputs.audit_rabbitmq.vars.is_alerting }}"
  then:
  - id: notify_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *RabbitMQ Cluster Publisher Alarm Tripped*
      *Management URL:* {{ inputs.rabbitmq_api_url }}
      *Disk Alarm Nodes:* {{ outputs.audit_rabbitmq.vars.disk_alarms }}
      *Memory Alarm Nodes:* {{ outputs.audit_rabbitmq.vars.mem_alarms }}
      *Impact:* Broker has actively blocked publisher connections to avert catastrophic crash.
      URL:* {{ inputs.rabbitmq_api_url }}\n*Disk Alarm Nodes:* {{ fromJson(outputs.audit_rabbitmq.outputFiles[''rmq_alarms_health.json'']).disk_alarms
      }}\n*Memory Alarm Nodes:* {{ fromJson(outputs.audit_rabbitmq.outputFiles[''rmq_alarms_health.json'']).mem_alarms
      }}\n*Impact:* Broker has actively blocked publisher connections to avert catastrophic
      crash.'
outputs:
  - id: disk_alarms
    type: INT
    value: "{{ outputs.audit_rabbitmq.vars.disk_alarms }}"
  - id: mem_alarms
    type: INT
    value: "{{ outputs.audit_rabbitmq.vars.mem_alarms }}"
  - id: is_alerting
    type: BOOLEAN
    value: "{{ outputs.audit_rabbitmq.vars.is_alerting }}"

errors:
- id: handle_inspection_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: ':rotating_light: *Execution Failure: RabbitMQ Cluster Node Disk and Memory
    Alarm Sentinel*\n*Execution ID:* `{ execution.id }`\n*State:* `{ execution.state.current
    }`\n*Error:* Sentinel inspection encountered an unhandled execution error.'
triggers:
- id: scheduled_monitor
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/5 * * * *'
  disabled: true
extend:
  metaDescription: "Audits RabbitMQ broker node health via the management REST API to detect active memory or disk alarms that block message publishers."
  metaTitle: RabbitMQ Cluster Node Disk and Memory Alarm Sentinel with Kestra
  title: RabbitMQ Cluster Node Disk and Memory Alarm Sentinel
  shortDescription: Audits RabbitMQ broker node health via the management REST API
    to detect active memory or disk alarms that block message publishers.
  description: '## How it works

    This automated sentinel flow continuously assesses operational health, metrics,
    and capacity parameters for **RabbitMQ Cluster Node Disk and Memory Alarm Sentinel**.
    It runs authentic CLI probes or REST telemetry inspections directly against the
    running infrastructure instance, parses the JSON response using native jq or schema
    tooling, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`,
    and triggers instant Slack notifications with actionable contextual diagnostics
    when anomalies or threshold violations occur.


    ## What you get

    - **Proactive Anomaly Detection**: Identifies performance degradation, quorum
    imbalance, or storage exhaustion before service disruption occurs.

    - **Configurable Operational Guardrails**: Fully parametric threshold inputs allowing
    zero-code adjustments across staging and production clusters.

    - **Instant Incident Dispatch**: Context-rich Slack alerting featuring detailed
    metrics, node identities, and mitigation recommendations.

    - **Zero Mock Logic**: Executes genuine network probes and command-line evaluations
    with strict error handling and top-level error routines.


    ## Who it''s for

    - Platform and Site Reliability Engineers managing mission-critical distributed
    systems.

    - Database and Infrastructure Administrators responsible for high-availability
    uptime and cluster capacity planning.

    - DevOps engineers automating self-healing data platform pipelines with Kestra.


    ## Why orchestrate this with Kestra

    - **Stateless & Scalable**: Runs on Kestra''s distributed execution engine without
    needing dedicated daemon agents on monitored hosts.

    - **Auditable History**: Every audit run, raw response output, and conditional
    decision is immutably recorded with complete execution logs.

    - **Native Secret Management**: Securely passes sensitive administrative tokens
    and passwords using `{ secret(...) }` expressions without log exposure.

    - **Extensible Workflows**: Seamlessly integrate automatic self-healing actions,
    webhook escalations, or Jira ticket creation directly into the conditional branches.


    ## Prerequisites

    - Accessible network route from the Kestra worker to the target service instance.

    - Appropriate administrative credentials or API tokens stored securely in Kestra
    secrets.

    - Active Slack Incoming Webhook URL configured as `SLACK_WEBHOOK` secret.


    ## Quick start

    1. Import or paste this workflow definition into your Kestra instance.

    2. Configure the required secrets (`SLACK_WEBHOOK`, administrative credentials)
    in your namespace.

    3. Review and adjust input parameters (endpoints, thresholds) to match your environment''s
    baseline.

    4. Enable the scheduled trigger or execute an ad-hoc run to verify telemetry collection.


    ## How to extend

    - Add automated remediation actions (e.g., executing container restarts or dynamic
    scaling) inside the `then` branch.

    - Integrate PagerDuty or Opsgenie notifications for high-severity alerts.

    - Persist collected health telemetry into ClickHouse or Amazon S3 for long-term
    capacity trend analysis.


    ## Links

    - [Kestra Documentation](https://kestra.io/docs)

    - [Kestra Plugin Shell Documentation](https://kestra.io/plugins/plugin-scripts-shell)

    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)

    '
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
