    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [GlusterFS Official Documentation and Volume Architecture Guide](https://docs.gluster.org/en/latest/)
    - [GlusterFS Self-Heal and Split-Brain Resolution Manual](https://docs.gluster.org/en/latest/Administrator-Guide/Split-brain-and-ways-to-deal-with-it/)
    - [Prometheus GlusterFS Exporter Reference](https://github.com/gluster/gluster-prometheus)
