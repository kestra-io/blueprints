id: grafana-deployment-annotation-marker
namespace: company.sre

inputs:
  - id: service_name
    type: STRING
    displayName: Service Name
    description: Name of the microservice or application being deployed (e.g. checkout-api, auth-service).
    defaults: checkout-api

  - id: environment
    type: STRING
    displayName: Deployment Environment
    description: Target deployment tier (e.g. production, staging, canary).
    defaults: production

  - id: version
    type: STRING
    displayName: Release Version
    description: Application version or release tag (e.g. v2.4.0).
    defaults: v2.4.0

  - id: commit_sha
    type: STRING
    displayName: Git Commit SHA
    description: Short or full Git commit hash corresponding to the deployed release.
    defaults: 7f9b1c2

  - id: deployed_by
    type: STRING
    displayName: Deployed By
    description: User, pipeline, or bot initiating the deployment (e.g. github-actions, argo-cd, john.doe).
    defaults: github-actions

  - id: dashboard_uid
    type: STRING
    displayName: Dashboard UID (Optional)
    description: UID of a specific Grafana dashboard to scope the annotation to. Leave empty to annotate globally across all dashboards.
    defaults: ""

  - id: release_notes
    type: STRING
    displayName: Release Summary
    description: Brief description or changelog summary for this deployment.
    defaults: Scaled database pool and optimized checkout query performance.

  - id: notify_slack
    type: BOOL
    displayName: Notify Slack
    description: Send a deployment confirmation message with direct Grafana dashboard link to Slack. Requires SLACK_WEBHOOK_URL secret.
    defaults: true

concurrency:
  limit: 5

triggers:
  - id: deployment_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Webhook endpoint called by CI/CD pipelines (GitHub Actions, GitLab CI, ArgoCD post-sync) immediately after a rollout succeeds.
    key: deploy-marker

tasks:
  - id: build_annotation_payload
    type: io.kestra.plugin.scripts.python.Script
    description: Format release metadata, compute millisecond epoch timestamp, and construct the Grafana annotations API request payload.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install --no-cache-dir kestra
    script: |
      import json
      import time
      from kestra import Kestra

      # Current epoch time in milliseconds for Grafana annotation
      epoch_ms = int(time.time() * 1000)

      service = "{{ inputs.service_name }}"
      env = "{{ inputs.environment }}"
      version = "{{ inputs.version }}"
      sha = "{{ inputs.commit_sha }}"
      author = "{{ inputs.deployed_by }}"
      notes = """{{ inputs.release_notes }}""".strip()
      dashboard_uid = "{{ inputs.dashboard_uid }}".strip()

      tags = ["deployment", env, service, version]

      # Text rendered inside the Grafana annotation popup
      annotation_text = (
          f"<b>Deployment: {service} ({version})</b><br/>"
          f"• Environment: <code>{env}</code><br/>"
          f"• Commit: <code>{sha}</code><br/>"
          f"• Deployer: {author}<br/>"
          f"• Notes: {notes}"
      )

      payload = {
          "text": annotation_text,
          "tags": tags,
          "time": epoch_ms,
          "timeEnd": epoch_ms
      }

      if dashboard_uid:
          payload["dashboardUID"] = dashboard_uid

      payload_str = json.dumps(payload)
      print("Generated Grafana annotation payload:")
      print(payload_str)

      Kestra.outputs({
          "epoch_ms": epoch_ms,
          "payload_json": payload_str,
          "annotation_text": annotation_text
      })

  - id: post_grafana_annotation
    type: io.kestra.plugin.core.http.Request
    description: Send HTTP POST request to Grafana Annotations API to write the deployment event marker onto metric panels.
    uri: "{{ secret('GRAFANA_URL') }}/api/annotations"
    method: POST
    contentType: application/json
    headers:
      Authorization: "Bearer {{ secret('GRAFANA_API_TOKEN') }}"
    body: "{{ outputs.build_annotation_payload.vars.payload_json }}"

  - id: evaluate_post_response
    type: io.kestra.plugin.core.flow.If
    description: Check Grafana API response code and trigger Slack confirmation or incident escalation accordingly.
    condition: "{{ outputs.post_grafana_annotation.status >= 200 and outputs.post_grafana_annotation.status < 300 }}"
    then:
      - id: log_annotation_success
        type: io.kestra.plugin.core.log.Log
        description: Log successful creation of Grafana deployment annotation.
        message: >-
          Grafana deployment annotation created successfully for '{{ inputs.service_name }}' ({{ inputs.version }}) in {{ inputs.environment }}.
          Response Status: {{ outputs.post_grafana_annotation.status }}, Body: {{ outputs.post_grafana_annotation.body }}.

      - id: notify_slack_success
        type: io.kestra.plugin.core.flow.If
        description: Post deployment marker card to Slack channel if notification is enabled.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: slack_success_alert
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Send rich Slack notification card with direct dashboard navigation context.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "Deployment Marked in Grafana: `{{ inputs.service_name }}` (`{{ inputs.version }}`)\n• Environment: `{{ inputs.environment }}`\n• Commit SHA: `{{ inputs.commit_sha }}`\n• Deployed By: {{ inputs.deployed_by }}\n• Notes: {{ inputs.release_notes }}\n• Grafana URL: {{ secret('GRAFANA_URL') }}\nExecution: {{ execution.id }}"
              }
    else:
      - id: notify_slack_failure
        type: io.kestra.plugin.core.flow.If
        description: Alert Slack if Grafana rejected the annotation payload.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: slack_failure_alert
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Post Grafana API failure alert to Slack.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "Failed to create Grafana deployment annotation for `{{ inputs.service_name }}`! HTTP Status: {{ outputs.post_grafana_annotation.status }}. Body: {{ outputs.post_grafana_annotation.body }}. Execution {{ execution.id }}."
              }

      - id: fail_execution
        type: io.kestra.plugin.core.execution.Fail
        description: Terminate workflow as failed when Grafana API returns a non-2xx status code.
        errorMessage: "Grafana Annotations API returned status {{ outputs.post_grafana_annotation.status }}: {{ outputs.post_grafana_annotation.body }}."

errors:
  - id: on_pipeline_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Catch unhandled network timeouts, bad secrets, or connectivity failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Unexpected error in Grafana deployment marker flow `{{ flow.id }}` for service `{{ inputs.service_name }}` (Execution `{{ execution.id }}`). Check worker network logs."
      }

outputs:
  - id: annotation_response
    type: JSON
    description: Raw response payload from the Grafana Annotations REST API.
    value: "{{ outputs.post_grafana_annotation.body }}"
  - id: http_status
    type: INT
    description: HTTP response status code returned by Grafana.
    value: "{{ outputs.post_grafana_annotation.status }}"
  - id: timestamp_millis
    type: INT
    description: Millisecond Unix epoch timestamp assigned to the annotation.
    value: "{{ outputs.build_annotation_payload.vars.epoch_ms }}"

extend:
  title: Deployment Marker & Grafana Dashboard Annotation Trigger
  shortDescription: Post deployment annotation markers to Grafana dashboards via CI/CD webhook and notify Slack with direct dashboard links.
  metaTitle: Grafana Deployment Annotations with Kestra
  metaDescription: Automatically post deployment annotation markers to Grafana dashboards via webhook and notify Slack with direct links for faster incident triage.
  description: |
    When a production outage or latency spike occurs, the first question on-call engineers ask is: *"Did someone just deploy something?"*

    Correlating deployments and configuration changes with metrics (CPU spikes, memory leaks, HTTP 5xx error rates) is an essential Site Reliability Engineering (SRE) practice. Without markers on your dashboards, responders must manually cross-reference release logs, Git commits, and CI/CD runs while the clock is ticking.

    This blueprint provides an automated deployment marker gateway:
    - Exposes an event-driven **Webhook** endpoint ready to be called by any CI/CD pipeline (GitHub Actions, GitLab CI, ArgoCD post-sync hooks, or Jenkins).
    - Formats deployment context (service name, version tag, commit SHA, deployer, release notes) into Grafana's native annotation format.
    - Writes the vertical event marker directly into Grafana metric panels using the Grafana REST API (`POST /api/annotations`).
    - Validates API delivery and delivers an announcement to Slack containing deployment metadata and dashboard links.

    ## How it works

    1. `deployment_webhook` listens for incoming HTTP POST events containing release metadata payload (`service_name`, `environment`, `version`, `commit_sha`).
    2. `build_annotation_payload` (`io.kestra.plugin.scripts.python.Script` on `python:3.11-slim`) calculates millisecond Unix timestamps, structures Grafana tags (`deployment`, environment, service), and formats HTML tooltips for dashboard popups.
    3. `post_grafana_annotation` (`io.kestra.plugin.core.http.Request`) submits the payload to `{{ secret('GRAFANA_URL') }}/api/annotations` authenticated with a Grafana Service Account token.
    4. `evaluate_post_response` (`io.kestra.plugin.core.flow.If`) inspects the HTTP response status:
       - On `200/201`: Logs success, captures the annotation ID, and sends a Slack card to the team.
       - On error: Alerts Slack with the HTTP error code and fails the execution via `Fail`.
    5. An `errors` block catches unexpected worker failures or connectivity issues.

    ## What you get

    - **Instant Triage Context**: SREs immediately see vertical markers on latency and error rate charts indicating the exact moment of rollout.
    - **Global or Dashboard-Specific Scoping**: Annotate globally across all dashboards or target a specific dashboard UID.
    - **Universal CI/CD Compatibility**: Plugs cleanly into `curl` steps in GitHub Actions, GitLab CI, ArgoCD, or Kubernetes lifecycle hooks.
    - **Zero Credential Exposure**: Tokens and webhook URLs remain secured inside Kestra namespace secrets.

    ## Prerequisites

    - A running Grafana instance (v8.0+ OSS, Enterprise, or Grafana Cloud).
    - A Grafana Service Account token with `Annotations: Writer` or `Editor` role.
    - An incoming Slack webhook URL for notifications.

    ### Secrets

    - `GRAFANA_URL`: Base URL of your Grafana server (e.g. `https://grafana.example.com` or `https://org.grafana.net`).
    - `GRAFANA_API_TOKEN`: Service Account token generated from Grafana (`Administration -> Users and access -> Service accounts`).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start

    1. Add `GRAFANA_URL`, `GRAFANA_API_TOKEN`, and `SLACK_WEBHOOK_URL` to your Kestra namespace secrets.
    2. Retrieve the Webhook URL from the Kestra UI under the `deployment_webhook` trigger tab.
    3. Add a step in your CI/CD pipeline (e.g. GitHub Actions) to call the webhook:
       ```bash
       curl -X POST "https://kestra.example.com/api/v1/executions/webhook/company.sre/grafana-deployment-annotation-marker/deploy-marker" \
         -H "Content-Type: application/json" \
         -d '{
           "service_name": "checkout-api",
           "environment": "production",
           "version": "v2.4.0",
           "commit_sha": "${{ github.sha }}",
           "deployed_by": "${{ github.actor }}",
           "release_notes": "Database connection optimization"
         }'
       ```
    4. Check your Grafana dashboard to see the vertical deployment annotation line appear on all panels.

    ## How to extend

    - **Grafana Cloud Alerting Silence**: Pair the annotation with a temporary alert silence during scheduled deployment maintenance windows.
    - **Rollback Markers**: Add an input flag `is_rollback: true` to color-code rollback markers distinctly (e.g. red tag vs green tag).
    - **Datadog / New Relic Fanout**: Extend the flow to publish markers simultaneously to multiple APM tools using `io.kestra.plugin.core.flow.Parallel`.

    ## Links

    - [Grafana Annotations HTTP API Documentation](https://grafana.com/docs/grafana/latest/developers/http_api/annotations/)
    - [Kestra HTTP Request Plugin](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Webhook Trigger Documentation](https://kestra.io/docs/workflow-components/triggers/webhook-trigger)

    - This blueprint has been created by [community-contributor](https://github.com/kestra-io/blueprints)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - CI/CD & Deployment
  ee: false
  demo: false
