id: vllm-gpu-cache-exhaustion-and-preemption-sentinel
namespace: company.ai

description: Monitor vLLM inference clusters for GPU KV-cache saturation, request queue buildup, and preemption thrashing before inference latency degrades.

triggers:
  - id: periodic_vllm_health_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic health audit of vLLM inference engine telemetry. Shipped disabled by default.
    cron: "*/5 * * * *"
    disabled: true

  - id: on_demand_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Trigger an on-demand audit from Kubernetes HPA, Prometheus Alertmanager, or MLOps pipelines.
    key: vllm-cache-audit

inputs:
  - id: vllm_metrics_url
    type: STRING
    displayName: vLLM Prometheus Metrics Endpoint
    defaults: "http://localhost:8000/metrics"
    description: Full URL to the vLLM Prometheus /metrics endpoint.
  - id: vllm_health_url
    type: STRING
    displayName: vLLM Health Check Endpoint
    defaults: "http://localhost:8000/health"
    description: Full URL to the vLLM liveness /health endpoint.
  - id: kv_cache_threshold_percent
    type: INT
    displayName: GPU KV-Cache Saturation Threshold (%)
    defaults: 85
    description: Warning threshold for GPU KV-cache usage factor percentage.
  - id: max_waiting_requests_threshold
    type: INT
    displayName: Max Waiting Requests Queue Threshold
    defaults: 5
    description: Maximum allowable requests queued waiting for GPU memory allocation.
  - id: alert_on_any_preemptions
    type: BOOL
    displayName: Alert on Any Preemption Event
    defaults: true
    description: Flag an alert whenever cumulative preemptions increase, indicating VRAM thrashing.

tasks:
  - id: check_vllm_health
    type: io.kestra.plugin.core.http.Request
    description: Verify vLLM server liveness and responsiveness before scraping metrics.
    uri: "{{ inputs.vllm_health_url }}"
    method: GET
    timeout: PT10S

  - id: fetch_vllm_metrics
    type: io.kestra.plugin.core.http.Request
    description: Query vLLM Prometheus metrics endpoint to inspect PagedAttention KV-cache and queue state.
    uri: "{{ inputs.vllm_metrics_url }}"
    method: GET
    timeout: PT15S
    headers:
      Accept: "text/plain"

  - id: audit_vllm_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Parse and evaluate vLLM Prometheus metrics against SLA thresholds.
    containerImage: python:3.11-slim
    inputFiles:
      metrics.txt: "{{ outputs.fetch_vllm_metrics.body }}"
    script: |
      import re
      import json

      with open("metrics.txt", "r") as f:
          raw_text = f.read()

      metrics = {}
      for line in raw_text.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          m = re.match(r"^([a-zA-Z0-9_:]+)(?:\{([^}]*)\})?\s+([0-9\.eE+-]+)$", line)
          if m:
              name, labels, val = m.groups()
              try:
                  metrics[name] = float(val)
              except ValueError:
                  pass

      gpu_cache_factor = metrics.get("vllm:gpu_cache_usage_factor", 0.0)
      gpu_cache_percent = round(gpu_cache_factor * 100.0, 2)
      num_running = int(metrics.get("vllm:num_requests_running", 0))
      num_waiting = int(metrics.get("vllm:num_requests_waiting", 0))
      num_preemptions = int(metrics.get("vllm:num_preemptions_total", 0))
      throughput = metrics.get("vllm:avg_generation_throughput_tok_per_s", 0.0)
      ttft = metrics.get("vllm:time_to_first_token_seconds", 0.0)
      tpot = metrics.get("vllm:time_per_output_token_seconds", 0.0)

      cache_threshold = float("{{ inputs.kv_cache_threshold_percent }}")
      max_waiting = int("{{ inputs.max_waiting_requests_threshold }}")
      alert_preemption = str("{{ inputs.alert_on_any_preemptions }}").lower() == "true"

      violations = []
      if gpu_cache_percent >= cache_threshold:
          violations.append(f"GPU KV-cache saturation at {gpu_cache_percent}% (threshold: {cache_threshold}%)")
      if num_waiting >= max_waiting:
          violations.append(f"Request queue backlog: {num_waiting} requests waiting for memory allocation (threshold: {max_waiting})")
      if alert_preemption and num_preemptions > 0:
          violations.append(f"Preemption thrashing active: {num_preemptions} cumulative requests evicted from GPU memory")

      is_saturated = len(violations) > 0
      severity = "CRITICAL" if (num_preemptions > 0 or gpu_cache_percent >= 95.0) else ("WARNING" if is_saturated else "OK")

      summary = {
          "is_saturated": is_saturated,
          "severity": severity,
          "gpu_cache_percent": gpu_cache_percent,
          "requests_running": num_running,
          "requests_waiting": num_waiting,
          "preemptions_total": num_preemptions,
          "throughput_tokens_per_sec": throughput,
          "ttft_seconds": ttft,
          "tpot_seconds": tpot,
          "violations": violations
      }

      print(f"vLLM Telemetry Audit: saturated={is_saturated}, severity={severity}, KV-cache={gpu_cache_percent}%, waiting={num_waiting}, preemptions={num_preemptions}")
      print("::" + json.dumps({"outputs": summary}) + "::")

  - id: evaluate_health_breaches
    type: io.kestra.plugin.core.flow.If
    description: Conditionally alert when GPU KV-cache is saturated or request queue backlogs form.
    condition: "{{ outputs.audit_vllm_telemetry.vars.is_saturated == true }}"
    then:
      - id: alert_vllm_saturation_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority alert to MLOps channel with saturation metrics and recommendations.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":rotating_light: *vLLM Inference Cluster Saturation Alert*\n*Severity:* `{{ outputs.audit_vllm_telemetry.vars.severity }}`\n*Endpoint:* {{ inputs.vllm_metrics_url }}\n*GPU KV-Cache Usage:* {{ outputs.audit_vllm_telemetry.vars.gpu_cache_percent }}%\n*Requests Running / Waiting:* {{ outputs.audit_vllm_telemetry.vars.requests_running }} / {{ outputs.audit_vllm_telemetry.vars.requests_waiting }}\n*Cumulative Preemptions:* {{ outputs.audit_vllm_telemetry.vars.preemptions_total }}\n*Violations:* {{ outputs.audit_vllm_telemetry.vars.violations | toJson }}\n\n*Recommended Actions:*\n- Scale out additional vLLM model replicas via Kubernetes HPA.\n- Increase `--gpu-memory-utilization` if spare VRAM exists.\n- Enable prefix caching with `--enable-prefix-caching` for repeated system prompts.\n- Reduce `--max-model-len` or implement queue admission control."
          }
    else:
      - id: log_vllm_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log nominal cluster health metrics when within operational boundaries.
        message: "vLLM cluster healthy. GPU KV-cache utilization at {{ outputs.audit_vllm_telemetry.vars.gpu_cache_percent }}%, running {{ outputs.audit_vllm_telemetry.vars.requests_running }} requests with {{ outputs.audit_vllm_telemetry.vars.requests_waiting }} waiting."

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when vLLM endpoints are unreachable, unresponsive, or returning HTTP 5xx.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":warning: *vLLM Telemetry Sentinel Failed*\n*Endpoint:* {{ inputs.vllm_metrics_url }}\n*Execution:* {{ execution.id }}\nCheck vLLM process liveness, network connectivity, or cluster ingress configuration."
      }

outputs:
  - id: audit_report
    type: JSON
    description: Detailed telemetry audit report including KV cache utilization, queue depths, and preemption counts.
    value: "{{ outputs.audit_vllm_telemetry.vars | toJson }}"

extend:
  title: vLLM GPU KV Cache Exhaustion and Preemption Thrashing Sentinel
  shortDescription: Monitor vLLM inference clusters for GPU KV-cache saturation, request queue buildup, and preemption thrashing before inference latency degrades.
  metaTitle: vLLM GPU Cache Exhaustion and Preemption Sentinel
  metaDescription: Audit vLLM GPU KV-cache usage factor, waiting request queues, and preemptions to alert Slack and trigger autoscaling before latency spikes.
  description: |
    High-throughput LLM serving engines such as vLLM rely on PagedAttention to allocate
    Key-Value (KV) cache memory in GPU VRAM blocks. Under surging concurrency or long context
    windows, the GPU KV-cache reaches saturation (`vllm:gpu_cache_usage_factor` approaching 1.0).
    When this occurs, vLLM is forced to swap memory blocks or preempt generating requests,
    destroying inference throughput and causing Time-To-First-Token (TTFT) and latency spikes.

    This blueprint acts as an automated reliability sentinel for production vLLM deployments.
    It scrapes vLLM's native Prometheus telemetry, tracks GPU KV-cache utilization, detects
    request queue buildup (`num_requests_waiting`), identifies active preemption thrashing
    (`num_preemptions_total`), and alerts MLOps teams on Slack with actionable scaling guidance.

    ## How it works

    1. `check_vllm_health` validates that the vLLM server is alive and responding to HTTP health checks.
    2. `fetch_vllm_metrics` scrapes raw Prometheus metrics from the `/metrics` endpoint.
    3. `audit_vllm_telemetry` parses the metrics stream, calculates KV-cache utilization percentages, checks queue backlogs, and evaluates preemption counters against configurable SLA thresholds.
    4. `evaluate_health_breaches` uses an `If` flowable task to determine if cache saturation or queue backlog thresholds are exceeded.
    5. If saturated, `alert_vllm_saturation_slack` posts an urgent incident card to Slack detailing the exact metrics and remediation recommendations.
    6. If healthy, `log_vllm_healthy` logs the current cluster utilization metrics.
    7. The `errors` block alerts Slack if the vLLM service becomes unreachable or returns an error.
    8. Triggers include a periodic scheduled check and an authenticated webhook trigger suitable for Kubernetes HPA integration or Prometheus Alertmanager webhooks.

    ## Prerequisites

    - A running vLLM instance exposing `/health` and `/metrics` (standard vLLM configuration).
    - A Slack Incoming Webhook URL.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alerting.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Update `vllm_metrics_url` with your vLLM server's address (e.g. `http://vllm-service.mlops.svc.cluster.local:8000/metrics`).
    3. Adjust `kv_cache_threshold_percent` (default: 85%) and `max_waiting_requests_threshold` (default: 5) to match your workload's headroom requirements.
    4. Enable the schedule or trigger the flow via webhook from your monitoring stack.

    ## How to extend

    - Add an automated webhook task that scales your Kubernetes Deployment replica count (`kubectl scale` or Kubernetes API) when saturation is detected.
    - Export audit metrics to Datadog or BigQuery for long-term GPU capacity planning.
    - Pair with downstream latency benchmarks to correlate KV-cache usage with token-generation speeds.

    ## Links

    - https://docs.vllm.ai/en/latest/serving/metrics.html
    - https://docs.vllm.ai/en/latest/serving/openai_compatible_server.html
    - https://kestra.io/plugins/plugin-slack
  tags:
    - AI
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Large Language Models
  ee: false
  demo: false
