id: publicrecords-usaspending-awards-scraper
namespace: company.team

inputs:
  - id: max_items
    type: INT
    displayName: Max items
    defaults: 50

tasks:
  - id: run_actor
    type: io.kestra.plugin.apify.actor.Run
    actorId: publicrecords/usaspending-awards-scraper
    apiToken: "{{ secret('APIFY_API_TOKEN') }}"
    maxItems: "{{ inputs.max_items }}"
    maxTotalChargeUsd: 5
    input:
      agency: "Department of Defense"
      maxItems: 50

  - id: get_dataset
    type: io.kestra.plugin.apify.dataset.Get
    apiToken: "{{ secret('APIFY_API_TOKEN') }}"
    datasetId: "{{ outputs.run_actor.defaultDatasetId }}"

extend:
  title: Pull USAspending federal awards
  metaTitle: Pull USAspending federal awards with Kestra
  shortDescription: Run publicrecords/usaspending-awards-scraper and fetch recent US federal awards.
  description: |
    Run the **Public Records** Apify Actor `usaspending-awards-scraper` on a schedule, using **your** Apify API token stored as the Kestra secret `APIFY_API_TOKEN`. Usage is billed to your Apify account (free tier available).

    Store page: https://apify.com/publicrecords/usaspending-awards-scraper

    Disclosure: Public Records maintains this Actor.
  tags:
    - Data
  subTags:
    - Public data
  ee: false
  demo: false
  metaDescription: Schedule the Public Records USAspending Apify Actor and fetch federal award records into Kestra.
