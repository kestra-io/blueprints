id: alert-change-correlator
namespace: company.sre

description: |
  On-call alert webhook -> find what shipped just before (commits + merged PRs, in parallel)
  -> Gemini ranks suspects -> page Slack with the shortlist; open a GitHub issue if critical.
  Webhook JSON (mapped to the inputs above): {"service":"checkout","severity":"critical","summary":"5xx > 5%","repository":"acme/checkout"}

inputs:
  - id: service
    type: STRING
    defaults: checkout
  - id: severity
    type: STRING
    defaults: critical
    description: Use "critical" to also open a GitHub incident issue.
  - id: summary
    type: STRING
    defaults: 5xx > 5%
  - id: repository
    type: STRING
    defaults: acme/checkout
    description: owner/repo whose recent commits and merged PRs are searched.
  - id: lookback_hours
    type: INT
    defaults: 6

variables:
  repo: "{{ inputs.repository }}"
  since: |-
    {{ now() | dateAdd(inputs.lookback_hours * -1, 'HOURS') | date("yyyy-MM-dd'T'HH:mm:ss'Z'") }}

tasks:
  - id: gather_changes
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: recent_commits
        type: io.kestra.plugin.github.commits.Search
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ render(vars.repo) }}"
        committerDate: ">={{ render(vars.since) }}"
        merge: false
        order: DESC
        fetchType: FETCH

      - id: merged_prs
        type: io.kestra.plugin.github.pulls.Search
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ render(vars.repo) }}"
        merged: true
        updatedAt: ">={{ render(vars.since) }}"
        order: DESC
        fetchType: FETCH

  - id: rank_suspects
    type: io.kestra.plugin.ai.completion.ChatCompletion
    provider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      apiKey: "{{ secret('GEMINI_API_KEY') }}"
      modelName: gemini-3.5-flash-lite
    messages:
      - type: SYSTEM
        content: >-
          You are an SRE assistant. Given an alert and the changes shipped before it, list at most 3
          likely culprit changes, most likely first, one line each with a short reason. If nothing
          plausible, say "No likely culprit". Never invent commits or PRs.
      - type: USER
        content: |
          ALERT: {{ inputs.service }} / {{ inputs.severity }} - {{ inputs.summary }}

          COMMITS (last {{ inputs.lookback_hours }}h):
          {{ outputs.recent_commits.rows | toJson }}

          MERGED PRS:
          {{ outputs.merged_prs.rows | toJson }}

  - id: page_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    messageText: |
      :rotating_light: *{{ inputs.service }}* [{{ inputs.severity }}] {{ inputs.summary }}
      {{ outputs.recent_commits.size }} commits / {{ outputs.merged_prs.size }} merged PRs in the last {{ inputs.lookback_hours }}h.
      *Suspects:*
      {{ outputs.rank_suspects.textOutput }}

  - id: escalate_if_critical
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.severity == 'critical' }}"
    then:
      - id: open_incident_issue
        type: io.kestra.plugin.github.issues.Create
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ render(vars.repo) }}"
        title: "[INCIDENT] {{ inputs.service }}: {{ inputs.summary }}"
        body: |
          Opened automatically by Kestra execution {{ execution.id }}.

          ### Suspect changes
          {{ outputs.rank_suspects.textOutput }}
        labels:
          - incident

triggers:
  - id: alert_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: replace-with-a-long-random-string
    inputs:
      service: "{{ trigger.body.service ?? 'checkout' }}"
      severity: "{{ trigger.body.severity ?? 'critical' }}"
      summary: "{{ trigger.body.summary ?? 'alert' }}"
      repository: "{{ trigger.body.repository ?? 'acme/checkout' }}"

extend:
  title: Correlate an alert with recent GitHub changes using Gemini and page Slack
  metaTitle: Correlate alerts with recent GitHub commits and PRs using Gemini and Slack in Kestra
  shortDescription: On an alert, fetch recent commits and merged PRs in parallel, have Gemini shortlist the likely culprits, post them to Slack and open an incident issue when critical.
  description: |
    On an alert, finds what shipped just before it (recent commits and merged PRs, fetched in parallel), asks Gemini
    to shortlist the most likely culprits, posts the shortlist to Slack, and opens a GitHub incident issue when the
    severity is `critical`.

    Prerequisites:
      - Secrets:
        - GITHUB_TOKEN: search commits and PRs, create issues on the repository (required)
        - GEMINI_API_KEY: Gemini API key, model gemini-3.5-flash-lite (required)
        - SLACK_WEBHOOK: Slack incoming webhook URL (required)
      - Replace the placeholder webhook `key` in the trigger before use
    Inputs:
      - service (STRING, default checkout)
      - severity (STRING, default critical): anything other than `critical` skips the GitHub issue
      - summary (STRING, default "5xx > 5%")
      - repository (STRING, default acme/checkout): owner/repo to search
      - lookback_hours (INT, default 6)
    Quick start:
      1. Set the secrets and replace the webhook key
      2. Upload the flow and execute it from the UI, or POST {"service":"checkout","severity":"critical","summary":"5xx > 5%","repository":"acme/checkout"} to the webhook
    Expected outputs:
      - outputs.rank_suspects.textOutput: the Gemini shortlist (also posted to Slack)
      - A GitHub issue labelled `incident` when severity is critical
  tags:
    - AI
    - Infrastructure
  ee: false
  demo: false
  metaDescription: Rank recent GitHub commits and merged PRs against an alert with Gemini, page Slack, and open an incident issue when critical.
