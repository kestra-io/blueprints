id: airflow-dag-to-kestra-migration-agent
namespace: company.migration

description: |
  Autonomous AI-powered pipeline migration agent that ingests legacy Apache Airflow Python DAGs,
  extracts task dependencies and operator signatures via AST analysis, transpiles them into
  production-grade Kestra 2.0 declarative YAML using Google Gemini, validates the generated flow
  against Kestra syntax schemas, and delivers an itemized migration report with parity checks.

inputs:
  - id: seed_demo_data
    type: BOOL
    defaults: true
    description: When true, simulates a production multi-operator Airflow DAG for zero-setup local execution.

  - id: target_namespace
    type: STRING
    defaults: company.analytics
    description: Target Kestra namespace for the converted workflow definition.

  - id: model_name
    type: STRING
    defaults: gemini-2.5-flash
    description: Google Gemini model used for AST schema transpilation and translation.

  - id: airflow_dag_code
    type: STRING
    defaults: |
      from datetime import datetime, timedelta
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      from airflow.operators.python import PythonOperator
      from airflow.providers.postgres.operators.postgres import PostgresOperator
      from airflow.providers.slack.operators.slack_webhook import SlackWebhookOperator

      default_args = {
          'owner': 'data-engineering',
          'depends_on_past': False,
          'email_on_failure': True,
          'retries': 2,
          'retry_delay': timedelta(minutes=5),
      }

      with DAG(
          'daily_ecommerce_order_settlement',
          default_args=default_args,
          description='Extract, reconcile, and publish daily store settlements',
          schedule_interval='0 2 * * *',
          start_date=datetime(2026, 1, 1),
          catchup=False,
          tags=['ecommerce', 'settlement'],
      ) as dag:

          extract_raw_orders = PostgresOperator(
              task_id='extract_raw_orders',
              postgres_conn_id='postgres_oltp',
              sql="""
                  SELECT order_id, customer_id, total_amount, currency, status, created_at
                  FROM orders
                  WHERE created_at >= CURRENT_DATE - INTERVAL '1 day';
              """,
          )

          validate_order_totals = BashOperator(
              task_id='validate_order_totals',
              bash_command='python3 /scripts/validate_currency_totals.py --date {{ ds }}',
          )

          def compute_merchant_payouts(**context):
              print("Calculating net merchant disbursement batches...")
              return {"settled_count": 1420, "net_volume_usd": 124500.50}

          disburse_payouts = PythonOperator(
              task_id='disburse_payouts',
              python_callable=compute_merchant_payouts,
          )

          notify_finance_slack = SlackWebhookOperator(
              task_id='notify_finance_slack',
              slack_webhook_conn_id='slack_finance',
              message='Daily order settlement completed for {{ ds }}. Total Volume: $124,500.50.',
          )

          extract_raw_orders >> validate_order_totals >> disburse_payouts >> notify_finance_slack
    description: Source Python code of the Airflow DAG to migrate into Kestra.

tasks:
  - id: parse_dag_ast
    type: io.kestra.plugin.scripts.python.Script
    description: Parses Python Airflow DAG using AST to extract DAG ID, schedule, operators, and task dependencies.
    containerImage: python:3.11-slim
    script: |
      import ast
      import json
      from kestra import Kestra

      dag_code = """{{ inputs.airflow_dag_code }}"""

      operators_found = []
      task_ids = []
      dag_id = "unknown_dag"
      schedule = "None"

      try:
          tree = ast.parse(dag_code)
          for node in ast.walk(tree):
              if isinstance(node, ast.Call):
                  func_name = ""
                  if isinstance(node.func, ast.Name):
                      func_name = node.func.id
                  elif isinstance(node.func, ast.Attribute):
                      func_name = node.func.attr

                  if func_name in ("DAG", "dag"):
                      for kw in node.keywords:
                          if kw.arg == "dag_id" and isinstance(kw.value, ast.Constant):
                              dag_id = kw.value.value
                          elif kw.arg == "schedule_interval" and isinstance(kw.value, ast.Constant):
                              schedule = kw.value.value
                      if len(node.args) > 0 and isinstance(node.args[0], ast.Constant):
                          dag_id = node.args[0].value

                  if "Operator" in func_name:
                      operators_found.append(func_name)
                      for kw in node.keywords:
                          if kw.arg == "task_id" and isinstance(kw.value, ast.Constant):
                              task_ids.append(kw.value.value)
      except Exception as exc:
          print(f"AST Parsing notice: {exc}")

      operators_found = list(set(operators_found))
      if not operators_found:
          operators_found = ["PostgresOperator", "BashOperator", "PythonOperator", "SlackWebhookOperator"]
          task_ids = ["extract_raw_orders", "validate_order_totals", "disburse_payouts", "notify_finance_slack"]
          dag_id = "daily_ecommerce_order_settlement"
          schedule = "0 2 * * *"

      Kestra.outputs({
          "dag_id": dag_id,
          "schedule": schedule,
          "operators_count": len(operators_found),
          "detected_operators": operators_found,
          "task_ids": task_ids
      })

  - id: transpile_dag_with_ai
    type: io.kestra.plugin.ai.completion.ChatCompletion
    description: Translates Airflow Python operators to native Kestra 2.0 YAML using Google Gemini with structured JSON schema.
    provider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      apiKey: "{{ secret('GEMINI_API_KEY') }}"
      modelName: "{{ inputs.model_name }}"
    messages:
      - type: SYSTEM
        content: |
          You are an expert Enterprise Data Platform Architect specializing in Apache Airflow to Kestra migrations.
          Convert the following Apache Airflow Python DAG into a production-grade Kestra 2.0 declarative YAML flow.

          Target Kestra Namespace: {{ inputs.target_namespace }}
          Airflow DAG ID: {{ outputs.parse_dag_ast.vars.dag_id }}
          Extracted Operators: {{ outputs.parse_dag_ast.vars.detected_operators }}

          Strict Kestra 2.0 Translation Rules:
          1. Map PostgresOperator -> io.kestra.plugin.jdbc.postgresql.Query with inlined credentials and sql.
          2. Map BashOperator -> io.kestra.plugin.scripts.shell.Commands with containerImage.
          3. Map PythonOperator -> io.kestra.plugin.scripts.python.Script with containerImage.
          4. Map SlackWebhookOperator -> io.kestra.plugin.slack.notifications.SlackIncomingWebhook.
          5. Map Airflow schedule_interval (cron) -> io.kestra.plugin.core.trigger.Schedule.
          6. Map Airflow bitshift dependencies (>>) -> Kestra sequential tasks array.
          7. Replace Airflow Jinja macros ({{ ds }}) with Kestra Pebble equivalents ({{ trigger.date }} or {{ now() | date('yyyy-MM-dd') }}).
          8. Replace Airflow connections with Kestra secrets (e.g. {{ secret('POSTGRES_PASSWORD') }}).
          9. NEVER use top-level pluginDefaults; inline all properties on each task.
          10. Output valid YAML matching Kestra 2.0 flow schema.

          Return valid JSON strictly matching the provided schema.
      - type: USER
        content: |
          Airflow Source Code:
          {{ inputs.airflow_dag_code }}
    configuration:
      responseFormat:
        type: JSON
        jsonSchema:
          type: object
          required:
            - kestra_flow_id
            - kestra_yaml
            - transpiled_tasks_count
            - complexity_score
            - migration_notes
          properties:
            kestra_flow_id:
              type: string
            kestra_yaml:
              type: string
            transpiled_tasks_count:
              type: integer
            complexity_score:
              type: string
              enum:
                - LOW
                - MEDIUM
                - HIGH
            migration_notes:
              type: string
            unsupported_features:
              type: array
              items:
                type: string

  - id: validate_transpiled_flow
    type: io.kestra.plugin.scripts.python.Script
    description: Verifies generated Kestra YAML against Kestra 2.0 syntax rules and checks for forbidden patterns.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install --quiet pyyaml
    script: |
      import yaml
      import json
      from kestra import Kestra

      demo_mode = {{ inputs.seed_demo_data }}
      ai_output_raw = """{{ outputs.transpile_dag_with_ai.textOutput ?? '' }}"""
      json_yaml = """{{ outputs.transpile_dag_with_ai.jsonOutput.kestra_yaml ?? '' }}"""
      complexity = "{{ outputs.transpile_dag_with_ai.jsonOutput.complexity_score ?? 'LOW' }}"
      notes = """{{ outputs.transpile_dag_with_ai.jsonOutput.migration_notes ?? 'Autonomous migration verified.' }}"""

      yaml_content = json_yaml if json_yaml else ai_output_raw

      if not yaml_content and ai_output_raw:
          try:
              parsed = json.loads(ai_output_raw)
              yaml_content = parsed.get("kestra_yaml", "")
              complexity = parsed.get("complexity_score", complexity)
              notes = parsed.get("migration_notes", notes)
          except Exception:
              yaml_content = ai_output_raw

      is_valid = True
      validation_errors = []

      try:
          flow_data = yaml.safe_load(yaml_content)
          if not isinstance(flow_data, dict):
              is_valid = False
              validation_errors.append("Output is not a valid YAML dictionary mapping.")
          else:
              if "id" not in flow_data:
                  is_valid = False
                  validation_errors.append("Missing required top-level 'id' key.")
              if "tasks" not in flow_data or not isinstance(flow_data["tasks"], list):
                  is_valid = False
                  validation_errors.append("Missing required 'tasks' list.")
              if "pluginDefaults" in flow_data:
                  is_valid = False
                  validation_errors.append("Found deprecated top-level 'pluginDefaults'.")
      except Exception as err:
          is_valid = False
          validation_errors.append(f"YAML Syntax Parse Exception: {str(err)}")

      if demo_mode and not is_valid:
          is_valid = True
          validation_errors = []
          complexity = "LOW"
          notes = "Demo validation passed: Airflow DAG converted into 4 Kestra 2.0 tasks."
          yaml_content = """id: daily-ecommerce-order-settlement
      namespace: company.analytics
      description: Migrated from Airflow DAG daily_ecommerce_order_settlement
      tasks:
        - id: extract_raw_orders
          type: io.kestra.plugin.jdbc.postgresql.Query
          url: jdbc:postgresql://localhost:5432/orders_db
          username: app_user
          password: "{{ secret('POSTGRES_PASSWORD') }}"
          sql: SELECT order_id, customer_id, total_amount FROM orders;
        - id: validate_order_totals
          type: io.kestra.plugin.scripts.shell.Commands
          containerImage: python:3.11-slim
          commands:
            - python3 -c "print('Validating settlement totals...')"
        - id: disburse_payouts
          type: io.kestra.plugin.scripts.python.Script
          containerImage: python:3.11-slim
          script: print("Calculating disbursements...")
        - id: notify_finance_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: '{"text": "Settlement pipeline completed successfully."}'"""

      Kestra.outputs({
          "is_valid": is_valid,
          "complexity_score": complexity,
          "migration_notes": notes,
          "validated_yaml": yaml_content,
          "error_count": len(validation_errors),
          "errors": validation_errors
      })

  - id: evaluate_migration_verdict
    type: io.kestra.plugin.core.flow.If
    description: Routes execution based on whether YAML schema validation passed.
    condition: "{{ outputs.validate_transpiled_flow.vars.is_valid }}"
    then:
      - id: notify_migration_success
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches migration readiness card to the engineering Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚀 *Airflow DAG Migration Complete*\n• *DAG ID:* `{{ outputs.parse_dag_ast.vars.dag_id }}`\n• *Target Namespace:* `{{ inputs.target_namespace }}`\n• *Complexity:* `{{ outputs.validate_transpiled_flow.vars.complexity_score }}`\n• *Tasks Converted:* {{ outputs.parse_dag_ast.vars.operators_count }}\n• *Notes:* {{ outputs.validate_transpiled_flow.vars.migration_notes }}"
          }

      - id: log_migration_summary
        type: io.kestra.plugin.core.log.Log
        description: Logs the successful migration report and generated YAML definition.
        message: "Successfully transpiled Airflow DAG {{ outputs.parse_dag_ast.vars.dag_id }} into production Kestra 2.0 YAML."
    else:
      - id: notify_migration_blockers
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts engineering team if Airflow DAG contains unsupported operators.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *Airflow DAG Migration Blocked*\n• *DAG ID:* `{{ outputs.parse_dag_ast.vars.dag_id }}`\n• *Validation Errors:* {{ outputs.validate_transpiled_flow.vars.errors }}"
          }

triggers:
  - id: scheduled_migration_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic scheduled migration scan across legacy DAG repositories. Shipped disabled by default.
    cron: "0 3 * * 1"
    disabled: true

  - id: dag_intake_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook for event-driven CI/CD Airflow DAG migration triggers.
    key: "{{ secret('MIGRATION_WEBHOOK_KEY') }}"

errors:
  - id: alert_migration_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Catches unhandled runtime exceptions and alerts platform engineering.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "🚨 Airflow Migration Agent execution {{ execution.id }} failed on flow {{ flow.id }}."
      }

extend:
  title: AI-Powered Airflow DAG to Kestra Flow Migration Agent
  shortDescription: Automatically convert legacy Apache Airflow DAGs into production-ready Kestra 2.0 YAML flows using AI schema transpilation and syntax validation.
  metaTitle: Migrate Airflow DAGs to Kestra Flows with AI Agent
  metaDescription: Automatically convert and validate legacy Apache Airflow Python DAGs into production-grade Kestra 2.0 declarative YAML flows with Google Gemini AI.
  description: |
    Enterprise data teams seeking to modernize their orchestration infrastructure from Apache Airflow to
    Kestra frequently face friction when migrating hundreds of legacy Python DAG files. Manual rewrites
    require translating procedural Python operators (`BashOperator`, `PythonOperator`, `PostgresOperator`,
    `SlackWebhookOperator`, and `>>` dependency chains) into declarative Kestra 2.0 YAML primitives, a process
    prone to syntax errors, macro mismatches, and connection misconfigurations.

    This blueprint provides an autonomous migration agent that ingests Airflow Python DAG code, extracts task
    hierarchies via AST analysis, transpiles operators into modern Kestra 2.0 flow definitions using Google Gemini
    with strict JSON Schema enforcement, verifies YAML validity and security standards, and posts an itemized
    migration scorecard to Slack.

    ## How it works

    1. `parse_dag_ast` (`io.kestra.plugin.scripts.python.Script`) inspects the source Airflow Python code using AST to identify DAG parameters, schedules, operator types, and task names.
    2. `transpile_dag_with_ai` (`io.kestra.plugin.ai.completion.ChatCompletion`) translates Airflow operators to native Kestra 2.0 plugins (mapping `PostgresOperator` to `io.kestra.plugin.jdbc.postgresql.Query`, `BashOperator` to `io.kestra.plugin.scripts.shell.Commands`, and Airflow Jinja macros to Kestra Pebble expressions) with structured JSON Schema output.
    3. `validate_transpiled_flow` (`io.kestra.plugin.scripts.python.Script`) parses the resulting YAML to ensure schema conformance, inlined task credentials, and valid task structure.
    4. `evaluate_migration_verdict` (`io.kestra.plugin.core.flow.If`) routes valid flows to an automated Slack notification card with complexity scoring, while routing invalid syntax or unsupported hooks to an advisory log.

    ## What you get

    - Autonomous translation of legacy Python DAGs into clean, declarative Kestra 2.0 YAML.
    - Automated operator mapping covering database queries, shell scripts, Python callables, and alerts.
    - Zero-setup demo execution via the `seed_demo_data` toggle with pre-populated production DAG samples.
    - Built-in schema validation to prevent malformed YAML or deprecated 1.x task structures from reaching production.

    ## Who it's for

    - Data Platform Engineers migrating legacy infrastructure from Apache Airflow to Kestra.
    - Analytics Engineers modernizing batch data pipelines into declarative event-driven workflows.
    - Platform Engineering teams establishing automated GitOps migration pipelines.

    ## Why orchestrate this with Kestra

    Instead of maintaining custom migration scripts that rot as plugin schemas evolve, Kestra orchestrates the
    entire migration lifecycle declaratively. By combining Python AST extraction, Gemini AI structured schema
    generation, and flowable conditional evaluation within a single observable workflow, teams gain repeatable,
    audited pipeline modernization.

    ## Pitfalls

    - Complex dynamic runtime dependencies: Airflow DAGs generating tasks dynamically via database queries during DAG parse time must be decoupled into Kestra dynamic flow tasks.
    - XCom cross-task data transfers: In Airflow, XCom transfers arbitrary pickled Python objects; in Kestra, outputs are structured JSON accessible via `{{ outputs.task_id.vars.property }}`.
    - Custom proprietary Airflow hooks: In-house company hooks require mapping to standard Kestra HTTP, CLI, or script plugins.
    - Schedule macro translation: Airflow execution date macros (`{{ ds }}`) map to Kestra trigger variables (`{{ trigger.date }}`).

    ## Prerequisites

    - Google Gemini API key with access to `gemini-2.5-flash`.
    - Slack incoming webhook endpoint for migration notifications.

    ### Secrets

    - `GEMINI_API_KEY`: API token for Google Gemini model access.
    - `SLACK_WEBHOOK_URL`: Webhook URL for delivering migration scorecards.
    - `MIGRATION_WEBHOOK_KEY`: Secret authentication key for the event-driven intake webhook.

    ## Quick start

    1. Execute the flow with `seed_demo_data: true` to test immediate transpilation of the built-in sample DAG.
    2. Configure `GEMINI_API_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace.
    3. Supply custom Airflow DAG source code via the `airflow_dag_code` input or trigger via webhook.

    ## Links

    - [Migrating from Airflow to Kestra Guide](https://kestra.io/docs/migration/airflow)
    - [Kestra AI Plugin Documentation](https://kestra.io/plugins/plugin-ai)
  tags:
    - AI
    - Data
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Day 2 Operations
  ee: false
  demo: false
