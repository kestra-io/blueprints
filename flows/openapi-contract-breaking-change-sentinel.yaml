id: openapi-contract-breaking-change-sentinel
namespace: company.team

description: |
  Automated API contract governance sentinel. Compares candidate OpenAPI/Swagger
  specifications against production baselines, detects breaking schema changes
  (removed endpoints, deleted methods, removed response properties, added required
  parameters, and narrowed enum values), verifies SemVer major versioning compliance,
  persists audit state to Kestra KV store, alerts Slack, and blocks incompatible deployments.

inputs:
  - id: service_name
    type: STRING
    displayName: "Service Name"
    defaults: "customer-billing-service"
    description: "Identifier of the API service being evaluated."

  - id: candidate_spec_url
    type: STRING
    displayName: "Candidate Specification URL"
    defaults: "https://petstore.swagger.io/v2/swagger.json"
    description: "HTTP URL to fetch the candidate OpenAPI or Swagger JSON/YAML specification from CI build artifacts or staging preview."

  - id: production_spec_url
    type: STRING
    displayName: "Production Specification URL"
    defaults: "https://petstore.swagger.io/v2/swagger.json"
    description: "HTTP URL to fetch the baseline production OpenAPI or Swagger JSON/YAML specification from API gateway or schema registry."

  - id: candidate_spec_override
    type: STRING
    displayName: "Candidate Spec Inline Override"
    defaults: ""
    description: "Optional raw JSON or YAML candidate specification string. If non-empty, overrides candidate_spec_url."

  - id: production_spec_override
    type: STRING
    displayName: "Production Spec Inline Override"
    defaults: ""
    description: "Optional raw JSON or YAML production baseline specification string. If non-empty, overrides production_spec_url."

  - id: allow_breaking_with_major_bump
    type: BOOLEAN
    displayName: "Allow Breaking on Major Version Bump"
    defaults: true
    description: "When true, breaking contract changes are permitted if the candidate specification increments the SemVer major version (e.g. 1.x to 2.0.0)."

  - id: fail_on_breaking_changes
    type: BOOLEAN
    displayName: "Fail Deployment on Breaking Changes"
    defaults: true
    description: "Whether to fail execution via io.kestra.plugin.core.execution.Fail when unauthorized breaking changes are detected."

  - id: slack_channel
    type: STRING
    displayName: "Slack Alert Channel"
    defaults: "#api-governance"
    description: "Slack channel for alerting on contract breaches and pipeline status."

triggers:
  - id: periodic_contract_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Daily scheduled contract drift audit between production and staging API specifications. Shipped disabled by default."
    cron: "0 6 * * 1-5"
    disabled: true

  - id: ci_contract_gate_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Webhook endpoint for CI/CD pipelines (e.g. GitHub Actions, GitLab CI) to trigger contract validation on build artifacts. Shipped disabled until webhook key secret is configured."
    key: "{{ secret('OPENAPI_WEBHOOK_KEY') }}"
    disabled: true

tasks:
  - id: fetch_candidate_spec
    type: io.kestra.plugin.core.http.Request
    description: "Download candidate OpenAPI or Swagger specification from CI build artifact URL or staging service endpoint."
    uri: "{{ inputs.candidate_spec_url }}"
    method: GET
    headers:
      Accept: "application/json, application/yaml, text/yaml, text/plain, */*"
    retry:
      type: exponential
      maxAttempts: 3
      interval: PT2S

  - id: fetch_production_spec
    type: io.kestra.plugin.core.http.Request
    description: "Fetch current baseline production OpenAPI or Swagger specification from API gateway or registry."
    uri: "{{ inputs.production_spec_url }}"
    method: GET
    headers:
      Accept: "application/json, application/yaml, text/yaml, text/plain, */*"
    retry:
      type: exponential
      maxAttempts: 3
      interval: PT2S

  - id: diff_openapi_contracts
    type: io.kestra.plugin.scripts.python.Script
    description: "Execute Python semantic contract diff engine to detect breaking schema changes, validate SemVer rules, and generate structured reports."
    containerImage: python:3.12-slim
    beforeCommands:
      - pip install pyyaml
    env:
      SERVICE_NAME: "{{ inputs.service_name }}"
      ALLOW_BREAKING_ON_MAJOR_BUMP: "{{ inputs.allow_breaking_with_major_bump }}"
      FAIL_ON_BREAKING: "{{ inputs.fail_on_breaking_changes }}"
    inputFiles:
      candidate.spec: "{{ inputs.candidate_spec_override != '' ? inputs.candidate_spec_override : (outputs.fetch_candidate_spec.body | json) }}"
      production.spec: "{{ inputs.production_spec_override != '' ? inputs.production_spec_override : (outputs.fetch_production_spec.body | json) }}"
    outputFiles:
      - diff_summary.md
      - diff_report.json
    script: |
      import json
      import os
      import re
      import sys
      import yaml

      service_name = os.environ.get("SERVICE_NAME", "api-service")
      allow_major = os.environ.get("ALLOW_BREAKING_ON_MAJOR_BUMP", "true").lower() == "true"
      fail_on_breaking = os.environ.get("FAIL_ON_BREAKING", "true").lower() == "true"

      def load_spec_file(filepath):
          if not os.path.exists(filepath):
              return {}
          with open(filepath, "r", encoding="utf-8") as f:
              content = f.read().strip()
          if not content:
              return {}
          try:
              data = json.loads(content)
              if isinstance(data, str):
                  try:
                      nested = json.loads(data)
                      return nested if isinstance(nested, dict) else {}
                  except Exception:
                      return yaml.safe_load(data) or {}
              elif isinstance(data, dict):
                  return data
          except Exception:
              pass
          try:
              return yaml.safe_load(content) or {}
          except Exception as exc:
              print(f"Error parsing spec file {filepath}: {exc}", file=sys.stderr)
              return {}

      candidate_spec = load_spec_file("candidate.spec")
      production_spec = load_spec_file("production.spec")

      def parse_semver(version_str):
          if not version_str:
              return (0, 0, 0)
          v = str(version_str).strip().lstrip('v')
          match = re.search(r'^(\d+)(?:\.(\d+))?(?:\.(\d+))?', v)
          if match:
              major = int(match.group(1))
              minor = int(match.group(2) or 0)
              patch = int(match.group(3) or 0)
              return (major, minor, patch)
          return (0, 0, 0)

      def resolve_ref(spec, ref):
          if not ref or not isinstance(ref, str) or not ref.startswith("#/"):
              return None
          parts = ref.lstrip("#/").split("/")
          curr = spec
          for part in parts:
              if isinstance(curr, dict) and part in curr:
                  curr = curr[part]
              else:
                  return None
          return curr

      def get_schema(spec, obj):
          if not isinstance(obj, dict):
              return {}
          if "$ref" in obj:
              resolved = resolve_ref(spec, obj["$ref"])
              if isinstance(resolved, dict):
                  return resolved
          return obj

      def extract_schema_properties(spec, schema):
          schema = get_schema(spec, schema)
          props = {}
          if "properties" in schema and isinstance(schema["properties"], dict):
              for prop_name, prop_val in schema["properties"].items():
                  props[prop_name] = get_schema(spec, prop_val)
          if "allOf" in schema and isinstance(schema["allOf"], list):
              for sub in schema["allOf"]:
                  props.update(extract_schema_properties(spec, sub))
          return props

      def extract_request_body_schema(spec, op):
          rb = op.get("requestBody")
          if rb:
              rb = get_schema(spec, rb)
              content = rb.get("content", {})
              for media_type, media_val in content.items():
                  if "json" in media_type:
                      return get_schema(spec, media_val.get("schema", {}))
          for p in op.get("parameters", []):
              p = get_schema(spec, p)
              if p.get("in") == "body" and "schema" in p:
                  return get_schema(spec, p["schema"])
          return None

      def get_operation_params(spec, path_item, op):
          params = []
          for p in path_item.get("parameters", []):
              params.append(get_schema(spec, p))
          for p in op.get("parameters", []):
              p_resolved = get_schema(spec, p)
              if p_resolved.get("in") != "body":
                  params.append(p_resolved)
          return params

      def get_response_schema(spec, op, status_code="200"):
          responses = op.get("responses", {})
          resp = responses.get(str(status_code)) or responses.get(int(status_code) if status_code.isdigit() else status_code)
          if not resp and "default" in responses:
              resp = responses["default"]
          if not resp:
              return None
          resp = get_schema(spec, resp)
          if "content" in resp and isinstance(resp["content"], dict):
              for media_type, media_val in resp["content"].items():
                  if "json" in media_type:
                      return get_schema(spec, media_val.get("schema", {}))
          if "schema" in resp:
              return get_schema(spec, resp["schema"])
          return None

      breaking = []
      non_breaking = []

      prod_version_str = str(production_spec.get("info", {}).get("version", "1.0.0"))
      cand_version_str = str(candidate_spec.get("info", {}).get("version", "1.0.0"))
      prod_v = parse_semver(prod_version_str)
      cand_v = parse_semver(cand_version_str)
      major_bump = cand_v[0] > prod_v[0]

      prod_paths = production_spec.get("paths", {}) or {}
      cand_paths = candidate_spec.get("paths", {}) or {}

      http_methods = ["get", "post", "put", "delete", "patch", "options", "head"]

      for path, prod_item in prod_paths.items():
          if path not in cand_paths:
              breaking.append({
                  "rule": "REMOVED_ENDPOINT",
                  "severity": "BREAKING",
                  "path": path,
                  "method": "ALL",
                  "message": f"Endpoint path '{path}' was completely removed."
              })
          else:
              cand_item = cand_paths[path]
              for method in http_methods:
                  if method in prod_item and method not in cand_item:
                      breaking.append({
                          "rule": "REMOVED_METHOD",
                          "severity": "BREAKING",
                          "path": path,
                          "method": method.upper(),
                          "message": f"HTTP method '{method.upper()}' was removed from endpoint '{path}'."
                      })
                  elif method not in prod_item and method in cand_item:
                      non_breaking.append({
                          "rule": "ADDED_METHOD",
                          "severity": "NON_BREAKING",
                          "path": path,
                          "method": method.upper(),
                          "message": f"New HTTP method '{method.upper()}' added to endpoint '{path}'."
                      })
                  elif method in prod_item and method in cand_item:
                      prod_op = prod_item[method]
                      cand_op = cand_item[method]

                      p_params = get_operation_params(production_spec, prod_item, prod_op)
                      c_params = get_operation_params(candidate_spec, cand_item, cand_op)

                      p_map = {(p.get("name"), p.get("in")): p for p in p_params if p.get("name")}
                      c_map = {(p.get("name"), p.get("in")): p for p in c_params if p.get("name")}

                      for (p_name, p_in), c_param in c_map.items():
                          c_req = c_param.get("required", p_in == "path")
                          if (p_name, p_in) not in p_map:
                              if c_req:
                                  breaking.append({
                                      "rule": "ADDED_REQUIRED_PARAM",
                                      "severity": "BREAKING",
                                      "path": path,
                                      "method": method.upper(),
                                      "message": f"New mandatory request parameter '{p_name}' in '{p_in}' added."
                                  })
                              else:
                                  non_breaking.append({
                                      "rule": "ADDED_OPTIONAL_PARAM",
                                      "severity": "NON_BREAKING",
                                      "path": path,
                                      "method": method.upper(),
                                      "message": f"Optional request parameter '{p_name}' in '{p_in}' added."
                                  })
                          else:
                              p_param = p_map[(p_name, p_in)]
                              p_req = p_param.get("required", p_in == "path")
                              if not p_req and c_req:
                                  breaking.append({
                                      "rule": "PARAM_MADE_REQUIRED",
                                      "severity": "BREAKING",
                                      "path": path,
                                      "method": method.upper(),
                                      "message": f"Existing parameter '{p_name}' in '{p_in}' changed from optional to required."
                                  })

                              p_schema = get_schema(production_spec, p_param.get("schema", p_param))
                              c_schema = get_schema(candidate_spec, c_param.get("schema", c_param))
                              if "enum" in p_schema and "enum" in c_schema:
                                  p_enum = set(p_schema["enum"])
                                  c_enum = set(c_schema["enum"])
                                  removed_enums = p_enum - c_enum
                                  added_enums = c_enum - p_enum
                                  if removed_enums:
                                      breaking.append({
                                          "rule": "NARROWED_ENUM",
                                          "severity": "BREAKING",
                                          "path": path,
                                          "method": method.upper(),
                                          "message": f"Parameter '{p_name}' enum narrowed. Removed allowable values: {sorted(list(removed_enums))}."
                                      })
                                  if added_enums:
                                      non_breaking.append({
                                          "rule": "EXPANDED_ENUM",
                                          "severity": "NON_BREAKING",
                                          "path": path,
                                          "method": method.upper(),
                                          "message": f"Parameter '{p_name}' enum widened with new values: {sorted(list(added_enums))}."
                                      })

                      p_rb_schema = extract_request_body_schema(production_spec, prod_op)
                      c_rb_schema = extract_request_body_schema(candidate_spec, cand_op)
                      if p_rb_schema and c_rb_schema:
                          p_req_props = set(p_rb_schema.get("required", []))
                          c_req_props = set(c_rb_schema.get("required", []))
                          new_req = c_req_props - p_req_props
                          for prop in new_req:
                              breaking.append({
                                  "rule": "ADDED_REQUIRED_BODY_PROPERTY",
                                  "severity": "BREAKING",
                                  "path": path,
                                  "method": method.upper(),
                                  "message": f"New mandatory requestBody property '{prop}' added."
                              })

                      for code in ["200", "201", "204", "default"]:
                          p_resp = get_response_schema(production_spec, prod_op, code)
                          c_resp = get_response_schema(candidate_spec, cand_op, code)
                          if p_resp and not c_resp:
                              breaking.append({
                                  "rule": "REMOVED_RESPONSE",
                                  "severity": "BREAKING",
                                  "path": path,
                                  "method": method.upper(),
                                  "message": f"Response schema for status code '{code}' was removed."
                              })
                          elif p_resp and c_resp:
                              p_props = extract_schema_properties(production_spec, p_resp)
                              c_props = extract_schema_properties(candidate_spec, c_resp)
                              for prop_name, p_prop in p_props.items():
                                  if prop_name not in c_props:
                                      breaking.append({
                                          "rule": "REMOVED_RESPONSE_PROPERTY",
                                          "severity": "BREAKING",
                                          "path": path,
                                          "method": method.upper(),
                                          "message": f"Property '{prop_name}' removed from '{code}' response body schema."
                                      })
                                  else:
                                      c_prop = c_props[prop_name]
                                      p_type = p_prop.get("type")
                                      c_type = c_prop.get("type")
                                      if p_type and c_type and p_type != c_type:
                                          breaking.append({
                                              "rule": "CHANGED_PROPERTY_TYPE",
                                              "severity": "BREAKING",
                                              "path": path,
                                              "method": method.upper(),
                                              "message": f"Property '{prop_name}' in '{code}' response changed type from '{p_type}' to '{c_type}'."
                                          })
                              for prop_name in c_props:
                                  if prop_name not in p_props:
                                      non_breaking.append({
                                          "rule": "ADDED_RESPONSE_PROPERTY",
                                          "severity": "NON_BREAKING",
                                          "path": path,
                                          "method": method.upper(),
                                          "message": f"Property '{prop_name}' added to '{code}' response schema."
                                      })

      for path, cand_item in cand_paths.items():
          if path not in prod_paths:
              non_breaking.append({
                  "rule": "ADDED_ENDPOINT",
                  "severity": "NON_BREAKING",
                  "path": path,
                  "method": "ALL",
                  "message": f"New endpoint path '{path}' added."
              })

      if len(breaking) == 0:
          verdict = "PASSED"
      elif major_bump and allow_major:
          verdict = "WARNING_ACCEPTED"
      elif not fail_on_breaking:
          verdict = "WARNING_ACCEPTED"
      else:
          verdict = "BLOCKED"

      md_lines = [
          f"# OpenAPI Contract Diff Report: {service_name}",
          "",
          f"- **Sentinel Verdict:** `{verdict}`",
          f"- **Candidate Spec Version:** `{cand_version_str}`",
          f"- **Production Spec Version:** `{prod_version_str}`",
          f"- **Major SemVer Bump:** `{'YES' if major_bump else 'NO'}`",
          f"- **Breaking Changes Detected:** `{len(breaking)}`",
          f"- **Non-Breaking Changes Detected:** `{len(non_breaking)}`",
          "",
      ]

      if breaking:
          md_lines.append("## Breaking Changes (Contract Breaches)")
          md_lines.append("")
          md_lines.append("| Severity | Endpoint | Method | Rule | Breach Details |")
          md_lines.append("|---|---|---|---|---|")
          for b in breaking:
              md_lines.append(f"| **{b['severity']}** | `{b['path']}` | `{b['method']}` | `{b['rule']}` | {b['message']} |")
          md_lines.append("")

      if non_breaking:
          md_lines.append("## Compatible & Additive Changes")
          md_lines.append("")
          md_lines.append("| Severity | Endpoint | Method | Rule | Change Details |")
          md_lines.append("|---|---|---|---|---|")
          for nb in non_breaking:
              md_lines.append(f"| {nb['severity']} | `{nb['path']}` | `{nb['method']}` | `{nb['rule']}` | {nb['message']} |")
          md_lines.append("")

      report_md = "\n".join(md_lines)
      with open("diff_summary.md", "w", encoding="utf-8") as f:
          f.write(report_md)

      report_json = {
          "service_name": service_name,
          "verdict": verdict,
          "candidate_version": cand_version_str,
          "production_version": prod_version_str,
          "major_version_bumped": major_bump,
          "breaking_count": len(breaking),
          "non_breaking_count": len(non_breaking),
          "breaking_changes": breaking,
          "non_breaking_changes": non_breaking
      }
      with open("diff_report.json", "w", encoding="utf-8") as f:
          json.dump(report_json, f, indent=2)

      breach_lines = [f"• [{b['method']}] {b['path']} ({b['rule']}): {b['message']}" for b in breaking[:15]]
      if len(breaking) > 15:
          breach_lines.append(f"• ... and {len(breaking) - 15} more contract breach(es)")
      breach_summary_str = "\n".join(breach_lines) if breach_lines else "None. All API contract changes backwards-compatible."

      out = {
          "verdict": verdict,
          "candidate_version": cand_version_str,
          "production_version": prod_version_str,
          "major_version_bumped": major_bump,
          "breaking_count": len(breaking),
          "non_breaking_count": len(non_breaking),
          "breach_summary": breach_summary_str
      }

      print(f"Contract Diff Finished. Verdict: {verdict} ({len(breaking)} breaking, {len(non_breaking)} non-breaking)")
      try:
          from kestra import Kestra
          Kestra.outputs(out)
      except Exception:
          pass
      out_payload = json.dumps({"outputs": out})
      print(f"::{out_payload}::")

  - id: record_audit_state
    type: io.kestra.plugin.core.kv.Set
    description: "Persist the latest API contract audit state in Kestra KV store for downstream release orchestrations."
    key: "openapi_audit_{{ inputs.service_name | slugify }}"
    kvType: JSON
    value: |
      {{ {
        "service": inputs.service_name,
        "verdict": outputs.diff_openapi_contracts.vars.verdict,
        "breaking_count": outputs.diff_openapi_contracts.vars.breaking_count,
        "non_breaking_count": outputs.diff_openapi_contracts.vars.non_breaking_count,
        "candidate_version": outputs.diff_openapi_contracts.vars.candidate_version,
        "production_version": outputs.diff_openapi_contracts.vars.production_version,
        "major_bump": outputs.diff_openapi_contracts.vars.major_version_bumped,
        "execution_id": execution.id,
        "timestamp": now()
      } | toJson }}

  - id: evaluate_verdict
    type: io.kestra.plugin.core.flow.If
    description: "Evaluate the diff verdict. If BLOCKED, post contract breach alert to Slack and fail the deployment gate."
    condition: "{{ outputs.diff_openapi_contracts.vars.verdict == 'BLOCKED' }}"
    then:
      - id: alert_slack_breach
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Post detailed line-by-line contract breach alert to Slack channel."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {
            "channel": inputs.slack_channel,
            "text": "🚨 *OpenAPI Contract Breaking Change Sentinel Alert* for *" ~ inputs.service_name ~ "*!\n*Verdict:* `BLOCKED` (Breaking: " ~ outputs.diff_openapi_contracts.vars.breaking_count ~ ", Non-breaking: " ~ outputs.diff_openapi_contracts.vars.non_breaking_count ~ ")\n*Versions:* Candidate `" ~ outputs.diff_openapi_contracts.vars.candidate_version ~ "` vs Production `" ~ outputs.diff_openapi_contracts.vars.production_version ~ "` (Major Bump: " ~ (outputs.diff_openapi_contracts.vars.major_version_bumped ? "YES" : "NO") ~ ")\n\n*Contract Breaches:*\n" ~ outputs.diff_openapi_contracts.vars.breach_summary ~ "\n\n*Execution:* `" ~ execution.id ~ "`"
          } | toJson }}

      - id: block_deployment_gate
        type: io.kestra.plugin.core.execution.Fail
        description: "Halt CI/CD pipeline execution to prevent deployment of breaking API contract changes without a major version bump."
        errorMessage: "OpenAPI contract breaking change detected without authorized major SemVer bump! Service '{{ inputs.service_name }}' has {{ outputs.diff_openapi_contracts.vars.breaking_count }} breaking contract change(s). Candidate version: {{ outputs.diff_openapi_contracts.vars.candidate_version }}, Production version: {{ outputs.diff_openapi_contracts.vars.production_version }}."
    else:
      - id: log_contract_compliant
        type: io.kestra.plugin.core.log.Log
        description: "Log approval when API changes are fully backwards-compatible or authorized under a major version release."
        message: "OpenAPI contract evaluation PASSED for service '{{ inputs.service_name }}'. Verdict: {{ outputs.diff_openapi_contracts.vars.verdict }}. (Breaking changes: {{ outputs.diff_openapi_contracts.vars.breaking_count }}, Non-breaking changes: {{ outputs.diff_openapi_contracts.vars.non_breaking_count }})."

errors:
  - id: alert_execution_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the sentinel flow encounters an unexpected system error, network failure, or invalid spec format."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {
        "channel": inputs.slack_channel,
        "text": "❌ OpenAPI Contract Sentinel workflow failed unexpectedly for *" ~ inputs.service_name ~ "* in execution `" ~ execution.id ~ "`. Please verify spec endpoints and network accessibility."
      } | toJson }}

extend:
  title: "OpenAPI / Swagger Contract Breaking Change Diff Sentinel"
  metaTitle: "OpenAPI / Swagger Contract Breaking Change Diff Sentinel | Kestra"
  shortDescription: "Audit candidate OpenAPI and Swagger specs against production to detect breaking changes, enforce SemVer versioning gates, alert Slack, and block incompatible deployments."
  metaDescription: "Detect OpenAPI breaking changes against production contracts, enforce SemVer version bumps, alert Slack, and block incompatible API deployments with Kestra."
  description: |
    Shipping an unintentional breaking API change to production causes immediate client disruptions, broken mobile applications, and failed partner integrations. While API gateway schemas and OpenAPI specifications document expected service behavior, CI/CD pipelines often lack automated, semantic contract regression verification between git branches or artifact registries.

    This blueprint downloads the candidate OpenAPI or Swagger specification from your CI build artifact or staging preview, fetches the active baseline production specification from your API gateway or schema registry, and executes an automated contract diff engine. It detects removed endpoints, deleted HTTP methods, missing response schema properties, newly introduced required parameters, and narrowed enum allowable values. If breaking contract breaches are detected without an authorized major SemVer bump, execution halts immediately with `io.kestra.plugin.core.execution.Fail` to block deployment and sends a line-by-line contract breach alert to Slack.

    ## How it works

    1. **Candidate & Production Contract Fetching**: `fetch_candidate_spec` and `fetch_production_spec` (`io.kestra.plugin.core.http.Request`) retrieve the candidate API specification (from CI build artifacts or preview environment) and the current production specification (from an API gateway, schema registry, or repository). Inline spec overrides (`candidate_spec_override`, `production_spec_override`) are also supported for isolated testing or direct pipeline payloads.
    2. **Semantic OpenAPI Diff Engine**: `diff_openapi_contracts` (`io.kestra.plugin.scripts.python.Script`) executes a Python contract analysis script that parses both JSON and YAML OpenAPI 3.x and Swagger 2.0 specifications. It resolves internal `$ref` pointers and systematically analyzes:
       - **Removed Endpoints**: Endpoints present in production but deleted in the candidate spec.
       - **Removed Operations / HTTP Methods**: Methods (e.g. `GET`, `POST`, `DELETE`) deleted from existing paths.
       - **Parameter Changes**: New mandatory request parameters in path, query, or header, or existing optional parameters converted to required.
       - **Enum Narrowing**: Allowable enum values deleted from request parameters, which would break existing client requests.
       - **Response Schema Breaking Changes**: Deleted response status codes, deleted response schema properties, or changed property data types.
       - **Non-Breaking Classifications**: Additive changes such as newly added paths, optional parameters, response fields, or widened enums.
       - **SemVer Major Bump Detection**: Compares candidate `info.version` with production `info.version`. If breaking changes are accompanied by an authorized major version bump (e.g., `1.4.0` to `2.0.0`), the gate transitions to `WARNING_ACCEPTED` instead of blocking.
    3. **Audit State Persistence**: `record_audit_state` (`io.kestra.plugin.core.kv.Set`) writes the audit verdict, breaking change counts, version metadata, and execution ID to Kestra's internal Key-Value store under `openapi_audit_{service_name}`.
    4. **Conditional Deployment Gate**: `evaluate_verdict` (`io.kestra.plugin.core.flow.If`) evaluates the sentinel verdict:
       - If `BLOCKED`: Calls `alert_slack_breach` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) to post line-by-line breach diagnostics to the API governance Slack channel, and triggers `block_deployment_gate` (`io.kestra.plugin.core.execution.Fail`) to halt CI/CD execution and reject the deployment.
       - If `PASSED` or `WARNING_ACCEPTED`: Invokes `log_contract_compliant` (`io.kestra.plugin.core.log.Log`) to record successful compliance verification.
    5. **Resilient Error Notification**: The `errors` handler triggers `alert_execution_error` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) if spec endpoints are unreachable or syntax parsing fails unexpectedly.

    ## What you get

    - **Automated API Contract Sentinel**: Eliminates manual schema reviews by systematically catching breaking contract changes before deployment.
    - **5-Point Semantic Contract Coverage**: Automatically flags removed endpoints, removed HTTP methods, removed response properties, added required parameters, and narrowed enum values.
    - **SemVer Versioning Enforcement**: Allows intentional breaking changes when accompanied by a major version bump while blocking inadvertent contract breaches on minor/patch releases.
    - **Line-by-Line Slack Diagnostics**: Instant Slack notifications pinpointing the exact endpoint, HTTP method, parameter or response property, and breaking change rationale.
    - **Audit History in KV Store**: Centralized record of contract compliance status for every service across your API ecosystem.

    ## Who it's for

    - **Platform Engineering & API Governance Teams**: Enforcing consistent API design standards and preventing breaking schema changes across microservices.
    - **CI/CD & DevOps Engineers**: Integrating automated quality gates in deployment pipelines before cutover or Kubernetes rollouts.
    - **Backend Developers**: Rapidly testing proposed API changes against production specifications during pull requests.

    ## Why orchestrate this with Kestra

    - **Native Microservice Integration**: Triggerable via webhooks directly from GitHub Actions, GitLab CI, or Jenkins upon artifact publishing.
    - **Stateful Governance**: Kestra's KV store retains historical audit posture across services, providing central visibility into API contract drift over time.
    - **Flexible Execution Runtime**: Executes lightweight Python semantic diffing in isolated containers without external SaaS subscription dependencies.
    - **Conditional Workflow Control**: Native `If` and `Fail` tasks cleanly halt downstream deployment tasks only when contract violations occur.

    ## Prerequisites

    - Access to candidate and production OpenAPI/Swagger specifications accessible via HTTP/HTTPS or supplied as raw JSON/YAML payloads.
    - A Slack incoming webhook URL for team alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alerting on contract breaches or pipeline failures.
    - `OPENAPI_WEBHOOK_KEY`: Secret authentication key for the CI/CD webhook trigger.
    - In Kestra OSS, set secrets as environment variables: `SECRET_SLACK_WEBHOOK_URL` and `SECRET_OPENAPI_WEBHOOK_KEY`.

    ### Inputs

    | Input | Type | Default | Description |
    |---|---|---|---|
    | `service_name` | STRING | `customer-billing-service` | Name of the API service being evaluated |
    | `candidate_spec_url` | STRING | `https://petstore.swagger.io/v2/swagger.json` | URL of the candidate OpenAPI/Swagger specification |
    | `production_spec_url` | STRING | `https://petstore.swagger.io/v2/swagger.json` | URL of the production OpenAPI/Swagger baseline |
    | `candidate_spec_override` | STRING | `""` | Optional raw JSON/YAML candidate spec override |
    | `production_spec_override` | STRING | `""` | Optional raw JSON/YAML production spec override |
    | `allow_breaking_with_major_bump` | BOOLEAN | `true` | Allow breaking changes when major version is bumped |
    | `fail_on_breaking_changes` | BOOLEAN | `true` | Fail execution on unauthorized breaking changes |
    | `slack_channel` | STRING | `#api-governance` | Slack channel for alert notifications |

    ### Outputs

    - `outputs.diff_openapi_contracts.vars.verdict`: Sentinel decision (`PASSED`, `WARNING_ACCEPTED`, `BLOCKED`).
    - `outputs.diff_openapi_contracts.vars.breaking_count`: Total number of breaking contract changes detected.
    - `outputs.diff_openapi_contracts.vars.non_breaking_count`: Total number of compatible changes detected.
    - `outputs.diff_openapi_contracts.vars.production_version`: Baseline production specification version.
    - `outputs.diff_openapi_contracts.vars.candidate_version`: Proposed candidate specification version.
    - `outputs.diff_openapi_contracts.vars.major_version_bumped`: Boolean indicating whether major SemVer was incremented.
    - `outputs.diff_openapi_contracts.vars.breach_summary`: Formatted line-by-line summary of contract breaches.
    - `outputs.diff_openapi_contracts.outputFiles['diff_summary.md']`: Generated Markdown report file.
    - `outputs.diff_openapi_contracts.outputFiles['diff_report.json']`: Complete structured JSON diff report.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra instance.
    2. Run the flow with the default Petstore URL inputs to verify clean baseline execution (`PASSED`).
    3. Provide a candidate specification containing modified parameters or removed endpoints to observe contract breach detection and Slack alert generation.
    4. Integrate the flow into your CI/CD pipeline via webhook trigger or Kestra API execution prior to production deployment.

    ## How to extend

    - **Automated PR Commenting**: Add `io.kestra.plugin.github.pulls.Comment` to post the generated `diff_summary.md` directly to GitHub pull requests.
    - **Registry Integration**: Connect with Apollo GraphOS, Redocly, or AWS API Gateway to automatically fetch production schemas on a scheduled audit.
    - **Custom Policy Rules**: Extend the Python diff script with company-specific rules such as requiring description tags or enforcing kebab-case path conventions.

