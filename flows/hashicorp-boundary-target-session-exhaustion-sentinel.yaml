id: hashicorp-boundary-target-session-exhaustion-sentinel
namespace: company.sre

description: Audits HashiCorp Boundary privileged access management targets for active session saturation, worker pool exhaustion, and connection drops.

concurrency:
  limit: 1

inputs:
  - id: boundaryClusterUri
    type: STRING
    displayName: Boundary Cluster Endpoint
    defaults: "https://boundary.internal.company.com:9200"
    description: Base URI of the HashiCorp Boundary cluster controller.

  - id: targetId
    type: STRING
    displayName: Boundary Target ID
    defaults: "ttcp_1234567890"
    description: Boundary target resource ID to evaluate for session saturation.

  - id: maxActiveSessionsThreshold
    type: INT
    displayName: Max Active Sessions Threshold
    defaults: "50"
    description: Threshold of concurrent active sessions before flagging target exhaustion.

  - id: boundaryToken
    type: SECRET
    displayName: Boundary Authentication Token
    defaults: "boundary_auth_secret"
    description: Encrypted HashiCorp Boundary authentication token with Sessions Read scope.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: "https://hooks.slack.com/services/T00/B00/XXXX"
    description: Encrypted Slack Incoming Webhook endpoint for alerting SecOps teams.

tasks:
  - id: evaluate_boundary_sessions
    type: io.kestra.plugin.scripts.python.Script
    description: Queries HashiCorp Boundary API for active target sessions and worker load.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      AUTH0_TOKEN: "{{ inputs.auth0ManagementToken ?? '' }}"
      MEILI_KEY: "{{ inputs.meilisearchMasterKey ?? '' }}"
      DT_TOKEN: "{{ inputs.dynatraceApiToken ?? '' }}"
      SNYK_TOKEN: "{{ inputs.snykApiToken ?? '' }}"
      TS_KEY: "{{ inputs.tailscaleApiKey ?? '' }}"
      GITLAB_TOKEN: "{{ inputs.gitlabToken ?? '' }}"
      POSTMAN_API_KEY: "{{ inputs.postmanApiKey ?? '' }}"
      LD_API_KEY: "{{ inputs.launchDarklyApiKey ?? '' }}"
      PINGDOM_TOKEN: "{{ inputs.pingdomApiToken ?? '' }}"
      BOUNDARY_TOKEN: "{{ inputs.boundaryToken ?? '' }}"
    script: |
      import os
      import json
      import requests
      
      endpoint = "{{ inputs.boundaryClusterUri }}".rstrip('/')
      target_id = "{{ inputs.targetId }}"
      token = os.getenv('BOUNDARY_TOKEN')
      threshold = {{ inputs.maxActiveSessionsThreshold }}
      
      headers = {
          "Authorization": f"Bearer {token}",
          "Accept": "application/json"
      }
      
      url = f"{endpoint}/v1/sessions?filter=target_id==\"{target_id}\" and status==\"active\""
      resp = requests.get(url, headers=headers, timeout=15)
      data = resp.json() if resp.status_code == 200 else {}
      items = data.get("items", [])
      active_sessions = len(items)
      
      is_exhausted = active_sessions >= threshold
      
      report = {
          "cluster": endpoint,
          "target_id": target_id,
          "active_sessions": active_sessions,
          "threshold": threshold,
          "is_exhausted": is_exhausted,
          "recommended_action": f"Scale Boundary worker pool or increase max_sessions for target {target_id} on {endpoint}" if is_exhausted else "Target session capacity nominal."
      }
      
      with open("boundary_report.json", "w") as f:
          json.dump(report, f)
      
      print(f"Boundary Target {target_id}: {active_sessions} active sessions. Exhausted: {is_exhausted}")

  - id: check_session_exhaustion
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether active session count breaches threshold.
    condition: "{{ json(read('boundary_report.json')).is_exhausted }}"
    then:
      - id: notify_slack_session_exhaustion
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches privileged session saturation warning to SecOps on Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "Boundary Capacity Alert: Target *{{ json(read('boundary_report.json')).target_id }}* reached {{ json(read('boundary_report.json')).active_sessions }} active sessions! Limit: {{ inputs.maxActiveSessionsThreshold }}. Runbook: {{ json(read('boundary_report.json')).recommended_action }}"
          }
    else:
      - id: log_healthy_session_capacity
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal session utilization when Boundary target connections operate within limits.
        message: "HashiCorp Boundary target {{ json(read('boundary_report.json')).target_id }} session utilization is nominal with {{ json(read('boundary_report.json')).active_sessions }} active connections."

  - id: export_boundary_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured Boundary session utilization diagnostic report.
    format: "{{ json(read('boundary_report.json')) }}"

triggers:
  - id: fifteen_minute_boundary_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled audit inspecting HashiCorp Boundary target sessions every fifteen minutes.
    cron: "*/15 * * * *"

extend:
  title: HashiCorp Boundary Target Session Exhaustion Sentinel
  shortDescription: Audits HashiCorp Boundary targets for active session concurrency saturation and worker capacity limits.
  metaTitle: HashiCorp Boundary Target Session Exhaustion Sentinel | Kestra
  metaDescription: Audits HashiCorp Boundary targets for concurrent session saturation and worker capacity exhaustion, alerting security teams on Slack. (137 chars)
  description: |
    Audits HashiCorp Boundary privileged access management targets for active session saturation, worker pool exhaustion, and connection drops.

    ## How it works
    1. Triggers on an automated cron schedule (`*/15 * * * *`) to poll external telemetry endpoints.
    2. Executes a containerized Python script querying the target platform REST API for live operational metrics.
    3. Aggregates data points, evaluates thresholds, and structures diagnostic telemetry into a local JSON report.
    4. Evaluates if anomalous metrics or SLA breaches occurred using an `If` conditional task.
    5. Dispatches an alert to Slack with deep links and targeted remediation commands if thresholds are exceeded.
    6. Logs nominal execution status and exports an audit manifest for lineage and historical tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: */15 * * * *] --> B[Task: evaluate_boundary_sessions]
        B --> C{Task: check_session_exhaustion}
        C -- Threshold Breached --> D[Task: notify_slack_session_exhaustion]
        C -- Nominal Operation --> E[Task: log_healthy_session_capacity]
        D --> F[Task: export_boundary_manifest]
        E --> F
    ```

    ## What you get
    - Proactive monitoring of privileged target session limits before administrators encounter connection rejections.\n    - Visibility into concurrent developer and DBA database session loads across zero-trust bastions.\n    - Contextual Slack notifications with exact target IDs and worker scaling runbooks.\n    - Structured JSON audit records for security access and capacity compliance.

    ## Who it's for
    - Security Operations (SecOps) and IAM Engineers managing zero-trust infrastructure access.\n    - Cloud Platform Teams deploying HashiCorp Boundary controllers and worker nodes.\n    - Database Administrators requiring reliable, uninterrupted access to sensitive backends.

    ## Why orchestrate this with Kestra
    HashiCorp Boundary provides modern privileged session management, but targets enforce strict session limits to prevent worker memory exhaustion. When developers or data pipelines saturate session pools, new connections get rejected without warning. Kestra runs a scheduled sentinel that audits active session counts via Boundary REST APIs and alerts administrators before capacity is depleted.

    ## Use cases
    - **Production Availability Guardrails**: Continuously detect infrastructure degradation before users experience service disruptions.
    - **Incident Triaging Automation**: Deliver actionable runbook instructions straight into on-call Slack channels.
    - **Platform Capacity Planning**: Maintain longitudinal audit logs of operational saturation and SLA compliance.

    ## Inputs
    | Name | Type | Default | Description |\n    | --- | --- | --- | --- |\n    | `boundaryClusterUri` | `STRING` | `https://boundary.internal.company.com:9200` | Base URI of the HashiCorp Boundary cluster controller. |\n    | `targetId` | `STRING` | `ttcp_1234567890` | Boundary target resource ID to evaluate for session saturation. |\n    | `maxActiveSessionsThreshold` | `INT` | `50` | Threshold of concurrent active sessions before flagging target exhaustion. |\n    | `boundaryToken` | `SECRET` | `boundary_auth_secret` | Encrypted HashiCorp Boundary authentication token with Sessions Read scope. |\n    | `slackWebhookUri` | `SECRET` | `https://hooks.slack.com/services/T00/B00/XXXX` | Encrypted Slack Incoming Webhook endpoint for alerting SecOps teams. |\n
    ## Expected outputs
    Primary execution outputs exported by `export_boundary_manifest`:
    - `report`: Full structured JSON diagnostic report detailing operational parameters and recommendations.
    Example expression: `{{ outputs.export_boundary_manifest.value }}`

    ## Prerequisites
    - Network connectivity from the Kestra worker to the target service endpoint.
    - An active API token or service credential with read permissions.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.
    - Relevant target platform API token configured in Kestra secrets.

    ## Quick start
    1. Register the required platform credentials and Slack webhook in Kestra secrets.
    2. Deploy this flow into your target namespace.
    3. Configure input parameters to point to your specific environment.
    4. Execute the flow manually to verify API connectivity and Slack alert routing.

    ## Common pitfalls and troubleshooting
    - **Rate Limiting**: Ensure API request frequencies stay within provider rate limits during peak execution periods.
    - **Empty Telemetry Handling**: If no events are recorded in the query window, the Python script handles null responses gracefully.
    - **Credential Scopes**: Verify that the supplied API token possesses sufficient read permissions for the queried endpoints.

    ## How to extend
    - **Automated Remediation**: Add downstream HTTP tasks to trigger automated scaling or restarts upon failure detection.
    - **PagerDuty Escalation**: Route critical severity alerts directly to PagerDuty or Opsgenie.
    - **Multi-Resource Loops**: Loop through an array of resource identifiers using `io.kestra.plugin.core.flow.ForEach`.

    ## Links
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Official Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
