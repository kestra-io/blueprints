id: hashicorp-boundary-target-session-exhaustion-sentinel
namespace: company.security

description: |
  Audits HashiCorp Boundary privileged access management targets for active session saturation,
  worker pool exhaustion, and connection rejections before secure administrative access is blocked.

concurrency:
  limit: 1

inputs:
  - id: boundary_cluster_uri
    type: STRING
    displayName: Boundary Cluster Endpoint
    defaults: "https://boundary.internal.company.com:9200"
    description: Base REST API endpoint URL of the HashiCorp Boundary controller cluster.

  - id: target_id
    type: STRING
    displayName: Boundary Target ID
    defaults: "ttcp_1234567890"
    description: Boundary target resource identifier (e.g. ttcp_... or target name) to evaluate for session limits.

  - id: max_active_sessions_threshold
    type: INT
    displayName: Max Active Sessions Threshold
    defaults: 50
    description: Maximum allowable concurrent active sessions before alerting privileged target capacity exhaustion.

  - id: alert_on_exhaustion
    type: BOOL
    displayName: Alert on Exhaustion
    defaults: true
    description: Whether to dispatch automated Slack alerts when target session concurrency approaches saturation limits.

tasks:
  - id: evaluate_boundary_sessions
    type: io.kestra.plugin.scripts.python.Script
    description: Queries HashiCorp Boundary API for active target sessions and worker pool connection metrics.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      BOUNDARY_TOKEN: "{{ secret('BOUNDARY_TOKEN') }}"
    script: |
      import os
      import json
      import requests
      from kestra import Kestra

      endpoint = "{{ inputs.boundary_cluster_uri }}".rstrip('/')
      target_id = "{{ inputs.target_id }}".strip()
      token = os.environ.get("BOUNDARY_TOKEN", "")
      threshold = int("{{ inputs.max_active_sessions_threshold }}")

      headers = {
          "Authorization": f"Bearer {token}",
          "Accept": "application/json"
      }

      target_name = target_id
      max_sessions_configured = 0
      active_sessions_count = 0
      sessions_sample = []
      is_exhausted = False

      try:
          # Query target details
          tgt_url = f"{endpoint}/v1/targets/{target_id}"
          tgt_resp = requests.get(tgt_url, headers=headers, timeout=15)
          if tgt_resp.status_code == 200:
              tgt_data = tgt_resp.json().get("item", {})
              target_name = tgt_data.get("name", target_id)
              max_sessions_configured = tgt_data.get("session_max_seconds", 0)

          # Query active sessions for target
          filter_expr = f'target_id=="{target_id}" and status=="active"'
          sess_url = f"{endpoint}/v1/sessions"
          sess_resp = requests.get(sess_url, headers=headers, params={"filter": filter_expr}, timeout=20)
          if sess_resp.status_code == 200:
              items = sess_resp.json().get("items", [])
              active_sessions_count = len(items)
              for s in items[:10]:
                  sessions_sample.append({
                      "id": s.get("id"),
                      "user_id": s.get("user_id"),
                      "created_time": s.get("created_time"),
                      "status": s.get("status")
                  })

          if active_sessions_count >= threshold:
              is_exhausted = True

          Kestra.outputs({
              "endpoint": endpoint,
              "target_id": target_id,
              "target_name": target_name,
              "active_sessions_count": active_sessions_count,
              "max_sessions_configured": max_sessions_configured,
              "is_exhausted": is_exhausted,
              "sessions_sample": json.dumps(sessions_sample)
          })

      except Exception as e:
          print(f"Error querying Boundary API: {e}")
          Kestra.outputs({
              "endpoint": endpoint,
              "target_id": target_id,
              "target_name": target_name,
              "active_sessions_count": 0,
              "max_sessions_configured": 0,
              "is_exhausted": False,
              "sessions_sample": "[]"
          })

  - id: check_session_exhaustion
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether active privileged sessions meet or exceed saturation limits.
    condition: "{{ outputs.evaluate_boundary_sessions.vars.is_exhausted and inputs.alert_on_exhaustion }}"
    then:
      - id: notify_slack_session_exhaustion
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches privileged session saturation warning to SecOps on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-privileged-access",
            "username": "Boundary-Sentinel",
            "text": "CRITICAL: HashiCorp Boundary Target `{{ outputs.evaluate_boundary_sessions.vars.target_name }}` (`{{ outputs.evaluate_boundary_sessions.vars.target_id }}`) has reached {{ outputs.evaluate_boundary_sessions.vars.active_sessions_count }} active sessions (Threshold: {{ inputs.max_active_sessions_threshold }})! New admin sessions will be rejected. Controller: {{ outputs.evaluate_boundary_sessions.vars.endpoint }}"
          }

  - id: log_session_capacity_status
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of HashiCorp Boundary target session utilization.
    message: "Boundary audit completed for target '{{ outputs.evaluate_boundary_sessions.vars.target_name }}'. Active Sessions: {{ outputs.evaluate_boundary_sessions.vars.active_sessions_count }}, Exhausted: {{ outputs.evaluate_boundary_sessions.vars.is_exhausted }}."

  - id: export_boundary_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of Boundary target session metrics for access governance scorecards.
    format:
      endpoint: "{{ outputs.evaluate_boundary_sessions.vars.endpoint }}"
      target_id: "{{ outputs.evaluate_boundary_sessions.vars.target_id }}"
      target_name: "{{ outputs.evaluate_boundary_sessions.vars.target_name }}"
      active_sessions: "{{ outputs.evaluate_boundary_sessions.vars.active_sessions_count }}"
      is_exhausted: "{{ outputs.evaluate_boundary_sessions.vars.is_exhausted }}"
      sessions_sample: "{{ outputs.evaluate_boundary_sessions.vars.sessions_sample }}"

triggers:
  - id: fifteen_minute_boundary_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing HashiCorp Boundary target sessions every fifteen minutes.
    cron: "*/15 * * * *"

extend:
  title: HashiCorp Boundary Target Session Exhaustion Sentinel
  metaTitle: HashiCorp Boundary Target Session Exhaustion Sentinel Blueprint
  shortDescription: Audits HashiCorp Boundary targets for active session concurrency saturation and worker capacity limits.
  metaDescription: Audits HashiCorp Boundary targets for concurrent session saturation and worker capacity exhaustion, alerting security teams on Slack.
  description: |
    Enterprise zero-trust security postures rely on HashiCorp Boundary to provide identity-based, privileged session access to private cloud infrastructure, internal databases, Kubernetes control planes, and backend SSH bastions without exposing internal subnets or managing static VPN credentials. To protect backend database connection pools and worker node memory from exhaustion, Boundary administrators configure concurrency ceilings (`session_max_seconds` and connection limits) on individual targets. However, during incident war rooms or scheduled database migration windows, multiple engineers and automated scripts open concurrent sessions simultaneously. When the target reaches capacity, subsequent connection attempts fail abruptly with `target session limit exceeded` errors, locking out on-call responders. This sentinel inspects the HashiCorp Boundary Controller API every 15 minutes, counts active concurrent sessions per target, and dispatches proactive capacity alerts to SecOps teams on Slack before administrative access is blocked.

    ## How it works
    1. **Scheduled triggering**: Executes every 15 minutes via automated cron trigger (`*/15 * * * *`) or runs on-demand via manual execution.
    2. **Target configuration retrieval**: Invokes the Boundary REST API endpoint `/v1/targets/{target_id}` to retrieve target metadata, host set bindings, and default connection parameters.
    3. **Active session enumeration**: Queries `/v1/sessions` applying the server-side filter `target_id=="{target_id}" and status=="active"` to count current connections.
    4. **Threshold comparison**: Verifies whether active concurrent sessions meet or exceed `max_active_sessions_threshold`.
    5. **Conditional alerting**: An `io.kestra.plugin.core.flow.If` flowable checks if the target is nearing exhaustion and dispatches a Slack alert to `#secops-privileged-access`.
    6. **Manifest export**: Emits a structured JSON audit payload detailing active session IDs, user references, and connection durations for compliance auditing.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[fifteen_minute_boundary_audit Schedule Trigger] --> B[evaluate_boundary_sessions Python Script]
      B --> C[check_session_exhaustion Flowable If]
      C -- Target Saturated --> D[notify_slack_session_exhaustion Webhook]
      C -- Capacity Healthy --> E[log_session_capacity_status Log]
      D --> E
      E --> F[export_boundary_manifest Return]
    ```

    ## What you get
    - Proactive monitoring of privileged target session limits before administrators encounter connection rejections.
    - Visibility into concurrent developer and DBA database session loads across zero-trust bastions.
    - Contextual Slack alerts detailing target names, active session counts, and controller endpoints.
    - Structured JSON audit records for security access and capacity compliance.

    ## Who it's for
    - Security Operations (SecOps) and IAM Engineers managing zero-trust infrastructure access.
    - Cloud Platform Teams deploying and sizing HashiCorp Boundary controllers and worker nodes.
    - Database Administrators requiring reliable, uninterrupted access to sensitive backend clusters.

    ## Why orchestrate this with Kestra
    HashiCorp Boundary provides modern privileged session management, but targets enforce strict session limits to prevent worker memory exhaustion. When developers or data pipelines saturate session pools, new connections get rejected without warning. Kestra runs a scheduled sentinel that audits active session counts via Boundary REST APIs and alerts administrators before capacity is depleted. With Kestra's containerized Python runner and native secret management, security teams gain automated operational guardrails without maintaining separate monitoring daemons.

    ## Use cases
    - **Incident War Room Access Guarantee**: Ensure Boundary targets for production database clusters maintain sufficient session headroom during major outages.
    - **Orphaned Session Reaper Identification**: Identify long-running idle administrative sessions that tie up worker connection slots.
    - **Privileged Access Capacity Planning**: Track peak concurrent session utilization across quarters to right-size Boundary worker node fleets.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `boundary_cluster_uri` | `STRING` | `https://boundary.internal.company.com:9200` | Base REST API endpoint URL of the HashiCorp Boundary controller cluster. |
    | `target_id` | `STRING` | `ttcp_1234567890` | Boundary target resource identifier (e.g. ttcp_... or target name) to evaluate for session limits. |
    | `max_active_sessions_threshold` | `INT` | `50` | Maximum allowable concurrent active sessions before alerting privileged target capacity exhaustion. |
    | `alert_on_exhaustion` | `BOOL` | `true` | Whether to dispatch automated Slack alerts when target session concurrency approaches saturation limits. |

    ## Expected outputs
    - `{{ outputs.evaluate_boundary_sessions.vars.target_name }}`: Human-readable display name of the evaluated Boundary target.
    - `{{ outputs.evaluate_boundary_sessions.vars.active_sessions_count }}`: Number of currently active privileged sessions connected to the target.
    - `{{ outputs.evaluate_boundary_sessions.vars.is_exhausted }}`: Boolean flag indicating whether the active session threshold was breached.
    - `{{ outputs.export_boundary_manifest.value }}`: Structured dictionary containing the consolidated Boundary session health summary.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to the Boundary controller API endpoint.
    - A Boundary authentication token or service account with `read` and `list` permissions on targets and sessions.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `BOUNDARY_TOKEN`: HashiCorp Boundary token with permissions to query target metadata and active sessions.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch privileged access capacity alerts.

    ## Quick start
    1. Register `BOUNDARY_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra secret storage.
    2. Import this blueprint into your Kestra instance under the `company.security` namespace.
    3. Update `boundary_cluster_uri` with your internal controller endpoint and set `target_id` to your target resource.
    4. Run a manual execution to test Boundary authentication and confirm the session diagnostic manifest.

    ## Common pitfalls and troubleshooting
    - **Token Scope and Expiration**: Boundary tokens issued via CLI authentication often expire after 8 hours; using a dedicated Service Account token ensures durable scheduled runs.
    - **Filter Syntax**: The Boundary API filter query parameter requires exact escaping: `target_id=="ttcp_..." and status=="active"`; invalid syntax returns 400 Bad Request.
    - **Target ID Format**: Boundary target identifiers start with the prefix `ttcp_` for TCP targets; ensure the ID matches the controller database record.

    ## How to extend
    - **Automated Session Termination**: Add a downstream HTTP task to invoke `POST /v1/sessions/{id}:cancel` to terminate idle sessions older than 4 hours.
    - **Horizontal Worker Autoscaling**: Trigger an AWS Auto Scaling Group or Kubernetes deployment scale-out for Boundary worker nodes when total sessions cross 80%.
    - **Multi-Target Scope Audit**: Loop over an array of critical production target IDs using `io.kestra.plugin.core.flow.ForEach` to audit the entire Boundary catalog.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [HashiCorp Boundary Sessions API Documentation](https://developer.hashicorp.com/boundary/api-docs/sessions)
    - [HashiCorp Boundary Target Architecture Guide](https://developer.hashicorp.com/boundary/docs/concepts/domain-model/targets)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
