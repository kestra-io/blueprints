id: gcp-gcs-bucket-retention-lifecycle-drift-sentinel
namespace: company.cloud

inputs:
  - id: project_id
    type: STRING
    description: Google Cloud Project ID.
  - id: bucket_name
    type: STRING
    description: GCS bucket name to audit for lifecycle expiration rules.

tasks:
  - id: check_bucket_lifecycle
    type: io.kestra.plugin.gcp.cli.GCloudCLI
    projectId: "{{ inputs.project_id }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    commands:
      - |
        gcloud storage buckets describe "gs://{{ inputs.bucket_name }}" --format=json > /tmp/bucket_meta.json
        
        RULES_COUNT=$(jq '.lifecycle.rule | length // 0' /tmp/bucket_meta.json)
        DELETE_RULES=$(jq '[.lifecycle.rule[]? | select(.action.type == "Delete")] | length' /tmp/bucket_meta.json)
        
        echo "::set-output name=rules_count::$RULES_COUNT::"
        echo "::set-output name=delete_rules::$DELETE_RULES::"

  - id: evaluate_lifecycle_drift
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_bucket_lifecycle.vars.delete_rules | int == 0 }}"
    then:
      - id: notify_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#finops-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "💰 GCS Bucket Missing Lifecycle Policy Drift Detected",
                "text": "Bucket `gs://{{ inputs.bucket_name }}` in project `{{ inputs.project_id }}` has NO object deletion or expiration lifecycle rules configured! Impact: Temporary logs, scratch artifacts, or staging datasets accumulate indefinitely, leading to unbounded storage cost leaks.",
                "footer": "Kestra FinOps Sentinel • Google Cloud Storage"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#finops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Google Cloud Storage (GCS) Bucket Lifecycle Policy Drift Sentinel Pipeline Failure",
            "text": "Failed to inspect GCS bucket metadata. Verify bucket name and IAM permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      project_id: replace-with-your-project-id
      bucket_name: replace-with-your-bucket-name

extend:
  metaDescription: "Audits Google Cloud Storage bucket lifecycle configurations to detect missing object expiration rules and prevent cost leaks."
  metaTitle: Google Cloud Storage (GCS) Bucket Lifecycle Policy Drift Sentinel with Kestra
  title: Google Cloud Storage (GCS) Bucket Lifecycle Policy Drift Sentinel
  shortDescription: Audits Google Cloud Storage bucket lifecycle configurations to detect missing object expiration rules and prevent cost leaks.
  description: |
    ## How it works
    This workflow executes `gcloud storage buckets describe` to inspect the `lifecycle.rule` block of the target GCS bucket. In cloud data architectures, buckets designated for intermediate staging, access logs, or temporary pipeline exports often lack lifecycle management. Without automated `Delete` actions after 30 or 90 days, terabytes of dead data accumulate, driving up recurring cloud storage bills. Slack is alerted when expiration rules are absent.

    ## What you get
    - Continuous FinOps audit of Google Cloud Storage bucket lifecycle configurations.
    - Prevents runaway object accumulation in temporary and staging buckets.
    - Enforces corporate data retention hygiene and compliance policies.

    ## Who it's for
    - FinOps Practitioners and Cloud Economics Engineers managing GCP spend.
    - Data Engineers and Platform Administrators managing GCS data lakes.

    ## Why orchestrate this with Kestra
    - **Native GCloud Storage Integration**: Queries bucket metadata securely without custom Python code.
    - **Continuous Compliance**: Detect policy drift introduced by manual bucket creations or Terraform gaps.
    - **Actionable Guidance**: Direct alerts provide immediate recommendations for lifecycle configuration.

    ## Prerequisites
    - Google Cloud Storage bucket accessible via service account.
    - Secrets `GCP_SERVICE_ACCOUNT` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure project ID and target bucket name.
    3. Run the workflow to verify lifecycle rule enforcement.

    ## How to extend
    - Automatically apply a standard 30-day deletion rule via `gcloud storage buckets update`.
    - Audit all buckets in a GCP project dynamically using a loop task.

    ## Links
    - [Google Cloud Storage Object Lifecycle Documentation](https://cloud.google.com/storage/docs/lifecycle)
    - [Kestra GCloud CLI Plugin](https://kestra.io/plugins/plugin-gcp/io.kestra.plugin.gcp.gcloud.gcloudcli)
  tags:
    - Cloud
    - Business
  subTags:
    - GCP Services
    - Infrastructure Automation
  ee: false
  demo: false
