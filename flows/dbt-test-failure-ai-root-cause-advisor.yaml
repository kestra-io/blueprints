id: dbt-test-failure-ai-root-cause-advisor
namespace: company.analytics

description: |
  Automated analytics engineering triage pipeline that ingests dbt test failure artifacts,
  diagnoses root causes such as unhandled nulls, duplicate keys, and join fan-outs using Google Gemini,
  generates SQL remediation diffs, and alerts data teams in Slack.

triggers:
  - id: scheduled_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Morning test failure sweep following nightly dbt transformations. Shipped disabled by default.
    cron: "0 7 * * 1-5"
    disabled: true

  - id: webhook_dbt_test_failed
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook for CI/CD or dbt Cloud failure notifications.
    key: "{{ secret('WEBHOOK_KEY') }}"

inputs:
  - id: model_name
    type: STRING
    defaults: fct_customer_orders
    description: Target dbt model that failed validation.

  - id: test_name
    type: STRING
    defaults: unique_fct_customer_orders_order_id
    description: Name of the failed dbt generic or singular test.

  - id: failure_count
    type: INT
    defaults: 14
    description: Number of failing records returned by the dbt test query.

  - id: compiled_test_sql
    type: STRING
    defaults: |
      select order_id, count(*) as n_records
      from analytics.fct_customer_orders
      group by order_id
      having count(*) > 1
    description: Compiled SQL query executed by dbt that yielded failing rows.

  - id: upstream_model_sql
    type: STRING
    defaults: |
      select
          o.order_id,
          o.customer_id,
          o.order_date,
          p.payment_method,
          o.total_amount
      from raw.orders o
      left join raw.payments p on o.order_id = p.order_id
    description: Upstream model SQL query containing the source transformation logic.

tasks:
  - id: diagnose_dbt_failure
    type: io.kestra.plugin.ai.agent.AIAgent
    description: Uses Gemini 2.5 Flash to analyze test compilation and upstream SQL, determining the exact cause of data duplication or null anomalies.
    provider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      apiKey: "{{ secret('GEMINI_API_KEY') }}"
      modelName: gemini-2.5-flash
    configuration:
      temperature: 0.1
      maxToken: 4096
      responseFormat:
        type: JSON
        jsonSchema:
          type: object
          required:
            - model_name
            - test_name
            - severity
            - failure_category
            - root_cause_explanation
            - recommended_sql_diff
            - prevention_guidance
          properties:
            model_name:
              type: string
            test_name:
              type: string
            severity:
              type: string
              enum:
                - CRITICAL
                - HIGH
                - MEDIUM
            failure_category:
              type: string
              enum:
                - JOIN_FANOUT
                - NULL_SPIKE
                - RELATIONSHIP_MISMATCH
                - SYNTAX_OR_SCHEMA_CHANGE
            root_cause_explanation:
              type: string
            recommended_sql_diff:
              type: string
            prevention_guidance:
              type: string
    prompt: |
      You are a Staff Analytics Engineer diagnosing a failing dbt test in a production data warehouse.
      Analyze the failed test execution and upstream model code below:

      Model: {{ inputs.model_name }}
      Failed Test: {{ inputs.test_name }}
      Failing Record Count: {{ inputs.failure_count }}

      Compiled Test SQL:
      \"\"\"
      {{ inputs.compiled_test_sql }}
      \"\"\"

      Upstream Model SQL:
      \"\"\"
      {{ inputs.upstream_model_sql }}
      \"\"\"

      Tasks:
      1. Pinpoint why the test failed (e.g. one-to-many join fan-out between orders and payments causing order_id duplication).
      2. Categorize the failure and assign an objective severity rating based on downstream BI impact.
      3. Provide the corrected SQL transformation code that resolves the cardinality or null issue.
      4. Suggest a prevention strategy (such as dbt unit tests or pre-join CTE aggregations).

  - id: render_remediation_brief
    type: io.kestra.plugin.scripts.python.Script
    description: Formats structured AI diagnosis and recommended SQL diff into a markdown engineering brief stored in execution artifacts.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import json

      raw_response = """{{ outputs.diagnose_dbt_failure.text }}"""
      data = json.loads(raw_response, strict=False)

      model = data.get("model_name", "{{ inputs.model_name }}")
      test = data.get("test_name", "{{ inputs.test_name }}")
      sev = data.get("severity", "HIGH")
      cat = data.get("failure_category", "UNKNOWN")
      explanation = data.get("root_cause_explanation", "")
      sql_diff = data.get("recommended_sql_diff", "")
      prevention = data.get("prevention_guidance", "")

      markdown = f"""# DBT TEST FAILURE ROOT CAUSE & REMEDIATION BRIEF
      ## Incident Metadata
      - **Target Model**: `{model}`
      - **Failed Test**: `{test}`
      - **Severity**: **{sev}**
      - **Category**: `{cat}`

      ## Root Cause Diagnosis
      {explanation}

      ## Recommended SQL Remediation
      ```sql
      {sql_diff}
      ```

      ## Prevention & Best Practices
      {prevention}
      """

      with open("dbt-remediation-brief.md", "w") as f:
          f.write(markdown)
      print("Generated dbt-remediation-brief.md")
    outputFiles:
      - dbt-remediation-brief.md

  - id: triage_routing_gate
    type: io.kestra.plugin.core.flow.If
    description: Escalates high and critical severity model test failures to urgent Slack triage channels.
    condition: "{{ json(outputs.diagnose_dbt_failure.text).severity == 'CRITICAL' || json(outputs.diagnose_dbt_failure.text).severity == 'HIGH' }}"
    then:
      - id: alert_urgent_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts urgent analytics engineering channel with root cause and remediation diff.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#analytics-alerts-urgent",
            "text": "🚨 *dbt Test Failure*: Model `{{ inputs.model_name }}` failed test `{{ inputs.test_name }}` ({{ inputs.failure_count }} failing rows).\n*Category*: `{{ json(outputs.diagnose_dbt_failure.text).failure_category }}` (Severity: {{ json(outputs.diagnose_dbt_failure.text).severity }})\n*Diagnosis*: {{ json(outputs.diagnose_dbt_failure.text).root_cause_explanation }}\nRemediation brief generated in Kestra storage."
          }
    else:
      - id: notify_standard_feed
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches standard priority notice to data team log channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#data-team-feed",
            "text": "⚠️ *dbt Test Warning*: Model `{{ inputs.model_name }}` test failed. Diagnosis completed with severity `{{ json(outputs.diagnose_dbt_failure.text).severity }}`."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on-call engineering channel if diagnosis or report rendering encounters an unhandled error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#analytics-ops",
        "text": "⚠️ *Pipeline Error*: dbt root cause advisor `{{ flow.id }}` failed on execution `{{ execution.id }}`."
      }

extend:
  title: dbt Test Failure AI Root Cause and Remediation Advisor
  shortDescription: Ingests failed dbt test results, diagnoses join fan-outs and null spikes with Gemini, and generates SQL fix briefs.
  metaTitle: dbt Test Failure AI Root Cause Advisor | Kestra
  metaDescription: Ingest failed dbt tests, diagnose join fan-outs and null anomalies with Gemini AI, and generate SQL remediation briefs automatically.
  description: |
    Data transformations orchestrated with dbt rely on data tests (`unique`, `not_null`, `relationships`, and custom singular assertions) to ensure dimensional integrity before downstream BI dashboards refresh. However, when nightly batch runs fail with cryptic errors (such as `14 records returned where count > 1`), on-call analytics engineers face significant toil.

    Engineers must manually copy compiled SQL queries from target folders, trace macro expansions, inspect database catalogs, and determine whether the duplication stemmed from a join fan-out, unhandled null keys, or upstream schema drift.

    This blueprint automates dbt failure triage. When a test fails in dbt Core or dbt Cloud, webhook integration triggers Kestra with the failed test context. An AI agent powered by Google Gemini analyzes the compiled test query and upstream transformation logic, determines the exact failure mechanism (e.g. 1-to-many payment relationship inflating order rows), categorizes severity, and generates an executable SQL remediation diff. High-severity failures immediately dispatch an executive triage card to Slack with actionable remediation steps.

    ## How it works

    1. `diagnose_dbt_failure` (`ai.agent.AIAgent`): Ingests the failing model name, test query, and upstream transformation SQL, using `gemini-2.5-flash` with a strict JSON schema to diagnose the failure mechanism, evaluate BI impact, and formulate corrected SQL.
    2. `render_remediation_brief` (`scripts.python.Script`): Transforms the diagnosis into a downloadable `dbt-remediation-brief.md` markdown report containing root cause explanations and ready-to-apply SQL code blocks.
    3. `triage_routing_gate` (`core.flow.If`):
       - **High / Critical Severity:** Alerts `#analytics-alerts-urgent` in Slack with the diagnosis summary and a direct link to the remediation artifact.
       - **Standard Severity:** Records the finding in `#data-team-feed` for routine sprint review.
    4. `alert_on_failure` (`errors` block): Catches unexpected script execution errors and notifies the analytics operations team.
    5. Triggers: Morning post-transformation sweep schedule (`disabled: true` by default) plus an authenticated `Webhook` trigger for CI/CD and dbt Cloud failure webhooks.

    ## What you get

    - Instant root cause explanation for complex join fan-outs and unexpected duplicates.
    - Actionable SQL diffs ready for copy-pasting into pull requests to unblock pipeline runs.
    - Automated severity triage preventing minor test warnings from waking up on-call engineers.

    ## Who it's for

    - Analytics Engineers and Analytics Team Leads maintaining production dbt projects.
    - Data Engineers orchestrating lakehouse and warehouse ELT pipelines.
    - BI Engineers responsible for executive dashboard metrics accuracy.

    ## Why orchestrate this with Kestra

    Writing custom notification webhooks inside dbt packages or shell scripts creates brittle pipelines without persistent artifacts or AI capabilities. Kestra provides declarative DAG orchestration, secure API key management, native Python execution, and structured AI agent tasks for automated triage.

    ## Prerequisites

    - Google Gemini API key with access to `gemini-2.5-flash`.
    - Slack incoming webhook endpoint for analytics alerts.

    ### Secrets

    - `GEMINI_API_KEY`: API key for Google Gemini model inference.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for analytics alert channels.
    - `WEBHOOK_KEY`: Authentication secret for event-driven webhook invocation.

    ## Quick start

    1. Set `GEMINI_API_KEY`, `SLACK_WEBHOOK_URL`, and `WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Click **Execute** in the Kestra UI to run the blueprint against the default customer orders join fan-out test.
    3. Download `dbt-remediation-brief.md` from the Outputs tab and review the Slack card.

    ## How to extend

    - Add an upstream task to fetch `run_results.json` and `manifest.json` directly from AWS S3, Google Cloud Storage, or the dbt Cloud Administrative API.
    - Connect GitHub or GitLab plugins inside `triage_routing_gate` to automatically open a bug issue with the recommended SQL fix attached.

    ## Links

    - [Kestra AI Plugin](https://kestra.io/plugins/plugin-ai)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python)
    - This blueprint has been created by [sheikhlimon](https://github.com/sheikhlimon)
  tags:
    - Data
    - AI
    - Core
  subTags:
    - dbt Transformations
    - Testing & Quality
  ee: false
  demo: false
