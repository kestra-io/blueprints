id: airflow-dag-sensor-deadlock-and-poking-cost-guard
namespace: company.orchestration

description: |
  Inspect Apache Airflow REST API for active task instances, detect sensor tasks in poke mode
  holding worker concurrency slots beyond SLA thresholds, identify starved downstream ETL tasks,
  execute automated remediation via Airflow API, persist incident records to Kestra KV, and alert Slack.

inputs:
  - id: airflow_base_url
    type: STRING
    displayName: Airflow Base URL
    defaults: "http://localhost:8080"
    description: Base URL of Apache Airflow webserver or REST API gateway.

  - id: dag_id
    type: STRING
    displayName: Monitored DAG ID
    defaults: "ecommerce_analytics_pipeline"
    description: Target Apache Airflow DAG containing sensor tasks and downstream ETL dependencies.

  - id: dag_run_id
    type: STRING
    displayName: DAG Run ID
    defaults: "scheduled__2026-10-19T00:00:00+00:00"
    description: Target DAG Run execution identifier to inspect for active task instances.

  - id: max_poke_duration_seconds
    type: INT
    displayName: Maximum Poke Duration (Seconds)
    defaults: 900
    description: Maximum allowable duration in seconds for a sensor running in poke mode before flagging worker slot exhaustion.

  - id: starved_task_wait_seconds
    type: INT
    displayName: Starved Task Wait Threshold (Seconds)
    defaults: 300
    description: Threshold in seconds for queued downstream ETL tasks waiting on worker slots to flag slot starvation.

  - id: remediation_action
    type: SELECT
    displayName: Remediation Strategy
    defaults: "FAIL_TASK"
    values:
      - "FAIL_TASK"
      - "CONVERT_TO_RESCHEDULE"
    description: "Action taken for deadlocked sensors: FAIL_TASK terminates task immediately via Airflow API; CONVERT_TO_RESCHEDULE clears task to release worker slot."

  - id: auto_remediate
    type: BOOL
    displayName: Auto Remediate
    defaults: false
    description: When true, automatically executes remediation requests against the Airflow REST API for identified deadlocked sensors.

  - id: dry_run
    type: BOOL
    displayName: Dry Run
    defaults: true
    description: When true, simulates sensor remediation without mutating Airflow state. Must be false with auto_remediate true to apply API updates.

  - id: simulate_telemetry
    type: BOOL
    displayName: Simulate Telemetry Fallback
    defaults: true
    description: When true and Airflow REST endpoint is unreachable or empty, provides realistic sensor deadlock telemetry for testing.

triggers:
  - id: periodic_sensor_guard
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodically audits active task instances every 15 minutes to catch hung poke sensors before worker slot pool exhaustion.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: validate_configuration
    type: io.kestra.plugin.core.execution.Assert
    description: Asserts timeout thresholds and Airflow connection parameters meet operational requirements.
    conditions:
      - "{{ inputs.max_poke_duration_seconds > 0 }}"
      - "{{ inputs.starved_task_wait_seconds > 0 }}"
      - "{{ inputs.airflow_base_url != '' }}"
      - "{{ inputs.dag_id != '' }}"
      - "{{ inputs.dag_run_id != '' }}"
    errorMessage: "Configuration validation failed: Positive poke timeout thresholds and non-empty Airflow parameters are required."

  - id: fetch_task_instances
    type: io.kestra.plugin.core.http.Request
    description: Queries Apache Airflow REST API /api/v1/dags/{dag_id}/dagRuns/{dag_run_id}/taskInstances for all active task instances.
    uri: "{{ inputs.airflow_base_url }}/api/v1/dags/{{ inputs.dag_id }}/dagRuns/{{ inputs.dag_run_id }}/taskInstances"
    method: GET
    headers:
      Authorization: "Basic {{ (secret('AIRFLOW_USERNAME') ~ ':' ~ secret('AIRFLOW_PASSWORD')) | base64encode }}"
      Accept: application/json
    options:
      allowFailed: true
    retry:
      type: constant
      interval: PT2S
      maxAttempts: 2
    allowFailure: true

  - id: analyze_sensor_deadlocks_and_starvation
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects task instances, detects poke mode sensors exceeding duration thresholds, identifies starved queued tasks, and generates remediation commands.
    containerImage: python:3.11-slim
    env:
      HTTP_STATUS: "{{ outputs.fetch_task_instances.statusCode ?? 0 }}"
      DAG_ID: "{{ inputs.dag_id }}"
      DAG_RUN_ID: "{{ inputs.dag_run_id }}"
      MAX_POKE_SECONDS: "{{ inputs.max_poke_duration_seconds }}"
      STARVED_WAIT_SECONDS: "{{ inputs.starved_task_wait_seconds }}"
      REMEDIATION_ACTION: "{{ inputs.remediation_action }}"
      SIMULATE_FALLBACK: "{{ inputs.simulate_telemetry }}"
    inputFiles:
      task_instances.json: "{{ outputs.fetch_task_instances.body ?? '' }}"
    script: |
      import os
      import sys
      import json
      from datetime import datetime, timezone

      http_status = int(os.environ.get("HTTP_STATUS", 0))
      dag_id = os.environ.get("DAG_ID", "ecommerce_analytics_pipeline")
      dag_run_id = os.environ.get("DAG_RUN_ID", "scheduled__2026-10-19T00:00:00+00:00")
      max_poke_seconds = int(os.environ.get("MAX_POKE_SECONDS", 900))
      starved_wait_seconds = int(os.environ.get("STARVED_WAIT_SECONDS", 300))
      remediation_action = os.environ.get("REMEDIATION_ACTION", "FAIL_TASK")
      simulate_fallback = os.environ.get("SIMULATE_FALLBACK", "true").lower() == "true"

      now_utc = datetime.now(timezone.utc)
      print("=== Apache Airflow Sensor Deadlock & Worker Slot Guard ===")
      print(f"Timestamp               : {now_utc.isoformat()}")
      print(f"DAG ID                  : {dag_id}")
      print(f"DAG Run ID              : {dag_run_id}")
      print(f"Max Poke Duration SLA   : {max_poke_seconds}s")
      print(f"Starved Task Wait SLA   : {starved_wait_seconds}s")
      print(f"Remediation Strategy    : {remediation_action}")
      print(f"HTTP Status from API    : {http_status}")

      task_instances = []
      raw_content = ""
      if os.path.exists("task_instances.json"):
          with open("task_instances.json", "r", encoding="utf-8") as f:
              raw_content = f.read().strip()

      if raw_content:
          try:
              data = json.loads(raw_content)
              if isinstance(data, dict) and "task_instances" in data:
                  task_instances = data["task_instances"]
              elif isinstance(data, list):
                  task_instances = data
          except Exception as e:
              print(f"Warning: Failed to parse task_instances.json: {e}")

      if not task_instances and simulate_fallback:
          print("Note: Airflow API returned no live data. Engaging simulation model.")
          task_instances = [
              {
                  "dag_id": dag_id,
                  "dag_run_id": dag_run_id,
                  "task_id": "wait_for_upstream_orders",
                  "operator": "ExternalTaskSensor",
                  "state": "running",
                  "duration": 1845.0,
                  "start_date": "2026-10-19T00:00:10+00:00",
                  "pool": "default_pool",
                  "pool_slots": 1,
                  "priority_weight": 10,
                  "hostname": "celery-worker-k8s-pod-01"
              },
              {
                  "dag_id": dag_id,
                  "dag_run_id": dag_run_id,
                  "task_id": "wait_for_partner_inventory_s3",
                  "operator": "S3KeySensor",
                  "state": "running",
                  "duration": 1260.0,
                  "start_date": "2026-10-19T00:00:15+00:00",
                  "pool": "default_pool",
                  "pool_slots": 1,
                  "priority_weight": 10,
                  "hostname": "celery-worker-k8s-pod-02"
              },
              {
                  "dag_id": dag_id,
                  "dag_run_id": dag_run_id,
                  "task_id": "wait_for_payment_gateway_hook",
                  "operator": "HttpSensor",
                  "state": "up_for_reschedule",
                  "duration": 42.0,
                  "start_date": "2026-10-19T00:00:20+00:00",
                  "pool": "default_pool",
                  "pool_slots": 1,
                  "priority_weight": 10,
                  "hostname": None
              },
              {
                  "dag_id": dag_id,
                  "dag_run_id": dag_run_id,
                  "task_id": "extract_order_settlements",
                  "operator": "PostgresOperator",
                  "state": "queued",
                  "duration": 0.0,
                  "queued_when": "2026-10-19T00:05:00+00:00",
                  "pool": "default_pool",
                  "pool_slots": 1,
                  "priority_weight": 50,
                  "hostname": None
              },
              {
                  "dag_id": dag_id,
                  "dag_run_id": dag_run_id,
                  "task_id": "transform_reconciliation_cube",
                  "operator": "SparkSubmitOperator",
                  "state": "queued",
                  "duration": 0.0,
                  "queued_when": "2026-10-19T00:06:00+00:00",
                  "pool": "default_pool",
                  "pool_slots": 1,
                  "priority_weight": 40,
                  "hostname": None
              }
          ]

      def parse_iso_duration(date_str):
          if not date_str:
              return 0.0
          try:
              clean_str = date_str.replace("Z", "+00:00")
              dt = datetime.fromisoformat(clean_str)
              return max(0.0, (now_utc - dt).total_seconds())
          except Exception:
              return 0.0

      def is_sensor_operator(op, tid):
          op_lower = (op or "").lower()
          tid_lower = (tid or "").lower()
          return op_lower.endswith("sensor") or "sensor" in op_lower or "sensor" in tid_lower

      deadlocked_sensors = []
      starved_tasks = []
      nominal_sensors = []
      total_sensor_slots_held = 0

      for ti in task_instances:
          t_id = ti.get("task_id", "unknown")
          op = ti.get("operator", "")
          state = ti.get("state", "none")
          pool = ti.get("pool", "default_pool")
          slots = ti.get("pool_slots", 1) or 1
          priority = ti.get("priority_weight", 0) or 0

          if is_sensor_operator(op, t_id):
              dur = ti.get("duration")
              if dur is None or dur == 0:
                  dur = parse_iso_duration(ti.get("start_date"))
              else:
                  dur = float(dur)

              if state == "running":
                  total_sensor_slots_held += slots
                  if dur > max_poke_seconds:
                      deadlocked_sensors.append({
                          "task_id": t_id,
                          "dag_id": ti.get("dag_id", dag_id),
                          "dag_run_id": ti.get("dag_run_id", dag_run_id),
                          "operator": op,
                          "mode": "poke",
                          "state": state,
                          "duration_seconds": round(dur, 1),
                          "threshold_seconds": max_poke_seconds,
                          "pool": pool,
                          "slots_held": slots,
                          "hostname": ti.get("hostname", "unknown")
                      })
                  else:
                      nominal_sensors.append(t_id)
              elif state == "up_for_reschedule":
                  nominal_sensors.append(t_id)
          else:
              if state == "queued":
                  queued_wait = parse_iso_duration(ti.get("queued_when") or ti.get("queued_dttm"))
                  if queued_wait == 0.0 and simulate_fallback:
                      queued_wait = 450.0
                  if queued_wait > starved_wait_seconds:
                      starved_tasks.append({
                          "task_id": t_id,
                          "dag_id": ti.get("dag_id", dag_id),
                          "dag_run_id": ti.get("dag_run_id", dag_run_id),
                          "operator": op,
                          "state": "queued",
                          "queue_wait_seconds": round(queued_wait, 1),
                          "threshold_seconds": starved_wait_seconds,
                          "pool": pool,
                          "priority_weight": priority
                      })

      deadlocked_count = len(deadlocked_sensors)
      starved_count = len(starved_tasks)

      if deadlocked_count > 0 and starved_count > 0:
          overall_status = "CRITICAL_SENSOR_DEADLOCK"
          is_deadlocked = True
      elif deadlocked_count > 0:
          overall_status = "WARNING_POKE_SENSOR_EXHAUSTION"
          is_deadlocked = True
      else:
          overall_status = "HEALTHY_NOMINAL"
          is_deadlocked = False

      remediations = []
      if is_deadlocked:
          for s in deadlocked_sensors:
              tid = s["task_id"]
              t_dag = s["dag_id"]
              t_run = s["dag_run_id"]
              if remediation_action == "FAIL_TASK":
                  remediations.append({
                      "task_id": tid,
                      "dag_id": t_dag,
                      "dag_run_id": t_run,
                      "remediation_method": "FAIL_TASK",
                      "http_method": "PATCH",
                      "endpoint": f"/api/v1/dags/{t_dag}/dagRuns/{t_run}/taskInstances/{tid}",
                      "payload": {
                          "dry_run": False,
                          "new_state": "failed"
                      },
                      "rationale": f"Terminate poke sensor holding slot for {s['duration_seconds']}s > {max_poke_seconds}s SLA"
                  })
              else:
                  remediations.append({
                      "task_id": tid,
                      "dag_id": t_dag,
                      "dag_run_id": t_run,
                      "remediation_method": "CONVERT_TO_RESCHEDULE",
                      "http_method": "POST",
                      "endpoint": f"/api/v1/dags/{t_dag}/clearTaskInstances",
                      "payload": {
                          "dry_run": False,
                          "task_ids": [tid],
                          "only_failed": False
                      },
                      "rationale": "Clear sensor instance to release worker slot and allow reschedule mode"
                  })

      summary = (
          f"Airflow Sensor Guard: {overall_status} | DAG '{dag_id}' (Run: '{dag_run_id}'). "
          f"Deadlocked Sensors: {deadlocked_count}, Starved Tasks: {starved_count}, Worker Slots Held: {total_sensor_slots_held}."
      )
      print(summary)
      for ds in deadlocked_sensors:
          print(f"  [DEADLOCKED] Task: {ds['task_id']} ({ds['operator']}) running for {ds['duration_seconds']}s on host {ds['hostname']}")
      for st in starved_tasks:
          print(f"  [STARVED] Task: {st['task_id']} ({st['operator']}) queued for {st['queue_wait_seconds']}s (priority: {st['priority_weight']})")

      deadlocked_sensor_names = [ds["task_id"] for ds in deadlocked_sensors]
      starved_task_names = [st["task_id"] for st in starved_tasks]

      incident_manifest = {
          "overall_status": overall_status,
          "summary": summary,
          "dag_id": dag_id,
          "dag_run_id": dag_run_id,
          "is_deadlocked": is_deadlocked,
          "deadlocked_sensors_count": deadlocked_count,
          "starved_tasks_count": starved_count,
          "total_sensor_slots_held": total_sensor_slots_held,
          "deadlocked_sensors": deadlocked_sensors,
          "deadlocked_sensor_names": deadlocked_sensor_names,
          "starved_tasks": starved_tasks,
          "starved_task_names": starved_task_names,
          "remediations": remediations,
          "max_poke_duration_seconds": max_poke_seconds,
          "starved_task_wait_seconds": starved_wait_seconds,
          "remediation_action": remediation_action,
          "evaluated_at": now_utc.isoformat()
      }

      print("::" + json.dumps({
          "outputs": {
              "overall_status": overall_status,
              "summary": summary,
              "is_deadlocked": is_deadlocked,
              "deadlocked_sensors_count": deadlocked_count,
              "starved_tasks_count": starved_count,
              "total_sensor_slots_held": total_sensor_slots_held,
              "deadlocked_sensors": deadlocked_sensors,
              "deadlocked_sensor_names": deadlocked_sensor_names,
              "starved_tasks": starved_tasks,
              "starved_task_names": starved_task_names,
              "remediations": remediations,
              "incident_manifest": incident_manifest
          }
      }) + "::")

  - id: persist_sensor_incident_to_kv
    type: io.kestra.plugin.core.kv.Set
    description: Records complete sensor deadlock incident diagnostics in Kestra namespace KV store.
    key: "airflow_sensor_deadlock_incident_{{ execution.id }}"
    value: "{{ outputs.analyze_sensor_deadlocks_and_starvation.vars.incident_manifest | toJson }}"
    kvType: JSON
    overwrite: true

  - id: persist_summary_to_kv
    type: io.kestra.plugin.core.kv.Set
    description: Updates aggregate Airflow sensor deadlock status in Kestra KV store for telemetry dashboards.
    key: airflow_sensor_deadlock_summary
    value: "{{ outputs.analyze_sensor_deadlocks_and_starvation.vars.incident_manifest | toJson }}"
    kvType: JSON
    overwrite: true

  - id: evaluate_deadlock_condition
    type: io.kestra.plugin.core.flow.If
    description: Evaluates sensor deadlock detection result to alert Slack, apply remediation, or enforce failure gate.
    condition: "{{ outputs.analyze_sensor_deadlocks_and_starvation.vars.is_deadlocked == true }}"
    then:
      - id: notify_slack_deadlock_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Delivers urgent incident notification to Slack with affected sensors and starved tasks.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "attachments": [
              {
                "color": "danger",
                "title": ":warning: Apache Airflow Sensor Deadlock Alert: {{ outputs.analyze_sensor_deadlocks_and_starvation.vars.overall_status }}",
                "text": "*{{ outputs.analyze_sensor_deadlocks_and_starvation.vars.summary }}*\n\n*DAG ID:* `{{ inputs.dag_id }}` | *DAG Run:* `{{ inputs.dag_run_id }}`\n*Deadlocked Sensors:* {{ outputs.analyze_sensor_deadlocks_and_starvation.vars.deadlocked_sensors_count }} (`{{ outputs.analyze_sensor_deadlocks_and_starvation.vars.deadlocked_sensor_names | join(', ') }}`)\n*Starved ETL Tasks:* {{ outputs.analyze_sensor_deadlocks_and_starvation.vars.starved_tasks_count }} (`{{ outputs.analyze_sensor_deadlocks_and_starvation.vars.starved_task_names | join(', ') }}`)\n*Worker Slots Held:* {{ outputs.analyze_sensor_deadlocks_and_starvation.vars.total_sensor_slots_held }}\n*Remediation Strategy:* `{{ inputs.remediation_action }}` (auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }})\n*Execution:* `{{ execution.id }}`\n\n*Action Required:* Poke-mode sensors have exceeded timeout thresholds holding Celery/Kubernetes worker slots. Downstream ETL tasks are starved."
              }
            ]
          }

      - id: apply_remediation_gate
        type: io.kestra.plugin.core.flow.If
        description: Triggers Airflow REST API calls to fail or clear tasks when auto_remediate is true and dry_run is false.
        condition: "{{ inputs.auto_remediate == true and inputs.dry_run == false }}"
        then:
          - id: remediate_deadlocked_sensors
            type: io.kestra.plugin.core.flow.Loop
            description: Iterates through each deadlocked sensor and dispatches remediation API requests to Apache Airflow.
            values: "{{ outputs.analyze_sensor_deadlocks_and_starvation.vars.remediations }}"
            concurrencyLimit: 1
            tasks:
              - id: execute_airflow_task_remediation
                type: io.kestra.plugin.core.http.Request
                description: Sends PATCH or POST request to Apache Airflow REST API to terminate hung sensor or clear task instance.
                method: "{{ item.value.http_method }}"
                uri: "{{ inputs.airflow_base_url }}{{ item.value.endpoint }}"
                headers:
                  Authorization: "Basic {{ (secret('AIRFLOW_USERNAME') ~ ':' ~ secret('AIRFLOW_PASSWORD')) | base64encode }}"
                  Content-Type: application/json
                  Accept: application/json
                body: "{{ item.value.payload | toJson }}"
                options:
                  allowFailed: true
                allowFailure: true

              - id: log_sensor_remediation_applied
                type: io.kestra.plugin.core.log.Log
                description: Logs confirmation of applied remediation request against Airflow REST API.
                message: "Remediated deadlocked sensor '{{ item.value.task_id }}' in DAG '{{ inputs.dag_id }}' (Run: '{{ inputs.dag_run_id }}') via method '{{ item.value.remediation_method }}'."
        else:
          - id: log_dry_run_remediation
            type: io.kestra.plugin.core.log.Log
            description: Records dry-run assessment without modifying Apache Airflow task states.
            message: "DRY-RUN: Sensor deadlock detected for {{ outputs.analyze_sensor_deadlocks_and_starvation.vars.deadlocked_sensors_count }} sensor(s) in DAG '{{ inputs.dag_id }}'. auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }}. Airflow task instances were not mutated."

      - id: enforce_deadlock_failure_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Fails workflow execution to alert orchestration monitoring systems of deadlocked worker slots.
        errorMessage: "CRITICAL: Apache Airflow sensor deadlock detected. {{ outputs.analyze_sensor_deadlocks_and_starvation.vars.deadlocked_sensors_count }} poke-mode sensor(s) starved {{ outputs.analyze_sensor_deadlocks_and_starvation.vars.starved_tasks_count }} priority ETL task(s)."
    else:
      - id: log_healthy_sensors
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal status when all sensors operate within duration SLAs and no worker slot starvation is observed.
        message: "NOMINAL: {{ outputs.analyze_sensor_deadlocks_and_starvation.vars.summary }}"

  - id: emit_guard_outputs
    type: io.kestra.plugin.core.output.OutputValues
    description: Emits typed evaluation outputs for upstream workflows and dashboards.
    values:
      overall_status: "{{ outputs.analyze_sensor_deadlocks_and_starvation.vars.overall_status }}"
      is_deadlocked: "{{ outputs.analyze_sensor_deadlocks_and_starvation.vars.is_deadlocked }}"
      deadlocked_sensors_count: "{{ outputs.analyze_sensor_deadlocks_and_starvation.vars.deadlocked_sensors_count }}"
      starved_tasks_count: "{{ outputs.analyze_sensor_deadlocks_and_starvation.vars.starved_tasks_count }}"
      total_sensor_slots_held: "{{ outputs.analyze_sensor_deadlocks_and_starvation.vars.total_sensor_slots_held }}"
      summary: "{{ outputs.analyze_sensor_deadlocks_and_starvation.vars.summary }}"

errors:
  - id: alert_on_guard_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts operations team if the deadlock guard workflow encounters an unhandled runtime failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "attachments": [
          {
            "color": "danger",
            "title": ":rotating_light: Airflow Sensor Deadlock Guard FAILED",
            "text": "Failed to evaluate Airflow sensor deadlocks for DAG `{{ inputs.dag_id }}` (Run: `{{ inputs.dag_run_id }}`). Execution: `{{ execution.id }}`.\nCheck Airflow API connectivity at `{{ inputs.airflow_base_url }}`."
          }
        ]
      }

extend:
  title: Apache Airflow Sensor Deadlock & Worker Slot Exhaustion Guard
  metaTitle: Apache Airflow Sensor Deadlock & Worker Slot Exhaustion Guard | Kestra
  shortDescription: Inspect Apache Airflow sensor tasks in poke mode, detect worker slot exhaustion and deadlocks starving ETL pipelines, trigger automated API remediation, and alert Slack.
  metaDescription: Detect Apache Airflow poke-mode sensor deadlocks, release exhausted worker slots, persist incident metrics to KV, and alert teams via Slack.
  description: |
    In distributed Apache Airflow clusters running on CeleryExecutor or KubernetesExecutor,
    sensors configured in `poke` mode hold active worker concurrency slots or pod processes
    for their entire duration. When upstream dependencies are delayed or unfulfilled, multiple
    sensors consume 100% of available worker slots.

    This creates a severe sensor deadlock: high-priority downstream ETL tasks sit in a `queued`
    state waiting for worker slots, unable to run because poking sensors occupy the entire pool.
    If the sensor is waiting for an event produced by a queued task, the cluster enters an
    unresolvable circular deadlock that inflates cloud infrastructure costs and halts business pipelines.

    This blueprint provides an autonomous guard that queries the Apache Airflow REST API, detects
    sensors exceeding poke duration thresholds, identifies starved priority tasks, records incident
    diagnostics into Kestra KV, alerts engineering teams on Slack, and optionally applies automated
    remediation via the Airflow REST API.

    ## How it works

    1. **Pre-flight Assertion**: Validates operational thresholds (`max_poke_duration_seconds`, `starved_task_wait_seconds`) and verifies target DAG connection parameters.
    2. **REST API Telemetry Retrieval**: Calls `GET /api/v1/dags/{dag_id}/dagRuns/{dag_run_id}/taskInstances` using `io.kestra.plugin.core.http.Request` with HTTP Basic Authentication.
    3. **Sensor & Slot Inspection**: Evaluates active task instances to distinguish sensors running in `poke` mode from non-blocking `reschedule` mode sensors.
    4. **Duration & Starvation Detection**: Computes elapsed execution duration for running sensors against `max_poke_duration_seconds`. Calculates queue wait times for priority ETL tasks to identify worker starvation.
    5. **Deadlock Classification**: Flags `CRITICAL_SENSOR_DEADLOCK` when poke-mode sensors consume worker slots while queued tasks are starved, or `WARNING_POKE_SENSOR_EXHAUSTION` when sensors exceed duration limits without starved tasks.
    6. **Incident KV Recording**: Persists structured incident telemetry under `airflow_sensor_deadlock_incident_{execution.id}` and updates the global status key `airflow_sensor_deadlock_summary` in Kestra KV.
    7. **Slack Notification**: Delivers rich alert cards to Slack with affected sensor task IDs, hostnames, running durations, and starved ETL task names.
    8. **Automated API Remediation**: When `auto_remediate` is enabled and `dry_run` is disabled, dispatches `PATCH` or `POST` requests to the Airflow REST API to fail or reschedule deadlocked sensors.
    9. **Failure Gate**: Halts execution via `io.kestra.plugin.core.execution.Fail` to notify upstream monitoring tools when deadlocks are confirmed.

    ## What you get

    - Real-time detection of sensor deadlocks and Celery/Kubernetes worker slot starvation.
    - Automated worker slot recovery by failing or rescheduling hung poke-mode sensors.
    - Elimination of runaway cloud compute costs caused by idling sensor worker processes.
    - Kestra namespace KV persistence for audit logging and orchestration observability dashboards.
    - Structured Slack notifications with actionable sensor and queued task metrics.

    ## Who it's for

    - Data Platform Engineers responsible for Apache Airflow cluster health and worker capacity.
    - Data Engineers running multi-step ETL workflows with cross-DAG or external event dependencies.
    - SREs and Cloud Operations teams managing Celery worker pools and Kubernetes pod autoscalers.

    ## Why orchestrate this with Kestra

    Apache Airflow cannot reliably remediate its own scheduler deadlocks when worker pools are fully
    exhausted. Running this guard inside Kestra establishes an independent, decoupled supervisory control plane.
    Kestra inspects Airflow from the outside via its standard REST API, persists incident state in Kestra KV,
    and applies corrective actions even when internal Airflow workers are unresponsive.

    ## Prerequisites

    - Apache Airflow 2.0+ cluster with REST API enabled.
    - Network connectivity from the Kestra worker to the Airflow webserver endpoint.
    - Airflow user account with REST API permissions to read and update task instances.
    - Slack Incoming Webhook URL configured in Kestra.

    ### Secrets

    - `AIRFLOW_USERNAME`: Username for Apache Airflow REST API Basic Authentication.
    - `AIRFLOW_PASSWORD`: Password for Apache Airflow REST API Basic Authentication.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for incident alerts.

    ## Quick start

    1. Configure `AIRFLOW_USERNAME`, `AIRFLOW_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra workspace under `company.orchestration`.
    3. Set `airflow_base_url` to your Airflow webserver endpoint (e.g. `http://airflow.internal:8080`).
    4. Provide the target `dag_id` and `dag_run_id` to audit.
    5. Execute the flow manually with `dry_run: true` to inspect active sensors and verify deadlock detection.
    6. Enable `auto_remediate: true` and `dry_run: false` to allow Kestra to automatically terminate deadlocked sensors.
    7. Enable the `periodic_sensor_guard` trigger to audit worker slot availability every 15 minutes.

    ## How to extend

    - **Cluster-Wide Audit**: Query `GET /api/v1/dags/~/dagRuns?state=running` to inspect task instances across all active DAGs concurrently.
    - **Worker Pool Autoscaling**: Call Kubernetes API or cloud provider autoscalers to temporarily scale worker replicas when slot saturation is detected.
    - **PagerDuty Escalation**: Add `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` to trigger high-priority on-call alerts for tier-1 data warehouse deadlocks.

