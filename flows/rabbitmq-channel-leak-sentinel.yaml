id: rabbitmq-channel-leak-sentinel
namespace: company.messaging

inputs:
  - id: rabbitmq_management_host
    type: STRING
    defaults: rabbitmq.internal:15672
    description: Host and port of the RabbitMQ Management API.
  - id: rabbitmq_username
    type: STRING
    defaults: guest
    description: Username for RabbitMQ Management API.
  - id: max_channels_per_connection_threshold
    type: INT
    defaults: 100
    description: Maximum permissible open channels per client connection before alerting.

tasks:
  - id: audit_connection_channels
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s -u "{{ inputs.rabbitmq_username }}:{{ secret('RABBITMQ_PASSWORD') }}"           "http://{{ inputs.rabbitmq_management_host }}/api/connections" > connections.json
        python3 -c "
        import json
        with open('connections.json') as f:
            connections = json.load(f)
        leaked_conns = []
        for c in connections:
            channels = c.get('channels', 0)
            peer_host = c.get('peer_host', 'unknown')
            client_name = c.get('client_properties', {}).get('connection_name', peer_host)
            if channels > {{ inputs.max_channels_per_connection_threshold }}:
                leaked_conns.append({'client': client_name, 'peer_host': peer_host, 'channels': channels})
        result = {
            'total_connections': len(connections),
            'leaked_connections_count': len(leaked_conns),
            'leaked_connections': leaked_conns,
            'alert_triggered': len(leaked_conns) > 0
        }
        with open('channel_summary.json', 'w') as out:
            json.dump(result, out)
        print('RabbitMQ channel audit:', result)
        "
    outputFiles:
      - channel_summary.json

  - id: evaluate_channel_leaks
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.audit_connection_channels.outputFiles['channel_summary.json'])).alert_triggered }}"
    then:
      - id: alert_messaging_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *RabbitMQ Channel Leak Alert*: Detected {{ json(read(outputs.audit_connection_channels.outputFiles['channel_summary.json'])).leaked_connections_count }} connections with over {{ inputs.max_channels_per_connection_threshold }} open channels on {{ inputs.rabbitmq_management_host }}. Client microservices are leaking channel resources."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *RabbitMQ Sentinel Execution Failure*: Failed to query connections on {{ inputs.rabbitmq_management_host }}."
      }

triggers:
  - id: scheduled_channel_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: RabbitMQ Connection Channel Leak and Churn Sentinel
  shortDescription: Audits RabbitMQ client connections to detect channel leaks where microservices open channels without properly closing them.
  description: |
    ## How it works
    This workflow queries the RabbitMQ Management HTTP API `/api/connections` endpoint to measure the open channel count per client connection. It alerts engineers when misconfigured client libraries create new channels per message without closing them, which exhausts broker memory and degrades Erlang VM process scheduling.

    ## What you get
    - Proactive detection of channel resource leaks in publisher or consumer client code.
    - Early prevention of Erlang process exhaustion and broker memory bloat.
    - Actionable Slack notifications detailing client connection names, peer IPs, and channel counts.

    ## Who it's for
    - Microservice backend developers and SREs maintaining RabbitMQ messaging brokers.
    - Platform teams debugging message broker memory growth.

    ## Why orchestrate this with Kestra
    Kestra automates distributed messaging health checks, executing scheduled audits with fine-grained error management and notification delivery.

    ## Prerequisites
    - RabbitMQ Management plugin enabled on the broker.
    - Secrets `RABBITMQ_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `rabbitmq_management_host` and credentials.
    3. Run manually to check current channel counts per connection.

    ## How to extend
    - Automatically close leaking connections via `DELETE /api/connections/{name}` in a remediation task.
    - Correlate channel counts with client SDK versions in `client_properties`.
    - Forward connection metrics to Datadog or Prometheus.

    ## Links
    - [RabbitMQ Channels Documentation](https://www.rabbitmq.com/docs/channels)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
