id: stripe-dunning-revenue-recovery
namespace: company.billing

extend:
  title: Automated Payment Failure Triage and Revenue Recovery
  metaTitle: SaaS Payment Failure Triage and Dunning Automation | Kestra
  shortDescription: Ingests failed subscription payment webhooks, scores decline reasons in Python, and routes smart retry actions.
  metaDescription: Orchestrate payment failure webhook ingestion, parallel gateway checks, and Python dunning risk classification with Kestra.
  description: |
    Prevents involuntary SaaS churn by ingesting failed payment events, classifying soft versus hard card declines in Python, and routing automated dunning recovery actions.

    ## How it works
    1. A Webhook trigger captures incoming payment failure payloads from billing providers.
    2. A Parallel flowable task concurrently verifies payment gateway reachability and audits invoice retry metadata.
    3. A Python script task evaluates the decline code, invoice amount, and retry count to determine recovery probability and retry timing.
    4. An If task branches execution between recoverable soft declines (queuing smart retries) and hard declines (escalating account payment updates).

    ## What you get
    - Automated distinction between transient soft declines and permanent card failures.
    - Prioritized handling for high-value invoices to protect recurring revenue.
    - Full execution visibility and retry audit trails across every failed transaction.

    ## Who it's for
    - SaaS Backend and Billing Engineers automating dunning and subscription lifecycle workflows.
    - FinTech Operations teams reducing involuntary churn without manual spreadsheet tracking.

    ## Why orchestrate this with Kestra
    - Event-driven webhook ingestion paired with isolated Python scoring logic.
    - Visual topology tracking for every invoice recovery path.

    ## Prerequisites
    - Standard Kestra v2.0 instance.

    ### Secrets
    - No secrets required.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Click Execute with the default mock invoice inputs to verify the recovery routing.
    3. Point your billing webhook endpoint to the Kestra webhook trigger URL.

    ## How to extend
    - Connect the Stripe or Chargebee API in the parallel branch to fetch live customer subscription tiers.
    - Add Resend, Twilio, or Slack notification tasks inside the If branches to dispatch customer payment links automatically.

    ## Links
    - [Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [If Task Documentation](https://kestra.io/docs/workflow-components/flowable-tasks/if)
  tags:
    - Data
  subTags:
    - Analytics
  ee: false
  demo: false

inputs:
  - id: invoice_id
    type: STRING
    defaults: "in_1Q9xYz2eZvKYlo2C9812"
  - id: customer_email
    type: STRING
    defaults: "billing@acmecorp.io"
  - id: amount_usd
    type: FLOAT
    defaults: 249.00
  - id: decline_code
    type: STRING
    defaults: "insufficient_funds"
  - id: retry_attempt
    type: INT
    defaults: 1

triggers:
  - id: payment_failed_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "stripe-payment-failed-hook"

tasks:
  - id: parallel_context_enrichment
    type: io.kestra.plugin.core.flow.Parallel
    description: "Concurrently verify payment gateway reachability and audit retry history"
    tasks:
      - id: verify_gateway_status
        type: io.kestra.plugin.core.http.Request
        uri: "https://httpbin.org/status/200"
        method: GET

      - id: audit_invoice_metadata
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - 'echo "Auditing failed invoice {{ inputs.invoice_id }} for {{ inputs.customer_email }}"'
          - 'echo "Decline reason: {{ inputs.decline_code }} (Attempt #{{ inputs.retry_attempt }})"'

  - id: classify_recovery_strategy
    type: io.kestra.plugin.scripts.python.Script
    description: "Calculate risk tier and determine optimal smart-retry window"
    beforeCommands:
      - pip install kestra
    script: |
      from kestra import Kestra

      amount = {{ inputs.amount_usd }}
      code = "{{ inputs.decline_code }}"
      attempt = {{ inputs.retry_attempt }}

      soft_declines = ["insufficient_funds", "processing_error", "issuer_not_available", "try_again_later"]
      is_recoverable = code in soft_declines and attempt <= 3

      if is_recoverable and amount >= 100.0:
          tier = "HIGH_PRIORITY_RECOVERY"
          action = "Schedule smart retry in 24h + send personalized WhatsApp/Email link"
      elif is_recoverable:
          tier = "STANDARD_RETRY"
          action = "Queue automated silent card retry in 48h"
      else:
          tier = "HARD_DECLINE_ACTION_REQUIRED"
          action = "Pause account provisioning + request payment method update"

      summary = f"[{tier}] Invoice {{ inputs.invoice_id }} (${amount:.2f}) -> {action}"
      print(summary)

      Kestra.outputs({
          'tier': tier,
          'is_recoverable': is_recoverable,
          'recommended_action': summary
      })

  - id: route_dunning_workflow
    type: io.kestra.plugin.core.flow.If
    description: "Route high-priority recoverable accounts vs hard declines"
    condition: "{{ outputs.classify_recovery_strategy.vars.is_recoverable == true }}"
    then:
      - id: schedule_smart_retry_alert
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: |
          [REVENUE RECOVERY QUEUED]
          Customer: {{ inputs.customer_email }}
          Decision: {{ outputs.classify_recovery_strategy.vars.recommended_action }}
    else:
      - id: escalate_hard_decline
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          [CHURN RISK ALERT] Hard decline detected for {{ inputs.customer_email }}.
          Decision: {{ outputs.classify_recovery_strategy.vars.recommended_action }}
