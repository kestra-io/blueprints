id: data-freshness-sla-guard
namespace: company.team
description: |
  Check every watched table against its freshness SLA: one UNION query returns
  hours since the newest row per table, a classifier flags the stale ones, and
  Slack gets a per-table alert naming the owner-facing culprit.

inputs:
  - id: tables
    type: JSON
    displayName: Tables and their SLAs
    description: List of tables to watch - table name, timestamp column, and maximum allowed age in hours.
    defaults:
      - table: public.orders
        column: created_at
        max_age_hours: 24
      - table: public.events
        column: ingested_at
        max_age_hours: 2

tasks:
  - id: check_freshness
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: One round trip - hours since the newest row for every watched table.
    url: "{{ secret('POSTGRES_JDBC_URL') }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      {% for t in inputs.tables %}
      SELECT
        '{{ t.table }}' AS table_name,
        '{{ t.column }}' AS column_name,
        {{ t.max_age_hours }} AS max_age_hours,
        max({{ t.column }}) AS last_row_at,
        CASE
          WHEN max({{ t.column }}) IS NULL THEN NULL
          ELSE round(extract(epoch FROM (now() - max({{ t.column }})))::numeric, 0)
        END AS age_seconds
      FROM {{ t.table }}
      {% if not loop.last %} UNION ALL {% endif %}
      {% endfor %}

  - id: classify
    type: io.kestra.plugin.scripts.python.Script
    description: Compare each table's age against its SLA - null age (an empty table) is stale, not fresh.
    inputFiles:
      rows.json: "{{ outputs.check_freshness.rows | json }}"
    script: |
      import json
      from kestra import Kestra

      with open("rows.json") as f:
          rows = json.load(f)

      stale = []
      for row in rows:
          age = row.get("age_seconds")
          limit = float(row["max_age_hours"]) * 3600
          if age is None or float(age) > limit:
              stale.append({
                  "table": row["table_name"],
                  "column": row["column_name"],
                  "max_age_hours": row["max_age_hours"],
                  "age_hours": None if age is None else round(float(age) / 3600, 1),
                  "age_display": "no rows" if age is None else str(round(float(age) / 3600, 1)) + "h",
                  "last_row_at": str(row.get("last_row_at") or "never"),
              })

      Kestra.outputs({
          "checked_count": len(rows),
          "stale_count": len(stale),
          "stale_tables": stale[:20],
      })

  - id: freshness_gate
    type: io.kestra.plugin.core.flow.If
    description: Alert per stale table when any SLA is breached, log a quiet all-clear otherwise.
    condition: "{{ outputs.classify.vars.stale_count > 0 }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :clock10: Freshness SLA breach - {{ outputs.classify.vars.stale_count }} of {{ outputs.classify.vars.checked_count }} table(s) older than allowed.
          {% for t in outputs.classify.vars.stale_tables %}- {{ t.table }} ({{ t.column }}): newest row is {{ t.age_display }} old (SLA {{ t.max_age_hours }}h, last row {{ t.last_row_at }})
          {% endfor %}
          Check the upstream load - dashboards reading these tables are showing stale data.
    else:
      - id: log_fresh
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.classify.vars.checked_count }} table(s) are within their freshness SLAs."

outputs:
  - id: checked_count
    type: INT
    value: "{{ outputs.classify.vars.checked_count }}"
  - id: stale_count
    type: INT
    value: "{{ outputs.classify.vars.stale_count }}"
  - id: stale_tables
    type: JSON
    value: "{{ outputs.classify.vars.stale_tables | json }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":rotating_light: Freshness SLA check {{ flow.id }} FAILED (execution {{ execution.id }}). A failed check must never read as fresh data. Error: {{ error.message }}"

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check freshness every hour, on the quarter. Enable when ready.
    cron: "15 * * * *"
    disabled: true

  - id: on_demand
    type: io.kestra.plugin.core.trigger.Webhook
    description: Re-check right after a load, migration, or incident. Replace the key with your own value.
    key: replace-with-a-random-key

extend:
  title: Data Freshness SLA Guard for Warehouse Tables
  shortDescription: Watch timestamp columns against per-table freshness SLAs in one query and alert Slack with the stale tables and their real age.
  metaTitle: Data Freshness SLA Monitoring Blueprint for Kestra
  metaDescription: Watch warehouse tables against freshness SLAs in Kestra. One query returns hours since the newest row per table, stale tables alert Slack with age and SLA.
  description: |
    A broken pipeline that stops loading does not usually fail - it stops producing rows. The dashboard keeps rendering yesterday's numbers with today's timestamp on the page, and the first person to notice is the analyst who sees their order count flatline. Freshness is the cheapest data-quality signal there is: newest row, compare against an allowance, and someone hears about it. This blueprint makes that signal a scheduled workflow instead of a widget nobody watches.

    ## How it works

    1. `check_freshness` (`io.kestra.plugin.jdbc.postgresql.Query`, `FETCH`) renders one `UNION ALL` statement over the `tables` input - for each entry it selects `max(column)` as `last_row_at` and the age in seconds, coexisting with the table's own `max_age_hours`. One round trip covers the whole watch list.
    2. `classify` (`io.kestra.plugin.scripts.python.Script`, stdlib only) compares every age against its SLA. A `NULL` age means the table has no rows at all - an empty table is stale, never fresh - and is reported with an `age_display` of `no rows`.
    3. `freshness_gate` (`io.kestra.plugin.core.flow.If`) posts one Slack message listing each stale table with its real age, its SLA, and the last row timestamp; a clean run logs a one-line all-clear.
    4. The flow-level `errors` handler alerts Slack when the check itself fails, so a dead connection or a dropped table never reads as "everything is fresh".

    The watch list is a plain input: add a table by appending an entry with its timestamp column and hours of tolerance, no SQL edits required.

    ## What you get

    - A per-table freshness verdict with the numbers that matter: age, SLA, last row time.
    - An alert that names the table and column, so the owning team knows where to look.
    - `checked_count`, `stale_count`, and the stale list as flow outputs for dashboards or escalation flows.
    - Empty-table detection built in - "no rows" is treated as the breach it is.

    ## Who it's for

    - Data engineers owning warehouse loads who want an early warning before dashboards lie.
    - Analytics teams whose stakeholders ask "is this data current?" on every Monday.
    - Platform teams wiring data-quality signals into the same on-call machinery as service health.

    ## Why orchestrate this with Kestra

    Freshness checks are usually a cron script that nobody maintains until it silently dies. Kestra gives the check scheduled and webhook triggers, retries, a failure path that alerts instead of hiding, execution history with the actual ages recorded as outputs, and a shape you can extend into paging (add a Squadcast or PagerDuty task in the `then` branch) without rewriting the logic.

    ## Prerequisites

    - PostgreSQL 12 or newer reachable from Kestra (the same SQL works on the `jdbc.postgresql` plugin against most Postgres-backed warehouses).
    - SELECT access to each watched table and a timestamp-typed column on each.
    - A Kestra instance.

    ### Secrets

    - `POSTGRES_JDBC_URL`: JDBC URL for the warehouse (for example `jdbc:postgresql://host:5432/analytics`).
    - `POSTGRES_USERNAME`: database username.
    - `POSTGRES_PASSWORD`: database password.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for breach and failure alerts.

    ## Quick start

    1. Add the four secrets above to your Kestra instance.
    2. Replace the default `tables` input with your real tables, columns, and SLAs.
    3. Run once manually and inspect `check_freshness` rows before trusting the gate.
    4. Trigger via the `on_demand` webhook after a load, then enable the `hourly` schedule.

    ## How to extend

    - Route the `then` branch to a data on-call tool (Squadcast, PagerDuty) instead of, or alongside, Slack.
    - Chain this flow after your load pipeline with a `Flow` trigger so freshness is checked the moment data lands.
    - Group stale tables by owning team with a `Switch` on the table name.
    - Persist `stale_count` to a history table to chart freshness reliability over time.

    ## Links

    - Plugin docs: https://kestra.io/plugins/plugin-jdbc-postgres
    - Scheduling in Kestra: https://kestra.io/docs/concepts/schedules
    - This blueprint has been created by [RudraMalvankar](https://github.com/RudraMalvankar)
  tags:
    - Data
  subTags:
    - Data Quality
  ee: false
  demo: false
