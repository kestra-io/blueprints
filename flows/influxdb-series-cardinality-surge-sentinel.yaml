id: influxdb-series-cardinality-surge-sentinel
namespace: company.observability

description: |
  Audit InfluxDB time series cardinality across telemetry buckets on a schedule,
  identifying high-entropy tag explosion and runaway measurement growth before TSDB
  memory pressure causes query timeouts or cluster out-of-memory crashes.

inputs:
  - id: influxdb_host
    type: STRING
    defaults: "http://localhost:8086"
    displayName: "InfluxDB Host URL"
    description: "Base HTTP URL of the target InfluxDB v2 instance."

  - id: influxdb_org
    type: STRING
    defaults: "company-infra"
    displayName: "Target Organization"
    description: "InfluxDB organization namespace owning the monitored bucket."

  - id: target_bucket
    type: STRING
    defaults: "telemetry"
    displayName: "Monitored Bucket"
    description: "InfluxDB bucket to inspect for active series cardinality and tag growth."

  - id: lookback_window
    type: STRING
    defaults: "1h"
    displayName: "Lookback Window"
    description: "Relative lookback duration (e.g. 15m, 1h, 6h) across which measurement series are aggregated."

  - id: max_series_threshold
    type: INT
    defaults: 50000
    displayName: "Max Series Threshold"
    description: "Maximum allowable active time series per measurement before triggering operational alerts."

  - id: remediation_mode
    type: SELECT
    values:
      - "ALERT_ONLY"
      - "LOG_REMEDIATION"
    defaults: "ALERT_ONLY"
    displayName: "Remediation Mode"
    description: "Response strategy on threshold breach: dispatch Slack notification only or record remediation telemetry."

triggers:
  - id: periodic_cardinality_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"
    disabled: true
    inputs:
      influxdb_host: "http://localhost:8086"
      influxdb_org: "company-infra"
      target_bucket: "telemetry"
      lookback_window: "1h"
      max_series_threshold: 50000
      remediation_mode: "ALERT_ONLY"

tasks:
  - id: probe_series_cardinality
    type: io.kestra.plugin.influxdb.FluxQuery
    description: "Execute a Flux aggregation query returning top measurements ranked by active series count in the target bucket."
    connection:
      url: "{{ inputs.influxdb_host }}"
      token: "{{ secret('INFLUXDB_TOKEN') }}"
    org: "{{ inputs.influxdb_org }}"
    fetchType: FETCH
    query: |
      from(bucket: "{{ inputs.target_bucket }}")
        |> range(start: -{{ inputs.lookback_window }})
        |> group(columns: ["_measurement", "_field"])
        |> count()
        |> group()
        |> sort(columns: ["_value"], desc: true)
        |> limit(n: 5)

  - id: evaluate_cardinality
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluate whether the peak measurement series count breaches configured cardinality threshold."
    value: "{{ (outputs.probe_series_cardinality.rows is defined and outputs.probe_series_cardinality.rows | length > 0 and (outputs.probe_series_cardinality.rows[0]['_value'] | default(0)) > inputs.max_series_threshold) ? 'SURGE_DETECTED' : 'HEALTHY' }}"
    cases:
      "HEALTHY":
        - id: log_cardinality_healthy
          type: io.kestra.plugin.core.log.Log
          description: "Log healthy status when series counts remain within safe operating thresholds."
          message: "InfluxDB series cardinality is healthy in bucket '{{ inputs.target_bucket }}'. Peak measurement '{{ outputs.probe_series_cardinality.rows[0]['_measurement'] ?? 'none' }}' recorded {{ outputs.probe_series_cardinality.rows[0]['_value'] ?? 0 }} series (threshold: {{ inputs.max_series_threshold }})."
      "SURGE_DETECTED":
        - id: alert_cardinality_surge
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatch urgent Slack notification alerting SRE teams to runaway series cardinality."
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {"text": "InfluxDB High-Cardinality Alert: Bucket '{{ inputs.target_bucket }}' detected potential series explosion. Peak measurement '{{ outputs.probe_series_cardinality.rows[0]['_measurement'] }}' recorded {{ outputs.probe_series_cardinality.rows[0]['_value'] }} series in the last {{ inputs.lookback_window }} (threshold: {{ inputs.max_series_threshold }}). Remediation mode: {{ inputs.remediation_mode }}."}
        - id: log_remediation_guidance
          type: io.kestra.plugin.core.log.Log
          description: "Log remediation recommendations to isolate offending tags and protect InfluxDB cluster memory."
          message: "Cardinality mitigation guidance: Inspect high-entropy tags in measurement '{{ outputs.probe_series_cardinality.rows[0]['_measurement'] }}'. Verify telemetry publishers are not emitting UUIDs, timestamps, or raw URLs as indexed tags. Mode: {{ inputs.remediation_mode }}."
    defaults:
      - id: log_fallback_state
        type: io.kestra.plugin.core.log.Log
        description: "Fallback logger for unexpected cardinality evaluation states."
        message: "InfluxDB cardinality audit completed with unclassified metrics for bucket '{{ inputs.target_bucket }}'."

  - id: log_audit_completion
    type: io.kestra.plugin.core.log.Log
    description: "Record completion of the InfluxDB cardinality audit pass."
    message: "InfluxDB cardinality sentinel audit pass finished for bucket '{{ inputs.target_bucket }}' in org '{{ inputs.influxdb_org }}'."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatch urgent Slack notification if flow execution encounters an unexpected error."
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {"text": "Flow execution failed: influxdb-series-cardinality-surge-sentinel encountered an error during execution {{ execution.id }}."}

extend:
  title: "Audit InfluxDB Series Cardinality and Detect Tag Explosion Surges"
  metaTitle: "InfluxDB High-Cardinality Sentinel | Kestra"
  shortDescription: "Audit InfluxDB time series cardinality and detect runaway tag explosion surges with automated Slack alerts."
  metaDescription: "Audit InfluxDB series cardinality across telemetry buckets with Kestra. Detect tag explosion and high-cardinality bursts before TSDB memory exhaustion."
  description: |
    Time-series databases like InfluxDB rely on inverted index structures (TSI) to store and query
    metrics efficiently. In production telemetry and IoT ingestion pipelines, high-entropy fields
    such as user IDs, request UUIDs, container IP addresses, or unparsed URLs are occasionally
    mistakenly indexed as tags rather than stored as field values. This creates millions of unique
    time series keys in minutes, a condition known as series cardinality explosion. Runaway
    cardinality causes exponential TSI index memory consumption, severe compaction delays, query
    timeouts, and unrecoverable out-of-memory (OOM) crashes across InfluxDB storage nodes.

    This blueprint implements an automated Day 2 Operations sentinel that queries InfluxDB on a
    recurring schedule. It runs a Flux aggregation across target telemetry buckets to identify
    measurements with the highest active series volume, evaluates peak series counts against
    cardinality thresholds, and automatically dispatches Slack incident alerts with root-cause
    measurement telemetry to prevent TSDB cluster degradation.

    ## How it works

    1. `periodic_cardinality_audit` (`io.kestra.plugin.core.trigger.Schedule`) triggers the audit pass every 4 hours (disabled by default for initial setup).
    2. `probe_series_cardinality` (`io.kestra.plugin.influxdb.FluxQuery`) connects to InfluxDB via its native Flux API, scanning the target bucket over the configured lookback window, grouping by measurement and field, and sorting descending to return the top 5 highest series measurements.
    3. `evaluate_cardinality` (`io.kestra.plugin.core.flow.Switch`) evaluates whether the peak measurement series count exceeds `max_series_threshold`.
    4. When within acceptable operational limits (`HEALTHY`), `log_cardinality_healthy` records the measurement name, series count, and healthy status.
    5. When a cardinality surge is detected (`SURGE_DETECTED`), `alert_cardinality_surge` dispatches an operational incident alert to Slack using `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`, and `log_remediation_guidance` logs actionable isolation instructions.
    6. `log_audit_completion` writes a final audit recap for execution tracking and audit lineage.
    7. The flow-level `errors` block alerts Slack immediately if InfluxDB authentication or network connectivity fails.

    ## What you get

    - Early warning of InfluxDB series cardinality explosion before memory exhaustion triggers node OOM kills.
    - Identification of exact offending measurements driving index bloat.
    - Automated Slack incident notifications with measurement names, series counts, and threshold context.
    - Configurable lookback windows and series capacity thresholds tailored to your cluster sizing.
    - Flow-level error alerting safeguarding audit pipeline reliability.

    ## Who it's for

    - Site Reliability Engineers and Platform Teams managing self-hosted InfluxDB OSS or Enterprise clusters.
    - Observability and DevOps Engineers maintaining high-throughput Prometheus, Telegraf, or OpenTelemetry ingestion.
    - Data Platform Engineers operating time-series telemetry pipelines for IoT or application monitoring.

    ## Why orchestrate this with Kestra

    Monitoring InfluxDB cardinality using detached cron jobs or external scripts requires managing
    client libraries, credential rotation, error handling, and notification webhooks in brittle
    custom code. Kestra provides a declarative workflow engine with native InfluxDB Flux support,
    centralized secret management, conditional branching, execution history, and native Slack
    alerting without operating dedicated monitoring daemons.

    ## Prerequisites

    - A running InfluxDB v2 instance (OSS v2.x or InfluxDB Cloud).
    - An InfluxDB API token with read permissions on the monitored bucket.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Local Docker Container Setup

    To run InfluxDB locally for development and testing without host port conflicts:

    ```bash
    docker run -d --name influxdb-dev -p 8086:8086 \
      -e DOCKER_INFLUXDB_INIT_MODE=setup \
      -e DOCKER_INFLUXDB_INIT_USERNAME=admin \
      -e DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123 \
      -e DOCKER_INFLUXDB_INIT_ORG=company-infra \
      -e DOCKER_INFLUXDB_INIT_BUCKET=telemetry \
      -e DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token \
      influxdb:2.7-alpine
    ```

    If Kestra is running inside a Docker network, connect the InfluxDB container to Kestra's network:

    ```bash
    docker network ls
    docker network connect YOUR_KESTRA_NETWORK influxdb-dev
    ```

    ### Secrets

    - `INFLUXDB_TOKEN`: API token permitted to execute Flux queries in the target InfluxDB organization.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for Slack alerting.

    > Note for Kestra Open-Source (OSS): Secrets are configured as base64-encoded environment variables formatted as `SECRET_<NAME>` (e.g. `SECRET_INFLUXDB_TOKEN`).

    ### Inputs

    | Name | Type | Default | Allowed Values | Description |
    | :--- | :--- | :--- | :--- | :--- |
    | `influxdb_host` | STRING | `"http://localhost:8086"` | Valid HTTP/S URL | InfluxDB API endpoint |
    | `influxdb_org` | STRING | `"company-infra"` | String identifier | InfluxDB organization name |
    | `target_bucket` | STRING | `"telemetry"` | Valid bucket name | Bucket inspected for cardinality |
    | `lookback_window` | STRING | `"1h"` | Valid Flux duration (`15m`, `1h`, `6h`) | Aggregation time window |
    | `max_series_threshold` | INT | `50000` | Positive integer | Maximum allowable series per measurement |
    | `remediation_mode` | SELECT | `"ALERT_ONLY"` | `"ALERT_ONLY"`, `"LOG_REMEDIATION"` | Action mode on cardinality breach |

    ### Outputs

    - `{{ outputs.probe_series_cardinality.rows }}`: List of top measurement records containing `_measurement`, `_field`, and `_value` (series count).
    - `{{ outputs.probe_series_cardinality.size }}`: Total number of measurement summary rows returned by the Flux query.

    ## Quick start

    1. Configure `INFLUXDB_TOKEN` and `SLACK_WEBHOOK` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. Run a manual execution with `inputs.target_bucket` set to your telemetry bucket to verify connectivity and series aggregation.
    4. Enable the `periodic_cardinality_audit` schedule trigger to run automated recurring audits.

    ## How to extend

    - Add automated tag isolation by triggering an downstream HTTP request to query InfluxDB schema keys (`schema.tagKeys()`) and identify the exact high-cardinality tag.
    - Integrate with PagerDuty or Opsgenie in the `SURGE_DETECTED` branch for critical production cluster alerts.
    - Chain an automated Telegraf or vector configuration reload subflow using `io.kestra.plugin.core.flow.Subflow` to filter out unbounded tag dimensions at the ingestion edge.

    ## Pitfalls

    - **Flux Query Timeout on Very Large Buckets**: If a bucket contains billions of points across wide timeframes, scanning a large lookback window may cause query timeouts. Keep `lookback_window` focused (e.g., `15m` to `1h`) for high-frequency time series data.
    - **InfluxDB v1 vs v2 Compatibility**: This blueprint utilizes Flux queries designed for InfluxDB v2.x and InfluxDB Cloud. If querying InfluxDB v1.8 compatibility endpoints, use `io.kestra.plugin.influxdb.InfluxQLQuery` with `SHOW SERIES CARDINALITY` syntax instead.
    - **Port Accessibility**: When running InfluxDB and Kestra in separate Docker containers, ensure hostnames resolve via container networks rather than referencing `localhost`.

    ## Links

    - [Kestra InfluxDB Plugin Documentation](https://kestra.io/plugins/plugin-influxdb)
    - [InfluxDB Time Series Cardinality Guide](https://docs.influxdata.com/influxdb/v2/write-data/best-practices/resolve-high-cardinality/)
    - [InfluxDB Flux Documentation](https://docs.influxdata.com/flux/v0/)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
