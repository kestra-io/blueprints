id: gcp-spanner-high-priority-cpu-saturation-sentinel
namespace: company.cloud

inputs:
  - id: project_id
    type: STRING
    description: Google Cloud Project ID.
  - id: instance_id
    type: STRING
    description: Google Cloud Spanner instance ID.
  - id: cpu_threshold_pct
    type: INT
    defaults: 65
    description: "Maximum allowable high-priority CPU utilization percentage before alerting (default 65%)."

tasks:
  - id: query_spanner_cpu
    type: io.kestra.plugin.gcp.cli.GCloudCLI
    projectId: "{{ inputs.project_id }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    commands:
      - |
        FILTER='metric.type="spanner.googleapis.com/instance/cpu/utilization_by_priority" AND resource.labels.instance_id="{{ inputs.instance_id }}" AND metric.labels.priority="high"'
        START_TIME=$(date -u -v-15M +%Y-%m-%dT%H:%M:%SZ)
        
        gcloud monitoring timeseries list           --filter="$FILTER"           --interval-start-time="$START_TIME"           --format=json > /tmp/spanner_cpu.json
        
        PEAK_CPU=$(jq '[.[]?.points[]?.value.doubleValue // 0.0] | max // 0.0' /tmp/spanner_cpu.json | awk '{print int($1 * 100)}')
        echo "::set-output name=peak_cpu::$PEAK_CPU::"

  - id: evaluate_cpu_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_spanner_cpu.vars.peak_cpu | int >= inputs.cpu_threshold_pct }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#cloud-ops",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Google Cloud Spanner High Priority CPU Saturated Alert",
                "text": "Cloud Spanner instance `{{ inputs.instance_id }}` in project `{{ inputs.project_id }}` reached peak high-priority CPU utilization of *{{ outputs.query_spanner_cpu.vars.peak_cpu }}%* (threshold {{ inputs.cpu_threshold_pct }}%)! Recommended maximum for regional instances (65%) or multi-region instances (45%) has been exceeded, threatening transactional latency SLA breaches.",
                "footer": "Kestra Cloud Sentinel • Google Cloud Spanner"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#cloud-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Google Cloud Spanner Sentinel Failure",
            "text": "Failed to query Cloud Monitoring for Spanner CPU metrics. Verify project ID and service account credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      project_id: replace-with-your-project-id
      instance_id: replace-with-your-instance-id

extend:
  metaDescription: "Monitors Google Cloud Spanner instance high-priority CPU utilization to prevent transactional latency spikes and query queuing."
  metaTitle: Google Cloud Spanner High Priority CPU Utilization Sentinel with Kestra
  title: Google Cloud Spanner High Priority CPU Utilization Sentinel
  shortDescription: Monitors Google Cloud Spanner instance high-priority CPU utilization to prevent transactional latency spikes and query queuing.
  description: |
    ## How it works
    This workflow connects to Google Cloud Monitoring via the official Kestra GCloudCLI plugin to query `spanner.googleapis.com/instance/cpu/utilization_by_priority` for high-priority operational workloads. Google Cloud Spanner enforces recommended maximum high-priority CPU utilization thresholds (65% for regional instances, 45% for multi-region instances) to provide headroom for automatic node failover and sudden traffic bursts. Crossing these thresholds forces incoming transactional read/write operations to queue, degrading application response times. This workflow evaluates CPU metrics and alerts platform teams before latency degradation occurs.

    ## What you get
    - Real-time detection of CPU capacity saturation on Google Cloud Spanner instances.
    - Prevents transactional latency spikes and read/write SLA violations.
    - Quantitative metrics on high-priority workload pressure.

    ## Who it's for
    - Cloud Database Administrators and Backend Systems Architects.
    - SREs maintaining globally distributed databases on Google Cloud Platform.

    ## Why orchestrate this with Kestra
    - **Native GCloud CLI Automation**: Direct integration using Kestra service account secrets.
    - **Proactive Headroom Guard**: Catches resource pressure before failover capacity is compromised.
    - **Direct Team Alerts**: Delivers notifications with CPU percentages directly to Slack.

    ## Prerequisites
    - Google Cloud Project with Cloud Monitoring API enabled and Spanner instance.
    - Secrets `GCP_SERVICE_ACCOUNT` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input GCP project ID and Spanner instance ID.
    3. Run the workflow to inspect current high-priority CPU utilization.

    ## How to extend
    - Automatically scale up Spanner processing units (nodes) via `gcloud spanner instances update` when sustained saturation occurs.
    - Query `SPANNER_SYS.QUERY_STATS_TOP_MINUTE` to isolate expensive SQL queries.

    ## Links
    - [Cloud Spanner CPU Utilization Documentation](https://cloud.google.com/spanner/docs/cpu-utilization)
    - [Kestra GCloud CLI Plugin](https://kestra.io/plugins/plugin-gcp/io.kestra.plugin.gcp.gcloud.gcloudcli)
  tags:
    - Cloud
    - Data
  subTags:
    - GCP Services
    - Infrastructure Automation
  ee: false
  verified: false
  demo: false
