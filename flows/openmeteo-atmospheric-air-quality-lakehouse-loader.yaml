id: openmeteo-air-quality-telemetry-lakehouse-loader
namespace: company.analytics
description: Ingests particulate matter (PM2.5, PM10) and atmospheric air quality metrics from Open-Meteo Air Quality API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: openmeteo-air-quality-telemetry-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=40.7128&longitude=-74.0060&hourly=pm10,pm2_5,carbon_monoxide,nitrogen_dioxide"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "hourly"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        times = items.get('time', [])
        pm10_list = items.get('pm10', [])
        pm25_list = items.get('pm2_5', [])
        co_list = items.get('carbon_monoxide', [])
        no2_list = items.get('nitrogen_dioxide', [])

        for i in range(len(times)):
            t = times[i]
            current_ids.append(t)
            def safe_f(lst, idx):
                try:
                    return float(lst[idx]) if lst[idx] is not None else 0.0
                except Exception:
                    return 0.0

            records.append({
                'record_time': str(t),
                'pm10': safe_f(pm10_list, i),
                'pm2_5': safe_f(pm25_list, i),
                'carbon_monoxide': safe_f(co_list, i),
                'nitrogen_dioxide': safe_f(no2_list, i),
                'is_new': bool(t not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE air_quality (
                record_time VARCHAR,
                pm10 DOUBLE,
                pm2_5 DOUBLE,
                carbon_monoxide DOUBLE,
                nitrogen_dioxide DOUBLE,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO air_quality SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY air_quality TO 'air_quality_hourly.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    SUBSTRING(record_time, 1, 10) AS date_bucket,
                    AVG(pm2_5) AS avg_pm2_5,
                    MAX(pm2_5) AS max_pm2_5,
                    AVG(pm10) AS avg_pm10
                FROM air_quality
                GROUP BY 1
                ORDER BY date_bucket ASC
            ) TO 'air_quality_daily_summary.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM air_quality WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM air_quality").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - air_quality_hourly.parquet
      - air_quality_daily_summary.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['air_quality_hourly.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "Open-Meteo Air Quality Telemetry sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
