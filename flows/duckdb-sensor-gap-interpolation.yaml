id: duckdb-sensor-gap-interpolation
namespace: company.data
inputs:
- id: samples
  type: FILE
  description: CSV with sensor_id, observed_at and value columns. Observations must lie on the requested grid.
- id: sensors
  type: JSON
  defaults:
  - device-01
  description: Explicit list of 1–100 expected sensor IDs, including devices with no observations.
- id: start_at
  type: STRING
  description: Inclusive ISO 8601 window start with Z or an explicit UTC offset.
- id: end_at
  type: STRING
  description: Exclusive ISO 8601 window end with Z or an explicit UTC offset.
- id: step_seconds
  type: INT
  defaults: 60
  min: 1
  max: 3600
- id: max_gap_steps
  type: INT
  defaults: 2
  min: 0
  max: 60
  description: Fill only internal gaps with at most this many missing grid points. Zero disables interpolation.
tasks:
- id: preflight
  type: io.kestra.plugin.core.flow.Parallel
  description: Validate the requested grid independently of measuring the source file.
  tasks:
  - id: source_size
    type: io.kestra.plugin.core.storage.Size
    uri: '{{ inputs.samples }}'
  - id: configuration
    type: io.kestra.plugin.jdbc.duckdb.Queries
    timeZoneId: UTC
    parameters:
      sensor_list: '{{ inputs.sensors | toJson }}'
      start_at: '{{ inputs.start_at }}'
      end_at: '{{ inputs.end_at }}'
      step_seconds: '{{ inputs.step_seconds }}'
      max_gap_steps: '{{ inputs.max_gap_steps }}'
    outputFiles:
    - settings.parquet
    - sensors.parquet
    sql: |
      CREATE TABLE checks (ok BOOLEAN NOT NULL CHECK (ok));
      INSERT INTO checks VALUES (json_type(CAST(:sensor_list AS JSON)) = 'ARRAY');
      INSERT INTO checks VALUES
        (regexp_full_match(:start_at, '.*(Z|[+-][0-9]{2}:[0-9]{2})')),
        (regexp_full_match(:end_at, '.*(Z|[+-][0-9]{2}:[0-9]{2})'));
      CREATE TABLE settings (
        start_at TIMESTAMPTZ NOT NULL,
        end_at TIMESTAMPTZ NOT NULL,
        step_seconds BIGINT NOT NULL CHECK (step_seconds BETWEEN 1 AND 3600),
        max_gap_steps BIGINT NOT NULL CHECK (max_gap_steps BETWEEN 0 AND 60),
        CHECK (end_at > start_at),
        CHECK ((epoch_us(end_at) - epoch_us(start_at)) % (step_seconds * 1000000) = 0)
      );
      INSERT INTO settings VALUES
        (CAST(:start_at AS TIMESTAMPTZ), CAST(:end_at AS TIMESTAMPTZ), :step_seconds, :max_gap_steps);
      CREATE TABLE sensors (
        sensor_id VARCHAR PRIMARY KEY CHECK (length(trim(sensor_id)) BETWEEN 1 AND 128),
        json_kind VARCHAR NOT NULL CHECK (json_kind = 'VARCHAR')
      );
      INSERT INTO sensors
      SELECT json_extract_string(value, '$'), type FROM json_each(CAST(:sensor_list AS JSON));
      INSERT INTO checks SELECT count(*) BETWEEN 1 AND 100 FROM sensors;
      INSERT INTO checks
      SELECT ((epoch_us(end_at) - epoch_us(start_at)) // (step_seconds * 1000000))
             * (SELECT count(*) FROM sensors) BETWEEN 1 AND 200000
      FROM settings;
      COPY settings TO '{{ outputFiles['settings.parquet'] }}' (FORMAT PARQUET);
      COPY sensors TO '{{ outputFiles['sensors.parquet'] }}' (FORMAT PARQUET);
- id: bound_source
  type: io.kestra.plugin.core.execution.Assert
  conditions:
  - '{{ outputs.source_size.size > 0 and outputs.source_size.size <= 10485760 }}'
- id: validate_samples
  type: io.kestra.plugin.jdbc.duckdb.Queries
  timeZoneId: UTC
  inputFiles:
    samples.csv: '{{ inputs.samples }}'
    settings.parquet: '{{ outputs.configuration.outputFiles[''settings.parquet''] }}'
    sensors.parquet: '{{ outputs.configuration.outputFiles[''sensors.parquet''] }}'
  outputFiles:
  - samples.parquet
  sql: |
    CREATE TABLE checks (ok BOOLEAN NOT NULL CHECK (ok));
    CREATE TABLE settings AS SELECT * FROM read_parquet('{{ workingDir }}/settings.parquet');
    CREATE TABLE sensors AS SELECT * FROM read_parquet('{{ workingDir }}/sensors.parquet');
    CREATE TABLE raw AS
    SELECT sensor_id, observed_at, value
    FROM read_csv('{{ workingDir }}/samples.csv', header = true, all_varchar = true, strict_mode = true);
    INSERT INTO checks SELECT count(*) <= 100000 FROM raw;
    INSERT INTO checks
    SELECT COALESCE(bool_and(regexp_full_match(observed_at, '.*(Z|[+-][0-9]{2}:[0-9]{2})')), true)
    FROM raw;
    CREATE TABLE samples (
      sensor_id VARCHAR NOT NULL ,
      observed_at TIMESTAMPTZ NOT NULL,
      reading DOUBLE NOT NULL CHECK (isfinite(reading)),
      PRIMARY KEY (sensor_id, observed_at)
    );
    INSERT INTO samples
    SELECT sensor_id, CAST(observed_at AS TIMESTAMPTZ), CAST(value AS DOUBLE) FROM raw;
    INSERT INTO checks
    SELECT COALESCE(bool_and(observed_at >= start_at AND observed_at < end_at
      AND (epoch_us(observed_at) - epoch_us(start_at)) % (step_seconds * 1000000) = 0), true)
    FROM samples CROSS JOIN settings;
    INSERT INTO checks SELECT count(*) = 0 FROM samples WHERE sensor_id NOT IN (SELECT sensor_id FROM sensors);
    COPY samples TO '{{ outputFiles['samples.parquet'] }}' (FORMAT PARQUET);
- id: interpolate
  type: io.kestra.plugin.jdbc.duckdb.Queries
  timeZoneId: UTC
  inputFiles:
    settings.parquet: '{{ outputs.configuration.outputFiles[''settings.parquet''] }}'
    sensors.parquet: '{{ outputs.configuration.outputFiles[''sensors.parquet''] }}'
    samples.parquet: '{{ outputs.validate_samples.outputFiles[''samples.parquet''] }}'
  outputFiles:
  - series.parquet
  sql: |
    CREATE TABLE checks (ok BOOLEAN NOT NULL CHECK (ok));
    CREATE TABLE settings AS SELECT * FROM read_parquet('{{ workingDir }}/settings.parquet');
    CREATE TABLE sensors AS SELECT * FROM read_parquet('{{ workingDir }}/sensors.parquet');
    CREATE TABLE samples AS SELECT * FROM read_parquet('{{ workingDir }}/samples.parquet');
    CREATE TABLE grid AS
    SELECT s.sensor_id, slots.slot AS observed_at, o.reading AS observed_value
    FROM sensors s CROSS JOIN settings cfg
    CROSS JOIN LATERAL generate_series(
      cfg.start_at, cfg.end_at - cfg.step_seconds * INTERVAL '1 SECOND',
      cfg.step_seconds * INTERVAL '1 SECOND') AS slots(slot)
    LEFT JOIN samples o ON o.sensor_id = s.sensor_id AND o.observed_at = slots.slot;
    CREATE TABLE anchors AS
    SELECT *,
      last_value(observed_value IGNORE NULLS) OVER previous AS previous_value,
      last_value(CASE WHEN observed_value IS NOT NULL THEN observed_at END IGNORE NULLS)
        OVER previous AS previous_at,
      first_value(observed_value IGNORE NULLS) OVER following AS next_value,
      first_value(CASE WHEN observed_value IS NOT NULL THEN observed_at END IGNORE NULLS)
        OVER following AS next_at
    FROM grid
    WINDOW previous AS (PARTITION BY sensor_id ORDER BY observed_at
                        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW),
           following AS (PARTITION BY sensor_id ORDER BY observed_at
                         ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING);
    CREATE TABLE series AS
    WITH classified AS (
      SELECT a.*, cfg.max_gap_steps,
        (epoch_us(next_at) - epoch_us(previous_at)) // (cfg.step_seconds * 1000000) - 1 AS gap_steps,
        CAST(epoch_us(observed_at) - epoch_us(previous_at) AS DOUBLE)
          / nullif(epoch_us(next_at) - epoch_us(previous_at), 0) AS fraction
      FROM anchors a CROSS JOIN settings cfg
    )
    SELECT sensor_id, observed_at, observed_value,
      CASE WHEN observed_value IS NOT NULL THEN observed_value
           WHEN gap_steps <= max_gap_steps
           THEN previous_value * (1 - fraction) + next_value * fraction END AS value,
      CASE WHEN observed_value IS NOT NULL THEN 'OBSERVED'
           WHEN gap_steps <= max_gap_steps THEN 'INTERPOLATED' ELSE 'MISSING' END AS status,
      previous_at, next_at,
      CASE WHEN observed_value IS NOT NULL THEN 0 ELSE gap_steps END AS gap_steps
    FROM classified;
    INSERT INTO checks SELECT bool_and(value IS NULL OR isfinite(value)) FROM series;
    COPY (SELECT * FROM series ORDER BY sensor_id, observed_at) TO '{{ outputFiles['series.parquet'] }}' (FORMAT PARQUET, COMPRESSION ZSTD);
- id: coverage
  type: io.kestra.plugin.jdbc.duckdb.Queries
  timeZoneId: UTC
  description: Read the actual exported Parquet, verify its row count and provenance invariants, then report coverage.
  inputFiles:
    settings.parquet: '{{ outputs.configuration.outputFiles[''settings.parquet''] }}'
    sensors.parquet: '{{ outputs.configuration.outputFiles[''sensors.parquet''] }}'
    series.parquet: '{{ outputs.interpolate.outputFiles[''series.parquet''] }}'
  outputFiles:
  - summary.csv
  sql: |
    CREATE TABLE settings AS SELECT * FROM read_parquet('{{ workingDir }}/settings.parquet');
    CREATE TABLE sensors AS SELECT * FROM read_parquet('{{ workingDir }}/sensors.parquet');
    CREATE TABLE series AS SELECT * FROM read_parquet('{{ workingDir }}/series.parquet');
    CREATE TABLE checks (ok BOOLEAN NOT NULL CHECK (ok));
    INSERT INTO checks SELECT (SELECT count(*) FROM series) =
      ((epoch_us(end_at) - epoch_us(start_at)) // (step_seconds * 1000000))
      * (SELECT count(*) FROM sensors) FROM settings;
    INSERT INTO checks SELECT bool_and(
      (status = 'MISSING' AND value IS NULL AND observed_value IS NULL)
      OR (status = 'OBSERVED' AND value = observed_value)
      OR (status = 'INTERPOLATED' AND value IS NOT NULL AND observed_value IS NULL)
    ) FROM series;
    COPY (
      SELECT sensor_id, count(*) AS grid_rows,
        count(*) FILTER (WHERE status = 'OBSERVED') AS observed_rows,
        count(*) FILTER (WHERE status = 'INTERPOLATED') AS interpolated_rows,
        count(*) FILTER (WHERE status = 'MISSING') AS missing_rows
      FROM series GROUP BY sensor_id ORDER BY sensor_id
    ) TO '{{ outputFiles['summary.csv'] }}' (FORMAT CSV, HEADER true);
outputs:
- id: series
  type: FILE
  required: false
  value: '{{ outputs.interpolate.outputFiles[''series.parquet''] ?? null }}'
- id: summary
  type: FILE
  required: false
  value: '{{ outputs.coverage.outputFiles[''summary.csv''] ?? null }}'
triggers:
- id: incoming_batch
  type: io.kestra.plugin.core.trigger.Webhook
  key: '{{ secret(''SENSOR_WEBHOOK_KEY'') }}'
  inputs:
    samples: '{{ trigger.body.samples }}'
    sensors: '{{ trigger.body.sensors }}'
    start_at: '{{ trigger.body.start_at }}'
    end_at: '{{ trigger.body.end_at }}'
    step_seconds: '{{ trigger.body.step_seconds ?? 60 }}'
    max_gap_steps: '{{ trigger.body.max_gap_steps ?? 2 }}'
extend:
  title: Fill short sensor gaps with DuckDB and preserve outage provenance
  metaTitle: Bounded sensor gap interpolation with DuckDB | Kestra
  shortDescription: Build a regular sensor grid, interpolate only short internal gaps, and preserve long outages
    and absent devices as missing rows.
  metaDescription: Resample sensor CSVs with DuckDB, fill only bounded internal gaps, and export Parquet with observed,
    interpolated and missing provenance.
  description: |
    A smooth-looking time series can hide a disconnected sensor. This flow fills
    only short gaps bracketed by real observations. Long outages, leading/trailing
    gaps and entirely absent expected sensors remain visible in the output.

    ## How it works
    1. Upload a CSV or pass its Kestra storage URI through the keyed webhook.
    2. Validate the expected sensor list, explicit-offset timestamps, finite readings,
       unique sensor/time pairs and alignment to the requested grid.
    3. DuckDB builds the regular grid. Window functions find the
       nearest real observations; linear interpolation fills only eligible internal gaps.
    4. Export ordered Parquet plus per-sensor coverage counts as CSV.

    ## What you get
    - One row per expected sensor and grid point in the half-open `[start_at, end_at)` window.
    - OBSERVED, INTERPOLATED or MISSING status, original observed value, anchor times and gap length.
    - No extrapolation, cross-device interpolation, deduplication or silent out-of-window filtering.

    ## Who it's for
    - Data engineers preparing continuous-valued fleet, environmental or equipment telemetry.

    ## Why orchestrate this with Kestra
    Validation and interpolation exchange typed Parquet checkpoints. A final task
    reads the exported series to check row counts and provenance. Invalid input stops execution. The webhook can reuse
    a producer's stored CSV, and both output artifacts remain attached to the run.

    ## Prerequisites
    - Kestra with the DuckDB JDBC plugin. No database service, Python or Docker runner.
    - UTF-8 CSV containing `sensor_id,observed_at,value`; values must be finite numbers.
      Missing readings are absent rows, not blank or NaN values. Timestamps need Z or an offset.
    - 1–100 expected sensor IDs, at most 100,000 observations and a 10 MiB file.
      The requested window must contain a whole number of steps and at most 200,000 total grid rows.
    - Interpolate only measurements where linear estimation is appropriate; these are estimates, not observations.

    ### Secrets
    - `SENSOR_WEBHOOK_KEY`: Authentication key for automated batch submissions.

    ## Quick start
    1. Set the secret and upload your CSV, listing every expected sensor explicitly.
    2. Set window bounds, step seconds and maximum missing steps; execute and inspect both artifacts.
    3. Automate with a JSON webhook body containing `samples` (a `kestra:///...` URI),
       `sensors`, `start_at` and `end_at`. Step and gap limits have defaults.

    ## How to extend
    - Route low-coverage sensors for review or load the Parquet into an analytical warehouse.

    ## Links
    - [DuckDB plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Window functions](https://duckdb.org/docs/stable/sql/functions/window_functions)
  tags:
  - Data
  subTags:
  - ELT & Warehouse Loading
  - Testing & Quality
  ee: false
  demo: false
