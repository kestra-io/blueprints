id: aws-secretsmanager-unrotated-secret-sentinel
namespace: company.security

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region where secrets reside.
  - id: max_staleness_days_threshold
    type: INT
    defaults: 90
    description: Maximum allowable days without secret rotation before alerting.

tasks:
  - id: audit_secrets_rotation
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws secretsmanager list-secrets --output json > secrets.json
        python3 -c "
        import json, datetime
        with open('secrets.json') as f:
            secrets = json.load(f).get('SecretList', [])
        stale_secrets = []
        now = datetime.datetime.utcnow()
        for s in secrets[:30]:
            name = s.get('Name')
            rot_enabled = s.get('RotationEnabled', False)
            last_rotated = s.get('LastRotatedDate') or s.get('LastChangedDate')
            if not rot_enabled:
                if last_rotated:
                    rot_date = datetime.datetime.fromtimestamp(last_rotated)
                    days_old = (now - rot_date).days
                    if days_old >= {{ inputs.max_staleness_days_threshold }}:
                        stale_secrets.append({'name': name, 'days_stale': days_old, 'rotation_enabled': False})
                else:
                    stale_secrets.append({'name': name, 'days_stale': 'unknown', 'rotation_enabled': False})
        result = {
            'region': '{{ inputs.aws_region }}',
            'stale_secrets_count': len(stale_secrets),
            'stale_secrets': stale_secrets[:5],
            'alert_triggered': len(stale_secrets) > 0
        }
        with open('secrets_summary.json', 'w') as out:
            json.dump(result, out)
        print('Secrets Manager audit:', result)
        "
    outputFiles:
      - secrets_summary.json

  - id: evaluate_stale_secrets
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.audit_secrets_rotation.outputFiles['secrets_summary.json'])).alert_triggered }}"
    then:
      - id: alert_secops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *AWS Secrets Manager Hygiene Alert*: Detected {{ fromJson(read(outputs.audit_secrets_rotation.outputFiles['secrets_summary.json'])).stale_secrets_count }} secrets in {{ inputs.aws_region }} with rotation disabled or exceeding {{ inputs.max_staleness_days_threshold }} days without rotation. Credential hygiene review required."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Secrets Manager Sentinel Failure*: Failed to list secrets in {{ inputs.aws_region }}."
      }

triggers:
  - id: weekly_secrets_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true

extend:
  metaDescription: "Audits AWS Secrets Manager to detect unrotated credentials exceeding 90 days and enforce automated rotation policies."
  metaTitle: AWS Secrets Manager Unrotated and Stale Secret Sentinel with Kestra
  title: AWS Secrets Manager Unrotated and Stale Secret Sentinel
  shortDescription: Audits AWS Secrets Manager to detect unrotated credentials exceeding 90 days and enforce automated rotation policies.
  description: |
    ## How it works
    This sentinel leverages `AwsCLI` to list secrets in AWS Secrets Manager across the target region. It evaluates `RotationEnabled` flags and calculates days elapsed since the secret was last rotated, alerting SecOps teams when static or dormant credentials violate compliance rotation standards.

    ## What you get
    - Proactive visibility into stale database, API, and third-party credentials.
    - Early prevention of compliance non-conformities under SOC 2, HIPAA, and PCI-DSS.
    - Automated Slack delivery detailing secret names and days of staleness.

    ## Who it's for
    - Security operations (SecOps) teams and cloud governance officers.
    - Application architects overseeing automated secret management.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled operational health checks with native error handling, secret injection, and multi-channel alerting.

    ## Prerequisites
    - AWS IAM credentials with `secretsmanager:ListSecrets` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `aws_region`, threshold days, and credentials.
    3. Run manually to check current secret rotation ages.

    ## How to extend
    - Configure automated rotation via `secretsmanager:RotateSecret` Lambda functions.
    - Verify secret resource policies to block cross-account access.
    - Export secret audit inventory to AWS Security Hub.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [AWS Secrets Manager Rotation](https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html)
  tags:
    - Cloud
    - Business
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  verified: false
  demo: false
