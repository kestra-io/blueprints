id: hashicorp-vault-token-accessor-leak-sentinel
namespace: company.team
description: Audits HashiCorp Vault token accessors to detect unrevoked orphaned tokens and secret storage backend bloat.

inputs:
  - id: vault_addr
    type: STRING
    defaults: "http://vault.internal:8200"
    description: Vault server address.

  - id: max_token_count
    type: INT
    defaults: 500
    description: Maximum acceptable count of active token accessors before triggering leak warning.

tasks:
  - id: audit_token_accessors
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    description: Query Vault /v1/auth/token/accessors to count active token accessors
    env:
      VAULT_ADDR: "{{ inputs.vault_addr }}"
      VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
      MAX_TOKEN_COUNT: "{{ inputs.max_token_count }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      vault_addr = os.environ.get("VAULT_ADDR", "http://vault.internal:8200").rstrip("/")
      token = os.environ.get("VAULT_TOKEN")
      max_count = int(os.environ.get("MAX_TOKEN_COUNT", "500"))

      if not token:
          print("CRITICAL: VAULT_TOKEN secret must be configured", file=sys.stderr)
          sys.exit(1)

      headers = {
          "X-Vault-Token": token,
          "User-Agent": "Kestra-Vault-Sentinel"
      }

      url = f"{vault_addr}/v1/auth/token/accessors"
      try:
          resp = requests.request("LIST", url, headers=headers, timeout=30)
          resp.raise_for_status()
          keys = resp.json().get("data", {}).get("keys", [])
      except Exception as e:
          print(f"CRITICAL: Failed to list token accessors at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      token_count = len(keys)
      alert_triggered = token_count > max_count
      print(f"Active token accessors: {token_count} (threshold: {max_count})")

      Kestra.outputs({
          "vault_addr": vault_addr,
          "token_count": token_count,
          "max_token_threshold": max_count,
          "alert_triggered": alert_triggered
      })

  - id: evaluate_token_sprawl
    type: io.kestra.plugin.core.flow.If
    description: Alert security team if token accessors exceed threshold
    condition: "{{ outputs.audit_token_accessors.vars.alert_triggered == true }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#sec-ops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 HashiCorp Vault Orphaned Token Sprawl and Leak Alert",
                "text": "Vault cluster at `{{ inputs.vault_addr }}` has accumulated *{{ outputs.audit_token_accessors.vars.token_count }}* active token accessors (threshold: {{ inputs.max_token_count }}). CI/CD jobs or microservices may be generating orphaned service tokens without explicit TTLs or revocations.",
                "footer": "Kestra Security Sentinel • Vault Tokens"
              }
            ]
          }

outputs:
  - id: token_count
    type: INT
    value: "{{ outputs.audit_token_accessors.vars.token_count }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.audit_token_accessors.vars.alert_triggered }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#sec-ops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Vault Token Sentinel Execution Failed",
            "text": "The Vault token accessor audit query failed on {{ inputs.vault_addr }} during execution `{{ execution.id }}`. Please verify Vault address, token permissions, and network reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  metaDescription: Audits HashiCorp Vault token accessors to detect unrevoked orphaned tokens and secret storage backend bloat.
  metaTitle: HashiCorp Vault Token Accessor Sprawl and Storage Leak Sentinel with Kestra
  title: HashiCorp Vault Token Accessor Sprawl and Storage Leak Sentinel
  shortDescription: Audits HashiCorp Vault token accessors to detect unrevoked orphaned tokens and secret storage backend bloat.
  description: |
    ## How it works
    This workflow connects to the HashiCorp Vault HTTP API endpoint `/v1/auth/token/accessors` to audit the total number of active token accessors across the cluster. When automated CI/CD runners, Terraform plans, or applications request Vault tokens without child-token revocation hierarchies or short TTLs, token counts multiply indefinitely. When active accessors exceed the safety threshold, an automated security incident alert is dispatched to Slack.

    ## What you get
    - Proactive detection of leaked or unrevoked authentication tokens.
    - Prevents Consul / Raft storage backend bloat caused by hundreds of thousands of orphaned token entries.
    - Promotes least-privilege security posture and timely token lifecycle expiration.

    ## Who it's for
    - Security Engineers and DevSecOps practitioners managing HashiCorp Vault infrastructure.
    - Platform Engineers responsible for CI/CD pipeline credential hygiene.

    ## Prerequisites
    - HashiCorp Vault cluster with an administrative token granting `list` on `auth/token/accessors`.
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Security
  ee: false
  demo: false
