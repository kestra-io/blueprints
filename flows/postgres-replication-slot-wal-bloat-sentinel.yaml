id: postgres-replication-slot-wal-bloat-sentinel
namespace: company.data
description: |
  Inspects PostgreSQL replication slots for inactive consumers retaining excessive write-ahead log (WAL) files,
  preventing disk exhaustion and database crash states.
inputs:
  - id: database_host
    type: STRING
    displayName: Database Host
    defaults: postgres-primary.internal
  - id: database_port
    type: INT
    displayName: Database Port
    defaults: 5432
  - id: database_name
    type: STRING
    displayName: Database Name
    defaults: production
  - id: database_username
    type: STRING
    displayName: Database Username
    defaults: postgres_admin
  - id: max_wal_retained_bytes_threshold
    type: INT
    displayName: Max Retained WAL Bytes (Default 10GB)
    defaults: 10737418240

triggers:
  - id: periodic_replication_slot_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: query_replication_slots
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Queries pg_replication_slots to identify active vs inactive slots and retained WAL size
    url: "jdbc:postgresql://{{ inputs.database_host }}:{{ inputs.database_port }}/{{ inputs.database_name }}"
    username: "{{ inputs.database_username }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT
        slot_name,
        plugin,
        slot_type,
        active,
        pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn) AS retained_bytes
      FROM pg_replication_slots
      ORDER BY retained_bytes DESC;
    fetchType: FETCH

  - id: evaluate_wal_retention
    type: io.kestra.plugin.scripts.shell.Commands
    description: Evaluates query results against threshold to detect WAL bloating slots
    runner: PROCESS
    env:
      SLOT_DATA: "{{ outputs.query_replication_slots.rows | toJson }}"
      THRESHOLD: "{{ inputs.max_wal_retained_bytes_threshold }}"
    commands:
      - |
        cat << 'PYEOF' > evaluate.py
        import os, json
        slots = json.loads(os.environ.get('SLOT_DATA', '[]'))
        threshold = int(os.environ.get('THRESHOLD', '10737418240'))
        
        bloated = []
        for s in slots:
            bytes_held = s.get('retained_bytes') or 0
            if bytes_held > threshold or (not s.get('active') and bytes_held > 1073741824):
                bloated.append({
                    'slot_name': s.get('slot_name'),
                    'active': s.get('active'),
                    'retained_mb': round(bytes_held / (1024 * 1024), 2)
                })
        
        with open('bloated_slots.json', 'w') as f:
            json.dump(bloated, f)
        
        print(f'::{"outputs":{"bloated_count": {len(bloated)}}}::')
        PYEOF
        python3 evaluate.py
    outputFiles:
      - bloated_slots.json

  - id: branch_on_wal_bloat
    type: io.kestra.plugin.core.flow.If
    description: Alerts Slack when unconsumed replication slots retain dangerous volumes of WAL
    condition: "{{ outputs.evaluate_wal_retention.vars.bloated_count > 0 }}"
    then:
      - id: alert_dba_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts DBA / Data engineering team on Slack
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "🚨 *PostgreSQL Replication Slot WAL Bloat Alert*\n*Database Host:* `{{ inputs.database_host }}`\n*Bloated Slots Detected:* *{{ outputs.evaluate_wal_retention.vars.bloated_count }}*\n\nInactive or lagging replication slots are holding excess WAL logs, threatening primary disk storage exhaustion."
          }
    else:
      - id: log_slots_healthy
        type: io.kestra.plugin.core.log.Log
        message: "PostgreSQL replication slots on {{ inputs.database_host }} are healthy and within WAL retention limits."

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack on audit workflow failure
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "⚠️ *PostgreSQL Replication Sentinel Failed* during execution `{{ execution.id }}` on host `{{ inputs.database_host }}`."
      }

extend:
  title: PostgreSQL Replication Slot WAL Retention and Storage Bloat Sentinel
  shortDescription: Monitor PostgreSQL replication slots for inactive consumers retaining gigabytes of write-ahead logs, alerting DBAs before disk exhaustion.
  metaTitle: PostgreSQL Replication Slot WAL Bloat Sentinel with Kestra
  metaDescription: Automated PostgreSQL replication slot monitoring with Kestra. Query pg_replication_slots and alert on unconsumed WAL bloat.
  description: |
    Logical and physical replication slots in PostgreSQL decouple subscriber consumption from the primary database engine. However, if a subscriber process crashes, disconnects, or lags indefinitely, PostgreSQL is forced to retain all write-ahead log (WAL) files generated since the slot's restart LSN.

    Without automated monitoring, this condition quickly consumes 100% of the primary database disk storage, triggering an emergency read-only failover or complete database crash.

    This blueprint queries `pg_replication_slots` periodically, calculates retained bytes using `pg_wal_lsn_diff()`, flags any inactive or lagging slots exceeding storage safety margins, and dispatches real-time alerts to DBAs.

    ## How it works

    1. `periodic_replication_slot_audit` triggers on a 15-minute schedule.
    2. `query_replication_slots` executes a SQL query on `pg_replication_slots` to fetch current retention metrics.
    3. `evaluate_wal_retention` calculates the exact WAL retained in megabytes and checks for slots exceeding the byte threshold or inactive slots retaining >1GB.
    4. `branch_on_wal_bloat` dispatches a Slack alert to the DBA team if bloated slots are found.
    5. `log_slots_healthy` logs green status when all slots are healthy.
    6. `errors` block alerts on connection or execution failures.

    ## What you get

    - Automated detection of abandoned or lagging CDC (Debezium/Kafka) and replica slots.
    - Protection against sudden primary disk exhaustion crashes.
    - Clear Slack alerts with slot counts and retention metrics.

    ## Who it's for

    - Database Administrators (DBAs) managing PostgreSQL clusters.
    - Data Engineers running Change Data Capture (CDC) pipelines.
    - Site Reliability Engineers ensuring database uptime.

    ## Why orchestrate this with Kestra

    Kestra features native JDBC plugins that connect securely to PostgreSQL instances, process query results, and orchestrate conditional multi-channel alerts without custom monitoring daemons.

    ## Prerequisites

    - PostgreSQL 10+ database instance with replication slots enabled.
    - Database user credentials with permissions to query `pg_replication_slots`.
    - A Slack incoming webhook URL.

    ### Secrets

    - `POSTGRES_PASSWORD`: Password for the database user.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for Slack alerts.

    ## Inputs

    - `database_host`: Primary PostgreSQL host.
    - `database_port`: PostgreSQL port (default: 5432).
    - `database_name`: Database name.
    - `database_username`: Database user name.
    - `max_wal_retained_bytes_threshold`: Byte threshold before alerting (default: 10GB).

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Configure the `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` secrets.
    3. Run manually to inspect replication slots.
    4. Enable the schedule trigger for continuous sentinel monitoring.

    ## How to extend

    - Add an automated task to drop abandoned temporary test slots.
    - Route urgent alerts to PagerDuty or OpsGenie.

    ## Links

    - [PostgreSQL Replication Slots Documentation](https://www.postgresql.org/docs/current/warm-standby.html#STREAMING-REPLICATION-SLOTS)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgresql)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Database Monitoring
  ee: false
  demo: false
