id: branchjanitor
namespace: company.team
description: Finds stale branches in a GitHub repo, deletes them, and reports the cleanup on Slack.

labels:
  project: branchjanitor
  team: github

inputs:
  - id: repo
    type: STRING
    displayName: "Repository"
    description: the repo whose branches to clean, as owner/repo
  - id: upstream_repo
    type: STRING
    displayName: "Upstream repository"
    description: for forks only, the upstream repo as owner/repo. PRs are looked up there, branches are cleaned on repo
    defaults: ""
  - id: stale_days
    type: INT
    displayName: "Stale threshold (days)"
    description: branches with no PR and no commit for this long count as abandoned
    defaults: 90
  - id: dry_run
    type: BOOL
    displayName: "Dry run"
    description: when true, only reports what would be deleted without deleting anything
    defaults: true
  - id: slack_webhook
    type: STRING
    displayName: "Slack Webhook URL"
    description: Incoming webhook URL of the Slack channel for the cleanup report

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: cleans up stale branches every Sunday morning
    cron: "0 8 * * 0"
    timezone: UTC
    inputs:
      repo: "your-org/your-repo"
      upstream_repo: ""
      stale_days: 90
      dry_run: true
      slack_webhook: "{{ secret('SLACK_WEBHOOK') }}"

tasks:
  - id: find_stale
    type: io.kestra.plugin.scripts.python.Script
    description: finds stale branches, never touching protected or in-progress ones
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: python:3.11
    dependencies:
      - kestra
    outputFiles:
      - stale.txt
    script: |
      import json
      import urllib.request
      import urllib.parse
      from datetime import datetime, timezone, timedelta
      from kestra import Kestra

      repo = """{{ inputs.repo }}""".strip()
      upstream = """{{ inputs.upstream_repo }}""".strip()
      stale_days = int("""{{ inputs.stale_days }}""")
      dry_run = """{{ inputs.dry_run }}""".strip().lower() == "true"
      token = """{{ secret('GITHUB_TOKEN') }}"""
      owner, name = repo.split("/", 1)
      # fork workflow: PRs live on the upstream repo, branches live on the fork
      pr_repo = upstream if upstream else repo
      pr_owner, pr_name = pr_repo.split("/", 1)

      def api(method, path):
          req = urllib.request.Request(
              f"https://api.github.com{path}",
              method=method,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req) as resp:
              body = resp.read().decode()
              return json.loads(body) if body else None

      def paged(path):
          out, page = [], 1
          while True:
              sep = "&" if "?" in path else "?"
              chunk = api("GET", f"{path}{sep}per_page=100&page={page}")
              if not chunk:
                  break
              out.extend(chunk)
              page += 1
          return out

      default_branch = api("GET", f"/repos/{owner}/{name}")["default_branch"]
      cutoff = datetime.now(timezone.utc) - timedelta(days=stale_days)

      stale = []
      for br in paged(f"/repos/{owner}/{name}/branches"):
          bname = br["name"]
          if bname == default_branch:
              continue  # never the default branch
          if br.get("protected"):
              continue  # never protected branches
          sha = br["commit"]["sha"]
          commit = api("GET", f"/repos/{owner}/{name}/commits/{sha}")
          committed_at = datetime.fromisoformat(
              commit["commit"]["author"]["date"].replace("Z", "+00:00")
          )
          head = f"{owner}:{urllib.parse.quote(bname, safe='')}"
          prs = api("GET", f"/repos/{pr_owner}/{pr_name}/pulls?head={head}&state=all")
          if any(p["state"] == "open" for p in prs):
              continue  # work in progress, never touch
          merged = any(p.get("merged_at") for p in prs)
          abandoned = not prs and committed_at < cutoff
          if merged or abandoned:
              age = (datetime.now(timezone.utc) - committed_at).days
              reason = "merged PR" if merged else f"no PR, last commit {age}d ago"
              stale.append({"name": bname, "reason": reason})

      with open("stale.txt", "w") as f:
          for s in stale:
              f.write(s["name"] + "\n")

      if dry_run:
          title = f"*BranchJanitor - dry run in '{repo}'*"
          tail = "would delete {n} branch(es). set dry_run to false to actually clean."
      else:
          title = f"*BranchJanitor - cleaned '{repo}'*"
          tail = "deleted {n} branch(es)."
      lines = [title, ""]
      for s in stale:
          lines.append(f"- *{s['name']}*: {s['reason']}")
      lines.append("")
      lines.append(tail.format(n=len(stale)))
      summary_text = "\n".join(lines)

      Kestra.outputs({
          'stale': stale,
          'count': len(stale),
          'summary_text': summary_text,
      })

  - id: maybe_clean
    type: io.kestra.plugin.core.flow.If
    description: only acts when there is something stale to report
    condition: "{{ outputs.find_stale.vars.count > 0 }}"
    then:
      - id: do_clean
        type: io.kestra.plugin.core.flow.If
        description: deletes the stale branches, live mode only
        condition: "{{ inputs.dry_run == false }}"
        then:
          - id: delete_branches
            type: io.kestra.plugin.scripts.python.Script
            description: deletes each stale branch through the GitHub API
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              user: "0"
            containerImage: python:3.11
            dependencies:
              - kestra
            script: |
              import urllib.request
              import urllib.parse

              repo = """{{ inputs.repo }}""".strip()
              token = """{{ secret('GITHUB_TOKEN') }}"""
              owner, name = repo.split("/", 1)

              with open("""{{ outputs.find_stale.outputFiles['stale.txt'] }}""") as f:
                  branches = [line.strip() for line in f if line.strip()]

              for b in branches:
                  ref = urllib.parse.quote(b, safe="")
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{owner}/{name}/git/refs/heads/{ref}",
                      method="DELETE",
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  urllib.request.urlopen(req).read()
      - id: send_summary
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: posts the cleanup summary to Slack
        url: "{{ inputs.slack_webhook }}"
        messageText: "{{ outputs.find_stale.vars.summary_text }}"

extend:
  title: "BranchJanitor - GitHub stale branch cleaner"
  shortDescription: "Deletes stale branches from a GitHub repo and reports the cleanup on Slack."
  metaTitle: "BranchJanitor: GitHub stale branch cleaner blueprint for Kestra"
  metaDescription: "A Kestra blueprint that finds stale GitHub branches, deletes them safely, and posts a Slack summary, with a safe dry-run default."
  tags:
    - Infrastructure
  subTags:
    - GitHub
    - Infrastructure Automation
  ee: false
  demo: false
  description: |
    ## How it works

    1. `find_stale` (`io.kestra.plugin.scripts.python.Script`) lists every branch through the GitHub API and decides what is stale. A branch is stale when its pull request was merged, or when it has no PR at all and its last commit is older than `stale_days`. The default branch, protected branches, and branches with open PRs are never touched. For forks, pass `upstream_repo`: PRs are looked up on the upstream repo while branches are cleaned on your fork.
    2. `maybe_clean` (`io.kestra.plugin.core.flow.If`) runs only when something is stale. Inside it, `do_clean` runs only in live mode (`dry_run: false`) and deletes each stale branch with the GitHub API. `send_summary` always posts the report to Slack: what would be deleted in dry-run mode, what was deleted in live mode.
    3. There is no KV state in this flow, and that is deliberate. A janitor does not need memory: once a branch is deleted it is gone, and dry-run mode is a report, not an alert.

    ## What you get

    - Automatic cleanup of stale branches on a schedule, no more 200-branch repos.
    - A Slack report every run that found something: which branches, why each one counted as stale, and whether it was a dry run or a real cleanup.
    - Safety by default: `dry_run` is true unless you explicitly turn it off, and merged-or-abandoned is the only thing that ever gets deleted.
    - Quiet runs when there is nothing stale to clean.

    ## Who it's for

    Anyone whose repos have accumulated dozens of branches from merged PRs nobody deleted. Works on any GitHub repo you have push access to, personal or org.

    ## Why orchestrate this with Kestra

    A shell script on a cron server can call the GitHub API, but then you need somewhere to hold the token, a place to see the run history when a branch got deleted that should not have been, and a safe dry-run mode you can trust. Kestra gives you all three: the token stays in secrets out of the YAML, every run keeps its logs and outputs where you can audit them, and the dry-run default means the first run can never surprise you.

    ## Prerequisites

    - A GitHub personal access token with `contents: write` on the target repo (classic `repo` scope works too).
    - Kestra with the Docker task runner available (used for the Python steps).
    - A Slack Incoming Webhook URL.

    ### Secrets

    | Secret | What it is |
    | --- | --- |
    | `GITHUB_TOKEN` | base64-encoded GitHub personal access token with push access to the repo |
    | `SLACK_WEBHOOK` | base64-encoded Slack Incoming Webhook URL |

    In Kestra OSS, secrets come from environment variables prefixed with `SECRET_` and must be base64-encoded.

    ## Quick start

    1. Start Kestra with the two secrets above as `SECRET_` environment variables.
    2. Import this flow and run it with your `repo` as `owner/repo` and `dry_run: true`: the Slack report lists what would be deleted, and nothing is touched. If you work from a fork, also pass `upstream_repo` as the upstream `owner/repo` so merged PRs are found.
    3. Check the list. If it looks right, run once with `dry_run: false`: the branches are deleted and the Slack report says so.
    4. Run again: quiet, nothing stale left.

    ## How to extend

    - Exclude branches by pattern (like `release/*`) with a name filter in the Python step.
    - Auto-delete branches when their PR merges by triggering on the pull_request closed webhook instead of the schedule.
    - Lower the schedule to daily for busy repos by changing the `cron` trigger.
    - Route reports to PagerDuty or Opsgenie by swapping the Slack task for another notification task.

    ## Inputs

    | Input | Type | Default | What it does |
    | --- | --- | --- | --- |
    | `repo` | STRING | (required) | the repo whose branches to clean, as owner/repo |
    | `upstream_repo` | STRING | `""` | for forks only, the upstream repo as owner/repo. PRs are looked up there, branches are cleaned on repo |
    | `stale_days` | INT | `90` | branches with no PR and no commit for this long count as abandoned |
    | `dry_run` | BOOL | `true` | when true, only reports what would be deleted without deleting anything |
    | `slack_webhook` | STRING | (required) | Incoming webhook URL of the Slack channel for the cleanup report |

    ## Links

    - [Kestra blueprint catalog](https://kestra.io/blueprints)
    - [GitHub branches API documentation](https://docs.github.com/en/rest/branches/branches)
    - [Kestra secrets documentation](https://kestra.io/docs/concepts/secrets)

    ## Pitfalls

    - `dry_run` defaults to true for a reason. Flip it to false only after you have seen a dry-run report and you trust the list.
    - The token needs push access to the repo, otherwise the delete calls return 403 and the run fails loudly. That is intentional: a silent skip would be worse.
    - The stale check is branch-based, not PR-based. A branch with an open PR is never touched, even if its last commit is ancient.
    - The default branch and protected branches are skipped no matter what. There is no input that overrides this.
