id: kafka-mirror-maker-replication-lag-sentinel
namespace: company.streaming

inputs:
  - id: target_bootstrap
    type: STRING
    defaults: "kafka-dr.internal:9092"
    description: Host and port of the target Kafka disaster recovery cluster.
  - id: replication_group
    type: STRING
    defaults: "mirrormaker2-cluster"
    description: Consumer group ID used by MirrorMaker 2.
  - id: max_allowable_lag
    type: INT
    defaults: 5000
    description: "Maximum allowable replication lag across mirrored topic partitions (default 5000)."
  - id: kafka_image
    type: STRING
    defaults: apache/kafka:3.9.0
    description: Container image containing kafka-consumer-groups.sh.

tasks:
  - id: inspect_mirrormaker_lag
    type: io.kestra.plugin.scripts.shell.Commands
    description: Inspect Kafka MirrorMaker 2 consumer group offset details and aggregate replication lag across partitions.
    containerImage: "{{ inputs.kafka_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: host
    outputFiles:
      - mm2_lag_summary.json
    commands:
      - |
        set -euo pipefail
        CMD_EXIT=0
        OUT=$(/opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server "{{ inputs.target_bootstrap }}" --describe --group "{{ inputs.replication_group }}" 2>&1) || CMD_EXIT=$?
        printf '%s\n' "$OUT"

        if [ $CMD_EXIT -ne 0 ] || printf '%s' "$OUT" | grep -iqE "Exception|Error:"; then
          echo "ERROR: kafka-consumer-groups.sh failed with exit code $CMD_EXIT" >&2
          exit 1
        fi

        PARSED=$(printf '%s\n' "$OUT" | awk -v grp="{{ inputs.replication_group }}" -v thresh="{{ inputs.max_allowable_lag }}" '
          $1 == "GROUP" { inside = 1; next }
          inside && ($1 == grp || $1 ~ /^[a-zA-Z0-9_-]+$/) {
            lag = $6 + 0
            total += lag
            partitions += 1
          }
          END {
            is_breach = (total > thresh) ? 1 : 0
            printf "{\"is_breach\":%d,\"total_lag\":%.0f,\"partitions\":%.0f}\n", is_breach, total, partitions
          }') || AWK_EXIT=$?

        if [ "${AWK_EXIT:-0}" -ne 0 ]; then
          echo "ERROR: Failed to parse lag summary for group {{ inputs.replication_group }}." >&2
          exit 1
        fi

        printf '%s\n' "$PARSED" > mm2_lag_summary.json
        printf '::{"outputs":%s}::\n' "$PARSED"

  - id: evaluate_replication_lag
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_mirrormaker_lag.vars.is_breach | int == 1 }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kafka MirrorMaker 2 Geo-Replication Lag Alert",
                "text": "MirrorMaker 2 replication group {{ inputs.replication_group }} on {{ inputs.target_bootstrap }} has reached {{ outputs.inspect_mirrormaker_lag.vars.total_lag }} uncommitted messages across {{ outputs.inspect_mirrormaker_lag.vars.partitions }} partitions (threshold {{ inputs.max_allowable_lag }}). Multi-region disaster recovery replication is falling behind.",
                "footer": "Kestra Streaming Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MirrorMaker Sentinel Failure",
            "text": "Failed to describe MirrorMaker 2 consumer group on {{ inputs.target_bootstrap }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: total_lag
    type: INT
    description: Total replication lag across mirrored topic partitions.
    value: "{{ outputs.inspect_mirrormaker_lag.vars.total_lag }}"
  - id: is_breach
    type: INT
    description: 1 if total lag exceeded threshold, 0 otherwise.
    value: "{{ outputs.inspect_mirrormaker_lag.vars.is_breach }}"
  - id: partitions
    type: INT
    description: Total number of evaluated partitions.
    value: "{{ outputs.inspect_mirrormaker_lag.vars.partitions }}"

extend:
  metaDescription: "Audits Kafka MirrorMaker 2 consumer groups to detect cross-cluster disaster recovery replication lag."
  metaTitle: Apache Kafka MirrorMaker 2 Cross-Cluster Replication Lag Sentinel with Kestra
  ee: false
  demo: false
  title: Apache Kafka MirrorMaker 2 Cross-Cluster Replication Lag Sentinel
  shortDescription: Audits Kafka MirrorMaker 2 consumer groups to detect cross-cluster disaster recovery replication lag.
  description: |
    ## How it works
    This workflow connects to a target Kafka disaster recovery (DR) cluster using `kafka-consumer-groups.sh` to describe the consumer group offsets maintained by Kafka MirrorMaker 2 (MM2). In active-passive and active-active geo-replication topologies, MirrorMaker replicates topics between datacenters and synchronizes partition offsets. When cross-region network links saturate or target brokers throttle writes, replication lag accumulates. This sentinel audits aggregate uncommitted message lag across all replicated partitions and dispatches incident alerts before DR recovery point objectives (RPO) degrade.

    ## What you get
    - Real-time tracking of Kafka MirrorMaker 2 cross-cluster replication lag.
    - Protection against disaster recovery data loss and cross-region RPO breaches.
    - Automated Slack incident notifications detailing total message lag.

    ## Who it's for
    - Streaming Platform Engineers maintaining multi-region Kafka topologies.
    - SREs responsible for enterprise disaster recovery and data replication.
    - DevOps Teams operating Kafka Connect and MirrorMaker 2 workers.

    ## Why orchestrate this with Kestra
    - **Agentless Metric Surveillance**: Directly audits Kafka consumer groups without deploying Kafka Exporter.
    - **Native CLI Execution**: Executes official Kafka client commands from secure ephemeral runners.
    - **Incident Orchestration**: Notifies platform engineers directly in team collaboration channels.

    ## Prerequisites
    - Target Kafka cluster with accessible bootstrap server (`9092`).
    - Kafka client CLI utilities installed in the runner container.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK` secret to your namespace.
    3. Specify `target_bootstrap` and `replication_group`.
    4. Enable the schedule trigger for continuous replication surveillance.

    ## How to extend
    - Inspect individual mirrored topic offsets via `kafka-run-class.sh kafka.tools.MirrorMaker`.
    - Automatically scale MirrorMaker 2 Kafka Connect worker tasks.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [Apache Kafka MirrorMaker 2 Documentation](https://cwiki.apache.org/confluence/display/KAFKA/KIP-382%3A+MirrorMaker+2.0)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - ELT & Data Landing
