id: openalex-highly-cited-research-benchmark-loader
namespace: company.data

description: |
  Ingest highly cited scientific research publications from the OpenAlex scholarly catalog API,
  flatten nested authorships, primary topics, and open-access licensing metadata into columnar Parquet
  using DuckDB, maintain cursor state in Kestra KV store, and catalog foundational scientific breakthroughs.

inputs:
  - id: publication_year
    type: INT
    defaults: 2024
    description: Target publication year to harvest milestone academic research breakthroughs.

  - id: min_citations
    type: INT
    defaults: 200
    description: Minimum global citation threshold qualifying works for baseline inclusion.

  - id: batch_size
    type: INT
    defaults: 50
    description: Number of academic work records to ingest per execution pass.

  - id: state_key
    type: STRING
    defaults: openalex_highest_citation_cursor_state
    description: Kestra KV store key maintaining the latest processed publication identifier.

concurrency:
  limit: 1
  behavior: CANCEL

triggers:
  - id: weekly_benchmark_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 * * 0"
    description: Harvest landmark scientific literature updates weekly on Sundays at 05:00 UTC.

tasks:
  - id: fetch_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_benchmarks
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install duckdb requests
    env:
      PUB_YEAR: "{{ inputs.publication_year }}"
      MIN_CITATIONS: "{{ inputs.min_citations }}"
      BATCH_SIZE: "{{ inputs.batch_size }}"
      LAST_STATE: "{{ outputs.fetch_state.value ?? '' }}"
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb

        year = int(os.environ.get("PUB_YEAR", 2024))
        min_citations = int(os.environ.get("MIN_CITATIONS", 200))
        batch_size = int(os.environ.get("BATCH_SIZE", 50))
        last_state = os.environ.get("LAST_STATE", "")

        url = f"https://api.openalex.org/works?filter=publication_year:{year},cited_by_count:>{min_citations}&sort=cited_by_count:desc&per-page={batch_size}"
        headers = {"User-Agent": "Kestra-Research-Benchmark/2.0 (mailto:analytics@company.internal)"}

        response = requests.get(url, headers=headers, timeout=30)
        response.raise_for_status()
        data = response.json()
        results = data.get("results", [])

        records = []
        for w in results:
            work_id = w.get("id", "")
            title = w.get("title", "Untitled")
            citations = w.get("cited_by_count", 0)
            doi = w.get("doi", "")
            pub_date = w.get("publication_date", "")
            open_access = w.get("open_access", {}).get("is_oa", False)
            oa_status = w.get("open_access", {}).get("oa_status", "closed")
            
            # Primary topic classification
            primary_topic = w.get("primary_topic", {})
            topic_name = primary_topic.get("display_name", "General Science") if primary_topic else "General Science"
            subfield = primary_topic.get("subfield", {}).get("display_name", "Interdisciplinary") if primary_topic else "Interdisciplinary"
            field = primary_topic.get("field", {}).get("display_name", "Multidisciplinary") if primary_topic else "Multidisciplinary"

            # Primary institutional affiliations
            authorships = w.get("authorships", [])
            institutions = set()
            for auth in authorships[:5]:
                for inst in auth.get("institutions", []):
                    inst_name = inst.get("display_name")
                    if inst_name:
                        institutions.add(inst_name)

            records.append({
                "openalex_id": work_id,
                "doi": doi,
                "title": title,
                "publication_year": year,
                "publication_date": pub_date,
                "cited_by_count": int(citations),
                "is_open_access": bool(open_access),
                "oa_status": oa_status,
                "topic_name": topic_name,
                "subfield": subfield,
                "field": field,
                "lead_institutions": ", ".join(sorted(institutions)[:4])
            })

        with open("works.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE landmark_works AS SELECT * FROM read_json_auto('works.json')")
            con.execute("COPY landmark_works TO 'highly_cited_works.parquet' (FORMAT PARQUET)")
            con.execute("COPY landmark_works TO 'highly_cited_works.csv' (HEADER, DELIMITER ',')")

            newest_id = records[0]["openalex_id"]
            field_summary = con.execute("""
                SELECT field, COUNT(*) AS publications, SUM(cited_by_count) AS total_citations
                FROM landmark_works
                GROUP BY field
                ORDER BY total_citations DESC
            """).df().to_dict(orient="records")
        else:
            con.execute("""
                CREATE TABLE landmark_works (
                    openalex_id VARCHAR,
                    doi VARCHAR,
                    title VARCHAR,
                    publication_year INT,
                    publication_date VARCHAR,
                    cited_by_count INT,
                    is_open_access BOOLEAN,
                    oa_status VARCHAR,
                    topic_name VARCHAR,
                    subfield VARCHAR,
                    field VARCHAR,
                    lead_institutions VARCHAR
                )
            """)
            con.execute("COPY landmark_works TO 'highly_cited_works.parquet' (FORMAT PARQUET)")
            con.execute("COPY landmark_works TO 'highly_cited_works.csv' (HEADER, DELIMITER ',')")
            newest_id = last_state
            field_summary = []

        summary = {
            "total_harvested": len(records),
            "top_work_id": newest_id,
            "field_summary": field_summary
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - highly_cited_works.parquet
      - highly_cited_works.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_benchmarks.vars.top_work_id }}"

  - id: log_findings
    type: io.kestra.plugin.core.log.Log
    message: "Successfully harvested {{ outputs.ingest_and_transform_benchmarks.vars.total_harvested }} highly cited landmark scientific works for year {{ inputs.publication_year }} into Parquet."

outputs:
  - id: total_works
    type: INT
    value: "{{ outputs.ingest_and_transform_benchmarks.vars.total_harvested }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_benchmarks.outputFiles['highly_cited_works.parquet'] }}"

extend:
  title: OpenAlex Landmark Research Benchmark Loader with DuckDB
  metaTitle: OpenAlex Research Benchmark Loader | Kestra
  shortDescription: Ingests highly cited scientific literature and open-access metadata from OpenAlex into Parquet lakehouse storage via DuckDB.
  metaDescription: Harvest landmark scholarly papers from OpenAlex, extract citation metrics and topics into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Orchestrate automated, reliable harvesting of foundational, highly cited scientific literature
    and institutional affiliation metadata directly from the open-source OpenAlex catalog into
    analytical Parquet storage using DuckDB.

    ## How it works

    1. **State Recovery**: Retrieves previously processed publication high-watermarks from Kestra KV store (`openalex_highest_citation_cursor_state`) to maintain idempotent incremental execution.
    2. **OpenAlex Catalog Query**: Connects to the open-access OpenAlex REST API (`api.openalex.org/works`) filtering for publications with citation counts exceeding milestone thresholds.
    3. **DuckDB Structural Normalization**: Unpacks primary scientific topics, subfields, open-access status, and institutional authorships into clean relational structures inside Docker.
    4. **Analytical Lake Export**: Exports normalized benchmark publications into columnar Parquet and CSV files for immediate integration into enterprise data warehouses.
    5. **Topic Aggregation & Persistence**: Aggregates total citations by major scientific discipline and records state cursors in Kestra KV store.

    ## What you get

    - Automated recurring indexing of world-class academic research breakthroughs without subscription credentials.
    - Columnar Parquet datasets structured for technological foresight, competitive intelligence, and literature review feature stores.
    - Built-in KV state management ensuring zero duplicate record processing across execution runs.

    ## Who it's for

    - Corporate R&D and strategic technology scouting teams tracking scientific advancements.
    - University bibliometricians and academic department chairs analyzing institutional research impact.
    - Data Engineers building scientific discovery and literature analysis platforms.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains cursor state across runs without external database infrastructure.
    - Ephemeral Docker execution guarantees isolated Python and DuckDB dependencies.
    - Declarative flow control provides clear logging, automated scheduling, and transparent data outputs.

    ## Prerequisites

    - Docker runtime configured on the Kestra worker.
    - Outbound internet access to `api.openalex.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding weekly research breakthrough digests.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Adjust the `publication_year` and `min_citations` inputs to match your domain criteria.
    3. Click **Execute** to run an immediate research harvest.
    4. Enable the `weekly_benchmark_sync` trigger for automated weekend refreshes.

    ## How to extend

    - Add an S3 or Google Cloud Storage upload task to archive quarterly landmark literature snapshots.
    - Connect an LLM summarization task to generate executive summaries of the top 3 papers.

    ## Links

    - [OpenAlex Works API Reference](https://docs.openalex.org/api-entities/works)
    - [DuckDB Parquet Export Guide](https://duckdb.org/docs/data/parquet/overview.html)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
