id: aikido-domain-scan-staleness-compliance-gate
namespace: company.team
description: |
  List every domain Aikido's surface/DAST monitoring tracks on a
  schedule, classify scan coverage as HEALTHY, AT_RISK, CRITICAL, or
  UNREACHABLE based on how long ago each domain was last scanned, log
  clean audits, and alert Slack the moment a domain has never been
  scanned or has gone stale beyond a threshold.

inputs:
  - id: staleness_threshold_days
    type: INT
    defaults: 14
    displayName: "Scan Staleness Threshold (Days)"
    description: "A domain scanned longer ago than this many days is classified AT_RISK. A domain never scanned at all is always CRITICAL regardless of this threshold."

triggers:
  - id: domain_scan_coverage_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audit domain scan coverage once a day."
    cron: "0 6 * * *"
    disabled: true
    inputs:
      staleness_threshold_days: 14

tasks:
  - id: list_monitored_domains
    type: io.kestra.plugin.aikido.domains.List
    description: "List every domain connected to Aikido's surface/DAST monitoring, with each domain's last-scanned timestamp."
    clientId: "{{ secret('AIKIDO_CLIENT_ID') }}"
    clientSecret: "{{ secret('AIKIDO_CLIENT_SECRET') }}"
    fetchType: FETCH
    allowFailure: true

  - id: classify_scan_coverage
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when no domains were returned, CRITICAL when at least one domain has never been scanned (lastScannedAt == -1), AT_RISK when at least one scanned domain is older than staleness_threshold_days, otherwise HEALTHY."
    format: "{{ outputs.list_monitored_domains.rows is defined ? ((outputs.list_monitored_domains.rows | jq('[.[] | select(.lastScannedAt == -1)] | length') | first | default(0)) > 0 ? 'CRITICAL' : ((outputs.list_monitored_domains.rows | jq('[.[] | select(.lastScannedAt != -1 and (now - .lastScannedAt) > (' ~ inputs.staleness_threshold_days ~ ' * 86400))] | length') | first | default(0)) > 0 ? 'AT_RISK' : 'HEALTHY')) : 'UNREACHABLE' }}"

  - id: route_by_coverage
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation when every domain is fresh, page Slack when a domain has never been scanned or has gone stale, or page Slack when Aikido could not be reached."
    value: "{{ outputs.classify_scan_coverage.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "All {{ outputs.list_monitored_domains.size }} Aikido-monitored domain(s) were scanned within {{ inputs.staleness_threshold_days }} day(s)."
      "AT_RISK":
        - id: alert_at_risk
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Aikido sentinel AT_RISK: domain(s) scanned longer than {{ inputs.staleness_threshold_days }} day(s) ago out of {{ outputs.list_monitored_domains.size }} monitored: {{ outputs.list_monitored_domains.rows | jq('[.[] | select(.lastScannedAt != -1 and (now - .lastScannedAt) > (' ~ inputs.staleness_threshold_days ~ ' * 86400)) | .domain] | join(\", \")') | first }}. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Aikido sentinel CRITICAL: domain(s) never scanned at all out of {{ outputs.list_monitored_domains.size }} monitored: {{ outputs.list_monitored_domains.rows | jq('[.[] | select(.lastScannedAt == -1) | .domain] | join(\", \")') | first }}. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Aikido sentinel UNREACHABLE: no domains were returned (invalid client credentials, missing domains:read scope, or an Aikido API outage). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed Aikido domain scan coverage check with status: {{ outputs.classify_scan_coverage.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit status line recorded on every run regardless of branch, for a continuous scan-coverage trend in the execution history."
    message: "Aikido domain scan coverage audit: threshold={{ inputs.staleness_threshold_days }}d, status={{ outputs.classify_scan_coverage.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the compliance gate flow itself fails, so a broken check never silently stops monitoring scan coverage."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Aikido domain scan staleness compliance gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). Scan coverage status is now unknown; check the task logs and the Aikido dashboard manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_scan_coverage.value }}"

extend:
  title: "Aikido Domain Scan Staleness Compliance Gate"
  metaTitle: Aikido Domain Scan Staleness Compliance Gate for Kestra
  shortDescription: List every domain Aikido monitors on a schedule, flag domains that have never been scanned or have gone stale, and alert Slack when attack-surface scan coverage degrades.
  metaDescription: Audit Aikido domain scan coverage and alert Slack when a monitored domain has never been scanned or has gone stale.
  description: |
    A domain sitting in Aikido's surface monitoring with a scan from six months ago, or one that was added and never scanned at all, looks identical to a freshly-scanned domain in a dashboard list until someone checks the timestamp. This blueprint lists every domain Aikido tracks on a schedule, checks each one's last-scanned time, and pages Slack the moment coverage degrades instead of waiting for someone to notice during a security review.

    ## How it works

    1. `list_monitored_domains` (`io.kestra.plugin.aikido.domains.List`) lists every domain connected to Aikido's surface/DAST monitoring, including each domain's `lastScannedAt` Unix timestamp (`-1` if never scanned). `allowFailure: true` means a connection or authentication failure still lets the flow continue instead of aborting.
    2. `classify_scan_coverage` (`io.kestra.plugin.core.debug.Return`) checks whether `outputs.list_monitored_domains.rows` is defined; if not, `UNREACHABLE`. Otherwise it runs a `jq` filter counting domains with `lastScannedAt == -1` (never scanned) for `CRITICAL`, then a second filter counting domains scanned longer ago than `staleness_threshold_days` for `AT_RISK`, falling back to `HEALTHY`.
    3. `route_by_coverage` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `HEALTHY` logs a quiet confirmation, `AT_RISK` pages Slack naming the stale domains, `CRITICAL` pages Slack naming the never-scanned domains, `UNREACHABLE` pages Slack separately, and `defaults` logs the raw outcome.
    4. `log_audit_status` records a status line on every run regardless of branch, so the execution history is a continuous scan-coverage trend.
    5. The `errors` block pages Slack separately if the flow itself fails outright.
    6. The `domain_scan_coverage_schedule` trigger polls once a day with explicit input overrides, shipped `disabled: true` until you add real Aikido credentials.

    ## What you get

    - A scheduled, API-native scan-coverage audit with zero custom client code.
    - A four-way `status` output (`HEALTHY` / `AT_RISK` / `CRITICAL` / `UNREACHABLE`) you can chart or gate other flows on.
    - A Slack page naming the exact domains that are stale or have never been scanned, not just a generic warning.
    - A separate failure channel for the audit flow itself, plus a standing audit log line per run.

    ## Who it's for

    - Application security and platform teams who want a recurring check that every domain in Aikido's attack-surface inventory is actually being rescanned, not just listed.
    - Teams onboarding new domains into Aikido who want an automatic signal if a newly added domain's first scan never happens.

    ## Why orchestrate this with Kestra

    Aikido's own dashboard shows scan coverage when someone opens it; this flow watches it continuously. Every check is recorded in the execution history, the coverage classification becomes a typed output other flows can depend on, and the Switch branch is one edit away from real remediation (triggering `io.kestra.plugin.aikido.domains.Scan` on the stale domains, opening a ticket) instead of a one-off dashboard glance.

    ## Prerequisites

    - An Aikido account with at least one domain connected to surface/DAST monitoring, and an API client ID/secret with the `domains:read` scope. Aikido's free-tier availability was not independently confirmed while building this blueprint; check Aikido's current plans before relying on it for scan volume.
    - A Slack incoming webhook for the at-risk, critical, and unreachable alerts.
    - There is no self-hostable Docker image for the Aikido API, so test this blueprint directly against a real Aikido account with at least one monitored domain.

    ### Secrets

    - `AIKIDO_CLIENT_ID`: Aikido API client ID.
    - `AIKIDO_CLIENT_SECRET`: Aikido API client secret.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the at-risk alert, the critical alert, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_AIKIDO_CLIENT_ID`, `SECRET_AIKIDO_CLIENT_SECRET`, and `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-client-id>" | base64`.

    ## Quick start

    1. Add the `AIKIDO_CLIENT_ID`, `AIKIDO_CLIENT_SECRET`, and `SLACK_WEBHOOK_URL` secrets.
    2. Set `staleness_threshold_days` to the scan cadence your team expects.
    3. Run the flow once and confirm `status` reflects your account's real scan coverage.
    4. Enable `domain_scan_coverage_schedule`.

    ## How to extend

    - Chain a follow-up `io.kestra.plugin.aikido.domains.Scan` task inside the `AT_RISK`/`CRITICAL` cases to trigger a rescan automatically instead of only alerting.
    - Apply the same pattern to `io.kestra.plugin.aikido.repositories.List` and `io.kestra.plugin.aikido.containers.List`, which expose comparable scan-coverage fields for code repositories and container images.
    - Store each domain's `lastScannedAt` in a KV store and alert only when a previously-fresh domain newly crosses the staleness threshold, instead of on every run.

    ## Links

    - [Aikido domains API](https://kestra.io/plugins/plugin-aikido)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
