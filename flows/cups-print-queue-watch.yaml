  - id: changed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.decide.vars.emit }}"
    then:
      - id: slack_notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        timeout: PT15S
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: "PrintQueue Watch: {{ outputs.probe.vars.status }}; reasons={{ outputs.probe.vars.reasons | toJson }}; event={{ outputs.probe.vars.fingerprint }}; execution={{ execution.id }}. Inspect probe/report.md."
      - id: change_event
        type: io.kestra.plugin.core.log.Log
        message: "Confirmed queue state changed: {{ outputs.probe.vars.status }}. Inspect probe/report.md."
    else:
      - id: unchanged
        type: io.kestra.plugin.core.log.Log
        level: DEBUG
        message: Quiet baseline, pending debounce, or unchanged confirmed state; evidence retained.
  - id: remember
    type: io.kestra.plugin.core.kv.Set
    description: Persist baseline/debounce on every successful run, after any change event.
    key: "pqw_state_v4_{{ [inputs.printer_uri, inputs.max_age_seconds, inputs.unverified_threshold] | toJson | sha256 }}"
    kvType: JSON
    value: "{{ outputs.decide.vars.next_state | toJson }}"
triggers:
  - id: poll_queue
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true
    inputs:
      printer_uri: ipp://configure-before-enabling.invalid/printers/queue
      max_age_seconds: 600
      unverified_threshold: 2
      probe_timeout_seconds: 5
outputs:
  - id: status
    type: STRING
    value: "{{ outputs.probe.vars.status }}"
  - id: event_emitted
    type: BOOL
    value: "{{ outputs.decide.vars.emit }}"
  - id: unverified_streak
    type: INT
    value: "{{ outputs.decide.vars.unverified_streak }}"
  - id: report
    type: STRING
    value: "{{ outputs.probe.outputFiles['report.md'] }}"
extend:
  title: Monitor CUPS Print Queues with Quiet Baselines and Debounce
  metaTitle: Read-Only CUPS Queue Health with Debounce | Kestra
  shortDescription: Retain anonymous queue evidence, debounce verification failures and record confirmed state changes.
  metaDescription: Read-only CUPS queue monitoring with SHA-256 state keys, quiet HEALTHY baselines, bounded retries and persistent debounce.
  description: |
    Observe CUPS queues; send confirmed changes to Slack.

    ## How it works
    1. A disabled Schedule reserves polling; manual runs require a trusted printer_uri.
    2. KV reads schema1 under pqw_state_v4_ plus SHA256 of JSON [URI,max age,debounce].
       Old keys are untouched; each policy has independent state.
    3. Python Commands reads jobs before the printer clock. A transient first
       observation requests one native retry after1second; final UNVERIFIED is evidence.
    4. The first HEALTHY persists silently. By default two consecutive UNVERIFIED
       runs confirm a change. Pending failures preserve confirmed state; recovery
       from an unconfirmed blip stays quiet. WARNING/STOPPED are immediate.
    5. Confirmed changes call native SlackIncomingWebhook via a secret, then log.
       Only after success does remember persist state. Failed delivery fails the run
       without advancing confirmed state or its counter. Quiet runs do not post.

    ## What you get
    - HEALTHY/WARNING/STOPPED/UNVERIFIED, JSON/Markdown and decision artifacts.
    - Anonymous reports and messages; report: outputs.probe.outputFiles['report.md'].
    - Probe budget45s/attempt,2attempts,2minutes total; Slack task timeout15s.
    - Get-Jobs limit500: counts can be partial; no whole-queue ordering guarantee.

    ## Who it's for
    Platform teams maintaining CUPS queues.

    ## Why orchestrate this with Kestra
    KV, native retries and conditional Slack delivery separate transient observations
    from confirmed incidents and successful notification.

    ## Prerequisites
    Kestra2.0 with Python Commands and Slack plugins, Python3/ipptool on a Process
    worker, and a reachable CUPS queue.
    Inputs: printer_uri STRING required; max_age_seconds INT>=1 default600;
    unverified_threshold INT1..5 default2; probe_timeout_seconds INT1..10 default5.
    Changing URI/max age/debounce starts a fresh baseline. Old keys are not migrated.

    ### Secrets
    Configure SLACK_WEBHOOK_URL in Kestra secrets, never as an input or literal URL.
    It is required for confirmed changes; there is no log-only success fallback.
    IPPS/authenticated queues need validation.

    ## Quick start
    1. Provision a disposable CUPS queue and Slack incoming webhook secret.
    2. Import above extend, set printer_uri and run twice: quiet baseline then repeat.
    3. Pause only a lab queue, verify delivery, then restore and verify recovery.
    4. Keep Schedule disabled until its own inputs are configured.

    ## How to extend
    No reminder cooldown or parallel multi-queue policy is included. Slack delivery
    is at-least-once: a lost acknowledgement or worker crash may duplicate a post.
    Fingerprint is not a Slack idempotency key. Changed
    reasons during a confirmed outage can emit again; debounce counts failures by status.

