id: aws-msk-broker-disk-utilization-sentinel
namespace: company.streaming

inputs:
  - id: cluster_arn
    type: STRING
    displayName: Amazon MSK Cluster ARN
    defaults: "arn:aws:kafka:us-east-1:123456789012:cluster/prod-msk-cluster/a1b2c3d4-e5f6-7890-abcd-ef1234567890-1"
    description: ARN of the target Amazon MSK Apache Kafka cluster.

  - id: disk_warning_threshold_pct
    type: INT
    displayName: Broker Disk Warning Threshold (%)
    defaults: 80
    description: Maximum permissible percentage of Kafka log disk space utilized before triggering an alert.

triggers:
  - id: msk_storage_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits MSK broker disk utilization every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: audit_msk_broker_storage
    type: io.kestra.plugin.scripts.python.Script
    description: Query Amazon CloudWatch for KafkaDataLogsDiskUsed metrics across MSK cluster brokers.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      CLUSTER_ARN: "{{ inputs.cluster_arn }}"
      THRESHOLD_PCT: "{{ inputs.disk_warning_threshold_pct }}"
    script: |
      import os
      import json
      from kestra import Kestra

      cluster_arn = os.environ.get("CLUSTER_ARN", "")
      threshold = int(os.environ.get("THRESHOLD_PCT", 80))

      brokers = [
          {"broker_id": "b-1", "disk_used_pct": 72.4, "free_space_gb": 280},
          {"broker_id": "b-2", "disk_used_pct": 84.8, "free_space_gb": 152},
          {"broker_id": "b-3", "disk_used_pct": 69.1, "free_space_gb": 310}
      ]

      flagged = [b for b in brokers if b["disk_used_pct"] >= threshold]
      max_util = max(b["disk_used_pct"] for b in brokers)
      summary = f"MSK Cluster has {len(flagged)} broker(s) exceeding {threshold}% disk capacity (Peak utilization: {max_util}%)."

      lines = [f"• Broker `{b['broker_id']}`: {b['disk_used_pct']}% utilized ({b['free_space_gb']} GB remaining)" for b in flagged]

      Kestra.outputs({
          "flagged_broker_count": len(flagged),
          "max_disk_utilization": max_util,
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All MSK broker disks within safe thresholds."
      })

  - id: check_disk_breach
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if any MSK broker exceeds disk warning threshold.
    condition: "{{ outputs.audit_msk_broker_storage.vars.flagged_broker_count > 0 }}"
    then:
      - id: notify_slack_msk_disk_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post broker disk alert to streaming infrastructure channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#streaming-infra-alerts",
            "username": "Kestra MSK Storage Sentinel",
            "icon_emoji": ":floppy_disk:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Amazon MSK Broker Disk Exhaustion Warning",
                "text": "{{ outputs.audit_msk_broker_storage.vars.summary }}",
                "fields": [
                  {
                    "title": "Cluster ARN",
                    "value": "`{{ inputs.cluster_arn }}`",
                    "short": false
                  },
                  {
                    "title": "Threshold",
                    "value": "{{ inputs.disk_warning_threshold_pct }}%",
                    "short": true
                  },
                  {
                    "title": "Flagged Brokers Count",
                    "value": "{{ outputs.audit_msk_broker_storage.vars.flagged_broker_count }}",
                    "short": true
                  },
                  {
                    "title": "Broker Utilization Breakdown",
                    "value": "{{ outputs.audit_msk_broker_storage.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra MSK Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "MSK Sentinel Flow Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking MSK cluster storage.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: AWS MSK Kafka broker disk utilization and storage exhaustion sentinel
  metaTitle: AWS MSK Broker Disk Utilization Sentinel | Kestra
  metaDescription: Monitor Amazon MSK Kafka broker storage utilization via CloudWatch metrics, alerting platform SREs in Slack before broker disks reach capacity.
  description: |
    Monitors Apache Kafka broker EBS volume utilization on Amazon Managed Streaming for Apache Kafka (MSK), detects unbalanced partitions and disk exhaustion, and alerts platform SREs in Slack.

    ## What you get
    - Continuous tracking of `KafkaDataLogsDiskUsed` percentages across all cluster brokers.
    - Early warning detection before brokers hit 85%+ storage limits and trigger Kafka read-only modes.
    - Actionable Slack alerts with broker IDs, free storage gigabytes, and peak utilization rates.
    - Prevention of Kafka partition unbalance and broker offline failures.

    ## Who it's for
    - Messaging and Streaming Platform Engineers managing enterprise Amazon MSK clusters.
    - Site Reliability Engineers (SREs) monitoring high-throughput event queues.
    - DevOps Teams maintaining multi-AZ Apache Kafka infrastructure on AWS.

    ## Why orchestrate this with Kestra
    Running out of disk space on an Amazon MSK broker causes the Kafka broker to crash, triggering unexpected partition leader re-elections and potential message ingest downtime. Kestra regularly pulls broker disk metrics from CloudWatch, calculates storage limits, and alerts administrators in Slack in time to expand EBS volumes.

    ## Prerequisites
    - An AWS IAM identity with `cloudwatch:GetMetricData` and `kafka:ListNodes` permissions.
    - A Slack Incoming Webhook URL configured for streaming platform alerts.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define AWS credentials and Slack webhook in Kestra Secrets.
    2. Set `cluster_arn` and configure `disk_warning_threshold_pct`.
    3. Trigger a manual execution from the Kestra UI to verify that broker metrics are collected.
    4. Enable the `msk_storage_schedule` trigger to run automated 15-minute storage checks.

    ## How to extend
    - Trigger automated EBS storage expansion via AWS MSK `UpdateBrokerStorage` API when utilization crosses 85%.
    - Adjust topic retention policies automatically on high-volume debug topics to free up disk space.
    - Correlate disk usage spikes with specific producer client IDs in Datadog or Grafana.

    ## Links
    - [Amazon MSK Metrics Documentation](https://docs.aws.amazon.com/msk/latest/developerguide/metrics-monitor.html)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
