id: forgejo-git-repository-mirror-sync-lag-sentinel
namespace: company.team

description: Audits Forgejo and Gitea repository mirror synchronization latency to prevent GitOps drift.

inputs:
  - id: forgejo_url
    type: STRING
    defaults: "https://forgejo.internal"
    description: Base URL of the Forgejo/Gitea self-hosted Git service.
  - id: repo_owner
    type: STRING
    description: Owner or organization name of the mirrored repository.
  - id: repo_name
    type: STRING
    description: Name of the mirrored repository to audit.
  - id: max_lag_minutes
    type: INT
    defaults: 60
    description: "Maximum allowable mirror synchronization lag in minutes (default 60m)."

outputs:
  - id: is_breach
    type: BOOLEAN
    value: "{{ outputs.inspect_mirror_sync.vars.is_breach }}"
  - id: lag_minutes
    type: FLOAT
    value: "{{ outputs.inspect_mirror_sync.vars.lag_minutes }}"

tasks:
  - id: inspect_mirror_sync
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Forgejo REST API for repository mirror status and calculates sync lag.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    env:
      FORGEJO_URL: "{{ inputs.forgejo_url }}"
      REPO_OWNER: "{{ inputs.repo_owner }}"
      REPO_NAME: "{{ inputs.repo_name }}"
      MAX_LAG_MINUTES: "{{ inputs.max_lag_minutes }}"
      FORGEJO_TOKEN: "{{ secret('FORGEJO_TOKEN') }}"
    script: |
      import os
      import sys
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      forgejo_url = os.environ.get("FORGEJO_URL", "").rstrip("/")
      owner = os.environ.get("REPO_OWNER", "")
      repo = os.environ.get("REPO_NAME", "")
      max_lag = float(os.environ.get("MAX_LAG_MINUTES", "60"))
      token = os.environ.get("FORGEJO_TOKEN", "")

      headers = {"Accept": "application/json"}
      if token:
          headers["Authorization"] = f"token {token}"

      api_url = f"{forgejo_url}/api/v1/repos/{owner}/{repo}"

      try:
          resp = requests.get(api_url, headers=headers, timeout=15)
          resp.raise_for_status()
          data = resp.json()
          updated_str = data.get("updated_at", "")
          if not updated_str:
              print(f"ERROR: Repository {owner}/{repo} missing updated_at timestamp in response", file=sys.stderr)
              sys.exit(1)

          dt = datetime.fromisoformat(updated_str.replace("Z", "+00:00"))
          now = datetime.now(timezone.utc)
          lag_minutes = max(0.0, (now - dt).total_seconds() / 60.0)
          is_breach = lag_minutes > max_lag
      except Exception as err:
          print(f"ERROR: Failed to query Forgejo repository {owner}/{repo}: {err}", file=sys.stderr)
          sys.exit(1)

      print(f"Forgejo Mirror Status: {owner}/{repo} lag={lag_minutes:.1f}m (max={max_lag}m, breach={is_breach})")

      Kestra.outputs({
          "is_breach": is_breach,
          "lag_minutes": round(lag_minutes, 1),
          "repo": f"{owner}/{repo}"
      })

  - id: evaluate_mirror_freshness
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_mirror_sync.vars.is_breach }}"
    then:
      - id: notify_gitops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#gitops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Forgejo Repository Mirror Sync Delay Alert",
                "text": "Repository {{ inputs.repo_owner }}/{{ inputs.repo_name }} has not synchronized in {{ outputs.inspect_mirror_sync.vars.lag_minutes }} minutes (threshold {{ inputs.max_lag_minutes }}m). Risk of upstream commit drift.",
                "footer": "Kestra GitOps Sentinel • Forgejo"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#gitops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Forgejo Sentinel Failure",
            "text": "Failed to inspect repository mirror status on {{ inputs.forgejo_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Forgejo and Gitea repository mirror synchronization latency to prevent GitOps drift."
  metaTitle: Forgejo Git Repository Mirror Synchronization Lag Sentinel with Kestra
  ee: false
  demo: false
  title: Forgejo Git Repository Mirror Synchronization Lag Sentinel
  shortDescription: Audits Forgejo and Gitea repository mirror synchronization latency to prevent GitOps drift.
  description: |
    ## How it works
    This workflow connects to a self-hosted Forgejo or Gitea instance via REST API (`/api/v1/repos/{owner}/{name}`) using an administrative token to audit mirror synchronization health. In disaster recovery and edge GitOps topologies, remote mirrors maintain hot standbys of upstream repositories. When network firewalls, rate limits, or upstream authentication tokens expire, mirror tasks fail silently, leaving local developer clones and downstream CI/CD pipelines detached from upstream commits. This sentinel calculates update latency and triggers alerts if synchronization delays exceed configured thresholds.

    ## What you get
    - Real-time tracking of Git repository mirror synchronization freshness.
    - Early detection of expired remote credentials and network disconnection.
    - Contextual Slack alerts detailing sync age and affected repository.

    ## Who it's for
    - GitOps and Platform Engineers operating self-hosted Git infrastructure.
    - SREs maintaining high-availability developer platform tooling.
    - Compliance officers ensuring disaster-recovery repository synchronization.

    ## Why orchestrate this with Kestra
    - **Continuous Scheduled Surveillance**: Executes periodic REST audits without external daemons.
    - **Encrypted Token Management**: Injects Forgejo personal access tokens via Kestra secrets.
    - **Automated Remediation**: Can trigger a manual mirror push/pull sync via API (`POST /api/v1/repos/{owner}/{name}/mirror-sync`).

    ## Prerequisites
    - Running Forgejo or Gitea instance accessible over HTTPS.
    - API token configured in `FORGEJO_TOKEN` secret.
    - Slack incoming webhook URL stored in `SLACK_WEBHOOK_URL` secret.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `FORGEJO_TOKEN` and `SLACK_WEBHOOK_URL` secrets.
    3. Specify `forgejo_url`, `repo_owner`, and `repo_name`.
    4. Enable the schedule trigger to activate automatic mirror tracking.

    ## How to extend
    - Trigger an immediate mirror sync call via REST API upon lag detection.
    - Audit all mirrored repositories across an organization in a single run.
    - Alert to Microsoft Teams or Discord.

    ## Links
    - [Forgejo API Documentation](https://forgejo.org/docs/latest/user/api-usage/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Infrastructure Automation
