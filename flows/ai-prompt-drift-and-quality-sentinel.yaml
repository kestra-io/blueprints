id: ai-prompt-drift-and-quality-sentinel
namespace: company.team
description: |
  Automated LLM quality regression and prompt drift sentinel. Dispatches standardized benchmark prompts
  to OpenAI models on schedule, validates JSON schema adherence and semantic classification, and alerts Slack.

concurrency:
  limit: 1

inputs:
  - id: model_name
    type: STRING
    displayName: Model Name
    defaults: "gpt-4o-mini"
    description: "OpenAI model version to evaluate against the golden benchmark test suite."

  - id: golden_prompt
    type: STRING
    displayName: Benchmark Golden Prompt
    defaults: "Extract the core customer intent, sentiment, and urgency from this ticket: 'I need to cancel my enterprise subscription immediately, your service has had three outages this week.' Return valid JSON with keys: intent, sentiment, urgency."
    description: "Standard benchmark golden prompt used to evaluate model output consistency."

  - id: expected_intent_keyword
    type: STRING
    displayName: Expected Intent Keyword
    defaults: "cancel"
    description: "Mandatory keyword expected in the structured intent field to pass accuracy assertion."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#ai-platform"
    description: "Slack channel destination for model regression and output drift alerts."

triggers:
  - id: daily_model_evaluation
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Runs golden model benchmark daily at 08:00 UTC."
    cron: "0 8 * * *"

tasks:
  - id: execute_model_inference
    type: io.kestra.plugin.openai.ChatCompletion
    description: "Sends standardized golden prompt to OpenAI ChatCompletion API."
    apiKey: "{{ secret('OPENAI_API_KEY') }}"
    model: "{{ inputs.model_name }}"
    messages:
      - role: system
        content: "You are an automated support classifier. Always reply strictly with valid JSON."
      - role: user
        content: "{{ inputs.golden_prompt }}"

  - id: analyze_response_quality
    type: io.kestra.plugin.scripts.python.Script
    description: "Parses model output JSON, verifies semantic intent keywords, and detects formatting drift."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      llm_response.txt: "{{ outputs.execute_model_inference.choices[0].message.content }}"
    outputFiles:
      - drift_report.json
    script: |
      import json
      import re
      from kestra import Kestra

      with open("llm_response.txt", "r", encoding="utf-8") as f:
          raw_text = f.read().strip()

      clean_json = re.sub(r"^```(?:json)?\s*", "", raw_text, flags=re.MULTILINE)
      clean_json = re.sub(r"\s*```$", "", clean_json, flags=re.MULTILINE).strip()

      parse_success = False
      intent_matched = False
      parsed_data = {}
      drift_reasons = []

      try:
          parsed_data = json.loads(clean_json)
          parse_success = True
      except Exception as err:
          drift_reasons.append(f"JSON schema parsing failed: {err}")

      expected_kw = "{{ inputs.expected_intent_keyword }}".lower()
      if parse_success:
          intent_val = str(parsed_data.get("intent", "")).lower()
          if expected_kw in intent_val:
              intent_matched = True
          else:
              drift_reasons.append(f"Intent mismatch: expected '{expected_kw}', got '{intent_val}'")

          if "sentiment" not in parsed_data:
              drift_reasons.append("Missing required 'sentiment' key in model output")

      drift_detected = (not parse_success) or (not intent_matched) or (len(drift_reasons) > 0)

      report = {
          "model": "{{ inputs.model_name }}",
          "raw_response": raw_text,
          "parsed_data": parsed_data,
          "parse_success": parse_success,
          "intent_matched": intent_matched,
          "drift_detected": drift_detected,
          "drift_reasons": drift_reasons
      }

      with open("drift_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "drift_detected": drift_detected,
          "parse_success": parse_success,
          "intent_matched": intent_matched,
          "failure_reason": drift_reasons[0] if drift_reasons else "None"
      })

  - id: evaluate_drift_alarm
    type: io.kestra.plugin.core.flow.If
    description: "Branches execution based on whether model output regression or formatting drift was detected."
    condition: "{{ outputs.analyze_response_quality.vars.drift_detected }}"
    then:
      - id: notify_slack_prompt_drift
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches high-urgency model regression card to AI engineering channel via Slack."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*CRITICAL: AI Model Quality Regression and Output Drift Alert*\n• *Evaluated Model*: `{{ inputs.model_name }}`\n• *Golden Benchmark Result*: FAILED\n• *Primary Failure Reason*: `{{ outputs.analyze_response_quality.vars.failure_reason }}`\n• *JSON Schema Parse*: {{ outputs.analyze_response_quality.vars.parse_success ? 'PASSED' : 'FAILED' }}\n• *Intent Keyword Match*: {{ outputs.analyze_response_quality.vars.intent_matched ? 'PASSED' : 'FAILED' }}\n• *Operational Impact*: Silent model drift causes downstream automated pipelines and customer classifiers to fail with unhandled exceptions.\n• *Recommended Remediation*: Review provider release notes for `{{ inputs.model_name }}`, adjust system prompt constraints, or pin model to an immutable checkpoint snapshot."
          }

    else:
      - id: log_model_accuracy_compliant
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation of model benchmark compliance."
        message: "Model {{ inputs.model_name }} benchmark compliant. Zero output drift or schema violations detected."

  - id: export_drift_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON evaluation manifest for AI monitoring dashboards."
    format: |
      {
        "pipeline": "ai-prompt-drift-and-quality-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "model": "{{ inputs.model_name }}",
        "parse_success": {{ outputs.analyze_response_quality.vars.parse_success }},
        "intent_matched": {{ outputs.analyze_response_quality.vars.intent_matched }},
        "status": "{{ outputs.analyze_response_quality.vars.drift_detected ? 'DRIFT_DETECTED' : 'COMPLIANT' }}"
      }

extend:
  shortDescription: "Evaluates production LLM models against golden prompt suites to detect regression and drift."
  title: "AI Prompt Drift and Quality Sentinel"
  metaTitle: "AI Prompt Drift and Quality Sentinel | Kestra Blueprint"
  metaDescription: "Sends golden benchmark prompt suites to OpenAI daily, evaluates output schema and semantic quality, and alerts engineering on regression."
  description: |
    Large Language Model (LLM) APIs are continuously updated by foundation model providers (such as OpenAI, Anthropic, and Google). Even within fixed alias endpoints like `gpt-4o-mini`, upstream weight refinements, safety guardrail alterations, and prompt template adjustments can silently alter response formatting and semantic classifications.

    When production applications rely on structured JSON outputs from LLMs, a subtle provider update can cause models to omit required keys, wrap JSON in unexpected markdown fences, or misclassify critical user intents, causing downstream automated workflows to fail.

    This blueprint provides an automated LLM quality gate that dispatches standardized golden benchmark prompts daily, verifies JSON schema validity, tests semantic intent assertions, and alerts AI engineering teams via Slack the moment quality regressions appear.

    ## How it works

    1. **Scheduled Daily Evaluation**: The `daily_model_evaluation` trigger (`io.kestra.plugin.core.trigger.Schedule`) executes daily at 08:00 UTC.
    2. **Model Inference**: The `execute_model_inference` task (`io.kestra.plugin.openai.ChatCompletion`) sends the standardized golden prompt with system constraints to OpenAI.
    3. **Python Quality Scoring**: The `analyze_response_quality` task (`io.kestra.plugin.scripts.python.Script`) strips markdown wrappers, validates JSON parsing, checks expected intent keywords, and exports `drift_report.json`.
    4. **Condition Branching**: The `evaluate_drift_alarm` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any drift criteria were triggered.
    5. **Slack Alert Dispatch**: When drift is detected, `notify_slack_prompt_drift` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable triage card.
    6. **Evaluation Manifest**: The `export_drift_manifest` task records benchmark results for model evaluation dashboards.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Daily 08:00 UTC] --> B[execute_model_inference: OpenAI]
        B --> C[analyze_response_quality: Python JSON & Semantic Validator]
        C --> D{Quality Drift Detected?}
        D -- Yes --> E[notify_slack_prompt_drift: Slack]
        D -- No --> F[log_model_accuracy_compliant: Log]
        E --> G[export_drift_manifest: Return JSON]
        F --> G
    ```

    ## Use cases

    - **Continuous Prompt Regression Guard**: Catch silent provider-side model updates that degrade downstream JSON schema parsing.
    - **Intent Classification Verification**: Ensure customer support prompt benchmarks consistently produce expected classification labels.
    - **Model Upgrade Certification**: Benchmark new foundation model releases against standardized golden evaluation suites.

    ## What you get

    - Automated regression testing of production LLMs against immutable ground truth suites.
    - Strict validation of output JSON schema integrity and required keys.
    - Semantic intent verification asserting business classification accuracy.
    - Immediate Slack alerts detailing exact failure causes (parse failure vs semantic mismatch).

    ## Who it is for

    - AI Platform Engineers and Machine Learning Engineers maintaining production LLM services.
    - Product Developers building applications that consume structured JSON from generative models.
    - QA Engineers automating regression testing of prompt engineering pipelines.

    ## Why orchestrate this with Kestra

    Building custom LLM evaluation scripts requires managing API client keys, scheduling crons, and formatting incident webhooks. Kestra natively unifies OpenAI integration, containerized Python analysis, conditional branching, and enterprise Slack alerting into a declarative workflow that runs reliably.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `model_name` | STRING | `gpt-4o-mini` | OpenAI model target identifier. |
    | `golden_prompt` | STRING | `Extract the core customer intent...` | Benchmark prompt payload. |
    | `expected_intent_keyword` | STRING | `cancel` | Keyword expected in structured intent output. |
    | `slack_channel` | STRING | `#ai-platform` | Slack channel destination for alerts. |

    ## Expected outputs

    - `{{ outputs.analyze_response_quality.vars.drift_detected }}`: Boolean flag indicating if regression occurred.
    - `{{ outputs.analyze_response_quality.vars.parse_success }}`: Boolean flag indicating valid JSON parsing.
    - `{{ outputs.analyze_response_quality.vars.intent_matched }}`: Boolean flag indicating expected keyword match.
    - `{{ outputs.analyze_response_quality.outputFiles['drift_report.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - OpenAI API account with active API credits.
    - OpenAI API key stored in Kestra secrets.
    - Slack Incoming Webhook configured for AI platform notifications.

    ### Secrets

    - `OPENAI_API_KEY`: API key for OpenAI model inference.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `OPENAI_API_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI to run an initial benchmark evaluation.
    4. Review execution outputs and Slack channels for verification.

    ## Common pitfalls and troubleshooting

    - **Markdown Code Fences**: LLMs often wrap JSON outputs in ` ```json ... ``` `; the script safely handles and strips fences before validation.
    - **Temperature Setting**: In production benchmarks, use a low temperature (e.g. 0.0 or 0.1) to ensure deterministic evaluations.
    - **API Rate Limits**: Ensure your OpenAI organization tier supports scheduled inference without hitting 429 concurrency throttles.

    ## How to extend

    - Add `io.kestra.plugin.core.flow.EachParallel` to test multiple models (e.g. `gpt-4o-mini`, `gpt-4o`, `claude-3-5-sonnet`) against the same prompt simultaneously.
    - Store historical evaluation scores in PostgreSQL to visualize model drift trends over months.
    - Automatically fall back to a backup model provider if golden evaluation fails.

    ## Links

    - Kestra OpenAI Plugin Documentation: https://kestra.io/plugins/plugin-openai/io.kestra.plugin.openai.ChatCompletion
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - OpenAI Structured Outputs Guide: https://platform.openai.com/docs/guides/structured-outputs
  tags:
    - AI
    - Cloud
  subTags:
    - Agents & Structured Output
    - Monitoring & Alerting
  ee: false
  demo: false
