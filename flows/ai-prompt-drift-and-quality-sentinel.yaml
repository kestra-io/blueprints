id: ai-prompt-drift-and-quality-sentinel
namespace: company.team

inputs:
  - id: model_name
    type: STRING
    defaults: "gpt-4o-mini"
    description: "OpenAI model version to evaluate against the golden test suite."

  - id: golden_prompt
    type: STRING
    defaults: "Extract the core customer intent, sentiment, and urgency from this ticket: 'I need to cancel my enterprise subscription immediately, your service has had three outages this week.' Return valid JSON with keys: intent, sentiment, urgency."
    description: "Standard benchmark golden prompt used to evaluate model output consistency."

  - id: expected_intent_keyword
    type: STRING
    defaults: "cancel"
    description: "Mandatory keyword expected in the structured intent field to pass accuracy assertion."

  - id: slack_webhook_url
    type: STRING
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
    description: "Slack Incoming Webhook URL for alerting on model output regression."

tasks:
  - id: execute_model_inference
    type: io.kestra.plugin.openai.ChatCompletion
    apiKey: "{{ secret('OPENAI_API_KEY') }}"
    model: "{{ inputs.model_name }}"
    messages:
      - role: system
        content: "You are an automated support classifier. Always reply strictly with valid JSON."
      - role: user
        content: "{{ inputs.golden_prompt }}"

  - id: analyze_response_quality
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      llm_response.txt: "{{ outputs.execute_model_inference.choices[0].message.content }}"
    outputFiles:
      - drift_report.json
    script: |
      import json
      import re
      from kestra import Kestra

      with open("llm_response.txt", "r", encoding="utf-8") as f:
          raw_text = f.read().strip()

      # Strip markdown fences if present
      clean_json = re.sub(r"^```(?:json)?\s*", "", raw_text, flags=re.MULTILINE)
      clean_json = re.sub(r"\s*```$", "", clean_json, flags=re.MULTILINE).strip()

      parse_success = False
      intent_matched = False
      parsed_data = {}
      drift_reasons = []

      try:
          parsed_data = json.loads(clean_json)
          parse_success = True
      except Exception as err:
          drift_reasons.append(f"JSON schema parsing failed: {err}")

      expected_kw = "{{ inputs.expected_intent_keyword }}".lower()
      if parse_success:
          intent_val = str(parsed_data.get("intent", "")).lower()
          if expected_kw in intent_val:
              intent_matched = True
          else:
              drift_reasons.append(f"Intent mismatch: expected '{expected_kw}', got '{intent_val}'")

          if "sentiment" not in parsed_data:
              drift_reasons.append("Missing required 'sentiment' key in model output")

      drift_detected = (not parse_success) or (not intent_matched) or (len(drift_reasons) > 0)

      report = {
          "model": "{{ inputs.model_name }}",
          "raw_response": raw_text,
          "parsed_data": parsed_data,
          "parse_success": parse_success,
          "intent_matched": intent_matched,
          "drift_detected": drift_detected,
          "drift_reasons": drift_reasons
      }

      with open("drift_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "drift_detected": drift_detected,
          "parse_success": parse_success,
          "intent_matched": intent_matched,
          "failure_reason": drift_reasons[0] if drift_reasons else "None"
      })

  - id: evaluate_drift_alarm
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.analyze_response_quality.vars.drift_detected }}"
    then:
      - id: notify_slack_prompt_drift
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ inputs.slack_webhook_url }}"
        payload: |
          {
            "text": "LLM Quality Regression Alert: Model `{{ inputs.model_name }}` failed golden evaluation benchmark. Reason: {{ outputs.analyze_response_quality.vars.failure_reason }}. Immediate prompt review required."
          }

  - id: log_evaluation_summary
    type: io.kestra.plugin.core.log.Log
    message: "LLM golden benchmark evaluation completed. Drift detected: {{ outputs.analyze_response_quality.vars.drift_detected }}. Parse success: {{ outputs.analyze_response_quality.vars.parse_success }}."

triggers:
  - id: daily_model_evaluation
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"

extend:
  title: "AI Prompt Drift and Quality Sentinel"
  shortDescription: "Evaluates production LLM models against golden prompt suites to detect regression and drift."
  metaTitle: "AI Prompt Drift and Quality Sentinel | Kestra Blueprint"
  metaDescription: "Sends golden benchmark prompt suites to OpenAI daily, evaluates output schema and semantic quality, and alerts engineering on regression."
  tags:
    - AI
    - Cloud
    - System
  ee: false
  demo: false
  description: |
    ### What It Does
    This blueprint sends standardized golden benchmark prompts to OpenAI models on a scheduled basis to detect semantic drift, formatting breakdowns, or provider-side model behavior shifts. It validates that responses adhere strictly to JSON schemas, verifies expected semantic classifications, and alerts AI engineers when output quality degrades.

    ### Prerequisites
    - OpenAI API account with an active API key.
    - Secret `OPENAI_API_KEY` configured in Kestra.
    - Slack Incoming Webhook configured in secret `SLACK_WEBHOOK_URL`.

    ### Quick Start
    1. Select your target model in `model_name` (e.g., `gpt-4o-mini` or `gpt-4o`).
    2. Provide your baseline benchmark prompt in `golden_prompt`.
    3. Specify the expected core classification keyword in `expected_intent_keyword`.
    4. Run on a daily schedule to catch provider model regressions before end users are impacted.

    ### Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `model_name` | STRING | `gpt-4o-mini` | OpenAI model target identifier |
    | `golden_prompt` | STRING | `Extract the core customer intent...` | Benchmark prompt payload |
    | `expected_intent_keyword` | STRING | `cancel` | Keyword expected in structured intent output |
    | `slack_webhook_url` | STRING | `{{ secret('SLACK_WEBHOOK_URL') }}` | Slack notification destination |

    ### Expected Outputs
    - `outputs.analyze_response_quality.vars.drift_detected`: Boolean indicating whether quality regression was detected.
    - `outputs.analyze_response_quality.vars.parse_success`: Boolean indicating if valid JSON was returned.
    - `outputs.analyze_response_quality.outputFiles['drift_report.json']`: Diagnostic evaluation report artifact.

    ### Common Pitfalls
    - LLMs occasionally wrap JSON in markdown code blocks; the evaluation script strips markdown wrappers before parsing.
    - Provider model weights can change without version bumps; running golden suites daily provides early regression detection.
