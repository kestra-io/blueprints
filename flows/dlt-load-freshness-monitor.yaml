id: dlt-load-freshness-monitor
namespace: company.team
description: |
  Monitor the freshness of every dlt dataset in the warehouse. The flow
  queries dlt's own _dlt_loads audit table, computes the age of the last
  successful load per dataset, and alerts when any dataset is staler than
  the threshold, catching pipelines that stopped without failing loudly.

inputs:
  - id: warehouse_path
    type: STRING
    defaults: /data/warehouse.duckdb
    description: Persistent path for the DuckDB destination file. Point at a volume that survives task runs; incremental state and merge history live here.

  - id: max_age_hours
    type: INT
    defaults: 26
    description: Alert when the newest completed load in a dataset is older than this many hours.

tasks:
  - id: check_freshness
    type: io.kestra.plugin.dlt.CLI
    description: Query the _dlt_loads audit table that dlt maintains in every dataset, compute the hours since the last completed load, and emit stale datasets as outputs.
    inputFiles:
      check_freshness.py: |
        import duckdb
        import json
        import os
        from datetime import datetime, timezone

        MAX_AGE_HOURS = float(os.environ["MAX_AGE_HOURS"])
        DB_PATH = os.environ["WAREHOUSE_DB_PATH"]

        con = duckdb.connect(DB_PATH, read_only=True)
        schemas = [
            r[0]
            for r in con.execute(
                "SELECT schema_name FROM information_schema.schemata"
            ).fetchall()
        ]

        report, stale = {}, {}
        now = datetime.now(timezone.utc)
        for schema in schemas:
            tables = [
                r[0]
                for r in con.execute(
                    f"SELECT table_name FROM information_schema.tables WHERE table_schema = '{schema}'"
                ).fetchall()
            ]
            if "_dlt_loads" not in tables:
                continue
            row = con.execute(
                f'SELECT max(inserted_at) FROM "{schema}"."_dlt_loads" WHERE status = 0'
            ).fetchone()
            if row and row[0]:
                last = row[0]
                if last.tzinfo is None:
                    last = last.replace(tzinfo=timezone.utc)
                age_hours = round((now - last).total_seconds() / 3600, 1)
                report[schema] = age_hours
                if age_hours > MAX_AGE_HOURS:
                    stale[schema] = age_hours

        fmt = lambda d: ", ".join(f"{k}: {v}h" for k, v in d.items()) or "none"
        print("::" + json.dumps({"outputs": {"ages_hours": report, "stale": stale, "stale_count": len(stale), "ages_summary": fmt(report), "stale_summary": fmt(stale)}}) + "::")
    env:
      MAX_AGE_HOURS: "{{ inputs.max_age_hours }}"
      WAREHOUSE_DB_PATH: "{{ inputs.warehouse_path }}"
    beforeCommands:
      - pip install duckdb --quiet
    commands:
      - python check_freshness.py

  - id: route_result
    type: io.kestra.plugin.core.flow.If
    description: Alert only when at least one dataset breached the freshness threshold.
    condition: "{{ outputs.check_freshness.vars.stale_count > 0 }}"
    then:
      - id: alert_stale
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "STALE dlt datasets detected: {{ outputs.check_freshness.vars.stale_summary }} exceeded {{ inputs.max_age_hours }}h since their last completed load. A pipeline probably stopped without failing (execution {{ execution.id }})."
          }
    else:
      - id: log_fresh
        type: io.kestra.plugin.core.log.Log
        message: "All dlt datasets fresh: {{ outputs.check_freshness.vars.ages_summary }} since last completed load, threshold {{ inputs.max_age_hours }}h."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: A broken monitor is worse than a stale dataset; alert when the check itself cannot run.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "dlt freshness monitor FAILED to run (execution {{ execution.id }}). Datasets are currently unmonitored; check warehouse connectivity."
      }

triggers:
  - id: morning_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check freshness every morning after the nightly loads should have finished.
    cron: "0 8 * * *"
    disabled: true

extend:
  title: dlt Dataset Freshness Monitor
  shortDescription: A scheduled check over dlt's _dlt_loads audit tables that computes last-load age per dataset and alerts Slack when anything exceeds the freshness threshold.
  metaTitle: Monitor dlt Load Freshness with Kestra
  metaDescription: Catch dlt pipelines that stopped without failing. Kestra queries the _dlt_loads audit table, computes last-load age per dataset, and alerts Slack on staleness.
  description: |
    The most dangerous pipeline failure is the one that does not fail: a disabled schedule, a revoked credential on a machine nobody watches, an upstream that quietly stopped producing. This blueprint monitors the one artifact every dlt pipeline maintains for free, the `_dlt_loads` audit table, and computes how long ago each dataset last completed a load. Any dataset older than the threshold triggers a Slack alert naming it and its age; a healthy warehouse produces a quiet log line.

    ## How it works

    1. `check_freshness` (`io.kestra.plugin.dlt.CLI`) ships a small Python script through `inputFiles` and runs it with `commands`. The script walks every schema in the warehouse, finds those containing a `_dlt_loads` table, and reads `max(inserted_at)` for completed loads (`status = 0`).
    2. Ages are computed in hours and emitted through Kestra's output protocol as both a full report and the stale subset.
    3. `route_result` (`io.kestra.plugin.core.flow.If`) branches on `stale_count`: breaches page Slack with dataset names and ages; a clean sweep logs the report for the execution history.
    4. The `errors` block alerts when the monitor itself cannot run, because an unmonitored warehouse feels identical to a healthy one until it is not.
    5. A disabled-by-default morning `Schedule` runs after the nightly loads should have landed.

    ## What you get

    - Detection of silently stopped pipelines, the failure mode that never triggers an error alert on its own.
    - Zero instrumentation cost: dlt already writes the audit table on every load.
    - One monitor for every dlt dataset in the warehouse, present and future, since schemas are discovered at runtime.
    - A threshold as a flow input, so ad hoc runs can probe with stricter windows.

    ## Who it's for

    - Data platform teams operating many dlt pipelines owned by different people.
    - On-call engineers who want one morning signal covering the whole warehouse.
    - Anyone who has been asked why a dashboard shows last Tuesday's data.

    ## Why orchestrate this with Kestra

    Freshness monitoring needs a scheduler, a place to run warehouse queries, branching logic, alert routing, and its own failure handling, exactly the primitives a workflow engine provides. Kestra runs the check on cadence, keeps every report in the execution history as a freshness time series, and guarantees that a monitor outage itself raises an alert instead of silence.

    ## Prerequisites

    - A warehouse loaded by dlt pipelines (the script targets DuckDB; the SQL adapts to Postgres, BigQuery, or Snowflake with minor changes).
    - Read access to the warehouse from Kestra workers, with the path or credentials passed via task `env`.
    - A Slack incoming webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret and set `WAREHOUSE_DB_PATH` in the task env to your warehouse location.
    2. Execute manually; confirm the log line lists every dlt dataset with its age.
    3. Set `max_age_hours` to fit your load cadence and enable the `morning_check` trigger.

    ## How to extend

    - Adapt the connection block to Postgres or Snowflake; `_dlt_loads` has the same shape in every dlt destination.
    - Add per-dataset thresholds by mapping dataset names to expected cadences inside the script.
    - Escalate to PagerDuty when the same dataset is stale two mornings in a row, using Kestra KV to remember yesterday's result.
    - Emit the ages as metrics to Prometheus instead of Slack for dashboarding.

    ## Links

    - [dlt plugin documentation](https://kestra.io/plugins/plugin-dlt)
    - [dlt load info and audit tables](https://dlthub.com/docs/running-in-production/running)
  tags:
    - Data
    - Business
  subTags:
    - Monitoring & Alerting
    - Scheduling
  ee: false
  demo: false
