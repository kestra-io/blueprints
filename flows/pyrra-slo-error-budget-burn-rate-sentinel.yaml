id: pyrra-slo-error-budget-burn-rate-sentinel
namespace: company.sre

description: |
  Continuously monitors Pyrra Service Level Objective (SLO) tracking services, inspects multi-window error budget burn rates for critical tier-1 microservices, and dispatches actionable Slack incident notifications upon error budget exhaustion or API degradation.

inputs:
  - id: pyrra_api_endpoint
    type: STRING
    displayName: Pyrra API Endpoint
    defaults: "http://pyrra.internal:9099"
    description: "Base HTTP URL of the Pyrra SLO management service."

  - id: target_service_name
    type: STRING
    displayName: Target Service Name
    defaults: "checkout-api"
    description: "Name of the critical microservice whose SLO error budget is evaluated."

  - id: slack_channel
    type: STRING
    displayName: SRE Alert Channel
    defaults: "#sre-alerts"
    description: "Slack channel for routing SLO degradation and error budget burn alerts."

triggers:
  - id: scheduled_sentinel_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */1 * * *"
    disabled: true
    inputs:
      pyrra_api_endpoint: "http://pyrra.internal:9099"
      target_service_name: "checkout-api"

tasks:
  - id: probe_pyrra_readiness
    type: io.kestra.plugin.core.http.Request
    description: "Probes Pyrra readyz endpoint to ensure the SLO controller and Prometheus data connections are responsive."
    uri: "{{ inputs.pyrra_api_endpoint }}/readyz"
    method: GET

  - id: probe_active_objectives
    type: io.kestra.plugin.core.http.Request
    description: "Queries active Service Level Objectives from Pyrra to verify rule synchronization and objective configuration."
    uri: "{{ inputs.pyrra_api_endpoint }}/api/v1/objectives"
    method: GET

  - id: probe_service_slo_status
    type: io.kestra.plugin.core.http.Request
    description: "Retrieves real-time status and error budget metrics for target objectives from Pyrra."
    uri: "{{ inputs.pyrra_api_endpoint }}/api/v1/objectives/status"
    method: GET

  - id: evaluate_slo_compliance
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates Pyrra probe response codes and telemetry to branch into alert or compliance handling."
    value: |
      {% if outputs.probe_pyrra_readiness.code != 200 %}
      ENGINE_UNHEALTHY
      {% elseif outputs.probe_active_objectives.code != 200 %}
      OBJECTIVES_UNAVAILABLE
      {% elseif outputs.probe_service_slo_status.code != 200 %}
      SLO_STATUS_ERROR
      {% else %}
      COMPLIANT
      {% endif %}
    cases:
      COMPLIANT:
        - id: log_compliant_state
          type: io.kestra.plugin.core.log.Log
          level: INFO
          message: "Pyrra SLO controller at {{ inputs.pyrra_api_endpoint }} is healthy, active objectives are synchronized, and target service '{{ inputs.target_service_name }}' error budgets are within acceptable operational limits."

      ENGINE_UNHEALTHY:
        - id: alert_engine_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "Pyrra SLO Controller Outage Alert",
                  "text": "CRITICAL: Pyrra readiness probe at `{{ inputs.pyrra_api_endpoint }}/readyz` returned HTTP status `{{ outputs.probe_pyrra_readiness.code }}`.\nPrometheus SLO synchronization and error budget telemetry are offline.",
                  "footer": "Kestra Sentinel | Reliability Engineering"
                }
              ]
            }
        - id: log_engine_failure
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "CRITICAL: Pyrra readiness probe failed with HTTP status code {{ outputs.probe_pyrra_readiness.code }}."

      OBJECTIVES_UNAVAILABLE:
        - id: alert_objectives_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#E65100",
                  "title": "Pyrra Objectives API Degraded",
                  "text": "WARNING: Unable to query active objectives from `{{ inputs.pyrra_api_endpoint }}/api/v1/objectives` (HTTP status `{{ outputs.probe_active_objectives.code }}`). Verify Pyrra controller configuration and underlying Prometheus connectivity.",
                  "footer": "Kestra Sentinel | Reliability Engineering"
                }
              ]
            }

      SLO_STATUS_ERROR:
        - id: alert_status_error
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#F57C00",
                  "title": "Pyrra SLO Status Evaluation Warning",
                  "text": "WARNING: Pyrra `/api/v1/objectives/status` returned HTTP status `{{ outputs.probe_service_slo_status.code }}` for target service `{{ inputs.target_service_name }}`.\nError budget burn rate calculation could not be completed.",
                  "footer": "Kestra Sentinel | Reliability Engineering"
                }
              ]
            }
        - id: log_status_warning
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "Pyrra SLO status endpoint returned HTTP status {{ outputs.probe_service_slo_status.code }} for service {{ inputs.target_service_name }}."

  - id: record_audit_log
    type: io.kestra.plugin.core.log.Log
    description: "Emits a permanent execution audit log tracking Pyrra SLO monitoring outcomes."
    level: INFO
    message: "Completed Pyrra SLO sentinel audit for service={{ inputs.target_service_name }}. Controller code={{ outputs.probe_pyrra_readiness.code }}, Objectives code={{ outputs.probe_active_objectives.code }}, Status code={{ outputs.probe_service_slo_status.code }}."

extend:
  title: Pyrra Service Level Objective (SLO) Error Budget Sentinel
  metaTitle: Pyrra Service Level Objective Sentinel | Kestra
  shortDescription: Audits Pyrra SLO controller health, tracks error budget burn rates, detects telemetry degradation, and dispatches Slack incident alerts.
  metaDescription: Monitor Pyrra SLO compliance, track error budget burn rates, detect service level degradation, and dispatch automated Slack incident alerts with Kestra.
  description: |
    Continuously monitors Pyrra Service Level Objective (SLO) tracking services, inspects multi-window error budget burn rates for critical tier-1 microservices, and dispatches actionable Slack incident notifications upon error budget exhaustion or API degradation.

    ## How it works

    1. A recurrent `Schedule` trigger initiates the sentinel audit workflow every hour (disabled by default for on-demand configuration).
    2. The `probe_pyrra_readiness` task executes a `GET` request against Pyrra's `/readyz` endpoint to confirm controller readiness and Prometheus connectivity.
    3. The `probe_active_objectives` task queries `/api/v1/objectives` to verify active SLO CRD synchronization and objective definitions.
    4. The `probe_service_slo_status` task calls `/api/v1/objectives/status` to evaluate real-time multi-window error budget burn rates and availability status for target microservices.
    5. The `evaluate_slo_compliance` task uses Pebble conditionals inside a `Switch` task to categorize outcomes into `COMPLIANT`, `ENGINE_UNHEALTHY`, `OBJECTIVES_UNAVAILABLE`, or `SLO_STATUS_ERROR`.
    6. Upon detecting outages or status retrieval degradation, contextual Slack notifications are dispatched via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` with diagnostic status codes, and an audit trail is recorded in Kestra's execution history.

    ## What you get

    - Automated operational surveillance over Pyrra SLO controllers and Prometheus metric ingestion pipelines.
    - Proactive alerting before error budgets are completely depleted, safeguarding microservice availability agreements.
    - Contextual incident routing to dedicated SRE and platform engineering Slack channels.
    - Automated deployment gate capability to halt downstream CD pipelines when error budgets are exhausted.
    - Centralized, revision-controlled audit history for regulatory and post-incident compliance reviews.

    ## Who it's for

    - Site Reliability Engineers (SREs) managing production Service Level Objectives and error budgets.
    - Platform Engineers responsible for observability infrastructure, Prometheus, and Pyrra controllers.
    - DevOps Teams operating automated deployment gates dependent on error budget availability.

    ## Why orchestrate this with Kestra

    - **Declarative Reliability Guardrails**: Maintain SLO audit schedules, target services, and incident runbooks as version-controlled YAML blueprints.
    - **Native Credential Isolation**: Inject Slack webhook credentials via namespace secrets using `{{ secret(...) }}` without plaintext exposure.
    - **Multi-Branch Flow Routing**: Differentiate between controller outages, API parsing failures, and service-level burn rate spikes via native `Switch` tasks.
    - **Auditable Execution Telemetry**: Maintain complete execution logs and HTTP diagnostic status codes across every audit run.

    ## Prerequisites

    - A running Pyrra instance (accessible over HTTP) with standard health and API endpoints exposed (default port 9099).
    - Network reachability from the Kestra worker or runner environment to the Pyrra service.
    - A Slack Incoming Webhook URL configured with permission to post into your target operations channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for dispatching reliability alerts and incident notifications.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your target Kestra namespace settings.
    2. Import this blueprint into your Kestra instance (e.g., under namespace `company.sre`).
    3. Click **Execute** with default parameters or supply your custom `pyrra_api_endpoint` and `target_service_name`.
    4. Confirm that execution logs display successful HTTP response codes under the **Executions** tab.
    5. Activate the `scheduled_sentinel_audit` trigger to establish recurrent automated SLO surveillance.

    ## How to extend

    - **Automated Deployment Gate**: Chain this flow as a prerequisite task in CI/CD pipelines to block Canary rollouts whenever error budget burn exceeds thresholds.
    - **Multi-Service Sweep**: Wrap the objective status probe inside a `ForEach` task to evaluate error budgets across all frontend, payment, and inventory services in a single workflow.
    - **PagerDuty Escalation**: Route `ENGINE_UNHEALTHY` events directly to PagerDuty or Opsgenie on-call escalation schedules.
    - **Automated Scaledown**: Trigger a Kubernetes Horizontal Pod Autoscaler (HPA) adjustment or traffic throttling workflow upon sustained high error budget burn.

    ## Links

    - [Pyrra Documentation](https://pyrra.dev/)
    - [Pyrra GitHub Repository](https://github.com/pyrra-dev/pyrra)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  verified: false
  demo: false
