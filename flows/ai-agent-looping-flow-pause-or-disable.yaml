id: ai-agent-looping-flow-pause-or-disable
namespace: company.team
description: |
  Pause a looping agent flow for real. Once a day this flow reads the real
  recent executions of one configured agent flow from the Kestra executions
  API, tests them against genuine loop signatures, and when a loop is
  found it disables that flow and kills its running executions through
  the Kestra API, then reports what it disabled. A detected loop never
  ends with only a failed watchdog run. The schedule trigger passes the
  target flow identity explicitly, so a scheduled run cannot fail for
  missing inputs, and a run that cannot read the API fails closed instead
  of reporting a clean bill of health.

triggers:
  - id: daily_loop_remediation
    type: io.kestra.plugin.core.trigger.Schedule
    description: |
      Daily sweep of the configured agent flow. The trigger inputs below
      pass the target flow identity explicitly (tenant, Kestra URL,
      namespace, and agent flow id), which is the fix for the earlier
      watchdog whose schedule carried no inputs and failed on its own.
      Repoint these four values at your own Kestra instance and agent
      flow before relying on the defaults, which point at a local
      instance and an example flow id as a runnable example.
    cron: "0 6 * * *"
    inputs:
      tenant: "main"
      kestra_url: "http://localhost:8080"
      namespace: "company.team"
      agent_flow_id: "example-agent-flow"

inputs:
  - id: tenant
    type: STRING
    displayName: Kestra tenant
    description: Tenant segment of the Kestra API path. The default main tenant is the open source default.
    defaults: main
  - id: kestra_url
    type: STRING
    displayName: Kestra URL
    description: Base URL of the Kestra instance whose executions API is read, with no trailing slash.
    defaults: http://localhost:8080
  - id: namespace
    type: STRING
    displayName: Agent flow namespace
    description: Namespace that holds the agent flow. Matched exactly.
    defaults: company.team
  - id: agent_flow_id
    type: STRING
    displayName: Agent flow id
    description: Id of the AI agent flow whose execution history is watched and which is disabled when a loop is found. The schedule trigger passes this same value explicitly, so a scheduled run never fails for a missing input. Repoint it at your real agent flow before relying on this flow.
    defaults: example-agent-flow
  - id: lookback_hours
    type: INT
    displayName: Lookback window in hours
    description: How far back the remediation flow reaches into the execution history.
    defaults: 24
  - id: max_consecutive_failures
    type: INT
    displayName: Maximum consecutive failures
    description: A run of this many FAILED executions in a row, ending at the most recent execution, counts as a failure loop.
    defaults: 3
  - id: max_repeated_task_failures
    type: INT
    displayName: Maximum repeated task failures
    description: The same task failing in this many distinct executions of the agent flow counts as a failure loop, even when successful runs sit between the failures.
    defaults: 3
  - id: max_failure_percent
    type: INT
    displayName: Maximum failure percent
    description: Failure percent above this cap counts as a failure loop, once the minimum execution count below is met. Set to 100 to disable the rate rule and rely on the loop rules only.
    defaults: 50
  - id: min_executions_for_rate
    type: INT
    displayName: Minimum executions for the rate rule
    description: The rate rule only fires once at least this many executions of the agent flow exist in the window, so two failures out of three runs cannot trip a percent cap on a tiny sample.
    defaults: 5

tasks:
  - id: check_agent_history
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Read the real recent executions of the configured agent flow from
      the Kestra executions API and test them against three loop
      signatures, namely consecutive FAILED runs, the same task failing
      across several runs, and failure percent above the cap. Nothing in
      this task is sample data. The executions, states, and failed tasks
      all come from the live Kestra instance in the lookback window. A
      run that cannot read the API, reads a response it cannot parse, or
      finds no executions of the target flow in the window yields
      INCONCLUSIVE, never a clean verdict for a history it could not
      judge, and the triage task below fails the run on INCONCLUSIVE.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.12-slim
    env:
      TENANT: "{{ inputs.tenant }}"
      KESTRA_URL: "{{ inputs.kestra_url }}"
      NAMESPACE: "{{ inputs.namespace }}"
      AGENT_FLOW_ID: "{{ inputs.agent_flow_id }}"
      LOOKBACK_HOURS: "{{ inputs.lookback_hours }}"
      MAX_CONSECUTIVE_FAILURES: "{{ inputs.max_consecutive_failures }}"
      MAX_REPEATED_TASK_FAILURES: "{{ inputs.max_repeated_task_failures }}"
      MAX_FAILURE_PERCENT: "{{ inputs.max_failure_percent }}"
      MIN_EXECUTIONS_FOR_RATE: "{{ inputs.min_executions_for_rate }}"
      KESTRA_API_TOKEN: "{{ secret('KESTRA_API_TOKEN') }}"
    script: |
      import json
      import os
      import urllib.error
      import urllib.parse
      import urllib.request
      from datetime import datetime, timedelta, timezone


      def http_get(url, token):
          headers = {
              "Accept": "application/json",
              "User-Agent": "kestra-ai-agent-looping-flow-pause-or-disable",
          }
          if token:
              headers["Authorization"] = "Bearer " + token
          request = urllib.request.Request(url, method="GET", headers=headers)
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.status, response.read().decode("utf-8", "replace"), None
          except urllib.error.HTTPError as err:
              return err.code, err.read().decode("utf-8", "replace"), None
          except Exception as err:  # noqa: BLE001 - any transport failure is inconclusive
              return None, "", str(err)


      def state_of(obj):
          state = obj.get("state", "") if isinstance(obj, dict) else ""
          if isinstance(state, dict):
              return state.get("current", "")
          return state or ""


      def parse_date(value, fallback):
          if not isinstance(value, str) or not value:
              return fallback
          try:
              return datetime.fromisoformat(value.replace("Z", "+00:00"))
          except ValueError:
              return fallback


      def emit(outputs):
          print("::" + json.dumps({"outputs": outputs}) + "::")


      def inconclusive(reason):
          emit({
              "verdict": "INCONCLUSIVE",
              "executions_checked": 0,
              "failed_count": 0,
              "consecutive_failures": 0,
              "repeated_task_failures": 0,
              "failure_percent": 0,
              "running_execution_ids": [],
              "reasons": [reason],
          })


      def main():
          now = datetime.now(timezone.utc)
          tenant = os.environ.get("TENANT", "main")
          base = os.environ.get("KESTRA_URL", "").rstrip("/")
          namespace = os.environ.get("NAMESPACE", "")
          flow_id = os.environ.get("AGENT_FLOW_ID", "")
          lookback = int(os.environ.get("LOOKBACK_HOURS", "24"))
          max_consecutive = int(os.environ.get("MAX_CONSECUTIVE_FAILURES", "3"))
          max_repeated = int(os.environ.get("MAX_REPEATED_TASK_FAILURES", "3"))
          max_percent = int(os.environ.get("MAX_FAILURE_PERCENT", "50"))
          min_for_rate = int(os.environ.get("MIN_EXECUTIONS_FOR_RATE", "5"))
          token = os.environ.get("KESTRA_API_TOKEN", "")
          if not flow_id:
              inconclusive("agent_flow_id was empty, so no target flow could be judged")
              return
          window_start = now - timedelta(hours=lookback)
          params = urllib.parse.urlencode({
              "filters[namespace][EQUALS]": namespace,
              "size": "100",
          })
          url = base + "/api/v1/" + tenant + "/executions/search?" + params
          status, body, error = http_get(url, token)
          if status != 200:
              inconclusive("could not read executions API: %s" % (error or body[:300]))
              return
          try:
              payload = json.loads(body)
          except ValueError:
              inconclusive("executions API response was not valid JSON")
              return
          if isinstance(payload, dict):
              results = payload.get("results", payload.get("executions", []))
          else:
              results = payload
          if not isinstance(results, list):
              results = []
          watched = []
          for execution in results:
              if not isinstance(execution, dict):
                  continue
              if execution.get("flowId", "") != flow_id:
                  continue
              started = parse_date(execution.get("startDate", ""), now)
              if started < window_start:
                  continue
              watched.append(execution)
          if not watched:
              inconclusive("no executions of the target flow found in the lookback window")
              return
          watched.sort(key=lambda item: item.get("startDate", ""), reverse=True)
          failed = sum(1 for execution in watched if state_of(execution) == "FAILED")
          consecutive = 0
          for execution in watched:
              state = state_of(execution)
              if state in ("RUNNING", "CREATED", "QUEUED", "KILLING"):
                  continue
              if state == "FAILED":
                  consecutive += 1
              else:
                  break
          consecutive_failures = consecutive
          task_failure_counts = {}
          running_ids = []
          for execution in watched:
              state = state_of(execution)
              if state in ("RUNNING", "CREATED", "QUEUED"):
                  if execution.get("id"):
                      running_ids.append(execution.get("id"))
              task_runs = execution.get("taskRunList", [])
              if isinstance(task_runs, list):
                  seen_here = set()
                  for task_run in task_runs:
                      if isinstance(task_run, dict) and state_of(task_run) == "FAILED":
                          task_id = task_run.get("taskId", "")
                          if task_id and task_id not in seen_here:
                              seen_here.add(task_id)
                              task_failure_counts[task_id] = task_failure_counts.get(task_id, 0) + 1
          repeated = max(task_failure_counts.values()) if task_failure_counts else 0
          failure_percent = round(100.0 * failed / len(watched)) if watched else 0
          reasons = []
          loop = False
          if consecutive_failures >= max_consecutive:
              loop = True
              reasons.append("%d consecutive FAILED executions" % consecutive_failures)
          if repeated >= max_repeated:
              loop = True
              reasons.append("same task failed in %d executions" % repeated)
          if len(watched) >= min_for_rate and failure_percent > max_percent:
              loop = True
              reasons.append("failure rate %d percent above cap %d" % (failure_percent, max_percent))
          if not loop:
              reasons.append("no loop signature met")
          emit({
              "verdict": "LOOP" if loop else "CLEAR",
              "executions_checked": len(watched),
              "failed_count": failed,
              "consecutive_failures": consecutive_failures,
              "repeated_task_failures": repeated,
              "failure_percent": failure_percent,
              "running_execution_ids": running_ids,
              "reasons": reasons,
          })


      main()

  - id: remediate
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Act on the verdict, it does not merely report it. On a LOOP verdict
      it disables the target flow with POST /api/v1/{tenant}/flows/
      disable/by-ids carrying the namespace and flow id, then kills every
      still running execution of that flow with DELETE /api/v1/{tenant}/
      executions/kill/by-ids carrying their ids. Both endpoints are the
      ones Kestra's own server exposes (FlowController disable by ids and
      ExecutionController kill by ids). On any other verdict it makes no
      API call at all. If the disable call or the kill call fails, this
      task fails outright, so the run never claims a remediation that did
      not happen.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.12-slim
    env:
      TENANT: "{{ inputs.tenant }}"
      KESTRA_URL: "{{ inputs.kestra_url }}"
      NAMESPACE: "{{ inputs.namespace }}"
      AGENT_FLOW_ID: "{{ inputs.agent_flow_id }}"
      VERDICT: "{{ outputs.check_agent_history.vars.verdict }}"
      RUNNING_IDS: "{{ outputs.check_agent_history.vars.running_execution_ids | toJson }}"
      KESTRA_API_TOKEN: "{{ secret('KESTRA_API_TOKEN') }}"
    script: |
      import json
      import os
      import sys
      import urllib.error
      import urllib.request


      def emit(outputs):
          print("::" + json.dumps({"outputs": outputs}) + "::")


      def http_call(url, method, token, payload):
          data = json.dumps(payload).encode("utf-8") if payload is not None else None
          headers = {
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "kestra-ai-agent-looping-flow-pause-or-disable",
          }
          if token:
              headers["Authorization"] = "Bearer " + token
          request = urllib.request.Request(url, method=method, data=data, headers=headers)
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.status, response.read().decode("utf-8", "replace")
          except urllib.error.HTTPError as err:
              return err.code, err.read().decode("utf-8", "replace")
          except Exception as err:  # noqa: BLE001 - any transport failure fails the remediation
              return None, str(err)


      def main():
          tenant = os.environ.get("TENANT", "main")
          base = os.environ.get("KESTRA_URL", "").rstrip("/")
          namespace = os.environ.get("NAMESPACE", "")
          flow_id = os.environ.get("AGENT_FLOW_ID", "")
          verdict = os.environ.get("VERDICT", "")
          token = os.environ.get("KESTRA_API_TOKEN", "")
          try:
              running_ids = json.loads(os.environ.get("RUNNING_IDS", "[]"))
          except ValueError:
              running_ids = []
          if not isinstance(running_ids, list):
              running_ids = []
          if verdict != "LOOP":
              emit({
                  "action": "none",
                  "disabled_count": 0,
                  "killed_count": 0,
                  "reasons": ["verdict was %s, so no disable or kill call was made" % verdict],
              })
              return
          disable_url = base + "/api/v1/" + tenant + "/flows/disable/by-ids"
          status, body = http_call(disable_url, "POST", token, [{"namespace": namespace, "id": flow_id}])
          if status != 200:
              print("FAILED to disable flow %s: HTTP %s %s" % (flow_id, status, body[:300]), file=sys.stderr)
              raise SystemExit("disable call failed, remediation not claimed")
          try:
              disabled_count = json.loads(body).get("count", 1) if body.strip() else 1
          except ValueError:
              disabled_count = 1
          killed_count = 0
          if running_ids:
              kill_url = base + "/api/v1/" + tenant + "/executions/kill/by-ids"
              status, body = http_call(kill_url, "DELETE", token, running_ids)
              if status not in (200, 202):
                  print("FAILED to kill running executions: HTTP %s %s" % (status, body[:300]), file=sys.stderr)
                  raise SystemExit("kill call failed, remediation incomplete")
              killed_count = len(running_ids)
          emit({
              "action": "disabled_and_killed" if running_ids else "disabled",
              "disabled_count": disabled_count,
              "killed_count": killed_count,
              "reasons": ["target flow disabled via disable by-ids", "%d running executions killed via kill by-ids" % killed_count],
          })


      main()

  - id: triage
    type: io.kestra.plugin.core.flow.If
    description: |
      Fail closed on an unreadable history. An INCONCLUSIVE verdict means
      the API could not be read, its response could not be parsed, or no
      executions of the target flow existed to judge, so the run fails
      instead of reporting a clean bill of health. Any other verdict only
      logs what was checked and what was done.
    condition: "{{ outputs.check_agent_history.vars.verdict == 'INCONCLUSIVE' }}"
    then:
      - id: fail_on_inconclusive
        type: io.kestra.plugin.core.execution.Fail
        description: Fail the execution when the history could not be judged, so an unreadable state never passes as clean.
        errorMessage: "AI agent looping flow pause or disable INCONCLUSIVE: {{ outputs.check_agent_history.vars.reasons | toJson }}. No remediation was claimed."
    else:
      - id: log_remediation
        type: io.kestra.plugin.core.log.Log
        description: Record the verdict, the counts, and the remediation action, so the execution history proves what was checked and what was disabled or killed.
        message: "AI agent looping flow pause or disable {{ outputs.check_agent_history.vars.verdict }}: {{ outputs.check_agent_history.vars.executions_checked }} executions checked, {{ outputs.check_agent_history.vars.failed_count }} failed, action {{ outputs.remediate.vars.action }}, disabled {{ outputs.remediate.vars.disabled_count }}, killed {{ outputs.remediate.vars.killed_count }}. Reasons: {{ outputs.check_agent_history.vars.reasons | toJson }}."

  - id: deliver
    type: io.kestra.plugin.core.debug.Return
    description: Report the verdict and the remediation outcome together, so a downstream consumer can see both the loop evidence and what was acted on.
    format: |
      AI agent looping flow pause or disable {{ outputs.check_agent_history.vars.verdict }}: {{ outputs.check_agent_history.vars.executions_checked }} executions checked, action {{ outputs.remediate.vars.action }}, disabled {{ outputs.remediate.vars.disabled_count }}, killed {{ outputs.remediate.vars.killed_count }}.

outputs:
  - id: verdict
    type: STRING
    description: LOOP when a loop signature fired and remediation ran, CLEAR when the history was judged and no loop fired, INCONCLUSIVE when the history could not be judged and the run failed closed.
    value: "{{ outputs.check_agent_history.vars.verdict }}"
  - id: action
    type: STRING
    description: Remediation action taken, disabled_and_killed, disabled, or none.
    value: "{{ outputs.remediate.vars.action }}"

extend:
  shortDescription: Disable a looping agent flow and kill its running executions instead of only reporting the loop
  title: AI Agent Looping Flow Pause Or Disable
  metaTitle: AI Agent Looping Flow Pause Or Disable | Kestra
  description: |
    ## What it does

    This flow stops a looping agent flow instead of only watching it. Once
    a day it reads the real recent executions of one configured agent flow
    from the Kestra executions API, tests them against genuine loop
    signatures (several failed runs in a row, the same task failing across
    several runs, or a failure rate above the configured cap), and when a
    loop is found it disables that flow and kills its running executions
    through the Kestra API, then reports what it disabled. A detected loop
    never ends with only a failed watchdog run. The schedule trigger
    passes the target flow identity explicitly, so a scheduled run cannot
    fail for missing inputs, which was a defect of the earlier watchdog.
    A run that cannot read the API fails closed instead of reporting a
    clean bill of health.

    ## Prerequisites

    - A Kestra instance with API access and a `KESTRA_API_TOKEN` secret in
      the namespace this flow runs in, holding a token permitted to read
      executions, disable flows, and kill executions.
    - A real agent flow to watch. Repoint the schedule trigger inputs and
      the flow inputs (tenant, Kestra URL, namespace, agent flow id) at
      your own instance and flow before relying on the defaults, which
      point at a local instance and an example flow id as a runnable
      example.
    - Note the blast radius before enabling the schedule: on a LOOP
      verdict this flow disables the target flow, so its triggers stop
      firing until a human re-enables it. That is the intended effect, and
      it is why the loop signatures require repeated failures rather than
      a single failure.

    ## How it works

    1. `daily_loop_remediation` (`io.kestra.plugin.core.trigger.Schedule`)
       fires daily and passes tenant, Kestra URL, namespace, and agent
       flow id explicitly as trigger inputs, so a scheduled run carries
       the target identity without depending on manual input.
    2. `check_agent_history` (`io.kestra.plugin.scripts.python.Script`)
       reads recent executions with GET /api/v1/{tenant}/executions/search
       filtered by namespace, keeps only the target flow id, and tests
       the three loop signatures in the lookback window. An unreadable
       API, an unparseable response, an empty flow id, or an empty window
       yields INCONCLUSIVE, and it also collects the ids of executions
       still in RUNNING, CREATED, or QUEUED state.
    3. `remediate` (`io.kestra.plugin.scripts.python.Script`) acts only
       on a LOOP verdict. It disables the target flow with POST
       /api/v1/{tenant}/flows/disable/by-ids carrying the namespace and
       flow id, then kills the still running executions with DELETE
       /api/v1/{tenant}/executions/kill/by-ids carrying their ids. Both
       endpoints are the ones Kestra's own server exposes. If either call
       fails, the task fails outright, so the run never claims a
       remediation that did not happen. On any other verdict it makes no
       API call at all.
    4. `triage` (`io.kestra.plugin.core.flow.If`) fails the execution
       itself (`io.kestra.plugin.core.execution.Fail`) on an
       INCONCLUSIVE verdict, and otherwise logs the verdict, counts, and
       remediation action.
    5. `deliver` (`io.kestra.plugin.core.debug.Return`) reports the
       verdict and the remediation outcome together.

    ## How to adapt it

    - Tune the loop signatures per flow: a flow that fails legitimately
      in bursts needs a higher consecutive cap or a higher rate cap, while
      a flow that must never fail twice in a row wants the consecutive
      cap at 2.
    - Add a notification task on the LOOP branch (Slack, PagerDuty, or
      email) carrying the loop evidence and the disabled flow id, so the
      owning team learns the flow was disabled from the alert, not from a
      missing run.
    - If your Kestra setup uses a tenant other than main, set `tenant`
      in both the trigger inputs and the flow inputs: the API paths carry
      the tenant segment, and a wrong tenant reads the wrong history.
    - Keep a manual re-enable runbook next to this flow: re-enabling is a
      human decision after the loop cause is fixed, and this flow
      deliberately provides no auto re-enable path.

  tags:
    - AI
  subTags:
    - Agents & Structured Output
  ee: false
  demo: false
  metaDescription: "Disable a looping agent flow and kill its running executions through the Kestra API, with the target identity passed explicitly by the schedule trigger."
