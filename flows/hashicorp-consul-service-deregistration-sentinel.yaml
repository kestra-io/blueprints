id: hashicorp-consul-service-deregistration-sentinel
namespace: company.team
description: Audits HashiCorp Consul health checks to detect critical service failures and impending catalog deregistration.

inputs:
  - id: consul_addr
    type: STRING
    defaults: "http://consul.internal:8500"
    description: Consul agent or server HTTP address.

  - id: critical_service_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of services in critical health check failure status.

tasks:
  - id: query_critical_services
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    description: Query Consul API for critical service checks
    env:
      CONSUL_ADDR: "{{ inputs.consul_addr }}"
      CONSUL_HTTP_TOKEN: "{{ secret('CONSUL_HTTP_TOKEN') }}"
    script: |
      import os
      import sys
      import json
      import urllib.request
      import urllib.error
      from kestra import Kestra

      addr = os.environ.get("CONSUL_ADDR", "http://consul.internal:8500").rstrip("/")
      token = os.environ.get("CONSUL_HTTP_TOKEN")

      url = f"{addr}/v1/health/state/critical"
      headers = {"User-Agent": "Kestra-Consul-Sentinel"}
      if token:
          headers["X-Consul-Token"] = token

      req = urllib.request.Request(url, headers=headers)
      try:
          with urllib.request.urlopen(req, timeout=30) as resp:
              checks = json.loads(resp.read().decode("utf-8"))
      except urllib.error.HTTPError as e:
          print(f"CRITICAL: HTTP error querying Consul: {e.code} {e.reason}", file=sys.stderr)
          sys.exit(1)
      except Exception as e:
          print(f"CRITICAL: Failed to connect to Consul at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      critical_count = len(checks) if isinstance(checks, list) else 0
      critical_details = [
          {
              "service": c.get("ServiceName"),
              "service_id": c.get("ServiceID"),
              "check_id": c.get("CheckID"),
              "output": c.get("Output"),
              "node": c.get("Node")
          }
          for c in (checks[:10] if isinstance(checks, list) else [])
      ]

      Kestra.outputs({
          "critical_count": critical_count,
          "critical_details": critical_details
      })

  - id: evaluate_service_health
    type: io.kestra.plugin.core.flow.If
    description: Alert SRE team if critical service checks exceed threshold
    condition: "{{ outputs.query_critical_services.vars.critical_count > inputs.critical_service_threshold }}"
    then:
      - id: notify_sre_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 HashiCorp Consul Service Health Check Critical Alert",
                "text": "Detected *{{ outputs.query_critical_services.vars.critical_count }}* service check(s) in *CRITICAL* status exceeding threshold *{{ inputs.critical_service_threshold }}*. Impact: Consul service catalog will deregister or omit these instances from DNS / service mesh routing, causing traffic drops.",
                "footer": "Kestra Service Mesh Sentinel • Consul Health"
              }
            ]
          }

outputs:
  - id: critical_count
    type: INT
    value: "{{ outputs.query_critical_services.vars.critical_count }}"
  - id: critical_details
    type: JSON
    value: "{{ outputs.query_critical_services.vars.critical_details }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Consul Health Sentinel Execution Error",
            "text": "The Consul health check query workflow failed on execution `{{ execution.id }}`. Please verify Consul HTTP address, token ACLs, and network connectivity.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Audits HashiCorp Consul health checks to detect critical service failures and impending catalog deregistration.
  metaTitle: HashiCorp Consul Service Health Check Failure and Deregistration Sentinel with Kestra
  title: HashiCorp Consul Service Health Check Failure and Deregistration Sentinel
  shortDescription: Audits HashiCorp Consul health checks to detect critical service failures and impending catalog deregistration.
  description: |
    ## How it works
    This workflow connects to the HashiCorp Consul HTTP API (`/v1/health/state/critical`) to audit all registered services and check statuses across the cluster. When services fail consecutive health checks, Consul automatically deregisters them or marks them unhealthy in DNS and Envoy service mesh upstreams. If critical failures exceed the configured threshold, an automated incident alert is dispatched to Slack.

    ## What you get
    - Real-time detection of failing microservices registered in Consul service discovery.
    - Prevents sudden traffic blackholing caused by cascading health check failures.
    - Comprehensive diagnostics including service ID, node name, and check failure output.

    ## Who it's for
    - SREs and Infrastructure Engineers operating HashiCorp Consul clusters.
    - Distributed systems developers relying on Consul for dynamic routing.

    ## Prerequisites
    - HashiCorp Consul cluster with HTTP API access.
    - Secrets `CONSUL_HTTP_TOKEN` and `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
