id: hashicorp-consul-service-deregistration-sentinel
namespace: company.sre

inputs:
  - id: consul_addr
    type: STRING
    defaults: "http://consul.internal:8500"
    description: Consul agent or server HTTP address.
  - id: critical_service_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of services in critical health check failure status.

tasks:
  - id: query_critical_services
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s -H "X-Consul-Token: {{ secret('CONSUL_HTTP_TOKEN') }}"           "{{ inputs.consul_addr }}/v1/health/state/critical" > /tmp/critical_checks.json
        
        CRITICAL_COUNT=$(jq 'length' /tmp/critical_checks.json)
        CRITICAL_DETAILS=$(jq -c '[.[] | {service: .ServiceName, service_id: .ServiceID, check_id: .CheckID, output: .Output, node: .Node}] | .[0:10]' /tmp/critical_checks.json)
        
        echo "::set-output name=critical_count::$CRITICAL_COUNT::"
        echo "::set-output name=critical_details::$CRITICAL_DETAILS::"

  - id: evaluate_service_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_critical_services.vars.critical_count | int > inputs.critical_service_threshold }}"
    then:
      - id: notify_sre_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 HashiCorp Consul Service Health Check Critical Alert",
                "text": "Detected *{{ outputs.query_critical_services.vars.critical_count }}* service check(s) in *CRITICAL* status exceeding threshold *{{ inputs.critical_service_threshold }}*. Critical services: {{ outputs.query_critical_services.vars.critical_details }}. Impact: Consul service catalog will deregister or omit these instances from DNS / service mesh routing, causing traffic drops.",
                "footer": "Kestra Service Mesh Sentinel • Consul Health"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Consul Health Sentinel Execution Error",
            "text": "The Consul health check query workflow failed. Please verify Consul HTTP address, token ACLs, and network connectivity.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits HashiCorp Consul health checks to detect critical service failures and impending catalog deregistration."
  metaTitle: HashiCorp Consul Service Health Check Failure and Deregistration Sentinel with Kestra
  title: HashiCorp Consul Service Health Check Failure and Deregistration Sentinel
  shortDescription: Audits HashiCorp Consul health checks to detect critical service failures and impending catalog deregistration.
  description: |
    ## How it works
    This workflow connects to the HashiCorp Consul HTTP API (`/v1/health/state/critical`) to audit all registered services and check statuses across the cluster. When services fail consecutive health checks, Consul automatically deregisters them or marks them unhealthy in DNS and Envoy service mesh upstreams. If critical failures exceed the configured threshold, an automated incident alert is dispatched to Slack.

    ## What you get
    - Real-time detection of failing microservices registered in Consul service discovery.
    - Prevents sudden traffic blackholing caused by cascading health check failures.
    - Comprehensive diagnostics including service ID, node name, and check failure output.

    ## Who it's for
    - SREs and Infrastructure Engineers operating HashiCorp Consul service discovery and service mesh clusters.
    - Distributed systems developers relying on Consul for dynamic load balancing and configuration.

    ## Why orchestrate this with Kestra
    - **Reliable Periodic Auditing**: Continuously poll service health status without maintaining external cron daemons.
    - **Multi-Datacenter Support**: Run across multiple Consul datacenters using dynamic parameters.
    - **Incident Orchestration**: Easily bridge service discovery health with Slack, PagerDuty, or remediation workflows.

    ## Prerequisites
    - HashiCorp Consul cluster with HTTP API access and an ACL token with `service:read` and `node:read` permissions.
    - Secrets `CONSUL_HTTP_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Configure the Consul address and secret tokens.
    3. Execute the workflow to audit current service health across your Consul catalog.

    ## How to extend
    - Add an automated remediation step to restart unhealthy systemd services or Docker containers on target nodes.
    - Correlate Consul health check failures with Nomad or Kubernetes pod states.

    ## Links
    - [HashiCorp Consul Health HTTP API Documentation](https://developer.hashicorp.com/consul/api-docs/health#list-checks-in-state)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  demo: false
