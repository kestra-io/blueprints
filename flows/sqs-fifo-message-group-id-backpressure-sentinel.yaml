id: sqs-fifo-message-group-id-backpressure-sentinel
namespace: company.messaging

description: |
  Audits Amazon SQS FIFO queues to detect stuck MessageGroupId partitions where poison messages
  block subsequent sequential events, dispatching diagnostic incident alerts to messaging operations teams.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: us-east-1
    description: AWS region where Amazon SQS FIFO queues and dead-letter queues are deployed.

  - id: queue_name_filter
    type: STRING
    displayName: Queue Name Filter
    defaults: all
    description: Name or substring filter of FIFO queues to inspect (.fifo), or all to scan all regional FIFO queues.

  - id: max_backlog_threshold
    type: INT
    displayName: Max Backlog Threshold
    defaults: 100
    description: Maximum allowable visible messages in a FIFO queue before flagging partition backpressure.

  - id: alert_on_backpressure
    type: BOOL
    displayName: Alert on Backpressure
    defaults: true
    description: Whether to dispatch automated Slack incident notifications when FIFO queue backpressure is detected.

tasks:
  - id: inspect_fifo_message_groups
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Amazon SQS FIFO queue attributes and samples messages to detect stuck MessageGroupId partitions.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
    script: |
      import os
      import json
      import boto3
      from kestra import Kestra

      region = os.environ.get("AWS_DEFAULT_REGION", "us-east-1")
      queue_filter = "{{ inputs.queue_name_filter }}".strip().lower()
      backlog_threshold = int("{{ inputs.max_backlog_threshold }}")

      sqs_client = boto3.client("sqs", region_name=region)

      queues_audited = 0
      stalled_queues = []

      # List all queues
      response = sqs_client.list_queues()
      queue_urls = response.get("QueueUrls", [])

      for q_url in queue_urls:
          # Filter for FIFO queues (.fifo)
          if not q_url.endswith(".fifo"):
              continue

          queue_name = q_url.split("/")[-1]

          if queue_filter != "all" and queue_filter not in queue_name.lower():
              continue

          queues_audited += 1

          try:
              # Retrieve queue attributes
              attrs = sqs_client.get_queue_attributes(
                  QueueUrl=q_url,
                  AttributeNames=[
                      "ApproximateNumberOfMessages",
                      "ApproximateNumberOfMessagesNotVisible",
                      "ApproximateNumberOfMessagesDelayed",
                      "RedrivePolicy"
                  ]
              ).get("Attributes", {})

              visible_count = int(attrs.get("ApproximateNumberOfMessages", 0))
              inflight_count = int(attrs.get("ApproximateNumberOfMessagesNotVisible", 0))
              redrive_policy = attrs.get("RedrivePolicy", "None")

              # Sample messages to identify top stalled MessageGroupIds
              stalled_groups = {}
              if visible_count > 0:
                  sample_resp = sqs_client.receive_message(
                      QueueUrl=q_url,
                      MaxNumberOfMessages=10,
                      VisibilityTimeout=1,
                      AttributeNames=["MessageGroupId", "ApproximateReceiveCount"]
                  )
                  for msg in sample_resp.get("Messages", []):
                      msg_attrs = msg.get("Attributes", {})
                      group_id = msg_attrs.get("MessageGroupId", "unknown")
                      receive_count = int(msg_attrs.get("ApproximateReceiveCount", 1))

                      if group_id not in stalled_groups:
                          stalled_groups[group_id] = {"count": 0, "max_receive_count": 0}
                      stalled_groups[group_id]["count"] += 1
                      stalled_groups[group_id]["max_receive_count"] = max(stalled_groups[group_id]["max_receive_count"], receive_count)

              if visible_count >= backlog_threshold or any(g["max_receive_count"] >= 3 for g in stalled_groups.values()):
                  stalled_queues.append({
                      "queue_name": queue_name,
                      "queue_url": q_url,
                      "visible_messages": visible_count,
                      "in_flight_messages": inflight_count,
                      "has_dlq_configured": redrive_policy != "None",
                      "stalled_group_ids": stalled_groups,
                      "remediation": f"aws sqs get-queue-attributes --queue-url {q_url} --attribute-names All"
                  })
          except Exception as e:
              print(f"Error inspecting FIFO queue {queue_name}: {e}")

      Kestra.outputs({
          "total_queues_audited": queues_audited,
          "stalled_queues_count": len(stalled_queues),
          "has_stalled_queues": len(stalled_queues) > 0,
          "stalled_queues_details": json.dumps(stalled_queues)
      })

  - id: check_group_backpressure
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether SQS FIFO queues experienced partition message backpressure or poison messages.
    condition: "{{ outputs.inspect_fifo_message_groups.vars.has_stalled_queues and inputs.alert_on_backpressure }}"
    then:
      - id: notify_slack_messaging
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident notifications to Slack with stuck MessageGroupIds and backpressure counts.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#messaging-alerts",
            "username": "SQS-FIFO-Sentinel",
            "text": "CRITICAL: Amazon SQS FIFO message group backpressure detected in region `{{ inputs.aws_region }}`. Total FIFO queues audited: `{{ outputs.inspect_fifo_message_groups.vars.total_queues_audited }}`, Stalled queues: `{{ outputs.inspect_fifo_message_groups.vars.stalled_queues_count }}`."
          }

  - id: log_fifo_queue_health
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of SQS FIFO queue partition backpressure evaluations.
    message: "SQS FIFO audit completed for region '{{ inputs.aws_region }}'. Total FIFO queues: {{ outputs.inspect_fifo_message_groups.vars.total_queues_audited }}, Stalled: {{ outputs.inspect_fifo_message_groups.vars.stalled_queues_count }}."

  - id: export_fifo_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of SQS FIFO queue health, message group counts, and DLQ configurations.
    format:
      region: "{{ inputs.aws_region }}"
      queue_name_filter: "{{ inputs.queue_name_filter }}"
      total_queues_audited: "{{ outputs.inspect_fifo_message_groups.vars.total_queues_audited }}"
      stalled_queues_count: "{{ outputs.inspect_fifo_message_groups.vars.stalled_queues_count }}"
      details: "{{ outputs.inspect_fifo_message_groups.vars.stalled_queues_details }}"

triggers:
  - id: scheduled_sqs_fifo_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing SQS FIFO queues every 20 minutes.
    cron: "*/20 * * * *"

extend:
  title: SQS FIFO Message Group ID Backpressure Sentinel
  metaTitle: SQS FIFO Message Group ID Backpressure Sentinel Blueprint
  shortDescription: Audits Amazon SQS FIFO queues to detect stuck MessageGroupId partitions where poison messages block sequential events.
  metaDescription: Audits Amazon SQS FIFO queues to detect stuck MessageGroupId partitions where poison messages block events, dispatching incident alerts to messaging ops.
  description: |
    Amazon SQS First-In-First-Out (FIFO) queues ensure strict message ordering and exactly-once processing scoped per `MessageGroupId`. When a consumer encounters an unhandled runtime error, deserialization exception, or schema incompatibility while processing an event within a specific message group, that message returns to the queue. Because FIFO queues guarantee order within a group, all subsequent valid messages belonging to the same `MessageGroupId` are completely blocked until the offending poison message is successfully consumed or redriven to a Dead-Letter Queue (DLQ). This sentinel continuously audits Amazon SQS FIFO queues across regional environments, identifies stalled message group partitions and elevated receive counts, and notifies messaging operations teams on Slack before end-to-end event pipelines freeze.

    ## How it works
    1. **Scheduled triggering**: Executes every 20 minutes via automated cron trigger (`*/20 * * * *`) or triggers on-demand via manual execution.
    2. **FIFO queue discovery**: Queries the Amazon SQS API (`list_queues`) and filters strictly for queues ending in the `.fifo` suffix.
    3. **Attribute inspection**: Pulls `ApproximateNumberOfMessages`, `ApproximateNumberOfMessagesNotVisible`, and `RedrivePolicy` metadata.
    4. **Message sampling and group isolation**: Samples active messages using `receive_message` to extract `MessageGroupId` and inspect `ApproximateReceiveCount`.
    5. **Backpressure evaluation**: Flags queues where visible message backlogs exceed `max_backlog_threshold` or where receive counts indicate poison-pill retries.
    6. **Conditional escalation**: An `io.kestra.plugin.core.flow.If` task verifies if any FIFO queue exhibits partition backpressure.
    7. **Slack incident dispatch**: Emits structured incident cards to the `#messaging-alerts` channel detailing queue URLs, stuck group IDs, retry counts, and DLQ redrive status.
    8. **Audit trail logging and return**: Logs operational telemetry and returns a diagnostic JSON manifest for messaging platform engineers.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_sqs_fifo_audit Schedule Trigger] --> B[inspect_fifo_message_groups Python Script]
      B --> C[check_group_backpressure Flowable If]
      C -- Backpressure Detected --> D[notify_slack_messaging Webhook]
      C -- All Queues Flowing --> E[log_fifo_queue_health Log]
      D --> E
      E --> F[export_fifo_manifest Return]
    ```

    ## Use cases
    - **Poison message isolation**: Detect single unparseable messages that block thousands of subsequent customer events within a specific account ID or tenant group.
    - **Dead-letter queue redrive verification**: Identify FIFO queues lacking redrive policies that cause poison messages to loop indefinitely.
    - **E-commerce order pipeline reliability**: Ensure order processing pipelines maintain uninterrupted message throughput during high-volume sales events.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | `STRING` | `us-east-1` | AWS region where Amazon SQS FIFO queues and dead-letter queues are deployed. |
    | `queue_name_filter` | `STRING` | `all` | Name or substring filter of FIFO queues to inspect (.fifo), or all to scan all regional FIFO queues. |
    | `max_backlog_threshold` | `INT` | `100` | Maximum allowable visible messages in a FIFO queue before flagging partition backpressure. |
    | `alert_on_backpressure` | `BOOL` | `true` | Whether to dispatch automated Slack incident notifications when FIFO queue backpressure is detected. |

    ## Expected outputs
    - `{{ outputs.inspect_fifo_message_groups.vars.total_queues_audited }}`: Number of SQS FIFO queues evaluated during the audit.
    - `{{ outputs.inspect_fifo_message_groups.vars.stalled_queues_count }}`: Number of FIFO queues with message backpressure or poison message loops.
    - `{{ outputs.inspect_fifo_message_groups.vars.stalled_queues_details }}`: Serialized JSON array of stalled queues with exact MessageGroupId breakdowns.
    - `{{ outputs.export_fifo_manifest.value }}`: Structured dictionary containing the consolidated messaging health report.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to AWS SQS endpoints.
    - AWS IAM credentials configured with `sqs:ListQueues`, `sqs:GetQueueAttributes`, and `sqs:ReceiveMessage` permissions.
    - Slack incoming webhook endpoint configured for messaging operational alerting.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: AWS IAM access key with permissions to read SQS queue attributes and sample messages.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret key corresponding to the access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch messaging alerts.

    ## Quick start
    1. Define `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra Secret storage.
    2. Import this workflow into your Kestra instance under the `company.messaging` namespace.
    3. Configure `aws_region` and `queue_name_filter` to target your production FIFO queues.
    4. Run a manual execution to test queue discovery and verify Slack notification delivery.

    ## Common pitfalls and troubleshooting
    - **Sampling visibility timeout**: When sampling messages, use a short `VisibilityTimeout` (e.g. 1 second) so sampled messages immediately return to the queue for active consumers.
    - **Throughput quotas**: Standard SQS FIFO queues support up to 3,000 messages per second with high-throughput mode enabled; ensure high-throughput mode is enabled if high volume is required.
    - **Consumer parallelism**: FIFO queues only process one consumer per `MessageGroupId` concurrently; ensure diverse message group IDs are assigned to leverage consumer scaling.

    ## How to extend
    - **Automated DLQ message purge**: Add an automated action to redrive poison messages to a quarantine inspection queue after manual engineering approval.
    - **Jira ticket creation**: Automatically file a bug ticket in Jira detailing the offending message group ID and payload attributes.
    - **Consumer auto-recovery**: Restart Kubernetes consumer pods when unacknowledged inflight message counts exceed thresholds.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Amazon SQS FIFO Queues Developer Guide](https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues.html)
    - [Boto3 SQS Client Reference](https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/sqs.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
