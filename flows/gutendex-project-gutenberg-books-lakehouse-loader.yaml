id: gutendex-project-gutenberg-books-lakehouse-loader
namespace: company.analytics
description: Ingests open-domain literary works, author bibliographies, and download metrics from Project Gutenberg via Gutendex API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: gutendex-project-gutenberg-books-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://gutendex.com/books/"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "results"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for item in items:
            bid = str(item.get('id', 'UNKNOWN'))
            current_ids.append(bid)
            authors = item.get('authors', [])
            primary_author = authors[0].get('name', 'Anonymous') if authors else 'Anonymous'
            subjects = item.get('subjects', [])
            primary_subject = subjects[0] if subjects else 'General'
            try:
                downloads = int(item.get('download_count', 0))
            except Exception:
                downloads = 0

            records.append({
                'book_id': bid,
                'title': str(item.get('title', 'Untitled')),
                'primary_author': str(primary_author),
                'primary_subject': str(primary_subject),
                'download_count': downloads,
                'is_new': bool(bid not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE gutenberg_books (
                book_id VARCHAR,
                title VARCHAR,
                primary_author VARCHAR,
                primary_subject VARCHAR,
                download_count BIGINT,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO gutenberg_books SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY gutenberg_books TO 'gutenberg_books.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    primary_subject,
                    COUNT(*) AS book_count,
                    SUM(download_count) AS total_downloads
                FROM gutenberg_books
                GROUP BY 1
                ORDER BY total_downloads DESC
            ) TO 'books_summary_by_subject.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM gutenberg_books WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM gutenberg_books").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - gutenberg_books.parquet
      - books_summary_by_subject.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['gutenberg_books.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "Project Gutenberg Literary Catalog sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
