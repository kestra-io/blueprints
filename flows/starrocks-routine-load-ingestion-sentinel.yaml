id: starrocks-routine-load-ingestion-sentinel
namespace: company.data

inputs:
  - id: jdbc_url
    type: STRING
    description: JDBC connection URL for the StarRocks Frontend (FE) query port (default 9030)
    defaults: "jdbc:mysql://starrocks-fe:9030/"

  - id: auto_resume
    type: BOOL
    description: Whether to automatically issue RESUME ROUTINE LOAD for paused jobs when safe
    defaults: false

  - id: dry_run
    type: BOOL
    description: When true, audits and logs remediation actions without issuing RESUME commands
    defaults: true

  - id: slack_channel
    type: STRING
    description: Slack notification channel for operational alerts and audit reports
    defaults: "#data-ops"

triggers:
  - id: every_fifteen_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_routine_loads
    type: io.kestra.plugin.jdbc.mysql.Query
    description: Queries StarRocks system schema to audit the operational status of all streaming Routine Load jobs
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('STARROCKS_USERNAME') }}"
    password: "{{ secret('STARROCKS_PASSWORD') }}"
    fetchType: FETCH
    allowFailure: true
    sql: |
      SELECT
        COALESCE(NAME, '') AS job_name,
        COALESCE(DB_NAME, '') AS db_name,
        COALESCE(TABLE_NAME, '') AS table_name,
        COALESCE(STATE, 'UNKNOWN') AS job_state,
        COALESCE(CURRENT_TASK_NUM, 0) AS current_tasks,
        COALESCE(REASONS_OF_STATE_CHANGED, '') AS pause_reason,
        COALESCE(ERROR_LOG_URLS, '') AS error_log_url
      FROM information_schema.routine_load_jobs
      WHERE STATE IN ('PAUSED', 'UNSTABLE', 'CANCELLED');

  - id: classify_status
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates probe results into standardized operational health tiers
    format: |
      {% if outputs.probe_routine_loads.rows is null %}
      PROBE_FAILED
      {% elseif outputs.probe_routine_loads.rows | length == 0 %}
      HEALTHY
      {% else %}
        {% set has_critical = false %}
        {% for row in outputs.probe_routine_loads.rows %}
          {% if row.job_state == 'PAUSED' or row.job_state == 'CANCELLED' %}
            {% set has_critical = true %}
          {% endif %}
        {% endfor %}
        {% if has_critical %}
        CRITICAL
        {% else %}
        WARNING
        {% endif %}
      {% endif %}

  - id: route_by_status
    type: io.kestra.plugin.core.flow.Switch
    description: Routes execution based on classified health state
    value: "{{ outputs.classify_status.value | trim }}"
    cases:
      CRITICAL:
        - id: alert_critical_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatches high-urgency alert to Slack with stalled Routine Load jobs and error reasons
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "🚨 *STARROCKS ROUTINE LOAD INGESTION ALERT*\n*Status:* `CRITICAL`\n*Target FE:* `{{ inputs.jdbc_url }}`\n*Stalled Routine Loads:* `{{ outputs.probe_routine_loads.rows | length }}`\n*Auto-Resume Enabled:* `{{ inputs.auto_resume }}` (Dry-Run: `{{ inputs.dry_run }}`)\n*Details:* Stalled ingestion jobs detected in StarRocks. Consumer lag is accumulating.\n*Execution ID:* `{{ execution.id }}`"
            }

        - id: check_remediation
          type: io.kestra.plugin.core.flow.If
          description: Evaluates whether automated resumption is enabled and permitted
          condition: "{{ inputs.auto_resume == true and inputs.dry_run == false }}"
          then:
            - id: resume_stalled_jobs
              type: io.kestra.plugin.core.flow.Loop
              description: Iterates through each stalled job and issues RESUME ROUTINE LOAD
              values: "{{ outputs.probe_routine_loads.rows }}"
              tasks:
                - id: resume_single_job
                  type: io.kestra.plugin.jdbc.mysql.Query
                  description: Resumes execution of the paused Routine Load job
                  url: "{{ inputs.jdbc_url }}"
                  username: "{{ secret('STARROCKS_USERNAME') }}"
                  password: "{{ secret('STARROCKS_PASSWORD') }}"
                  fetchType: NONE
                  sql: "RESUME ROUTINE LOAD FOR `{{ item.value.db_name }}`.`{{ item.value.job_name }}`;"

            - id: log_remediation_success
              type: io.kestra.plugin.core.log.Log
              message: "Successfully issued RESUME ROUTINE LOAD commands for {{ outputs.probe_routine_loads.rows | length }} stalled job(s)."
          else:
            - id: log_remediation_skipped
              type: io.kestra.plugin.core.log.Log
              message: "Auto-remediation skipped (auto_resume={{ inputs.auto_resume }}, dry_run={{ inputs.dry_run }}). {{ outputs.probe_routine_loads.rows | length }} job(s) remain in stalled state."

      WARNING:
        - id: alert_warning_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatches warning alert for unstable streaming load tasks
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "⚠️ *STARROCKS ROUTINE LOAD WARNING*\n*Status:* `WARNING`\n*Target FE:* `{{ inputs.jdbc_url }}`\n*Unstable Routine Loads:* `{{ outputs.probe_routine_loads.rows | length }}`\n*Execution ID:* `{{ execution.id }}`"
            }

      PROBE_FAILED:
        - id: alert_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Alerts SRE team when connectivity to StarRocks FE fails
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "🔥 *STARROCKS PROBE FAILURE*\n*Status:* `PROBE_FAILED`\n*Target FE:* `{{ inputs.jdbc_url }}`\n*Error:* Sentinel was unable to connect to StarRocks FE or execute metadata query.\n*Execution ID:* `{{ execution.id }}`"
            }

      HEALTHY:
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "All StarRocks Routine Load jobs are operating nominally. Zero paused or stalled jobs detected."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Emits final audit record documenting the diagnostic execution
    message: "StarRocks sentinel completed. Status: {{ outputs.classify_status.value | trim }} | Stalled Jobs: {{ outputs.probe_routine_loads.rows | length if outputs.probe_routine_loads.rows is not null else 0 }} | Execution: {{ execution.id }}"

errors:
  - id: alert_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Intercepts unhandled flow execution failures
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "💥 *STARROCKS SENTINEL EXECUTION CRASH*\n*Flow ID:* `{{ flow.id }}`\n*Execution ID:* `{{ execution.id }}`\n*Namespace:* `{{ flow.namespace }}`\n*Error:* An unexpected system failure halted Sentinel execution."
      }

extend:
  title: StarRocks Routine Load Ingestion Stall & Auto-Resume Sentinel
  metaTitle: StarRocks Routine Load Ingestion Stall Sentinel | Kestra
  shortDescription: Audits StarRocks Routine Load jobs for paused or stalled ingestion states and triggers guarded auto-recovery or Slack alerts.
  metaDescription: Audit StarRocks Routine Load ingestion states for paused tasks, route failure alerts to Slack, and safely auto-resume stalled streaming pipelines.
  description: |
    StarRocks is a high-performance distributed real-time analytical database widely used for sub-second OLAP queries over massive datasets. Routine Load is StarRocks native continuous ingestion mechanism for streaming platforms like Apache Kafka and Apache Pulsar. Under production workloads, transient data quality anomalies, unparseable payloads exceeding error thresholds, or network partitions cause StarRocks to transition Routine Load jobs into a PAUSED state. Once paused, consumption halts entirely, consumer lag compounds silently, and analytical dashboards drift out of sync until manual administrative intervention occurs. This blueprint provides an automated sentinel that continuously audits Routine Load health, alerts engineering teams before SLAs breach, and executes safe, guarded auto-resumption when enabled.

    ## How it works

    1. Scheduled trigger (`every_fifteen_minutes`) initiates the diagnostic workflow every 15 minutes, with manual on-demand execution supported via inputs.
    2. Probe task (`probe_routine_loads`) connects to the StarRocks Frontend (FE) query port via the MySQL protocol (`io.kestra.plugin.jdbc.mysql.Query`) and inspects `information_schema.routine_load_jobs` for jobs in `PAUSED`, `UNSTABLE`, or `CANCELLED` states.
    3. Classification step (`classify_status`) evaluates the query results using Pebble conditionals, grouping the operational state into `HEALTHY`, `WARNING`, `CRITICAL`, or `PROBE_FAILED`.
    4. Flow router (`route_by_status`) switches downstream execution based on the classified health tier.
    5. On `CRITICAL` state, `alert_critical_slack` dispatches an incident notification to the configured Slack channel with detailed error reasons and job identifiers.
    6. Guarded remediation (`check_remediation`) checks whether `auto_resume` is enabled and `dry_run` is disabled. If confirmed, `resume_stalled_jobs` iterates over affected jobs and executes `RESUME ROUTINE LOAD FOR db.job` via MySQL query tasks.
    7. On `PROBE_FAILED` or unexpected errors, dedicated Slack alerting tasks notify administrators of infrastructure connectivity loss.
    8. Final audit task (`log_audit_summary`) outputs a structured execution record detailing the evaluated status, job count, and execution lineage.

    ## What you get

    - Automated continuous detection of paused, stalled, or cancelled streaming ingestion pipelines across all StarRocks databases.
    - Incident alerts delivered to Slack with exact database, table, job names, and root-cause state change reasons.
    - Safe, guarded auto-remediation that resumes transiently stalled Routine Loads while strictly honoring dry-run safeguards.
    - Hardened execution handling with flow-level error traps preventing silent monitoring failures.
    - Immutable execution logs in Kestra providing historical audit trails of all ingestion stalls and recovery events.

    ## Who it's for

    - Data Platform Engineers operating mission-critical StarRocks analytical warehouses.
    - Streaming & Real-time Analytics Teams managing high-throughput Kafka-to-StarRocks pipelines.
    - Site Reliability Engineers (SREs) enforcing data freshness SLAs and ingestion uptime.

    ## Why orchestrate this with Kestra

    - Declarative YAML specification eliminates ad-hoc shell scripts, unmonitored crontabs, and unversioned database maintenance routines.
    - Native MySQL JDBC plugin connectivity eliminates custom Python worker container dependencies and credentials leakage.
    - Built-in conditional flow routing seamlessly separates observation, alerting, dry-run validation, and remediation into auditable stages.
    - Centralized credential handling keeps database passwords securely masked in execution logs and UI traces.
    - Full execution timeline and state history provide complete visibility into pipeline drift and resolution history.

    ## Prerequisites

    - StarRocks cluster (v2.5+ or v3.0+) accessible over MySQL client protocol (default port 9030 on FE node).
    - Database user with `SELECT` privilege on `information_schema.routine_load_jobs` and `INSERT` privilege on target tables for `RESUME ROUTINE LOAD`.
    - Slack incoming webhook URL for notifications.

    ### Secrets

    - `STARROCKS_USERNAME`: Username for authenticating to the StarRocks FE MySQL query port.
    - `STARROCKS_PASSWORD`: Password for the StarRocks database user.
    - `SLACK_WEBHOOK_URL`: HTTPS incoming webhook URL for the target Slack channel.

    ## Quick start

    1. Configure `STARROCKS_USERNAME`, `STARROCKS_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Deploy this flow to your Kestra instance and execute an initial manual run with `dry_run: true` to verify connectivity against your StarRocks Frontend.
    3. Review the execution logs in the Kestra UI to confirm Routine Load jobs are queried successfully.
    4. Enable the `every_fifteen_minutes` schedule trigger to establish continuous automated monitoring.

    ## How to extend

    - Add Kafka consumer group lag checks via `io.kestra.plugin.kafka` to correlate Routine Load pauses with upstream partition backlogs.
    - Integrate PagerDuty alerting via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for high-priority production warehouse outages.
    - Attach downstream dbt or materialized view refresh triggers once ingestion recovery is confirmed.

    ## Links

    - [StarRocks Routine Load Documentation](https://docs.starrocks.io/docs/loading/RoutineLoad/)
    - [StarRocks System Schema Reference](https://docs.starrocks.io/docs/administration/information_schema/)
    - [Kestra MySQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
