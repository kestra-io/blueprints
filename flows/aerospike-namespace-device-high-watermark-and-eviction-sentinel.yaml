id: aerospike-namespace-device-high-watermark-and-eviction-sentinel
namespace: company.team

description: |
  Monitors Aerospike database telemetry to detect namespace storage device high-watermark breaches, record evictions, and stop-write risk.

concurrency:
  limit: 1

inputs:
  - id: aerospike_metrics_url
    type: STRING
    displayName: "Aerospike Exporter Metrics URL"
    defaults: "http://aerospike-exporter.database.svc.cluster.local:9145"
    description: "Base HTTP URL exposing Prometheus metrics for the Aerospike real-time NoSQL database."

  - id: namespace_name
    type: STRING
    displayName: "Aerospike Namespace"
    defaults: "user_sessions_cache"
    description: "Aerospike storage namespace under active device saturation and eviction surveillance."

  - id: max_used_bytes_percent_threshold
    type: INT
    displayName: "Max Disk Used (%) Threshold"
    defaults: 85
    description: "Maximum allowable namespace device disk saturation percentage before triggering eviction alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which namespace device usage and eviction rates are evaluated."

  - id: alert_on_high_watermark
    type: BOOL
    displayName: "Alert On High Watermark"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting high-watermark disk saturation or active evictions."

tasks:
  - id: scan_aerospike_namespace_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Aerospike Prometheus metrics to calculate namespace disk usage percent, eviction counts, and stop-write flags.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.aerospike_metrics_url }}"
      NAMESPACE: "{{ inputs.namespace_name }}"
      MAX_USAGE: "{{ inputs.max_used_bytes_percent_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      import json
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://aerospike-exporter:9145").rstrip("/")
      ns_name = os.environ.get("NAMESPACE", "cache")
      max_usage = int(os.environ.get("MAX_USAGE", "85"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      used_bytes_pct = 0.0
      evictions_count = 0
      stop_writes = False
      total_records = 0

      try:
          resp = requests.get(f"{metrics_url}/metrics", timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "aerospike_namespace_device_used_bytes_pct" in line and f'namespace="{ns_name}"' in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      used_bytes_pct = float(match.group(1))
              elif "aerospike_namespace_evicted_records_total" in line and f'namespace="{ns_name}"' in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      evictions_count += int(float(match.group(1)))
              elif "aerospike_namespace_stop_writes" in line and f'namespace="{ns_name}"' in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match and float(match.group(1)) > 0:
                      stop_writes = True
              elif "aerospike_namespace_master_objects" in line and f'namespace="{ns_name}"' in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      total_records += int(float(match.group(1)))
      except Exception as err:
          print(f"CRITICAL: Failed to query Aerospike exporter at {metrics_url}: {err}", file=sys.stderr)
          sys.exit(1)

      is_breached = bool(used_bytes_pct >= max_usage or evictions_count > 1000 or stop_writes)
      now_iso = datetime.now(timezone.utc).isoformat()

      report = {
          "namespace": ns_name,
          "device_used_pct": round(used_bytes_pct, 2),
          "evictions_count": evictions_count,
          "stop_writes": stop_writes,
          "total_master_records": total_records,
          "is_alerting": is_breached,
          "timestamp": now_iso
      }

      with open("aerospike_metrics_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Aerospike Complete: NS={ns_name}, DiskUsed={used_bytes_pct}%, Evictions={evictions_count}, StopWrites={stop_writes}, Alert={is_breached}")

      Kestra.outputs({
          "namespace_device_used_percent": round(used_bytes_pct, 2),
          "evicted_records_count": evictions_count,
          "is_stop_writes_active": stop_writes,
          "total_master_records": total_records,
          "is_alerting": is_breached,
          "namespace_target": ns_name,
          "audit_timestamp": now_iso
      })
    outputFiles:
      - aerospike_metrics_report.json

  - id: evaluate_watermark_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether observed Aerospike namespace usage or eviction count exceeds operational tolerance bounds.
    condition: "{{ outputs.scan_aerospike_namespace_metrics.vars.is_alerting and inputs.alert_on_high_watermark }}"
    then:
      - id: notify_slack_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident card to SRE team Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#sre-alerts",
            "username": "Aerospike-Sentinel",
            "text": "CRITICAL: Aerospike Namespace Storage High-Watermark Breached for `{{ inputs.namespace_name }}`! Used: `{{ outputs.scan_aerospike_namespace_metrics.vars.namespace_device_used_percent }}%`, Evictions: `{{ outputs.scan_aerospike_namespace_metrics.vars.evicted_records_count }}`, Stop-writes active: `{{ outputs.scan_aerospike_namespace_metrics.vars.is_stop_writes_active }}`."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#sre-alerts",
        "username": "Aerospike-Sentinel",
        "text": "CRITICAL: Aerospike Namespace Sentinel execution failed on `{{ inputs.aerospike_metrics_url }}`. Execution ID: `{{ execution.id }}`."
      }

triggers:
  - id: periodic_aerospike_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing Aerospike namespace usage every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: Aerospike Namespace Device High-Watermark and Eviction Sentinel
  metaTitle: Aerospike Namespace Device High-Watermark Sentinel Blueprint
  shortDescription: Audits Aerospike Prometheus metrics to detect namespace disk high-watermark breaches and stop-write flags.
  metaDescription: Audits Aerospike database telemetry to detect namespace storage device high-watermark breaches, record evictions, and stop-write risk.
  description: |
    ## How it works
    Aerospike clusters use high-watermark disk utilization thresholds to trigger TTL-based and LRU evictions before storage devices fill up. If disk saturation reaches the stop-write limit, Aerospike enters read-only mode to prevent data corruption. This sentinel inspects the Aerospike Prometheus exporter endpoint, monitors disk usage percentage and eviction spikes, and alerts SRE teams on Slack.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_aerospike_audit Schedule Trigger] --> B[scan_aerospike_namespace_metrics Python Script]
      B --> C{Watermark Breached?}
      C -- Yes --> D[notify_slack_sre Webhook]
      C -- No --> E[Storage Nominal]
    ```

    ## Prerequisites
    - Aerospike Prometheus exporter endpoint accessible via HTTP.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `aerospike_metrics_url` and `namespace_name`.
    3. Run manually or enable the schedule trigger.

    ## Links
    - [Aerospike Prometheus Exporter](https://github.com/aerospike/aerospike-prometheus-exporter)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
    - Database
  ee: false
  demo: false
