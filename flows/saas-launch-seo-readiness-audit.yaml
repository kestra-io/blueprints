id: saas-launch-seo-readiness-audit
namespace: company.release

inputs:
  - id: target_url
    type: STRING
    defaults: https://example.com
    description: Public product homepage URL to audit before launch or after a production release.
  - id: min_score
    type: INT
    defaults: 75
    description: Minimum launch readiness score (0-100) required when fail_on_gate is enabled.
  - id: fail_on_gate
    type: BOOL
    defaults: false
    description: Fail the execution if critical launch checks fail or the score drops below min_score.

tasks:
  - id: normalize_url
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      TARGET_URL: '{{ inputs.target_url }}'
    script: |
      import json
      import os
      from urllib.parse import urlparse

      raw = os.environ['TARGET_URL'].strip()
      if not raw:
          raise ValueError('target_url must not be empty.')
      if not raw.startswith(('http://', 'https://')):
          raw = 'https://' + raw
      parsed = urlparse(raw)
      if parsed.scheme not in ('http', 'https') or not parsed.netloc:
          raise ValueError(f'Invalid target_url: {raw}')
      origin = f'{parsed.scheme}://{parsed.netloc}'
      print('::' + json.dumps({
          'outputs': {
              'target': raw,
              'origin': origin,
              'robots_url': f'{origin}/robots.txt',
              'sitemap_url': f'{origin}/sitemap.xml',
          }
      }) + '::')

  - id: run_checks
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: mcp_readiness
        type: io.kestra.plugin.core.http.Request
        allowFailure: true
        method: POST
        uri: https://saascity.io/api/mcp
        contentType: application/json
        headers:
          Accept: application/json, text/event-stream
          User-Agent: Kestra-Launch-Audit/1.0
        body: |
          {
            "jsonrpc": "2.0",
            "id": 1,
            "method": "tools/call",
            "params": {
              "name": "check_launch_readiness",
              "arguments": {
                "url": "{{ outputs.normalize_url.vars.target }}"
              }
            }
          }

      - id: robots_txt
        type: io.kestra.plugin.core.http.Request
        allowFailure: true
        method: GET
        uri: "{{ outputs.normalize_url.vars.robots_url }}"
        headers:
          User-Agent: Kestra-Launch-Audit/1.0

      - id: sitemap_xml
        type: io.kestra.plugin.core.http.Request
        allowFailure: true
        method: GET
        uri: "{{ outputs.normalize_url.vars.sitemap_url }}"
        headers:
          User-Agent: Kestra-Launch-Audit/1.0

  - id: compile_report
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    outputFiles:
      - audit.json
      - audit.md
    env:
      TARGET_URL: "{{ outputs.normalize_url.vars.target }}"
      MIN_SCORE: "{{ inputs.min_score }}"
      MCP_CODE: "{{ outputs.mcp_readiness.code ?? 0 }}"
      MCP_BODY: "{{ outputs.mcp_readiness.body ?? '' }}"
      ROBOTS_CODE: "{{ outputs.robots_txt.code ?? 0 }}"
      ROBOTS_BODY: "{{ outputs.robots_txt.body ?? '' }}"
      SITEMAP_CODE: "{{ outputs.sitemap_xml.code ?? 0 }}"
      SITEMAP_BODY: "{{ outputs.sitemap_xml.body ?? '' }}"
    script: |
      import json
      import os
      import re
      from datetime import datetime, timezone
      from pathlib import Path

      target_url = os.environ['TARGET_URL']
      min_score = int(os.environ['MIN_SCORE'])
      mcp_code = int(os.environ['MCP_CODE'] or 0)
      robots_code = int(os.environ['ROBOTS_CODE'] or 0)
      sitemap_code = int(os.environ['SITEMAP_CODE'] or 0)
      robots_body = os.environ.get('ROBOTS_BODY', '')
      sitemap_body = os.environ.get('SITEMAP_BODY', '')

      structured = {}
      mcp_raw = os.environ.get('MCP_BODY', '').strip()
      if mcp_code == 200 and mcp_raw:
          payload_str = mcp_raw
          if payload_str.startswith('event:') or '\ndata:' in payload_str:
              data_lines = [ln[5:].strip() for ln in payload_str.splitlines() if ln.startswith('data:')]
              payload_str = data_lines[-1] if data_lines else ''
          if payload_str:
              try:
                  rpc = json.loads(payload_str)
                  structured = (rpc.get('result') or {}).get('structuredContent') or {}
              except json.JSONDecodeError:
                  structured = {}

      # Direct RFC 9309 robots.txt global block check
      global_disallow = False
      if robots_code == 200:
          active_star = False
          for raw_line in robots_body.splitlines():
              line = raw_line.split('#', 1)[0].strip()
              if not line:
                  continue
              low = line.lower()
              if low.startswith('user-agent:'):
                  active_star = line.split(':', 1)[1].strip() == '*'
              elif active_star and low.startswith('disallow:'):
                  if line.split(':', 1)[1].strip() == '/':
                      global_disallow = True

      sitemap_valid = sitemap_code == 200 and bool(re.search(r'<(urlset|sitemapindex)\b', sitemap_body))
      score = structured.get('score')
      verdict = structured.get('verdict') or ('not_ready' if global_disallow or not sitemap_valid else 'almost_ready')
      checks = structured.get('checks') or []
      critical_fails = [c for c in checks if c.get('status') == 'fail' and c.get('critical')]

      gate_failed = (
          global_disallow
          or verdict == 'not_ready'
          or bool(critical_fails)
          or (isinstance(score, int) and score < min_score)
      )
      status = 'fail' if gate_failed else 'pass'

      report = {
          'observed_at': datetime.now(timezone.utc).isoformat(),
          'target_url': target_url,
          'status': status,
          'verdict': verdict,
          'score': score,
          'min_score': min_score,
          'mcp_http_status': mcp_code,
          'robots_http_status': robots_code,
          'robots_global_disallow': global_disallow,
          'sitemap_http_status': sitemap_code,
          'sitemap_valid_xml': sitemap_valid,
          'critical_failures': critical_fails,
          'checks': checks,
      }
      Path('audit.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')

      lines = [
          '# Pre-Launch SEO & Readiness Audit',
          '',
          f"- Target URL: `{target_url}`",
          f"- Gate status: `{status}` (verdict: `{verdict}`, score: `{score if score is not None else 'n/a'}/100`)",
          f"- `robots.txt`: HTTP `{robots_code}` (global `Disallow: /` regression: `{global_disallow}`)",
          f"- `sitemap.xml`: HTTP `{sitemap_code}` (valid XML root: `{sitemap_valid}`)",
          f"- Observed at: `{report['observed_at']}`",
          '',
          '## Findings',
          '',
      ]
      if checks:
          for c in checks:
              lines.append(f"- **[{str(c.get('status', '')).upper()}] {c.get('label', c.get('id', 'check'))}:** {c.get('detail', '')}")
      else:
          lines.append('- Remote readiness check returned no structured items; rely on direct robots.txt and sitemap.xml checks above.')
      Path('audit.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

      print('::' + json.dumps({'outputs': {'status': status, 'verdict': verdict, 'score': score if score is not None else -1}}) + '::')

  - id: enforce
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.fail_on_gate and outputs.compile_report.vars.status == 'fail' }}"
    then:
      - id: readiness_gate_failed
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Pre-launch readiness gate failed (verdict={{ outputs.compile_report.vars.verdict }}, score={{ outputs.compile_report.vars.score }}). Inspect compile_report output files."

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.compile_report.vars.status }}"
  - id: verdict
    type: STRING
    value: "{{ outputs.compile_report.vars.verdict }}"
  - id: audit_json
    type: FILE
    value: "{{ outputs.compile_report.outputFiles['audit.json'] }}"
  - id: audit_markdown
    type: FILE
    value: "{{ outputs.compile_report.outputFiles['audit.md'] }}"

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: '0 8 * * 1'
    disabled: true

extend:
  title: Audit a SaaS homepage for launch readiness, robots.txt, and sitemap regressions
  metaTitle: SaaS Pre-Launch SEO and Readiness Audit | Kestra
  shortDescription: Run parallel static-HTML launch readiness, robots.txt, and sitemap.xml checks and optionally fail release gates on SEO regressions.
  metaDescription: Orchestrate parallel pre-launch SEO audits (OG tags, canonicals, robots.txt Disallow regressions, and sitemap.xml validation) in Kestra and store JSON/Markdown evidence.
  description: |
    Verify that a production marketing site or SaaS homepage has not shipped an accidental `Disallow: /`, broken `sitemap.xml`, missing Open Graph image, or `noindex` meta tag before a launch or after a deploy.

    ## How it works

    1. Normalize the `target_url` input into origin, `/robots.txt`, and `/sitemap.xml` endpoints.
    2. Run three HTTP probes in parallel: a 16-point static HTML readiness audit via the keyless [SaaSCity MCP endpoint](https://saascity.io/mcp), a direct `/robots.txt` fetch, and a direct `/sitemap.xml` fetch.
    3. Compile timestamped JSON (`audit.json`) and Markdown (`audit.md`) reports in execution storage, flagging global `Disallow: /` rules, invalid sitemap XML, or critical HTML check failures.
    4. Optionally fail the execution when `fail_on_gate` is enabled and the site falls below `min_score` or reports critical blockers.

    ## What you get

    - Structured JSON and human-readable Markdown audit artifacts persisted per execution.
    - Protection against silent post-deploy SEO regressions (`noindex`, `Disallow: /`, missing `og:image`, broken canonicals, or empty SPA shells).
    - Reusable manual release gate plus a disabled weekly Monday 08:00 UTC schedule ready to enable.

    ## Who it's for

    Release engineers, indie founders, and growth engineering teams shipping public SaaS landing pages and documentation sites.

    ## Why orchestrate this with Kestra

    Fan out external HTTP checks in parallel, archive immutable evidence reports on every deploy or weekly schedule, and gate downstream launch notifications with a single declarative YAML flow.

    ## Prerequisites

    Kestra 2.0, the Python Script plugin, Python 3.10+ on the worker PATH, and outbound HTTPS access to your target domain and `saascity.io/api/mcp`.

    ### Secrets

    None. All HTTP endpoints used by this blueprint are public and keyless.

    ## Quick start

    1. Import this blueprint into Kestra (for raw YAML upload, remove the catalog-only `extend` block first).
    2. Execute with your production `target_url` and `fail_on_gate=false` to review the generated `audit.md` and `audit.json` output files.
    3. Set `fail_on_gate=true` and enable the `weekly_audit` schedule trigger once your baseline passes.

    ## How to extend

    Add a Slack, Discord, or email notification task inside the `enforce.then` branch so your team is alerted immediately when a deploy introduces a crawlability regression.

    ## Links

    - [Kestra HTTP Request plugin](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [Kestra Parallel flow task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.parallel)
    - [SaaSCity keyless MCP readiness docs](https://saascity.io/mcp)
    - [RFC 9309 Robots.txt Tester](https://saascity.io/free-tools/robots-txt-generator)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
