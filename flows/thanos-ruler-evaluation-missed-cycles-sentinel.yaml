id: thanos-ruler-evaluation-missed-cycles-sentinel
namespace: company.sentinel
description: Queries Thanos Ruler Prometheus metrics to flag missed rule evaluation
  cycles and failing Prometheus recording rule groups.
inputs:
- id: thanos_ruler_metrics_url
  type: STRING
  defaults: http://thanos-ruler.internal:10902/metrics
- id: max_missed_evaluations_threshold
  type: INT
  defaults: 5
tasks:
  - id: audit_thanos
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects Thanos Ruler Prometheus metrics for missed evaluation iterations and rule evaluation failures.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.thanos_ruler_metrics_url }}"
      MAX_MISSED_THRESHOLD: "{{ inputs.max_missed_evaluations_threshold }}"
    script: |
      import os
      import sys
      import re
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "").rstrip("/")
      max_missed = int(os.environ.get("MAX_MISSED_THRESHOLD", "5"))

      print(f"Scraping Thanos Ruler metrics from: {metrics_url}")
      try:
          resp = requests.get(metrics_url, timeout=15)
          resp.raise_for_status()
      except Exception as err:
          print(f"ERROR: Failed to connect to Thanos Ruler metrics endpoint {metrics_url}: {err}", file=sys.stderr)
          sys.exit(1)

      missed_iterations = 0
      rule_errors = 0

      for line in resp.text.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          if "thanos_rule_evaluation_iterations_missed_total" in line:
              m = re.search(r'([0-9.]+)\s*$', line)
              if m:
                  missed_iterations = int(float(m.group(1)))
          elif "thanos_rule_evaluation_failures_total" in line:
              m = re.search(r'([0-9.]+)\s*$', line)
              if m:
                  rule_errors = int(float(m.group(1)))

      is_breach = (missed_iterations > max_missed) or (rule_errors > 0)
      print(f"Thanos Ruler Audit: Missed Iterations = {missed_iterations}, Rule Errors = {rule_errors}, Breach = {is_breach}")

      Kestra.outputs({
          "missed_iterations": missed_iterations,
          "rule_errors": rule_errors,
          "is_breach": is_breach
      })

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Thanos Ruler missed evaluation iterations or rule evaluation failures exceed threshold.
    condition: "{{ outputs.audit_thanos.vars.is_breach }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Thanos Ruler Missed Evaluation Cycles*
          *Metrics URL:* {{ inputs.thanos_ruler_metrics_url }}
          *Missed Iterations:* {{ outputs.audit_thanos.vars.missed_iterations }}
          *Rule Evaluation Errors:* {{ outputs.audit_thanos.vars.rule_errors }}
          *Threshold:* {{ inputs.max_missed_evaluations_threshold }}
          *Impact:* Gaps in recording rules and delayed alert triggering.
errors:
- id: handle_inspection_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: ':rotating_light: *Execution Failure: Thanos Ruler Evaluation Cycle Drift
    and Failure Sentinel*\n*Execution ID:* `{ execution.id }`\n*State:* `{ execution.state.current
    }`\n*Error:* Sentinel inspection encountered an unhandled execution error.'
triggers:
- id: scheduled_monitor
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
outputs:
  - id: missed_iterations
    type: INT
    value: "{{ outputs.audit_thanos.vars.missed_iterations }}"
  - id: rule_errors
    type: INT
    value: "{{ outputs.audit_thanos.vars.rule_errors }}"
  - id: is_breach
    type: BOOLEAN
    value: "{{ outputs.audit_thanos.vars.is_breach }}"

extend:
  metaDescription: "Queries Thanos Ruler Prometheus metrics to flag missed rule evaluation cycles and failing Prometheus recording rule groups."
  metaTitle: Thanos Ruler Evaluation Cycle Drift and Failure Sentinel with Kestra
  title: Thanos Ruler Evaluation Cycle Drift and Failure Sentinel
  shortDescription: Queries Thanos Ruler Prometheus metrics to flag missed rule evaluation
    cycles and failing Prometheus recording rule groups.
  description: '## How it works

    This automated sentinel flow continuously assesses operational health, metrics,
    and capacity parameters for **Thanos Ruler Evaluation Cycle Drift and Failure
    Sentinel**. It runs authentic CLI probes or REST telemetry inspections directly
    against the running infrastructure instance, parses the JSON response using native
    jq or schema tooling, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`,
    and triggers instant Slack notifications with actionable contextual diagnostics
    when anomalies or threshold violations occur.


    ## What you get

    - **Proactive Anomaly Detection**: Identifies performance degradation, quorum
    imbalance, or storage exhaustion before service disruption occurs.

    - **Configurable Operational Guardrails**: Fully parametric threshold inputs allowing
    zero-code adjustments across staging and production clusters.

    - **Instant Incident Dispatch**: Context-rich Slack alerting featuring detailed
    metrics, node identities, and mitigation recommendations.

    - **Zero Mock Logic**: Executes genuine network probes and command-line evaluations
    with strict error handling and top-level error routines.


    ## Who it''s for

    - Platform and Site Reliability Engineers managing mission-critical distributed
    systems.

    - Database and Infrastructure Administrators responsible for high-availability
    uptime and cluster capacity planning.

    - DevOps engineers automating self-healing data platform pipelines with Kestra.


    ## Why orchestrate this with Kestra

    - **Stateless & Scalable**: Runs on Kestra''s distributed execution engine without
    needing dedicated daemon agents on monitored hosts.

    - **Auditable History**: Every audit run, raw response output, and conditional
