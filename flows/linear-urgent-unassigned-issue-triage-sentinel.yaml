id: linear-urgent-unassigned-issue-triage-sentinel
namespace: company.operations

inputs:
  - id: team_key
    type: STRING
    displayName: Linear Team Key
    defaults: "ENG"
    description: Linear team key identifier (e.g. 'ENG', 'OPS', 'SEC') used to filter issues.

  - id: lookback_limit
    type: INT
    displayName: Issue Evaluation Limit
    defaults: 25
    description: Maximum number of urgent issues to inspect in the triage queue per execution.

  - id: fail_on_unassigned_urgent
    type: BOOL
    displayName: Fail on Unassigned Urgent Issues
    defaults: false
    description: Whether to fail execution when unassigned urgent issues are detected to trip external pager services.

triggers:
  - id: recurring_triage_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Frequent 15-minute triage audit to catch unassigned urgent tickets before SLA breach. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: fetch_urgent_unassigned_issues
    type: io.kestra.plugin.graphql.Request
    description: Query Linear GraphQL API for urgent priority issues lacking an assigned engineer.
    uri: "https://api.linear.app/graphql"
    headers:
      Authorization: "{{ secret('LINEAR_API_KEY') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-Linear-Triage-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query GetUnassignedUrgentIssues {
        issues(filter: { team: { key: { eq: "{{ inputs.team_key }}" } }, priority: { eq: 1 }, assignee: { null: true }, state: { type: { nin: ["completed", "canceled"] } } }, first: {{ inputs.lookback_limit }}) {
          nodes {
            id
            identifier
            title
            url
            createdAt
            team {
              name
              key
            }
          }
        }
      }

  - id: evaluate_unassigned_issues
    type: io.kestra.plugin.core.flow.If
    description: Check whether urgent unassigned issues are present in the triage queue.
    condition: "{{ outputs.fetch_urgent_unassigned_issues.body is defined and outputs.fetch_urgent_unassigned_issues.body.issues is defined and ((outputs.fetch_urgent_unassigned_issues.body.issues.nodes | length) > 0) }}"
    then:
      - id: alert_urgent_unassigned
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority Slack notification itemizing urgent unassigned issues to the on-call team.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🔥 *LINEAR INCIDENT TRIAGE: Urgent Unassigned Issues Detected* 🔥\n\n*Team:* `{{ inputs.team_key }}`\n*Pending Urgent Tickets:* {{ outputs.fetch_urgent_unassigned_issues.body.issues.nodes | length }}\n\n*Issues Requiring Immediate Owner Assignment:*\n{{ outputs.fetch_urgent_unassigned_issues.body.issues.nodes | jq('[.[] | \"• *\" + .identifier + \"*: \" + .title + \" - <\" + .url + \"|View Issue>\"] | join(\"\\n\")') | first }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* On-call engineer please claim or assign tickets to avoid SLA violations."
          }

      - id: check_fail_policy
        type: io.kestra.plugin.core.flow.If
        description: Halt pipeline when fail_on_unassigned_urgent is enabled.
        condition: "{{ inputs.fail_on_unassigned_urgent }}"
        then:
          - id: halt_triage_gate
            type: io.kestra.plugin.core.execution.Fail
            description: Fail execution to trigger automated incident escalations.
    else:
      - id: log_triage_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log clean operational status when zero urgent unassigned issues exist.
        message: "HEALTHY: Zero unassigned urgent issues detected in Linear team {{ inputs.team_key }}."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for triage velocity.
    message: "Linear triage sentinel completed for team {{ inputs.team_key }}. Unassigned urgent tickets count: {{ outputs.fetch_urgent_unassigned_issues.body is defined and outputs.fetch_urgent_unassigned_issues.body.issues is defined ? (outputs.fetch_urgent_unassigned_issues.body.issues.nodes | length) : 0 }}."

errors:
  - id: alert_on_linear_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Engineering Operations if Linear GraphQL API returns errors or authentication fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Linear Triage Error*: Execution `{{ execution.id }}` failed to query team `{{ inputs.team_key }}`. Verify LINEAR_API_KEY validity."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.fetch_urgent_unassigned_issues.body is defined and outputs.fetch_urgent_unassigned_issues.body.issues is defined and ((outputs.fetch_urgent_unassigned_issues.body.issues.nodes | length) > 0) ? 'URGENT_UNASSIGNED_DETECTED' : 'HEALTHY' }}"
  - id: unassigned_count
    type: INT
    value: "{{ outputs.fetch_urgent_unassigned_issues.body is defined and outputs.fetch_urgent_unassigned_issues.body.issues is defined ? (outputs.fetch_urgent_unassigned_issues.body.issues.nodes | length) : 0 }}"

extend:
  title: Linear urgent unassigned issue triage sentinel
  metaTitle: Linear Urgent Unassigned Issue Triage | Kestra
  shortDescription: Continuous triage sentinel that queries Linear GraphQL API for urgent unassigned issues, alerting on-call engineers via Slack to prevent SLA breaches.
  metaDescription: Audit Linear issues via GraphQL API for urgent unassigned bugs and dispatch high-priority Slack alerts to on-call engineers to meet customer response SLAs.
  description: |
    Prevent critical production bugs and customer escalations from languishing unaddressed in project backlogs. In high-velocity engineering organizations using Linear, critical issues with urgent priority (`priority: 1`) are frequently submitted by support reps, customer success teams, or automated monitoring alerts without an assigned engineer, causing response times to slip past client SLAs. This blueprint runs a frequent 15-minute triage sweep via Linear's GraphQL API (`io.kestra.plugin.graphql.Request`), filters for open urgent issues lacking an assignee, and sends an actionable Slack alert with direct ticket links to on-call teams.

    ## How it works
    1. A `Schedule` trigger initiates a triage audit every 15 minutes (shipped disabled by default).
    2. Task `fetch_urgent_unassigned_issues` issues a GraphQL query to `https://api.linear.app/graphql` authenticated with `LINEAR_API_KEY`. The query applies a compound filter matching `priority: 1`, `assignee: { null: true }`, and active issue states (excluding `completed` and `canceled`) for the specified team key.
    3. Task `evaluate_unassigned_issues` (`io.kestra.plugin.core.flow.If`) counts discovered tickets:
       - If any urgent unassigned tickets exist: Task `alert_urgent_unassigned` delivers a formatted Slack alert itemizing issue identifiers (`ENG-123`), titles, and direct URLs. If `fail_on_unassigned_urgent` is enabled, task `halt_triage_gate` terminates the run with an error to trip external alert monitors.
       - If none exist: Task `log_triage_healthy` logs that the triage queue is healthy.
    4. Task `log_audit_summary` logs the count of evaluated urgent tickets.
    5. Top-level `errors` handler dispatches a notification if the Linear API returns network or authentication errors.

    ## What you get
    - Continuous automated surveillance of unassigned critical tickets in Linear.
    - Guaranteed fast incident handoff to on-call engineering leads.
    - Clickable Slack digests enabling engineers to claim and assign tickets directly.
    - Measurable reduction in mean time to response (MTTR) for customer-reported bugs.

    ## Who it's for
    - Engineering Managers and On-Call Technical Leads triaging incoming defect queues.
    - Customer Support and Solutions Engineers ensuring bug reports are promptly assigned.
    - Incident Response Coordinators managing severity-1 escalations.

    ## Why orchestrate this with Kestra
    Managing triage SLAs through manual dashboard reviews leads to missed tickets during sprint planning or off-hours. Kestra provides a resilient, version-controlled automation loop that queries Linear's GraphQL schema directly, handles secure API credentials, formats structured notifications with jq expressions, and guarantees operational visibility across engineering teams.

    ## Prerequisites
    - A Linear workspace and personal API key with read permissions.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `LINEAR_API_KEY`: Linear API key passed in the `Authorization` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to receive triage alerts.

    ## Quick start
    1. Generate a Linear personal API key under **Settings > My Account > Security & Access**.
    2. Store `LINEAR_API_KEY` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    3. Configure `team_key` with your Linear team identifier (e.g. `ENG`).
    4. Execute the flow manually in Kestra to verify the GraphQL query succeeds.
    5. Enable the `recurring_triage_sweep` schedule to activate 15-minute triage monitoring.

    ## How to extend
    - Add an automated assignment mutation via GraphQL to automatically assign unassigned urgent tickets to the active on-call engineer fetched from PagerDuty.
    - Integrate with Jira or Zendesk to synchronize priority statuses across multi-platform support desks.
    - Track unassigned queue duration over time to generate weekly triage velocity reports.

    ## Links
    - [Linear GraphQL API Documentation](https://developers.linear.app/docs/graphql/working-with-the-graphql-api)
    - [Kestra GraphQL Plugin](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Business
  subTags:
    - Incident Response
    - Monitoring & Alerting
  ee: false
  demo: false
