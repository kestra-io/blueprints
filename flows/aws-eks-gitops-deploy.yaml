id: eks-gitops-deploy
namespace: prod.deployments
title: Deploy Spring Boot 3 to AWS EKS with Kaniko & Discord Alerts
description: |
  Automated GitOps deployment blueprint for building container images with daemonless Kaniko, pushing to Amazon ECR, deploying zero-downtime rolling updates to AWS EKS with resource-optimized surge constraints (`maxSurge: 0, maxUnavailable: 1`), and broadcasting rich deployment & incident diagnostic reports to Discord.
metaDescription: GitOps CI/CD pipeline deploying containerized Spring Boot applications to AWS EKS using Kaniko, Amazon ECR, zero-downtime rolling updates, and Discord alerts.
tags:
  - AWS
  - EKS
  - Kubernetes
  - Docker
  - CI/CD
  - GitOps
  - Kaniko
  - Discord
  - Spring Boot

concurrency:
  behavior: QUEUE
  limit: 1

inputs:
  - id: git_repo
    type: STRING
    defaults: "https://github.com/Abhishekkhode/eks-gitops-deploy.git"
    description: Target Git repository containing the application and Kubernetes manifests

  - id: git_branch
    type: STRING
    defaults: "main"
    description: Git branch to clone and deploy

  - id: aws_region
    type: STRING
    defaults: "ap-south-2"
    description: AWS Region for ECR and EKS

  - id: ecr_registry
    type: STRING
    defaults: "your-account-id.dkr.ecr.ap-south-2.amazonaws.com"
    description: Full AWS ECR Registry URI

  - id: eks_cluster_name
    type: STRING
    defaults: "eks-gitops-deploy-cluster"
    description: Target AWS EKS Cluster Name

tasks:
  - id: working_dir
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_repository
        type: io.kestra.plugin.git.Clone
        url: "{{ inputs.git_repo | trim }}"
        branch: "{{ inputs.git_branch | trim }}"

      - id: build_and_push_image
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          config: |
            {
              "credsStore": "ecr-login"
            }
        containerImage: gcr.io/kaniko-project/executor:debug
        env:
          AWS_REGION: "{{ inputs.aws_region | trim }}"
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - /kaniko/executor --context dir://. --dockerfile Dockerfile --destination {{ inputs.ecr_registry | trim }}/eks-gitops-deploy:{{ execution.id }} --custom-platform=linux/amd64 --ignore-path=/tmp

      - id: deploy_and_verify_rollout
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: amazon/aws-cli:latest
        env:
          AWS_REGION: "{{ inputs.aws_region | trim }}"
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          DISCORD_WEBHOOK_URL: "{{ secret('DISCORD_WEBHOOK_URL') }}"
        beforeCommands:
          - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          - chmod +x kubectl
          - mv kubectl /usr/local/bin/
        commands:
          - aws eks update-kubeconfig --region {{ inputs.aws_region | trim }} --name {{ inputs.eks_cluster_name | trim }}
          - sed -i "s|IMAGE_PLACEHOLDER|{{ inputs.ecr_registry | trim }}/eks-gitops-deploy:{{ execution.id }}|g" k8s/deployment.yaml
          - kubectl apply -f k8s/
          - kubectl rollout status deployment/eks-gitops-deploy -n production --timeout=420s
          - |
            LB_HOST=$(kubectl get svc eks-gitops-deploy-service -n production -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -z "$LB_HOST" ]; then
              LB_URL="Pending AWS LoadBalancer Provisioning"
            else
              LB_URL="http://${LB_HOST}/"
            fi

            POD_INSTANCES=$(kubectl get pods -n production -l app=eks-gitops-deploy -o jsonpath='{range .items[*]}• {.metadata.name} ({.status.phase}, Ready: {.status.containerStatuses[0].ready}) on Node: {.spec.nodeName}\n{end}' 2>/dev/null || echo "Pods active in production")

            cat << 'EOF' > /tmp/discord_success.json
            {
              "username": "Kestra GitOps Orchestrator",
              "avatar_url": "https://kestra.io/favicon.ico",
              "embeds": [
                {
                  "title": "🚀 AWS EKS Deployment SUCCESS",
                  "description": "Application `eks-gitops-deploy` successfully deployed and rolled out to **production** on AWS EKS.",
                  "color": 3066993,
                  "fields": [
                    {
                      "name": "🌐 Live Service LoadBalancer URL",
                      "value": "${LB_URL}",
                      "inline": false
                    },
                    {
                      "name": "📦 Container Image",
                      "value": "`{{ inputs.ecr_registry | trim }}/eks-gitops-deploy:{{ execution.id }}`",
                      "inline": false
                    },
                    {
                      "name": "🎯 Infrastructure Details",
                      "value": "• **Cluster**: `{{ inputs.eks_cluster_name | trim }}`\n• **Namespace**: `production`\n• **Region**: `{{ inputs.aws_region | trim }}`",
                      "inline": true
                    },
                    {
                      "name": "📊 Pod Health & Sizing",
                      "value": "• **Replicas**: `2/2 Ready`\n• **CPU/RAM**: `100m-300m / 160Mi-320Mi`\n• **Probes**: Liveness & Readiness UP",
                      "inline": true
                    },
                    {
                      "name": "📋 Active Pod Instances",
                      "value": "${POD_INSTANCES}",
                      "inline": false
                    },
                    {
                      "name": "🔗 Telemetry Endpoints Hub",
                      "value": "[Discovery Map](${LB_URL}) • [Live System Stats](${LB_URL}api/system) • [Actuator Health](${LB_URL}actuator/health) • [App Info](${LB_URL}api/info)",
                      "inline": false
                    }
                  ],
                  "footer": {
                    "text": "Kestra GitOps Orchestrator • Execution: {{ flow.id }} - {{ execution.id }}",
                    "icon_url": "https://kestra.io/favicon.ico"
                  },
                  "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                }
              ]
            }
            EOF
            if [ -n "$DISCORD_WEBHOOK_URL" ]; then
              curl -s -H "Content-Type: application/json" -X POST -d @/tmp/discord_success.json "$DISCORD_WEBHOOK_URL"
            fi

errors:
  - id: capture_pod_diagnostics_and_alert
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: amazon/aws-cli:latest
    env:
      AWS_REGION: "{{ inputs.aws_region | trim }}"
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      DISCORD_WEBHOOK_URL: "{{ secret('DISCORD_WEBHOOK_URL') }}"
    beforeCommands:
      - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/
    commands:
      - |
        set +e
        aws eks update-kubeconfig --region {{ inputs.aws_region | trim }} --name {{ inputs.eks_cluster_name | trim }} || true

        POD_STATUS=$(kubectl get pods -n production 2>&1 | head -c 800)
        [ -z "$POD_STATUS" ] && POD_STATUS="Unable to reach Kubernetes API"

        POD_LOGS=$(kubectl logs -n production -l app=eks-gitops-deploy --tail=15 2>&1 | head -c 800)
        [ -z "$POD_LOGS" ] && POD_LOGS="No pod crash logs captured."

        EVENTS=$(kubectl get events -n production --sort-by='.metadata.creationTimestamp' 2>&1 | tail -n 8 | head -c 800)
        [ -z "$EVENTS" ] && EVENTS="No recent Kubernetes events."

        cat << 'EOF' > /tmp/discord_failure.json
        {
          "username": "Kestra Incident Manager",
          "avatar_url": "https://kestra.io/favicon.ico",
          "embeds": [
            {
              "title": "🚨 AWS EKS Deployment FAILED (Incident Report)",
              "description": "Deployment failed during verification/rollout on cluster `{{ inputs.eks_cluster_name | trim }}`.",
              "color": 15158332,
              "fields": [
                {
                  "name": "🎯 Infrastructure & Context",
                  "value": "• **Cluster**: `{{ inputs.eks_cluster_name | trim }}`\n• **Namespace**: `production`\n• **Region**: `{{ inputs.aws_region | trim }}`\n• **Attempted Image**: `{{ inputs.ecr_registry | trim }}/eks-gitops-deploy:{{ execution.id }}`",
                  "inline": false
                },
                {
                  "name": "📋 Pod Health & Diagnostics",
                  "value": "```\n${POD_STATUS}\n```",
                  "inline": false
                },
                {
                  "name": "📜 Recent Crash / Error Logs",
                  "value": "```\n${POD_LOGS}\n```",
                  "inline": false
                },
                {
                  "name": "⚠️ Cluster Events",
                  "value": "```\n${EVENTS}\n```",
                  "inline": false
                }
              ],
              "footer": {
                "text": "Kestra Incident Manager • Execution: {{ flow.id }} - {{ execution.id }}",
                "icon_url": "https://kestra.io/favicon.ico"
              },
              "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            }
          ]
        }
        EOF
        if [ -n "$DISCORD_WEBHOOK_URL" ]; then
          curl -s -H "Content-Type: application/json" -X POST -d @/tmp/discord_failure.json "$DISCORD_WEBHOOK_URL"
        fi
