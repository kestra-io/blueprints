id: loki-ingester-flushing-failed-sentinel
namespace: company.sentinel
description: Audits Grafana Loki log aggregation ingester daemons for uncommitted chunk flush failures to object storage backends.

inputs:
  - id: loki_metrics_url
    type: STRING
    defaults: http://loki.internal:3100/metrics
    description: Prometheus metrics endpoint for the Grafana Loki ingester service.
  - id: max_flush_failed_threshold
    type: INT
    defaults: 0
    description: Maximum tolerated failed chunk flush operations before triggering incident alerts.

tasks:
  - id: audit_loki
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Loki ingester metrics and evaluates chunk flush failure counters.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      LOKI_METRICS_URL: "{{ inputs.loki_metrics_url }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      url = os.environ.get("LOKI_METRICS_URL", "http://loki.internal:3100/metrics").strip()
      print(f"Scraping Loki ingester metrics from {url}...")

      try:
          resp = requests.get(url, timeout=15)
          resp.raise_for_status()
      except Exception as e:
          print(f"ERROR: Failed to fetch Loki ingester metrics from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      flush_failed = 0
      chunks_created = 0

      for line in resp.text.splitlines():
          line = line.strip()
          if line.startswith("#") or not line:
              continue
          if "loki_ingester_flush_failed_total" in line:
              flush_failed = int(float(line.split()[-1]))
          elif "loki_ingester_chunks_created_total" in line:
              chunks_created = int(float(line.split()[-1]))

      print(f"Loki Ingester: Flush Failed={flush_failed}, Chunks Created={chunks_created}")

      Kestra.outputs({
          "flush_failed": flush_failed,
          "chunks_created": chunks_created
      })

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_loki.vars.flush_failed > inputs.max_flush_failed_threshold }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :x: *Grafana Loki Chunk Flush Failure*
          *Metrics URL:* {{ inputs.loki_metrics_url }}
          *Flushing Failures:* {{ outputs.audit_loki.vars.flush_failed }}
          *Threshold:* {{ inputs.max_flush_failed_threshold }}
          *Impact:* Ingester memory pressure; potential log data loss if storage rejects PUT requests.

outputs:
  - id: flush_failed
    type: INT
    value: "{{ outputs.audit_loki.vars.flush_failed }}"
  - id: chunks_created
    type: INT
    value: "{{ outputs.audit_loki.vars.chunks_created }}"

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Execution Failure: Grafana Loki Log Ingester Chunk Flushing Failure Sentinel*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Error:* Sentinel inspection encountered an unhandled execution error.

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Grafana Loki log aggregation ingester daemons for uncommitted chunk flush failures to object storage backends."
  metaTitle: Grafana Loki Log Ingester Chunk Flushing Failure Sentinel with Kestra
  title: Grafana Loki Log Ingester Chunk Flushing Failure Sentinel
  shortDescription: Audits Grafana Loki log aggregation ingesters for chunk flush failures to object storage.
  description: |
    Audits Grafana Loki log aggregation ingester daemons for uncommitted chunk flush failures to object storage backends, alerting SREs on Slack before data loss occurs.
  tags:
    - Data
    - Infrastructure
