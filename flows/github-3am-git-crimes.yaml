id: github-3am-git-crimes
namespace: company.team

description: |
  Analyze a GitHub repository's weekly commit timestamps, calculate after-hours
  activity metrics in a chosen timezone, write a Markdown report and optionally
  send a concise summary to Slack. The report is descriptive, not a measure of
  working hours, sleep, health or productivity.

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: repository
    type: STRING
    displayName: GitHub repository
    description: Repository to analyze in owner/name form.
    defaults: kestra-io/kestra

  - id: ref
    type: STRING
    displayName: Git reference
    description: Optional branch, tag or commit SHA. Leave empty to analyze the default branch.
    defaults: ""

  - id: reporting_days
    type: INT
    displayName: Reporting period in days
    description: Number of complete 24-hour periods ending at the scheduled trigger time, or at execution start for manual runs.
    defaults: 7
    min: 1
    max: 31

  - id: timezone
    type: STRING
    displayName: Analysis timezone
    description: IANA timezone used for hourly and weekend calculations, such as Europe/Paris or Asia/Kuala_Lumpur.
    defaults: Etc/UTC

  - id: max_pages
    type: INT
    displayName: Maximum API pages
    description: Maximum pages of 100 commits fetched per execution. The flow fails instead of publishing a partial report when this cap is reached.
    defaults: 10
    min: 1
    max: 50

  - id: use_github_token
    type: BOOL
    displayName: Use GitHub token
    description: Authenticate with the GITHUB_TOKEN secret for private repositories and a higher rate limit.
    defaults: false

  - id: include_anonymous_3am_stats
    type: BOOL
    displayName: Include anonymous 3AM statistics
    description: Add ranked anonymous commit counts for contributors active from 03:00 through 03:59 local time.
    defaults: false

  - id: send_slack
    type: BOOL
    displayName: Send Slack summary
    description: Post the concise report summary using the SLACK_WEBHOOK_URL secret.
    defaults: false

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every Monday at 09:00 UTC. Disabled until the repository and optional secrets are configured.
    cron: "0 9 * * 1"
    timezone: Etc/UTC
    disabled: true

tasks:
  - id: fetch_commits
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the request, fetch every commit page in the fixed reporting window and save only the fields required for analysis. Transient failures are retried per page; incomplete pagination fails the task.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    timeout: PT10M
    env:
      REPOSITORY: "{{ inputs.repository }}"
      REF: "{{ inputs.ref }}"
      REPORTING_DAYS: "{{ inputs.reporting_days }}"
      REPORT_END: "{{ trigger.date ?? execution.startDate }}"
      MAX_PAGES: "{{ inputs.max_pages }}"
      INCLUDE_CONTRIBUTORS: "{{ inputs.include_anonymous_3am_stats }}"
      GITHUB_TOKEN: "{{ inputs.use_github_token ? secret('GITHUB_TOKEN') : '' }}"
    outputFiles:
      - commits.json
    script: |
      import hashlib
      import json
      import os
      import re
      import secrets
      import time
      import urllib.error
      import urllib.parse
      import urllib.request
      from datetime import datetime, timedelta, timezone

      repository = os.environ["REPOSITORY"].strip()
      ref = os.environ.get("REF", "").strip()
      reporting_days = int(os.environ["REPORTING_DAYS"])
      report_end_raw = os.environ["REPORT_END"]
      max_pages = int(os.environ["MAX_PAGES"])
      include_contributors = os.environ["INCLUDE_CONTRIBUTORS"].lower() == "true"
      token = os.environ.get("GITHUB_TOKEN", "").strip()
      contributor_salt = secrets.token_bytes(32)

      repository_pattern = re.compile(
          r"^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?/[A-Za-z0-9._-]{1,100}$"
      )
      if not repository_pattern.fullmatch(repository):
          raise SystemExit("repository must use owner/name form")
      if not 1 <= reporting_days <= 31:
          raise SystemExit("reporting_days must be between 1 and 31")
      if not 1 <= max_pages <= 50:
          raise SystemExit("max_pages must be between 1 and 50")


      def parse_datetime(value):
          parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
          if parsed.tzinfo is None:
              parsed = parsed.replace(tzinfo=timezone.utc)
          return parsed.astimezone(timezone.utc)


      def github_time(value):
          return value.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")


      report_end = parse_datetime(report_end_raw)
      report_start = report_end - timedelta(days=reporting_days)

      headers = {
          "Accept": "application/vnd.github+json",
          "User-Agent": "kestra-github-3am-git-crimes",
          "X-GitHub-Api-Version": "2022-11-28",
      }
      if token:
          headers["Authorization"] = "Bearer " + token

      query = {
          "since": github_time(report_start),
          "until": github_time(report_end),
          "per_page": 100,
      }
      if ref:
          query["sha"] = ref
      next_url = "https://api.github.com/repos/{}/commits?{}".format(
          repository, urllib.parse.urlencode(query)
      )


      def response_message(error):
          try:
              body = json.loads(error.read().decode("utf-8"))
              return str(body.get("message") or "")
          except Exception:
              return ""


      def fetch_page(url):
          for attempt in range(3):
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                      return payload, dict(response.headers.items())
              except urllib.error.HTTPError as error:
                  message = response_message(error)
                  lower_message = message.lower()
                  remaining = error.headers.get("x-ratelimit-remaining")
                  if error.code == 409:
                      if "empty" in lower_message:
                          return [], dict(error.headers.items())
                      raise RuntimeError("GitHub repository is temporarily unavailable (HTTP 409)")
                  if error.code in (403, 429) and remaining == "0":
                      reset = error.headers.get("x-ratelimit-reset", "unknown")
                      raise RuntimeError("GitHub primary rate limit exhausted; reset epoch: {}".format(reset))
                  secondary = error.code == 429 or "secondary rate limit" in lower_message or "abuse detection" in lower_message
                  if secondary:
                      retry_after = error.headers.get("retry-after")
                      delay = int(retry_after) if retry_after and retry_after.isdigit() else 60 * (2 ** attempt)
                      if attempt < 2 and delay <= 300:
                          time.sleep(delay)
                          continue
                      raise RuntimeError("GitHub secondary rate limit exceeded; retry later")
                  if error.code == 401:
                      raise RuntimeError("GitHub authentication failed; check GITHUB_TOKEN")
                  if error.code == 404:
                      raise RuntimeError("repository or ref not found, or token lacks access")
                  if 500 <= error.code < 600 and attempt < 2:
                      time.sleep(2 ** (attempt + 1))
                      continue
                  detail = ": " + message if message else ""
                  raise RuntimeError("GitHub returned HTTP {}{}".format(error.code, detail))
              except (urllib.error.URLError, TimeoutError) as error:
                  if attempt < 2:
                      time.sleep(2 ** (attempt + 1))
                      continue
                  raise RuntimeError("GitHub request failed after retries: {}".format(type(error).__name__))


      def next_link(value):
          for part in (value or "").split(","):
              section = part.strip()
              if 'rel="next"' not in section:
                  continue
              match = re.match(r"<([^>]+)>", section)
              if not match:
                  continue
              parsed = urllib.parse.urlparse(match.group(1))
              if parsed.scheme != "https" or parsed.netloc != "api.github.com":
                  raise RuntimeError("GitHub returned an unsafe pagination URL")
              return match.group(1)
          return None


      def anonymous_contributor(item):
          linked = item.get("author") or {}
          commit_author = (item.get("commit") or {}).get("author") or {}
          identity = linked.get("login") or commit_author.get("email") or commit_author.get("name")
          if not identity:
              return None
          value = str(identity).strip().lower().encode("utf-8")
          return hashlib.sha256(contributor_salt + b"\0" + value).hexdigest()


      commits = []
      seen = set()
      pages = 0
      last_headers = {}
      while next_url:
          if pages >= max_pages:
              raise RuntimeError(
                  "GitHub pagination exceeded max_pages={}; increase the cap or shorten reporting_days".format(max_pages)
              )
          batch, last_headers = fetch_page(next_url)
          if not isinstance(batch, list):
              raise RuntimeError("GitHub commits response was not an array")
          pages += 1
          for item in batch:
              sha = item.get("sha")
              commit = item.get("commit") or {}
              committer = commit.get("committer") or {}
              if not sha or sha in seen or not committer.get("date"):
                  continue
              seen.add(sha)
              commits.append({
                  "sha": sha,
                  "committer_date": committer["date"],
                  "contributor_id": anonymous_contributor(item) if include_contributors else None,
              })
          next_url = next_link(last_headers.get("Link") or last_headers.get("link"))

      document = {
          "repository": repository,
          "ref": ref or "default branch",
          "period_start": github_time(report_start),
          "period_end": github_time(report_end),
          "pages": pages,
          "commits": commits,
      }
      with open("commits.json", "w", encoding="utf-8") as handle:
          json.dump(document, handle, ensure_ascii=True, separators=(",", ":"))

      remaining = last_headers.get("X-RateLimit-Remaining") or last_headers.get("x-ratelimit-remaining")
      print("Fetched {} unique commit(s) from {} page(s).".format(len(commits), pages))
      print("::" + json.dumps({"outputs": {
          "fetched_commits": len(commits),
          "pages": pages,
          "period_start": document["period_start"],
          "period_end": document["period_end"],
          "rate_limit_remaining": remaining or "unknown",
      }}) + "::")

  - id: analyze_activity
    type: io.kestra.plugin.scripts.python.Script
    description: Convert committer timestamps into the selected IANA timezone, calculate the after-hours metrics and deterministic verdict, and create the full Markdown and CSV reports.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    timeout: PT1M
    env:
      REPOSITORY: "{{ inputs.repository }}"
      ANALYSIS_TIMEZONE: "{{ inputs.timezone }}"
      INCLUDE_CONTRIBUTORS: "{{ inputs.include_anonymous_3am_stats }}"
    inputFiles:
      commits.json: "{{ outputs.fetch_commits.outputFiles['commits.json'] }}"
    outputFiles:
      - report.md
      - hourly-distribution.csv
    script: |
      import csv
      import json
      import os
      from collections import Counter
      from datetime import datetime, timezone
      from zoneinfo import ZoneInfo, ZoneInfoNotFoundError

      repository = os.environ["REPOSITORY"]
      timezone_name = os.environ["ANALYSIS_TIMEZONE"].strip()
      include_contributors = os.environ["INCLUDE_CONTRIBUTORS"].lower() == "true"

      try:
          local_timezone = ZoneInfo(timezone_name)
      except (ZoneInfoNotFoundError, ValueError):
          raise SystemExit("Unknown IANA timezone: {}".format(timezone_name))

      with open("commits.json", encoding="utf-8") as handle:
          document = json.load(handle)


      def parse_datetime(value):
          parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
          if parsed.tzinfo is None:
              parsed = parsed.replace(tzinfo=timezone.utc)
          return parsed.astimezone(timezone.utc)


      period_start = parse_datetime(document["period_start"])
      period_end = parse_datetime(document["period_end"])
      hourly = [0] * 24
      night_commits = 0
      weekend_commits = 0
      three_am_commits = 0
      contributors = Counter()
      analyzed = []

      for commit in document.get("commits", []):
          committed_at = parse_datetime(commit["committer_date"])
          if not period_start <= committed_at < period_end:
              continue
          local = committed_at.astimezone(local_timezone)
          analyzed.append(commit)
          hourly[local.hour] += 1
          night_commits += int(0 <= local.hour < 6)
          weekend_commits += int(local.weekday() >= 5)
          if local.hour == 3:
              three_am_commits += 1
              if include_contributors and commit.get("contributor_id"):
                  contributors[commit["contributor_id"]] += 1

      total = len(analyzed)
      night_index = round(night_commits * 100 / total, 2) if total else 0.0
      weekend_index = round(weekend_commits * 100 / total, 2) if total else 0.0
      suspicious_hour = min((hour for hour, count in enumerate(hourly) if count == max(hourly)), default=None) if total else None
      suspicious_label = "{:02d}:00-{:02d}:59".format(suspicious_hour, suspicious_hour) if suspicious_hour is not None else "n/a"

      if total == 0:
          verdict = "No commits. Either the repository rested, or the evidence learned to hide."
      elif total < 5:
          verdict = "Insufficient evidence. The tribunal refuses to diagnose a sleep schedule from {} commit(s).".format(total)
      elif night_index >= 40 and weekend_index >= 40:
          verdict = "The calendar and the circadian rhythm have both filed missing-person reports."
      elif night_index >= 30:
          verdict = "The repository appears to consider midnight a perfectly normal stand-up time."
      elif weekend_index >= 40:
          verdict = "The weekend was found at the scene, but not alive."
      elif suspicious_hour is not None and 0 <= suspicious_hour < 6:
          verdict = "Peak activity occurred while sensible cron jobs were trying not to make eye contact."
      else:
          verdict = "Suspiciously conventional hours. Further surveillance is probably unnecessary."

      ranked = sorted(contributors.values(), reverse=True)
      anonymous_stats = [
          {"contributor": "Anonymous night owl {}".format(index), "commits": count}
          for index, count in enumerate(ranked, start=1)
      ]

      with open("hourly-distribution.csv", "w", newline="", encoding="utf-8") as handle:
          writer = csv.writer(handle)
          writer.writerow(["hour", "commits"])
          writer.writerows(("{:02d}:00".format(hour), count) for hour, count in enumerate(hourly))

      lines = [
          "# 3AM Git Crimes — Sleep Is Not a Dependency",
          "",
          "Repository: `{}`  ".format(repository),
          "Reference: `{}`  ".format(document["ref"]),
          "Period: `{}` to `{}`  ".format(document["period_start"], document["period_end"]),
          "Analysis timezone: `{}`".format(timezone_name),
          "",
          "## Findings",
          "",
          "- Total commits: **{}**".format(total),
          "- Night Owl Index (00:00-05:59): **{:.2f}%**".format(night_index),
          "- Most Suspicious Hour: **{}** (ties use the earliest local hour)".format(suspicious_label),
          "- Weekend Warrior Index: **{:.2f}%**".format(weekend_index),
          "- Commits from 03:00-03:59: **{}**".format(three_am_commits),
          "",
          "## Verdict",
          "",
          verdict,
          "",
          "## Hourly commit distribution",
          "",
          "| Local hour | Commits |",
          "| --- | ---: |",
      ]
      lines.extend("| {:02d}:00 | {} |".format(hour, count) for hour, count in enumerate(hourly))
      if include_contributors:
          lines.extend(["", "## Anonymous 3AM contributors", ""])
          if anonymous_stats:
              lines.extend("- {}: {} commit(s)".format(item["contributor"], item["commits"]) for item in anonymous_stats)
          else:
              lines.append("- No contributor activity was recorded from 03:00 through 03:59.")
      lines.extend([
          "",
          "## Important limitation",
          "",
          "Git commit timestamps are mutable metadata. Rebases, cherry-picks, imports, clock settings and delayed pushes can separate a timestamp from when work occurred. This report must not be used to infer working hours, sleep, health, productivity or individual performance.",
          "Only commits reachable from the selected reference are counted. Merge commits and automation accounts are included, and contributors without usable identity metadata are omitted from anonymous rankings.",
          "IANA timezone rules are applied at each commit instant. During daylight-saving transitions, repeated local hours share one hourly bucket and skipped local hours have no commits.",
      ])
      with open("report.md", "w", encoding="utf-8") as handle:
          handle.write("\n".join(lines) + "\n")

      slack_summary = (
          "3AM Git Crimes for `{}`: {} commit(s), Night Owl Index {:.2f}%, "
          "Most Suspicious Hour {}, Weekend Warrior Index {:.2f}%. Verdict: {}"
      ).format(repository, total, night_index, suspicious_label, weekend_index, verdict)
      print(slack_summary)
      print("::" + json.dumps({"outputs": {
          "total_commits": total,
          "night_owl_index": night_index,
          "most_suspicious_hour": suspicious_label,
          "weekend_warrior_index": weekend_index,
          "hourly_distribution": hourly,
          "three_am_commits": three_am_commits,
          "anonymous_three_am_contributors": len(anonymous_stats),
          "anonymous_three_am_stats": anonymous_stats,
          "verdict": verdict,
          "slack_summary": slack_summary,
      }}, ensure_ascii=True) + "::")

  - id: log_summary
    type: io.kestra.plugin.core.log.Log
    description: Record the concise report in execution logs even when Slack delivery is disabled.
    message: "{{ outputs.analyze_activity.vars.slack_summary }}"

  - id: notify_slack
    type: io.kestra.plugin.core.flow.If
    description: Send the summary only when Slack delivery is enabled, leaving the webhook secret untouched otherwise.
    condition: "{{ inputs.send_slack }}"
    then:
      - id: post_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post a compact summary while the detailed hourly distribution remains in the report artifacts.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: "{{ outputs.analyze_activity.vars.slack_summary }}"
        retry:
          type: exponential
          interval: PT5S
          maxInterval: PT1M
          maxAttempts: 3

outputs:
  - id: report
    type: URI
    description: Markdown report containing the metrics, verdict, hourly table and limitation notice.
    value: "{{ outputs.analyze_activity.outputFiles['report.md'] }}"

  - id: hourly_distribution
    type: URI
    description: CSV containing all 24 local-hour buckets.
    value: "{{ outputs.analyze_activity.outputFiles['hourly-distribution.csv'] }}"

  - id: total_commits
    type: INT
    value: "{{ outputs.analyze_activity.vars.total_commits }}"

  - id: night_owl_index
    type: FLOAT
    value: "{{ outputs.analyze_activity.vars.night_owl_index }}"

  - id: most_suspicious_hour
    type: STRING
    value: "{{ outputs.analyze_activity.vars.most_suspicious_hour }}"

  - id: weekend_warrior_index
    type: FLOAT
    value: "{{ outputs.analyze_activity.vars.weekend_warrior_index }}"

  - id: verdict
    type: STRING
    value: "{{ outputs.analyze_activity.vars.verdict }}"

extend:
  title: 3AM Git Crimes — Sleep Is Not a Dependency
  metaTitle: Weekly GitHub After-Hours Commit Activity Report with Kestra
  shortDescription: Turn GitHub commit timestamps into a weekly Night Owl Index, Weekend Warrior Index, hourly activity report and optional Slack summary.
  metaDescription: Analyze GitHub commit times by local hour, report night and weekend activity, and optionally send a humorous weekly Slack summary.
  description: |
    This blueprint produces a bounded GitHub commit report in an IANA timezone, with a deterministic dark-humour verdict.

    ## How it works

    1. The disabled `weekly` Schedule runs Mondays at 09:00 UTC after you configure the repository and optional secrets.
    2. `fetch_commits` anchors the window to the scheduled trigger time (or manual execution start), then calls GitHub with optional authentication, bounded pagination and transient retries. It fails rather than publishing partial data.
    3. `analyze_activity` converts `commit.committer.date` into `timezone`, calculates the indices and 24 hourly buckets, then writes `report.md` and `hourly-distribution.csv`.
    4. `log_summary` records the result. `notify_slack` posts the same concise summary only when `send_slack` is true.

    ## What you get

    - Typed metrics, verdict, Markdown/CSV artifacts and valid zero-commit reports.
    - Optional anonymous 3AM rankings; incomplete API data fails the run.
    - Slack retries three times, then fails the execution; report artifacts remain stored.

    ## Who it's for

    - Maintainers and engineering teams seeking a light-hearted weekly activity digest.

    ## Why orchestrate this with Kestra

    Kestra supplies scheduling, secrets, artifacts, retries, conditional delivery and execution history around deterministic analysis.

    ## Prerequisites

    - A worker with Python 3.9+, outbound HTTPS, IANA timezone data and GitHub repository access.

    ### Secrets

    - `GITHUB_TOKEN` (optional): higher limits and private repository access; fine-grained tokens need repository Contents read permission.
    - `SLACK_WEBHOOK_URL` (optional): used when `send_slack` is true.

    ## Quick start

    1. Import the flow, set `repository` and choose an IANA `timezone`.
    2. Configure optional secrets and run manually with Slack disabled.
    3. Review both report files, then enable Slack and the weekly trigger.

    Git author and committer timestamps can differ. This report uses the committer timestamp because rebases may preserve an older author date. It counts reachable commits, including merges and bots. Timestamps are mutable metadata and do not measure working hours, sleep, health, productivity or individual performance. Anonymous rankings are not a privacy guarantee.

    ## How to extend

    - Fan out across repositories, store weekly results in a warehouse, or add thresholds that notify only when after-hours activity changes sharply.

    ## Links

    - [GitHub REST API: list commits](https://docs.github.com/en/rest/commits/commits#list-commits)
    - [GitHub REST API pagination](https://docs.github.com/en/rest/using-the-rest-api/using-pagination-in-the-rest-api)
    - [GitHub REST API rate limits](https://docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api)
    - [Kestra Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Incoming Webhook](https://kestra.io/plugins/plugin-slack/slack-notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Business
    - Core
  subTags:
    - Reporting & Digests
    - Flow Control & Conditions
  ee: false
  demo: false
