id: ai-agent-tool-call-loop-guard
namespace: company.team
description: |
  Stop a live AI agent that is stuck calling the same tools over and over, before
  its answer reaches anything downstream. The flow runs one live
  io.kestra.plugin.ai.agent.AIAgent call, then immediately reads that call's real
  toolExecutions output and fails the execution when the call shows a tool-call
  loop: the same tool with the same arguments repeated in a row, or the same two
  tool calls alternating in a row. A call with varied tool use passes, and the
  agent answer is returned unchanged. There is no schedule, no webhook, and no
  recorded log: the enforcement point is the gate task itself, in the same
  execution, right after the live call.

inputs:
  - id: prompt
    type: STRING
    displayName: Agent task
    description: The task the live agent must carry out. The agent may call Kestra flows as tools while working on it.
    defaults: |
      Check the current state of the team's data pipelines and summarize any issues in under 150 words. Call a Kestra flow as a tool only when it is clearly needed to answer; otherwise answer directly.
  - id: max_identical_repeats
    type: INT
    displayName: Maximum identical repeats in a row
    description: How many times the same tool with the same arguments may repeat consecutively before the call counts as a loop. Three means two identical repeats in a row still pass, the third trips the gate.
    defaults: 3
  - id: min_alternating_calls
    type: INT
    displayName: Minimum alternating calls
    description: How many calls in an alternating two-tool pattern (first, second, first, second, and so on, with identical arguments each time the tool repeats) count as a loop. Four means a three-call alternation still passes.
    defaults: 4

tasks:
  - id: run_agent
    type: io.kestra.plugin.ai.agent.AIAgent
    description: The live agent call. Its real toolExecutions output is what the gate below reads; nothing here is stubbed or replayed.
    provider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: gemini-3.5-flash-lite
      apiKey: "{{ secret('GEMINI_API_KEY') }}"
    systemMessage: |
      You are a concise assistant. Answer in plain language and keep the answer short.
      Call a Kestra flow as a tool only when it is clearly needed to answer; otherwise answer directly.
    prompt: "{{ inputs.prompt }}"
    tools:
      - type: io.kestra.plugin.ai.tool.KestraFlow

  - id: loop_check
    type: io.kestra.plugin.scripts.python.Script
    description: Read the real toolExecutions of the live agent call and test them against two loop signatures, namely the same tool with the same arguments repeated consecutively, and the same two tool calls alternating consecutively with identical arguments each time the tool repeats. Varied tool use, including the same tool with different arguments, passes, because only exact repetition counts as a loop. A payload that cannot be parsed yields an INCONCLUSIVE verdict instead of a quiet pass.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.12-slim
    env:
      TOOL_EXECUTIONS_JSON: "{{ (outputs.run_agent.toolExecutions ?? []) | toJson }}"
      MAX_IDENTICAL_REPEATS: "{{ inputs.max_identical_repeats }}"
      MIN_ALTERNATING_CALLS: "{{ inputs.min_alternating_calls }}"
    script: |
      import json
      import os


      def tool_name(entry):
          if isinstance(entry, dict):
              for key in ("toolName", "tool", "name", "functionName"):
                  value = entry.get(key)
                  if isinstance(value, str) and value:
                      return value
                  if isinstance(value, dict):
                      inner = value.get("name", "")
                      if isinstance(inner, str) and inner:
                          return inner
              return ""
          if isinstance(entry, str):
              return entry
          return ""


      def tool_args(entry):
          if isinstance(entry, dict):
              for key in ("arguments", "args", "input", "parameters", "request"):
                  if key in entry:
                      return entry[key]
              return entry
          return entry


      def signature(entry):
          name = tool_name(entry)
          args = tool_args(entry)
          if isinstance(entry, str):
              return "str:" + entry
          return name + "::" + json.dumps(args, sort_keys=True, default=str)


      def emit(outputs):
          print("::" + json.dumps({"outputs": outputs}) + "::")


      def main():
          raw = os.environ.get("TOOL_EXECUTIONS_JSON", "")
          max_identical = int(os.environ.get("MAX_IDENTICAL_REPEATS", "3"))
          min_alternating = int(os.environ.get("MIN_ALTERNATING_CALLS", "4"))
          try:
              calls = json.loads(raw) if raw else []
          except ValueError:
              emit({
                  "verdict": "INCONCLUSIVE",
                  "tool_calls": 0,
                  "longest_identical_run": 0,
                  "longest_alternating_run": 0,
                  "loop_signature": "",
                  "reason": "toolExecutions output could not be parsed as JSON",
              })
              return
          if not isinstance(calls, list):
              calls = [calls]
          signatures = [signature(entry) for entry in calls]
          longest_identical = 0
          run = 0
          previous = None
          loop_signature = ""
          for sig in signatures:
              if sig == previous:
                  run += 1
              else:
                  run = 1
                  previous = sig
              if run > longest_identical:
                  longest_identical = run
                  loop_signature = sig
          identical_loop = longest_identical >= max_identical
          longest_alternating = 0
          alternating_loop = False
          alternating_signature = ""
          for start in range(len(signatures)):
              if len(signatures) - start < 2:
                  length = len(signatures) - start
              else:
                  length = 2
                  for index in range(start + 2, len(signatures)):
                      if signatures[index] == signatures[index - 2] and signatures[index] != signatures[index - 1]:
                          length += 1
                      else:
                          break
              if length > longest_alternating:
                  longest_alternating = length
                  alternating_signature = signatures[start]
              if length >= min_alternating and min_alternating >= 4:
                  alternating_loop = True
          if identical_loop:
              verdict = "LOOP"
              reason = "tool call repeated identically %d times in a row (cap %d): %s" % (
                  longest_identical, max_identical, loop_signature[:200])
          elif alternating_loop:
              verdict = "LOOP"
              reason = "two tool calls alternated %d times in a row (minimum %d), starting with: %s" % (
                  longest_alternating, min_alternating, alternating_signature[:200])
          else:
              verdict = "PASS"
              reason = "no loop signature found"
              loop_signature = ""
          emit({
              "verdict": verdict,
              "tool_calls": len(signatures),
              "longest_identical_run": longest_identical,
              "longest_alternating_run": longest_alternating,
              "loop_signature": loop_signature if verdict == "LOOP" else "",
              "reason": reason,
          })


      main()

  - id: loop_gate
    type: io.kestra.plugin.core.flow.If
    description: Inline enforcement, in the same execution and immediately after the live call and the loop check. The condition reads only the real verdict of loop_check. A LOOP verdict fails the execution, and an INCONCLUSIVE verdict fails it too, so a call the gate could not read is never passed silently. On a PASS verdict the agent answer is delivered unchanged.
    condition: "{{ outputs.loop_check.vars.verdict == 'LOOP' or outputs.loop_check.vars.verdict == 'INCONCLUSIVE' }}"
    then:
      - id: loop_blocked
        type: io.kestra.plugin.core.execution.Fail
        description: A looping agent call fails outright. The agent answer is discarded and no downstream task runs, so a stuck agent cannot burn further cost, repeat side effects, or leak a loop-produced answer into the rest of the pipeline.
        errorMessage: "AI agent tool-call loop {{ outputs.loop_check.vars.verdict }}: {{ outputs.loop_check.vars.tool_calls }} tool calls, longest identical run {{ outputs.loop_check.vars.longest_identical_run }}, longest alternating run {{ outputs.loop_check.vars.longest_alternating_run }}. Reason: {{ outputs.loop_check.vars.reason }}. The agent answer is discarded and no downstream task runs."
    else:
      - id: deliver_answer
        type: io.kestra.plugin.core.debug.Return
        description: With no loop found, the agent answer passes through untouched. This task runs only when the gate passes, which is what makes the gate a real enforcement point rather than a report.
        format: "{{ outputs.run_agent.textOutput }}"

outputs:
  - id: verdict
    type: STRING
    description: PASS when the live call shows no tool-call loop, LOOP when a loop signature fires, INCONCLUSIVE when the toolExecutions output could not be parsed.
    value: "{{ outputs.loop_check.vars.verdict }}"
  - id: tool_calls
    type: INT
    description: Number of real tool calls in the live agent call.
    value: "{{ outputs.loop_check.vars.tool_calls }}"
  - id: reason
    type: STRING
    description: Which loop signature fired, or that no loop signature was found.
    value: "{{ outputs.loop_check.vars.reason }}"

extend:
  shortDescription: Fail a live AI agent call the moment its tool calls fall into a repetition loop
  title: AI Agent Tool-Call Loop Guard
  metaTitle: AI Agent Tool-Call Loop Guard | Kestra
  description: |
    ## What it does

    A live AI agent can get stuck: it calls the same tool with the same arguments
    again and again, or bounces between two tools, without ever making progress.
    A total tool-call budget does not catch this early, because a loop of three
    identical calls is far below any reasonable budget cap, and a post-hoc audit
    only reports the loop after the answer has already been consumed. This
    blueprint puts a loop gate directly behind a live AI agent call: it runs one
    real `io.kestra.plugin.ai.agent.AIAgent` task, then immediately reads that
    task's real `toolExecutions` output and fails the execution when the call
    shows a repetition loop. The agent answer is delivered only when the call
    shows varied tool use, so a loop-produced answer never reaches a downstream
    task, notification, or side effect.

    ## Prerequisites

    - A Google Gemini API key with access to `gemini-3.5-flash-lite`.
    - Kestra flows in a namespace the agent is allowed to call, if you want the
    loop gate to have real tool calls to judge. With no callable flows, the
    agent answers directly, the tool-call count stays at zero, and the gate
    passes.

    ### Secrets

    - `GEMINI_API_KEY`: API key used by the `GoogleGemini` provider (required).

    ## How it works

    1. `run_agent` (`io.kestra.plugin.ai.agent.AIAgent`) carries out the task from
    the `prompt` input with the `GoogleGemini` provider, and may call Kestra
    flows as tools while working. Its credentials come from the `GEMINI_API_KEY`
    secret; the flow itself carries no secrets and no sample data.
    2. `loop_check` (`io.kestra.plugin.scripts.python.Script`) reads only the real
    `toolExecutions` of that call and tests two deterministic loop signatures:
    the same tool with the same arguments repeated consecutively
    (`max_identical_repeats`, default 3), and the same two tool calls alternating
    consecutively with identical arguments each time the tool repeats
    (`min_alternating_calls`, default 4). Varied tool use passes, including the
    same tool called with different arguments, which is legitimate iteration
    rather than a loop. A payload that cannot be parsed yields an INCONCLUSIVE
    verdict instead of a quiet pass.
    3. `loop_gate` (`io.kestra.plugin.core.flow.If`) reads only the real verdict
    of `loop_check`. A LOOP or INCONCLUSIVE verdict takes the failing branch.
    4. `loop_blocked` (`io.kestra.plugin.core.execution.Fail`) stops the
    execution with a message naming the actual tool-call count, the longest
    identical run, the longest alternating run, and the reason. Nothing
    downstream runs.
    5. `deliver_answer` (`io.kestra.plugin.core.debug.Return`) runs only on the
    passing branch and returns the agent's `textOutput` unchanged.

    ## How to adapt it

    - Swap `GoogleGemini` for another `io.kestra.plugin.ai.provider` such as
    OpenAI or Anthropic; the gate reads `toolExecutions`, not provider-specific
    fields, so the loop logic is unchanged.
    - Tighten `max_identical_repeats` to 2 for agents that should never repeat a
    call, or relax it for agents that legitimately retry a flaky tool once.
    - Add a retry branch instead of failing outright, by replacing the Fail task
    with a second agent call that carries a note naming the repeated tool, so
    the agent can break out of the loop with that context.
    - Record every gated call in a table or KV store for a loop-rate dashboard:
    the flow outputs already carry the verdict, the tool-call count, and the
    reason for every run.
    - This gate complements a budget watchdog rather than replacing it: the
    budget caps total cost, while this gate catches a short loop that stays
    well under any budget cap.

  tags:
    - AI
  subTags:
    - Agents & Structured Output
  ee: false
  demo: false
  metaDescription: "Fail a live AI agent call the moment its tool calls fall into a repetition loop, before any downstream task sees the answer."
