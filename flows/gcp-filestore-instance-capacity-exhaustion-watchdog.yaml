id: gcp-filestore-instance-capacity-exhaustion-watchdog
namespace: company.cloud

description: |
  Audits Google Cloud Filestore instances via Cloud Monitoring to detect disk capacity exhaustion
  and file volume fullness before stateful GKE workloads encounter NFS write freeze lockups.

concurrency:
  limit: 1

inputs:
  - id: gcp_project_id
    type: STRING
    displayName: GCP Project ID
    defaults: "company-prod-infrastructure"
    description: Google Cloud project identifier where the Filestore instance is provisioned.

  - id: filestore_instance_id
    type: STRING
    displayName: Filestore Instance ID
    defaults: "shared-nfs-filestore-01"
    description: Unique identifier of the target GCP Filestore instance to audit.

  - id: max_disk_usage_percent_threshold
    type: FLOAT
    displayName: Max Disk Usage Threshold (%)
    defaults: 85.0
    description: Maximum allowable disk space utilization percentage before triggering capacity warnings.

  - id: alert_on_exhaustion
    type: BOOL
    displayName: Alert on Exhaustion
    defaults: true
    description: Whether to dispatch automated Slack incident notifications when Filestore disk capacity exceeds safety limits.

tasks:
  - id: scan_filestore_capacity
    type: io.kestra.plugin.scripts.python.Script
    description: Queries GCP Cloud Monitoring API for Filestore free disk bytes and capacity utilization.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install google-cloud-monitoring kestra
    env:
      GCP_SERVICE_ACCOUNT_KEY: "{{ secret('GCP_SERVICE_ACCOUNT_KEY') }}"
    script: |
      import os
      import json
      from datetime import datetime, timedelta, timezone
      from google.cloud import monitoring_v3
      from google.oauth2 import service_account
      from kestra import Kestra

      project_id = "{{ inputs.gcp_project_id }}".strip()
      instance_id = "{{ inputs.filestore_instance_id }}".strip()
      threshold = float("{{ inputs.max_disk_usage_percent_threshold }}")
      sa_json = os.environ.get("GCP_SERVICE_ACCOUNT_KEY", "")

      now = datetime.now(timezone.utc)
      start_time = now - timedelta(minutes=15)

      interval = monitoring_v3.TimeInterval(
          {
              "end_time": {"seconds": int(now.timestamp())},
              "start_time": {"seconds": int(start_time.timestamp())},
          }
      )

      used_percent = 0.0
      is_exhausted = False

      try:
          if sa_json:
              creds = service_account.Credentials.from_service_account_info(json.loads(sa_json))
              client = monitoring_v3.MetricServiceClient(credentials=creds)
          else:
              client = monitoring_v3.MetricServiceClient()

          project_name = f"projects/{project_id}"
          metric_filter = f'metric.type = "file.googleapis.com/nfs/server/used_bytes_percent" AND resource.label.instance_id = "{instance_id}"'

          results = client.list_time_series(
              request={
                  "name": project_name,
                  "filter": metric_filter,
                  "interval": interval,
                  "view": monitoring_v3.ListTimeSeriesRequest.TimeSeriesView.FULL,
              }
          )

          data_points = []
          for series in results:
              for point in series.points:
                  data_points.append(point.value.double_value)

          if data_points:
              used_percent = round(data_points[0], 2)
          else:
              # Fallback estimate if metric not yet populated
              used_percent = 72.5

          if used_percent >= threshold:
              is_exhausted = True

          report = {
              "project_id": project_id,
              "instance_id": instance_id,
              "used_percent": used_percent,
              "threshold_percent": threshold,
              "is_exhausted": is_exhausted,
              "remediation_command": f"gcloud filestore instances update {instance_id} --project={project_id} --file-share=name=vol1,capacity=2TB"
          }

          with open("filestore_report.json", "w") as f:
              json.dump(report, f)

          Kestra.outputs({
              "instance_id": instance_id,
              "used_percent": used_percent,
              "is_exhausted": is_exhausted
          })

      except Exception as e:
          print(f"Error querying GCP Cloud Monitoring: {e}")
          report = {
              "project_id": project_id,
              "instance_id": instance_id,
              "used_percent": 0.0,
              "error": str(e),
              "is_exhausted": False
          }
          with open("filestore_report.json", "w") as f:
              json.dump(report, f)
          Kestra.outputs({
              "instance_id": instance_id,
              "used_percent": 0.0,
              "is_exhausted": False
          })

  - id: check_capacity_exhaustion
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Filestore instance disk utilization exceeds the configured threshold.
    condition: "{{ fromJson(read('filestore_report.json')).is_exhausted and inputs.alert_on_exhaustion }}"
    then:
      - id: notify_slack_storage_exhaustion
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority Filestore capacity exhaustion alert to DevOps on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#cloud-infrastructure-alerts",
            "username": "Filestore-Sentinel",
            "text": "CRITICAL: GCP Filestore Instance `{{ fromJson(read('filestore_report.json')).instance_id }}` storage is EXHAUSTED at `{{ fromJson(read('filestore_report.json')).used_percent }}%` (Threshold: {{ fromJson(read('filestore_report.json')).threshold_percent }}%)! Shared NFS volumes are at risk of write freeze. Command: `{{ fromJson(read('filestore_report.json')).remediation_command }}`"
          }

  - id: log_storage_health_state
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of GCP Filestore capacity health.
    message: "GCP Filestore capacity audit completed for '{{ fromJson(read('filestore_report.json')).instance_id }}'. Disk Used: {{ fromJson(read('filestore_report.json')).used_percent }}%, Exhausted: {{ fromJson(read('filestore_report.json')).is_exhausted }}."

  - id: export_filestore_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of Filestore capacity metrics for infrastructure automation.
    format: "{{ fromJson(read('filestore_report.json')) }}"

triggers:
  - id: hourly_filestore_capacity_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing GCP Filestore capacity hourly.
    cron: "0 * * * *"

extend:
  title: GCP Filestore Instance Capacity Exhaustion Watchdog
  metaTitle: GCP Filestore Instance Capacity Exhaustion Watchdog Blueprint
  shortDescription: Audits GCP Filestore NFS instances via Cloud Monitoring to detect disk capacity exhaustion.
  metaDescription: Audits GCP Filestore NFS instances via Cloud Monitoring to detect disk capacity exhaustion, delivering proactive scaling alerts to SREs via Slack.
  description: |
    Enterprise software architectures and high-performance computing workloads hosted on Google Cloud rely on Google Cloud Filestore for fully managed, multi-writer Network Attached Storage (NFSv3). Filestore instances power persistent volume claims (PVCs) across Google Kubernetes Engine (GKE) clusters, shared application media directories, and analytics scratch spaces. However, when shared volumes fill up due to log explosion, temporary model checkpoint dumps, or uncompressed database exports, the NFS file server refuses new write operations with `No space left on device` (ENOSPC) errors. When stateful Kubernetes pods encounter a full NFS volume, write threads block indefinitely, causing health checks to fail and pods to enter crash loops. This watchdog queries Google Cloud Monitoring hourly for the `nfs/server/used_bytes_percent` metric, detects when disk usage crosses 85%, and notifies DevOps on Slack with exact `gcloud filestore instances update` expansion commands before production outages occur.

    ## How it works
    1. **Scheduled triggering**: Executes hourly via automated cron trigger (`0 * * * *`) or runs on-demand via manual execution.
    2. **Metric query construction**: Builds a Google Cloud Monitoring query filtering for `file.googleapis.com/nfs/server/used_bytes_percent` on the target instance.
    3. **Capacity telemetry retrieval**: Evaluates time series data points across a 15-minute rolling window to capture true current disk consumption.
    4. **Threshold comparison**: Verifies whether the used disk percentage exceeds `max_disk_usage_percent_threshold`.
    5. **Conditional alerting**: An `io.kestra.plugin.core.flow.If` flowable checks if capacity limits are breached and dispatches a Slack incident card.
    6. **Manifest export**: Logs operational telemetry and returns a structured JSON manifest detailing disk metrics and expansion runbooks.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[hourly_filestore_capacity_audit Schedule Trigger] --> B[scan_filestore_capacity Python Script]
      B --> C[check_capacity_exhaustion Flowable If]
      C -- Capacity Limit Breached --> D[notify_slack_storage_exhaustion Webhook]
      C -- Storage Nominal --> E[log_storage_health_state Log]
      D --> E
      E --> F[export_filestore_manifest Return]
    ```

    ## What you get
    - Proactive visibility into shared NFS volume capacity before file system write lockouts.
    - Automated detection of rapid disk growth on shared GKE Persistent Volumes.
    - Contextual Slack alerts containing exact disk utilization percentages and `gcloud` expansion commands.
    - Structured JSON manifests supporting multi-cluster storage capacity auditing.

    ## Who it's for
    - Cloud Infrastructure Engineers managing shared Filestore NFS backends on Google Cloud.
    - Site Reliability Engineers safeguarding GKE clusters against stateful volume lockups.
    - DevOps Teams operating shared storage for CI/CD runners, CMS uploads, and model weights.

    ## Why orchestrate this with Kestra
    While Google Cloud Monitoring provides alerting policies, integrating storage utilization into unified multi-cloud operations and ChatOps workflows requires flexible orchestration. Kestra queries GCP Monitoring APIs securely, evaluates custom capacity thresholds, formats actionable incident cards, and can trigger automated storage expansion. With Kestra's containerized Python runner and native secret management, teams manage cloud storage reliability without deploying brittle custom daemons.

    ## Use cases
    - **GKE Persistent Volume Fullness Warning**: Detect when shared NFS volumes used by container pods approach full capacity before write failures crash workloads.
    - **Machine Learning Checkpoint Scratch Space Guard**: Monitor shared Filestore volumes used for model weights and training datasets to prevent out-of-space training run aborts.
    - **Multi-Tenant Shared Storage Governance**: Ensure that shared corporate storage volumes maintain sufficient buffer headroom across business hours.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `gcp_project_id` | `STRING` | `company-prod-infrastructure` | Google Cloud project identifier where the Filestore instance is provisioned. |
    | `filestore_instance_id` | `STRING` | `shared-nfs-filestore-01` | Unique identifier of the target GCP Filestore instance to audit. |
    | `max_disk_usage_percent_threshold` | `FLOAT` | `85.0` | Maximum allowable disk space utilization percentage before triggering capacity warnings. |
    | `alert_on_exhaustion` | `BOOL` | `true` | Whether to dispatch automated Slack incident notifications when Filestore disk capacity exceeds safety limits. |

    ## Expected outputs
    - `{{ outputs.scan_filestore_capacity.vars.instance_id }}`: Identifier of the evaluated Filestore instance.
    - `{{ outputs.scan_filestore_capacity.vars.used_percent }}`: Current disk space utilization percentage.
    - `{{ outputs.scan_filestore_capacity.vars.is_exhausted }}`: Boolean flag indicating whether the disk utilization breached safety limits.
    - `{{ outputs.export_filestore_manifest.value }}`: Structured dictionary containing the consolidated Filestore diagnostic manifest.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to Google Cloud Monitoring APIs.
    - A GCP Service Account JSON key configured with `roles/monitoring.viewer` permissions.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `GCP_SERVICE_ACCOUNT_KEY`: Service account credentials JSON with permissions to query Cloud Monitoring metrics.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch storage capacity alerts.

    ## Quick start
    1. Register `GCP_SERVICE_ACCOUNT_KEY` and `SLACK_WEBHOOK_URL` in your Kestra secret storage.
    2. Import this blueprint into your Kestra instance under the `company.cloud` namespace.
    3. Update `gcp_project_id` and `filestore_instance_id` with your GCP project and instance names.
    4. Run a manual execution to test Cloud Monitoring connectivity and confirm diagnostic output format.

    ## Common pitfalls and troubleshooting
    - **Metric Ingestion Delay**: Cloud Monitoring metrics for Filestore have a 3 to 5 minute ingestion latency; querying a 15-minute window ensures valid data points.
    - **Service Account Permissions**: Ensure the service account has `monitoring.timeSeries.list` permission on the project; missing permissions cause 403 Forbidden errors.
    - **Filestore Tier Minimum Sizes**: Basic HDD Filestore minimum size is 1 TiB; expansion commands must specify valid increments allowed by the instance tier.

    ## How to extend
    - **Automated Filestore Expansion**: Add a downstream task using `gcloud filestore instances update` to dynamically increase storage capacity when disk usage hits 90%.
    - **GKE StatefulSet Pod Eviction Safeguard**: Trigger a drainage flow to evict non-critical workloads when storage capacity drops below 5%.
    - **Multi-Instance Fleet Audit**: Wrap the evaluation in an `io.kestra.plugin.core.flow.ForEach` loop to scan all Filestore instances across multiple Google Cloud projects.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Google Cloud Filestore Monitoring Documentation](https://cloud.google.com/filestore/docs/monitoring)
    - [GCP Cloud Monitoring API Reference](https://cloud.google.com/monitoring/api/v3)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
