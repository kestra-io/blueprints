id: aws-rds-storage-exhaustion-and-autoscaling-cap-sentinel
namespace: company.database
description: |
  Monitors Amazon RDS instances for storage exhaustion, CloudWatch free disk depletion,
  and storage autoscaling cap saturation, alerting database engineers on Slack.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    description: AWS Region where the target Amazon RDS DB instance is deployed.
    defaults: us-east-1

  - id: db_instance_identifier
    type: STRING
    displayName: RDS Instance Identifier
    description: Unique identifier of the Amazon RDS database instance to audit.
    defaults: production-postgres-primary

  - id: warning_free_storage_percentage
    type: FLOAT
    displayName: Warning Free Storage Threshold (%)
    description: Minimum acceptable percentage of free disk space before triggering a warning alert.
    defaults: 15.0

  - id: warning_autoscaling_headroom_percentage
    type: FLOAT
    displayName: Warning Autoscaling Headroom (%)
    description: Minimum acceptable autoscaling expansion headroom percentage remaining before alerting.
    defaults: 10.0

  - id: slack_channel
    type: STRING
    displayName: Alert Channel
    description: Slack channel destination for database storage exhaustion and autoscaling alerts.
    defaults: "#database-alerts"

triggers:
  - id: periodic_storage_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled storage check run every 6 hours matching the AWS RDS autoscaling cooldown interval.
    cron: "0 */6 * * *"
    disabled: true

tasks:
  - id: audit_rds_storage_and_autoscaling
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Query RDS instance configuration and CloudWatch FreeStorageSpace metric to evaluate disk exhaustion risk.
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        set -euo pipefail

        START_TIME=$(date -u -v-60M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "60 minutes ago" +%Y-%m-%dT%H:%M:%SZ)
        END_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        aws rds describe-db-instances \
          --db-instance-identifier "{{ inputs.db_instance_identifier }}" \
          --output json > /tmp/rds_instance.json

        aws cloudwatch get-metric-data \
          --metric-data-queries '[{"Id":"free_storage","MetricStat":{"Metric":{"Namespace":"AWS/RDS","MetricName":"FreeStorageSpace","Dimensions":[{"Name":"DBInstanceIdentifier","Value":"{{ inputs.db_instance_identifier }}"}]},"Period":300,"Stat":"Minimum"},"ReturnData":true}]' \
          --start-time "$START_TIME" \
          --end-time "$END_TIME" \
          --output json > /tmp/free_storage.json

        ALLOCATED_GB=$(jq -r '.DBInstances[0].AllocatedStorage // 0' /tmp/rds_instance.json)
        MAX_ALLOCATED_GB=$(jq -r '.DBInstances[0].MaxAllocatedStorage // 0' /tmp/rds_instance.json)
        STORAGE_TYPE=$(jq -r '.DBInstances[0].StorageType // "unknown"' /tmp/rds_instance.json)
        ENGINE=$(jq -r '.DBInstances[0].Engine // "unknown"' /tmp/rds_instance.json)
        DB_STATUS=$(jq -r '.DBInstances[0].DBInstanceStatus // "unknown"' /tmp/rds_instance.json)

        FREE_BYTES=$(jq -r '.MetricDataResults[0].Values[0] // empty' /tmp/free_storage.json)

        if [ -z "$FREE_BYTES" ] || [ "$FREE_BYTES" = "null" ]; then
          METRIC_AVAILABLE="false"
          FREE_GB="0.00"
          FREE_PCT="0.00"
        else
          METRIC_AVAILABLE="true"
          FREE_GB=$(awk -v b="$FREE_BYTES" 'BEGIN { printf "%.2f", b / (1024*1024*1024) }')
          FREE_PCT=$(awk -v f="$FREE_GB" -v a="$ALLOCATED_GB" 'BEGIN { if (a > 0) printf "%.2f", (f / a) * 100; else print "0.00" }')
        fi

        if [ "$MAX_ALLOCATED_GB" -gt 0 ] 2>/dev/null; then
          AUTOSCALING_ENABLED="true"
          HEADROOM_GB=$(awk -v m="$MAX_ALLOCATED_GB" -v a="$ALLOCATED_GB" 'BEGIN { if (m > a) printf "%.2f", m - a; else print "0.00" }')
          HEADROOM_PCT=$(awk -v m="$MAX_ALLOCATED_GB" -v h="$HEADROOM_GB" 'BEGIN { if (m > 0) printf "%.2f", (h / m) * 100; else print "0.00" }')
          if [ "$(awk -v h="$HEADROOM_GB" 'BEGIN { print (h <= 0) }')" -eq 1 ]; then
            AUTOSCALING_STATUS="CEILING_REACHED"
          else
            AUTOSCALING_STATUS="ACTIVE"
          fi
        else
          AUTOSCALING_ENABLED="false"
          HEADROOM_GB="0.00"
          HEADROOM_PCT="0.00"
          AUTOSCALING_STATUS="DISABLED"
        fi

        WARN_FREE_THRESH="{{ inputs.warning_free_storage_percentage }}"
        WARN_HEADROOM_THRESH="{{ inputs.warning_autoscaling_headroom_percentage }}"

        if [ "$METRIC_AVAILABLE" = "false" ]; then
          IS_CRITICAL="false"
          IS_WARNING="false"
        else
          IS_CRITICAL=$(awk -v f="$FREE_PCT" -v h="$HEADROOM_GB" -v auto="$AUTOSCALING_STATUS" 'BEGIN {
            if (f < 10.0 || (auto == "CEILING_REACHED" && f < 15.0)) print "true"; else print "false"
          }')

          IS_WARNING=$(awk -v f="$FREE_PCT" -v wf="$WARN_FREE_THRESH" -v hp="$HEADROOM_PCT" -v wh="$WARN_HEADROOM_THRESH" -v auto="$AUTOSCALING_STATUS" -v crit="$IS_CRITICAL" 'BEGIN {
            if (crit == "true" || f < wf || (auto == "ACTIVE" && hp < wh) || (auto == "DISABLED" && f < wf)) print "true"; else print "false"
          }')
        fi

        echo "::{\"outputs\": {\"allocated_storage_gb\": $ALLOCATED_GB, \"max_allocated_storage_gb\": $MAX_ALLOCATED_GB, \"free_storage_gb\": $FREE_GB, \"free_storage_pct\": $FREE_PCT, \"autoscaling_headroom_gb\": $HEADROOM_GB, \"autoscaling_headroom_pct\": $HEADROOM_PCT, \"autoscaling_status\": \"$AUTOSCALING_STATUS\", \"autoscaling_enabled\": $AUTOSCALING_ENABLED, \"metric_available\": $METRIC_AVAILABLE, \"storage_type\": \"$STORAGE_TYPE\", \"engine\": \"$ENGINE\", \"db_status\": \"$DB_STATUS\", \"is_critical\": $IS_CRITICAL, \"is_warning\": $IS_WARNING}}::"

  - id: evaluate_storage_risk
    type: io.kestra.plugin.core.flow.If
    description: Branch execution when storage depletion or autoscaling ceiling saturation is detected.
    condition: "{{ outputs.audit_rds_storage_and_autoscaling.vars.is_warning == true }}"
    then:
      - id: notify_slack_storage_risk
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority storage risk alert with capacity metrics and remediation instructions.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*AWS RDS Storage and Autoscaling Risk Alert*\n• *Instance*: `{{ inputs.db_instance_identifier }}` (Engine: `{{ outputs.audit_rds_storage_and_autoscaling.vars.engine }}`, Type: `{{ outputs.audit_rds_storage_and_autoscaling.vars.storage_type }}`)\n• *Status*: `{{ outputs.audit_rds_storage_and_autoscaling.vars.db_status }}` | *Severity*: `{{ outputs.audit_rds_storage_and_autoscaling.vars.is_critical ? 'CRITICAL' : 'WARNING' }}`\n• *Free Disk Space*: `{{ outputs.audit_rds_storage_and_autoscaling.vars.free_storage_gb }} GB` (`{{ outputs.audit_rds_storage_and_autoscaling.vars.free_storage_pct }}%` remaining, threshold: `{{ inputs.warning_free_storage_percentage }}%`)\n• *Allocated Storage*: `{{ outputs.audit_rds_storage_and_autoscaling.vars.allocated_storage_gb }} GB`\n• *Autoscaling Max Limit*: `{{ outputs.audit_rds_storage_and_autoscaling.vars.max_allocated_storage_gb }} GB` (Status: `{{ outputs.audit_rds_storage_and_autoscaling.vars.autoscaling_status }}`)\n• *Autoscaling Headroom*: `{{ outputs.audit_rds_storage_and_autoscaling.vars.autoscaling_headroom_gb }} GB` (`{{ outputs.audit_rds_storage_and_autoscaling.vars.autoscaling_headroom_pct }}%` remaining, threshold: `{{ inputs.warning_autoscaling_headroom_percentage }}%`)\n• *Root Cause*: {{ outputs.audit_rds_storage_and_autoscaling.vars.autoscaling_status == 'CEILING_REACHED' ? 'Database has reached its MaxAllocatedStorage limit and autoscaling is completely blocked. Continued write operations will cause immediate outage.' : (outputs.audit_rds_storage_and_autoscaling.vars.autoscaling_status == 'DISABLED' ? 'Storage autoscaling is disabled on this instance. Disk space is depleting and requires immediate manual volume expansion.' : 'Storage autoscaling is active but approaching maximum capacity limits or depleting rapidly within the 6-hour cooldown window.') }}\n• *Remediation*: Increase autoscaling ceiling or expand allocated storage via AWS CLI:\n```aws rds modify-db-instance --db-instance-identifier {{ inputs.db_instance_identifier }} --max-allocated-storage <new_limit_gb> --apply-immediately```"
          }

  - id: export_storage_telemetry
    type: io.kestra.plugin.core.debug.Return
    description: Export structured telemetry recording storage state and risk level.
    format:
      db_instance: "{{ inputs.db_instance_identifier }}"
      engine: "{{ outputs.audit_rds_storage_and_autoscaling.vars.engine }}"
      allocated_storage_gb: "{{ outputs.audit_rds_storage_and_autoscaling.vars.allocated_storage_gb }}"
      free_storage_gb: "{{ outputs.audit_rds_storage_and_autoscaling.vars.free_storage_gb }}"
      free_storage_pct: "{{ outputs.audit_rds_storage_and_autoscaling.vars.free_storage_pct }}"
      max_allocated_storage_gb: "{{ outputs.audit_rds_storage_and_autoscaling.vars.max_allocated_storage_gb }}"
      autoscaling_status: "{{ outputs.audit_rds_storage_and_autoscaling.vars.autoscaling_status }}"
      autoscaling_headroom_gb: "{{ outputs.audit_rds_storage_and_autoscaling.vars.autoscaling_headroom_gb }}"
      risk_level: "{{ outputs.audit_rds_storage_and_autoscaling.vars.is_critical ? 'CRITICAL' : (outputs.audit_rds_storage_and_autoscaling.vars.is_warning ? 'WARNING' : 'HEALTHY') }}"

extend:
  title: AWS RDS Storage Exhaustion and Autoscaling Cap Sentinel
  metaDescription: Audit Amazon RDS storage usage and autoscaling headroom via CloudWatch, flag storage exhaustion risks before database failure, and alert Slack.
  description: |
    Automated Amazon RDS reliability sentinel that monitors database disk consumption, CloudWatch `FreeStorageSpace` trends, and storage autoscaling maximum cap headroom. Identifies storage exhaustion risks, warns when autoscaling ceilings are reached or disabled, and alerts database reliability engineers on Slack.

    ## What this blueprint does

    In enterprise cloud environments, Amazon RDS instances can experience abrupt downtime when database storage is exhausted. While AWS Storage Autoscaling automatically increases allocated storage when free space drops below 10%, two critical failure modes remain:

    1. **Autoscaling Ceiling Saturation**: Once an instance reaches its configured `MaxAllocatedStorage` limit, autoscaling halts permanently. Subsequent write activity triggers a `storage-full` state and database crash.
    2. **Autoscaling Cooldown Vulnerability**: AWS enforces a mandatory 6-hour cooldown period between storage expansion events. Rapid batch imports, runaway write spikes, or temporary table spills that deplete storage faster than the 6-hour window will crash the database before AWS permits another expansion.

    This blueprint proactively inspects both real-time free storage and long-term autoscaling capacity:

    1. Retrieves instance storage metadata (`AllocatedStorage`, `MaxAllocatedStorage`, `StorageType`, `Engine`) via the AWS RDS API.
    2. Queries Amazon CloudWatch for minimum `FreeStorageSpace` over the past hour.
    3. Calculates available free disk percentage and remaining autoscaling headroom (GB and percentage).
    4. Evaluates whether the instance has reached its autoscaling cap, has autoscaling disabled, or is within critical exhaustion thresholds.
    5. Dispatches an actionable Slack alert with diagnostic details and AWS CLI remediation commands when risk thresholds are breached.
    6. Emits structured telemetry for downstream monitoring and compliance auditing.

    ## How it works

    1. **Scheduled Execution**: Runs periodically every 6 hours via `periodic_storage_audit` (matching the AWS RDS storage autoscaling cooldown interval) or on demand.
    2. **Telemetry Extraction**: The `audit_rds_storage_and_autoscaling` task uses `io.kestra.plugin.aws.cli.AwsCLI` to describe the DB instance and fetch CloudWatch metric data in a single pass.
    3. **Risk Computation**: The shell script calculates current free storage percentage, computes expansion headroom against `MaxAllocatedStorage`, and determines risk severity (`CRITICAL`, `WARNING`, or `HEALTHY`).
    4. **Conditional Alerting**: The `evaluate_storage_risk` flow branches on `outputs.audit_rds_storage_and_autoscaling.vars.is_warning`. When warning conditions are met, `notify_slack_storage_risk` delivers an alert to the designated Slack channel.
    5. **Telemetry Manifest**: The `export_storage_telemetry` task records full metrics in the execution outputs for tracking and observability.

    ## Who it is for

    - **Database Administrators & Reliability Engineers**: Protecting production RDS instances from catastrophic disk full crashes.
    - **DevOps & Cloud Infrastructure Teams**: Monitoring storage autoscaling caps and ensuring databases have adequate headroom for traffic surges.
    - **FinOps Practitioners**: Tracking storage allocation growth against autoscaling budgets.

    ## Why orchestrate this with Kestra

    AWS CloudWatch alarms can notify when disk space is low, but they cannot correlate CloudWatch metrics with RDS configuration properties like `MaxAllocatedStorage` to determine whether autoscaling is blocked. Kestra combines AWS CLI introspection, metric evaluation, conditional branching, and Slack notification into an automated, declarative workflow.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | STRING | `us-east-1` | AWS Region hosting the target RDS database instance. |
    | `db_instance_identifier` | STRING | `production-postgres-primary` | Unique identifier of the Amazon RDS database instance. |
    | `warning_free_storage_percentage` | FLOAT | `15.0` | Minimum acceptable percentage of free disk space before triggering a warning alert. |
    | `warning_autoscaling_headroom_percentage` | FLOAT | `10.0` | Minimum acceptable autoscaling expansion headroom percentage remaining before alerting. |
    | `slack_channel` | STRING | `#database-alerts` | Slack channel destination for storage alerts. |

    ## Expected outputs

    - `{{ outputs.audit_rds_storage_and_autoscaling.vars }}`: Structured telemetry including `allocated_storage_gb`, `max_allocated_storage_gb`, `free_storage_gb`, `free_storage_pct`, `autoscaling_headroom_gb`, `autoscaling_headroom_pct`, `autoscaling_status`, `storage_type`, `engine`, `is_critical`, and `is_warning`.
    - `{{ outputs.export_storage_telemetry.value }}`: Final risk assessment summary (`CRITICAL`, `WARNING`, or `HEALTHY`) with key instance metrics.

    ## Prerequisites

    - An AWS account with permissions to execute `rds:DescribeDBInstances` and `cloudwatch:GetMetricData`.
    - An Amazon RDS database instance (PostgreSQL, MySQL, MariaDB, Oracle, or SQL Server).
    - A Slack Incoming Webhook URL configured for your database alerting channel.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID with read access to RDS and CloudWatch.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key corresponding to the access key ID.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for sending storage risk notifications.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI, specifying your target `db_instance_identifier` and `aws_region`.
    4. Review execution outputs to inspect current free storage and autoscaling headroom metrics.

    ## Common pitfalls and troubleshooting

    - **Aurora vs Standard RDS**: Amazon Aurora clusters manage storage dynamically across an elastic shared distributed storage volume (up to 128 TiB) without pre-allocated storage or autoscaling caps (`AllocatedStorage` is returned as a dummy value of 1). This sentinel is designed specifically for provisioned Amazon RDS engines (RDS PostgreSQL, MySQL, MariaDB, Oracle, SQL Server) that enforce volume sizing and storage autoscaling ceilings.
    - **Cooldown Window Latency**: AWS RDS storage autoscaling requires a 6-hour stabilization cooldown between storage modifications. Running the sentinel every 6 hours aligns directly with this operational window.
    - **Missing MaxAllocatedStorage**: Older RDS instances created without storage autoscaling return a null or zero `MaxAllocatedStorage`. The blueprint detects this scenario and marks autoscaling as `DISABLED`.
    - **CloudWatch Metric Granularity & Reporting Gaps**: `FreeStorageSpace` is reported at 1-minute to 5-minute intervals. The blueprint queries the minimum value over a 60-minute window to account for transient write spikes, and safely handles reporting gaps without triggering false alerts.

    ## How to extend

    - Add automated Jira or PagerDuty incident creation for instances reaching `CRITICAL` severity.
    - Loop over all RDS instances in an AWS region using `io.kestra.plugin.core.flow.ForEachItem` to provide multi-database fleet coverage.
    - Automate storage expansion by triggering an approval task that calls `aws rds modify-db-instance` directly from Kestra.

    ## Links

    - Kestra AWS Plugin Documentation: https://kestra.io/plugins/plugin-aws
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - AWS RDS Storage Autoscaling Documentation: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.StorageTypes.html#USER_PIOPS.Autoscaling
  tags:
    - Cloud
    - Infrastructure
    - Data
  subTags:
    - Storage & Backup
    - Databases
  ee: false
  demo: false
