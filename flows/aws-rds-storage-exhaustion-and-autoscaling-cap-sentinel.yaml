id: aws-rds-storage-exhaustion-and-autoscaling-cap-sentinel
namespace: company.database
description: |
  Monitors Amazon RDS instances across a region for storage exhaustion, CloudWatch free disk depletion,
  and storage autoscaling cap saturation, alerting database engineers on Slack.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    description: AWS Region where Amazon RDS DB instances are deployed.
    defaults: us-east-1

  - id: warning_free_storage_percentage
    type: FLOAT
    displayName: Warning Free Storage Threshold (%)
    description: Minimum acceptable percentage of free disk space before triggering a warning alert.
    defaults: 15.0

  - id: warning_autoscaling_headroom_percentage
    type: FLOAT
    displayName: Warning Autoscaling Headroom (%)
    description: Minimum acceptable autoscaling expansion headroom percentage remaining before alerting.
    defaults: 10.0

triggers:
  - id: periodic_storage_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled storage check run every 6 hours matching the AWS RDS autoscaling cooldown interval.
    cron: "0 */6 * * *"
    disabled: true

tasks:
  - id: audit_rds_storage_and_autoscaling
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Query regional RDS instances and CloudWatch FreeStorageSpace metrics to evaluate disk exhaustion risk.
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        set -euo pipefail

        START_TIME=$(date -u -v-60M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "60 minutes ago" +%Y-%m-%dT%H:%M:%SZ)
        END_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        aws rds describe-db-instances --output json > /tmp/rds_instances.json

        echo "[]" > /tmp/at_risk_instances.json
        TOTAL_COUNT=0
        AUDITED_COUNT=0

        while IFS= read -r instance_json; do
          TOTAL_COUNT=$((TOTAL_COUNT + 1))
          INSTANCE_ID=$(echo "$instance_json" | jq -r '.DBInstanceIdentifier')
          ALLOCATED_GB=$(echo "$instance_json" | jq -r '.AllocatedStorage // 0')
          MAX_ALLOCATED_GB=$(echo "$instance_json" | jq -r '.MaxAllocatedStorage // 0')
          STORAGE_TYPE=$(echo "$instance_json" | jq -r '.StorageType // "unknown"')
          ENGINE=$(echo "$instance_json" | jq -r '.Engine // "unknown"')
          DB_STATUS=$(echo "$instance_json" | jq -r '.DBInstanceStatus // "unknown"')

          aws cloudwatch get-metric-data \
            --metric-data-queries "[{\"Id\":\"free_storage\",\"MetricStat\":{\"Metric\":{\"Namespace\":\"AWS/RDS\",\"MetricName\":\"FreeStorageSpace\",\"Dimensions\":[{\"Name\":\"DBInstanceIdentifier\",\"Value\":\"$INSTANCE_ID\"}]},\"Period\":300,\"Stat\":\"Minimum\"},\"ReturnData\":true}]" \
            --start-time "$START_TIME" \
            --end-time "$END_TIME" \
            --output json > /tmp/free_storage.json

          FREE_BYTES=$(jq -r '[.MetricDataResults[0].Values[]] | min // empty' /tmp/free_storage.json)

          if [ -z "$FREE_BYTES" ] || [ "$FREE_BYTES" = "null" ]; then
            FREE_GB="0.00"
            FREE_PCT="0.00"
          else
            FREE_GB=$(awk -v b="$FREE_BYTES" 'BEGIN { printf "%.2f", b / (1024*1024*1024) }')
            FREE_PCT=$(awk -v f="$FREE_GB" -v a="$ALLOCATED_GB" 'BEGIN { if (a > 0) printf "%.2f", (f / a) * 100; else print "0.00" }')
          fi

          if [ "$MAX_ALLOCATED_GB" -gt 0 ] 2>/dev/null; then
            AUTOSCALING_ENABLED="true"
            HEADROOM_GB=$(awk -v m="$MAX_ALLOCATED_GB" -v a="$ALLOCATED_GB" 'BEGIN { if (m > a) printf "%.2f", m - a; else print "0.00" }')
            HEADROOM_PCT=$(awk -v m="$MAX_ALLOCATED_GB" -v h="$HEADROOM_GB" 'BEGIN { if (m > 0) printf "%.2f", (h / m) * 100; else print "0.00" }')
            if [ "$(awk -v h="$HEADROOM_GB" 'BEGIN { print (h <= 0) }')" -eq 1 ]; then
              AUTOSCALING_STATUS="CEILING_REACHED"
            else
              AUTOSCALING_STATUS="ACTIVE"
            fi
          else
            AUTOSCALING_ENABLED="false"
            HEADROOM_GB="0.00"
            HEADROOM_PCT="0.00"
            AUTOSCALING_STATUS="DISABLED"
          fi

          IS_CRITICAL="false"
          IS_WARNING="false"

          if [ "$AUTOSCALING_STATUS" = "CEILING_REACHED" ]; then
            IS_CRITICAL="true"
            IS_WARNING="true"
          elif [ "$AUTOSCALING_ENABLED" = "true" ] && [ "$(awk -v h="$HEADROOM_PCT" -v t="{{ inputs.warning_autoscaling_headroom_percentage }}" 'BEGIN { print (h <= t) }')" -eq 1 ]; then
            IS_WARNING="true"
          fi

          if [ "$(awk -v f="$FREE_PCT" -v t="{{ inputs.warning_free_storage_percentage }}" 'BEGIN { print (f <= t) }')" -eq 1 ]; then
            IS_WARNING="true"
            if [ "$(awk -v f="$FREE_PCT" 'BEGIN { print (f <= 5.0) }')" -eq 1 ]; then
              IS_CRITICAL="true"
            fi
          fi

          AUDITED_COUNT=$((AUDITED_COUNT + 1))

          if [ "$IS_WARNING" = "true" ]; then
            ENTRY=$(jq -n \
              --arg id "$INSTANCE_ID" \
              --arg engine "$ENGINE" \
              --arg status "$DB_STATUS" \
              --arg type "$STORAGE_TYPE" \
              --arg alloc "$ALLOCATED_GB" \
              --arg max "$MAX_ALLOCATED_GB" \
              --arg free_gb "$FREE_GB" \
              --arg free_pct "$FREE_PCT" \
              --arg headroom_gb "$HEADROOM_GB" \
              --arg headroom_pct "$HEADROOM_PCT" \
              --arg as_status "$AUTOSCALING_STATUS" \
              --argjson crit "$IS_CRITICAL" \
              '{db_instance_identifier: $id, engine: $engine, db_status: $status, storage_type: $type, allocated_storage_gb: $alloc, max_allocated_storage_gb: $max, free_storage_gb: $free_gb, free_storage_pct: $free_pct, autoscaling_headroom_gb: $headroom_gb, autoscaling_headroom_pct: $headroom_pct, autoscaling_status: $as_status, is_critical: $crit}')
            jq --argjson entry "$ENTRY" '. += [$entry]' /tmp/at_risk_instances.json > /tmp/at_risk_tmp.json && mv /tmp/at_risk_tmp.json /tmp/at_risk_instances.json
          fi
        done < <(jq -c '.DBInstances[] | select((.Engine // "") | startswith("aurora") | not)' /tmp/rds_instances.json)

        AT_RISK_COUNT=$(jq 'length' /tmp/at_risk_instances.json)
        AT_RISK_LIST=$(jq -c . /tmp/at_risk_instances.json)
        SUMMARY_REPORT=$(jq -r '.[] | "• *`" + .db_instance_identifier + "`* (" + .engine + "): Free: " + .free_storage_gb + " GB (" + .free_storage_pct + "%), Autoscaling: " + .autoscaling_status + " (Headroom: " + .autoscaling_headroom_pct + "%)"' /tmp/at_risk_instances.json)

        echo "::set-output name=total_instances::$TOTAL_COUNT::"
        echo "::set-output name=audited_instances::$AUDITED_COUNT::"
        echo "::set-output name=at_risk_count::$AT_RISK_COUNT::"
        echo "::set-output name=at_risk_instances::$AT_RISK_LIST::"
        echo "::set-output name=summary_report::$SUMMARY_REPORT::"

  - id: evaluate_storage_risk
    type: io.kestra.plugin.core.flow.If
    description: Send a targeted alert if any audited database instances are near storage limits or autoscaling caps.
    condition: "{{ outputs.audit_rds_storage_and_autoscaling.vars.at_risk_count | int > 0 }}"
    then:
      - id: notify_slack_storage_risk
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority storage risk notification to the engineering Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "*AWS RDS Storage and Autoscaling Risk Alert*\nAudited `{{ outputs.audit_rds_storage_and_autoscaling.vars.audited_instances }}` Amazon RDS instances in region `{{ inputs.aws_region }}` and detected *{{ outputs.audit_rds_storage_and_autoscaling.vars.at_risk_count }}* instance(s) approaching storage limits or autoscaling ceilings:\n\n{{ outputs.audit_rds_storage_and_autoscaling.vars.summary_report }}\n\n• *Remediation*: Increase autoscaling ceiling or expand storage via AWS CLI:\n```aws rds modify-db-instance --db-instance-identifier <instance_id> --max-allocated-storage <new_limit_gb> --apply-immediately```"
          }

  - id: export_storage_telemetry
    type: io.kestra.plugin.core.debug.Return
    description: Export regional database storage and autoscaling audit telemetry.
    format: |
      Audited {{ outputs.audit_rds_storage_and_autoscaling.vars.audited_instances }} of {{ outputs.audit_rds_storage_and_autoscaling.vars.total_instances }} RDS instances in region {{ inputs.aws_region }}. At risk: {{ outputs.audit_rds_storage_and_autoscaling.vars.at_risk_count }}. Details: {{ outputs.audit_rds_storage_and_autoscaling.vars.at_risk_instances }}.

extend:
  metaDescription: "Audit regional Amazon RDS instances for disk exhaustion and storage autoscaling caps, dispatching proactive Slack alerts to prevent database outages."
  metaTitle: AWS RDS Regional Storage Exhaustion and Autoscaling Cap Sentinel with Kestra
  title: AWS RDS Regional Storage Exhaustion and Autoscaling Cap Sentinel
  shortDescription: Audit regional Amazon RDS instances for disk exhaustion and storage autoscaling caps, alerting SREs on Slack.
  description: |
    ## How it works

    Amazon RDS instances automatically scale storage when free space drops below 10%, but autoscaling halts immediately once an instance reaches its configured `MaxAllocatedStorage` ceiling. Standard CloudWatch alarms track absolute free bytes but cannot cross-reference RDS volume allocations to verify whether autoscaling is blocked or near capacity.

    This blueprint performs a regional fleet audit:
    1. Discovers all provisioned Amazon RDS DB instances across the target AWS region using `aws rds describe-db-instances`.
    2. Filters out Amazon Aurora clusters, which manage storage dynamically across an elastic shared cluster volume up to 128 TiB without pre-allocated volume caps.
    3. Retrieves CloudWatch `FreeStorageSpace` metrics over a 60-minute evaluation window to calculate true available capacity and free disk percentages.
    4. Evaluates whether storage autoscaling is `CEILING_REACHED` (current allocation equals maximum allocation), `ACTIVE` (with remaining expansion headroom), or `DISABLED`.
    5. Dispatches a consolidated Slack notification listing every instance approaching storage exhaustion or its autoscaling ceiling.

    ## What you get

    - **Fleet-Wide Regional Visibility**: Audits every provisioned Amazon RDS database in an AWS region in a single pass.
    - **Autoscaling Ceiling Guard**: Catches instances that have silently exhausted their maximum autoscaling allowance before write-lock outages occur.
    - **Cooldown Interval Parity**: Executes every 6 hours to match the Amazon RDS storage autoscaling modification cooldown window.
    - **Targeted Notifications**: Alerts Slack channels via incoming webhook only when at-risk instances are detected.

    ## Who it's for

    - **Database Administrators & Platform Engineers**: Guarding critical production databases against storage exhaustion.
    - **Site Reliability Engineers (SREs)**: Monitoring database fleets and catching storage growth bottlenecks before incidents occur.
    - **FinOps Practitioners**: Tracking storage allocation expansion against regional budget caps.

    ## Why orchestrate this with Kestra

    AWS CloudWatch alarms can notify when disk space is low, but they cannot correlate CloudWatch metrics with RDS configuration properties like `MaxAllocatedStorage` across a regional fleet. Kestra combines AWS CLI introspection, metric evaluation, conditional branching, and Slack notification into an automated, declarative workflow.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | STRING | `us-east-1` | AWS Region hosting the Amazon RDS database instances. |
    | `warning_free_storage_percentage` | FLOAT | `15.0` | Minimum acceptable percentage of free disk space before triggering a warning alert. |
    | `warning_autoscaling_headroom_percentage` | FLOAT | `10.0` | Minimum acceptable autoscaling expansion headroom percentage remaining before alerting. |

    ## Expected outputs

    - `{{ outputs.audit_rds_storage_and_autoscaling.vars }}`: Structured telemetry including `total_instances`, `audited_instances`, `at_risk_count`, `at_risk_instances`, and `summary_report`.
    - `{{ outputs.export_storage_telemetry.value }}`: Execution summary detailing regional instance counts and at-risk database status.

    ## Prerequisites

    - An AWS account with permissions to execute `rds:DescribeDBInstances` and `cloudwatch:GetMetricData`.
    - Provisioned Amazon RDS database instances (PostgreSQL, MySQL, MariaDB, Oracle, or SQL Server).
    - A Slack Incoming Webhook URL configured for your database alerting channel.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID with read access to RDS and CloudWatch.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key corresponding to the access key ID.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for sending storage risk notifications.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI with your target `aws_region`.
    4. Review execution outputs to inspect regional database storage health and autoscaling status.

    ## Common pitfalls and troubleshooting

    - **Aurora vs Standard RDS**: Amazon Aurora clusters manage storage dynamically across an elastic shared distributed storage volume (up to 128 TiB) without pre-allocated storage or autoscaling caps. The blueprint automatically filters out Aurora engines to focus on provisioned RDS engines that enforce volume sizing and storage autoscaling ceilings.
    - **Cooldown Window Latency**: AWS RDS storage autoscaling requires a 6-hour stabilization cooldown between storage modifications. Running the sentinel every 6 hours aligns directly with this operational window.
    - **Missing MaxAllocatedStorage**: Older RDS instances created without storage autoscaling return a null or zero `MaxAllocatedStorage`. The blueprint detects this scenario and marks autoscaling as `DISABLED`.
    - **CloudWatch Metric Granularity & Reporting Gaps**: `FreeStorageSpace` is reported at 1-minute to 5-minute intervals. The blueprint queries the minimum value over a 60-minute window to account for transient write spikes, safely handling reporting gaps.

    ## How to extend

    - Add automated Jira or PagerDuty incident creation for instances reaching `CRITICAL` severity.
    - Add an automated approval task that executes `aws rds modify-db-instance` directly from Kestra to expand storage limits.

    ## Links

    - Kestra AWS Plugin Documentation: https://kestra.io/plugins/plugin-aws
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - AWS RDS Storage Autoscaling Documentation: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.StorageTypes.html#USER_PIOPS.Autoscaling
  tags:
    - Cloud
    - Infrastructure
    - Data
  subTags:
    - Storage & Backup
    - Databases
  ee: false
  demo: false
