id: epa-echo-supplier-facility-compliance-watch
namespace: company.team

description: |
  Watch the environmental compliance record of supplier or own facilities in EPA ECHO.
  Each facility is looked up by FRS registry id, or by name plus state, through ECHO's
  two-step `get_facilities` / `get_qid` flow; unknown and ambiguous names are reported
  instead of guessed. The Detailed Facility Report gives the current CAA, CWA and RCRA
  status, quarters in non-compliance over three years, formal enforcement actions with
  penalties and the last inspection date. A Parquet snapshot per run, pointed to from
  the KV store, is diffed against the previous one so only new significant violations,
  new enforcement actions, penalty changes, chronic non-compliance and new inspection gaps alert.

inputs:
  - id: facilities
    type: JSON
    displayName: Facilities to watch
    description: |
      JSON array, one object per facility: `label` (your name for it) plus either `frs`
      (12-digit FRS registry id, preferred) or `name` and `state` (two-letter code, `city` optional).
      The defaults cover a high-priority air violator, a CWA significant non-complier, a name
      that resolves to one active record, a facility not inspected since 2016, a clean campus,
      a name with two active FRS records and a name ECHO does not know.
    defaults: |
      [
        {"label": "ExxonMobil Baytown Olefins", "frs": "110000463178"},
        {"label": "3M Cottage Grove", "frs": "110000423667"},
        {"label": "Intel Ronler Acres", "name": "INTEL CORPORATION RONLER ACRES CAMPUS", "state": "OR"},
        {"label": "Intel Hawthorn Farm", "frs": "110004787384"},
        {"label": "Intel Aloha Campus", "frs": "110000486527"},
        {"label": "Chemours Fayetteville Works", "name": "CHEMOURS COMPANY - FAYETTEVILLE WORKS", "state": "NC"},
        {"label": "Acme Quantum Widgets", "name": "ACME QUANTUM WIDGETS", "state": "TX"}
      ]

  - id: inspection_gap_years
    type: INT
    defaults: 5
    min: 1
    max: 20
    description: Flag a facility whose last inspection under any program (or none at all) is older than this many years.

  - id: chronic_nc_quarters
    type: INT
    defaults: 8
    min: 0
    max: 12
    description: Flag chronic non-compliance when a program that is not designated a significant violator still spent at least this many of the last 12 quarters in violation. 0 turns the check off.

  - id: state_key
    type: STRING
    defaults: echo_facility_watch
    description: KV key holding the pointer to the last snapshot. Use one key per watchlist.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"
    description: ECHO refreshes its ICIS-Air, ICIS-NPDES and RCRAInfo extracts weekly; a Monday check sees each refresh once.

tasks:
  - id: previous_snapshot
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: URI of the Parquet snapshot written by the last successful run. Missing on the first (baseline) run.

  - id: bootstrap
    type: io.kestra.plugin.core.flow.If
    description: First run only. Writes an empty snapshot with the right schema so the diff has a single code path.
    condition: "{{ outputs.previous_snapshot.value is not defined or outputs.previous_snapshot.value is empty }}"
    then:
      - id: empty_snapshot
        type: io.kestra.plugin.jdbc.duckdb.Queries
        url: "jdbc:duckdb:"
        fetchType: NONE
        outputFiles:
          - snapshot_parquet
        sql: |
          CREATE TABLE snapshot (
            label VARCHAR, frs VARCHAR, lookup_status VARCHAR, sig_programs VARCHAR[], chronic BOOLEAN, inspection_gap BOOLEAN,
            actions STRUCT(action_key VARCHAR, penalty DECIMAL(18, 2))[], snapshot_at TIMESTAMP
          );
          COPY snapshot TO '{{ outputFiles.snapshot_parquet }}' (FORMAT PARQUET);

  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Validates the watchlist: a label must be unique, `frs` must be 12 digits, a name lookup needs a
      two-letter state. Invalid rows are kept for the report but not sent to ECHO; the run fails only
      if no row is valid.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    parameters:
      facilities: "{{ inputs.facilities | toJson }}"
    sql: |
      CREATE TABLE raw AS
      SELECT row_number() OVER () AS pos, e FROM unnest(from_json(:facilities, '["JSON"]')) AS t(e);

      CREATE TABLE entries AS
      SELECT pos,
             nullif(regexp_replace(coalesce(e->>'$.frs', ''), '\s', '', 'g'), '') AS frs,
             nullif(upper(trim(coalesce(e->>'$.name', ''))), '') AS name,
             nullif(upper(trim(coalesce(e->>'$.state', ''))), '') AS state,
             nullif(upper(trim(coalesce(e->>'$.city', ''))), '') AS city,
             nullif(trim(coalesce(e->>'$.label', '')), '') AS given_label
      FROM raw;

      CREATE TABLE labelled AS
      SELECT pos, frs, name, state, city,
             coalesce(given_label, frs, name || ' (' || coalesce(state, '?') || ')', 'row ' || pos) AS base_label
      FROM entries;

      CREATE TABLE checked AS
      SELECT *, row_number() OVER (PARTITION BY base_label ORDER BY pos) > 1 AS is_duplicate,
             base_label || CASE WHEN row_number() OVER (PARTITION BY base_label ORDER BY pos) > 1 THEN ' (row ' || pos || ')' ELSE '' END AS label
      FROM labelled;

      CREATE TABLE watch AS
      SELECT pos, frs, name, state, city, label, CASE
               WHEN is_duplicate THEN 'duplicate label, the first row with it is used'
               WHEN frs IS NOT NULL AND NOT regexp_full_match(frs, '[0-9]{12}') THEN 'FRS registry id must be 12 digits'
               WHEN frs IS NULL AND name IS NULL THEN 'needs frs, or name plus state'
               WHEN frs IS NULL AND (state IS NULL OR NOT regexp_full_match(state, '[A-Z]{2}')) THEN 'name lookups need a two-letter state code'
             END AS invalid_reason
      FROM checked;

      CREATE TABLE guard AS
      SELECT CASE WHEN count(*) FILTER (WHERE invalid_reason IS NULL) = 0
                  THEN error('No valid facility in the watchlist: ' || coalesce(string_agg(label || ' (' || invalid_reason || ')', '; '), 'empty list'))
             END AS ok FROM watch;

      SELECT
        (SELECT count(*) FROM watch) AS watched,
        (SELECT count(*) FILTER (WHERE invalid_reason IS NOT NULL) FROM watch) AS invalid,
        (SELECT CAST(json_group_array(json_object('label', label, 'frs', coalesce(frs, ''), 'name', coalesce(name, ''),
                  'state', coalesce(state, ''), 'city', coalesce(city, ''))) AS VARCHAR)
           FROM (SELECT * FROM watch WHERE invalid_reason IS NULL ORDER BY pos)) AS lookups,
        (SELECT CAST(json_group_array(json_object('pos', pos, 'label', label, 'frs', frs, 'name', name, 'state', state,
                  'city', city, 'invalid_reason', invalid_reason)) AS VARCHAR) FROM watch) AS watch;

  - id: lookup
    type: io.kestra.plugin.core.flow.Loop
    description: |
      One iteration per valid facility, two at a time to stay polite with the keyless service. Each item
      carries the whole lookup because Loop iterations run in their own context.
    values: "{{ outputs.plan.outputs[0].row.lookups }}"
    concurrencyLimit: 2
    tasks:
      - id: find
        type: io.kestra.plugin.core.http.Download
        description: Step 1 of ECHO's query flow. Returns match counts and a QueryID, not the facilities.
        uri: "https://echodata.epa.gov/echo/echo_rest_services.get_facilities?output=JSON&{{ fromJson(item.value).frs is not empty ? 'p_frs=' ~ fromJson(item.value).frs : 'p_fn=' ~ (fromJson(item.value).name | urlencode) ~ '&p_st=' ~ fromJson(item.value).state ~ (fromJson(item.value).city is not empty ? '&p_ct=' ~ (fromJson(item.value).city | urlencode) : '') }}"
        headers:
          User-Agent: "kestra-epa-echo-supplier-facility-compliance-watch/1.0 (https://kestra.io)"
        options:
          retryOnStatusCodes: [429, 500, 502, 503, 504]
          retry:
            type: exponential
            interval: PT5S
            maxInterval: PT1M
            maxAttempts: 4

      - id: candidates
        type: io.kestra.plugin.core.http.Download
        description: |
          Step 2. `get_qid` returns the matching facilities; `qcolumns` trims each row to name, city, state,
          registry id, SNC flag, compliance status, last inspection and the active flag.
        uri: "https://echodata.epa.gov/echo/echo_rest_services.get_qid?output=JSON&qid={{ fromJson(read(outputs.find.uri)).Results.QueryID ?? '' }}&qcolumns=1,3,4,6,36,38,45,97"
        headers:
          User-Agent: "kestra-epa-echo-supplier-facility-compliance-watch/1.0 (https://kestra.io)"
        options:
          retryOnStatusCodes: [429, 500, 502, 503, 504]
          retry:
            type: exponential
            interval: PT5S
            maxInterval: PT1M
            maxAttempts: 4

      - id: pick
        type: io.kestra.plugin.core.debug.Return
        description: |
          One match is taken as is. With several matches, FRS often keeps inactive duplicate records of
          the same site, so exactly one active record is taken; otherwise the facility is ambiguous and
          no report is fetched.
        format: >-
          {{ fromJson(read(outputs.candidates.uri)) | jq('[.Results.Facilities[]?] as $f | ($f | map(select(.FacActiveFlag == "Y"))) as $a | if ($f | length) == 1 then $f[0].RegistryID elif ($a | length) == 1 then $a[0].RegistryID else "" end') | first }}

      - id: report
        type: io.kestra.plugin.core.http.Download
        runIf: "{{ outputs.pick.value is not empty }}"
        description: Detailed Facility Report for the resolved registry id (program status, quarterly history, formal actions, inspections).
        uri: "https://echodata.epa.gov/echo/dfr_rest_services.get_dfr?output=JSON&p_id={{ outputs.pick.value }}"
        headers:
          User-Agent: "kestra-epa-echo-supplier-facility-compliance-watch/1.0 (https://kestra.io)"
        options:
          retryOnStatusCodes: [429, 500, 502, 503, 504]
          retry:
            type: exponential
            interval: PT5S
            maxInterval: PT1M
            maxAttempts: 4

      - id: bundle
        type: io.kestra.plugin.core.storage.Write
        description: Ties the lookup, the candidates and the report to the watchlist row in one JSON document.
        extension: .json
        content: |
          {"item": {{ item.value }}, "picked": "{{ outputs.pick.value }}", "qid": {{ read(outputs.candidates.uri) }}, "dfr": {% if outputs.pick.value is empty %}null{% else %}{{ read(outputs.report.uri) }}{% endif %}}
    outputs:
      - id: uri
        type: STRING
        value: "{{ outputs.bundle.uri }}"

  - id: collect
    type: io.kestra.plugin.core.storage.Concat
    files: "{{ outputs.lookup.outputs | jq('[.[].outputs.uri]') | first }}"
    separator: "\n"
    extension: .json

  - id: assess
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Builds one snapshot row per watched facility from the Detailed Facility Reports, classifies the
      lookup (FOUND, RESOLVED_ACTIVE, AMBIGUOUS, UNKNOWN, INVALID, LOOKUP_ERROR) and diffs against the
      previous snapshot: programs newly in significant / high-priority violation, formal actions not seen
      before, penalties that changed, chronic non-compliance and inspection gaps that just opened. Writes the facility CSV, the
      findings CSV, the new snapshot and the Slack text.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      bundles.json: "{{ outputs.collect.uri }}"
      previous.parquet: "{{ outputs.previous_snapshot.value ?? outputs.empty_snapshot.outputFiles.snapshot_parquet }}"
    outputFiles:
      - facilities_csv
      - findings_csv
      - snapshot_parquet
    parameters:
      watch: "{{ outputs.plan.outputs[0].row.watch }}"
      gap_years: "{{ inputs.inspection_gap_years }}"
      chronic_quarters: "{{ inputs.chronic_nc_quarters }}"
      is_baseline: "{{ outputs.previous_snapshot.value is not defined or outputs.previous_snapshot.value is empty }}"
      run_started: "{{ execution.startDate }}"
      execution_url: "{{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE MACRO money(s) AS TRY_CAST(nullif(regexp_replace(coalesce(s, ''), '[$,]', '', 'g'), '') AS DECIMAL(18, 2));
      CREATE MACRO mdy(s) AS CAST(try_strptime(nullif(s, ''), '%m/%d/%Y') AS DATE);
      CREATE MACRO usd(x) AS '$' || format('{:,}', CAST(round(coalesce(x, 0)) AS BIGINT));

      CREATE TABLE watch AS
      SELECT CAST(w->>'$.pos' AS INTEGER) AS pos, w->>'$.label' AS label, w->>'$.frs' AS given_frs,
             w->>'$.name' AS given_name, w->>'$.state' AS given_state, w->>'$.invalid_reason' AS invalid_reason
      FROM (SELECT unnest(from_json(:watch, '["JSON"]')) AS w);

      CREATE TABLE lookups AS
      SELECT doc->>'$.item.label' AS label,
             nullif(doc->>'$.picked', '') AS picked,
             TRY_CAST(doc->>'$.qid.Results.QueryRows' AS INTEGER) AS matches,
             coalesce(doc->>'$.qid.Results.Error.ErrorMessage', doc->>'$.dfr.Results.Error.ErrorMessage') AS lookup_error,
             coalesce(json_extract(doc, '$.qid.Results.Facilities'), CAST('[]' AS JSON)) AS cands,
             json_extract(doc, '$.dfr.Results') AS dfr
      FROM read_json_objects('bundles.json', format = 'unstructured') AS t(doc);

      CREATE TABLE cand AS
      SELECT l.label, c->>'$.RegistryID' AS frs, c->>'$.FacName' AS fac_name, c->>'$.FacCity' AS fac_city,
             c->>'$.FacState' AS fac_state, coalesce(c->>'$.FacActiveFlag' = 'Y', false) AS active,
             mdy(c->>'$.FacDateLastInspection') AS fac_last_insp
      FROM lookups l, unnest(from_json(l.cands, '["JSON"]')) AS t(c);

      CREATE TABLE prog AS
      SELECT l.label, s->>'$.Statute' AS statute, s->>'$.CurrentStatus' AS status,
             TRY_CAST(s->>'$.QtrsInNC' AS INTEGER) AS qtrs_nc, TRY_CAST(s->>'$.QtrsInSNC' AS INTEGER) AS qtrs_snc,
             mdy(s->>'$.LastInspection') AS last_insp
      FROM lookups l, unnest(from_json(json_extract(l.dfr, '$.EnforcementComplianceSummaries.Summaries'), '["JSON"]')) AS t(s)
      WHERE l.dfr IS NOT NULL AND l.lookup_error IS NULL;

      CREATE TABLE actions AS
      SELECT DISTINCT l.label, l.picked AS frs, a->>'$.Statute' AS statute, a->>'$.SourceID' AS source_id,
             a->>'$.ActionType' AS action_type, a->>'$.LeadAgency' AS lead_agency, mdy(a->>'$.ActionDate') AS action_date,
             coalesce(money(a->>'$.PenaltyAmount'), 0) AS penalty,
             concat_ws('|', a->>'$.Statute', a->>'$.SourceID', a->>'$.ActionType', a->>'$.ActionDate') AS action_key
      FROM lookups l, unnest(from_json(json_extract(l.dfr, '$.FormalActions.Action'), '["JSON"]')) AS t(a)
      WHERE l.dfr IS NOT NULL AND l.lookup_error IS NULL;

      CREATE TABLE cur AS
      WITH p AS (
        SELECT label,
               coalesce(list(statute ORDER BY statute) FILTER (WHERE regexp_matches(coalesce(status, ''), 'High Priority|Significant')), CAST([] AS VARCHAR[])) AS sig_programs,
               string_agg(statute || ' ' || status, '; ' ORDER BY statute) FILTER (WHERE status IS NOT NULL) AS program_status,
               max(qtrs_nc) AS max_qtrs_nc,
               string_agg(statute || ' ' || qtrs_nc || '/12', '; ' ORDER BY statute) FILTER (WHERE qtrs_nc > 0) AS qtrs_nc_by_program,
               max(last_insp) AS last_insp,
               string_agg(statute || ' ' || qtrs_nc || '/12 (' || coalesce(status, 'no current status') || ')', '; ' ORDER BY statute)
                 FILTER (WHERE NOT regexp_matches(coalesce(status, ''), 'High Priority|Significant')
                         AND CAST(:chronic_quarters AS INTEGER) > 0 AND qtrs_nc >= CAST(:chronic_quarters AS INTEGER)) AS chronic_programs
        FROM prog GROUP BY label),
      a AS (
        SELECT label, count(*) AS formal_actions_5yr, sum(penalty) AS penalties_5yr, max(action_date) AS last_action_date,
               list({'action_key': action_key, 'penalty': penalty} ORDER BY action_key) AS actions
        FROM actions GROUP BY label),
      c AS (
        SELECT label, count(*) AS candidates, count(*) FILTER (WHERE active) AS active_candidates,
               string_agg(fac_name || ', ' || coalesce(fac_city, '?') || ' (FRS ' || frs || CASE WHEN active THEN ', active' ELSE '' END || ')', '; ' ORDER BY active DESC, frs) FILTER (WHERE rn <= 5) AS candidate_list
        FROM (SELECT *, row_number() OVER (PARTITION BY label ORDER BY active DESC, frs) AS rn FROM cand) GROUP BY label)
      SELECT w.pos, w.label,
             l.picked AS frs,
             CASE WHEN w.invalid_reason IS NOT NULL THEN 'INVALID'
                  WHEN l.lookup_error IS NOT NULL THEN 'LOOKUP_ERROR'
                  WHEN coalesce(l.matches, 0) = 0 THEN 'UNKNOWN'
                  WHEN l.picked IS NULL THEN 'AMBIGUOUS'
                  WHEN l.matches > 1 THEN 'RESOLVED_ACTIVE'
                  ELSE 'FOUND' END AS lookup_status,
             CASE WHEN w.invalid_reason IS NOT NULL THEN w.invalid_reason
                  WHEN l.lookup_error IS NOT NULL THEN l.lookup_error
                  WHEN coalesce(l.matches, 0) = 0 THEN 'no ECHO facility matches ' || coalesce(w.given_frs, w.given_name || ' in ' || w.given_state)
                  WHEN l.picked IS NULL THEN l.matches || ' matches, ' || c.active_candidates || ' active; pin one with frs: ' || c.candidate_list
                  WHEN l.matches > 1 THEN 'picked the only active record of ' || l.matches || ' matches: ' || c.candidate_list
                  ELSE NULL END AS lookup_note,
             f.fac_name AS facility, f.fac_city AS city, f.fac_state AS state,
             coalesce(p.sig_programs, CAST([] AS VARCHAR[])) AS sig_programs,
             p.program_status, coalesce(p.max_qtrs_nc, 0) AS max_qtrs_nc_3yr, p.qtrs_nc_by_program, p.chronic_programs,
             p.chronic_programs IS NOT NULL AS chronic,
             CASE WHEN p.last_insp IS NULL THEN f.fac_last_insp WHEN f.fac_last_insp IS NULL THEN p.last_insp ELSE greatest(p.last_insp, f.fac_last_insp) END AS last_inspection,
             coalesce(a.formal_actions_5yr, 0) AS formal_actions_5yr, coalesce(a.penalties_5yr, 0) AS penalties_5yr, a.last_action_date,
             coalesce(a.actions, []) AS actions,
             CASE WHEN l.picked IS NOT NULL THEN 'https://echo.epa.gov/detailed-facility-report?fid=' || l.picked END AS dfr_url
      FROM watch w
      LEFT JOIN lookups l ON l.label = w.label
      LEFT JOIN cand f ON f.label = w.label AND f.frs = l.picked
      LEFT JOIN p ON p.label = w.label
      LEFT JOIN a ON a.label = w.label
      LEFT JOIN c ON c.label = w.label;

      ALTER TABLE cur ADD COLUMN years_since_inspection DOUBLE;
      ALTER TABLE cur ADD COLUMN inspection_gap BOOLEAN;
      UPDATE cur SET years_since_inspection = round(date_diff('day', last_inspection, current_date) / 365.25, 1),
                     inspection_gap = frs IS NOT NULL AND (last_inspection IS NULL OR last_inspection < current_date - to_years(CAST(:gap_years AS INTEGER)));

      CREATE TABLE prev AS SELECT * FROM read_parquet('previous.parquet');

      CREATE TABLE pair AS
      SELECT c.*, p.label IS NOT NULL AND p.frs IS NOT DISTINCT FROM c.frs AS same_facility,
             p.lookup_status AS prev_lookup_status,
             CASE WHEN p.frs IS NOT DISTINCT FROM c.frs THEN p.sig_programs ELSE CAST([] AS VARCHAR[]) END AS prev_sig,
             CASE WHEN p.frs IS NOT DISTINCT FROM c.frs THEN coalesce(p.inspection_gap, false) ELSE false END AS prev_gap,
             CASE WHEN p.frs IS NOT DISTINCT FROM c.frs THEN coalesce(p.chronic, false) ELSE false END AS prev_chronic,
             CASE WHEN p.frs IS NOT DISTINCT FROM c.frs THEN p.actions ELSE [] END AS prev_actions
      FROM cur c LEFT JOIN prev p ON p.label = c.label;

      CREATE TABLE findings AS
      SELECT * FROM (
        SELECT x.label, x.frs, x.facility, 'NEW_SIGNIFICANT_VIOLATION' AS kind, 'ALERT' AS severity,
               g.statute || ' ' || g.status || ', ' || coalesce(g.qtrs_nc, 0) || ' of the last 12 quarters in non-compliance (' || coalesce(g.qtrs_snc, 0) || ' significant)' AS detail,
               CAST(NULL AS DATE) AS event_date, CAST(NULL AS DECIMAL(18, 2)) AS penalty, x.dfr_url
        FROM pair x CROSS JOIN unnest(x.sig_programs) AS s(prog_name)
        JOIN prog g ON g.label = x.label AND g.statute = s.prog_name
        WHERE NOT list_contains(coalesce(x.prev_sig, CAST([] AS VARCHAR[])), s.prog_name)
        UNION ALL
        SELECT x.label, x.frs, x.facility, 'RETURNED_TO_COMPLIANCE', 'INFO', s.prog_name || ' no longer in significant or high-priority violation', NULL, NULL, x.dfr_url
        FROM pair x, unnest(x.prev_sig) AS s(prog_name)
        WHERE x.same_facility AND NOT list_contains(x.sig_programs, s.prog_name)
        UNION ALL
        SELECT x.label, x.frs, x.facility, 'NEW_ENFORCEMENT_ACTION', 'ALERT',
               a.statute || ' ' || a.action_type || ' by ' || a.lead_agency || ' (' || a.source_id || ')' || CASE WHEN a.penalty > 0 THEN ', penalty ' || usd(a.penalty) ELSE ', no penalty' END,
               a.action_date, a.penalty, x.dfr_url
        FROM pair x JOIN actions a ON a.label = x.label
        WHERE NOT list_contains(list_transform(coalesce(x.prev_actions, []), e -> e.action_key), a.action_key)
        UNION ALL
        SELECT x.label, x.frs, x.facility, 'PENALTY_CHANGED', 'ALERT',
               a.statute || ' ' || a.action_type || ' of ' || strftime(a.action_date, '%Y-%m-%d') || ' penalty ' || usd(pa.penalty) || ' -> ' || usd(a.penalty),
               a.action_date, a.penalty, x.dfr_url
        FROM pair x JOIN actions a ON a.label = x.label CROSS JOIN unnest(x.prev_actions) AS u(pa)
        WHERE pa.action_key = a.action_key AND pa.penalty <> a.penalty
        UNION ALL
        SELECT x.label, x.frs, x.facility, 'CHRONIC_NONCOMPLIANCE', 'ALERT',
               'repeated violations without a significant-violator flag, quarters in violation of the last 12 ' || x.chronic_programs,
               NULL, NULL, x.dfr_url
        FROM pair x WHERE x.chronic AND NOT x.prev_chronic
        UNION ALL
        SELECT x.label, x.frs, x.facility, 'INSPECTION_GAP', 'ALERT',
               CASE WHEN x.last_inspection IS NULL THEN 'no inspection on record in any program'
                    ELSE 'no inspection in any program for ' || x.years_since_inspection || ' years, last one' END,
               x.last_inspection, NULL, x.dfr_url
        FROM pair x WHERE x.inspection_gap AND NOT x.prev_gap
        UNION ALL
        SELECT x.label, x.frs, x.facility, 'LOOKUP_' || x.lookup_status, 'REVIEW', x.lookup_note, NULL, NULL, x.dfr_url
        FROM pair x
        WHERE x.lookup_status IN ('INVALID', 'UNKNOWN', 'AMBIGUOUS', 'LOOKUP_ERROR') AND x.prev_lookup_status IS DISTINCT FROM x.lookup_status
      );

      COPY (
        SELECT c.label, c.lookup_status, c.lookup_note, c.frs, c.facility, c.city, c.state,
               len(c.sig_programs) > 0 AS significant_violator, array_to_string(c.sig_programs, ' ') AS significant_programs,
               c.program_status, c.max_qtrs_nc_3yr, c.qtrs_nc_by_program, c.chronic_programs AS chronic_noncompliance, c.last_inspection, c.years_since_inspection, c.inspection_gap,
               c.formal_actions_5yr, c.penalties_5yr, c.last_action_date,
               coalesce((SELECT string_agg(DISTINCT kind, ' ') FROM findings f WHERE f.label = c.label), '') AS changes_this_run,
               c.dfr_url
        FROM cur c ORDER BY len(c.sig_programs) > 0 DESC, c.penalties_5yr DESC, c.pos
      ) TO '{{ outputFiles.facilities_csv }}' (HEADER, DELIMITER ',');

      COPY (SELECT * FROM findings ORDER BY severity, label, kind, event_date DESC) TO '{{ outputFiles.findings_csv }}' (HEADER, DELIMITER ',');

      COPY (SELECT label, frs, lookup_status, sig_programs, chronic, inspection_gap, actions, CAST(:run_started AS TIMESTAMP) AS snapshot_at FROM cur)
        TO '{{ outputFiles.snapshot_parquet }}' (FORMAT PARQUET);

      CREATE TABLE totals AS
      SELECT count(*) FILTER (WHERE severity = 'ALERT') AS alerts, count(*) FILTER (WHERE severity = 'REVIEW') AS reviews FROM findings;

      SELECT
        CAST(:is_baseline AS BOOLEAN) AS is_baseline,
        (SELECT count(*) FROM cur) AS watched,
        (SELECT count(*) FILTER (WHERE frs IS NOT NULL) FROM cur) AS resolved,
        (SELECT count(*) FILTER (WHERE lookup_status = 'RESOLVED_ACTIVE') FROM cur) AS resolved_by_active_flag,
        (SELECT count(*) FILTER (WHERE lookup_status = 'AMBIGUOUS') FROM cur) AS ambiguous,
        (SELECT count(*) FILTER (WHERE lookup_status = 'UNKNOWN') FROM cur) AS unknown,
        (SELECT count(*) FILTER (WHERE lookup_status = 'INVALID') FROM cur) AS invalid,
        (SELECT count(*) FILTER (WHERE lookup_status = 'LOOKUP_ERROR') FROM cur) AS lookup_errors,
        (SELECT count(*) FILTER (WHERE len(sig_programs) > 0) FROM cur) AS significant_violators,
        (SELECT count(*) FILTER (WHERE chronic) FROM cur) AS chronic_noncompliers,
        (SELECT count(*) FILTER (WHERE inspection_gap) FROM cur) AS inspection_gaps,
        (SELECT sum(formal_actions_5yr) FROM cur) AS formal_actions_5yr,
        (SELECT usd(sum(penalties_5yr)) FROM cur) AS penalties_5yr,
        (SELECT count(*) FILTER (WHERE kind = 'NEW_SIGNIFICANT_VIOLATION') FROM findings) AS new_significant,
        (SELECT count(*) FILTER (WHERE kind = 'NEW_ENFORCEMENT_ACTION') FROM findings) AS new_actions,
        (SELECT usd(sum(penalty)) FROM findings WHERE kind = 'NEW_ENFORCEMENT_ACTION') AS new_penalties,
        (SELECT count(*) FILTER (WHERE kind = 'PENALTY_CHANGED') FROM findings) AS penalty_changes,
        (SELECT count(*) FILTER (WHERE kind = 'CHRONIC_NONCOMPLIANCE') FROM findings) AS new_chronic,
        (SELECT count(*) FILTER (WHERE kind = 'INSPECTION_GAP') FROM findings) AS new_inspection_gaps,
        (SELECT count(*) FILTER (WHERE kind = 'RETURNED_TO_COMPLIANCE') FROM findings) AS returned_to_compliance,
        (SELECT alerts FROM totals) AS alerts,
        (SELECT reviews FROM totals) AS reviews,
        (SELECT CASE WHEN alerts > 0 THEN 'ALERT' WHEN reviews > 0 THEN 'REVIEW' ELSE 'QUIET' END FROM totals) AS route,
        (SELECT coalesce(string_agg(label || ' [' || lookup_status || '] ' || lookup_note, chr(10) ORDER BY pos), '')
           FROM cur WHERE lookup_status NOT IN ('FOUND', 'RESOLVED_ACTIVE')) AS lookup_issues,
        (SELECT coalesce(string_agg(severity || ' ' || label || ' ' || kind || ' ' || detail || coalesce(' on ' || strftime(event_date, '%Y-%m-%d'), ''), chr(10)
                  ORDER BY severity, label, kind, event_date DESC), '') FROM findings) AS finding_lines,
        (SELECT CAST(json_object('text',
            '*EPA ECHO facility compliance watch* - ' || count(*) FILTER (WHERE severity = 'ALERT') || ' alert(s), ' || count(*) FILTER (WHERE severity = 'REVIEW') || ' lookup issue(s)'
              || CASE WHEN CAST(:is_baseline AS BOOLEAN) THEN ' (baseline run, current state reported once)' ELSE ' since the last snapshot' END || chr(10)
              || coalesce(string_agg('- *' || label || '* ' || replace(lower(kind), '_', ' ') || ', ' || detail
                   || coalesce(' (' || strftime(event_date, '%Y-%m-%d') || ')', '')
                   || CASE WHEN dfr_url IS NOT NULL THEN ' <' || dfr_url || '|DFR>' ELSE '' END,
                   chr(10) ORDER BY severity, label, kind, event_date DESC) FILTER (WHERE rn <= 20), '')
              || CASE WHEN count(*) > 20 THEN chr(10) || '...and ' || (count(*) - 20) || ' more in the findings CSV.' ELSE '' END
              || chr(10) || 'Execution ' || :execution_url) AS VARCHAR)
           FROM (SELECT *, row_number() OVER (ORDER BY severity, label, kind, event_date DESC) AS rn FROM findings WHERE severity <> 'INFO')) AS slack_payload;

  - id: save_snapshot
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.assess.outputFiles.snapshot_parquet }}"
    description: Points the KV key at this run's Parquet snapshot; the file stays in the execution's storage folder.

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    description: ALERT for new significant violations, enforcement actions, penalty changes, chronic non-compliance or inspection gaps; REVIEW when the only news is a facility that could not be resolved; QUIET otherwise.
    value: "{{ outputs.assess.outputs[0].row.route }}"
    cases:
      ALERT:
        - id: notify_alert
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          description: allowFailure keeps the watch green when the webhook secret is not set; the findings are still in the logs and the CSV.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ outputs.assess.outputs[0].row.slack_payload }}"
        - id: log_alert
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: |
            {{ outputs.assess.outputs[0].row.alerts }} compliance alert(s){{ outputs.assess.outputs[0].row.is_baseline ? ' (BASELINE)' : '' }}: {{ outputs.assess.outputs[0].row.new_significant }} new significant violation(s), {{ outputs.assess.outputs[0].row.new_actions }} new formal action(s) totalling {{ outputs.assess.outputs[0].row.new_penalties }}, {{ outputs.assess.outputs[0].row.penalty_changes }} penalty change(s), {{ outputs.assess.outputs[0].row.new_chronic }} newly chronic, {{ outputs.assess.outputs[0].row.new_inspection_gaps }} new inspection gap(s).
            {{ outputs.assess.outputs[0].row.finding_lines }}
      REVIEW:
        - id: notify_review
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ outputs.assess.outputs[0].row.slack_payload }}"
        - id: log_review
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: |
            No compliance change, but {{ outputs.assess.outputs[0].row.reviews }} watchlist row(s) need attention:
            {{ outputs.assess.outputs[0].row.finding_lines }}
    defaults:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No new significant violations, enforcement actions, penalty changes or inspection gaps for {{ outputs.assess.outputs[0].row.resolved }} resolved facilities ({{ outputs.assess.outputs[0].row.significant_violators }} still significant violators, {{ outputs.assess.outputs[0].row.returned_to_compliance }} returned to compliance)."

  - id: warn_lookup_issues
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.assess.outputs[0].row.lookup_issues is not empty }}"
    level: WARN
    description: Repeated every run (Slack only on change) so an unresolved row is not forgotten.
    message: |
      Watchlist rows not monitored this run:
      {{ outputs.assess.outputs[0].row.lookup_issues }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      ECHO watch{{ outputs.assess.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}: {{ outputs.assess.outputs[0].row.watched }} watched, {{ outputs.assess.outputs[0].row.resolved }} resolved ({{ outputs.assess.outputs[0].row.resolved_by_active_flag }} via the only active record), {{ outputs.assess.outputs[0].row.ambiguous }} ambiguous, {{ outputs.assess.outputs[0].row.unknown }} unknown, {{ outputs.assess.outputs[0].row.invalid }} invalid, {{ outputs.assess.outputs[0].row.lookup_errors }} lookup errors.
      Current state: {{ outputs.assess.outputs[0].row.significant_violators }} significant violators, {{ inputs.chronic_nc_quarters > 0 ? outputs.assess.outputs[0].row.chronic_noncompliers ~ ' chronic non-compliers (' ~ inputs.chronic_nc_quarters ~ '+ of 12 quarters in violation without a significant-violator flag)' : 'chronic check off' }}, {{ outputs.assess.outputs[0].row.inspection_gaps }} not inspected in {{ inputs.inspection_gap_years }} years, {{ outputs.assess.outputs[0].row.formal_actions_5yr }} formal actions and {{ outputs.assess.outputs[0].row.penalties_5yr }} in penalties over five years.
      This run: route {{ outputs.assess.outputs[0].row.route }}, {{ outputs.assess.outputs[0].row.alerts }} alerts, {{ outputs.assess.outputs[0].row.reviews }} lookup issues, {{ outputs.assess.outputs[0].row.returned_to_compliance }} returned to compliance.
      Facilities CSV: {{ outputs.assess.outputFiles.facilities_csv }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.assess.outputs[0].row }}"
  - id: facilities_csv
    type: FILE
    value: "{{ outputs.assess.outputFiles.facilities_csv }}"
  - id: findings_csv
    type: FILE
    value: "{{ outputs.assess.outputFiles.findings_csv }}"

extend:
  title: Watch Supplier and Facility Environmental Compliance in EPA ECHO with DuckDB and Slack
  metaTitle: EPA ECHO Supplier Facility Compliance Watch with DuckDB and Slack | Kestra
  shortDescription: Look up supplier or own facilities in EPA ECHO by FRS id or name and state, read the Detailed Facility Report for CAA, CWA and RCRA status, enforcement actions, penalties and inspections, diff a Parquet snapshot against the last run and alert in Slack on what changed.
  metaDescription: Weekly EPA ECHO check of supplier facilities for new significant violations, enforcement actions, penalties and inspection gaps, with CSV and Slack.
  description: |
    ESG, procurement and EHS teams need to know when a plant they buy from, or run, gets into trouble with environmental regulators. EPA's ECHO covers every regulated US facility, but facility search is a two-step `get_facilities` / `get_qid` flow, a name often matches several Facility Registry Service (FRS) records (many inactive duplicates), and the details live in the Detailed Facility Report. This flow does those lookups for a watchlist, snapshots the result and reports only what changed.

    ## How it works

    1. A weekly `Schedule` trigger (Monday 06:00 UTC) runs the watch. `previous_snapshot` (KV Get) reads the pointer to the last Parquet snapshot; `bootstrap` (If) writes an empty one on the first run.
    2. `plan` (DuckDB) validates the `facilities` JSON: unique labels, 12-digit `frs`, or `name` with a two-letter `state` (`city` optional). Invalid rows are reported, not sent to ECHO.
    3. `lookup` (Loop, two at a time) calls `get_facilities` with `p_frs`, or `p_fn`, `p_st` and `p_ct`, then `get_qid` with the QueryID and eight `qcolumns`. `pick` (Return with `jq`) takes a single match, or the only active record among several; otherwise the row is ambiguous. `report` calls `dfr_rest_services.get_dfr` for the resolved id and `bundle` (Storage Write) keeps row, candidates and report together. 429 and 5xx are retried.
    4. `collect` (Storage Concat) joins the bundles and `assess` (DuckDB) builds one row per facility: status per program, quarters in violation out of the last 12, last inspection, and five years of formal actions with penalties. Each lookup is `FOUND`, `RESOLVED_ACTIVE`, `AMBIGUOUS` (with candidate FRS ids), `UNKNOWN`, `INVALID` or `LOOKUP_ERROR`.
    5. The diff against the previous snapshot yields `NEW_SIGNIFICANT_VIOLATION` (a program newly in significant or high-priority violation), `NEW_ENFORCEMENT_ACTION`, `PENALTY_CHANGED`, `CHRONIC_NONCOMPLIANCE` (no such flag but `chronic_nc_quarters` of 12 quarters in violation), `INSPECTION_GAP` (none in `inspection_gap_years`), lookup issues and, as info, `RETURNED_TO_COMPLIANCE`. The first run is a baseline that reports the current state once.
    6. `save_snapshot` (KV Set) stores the new pointer. `route` (Switch) sends `ALERT` and `REVIEW` runs to Slack (`allowFailure`) with a WARN log, otherwise logs a quiet line. `warn_lookup_issues` repeats unresolved rows every run.

    ## What you get

    - A facilities CSV: lookup status, FRS id, status per program, quarters in violation, last inspection, five-year actions and penalties, this run's changes and a DFR link.
    - A findings CSV and a Slack digest with only what is new since the last snapshot.
    - Ambiguous and unknown suppliers listed with the candidate FRS ids to pin, instead of a silent guess.
    - Keyless access and state in one KV key per watchlist.

    ## Who it's for

    - ESG and sustainability teams screening suppliers for environmental controversies.
    - Procurement and supplier-risk teams adding regulatory signals to onboarding and reviews.
    - EHS managers tracking their own sites and acquisition targets.

    ## Why orchestrate this with Kestra

    - ECHO's multi-step query flow is three declarative HTTP tasks in a `Loop` with retries and polite concurrency.
    - DuckDB turns the nested report into tables and the diff into readable SQL; KV plus Parquet gives change detection without a database.
    - `Switch` routes alerts and lookup reviews differently, and `state_key` lets one flow serve several portfolios.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack plugin (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
    - Outbound HTTPS to `echodata.epa.gov`; ECHO web services need no key.
    - The snapshot lives in the execution folder that wrote it; keep the latest successful execution if you purge.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the notify task warns and the watch still runs).

    ## Quick start

    1. Click **Execute** with the defaults. The baseline flags ExxonMobil Baytown Olefins (CAA high-priority violation, $2.17M judicial penalty), 3M Cottage Grove (CWA significant non-compliance, chronic RCRA violation), Intel Ronler Acres (only active of two records, 2026 CAA penalty) and Intel Hawthorn Farm (last inspected 2016); Intel Aloha is clean, Chemours is ambiguous, Acme is unknown.
    2. Execute again: nothing new, the `nothing_new` branch runs and the lookup issues are logged again.
    3. Pin Chemours with one of the FRS ids listed in the note: it is monitored from the next run.
    4. Replace the defaults with your suppliers, add `SLACK_WEBHOOK_URL` and leave the weekly schedule on.

    ## How to extend

    - Read the watchlist from a namespace file or your supplier master.
    - Open a Jira or ServiceNow ticket per new enforcement action above a penalty threshold.
    - Load the facilities CSV into your warehouse for a compliance history.
    - Use `get_facilities` filters such as `p_ncs` (NAICS) to screen a whole sector.

    ## Links

    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [Storage Write](https://kestra.io/plugins/core/storage/io.kestra.plugin.core.storage.write) and [Storage Concat](https://kestra.io/plugins/core/storage/io.kestra.plugin.core.storage.concat)
    - [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop), [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if) and [Switch](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.switch)
    - [KV Get](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.get) and [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [ECHO web services](https://echo.epa.gov/tools/web-services), [Facility Search (all data) service](https://echo.epa.gov/tools/web-services/facility-search-all-data) and [Detailed Facility Report service](https://echo.epa.gov/tools/web-services/detailed-facility-report)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
