id: iceberg-table-branching-write-audit-publish-gate
namespace: company.lakehouse

description: |
  Implement Write-Audit-Publish (WAP) on Apache Iceberg lakehouse using native snapshot branching.
  Ingests micro-batches into an isolated audit branch, validates quality invariants on the branch,
  and atomically fast-forwards the production main branch with zero data duplication.

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: inject_corrupt_records
    type: BOOL
    displayName: Inject Corrupt Records
    description: When true, injects negative amounts, unmapped currencies, null transaction IDs, and extreme distribution drift to test circuit-breaker failure.
    defaults: false

  - id: candidate_batch_size
    type: INT
    displayName: Candidate Batch Size
    description: Number of transactions in the candidate micro-batch.
    defaults: 50
    min: 4

  - id: min_amount_threshold
    type: FLOAT
    displayName: Minimum Amount Threshold
    description: Minimum valid dollar amount for incoming ledger transactions.
    defaults: 0.01

  - id: max_drift_stddev
    type: FLOAT
    displayName: Max Distribution Drift (Std Dev)
    description: Maximum allowable deviation in batch average amount from baseline history before tripping the anomaly gate.
    defaults: 3.0

tasks:
  - id: setup_iceberg_baseline
    type: io.kestra.plugin.scripts.python.Script
    description: Initializes a local Iceberg catalog and seeds the baseline corporate ledger on main.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install -q --no-cache-dir "pyiceberg[pyarrow,sql-sqlite]>=0.8.0" kestra
    outputFiles:
      - "lakehouse_state.tar"
    script: |
      import os
      import sys
      import shutil
      import statistics
      import pyarrow as pa
      from datetime import datetime, timezone
      from pyiceberg.catalog import load_catalog
      from pyiceberg.schema import Schema
      from pyiceberg.types import (
          NestedField, StringType, DoubleType, TimestamptzType
      )
      from kestra import Kestra

      state_dir = "/tmp/lakehouse_state"
      if os.path.exists(state_dir):
          shutil.rmtree(state_dir)
      os.makedirs(state_dir, exist_ok=True)
      warehouse_path = os.path.join(state_dir, "warehouse")
      catalog_db_path = os.path.join(state_dir, "catalog.db")

      catalog = load_catalog(
          "local_sqlite",
          **{
              "type": "sql",
              "uri": f"sqlite:///{catalog_db_path}",
              "warehouse": f"file://{warehouse_path}",
          }
      )
      schema = Schema(
          NestedField(1, "transaction_id", StringType(), required=False),
          NestedField(2, "account_id", StringType(), required=False),
          NestedField(3, "amount", DoubleType(), required=False),
          NestedField(4, "currency", StringType(), required=False),
          NestedField(5, "event_timestamp", TimestamptzType(), required=False),
      )

      catalog.create_namespace_if_not_exists("finance")
      table_name = "finance.corporate_ledger"

      if catalog.table_exists(table_name):
          catalog.drop_table(table_name)

      table = catalog.create_table(table_name, schema=schema)
      print(f"Created fresh Iceberg table: {table_name}")

      baseline_amounts = [1200.50, 450.00, 3100.25, 850.75, 220.00]
      baseline_data = pa.Table.from_pydict({
          "transaction_id": ["tx-001", "tx-002", "tx-003", "tx-004", "tx-005"],
          "account_id": ["acc-corp-a", "acc-corp-b", "acc-corp-a", "acc-corp-c", "acc-corp-b"],
          "amount": baseline_amounts,
          "currency": ["USD", "USD", "EUR", "USD", "EUR"],
          "event_timestamp": [datetime.now(timezone.utc)] * 5,
      })

      if table.current_snapshot() is None:
          table.append(baseline_data)
          print("Seeded table with 5 initial baseline rows.")

      current_snap = table.current_snapshot()
      table_rows = len(table.scan().to_arrow())
      snap_id = str(current_snap.snapshot_id) if current_snap else "none"
      base_mean = statistics.mean(baseline_amounts)
      base_std = statistics.stdev(baseline_amounts)

      print(f"=== BASELINE SNAPSHOT INSPECTION ===")
      print(f"Current Snapshot ID : {snap_id}")
      print(f"Table Total Rows    : {table_rows}")
      print(f"Baseline Mean Amount: {base_mean:.2f}")
      print(f"Baseline StdDev     : {base_std:.2f}")

      shutil.make_archive("lakehouse_state", "tar", "/tmp", "lakehouse_state")

      Kestra.outputs({
          "baseline_snapshot_id": snap_id,
          "baseline_row_count": table_rows,
          "baseline_mean_amount": base_mean,
          "baseline_stddev_amount": base_std
      })
      sys.stdout.flush()

  - id: stage_and_branch_candidate_batch
    type: io.kestra.plugin.scripts.python.Script
    description: Creates an isolated audit branch and writes the candidate micro-batch without polluting main.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install -q --no-cache-dir "pyiceberg[pyarrow,sql-sqlite]>=0.8.0" kestra
    inputFiles:
      lakehouse_state.tar: "{{ outputs.setup_iceberg_baseline.outputFiles['lakehouse_state.tar'] }}"
    outputFiles:
      - "lakehouse_state.tar"
    script: |
      import os
      import sys
      import shutil
      import pyarrow as pa
      from datetime import datetime, timezone
      from pyiceberg.catalog import load_catalog
      from kestra import Kestra

      shutil.unpack_archive("lakehouse_state.tar", "/tmp")
      state_dir = "/tmp/lakehouse_state"
      warehouse_path = os.path.join(state_dir, "warehouse")
      catalog_db_path = os.path.join(state_dir, "catalog.db")

      catalog = load_catalog(
          "local_sqlite",
          **{
              "type": "sql",
              "uri": f"sqlite:///{catalog_db_path}",
              "warehouse": f"file://{warehouse_path}",
          }
      )
      table = catalog.load_table("finance.corporate_ledger")

      current_snap = table.current_snapshot()
      if current_snap is None:
          raise RuntimeError("Cannot branch: baseline snapshot on main does not exist.")

      if "audit_branch" in table.refs():
          table.manage_snapshots().remove_branch("audit_branch").commit()

      table.manage_snapshots().create_branch(
          snapshot_id=current_snap.snapshot_id,
          branch_name="audit_branch"
      ).commit()
      print(f"Created audit_branch branching from snapshot: {current_snap.snapshot_id}")

      batch_size = int("{{ inputs.candidate_batch_size }}")
      inject_corrupt = "{{ inputs.inject_corrupt_records }}".lower() == "true"

      tx_ids = [f"tx-batch-{str(i).zfill(4)}" for i in range(batch_size)]
      accounts = [f"acc-corp-{(i % 4) + 1}" for i in range(batch_size)]
      amounts = [round(150.0 + (i * 23.45) % 650.0, 2) for i in range(batch_size)]
      currencies = ["USD" if i % 3 != 0 else "EUR" for i in range(batch_size)]
      timestamps = [datetime.now(timezone.utc)] * batch_size

      if inject_corrupt and batch_size >= 4:
          print("ALERT: Injecting intentional data anomalies for circuit-breaker audit testing...")
          amounts[0] = -250.00
          currencies[1] = "XYZ"
          tx_ids[2] = None
          amounts[3] = 99999.00

      candidate_data = pa.Table.from_pydict({
          "transaction_id": tx_ids,
          "account_id": accounts,
          "amount": amounts,
          "currency": currencies,
          "event_timestamp": timestamps,
      })

      table.append(candidate_data, branch="audit_branch")
      print(f"Appended {len(candidate_data)} candidate rows to audit_branch.")

      table.refresh()
      main_rows = len(table.scan().to_arrow())
      main_snap_id = table.current_snapshot().snapshot_id

      branch_snap = table.snapshot_by_name("audit_branch")
      branch_rows = len(table.scan(snapshot_id=branch_snap.snapshot_id).to_arrow())

      print("=== SNAPSHOT ISOLATION PROOF ===")
      print(f"Main Branch Snapshot ID    : {main_snap_id} (Rows: {main_rows})")
      print(f"Audit Branch Snapshot ID   : {branch_snap.snapshot_id} (Rows: {branch_rows})")
      print(f"Snapshot Isolation Status  : {'VERIFIED - Main is clean' if main_rows == 5 else 'LEAK DETECTED'}")

      shutil.make_archive("lakehouse_state", "tar", "/tmp", "lakehouse_state")

      Kestra.outputs({
          "branch_snapshot_id": str(branch_snap.snapshot_id),
          "candidate_batch_rows": len(candidate_data),
          "audit_branch_total_rows": branch_rows,
          "main_isolated_rows": main_rows,
          "is_main_isolated": (main_rows == 5)
      })
      sys.stdout.flush()

  - id: audit_branch_invariants
    type: io.kestra.plugin.scripts.python.Script
    description: Audits candidate batch on audit_branch against mathematical conservation and content invariants.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install -q --no-cache-dir "pyiceberg[pyarrow,sql-sqlite]>=0.8.0" kestra
    inputFiles:
      lakehouse_state.tar: "{{ outputs.stage_and_branch_candidate_batch.outputFiles['lakehouse_state.tar'] }}"
    script: |
      import os
      import sys
      import shutil
      import statistics
      from pyiceberg.catalog import load_catalog
      from kestra import Kestra

      shutil.unpack_archive("lakehouse_state.tar", "/tmp")
      state_dir = "/tmp/lakehouse_state"
      warehouse_path = os.path.join(state_dir, "warehouse")
      catalog_db_path = os.path.join(state_dir, "catalog.db")

      catalog = load_catalog(
          "local_sqlite",
          **{
              "type": "sql",
              "uri": f"sqlite:///{catalog_db_path}",
              "warehouse": f"file://{warehouse_path}",
          }
      )
      table = catalog.load_table("finance.corporate_ledger")

      branch_snap_id = int("{{ outputs.stage_and_branch_candidate_batch.vars.branch_snapshot_id }}")
      baseline_rows = int("{{ outputs.setup_iceberg_baseline.vars.baseline_row_count }}")
      candidate_rows = int("{{ outputs.stage_and_branch_candidate_batch.vars.candidate_batch_rows }}")
      baseline_mean = float("{{ outputs.setup_iceberg_baseline.vars.baseline_mean_amount }}")
      baseline_std = float("{{ outputs.setup_iceberg_baseline.vars.baseline_stddev_amount }}")
      min_amount = float("{{ inputs.min_amount_threshold }}")
      max_drift = float("{{ inputs.max_drift_stddev }}")

      table_data = table.scan(snapshot_id=branch_snap_id).to_arrow()
      total_rows = len(table_data)

      expected_rows = baseline_rows + candidate_rows
      row_conservation_delta = total_rows - expected_rows

      tx_ids = table_data["transaction_id"].to_pylist()
      primary_key_null_violations = sum(1 for tx in tx_ids if tx is None or str(tx).strip() == "")

      allowed_currencies = {"USD", "EUR", "GBP", "CAD", "JPY"}
      currencies = table_data["currency"].to_pylist()
      unmapped_currency_violations = sum(1 for c in currencies if c not in allowed_currencies)

      amounts = table_data["amount"].to_pylist()
      non_positive_amount_violations = sum(1 for a in amounts if a is None or a < min_amount)

      candidate_amounts = amounts[baseline_rows:]
      if len(candidate_amounts) > 0 and baseline_std > 0:
          batch_mean = statistics.mean(candidate_amounts)
          z_score = abs(batch_mean - baseline_mean) / baseline_std
          distribution_drift_violations = 1 if z_score > max_drift else 0
      else:
          batch_mean = baseline_mean
          distribution_drift_violations = 0

      all_passed = (
          row_conservation_delta == 0 and
          primary_key_null_violations == 0 and
          unmapped_currency_violations == 0 and
          non_positive_amount_violations == 0 and
          distribution_drift_violations == 0
      )

      print("=== AUDIT INVARIANT SCORECARD ===")
      print(f"1. Row Conservation Delta      : {row_conservation_delta} (Expected: 0)")
      print(f"2. Primary Key Null Violations : {primary_key_null_violations} (Expected: 0)")
      print(f"3. Unmapped Currency Violations: {unmapped_currency_violations} (Expected: 0)")
      print(f"4. Non-Positive Amounts        : {non_positive_amount_violations} (Expected: 0)")
      print(f"5. Distribution Drift (Z-Score): {z_score:.2f} (Max Allowable: {max_drift})")
      print(f"Overall Invariant Gate Verdict : {'PASSED' if all_passed else 'FAILED'}")

      Kestra.outputs({
          "row_conservation_delta": row_conservation_delta,
          "primary_key_null_violations": primary_key_null_violations,
          "unmapped_currency_violations": unmapped_currency_violations,
          "non_positive_amount_violations": non_positive_amount_violations,
          "distribution_drift_violations": distribution_drift_violations,
          "batch_mean_amount": round(batch_mean, 2),
          "all_invariants_passed": all_passed
      })
      sys.stdout.flush()

  - id: evaluate_audit_scorecard
    type: io.kestra.plugin.core.output.OutputValues
    description: Formats invariant audit scorecard and overall verdict for UI observation and metrics export.
    values:
      verdict: "{{ outputs.audit_branch_invariants.vars.all_invariants_passed ? 'PASSED' : 'FAILED' }}"
      total_violations: "{{ outputs.audit_branch_invariants.vars.primary_key_null_violations + outputs.audit_branch_invariants.vars.unmapped_currency_violations + outputs.audit_branch_invariants.vars.non_positive_amount_violations + outputs.audit_branch_invariants.vars.distribution_drift_violations + (outputs.audit_branch_invariants.vars.row_conservation_delta | abs) }}"
      branch_snapshot_id: "{{ outputs.stage_and_branch_candidate_batch.vars.branch_snapshot_id }}"
      audit_branch_total_rows: "{{ outputs.stage_and_branch_candidate_batch.vars.audit_branch_total_rows }}"
      main_isolated_rows: "{{ outputs.stage_and_branch_candidate_batch.vars.main_isolated_rows }}"

  - id: publish_gate
    type: io.kestra.plugin.core.flow.If
    description: Atomic Write-Audit-Publish gate fast-forwards main upon invariant verification or halts with Fail.
    condition: "{{ outputs.audit_branch_invariants.vars.all_invariants_passed }}"
    then:
      - id: fast_forward_main
        type: io.kestra.plugin.scripts.python.Script
        description: Atomically fast-forwards main to the audited branch snapshot with zero data duplication.
        containerImage: python:3.11-slim
        beforeCommands:
          - pip install -q --no-cache-dir "pyiceberg[pyarrow,sql-sqlite]>=0.8.0" kestra
        inputFiles:
          lakehouse_state.tar: "{{ outputs.stage_and_branch_candidate_batch.outputFiles['lakehouse_state.tar'] }}"
        outputFiles:
          - "lakehouse_state.tar"
        script: |
          import os
          import sys
          import shutil
          from pyiceberg.catalog import load_catalog
          from kestra import Kestra

          shutil.unpack_archive("lakehouse_state.tar", "/tmp")
          state_dir = "/tmp/lakehouse_state"
          warehouse_path = os.path.join(state_dir, "warehouse")
          catalog_db_path = os.path.join(state_dir, "catalog.db")

          catalog = load_catalog(
              "local_sqlite",
              **{
                  "type": "sql",
                  "uri": f"sqlite:///{catalog_db_path}",
                  "warehouse": f"file://{warehouse_path}",
              }
          )
          table = catalog.load_table("finance.corporate_ledger")

          branch_snap_id = int("{{ outputs.stage_and_branch_candidate_batch.vars.branch_snapshot_id }}")
          table.manage_snapshots().set_current_snapshot(snapshot_id=branch_snap_id).commit()
          table.refresh()

          main_snap = table.current_snapshot()
          main_rows = len(table.scan().to_arrow())

          print("=== FAST-FORWARD PROMOTION SUCCESSFUL ===")
          print(f"Main Branch Published Snapshot ID : {main_snap.snapshot_id}")
          print(f"Main Branch Published Total Rows  : {main_rows}")

          shutil.make_archive("lakehouse_state", "tar", "/tmp", "lakehouse_state")

          Kestra.outputs({
              "published_snapshot_id": str(main_snap.snapshot_id),
              "published_rows": main_rows
          })
          sys.stdout.flush()

      - id: record_lakehouse_manifest
        type: io.kestra.plugin.core.kv.Set
        description: Records production ledger metadata, published snapshot ID, and row counts in the Kestra KV store.
        key: corporate_ledger_wap_manifest
        value: |
          {
            "table": "finance.corporate_ledger",
            "execution_id": "{{ execution.id }}",
            "timestamp": "{{ execution.startDate }}",
            "published_snapshot_id": "{{ outputs.fast_forward_main.vars.published_snapshot_id }}",
            "total_rows": {{ outputs.fast_forward_main.vars.published_rows }},
            "storage_path": "finance/corporate_ledger"
          }
        kvType: JSON
    else:
      - id: halt_corrupt_execution
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Write-Audit-Publish gate tripped! Audit invariants failed on branch {{ outputs.stage_and_branch_candidate_batch.vars.branch_snapshot_id }}. Main branch is preserved at pristine baseline snapshot {{ outputs.setup_iceberg_baseline.vars.baseline_snapshot_id }}. Total violations: {{ outputs.evaluate_audit_scorecard.values.total_violations }}."

triggers:
  - id: hourly_wap_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Apache Iceberg Table Branching Write-Audit-Publish Gate
  metaTitle: Apache Iceberg Table Branching & WAP Gate | Kestra Blueprint
  shortDescription: Implement Write-Audit-Publish (WAP) on Apache Iceberg with snapshot branching, multi-tier data quality invariant auditing, and atomic metadata fast-forward promotion.
  metaDescription: Ingest micro-batches into an isolated Apache Iceberg branch, validate multi-tier quality invariants, and atomically publish via zero-copy metadata fast-forward.
  description: |
    Apache Iceberg table branching brings Git-like isolation to lakehouses, enabling teams to stage micro-batches on isolated branches, audit quality, and publish atomically.
    
    This blueprint implements Write-Audit-Publish (WAP) on Apache Iceberg using PyIceberg and a SQLite catalog. Instead of writing directly to production, the flow branches metadata, writes candidate batches to an audit branch, validates 5 invariants, and executes an atomic fast-forward (<50ms) with zero data duplication.
    
    ## How it works
    
    1. **Baseline Setup**: `setup_iceberg_baseline` initializes an Iceberg table (`finance.corporate_ledger`) backed by a SQLite catalog and seeds records on `main`, recording baseline snapshot ID and amount statistics.
    2. **Snapshot Branching**: `stage_and_branch_candidate_batch` creates a reference branch (`audit_branch`) from `main` and appends candidate records to the branch. It verifies snapshot isolation: `main` remains untouched at baseline (5 rows), while `audit_branch` holds candidate records.
    3. **Quality Invariants**: `audit_branch_invariants` scans the candidate snapshot and evaluates 5 verification rules:
       - *Row Conservation*: Asserts branch rows equal baseline plus candidate rows without loss (Delta = 0).
       - *Primary Key Integrity*: Confirms 0 null or blank transaction IDs.
       - *Domain Enum Validity*: Asserts currency codes match supported ISO currencies (`USD`, `EUR`, `GBP`, `CAD`, `JPY`).
       - *Value Range Thresholds*: Verifies amounts exceed minimum limits (> $0.01).
       - *Statistical Drift*: Checks batch mean against baseline standard deviation (Z <= 3.0) to catch pricing anomalies.
    4. **Scorecard Evaluation**: `evaluate_audit_scorecard` (`OutputValues`) aggregates invariant outcomes and exports a structured scorecard.
    5. **Atomic Flow Gate**: `publish_gate` (`If`) inspects the audit verdict:
       - *On Pass (`then`)*: `fast_forward_main` fast-forwards `main` to `audit_branch` (<50ms, zero byte copy) and `record_lakehouse_manifest` logs published snapshot metadata in the Kestra KV store.
       - *On Failure (`else`)*: `halt_corrupt_execution` (`Fail`) trips the circuit breaker, preserving `main` at baseline while keeping `audit_branch` available for debugging.
    
    ## What you get
    
    - Serverless Apache Iceberg Write-Audit-Publish (WAP) in Python tasks.
    - Complete snapshot isolation ensuring readers never observe unverified data.
    - Multi-tier data quality gates covering conservation, nulls, and drift.
    - Atomic zero-copy metadata fast-forward promotion eliminating table rewrites.
    - Observability via Kestra KV store manifests and native output metrics.
    
    ## Who it's for
    
    - Data engineers building transactional lakehouses with strict quality guarantees.
    - Analytics engineers requiring zero-downtime ledger ingestion.
    - Platform teams implementing serverless WAP patterns.
    
    ## Why orchestrate this with Kestra
    
    - **Native Flow Control**: `If` and `Fail` tasks provide deterministic gate controls.
    - **Embedded Python Execution**: Runs PyIceberg inside containers without JVM overhead.
    - **Unified Metadata State**: Couples Iceberg manifests with Kestra KV store for lineage.
    - **Isolated Failure Triaging**: Retains faulted snapshots on branches for debugging.
    
    ## Prerequisites
    
    - A running Kestra 2.0+ instance with Docker enabled.
    - No external cloud storage accounts or credentials required.
    
    ### Secrets
    
    - None required.
    
    ## Quick start
    
    1. **Clean Promotion**: Trigger with default inputs. Invariants pass, `main` fast-forwards to snapshot s1, and the KV manifest is registered.
    2. **Circuit Breaker**: Run with `inject_corrupt_records: true`. Invariants fail, `main` stays locked at s0, and execution halts via `Fail`.
    3. **Custom Batches**: Supply custom thresholds via `candidate_batch_size`, `min_amount_threshold`, and `max_drift_stddev` to audit external batches.
    4. **Activate Trigger**: Enable the hourly Schedule trigger in the Triggers tab for continuous automated publishing.
    
    ## How to extend
    
    - **Catalog Federation**: Connect to AWS Glue, Polaris, or Nessie by updating catalog properties.
    - **Storage Persistence**: Configure S3, GCS, or ADLS paths in warehouse URI.
    - **Downstream Orchestration**: Add dbt models or BI refreshes triggered upon KV publication.
    
    ## Links
    
    - [Apache Iceberg Table Branching](https://iceberg.apache.org/docs/latest/branching/)
    - [PyIceberg Python Library Guide](https://py.iceberg.apache.org/)
    - [Kestra Python Script Plugin Reference](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
  subTags:
    - Storage & Lakehouse
    - Testing & Quality
  ee: false
  demo: false
