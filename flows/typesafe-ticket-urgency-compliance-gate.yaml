id: typesafe-ticket-urgency-compliance-gate
namespace: company.team
description: |
  Evaluate incoming ticket or record content against a calibrated
  urgency question via the TypeSafe API on a schedule, classify the
  result as CRITICAL, NORMAL, or UNREACHABLE against a probability
  threshold, log clean checks, and alert Slack the moment urgent
  content is detected or the API cannot be reached.

inputs:
  - id: ticket_content
    type: STRING
    defaults: "Help! My payouts have been failing for 3 days and I'm losing customers."
    displayName: "Ticket Content"
    description: "Text content to evaluate for urgency, for example a support ticket, review, or log record."
  - id: urgency_threshold
    type: FLOAT
    defaults: 0.7
    displayName: "Urgency Probability Threshold"
    description: "NOUL probability (0 to 1) at or above which content is classified CRITICAL."

triggers:
  - id: typesafe_urgency_gate_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Run a canary urgency check every hour. Replace with a webhook trigger per ticket in production."
    cron: "0 * * * *"
    disabled: true
    inputs:
      ticket_content: "Help! My payouts have been failing for 3 days and I'm losing customers."
      urgency_threshold: 0.7

tasks:
  - id: evaluate_ticket_urgency
    type: io.kestra.plugin.typesafe.Evaluate
    description: "Evaluate ticket_content against a single NOUL (yes/no probability) question asking whether the content conveys urgency."
    apiKey: "{{ secret('TYPESAFE_API_KEY') }}"
    state: "{{ inputs.ticket_content }}"
    questions:
      is_urgent:
        type: NOUL
        instructions: "Does this content convey urgency or describe a critical issue requiring immediate attention?"
    allowFailure: true

  - id: classify_urgency_level
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when no answers were returned, CRITICAL when the is_urgent NOUL probability is at or above urgency_threshold, otherwise NORMAL."
    format: "{{ outputs.evaluate_ticket_urgency.answers is defined ? (outputs.evaluate_ticket_urgency.answers.is_urgent.noul >= inputs.urgency_threshold ? 'CRITICAL' : 'NORMAL') : 'UNREACHABLE' }}"

  - id: route_by_urgency
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation for normal content, page Slack for a critical urgency reading, or page Slack when the API could not be reached."
    value: "{{ outputs.classify_urgency_level.value }}"
    cases:
      "NORMAL":
        - id: log_normal
          type: io.kestra.plugin.core.log.Log
          message: "Ticket content classified NORMAL, urgency probability {{ outputs.evaluate_ticket_urgency.answers.is_urgent.noul }}."
      "CRITICAL":
        - id: alert_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "TypeSafe sentinel CRITICAL: urgency probability {{ outputs.evaluate_ticket_urgency.answers.is_urgent.noul }} is at or above the threshold of {{ inputs.urgency_threshold }} for content: {{ inputs.ticket_content }}. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "TypeSafe sentinel UNREACHABLE: no answers were returned for the urgency check (invalid API key, platform outage, or malformed request). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed TypeSafe urgency check with status: {{ outputs.classify_urgency_level.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit status line recorded on every run regardless of branch, for a continuous urgency-triage trend in the execution history."
    message: "TypeSafe urgency audit: threshold={{ inputs.urgency_threshold }}, status={{ outputs.classify_urgency_level.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the gate flow itself fails, so a broken check never silently stops triaging urgent content."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "TypeSafe urgency gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). Urgency triage status is now unknown; check the task logs and the TypeSafe API manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_urgency_level.value }}"

extend:
  title: "TypeSafe Ticket Urgency Compliance Gate"
  metaTitle: TypeSafe Ticket Urgency Compliance Gate for Kestra
  shortDescription: Evaluate ticket or record content for urgency via the TypeSafe API on a schedule, classify it against a probability threshold, and alert Slack on critical content.
  metaDescription: Gate support ticket or record content on urgency probability via the TypeSafe API and alert Slack when content is critical.
  description: |
    A support ticket or incident record that says "losing customers right now" should never wait in a queue behind routine requests, but a human has to read it first for that to happen. This blueprint evaluates content against a calibrated yes/no urgency question through the TypeSafe API, classifies the result against a probability threshold, and pages Slack the moment something crosses it, instead of relying on someone noticing in time.

    ## How it works

    1. `evaluate_ticket_urgency` (`io.kestra.plugin.typesafe.Evaluate`) sends `ticket_content` as the `state` and a single `NOUL` question (`is_urgent`) asking whether the content conveys urgency. `allowFailure: true` means a connection or authentication failure still lets the flow continue instead of aborting.
    2. `classify_urgency_level` (`io.kestra.plugin.core.debug.Return`) checks whether `outputs.evaluate_ticket_urgency.answers` is defined; if not, `UNREACHABLE`. Otherwise it compares the `is_urgent` answer's `noul` probability (0 to 1) against `urgency_threshold`, returning `CRITICAL` or `NORMAL`.
    3. `route_by_urgency` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `NORMAL` logs a quiet confirmation, `CRITICAL` pages Slack with the probability and content, `UNREACHABLE` pages Slack separately, and `defaults` logs the raw outcome.
    4. `log_audit_status` records a status line on every run regardless of branch, so the execution history is a continuous triage trend.
    5. The `errors` block pages Slack separately if the flow itself fails outright.
    6. The `typesafe_urgency_gate_schedule` trigger runs an hourly canary check with explicit input overrides, shipped `disabled: true`; see How to extend for wiring it to real tickets.

    ## What you get

    - A calibrated urgency check backed by a typed question and answer, not a brittle keyword match.
    - A three-way `status` output (`CRITICAL` / `NORMAL` / `UNREACHABLE`) you can chart or gate other flows on.
    - A Slack page carrying the exact urgency probability behind a critical reading.
    - A separate failure channel for the gate flow itself, plus a standing audit log line per run.

    ## Who it's for

    - Support and operations teams who want an automatic first-pass triage signal before a human reads every incoming ticket or record.
    - Platform teams adding a consistent, typed classification step to an existing intake pipeline instead of ad hoc keyword rules.

    ## Why orchestrate this with Kestra

    A keyword filter in a script is brittle and untraceable; this flow makes the classification a first-class, typed step. Every evaluation is recorded in the execution history, the result becomes a typed output other flows can depend on, and the Switch branch is one edit away from real routing (paging on-call, opening a priority ticket) without rewriting the check itself.

    ## Prerequisites

    - A TypeSafe API key, created at [typesafe.ai](https://typesafe.ai/). No self-hostable open-source Docker image exists for the TypeSafe API, so test this blueprint directly against the live API; the plugin's own documentation does not state whether a free tier exists, so verify current pricing before relying on it for volume.
    - A Slack incoming webhook for the critical and unreachable alerts.

    ### Secrets

    - `TYPESAFE_API_KEY`: TypeSafe API key used to authenticate the evaluation request.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the critical alert, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_TYPESAFE_API_KEY` and `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-api-key>" | base64` and `echo -n "<your-webhook-url>" | base64`.

    ## Quick start

    1. Add the `TYPESAFE_API_KEY` and `SLACK_WEBHOOK_URL` secrets.
    2. Set `ticket_content` to a real example and `urgency_threshold` to the probability you want to gate on.
    3. Run the flow once and confirm `status` reads `CRITICAL` for an urgent example and `NORMAL` for a routine one.
    4. Enable `typesafe_urgency_gate_schedule`, or replace it with a webhook trigger fed by your real ticket intake.

    ## How to extend

    - Replace the `Schedule` trigger with a `Webhook` trigger so every incoming ticket is evaluated as it arrives instead of on a fixed interval.
    - Add a `CHOICE` question (for example routing by department) alongside `is_urgent` and branch the `Switch` on both answers.
    - Use the `confidence` field on the answer to route low-confidence evaluations to human review instead of trusting a borderline score.

    ## Links

    - [TypeSafe API](https://typesafe.ai/)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Data
    - Business
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
