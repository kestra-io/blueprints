id: poetrydb-shakespeare-sonnets-lakehouse-loader
namespace: company.analytics
description: Ingests classical poetic sonnets, verse structure, line counts, and literary stanzas from PoetryDB API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: poetrydb-shakespeare-sonnets-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://poetrydb.org/author,title/Shakespeare;Sonnet"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = ""
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for item in items:
            title = str(item.get('title', 'Untitled'))
            current_ids.append(title)
            author = item.get('author', 'William Shakespeare')
            try:
                lcount = int(item.get('linecount', 14))
            except Exception:
                lcount = 14
            lines = item.get('lines', [])
            f_line = lines[0] if lines else ''

            records.append({
                'title': title,
                'author': str(author),
                'linecount': lcount,
                'first_line': str(f_line),
                'is_new': bool(title not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE shakespeare_sonnets (
                title VARCHAR,
                author VARCHAR,
                linecount INTEGER,
                first_line VARCHAR,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO shakespeare_sonnets SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY shakespeare_sonnets TO 'shakespeare_sonnets.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    linecount,
                    COUNT(*) AS sonnet_count
                FROM shakespeare_sonnets
                GROUP BY 1
                ORDER BY linecount ASC
            ) TO 'sonnets_by_linecount.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM shakespeare_sonnets WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM shakespeare_sonnets").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - shakespeare_sonnets.parquet
      - sonnets_by_linecount.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['shakespeare_sonnets.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "PoetryDB Shakespeare Sonnets sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
