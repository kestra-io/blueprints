id: shopify-high-value-abandoned-checkout-recovery-sentinel
namespace: company.ecommerce

inputs:
  - id: shopify_shop_name
    type: STRING
    displayName: Shopify Shop Name
    defaults: "my-ecommerce-store"
    description: Shopify store domain slug (e.g. 'my-ecommerce-store' for my-ecommerce-store.myshopify.com).

  - id: api_version
    type: STRING
    displayName: Shopify Admin API Version
    defaults: "2024-07"
    description: Supported Shopify GraphQL Admin API version string (e.g. '2024-07' or '2024-10').

  - id: min_cart_value_usd
    type: INT
    displayName: Minimum VIP Cart Value (USD)
    defaults: 250
    description: Minimum abandoned cart value threshold to trigger VIP concierge outreach.

  - id: checkouts_batch_size
    type: INT
    displayName: Checkouts Batch Size
    defaults: 25
    description: Number of recent abandoned checkouts to retrieve and evaluate.

triggers:
  - id: recurring_cart_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: 30-minute recurring inspection to surface high-ticket abandoned checkouts for rapid sales recovery. Shipped disabled by default.
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: fetch_abandoned_checkouts
    type: io.kestra.plugin.graphql.Request
    description: Query Shopify Admin GraphQL API for recent abandoned checkouts with recovery URLs and customer details.
    uri: "https://{{ inputs.shopify_shop_name }}.myshopify.com/admin/api/{{ inputs.api_version }}/graphql.json"
    headers:
      X-Shopify-Access-Token: "{{ secret('SHOPIFY_ACCESS_TOKEN') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-Shopify-Cart-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query GetAbandonedCheckouts {
        abandonedCheckouts(first: {{ inputs.checkouts_batch_size }}, sortKey: CREATED_AT, reverse: true) {
          edges {
            node {
              id
              createdAt
              completed
              recoveryUrl
              totalPriceSet {
                shopMoney {
                  amount
                  currencyCode
                }
              }
              customer {
                firstName
                lastName
                email
                phone
              }
            }
          }
        }
      }

  - id: evaluate_high_value_abandoned
    type: io.kestra.plugin.core.flow.If
    description: Check whether open high-value abandoned checkouts meet the VIP threshold.
    condition: "{{ outputs.fetch_abandoned_checkouts.body is defined and outputs.fetch_abandoned_checkouts.body.abandonedCheckouts is defined and (((outputs.fetch_abandoned_checkouts.body.abandonedCheckouts.edges | jq('[.[].node | select(.completed == false and ((.totalPriceSet.shopMoney.amount | tonumber) >= ' + (inputs.min_cart_value_usd | tostring) + '))] | length') | first) | int) > 0) }}"
    then:
      - id: alert_vip_recovery
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority Slack notification itemizing VIP abandoned carts with customer details and direct recovery URLs.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🛍️ *SHOPIFY VIP RECOVERY: High-Value Abandoned Carts Detected* 🛍️\n\n*Store:* `{{ inputs.shopify_shop_name }}`\n*High-Value Abandoned Count:* {{ outputs.fetch_abandoned_checkouts.body.abandonedCheckouts.edges | jq('[.[].node | select(.completed == false and ((.totalPriceSet.shopMoney.amount | tonumber) >= ' + (inputs.min_cart_value_usd | tostring) + '))] | length') | first }}\n*Cart Threshold:* >= ${{ inputs.min_cart_value_usd }}\n\n*Carts Requiring Concierge Outreach:*\n{{ outputs.fetch_abandoned_checkouts.body.abandonedCheckouts.edges | jq('[.[].node | select(.completed == false and ((.totalPriceSet.shopMoney.amount | tonumber) >= ' + (inputs.min_cart_value_usd | tostring) + ')) | \"• *$\" + .totalPriceSet.shopMoney.amount + \" \" + .totalPriceSet.shopMoney.currencyCode + \"* - Customer: \" + (.customer.firstName // \"Guest\") + \" \" + (.customer.lastName // \"\") + \" (\" + (.customer.email // .customer.phone // \"no contact info\") + \") - <\" + .recoveryUrl + \"|Open Recovery Link>\"] | join(\"\\n\")') | first }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* Sales / Concierge team please reach out to high-ticket shoppers before interest wanes."
          }
    else:
      - id: log_carts_normal
        type: io.kestra.plugin.core.log.Log
        description: Log clean status when zero abandoned checkouts breach the VIP dollar threshold.
        message: "HEALTHY: Zero abandoned checkouts exceeding ${{ inputs.min_cart_value_usd }} detected on store {{ inputs.shopify_shop_name }}."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for revenue recovery.
    message: "Shopify abandoned checkout audit finished for {{ inputs.shopify_shop_name }}. Total evaluated checkouts: {{ outputs.fetch_abandoned_checkouts.body is defined and outputs.fetch_abandoned_checkouts.body.abandonedCheckouts is defined ? (outputs.fetch_abandoned_checkouts.body.abandonedCheckouts.edges | length) : 0 }}. VIP carts flagged: {{ outputs.fetch_abandoned_checkouts.body is defined and outputs.fetch_abandoned_checkouts.body.abandonedCheckouts is defined ? (outputs.fetch_abandoned_checkouts.body.abandonedCheckouts.edges | jq('[.[].node | select(.completed == false and ((.totalPriceSet.shopMoney.amount | tonumber) >= ' + (inputs.min_cart_value_usd | tostring) + '))] | length') | first) : 0 }}."

errors:
  - id: alert_on_shopify_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert E-Commerce Operations if Shopify Admin GraphQL API request fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Shopify Cart Sentinel Error*: Execution `{{ execution.id }}` failed to query store `{{ inputs.shopify_shop_name }}`. Check SHOPIFY_ACCESS_TOKEN scope."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.fetch_abandoned_checkouts.body is defined and outputs.fetch_abandoned_checkouts.body.abandonedCheckouts is defined and (((outputs.fetch_abandoned_checkouts.body.abandonedCheckouts.edges | jq('[.[].node | select(.completed == false and ((.totalPriceSet.shopMoney.amount | tonumber) >= ' + (inputs.min_cart_value_usd | tostring) + '))] | length') | first) | int) > 0) ? 'VIP_CARTS_DETECTED' : 'HEALTHY' }}"
  - id: high_value_abandoned_count
    type: INT
    value: "{{ outputs.fetch_abandoned_checkouts.body is defined and outputs.fetch_abandoned_checkouts.body.abandonedCheckouts is defined ? ((outputs.fetch_abandoned_checkouts.body.abandonedCheckouts.edges | jq('[.[].node | select(.completed == false and ((.totalPriceSet.shopMoney.amount | tonumber) >= ' + (inputs.min_cart_value_usd | tostring) + '))] | length') | first) | int) : 0 }}"

extend:
  title: Shopify high-value abandoned checkout recovery sentinel
  metaTitle: Shopify Abandoned Checkout Recovery | Kestra
  shortDescription: Proactive e-commerce sentinel that queries Shopify Admin GraphQL API for high-value abandoned checkouts, dispatching VIP recovery links to sales teams.
  metaDescription: Audit Shopify abandoned checkouts via GraphQL Admin API for high-value carts and dispatch VIP recovery alerts to sales teams to reclaim lost revenue.
  description: |
    Recover high-ticket lost revenue and convert hesitant high-value buyers through timely, personalized sales outreach. In premium e-commerce and B2B storefronts, abandoned carts valued at $250, $500, or more represent critical revenue opportunities that generic, automated marketing emails often fail to rescue. This blueprint executes a 30-minute recurring inspection via the Shopify Admin GraphQL API (`io.kestra.plugin.graphql.Request`), isolates uncompleted checkouts exceeding your high-value threshold, and delivers an instant Slack alert to sales and VIP concierge teams with the customer's contact details and direct checkout `recoveryUrl`.

    ## How it works
    1. A `Schedule` trigger initiates a checkout audit every 30 minutes (shipped disabled by default).
    2. Task `fetch_abandoned_checkouts` queries the Shopify Admin GraphQL API endpoint (`https://<shop>.myshopify.com/admin/api/<version>/graphql.json`) authenticated via `X-Shopify-Access-Token`. It fetches recent abandoned checkouts including cart totals, currency codes, customer names, emails, phone numbers, and unique `recoveryUrl` links.
    3. Task `evaluate_high_value_abandoned` (`io.kestra.plugin.core.flow.If`) applies a jq filter to count uncompleted checkouts where the monetary amount is greater than or equal to `inputs.min_cart_value_usd`:
       - If high-value carts exist: Task `alert_vip_recovery` posts an itemized Slack alert containing customer contact info and direct recovery links for immediate concierge follow-up.
       - If no carts exceed threshold: Task `log_carts_normal` logs clean operational status.
    4. Task `log_audit_summary` logs the total evaluated and flagged checkout metrics.
    5. Top-level `errors` handler alerts operations if API tokens expire or permissions are revoked.

    ## What you get
    - Real-time visibility into high-ticket sales opportunities abandoned at checkout.
    - Clickable Shopify recovery URLs enabling sales reps to pre-populate carts for customers.
    - Proactive revenue recovery outpacing standard bulk email automations.
    - Measurable lift in average order value (AOV) and conversion rates.

    ## Who it's for
    - E-Commerce Sales Leads and VIP Concierge Support teams.
    - DTC Brand Managers selling high-ticket luxury, electronics, or designer goods.
    - Revenue Operations and Growth Marketing teams optimizing checkout funnels.

    ## Why orchestrate this with Kestra
    Standard Shopify abandoned cart automations are one-size-fits-all and lack real-time escalation channels for VIP buyers. Kestra provides declarative, scheduled orchestration that queries Shopify's GraphQL API directly, handles secure API secrets, executes real-time jq arithmetic filtering on cart amounts, and alerts specialized sales channels in Slack within minutes of checkout abandonment.

    ## Prerequisites
    - A Shopify store with access to the Shopify Admin API.
    - API scopes including `read_orders` enabled on the access token.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `SHOPIFY_ACCESS_TOKEN`: Shopify Admin API access token passed in the `X-Shopify-Access-Token` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to post VIP cart alerts.

    ## Quick start
    1. Create a Custom App in Shopify Admin under **Settings > Apps and sales channels > Develop apps** with `read_orders` scope.
    2. Store your access token and Slack webhook in Kestra Secrets (`SHOPIFY_ACCESS_TOKEN` and `SLACK_WEBHOOK_URL`).
    3. Configure `shopify_shop_name` with your store domain slug (e.g. `brand-store`) and set `min_cart_value_usd` (e.g. `250`).
    4. Execute the flow manually in Kestra to confirm successful GraphQL connection.
    5. Enable the `recurring_cart_sweep` schedule to activate 30-minute VIP cart monitoring.

    ## How to extend
    - Send SMS reminders directly to customers via Twilio integration for carts exceeding $1,000.
    - Automatically generate and attach a one-time 10% VIP discount code to the recovery URL.
    - Sync high-value abandoned contacts directly to HubSpot or Klaviyo VIP segments.

    ## Links
    - [Shopify GraphQL Admin API: AbandonedCheckouts](https://shopify.dev/docs/api/admin-graphql/latest/queries/abandonedCheckouts)
    - [Kestra GraphQL Plugin](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - Infrastructure
  subTags:
    - Customer Success
    - Reporting & Digests
  ee: false
  demo: false
