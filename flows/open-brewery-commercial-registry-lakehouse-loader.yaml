id: open-brewery-commercial-registry-lakehouse-loader
namespace: company.analytics
description: Ingests commercial craft brewery facilities, geospatial coordinates, and operational classifications from Open Brewery DB into Parquet lakehouse storage via DuckDB, tracking facility directories in Kestra KV store.

inputs:
  - id: city
    type: STRING
    description: Urban municipal jurisdiction to query.
    defaults: "san_diego"

  - id: per_page
    type: INT
    description: Maximum number of commercial facilities to extract.
    defaults: 50

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known brewery facility IDs.
    defaults: open_brewery_monitored_facility_state

variables:
  default_state: "[]"

triggers:
  - id: monthly_brewery_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 1 * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_breweries
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state)) if raw_state else set()
        except Exception:
            seen_ids = set()

        city = "{{ inputs.city }}"
        per_page = int("{{ inputs.per_page }}")

        url = f"https://api.openbrewerydb.org/v1/breweries?by_city={city}&per_page={per_page}"
        headers = {"User-Agent": "KestraBreweryLakehouse/1.0 (facility-analytics@kestra.io)"}

        records = []
        new_facilities = []
        harvested_ids = []

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                breweries = resp.json()
                for b in breweries:
                    b_id = b.get("id", "")
                    name = b.get("name", "")
                    b_type = b.get("brewery_type", "micro")
                    street = b.get("street") or ""
                    city_val = b.get("city", "")
                    state_val = b.get("state_province") or b.get("state") or ""
                    postal = b.get("postal_code", "")
                    country = b.get("country", "")
                    lon = float(b.get("longitude", 0.0) or 0.0)
                    lat = float(b.get("latitude", 0.0) or 0.0)
                    website = b.get("website_url") or ""

                    is_new = b_id not in seen_ids
                    harvested_ids.append(b_id)

                    records.append({
                        "brewery_id": b_id,
                        "name": name,
                        "brewery_type": b_type,
                        "street": street,
                        "city": city_val,
                        "state_province": state_val,
                        "postal_code": postal,
                        "country": country,
                        "longitude": lon,
                        "latitude": lat,
                        "website_url": website,
                        "is_new_facility": is_new,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_new:
                        new_facilities.append({"id": b_id, "name": name, "type": b_type})
        except Exception as e:
            print(f"Error fetching Open Brewery DB: {e}")

        with open("breweries.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE breweries AS SELECT * FROM read_json_auto('breweries.json')")
            con.execute("COPY breweries TO 'brewery_registry.parquet' (FORMAT PARQUET)")
            con.execute("COPY breweries TO 'brewery_registry.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE breweries (
                    brewery_id VARCHAR,
                    name VARCHAR,
                    brewery_type VARCHAR,
                    street VARCHAR,
                    city VARCHAR,
                    state_province VARCHAR,
                    postal_code VARCHAR,
                    country VARCHAR,
                    longitude DOUBLE,
                    latitude DOUBLE,
                    website_url VARCHAR,
                    is_new_facility BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY breweries TO 'brewery_registry.parquet' (FORMAT PARQUET)")
            con.execute("COPY breweries TO 'brewery_registry.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_breweries_count": len(records),
            "new_breweries_count": len(new_facilities),
            "new_breweries": new_facilities[:5],
            "updated_state": list(set(list(seen_ids) + harvested_ids))[:500]
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - brewery_registry.parquet
      - brewery_registry.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_breweries.vars.updated_state | toJson }}"

  - id: check_new_facilities
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_breweries.vars.new_breweries_count > 0 }}"
    then:
      - id: notify_new_breweries
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "🍺 Commercial Brewery Registry Update: Discovered {{ outputs.ingest_and_transform_breweries.vars.new_breweries_count }} newly registered brewery facilities in {{ inputs.city }}."

outputs:
  - id: total_breweries
    type: INT
    value: "{{ outputs.ingest_and_transform_breweries.vars.total_breweries_count }}"
  - id: new_breweries_count
    type: INT
    value: "{{ outputs.ingest_and_transform_breweries.vars.new_breweries_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_breweries.outputFiles['brewery_registry.parquet'] }}"

extend:
  title: Open Brewery DB Commercial Facility Lakehouse Loader with DuckDB
  metaTitle: Open Brewery DB Lakehouse Loader | Kestra
  shortDescription: Ingests commercial craft brewery facilities, geospatial coordinates, and operational classifications from Open Brewery DB into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Open Brewery DB API for commercial brewery facilities, convert geospatial directory entries into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, geospatial harmonization, and analytical lakehouse persistence of commercial
    craft breweries, microbreweries, operational classifications, and coordinates from Open Brewery DB into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`open_brewery_monitored_facility_state`) for previously verified brewery facility identifiers.
    2. **Open Brewery DB Ingestion**: Queries the official Open Brewery DB REST API (`api.openbrewerydb.org/v1/breweries`) filtered by municipal jurisdiction.
    3. **DuckDB Harmonization**: Normalizes operational facility classifications, addresses, phone numbers, and coordinates into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized commercial registry records into columnar Parquet and CSV files for retail supply chain modeling and local business analytics.
    5. **New Facility Detection & State Commitment**: Identifies newly opened brewing establishments, logs discovery notices, and commits state to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of commercial hospitality and beverage manufacturing directories.
    - Columnar Parquet datasets queryable with DuckDB, GIS toolchains, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Hospitality Supply Chain Analysts tracking regional craft beverage production.
    - GIS Analysts maintaining commercial point-of-interest (POI) dimensions.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical facility states across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `api.openbrewerydb.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting teams on newly registered facilities.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set your target `city` parameter.
    3. Click **Execute** to run an immediate harvest and generate the Parquet table.
    4. Enable the `monthly_brewery_sync` schedule for automated monthly updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition monthly brewery registries.
    - Connect a spatial distance join step in DuckDB to compute proximity to urban centers.

    ## Links

    - [Open Brewery DB Documentation](https://www.openbrewerydb.org/documentation)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
