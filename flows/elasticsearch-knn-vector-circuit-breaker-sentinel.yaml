id: elasticsearch-knn-vector-circuit-breaker-sentinel
namespace: company.ai

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Hostname or IP of Elasticsearch node.
  - id: es_port
    type: INT
    defaults: 9200
    description: Elasticsearch HTTP port.

tasks:
  - id: inspect_circuit_breakers
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query node stats for circuit breakers and fielddata/parent breaker trips
        curl -s -u "{{ inputs.es_user }}:{{ secret('ES_PASSWORD') }}"           "http://{{ inputs.es_host }}:{{ inputs.es_port }}/_nodes/stats/breaker" > /tmp/es_breaker_telemetry.json
        
        TRIPPED=$(jq '[.nodes[]?.breakers.parent.tripped // 0] | add // 0' /tmp/es_breaker_telemetry.json)
        echo "::set-output name=parent_tripped::$TRIPPED::"

  - id: evaluate_circuit_breakers
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_circuit_breakers.vars.parent_tripped | int > 0 }}"
    then:
      - id: notify_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#search-platform",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Circuit Breaker Tripped Alert",
                "text": "Elasticsearch cluster at `{{ inputs.es_host }}` recorded *{{ outputs.inspect_circuit_breakers.vars.parent_tripped }} circuit breaker trips*! High-dimensional kNN vector searches or aggregations have exceeded JVM heap limits, rejecting search requests.",
                "footer": "Kestra AI Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#search-platform",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Circuit Breaker Sentinel Failure",
            "text": "Failed to query Elasticsearch nodes stats API. Verify credentials and network access.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Elasticsearch kNN Vector Search Circuit Breaker and Latency Sentinel
  shortDescription: Monitors Elasticsearch cluster for kNN vector search circuit breaker trips and heap memory pressure.
  description: |
    ## How it works
    This workflow queries the Elasticsearch Nodes Stats API (`/_nodes/stats/breaker`) to inspect circuit breaker status across all data nodes. In hybrid search and dense vector applications (such as Elasticsearch `dense_vector` with HNSW), approximate kNN searches consume extensive off-heap and heap memory. When queries push memory usage beyond safety thresholds, the parent circuit breaker trips to prevent JVM OutOfMemoryError crashes, returning `CircuitBreakingException` to clients. This workflow monitors breaker trips and alerts search platform teams before query outages escalate.

    ## What you get
    - Real-time detection of circuit breaker trips in Elasticsearch vector search clusters.
    - Prevents silent rejection of search queries and semantic retrieval requests.
    - Actionable visibility into cluster memory pressure.

    ## Who it's for
    - Search Platform Engineers and SREs operating Elasticsearch and OpenSearch clusters.
    - AI Engineers deploying enterprise hybrid search and dense vector retrieval systems.

    ## Why orchestrate this with Kestra
    - **Continuous Fleet Auditing**: Scrapes cluster stats on a steady schedule.
    - **Proactive Reliability Assurance**: Catches memory saturation before nodes crash.
    - **Secure Integration**: Uses Kestra secrets for basic authentication credentials.

    ## Prerequisites
    - Running Elasticsearch cluster with HTTP API reachable.
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Elasticsearch host, port, and username.
    3. Run the workflow to inspect circuit breaker metrics.

    ## How to extend
    - Inspect vector index segment memory directly via `_cat/segments`.
    - Adjust `indices.breaker.total.use_real_memory` settings dynamically when trip frequency increases.

    ## Links
    - [Elasticsearch Circuit Breaker Settings Documentation](https://www.elastic.co/guide/en/elasticsearch/reference/current/circuit-breaker.html)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - AI
    - Data
  ee: false
  demo: false
