id: elasticsearch-knn-vector-circuit-breaker-sentinel
namespace: company.team

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Hostname or IP of Elasticsearch node.
  - id: es_port
    type: INT
    defaults: 9200
    description: Elasticsearch HTTP port.
  - id: es_user
    type: STRING
    defaults: "elastic"
    description: Elasticsearch username.

tasks:
  - id: inspect_circuit_breakers
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.es_host }}"
      ES_PORT: "{{ inputs.es_port }}"
      ES_USER: "{{ inputs.es_user }}"
      ES_PASSWORD: "{{ secret('ES_PASSWORD') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "elasticsearch.internal")
      port = os.environ.get("ES_PORT", "9200")
      user = os.environ.get("ES_USER", "elastic")
      password = os.environ.get("ES_PASSWORD", "")

      auth = (user, password) if user and password else None
      url = f"http://{host}:{port}/_nodes/stats/breaker"

      try:
          resp = requests.get(url, auth=auth, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"CRITICAL: Failed to query Elasticsearch breaker stats at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      nodes = data.get("nodes", {})
      parent_tripped = 0

      for node_id, node_data in nodes.items():
          breakers = node_data.get("breakers", {})
          parent_tripped += breakers.get("parent", {}).get("tripped", 0)

      report = {
          "parent_tripped": parent_tripped,
          "total_nodes": len(nodes)
      }

      with open("breaker_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "parent_tripped": parent_tripped
      })
      print(f"Circuit breaker inspection: parent_tripped={parent_tripped}")
    outputFiles:
      - breaker_report.json

  - id: evaluate_circuit_breakers
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_circuit_breakers.vars.parent_tripped | int > 0 }}"
    then:
      - id: notify_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#search-platform",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Circuit Breaker Tripped Alert",
                "text": "Elasticsearch cluster at `{{ inputs.es_host }}` recorded *{{ outputs.inspect_circuit_breakers.vars.parent_tripped }} circuit breaker trips*! High-dimensional kNN vector searches or aggregations have exceeded JVM heap limits, rejecting search requests.",
                "footer": "Kestra AI Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#search-platform",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Circuit Breaker Sentinel Failure",
            "text": "Failed to query Elasticsearch nodes stats API. Verify credentials and network access. Execution ID: {{ execution.id }}",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Elasticsearch parent circuit breakers to detect kNN vector search and aggregation memory saturation."
  metaTitle: Elasticsearch kNN Vector Search Circuit Breaker Sentinel with Kestra
  title: Elasticsearch kNN Vector Search Circuit Breaker Sentinel
  shortDescription: Audits Elasticsearch parent circuit breakers to detect kNN vector search and aggregation memory saturation.
  description: |
    ## How it works
    This workflow queries `_nodes/stats/breaker` to check the parent circuit breaker trip counts across all cluster nodes. The parent circuit breaker measures overall real JVM memory usage and trips when heap allocations for high-dimensional vector search queries or complex aggregations exceed memory thresholds. The sentinel detects tripped breakers and immediately dispatches alerts to platform teams.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_schedule Schedule Trigger] --> B[inspect_circuit_breakers Python Script]
      B --> C{Circuit Breaker Tripped?}
      C -- Yes --> D[notify_search_team Slack Webhook]
      C -- No --> E[Breakers Nominal]
    ```

    ## Prerequisites
    - Elasticsearch cluster (7.x / 8.x) accessible via REST.
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure cluster host and credentials.
    3. Run manually to test circuit breaker status.

    ## Links
    - [Elasticsearch Circuit Breaker Documentation](https://www.elastic.co/guide/en/elasticsearch/reference/current/circuit-breaker.html)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - AI & Copilot
    - Day 2 Operations
  ee: false
  demo: false
