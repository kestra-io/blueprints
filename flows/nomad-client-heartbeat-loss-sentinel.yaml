id: nomad-client-heartbeat-loss-sentinel
namespace: company.sre
description: 'Audits HashiCorp Nomad cluster telemetry to detect client node heartbeat
  loss, unready node states, and allocation rescheduling storms.

  '
concurrency:
  limit: 1
inputs:
- id: nomad_api_url
  type: STRING
  displayName: Nomad API Endpoint
  defaults: http://nomad-server.orchestration.svc.cluster.local:4646
  description: Base HTTP URL of the HashiCorp Nomad Server cluster API endpoint.
- id: region_name
  type: STRING
  displayName: Target Region
  defaults: global
  description: Identifier of the target Nomad region under active client node and
    allocation surveillance.
- id: max_lost_heartbeats
  type: INT
  displayName: Max Lost Heartbeats
  defaults: 2
  description: Maximum allowable client nodes experiencing lost heartbeats within
    the audit window before alerting.
- id: lookback_minutes
  type: INT
  displayName: Lookback Period (Minutes)
  defaults: 15
  description: Time duration in minutes across which Nomad node status metrics are
    evaluated.
- id: alert_on_lost
  type: BOOL
  displayName: Alert On Heartbeat Loss
  defaults: true
  description: Toggle whether Slack alerts are dispatched upon detecting lost Nomad
    client heartbeats.
tasks:
- id: scan_nomad_client_nodes
  type: io.kestra.plugin.scripts.python.Script
  description: Interrogates the Nomad REST API to inspect client node status, heartbeat
    health, and scheduling eligibility.
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
  - pip install requests kestra
  env:
    NOMAD_URL: '{{ inputs.nomad_api_url }}'
    REGION: '{{ inputs.region_name }}'
    MAX_LOST: '{{ inputs.max_lost_heartbeats }}'
    NOMAD_TOKEN: '{{ secret(''NOMAD_HTTP_TOKEN'') }}'
  script: "import os\nimport sys\nfrom datetime import datetime, timezone\nimport\
    \ requests\nfrom kestra import Kestra\n\napi_url = os.environ.get(\"NOMAD_URL\"\
    , \"http://nomad-server:4646\").rstrip(\"/\")\nregion = os.environ.get(\"REGION\"\
    , \"global\")\nmax_lost = int(os.environ.get(\"MAX_LOST\", \"2\"))\ntoken = os.environ.get(\"\
    NOMAD_TOKEN\", \"\")\n\nready_nodes = 0\ndown_nodes = 0\ndraining_nodes = 0\n\
    down_node_names = []\n\nheaders = {\"X-Nomad-Token\": token} if token else {}\n\
    url = f\"{api_url}/v1/nodes?region={region}\"\n\ntry:\n    resp = requests.get(url,\
    \ headers=headers, timeout=12)\n    resp.raise_for_status()\n    nodes = resp.json()\n\
    except Exception as err:\n    sys.stderr.write(f\"Failed to query Nomad nodes\
    \ from {url}: {err}\\n\")\n    sys.exit(1)\n\nfor n in nodes:\n    status = n.get(\"\
    Status\", \"unknown\")\n    name = n.get(\"Name\", \"unknown-node\")\n    drain\
    \ = n.get(\"Drain\", False)\n\n    if status == \"ready\":\n        ready_nodes\
    \ += 1\n    elif status == \"down\":\n        down_nodes += 1\n        down_node_names.append(name)\n\
    \    \n    if drain:\n        draining_nodes += 1\n\ntotal_nodes = ready_nodes\
    \ + down_nodes\nis_breached = bool(down_nodes >= max_lost)\nnow_iso = datetime.now(timezone.utc).isoformat()\n\
    \nKestra.outputs({\n    \"down_nodes_count\": down_nodes,\n    \"ready_nodes_count\"\
    : ready_nodes,\n    \"draining_nodes_count\": draining_nodes,\n    \"total_nodes_count\"\
    : total_nodes,\n    \"down_node_names\": down_node_names,\n    \"is_alerting\"\
    : is_breached,\n    \"region_target\": region,\n    \"audit_timestamp\": now_iso\n\
    })\n"
- id: evaluate_node_loss_threshold
  type: io.kestra.plugin.core.flow.If
  description: Evaluates whether observed Nomad client node heartbeat loss count exceeds
    operational tolerance bounds.
  condition: '{{ outputs.scan_nomad_client_nodes.vars.is_alerting and inputs.alert_on_lost
    }}'
  then:
  - id: notify_slack_nomad_sre
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-urgency incident notification to SRE Slack channel
      detailing Nomad client heartbeat loss.
    url: '{{ secret(''SLACK_WEBHOOK_URL'') }}'
    payload: "{\n  \"channel\": \"#orchestration-alerts\",\n  \"username\": \"Nomad\
      \ Cluster Sentinel\",\n  \"icon_emoji\": \":warning:\",\n  \"text\": \"CRITICAL:\
      \ Nomad client node heartbeat loss detected in region `{{ inputs.region_name\
      \ }}`. Down Nodes: `{{ outputs.scan_nomad_client_nodes.vars.down_nodes_count\
      \ }}` (threshold: `{{ inputs.max_lost_heartbeats }}`). Ready Nodes: `{{ outputs.scan_nomad_client_nodes.vars.ready_nodes_count\
      \ }}`. Draining: `{{ outputs.scan_nomad_client_nodes.vars.draining_nodes_count\
      \ }}`. Workload allocations may be undergoing unexpected rescheduling storms.\"\
      \n}\n"
  else:
  - id: log_nominal_nomad_state
    type: io.kestra.plugin.core.log.Log
    description: Records nominal telemetry when Nomad client nodes maintain regular
      heartbeats with server leaders.
    message: Nomad region {{ inputs.region_name }} nominal. Down nodes {{ outputs.scan_nomad_client_nodes.vars.down_nodes_count
      }} is below threshold {{ inputs.max_lost_heartbeats }}.
- id: emit_audit_manifest
  type: io.kestra.plugin.core.debug.Return
  description: Emits structured JSON audit payload for workload orchestration records,
    SRE dashboards, and audit logs.
  format: "{\n  \"sentinel_id\": \"nomad-client-heartbeat-loss-sentinel\",\n  \"region\"\
    : \"{{ inputs.region_name }}\",\n  \"down_nodes\": {{ outputs.scan_nomad_client_nodes.vars.down_nodes_count\
    \ }},\n  \"ready_nodes\": {{ outputs.scan_nomad_client_nodes.vars.ready_nodes_count\
    \ }},\n  \"draining_nodes\": {{ outputs.scan_nomad_client_nodes.vars.draining_nodes_count\
    \ }},\n  \"is_alerting\": {{ outputs.scan_nomad_client_nodes.vars.is_alerting\
    \ }},\n  \"timestamp\": \"{{ outputs.scan_nomad_client_nodes.vars.audit_timestamp\
    \ }}\"\n}\n"
triggers:
- id: periodic_nomad_audit
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
extend:
  title: Nomad Client Heartbeat Loss Sentinel
  metaTitle: HashiCorp Nomad Client Heartbeat Loss and Node State Sentinel Blueprint
  shortDescription: Audits HashiCorp Nomad cluster telemetry to detect client node
    heartbeat loss, unready states, and rescheduling storms.
  metaDescription: Audits Nomad API to detect client heartbeat loss and unready node
    states, alerting SRE teams on Slack.
  description: "Automates continuous cluster membership and workload placement surveillance\
    \ of HashiCorp Nomad orchestration clusters. Interrogates the Nomad REST API to\
    \ detect lost client worker heartbeats, unready host states, and sudden node dropouts\
    \ before automated allocation rescheduling causes resource contention and service\
    \ brownouts.\n\n## How it works\n1. **Automated Scheduled Sweep**: The schedule\
    \ trigger initiates a surveillance cycle every 15 minutes to inspect Nomad cluster\
    \ node health.\n2. **API Node Query**: An isolated Python task authenticates against\
    \ the Nomad HTTP API, querying `/v1/nodes` across target regions.\n3. **Heartbeat\
    \ Health Evaluation**: Categorizes client nodes into ready, down, and draining\
    \ states, identifying nodes with lost heartbeats.\n4. **Safety Boundary Gate**:\
    \ Compares observed down nodes against acceptable engineering tolerances (default\
    \ 2 nodes).\n5. **Incident Notification**: Emits formatted Slack alerts to orchestration\
    \ reliability channels with exact region identifiers, down counts, and node names.\n\
    6. **Manifest Publication**: Outputs a structured machine-readable JSON object\
    \ recording compute infrastructure availability for SRE operational archives.\n\
    \n## Architecture diagram\n```mermaid\nflowchart TD\n    A[periodic_nomad_audit\
    \ Schedule Trigger] --> B[scan_nomad_client_nodes Python Script]\n    B --> C[evaluate_node_loss_threshold\
    \ Flowable If]\n    C -- Down Nodes Exceeded --> D[notify_slack_nomad_sre Slack\
    \ Webhook]\n    C -- Client Nodes Ready --> E[log_nominal_nomad_state Core Log]\n\
    \    D --> F[emit_audit_manifest Debug Return]\n    E --> F\n```\n\n## Architecture\
    \ components\n- **Trigger (`periodic_nomad_audit`)**: Automated cron trigger executing\
    \ regular surveillance sweeps across production Nomad regions.\n- **Inspection\
    \ Task (`scan_nomad_client_nodes`)**: Dockerized Python runtime querying Nomad\
    \ REST APIs with connection timeout safeguards.\n- **Evaluation Gate (`evaluate_node_loss_threshold`)**:\
    \ Conditional branching logic isolating unexpected node failures from planned\
    \ host maintenance drains.\n- **Notification Action (`notify_slack_nomad_sre`)**:\
    \ Formatted Slack webhook message delivering actionable telemetry and remediation\
    \ runbooks.\n- **Manifest Return (`emit_audit_manifest`)**: Standardized JSON\
    \ output recording exact run parameters for compliance and reliability reporting.\n\
    \n## Key capabilities\n- **Allocation Rescheduling Storm Prevention**: Detects\
    \ sudden node loss before mass reallocation of hundreds of containers exhausts\
    \ remaining cluster memory.\n- **Zombie Client Identification**: Identifies compute\
    \ nodes whose network links to Nomad server leaders have dropped while containers\
    \ continue running.\n- **Zero-Touch Execution**: Operates agentlessly by polling\
    \ standard Nomad HTTP APIs over secure internal networks.\n- **Region-Scoped Surveillance**:\
    \ Enables targeted monitoring of multi-region enterprise clusters with region-specific\
    \ threshold configurations.\n\n## What you get\n- Pre-built sentinel protecting\
    \ containerized and non-containerized workload orchestrators from silent worker\
    \ node dropouts\n- Isolated Docker execution environment with explicit network\
    \ timeout safeguards preventing stalled workflow runs\n- Real-time Slack notifications\
    \ detailing exact region names, down node names, and drain counts\n- Standardized\
    \ audit trail supporting post-incident reviews and cloud virtual machine instance\
    \ replacement\n\n## Who it's for\n- Site Reliability Engineers safeguarding Nomad\
    \ compute fleet availability, service jobs, and batch workflows\n- Platform Engineers\
    \ maintaining HashiCorp Nomad clusters, Consul Connect integration, and host drivers\
    \ (Docker, exec, QEMU)\n- Cloud Infrastructure Architects designing hybrid-cloud\
    \ workload scheduling fabrics across bare-metal and AWS/GCP instances\n\n## Why\
    \ orchestrate this with Kestra\n- Centralizes workload orchestrator surveillance\
    \ without maintaining standalone alerting scripts or external daemon checkers\n\
    - Encrypts sensitive notification webhooks and Nomad ACL tokens using enterprise\
    \ namespace secrets\n- Provides historical execution archives to satisfy compliance\
    \ auditors requiring proof of continuous compute fleet monitoring\n- Enables automated\
    \ multi-system remediation such as terminating unresponsive virtual machines or\
    \ provisioning replacement worker capacity\n\n## Use cases\n- **Cloud Hypervisor\
    \ Host Reboots**: Detect when underlying AWS or Azure hardware degradation causes\
    \ Nomad worker nodes to lose heartbeats.\n- **Network CNI Partitioning**: Identify\
    \ when local overlay network failures prevent client agents from communicating\
    \ with Nomad server leaders.\n- **Kernel Panic Host Freezes**: Pinpoint compute\
    \ nodes that have frozen due to hardware faults or OOM kernel panics.\n\n## Inputs\n\
    | Name | Type | Default | Description |\n| :--- | :--- | :--- | :--- |\n| `nomad_api_url`\
    \ | `STRING` | `http://nomad-server.orchestration.svc.cluster.local:4646` | Base\
    \ HTTP URL of the HashiCorp Nomad Server cluster API endpoint. |\n| `region_name`\
    \ | `STRING` | `global` | Identifier of the target Nomad region under active client\
    \ node and allocation surveillance. |\n| `max_lost_heartbeats` | `INT` | `2` |\
    \ Maximum allowable client nodes experiencing lost heartbeats within the audit\
    \ window before alerting. |\n| `lookback_minutes` | `INT` | `15` | Time duration\
    \ in minutes across which Nomad node status metrics are evaluated. |\n| `alert_on_lost`\
    \ | `BOOL` | `true` | Toggle whether Slack alerts are dispatched upon detecting\
    \ lost Nomad client heartbeats. |\n\n## Expected outputs\n- `{{ outputs.scan_nomad_client_nodes.vars.down_nodes_count\
    \ }}`: Total number of Nomad client nodes currently in a down or lost heartbeat\
    \ state.\n- `{{ outputs.scan_nomad_client_nodes.vars.ready_nodes_count }}`: Count\
    \ of active, schedulable client nodes in a ready state.\n- `{{ outputs.scan_nomad_client_nodes.vars.draining_nodes_count\
    \ }}`: Number of nodes actively participating in a planned workload drain.\n-\
    \ `{{ outputs.scan_nomad_client_nodes.vars.is_alerting }}`: Boolean flag indicating\
    \ whether observed down nodes breached tolerance limits.\n- `{{ outputs.scan_nomad_client_nodes.vars.audit_timestamp\
    \ }}`: ISO-8601 UTC timestamp recording exact time of sentinel verification.\n\
    \n## Prerequisites\n- HashiCorp Nomad cluster deployed with the HTTP API enabled\
    \ on port 4646.\n- Network connectivity allowing Kestra worker pods to reach the\
    \ Nomad server API across internal networks.\n- Incoming Slack Webhook configured\
    \ with publishing permissions into the designated orchestration alerting channel.\n\
    \n### Secrets\n- `NOMAD_HTTP_TOKEN`: Secret ACL token for authenticating to the\
    \ Nomad REST API.\n- `SLACK_WEBHOOK_URL`: Secret webhook URL for dispatching incident\
    \ notifications to team Slack rooms.\n\n## Quick start\n1. Register the `NOMAD_HTTP_TOKEN`\
    \ and `SLACK_WEBHOOK_URL` secrets in Kestra.\n2. Import this blueprint into Kestra\
    \ under the `company.sre` namespace.\n3. Update `nomad_api_url` with your internal\
    \ Nomad server service DNS name.\n4. Execute a manual run to verify API authentication\
    \ and webhook formatting.\n5. Enable the `periodic_nomad_audit` trigger to commence\
    \ automated background monitoring.\n\n## Common pitfalls and troubleshooting\n\
    - **Heartbeat Grace Period**: Nomad uses `heartbeat_grace` (default 20s); allow\
    \ adequate polling intervals before treating transient blips as downtime.\n- **Nomad\
    \ ACL Policies**: Ensure the token provided in `NOMAD_HTTP_TOKEN` possesses `node:read`\
    \ capabilities in Nomad ACL rules.\n- **Draining vs Down Ambiguity**: A node marked\
    \ for draining remains in `ready` or `ineligible` status until all allocations\
    \ migrate; verify the `Drain` boolean.\n- **Client Agent Garbage Collection**:\
    \ Terminated client nodes eventually transition from `down` to purged status;\
    \ monitor `down` states promptly.\n\n## How to extend\n- **Automated Node Purge\
    \ Task**: Trigger a sub-flow to execute `nomad node purge` for confirmed dead\
    \ worker nodes.\n- **Cloud Auto-Healing Trigger**: Chain a task to AWS EC2 or\
    \ GCP Compute Engine to replace terminated instance IDs with fresh virtual machines.\n\
    - **PagerDuty Escalation**: Escalate to on-call infrastructure engineers via PagerDuty\
    \ if down node count exceeds 20% of total cluster capacity.\n\n## Links\n- [Kestra\
    \ Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)\n\
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)\n\
    - [HashiCorp Nomad Nodes API Official Reference](https://developer.hashicorp.com/nomad/api-docs/nodes)\n\
    - [Nomad Client Heartbeat and Liveness Architecture](https://developer.hashicorp.com/nomad/docs/internals/architecture#agent-lifecycle)\n\
    - [Troubleshooting Nomad Node Failures and Drains](https://developer.hashicorp.com/nomad/tutorials/manage-clusters/cluster-maintenance)\n"
  tags:
  - Infrastructure
  - Cloud
  subTags:
  - Monitoring & Alerting
  - Infrastructure Automation
  ee: false
  demo: false
outputs:
- id: down_nodes_count
  type: INT
  value: '{{ outputs.scan_nomad_client_nodes.vars.down_nodes_count }}'
- id: ready_nodes_count
  type: INT
  value: '{{ outputs.scan_nomad_client_nodes.vars.ready_nodes_count }}'
- id: draining_nodes_count
  type: INT
  value: '{{ outputs.scan_nomad_client_nodes.vars.draining_nodes_count }}'
- id: total_nodes_count
  type: INT
  value: '{{ outputs.scan_nomad_client_nodes.vars.total_nodes_count }}'
- id: is_alerting
  type: BOOLEAN
  value: '{{ outputs.scan_nomad_client_nodes.vars.is_alerting }}'
