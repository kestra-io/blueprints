id: marqo-vector-index-storage-and-inference-health-gate
namespace: company.ai

description: |
  Audits Marqo multimodal vector search engine indexes to verify backend health, monitor
  tensor storage capacity and document counts, detect index degradation or upstream ingestion
  stalls, and dispatch actionable operational alerts to data engineering teams via Slack.

inputs:
  - id: marqo_url
    type: STRING
    displayName: Marqo Engine Base URL
    description: Host URL of the self-hosted Marqo vector search engine endpoint.
    defaults: "http://localhost:8882"

  - id: index_name
    type: STRING
    displayName: Target Marqo Index
    description: Name of the vector index to audit for document volume and inference health.
    defaults: "ecommerce-products"

  - id: max_document_quota
    type: INT
    displayName: Maximum Document Quota
    description: Upper threshold for document count before flagging tensor memory saturation.
    defaults: 250000

  - id: min_expected_documents
    type: INT
    displayName: Minimum Expected Documents
    description: Baseline document count threshold to detect empty indexes or upstream ingestion pipeline stalls.
    defaults: 100

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, audits vector index compliance and dispatches Slack notifications without applying remediation actions.
    defaults: true

tasks:
  - id: probe_marqo_health
    type: io.kestra.plugin.core.http.Request
    description: Queries Marqo cluster health endpoint to verify backend service readiness and memory status.
    uri: "{{ inputs.marqo_url }}/health"
    method: GET
    headers:
      x-api-key: "{{ secret('MARQO_API_KEY') }}"
      Accept: application/json
    contentType: application/json
    timeout: PT30S

  - id: probe_index_stats
    type: io.kestra.plugin.core.http.Request
    description: Queries Marqo index statistics to retrieve live document count and vector storage metrics.
    uri: "{{ inputs.marqo_url }}/indexes/{{ inputs.index_name }}/stats"
    method: GET
    headers:
      x-api-key: "{{ secret('MARQO_API_KEY') }}"
      Accept: application/json
    contentType: application/json
    timeout: PT30S

  - id: probe_index_configuration
    type: io.kestra.plugin.core.http.Request
    description: Queries Marqo index specification to verify configured neural embedding model and tensor settings.
    uri: "{{ inputs.marqo_url }}/indexes/{{ inputs.index_name }}"
    method: GET
    headers:
      x-api-key: "{{ secret('MARQO_API_KEY') }}"
      Accept: application/json
    contentType: application/json
    timeout: PT30S

  - id: evaluate_vector_governance
    type: io.kestra.plugin.core.output.OutputValues
    description: Evaluates engine operational state, document capacity limits, and tensor index health.
    values:
      engine_status: >-
        {{ ({'data': outputs.probe_marqo_health.body} | jq('.data.status // .data.backend.status // "unknown"')) | first }}
      document_count: >-
        {{ ({'data': outputs.probe_index_stats.body} | jq('.data.numberOfDocuments // 0')) | first | number }}
      vector_count: >-
        {{ ({'data': outputs.probe_index_stats.body} | jq('.data.numberOfVectors // 0')) | first | number }}
      embedding_model: >-
        {{ ({'data': outputs.probe_index_configuration.body} | jq('.data.model // .data.indexSettings.model // "default"')) | first }}
      index_type: >-
        {{ ({'data': outputs.probe_index_configuration.body} | jq('.data.type // .data.indexSettings.type // "unstructured"')) | first }}
      status: >-
        {{
          ((({'data': outputs.probe_marqo_health.body} | jq('.data.status // .data.backend.status // "unknown"')) | first) != 'green' and
           ((({'data': outputs.probe_marqo_health.body} | jq('.data.status // .data.backend.status // "unknown"')) | first) != 'GREEN')) ? 'ENGINE_DEGRADED' :
          (((({'data': outputs.probe_index_stats.body} | jq('.data.numberOfDocuments // 0')) | first | number) > inputs.max_document_quota)) ? 'CAPACITY_QUOTA_BREACH' :
          (((({'data': outputs.probe_index_stats.body} | jq('.data.numberOfDocuments // 0')) | first | number) < inputs.min_expected_documents)) ? 'EMPTY_INDEX_DRIFT' :
          'COMPLIANT'
        }}

  - id: route_governance_action
    type: io.kestra.plugin.core.flow.Switch
    description: Directs notification and remediation flows according to evaluated Marqo vector index status.
    value: "{{ outputs.evaluate_vector_governance.values.status }}"
    cases:
      "COMPLIANT":
        - id: log_compliant_index
          type: io.kestra.plugin.core.log.Log
          message: "Marqo index {{ inputs.index_name }} is healthy and compliant: {{ outputs.evaluate_vector_governance.values.document_count }} documents, {{ outputs.evaluate_vector_governance.values.vector_count }} vectors, neural model {{ outputs.evaluate_vector_governance.values.embedding_model }}."

      "CAPACITY_QUOTA_BREACH":
        - id: alert_capacity_breach
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'CAPACITY_QUOTA_BREACH: Marqo index `' ~ inputs.index_name ~ '` contains ' ~ outputs.evaluate_vector_governance.values.document_count ~ ' documents, exceeding quota limit of ' ~ inputs.max_document_quota ~ '. Model `' ~ outputs.evaluate_vector_governance.values.embedding_model ~ '` risks memory saturation. Action required: prune stale documents or scale shard memory.'} | toJson }}

      "EMPTY_INDEX_DRIFT":
        - id: alert_empty_index_drift
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'EMPTY_INDEX_DRIFT: Marqo index `' ~ inputs.index_name ~ '` contains only ' ~ outputs.evaluate_vector_governance.values.document_count ~ ' documents (minimum expected ' ~ inputs.min_expected_documents ~ '). Upstream embedding ingestion pipeline may have stalled or failed.'} | toJson }}

      "ENGINE_DEGRADED":
        - id: alert_engine_degraded
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'ENGINE_DEGRADED: Marqo vector search cluster at `' ~ inputs.marqo_url ~ '` reported non-green health status: `' ~ outputs.evaluate_vector_governance.values.engine_status ~ '`. Retrieval and neural inference latency may be impaired.'} | toJson }}

  - id: log_governance_audit
    type: io.kestra.plugin.core.log.Log
    description: Persists immutable compliance log with evaluated vector metrics and operational status.
    message: "Marqo vector index audit complete for {{ inputs.index_name }}: status {{ outputs.evaluate_vector_governance.values.status }}, documents {{ outputs.evaluate_vector_governance.values.document_count }}, vectors {{ outputs.evaluate_vector_governance.values.vector_count }}, model {{ outputs.evaluate_vector_governance.values.embedding_model }}."

errors:
  - id: alert_marqo_unreachable
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches urgent Slack alert if Marqo vector search engine is unreachable or returns HTTP error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Marqo vector search probe failed for index `' ~ inputs.index_name ~ '` (execution ' ~ execution.id ~ ') on `' ~ inputs.marqo_url ~ '`. Check container connectivity and MARQO_API_KEY secret.'} | toJson }}

triggers:
  - id: daily_vector_index_governance_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs scheduled Marqo vector index audit daily at 03:00 UTC. Shipped disabled by default.
    cron: "0 3 * * *"
    disabled: true
    inputs:
      marqo_url: "http://localhost:8882"
      index_name: "ecommerce-products"
      max_document_quota: 250000
      min_expected_documents: 100
      dry_run: true

extend:
  title: Marqo Multimodal Vector Index Storage & Inference Health Gate
  metaTitle: Marqo Vector Index Storage & Inference Health Gate | Kestra
  shortDescription: Audit Marqo vector search indexes for document quota saturation, engine health degradation, and ingestion stalls.
  metaDescription: Audit Marqo vector search indexes for document quota saturation, verify cluster inference health, detect upstream ingestion stalls, and alert via Slack.
  description: |
    Continuously audits self-hosted Marqo multimodal vector search engine instances to verify backend
    health, monitor document volume and vector storage capacity, detect neural model memory saturation,
    flag upstream embedding ingestion stalls, and dispatch structured operational alerts via Slack.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `daily_vector_index_governance_audit` (`io.kestra.plugin.core.trigger.Schedule`) initiates the
       governance audit daily at 03:00 UTC. It is shipped disabled by default so operators can verify
       cluster parameters in dry-run mode prior to enabling automated schedules.
    2. `probe_marqo_health` (`io.kestra.plugin.core.http.Request`) invokes the Marqo REST API endpoint
       `GET /health` with authentication headers to confirm cluster operational status and backend storage health.
    3. `probe_index_stats` (`io.kestra.plugin.core.http.Request`) queries `GET /indexes/{index_name}/stats`
       to retrieve live document counts and indexed vector storage tallies.
    4. `probe_index_configuration` (`io.kestra.plugin.core.http.Request`) queries `GET /indexes/{index_name}`
       to inspect the configured neural embedding model (e.g. `open_clip/ViT-B-32`, `hf/all_datasets_v4_MiniLM-L6`)
       and index architecture settings.
    5. `evaluate_vector_governance` (`io.kestra.plugin.core.output.OutputValues`) parses all responses and
       evaluates the operational status:
       - **COMPLIANT:** Engine status is green, document volume is within configured bounds, and neural
         embeddings are healthy.
       - **ENGINE_DEGRADED:** The underlying search backend or inference process reported a non-green state.
       - **CAPACITY_QUOTA_BREACH:** Document count exceeds `max_document_quota`, signaling imminent model
         memory exhaustion or uncompacted deletion accumulation.
       - **EMPTY_INDEX_DRIFT:** Document count falls below `min_expected_documents`, indicating an upstream
         data landing failure or pipeline stall.
    6. `route_governance_action` (`io.kestra.plugin.core.flow.Switch`) directs execution:
       - **COMPLIANT:** Records nominal metrics and model specification in execution logs via `io.kestra.plugin.core.log.Log`.
       - **CAPACITY_QUOTA_BREACH:** Dispatches an alert to Slack warning that document quotas are exceeded
         and recommending index pruning or memory scaling.
       - **EMPTY_INDEX_DRIFT:** Dispatches a warning alert to Slack identifying potential pipeline stalls.
       - **ENGINE_DEGRADED:** Sends a priority incident notification to Slack detailing cluster degradation.
    7. `log_governance_audit` logs an immutable audit entry recording index name, document counts, neural
       model name, and final operational status.
    8. Global `errors` block dispatches an out-of-band notification to Slack if Marqo is unreachable or
       returns an HTTP error code.

    ## What you get

    - Early detection of tensor storage saturation in Marqo vector indexes before in-memory inference
      models exhaust host RAM or search latency degrades.
    - Continuous validation of upstream embedding pipelines to prevent silent data freshness stalls in
      customer-facing RAG or multimodal search applications.
    - Deep observability into configured neural models, document volumes, and vector tallies directly
      in operational Slack channels.
    - Non-destructive execution: default `dry_run: true` guarantees safe, read-only operational telemetry.

    ## Who it's for

    - MLOps Engineers and Data Platform Architects running self-hosted Marqo clusters for production RAG.
    - AI Search Engineers operating multimodal recommendation and semantic search engines.
    - SRE teams responsible for maintaining vector database SLA and uptime across AI microservices.

    ## Why orchestrate this with Kestra

    Marqo provides state-of-the-art multimodal vector search and on-the-fly embedding generation, but it
    does not include built-in alerting mechanisms for document capacity limits or upstream pipeline stalls.
    Ad-hoc bash scripts lack declarative configuration, visual audit trails, secret masking, and robust
    retry logic. Kestra provides resilient HTTP execution, declarative scheduling, secure secret injection,
    and standardized operational alerting.

    ## Prerequisites

    - A running Marqo instance reachable over HTTP. Marqo provides an official open-source Docker image
      (`marqoai/marqo:latest`) requiring no paid enterprise license.
    - An existing Marqo index created in the cluster.
    - An API key configured if Marqo is running with authentication enabled.
    - A Slack incoming webhook URL for operational notifications.

    ### Secrets

    - `MARQO_API_KEY`: API key for authenticating with the Marqo REST API.
      In Kestra OSS, configure as `SECRET_MARQO_API_KEY`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by alert tasks and the global `errors` block.
      In Kestra OSS, configure as `SECRET_SLACK_WEBHOOK_URL`.

    ## Quick start

    1. Start a local Marqo container:
       ```bash
       docker run -d --name marqo-test -p 8882:8882 marqoai/marqo:latest
       ```
    2. Configure `MARQO_API_KEY` and `SLACK_WEBHOOK_URL` secrets in your Kestra namespace.
    3. Import this blueprint into Kestra and trigger an execution with default inputs in dry-run mode.
    4. Review execution logs to observe index document count and model inspection.
    5. Test alerting by setting `max_document_quota: 0` to observe `alert_capacity_breach` dispatching to Slack.
    6. Enable `daily_vector_index_governance_audit` once operational parameters are aligned.

    ## How to extend

    - Add downstream maintenance tasks to trigger Marqo document deletion or shard re-indexing when
      `CAPACITY_QUOTA_BREACH` is evaluated.
    - Push document and vector volume metrics to Prometheus via `io.kestra.plugin.prometheus.PushGateway`
      for long-term vector growth forecasting.
    - Trigger an automated RAG evaluation test suite using `io.kestra.plugin.scripts.python.Commands`
      to assess semantic retrieval accuracy.

    ## Links

    - [Marqo Official Documentation](https://docs.marqo.ai/)
    - [Marqo GitHub Repository](https://github.com/marqo-ai/marqo)
    - [Marqo Docker Hub Image](https://hub.docker.com/r/marqoai/marqo)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
