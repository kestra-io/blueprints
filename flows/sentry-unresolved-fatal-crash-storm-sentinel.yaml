id: sentry-unresolved-fatal-crash-storm-sentinel
namespace: company.observability

inputs:
  - id: sentry_organization
    type: STRING
    description: Sentry organization slug.
  - id: sentry_project
    type: STRING
    description: Sentry project slug.
  - id: crash_count_threshold
    type: INT
    defaults: 25
    description: "Maximum allowable fatal/unhandled crash events in rolling 1-hour window (default 25)."

tasks:
  - id: query_sentry_issues
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      SENTRY_TOKEN: "{{ secret('SENTRY_AUTH_TOKEN') }}"
      ORG: "{{ inputs.sentry_organization }}"
      PROJECT: "{{ inputs.sentry_project }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      token = os.environ.get("SENTRY_TOKEN", "")
      org = os.environ.get("ORG", "")
      project = os.environ.get("PROJECT", "")

      headers = {"Authorization": f"Bearer {token}"}
      url = f"https://sentry.io/api/0/projects/{org}/{project}/issues/?query=is:unresolved+level:fatal+age:-1h"

      try:
          resp = requests.get(url, headers=headers, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as err:
          print(f"Error querying Sentry API: {err}", file=sys.stderr)
          sys.exit(1)

      crash_count = len(data) if isinstance(data, list) else 0

      Kestra.outputs({
          "crash_count": crash_count
      })

  - id: evaluate_crash_storm
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_sentry_issues.vars.crash_count | int > inputs.crash_count_threshold }}"
    then:
      - id: notify_incident_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#incident-response",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Sentry Critical Fatal Crash Storm Alert",
                "text": "Sentry project `{{ inputs.sentry_organization }}/{{ inputs.sentry_project }}` detected *{{ outputs.query_sentry_issues.vars.crash_count }} unresolved fatal crash events* over the last hour! Application stability is critically degraded.",
                "footer": "Kestra Observability Sentinel • Sentry"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#observability-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Sentry Sentinel Failure",
            "text": "Failed to query Sentry API. Verify organization, project slug, and auth token permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: crash_count
    type: INT
    value: "{{ outputs.query_sentry_issues.vars.crash_count }}"

extend:
  metaDescription: "Monitors Sentry project API for sudden unhandled fatal exception surges to detect severe application regressions."
  metaTitle: Sentry Unresolved Critical Crash Storm and Fatal Error Rate Sentinel with Kestra
  title: Sentry Unresolved Critical Crash Storm and Fatal Error Rate Sentinel
  shortDescription: Monitors Sentry project API for sudden unhandled fatal exception surges to detect severe application regressions.
  description: |
    ## How it works
    This workflow connects to the Sentry REST API (`/api/0/projects/{org}/{project}/issues/`) using an authentication token to audit unresolved `level:fatal` issues detected within the last hour (`age:-1h`). Fatal crashes indicate severe runtime failures such as uncaught panics, fatal segmentation violations, unhandled promise rejections, or critical memory corruption that terminate user sessions. When the count of unresolved fatal issues exceeds configured thresholds, the workflow dispatches a high-priority incident notification to the incident response Slack channel.

    ## What you get
    - Rapid detection of post-deployment production application crash storms.
    - Prevents customer churn caused by unhandled runtime crashes.
    - Centralized escalation of application reliability anomalies.

    ## Who it's for
    - Application Engineering Leads and Incident Commanders.
    - Site Reliability Engineers maintaining client and backend service health.

    ## Why orchestrate this with Kestra
    - **Automated Incident Escalation**: Polls Sentry continuously without requiring dedicated webhooks.
    - **Multi-Project Fleet Auditing**: Can be easily parameterized to monitor dozens of microservices.
    - **Secure Credential Handling**: Uses Kestra secrets for API tokens.

    ## Prerequisites
    - Sentry Account with an API Auth Token with `event:read` and `project:read` scopes.
    - Secrets `SENTRY_AUTH_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input your Sentry organization and project slug.
    3. Run the workflow to inspect unresolved fatal issues.

    ## How to extend
    - Automatically trigger a rollback of the latest deployment via ArgoCD or GitHub Actions if crash counts exceed emergency limits.
    - Enrich the Slack alert with the top crash exception message and culprit source file.

    ## Links
    - [Sentry API Issues Endpoint Documentation](https://docs.sentry.io/api/events/list-a-projects-issues/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
  ee: false
  demo: false
