id: exec-founder-quarterly-board-deck-synthesizer
namespace: company.executive

extend:
  title: Automated Executive Board Deck Synthesizer and KPI Rollup
  metaTitle: Executive Board Deck Synthesis and Strategic KPI Rollup | Kestra
  shortDescription: Gathers departmental telemetry in parallel, aggregates KPIs in DuckDB, synthesizes CEO narratives in Python, and routes board risk alerts.
  metaDescription: Orchestrate executive board deck preparation, parallel data feeds, DuckDB KPI rollups, and founder narrative generation with Kestra.
  description: |
    Automates quarterly executive board preparation by fetching financial, engineering, and customer success telemetry feeds in parallel, rolling up key performance indicators in memory via DuckDB, synthesizing CEO-ready narrative highlights and risk flags in Python, updating stakeholder ledgers sequentially, and conditionally routing board-level remediation plans.

    ## How it works
    1. A Schedule trigger (quarterly) or an on-demand Webhook initiates the board prep session.
    2. A Parallel block fetches ARR, engineering velocity, and CSAT feeds concurrently.
    3. A DuckDB query rolls up departmental attainment percentages in memory.
    4. A Python script evaluates ARR attainment against target and net burn against board ceilings.
    5. A Sequential block updates CEO, CFO, and Investor Relations dashboards in order.
    6. An If branch either certifies board deck readiness or appends strategic remediation appendices if risks are detected.

    ## What you get
    - Instant quarterly board prep without manual spreadsheet cross-referencing.
    - Automated risk flag generation for CEO and CFO oversight.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Click Execute with default inputs to test the board deck certification path.

    ## Links
    - [Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
  tags:
    - DevOps
  subTags:
    - Analytics
  ee: false
  demo: false

inputs:
  - id: fiscal_quarter
    type: STRING
    defaults: "Q3-2026"
  - id: target_arr_usd
    type: FLOAT
    defaults: 12500000.00
  - id: actual_arr_usd
    type: FLOAT
    defaults: 11850000.00
  - id: net_burn_rate_usd
    type: FLOAT
    defaults: 320000.00
  - id: max_allowable_burn_usd
    type: FLOAT
    defaults: 350000.00
  - id: employee_headcount
    type: INT
    defaults: 84

triggers:
  - id: quarterly_board_prep_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 1 4,7,10,1 *"

  - id: manual_board_prep_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "founder-board-prep-token"

tasks:
  - id: initialize_board_prep_session
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: |
      [BOARD PREP START] Initializing executive data synthesis for {{ inputs.fiscal_quarter }}.
      Target ARR: ${{ inputs.target_arr_usd }} \vert{} Actual ARR:${{ inputs.actual_arr_usd }}

  - id: parallel_departmental_telemetry_fetch
    type: io.kestra.plugin.core.flow.Parallel
    description: "Concurrently fetch financial, engineering, and customer success telemetry feeds"
    tasks:
      - id: fetch_stripe_arr_feed
        type: io.kestra.plugin.core.http.Request
        uri: "https://jsonplaceholder.typicode.com/posts/1"
        method: GET

      - id: fetch_github_velocity_feed
        type: io.kestra.plugin.core.http.Request
        uri: "https://jsonplaceholder.typicode.com/posts/2"
        method: GET

      - id: fetch_zendesk_csat_feed
        type: io.kestra.plugin.core.http.Request
        uri: "https://jsonplaceholder.typicode.com/todos/1"
        method: GET

  - id: rollup_executive_kpis_duckdb
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: "Execute multi-departmental KPI rollup and efficiency ratios in memory"
    sql: |
      WITH departmental_snapshot AS (
        SELECT 'Revenue & Growth' AS pillar, 'ARR' AS metric, 11850000 AS actual_val, 12500000 AS target_val
        UNION ALL
        SELECT 'Engineering'      AS pillar, 'PRs Merged' AS metric, 1420 AS actual_val, 1200 AS target_val
        UNION ALL
        SELECT 'Customer Success' AS pillar, 'Net Retention' AS metric, 114 AS actual_val, 110 AS target_val
        UNION ALL
        SELECT 'People & Culture' AS pillar, 'Headcount' AS metric, 84 AS actual_val, 90 AS target_val
      )
      SELECT
        pillar,
        metric,
        actual_val,
        target_val,
        ROUND(CAST(actual_val AS DOUBLE) / target_val * 100.0, 2) AS attainment_pct
      FROM departmental_snapshot
      ORDER BY attainment_pct DESC;
    fetchType: FETCH

  - id: generate_executive_narrative
    type: io.kestra.plugin.scripts.python.Script
    description: "Synthesize operational telemetry into CEO-ready board deck bullet points and risk flags"
    beforeCommands:
      - pip install kestra
    script: |
      from kestra import Kestra

      quarter = "{{ inputs.fiscal_quarter }}"
      target_arr = float({{ inputs.target_arr_usd }})
      actual_arr = float({{ inputs.actual_arr_usd }})
      burn = float({{ inputs.net_burn_rate_usd }})
      max_burn = float({{ inputs.max_allowable_burn_usd }})

      arr_attainment = round((actual_arr / target_arr) * 100.0, 2)
      burn_healthy = burn <= max_burn

      risk_flags = []
      if arr_attainment < 95.0:
          risk_flags.append(f"ARR attainment lagging target ({arr_attainment}% < 95%)")
      if not burn_healthy:
          risk_flags.append(f"Net burn (${burn}/mo) exceeds board ceiling (${max_burn}/mo)")

      requires_board_attention = len(risk_flags) > 0
      narrative_tone = "DEFENSIVE_AND_ACTION_ORIENTED" if requires_board_attention else "STRONG_GROWTH_MOMENTUM"

      summary = f"[{quarter} Summary] ARR Attainment: {arr_attainment}% | Net Burn: ${burn}/mo | Tone: {narrative_tone}"
      print(summary)

      Kestra.outputs({
          'arr_attainment': arr_attainment,
          'burn_healthy': burn_healthy,
          'requires_board_attention': requires_board_attention,
          'narrative_tone': narrative_tone,
          'summary': summary
      })

  - id: sequential_stakeholder_ledger_sync
    type: io.kestra.plugin.core.flow.Sequential
    description: "Sequentially update stakeholder dashboards across executive leadership"
    tasks:
      - id: sync_ceo_dashboard
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "[STAKEHOLDER SYNC 1/3] CEO Executive Summary updated for {{ inputs.fiscal_quarter }}."

      - id: sync_cfo_financial_model
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "[STAKEHOLDER SYNC 2/3] CFO Burn Rate & Runway Model synchronized."

      - id: sync_investor_relations_vault
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "[STAKEHOLDER SYNC 3/3] Investor Relations secure vault updated with KPI rollup."

  - id: route_board_risk_escalation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.generate_executive_narrative.vars.requires_board_attention == true }}"
    then:
      - id: draft_remediation_strategy
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          [EXECUTIVE ACTION REQUIRED] Board briefing narrative flagged risks:
          {{ outputs.generate_executive_narrative.vars.summary }}
          Action: Appending strategic remediation appendix to board deck.
    else:
      - id: certify_board_deck_readiness
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: |
          [BOARD DECK CERTIFIED] All KPIs healthy. Executive presentation locked and ready for distribution.

  - id: finalize_board_prep_run
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "Completed board deck synthesis for {{ inputs.fiscal_quarter }}. Tone: {{ outputs.generate_executive_narrative.vars.narrative_tone }}"
