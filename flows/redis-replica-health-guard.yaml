id: redis-replica-health-guard
namespace: company.team

description: |
  Check a Redis primary and its replicas: every expected replica connected and online on the
  primary, each replica's link to the primary up, its offset close to the primary's, and
  replica-read-only on, so no client writes data on a replica that the next resync silently
  deletes. Alert Slack, and optionally turn replica-read-only back on with CONFIG SET, then
  read INFO again to verify. Lagging or disconnected replicas are reported, never changed.

inputs:
  - id: primary_host
    type: STRING
    displayName: Primary host
    defaults: "redis-primary"

  - id: replica_hosts
    type: ARRAY
    itemType: STRING
    displayName: Replica hosts
    defaults:
      - redis-replica-1
      - redis-replica-2

  - id: port
    type: INT
    displayName: Port
    defaults: 6379

  - id: max_lag_bytes
    type: INT
    displayName: Maximum replication lag (bytes)
    defaults: 1048576

  - id: use_password
    type: BOOL
    displayName: Authenticate with REDIS_PASSWORD
    description: Send the REDIS_PASSWORD secret to the primary. Replicas are read without a password; add the same property to their tasks if they require one.
    defaults: false

  - id: network
    type: STRING
    displayName: Docker network for redis-cli
    description: Network of the redis-cli containers. Leave empty for Docker's default bridge.
    defaults: ""

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Only replica-read-only is changed. Lag and links are reported.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for CONFIG SET to run.
    defaults: true

tasks:
  - id: primary_info
    type: io.kestra.plugin.redis.cli.RedisCLI
    description: Read-only.
    host: "{{ inputs.primary_host }}"
    port: "{{ inputs.port }}"
    password: "{{ inputs.use_password ? secret('REDIS_PASSWORD') : null }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.network }}"
    commands:
      - INFO replication

  - id: replicas_info
    type: io.kestra.plugin.core.flow.Loop
    description: Read-only. INFO replication and CONFIG GET replica-read-only on every replica.
    values: "{{ inputs.replica_hosts | toJson }}"
    outputs:
      - id: state
        type: STRING
        value: >-
          {{ {'host': item.value, 'info': (outputs.rinfo.vars.command_1 ?? ''), 'ro': (outputs.rro.vars.command_1 ?? '')} | toJson }}
    tasks:
      - id: one
        type: io.kestra.plugin.core.flow.Sequential
        allowFailure: true
        tasks:
          - id: rinfo
            type: io.kestra.plugin.redis.cli.RedisCLI
            host: "{{ item.value }}"
            port: "{{ inputs.port }}"
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.network }}"
            commands:
              - INFO replication
          - id: rro
            type: io.kestra.plugin.redis.cli.RedisCLI
            host: "{{ item.value }}"
            port: "{{ inputs.port }}"
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.network }}"
            commands:
              - CONFIG GET replica-read-only

  - id: findings
    type: io.kestra.plugin.core.output.OutputValues
    values:
      items: >-
        {{ {'p': outputs.primary_info.vars.command_1, 'r': outputs.replicas_info.outputs | jq('map(.outputs.state | fromjson)') | first, 'max': inputs.max_lag_bytes, 'n': inputs.replica_hosts | length} | jq('
           (.p | split("\\n") | map(select(contains(":")) | gsub("\\r"; "") | split(":")) | map({(.[0]): (.[1:] | join(":"))}) | add // {}) as $p
           | .max as $max | .n as $n
           | ($p.master_repl_offset // "0" | tonumber) as $po
           | [ (if $p.role != "master" then {code: "PRIMARY_NOT_MASTER", severity: "CRITICAL", host: "primary", detail: "role is \($p.role // "unknown")"} else empty end),
               (if (($p.connected_slaves // "0") | tonumber) < $n then {code: "MISSING_REPLICAS", severity: "HIGH", host: "primary", detail: "\($p.connected_slaves // 0) replicas connected, \($n) expected"} else empty end),
               (.r[] | . as $r | ($r.info | split("\\n") | map(select(contains(":")) | gsub("\\r"; "") | split(":")) | map({(.[0]): (.[1:] | join(":"))}) | add // {}) as $i
                | ($r.ro | split("\\n") | .[1] // "") as $ro
                | if ($i.role // "") == "" then {code: "REPLICA_UNREACHABLE", severity: "HIGH", host: $r.host, detail: "no INFO reply"}
                  elif $i.role != "slave" then {code: "NOT_A_REPLICA", severity: "HIGH", host: $r.host, detail: "role is \($i.role)"}
                  else
                    ( (if $i.master_link_status != "up" then {code: "LINK_DOWN", severity: "HIGH", host: $r.host, detail: "master_link_status \($i.master_link_status)"} else empty end),
                      (if ($po - ($i.slave_repl_offset // "0" | tonumber)) > $max then {code: "REPLICA_LAG", severity: "MEDIUM", host: $r.host, detail: "\($po - ($i.slave_repl_offset | tonumber)) bytes behind"} else empty end),
                      (if $ro == "no" then {code: "REPLICA_WRITABLE", severity: "HIGH", host: $r.host, detail: "replica-read-only is no: writes on this replica are lost at the next resync", fix: "CONFIG SET replica-read-only yes"} else empty end) )
                  end) ]') | first | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Redis replication {{ inputs.primary_host }} with {{ inputs.replica_hosts | length }} replicas: {{ fromJson(outputs.findings.values.items) | length }} findings.
      {{ fromJson(outputs.findings.values.items) | jq('map("\(.severity) \(.code) \(.host): \(.detail)") | join("; ")') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.findings.values.items) | length > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Redis replication ' ~ inputs.primary_host ~ ': ' ~ (fromJson(outputs.findings.values.items) | jq('map("\(.severity) \(.code) \(.host) (\(.detail))") | join("; ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Setting replica-read-only back on.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and fromJson(outputs.findings.values.items) | jq('map(select(.fix != null)) | length') | first > 0 }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            concurrencyLimit: 1
            values: "{{ fromJson(outputs.findings.values.items) | jq('map(select(.fix != null) | .host)') | first | toJson }}"
            outputs:
              - id: after
                type: STRING
                value: "{{ {'host': item.value, 'ro': outputs.recheck.vars.command_1 ?? ''} | toJson }}"
            tasks:
              - id: set_ro
                type: io.kestra.plugin.redis.cli.RedisCLI
                host: "{{ item.value }}"
                port: "{{ inputs.port }}"
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.network }}"
                commands:
                  - CONFIG SET replica-read-only yes
              - id: recheck
                type: io.kestra.plugin.redis.cli.RedisCLI
                host: "{{ item.value }}"
                port: "{{ inputs.port }}"
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.network }}"
                commands:
                  - CONFIG GET replica-read-only

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.remediate.outputs | jq('map(.outputs.after | fromjson | select(.ro | split(\"\\\\n\") | .[1] != \"yes\")) | length') | first > 0 }}"
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "replica-read-only is still not yes on every replica after CONFIG SET."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: >-
                  replica-read-only set back to yes and verified on {{ fromJson(outputs.findings.values.items) | jq('map(select(.fix != null) | .host) | join(", ")') | first }}.
                  Lag and link findings are left for review. Persist the setting in redis.conf or with CONFIG REWRITE.
    else:
      - id: healthy
        type: io.kestra.plugin.core.log.Log
        message: "Primary and all {{ inputs.replica_hosts | length }} replicas are connected, in sync and read-only."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Redis replica health guard failed for ' ~ inputs.primary_host ~ ' (execution ' ~ execution.id ~ '). Replication state unknown, check the logs.'} | toJson }}

triggers:
  - id: every_5_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode.
    cron: "*/5 * * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Redis Replica Health Guard
  shortDescription: Check a Redis primary and its replicas for missing replicas, broken links, replication lag and writable replicas, alert Slack, and optionally set replica-read-only back on and verify.
  metaTitle: Redis Replica Health Guard with Kestra
  metaDescription: Check Redis replicas for missing links, lag and replica-read-only off, alert Slack, and set replica-read-only back on with CONFIG SET and verify.
  description: |
    Redis replication fails quietly:
    - a replica restarted with the wrong `replicaof` is now a standalone primary serving stale data;
    - another lost its link after the primary's password changed;
    - one was started with `replica-read-only no` for a test, and a client wrote session data to it, which the next full resync deletes without a trace.

    Sentinel or the client library keeps working, so nobody notices until a failover promotes the replica that was behind.

    This blueprint reads `INFO replication` on the primary and on every expected replica, plus `replica-read-only` on each replica. It alerts Slack on anything off, and can set `replica-read-only` back to `yes` with `CONFIG SET`, then read the setting again to verify.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Severity | Rule | Fix |
    |---|---|---|---|
    | `PRIMARY_NOT_MASTER` | Critical | The primary host reports a role other than `master` | Report only |
    | `MISSING_REPLICAS` | High | Fewer `connected_slaves` than expected replicas | Report only |
    | `REPLICA_UNREACHABLE` | High | No `INFO` reply from a replica | Report only |
    | `NOT_A_REPLICA` | High | An expected replica reports role `master` | Report only |
    | `LINK_DOWN` | High | `master_link_status` is not `up` | Report only |
    | `REPLICA_LAG` | Medium | The replica's offset is more than `max_lag_bytes` behind the primary's | Report only |
    | `REPLICA_WRITABLE` | High | `replica-read-only` is `no` | `CONFIG SET replica-read-only yes` |

    Only the writable replica is fixed automatically. Re-pointing a replica or forcing a resync changes data, and is left to a person.

    ## How it works

    1. `primary_info` (`io.kestra.plugin.redis.cli.RedisCLI`, read-only) runs `INFO replication` on the primary.
    2. `replicas_info` (`io.kestra.plugin.core.flow.Loop`) runs `INFO replication` and `CONFIG GET replica-read-only` on each replica. An unreachable replica does not stop the others.
    3. `findings` parses every reply and applies the rules in one jq expression. `summary` logs the result.
    4. `route` (`io.kestra.plugin.core.flow.If`):
       - **healthy:** logs it.
       - **findings:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true, `dry_run` is false, and a replica is writable.
         - `remediate` (`concurrencyLimit: 1`) runs `CONFIG SET replica-read-only yes` and then reads the setting back.
         - `verify_result` fails if any replica is still writable.
    5. `errors` alerts Slack when the flow fails, for example on an unreachable primary.

    ## What you get

    - One check of a whole replication group: the primary's view and each replica's own view.
    - Early warning of replicas that would serve stale data, or lose writes, at the next failover or resync.
    - A narrow automatic fix, verified, with everything else left for review.

    ## Who it's for

    - Teams running Redis primary and replicas, with or without Sentinel, on VMs, Docker or Kubernetes.
    - SREs who have been surprised by a failover to a stale or diverged replica.
    - Teams evaluating the Redis plugin who want an example of `RedisCLI` across several hosts in a `Loop`.

    ## Why orchestrate this with Kestra

    Each `INFO replication` answers for one node at one moment. Kestra queries every node of the group on a schedule, compares the primary's view with each replica's, and sends the gaps to Slack. It applies the one safe fix behind `auto_remediate` and `dry_run`, verifies it, and keeps a history that shows when each replica fell behind or disconnected.

    ## Tested end to end

    On Kestra 2.0.5 OSS against Redis 7 containers (one primary and replicas started with `--replicaof`), with a local HTTP sink standing in for Slack.

    | Run | Setup | Result |
    |---|---|---|
    | 1 | One replica started with `--replica-read-only no` | 1 finding, `REPLICA_WRITABLE`. Alert sent |
    | 2 | same, dry run | Same finding. `CONFIG GET replica-read-only` still `no` |
    | 3 | same, remediate | Set and verified. `SET` on the replica now returns `READONLY You can't write against a read only replica` |
    | 4 | healthy | No finding |
    | 5 | One replica promoted with `REPLICAOF NO ONE`, the other stopped | `MISSING_REPLICAS` (0 of 2), `NOT_A_REPLICA`, `REPLICA_UNREACHABLE` |
    | 6 | Primary password changed, replica with a wrong `masterauth`, 1.5 MB written | `MISSING_REPLICAS`, `LINK_DOWN`, `REPLICA_LAG` of 57,797,753 bytes. The flow authenticated with `REDIS_PASSWORD` |
    | 7 | Unknown primary host | `errors` alert sent |

    ## Prerequisites

    - Redis primary and replicas reachable from the Docker containers the `RedisCLI` tasks start. `CONFIG` must be allowed on the replicas for remediation.
    - Local testing:
      - `docker run -d --name redis-primary redis:7-alpine`;
      - `docker run -d --name redis-replica-1 redis:7-alpine redis-server --replicaof redis-primary 6379 --replica-read-only no`, on the same Docker network.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - `REDIS_PASSWORD`: only when `use_password` is true.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `primary_host` | `redis-primary` | Primary |
    | `replica_hosts` | 2 example replicas | Expected replicas |
    | `port` | `6379` | Port on every node |
    | `max_lag_bytes` | `1048576` | Lag threshold |
    | `use_password` | `false` | Authenticate to the primary |
    | `network` | empty | Docker network for the `redis-cli` containers |
    | `auto_remediate` | `false` | Allow `CONFIG SET replica-read-only yes` |
    | `dry_run` | `true` | Must be `false` for a change to apply |

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret, and `REDIS_PASSWORD` if the primary requires one.
    2. Import the flow and set `primary_host`, `replica_hosts` and, if Redis runs in Docker, `network`.
    3. Run it once and read the findings.
    4. Run it with `auto_remediate: true` and `dry_run: false` to make writable replicas read-only, then persist the setting.
    5. Enable the `every_5_minutes` trigger, which always runs in safe mode.

    ## How to extend

    - Ask Sentinel for the current primary (`SENTINEL get-master-addr-by-name`) instead of a fixed `primary_host`.
    - Check `min-replicas-to-write` on the primary, so writes stop when replicas are gone.
    - Run `CONFIG REWRITE` after the fix when your nodes use a writable config file.
    - Open an incident for `NOT_A_REPLICA` and `LINK_DOWN` instead of a Slack message.

    ## Links

    - Redis replication: https://redis.io/docs/latest/operate/oss_and_stack/management/replication/
    - Redis plugin: https://kestra.io/plugins/plugin-redis
  tags:
    - Data
    - Infrastructure
  subTags:
