id: github-issue-first-response-sla-sentinel
namespace: company.devrel

inputs:
  - id: github_owner
    type: STRING
    displayName: GitHub Organization / Owner
    defaults: "kestra-io"
    description: GitHub organization or username owning the repository.

  - id: github_repository
    type: STRING
    displayName: GitHub Repository
    defaults: "kestra"
    description: GitHub repository slug to monitor for unacknowledged issues.

  - id: max_sla_hours
    type: INT
    displayName: First Response SLA (Hours)
    defaults: 24
    description: Maximum allowable hours an open issue can remain with zero comments before breaching first-response SLA.

  - id: issue_batch_limit
    type: INT
    displayName: Issue Evaluation Limit
    defaults: 30
    description: Maximum number of recent open issues to evaluate per execution.

triggers:
  - id: weekday_sla_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Twice-daily weekday sweep at 09:00 and 15:00 UTC to identify issues awaiting first maintainer response. Shipped disabled by default.
    cron: "0 9,15 * * 1-5"
    disabled: true

tasks:
  - id: fetch_open_issues
    type: io.kestra.plugin.graphql.Request
    description: Query GitHub GraphQL API for recent open issues, creation timestamps, and comment counts.
    uri: "https://api.github.com/graphql"
    headers:
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-Issue-SLA-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query {
        repository(owner: "{{ inputs.github_owner }}", name: "{{ inputs.github_repository }}") {
          issues(states: OPEN, first: {{ inputs.issue_batch_limit }}, orderBy: {field: CREATED_AT, direction: DESC}) {
            totalCount
            nodes {
              number
              title
              url
              createdAt
              author {
                login
              }
              comments {
                totalCount
              }
            }
          }
        }
      }

  - id: evaluate_unanswered_sla
    type: io.kestra.plugin.scripts.python.Script
    description: Parse issue creation timestamps and isolate open issues with zero comments older than the SLA threshold.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      ISSUES_DATA: "{{ outputs.fetch_open_issues.body | toJson }}"
      MAX_SLA_HOURS: "{{ inputs.max_sla_hours }}"
    script: |
      import os
      import json
      from datetime import datetime, timezone

      raw_data = json.loads(os.environ.get("ISSUES_DATA", "{}"))
      max_hours = int(os.environ.get("MAX_SLA_HOURS", 24))

      issues = ((raw_data.get("repository") or {}).get("issues") or {}).get("nodes") or []
      now = datetime.now(timezone.utc)

      breached_issues = []
      for issue in issues:
          comment_count = ((issue.get("comments") or {}).get("totalCount") or 0)
          created_str = issue.get("createdAt")
          if not created_str or comment_count > 0:
              continue

          try:
              created_dt = datetime.fromisoformat(created_str.replace("Z", "+00:00"))
              age_hours = int((now - created_dt).total_seconds() // 3600)
          except Exception:
              continue

          if age_hours >= max_hours:
              breached_issues.append({
                  "number": issue.get("number"),
                  "title": issue.get("title"),
                  "url": issue.get("url"),
                  "author": (issue.get("author") or {}).get("login") or "ghost",
                  "age_hours": age_hours
              })

      summary_lines = [
          f"• *#{item['number']}*: {item['title']} (Opened {item['age_hours']}h ago by @{item['author']}) - <{item['url']}|Reply Now>"
          for item in breached_issues
      ]
      summary_text = "\\n".join(summary_lines) if summary_lines else "Zero issues breaching response SLA."

      output_payload = {
          "breached_count": len(breached_issues),
          "breached_issues": breached_issues,
          "summary_text": summary_text
      }

      print(f'::{"outputs": {json.dumps(output_payload)}}::')

  - id: evaluate_sla_breach
    type: io.kestra.plugin.core.flow.If
    description: Check whether any open issues exceed the maximum allowable response latency.
    condition: "{{ outputs.evaluate_unanswered_sla.vars.breached_count > 0 }}"
    then:
      - id: alert_sla_breach
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority Slack notification itemizing issues breaching first-response SLA to maintainer channels.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⏱️ *GITHUB SLA ALERT: Open Issues Awaiting First Response* ⏱️\n\n*Repository:* `{{ inputs.github_owner }}/{{ inputs.github_repository }}`\n*SLA Threshold:* > {{ inputs.max_sla_hours }} hours without reply\n*Breached Issues Count:* {{ outputs.evaluate_unanswered_sla.vars.breached_count }}\n\n*Issues Needing Maintainer Attention:*\n{{ outputs.evaluate_unanswered_sla.vars.summary_text }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* DevRel and triage maintainers please acknowledge or answer community reports."
          }
    else:
      - id: log_sla_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log clean operational status when zero open issues breach response SLA.
        message: "HEALTHY: All recent open issues in {{ inputs.github_owner }}/{{ inputs.github_repository }} have received responses within {{ inputs.max_sla_hours }} hours."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for community support tracking.
    message: "GitHub issue response SLA audit finished for {{ inputs.github_owner }}/{{ inputs.github_repository }}. Breached issues count: {{ outputs.evaluate_unanswered_sla.vars.breached_count }}."

errors:
  - id: alert_on_github_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert DevRel Operations if GitHub GraphQL API returns an error or token expires.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *GitHub SLA Sentinel Error*: Execution `{{ execution.id }}` failed to query repository `{{ inputs.github_owner }}/{{ inputs.github_repository }}`. Check GITHUB_TOKEN permissions."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.evaluate_unanswered_sla.vars.breached_count > 0 ? 'SLA_BREACHED' : 'HEALTHY' }}"
  - id: breached_count
    type: INT
    value: "{{ outputs.evaluate_unanswered_sla.vars.breached_count }}"

extend:
  title: GitHub issue first response time SLA breach sentinel
  metaTitle: GitHub Issue First Response SLA Sentinel | Kestra
  shortDescription: Automated DevRel sentinel that queries GitHub GraphQL API for open issues with zero comments exceeding SLA response thresholds, alerting maintainers.
  metaDescription: Audit GitHub open issues via GraphQL API for zero comments exceeding first-response SLAs and alert DevRel teams in Slack to maintain community responsiveness.
  description: |
    Maintain exceptional community health and guarantee fast issue turnaround times by automatically identifying unacknowledged GitHub issues. In high-profile open-source repositories and developer-facing products, new issues submitted by community contributors often sit without a single comment or response from maintainers for days or weeks. This lack of responsiveness frustrates contributors, increases perceived project abandonment, and damages developer adoption. This blueprint runs a twice-daily audit via the GitHub GraphQL API (`io.kestra.plugin.graphql.Request`), filters for open issues that have zero comments and are older than your target response window (e.g. 24 hours), and delivers a clickable Slack digest directly to DevRel and triage maintainers.

    ## How it works
    1. A `Schedule` trigger initiates an issue response audit twice daily on weekdays at 09:00 and 15:00 UTC (shipped disabled by default).
    2. Task `fetch_open_issues` queries `https://api.github.com/graphql` using a GitHub access token (`GITHUB_TOKEN`). The GraphQL query retrieves recent open issues ordered by creation timestamp, requesting issue numbers, titles, URLs, creation dates, authors, and total comment counts.
    3. Task `evaluate_unanswered_sla` (`io.kestra.plugin.scripts.python.Script`) calculates the age in hours for each issue:
       - Issues with `comments.totalCount == 0` and age greater than or equal to `inputs.max_sla_hours` are flagged as SLA breaches.
       - The task formats a clickable markdown digest and exports structured metrics via Kestra's stdout output protocol.
    4. Task `evaluate_sla_breach` (`io.kestra.plugin.core.flow.If`) delivers an urgent Slack notification if any issues have breached SLA, or logs a healthy message if all issues have been acknowledged.
    5. Top-level `errors` handler dispatches an alert if the GitHub API encounters network or authentication issues.

    ## What you get
    - Continuous surveillance over time-to-first-response (TTFR) across open issues.
    - Zero community bug reports or questions slipping through the cracks unnoticed.
    - Actionable Slack notifications directing maintainers straight to unacknowledged threads.
    - Measurable improvements in open-source community health scores and developer satisfaction.

    ## Who it's for
    - Developer Relations (DevRel) Engineers and Community Managers.
    - Open Source Maintainers and Technical Leads managing repository backlogs.
    - Technical Support Engineers monitoring developer issue queues.

    ## Why orchestrate this with Kestra
    Manual checking of repository issue lists across multiple open-source repositories is error-prone. Kestra provides an automated, version-controlled pipeline that queries GitHub's GraphQL schema directly, calculates precise time deltas, handles secret tokens securely, and routes notifications into dedicated maintainer Slack channels without maintaining custom bots.

    ## Prerequisites
    - A GitHub personal access token (classic or fine-grained) with `repo` or `issues:read` permissions.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `GITHUB_TOKEN`: GitHub personal access token passed in the `Authorization: Bearer` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to receive SLA breach alerts.

    ## Quick start
    1. Store your GitHub token and Slack webhook in Kestra Secrets (`GITHUB_TOKEN` and `SLACK_WEBHOOK_URL`).
    2. Set `github_owner` and `github_repository` inputs to your target repository (e.g. `kestra-io` and `kestra`).
    3. Configure `max_sla_hours` (e.g. `24` or `48` hours) to match your team's support commitments.
    4. Run a manual execution from the Kestra UI to verify that the query successfully inspects issues.
    5. Enable the `weekday_sla_sweep` schedule to activate automated twice-daily SLA monitoring.

    ## How to extend
    - Add an auto-reply mutation (`addComment`) via GraphQL to acknowledge new community issues with links to documentation and contribution guides.
    - Route SLA breach alerts to specific on-call engineers via PagerDuty when critical issues remain unacknowledged for >72 hours.
    - Export first-response duration metrics to ClickHouse or Snowflake to track quarterly DevRel team performance.

    ## Links
    - [GitHub GraphQL API: Issue](https://docs.github.com/en/graphql/reference/objects#issue)
    - [Kestra GraphQL Plugin](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Python Script Task](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Business
  subTags:
    - Customer Success
    - Reporting & Digests
  ee: false
  demo: false
