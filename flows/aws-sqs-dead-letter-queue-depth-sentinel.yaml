id: aws-sqs-dead-letter-queue-depth-sentinel
namespace: company.cloudops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region where the SQS dead letter queue is hosted.
  - id: dlq_url
    type: STRING
    defaults: https://sqs.us-east-1.amazonaws.com/123456789012/production-orders-dlq
    description: Full URL of the SQS Dead Letter Queue to inspect.
  - id: max_message_threshold
    type: INT
    defaults: 10
    description: Maximum permissible visible messages in the DLQ before alerting.

tasks:
  - id: query_dlq_attributes
    type: io.kestra.plugin.aws.cli.AwsCLI
    runner: PROCESS
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws sqs get-queue-attributes           --queue-url "{{ inputs.dlq_url }}"           --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible           --output json > sqs_attrs.json
        python3 -c "
        import json
        with open('sqs_attrs.json') as f:
            attrs = json.load(f).get('Attributes', {})
        visible = int(attrs.get('ApproximateNumberOfMessages', 0))
        in_flight = int(attrs.get('ApproximateNumberOfMessagesNotVisible', 0))
        result = {
            'dlq_url': '{{ inputs.dlq_url }}',
            'visible_messages': visible,
            'in_flight_messages': in_flight,
            'alert_triggered': visible > {{ inputs.max_message_threshold }}
        }
        with open('sqs_summary.json', 'w') as out:
            json.dump(result, out)
        print('SQS DLQ audit:', result)
        "
    outputFiles:
      - sqs_summary.json

  - id: evaluate_dlq_depth
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.query_dlq_attributes.outputFiles['sqs_summary.json'])).alert_triggered }}"
    then:
      - id: alert_application_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *AWS SQS DLQ Backlog Alert*: Queue `{{ inputs.dlq_url }}` has accumulated {{ json(read(outputs.query_dlq_attributes.outputFiles['sqs_summary.json'])).visible_messages }} dead-lettered messages. Consumer processing failures or poison pills detected."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *SQS Sentinel Execution Failure*: Failed to query queue attributes for `{{ inputs.dlq_url }}`."
      }

triggers:
  - id: scheduled_dlq_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: AWS SQS Dead Letter Queue Message Depth Accumulation Sentinel
  shortDescription: Audits Amazon SQS Dead Letter Queues to detect message processing failures, unhandled exceptions, and poison pills.
  description: |
    ## How it works
    This sentinel calls `aws sqs get-queue-attributes` using `AwsCLI` to check `ApproximateNumberOfMessages` on specified dead letter queues. It alerts engineering teams when messages exceed retry limits and land in the DLQ, ensuring rapid triage of consumer worker failures.

    ## What you get
    - Continuous validation of asynchronous task queue health.
    - Early detection of serialization bugs and downstream dependency outages.
    - Automated Slack delivery tracking visible dead-letter message quantities.

    ## Who it's for
    - Microservice backend engineers and DevOps teams running event-driven architectures on AWS.
    - SREs maintaining asynchronous processing pipeline SLAs.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled operational health checks with native error handling, secret injection, and multi-channel alerting.

    ## Prerequisites
    - AWS IAM credentials with `sqs:GetQueueAttributes` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `dlq_url`, `aws_region`, and credentials.
    3. Run manually to check current DLQ backlog.

    ## How to extend
    - Trigger an automated message replay subflow via SQS redrive APIs.
    - Inspect message attributes or bodies via `sqs:ReceiveMessage` to include sample error details.
    - Forward queue metrics to CloudWatch or Datadog.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [Amazon SQS Dead-Letter Queues](https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
