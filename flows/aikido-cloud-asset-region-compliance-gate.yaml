id: aikido-cloud-asset-region-compliance-gate
namespace: company.team

description: |
  List every cloud asset Aikido has discovered across connected AWS, GCP, and Azure accounts,
  classify how many sit outside an approved region list, alert Slack with the exact assets when
  any are found, and log a governance audit trail either way.

inputs:
  - id: approved_regions_csv
    type: STRING
    displayName: Approved regions
    description: Comma-separated list of cloud regions assets are allowed to live in, for example us-east-1,eu-west-1.
    defaults: "us-east-1,eu-west-1"

  - id: max_violation_count
    type: INT
    displayName: Max violation count
    description: Alert when this many or more discovered assets sit outside the approved regions.
    defaults: 1

tasks:
  - id: list_cloud_assets
    type: io.kestra.plugin.aikido.clouds.ListAssets
    description: Read-only probe. Lists every cloud asset Aikido has discovered across connected cloud accounts; Aikido only observes these resources, it has no task to reconfigure or move them.
    allowFailure: true
    clientId: "{{ secret('AIKIDO_CLIENT_ID') }}"
    clientSecret: "{{ secret('AIKIDO_CLIENT_SECRET') }}"
    fetchType: FETCH

  - id: evaluate
    type: io.kestra.plugin.core.output.OutputValues
    description: Counts and lists discovered assets whose region is not in approved_regions_csv.
    values:
      violation_count: >-
        {{ outputs.list_cloud_assets is not defined ? -1 : (({'assets': outputs.list_cloud_assets.rows, 'approved': inputs.approved_regions_csv} | jq('(.approved | split(",")) as $a | [.assets[] | select((.region // "UNKNOWN") as $r | ($a | index($r)) == null)] | length')) | first | number) }}
      violation_summary: >-
        {{ outputs.list_cloud_assets is not defined ? '' : (({'assets': outputs.list_cloud_assets.rows, 'approved': inputs.approved_regions_csv} | jq('(.approved | split(",")) as $a | [.assets[] | select((.region // "UNKNOWN") as $r | ($a | index($r)) == null) | .assetName + " (" + (.region // "UNKNOWN") + ", " + .assetType + ")"] | join("; ")')) | first) }}
      severity: >-
        {{ outputs.list_cloud_assets is not defined ? 'PROBE_FAILED' : (((({'assets': outputs.list_cloud_assets.rows, 'approved': inputs.approved_regions_csv} | jq('(.approved | split(",")) as $a | [.assets[] | select((.region // "UNKNOWN") as $r | ($a | index($r)) == null)] | length')) | first | number) >= inputs.max_violation_count) ? 'REGION_VIOLATION' : 'COMPLIANT') }}

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    description: Branches on the computed severity. Every case ends in a log or a Slack alert, since Aikido's cloud inventory is observe-only; correcting a region violation happens in the cloud provider itself, outside anything this plugin can do.
    value: "{{ outputs.evaluate.values.severity }}"
    cases:
      "COMPLIANT":
        - id: log_compliant
          type: io.kestra.plugin.core.log.Log
          message: "No discovered cloud asset sits outside the approved regions ({{ inputs.approved_regions_csv }})."
      "REGION_VIOLATION":
        - id: alert_violation
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'REGION_VIOLATION: ' ~ outputs.evaluate.values.violation_count ~ ' discovered cloud asset(s) sit outside the approved regions (' ~ inputs.approved_regions_csv ~ '): ' ~ outputs.evaluate.values.violation_summary ~ '.'} | toJson }}
      "PROBE_FAILED":
        - id: alert_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'PROBE_FAILED: could not list Aikido cloud assets. Check the AIKIDO_CLIENT_ID and AIKIDO_CLIENT_SECRET secrets.'} | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "Aikido cloud asset region compliance gate complete: {{ outputs.evaluate.values.violation_count }} asset(s) out of region, severity {{ outputs.evaluate.values.severity }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Aikido cloud asset region compliance gate failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable once AIKIDO_CLIENT_ID, AIKIDO_CLIENT_SECRET, and SLACK_WEBHOOK_URL are set and approved_regions_csv reflects your real data-residency policy.
    cron: "0 6 * * *"
    disabled: true
    inputs:
      approved_regions_csv: "us-east-1,eu-west-1"
      max_violation_count: 1

extend:
  title: Aikido Cloud Asset Region Compliance Gate
  metaTitle: Aikido Cloud Asset Region Compliance Gate with Kestra
  shortDescription: List Aikido-discovered cloud assets, alert Slack when any sit outside your approved regions, and log a governance audit trail.
  metaDescription: Audit Aikido-discovered cloud assets against an approved region list, alert Slack on violations, and log the result for cloud security teams.
  description: |
    A cloud account connected to Aikido can accumulate resources in regions nobody approved: a
    test EC2 instance spun up in the wrong region, an S3 bucket created outside the data
    residency boundary a compliance policy requires. Aikido discovers every one of these assets
    across connected AWS, GCP, and Azure accounts, but it has no policy of its own checking
    whether a discovered asset's region is actually allowed. This blueprint reads that discovery
    data and reports exactly which assets are out of bounds, with no invented list, only what
    Aikido's own API actually returned.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `list_cloud_assets` (`io.kestra.plugin.aikido.clouds.ListAssets`) lists every discovered
       cloud asset across connected cloud accounts. Read-only; Aikido only observes these
       resources. `allowFailure: true` covers an API or auth error without failing the flow
       outright.
    2. `evaluate` (`io.kestra.plugin.core.output.OutputValues`) counts and lists assets whose
       `region` is not in `approved_regions_csv` with a `jq` filter, and classifies the result
       as `COMPLIANT`, `REGION_VIOLATION`, or `PROBE_FAILED`.
    3. `route` (`io.kestra.plugin.core.flow.Switch`):
       - **COMPLIANT:** logs that nothing discovered is out of region.
       - **REGION_VIOLATION:** posts the violation count and the exact assets to Slack.
       - **PROBE_FAILED:** posts a Slack alert instead.
    4. `summary` logs the violation count and severity, closing the governance cycle.
    5. `errors` alerts Slack if the flow itself fails, for example expired Aikido credentials.

    ## What you get

    - A region check against Aikido's own live cloud asset discovery, not a static inventory
      spreadsheet someone forgot to update.
    - The exact asset name, region, and type in the Slack alert, so whoever owns cloud governance
      can go straight to the resource instead of searching the Aikido console for it.
    - A read-only check with zero risk of modifying any cloud resource, since Aikido's own API
      has no write capability over discovered assets.

    ## Who it's for

    - Cloud security and compliance teams enforcing a data-residency or approved-region policy
      across every AWS, GCP, and Azure account connected to Aikido.
    - Teams evaluating the Aikido plugin who want a worked example of `clouds.ListAssets` used as
      a standing compliance gate, distinct from this repo's existing Aikido blueprints, which
      cover security issues, compliance reports, and repository/domain scanning rather than the
      cloud asset inventory itself.

    ## Why orchestrate this with Kestra

    Aikido discovers cloud assets continuously, but it has no region policy, no escalation, and
    no Slack integration of its own. Kestra keeps `approved_regions_csv` and
    `max_violation_count` as flow inputs, turns a raw asset list into a policy decision, and
    keeps a full execution history of every audit and which assets it flagged.

    ## Prerequisites

    - An Aikido account with an API client ID and secret scoped to `clouds:read`.
    - At least one cloud account connected to Aikido with a discovered asset outside
      `approved_regions_csv`, to confirm the violation path.
    - A Slack incoming webhook URL.

    Aikido is a hosted SaaS security platform with no official standalone Docker image, so
    `list_cloud_assets` cannot be exercised against a local container; validate against a real
    Aikido account (a free trial is available) with at least one connected cloud account first.

    ### Secrets

    - `AIKIDO_CLIENT_ID` / `AIKIDO_CLIENT_SECRET`: the Aikido API credentials used by
      `list_cloud_assets`. In Kestra OSS, provide them as the base64-encoded environment
      variables `SECRET_AIKIDO_CLIENT_ID` and `SECRET_AIKIDO_CLIENT_SECRET`.
    - `SLACK_WEBHOOK_URL`: used by both Slack alert cases and the `errors` block. In Kestra OSS,
      provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `approved_regions_csv` | `us-east-1,eu-west-1` | Comma-separated regions assets are allowed to live in |
    | `max_violation_count` | `1` | Out-of-region asset count that triggers the Slack alert |

    ### Outputs

    - `{{ outputs.list_cloud_assets.rows }}`: every discovered asset (`assetName`, `assetType`,
      `region`, `provider`, `cloudId`, `sourceId`), as Aikido reports them.
    - `{{ outputs.evaluate.values.violation_count }}` / `.violation_summary`: how many assets are
      out of region and a semicolon-joined `name (region, type)` summary of each.
    - `{{ outputs.evaluate.values.severity }}`: `COMPLIANT`, `REGION_VIOLATION`, or
      `PROBE_FAILED`.

    ### Pitfalls

    - `clouds.ListAssets` calls `GET /clouds/assets`; a comment in the task's own source notes
      this is the one list endpoint in the plugin that is `GET` rather than `POST`, confirmed
      directly against Aikido's OpenAPI spec rather than assumed. Not something this blueprint
      needs to work around, but worth knowing if extending it.
    - An asset with no `region` reported (some asset types, such as IAM users, are
      region-agnostic) is treated as a violation by default, since it cannot be confirmed as
      inside the approved list; adjust the `jq` filter's `// "UNKNOWN"` fallback if that is not
      the policy you want.
    - This checks the `region` field only, not `provider`; an approved-provider policy (for
      example, "no GCP assets at all") needs a separate filter on `provider`.

    ## Quick start

    1. Add the `AIKIDO_CLIENT_ID`, `AIKIDO_CLIENT_SECRET`, and `SLACK_WEBHOOK_URL` secrets.
    2. Connect at least one cloud account to Aikido with a real discovered asset.
    3. Set `approved_regions_csv` to your real policy and run the flow manually; confirm
       `summary` logs a violation count.
    4. Lower `approved_regions_csv` to exclude a region a known asset lives in, to confirm
       `alert_violation` fires with that asset named.
    5. Enable the `daily` trigger once the inputs reflect your real policy.

    ## How to extend

    - Filter `list_cloud_assets` by `assetType` to scope this gate to a specific resource class
      (for example, only databases or storage buckets) instead of every discovered asset.
    - Add a `provider` allowlist alongside the region check for a combined
      approved-provider-and-region policy.
    - Chain a lookup of the connected cloud account's owner (via `clouds.List`) to route each
      violation's Slack alert to the team that actually owns that cloud account.

    ## Links

    - Aikido plugin: https://kestra.io/plugins/plugin-aikido
    - Aikido cloud security documentation: https://help.aikido.dev/
    - Slack incoming webhooks: https://api.slack.com/messaging/webhooks
  tags:
    - Business
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
