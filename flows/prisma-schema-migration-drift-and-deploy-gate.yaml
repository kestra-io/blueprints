id: prisma-schema-migration-drift-and-deploy-gate
namespace: company.platform

description: |
  Inspects a Prisma ORM project and target database before deployment to
  detect uncommitted schema drift, catch failed migrations stuck in history,
  and generate an offline SQL dry-run plan for pending migrations. Blocks CI/CD
  deployment pipelines when database migrations have failed or when Prisma
  datamodel definitions have evolved without committed migration files.

inputs:
  - id: prisma_bundle
    type: FILE
    displayName: "Prisma Bundle Archive"
    description: "A tar.gz or zip archive containing prisma/schema.prisma and prisma/migrations. Used during manual execution or Subflow chaining; ignored when the webhook trigger fires, which supplies the bundle instead."

  - id: database_url
    type: STRING
    displayName: "Target Database URL"
    description: "Database connection URL (PostgreSQL postgresql://user:pass@host:5432/db, MySQL, or SQLite file:./dev.db). In production, configure via secret('DATABASE_URL')."
    defaults: "file:./dev.db"

  - id: fail_on_schema_drift
    type: BOOL
    displayName: "Fail on Schema Drift"
    description: "When true, blocks the deployment gate if prisma migrate diff detects uncommitted schema.prisma changes not captured in migration files."
    defaults: true

triggers:
  - id: check_on_pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Enables CI/CD pipelines (GitHub Actions, GitLab CI) to POST a pull request's Prisma bundle to Kestra for pre-merge validation. Streams the payload safely to internal storage as trigger.uri."
    key: "{{ secret('PRISMA_GATE_WEBHOOK_KEY') }}"
    fetchType: STORE
    disabled: true

tasks:
  - id: inspect_prisma_migrations
    type: io.kestra.plugin.scripts.shell.Commands
    description: |
      Executes Prisma CLI inspection inside a Node container. Verifies migration
      history status, detects uncommitted schema.prisma drift, and exports an
      offline SQL dry-run migration plan.
    containerImage: node:20-alpine
    allowFailure: true
    outputFiles:
      - "prisma-report.json"
      - "pending-migration.sql"
    commands:
      - |
        set -e
        npm install -g prisma > /dev/null 2>&1

        BUNDLE_PATH="{{ trigger.uri is defined ? trigger.uri : (inputs.prisma_bundle is defined ? inputs.prisma_bundle : '') }}"
        DATABASE_URL="{{ inputs.database_url }}"
        FAIL_ON_DRIFT="{{ inputs.fail_on_schema_drift }}"

        if [ -z "$BUNDLE_PATH" ] || [ ! -f "$BUNDLE_PATH" ]; then
          echo "No Prisma bundle available: supply prisma_bundle or trigger this flow via check_on_pr_webhook." >&2
          exit 1
        fi
        tar -xzf "$BUNDLE_PATH" 2>/dev/null || unzip -q "$BUNDLE_PATH" 2>/dev/null || true

        export DATABASE_URL="$DATABASE_URL"

        # 1. Check Prisma migration status
        set +e
        STATUS_OUTPUT=$(prisma migrate status 2>&1)
        STATUS_CODE=$?

        # 2. Check for datamodel drift between migrations and schema.prisma
        DRIFT_OUTPUT=$(prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code 2>&1)
        DRIFT_CODE=$?

        # 3. Generate offline SQL dry-run script for pending schema changes
        prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --script > pending-migration.sql 2>/dev/null || echo "-- No DDL changes generated" > pending-migration.sql
        set -e

        # Evaluate inspection results and write structured diagnostic report
        node << 'EOF'
        const fs = require('fs');

        const statusCode = parseInt(process.env.STATUS_CODE || '0', 10);
        const driftCode = parseInt(process.env.DRIFT_CODE || '0', 10);
        const statusOutput = process.env.STATUS_OUTPUT || '';
        const driftOutput = process.env.DRIFT_OUTPUT || '';
        const failOnDrift = process.env.FAIL_ON_DRIFT === 'true';

        const failedMigration = statusOutput.toLowerCase().includes('failed') || statusOutput.toLowerCase().includes('rolled back');
        const unappliedMigrations = statusOutput.toLowerCase().includes('have not yet been applied') || statusCode === 2;
        const schemaDrift = driftCode === 2;

        let gateStatus = 'PASS_UP_TO_DATE';
        let remediation = 'Database schema is fully synchronized with Prisma datamodel and migration history.';

        if (failedMigration) {
          gateStatus = 'BLOCK_FAILED_MIGRATIONS';
          remediation = "Resolve stuck failed migration with 'prisma migrate resolve --applied <migration>' or '--rolled-back <migration>'.";
        } else if (schemaDrift && failOnDrift) {
          gateStatus = 'BLOCK_SCHEMA_DRIFT';
          remediation = "Run 'prisma migrate dev --name <migration_name>' to generate and commit missing migration scripts.";
        } else if (unappliedMigrations || driftCode === 2) {
          gateStatus = 'PASS_PENDING_MIGRATIONS';
          remediation = "Review pending-migration.sql dry-run DDL artifact and proceed with deployment migration.";
        }

        const report = {
          gate_status: gateStatus,
          status_code: statusCode,
          failed_migration_detected: failedMigration,
          unapplied_migrations_detected: unappliedMigrations,
          schema_drift_detected: schemaDrift,
          remediation: remediation,
          status_summary: statusOutput.slice(0, 500),
          drift_summary: driftOutput.slice(0, 500)
        };

        fs.writeFileSync('prisma-report.json', JSON.stringify(report, null, 2));
        console.log(`Prisma inspection complete: status=${gateStatus}, failed=${failedMigration}, drift=${schemaDrift}`);
        EOF

  - id: classify_migration_gate
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates the Prisma diagnostic report and extracts the operational gate status.
    format: "{{ outputs.inspect_prisma_migrations.outputFiles['prisma-report.json'] is defined ? (read(outputs.inspect_prisma_migrations.outputFiles['prisma-report.json']) | jq('.gate_status') | first) : 'UNREACHABLE' }}"

  - id: route_by_migration_status
    type: io.kestra.plugin.core.flow.Switch
    description: Routes workflow execution based on the detected migration gate status.
    value: "{{ outputs.classify_migration_gate.value }}"
    cases:
      BLOCK_FAILED_MIGRATIONS:
        - id: alert_failed_migrations
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Sends high-priority Slack alert when a failed Prisma migration blocks deployment.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#platform-deployments",
              "text": "*Prisma Migration Gate Blocked: Failed Migration Detected*\n- Target database contains a failed migration in `_prisma_migrations`.\n- Deployment halted to prevent schema corruption.\n- *Action Required:* Run `prisma migrate resolve` to mark the migration as applied or rolled back."
            }
        - id: fail_gate_failed_migrations
          type: io.kestra.plugin.core.execution.Fail
          description: Deliberately halts execution to block downstream CI/CD deployment jobs.
          errorMessage: "Deployment blocked: Failed Prisma migration detected in target database. Resolve stuck migration with 'prisma migrate resolve' before deployment."

      BLOCK_SCHEMA_DRIFT:
        - id: alert_schema_drift
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Sends Slack alert when uncommitted Prisma schema changes are detected.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#platform-deployments",
              "text": "*Prisma Migration Gate Blocked: Uncommitted Schema Drift Detected*\n- `schema.prisma` contains datamodel changes not captured in `prisma/migrations`.\n- *Action Required:* Run `prisma migrate dev` to generate and commit migration files."
            }
        - id: fail_gate_schema_drift
          type: io.kestra.plugin.core.execution.Fail
          description: Deliberately halts execution when datamodel drift is detected.
          errorMessage: "Deployment blocked: Uncommitted datamodel drift detected in schema.prisma. Generate corresponding migration files before deploying."

      PASS_PENDING_MIGRATIONS:
        - id: log_pending_migrations
          type: io.kestra.plugin.core.log.Log
          description: Logs approval notice for pending migrations with SQL dry-run plan.
          message: "Prisma gate PASSED with pending migrations. Zero failed migrations, valid schema. Review dry-run DDL at {{ outputs.inspect_prisma_migrations.outputFiles['pending-migration.sql'] }}."
        - id: notify_pending_migration_review
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Notifies engineering and DBA teams that pending migrations are ready for deployment.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#platform-deployments",
              "text": "*Prisma Migration Gate Passed: Pending Migrations Ready*\n- Prisma migrations verified with zero stuck migrations.\n- Offline DDL dry-run script generated and attached for deployment review."
            }

      PASS_UP_TO_DATE:
        - id: log_up_to_date
          type: io.kestra.plugin.core.log.Log
          description: Confirms database schema is fully up-to-date with Prisma datamodel and migrations.
          message: "Prisma gate PASSED: Database schema is fully synchronized with latest migration history. Zero pending migrations, zero drift."

    defaults:
      - id: log_unreachable_state
        type: io.kestra.plugin.core.log.Log
        description: Logs unexpected or unreachable inspection outcome.
        message: "Prisma inspection returned unexpected status: {{ outputs.classify_migration_gate.value }}"

outputs:
  - id: gate_status
    type: STRING
    value: "{{ outputs.classify_migration_gate.value }}"

  - id: report_uri
    type: STRING
    value: "{{ outputs.inspect_prisma_migrations.outputFiles['prisma-report.json'] }}"

  - id: sql_plan_uri
    type: STRING
    value: "{{ outputs.inspect_prisma_migrations.outputFiles['pending-migration.sql'] }}"

errors:
  - id: alert_execution_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts operations team if inspection container fails unexpectedly.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#platform-deployments",
        "text": "*Prisma Migration Gate Pipeline Failed*\nExecution failed during migration preflight inspection. Check execution logs."
      }

extend:
  title: "Prisma Schema Migration Drift and Deployment Gate"
  metaTitle: "Prisma Migration Drift & Deployment Gate | Kestra Blueprint"
  shortDescription: "Detect uncommitted Prisma schema drift, catch failed migrations, and export dry-run DDL before deployment."
  metaDescription: "Block deployments on failed migrations or uncommitted Prisma datamodel drift while exporting pre-deployment DDL dry-run SQL artifacts."
  description: |
    Production database deployment failures in TypeScript and Node.js applications are commonly caused by two issues: uncommitted schema drift where `schema.prisma` is modified in code without generating corresponding migration files, and previously failed migrations that leave the database in an unrecoverable state where `prisma migrate deploy` crashes.

    This blueprint runs pre-deployment database migration verification using the official Prisma CLI in an isolated container. It verifies migration history with `prisma migrate status`, detects uncommitted datamodel drift with `prisma migrate diff`, generates an offline SQL dry-run plan (`pending-migration.sql`) for pending changes, and blocks downstream CI/CD deployment jobs when breaking migration conditions are detected.

    ## How it works

    1. `check_on_pr_webhook` (`io.kestra.plugin.core.trigger.Webhook`) allows external CI/CD pipelines (such as GitHub Actions or GitLab CI) to POST a pull request's Prisma bundle into Kestra. Using `fetchType: STORE`, the payload is securely written to internal storage and exposed as `trigger.uri`. Alternatively, running the flow manually or as a `Subflow` utilizes `prisma_bundle`.
    2. `inspect_prisma_migrations` (`io.kestra.plugin.scripts.shell.Commands`) runs in a `node:20-alpine` container. It inspects migration history with `prisma migrate status`, compares datasource schema against datamodel definitions with `prisma migrate diff`, and generates an offline SQL dry-run plan (`pending-migration.sql`). Output artifacts `prisma-report.json` and `pending-migration.sql` are collected.
    3. `classify_migration_gate` (`io.kestra.plugin.core.debug.Return`) reads the structured diagnostic report and determines the gate classification: `BLOCK_FAILED_MIGRATIONS`, `BLOCK_SCHEMA_DRIFT`, `PASS_PENDING_MIGRATIONS`, or `PASS_UP_TO_DATE`.
    4. `route_by_migration_status` (`io.kestra.plugin.core.flow.Switch`) branches on the classification:
       - `BLOCK_FAILED_MIGRATIONS`: Sends a Slack alert indicating a stuck migration and fails execution via `fail_gate_failed_migrations` (`io.kestra.plugin.core.execution.Fail`) to halt CI/CD deployment.
       - `BLOCK_SCHEMA_DRIFT`: Alerts the platform team with detected datamodel drift details and halts execution via `fail_gate_schema_drift`.
       - `PASS_PENDING_MIGRATIONS`: Notifies the team that pending migrations are validated, attaches the generated `pending-migration.sql` dry-run DDL artifact for review, and permits deployment to proceed.
       - `PASS_UP_TO_DATE`: Logs confirmation that the database schema is fully aligned with Prisma models and migrations.
    5. The `errors` block alerts the engineering team if runner execution fails unexpectedly.

    ## What you get

    - Automated prevention of deployment crashes caused by failed migrations or database history desynchronization.
    - Early detection of uncommitted `schema.prisma` modifications before code reaches production, preventing runtime missing column or relation errors.
    - Pre-computed offline SQL dry-run artifacts (`pending-migration.sql`) allowing DBAs to review exact DDL statements before execution.
    - Hard CI/CD deployment blocking via Kestra's `Fail` task to stop broken releases before database modification occurs.

    ## Who it's for

    - Platform Engineers and DevOps teams managing database rollout pipelines for TypeScript and Node.js applications.
    - Full-Stack and Backend Engineers developing services with Prisma ORM, Next.js, NestJS, Remix, or Express.
    - Database Administrators requiring pre-execution DDL dry-run reviews for production database schema alterations.

    ## Why orchestrate this with Kestra

    Prisma CLI commands output text diagnostics to stdout but cannot natively coordinate multi-stage deployment approvals, store auditable execution artifacts, or integrate with incident messaging. Orchestrating migration verification in Kestra provides declarative gate policies, captures generated SQL dry-run scripts as auditable downloadable artifacts, and seamlessly halts chained deployment pipelines when schema inconsistencies are detected.

    ## Prerequisites

    - A Kestra worker with Docker container execution enabled.
    - Network access from the container to the target PostgreSQL, MySQL, or CockroachDB database (or local SQLite for self-contained testing).
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `PRISMA_GATE_WEBHOOK_KEY`: Authentication key for the CI/CD webhook trigger (`.../executions/webhook/{namespace}/{flowId}/{key}`). Only required when `check_on_pr_webhook` is active.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to transmit deployment gate alerts, remediation instructions, and review notices.
    - `DATABASE_URL`: Connection string for target database in production environments.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    2. Package a real `prisma/schema.prisma` and `prisma/migrations` directory as a tar.gz or zip, upload it as `prisma_bundle`, run the flow, and confirm `gate_status` matches what you expect.
    3. To test failed migration detection, configure a target database with an unresolved failed migration in `_prisma_migrations` and observe the automated gate block.
    4. Enable `check_on_pr_webhook` to trigger automated pre-merge migration verification from your CI/CD repository workflows.

    ## How to extend

    - Connect downstream database migration execution tasks using `prisma migrate deploy` or chained Subflows once the gate passes.
    - Integrate with GitHub Commit Status API to report migration validation results directly onto pull requests.
    - Store generated `pending-migration.sql` artifacts in an S3 or Google Cloud Storage bucket for regulatory compliance audit trails.

    ## Links

    - [Prisma Migrate Documentation](https://www.prisma.io/docs/concepts/components/prisma-migrate)
    - [Prisma CLI Reference](https://www.prisma.io/docs/reference/api-reference/prisma-cli-reference)
    - [Kestra Commands Plugin](https://kestra.io/plugins/plugin-scripts-shell/tasks/io.kestra.plugin.scripts.shell.commands)
    - [Kestra Fail Task](https://kestra.io/plugins/core/tasks/execution/io.kestra.plugin.core.execution.fail)
    - [Kestra Switch Task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false
