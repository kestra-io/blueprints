id: fixed-asset-depreciation-close
namespace: company.team

description: |
  Monthly fixed asset close: depreciate the register (straight-line, or declining balance with
  the switch to straight-line), apply the mid-month convention, book disposals with their gain
  or loss, catch up late additions, roll cost and accumulated depreciation forward by category,
  tie the subledger to the general ledger, post the journals and lock the period.

inputs:
  - id: period
    type: STRING
    displayName: Period (YYYY-MM)
    defaults: "2026-08"
    validator: ^\d{4}-(0[1-9]|1[0-2])$

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: >
      CLEAN: a consistent register. ISSUES: a laptop capitalized in the ledger but missing from
      the register, an asset sold before it was placed in service, and a salvage value above
      cost, which must block the close. BACKDATED: a forklift placed in service on 2026-08-11
      but registered after August closed, which must come through as a catch-up.
    values:
      - CLEAN
      - ISSUES
      - BACKDATED
    defaults: CLEAN

  - id: approved_by
    type: STRING
    displayName: Approved by
    description: Required to close a period that carries catch-up depreciation or a late addition.
    defaults: ""

variables:
  lock_key: fixed_asset_close
  pack_dir: "fixed-assets/{{ inputs.period }}"

concurrency:
  limit: 1

triggers:
  - id: second_business_day
    type: io.kestra.plugin.core.trigger.Schedule
    description: The 2nd of each month, for the month before. Disabled until the register is wired in.
    cron: "0 6 2 * *"
    disabled: true

tasks:
  # ---------------------------------------------------------------------------
  # 1. Period control and the balances the last close left
  # ---------------------------------------------------------------------------
  - id: period_control
    type: io.kestra.plugin.core.output.OutputValues
    values:
      lock: "{{ kv(vars.lock_key, errorOnMissing=false) ?? {'period': '', 'by_category': {}} | toJson }}"
      last_closed: "{{ (kv(vars.lock_key, errorOnMissing=false) ?? {'period': ''}) | jq('.period') | first }}"
      previous_period: "{{ (inputs.period ~ '-01') | date('yyyy-MM-dd') | dateAdd(-1, 'MONTHS') | date('yyyy-MM') }}"
      period_end: "{{ (inputs.period ~ '-01') | date('yyyy-MM-dd') | dateAdd(1, 'MONTHS') | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd') }}"

  - id: period_gate
    type: io.kestra.plugin.core.flow.If
    description: Refuse a closed period, or one whose previous period is still open.
    condition: >-
      {{ outputs.period_control.values.last_closed != ''
         and (outputs.period_control.values.last_closed >= inputs.period
              or outputs.period_control.values.last_closed != outputs.period_control.values.previous_period) }}
    then:
      - id: period_refused
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          {{ outputs.period_control.values.last_closed >= inputs.period
             ? 'Period ' ~ inputs.period ~ ' is already closed (last closed: ' ~ outputs.period_control.values.last_closed ~ ').'
             : 'Period ' ~ outputs.period_control.values.previous_period ~ ' must be closed before ' ~ inputs.period ~ ' (last closed: ' ~ outputs.period_control.values.last_closed ~ ').' }}

  # ---------------------------------------------------------------------------
  # 2. Depreciate, dispose, roll forward, tie out
  # ---------------------------------------------------------------------------
  - id: depreciate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: the register (demo generator or your data), a month-by-month
      schedule per asset built with a recursive query, disposals, the roll-forward by
      category against the last close, the general ledger tie-out, blockers and journals.
    outputFiles:
      - register
      - schedule
      - disposals
      - rollforward
      - journals
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE p_start = DATE '{{ inputs.period }}-01';
      SET VARIABLE p_end = DATE '{{ outputs.period_control.values.period_end }}';
      SET VARIABLE has_lock = {{ outputs.period_control.values.last_closed != '' }};

      -- =======================================================================
      -- Policy: one row per asset category.
      -- =======================================================================
      CREATE TABLE categories (category VARCHAR, method VARCHAR, life_months INT, salvage_pct DECIMAL(5, 2),
                               cost_account VARCHAR, ad_account VARCHAR, expense_account VARCHAR);
      INSERT INTO categories VALUES
        ('Computers', 'SL', 36, 0, '1510', '1519', '6510'),
        ('Software', 'SL', 36, 0, '1520', '1529', '6520'),
        ('Furniture', 'SL', 84, 0, '1530', '1539', '6510'),
        ('Machinery', 'SL', 120, 0.10, '1540', '1549', '6530'),
        ('Vehicles', 'DDB', 60, 0.15, '1550', '1559', '6540'),
        ('Leasehold improvements', 'SL', 96, 0, '1560', '1569', '6550');

      -- =======================================================================
      -- Demo register. Replace with your asset register export.
      -- =======================================================================
      CREATE TABLE register AS
      WITH base AS (
        SELECT i,
               ['Computers', 'Software', 'Furniture', 'Machinery', 'Vehicles', 'Leasehold improvements'][1 + i % 6] AS category,
               DATE '2018-01-10' + ((i * 37) % 3100)::INT AS in_service_on
        FROM range(1, 181) t(i)
      )
      SELECT 'FA-' || lpad(i::VARCHAR, 4, '0') AS asset_id, category,
             category || ' item ' || i AS description, in_service_on,
             (CASE category WHEN 'Computers' THEN 1200 + (i * 53) % 2400 WHEN 'Software' THEN 8000 + (i * 911) % 30000
                            WHEN 'Furniture' THEN 900 + (i * 131) % 5000 WHEN 'Machinery' THEN 25000 + (i * 7919) % 90000
                            WHEN 'Vehicles' THEN 28000 + (i * 3571) % 32000 ELSE 40000 + (i * 6007) % 160000 END)::DECIMAL(14, 2) AS cost,
             NULL::DECIMAL(14, 2) AS salvage_override, NULL::DATE AS disposed_on, NULL::DECIMAL(14, 2) AS proceeds
      FROM base;

      -- Additions and disposals at fixed dates, so consecutive closes see the same history.
      INSERT INTO register VALUES
        ('FA-0181', 'Computers', 'Laptops batch Aug', DATE '2026-08-04', 14400.00, NULL, NULL, NULL),
        ('FA-0182', 'Machinery', 'CNC router', DATE '2026-09-03', 86000.00, NULL, NULL, NULL),
        ('FA-0183', 'Vehicles', 'Delivery van', DATE '2026-09-22', 41500.00, NULL, NULL, NULL),
        ('FA-0184', 'Furniture', 'Meeting room fit-out', DATE '2026-10-12', 12800.00, NULL, NULL, NULL);
      UPDATE register SET disposed_on = DATE '2026-08-10', proceeds = 300.00 WHERE asset_id = 'FA-0019';
      UPDATE register SET disposed_on = DATE '2026-09-20', proceeds = 21000.00 WHERE asset_id = 'FA-0047';
      UPDATE register SET disposed_on = DATE '2026-09-28', proceeds = 0.00 WHERE asset_id = 'FA-0063';
      UPDATE register SET disposed_on = DATE '2026-10-05', proceeds = 15500.00 WHERE asset_id = 'FA-0101';
      {% if inputs.scenario == 'BACKDATED' %}
      INSERT INTO register VALUES ('FA-0185', 'Machinery', 'Forklift (registered late)', DATE '2026-08-11', 32000.00, NULL, NULL, NULL);
      {% endif %}
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO register VALUES ('FA-0186', 'Vehicles', 'Sold before in service', DATE '{{ inputs.period }}-20', 30000.00, NULL, DATE '{{ inputs.period }}-05', 25000.00);
      UPDATE register SET salvage_override = cost + 500 WHERE asset_id = 'FA-0004';
      {% endif %}

      -- =======================================================================
      -- Mid-month convention. In service on or before the 15th: depreciate from that
      -- month. Disposed on or before the 15th: stop the month before.
      -- =======================================================================
      CREATE TABLE assets AS
      SELECT r.*, c.method, c.life_months, c.cost_account, c.ad_account, c.expense_account,
             coalesce(r.salvage_override, round(r.cost * c.salvage_pct, 2))::DECIMAL(14, 2) AS salvage,
             CASE WHEN day(r.in_service_on) <= 15 THEN date_trunc('month', r.in_service_on)
                  ELSE date_trunc('month', r.in_service_on) + INTERVAL 1 MONTH END::DATE AS dep_start,
             CASE WHEN r.disposed_on IS NULL THEN NULL
                  WHEN day(r.disposed_on) <= 15 THEN date_trunc('month', r.disposed_on) - INTERVAL 1 MONTH
                  ELSE date_trunc('month', r.disposed_on) END::DATE AS dep_last
      FROM register r LEFT JOIN categories c USING (category);

      -- =======================================================================
      -- Blockers in the register itself.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'UNKNOWN_CATEGORY' AS code, asset_id AS ref, 'Category ' || category || ' has no depreciation policy' AS detail FROM assets WHERE method IS NULL
      UNION ALL SELECT 'SALVAGE_ABOVE_COST', asset_id, 'Salvage ' || salvage || ' is above cost ' || cost FROM assets WHERE salvage > cost
      UNION ALL SELECT 'DISPOSED_BEFORE_IN_SERVICE', asset_id, 'Disposed on ' || disposed_on || ', in service on ' || in_service_on FROM assets WHERE disposed_on < in_service_on
      UNION ALL SELECT 'DUPLICATE_ASSET_ID', asset_id, count(*) || ' rows' FROM register GROUP BY asset_id HAVING count(*) > 1;

      -- =======================================================================
      -- Schedule, one row per asset and month, to the end of the period. Declining
      -- balance takes the larger of 200% DB and straight-line over the remaining life,
      -- which is the classic switch. The last month lands exactly on salvage.
      -- =======================================================================
      -- Exact half-up rounding to the cent. DuckDB returns a double for DECIMAL / INT,
      -- and a double sitting on .005 rounds the wrong way about once in a thousand months.
      CREATE MACRO divr(amount, den) AS (((2 * (amount * 100)::BIGINT + den) // (2 * den)) / 100)::DECIMAL(14, 2);

      CREATE TABLE schedule AS
      WITH RECURSIVE s(asset_id, k, month, dep, nbv) AS (
        SELECT asset_id, 1, dep_start,
               least(CASE WHEN life_months = 1 THEN cost - salvage
                          WHEN method = 'DDB' THEN greatest(divr(cost * 2, life_months), divr(cost - salvage, life_months))
                          ELSE divr(cost - salvage, life_months) END, cost - salvage)::DECIMAL(14, 2),
               (cost - least(CASE WHEN life_months = 1 THEN cost - salvage
                                  WHEN method = 'DDB' THEN greatest(divr(cost * 2, life_months), divr(cost - salvage, life_months))
                                  ELSE divr(cost - salvage, life_months) END, cost - salvage))::DECIMAL(14, 2)
        FROM assets
        WHERE method IS NOT NULL AND salvage <= cost AND dep_start <= getvariable('p_end')
          AND (dep_last IS NULL OR dep_last >= dep_start)
        UNION ALL
        SELECT s.asset_id, s.k + 1, (s.month + INTERVAL 1 MONTH)::DATE, x.dep, (s.nbv - x.dep)::DECIMAL(14, 2)
        FROM s JOIN assets a USING (asset_id),
        LATERAL (SELECT least(CASE WHEN a.life_months - s.k = 1 THEN s.nbv - a.salvage
                                   WHEN a.method = 'DDB' THEN greatest(divr(s.nbv * 2, a.life_months), divr(s.nbv - a.salvage, a.life_months - s.k))
                                   ELSE divr(a.cost - a.salvage, a.life_months) END, s.nbv - a.salvage)::DECIMAL(14, 2) AS dep) x
        WHERE s.k < a.life_months AND s.month + INTERVAL 1 MONTH <= getvariable('p_end')
          AND (a.dep_last IS NULL OR s.month + INTERVAL 1 MONTH <= a.dep_last)
      )
      SELECT * FROM s;

      -- =======================================================================
      -- Positions by asset at the start (d0) and the end (d1) of the period.
      -- =======================================================================
      CREATE TABLE positions AS
      SELECT a.asset_id, a.category, a.cost, a.salvage, a.in_service_on, a.disposed_on, a.proceeds,
             a.cost_account, a.ad_account, a.expense_account,
             a.in_service_on < getvariable('p_start') AND (a.disposed_on IS NULL OR a.disposed_on >= getvariable('p_start')) AS held_d0,
             a.in_service_on <= getvariable('p_end') AND (a.disposed_on IS NULL OR a.disposed_on > getvariable('p_end')) AS held_d1,
             a.disposed_on BETWEEN getvariable('p_start') AND getvariable('p_end') AND a.in_service_on <= a.disposed_on AS disposed_now,
             coalesce((SELECT sum(dep) FROM schedule s WHERE s.asset_id = a.asset_id AND s.month < getvariable('p_start')), 0) AS ad_d0,
             coalesce((SELECT sum(dep) FROM schedule s WHERE s.asset_id = a.asset_id), 0) AS ad_d1,
             coalesce((SELECT sum(dep) FROM schedule s WHERE s.asset_id = a.asset_id AND s.month >= getvariable('p_start')), 0) AS dep_now,
             (SELECT max(k) FROM schedule s WHERE s.asset_id = a.asset_id) = a.life_months AS fully_depreciated
      FROM assets a WHERE a.method IS NOT NULL;

      CREATE TABLE disposals AS
      SELECT asset_id, category, disposed_on, cost, ad_d1 AS accumulated_depreciation, cost - ad_d1 AS nbv, proceeds,
             proceeds - (cost - ad_d1) AS gain_loss
      FROM positions WHERE disposed_now;

      -- What the last close stored per category.
      CREATE TABLE locked AS
      SELECT key AS category, (value ->> 'cost')::DECIMAL(14, 2) AS cost, (value ->> 'ad')::DECIMAL(14, 2) AS ad
      FROM json_each('{{ outputs.period_control.values.lock | jq(".by_category") | first | toJson }}');

      -- =======================================================================
      -- Roll-forward by category. Opening comes from the last close when there is one.
      -- Anything the register now says about the past, minus what was closed, is a late
      -- addition (cost) or catch-up depreciation (accumulated depreciation).
      -- =======================================================================
      CREATE TABLE rollforward AS
      WITH now_ AS (
        SELECT category,
               sum(CASE WHEN held_d0 THEN cost ELSE 0 END) AS cost_d0_now,
               sum(CASE WHEN held_d0 THEN ad_d0 ELSE 0 END) AS ad_d0_now,
               sum(CASE WHEN in_service_on BETWEEN getvariable('p_start') AND getvariable('p_end') THEN cost ELSE 0 END) AS additions,
               sum(CASE WHEN disposed_now THEN cost ELSE 0 END) AS disposal_cost,
               sum(CASE WHEN disposed_now THEN ad_d1 ELSE 0 END) AS disposal_ad,
               sum(CASE WHEN held_d0 OR held_d1 OR disposed_now THEN dep_now ELSE 0 END) AS depreciation,
               sum(CASE WHEN held_d1 THEN cost ELSE 0 END) AS cost_d1,
               sum(CASE WHEN held_d1 THEN ad_d1 ELSE 0 END) AS ad_d1,
               count(*) FILTER (WHERE held_d1 AND fully_depreciated) AS fully_depreciated_in_use
        FROM positions GROUP BY category
      )
      SELECT n.category,
             CASE WHEN getvariable('has_lock') THEN coalesce(l.cost, 0) ELSE n.cost_d0_now END AS opening_cost,
             n.additions,
             CASE WHEN getvariable('has_lock') THEN n.cost_d0_now - coalesce(l.cost, 0) ELSE 0 END AS late_additions,
             n.disposal_cost, n.cost_d1 AS closing_cost,
             CASE WHEN getvariable('has_lock') THEN coalesce(l.ad, 0) ELSE n.ad_d0_now END AS opening_ad,
             n.depreciation,
             CASE WHEN getvariable('has_lock') THEN n.ad_d0_now - coalesce(l.ad, 0) ELSE 0 END AS catch_up,
             n.disposal_ad, n.ad_d1 AS closing_ad, n.cost_d1 - n.ad_d1 AS closing_nbv, n.fully_depreciated_in_use
      FROM now_ n LEFT JOIN locked l USING (category)
      ORDER BY n.category;

      -- The roll-forward must tie on both columns.
      CREATE TABLE rf_check AS
      SELECT category,
             opening_cost + additions + late_additions - disposal_cost - closing_cost AS cost_diff,
             opening_ad + depreciation + catch_up - disposal_ad - closing_ad AS ad_diff
      FROM rollforward;

      -- =======================================================================
      -- General ledger before this run's journals. Replace with your trial balance.
      -- Additions reach the asset accounts through accounts payable; disposals and
      -- depreciation are posted by this flow.
      -- =======================================================================
      CREATE TABLE gl_before AS
      SELECT c.cost_account AS account, r.closing_cost + r.disposal_cost
             {% if inputs.scenario == 'ISSUES' %} + CASE WHEN r.category = 'Computers' THEN 2350.00 ELSE 0 END{% endif %} AS balance
      FROM rollforward r JOIN categories c USING (category)
      UNION ALL
      SELECT c.ad_account, -(r.opening_ad) FROM rollforward r JOIN categories c USING (category);

      -- =======================================================================
      -- Journals.
      -- =======================================================================
      CREATE TABLE journals AS
      SELECT row_number() OVER (ORDER BY sort, account) AS line, account, account_name, debit::DECIMAL(14, 2) AS debit, credit::DECIMAL(14, 2) AS credit, memo FROM (
        SELECT 1 AS sort, c.expense_account AS account, 'Depreciation expense' AS account_name, r.depreciation + r.catch_up AS debit, 0 AS credit,
               r.category || ' depreciation' || CASE WHEN r.catch_up <> 0 THEN ', including catch-up of ' || r.catch_up ELSE '' END AS memo
          FROM rollforward r JOIN categories c USING (category) WHERE r.depreciation + r.catch_up <> 0
        UNION ALL
        SELECT 2, c.ad_account, 'Accumulated depreciation', 0, r.depreciation + r.catch_up, r.category || ' depreciation'
          FROM rollforward r JOIN categories c USING (category) WHERE r.depreciation + r.catch_up <> 0
        UNION ALL
        SELECT 3, a.ad_account, 'Accumulated depreciation', d.accumulated_depreciation, 0, 'Disposal ' || d.asset_id FROM disposals d JOIN assets a USING (asset_id)
        UNION ALL
        SELECT 3, '1300', 'Disposal proceeds receivable', d.proceeds, 0, 'Disposal ' || d.asset_id FROM disposals d WHERE d.proceeds > 0
        UNION ALL
        SELECT 3, a.cost_account, 'Asset cost', 0, d.cost, 'Disposal ' || d.asset_id FROM disposals d JOIN assets a USING (asset_id)
        UNION ALL
        SELECT 3, CASE WHEN d.gain_loss >= 0 THEN '7200' ELSE '6900' END, CASE WHEN d.gain_loss >= 0 THEN 'Gain on disposal' ELSE 'Loss on disposal' END,
               greatest(-d.gain_loss, 0), greatest(d.gain_loss, 0), 'Disposal ' || d.asset_id
          FROM disposals d WHERE d.gain_loss <> 0
      );

      -- The ledger after the journals must equal the subledger.
      CREATE TABLE tie_out AS
      WITH after AS (
        SELECT account, sum(balance) AS balance FROM (
          SELECT account, balance FROM gl_before
          UNION ALL SELECT account, debit - credit FROM journals
        ) GROUP BY account
      ), sub AS (
        SELECT c.cost_account AS account, r.closing_cost AS balance FROM rollforward r JOIN categories c USING (category)
        UNION ALL SELECT c.ad_account, -r.closing_ad FROM rollforward r JOIN categories c USING (category)
      )
      SELECT s.account, a.balance AS ledger, s.balance AS subledger, a.balance - s.balance AS difference
      FROM sub s JOIN after a USING (account);

      INSERT INTO blockers
      SELECT 'ROLLFORWARD_DOES_NOT_TIE', category, 'cost difference ' || cost_diff || ', accumulated depreciation difference ' || ad_diff
        FROM rf_check WHERE cost_diff <> 0 OR ad_diff <> 0
      UNION ALL
      SELECT 'LEDGER_SUBLEDGER_DIFFERENCE', account, 'ledger ' || ledger || ' vs register ' || subledger || ' (difference ' || difference || ')'
        FROM tie_out WHERE difference <> 0
      UNION ALL
      SELECT 'JOURNAL_OUT_OF_BALANCE', 'journals', 'debits ' || sum(debit) || ', credits ' || sum(credit) FROM journals HAVING sum(debit) <> sum(credit);

      COPY (SELECT asset_id, category, description, in_service_on, cost, salvage, method, life_months, dep_start, dep_last, disposed_on, proceeds FROM assets ORDER BY asset_id) TO '{{ outputFiles.register }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM schedule ORDER BY asset_id, k) TO '{{ outputFiles.schedule }}' (HEADER, DELIMITER ',');
      COPY disposals TO '{{ outputFiles.disposals }}' (HEADER, DELIMITER ',');
      COPY rollforward TO '{{ outputFiles.rollforward }}' (HEADER, DELIMITER ',');
      COPY journals TO '{{ outputFiles.journals }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM positions WHERE held_d1) AS assets_in_service,
        (SELECT count(*) FROM schedule) AS schedule_rows,
        (SELECT sum(additions) FROM rollforward) AS additions,
        (SELECT sum(late_additions) FROM rollforward) AS late_additions,
        (SELECT sum(depreciation) FROM rollforward) AS depreciation,
        (SELECT sum(catch_up) FROM rollforward) AS catch_up,
        (SELECT string_agg(category || ' ' || depreciation, ', ' ORDER BY category) FROM rollforward WHERE depreciation <> 0) AS depreciation_by_category,
        (SELECT count(*) FROM disposals) AS disposals,
        (SELECT coalesce(string_agg(asset_id || ' ' || CASE WHEN gain_loss >= 0 THEN 'gain ' ELSE 'loss ' END || abs(gain_loss), ', ' ORDER BY asset_id), '') FROM disposals) AS disposal_detail,
        (SELECT coalesce(sum(gain_loss), 0) FROM disposals) AS net_gain_loss,
        (SELECT sum(closing_cost) FROM rollforward) AS closing_cost,
        (SELECT sum(closing_ad) FROM rollforward) AS closing_ad,
        (SELECT sum(closing_nbv) FROM rollforward) AS closing_nbv,
        (SELECT sum(fully_depreciated_in_use) FROM rollforward) AS fully_depreciated_in_use,
        (SELECT json_group_object(category, json_object('cost', closing_cost, 'ad', closing_ad))::VARCHAR FROM rollforward) AS by_category,
        (SELECT sum(debit) FROM journals) AS journal_total,
        (SELECT count(*) FROM blockers) AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.depreciate.outputs | last).row | toJson }}"

  - id: log_close
    type: io.kestra.plugin.core.log.Log
    message: |
      Fixed asset close {{ inputs.period }} ({{ inputs.scenario }}).
      {{ outputs.result.values.r | jq('"\(.assets_in_service) assets in service, \(.schedule_rows) schedule rows. Additions \(.additions), late additions \(.late_additions)."') | first }}
      {{ outputs.result.values.r | jq('"Depreciation \(.depreciation) (\(.depreciation_by_category)), catch-up \(.catch_up)."') | first }}
      {{ outputs.result.values.r | jq('"Disposals: \(.disposals) \(.disposal_detail), net \(.net_gain_loss)."') | first }}
      {{ outputs.result.values.r | jq('"Closing cost \(.closing_cost), accumulated depreciation \(.closing_ad), net book value \(.closing_nbv). Fully depreciated and still in use: \(.fully_depreciated_in_use)."') | first }}
      {{ outputs.result.values.r | jq('"Blockers: \(.blockers). \(.blocker_detail)"') | first }}

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/register.csv": "{{ outputs.depreciate.outputFiles.register }}"
      "{{ render(vars.pack_dir) }}/schedule.csv": "{{ outputs.depreciate.outputFiles.schedule }}"
      "{{ render(vars.pack_dir) }}/disposals.csv": "{{ outputs.depreciate.outputFiles.disposals }}"
      "{{ render(vars.pack_dir) }}/rollforward.csv": "{{ outputs.depreciate.outputFiles.rollforward }}"
      "{{ render(vars.pack_dir) }}/journals.csv": "{{ outputs.depreciate.outputFiles.journals }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.depreciate.outputFiles.blockers }}"

  # ---------------------------------------------------------------------------
  # 3. Decide
  # ---------------------------------------------------------------------------
  - id: verdict
    type: io.kestra.plugin.core.output.OutputValues
    values:
      state: >-
        {%- set r = outputs.result.values.r -%}
        {%- if (r | jq('.blockers') | first) > 0 -%}BLOCKED
        {%- elseif ((r | jq('.catch_up') | first) != 0 or (r | jq('.late_additions') | first) != 0) and inputs.approved_by == '' -%}NEEDS_APPROVAL
        {%- else -%}READY{%- endif -%}

  - id: decide
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.verdict.values.state }}"
    cases:
      READY:
        - id: lock_period
          type: io.kestra.plugin.core.kv.Set
          description: The closing cost and accumulated depreciation per category become the next close's opening balances.
          key: "{{ vars.lock_key }}"
          kvType: JSON
          value: |
            {"period": "{{ inputs.period }}", "closed_at": "{{ now() }}", "execution_id": "{{ execution.id }}",
             "by_category": {{ outputs.result.values.r | jq('.by_category') | first }},
             "depreciation": {{ outputs.result.values.r | jq('.depreciation') | first }},
             "catch_up": {{ outputs.result.values.r | jq('.catch_up') | first }},
             "net_book_value": {{ outputs.result.values.r | jq('.closing_nbv') | first }},
             "approved_by": "{{ inputs.approved_by }}"}

        - id: log_closed
          type: io.kestra.plugin.core.log.Log
          message: "Fixed assets for {{ inputs.period }} closed. Net book value {{ outputs.result.values.r | jq('.closing_nbv') | first }}. Evidence in {{ render(vars.pack_dir) }}."

      NEEDS_APPROVAL:
        - id: approval_required
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            The register changed for a closed period: late additions {{ outputs.result.values.r | jq('.late_additions') | first }},
            catch-up depreciation {{ outputs.result.values.r | jq('.catch_up') | first }}. Both are booked in {{ inputs.period }}.
            Review {{ render(vars.pack_dir) }}/rollforward.csv and run again with approved_by.

    defaults:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Fixed assets for {{ inputs.period }} not closed: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

extend:
  title: Run monthly depreciation and close the fixed asset register against the ledger
  metaTitle: Fixed asset depreciation run and close with Kestra and DuckDB
  shortDescription: Depreciate the register with straight-line or declining balance, apply the mid-month convention, book disposals and catch-ups, roll forward by category, tie to the ledger and lock the period.
  metaDescription: Monthly fixed asset depreciation close in Kestra and DuckDB. Straight-line and declining balance, disposals, catch-up, roll-forward and ledger tie-out.
  description: |
    The depreciation run is the fixed asset accountant's monthly job. Depreciate every asset, book what was sold or scrapped with its gain or loss, pick up assets registered late, and prove that the register and the general ledger agree, category by category. ERPs do the arithmetic. The close around it is usually a spreadsheet. This flow runs the whole close and refuses to lock a period that does not tie.

    It runs with no setup and no network. DuckDB generates a register of 184 assets in six categories, in service since 2018, with additions and disposals on fixed dates so consecutive closes see the same history.


    ## Depreciation rules

    | Rule | Implementation |
    |---|---|
    | Policy per category | Method, life in months, salvage percentage and the three accounts (cost, accumulated depreciation, expense) |
    | Straight-line | (cost - salvage) / life each month |
    | Declining balance | The larger of 200% declining balance and straight-line over the remaining life. This is the standard switch, and it lands exactly on salvage |
    | Mid-month convention | In service on or before the 15th: depreciate from that month. Disposed on or before the 15th: stop the month before |
    | Last month | Takes the residual, so the net book value ends exactly on salvage |
    | Rounding | Exact half-up to the cent |

    The schedule is a recursive DuckDB query, one row per asset and month: 8,054 rows for the August demo. The flow stores it in the evidence pack.

    ## The roll-forward and the tie-out

    For each category:

    ```text
    opening cost + additions + late additions - disposals = closing cost
    opening AD + depreciation + catch-up - AD on disposals = closing AD
    ```

    The opening balances are the closing balances the last close stored in KV. If the register now shows a different past (an asset placed in service in a closed month but registered late), the difference becomes a **late addition** and **catch-up depreciation** in the current period. The close then needs `approved_by`, and the flow never changes a closed period.

    The ledger tie-out takes the trial balance before this run, adds this run's journals, and requires every cost and accumulated depreciation account to equal the register. A laptop capitalized to the ledger but never registered shows up here, to the cent.

    ## What blocks the close

    - `UNKNOWN_CATEGORY`: no depreciation policy for the category.
    - `SALVAGE_ABOVE_COST`.
    - `DISPOSED_BEFORE_IN_SERVICE`.
    - `DUPLICATE_ASSET_ID`.
    - `ROLLFORWARD_DOES_NOT_TIE`.
    - `LEDGER_SUBLEDGER_DIFFERENCE`.
    - `JOURNAL_OUT_OF_BALANCE`.

    ## How it works

    1. `period_control` and `period_gate` refuse a closed period or one whose previous period is open, and load the last closing balances.
    2. `depreciate` (`io.kestra.plugin.jdbc.duckdb.Queries`) runs in one session:
       - it builds the register and applies the conventions,
       - it builds the schedule and the positions at the start and end of the period,
       - it books the disposals with their gain or loss,
       - it computes the roll-forward, the ledger tie-out, the blockers and the journals.
    3. `log_close` prints the close. `evidence` (`io.kestra.plugin.core.namespace.UploadFiles`) stores `register.csv`, `schedule.csv`, `disposals.csv`, `rollforward.csv`, `journals.csv` and `blockers.csv`.
    4. `decide` (`io.kestra.plugin.core.flow.Switch`):
       - `READY`: `lock_period` (`io.kestra.plugin.core.kv.Set`) stores the closing cost and accumulated depreciation per category.
       - `NEEDS_APPROVAL` and `BLOCKED` fail with the reason.

    ## Tested end to end

    On Kestra 2.0.3 OSS, in this order.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2026-08 `CLEAN` | 180 assets, 8,054 schedule rows. Depreciation 67,517.79. One disposal (FA-0019, fully depreciated, sold for 300: gain 300.00). NBV 3,401,867.58. 68 assets fully depreciated and still in use. Closed |
    | 2 | 2026-09 `BACKDATED` | Forklift placed in service on 2026-08-11 and registered late: late addition 32,000.00, catch-up 240.00. Stops for approval |
    | 3 | same, `approved_by` | Closed. Two disposals with losses, including FA-0063 scrapped at 0. Machinery: 2,151,300 + 86,000 + 32,000 - 73,897 = 2,195,403 |
    | 4 | 2026-09 again | Refused: already closed |
    | 5 | 2026-11 | Refused: 2026-10 must be closed first |
    | 6 | 2026-10 `BACKDATED` | Closed. FA-0101 disposed on the 5th, so no October depreciation for it. FA-0183, in service on 2026-09-22, starts in October |
    | 7 | 2026-08 `ISSUES`, first close | Blocked by four items: FA-0186 disposed before it was in service; account 1510 differs by 2,350.00 between ledger and register; Vehicles roll-forward off by 30,000.00 because of FA-0186; FA-0004 salvage above cost |

    I recomputed every one of the 8,054 schedule rows independently in Python with `Decimal`, and all of them matched to the cent.

    ## Problems found while testing

    - **Off by one cent on declining balance.** The independent recomputation first disagreed on 2 vehicles out of 180. DuckDB returns a double for `DECIMAL / INT`, and a value of 604.845 was rounded down. Every division now goes through an exact half-up macro in integer cents, and the result is 0 differences.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `period` | `2026-08` | `YYYY-MM`, validated |
    | `scenario` | `CLEAN` | Demo only: `CLEAN`, `ISSUES` or `BACKDATED` |
    | `approved_by` | empty | Needed for late additions or catch-up depreciation |

    ## Use it with your data

    - Replace `register` with your asset register export: id, category, in-service date, cost, optional salvage override, disposal date and proceeds.
    - Replace `gl_before` with your trial balance for the asset accounts.
    - Edit `categories` to match your policy and chart of accounts. Use one row per tax book to run a tax book next to the GAAP book.

    ## Things to know

    - Impairments, revaluations, partial disposals and asset transfers between categories are not modelled. Post them to the register before the run.
    - Units-of-production depreciation needs a usage table: add a third method next to `SL` and `DDB`.
    - Reopening a period is deliberate: delete the KV key `fixed_asset_close`.

