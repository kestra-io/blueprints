id: influxdb-missing-downsample-rollup-rebuild-guard
namespace: company.team
description: Rebuild missing hourly InfluxDB rollups from retained raw samples after approval and verify every repaired window.
concurrency:
  limit: 1
  behavior: QUEUE
inputs:
- id: influxdb_url
  type: STRING
  defaults: "{{ secret('INFLUXDB_URL') }}"
- id: influxdb_org
  type: STRING
  defaults: "{{ secret('INFLUXDB_ORG') }}"
- id: influxdb_token
  type: SECRET
  defaults: "{{ secret('INFLUXDB_TOKEN') }}"
- id: raw_bucket
  type: STRING
  defaults: raw
  validator: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
- id: rollup_bucket
  type: STRING
  defaults: rollup
  validator: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
- id: measurement
  type: STRING
  defaults: cpu
  validator: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
- id: raw_field
  type: STRING
  defaults: usage
  validator: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
- id: rollup_measurement
  type: STRING
  defaults: cpu_hourly
  validator: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
- id: host
  type: STRING
  defaults: server-a
  validator: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
- id: lookback_hours
  type: INT
  defaults: 48
  min: 1
  max: 168
  description: Number of complete hourly windows to inspect, entirely inside raw retention with one hour of margin.
- id: settling_hours
  type: INT
  defaults: 2
  min: 1
  max: 24
  description: Hours excluded before the current UTC hour for normal downsampling and late arrivals.
- id: dry_run
  type: BOOL
  defaults: true
- id: auto_remediate
  type: BOOL
  defaults: false
- id: slack_webhook_url
  type: STRING
  defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
variables:
  bounds_flux: |
    import "array"
    import "date"

    raw = buckets() |> filter(fn:(r)=>r.name == {{ inputs.raw_bucket | toJson }}) |> findRecord(fn:(key)=>true, idx:0)
    target = buckets() |> filter(fn:(r)=>r.name == {{ inputs.rollup_bucket | toJson }}) |> findRecord(fn:(key)=>true, idx:0)
    stop = date.sub(d:duration(v:{{ inputs.settling_hours }} * 3600000000000), from:date.truncate(t:now(), unit:1h))
    start = date.sub(d:duration(v:{{ inputs.lookback_hours }} * 3600000000000), from:stop)
    array.from(rows:[{start_s:string(v:int(v:start) / 1000000000), stop_s:string(v:int(v:stop) / 1000000000), raw_id:raw.id, target_id:target.id}])
  snapshot_flux: |
    import "array"
    import "math"

    s = time(v: {{ outputs.bounds.row.start_s }}000000000)
    e = time(v: {{ outputs.bounds.row.stop_s }}000000000)
    rawBucket = {{ inputs.raw_bucket | toJson }}
    targetBucket = {{ inputs.rollup_bucket | toJson }}
    rawMeta = buckets() |> filter(fn:(r)=>r.name == rawBucket) |> findRecord(fn:(key)=>true, idx:0)
    targetMeta = buckets() |> filter(fn:(r)=>r.name == targetBucket) |> findRecord(fn:(key)=>true, idx:0)
    safe = rawMeta.id == "{{ outputs.bounds.row.raw_id }}" and targetMeta.id == "{{ outputs.bounds.row.target_id }}" and
      (rawMeta.retentionPeriod == 0 or int(v:s) > int(v:now()) - rawMeta.retentionPeriod + 3600000000000) and
      (targetMeta.retentionPeriod == 0 or int(v:s) > int(v:now()) - targetMeta.retentionPeriod + 3600000000000)
    checkedStart = if safe then s else die(msg:"Bucket identity changed or scan touches retention cutoff; do not rebuild partial raw windows")

    rawPoints = from(bucket:rawBucket) |> range(start:checkedStart, stop:e)
      |> filter(fn:(r)=>r._measurement == {{ inputs.measurement | toJson }} and r._field == {{ inputs.raw_field | toJson }} and r.host == {{ inputs.host | toJson }})
    targetPoints = from(bucket:targetBucket) |> range(start:checkedStart, stop:e)
      |> filter(fn:(r)=>r._measurement == {{ inputs.rollup_measurement | toJson }} and r.host == {{ inputs.host | toJson }})
      |> filter(fn:(r)=>r._field == "mean" or r._field == "samples")
    badRaw = rawPoints |> keys() |> filter(fn:(r)=>not contains(value:r._value, set:["_start","_stop","_measurement","_field","host"])) |> group() |> findColumn(fn:(key)=>true, column:"_value")
    badTarget = targetPoints |> keys() |> filter(fn:(r)=>not contains(value:r._value, set:["_start","_stop","_measurement","_field","host"])) |> group() |> findColumn(fn:(key)=>true, column:"_value")
    rawCount = rawPoints |> group() |> limit(n:10001) |> count() |> findColumn(fn:(key)=>true, column:"_value")
    schemaOK = length(arr:badRaw) == 0 and length(arr:badTarget) == 0 and (length(arr:rawCount) == 0 or rawCount[0] <= 10000)
    raw = rawPoints |> filter(fn:(r)=>if schemaOK then true else die(msg:"Unexpected series tags or more than 10000 raw samples"))
      |> window(every:1h) |> sort(columns:["_time"])
      |> reduce(identity:{n:0,total:0.0,signature:""}, fn:(r,accumulator)=>({
        n:accumulator.n + 1, total:accumulator.total + float(v:r._value),
        signature:accumulator.signature + string(v:int(v:r._time)) + ":" + string(v:r._value) + ";"
      }))
      |> map(fn:(r)=>({window_s:string(v:int(v:r._start) / 1000000000), n:r.n, total:r.total, signature:r.signature}))
      |> group()
    seed = raw |> map(fn:(r)=>({window_s:r.window_s, mean_value:0.0, samples_value:0.0, mean_seen:0, samples_seen:0, bad_time:0}))
    actual = targetPoints |> map(fn:(r)=>({
        window_s:string(v:(int(v:r._time) / 3600000000000) * 3600),
        mean_value:if r._field == "mean" then float(v:r._value) else 0.0,
        samples_value:if r._field == "samples" then float(v:r._value) else 0.0,
        mean_seen:if r._field == "mean" then 1 else 0,
        samples_seen:if r._field == "samples" then 1 else 0,
        bad_time:if int(v:r._time) % 3600000000000 == 0 then 0 else 1
      })) |> group()
    roll = union(tables:[seed,actual]) |> group(columns:["window_s"])
      |> reduce(identity:{mean_value:0.0,samples_value:0.0,mean_seen:0,samples_seen:0,bad_time:0}, fn:(r,accumulator)=>({
        mean_value:accumulator.mean_value + r.mean_value, samples_value:accumulator.samples_value + r.samples_value,
        mean_seen:accumulator.mean_seen + r.mean_seen, samples_seen:accumulator.samples_seen + r.samples_seen,
        bad_time:accumulator.bad_time + r.bad_time
      })) |> group()
    join(tables:{raw:raw,roll:roll}, on:["window_s"])
      |> map(fn:(r)=>{
        expected = r.total / float(v:r.n)
        complete = r.mean_seen == 1 and r.samples_seen == 1 and r.samples_value == float(v:r.n) and math.abs(x:r.mean_value - expected) <= 0.000000001 * (1.0 + math.abs(x:expected))
        conflict = r.bad_time > 0 or r.mean_seen > 1 or r.samples_seen > 1 or r.samples_value > float(v:r.n) or r.samples_value < 0.0 or
          (r.mean_seen == 1 and r.samples_seen == 1 and r.samples_value == float(v:r.n) and not complete)
        return {window_s:r.window_s, raw_samples:r.n, mean:expected,
          repair:if conflict then die(msg:"Conflicting rollup timestamp, count or completed mean; manual investigation required") else not complete,
          signature:r.signature + "|" + string(v:r.mean_seen) + ":" + string(v:r.mean_value) + ":" + string(v:r.samples_seen) + ":" + string(v:r.samples_value),
          payload:{{ inputs.rollup_measurement | toJson }} + ",host=" + {{ inputs.host | toJson }} + " mean=" + string(v:expected) + ",samples=" + string(v:r.n) + "i " + r.window_s}
      }) |> sort(columns:["window_s"])
tasks:
- id: require_distinct_buckets
  type: io.kestra.plugin.core.execution.Fail
  condition: "{{ inputs.raw_bucket == inputs.rollup_bucket }}"
  errorMessage: Raw and rollup buckets must differ.
- id: bounds
  type: io.kestra.plugin.influxdb.FluxQuery
  connection:
    url: "{{ inputs.influxdb_url }}"
    token: "{{ inputs.influxdb_token }}"
    connectTimeout: PT5S
    readTimeout: PT20S
  org: "{{ inputs.influxdb_org }}"
  query: |-
    {{ render(vars.bounds_flux) }}
  fetchType: FETCH_ONE
  timeout: PT30S
- id: detect
  type: io.kestra.plugin.influxdb.FluxQuery
  connection:
    url: "{{ inputs.influxdb_url }}"
    token: "{{ inputs.influxdb_token }}"
    connectTimeout: PT5S
    readTimeout: PT20S
  org: "{{ inputs.influxdb_org }}"
  query: |
    {{ render(vars.snapshot_flux) }}
      |> filter(fn:(r)=>r.repair)
  fetchType: FETCH
  timeout: PT30S
- id: report
  type: io.kestra.plugin.core.log.Log
  message: "Host {{ inputs.host }}, raw bucket {{ inputs.raw_bucket }}, rollup bucket {{ inputs.rollup_bucket }}: {{ outputs.detect.size }} missing\
    \ or short hourly windows. Plan: {{ outputs.detect.rows | jq('map({window_s,raw_samples,mean})') | first | toJson }}"
- id: gaps_found
  type: io.kestra.plugin.core.flow.If
  condition: "{{ outputs.detect.size > 0 }}"
  then:
  - id: repair_enabled
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
    then:
    - id: approval
      type: io.kestra.plugin.core.flow.Pause
      pauseDuration: PT20M
      onResume:
      - id: approved
        type: BOOL
        defaults: false
        description: Approve this exact host and the listed hourly windows.
      - id: writers_quiesced
        type: BOOL
        defaults: false
        description: The normal downsampler and raw late-arrival writers are stopped for this host until this execution finishes.
    - id: approved_repair
      type: io.kestra.plugin.core.flow.If
      condition: "{{ outputs.approval.onResume.approved ?? false }}"
      then:
      - id: require_exclusive_writers
        type: io.kestra.plugin.core.execution.Fail
        condition: "{{ not (outputs.approval.onResume.writers_quiesced ?? false) }}"
        errorMessage: Quiesce the downsampler and late arrivals before approving a repair. InfluxDB has no point compare-and-set.
      - id: repair_oldest_first
        type: io.kestra.plugin.core.flow.Loop
        values: "{{ outputs.detect.rows }}"
        concurrencyLimit: 1
        tasks:
        - id: recheck_window
          type: io.kestra.plugin.influxdb.FluxQuery
          connection:
            url: "{{ inputs.influxdb_url }}"
            token: "{{ inputs.influxdb_token }}"
            connectTimeout: PT5S
            readTimeout: PT20S
          org: "{{ inputs.influxdb_org }}"
          query: |
            {{ render(vars.snapshot_flux) }}
              |> filter(fn:(r)=>r.window_s == "{{ fromJson(item.value).window_s }}")
          fetchType: FETCH_ONE
          timeout: PT30S
        - id: reject_stale_window
          type: io.kestra.plugin.core.execution.Fail
          condition: "{{ outputs.recheck_window.size != 1 or not outputs.recheck_window.row.repair or outputs.recheck_window.row.signature !=\
            \ fromJson(item.value).signature }}"
          errorMessage: Raw samples or rollup changed after approval. No write for this window; investigate and run again.
        - id: write_rollup
          type: io.kestra.plugin.influxdb.Write
          connection:
            url: "{{ inputs.influxdb_url }}"
            token: "{{ inputs.influxdb_token }}"
            connectTimeout: PT5S
            readTimeout: PT20S
          org: "{{ inputs.influxdb_org }}"
          bucket: "{{ outputs.bounds.row.target_id }}"
          precision: S
          source: "{{ outputs.recheck_window.row.payload }}"
          timeout: PT30S
        - id: read_written_window
          type: io.kestra.plugin.influxdb.FluxQuery
          connection:
            url: "{{ inputs.influxdb_url }}"
            token: "{{ inputs.influxdb_token }}"
            connectTimeout: PT5S
            readTimeout: PT20S
          org: "{{ inputs.influxdb_org }}"
          query: |
            {{ render(vars.snapshot_flux) }}
              |> filter(fn:(r)=>r.window_s == "{{ fromJson(item.value).window_s }}")
          fetchType: FETCH_ONE
          timeout: PT30S
        - id: require_window_recovered
          type: io.kestra.plugin.core.execution.Fail
          condition: "{{ outputs.read_written_window.size != 1 or outputs.read_written_window.row.repair }}"
          errorMessage: Rollup window still missing or short after Write. Completed windows are preserved for the next run.
      - id: verify_all_windows
        type: io.kestra.plugin.influxdb.FluxQuery
        connection:
          url: "{{ inputs.influxdb_url }}"
          token: "{{ inputs.influxdb_token }}"
          connectTimeout: PT5S
          readTimeout: PT20S
        org: "{{ inputs.influxdb_org }}"
        query: |
          {{ render(vars.snapshot_flux) }}
            |> filter(fn:(r)=>r.repair)
        fetchType: FETCH
        timeout: PT30S
      - id: require_continuity
        type: io.kestra.plugin.core.execution.Fail
        condition: "{{ outputs.verify_all_windows.size > 0 }}"
        errorMessage: Raw-backed hourly windows still lack complete rollups. Inspect the remaining gaps and run again.
      else:
      - id: approval_declined
        type: io.kestra.plugin.core.log.Log
        message: Repair declined. Rollup gaps remain unchanged.
    else:
    - id: report_only
      type: io.kestra.plugin.core.log.Log
      message: "Read only: {{ outputs.detect.size }} raw-backed hourly windows need repair. dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate\
        \ }}."
  else:
  - id: continuous
    type: io.kestra.plugin.core.log.Log
    message: Every settled raw-backed window has its expected mean and sample count.
errors:
- id: alert_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: "{{ inputs.slack_webhook_url }}"
  payload: "{{ {'text': 'InfluxDB rollup recovery failed for host ' ~ inputs.host ~ '. Inspect retained raw data and remaining gaps before retention\
    \ expires it. Execution ' ~ execution.id} | toJson }}"
  timeout: PT15S
triggers:
- id: hourly
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 15 * * * *
  disabled: true
  inputs:
    auto_remediate: false
    dry_run: true

extend:
  title: Rebuild missing InfluxDB hourly rollups before raw expiry
  shortDescription: Approve missing or short hourly rollups, rebuild their means and sample counts from retained raw data and verify continuity.
  metaTitle: InfluxDB missing hourly rollup recovery with Kestra
  metaDescription: Find missing InfluxDB hourly rollups, approve oldest-first repairs from retained raw data and verify means and sample counts
    after each write.
  tags:
    - Data
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  verified: false
  demo: false
  description: |
    ## Safety

    A failed hourly downsampler can leave a dashboard gap that becomes permanent once raw retention expires. Recomputing from an already truncated source would replace that gap with a misleading aggregate. This flow repairs only settled windows whose entire scan interval remains inside retention, using the existing rollup convention: one `host` tag, numeric `mean` and integer `samples` fields at the UTC window start.

    | Guard | What it stops |
    | --- | --- |
    | Exact host, measurement and field; restricted names; distinct buckets | Writes to unrelated series or the raw bucket |
    | Bucket ids and retention rechecked; Write uses the approved bucket ID | Repairing a recreated bucket or aggregating a window that may have expired |
    | One hour of retention margin and configurable settling delay | Using retention-edge data or racing a normal recent aggregation |
    | At most 168 hourly windows and 10,000 selected raw samples | An unbounded historical rebuild |
    | Unexpected tags, off-hour target points and conflicting completed aggregates fail | Merging different series or overwriting unexplained rollups |
    | Both mode switches, approval and confirmation that writers are stopped | An unattended repair without acknowledged writer quiescence |
    | Exact raw sample and target-field snapshot rechecked per window | Applying an approval after source values or rollups changed |
    | Point read after each write and final gap query | Reporting success while a selected rollup remains incomplete |

    InfluxDB has no conditional point write. Stop the normal downsampler and late-arrival writes for this host before approving, then keep them stopped until the execution terminates. The flow queues its own executions; it does not lock another flow, administrator or InfluxDB task. A recheck narrows the race but cannot replace that operating procedure.

    ## How it works

    1. `bounds` (`io.kestra.plugin.influxdb.FluxQuery`) fixes UTC hourly bounds and records both bucket identities. `detect` runs the aggregation and comparison in InfluxDB, returning missing or short windows in oldest-first order. A completed rollup must match both the source count and mean; a zero mean is valid.
    2. `report` lists each gap with its window timestamp, sample count and proposed mean. Default executions report and finish without changing data. The disabled `Schedule` forces these safe inputs.
    3. `approval` (`io.kestra.plugin.core.flow.Pause`) waits up to 20 minutes. `approved_repair` requires `onResume.approved ?? false` and `writers_quiesced: true`.
    4. `repair_oldest_first` (`io.kestra.plugin.core.flow.Loop`, concurrency limit 1) runs `recheck_window` immediately before `write_rollup` (`io.kestra.plugin.influxdb.Write`). It compares every raw timestamp/value plus the two target fields with the approved snapshot. Writes use the captured bucket ID, reuse the window timestamp and update only `mean` and `samples`.
    5. `read_written_window` checks the repaired point. `verify_all_windows` repeats the full gap query and `require_continuity` fails if any raw-backed window is incomplete. `alert_failure` posts to Slack on a failure, including permission refusal and stale approval.

    ## What you get

    - Repaired hourly means and sample counts before their raw source expires.
    - Oldest gaps first, with a record of the approved windows and each write.
    - Retry from actual bucket state: completed windows are skipped and unrelated point fields survive.

    ## Who it's for

    Data platform operators maintaining an InfluxDB 2.x hourly mean/count rollup with shorter raw retention.

    ## Why orchestrate this with Kestra

    InfluxDB can aggregate and backfill its own data. Kestra coordinates the incident response: bounded discovery, human approval, stale-plan refusal, ordered plugin writes and a failed execution with an alert if recovery cannot be proved.

    ## Tested end to end

    Kestra 2.0.6, bundled InfluxDB plugin 1.5.7 and InfluxDB OSS 2.7.12. Validation returned no constraints, warnings, infos or deprecations. Independent `influx query --raw` reads bracketed the saved execution cases. The fixture used 72-hour raw retention and 30-day rollup retention, with two missing windows and one short rollup.

    Approved repair changed incomplete windows from **3 to 0**, complete windows from **2 to 5** and represented raw samples from **7 to 15**. All **23 raw points** were conserved. Other hosts, similarly named measurements, a legitimate zero mean, rollup annotations and windows at or after the settling cutoff were preserved. Interruption after the first write left two gaps; the next execution repaired those two. The fresh fixture repeated healthy, repair and stale-approval cases with read permissions on both buckets and write permission only on the rollup bucket. Slack used an HTTP test sink. Bucket recreation and a stopped server during approval failed before Write; the concurrent second execution queued. All 24 invalid identifier requests (quotes, Unicode, spaces and 65-character names across six inputs) were rejected before execution. Target-tag, negative/excess count, mean-tolerance and 168-window boundary cases also passed.

    | Case | Execution | Result |
    | --- | --- | --- |
    | Healthy, including a zero mean | `7l382QyB7w6vQpzMIKJMG7` | SUCCESS |
    | Missing and short, dry run | `3YDLnANNYeW9C7bMXJw5Eq` | SUCCESS |
    | Declined approval | `6iO0kyBuyuCAsT9XvCHoKB` | SUCCESS |
    | Approved repair | `6w3WQwluNlXoxlrkmH4Jdy` | SUCCESS: 3 incomplete windows to 0 |
    | Repeat | `2ClBBintYrDpVj0ypD94o8` | SUCCESS |
    | Write refused with HTTP 403 | `7kpldok0uwHsigUr6NEtZk` | FAILED as intended, no rollup write |
    | Raw value changed during approval | `44SMa1VySuzfKZrKB7bMvl` | FAILED as intended, no rollup write |
    | Killed after first write | `6vGBX8eAA89zPW3yKtW2XA` | KILLED: first write retained |
    | Reconcile interrupted repair | `2pxMLbi89yMLH76KiiU3cP` | SUCCESS: 2 incomplete windows to 0 |
    | Retention shortened during approval | `7Jd2HpEHGzpJCgvDfOcRL9` | FAILED as intended, no rollup write |
    | Additional raw tag dimension | `1kurF4nmghAvwlz8j52zOl` | FAILED as intended, no rollup write |
    | Conflicting completed mean | `6lPC4VQGMjt2RAdxeLuG9b` | FAILED as intended, no rollup write |
    | Off-hour rollup timestamp | `6SDbKBVFMgHrSl8XPtARyO` | FAILED as intended, no rollup write |
    | Writers not confirmed stopped | `1egjF7xCZmMm4dTpcbMH8s` | FAILED as intended, no rollup write |
    | auto_remediate true, dry_run true | `33JfD0rYowf5HRv2dd2YQg` | SUCCESS |
    | auto_remediate false, dry_run false | `Jq4Gc9uebjYhAQRXVlqPZ` | SUCCESS |
    | No matching raw series | `3LaqeYa4pHcHyPMumxPCcx` | SUCCESS |
    | Already completed window preserved | `7IqmLAzjwWOsib1r1oCfMH` | SUCCESS |
    | Exactly 10,000 selected raw samples | `4jyuBRSKwWnEd4jxDUNZdL` | SUCCESS |
    | 10,001 selected raw samples | `6X3XOnZ7hXbA9cwPzkStsn` | FAILED as intended, no rollup write |
    | Raw and rollup bucket identical | `13Fi7otqd5pkYqTP5tRcBh` | FAILED as intended, no rollup write |
    | Bucket recreated during approval | `3GV7nSBwDUkdHR2dNWONFe` | FAILED as intended, no rollup write |
    | Second execution queued | `1gr48XL1FDNx38mkfUBgjR` | SUCCESS |
    | Rollup count exceeds source | `58pPcDIYTlMegqlyWrkWIQ` | FAILED as intended, no rollup write |
    | 168 selected hourly windows | `66rxV6omHU17e6fwrapvzu` | SUCCESS |
    | Mean just inside tolerance | `2cPYuMjEDBeDvaBAlEVE6P` | SUCCESS |
    | Mean just outside tolerance | `3sBka44O6nUTypDk2XdhkC` | FAILED as intended, no rollup write |
    | Negative rollup count | `1ZhPb9aFzRxD7RdYmMZLI3` | FAILED as intended, no rollup write |
    | Server stopped during approval | `6oIt1pwOOvjDYiBBo5Rm7` | FAILED as intended, no rollup write |
    | Unavailable endpoint | `2Xb8ehncaRa3OGPOYEM4vc` | FAILED as intended, no rollup write |
    | Additional target tag dimension | `7SBCMRgj6nshTfhLEYR6cY` | FAILED as intended, no rollup write |
    | Fresh fixture: healthy, including a zero mean | `qbafmQbLMi80gwruAwB4v` | SUCCESS as expected |
    | Fresh fixture: approved repair | `76p41FznQIhftMhter4VjK` | SUCCESS as expected |
    | Fresh fixture: raw value changed during approval | `AqTzOJzD6ax1O9ghNc2nb` | FAILED as expected |

    ## Prerequisites

    - Kestra 2.0.6 with the InfluxDB plugin and InfluxDB 2.x with Flux. Only OSS 2.7.12 was exercised.
    - A raw numeric field with exactly the `host` tag and a rollup measurement using the convention above. Extra rollup fields are preserved. This flow does not adapt an arbitrary downsampling schema.
    - Token permissions: read both named buckets, including bucket metadata; write the rollup bucket only. No raw write, delete, task-management or operator token is required.
    - Permission to stop the regular downsampler and late arrivals for the selected host while an approved repair runs.

    ### Secrets

    - `INFLUXDB_URL`, `INFLUXDB_ORG`, `INFLUXDB_TOKEN`: server URL, organization and scoped token. The token input has type `SECRET`.
    - `SLACK_WEBHOOK_URL`: failure notification destination.

    ### Inputs

    | Input | Default | Purpose |
    | --- | --- | --- |
    | `influxdb_url`, `influxdb_org`, `influxdb_token` | Corresponding secrets | Connection and scoped credentials |
    | `raw_bucket`, `rollup_bucket` | `raw`, `rollup` | Distinct source and destination buckets |
    | `measurement`, `raw_field` | `cpu`, `usage` | Exact raw measurement and numeric field |
    | `rollup_measurement`, `host` | `cpu_hourly`, `server-a` | Exact rollup measurement and host |
    | `lookback_hours` | `48` | 1 to 168 settled hourly windows |
    | `settling_hours` | `2` | 1 to 24 hours excluded before the current UTC hour |
    | `dry_run`, `auto_remediate` | `true`, `false` | Writes require false and true respectively |
    | `slack_webhook_url` | `SLACK_WEBHOOK_URL` secret | Failure alert endpoint |

    Names start with an ASCII letter and contain at most 64 letters, digits, underscores, dots or hyphens. Choose the lookback and settling delay comfortably inside both retention periods, allowing the extra hour of margin. For example, the defaults fit the tested 72-hour raw bucket. Queries have a 20-second read timeout and tasks a 30-second timeout; writes have no automatic retry.

    ## Quick start

    1. Confirm that the downsampler writes a mean and sample count at each hourly window start. Add the four secrets and grant the bucket permissions above.
    2. Set the exact buckets, measurement, field and host. Run with the defaults and inspect `report`. Compare a proposed window with a direct Flux query before enabling repair.
    3. Stop the downsampler and late arrivals for this host. Execute with `auto_remediate: true` and `dry_run: false`.
    4. Review the proposed windows at the Pause. Resume with `approved: true` and `writers_quiesced: true`. A declined approval preserves the gaps.
    5. Confirm success and read the repaired points independently. Restore normal writers. After a failed or interrupted run, inspect retained data and run again; already complete windows are spared.
    6. Enable the hourly Schedule for reporting after manual validation. It always forces safe mode.

    ## How to extend

    - Add a threshold path with `io.kestra.plugin.influxdb.FluxTrigger` polling an independently configured gap query. Configure connection, organization and query at trigger level; polling triggers have no execution inputs. Keep the flow's discovery and approval rechecks. This path was schema-checked but not executed.
    - Support another aggregate only by changing detection, payload and verification together, then testing the exact convention used by the regular downsampler.

    Limits: recovery covers windows still represented in retained raw data. It cannot identify a completely expired or entirely absent raw window, prove that upstream ingestion was complete or recreate the full dashboard. It assumes writers remain quiescent during repair. Mean comparisons use a relative tolerance of `1e-9 * (1 + abs(expected))`. InfluxDB 3, multiple tag dimensions, other window sizes and the polling-trigger extension were not tested. Snapshot values appear in execution outputs; restrict access to execution history.

