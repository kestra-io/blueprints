id: domain-expiry-renewal-guard
namespace: company.team
description: |
  Sweep the registration expiry dates of every domain in your portfolio with whois, score days remaining against warn and critical thresholds, and escalate anything close to lapsed as a GitHub renewal issue plus a Slack alert.

triggers:
  - id: weekly_expiry_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly Monday sweep over the whole domain list. Shipped disabled, flip it to false once the thresholds and the target repository look right.
    cron: "0 6 * * 1"
    disabled: true

inputs:
  - id: domains
    type: STRING
    displayName: Domains to check
    description: Comma separated list of domain registrations that whois should look up.
    defaults: example.com,example.org
  - id: warn_days
    type: INT
    displayName: Warn threshold in days
    description: Any domain expiring sooner than this many days lands in the warn bucket.
    defaults: 90
  - id: critical_days
    type: INT
    displayName: Critical threshold in days
    description: Any domain expiring sooner than this many days lands in the critical bucket.
    defaults: 30

tasks:
  # --- 1. collect the raw whois text ---
  - id: lookup_registrations
    type: io.kestra.plugin.scripts.shell.Commands
    description: Install the whois client in an Alpine container and print one marker delimited block per domain so every registration is captured as raw text.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: alpine:3.20
    commands:
      - apk add --no-cache whois >/dev/null
      - |
        set -e
        for domain in $(echo "{{ inputs.domains }}" | tr ',' ' '); do
          echo "### DOMAIN ${domain}"
          if ! whois "${domain}"; then
            echo "whois lookup did not complete for ${domain}"
          fi
          echo ""
        done

  # --- 2. score every domain ---
  - id: assess_expiry
    type: io.kestra.plugin.scripts.python.Script
    description: Pull the expiry date out of each whois block, compute days remaining, map every domain to critical, warn, ok, or unknown, and emit the verdict payload.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      DOMAINS: "{{ inputs.domains }}"
      WHOIS_RAW: "{{ outputs.lookup_registrations.stdOut }}"
      WARN_DAYS: "{{ inputs.warn_days }}"
      CRITICAL_DAYS: "{{ inputs.critical_days }}"
      TODAY: "{{ now() | date('yyyy-MM-dd') }}"
    script: |
      import json
      import os
      import re
      from datetime import date

      EXPIRY_HINTS = ("expir", "paid-till", "paid till", "renewal date", "renews on")
      MARKER = "### DOMAIN "
      MONTHS = {"jan": 1, "feb": 2, "mar": 3, "apr": 4, "may": 5, "jun": 6,
                "jul": 7, "aug": 8, "sep": 9, "oct": 10, "nov": 11, "dec": 12}


      def env_int(name, default):
          raw = os.environ.get(name, "")
          try:
              return int(str(raw).strip())
          except (TypeError, ValueError):
              return default


      def parse_date(value):
          text = str(value or "").strip()
          if not text:
              return None
          match = re.search(r"(\d{4})[-./](\d{1,2})[-./](\d{1,2})", text)
          if match:
              try:
                  return date(int(match.group(1)), int(match.group(2)), int(match.group(3)))
              except ValueError:
                  return None
          match = re.search(r"(\d{1,2})[-\s]([A-Za-z]{3})[a-z]*[-\s]+(\d{4})", text)
          if match:
              month = MONTHS.get(match.group(2).lower())
              if month:
                  try:
                      return date(int(match.group(3)), month, int(match.group(1)))
                  except ValueError:
                      return None
          match = re.search(r"([A-Za-z]{3})[a-z]*\s+(\d{1,2}),?\s+(\d{4})", text)
          if match:
              month = MONTHS.get(match.group(1).lower())
              if month:
                  try:
                      return date(int(match.group(3)), month, int(match.group(2)))
                  except ValueError:
                      return None
          return None


      def extract_expiry(text):
          for line in text.splitlines():
              stripped = line.strip()
              if not stripped or stripped.startswith("%") or stripped.startswith(">>>"):
                  continue
              if ":" not in stripped:
                  continue
              key, _, value = stripped.partition(":")
              key_norm = " ".join(key.lower().split())
              if not any(hint in key_norm for hint in EXPIRY_HINTS):
                  continue
              found = parse_date(value)
              if found:
                  return found
          return None


      def split_sections(raw):
          sections = {}
          current = None
          for line in str(raw or "").splitlines():
              if line.startswith(MARKER):
                  current = line[len(MARKER):].strip().lower()
                  sections.setdefault(current, "")
              elif current:
                  sections[current] += line + "\n"
          return sections


      sections = split_sections(os.environ.get("WHOIS_RAW", ""))
      critical_after = env_int("CRITICAL_DAYS", 30)
      warn_after = env_int("WARN_DAYS", 90)
      today = parse_date(os.environ.get("TODAY", "")) or date.today()

      names = []
      for part in str(os.environ.get("DOMAINS", "")).split(","):
          name = part.strip().lower().rstrip(".")
          if name and name not in names:
              names.append(name)

      records = []
      for name in names:
          expiry = extract_expiry(sections.get(name, ""))
          if expiry is None:
              records.append({
                  "domain": name,
                  "days_remaining": None,
                  "expiry_date": "",
                  "severity": "unknown",
                  "detail": "no expiry date found in the whois text",
              })
              continue
          days = (expiry - today).days
          if days < critical_after:
              severity = "critical"
          elif days < warn_after:
              severity = "warn"
          else:
              severity = "ok"
          records.append({
              "domain": name,
              "days_remaining": days,
              "expiry_date": expiry.isoformat(),
              "severity": severity,
              "detail": "",
          })

      criticals = sorted([r for r in records if r["severity"] == "critical"],
                         key=lambda r: r["days_remaining"])
      warns = sorted([r for r in records if r["severity"] == "warn"],
                     key=lambda r: r["days_remaining"])
      unknowns = [r for r in records if r["severity"] == "unknown"]
      oks = sorted([r for r in records if r["severity"] == "ok"],
                   key=lambda r: r["days_remaining"])

      if criticals:
          verdict = "critical"
      elif warns or unknowns:
          verdict = "warn"
      else:
          verdict = "ok"

      dated = [r for r in records if r["days_remaining"] is not None]
      if dated:
          nearest = min(dated, key=lambda r: r["days_remaining"])
          nearest_expiry = {
              "domain": nearest["domain"],
              "days_remaining": nearest["days_remaining"],
              "expiry_date": nearest["expiry_date"],
          }
      else:
          nearest_expiry = {"domain": "", "days_remaining": None, "expiry_date": ""}

      rank = {"critical": 0, "warn": 1, "unknown": 2, "ok": 3}
      ranked = sorted(
          records,
          key=lambda r: (
              rank.get(r["severity"], 4),
              r["days_remaining"] is None,
              r["days_remaining"] if r["days_remaining"] is not None else 0,
              r["domain"],
          ),
      )

      urgency_lines = []
      for rec in ranked:
          if rec["days_remaining"] is None:
              urgency_lines.append(rec["domain"] + ": no expiry date parsed (" + rec["severity"] + ")")
          else:
              urgency_lines.append(
                  rec["domain"] + ": " + str(rec["days_remaining"]) + " days left, expires "
                  + rec["expiry_date"] + " (" + rec["severity"] + ")"
              )

      summary = (
          str(len(criticals)) + " critical, " + str(len(warns)) + " warn, "
          + str(len(unknowns)) + " unknown, " + str(len(oks)) + " ok of "
          + str(len(records)) + " domains"
      )
      if nearest_expiry["domain"]:
          summary += (
              ", nearest expiry " + nearest_expiry["domain"] + " in "
              + str(nearest_expiry["days_remaining"]) + " days on " + nearest_expiry["expiry_date"]
          )
      summary = summary.replace('"', "'").replace("\n", " ")

      payload = {"outputs": {
          "verdict": verdict,
          "checked": len(records),
          "critical_count": len(criticals),
          "warn_count": len(warns),
          "unknown_count": len(unknowns),
          "ok_count": len(oks),
          "critical_domains": criticals,
          "warn_domains": warns,
          "unknown_domains": unknowns,
          "ok_domains": oks,
          "nearest_expiry": nearest_expiry,
          "urgency_table": "\n".join(urgency_lines),
          "urgency_inline": " | ".join(urgency_lines),
          "summary": summary,
      }}
      print("verdict=" + verdict + " checked=" + str(len(records))
            + " critical=" + str(len(criticals)) + " warn=" + str(len(warns))
            + " unknown=" + str(len(unknowns)))
      print("::" + json.dumps(payload) + "::")

  # --- 3. escalate or stay quiet ---
  - id: route_verdict
    type: io.kestra.plugin.core.flow.If
    description: Branch on the verdict so critical and warn domains open a renewal ticket and alert Slack while a clean sweep only records itself.
    condition: "{{ outputs.assess_expiry.vars.verdict != 'ok' }}"
    then:
      - id: open_renewal_issue
        type: io.kestra.plugin.github.issues.Create
        description: File a renewal ticket whose body lists every checked domain sorted by urgency, so the nearest expiry is the first line an owner reads.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: your-org/ops-backlog
        title: "Domain renewal queue - {{ outputs.assess_expiry.vars.critical_count }} critical, {{ outputs.assess_expiry.vars.warn_count }} warn, {{ outputs.assess_expiry.vars.unknown_count }} unknown"
        body: |
          ## Domain renewal queue

          {{ outputs.assess_expiry.vars.urgency_table }}

          {{ outputs.assess_expiry.vars.summary }}

          Thresholds, critical below {{ inputs.critical_days }} days and warn below {{ inputs.warn_days }} days, came from the flow inputs of execution {{ execution.id }}.
        labels:
          - domain-renewal
          - expiry

      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the verdict and the urgency order to the ops channel so nobody has to open the ticket to see which domain is closest.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Domain expiry sweep {{ outputs.assess_expiry.vars.verdict }} for {{ inputs.domains }}. {{ outputs.assess_expiry.vars.summary }}. Urgency order, {{ outputs.assess_expiry.vars.urgency_inline }}. A renewal issue is open in the backlog. Execution {{ execution.id }}."
          }

    else:
      - id: all_clear_note
        type: io.kestra.plugin.core.log.Log
        description: Record the green sweep in the execution history so there is dated proof the check ran.
        message: "Domain expiry sweep clear. {{ outputs.assess_expiry.vars.summary }}."

errors:
  - id: slack_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Report a failed sweep, because a container that never started looks exactly like a healthy portfolio until a domain lapses.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Domain expiry renewal guard FAILED in {{ flow.namespace }}.{{ flow.id }}, execution {{ execution.id }}. No verdict was produced, so registration expiry was NOT verified."
      }

outputs:
  - id: verdict
    type: STRING
    description: Overall severity of the sweep, one of critical, warn, ok.
    value: "{{ outputs.assess_expiry.vars.verdict }}"
  - id: critical_domains
    type: JSON
    description: Domains inside the critical window with days remaining and expiry date, nearest first.
    value: "{{ outputs.assess_expiry.vars.critical_domains | toJson }}"
  - id: warn_domains
    type: JSON
    description: Domains inside the warn window with days remaining and expiry date, nearest first.
    value: "{{ outputs.assess_expiry.vars.warn_domains | toJson }}"
  - id: nearest_expiry
    type: JSON
    description: The domain that expires soonest, with its days remaining and expiry date.
    value: "{{ outputs.assess_expiry.vars.nearest_expiry | toJson }}"

extend:
  title: Domain Registration Expiry and Renewal Guard
  metaTitle: Track Domain Registration Expiry and Renewal Deadlines with Kestra
  shortDescription: Run whois for every domain you own, score days remaining against warn and critical thresholds, and file a renewal issue plus a Slack alert before a registration lapses.
  metaDescription: Watch domain registration expiry with Kestra. Run whois per domain, score days left against 90 and 30 day thresholds, escalate renewals to GitHub and Slack.
  description: |
    Domain names lapse quietly. When a registration is not renewed the domain stops resolving, the registrar can resell it, and the cheapest fix becomes a brokerage or legal fight instead of a renewal fee. This flow runs a whois sweep over your domain list on a schedule, scores every registration against a warn and a critical day threshold, and turns anything close to expiry into a GitHub renewal ticket plus a Slack alert. It watches the registration date that the registry publishes over whois, which is a different asset from the validity window of a TLS certificate, so certificate monitoring stays a separate concern.

    ## How it works

    1. The `weekly_expiry_sweep` trigger (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * 1`, shipped with `disabled: true`) starts the sweep every Monday morning once you enable it.
    2. `lookup_registrations` (`io.kestra.plugin.scripts.shell.Commands` on the `io.kestra.plugin.scripts.runner.docker.Docker` runner, image `alpine:3.20`) installs the `whois` client and loops over the comma separated `domains` input, printing a `### DOMAIN <name>` marker followed by the raw whois text for each registration.
    3. `assess_expiry` (`io.kestra.plugin.scripts.python.Script`) receives that text together with `warn_days`, `critical_days`, and today's date through environment variables, pulls the expiry date out of each block, and computes days remaining per domain.
    4. Every domain lands in `critical`, `warn`, `ok`, or `unknown`, where `unknown` means the whois text carried no parseable expiry date, and the task emits the whole verdict through the `::json::` outputs protocol.
    5. `route_verdict` (`io.kestra.plugin.core.flow.If`) branches when the verdict is anything other than `ok`. Inside the branch, `open_renewal_issue` (`io.kestra.plugin.github.issues.Create`) files a ticket whose body lists every domain sorted by urgency, and `alert_slack` posts the same summary to Slack, while a clean sweep falls through to `all_clear_note` (`io.kestra.plugin.core.log.Log`).
    6. The `errors` handler reports any crash to Slack, so a container that never started is never mistaken for a healthy portfolio.

    ## What you get

    - Four flow outputs, `verdict`, `critical_domains`, `warn_domains`, and `nearest_expiry`, ready for a downstream flow to branch on.
    - Days remaining and the exact expiry date for every domain, with severity attached to each record.
    - A GitHub issue that lists the whole portfolio in urgency order, critical domains first and the nearest expiry at the top.
    - A Slack message carrying the same summary, so the channel sees the count and the closest deadline without opening the ticket.
    - An execution history that records every sweep, which turns "did anyone check the renewals this month" into an answerable question.
    - Thresholds as inputs, so a team that wants 60 and 14 days changes two numbers instead of editing a script.

    ## Who it's for

    - Teams that own a portfolio of brand, product, and campaign domains across one or more registrars.
    - Agencies responsible for client renewals who need the deadline visible in the same backlog as their other ops work.
    - Platform and DNS owners who want expiring registrations surfaced on a cadence instead of discovered during an outage.
    - Anyone who has already lost a domain to a missed renewal and wants the check to be automatic and auditable.

    ## Why orchestrate this with Kestra

    A whois client returns text and nothing else, so the usual answer is a cron job writing to a file that nobody reads until the domain is gone. Kestra gives that lookup a schedule, hermetic tooling through a container runner, thresholds as typed inputs, a branch that separates escalation from the all clear, and an execution record for every run. The escalation itself is declarative too, the GitHub issue and the Slack message come from the same file that defines the check, and the `errors` handler catches failures in the guard itself. Change the thresholds or the domain list in a pull request and the review history shows exactly when the policy moved.

    ## Prerequisites

    - A Kestra worker with Docker access, since the whois lookup runs inside the `alpine:3.20` container.
    - Outbound network access from that worker to the registry whois servers on TCP port 43.
    - A GitHub repository where the provided token is allowed to open issues.
    - A Slack incoming webhook for the alert and the failure notification.
    - Python 3 available on the worker for the assessment step, or switch it to a Docker task runner.

    ### Secrets

    - `GITHUB_TOKEN`: token passed to `jwtToken` for opening the renewal issue.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by the alert and the `errors` handler.

    ## Quick start

    1. Add the two secrets above to your Kestra namespace.
    2. Replace the `domains` input default with your own comma separated list and confirm `warn_days` and `critical_days`.
    3. Set `repository` on the `open_renewal_issue` task to the backlog where renewal tickets should land.
    4. Run the flow once by hand and read the `verdict`, `critical_domains`, and `nearest_expiry` outputs before trusting the branch.
    5. Enable the weekly sweep by flipping the trigger, for example:

    ```yaml
    triggers:
      - id: weekly_expiry_sweep
        type: io.kestra.plugin.core.trigger.Schedule
        cron: "0 6 * * 1"
        disabled: false
    ```

    ## How to extend

    - Grow the list by overriding the `domains` input per call, or read a maintained list from a KV store or a namespace file and feed it to the lookup step.
    - Retune `warn_days` and `critical_days` per portfolio, for example 60 and 14 for campaign domains that are bought and dropped often.
    - Add `io.kestra.plugin.core.execution.Fail` after `alert_slack` when a critical domain should turn the execution red for downstream gates.
    - Fan the alert out to email or a subflow by adding a task next to `alert_slack` in the same branch.
    - Pair this flow with a TLS certificate monitor, since certificate expiry and registration expiry are different dates and both take a domain down.

    ## Links

    - ICANN Lookup documentation: https://lookup.icann.org/en/lookup
    - GitHub plugin documentation: https://kestra.io/plugins/plugin-github
    - Slack plugin documentation: https://kestra.io/plugins/plugin-slack
  tags:
    - Infrastructure
    - System
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
