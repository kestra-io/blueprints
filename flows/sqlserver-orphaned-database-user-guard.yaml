id: sqlserver-orphaned-database-user-guard
namespace: company.team

description: |
  Find orphaned users in a SQL Server database by comparing sys.database_principals
  against sys.server_principals, alert Slack, then re-map each one with
  ALTER USER ... WITH LOGIN behind a safe-by-default gate plus an approval pause and
  re-read the catalog to confirm. A user is orphaned when its SID resolves to no
  server login, which is what a restore or an attach from another instance leaves
  behind. The flow only ever re-maps a user to a login of the same name. It refuses
  every other case, because re-mapping to the wrong login hands one identity's
  permissions to another with no error anywhere.

inputs:
  - id: url
    type: STRING
    displayName: JDBC URL
    description: Points at the database to check. The queries read the catalog of the connected database.
    defaults: "jdbc:sqlserver://localhost:1433;databaseName=app;encrypt=false"

  - id: user
    type: STRING
    displayName: SQL Server login
    defaults: sa

  - id: password
    type: STRING
    displayName: SQL Server password
    description: Defaults to the SQLSERVER_PASSWORD secret. Override only for local testing.
    defaults: "{{ secret('SQLSERVER_PASSWORD') }}"

  - id: max_remap
    type: INT
    displayName: Maximum users to re-map per run
    description: Ceiling on one run. More remappable users than this and the run refuses the whole batch instead of re-mapping part of it.
    defaults: 5

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Allow the ALTER USER ... WITH LOGIN statements to run.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for any re-map to run.
    defaults: true

variables:
  audit_sql: |
    WITH orphan AS (
      SELECT
        dp.principal_id,
        dp.name AS user_name,
        dp.type AS user_type,
        dp.type_desc AS user_type_desc,
        dp.sid AS user_sid
      FROM sys.database_principals dp
      WHERE dp.type IN ('S', 'U', 'G')
        AND dp.authentication_type = 1
        AND dp.principal_id > 4
        AND dp.is_fixed_role = 0
        AND dp.sid IS NOT NULL
        AND dp.name NOT LIKE '##%'
        AND NOT EXISTS (
          SELECT 1 FROM sys.server_principals sp WHERE sp.sid = dp.sid
        )
    ),
    candidate AS (
      SELECT
        o.principal_id,
        COUNT(*) AS candidate_count,
        MIN(sl.name COLLATE DATABASE_DEFAULT) AS candidate_login,
        MAX(CAST(sl.is_disabled AS INT)) AS candidate_disabled
      FROM orphan o
      JOIN sys.server_principals sl
        ON sl.name COLLATE DATABASE_DEFAULT = o.user_name
       AND sl.type COLLATE DATABASE_DEFAULT = o.user_type
       AND sl.sid IS NOT NULL
      GROUP BY o.principal_id
    ),
    claimed AS (
      SELECT o.principal_id, MIN(other.name) AS claimed_by
      FROM orphan o
      JOIN candidate c ON c.principal_id = o.principal_id AND c.candidate_count = 1
      JOIN sys.server_principals sl
        ON sl.name COLLATE DATABASE_DEFAULT = c.candidate_login COLLATE DATABASE_DEFAULT
      JOIN sys.database_principals other
        ON other.sid = sl.sid AND other.principal_id <> o.principal_id
      GROUP BY o.principal_id
    )
    SELECT
      o.user_name,
      o.user_type_desc,
      CONVERT(varchar(85), o.user_sid, 1) AS user_sid,
      ISNULL(c.candidate_count, 0) AS candidate_count,
      ISNULL(c.candidate_login, '') AS candidate_login,
      ISNULL(c.candidate_disabled, 0) AS candidate_disabled,
      ISNULL(k.claimed_by, '') AS claimed_by,
      CASE
        WHEN ISNULL(c.candidate_count, 0) = 0 THEN 'no_matching_login'
        WHEN c.candidate_count > 1 THEN 'ambiguous_login'
        WHEN k.claimed_by IS NOT NULL THEN 'login_claimed'
        ELSE 'remappable'
      END AS status,
      CASE
        WHEN ISNULL(c.candidate_count, 0) = 1 AND k.claimed_by IS NULL
        THEN 'ALTER USER ' + QUOTENAME(o.user_name) + ' WITH LOGIN = ' + QUOTENAME(c.candidate_login)
        ELSE ''
      END AS fix_sql
    FROM orphan o
    LEFT JOIN candidate c ON c.principal_id = o.principal_id
    LEFT JOIN claimed k ON k.principal_id = o.principal_id
    ORDER BY o.user_name

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.sqlserver.Query
    description: >-
      Read-only. Lists every orphaned user in the connected database and classifies each one.
      A user counts as orphaned when its type is a SQL, Windows user or Windows group principal,
      its authentication_type is INSTANCE (so it is meant to map to a server login), it is not
      one of the four built-in principals and its SID matches no row in sys.server_principals.
      Users with no login by design (WITHOUT LOGIN, certificate, asymmetric key, contained
      database) have a different authentication_type or type and never appear.
      The re-map statement is built in SQL with QUOTENAME, from a login whose name equals the
      user name exactly, never from a flow input.
    url: "{{ inputs.url }}"
    username: "{{ inputs.user }}"
    password: "{{ inputs.password }}"
    trustServerCertificate: true
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: plan
    type: io.kestra.plugin.core.output.OutputValues
    description: Split the findings into the users that have one unambiguous login of the same name and the users the flow refuses to touch.
    values:
      remap_sql: >-
        {{ outputs.audit.rows | jq('[.[] | select(.status == "remappable") | .fix_sql]') | first | toJson }}
      remap_users: >-
        {{ outputs.audit.rows | jq('[.[] | select(.status == "remappable") | .user_name]') | first | toJson }}
      remap_count: >-
        {{ outputs.audit.rows | jq('[.[] | select(.status == "remappable")] | length') | first }}
      refused_count: >-
        {{ outputs.audit.rows | jq('[.[] | select(.status != "remappable")] | length') | first }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      SQL Server orphaned user audit on {{ inputs.url }}: {{ outputs.audit.size }} orphaned user(s),
      {{ outputs.plan.values.remap_count }} remappable, {{ outputs.plan.values.refused_count }} refused.
      {{ outputs.audit.rows | jq('map("\(.user_name) [\(.status)] sid=\(.user_sid) login=\(if .candidate_login == "" then "none" else .candidate_login end)") | join("; ")') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'SQL Server ' ~ inputs.url ~ ': ' ~ outputs.audit.size ~ ' orphaned database user(s). Remappable by exact login name: ' ~ (outputs.audit.rows | jq('[.[] | select(.status == "remappable") | .user_name] | if length == 0 then "none" else join(", ") end') | first) ~ '. Refused: ' ~ (outputs.audit.rows | jq('[.[] | select(.status != "remappable") | "\(.user_name) (\(.status))"] | if length == 0 then "none" else join(", ") end') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Re-map pending approval.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: gate
        type: io.kestra.plugin.core.flow.If
        condition: >-
          {{ inputs.auto_remediate and not inputs.dry_run and (outputs.plan.values.remap_count | number) > 0 }}
        then:
          - id: ceiling_gate
            type: io.kestra.plugin.core.flow.If
            description: Refuse the whole batch over the ceiling rather than re-mapping part of it. A restore that orphaned dozens of users at once is an operator decision, not something a scheduled run should work through on its own.
            condition: >-
              {{ (outputs.plan.values.remap_count | number) > inputs.max_remap }}
            then:
              - id: ceiling_exceeded
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "{{ outputs.plan.values.remap_count }} remappable orphaned user(s) is over the max_remap ceiling of {{ inputs.max_remap }}: {{ fromJson(outputs.plan.values.remap_users) | join(', ') }}. Nothing was re-mapped. Read the list, confirm each login is the right identity, then raise max_remap and run again."
            else:
              - id: approve
                type: io.kestra.plugin.core.flow.Pause
                description: >-
                  Last stop before a permission change. Resuming with approved false leaves every user orphaned. So does killing
                  the execution. Read the login name against the user name for
                  each entry first.
                onResume:
                  - id: approved
                    type: BOOL
                    displayName: Re-map these users to the matching logins
                    description: Set true to run the ALTER USER statements. Anything else leaves the database untouched.

              - id: apply_gate
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.approve.onResume.approved ?? false }}"
                then:
                  - id: remediate
                    type: io.kestra.plugin.core.flow.Loop
                    description: Serial on purpose. Each ALTER USER runs as its own autocommitting Query, never a Queries task with transaction true. concurrencyLimit 1 keeps them one at a time. allowFailure is set so one refused statement does not hide the rest. The re-read below decides whether anything landed.
                    concurrencyLimit: 1
                    values: "{{ outputs.plan.values.remap_sql }}"
                    tasks:
                      - id: apply
                        type: io.kestra.plugin.jdbc.sqlserver.Query
                        description: One ALTER USER ... WITH LOGIN. Points the database user's SID at the server login of the same name.
                        url: "{{ inputs.url }}"
                        username: "{{ inputs.user }}"
                        password: "{{ inputs.password }}"
                        trustServerCertificate: true
                        fetchType: NONE
                        allowFailure: true
                        sql: "{{ item.value }}"

                  - id: reaudit
                    type: io.kestra.plugin.jdbc.sqlserver.Query
                    description: Re-read the catalog after the re-map. A user that was remappable and is still orphaned and still remappable means the ALTER USER did not land.
                    url: "{{ inputs.url }}"
                    username: "{{ inputs.user }}"
                    password: "{{ inputs.password }}"
                    trustServerCertificate: true
                    fetchType: FETCH
                    sql: "{{ render(vars.audit_sql) }}"

                  - id: verify_result
                    type: io.kestra.plugin.core.flow.If
                    description: Refused users keep their own status, so they do not trip this. Only a user the flow tried to re-map can still be remappable afterwards.
                    condition: >-
                      {{ (outputs.reaudit.rows | jq('[.[] | select(.status == "remappable")] | length') | first) > 0 }}
                    then:
                      - id: remediation_failed
                        type: io.kestra.plugin.core.execution.Fail
                        errorMessage: "Still orphaned after the re-map: {{ outputs.reaudit.rows | jq('[.[] | select(.status == \"remappable\") | .user_name] | join(\", \")') | first }}. The ALTER USER was accepted by the driver and changed nothing. Check three things: whether the database is READ_ONLY, whether the login has ALTER ANY USER on it, whether the database is a replica."
                    else:
                      - id: remediated
                        type: io.kestra.plugin.core.log.Log
                        message: "Re-mapped and verified: {{ fromJson(outputs.plan.values.remap_users) | join(', ') }}. Each user's SID now resolves to the server login of the same name. {{ outputs.reaudit.size }} orphaned user(s) remain, all of them refused on purpose."
                else:
                  - id: declined
                    type: io.kestra.plugin.core.log.Log
                    message: "Approval declined, nothing re-mapped. Still orphaned: {{ fromJson(outputs.plan.values.remap_users) | join(', ') }}."
        else:
          - id: no_change
            type: io.kestra.plugin.core.log.Log
            message: >-
              No re-map run. {{ outputs.audit.size }} orphaned user(s), {{ outputs.plan.values.remap_count }} of them
              with one matching login (auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }}).
              Refused on purpose: {{ outputs.audit.rows | jq('[.[] | select(.status != "remappable") | "\(.user_name) (\(.status))"] | if length == 0 then "none" else join(", ") end') | first }}.
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No orphaned user on {{ inputs.url }}. Every database user that is meant to map to a server login resolves to one."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'SQL Server orphaned user guard failed on ' ~ inputs.url ~ ' (execution ' ~ execution.id ~ '). One of three things happened: a re-map was accepted and changed nothing, the batch was over the max_remap ceiling, the audit could not read the catalog. Nothing is assumed re-mapped. Check the logs.'} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Always runs in safe mode (audit only).
    cron: "0 4 * * 1"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: SQL Server Orphaned Database User Guard
  shortDescription: Find SQL Server database users whose SID resolves to no server login, alert Slack, then re-map each one by exact login name behind a gate plus an approval pause and re-read the catalog to confirm.
  metaTitle: SQL Server Orphaned Database User Guard with Kestra
  metaDescription: Detect SQL Server database users whose SID resolves to no login, alert Slack, then re-map by exact name behind a gate and re-read to confirm.
  description: |
    Restore or attach a database onto a different instance and its users come with it. Their SIDs do not. A database user carries the SID of the login it was created from, the new server's logins have their own SIDs, so the user now resolves to nothing. That user is orphaned. It still exists inside the database, it still owns schemas and objects, it still holds every permission that was granted to it. No login can connect as it. Nothing errors until an application tries. Then the failure looks like a bad password on a login that is plainly there.

    This blueprint reads `sys.database_principals` for the connected database, keeps the users that are meant to map to a server login, drops the ones that legitimately have none, then flags every user whose SID matches no row in `sys.server_principals`. When you allow it and approve the pause, it re-maps each flagged user with `ALTER USER ... WITH LOGIN`, one statement at a time, then reads the catalog again and fails the run if any user it tried to fix is still orphaned.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    Re-mapping an orphaned user to the wrong login is a privilege escalation that leaves no error behind. The user keeps every permission it was granted. Whoever holds that login now has them. SQL Server will not stop you: `ALTER USER u WITH LOGIN = anything` succeeds whenever the login exists. So this flow never guesses.

    - **It re-maps by exact name only.** A user is a candidate for `ALTER USER` only when a server login exists whose name is equal to the user's name and whose principal type matches the user's. No similarity, no prefix, no manual mapping table, no flow input that could name a login.
    - **It requires exactly one candidate.** The flow refuses unless the candidate count is exactly 1. `sys.server_principals.name` is unique, so a name match normally resolves to one login, but the check is on the count rather than on that assumption. It has to be: in a database whose collation is looser than the server's, one user name really does match two logins. An accent-insensitive database on an accent-sensitive server matches both `jose` and `josé`. The count check is what stops the flow picking one.
    - **The name comparison carries `COLLATE DATABASE_DEFAULT`.** `sys.database_principals.name` uses the database collation while `sys.server_principals.name` uses the server collation, so comparing them raises `Cannot resolve the collation conflict` in any database whose collation differs from the server's. That is exactly the database a cross-instance restore leaves behind, which is this flow's own use case.
    - **It refuses a login that is already taken.** When the matching login is already mapped to a different user in the same database, the flow reports `login_claimed` and leaves the orphan alone. That re-map would either be rejected by the server or give two users one identity.
    - **It leaves users that have no login by design alone.** A user created `WITHOUT LOGIN`, a certificate or asymmetric key mapped user and a contained database user all show up as having no matching server login. They are excluded by `authentication_type` and `type`, not by a name list, so none of them is ever flagged or touched.
    - **It has a per-run ceiling.** `max_remap` caps one run. Over the ceiling the run refuses the whole batch and names every user, instead of re-mapping part of it.
    - **Read-only by default.** `dry_run` is `true` and `auto_remediate` is `false`, so a normal run reads the catalog and alerts.
    - **A `Pause` sits in front of the write.** Resuming with `approved` false leaves every user orphaned. So does killing the execution. An unanswered pause reads as a refusal.
    - Statements are built in SQL with `QUOTENAME` from catalog values, so identifiers are quoted by the server. Each one runs as its own autocommitting `io.kestra.plugin.jdbc.sqlserver.Query` with `concurrencyLimit: 1`.
    - A refused `ALTER USER` does not abort the batch. The re-read decides, then fails the run.

    ## Findings

    Each row carries the user, its type, its unresolved SID, the candidate login and a status:

    | Status | Meaning | Action |
    |---|---|---|
    | `remappable` | exactly one server login of the same name and matching type, not mapped to another user here | re-mapped behind the gate |
    | `no_matching_login` | no server login of that name exists | reported, never touched. Create the login, then run again |
    | `ambiguous_login` | more than one login matched the name | reported, never touched |
    | `login_claimed` | the matching login already belongs to another user in this database | reported, never touched |

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.sqlserver.Query`, read-only) reads `sys.database_principals` and keeps users where `type` is one of `S`, `U`, `G`, `authentication_type` is `1` (INSTANCE, meaning the user is meant to map to a server login), `principal_id > 4`, `is_fixed_role = 0` and the SID matches no row in `sys.server_principals`. It then joins `sys.server_principals` on an exact name and type match to count candidate logins, checks whether the candidate is already mapped to another user, sets the status and builds the `ALTER USER ... WITH LOGIN` statement with `QUOTENAME` for the remappable ones.
    2. `plan` (`io.kestra.plugin.core.output.OutputValues`) splits the findings into the remappable statements and the refused users. `summary` (`io.kestra.plugin.core.log.Log`) logs every user with its status, its SID and its candidate login.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs that every user resolves to a login.
       - **findings:** `alert` posts the remappable and the refused lists to Slack.
         - `gate` runs only when `auto_remediate` is `true`, `dry_run` is `false` and at least one user is remappable. Otherwise `no_change` logs what was found and what blocked the write.
         - `ceiling_gate` fails the run through `ceiling_exceeded` when the remappable count is over `max_remap`.
         - `approve` (`io.kestra.plugin.core.flow.Pause`) waits for `approved: true`.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs one `ALTER USER` per user.
         - `reaudit` re-reads the catalog. `verify_result` fails the run through `remediation_failed` if any user is still orphaned with a matching login, which is what a refused write looks like.
    4. `errors` posts a Slack alert on any failure, including the ceiling refusal and the re-verify failure.

    ## What you get

    - Every orphaned user in the database, with the SID that resolves to nothing, so the application login failure nobody could explain has a cause.
    - A clear split between the users a name match can fix and the users that need a human, with the reason for each refusal.
    - An `ALTER USER ... WITH LOGIN` re-map that only ever targets a login of the same name, behind two inputs, a ceiling and an approval pause.
    - A re-read of the catalog after the change that fails the run if a user it tried to fix is still orphaned, so a re-map the server accepted and ignored is never reported as success.
    - Users that have no login on purpose left untouched, so running this on a database full of `WITHOUT LOGIN` or certificate users reports nothing.
    - A Slack alert on findings and a separate alert on failure.

    ## Who it's for

    - DBAs who restored a database onto a new instance and want the orphaned users found before an application finds them.
    - Platform teams running refresh pipelines from production into staging, where every refresh re-orphans the same users.
    - Anyone who has reached for `sp_change_users_login 'Auto_Fix'`, which is deprecated and maps by name with no ambiguity check, who want the same fix with the checks plus the audit trail.
    - Teams evaluating the SQL Server plugin who want an example that reads the catalog and drives a permission change.

    ## Why orchestrate this with Kestra

    Listing orphaned users is one catalog query. Fixing them safely is not. The fix is a permission change, so it needs the candidate resolved from the catalog rather than typed in, a refusal on anything ambiguous, a ceiling so one bad restore does not re-map fifty users unattended, a human in front of the write, then a read-back that fails loudly when the server accepted the statement and changed nothing. Kestra holds all of that in one file: the audit, the Slack alert, the gate, the pause, the serial loop, the re-read and the failure. Every run keeps its own before and after in the execution history, which is what you want when the question is who was given which permissions and when.

    ## Tested end to end

    On Kestra 2.0.5 against SQL Server 2022 on Linux, with a local HTTP sink standing in for Slack. The degraded state was built the way production builds it: four logins plus matching users in a source database, a full backup, the database and the logins dropped, three of the four logins recreated so their SIDs changed, then a restore under a new name. `sp_change_users_login 'Report'` confirmed four orphaned users before any run.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults against a clean database | 0 orphaned users, `clean` branch |
    | 2 | defaults against the restored database | 4 orphaned users found, 2 remappable, 2 refused (`no_matching_login`, `login_claimed`). Slack alert "No change applied". The catalog was unchanged afterwards |
    | 3 | `auto_remediate: true`, `dry_run: true` | same 4 findings, still no write. The dry run blocked it with `auto_remediate` on |
    | 4 | `auto_remediate: true`, `dry_run: false`, `max_remap: 1` | `ceiling_exceeded` failed the run at 2 remappable over a ceiling of 1, before the pause. Nothing re-mapped, `errors` posted to Slack |
    | 5 | `auto_remediate: true`, `dry_run: false`, pause resumed with `approved: false` | `declined` logged, both users still orphaned in the catalog |
    | 6 | `auto_remediate: true`, `dry_run: false`, pause approved | 2 `ALTER USER ... WITH LOGIN` ran, `reaudit` returned 0 remappable, the catalog showed both SIDs resolving to their logins. Both logins then connected to the database, one of them still owning its schema |
    | 7 | defaults, after run 6 | 2 orphaned users, both refused, 0 remappable |
    | 8 | defaults against a database whose collation is accent insensitive, with two server logins differing only by an accent | one user matched both logins, `ambiguous_login`, nothing touched |
    | 9 | `auto_remediate: true`, `dry_run: false`, pause approved, database set `READ_ONLY WITH ROLLBACK IMMEDIATE` | the `ALTER USER` was refused, the loop still reported success, `reaudit` found the users still remappable and `remediation_failed` failed the run. `errors` posted to Slack |
    | 10 | unreachable server | `audit` failed, `errors` posted to Slack |

    The users that have no login by design were present throughout: a `WITHOUT LOGIN` user and a certificate mapped user, both of which a plain SID join reports as orphaned. Neither was ever flagged.

    ## Prerequisites

    - A SQL Server database you can reach over JDBC.
    - A login that can read `sys.database_principals` and `sys.server_principals`. Reading every server login needs `VIEW ANY DEFINITION` or `VIEW SERVER STATE`, otherwise the server only returns the connected login and healthy users look orphaned. `sysadmin` covers it.
    - For the re-map, `ALTER ANY USER` on the target database, so `db_owner` is enough, as is `sysadmin`. Re-mapping to a login the caller does not control also needs `IMPERSONATE` on that login or membership of `sysadmin`.
    - A Slack incoming webhook.

    ### Secrets

    - `SQLSERVER_PASSWORD`: password for the login in `user`. The `password` input defaults to this secret.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook, used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `url` | `jdbc:sqlserver://localhost:1433;databaseName=app;encrypt=false` | Database to check. The queries read the connected database |
    | `user` | `sa` | SQL Server login |
    | `password` | `{{ secret('SQLSERVER_PASSWORD') }}` | Password for the login |
    | `max_remap` | `5` | Ceiling per run. Over it the whole batch is refused |
    | `auto_remediate` | `false` | Allow the `ALTER USER` statements |
    | `dry_run` | `true` | Must be `false` for a statement to run |

    ## Quick start

    1. Add the `SQLSERVER_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, then set `url` to the database you want to check and set `user`.
    3. Run it with the defaults and read the findings. Check each candidate login name against the user name yourself.
    4. When you are ready, run with `auto_remediate: true` and `dry_run: false`, then resume the pause with `approved: true`.
    5. Enable the `weekly` trigger, which always runs in safe mode.

    ## How to extend

    - Point it at `sys.databases` first and loop the audit over every database on the instance, since a restore orphans users one database at a time.
    - Add the owned objects per orphan by reading `sys.objects` and `sys.schemas` for the principal, so the Slack alert says what the user owns before anyone approves.
    - Create the missing login for a `no_matching_login` finding behind its own gate, which turns the one refusal a name match cannot fix into a two-step flow.
    - Run it as the last task of a restore pipeline so a refreshed staging database never reaches a developer orphaned.
    - Swap the `Pause` for a Slack approval task so the gate lives where the alert does.

    ## Links

