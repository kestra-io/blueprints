id: gcp-spanner-schema-governance-guard
namespace: company.team

description: |
  Find Cloud Spanner base tables that keep timestamped data but carry no row deletion policy, so
  rows pile up with no retention. The guard reads INFORMATION_SCHEMA, reports every table that has
  the retention timestamp column and a null ROW_DELETION_POLICY_EXPRESSION, alerts Slack and can
  add the policy with ALTER TABLE ADD ROW DELETION POLICY one table at a time, then reads
  INFORMATION_SCHEMA again to prove each policy is present. Runs against the Cloud Spanner emulator
  for a safe demo and against managed Spanner in production.

inputs:
  - id: project_id
    type: STRING
    displayName: GCP project id
    defaults: "test-project"

  - id: instance_id
    type: STRING
    displayName: Spanner instance id
    defaults: "w26-inst"

  - id: database_id
    type: STRING
    displayName: Spanner database id
    defaults: "governance"

  - id: emulator_host
    type: STRING
    displayName: Spanner emulator host and port
    description: Set to the emulator address like localhost:9010. For managed Spanner, delete the emulatorHost lines from the tasks so the service account is used instead.
    defaults: "localhost:9010"

  - id: retention_column
    type: STRING
    displayName: Retention timestamp column
    description: A base table with a TIMESTAMP column of this name is expected to carry a row deletion policy.
    defaults: "created_at"

  - id: retention_days
    type: INT
    displayName: Retention window in days
    description: The OLDER_THAN interval used when a missing policy is added.
    defaults: 90

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for the ALTER to run.
    defaults: true

variables:
  detect_sql: |
    SELECT t.TABLE_NAME AS table_name,
           c.COLUMN_NAME AS retention_column,
           CONCAT('ALTER TABLE ', t.TABLE_NAME,
                  ' ADD ROW DELETION POLICY (OLDER_THAN(', c.COLUMN_NAME,
                  ', INTERVAL {{ inputs.retention_days }} DAY))') AS fix_sql
      FROM INFORMATION_SCHEMA.TABLES t
      JOIN INFORMATION_SCHEMA.COLUMNS c
        ON c.TABLE_SCHEMA = t.TABLE_SCHEMA AND c.TABLE_NAME = t.TABLE_NAME
     WHERE t.TABLE_SCHEMA = ''
       AND t.TABLE_TYPE = 'BASE TABLE'
       AND c.COLUMN_NAME = '{{ inputs.retention_column }}'
       AND c.SPANNER_TYPE = 'TIMESTAMP'
       AND t.ROW_DELETION_POLICY_EXPRESSION IS NULL
     ORDER BY t.TABLE_NAME

tasks:
  - id: detect
    type: io.kestra.plugin.gcp.spanner.Query
    description: >-
      Read-only. Lists base tables in the user schema that have the retention timestamp column but
      no row deletion policy. Each row carries a ready ALTER statement.
    projectId: "{{ inputs.project_id }}"
    instanceId: "{{ inputs.instance_id }}"
    databaseId: "{{ inputs.database_id }}"
    emulatorHost: "{{ inputs.emulator_host }}"
    serviceAccount: "{{ inputs.emulator_host != '' ? null : secret('GCP_SERVICE_ACCOUNT') }}"
    fetchType: FETCH
    sql: "{{ render(vars.detect_sql) }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Spanner tables without a row deletion policy on {{ inputs.database_id }}: {{ outputs.detect.size }}.
      {% for r in outputs.detect.rows %}{{ r.table_name }}({{ r.retention_column }}). {% endfor %}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.detect.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Cloud Spanner ' ~ inputs.database_id ~ ': ' ~ outputs.detect.size ~ ' tables keep timestamped data with no row deletion policy: ' ~ (outputs.detect.rows | jq('map("\(.table_name)(\(.retention_column))") | join("; ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Adding the policies now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            concurrencyLimit: 1
            description: One ALTER TABLE ADD ROW DELETION POLICY at a time, so a single failure stays isolated.
            values: "{{ outputs.detect.rows | jq('map(.fix_sql)') | first | toJson }}"
            tasks:
              - id: apply_policy
                type: io.kestra.plugin.gcp.spanner.Execute
                allowFailure: true
                projectId: "{{ inputs.project_id }}"
                instanceId: "{{ inputs.instance_id }}"
                databaseId: "{{ inputs.database_id }}"
                emulatorHost: "{{ inputs.emulator_host }}"
                serviceAccount: "{{ inputs.emulator_host != '' ? null : secret('GCP_SERVICE_ACCOUNT') }}"
                isDdl: true
                sql: "{{ item.value }}"

          - id: reverify
            type: io.kestra.plugin.gcp.spanner.Query
            description: Read INFORMATION_SCHEMA again. A table still here was not covered by a valid policy.
            projectId: "{{ inputs.project_id }}"
            instanceId: "{{ inputs.instance_id }}"
            databaseId: "{{ inputs.database_id }}"
            emulatorHost: "{{ inputs.emulator_host }}"
            serviceAccount: "{{ inputs.emulator_host != '' ? null : secret('GCP_SERVICE_ACCOUNT') }}"
            fetchType: FETCH
            sql: "{{ render(vars.detect_sql) }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            description: The run fails if any in-scope table still has no row deletion policy after the ALTER.
            condition: "{{ outputs.reverify.size > 0 }}"
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "Some tables still have no row deletion policy: {{ outputs.reverify.rows | jq('map(\"\\(.table_name)(\\(.retention_column))\") | join(\", \")') | first }}."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Row deletion policy added and verified on: {{ outputs.detect.rows | jq('map("\(.table_name)(\(.retention_column))") | join(", ")') | first }}.
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "Every scoped Spanner table has a row deletion policy."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Cloud Spanner schema governance guard failed on ' ~ inputs.database_id ~ ' (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and always in safe mode.
    cron: "0 4 * * 1"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Cloud Spanner Schema Governance Guard
  shortDescription: Find Cloud Spanner tables that keep timestamped data with no row deletion policy, alert Slack and optionally add the policy with ALTER TABLE ADD ROW DELETION POLICY one table at a time, then verify each one in INFORMATION_SCHEMA.
  metaTitle: Cloud Spanner Schema Governance Guard with Kestra
  metaDescription: Find Cloud Spanner tables keeping timestamped data with no row deletion policy, alert Slack, add the policy with DDL and re-check INFORMATION_SCHEMA.
  description: |
    Cloud Spanner can expire old rows for you with a row deletion policy (its TTL feature), but only on tables where someone declared one. A table that collects events or logs with a `created_at` timestamp and no policy grows without bound and nobody notices until storage and query cost climb. The policy is one line of DDL, so the gap is almost always an oversight.

    This blueprint reads `INFORMATION_SCHEMA` and finds every base table that has the retention timestamp column but a null `ROW_DELETION_POLICY_EXPRESSION`. It alerts Slack and can add the missing policy with `ALTER TABLE ADD ROW DELETION POLICY`, one table at a time. It then reads `INFORMATION_SCHEMA` again, so the run only succeeds when each table carries a policy.

    It runs against the Cloud Spanner emulator for a safe demo with no credentials and against managed Spanner in production.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    A table is in scope when it is a base table in the user schema and has a `TIMESTAMP` column named by `retention_column` (default `created_at`). A finding is such a table whose `ROW_DELETION_POLICY_EXPRESSION` is null. Tables with no retention column are never flagged, so reference and lookup tables are left alone.

    ## Safety

    Read-only by default. The `ALTER` runs only when `auto_remediate` is true and `dry_run` is false. The emulator accepts the policy DDL and reflects it in `INFORMATION_SCHEMA` but does not run the background deletion, so the re-check asserts the policy exists, never that rows were removed. On managed Spanner the background job then enforces it.

    ## How it works

    1. `detect` (`io.kestra.plugin.gcp.spanner.Query`, read-only) lists base tables in the user schema that have the retention timestamp column and no row deletion policy. Each row carries the table, the column and a ready `ALTER TABLE ADD ROW DELETION POLICY` statement.
    2. `summary` logs every finding.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs that every scoped table has a policy.
       - **findings:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) adds one policy per task.
         - `reverify` reads `INFORMATION_SCHEMA` again, then `verify_result` fails the run if any scoped table still has no policy.
    4. `errors` alerts Slack when a query or statement cannot run.

    ## What you get

    - Every table that keeps timestamped data with no retention, read from the catalog itself.
    - The policy added with DDL, one table at a time, behind two safety inputs.
    - Proof from `INFORMATION_SCHEMA` that each table carries a policy after the run.

    ## Who it's for

    - Teams running Cloud Spanner who want retention applied consistently across a database.
    - Platform engineers who review schema governance after migrations.
    - Anyone evaluating the Spanner plugin who wants a runnable example against the emulator.

    ## Why orchestrate this with Kestra

    The catalog query finds the gaps once. Kestra runs it on a schedule and after every migration, turning the result into a Slack alert. It adds the policies behind `auto_remediate` and `dry_run`, one per task so one failure stays isolated, verifies the result and keeps a history of what changed and when.

    ## Tested end to end

    On Kestra 2.0.5 OSS against the Cloud Spanner emulator (`gcr.io/cloud-spanner-emulator/emulator`), with a local HTTP sink standing in for Slack. The database held three base tables:
    - `audit_events`: `created_at TIMESTAMP` with a policy already (never flagged);
    - `session_logs`: `created_at TIMESTAMP` with no policy (the gap);
    - `country_codes`: no retention column (out of scope).

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults, degraded | 1 finding (`session_logs`), alert sent, no change |
    | 2 | `auto_remediate: true`, `dry_run: true` | Same report, policy not added |
    | 3 | `auto_remediate: true`, `dry_run: false` | Policy added and verified, `session_logs` now `OLDER_THAN(created_at, INTERVAL 90 DAY)` |
    | 4 | defaults, after the fix | 0 findings, clean |
    | 5 | unreachable database | `errors` alert sent |

    Confirmed against the emulator's own `INFORMATION_SCHEMA`: `session_logs` had a null policy before run 3 and the `OLDER_THAN` expression after.
    ## Prerequisites

    - A Cloud Spanner instance and database. For a local demo, run `docker run -d --name spanner -p 9010:9010 -p 9020:9020 gcr.io/cloud-spanner-emulator/emulator`, then create an instance and a database through the emulator admin API.
    - A table with a `created_at TIMESTAMP` column and no row deletion policy, so there is a gap to find.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - `GCP_SERVICE_ACCOUNT`: a service account JSON for managed Spanner. Not read when `emulator_host` is set, because the emulator needs no credentials.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `project_id` | `test-project` | GCP project |
    | `instance_id` | `w26-inst` | Spanner instance |
    | `database_id` | `governance` | Spanner database |
    | `emulator_host` | `localhost:9010` | Emulator address. An empty value is not valid, see How to extend for managed Spanner |
    | `retention_column` | `created_at` | Timestamp column that marks a table for retention |
    | `retention_days` | `90` | `OLDER_THAN` interval used by the fix |
    | `auto_remediate` | `false` | Allow the policy to be added |
    | `dry_run` | `true` | Must be `false` for the `ALTER` to run |

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Start the emulator and create an instance and a database with at least one table that has a timestamp column and no policy.
    3. Import the flow and run it with `emulator_host` set to the emulator address.
    4. Read the findings, then run it again with `auto_remediate: true` and `dry_run: false`.
    5. Enable the `weekly` trigger, which always runs in safe mode.

    ## How to extend

    - For managed Cloud Spanner, delete the `emulatorHost` line from the three Spanner tasks (the plugin treats an empty value as a bad host, so the property must be absent) and set `GCP_SERVICE_ACCOUNT`.
    - Scope the scan to a table name pattern or a list of databases.
    - Chain this guard into a post-migration pipeline so a new table without retention is caught the day it ships.
    - Ask for approval with a `Pause` before adding policies on busy tables.

    ## Links

    - Row deletion policies (TTL): https://cloud.google.com/spanner/docs/ttl
    - Spanner plugin: https://kestra.io/plugins/plugin-gcp/spanner/io.kestra.plugin.gcp.spanner.execute
  tags:
    - Cloud
    - Data
  subTags:
    - GCP Services
    - Day 2 Operations
  ee: false
  demo: false
