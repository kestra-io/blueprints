id: scylladb-node-compaction-backlog-sentinel
namespace: company.database

inputs:
  - id: scylla_api_url
    type: STRING
    defaults: "http://scylladb.internal:10000"
    description: Base URL of the ScyllaDB REST management API.
  - id: max_pending_compactions
    type: INT
    defaults: 20
    description: "Maximum allowable pending compaction tasks per node before alerting (default 20)."

tasks:
  - id: inspect_compaction_tasks
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query ScyllaDB compaction manager metrics
        curl -s "{{ inputs.scylla_api_url }}/compaction_manager/compactions" > /tmp/scylla_compactions.json

        python3 -c "
        import json
        try:
            with open('/tmp/scylla_compactions.json') as f:
                data = json.load(f)
            pending = len(data) if isinstance(data, list) else 0
            is_breach = 1 if pending >= {{ inputs.max_pending_compactions }} else 0
            print(f'{is_breach}|{pending}')
        except Exception:
            print('0|0')
        " > /tmp/scylla_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/scylla_summary.txt)
        PENDING_TASKS=$(cut -d '|' -f 2 /tmp/scylla_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=pending_tasks::$PENDING_TASKS::"

  - id: evaluate_compaction_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_compaction_tasks.vars.is_breach | int == 1 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 ScyllaDB Compaction Backlog Alert",
                "text": "ScyllaDB node at {{ inputs.scylla_api_url }} has {{ outputs.inspect_compaction_tasks.vars.pending_tasks }} pending compaction tasks (threshold {{ inputs.max_pending_compactions }}). SSTable accumulation is degrading read latency and read amplification.",
                "footer": "Kestra Database Sentinel • ScyllaDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ ScyllaDB Sentinel Failure",
            "text": "Failed to query compaction manager on ScyllaDB node at {{ inputs.scylla_api_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: ScyllaDB Pending Compaction Backlog Sentinel
  shortDescription: Audits ScyllaDB nodes for SSTable compaction debt to prevent disk space bloat and read latency spikes.
  description: |
    ## How it works
    This workflow connects to the ScyllaDB REST management API (`/compaction_manager/compactions`) to audit active and pending SSTable compaction tasks. In log-structured merge-tree (LSM) architectures like ScyllaDB and Apache Cassandra, heavy write workloads generate dozens of immutable SSTables on disk. When background compaction threads cannot keep pace with write rates due to CPU starvation or disk I/O bottlenecks, SSTable counts escalate. This severely degrades read performance due to multi-SSTable bloom filter misses and inflates disk consumption. This sentinel audits pending compaction tasks and alerts DBAs before read SLAs degrade.

    ## What you get
    - Real-time visibility into ScyllaDB SSTable compaction queue depth.
    - Early warning before read amplification compromises application SLAs.
    - Automated Slack incident notifications detailing pending compaction counts.

    ## Who it's for
    - Database Administrators managing ScyllaDB and Cassandra clusters.
    - SREs safeguarding distributed NoSQL query responsiveness.
    - Platform Engineers provisioning cloud NVMe storage for database nodes.

    ## Why orchestrate this with Kestra
    - **Scheduled Surveillance**: Regularly polls database management endpoints without third-party exporters.
    - **Encrypted Credential Protection**: Secures ScyllaDB management authentication in Kestra secrets.
    - **Cross-Layer Orchestration**: Links database compaction debt with write-throttling workflows.

    ## Prerequisites
    - Running ScyllaDB cluster with accessible REST management API (`10000`).
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK` secret to your namespace.
    3. Specify `scylla_api_url` and `max_pending_compactions`.
    4. Enable the schedule trigger for continuous compaction monitoring.

    ## How to extend
    - Inspect disk space overhead required for ongoing major compactions.
    - Trigger automated compaction concurrency tuning via API.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [ScyllaDB REST API Documentation](https://docs.scylladb.com/manual/admin/api/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
