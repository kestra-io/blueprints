id: unattached-ebs-volumes-finder
namespace: company.finops

description: |
  Finds unattached EBS volumes silently billing you. Volumes in "available"
  state keep charging per GB-month forever — leftovers from terminated
  instances, failed restores, and resized disks. This flow lists them across
  regions, estimates the monthly waste by volume type, and can optionally clean
  up old ones.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for unattached EBS volumes.
  - id: min_age_days
    type: INT
    defaults: 30
    description: Only volumes unattached for at least this long are eligible for auto-delete.
  - id: auto_delete
    type: BOOLEAN
    defaults: false
    description: "DANGER: when true, deletes unattached volumes older than min_age_days. Default false (report only)."

tasks:
  - id: analyze
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit unattached volumes region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List available volumes and estimate monthly waste by type.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            MIN_AGE={{ inputs.min_age_days }}
            echo "Checking unattached EBS volumes in $REGION"
            aws ec2 describe-volumes --region "$REGION" \
              --filters Name=status,Values=available \
              --query 'Volumes[].{VolumeId:VolumeId,Size:Size,VolumeType:VolumeType,CreateTime:CreateTime}' \
              --output json > /tmp/vols.json
            python3 << 'PYEOF' > /tmp/report.txt
            import json, datetime
            # Approx US East list prices per GB-month
            price = {"gp3": 0.08, "gp2": 0.10, "io1": 0.125, "io2": 0.125,
                     "st1": 0.045, "sc1": 0.015, "standard": 0.05}
            now = datetime.datetime.now(datetime.timezone.utc)
            vols = json.load(open("/tmp/vols.json"))
            rows = []
            for v in vols:
                created = datetime.datetime.fromisoformat(v["CreateTime"].replace("Z", "+00:00"))
                age = (now - created).days
                cost = v["Size"] * price.get(v["VolumeType"], 0.08)
                rows.append((cost, v["VolumeId"], v["Size"], v["VolumeType"], age))
            rows.sort(reverse=True)
            total = sum(r[0] for r in rows)
            old = [r for r in rows if r[4] >= int("$MIN_AGE")]
            print("WASTE_COUNT=%d" % len(rows))
            print("TOTAL_WASTE_USD=%.2f" % total)
            print("DELETABLE_COUNT=%d" % len(old))
            print("DELETABLE_IDS=%s" % ",".join(r[1] for r in old))
            top = " | ".join("%s:%dGB:%s:%dd:$%.2f" % (r[1], r[2], r[3], r[4], r[0]) for r in rows[:5])
            print("TOP_VOLUMES=%s" % top if top else "TOP_VOLUMES=none")
            PYEOF
            cat /tmp/report.txt
            eval $(cat /tmp/report.txt)
            if [ "$WASTE_COUNT" -gt 0 ]; then HAS_WASTE=true; else HAS_WASTE=false; fi
            if [ "{{ inputs.auto_delete }}" = "true" ] && [ "$WASTE_COUNT" -gt 0 ]; then SHOULD_DELETE=true; else SHOULD_DELETE=false; fi
            echo "HAS_WASTE=$HAS_WASTE"
            echo "WASTE_COUNT=$WASTE_COUNT"
            echo "TOTAL_WASTE_USD=$TOTAL_WASTE_USD"
            echo "TOP_VOLUMES=$TOP_VOLUMES"
            echo "SHOULD_DELETE=$SHOULD_DELETE"
            echo "DELETABLE_COUNT=$DELETABLE_COUNT"
            echo "DELETABLE_IDS=$DELETABLE_IDS"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report the waste, stay quiet when nothing is unattached.
        condition: "{{ outputs.audit_region.vars.HAS_WASTE == 'true' }}"
        then:
          - id: slack_waste
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":floppy_disk: Unattached EBS volumes in `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.WASTE_COUNT }}* volumes wasting ~${{ outputs.audit_region.vars.TOTAL_WASTE_USD }}/mo.\nTop offenders (id:size:type:age:cost):\n`{{ outputs.audit_region.vars.TOP_VOLUMES }}`\nReview in the EC2 console before deleting — snapshots are cheap insurance."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "No unattached EBS volumes in {{ outputs.audit_region.vars.REGION_DONE }}."
      - id: cleanup_region
        type: io.kestra.plugin.core.flow.If
        description: Opt-in deletion of old unattached volumes. Off by default.
        condition: "{{ outputs.audit_region.vars.SHOULD_DELETE == 'true' }}"
        then:
          - id: delete_volumes
            type: io.kestra.plugin.aws.cli.AwsCLI
            description: Delete unattached volumes older than min_age_days.
            commands:
              - |
                for VOL in $(echo "{{ outputs.audit_region.vars.DELETABLE_IDS }}" | tr ',' ' '); do
                  [ -z "$VOL" ] && continue
                  echo "Deleting unattached volume $VOL (older than {{ inputs.min_age_days }} days)"
                  aws ec2 delete-volume --volume-id "$VOL" --region "{{ taskrun.value }}"
                done
                echo "Deleted {{ outputs.audit_region.vars.DELETABLE_COUNT }} volumes in {{ taskrun.value }}"
            env:
              AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
              AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
              AWS_DEFAULT_REGION: "{{ taskrun.value }}"
        else:
          - id: log_skip_delete
            type: io.kestra.plugin.core.log.Log
            message: "Auto-delete disabled — {{ outputs.audit_region.vars.WASTE_COUNT }} unattached volume(s) left alone in {{ outputs.audit_region.vars.REGION_DONE }}."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 03:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 3 * * 0"
    disabled: true

extend:
  title: Unattached EBS Volumes Finder
  metaTitle: Find Unattached EBS Volumes Costing You Money | Kestra
  shortDescription: List unattached EBS volumes across regions, estimate monthly waste by volume type, and optionally auto-delete old ones — with a Slack report either way.
  metaDescription: Unattached EBS volumes bill forever. Audit them weekly by region, see the waste in dollars, optionally clean up.
  description: |
    An EBS volume in "available" state — attached to nothing — still bills per GB-month, forever. Every terminated instance, every failed restore, every disk resize leaves one behind, and they accumulate silently because nothing alerts on them. This blueprint turns that invisible waste into a weekly number.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 03:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists volumes with status `available`, then a Python step computes each volume's age and estimated monthly cost from its type and size (gp3/gp2/io1/io2/st1/sc1/standard pricing), sorted by waste descending.
    4. An `If` task posts a Slack report with the top offenders when waste exists, and stays quiet otherwise.
    5. A second `If` task optionally deletes volumes older than `min_age_days` — but only when `auto_delete` is explicitly true (default false, report-only).

    ## What you get

    - A weekly, region-by-region list of unattached volumes with age, size, type, and dollar cost.
    - Waste sorted worst-first, so the biggest savings are obvious.
    - An opt-in cleanup path with an age guardrail — never deletes young volumes, never deletes unless you say so.
    - Silence on clean weeks.

    ## Who it's for

    Platform engineers and FinOps teams managing EC2 estates where instances come and go but their disks mysteriously stay.

    ## Why orchestrate this with Kestra

    The AWS console shows unattached volumes but nobody checks weekly. As a Kestra flow the audit is automatic, the report lands where the team actually reads (Slack), the cost math is consistent every run, and flipping on cleanup is a deliberate input change — not a Friday-afternoon CLI adventure.

    ## Prerequisites

    - AWS credentials with `ec2:DescribeVolumes` (plus `ec2:DeleteVolume` only if you enable `auto_delete`).
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EC2 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EC2 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the waste report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to your regions. Leave `auto_delete` false for the first run.
    3. Run manually and review the Slack report.
    4. Only when you trust it: set `auto_delete` true (volumes younger than `min_age_days` are still never touched).
    5. Enable the weekly schedule trigger.

    ## How to extend

    - Snapshot volumes before deletion for a safety net.
    - Skip volumes tagged `Keep=true` for intentional spares.
    - Track week-over-week totals to show the cleanup trend.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [EBS pricing](https://aws.amazon.com/ebs/pricing/)
    - [EC2 describe-volumes API](https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-volumes.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
