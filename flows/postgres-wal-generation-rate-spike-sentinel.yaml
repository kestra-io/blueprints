id: postgres-wal-generation-rate-spike-sentinel
namespace: company.database
description: Monitors PostgreSQL for sudden surges in WAL bytes generation to prevent disk exhaustion and replica sync lag.

inputs:
  - id: db_host
    type: STRING
    defaults: "postgres.internal"
    description: Hostname of PostgreSQL database.
  - id: db_port
    type: INT
    defaults: 5432
    description: PostgreSQL port.
  - id: db_name
    type: STRING
    defaults: "postgres"
    description: Database name.
  - id: db_user
    type: STRING
    defaults: "postgres"
    description: Database user.

tasks:
  - id: query_wal_rate
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.db_host }}:{{ inputs.db_port }}/{{ inputs.db_name }}"
    username: "{{ inputs.db_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
        ROUND((pg_wal_lsn_diff(pg_current_wal_lsn(), '0/0') / 1024 / 1024)::numeric, 2) AS current_wal_mb;
    fetchType: FETCH_ONE

  - id: evaluate_wal_growth
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_wal_rate.row is defined and outputs.query_wal_rate.row != null and outputs.query_wal_rate.row.current_wal_mb | float > 500000 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 PostgreSQL WAL Generation Surge Alert",
                "text": "PostgreSQL instance at `{{ inputs.db_host }}` recorded cumulative WAL LSN position of *{{ outputs.query_wal_rate.row.current_wal_mb }} MB*! Massive write spikes, bulk ETL operations, or logical replication lag threaten disk volume exhaustion.",
                "footer": "Kestra Database Sentinel • PostgreSQL"
              }
            ]
          }

outputs:
  - id: current_wal_mb
    type: FLOAT
    value: "{{ outputs.query_wal_rate.row ? outputs.query_wal_rate.row.current_wal_mb : 0.0 }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ PostgreSQL WAL Sentinel Failure",
            "text": "Failed to query PostgreSQL WAL LSN. Verify database credentials and network access.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Monitors PostgreSQL for sudden surges in WAL bytes generation to prevent disk exhaustion and replica sync lag.
  metaTitle: PostgreSQL Write-Ahead Logging (WAL) Generation Surge Sentinel with Kestra
  title: PostgreSQL Write-Ahead Logging (WAL) Generation Surge Sentinel
  shortDescription: Monitors PostgreSQL for sudden surges in WAL bytes generation to prevent disk exhaustion and replica sync lag.
  description: |
    ## How it works
    This workflow connects directly to PostgreSQL using the native JDBC PostgreSQL plugin to evaluate current Write-Ahead Log (WAL) generation positions via `pg_wal_lsn_diff(pg_current_wal_lsn(), '0/0')`. In high-throughput transactional environments or unoptimized ETL batch jobs, massive UPDATE/INSERT surges flood the `pg_wal` storage directory with dozens of gigabytes per hour. If physical replication slots or WAL archivers cannot process segments fast enough, storage volumes hit 100% capacity and trigger immediate database shutdown. This workflow tracks WAL growth and alerts DBAs before storage runs out.

    ## What you get
    - Real-time detection of runaway transaction write rates in PostgreSQL.
    - Prevents sudden database crashes caused by `pg_wal` disk volume exhaustion.
    - Accurate quantitative metrics on WAL byte production.

    ## Who it's for
    - Database Administrators and Data Platform Engineers.
    - Site Reliability Engineers maintaining mission-critical relational databases.

    ## Why orchestrate this with Kestra
    - **Native JDBC Driver Integration**: High-performance query execution without CLI wrappers.
    - **Proactive Capacity Guard**: Detects abnormal write bursts before replica lag spikes.
    - **Standardized Notification**: Dispatches actionable incident alerts directly to DBA channels.

    ## Prerequisites
    - PostgreSQL database with read permissions on `pg_current_wal_lsn()`.
    - Secret `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input PostgreSQL host, database name, and user.
    3. Run the workflow to inspect WAL LSN metrics.

    ## Links
    - [PostgreSQL Write-Ahead Logging Functions](https://www.postgresql.org/docs/current/functions-admin.html#FUNCTIONS-ADMIN-BACKUP)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
