id: vitess-tablet-health-and-routing-sentinel
namespace: company.data

inputs:
  - id: vtgate_host
    type: STRING
    displayName: VTGate Host
    defaults: "vtgate.internal"
    description: Hostname or IP address of the Vitess VTGate proxy exposing the MySQL wire protocol port.

  - id: vtgate_port
    type: INT
    displayName: VTGate Port
    defaults: 15306
    description: Port number for the MySQL wire protocol interface on VTGate (default 15306).

  - id: target_keyspace
    type: STRING
    displayName: Target Keyspace
    defaults: "@primary"
    description: Vitess keyspace and tablet routing target specification (default @primary).

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#data-platform-alerts"
    description: Slack channel destination for operational Vitess cluster incident cards.

  - id: audit_shard_topology
    type: BOOL
    displayName: Audit Shard Topology
    defaults: true
    description: Query SHOW VITESS_SHARDS when degraded tablets are identified to correlate outages with shard boundaries.

triggers:
  - id: every_fifteen_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: probe_vitess_tablets
    type: io.kestra.plugin.jdbc.mysql.Query
    url: "jdbc:mysql://{{ inputs.vtgate_host }}:{{ inputs.vtgate_port }}/{{ inputs.target_keyspace }}"
    username: "{{ secret('VITESS_USERNAME') }}"
    password: "{{ secret('VITESS_PASSWORD') }}"
    fetchType: FETCH
    allowFailure: true
    sql: "SHOW VITESS_TABLETS;"

  - id: route_by_tablet_health
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {% if outputs.probe_vitess_tablets.rows is null %}
      PROBE_FAILED
      {% else %}
        {% set primary_not_serving = 0 %}
        {% set replica_not_serving = 0 %}
        {% for row in outputs.probe_vitess_tablets.rows %}
          {% if row.State != 'SERVING' and row.TabletType == 'PRIMARY' %}
            {% set primary_not_serving = primary_not_serving + 1 %}
          {% elseif row.State != 'SERVING' %}
            {% set replica_not_serving = replica_not_serving + 1 %}
          {% endif %}
        {% endfor %}
        {% if primary_not_serving > 0 %}
        CRITICAL
        {% elseif replica_not_serving > 0 %}
        WARNING
        {% else %}
        HEALTHY
        {% endif %}
      {% endif %}
    cases:
      CRITICAL:
        - id: alert_critical_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] Vitess Primary Tablet Not Serving - Shard Write Availability Compromised",
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "Vitess Primary Tablet Failure Incident",
                  "fields": [
                    {
                      "title": "Cluster Gateway",
                      "value": "{{ inputs.vtgate_host }}:{{ inputs.vtgate_port }}",
                      "short": true
                    },
                    {
                      "title": "Degraded Tablets Count",
                      "value": "{{ outputs.probe_vitess_tablets.size }}",
                      "short": true
                    },
                    {
                      "title": "Severity",
                      "value": "CRITICAL - Primary Tablet Offline",
                      "short": true
                    },
                    {
                      "title": "Keyspace Target",
                      "value": "{{ inputs.target_keyspace }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra Vitess Sentinel | Execution ID: {{ execution.id }}"
                }
              ]
            }

        - id: check_shard_topology
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.audit_shard_topology == true }}"
          then:
            - id: query_vitess_shards
              type: io.kestra.plugin.jdbc.mysql.Query
              url: "jdbc:mysql://{{ inputs.vtgate_host }}:{{ inputs.vtgate_port }}/{{ inputs.target_keyspace }}"
              username: "{{ secret('VITESS_USERNAME') }}"
              password: "{{ secret('VITESS_PASSWORD') }}"
              fetchType: FETCH
              sql: "SHOW VITESS_SHARDS;"

            - id: log_shard_topology
              type: io.kestra.plugin.core.log.Log
              message: "Vitess cluster shard topology and primary assignments: {{ outputs.query_vitess_shards.rows }}"

      WARNING:
        - id: alert_warning_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[WARNING] Vitess Non-Serving Replica or Read-Only Tablets Detected - Redundancy Degraded",
              "attachments": [
                {
                  "color": "#F57C00",
                  "title": "Vitess Replica Tablet Warning",
                  "fields": [
                    {
                      "title": "Cluster Gateway",
                      "value": "{{ inputs.vtgate_host }}:{{ inputs.vtgate_port }}",
                      "short": true
                    },
                    {
                      "title": "Degraded Tablets Count",
                      "value": "{{ outputs.probe_vitess_tablets.size }}",
                      "short": true
                    },
                    {
                      "title": "Severity",
                      "value": "WARNING - Replica Not Serving",
                      "short": true
                    },
                    {
                      "title": "Keyspace Target",
                      "value": "{{ inputs.target_keyspace }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra Vitess Sentinel | Execution ID: {{ execution.id }}"
                }
              ]
            }

      PROBE_FAILED:
        - id: alert_probe_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] Vitess Sentinel Probe Failed - Unable to execute SHOW VITESS_TABLETS via VTGate. Verify port 15306 routing and credentials."
            }

      HEALTHY:
        - id: log_tablets_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Vitess cluster tablet routing health is normal. All evaluated tablets are in SERVING state."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Vitess tablet health audit completed. Status: {{ outputs.route_by_tablet_health.value ?? 'PROCESSED' }}. Evaluated tablets count: {{ outputs.probe_vitess_tablets.size ?? 0 }}."

errors:
  - id: on_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "[ERROR] Vitess Tablet Health Sentinel flow execution aborted unexpectedly. Execution ID: {{ execution.id }}."
      }

extend:
  title: Vitess Tablet Health & Shard Routing Sentinel
  metaTitle: Vitess Tablet Health & Routing Sentinel | Kestra
  shortDescription: Audits Vitess SHOW VITESS_TABLETS for non-serving primary and replica tablets and alerts on write outage risk.
  metaDescription: Audit Vitess SHOW VITESS_TABLETS for non-serving primary and replica tablets, dispatch Slack incident alerts, and correlate shard topology.
  description: |
    Vitess is a cloud-native database clustering system designed for horizontal scaling and sharding of MySQL. Traffic routing, connection pooling, and cross-shard query aggregation are handled by stateless VTGate proxy servers, which direct SQL operations to backend VTTablet management daemons. In production, host hardware crashes, network partitioning between VTGate and cell topologies, pod evictions during Kubernetes rolling updates, or failed emergency reparenting (VTOrc failover) can leave tablets in a `NOT_SERVING` state. When a primary tablet ceases serving, VTGate cannot route writes to that shard partition, causing immediate application query errors and transaction rollbacks. This blueprint provides automated continuous surveillance over `SHOW VITESS_TABLETS`, differentiates primary write outages from replica read degradations, alerts engineering teams via Slack, and audits `SHOW VITESS_SHARDS` topology layouts during cluster degradation.

    ## How it works

    1. Scheduled trigger (`every_fifteen_minutes`) initiates diagnostic health verification every 15 minutes, with manual runs supported via customizable inputs.
    2. Diagnostic probe (`probe_vitess_tablets`) connects to the Vitess VTGate proxy over the MySQL wire protocol (`port 15306`) via `io.kestra.plugin.jdbc.mysql.Query` and executes `SHOW VITESS_TABLETS;` to inspect all registered cluster tablets.
    3. Classification logic evaluates query output using Pebble templating, discerning whether any primary tablets are in a `NOT_SERVING` state (`CRITICAL`), if replica or read-only tablets are degraded (`WARNING`), if all tablets are serving (`HEALTHY`), or if the VTGate connection failed (`PROBE_FAILED`).
    4. Routing task (`route_by_tablet_health`) switches execution along dedicated paths according to the classified severity.
    5. On `CRITICAL` or `WARNING` states, structured Slack incident cards notify operations channels with impacted gateway endpoints, tablet counts, severity classifications, and targeted keyspaces.
    6. When primary tablet failures occur and `audit_shard_topology` is enabled, `query_vitess_shards` executes `SHOW VITESS_SHARDS;` to capture the shard partitioning boundaries and primary assignments across the affected keyspace.
    7. On `PROBE_FAILED`, dedicated alerts notify administrators of unreachable proxy ports or authentication failures.
    8. Audit log task (`log_audit_summary`) writes execution metadata and evaluated tablet counts to task logs.

    ## What you get

    - Automated continuous surveillance of Vitess tablet states across all cells, keyspaces, and shard ranges.
    - Differentiated operational alerting distinguishing critical primary write partition dropouts from replica read degradations.
    - Automated topology correlation capturing shard boundary assignments during active incident investigations.
    - Full execution traceability and audit logging without leaking database credentials in logs or alert payloads.
    - Clean code standards with strictly zero emojis across workflow definitions, notifications, and logs.

    ## Who it's for

    - Database Reliability Engineers and Platform Teams maintaining large-scale sharded Vitess clusters.
    - Site Reliability Engineers ensuring MySQL write partition availability and zero-downtime resharding.
    - Infrastructure Architects managing distributed database topologies across multiple Kubernetes zones.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition unifies distributed tablet surveillance, conditional severity triage, and topology diagnostics into version-controlled GitOps workflows.
    - Native MySQL JDBC plugin connectivity communicates directly with VTGate's MySQL wire protocol without external agent daemons or Python container overhead.
    - Built-in conditional routing isolates healthy baseline checks from multi-tiered incident notification cards.
    - Immutable execution history provides operational evidence documenting tablet recovery timelines and shard failover durations.
    - Cloud-native scheduling and flow-level error-trapping ensure continuous sentinel operation independent of external cron infrastructure.

    ## Prerequisites

    - Vitess cluster running with VTGate MySQL wire compatibility enabled (default port 15306).
    - Database user with permissions to execute `SHOW VITESS_TABLETS` and `SHOW VITESS_SHARDS` via VTGate.
    - Slack incoming webhook URL for operational incident dispatch.

    ### Secrets

    - `VITESS_USERNAME`: Username for authenticating to the Vitess VTGate MySQL interface.
    - `VITESS_PASSWORD`: Password for the Vitess database user.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for posting incident cards to Slack.

    ## Quick start

    1. Configure `VITESS_USERNAME`, `VITESS_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Deploy this blueprint to your Kestra instance and trigger an initial run with default inputs to verify connectivity against your VTGate server.
    3. Review the execution log in the Kestra UI to verify tablet query execution from `SHOW VITESS_TABLETS`.
    4. Enable the `every_fifteen_minutes` schedule trigger to activate automated continuous monitoring.

    ## How to extend

    - Add `SHOW VITESS_REPLICATION_STATUS;` checks to detect replication lag and throttler delays across replica tablets.
    - Integrate PagerDuty alerting via `io.kestra.plugin.notifications.pagerduty.PagerDutyAlert` for immediate on-call escalation during primary shard dropouts.
    - Attach VTOrc (Vitess Orchestrator) API probes to monitor automated failover decision queues.

    ## Links

    - [Vitess SHOW Statements Documentation](https://vitess.io/docs/reference/features/show-statements/)
    - [Vitess Architecture Overview](https://vitess.io/docs/overview/architecture/)
    - [Vitess Tablets Configuration Reference](https://vitess.io/docs/reference/programs/vttablet/)
    - [Kestra MySQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
