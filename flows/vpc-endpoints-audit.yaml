id: vpc-endpoints-audit
namespace: company.finops

description: |
  Audits VPC endpoints for over-provisioned AZ coverage. Interface endpoints
  cost ~$7.20/month per AZ — a 3-AZ endpoint for a single-AZ workload wastes
  $14.40/month. This flow lists every endpoint, counts its AZ footprint, and
  reports the over-provisioned ones with savings estimates.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for VPC endpoint coverage.
  - id: monthly_cost_per_az_usd
    type: STRING
    defaults: "7.20"
    description: Monthly cost of one interface endpoint per AZ in USD ($0.01/hr).
  - id: min_azs
    type: INT
    defaults: 2
    description: Endpoints spanning more AZs than this are flagged for review.

tasks:
  - id: audit_endpoints
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit VPC endpoints region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List endpoints and measure AZ coverage per endpoint.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            PRICE="{{ inputs.monthly_cost_per_az_usd }}"
            MINAZ={{ inputs.min_azs }}
            echo "Checking VPC endpoints in $REGION"
            aws ec2 describe-vpc-endpoints --region "$REGION" \
              --query 'VpcEndpoints[?State==`available`].[VpcEndpointId,VpcEndpointType,ServiceName]' \
              --output text > /tmp/eps.txt || true
            FLAG_COUNT=0
            FLAG_LIST=""
            while read -r EPID EPTYPE SVC; do
              [ -z "$EPID" ] && continue
              if [ "$EPTYPE" = "Interface" ]; then
                AZS=$(aws ec2 describe-vpc-endpoints --region "$REGION" \
                  --vpc-endpoint-ids "$EPID" \
                  --query 'length(VpcEndpoints[0].SubnetIds)' --output text 2>/dev/null)
                case "$AZS" in ''|'None') AZS=0;; esac
                echo "endpoint $EPID ($SVC): $AZS AZs"
                if [ "$AZS" -gt "$MINAZ" ]; then
                  WASTE_AZS=$((AZS - MINAZ))
                  WASTE=$(python3 -c "print('{:.2f}'.format($WASTE_AZS * float('$PRICE')))")
                  FLAG_LIST="${FLAG_LIST}${EPID} (${SVC}: ${AZS} AZs, ~\$${WASTE}/mo over), "
                  FLAG_COUNT=$((FLAG_COUNT + 1))
                fi
              fi
            done < /tmp/eps.txt
            if [ "$FLAG_COUNT" -gt 0 ]; then HAS_FLAG=true; else HAS_FLAG=false; fi
            echo "HAS_FLAG=$HAS_FLAG"
            echo "FLAG_COUNT=$FLAG_COUNT"
            echo "FLAG_EPS=$FLAG_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report over-provisioned endpoint coverage.
        condition: "{{ outputs.audit_region.vars.HAS_FLAG == 'true' }}"
        then:
          - id: slack_flag
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":money_with_wings: VPC endpoint audit in `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.FLAG_COUNT }}* endpoint(s) over-provisioned on AZ coverage.\n`{{ outputs.audit_region.vars.FLAG_EPS }}`\nTrim subnets to the AZs your workloads actually run in."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "VPC endpoint coverage looks right in {{ outputs.audit_region.vars.REGION_DONE }} — no over-provisioned endpoints."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: VPC Endpoints Coverage Audit
  metaTitle: Audit VPC Endpoint AZ Coverage Waste | Kestra
  shortDescription: Audit interface VPC endpoints across regions for over-provisioned AZ coverage, and get a Slack report of the wasteful ones with savings estimates.
  metaDescription: Interface endpoints cost ~$7.20/mo per AZ. This flow finds over-provisioned AZ coverage and reports the waste weekly.
  description: |
    An interface VPC endpoint costs about $7.20/month per Availability Zone — and most get created with "all AZs" because that's the console default. A single-AZ workload behind a 3-AZ endpoint wastes $14.40/month per service, per VPC, forever. This blueprint audits the real AZ footprint of every endpoint.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists available VPC endpoints, then counts the subnets (AZs) each interface endpoint spans.
    4. Endpoints spanning more AZs than `min_azs` are flagged, with waste estimated per extra AZ.
    5. An `If` task posts a Slack report with the over-provisioned endpoints only when something is actually wasteful.

    ## What you get

    - A weekly list of endpoints with more AZ coverage than needed, with per-endpoint waste estimates.
    - A concrete trim list — remove subnets from the AZs your workloads don't use.
    - Multi-region coverage in one run.
    - Silence when coverage is right-sized — alerts only on real findings.

    ## Who it's for

    Platform engineers and FinOps teams running private subnets with VPC endpoints, where "enable all AZs" was the path of least resistance.

    ## Why orchestrate this with Kestra

    A one-off CLI session finds today's waste and is forgotten by next month. As a scheduled Kestra flow the audit runs itself, the AZ threshold is an input anyone can tune, every run is logged for audit, and adding a region is one list entry — not a new script.

    ## Prerequisites

    - AWS credentials with `ec2:DescribeVpcEndpoints` permission.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EC2 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EC2 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the audit report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions you run VPCs in, and `min_azs` to your real AZ footprint.
    3. Run manually once and review the Slack report (or the clean log line).
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Cross-check endpoint AZs against where your workloads actually run (ECS/EKS placement).
    - Flag Gateway endpoints with unused route-table associations too.
    - Track endpoint-hours in Cost Explorer to validate the savings after trimming.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [VPC endpoint pricing](https://aws.amazon.com/privatelink/pricing/)
    - [EC2 describe-vpc-endpoints API](https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-vpc-endpoints.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
