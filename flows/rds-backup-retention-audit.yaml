id: rds-backup-retention-audit
namespace: company.dba

description: |
  Audits RDS automated backup retention across regions. BackupRetentionPeriod=0
  means NO automated backups — a data-loss and compliance risk. Retention above
  max_retention_days means excess backup storage spend. Reports both with a
  two-section Slack message; changes nothing.

inputs:
  - id: aws_regions
    "type": ARRAY
    "itemType": STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for RDS backup retention.
  - id: max_retention_days
    "type": INT
    defaults: 7
    description: Instances retaining backups longer than this count as over-retained (AWS default is 7).

tasks:
  - id: check_regions
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit RDS backup retention region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List DB instances and categorize each as backup risk or over-retained.
        region: "{{ taskrun.value }}"
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - |
            REGION="{{ taskrun.value }}"
            MAX={{ inputs.max_retention_days }}
            echo "Auditing RDS backup retention in $REGION (max ${MAX}d)"
            INSTANCES=$(aws rds describe-db-instances \
              --query 'DBInstances[].[DBInstanceIdentifier,BackupRetentionPeriod,Engine,DBInstanceClass,AllocatedStorage]' \
              --output text)
            RISK_LIST=""; RISK_COUNT=0
            WASTE_LIST=""; WASTE_COUNT=0; EXCESS_GB=0
            while IFS=$'\t' read -r ID RET ENGINE CLASS STORAGE; do
              case "$ID" in ''|'None') continue;; esac
              case "$RET" in ''|'None') RET=0;; esac
              case "$STORAGE" in ''|'None') STORAGE=0;; esac
              if [ "$RET" -eq 0 ]; then
                RISK_LIST="${RISK_LIST}${ID} (${ENGINE}/${CLASS}), "
                RISK_COUNT=$((RISK_COUNT + 1))
              elif [ "$RET" -gt "$MAX" ]; then
                EXCESS=$((RET - MAX))
                WASTE_LIST="${WASTE_LIST}${ID} (retention ${RET}d, ${EXCESS}d over max), "
                WASTE_COUNT=$((WASTE_COUNT + 1))
                EXCESS_GB=$((EXCESS_GB + STORAGE * EXCESS))
              fi
            done <<< "$INSTANCES"
            echo "REGION_DONE=$REGION"
            echo "RISK_COUNT=$RISK_COUNT"
            echo "RISK_LIST=$RISK_LIST"
            echo "WASTE_COUNT=$WASTE_COUNT"
            echo "WASTE_LIST=$WASTE_LIST"
            echo "EXCESS_BACKUP_GB=$EXCESS_GB"
            if [ "$RISK_COUNT" -gt 0 ] || [ "$WASTE_COUNT" -gt 0 ]; then
              echo "RDS backup audit in $REGION: $RISK_COUNT instance(s) with NO automated backups, $WASTE_COUNT over-retained."
              echo "FINDINGS_FOUND"
            else
              echo "RDS backup audit in $REGION: all instances have sane retention."
            fi
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report backup risks and over-retention, stay quiet when everything is sane.
        condition: "{{ outputs.audit_region.stdout contains 'FINDINGS_FOUND' }}"
        then:
          - id: slack_report
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":rotating_light: *RDS backup retention audit* — `{{ outputs.audit_region.vars.REGION_DONE }}`\n*NO automated backups (retention = 0, data-loss risk):* {{ outputs.audit_region.vars.RISK_COUNT }} instance(s):\n`{{ outputs.audit_region.vars.RISK_LIST }}`\n*Over-retained (> {{ inputs.max_retention_days }}d, excess backup storage):* {{ outputs.audit_region.vars.WASTE_COUNT }} instance(s), ~{{ outputs.audit_region.vars.EXCESS_BACKUP_GB }} excess GB retained:\n`{{ outputs.audit_region.vars.WASTE_LIST }}`\nFix unprotected instances: `aws rds modify-db-instance --db-instance-identifier <id> --backup-retention-period {{ inputs.max_retention_days }} --apply-immediately`"
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "All RDS instances in {{ outputs.audit_region.vars.REGION_DONE }} have backup retention between 1 and {{ inputs.max_retention_days }} days — nothing to fix."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Monday at 09:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 9 * * 1"
    disabled: true

extend:
  title: RDS Backup Retention Audit
  metaTitle: Audit RDS Backup Retention for Risk and Waste | Kestra
  shortDescription: Scan RDS instances across regions for disabled automated backups (data-loss risk) and over-long retention (excess backup cost), with a two-section Slack report.
  metaDescription: BackupRetentionPeriod=0 means no automated backups. This weekly flow flags unprotected RDS instances and over-retained ones wasting backup storage.
  description: |
    RDS backup retention is one of those settings nobody reviews: a `BackupRetentionPeriod` of 0 means automated backups are completely off — one bad deploy or fat-fingered delete and there is nothing to restore from. On the other end, 30-day retention on a multi-TB instance quietly inflates backup storage bills. This blueprint checks every instance across your regions and reports both problems. Advisory only: it never modifies an instance.

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 09:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow describes all DB instances (identifier, retention, engine, class, allocated storage).
    4. Bash categorizes each instance: retention 0 becomes a RISK (no automated backups); retention above `max_retention_days` (default 7) becomes WASTE with a rough estimate of excess backup GB.
    5. An `If` task posts a Slack report with two sections — the risk list and the waste list — only when there is something to say.

    ## What you get

    - A weekly two-section report: instances with backups disabled (compliance/data-loss risk) and instances over-retained (cost waste).
    - A rough estimate of excess backup GB per over-retained instance.
    - The exact `modify-db-instance` command to fix unprotected instances.
    - Silence on clean weeks.

    ## Who it's for

    DBAs, platform engineers, and compliance-minded teams who assume backups are on everywhere — and would like proof.

    ## Why orchestrate this with Kestra

    Retention drifts every time someone tweaks an instance by hand. As a scheduled flow the check is continuous, the threshold is an input anyone can tune, every run is logged for audit, and adding a region is one list entry — not a new script.

    ## Prerequisites

    - AWS credentials with `rds:DescribeDBInstances` permission.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the RDS API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the RDS API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the audit report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` and tune `max_retention_days` to your backup policy.
    3. Run manually once and review the Slack report (or the clean log line).
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Cover Aurora clusters too via `describe-db-clusters` (they expose `BackupRetentionPeriod` the same way).
    - Also check backup windows and preferred maintenance windows for compliance.
    - Add a per-instance dollar estimate using the region's backup storage price.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [RDS automated backups](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.html)
    - [RDS backup storage pricing](https://aws.amazon.com/rds/pricing/)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
