id: vault-backup-verify-drill
namespace: company.team
description: |
  Verify that a HashiCorp Vault backup is both fresh and restorable instead of
  trusting that a snapshot job reported success. A keyed webhook runs the drill
  on demand and a disabled weekly schedule holds the drill day slot. The flow
  pulls raft snapshot metadata out of the official Vault container, falls back
  to a bundled manifest when no leader answers, turns that manifest into a
  freshness verdict with the snapshot age and id, then restores the snapshot
  into a scratch namespace to prove the backup can actually come back. A stale
  backup opens a GitHub issue and pings Slack, a failed restore drill escalates
  again, and the verdict, snapshot age, snapshot id, and verification flag are
  published as outputs.

triggers:
  - id: on_demand_verify
    type: io.kestra.plugin.core.trigger.Webhook
    description: POST here to verify a Vault backup on demand, for example after a restore rehearsal or ahead of an upgrade window.
    key: "{{ secret('VAULT_DRILL_WEBHOOK_KEY') }}"
  - id: weekly_drill_day
    type: io.kestra.plugin.core.trigger.Schedule
    description: Drill day net, every Wednesday at 06:00 UTC; shipped disabled until an operator switches it on.
    cron: "0 6 * * 3"
    disabled: true

inputs:
  - id: max_snapshot_age_days
    type: INT
    defaults: 7
    description: Age budget in days for the newest raft snapshot, anything older is judged stale and escalates.
  - id: vault_addr
    type: STRING
    defaults: https://vault.example.test:8200
    description: Vault server address handed to both containers as VAULT_ADDR for the snapshot capture and the restore drill.

tasks:
  # --- 1. snapshot metadata and freshness verdict ---
  - id: drill_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the captured snapshot, the manifest parser, and the restore drill all read the same backup.snap file.
    tasks:
      - id: capture_snapshot
        type: io.kestra.plugin.scripts.shell.Commands
        description: Request a raft snapshot from the configured server with the exit code absorbed, then fall back to a bundled snapshot-manifest.json heredoc so the verdict still has metadata when no leader answers.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          entryPoint: []
        containerImage: hashicorp/vault:1.17.2
        env:
          VAULT_ADDR: "{{ inputs.vault_addr }}"
          VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
        outputFiles:
          - snapshot-manifest.json
        commands:
          - |
            set -u
            cat > snapshot-manifest.json <<'JSON'
            {
              "snapshot_id": "raft-2026-09-30-060000",
              "taken_at": "2026-09-30T06:00:00Z",
              "size_bytes": 1048576
            }
            JSON

            echo "requesting a raft snapshot from ${VAULT_ADDR}"
            vault operator raft snapshot save backup.snap || true
            if [ -s backup.snap ]; then
              size_bytes=$(wc -c < backup.snap | tr -d ' ')
              taken_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              snapshot_id="raft-$(date -u +%Y%m%d%H%M%S)"
              printf '{"snapshot_id": "%s", "taken_at": "%s", "size_bytes": %s}\n' "${snapshot_id}" "${taken_at}" "${size_bytes}" > snapshot-manifest.json
              echo "captured snapshot ${snapshot_id} of ${size_bytes} bytes at ${taken_at}"
            else
              echo "no Vault leader reachable from this worker, keeping the bundled manifest"
            fi
            echo "manifest bytes $(wc -c < snapshot-manifest.json)"

      - id: evaluate_freshness
        type: io.kestra.plugin.scripts.python.Script
        description: Turn snapshot-manifest.json into a staleness verdict with the whole-day snapshot age and the snapshot id, emitting them through the outputs protocol for the branch below.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.12-slim
        env:
          MAX_SNAPSHOT_AGE_DAYS: "{{ inputs.max_snapshot_age_days }}"
        script: |
          import datetime
          import json
          import os

          def parse_timestamp(value):
              text = str(value or "").strip()
              if not text:
                  return None
              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"
              try:
                  stamp = datetime.datetime.fromisoformat(text)
              except ValueError:
                  return None
              if stamp.tzinfo is None:
                  stamp = stamp.replace(tzinfo=datetime.timezone.utc)
              return stamp

          manifest_path = "snapshot-manifest.json"
          manifest = {}
          if os.path.exists(manifest_path) and os.path.getsize(manifest_path) > 0:
              try:
                  with open(manifest_path, "r") as handle:
                      manifest = json.load(handle)
              except ValueError:
                  manifest = {}
          if not isinstance(manifest, dict):
              manifest = {}

          try:
              max_age = int(os.environ.get("MAX_SNAPSHOT_AGE_DAYS", "7"))
          except ValueError:
              max_age = 7
          if max_age < 1:
              max_age = 1

          snapshot_id = str(manifest.get("snapshot_id") or "unknown").strip() or "unknown"
          taken = parse_timestamp(manifest.get("taken_at"))
          now = datetime.datetime.now(datetime.timezone.utc)

          if taken is None:
              age_days = -1
              stale = True
          else:
              elapsed = (now - taken).total_seconds() / 86400.0
              age_days = int(elapsed) if elapsed > 0 else 0
              stale = age_days > max_age

          verdict = "STALE" if stale else "FRESH"
          payload = {
              "verdict": verdict,
              "snapshot_age_days": age_days,
              "snapshot_id": snapshot_id,
              "stale": stale,
          }
          print("snapshot=%s age_days=%d budget=%d verdict=%s" % (snapshot_id, age_days, max_age, verdict))
          print("::" + json.dumps({"outputs": payload}) + "::")

      - id: check_freshness
        type: io.kestra.plugin.core.flow.If
        description: Branch on the freshness verdict, a snapshot outside the age budget escalates while a fresh one is only logged.
        condition: "{{ outputs.evaluate_freshness.vars.stale == true }}"
        then:
          - id: open_stale_issue
            type: io.kestra.plugin.github.issues.Create
            description: Open a labeled issue on the runbooks repository so a stale backup becomes tracked work instead of a silent gap.
            jwtToken: "{{ secret('GITHUB_TOKEN') }}"
            repository: your-org/vault-runbooks
            title: "Stale Vault backup at {{ inputs.vault_addr }}"
            body: |
              ## Vault backup freshness drill

              The newest raft snapshot for **{{ inputs.vault_addr }}** is **{{ outputs.evaluate_freshness.vars.snapshot_age_days }} day(s)** old against a budget of **{{ inputs.max_snapshot_age_days }} day(s)**.

              Snapshot id `{{ outputs.evaluate_freshness.vars.snapshot_id }}`, verdict **{{ outputs.evaluate_freshness.vars.verdict }}**.

              Execution {{ execution.id }}

              Capture a fresh snapshot, then re-run this flow and confirm the verdict flips to FRESH before closing this issue.
            labels:
              - vault
              - backup
          - id: alert_stale_backup
            type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
            description: Tell ops the backup is older than the age budget and that a tracking issue is waiting.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "Vault backup STALE at {{ inputs.vault_addr }} - snapshot {{ outputs.evaluate_freshness.vars.snapshot_id }} is {{ outputs.evaluate_freshness.vars.snapshot_age_days }} day(s) old against a {{ inputs.max_snapshot_age_days }} day budget. Issue opened in your-org/vault-runbooks. Execution {{ execution.id }}."
              }
        else:
          - id: log_fresh_backup
            type: io.kestra.plugin.core.log.Log
            description: Record the fresh result so the execution history doubles as backup evidence.
            message: "Vault backup fresh at {{ inputs.vault_addr }} - snapshot {{ outputs.evaluate_freshness.vars.snapshot_id }} is {{ outputs.evaluate_freshness.vars.snapshot_age_days }} day(s) old."

      # --- 2. restore drill ---
      - id: restore_drill
        type: io.kestra.plugin.scripts.shell.Commands
        description: Restore the captured snapshot into a scratch namespace with the exit code absorbed, writing the command output to restore-check.txt so the verdict below reads evidence rather than an exit code.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          entryPoint: []
        containerImage: hashicorp/vault:1.17.2
        env:
          VAULT_ADDR: "{{ inputs.vault_addr }}"
          VAULT_NAMESPACE: drill-scratch
          VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
        outputFiles:
          - restore-check.txt
        commands:
          - |
            set -u
            mkdir -p scratch
            echo "restore drill against ${VAULT_ADDR} in namespace ${VAULT_NAMESPACE}"
            vault operator raft snapshot restore -check backup.snap scratch/restored.snap > restore-check.txt 2>&1 || true
            if [ ! -s restore-check.txt ]; then
              echo "the restore command produced no output for ${VAULT_ADDR}" > restore-check.txt
            fi

            if [ -s scratch/restored.snap ]; then
              echo "restore_check=passed" >> restore-check.txt
            else
              echo "restore_check=failed" >> restore-check.txt
            fi
            echo "restore check bytes $(wc -c < restore-check.txt)"

      - id: parse_restore
        type: io.kestra.plugin.scripts.python.Script
        description: Read restore-check.txt and emit verified true only when the drill marker reports a passed restore, carrying a short reason into the escalation below.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.12-slim
        env:
          VAULT_ADDR: "{{ inputs.vault_addr }}"
        script: |
          import json
          import os

          path = "restore-check.txt"
          text = ""
          if os.path.exists(path) and os.path.getsize(path) > 0:
              with open(path, "r", errors="replace") as handle:
                  text = handle.read()

          vault_addr = os.environ.get("VAULT_ADDR", "vault")
          verified = False
          if not text:
              reason = "the drill produced no restore-check.txt"
          else:
              markers = [line.strip() for line in text.splitlines()
                         if line.strip().startswith("restore_check=")]
              marker = markers[-1] if markers else ""
              if marker == "restore_check=passed":
                  verified = True
                  reason = "raft snapshot restored cleanly at " + vault_addr
              elif marker.startswith("restore_check=failed"):
                  verified = False
                  reason = "restore target scratch/restored.snap came up empty at " + vault_addr
              else:
                  verified = False
                  reason = "restore-check.txt carried no restore_check marker"

          print("verified=" + str(verified).lower() + " reason=" + reason)
          print("::" + json.dumps({"outputs": {"verified": verified, "reason": reason}}) + "::")

  # --- 3. verification gate ---
  - id: check_restore
    type: io.kestra.plugin.core.flow.If
    description: Escalate when the drill could not restore the snapshot, because a backup that cannot be restored is a backup that does not exist.
    condition: "{{ outputs.parse_restore.vars.verified == false }}"
    then:
      - id: escalate_unrestorable
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Alert ops that the newest snapshot failed the restore drill, with the reason and the execution id.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Vault restore drill FAILED at {{ inputs.vault_addr }} - snapshot {{ outputs.evaluate_freshness.vars.snapshot_id }} ({{ outputs.evaluate_freshness.vars.snapshot_age_days }} day(s) old, verdict {{ outputs.evaluate_freshness.vars.verdict }}) could not be restored. {{ outputs.parse_restore.vars.reason }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_restorable
        type: io.kestra.plugin.core.log.Log
        description: Record the verified result so the execution history doubles as drill evidence.
        message: "Vault backup verified at {{ inputs.vault_addr }} - snapshot {{ outputs.evaluate_freshness.vars.snapshot_id }} is {{ outputs.evaluate_freshness.vars.snapshot_age_days }} day(s) old and restored cleanly."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    description: Freshness verdict, FRESH when the newest snapshot fits the age budget and STALE otherwise.
    value: "{{ outputs.evaluate_freshness.vars.verdict }}"
  - id: snapshot_age_days
    type: INT
    description: Whole days since the newest raft snapshot, where -1 means the manifest carried no parseable taken_at value.
    value: "{{ outputs.evaluate_freshness.vars.snapshot_age_days }}"
  - id: snapshot_id
    type: STRING
    description: Identifier of the snapshot that was inspected, for example raft-20261005060000.
    value: "{{ outputs.evaluate_freshness.vars.snapshot_id }}"
  - id: verified
    type: BOOL
    description: True when the restore drill rebuilt the snapshot into the scratch namespace, false when the backup could not be restored.
    value: "{{ outputs.parse_restore.vars.verified }}"

extend:
  title: Verify HashiCorp Vault Backups Are Fresh and Restorable
  metaTitle: Vault Backup Freshness and Restore Drills with Kestra
  shortDescription: Check raft snapshot age on a webhook or drill day, restore it into a scratch namespace, and escalate stale or unrestoreable backups.
  metaDescription: Verify HashiCorp Vault raft backups are fresh and restorable, then escalate stale snapshots and failed restore drills to Slack and GitHub.
  description: |
    A backup job that only reports "taken" proves nothing about recovery. This blueprint runs the second half of the promise. A keyed webhook triggers an on-demand verify and a disabled weekly schedule reserves drill day. The flow asks the official Vault container for a raft snapshot, keeps a bundled manifest when no leader answers, and turns that manifest into a freshness verdict carrying the snapshot age and id. A stale snapshot opens a labeled GitHub issue and pings Slack, then a restore drill rebuilds the snapshot into a scratch namespace and a second pass over the drill output decides whether the backup is genuinely restorable. A failed drill escalates to Slack before the verdict, age, snapshot id, and verification flag are published as outputs.

    ## How it works

    1. `on_demand_verify` (`io.kestra.plugin.core.trigger.Webhook`) exposes a keyed URL for a post-incident or pre-upgrade check, and `weekly_drill_day` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * 3`) ships `disabled: true` so nothing runs until drill day is switched on.
    2. `drill_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared filesystem so the capture, the parser, and the restore drill all see the same `backup.snap`.
    3. `capture_snapshot` (`io.kestra.plugin.scripts.shell.Commands` on the `io.kestra.plugin.scripts.runner.docker.Docker` runner, image `hashicorp/vault:1.17.2`) writes a `snapshot-manifest.json` fixture with a heredoc, then runs `vault operator raft snapshot save backup.snap || true`. When a leader answers, the manifest is rewritten from the real capture with the snapshot id, the UTC timestamp, and the byte size; when nothing answers, the fixture keeps the flow deterministic offline. `entryPoint: []` clears the image entrypoint so the script runs instead of a server command.
    4. `evaluate_freshness` (`io.kestra.plugin.scripts.python.Script` on `python:3.12-slim`) parses `taken_at`, computes whole days of age against `max_snapshot_age_days`, and emits `verdict`, `snapshot_age_days`, `snapshot_id`, and `stale` through Kestra's outputs protocol. An unparseable timestamp reports age -1 and counts as stale, so missing evidence fails closed.
    5. `check_freshness` (`io.kestra.plugin.core.flow.If`) branches on `stale`. When true, `open_stale_issue` (`io.kestra.plugin.github.issues.Create`) files a labeled issue with the age and budget, and `alert_stale_backup` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts the same numbers to Slack. When false, `log_fresh_backup` records the all-clear.
    6. `restore_drill` runs `vault operator raft snapshot restore -check backup.snap scratch/restored.snap > restore-check.txt 2>&1 || true` inside the same container image and namespace `drill-scratch`, then appends `restore_check=passed` or `restore_check=failed` based on whether the restore target came back non-empty.
    7. `parse_restore` reads `restore-check.txt` and emits `verified` plus a short `reason`. `check_restore` (`io.kestra.plugin.core.flow.If`) escalates to `escalate_unrestorable` when `verified == false`, while a verified drill lands in `log_restorable`.
    8. The `errors` block alerts Slack whenever a step breaks outright, because a dead drill looks a lot like a quiet pass.

    ## What you get

    - Gateable outputs: `verdict`, `snapshot_age_days`, `snapshot_id`, and `verified` are available to any downstream flow or dashboard.
    - Proof of restorability instead of proof of scheduling, the restore runs on every drill and its evidence is kept as `restore-check.txt`.
    - Escalation where engineers already work, a labeled GitHub issue plus a Slack message when the backup is stale, and a Slack alert when it will not restore.
    - An audit trail, every execution is a dated record of snapshot age, snapshot id, and restore outcome.

    ## Who it's for

    - Platform and SRE teams who must show that Vault backups are recovered on a schedule, not merely taken.
    - Security engineers treating untested backups as an availability and compliance risk.
    - On-call engineers who want stale or unrestoreable backups to arrive in Slack and in the backlog automatically.

    ## Why orchestrate this with Kestra

    Snapshot cron jobs are easy to add and easy to stop watching. Kestra supplies the loop around the tool: a keyed webhook for on-demand verification, a disabled-by-default weekly schedule for drill day, a hermetic container so the Vault CLI version lives in the flow file, a freshness branch that turns age into tracked work, a restore branch that turns evidence into an alert, and execution history with the drill output attached. A cron line running `vault operator raft snapshot save` gives you none of that, it only writes a file that nobody re-reads.

    ## Prerequisites

    - A worker with Docker access, both shell steps run in `hashicorp/vault:1.17.2` and both parsers in `python:3.12-slim`.
    - A Vault server address reachable from the worker for a real drill. Without one the flow still completes on the bundled manifest and reports `verified` false, which is the honest answer for an unreachable backup target.
    - A token that can run `operator raft snapshot` against the target cluster, stored as `VAULT_TOKEN`.
    - A GitHub token that can open issues in the runbooks repository (classic PAT scope `repo`, or fine-grained **Issues: write**).
    - A Slack incoming webhook for the stale and unrestorable alerts plus failure notifications.

    ### Secrets

    - `VAULT_DRILL_WEBHOOK_KEY`: key segment guarding the on-demand webhook URL, anyone holding it can start a drill.
    - `VAULT_TOKEN`: token presented to the Vault server for the snapshot capture and the restore drill.
    - `GITHUB_TOKEN`: token used to open the stale backup issue.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL.

    ## Quick start

    1. Add the four secrets to your Kestra namespace.
    2. Set `vault_addr` to the cluster under test and lower `max_snapshot_age_days` to 1 to watch a stale backup escalate.
    3. Run the flow once with defaults and read `verdict`, `snapshot_age_days`, `snapshot_id`, and `verified` in the outputs.
    4. Trigger `on_demand_verify` at `/api/v1/{tenant}/executions/webhook/{namespace}/vault-backup-verify-drill/{VAULT_DRILL_WEBHOOK_KEY}`, then enable `weekly_drill_day` once the worker can reach Vault.
    5. Point `repository` in `open_stale_issue` at your own runbooks repository before the first stale run.

    ## How to extend

    - Verify more clusters by fanning the `vault_addr` input out with a `Loop` over a cluster list, one execution per cluster.
    - Ship `restore-check.txt` to S3 with `io.kestra.plugin.aws.s3.Upload` so drill evidence survives outside Kestra.
    - Add a `core.flow.Sleep` and a second capture after the drill to prove a fresh snapshot lands within the recovery point objective.
    - Turn a failed drill into a red run by adding `io.kestra.plugin.core.execution.Fail` under `check_restore`.

    ## Links

    - [Vault raft snapshot documentation](https://developer.hashicorp.com/vault/docs/commands/raft/snapshot)
    - [Kestra Docker task runner](https://kestra.io/plugins/plugin-scripts-docker)
    - [Kestra GitHub plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - backup
    - disaster-recovery
    - monitoring
  ee: false
  demo: false
