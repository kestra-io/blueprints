id: npm-dependency-release-health-watch
namespace: company.team
description: |
  Audits the Node.js dependencies declared in a package.json against the official npm registry.
  It checks whether pinned package versions are deprecated, outdated, or have had no updates for a long time (stale),
  and sends a Slack alert only when new issues are detected.

inputs:
  - id: package_json_url
    type: STRING
    description: Raw HTTPS URL of the package.json file to inspect. Works for any public repository on GitHub, GitLab, etc.
    defaults: https://raw.githubusercontent.com/expressjs/express/master/package.json
  - id: include_dev_dependencies
    type: BOOLEAN
    description: Whether to include devDependencies in the health check in addition to runtime dependencies.
    defaults: false
  - id: max_packages
    type: INT
    description: Maximum number of packages to audit in a single execution.
    defaults: 25
  - id: outdated_threshold
    type: SELECT
    description: Minimum version lag required to mark a dependency as OUTDATED. Selecting major checks only for major version differences (or minor for 0.x packages).
    values:
      - major
      - minor
      - patch
    defaults: major
  - id: stale_after_days
    type: INT
    description: A package is flagged as STALE if its latest release is older than this many days.
    defaults: 365

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every Monday at 08:00 UTC. Disabled by default until you configure the Slack incoming webhook.
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: fetch_package_json
    type: io.kestra.plugin.core.http.Request
    description: Download the package.json file from the specified URL.
    uri: "{{ inputs.package_json_url }}"
    method: GET

  - id: list_packages
    type: io.kestra.plugin.transform.jsonata.TransformValue
    description: Parse dependencies from the package.json, filter out non-semver packages, clean range specifiers, and limit to max_packages.
    from: "{{ outputs.fetch_package_json.body }}"
    expression: |
      (
        $deps := {{ inputs.include_dev_dependencies }} ? $merge([dependencies, devDependencies]) : dependencies;
        $validKeys := $keys($deps)[$lookup($deps, $) ~> /^[~^>=<]*[0-9]/];
        $all := $validKeys.{
          "name": $,
          "pinned": $replace($lookup($deps, $), /^[^0-9]*/, "")
        };
        $all[[0..{{ inputs.max_packages }} - 1]]
      )

  - id: check_packages
    type: io.kestra.plugin.core.flow.Loop
    description: Query the npm registry for each package and assess health against the pinned version.
    values: "{{ outputs.list_packages.value | toJson }}"
    concurrencyLimit: 2
    outputs:
      - id: verdict
        type: JSON
        value: "{{ outputs.assess_health.value }}"
    tasks:
      - id: fetch_npm_metadata
        type: io.kestra.plugin.core.http.Request
        description: Query the npm registry API for package metadata and release history.
        uri: "https://registry.npmjs.org/{{ item.value.name | replace('/', '%2F') }}"
        method: GET
        headers:
          Accept: "application/json"
        retry:
          type: constant
          interval: PT3S
          maxAttempts: 3

      - id: assess_health
        type: io.kestra.plugin.transform.jsonata.TransformValue
        description: Assess whether the pinned version is deprecated, outdated, or stale.
        from: "{{ outputs.fetch_npm_metadata.body }}"
        expression: |
          (
            $pinned := "{{ item.value.pinned }}";
            $latest := `dist-tags`.latest;
            $currentVer := $lookup(versions, $pinned);
            $deprecated := $currentVer ? $currentVer.deprecated : null;
            $releaseTime := $lookup(time, $latest);
            $age := $releaseTime ? ($toMillis($now()) - $toMillis($releaseTime)) / 86400000 : 0;
            $p := $split($pinned, ".");
            $l := $split($latest, ".");
            $behind := (
              ($number($l[0]) > $number($p[0]) or ($p[0] = "0" and $l[0] = "0" and $number($l[1]) > $number($p[1]))) ? 3
              : ($number($l[0]) = $number($p[0]) and $number($l[1]) > $number($p[1])) ? 2
              : ($pinned != $latest) ? 1
              : 0
            );
            $needed := {"major": 3, "minor": 2, "patch": 1}."{{ inputs.outdated_threshold }}";
            $status := $deprecated ? "DEPRECATED"
              : ($count($currentVer) = 0 and $pinned != $latest) ? "UNKNOWN_VERSION"
              : $age > {{ inputs.stale_after_days }} ? "STALE"
              : $behind >= $needed ? "OUTDATED"
              : "OK";
            {
              "package": name,
              "pinned": $pinned,
              "latest": $latest,
              "days_since_update": $round($age),
              "status": $status,
              "deprecation": $deprecated
            }
          )

      - id: pause_for_rate_limit
        type: io.kestra.plugin.core.flow.Sleep
        description: Brief pause to respect registry capacity and avoid throttling.
        duration: PT0.5S

  - id: summarize
    type: io.kestra.plugin.transform.jsonata.TransformValue
    description: Aggregate all individual verdicts and build the formatted notification message.
    from: "{{ outputs.check_packages.outputs | toJson }}"
    expression: |
      (
        $all := outputs.verdict;
        $bad := $all[status != "OK"];
        {
          "checked": $count($all),
          "problem_count": $count($bad),
          "message": $count($bad) = 0
            ? "All " & $count($all) & " npm dependencies look healthy."
            : "npm dependency health: " & $count($bad) & " of " & $count($all) & " packages need attention." & "\n" &
              $join($bad.(
                "• " & package & " " & pinned & ": " & status &
                (status = "DEPRECATED" ? " (deprecation note: " & deprecation & ")" : "") &
                ". Latest stable is " & latest & ", updated " & days_since_update & " days ago."
              ), "\n")
        }
      )

  - id: previous_report
    type: io.kestra.plugin.core.kv.Get
    description: Retrieve the last saved report from the KV store to check for changes.
    key: "npm_report_{{ inputs.package_json_url | sha256 }}"
    errorOnMissing: false

  - id: alert_if_new
    type: io.kestra.plugin.core.flow.If
    description: Notify Slack only if issues exist and the report changed since the last execution.
    condition: "{{ outputs.summarize.value.problem_count > 0 and (outputs.previous_report.value | default('')) != outputs.summarize.value.message }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Send the list of packages that require engineering attention.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": {{ outputs.summarize.value.message | toJson }}
          }

  - id: remember_report
    type: io.kestra.plugin.core.kv.Set
    description: Save the current report to the KV store for state comparison on subsequent executions.
    key: "npm_report_{{ inputs.package_json_url | sha256 }}"
    value: "{{ outputs.summarize.value.message }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Send an alert if the health check fails unexpectedly.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": {{ ("The npm dependency health check failed in execution " ~ execution.id ~ ". Check that package_json_url is accessible and the npm registry is reachable.") | toJson }}
      }

extend:
  title: Check Node.js Dependencies from a package.json for Deprecated, Outdated, and Stale Versions
  metaTitle: Node.js package.json Dependency Health Check with npm Registry and Kestra
  shortDescription: Audits package.json dependencies against the npm registry for deprecations, major version lag, and stale packages, notifying Slack on changes.
  metaDescription: Audit package.json dependencies against the npm registry for deprecated, outdated, and stale packages with automated Slack alerting and Kestra KV diffing.
  description: |
    Dependencies in a Node.js project can easily fall behind, become deprecated, or remain unmaintained for years without developers noticing. Rather than suffering alert fatigue from noisy daily pull requests for routine patch updates, this workflow periodically inspects your `package.json`, queries the official npm registry API, and sends a concise Slack digest only when deprecated packages, severe major-version lag, or stale unmaintained libraries are found.

    ## How it works

    1. `weekly` (`io.kestra.plugin.core.trigger.Schedule`) triggers the workflow every Monday at 08:00 UTC (disabled by default until configured).
    2. `fetch_package_json` (`io.kestra.plugin.core.http.Request`) downloads the raw `package.json` file from `package_json_url`.
    3. `list_packages` (`io.kestra.plugin.transform.jsonata.TransformValue`) extracts runtime dependencies (and optionally `devDependencies`), cleans range specifiers (`^`, `~`, `>=`), and limits the list to `max_packages`.
    4. `check_packages` (`io.kestra.plugin.core.flow.Loop`) iterates through each package. `fetch_npm_metadata` queries the public npm registry API, and `assess_health` evaluates the package against your pinned version, classifying it as `DEPRECATED`, `UNKNOWN_VERSION`, `STALE`, `OUTDATED`, or `OK`. `pause_for_rate_limit` pauses briefly between calls to respect registry bandwidth.
    5. `summarize` (`io.kestra.plugin.transform.jsonata.TransformValue`) formats a consolidated list of packages requiring attention.
    6. `previous_report` (`io.kestra.plugin.core.kv.Get`) retrieves the previous execution report from Kestra's KV store. `alert_if_new` (`io.kestra.plugin.core.flow.If`) posts to Slack only if actionable issues are detected and the report differs from the previous run. `remember_report` updates the KV store with the latest report state.
    7. The `errors` block catches network or parsing failures and posts an execution alert to Slack.

    ## What you get

    - Automated, scheduled auditing of Node.js dependencies against official npm registry metadata.
    - Early detection of deprecated packages and stale libraries with no releases for over a year.
    - Zero alert spam: identical reports are deduplicated via Kestra's KV store and sent only when status changes.
    - Dedicated failure handling informing the team if your repository or the npm registry becomes unreachable.

    ## Who it's for

    - Frontend and full-stack engineering teams maintaining Node.js, React, Next.js, or Vue applications.
    - Platform and DevOps engineers monitoring software supply-chain health and library obsolescence.

    ## Why orchestrate this with Kestra

    Building this logic as an ad-hoc cron script requires maintaining custom scheduling infrastructure, secret encryption, rate-limiting loops, state storage across runs, and error handling. Kestra provides declarative scheduling, built-in KV state persistence, visual execution logs, and robust retry mechanics in a portable YAML workflow.

    ## Prerequisites

    - HTTPS network access to `registry.npmjs.org` and your raw `package.json` URL.
    - A Slack incoming webhook URL for receiving notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch status reports and failure alerts (required).

    ## Quick start

    1. Store the `SLACK_WEBHOOK_URL` secret in your Kestra namespace (**Namespaces → Secrets**).
    2. Set `package_json_url` to the raw HTTPS URL of your target `package.json`.
    3. Click **Execute** in the Kestra UI to run an initial audit and inspect the `summarize` output.
    4. Enable the `weekly` schedule trigger to run automated recurring checks.

    ## How to extend

    - Increase `max_packages` to audit larger monorepos or include devDependencies via `include_dev_dependencies`.
    - Replace the Slack webhook task with Microsoft Teams, PagerDuty, or Discord notifications.
    - Chain this workflow to trigger automated dependency bump pipelines when deprecations are identified.

    ## Links

    - [npm Registry API Documentation](https://github.com/npm/registry/blob/master/docs/REGISTRY-API.md)
    - [Kestra JSONata TransformValue Plugin](https://kestra.io/plugins/plugin-transform-json/jsonata/io.kestra.plugin.transform.jsonata.transformvalue)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
