id: open-meteo-flood-river-discharge-lakehouse-loader
namespace: company.analytics
description: Ingests global hydrological river discharge and flood forecasting telemetry from Open-Meteo Flood API into Parquet lakehouse storage via DuckDB, tracking peak discharge anomalies in Kestra KV store.

inputs:
  - id: latitude
    type: FLOAT
    description: River basin latitude coordinate.
    defaults: 30.0444

  - id: longitude
    type: FLOAT
    description: River basin longitude coordinate.
    defaults: 31.2357

  - id: basin_moniker
    type: STRING
    description: Monitoring river basin or municipal reach identifier.
    defaults: "Nile River Lower Basin"

  - id: flood_discharge_threshold_m3s
    type: FLOAT
    description: Daily river discharge threshold in m³/s to flag high-flow flood risk.
    defaults: 1500.0

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking previous peak river discharge volume.
    defaults: openmeteo_flood_monitored_discharge_state

variables:
  default_state: "0.0"

triggers:
  - id: daily_flood_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_flood
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            prior_peak = float(json.loads(raw_state)) if raw_state else 0.0
        except Exception:
            prior_peak = 0.0

        lat = float("{{ inputs.latitude }}")
        lon = float("{{ inputs.longitude }}")
        moniker = "{{ inputs.basin_moniker }}"
        threshold = float("{{ inputs.flood_discharge_threshold_m3s }}")

        url = f"https://flood-api.open-meteo.com/v1/flood?latitude={lat}&longitude={lon}&daily=river_discharge,river_discharge_mean,river_discharge_max,river_discharge_min"
        headers = {"User-Agent": "KestraFloodLakehouse/1.0 (hydrology-analytics@kestra.io)"}

        records = []
        flood_risk_days = []
        observed_peak = 0.0

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                daily = data.get("daily", {})
                dates = daily.get("time", [])
                discharge = daily.get("river_discharge", [])
                discharge_mean = daily.get("river_discharge_mean", [])
                discharge_max = daily.get("river_discharge_max", [])

                for i in range(len(dates)):
                    d_str = dates[i]
                    q = float(discharge[i]) if i < len(discharge) and discharge[i] is not None else 0.0
                    q_mean = float(discharge_mean[i]) if i < len(discharge_mean) and discharge_mean[i] is not None else 0.0
                    q_max = float(discharge_max[i]) if i < len(discharge_max) and discharge_max[i] is not None else 0.0

                    if q_max > observed_peak:
                        observed_peak = q_max

                    is_flood_risk = q_max >= threshold

                    records.append({
                        "basin_moniker": moniker,
                        "latitude": lat,
                        "longitude": lon,
                        "forecast_date": d_str,
                        "river_discharge_m3s": q,
                        "river_discharge_mean_m3s": q_mean,
                        "river_discharge_max_m3s": q_max,
                        "is_flood_risk": is_flood_risk,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_flood_risk:
                        flood_risk_days.append({"date": d_str, "max_m3s": q_max})
        except Exception as e:
            print(f"Error fetching Open-Meteo Flood forecast: {e}")

        with open("flood_forecast.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE flood_discharge AS SELECT * FROM read_json_auto('flood_forecast.json')")
            con.execute("COPY flood_discharge TO 'flood_discharge_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY flood_discharge TO 'flood_discharge_archive.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE flood_discharge (
                    basin_moniker VARCHAR,
                    latitude DOUBLE,
                    longitude DOUBLE,
                    forecast_date VARCHAR,
                    river_discharge_m3s DOUBLE,
                    river_discharge_mean_m3s DOUBLE,
                    river_discharge_max_m3s DOUBLE,
                    is_flood_risk BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY flood_discharge TO 'flood_discharge_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY flood_discharge TO 'flood_discharge_archive.csv' (HEADER, DELIMITER ',')")

        summary = {
            "forecast_days_count": len(records),
            "peak_discharge_m3s": observed_peak,
            "flood_risk_days_count": len(flood_risk_days),
            "flood_risk_days": flood_risk_days[:5],
            "updated_state": observed_peak
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - flood_discharge_archive.parquet
      - flood_discharge_archive.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_flood.vars.updated_state | toJson }}"

  - id: check_flood_risk
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_flood.vars.flood_risk_days_count > 0 }}"
    then:
      - id: notify_flood_warning
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "🌊 River Discharge Flood Risk: {{ outputs.ingest_and_transform_flood.vars.flood_risk_days_count }} forecast day(s) exceed {{ inputs.flood_discharge_threshold_m3s }} m³/s threshold in {{ inputs.basin_moniker }} (peak {{ outputs.ingest_and_transform_flood.vars.peak_discharge_m3s }} m³/s)."

outputs:
  - id: peak_discharge
    type: FLOAT
    value: "{{ outputs.ingest_and_transform_flood.vars.peak_discharge_m3s }}"
  - id: flood_risk_days_count
    type: INT
    value: "{{ outputs.ingest_and_transform_flood.vars.flood_risk_days_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_flood.outputFiles['flood_discharge_archive.parquet'] }}"

extend:
  title: Open-Meteo Global River Discharge Flood Lakehouse Loader with DuckDB
  metaTitle: Open-Meteo Flood River Discharge Lakehouse Loader | Kestra
  shortDescription: Ingests global hydrological river discharge and flood forecasting telemetry from Open-Meteo Flood API into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Open-Meteo Flood API for river discharge forecasts, convert hydrological runoff into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, hydrological harmonization, and analytical persistence of global river discharge
    forecasts, daily stream runoff volumes, and catchment peak flows from the Open-Meteo Flood API into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`openmeteo_flood_monitored_discharge_state`) for previous peak discharge benchmarks.
    2. **Flood API Extraction**: Queries the official Open-Meteo Flood REST API (`flood-api.open-meteo.com/v1/flood`) across river basin coordinates.
    3. **DuckDB Hydrological Normalization**: Unpacks daily mean, minimum, and maximum river discharge values in m³/s into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized hydrological records into columnar Parquet and CSV files for flood inundation modeling and catchment risk analytics.
    5. **Discharge Risk Detection & State Commitment**: Detects hazardous discharge volumes, issues safety advisories, and commits peak discharge to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of global river catchment discharge forecasts.
    - Columnar Parquet datasets queryable with DuckDB, GIS toolchains, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Hydrologists and Catchment Basin Engineers monitoring regional river drainage networks.
    - Disaster Relief and Emergency Planning Coordinators tracking upstream flood crests.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical discharge peaks across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `flood-api.open-meteo.com`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting civil protection teams on high river flows.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set river basin `latitude` and `longitude`.
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `daily_flood_sync` schedule for automated daily updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition daily flood forecast models.
    - Connect a GIS spatial polygon intersection step in DuckDB to flag vulnerable infrastructure.

    ## Links

    - [Open-Meteo Flood API Documentation](https://open-meteo.com/en/docs/flood-api)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
