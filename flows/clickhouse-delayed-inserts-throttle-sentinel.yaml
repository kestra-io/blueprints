id: clickhouse-delayed-inserts-throttle-sentinel
namespace: company.team

inputs:
  - id: ch_host
    type: STRING
    defaults: "clickhouse.internal"
    description: Hostname of the ClickHouse server.
  - id: ch_port
    type: INT
    defaults: 8123
    description: HTTP port of the ClickHouse server.

tasks:
  - id: inspect_insert_throttling
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        set -euo pipefail
        python3 -c "
        import requests, json, sys

        host = '{{ inputs.ch_host }}'
        port = {{ inputs.ch_port }}
        user = '{{ secret('CH_USER') }}'
        pwd = '{{ secret('CH_PASSWORD') }}'

        url = f'http://{host}:{port}/'
        query = 'SELECT value FROM system.metrics WHERE metric=\'DelayedInserts\' FORMAT TabSeparated'

        try:
            resp = requests.get(url, params={'query': query}, auth=(user, pwd), timeout=10)
            resp.raise_for_status()
            val = resp.text.strip()
            delayed = int(val) if val.isdigit() else 0

            result = {
                'host': host,
                'delayed_count': delayed,
                'is_breach': delayed > 0
            }
            with open('ch_delayed_summary.json', 'w') as out:
                json.dump(result, out)
            print('ClickHouse delayed inserts:', result)
        except Exception as err:
            sys.stderr.write(f'ClickHouse query error: {err}\n')
            sys.exit(1)
        "
    outputFiles:
      - ch_delayed_summary.json

  - id: evaluate_insert_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.inspect_insert_throttling.outputFiles['ch_delayed_summary.json'])).is_breach }}"
    then:
      - id: notify_analytics_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#analytics-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": ":rotating_light: ClickHouse Insert Throttling Active Alert",
                "text": "ClickHouse server at {{ inputs.ch_host }} has {{ fromJson(read(outputs.inspect_insert_throttling.outputFiles['ch_delayed_summary.json'])).delayed_count }} throttled inserts (DelayedInserts > 0). Background merges are lagging behind ingestion, forcing ClickHouse to sleep incoming writes.",
                "footer": "Kestra Analytics Sentinel • ClickHouse"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#analytics-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": ":warning: ClickHouse Sentinel Failure",
            "text": "Failed to query system.metrics on ClickHouse server {{ inputs.ch_host }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  metaDescription: "Audits ClickHouse system.metrics to detect active DelayedInserts throttling before write queries abort."
  metaTitle: ClickHouse Delayed Inserts Write Throttling Sentinel with Kestra
  ee: false
  demo: false
  title: ClickHouse Delayed Inserts Write Throttling Sentinel
  shortDescription: Audits ClickHouse system.metrics to detect active DelayedInserts throttling before write queries abort.
  description: |
    ## How it works
    This workflow connects to the ClickHouse HTTP API to inspect the `DelayedInserts` counter in `system.metrics`. In ClickHouse MergeTree tables, when parts accumulate faster than background merge threads can combine them, ClickHouse initiates artificial write throttling by sleeping incoming insert threads (from a few milliseconds up to several seconds). If the backlog continues growing, writes throw `Too many parts` exceptions. This sentinel tracks active insert throttling and dispatches an alert to data engineering teams before ingestion pipelines fail.

    ## What you get
    - Real-time detection of ClickHouse write ingestion throttling.
    - Early warning before streaming ingestion pipelines crash with write timeouts.
    - Automated Slack incident notifications detailing throttled insert counts.

    ## Who it's for
    - Real-Time Data Engineers streaming data into ClickHouse via Kafka Connect or Vector.
    - Database Administrators operating large-scale ClickHouse clusters.
    - SREs safeguarding high-velocity analytical ingestion pipelines.

    ## Why orchestrate this with Kestra
    - **Automated Metric Surveillance**: Periodically audits internal server metrics without deploying metric exporters.
    - **Encrypted Credential Protection**: Safely injects ClickHouse credentials via Kestra secrets.
    - **Incident Orchestration**: Delivers rapid alerts to data engineering channels.

    ## Prerequisites
    - ClickHouse server with accessible HTTP API (`8123`).
    - Dedicated read-only monitoring user with access to `system.metrics`.
    - Secrets `CH_USER`, `CH_PASSWORD`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `CH_USER`, `CH_PASSWORD`, and `SLACK_WEBHOOK` secrets.
    3. Specify `ch_host` and `ch_port`.
    4. Enable the schedule trigger for continuous throttling surveillance.

    ## How to extend
    - Query `system.merges` to identify which specific tables are experiencing merge backlogs.
    - Automatically scale consumer worker batch sizes to reduce insert frequency.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [ClickHouse system.metrics Documentation](https://clickhouse.com/docs/en/operations/system-tables/metrics)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
