id: github-branch-protection-readiness-gate
namespace: company.security
description: |
  Audit a GitHub repository branch before release or deployment. The flow checks whether GitHub
  reports branch protection or ruleset enforcement and can optionally require the tip commit's
  signature to be verified. It creates a JSON report, alerts Slack when policy fails, and leaves
  remediation to repository maintainers.

inputs:
  - id: repository
    type: STRING
    displayName: GitHub repository
    defaults: kestra-io/blueprints
    description: Public GitHub repository in owner/name format.
  - id: branch
    type: STRING
    displayName: Branch name
    defaults: main
    description: Branch to audit. Use a single branch-name segment without slashes.
  - id: require_branch_protection
    type: BOOL
    displayName: Require branch protection
    defaults: true
    description: Block the release when GitHub reports the branch as not protected by branch protection or rulesets.
  - id: require_verified_tip_commit
    type: BOOL
    displayName: Require a verified tip commit
    defaults: false
    description: Block if GitHub does not verify the latest commit signature. This is separate from requiring every commit to be signed.
  - id: archive_report
    type: BOOL
    displayName: Archive report to S3
    defaults: false
    description: Store the JSON audit report in S3. AWS credentials are required only when enabled.
  - id: evidence_bucket
    type: STRING
    displayName: S3 evidence bucket
    defaults: my-branch-audit-evidence
    description: Existing S3 bucket for optional evidence retention.
  - id: evidence_prefix
    type: STRING
    displayName: S3 evidence prefix
    defaults: github-branch-protection-audits
    description: Object key prefix for branch audit reports.
  - id: aws_region
    type: STRING
    displayName: AWS region
    defaults: eu-west-1
    description: Region containing the evidence bucket.

triggers:
  - id: weekday_branch_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recheck branch protection on weekdays. Enable after tuning policy for the target repository.
    cron: "0 8 * * 1-5"
    disabled: true

tasks:
  - id: validate_audit_inputs
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the public repository identifier and branch reference before requesting GitHub data.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      REPOSITORY: "{{ inputs.repository }}"
      BRANCH: "{{ inputs.branch }}"
    script: |
      import os
      import re

      repository = os.environ.get("REPOSITORY", "").strip()
      branch = os.environ.get("BRANCH", "").strip()

      if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
          raise ValueError("repository must be a GitHub owner/name pair")
      if (
          not branch
          or branch.startswith("/")
          or branch.endswith("/")
          or ".." in branch
          or any(ord(char) < 32 for char in branch)
          or branch.startswith("-")
          or branch.startswith("refs/")
          or "/" in branch
      ):
          raise ValueError("branch must be a branch name without control characters or path traversal")

      print(f"Validated branch-readiness audit target: {repository}@{branch}")

  - id: fetch_branch_metadata
    type: io.kestra.plugin.core.http.Request
    description: Read the public GitHub branch object and its protection flag.
    uri: "https://api.github.com/repos/{{ inputs.repository }}/branches/{{ inputs.branch }}"
    method: GET
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: Kestra-GitHub-Branch-Protection-Readiness-Gate/1.0
    timeout: PT30S
    options:
      retry:
        maxAttempts: 3
        type: exponential
        interval: PT2S
        maxInterval: PT20S
        warningOnRetry: true
        behavior: RETRY_FAILED_TASK
      retryOnStatusCodes: [403, 429, 500, 502, 503, 504]

  - id: fetch_tip_commit
    type: io.kestra.plugin.core.http.Request
    description: Read the branch tip's commit metadata and GitHub signature-verification result.
    uri: "https://api.github.com/repos/{{ inputs.repository }}/commits/{{ inputs.branch }}"
    method: GET
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: Kestra-GitHub-Branch-Protection-Readiness-Gate/1.0
    timeout: PT30S
    options:
      retry:
        maxAttempts: 3
        type: exponential
        interval: PT2S
        maxInterval: PT20S
        warningOnRetry: true
        behavior: RETRY_FAILED_TASK
      retryOnStatusCodes: [403, 429, 500, 502, 503, 504]

  - id: evaluate_branch_readiness
    type: io.kestra.plugin.scripts.python.Script
    description: Compare branch protection and tip-commit signature verification with policy inputs, then emit a JSON report and structured task outputs.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - kestra
    env:
      REPOSITORY: "{{ inputs.repository }}"
      BRANCH: "{{ inputs.branch }}"
      REQUIRE_BRANCH_PROTECTION: "{{ inputs.require_branch_protection }}"
      REQUIRE_VERIFIED_TIP_COMMIT: "{{ inputs.require_verified_tip_commit }}"
      BRANCH_NAME: "{{ outputs.fetch_branch_metadata.body | jq('.name') | first }}"
      BRANCH_PROTECTED: "{{ outputs.fetch_branch_metadata.body | jq('.protected') | first }}"
      BRANCH_URL: "{{ outputs.fetch_branch_metadata.body | jq('.url') | first }}"
      COMMIT_SHA: "{{ outputs.fetch_tip_commit.body | jq('.sha') | first }}"
      COMMIT_URL: "{{ outputs.fetch_tip_commit.body | jq('.html_url') | first }}"
      SIGNATURE_VERIFIED: "{{ outputs.fetch_tip_commit.body | jq('.commit.verification.verified') | first }}"
      VERIFICATION_REASON: "{{ outputs.fetch_tip_commit.body | jq('.commit.verification.reason') | first }}"
      COMMIT_SUBJECT: "{{ outputs.fetch_tip_commit.body | jq('.commit.message') | first }}"
    outputFiles:
      - branch-readiness-audit.json
    script: |
      import json
      import os
      from datetime import datetime, timezone

      from kestra import Kestra

      repository = os.environ["REPOSITORY"].strip()
      branch_name = os.environ["BRANCH"].strip()
      require_protection = os.environ.get("REQUIRE_BRANCH_PROTECTION", "true").lower() == "true"
      require_verified_tip = os.environ.get("REQUIRE_VERIFIED_TIP_COMMIT", "false").lower() == "true"

      branch_name = os.environ["BRANCH_NAME"].strip()
      branch_url = os.environ.get("BRANCH_URL", "").strip()
      branch_protected = os.environ.get("BRANCH_PROTECTED", "").strip().lower() == "true"
      commit_sha = os.environ.get("COMMIT_SHA", "").strip()
      commit_url = os.environ.get("COMMIT_URL", "").strip()
      signature_text = os.environ.get("SIGNATURE_VERIFIED", "").strip().lower()
      signature_verified = True if signature_text == "true" else (False if signature_text == "false" else None)
      verification_reason = os.environ.get("VERIFICATION_REASON", "").strip()
      if verification_reason.lower() in {"", "null"}:
          verification_reason = None

      findings = []
      def add(code, severity, message):
          findings.append({"code": code, "severity": severity, "message": message})

      if require_protection and not branch_protected:
          add("BRANCH_NOT_PROTECTED", "BLOCK", "GitHub reports the target branch is not protected by branch protection or rulesets.")
      if require_verified_tip and signature_verified is not True:
          add("TIP_COMMIT_SIGNATURE_UNVERIFIED", "BLOCK", f"GitHub does not verify the tip commit signature (reason: {verification_reason or 'unknown'}).")
      if signature_verified is True:
          add("TIP_COMMIT_SIGNATURE_VERIFIED", "INFO", "GitHub reports a valid signature for the tip commit.")
      elif signature_verified is False:
          add("TIP_COMMIT_SIGNATURE_NOT_VERIFIED", "WARN", f"The tip commit is not verified by GitHub (reason: {verification_reason or 'unknown'}).")

      blocking = [item for item in findings if item["severity"] == "BLOCK"]
      warnings = [item for item in findings if item["severity"] == "WARN"]
      verdict = "FAIL" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "repository": repository,
          "branch": branch_name,
          "branchUrl": branch_url,
          "branchProtected": branch_protected,
          "requiredBranchProtection": require_protection,
          "tipCommitSha": commit_sha,
          "tipCommitUrl": commit_url,
          "tipCommitSubject": os.environ.get("COMMIT_SUBJECT", "").strip().splitlines()[0][:240],
          "tipCommitSignatureVerified": signature_verified,
          "tipCommitVerificationReason": verification_reason,
          "requiredVerifiedTipCommit": require_verified_tip,
          "findings": findings,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "scopeNote": "The public branch API protected flag indicates whether GitHub reports applicable protection or rulesets. This flow does not inspect every individual rule setting, required check name, review count, admin enforcement or organization policy exception. Tip-commit signature verification is separate from a rule requiring every commit to be signed.",
      }
      with open("branch-readiness-audit.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)

      print(f"GitHub branch-readiness audit: {repository}@{branch_name} verdict={verdict}; protected={branch_protected}, tip_signature_verified={signature_verified}, blocking={len(blocking)}, warnings={len(warnings)}")
      Kestra.outputs({
          "repository": repository,
          "branch": branch_name,
          "branch_protected": branch_protected,
          "tip_commit_sha": commit_sha,
          "tip_commit_url": commit_url,
          "tip_commit_signature_verified": signature_verified,
          "verification_reason": verification_reason or "",
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "verdict": verdict,
          "findings": findings,
      })

  - id: optionally_archive_report
    type: io.kestra.plugin.core.flow.If
    description: Optionally archive the audit report to S3 under repository and branch specific keys.
    condition: "{{ inputs.archive_report }}"
    then:
      - id: upload_branch_audit
        type: io.kestra.plugin.aws.s3.Upload
        description: Store metadata-only audit evidence without repository content or GitHub credentials.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ inputs.aws_region }}"
        bucket: "{{ inputs.evidence_bucket }}"
        from: "{{ outputs.evaluate_branch_readiness.outputFiles['branch-readiness-audit.json'] }}"
        key: "{{ inputs.evidence_prefix }}/{{ inputs.repository | replace('/', '_') }}/{{ inputs.branch | replace('/', '_') }}/branch-readiness-audit.json"

  - id: enforce_branch_readiness_policy
    type: io.kestra.plugin.core.flow.If
    description: Fail closed when branch protection or the optional verified-tip-commit requirement fails.
    condition: "{{ outputs.evaluate_branch_readiness.vars.verdict == 'FAIL' }}"
    then:
      - id: alert_branch_readiness_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Send the repository, branch and finding codes to the security or platform channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |-
          {{
            {
              "text": ":rotating_light: GitHub branch-readiness policy failed\nRepository: " ~ outputs.evaluate_branch_readiness.vars.repository ~
                "\nBranch: " ~ outputs.evaluate_branch_readiness.vars.branch ~
                "\nBranch protected: " ~ outputs.evaluate_branch_readiness.vars.branch_protected ~
                "\nTip commit: " ~ outputs.evaluate_branch_readiness.vars.tip_commit_sha ~
                "\nFindings: " ~ (outputs.evaluate_branch_readiness.vars.findings | toJson) ~
                "\nExecution: " ~ execution.id ~
                "\nInspect branch-readiness-audit.json before release."
            } | toJson
          }}
      - id: fail_branch_readiness_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Stop a release workflow if the configured branch policy is not met.
        errorMessage: "GitHub branch-readiness policy failed for {{ outputs.evaluate_branch_readiness.vars.repository }}@{{ outputs.evaluate_branch_readiness.vars.branch }}. Review branch-readiness-audit.json."
    else:
      - id: log_branch_readiness_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "GitHub branch-readiness policy {{ outputs.evaluate_branch_readiness.vars.verdict }} for {{ outputs.evaluate_branch_readiness.vars.repository }}@{{ outputs.evaluate_branch_readiness.vars.branch }}; protected={{ outputs.evaluate_branch_readiness.vars.branch_protected }}, verified tip commit={{ outputs.evaluate_branch_readiness.vars.tip_commit_signature_verified }}."

errors:
  - id: alert_branch_audit_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when GitHub API access, parsing or execution fails. A failed audit must not be treated as a pass.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |-
      {{
        {
          "text": ":warning: GitHub branch-readiness audit execution failed\nRepository: " ~ inputs.repository ~
            "\nBranch: " ~ inputs.branch ~
            "\nExecution: " ~ execution.id ~
            "\nInspect Kestra task logs; do not interpret this run as passing."
        } | toJson
      }}

extend:
  title: GitHub Branch Protection and Release Readiness Gate
  metaTitle: GitHub Branch Protection Readiness Gate | Kestra
  shortDescription: Check GitHub branch-protection status and optionally the latest commit's signature verification before a release workflow continues.
  metaDescription: Gate releases on GitHub branch protection and optional tip-commit signature verification, with JSON evidence, Slack alerts and optional S3 retention.
  description: |
    Audit a public GitHub repository branch before a release, artifact promotion or deployment. The flow checks GitHub's branch API protection flag, evaluates the current tip commit's signature-verification state, and applies configurable fail-closed rules. It emits JSON evidence, alerts Slack on a blocked branch and optionally stores the report in S3. A successful tip signature is not proof that branch policy requires every commit to be signed.

    ## How it works

    1. The validation task checks the repository and branch identifier before making requests.
    2. An HTTP Request reads GitHub's public branch object and its protected flag.
    3. A second request obtains the current commit metadata and GitHub's signature-verification result.
    4. The Python audit compares the observed metadata with require_branch_protection and require_verified_tip_commit, then emits a JSON report and structured outputs.
    5. An optional If branch stores the report in S3.
    6. The release-policy If alerts and fails a blocked branch, or logs a passing verdict for downstream release steps.

    ## What you get

    - Machine-readable branch-readiness-audit.json evidence with branch protection, tip commit SHA, signature status, findings and final verdict.
    - A gate that can require GitHub-reported protection and optionally a verified signature on the current tip commit.
    - Slack alerts for policy violations and execution failures.
    - Optional S3 evidence retention without storing repository content or GitHub credentials.

    ## Who it's for

    - Platform engineering teams enforcing repository baselines before releases.
    - Security engineers reviewing branch protection and commit-signature evidence.
    - Release engineering teams that need an explicit policy gate in deployment flows.

    ## Why orchestrate this with Kestra

    Kestra makes the selected policy declarative, records each run and its evidence, schedules rechecks, and routes failures to an alert plus a failing task that downstream workflows can depend on.

    ## Prerequisites

    - A Kestra 2.x worker with Docker enabled for the Python Script task runner.
    - Network access from Kestra to the public GitHub REST API.
    - A Slack incoming webhook when alerting is enabled.
    - An existing S3 bucket and write-capable AWS credentials when archive_report is enabled.

    ### Secrets

    - SLACK_WEBHOOK_URL: Slack incoming webhook for policy and execution-failure alerts.
    - AWS_ACCESS_KEY_ID: optional AWS access key used only when S3 archival is enabled.
    - AWS_SECRET_ACCESS_KEY: optional AWS secret key used only when S3 archival is enabled.

    ## Quick start

    1. Import the flow and start with repository=kestra-io/blueprints, branch=main, and require_branch_protection=true. This version accepts branch names without slash separators.
    2. Execute the flow and inspect branch-readiness-audit.json and the task outputs.
    3. Set require_verified_tip_commit=true only when policy requires the current tip commit to have a verified GitHub signature.
    4. Configure SLACK_WEBHOOK_URL before relying on policy alerts.
    5. Enable the weekday trigger after reviewing policy, and enable S3 archival only after configuring its bucket and secrets.

    ## How to extend

    - Use an appropriately permissioned GitHub App or token in an extension to audit detailed ruleset settings and required check names.
    - Maintain a branch allowlist per environment and block promotion if the selected branch differs from the approved release branch.
    - Add approval for branch-protection changes and archive before/after policy snapshots.
    - Feed the JSON report into an organization-wide security dashboard.

    ## Links

    - [GitHub REST API: Get a branch](https://docs.github.com/en/rest/branches/branches#get-a-branch)
    - [GitHub REST API: Get a commit](https://docs.github.com/en/rest/commits/commits#get-a-commit)
    - [Kestra HTTP Request plugin](https://kestra.io/plugins/plugin-core/http/io.kestra.plugin.core.http.request)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack/slackincomingwebhook)
    - [Kestra AWS S3 plugin](https://kestra.io/plugins/plugin-aws/s3)
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - CI/CD & Deployment
  ee: false
  demo: false
