id: azure-event-hubs-throttled-requests-sentinel
namespace: company.cloud

inputs:
  - id: subscription_id
    type: STRING
    description: Azure Subscription ID.
  - id: resource_group
    type: STRING
    description: Azure Resource Group containing Event Hubs namespace.
  - id: namespace_name
    type: STRING
    description: Azure Event Hubs Namespace name.
  - id: threshold_throttled_requests
    type: INT
    defaults: 0
    description: "Maximum allowable throttled requests in 5-minute sampling interval (default 0)."

tasks:
  - id: check_throttled_requests
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: mcr.microsoft.com/azure-cli:latest
    commands:
      - |
        az login --service-principal -u "{{ secret('AZURE_CLIENT_ID') }}" -p "{{ secret('AZURE_CLIENT_SECRET') }}" --tenant "{{ secret('AZURE_TENANT_ID') }}" --output none
        az account set --subscription "{{ inputs.subscription_id }}"
        
        RESOURCE_ID="/subscriptions/{{ inputs.subscription_id }}/resourceGroups/{{ inputs.resource_group }}/providers/Microsoft.EventHub/namespaces/{{ inputs.namespace_name }}"
        
        az monitor metrics list           --resource "$RESOURCE_ID"           --metric "ThrottledRequests"           --interval PT5M           --output json > /tmp/eventhub_telemetry.json
        
        THROTTLED=$(jq '[.value[]?.timeseries[]?.data[]?.total // 0] | add // 0' /tmp/eventhub_telemetry.json)
        echo "::set-output name=throttled_count::$THROTTLED::"

  - id: evaluate_throttling
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_throttled_requests.vars.throttled_count | int > inputs.threshold_throttled_requests }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#cloud-ops",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Azure Event Hubs Throttling Alert",
                "text": "Event Hubs Namespace `{{ inputs.namespace_name }}` recorded *{{ outputs.check_throttled_requests.vars.throttled_count }} throttled requests* over the last 5 minutes! Throughput units (TU) or processing units (PU) capacity has been exceeded.",
                "footer": "Kestra Cloud Sentinel • Microsoft Azure"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#cloud-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Azure Event Hubs Throttled Requests Sentinel Failure",
            "text": "Failed to query Azure Monitor metrics for Event Hubs namespace. Verify Azure Service Principal credentials and permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors Azure Event Hubs namespace for ingress and egress throttled requests to prevent message drop and consumer lag."
  metaTitle: Microsoft Azure Event Hubs Ingress and Egress Throttled Requests Sentinel with Kestra
  title: Microsoft Azure Event Hubs Ingress and Egress Throttled Requests Sentinel
  shortDescription: Monitors Azure Event Hubs namespace for ingress and egress throttled requests to prevent message drop and consumer lag.
  description: |
    ## How it works
    This workflow connects to the Azure CLI container using an Azure Service Principal and queries Azure Monitor metrics for `ThrottledRequests` against the specified Event Hubs namespace. In Azure Event Hubs, requests are throttled when ingress or egress rates exceed allocated Throughput Units (Standard tier) or Processing Units (Premium tier). When throttled events are detected, the workflow parses the telemetry with `jq` and routes an urgent incident alert to Slack.

    ## What you get
    - Real-time detection of data streaming bottlenecks and rate-limiting.
    - Prevents silent telemetry loss or message queuing backlogs.
    - Actionable capacity alerts indicating when to scale Throughput Units.

    ## Who it's for
    - Event Streaming and Kafka Platform Engineers running Azure Event Hubs.
    - Cloud Infrastructure and SRE teams managing real-time data pipelines.

    ## Why orchestrate this with Kestra
    - **Automated Multi-Cloud Telemetry**: Periodically poll Azure Monitor alongside AWS, GCP, and Kafka workloads.
    - **Zero-Friction Authentication**: Authenticate seamlessly using Kestra secrets for Service Principal credentials.
    - **Instant Alert Routing**: Direct formatted incident notifications to on-call response channels.

    ## Prerequisites
    - Azure Service Principal with `Monitoring Reader` role on the target resource group.
    - Secrets `AZURE_CLIENT_ID`, `AZURE_CLIENT_SECRET`, `AZURE_TENANT_ID`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint into your Kestra instance.
    2. Provide your Azure Subscription ID, Resource Group, and Event Hubs Namespace name.
    3. Trigger the flow manually or enable the periodic schedule.

    ## How to extend
    - Add an automated auto-scale step to dynamically increase Throughput Units via Azure CLI when throttling persists.
    - Correlate with downstream consumer group lag metrics.

    ## Links
    - [Azure Event Hubs Metrics in Azure Monitor](https://learn.microsoft.com/en-us/azure/event-hubs/event-hubs-metrics-azure-monitor)
    - [Kestra Shell Commands Plugin](https://kestra.io/plugins/plugin-scripts-shell/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Azure Services
    - Infrastructure Automation
  ee: false
  demo: false
