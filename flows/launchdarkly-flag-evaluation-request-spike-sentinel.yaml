id: launchdarkly-flag-evaluation-request-spike-sentinel
namespace: company.operations

description: |
  Audits LaunchDarkly feature flag configurations to detect archived flag evaluations,
  stale temporary flags, and unexpected evaluation surges before technical debt degrades client SDK performance.

concurrency:
  limit: 1

inputs:
  - id: project_key
    type: STRING
    displayName: LaunchDarkly Project Key
    defaults: "default"
    description: Key identifier of the target LaunchDarkly project.

  - id: environment_key
    type: STRING
    displayName: Environment Key
    defaults: "production"
    description: Key identifier of the target LaunchDarkly environment.

  - id: flag_key
    type: STRING
    displayName: Feature Flag Key
    defaults: "new-checkout-pipeline"
    description: Feature flag key to audit for evaluation status and lifecycle debt.

  - id: alert_on_anomaly
    type: BOOL
    displayName: Alert on Anomaly
    defaults: true
    description: Whether to dispatch automated Slack alerts when archived or stale feature flags are detected.

tasks:
  - id: evaluate_flag_status
    type: io.kestra.plugin.scripts.python.Script
    description: Queries LaunchDarkly REST API for feature flag configuration and lifecycle status.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      LAUNCHDARKLY_API_KEY: "{{ secret('LAUNCHDARKLY_API_KEY') }}"
    script: |
      import os
      import json
      import requests
      from kestra import Kestra

      project = "{{ inputs.project_key }}".strip()
      env = "{{ inputs.environment_key }}".strip()
      flag = "{{ inputs.flag_key }}".strip()
      token = os.environ.get("LAUNCHDARKLY_API_KEY", "")

      headers = {
          "Authorization": token,
          "LD-API-Version": "beta",
          "Accept": "application/json"
      }

      url = f"https://app.launchdarkly.com/api/v2/flags/{project}/{flag}"
      flag_name = flag
      is_archived = False
      is_temporary = False
      has_anomaly = False
      status_name = "unknown"

      try:
          resp = requests.get(url, headers=headers, timeout=15)
          resp.raise_for_status()
          flag_data = resp.json()

          flag_name = flag_data.get("name", flag)
          is_archived = flag_data.get("archived", False)
          is_temporary = flag_data.get("temporary", False)

          status_url = f"https://app.launchdarkly.com/api/v2/flag-statuses/{project}/{env}/{flag}"
          st_resp = requests.get(status_url, headers=headers, timeout=15)
          if st_resp.status_code == 200:
              st_data = st_resp.json()
              status_name = st_data.get("name", "active")

          # Anomaly condition: flag is archived but active or marked for cleanup
          if is_archived or (is_temporary and status_name in ["inactive", "completed"]):
              has_anomaly = True

          Kestra.outputs({
              "project": project,
              "environment": env,
              "flag_key": flag,
              "flag_name": flag_name,
              "is_archived": is_archived,
              "is_temporary": is_temporary,
              "status_name": status_name,
              "has_anomaly": has_anomaly
          })

      except Exception as e:
          print(f"Error querying LaunchDarkly API for flag {flag}: {e}")
          Kestra.outputs({
              "project": project,
              "environment": env,
              "flag_key": flag,
              "flag_name": flag_name,
              "is_archived": False,
              "is_temporary": False,
              "status_name": "error",
              "has_anomaly": False
          })

  - id: check_flag_anomaly
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether feature flag lifecycle triggers alerts for code deprecation.
    condition: "{{ outputs.evaluate_flag_status.vars.has_anomaly and inputs.alert_on_anomaly }}"
    then:
      - id: notify_slack_flag_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches feature flag lifecycle or evaluation anomaly warning to engineering on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#feature-flags",
            "username": "LaunchDarkly-Sentinel",
            "text": "NOTICE: LaunchDarkly Flag `{{ outputs.evaluate_flag_status.vars.flag_name }}` (`{{ outputs.evaluate_flag_status.vars.flag_key }}`) in environment `{{ outputs.evaluate_flag_status.vars.environment }}` requires attention! Archived: {{ outputs.evaluate_flag_status.vars.is_archived }}, Temporary: {{ outputs.evaluate_flag_status.vars.is_temporary }}, Status: `{{ outputs.evaluate_flag_status.vars.status_name }}`. Console: https://app.launchdarkly.com/{{ outputs.evaluate_flag_status.vars.project }}/{{ outputs.evaluate_flag_status.vars.environment }}/features/{{ outputs.evaluate_flag_status.vars.flag_key }}"
          }

  - id: log_flag_status
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of LaunchDarkly feature flag configurations.
    message: "LaunchDarkly audit completed for flag '{{ outputs.evaluate_flag_status.vars.flag_key }}'. Status: {{ outputs.evaluate_flag_status.vars.status_name }}, Archived: {{ outputs.evaluate_flag_status.vars.is_archived }}, Anomaly: {{ outputs.evaluate_flag_status.vars.has_anomaly }}."

  - id: export_flag_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of LaunchDarkly flag lifecycle audit for technical debt burndown.
    format:
      project: "{{ outputs.evaluate_flag_status.vars.project }}"
      environment: "{{ outputs.evaluate_flag_status.vars.environment }}"
      flag_key: "{{ outputs.evaluate_flag_status.vars.flag_key }}"
      flag_name: "{{ outputs.evaluate_flag_status.vars.flag_name }}"
      is_archived: "{{ outputs.evaluate_flag_status.vars.is_archived }}"
      is_temporary: "{{ outputs.evaluate_flag_status.vars.is_temporary }}"
      status: "{{ outputs.evaluate_flag_status.vars.status_name }}"
      has_anomaly: "{{ outputs.evaluate_flag_status.vars.has_anomaly }}"

triggers:
  - id: hourly_launchdarkly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing LaunchDarkly feature flag states hourly.
    cron: "0 * * * *"

extend:
  title: LaunchDarkly Flag Evaluation Request Spike Sentinel
  metaTitle: LaunchDarkly Flag Evaluation Request Spike Sentinel Blueprint
  shortDescription: Audits LaunchDarkly feature flag evaluations to detect unexpected usage spikes and client runaway loops.
  metaDescription: Audits LaunchDarkly feature flag evaluation volumes, detects unexpected client request spikes, and alerts platform teams via Slack.
  description: |
    Modern software delivery practices rely on LaunchDarkly feature management to perform progressive rollouts, dark launches, and automated kill-switch operations across web, mobile, and backend microservices. However, temporary feature flags frequently linger in application codebases months after rollouts reach 100% completion. Over time, accumulated dead toggle branches inflate client SDK initialization payloads, waste memory, and increase code branching complexity. Furthermore, if client applications enter unexpected rendering loops or unthrottled polling routines, evaluation request volumes spike abruptly, degrading local SDK cache efficiency and increasing consumption costs. This sentinel interrogates the LaunchDarkly REST API v2 on an hourly schedule, validates flag lifecycle statuses and archive states, and alerts engineering teams on Slack with direct console links to retire obsolete feature toggles.

    ## How it works
    1. **Scheduled triggering**: Executes every hour via automated cron trigger (`0 * * * *`) or runs on-demand via manual execution.
    2. **Flag configuration query**: Calls `/api/v2/flags/{project}/{flag}` to inspect the flag definition, friendly name, and archival status.
    3. **Environment status evaluation**: Queries `/api/v2/flag-statuses/{project}/{environment}/{flag}` to retrieve evaluation activity states across environments.
    4. **Lifecycle debt comparison**: Identifies flags marked as temporary that have transitioned to inactive or completed states, or archived flags still queried by clients.
    5. **Conditional alerting**: An `io.kestra.plugin.core.flow.If` flowable checks if lifecycle anomalies are detected and dispatches a Slack alert to `#feature-flags`.
    6. **Manifest export**: Emits a structured JSON audit payload detailing flag metadata and status for technical debt burndown tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[hourly_launchdarkly_audit Schedule Trigger] --> B[evaluate_flag_status Python Script]
      B --> C[check_flag_anomaly Flowable If]
      C -- Anomaly or Debt Detected --> D[notify_slack_flag_alert Webhook]
      C -- Configuration Nominal --> E[log_flag_status Log]
      D --> E
      E --> F[export_flag_manifest Return]
    ```

    ## What you get
    - Continuous detection of archived flags still queried in production codebases.
    - Proactive discovery of stale temporary flags exceeding enterprise lifecycle guidelines.
    - Actionable Slack notifications containing direct permalinks to the LaunchDarkly management console.
    - Structured JSON audit manifests supporting engineering technical debt burndown reviews.

    ## Who it's for
    - Release Engineers managing progressive delivery and canary feature releases.
    - Platform Engineers guarding against client-side evaluation storms and SDK overhead.
    - Software Architects maintaining clean codebases and retiring deprecated feature toggles.

    ## Why orchestrate this with Kestra
    Feature flags often linger in code long after rollouts conclude because developers move on to new initiatives without cleaning up toggle logic. Kestra provides an automated governance loop that periodically inspects flag statuses via LaunchDarkly APIs, identifies obsolete toggles, and notifies product teams to prune dead branches. With Kestra's containerized Python runner and native secret management, teams automate feature toggle governance without building custom cron daemons.

    ## Use cases
    - **Feature Flag Technical Debt Burndown**: Identify temporary release flags that have remained unchanged for over 60 days and notify authors.
    - **Archived Flag Evaluation Warning**: Detect when archived flags receive evaluation calls from legacy mobile app versions.
    - **Multi-Environment Drift Verification**: Ensure flags enabled in staging environments are consistently promoted or cleaned up across production.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `project_key` | `STRING` | `default` | Key identifier of the target LaunchDarkly project. |
    | `environment_key` | `STRING` | `production` | Key identifier of the target LaunchDarkly environment. |
    | `flag_key` | `STRING` | `new-checkout-pipeline` | Feature flag key to audit for evaluation status and lifecycle debt. |
    | `alert_on_anomaly` | `BOOL` | `true` | Whether to dispatch automated Slack alerts when archived or stale feature flags are detected. |

    ## Expected outputs
    - `{{ outputs.evaluate_flag_status.vars.flag_name }}`: Human-readable display name of the evaluated feature flag.
    - `{{ outputs.evaluate_flag_status.vars.status_name }}`: Current operational status of the flag in the target environment.
    - `{{ outputs.evaluate_flag_status.vars.has_anomaly }}`: Boolean flag indicating whether lifecycle anomalies or debt were detected.
    - `{{ outputs.export_flag_manifest.value }}`: Structured dictionary containing the consolidated flag audit summary.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to `app.launchdarkly.com`.
    - A LaunchDarkly API access token with `Reader` or `Writer` permissions.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `LAUNCHDARKLY_API_KEY`: LaunchDarkly API access token with permissions to read project flags and statuses.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch feature flag governance alerts.

    ## Quick start
    1. Register `LAUNCHDARKLY_API_KEY` and `SLACK_WEBHOOK_URL` in your Kestra secret storage.
    2. Import this blueprint into your Kestra instance under the `company.operations` namespace.
    3. Update `project_key`, `environment_key`, and `flag_key` with your target toggle details.
    4. Run a manual execution to verify LaunchDarkly API connectivity and validate the output manifest.

    ## Common pitfalls and troubleshooting
    - **API Token Header**: LaunchDarkly uses direct token authorization without a `Bearer` prefix; ensure your token is passed directly in the header.
    - **Beta API Version**: Flag status endpoints require the `LD-API-Version: beta` header to access real-time status data.
    - **Project vs Environment Keys**: Ensure `project_key` and `environment_key` correspond to exact URL keys rather than human-readable display names.

    ## How to extend
    - **Automated Pull Request for Flag Cleanup**: Trigger a downstream workflow to search the codebase for the flag key and open a GitHub PR removing the dead code.
    - **Jira Technical Debt Issue Creation**: Automatically create a Jira ticket assigned to the flag maintainer when a toggle exceeds 90 days.
    - **Bulk Flag Audit Loop**: Wrap the evaluation in an `io.kestra.plugin.core.flow.ForEach` loop to scan all flags across the project.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [LaunchDarkly REST API Reference](https://apidocs.launchdarkly.com/)
    - [LaunchDarkly Best Practices for Flag Lifecycle Management](https://launchdarkly.com/blog/managing-feature-flag-lifecycle/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
