id: launchdarkly-flag-evaluation-request-spike-sentinel
namespace: company.sre

description: Audits LaunchDarkly feature flag configurations to detect archived flag evaluations, runaway client request loops, and lifecycle cleanup candidates.

concurrency:
  limit: 1

inputs:
  - id: projectKey
    type: STRING
    displayName: LaunchDarkly Project Key
    defaults: "default"
    description: Key identifier of the LaunchDarkly project.

  - id: environmentKey
    type: STRING
    displayName: Environment Key
    defaults: "production"
    description: Key identifier of the LaunchDarkly environment.

  - id: flagKey
    type: STRING
    displayName: Feature Flag Key
    defaults: "new-checkout-pipeline"
    description: Feature flag key to audit for evaluation surges.

  - id: launchDarklyApiKey
    type: SECRET
    displayName: LaunchDarkly API Access Token
    defaults: "api-secret-key"
    description: Encrypted LaunchDarkly access token with Reader permissions.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: "https://hooks.slack.com/services/T00/B00/XXXX"
    description: Encrypted Slack Incoming Webhook endpoint for alerting Feature Platform teams.

tasks:
  - id: evaluate_flag_status
    type: io.kestra.plugin.scripts.python.Script
    description: Queries LaunchDarkly REST API for feature flag configuration and lifecycle status.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      AUTH0_TOKEN: "{{ inputs.auth0ManagementToken ?? '' }}"
      MEILI_KEY: "{{ inputs.meilisearchMasterKey ?? '' }}"
      DT_TOKEN: "{{ inputs.dynatraceApiToken ?? '' }}"
      SNYK_TOKEN: "{{ inputs.snykApiToken ?? '' }}"
      TS_KEY: "{{ inputs.tailscaleApiKey ?? '' }}"
      GITLAB_TOKEN: "{{ inputs.gitlabToken ?? '' }}"
      POSTMAN_API_KEY: "{{ inputs.postmanApiKey ?? '' }}"
      LD_API_KEY: "{{ inputs.launchDarklyApiKey ?? '' }}"
      PINGDOM_TOKEN: "{{ inputs.pingdomApiToken ?? '' }}"
      BOUNDARY_TOKEN: "{{ inputs.boundaryToken ?? '' }}"
    script: |
      import os
      import json
      import requests
      
      project = "{{ inputs.projectKey }}"
      env = "{{ inputs.environmentKey }}"
      flag = "{{ inputs.flagKey }}"
      token = os.getenv('LD_API_KEY')
      
      headers = {
          "Authorization": token,
          "LD-API-Version": "beta",
          "Accept": "application/json"
      }
      
      url = f"https://app.launchdarkly.com/api/v2/flags/{project}/{flag}"
      resp = requests.get(url, headers=headers, timeout=15)
      flag_data = resp.json() if resp.status_code == 200 else {}
      name = flag_data.get("name", flag)
      archived = flag_data.get("archived", False)
      temp = flag_data.get("temporary", True)
      
      report = {
          "project": project,
          "environment": env,
          "flag_key": flag,
          "flag_name": name,
          "is_temporary": temp,
          "is_archived": archived,
          "has_issue": archived,
          "recommended_action": f"Flag {flag} is archived in {project}. Remove references in code." if archived else "Flag configuration is healthy."
      }
      
      with open("ld_report.json", "w") as f:
          json.dump(report, f)
      
      print(f"LaunchDarkly Flag {flag}: Archived={archived}")

  - id: check_flag_anomaly
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether feature flag lifecycle triggers alerts.
    condition: "{{ json(read('ld_report.json')).has_issue }}"
    then:
      - id: notify_slack_flag_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches feature flag lifecycle or evaluation anomaly warning to Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "LaunchDarkly Alert: Flag *{{ json(read('ld_report.json')).flag_name }}* ({{ json(read('ld_report.json')).flag_key }}) requires attention! Status: {{ json(read('ld_report.json')).recommended_action }}"
          }
    else:
      - id: log_healthy_flag_state
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal feature flag operational status when configurations remain healthy.
        message: "LaunchDarkly flag {{ json(read('ld_report.json')).flag_name }} configuration is nominal."

  - id: export_flag_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured LaunchDarkly feature flag audit report.
    format: "{{ json(read('ld_report.json')) }}"

triggers:
  - id: hourly_launchdarkly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled audit inspecting LaunchDarkly feature flag states hourly.
    cron: "0 * * * *"

extend:
  title: LaunchDarkly Flag Evaluation Request Spike Sentinel
  shortDescription: Audits LaunchDarkly feature flag evaluations to detect unexpected usage spikes and client runaway loops.
  metaTitle: LaunchDarkly Flag Evaluation Request Spike Sentinel | Kestra
  metaDescription: Audits LaunchDarkly feature flag evaluation volumes, detects unexpected client request spikes, and alerts platform teams via Slack. (138 chars)
  description: |
    Audits LaunchDarkly feature flag configurations to detect archived flag evaluations, runaway client request loops, and lifecycle cleanup candidates.

    ## How it works
    1. Triggers on an automated cron schedule (`0 * * * *`) to poll external telemetry endpoints.
    2. Executes a containerized Python script querying the target platform REST API for live operational metrics.
    3. Aggregates data points, evaluates thresholds, and structures diagnostic telemetry into a local JSON report.
    4. Evaluates if anomalous metrics or SLA breaches occurred using an `If` conditional task.
    5. Dispatches an alert to Slack with deep links and targeted remediation commands if thresholds are exceeded.
    6. Logs nominal execution status and exports an audit manifest for lineage and historical tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: 0 * * * *] --> B[Task: evaluate_flag_status]
        B --> C{Task: check_flag_anomaly}
        C -- Threshold Breached --> D[Task: notify_slack_flag_alert]
        C -- Nominal Operation --> E[Task: log_healthy_flag_state]
        D --> F[Task: export_flag_manifest]
        E --> F
    ```

    ## What you get
    - Continuous detection of archived flags still actively evaluated in production codebases.\n    - Proactive discovery of stale temporary flags exceeding lifecycle guidelines.\n    - Contextual Slack notifications with direct links to the LaunchDarkly management console.\n    - Exported JSON metadata supporting technical debt burndown reviews.

    ## Who it's for
    - Release Engineers managing progressive rollouts and feature releases.\n    - Platform Engineers guarding against client-side evaluation storms.\n    - Software Developers maintaining clean feature toggle lifecycles.

    ## Why orchestrate this with Kestra
    Feature flags often linger in production code long after rollouts complete, bloating client SDK evaluation payloads and complicating codebase maintenance. Kestra provides a scheduled audit sentinel that checks flag configurations via LaunchDarkly APIs, flags deprecated or archived toggles, and notifies engineering to retire obsolete flags.

    ## Use cases
    - **Production Availability Guardrails**: Continuously detect infrastructure degradation before users experience service disruptions.
    - **Incident Triaging Automation**: Deliver actionable runbook instructions straight into on-call Slack channels.
    - **Platform Capacity Planning**: Maintain longitudinal audit logs of operational saturation and SLA compliance.

    ## Inputs
    | Name | Type | Default | Description |\n    | --- | --- | --- | --- |\n    | `projectKey` | `STRING` | `default` | Key identifier of the LaunchDarkly project. |\n    | `environmentKey` | `STRING` | `production` | Key identifier of the LaunchDarkly environment. |\n    | `flagKey` | `STRING` | `new-checkout-pipeline` | Feature flag key to audit for evaluation surges. |\n    | `launchDarklyApiKey` | `SECRET` | `api-secret-key` | Encrypted LaunchDarkly access token with Reader permissions. |\n    | `slackWebhookUri` | `SECRET` | `https://hooks.slack.com/services/T00/B00/XXXX` | Encrypted Slack Incoming Webhook endpoint for alerting Feature Platform teams. |\n
    ## Expected outputs
    Primary execution outputs exported by `export_flag_manifest`:
    - `report`: Full structured JSON diagnostic report detailing operational parameters and recommendations.
    Example expression: `{{ outputs.export_flag_manifest.value }}`

    ## Prerequisites
    - Network connectivity from the Kestra worker to the target service endpoint.
    - An active API token or service credential with read permissions.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.
    - Relevant target platform API token configured in Kestra secrets.

    ## Quick start
    1. Register the required platform credentials and Slack webhook in Kestra secrets.
    2. Deploy this flow into your target namespace.
    3. Configure input parameters to point to your specific environment.
    4. Execute the flow manually to verify API connectivity and Slack alert routing.

    ## Common pitfalls and troubleshooting
    - **Rate Limiting**: Ensure API request frequencies stay within provider rate limits during peak execution periods.
    - **Empty Telemetry Handling**: If no events are recorded in the query window, the Python script handles null responses gracefully.
    - **Credential Scopes**: Verify that the supplied API token possesses sufficient read permissions for the queried endpoints.

    ## How to extend
    - **Automated Remediation**: Add downstream HTTP tasks to trigger automated scaling or restarts upon failure detection.
    - **PagerDuty Escalation**: Route critical severity alerts directly to PagerDuty or Opsgenie.
    - **Multi-Resource Loops**: Loop through an array of resource identifiers using `io.kestra.plugin.core.flow.ForEach`.

    ## Links
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Official Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
