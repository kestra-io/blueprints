id: tidb-tikv-region-peer-health-sentinel
namespace: company.data

inputs:
  - id: tidb_host
    type: STRING
    displayName: TiDB Host
    defaults: "tidb.internal"
    description: Hostname or IP address of the TiDB server exposing the MySQL wire protocol port.

  - id: tidb_port
    type: INT
    displayName: TiDB Port
    defaults: 4000
    description: Port number for the MySQL wire protocol interface on TiDB (default 4000).

  - id: tidb_database
    type: STRING
    displayName: Database Name
    defaults: "information_schema"
    description: Target database name to establish the session against (default information_schema).

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#data-platform-alerts"
    description: Slack channel destination for operational TiDB cluster incident cards.

  - id: down_seconds_threshold
    type: INT
    displayName: Down Seconds Threshold
    defaults: 300
    description: Maximum tolerated elapsed seconds a TiKV peer may remain offline before triggering critical incident alerts.

  - id: inspect_offline_stores
    type: BOOL
    displayName: Inspect Offline Stores
    defaults: true
    description: Automatically query tikv_store_status to correlate degraded region peers with offline host storage daemons.

triggers:
  - id: every_fifteen_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: probe_degraded_region_peers
    type: io.kestra.plugin.jdbc.mysql.Query
    url: "jdbc:mysql://{{ inputs.tidb_host }}:{{ inputs.tidb_port }}/{{ inputs.tidb_database }}"
    username: "{{ secret('TIDB_USERNAME') }}"
    password: "{{ secret('TIDB_PASSWORD') }}"
    fetchType: FETCH
    allowFailure: true
    sql: |
      SELECT
        COALESCE(s.db_name, 'system') AS db_name,
        COALESCE(s.table_name, 'internal') AS table_name,
        p.region_id,
        p.peer_id,
        p.store_id,
        p.status AS peer_status,
        COALESCE(p.down_seconds, 0) AS down_seconds
      FROM information_schema.tikv_region_peers p
      LEFT JOIN information_schema.tikv_region_status s
        ON p.region_id = s.region_id
      WHERE p.status IN ('DOWN', 'PENDING')
      ORDER BY p.status ASC, p.down_seconds DESC
      LIMIT 50;

  - id: route_by_cluster_health
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {% if outputs.probe_degraded_region_peers.rows is null %}
      PROBE_FAILED
      {% else %}
        {% set critical_down_count = 0 %}
        {% set pending_peer_count = 0 %}
        {% for row in outputs.probe_degraded_region_peers.rows %}
          {% if row.peer_status == 'DOWN' and row.down_seconds >= inputs.down_seconds_threshold %}
            {% set critical_down_count = critical_down_count + 1 %}
          {% elseif row.peer_status == 'PENDING' or row.peer_status == 'DOWN' %}
            {% set pending_peer_count = pending_peer_count + 1 %}
          {% endif %}
        {% endfor %}
        {% if critical_down_count > 0 %}
        CRITICAL
        {% elseif pending_peer_count > 0 %}
        WARNING
        {% else %}
        HEALTHY
        {% endif %}
      {% endif %}
    cases:
      CRITICAL:
        - id: alert_critical_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] TiDB TiKV Region Peers Offline Exceeding Threshold - Cluster Quorum at Risk",
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "TiDB TiKV Region Replication Failure Incident",
                  "fields": [
                    {
                      "title": "Cluster Host",
                      "value": "{{ inputs.tidb_host }}:{{ inputs.tidb_port }}",
                      "short": true
                    },
                    {
                      "title": "Degraded Peers Count",
                      "value": "{{ outputs.probe_degraded_region_peers.size }}",
                      "short": true
                    },
                    {
                      "title": "Severity",
                      "value": "CRITICAL - Persistent Down Peers",
                      "short": true
                    },
                    {
                      "title": "Threshold (Seconds)",
                      "value": "{{ inputs.down_seconds_threshold }}s",
                      "short": true
                    }
                  ],
                  "footer": "Kestra TiDB Sentinel | Execution ID: {{ execution.id }}"
                }
              ]
            }

        - id: inspect_stores_critical
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.inspect_offline_stores == true }}"
          then:
            - id: query_offline_stores
              type: io.kestra.plugin.jdbc.mysql.Query
              url: "jdbc:mysql://{{ inputs.tidb_host }}:{{ inputs.tidb_port }}/{{ inputs.tidb_database }}"
              username: "{{ secret('TIDB_USERNAME') }}"
              password: "{{ secret('TIDB_PASSWORD') }}"
              fetchType: FETCH
              sql: |
                SELECT
                  store_id,
                  address,
                  state_name
                FROM information_schema.tikv_store_status
                WHERE state_name != 'Up';

            - id: log_offline_stores
              type: io.kestra.plugin.core.log.Log
              message: "Degraded or offline TiKV storage nodes identified: {{ outputs.query_offline_stores.rows }}"

      WARNING:
        - id: alert_warning_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[WARNING] TiDB TiKV Pending or Transient Offline Peers Detected - Replication Lagging",
              "attachments": [
                {
                  "color": "#F57C00",
                  "title": "TiDB TiKV Region Replication Warning",
                  "fields": [
                    {
                      "title": "Cluster Host",
                      "value": "{{ inputs.tidb_host }}:{{ inputs.tidb_port }}",
                      "short": true
                    },
                    {
                      "title": "Pending or Brief Down Peers",
                      "value": "{{ outputs.probe_degraded_region_peers.size }}",
                      "short": true
                    },
                    {
                      "title": "Severity",
                      "value": "WARNING - Transient Lag or Node Catchup",
                      "short": true
                    },
                    {
                      "title": "Inspect Stores",
                      "value": "{{ inputs.inspect_offline_stores ? 'Enabled' : 'Disabled' }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra TiDB Sentinel | Execution ID: {{ execution.id }}"
                }
              ]
            }

      PROBE_FAILED:
        - id: alert_probe_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] TiDB Sentinel Probe Failed - Unable to query information_schema.tikv_region_peers. Verify network routing and database grants."
            }

      HEALTHY:
        - id: log_cluster_healthy
          type: io.kestra.plugin.core.log.Log
          message: "TiDB TiKV cluster region health is normal. All evaluated Raft region peers are in NORMAL state."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "TiDB TiKV region health audit completed. Status: {{ outputs.route_by_cluster_health.value ?? 'PROCESSED' }}. Evaluated degraded peers count: {{ outputs.probe_degraded_region_peers.size ?? 0 }}."

errors:
  - id: on_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "[ERROR] TiDB TiKV Region Peer Sentinel flow execution aborted unexpectedly. Execution ID: {{ execution.id }}."
      }

extend:
  title: TiDB TiKV Region Peer Replication Health Sentinel
  metaTitle: TiDB TiKV Region Peer Health Sentinel | Kestra
  shortDescription: Audits TiDB information_schema.tikv_region_peers for offline or lagging Raft replicas and alerts on quorum risk.
  metaDescription: Audit TiDB TiKV Raft region peer states, detect offline or lagging replicas, alert Slack on quorum risks, and inspect storage node health.
  description: |
    TiDB is an open-source, distributed Hybrid Transactional and Analytical Processing (HTAP) database powered by the TiKV distributed key-value storage engine. In TiDB, all table data and secondary indexes are partitioned into dynamic continuous ranges called Raft Regions, which are replicated across multiple TiKV storage nodes via Multi-Raft consensus. When a storage node experiences hardware failure, disk I/O stall, network partitioning, or ungraceful shutdown, region replicas enter `DOWN` or `PENDING` states. If offline peers exceed fault tolerance intervals or multiple peers in the same region fail, Raft quorum is compromised, resulting in partition unavailability, transaction write stalls, and potential data loss. This blueprint provides automated surveillance over `information_schema.tikv_region_peers` and `information_schema.tikv_region_status`, classifies peer replication health, escalates incidents to Slack, and correlates offline replicas with degraded TiKV store daemons.

    ## How it works

    1. Scheduled trigger (`every_fifteen_minutes`) initiates diagnostic health verification every 15 minutes, with manual runs supported via customizable inputs.
    2. Diagnostic probe (`probe_degraded_region_peers`) connects to TiDB over the MySQL wire protocol (`port 4000`) via `io.kestra.plugin.jdbc.mysql.Query` and inspects `information_schema.tikv_region_peers` joined with `information_schema.tikv_region_status` for any peers in `DOWN` or `PENDING` states.
    3. Classification logic evaluates the query output using Pebble templating, discerning whether any peers have been down longer than `down_seconds_threshold` (`CRITICAL`), if peers are temporarily pending/lagging (`WARNING`), if all peers are healthy (`HEALTHY`), or if the database connection failed (`PROBE_FAILED`).
    4. Routing task (`route_by_cluster_health`) switches execution along dedicated paths according to the classified severity.
    5. On `CRITICAL` or `WARNING` states, structured Slack incident cards notify operations channels with impacted cluster endpoints, degraded peer counts, and affected table scopes.
    6. When critical down peers are identified and `inspect_offline_stores` is enabled, `query_offline_stores` interrogates `information_schema.tikv_store_status` to identify specific storage node addresses that have fallen out of the `Up` state.
    7. On `PROBE_FAILED`, dedicated alerts notify administrators of unreachable ports or authentication failures.
    8. Audit log task (`log_audit_summary`) writes execution metadata and evaluated region counts to task logs.

    ## What you get

    - Automated continuous surveillance of TiDB and TiKV Raft region peer replication states across all database schemas.
    - Proactive detection of persistently offline storage peers before regional consensus quorums breach.
    - Automated correlation between offline region peers and host TiKV store daemon addresses.
    - Differentiated incident routing separating transient log catchup (`PENDING`) from severe node failure (`DOWN`).
    - Full execution traceability and audit logging without leaking database credentials in logs or alert payloads.

    ## Who it's for

    - Database Administrators and Platform Engineers managing production TiDB and TiKV clusters.
    - Site Reliability Engineers responsible for distributed transactional database availability and uptime SLAs.
    - Data Engineers deploying high-throughput streaming and analytics workloads on TiDB HTAP infrastructure.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition unifies distributed database health verification, conditional severity branching, and diagnostic diagnostics into version-controlled GitOps workflows.
    - Native MySQL JDBC plugin connectivity communicates directly with TiDB's MySQL wire protocol without external agent binaries or Python container overhead.
    - Built-in conditional routing isolates healthy baseline checks from multi-tiered incident notification cards.
    - Immutable execution history provides operational evidence documenting cluster recovery timelines and storage degradation intervals.
    - Resilient flow-level error trapping guarantees that unexpected network or credential errors trigger immediate emergency alerts.

    ## Prerequisites

    - TiDB cluster running with MySQL wire compatibility enabled (default port 4000).
    - Database user with read access to `information_schema.tikv_region_peers`, `information_schema.tikv_region_status`, and `information_schema.tikv_store_status`.
    - Slack incoming webhook URL for operational incident dispatch.

    ### Secrets

    - `TIDB_USERNAME`: Username for authenticating to the TiDB MySQL wire interface (e.g. root or monitoring user).
    - `TIDB_PASSWORD`: Password for the TiDB database user.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for posting incident cards to Slack.

    ## Quick start

    1. Configure `TIDB_USERNAME`, `TIDB_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Deploy this blueprint to your Kestra instance and trigger an initial manual run with default inputs to verify connectivity against your TiDB server.
    3. Review the execution log in the Kestra UI to verify region peer query execution from `information_schema.tikv_region_peers`.
    4. Enable the `every_fifteen_minutes` schedule trigger to activate automated continuous monitoring.

    ## How to extend

    - Add PD (Placement Driver) API queries to monitor cluster-wide region balance and scheduling operator backlogs.
    - Integrate PagerDuty alerting via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for immediate on-call dispatch during persistent storage store loss.
    - Attach TiFlash replica monitoring via `information_schema.tiflash_replica` to verify columnar analytical replica synchronization freshness.

    ## Links

    - [TiDB TIKV_REGION_PEERS Documentation](https://docs.pingcap.com/tidb/stable/information-schema-tikv-region-peers)
    - [TiDB TIKV_REGION_STATUS Documentation](https://docs.pingcap.com/tidb/stable/information-schema-tikv-region-status)
    - [TiDB TIKV_STORE_STATUS Documentation](https://docs.pingcap.com/tidb/stable/information-schema-tikv-store-status)
    - [Kestra MySQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
