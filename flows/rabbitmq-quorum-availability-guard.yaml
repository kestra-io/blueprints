id: "rabbitmq-quorum-availability-guard"
namespace: "company.team"
description: "Read quorum queue membership and online nodes. Block on lost majority, reduced failover headroom, or invalid queue state."
inputs:
  -
    id: "vhost"
    type: "STRING"
    defaults: "/"
    description: "Exact RabbitMQ virtual host reported by the API."
  -
    id: "vhost_segment"
    type: "STRING"
    defaults: "%2F"
    description: "RFC 3986 percent-encoded virtual host path segment. The default is /."
  -
    id: "queue_name"
    type: "STRING"
    defaults: "orders"
    description: "Exact queue name expected in the response."
  -
    id: "queue_segment"
    type: "STRING"
    defaults: "orders"
    description: "RFC 3986 percent-encoded queue name for the API URI."
  -
    id: "min_members"
    type: "INT"
    defaults: 3
    description: "Minimum quorum queue members to allow. Range 3-9."
  -
    id: "spare_online"
    type: "INT"
    defaults: 1
    description: "Online members required above the voting majority. Range 0-3. Set 1 to keep one node of headroom."
triggers:
  -
    id: "poll_quorum"
    type: "io.kestra.plugin.core.trigger.Schedule"
    cron: "*/10 * * * *"
    disabled: true
    description: "First test a healthy queue and an offline replica; then enable the schedule."
tasks:
  -
    id: "fetch_queue"
    type: "io.kestra.plugin.core.http.Download"
    description: "Read exactly one queue over HTTPS through the RabbitMQ management API. Reject redirects."
    uri: "{{ secret('RABBITMQ_API_URL') }}/api/queues/{{ inputs.vhost_segment }}/{{ inputs.queue_segment }}"
    method: "GET"
    headers:
      Accept: "application/json"
      Authorization: "Basic {{ secret('RABBITMQ_BASIC_AUTH_B64') }}"
    options:
      followRedirects: false
      allowFailed: false
    saveAs: "queue.json"
  -
    id: "check_quorum"
    type: "io.kestra.plugin.scripts.node.Script"
    description: "Check quorum membership, majority, remaining failover headroom, and leader status."
    containerImage: "node:22-alpine"
    env:
      VHOST: "{{ inputs.vhost }}"
      QUEUE_NAME: "{{ inputs.queue_name }}"
      MIN_MEMBERS: "{{ inputs.min_members }}"
      SPARE_ONLINE: "{{ inputs.spare_online }}"
    inputFiles:
      queue.json: "{{ outputs.fetch_queue.uri }}"
    outputFiles:
      - "quorum-health-report.json"
    script: |
      function evaluateQuorum(data, cfg) {
        const reasons=[], obj=x=>x!==null&&typeof x==="object"&&!Array.isArray(x);
        const names=xs=>Array.isArray(xs)&&xs.every(x=>typeof x==="string"&&x.length>0)&&new Set(xs).size===xs.length;
        if(!obj(data))return {status:"BLOCK",reasons:["RabbitMQ response is not a queue object"]};
        if(data.name!==cfg.queue_name||data.vhost!==cfg.vhost)reasons.push("Queue name or vhost does not match the target");
        if(data.type!=="quorum")reasons.push("Target is not a quorum queue");
        if(data.durable!==true)reasons.push("Queue is not durable");
        if(data.state!=="running")reasons.push("Queue state is not running");
        const members=data.members,online=data.online;
        if(!names(members)||members.length<1)reasons.push("Queue member list is missing or invalid");
        if(!names(online))reasons.push("Online member list is missing or invalid");
        const validMembers=names(members)&&members.length>0, validOnline=names(online);
        const majority=validMembers?Math.floor(members.length/2)+1:null;
        if(validMembers&&members.length<cfg.min_members)reasons.push("Queue has fewer members than required");
        if(validMembers&&validOnline){
          if(online.some(node=>!members.includes(node)))reasons.push("Online list includes a node outside queue membership");
          if(online.length<majority)reasons.push("Queue has lost its majority");
          else if(online.length<majority+cfg.spare_online)reasons.push("Queue has too little online failover headroom");
        }
        if(typeof data.leader!=="string"||!validMembers||!members.includes(data.leader))reasons.push("Queue leader is absent or not a member");
        else if(!validOnline||!online.includes(data.leader))reasons.push("Queue leader is not online");
        const report={
          status:reasons.length?"BLOCK":"PASS",vhost:cfg.vhost,queue:cfg.queue_name,
          members:validMembers?[...members].sort():null,online:validOnline?[...online].sort():null,
          leader:typeof data.leader==="string"?data.leader:null,
          total_members:validMembers?members.length:null,
          online_members:validOnline?online.length:null,majority_required:majority,
          failover_headroom:validMembers&&validOnline?online.length-majority:null,
          required_spare_online:cfg.spare_online,reasons};
        return report;
      }
      const fs=require("fs");
      const env=process.env;
      const cfg={queue_name:env.QUEUE_NAME,vhost:env.VHOST,min_members:Number(env.MIN_MEMBERS),spare_online:Number(env.SPARE_ONLINE)};
      if(!cfg.queue_name||!cfg.vhost||!Number.isSafeInteger(cfg.min_members)||cfg.min_members<3||cfg.min_members>9||!Number.isSafeInteger(cfg.spare_online)||cfg.spare_online<0||cfg.spare_online>3)throw Error("Invalid quorum monitor inputs");
      const text=fs.readFileSync("queue.json","utf8");
      if(Buffer.byteLength(text)>1048576)throw Error("Queue response exceeds 1 MiB");
      const data=JSON.parse(text);
      const report=evaluateQuorum(data,cfg);
      fs.writeFileSync("quorum-health-report.json",JSON.stringify(report,null,2));
      console.log("::"+JSON.stringify({outputs:{status:report.status,reason_count:report.reasons.length,online_members:report.online_members??-1,majority_required:report.majority_required??-1}})+"::");
      console.log("Quorum health: "+report.status+"; report saved");
  -
    id: "publish_evidence"
    type: "io.kestra.plugin.core.output.OutputValues"
    description: "Expose the status and evidence URI before the BLOCK branch."
    values:
      status: "{{ outputs.check_quorum.vars.status }}"
      report_uri: "{{ outputs.check_quorum.outputFiles['quorum-health-report.json'] }}"
      reason_count: "{{ outputs.check_quorum.vars.reason_count }}"
  -
    id: "quorum_gate"
    type: "io.kestra.plugin.core.flow.If"
    description: "Alert and fail if a queue has no majority or no required spare online replicas."
    condition: "{{ outputs.check_quorum.vars.status == 'BLOCK' }}"
    then:
      -
        id: "alert_quorum"
        type: "io.kestra.plugin.slack.notifications.SlackIncomingWebhook"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: "{\"text\":\"RabbitMQ quorum BLOCK: {{ inputs.vhost }}/{{ inputs.queue_name }}; findings={{ outputs.check_quorum.vars.reason_count }}; execution={{ execution.id }}. Review quorum-health-report.json.\"}"
      -
        id: "fail_quorum"
        type: "io.kestra.plugin.core.execution.Fail"
        errorMessage: "RabbitMQ quorum check blocked. Review quorum-health-report.json."
    else:
      -
        id: "quorum_healthy"
        type: "io.kestra.plugin.core.log.Log"
        message: "Quorum PASS: {{ inputs.vhost }}/{{ inputs.queue_name }}. This is a point-in-time check."
errors:
  -
    id: "log_probe_error"
    type: "io.kestra.plugin.core.log.Log"
    message: "RabbitMQ API or quorum probe failed. No healthy verdict. Execution {{ execution.id }}."
extend:
  title: "Detect RabbitMQ Quorum Queue Failover Risk"
  metaTitle: "RabbitMQ Quorum Queue Availability and Majority Guard"
  shortDescription: "Read a quorum queue through the management API and block on lost majority, failed replicas, or an offline leader."
  metaDescription: "Monitor RabbitMQ quorum members and online replicas in Kestra. Fail on lost majority, missing leader, or reduced failover headroom."
  description: |
    Check a named RabbitMQ quorum queue before maintenance or on a schedule. This flow uses the management API and does not consume, purge, or publish messages.
    
    ## How it works
    
    1. fetch_queue calls GET /api/queues/{vhost}/{queue} with HTTP Basic authentication. Redirects are disabled.
    2. check_quorum validates the queue identity and type, durable state, leader, member list, online list, and majority.
    3. The checker requires spare_online online members above the majority. Its default is 1.
    4. publish_evidence saves the JSON report URI. quorum_gate sends a Slack alert and fails on BLOCK.
    
    ## What you get
    
    - The member list, online nodes, leader, voting majority, and remaining failure headroom.
    - PASS/BLOCK with exact reasons and a JSON report.
    - A gate that blocks maintenance when the queue no longer has required spare capacity.
    
    ## Who it's for
    
    - Messaging platform operators who run RabbitMQ quorum queues.
    - SREs who need a preflight check before stopping a broker node.
    
    ## Why orchestrate this with Kestra
    
    Run the same check before maintenance and on a schedule. Record the result and stop dependent tasks on BLOCK.
    
    ## Prerequisites
    
    - RabbitMQ Management plugin/API enabled on a trusted HTTPS endpoint.
    - Read-only access to the target queue and its virtual host.
    - A Node Script task runner and Slack incoming webhook.
    
    ### Secrets
    
    - RABBITMQ_API_URL: management HTTPS origin, with no trailing slash, for example https://rabbitmq.example:15671.
    - RABBITMQ_BASIC_AUTH_B64: Base64 of username:password for a read-only monitoring user.
    - SLACK_WEBHOOK_URL: incoming webhook for blocked checks.
    
    ## Quick start
    
    1. Configure the secrets. Set vhost, vhost_segment, queue_name, and queue_segment.
    2. Percent-encode each URI segment. For the default virtual host /, use %2F.
    3. Run a healthy three-member quorum queue. Open outputs.publish_evidence.values.report_uri.
    4. Test with one follower offline. With spare_online=1 the result must be BLOCK.
    5. Check the alert and enable the schedule only after testing.
    
    ## How to extend
    
    - Use a ForEach task to check an approved queue list.
    - Store the report in an incident archive to compare changes across polls.
    - Add a change-approval task before cluster maintenance.
    
    ## Limits
    
    - Online nodes are a point-in-time management API view, not proof of message safety.
    - This flow does not test publisher confirms, network partitions, or Raft log freshness.
    - A majority may still serve traffic when spare_online=1 causes BLOCK. That setting checks for remaining failover headroom.
    - A failed API request or malformed response cannot result in PASS.
    - Set member thresholds for your topology; even-sized groups are supported but not recommended.
    
    ## Links
    
    - https://www.rabbitmq.com/docs/quorum-queues
    - https://www.rabbitmq.com/docs/management
    - https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download
    - Created by [vivekyarra](https://github.com/vivekyarra).
  tags:
    - "Infrastructure"
    - "Data"
  subTags:
    - "Monitoring & Alerting"
    - "Day 2 Operations"
  ee: false
  demo: false
