id: hgnc-gene-panel-symbol-deprecation-gate
namespace: company.team

description: |
  Sign-off gate for a clinical gene panel. Every gene symbol is checked against the HGNC REST API: approved symbols
  pass, previous symbols with a single current gene are rewritten to the approved symbol, and aliases, ambiguous names,
  withdrawn entries, Excel date artefacts and unknown symbols block the gate. The flow writes a per-symbol report and a
  corrected panel, remembers the last result per panel in KV, and fails when a human has to look at the list.

inputs:
  - id: panel_name
    type: STRING
    defaults: Mito and hereditary cancer panel (sample)
    description: Panel name used in the report and as the KV state key. A webhook call can override it with `panel_name` in the JSON body.

  - id: symbols
    type: STRING
    defaults: "BRCA1, BRCA2, TP53, MLH1, MSH2, POLG, OPA1, TWNK, C10orf2, HER2, SEPT9, 2-Sep, GBA, ATP5A1, KIAA0196, MRE11A, palb2, AIP1, BRCA1, NOTAGENE1"
    description: Gene symbols separated by commas, semicolons, spaces or new lines. The defaults are a sample panel with typical legacy entries; every result comes from the live HGNC API. A webhook call can pass `symbols` in the JSON body instead.

  - id: alias_blocks
    type: BOOL
    defaults: true
    description: Treat a symbol that only matches an HGNC alias as blocking. Aliases are not unique identifiers, so the default asks a curator to confirm them; set to false to accept a single-gene alias as a rename.

variables:
  panel_name: "{{ trigger.body.panel_name ?? inputs.panel_name }}"
  symbols: "{{ trigger.body.symbols ?? inputs.symbols }}"
  user_agent: "kestra-hgnc-gene-panel-symbol-deprecation-gate/1.0 (https://kestra.io)"

triggers:
  - id: panel_submitted
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('HGNC_GATE_WEBHOOK_KEY') }}"
    description: POST a JSON body such as {"panel_name":"Cardiomyopathy v4","symbols":"MYH7, MYBPC3, TNNT2"} when a panel draft is ready for sign-off.

  - id: weekly_recheck
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"
    description: Re-checks the live panel in the inputs every Monday, so an HGNC rename after sign-off is caught before the next report run.

tasks:
  - id: parse
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Splits the list and keeps the input order. Excel turns SEPT2, MARCH1 or DEC1 into dates such as 2-Sep, so those
      are mapped back to the legacy symbol. Approved symbols are checked with one OR query per 100 symbols.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    outputFiles:
      - tokens_json
    parameters:
      symbols: "{{ render(vars.symbols) }}"
    sql: |
      CREATE TABLE raw AS
      WITH l AS (SELECT regexp_split_to_array(trim(:symbols), '[\s,;\[\]"]+') AS a)
      SELECT i AS pos, a[i] AS input_symbol FROM l, range(1, len(a) + 1) r(i) WHERE a[i] <> '';

      CREATE TABLE tokens AS
      SELECT pos, input_symbol, excel_date,
             CASE WHEN excel_date AND upper(right(input_symbol, 3)) IN ('SEP', 'MAR', 'DEC')
                  THEN upper(right(input_symbol, 3)) || (CASE upper(right(input_symbol, 3)) WHEN 'SEP' THEN 'T' WHEN 'MAR' THEN 'CH' ELSE '' END)
                       || CAST(CAST(regexp_extract(input_symbol, '^([0-9]+)', 1) AS INTEGER) AS VARCHAR)
                  ELSE input_symbol END AS lookup_symbol
      FROM (SELECT *, regexp_matches(input_symbol, '^[0-9]{1,2}-(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)$', 'i') AS excel_date FROM raw);

      ALTER TABLE tokens ADD COLUMN valid BOOLEAN;
      UPDATE tokens SET valid = regexp_matches(lookup_symbol, '^[A-Za-z0-9][A-Za-z0-9@._-]*$');

      COPY (SELECT * FROM tokens ORDER BY pos) TO '{{ outputFiles.tokens_json }}' (FORMAT JSON, ARRAY true);

      SELECT (SELECT count(*) FROM tokens) AS submitted,
             (SELECT coalesce(CAST(to_json(list(q ORDER BY b)) AS VARCHAR), '[]') FROM (
               SELECT b, 'status' || chr(58) || 'Approved+AND+(' || string_agg('symbol' || chr(58) || '%22' || replace(s, '@', '%40') || '%22', '+OR+') || ')' AS q
               FROM (SELECT s, (row_number() OVER (ORDER BY s) - 1) // 100 AS b
                     FROM (SELECT DISTINCT upper(lookup_symbol) AS s FROM tokens WHERE valid AND NOT excel_date))
               GROUP BY b)) AS batches;

  - id: approved_batches
    type: io.kestra.plugin.core.flow.Loop
    description: One search request per 100 distinct symbols. The search is case-insensitive and returns the approved symbol in its canonical case.
    values: "{{ outputs.parse.outputs[0].row.batches }}"
    concurrencyLimit: 1
    tasks:
      - id: approved_search
        type: io.kestra.plugin.core.http.Download
        uri: "https://rest.genenames.org/search/{{ item.value }}"
        headers: {Accept: application/json, User-Agent: "{{ vars.user_agent }}"}
        options:
          retryOnStatusCodes: [429, 500, 502, 503, 504]
          retry: {type: exponential, interval: PT2S, maxInterval: PT30S, maxAttempts: 4}
    outputs:
      - id: uri
        type: STRING
        value: "{{ outputs.approved_search.uri }}"

  - id: approved
    type: io.kestra.plugin.core.storage.Concat
    files: "{{ outputs.approved_batches.outputs | jq('[.[].outputs.uri]') | first }}"
    separator: "\n"
    extension: .json

  - id: unresolved
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Valid symbols with no approved match go to the per-symbol lookups; Excel dates go there under their legacy symbol.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      tokens.json: "{{ outputs.parse.outputFiles.tokens_json }}"
      approved.json: "{{ outputs.approved.uri }}"
    sql: |
      CREATE TABLE ok AS
      SELECT DISTINCT upper(d->>'$.symbol') AS s
      FROM (SELECT unnest(from_json(json->'$.response.docs', '["JSON"]')) AS d
            FROM read_json_objects('approved.json', format = 'newline_delimited'));
      SELECT coalesce(CAST(to_json(list(DISTINCT lookup_symbol)) AS VARCHAR), '[]') AS todo
      FROM read_json('tokens.json') t
      WHERE valid AND (excel_date OR upper(lookup_symbol) NOT IN (SELECT s FROM ok));

  - id: lookup_unresolved
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.unresolved.outputs[0].row.todo != '[]' }}"
    then:
      - id: legacy_lookups
        type: io.kestra.plugin.core.flow.Loop
        description: |
          Three exact-field fetches per unresolved symbol, one at a time to stay well inside the HGNC limit of 10 requests a
          second: previous symbol, alias, and symbol (which also returns withdrawn entries).
        values: "{{ outputs.unresolved.outputs[0].row.todo }}"
        concurrencyLimit: 1
        tasks:
          - id: by_prev
            type: io.kestra.plugin.core.http.Download
            uri: "https://rest.genenames.org/fetch/prev_symbol/%22{{ item.value | replace({'@': '%40'}) }}%22"
            headers: {Accept: application/json, User-Agent: "{{ vars.user_agent }}"}
            options:
              retryOnStatusCodes: [429, 500, 502, 503, 504]
              retry: {type: exponential, interval: PT2S, maxInterval: PT30S, maxAttempts: 4}
          - id: by_alias
            type: io.kestra.plugin.core.http.Download
            uri: "https://rest.genenames.org/fetch/alias_symbol/%22{{ item.value | replace({'@': '%40'}) }}%22"
            headers: {Accept: application/json, User-Agent: "{{ vars.user_agent }}"}
            options:
              retryOnStatusCodes: [429, 500, 502, 503, 504]
              retry: {type: exponential, interval: PT2S, maxInterval: PT30S, maxAttempts: 4}
          - id: by_symbol
            type: io.kestra.plugin.core.http.Download
            uri: "https://rest.genenames.org/fetch/symbol/%22{{ item.value | replace({'@': '%40'}) }}%22"
            headers: {Accept: application/json, User-Agent: "{{ vars.user_agent }}"}
            options:
              retryOnStatusCodes: [429, 500, 502, 503, 504]
              retry: {type: exponential, interval: PT2S, maxInterval: PT30S, maxAttempts: 4}
        outputs:
          - id: found
            type: STRING
            value: |
              {{ {'symbol': item.value,
                  'prev': fromJson(read(outputs.by_prev.uri)).response.docs | jq('[.[] | {symbol, hgnc_id}]') | first,
                  'alias': fromJson(read(outputs.by_alias.uri)).response.docs | jq('[.[] | {symbol, hgnc_id}]') | first,
                  'own': fromJson(read(outputs.by_symbol.uri)).response.docs | jq('[.[] | {symbol, hgnc_id, status}]') | first} | toJson }}

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    key: "hgnc_gate_{{ render(vars.panel_name) | slugify }}"
    errorOnMissing: false
    description: Last result for this panel. Missing on the first run, so nothing is reported as changed since last time.

  - id: resolve
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Order of precedence: approved, then a previous symbol with one current gene (RENAMED), then an alias. A name that
      points at more than one gene is AMBIGUOUS. A symbol only found as a withdrawn entry is WITHDRAWN. Two inputs that
      land on the same HGNC id (C10orf2 and TWNK) keep the first one and mark the rest DUPLICATE.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      tokens.json: "{{ outputs.parse.outputFiles.tokens_json }}"
      approved.json: "{{ outputs.approved.uri }}"
      lookups.json: "{{ (outputs.legacy_lookups.outputs ?? []) | jq('[.[].outputs.found]') | first | toJson }}"
      state.json: "{{ outputs.previous_state.value ?? '[]' }}"
    outputFiles:
      - report_csv
      - panel_csv
      - state_json
    parameters:
      alias_blocks: "{{ inputs.alias_blocks }}"
      panel_name: "{{ render(vars.panel_name) }}"
    sql: |
      CREATE TABLE ok AS
      SELECT DISTINCT d->>'$.symbol' AS symbol, d->>'$.hgnc_id' AS hgnc_id
      FROM (SELECT unnest(from_json(json->'$.response.docs', '["JSON"]')) AS d
            FROM read_json_objects('approved.json', format = 'newline_delimited'));

      CREATE TABLE lk AS
      SELECT j->>'$.symbol' AS lookup_symbol, j->'$.prev' AS prev, j->'$.alias' AS alias, j->'$.own' AS own
      FROM (SELECT CAST(unnest(from_json(content, '["VARCHAR"]')) AS JSON) AS j FROM read_text('lookups.json'));

      CREATE TABLE res AS
      SELECT t.pos, t.input_symbol, t.excel_date,
             CASE WHEN NOT t.valid THEN 'INVALID'
                  WHEN t.excel_date THEN 'EXCEL_DATE'
                  WHEN ok.symbol = t.lookup_symbol THEN 'APPROVED'
                  WHEN ok.symbol IS NOT NULL THEN 'CASE_FIXED'
                  WHEN json_array_length(lk.prev) = 1 THEN 'RENAMED'
                  WHEN json_array_length(lk.prev) > 1 THEN 'AMBIGUOUS'
                  WHEN json_array_length(lk.alias) = 1 THEN 'ALIAS'
                  WHEN json_array_length(lk.alias) > 1 THEN 'AMBIGUOUS'
                  WHEN json_array_length(lk.own) > 0 THEN 'WITHDRAWN'
                  ELSE 'NOT_FOUND' END AS status,
             coalesce(ok.symbol,
                      CASE WHEN json_array_length(lk.prev) = 1 THEN lk.prev->>'$[0].symbol'
                           WHEN json_array_length(lk.prev) = 0 AND json_array_length(lk.alias) = 1 THEN lk.alias->>'$[0].symbol' END) AS approved_symbol,
             coalesce(ok.hgnc_id,
                      CASE WHEN json_array_length(lk.prev) = 1 THEN lk.prev->>'$[0].hgnc_id'
                           WHEN json_array_length(lk.prev) = 0 AND json_array_length(lk.alias) = 1 THEN lk.alias->>'$[0].hgnc_id' END) AS hgnc_id,
             CASE WHEN json_array_length(lk.prev) > 1 THEN array_to_string(CAST(json_extract_string(lk.prev, '$[*].symbol') AS VARCHAR[]), ' / ')
                  WHEN json_array_length(lk.prev) = 0 AND json_array_length(lk.alias) > 1 THEN array_to_string(CAST(json_extract_string(lk.alias, '$[*].symbol') AS VARCHAR[]), ' / ')
                  WHEN json_array_length(lk.own) > 0 THEN lk.own->>'$[0].status'
                  ELSE '' END AS note
      FROM read_json('tokens.json') t
      LEFT JOIN ok ON upper(ok.symbol) = upper(t.lookup_symbol) AND NOT t.excel_date
      LEFT JOIN lk ON lk.lookup_symbol = t.lookup_symbol;

      UPDATE res SET note = 'Excel date; legacy symbol maps to ' || approved_symbol WHERE status = 'EXCEL_DATE' AND approved_symbol IS NOT NULL;
      UPDATE res SET note = 'Excel date with no gene symbol behind it' WHERE status = 'EXCEL_DATE' AND approved_symbol IS NULL;
      UPDATE res SET status = 'DUPLICATE', note = lower(res.status) || ', same gene as ' || f.input_symbol
      FROM (SELECT hgnc_id, arg_min(input_symbol, pos) AS input_symbol, min(pos) AS first_pos FROM res
            WHERE hgnc_id IS NOT NULL AND status NOT IN ('EXCEL_DATE', 'AMBIGUOUS') GROUP BY hgnc_id) f
      WHERE res.hgnc_id = f.hgnc_id AND res.pos > f.first_pos AND res.status NOT IN ('EXCEL_DATE', 'AMBIGUOUS');

      ALTER TABLE res ADD COLUMN blocking BOOLEAN;
      UPDATE res SET blocking = status IN ('EXCEL_DATE', 'AMBIGUOUS', 'WITHDRAWN', 'NOT_FOUND', 'INVALID')
                                OR (status = 'ALIAS' AND CAST(:alias_blocks AS BOOLEAN));

      CREATE TABLE prev AS
      SELECT s->>'$.input_symbol' AS input_symbol, s->>'$.status' AS status, s->>'$.approved_symbol' AS approved_symbol
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('state.json'));

      ALTER TABLE res ADD COLUMN since_last VARCHAR;
      UPDATE res SET since_last = 'was ' || p.status || coalesce(' ' || p.approved_symbol, '')
      FROM prev p WHERE p.input_symbol = res.input_symbol AND res.pos = (SELECT min(pos) FROM res r WHERE r.input_symbol = res.input_symbol)
        AND (p.status <> res.status OR coalesce(p.approved_symbol, '') <> coalesce(res.approved_symbol, ''));

      COPY (SELECT pos, input_symbol, status, approved_symbol, hgnc_id, blocking, note, since_last FROM res ORDER BY pos)
        TO '{{ outputFiles.report_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT approved_symbol, hgnc_id, input_symbol, status FROM res
            WHERE status IN ('APPROVED', 'CASE_FIXED', 'RENAMED') OR (status = 'ALIAS' AND NOT blocking) ORDER BY pos)
        TO '{{ outputFiles.panel_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT input_symbol, status, approved_symbol, hgnc_id, CAST(current_date AS VARCHAR) AS checked_on FROM res
            QUALIFY pos = min(pos) OVER (PARTITION BY input_symbol) ORDER BY pos)
        TO '{{ outputFiles.state_json }}' (FORMAT JSON, ARRAY true);

      SELECT *, '*HGNC symbol gate, ' || panel_name || '*' || chr(10) || blocking || ' blocking of ' || submitted || ' symbols, '
                || changed_since_last || ' changed since the last check' || chr(10) || findings AS slack_text
      FROM (SELECT :panel_name AS panel_name, count(*) AS submitted,
             count(*) FILTER (WHERE status = 'APPROVED') AS approved,
             count(*) FILTER (WHERE status IN ('CASE_FIXED', 'RENAMED') OR (status = 'ALIAS' AND NOT blocking)) AS corrected,
             count(*) FILTER (WHERE status = 'DUPLICATE') AS duplicates,
             count(*) FILTER (WHERE blocking) AS blocking,
             count(*) FILTER (WHERE since_last IS NOT NULL) AS changed_since_last,
             (SELECT count(*) FROM prev) = 0 AS first_run,
             coalesce(string_agg(input_symbol || ' -> ' || status || coalesce(' ' || approved_symbol, '') || CASE WHEN note <> '' THEN ' (' || note || ')' ELSE '' END
                                 || coalesce(', ' || since_last, ''), chr(10) ORDER BY pos)
                      FILTER (WHERE status <> 'APPROVED' OR since_last IS NOT NULL), '') AS findings
      FROM res);

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "hgnc_gate_{{ render(vars.panel_name) | slugify }}"
    value: "{{ read(outputs.resolve.outputFiles.state_json) | trim }}"

  - id: notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.resolve.outputs[0].row.blocking > 0 or outputs.resolve.outputs[0].row.changed_since_last > 0 }}"
    then:
      - id: log_findings
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.resolve.outputs[0].row.panel_name }}: {{ outputs.resolve.outputs[0].row.blocking }} blocking, {{ outputs.resolve.outputs[0].row.changed_since_last }} changed since the last check\n{{ outputs.resolve.outputs[0].row.findings }}"

      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the gate result intact when the webhook is not configured; findings are in the WARN log and the report CSV.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': outputs.resolve.outputs[0].row.slack_text} | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      {{ outputs.resolve.outputs[0].row.panel_name }}: {{ outputs.resolve.outputs[0].row.submitted }} symbols, {{ outputs.resolve.outputs[0].row.approved }} approved, {{ outputs.resolve.outputs[0].row.corrected }} corrected, {{ outputs.resolve.outputs[0].row.duplicates }} duplicate, {{ outputs.resolve.outputs[0].row.blocking }} blocking, {{ outputs.resolve.outputs[0].row.changed_since_last }} changed since last check{{ outputs.resolve.outputs[0].row.first_run ? ' (first run for this panel)' : '' }}.
      {{ outputs.resolve.outputs[0].row.findings }}

  - id: gate
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ outputs.resolve.outputs[0].row.blocking > 0 }}"
    errorMessage: "{{ outputs.resolve.outputs[0].row.blocking }} symbol(s) need a curator before {{ outputs.resolve.outputs[0].row.panel_name }} can be signed off; see the report CSV of the resolve task."

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.resolve.outputs[0].row }}"
  - id: report_csv
    type: FILE
    value: "{{ outputs.resolve.outputFiles.report_csv }}"
  - id: corrected_panel_csv
    type: FILE
    value: "{{ outputs.resolve.outputFiles.panel_csv }}"

extend:
  title: HGNC Gene Panel Symbol Deprecation Gate
  metaTitle: Validate Gene Panel Symbols Against HGNC Before Sign-off | Kestra
  shortDescription: Check every gene symbol on a clinical panel against the HGNC REST API, rewrite renamed genes to the approved symbol, and fail the sign-off when aliases, ambiguous, withdrawn or unknown symbols need a curator.
  metaDescription: "Gate gene panels on HGNC: rename legacy symbols, catch aliases, Excel dates and withdrawn genes, and fail sign-off until a curator fixes them."
  description: |
    Gene panels collect legacy names (C10orf2 for TWNK, GBA for GBA1), aliases such as HER2, and dates Excel made from
    SEPT2 or MARCH1. Such names silently drop genes from coverage reports and variant filters. This flow checks each
    symbol against the HGNC REST API on submission and weekly, rewrites the safe cases, and fails the gate when a
    curator has to decide.

    ## How it works

    1. A Webhook call (JSON body with `panel_name` and `symbols`), the Monday schedule or a manual run starts the flow.
    2. DuckDB splits the list and maps Excel dates such as `2-Sep` back to the legacy symbol (SEPT2).
    3. A `Loop` sends one HGNC `search` per 100 distinct symbols, limited to `status:Approved`. The search is case-insensitive, so `palb2` becomes PALB2.
    4. An `If` runs a second `Loop` only for the rest: exact `fetch` calls on `prev_symbol`, `alias_symbol` and `symbol`, one at a time.
    5. DuckDB classifies every symbol as APPROVED, CASE_FIXED, RENAMED (previous symbol of one gene), ALIAS, AMBIGUOUS (more than one gene), WITHDRAWN, EXCEL_DATE, NOT_FOUND, INVALID or DUPLICATE (two inputs that resolve to the same HGNC id).
    6. The result is compared with the last run for the same panel, kept in KV, so a gene that HGNC renamed after sign-off shows up as `was APPROVED GBA`.
    7. Findings go to the WARN log and Slack, and a `Fail` task stops the execution when anything is blocking.

    ## What you get

    - A report CSV per input symbol: status, approved symbol, HGNC id, note (for example the six genes behind the alias AIP1) and the change since the last check.
    - A corrected panel CSV with approved symbols and HGNC ids, without duplicates or blocking rows.
    - A failed execution while anything blocks sign-off; a clean panel finishes green and posts nothing.

    ## Who it's for

    Clinical genomics labs, bioinformatics teams that maintain diagnostic panels and data managers who receive gene lists from clinicians.

    ## Why orchestrate this with Kestra

    One gate serves the submission webhook and the weekly re-check, with retries on HGNC errors, per-panel KV state, and a failed execution that downstream flows or a reviewer can act on.

    ## Prerequisites

    - Outbound HTTPS to rest.genenames.org. No API key is needed; HGNC asks for no more than 10 requests a second, and the lookups run one at a time.
    - The default `symbols` are a sample panel with typical legacy entries; every classification comes from the live HGNC API.

    ### Secrets

    - `HGNC_GATE_WEBHOOK_KEY`: key in the webhook URL used by the panel submission tool.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for findings (optional; the Slack task has `allowFailure: true`).

    ## Quick start

    1. Add the secrets above.
    2. Run the flow manually with the default inputs. Expect a failed execution with RENAMED, ALIAS, AMBIGUOUS, EXCEL_DATE and NOT_FOUND rows in the summary log.
    3. Replace `symbols` and `panel_name` with your live panel, or POST it to `/api/v1/main/executions/webhook/company.team/hgnc-gene-panel-symbol-deprecation-gate/<key>`.
    4. Set `alias_blocks` to false if a single-gene alias should be accepted as a rename.

    ## How to extend

    - Read the panel from a file in your LIMS export and write the corrected panel back to object storage.
    - Add a Flow trigger that starts the BED or filter build only after this gate succeeds.

    ## Links

    - [HGNC REST web service](https://www.genenames.org/help/rest/)
    - [Kestra Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook)
    - [Kestra Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [DuckDB Queries task](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack incoming webhook task](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - Monitoring & Alerting
  ee: false
  demo: false
