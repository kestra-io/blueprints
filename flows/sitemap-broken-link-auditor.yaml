id: sitemap-broken-link-auditor
namespace: company.team
description: |
  Crawl your sitemap, HEAD-check every indexed URL, and turn 404s and
  timeouts into a GitHub issue and a Slack alert — the link rot audit
  that runs itself.

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audit the sitemap once a week, early Monday. Shipped disabled; enable it after your first successful manual run.
    cron: "0 5 * * 1"
    disabled: true
  - id: audit_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call this after a deploy or a migration to re-audit immediately instead of waiting for the weekly slot.
    key: sitemap-audit

inputs:
  - id: sitemap_url
    type: STRING
    defaults: https://example.com/sitemap.xml
    description: Absolute URL of your sitemap.xml — plain urlset or a sitemap index (child sitemaps are followed, capped by max_urls). .gz files are supported.
  - id: repository
    type: STRING
    defaults: your-org/your-site
    description: GitHub repository (owner/name) where the broken-link issue will be opened.
  - id: max_urls
    type: INT
    defaults: 50
    description: Audit at most this many URLs per run, so one giant sitemap cannot turn into an hour-long crawl.
  - id: request_timeout
    type: INT
    defaults: 10
    description: Seconds to wait per URL before counting it as broken (timeouts are link rot too).

tasks:
  - id: crawl_sitemap
    type: io.kestra.plugin.scripts.python.Script
    description: Fetch and parse the sitemap (following index files and gzipped sitemaps), probe every URL with HEAD and a GET fallback in a small thread pool, and publish checked, broken_count, and the broken list — url with status — through Kestra's stdout outputs protocol. A sitemap that fetches but contains zero URLs fails fast, because an empty audit must never read as a clean one.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      SITEMAP_URL: "{{ inputs.sitemap_url }}"
      MAX_URLS: "{{ inputs.max_urls }}"
      REQUEST_TIMEOUT: "{{ inputs.request_timeout }}"
    script: |
      import gzip
      import json
      import os
      import urllib.error
      import urllib.request
      import xml.etree.ElementTree as ET
      from concurrent.futures import ThreadPoolExecutor

      SITEMAP_URL = os.environ["SITEMAP_URL"]
      MAX_URLS = int(os.environ["MAX_URLS"])
      TIMEOUT = int(os.environ["REQUEST_TIMEOUT"])
      UA = {"User-Agent": "Kestra-sitemap-auditor/1.0"}
      NS = "{http://www.sitemaps.org/schemas/sitemap/0.9}"

      def fetch(url):
          req = urllib.request.Request(url, headers=UA)
          with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
              data = resp.read()
          if url.endswith(".gz") or data[:2] == b"\x1f\x8b":
              data = gzip.decompress(data)
          return data

      def load_urls(url, depth=0):
          root = ET.fromstring(fetch(url))
          tag = root.tag.split("}")[-1]
          locs = [e.text.strip() for e in root.iter(NS + "loc") if e.text]
          if tag == "sitemapindex" and depth < 2:
              out = []
              for child in locs[:5]:
                  out.extend(load_urls(child, depth + 1))
                  if len(out) >= MAX_URLS:
                      break
              return out
          return locs

      def probe(url):
          for method in ("HEAD", "GET"):
              try:
                  req = urllib.request.Request(url, method=method, headers=UA)
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                      return {"url": url, "status": resp.status}
              except urllib.error.HTTPError as e:
                  if method == "HEAD":
                      continue
                  return {"url": url, "status": e.code}
              except Exception as e:
                  if method == "HEAD":
                      continue
                  return {"url": url, "status": "ERR: " + str(e)[:80]}

      urls = load_urls(SITEMAP_URL)[:MAX_URLS]
      if not urls:
          raise SystemExit("sitemap contains no URLs — refusing to report a clean audit")

      with ThreadPoolExecutor(max_workers=8) as pool:
          results = list(pool.map(probe, urls))

      broken = [r for r in results if not isinstance(r["status"], int) or r["status"] >= 400]
      print("checked %d url(s), %d broken" % (len(results), len(broken)))
      print("::" + json.dumps({"outputs": {
          "checked": len(results),
          "broken_count": len(broken),
          "broken": broken[:25],
      }}) + "::")

  - id: check_links
    type: io.kestra.plugin.core.flow.If
    description: Any broken URL is actionable — branch on the count so clean audits stay quiet and broken ones leave a paper trail engineers already watch.
    condition: "{{ outputs.crawl_sitemap.vars.broken_count > 0 }}"
    then:
      - id: create_issue
        type: io.kestra.plugin.github.issues.Create
        description: Open a labeled GitHub issue listing the failing URLs and their statuses, so link rot lands in the same backlog as everything else the team triages.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.repository }}"
        title: "Broken links detected: {{ outputs.crawl_sitemap.vars.broken_count }} URL(s) failing in sitemap audit"
        body: |
          ## Sitemap audit findings

          **{{ outputs.crawl_sitemap.vars.broken_count }} of {{ outputs.crawl_sitemap.vars.checked }} URL(s)** checked from `{{ inputs.sitemap_url }}` are failing:

          | URL | Status |
          | --- | --- |
          {% for item in outputs.crawl_sitemap.vars.broken %}| {{ item.url }} | {{ item.status }} |
          {% endfor %}

          Execution: {{ execution.id }}

          Fix or remove the pages, then re-run the audit (or call the sitemap-audit webhook) to confirm they recover.
        labels:
          - seo
          - broken-links
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Tell the team how many pages are down and that a GitHub issue holds the full list.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Sitemap audit: {{ outputs.crawl_sitemap.vars.broken_count }} of {{ outputs.crawl_sitemap.vars.checked }} URL(s) from {{ inputs.sitemap_url }} are broken or timing out. A GitHub issue has been opened in {{ inputs.repository }} with the list. Execution {{ execution.id }}."
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record the all-clear with the URL count, so a healthy audit still shows up in the execution history.
        message: "Sitemap audit clean: {{ outputs.crawl_sitemap.vars.checked }} URL(s) checked from {{ inputs.sitemap_url }}, zero broken."

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the audit itself could not run — unreachable sitemap, parse error, rejected token — because a dead auditor must never be mistaken for a clean bill of health.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Sitemap audit FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.sitemap_url }}. No link check was performed — verify the sitemap URL, Worker network access, and the GITHUB_TOKEN/SLACK_WEBHOOK_URL secrets."
      }

outputs:
  - id: audit_summary
    type: JSON
    description: 'The audit result — e.g. {"checked": 12, "broken_count": 1, "broken": [{"url": "...", "status": 404}]} — ready for dashboards or a follow-up gate.'
    value: "{{ outputs.crawl_sitemap.vars | toJson }}"

extend:
  title: Catch Link Rot Before Your Users and Your Crawler Do
  shortDescription: Weekly sitemap crawler that HEAD-checks every indexed URL and turns 404s and timeouts into a GitHub issue plus a Slack alert.
  metaTitle: Broken Link Checking from Sitemaps with Kestra
  metaDescription: Crawl your sitemap, check every indexed URL, and get a GitHub issue and Slack alert listing the pages that return errors or time out.
  description: |
    Every site accumulates link rot: pages move, deploys drop routes, redirects expire, and the sitemap keeps listing what used to exist. The audit that would catch it is exactly the chore nobody schedules — until an SEO report or a customer does it for you. This blueprint reads your sitemap (index files and gzipped sitemaps included), probes each URL with a HEAD request and a GET fallback so no CDN quirks create false alarms, and when anything fails it opens a GitHub issue with the full URL/status table and tells Slack. Clean runs log quietly, so the execution history doubles as proof the audit keeps happening.

    ## How it works

    1. `crawl_sitemap` (`io.kestra.plugin.scripts.python.Script` on the `io.kestra.plugin.core.runner.Process` runner) fetches the sitemap, decompresses `.gz`, follows up to five child sitemaps when it is an index, and caps the crawl at `max_urls`. Every URL is probed concurrently (8 workers) with `HEAD`, falling back to `GET` for servers that reject HEAD, treating HTTP errors and timeouts as broken. `checked`, `broken_count`, and the first 25 `broken` entries are emitted through the `::{"outputs": ...}::` protocol. A sitemap with zero URLs fails fast rather than reporting a clean audit.
    2. `check_links` (`io.kestra.plugin.core.flow.If`) branches on `broken_count`. Over zero: `create_issue` (`io.kestra.plugin.github.issues.Create`) opens a labeled issue with a markdown table of every failing URL, and `alert_slack` posts the counts; at zero: `log_clean` records the all-clear.
    3. The `errors` block alerts Slack when the audit itself breaks — an unreachable sitemap must never read as zero broken links.
    4. Triggers: a weekly `Schedule` (shipped disabled) plus a `Webhook` (`sitemap-audit`) to re-check right after a deploy or migration.

    ## What you get

    - An automated link-rot audit: every indexed URL checked on a cadence, no browser extensions, no cron glue.
    - False-alarm-resistant probing: HEAD first, GET fallback, timeouts counted as broken.
    - A GitHub issue as the durable record — the failing pages land in the team's existing backlog with labels.
    - An `audit_summary` JSON output (`checked`, `broken_count`, `broken`) for dashboards or a release gate.

    ## Who it's for

    - Content and docs teams whose sites outgrow manual link checks.
    - SEO-minded engineers who want sitemap hygiene covered by the same orchestrator that runs everything else.
    - Agencies and publishers managing sites where dead pages cost money.

    ## Why orchestrate this with Kestra

    A link checker script finds broken links; it does not decide weekly cadence vs post-deploy trigger, open the backlog item, notify the channel, alert on its own failure, and keep a history proving the audit ran. Wrapping the crawl in a flow makes the audit event-driven (the webhook), durable (the issue), and self-reporting (the errors alert) — and the `audit_summary` output makes "no broken links" a condition other flows can require.

    ## Prerequisites

    - A public (or Worker-reachable) sitemap URL.
    - A GitHub token with issue-create permission on the `repository` input.
    - A Slack incoming webhook for failure and broken-link alerts.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub token used to open the broken-links issue.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for audit and failure alerts.

    ## Quick start

    1. Add both secrets to your Kestra namespace.
    2. Set `sitemap_url` to your sitemap and `repository` to the target repo.
    3. Run once and read `audit_summary` — expect a sensible `checked` count and your known-bad pages (if any) listed.
    4. Enable the `weekly_audit` schedule, and call the `sitemap-audit` webhook after deploys.

    ## How to extend

    - Require zero broken links before a release by chaining this flow as a subflow in your deploy pipeline and branching on `audit_summary.broken_count`.
    - Recreate the GitHub issue instead of opening a new one each week by searching open `broken-links` issues first with `io.kestra.plugin.github.issues.Search`.
    - Extend the probe set: fetch each broken URL's redirects and report the redirect chain that died.
    - Push the `audit_summary` into a dashboard alongside uptime and performance checks.

    ## Links

    - [Sitemaps protocol](https://www.sitemaps.org/protocol.html)
    - [Kestra GitHub plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Webhook trigger](https://kestra.io/plugins/triggers/webhook)
    - This blueprint has been created by [RudraMalvankar](https://github.com/RudraMalvankar)
  tags:
    - Data
    - Business
  subTags:
    - SEO & Content
    - Monitoring & Alerting
  ee: false
  demo: false
