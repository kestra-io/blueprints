
id: github-issue-backlog-risk-analyzer
namespace: company.team

inputs:
  - id: owner
    type: STRING
    defaults: kestra-io
    description: GitHub repository owner or organization.

  - id: repository
    type: STRING
    defaults: kestra
    description: Name of the public GitHub repository.

  - id: risk_threshold
    type: INT
    defaults: 1000
    description: Maximum open issue count before the backlog is classified as high risk.

  - id: issue_age_threshold_days
    type: INT
    defaults: 30
    description: Number of days after which an open issue is considered at risk.

  - id: escalation_after_days
    type: INT
    defaults: 7
    description: Number of days after first flagging an issue before it qualifies for escalation.

description: |
  Analyze a public GitHub repository's open issue backlog.
  Classify the backlog with DuckDB SQL, identify aging issues,
  remember previously flagged issues with Kestra KV, and log escalation
  status after the configured number of days.

tasks:
  - id: fetch_open_issues
    type: io.kestra.plugin.core.http.Request
    description: Fetch the total number of open issues from GitHub.
    uri: "https://api.github.com/search/issues?q=repo%3A{{ inputs.owner }}%2F{{ inputs.repository }}%20is%3Aissue%20is%3Aopen&per_page=1"
    method: GET

  - id: fetch_issue_details
    type: io.kestra.plugin.core.http.Request
    description: Fetch open issues and their creation dates.
    uri: "https://api.github.com/repos/{{ inputs.owner }}/{{ inputs.repository }}/issues?state=open&per_page=100"
    method: GET
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"

  - id: analyze_backlog
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Classify the backlog using DuckDB SQL.
    communityExtensions: []
    fetchType: FETCH_ONE
    sql: |
      SELECT
        '{{ inputs.owner }}/{{ inputs.repository }}' AS repository,
        {{ outputs.fetch_open_issues.body | jq('.total_count') | first }} AS open_issues,
        {{ inputs.risk_threshold }} AS risk_threshold,
        CASE
          WHEN {{ outputs.fetch_open_issues.body | jq('.total_count') | first }} >= {{ inputs.risk_threshold }}
          THEN 'HIGH'
          ELSE 'NORMAL'
        END AS risk_status;

  - id: analyze_issue_age
    type: io.kestra.plugin.core.flow.Loop
    description: Identify old open issues and track their escalation status.
    values: "{{ outputs.fetch_issue_details.body | jq('[.[] | select(has(\"pull_request\") | not) | {number, title, created_at, age_days: ((now - (.created_at | fromdateiso8601)) / 86400 | floor)}]') | first }}"
    tasks:
      - id: check_issue_age
        type: io.kestra.plugin.core.flow.If
        condition: "{{ fromJson(item.value).age_days >= inputs.issue_age_threshold_days }}"
        then:
          - id: check_previous_flag
            type: io.kestra.plugin.core.flow.If
            condition: "{{ kv(key='github-issue-' ~ inputs.owner ~ '-' ~ inputs.repository ~ '-' ~ fromJson(item.value).number, errorOnMissing=false) is null }}"
            then:
              - id: remember_flagged_issue
                type: io.kestra.plugin.core.kv.Set
                key: "github-issue-{{ inputs.owner }}-{{ inputs.repository }}-{{ fromJson(item.value).number }}"
                value: "{{ now() }}"
                kvType: STRING

              - id: log_at_risk_issue
                type: io.kestra.plugin.core.log.Log
                message: "NEW AT-RISK ISSUE #{{ fromJson(item.value).number }}: {{ fromJson(item.value).title }} — age: {{ fromJson(item.value).age_days }} days."

            else:
              - id: log_already_flagged
                type: io.kestra.plugin.core.log.Log
                message: "Issue #{{ fromJson(item.value).number }} was flagged previously; keeping its original timestamp."

              - id: check_escalation
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (now() | timestamp) - (kv(key='github-issue-' ~ inputs.owner ~ '-' ~ inputs.repository ~ '-' ~ fromJson(item.value).number, errorOnMissing=false) | timestamp) >= inputs.escalation_after_days * 86400 }}"
                then:
                  - id: log_escalated_issue
                    type: io.kestra.plugin.core.log.Log
                    message: "ESCALATION: Issue #{{ fromJson(item.value).number }} — {{ fromJson(item.value).title }} — has remained flagged for at least {{ inputs.escalation_after_days }} days."

                else:
                  - id: log_escalation_not_due
                    type: io.kestra.plugin.core.log.Log
                    message: "Issue #{{ fromJson(item.value).number }} has not reached its escalation deadline."

  - id: log_backlog_report
    type: io.kestra.plugin.core.log.Log
    description: Print a readable backlog analysis report.
    message: |
      ========================================
      GITHUB ISSUE BACKLOG RISK REPORT
      ========================================
      Repository: {{ outputs.analyze_backlog.row.repository }}
      Open issues: {{ outputs.analyze_backlog.row.open_issues }}
      Risk threshold: {{ outputs.analyze_backlog.row.risk_threshold }}
      Risk status: {{ outputs.analyze_backlog.row.risk_status }}
      Issue age threshold: {{ inputs.issue_age_threshold_days }} days
      Escalation period: {{ inputs.escalation_after_days }} days
      ========================================
      Issues are flagged when their age reaches the configured threshold.
      Previously flagged issues retain their original timestamp.
      Escalation status is logged after the configured waiting period.
      ========================================

  - id: check_backlog_risk
    type: io.kestra.plugin.core.flow.If
    description: Route execution according to the backlog risk classification.
    condition: "{{ outputs.analyze_backlog.row.open_issues >= outputs.analyze_backlog.row.risk_threshold }}"
    then:
      - id: high_backlog_warning
        type: io.kestra.plugin.core.log.Log
        message: "WARNING: The open issue backlog has reached or exceeded the configured threshold."
    else:
      - id: normal_backlog_message
        type: io.kestra.plugin.core.log.Log
        message: "The open issue backlog is below the configured threshold."

triggers:
  - id: daily_backlog_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 3 * * *"

extend:
  title: GitHub Issue Backlog Risk Analyzer
  metaTitle: GitHub Issue Backlog Risk Analyzer | Kestra
  shortDescription: Analyze GitHub issue backlogs, flag aging issues, and track escalation status with DuckDB SQL and Kestra KV.
  metaDescription: Monitor a public GitHub repository's open issue backlog with Kestra, DuckDB SQL, issue-age tracking, KV-based deduplication, and configurable escalation.

  description: |
    Monitor the open issue backlog of a public GitHub repository.
    This workflow fetches the total issue count, classifies backlog risk
    with DuckDB SQL, identifies aging issues, and remembers previously
    flagged issues using Kestra KV. It logs escalation status after
    the configured waiting period.

    ## How it works

    1. A daily schedule starts the workflow.
    2. HTTP requests retrieve the total open issue count and issue details.
    3. DuckDB SQL classifies the backlog as HIGH or NORMAL.
    4. The workflow identifies issues that meet the configured age threshold.
    5. Kestra KV records when an issue is first flagged.
    6. Previously flagged issues are checked for escalation eligibility.
    7. A readable report summarizes the backlog and configured thresholds.

    ## What you get

    - Repository name and total open issue count.
    - SQL-generated backlog risk classification.
    - Identification of aging open issues.
    - KV-based tracking of previously flagged issues.
    - Configurable escalation period, set to 7 days by default.
    - Task-level logs and execution history in Kestra.

    ## Who it's for

    - Open-source maintainers.
    - Engineering teams monitoring issue backlogs.
    - Developers learning API-driven workflow automation and SQL analysis.

    ## Why use Kestra

    Kestra coordinates API requests, SQL analysis, conditional routing,
    issue tracking, and scheduled execution in one observable workflow.
    Each execution records task status and logs for troubleshooting.

    ## Prerequisites

    - A running Kestra instance.
    - Outbound internet access.
    - A public GitHub repository accessible through the GitHub API.
    - Awareness of GitHub's unauthenticated API rate limits.

    ## Secrets

    No secrets are required for this public repository example.

    ## Quick start

    1. Import the workflow into a Kestra namespace.
    2. Execute it manually and inspect the task outputs.
    3. Configure the owner, repository, risk threshold, and issue-age threshold.
    4. Review the backlog report and at-risk issue logs.
    5. Adjust the escalation period as needed.
    6. Enable the daily schedule.

    ## How to extend

    - Add email or chat notifications for high-risk backlogs.
    - Add GitHub issue comments using an appropriately scoped token.
    - Add pagination to retrieve more than 100 issue records.
    - Track labels, milestones, or assignees for richer risk analysis.
    - Store daily backlog counts for historical trend analysis.
    - Add separate deduplication for escalation notifications.

    ## Links

    - [GitHub Search Issues API](https://docs.github.com/en/rest/search/search#search-issues)
    - [Kestra DuckDB plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra HTTP plugin](https://kestra.io/plugins/plugin-core)

  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
