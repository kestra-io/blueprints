
id: github-issue-backlog-risk-analyzer
namespace: company.team

inputs:
  - id: owner
    type: STRING
    defaults: kestra-io
    description: GitHub repository owner or organization.

  - id: repository
    type: STRING
    defaults: kestra
    description: Name of the public GitHub repository.

  - id: risk_threshold
    type: INT
    defaults: 1000
    description: Maximum open issue count before the backlog is classified as high risk.

description: |
  Analyze the open issue backlog of a public GitHub repository.
  Fetch the total open issue count, evaluate it with DuckDB SQL,
  and log a warning when the configured risk threshold is exceeded.

tasks:
  - id: fetch_open_issues
    type: io.kestra.plugin.core.http.Request
    description: Fetch the total number of open issues from a public GitHub repository.
    uri: "https://api.github.com/search/issues?q=repo%3A{{ inputs.owner }}%2F{{ inputs.repository }}%20is%3Aissue%20is%3Aopen&per_page=1"
    method: GET

  - id: analyze_backlog
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Classify the issue backlog using DuckDB SQL.
    communityExtensions: []
    fetchType: FETCH_ONE
    sql: |
      SELECT
        '{{ inputs.owner }}/{{ inputs.repository }}' AS repository,
        {{ outputs.fetch_open_issues.body | jq('.total_count') | first }} AS open_issues,
        {{ inputs.risk_threshold }} AS risk_threshold,
        CASE
          WHEN {{ outputs.fetch_open_issues.body | jq('.total_count') | first }} > {{ inputs.risk_threshold }}
          THEN 'HIGH'
          ELSE 'NORMAL'
        END AS risk_status;

  - id: log_backlog_report
    type: io.kestra.plugin.core.log.Log
    description: Print the backlog analysis results.
    message: |
      GitHub Issue Backlog Risk Report
      Repository: {{ outputs.analyze_backlog.row.repository }}
      Open issues: {{ outputs.analyze_backlog.row.open_issues }}
      Risk threshold: {{ outputs.analyze_backlog.row.risk_threshold }}
      Risk status: {{ outputs.analyze_backlog.row.risk_status }}

  - id: check_backlog_risk
    type: io.kestra.plugin.core.flow.If
    description: Route execution according to the backlog risk classification.
    condition: "{{ outputs.analyze_backlog.row.open_issues > outputs.analyze_backlog.row.risk_threshold }}"
    then:
      - id: high_backlog_warning
        type: io.kestra.plugin.core.log.Log
        message: "WARNING: The open issue backlog exceeds the configured threshold."
    else:
      - id: normal_backlog_message
        type: io.kestra.plugin.core.log.Log
        message: "The open issue backlog is within the configured threshold."

triggers:
  - id: daily_backlog_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 3 * * *"

extend:
  title: GitHub Issue Backlog Risk Analyzer
  metaTitle: GitHub Issue Backlog Risk Analyzer | Kestra
  shortDescription: Analyze open GitHub issues with DuckDB SQL and automatically flag repositories whose backlog exceeds a risk threshold.
  metaDescription: Monitor a public GitHub repository's open issue backlog with Kestra, DuckDB SQL, scheduled checks, and conditional risk warnings.
  description: |
    Monitor the size of a public GitHub repository's open issue backlog.
    This workflow fetches the total issue count from GitHub's Search API,
    evaluates it with DuckDB SQL, and logs a warning when the count exceeds
    the configured risk threshold.

    ## How it works

    1. A daily schedule starts the workflow.
    2. An HTTP request calls GitHub's Search Issues API for open issues in the configured repository.
    3. DuckDB SQL classifies the backlog as HIGH or NORMAL.
    4. A conditional task logs the appropriate warning or status message.

    ## What you get

    - A repository name and open issue count.
    - A SQL-generated risk classification.
    - Conditional warning logs when the threshold is exceeded.
    - Execution history and task-level observability in Kestra.

    ## Who it's for

    - Open-source maintainers.
    - Engineering teams monitoring issue backlogs.
    - Developers learning API-driven workflow automation and SQL analysis.

    ## Why orchestrate this with Kestra

    Kestra coordinates the API request, SQL analysis, conditional routing, and daily schedule in one observable workflow. Each execution records task status and output, making it easier to troubleshoot failures and extend the monitoring process.

    ## Prerequisites

    - A running Kestra instance.
    - Outbound internet access.
    - A public GitHub repository accessible through the GitHub Search API.
    - The GitHub Search API has unauthenticated rate limits.

    ### Secrets

    - No secrets are required for this public repository example.

    ## Quick start

    1. Import the workflow into a Kestra namespace.
    2. Execute it manually and inspect the task outputs.
    3. Set the owner, repository, and risk_threshold inputs for the target public repository.
    4. Confirm the SQL risk classification and conditional log.
    5. Enable the daily schedule.

    ## How to extend

    - Configure the repository owner and name through flow inputs without editing the API URL.
    - Adjust the risk threshold for different repositories.
    - Add email or chat notifications when the backlog exceeds the threshold.
    - Track issue age, labels, or milestones for a more detailed risk score.
    - Persist daily counts to a database for historical trend analysis.

    ## Links

    - [GitHub Search Issues API](https://docs.github.com/en/rest/search/search#search-issues)
    - [Kestra DuckDB plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra HTTP plugin](https://kestra.io/plugins/plugin-core)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
