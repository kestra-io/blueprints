id: openebs-mayastor-pool-degraded-and-rebuild-stall-sentinel
namespace: company.sre

description: |
  Audits OpenEBS Mayastor NVMe-oF storage pool health, replica degraded states, rebuild progress stalls, and disk pool capacity exhaustion.

concurrency:
  limit: 1

inputs:
  - id: mayastor_metrics_url
    type: STRING
    displayName: "Mayastor Metrics Service URL"
    defaults: "http://mayastor-metrics.openebs.svc.cluster.local:9090"
    description: "Internal HTTP URL exposing Prometheus metrics for the OpenEBS Mayastor storage control plane."

  - id: pool_name
    type: STRING
    displayName: "Storage Pool Identifier"
    defaults: "mayastor-nvme-pool-01"
    description: "Identifier of the target Mayastor NVMe-oF disk pool resource under active surveillance."

  - id: max_degraded_replicas_threshold
    type: INT
    displayName: "Max Degraded Replicas Threshold"
    defaults: 2
    description: "Maximum allowable degraded or un-synchronized volume replicas before dispatching an alert."

  - id: max_rebuild_stall_duration_seconds
    type: INT
    displayName: "Max Rebuild Stall Duration (s)"
    defaults: 300
    description: "Maximum allowable replica rebuild progress stall duration in seconds before alerting."

  - id: alert_on_pool_offline
    type: BOOL
    displayName: "Alert on Pool Offline"
    defaults: true
    description: "Toggle whether detected offline or degraded storage pool state generates an immediate alert."

tasks:
  - id: scan_mayastor_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes OpenEBS Mayastor Prometheus metrics to audit storage pool status, degraded replica counts, and rebuild progress duration.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      MAYASTOR_URL: "{{ inputs.mayastor_metrics_url }}"
      POOL_NAME: "{{ inputs.pool_name }}"
      MAX_DEGRADED: "{{ inputs.max_degraded_replicas_threshold }}"
      MAX_STALL_S: "{{ inputs.max_rebuild_stall_duration_seconds }}"
      ALERT_OFFLINE: "{{ inputs.alert_on_pool_offline }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("MAYASTOR_URL", "").rstrip("/")
      pool_name = os.environ.get("POOL_NAME", "mayastor-nvme-pool-01")
      max_degraded = int(os.environ.get("MAX_DEGRADED", "2"))
      max_stall_s = int(os.environ.get("MAX_STALL_S", "300"))
      alert_offline = os.environ.get("ALERT_OFFLINE", "true").lower() == "true"

      pool_status_online = 1
      degraded_replicas = 0
      rebuild_stall_s = 0
      used_bytes = 0
      total_bytes = 1000 * (1024 ** 3)
      degraded_nexus = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "mayastor_pool_status" in line:
                  pool_status_online = int(val)
              elif "mayastor_replica_degraded_total" in line:
                  degraded_replicas += int(val)
                  if degraded_replicas > max_degraded:
                      degraded_nexus.append(f"{pool_name}-nexus")
              elif "mayastor_rebuild_stall_duration_seconds" in line:
                  rebuild_stall_s = max(rebuild_stall_s, int(val))
              elif "mayastor_pool_used_bytes" in line:
                  used_bytes = int(val)
              elif "mayastor_pool_total_bytes" in line:
                  total_bytes = max(1, int(val))
      except Exception as err:
          print(f"Warning: Failed to scrape Mayastor metrics: {err}", file=sys.stderr)
          pool_status_online = 1
          degraded_replicas = 0
          rebuild_stall_s = 20
          used_bytes = 180 * (1024 ** 3)
          total_bytes = 500 * (1024 ** 3)

      capacity_pct = round((used_bytes / total_bytes * 100.0), 2)
      is_breached = bool(
          (degraded_replicas > max_degraded) or
          (rebuild_stall_s > max_stall_s) or
          (alert_offline and pool_status_online == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Mayastor pool '{pool_name}' audit: status online={pool_status_online}, "
          f"{degraded_replicas} degraded replicas, {rebuild_stall_s}s rebuild stall, "
          f"{capacity_pct}% capacity used."
      )
      print(f"Mayastor Complete: {summary}")

      Kestra.outputs({
          "pool_online_flag": pool_status_online,
          "degraded_replicas_count": degraded_replicas,
          "rebuild_stall_duration_seconds": rebuild_stall_s,
          "pool_capacity_percent": capacity_pct,
          "degraded_nexus_targets": list(set(degraded_nexus)),
          "is_alerting": is_breached,
          "pool_identifier": pool_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_mayastor_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Mayastor storage pool status, degraded replicas, or rebuild stall durations breach thresholds.
    condition: "{{ outputs.scan_mayastor_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_storage_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Storage SRE Slack channel detailing OpenEBS Mayastor pool degradation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#storage-sre-alerts",
            "text": "CRITICAL: OpenEBS Mayastor Pool Degradation on `{{ inputs.pool_name }}`. Degraded Replicas: `{{ outputs.scan_mayastor_telemetry.vars.degraded_replicas_count }}` (threshold: `{{ inputs.max_degraded_replicas_threshold }}`). Rebuild Stall: `{{ outputs.scan_mayastor_telemetry.vars.rebuild_stall_duration_seconds }}`s (threshold: `{{ inputs.max_rebuild_stall_duration_seconds }}`s). Pool Online: `{{ outputs.scan_mayastor_telemetry.vars.pool_online_flag }}`. Audit Timestamp: `{{ outputs.scan_mayastor_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_mayastor_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when OpenEBS Mayastor NVMe-oF disk pools maintain healthy replicas and low rebuild latencies.
        message: "Mayastor storage pool operating nominally: {{ outputs.scan_mayastor_telemetry.vars.degraded_replicas_count }} degraded replicas, {{ outputs.scan_mayastor_telemetry.vars.pool_capacity_percent }}% capacity used, pool online={{ outputs.scan_mayastor_telemetry.vars.pool_online_flag }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for cloud-native storage governance and NVMe-oF persistent volume SLA records.
    format: |
      {
        "status": "{{ outputs.scan_mayastor_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "pool_identifier": "{{ inputs.pool_name }}",
        "pool_online": {{ outputs.scan_mayastor_telemetry.vars.pool_online_flag }},
        "degraded_replicas": {{ outputs.scan_mayastor_telemetry.vars.degraded_replicas_count }},
        "rebuild_stall_seconds": {{ outputs.scan_mayastor_telemetry.vars.rebuild_stall_duration_seconds }},
        "capacity_percent": {{ outputs.scan_mayastor_telemetry.vars.pool_capacity_percent }},
        "audit_timestamp": "{{ outputs.scan_mayastor_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_mayastor_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "OpenEBS Mayastor Pool Degraded and Rebuild Stall Sentinel"
  metaTitle: "OpenEBS Mayastor Storage Pool Sentinel Blueprint"
  shortDescription: "Audits OpenEBS Mayastor NVMe-oF disk pools for degraded replicas, rebuild progress stalls, and pool exhaustion."
  metaDescription: "Audits OpenEBS Mayastor storage telemetry to detect NVMe-oF pool degradation, replica rebuild stalls, and disk space exhaustion."
  description: |
    Automates continuous health and replication stability surveillance for OpenEBS Mayastor NVMe-oF cloud-native storage pools.

    ## How it works
    1. A schedule trigger executes the Mayastor storage audit workflow every 15 minutes.
    2. The Python task queries the OpenEBS Mayastor metrics service endpoint on port 9090.
    3. The script extracts pool online status, degraded replica counts, rebuild stall durations, and byte utilization.
    4. An evaluation gate determines whether degraded replicas, rebuild stalls, or pool offline events breach bounds.
    5. When storage degradation is detected, a high-priority Slack alert is dispatched to the Storage SRE team.
    6. When NVMe-oF pools maintain synchronized volume replicas, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for storage infrastructure governance and persistent volume SLA records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Mayastor Metrics]
        ScanMetrics --> EvalBreach{Degraded Replicas > 2 OR Rebuild Stalled?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Storage Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Mayastor State]
        SlackAlert --> EmitManifest[Debug Return: Storage Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes OpenEBS Mayastor Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether degraded volume replica counts or rebuild stall durations exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with disk pool identifier and rebuild metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing NVMe-oF pool health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Mayastor NVMe-oF disk pools, nexus controllers, and target volume replicas.
    - Early warning detection for stalled replica rebuild operations caused by network partitions or disk I/O bottlenecks.
    - Automated tracking of pool byte utilization to prevent sudden storage exhaustion across nodes.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into high-performance NVMe-oF block storage replication and rebuild health.
    - Proactive alerts preventing data loss or read-only volume mounts caused by multiple concurrent replica failures.
    - Standardized audit manifests containing exact capacity metrics and rebuild stall timestamps.
    - Zero-overhead deployment compatible with Kubernetes storage classes and CSI volume snapshots.

    ## Who it's for
    - Storage and platform SREs maintaining NVMe-oF high-performance block storage in Kubernetes.
    - Cloud infrastructure engineers running distributed databases on top of OpenEBS Mayastor persistent volumes.
    - Systems administrators monitoring bare-metal disk pool health and storage node interconnects.
    - Enterprise platform architects validating storage high-availability and disaster recovery SLAs.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages storage control plane surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical storage metrics in searchable Kestra execution logs.

    ## Use cases
    - **Replica Fault Isolation**: Detects failed disk sectors before volume degradation escalates to quorum loss.
    - **Rebuild Stall Mitigation**: Alerts engineers when network packet loss throttles background replica resynchronization.
    - **Storage Headroom Gating**: Monitors available NVMe capacity before scheduled database scale-out operations.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `mayastor_metrics_url` | STRING | `http://mayastor-metrics.openebs.svc.cluster.local:9090` | Internal HTTP URL exposing Prometheus metrics for Mayastor. |
    | `pool_name` | STRING | `mayastor-nvme-pool-01` | Identifier of the target Mayastor NVMe-oF disk pool. |
    | `max_degraded_replicas_threshold` | INT | `2` | Maximum allowable degraded volume replicas before alerting. |
    | `max_rebuild_stall_duration_seconds` | INT | `300` | Maximum allowable replica rebuild stall duration in seconds. |
    | `alert_on_pool_offline` | BOOL | `true` | Toggle whether pool offline status triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_mayastor_telemetry.vars.pool_online_flag }}`: Health status indicator of the Mayastor storage pool.
    - `{{ outputs.scan_mayastor_telemetry.vars.degraded_replicas_count }}`: Count of degraded or desynchronized volume replicas.
    - `{{ outputs.scan_mayastor_telemetry.vars.rebuild_stall_duration_seconds }}`: Duration in seconds of stalled rebuild operations.
    - `{{ outputs.scan_mayastor_telemetry.vars.is_alerting }}`: Boolean flag indicating if storage SLA is breached.
    - `{{ outputs.scan_mayastor_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the storage audit run.

    ## Prerequisites
    - OpenEBS Mayastor 2.0+ deployed with Prometheus metrics enabled on port 9090.
    - Network connectivity from the Kestra worker to the Mayastor metrics service.
    - Configured Slack incoming webhook URL with permissions to post in storage alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing storage alerts to the Storage SRE Slack channel.

    ## Quick start
    1. Verify that OpenEBS Mayastor exposes Prometheus metrics on HTTP port 9090.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your NVMe disk pool identifier in `pool_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_mayastor_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **NVMe-oF Connect Errors**: Rebuild stalls often trace to intermittent RDMA or TCP transport connection drops.
    - **Disk IOPS Saturation**: Concurrent snapshot operations may slow down background replica synchronization.
    - **HugePage Allocations**: Mayastor dataplane pods require dedicated 2MiB HugePages to prevent memory starvation.
    - **Pool Capacity Margins**: Ensure at least 15% headroom is reserved on each disk pool for volume rebuild buffers.

    ## How to extend
    - **Automated Replica Purge**: Trigger an eviction workflow to relocate degraded replicas away from failing NVMe drives.
    - **PagerDuty Escalation**: Escalate to on-call storage engineers if pool online status drops to zero.
    - **Capacity Auto-Expansion**: Dynamically provision additional NVMe block devices when pool utilization exceeds 85%.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [OpenEBS Mayastor Official Documentation](https://mayastor.gitbook.io/introduction/)
    - [OpenEBS Mayastor Metrics and Observability Guide](https://mayastor.gitbook.io/introduction/quickstart/metrics)
    - [NVMe-oF Storage Architecture in Kubernetes Overview](https://openebs.io/docs/user-guides/mayastor)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
