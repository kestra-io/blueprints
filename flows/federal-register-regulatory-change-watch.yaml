id: federal-register-regulatory-change-watch
namespace: company.team

description: |
  Track new rules, proposed rules and notices in the US Federal Register for the agencies, CFR parts
  and keywords your compliance team owns. Each weekday the flow queries the keyless Federal Register
  API with `conditions[...]` filters and a trimmed `fields[]` list, follows `next_page_url`, folds
  corrections and comment-period extensions into the document they amend, and keeps every tracked
  document in the KV store. It flags final rules that take effect soon and proposed rules whose
  comment window is about to close, adds tomorrow's public-inspection filings as early warning, writes
  a CSV and posts one Slack digest.

inputs:
  - id: agencies
    type: ARRAY
    itemType: STRING
    defaults:
      - environmental-protection-agency
      - occupational-safety-and-health-administration
      - consumer-product-safety-commission
    description: Agency slugs as used in federalregister.gov URLs (`/agencies/<slug>`). All slugs go into one query. Unknown slugs are reported and skipped instead of failing the run.

  - id: cfr_parts
    type: ARRAY
    itemType: STRING
    defaults:
      - 21 CFR 1308
      - 40 CFR 180
      - 12 CFR 1026
    description: CFR title and part pairs (`21 CFR 1308`, `21/1308`, a part range such as `21 CFR 1300-1308`, or a whole title such as `16 CFR`). One query per pair. The defaults are controlled-substance schedules, pesticide tolerances and Regulation Z (usually quiet, so the first run also shows a pair with no hits).

  - id: terms
    type: ARRAY
    itemType: STRING
    defaults:
      - PFAS
      - artificial intelligence
    description: Full-text search terms, searched as phrases, one query per term.

  - id: document_types
    type: ARRAY
    itemType: STRING
    defaults:
      - RULE
      - PRORULE
      - NOTICE
    description: Federal Register document types to watch, any of `RULE`, `PRORULE`, `NOTICE`, `PRESDOCU`. Applied to every query.

  - id: lookback_days
    type: INT
    defaults: 30
    min: 1
    max: 365
    description: Publication-date window re-read on every run. The KV state keeps documents beyond it, so deadline reminders still fire for older proposed rules.

  - id: effective_within_days
    type: INT
    defaults: 30
    description: A final rule whose effective date is within this many days is flagged `EFFECTIVE_SOON`.

  - id: comment_within_days
    type: INT
    defaults: 14
    description: A rule or proposed rule whose comment period closes within this many days is flagged `COMMENT_CLOSING`.

  - id: include_public_inspection
    type: BOOL
    defaults: true
    description: Also read the documents on public inspection (filed, not yet published) and report the ones from watched agencies or with a watched term in the title as `EARLY_WARNING`.

  - id: notify_on
    type: SELECT
    values:
      - ANY_CHANGE
      - URGENT_ONLY
    defaults: ANY_CHANGE
    description: Post the Slack digest for any change, or only when something is effective soon or closing for comment.

  - id: per_page
    type: INT
    defaults: 200
    min: 20
    max: 1000
    description: Results per request. The API serves at most 50 pages per query; the run warns if a query was truncated.

  - id: state_key
    type: STRING
    defaults: federal_register_watch
    description: KV key holding the tracked documents. Use one key per watchlist.

triggers:
  - id: weekday_morning
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 9 * * 1-5"
    timezone: America/New_York
    description: The Federal Register publishes each weekday at 6:00 ET and posts the next issue's regular public-inspection filings at 8:45 ET, so 9:30 ET catches both.

tasks:
  - id: fetch_documents
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.13-slim
    description: |
      Standard-library Python, no packages to install. Validates the agency slugs against `/agencies.json` (one small
      request with `fields[]=slug`), parses the CFR pairs, then runs one `/documents.json` query for all agencies, one
      per CFR pair and one per term, each with `conditions[publication_date][gte]`, `conditions[type][]`, 14 `fields[]`
      and `order=newest`, following `next_page_url` to the end. A document returned by several queries is kept once
      with every query that matched it. Retries 429 and 5xx with backoff, pauses between requests, sends a User-Agent.
      A query rejected with HTTP 400 is reported and the others continue. With `include_public_inspection`, one request
      to `/public-inspection-documents/current.json` keeps the filings from watched agencies or with a term in the title.
    outputFiles:
      - documents.json
      - public_inspection.json
    env:
      FR_AGENCIES: "{{ inputs.agencies | toJson }}"
      FR_CFR: "{{ inputs.cfr_parts | toJson }}"
      FR_TERMS: "{{ inputs.terms | toJson }}"
      FR_TYPES: "{{ inputs.document_types | toJson }}"
      FR_LOOKBACK: "{{ inputs.lookback_days }}"
      FR_PER_PAGE: "{{ inputs.per_page }}"
      FR_PI: "{{ inputs.include_public_inspection }}"
    script: |
      import json, os, re, time, urllib.error, urllib.parse, urllib.request
      from datetime import datetime, timedelta, timezone

      API = "https://www.federalregister.gov/api/v1"
      HEADERS = {"User-Agent": "kestra-federal-register-regulatory-change-watch/1.0 (https://kestra.io)", "Accept": "application/json"}
      FIELDS = ["document_number", "type", "title", "action", "agency_names", "publication_date", "effective_on",
                "comments_close_on", "correction_of", "cfr_references", "regulation_id_numbers", "docket_ids", "significant", "html_url"]
      PI_FIELDS = ["document_number", "type", "title", "agencies", "publication_date", "html_url"]
      DOCKET = re.compile(r"\b[A-Z][A-Z0-9]+(?:-[A-Z0-9]+)*-\d{4}-\d{3,}\b")
      TYPES = {"RULE": "Rule", "PRORULE": "Proposed Rule", "NOTICE": "Notice", "PRESDOCU": "Presidential Document"}
      requests_made = 0

      def get(url):
          global requests_made
          for attempt in range(5):
              if requests_made:
                  time.sleep(0.5)
              requests_made += 1
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=HEADERS), timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  if e.code == 400:
                      return {"errors": json.loads(e.read() or b"{}").get("errors", {"request": "HTTP 400"})}
                  if e.code not in (429, 500, 502, 503, 504) or attempt == 4:
                      raise
              except urllib.error.URLError:
                  if attempt == 4:
                      raise
              time.sleep(2 ** (attempt + 1))

      def clean(values):
          return [v.strip() for v in json.loads(values) if v and v.strip()]

      agencies = [a.lower() for a in clean(os.environ["FR_AGENCIES"])]
      terms = [t.replace('"', "").replace("|", " ").strip() for t in clean(os.environ["FR_TERMS"])]
      types = [t.upper() for t in clean(os.environ["FR_TYPES"])]
      unknown_types = [t for t in types if t not in TYPES]
      if unknown_types or not types:
          raise SystemExit(f"Unknown document type(s) {unknown_types or 'none given'}; use any of {', '.join(TYPES)}.")
      today = datetime.now(timezone.utc).date()
      since = today - timedelta(days=int(os.environ["FR_LOOKBACK"]))
      per_page = int(os.environ["FR_PER_PAGE"])

      unknown_agencies = []
      if agencies:
          known = {a["slug"] for a in get(f"{API}/agencies.json?fields[]=slug")}
          unknown_agencies = [a for a in agencies if a not in known]
          agencies = [a for a in agencies if a in known]

      cfr_pairs, invalid_cfr = [], []
      for raw in clean(os.environ["FR_CFR"]):
          m = re.fullmatch(r"(\d{1,2})\s*(?:C\.?F\.?R\.?|/|:)?\s*(?:parts?\s*)?(\d+(?:\s*-\s*\d+)?)?", raw.strip(), re.I)
          if not m or not 1 <= int(m.group(1)) <= 50:
              invalid_cfr.append(raw)
              continue
          part = (m.group(2) or "").replace(" ", "")
          cfr_pairs.append((f"{int(m.group(1))} CFR {part}".strip(), {"conditions[cfr][title]": m.group(1), **({"conditions[cfr][part]": part} if part else {})}))

      queries = ([("agencies", {"conditions[agencies][]": agencies})] if agencies else []) + cfr_pairs + \
                [(f"term {t}", {"conditions[term]": f'"{t}"'}) for t in terms]
      if not queries:
          raise SystemExit("Nothing to watch: give at least one valid agency slug, CFR pair or term.")

      docs, report = {}, []
      for label, cond in queries:
          params = {**cond, "conditions[publication_date][gte]": since.isoformat(), "conditions[type][]": types,
                    "fields[]": FIELDS, "per_page": per_page, "order": "newest"}
          url = f"{API}/documents.json?{urllib.parse.urlencode(params, doseq=True)}"
          pages = fetched = 0
          count, error = None, None
          while url:
              page = get(url)
              if "errors" in page:
                  error = json.dumps(page["errors"])
                  break
              pages += 1
              count = page.get("count", 0) if count is None else count
              for d in page.get("results", []):
                  fetched += 1
                  doc = docs.setdefault(d["document_number"], {
                      **{k: d.get(k) for k in FIELDS},
                      "agency_names": "; ".join(dict.fromkeys(d.get("agency_names") or [])),
                      "cfr_references": "; ".join(dict.fromkeys(f"{c['title']} CFR {c['part']}" for c in d.get("cfr_references") or [] if c.get("title"))),
                      "regulation_id_numbers": d.get("regulation_id_numbers") or [],
                      "dockets": list(dict.fromkeys(DOCKET.findall(" ".join(d.get("docket_ids") or [])))),
                      "corrects": (d.get("correction_of") or "").rstrip("/").rsplit("/", 1)[-1] or None,
                      "matched_by": []})
                  doc["matched_by"].append(label)
              url = page.get("next_page_url")
          report.append({"query": label, "count": count or 0, "fetched": fetched, "pages": pages, "error": error})
          print(f"{label}: {'ERROR ' + error if error else f'{count or 0} matches, {fetched} fetched in {pages} page(s)'}")
      if all(q["error"] for q in report):
          raise SystemExit("Every Federal Register query was rejected: " + "; ".join(f"{q['query']}: {q['error']}" for q in report))

      public_inspection, pi_on_file = [], 0
      if os.environ["FR_PI"].lower() == "true":
          pi = get(f"{API}/public-inspection-documents/current.json?{urllib.parse.urlencode({'fields[]': PI_FIELDS}, doseq=True)}")
          pi_on_file = pi.get("count", 0)
          wanted_types = {TYPES[t] for t in types}
          for d in pi.get("results", []):
              slugs = {a.get("slug") for a in d.get("agencies") or []}
              title = (d.get("title") or "").strip()
              matched = (["agencies"] if slugs & set(agencies) else []) + [f"term {t}" for t in terms if t.lower() in title.lower()]
              if matched and d.get("type") in wanted_types:
                  public_inspection.append({"document_number": d["document_number"], "type": d.get("type"), "title": title,
                                            "agency_names": "; ".join(a.get("name") or "" for a in d.get("agencies") or []),
                                            "publication_date": d.get("publication_date"), "html_url": d.get("html_url"), "matched_by": matched})

      for d in docs.values():
          d["matched_by"] = "; ".join(dict.fromkeys(d["matched_by"]))
      for d in public_inspection:
          d["matched_by"] = "; ".join(d["matched_by"])
      json.dump(list(docs.values()), open("documents.json", "w", encoding="utf-8"))
      json.dump(public_inspection, open("public_inspection.json", "w", encoding="utf-8"))

      truncated = [q["query"] for q in report if q["fetched"] < q["count"]]
      failed = [f"{q['query']} ({q['error']})" for q in report if q["error"]]
      print(f"{len(docs)} distinct documents from {len(report)} queries, {len(public_inspection)} of {pi_on_file} public-inspection filings matched, {requests_made} requests.")
      print("::" + json.dumps({"outputs": {
          "window_from": since.isoformat(), "window_to": today.isoformat(), "requests": requests_made,
          "queries": len(report), "documents": len(docs), "pi_on_file": pi_on_file, "pi_matched": len(public_inspection),
          "zero_hit_queries": ", ".join(q["query"] for q in report if not q["error"] and q["count"] == 0),
          "unknown_agencies": ", ".join(unknown_agencies), "invalid_cfr": ", ".join(invalid_cfr),
          "truncated": ", ".join(truncated), "failed_queries": "; ".join(failed)}}) + "::")

  - id: classify
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Folds every correction into the document it corrects (`correction_of` for Federal Register corrections; the same
      regulations.gov docket, else the same title without "; Correction", for agency-issued ones) and every comment-period
      extension or reopening into the earlier proposed rule with the same docket or the same RIN and title, so neither shows
      up as a new item and the extended deadline replaces the old one. Merges the run with the tracked documents from the
      KV store (read with `kv()` so a large state never travels as a task output), computes days to the effective date and
      to the comment deadline, assigns an urgency and a change type per document, and writes the CSV, the new state and
      the Slack digest.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      documents.json: "{{ outputs.fetch_documents.outputFiles['documents.json'] }}"
      public_inspection.json: "{{ outputs.fetch_documents.outputFiles['public_inspection.json'] }}"
      state.json: "{{ kv(inputs.state_key, errorOnMissing=false) ?? '[]' }}"
    outputFiles:
      - documents_csv
      - state_json
    parameters:
      effective_within_days: "{{ inputs.effective_within_days }}"
      comment_within_days: "{{ inputs.comment_within_days }}"
      retain_days: "{{ max(inputs.lookback_days, 120) }}"
      window_from: "{{ outputs.fetch_documents.vars.window_from }}"
      execution_url: "{{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE MACRO d(s) AS TRY_CAST(nullif(s, '') AS DATE);
      CREATE MACRO type_code(t) AS CASE t WHEN 'Rule' THEN 'RULE' WHEN 'Proposed Rule' THEN 'PRORULE' WHEN 'Notice' THEN 'NOTICE' WHEN 'Presidential Document' THEN 'PRESDOCU' ELSE upper(t) END;
      CREATE MACRO strs(j) AS coalesce(from_json(j, '["VARCHAR"]'), CAST([] AS VARCHAR[]));
      CREATE MACRO norm(t) AS trim(regexp_replace(lower(coalesce(t, '')), '[^a-z0-9]+', ' ', 'g'));
      CREATE MACRO corr_like(title, action) AS regexp_matches(coalesce(title, ''), '[;,]\s*(corrections?|correcting amendments?)\s*$', 'i')
                                              OR regexp_matches(lower(coalesce(action, '')), '(^|; )(correction|correcting amendment)');
      CREATE MACRO ext_like(title, action) AS regexp_matches(lower(coalesce(action, '') || ' ' || coalesce(title, '')), '(extension|reopening|extended|reopened) (of )?(the )?comment period|comment period (extension|reopening)');
      CREATE MACRO base_title(t) AS norm(regexp_replace(regexp_replace(t, '[;,]\s*(corrections?|correcting amendments?)\s*$', '', 'i'),
                                                         '[;,]\s*(notice of )?(extension|reopening)( of)?( the)? comment period.*$', '', 'i'));

      CREATE TABLE docs AS
      SELECT j->>'$.document_number' AS document_number, type_code(j->>'$.type') AS type_code,
             trim(j->>'$.title') AS title, j->>'$.action' AS action, j->>'$.agency_names' AS agencies,
             d(j->>'$.publication_date') AS publication_date, d(j->>'$.effective_on') AS effective_on,
             d(j->>'$.comments_close_on') AS comments_close_on,
             j->>'$.corrects' AS corrects, false AS orphan_correction,
             j->>'$.cfr_references' AS cfr, strs(j->'$.regulation_id_numbers') AS rins, strs(j->'$.dockets') AS dockets,
             coalesce(CAST(j->>'$.significant' AS BOOLEAN), false) AS significant,
             j->>'$.html_url' AS html_url, j->>'$.matched_by' AS matched_by
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS j FROM read_text('documents.json'));

      CREATE TABLE state AS
      SELECT s->>'$.document_number' AS document_number, s->>'$.type_code' AS type_code, s->>'$.title' AS title,
             s->>'$.agencies' AS agencies, d(s->>'$.publication_date') AS publication_date,
             d(s->>'$.effective_on') AS effective_on, d(s->>'$.comments_close_on') AS comments_close_on,
             s->>'$.cfr' AS cfr, strs(s->'$.rins') AS rins, strs(s->'$.dockets') AS dockets, CAST(s->>'$.significant' AS BOOLEAN) AS significant,
             s->>'$.html_url' AS html_url, s->>'$.matched_by' AS matched_by,
             strs(s->'$.corrections') AS corrections, strs(s->'$.extensions') AS extensions,
             CAST(s->>'$.published' AS BOOLEAN) AS published, d(s->>'$.alerted_deadline') AS alerted_deadline,
             d(s->>'$.first_seen') AS first_seen
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('state.json'));

      -- Documents a correction or an extension can attach to: originals from this run and from the state.
      CREATE TABLE originals AS
      SELECT document_number, type_code, title, publication_date, rins, dockets FROM docs WHERE corrects IS NULL AND NOT corr_like(title, action)
      UNION SELECT document_number, type_code, title, publication_date, rins, dockets FROM state WHERE published AND NOT corr_like(title, '');

      -- Agency-issued corrections ("...; Correction", "Final rule; correction.") carry no correction_of. They attach to the
      -- original with the same regulations.gov docket, else to the latest one with the same title; otherwise they stay
      -- standalone and are reported as a correction whose original is outside the window.
      CREATE TABLE agency_corrections AS
      SELECT c.document_number AS doc,
             arg_max(o.document_number, CASE WHEN list_has_any(c.dockets, o.dockets) THEN 100000 ELSE 0 END + (o.publication_date - DATE '2000-01-01')) AS original
      FROM docs c LEFT JOIN originals o
        ON (list_has_any(c.dockets, o.dockets) OR norm(o.title) = base_title(c.title))
       AND o.document_number <> c.document_number AND o.publication_date <= c.publication_date
      WHERE c.corrects IS NULL AND corr_like(c.title, c.action)
      GROUP BY c.document_number;
      UPDATE docs SET corrects = ac.original FROM agency_corrections ac WHERE docs.document_number = ac.doc AND ac.original IS NOT NULL;
      UPDATE docs SET orphan_correction = true FROM agency_corrections ac WHERE docs.document_number = ac.doc AND ac.original IS NULL;

      -- Comment-period extensions and reopenings attach to the earlier proposed rule with the same docket, or with the same
      -- RIN and title (RINs alone are not enough: FAA files every airspace action under one RIN).
      CREATE TABLE ext_links AS
      SELECT e.document_number AS ext,
             arg_max(c.document_number, CASE WHEN list_has_any(e.dockets, c.dockets) THEN 100000 ELSE 0 END + (c.publication_date - DATE '2000-01-01')) AS root,
             any_value(e.comments_close_on) AS new_close
      FROM docs e JOIN originals c
        ON c.type_code = 'PRORULE' AND c.document_number <> e.document_number AND c.publication_date <= e.publication_date
       AND (list_has_any(e.dockets, c.dockets) OR (list_has_any(e.rins, c.rins) AND norm(c.title) = base_title(e.title)))
      WHERE e.corrects IS NULL AND NOT e.orphan_correction AND ext_like(e.title, e.action)
      GROUP BY e.document_number;

      -- One row per root document: published originals from this run, then state, then the correction itself when its original is outside both.
      CREATE TABLE roots AS
      WITH linked AS (
        SELECT corrects AS root, document_number AS doc, 'correction' AS kind,
               CASE WHEN ext_like(title, action) THEN comments_close_on END AS new_close FROM docs WHERE corrects IS NOT NULL
        UNION ALL SELECT root, ext, 'extension', new_close FROM ext_links
      ), base AS (
        SELECT document_number, type_code, title, agencies, publication_date, effective_on, comments_close_on, cfr, rins, dockets, significant, html_url, matched_by, true AS in_run, orphan_correction AS outside_window
        FROM docs WHERE corrects IS NULL AND document_number NOT IN (SELECT ext FROM ext_links)
        UNION ALL
        SELECT s.document_number, s.type_code, s.title, s.agencies, s.publication_date, s.effective_on, s.comments_close_on, s.cfr, s.rins, s.dockets, s.significant, s.html_url, s.matched_by, false, false
        FROM state s WHERE s.published AND s.document_number NOT IN (SELECT document_number FROM docs)
        UNION ALL
        SELECT DISTINCT ON (c.corrects) c.corrects, c.type_code, c.title, c.agencies, NULL, c.effective_on, c.comments_close_on, c.cfr, c.rins, c.dockets, c.significant,
               c.html_url, c.matched_by, true, true
        FROM docs c WHERE c.corrects IS NOT NULL AND c.corrects NOT IN (SELECT document_number FROM docs)
          AND c.corrects NOT IN (SELECT document_number FROM state WHERE published)
      )
      SELECT b.* EXCLUDE (comments_close_on),
             greatest(any_value(b.comments_close_on), max(l.new_close),
                      CASE WHEN len(any_value(s.extensions)) > 0 THEN any_value(s.comments_close_on) END) AS comments_close_on,
             list_distinct(list_concat(coalesce(any_value(s.corrections), []), coalesce(list(l.doc) FILTER (WHERE l.kind = 'correction'), []))) AS corrections,
             list_distinct(list_concat(coalesce(any_value(s.extensions), []), coalesce(list(l.doc) FILTER (WHERE l.kind = 'extension'), []))) AS extensions,
             any_value(s.document_number) IS NOT NULL AS was_tracked, coalesce(any_value(s.published), false) AS was_published,
             coalesce(len(any_value(s.corrections)), 0) AS old_corrections, coalesce(len(any_value(s.extensions)), 0) AS old_extensions,
             any_value(s.effective_on) AS old_effective_on, any_value(s.comments_close_on) AS old_comments_close_on,
             any_value(s.alerted_deadline) AS alerted_deadline, coalesce(any_value(s.first_seen), current_date) AS first_seen
      FROM base b LEFT JOIN linked l ON l.root = b.document_number LEFT JOIN state s ON s.document_number = b.document_number
      GROUP BY ALL;

      CREATE TABLE graded AS
      WITH u AS (
        SELECT *, effective_on - current_date AS days_to_effective, comments_close_on - current_date AS days_to_comment_close,
               CASE WHEN type_code = 'RULE' AND effective_on - current_date BETWEEN 0 AND CAST(:effective_within_days AS INTEGER) THEN 'EFFECTIVE_SOON'
                    WHEN type_code IN ('RULE', 'PRORULE') AND comments_close_on - current_date BETWEEN 0 AND CAST(:comment_within_days AS INTEGER) THEN 'COMMENT_CLOSING'
                    WHEN comments_close_on >= current_date THEN 'COMMENT_OPEN'
                    WHEN type_code = 'RULE' AND effective_on > current_date THEN 'EFFECTIVE_LATER'
                    WHEN type_code = 'RULE' AND effective_on < current_date THEN 'IN_EFFECT'
                    WHEN comments_close_on < current_date THEN 'COMMENT_CLOSED'
                    ELSE 'NO_DEADLINE' END AS urgency
        FROM roots)
      SELECT *, urgency IN ('EFFECTIVE_SOON', 'COMMENT_CLOSING') AS urgent,
             CASE urgency WHEN 'EFFECTIVE_SOON' THEN effective_on WHEN 'COMMENT_CLOSING' THEN comments_close_on END AS deadline,
             CASE WHEN NOT was_tracked AND outside_window THEN 'CORRECTED'
                  WHEN NOT was_tracked THEN 'NEW'
                  WHEN NOT was_published THEN 'PUBLISHED'
                  WHEN len(corrections) > old_corrections THEN 'CORRECTED'
                  WHEN len(extensions) > old_extensions THEN 'DEADLINE_EXTENDED'
                  WHEN effective_on IS DISTINCT FROM old_effective_on OR comments_close_on IS DISTINCT FROM old_comments_close_on THEN 'DATES_CHANGED'
                  WHEN urgency IN ('EFFECTIVE_SOON', 'COMMENT_CLOSING') AND alerted_deadline IS DISTINCT FROM CASE urgency WHEN 'EFFECTIVE_SOON' THEN effective_on ELSE comments_close_on END THEN 'NOW_URGENT'
                  ELSE 'UNCHANGED' END AS change
      FROM u;

      CREATE TABLE early AS
      SELECT j->>'$.document_number' AS document_number, type_code(j->>'$.type') AS type_code, j->>'$.title' AS title,
             j->>'$.agency_names' AS agencies, d(j->>'$.publication_date') AS publication_date,
             j->>'$.html_url' AS html_url, j->>'$.matched_by' AS matched_by
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS j FROM read_text('public_inspection.json'))
      WHERE (j->>'$.document_number') NOT IN (SELECT document_number FROM state)
        AND (j->>'$.document_number') NOT IN (SELECT document_number FROM docs);

      CREATE TABLE report AS
      SELECT change, urgency, type_code AS type, document_number, title, agencies, publication_date, effective_on, days_to_effective,
             comments_close_on, days_to_comment_close, significant, array_to_string(corrections, '; ') AS corrections,
             array_to_string(extensions, '; ') AS comment_extensions, outside_window AS original_outside_window, matched_by, cfr,
             array_to_string(dockets, '; ') AS dockets, html_url,
             change <> 'UNCHANGED' AS alert
      FROM graded
      UNION ALL
      SELECT 'EARLY_WARNING', 'ON_PUBLIC_INSPECTION', type_code, document_number, title, agencies, publication_date, NULL, NULL, NULL, NULL, NULL,
             '', '', false, matched_by, '', '', html_url, true
      FROM early;

      COPY (SELECT * EXCLUDE (alert) FROM report
            ORDER BY alert DESC, urgency IN ('EFFECTIVE_SOON', 'COMMENT_CLOSING') DESC, coalesce(least(days_to_effective, days_to_comment_close), 9999), publication_date DESC NULLS FIRST, document_number)
        TO '{{ outputFiles.documents_csv }}' (HEADER, DELIMITER ',');

      CREATE TABLE alerts AS
      SELECT *, row_number() OVER (ORDER BY urgency IN ('EFFECTIVE_SOON', 'COMMENT_CLOSING') DESC, change = 'EARLY_WARNING' DESC, type = 'NOTICE',
                                            coalesce(least(days_to_effective, days_to_comment_close), 9999), publication_date DESC, document_number) AS rn,
             CASE WHEN urgency = 'EFFECTIVE_SOON' THEN 'effective in ' || days_to_effective || 'd (' || strftime(effective_on, '%Y-%m-%d') || ')'
                  WHEN urgency = 'COMMENT_CLOSING' THEN 'comments close in ' || days_to_comment_close || 'd (' || strftime(comments_close_on, '%Y-%m-%d') || ')'
                  WHEN change = 'EARLY_WARNING' THEN 'on public inspection, publishes ' || strftime(publication_date, '%Y-%m-%d')
                  WHEN comments_close_on >= current_date THEN 'comments close ' || strftime(comments_close_on, '%Y-%m-%d')
                  WHEN effective_on > current_date THEN 'effective ' || strftime(effective_on, '%Y-%m-%d')
                  ELSE 'published ' || coalesce(strftime(publication_date, '%Y-%m-%d'), 'before the window') END AS when_text
      FROM report WHERE alert;

      -- New state: tracked documents still inside the retention window or with a future deadline, plus filings on public inspection.
      COPY (
           SELECT document_number, type_code, title, agencies, publication_date, effective_on, comments_close_on, cfr, rins, dockets, significant, html_url, matched_by,
                  corrections, extensions, true AS published, CASE WHEN urgent THEN deadline ELSE alerted_deadline END AS alerted_deadline, first_seen
           FROM graded
           WHERE coalesce(publication_date, first_seen) >= current_date - CAST(:retain_days AS INTEGER) OR effective_on >= current_date OR comments_close_on >= current_date
           UNION ALL
           SELECT document_number, type_code, title, agencies, publication_date, NULL, NULL, '', CAST([] AS VARCHAR[]), CAST([] AS VARCHAR[]), false, html_url, matched_by,
                  CAST([] AS VARCHAR[]), CAST([] AS VARCHAR[]), false, NULL, current_date
           FROM early
           UNION ALL
           SELECT document_number, type_code, title, agencies, publication_date, effective_on, comments_close_on, cfr, rins, dockets, significant, html_url, matched_by,
                  corrections, extensions, published, alerted_deadline, first_seen
           FROM state WHERE NOT published AND publication_date >= current_date - 7 AND document_number NOT IN (SELECT document_number FROM graded)
      ) TO '{{ outputFiles.state_json }}' (FORMAT JSON, ARRAY true);

      SELECT
        :window_from AS window_from,
        strftime(current_date, '%Y-%m-%d') AS run_date,
        (SELECT count(*) FROM state) = 0 AS is_baseline,
        (SELECT count(*) FROM docs) AS documents_fetched,
        (SELECT count(*) FROM docs WHERE corrects IS NOT NULL) AS corrections_folded,
        (SELECT count(*) FROM docs WHERE orphan_correction OR (corrects IS NOT NULL AND corrects NOT IN (SELECT document_number FROM docs) AND corrects NOT IN (SELECT document_number FROM state))) AS corrections_original_outside_window,
        (SELECT count(*) FROM ext_links) AS extensions_folded,
        (SELECT count(*) FROM graded) AS tracked,
        (SELECT count(*) FROM graded WHERE change = 'NEW') AS new_documents,
        (SELECT count(*) FROM graded WHERE change = 'NEW' AND type_code = 'RULE') AS new_rules,
        (SELECT count(*) FROM graded WHERE change = 'NEW' AND type_code = 'PRORULE') AS new_proposed_rules,
        (SELECT count(*) FROM graded WHERE change = 'NEW' AND type_code = 'NOTICE') AS new_notices,
        (SELECT count(*) FROM graded WHERE change IN ('CORRECTED', 'DEADLINE_EXTENDED', 'DATES_CHANGED', 'PUBLISHED')) AS updated,
        (SELECT count(*) FROM graded WHERE change = 'NOW_URGENT') AS reminders,
        (SELECT count(*) FROM early) AS early_warnings,
        (SELECT count(*) FROM graded WHERE urgency = 'EFFECTIVE_SOON') AS effective_soon,
        (SELECT count(*) FROM graded WHERE urgency = 'COMMENT_CLOSING') AS comment_closing,
        (SELECT count(*) FROM alerts) AS alerts,
        (SELECT count(*) FROM alerts WHERE urgency IN ('EFFECTIVE_SOON', 'COMMENT_CLOSING')) AS urgent_alerts,
        CASE WHEN (SELECT count(*) FROM alerts WHERE urgency IN ('EFFECTIVE_SOON', 'COMMENT_CLOSING')) > 0 THEN 'URGENT'
             WHEN (SELECT count(*) FROM alerts) > 0 THEN 'UPDATES' ELSE 'QUIET' END AS level,
        (SELECT coalesce(string_agg('[' || urgency || '] ' || change || ' ' || type || ' ' || document_number || ' ' || when_text || ' - ' || left(coalesce(title, ''), 110) || ' (' || left(coalesce(agencies, ''), 60) || ')', chr(10) ORDER BY rn), '')
           FROM alerts WHERE rn <= 40) AS alert_lines,
        (SELECT CAST(json_object('text',
            '*Federal Register watch* - ' || count(*) FILTER (WHERE urgency IN ('EFFECTIVE_SOON', 'COMMENT_CLOSING')) || ' urgent, '
              || count(*) || ' change(s), published ' || :window_from || ' to ' || strftime(current_date, '%Y-%m-%d')
              || CASE WHEN (SELECT count(*) FROM state) = 0 THEN ' (baseline run)' ELSE '' END || chr(10)
              || 'New: ' || count(*) FILTER (WHERE change = 'NEW' AND type = 'RULE') || ' rules, '
              || count(*) FILTER (WHERE change = 'NEW' AND type = 'PRORULE') || ' proposed rules, '
              || count(*) FILTER (WHERE change = 'NEW' AND type = 'NOTICE') || ' notices. Updated '
              || count(*) FILTER (WHERE change IN ('CORRECTED', 'DEADLINE_EXTENDED', 'DATES_CHANGED', 'PUBLISHED')) || ', reminders '
              || count(*) FILTER (WHERE change = 'NOW_URGENT') || ', on public inspection ' || count(*) FILTER (WHERE change = 'EARLY_WARNING') || '.' || chr(10)
              || coalesce(string_agg(
                   CASE WHEN urgency IN ('EFFECTIVE_SOON', 'COMMENT_CLOSING') THEN '• *' || when_text || '* ' ELSE '• ' || when_text || ' ' END
                   || '<' || html_url || '|' || replace(replace(left(coalesce(title, document_number), 120), '<', ''), '>', '') || '>'
                   || ' _' || type || ', ' || left(coalesce(agencies, ''), 60) || CASE WHEN change <> 'NEW' THEN ', ' || lower(replace(change, '_', ' ')) ELSE '' END || '_',
                   chr(10) ORDER BY rn) FILTER (WHERE rn <= 20), '')
              || CASE WHEN count(*) > 20 THEN chr(10) || '…and ' || (count(*) - 20) || ' more in the CSV.' ELSE '' END
              || chr(10) || 'Execution: ' || :execution_url) AS VARCHAR)
           FROM alerts) AS slack_payload;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.classify.outputFiles.state_json) }}"
    description: |
      Tracked documents with their dates, folded corrections and extensions and the deadline already alerted on.
      Documents published more than max(lookback, 120) days ago with no future deadline are dropped.

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    description: Routes on the run's level. URGENT means something takes effect or closes for comment within the configured days.
    value: "{{ outputs.classify.outputs[0].row.level }}"
    cases:
      URGENT:
        - id: log_urgent
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: |
            {{ outputs.classify.outputs[0].row.urgent_alerts }} urgent of {{ outputs.classify.outputs[0].row.alerts }} change(s) ({{ outputs.classify.outputs[0].row.effective_soon }} rules effective within {{ inputs.effective_within_days }} days, {{ outputs.classify.outputs[0].row.comment_closing }} comment periods closing within {{ inputs.comment_within_days }} days across all tracked documents):
            {{ outputs.classify.outputs[0].row.alert_lines }}
      UPDATES:
        - id: log_updates
          type: io.kestra.plugin.core.log.Log
          message: |
            {{ outputs.classify.outputs[0].row.alerts }} change(s), none urgent:
            {{ outputs.classify.outputs[0].row.alert_lines }}
    defaults:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "Nothing new in the Federal Register for this watchlist since the last run ({{ outputs.classify.outputs[0].row.tracked }} documents tracked, {{ outputs.classify.outputs[0].row.effective_soon }} effective soon and {{ outputs.classify.outputs[0].row.comment_closing }} closing for comment, all already reported)."

  - id: notify
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    runIf: "{{ outputs.classify.outputs[0].row.level == 'URGENT' or (outputs.classify.outputs[0].row.level == 'UPDATES' and inputs.notify_on == 'ANY_CHANGE') }}"
    allowFailure: true
    description: One digest per run, urgent items first, at most 20 lines (the rest are in the CSV). allowFailure keeps the watch green when the webhook secret is not set.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: "{{ outputs.classify.outputs[0].row.slack_payload }}"

  - id: warn_inputs
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.fetch_documents.vars.unknown_agencies is not empty or outputs.fetch_documents.vars.invalid_cfr is not empty or outputs.fetch_documents.vars.truncated is not empty or outputs.fetch_documents.vars.failed_queries is not empty }}"
    level: WARN
    message: |
      {{ outputs.fetch_documents.vars.unknown_agencies is not empty ? 'Unknown agency slug(s), skipped (see federalregister.gov/agencies): ' ~ outputs.fetch_documents.vars.unknown_agencies ~ '. ' : '' }}{{ outputs.fetch_documents.vars.invalid_cfr is not empty ? 'Unreadable CFR pair(s), skipped (use e.g. 21 CFR 1308): ' ~ outputs.fetch_documents.vars.invalid_cfr ~ '. ' : '' }}{{ outputs.fetch_documents.vars.failed_queries is not empty ? 'Rejected by the API: ' ~ outputs.fetch_documents.vars.failed_queries ~ '. ' : '' }}{{ outputs.fetch_documents.vars.truncated is not empty ? 'Truncated at the 50-page limit, raise per_page or narrow the query: ' ~ outputs.fetch_documents.vars.truncated ~ '.' : '' }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Federal Register {{ outputs.fetch_documents.vars.window_from }} to {{ outputs.fetch_documents.vars.window_to }}{{ outputs.classify.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}: {{ outputs.fetch_documents.vars.queries }} queries, {{ outputs.fetch_documents.vars.requests }} requests, {{ outputs.classify.outputs[0].row.documents_fetched }} documents ({{ outputs.classify.outputs[0].row.corrections_folded }} corrections and {{ outputs.classify.outputs[0].row.extensions_folded }} comment extensions folded into their originals, {{ outputs.classify.outputs[0].row.corrections_original_outside_window }} corrections whose original is outside the window).
      Tracked {{ outputs.classify.outputs[0].row.tracked }}: new {{ outputs.classify.outputs[0].row.new_documents }} ({{ outputs.classify.outputs[0].row.new_rules }} rules, {{ outputs.classify.outputs[0].row.new_proposed_rules }} proposed, {{ outputs.classify.outputs[0].row.new_notices }} notices), updated {{ outputs.classify.outputs[0].row.updated }}, reminders {{ outputs.classify.outputs[0].row.reminders }}, early warnings {{ outputs.classify.outputs[0].row.early_warnings }} (of {{ outputs.fetch_documents.vars.pi_on_file }} on public inspection). Level {{ outputs.classify.outputs[0].row.level }}.
      Queries with no match: {{ outputs.fetch_documents.vars.zero_hit_queries is empty ? 'none' : outputs.fetch_documents.vars.zero_hit_queries }}. CSV: {{ outputs.classify.outputFiles.documents_csv }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.classify.outputs[0].row | jq('del(.slack_payload)') | first }}"
  - id: documents_csv
    type: FILE
    value: "{{ outputs.classify.outputFiles.documents_csv }}"

extend:
  title: Watch the Federal Register for New Rules, Comment Deadlines and Corrections by Agency, CFR Part and Keyword
  metaTitle: Federal Register Regulatory Change Watch with DuckDB and Slack | Kestra
  shortDescription: Query the keyless Federal Register API every weekday for the agencies, CFR parts and keywords you own, fold corrections and comment-period extensions into the original document, flag rules taking effect soon and comment windows closing soon, and post one Slack digest with a CSV of every tracked document.
  metaDescription: Weekday Federal Register watch by agency, CFR part and keyword, with corrections folded, effective-date and comment-deadline flags, CSV and Slack digest.
  description: |
    Compliance and policy teams need to know when an agency they answer to publishes a rule, a proposed rule or a notice, when it takes effect and when comments are due. The keyless Federal Register API has all of it, but agencies, CFR parts and keywords are separate filters, results are paged, corrections and comment-period extensions arrive as new documents, and a deadline three weeks out last Monday is three days out today. This flow handles that and reports each change once.

    ## How it works

    1. A `Schedule` trigger runs at 9:30 America/New_York, Monday to Friday, after the 6:00 issue and the 8:45 public-inspection posting.
    2. `fetch_documents` (Python, standard library only) checks the agency slugs against `/agencies.json`, parses CFR pairs such as `21 CFR 1308` or `21 CFR 1300-1308`, and runs one `/documents.json` query for all agencies, one per CFR pair and one per term. Each uses `conditions[publication_date][gte]`, `conditions[type][]` and 14 `fields[]`, and follows `next_page_url` to the end. Documents matched by several queries are kept once. Unknown slugs and unreadable CFR pairs are skipped and reported, an unknown document type stops the run, and 429 and 5xx are retried. One more request reads tomorrow's filings from `/public-inspection-documents/current.json`.
    3. `classify` (DuckDB) reads the tracked documents from the KV store with `kv()`. Federal Register corrections attach to the original through `correction_of`; agency corrections ("Final rule; correction.") through the same regulations.gov docket, else the same title. Comment-period extensions attach to the earlier proposed rule with the same docket, or the same RIN and title, and their deadline replaces the old one. Each document gets an urgency (`EFFECTIVE_SOON` within `effective_within_days`, `COMMENT_CLOSING` within `comment_within_days`, `COMMENT_OPEN`, `EFFECTIVE_LATER`, `IN_EFFECT`, `COMMENT_CLOSED`, `NO_DEADLINE`) and a change type (`NEW`, `CORRECTED`, `DEADLINE_EXTENDED`, `DATES_CHANGED`, `PUBLISHED` after public inspection, `NOW_URGENT` when a tracked document enters its urgency window, `EARLY_WARNING`, `UNCHANGED`).
    4. `save_state` (KV Set) stores the tracked set. Documents older than max(`lookback_days`, 120) days with no future deadline are dropped.
    5. `route` (Switch) branches on the run level: `URGENT` logs the urgent items at WARN, `UPDATES` logs the changes, otherwise `nothing_new`. `notify` posts one Slack digest (`allowFailure`), urgent items first, 20 lines; `notify_on: URGENT_ONLY` posts only on urgent runs.
    6. `warn_inputs` reports skipped inputs, rejected queries and truncated queries, and `summary` logs the counts.

    ## What you get

    - A CSV of every tracked document: change, urgency, dates with days remaining, corrections, extensions, dockets, CFR parts, matching query and link.
    - One digest per run with each change reported once, plus one reminder when a tracked rule or proposal enters its urgency window.
    - Corrections and extensions shown as updates to the original document, including corrections that fix the original's title.
    - Early warning from public inspection, the day before publication.
    - Keyless, no database: state is one KV key per watchlist.

    ## Who it's for

    - Compliance and regulatory affairs teams in regulated industries (chemicals, pharma, aviation, finance, consumer products).
    - Policy, government affairs and trade association staff who file comments on proposed rules.
    - Legal operations and GRC engineers who feed regulatory change into their own trackers.

    ## Why orchestrate this with Kestra

    - The watchlist is inputs and the state is a KV key, so one flow serves many teams with different `state_key` values.
    - The classification is SQL you can read in the flow, and the `Switch` makes the routing visible in the topology.
    - Time-zone schedules, masked secrets and `allowFailure` on Slack come built in, unlike cron.

    ## Prerequisites

    - Kestra 2.0 with the Python script plugin (runs in `python:3.13-slim`, no packages), the JDBC DuckDB plugin and the Slack plugin.
    - Outbound HTTPS to `www.federalregister.gov`. No account or key is needed.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the digest (optional; without it `notify` warns and the run still completes).

    ## Quick start

    1. Import the flow and click **Execute** with the defaults: EPA, OSHA and CPSC, three CFR parts (Regulation Z is usually quiet) and two terms. The first run is a 30-day baseline: about a hundred documents, a few dozen effective soon or closing for comment.
    2. Execute again: `nothing_new` runs and nothing is posted.
    3. Add a misspelled slug or `CFR 1308` and run. `warn_inputs` names them and the other queries still run.
    4. Replace the watch lists with your own, add `SLACK_WEBHOOK_URL` and leave the weekday schedule on.

    ## How to extend

    - Set a long `lookback_days` on the first run to backfill open comment periods, then lower it.
    - Open a Jira or ServiceNow ticket for each `EFFECTIVE_SOON` rule, or route the digest to a channel per agency.
    - Append each CSV to a warehouse table to keep a regulatory change log.
    - Pull the full text from the document's `raw_text_url` and summarise it with an AI task before posting.

    ## Links

    - [Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script) and [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Switch](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.switch) and [Schedule](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.schedule)
    - [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set) and [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Federal Register API documentation](https://www.federalregister.gov/developers/documentation/api/v1)
    - [Public inspection](https://www.federalregister.gov/reader-aids/using-federalregister-gov/understanding-public-inspection)
  tags:
    - Business
  subTags:
    - Policy & Compliance
    - Reporting & Digests
  ee: false
  demo: false
