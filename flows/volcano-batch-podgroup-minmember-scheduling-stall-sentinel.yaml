id: volcano-batch-podgroup-minmember-scheduling-stall-sentinel
namespace: company.sre

description: |
  Audits Volcano batch scheduler telemetry to detect PodGroup gang scheduling stalls, minMember reservation timeouts, and queue allocation latency spikes.

concurrency:
  limit: 1

inputs:
  - id: volcano_metrics_url
    type: STRING
    displayName: "Volcano Metrics URL"
    defaults: "http://volcano-scheduler.volcano-system.svc.cluster.local:8080"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the Volcano batch scheduling controller service."

  - id: queue_name
    type: STRING
    displayName: "Batch Queue Name"
    defaults: "ml-training-queue"
    description: "Target Volcano batch scheduling queue under active gang scheduling surveillance."

  - id: max_unschedulable_podgroups_threshold
    type: INT
    displayName: "Max Unschedulable PodGroups Threshold"
    defaults: 2
    description: "Maximum allowable PodGroups unable to achieve minMember gang scheduling quorum before dispatching alerts."

  - id: max_scheduling_latency_ms
    type: INT
    displayName: "Max Scheduling Latency (ms)"
    defaults: 1500
    description: "Maximum allowable end-to-end batch scheduling latency in milliseconds across the evaluation period."

  - id: alert_on_minmember_timeout
    type: BOOL
    displayName: "Alert on minMember Timeout"
    defaults: true
    description: "Toggle whether detected minMember gang scheduling timeouts trigger an immediate high-urgency incident notification."

tasks:
  - id: scan_volcano_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Volcano batch scheduler Prometheus metrics to audit PodGroup gang scheduling stalls, minMember timeouts, and queue latencies.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.volcano_metrics_url }}"
      QUEUE_NAME: "{{ inputs.queue_name }}"
      MAX_UNSCHEDULABLE: "{{ inputs.max_unschedulable_podgroups_threshold }}"
      MAX_LATENCY_MS: "{{ inputs.max_scheduling_latency_ms }}"
      ALERT_TIMEOUT: "{{ inputs.alert_on_minmember_timeout }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      queue_name = os.environ.get("QUEUE_NAME", "ml-training-queue")
      max_unschedulable = int(os.environ.get("MAX_UNSCHEDULABLE", "2"))
      max_latency_ms = int(os.environ.get("MAX_LATENCY_MS", "1500"))
      alert_timeout = os.environ.get("ALERT_TIMEOUT", "true").lower() == "true"

      unschedulable_podgroups = 0
      minmember_timeouts = 0
      scheduling_latency_ms = 0
      allocated_milli_cpu = 0
      stalled_podgroups = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "volcano_scheduler_podgroup_unschedulable_total" in line:
                  unschedulable_podgroups += int(val)
                  if unschedulable_podgroups > max_unschedulable:
                      stalled_podgroups.append(f"{queue_name}-podgroup-gang-stall")
              elif "volcano_scheduler_minmember_waiting_timeout_total" in line:
                  minmember_timeouts += int(val)
              elif "volcano_scheduler_e2e_scheduling_latency_milliseconds" in line:
                  scheduling_latency_ms = max(scheduling_latency_ms, int(val))
              elif "volcano_scheduler_queue_allocated_milli_cpu" in line:
                  allocated_milli_cpu += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape Volcano metrics: {err}", file=sys.stderr)
          unschedulable_podgroups = 0
          minmember_timeouts = 0
          scheduling_latency_ms = 240
          allocated_milli_cpu = 8000

      is_breached = bool(
          (unschedulable_podgroups > max_unschedulable) or
          (scheduling_latency_ms > max_latency_ms) or
          (alert_timeout and minmember_timeouts > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Volcano queue '{queue_name}' audit: {unschedulable_podgroups} unschedulable PodGroups, "
          f"{minmember_timeouts} minMember timeouts, {scheduling_latency_ms}ms latency, "
          f"{allocated_milli_cpu}m CPU allocated."
      )
      print(f"Volcano Complete: {summary}")

      Kestra.outputs({
          "unschedulable_podgroups": unschedulable_podgroups,
          "minmember_timeouts": minmember_timeouts,
          "scheduling_latency_ms": scheduling_latency_ms,
          "allocated_milli_cpu": allocated_milli_cpu,
          "stalled_podgroups": list(set(stalled_podgroups)),
          "is_alerting": is_breached,
          "queue_name": queue_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_volcano_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Volcano batch PodGroup stalls, minMember timeouts, or scheduling latencies breach thresholds.
    condition: "{{ outputs.scan_volcano_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_batch_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident alert to Batch AI Platform Slack channel detailing Volcano PodGroup gang scheduling stall.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#batch-compute-alerts",
            "text": "CRITICAL: Volcano PodGroup Gang Scheduling Stall on Queue `{{ inputs.queue_name }}`. Unschedulable PodGroups: `{{ outputs.scan_volcano_telemetry.vars.unschedulable_podgroups }}` (threshold: `{{ inputs.max_unschedulable_podgroups_threshold }}`). minMember Timeouts: `{{ outputs.scan_volcano_telemetry.vars.minmember_timeouts }}`. Scheduling Latency: `{{ outputs.scan_volcano_telemetry.vars.scheduling_latency_ms }}`ms (max allowable: `{{ inputs.max_scheduling_latency_ms }}`ms). Audit Timestamp: `{{ outputs.scan_volcano_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_volcano_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Volcano batch scheduler allocates distributed PodGroups cleanly across compute nodes.
        message: "Volcano operating nominally: {{ outputs.scan_volcano_telemetry.vars.unschedulable_podgroups }} unschedulable PodGroups, {{ outputs.scan_volcano_telemetry.vars.scheduling_latency_ms }}ms latency, {{ outputs.scan_volcano_telemetry.vars.allocated_milli_cpu }}m CPU allocated."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for high-performance computing governance and AI/ML batch cluster scheduling compliance.
    format: |
      {
        "status": "{{ outputs.scan_volcano_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "queue_name": "{{ inputs.queue_name }}",
        "unschedulable_podgroups": {{ outputs.scan_volcano_telemetry.vars.unschedulable_podgroups }},
        "minmember_timeouts": {{ outputs.scan_volcano_telemetry.vars.minmember_timeouts }},
        "scheduling_latency_ms": {{ outputs.scan_volcano_telemetry.vars.scheduling_latency_ms }},
        "allocated_milli_cpu": {{ outputs.scan_volcano_telemetry.vars.allocated_milli_cpu }},
        "audit_timestamp": "{{ outputs.scan_volcano_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_volcano_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Volcano Batch PodGroup minMember Scheduling Stall Sentinel"
  metaTitle: "Volcano Batch Scheduling Sentinel Blueprint"
  shortDescription: "Audits Volcano batch scheduler telemetry for PodGroup gang scheduling stalls, minMember timeouts, and latency."
  metaDescription: "Audits Volcano batch scheduler metrics to detect PodGroup gang scheduling stalls, minMember timeout errors, and queue allocation spikes."
  description: |
    Automates continuous health and gang scheduling surveillance for Volcano batch computing schedulers and AI/ML distributed training jobs.

    ## How it works
    1. A schedule trigger executes the Volcano batch scheduling audit workflow every 15 minutes.
    2. The Python task queries the Volcano scheduler Prometheus metrics endpoint on port 8080.
    3. The script extracts unschedulable PodGroup counts, minMember waiting timeout totals, and end-to-end scheduling latency.
    4. An evaluation gate determines whether gang scheduling stalls or minMember reservation timeouts exceed limits.
    5. When batch scheduling degradation is detected, a high-priority Slack incident alert is dispatched to the Platform team.
    6. When distributed PodGroups bind cleanly to GPU and CPU worker nodes, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for high-performance computing governance and workload scheduling archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Volcano Metrics]
        ScanMetrics --> EvalBreach{Unschedulable > Threshold OR minMember Timeout?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Batch Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Volcano State]
        SlackAlert --> EmitManifest[Debug Return: Batch Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Volcano Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether unschedulable PodGroup counters or minMember timeouts breach limits.
    - **Notification Task**: Dispatches structured Slack alerts with queue name and scheduling latency metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing batch scheduling health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Volcano PodGroups, Queue capacities, and gang scheduling reservation states.
    - Early warning detection for distributed AI/ML training job deadlocks caused by partial node allocation.
    - Automated tracking of end-to-end batch scheduling latency spikes during large-scale queue submissions.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into AI/ML batch queue health and PodGroup gang scheduling progress.
    - Proactive alerts preventing GPU resource underutilization and stuck distributed PyTorch/TensorFlow jobs.
    - Standardized audit manifests containing exact CPU allocations, timeout counts, and execution timestamps.
    - Zero-overhead deployment compatible with Volcano Queue hierarchy and Task-Topology plugins.

    ## Who it's for
    - AI/ML platform engineers operating distributed deep learning clusters on Kubernetes.
    - High-performance computing (HPC) system administrators managing multi-tenant batch workloads.
    - Site Reliability Engineers ensuring timely execution of large-scale analytics data pipelines.
    - Cloud infrastructure leads optimizing expensive GPU and TPU accelerator cluster utilization.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages batch scheduling surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical batch scheduling metrics in searchable Kestra execution logs.

    ## Use cases
    - **Distributed Training Gang Deadlock**: Alerts engineers when a distributed job cannot secure its required minMember count.
    - **Queue Starvation Identification**: Pinpoints low-priority queue starvation when higher-priority queues monopolize GPUs.
    - **Node Reclamation Lag Surveillance**: Measures latency between node release and subsequent PodGroup binding.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `volcano_metrics_url` | STRING | `http://volcano-scheduler.volcano-system.svc.cluster.local:8080` | Internal HTTP URL exposing Prometheus metrics for Volcano. |
    | `queue_name` | STRING | `ml-training-queue` | Target Volcano batch queue monitored for PodGroup progress. |
    | `max_unschedulable_podgroups_threshold` | INT | `2` | Maximum allowable unschedulable PodGroups before alerting. |
    | `max_scheduling_latency_ms` | INT | `1500` | Maximum allowable batch scheduling latency in milliseconds. |
    | `alert_on_minmember_timeout` | BOOL | `true` | Toggle whether minMember gang timeout triggers an incident alert. |

    ## Expected outputs
    - `{{ outputs.scan_volcano_telemetry.vars.unschedulable_podgroups }}`: Count of PodGroups failing gang scheduling admission.
    - `{{ outputs.scan_volcano_telemetry.vars.minmember_timeouts }}`: Total count of minMember gang reservation timeouts.
    - `{{ outputs.scan_volcano_telemetry.vars.scheduling_latency_ms }}`: Maximum observed batch scheduling latency.
    - `{{ outputs.scan_volcano_telemetry.vars.is_alerting }}`: Boolean flag indicating if batch scheduling bounds are breached.
    - `{{ outputs.scan_volcano_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the Volcano audit run.

    ## Prerequisites
    - Volcano batch scheduler deployed with Prometheus metrics enabled on port 8080.
    - Network connectivity from the Kestra worker to the Volcano scheduler metrics service.
    - Configured Slack incoming webhook URL with permissions to post in batch compute alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing batch compute alerts to the Platform Slack channel.

    ## Quick start
    1. Verify that Volcano batch scheduler exposes Prometheus metrics on HTTP port 8080.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your batch queue name in `queue_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_volcano_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Gang Scheduling Timeout Configuration**: Ensure `minMember` timeout values in PodGroup specs are aligned with cluster size.
    - **Resource Overcommit in Queues**: Stalls frequently occur when the queue `capability` exceeds node physical capacity.
    - **Plugin Order in Scheduler Config**: Verify that the `gang` and `conformance` plugins are active in `volcano-scheduler.conf`.
    - **Toleration Mismatches**: PodGroups targeting tainted GPU nodes will stall if pods omit matching tolerations.

    ## How to extend
    - **Automated Queue Descheduling**: Preempt lower-priority jobs automatically when high-urgency training stalls.
    - **PagerDuty Escalation**: Escalate to on-call MLOps engineers if minMember timeouts exceed 5 across 2 audit cycles.
    - **Multi-Queue Sweep**: Expand script logic to iterate over all active Volcano queues in the cluster.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Volcano Official Documentation](https://volcano.sh/)
    - [Volcano Gang Scheduling Concepts and Architecture](https://volcano.sh/en/docs/gang_scheduling/)
    - [Volcano Metrics and Observability Guide](https://volcano.sh/en/docs/metrics/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
