id: matrix-failure-alert-dispatcher
namespace: company.team
description: |
  Monitor workflow execution failures across watched namespaces, deduplicate alerts using
  Kestra KV store, and dynamically dispatch structured alerts to dedicated Matrix rooms.

inputs:
  - id: homeserver_url
    type: STRING
    displayName: Matrix Homeserver URL
    description: The base URL of your Matrix homeserver (e.g. https://matrix.org).
    defaults: "https://matrix.org"

  - id: prod_room_id
    type: STRING
    displayName: Production Room ID
    description: Internal Matrix room ID for critical production alerts (e.g. !prod_room:matrix.org).
    defaults: "!prod_room:matrix.org"

  - id: dev_room_id
    type: STRING
    displayName: Development Room ID
    description: Internal Matrix room ID for development alerts (e.g. !dev_room:matrix.org).
    defaults: "!dev_room:matrix.org"

  - id: default_room_id
    type: STRING
    displayName: Default Room ID
    description: Internal Matrix room ID for general workflow alerts (e.g. !general_room:matrix.org).
    defaults: "!general_room:matrix.org"

  - id: cooldown
    type: DURATION
    displayName: Alert Cooldown Duration
    description: Time window to suppress duplicate failure alerts for the same workflow.
    defaults: "PT15M"

triggers:
  - id: on_failure
    type: io.kestra.plugin.core.trigger.Flow
    description: Watch for execution failures in company namespaces, excluding this dispatcher flow.
    dependsOn:
      - when: "{{ trigger.namespace startsWith 'company' and trigger.flowId != flow.id }}"
        states:
          - FAILED
          - WARNING

tasks:
  - id: check_recent_alert
    type: io.kestra.plugin.core.kv.Get
    description: Check KV store for an existing alert key for this workflow within the cooldown period.
    key: "dedup_{{ trigger.namespace | replace('.', '_') }}_{{ trigger.flowId | replace('.', '_') }}"
    errorOnMissing: false

  - id: evaluate_alert
    type: io.kestra.plugin.core.flow.If
    description: Process alert dispatch only if no active cooldown key exists in KV store.
    condition: "{{ outputs.check_recent_alert.value == null }}"
    then:
      - id: route_by_namespace
        type: io.kestra.plugin.core.flow.Switch
        description: Route the failure notification to the appropriate Matrix room based on execution namespace.
        value: "{{ trigger.namespace }}"
        cases:
          company.prod:
            - id: send_prod_matrix
              type: io.kestra.plugin.matrix.Send
              description: Dispatch high-priority alert to production Matrix room.
              homeserverUrl: "{{ inputs.homeserver_url }}"
              accessToken: "{{ secret('MATRIX_ACCESS_TOKEN') }}"
              roomId: "{{ inputs.prod_room_id }}"
              msgtype: NOTICE
              payload: |
                CRITICAL WORKFLOW FAILURE
                Flow: {{ trigger.flowId }}
                Namespace: {{ trigger.namespace }}
                State: {{ trigger.state }}
                Execution ID: {{ trigger.executionId }}
                Execution Link: {{ kestra.url }}/ui/executions/{{ trigger.namespace }}/{{ trigger.flowId }}/{{ trigger.executionId }}
          company.dev:
            - id: send_dev_matrix
              type: io.kestra.plugin.matrix.Send
              description: Dispatch warning alert to development Matrix room.
              homeserverUrl: "{{ inputs.homeserver_url }}"
              accessToken: "{{ secret('MATRIX_ACCESS_TOKEN') }}"
              roomId: "{{ inputs.dev_room_id }}"
              msgtype: NOTICE
              payload: |
                DEV WORKFLOW WARNING
                Flow: {{ trigger.flowId }}
                Namespace: {{ trigger.namespace }}
                State: {{ trigger.state }}
                Execution ID: {{ trigger.executionId }}
                Execution Link: {{ kestra.url }}/ui/executions/{{ trigger.namespace }}/{{ trigger.flowId }}/{{ trigger.executionId }}
        defaults:
          - id: send_default_matrix
            type: io.kestra.plugin.matrix.Send
            description: Dispatch standard alert to default Matrix room.
            homeserverUrl: "{{ inputs.homeserver_url }}"
            accessToken: "{{ secret('MATRIX_ACCESS_TOKEN') }}"
            roomId: "{{ inputs.default_room_id }}"
            msgtype: NOTICE
            payload: |
              WORKFLOW FAILURE ALERT
              Flow: {{ trigger.flowId }}
              Namespace: {{ trigger.namespace }}
              State: {{ trigger.state }}
              Execution ID: {{ trigger.executionId }}
              Execution Link: {{ kestra.url }}/ui/executions/{{ trigger.namespace }}/{{ trigger.flowId }}/{{ trigger.executionId }}

      - id: record_alert_cooldown
        type: io.kestra.plugin.core.kv.Set
        description: Set a KV store key with TTL to suppress duplicate alerts for the cooldown duration.
        key: "dedup_{{ trigger.namespace | replace('.', '_') }}_{{ trigger.flowId | replace('.', '_') }}"
        value: "{{ execution.startDate }}"
        ttl: "{{ inputs.cooldown }}"

    else:
      - id: log_suppressed_alert
        type: io.kestra.plugin.core.log.Log
        description: Log alert suppression when a duplicate failure occurs within the cooldown window.
        message: "Alert for flow {{ trigger.flowId }} in namespace {{ trigger.namespace }} was suppressed (active cooldown: {{ inputs.cooldown }})."

errors:
  - id: log_dispatcher_error
    type: io.kestra.plugin.core.log.Log
    description: Log dispatcher internal failure to prevent circular notification loops.
    message: "Matrix Failure Alert Dispatcher encountered an error on execution {{ execution.id }}: {{ error.message }}"

extend:
  shortDescription: Deduplicate workflow failure alerts with Kestra KV store and dispatch Matrix notifications to room channels by namespace severity.
  title: Matrix Workflow Failure Alert Dispatcher with KV Store Deduplication and Multi-Room Routing
  metaTitle: Matrix Failure Alert Dispatcher with KV Deduplication in Kestra
  metaDescription: Deduplicate Kestra workflow failure alerts using KV store state and route incident notifications to Matrix rooms by namespace severity.
  description: |
    When automated data pipelines or microservice workflows fail across multiple environments, operational teams face alerting noise and delayed response times. Sending an instant message for every repeated failure leads to alert fatigue, while sending all alerts to a single chat channel obscures critical production outages among routine development warnings.

    This operational blueprint provides a centralized Matrix incident dispatcher for Kestra. It monitors workflow executions, deduplicates repeated alerts using Kestra KV store state, and dynamically routes failure notifications to environment-specific Matrix rooms (`#prod-incidents`, `#dev-alerts`, `#general-alerts`).

    ## How it works

    1. **Execution Event Trigger**: The `on_failure` trigger (`io.kestra.plugin.core.trigger.Flow`) listens for `FAILED` or `WARNING` execution states across all `company.*` namespaces. The condition `trigger.flowId != flow.id` prevents self-triggering loops.
    2. **KV Deduplication Check**: Task `check_recent_alert` (`io.kestra.plugin.core.kv.Get`) looks up the sanitized key `dedup_{namespace}_{flowId}` in Kestra KV store with `errorOnMissing: false`.
    3. **Conditional Execution**: Task `evaluate_alert` (`io.kestra.plugin.core.flow.If`) evaluates `outputs.check_recent_alert.value == null`:
       - **If No Active Cooldown**:
         - Task `route_by_namespace` (`io.kestra.plugin.core.flow.Switch`) performs exact string matching on `trigger.namespace` (e.g. `company.prod`, `company.dev`). Any namespace not explicitly matched falls back to `defaults` and dispatches to `default_room_id`.
         - Sends a plain text `NOTICE` message to the designated Matrix room using `io.kestra.plugin.matrix.Send` and secret `MATRIX_ACCESS_TOKEN`.
         - Task `record_alert_cooldown` (`io.kestra.plugin.core.kv.Set`) writes the deduplication key with a TTL duration specified by `inputs.cooldown` (default `PT15M`).
       - **If Cooldown Active**:
         - Task `log_suppressed_alert` (`io.kestra.plugin.core.log.Log`) logs a suppression notice and skips sending a chat message.
    4. **Failure Isolation**: An `errors` block logs dispatcher runtime issues without calling external chat endpoints to avoid circular notification loops.

    ## What you get

    - Centralized, hands-off failure alert routing across all workflows in watched namespaces.
    - Automatic alert deduplication preventing chat spam during retry loops.
    - Multi-room environment routing separating critical production outages from development warnings.

    ## Who it's for

    - **SREs and DevOps Engineers**: Who manage multi-environment Kestra deployments and use Matrix for real-time operations chat.
    - **Platform Engineering Teams**: Looking for a self-hosted, open-source alternative to proprietary incident alerting platforms.

    ## Why orchestrate

    Centralizing failure dispatching inside Kestra eliminates redundant webhook configurations in individual workflows. Using a `Flow` trigger combined with KV state deduplication ensures that temporary workflow retry loops or cascading job failures do not spam chat channels.

    ## How to extend

    - Add additional namespace branches (e.g. `company.staging`, `company.data`) to the `Switch` task to route to dedicated team rooms.
    - Integrate PagerDuty or webhook tasks alongside Matrix for high-priority production outages.
    - Adjust the `cooldown` duration input per environment to customize alert suppression windows.

    ## Prerequisites

    - A running Matrix homeserver (e.g., `https://matrix.org` or a self-hosted Synapse server).
    - A dedicated Matrix bot account.
    - Target Matrix rooms created and configured as **UNENCRYPTED** rooms.
    - The bot account must be invited to each target room and joined prior to flow execution.
    - Note on Inputs: Because event-triggered flows do not accept runtime input prompts when executed by triggers, customize your Matrix homeserver URL, room IDs, and cooldown duration directly in the flow's `inputs` `defaults`.

    ## Secrets

    - `MATRIX_ACCESS_TOKEN`: Access token for the Matrix bot account.
      - *How to retrieve*: In Element desktop/web client, navigate to **Settings > Help & About > Advanced > Access Token**. (Other token retrieval methods like API calls are marked UNVERIFIED).

    ## Quick start

    1. Add the secret `MATRIX_ACCESS_TOKEN` to your Kestra namespace.
    2. Create an unencrypted room in Matrix (e.g., `#prod-incidents`), invite your bot, and copy the internal room ID (e.g., `!abc123xyz:matrix.org` from Room Settings > Advanced).
    3. Import this blueprint and set `prod_room_id`, `dev_room_id`, and `default_room_id` input defaults.
    4. Test the dispatcher by executing this sample failing flow in a watched namespace:

       ```yaml
       id: sample-failing-job
       namespace: company.prod
       tasks:
         - id: trigger_failure
           type: io.kestra.plugin.core.execution.Fail
           message: "Simulated production pipeline failure for Matrix alert test."
       ```

    5. Execute `sample-failing-job`. The dispatcher will catch the failure, post a notice to Matrix, and set a 15-minute KV deduplication lock.

    ## Expected output

    - `check_recent_alert` returns `null` on first run.
    - Matrix receives a plain text `NOTICE` message with direct execution link (`{{ kestra.url }}/ui/executions/...`).
    - KV store sets key `dedup_company_prod_sample-failing-job` with `PT15M` expiration.
    - Re-executing `sample-failing-job` within 15 minutes logs `"Alert for flow sample-failing-job in namespace company.prod was suppressed"`.

    ## Pitfalls

    - **Manual Execution Behavior**: Executing the dispatcher flow manually from the Kestra UI will fail because `trigger.*` context variables (`trigger.namespace`, `trigger.flowId`, `trigger.executionId`, `trigger.state`) are only populated during event-driven trigger executions. Always test by executing a sample failing flow.
    - **End-to-End Encryption (E2EE)**: Matrix rooms **must be unencrypted**. Kestra's Matrix plugin does not support Olm/Megolm encryption ratchets; posting to E2EE rooms will fail.
    - **Bot Room Membership**: The bot must be joined to the room before execution. Uninvited or unjoined rooms return HTTP 403 `M_FORBIDDEN`.
    - **Rate Limits**: Homeservers enforce rate limits on message events. KV deduplication protects homeservers from spam.
    - **Room Aliases**: Use internal room IDs (`!id:domain`), not room aliases starting with `#`.

    ## Links

    - [Kestra Matrix Plugin Documentation](https://kestra.io/plugins/plugin-matrix)
    - [Kestra Core KV Store Documentation](https://kestra.io/plugins/plugin-core/kv)
    - [Kestra Flow Triggers Documentation](https://kestra.io/plugins/plugin-core/triggers/io.kestra.plugin.core.trigger.Flow)
    - This blueprint has been created by [mohitjeswani01](https://github.com/mohitjeswani01)

  tags:
    - Infrastructure
    - Core
  subTags:
    - Failure Alerting
    - Incident Response
  ee: false
  demo: false
