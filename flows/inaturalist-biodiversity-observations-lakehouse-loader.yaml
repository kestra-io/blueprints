id: inaturalist-biodiversity-observations-lakehouse-loader
namespace: company.analytics
description: Ingests crowd-sourced biodiversity observations, taxonomic identifications, quality grades, and geo-coordinates from iNaturalist API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: inaturalist-biodiversity-observations-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://api.inaturalist.org/v1/observations?per_page=50"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "results"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for item in items:
            oid = str(item.get('id', 'UNKNOWN'))
            current_ids.append(oid)
            species = item.get('species_guess', 'Unidentified')
            taxon = item.get('taxon', {}) or {}
            taxon_name = taxon.get('iconic_taxon_name', 'Unknown')
            qgrade = item.get('quality_grade', 'casual')
            obs_on = item.get('observed_on', 'UNKNOWN')
            num_agree = int(item.get('num_identification_agreements', 0))

            records.append({
                'obs_id': oid,
                'species_guess': str(species),
                'iconic_taxon_name': str(taxon_name),
                'quality_grade': str(qgrade),
                'observed_on': str(obs_on),
                'num_identification_agreements': num_agree,
                'is_new': bool(oid not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE biodiversity_observations (
                obs_id VARCHAR,
                species_guess VARCHAR,
                iconic_taxon_name VARCHAR,
                quality_grade VARCHAR,
                observed_on VARCHAR,
                num_identification_agreements INTEGER,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO biodiversity_observations SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY biodiversity_observations TO 'biodiversity_observations.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    iconic_taxon_name,
                    quality_grade,
                    COUNT(*) AS observation_count
                FROM biodiversity_observations
                GROUP BY 1, 2
                ORDER BY observation_count DESC
            ) TO 'observations_by_taxon.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM biodiversity_observations WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM biodiversity_observations").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - biodiversity_observations.parquet
      - observations_by_taxon.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['biodiversity_observations.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "iNaturalist Biodiversity Observations sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
