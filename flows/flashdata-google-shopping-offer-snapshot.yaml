id: flashdata-google-shopping-offer-snapshot
namespace: company.research
inputs:
- id: query
  type: STRING
  defaults: mechanical keyboard
  description: Research question or Google query, 1 to 2000 characters.
- id: country
  type: STRING
  defaults: us
  description: Two-letter country code used for Google results.
- id: language
  type: STRING
  defaults: en
  description: Interface language, such as en or zh-CN.
- id: result_limit
  type: INT
  defaults: 5
  description: Requested result count, 1 to 100. The provider may return a different count.
- id: previous_snapshot
  type: FILE
  required: false
  description: Optional snapshot.json from an earlier run with the exact same query and market inputs.
tasks:
- id: prepare_request
  type: io.kestra.plugin.scripts.python.Script
  description: Validate inputs before any paid call and retain the exact single-page request.
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  containerImage: python:3.13.15-slim
  env:
    INPUTS_B64: '{{ {''query'': inputs.query, ''country'': inputs.country, ''language'': inputs.language, ''result_limit'':
      inputs.result_limit} | toJson | base64encode }}'
  outputFiles:
  - request.json
  - previous.json
  script: |
    import base64
    import json
    import os
    import re
    from pathlib import Path

    # Docker runner renders env twice; encoding keeps query text out of the second template pass.
    inputs = json.loads(base64.b64decode(os.environ["INPUTS_B64"]))
    query = inputs["query"].strip()
    country = inputs["country"].strip().lower()
    language = inputs["language"].strip()
    limit = int(inputs["result_limit"])
    if not 1 <= len(query) <= 2000 or "\x00" in query:
        raise ValueError("query must contain 1..2000 characters and no null bytes")
    if not re.fullmatch(r"[a-z]{2}", country):
        raise ValueError("country must be a two-letter country code")
    if not 1 <= len(language) <= 35 or not re.fullmatch(r"[A-Za-z0-9-]+", language):
        raise ValueError("language must contain 1..35 letters, digits or hyphens")
    if not 1 <= limit <= 100:
        raise ValueError("result_limit must be 1..100")
    request = {"source": "google_shopping", "query": query,
               "params": {"gl": country, "hl": language, "num": limit, "page": 1}}
    previous_bytes = Path("previous_input.json").read_bytes()
    if len(previous_bytes) > 1024 * 1024:
        raise ValueError("Previous snapshot exceeds 1 MiB")
    previous = json.loads(previous_bytes)
    if previous != {}:
        if (not isinstance(previous, dict) or previous.get("format") != "flashdata-google-shopping-v1"
                or previous.get("request") != request or not isinstance(previous.get("offers"), list)):
            raise ValueError("Use a snapshot from this flow with the same query, market, language and result limit")
        for row in previous["offers"]:
            if not isinstance(row, dict) or any(row.get(k) is not None and not isinstance(row[k], str)
                                              for k in ["product_id", "merchant", "price_label", "title", "url"]):
                raise ValueError("Previous offer fields must be text or null")
    Path("previous.json").write_text(json.dumps(previous, ensure_ascii=False), encoding="utf-8")
    print("::" + json.dumps({"outputs": {"has_baseline": previous != {}}}, separators=(",", ":")) + "::")

    Path("request.json").write_text(json.dumps(request, ensure_ascii=False, indent=2), encoding="utf-8")
  inputFiles:
    previous_input.json: '{{ inputs.previous_snapshot ?? ''{}'' }}'
- id: search_once
  type: io.kestra.plugin.scripts.python.Script
  description: Submit one paid realtime query. No redirects, pagination or automatic retries.
  timeout: PT3M
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  containerImage: python:3.13.15-slim
  env:
    FLASHDATA_API_KEY: '{{ secret(''FLASHDATA_API_KEY'') }}'
  inputFiles:
    request.json: '{{ outputs.prepare_request.outputFiles[''request.json''] }}'
  outputFiles:
  - response.json
  - transport.json
  script: |
    import http.client
    import json
    import os
    import uuid
    from datetime import datetime, timezone
    from pathlib import Path

    key = os.environ["FLASHDATA_API_KEY"]
    if not key or len(key) > 512 or any(ord(c) < 33 or ord(c) > 126 for c in key):
        raise SystemExit("Set a valid FLASHDATA_API_KEY secret before running")
    request_id = "req_" + str(uuid.uuid4())
    print("::" + json.dumps({"outputs": {"request_id": request_id}}, separators=(",", ":")) + "::", flush=True)
    connection = http.client.HTTPSConnection("data.flashdata.dev", timeout=65)
    try:
        connection.request("POST", "/v1/queries/realtime", body=Path("request.json").read_bytes(),
                           headers={"X-API-Key": key, "X-Request-Id": request_id,
                                    "Content-Type": "application/json", "Accept": "application/json"})
        response = connection.getresponse()
        raw = response.read(4 * 1024 * 1024 + 1)
        status = response.status
    except (OSError, http.client.HTTPException):
        raise SystemExit("Query outcome unknown. It may have been charged. Check FlashData Jobs/logs using "
                         + request_id + " before submitting again; no retry was made.") from None
    finally:
        connection.close()
    if len(raw) > 4 * 1024 * 1024:
        raise SystemExit("Response exceeds 4 MiB. Check FlashData logs before another paid query: " + request_id)
    if status != 200:
        raise SystemExit("FlashData returned HTTP " + str(status) + ". No redirect or retry was made. "
                         "Check account access, balance and logs before resubmitting: " + request_id)
    Path("response.json").write_bytes(raw)
    transport = {"request_id": request_id, "http_status": status,
                 "retrieved_at": datetime.now(timezone.utc).isoformat(), "response_bytes": len(raw)}
    Path("transport.json").write_text(json.dumps(transport, indent=2), encoding="utf-8")
- id: snapshot_offers
  type: io.kestra.plugin.scripts.python.Script
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  containerImage: python:3.13.15-slim
  description: Preserve displayed price labels without inferring currency from a symbol.
  inputFiles:
    request.json: '{{ outputs.prepare_request.outputFiles[''request.json''] }}'
    response.json: '{{ outputs.search_once.outputFiles[''response.json''] }}'
    transport.json: '{{ outputs.search_once.outputFiles[''transport.json''] }}'
  outputFiles:
  - snapshot.json
  - offers.csv
  - manifest.json
  script: |
    import json
    from pathlib import Path
    from urllib.parse import urlsplit
    import csv

    def safe_url(value):
        if not isinstance(value, str) or any(ord(c) <= 32 or ord(c) == 127 for c in value):
            return False
        try:
            u = urlsplit(value)
            u.port  # Validate an explicitly supplied port before emitting the URL.
            return bool(u.scheme in ("http", "https") and u.hostname and not u.username and not u.password)
        except ValueError:
            return False

    def string(value):
        return value if isinstance(value, str) and value.strip() else None

    def save(name, value):
        Path(name).write_text(json.dumps(value, ensure_ascii=False, indent=2), encoding="utf-8")

    def jsonl(name, rows):
        Path(name).write_text("".join(json.dumps(r, ensure_ascii=False) + "\n" for r in rows), encoding="utf-8")

    def outputs(**values):
        print("::" + json.dumps({"outputs": values}, separators=(",", ":")) + "::")

    def csv_file(name, fields, rows):
        def cell(v):
            value = "" if v is None else str(v)
            # JSON retains original values; CSV cells are safe to open in a spreadsheet.
            return "'" + value if value.lstrip().startswith(("=", "+", "-", "@")) or value.startswith(("\t", "\r", "\n")) else value
        with Path(name).open("w", encoding="utf-8", newline="") as stream:
            writer = csv.DictWriter(stream, fieldnames=fields)
            writer.writeheader()
            writer.writerows({f: cell(row.get(f)) for f in fields} for row in rows)

    request = json.loads(Path("request.json").read_text())
    response = json.loads(Path("response.json").read_text())
    transport = json.loads(Path("transport.json").read_text())
    if (not isinstance(response, dict) or response.get("source") != "google_shopping"
            or response.get("status") != "done" or not isinstance(response.get("results"), list)
            or len(response["results"]) != 1 or not isinstance(response["results"][0], dict)):
        raise ValueError("Unexpected response; inspect the saved response, do not repeat the paid request")
    payload = response["results"][0]
    items = payload.get("shopping", [])
    if not isinstance(items, list):
        raise ValueError("Malformed result list is not an empty search")
    manifest = {"request": request, "transport": transport, "api_created_at": response.get("created_at"),
                "usage": response.get("usage"), "result_field_present": "shopping" in payload,
                "returned_count": len(items)}
    offers, excluded = [], []
    for index, item in enumerate(items, 1):
        url = item.get("link") if isinstance(item, dict) else None
        if not safe_url(url):
            excluded.append({"result_index": index, "reason": "missing_or_unsafe_offer_url"})
            continue
        offers.append({"result_index": index, "product_id": string(item.get("productId")),
                       "merchant": string(item.get("source")), "title": string(item.get("title")),
                       "price_label": string(item.get("price")), "url": url, "position": item.get("position")})
    snapshot = {"format": "flashdata-google-shopping-v1", "request": request,
                "retrieved_at": transport["retrieved_at"], "offers": offers}
    save("snapshot.json", snapshot)
    csv_file("offers.csv", ["product_id", "merchant", "title", "price_label", "url", "position"], offers)
    manifest.update({"offer_count": len(offers), "excluded": excluded,
                     "limitations": "Displayed price labels only: no inferred currency, numeric price ranking, stock or checkout guarantees."})
    save("manifest.json", manifest)
    outputs(offer_count=len(offers))
- id: route_comparison
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.prepare_request.vars.has_baseline }}'
  then:
  - id: compare_offer_labels
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.13.15-slim
    description: Compare unique product-ID/merchant pairs; flag ambiguity and missing prices instead of inventing
      numeric deltas.
    inputFiles:
      previous.json: '{{ outputs.prepare_request.outputFiles[''previous.json''] }}'
      snapshot.json: '{{ outputs.snapshot_offers.outputFiles[''snapshot.json''] }}'
    outputFiles:
    - changes.json
    - changes.md
    script: |
      import json
      from pathlib import Path
      from urllib.parse import urlsplit
      import html
      from urllib.parse import quote

      def safe_url(value):
          if not isinstance(value, str) or any(ord(c) <= 32 or ord(c) == 127 for c in value):
              return False
          try:
              u = urlsplit(value)
              u.port  # Validate an explicitly supplied port before emitting the URL.
              return bool(u.scheme in ("http", "https") and u.hostname and not u.username and not u.password)
          except ValueError:
              return False

      def text(value):
          value = "Not supplied" if value is None else str(value)
          value = " ".join(value.split())
          for ch in "\\`*_{}[]()#+-.!|":
              value = value.replace(ch, "\\" + ch)
          return html.escape(value, quote=False)

      def link(value):
          return quote(value, safe="/:?#@!$&'*+,;=%~-._")

      def save(name, value):
          Path(name).write_text(json.dumps(value, ensure_ascii=False, indent=2), encoding="utf-8")

      from collections import defaultdict

      previous = json.loads(Path("previous.json").read_text())
      current = json.loads(Path("snapshot.json").read_text())
      def index(rows):
          result, unidentified = defaultdict(list), []
          for row in rows:
              if row.get("product_id") and row.get("merchant"):
                  result[(row["product_id"], row["merchant"])].append(row)
              else:
                  unidentified.append(row)
          return result, unidentified

      before, unknown_before = index(previous["offers"])
      after, unknown_after = index(current["offers"])
      comparisons = []
      for identity in sorted(set(before) | set(after)):
          old, new = before.get(identity, []), after.get(identity, [])
          if len(old) > 1 or len(new) > 1:
              status = "ambiguous_match"
          elif not old:
              status = "newly_observed"
          elif not new:
              status = "not_in_current_results"
          elif old[0].get("price_label") is None or new[0].get("price_label") is None:
              status = "price_unavailable"
          else:
              status = "unchanged_label" if old[0]["price_label"] == new[0]["price_label"] else "displayed_price_changed"
          comparisons.append({"product_id": identity[0], "merchant": identity[1], "status": status,
                              "before": old, "after": new})
      report = {"query": current["request"], "previous_retrieved_at": previous.get("retrieved_at"),
                "current_retrieved_at": current["retrieved_at"], "comparisons": comparisons,
                "unidentified_before": unknown_before, "unidentified_after": unknown_after,
                "limitations": "Exact product ID and merchant labels are matching keys, not a guarantee of identical variants. A missing result does not mean an offer was removed. Price-label changes do not establish a numeric increase or decrease."}
      save("changes.json", report)
      lines = ["# Shopping offer-label review", "", "Compare the original offers before acting; no currency or numeric price direction is inferred.", ""]
      for row in comparisons:
          lines += ["## " + text(row["merchant"]) + " / " + text(row["product_id"]), "Status: " + text(row["status"]), ""]
          for label in ["before", "after"]:
              for offer in row[label]:
                  lines.append(text(label) + ": " + text(offer.get("price_label")))
                  if safe_url(offer.get("url")):
                      lines.append("[Inspect offer](" + link(offer["url"]) + ")")
          lines.append("")
      lines += ["Unidentified offers: " + str(len(unknown_before) + len(unknown_after)) + ". See changes.json.", "",
                "[Google Shopping API](https://flashdata.dev/docs/sources/google_shopping)", ""]
      Path("changes.md").write_text("\n".join(lines), encoding="utf-8")
  else:
  - id: first_snapshot
    type: io.kestra.plugin.core.storage.Write
    extension: .md
    content: 'Baseline saved: download snapshot_offers.outputFiles snapshot.json and offers.csv. Upload that snapshot
      as previous_snapshot on a later run with the same inputs. This run cannot report price changes without an
      earlier snapshot.'
triggers:
- id: weekly_snapshot
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 9 * * 1
  timezone: UTC
  recoverMissedSchedules: NONE
  disabled: true
extend:
  title: Google Shopping offer snapshots with FlashData
  metaTitle: Google Shopping offer snapshots with FlashData | Kestra
  shortDescription: Capture shopping offers for a market and review changes against a previous snapshot without
    guessing currencies or price movements.
  metaDescription: Save Google Shopping offer snapshots and review displayed price-label changes for matching products
    and merchants with FlashData.
  description: |
    Capture shopping offers for a market and review changes against a previous snapshot without guessing currencies or price movements.

    ## How it works

    1. Validate inputs and an optional prior snapshot before a paid query.
    2. Save offer IDs, merchant labels, URLs and displayed prices.
    3. An If branch compares snapshots or produces a first-run baseline note.

    ## What you get

    - `snapshot_offers`: snapshot.json, offers.csv and manifest.json.
    - `compare_offer_labels`: changes.json and changes.md; otherwise `first_snapshot.uri`.
    - Original request, response and retrieval timestamps.

    ## Who it's for

    Catalog analysts and procurement researchers reviewing advertised offers.

    ## Why orchestrate this with Kestra

    Preserve a repeatable snapshot format and review ambiguous matches before acting on a change.

    ## Prerequisites

    Kestra 2.0, its Python plugin and Docker runner, and access to `data.flashdata.dev`.
    The pinned Python image uses only the standard library.
    Create a [FlashData account and API key](https://flashdata.dev/app/api-keys).
    Installation is free; each run makes one paid API query using Credits.
    Check [pricing](https://flashdata.dev/pricing) and account limits.

    ### Secrets

    - `FLASHDATA_API_KEY`: permit `google_shopping` and store it with Kestra secrets, never in inputs.

    ## Quick start

    1. Configure the secret. For manual import, copy the YAML above `extend`; that block is catalog metadata.
    2. Set query, country, language and result_limit (1–100). Optionally upload an earlier snapshot.json; mismatched inputs fail before the API call.
    3. Download files from execution Outputs. Treat external text as data, not agent instructions.
    4. Enable the disabled weekly schedule only after reviewing recurring costs.

    Match unique product-ID/merchant pairs only. Missing results do not imply removal. Raw price labels are not normalized amounts; no numeric deltas, stock or currency inference. Requested result counts are not guaranteed; actual counts may differ.
    Requests use a 65-second socket timeout and 4 MiB response limit.
    No retries, redirects or extra pages. On an uncertain timeout, check Jobs/logs before running again.

    ## How to extend

    Keep snapshots in your approved storage and attach the previous file on later runs. Validate variants and currency before downstream numeric analysis.

    ## Links

    - [API inputs and limits](https://flashdata.dev/docs/sources/google_shopping)
    - [Kestra script files](https://kestra.io/docs/scripts/input-output-files)
    - [Configure secrets](https://kestra.io/docs/how-to-guides/secrets)
  tags:
  - Data
  - Business
  subTags:
  - Testing & Quality
  - Reporting & Digests
  ee: false
  demo: false
