id: dbt-model-runtime-regression-alert
namespace: company.team
description: |
  Run dbt, keep a history of how long every model takes, and alert Slack when a model
  becomes much slower than its recent median. A slow model does not fail, so nothing
  else in the pipeline catches it.

inputs:
  - id: threshold_pct
    type: INT
    displayName: Regression threshold (%)
    description: Alert when a model runs this much slower than its baseline median.
    defaults: 50

  - id: baseline_runs
    type: INT
    displayName: Baseline runs
    description: Number of previous successful runs per model that make up the baseline.
    defaults: 7

  - id: min_duration_seconds
    type: FLOAT
    displayName: Minimum duration (seconds)
    description: Ignore models faster than this in the current run, so sub-second noise does not alert.
    defaults: 5.0

  - id: history_db
    type: STRING
    displayName: History database
    description: DuckDB database that stores the run history. Use md:<database> to keep it in MotherDuck.
    defaults: /app/storage/dbt_runtime_history.duckdb

tasks:
  - id: dbt
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_repository
        type: io.kestra.plugin.git.Clone
        description: Check out the dbt project. Point this at your own repository.
        url: https://github.com/kestra-io/dbt-demo
        branch: main

      - id: dbt_build
        type: io.kestra.plugin.dbt.cli.DbtCLI
        description: Build the project. The task uploads target/run_results.json as an output file.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: ghcr.io/kestra-io/dbt-duckdb:latest
        profiles: |
          jaffle_shop:
            outputs:
              dev:
                type: duckdb
                path: ":memory:"
                threads: 4
            target: dev
        commands:
          - dbt build

  - id: record_run
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Append the execution time of every successful model in this run to the history table.
    url: "jdbc:duckdb:{{ inputs.history_db }}"
    inputFiles:
      run_results.json: "{{ outputs.dbt_build.outputFiles['run_results.json'] }}"
    sql: |
      CREATE TABLE IF NOT EXISTS dbt_model_runs (
        execution_id   VARCHAR,
        invocation_id  VARCHAR,
        recorded_at    TIMESTAMP,
        unique_id      VARCHAR,
        execution_time DOUBLE
      );

      INSERT INTO dbt_model_runs
      SELECT
        '{{ execution.id }}',
        metadata.invocation_id,
        now(),
        r.unique_id,
        r.execution_time
      FROM (
        SELECT metadata, unnest(results) AS r
        FROM read_json_auto('{{ workingDir }}/run_results.json', maximum_object_size = 268435456)
      )
      WHERE starts_with(r.unique_id, 'model.')
        AND r.status = 'success';

  - id: find_regressions
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Compare this run with the median of each model's previous runs and keep the models over the threshold.
    url: "jdbc:duckdb:{{ inputs.history_db }}"
    fetchType: FETCH
    sql: |
      WITH ranked AS (
        SELECT
          unique_id,
          execution_id,
          execution_time,
          row_number() OVER (PARTITION BY unique_id ORDER BY recorded_at DESC) AS rn
        FROM dbt_model_runs
      ),
      latest AS (
        SELECT unique_id, execution_time
        FROM ranked
        WHERE rn = 1 AND execution_id = '{{ execution.id }}'
      ),
      baseline AS (
        SELECT unique_id, median(execution_time) AS median_s, count(*) AS runs
        FROM ranked
        WHERE rn BETWEEN 2 AND {{ inputs.baseline_runs }} + 1
        GROUP BY unique_id
      )
      SELECT
        l.unique_id                                        AS model,
        round(b.median_s, 2)                               AS baseline_s,
        round(l.execution_time, 2)                         AS latest_s,
        CAST(round(100 * (l.execution_time / b.median_s - 1)) AS INTEGER) AS pct_slower
      FROM latest l
      JOIN baseline b USING (unique_id)
      WHERE b.runs >= 3
        AND l.execution_time >= {{ inputs.min_duration_seconds }}
        AND l.execution_time > b.median_s * (1 + {{ inputs.threshold_pct }} / 100.0)
      ORDER BY pct_slower DESC;

  - id: alert_on_regressions
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.find_regressions.size > 0 }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          dbt runtime regression in {{ flow.namespace }}.{{ flow.id }} (execution {{ execution.id }}).
          {{ outputs.find_regressions.size }} model(s) ran more than {{ inputs.threshold_pct }}% slower than their median over the last {{ inputs.baseline_runs }} runs:
          {% for row in outputs.find_regressions.rows %}- {{ row.model }}: {{ row.baseline_s }}s -> {{ row.latest_s }}s (+{{ row.pct_slower }}%)
          {% endfor %}
    else:
      - id: no_regressions
        type: io.kestra.plugin.core.log.Log
        message: No model ran more than {{ inputs.threshold_pct }}% slower than its baseline.

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run after the nightly load. Adjust or disable as needed.
    cron: "0 3 * * *"
    disabled: true

  - id: on_merge
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call this webhook from CI after a merge to the main branch, so a slow model is caught on the change that introduced it. Replace the key with your own value.
    key: replace-with-a-random-key

extend:
  title: Detect dbt Model Runtime Regressions and Alert Slack
  shortDescription: Run dbt, keep each model's execution time in DuckDB, and alert Slack when a model runs much slower than its recent median.
  metaTitle: Detect dbt Model Runtime Regressions with Kestra
  metaDescription: Catch dbt models that got slower without failing. Kestra stores run_results timings in DuckDB and alerts Slack when a model exceeds its median.
  description: |
    A dbt model that gets slower does not fail. It still builds, its tests still pass, and the warehouse bill and the morning dashboards are the first to notice. Models slow down for ordinary reasons: a join that starts fanning out, an incremental model whose filter stops pruning and rebuilds the whole table, a source that grows ten times in a quarter. On a warehouse billed by compute time, a model that went from 40 seconds to 6 minutes costs nine times as much every run, and it can delay every model downstream of it.

    dbt writes the execution time of every model to `run_results.json`, but it only keeps the latest run, so there is nothing to compare against. This blueprint keeps that history. After each `dbt build` it stores every model's execution time in a DuckDB table, compares the run with the median of each model's previous runs, and posts the models that got slower to Slack.

    ## How it works

    1. `clone_repository` checks out the dbt project with `io.kestra.plugin.git.Clone`, inside a `WorkingDirectory` so the next task sees the files.
    2. `dbt_build` runs `dbt build` with `io.kestra.plugin.dbt.cli.DbtCLI` in the `ghcr.io/kestra-io/dbt-duckdb` image, on the `jaffle_shop` project from `kestra-io/dbt-demo` with an in-memory DuckDB profile. The task uploads `target/run_results.json` and exposes it as `outputs.dbt_build.outputFiles['run_results.json']`.
    3. `record_run` (`io.kestra.plugin.jdbc.duckdb.Queries`) reads that file with `read_json_auto` and appends one row per successful model to `dbt_model_runs`: execution ID, dbt invocation ID, timestamp, model unique ID and execution time.
    4. `find_regressions` (`io.kestra.plugin.jdbc.duckdb.Query`) takes, for each model, the median of its previous `baseline_runs` runs and returns the models from this run that are slower than that median by more than `threshold_pct`.
    5. `alert_on_regressions` (`io.kestra.plugin.core.flow.If`) posts the list to Slack when there is at least one regression, and logs a line otherwise.

    The median is used rather than the mean so that one unusually slow run does not raise the baseline and hide the next regression. A model needs at least three previous runs before it is checked, and models faster than `min_duration_seconds` in the current run are skipped, because a 0.2s model can easily show +200% from noise alone.

    ## Triggers

    - `nightly` (`Schedule`, `0 3 * * *`, disabled by default): run after the nightly load.
    - `on_merge` (`Webhook`): call `/api/v1/main/executions/webhook/company.team/dbt-model-runtime-regression-alert/<key>` from CI after a merge, so the regression is reported on the change that caused it.

    ## Prerequisites

    - Kestra with Docker available to the worker (for the dbt task runner).
    - A writable location for the history database. The default, `/app/storage/dbt_runtime_history.duckdb`, is the storage volume in the standard Kestra Docker setup. Set `history_db` to `md:<database>` to keep the history in MotherDuck instead (requires a `motherduck_token`).

    ## Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL the alert is posted to.

    ## Inputs

    | Input | Type | Default | Purpose |
    | --- | --- | --- | --- |
    | `threshold_pct` | INT | `50` | How much slower than the baseline median a model must run to alert. |
    | `baseline_runs` | INT | `7` | Number of previous runs per model that make up the baseline. |
    | `min_duration_seconds` | FLOAT | `5.0` | Models faster than this in the current run are ignored. |
    | `history_db` | STRING | `/app/storage/dbt_runtime_history.duckdb` | DuckDB database that stores the history. |

    The `jaffle_shop` models run in well under a second, so the default `min_duration_seconds` skips all of them. To try the alert on the demo, run the flow at least four times with `min_duration_seconds` set to `0`, and raise `threshold_pct` to `200`: below a second, run-to-run jitter alone can exceed 50%.

    ## Outputs

    - `{{ outputs.dbt_build.outputFiles['run_results.json'] }}`: the raw dbt run results of this execution.
    - `{{ outputs.find_regressions.rows }}`: one row per regressed model with `model`, `baseline_s`, `latest_s` and `pct_slower`.
    - The `dbt_model_runs` table in the history database, which you can also query for runtime trends.

    ## Adapting it

    - Replace the Git URL and the image with your project and adapter, for example `ghcr.io/kestra-io/dbt-snowflake`, and add a `profiles` block or your secrets.
    - Run the check from an existing dbt flow: add `record_run`, `find_regressions` and `alert_on_regressions` after your own `DbtCLI` task and change the `inputFiles` reference.
    - Alert on query cost instead of time with the `adapter_response` field of `run_results.json`, where your adapter reports bytes or credits.

    ## Links

    - [dbt plugin](https://kestra.io/plugins/plugin-dbt)
    - [DuckDB plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [dbt run_results.json](https://docs.getdbt.com/reference/artifacts/run-results-json)
    - [Slack incoming webhooks](https://api.slack.com/messaging/webhooks)
    - This blueprint was contributed by [tripleaceme](https://github.com/tripleaceme)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Scheduling
  ee: false
  demo: false
