id: apache-kafka-offline-partitions-sentinel
namespace: company.team

inputs:
  - id: kafka_bootstrap
    type: STRING
    defaults: "kafka:9092"
    description: Kafka bootstrap broker address.
  - id: offline_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of offline Kafka topic partitions.

tasks:
  - id: audit_offline_partitions
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kafka-python
    env:
      BOOTSTRAP_SERVER: "{{ inputs.kafka_bootstrap }}"
    script: |
      import os
      import sys
      import json
      from kafka import KafkaAdminClient
      from kestra import Kestra

      bootstrap = os.environ.get("BOOTSTRAP_SERVER", "kafka:9092")

      try:
          admin = KafkaAdminClient(bootstrap_servers=bootstrap, request_timeout_ms=10000)
          cluster_metadata = admin.describe_cluster()
          brokers = cluster_metadata.get("brokers", [])
          active_broker_ids = set(b.get("node_id") for b in brokers if "node_id" in b)
          
          # Describe topics
          topics = admin.list_topics()
          topic_descriptions = admin.describe_topics(topics)
          
          offline_partitions = []
          for t_info in topic_descriptions:
              t_name = t_info.get("topic")
              for p in t_info.get("partitions", []):
                  leader = p.get("leader")
                  # Leader -1 or leader not in active brokers indicates offline partition
                  if leader == -1 or leader not in active_broker_ids:
                      offline_partitions.append(f"{t_name}:{p.get('partition')} (leader={leader})")
                      
          admin.close()
      except Exception as e:
          print(f"CRITICAL: Failed to query Kafka cluster offline partitions on '{bootstrap}': {e}", file=sys.stderr)
          sys.exit(1)

      offline_count = len(offline_partitions)
      offline_samples = " ".join(offline_partitions[:20]) if offline_partitions else "none"

      report = {
          "bootstrap": bootstrap,
          "offline_count": offline_count,
          "offline_partitions": offline_partitions
      }

      with open("offline_partitions_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "offline_count": offline_count,
          "offline_samples": offline_samples
      })
      print(f"Offline partition audit: count={offline_count}, samples={offline_samples}")
    outputFiles:
      - offline_partitions_report.json

  - id: evaluate_partition_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_offline_partitions.vars.offline_count | int > inputs.offline_threshold }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#streaming-incidents",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Apache Kafka Offline / Unavailable Partitions Critical Alert",
                "text": "Detected *{{ outputs.audit_offline_partitions.vars.offline_count }}* offline partition(s) on cluster `{{ inputs.kafka_bootstrap }}`. Details: {{ outputs.audit_offline_partitions.vars.offline_samples }}. Impact: Partitions have no active leader broker; producers and consumers are encountering NOT_ENOUGH_REPLICAS or LEADER_NOT_AVAILABLE errors.",
                "footer": "Kestra Streaming Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#streaming-incidents",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Kafka Offline Partitions Sentinel Workflow Failed",
            "text": "The Kafka offline partition audit workflow failed on `{{ inputs.kafka_bootstrap }}`. Execution ID: {{ execution.id }}",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors Apache Kafka topic partitions to detect offline and leaderless partitions causing client outages."
  metaTitle: Apache Kafka Offline Partitions Sentinel with Kestra
  title: Apache Kafka Offline Partitions Sentinel
  shortDescription: Monitors Apache Kafka topic partitions to detect offline and leaderless partitions causing client outages.
  description: |
    ## How it works
    This workflow connects to the Kafka cluster to evaluate partition availability. Partitions without an active leader broker (leader -1) reject all write and read requests, immediately breaking dependent real-time streams. If any partition reports an offline state exceeding the threshold, operations teams receive immediate Slack incident alerts.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_schedule Schedule Trigger] --> B[audit_offline_partitions Python Script]
      B --> C{Offline Count > Threshold?}
      C -- Yes --> D[notify_streaming_team Slack Webhook]
      C -- No --> E[All Partitions Online]
    ```

    ## Prerequisites
    - Apache Kafka cluster reachable on port 9092.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `kafka_bootstrap`.
    3. Run manually to verify partition availability.

    ## Links
    - [Kafka Partition Health Documentation](https://kafka.apache.org/documentation/#monitoring)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Event-Driven Architecture
    - Day 2 Operations
  ee: false
  demo: false
