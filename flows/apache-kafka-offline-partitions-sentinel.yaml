id: apache-kafka-offline-partitions-sentinel
namespace: company.team

inputs:
  - id: kafka_bootstrap
    type: STRING
    defaults: "kafka:9092"
    description: Kafka bootstrap broker address.
  - id: offline_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of offline Kafka topic partitions.

tasks:
  - id: audit_offline_partitions
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: confluentinc/cp-kafka:latest
    commands:
      - |
        set -euo pipefail

        kafka-topics --bootstrap-server "{{ inputs.kafka_bootstrap }}" \
          --describe --unavailable-partitions > /tmp/offline_partitions.txt

        OFFLINE_COUNT=$(grep -c "Topic:" /tmp/offline_partitions.txt || true)
        OFFLINE_SAMPLES=$(head -n 20 /tmp/offline_partitions.txt | paste -sd " " -)

        echo "::set-output name=offline_count::${OFFLINE_COUNT:-0}::"
        echo "::set-output name=offline_samples::${OFFLINE_SAMPLES:-none}::"

  - id: evaluate_partition_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_offline_partitions.vars.offline_count | int > inputs.offline_threshold }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-incidents",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Apache Kafka Offline / Unavailable Partitions Critical Alert",
                "text": "Detected *{{ outputs.audit_offline_partitions.vars.offline_count }}* offline partition(s) on cluster `{{ inputs.kafka_bootstrap }}`. Details: {{ outputs.audit_offline_partitions.vars.offline_samples }}. Impact: Partitions have no active leader broker; producers and consumers are encountering NOT_ENOUGH_REPLICAS or LEADER_NOT_AVAILABLE errors.",
                "footer": "Kestra Streaming Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-incidents",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Kafka Offline Partitions Sentinel Workflow Failed",
            "text": "The Kafka offline partition audit workflow failed. Please verify Kafka bootstrap server address and network reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Apache Kafka cluster topic metadata to detect offline partitions lacking active leader brokers and causing message stalls."
  metaTitle: Apache Kafka Offline and Unavailable Topic Partitions Leader Sentinel with Kestra
  title: Apache Kafka Offline and Unavailable Topic Partitions Leader Sentinel
  shortDescription: Audits Apache Kafka cluster topic metadata to detect offline partitions lacking active leader brokers and causing message stalls.
  description: |
    ## How it works
    This workflow connects to the target Apache Kafka cluster using official `kafka-topics` administration tools in a containerized task runner. It queries for partitions marked as unavailable or offline (`--unavailable-partitions`), indicating that no in-sync replica (ISR) broker is eligible to lead the partition. Any offline partitions represent total data read/write blackouts for that topic and trigger an immediate incident alert to Slack.

    ## What you get
    - Real-time detection of broker crash-induced partition offline events.
    - Prevents silent message publishing failures in high-throughput streaming pipelines.
    - Actionable diagnostics including topic names and affected partition IDs.

    ## Who it's for
    - Event Streaming and Kafka Platform Engineers managing production Kafka clusters.
    - Data Engineers and SREs operating real-time event-driven microservices.

    ## Why orchestrate this with Kestra
    - **Reliable Automation**: Schedule continuous cluster health inspections without managing standalone monitoring pods.
    - **Containerized Tooling**: Runs official Kafka CLI tooling seamlessly inside Kestra container workers.
    - **Instant Routing**: Dispatches high-severity incident notifications to Slack or PagerDuty.

    ## Prerequisites
    - Network reachability to Kafka bootstrap brokers.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure Kafka bootstrap address and Slack webhook secret.
    3. Run the workflow to verify cluster partition availability.

    ## How to extend
    - Add an automated task to restart failed Kafka broker pods via Kubernetes.
    - Correlate with under-replicated partition and active controller metrics.

    ## Links
    - [Apache Kafka Documentation](https://kafka.apache.org/documentation/#basic_ops_consumer_lag)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - ELT & Data Landing
  ee: false
  demo: false
