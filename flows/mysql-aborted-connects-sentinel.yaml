id: mysql-aborted-connects-sentinel
namespace: company.dataops

inputs:
  - id: mysql_host
    type: STRING
    defaults: mysql.internal
    description: Hostname of the MySQL database instance.
  - id: mysql_port
    type: INT
    defaults: 3306
    description: TCP port of the MySQL database instance.
  - id: mysql_database
    type: STRING
    defaults: mysql
    description: Database name to connect to.
  - id: mysql_username
    type: STRING
    defaults: kestra_monitor
    description: MySQL monitoring username.
  - id: max_aborted_connects_threshold
    type: INT
    defaults: 10
    description: Maximum permissible aborted connections before alerting.

tasks:
  - id: query_aborted_connections
    type: io.kestra.plugin.jdbc.mysql.Query
    url: "jdbc:mysql://{{ inputs.mysql_host }}:{{ inputs.mysql_port }}/{{ inputs.mysql_database }}"
    username: "{{ inputs.mysql_username }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    sql: |
      SELECT 
        VARIABLE_NAME, 
        CAST(VARIABLE_VALUE AS UNSIGNED) AS METRIC_VALUE 
      FROM performance_schema.global_status 
      WHERE VARIABLE_NAME IN ('Aborted_connects', 'Aborted_clients');
    fetchType: FETCH

  - id: evaluate_connection_failures
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_aborted_connections.rows[1].METRIC_VALUE > inputs.max_aborted_connects_threshold }}"
    then:
      - id: alert_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *MySQL Connection Failure Alert*: Database {{ inputs.mysql_host }} reported {{ outputs.query_aborted_connections.rows[1].METRIC_VALUE }} aborted connections (threshold: {{ inputs.max_aborted_connects_threshold }}). Check for credential mismatches, firewall timeouts, or connection exhaustion."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *MySQL Sentinel Execution Failure*: Failed to query performance schema on {{ inputs.mysql_host }}."
      }

triggers:
  - id: scheduled_connects_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: MySQL Aborted Connects and Failed Authentication Sentinel
  shortDescription: Audits MySQL global status to detect surges in aborted client connections, network handshake drops, and authentication failures.
  description: |
    ## How it works
    This sentinel connects to MySQL using the JDBC plugin to query `Aborted_connects` and `Aborted_clients` metrics from `performance_schema.global_status`. It flags abnormal spikes in aborted handshakes caused by network dropouts, SSL negotiation errors, or credential brute-forcing.

    ## What you get
    - Proactive visibility into network drops and client connection failures.
    - Early warning before application connection pool thrashing overwhelms MySQL threads.
    - Automated Slack incident delivery indicating affected server endpoints and metric counts.

    ## Who it's for
    - Database administrators and platform engineers managing MySQL clusters.
    - Security teams tracking anomalous authentication failures across database tiers.

    ## Why orchestrate this with Kestra
    Kestra runs automated database observability jobs natively using JDBC connectivity, executing scheduled audits without intermediate monitoring agents.

    ## Prerequisites
    - MySQL database instance with `performance_schema` enabled.
    - Secrets `MYSQL_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure database host, port, and credentials.
    3. Run manually to check baseline aborted connections.

    ## How to extend
    - Query `performance_schema.host_cache` to identify the originating IP addresses of failed connections.
    - Automatically block persistent offending IP addresses via cloud security group updates.
    - Forward aborted client counts to Datadog or Prometheus.

    ## Links
    - [Kestra MySQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [MySQL Server Status Variables](https://dev.mysql.com/doc/refman/8.0/en/server-status-variables.html)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
