id: datadog-unmuted-critical-monitors-sentinel
namespace: company.team

inputs:
  - id: dd_site
    type: STRING
    defaults: "datadoghq.com"
    description: Datadog intake site (e.g. datadoghq.com or datadoghq.eu).
  - id: monitor_tags
    type: STRING
    defaults: "env:production"
    description: Tags to filter active production monitors.

tasks:
  - id: query_active_monitors
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Datadog Monitors API to detect unacknowledged active monitors in Alert state.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      DD_SITE: "{{ inputs.dd_site }}"
      MONITOR_TAGS: "{{ inputs.monitor_tags }}"
      DD_API_KEY: "{{ secret('DATADOG_API_KEY') }}"
      DD_APP_KEY: "{{ secret('DATADOG_APP_KEY') }}"
    outputFiles:
      - dd_monitors.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      site = os.environ.get("DD_SITE", "datadoghq.com")
      monitor_tags = os.environ.get("MONITOR_TAGS", "env:production")
      api_key = os.environ.get("DD_API_KEY")
      app_key = os.environ.get("DD_APP_KEY")

      if not api_key or not app_key:
          print("ERROR: DATADOG_API_KEY and DATADOG_APP_KEY secrets must be configured.", file=sys.stderr)
          sys.exit(1)

      url = f"https://api.{site}/api/v1/monitor"
      headers = {
          "DD-API-KEY": api_key,
          "DD-APPLICATION-KEY": app_key,
          "Accept": "application/json"
      }
      params = {
          "monitor_tags": monitor_tags,
          "with_downtimes": "false"
      }

      try:
          resp = requests.get(url, headers=headers, params=params, timeout=20)
          resp.raise_for_status()
          monitors = resp.json()
      except Exception as exc:
          print(f"ERROR querying Datadog monitors API: {exc}", file=sys.stderr)
          sys.exit(1)

      with open("dd_monitors.json", "w", encoding="utf-8") as f:
          json.dump(monitors, f, indent=2)

      unmuted_alerts = 0
      for m in monitors:
          if m.get("overall_state") == "Alert":
              silenced = m.get("options", {}).get("silenced") or {}
              if not silenced:
                  unmuted_alerts += 1

      print(f"Audited {len(monitors)} monitors. Found {unmuted_alerts} unmuted alerts.")

      Kestra.outputs({
          "unmuted_alerts": unmuted_alerts
      })

  - id: evaluate_unmuted_alerts
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_active_monitors.vars.unmuted_alerts > 0 }}"
    then:
      - id: notify_oncall_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#oncall-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "Datadog Unacknowledged Critical Monitor Alert",
                "text": "Datadog environment `{{ inputs.monitor_tags }}` has *{{ outputs.query_active_monitors.vars.unmuted_alerts }}* unmuted monitors in `Alert` state! Impact: Unacknowledged production incidents risk breaching client SLAs due to alert fatigue or missed on-call notifications.",
                "footer": "Kestra Incident Sentinel Datadog"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#oncall-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "Datadog Unmuted Critical Monitor Alert Fatigue Sentinel Pipeline Failure",
            "text": "Failed to query Datadog Monitors API for execution {{ execution.id }}. Verify Datadog API and Application keys.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Datadog monitors to detect unmuted active alerts lingering without engineer acknowledgment."
  metaTitle: Datadog Unmuted Critical Monitor Alert Fatigue Sentinel with Kestra
  title: Datadog Unmuted Critical Monitor Alert Fatigue Sentinel
  shortDescription: Audits Datadog monitors to detect unmuted active alerts lingering without engineer acknowledgment.
  description: |
    ## How it works
    This workflow queries the Datadog Monitors API (`GET /api/v1/monitor`) with tag filters and `with_downtimes=false`. It evaluates monitors reporting `overall_state == 'Alert'` where `options.silenced` is empty. When production alerts fire but remain unmuted and unacknowledged by on-call engineers, alert fatigue or notification delivery failures threaten SLA commitments. Slack is alerted with the unmuted alert count.

    ## What you get
    - Continuous escalation safety net for unacknowledged Datadog production alerts.
    - Prevents critical service incidents from being ignored due to alert fatigue.
    - Immediate Slack notification directly to secondary on-call escalation channels.

    ## Who it's for
    - Incident Commanders and SRE Leads guarding incident response SLAs.
    - Operations teams maintaining 24/7 on-call rotations.

    ## Why orchestrate this with Kestra
    - **Native REST API Execution**: Queries official Datadog APIs without external integration proxies.
    - **Scheduled Escalation**: Run every 15 minutes to guarantee that active alerts are reviewed.
    - **Multi-Site Compatibility**: Works seamlessly across US and EU Datadog sites.

    ## Prerequisites
    - Datadog API Key and Application Key.
    - Secrets `DATADOG_API_KEY`, `DATADOG_APP_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Set Datadog site and monitor tags.
    3. Run the workflow to inspect active unmuted monitors.

    ## How to extend
    - Automatically page secondary on-call schedules in PagerDuty or OpsGenie.
    - Include list of active monitor names and URLs in the Slack alert payload.

    ## Links
    - [Datadog Monitors API Documentation](https://docs.datadoghq.com/api/latest/monitors/)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
