    ## Prerequisites

    - A Kubernetes cluster reachable by the Kestra worker, working cluster DNS and HTTP access from inspection pods to the Service. Images must be available to cluster nodes.
    - Worker identity: create/get/list/watch/delete Pods, get `pods/log`, create/get `pods/exec` and list Events in the target namespace. Grant get/patch Services only for the selected Service using RBAC `resourceNames`.
    - The separate `reader_service_account`: get/list Services and Pods, Deployments and ReplicaSets in `apps` plus EndpointSlices in `discovery.k8s.io`. It needs no write permissions. Restrict who can edit this flow or create pods under privileged ServiceAccounts in the namespace.
    - An explicitly opted-in Service. Services with managed-by, Argo CD or Flux metadata are reported without repair; update their source manifest through the owning deployment process.

    ### Secrets

    | Secret | Purpose |
    | --- | --- |
    | `K8S_MASTER_URL` | HTTPS API URL reachable by Kestra. |
    | `K8S_TOKEN` | Worker bearer token with the permissions above. |
    | `K8S_CA_CERT_DATA` | Base64-encoded PEM CA bundle for API TLS verification. |
    | `SLACK_WEBHOOK_URL` | Read by `secret('SLACK_WEBHOOK_URL')` for failure alerts. |

    ### Inputs

    | Input | Default | Purpose |
    | --- | --- | --- |
    | `k8s_master_url`, `k8s_token`, `k8s_ca_cert_data` | Secrets above | Worker connection with certificate verification. |
    | `target_namespace` | `production` | Exactly one namespace. |
    | `service_name`, `deployment_name` | `web` | Explicit Service and Deployment mapping. |
    | `reader_service_account` | `selector-reader` | Read-only in-cluster API identity. |
    | `max_objects` | `100` | Per-kind inventory ceiling, 10 to 500; a truncated list fails. |
    | `max_replicas` | `10` | Eligible replica ceiling, 1 to 20; zero never qualifies. |
    | `verify_seconds` | `60` | Endpoint and HTTP recovery deadline, 5 to 180 seconds. |
    | `expected_status` | `200` | Required direct HTTP success status, 200 to 299. |
    | `probe_path` | `/` | Endpoint on the Service's sole port. |
    | `reader_image`, `sidecar_image` | Pinned Python 3.13 and BusyBox 1.36 images | Inspection and Kestra file transfer. |
    | `dry_run`, `auto_remediate` | `true`, `false` | Both must permit a write before approval is offered. |

    ## Quick start

    1. Import the flow, configure the secrets and create the worker and read-only ServiceAccounts with the permissions above.
    2. Choose a Service and Deployment in one namespace. Confirm their ownership, then annotate the Service with `kestra.io/selector-repair-deployment=<deployment_name>`. Leave manifest-managed Services under their own controller.
    3. Run with the safe defaults and explicit target inputs. Read `inspect`'s verdict and `plan.json`; confirm the proposed Deployment selector identifies the intended backend.
    4. Set `auto_remediate=true` and `dry_run=false` for an eligible target. Review the saved plan and approve the Pause. A changed target fails before patching.
    5. Require successful `prove_traffic` output. Run again to confirm the already-correct selector still serves traffic. Keep the schedule disabled until namespace permissions and the chosen probe path are reviewed.

    ## How to extend

    Use a dedicated HTTP health path that exercises a dependency required by callers. For a manifest-managed Service, apply the equivalent selector change to its source through the existing release process, then use the read-only verification path.

    Limits: one Service and one stable Deployment per execution; no matchExpressions, headless, external, multi-port, dual-stack or non-HTTP Services. Flow concurrency queues executions of this flow only. The Service patch is conditional and atomic; Kubernetes cannot atomically lock the Deployment and Service together, so a workload change after the final read can still occur. Verification fails if identities or protected state change. Writes have no automatic retry. If patching succeeds but verification fails or the execution is interrupted, the selector remains in place and the next run re-reads it and probes traffic without another patch. No automatic rollback restores the broken selector; retain `plan.json` and use a fresh UID/resourceVersion-conditional patch if an operator chooses rollback. A successful namespace-local probe does not prove ingress, NetworkPolicy paths from other clients or every backend response.

