id: k8s-service-selector-drift-endpoint-repair-guard
namespace: company.team
description: Repair an explicitly mapped Service selector after label drift, then require ready endpoints and an in-cluster
  HTTP response.
concurrency:
  limit: 1
  behavior: QUEUE
inputs:
- id: k8s_master_url
  type: STRING
  defaults: "{{ secret('K8S_MASTER_URL') }}"
- id: k8s_token
  type: STRING
  defaults: "{{ secret('K8S_TOKEN') }}"
- id: k8s_ca_cert_data
  type: STRING
  defaults: "{{ secret('K8S_CA_CERT_DATA') }}"
- id: target_namespace
  type: STRING
  defaults: production
- id: service_name
  type: STRING
  defaults: web
  description: One opted-in ClusterIP Service with a single HTTP port.
- id: deployment_name
  type: STRING
  defaults: web
  description: The Deployment named in the Service opt-in annotation.
- id: reader_service_account
  type: STRING
  defaults: selector-reader
  description: Read-only namespace ServiceAccount used by inspection pods.
- id: max_objects
  type: INT
  defaults: 100
  description: Maximum objects of each kind read in the namespace.
  min: 10
  max: 500
- id: max_replicas
  type: INT
  defaults: 10
  min: 1
  max: 20
- id: verify_seconds
  type: INT
  defaults: 60
  min: 5
  max: 180
- id: expected_status
  type: INT
  defaults: 200
  min: 200
  max: 299
- id: probe_path
  type: STRING
  defaults: /
  description: HTTP path served on the Service port, including any query string.
  validator: '^/\S*$'
- id: reader_image
  type: STRING
  defaults: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
- id: sidecar_image
  type: STRING
  defaults: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
- id: dry_run
  type: BOOL
  defaults: true
- id: auto_remediate
  type: BOOL
  defaults: false
tasks:
- id: inspect
  type: io.kestra.plugin.kubernetes.core.PodCreate
  connection:
    masterUrl: '{{ inputs.k8s_master_url }}'
    oauthToken: '{{ inputs.k8s_token }}'
    caCertData: '{{ inputs.k8s_ca_cert_data }}'
  namespace: '{{ inputs.target_namespace }}'
  waitUntilRunning: PT90S
  waitRunning: PT4M
  waitForLogInterval: PT1S
  timeout: PT6M
  fileSidecar:
    image: '{{ inputs.sidecar_image }}'
  inputFiles:
    guard.py: |
      import hashlib
      import json
      import os
      from pathlib import Path
      import ssl
      import sys
      import time
      import urllib.error
      import urllib.parse
      import urllib.request

      ROOT = Path('/kestra/working-dir')
      NS, SERVICE, DEPLOY = (os.environ[k] for k in ['NAMESPACE', 'SERVICE', 'DEPLOYMENT'])
      BOUND = int(os.environ['MAX_OBJECTS'])
      SA = Path('/var/run/secrets/kubernetes.io/serviceaccount')
      TOKEN = (SA / 'token').read_text().strip()
      CTX = ssl.create_default_context(cafile=str(SA / 'ca.crt'))
      BASE = 'https://' + os.environ['KUBERNETES_SERVICE_HOST'] + ':' + os.environ['KUBERNETES_SERVICE_PORT_HTTPS']
      API = '/api/v1/namespaces/' + NS
      APPS = '/apis/apps/v1/namespaces/' + NS
      DISCOVERY = '/apis/discovery.k8s.io/v1/namespaces/' + NS
      OPT_IN = 'kestra.io/selector-repair-deployment'
      HOLD = 'kestra.io/hold-selector-repair'


      def get(path):
          req = urllib.request.Request(BASE + path, headers={'Authorization': 'Bearer ' + TOKEN})
          with urllib.request.urlopen(req, context=CTX, timeout=8) as response:
              return json.load(response)


      def listing(path, selector=None):
          query = {'limit': BOUND + 1}
          if selector:
              query['labelSelector'] = selector
          data = get(path + '?' + urllib.parse.urlencode(query))
          if data.get('metadata', {}).get('continue') or len(data['items']) > BOUND:
              raise RuntimeError('Inventory exceeds max_objects: ' + path)
          return data['items']


      def owner(obj, uid):
          return any(o.get('uid') == uid and o.get('controller') is True
                     for o in obj['metadata'].get('ownerReferences', []))


      def matches(pod, selector):
          return bool(selector) and all(pod['metadata'].get('labels', {}).get(k) == v
                                        for k, v in selector.items())


      def ready(pod):
          return (not pod['metadata'].get('deletionTimestamp')
                  and pod.get('status', {}).get('phase') == 'Running'
                  and any(c['type'] == 'Ready' and c['status'] == 'True'
                          for c in pod.get('status', {}).get('conditions', [])))


      def snapshot(obj):
          meta = obj['metadata']
          return {k: meta.get(k) for k in ['uid', 'generation', 'annotations', 'labels', 'deletionTimestamp']} | {'spec': obj['spec']}


      def inspect():
          service = get(API + '/services/' + SERVICE)
          deploy = get(APPS + '/deployments/' + DEPLOY)
          pods = listing(API + '/pods')
          sets = listing(APPS + '/replicasets')
          slices = listing(DISCOVERY + '/endpointslices', 'kubernetes.io/service-name=' + SERVICE)
          spec, meta = service['spec'], service['metadata']
          ds, status = deploy['spec'], deploy.get('status', {})
          desired = ds.get('selector', {}).get('matchLabels', {})
          replicas = ds.get('replicas', 1)
          set_uids = {r['metadata']['uid'] for r in sets if owner(r, deploy['metadata']['uid'])}
          selected = [p for p in pods if matches(p, desired)]
          owned = [p for p in selected if any(owner(p, uid) for uid in set_uids)]
          addresses = [e for s in slices for e in (s.get('endpoints') or [])
                       if e.get('conditions', {}).get('ready') is True
                       and not e.get('conditions', {}).get('terminating', False)]
          annotations = meta.get('annotations', {})
          managed = meta.get('labels', {})
          if annotations.get(OPT_IN) != DEPLOY:
              verdict = 'not_opted_in'
          elif HOLD in annotations:
              verdict = 'protected'
          elif ('app.kubernetes.io/managed-by' in managed
                or any(k.startswith(('argocd.argoproj.io/', 'kustomize.toolkit.fluxcd.io/', 'helm.toolkit.fluxcd.io/'))
                       for k in list(managed) + list(annotations))):
              verdict = 'externally_managed'
          elif meta.get('deletionTimestamp') or deploy['metadata'].get('deletionTimestamp'):
              verdict = 'deleting'
          elif (spec.get('type', 'ClusterIP') != 'ClusterIP' or spec.get('clusterIP') in [None, 'None']
                or spec.get('publishNotReadyAddresses') or len(spec.get('ipFamilies', [])) != 1
                or len(spec.get('ports', [])) != 1 or spec['ports'][0].get('protocol', 'TCP') != 'TCP'):
              verdict = 'unsupported_service'
          elif not desired or ds['selector'].get('matchExpressions') or not spec.get('selector'):
              verdict = 'unsupported_selector'
          elif replicas < 1 or replicas > int(os.environ['MAX_REPLICAS']):
              verdict = 'replica_bound'
          elif (ds.get('paused') or status.get('observedGeneration') != deploy['metadata']['generation']
                or any(status.get(k, 0) != replicas for k in ['replicas', 'updatedReplicas', 'readyReplicas', 'availableReplicas'])):
              verdict = 'deployment_not_stable'
          elif len(owned) != replicas or len(selected) != replicas or not all(ready(p) for p in owned):
              verdict = 'ambiguous_or_unready_pods'
          elif any(not owner(s, meta['uid']) for s in slices):
              verdict = 'unowned_endpointslice'
          elif spec['selector'] == desired:
              verdict = 'selector_already_correct'
          elif addresses:
              verdict = 'service_has_ready_endpoints'
          elif any(matches(p, spec['selector']) for p in pods):
              verdict = 'old_selector_still_selects_pods'
          else:
              verdict = 'selector_drift'
          plan = {'verdict': verdict, 'service': snapshot(service), 'deployment': snapshot(deploy),
                  'desired_selector': desired, 'pod_uids': sorted(p['metadata']['uid'] for p in owned),
                  'ready_endpoint_count': len(addresses), 'replicas': replicas}
          return plan, service, addresses


      def save(name, value):
          (ROOT / name).write_text(json.dumps(value, sort_keys=True))


      class NoRedirect(urllib.request.HTTPRedirectHandler):
          def redirect_request(self, req, fp, code, msg, headers, newurl):
              return None


      mode = sys.argv[1]
      plan, service, endpoints = inspect()
      if mode == 'inspect':
          save('plan.json', plan)
          print(json.dumps(plan), flush=True)
      elif mode == 'recheck':
          approved = json.loads((ROOT / 'approved.json').read_text())
          if plan['verdict'] != 'selector_drift':
              raise RuntimeError('Target no longer eligible: ' + plan['verdict'])
          for field in ['service', 'deployment', 'desired_selector', 'pod_uids', 'replicas']:
              if plan[field] != approved[field]:
                  raise RuntimeError('Approved snapshot changed: ' + field)
          patch = [{'op': 'test', 'path': '/metadata/uid', 'value': service['metadata']['uid']},
                   {'op': 'test', 'path': '/metadata/resourceVersion', 'value': service['metadata']['resourceVersion']},
                   {'op': 'test', 'path': '/spec', 'value': service['spec']},
                   {'op': 'replace', 'path': '/spec/selector', 'value': plan['desired_selector']}]
          save('patch.json', patch)
          print('Approved target is still eligible; conditional Service patch prepared.', flush=True)
      elif mode == 'verify':
          approved = json.loads((ROOT / 'approved.json').read_text())
          deadline = time.monotonic() + int(os.environ['VERIFY_SECONDS'])
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          expected_spec = dict(approved['service']['spec'], selector=approved['desired_selector'])
          while True:
              plan, service, endpoints = inspect()
              expected_service = dict(approved['service'], spec=expected_spec)
              if plan['service'] != expected_service or plan['deployment'] != approved['deployment']:
                  raise RuntimeError('Target or protected state changed after approval')
              if plan['verdict'] != 'selector_already_correct' or plan['pod_uids'] != approved['pod_uids']:
                  raise RuntimeError('Workload identity or eligibility changed after patch')
              endpoint_uids = {e.get('targetRef', {}).get('uid') for e in endpoints}
              result = {'ready_endpoints': len(endpoints), 'endpoint_pod_uids': sorted(str(u) for u in endpoint_uids),
                        'expected_status': int(os.environ['EXPECTED_STATUS']), 'http_status': None}
              if len(endpoints) == approved['replicas'] and endpoint_uids == set(approved['pod_uids']):
                  url = 'http://' + SERVICE + '.' + NS + '.svc:' + str(service['spec']['ports'][0]['port']) + os.environ['PROBE_PATH']
                  try:
                      with opener.open(url, timeout=4) as response:
                          result['http_status'] = response.status
                          result['body_sha256'] = hashlib.sha256(response.read(65536)).hexdigest()
                  except urllib.error.HTTPError as exc:
                      result['http_status'] = exc.code
                  except (OSError, urllib.error.URLError) as exc:
                      result['error'] = type(exc).__name__
                  if result['http_status'] == result['expected_status']:
                      save('recovery.json', result)
                      print('Traffic recovered: ' + json.dumps(result), flush=True)
                      break
              if time.monotonic() >= deadline:
                  save('recovery.json', result)
                  raise RuntimeError('Recovery not observed within verify_seconds: ' + json.dumps(result))
              time.sleep(2)
      else:
          raise RuntimeError('Unknown mode')
  outputFiles:
  - plan.json
  - guard.py
  spec:
    serviceAccountName: '{{ inputs.reader_service_account }}'
    restartPolicy: Never
    activeDeadlineSeconds: 240
    containers:
    - name: inspector
      image: '{{ inputs.reader_image }}'
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
      env:
      - name: NAMESPACE
        value: '{{ inputs.target_namespace }}'
      - name: SERVICE
        value: '{{ inputs.service_name }}'
      - name: DEPLOYMENT
        value: '{{ inputs.deployment_name }}'
      - name: MAX_OBJECTS
        value: '{{ inputs.max_objects }}'
      - name: MAX_REPLICAS
        value: '{{ inputs.max_replicas }}'
      - name: VERIFY_SECONDS
        value: '{{ inputs.verify_seconds }}'
      - name: EXPECTED_STATUS
        value: '{{ inputs.expected_status }}'
      - name: PROBE_PATH
        value: '{{ inputs.probe_path }}'
      command:
      - python
      - /kestra/working-dir/guard.py
      - inspect
- id: repair_requested
  type: io.kestra.plugin.core.flow.If
  condition: '{{ (read(outputs.inspect.outputFiles["plan.json"]) | jq(".verdict") | first) == "selector_drift" and inputs.auto_remediate
    and not inputs.dry_run }}'
  then:
  - id: approve
    type: io.kestra.plugin.core.flow.Pause
    timeout: PT30M
    onResume:
    - id: approved
      type: BOOL
      defaults: false
      description: Approve replacing only this Service selector with the named Deployment matchLabels.
  - id: approved_repair
    type: io.kestra.plugin.core.flow.If
    condition: '{{ outputs.approve.onResume.approved ?? false }}'
    then:
    - id: recheck
      type: io.kestra.plugin.kubernetes.core.PodCreate
      connection:
        masterUrl: '{{ inputs.k8s_master_url }}'
        oauthToken: '{{ inputs.k8s_token }}'
        caCertData: '{{ inputs.k8s_ca_cert_data }}'
      namespace: '{{ inputs.target_namespace }}'
      waitUntilRunning: PT90S
      waitRunning: PT4M
      waitForLogInterval: PT1S
      timeout: PT6M
      fileSidecar:
        image: '{{ inputs.sidecar_image }}'
      inputFiles:
        guard.py: '{{ read(outputs.inspect.outputFiles["guard.py"]) }}'
        approved.json: '{{ read(outputs.inspect.outputFiles["plan.json"]) }}'
      outputFiles:
      - patch.json
      spec:
        serviceAccountName: '{{ inputs.reader_service_account }}'
        restartPolicy: Never
        activeDeadlineSeconds: 240
        containers:
        - name: inspector
          image: '{{ inputs.reader_image }}'
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          env:
          - name: NAMESPACE
            value: '{{ inputs.target_namespace }}'
          - name: SERVICE
            value: '{{ inputs.service_name }}'
          - name: DEPLOYMENT
            value: '{{ inputs.deployment_name }}'
          - name: MAX_OBJECTS
            value: '{{ inputs.max_objects }}'
          - name: MAX_REPLICAS
            value: '{{ inputs.max_replicas }}'
          - name: VERIFY_SECONDS
            value: '{{ inputs.verify_seconds }}'
          - name: EXPECTED_STATUS
            value: '{{ inputs.expected_status }}'
          - name: PROBE_PATH
            value: '{{ inputs.probe_path }}'
          command:
          - python
          - /kestra/working-dir/guard.py
          - recheck
    - id: repair_selector
      type: io.kestra.plugin.kubernetes.kubectl.Patch
      connection:
        masterUrl: '{{ inputs.k8s_master_url }}'
        oauthToken: '{{ inputs.k8s_token }}'
        caCertData: '{{ inputs.k8s_ca_cert_data }}'
      namespace: '{{ inputs.target_namespace }}'
      resourceType: Service
      resourceName: '{{ inputs.service_name }}'
      patchStrategy: JSON_PATCH
      timeout: PT30S
      patch: '{{ read(outputs.recheck.outputFiles["patch.json"]) }}'
    - id: prove_traffic
      type: io.kestra.plugin.kubernetes.core.PodCreate
      connection:
        masterUrl: '{{ inputs.k8s_master_url }}'
        oauthToken: '{{ inputs.k8s_token }}'
        caCertData: '{{ inputs.k8s_ca_cert_data }}'
      namespace: '{{ inputs.target_namespace }}'
      waitUntilRunning: PT90S
      waitRunning: PT4M
      waitForLogInterval: PT1S
      timeout: PT6M
      fileSidecar:
        image: '{{ inputs.sidecar_image }}'
      inputFiles:
        guard.py: '{{ read(outputs.inspect.outputFiles["guard.py"]) }}'
        approved.json: '{{ read(outputs.inspect.outputFiles["plan.json"]) }}'
      outputFiles:
      - recovery.json
      spec:
        serviceAccountName: '{{ inputs.reader_service_account }}'
        restartPolicy: Never
        activeDeadlineSeconds: 240
        containers:
        - name: inspector
          image: '{{ inputs.reader_image }}'
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          env:
          - name: NAMESPACE
            value: '{{ inputs.target_namespace }}'
          - name: SERVICE
            value: '{{ inputs.service_name }}'
          - name: DEPLOYMENT
            value: '{{ inputs.deployment_name }}'
          - name: MAX_OBJECTS
            value: '{{ inputs.max_objects }}'
          - name: MAX_REPLICAS
            value: '{{ inputs.max_replicas }}'
          - name: VERIFY_SECONDS
            value: '{{ inputs.verify_seconds }}'
          - name: EXPECTED_STATUS
            value: '{{ inputs.expected_status }}'
          - name: PROBE_PATH
            value: '{{ inputs.probe_path }}'
          command:
          - python
          - /kestra/working-dir/guard.py
          - verify
- id: verify_existing_route
  type: io.kestra.plugin.core.flow.If
  condition: '{{ (read(outputs.inspect.outputFiles["plan.json"]) | jq(".verdict") | first) == "selector_already_correct" }}'
  then:
  - id: prove_existing_traffic
    type: io.kestra.plugin.kubernetes.core.PodCreate
    connection:
      masterUrl: '{{ inputs.k8s_master_url }}'
      oauthToken: '{{ inputs.k8s_token }}'
      caCertData: '{{ inputs.k8s_ca_cert_data }}'
    namespace: '{{ inputs.target_namespace }}'
    waitUntilRunning: PT90S
    waitRunning: PT4M
    waitForLogInterval: PT1S
    timeout: PT6M
    fileSidecar:
      image: '{{ inputs.sidecar_image }}'
    inputFiles:
      guard.py: '{{ read(outputs.inspect.outputFiles["guard.py"]) }}'
      approved.json: '{{ read(outputs.inspect.outputFiles["plan.json"]) }}'
    outputFiles:
    - recovery.json
    spec:
      serviceAccountName: '{{ inputs.reader_service_account }}'
      restartPolicy: Never
      activeDeadlineSeconds: 240
      containers:
      - name: inspector
        image: '{{ inputs.reader_image }}'
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        env:
        - name: NAMESPACE
          value: '{{ inputs.target_namespace }}'
        - name: SERVICE
          value: '{{ inputs.service_name }}'
        - name: DEPLOYMENT
          value: '{{ inputs.deployment_name }}'
        - name: MAX_OBJECTS
          value: '{{ inputs.max_objects }}'
        - name: MAX_REPLICAS
          value: '{{ inputs.max_replicas }}'
        - name: VERIFY_SECONDS
          value: '{{ inputs.verify_seconds }}'
        - name: EXPECTED_STATUS
          value: '{{ inputs.expected_status }}'
        - name: PROBE_PATH
          value: '{{ inputs.probe_path }}'
        command:
        - python
        - /kestra/working-dir/guard.py
        - verify
errors:
- id: notify_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: "{{ secret('SLACK_WEBHOOK_URL') }}"
  payload: '{"text":"Service selector repair failed. Review the approved snapshot and traffic verification in execution {{
    execution.id }} before retrying."}'
triggers:
- id: inspect_every_ten_minutes
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/10 * * * *'
  disabled: true
  inputs:
    auto_remediate: false
    dry_run: true
extend:
  title: Repair Kubernetes Service selector drift and prove traffic recovers
  metaTitle: Repair Kubernetes Service selector drift with an HTTP recovery check
  shortDescription: Restore a stranded Service selector behind approval and require ready EndpointSlices plus a successful
    in-cluster HTTP probe.
  metaDescription: Repair Kubernetes Service selector drift with approval, conditional patching and an in-cluster HTTP probe
    that proves traffic reaches Ready pods.
  description: |
    ## Safety

    A wrong Service selector can send requests to the wrong workload. This flow repairs one explicitly mapped Service and never guesses a Deployment from similar names.

    | Guard | What it stops |
    | --- | --- |
    | Service annotation `kestra.io/selector-repair-deployment=<deployment_name>` | Repairing a Service without an explicit owner-approved mapping. |
    | `kestra.io/hold-selector-repair` annotation present | Changing a Service intentionally isolated during an incident. |
    | Managed-by, Argo CD or Flux metadata | Fighting a manifest controller. Change its source manifest instead. |
    | One ordinary ClusterIP Service with one TCP port and one IP family | Applying an HTTP repair to headless, external, dual-stack or multi-port Services. |
    | Stable Deployment, 1 to `max_replicas` replicas and exact pod ownership | Confusing zero replicas, rollout lag or another workload with selector drift. |
    | No Ready endpoints and no pods matching the old selector | Replacing a selector that still serves or selects a workload. |
    | Safe defaults plus explicit approval | A scheduled inspection or dry run changing routing. |
    | Fresh eligibility read and UID/resourceVersion/spec JSON Patch tests | Applying an approved plan after the Service changes or is recreated. |
    | Endpoint ownership and direct HTTP status verification | Reporting recovery from a selector readback alone or following a redirect to another server. |

    ## How it works

    1. `inspect` (`io.kestra.plugin.kubernetes.core.PodCreate`) runs a bounded read-only API inspection inside the namespace. It reads the Service, Deployment, ReplicaSets, Pods and EndpointSlices. Plugin 1.11.4's `kubectl.Get` drops Service specifications and EndpointSlice addresses, so this pod preserves the full API objects needed for the comparison.
    2. The detector requires every pod selected by the Deployment's nonempty `matchLabels` to belong to its ReplicaSets and be Running and Ready. The Deployment must have exactly its desired updated, ready and available replicas. Drift qualifies only when the existing Service selector selects no pods and the Service has no Ready endpoints. The proposed selector is the Deployment's stable `matchLabels`, never a rollout hash or a guessed pod label.
    3. `repair_requested` enters `approve` (`io.kestra.plugin.core.flow.Pause`) only with `auto_remediate=true` and `dry_run=false`. Approval expires after 30 minutes. Declining completes without a write.
    4. `recheck` (`PodCreate`) repeats eligibility and compares the approved Service, Deployment and pod identities. `repair_selector` (`io.kestra.plugin.kubernetes.kubectl.Patch`) tests the Service UID, current resourceVersion and full spec atomically, then replaces only `/spec/selector`.
    5. `prove_traffic` (`PodCreate`) requires one Ready EndpointSlice endpoint per approved pod plus the expected HTTP status from `http://<service>.<namespace>.svc:<port><probe_path>`. It checks that the UID, ports, ClusterIP and remaining Service spec are unchanged. Redirects are rejected. `prove_existing_traffic` also checks an already-correct selector, so a retry after a patch still proves traffic.
    6. Any API, write or verification failure fails the execution and sends a Slack alert. The disabled ten-minute schedule forces safe inputs.

    ## What you get

    - An explicit verdict separating selector drift from healthy routing, zero replicas, unready workloads and ambiguous ownership.
    - The approved original selector and conditional patch in Kestra storage for incident review or a conditional manual rollback.
    - Recovery evidence containing Ready endpoint identities, the HTTP status and a response-body SHA-256.

    ## Who it's for

    Platform teams whose pods stay healthy after a routing label rename while requests to their Service fail.

    ## Why orchestrate this with Kestra

    Keep the diagnosis, approval, conditional routing change and independent in-cluster recovery check in one execution. A workload restart cannot repair a selector that matches no pods.

    ## Tested end to end

    Tested on Kestra 2.0.5 with Kubernetes plugin 1.11.4, k3s v1.31.5+k3s1 and nginx 1.27.4. Two nginx pods carried `app=web,route=new` while the Service still selected `route=old`. Independent `kubectl get endpointslices` reads measured **0 to 2 Ready endpoints**. `kubectl exec deployment/web -- wget` changed from **connection refused, exit 1** to **HTTP 200, exit 0**. Both original pod UIDs, the Service UID, ClusterIP and ports were preserved. A second fresh cluster reproduced recovery and stale-approval refusal.

    | Case | Execution | Result |
    | --- | --- | --- |
    | Healthy routing | `3v4zxUngAJuz4qG8hQWTqx` | SUCCESS; no patch, HTTP 200 |
    | Selector drift, dry run | `6YwPIgMx1OcVRlDsy10oBg` | SUCCESS; selector unchanged, 0 Ready endpoints |
    | Approval declined | `2DbqPybOKGbq5rxUb9mfol` | SUCCESS; no patch |
    | Approved repair | `dRWBwF7iFkH8tBD6k6ZY7` | SUCCESS; 0 to 2 Ready endpoints, HTTP 200 |
    | Repeat after repair | `6AZ0wWJQzefLyocjbVKyqO` | SUCCESS; no patch, HTTP 200 |
    | RBAC refuses patch | `4ASkrk2QVehtbR6Aec0uhw` | FAILED as required; selector unchanged |
    | Hold added during approval | `4jSScLWlwzmTW67yoJMdum` | FAILED as required before patch |
    | Existing hold | `2teROulfAMGdf9bFpbywGr` | SUCCESS; no patch |
    | Manifest-managed Service | `1a9Q3DLnwkjkYbNHjVbiJ5` | SUCCESS; no patch |
