id: aws-ephemeral-sandbox-finops
namespace: enterprise.infrastructure
description: "Provisions an ephemeral AWS sandbox via Terraform, triggered by an event, waits for a TTL, and conditionally destroys it."

triggers:
  - id: slack_webhook_trigger
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('WEBHOOK_KEY') }}"
    description: "Allows the workflow to be triggered via an external HTTP POST event."

inputs:
  - id: environment_name
    type: STRING
    description: "Name of the temporary AWS environment (e.g., pr-432-test)"
  - id: ttl_duration
    type: DURATION
    defaults: "PT4H"
    description: "Time-To-Live before automatic destruction (e.g. PT4H = 4 hours)"
  - id: enable_auto_destroy
    type: BOOLEAN
    defaults: true
    description: "Set to false if you want to bypass the automatic teardown."
  - id: bucket
    type: STRING
    defaults: kestra-us
  - id: region
    type: STRING
    defaults: us-east-1
   

tasks:
  - id: notify_creation_started
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: '{"text": "⏳ Provisioning AWS sandbox `{{ inputs.environment_name }}`..."}'

  - id: setup_workspace
    type: io.kestra.core.tasks.flows.WorkingDirectory
    tasks:
      - id: clone_repo
        type: io.kestra.plugin.git.Clone
        url: https://github.com/your-org/terraform-aws-sandbox.git
        branch: main

      - id: terraform_apply
        type: io.kestra.plugin.terraform.cli.TerraformCLI
        beforeCommands:
          - terraform init
        commands:
          - terraform apply -auto-approve -var="env_name={{ inputs.environment_name }}"
        env:
		  TF_VAR_region: "{{ inputs.region }}"
          TF_VAR_bucket: "{{ inputs.bucket }}"
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ inputs.region }}"
        
  - id: notify_creation_done
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: '{"text": " Your AWS sandbox `{{ inputs.environment_name }}` is ready! TTL is set to {{ inputs.ttl_duration }}."}'

  - id: wait_ttl
    type: io.kestra.core.tasks.flows.Pause
    delay: "{{ inputs.ttl_duration }}"

  - id: conditional_teardown
    type: io.kestra.core.tasks.flows.If
    condition: "{{ inputs.enable_auto_destroy }}"
    then:
      - id: teardown_workspace
        type: io.kestra.core.tasks.flows.WorkingDirectory
        tasks:
          - id: clone_repo_again
            type: io.kestra.plugin.git.Clone
            url: https://github.com/your-org/terraform-aws-sandbox.git
            branch: main

          - id: terraform_destroy
            type: io.kestra.plugin.terraform.cli.TerraformCLI
            beforeCommands:
              - terraform init
            commands:
              - terraform destroy -auto-approve -var="env_name={{ inputs.environment_name }}"
            env:
			  TF_VAR_region: "{{ inputs.region }}"
              TF_VAR_bucket: "{{ inputs.bucket }}"
              AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
              AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
              AWS_DEFAULT_REGION: "{{ inputs.region }}"

      - id: notify_destroyed
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: '{"text": " AWS sandbox `{{ inputs.environment_name }}` has been successfully destroyed based on TTL rules."}'
