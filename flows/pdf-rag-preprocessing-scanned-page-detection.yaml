id: pdf-rag-preprocessing-scanned-page-detection
namespace: company.ai

inputs:
  - id: pdf_url
    type: URI
    displayName: PDF URL
    description: PDF to prepare when the flow is run manually. Webhook calls pass `url` in the JSON body instead.
    defaults: https://arxiv.org/pdf/1706.03762

  - id: chunk_pages
    type: INT
    displayName: Pages per chunk
    defaults: 5

  - id: min_chars_per_page
    type: INT
    displayName: Minimum characters for a text page
    description: A page whose extracted text (whitespace removed) is shorter than this is treated as scanned and rendered to PNG for OCR.
    defaults: 40

  - id: max_pages
    type: INT
    displayName: Maximum pages
    defaults: 300

variables:
  source_url: "{{ trigger.body.url ?? inputs.pdf_url }}"

tasks:
  - id: download
    type: io.kestra.plugin.core.http.Download
    description: Fetches the PDF from the webhook body `url`, or from the `pdf_url` input on a manual run.
    uri: "{{ render(vars.source_url) }}"

  - id: metadata
    type: io.kestra.plugin.pdfbox.metadata.Read
    description: Reads the page count and document properties before any heavy work.
    from: "{{ outputs.download.uri }}"

  - id: page_limit_guard
    type: io.kestra.plugin.core.execution.Fail
    description: Stops oversized documents before text extraction and rendering.
    condition: "{{ outputs.metadata.pageCount > inputs.max_pages }}"
    errorMessage: "{{ render(vars.source_url) }} has {{ outputs.metadata.pageCount }} pages, above the limit of {{ inputs.max_pages }}."

  - id: extract_text
    type: io.kestra.plugin.pdfbox.text.Extract
    description: Extracts the text of every page in reading order.
    from: "{{ outputs.download.uri }}"
    perPage: true
    sortByPosition: true
    maxPages: "{{ inputs.max_pages }}"

  - id: classify_pages
    type: io.kestra.plugin.core.output.OutputValues
    description: Lists the 1-based numbers of pages whose text, whitespace removed, is shorter than `min_chars_per_page`, i.e. pages with no usable text layer.
    values:
      scanned: "{{ outputs.extract_text.pages | jq('[to_entries[] | select((.value | gsub(\"\\\\s\"; \"\") | length) < ' ~ inputs.min_chars_per_page ~ ') | .key + 1]') | first | toJson }}"

  - id: ocr_handoff
    type: io.kestra.plugin.core.flow.If
    description: Renders only the scanned pages to 300 DPI grayscale PNGs, ready for an OCR step; text pages are skipped.
    condition: "{{ fromJson(outputs.classify_pages.values.scanned) | length > 0 }}"
    then:
      - id: render_scanned_pages
        type: io.kestra.plugin.core.flow.Loop
        values: "{{ fromJson(outputs.classify_pages.values.scanned) }}"
        tasks:
          - id: render_page
            type: io.kestra.plugin.pdfbox.image.Render
            from: "{{ outputs.download.uri }}"
            startPage: "{{ item.value }}"
            endPage: "{{ item.value }}"
            dpi: 300
            grayscale: true

  - id: split_chunks
    type: io.kestra.plugin.pdfbox.document.Split
    description: Splits the PDF into chunks of `chunk_pages` pages for parallel embedding or indexing.
    from: "{{ outputs.download.uri }}"
    everyNPages: "{{ inputs.chunk_pages }}"

  - id: stamp_metadata
    type: io.kestra.plugin.pdfbox.metadata.Update
    description: Writes the processing result into the PDF's own metadata, so the file carries its lineage.
    from: "{{ outputs.download.uri }}"
    keywords: rag-ready
    custom:
      kestra_execution: "{{ execution.id }}"
      source_url: "{{ render(vars.source_url) }}"
      scanned_pages: "{{ fromJson(outputs.classify_pages.values.scanned) | join(',') }}"
      chunk_count: "{{ outputs.split_chunks.count }}"

  - id: manifest
    type: io.kestra.plugin.core.output.OutputValues
    description: Publishes a manifest of the run for downstream flows.
    values:
      source_url: "{{ render(vars.source_url) }}"
      title: "{{ outputs.metadata.title ?? '' }}"
      page_count: "{{ outputs.metadata.pageCount }}"
      text_pages: "{{ outputs.metadata.pageCount - (fromJson(outputs.classify_pages.values.scanned) | length) }}"
      scanned_pages: "{{ fromJson(outputs.classify_pages.values.scanned) }}"
      chunks: "{{ outputs.split_chunks.uris }}"
      stamped_pdf: "{{ outputs.stamp_metadata.uri }}"

triggers:
  - id: pdf_arrived
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('WEBHOOK_KEY') }}"

extend:
  title: Prepare PDFs for RAG with Scanned-Page Detection, OCR Handoff and Chunking
  metaTitle: Prepare PDFs for RAG with PDFBox and Kestra
  metaDescription: Extract per-page text from PDFs, detect scanned pages and render them for OCR, split into chunks, and stamp lineage metadata with Kestra and PDFBox.
  shortDescription: Turn any PDF into RAG-ready pieces. Extract text per page, render scanned pages for OCR, split into chunks, and stamp the file with its processing lineage.
  description: |
    RAG pipelines quietly lose content when a PDF mixes real text with scanned pages. Text extraction
    returns an empty string for an image-only page, so the page never reaches the embeddings and nobody notices.
    This flow prepares each PDF with Apache PDFBox. It sends text pages straight on, routes only the scanned
    pages to OCR, splits the document into chunks, and records what it did in the PDF's own metadata.

    ## How it works

    1. **Trigger**: a webhook call with `{"url": "https://..."}` in its JSON body starts the flow. A manual
       run uses the `pdf_url` input, which defaults to the "Attention Is All You Need" paper on arXiv.
    2. **Download and inspect**: `download` fetches the file, and `metadata` reads its page count.
       `page_limit_guard` fails the execution with a clear message when the document has more than `max_pages` pages.
    3. **Per-page extraction**: `extract_text` pulls the text of every page in reading order.
    4. **Scanned-page detection**: `classify_pages` lists the pages whose text, whitespace removed, is shorter
       than `min_chars_per_page`. Those pages have no usable text layer.
    5. **OCR handoff**: the `ocr_handoff` `If` runs only when scanned pages exist, and its `Loop` renders each
       of them to a 300 DPI grayscale PNG. Text pages are never rasterized.
    6. **Chunking**: `split_chunks` cuts the PDF into files of `chunk_pages` pages for parallel embedding.
    7. **Lineage**: `stamp_metadata` writes the execution ID, source URL, scanned pages and chunk count into
       the PDF's custom properties, and `manifest` publishes the same summary as flow outputs.

    ## What you get

    - Scanned pages flagged by number instead of silently indexed as empty text.
    - OCR-ready images for those pages only, which keeps OCR cost proportional to the problem.
    - Page-range chunks and a manifest of their URIs, ready for an embedding or vector store flow.
    - A stamped PDF that records which execution prepared it, and a hard page limit that protects workers.

    ## Who it's for

    - AI engineers building retrieval pipelines over reports, papers, contracts or manuals.
    - Data engineers ingesting document drops from partners, scanners or object storage.
    - Platform teams that need document preprocessing with an audit trail.

    ## Why orchestrate this with Kestra

    Each step is a declarative PDFBox task, so there is no Python environment or PDF library to maintain.
    Kestra keeps every intermediate file (pages, renders, chunks) in internal storage per execution, retries
    a failed download without redoing the rest, and shows which pages were scanned for every document in
    the execution history. The webhook lets any upload service hand documents over with a single HTTP call.

    ## Prerequisites

    - Kestra 2.0 or later with the PDFBox plugin (`io.kestra.plugin.pdfbox`) installed.
    - PDFs reachable over HTTP(S) from the Kestra worker.

    ### Secrets

    - `WEBHOOK_KEY`: the key of the webhook URL that triggers the flow.

    ## Quick start

    1. Create the `WEBHOOK_KEY` secret.
    2. Execute the flow manually with the default `pdf_url`. All 15 pages are text pages, so the OCR branch is skipped
       and the PDF is split into 3 chunks of 5 pages.
    3. Run it on a PDF that contains a scanned page and check the PNG rendered for it in the execution outputs.
    4. Send documents from your own system:
       `curl -X POST -H "Content-Type: application/json" -d '{"url": "https://example.com/report.pdf"}' https://<kestra-host>/api/v1/main/executions/webhook/company.ai/pdf-rag-preprocessing-scanned-page-detection/<WEBHOOK_KEY>`

    ## How to extend

    - Send the rendered PNGs to an OCR engine (Tesseract in a script task, or a vision model through the AI plugin)
      and merge the recognized text back with the text pages.
    - Embed each chunk into a vector store such as Qdrant, Weaviate or pgvector.
    - Replace the webhook with an S3, GCS or SFTP file trigger to process documents as they land.
    - Raise `min_chars_per_page` for documents whose scanned pages carry a short text header or footer.

    ## Links

    - [PDFBox plugin](https://kestra.io/plugins/plugin-pdfbox)
    - [Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook)
    - [Apache PDFBox](https://pdfbox.apache.org/)
  tags:
    - AI
  subTags:
    - Vector Stores & RAG
    - RAG & Knowledge Retrieval
  ee: false
  demo: false
