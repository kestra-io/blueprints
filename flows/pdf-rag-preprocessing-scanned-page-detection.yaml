id: pdf-rag-preprocessing-scanned-page-detection
namespace: company.ai

inputs:
  - id: pdf_url
    type: URI
    displayName: PDF URL
    description: PDF to prepare when the flow is run manually. Webhook calls pass `url` in the JSON body instead.
    defaults: https://arxiv.org/pdf/1706.03762

  - id: chunk_pages
    type: INT
    displayName: Pages per chunk
    defaults: 5

  - id: min_chars_per_page
    type: INT
    displayName: Minimum characters for a text page
    description: A page whose extracted text (whitespace removed) is shorter than this is treated as scanned and rendered to PNG for OCR.
    defaults: 40

  - id: max_pages
    type: INT
    displayName: Maximum pages
    defaults: 300

  - id: ocr_language
    type: STRING
    displayName: OCR language
    description: Tesseract language code(s) for the scanned pages, e.g. `eng` or `eng+fra`.
    defaults: eng

  - id: ollama_endpoint
    type: STRING
    displayName: Ollama endpoint
    description: Local Ollama server that computes the embeddings. From a Kestra container, use `http://host.docker.internal:11434`.
    defaults: http://localhost:11434

  - id: embedding_model
    type: STRING
    displayName: Embedding model
    description: Ollama embedding model, pulled beforehand with `ollama pull nomic-embed-text`.
    defaults: nomic-embed-text

variables:
  source_url: "{{ trigger.body.url ?? inputs.pdf_url }}"

tasks:
  - id: download
    type: io.kestra.plugin.core.http.Download
    description: Fetches the PDF from the webhook body `url`, or from the `pdf_url` input on a manual run.
    uri: "{{ render(vars.source_url) }}"

  - id: metadata
    type: io.kestra.plugin.pdfbox.metadata.Read
    description: Reads the page count and document properties before any heavy work.
    from: "{{ outputs.download.uri }}"

  - id: page_limit_guard
    type: io.kestra.plugin.core.execution.Fail
    description: Stops oversized documents before text extraction and rendering.
    condition: "{{ outputs.metadata.pageCount > inputs.max_pages }}"
    errorMessage: "{{ render(vars.source_url) }} has {{ outputs.metadata.pageCount }} pages, above the limit of {{ inputs.max_pages }}."

  - id: extract_text
    type: io.kestra.plugin.pdfbox.text.Extract
    description: Extracts the text of every page in reading order.
    from: "{{ outputs.download.uri }}"
    perPage: true
    sortByPosition: true
    maxPages: "{{ inputs.max_pages }}"

  - id: classify_pages
    type: io.kestra.plugin.core.output.OutputValues
    description: Lists the 1-based numbers of pages whose text, whitespace removed, is shorter than `min_chars_per_page`, i.e. pages with no usable text layer.
    values:
      scanned: "{{ outputs.extract_text.pages | jq('[to_entries[] | select((.value | gsub(\"\\\\s\"; \"\") | length) < ' ~ inputs.min_chars_per_page ~ ') | .key + 1]') | first | toJson }}"

  - id: ocr_handoff
    type: io.kestra.plugin.core.flow.If
    description: Renders only the scanned pages to 300 DPI grayscale PNGs and OCRs them with Tesseract; text pages are skipped.
    condition: "{{ fromJson(outputs.classify_pages.values.scanned) | length > 0 }}"
    then:
      - id: render_scanned_pages
        type: io.kestra.plugin.core.flow.Loop
        values: "{{ fromJson(outputs.classify_pages.values.scanned) }}"
        outputs:
          - id: png
            type: STRING
            value: "{{ outputs.render_page.uris | first }}"
          - id: text
            type: STRING
            value: "{{ outputs.ocr_page.result.content ?? '' }}"
        tasks:
          - id: render_page
            type: io.kestra.plugin.pdfbox.image.Render
            from: "{{ outputs.download.uri }}"
            startPage: "{{ item.value }}"
            endPage: "{{ item.value }}"
            dpi: 300
            grayscale: true

          - id: ocr_page
            type: io.kestra.plugin.tika.Parse
            description: OCRs the page image; requires Tesseract on the Kestra host.
            from: "{{ outputs.render_page.uris | first }}"
            contentType: TEXT
            store: false
            ocrOptions:
              strategy: OCR_ONLY
              language: "{{ inputs.ocr_language }}"

  - id: page_texts
    type: io.kestra.plugin.core.output.OutputValues
    description: Merges the text layer and the OCR results into one list of pages, recording for each page where its text came from and, for scanned pages, the PNG it was read from.
    values:
      pages: "{{ {'text': outputs.extract_text.pages, 'ocr': (outputs.render_scanned_pages.outputs ?? [])} | toJson | jq('(reduce .ocr[] as $r ({}; .[($r.item.value | tostring)] = $r.outputs)) as $o | [.text | to_entries[] | (.key + 1) as $n | ($o[$n | tostring]) as $m | if $m then {page: $n, source: \"ocr\", png: $m.png, text: $m.text} else {page: $n, source: \"text\", text: .value} end]') | first | toJson }}"

  - id: index_pages
    type: io.kestra.plugin.core.flow.Loop
    description: Embeds every page with a local Ollama model and stores it with its page number, source and URL, so search results point back to the page.
    values: "{{ fromJson(outputs.page_texts.values.pages) | jq('[.[] | select(.text | gsub(\"\\\\s\"; \"\") | length > 0)]') | first }}"
    # The KV embedding store is read-modify-write, so pages are ingested one at a time.
    concurrencyLimit: 1
    tasks:
      - id: ingest_page
        type: io.kestra.plugin.ai.rag.IngestDocument
        provider:
          type: io.kestra.plugin.ai.provider.Ollama
          endpoint: "{{ inputs.ollama_endpoint }}"
          modelName: "{{ inputs.embedding_model }}"
        embeddings:
          type: io.kestra.plugin.ai.embeddings.KestraKVStore
          kvName: pdf-rag-pages
        fromDocuments:
          - content: "{{ fromJson(item.value).text }}"
            metadata:
              source_url: "{{ render(vars.source_url) }}"
              page: "{{ fromJson(item.value).page }}"
              text_source: "{{ fromJson(item.value).source }}"
              kestra_execution: "{{ execution.id }}"
        documentSplitter:
          splitter: RECURSIVE
          maxSegmentSizeInChars: 1500
          maxOverlapSizeInChars: 150

  - id: split_chunks
    type: io.kestra.plugin.pdfbox.document.Split
    description: Splits the PDF into chunks of `chunk_pages` pages for parallel embedding or indexing.
    from: "{{ outputs.download.uri }}"
    everyNPages: "{{ inputs.chunk_pages }}"

  - id: stamp_metadata
    type: io.kestra.plugin.pdfbox.metadata.Update
    description: Writes the processing result into the PDF's own metadata, so the file carries its lineage.
    from: "{{ outputs.download.uri }}"
    keywords: rag-ready
    custom:
      kestra_execution: "{{ execution.id }}"
      source_url: "{{ render(vars.source_url) }}"
      scanned_pages: "{{ fromJson(outputs.classify_pages.values.scanned) | join(',') }}"
      chunk_count: "{{ outputs.split_chunks.count }}"

  - id: manifest
    type: io.kestra.plugin.core.output.OutputValues
    description: Publishes a manifest of the run for downstream flows.
    values:
      source_url: "{{ render(vars.source_url) }}"
      title: "{{ outputs.metadata.title ?? '' }}"
      page_count: "{{ outputs.metadata.pageCount }}"
      text_pages: "{{ outputs.metadata.pageCount - (fromJson(outputs.classify_pages.values.scanned) | length) }}"
      scanned_pages: "{{ fromJson(outputs.classify_pages.values.scanned) }}"
      chunks: "{{ outputs.split_chunks.uris }}"
      scanned_page_images: "{{ fromJson(outputs.page_texts.values.pages) | jq('[.[] | select(.source == \"ocr\") | {page, png}]') | first }}"
      pages: "{{ fromJson(outputs.page_texts.values.pages) }}"
      indexed_pages: "{{ fromJson(outputs.page_texts.values.pages) | jq('[.[] | select(.text | gsub(\"\\\\s\"; \"\") | length > 0)] | length') | first }}"
      stamped_pdf: "{{ outputs.stamp_metadata.uri }}"

triggers:
  - id: pdf_arrived
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('WEBHOOK_KEY') }}"

extend:
  title: Prepare PDFs for RAG with Scanned-Page OCR and Local Ollama Embeddings
  metaTitle: Prepare PDFs for RAG with PDFBox, Tika OCR and Ollama
  metaDescription: Extract PDF text per page, OCR only the scanned pages with Tika, and embed every page with a local Ollama model using Kestra and PDFBox.
  shortDescription: Turn any PDF into a searchable index. Extract text per page, OCR only the scanned pages, embed every page locally with Ollama, and stamp the file with its lineage.
  description: |
    RAG pipelines quietly lose content when a PDF mixes real text with scanned pages. Text extraction
    returns an empty string for an image-only page, so the page never reaches the embeddings and nobody notices.
    This flow prepares each PDF with Apache PDFBox, OCRs only the scanned pages with Apache Tika and Tesseract,
    embeds every page with a local Ollama model, and records what it did in the PDF's own metadata.
    No paid API is involved.

    ## How it works

    1. **Trigger**: a webhook call with `{"url": "https://..."}` in its JSON body starts the flow. A manual
       run uses the `pdf_url` input, which defaults to the "Attention Is All You Need" paper on arXiv.
    2. **Download and inspect**: `download` fetches the file, and `metadata` reads its page count.
       `page_limit_guard` fails the execution with a clear message when the document has more than `max_pages` pages.
    3. **Per-page extraction**: `extract_text` pulls the text of every page in reading order.
    4. **Scanned-page detection**: `classify_pages` lists the pages whose text, whitespace removed, is shorter
       than `min_chars_per_page`. Those pages have no usable text layer.
    5. **OCR**: the `ocr_handoff` `If` runs only when scanned pages exist. Its `Loop` renders each of them to a
       300 DPI grayscale PNG and reads it with Tika in `OCR_ONLY` mode. Text pages are never rasterized.
    6. **Page assembly**: `page_texts` merges the text layer and the OCR results into one list of pages, each
       with its number, its text, where the text came from and, for scanned pages, the PNG it was read from.
    7. **Embedding**: `index_pages` embeds every non-empty page with an Ollama model such as `nomic-embed-text`
       and stores it in a Kestra KV embedding store, tagged with the page number, text source and source URL.
    8. **Chunking and lineage**: `split_chunks` cuts the PDF into files of `chunk_pages` pages, `stamp_metadata`
       writes the execution ID, source URL, scanned pages and chunk count into the PDF's custom properties,
       and `manifest` publishes the page texts, PNG URIs, chunks and stamped PDF as flow outputs.

    ## What you get

    - Scanned pages read by OCR instead of silently indexed as empty text.
    - OCR only where it is needed, which keeps processing time proportional to the problem.
    - A page-level embedding index whose search results point back to the page and URL they came from.
    - A manifest with every page's text and the PNG of each scanned page, ready for any downstream flow.
    - A stamped PDF that records which execution prepared it, and a hard page limit that protects workers.

    ## Who it's for

    - AI engineers building retrieval pipelines over reports, papers, contracts or manuals.
    - Data engineers ingesting document drops from partners, scanners or object storage.
    - Teams that must keep documents on their own infrastructure, with no external AI API.

    ## Why orchestrate this with Kestra

    Each step is a declarative plugin task, so there is no Python environment or PDF library to maintain.
    Kestra keeps every intermediate file (pages, renders, chunks) in internal storage per execution, retries
    a failed download without redoing the rest, and shows which pages needed OCR for every document in
    the execution history. The webhook lets any upload service hand documents over with a single HTTP call.

    ## Prerequisites

    - Kestra 2.0 or later with the PDFBox (`io.kestra.plugin.pdfbox`), Tika (`io.kestra.plugin.tika`) and
      AI (`io.kestra.plugin.ai`) plugins installed.
    - Tesseract on the Kestra worker (`apt-get install tesseract-ocr`, or `brew install tesseract`), plus the
      language packs you set in `ocr_language`.
    - A local Ollama server with an embedding model: `ollama pull nomic-embed-text`. From a Kestra container,
      set `ollama_endpoint` to `http://host.docker.internal:11434`.
    - PDFs reachable over HTTP(S) from the Kestra worker.

    ### Secrets

    - `WEBHOOK_KEY`: the key of the webhook URL that triggers the flow.

    ## Quick start

    1. Create the `WEBHOOK_KEY` secret and pull the embedding model with `ollama pull nomic-embed-text`.
    2. Execute the flow manually with the default `pdf_url`. All 15 pages are text pages, so the OCR branch is
       skipped, 15 pages are embedded and the PDF is split into 3 chunks of 5 pages.
    3. Run it on a PDF that contains a scanned page: the manifest lists that page with `"source": "ocr"`, its
       recognized text and the URI of its PNG.
    4. Send documents from your own system:
       `curl -X POST -H "Content-Type: application/json" -d '{"url": "https://example.com/report.pdf"}' https://<kestra-host>/api/v1/main/executions/webhook/company.ai/pdf-rag-preprocessing-scanned-page-detection/<WEBHOOK_KEY>`

    ## How to extend

    - Query the index with `io.kestra.plugin.ai.rag.ChatCompletion` and a local Ollama chat model.
    - Swap the KV embedding store, which is meant for prototyping, for Qdrant, Weaviate, pgvector or Elasticsearch.
    - Replace the webhook with an S3, GCS or SFTP file trigger to process documents as they land.
    - Raise `min_chars_per_page` for documents whose scanned pages carry a short text header or footer.

    ## Links

    - [PDFBox plugin](https://kestra.io/plugins/plugin-pdfbox)
    - [Tika plugin](https://kestra.io/plugins/plugin-tika)
    - [AI plugin: IngestDocument](https://kestra.io/plugins/plugin-ai/rag/io.kestra.plugin.ai.rag.ingestdocument)
    - [Ollama](https://ollama.com/)
    - [Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
  tags:
    - AI
  subTags:
    - Vector Stores & RAG
    - RAG & Knowledge Retrieval
  ee: false
  demo: false
