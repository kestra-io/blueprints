id: aws-ec2-stopped-instance-ebs-cost-sentinel
namespace: company.team

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region to audit for stopped EC2 instances.
  - id: max_allowed_stopped_instances
    type: INT
    defaults: 0
    description: Maximum acceptable count of stopped EC2 instances before alerting.

tasks:
  - id: audit_stopped_instances
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
      MAX_ALLOWED_STOPPED: "{{ inputs.max_allowed_stopped_instances }}"
    outputFiles:
      - leak_summary.json
    script: |
      import os
      import sys
      import json
      import boto3
      from kestra import Kestra

      region = os.environ.get("AWS_DEFAULT_REGION", "us-east-1")
      max_allowed = int(os.environ.get("MAX_ALLOWED_STOPPED", 0))

      try:
          ec2 = boto3.client("ec2", region_name=region)
          paginator = ec2.get_paginator("describe_instances")
          instances = []
          for page in paginator.paginate(Filters=[{"Name": "instance-state-name", "Values": ["stopped"]}]):
              for res in page.get("Reservations", []):
                  instances.extend(res.get("Instances", []))
      except Exception as e:
          print(f"ERROR: Failed to describe stopped EC2 instances: {e}", file=sys.stderr)
          sys.exit(1)

      total_stopped = len(instances)
      ebs_volume_count = sum(len(i.get("BlockDeviceMappings", [])) for i in instances)
      has_leaks = total_stopped > max_allowed

      result = {
          "stopped_count": total_stopped,
          "ebs_volume_count": ebs_volume_count,
          "has_leaks": has_leaks,
          "region": region
      }

      with open("leak_summary.json", "w", encoding="utf-8") as out:
          json.dump(result, out, indent=2)

      print(f"Stopped instances audit completed: {result}")

      Kestra.outputs({
          "stopped_count": total_stopped,
          "ebs_volume_count": ebs_volume_count,
          "has_leaks": has_leaks
      })

  - id: evaluate_idle_storage_leaks
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_stopped_instances.vars.has_leaks }}"
    then:
      - id: alert_infrastructure_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "🗑️ *AWS Storage Waste Alert*: Found {{ outputs.audit_stopped_instances.vars.stopped_count }} stopped EC2 instances retaining {{ outputs.audit_stopped_instances.vars.ebs_volume_count }} attached EBS volumes in {{ inputs.aws_region }}."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "⚠️ *EC2 Sentinel Execution Failure*: Failed to query EC2 instances in {{ inputs.aws_region }}."
      }

extend:
  title: Audit Stopped AWS EC2 Instances for EBS Waste Cost Sentinel
  description: |
    Audit stopped EC2 instances and report potential idle EBS storage costs to Slack.
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - Monitoring & Alerting
  ee: false
