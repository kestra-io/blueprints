id: aws-ec2-stopped-instance-ebs-cost-sentinel
namespace: company.cloudops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region to audit for stopped EC2 instances.
  - id: max_allowed_stopped_instances
    type: INT
    defaults: 0
    description: Maximum acceptable count of stopped EC2 instances before alerting.

tasks:
  - id: audit_stopped_instances
    type: io.kestra.plugin.aws.cli.AwsCLI
    runner: PROCESS
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws ec2 describe-instances           --filters "Name=instance-state-name,Values=stopped"           --query "Reservations[*].Instances[*].{InstanceId:InstanceId,InstanceType:InstanceType,LaunchTime:LaunchTime,BlockDevices:BlockDeviceMappings}"           --output json > stopped_instances.json
        python3 -c "
        import json
        with open('stopped_instances.json') as f:
            data = json.load(f)
        instances = [item for sub in data for item in sub]
        total_stopped = len(instances)
        ebs_volume_count = sum(len(i.get('BlockDevices', [])) for i in instances)
        result = {
            'stopped_count': total_stopped,
            'ebs_volume_count': ebs_volume_count,
            'has_leaks': total_stopped > {{ inputs.max_allowed_stopped_instances }}
        }
        with open('leak_summary.json', 'w') as out:
            json.dump(result, out)
        print('Stopped instances audit:', result)
        "
    outputFiles:
      - leak_summary.json

  - id: evaluate_idle_storage_leaks
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.audit_stopped_instances.outputFiles['leak_summary.json'])).has_leaks }}"
    then:
      - id: alert_infrastructure_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":wastebasket: *AWS Storage Waste Alert*: Found {{ json(read(outputs.audit_stopped_instances.outputFiles['leak_summary.json'])).stopped_count }} stopped EC2 instances retaining {{ json(read(outputs.audit_stopped_instances.outputFiles['leak_summary.json'])).ebs_volume_count }} attached EBS volumes in {{ inputs.aws_region }}."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *EC2 Sentinel Execution Failure*: Failed to query EC2 instances in {{ inputs.aws_region }}."
      }

triggers:
  - id: weekly_cleanup_scan
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true

extend:
  title: AWS Stopped EC2 Instance EBS Storage Cost Leak Sentinel
  shortDescription: Audits stopped EC2 instances and identifies unattached or idle EBS volumes accumulating storage charges.
  description: |
    ## How it works
    This flow invokes `AwsCLI` to inspect EC2 instance states across specified AWS regions. It filters for instances in `stopped` state, extracts attached block device mappings, and computes the count of idle EBS volumes generating persistent provisioned storage charges.

    ## What you get
    - Instant visibility into forgotten EC2 instances left in a stopped state.
    - Identification of attached EBS volumes quietly incurring monthly GB-month charges.
    - Actionable Slack notifications directing engineers to snapshot and terminate zombie resources.

    ## Who it's for
    - Cloud infrastructure and DevOps engineers maintaining AWS account cleanliness.
    - FinOps analysts hunting for orphaned infrastructure resources.

    ## Why orchestrate this with Kestra
    Kestra eliminates manual inventory spreadsheets by turning AWS resource audits into automated code. With built-in retry mechanisms, secret injection, and seamless alert integrations, maintenance scans execute without dedicated infrastructure.

    ## Prerequisites
    - An AWS IAM user or role with `ec2:DescribeInstances` permissions.
    - Kestra secrets configured for `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK`.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure AWS credentials and Slack webhook secrets.
    3. Run the sentinel to audit stopped compute, then activate the weekly schedule.

    ## How to extend
    - Add automated EBS volume snapshotting via `ec2:CreateSnapshot` prior to cleanup.
    - Implement auto-termination subflows for instances stopped longer than 30 days.
    - Export findings to S3 or an operational dashboard in BigQuery or Snowflake.

    ## Links
    - [Kestra AWS Plugin Documentation](https://kestra.io/plugins/plugin-aws)
    - [AWS EC2 DescribeInstances Documentation](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DescribeInstances.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
