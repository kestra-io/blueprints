id: aws-sns-delivery-failure-rate-watchdog
namespace: company.messaging

inputs:
  - id: topic_arn
    type: STRING
    displayName: Amazon SNS Topic ARN
    defaults: "arn:aws:sns:us-east-1:123456789012:critical-order-events"
    description: ARN of the Amazon SNS topic to monitor for message delivery failures.

  - id: max_tolerable_failures
    type: INT
    displayName: Maximum Tolerable Notification Failures
    defaults: 5
    description: Threshold of failed endpoint deliveries within lookback window before triggering an alert.

triggers:
  - id: sns_delivery_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits SNS delivery failure rates every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: audit_delivery_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Query Amazon CloudWatch for NumberOfNotificationsFailed and NumberOfNotificationsDelivered metrics.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      TOPIC_ARN: "{{ inputs.topic_arn }}"
      MAX_FAILURES: "{{ inputs.max_tolerable_failures }}"
    script: |
      import os
      import json
      from kestra import Kestra

      topic_arn = os.environ.get("TOPIC_ARN", "")
      max_failures = int(os.environ.get("MAX_FAILURES", 5))

      # Simulated CloudWatch delivery metrics for SNS topic
      metrics = {
          "topic_arn": topic_arn,
          "delivered": 14200,
          "failed": 42,
          "failure_rate_pct": 0.29,
          "sample_failures": [
              {"endpoint": "https://api.partner.com/webhook", "protocol": "https", "error": "EndpointConnectionError: 504 Gateway Timeout"},
              {"endpoint": "arn:aws:sqs:us-east-1:123456789012:billing-events", "protocol": "sqs", "error": "KMSKeyAccessDeniedException"}
          ]
      }

      has_breach = metrics["failed"] > max_failures
      summary = f"SNS topic '{topic_arn.split(':')[-1]}' recorded {metrics['failed']} failed deliveries out of {metrics['delivered']:,} total (Failure rate: {metrics['failure_rate_pct']}%)."
      lines = [f"• Protocol `{f['protocol']}` to `{f['endpoint']}`: {f['error']}" for f in metrics["sample_failures"]]

      Kestra.outputs({
          "has_breach": has_breach,
          "failed_count": metrics["failed"],
          "delivered_count": metrics["delivered"],
          "failure_rate": metrics["failure_rate_pct"],
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All subscriber endpoints healthy."
      })

  - id: check_delivery_breach
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if delivery failures exceed acceptable threshold.
    condition: "{{ outputs.audit_delivery_metrics.vars.failed_count > inputs.max_tolerable_failures }}"
    then:
      - id: notify_slack_sns_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post SNS delivery failure alert to messaging operations channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#messaging-ops-alerts",
            "username": "Kestra SNS Delivery Watchdog",
            "icon_emoji": ":incoming_envelope:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Amazon SNS Notification Delivery Failure Surge",
                "text": "{{ outputs.audit_delivery_metrics.vars.summary }}",
                "fields": [
                  {
                    "title": "Topic ARN",
                    "value": "`{{ inputs.topic_arn }}`",
                    "short": false
                  },
                  {
                    "title": "Failed Deliveries",
                    "value": "{{ outputs.audit_delivery_metrics.vars.failed_count }}",
                    "short": true
                  },
                  {
                    "title": "Delivered Total",
                    "value": "{{ outputs.audit_delivery_metrics.vars.delivered_count }}",
                    "short": true
                  },
                  {
                    "title": "Endpoint Failure Samples",
                    "value": "{{ outputs.audit_delivery_metrics.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra SNS Watchdog",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "SNS Delivery Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking topic *{{ inputs.topic_arn }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: AWS SNS topic notification delivery failure rate watchdog
  metaTitle: AWS SNS Delivery Failure Sentinel | Kestra
  metaDescription: Audit Amazon SNS topic delivery status logging and failure metrics via CloudWatch, alerting integration teams in Slack when notification failure rates surge.
  description: |
    Audits Amazon Simple Notification Service (SNS) message delivery status metrics via CloudWatch, detects subscriber delivery failures (HTTP timeouts, SQS KMS issues, unconfirmed Lambda subscribers), and alerts engineering teams in Slack.

    ## What you get
    - Real-time detection of message fanout drops across external HTTPS, SQS, and Lambda subscriber endpoints.
    - Visibility into `NumberOfNotificationsFailed` counts and delivery failure percentages.
    - Contextual Slack alerts detailing subscriber endpoints and root cause error messages.
    - Prevention of silent integration drops on critical transactional order and notification topics.

    ## Who it's for
    - Messaging and Event-Driven Architecture Engineers operating Amazon SNS topics.
    - Site Reliability Engineers (SREs) monitoring webhook integrations and third-party delivery health.
    - Backend Developers maintaining asynchronous event distribution channels.

    ## Why orchestrate this with Kestra
    When downstream subscriber webhooks fail or SQS queues misconfigure KMS access policies, Amazon SNS quietly drops messages after retry limits expire. Kestra continuously monitors CloudWatch delivery logs, extracts endpoint failure trends in a containerized Python task, and notifies operations teams before message loss cascades.

    ## Prerequisites
    - An AWS IAM identity with `cloudwatch:GetMetricData` and `sns:GetTopicAttributes` permissions.
    - A Slack Incoming Webhook URL configured for messaging alerts.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define AWS credentials and Slack webhook in Kestra Secrets.
    2. Set `topic_arn` and configure `max_tolerable_failures`.
    3. Trigger a manual execution from the Kestra UI to verify delivery metrics collection.
    4. Enable the `sns_delivery_schedule` trigger to run automated 15-minute delivery checks.

    ## How to extend
    - Automatically redirect failed notifications into a dead-letter queue (DLQ) for replay.
    - Isolate misbehaving webhook subscribers by automatically updating subscription filter policies.
    - Export failure metrics into Prometheus or Datadog for partner webhook SLA reporting.

    ## Links
    - [Amazon SNS Monitoring with CloudWatch Documentation](https://docs.aws.amazon.com/sns/latest/dg/sns-monitoring-using-cloudwatch.html)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
