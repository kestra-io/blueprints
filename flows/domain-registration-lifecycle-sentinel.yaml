id: domain-registration-lifecycle-sentinel
namespace: company.infrastructure
description: |
  Monitor a public domain's registration lifecycle using the Registration Data Access Protocol (RDAP).
  The flow validates domain input, retrieves the live registration record, extracts expiration and
  registration events, evaluates remaining validity days, counts nameservers, and optionally checks
  for a transfer-lock status. It generates JSON evidence, can archive the report to S3, and alerts
  when the domain is missing expiry data or approaches the configured renewal window. RDAP coverage
  differs by registry; missing data is treated according to the configurable policy rather than guessed.

inputs:
  - id: domain
    type: STRING
    displayName: Domain name
    defaults: google.com
    description: Registrable ASCII domain name without a URL scheme or path.
  - id: minimum_expiry_days
    type: INT
    displayName: Minimum days until expiry
    defaults: 60
    description: Block if the RDAP expiration event is fewer than this many days in the future.
  - id: require_expiration_event
    type: BOOL
    displayName: Require expiration metadata
    defaults: true
    description: Block when the RDAP record has no parseable expiration event.
  - id: require_two_nameservers
    type: BOOL
    displayName: Require at least two nameservers
    defaults: true
    description: Block if fewer than two nameserver entries are returned.
  - id: require_transfer_lock
    type: BOOL
    displayName: Require transfer lock
    defaults: false
    description: Block unless RDAP statuses include a transfer-prohibited status.
  - id: archive_report
    type: BOOL
    displayName: Archive report to S3
    defaults: false
    description: Save the JSON lifecycle report to S3. AWS secrets are required only when enabled.
  - id: evidence_bucket
    type: STRING
    displayName: Evidence bucket
    defaults: my-domain-lifecycle-evidence
    description: Existing S3 bucket used when report archival is enabled.
  - id: evidence_prefix
    type: STRING
    displayName: Evidence prefix
    defaults: domain-registration-audits
    description: Prefix for domain-specific RDAP reports.
  - id: aws_region
    type: STRING
    displayName: AWS region
    defaults: eu-west-1
    description: Region of the evidence bucket.

triggers:
  - id: weekly_domain_lifecycle_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recheck expiration and lifecycle signals weekly. Enable after confirming that the selected TLD exposes RDAP expiry events.
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: validate_domain
    type: io.kestra.plugin.scripts.python.Script
    description: Validate a domain label before calling the public RDAP bootstrap service.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      DOMAIN: "{{ inputs.domain }}"
      MINIMUM_EXPIRY_DAYS: "{{ inputs.minimum_expiry_days }}"
    script: |
      import os
      import re

      domain = os.environ.get("DOMAIN", "").strip().rstrip(".").lower()
      try:
          minimum_days = int(os.environ.get("MINIMUM_EXPIRY_DAYS", "60"))
      except ValueError as exc:
          raise ValueError("minimum_expiry_days must be an integer") from exc
      if not re.fullmatch(r"(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}", domain):
          raise ValueError("domain must be a valid ASCII DNS name without a URL scheme or path")
      if minimum_days < 0:
          raise ValueError("minimum_expiry_days cannot be negative")
      print(f"Validated RDAP lifecycle request for {domain}")

  - id: fetch_rdap_record
    type: io.kestra.plugin.core.http.Request
    description: Fetch live RDAP domain registration data using the RDAP bootstrap service, which redirects to the authoritative registry RDAP endpoint.
    uri: "https://rdap.org/domain/{{ inputs.domain }}"
    method: GET
    headers:
      Accept: application/rdap+json, application/json
      User-Agent: Kestra-Domain-Registration-Lifecycle-Sentinel/1.0
    timeout: PT45S

  - id: audit_registration_lifecycle
    type: io.kestra.plugin.scripts.python.Script
    description: Extract expiry events, compute remaining validity days, validate nameserver inventory and optionally require a transfer-prohibited status.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra
    inputFiles:
      rdap-record.json: "{{ outputs.fetch_rdap_record.body }}"
    env:
      DOMAIN: "{{ inputs.domain }}"
      MINIMUM_EXPIRY_DAYS: "{{ inputs.minimum_expiry_days }}"
      REQUIRE_EXPIRY: "{{ inputs.require_expiration_event }}"
      REQUIRE_TWO_NAMESERVERS: "{{ inputs.require_two_nameservers }}"
      REQUIRE_TRANSFER_LOCK: "{{ inputs.require_transfer_lock }}"
    outputFiles:
      - domain-lifecycle-audit.json
    script: |
      import json
      import os
      from datetime import datetime, timezone
      from kestra import Kestra

      requested_domain = os.environ["DOMAIN"].strip().lower().rstrip(".")
      minimum_expiry_days = int(os.environ.get("MINIMUM_EXPIRY_DAYS", "60"))
      require_expiry = os.environ.get("REQUIRE_EXPIRY", "true").lower() == "true"
      require_two_nameservers = os.environ.get("REQUIRE_TWO_NAMESERVERS", "true").lower() == "true"
      require_transfer_lock = os.environ.get("REQUIRE_TRANSFER_LOCK", "false").lower() == "true"

      with open("rdap-record.json", encoding="utf-8") as source:
          record = json.load(source)
      if not isinstance(record, dict):
          raise ValueError("RDAP response must be a JSON object")
      if record.get("errorCode") or record.get("title"):
          detail = record.get("description") or record.get("title") or "RDAP lookup returned an error"
          if record.get("errorCode"):
              raise ValueError(f"RDAP lookup failed: {detail}")
      if record.get("objectClassName") != "domain":
          raise ValueError(f"Expected RDAP objectClassName=domain, received {record.get('objectClassName')!r}")

      findings = []
      def add(code, severity, message):
          findings.append({"code": code, "severity": severity, "message": message})

      ldh_name = str(record.get("ldhName") or "").lower().rstrip(".")
      if ldh_name and ldh_name != requested_domain:
          add("DOMAIN_NAME_MISMATCH", "BLOCK", f"RDAP returned {ldh_name!r} for requested domain {requested_domain!r}.")

      event_rows = record.get("events") or []
      expiry_candidates = []
      registration_candidates = []
      def parse_date(raw):
          try:
              value = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
          except (TypeError, ValueError):
              return None
          if value.tzinfo is None:
              value = value.replace(tzinfo=timezone.utc)
          return value.astimezone(timezone.utc)

      for event in event_rows:
          if not isinstance(event, dict):
              continue
          action = str(event.get("eventAction") or "").strip().lower()
          event_date = parse_date(event.get("eventDate"))
          if action in {"expiration", "expiry", "expired"} and event_date:
              expiry_candidates.append(event_date)
          if action in {"registration", "registered"} and event_date:
              registration_candidates.append(event_date)

      expires_at = max(expiry_candidates) if expiry_candidates else None
      registered_at = min(registration_candidates) if registration_candidates else None
      now = datetime.now(timezone.utc)
      days_until_expiry = (expires_at - now).total_seconds() / 86400 if expires_at else None
      if expires_at is None:
          severity = "BLOCK" if require_expiry else "WARN"
          add("EXPIRATION_EVENT_MISSING", severity, "RDAP record has no parseable expiration event.")
      elif days_until_expiry < 0:
          add("DOMAIN_EXPIRED", "BLOCK", f"Domain expiration event is in the past by {-days_until_expiry:.1f} days.")
      elif days_until_expiry < minimum_expiry_days:
          add("EXPIRATION_WINDOW_TOO_SHORT", "BLOCK", f"Domain expires in {days_until_expiry:.1f} days, below the configured minimum of {minimum_expiry_days} days.")

      nameservers = record.get("nameservers") or []
      nameserver_names = sorted({
          str(item.get("ldhName") or "").lower().rstrip(".")
          for item in nameservers if isinstance(item, dict) and item.get("ldhName")
      })
      if require_two_nameservers and len(nameserver_names) < 2:
          add("NAMESERVER_COUNT_TOO_LOW", "BLOCK", f"RDAP returned {len(nameserver_names)} unique nameserver(s); at least two are required.")

      statuses = [str(status).lower() for status in (record.get("status") or [])]
      transfer_locked = any("transfer prohibited" in status or "transferprohibited" in status for status in statuses)
      if require_transfer_lock and not transfer_locked:
          add("TRANSFER_LOCK_MISSING", "BLOCK", "RDAP statuses do not indicate a transfer-prohibited lock.")

      blocking = [finding for finding in findings if finding["severity"] == "BLOCK"]
      warnings = [finding for finding in findings if finding["severity"] == "WARN"]
      verdict = "FAIL" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      report = {
          "schemaVersion": 1,
          "checkedAt": now.isoformat(),
          "requestedDomain": requested_domain,
          "registeredDomain": ldh_name or None,
          "handle": record.get("handle"),
          "registrationDate": registered_at.isoformat() if registered_at else None,
          "expirationDate": expires_at.isoformat() if expires_at else None,
          "daysUntilExpiry": round(days_until_expiry, 2) if days_until_expiry is not None else None,
          "minimumExpiryDays": minimum_expiry_days,
          "nameserverCount": len(nameserver_names),
          "nameservers": nameserver_names,
          "status": statuses,
          "transferLocked": transfer_locked,
          "findings": findings,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "scopeNote": "RDAP data availability depends on the registry. The report evaluates published registry fields; it does not verify domain control or DNS resolution.",
      }
      with open("domain-lifecycle-audit.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)
      print(f"Domain lifecycle audit: {requested_domain} verdict={verdict}; expiry_days={days_until_expiry if days_until_expiry is not None else 'unavailable'}, nameservers={len(nameserver_names)}, blocking={len(blocking)}")
      Kestra.outputs({
          "requested_domain": requested_domain,
          "registered_domain": ldh_name,
          "registration_date": registered_at.isoformat() if registered_at else "",
          "expiration_date": expires_at.isoformat() if expires_at else "",
          "days_until_expiry": round(days_until_expiry, 2) if days_until_expiry is not None else None,
          "nameserver_count": len(nameserver_names),
          "nameservers": nameserver_names,
          "transfer_locked": transfer_locked,
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "findings": findings,
          "verdict": verdict,
      })

  - id: optionally_archive_report
    type: io.kestra.plugin.core.flow.If
    description: Optionally archive the JSON lifecycle evidence to S3.
    condition: "{{ inputs.archive_report }}"
    then:
      - id: upload_domain_lifecycle_report
        type: io.kestra.plugin.aws.s3.Upload
        description: Store the RDAP report without copying any additional domain data.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ inputs.aws_region }}"
        bucket: "{{ inputs.evidence_bucket }}"
        from: "{{ outputs.audit_registration_lifecycle.outputFiles['domain-lifecycle-audit.json'] }}"
        key: "{{ inputs.evidence_prefix }}/{{ inputs.domain | replace('.', '_') }}/domain-lifecycle-audit.json"

  - id: enforce_registration_policy
    type: io.kestra.plugin.core.flow.If
    description: Fail closed when the RDAP expiry window, nameserver count or optional transfer lock violates policy.
    condition: "{{ outputs.audit_registration_lifecycle.vars.verdict == 'FAIL' }}"
    then:
      - id: alert_domain_lifecycle
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert operators to an approaching or missing domain expiry event or a failed lifecycle policy.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |-
          {{
            {
              "text": ":rotating_light: Domain lifecycle gate BLOCKED\\nDomain: " ~ outputs.audit_registration_lifecycle.vars.requested_domain ~
                "\\nExpires: " ~ outputs.audit_registration_lifecycle.vars.expiration_date ~
                "\\nFindings: " ~ (outputs.audit_registration_lifecycle.vars.findings | toJson) ~
                "\\nExecution: " ~ execution.id ~
                "\\nReview domain-lifecycle-audit.json for details."
            } | toJson
          }}
      - id: fail_domain_lifecycle
        type: io.kestra.plugin.core.execution.Fail
        description: Stop a release or deployment workflow when registration lifecycle requirements fail.
        errorMessage: "Domain lifecycle policy failed for {{ outputs.audit_registration_lifecycle.vars.requested_domain }}."
    else:
      - id: log_domain_lifecycle_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Domain lifecycle audit {{ outputs.audit_registration_lifecycle.vars.verdict }} for {{ outputs.audit_registration_lifecycle.vars.requested_domain }}; days to expiry={{ outputs.audit_registration_lifecycle.vars.days_until_expiry }}."

errors:
  - id: alert_domain_rdap_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when RDAP fetch or parsing fails so an inaccessible registry is never treated as a passing audit.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |-
      {{
        {
          "text": ":warning: Domain RDAP audit execution failed\\nDomain: " ~ inputs.domain ~
            "\\nExecution: " ~ execution.id ~
            "\\nInspect Kestra logs; lookup failures must not be interpreted as PASS."
        } | toJson
      }}

outputs:
  - id: domain_lifecycle_audit
    type: JSON
    description: Machine-readable RDAP registration and expiry events, nameserver inventory, policy findings and verdict.
    value: "{{ outputs.audit_registration_lifecycle.vars | toJson }}"

extend:
  title: Domain Registration Lifecycle and Expiry Sentinel
  metaTitle: Domain Registration Lifecycle and Expiry Sentinel | Kestra
  shortDescription: Monitor live RDAP expiry events, nameservers and optional transfer-lock status so domain renewals are surfaced before service disruption.
  metaDescription: Audit RDAP domain expiry, remaining validity days, nameserver coverage and optional transfer-lock status with an auditable scheduled Kestra workflow.
  description: |
    Monitor a public domain's registration lifecycle with live RDAP data. The workflow validates the input, retrieves the authoritative registry record through the RDAP bootstrap service, extracts registration and expiration events, counts nameservers, and optionally requires a transfer-prohibited status. It creates a JSON report, supports S3 evidence retention, and alerts when the domain is expired, approaching expiry, missing required event data, or failing a configured lifecycle policy.

    ## How it works

    1. The validation task checks the domain name and expiry threshold.
    2. The HTTP request obtains the current RDAP domain record from the public bootstrap service.
    3. The audit script parses registration and expiry events, computes days remaining, and evaluates nameserver and transfer-lock policy.
    4. An optional If branch archives the report to S3.
    5. The enforcement If routes a blocked verdict to Slack and a failing task, or logs the passing result.

    ## What you get

    - A report with registration date, expiration date, days remaining, nameserver inventory and statuses.
    - Detection of domains with missing expiry metadata or too little renewal runway.
    - Optional nameserver-count and transfer-lock requirements.
    - A fail-closed branch when the RDAP request or lifecycle policy fails.

    ## Who it's for

    - Platform teams responsible for production domain renewals.
    - Security teams monitoring domain transfer locks and registration posture.
    - Operations teams maintaining a portfolio of customer-facing domains.

    ## Why orchestrate this with Kestra

    Kestra makes the renewal window configurable, records each check and its data source, enables recurring monitoring, and routes renewal risk to a clear failed execution and alert.

    ## Prerequisites

    - A Kestra 2.x worker with Docker enabled for the Python Script task runner.
    - Network access to rdap.org and the registry RDAP endpoint selected by its redirect.
    - A Slack incoming webhook for alerts; S3 archival is optional.

    ### Secrets

    - SLACK_WEBHOOK_URL: Slack incoming webhook for blocking lifecycle findings and lookup failures.
    - AWS_ACCESS_KEY_ID: optional AWS access key used only when report archival is enabled.
    - AWS_SECRET_ACCESS_KEY: optional AWS secret key used only when report archival is enabled.

    ## Quick start

    1. Import the flow with domain google.com and execute it manually.
    2. Review domain-lifecycle-audit.json and the domain_lifecycle_audit output.
    3. Set minimum_expiry_days based on your registrar's renewal service-level objective.
    4. Enable require_transfer_lock for TLDs where the registry exposes transfer-prohibited statuses.
    5. Configure Slack and optional S3, then enable weekly_domain_lifecycle_check after verifying the initial result.

    ## How to extend

    - Add a domain list input and a ForEach task to monitor a full portfolio.
    - Compare RDAP nameservers to approved DNS infrastructure and alert on unexpected delegation.
    - Combine expiry checks with DNSSEC, certificate expiry and MTA-STS/DANE checks.
    - Route low remaining validity days into a ticketing system with an explicit renewal owner.

    ## Links

    - [RDAP bootstrap service](https://rdap.org/)
    - [ICANN RDAP information](https://www.icann.org/rdap)
    - [Kestra HTTP Request plugin](https://kestra.io/plugins/plugin-core/http/io.kestra.plugin.core.http.request)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack/slackincomingwebhook)
    - [Kestra AWS S3 plugin](https://kestra.io/plugins/plugin-aws/s3)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
