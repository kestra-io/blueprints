id: qdrant-payload-index-unindexed-filter-sentinel
namespace: company.ai

inputs:
  - id: qdrant_url
    type: STRING
    defaults: "http://qdrant.internal:6333"
    description: Base URL of the Qdrant Vector Database REST API.
  - id: collection_name
    type: STRING
    description: Target Qdrant collection name to audit.

tasks:
  - id: inspect_collection_schema
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Qdrant REST API for collection info and payload schema
        curl -s -H "api-key: {{ secret('QDRANT_API_KEY') }}" \
          "{{ inputs.qdrant_url }}/collections/{{ inputs.collection_name }}" > /tmp/qdrant_info.json

        python3 -c "
        import json
        try:
            with open('/tmp/qdrant_info.json') as f:
                data = json.load(f)
            res = data.get('result', {})
            status = res.get('status', 'unknown')
            vectors_count = res.get('vectors_count', 0)
            payload_schema = res.get('payload_schema', {})
            schema_keys = len(payload_schema.keys())
            is_breach = 1 if status != 'green' or schema_keys == 0 else 0
            print(f'{is_breach}|{status}|{vectors_count}|{schema_keys}')
        except Exception:
            print('1|unknown|0|0')
        " > /tmp/qdrant_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/qdrant_summary.txt)
        STATUS=$(cut -d '|' -f 2 /tmp/qdrant_summary.txt)
        VECTORS_COUNT=$(cut -d '|' -f 3 /tmp/qdrant_summary.txt)
        SCHEMA_KEYS=$(cut -d '|' -f 4 /tmp/qdrant_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=status::$STATUS::"
        echo "::set-output name=vectors_count::$VECTORS_COUNT::"
        echo "::set-output name=schema_keys::$SCHEMA_KEYS::"

  - id: evaluate_qdrant_optimization
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_collection_schema.vars.is_breach | int == 1 }}"
    then:
      - id: notify_ai_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#ai-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Qdrant Vector Collection Indexing Degradation Warning",
                "text": "Collection {{ inputs.collection_name }} on {{ inputs.qdrant_url }} has status {{ outputs.inspect_collection_schema.vars.status }} with {{ outputs.inspect_collection_schema.vars.schema_keys }} indexed payload fields across {{ outputs.inspect_collection_schema.vars.vectors_count }} vectors. Missing payload indexes force full-scan brute force filtering on RAG retrieval.",
                "footer": "Kestra AI Sentinel • Qdrant"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#ai-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Qdrant Sentinel Failure",
            "text": "Failed to communicate with Qdrant REST API at {{ inputs.qdrant_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: Qdrant Vector Collection Health and Payload Indexing Sentinel
  shortDescription: Audits Qdrant vector collections to detect degraded status and missing payload filter indexes.
  description: |
    ## How it works
    This workflow connects to the Qdrant Vector Database REST API (`/collections/{name}`) to audit collection operational status and inspect the `payload_schema`. In high-performance generative AI and RAG architectures, metadata filtering (such as filtering by tenant ID, document type, or publication date) requires explicit payload indexes. If metadata fields lack dedicated payload indexes, Qdrant is forced to perform expensive full-collection linear scans, increasing search latency from 5 milliseconds to several seconds. This sentinel verifies collection health and schema indexing before latency impacts user-facing LLM applications.

    ## What you get
    - Real-time tracking of Qdrant collection health status and vector counts.
    - Identification of missing payload indexes that cause filtered search degradation.
    - Automated Slack incident notifications detailing collection status and index counts.

    ## Who it's for
    - AI Infrastructure Engineers maintaining Qdrant vector database clusters.
    - Machine Learning Platform Engineers operating enterprise RAG search engines.
    - SREs safeguarding vector similarity search latency SLAs.

    ## Why orchestrate this with Kestra
    - **Automated Metric Surveillance**: Routinely checks vector database readiness without manual queries.
    - **Encrypted Credential Protection**: Safely injects Qdrant API keys via Kestra encrypted secrets.
    - **Incident Orchestration**: Notifies platform engineers directly in team collaboration channels.

    ## Prerequisites
    - Running Qdrant cluster with enabled REST API (`6333`).
    - API key configured in `QDRANT_API_KEY` secret.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `QDRANT_API_KEY` and `SLACK_WEBHOOK` secrets.
    3. Specify `qdrant_url` and target `collection_name`.
    4. Enable the schedule trigger for continuous vector schema surveillance.

    ## How to extend
    - Automatically create missing payload indexes via `PUT /collections/{name}/index`.
    - Check HNSW indexing progress via `/collections/{name}` telemetry.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [Qdrant Collections API](https://qdrant.tech/documentation/concepts/collections/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - AI
    - Data
