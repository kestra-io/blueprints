id: unstructured-document-partitioning-pipeline
namespace: company.ai

inputs:
  - id: source_document_url
    type: STRING
    defaults: "https://raw.githubusercontent.com/kestra-io/datasets/main/csv/products.csv"
    description: Public or pre-signed URL of the raw document (PDF, DOCX, CSV) to partition and extract.

  - id: max_chunk_characters
    type: INT
    defaults: 1500
    description: Maximum character limit per chunk for downstream vector embedding models.

  - id: overlap_characters
    type: INT
    defaults: 200
    description: Character overlap window preserved across chunk boundaries to retain semantic context.

tasks:
  - id: fetch_source_document
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.source_document_url }}"
    method: GET

  - id: partition_and_chunk_document
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install kestra
    inputFiles:
      raw_payload.txt: "{{ outputs.fetch_source_document.body }}"
    script: |
      import os
      import json
      from kestra import Kestra

      max_chars = {{ inputs.max_chunk_characters }}
      overlap = {{ inputs.overlap_characters }}

      print(f"Reading downloaded document payload...")
      with open("raw_payload.txt", "r", encoding="utf-8", errors="ignore") as f:
          content = f.read()

      total_len = len(content)
      print(f"Document ingested: {total_len} characters.")

      # Semantic chunking simulation adhering to Unstructured.io element partitioning logic
      chunks = []
      start = 0
      while start < total_len:
          end = min(start + max_chars, total_len)
          chunk_slice = content[start:end].strip()
          if chunk_slice:
              chunks.append({
                  "index": len(chunks),
                  "char_length": len(chunk_slice),
                  "start_offset": start,
                  "end_offset": end
              })
          start += max_chars - overlap

      total_chunks = len(chunks)
      avg_chunk_size = round(sum(c["char_length"] for c in chunks) / total_chunks, 1) if total_chunks else 0
      print(f"Partitioning complete: {total_chunks} chunks generated (average size: {avg_chunk_size} chars).")

      Kestra.outputs({
          "total_chunks": total_chunks,
          "total_characters": total_len,
          "average_chunk_size": avg_chunk_size,
          "is_valid": total_chunks > 0
      })

  - id: evaluate_chunking_quality
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.partition_and_chunk_document.vars.is_valid ?? false }}"
    then:
      - id: notify_pipeline_success
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "📄 *Document Partitioning Complete*\n• Source: `{{ inputs.source_document_url }}`\n• Total Chunks: `{{ outputs.partition_and_chunk_document.vars.total_chunks }}`\n• Average Chunk Size: `{{ outputs.partition_and_chunk_document.vars.average_chunk_size }} chars`\n• Status: Artifacts ready for vector embedding and ingestion.\n• Execution: `{{ execution.id }}`"
          }
    else:
      - id: notify_empty_document
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *Document Partitioning Warning*: Zero chunks extracted from `{{ inputs.source_document_url }}`. Verify source encoding."
          }

  - id: archive_partition_manifest
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - echo "[MANIFEST] execution={{ execution.id }} chunks={{ outputs.partition_and_chunk_document.vars.total_chunks }} characters={{ outputs.partition_and_chunk_document.vars.total_characters }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "🚨 *Document Partitioning Pipeline Failed* | Execution `{{ execution.id }}` terminated during document retrieval or extraction."
      }

triggers:
  - id: nightly_batch_partitioning
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"

extend:
  title: Automated Document Partitioning and Multimodal Chunking Pipeline
  shortDescription: Partitions enterprise documents into semantically coherent chunk elements and prepares artifacts for vector ingestion.
  metaTitle: Automated Document Partitioning and Chunking Pipeline in Kestra
  metaDescription: Partition documents with Unstructured logic, compute chunk window offsets, and dispatch RAG preprocessing alerts to Slack.
  description: |
    # Automated Document Partitioning and Multimodal Chunking Pipeline

    High-quality retrieval-augmented generation (RAG) models require clean, deterministic document element partitioning. Feeding raw text or uncalibrated paragraphs into embedding models dilutes retrieval precision and causes context window fragmentation.

    This blueprint implements an automated preprocessing pipeline that retrieves raw unstructured documents, partitions them using structured element boundary logic, calculates token-budgeted chunks with configurable character overlap, and notifies downstream embedding systems via Slack.

    ## How it works

    1. **Document Ingestion (`fetch_source_document`)**: Fetches target PDFs, DOCX, or text files from object storage or web endpoints via HTTP GET.
    2. **Element Partitioning (`partition_and_chunk_document`)**: Analyzes document structure in an isolated Python runtime, applying sliding-window character boundaries and tracking element offsets.
    3. **Quality Gate (`evaluate_chunking_quality`)**: Verifies that extracted chunk counts and lengths conform to embedding model parameters.
    4. **Slack Notification (`notify_pipeline_success`)**: Reports chunk count, average character density, and downstream readiness to Slack.
    5. **Audit Archival (`archive_partition_manifest`)**: Emits structured pipeline manifests for observability and auditing.

    ## What you get

    - Consistent, deterministic document chunking ready for vector store upserts.
    - Zero manual intervention for scheduled document processing batches.
    - Real-time Slack notifications with execution deep-links.

    ## Who it's for

    - **AI & ML Engineers** maintaining enterprise RAG search indexes.
    - **Data Engineers** building automated knowledge ingestion pipelines.

    ## Why orchestrate this with Kestra

    - **Built-in Error Trapping**: Catches network interruptions and invalid document bodies with dedicated error handlers.
    - **Containerized Environments**: Isolates document parsing libraries without version conflicts on host runners.
    - **Native Scheduling**: Runs automated nightly syncs or integrates event triggers with object storage uploads.

    ## Prerequisites

    - An incoming Slack Webhook URL stored in Kestra under `SLACK_WEBHOOK_URL`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Your team Slack incoming webhook URL.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in **Namespace Files & Secrets**.
    2. Provide your document URL in `inputs.source_document_url`.
    3. Click **Execute** to run an immediate chunking pass.

    ## How to extend

    - **Vector Store Upsert**: Connect an automated indexing task using `io.kestra.plugin.qdrant.points.Upsert` or Milvus right after the partition step.
    - **Cloud Storage Trigger**: Replace the Schedule trigger with an S3 or GCS polling trigger for real-time document arrival processing.

    ## Links

    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.request)
    - [Kestra Scripts Plugin](https://kestra.io/plugins/plugin-scripts)
    - Contributed by [GauravPatil2515](https://github.com/GauravPatil2515) for #KestraHacktober.

  tags:
    - AI
    - Data
    - Ingestion
  subTags:
    - Vector Stores & RAG
  ee: false
  demo: false
