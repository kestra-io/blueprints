id: eventwatch
namespace: company.team
description: Aggregates Kubernetes Warning events per object and alerts on Slack when one spikes.

labels:
  project: eventwatch
  team: platform

inputs:
  - id: namespace
    type: STRING
    displayName: "Namespace"
    description: the namespace whose events to watch
    defaults: default
  - id: spike_threshold
    type: INT
    displayName: "Spike threshold"
    description: alert when an object's warning count reaches this
    defaults: 10
  - id: slack_webhook
    type: STRING
    displayName: "Slack Webhook URL"
    description: Incoming webhook URL of the Slack channel for alerts

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: checks for warning spikes every five minutes
    cron: "*/5 * * * *"
    timezone: UTC
    inputs:
      namespace: default
      spike_threshold: 10
      slack_webhook: "{{ secret('SLACK_WEBHOOK') }}"

tasks:
  - id: list_events
    type: io.kestra.plugin.scripts.shell.Commands
    description: lists all events in the namespace as JSON
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: bitnami/kubectl
    inputFiles:
      client.crt: "{{ secret('CLIENT_CRT') }}"
      client.key: "{{ secret('CLIENT_KEY') }}"
    commands:
      - kubectl get events -n {{ inputs.namespace }} -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > events.json
    outputFiles:
      - events.json

  - id: find_spikes
    type: io.kestra.plugin.scripts.python.Script
    description: aggregates warnings per object and finds the spiking ones
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: python:3.11
    dependencies:
      - kestra
    script: |
      import json
      from collections import Counter
      from kestra import Kestra

      namespace = """{{ inputs.namespace }}"""
      threshold = int("""{{ inputs.spike_threshold }}""")

      with open("""{{ outputs.list_events.outputFiles['events.json'] }}""") as f:
          events = json.load(f)['items']

      # objects we already alerted on, from the KV store (null on first run -> empty)
      raw_state = """{{ kv('eventwatch-state-' ~ inputs.namespace, errorOnMissing=false) }}"""
      already = set(json.loads(raw_state) if raw_state.strip() else [])

      groups = {}
      for e in events:
          if e.get('type') != 'Warning':
              continue
          obj = e.get('involvedObject', {}) or {}
          key = f"{obj.get('kind', '?')}/{obj.get('name', '?')}"
          g = groups.setdefault(key, {'count': 0, 'reasons': Counter(), 'sample': ''})
          n = e.get('count', 1) or 1
          g['count'] += n
          g['reasons'][e.get('reason', 'Unknown')] += n
          if not g['sample']:
              g['sample'] = (e.get('message') or '')[:200]

      spiking = {k: v for k, v in groups.items() if v['count'] >= threshold}
      new_keys = sorted(k for k in spiking if k not in already)

      lines = [f"*EventWatch - warning spike in '{namespace}'*", ""]
      for k in new_keys:
          v = spiking[k]
          reasons = ', '.join(f"{r} x{c}" for r, c in v['reasons'].most_common(3))
          lines.append(f"- *{k}*: {v['count']} warnings ({reasons})")
          if v['sample']:
              lines.append(f"  e.g.: {v['sample']}")
      lines.append("")
      lines.append("events expire on their own; fix the underlying issue and the spike fades.")
      alert_text = "\n".join(lines)

      Kestra.outputs({
          'new_spikes': new_keys,
          'count': len(new_keys),
          'alert_text': alert_text,
          'new_state_json': json.dumps(sorted(spiking.keys())),
      })

  - id: maybe_alert
    type: io.kestra.plugin.core.flow.If
    description: alerts only about new spikes
    condition: "{{ outputs.find_spikes.vars.count > 0 }}"
    then:
      - id: send_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: posts the warning spike alert to Slack
        url: "{{ inputs.slack_webhook }}"
        messageText: "{{ outputs.find_spikes.vars.alert_text }}"

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: remembers spiking objects, so faded spikes alert again next time
    key: "eventwatch-state-{{ inputs.namespace }}"
    value: "{{ outputs.find_spikes.vars.new_state_json }}"
    overwrite: true

extend:
  title: "EventWatch - Kubernetes warning event spike watcher"
  shortDescription: "Alerts on Slack when Kubernetes Warning events spike on any object, quoting the top reasons."
  metaTitle: "EventWatch: Kubernetes warning event spike watcher blueprint for Kestra"
  metaDescription: "A Kestra blueprint that aggregates Kubernetes Warning events per object and alerts on Slack when one spikes, without spamming."
  tags:
    - Infrastructure
  subTags:
    - Kubernetes
    - Infrastructure Automation
  ee: false
  demo: false
  description: |
    ## How it works

    1. `list_events` (`io.kestra.plugin.scripts.shell.Commands`) dumps the namespace's events as JSON with kubectl.
    2. `find_spikes` (`io.kestra.plugin.scripts.python.Script`) keeps only Warning events, groups them by involved object, and sums the per-event counts. Any object at or above `spike_threshold` is spiking. It compares against the KV state so only new spikes alert, and quotes the top reasons plus one sample message per object.
    3. `maybe_alert` (`io.kestra.plugin.core.flow.If`) posts the Slack alert only when there is a new spike.
    4. `save_state` (`io.kestra.plugin.core.kv.Set`) writes back the currently spiking objects. Events expire on their own in Kubernetes, so a fixed issue fades from the list and a fresh spike alerts again.

    ## What you get

    - A five-minute check on the most underused diagnostic stream in Kubernetes, no agent to install.
    - Slack alerts that catch trouble early: which object is spiking, how many warnings, the top reasons, and a sample message.
    - No alert spam: the KV-backed memory remembers what already spiked, and faded spikes drop out on their own.
    - Quiet runs when warnings stay flat.

    ## Who it's for

    Anyone running Kubernetes who only looks at events after something already broke. This watches them continuously and tells you when the noise becomes a signal.

    ## Why orchestrate this with Kestra

    Events are ephemeral and easy to miss; a scheduled flow turns them into a reliable signal. Kestra holds the cluster credentials as secrets, keeps every run's findings where you can audit them, and the KV state means the second run does not re-alert the same spike.

    ## Prerequisites

    - A Kubernetes cluster with events you can list.
    - A kubeconfig client certificate and key with permission to list events in the target namespace.
    - Kestra with the Docker task runner available (used for the kubectl and Python steps).
    - A Slack Incoming Webhook URL.

    ### Secrets

    | Secret | What it is |
    | --- | --- |
    | `CLIENT_CRT` | base64-encoded client certificate from your kubeconfig |
    | `CLIENT_KEY` | base64-encoded client key from your kubeconfig |
    | `MASTERURL` | base64-encoded Kubernetes API server URL, reachable from inside the Kestra container |
    | `SLACK_WEBHOOK` | base64-encoded Slack Incoming Webhook URL |

    In Kestra OSS, secrets come from environment variables prefixed with `SECRET_` and must be base64-encoded. If the API URL uses `127.0.0.1` or `localhost`, replace it with `host.docker.internal` so the Kestra container can reach it.

    ## Quick start

    1. Start Kestra with the four secrets above as `SECRET_` environment variables.
    2. Import this flow and run it with your `namespace`: quiet if warnings are flat.
    3. Break something noisy (like a CrashLooping pod) and run again: the Slack alert names the object, the warning count, and the top reasons.
    4. Fix it, wait for events to expire, run again: quiet.

    ## How to extend

    - Watch Normal events too, for audit-style change tracking.
    - Split thresholds per reason (BackOff vs FailedMount) with a mapping input.
    - Run across all namespaces by looping the namespace input with a ForEach task.
    - Route alerts to PagerDuty or Opsgenie by swapping the Slack task for another notification task.

    ## Inputs

    | Input | Type | Default | What it does |
    | --- | --- | --- | --- |
    | `namespace` | STRING | `default` | the namespace whose events to watch |
    | `spike_threshold` | INT | `10` | alert when an object's warning count reaches this |
    | `slack_webhook` | STRING | (required) | Incoming webhook URL of the Slack channel for alerts |

    ## Links

    - [Kestra blueprint catalog](https://kestra.io/blueprints)
    - [Kubernetes events documentation](https://kubernetes.io/docs/reference/kubernetes-api/cluster-resources/event-v1/)
    - [Kestra secrets documentation](https://kestra.io/docs/concepts/secrets)

    ## Pitfalls

    - Events expire (default one hour), so a spike can fade before you investigate. The alert quotes the top reasons and a sample message so you have something to go on.
    - The count is summed across event objects, and Kubernetes aggregates repeated events into one object with a count. Bursty but distinct failures on the same object add up together.
    - One threshold for every reason: a chatty but harmless warning can trip it. Tune `spike_threshold` per namespace after the first week.
    - The flow is strictly read-only. It never touches workloads or deletes events.
