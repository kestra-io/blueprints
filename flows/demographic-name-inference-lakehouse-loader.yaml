id: demographic-name-inference-lakehouse-loader
namespace: company.analytics
description: Ingests demographic name frequency counts, statistical gender classifications, and probability confidence scores from Genderize.io into Parquet lakehouse storage via DuckDB, tracking demographic inference state in Kestra KV store.

inputs:
  - id: names
    type: ARRAY
    itemType: STRING
    description: List of given personal names to evaluate.
    defaults:
      - alex
      - jordan
      - taylor
      - morgan
      - sam
      - casey
      - riley
      - avery

  - id: high_confidence_threshold
    type: FLOAT
    description: Probability threshold to classify demographic inferences as high-confidence.
    defaults: 0.85

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known demographic name inferences.
    defaults: demographic_monitored_names_state

variables:
  default_state: "{}"

triggers:
  - id: monthly_demographic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 1 * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_demographics
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            state = json.loads(raw_state) if raw_state else {}
        except Exception:
            state = {}

        names = json.loads("""{{ inputs.names | toJson }}""")
        threshold = float("{{ inputs.high_confidence_threshold }}")

        headers = {"User-Agent": "KestraDemographicsLakehouse/1.0 (nlp-ops@kestra.io)"}

        records = []
        high_confidence_names = []
        new_state = dict(state)

        for n in names:
            try:
                url = f"https://api.genderize.io?name={n}"
                resp = requests.get(url, headers=headers, timeout=15)
                if resp.status_code == 200:
                    data = resp.json()
                    name_str = data.get("name", n)
                    gender = data.get("gender") or "unspecified"
                    probability = float(data.get("probability", 0.0) or 0.0)
                    sample_count = int(data.get("count", 0))

                    is_high_conf = probability >= threshold
                    is_new = name_str not in state

                    records.append({
                        "name": name_str,
                        "inferred_gender": gender,
                        "probability": probability,
                        "sample_count": sample_count,
                        "is_high_confidence": is_high_conf,
                        "is_new_name": is_new,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_high_conf:
                        high_confidence_names.append({"name": name_str, "gender": gender, "prob": probability})

                    new_state[name_str] = gender
            except Exception as e:
                print(f"Error fetching demographic inference for '{n}': {e}")

        with open("demographic_names.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE demographic_inferences AS SELECT * FROM read_json_auto('demographic_names.json')")
            con.execute("COPY demographic_inferences TO 'demographic_names_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY demographic_inferences TO 'demographic_names_archive.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE demographic_inferences (
                    name VARCHAR,
                    inferred_gender VARCHAR,
                    probability DOUBLE,
                    sample_count BIGINT,
                    is_high_confidence BOOLEAN,
                    is_new_name BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY demographic_inferences TO 'demographic_names_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY demographic_inferences TO 'demographic_names_archive.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_names_evaluated": len(records),
            "high_confidence_count": len(high_confidence_names),
            "high_confidence_names": high_confidence_names[:5],
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - demographic_names_archive.parquet
      - demographic_names_archive.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_demographics.vars.updated_state | toJson }}"

  - id: check_high_confidence
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_demographics.vars.high_confidence_count > 0 }}"
    then:
      - id: notify_confidence_results
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "📊 Demographic Name Analysis: Identified {{ outputs.ingest_and_transform_demographics.vars.high_confidence_count }} name(s) meeting the {{ inputs.high_confidence_threshold }} statistical confidence score."

outputs:
  - id: total_evaluated
    type: INT
    value: "{{ outputs.ingest_and_transform_demographics.vars.total_names_evaluated }}"
  - id: high_confidence_count
    type: INT
    value: "{{ outputs.ingest_and_transform_demographics.vars.high_confidence_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_demographics.outputFiles['demographic_names_archive.parquet'] }}"

extend:
  title: Demographic Name Inference and Classification Lakehouse Loader with DuckDB
  metaTitle: Demographic Name Inference Lakehouse Loader | Kestra
  shortDescription: Ingests demographic name frequency counts, statistical gender classifications, and probability confidence scores from Genderize.io into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Genderize.io API for demographic name inferences and statistical distributions, convert probability vectors into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, linguistic harmonization, and analytical lakehouse persistence of demographic name
    inferences, statistical gender distributions, sample frequencies, and probability confidence scores from Genderize.io into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`demographic_monitored_names_state`) for previous demographic classifications per name.
    2. **Genderize API Ingestion**: Queries the official Genderize.io REST API (`api.genderize.io`) across configured input name arrays.
    3. **DuckDB Statistical Normalization**: Unpacks probability confidence scores, census sample counts, and classification categories into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized demographic records into columnar Parquet and CSV files for NLP enrichment, marketing persona segmentation, and cohort modeling.
    5. **Confidence Evaluation & State Commitment**: Evaluates inferences against statistical confidence thresholds, logs summaries, and commits mappings to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of global demographic linguistic distributions.
    - Columnar Parquet datasets queryable with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - NLP Engineers and Data Scientists enriching customer profiles with demographic distributions.
    - Marketing Analytics Teams building persona segmentation models.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical demographic classifications across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `api.genderize.io`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting teams on demographic inference updates.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set your target `names` array.
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `monthly_demographic_sync` schedule for automated monthly updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition monthly demographic enrichment snapshots.
    - Connect an address and geolocation join step in DuckDB to cross-reference national census distributions.

    ## Links

    - [Genderize.io Documentation](https://genderize.io/)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
