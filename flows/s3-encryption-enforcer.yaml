id: s3-encryption-enforcer
namespace: company.team
description: |
  Unencrypted S3 buckets fail every compliance audit. This flow lists every
  bucket, probes each one for a default encryption configuration, and —
  only when you opt in with `auto_enforce: true` — applies one (AES256 by
  default, or aws:kms with your own key). Dry-run by default: without
  auto_enforce it only reports which buckets are exposed.

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs every Sunday at 04:00 UTC. Shipped disabled; enable after a first successful manual run.
    cron: "0 4 * * 0"
    disabled: true

inputs:
  - id: encryption_type
    type: SELECT
    defaults: AES256
    values:
      - AES256
      - aws:kms
    description: Server-side encryption to enforce — AES256 (SSE-S3) or aws:kms (SSE-KMS).
  - id: kms_key_id
    type: STRING
    defaults: ""
    description: KMS key ID or ARN used when encryption_type is aws:kms. Leave empty to use the AWS-managed key (aws/kms).
  - id: auto_enforce
    type: BOOL
    defaults: false
    description: When true, applies default encryption to unencrypted buckets. When false, audit only (dry-run).

tasks:
  - id: fetch_buckets
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: List all bucket names as a single comma-separated line for the audit loop.
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws s3api list-buckets --query "join(',', Buckets[].Name)" --output text | tr -d '\n'

  - id: audit_encryption
    type: io.kestra.plugin.core.flow.ForEach
    description: Check the default encryption configuration of every bucket.
    values: "{{ outputs.fetch_buckets.stdout.split(',') }}"
    tasks:
      - id: check_encryption
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Probe one bucket for default encryption — the API errors when no configuration exists, and that error is the signal.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - |
            BUCKET=$(echo "{{ taskrun.value }}" | tr -d '[:space:]')
            if [ -z "$BUCKET" ]; then
              echo "RESULT=SKIP"
              echo "ALGO=none"
              exit 0
            fi
            if aws s3api get-bucket-encryption --bucket "$BUCKET" > /tmp/enc.json 2>/dev/null; then
              ALGO=$(python3 -c "import json; print(json.load(open('/tmp/enc.json'))['ServerSideEncryptionConfiguration']['Rules'][0]['ApplyServerSideEncryptionByDefault']['SSEAlgorithm'])")
              echo "RESULT=ENCRYPTED"
              echo "ALGO=$ALGO"
            else
              echo "RESULT=UNENCRYPTED"
              echo "ALGO=none"
            fi

      - id: enforce
        type: io.kestra.plugin.core.flow.If
        description: Apply default encryption, but only in enforce mode and only to buckets missing it.
        condition: "{{ inputs.auto_enforce == true and outputs.check_encryption.vars.RESULT == 'UNENCRYPTED' }}"
        then:
          - id: apply_encryption
            type: io.kestra.plugin.aws.cli.AwsCLI
            description: Enable default bucket encryption with the selected algorithm.
            accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
            secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
            commands:
              - |
                BUCKET=$(echo "{{ taskrun.value }}" | tr -d '[:space:]')
                TYPE="{{ inputs.encryption_type }}"
                KMS="{{ inputs.kms_key_id }}"
                if [ "$TYPE" = "aws:kms" ]; then
                  if [ -n "$KMS" ]; then
                    RULE="{\"ApplyServerSideEncryptionByDefault\":{\"SSEAlgorithm\":\"aws:kms\",\"KMSMasterKeyID\":\"$KMS\"},\"BucketKeyEnabled\":true}"
                  else
                    RULE="{\"ApplyServerSideEncryptionByDefault\":{\"SSEAlgorithm\":\"aws:kms\"},\"BucketKeyEnabled\":true}"
                  fi
                else
                  RULE="{\"ApplyServerSideEncryptionByDefault\":{\"SSEAlgorithm\":\"AES256\"}}"
                fi
                if aws s3api put-bucket-encryption --bucket "$BUCKET" --server-side-encryption-configuration "{\"Rules\":[$RULE]}"; then
                  echo "ENFORCED=true"
                else
                  echo "ENFORCED=false"
                fi
        else:
          - id: log_dryrun
            type: io.kestra.plugin.core.log.Log
            message: "Dry-run: bucket {{ taskrun.value }} is unencrypted but auto_enforce is false — no changes made."

      - id: notify_decision
        type: io.kestra.plugin.core.flow.If
        description: Alert on buckets missing default encryption; log a clean line otherwise.
        condition: "{{ outputs.check_encryption.vars.RESULT == 'UNENCRYPTED' }}"
        then:
          - id: notify
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Report the unencrypted bucket and whether it was fixed or is still exposed.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "{% if inputs.auto_enforce %}:lock: *S3 default encryption enforced* — bucket `{{ taskrun.value }}` had no encryption configuration; applied `{{ inputs.encryption_type }}`{% if outputs.apply_encryption.vars.ENFORCED == 'false' %} but the API call FAILED — check the run log{% endif %}.{% else %}:warning: *S3 bucket without default encryption* — bucket `{{ taskrun.value }}` has no default encryption and will fail compliance audits. Still exposed — re-run with `auto_enforce: true` to apply `{{ inputs.encryption_type }}`.{% endif %}"
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "Bucket {{ taskrun.value }} already has default encryption ({{ outputs.check_encryption.vars.ALGO }})."

extend:
  title: S3 Encryption Enforcer
  metaTitle: Enforce S3 Default Encryption on Every Bucket | Kestra
  shortDescription: Audit every S3 bucket for default server-side encryption and optionally enforce AES256 or KMS — dry-run by default, nothing changes unless you say so.
  metaDescription: Find S3 buckets missing default encryption and optionally enforce AES256 or KMS. Weekly audit with Slack alerts, dry-run by default.
  description: |
    Unencrypted S3 buckets fail every compliance audit — SOC 2, HIPAA, and the CIS benchmarks all require encryption at rest, and a single bucket without default encryption is a finding. Checking every bucket by hand is miserable, so nobody does it regularly. This blueprint audits all your buckets weekly and, only if you opt in, turns on default encryption where it's missing.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 04:00 UTC (shipped disabled).
    2. `fetch_buckets` lists every bucket; `audit_encryption` loops over them and probes each with `get-bucket-encryption` — the API errors when no configuration exists, and that error is the signal.
    3. When `auto_enforce` is true, the `enforce` gate applies `put-bucket-encryption` with AES256 (or aws:kms with your key, plus S3 Bucket Keys) to buckets missing it.
    4. Every unencrypted bucket triggers a Slack alert saying whether it was fixed or is still exposed; clean buckets get a log line.

    ## What you get

    - A weekly inventory of buckets missing default encryption.
    - One-input remediation: flip `auto_enforce` to fix every exposed bucket in a single run.
    - AES256 or KMS enforcement with your own key, including S3 Bucket Keys for KMS.
    - Dry-run by default — reporting only until you explicitly enable enforcement.

    ## Who it's for

    Platform and security engineers who own AWS compliance and are tired of discovering unencrypted buckets during audits instead of before them.

    ## Why orchestrate this with Kestra

    A CLI one-liner finds today's gaps and is forgotten by next week. As a scheduled flow the audit runs itself, every enforcement is logged, and the enforce toggle is a visible input — enabling it is a deliberate, reviewable decision, not a code change.

    ## Prerequisites

    - AWS credentials with `s3:ListAllMyBuckets`, `s3:GetBucketEncryption`, and (for enforce mode) `s3:PutBucketEncryption`.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the S3 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the S3 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the audit report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Run once with `auto_enforce: false` and review the Slack report.
    3. When happy, set `auto_enforce: true` (and `encryption_type` / `kms_key_id` if you want KMS) and re-run.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Require KMS with a per-bucket key via a bucket-name to key-id mapping input.
    - Also audit bucket policies for TLS enforcement (`aws:SecureTransport`).
    - Push findings to Security Hub instead of Slack.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [S3 default encryption](https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-encryption.html)
    - [S3 put-bucket-encryption API](https://docs.aws.amazon.com/cli/latest/reference/s3api/put-bucket-encryption.html)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
