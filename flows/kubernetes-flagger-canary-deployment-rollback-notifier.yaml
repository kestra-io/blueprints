id: kubernetes-flagger-canary-deployment-rollback-notifier
namespace: company.platform

description: |
  Tracks Kubernetes Flagger canary deployment progressive traffic promotions, alerting platform teams on Slack when automated metric rollback events trigger.

concurrency:
  limit: 1

inputs:
  - id: cluster_context
    type: STRING
    displayName: Cluster Identifier
    defaults: "k8s-prod-us-east-1"
    description: Target Kubernetes cluster identifier hosting the progressive deployment workloads.

  - id: namespace_name
    type: STRING
    displayName: Kubernetes Namespace
    defaults: "production-apps"
    description: Target Kubernetes namespace hosting the Flagger Canary resource.

  - id: canary_name
    type: STRING
    displayName: Canary Resource Name
    defaults: "frontend-service-canary"
    description: Name of the target Flagger Canary custom resource to inspect.

  - id: max_allowed_failed_checks
    type: INT
    displayName: Max Failed Metric Iterations
    defaults: 3
    description: Maximum failed metric iterations before Flagger initiates automated rollback.

  - id: alert_on_rollback
    type: BOOL
    displayName: Alert on Rollback
    defaults: true
    description: Whether to dispatch automated Slack incident notifications when rollback occurs.

tasks:
  - id: scan_flagger_canary_state
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Flagger Canary custom resource and emits promotion and rollback status.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      NAMESPACE: "{{ inputs.namespace_name }}"
      CANARY_NAME: "{{ inputs.canary_name }}"
      MAX_FAILED_CHECKS: "{{ inputs.max_allowed_failed_checks }}"
      KUBERNETES_API_SERVER: "{{ secret('KUBERNETES_API_SERVER') }}"
      KUBERNETES_SERVICE_ACCOUNT_TOKEN: "{{ secret('KUBERNETES_SERVICE_ACCOUNT_TOKEN') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      canary_name = os.environ.get("CANARY_NAME", "frontend-service-canary").strip()
      ns = os.environ.get("NAMESPACE", "production-apps").strip()
      max_failed = int(os.environ.get("MAX_FAILED_CHECKS", 3))
      api_server = os.environ.get("KUBERNETES_API_SERVER", "").rstrip("/")
      token = os.environ.get("KUBERNETES_SERVICE_ACCOUNT_TOKEN", "")

      if not api_server or not token:
          print("ERROR: KUBERNETES_API_SERVER and KUBERNETES_SERVICE_ACCOUNT_TOKEN secrets must be configured.", file=sys.stderr)
          sys.exit(1)

      headers = {"Authorization": f"Bearer {token}", "Accept": "application/json"}
      url = f"{api_server}/apis/flagger.app/v1beta1/namespaces/{ns}/canaries/{canary_name}"
      print(f"Querying Flagger Canary status from {url}...")

      try:
          resp = requests.get(url, headers=headers, timeout=15, verify=False)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"ERROR: Failed to query Flagger Canary CRD at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      status = data.get("status", {})
      current_phase = status.get("phase", "Unknown")
      failed_checks = int(status.get("failedChecks", 0))
      weight = int(status.get("canaryWeight", 0))
      last_applied_spec = status.get("lastAppliedSpec", "unknown")

      has_rollback = current_phase in ["Failed", "Rollback"] or failed_checks >= max_failed

      report = {
          "canary_name": canary_name,
          "namespace": ns,
          "phase": current_phase,
          "traffic_weight": weight,
          "failed_checks_count": failed_checks,
          "last_applied_spec": last_applied_spec,
          "has_rollback_event": has_rollback,
          "recommended_action": f"kubectl describe canary {canary_name} -n {ns} && kubectl logs deployment/flagger -n flagger-system"
      }

      with open("flagger_canary_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      print(f"Flagger Canary {canary_name} in {ns}: Phase={current_phase}, Failed={failed_checks}, Rollback={has_rollback}")
      Kestra.outputs({
          "canary_name": canary_name,
          "namespace": ns,
          "phase": current_phase,
          "failed_checks_count": failed_checks,
          "last_applied_spec": last_applied_spec,
          "has_rollback_event": has_rollback
      })

  - id: check_canary_rollback_event
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether audited operational metrics breached configured tolerance thresholds.
    condition: "{{ outputs.scan_flagger_canary_state.vars.has_rollback_event and inputs.alert_on_rollback }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident notifications to platform engineering teams on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-deployments",
            "text": "CRITICAL: Flagger Canary Deployment Rollback for `{{ outputs.scan_flagger_canary_state.vars.canary_name }}` in Namespace `{{ outputs.scan_flagger_canary_state.vars.namespace }}`. Current Phase: `{{ outputs.scan_flagger_canary_state.vars.phase }}`. Failed Metric Checks: {{ outputs.scan_flagger_canary_state.vars.failed_checks_count }}/{{ inputs.max_allowed_failed_checks }}. Spec: `{{ outputs.scan_flagger_canary_state.vars.last_applied_spec }}`."
          }
    else:
      - id: log_healthy_canary_state
        type: io.kestra.plugin.core.log.Log
        description: Records healthy state in execution history when operational parameters remain within nominal limits.
        message: "Flagger canary progression nominal for {{ outputs.scan_flagger_canary_state.vars.canary_name }}: Phase={{ outputs.scan_flagger_canary_state.vars.phase }}."

triggers:
  - id: scheduled_canary_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: canary_name
    type: STRING
    description: Inspected Flagger Canary resource name.
    value: "{{ outputs.scan_flagger_canary_state.vars.canary_name }}"
  - id: namespace
    type: STRING
    description: Target Kubernetes namespace.
    value: "{{ outputs.scan_flagger_canary_state.vars.namespace }}"
  - id: phase
    type: STRING
    description: Current Flagger canary promotion phase.
    value: "{{ outputs.scan_flagger_canary_state.vars.phase }}"
  - id: failed_checks_count
    type: INT
    description: Count of failed metric iterations.
    value: "{{ outputs.scan_flagger_canary_state.vars.failed_checks_count }}"
  - id: has_rollback_event
    type: BOOLEAN
    description: True if canary failed or entered rollback, false otherwise.
    value: "{{ outputs.scan_flagger_canary_state.vars.has_rollback_event }}"

extend:
  title: Kubernetes Flagger Canary Deployment Rollback Notifier
  metaTitle: Kubernetes Flagger Canary Rollback Notifier
  shortDescription: Tracks Kubernetes Flagger canary deployment progressive traffic promotions, alerting platform teams on Slack when automated metric rollback events trigger.
  metaDescription: Tracks Kubernetes Flagger canary deployment progressive traffic promotions, alerting platform teams on Slack when automated metric rollback events trigger.
  description: |
    Automates continuous health and progressive traffic promotion surveillance for Kubernetes Flagger canary deployments.

    ## How it works
    1. Connects to Kubernetes API server and queries the Flagger Canary custom resource status.
    2. Inspects canary promotion phase, failed check counters, and traffic weights.
    3. Dispatches immediate Slack notifications when automated metric degradation triggers rollback.

    ## Prerequisites
    - Kubernetes cluster with Flagger operator deployed.
    - Secrets `KUBERNETES_API_SERVER` and `KUBERNETES_SERVICE_ACCOUNT_TOKEN` configured.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Configure cluster credentials in secrets.
    3. Set `namespace_name` and `canary_name`.
    4. Run the workflow to inspect canary deployment status.

    ## Links
    - [Flagger Documentation](https://flagger.app/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Kubernetes Operations
    - CI/CD & Deployment
  ee: false
  demo: false
