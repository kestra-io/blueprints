id: auth0-tenant-failed-login-anomaly-sentinel
namespace: company.sre

description: |
  Audits Auth0 tenant authentication event streams to detect anomalous failed login velocity,
  isolating credential stuffing and brute-force attacks to protect identity infrastructure.

concurrency:
  limit: 1

inputs:
  - id: auth0_domain
    type: STRING
    displayName: Auth0 Domain
    defaults: company.us.auth0.com
    description: Auth0 tenant domain identifier hosting customer or workforce authentication.

  - id: failed_logins_threshold
    type: INT
    displayName: Failed Logins Threshold
    defaults: 25
    description: Total failed login events within the query lookback window triggering security alerts.

  - id: lookback_minutes
    type: INT
    displayName: Lookback Window (Minutes)
    defaults: 15
    description: Time range in minutes across which Auth0 authentication logs are audited.

  - id: alert_on_breach
    type: BOOL
    displayName: Alert on Breach
    defaults: true
    description: Whether to dispatch automated Slack incident notifications when threshold breaches are detected.

tasks:
  - id: scan_auth0_failed_logins
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Auth0 Management API v2 for failed authentication and credential stuffing anomalies.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      AUTH0_DOMAIN: "{{ inputs.auth0_domain }}"
      AUTH0_TOKEN: "{{ secret('AUTH0_MANAGEMENT_TOKEN') }}"
      LOOKBACK_MINS: "{{ inputs.lookback_minutes }}"
      THRESHOLD: "{{ inputs.failed_logins_threshold }}"
    script: |
      import os
      import json
      from datetime import datetime, timedelta, timezone
      import requests
      from kestra import Kestra

      domain = os.environ.get("AUTH0_DOMAIN", "").strip()
      token = os.environ.get("AUTH0_TOKEN", "").strip()
      lookback_mins = int(os.environ.get("LOOKBACK_MINS", 15))
      threshold = int(os.environ.get("THRESHOLD", 25))

      headers = {
          "Authorization": f"Bearer {token}",
          "Accept": "application/json"
      }

      url = f"https://{domain}/api/v2/logs"
      params = {
          "q": 'type:"f" OR type:"fu"',
          "per_page": 100,
          "sort": "date:-1"
      }

      failed_count = 0
      ip_counts = {}
      targeted_usernames = []
      now = datetime.now(timezone.utc)
      cutoff = now - timedelta(minutes=lookback_mins)

      try:
          resp = requests.get(url, headers=headers, params=params, timeout=20)
          if resp.status_code == 200:
              logs = resp.json()
              for log in logs:
                  log_date_str = log.get("date")
                  if log_date_str:
                      try:
                          log_dt = datetime.fromisoformat(log_date_str.replace("Z", "+00:00"))
                          if log_dt < cutoff:
                              continue
                      except Exception:
                          pass
                  
                  failed_count += 1
                  ip = log.get("ip", "unknown")
                  ip_counts[ip] = ip_counts.get(ip, 0) + 1
                  user = log.get("user_name") or log.get("user_id")
                  if user and user not in targeted_usernames:
                      targeted_usernames.append(user)
          else:
              print(f"Auth0 API returned status code {resp.status_code}: {resp.text}")
      except Exception as e:
          print(f"Error querying Auth0 logs: {e}")

      is_anomaly = failed_count >= threshold
      top_suspicious_ips = sorted(ip_counts.items(), key=lambda x: x[1], reverse=True)[:5]

      report = {
          "domain": domain,
          "failed_count": failed_count,
          "threshold": threshold,
          "is_anomaly": is_anomaly,
          "top_ips": [ip[0] for ip in top_suspicious_ips],
          "unique_targeted_users": len(targeted_usernames),
          "recommended_action": f"Inspect Auth0 Attack Protection dashboard at https://manage.auth0.com/#/security and configure IP rate limits." if is_anomaly else "Authentication traffic nominal."
      }

      with open("auth0_report.json", "w") as f:
          json.dump(report, f)

      Kestra.outputs({
          "domain": domain,
          "failed_login_count": failed_count,
          "is_anomaly": is_anomaly,
          "top_suspicious_ips": json.dumps([ip[0] for ip in top_suspicious_ips]),
          "unique_targeted_users": len(targeted_usernames)
      })

  - id: check_failed_login_anomaly
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether failed login events exceeded operational security thresholds.
    condition: "{{ outputs.scan_auth0_failed_logins.vars.is_anomaly and inputs.alert_on_breach }}"
    then:
      - id: notify_slack_security_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority credential stuffing and brute-force security alert to SecOps on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-alerts",
            "username": "Auth0-Security-Sentinel",
            "text": "CRITICAL: Auth0 tenant `{{ inputs.auth0_domain }}` detected anomalous failed login surge! Failed Logins: `{{ outputs.scan_auth0_failed_logins.vars.failed_login_count }}` (Threshold: `{{ inputs.failed_logins_threshold }}`). Suspicious Source IPs: `{{ outputs.scan_auth0_failed_logins.vars.top_suspicious_ips }}`. Unique Targeted Users: `{{ outputs.scan_auth0_failed_logins.vars.unique_targeted_users }}`."
          }
    else:
      - id: log_nominal_auth_state
        type: io.kestra.plugin.core.log.Log
        description: Records operational telemetry confirming authentication activity complies with security baselines.
        message: "Auth0 tenant {{ inputs.auth0_domain }} authentication audit nominal: {{ outputs.scan_auth0_failed_logins.vars.failed_login_count }} failed attempts within {{ inputs.lookback_minutes }} minutes."

  - id: export_auth0_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured compliance manifest detailing authentication anomalies for SIEM ingestion.
    format:
      domain: "{{ inputs.auth0_domain }}"
      failed_logins: "{{ outputs.scan_auth0_failed_logins.vars.failed_login_count }}"
      is_anomaly: "{{ outputs.scan_auth0_failed_logins.vars.is_anomaly }}"
      suspicious_ips: "{{ outputs.scan_auth0_failed_logins.vars.top_suspicious_ips }}"
      audited_at: "{{ execution.startDate }}"

triggers:
  - id: scheduled_auth0_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated scheduled trigger inspecting Auth0 tenant logs every fifteen minutes.
    cron: "*/15 * * * *"

extend:
  title: Auth0 Tenant Failed Login Anomaly Sentinel
  metaTitle: Auth0 Tenant Failed Login Anomaly Sentinel Blueprint
  shortDescription: Audits Auth0 authentication event streams to detect credential stuffing and failed login velocity spikes.
  metaDescription: Audits Auth0 tenant authentication logs for anomalous failed login velocity, detects credential stuffing attacks, and alerts security teams via Slack.
  description: |
    Customer Identity and Access Management (CIAM) systems are the front line of enterprise security. In platforms powered by Auth0, automated threat actors continuously execute credential stuffing attacks using leaked credential dumps and distributed botnets. When attack volumes surge past normal baselines, account takeover (ATO) risk escalates, legitimate users get locked out by brute-force shields, and customer trust erodes. While Auth0 provides built-in attack protection, security operations teams require external sentinel workflows to independently audit authentication event streams, isolate malicious IP subnets, and dispatch actionable incident notifications to on-call SecOps engineers.

    ## How it works
    1. **Automated scheduled execution**: Triggers every 15 minutes via cron (`*/15 * * * *`) or on-demand via event webhooks.
    2. **Log stream ingestion**: Executes a containerized Python script querying the Auth0 Management API v2 `/api/v2/logs` endpoint with filters for failed login events (`type:"f"` and `type:"fu"`).
    3. **Time-window filtering**: Evaluates events strictly within the configured lookback window (default 15 minutes) to avoid processing stale historical errors.
    4. **Threat isolation and IP clustering**: Aggregates failed authentication attempts by client IP address and enumerates distinct targeted usernames.
    5. **Threshold evaluation**: Compares aggregate failed attempts against the security baseline threshold using an `io.kestra.plugin.core.flow.If` conditional block.
    6. **Incident dispatch**: Emits rich Slack notifications containing top offending source IPs and targeted user counts.
    7. **Audit manifest persistence**: Outputs a structured JSON compliance manifest for automated SIEM or data lake ingestion.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_auth0_audit Schedule Trigger] --> B[scan_auth0_failed_logins Python Script]
      B --> C[check_failed_login_anomaly Flowable If]
      C -- Anomaly Detected --> D[notify_slack_security_alert Webhook]
      C -- Nominal Traffic --> E[log_nominal_auth_state Log]
      D --> F[export_auth0_manifest Return]
      E --> F
    ```

    ## What you get
    - Proactive detection of distributed credential stuffing and brute-force attacks before accounts are compromised.
    - Automated extraction and aggregation of top suspicious client IP addresses involved in failed authentication attempts.
    - Contextual Slack notifications with direct Auth0 Attack Protection mitigation guidelines.
    - Structured JSON security manifest suitable for SIEM archiving and SOC2 access monitoring compliance.

    ## Who it's for
    - Security Operations (SecOps) teams monitoring customer identity and access management (CIAM).
    - Platform Security Engineers configuring automated IP rate-limiting, WAF rules, and bot defenses.
    - Compliance Officers tracking unauthorized access attempt velocities and identity attack trends.

    ## Why orchestrate this with Kestra
    Auth0 provides log streams, but analyzing failed login velocity across rolling intervals requires external log forwarders or expensive SIEM ingestion. Kestra executes a lightweight, scheduled sentinel directly against Auth0 Management API v2, evaluates anomaly thresholds, extracts suspicious IPs, and delivers real-time Slack triage cards without heavy infrastructure.

    ## Use cases
    - **Credential stuffing detection**: Detect sudden surges in authentication failures against high-value customer accounts.
    - **Distributed brute-force identification**: Isolate multiple IP addresses attempting dictionary attacks against enterprise employee logins.
    - **Identity platform SLO tracking**: Monitor authentication error rates to ensure identity tenant availability stays within SLAs.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `auth0_domain` | `STRING` | `company.us.auth0.com` | Auth0 tenant domain identifier hosting customer or workforce authentication. |
    | `failed_logins_threshold` | `INT` | `25` | Total failed login events within the query lookback window triggering security alerts. |
    | `lookback_minutes` | `INT` | `15` | Time range in minutes across which Auth0 authentication logs are audited. |
    | `alert_on_breach` | `BOOL` | `true` | Whether to dispatch automated Slack incident notifications when threshold breaches are detected. |

    ## Expected outputs
    - `{{ outputs.scan_auth0_failed_logins.vars.domain }}`: Auth0 tenant domain evaluated during execution.
    - `{{ outputs.scan_auth0_failed_logins.vars.failed_login_count }}`: Number of failed login events recorded in the lookback window.
    - `{{ outputs.scan_auth0_failed_logins.vars.is_anomaly }}`: Boolean flag indicating whether the security threshold was breached.
    - `{{ outputs.scan_auth0_failed_logins.vars.top_suspicious_ips }}`: JSON array of top offending source IP addresses.
    - `{{ outputs.export_auth0_manifest.value }}`: Structured dictionary containing the consolidated security audit summary.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra workers to the Auth0 Management API endpoint (`https://<tenant>.auth0.com`).
    - An Auth0 Machine-to-Machine Application authorized for the Auth0 Management API with `read:logs` and `read:logs_users` scopes.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `AUTH0_MANAGEMENT_TOKEN`: Auth0 Management API v2 access token with `read:logs` permissions.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch security alerts.

    ## Quick start
    1. Register `AUTH0_MANAGEMENT_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra secret storage.
    2. Import this blueprint into your Kestra instance under the `company.sre` namespace.
    3. Configure `auth0_domain` and adjust `failed_logins_threshold` to match your organization's baseline.
    4. Run a manual execution to verify API connectivity and confirm Slack notification delivery.

    ## Common pitfalls and troubleshooting
    - **Token expiration**: Auth0 Management API tokens generated from developer consoles expire after 24 hours; configure an automated OAuth2 token refresh workflow for unattended production execution.
    - **Rate limiting**: The Auth0 Management API enforces rate limits per tenant; the 15-minute scheduled poll safely avoids API throttling.
    - **Log search query syntax**: Auth0 Lucene query syntax requires exact quotes around event codes (`type:"f"` for failed logins).

    ## How to extend
    - **Automated IP blocking**: Add an HTTP task to update AWS WAF or Cloudflare IP blocklists when an IP exceeds 50 failed logins.
    - **SIEM export**: Stream the JSON audit manifest directly to AWS S3, Snowflake, or Elasticsearch for long-term SOC2 storage.
    - **Multi-tenant iteration**: Audit multiple regional Auth0 tenants sequentially using `io.kestra.plugin.core.flow.ForEach`.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Auth0 Management API v2 Logs Documentation](https://auth0.com/docs/api/management/v2/logs)
    - [Auth0 Log Event Type Code Reference](https://auth0.com/docs/deploy-monitor/logs/log-event-type-codes)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
