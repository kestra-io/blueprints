id: auth0-tenant-failed-login-anomaly-sentinel
namespace: company.sre

description: Audits Auth0 tenant identity management logs to detect credential stuffing attacks, brute-force anomalies, and failed login volume spikes.

concurrency:
  limit: 1

inputs:
  - id: auth0Domain
    type: STRING
    displayName: Auth0 Domain
    defaults: "company.us.auth0.com"
    description: Auth0 tenant domain identifier.

  - id: maxFailedLoginsThreshold
    type: INT
    displayName: Max Failed Logins Threshold
    defaults: "25"
    description: Failed login event count threshold triggering credential stuffing alerts.

  - id: auth0ManagementToken
    type: SECRET
    displayName: Auth0 Management API Token
    defaults: "auth0_secret_token"
    description: Encrypted Auth0 Management API v2 token with read:logs scope.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: "https://hooks.slack.com/services/T00/B00/XXXX"
    description: Encrypted Slack Incoming Webhook endpoint for alerting SecOps teams.

tasks:
  - id: evaluate_auth0_failed_logins
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Auth0 Management API v2 for recent failed login and unauthorized events.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      AUTH0_TOKEN: "{{ inputs.auth0ManagementToken ?? '' }}"
      MEILI_KEY: "{{ inputs.meilisearchMasterKey ?? '' }}"
      DT_TOKEN: "{{ inputs.dynatraceApiToken ?? '' }}"
      SNYK_TOKEN: "{{ inputs.snykApiToken ?? '' }}"
      TS_KEY: "{{ inputs.tailscaleApiKey ?? '' }}"
      GITLAB_TOKEN: "{{ inputs.gitlabToken ?? '' }}"
      POSTMAN_API_KEY: "{{ inputs.postmanApiKey ?? '' }}"
      LD_API_KEY: "{{ inputs.launchDarklyApiKey ?? '' }}"
      PINGDOM_TOKEN: "{{ inputs.pingdomApiToken ?? '' }}"
      BOUNDARY_TOKEN: "{{ inputs.boundaryToken ?? '' }}"
    script: |
      import os
      import json
      from datetime import datetime, timedelta, timezone
      import requests
      
      domain = "{{ inputs.auth0Domain }}"
      token = os.getenv('AUTH0_TOKEN')
      threshold = {{ inputs.maxFailedLoginsThreshold }}
      
      headers = {
          "Authorization": f"Bearer {token}",
          "Accept": "application/json"
      }
      
      url = f"https://{domain}/api/v2/logs"
      params = {
          "q": 'type:"f" OR type:"fu"',
          "per_page": 50,
          "sort": "date:-1"
      }
      
      resp = requests.get(url, headers=headers, params=params, timeout=15)
      logs = resp.json() if resp.status_code == 200 and isinstance(resp.json(), list) else []
      
      failed_count = len(logs)
      is_anomaly = failed_count >= threshold
      targeted_ips = list(set([l.get("ip") for l in logs if l.get("ip")]))[:5]
      
      report = {
          "domain": domain,
          "failed_login_count": failed_count,
          "threshold": threshold,
          "is_anomaly": is_anomaly,
          "suspicious_ips": targeted_ips,
          "recommended_action": f"Enable Auth0 Attack Protection or ban offending IPs: {targeted_ips}" if is_anomaly else "Authentication traffic nominal."
      }
      
      with open("auth0_report.json", "w") as f:
          json.dump(report, f)
      
      print(f"Auth0 Tenant {domain}: {failed_count} failed logins. Anomaly: {is_anomaly}")

  - id: check_failed_login_anomaly
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether failed login events exceeded threshold.
    condition: "{{ json(read('auth0_report.json')).is_anomaly }}"
    then:
      - id: notify_slack_security_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches credential stuffing and failed login surge warning to SecOps on Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "Auth0 Security Alert: Tenant *{{ json(read('auth0_report.json')).domain }}* detected {{ json(read('auth0_report.json')).failed_login_count }} failed logins! Threshold: {{ inputs.maxFailedLoginsThreshold }}. Top IPs: {{ json(read('auth0_report.json')).suspicious_ips }}. Runbook: {{ json(read('auth0_report.json')).recommended_action }}"
          }
    else:
      - id: log_nominal_auth_state
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal authentication status when failed logins remain below threshold.
        message: "Auth0 tenant {{ json(read('auth0_report.json')).domain }} authentication activity is nominal with {{ json(read('auth0_report.json')).failed_login_count }} failed attempts."

  - id: export_auth0_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured Auth0 authentication security audit report.
    format: "{{ json(read('auth0_report.json')) }}"

triggers:
  - id: fifteen_minute_auth0_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled audit inspecting Auth0 authentication logs every fifteen minutes.
    cron: "*/15 * * * *"

extend:
  title: Auth0 Tenant Failed Login Anomaly Sentinel
  shortDescription: Audits Auth0 authentication logs for credential stuffing and failed login velocity spikes.
  metaTitle: Auth0 Tenant Failed Login Anomaly Sentinel | Kestra
  metaDescription: Audits Auth0 tenant authentication logs for anomalous failed login velocity, detects credential stuffing attacks, and alerts security teams via Slack.
  description: |
    Audits Auth0 tenant identity management logs to detect credential stuffing attacks, brute-force anomalies, and failed login volume spikes.

    ## How it works
    1. Triggers on an automated cron schedule (`*/15 * * * *`) to poll external telemetry endpoints.
    2. Executes a containerized Python script querying the target platform REST API for live operational metrics.
    3. Aggregates data points, evaluates thresholds, and structures diagnostic telemetry into a local JSON report.
    4. Evaluates if anomalous metrics or SLA breaches occurred using an `If` conditional task.
    5. Dispatches an alert to Slack with deep links and targeted remediation commands if thresholds are exceeded.
    6. Logs nominal execution status and exports an audit manifest for lineage and historical tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: */15 * * * *] --> B[Task: evaluate_auth0_failed_logins]
        B --> C{Task: check_failed_login_anomaly}
        C -- Threshold Breached --> D[Task: notify_slack_security_alert]
        C -- Nominal Operation --> E[Task: log_nominal_auth_state]
        D --> F[Task: export_auth0_manifest]
        E --> F
    ```

    ## What you get
    - Proactive detection of credential stuffing attacks and brute-force spikes before account lockouts impact legitimate users.\n    - Automatic extraction and aggregation of top suspicious client IP addresses involved in failed authentication attempts.\n    - Contextual Slack notifications with direct Auth0 Attack Protection mitigation guidelines.\n    - Exported JSON security manifest suitable for SIEM archiving and compliance auditing.

    ## Who it's for
    - Security Operations (SecOps) teams monitoring customer identity and access management (CIAM).\n    - Platform Security Engineers configuring automated IP rate-limiting and bot defenses.\n    - Compliance Officers tracking unauthorized access attempt velocities.

    ## Why orchestrate this with Kestra
    Auth0 provides log streams, but analyzing failed login velocity across rolling intervals requires external log forwarders or expensive SIEM ingestion. Kestra executes a lightweight, scheduled sentinel directly against Auth0 Management API v2, evaluates anomaly thresholds, extracts suspicious IPs, and delivers real-time Slack triage cards without heavy infrastructure.

    ## Use cases
    - **Production Availability Guardrails**: Continuously detect infrastructure degradation before users experience service disruptions.
    - **Incident Triaging Automation**: Deliver actionable runbook instructions straight into on-call Slack channels.
    - **Platform Capacity Planning**: Maintain longitudinal audit logs of operational saturation and SLA compliance.

    ## Inputs
    | Name | Type | Default | Description |\n    | --- | --- | --- | --- |\n    | `auth0Domain` | `STRING` | `company.us.auth0.com` | Auth0 tenant domain identifier. |\n    | `maxFailedLoginsThreshold` | `INT` | `25` | Failed login event count threshold triggering credential stuffing alerts. |\n    | `auth0ManagementToken` | `SECRET` | `auth0_secret_token` | Encrypted Auth0 Management API v2 token with read:logs scope. |\n    | `slackWebhookUri` | `SECRET` | `https://hooks.slack.com/services/T00/B00/XXXX` | Encrypted Slack Incoming Webhook endpoint for alerting SecOps teams. |\n
    ## Expected outputs
    Primary execution outputs exported by `export_auth0_manifest`:
    - `report`: Full structured JSON diagnostic report detailing operational parameters and recommendations.
    Example expression: `{{ outputs.export_auth0_manifest.value }}`

    ## Prerequisites
    - Network connectivity from the Kestra worker to the target service endpoint.
    - An active API token or service credential with read permissions.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.
    - Relevant target platform API token configured in Kestra secrets.

    ## Quick start
    1. Register the required platform credentials and Slack webhook in Kestra secrets.
    2. Deploy this flow into your target namespace.
    3. Configure input parameters to point to your specific environment.
    4. Execute the flow manually to verify API connectivity and Slack alert routing.

    ## Common pitfalls and troubleshooting
    - **Rate Limiting**: Ensure API request frequencies stay within provider rate limits during peak execution periods.
    - **Empty Telemetry Handling**: If no events are recorded in the query window, the Python script handles null responses gracefully.
    - **Credential Scopes**: Verify that the supplied API token possesses sufficient read permissions for the queried endpoints.

    ## How to extend
    - **Automated Remediation**: Add downstream HTTP tasks to trigger automated scaling or restarts upon failure detection.
    - **PagerDuty Escalation**: Route critical severity alerts directly to PagerDuty or Opsgenie.
    - **Multi-Resource Loops**: Loop through an array of resource identifiers using `io.kestra.plugin.core.flow.ForEach`.

    ## Links
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Official Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
