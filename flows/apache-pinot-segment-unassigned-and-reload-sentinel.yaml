id: apache-pinot-segment-unassigned-and-reload-sentinel
namespace: company.team

concurrency:
  limit: 1

inputs:
  - id: pinot_controller_url
    type: STRING
    displayName: Pinot Controller URL
    description: Base HTTP endpoint for the Apache Pinot cluster controller REST API.
    defaults: "http://pinot-controller:9000"

  - id: table_name_filter
    type: STRING
    displayName: Target Pinot Table
    description: Name of the Pinot table to audit, or all to scan all active offline and realtime tables.
    defaults: "all"

  - id: alert_on_bad_segments
    type: BOOL
    displayName: Alert on Degraded Segments
    description: Whether to dispatch alerts when unassigned, offline, or errored segments are discovered.
    defaults: true

  - id: max_tolerated_bad_segments
    type: INT
    displayName: Max Tolerated Bad Segments
    description: Maximum allowable count of degraded segments before triggering operational alerts.
    defaults: 0

tasks:
  - id: scan_pinot_segments
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates Apache Pinot Controller REST APIs to inspect segment states and discover unassigned or corrupted partitions.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      PINOT_URL: "{{ inputs.pinot_controller_url }}"
      TARGET_TABLE: "{{ inputs.table_name_filter }}"
      AUTH_TOKEN: "{{ secret('PINOT_CONTROLLER_TOKEN') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      base_url = os.environ.get("PINOT_URL", "http://pinot-controller:9000").rstrip("/")
      target_table = os.environ.get("TARGET_TABLE", "all")
      token = os.environ.get("AUTH_TOKEN", "")

      headers = {"Accept": "application/json"}
      if token and token != "mock-token":
          headers["Authorization"] = f"Bearer {token}"

      bad_segments = []
      total_segments = 0
      tables_scanned = 0

      try:
          resp = requests.get(f"{base_url}/tables", headers=headers, timeout=15)
          resp.raise_for_status()
          tables = resp.json().get("tables", [])
          if target_table != "all":
              tables = [t for t in tables if t == target_table or t.startswith(target_table)]

          tables_scanned = len(tables)
          for tbl in tables:
              seg_url = f"{base_url}/tables/{tbl}/segments"
              seg_resp = requests.get(seg_url, headers=headers, timeout=10)
              if seg_resp.status_code == 200:
                  seg_data = seg_resp.json()
                  items = seg_data[0].get("offline", []) if isinstance(seg_data, list) and seg_data else []
                  total_segments += len(items)

              debug_url = f"{base_url}/debug/tables/{tbl}/state"
              d_resp = requests.get(debug_url, headers=headers, timeout=10)
              if d_resp.status_code == 200:
                  state_info = d_resp.json()
                  unassigned = state_info.get("unassignedSegments", [])
                  for u_seg in unassigned:
                      bad_segments.append({
                          "table_name": tbl,
                          "segment_name": u_seg,
                          "status": "UNASSIGNED",
                          "remediation_cmd": f"curl -X POST '{base_url}/segments/{tbl}/{u_seg}/reload'"
                      })
      except Exception as exc:
          print(f"CRITICAL: Failed to query Apache Pinot controller at {base_url}: {exc}", file=sys.stderr)
          sys.exit(1)

      bad_count = len(bad_segments)
      print(f"Scanned {tables_scanned} tables and {total_segments} segments. Found {bad_count} degraded segments.")

      report = {
          "tables_scanned": tables_scanned,
          "total_segments": total_segments,
          "bad_segments_count": bad_count,
          "bad_segments": bad_segments
      }

      with open("pinot_segment_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "tables_scanned_count": tables_scanned,
          "total_segments_audited": total_segments,
          "bad_segments_count": bad_count,
          "bad_segments_details": json.dumps(bad_segments)
      })
    outputFiles:
      - pinot_segment_report.json

  - id: check_bad_segments
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether degraded or unassigned Pinot segments exceed operational SLAs.
    condition: "{{ outputs.scan_pinot_segments.vars.bad_segments_count > inputs.max_tolerated_bad_segments }}"
    then:
      - id: notify_slack_pinot_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident alert card to the Pinot operations Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#pinot-ops-alerts",
            "username": "Pinot-Sentinel",
            "text": "CRITICAL: Apache Pinot Degraded Segments Detected! Found `{{ outputs.scan_pinot_segments.vars.bad_segments_count }}` degraded segments across `{{ outputs.scan_pinot_segments.vars.tables_scanned_count }}` tables on `{{ inputs.pinot_controller_url }}`."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#pinot-ops-alerts",
        "username": "Pinot-Sentinel",
        "text": "CRITICAL: Apache Pinot Segment Sentinel pipeline failed on `{{ inputs.pinot_controller_url }}`. Execution ID: `{{ execution.id }}`."
      }

triggers:
  - id: scheduled_pinot_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing Pinot segment state every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: Apache Pinot Segment Unassigned and Reload Sentinel
  metaTitle: Apache Pinot Segment Unassigned and Reload Sentinel Blueprint
  shortDescription: Audits Apache Pinot Controller REST APIs to inspect segment states and discover unassigned partitions.
  metaDescription: Audits Apache Pinot Controller REST APIs to inspect segment states, discover unassigned partitions, and alert ops teams.
  description: |
    ## How it works
    Apache Pinot clusters depend on segment availability across server nodes to answer real-time OLAP queries. When nodes restart, segment transfers fail, or deep store corruption occurs, segments transition to unassigned or offline states. This sentinel queries Pinot Controller state APIs, surfaces degraded partitions, generates reload commands, and alerts on Slack.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_pinot_audit Schedule Trigger] --> B[scan_pinot_segments Python Script]
      B --> C{Bad Segments > Threshold?}
      C -- Yes --> D[notify_slack_pinot_ops Webhook]
      C -- No --> E[Segments Healthy]
    ```

    ## Prerequisites
    - Apache Pinot Controller endpoint reachable over HTTP.
    - Secret `PINOT_CONTROLLER_TOKEN` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `pinot_controller_url` and optional `table_name_filter`.
    3. Run manually to check segment allocation.

    ## Links
    - [Apache Pinot Controller API Documentation](https://docs.pinot.apache.org/operators/operating-pinot/tuning/controller)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
