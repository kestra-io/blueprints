id: clickhouse-readonly-replica-restore-guard
namespace: company.team

inputs:
  - id: clickhouse_url
    type: STRING
    defaults: jdbc:clickhouse://localhost:8123/default
    description: ClickHouse JDBC URL for the server that holds the replicated tables. Example jdbc:clickhouse://clickhouse:8123/default.

  - id: use_secret_auth
    type: BOOL
    defaults: true
    description: Leave true in production so the connection reads CLICKHOUSE_USERNAME and CLICKHOUSE_PASSWORD from secrets. Set false only to pass credentials inline in a disposable test environment.

  - id: clickhouse_username
    type: STRING
    defaults: default
    description: Username used only when use_secret_auth is false. Ignored in production.

  - id: clickhouse_password
    type: STRING
    defaults: ""
    description: Password used only when use_secret_auth is false. Ignored in production.

  - id: database
    type: STRING
    defaults: default
    description: Database whose ReplicatedMergeTree tables are checked.

  - id: table
    type: STRING
    defaults: ""
    description: Optional single table to restrict the check to. Leave empty to check every replicated table in the database.

  - id: query_timeout_seconds
    type: INT
    defaults: 30
    description: Ceiling in seconds on the two reads that probe Keeper. A read of system.zookeeper blocks rather than erroring while Keeper is unreachable, so this turns a Keeper outage into a failed task and a Slack alert instead of a run that hangs.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, report which replicas lost their Keeper metadata without running SYSTEM RESTORE REPLICA.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: When true and dry_run is false, run SYSTEM RESTORE REPLICA on the targeted tables behind an approval gate, then re-read system.replicas.

variables:
  survey_sql: |
    SELECT
      r.database AS database,
      r.table AS table,
      toString(r.is_session_expired) AS session_expired,
      toString(coalesce(z.znode_children, 0)) AS znode_count,
      toString(r.total_replicas) AS replicas_known,
      toString(r.active_replicas) AS replicas_active,
      multiIf(
        r.is_session_expired = 1, 'RESTART case, the Keeper session expired so the metadata is still in Keeper',
        coalesce(z.znode_children, 0) = 0, 'RESTORE case, the Keeper metadata for this table is gone',
        'REVIEW case, read-only with its Keeper metadata present and its session alive'
      ) AS recovery_case,
      replaceAll(replaceAll(replaceAll(substringUTF8(r.zookeeper_exception, 1, 160), '\\', '/'), '"', ''), '\n', ' ') AS zookeeper_exception_short
    FROM system.replicas AS r
    LEFT JOIN (
      SELECT path, count() AS znode_children
      FROM system.zookeeper
      WHERE path IN (
        SELECT zookeeper_path FROM system.replicas
        WHERE is_readonly = 1 AND is_session_expired = 0
      )
      GROUP BY path
    ) AS z ON r.zookeeper_path = z.path
    WHERE r.is_readonly = 1
      AND r.database = '{{ inputs.database }}'
      AND ('{{ inputs.table }}' = '' OR r.table = '{{ inputs.table }}')
    ORDER BY r.database, r.table
    SETTINGS max_execution_time = {{ inputs.query_timeout_seconds }}

  detect_sql: |
    SELECT
      r.database AS database,
      r.table AS table,
      r.replica_name AS replica_name,
      r.zookeeper_path AS zookeeper_path,
      r.replica_path AS replica_path,
      toString(coalesce(p.local_active_parts, 0)) AS local_active_parts,
      toString(coalesce(p.local_rows, 0)) AS local_rows,
      replaceAll(replaceAll(replaceAll(substringUTF8(r.zookeeper_exception, 1, 160), '\\', '/'), '"', ''), '\n', ' ') AS zookeeper_exception_short
    FROM system.replicas AS r
    LEFT JOIN (
      SELECT path, count() AS znode_children
      FROM system.zookeeper
      WHERE path IN (
        SELECT zookeeper_path FROM system.replicas
        WHERE is_readonly = 1 AND is_session_expired = 0
      )
      GROUP BY path
    ) AS z ON r.zookeeper_path = z.path
    LEFT JOIN (
      SELECT database, table, count() AS local_active_parts, sum(rows) AS local_rows
      FROM system.parts
      WHERE active
      GROUP BY database, table
    ) AS p ON r.database = p.database AND r.table = p.table
    WHERE r.is_readonly = 1
      AND r.is_session_expired = 0
      AND coalesce(z.znode_children, 0) = 0
      AND r.database = '{{ inputs.database }}'
      AND ('{{ inputs.table }}' = '' OR r.table = '{{ inputs.table }}')
    ORDER BY r.database, r.table
    SETTINGS max_execution_time = {{ inputs.query_timeout_seconds }}

triggers:
  - id: hourly_readonly_replica_check
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "25 * * * *"
    description: Hourly sweep for replicas stuck read-only. Disabled by default and pinned to safe mode so it reports the lost metadata without restoring anything until an operator enables it.
    inputs:
      dry_run: true
      auto_remediate: false

tasks:
  - id: survey_readonly
    type: io.kestra.plugin.jdbc.clickhouse.Query
    description: >-
      Read every read-only replica in the database and label each one with the recovery statement it actually needs. A replica whose Keeper session expired keeps its metadata in Keeper and comes back on its own, so it is a RESTART case. A replica whose znode is gone cannot come back without rebuilding the metadata, so it is a RESTORE case. The split is read from is_session_expired plus a direct read of the table's znode path through system.zookeeper.
    url: "{{ inputs.clickhouse_url }}"
    username: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_USERNAME') : inputs.clickhouse_username }}"
    password: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_PASSWORD') : inputs.clickhouse_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.survey_sql) }}"

  - id: detect
    type: io.kestra.plugin.jdbc.clickhouse.Query
    description: >-
      Keep only the RESTORE cases, the replicas that are read-only with a live Keeper session and no znode at their zookeeper_path. This is the single list the remediation loop iterates, so a RESTART case can never reach SYSTEM RESTORE REPLICA. It also reports the local active part count and row count behind each target, because RESTORE rebuilds the Keeper metadata from the parts on this host and nothing else.
    url: "{{ inputs.clickhouse_url }}"
    username: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_USERNAME') : inputs.clickhouse_username }}"
    password: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_PASSWORD') : inputs.clickhouse_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.detect_sql) }}"

  - id: summarize
    type: io.kestra.plugin.core.output.OutputValues
    description: Materialize the targeted table list, the comma separated names used by the re-read, the per target evidence plus the full read-only survey once, so the log, the Slack alert and the failure message all read the same value.
    values:
      target_list: >-
        {{ outputs.detect.rows | jq('map(.database + "." + .table) | join(", ")') | first }}
      table_csv: >-
        {{ outputs.detect.rows | jq('map(.table) | join(",")') | first }}
      target_evidence: >-
        {{ outputs.detect.rows | jq('map(.database + "." + .table + " [replica " + .replica_name + ", znode " + .zookeeper_path + " missing, " + .local_active_parts + " local active parts holding " + .local_rows + " rows] " + (if .zookeeper_exception_short == "" then "no Keeper exception recorded" else .zookeeper_exception_short end)) | join(" || ")') | first }}
      survey_list: >-
        {{ outputs.survey_readonly.rows | jq('map(.database + "." + .table + " is " + .recovery_case) | join(" || ")') | first }}

  - id: log_detect
    type: io.kestra.plugin.core.log.Log
    message: |
      ClickHouse {{ inputs.database }}: {{ outputs.survey_readonly.size }} read-only replica(s) found, {{ outputs.detect.size }} of them need SYSTEM RESTORE REPLICA.
      Every read-only replica and its case: {{ outputs.summarize.values.survey_list }}
      Restore targets: {{ outputs.summarize.values.target_list }}
      Evidence per target: {{ outputs.summarize.values.target_evidence }}
      Mode: dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}
      SYSTEM RESTART REPLICA is the wrong tool for a RESTORE case. It only reinitialises the session against Keeper, so with the metadata genuinely gone it restarts straight back into read-only. SYSTEM RESTORE REPLICA re-creates the metadata from the parts on local disk, which also means any part that lived only on another replica and never replicated here is not recovered by it.

  - id: guard
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.detect.size > 0 }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert on every detection, in dry run and in remediate mode, so a human sees which replicas lost their Keeper metadata even when nothing is restored.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "ClickHouse read-only replica guard: {{ outputs.detect.size }} replica(s) in {{ inputs.database }} are read-only because their Keeper metadata is gone, so SYSTEM RESTART REPLICA cannot fix them. {{ outputs.summarize.values.target_evidence }} Full read-only survey: {{ outputs.summarize.values.survey_list }} Mode dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}."}

      - id: mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Hold the run until a human approves the restore. Approving means two things have been checked. The metadata loss is real rather than a Keeper outage in progress. This host also holds the parts worth keeping, because SYSTEM RESTORE REPLICA rebuilds the Keeper metadata from local parts only.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: Set true to run SYSTEM RESTORE REPLICA on the listed tables. Anything else leaves them alone.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: remediation_restore_loop
                type: io.kestra.plugin.core.flow.Loop
                description: Remediation loop. One SYSTEM RESTORE REPLICA per targeted table, concurrencyLimit 1 so the restores rebuild one set of Keeper znodes at a time instead of racing each other.
                concurrencyLimit: 1
                values: "{{ outputs.detect.rows | jq('map({database: .database, table: .table})') | first | toJson }}"
                tasks:
                  - id: restore_one
                    type: io.kestra.plugin.jdbc.clickhouse.Query
                    description: Rebuild one table's Keeper metadata from its local parts. allowFailure so a restore the server refuses does not stop the pass, which leaves the re-read as the real gate.
                    allowFailure: true
                    url: "{{ inputs.clickhouse_url }}"
                    username: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_USERNAME') : inputs.clickhouse_username }}"
                    password: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_PASSWORD') : inputs.clickhouse_password }}"
                    fetchType: NONE
                    sql: "SYSTEM RESTORE REPLICA `{{ fromJson(item.value).database }}`.`{{ fromJson(item.value).table }}`"

                  - id: restore_log
                    type: io.kestra.plugin.core.log.Log
                    message: "Issued SYSTEM RESTORE REPLICA for {{ fromJson(item.value).database }}.{{ fromJson(item.value).table }}."

              - id: reverify
                type: io.kestra.plugin.jdbc.clickhouse.Query
                description: >-
                  Re-read system.replicas for exactly the tables that were restored and ask one question only, is this replica still read-only. The check deliberately drops the znode and session predicates the fix moves, so a restore that re-creates some znodes while the table stays read-only fails the run instead of reading clean.
                url: "{{ inputs.clickhouse_url }}"
                username: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_USERNAME') : inputs.clickhouse_username }}"
                password: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_PASSWORD') : inputs.clickhouse_password }}"
                fetchType: FETCH
                sql: |
                  SELECT
                    database AS database,
                    table AS table,
                    toString(is_readonly) AS readonly_flag,
                    toString(is_session_expired) AS session_expired,
                    toString(total_replicas) AS replicas_known,
                    toString(active_replicas) AS replicas_active,
                    replaceAll(replaceAll(replaceAll(substringUTF8(zookeeper_exception, 1, 160), '\\', '/'), '"', ''), '\n', ' ') AS zookeeper_exception_short
                  FROM system.replicas
                  WHERE database = '{{ inputs.database }}'
                    AND has(splitByChar(',', '{{ outputs.summarize.values.table_csv }}'), table)
                    AND is_readonly = 1
                  ORDER BY table

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.reverify.size > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      {{ outputs.reverify.size }} of {{ outputs.detect.size }} restored replica(s) in {{ inputs.database }} are still read-only: {{ outputs.reverify.rows | jq('map(.database + "." + .table + " [session_expired " + .session_expired + ", total_replicas " + .replicas_known + "] " + (if .zookeeper_exception_short == "" then "no Keeper exception recorded" else .zookeeper_exception_short end)) | join(" || ")') | first }}. The restore did not put the table back in a writable state, so writes are still refused. Check the Keeper cluster is healthy, that the user holds the SYSTEM RESTORE REPLICA privilege, then run again.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: "Restored and verified. {{ outputs.detect.size }} replica(s) were read-only with their Keeper metadata gone, {{ outputs.reverify.size }} still are. Every targeted table accepts writes again, rebuilt from the parts already on local disk."
            else:
              - id: not_approved
                type: io.kestra.plugin.core.log.Log
                message: "Approval not granted, so nothing was restored. {{ outputs.detect.size }} replica(s) are still read-only in {{ inputs.database }}: {{ outputs.summarize.values.target_list }}."
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: "Report only (dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}). {{ outputs.detect.size }} replica(s) would get SYSTEM RESTORE REPLICA: {{ outputs.summarize.values.target_list }}. No change made."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No replica in {{ inputs.database }} needs SYSTEM RESTORE REPLICA. {{ outputs.survey_readonly.size }} read-only replica(s) were seen in total: {{ outputs.summarize.values.survey_list }}. A read-only replica whose Keeper session expired recovers on its own once Keeper is reachable, so it is left alone here."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Post to Slack on any failure, including an unreachable server, a refused restore or replicas still read-only after a restore pass.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "ClickHouse read-only replica restore guard FAILED for {{ inputs.database }} (execution {{ execution.id }}). Either the server was unreachable, the restore was refused or a targeted replica is still read-only after the restore pass. Check the run."}

extend:
  title: ClickHouse Read-Only Replica Restore Guard
  shortDescription: Find ReplicatedMergeTree tables stuck read-only because their ClickHouse Keeper metadata is gone, separate them from merely session-expired replicas, run SYSTEM RESTORE REPLICA behind a dry-run and approval gate, then re-read system.replicas and fail if any is still read-only.
  metaTitle: ClickHouse Read-Only Replica Restore Guard with Kestra
  metaDescription: Recover a ClickHouse replica stuck read-only after losing Keeper metadata. Gated SYSTEM RESTORE REPLICA, then a re-read of system.replicas.
  description: |
    A ReplicatedMergeTree table keeps its replication metadata in ClickHouse Keeper. Lose that metadata, through a wiped Keeper volume, a Keeper cluster rebuilt from scratch or a deleted znode, then the table flips to `is_readonly = 1` and refuses every write while the data sits untouched on local disk. The usual reflex makes it worse: `SYSTEM RESTART REPLICA` only reinitialises the session against Keeper, so it restarts straight back into read-only. The statement that recovers the table is `SYSTEM RESTORE REPLICA`, which re-creates the Keeper metadata from the parts already on disk. This guard tells the two causes apart, restores only the ones that need it, then proves the table takes writes again.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    Measured on ClickHouse 24.8 with a separate ClickHouse Keeper node while building this.

    - The two causes of a read-only replica are distinguishable from `system.replicas` alone. A lost Keeper session reads `is_readonly = 1` with `is_session_expired = 1` and an EMPTY `zookeeper_exception`. Lost metadata reads `is_readonly = 1` with `is_session_expired = 0` and a `KEEPER_EXCEPTION` naming the missing path. A flow that treats every read-only replica the same reaches for the wrong statement half the time.
    - A session-expired replica really does recover on its own. Keeper was stopped, both replicas went read-only with `is_session_expired = 1`, Keeper was started again, both returned to `is_readonly = 0` with no intervention. That is why those rows are reported here and never touched.
    - Deleting the table's znode does not flip `is_readonly` on its own. Writes start failing immediately with a Keeper `No node` error while `is_readonly` still reads 0. The flag is set when the replica next reinitialises, so the detector reads the znode path through `system.zookeeper` rather than trusting the flag alone.
    - `SYSTEM RESTART REPLICA` was run twice against the table with its metadata deleted. `is_readonly` stayed 1 both times. `SYSTEM RESTORE REPLICA` on the same table returned `is_readonly` to 0 with `total_replicas` and `active_replicas` back at 1. The refused `INSERT` was accepted on the next attempt with the original 1000 rows intact.
    - `system.zookeeper` returns zero rows for a path that does not exist on 24.8 instead of raising. It also accepts a subquery in its `path IN (...)` predicate, so the znode probe is one join rather than a task per table.
    - A read of `system.zookeeper` BLOCKS while Keeper is unreachable, it does not raise. A literal path read sat there until it was cancelled. Two things keep that out of the flow. The probe's path set is scoped to replicas that are read-only with a live session, so during a full Keeper outage the set is empty and ClickHouse never contacts Keeper at all, which was measured returning 0 immediately with Keeper stopped. On top of that both reads carry `SETTINGS max_execution_time`, measured raising `TIMEOUT_EXCEEDED` on a probe that was already hanging.

    ## Safety

    - Read-only by default. `dry_run` is true and `auto_remediate` is false, so a plain run reports the state without touching anything.
    - A restore happens only when `auto_remediate` is true and `dry_run` is false. It then waits for a human to resume the `Pause` with `approved` set true. An unanswered gate reads as not approved.
    - The remediation loop iterates the RESTORE list only. A replica whose Keeper session expired is never passed to `SYSTEM RESTORE REPLICA`, because the right answer for that one is to fix Keeper and let the session come back.
    - The local active part count and row count behind every target are printed before the gate on purpose. `SYSTEM RESTORE REPLICA` rebuilds the metadata from local parts, so a part that lived only on another replica and never replicated here is not recovered by it. An operator approving the gate is agreeing that this host holds the data worth keeping.
    - Each restore is scoped to one named table. Restores run one at a time.
    - The re-read of `system.replicas` asks only whether the table is still read-only. It drops the znode and session predicates the fix moves, so a partial restore cannot read clean.
    - Both Keeper-touching reads carry a `max_execution_time` ceiling from `query_timeout_seconds`, so a Keeper outage turns into a failed task with a Slack alert rather than a run that hangs holding a worker.

    ## How it works

    1. `survey_readonly` (`io.kestra.plugin.jdbc.clickhouse.Query`) reads every replica with `is_readonly = 1` in the database and labels each one RESTART, RESTORE or REVIEW from `is_session_expired` plus a `system.zookeeper` read of the table's own `zookeeper_path`. That probe only asks about replicas that are read-only with a live Keeper session, so a Keeper outage leaves it with nothing to look up.
    2. `detect` keeps the RESTORE cases only, the replicas that are read-only with a live session and no znode. It also reads the local active part count and row count behind each one from `system.parts`.
    3. `summarize` (`io.kestra.plugin.core.output.OutputValues`) records the targeted names, the per target evidence and the full survey once, so the log, the alert and the failure message all read the same value.
    4. `log_detect` (`io.kestra.plugin.core.log.Log`) prints both lists, the evidence per target plus the reason `SYSTEM RESTART REPLICA` will not help here.
    5. `guard` (`io.kestra.plugin.core.flow.If`) branches on the RESTORE count. With none found, `clean` logs the survey and the run ends, which is also the path a purely session-expired replica takes.
    6. `findings_alert` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) posts the targets with their evidence on every detection, in dry run and in remediate mode.
    7. `mode` (`io.kestra.plugin.core.flow.If`) enters the remediation branch only when `auto_remediate` is true and `dry_run` is false. Otherwise `report_only` lists what would be restored and stops.
    8. `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run until a human resumes it with `approved`. `apply` restores only when `approved` is true.
    9. `remediation_restore_loop` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs `SYSTEM RESTORE REPLICA <database>.<table>` once per target, with `allowFailure` so a refused restore does not stop the pass.
    10. `reverify` re-reads `system.replicas` for exactly those tables. `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` if any of them is still read-only.

    ## What you get

    - A detector that separates the two causes of a read-only replica instead of folding them together, so the run reaches for `SYSTEM RESTORE REPLICA` only where that statement is the fix.
    - The escalation past `SYSTEM RESTART REPLICA`, which is the step that recovers a table whose Keeper metadata is genuinely gone.
    - The local part and row count behind each target, in the log and in Slack, so the human approving a restore knows what the rebuild is based on.
    - A restore that is safe to leave scheduled. It reports until an operator turns on remediation and approves the run.
    - A real verification step. The run passes only when the second read of `system.replicas` shows every targeted table out of read-only.
    - Slack alerts on the findings and on any failure.

    ## Who it's for

    - Platform engineers who run ClickHouse with ReplicatedMergeTree and have had a Keeper volume wiped, resized or rebuilt under them.
    - Teams who moved from ZooKeeper to ClickHouse Keeper or rebuilt a Keeper quorum, then found tables refusing writes afterwards.
    - On-call responders who need the difference between a Keeper outage that heals itself and metadata loss that does not, before they start typing statements.

    ## Why orchestrate this with Kestra

    ClickHouse reports the read-only flag in `system.replicas` then leaves the decision to a human. It has no scheduler for the check, no way to tell a session blip from metadata loss without someone reading several columns at once, no approval step in front of `SYSTEM RESTORE REPLICA` and no proof afterwards that the table came back. Kestra adds the missing pieces. It sweeps on a schedule, classifies each read-only replica, shows a human what the rebuild will be based on before anything runs, gates the restore behind dry-run plus approval, re-reads `system.replicas` to turn a hopeful restore into a verified one, applies the same connection settings to every task then posts a Slack alert the moment a step fails.

    ## Tested end to end

    Run on Kestra 2.0.5 against ClickHouse 24.8 with ClickHouse Keeper in its own container, 15 executions covering every path. Two `ReplicatedMergeTree` tables were created, `w35_events` with 1000 rows and `w35_healthy` with 50, both confirmed writable with `is_readonly = 0`. The Keeper znode for `w35_events` was then deleted with `clickhouse-keeper-client rmr` and the replica reinitialised, which left it `is_readonly = 1` with `is_session_expired = 0` and a `KEEPER_EXCEPTION`. `w35_healthy` was left untouched throughout. Every number below was confirmed with `clickhouse-client` against `system.replicas`, not from the Kestra log.

    - The write really is refused. While read-only, `INSERT` returned `Code: 242 TABLE_IS_READ_ONLY, Table is in readonly mode since table metadata was not found in zookeeper`. After the restore the same `INSERT` was accepted and the table went from 1000 rows to 1001, so the original rows survived the rebuild.
    - `SYSTEM RESTART REPLICA` is the wrong tool and was measured as such. Run twice against the table with its metadata deleted, `is_readonly` stayed 1 both times. `SYSTEM RESTORE REPLICA` on the same table took it to `is_readonly = 0` with `total_replicas` and `active_replicas` back at 1.
    - The RESTART case is a separate path and recovers without us. Keeper was stopped, both tables went `is_readonly = 1` with `is_session_expired = 1`, the detector returned 0 restore targets while the survey reported 2 RESTART rows, Keeper was started again and both tables returned to `is_readonly = 0` on their own.
    - Detector can fail. On the healthy pair it returned 0 targets. With one table's znode deleted the same read returned exactly 1, the broken one. The healthy table sitting in the same database was never returned.
    - Dry run detected the target, posted the evidence to Slack, changed nothing. `is_readonly` read 1 before and after.
    - Remediate with approval ran `SYSTEM RESTORE REPLICA`, the re-read reported 0 still read-only. `clickhouse-client` confirmed `is_readonly` 1 to 0 with the row count intact.
    - Remediate with a user holding only `SELECT` and `INSERT` was refused with `ACCESS_DENIED`. The re-read found the table still read-only so the run FAILED rather than reporting success.
    - The approval gate held. A run resumed with `approved` false restored nothing and the table stayed read-only.
    - An unreachable host failed the first read and fired the Slack alert.
    - The sweep stayed fast with Keeper stopped. Scoping the znode probe to replicas with a live session left it with an empty path set, so the whole run finished in seconds instead of blocking on Keeper.
    - Precision. The healthy table was never restored. Scoping the run to it returned 0 targets while the broken table sat in the same database.

    ## Prerequisites

    A ClickHouse server reachable over the JDBC HTTP interface, at least one `ReplicatedMergeTree` table plus a user that can read `system.replicas`, `system.zookeeper` and `system.parts` and run `SYSTEM RESTORE REPLICA` on the target tables.

    ### Secrets

    - `CLICKHOUSE_USERNAME`: ClickHouse user, read when `use_secret_auth` is true.
    - `CLICKHOUSE_PASSWORD`: password for that user.
    - `SLACK_WEBHOOK_URL`: used by `findings_alert` and the `errors` block.
    - In Kestra OSS, provide each secret as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `clickhouse_url` | STRING | `jdbc:clickhouse://localhost:8123/default` | ClickHouse JDBC URL. |
    | `use_secret_auth` | BOOL | `true` | Read credentials from secrets. Set false only for inline test credentials. |
    | `database` | STRING | `default` | Database whose replicated tables are checked. |
    | `table` | STRING | `""` | Optional single table filter. Empty checks every replicated table. |
    | `query_timeout_seconds` | INT | `30` | Ceiling on the two reads that probe Keeper, so an unreachable Keeper fails the task instead of hanging. |
    | `dry_run` | BOOL | `true` | Report without restoring. |
    | `auto_remediate` | BOOL | `false` | Restore behind the approval gate when dry_run is false. |

    ## Quick start

    1. Set `CLICKHOUSE_USERNAME`, `CLICKHOUSE_PASSWORD` and `SLACK_WEBHOOK_URL` as namespace secrets.
    2. Import this flow.
    3. Run it with `database` pointed at a database holding `ReplicatedMergeTree` tables. The default dry run reports every read-only replica, which statement each one needs, plus the local parts behind any restore target.
    4. Confirm Keeper itself is healthy, then run again with `dry_run` false and `auto_remediate` true. Resume the paused execution with `approved` true.

    ## How to extend

    - Add a floor on `local_active_parts` or `local_rows` so a target whose local disk holds almost nothing is reported rather than restored, since a rebuild from local parts would lose the rest.
    - Fail the run as soon as detection finds anything, for a read-only drift check with no remediation.
    - Point the flow at each replica host in turn, because metadata loss affects every replica of the table and `SYSTEM RESTORE REPLICA` runs per replica.
    - Add a Keeper health read, through `system.zookeeper_connection` or the Keeper four letter commands, so a run during a partial Keeper outage reports and stops before it classifies anything.
    - Follow a verified restore with `SYSTEM SYNC REPLICA` on the other replicas, so the rebuilt metadata is picked up everywhere before writes resume.

