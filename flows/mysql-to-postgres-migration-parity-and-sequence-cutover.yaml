id: mysql-to-postgres-migration-parity-and-sequence-cutover
namespace: company.database

description: |
  Audit heterogeneous replication parity between MySQL and PostgreSQL, detect table
  row count drift using DuckDB, and advance PostgreSQL serial sequences to match MySQL
  auto-increment values before final application cutover.

inputs:
  - id: mysql_host
    type: STRING
    description: Hostname or IP address of the source MySQL database.
    defaults: mysql.internal.corp

  - id: mysql_port
    type: INT
    description: Network port of the source MySQL database.
    defaults: 3306

  - id: mysql_database
    type: STRING
    description: Schema or database name in MySQL holding replicated tables.
    defaults: production_db

  - id: mysql_user
    type: STRING
    description: Database user for MySQL metadata inspection queries.
    defaults: migration_reader

  - id: postgres_host
    type: STRING
    description: Hostname or IP address of the target PostgreSQL database.
    defaults: postgres.internal.corp

  - id: postgres_port
    type: INT
    description: Network port of the target PostgreSQL database.
    defaults: 5432

  - id: postgres_database
    type: STRING
    description: Database name on the target PostgreSQL server.
    defaults: production_db

  - id: postgres_schema
    type: STRING
    description: Target PostgreSQL schema containing the replicated tables.
    defaults: public

  - id: postgres_user
    type: STRING
    description: Database user with sequence administration privileges on PostgreSQL.
    defaults: migration_admin

  - id: apply_sequence_cutover
    type: BOOL
    description: When true and dry_run is false, advances PostgreSQL sequence values using setval.
    defaults: false

  - id: cutover_approval_timeout
    type: DURATION
    description: Maximum duration to pause for DBA review before proceeding with sequence cutover.
    defaults: PT15M

  - id: dry_run
    type: BOOL
    description: When true, inspects schemas and outputs reconciliation reports without modifying PostgreSQL sequences.
    defaults: true

triggers:
  - id: scheduled_parity_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run periodic replication parity audit during the pre-cutover testing window.
    cron: 0 2 * * 0
    disabled: true

tasks:
  - id: list_mysql_tables
    type: io.kestra.plugin.jdbc.mysql.Query
    description: Discover all base tables and current auto-increment counters from the source MySQL schema.
    url: "jdbc:mysql://{{ inputs.mysql_host }}:{{ inputs.mysql_port }}/{{ inputs.mysql_database }}?useSSL=false&allowPublicKeyRetrieval=true"
    username: "{{ inputs.mysql_user }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT 
        TABLE_NAME AS table_name,
        COALESCE(AUTO_INCREMENT, 1) AS auto_increment
      FROM information_schema.TABLES
      WHERE TABLE_SCHEMA = '{{ inputs.mysql_database }}'
        AND TABLE_TYPE = 'BASE TABLE'
      ORDER BY TABLE_NAME;

  - id: exact_count_mysql_tables
    type: io.kestra.plugin.jdbc.mysql.Query
    description: Compute exact row counts across all discovered MySQL tables using a unified UNION ALL query.
    url: "jdbc:mysql://{{ inputs.mysql_host }}:{{ inputs.mysql_port }}/{{ inputs.mysql_database }}?useSSL=false&allowPublicKeyRetrieval=true"
    username: "{{ inputs.mysql_user }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      {% for r in outputs.list_mysql_tables.rows %}
      SELECT '{{ r.table_name }}' AS table_name, count(*) AS exact_row_count, {{ r.auto_increment ?? 1 }} AS auto_increment FROM `{{ inputs.mysql_database }}`.`{{ r.table_name }}`
      {% if not loop.last %} UNION ALL {% endif %}
      {% endfor %}

  - id: inspect_postgres_catalog
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Discover target PostgreSQL tables and resolve sequence linkages for both serial and identity columns.
    url: "jdbc:postgresql://{{ inputs.postgres_host }}:{{ inputs.postgres_port }}/{{ inputs.postgres_database }}"
    username: "{{ inputs.postgres_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT 
        t.table_name,
        c.column_name AS pk_column,
        pg_get_serial_sequence(quote_ident('{{ inputs.postgres_schema }}') || '.' || quote_ident(t.table_name), c.column_name) AS sequence_name,
        COALESCE(seq.last_value, 1) AS last_value
      FROM information_schema.tables t
      JOIN information_schema.columns c 
        ON t.table_schema = c.table_schema 
        AND t.table_name = c.table_name
      LEFT JOIN pg_sequences seq 
        ON seq.schemaname = t.table_schema 
        AND seq.sequencename = replace(pg_get_serial_sequence(quote_ident('{{ inputs.postgres_schema }}') || '.' || quote_ident(t.table_name), c.column_name), quote_ident('{{ inputs.postgres_schema }}') || '.', '')
      WHERE t.table_schema = '{{ inputs.postgres_schema }}'
        AND t.table_type = 'BASE TABLE'
        AND (
          c.column_default LIKE 'nextval(%' 
          OR c.is_identity = 'YES' 
          OR pg_get_serial_sequence(quote_ident('{{ inputs.postgres_schema }}') || '.' || quote_ident(t.table_name), c.column_name) IS NOT NULL
        )
      ORDER BY t.table_name;

  - id: exact_count_postgres_tables
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Compute exact live row counts across all target PostgreSQL tables using a unified UNION ALL query.
    url: "jdbc:postgresql://{{ inputs.postgres_host }}:{{ inputs.postgres_port }}/{{ inputs.postgres_database }}"
    username: "{{ inputs.postgres_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      {% for r in outputs.inspect_postgres_catalog.rows %}
      SELECT '{{ r.table_name }}' AS table_name, count(*) AS exact_row_count FROM "{{ inputs.postgres_schema }}"."{{ r.table_name }}"
      {% if not loop.last %} UNION ALL {% endif %}
      {% endfor %}

  - id: reconcile_migration_parity
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Join MySQL and PostgreSQL metadata in DuckDB to flag row drift, missing tables, and lagging sequences.
    inputFiles:
      mysql_tables.json: "{{ outputs.exact_count_mysql_tables.rows | toJson }}"
      postgres_meta.json: "{{ outputs.inspect_postgres_catalog.rows | toJson }}"
      postgres_counts.json: "{{ outputs.exact_count_postgres_tables.rows | toJson }}"
    outputFiles:
      - migration_parity_reconciliation.csv
    sql: |
      CREATE TABLE mysql_src AS SELECT * FROM read_json_auto('{{ workingDir }}/mysql_tables.json');
      CREATE TABLE pg_meta AS SELECT * FROM read_json_auto('{{ workingDir }}/postgres_meta.json');
      CREATE TABLE pg_counts AS SELECT * FROM read_json_auto('{{ workingDir }}/postgres_counts.json');

      CREATE TABLE pg_target AS
      SELECT 
        m.table_name,
        m.pk_column,
        m.sequence_name,
        m.last_value AS sequence_last_val,
        c.exact_row_count
      FROM pg_meta m
      JOIN pg_counts c ON m.table_name = c.table_name;

      CREATE TABLE reconciliation AS
      SELECT 
        COALESCE(m.table_name, p.table_name) AS table_name,
        p.pk_column,
        COALESCE(m.exact_row_count, 0) AS mysql_rows,
        COALESCE(p.exact_row_count, 0) AS postgres_rows,
        COALESCE(m.auto_increment, 1) AS mysql_auto_increment,
        p.sequence_name AS postgres_sequence,
        COALESCE(p.sequence_last_val, 1) AS postgres_sequence_val,
        CASE 
          WHEN m.table_name IS NULL THEN 'MISSING_IN_MYSQL'
          WHEN p.table_name IS NULL THEN 'MISSING_IN_POSTGRES'
          WHEN m.exact_row_count != p.exact_row_count THEN 'ROW_COUNT_MISMATCH'
          WHEN p.sequence_name IS NOT NULL AND (p.sequence_last_val IS NULL OR p.sequence_last_val < m.auto_increment - 1) THEN 'SEQUENCE_OUT_OF_SYNC'
          ELSE 'IN_SYNC'
        END AS parity_status,
        CASE
          WHEN p.sequence_name IS NOT NULL AND (p.sequence_last_val IS NULL OR p.sequence_last_val < m.auto_increment - 1)
          THEN 'SELECT setval(''' || p.sequence_name || ''', ' || CAST(m.auto_increment - 1 AS VARCHAR) || ', true);'
          ELSE NULL
        END AS fix_sequence_sql
      FROM mysql_src m
      FULL OUTER JOIN pg_target p ON m.table_name = p.table_name;

      COPY reconciliation TO '{{ workingDir }}/migration_parity_reconciliation.csv' (HEADER, DELIMITER ',');

      SELECT 
        count(*) AS total_tables_audited,
        count(*) FILTER (WHERE parity_status = 'ROW_COUNT_MISMATCH') AS row_mismatches,
        count(*) FILTER (WHERE parity_status = 'SEQUENCE_OUT_OF_SYNC') AS unsynced_sequences,
        count(*) FILTER (WHERE parity_status = 'MISSING_IN_POSTGRES') AS missing_target_tables,
        count(*) FILTER (WHERE parity_status = 'IN_SYNC') AS verified_synced_tables
      FROM reconciliation;

      SELECT table_name, fix_sequence_sql FROM reconciliation WHERE fix_sequence_sql IS NOT NULL;
    fetchType: FETCH

  - id: sync_postgres_sequences
    type: io.kestra.plugin.core.flow.If
    description: Pause for DBA review and apply generated sequence alignment statements to PostgreSQL when cutover is enabled.
    condition: "{{ outputs.reconcile_migration_parity.outputs[0].rows[0].unsynced_sequences > 0 and inputs.apply_sequence_cutover == true and inputs.dry_run == false }}"
    then:
      - id: pause_cutover_approval
        type: io.kestra.plugin.core.flow.Pause
        description: Pause execution to allow DBAs to review reconciliation metrics before executing sequence updates.
        pauseDuration: "{{ inputs.cutover_approval_timeout }}"

      - id: execute_sequence_cutover
        type: io.kestra.plugin.jdbc.postgresql.Queries
        description: Advance PostgreSQL sequence counters to match source MySQL auto-increment values.
        url: "jdbc:postgresql://{{ inputs.postgres_host }}:{{ inputs.postgres_port }}/{{ inputs.postgres_database }}"
        username: "{{ inputs.postgres_user }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        sql: |
          {% for r in outputs.reconcile_migration_parity.outputs[1].rows %}
          {{ r.fix_sequence_sql }}
          {% endfor %}

      - id: log_sequence_cutover
        type: io.kestra.plugin.core.log.Log
        description: Log successful sequence update counts to execution audit logs.
        message: "Successfully synchronized {{ outputs.reconcile_migration_parity.outputs[0].rows[0].unsynced_sequences }} sequences on target PostgreSQL database."
    else:
      - id: log_cutover_status
        type: io.kestra.plugin.core.log.Log
        description: Log informational message when sequence synchronization is skipped or unnecessary.
        message: "Sequence cutover check complete: {{ outputs.reconcile_migration_parity.outputs[0].rows[0].unsynced_sequences }} sequences require alignment (dry_run: {{ inputs.dry_run }}, apply_cutover: {{ inputs.apply_sequence_cutover }})."

  - id: certify_cutover_gate
    type: io.kestra.plugin.core.execution.Assert
    description: Assert zero row drift and verified sequence alignment before authorizing application cutover.
    conditions:
      - "{{ inputs.dry_run == true or (outputs.reconcile_migration_parity.outputs[0].rows[0].row_mismatches == 0 and outputs.reconcile_migration_parity.outputs[0].rows[0].missing_target_tables == 0) }}"
    errorMessage: "Migration cutover gate rejected: Row count mismatch or missing target tables detected between MySQL and PostgreSQL."

  - id: dispatch_cutover_report
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch migration reconciliation status and cutover readiness report to the DBA team channel.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#database-migrations",
        "text": ":satellite: *MySQL to PostgreSQL Migration Parity Report*\nTotal Tables: `{{ outputs.reconcile_migration_parity.outputs[0].rows[0].total_tables_audited }}`\nVerified Synced: `{{ outputs.reconcile_migration_parity.outputs[0].rows[0].verified_synced_tables }}`\nRow Mismatches: `{{ outputs.reconcile_migration_parity.outputs[0].rows[0].row_mismatches }}`\nUnsynced Sequences: `{{ outputs.reconcile_migration_parity.outputs[0].rows[0].unsynced_sequences }}`\nReconciliation CSV: `{{ outputs.reconcile_migration_parity.outputFiles['migration_parity_reconciliation.csv'] }}`"
      }

extend:
  title: Reconcile MySQL to PostgreSQL Migration Parity and Synchronize Sequences for Cutover
  shortDescription: Compare MySQL and PostgreSQL table row counts in DuckDB and advance PostgreSQL sequence counters to prevent cutover duplicate key collisions.
  metaTitle: MySQL to PostgreSQL Migration Parity and Sequence Cutover
  metaDescription: Reconcile MySQL and PostgreSQL tables in DuckDB, detect replication drift, and synchronize PostgreSQL serial sequences for cutover in Kestra.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    Migrating production workloads from MySQL to PostgreSQL (such as Amazon Aurora MySQL to Aurora PostgreSQL, Supabase, or Neon) frequently encounters a subtle, catastrophic production outage during application cutover: duplicate key collisions on auto-incrementing primary keys. Change Data Capture (CDC) replication tools like Debezium, Airbyte, or pgloader replicate table data, but they do not automatically advance PostgreSQL `SERIAL` or `IDENTITY` sequence counters. When the application redirects write traffic to PostgreSQL, the first `INSERT` attempts to allocate `id = 1`, resulting in immediate unique constraint violations (`Key (id)=(1) already exists`).

    This blueprint orchestrates an end-to-end migration parity audit and cutover gate. It discovers all tables in MySQL and PostgreSQL, computes exact `count(*)` values across both engines using dynamic `UNION ALL` scans, resolves sequence linkages across both `SERIAL` and modern `IDENTITY` columns, joins schemas inside an in-memory DuckDB database, flags row count drift, pauses for DBA verification, automatically computes `setval` sequence alignment statements, and applies sequence cutovers before certifying the migration in Slack.

    ## How it works

    1. `list_mysql_tables` (`io.kestra.plugin.jdbc.mysql.Query`) queries `information_schema.TABLES` to discover all base tables and current `AUTO_INCREMENT` values in the source MySQL database.
    2. `exact_count_mysql_tables` (`io.kestra.plugin.jdbc.mysql.Query`) executes a unified `UNION ALL` scan across all discovered tables to compute exact, deterministic `count(*)` row counts rather than statistical estimates.
    3. `inspect_postgres_catalog` (`io.kestra.plugin.jdbc.postgresql.Query`) connects to target PostgreSQL and resolves sequence linkages for both traditional `SERIAL` sequences (`nextval(...)`) and PostgreSQL 10+ `IDENTITY` columns (`is_identity = 'YES'`).
    4. `exact_count_postgres_tables` (`io.kestra.plugin.jdbc.postgresql.Query`) executes a parallel `UNION ALL` scan across all target PostgreSQL tables to calculate exact live table row counts.
    5. `reconcile_migration_parity` (`io.kestra.plugin.jdbc.duckdb.Queries`) mounts JSON outputs via `inputFiles` with `{{ workingDir }}` path references. A SQL `FULL OUTER JOIN` compares exact row counts and identifies sequence lag, generating `SELECT setval(...)` statements and exporting `migration_parity_reconciliation.csv` to Kestra internal storage.
    6. `sync_postgres_sequences` (`io.kestra.plugin.core.flow.If`) evaluates whether unsynced sequences exist and cutover is enabled (`apply_sequence_cutover: true`, `dry_run: false`). It enters `pause_cutover_approval` (`io.kestra.plugin.core.flow.Pause`) with a configurable `pauseDuration` (`PT15M`) to allow DBAs to review the diff before executing the sequence batch via `execute_sequence_cutover` (`io.kestra.plugin.jdbc.postgresql.Queries`).
    7. `certify_cutover_gate` (`io.kestra.plugin.core.execution.Assert`) evaluates `conditions` asserting zero row count mismatches and zero missing target tables before authorizing production cutover.
    8. `dispatch_cutover_report` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) formats reconciliation metrics into a structured Slack message linking the reconciliation CSV artifact.

    ## What you get

    - Heterogeneous schema reconciliation comparing exact MySQL and PostgreSQL row counts without statistical estimation drift.
    - Comprehensive sequence coverage across both legacy PostgreSQL `SERIAL` and modern `IDENTITY` columns (`GENERATED ALWAYS AS IDENTITY`).
    - Configurable approval pause gate (`pauseDuration: PT15M`) allowing DBAs to review reconciliation diffs prior to sequence mutations.
    - Safe default configurations (`apply_sequence_cutover: false`, `dry_run: true`) preventing accidental modifications during discovery runs.
    - Downloadable CSV audit reports preserved in Kestra execution storage for engineering compliance and sign-off records.

    ## Who it's for

    - Database Administrators (DBAs) managing MySQL to PostgreSQL platform migrations and maintenance windows.
    - Data Engineers running CDC pipelines that need sequence alignment prior to application cutover.
    - Platform Engineers responsible for zero-downtime database migration runbooks.

    ## Why orchestrate this with Kestra

    Heterogeneous database cutovers involve coordinating multiple database engines under tight maintenance windows. Manual SQL inspection across MySQL and PostgreSQL terminals is error-prone and lacks reproducible execution logging. Kestra coordinates JDBC connections across different database engines in a single declarative YAML workflow, uses DuckDB for fast in-memory joins between disparate database catalogs, generates audit artifacts, pauses for DBA review, and safely automates sequence adjustment with assertion gates.

    ## Pitfalls

    - **Long Scans on Multi-Million Row Tables**: Exact `count(*)` scans perform full table sequential reads. On very large tables (>50M rows), schedule this audit during dedicated low-traffic maintenance or cutover windows.
    - **Active Write Drift**: If replication is actively running and source writes have not been paused, table row counts may slightly diverge between the MySQL scan and PostgreSQL scan. Ensure application writes are drained or paused when validating cutover readiness.
    - **PostgreSQL Sequence Permissions**: Ensure the database user configured in `postgres_user` possesses `USAGE` and `UPDATE` privileges on all schema sequences to permit `setval` execution.

    ## Prerequisites

    - MySQL source instance with read access to `information_schema.TABLES` and table data.
    - PostgreSQL target instance with privileges to query `information_schema`, `pg_sequences`, and execute `setval`.
    - Secrets configured in Kestra namespace settings: `MYSQL_PASSWORD`, `POSTGRES_PASSWORD`, and `SLACK_WEBHOOK_URL`.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set `inputs.mysql_host` and `inputs.postgres_host` to your migration database endpoints.
    3. Configure `MYSQL_PASSWORD` and `POSTGRES_PASSWORD` in your namespace secrets.
    4. Run an initial test execution with `dry_run: true` to inspect the generated `migration_parity_reconciliation.csv` report.
    5. During your cutover window, set `dry_run: false` and `apply_sequence_cutover: true` to review the reconciliation diff, approve the pause gate, and align sequences for cutover.

    ## How to extend

    - **Table-Level Checksumming**: Extend the DuckDB query to compute and compare MD5 or SHA-256 row hashes across primary key ranges for high-criticality financial tables.
    - **Application Traffic Switching**: Add downstream Kubernetes or Route53 tasks to automatically update application database service endpoints following successful sequence alignment.
    - **Foreign Key Constraint Validation**: Append a post-sync PostgreSQL verification task to check that foreign key constraints can be validated (`ALTER TABLE ... VALIDATE CONSTRAINT`) after data loading completes.

    ## Links

    - [PostgreSQL Documentation: Sequence Manipulation Functions](https://www.postgresql.org/docs/current/functions-sequence.html)
    - [MySQL Documentation: The INFORMATION_SCHEMA TABLES Table](https://dev.mysql.com/doc/refman/8.0/en/information-schema-tables-table.html)
    - [Kestra PostgreSQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-postgresql)
    - [Kestra MySQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-mysql)
