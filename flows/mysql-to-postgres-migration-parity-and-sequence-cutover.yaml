id: mysql-to-postgres-migration-parity-and-sequence-cutover
namespace: company.database

description: |
  Audit heterogeneous replication parity between MySQL and PostgreSQL, detect table
  row count drift using DuckDB, and advance PostgreSQL serial sequences to match MySQL
  auto-increment values before final application cutover.

inputs:
  - id: mysql_host
    type: STRING
    description: Hostname or IP address of the source MySQL database.
    defaults: mysql.internal.corp

  - id: mysql_port
    type: INT
    description: Network port of the source MySQL database.
    defaults: 3306

  - id: mysql_database
    type: STRING
    description: Schema or database name in MySQL holding replicated tables.
    defaults: production_db

  - id: mysql_user
    type: STRING
    description: Database user for MySQL metadata inspection queries.
    defaults: migration_reader

  - id: postgres_host
    type: STRING
    description: Hostname or IP address of the target PostgreSQL database.
    defaults: postgres.internal.corp

  - id: postgres_port
    type: INT
    description: Network port of the target PostgreSQL database.
    defaults: 5432

  - id: postgres_database
    type: STRING
    description: Database name on the target PostgreSQL server.
    defaults: production_db

  - id: postgres_schema
    type: STRING
    description: Target PostgreSQL schema containing the replicated tables.
    defaults: public

  - id: postgres_user
    type: STRING
    description: Database user with sequence administration privileges on PostgreSQL.
    defaults: migration_admin

  - id: apply_sequence_cutover
    type: BOOL
    description: When true and dry_run is false, advances PostgreSQL sequence values using setval.
    defaults: true

  - id: dry_run
    type: BOOL
    description: When true, inspects schemas and outputs reconciliation reports without modifying PostgreSQL sequences.
    defaults: true

triggers:
  - id: scheduled_parity_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run periodic replication parity audit during the pre-cutover testing window.
    cron: 0 2 * * 0
    disabled: true

tasks:
  - id: inspect_mysql_metadata
    type: io.kestra.plugin.jdbc.mysql.Query
    description: Query MySQL information_schema to extract table names, row count estimates, and auto-increment sequence counters.
    url: "jdbc:mysql://{{ inputs.mysql_host }}:{{ inputs.mysql_port }}/{{ inputs.mysql_database }}?useSSL=false&allowPublicKeyRetrieval=true"
    username: "{{ inputs.mysql_user }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT 
        t.TABLE_NAME AS table_name,
        COALESCE(t.TABLE_ROWS, 0) AS row_count,
        COALESCE(t.AUTO_INCREMENT, 1) AS auto_increment,
        COALESCE(c.COLUMN_NAME, 'id') AS pk_column
      FROM information_schema.TABLES t
      LEFT JOIN information_schema.COLUMNS c 
        ON t.TABLE_SCHEMA = c.TABLE_SCHEMA 
        AND t.TABLE_NAME = c.TABLE_NAME 
        AND c.COLUMN_KEY = 'PRI'
      WHERE t.TABLE_SCHEMA = '{{ inputs.mysql_database }}'
        AND t.TABLE_TYPE = 'BASE TABLE'
      ORDER BY t.TABLE_NAME;

  - id: inspect_postgres_metadata
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Query PostgreSQL catalogs to extract table names, live row counts, and serial sequence states.
    url: "jdbc:postgresql://{{ inputs.postgres_host }}:{{ inputs.postgres_port }}/{{ inputs.postgres_database }}"
    username: "{{ inputs.postgres_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT 
        t.table_name,
        COALESCE(s.n_live_tup, 0) AS row_count,
        pg_get_serial_sequence(quote_ident('{{ inputs.postgres_schema }}') || '.' || quote_ident(t.table_name), c.column_name) AS sequence_name,
        COALESCE(seq.last_value, 1) AS last_value,
        c.column_name AS pk_column
      FROM information_schema.tables t
      JOIN information_schema.columns c 
        ON t.table_schema = c.table_schema 
        AND t.table_name = c.table_name
      LEFT JOIN pg_stat_user_tables s 
        ON s.schemaname = t.table_schema 
        AND s.relname = t.table_name
      LEFT JOIN pg_sequences seq 
        ON seq.schemaname = t.table_schema 
        AND seq.sequencename = pg_get_serial_sequence(quote_ident('{{ inputs.postgres_schema }}') || '.' || quote_ident(t.table_name), c.column_name)
      WHERE t.table_schema = '{{ inputs.postgres_schema }}'
        AND t.table_type = 'BASE TABLE'
        AND c.column_default LIKE 'nextval(%'
      ORDER BY t.table_name;

  - id: reconcile_migration_parity
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Join MySQL and PostgreSQL metadata in DuckDB to flag row drift, missing tables, and lagging sequences.
    inputFiles:
      mysql_meta.json: "{{ outputs.inspect_mysql_metadata.rows | toJson }}"
      postgres_meta.json: "{{ outputs.inspect_postgres_metadata.rows | toJson }}"
    outputFiles:
      - migration_parity_reconciliation.csv
    sql: |
      CREATE TABLE mysql_tables AS SELECT * FROM read_json_auto('mysql_meta.json');
      CREATE TABLE postgres_tables AS SELECT * FROM read_json_auto('postgres_meta.json');

      CREATE TABLE reconciliation AS
      SELECT 
        COALESCE(m.table_name, p.table_name) AS table_name,
        COALESCE(m.pk_column, p.pk_column) AS pk_column,
        COALESCE(m.row_count, 0) AS mysql_rows,
        COALESCE(p.row_count, 0) AS postgres_rows,
        COALESCE(m.auto_increment, 1) AS mysql_auto_increment,
        p.sequence_name AS postgres_sequence,
        COALESCE(p.last_value, 1) AS postgres_sequence_val,
        CASE 
          WHEN m.table_name IS NULL THEN 'MISSING_IN_MYSQL'
          WHEN p.table_name IS NULL THEN 'MISSING_IN_POSTGRES'
          WHEN m.row_count != p.row_count THEN 'ROW_COUNT_MISMATCH'
          WHEN p.sequence_name IS NOT NULL AND (p.last_value IS NULL OR p.last_value < m.auto_increment - 1) THEN 'SEQUENCE_OUT_OF_SYNC'
          ELSE 'IN_SYNC'
        END AS parity_status,
        CASE
          WHEN p.sequence_name IS NOT NULL AND (p.last_value IS NULL OR p.last_value < m.auto_increment - 1)
          THEN 'SELECT setval(''' || p.sequence_name || ''', ' || CAST(m.auto_increment - 1 AS VARCHAR) || ', true);'
          ELSE NULL
        END AS fix_sequence_sql
      FROM mysql_tables m
      FULL OUTER JOIN postgres_tables p ON m.table_name = p.table_name;

      COPY reconciliation TO 'migration_parity_reconciliation.csv' (HEADER, DELIMITER ',');

      SELECT 
        count(*) AS total_tables_audited,
        count(*) FILTER (WHERE parity_status = 'ROW_COUNT_MISMATCH') AS row_mismatches,
        count(*) FILTER (WHERE parity_status = 'SEQUENCE_OUT_OF_SYNC') AS unsynced_sequences,
        count(*) FILTER (WHERE parity_status = 'MISSING_IN_POSTGRES') AS missing_target_tables,
        count(*) FILTER (WHERE parity_status = 'IN_SYNC') AS verified_synced_tables
      FROM reconciliation;
    fetchType: FETCH

  - id: sync_postgres_sequences
    type: io.kestra.plugin.core.flow.If
    description: Apply generated sequence alignment statements to PostgreSQL when sequence lag is detected and cutover is enabled.
    condition: "{{ outputs.reconcile_migration_parity.rows[0].unsynced_sequences > 0 and inputs.apply_sequence_cutover == true and inputs.dry_run == false }}"
    then:
      - id: execute_sequence_cutover
        type: io.kestra.plugin.jdbc.postgresql.Queries
        description: Advance PostgreSQL sequence counters to match source MySQL auto-increment values.
        url: "jdbc:postgresql://{{ inputs.postgres_host }}:{{ inputs.postgres_port }}/{{ inputs.postgres_database }}"
        username: "{{ inputs.postgres_user }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        sql: |
          {% for r in outputs.reconcile_migration_parity.rows %}
          {% if r.fix_sequence_sql %}
          {{ r.fix_sequence_sql }}
          {% endif %}
          {% endfor %}

      - id: log_sequence_cutover
        type: io.kestra.plugin.core.log.Log
        description: Log successful sequence update counts to execution audit logs.
        message: "Successfully synchronized {{ outputs.reconcile_migration_parity.rows[0].unsynced_sequences }} sequences on target PostgreSQL database."
    else:
      - id: log_cutover_status
        type: io.kestra.plugin.core.log.Log
        description: Log informational message when sequence synchronization is skipped or unnecessary.
        message: "Sequence cutover check complete: {{ outputs.reconcile_migration_parity.rows[0].unsynced_sequences }} sequences require alignment (dry_run: {{ inputs.dry_run }})."

  - id: certify_cutover_gate
    type: io.kestra.plugin.core.execution.Assert
    description: Assert zero row drift and verified sequence alignment before authorizing application cutover.
    expression: "{{ inputs.dry_run == true or (outputs.reconcile_migration_parity.rows[0].row_mismatches == 0 and outputs.reconcile_migration_parity.rows[0].missing_target_tables == 0) }}"
    errorMessage: "Migration cutover gate rejected: Row count mismatch or missing target tables detected between MySQL and PostgreSQL."

  - id: dispatch_cutover_report
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch migration reconciliation status and cutover readiness report to the DBA team channel.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#database-migrations",
        "text": ":satellite: *MySQL to PostgreSQL Migration Parity Report*\nTotal Tables: `{{ outputs.reconcile_migration_parity.rows[0].total_tables_audited }}`\nVerified Synced: `{{ outputs.reconcile_migration_parity.rows[0].verified_synced_tables }}`\nRow Mismatches: `{{ outputs.reconcile_migration_parity.rows[0].row_mismatches }}`\nUnsynced Sequences: `{{ outputs.reconcile_migration_parity.rows[0].unsynced_sequences }}`\nReconciliation CSV: `{{ outputs.reconcile_migration_parity.outputFiles['migration_parity_reconciliation.csv'] }}`"
      }

extend:
  title: Reconcile MySQL to PostgreSQL Migration Parity and Synchronize Sequences for Cutover
  shortDescription: Compare MySQL and PostgreSQL table row counts in DuckDB and advance PostgreSQL sequence counters to prevent cutover duplicate key collisions.
  metaTitle: MySQL to PostgreSQL Migration Parity and Sequence Cutover
  metaDescription: Reconcile MySQL and PostgreSQL tables in DuckDB, detect replication drift, and synchronize PostgreSQL serial sequences for cutover in Kestra.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    Migrating production workloads from MySQL to PostgreSQL (such as Amazon Aurora MySQL to Aurora PostgreSQL, Supabase, or Neon) frequently encounters a subtle, catastrophic production outage during application cutover: duplicate key collisions on auto-incrementing primary keys. Change Data Capture (CDC) replication tools like Debezium, Airbyte, or pgloader replicate table data, but they do not automatically advance PostgreSQL `SERIAL` or `IDENTITY` sequence counters. When the application redirects write traffic to PostgreSQL, the first `INSERT` attempts to allocate `id = 1`, resulting in immediate unique constraint violations (`Key (id)=(1) already exists`).

    This blueprint orchestrates an end-to-end migration parity audit and cutover gate. It interrogates MySQL `information_schema.TABLES` for row counts and `AUTO_INCREMENT` high-water marks, queries PostgreSQL catalogs for current `pg_sequences` values, joins both schemas inside an in-memory DuckDB database, flags row count drift, automatically computes `setval` sequence alignment statements, and applies sequence cutovers before certifying the migration in Slack.

    ## How it works

    1. `inspect_mysql_metadata` (`io.kestra.plugin.jdbc.mysql.Query`) connects to the source MySQL instance and extracts all base tables, row counts, and current `AUTO_INCREMENT` values from `information_schema.TABLES` joined with primary key column names.
    2. `inspect_postgres_metadata` (`io.kestra.plugin.jdbc.postgresql.Query`) connects to the target PostgreSQL database and queries `information_schema.tables`, `information_schema.columns`, `pg_stat_user_tables`, and `pg_sequences` to extract live live row counts and associated sequence names with `last_value`.
    3. `reconcile_migration_parity` (`io.kestra.plugin.jdbc.duckdb.Queries`) mounts the JSON result sets from both databases into DuckDB via `inputFiles`. A SQL `FULL OUTER JOIN` compares row counts and evaluates sequence alignment, categorizing tables into `IN_SYNC`, `ROW_COUNT_MISMATCH`, or `SEQUENCE_OUT_OF_SYNC`. It formats dynamic `SELECT setval(...)` statements for lagging sequences and exports `migration_parity_reconciliation.csv` to Kestra internal storage.
    4. `sync_postgres_sequences` (`io.kestra.plugin.core.flow.If`) checks whether any sequences are lagging and whether `apply_sequence_cutover` is active with `dry_run: false`. If so, it executes the generated `setval` batch against PostgreSQL via `io.kestra.plugin.jdbc.postgresql.Queries` and logs audit progress.
    5. `certify_cutover_gate` (`io.kestra.plugin.core.execution.Assert`) asserts that there are zero row count mismatches and zero missing tables before green-lighting the cutover.
    6. `dispatch_cutover_report` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) formats the audit findings into a structured Slack message linking the reconciliation CSV artifact.

    ## What you get

    - Heterogeneous schema reconciliation comparing MySQL and PostgreSQL row counts without standing up dedicated comparison infrastructure.
    - Automated detection and remediation of the primary cutover failure mode: unaligned serial sequences on target PostgreSQL tables.
    - Safe validation with `dry_run: true` providing full visibility into required sequence adjustments before mutating target state.
    - Downloadable CSV audit reports preserved in Kestra execution storage for engineering sign-off records.
    - Automated notification to database engineering and DevOps channels on cutover completion.

    ## Who it's for

    - Database Administrators (DBAs) managing MySQL to PostgreSQL platform migrations.
    - Data Engineers running CDC pipelines that need sequence alignment prior to cutover windows.
    - Platform Engineers responsible for zero-downtime database migration runbooks.

    ## Why orchestrate this with Kestra

    Heterogeneous database cutovers involve coordinating multiple database engines under tight maintenance windows. Manual SQL inspection across MySQL and PostgreSQL terminals is error-prone and lacks reproducible execution logging. Kestra coordinates JDBC connections across different database engines in a single declarative YAML workflow, uses DuckDB for fast in-memory joins between disparate database catalogs, generates audit artifacts, and safely automates sequence adjustment with assertion gates.

    ## Pitfalls

    - **MySQL TABLE_ROWS Approximation**: For InnoDB tables, `information_schema.TABLES.TABLE_ROWS` provides an estimated row count from internal statistics. In high-write environments, small discrepancies may appear. During cutover windows, ensure source writes are temporarily paused before executing the parity gate.
    - **PostgreSQL Identity vs Serial Sequences**: Modern PostgreSQL tables may use `GENERATED ALWAYS AS IDENTITY` instead of `SERIAL`. `pg_get_serial_sequence` correctly resolves both sequence mechanisms provided the target column has a default sequence generator attached.
    - **Connection Credentials**: Ensure the PostgreSQL user configured in `postgres_user` possesses `USAGE` and `UPDATE` privileges on the target schema sequences to permit `setval` execution.

    ## Prerequisites

    - MySQL source instance with read access to `information_schema.TABLES` and `COLUMNS`.
    - PostgreSQL target instance with privileges to query `pg_sequences` and execute `setval`.
    - Secrets configured in Kestra namespace settings: `MYSQL_PASSWORD`, `POSTGRES_PASSWORD`, and `SLACK_WEBHOOK_URL`.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set `inputs.mysql_host` and `inputs.postgres_host` to your migration database endpoints.
    3. Configure `MYSQL_PASSWORD` and `POSTGRES_PASSWORD` in your namespace secrets.
    4. Run an initial test execution with `dry_run: true` to inspect the generated `migration_parity_reconciliation.csv` report.
    5. During your cutover window, set `dry_run: false` and `apply_sequence_cutover: true` to align sequences and certify cutover readiness.

    ## How to extend

    - **Table-Level Checksumming**: Extend the DuckDB query to compute and compare MD5 or SHA-256 row hashes across primary key ranges for high-criticality financial tables.
    - **Application Traffic Switching**: Add downstream Kubernetes or Route53 tasks to automatically update application database service endpoints following successful sequence alignment.
    - **Foreign Key Constraint Validation**: Append a post-sync PostgreSQL verification task to check that foreign key constraints can be validated (`ALTER TABLE ... VALIDATE CONSTRAINT`) after data loading completes.

    ## Links

    - [PostgreSQL Documentation: Sequence Manipulation Functions](https://www.postgresql.org/docs/current/functions-sequence.html)
    - [MySQL Documentation: The INFORMATION_SCHEMA TABLES Table](https://dev.mysql.com/doc/refman/8.0/en/information-schema-tables-table.html)
    - [Kestra PostgreSQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-postgresql)
    - [Kestra MySQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-mysql)
