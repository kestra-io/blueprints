id: ai-incident-triage-response
namespace: io.kestra.examples

description: |
  An AI-powered incident triage and response workflow that analyzes
  production incidents, extracts structured incident intelligence,
  determines severity and customer impact, recommends an initial response,
  and automatically escalates urgent incidents to Slack.

extend:
  title: AI Incident Triage & Response
  shortDescription: >
    Use AI to analyze production incidents, determine severity and impact,
    recommend an initial response, and escalate urgent events.
  description: |
    # AI Incident Triage & Response

    This reusable Blueprint automates the first stage of production
    incident response.

    Modern engineering teams receive incidents from monitoring systems,
    applications, infrastructure platforms, and customer reports. Manually
    reviewing every incident can delay response to the events that require
    immediate attention.

    This workflow uses an AI model to transform an unstructured incident
    description into structured incident intelligence.

    ## What the workflow determines

    For every incident, the AI identifies:

    - **Severity** — P0 Critical, P1 High, P2 Medium, or P3 Low
    - **Category** — availability, performance, security, data, or other
    - **Customer impact** — none, low, medium, high, or widespread
    - **Confidence** — low, medium, or high
    - **Recommended action** — an initial response for the engineering team

    ## How it works

    1. Receive incident information through the workflow inputs.
    2. Analyze the incident with AI.
    3. Extract structured incident intelligence.
    4. Route the incident according to its severity.
    5. Generate an escalation summary for urgent incidents.
    6. Notify the incident-response team through Slack.
    7. Record lower-severity incidents for normal investigation.
    8. Produce a final incident-triage summary.

    ## Severity model

    - **P0 Critical** — widespread or severe production impact requiring
      immediate response.
    - **P1 High** — significant production impact requiring urgent attention.
    - **P2 Medium** — limited impact requiring normal investigation.
    - **P3 Low** — informational, minor, or low-impact issue.

    ## Real-world use cases

    This Blueprint can be connected to:

    - Monitoring and observability platforms
    - Application alerting systems
    - Infrastructure monitoring
    - API gateways
    - Customer support systems
    - Incident-management platforms
    - Custom internal alerting systems

    The workflow can also be extended with PagerDuty, Jira, email,
    databases, ticketing systems, runbooks, RAG, or automated remediation.

    ## Security

    AI and Slack credentials are stored using Kestra secrets.
    Credentials are never hardcoded in the workflow.

    Required secrets:

    - `OPENAI_API_KEY`
    - `SLACK_WEBHOOK_URL`

  metaTitle: AI Incident Triage & Response with Kestra
  metaDescription: >
    Automatically analyze production incidents with AI, determine severity
    and customer impact, recommend an initial response, and escalate urgent
    incidents through Slack.
  tags:
    - AI
    - Infrastructure
    - System
  ee: false
  demo: true

inputs:
  - id: incident_title
    type: STRING
    defaults: "Production API returning HTTP 500 errors"
    description: >
      Short title describing the incident.

  - id: incident_description
    type: STRING
    defaults: >
      The production API is returning HTTP 500 errors for approximately
      40 percent of requests. Customers are reporting failed requests
      and the error rate has increased significantly during the last
      15 minutes.
    description: >
      Detailed description of the incident, including symptoms,
      scope, and customer impact.

  - id: affected_service
    type: STRING
    defaults: "production-api"
    description: >
      Name of the application, service, or infrastructure component
      affected by the incident.

tasks:
  - id: analyze_incident
    type: io.kestra.plugin.ai.completion.JSONStructuredExtraction
    schemaName: incident_triage
    jsonFields:
      - severity
      - category
      - customer_impact
      - confidence
      - recommended_action
    description: >
      Analyze the incident and extract structured severity, category,
      customer impact, confidence, and recommended response information.
    provider:
      type: io.kestra.plugin.ai.provider.OpenAI
      apiKey: "{{ secret('OPENAI_API_KEY') }}"
      modelName: gpt-5-mini
    systemMessage: |
      You are an experienced Site Reliability Engineer performing
      first-response incident triage.

      Analyze the incident using only the information provided.
      Do not invent facts.

      Severity definitions:

      P0 Critical:
      Widespread or severe production impact requiring immediate response.

      P1 High:
      Significant production impact requiring urgent engineering attention.

      P2 Medium:
      Limited impact that should be investigated during normal operations.

      P3 Low:
      Informational, minor, or low-impact issue.

      Category must be one of:
      availability, performance, security, data, other.

      Customer impact must be one of:
      none, low, medium, high, widespread.

      Confidence must be one of:
      low, medium, high.

    prompt: |
      Analyze this production incident.

      Incident title:
      {{ inputs.incident_title }}

      Affected service:
      {{ inputs.affected_service }}

      Incident description:
      {{ inputs.incident_description }}

      Return:

      severity:
      P0 Critical, P1 High, P2 Medium, or P3 Low.

      category:
      availability, performance, security, data, or other.

      customer_impact:
      none, low, medium, high, or widespread.

      confidence:
      low, medium, or high.

      recommended_action:
      A concise first-response action an engineer should consider.

  - id: route_incident
    type: io.kestra.plugin.core.flow.If
    description: >
      Route critical and high-severity incidents to immediate escalation
      while allowing medium and low-severity incidents to follow the
      normal investigation path.
    condition: >-
      {{
        fromJson(outputs.analyze_incident.extractedJson).severity == 'P0 Critical'
        or
        fromJson(outputs.analyze_incident.extractedJson).severity == 'P1 High'
      }}
    then:
      - id: build_escalation_summary
        type: io.kestra.plugin.core.debug.Return
        description: >
          Build an actionable escalation summary for the incident-response team.
        format: |
          INCIDENT ESCALATION REQUIRED

          Severity:
          {{ fromJson(outputs.analyze_incident.extractedJson).severity }}

          Category:
          {{ fromJson(outputs.analyze_incident.extractedJson).category }}

          Customer impact:
          {{ fromJson(outputs.analyze_incident.extractedJson).customer_impact }}

          AI confidence:
          {{ fromJson(outputs.analyze_incident.extractedJson).confidence }}

          Service:
          {{ inputs.affected_service }}

          Title:
          {{ inputs.incident_title }}

          Recommended action:
          {{ fromJson(outputs.analyze_incident.extractedJson).recommended_action }}

          Original incident:
          {{ inputs.incident_description }}

      - id: notify_incident_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: >
          Notify the incident-response team when an urgent incident
          requires immediate engineering attention.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          🚨 INCIDENT ESCALATION

          Severity:
          {{ fromJson(outputs.analyze_incident.extractedJson).severity }}

          Category:
          {{ fromJson(outputs.analyze_incident.extractedJson).category }}

          Customer impact:
          {{ fromJson(outputs.analyze_incident.extractedJson).customer_impact }}

          AI confidence:
          {{ fromJson(outputs.analyze_incident.extractedJson).confidence }}

          Service:
          {{ inputs.affected_service }}

          Title:
          {{ inputs.incident_title }}

          Recommended action:
          {{ fromJson(outputs.analyze_incident.extractedJson).recommended_action }}

          Incident:
          {{ inputs.incident_description }}

          Automatically triaged by Kestra AI Incident Triage.

    else:
      - id: record_routine_incident
        type: io.kestra.plugin.core.debug.Return
        description: >
          Record lower-severity incidents for normal investigation.
        format: |
          INCIDENT TRIAGED

          Severity:
          {{ fromJson(outputs.analyze_incident.extractedJson).severity }}

          Category:
          {{ fromJson(outputs.analyze_incident.extractedJson).category }}

          Customer impact:
          {{ fromJson(outputs.analyze_incident.extractedJson).customer_impact }}

          AI confidence:
          {{ fromJson(outputs.analyze_incident.extractedJson).confidence }}

          Service:
          {{ inputs.affected_service }}

          Title:
          {{ inputs.incident_title }}

          Recommended action:
          {{ fromJson(outputs.analyze_incident.extractedJson).recommended_action }}

          No immediate escalation is required.

  - id: incident_summary
    type: io.kestra.plugin.core.debug.Return
    description: >
      Produce a final summary of the completed AI incident-triage decision.
    format: |
      INCIDENT TRIAGE COMPLETED

      Title:
      {{ inputs.incident_title }}

      Service:
      {{ inputs.affected_service }}

      Severity:
      {{ fromJson(outputs.analyze_incident.extractedJson).severity }}

      Category:
      {{ fromJson(outputs.analyze_incident.extractedJson).category }}

      Customer impact:
      {{ fromJson(outputs.analyze_incident.extractedJson).customer_impact }}

      AI confidence:
      {{ fromJson(outputs.analyze_incident.extractedJson).confidence }}

      Recommended action:
      {{ fromJson(outputs.analyze_incident.extractedJson).recommended_action }}

triggers:
  - id: incident_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: >
      Receive incident events from monitoring systems, applications,
      alerting platforms, or custom integrations.
    key: AIIncidentTriage2026