id: pagerduty-incident-auto-triage
namespace: company.sre

inputs:
  - id: incident_title
    type: STRING
    required: true
    defaults: "Database connection pool exhaustion on payment-gateway"
    description: "Brief summary of the detected incident"

  - id: service_name
    type: STRING
    required: true
    defaults: "payment-gateway"
    description: "Affected service name"

  - id: severity
    type: SELECT
    required: true
    values:
      - CRITICAL
      - HIGH
      - WARNING
      - INFO
    defaults: CRITICAL
    description: "Initial alert severity from monitoring provider"

  - id: error_logs
    type: STRING
    required: true
    defaults: "ERROR [HikariPool-1] - Connection timeout after 30000ms. Active pool size: 50/50. Thread starvation detected."
    description: "Raw error log or stack trace payload"

triggers:
  - id: webhook_alert
    type: io.kestra.plugin.core.trigger.Webhook
    key: "sre-incident-triage-key"

tasks:
  - id: automated_diagnostics
    type: io.kestra.plugin.scripts.python.Script
    description: "Analyzes error logs against standard SRE runbooks and produces diagnostic recommendations"
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra
    env:
      ERROR_LOGS: "{{ inputs.error_logs }}"
      ALERT_SEVERITY: "{{ inputs.severity }}"
      SERVICE_NAME: "{{ inputs.service_name }}"
    script: |
      import os
      import re
      from kestra import Kestra

      logs = os.environ.get("ERROR_LOGS", "")
      severity = os.environ.get("ALERT_SEVERITY", "INFO")
      service = os.environ.get("SERVICE_NAME", "unknown")

      # SRE pattern heuristics
      pool_exhaustion = bool(re.search(r"connection timeout|pool size|pool exhaustion|starvation", logs, re.IGNORECASE))
      oom_killed = bool(re.search(r"out of memory|oomkilled|heap space", logs, re.IGNORECASE))

      if pool_exhaustion:
          diagnosis = "Downstream database saturation or unclosed connection leak detected."
          recommended_action = "Scale read replicas and flush idle connections on primary DB."
          should_escalate = True
      elif oom_killed:
          diagnosis = "JVM/Process memory limit exceeded."
          recommended_action = "Restart pod with 2x heap memory allocation."
          should_escalate = True
      else:
          diagnosis = "Unclassified transient error signature."
          recommended_action = "Check recent deployment diffs."
          should_escalate = severity in ["CRITICAL", "HIGH"]

      # Emit variables to downstream Kestra tasks
      Kestra.outputs({
          "diagnosis": diagnosis,
          "recommended_action": recommended_action,
          "escalate": should_escalate,
          "status": "ANALYZED"
      })

  - id: evaluate_severity_and_escalate
    type: io.kestra.plugin.core.flow.If
    description: "Flowable condition determining whether to page on-call engineers or log for regular review"
    condition: "{{ outputs.automated_diagnostics.vars.escalate == true or inputs.severity == 'CRITICAL' }}"
    then:
      - id: trigger_pagerduty_incident
        type: io.kestra.plugin.pagerduty.PagerDutyAlert
        description: "Creates an incident on PagerDuty via Events API v2"
        url: "https://events.pagerduty.com/v2/enqueue"
        payload: |
          {
            "routing_key": "{{ secret('PAGERDUTY_ROUTING_KEY') }}",
            "event_action": "trigger",
            "dedup_key": "kestra-incident-{{ inputs.service_name }}-{{ execution.id }}",
            "payload": {
              "summary": "[{{ inputs.severity }}] {{ inputs.incident_title }}",
              "source": "kestra-sre-engine",
              "severity": "critical",
              "component": "{{ inputs.service_name }}",
              "custom_details": {
                "execution_id": "{{ execution.id }}",
                "diagnosis": "{{ outputs.automated_diagnostics.vars.diagnosis }}",
                "action_plan": "{{ outputs.automated_diagnostics.vars.recommended_action }}",
                "flow_link": "{{ flow.namespace }}/{{ flow.id }}"
              }
            }
          }

      - id: dispatch_slack_war_room
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches an escalation notification to SRE Slack channel"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *CRITICAL SRE ESCALATION TRIGGERED*\n*Service:* {{ inputs.service_name }}\n*Incident:* {{ inputs.incident_title }}\n*Diagnosis:* {{ outputs.automated_diagnostics.vars.diagnosis }}\n*Recommended Action:* {{ outputs.automated_diagnostics.vars.recommended_action }}\n*PagerDuty Incident Created:* Yes (Dedup: `kestra-incident-{{ inputs.service_name }}-{{ execution.id }}`)"
          }

    else:
      - id: log_routine_notice
        type: io.kestra.plugin.core.log.Log
        description: "Logs routine warnings that do not require human wake-up pages"
        message: "Alert for service '{{ inputs.service_name }}' processed. Severity: {{ inputs.severity }}. Diagnosis: {{ outputs.automated_diagnostics.vars.diagnosis }}. No on-call page required."

  - id: finalize_incident_audit_record
    type: io.kestra.plugin.core.output.OutputValues
    description: "Publishes final structured incident telemetry for audit trail and post-mortem analysis"
    values:
      execution_id: "{{ execution.id }}"
      service: "{{ inputs.service_name }}"
      severity: "{{ inputs.severity }}"
      diagnosis: "{{ outputs.automated_diagnostics.vars.diagnosis }}"
      action_plan: "{{ outputs.automated_diagnostics.vars.recommended_action }}"
      escalated: "{{ outputs.automated_diagnostics.vars.escalate }}"
      status: "COMPLETED"

errors:
  - id: on_pipeline_failure_fallback
    type: io.kestra.plugin.pagerduty.PagerDutyAlert
    description: "Emergency fallback: pages on-call if the triage pipeline itself encounters an unexpected failure"
    url: "https://events.pagerduty.com/v2/enqueue"
    payload: |
      {
        "routing_key": "{{ secret('PAGERDUTY_ROUTING_KEY') }}",
        "event_action": "trigger",
        "payload": {
          "summary": "EMERGENCY: Kestra SRE Auto-Triage Pipeline Failed",
          "source": "kestra-pipeline-monitor",
          "severity": "error",
          "custom_details": {
            "failed_execution_id": "{{ execution.id }}",
            "failed_flow": "{{ flow.id }}"
          }
        }
      }

extend:
  title: Event-Driven Incident Auto-Triage with PagerDuty and SRE Diagnostics
  metaTitle: Event-Driven Incident Auto-Triage with PagerDuty and SRE Diagnostics
  shortDescription: Triages incoming monitoring alerts with Python-based SRE diagnostics and escalates critical outages via PagerDuty and Slack.
  metaDescription: Triage monitoring alerts automatically with Python-based SRE diagnostics and route critical incidents to PagerDuty and Slack war rooms.
  description: |
    Production incidents demand immediate diagnostics, but waking up engineers for transient glitches or misdiagnosing saturated connection pools drives alert fatigue. This blueprint implements an event-driven incident auto-triage workflow that intercepts alerts via Webhook, executes containerized diagnostic runbooks with Python, and conditionally escalates confirmed critical outages to PagerDuty and Slack while suppressing false alarms.

    ## How it works

    1. **Webhook Ingestion**: The `webhook_alert` trigger (`io.kestra.plugin.core.trigger.Webhook`) accepts real-time incident payloads from monitoring stacks (Prometheus Alertmanager, Datadog, Grafana, AWS CloudWatch).
    2. **Automated Diagnostics**: The `automated_diagnostics` task (`io.kestra.plugin.scripts.python.Script` inside Docker) inspects raw error logs and stack traces against heuristic SRE runbook patterns (database connection starvation, OOM kills, unclassified errors), extracting actionable mitigation actions and an escalation recommendation.
    3. **Conditional Severity Gate**: The `evaluate_severity_and_escalate` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether the diagnosis requires human intervention:
       - **Escalate**: If critical or confirmed by diagnostics, creates a PagerDuty incident via `trigger_pagerduty_incident` (`io.kestra.plugin.pagerduty.PagerDutyAlert`) using Events API v2 with automatic deduplication, then dispatches an incident briefing card to Slack via `dispatch_slack_war_room` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - **Suppress & Log**: If non-critical, logs routine findings via `log_routine_notice` (`io.kestra.plugin.core.log.Log`) without waking on-call personnel.
    4. **Telemetry Export**: The `finalize_incident_audit_record` task (`io.kestra.plugin.core.output.OutputValues`) publishes structured triage findings for post-mortem analysis and SLA reporting.
    5. **Pipeline Resilience**: An `errors` handler (`on_pipeline_failure_fallback`) ensures that if the triage pipeline itself fails, an emergency PagerDuty alert is dispatched to safeguard observability reliability.

    ## What you get

    - Automated first-line log inspection before waking on-call engineers.
    - Deterministic deduplication across PagerDuty incidents using composite execution keys.
    - Clean separation between noisy transient warnings and high-priority outages.
    - Fallback error handler ensuring triage pipeline health is monitored.

    ## Who it's for

    - Site Reliability Engineers (SREs) and DevOps teams managing 24/7 on-call rotations.
    - Platform teams seeking to reduce on-call alert fatigue and lower Mean Time to Acknowledge (MTTA).
    - Engineering organizations integrating monitoring alerts with PagerDuty and Slack war rooms.

    ## Why orchestrate this with Kestra

    Kestra coordinates webhook ingestion, isolated Docker runtime environments for Python diagnostics, conditional routing logic, and multi-channel alerting into a single auditable execution graph. If a downstream notification fails or logs are malformed, Kestra's execution history provides full replayability and audit traces without maintaining dedicated triage servers.

    ## Prerequisites

    - A PagerDuty technical service with an Events API v2 integration key.
    - A Slack Incoming Webhook URL for the SRE incident channel.
    - Docker or container runtime enabled on Kestra workers for Python script execution.

    ### Secrets

    - `PAGERDUTY_ROUTING_KEY`: 32-character PagerDuty Integration Key for the Events API v2 endpoint.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for incident notification broadcasting.

    ## Quick start

    1. Configure the `PAGERDUTY_ROUTING_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace under namespace `company.sre`.
    3. Execute the flow manually with test log payloads to verify diagnostic outputs and alerting logic.
    4. Configure your monitoring webhook (Alertmanager or Datadog) to post incident payloads to Kestra's webhook trigger endpoint.

    ## How to extend

    - Connect vector search or LLM enrichment to query internal post-mortem repositories for past incident resolutions.
    - Automatically generate an incident channel in Slack using the Slack API plugin.
    - Add automated remediation actions (e.g. restart Kubernetes pods or trigger rollbacks) inside the `then` branch.

    ## Links

    - [PagerDuty Plugin Documentation](https://kestra.io/plugins/plugin-pagerduty)
    - [Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Python Script Task Documentation](https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.script)
    - [PagerDuty Events API v2 Overview](https://developer.pagerduty.com/docs/ZG9jOjExMDI5NTgw-events-api-v2-overview)
    - This blueprint has been created by [Pranjulchaurasiya](https://github.com/Pranjulchaurasiya)
  tags:
    - Infrastructure
  subTags:
    - Incident Response
    - Monitoring & Alerting
  ee: false
  demo: false
