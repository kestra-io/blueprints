id: aws-idle-resource-sweep
namespace: company.finops

description: |
  One weekly sweep for the seven most common sources of idle AWS waste: EC2
  instances stopped for weeks (their attached EBS keeps billing), unattached EBS
  volumes, unassociated Elastic IPs, load balancers serving zero traffic, stale
  manual snapshots, unused security groups, and AMIs no instance uses. A single
  flow audits every region in one pass and produces one consolidated report with
  a dollar estimate per resource type.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to sweep for idle resources.
  - id: idle_days
    type: INT
    defaults: 30
    description: Age threshold in days for stopped EC2 instances and available EBS volumes to count as idle.
  - id: traffic_window_days
    type: INT
    defaults: 14
    description: CloudWatch lookback window in days for the load balancer traffic check.
  - id: snapshot_age_days
    type: INT
    defaults: 90
    description: Age threshold in days for manual snapshots to count as stale.
  - id: ami_age_days
    type: INT
    defaults: 90
    description: Age threshold in days for unused AMIs to be reported.
  - id: ebs_price_per_gb_usd
    type: STRING
    defaults: "0.08"
    description: Monthly EBS cost per GB-month in USD (gp3 list price; tune to your volume mix).
  - id: snapshot_price_per_gb_usd
    type: STRING
    defaults: "0.05"
    description: Monthly EBS snapshot cost per GB-month in USD (AWS list price).
  - id: eip_monthly_cost_usd
    type: STRING
    defaults: "3.65"
    description: Monthly cost of one unattached Elastic IP in USD (AWS list price).
  - id: lb_monthly_cost_usd
    type: STRING
    defaults: "18.00"
    description: Monthly base cost of one ALB/NLB in USD (before LCU charges).

tasks:
  - id: sweep
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Audit all seven idle-resource types across every region in a single pass.
    commands:
      - |
        REGIONS="{{ inputs.aws_regions | join(' ') }}"
        IDLE_DAYS={{ inputs.idle_days }}
        TRAFFIC_DAYS={{ inputs.traffic_window_days }}
        SNAP_DAYS={{ inputs.snapshot_age_days }}
        AMI_DAYS={{ inputs.ami_age_days }}
        EBS_PRICE={{ inputs.ebs_price_per_gb_usd }}
        SNAP_PRICE={{ inputs.snapshot_price_per_gb_usd }}
        EIP_PRICE={{ inputs.eip_monthly_cost_usd }}
        LB_PRICE={{ inputs.lb_monthly_cost_usd }}

        CUTOFF_IDLE=$(date -u -d "$IDLE_DAYS days ago" +%s)
        CUTOFF_SNAP=$(date -u -d "$SNAP_DAYS days ago" +%s)
        CUTOFF_AMI=$(date -u -d "$AMI_DAYS days ago" +%s)
        END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        START=$(date -u -d "$TRAFFIC_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
        PERIOD=$((TRAFFIC_DAYS * 86400))

        older_than() { [ "$1" -lt "$2" ]; }
        ymd() { printf '%s' "$1" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n1; }
        to_epoch() { date -u -d "$1" +%s 2>/dev/null || echo 0; }

        T_STOPPED=0; T_STOPPED_GB=0; T_EBS=0; T_EBS_GB=0; T_EIP=0; T_LB=0
        T_SNAP=0; T_SNAP_GB=0; T_SG=0; T_AMI=0; REGION_COUNT=0

        echo "==================================================="
        echo "AWS Idle Resource Sweep"
        echo "Regions: $REGIONS | idle threshold: ${IDLE_DAYS}d | LB traffic window: ${TRAFFIC_DAYS}d"
        echo "==================================================="

        for R in $REGIONS; do
          REGION_COUNT=$((REGION_COUNT + 1))
          echo ""
          echo "--- region: $R ---"

          # 1. EC2 instances stopped longer than idle_days (attached EBS keeps billing)
          aws ec2 describe-instances --region "$R" --filters Name=instance-state-name,Values=stopped \
            --query 'Reservations[].Instances[].[InstanceId,StateTransitionReason]' \
            --output text 2>/dev/null > /tmp/stopped.txt || true
          OLD_IIDS=""
          while IFS=$'\t' read -r IID REASON; do
            [ -z "$IID" ] && continue
            D=$(ymd "$REASON"); [ -z "$D" ] && continue
            E=$(to_epoch "$D")
            older_than "$E" "$CUTOFF_IDLE" && OLD_IIDS="$OLD_IIDS $IID"
          done < /tmp/stopped.txt
          S_N=0; S_GB=0
          if [ -n "$(echo "$OLD_IIDS" | tr -d ' ')" ]; then
            S_N=$(echo "$OLD_IIDS" | wc -w)
            VOLS=$(aws ec2 describe-instances --region "$R" --instance-ids $OLD_IIDS \
              --query 'Reservations[].Instances[].BlockDeviceMappings[].Ebs.VolumeId' \
              --output text 2>/dev/null | tr '\t' '\n' | grep -v '^[[:space:]]*$' | tr '\n' ' ' || true)
            if [ -n "$(echo "$VOLS" | tr -d ' ')" ]; then
              S_GB=$(aws ec2 describe-volumes --region "$R" --volume-ids $VOLS \
                --query 'Volumes[].Size' --output text 2>/dev/null | tr '\t' '\n' | awk '{s+=$1} END {print s+0}' || echo 0)
            fi
          fi
          S_GB=${S_GB:-0}
          echo "[stopped-ec2] $S_N instance(s) stopped ${IDLE_DAYS}d+, ${S_GB} GB attached EBS"
          T_STOPPED=$((T_STOPPED + S_N)); T_STOPPED_GB=$((T_STOPPED_GB + S_GB))

          # 2. Unattached (available) EBS volumes older than idle_days
          aws ec2 describe-volumes --region "$R" --filters Name=status,Values=available \
            --query 'Volumes[].[VolumeId,Size,CreateTime]' --output text 2>/dev/null > /tmp/ebs.txt || true
          E_N=0; E_GB=0
          while IFS=$'\t' read -r VID VSIZE VTIME; do
            [ -z "$VID" ] && continue
            D=$(ymd "$VTIME"); [ -z "$D" ] && continue
            E=$(to_epoch "$D")
            if older_than "$E" "$CUTOFF_IDLE"; then E_N=$((E_N+1)); E_GB=$((E_GB+VSIZE)); fi
          done < /tmp/ebs.txt
          echo "[unattached-ebs] $E_N volume(s), ${E_GB} GB"
          T_EBS=$((T_EBS+E_N)); T_EBS_GB=$((T_EBS_GB+E_GB))

          # 3. Unattached Elastic IPs ($3.65/mo each, pure waste)
          aws ec2 describe-addresses --region "$R" \
            --query 'Addresses[?AssociationId==`null`].[PublicIp]' \
            --output text 2>/dev/null > /tmp/eips.txt || true
          P_N=$(grep -c . /tmp/eips.txt 2>/dev/null || true); P_N=${P_N:-0}
          echo "[unattached-eip] $P_N address(es)"
          T_EIP=$((T_EIP+P_N))

          # 4. Idle load balancers (zero traffic in the window; correct metric namespace per type)
          aws elbv2 describe-load-balancers --region "$R" \
            --query 'LoadBalancers[].[LoadBalancerArn,Type]' --output text 2>/dev/null > /tmp/lbs.txt || true
          L_N=0
          while IFS=$'\t' read -r ARN LBTYPE; do
            [ -z "$ARN" ] && continue
            case "$LBTYPE" in
              application) METRIC=RequestCount; NS=AWS/ApplicationELB;;
              network) METRIC=ProcessedBytes; NS=AWS/NetworkELB;;
              *) continue;;
            esac
            DIM=$(echo "$ARN" | cut -d'/' -f2-)
            VAL=$(aws cloudwatch get-metric-statistics --region "$R" --namespace "$NS" \
              --metric-name "$METRIC" --dimensions Name=LoadBalancer,Value="$DIM" \
              --start-time "$START" --end-time "$END" --period "$PERIOD" --statistics Sum \
              --query 'Datapoints[0].Sum' --output text 2>/dev/null || echo 0)
            case "$VAL" in ''|'None') VAL=0;; esac
            [ "${VAL%.*}" -eq 0 ] && L_N=$((L_N+1))
          done < /tmp/lbs.txt
          echo "[idle-lb] $L_N load balancer(s) with zero traffic in ${TRAFFIC_DAYS}d"
          T_LB=$((T_LB+L_N))

          # 5. Stale manual snapshots (excluding snapshots backing your AMIs)
          aws ec2 describe-images --region "$R" --owners self \
            --query 'Images[].BlockDeviceMappings[].Ebs.SnapshotId' \
            --output text 2>/dev/null | tr '\t' '\n' | grep -v '^[[:space:]]*$' | sort -u > /tmp/ami_snaps.txt || true
          aws ec2 describe-snapshots --region "$R" --owner-ids self \
            --query 'Snapshots[].[SnapshotId,VolumeSize,StartTime]' --output text 2>/dev/null > /tmp/snaps.txt || true
          N_N=0; N_GB=0
          while IFS=$'\t' read -r SID SSIZE STIME; do
            [ -z "$SID" ] && continue
            grep -qx "$SID" /tmp/ami_snaps.txt 2>/dev/null && continue
            D=$(ymd "$STIME"); [ -z "$D" ] && continue
            E=$(to_epoch "$D")
            if older_than "$E" "$CUTOFF_SNAP"; then N_N=$((N_N+1)); N_GB=$((N_GB+SSIZE)); fi
          done < /tmp/snaps.txt
          echo "[stale-snapshot] $N_N snapshot(s), ${N_GB} GB"
          T_SNAP=$((T_SNAP+N_N)); T_SNAP_GB=$((T_SNAP_GB+N_GB))

          # 6. Unused security groups (hygiene; no direct cost, reduces blast radius)
          aws ec2 describe-security-groups --region "$R" \
            --query 'SecurityGroups[].[GroupId,GroupName]' --output text 2>/dev/null > /tmp/sgs.txt || true
          aws ec2 describe-network-interfaces --region "$R" \
            --query 'NetworkInterfaces[].Groups[].GroupId' \
            --output text 2>/dev/null | tr '\t' '\n' | grep -v '^[[:space:]]*$' | sort -u > /tmp/sgs_used.txt || true
          G_N=0
          while IFS=$'\t' read -r GID GNAME; do
            [ -z "$GID" ] && continue
            [ "$GNAME" = "default" ] && continue
            grep -qx "$GID" /tmp/sgs_used.txt 2>/dev/null || G_N=$((G_N+1))
          done < /tmp/sgs.txt
          echo "[unused-sg] $G_N group(s)"
          T_SG=$((T_SG+G_N))

          # 7. Unused AMIs (hygiene; their backing snapshots keep billing)
          aws ec2 describe-images --region "$R" --owners self \
            --query 'Images[].[ImageId,CreationDate]' --output text 2>/dev/null > /tmp/amis.txt || true
          aws ec2 describe-instances --region "$R" \
            --query 'Reservations[].Instances[].ImageId' \
            --output text 2>/dev/null | tr '\t' '\n' | grep -v '^[[:space:]]*$' | sort -u > /tmp/amis_used.txt || true
          A_N=0
          while IFS=$'\t' read -r AID ADATE; do
            [ -z "$AID" ] && continue
            grep -qx "$AID" /tmp/amis_used.txt 2>/dev/null && continue
            D=$(ymd "$ADATE"); [ -z "$D" ] && continue
            E=$(to_epoch "$D")
            older_than "$E" "$CUTOFF_AMI" && A_N=$((A_N+1))
          done < /tmp/amis.txt
          echo "[unused-ami] $A_N image(s)"
          T_AMI=$((T_AMI+A_N))
        done

        echo ""
        echo "==================================================="
        echo "Consolidated report - $REGION_COUNT region(s) swept"
        echo "==================================================="
        SAVED_STOPPED=$(python3 -c "print('{:.2f}'.format($T_STOPPED_GB * float('$EBS_PRICE')))")
        SAVED_EBS=$(python3 -c "print('{:.2f}'.format($T_EBS_GB * float('$EBS_PRICE')))")
        SAVED_EIP=$(python3 -c "print('{:.2f}'.format($T_EIP * float('$EIP_PRICE')))")
        SAVED_LB=$(python3 -c "print('{:.2f}'.format($T_LB * float('$LB_PRICE')))")
        SAVED_SNAP=$(python3 -c "print('{:.2f}'.format($T_SNAP_GB * float('$SNAP_PRICE')))")
        printf '%-24s %10s %14s\n' "resource" "count" "est. USD/mo"
        printf '%-24s %10d %14s\n' "stopped-ec2 (attached EBS)" "$T_STOPPED_GB" "$SAVED_STOPPED"
        printf '%-24s %10d %14s\n' "unattached-ebs (GB)" "$T_EBS_GB" "$SAVED_EBS"
        printf '%-24s %10d %14s\n' "unattached-eip" "$T_EIP" "$SAVED_EIP"
        printf '%-24s %10d %14s\n' "idle-lb" "$T_LB" "$SAVED_LB"
        printf '%-24s %10d %14s\n' "stale-snapshots (GB)" "$T_SNAP_GB" "$SAVED_SNAP"
        printf '%-24s %10d %14s\n' "unused-sg (hygiene)" "$T_SG" "0.00"
        printf '%-24s %10d %14s\n' "unused-ami (hygiene)" "$T_AMI" "0.00"
        TOTAL_SAVINGS=$(python3 -c "print('{:.2f}'.format($T_STOPPED_GB*float('$EBS_PRICE') + $T_EBS_GB*float('$EBS_PRICE') + $T_EIP*float('$EIP_PRICE') + $T_LB*float('$LB_PRICE') + $T_SNAP_GB*float('$SNAP_PRICE')))")
        echo "TOTAL estimated monthly waste: \$$TOTAL_SAVINGS"

        if [ "$T_STOPPED" -gt 0 ] || [ "$T_EBS" -gt 0 ] || [ "$T_EIP" -gt 0 ] || [ "$T_LB" -gt 0 ] || [ "$T_SNAP" -gt 0 ] || [ "$T_SG" -gt 0 ] || [ "$T_AMI" -gt 0 ]; then
          HAS_WASTE=true
        else
          HAS_WASTE=false
        fi

        echo "HAS_WASTE=$HAS_WASTE"
        echo "TOTAL_SAVINGS=$TOTAL_SAVINGS"
        echo "REGION_COUNT=$REGION_COUNT"
        echo "STOPPED_COUNT=$T_STOPPED"
        echo "STOPPED_EBS_GB=$T_STOPPED_GB"
        echo "EBS_COUNT=$T_EBS"
        echo "EBS_GB=$T_EBS_GB"
        echo "EIP_COUNT=$T_EIP"
        echo "LB_COUNT=$T_LB"
        echo "SNAP_COUNT=$T_SNAP"
        echo "SNAP_GB=$T_SNAP_GB"
        echo "SG_COUNT=$T_SG"
        echo "AMI_COUNT=$T_AMI"
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"

  - id: report
    type: io.kestra.plugin.core.flow.If
    description: Post the consolidated waste report; stay quiet on clean sweeps.
    condition: "{{ outputs.sweep.vars.HAS_WASTE == 'true' }}"
    then:
      - id: slack_report
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":broom: *AWS idle-resource sweep* — {{ outputs.sweep.vars.REGION_COUNT }} region(s) audited, est. *${{ outputs.sweep.vars.TOTAL_SAVINGS }}/mo* recoverable.\n• Stopped EC2 ({{ inputs.idle_days }}d+): {{ outputs.sweep.vars.STOPPED_COUNT }} — {{ outputs.sweep.vars.STOPPED_EBS_GB }} GB attached EBS still billing\n• Unattached EBS: {{ outputs.sweep.vars.EBS_COUNT }} volumes, {{ outputs.sweep.vars.EBS_GB }} GB\n• Unattached EIPs: {{ outputs.sweep.vars.EIP_COUNT }}\n• Idle load balancers: {{ outputs.sweep.vars.LB_COUNT }}\n• Stale snapshots: {{ outputs.sweep.vars.SNAP_COUNT }} ({{ outputs.sweep.vars.SNAP_GB }} GB)\n• Unused security groups: {{ outputs.sweep.vars.SG_COUNT }} (hygiene)\n• Unused AMIs: {{ outputs.sweep.vars.AMI_COUNT }} (hygiene)\nFull per-resource table in the Kestra execution logs."
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        message: "Idle-resource sweep clean — no waste found in {{ outputs.sweep.vars.REGION_COUNT }} region(s)."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: AWS Idle Resource Sweep
  metaTitle: AWS Idle Resource Sweep — Find Wasted Cloud Spend | Kestra
  shortDescription: Audit seven idle-resource types across AWS regions in one weekly run — stopped EC2, unattached EBS and EIPs, idle load balancers, stale snapshots, unused security groups and AMIs — and get one consolidated waste report with estimated savings.
  metaDescription: One weekly sweep for idle AWS waste across 7 resource types and N regions, with a consolidated dollar estimate per type.
  description: |
    Stopped EC2 instances, orphaned EBS volumes, forgotten Elastic IPs, zero-traffic load balancers, ancient snapshots — every AWS account accumulates them, and each one bills every hour it exists. This blueprint consolidates all seven checks into one weekly flow: one pass over every region, one report, one dollar estimate per resource type.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled — enable after your first manual run).
    2. The `sweep` task (AWS CLI) loops over `aws_regions` running seven checks per region — stopped EC2 (attached EBS keeps billing), available EBS, unattached EIPs, idle ALB/NLBs, stale snapshots (AMI-backed ones excluded), unused security groups, unused AMIs — each gated by its day-threshold input.
    3. Load balancer traffic uses the correct CloudWatch namespace per type (`AWS/ApplicationELB` vs `AWS/NetworkELB`).
    4. Per-type counts, GB totals, and estimated monthly waste print as one consolidated table in the execution logs; `KEY=VALUE` outputs feed the report step.
    5. An `If` task posts one Slack message with the findings only when something is wasteful — silent on clean weeks.

    ## What you get

    - One consolidated waste table across all regions, every week, with a dollar estimate per type.
    - Hygiene findings (unused SGs, stale AMIs) that reduce blast radius.
    - Report-only by default: nothing is ever deleted.

    ## Who it's for

    Platform engineers and FinOps teams running more than one AWS region, where test environments outlive the tests.

    ## Why orchestrate this with Kestra

    A laptop script finds today's waste and is forgotten next month. As a scheduled flow the sweep runs itself, thresholds are tunable inputs, every run is audited, and secrets stay masked.

    ## Prerequisites

    - AWS credentials with read-only EC2/ELB describe permissions plus `cloudwatch:GetMetricStatistics`.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EC2, ELB and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EC2, ELB and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the consolidated waste report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions you use; tune thresholds and prices.
    3. Run manually once and review the table in the execution logs.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Add an opt-in cleanup gate that releases EIPs or deletes old snapshots after a dry-run report.
    - Exclude resources tagged `Keep=true` for known standby setups.
    - Push per-type counts to CloudWatch as custom metrics and alarm on waste growth.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [EC2 on-demand pricing](https://aws.amazon.com/ec2/pricing/on-demand/)
    - [EBS pricing](https://aws.amazon.com/ebs/pricing/)
    - [ELB pricing](https://aws.amazon.com/elasticloadbalancing/pricing/)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
