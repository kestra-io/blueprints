id: tyk-gateway-health-and-reload-sentinel
namespace: company.team
description: |
  Audits Tyk Open Source API Gateway instances on a schedule by probing the
  gateway health endpoint and verifying canary ingress routing status, detecting
  daemon degradation, route desynchronization, or stale cache drift, and
  dispatching actionable Slack alerts with safe automated hot-reload remediation.

triggers:
  - id: periodic_gateway_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodically audits Tyk API Gateway health and canary routing integrity. Shipped disabled by default; enable once tyk_host points to an active Tyk container."
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      tyk_host: "localhost"
      tyk_port: 8080
      canary_listen_path: "canary-health-probe"
      auto_reload: "false"
      dry_run: "true"

inputs:
  - id: tyk_host
    type: STRING
    displayName: "Tyk Gateway Host"
    defaults: "localhost"
    description: "Hostname or IP address of the Tyk Open Source API Gateway instance."

  - id: tyk_port
    type: INT
    displayName: "Tyk Gateway Port"
    defaults: 8080
    description: "Port exposed by the Tyk Gateway HTTP listener (default: 8080)."

  - id: canary_listen_path
    type: STRING
    displayName: "Canary Listen Path"
    defaults: "canary-health-probe"
    description: "Listen path of the canary API route monitored for end-to-end data plane routing."

  - id: auto_reload
    type: STRING
    displayName: "Auto-Reload Gateway Cache"
    defaults: "false"
    description: "Set to 'true' to trigger an automated hot-reload via /tyk/reload when canary routing fails."

  - id: dry_run
    type: STRING
    displayName: "Dry Run Mode"
    defaults: "true"
    description: "When 'true', alerts on routing failures and logs intended remediations without issuing /tyk/reload."

tasks:
  - id: probe_tyk_gateway_health
    type: io.kestra.plugin.core.http.Request
    description: "Queries Tyk Gateway GET /hello endpoint to verify daemon runtime health, version, and responsiveness."
    uri: "http://{{ inputs.tyk_host }}:{{ inputs.tyk_port }}/hello"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true

  - id: probe_canary_ingress_route
    type: io.kestra.plugin.core.http.Request
    description: "Sends probe request to canary listen path to confirm active data plane routing and reverse-proxy flow."
    uri: "http://{{ inputs.tyk_host }}:{{ inputs.tyk_port }}/{{ inputs.canary_listen_path }}"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true

  - id: classify_gateway_verdict
    type: io.kestra.plugin.core.flow.Switch
    description: "Classifies Tyk Gateway operational state based on /hello health responses and canary ingress status."
    value: >-
      {% if outputs.probe_tyk_gateway_health.status != 200 or (fromJson(outputs.probe_tyk_gateway_health.body).status ?? '') != 'pass' %}
      GATEWAY_UNHEALTHY
      {% elif outputs.probe_canary_ingress_route.status == 404 or outputs.probe_canary_ingress_route.status >= 500 %}
      CANARY_ROUTING_FAILED
      {% else %}
      HEALTHY
      {% endif %}
    cases:
      GATEWAY_UNHEALTHY:
        - id: alert_gateway_unhealthy
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches critical operational alert when Tyk /hello endpoint reports failure or non-pass status."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#gateway-alerts",
              "text": ":rotating_light: *Tyk API Gateway Unhealthy*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Tyk Gateway Health Check Failed*\n*Host:* `{{ inputs.tyk_host }}:{{ inputs.tyk_port }}`\n*HTTP Status:* `{{ outputs.probe_tyk_gateway_health.status }}`\n*Reported Status:* `{{ fromJson(outputs.probe_tyk_gateway_health.body).status ?? 'UNKNOWN' }}`\nThe gateway data plane is degraded or unresponsive. Microservice ingress traffic may fail."
                  }
                }
              ]
            }

      CANARY_ROUTING_FAILED:
        - id: alert_canary_routing_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches alert when canary listen path returns 404 or server error, indicating route drift or stale cache."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#gateway-alerts",
              "text": ":warning: *Tyk Gateway Canary Ingress Route Failed*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Canary Ingress Routing Drift Detected*\n*Host:* `{{ inputs.tyk_host }}:{{ inputs.tyk_port }}`\n*Listen Path:* `/{{ inputs.canary_listen_path }}`\n*HTTP Status:* `{{ outputs.probe_canary_ingress_route.status }}`\nCanary API endpoint returned error or 404. Gateway cache may be stale or out of sync with Redis."
                  }
                }
              ]
            }

        - id: evaluate_remediation_on_routing_failure
          type: io.kestra.plugin.core.flow.If
          description: "Evaluates safety gate before issuing hot-reload signal to Tyk Gateway."
          condition: "{{ inputs.auto_reload == 'true' and inputs.dry_run == 'false' }}"
          then:
            - id: trigger_gateway_hot_reload
              type: io.kestra.plugin.core.http.Request
              description: "Issues GET /tyk/reload to flush internal memory cache and reload API definitions from store."
              uri: "http://{{ inputs.tyk_host }}:{{ inputs.tyk_port }}/tyk/reload"
              method: GET
              headers:
                X-Tyk-Authorization: "{{ secret('TYK_SECRET') }}"
            - id: log_hot_reload_triggered
              type: io.kestra.plugin.core.log.Log
              message: "Triggered automated hot-reload on Tyk Gateway to resynchronize API definitions."
          else:
            - id: log_dry_run_suppressed
              type: io.kestra.plugin.core.log.Log
              message: "Dry-run active or auto_reload disabled. Suppressed automated /tyk/reload request."

      HEALTHY:
        - id: log_gateway_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Tyk Gateway is healthy (/hello=pass, canary status={{ outputs.probe_canary_ingress_route.status }})."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Records execution audit lineage and parameter state across Tyk gateway verification steps."
    message: "Tyk Gateway Sentinel Audit Complete: Host={{ inputs.tyk_host }}, Port={{ inputs.tyk_port }}, CanaryPath={{ inputs.canary_listen_path }}, DryRun={{ inputs.dry_run }}."

errors:
  - id: alert_connectivity_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatches critical outage alert when network connection to Tyk Gateway fails completely."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#gateway-alerts",
        "text": ":rotating_light: *Tyk API Gateway Connection Failure*",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": ":rotating_light: *Tyk Gateway Ingress Unreachable*\n*Target Host:* `{{ inputs.tyk_host }}:{{ inputs.tyk_port }}`\n*Execution ID:* `{{ execution.id }}`\nKestra was unable to establish an HTTP connection. Check container status, network routes, or firewall rules."
            }
          }
        ]
      }

extend:
  title: Tyk API Gateway Ingress Health & Hot-Reload Sentinel
  metaTitle: Tyk API Gateway Health & Hot-Reload Sentinel | Kestra
  shortDescription: Audit Tyk API Gateway health, detect canary ingress routing failure or cache drift, and trigger safe hot-reloads.
  metaDescription: Audit Tyk Gateway health and canary ingress routes, detect configuration drift, alert via Slack, and execute safe hot-reloads.
  description: |
    Continuously audits Tyk Open Source API Gateway instances on a schedule by probing daemon health endpoints and verifying canary ingress routing status, detecting control plane degradation, route desynchronization, and cache drift while providing dual-gated automated hot-reload remediation.

    ## How it works

    1. `periodic_gateway_audit` (`io.kestra.plugin.core.trigger.Schedule`) triggers every 15 minutes, passing target host, port configuration, and canary route identifiers. Shipped disabled by default for safe initial setup.
    2. `probe_tyk_gateway_health` (`io.kestra.plugin.core.http.Request`) invokes the Tyk Gateway REST endpoint `GET /hello` to verify daemon responsiveness, version metadata, and internal status.
    3. `probe_canary_ingress_route` (`io.kestra.plugin.core.http.Request`) sends a synthetic request to the configured canary listen path (`/canary-health-probe`) to test end-to-end data plane proxy forwarding.
    4. `classify_gateway_verdict` (`io.kestra.plugin.core.flow.Switch`) evaluates responses:
       - `GATEWAY_UNHEALTHY`: Fires when `/hello` returns a non-200 code or status differs from `pass`, alerting `#gateway-alerts` via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
       - `CANARY_ROUTING_FAILED`: Fires when the canary endpoint returns 404 or a 5xx error, indicating route desynchronization or a stale internal cache. Dispatches a Slack notification and, if `auto_reload` is enabled and `dry_run` is false, sends `GET /tyk/reload` with `X-Tyk-Authorization` credentials to resynchronize API definitions from the store.
       - `HEALTHY`: Confirms compliant operational state and logs status via `io.kestra.plugin.core.log.Log`.
    5. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) records execution completion, verified host address, and parameter state for audit lineage.
    6. The global `errors` block intercepts connection timeouts or refused sockets, alerting on-call engineers when the Tyk Gateway container or pod is completely offline.

    ## What you get

    - Automated Day 2 health and routing validation for Tyk Open Source API Gateway deployments.
    - Early warning when gateway API definitions drift, become stale, or drop incoming microservice traffic.
    - Safe dual-key automated remediation (`auto_reload: true` and `dry_run: false`) preventing unintended hot-reloads in production.
    - Centralized audit lineage tracking gateway availability and ingress routing stability over time.

    ## Who it's for

    - Platform Engineers and Site Reliability Engineers managing API gateway ingress in Kubernetes or Docker environments.
    - DevOps Teams operating Tyk Open Source Gateway standalone or clustered configurations.
    - Microservice and Backend Developers relying on Tyk for zero-trust API ingress and rate limiting.

    ## Why orchestrate this with Kestra

    API gateways are critical path infrastructure where stale in-memory routing tables or missed synchronization events silently disconnect downstream consumers. Kestra provides declarative scheduled orchestration, robust multi-branch condition evaluation with Pebble expressions, built-in credential masking via namespace secrets, and safe remediation execution without brittle custom cron scripts.

    ## Prerequisites

    - A running Tyk Open Source Gateway instance (version 5.x+). The official Docker image (`tykio/tyk-gateway:v5.3`) is free and open-source.
    - A Redis instance reachable by the Tyk Gateway container for session and API definition storage.
    - An incoming Slack webhook URL for routing alerts.

    ### Secrets

    - `TYK_SECRET`: Gateway secret key used for administrative `/tyk/reload` authentication (passed in `X-Tyk-Authorization` header; configured via `TYK_GW_SECRET`).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by `alert_gateway_unhealthy`, `alert_canary_routing_failed`, and `alert_connectivity_failure`.

    ## Quick start

    1. Start a local Redis and Tyk Gateway container:
       ```bash
       docker network create tyk-net
       docker run -d --name redis --network tyk-net redis:7-alpine
       docker run -d --name tyk-gateway --network tyk-net -p 8080:8080 -e TYK_GW_STORAGE_HOST=redis -e TYK_GW_SECRET=352d20ee67be67f6340b4c0605b044b7 tykio/tyk-gateway:v5.3
       ```
    2. Configure `TYK_SECRET` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    3. Execute this workflow with default inputs (`dry_run: true`).
    4. Verify in the execution logs that `probe_tyk_gateway_health` confirms `status=pass`.
    5. Enable `periodic_gateway_audit` to schedule continuous 15-minute evaluations.

    ## How to extend

    - Add multiple canary API listen paths within a parallel task block to audit routing health across your entire API portfolio.
    - Wire a downstream PagerDuty incident trigger via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` when `GATEWAY_UNHEALTHY` fires.
    - Combine with GitOps webhook triggers (`io.kestra.plugin.core.trigger.Webhook`) to automatically trigger gateway validation and cache reload immediately after CI/CD API bundle deployments.

    ## Links

    - [Tyk Gateway Official Documentation](https://tyk.io/docs/tyk-oss-gateway/)
    - [Tyk Gateway API Reference](https://tyk.io/docs/tyk-oss-gateway/gateway-management-api/)
    - [Tyk GitHub Repository](https://github.com/TykTechnologies/tyk)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
