id: digitraffic-port-call-eta-slip-alert
namespace: company.team

description: |
  Vessel ETA watch for Finnish ports, built on the keyless Fintraffic Digitraffic port call API.
  Every 30 minutes the flow reads every port call due in the next few days in one request, keeps
  the ports, vessel types and vessels you care about, and compares each call's ETA with the value
  it last reported in a DuckDB ledger. ETAs that moved by more than the threshold, vessels that
  arrived late, and calls that left the window are posted to Slack.

inputs:
  - id: ports
    type: ARRAY
    itemType: STRING
    displayName: Watched ports
    description: UN/LOCODEs of Finnish ports (Digitraffic only covers Finland). Use `*` for every port.
    defaults: ["FIHEL", "FIKTK", "FIHKO", "FIRAU", "FISKV"]

  - id: vessels_imo
    type: ARRAY
    itemType: STRING
    displayName: Watched vessels (IMO)
    description: Optional IMO numbers of the vessels carrying your cargo. Empty means every vessel calling at the watched ports.
    defaults: []

  - id: excluded_vessel_types
    type: ARRAY
    itemType: INT
    description: |
      Digitraffic vessel type codes to ignore. The defaults drop timetabled passenger vessels and car ferries (10, 20),
      which call several times a day, and tugs, pushers and barges (91, 93 to 97), whose ETAs follow the ship they serve.
    defaults: [10, 20, 91, 93, 94, 95, 96, 97]

  - id: lookahead_hours
    type: INT
    defaults: 72
    description: Port calls with an ETA up to this many hours ahead are tracked.

  - id: slip_threshold_minutes
    type: INT
    defaults: 120
    description: |
      An ETA change of at least this many minutes (later or earlier) is reported. The ledger keeps the last reported
      ETA, so several small revisions add up to one alert instead of being lost.

triggers:
  - id: every_30_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"

tasks:
  - id: fetch_port_calls
    type: io.kestra.plugin.core.http.Download
    description: |
      One request for all Finnish port calls with an ETA from 12 hours ago (late vessels that have not arrived yet)
      to `lookahead_hours` ahead. Each call carries the vessel, the agent and `portAreaDetails` with ETA, ATA, berth
      and when the ETA was last updated. Digitraffic answers 406 without `Accept-Encoding: gzip` and asks clients
      to identify themselves with `Digitraffic-User`. The API refuses results over 1,000 calls; the window is
      about 300.
    uri: "https://meri.digitraffic.fi/api/port-call/v1/port-calls?etaFrom={{ now() | dateAdd(-12, 'HOURS') | date(\"yyyy-MM-dd'T'HH:mm:ss'Z'\", timeZone='UTC') }}&etaTo={{ now() | dateAdd(inputs.lookahead_hours, 'HOURS') | date(\"yyyy-MM-dd'T'HH:mm:ss'Z'\", timeZone='UTC') }}"
    headers:
      Accept-Encoding: gzip
      Digitraffic-User: kestra-blueprint/digitraffic-port-call-eta-slip-alert
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempts: 4

  - id: fetch_vessel_types
    type: io.kestra.plugin.core.http.Download
    description: The code list that turns `vesselTypeCode` 40 into "roro" in the alerts.
    uri: https://meri.digitraffic.fi/api/port-call/v1/code-descriptions
    headers:
      Accept-Encoding: gzip
      Digitraffic-User: kestra-blueprint/digitraffic-port-call-eta-slip-alert
    retry:
      type: constant
      interval: PT30S
      maxAttempts: 3

  - id: previous_ledger
    type: io.kestra.plugin.core.kv.Get
    key: digitraffic_port_call_ledger_uri
    errorOnMissing: false

  - id: first_run
    type: io.kestra.plugin.core.flow.If
    description: Creates an empty ledger on the first run (or after the KV key is deleted), which makes that run the BASELINE.
    condition: "{{ outputs.previous_ledger.value is not defined or outputs.previous_ledger.value is empty }}"
    then:
      - id: init_ledger
        type: io.kestra.plugin.jdbc.duckdb.Queries
        outputDbFile: true
        sql: |
          CREATE TABLE tracked (port_call_id BIGINT PRIMARY KEY, port VARCHAR, imo VARCHAR, vessel VARCHAR, type_code INTEGER,
            first_eta TIMESTAMPTZ, reported_eta TIMESTAMPTZ, last_eta TIMESTAMPTZ, first_seen TIMESTAMPTZ, last_seen TIMESTAMPTZ);
          CREATE TABLE event_log (logged_at TIMESTAMPTZ, execution_id VARCHAR, change VARCHAR, port_call_id BIGINT, port VARCHAR,
            port_area VARCHAR, berth VARCHAR, vessel VARCHAR, imo VARCHAR, vessel_type VARCHAR, prev_port VARCHAR,
            previous_eta TIMESTAMPTZ, new_time TIMESTAMPTZ, shift_min INTEGER, shift_since_first_min INTEGER, eta_updated_at TIMESTAMPTZ);
          CREATE TABLE runs (checked_at TIMESTAMPTZ, execution_id VARCHAR, feed_calls INTEGER, tracked_calls INTEGER, changes INTEGER);

  - id: diff_etas
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Compares the feed with the ledger. A tracked call is LATER or EARLIER when its ETA moved by at least the threshold
      from the last reported ETA, ARRIVED LATE when its ATA is at least the threshold after that ETA, and OUT OF WINDOW
      when it vanished from the feed although its ETA was still inside the window (pushed beyond `lookahead_hours`
      or withdrawn). Calls that arrived on time or aged out leave the ledger silently; calls that are only filtered out
      by the current inputs stay in it without alerts. New calls are tracked without an alert.
    databaseUri: "{{ outputs.previous_ledger.value ?? outputs.init_ledger.databaseUri }}"
    outputDbFile: true
    timeZoneId: UTC
    fetchType: FETCH
    inputFiles:
      calls.json: "{{ outputs.fetch_port_calls.uri }}"
      codes.json: "{{ outputs.fetch_vessel_types.uri }}"
    parameters:
      ports: "{{ inputs.ports | toJson }}"
      imos: "{{ inputs.vessels_imo | toJson }}"
      excluded: "{{ inputs.excluded_vessel_types | toJson }}"
      lookahead: "{{ inputs.lookahead_hours }}"
      threshold: "{{ inputs.slip_threshold_minutes }}"
      execution_id: "{{ execution.id }}"
    sql: |
      SET TimeZone = 'UTC';

      CREATE OR REPLACE TEMP TABLE watch AS
      SELECT DISTINCT v AS port, v = '*' OR regexp_full_match(v, '[A-Z]{5}') AS valid
      FROM (SELECT upper(trim(unnest(from_json(:ports, '["VARCHAR"]')))) AS v) WHERE v <> '';
      CREATE OR REPLACE TEMP TABLE imos AS SELECT DISTINCT trim(unnest(from_json(:imos, '["VARCHAR"]'))) AS imo;
      CREATE OR REPLACE TEMP TABLE excluded AS SELECT unnest(from_json(:excluded, '["INTEGER"]')) AS code;
      CREATE OR REPLACE TEMP MACRO in_scope(p, i, t) AS
        (p IN (SELECT port FROM watch) OR EXISTS (SELECT 1 FROM watch WHERE port = '*'))
        AND (i IN (SELECT imo FROM imos) OR NOT EXISTS (SELECT 1 FROM imos))
        AND coalesce(t, -1) NOT IN (SELECT code FROM excluded);
      CREATE OR REPLACE TEMP TABLE types AS
      SELECT CAST(t->>'$.code' AS INTEGER) AS code, t->>'$.descriptionEn' AS name
      FROM (SELECT unnest(from_json(content->'$.vesselTypes', '["JSON"]')) AS t FROM read_text('codes.json'));

      -- One row per port call; a call with several port areas keeps its earliest ETA
      CREATE OR REPLACE TEMP TABLE feed AS
      WITH calls AS (SELECT unnest(from_json(content->'$.portCalls', '["JSON"]')) AS j FROM read_text('calls.json')),
      areas AS (
        SELECT CAST(j->>'$.portCallId' AS BIGINT) AS port_call_id, j->>'$.portToVisit' AS port, j->>'$.imoLloyds' AS imo,
               j->>'$.vesselName' AS vessel, CAST(j->>'$.vesselTypeCode' AS INTEGER) AS type_code, j->>'$.prevPort' AS prev_port,
               unnest(from_json(j->'$.portAreaDetails', '["JSON"]')) AS a
        FROM calls)
      SELECT port_call_id, any_value(port) AS port, any_value(imo) AS imo, any_value(vessel) AS vessel, any_value(type_code) AS type_code,
             any_value(prev_port) AS prev_port, arg_min(a->>'$.portAreaName', CAST(a->>'$.eta' AS TIMESTAMPTZ)) AS port_area,
             arg_min(a->>'$.berthName', CAST(a->>'$.eta' AS TIMESTAMPTZ)) AS berth, min(CAST(a->>'$.eta' AS TIMESTAMPTZ)) AS eta,
             min(CAST(a->>'$.ata' AS TIMESTAMPTZ)) AS ata, max(CAST(a->>'$.etaTimestamp' AS TIMESTAMPTZ)) AS eta_updated_at
      FROM areas GROUP BY port_call_id;

      CREATE OR REPLACE TEMP TABLE scoped AS
      SELECT f.*, coalesce(t.name, 'type ' || f.type_code) AS vessel_type FROM feed f LEFT JOIN types t ON t.code = f.type_code
      WHERE f.eta IS NOT NULL AND in_scope(f.port, f.imo, f.type_code);

      CREATE OR REPLACE TEMP TABLE changes AS
      SELECT CASE WHEN s.ata IS NOT NULL THEN 'ARRIVED LATE' WHEN s.eta > t.reported_eta THEN 'LATER' ELSE 'EARLIER' END AS change,
             s.port_call_id, s.port, s.port_area, s.berth, s.vessel, s.imo, s.vessel_type, s.prev_port, t.reported_eta AS previous_eta,
             coalesce(s.ata, s.eta) AS new_time, CAST(date_diff('minute', t.reported_eta, coalesce(s.ata, s.eta)) AS INTEGER) AS shift_min,
             CAST(date_diff('minute', t.first_eta, coalesce(s.ata, s.eta)) AS INTEGER) AS shift_since_first_min, s.eta_updated_at
      FROM scoped s JOIN tracked t USING (port_call_id)
      WHERE (s.ata IS NULL AND abs(date_diff('minute', t.reported_eta, s.eta)) >= CAST(:threshold AS INTEGER))
         OR (s.ata IS NOT NULL AND date_diff('minute', t.reported_eta, s.ata) >= CAST(:threshold AS INTEGER))
      UNION ALL BY NAME
      SELECT 'OUT OF WINDOW' AS change, port_call_id, port, vessel, imo, last_eta AS previous_eta
      FROM tracked
      WHERE port_call_id NOT IN (SELECT port_call_id FROM feed)
        AND last_eta > now() - INTERVAL 11 HOUR AND last_eta < now() + to_hours(CAST(:lookahead AS INTEGER) - 1)
        AND in_scope(port, imo, type_code);

      INSERT INTO event_log SELECT now(), :execution_id, change, port_call_id, port, port_area, berth, vessel, imo, vessel_type, prev_port,
        previous_eta, new_time, shift_min, shift_since_first_min, eta_updated_at FROM changes;
      INSERT INTO runs SELECT now(), :execution_id, (SELECT count(*) FROM feed), (SELECT count(*) FROM scoped WHERE ata IS NULL),
        (SELECT count(*) FROM changes);

      -- Arrived and vanished calls leave the ledger. Calls only filtered out by the inputs stay, so narrowing the watch
      -- list for one run does not reset their reference ETA. A reported change becomes the new reference ETA.
      DELETE FROM tracked WHERE port_call_id NOT IN (SELECT port_call_id FROM feed WHERE ata IS NULL AND eta IS NOT NULL);
      UPDATE tracked SET last_eta = f.eta, last_seen = now() FROM feed f WHERE f.port_call_id = tracked.port_call_id;
      INSERT INTO tracked SELECT port_call_id, port, imo, vessel, type_code, eta, eta, eta, now(), now() FROM scoped WHERE ata IS NULL
      ON CONFLICT (port_call_id) DO NOTHING;
      UPDATE tracked SET reported_eta = c.new_time FROM changes c WHERE c.port_call_id = tracked.port_call_id;

      CREATE OR REPLACE TEMP TABLE alert_lines AS
      SELECT *, change || ' *' || coalesce(vessel, 'unknown vessel') || '* (' || coalesce(vessel_type || ', ', '') || 'IMO ' || coalesce(imo, 'n/a') || ') to ' || port
             || coalesce(' ' || port_area, '') || coalesce(' berth ' || nullif(trim(berth), ''), '')
             || CASE WHEN change = 'OUT OF WINDOW'
                  THEN ' - ETA was ' || substr(CAST(previous_eta AS VARCHAR), 1, 16) || ' UTC, no longer due in the window (pushed out or withdrawn)'
                  ELSE ' - ' || CASE WHEN change = 'ARRIVED LATE' THEN 'arrived ' ELSE 'ETA ' END || substr(CAST(new_time AS VARCHAR), 1, 16)
                       || ' UTC, was ' || substr(CAST(previous_eta AS VARCHAR), 1, 16) || ' ('
                       || CASE WHEN shift_min > 0 THEN '+' ELSE '' END || round(shift_min / 60.0, 1) || ' h'
                       || CASE WHEN shift_since_first_min <> shift_min
                            THEN ', ' || CASE WHEN shift_since_first_min > 0 THEN '+' ELSE '' END || round(shift_since_first_min / 60.0, 1) || ' h since first seen'
                            ELSE '' END || ')' || coalesce(', from ' || nullif(trim(prev_port), ''), '') END AS line
      FROM changes;

      SELECT change, port, vessel, imo, previous_eta, new_time, shift_min, line FROM alert_lines ORDER BY port, abs(coalesce(shift_min, 100000)) DESC;

      SELECT (SELECT count(*) FROM runs) = 1 AS is_baseline,
             (SELECT count(*) FROM feed) AS feed_calls,
             (SELECT count(*) FROM watch WHERE valid) AS watched_ports,
             (SELECT coalesce(string_agg(port, ', '), '') FROM watch WHERE NOT valid OR (port <> '*' AND port NOT IN (SELECT port FROM feed))) AS ports_without_calls,
             (SELECT count(*) FROM scoped WHERE ata IS NULL) AS tracked_calls,
             (SELECT count(*) FROM scoped WHERE ata IS NOT NULL) AS arrived_in_window,
             (SELECT count(*) FILTER (WHERE change IN ('LATER', 'ARRIVED LATE')) FROM changes) AS later,
             (SELECT count(*) FILTER (WHERE change = 'EARLIER') FROM changes) AS earlier,
             (SELECT count(*) FILTER (WHERE change = 'OUT OF WINDOW') FROM changes) AS out_of_window,
             (SELECT count(*) FROM changes) AS changes,
             (SELECT coalesce(string_agg(line, chr(10) ORDER BY port, abs(coalesce(shift_min, 100000)) DESC), '') FROM alert_lines) AS alert_text,
             (SELECT count(*) FROM event_log) AS logged_events;

  - id: save_ledger
    type: io.kestra.plugin.core.kv.Set
    key: digitraffic_port_call_ledger_uri
    value: "{{ outputs.diff_etas.databaseUri }}"

  - id: notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.diff_etas.outputs[1].rows[0].changes > 0 }}"
    then:
      - id: log_changes
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.diff_etas.outputs[1].rows[0].alert_text }}"

      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": {{ ('*Vessel ETA changes at your ports* (threshold ' ~ inputs.slip_threshold_minutes ~ ' min)\n' ~ outputs.diff_etas.outputs[1].rows[0].alert_text) | toJson }}}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.diff_etas.outputs[1].rows[0].feed_calls }} port calls in the Digitraffic window, {{ outputs.diff_etas.outputs[1].rows[0].tracked_calls }}
      tracked at {{ outputs.diff_etas.outputs[1].rows[0].watched_ports }} watched ports{{ outputs.diff_etas.outputs[1].rows[0].is_baseline ? ' (BASELINE run, no alerts)' : '' }}:
      {{ outputs.diff_etas.outputs[1].rows[0].later }} later, {{ outputs.diff_etas.outputs[1].rows[0].earlier }} earlier,
      {{ outputs.diff_etas.outputs[1].rows[0].out_of_window }} out of window; {{ outputs.diff_etas.outputs[1].rows[0].arrived_in_window }} already arrived;
      {{ outputs.diff_etas.outputs[1].rows[0].logged_events }} events in the ledger.{{ outputs.diff_etas.outputs[1].rows[0].ports_without_calls != '' ? ' No calls in the window for: ' ~ outputs.diff_etas.outputs[1].rows[0].ports_without_calls ~ ' (nothing due, or not a Finnish LOCODE).' : '' }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.diff_etas.outputs[1].rows[0] }}"
  - id: changes
    type: JSON
    value: "{{ outputs.diff_etas.outputs[0].rows }}"
  - id: ledger
    type: FILE
    value: "{{ outputs.diff_etas.databaseUri }}"

extend:
  title: Vessel ETA Slip Alerts for Finnish Ports with Digitraffic Port Calls
  metaTitle: Digitraffic Port Call ETA Slip Alerts | Kestra
  shortDescription: Every 30 minutes, read all Finnish port calls due in the next days from Digitraffic and alert when a vessel's ETA moves by more than your threshold, it arrives late, or its call drops out of the window.
  metaDescription: Track vessel ETAs at Finnish ports with the Digitraffic port call API and get Slack alerts when an ETA slips, a ship arrives late or a call disappears.
  description: |
    When a ship's ETA moves by a few hours, trucks, stevedores and berth slots have to move with it. Fintraffic's Digitraffic service publishes every port call notified to the Finnish Portnet system, with the agent's ETA, berth and actual arrival time, in one keyless JSON API. This flow remembers the ETA it last reported for each call and tells your logistics team when it moves by more than a threshold.

    ## How it works

    1. A `Schedule` trigger runs every 30 minutes.
    2. `fetch_port_calls` (HTTP Download) makes one request for all port calls with an ETA from 12 hours ago (late vessels) to `lookahead_hours` ahead, about 300 calls. `fetch_vessel_types` reads the vessel type names.
    3. `previous_ledger` (KV Get) reads the DuckDB ledger URI. `first_run` (If) creates an empty ledger when it is missing: that run is the BASELINE, which tracks every call and alerts nothing.
    4. `diff_etas` (DuckDB) keeps the watched ports, vessels (IMO) and vessel types, then compares each call with the ledger:
       - LATER or EARLIER: the ETA moved by at least `slip_threshold_minutes` from the last reported ETA. Small revisions add up until they cross it; the alert also shows the shift since the call was first seen.
       - ARRIVED LATE: the ATA came at least the threshold after the last reported ETA, a slip the agent never announced.
       - OUT OF WINDOW: the call vanished while its ETA was inside the window (pushed out or withdrawn).
       - On-time arrivals leave the ledger silently. Calls only filtered out by the current inputs keep their reference ETA, so a one-off narrower run does not reset them.
       - Timetabled ferries, tugs and barges are excluded by default (`excluded_vessel_types`).
    5. `save_ledger` (KV Set) stores the new ledger URI.
    6. `notify` (If) logs the changes at WARN and posts them to Slack with vessel, IMO, berth, new and previous ETA and the shift in hours.

    ## What you get

    - One alert line per changed call, biggest shift first.
    - A DuckDB ledger (output `ledger`) with tracked calls, an `event_log` and a `runs` table.
    - Flow outputs `summary` and `changes`; watched ports with no calls (a LOCODE typo) are named in the summary.

    ## Who it's for

    - Freight forwarders, hauliers, terminal operators and supply chain teams waiting for vessels in Finland.

    ## Why orchestrate this with Kestra

    - One retried request per run, state in the KV store and readable SQL instead of a cron script with a local file.
    - Each execution keeps its own ledger file; Slack is optional (`allowFailure`).

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins, and outbound HTTPS to `meri.digitraffic.fi` (no API key).
    - Finnish ports only; ETAs come from the ship's agent and are not moderated.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the alerts (optional; without it the Slack task warns and the run continues).

    ## Quick start

    1. Click **Execute** with the defaults: a BASELINE of the cargo calls due at Helsinki, Kotka, Hanko, Rauma and Sköldvik.
    2. Execute again: nothing changed.
    3. Set your ports or the IMO numbers of your vessels, add `SLACK_WEBHOOK_URL` and keep the schedule on. ETA revisions show up over the following hours.

    ## How to extend

    - Join `event_log` to your bookings by IMO to warn customers whose cargo is on a late ship.
    - Compare the agent's ETA with AIS positions from the same API.

    ## Links

    - [Digitraffic marine API](https://www.digitraffic.fi/en/marine-traffic/) and [Swagger](https://meri.digitraffic.fi/swagger/)
    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if) and [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
