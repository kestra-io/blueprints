id: microsoft-365-endpoint-change-pac-sync
namespace: company.team

description: |
  Keep a proxy PAC file in sync with the Microsoft 365 IP address and URL web service. Every hour the flow
  checks the endpoint version; when it moves past the stored one it fetches the change log and the endpoint
  list, rebuilds the PAC file (Optimize and Allow hosts DIRECT), diffs it and posts the changes to Slack.

inputs:
  - id: instance
    type: SELECT
    values: [Worldwide, USGovDoD, USGovGCCHigh, China]
    defaults: Worldwide
    description: Microsoft 365 cloud instance. Each instance has its own version, change log and state keys.

  - id: client_request_id
    type: STRING
    defaults: 3f0c6a52-7d4e-4b1a-9c58-2e6d1f8b9a47
    validator: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    description: GUID sent as `clientrequestid` (required by the service). Microsoft asks for one GUID per client, reused; generate your own once.

  - id: tenant_name
    type: STRING
    defaults: ""
    description: Optional tenant name (the `contoso` of contoso.onmicrosoft.com). Sent as `TenantName`, so URLs such as `autodiscover.*.onmicrosoft.com` come back with your tenant instead of a wildcard.

  - id: direct_categories
    type: ARRAY
    itemType: STRING
    defaults: [Optimize, Allow]
    description: Endpoint categories sent DIRECT in the PAC file. Microsoft recommends bypassing the proxy for Optimize and Allow; add Default to bypass everything Microsoft 365.

  - id: proxy_directive
    type: STRING
    defaults: PROXY proxy.example.com:8080
    description: What the PAC file returns for every other host. The default is a placeholder, set your own proxy.

  - id: baseline_since_version
    type: STRING
    defaults: "2025010100"
    description: On the first run (no stored version) the change log is read from this version on, so the baseline already shows recent changes. Format YYYYMMDDNN.

  - id: force_rebuild
    type: BOOL
    defaults: false
    description: Rebuild and report even if the version did not change, for example after editing `direct_categories`.

  - id: state_key
    type: STRING
    defaults: m365_endpoints
    description: Prefix of the KV keys. The instance name is appended, so one prefix serves several instances.

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "17 * * * *"
    description: Microsoft recommends checking the version endpoint once an hour; it is a tiny call and the rest only runs when the version moves.

variables:
  base: "https://endpoints.office.com"
  key: "{{ inputs.state_key }}_{{ inputs.instance | lower }}"

tasks:
  - id: version
    type: io.kestra.plugin.core.http.Request
    description: Latest endpoint version of the instance, a few bytes. The full endpoint list is only fetched when this moves.
    uri: "{{ vars.base }}/version/{{ inputs.instance }}"
    params:
      clientrequestid: "{{ inputs.client_request_id }}"
    headers:
      User-Agent: kestra-microsoft-365-endpoint-change-pac-sync/1.0
    retry:
      type: constant
      interval: PT20S
      maxAttempts: 3

  - id: stored_version
    type: io.kestra.plugin.core.kv.Get
    key: "{{ render(vars.key) }}_version"
    errorOnMissing: false

  - id: stored_hosts
    type: io.kestra.plugin.core.kv.Get
    key: "{{ render(vars.key) }}_direct_hosts"
    errorOnMissing: false
    description: Newline-separated DIRECT host patterns of the last PAC build, used to diff the new build.

  - id: if_new_version
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.force_rebuild or (outputs.stored_version.value ?? '') != fromJson(outputs.version.body).latest }}"
    then:
      - id: changes
        type: io.kestra.plugin.core.http.Download
        description: Every change published after the stored version (or after `baseline_since_version` on the first run).
        uri: "{{ vars.base }}/changes/{{ inputs.instance }}/{{ outputs.stored_version.value ?? inputs.baseline_since_version }}"
        params:
          clientrequestid: "{{ inputs.client_request_id }}"
        headers:
          User-Agent: kestra-microsoft-365-endpoint-change-pac-sync/1.0
        retry:
          type: constant
          interval: PT20S
          maxAttempts: 3

      - id: endpoints
        type: io.kestra.plugin.core.http.Download
        description: The full endpoint set list of the instance at the latest version.
        uri: "{{ vars.base }}/endpoints/{{ inputs.instance }}"
        params:
          clientrequestid: "{{ inputs.client_request_id }}"
          TenantName: "{{ inputs.tenant_name }}"
        headers:
          User-Agent: kestra-microsoft-365-endpoint-change-pac-sync/1.0
        retry:
          type: constant
          interval: PT20S
          maxAttempts: 3

      - id: build
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: |
          One row per URL pattern with its strongest category (a URL can sit in several sets), the PAC text, the
          DIRECT diff and the flattened change log. A `Change` with only a `remove` block has no category, so it is
          looked up by `endpointSetId`. IP-only sets (Teams media) cannot be matched by host and are counted apart.
        url: "jdbc:duckdb:"
        fetchType: FETCH_ONE
        inputFiles:
          endpoints.json: "{{ outputs.endpoints.uri }}"
          changes.json: "{{ outputs.changes.uri }}"
        outputFiles:
          - changes_csv
        parameters:
          direct: "{{ inputs.direct_categories | toJson }}"
          previous_hosts: "{{ outputs.stored_hosts.value ?? '' }}"
          proxy: "{{ inputs.proxy_directive }}"
          instance: "{{ inputs.instance }}"
          old_version: "{{ outputs.stored_version.value ?? '' }}"
          new_version: "{{ fromJson(outputs.version.body).latest }}"
          since: "{{ outputs.stored_version.value ?? inputs.baseline_since_version }}"
          execution_url: "{{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
        sql: |
          CREATE TABLE direct AS SELECT DISTINCT trim(c) AS category FROM unnest(from_json(:direct, '["VARCHAR"]')) AS t(c);
          CREATE TABLE category_check AS SELECT CASE WHEN count(*) FILTER (WHERE category NOT IN ('Optimize', 'Allow', 'Default')) > 0
            THEN error('Unknown category in direct_categories, use Optimize, Allow or Default. Got ' || string_agg(category, ', ')) END AS ok FROM direct;

          CREATE TABLE sets AS
          SELECT CAST(json_extract_string(j, '$.id') AS INTEGER) AS set_id,
                 json_extract_string(j, '$.serviceArea') AS service_area,
                 json_extract_string(j, '$.category') AS category,
                 coalesce(from_json(json_extract(j, '$.urls'), '["VARCHAR"]'), []) AS urls,
                 coalesce(from_json(json_extract(j, '$.ips'), '["VARCHAR"]'), []) AS ips
          FROM read_json_objects('endpoints.json', format = 'array') AS r(j);

          CREATE TABLE hosts AS
          SELECT lower(u) AS pattern,
                 CASE min(CASE category WHEN 'Optimize' THEN 1 WHEN 'Allow' THEN 2 ELSE 3 END) WHEN 1 THEN 'Optimize' WHEN 2 THEN 'Allow' ELSE 'Default' END AS category,
                 string_agg(DISTINCT service_area, '/') AS service_areas
          FROM sets, unnest(urls) AS t(u) GROUP BY 1;
          CREATE TABLE direct_hosts AS SELECT * FROM hosts WHERE category IN (SELECT category FROM direct) ORDER BY pattern;

          CREATE TABLE prev AS SELECT DISTINCT trim(p) AS pattern FROM unnest(string_split(:previous_hosts, chr(10))) AS t(p) WHERE trim(p) <> '';
          CREATE TABLE added AS SELECT pattern FROM direct_hosts WHERE (SELECT count(*) FROM prev) > 0 AND pattern NOT IN (SELECT pattern FROM prev);
          CREATE TABLE removed AS SELECT pattern FROM prev WHERE pattern NOT IN (SELECT pattern FROM direct_hosts);

          CREATE TABLE changes AS
          SELECT DISTINCT ON (change_id) * FROM (
            SELECT CAST(json_extract_string(j, '$.id') AS INTEGER) AS change_id,
                   CAST(json_extract_string(j, '$.endpointSetId') AS INTEGER) AS set_id,
                   json_extract_string(j, '$.version') AS version,
                   json_extract_string(j, '$.disposition') AS disposition,
                   json_extract_string(j, '$.impact') AS impact,
                   json_extract_string(j, '$.previous.category') AS previous_category,
                   json_extract_string(j, '$.current.category') AS current_category,
                   coalesce(json_extract_string(j, '$.current.category'), json_extract_string(j, '$.previous.category')) AS change_category,
                   coalesce(from_json(json_extract(j, '$.add.urls'), '["VARCHAR"]'), []) AS add_urls,
                   coalesce(from_json(json_extract(j, '$.remove.urls'), '["VARCHAR"]'), []) AS remove_urls,
                   len(coalesce(from_json(json_extract(j, '$.add.ips'), '["VARCHAR"]'), [])) AS add_ips,
                   len(coalesce(from_json(json_extract(j, '$.remove.ips'), '["VARCHAR"]'), [])) AS remove_ips,
                   concat_ws(', ',
                     CASE WHEN json_extract_string(j, '$.disposition') = 'Change' AND json_exists(j, '$.previous.tcpPorts') THEN 'TCP ' || coalesce(json_extract_string(j, '$.previous.tcpPorts'), 'none') || ' to ' || coalesce(json_extract_string(j, '$.current.tcpPorts'), 'none') END,
                     CASE WHEN json_extract_string(j, '$.disposition') = 'Change' AND json_exists(j, '$.previous.udpPorts') THEN 'UDP ' || coalesce(json_extract_string(j, '$.previous.udpPorts'), 'none') || ' to ' || coalesce(json_extract_string(j, '$.current.udpPorts'), 'none') END) AS port_change,
                   CAST(try_strptime(json_extract_string(j, '$.add.effectiveDate'), '%Y%m%d') AS DATE) AS effective_date
            FROM read_json_objects('changes.json', format = 'array') AS r(j)
          ) ORDER BY change_id;

          CREATE TABLE report AS
          SELECT c.*, s.service_area,
                 coalesce(c.change_category, s.category, max(c.change_category) OVER (PARTITION BY c.set_id), 'retired set') AS category,
                 len(c.add_urls) + len(c.remove_urls) + c.add_ips + c.remove_ips = 0 AND c.port_change = '' AS notes_only
          FROM changes c LEFT JOIN sets s ON s.set_id = c.set_id;
          ALTER TABLE report ADD COLUMN affects_pac BOOLEAN;
          UPDATE report SET affects_pac = (category IN (SELECT category FROM direct) OR coalesce(previous_category, '') IN (SELECT category FROM direct))
                                          AND (len(add_urls) + len(remove_urls) > 0 OR (previous_category IS NOT NULL AND current_category IS NOT NULL AND previous_category <> current_category));

          COPY (SELECT version, change_id, set_id, service_area, category, previous_category, disposition, impact, affects_pac, notes_only,
                       array_to_string(add_urls, ' ') AS add_urls, array_to_string(remove_urls, ' ') AS remove_urls,
                       add_ips, remove_ips, port_change, strftime(effective_date, '%Y-%m-%d') AS effective_date
                FROM report ORDER BY version, change_id) TO '{{ outputFiles.changes_csv }}' (HEADER, DELIMITER ',');

          CREATE TABLE detail AS SELECT
            concat_ws(chr(10),
              (SELECT 'Now DIRECT ' || string_agg(pattern, ' ' ORDER BY pattern) FILTER (WHERE rn <= 40) || CASE WHEN count(*) > 40 THEN ' and ' || (count(*) - 40) || ' more' ELSE '' END
                 FROM (SELECT pattern, row_number() OVER (ORDER BY pattern) AS rn FROM added)),
              (SELECT 'No longer DIRECT ' || string_agg(pattern, ' ' ORDER BY pattern) FROM removed),
              (SELECT string_agg(version || ' ' || disposition || ' ' || category || coalesce(' ' || service_area, '') || ' set ' || set_id
                 || CASE WHEN len(add_urls) > 0 THEN ' +' || array_to_string(add_urls, ' +') ELSE '' END
                 || CASE WHEN len(remove_urls) > 0 THEN ' -' || array_to_string(remove_urls, ' -') ELSE '' END
                 || CASE WHEN add_ips + remove_ips > 0 THEN ' (' || add_ips || ' IPs added, ' || remove_ips || ' removed)' ELSE '' END
                 || CASE WHEN port_change <> '' THEN ' (' || port_change || ')' ELSE '' END
                 || CASE WHEN effective_date > current_date THEN ' effective ' || strftime(effective_date, '%Y-%m-%d') ELSE '' END
                 || CASE WHEN affects_pac THEN ' [PAC]' ELSE '' END, chr(10) ORDER BY version, change_id) FROM report WHERE NOT notes_only)) AS detail;

          SELECT
            :old_version = '' AS is_baseline,
            :since AS since_version,
            :new_version AS version,
            (SELECT count(*) FROM sets) AS endpoint_sets,
            (SELECT count(*) FROM hosts) AS url_patterns,
            (SELECT count(*) FROM direct_hosts) AS direct_patterns,
            (SELECT count(*) FROM sets WHERE len(urls) = 0 AND category IN (SELECT category FROM direct)) AS ip_only_direct_sets,
            (SELECT count(*) FROM report) AS changes,
            (SELECT count(*) FROM report WHERE affects_pac) AS pac_changes,
            (SELECT count(*) FROM report WHERE notes_only) AS notes_only_changes,
            (SELECT count(*) FROM added) AS hosts_added,
            (SELECT count(*) FROM removed) AS hosts_removed,
            (SELECT coalesce(string_agg(pattern, chr(10)), '') FROM direct_hosts) AS direct_hosts,
            (SELECT detail FROM detail) AS detail,
            '// Microsoft 365 PAC file for the ' || :instance || ' instance, endpoint version ' || :new_version || chr(10)
              || '// Generated by Kestra from endpoints.office.com. Categories sent DIRECT ' || (SELECT string_agg(category, ', ' ORDER BY category) FROM direct) || chr(10)
              || 'function FindProxyForURL(url, host) {' || chr(10)
              || '  var h = host.toLowerCase();' || chr(10)
              || '  if (' || coalesce((SELECT string_agg(CASE WHEN contains(pattern, '*') THEN 'shExpMatch(h, "' || pattern || '")' ELSE 'h == "' || pattern || '"' END,
                                     chr(10) || '      || ' ORDER BY pattern) FROM direct_hosts), 'false') || ') {' || chr(10)
              || '    return "DIRECT";' || chr(10) || '  }' || chr(10)
              || '  return "' || :proxy || '";' || chr(10) || '}' || chr(10) AS pac,
            CAST(json_object('text', '*Microsoft 365 ' || :instance || ' endpoints* ' || :since || ' to ' || :new_version
              || CASE WHEN :old_version = '' THEN ' (baseline)' ELSE '' END || ', '
              || (SELECT count(*) FROM report WHERE NOT notes_only) || ' change(s), ' || (SELECT count(*) FROM report WHERE affects_pac) || ' touching DIRECT URLs, PAC diff +'
              || (SELECT count(*) FROM added) || ' -' || (SELECT count(*) FROM removed) || chr(10) || '```' || (SELECT detail FROM detail) || '```' || chr(10) || 'Execution ' || :execution_url) AS VARCHAR) AS slack_payload;

      - id: pac_file
        type: io.kestra.plugin.core.storage.Write
        content: "{{ outputs.build.outputs[0].row.pac }}"
        extension: .pac

      - id: save_pac
        type: io.kestra.plugin.core.kv.Set
        key: "{{ render(vars.key) }}_pac"
        value: "{{ outputs.build.outputs[0].row.pac }}"
        description: The current PAC text, for a web server or another flow to publish.

      - id: save_hosts
        type: io.kestra.plugin.core.kv.Set
        key: "{{ render(vars.key) }}_direct_hosts"
        value: "{{ outputs.build.outputs[0].row.direct_hosts }}"

      - id: save_version
        type: io.kestra.plugin.core.kv.Set
        key: "{{ render(vars.key) }}_version"
        value: "{{ outputs.build.outputs[0].row.version }}"
        description: Saved last, so a failed build is retried on the next hourly run.

      - id: log_changes
        type: io.kestra.plugin.core.log.Log
        level: "{{ outputs.build.outputs[0].row.pac_changes > 0 or outputs.build.outputs[0].row.hosts_added > 0 or outputs.build.outputs[0].row.hosts_removed > 0 ? 'WARN' : 'INFO' }}"
        message: |
          Microsoft 365 {{ inputs.instance }} endpoints {{ outputs.build.outputs[0].row.since_version }} -> {{ outputs.build.outputs[0].row.version }}{{ outputs.build.outputs[0].row.is_baseline ? ' (BASELINE run, no PAC to diff against)' : '' }}.
          {{ outputs.build.outputs[0].row.endpoint_sets }} endpoint sets, {{ outputs.build.outputs[0].row.url_patterns }} URL patterns, {{ outputs.build.outputs[0].row.direct_patterns }} sent DIRECT ({{ inputs.direct_categories | join(', ') }}){{ outputs.build.outputs[0].row.ip_only_direct_sets > 0 ? ', plus ' ~ outputs.build.outputs[0].row.ip_only_direct_sets ~ ' IP-only set(s) that a PAC file cannot match by host' : '' }}.
          Change log: {{ outputs.build.outputs[0].row.changes }} record(s), {{ outputs.build.outputs[0].row.pac_changes }} touching DIRECT URLs, {{ outputs.build.outputs[0].row.notes_only_changes }} notes-only (in the CSV, not listed). PAC diff: +{{ outputs.build.outputs[0].row.hosts_added }} -{{ outputs.build.outputs[0].row.hosts_removed }}.
          {{ outputs.build.outputs[0].row.detail }}

      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        runIf: "{{ outputs.build.outputs[0].row.changes > 0 or outputs.build.outputs[0].row.hosts_added > 0 or outputs.build.outputs[0].row.hosts_removed > 0 }}"
        allowFailure: true
        description: Posts only when the change log or the PAC diff has something. allowFailure keeps the sync working without the secret.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: "{{ outputs.build.outputs[0].row.slack_payload }}"
    else:
      - id: unchanged
        type: io.kestra.plugin.core.log.Log
        message: "Microsoft 365 {{ inputs.instance }} endpoints still at version {{ outputs.stored_version.value }}, PAC file unchanged."

outputs:
  - id: version
    type: STRING
    value: "{{ outputs.build.outputs[0].row.version ?? outputs.stored_version.value ?? '' }}"
  - id: rebuilt
    type: BOOL
    value: "{{ outputs.build is defined }}"
  - id: pac_file
    type: STRING
    value: "{{ outputs.pac_file.uri ?? '' }}"
    description: Internal storage URI of the PAC file built by this run, empty when the version did not change. The latest PAC text is always in the KV key.
  - id: changes_csv
    type: STRING
    value: "{{ outputs.build.outputFiles.changes_csv ?? '' }}"

extend:
  title: Sync a Proxy PAC File with Microsoft 365 Endpoint Changes
  metaTitle: Microsoft 365 Endpoint Change and PAC File Sync with DuckDB and Slack | Kestra
  shortDescription: Check the Microsoft 365 IP address and URL web service every hour, and when the endpoint version moves, rebuild the proxy PAC file for Optimize and Allow hosts, diff it against the last build and post the change log to Slack.
  metaDescription: Hourly Microsoft 365 endpoint version check that rebuilds the proxy PAC file, diffs DIRECT hosts and posts the versioned change log to Slack.
  description: |
    Microsoft publishes the Microsoft 365 endpoints (URLs, IPs, ports, Optimize/Allow/Default categories) through the keyless web service at endpoints.office.com and changes them about monthly. Optimize and Allow traffic should bypass the proxy, so each change is a PAC file edit. This flow automates that edit.

    ## How it works

    1. An hourly `Schedule` calls `/version/{instance}` with a `clientrequestid` GUID (one tiny request).
    2. KV keys hold the last version and DIRECT host list. An `If` compares the stored version with `latest`; if equal the run stops.
    3. Otherwise (or with `force_rebuild`) two `Download` tasks fetch `/changes/{instance}/{storedVersion}` and `/endpoints/{instance}`, with `TenantName` so tenant URLs come back filled in.
    4. A DuckDB task keeps the strongest category per URL pattern (a URL can sit in several sets), writes the PAC (`shExpMatch` for wildcards, exact match otherwise, `DIRECT` for the chosen categories, your proxy for the rest) and diffs the DIRECT patterns against the last build. The change log becomes a CSV, with its quirks handled: duplicated records, `Change` records without a category (looked up from the set, or from other records of a retired set), port changes, and notes-only changes kept out of the alert.
    5. PAC text and host list go to KV and the version is saved last, so a failed run is retried. A log line and a Slack message list the changes and the hosts that start or stop going DIRECT.

    ## What you get

    - A PAC file per new version, and the current PAC text in the KV key `m365_endpoints_<instance>_pac`.
    - A DIRECT host diff and a CSV of change records (set, category, URL and IP adds and removes, ports, effective date).
    - A count of IP-only DIRECT sets (Teams media), which a PAC file cannot match by host.

    ## Who it's for

    - Network and proxy teams running Zscaler, Squid, Blue Coat or a PAC server.
    - Security engineers who own Microsoft 365 bypass lists and firewall rules.

    ## Why orchestrate this with Kestra

    - Version check, state and rebuild live in one flow; the KV store replaces the state file of a cron script.
    - Task retries cover transient HTTP errors, and saving the version last means a failure is retried, never skipped.
    - The PAC logic is readable SQL.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack plugin.
    - Outbound HTTPS to `endpoints.office.com`; no API key.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the change report (optional; without it `notify` warns and the sync still succeeds).

    ## Quick start

    1. Set `client_request_id` to your own GUID and `proxy_directive` to your proxy (the default is a placeholder).
    2. Execute. The first run is a baseline: it reads the change log from `baseline_since_version` (January 2025) on and builds the first PAC.
    3. Execute again: the version is unchanged and the run stops after one request.
    4. Add `SLACK_WEBHOOK_URL`, keep the schedule on and serve the PAC from the KV key or the `pac_file` output.

    ## How to extend

    - Push the PAC file to S3, Azure Blob or Git for the proxy fleet.
    - Feed the IP changes of the CSV to firewall object groups with the Terraform plugin.
    - Run one schedule per instance (Worldwide, USGovDoD, USGovGCCHigh, China).

    ## Links

    - [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if), [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download) and [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Microsoft 365 IP address and URL web service](https://learn.microsoft.com/en-us/microsoft-365/enterprise/microsoft-365-ip-web-service)
    - [Managing Microsoft 365 endpoints and PAC files](https://learn.microsoft.com/en-us/microsoft-365/enterprise/managing-office-365-endpoints)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
