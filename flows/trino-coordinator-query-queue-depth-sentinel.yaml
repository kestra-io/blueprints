id: trino-coordinator-query-queue-depth-sentinel
namespace: company.analytics

inputs:
  - id: trino_coordinator_url
    type: STRING
    defaults: "http://trino-coordinator.internal:8080"
    description: Base URL of Trino Coordinator Web UI / REST service.
  - id: max_queued_queries
    type: INT
    defaults: 20
    description: "Maximum allowable queued queries before alerting (default 20)."

outputs:
  - id: queued_queries
    type: INT
    value: "{{ outputs.inspect_cluster_state.vars.queued_queries }}"
  - id: running_queries
    type: INT
    value: "{{ outputs.inspect_cluster_state.vars.running_queries }}"
  - id: active_workers
    type: INT
    value: "{{ outputs.inspect_cluster_state.vars.active_workers }}"


tasks:
  - id: inspect_cluster_state
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects Trino cluster state via coordinator REST endpoint.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      TRINO_URL: "{{ inputs.trino_coordinator_url }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      coord_url = os.environ.get("TRINO_URL", "").rstrip("/")
      cluster_url = f"{coord_url}/v1/cluster"

      try:
          resp = requests.get(cluster_url, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"Failed to query Trino cluster endpoint: {e}", file=sys.stderr)
          sys.exit(1)

      queued = int(data.get("queuedQueries", 0))
      running = int(data.get("runningQueries", 0))
      active_workers = int(data.get("activeWorkers", 0))

      Kestra.outputs({
          "queued_queries": queued,
          "running_queries": running,
          "active_workers": active_workers
      })

  - id: evaluate_queue_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_cluster_state.vars.queued_queries | int > inputs.max_queued_queries or outputs.inspect_cluster_state.vars.active_workers | int == 0 }}"
    then:
      - id: notify_analytics_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#analytics-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Trino Query Queue Saturated Alert",
                "text": "Trino Coordinator at `{{ inputs.trino_coordinator_url }}` has *{{ outputs.inspect_cluster_state.vars.queued_queries }} queued queries* (Running: {{ outputs.inspect_cluster_state.vars.running_queries }}, Active Workers: {{ outputs.inspect_cluster_state.vars.active_workers }})! Worker nodes are out of memory, or concurrent queries have exhausted cluster resource groups.",
                "footer": "Kestra Analytics Sentinel • Trino SQL"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#analytics-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Trino Sentinel Failure",
            "text": "Failed to query Trino Coordinator /v1/cluster. Verify coordinator address and port.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors Trino coordinator for query queue saturation and dead worker nodes to prevent analytical BI report freezes."
  metaTitle: Trino Distributed SQL Query Queue Depth and Worker Failure Sentinel with Kestra
  title: Trino Distributed SQL Query Queue Depth and Worker Failure Sentinel
  shortDescription: Monitors Trino coordinator for query queue saturation and dead worker nodes to prevent analytical BI report freezes.
  description: |
    ## How it works
    This workflow connects to the Trino Coordinator REST API (`/v1/cluster`) to inspect `queuedQueries`, `runningQueries`, and `activeWorkers`. In high-concurrency enterprise data platforms, Trino enforces resource groups to manage memory and CPU contention. When users launch unoptimized queries scanning billions of rows, cluster memory limits are hit, forcing subsequent analytical queries into an execution queue. If active worker nodes crash due to OOM errors, queue depths skyrocket, freezing BI dashboards. This workflow tracks queue levels and raises alerts before reports fail.

    ## What you get
    - Real-time visibility into Trino query queue depths and cluster worker counts.
    - Prevents BI dashboard query timeouts and analytical pipeline stalls.
    - Clear quantitative tracking of queued versus running queries.

    ## Who it's for
    - Data Platform Engineers and Distributed SQL Administrators.
    - Analytics Engineering Leads overseeing business intelligence reporting uptime.

    ## Why orchestrate this with Kestra
    - **Continuous Query Engine Assurance**: Periodically checks cluster state automatically.
    - **Decoupled Monitoring**: Interacts with standard Trino REST endpoints.
    - **Direct Team Alerts**: Delivers notifications with queue and worker metrics directly to Slack.

    ## Prerequisites
    - Trino or Starburst cluster with Coordinator HTTP API accessible.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Trino Coordinator URL and queue threshold.
    3. Run the workflow to inspect cluster state.

    ## How to extend
    - Query `/v1/query?state=RUNNING` to isolate the longest-running queries consuming the most memory.
    - Automatically scale Trino worker pod replicas via Kubernetes HPA.

    ## Links
    - [Trino Cluster REST API Documentation](https://trino.io/docs/current/admin/tuning.html)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - ELT & Data Landing
  ee: false
  demo: false
