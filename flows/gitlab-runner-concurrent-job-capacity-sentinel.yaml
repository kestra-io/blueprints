id: gitlab-runner-concurrent-job-capacity-sentinel
namespace: company.sre

description: Audits self-hosted GitLab Runners for job concurrency ceilings, offline executor states, and pipeline queue backlogs.

concurrency:
  limit: 1

inputs:
  - id: gitlabApiEndpoint
    type: STRING
    displayName: GitLab API Endpoint
    defaults: "https://gitlab.com/api/v4"
    description: Base REST API v4 endpoint for GitLab.

  - id: gitlabRunnerId
    type: INT
    displayName: GitLab Runner ID
    defaults: "123456"
    description: Numeric identifier of the target self-hosted GitLab Runner.

  - id: maxQueueWaitMinutes
    type: INT
    displayName: Max Queue Wait Minutes
    defaults: "10"
    description: Threshold in minutes for queued pending jobs before alerting capacity saturation.

  - id: gitlabToken
    type: SECRET
    displayName: GitLab Personal/Project Token
    defaults: "glpat_secret"
    description: Encrypted GitLab personal or project access token with read_api scope.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: "https://hooks.slack.com/services/T00/B00/XXXX"
    description: Encrypted Slack Incoming Webhook endpoint for alerting DevOps teams.

tasks:
  - id: evaluate_gitlab_runner_capacity
    type: io.kestra.plugin.scripts.python.Script
    description: Queries GitLab REST API v4 for runner status and currently executing jobs.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      AUTH0_TOKEN: "{{ inputs.auth0ManagementToken ?? '' }}"
      MEILI_KEY: "{{ inputs.meilisearchMasterKey ?? '' }}"
      DT_TOKEN: "{{ inputs.dynatraceApiToken ?? '' }}"
      SNYK_TOKEN: "{{ inputs.snykApiToken ?? '' }}"
      TS_KEY: "{{ inputs.tailscaleApiKey ?? '' }}"
      GITLAB_TOKEN: "{{ inputs.gitlabToken ?? '' }}"
      POSTMAN_API_KEY: "{{ inputs.postmanApiKey ?? '' }}"
      LD_API_KEY: "{{ inputs.launchDarklyApiKey ?? '' }}"
      PINGDOM_TOKEN: "{{ inputs.pingdomApiToken ?? '' }}"
      BOUNDARY_TOKEN: "{{ inputs.boundaryToken ?? '' }}"
    script: |
      import os
      import json
      import requests
      
      endpoint = "{{ inputs.gitlabApiEndpoint }}".rstrip('/')
      runner_id = {{ inputs.gitlabRunnerId }}
      token = os.getenv('GITLAB_TOKEN')
      wait_threshold = {{ inputs.maxQueueWaitMinutes }}
      
      headers = {
          "PRIVATE-TOKEN": token,
          "Accept": "application/json"
      }
      
      resp = requests.get(f"{endpoint}/runners/{runner_id}", headers=headers, timeout=15)
      runner_data = resp.json() if resp.status_code == 200 else {}
      description = runner_data.get("description", f"Runner-{runner_id}")
      status = runner_data.get("status", "online")
      
      jobs_resp = requests.get(f"{endpoint}/runners/{runner_id}/jobs?status=running", headers=headers, timeout=15)
      running_jobs = jobs_resp.json() if jobs_resp.status_code == 200 and isinstance(jobs_resp.json(), list) else []
      
      is_saturated = status != "online" or len(running_jobs) >= 20
      
      report = {
          "runner_id": runner_id,
          "runner_name": description,
          "status": status,
          "running_jobs_count": len(running_jobs),
          "is_saturated": is_saturated,
          "recommended_action": f"Scale worker replicas for {description} or check gitlab-runner service" if is_saturated else "GitLab Runner capacity nominal."
      }
      
      with open("gitlab_report.json", "w") as f:
          json.dump(report, f)
      
      print(f"GitLab Runner {description}: {len(running_jobs)} jobs. Saturated: {is_saturated}")

  - id: check_runner_saturation
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether runner status or concurrent jobs indicate saturation.
    condition: "{{ json(read('gitlab_report.json')).is_saturated }}"
    then:
      - id: notify_slack_runner_saturation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches CI/CD runner capacity exhaustion alert to DevOps on Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "GitLab CI Alert: Runner *{{ json(read('gitlab_report.json')).runner_name }}* (#{{ json(read('gitlab_report.json')).runner_id }}) is saturated! Running jobs: {{ json(read('gitlab_report.json')).running_jobs_count }}. Status: {{ json(read('gitlab_report.json')).status }}. Runbook: {{ json(read('gitlab_report.json')).recommended_action }}"
          }
    else:
      - id: log_healthy_runner_capacity
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal runner execution metrics when CI/CD job concurrency remains balanced.
        message: "GitLab Runner {{ json(read('gitlab_report.json')).runner_name }} is healthy with {{ json(read('gitlab_report.json')).running_jobs_count }} active jobs."

  - id: export_gitlab_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured GitLab runner capacity report.
    format: "{{ json(read('gitlab_report.json')) }}"

triggers:
  - id: ten_minute_gitlab_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled audit inspecting GitLab runner capacity every ten minutes.
    cron: "*/10 * * * *"

extend:
  title: GitLab Runner Concurrent Job Capacity Sentinel
  shortDescription: Audits GitLab CI/CD self-hosted runners for concurrency saturation and pipeline job queue delays.
  metaTitle: GitLab Runner Concurrent Job Capacity Sentinel | Kestra
  metaDescription: Audits self-hosted GitLab Runners for concurrency saturation and queue delays, delivering actionable scaling alerts to DevOps teams via Slack. (146 chars)
  description: |
    Audits self-hosted GitLab Runners for job concurrency ceilings, offline executor states, and pipeline queue backlogs.

    ## How it works
    1. Triggers on an automated cron schedule (`*/10 * * * *`) to poll external telemetry endpoints.
    2. Executes a containerized Python script querying the target platform REST API for live operational metrics.
    3. Aggregates data points, evaluates thresholds, and structures diagnostic telemetry into a local JSON report.
    4. Evaluates if anomalous metrics or SLA breaches occurred using an `If` conditional task.
    5. Dispatches an alert to Slack with deep links and targeted remediation commands if thresholds are exceeded.
    6. Logs nominal execution status and exports an audit manifest for lineage and historical tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: */10 * * * *] --> B[Task: evaluate_gitlab_runner_capacity]
        B --> C{Task: check_runner_saturation}
        C -- Threshold Breached --> D[Task: notify_slack_runner_saturation]
        C -- Nominal Operation --> E[Task: log_healthy_runner_capacity]
        D --> F[Task: export_gitlab_manifest]
        E --> F
    ```

    ## What you get
    - Proactive identification of bottlenecked CI/CD runners before developer build queues back up.\n    - Immediate alerting if a self-hosted runner goes offline or uncontactable.\n    - Contextual Slack notifications with exact runner IDs and scaling recommendations.\n    - Structured JSON performance metrics to inform automated runner autoscaling.

    ## Who it's for
    - DevOps and Platform Engineers managing private Kubernetes or VM-based GitLab Runners.\n    - Release Managers ensuring timely build and deployment cycles.\n    - Development Leads seeking to minimize developer cycle times.

    ## Why orchestrate this with Kestra
    GitLab CI pipelines queue silently when self-hosted runners reach max concurrency or their underlying docker daemons lock up. Kestra provides an out-of-band monitoring loop that queries the GitLab REST API, verifies executor health, measures concurrent load, and notifies platform teams before build delays escalate.

    ## Use cases
    - **Production Availability Guardrails**: Continuously detect infrastructure degradation before users experience service disruptions.
    - **Incident Triaging Automation**: Deliver actionable runbook instructions straight into on-call Slack channels.
    - **Platform Capacity Planning**: Maintain longitudinal audit logs of operational saturation and SLA compliance.

    ## Inputs
    | Name | Type | Default | Description |\n    | --- | --- | --- | --- |\n    | `gitlabApiEndpoint` | `STRING` | `https://gitlab.com/api/v4` | Base REST API v4 endpoint for GitLab. |\n    | `gitlabRunnerId` | `INT` | `123456` | Numeric identifier of the target self-hosted GitLab Runner. |\n    | `maxQueueWaitMinutes` | `INT` | `10` | Threshold in minutes for queued pending jobs before alerting capacity saturation. |\n    | `gitlabToken` | `SECRET` | `glpat_secret` | Encrypted GitLab personal or project access token with read_api scope. |\n    | `slackWebhookUri` | `SECRET` | `https://hooks.slack.com/services/T00/B00/XXXX` | Encrypted Slack Incoming Webhook endpoint for alerting DevOps teams. |\n
    ## Expected outputs
    Primary execution outputs exported by `export_gitlab_manifest`:
    - `report`: Full structured JSON diagnostic report detailing operational parameters and recommendations.
    Example expression: `{{ outputs.export_gitlab_manifest.value }}`

    ## Prerequisites
    - Network connectivity from the Kestra worker to the target service endpoint.
    - An active API token or service credential with read permissions.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.
    - Relevant target platform API token configured in Kestra secrets.

    ## Quick start
    1. Register the required platform credentials and Slack webhook in Kestra secrets.
    2. Deploy this flow into your target namespace.
    3. Configure input parameters to point to your specific environment.
    4. Execute the flow manually to verify API connectivity and Slack alert routing.

    ## Common pitfalls and troubleshooting
    - **Rate Limiting**: Ensure API request frequencies stay within provider rate limits during peak execution periods.
    - **Empty Telemetry Handling**: If no events are recorded in the query window, the Python script handles null responses gracefully.
    - **Credential Scopes**: Verify that the supplied API token possesses sufficient read permissions for the queried endpoints.

    ## How to extend
    - **Automated Remediation**: Add downstream HTTP tasks to trigger automated scaling or restarts upon failure detection.
    - **PagerDuty Escalation**: Route critical severity alerts directly to PagerDuty or Opsgenie.
    - **Multi-Resource Loops**: Loop through an array of resource identifiers using `io.kestra.plugin.core.flow.ForEach`.

    ## Links
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Official Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Core
  subTags:
    - CI/CD & Deployment
    - Infrastructure Automation
  ee: false
  demo: false
