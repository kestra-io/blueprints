id: aws-apigateway-endpoint-latency-and-5xx-spike-sentinel
namespace: company.cloud

description: |
  Audits AWS API Gateway REST and HTTP API stages to detect surges in HTTP 5XX server errors
  and p99 integration latency breaches, delivering actionable diagnostic incident notifications to DevOps teams.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: us-east-1
    description: Target AWS region where API Gateway instances and CloudWatch metrics reside.

  - id: api_name_filter
    type: STRING
    displayName: API Name Filter
    defaults: all
    description: Name or prefix of target API Gateway APIs to audit, or all to scan all regional APIs.

  - id: error_5xx_rate_threshold_percent
    type: FLOAT
    displayName: 5XX Error Rate Threshold
    defaults: 2.0
    description: Percentage threshold of 5XX responses relative to total requests that triggers incident alerting.

  - id: p99_latency_threshold_ms
    type: INT
    displayName: P99 Latency Threshold (ms)
    defaults: 1500
    description: Maximum allowable p99 integration latency in milliseconds before flagging degraded performance.

  - id: alert_on_degraded
    type: BOOL
    displayName: Alert on Degraded
    defaults: true
    description: Whether to dispatch automated Slack incident notifications when threshold breaches are detected.

tasks:
  - id: scan_apigateway_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Queries AWS API Gateway and CloudWatch metrics to detect 5XX error spikes and integration latency anomalies.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
    script: |
      import os
      import json
      import boto3
      from datetime import datetime, timedelta, timezone
      from kestra import Kestra

      region = os.environ.get("AWS_DEFAULT_REGION", "us-east-1")
      api_filter = "{{ inputs.api_name_filter }}".strip().lower()
      error_threshold = float("{{ inputs.error_5xx_rate_threshold_percent }}")
      latency_threshold = int("{{ inputs.p99_latency_threshold_ms }}")

      apigw_client = boto3.client("apigateway", region_name=region)
      cloudwatch = boto3.client("cloudwatch", region_name=region)

      end_time = datetime.now(timezone.utc)
      start_time = end_time - timedelta(minutes=15)

      apis_audited = 0
      degraded_apis = []

      paginator = apigw_client.get_paginator("get_rest_apis")
      for page in paginator.paginate():
          for api in page.get("items", []):
              api_id = api["id"]
              api_name = api["name"]

              if api_filter != "all" and api_filter not in api_name.lower():
                  continue

              apis_audited += 1

              # Query 5XX Error Rate and Count
              metric_data_queries = [
                  {
                      "Id": "count",
                      "MetricStat": {
                          "Metric": {
                              "Namespace": "AWS/ApiGateway",
                              "MetricName": "Count",
                              "Dimensions": [{"Name": "ApiName", "Value": api_name}]
                          },
                          "Period": 900,
                          "Stat": "Sum"
                      },
                      "ReturnData": True
                  },
                  {
                      "Id": "errors_5xx",
                      "MetricStat": {
                          "Metric": {
                              "Namespace": "AWS/ApiGateway",
                              "MetricName": "5XXError",
                              "Dimensions": [{"Name": "ApiName", "Value": api_name}]
                          },
                          "Period": 900,
                          "Stat": "Sum"
                      },
                      "ReturnData": True
                  },
                  {
                      "Id": "p99_latency",
                      "MetricStat": {
                          "Metric": {
                              "Namespace": "AWS/ApiGateway",
                              "MetricName": "IntegrationLatency",
                              "Dimensions": [{"Name": "ApiName", "Value": api_name}]
                          },
                          "Period": 900,
                          "Stat": "p99"
                      },
                      "ReturnData": True
                  }
              ]

              try:
                  response = cloudwatch.get_metric_data(
                      MetricDataQueries=metric_data_queries,
                      StartTime=start_time,
                      EndTime=end_time
                  )
                  results = {r["Id"]: (r["Values"][0] if r["Values"] else 0.0) for r in response.get("MetricDataResults", [])}
                  total_requests = results.get("count", 0.0)
                  errors_5xx = results.get("errors_5xx", 0.0)
                  p99_latency = results.get("p99_latency", 0.0)

                  error_rate = (errors_5xx / total_requests * 100.0) if total_requests > 0 else 0.0

                  if (total_requests > 10 and error_rate >= error_threshold) or (p99_latency >= latency_threshold):
                      degraded_apis.append({
                          "api_id": api_id,
                          "api_name": api_name,
                          "total_requests": int(total_requests),
                          "errors_5xx": int(errors_5xx),
                          "error_rate_percent": round(error_rate, 2),
                          "p99_integration_latency_ms": round(p99_latency, 2),
                          "remediation": f"aws apigateway get-stage --rest-api-id {api_id} --stage-name prod"
                      })
              except Exception as e:
                  print(f"Error querying CloudWatch for API {api_name}: {e}")

      Kestra.outputs({
          "total_apis_audited": apis_audited,
          "degraded_apis_count": len(degraded_apis),
          "has_degraded_apis": len(degraded_apis) > 0,
          "degraded_apis_details": json.dumps(degraded_apis)
      })

  - id: check_degraded_api_routes
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether degraded API Gateway stages or 5XX error spikes were detected.
    condition: "{{ outputs.scan_apigateway_telemetry.vars.has_degraded_apis and inputs.alert_on_degraded }}"
    then:
      - id: notify_slack_api_incident
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident notifications to Slack with degraded API endpoints and error rates.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#devops-incidents",
            "username": "APIGateway-Sentinel",
            "text": "CRITICAL: AWS API Gateway 5XX error spike or p99 latency degradation detected in region `{{ inputs.aws_region }}`. Total APIs audited: `{{ outputs.scan_apigateway_telemetry.vars.total_apis_audited }}`, Degraded APIs: `{{ outputs.scan_apigateway_telemetry.vars.degraded_apis_count }}`."
          }

  - id: log_telemetry_status
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of API Gateway telemetry evaluations.
    message: "AWS API Gateway audit completed for region '{{ inputs.aws_region }}'. Total APIs: {{ outputs.scan_apigateway_telemetry.vars.total_apis_audited }}, Degraded: {{ outputs.scan_apigateway_telemetry.vars.degraded_apis_count }}."

  - id: export_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of API Gateway latency metrics and error rates for observability platforms.
    format:
      region: "{{ inputs.aws_region }}"
      api_name_filter: "{{ inputs.api_name_filter }}"
      total_apis_audited: "{{ outputs.scan_apigateway_telemetry.vars.total_apis_audited }}"
      degraded_apis_count: "{{ outputs.scan_apigateway_telemetry.vars.degraded_apis_count }}"
      details: "{{ outputs.scan_apigateway_telemetry.vars.degraded_apis_details }}"

triggers:
  - id: scheduled_apigateway_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing API Gateway telemetry every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: AWS API Gateway Endpoint Latency and 5XX Spike Sentinel
  metaTitle: AWS API Gateway Endpoint Latency and 5XX Spike Sentinel Blueprint
  shortDescription: Audits AWS API Gateway stages to detect 5XX server error surges and p99 integration latency breaches.
  metaDescription: Audits AWS API Gateway stages to detect 5XX server error surges and p99 integration latency breaches, dispatching diagnostic incident alerts to DevOps teams.
  description: |
    Modern cloud architectures rely on AWS API Gateway to route client traffic to Lambda functions, ECS microservices, and VPC internal backends. When downstream services encounter memory pressure, database connection pool exhaustion, or unhandled exceptions, API Gateway responds with HTTP 5XX status codes and surging integration latencies. If undetected, client applications fail silently and service-level objectives (SLOs) degrade. This sentinel interrogates AWS API Gateway and CloudWatch metrics on a scheduled interval, detects 5XX error rate anomalies and p99 latency breaches, and notifies incident engineering teams on Slack with actionable diagnostic commands.

    ## How it works
    1. **Scheduled triggering**: Executes every 15 minutes via automated cron trigger (`*/15 * * * *`) or runs on-demand via manual API triggers.
    2. **Resource enumeration**: Queries the AWS API Gateway REST API (`get_rest_apis`) to discover all active regional APIs matching the configured name filter.
    3. **CloudWatch telemetry analysis**: Fetches CloudWatch MetricData queries for `Count`, `5XXError`, and `IntegrationLatency` across a 15-minute rolling window.
    4. **Threshold evaluation**: Computes the percentage of 5XX responses relative to total requests and compares p99 integration latency against operational SLAs.
    5. **Conditional branching**: An `io.kestra.plugin.core.flow.If` task evaluates whether any API stage exceeds the error rate or latency threshold.
    6. **Slack incident dispatch**: Emits a priority incident payload to the `#devops-incidents` channel with API identifiers, request counts, and CLI diagnosis commands.
    7. **Audit trail logging and return**: Logs operational telemetry and outputs a structured compliance manifest for long-term audit tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_apigateway_audit Schedule Trigger] --> B[scan_apigateway_telemetry Python Script]
      B --> C[check_degraded_api_routes Flowable If]
      C -- Degraded APIs Detected --> D[notify_slack_api_incident Webhook]
      C -- All APIs Healthy --> E[log_telemetry_status Log]
      D --> E
      E --> F[export_audit_manifest Return]
    ```

    ## Use cases
    - **Microservice dependency degradation**: Detect failing downstream Lambda or container backends before cascading HTTP 504 timeouts impact mobile and web clients.
    - **SLA and SLO compliance tracking**: Continuously monitor API integration latencies to ensure p99 thresholds remain within contractual client SLAs.
    - **Automated incident escalation**: Provide on-call site reliability engineers with immediate visibility into affected API Gateway stages and error frequencies.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | `STRING` | `us-east-1` | Target AWS region where API Gateway instances and CloudWatch metrics reside. |
    | `api_name_filter` | `STRING` | `all` | Name or prefix of target API Gateway APIs to audit, or all to scan all regional APIs. |
    | `error_5xx_rate_threshold_percent` | `FLOAT` | `2.0` | Percentage threshold of 5XX responses relative to total requests that triggers incident alerting. |
    | `p99_latency_threshold_ms` | `INT` | `1500` | Maximum allowable p99 integration latency in milliseconds before flagging degraded performance. |
    | `alert_on_degraded` | `BOOL` | `true` | Whether to dispatch automated Slack incident notifications when threshold breaches are detected. |

    ## Expected outputs
    - `{{ outputs.scan_apigateway_telemetry.vars.total_apis_audited }}`: Total number of API Gateway APIs evaluated during the execution.
    - `{{ outputs.scan_apigateway_telemetry.vars.degraded_apis_count }}`: Number of API stages exceeding error rate or latency thresholds.
    - `{{ outputs.scan_apigateway_telemetry.vars.degraded_apis_details }}`: JSON string listing degraded APIs with exact error rates and latency percentiles.
    - `{{ outputs.export_audit_manifest.value }}`: Structured dictionary containing the consolidated audit summary.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to AWS STS, API Gateway, and CloudWatch endpoints.
    - AWS IAM credentials configured with `apigateway:GET` and `cloudwatch:GetMetricData` permissions.
    - Slack incoming webhook endpoint configured for operational incident alerting.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: AWS IAM access key with permissions to read API Gateway and CloudWatch metrics.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret key corresponding to the access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch incident notifications.

    ## Quick start
    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra secret storage.
    2. Import this blueprint into your Kestra instance under the `company.cloud` namespace.
    3. Configure `aws_region` and `api_name_filter` to target your production API stages.
    4. Run a manual execution to verify CloudWatch metric discovery and confirm notification delivery.

    ## Common pitfalls and troubleshooting
    - **CloudWatch metric delay**: CloudWatch metrics for API Gateway can experience 1 to 2 minutes of ingestion delay; ensure evaluation windows cover at least 15 minutes.
    - **Detailed metrics enabled**: By default, API Gateway provides stage-level metrics; ensure detailed CloudWatch metrics are enabled if method-level granularity is required.
    - **IAM permission boundaries**: Ensure the IAM role has `cloudwatch:GetMetricData` across `AWS/ApiGateway` namespaces; missing permissions yield empty metric arrays.

    ## How to extend
    - **Automated canary rollback**: Trigger an automated AWS CodeDeploy or API Gateway canary traffic shift rollback when 5XX rates exceed 5%.
    - **PagerDuty on-call escalation**: Route critical API Gateway degradations directly to the on-call platform engineer via PagerDuty webhook.
    - **Distributed trace linking**: Attach AWS X-Ray trace search URLs to the Slack incident card to allow instant root-cause inspection.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [AWS API Gateway CloudWatch Dimensions Documentation](https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-metrics-and-dimensions.html)
    - [Boto3 CloudWatch Client Reference](https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/cloudwatch.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
