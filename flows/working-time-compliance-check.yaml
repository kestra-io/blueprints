id: working-time-compliance-check
namespace: company.team

description: |
  Weekly working time compliance check (EU Working Time Directive, as transposed in most
  member states): from timesheet or clock-in data, flag daily rest under 11 hours, weekly
  rest under 24 hours, shifts over the daily limit without a break, average weeks over 48
  hours on a rolling reference period unless the worker opted out, and night work over 8
  hours. Each breach goes to the manager, repeated breaches to HR, and the scheduled
  rota for next week is checked before it is published.

inputs:
  - id: week_ending
    type: STRING
    displayName: Week ending (Sunday)
    defaults: "2026-10-04"
    validator: ^\d{4}-\d{2}-\d{2}$

  - id: reference_weeks
    type: INT
    displayName: Reference period (weeks)
    description: The 48-hour average is computed over this many weeks. 17 is the directive's default.
    defaults: 17

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: ISSUES adds a shift that ends before it starts and a shift for an unknown employee, which must stop the check.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

variables:
  state_key: working_time_breaches
  pack_dir: "working-time/{{ inputs.week_ending }}"

concurrency:
  limit: 1

tasks:
  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    values:
      history: >-
        {{ (kv(vars.state_key, errorOnMissing=false) ?? {'weeks': {}}) | jq('.weeks | with_entries(select(.key < "' ~ inputs.week_ending ~ '")) | [.[] | .breaches[]] | group_by(.) | map({(.[0]): length}) | add // {}') | first | toJson }}

  - id: check
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: employees with opt-out and night worker status, actual shifts over the
      reference period and next week's rota (demo generator or your time and attendance system),
      then the rest, break, weekly average and night checks on both.
    outputFiles:
      - breaches
      - employees
      - rota_conflicts
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE wk_end = DATE '{{ inputs.week_ending }}';
      SET VARIABLE wk_start = getvariable('wk_end') - 6;
      SET VARIABLE ref_start = getvariable('wk_end') - 7 * {{ inputs.reference_weeks }} + 1;
      -- The demo shifts are fixed, so every run sees the same workplace.
      SET VARIABLE anchor = DATE '2026-10-04';

      -- =======================================================================
      -- Employees and shifts. Replace with your time and attendance system.
      -- =======================================================================
      CREATE TABLE employees (employee VARCHAR, name VARCHAR, team VARCHAR, manager VARCHAR, opted_out BOOLEAN, night_worker BOOLEAN);
      INSERT INTO employees VALUES
        ('W01', 'Anna', 'Warehouse', 'mgr-wh@example.com', false, false), ('W02', 'Ben', 'Warehouse', 'mgr-wh@example.com', false, false),
        ('W03', 'Chloe', 'Warehouse', 'mgr-wh@example.com', true, false), ('W04', 'Dev', 'Night shift', 'mgr-night@example.com', false, true),
        ('W05', 'Elif', 'Night shift', 'mgr-night@example.com', false, true), ('W06', 'Femi', 'Support', 'mgr-sup@example.com', false, false),
        ('W07', 'Gita', 'Support', 'mgr-sup@example.com', false, false), ('W08', 'Hugo', 'Drivers', 'mgr-drv@example.com', false, false);

      -- Regular pattern over 20 weeks: day shifts 08:00-16:30, night shifts 22:00-06:00, Monday to Friday.
      CREATE TABLE shifts AS
      SELECT e.employee, d::DATE AS work_date,
             d + CASE WHEN e.night_worker THEN INTERVAL 22 HOUR ELSE INTERVAL 8 HOUR END AS start_at,
             d + CASE WHEN e.night_worker THEN INTERVAL 30 HOUR ELSE INTERVAL 16 HOUR + INTERVAL 30 MINUTE END AS end_at,
             CASE WHEN e.night_worker THEN 30 ELSE 30 END AS break_min, 'ACTUAL' AS kind
      FROM employees e, generate_series(getvariable('anchor') - 139, getvariable('anchor'), INTERVAL 1 DAY) g(d)
      WHERE isodow(d) <= 5;
      -- Ben does overtime every week of the reference period: two hours a day and a Saturday.
      UPDATE shifts SET end_at = end_at + INTERVAL 2 HOUR WHERE employee = 'W02';
      INSERT INTO shifts SELECT 'W02', d::DATE, d + INTERVAL 8 HOUR, d + INTERVAL 16 HOUR, 30, 'ACTUAL' FROM generate_series(getvariable('anchor') - 139, getvariable('anchor'), INTERVAL 1 DAY) g(d) WHERE isodow(d) = 6;
      -- Chloe does the same, but she signed the opt-out.
      UPDATE shifts SET end_at = end_at + INTERVAL 2 HOUR WHERE employee = 'W03';
      INSERT INTO shifts SELECT 'W03', d::DATE, d + INTERVAL 8 HOUR, d + INTERVAL 16 HOUR, 30, 'ACTUAL' FROM generate_series(getvariable('anchor') - 139, getvariable('anchor'), INTERVAL 1 DAY) g(d) WHERE isodow(d) = 6;
      -- Last week: Femi closed at 23:00 on Wednesday and opened at 07:00 on Thursday (8 h rest).
      UPDATE shifts SET end_at = work_date + INTERVAL 23 HOUR WHERE employee = 'W06' AND work_date = getvariable('anchor') - 4;
      UPDATE shifts SET start_at = work_date + INTERVAL 7 HOUR WHERE employee = 'W06' AND work_date = getvariable('anchor') - 3;
      -- Hugo drove 7 days in a row and an 11-hour day with no break.
      INSERT INTO shifts VALUES ('W08', getvariable('anchor') - 1, getvariable('anchor') - 1 + INTERVAL 8 HOUR, getvariable('anchor') - 1 + INTERVAL 14 HOUR, 30, 'ACTUAL'),
                                ('W08', getvariable('anchor'), getvariable('anchor') + INTERVAL 8 HOUR, getvariable('anchor') + INTERVAL 14 HOUR, 30, 'ACTUAL'),
                                ('W08', getvariable('anchor') - 8, getvariable('anchor') - 8 + INTERVAL 8 HOUR, getvariable('anchor') - 8 + INTERVAL 14 HOUR, 30, 'ACTUAL');
      UPDATE shifts SET end_at = start_at + INTERVAL 11 HOUR, break_min = 0 WHERE employee = 'W08' AND work_date = getvariable('anchor') - 5;
      -- Dev worked a 10-hour night on Tuesday.
      UPDATE shifts SET end_at = start_at + INTERVAL 10 HOUR WHERE employee = 'W04' AND work_date = getvariable('anchor') - 5;

      -- Next week's rota: Gita is scheduled to close Monday and open Tuesday.
      INSERT INTO shifts
      SELECT e.employee, d::DATE, d + INTERVAL 8 HOUR, d + INTERVAL 16 HOUR + INTERVAL 30 MINUTE, 30, 'ROTA'
      FROM employees e, generate_series(getvariable('anchor') + 1, getvariable('anchor') + 7, INTERVAL 1 DAY) g(d) WHERE isodow(d) <= 5 AND NOT e.night_worker;
      UPDATE shifts SET start_at = work_date + INTERVAL 14 HOUR, end_at = work_date + INTERVAL 22 HOUR WHERE kind = 'ROTA' AND employee = 'W07' AND work_date = getvariable('anchor') + 1;
      UPDATE shifts SET start_at = work_date + INTERVAL 6 HOUR, end_at = work_date + INTERVAL 14 HOUR WHERE kind = 'ROTA' AND employee = 'W07' AND work_date = getvariable('anchor') + 2;
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO shifts VALUES ('W01', getvariable('wk_end') - 2, getvariable('wk_end') - 2 + INTERVAL 17 HOUR, getvariable('wk_end') - 2 + INTERVAL 9 HOUR, 30, 'ACTUAL'),
                                ('W99', getvariable('wk_end') - 2, getvariable('wk_end') - 2 + INTERVAL 8 HOUR, getvariable('wk_end') - 2 + INTERVAL 16 HOUR, 30, 'ACTUAL');
      {% endif %}

      CREATE TABLE blockers AS
      SELECT 'END_BEFORE_START' AS code, employee || ' ' || work_date AS ref, 'Shift ends at ' || end_at || ', before it starts at ' || start_at AS detail FROM shifts WHERE end_at <= start_at
      UNION ALL SELECT 'UNKNOWN_EMPLOYEE', employee || ' ' || work_date, 'Not in the employee list' FROM shifts s WHERE NOT EXISTS (SELECT 1 FROM employees e WHERE e.employee = s.employee)
      UNION ALL SELECT 'NO_DATA', '{{ inputs.week_ending }}', 'No actual shift in the week' WHERE NOT EXISTS (SELECT 1 FROM shifts WHERE kind = 'ACTUAL' AND work_date BETWEEN getvariable('wk_start') AND getvariable('wk_end'));

      -- =======================================================================
      -- Checks, on actual shifts of the week and on next week's rota.
      -- =======================================================================
      CREATE TABLE s AS
      SELECT s.*, e.name, e.manager, e.opted_out, e.night_worker,
             date_diff('minute', s.start_at, s.end_at) / 60.0 AS hours,
             date_diff('minute', s.start_at, s.end_at) / 60.0 - s.break_min / 60.0 AS worked_h,
             date_diff('minute', lag(s.end_at) OVER w, s.start_at) / 60.0 AS rest_before_h
      FROM shifts s JOIN employees e USING (employee)
      WHERE s.end_at > s.start_at
      WINDOW w AS (PARTITION BY s.employee, s.kind = 'ROTA' OR s.work_date > getvariable('anchor') ORDER BY s.start_at);
      -- The rota continues from the last actual shift, so rest across the weekend is checked too.
      CREATE TABLE rota_chain AS
      SELECT employee, kind, work_date, start_at, end_at,
             date_diff('minute', lag(end_at) OVER (PARTITION BY employee ORDER BY start_at), start_at) / 60.0 AS rest_before_h
      FROM shifts WHERE end_at > start_at AND (kind = 'ROTA' OR work_date >= getvariable('anchor') - 6);

      CREATE TABLE week_actual AS SELECT * FROM s WHERE kind = 'ACTUAL' AND work_date BETWEEN getvariable('wk_start') AND getvariable('wk_end');
      CREATE TABLE breaches AS
      SELECT employee, name, manager, 'DAILY_REST' AS rule, work_date AS on_date, 'Rest of ' || round(rest_before_h, 1) || ' h before this shift, minimum 11' AS detail
        FROM week_actual WHERE rest_before_h < 11
      UNION ALL
      SELECT employee, name, manager, 'BREAK', work_date, round(hours, 1) || ' h shift with a break of ' || break_min || ' min: 20 min required after 6 h'
        FROM week_actual WHERE hours > 6 AND break_min < 20
      UNION ALL
      SELECT employee, name, manager, 'NIGHT_LENGTH', work_date, round(worked_h, 1) || ' h worked on a night shift, maximum 8'
        FROM week_actual WHERE night_worker AND worked_h > 8
      UNION ALL
      -- Weekly rest: some 24 h period without work in the 7 days. Checked as the longest gap in the week.
      SELECT employee, any_value(name), any_value(manager), 'WEEKLY_REST', getvariable('wk_end'), 'Longest rest in the week ' || round(max(gap), 1) || ' h, minimum 24 + 11'
      -- The gap runs to the next shift, actual or on next week's rota, so a Sunday off that runs into Monday counts in full.
      FROM (SELECT x.employee, e.name, e.manager, x.work_date,
                   date_diff('minute', x.end_at, coalesce(lead(x.start_at) OVER (PARTITION BY x.employee ORDER BY x.start_at), (getvariable('wk_end') + 2)::TIMESTAMP)) / 60.0 AS gap
            FROM shifts x JOIN employees e USING (employee)
            WHERE x.end_at > x.start_at AND x.work_date >= getvariable('wk_start') - 1 AND (x.kind = 'ACTUAL' OR x.work_date > getvariable('wk_end')))
      WHERE work_date BETWEEN getvariable('wk_start') - 1 AND getvariable('wk_end')
      GROUP BY employee HAVING max(gap) < 35;

      -- 48-hour average over the reference period. Opt-outs are reported, not breached.
      CREATE TABLE averages AS
      SELECT e.employee, e.name, e.manager, e.opted_out,
             round(coalesce(sum(s.worked_h), 0) / {{ inputs.reference_weeks }}, 1) AS avg_weekly_h,
             round(coalesce(sum(s.worked_h) FILTER (WHERE s.work_date BETWEEN getvariable('wk_start') AND getvariable('wk_end')), 0), 1) AS this_week_h
      FROM employees e LEFT JOIN s ON s.employee = e.employee AND s.kind = 'ACTUAL' AND s.work_date BETWEEN getvariable('ref_start') AND getvariable('wk_end')
      GROUP BY e.employee, e.name, e.manager, e.opted_out;
      INSERT INTO breaches
      SELECT employee, name, manager, 'AVERAGE_48H', getvariable('wk_end'), 'Average ' || avg_weekly_h || ' h a week over {{ inputs.reference_weeks }} weeks, maximum 48 without an opt-out'
      FROM averages WHERE avg_weekly_h > 48 AND NOT opted_out;

      CREATE TABLE rota_conflicts AS
      SELECT r.employee, e.name, e.manager, r.work_date, 'Scheduled with ' || round(r.rest_before_h, 1) || ' h rest before the shift' AS detail
      FROM rota_chain r JOIN employees e USING (employee)
      WHERE r.kind = 'ROTA' AND r.rest_before_h < 11 AND r.work_date BETWEEN getvariable('wk_end') + 1 AND getvariable('wk_end') + 7;

      CREATE TABLE prev AS SELECT key AS k, value::INT AS n FROM json_each('{{ outputs.state.values.history }}');
      CREATE TABLE emp_out AS
      SELECT a.employee, a.name, a.manager, a.opted_out, a.avg_weekly_h, a.this_week_h,
             (SELECT count(*) FROM breaches b WHERE b.employee = a.employee)::INT AS breaches_this_week,
             coalesce((SELECT sum(n) FROM prev WHERE split_part(k, '|', 1) = a.employee), 0)::INT AS breaches_before,
             (SELECT coalesce(string_agg(DISTINCT rule, ', '), '') FROM breaches b WHERE b.employee = a.employee) AS rules
      FROM averages a;
      ALTER TABLE emp_out ADD COLUMN to_hr BOOLEAN;
      UPDATE emp_out SET to_hr = breaches_this_week > 0 AND breaches_before + breaches_this_week >= 3;

      COPY (SELECT * FROM breaches ORDER BY manager, employee, on_date) TO '{{ outputFiles.breaches }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM emp_out ORDER BY employee) TO '{{ outputFiles.employees }}' (HEADER, DELIMITER ',');
      COPY rota_conflicts TO '{{ outputFiles.rota_conflicts }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM breaches)::INT AS breaches,
        (SELECT coalesce(string_agg(name || ' ' || rule || ' (' || detail || ')', '; ' ORDER BY name, rule), '') FROM breaches) AS breach_detail,
        (SELECT coalesce(string_agg(name || ' ' || avg_weekly_h || ' h', ', ' ORDER BY avg_weekly_h DESC), '') FROM emp_out WHERE opted_out AND avg_weekly_h > 48) AS opted_out_over,
        (SELECT coalesce(string_agg(name || ' (' || breaches_before + breaches_this_week || ' breaches)', ', ' ORDER BY name), '') FROM emp_out WHERE to_hr) AS to_hr,
        (SELECT count(*) FROM rota_conflicts)::INT AS rota_conflicts,
        (SELECT coalesce(string_agg(name || ' ' || work_date || ' ' || detail, '; '), '') FROM rota_conflicts) AS rota_detail,
        (SELECT to_json(coalesce(list(employee || '|' || rule), [])) FROM breaches)::VARCHAR AS keys,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref, ', ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.check.outputs | last).row | toJson }}"

  - id: log_check
    type: io.kestra.plugin.core.log.Log
    message: |
      Working time, week ending {{ inputs.week_ending }} ({{ inputs.scenario }}): {{ outputs.result.values.r | jq('"\(.breaches) breaches. \(.breach_detail)"') | first }}
      {{ outputs.result.values.r | jq('if .opted_out_over == "" then "" else "Over 48 h with an opt-out on file: \(.opted_out_over)" end') | first }}
      {{ outputs.result.values.r | jq('if .to_hr == "" then "" else "To HR, repeated breaches: \(.to_hr)" end') | first }}
      {{ outputs.result.values.r | jq('"Next week rota conflicts: \(.rota_conflicts). \(.rota_detail)"') | first }}
      Blockers: {{ outputs.result.values.r | jq('.blockers') | first }} {{ outputs.result.values.r | jq('.blocker_detail') | first }}

  - id: evidence_blockers
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.check.outputFiles.blockers }}"

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.blockers > 0') | first }}"
    then:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Working time check stopped, fix the time data: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/breaches.csv": "{{ outputs.check.outputFiles.breaches }}"
      "{{ render(vars.pack_dir) }}/employees.csv": "{{ outputs.check.outputFiles.employees }}"
      "{{ render(vars.pack_dir) }}/rota-conflicts.csv": "{{ outputs.check.outputFiles.rota_conflicts }}"

  - id: save
    type: io.kestra.plugin.core.kv.Set
    key: "{{ vars.state_key }}"
    kvType: JSON
    value: >-
      {{ {'old': (kv(vars.state_key, errorOnMissing=false) ?? {'weeks': {}}), 'wk': inputs.week_ending, 'keys': fromJson(fromJson(outputs.result.values.r).keys)}
         | jq('{weeks: (.old.weeks + {(.wk): {breaches: .keys}})}') | first | toJson }}

  - id: rota_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.rota_conflicts > 0') | first }}"
    then:
      - id: rota_not_publishable
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Next week's rota breaks the daily rest rule: {{ outputs.result.values.r | jq('.rota_detail') | first }}. Fix it before publishing."

triggers:
  - id: monday
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"
    disabled: true
    inputs:
      week_ending: "{{ trigger.date | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd') }}"

extend:
  title: Check timesheets against working time rules every week and block a rota that breaks them
  metaTitle: Working time compliance check, rest periods and 48-hour week with Kestra and DuckDB
  shortDescription: Flag short daily and weekly rest, missing breaks, long night shifts and 48-hour averages over the reference period from clock-in data, escalate repeat breaches to HR and stop a rota that breaks the rules.
  metaDescription: Working time compliance in Kestra and DuckDB. 11-hour rest, weekly rest, breaks, night work, 48-hour average, opt-outs, HR escalation, rota check.
  description: |
    Working time rules are simple to state and hard to check by hand. Most EU member states transpose the Working Time Directive with the same core limits:
    - 11 hours of rest between shifts;
    - 24 hours of rest every week;
    - a break after 6 hours;
    - no more than 8 hours a night for night workers;
    - no more than 48 hours a week on average over a reference period, unless the worker signed an opt-out.

    Since the CJEU's 2019 CCOO ruling, employers must record working time to show they comply. Breaches are usually found by an inspector or in a tribunal claim, months later. The rota that caused them was published without anyone checking the rest between a late close and an early open.

    This flow checks the past week's actual shifts every Monday, tracks repeat breaches, and checks next week's rota before it is published.

    It runs with no setup and no network. The demo has eight employees and 20 weeks of shifts:
    - an employee doing regular overtime and another doing the same with an opt-out;
    - a late close followed by an early open, and a 10-hour night;
    - a driver who worked seven days in a row with an 11-hour day and no break;
    - next week's rota with the same close-then-open mistake.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Rules

    | Rule | Check |
    |---|---|
    | `DAILY_REST` | Less than 11 hours between the end of one shift and the start of the next |
    | `WEEKLY_REST` | No rest of 24 + 11 hours in the week, counting into the following shift, actual or rota |
    | `BREAK` | A shift over 6 hours with less than 20 minutes of break |
    | `NIGHT_LENGTH` | A night worker working more than 8 hours on a shift |
    | `AVERAGE_48H` | Average over `reference_weeks` (17 by default) above 48 hours, with no opt-out |

    Employees above 48 hours with an opt-out on file are reported, not breached, so HR can check the opt-out is still valid. An employee whose breaches reach 3 in total is escalated to HR.

    ## The rota check

    Next week's scheduled shifts are chained to the last actual shifts. A rota shift starting less than 11 hours after the previous one fails the run with the employee, the date and the rest scheduled, so the rota is fixed before it is published.

    ## How it works

    1. `state` loads the breach counts of earlier weeks.
    2. `check` (`io.kestra.plugin.jdbc.duckdb.Queries`) holds the employees with opt-out and night worker status, the actual shifts and the rota. It checks the data, then runs the rules with window functions over the shifts, the reference period average, the rota chain and the escalation count.
    3. `log_check` prints the breaches, the opt-outs over 48 hours, the HR escalations and the rota conflicts. `evidence_blockers` stores `blockers.csv`.
    4. `gate` stops on blockers before anything else is written: a shift that ends before it starts, a shift for an employee not in the list, a week with no data. Otherwise `evidence` stores `breaches.csv` (per manager), `employees.csv` and `rota-conflicts.csv`.
    5. `save` (`io.kestra.plugin.core.kv.Set`) records the week's breaches. A rerun of the week replaces them.
    6. `rota_gate` fails when next week's rota breaks the daily rest rule.

    ## Tested end to end

    On Kestra 2.0.5 OSS.

    | Run | Week ending | Result |
    |---|---|---|
    | 1 | 2026-09-20 | 1 breach: Ben averages 57.5 hours with no opt-out. Chloe at 57.5 hours is reported, with her opt-out |
    | 2 | 2026-09-27 | Ben again |
    | 3 | 2026-10-04 | 5 breaches: Ben's average, Dev's 9.5-hour night, Femi's 8-hour rest, Hugo's 11-hour day without a break and no weekly rest after 7 days in a row. Ben escalated to HR at 3 breaches. Fails: Gita's rota has 8 hours of rest on Tuesday |
    | 4 | 2026-10-04 again | Same result, Ben still at 3: the week is replaced, not added |
    | 5 | `ISSUES` | Blocked: a shift ending before it starts and an unknown employee |

    I rebuilt the 20 weeks of shifts independently in Python and recomputed the 17-week average and the week's hours for the 8 employees, and the breaches of the week. Every value matches.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `week_ending` | `2026-10-04` | Sunday of the week checked |
    | `reference_weeks` | `17` | Reference period for the 48-hour average |
    | `scenario` | `CLEAN` | Demo only |

    ## Use it with your data

    - Replace `employees` and `shifts` with your time and attendance or rostering system: clock-in and clock-out per shift, the break taken, opt-out and night worker flags, and the published rota.
    - Enable the `monday` trigger, send each manager their part of `breaches.csv`, and run the flow from the rostering tool before a rota is published.
    - Change the limits to your country's rules and collective agreements, which often differ from the directive: young workers, sector derogations, longer reference periods.

    ## Things to know

    - This checks the directive's common limits. It is not legal advice, and national law can be stricter or allow derogations.
    - The 48-hour average excludes leave in some countries and counts it in others. Add leave days to `shifts` if yours counts them.

    ## Links

    - Working Time Directive 2003/88/EC: https://eur-lex.europa.eu/eli/dir/2003/88/oj
    - DuckDB window functions: https://duckdb.org/docs/sql/functions/window_functions
  tags:
    - Business
    - Data
  subTags:
    - Policy & Compliance
    - HR & Ops Automation
  ee: false
  demo: true
