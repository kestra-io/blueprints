id: redis-keyspace-eviction-pressure-sentinel
namespace: company.sentinel
description: Audits Redis memory info and keyspace stats via redis-cli to detect volatile/allkeys
  eviction churn and rapid memory saturation.
inputs:
- id: redis_host
  type: STRING
  defaults: redis.internal
- id: redis_port
  type: INT
  defaults: 6379
- id: max_evicted_keys_rate_threshold
  type: INT
  defaults: 100
tasks:
- id: audit_redis
  type: io.kestra.plugin.scripts.python.Script
  containerImage: python:3.12-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
    - pip install redis kestra
  env:
    REDIS_HOST: "{{ inputs.redis_host }}"
    REDIS_PORT: "{{ inputs.redis_port }}"
    REDIS_PASSWORD: "{{ secret('REDIS_PASSWORD') }}"
  script: |
    import os
    import sys
    import redis
    from kestra import Kestra

    host = os.environ.get("REDIS_HOST", "redis.internal")
    port = int(os.environ.get("REDIS_PORT", "6379"))
    password = os.environ.get("REDIS_PASSWORD") or None

    try:
        r = redis.Redis(host=host, port=port, password=password, socket_connect_timeout=10, socket_timeout=10)
        stats = r.info("stats")
        memory = r.info("memory")
    except Exception as e:
        print(f"Error querying Redis at {host}:{port}: {e}", file=sys.stderr)
        sys.exit(1)

    evicted = int(stats.get("evicted_keys", 0))
    used_human = str(memory.get("used_memory_human", "unknown"))
    peak_human = str(memory.get("used_memory_peak_human", "unknown"))

    print(f"Redis health: evicted_keys={evicted}, used_memory={used_human}, peak_memory={peak_human}")
    Kestra.outputs({
        "evicted_keys": evicted,
        "used_memory": used_human,
        "peak_memory": peak_human
    })
- id: evaluate_and_alert
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.audit_redis.vars.evicted_keys > inputs.max_evicted_keys_rate_threshold }}'
  then:
  - id: notify_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: ':warning: *Redis High Keyspace Eviction Churn*\n*Host:* {{ inputs.redis_host }}:{{ inputs.redis_port }}\n*Total Evicted Keys:* {{ outputs.audit_redis.vars.evicted_keys }}\n*Used Memory:* {{ outputs.audit_redis.vars.used_memory }}\n*Peak Memory:* {{ outputs.audit_redis.vars.peak_memory }}\n*Recommendation:* Expand maxmemory policy or provision additional cache cluster nodes.'
errors:
- id: handle_inspection_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: ':rotating_light: *Execution Failure: Redis Keyspace Memory Eviction Pressure
    Sentinel*\n*Execution ID:* `{ execution.id }`\n*State:* `{ execution.state.current
    }`\n*Error:* Sentinel inspection encountered an unhandled execution error.'
triggers:
- id: scheduled_monitor
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
outputs:
  - id: evicted_keys
    type: INT
    value: "{{ outputs.audit_redis.vars.evicted_keys }}"
  - id: used_memory
    type: STRING
    value: "{{ outputs.audit_redis.vars.used_memory }}"
  - id: peak_memory
    type: STRING
    value: "{{ outputs.audit_redis.vars.peak_memory }}"

extend:
  metaDescription: "Audits Redis memory info and keyspace stats via redis-cli to detect volatile/allkeys eviction churn and rapid memory saturation."
  metaTitle: Redis Keyspace Memory Eviction Pressure Sentinel with Kestra
  title: Redis Keyspace Memory Eviction Pressure Sentinel
  shortDescription: Audits Redis memory info and keyspace stats via redis-cli to detect
    volatile/allkeys eviction churn and rapid memory saturation.
  description: '## How it works

