id: quickwit-error-surge-and-incident-triage-sentinel
namespace: company.platform

inputs:
  - id: quickwit_url
    type: STRING
    displayName: Quickwit Cluster URL
    description: Base HTTP URL of the Quickwit cluster (e.g., http://quickwit:7280).
    defaults: "http://localhost:7280"

  - id: index_id
    type: STRING
    displayName: Log Index ID
    description: Target Quickwit index storing application logs and distributed traces.
    defaults: "app-logs"

  - id: surge_threshold
    type: INT
    displayName: Error Surge Threshold
    description: Delivered error count in a single polling interval required to classify the burst as CRITICAL_SURGE.
    defaults: 10

  - id: enforce_incident_gate
    type: BOOL
    displayName: Enforce Incident Gate
    description: When true, fails the execution on critical error surge to trigger on-call alert escalation and SLA tracking.
    defaults: true

triggers:
  - id: on_error_log_burst
    type: io.kestra.plugin.quickwit.search.Trigger
    url: "{{ secret('QUICKWIT_URL') }}"
    index: "app-logs"
    query: "severity:ERROR OR status:[500 TO 599]"
    timestampField: "timestamp"
    interval: "PT1M"

tasks:
  - id: sample_and_aggregate_errors
    type: io.kestra.plugin.core.output.OutputValues
    description: Extracts error event volume, sample messages, and impacted service metadata from the delivered trigger batch.
    values:
      error_count: "{{ trigger.numHits is defined ? trigger.numHits : (trigger.documents is defined ? (trigger.documents | length) : 1) }}"
      elapsed_time_micros: "{{ trigger.elapsedTimeMicros ?? 0 }}"
      watermark: "{{ trigger.watermark ?? 0 }}"
      sample_error_message: "{{ trigger.documents is defined and (trigger.documents | length) > 0 ? (trigger.documents[0].message ?? 'Unspecified error payload') : 'No payload details' }}"

  - id: query_cluster_context
    type: io.kestra.plugin.quickwit.search.Search
    description: Queries the Quickwit cluster for baseline error volume over the past 15 minutes to calculate surge magnitude.
    url: "{{ secret('QUICKWIT_URL') }}"
    index: "{{ inputs.index_id }}"
    query: "severity:ERROR"
    startTimestamp: "{{ now() | dateAdd(-15, 'MINUTES') | timestamp }}"
    maxHits: 100
    fetchType: FETCH
    allowFailure: true

  - id: evaluate_surge_severity
    type: io.kestra.plugin.core.output.OutputValues
    description: Evaluates error volume against surge thresholds to classify incident severity.
    values:
      baseline_15m_errors: "{{ outputs.query_cluster_context.size ?? 0 }}"
      severity: "{{ (outputs.sample_and_aggregate_errors.values.error_count | int) >= inputs.surge_threshold ? 'CRITICAL_SURGE' : 'WARNING_ANOMALY' }}"

  - id: route_incident_triage
    type: io.kestra.plugin.core.flow.If
    description: Branches on severity classification to dispatch high-priority incident alerts or record audit log.
    condition: "{{ outputs.evaluate_surge_severity.values.severity == 'CRITICAL_SURGE' }}"
    then:
      - id: alert_error_surge
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts platform SREs and on-call engineers of an active critical error burst.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "attachments": [
              {
                "color": "#E53935",
                "title": "[ALERT] Quickwit Log Error Surge Detected",
                "text": "High-volume application error surge detected in Quickwit index `{{ inputs.index_id }}`.\n*Recent Errors in Window:* {{ outputs.sample_and_aggregate_errors.values.error_count }}\n*Surge Threshold:* {{ inputs.surge_threshold }}\n*15-Minute Baseline:* {{ outputs.evaluate_surge_severity.values.baseline_15m_errors }}\n*Severity:* `{{ outputs.evaluate_surge_severity.values.severity }}`\n*Sample Message:* `{{ outputs.sample_and_aggregate_errors.values.sample_error_message }}`\n*Watermark:* {{ outputs.sample_and_aggregate_errors.values.watermark }}\nInvestigate upstream service deployments, database connection pools, and downstream dependency health.",
                "footer": "Kestra Sentinel | Quickwit Incident Sentinel"
              }
            ]
          }

      - id: gate_enforcement
        type: io.kestra.plugin.core.flow.If
        description: Fails the execution when enforce_incident_gate is enabled to update on-call SLA trackers.
        condition: "{{ inputs.enforce_incident_gate }}"
        then:
          - id: fail_on_surge
            type: io.kestra.plugin.core.execution.Fail
            description: Marks execution failed to record incident breach in deployment metrics.

    else:
      - id: log_moderate_anomaly
        type: io.kestra.plugin.core.log.Log
        description: Records an operational audit log for sub-critical error anomalies.
        message: "[INFO] Quickwit error anomaly evaluated. Delivered errors: {{ outputs.sample_and_aggregate_errors.values.error_count }}, 15m baseline: {{ outputs.evaluate_surge_severity.values.baseline_15m_errors }}. Sub-threshold anomaly; no escalation required."

extend:
  title: Quickwit Error Surge and Incident Triage Sentinel
  metaTitle: Quickwit Error Surge and Incident Triage Sentinel | Kestra
  shortDescription: Listens for log error bursts in Quickwit indexes using event-driven search triggers, audits 15-minute baselines, and alerts SREs on critical surges.
  metaDescription: Monitor Quickwit log indexes with event-driven search triggers, detect sudden application error bursts, and alert Slack to escalate production incidents.
  description: |
    Detect sudden application error surges and distributed service degradation in real time using event-driven Quickwit search triggers, evaluate historical baselines, and dispatch high-priority incident triage alerts before outages escalate.

    Modern microservice architectures generate millions of log lines per minute. When upstream services degrade, downstream databases stall, or bad deployments roll out, error logs flood indexing pipelines. Polling on a fixed schedule can delay incident response by 10 to 15 minutes. This blueprint leverages Kestra's event-driven `io.kestra.plugin.quickwit.search.Trigger` to poll the Quickwit log index continuously. It maintains an automated watermark in Kestra KV storage so duplicate errors are never re-evaluated, queries baseline error volume via `io.kestra.plugin.quickwit.search.Search`, extracts representative stack traces, and pages on-call SREs the moment error thresholds breach.

    ## How it works

    1. `on_error_log_burst` (`io.kestra.plugin.quickwit.search.Trigger`) polls the target Quickwit index every 60 seconds for documents matching `severity:ERROR OR status:[500 TO 599]`, advancing the watermark to prevent duplicate notifications.
    2. `sample_and_aggregate_errors` (`io.kestra.plugin.core.output.OutputValues`) extracts error counts, execution microsecond durations, and sample message payloads from `trigger.documents`.
    3. `query_cluster_context` (`io.kestra.plugin.quickwit.search.Search`) queries the Quickwit cluster across a 15-minute lookback window to determine background error baseline rates.
    4. `evaluate_surge_severity` (`io.kestra.plugin.core.output.OutputValues`) classifies the event as `CRITICAL_SURGE` or `WARNING_ANOMALY` based on the configured `surge_threshold`.
    5. `route_incident_triage` (`io.kestra.plugin.core.flow.If`) routes execution flow:
       - If a critical surge is identified, `alert_error_surge` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a detailed diagnostic alert to Slack with sample messages and baselines, and `fail_on_surge` (`io.kestra.plugin.core.execution.Fail`) flags the incident for SLA tracking.
       - If the surge is sub-threshold, `log_moderate_anomaly` (`io.kestra.plugin.core.log.Log`) writes an audit receipt to execution logs.

    ## What you get

    - Event-driven incident detection powered by native Quickwit index polling with automated watermark state management.
    - Contextual incident triage comparing instantaneous error spikes against historical 15-minute baselines.
    - Automated Slack alerting enriched with exact index names, error counts, timestamps, and representative error payloads.
    - Strict operational gate keeping production teams aware of rapid service failure cascades.

    ## Who it's for

    - Site Reliability Engineers (SREs) and platform teams monitoring cloud-native microservice health.
    - DevOps engineers operating Quickwit on object storage (Amazon S3, MinIO, Google Cloud Storage).
    - Incident commanders triaging production deployment regressions and distributed tracing anomalies.

    ## Why orchestrate this with Kestra

    - **Native Trigger Watermarking**: The Quickwit search trigger automatically tracks high-water mark timestamps in Kestra KV storage, eliminating complex state-tracking boilerplate.
    - **Combined Search & Ingestion**: Seamlessly combine native search queries with downstream alerting, incident webhook dispatch, or automated rollbacks.
    - **Low-Latency Incident Gating**: Eliminates long polling delays by reacting within 60 seconds of error log indexing.
    - **Zero Data Loss Observability**: Complete execution history, query latencies, and payload captures are stored in Kestra audit logs.

    ## Prerequisites

    - A running Quickwit cluster reachable via HTTP, deployable locally via Docker:
      ```bash
      docker run --rm -p 7280:7280 quickwit/quickwit:latest run
      ```
    - A Quickwit index (e.g., `app-logs`) configured with a `timestamp` field.
    - A Slack incoming webhook URL for incident notifications.

    ### Secrets

    - `QUICKWIT_URL`: The base HTTP endpoint of the Quickwit cluster (e.g., `http://quickwit:7280` or `https://quickwit.internal:7280`).
    - `SLACK_WEBHOOK_URL`: The Slack incoming webhook URL for incident response alerting.

    ## Quick start

    1. Deploy Quickwit locally using the official `quickwit/quickwit:latest` Docker image.
    2. Configure namespace secrets `QUICKWIT_URL` and `SLACK_WEBHOOK_URL` in your Kestra namespace.
    3. Import this blueprint into your Kestra instance under namespace `company.platform`.
    4. Trigger a manual test run or ingest sample error logs into Quickwit to verify trigger execution and Slack alerting.

    ## How to extend

    - **Automated Deployment Rollback**: Chain an `io.kestra.plugin.kubernetes.kubectl.RolloutUndo` task to automatically roll back bad Kubernetes deployments when error surges exceed critical thresholds.
    - **PagerDuty Escalation**: Replace or augment the Slack notification with `io.kestra.plugin.pagerduty.PagerDutyAlert` to trigger high-urgency on-call phone paging during off-hours.
    - **Multi-Service Filtering**: Customize the trigger query to target specific critical payment, checkout, or auth microservices.

    ## Links

    - [Kestra Quickwit Plugin Documentation](https://kestra.io/plugins/plugin-quickwit)
    - [Quickwit Search Trigger Reference](https://kestra.io/plugins/plugin-quickwit/search/io.kestra.plugin.quickwit.search.trigger)
    - [Quickwit Official Documentation](https://quickwit.io/docs/)
