id: panelapp-gene-panel-rating-change-watch
namespace: company.team

description: |
  Watch the Genomics England PanelApp panels your lab tests against. Each run compares panel versions in the
  public index, downloads only the panels that moved, diffs gene, STR and region ratings against a KV snapshot
  with DuckDB and alerts in Slack on promotions to and demotions from green (diagnostic-grade).

inputs:
  - id: panel_ids
    type: STRING
    defaults: "245,483,488,1207"
    description: PanelApp panel ids, comma-separated. Defaults are Adult solid tumours cancer susceptibility (245), Pituitary hormone deficiency (483), the Hereditary ataxia childhood-onset super panel (488) and Acute intermittent porphyria (1207).

  - id: green_boundary_only
    type: BOOL
    defaults: true
    description: Alert only on changes that move an entity into or out of green (plus mode-of-inheritance changes on green entities). Set to false to alert on every rating change, including red to amber.

triggers:
  - id: daily_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"
    description: Curators update panels most working days; a morning check reaches the lab before reporting starts.

tasks:
  - id: index_page_one
    type: io.kestra.plugin.core.http.Download
    description: First page of the public panel index (100 panels per page); its `count` sizes the loop over the other pages.
    uri: https://panelapp.genomicsengland.co.uk/api/v1/panels/?page=1
    headers:
      User-Agent: "kestra-panelapp-gene-panel-rating-change-watch/1.0 (https://kestra.io)"
    options:
      retryOnStatusCodes: [429, 500, 502, 503, 504]
      retry:
        type: exponential
        interval: PT5S
        maxInterval: PT1M
        maxAttempts: 4

  - id: index_pages
    type: io.kestra.plugin.core.flow.Loop
    description: The remaining index pages; about five requests give the current version of every public panel.
    values: "{{ range(2, (fromJson(read(outputs.index_page_one.uri)).count + 99) / 100) }}"
    concurrencyLimit: 2
    tasks:
      - id: index_page
        type: io.kestra.plugin.core.http.Download
        uri: "https://panelapp.genomicsengland.co.uk/api/v1/panels/?page={{ item.value }}"
        headers:
          User-Agent: "kestra-panelapp-gene-panel-rating-change-watch/1.0 (https://kestra.io)"
        options:
          retryOnStatusCodes: [429, 500, 502, 503, 504]
          retry:
            type: exponential
            interval: PT5S
            maxInterval: PT1M
            maxAttempts: 4
    outputs:
      - id: uri
        type: STRING
        value: "{{ outputs.index_page.uri }}"

  - id: index_rest
    type: io.kestra.plugin.core.storage.Concat
    files: "{{ outputs.index_pages.outputs | jq('[.[].outputs.uri]') | first }}"
    separator: "\n"
    extension: .json

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    key: panelapp_rating_state
    errorOnMissing: false
    description: JSON array with one row per (panel, entity) from the last run. Missing on the first run, so every panel starts as BASELINE.

  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Joins the watchlist to the index: NOT_FOUND (wrong id, retired or unpublished panel; its old snapshot is kept),
      BASELINE (no snapshot yet), CHANGED (version differs) or UNCHANGED. Only BASELINE and CHANGED panels are downloaded.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      page1.json: "{{ outputs.index_page_one.uri }}"
      rest.json: "{{ outputs.index_rest.uri }}"
      state.json: "{{ outputs.previous_state.value ?? '[]' }}"
    parameters:
      watchlist: "{{ inputs.panel_ids }}"
    sql: |
      CREATE TABLE watchlist AS
      SELECT DISTINCT trim(p) AS raw_id, TRY_CAST(trim(p) AS INTEGER) AS panel_id
      FROM unnest(string_split(:watchlist, ',')) AS t(p) WHERE trim(p) <> '';

      CREATE TABLE idx AS
      SELECT CAST(r->>'$.id' AS INTEGER) AS panel_id, r->>'$.name' AS name, r->>'$.version' AS version
      FROM (SELECT unnest(from_json(json->'$.results', '["JSON"]')) AS r
            FROM read_json_objects(['page1.json', 'rest.json'], format = 'newline_delimited'));

      CREATE TABLE state AS
      SELECT DISTINCT CAST(s->>'$.panel_id' AS INTEGER) AS panel_id, s->>'$.version' AS version
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('state.json'));

      CREATE TABLE panels AS
      SELECT w.raw_id, w.panel_id, i.name, i.version, s.version AS previous_version,
             CASE WHEN w.panel_id IS NULL OR i.panel_id IS NULL THEN 'NOT_FOUND'
                  WHEN s.panel_id IS NULL THEN 'BASELINE'
                  WHEN s.version <> i.version THEN 'CHANGED'
                  ELSE 'UNCHANGED' END AS status
      FROM watchlist w
      LEFT JOIN idx i ON i.panel_id = w.panel_id
      LEFT JOIN state s ON s.panel_id = w.panel_id;

      SELECT
        (SELECT count(*) FROM idx) AS index_panels,
        (SELECT count(*) FROM panels) AS watched,
        (SELECT count(*) FILTER (WHERE status = 'BASELINE') FROM panels) AS baseline,
        (SELECT count(*) FILTER (WHERE status = 'CHANGED') FROM panels) AS changed,
        (SELECT count(*) FILTER (WHERE status = 'UNCHANGED') FROM panels) AS unchanged,
        (SELECT count(*) FILTER (WHERE status = 'NOT_FOUND') FROM panels) AS not_found,
        (SELECT coalesce(string_agg(raw_id, ', '), '') FROM panels WHERE status = 'NOT_FOUND') AS not_found_ids,
        (SELECT coalesce(string_agg(name || ' (' || panel_id || ') v' || version || CASE WHEN status = 'CHANGED' THEN ' was v' || previous_version ELSE '' END || ' ' || status, '; ' ORDER BY name), '') FROM panels WHERE status <> 'NOT_FOUND') AS panel_list,
        (SELECT coalesce(CAST(json_group_array(panel_id) AS VARCHAR), '[]') FROM panels WHERE status IN ('BASELINE', 'CHANGED')) AS to_fetch,
        (SELECT coalesce(CAST(json_group_array(panel_id) AS VARCHAR), '[]') FROM panels WHERE panel_id IS NOT NULL) AS watched_ids;

  - id: fetch_changed_panels
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.plan.outputs[0].row.to_fetch != '[]' }}"
    then:
      - id: panel_details
        type: io.kestra.plugin.core.flow.Loop
        description: One request per new or changed panel; the detail response carries every gene, STR and region with its rating.
        values: "{{ outputs.plan.outputs[0].row.to_fetch }}"
        concurrencyLimit: 1
        tasks:
          - id: panel_detail
            type: io.kestra.plugin.core.http.Download
            uri: "https://panelapp.genomicsengland.co.uk/api/v1/panels/{{ item.value }}/"
            headers:
              User-Agent: "kestra-panelapp-gene-panel-rating-change-watch/1.0 (https://kestra.io)"
            options:
              retryOnStatusCodes: [429, 500, 502, 503, 504]
              retry:
                type: exponential
                interval: PT5S
                maxInterval: PT1M
                maxAttempts: 4
        outputs:
          - id: uri
            type: STRING
            value: "{{ outputs.panel_detail.uri }}"

      - id: details
        type: io.kestra.plugin.core.storage.Concat
        files: "{{ outputs.panel_details.outputs | jq('[.[].outputs.uri]') | first }}"
        separator: "\n"
        extension: .json

  - id: diff
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Flattens genes, STRs and regions. Genes are keyed on the HGNC id so a symbol rename is not reported as a removal
      plus an addition. Super panels list a gene once per component panel, often with different ratings, so each entity
      keeps its highest rating (the one that puts it on the test). Ratings 3-4 are green, 2 amber, 0-1 red.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      details.json: "{{ outputs.details.uri ?? '' }}"
      state.json: "{{ outputs.previous_state.value ?? '[]' }}"
    outputFiles:
      - changes_csv
      - state_json
    parameters:
      green_boundary_only: "{{ inputs.green_boundary_only }}"
      watched_ids: "{{ outputs.plan.outputs[0].row.watched_ids }}"
      execution_url: "{{ kestra.url ?? '' }}/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
    sql: |
      CREATE TABLE prev AS
      SELECT CAST(s->>'$.panel_id' AS INTEGER) AS panel_id, s->>'$.version' AS version, s->>'$.entity_key' AS entity_key,
             s->>'$.entity_type' AS entity_type, s->>'$.entity_name' AS entity_name,
             CAST(s->>'$.confidence' AS INTEGER) AS confidence, s->>'$.moi' AS moi
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('state.json'));

      CREATE TABLE panel AS
      SELECT CAST(json->>'$.id' AS INTEGER) AS panel_id, json->>'$.name' AS name, json->>'$.version' AS version, json AS doc
      FROM read_json_objects('details.json', format = 'newline_delimited', maximum_object_size = 200000000);

      CREATE TABLE cur AS
      SELECT panel_id, version, entity_key, entity_type, arg_max(entity_name, confidence) AS entity_name,
             max(confidence) AS confidence, arg_max(moi, confidence) AS moi
      FROM (
        SELECT p.panel_id, p.version, e->>'$.entity_type' AS entity_type, e->>'$.entity_name' AS entity_name,
               CASE WHEN e->>'$.entity_type' = 'gene' THEN coalesce(e->>'$.gene_data.hgnc_id', e->>'$.entity_name')
                    ELSE e->>'$.entity_type' || '/' || (e->>'$.entity_name') END AS entity_key,
               TRY_CAST(e->>'$.confidence_level' AS INTEGER) AS confidence, coalesce(e->>'$.mode_of_inheritance', '') AS moi
        FROM panel p,
             unnest(from_json(p.doc->'$.genes', '["JSON"]') || from_json(p.doc->'$.strs', '["JSON"]') || from_json(p.doc->'$.regions', '["JSON"]')) AS t(e)
      ) GROUP BY ALL;

      CREATE MACRO colour(c) AS CASE WHEN c IS NULL THEN 'absent' WHEN c >= 3 THEN 'green' WHEN c = 2 THEN 'amber' ELSE 'red' END;

      CREATE TABLE changes AS
      SELECT pn.panel_id, pn.name AS panel_name, pv.version AS from_version, pn.version AS to_version,
             coalesce(c.entity_type, o.entity_type) AS entity_type, coalesce(c.entity_name, o.entity_name) AS entity_name,
             coalesce(c.entity_key, o.entity_key) AS entity_key,
             colour(o.confidence) AS from_rating, colour(c.confidence) AS to_rating,
             CASE WHEN o.entity_key IS NULL THEN 'added' WHEN c.entity_key IS NULL THEN 'removed'
                  WHEN c.confidence > o.confidence THEN 'promoted' WHEN c.confidence < o.confidence THEN 'demoted'
                  ELSE 'moi_changed' END AS change,
             o.moi AS from_moi, c.moi AS to_moi
      FROM (SELECT * FROM cur WHERE panel_id IN (SELECT panel_id FROM prev)) c
      FULL JOIN (SELECT * FROM prev WHERE panel_id IN (SELECT panel_id FROM panel)) o
        ON o.panel_id = c.panel_id AND o.entity_key = c.entity_key
      JOIN panel pn ON pn.panel_id = coalesce(c.panel_id, o.panel_id)
      JOIN (SELECT DISTINCT panel_id, version FROM prev) pv ON pv.panel_id = pn.panel_id
      WHERE o.entity_key IS NULL OR c.entity_key IS NULL OR c.confidence <> o.confidence OR c.moi <> o.moi;

      ALTER TABLE changes ADD COLUMN alert BOOLEAN;
      UPDATE changes SET alert = (NOT CAST(:green_boundary_only AS BOOLEAN))
        OR ((from_rating = 'green') <> (to_rating = 'green'))
        OR (change = 'moi_changed' AND to_rating = 'green');

      COPY (SELECT * EXCLUDE (entity_key) FROM changes ORDER BY panel_name, alert DESC, change, entity_name)
        TO '{{ outputFiles.changes_csv }}' (HEADER, DELIMITER ',');

      COPY (SELECT panel_id, version, entity_key, entity_type, entity_name, confidence, moi FROM cur
            UNION ALL
            SELECT panel_id, version, entity_key, entity_type, entity_name, confidence, moi FROM prev
            WHERE panel_id NOT IN (SELECT panel_id FROM panel)
              AND panel_id IN (SELECT unnest(from_json(:watched_ids, '["INTEGER"]'))))
        TO '{{ outputFiles.state_json }}' (FORMAT JSON, ARRAY true);

      SELECT *, '*' || alerts || ' PanelApp rating change(s) on watched panels*' || chr(10) || alert_text || chr(10) || 'Execution ' || :execution_url AS slack_text
      FROM (SELECT
        (SELECT count(*) FROM panel WHERE panel_id NOT IN (SELECT panel_id FROM prev)) AS baselined_panels,
        (SELECT count(*) FROM cur WHERE panel_id NOT IN (SELECT panel_id FROM prev)) AS baselined_entities,
        (SELECT count(*) FROM changes) AS changes,
        (SELECT count(*) FILTER (WHERE alert) FROM changes) AS alerts,
        (SELECT count(*) FILTER (WHERE change = 'promoted') FROM changes) AS promoted,
        (SELECT count(*) FILTER (WHERE change = 'demoted') FROM changes) AS demoted,
        (SELECT count(*) FILTER (WHERE change = 'added') FROM changes) AS added,
        (SELECT count(*) FILTER (WHERE change = 'removed') FROM changes) AS removed,
        (SELECT count(*) FILTER (WHERE change = 'moi_changed') FROM changes) AS moi_changed,
        (SELECT coalesce(string_agg(panel_name || ' v' || from_version || ' to v' || to_version || ', ' || entity_type || ' ' || entity_name || ' ' || change || ' ' || from_rating || ' to ' || to_rating
                   || CASE WHEN change = 'moi_changed' THEN ' (' || from_moi || ' to ' || to_moi || ')' ELSE '' END, chr(10) ORDER BY panel_name, entity_name), '')
           FROM (SELECT * FROM changes WHERE alert ORDER BY panel_name, entity_name LIMIT 40)) AS alert_text);

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: One row per (panel, entity) for the watched panels; panels that were not re-downloaded keep their rows.
    key: panelapp_rating_state
    value: "{{ read(outputs.diff.outputFiles.state_json) | trim }}"

  - id: alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.diff.outputs[0].row.alerts > 0 }}"
    then:
      - id: log_alerts
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.diff.outputs[0].row.alerts }} PanelApp rating change(s) to review:\n{{ outputs.diff.outputs[0].row.alert_text }}"

      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the check green when the webhook is not configured; the changes are in the WARN log and the CSV.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': outputs.diff.outputs[0].row.slack_text} | toJson }}

  - id: warn_not_found
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.plan.outputs[0].row.not_found > 0 }}"
    level: WARN
    message: "Not in the public PanelApp index (wrong id, retired or unpublished panel): {{ outputs.plan.outputs[0].row.not_found_ids }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Checked {{ outputs.plan.outputs[0].row.watched }} panels against an index of {{ outputs.plan.outputs[0].row.index_panels }}: {{ outputs.plan.outputs[0].row.baseline }} baseline, {{ outputs.plan.outputs[0].row.changed }} changed version, {{ outputs.plan.outputs[0].row.unchanged }} unchanged, {{ outputs.plan.outputs[0].row.not_found }} not found.
      {{ outputs.plan.outputs[0].row.panel_list }}
      Rating changes: {{ outputs.diff.outputs[0].row.changes }} ({{ outputs.diff.outputs[0].row.promoted }} promoted, {{ outputs.diff.outputs[0].row.demoted }} demoted, {{ outputs.diff.outputs[0].row.added }} added, {{ outputs.diff.outputs[0].row.removed }} removed, {{ outputs.diff.outputs[0].row.moi_changed }} inheritance changes), {{ outputs.diff.outputs[0].row.alerts }} alerted. Baselined entities: {{ outputs.diff.outputs[0].row.baselined_entities }}.

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.diff.outputs[0].row }}"
  - id: changes_csv
    type: FILE
    value: "{{ outputs.diff.outputFiles.changes_csv }}"

extend:
  title: Watch Genomics England PanelApp Gene Panels for Green, Amber and Red Rating Changes
  metaTitle: PanelApp Gene Panel Rating Change Watch with DuckDB and Slack | Kestra
  shortDescription: Check the PanelApp panels your lab tests against every day, download only the panels whose version moved, diff gene, STR and region ratings against a KV snapshot and alert in Slack when an entity is promoted to or demoted from green.
  metaDescription: Daily PanelApp check of watched gene panels that diffs green, amber and red ratings against a KV snapshot and alerts on changes at the green boundary.
  description: |
    Diagnostic genomics labs analyse and report only the green (diagnostic-grade) genes of the Genomics England PanelApp panels in their test directory. Curators re-rate genes, STRs and regions most working days. A newly green gene missing from the lab's pipeline means a missed diagnosis; a gene demoted from green may still be reported. This flow checks the watched panels daily, downloads only those whose version moved and alerts on rating changes at the green boundary.

    ## How it works

    1. A daily `Schedule` trigger (07:00 UTC) starts the check on the comma-separated `panel_ids`.
    2. `index_page_one` and the `index_pages` Loop read the public panel index (`/api/v1/panels/`, 100 per page, about five requests).
    3. `previous_state` (KV Get) reads the snapshot from the last run.
    4. `plan` (DuckDB) marks each panel `NOT_FOUND` (wrong id or retired), `BASELINE` (no snapshot), `CHANGED` (new version) or `UNCHANGED`.
    5. `fetch_changed_panels` (If + Loop) downloads only `BASELINE` and `CHANGED` panels from `/api/v1/panels/{id}/`; large panels are several MB.
    6. `diff` (DuckDB) flattens genes, STRs and regions and classifies each difference as `promoted`, `demoted`, `added`, `removed` or `moi_changed`. Genes are keyed on the HGNC id, so a symbol rename is not a removal plus an addition. Super panels list a gene once per component panel, so each entity keeps its highest rating. Ratings 3-4 are green, 2 amber, 0-1 red.
    7. `save_state` (KV Set) stores the new snapshot; `alert` (If) logs the changes at WARN and posts one Slack message.

    ## What you get

    - A changes CSV: panel, versions, entity, rating and inheritance before and after, change type, alert flag.
    - Alerts on entities entering or leaving green and on inheritance changes of green entities; `green_boundary_only: false` alerts on every change.
    - A quiet baseline per panel, and no noise from version bumps that only touch evidence or phenotypes.

    ## Who it's for

    - NHS Genomic Laboratory Hubs and clinical scientists who maintain virtual panels.
    - Bioinformaticians who keep PanelApp-derived gene lists and BED files in sync.

    ## Why orchestrate this with Kestra

    - The version gate, Loop and SQL diff are declarative, with retries on transient API errors.
    - The KV store holds the snapshot, so no database is needed.
    - `allowFailure` on Slack keeps the check green without a webhook; the log and CSV keep the changes.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins.
    - Outbound HTTPS to `panelapp.genomicsengland.co.uk`; no API key.
    - Panels removed from `panel_ids` leave the snapshot; adding one back starts a new baseline.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the alert (optional).

    ## Quick start

    1. Import the flow and click **Execute**: a baseline of the four default panels (691 entities, including the STRs and regions of the ataxia super panel).
    2. Execute again: all panels are `UNCHANGED` and nothing is downloaded.
    3. Add `99999` to `panel_ids` to see the `NOT_FOUND` warning, a wrong or retired id.
    4. Set your own panel ids and `SLACK_WEBHOOK_URL` and enable the schedule.

    ## How to extend

    - Open a Jira ticket per demoted gene for the pipeline owner to sign off.
    - Point the base URL at PanelApp Australia (`panelapp-aus.org`), which runs the same API.

    ## Links

    - [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop) and [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [PanelApp](https://panelapp.genomicsengland.co.uk/) and [PanelApp API docs](https://panelapp.genomicsengland.co.uk/api/docs/)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
