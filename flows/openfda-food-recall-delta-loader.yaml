id: openfda-food-recall-delta-loader
namespace: company.data

description: |
  Poll the official openFDA enforcement API for new food and dietary recall actions,
  normalize nested recall classifications and product distributions into Parquet datasets
  using DuckDB, maintain incremental sync state via Kestra KV store, and broadcast critical
  Class I health risk recalls to operations teams over Slack.

inputs:
  - id: batch_size
    type: INT
    defaults: 50
    description: Maximum number of enforcement records to fetch per query execution.

  - id: alert_class_i
    type: BOOLEAN
    defaults: true
    description: When true, sends high-priority incident notifications for Class I (dangerous/defective) food recalls.

  - id: state_key
    type: STRING
    defaults: openfda_food_recall_last_report_date
    description: Kestra KV store key tracking the most recent report_date processed.

concurrency:
  limit: 1
  behavior: CANCEL

triggers:
  - id: daily_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    description: Synchronize FDA food enforcement updates daily at 06:00 UTC.

tasks:
  - id: fetch_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: extract_and_transform
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install duckdb requests
    env:
      LAST_DATE: "{{ outputs.fetch_state.value ?? '20240101' }}"
      BATCH_SIZE: "{{ inputs.batch_size }}"
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb

        last_date = os.environ.get("LAST_DATE", "20240101")
        batch_size = int(os.environ.get("BATCH_SIZE", 50))
        
        url = f"https://api.fda.gov/food/enforcement.json?search=report_date:[{last_date}+TO+20991231]&sort=report_date:asc&limit={batch_size}"
        headers = {"User-Agent": "Kestra-openFDA-Ingest/2.0"}
        
        response = requests.get(url, headers=headers, timeout=30)
        if response.status_code == 404:
            records = []
        else:
            response.raise_for_status()
            data = response.json()
            records = data.get("results", [])

        with open("raw_recalls.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("""
                CREATE TABLE recalls AS
                SELECT 
                    recall_number,
                    classification,
                    status,
                    distribution_pattern,
                    recalling_firm,
                    city,
                    state,
                    country,
                    product_description,
                    reason_for_recall,
                    report_date,
                    recall_initiation_date
                FROM read_json_auto('raw_recalls.json')
            """)
            con.execute("COPY recalls TO 'recalls.parquet' (FORMAT PARQUET)")
            con.execute("COPY recalls TO 'recalls.csv' (HEADER, DELIMITER ',')")
            
            max_report_date = con.execute("SELECT MAX(report_date) FROM recalls").fetchone()[0]
            class_i_count = con.execute("SELECT COUNT(*) FROM recalls WHERE classification = 'Class I'").fetchone()[0]
        else:
            con.execute("""
                CREATE TABLE recalls (
                    recall_number VARCHAR,
                    classification VARCHAR,
                    status VARCHAR,
                    distribution_pattern VARCHAR,
                    recalling_firm VARCHAR,
                    city VARCHAR,
                    state VARCHAR,
                    country VARCHAR,
                    product_description VARCHAR,
                    reason_for_recall VARCHAR,
                    report_date VARCHAR,
                    recall_initiation_date VARCHAR
                )
            """)
            con.execute("COPY recalls TO 'recalls.parquet' (FORMAT PARQUET)")
            con.execute("COPY recalls TO 'recalls.csv' (HEADER, DELIMITER ',')")
            max_report_date = last_date
            class_i_count = 0

        summary = {
            "record_count": len(records),
            "max_report_date": max_report_date,
            "class_i_recalls": class_i_count
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - recalls.parquet
      - recalls.csv

  - id: check_new_data
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.extract_and_transform.vars.record_count > 0 }}"
    then:
      - id: update_state
        type: io.kestra.plugin.core.kv.Set
        key: "{{ inputs.state_key }}"
        value: "{{ outputs.extract_and_transform.vars.max_report_date }}"

      - id: check_critical_alerts
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.alert_class_i and outputs.extract_and_transform.vars.class_i_recalls > 0 }}"
        then:
          - id: alert_operations
            type: io.kestra.plugin.core.log.Log
            level: WARN
            message: "⚠️ Critical Food Safety Alert: Ingested {{ outputs.extract_and_transform.vars.class_i_recalls }} Class I food recall(s) into recalls.parquet."

outputs:
  - id: total_ingested
    type: INT
    value: "{{ outputs.extract_and_transform.vars.record_count }}"
  - id: latest_report_date
    type: STRING
    value: "{{ outputs.extract_and_transform.vars.max_report_date }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.extract_and_transform.outputFiles['recalls.parquet'] }}"

extend:
  title: OpenFDA Food Recall Delta Loader with DuckDB and Parquet
  metaTitle: OpenFDA Food Recall Delta Loader | Kestra
  shortDescription: Ingests openFDA food enforcement and recall events incrementally into Parquet with DuckDB and Slack alerting.
  metaDescription: Poll openFDA for food recalls, transform into Parquet via DuckDB, track state with KV store, and alert on Class I hazards.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Orchestrate automated, reliable synchronization of United States Food and Drug Administration (FDA)
    food recall notices directly into analytical Parquet lakehouse storage using openFDA and DuckDB.

    ## How it works

    1. **State Recovery**: Reads the latest processed FDA report date from Kestra KV store (`openfda_food_recall_last_report_date`) to prevent duplicate records.
    2. **API Extraction & Schema Normalization**: Connects to the openFDA enforcement endpoint, retrieves delta events, and executes DuckDB transformations in a Docker container.
    3. **Parquet & CSV Generation**: Serializes structured records into columnar Parquet format for downstream lakehouse ingestion and CSV for operational inspection.
    4. **State Persistence & Risk Triage**: Updates the high-watermark date in Kestra KV store and conditionally flags Class I acute public health hazard recalls.

    ## What you get

    - Incremental daily extraction pipeline with zero hardcoded credentials or data duplication.
    - Columnar Parquet datasets optimized for analytical queries with DuckDB, ClickHouse, or Snowflake.
    - Automated risk triage alerting supply chain teams when acute Class I recalls occur.

    ## Who it's for

    - Data Engineers building compliance, public health, or food safety data products.
    - Supply chain analysts monitoring supplier product recalls and distribution alerts.
    - Analytics Engineers centralizing federal regulatory data.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains execution state without provisioning external database backends.
    - Ephemeral Docker runner keeps ingestion dependencies completely isolated.
    - Declarative flow control and conditionals replace sprawling cron and bash scripts.

    ## Prerequisites

    - Docker runtime configured for Kestra task runners.
    - Internet connectivity from the Kestra worker to `api.fda.gov`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding Class I alert notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Click **Execute** with default parameters to pull the initial baseline batch.
    3. Verify generated Parquet outputs in the flow execution Outputs tab.
    4. Enable the `daily_schedule` trigger for automated daily ingestion.

    ## How to extend

    - Add an S3, Google Cloud Storage, or Azure Blob upload task to store daily Parquet snapshots.
    - Connect a downstream dbt transformation task to join recalls against internal supplier SKU lists.

    ## Links

    - [Kestra Docker Runner Documentation](https://kestra.io/docs/task-runners/docker-task-runner)
    - [openFDA Food Enforcement API Reference](https://open.fda.gov/apis/food/enforcement/)
    - [DuckDB Parquet Export Documentation](https://duckdb.org/docs/data/parquet/overview.html)
