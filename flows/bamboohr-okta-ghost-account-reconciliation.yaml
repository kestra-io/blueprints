id: bamboohr-okta-ghost-account-reconciliation
namespace: company.team
description: |
  Diffs BambooHR's employee roster against Okta's active user directory to catch two
  identity/HR drift risks: employees BambooHR has marked Inactive (terminated) whose Okta
  account is still ACTIVE past a grace period (a real security exposure), and ACTIVE Okta
  accounts whose employeeNumber has no match in BambooHR at all (orphaned/un-tracked
  identities). Flags both directions to Slack; does not deactivate anything itself.

triggers:
  - id: daily_reconciliation
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run once a day. Shipped disabled; enable after a manual run confirms both APIs are reachable and employeeNumber is populated consistently on both sides.
    cron: "0 7 * * *"
    disabled: true

inputs:
  - id: bamboohr_company_domain
    type: STRING
    displayName: "BambooHR Company Domain"
    description: The subdomain segment of your BambooHR account, e.g. "acme" for acme.bamboohr.com.
  - id: okta_domain
    type: STRING
    displayName: "Okta Org Domain"
    description: Your Okta org domain, e.g. "acme.okta.com". Used as the base for the Users API.
  - id: grace_period_days
    type: INT
    displayName: "Termination Grace Period (days)"
    defaults: 2
    description: Days after BambooHR's terminationDate before a still-ACTIVE Okta account is flagged as a risk. Covers normal offboarding lag between HR marking someone Inactive and IT deprovisioning Okta; 0 flags immediately.

tasks:
  - id: fetch_bamboohr_employees
    type: io.kestra.plugin.core.http.Request
    description: Requests a custom report covering every employee regardless of status (the default UI/API behavior only returns Active employees, which would hide exactly the terminated-but-still-active-in-Okta case this flow exists to catch - confirmed from BambooHR's own API documentation on the custom reports endpoint).
    uri: "https://api.bamboohr.com/api/gateway.php/{{ inputs.bamboohr_company_domain }}/v1/reports/custom?format=JSON"
    method: POST
    body: |
      {
        "fields": ["employeeNumber", "displayName", "workEmail", "status", "terminationDate"]
      }
    options:
      auth:
        type: BASIC
        username: "{{ secret('BAMBOOHR_API_KEY') }}"
        password: "x"

  - id: fetch_okta_active_users
    type: io.kestra.plugin.scripts.python.Script
    description: Pages through every ACTIVE Okta user via the search filter (Okta's default /users listing silently omits DEPROVISIONED users but not other non-active statuses, so an explicit status filter is used rather than relying on that default), following the Link response header for pagination rather than assuming everything fits on one page.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      OKTA_DOMAIN: "{{ inputs.okta_domain }}"
      OKTA_API_TOKEN: "{{ secret('OKTA_API_TOKEN') }}"
    script: |
      import json
      import os
      import re
      import requests
      from kestra import Kestra

      domain = os.environ["OKTA_DOMAIN"]
      token = os.environ["OKTA_API_TOKEN"]
      headers = {"Authorization": f"SSWS {token}", "Accept": "application/json"}

      url = f"https://{domain}/api/v1/users"
      params = {"search": 'status eq "ACTIVE"', "limit": 200}

      users = []
      while url:
          resp = requests.get(url, headers=headers, params=params, timeout=30)
          resp.raise_for_status()
          users.extend(resp.json())

          next_url = None
          link_header = resp.headers.get("Link", "")
          for part in link_header.split(","):
              match = re.search(r'<([^>]+)>;\s*rel="next"', part.strip())
              if match:
                  next_url = match.group(1)
                  break

          url = next_url
          params = None  # the next_url already carries its own query string

      okta_users = [
          {
              "id": u.get("id"),
              "employeeNumber": (u.get("profile") or {}).get("employeeNumber"),
              "email": (u.get("profile") or {}).get("email"),
              "login": (u.get("profile") or {}).get("login"),
          }
          for u in users
      ]

      Kestra.outputs({
          "okta_active_count": len(okta_users),
          "okta_active_users": okta_users,
      })

  - id: reconcile
    type: io.kestra.plugin.scripts.python.Script
    description: Joins both rosters on employeeNumber. Okta users with no employeeNumber set are excluded from the orphan check (BambooHR does not guarantee employeeNumber is unique/non-empty on the Okta side without a provisioning integration keeping it in sync - see Pitfalls) rather than mass-flagged as false positives.
    inputFiles:
      bamboohr.json: "{{ outputs.fetch_bamboohr_employees.body }}"
      okta.json: "{{ outputs.fetch_okta_active_users.vars.okta_active_users | json }}"
    script: |
      import json
      from datetime import date, datetime, timedelta
      from kestra import Kestra

      with open("bamboohr.json") as f:
          bamboohr_raw = json.load(f)
      with open("okta.json") as f:
          okta_users = json.load(f)

      bamboohr_employees = bamboohr_raw.get("employees", [])
      grace_period_days = {{ inputs.grace_period_days }}
      today = date.today()

      bamboohr_by_number = {
          e["employeeNumber"]: e
          for e in bamboohr_employees
          if e.get("employeeNumber")
      }
      okta_by_number = {
          u["employeeNumber"]: u
          for u in okta_users
          if u.get("employeeNumber")
      }

      terminated_but_active = []
      for number, employee in bamboohr_by_number.items():
          if employee.get("status") != "Inactive":
              continue
          termination_date_str = employee.get("terminationDate")
          if not termination_date_str:
              continue
          termination_date = datetime.strptime(termination_date_str, "%Y-%m-%d").date()
          if today - termination_date < timedelta(days=grace_period_days):
              continue
          okta_match = okta_by_number.get(number)
          if okta_match:
              terminated_but_active.append({
                  "employeeNumber": number,
                  "displayName": employee.get("displayName"),
                  "terminationDate": termination_date_str,
                  "daysSinceTermination": (today - termination_date).days,
                  "oktaLogin": okta_match.get("login"),
                  "oktaId": okta_match.get("id"),
              })

      orphan_in_okta = []
      for number, okta_user in okta_by_number.items():
          if number not in bamboohr_by_number:
              orphan_in_okta.append({
                  "employeeNumber": number,
                  "oktaLogin": okta_user.get("login"),
                  "oktaId": okta_user.get("id"),
              })

      Kestra.outputs({
          "terminated_but_active": terminated_but_active,
          "terminated_but_active_count": len(terminated_but_active),
          "orphan_in_okta": orphan_in_okta,
          "orphan_in_okta_count": len(orphan_in_okta),
          "total_findings": len(terminated_but_active) + len(orphan_in_okta),
      })

  - id: evaluate_findings
    type: io.kestra.plugin.core.flow.If
    description: Alerts Slack only when at least one finding exists in either direction; a clean run logs quietly instead of paging anyone.
    condition: "{{ outputs.reconcile.vars.total_findings > 0 }}"
    then:
      - id: alert_findings
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Names every terminated-but-active and orphaned account so the on-call reader does not have to open BambooHR and Okta separately to act.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "BambooHR ↔ Okta reconciliation: {{ outputs.reconcile.vars.terminated_but_active_count }} terminated-but-active Okta account(s), {{ outputs.reconcile.vars.orphan_in_okta_count }} Okta account(s) with no BambooHR match. Terminated-but-active: {{ outputs.reconcile.vars.terminated_but_active | json }}. Orphaned: {{ outputs.reconcile.vars.orphan_in_okta | json }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_clean_run
        type: io.kestra.plugin.core.log.Log
        message: "Reconciliation clean: 0 terminated-but-active Okta accounts, 0 orphaned Okta accounts."

  - id: log_reconciliation_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status line for every run, independent of which branch fired.
    message: "BambooHR/Okta reconciliation complete. terminated_but_active={{ outputs.reconcile.vars.terminated_but_active_count }}. orphan_in_okta={{ outputs.reconcile.vars.orphan_in_okta_count }}. grace_period_days={{ inputs.grace_period_days }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack separately if the flow itself fails, for example an invalid API token or an unreachable domain, so a broken check never silently reads as "no findings".
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "BambooHR/Okta reconciliation FAILED in execution {{ execution.id }}. The check did not complete; do not trust the last known clean/findings status until this is fixed."
      }

outputs:
  - id: terminated_but_active_count
    type: INT
    value: "{{ outputs.reconcile.vars.terminated_but_active_count }}"
  - id: orphan_in_okta_count
    type: INT
    value: "{{ outputs.reconcile.vars.orphan_in_okta_count }}"

extend:
  title: "BambooHR ↔ Okta Ghost Account Reconciliation"
  shortDescription: Diff BambooHR's terminated employees against Okta's active users to catch deprovisioning gaps and orphaned accounts, and alert Slack.
  metaTitle: BambooHR Okta Ghost Account Reconciliation with Kestra
  metaDescription: "Diff BambooHR terminations against active Okta accounts to catch deprovisioning gaps and orphaned identities, alert Slack."
  description: |
    Offboarding usually has two separate owners: HR marks someone terminated in the HRIS,
    and IT (or an automated SCIM sync, where one exists) deactivates their IdP account. When
    those two steps fall out of sync - a missed ticket, a SCIM integration that silently
    stopped syncing one field, a contractor converted to an employee under a new ID - the
    result is a real, live Okta account nobody in HR believes still exists. This blueprint
    treats BambooHR as the source of truth for "should this person have access at all" and
    Okta as the source of truth for "does this person currently have access", and alerts on
    every mismatch in both directions rather than assuming one system is always right.

    ## How it works

    1. `daily_reconciliation` (`io.kestra.plugin.core.trigger.Schedule`) runs once a day, shipped disabled so a manual run can be verified first.
    2. `fetch_bamboohr_employees` (`io.kestra.plugin.core.http.Request`) requests a custom report with `employeeNumber`, `displayName`, `workEmail`, `status`, and `terminationDate` for every employee regardless of status - confirmed from BambooHR's own API documentation, which states the custom reports endpoint returns both Active and Inactive employees (unlike the default UI/directory view).
    3. `fetch_okta_active_users` (`io.kestra.plugin.scripts.python.Script`) pages through Okta's `/api/v1/users` with `search=status eq "ACTIVE"`, following the `Link` response header for pagination so orgs with more than one page (200 users) of active accounts are not silently under-audited.
    4. `reconcile` (`io.kestra.plugin.scripts.python.Script`) joins both rosters on `employeeNumber` and computes two lists: BambooHR-Inactive employees whose termination is older than `grace_period_days` and who still have a matching ACTIVE Okta account, and ACTIVE Okta accounts whose `employeeNumber` has no match in BambooHR at all.
    5. `evaluate_findings` (`io.kestra.plugin.core.flow.If`) alerts Slack by name and ID for every finding when the combined count is above zero; a clean run logs quietly instead.
    6. `log_reconciliation_complete` always runs last, printing both counts regardless of which branch fired.
    7. The `errors` block alerts Slack separately if the flow itself fails, so an API outage is never mistaken for a clean reconciliation.

    ## What you get

    - A named list of employees BambooHR has marked terminated whose Okta account Okta still reports ACTIVE, past a configurable grace period - the specific, actionable security gap this blueprint exists to catch.
    - A named list of ACTIVE Okta accounts with no matching BambooHR record at all, surfacing contractor, service, or test accounts that were never tracked in the HRIS in the first place.
    - A daily execution history that doubles as an offboarding-process health trend, independent of whichever team (HR, IT, a SCIM integration) actually failed to act.

    ## Who it's for

    - Security and IT teams responsible for closing the gap between "HR says this person left" and "the IdP agrees", without manually cross-referencing two consoles.
    - Platform teams who do not yet have (or do not fully trust) an automated HRIS-to-IdP provisioning sync and need a standing check that catches when it drifts or was never wired up for a given field.
    - Compliance teams that need evidence of a recurring access-review process between HR and IAM systems, not a one-time manual audit.

    ## Why orchestrate this with Kestra

    Neither BambooHR nor Okta is aware of the other, and there is no built-in alert for "terminated here, still active there." A cron job calling both APIs ad hoc has no retry handling, no execution history, and nowhere to safely branch on "clean" versus "findings". Kestra supplies the schedule, the pagination-aware fetch, the join logic as a tracked execution, and a visible run history showing exactly when a deprovisioning gap first appeared.

    ## Prerequisites

    - A BambooHR account with API access and a custom report covering `employeeNumber`, `status`, and `terminationDate` for all employees (Active and Inactive).
    - An Okta org with an API token that has read access to `/api/v1/users`, and `employeeNumber` populated in the Okta user profile for every employee this flow should match - see Pitfalls.
    - A Slack incoming webhook for alerts.

    ### Secrets

    - `BAMBOOHR_API_KEY`: BambooHR API key used by `fetch_bamboohr_employees` as the HTTP Basic username (BambooHR ignores the password field; it is sent as the literal string `x` per BambooHR's own authentication documentation).
    - `OKTA_API_TOKEN`: Okta API token used by `fetch_okta_active_users`, sent as `Authorization: SSWS {token}` per Okta's own documented authentication scheme (not a Bearer token).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_findings` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_OKTA_API_TOKEN=$(echo -n '<your-token>' | base64)`.

    ### Inputs

    - `bamboohr_company_domain` (STRING, no default): the subdomain segment of your BambooHR account.
    - `okta_domain` (STRING, no default): your Okta org domain.
    - `grace_period_days` (INT, default `2`): days after BambooHR's `terminationDate` before a still-ACTIVE Okta account is flagged.

    ### Outputs

    - `outputs.terminated_but_active_count` / `outputs.orphan_in_okta_count`: the two headline numbers for every run.
    - `outputs.reconcile.vars.terminated_but_active` / `.orphan_in_okta`: the full named lists behind those counts.

    ## Quick start

    1. Point `bamboohr_company_domain` and `okta_domain` at real test/sandbox accounts if available, or a low-risk production read-only check.
    2. Add the `BAMBOOHR_API_KEY`, `OKTA_API_TOKEN`, and `SLACK_WEBHOOK_URL` secrets.
    3. In BambooHR, confirm at least one employee has `status` Inactive with a `terminationDate` older than `grace_period_days`, and leave the matching Okta account ACTIVE for this test.
    4. Run the flow manually and confirm `alert_findings` names that employee under `terminated_but_active`.
    5. Deactivate that Okta account and re-run; confirm `log_clean_run` now fires instead (assuming no other real findings exist).
    6. Enable `daily_reconciliation` once you trust the check.

    ## How to extend

    - Add a third direction: BambooHR-Active employees with no Okta account at all, to catch new hires IT has not yet provisioned - a missing-provisioning gap rather than a missing-deprovisioning one.
    - If your org runs a SCIM or other automated sync between BambooHR and Okta, pipe `orphan_in_okta` into a ticketing system task instead of (or alongside) the Slack alert, so each finding becomes a tracked remediation item rather than a message that can be missed.
    - Join on `workEmail`/`profile.email` as a fallback when `employeeNumber` is unset on either side, since not every org's Okta provisioning keeps that field populated - see Pitfalls.

    ## Pitfalls

    - **This blueprint never deactivates anything itself.** It only reads from both APIs and alerts; closing a finding (deactivating the Okta account, or backfilling `employeeNumber`) is a deliberate separate action outside this flow.
    - **The join key is `employeeNumber`, and it is not guaranteed to be populated on the Okta side.** BambooHR always has it, but Okta's `profile.employeeNumber` is only set if something (a SCIM sync, a manual admin process) put it there. Okta accounts with no `employeeNumber` set are silently excluded from the orphan check rather than mass-flagged, which means an org with no automated sync keeping that field in sync will under-report orphans, not over-report them - see How to extend for a `workEmail` fallback.
    - **Okta's default `/users` listing silently omits `DEPROVISIONED` users but returns every other status**, per Okta's own API documentation; this blueprint uses an explicit `search=status eq "ACTIVE"` filter rather than relying on that default, so `PROVISIONED`, `STAGED`, `SUSPENDED`, etc. accounts are correctly excluded from the active count.
    - **BambooHR's custom reports endpoint returns employees regardless of status** - confirmed from BambooHR's own API documentation - which is the entire reason this flow uses it instead of the employee directory endpoint (`/v1/employees/directory`), which only returns Active employees by default and would make the terminated-but-active check impossible.
    - **`grace_period_days` compares against `terminationDate`, not against when BambooHR's `status` field actually flipped to Inactive.** If HR backdates a termination date after the fact, the grace period is measured from that backdated date, not from today.

    ## Links

    - [BambooHR API documentation](https://documentation.bamboohr.com/docs)
    - [Okta Users API documentation](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/User/)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Business
  subTags:
    - Policy & Compliance
  ee: false
  demo: false
