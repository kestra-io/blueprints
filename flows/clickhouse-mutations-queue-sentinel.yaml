id: clickhouse-mutations-queue-sentinel
namespace: company.team

inputs:
  - id: clickhouse_host
    type: STRING
    defaults: clickhouse.internal
    description: Hostname of the ClickHouse server.
  - id: clickhouse_http_port
    type: INT
    defaults: 8123
    description: ClickHouse HTTP interface port.
  - id: clickhouse_user
    type: STRING
    defaults: default
    description: ClickHouse database user.
  - id: max_unfinished_mutations_threshold
    type: INT
    defaults: 5
    description: Maximum permissible active mutations before alerting.

tasks:
  - id: query_system_mutations
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        set -euo pipefail
        python3 -c "
        import requests, json, sys

        host = '{{ inputs.clickhouse_host }}'
        port = {{ inputs.clickhouse_http_port }}
        user = '{{ inputs.clickhouse_user }}'
        pwd = '{{ secret('CLICKHOUSE_PASSWORD') }}'
        query = \"SELECT count() as unfinished, max(dateDiff('minute', create_time, now())) as max_duration_mins FROM system.mutations WHERE is_done = 0 FORMAT JSON\"

        try:
            resp = requests.get(f'http://{host}:{port}/', params={'query': query}, auth=(user, pwd), timeout=15)
            resp.raise_for_status()
            data = resp.json().get('data', [{}])[0]
            unfinished = int(data.get('unfinished', 0))
            max_mins = int(data.get('max_duration_mins', 0))
            result = {
                'unfinished_mutations': unfinished,
                'max_duration_minutes': max_mins,
                'alert_triggered': unfinished > {{ inputs.max_unfinished_mutations_threshold }}
            }
            with open('mutations_summary.json', 'w') as out:
                json.dump(result, out)
            print('ClickHouse mutations audit:', result)
        except Exception as err:
            sys.stderr.write(f'ClickHouse mutations query error: {err}\n')
            sys.exit(1)
        "
    outputFiles:
      - mutations_summary.json

  - id: evaluate_mutations_backlog
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.query_system_mutations.outputFiles['mutations_summary.json'])).alert_triggered }}"
    then:
      - id: alert_data_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *ClickHouse Mutations Alert*: Detected {{ fromJson(read(outputs.query_system_mutations.outputFiles['mutations_summary.json'])).unfinished_mutations }} active unfinished table mutations on {{ inputs.clickhouse_host }} (oldest running for {{ fromJson(read(outputs.query_system_mutations.outputFiles['mutations_summary.json'])).max_duration_minutes }} minutes)."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *ClickHouse Sentinel Execution Failure*: Failed to query system.mutations on {{ inputs.clickhouse_host }}."
      }

triggers:
  - id: scheduled_mutations_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits ClickHouse system.mutations to detect accumulated or blocked table mutations impacting analytical query performance."
  metaTitle: ClickHouse Mutations Queue Delay and Stuck Operation Sentinel with Kestra
  title: ClickHouse Mutations Queue Delay and Stuck Operation Sentinel
  shortDescription: Audits ClickHouse system.mutations to detect accumulated or blocked table mutations impacting analytical query performance.
  description: |
    ## How it works
    This sentinel queries the ClickHouse `system.mutations` table via `clickhouse-client` to evaluate unfinished lightweight deletes and updates. It tracks the total backlog count and execution duration, alerting analytical data teams when mutations stall or consume background merge thread pools.

    ## What you get
    - Continuous validation of asynchronous mutation progress.
    - Early warning against partition write lock contention and merge stalls.
    - Automated Slack incident delivery indicating unfinished mutation counts and duration in minutes.

    ## Who it's for
    - Analytical database administrators and data platform engineers operating ClickHouse.
    - SREs supervising analytical warehouse query performance.

    ## Why orchestrate this with Kestra
    Kestra automates distributed data platform observability, running scheduled health checks with fine-grained error management and notification routing.

    ## Prerequisites
    - ClickHouse native port accessibility (default 9000).
    - Secrets `CLICKHOUSE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure host, port, and credentials.
    3. Run manually to check current mutation queue depth.

    ## How to extend
    - Query `system.merges` to inspect concurrent part merge operations.
    - Kill stuck mutations automatically via `KILL MUTATION` in a remediation flow.
    - Export mutation duration metrics to Prometheus.

    ## Links
    - [ClickHouse System Mutations Documentation](https://clickhouse.com/docs/en/operations/system-tables/mutations)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
