id: github-repository-missing-security-md-sentinel
namespace: company.team
description: Audits GitHub community profiles to detect repositories missing standardized SECURITY.md vulnerability disclosure policies.

inputs:
  - id: github_org
    type: STRING
    description: GitHub organization name.
    defaults: kestra-io

  - id: github_repo
    type: STRING
    description: GitHub repository name.
    defaults: kestra

tasks:
  - id: audit_security_policy
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    description: Query GitHub Community Profile API to check for SECURITY.md policy
    env:
      GITHUB_TOKEN: "{{ secret('GITHUB_TOKEN') }}"
      GITHUB_ORG: "{{ inputs.github_org }}"
      GITHUB_REPO: "{{ inputs.github_repo }}"
    script: |
      import os
      import sys
      import json
      import urllib.request
      import urllib.error
      from kestra import Kestra

      org = os.environ.get("GITHUB_ORG")
      repo = os.environ.get("GITHUB_REPO")
      token = os.environ.get("GITHUB_TOKEN")

      if not org or not repo:
          print("ERROR: github_org and github_repo must be provided", file=sys.stderr)
          sys.exit(1)

      url = f"https://api.github.com/repos/{org}/{repo}/community/profile"
      headers = {
          "Accept": "application/vnd.github+json",
          "User-Agent": "Kestra-Security-Sentinel"
      }
      if token:
          headers["Authorization"] = f"Bearer {token}"

      req = urllib.request.Request(url, headers=headers)
      security_md_exists = False

      try:
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.loads(resp.read().decode("utf-8"))
              files = data.get("files", {})
              security_advisory = files.get("security_advisory")
              security_md_exists = bool(security_advisory is not None)
      except urllib.error.HTTPError as e:
          if e.code == 404:
              print(f"Repository {org}/{repo} community profile returned 404", file=sys.stderr)
              security_md_exists = False
          else:
              print(f"HTTP error querying community profile: {e.code} {e.reason}", file=sys.stderr)
              sys.exit(1)
      except Exception as e:
          print(f"Unexpected error querying community profile: {e}", file=sys.stderr)
          sys.exit(1)

      Kestra.outputs({
          "security_md_exists": security_md_exists,
          "repository": f"{org}/{repo}"
      })

  - id: evaluate_security_compliance
    type: io.kestra.plugin.core.flow.If
    description: Notify AppSec team if repository lacks SECURITY.md policy
    condition: "{{ outputs.audit_security_policy.vars.security_md_exists == false }}"
    then:
      - id: notify_appsec_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#sec-ops-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ GitHub Repository Missing SECURITY.md Policy Alert",
                "text": "Repository `{{ inputs.github_org }}/{{ inputs.github_repo }}` is missing a standardized `SECURITY.md` vulnerability reporting policy. Impact: External security researchers and internal auditors have no established channel to report responsible vulnerability disclosures.",
                "footer": "Kestra Security Governance • GitHub Community Standards"
              }
            ]
          }

outputs:
  - id: security_md_exists
    type: BOOLEAN
    value: "{{ outputs.audit_security_policy.vars.security_md_exists }}"
  - id: repository
    type: STRING
    value: "{{ outputs.audit_security_policy.vars.repository }}"

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * 1"
    disabled: true

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#sec-ops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ GitHub Security MD Sentinel Failed",
            "text": "The GitHub community profile audit query failed on execution `{{ execution.id }}`. Please verify repository existence and GITHUB_TOKEN scope.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

extend:
  metaDescription: Audits GitHub community profiles to detect repositories missing standardized SECURITY.md vulnerability disclosure policies.
  metaTitle: GitHub Repository SECURITY.md Compliance and Responsible Disclosure Sentinel with Kestra
  title: GitHub Repository SECURITY.md Compliance and Responsible Disclosure Sentinel
  shortDescription: Audits GitHub community profiles to detect repositories missing standardized SECURITY.md vulnerability disclosure policies.
  description: |
    ## How it works
    This workflow connects to the GitHub Community Profile API (`/repos/{owner}/{repo}/community/profile`) to audit the presence of standard open-source and corporate health files, specifically `SECURITY.md`. Open repositories lacking a formal vulnerability disclosure policy leave engineers vulnerable to public issue disclosures rather than coordinated confidential triage. When a policy is missing, an alert is sent to AppSec teams.

    ## What you get
    - Proactive organization-wide compliance with software supply-chain security baselines (OpenSSF, SOC2).
    - Prevents public zero-day disclosures on GitHub public issues.
    - Ensures clear vulnerability reporting channels and contact emails exist across all projects.

    ## Who it's for
    - Application Security (AppSec) and Product Security teams.
    - Open Source Program Office (OSPO) managers establishing repository standards.

    ## Why orchestrate this with Kestra
    - **Automated Governance**: Run compliance sweeps across repositories on a weekly schedule.
    - **Multi-Repo Scalability**: Easily expand to audit all organization repositories dynamically.
    - **Automated PR Remediation**: Can be extended to automatically open a pull request adding the corporate `SECURITY.md` template.

    ## Prerequisites
    - GitHub token with `repo` or `read:org` permissions.
    - Secrets `GITHUB_TOKEN` and `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - CI/CD
    - Security
  ee: false
  demo: false
