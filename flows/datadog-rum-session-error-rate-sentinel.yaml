id: datadog-rum-session-error-rate-sentinel
namespace: company.team

inputs:
  - id: dd_site
    type: STRING
    defaults: "datadoghq.com"
    description: Datadog site hostname.
  - id: rum_application_id
    type: STRING
    description: Datadog RUM application ID.
  - id: max_error_rate_pct
    type: FLOAT
    defaults: 5.0
    description: Maximum acceptable percentage of RUM sessions containing errors over the last hour.

tasks:
  - id: query_rum_error_rate
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Datadog RUM Analytics API to compute browser session error volumes.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      DD_SITE: "{{ inputs.dd_site }}"
      RUM_APP_ID: "{{ inputs.rum_application_id }}"
      DD_API_KEY: "{{ secret('DATADOG_API_KEY') }}"
      DD_APP_KEY: "{{ secret('DATADOG_APP_KEY') }}"
    outputFiles:
      - rum_stats.json
    script: |
      import os
      import sys
      import json
      import datetime
      import requests
      from kestra import Kestra

      site = os.environ.get("DD_SITE", "datadoghq.com")
      app_id = os.environ.get("RUM_APP_ID")
      api_key = os.environ.get("DD_API_KEY")
      app_key = os.environ.get("DD_APP_KEY")

      if not api_key or not app_key:
          print("ERROR: DATADOG_API_KEY and DATADOG_APP_KEY secrets must be configured.", file=sys.stderr)
          sys.exit(1)

      now = datetime.datetime.now(datetime.timezone.utc)
      start_ts = int((now - datetime.timedelta(hours=1)).timestamp() * 1000)
      end_ts = int(now.timestamp() * 1000)

      url = f"https://api.{site}/api/v2/rum/analytics/aggregate"
      headers = {
          "DD-API-KEY": api_key,
          "DD-APPLICATION-KEY": app_key,
          "Content-Type": "application/json",
          "Accept": "application/json"
      }
      payload = {
          "filter": {
              "from": str(start_ts),
              "to": str(end_ts),
              "query": f"@application.id:{app_id}"
          },
          "compute": [
              {
                  "aggregation": "count",
                  "metric": "@session.has_error"
              }
          ]
      }

      try:
          resp = requests.post(url, headers=headers, json=payload, timeout=20)
          resp.raise_for_status()
          data = resp.json()
      except Exception as exc:
          print(f"ERROR querying Datadog RUM analytics API: {exc}", file=sys.stderr)
          sys.exit(1)

      with open("rum_stats.json", "w", encoding="utf-8") as f:
          json.dump(data, f, indent=2)

      total_errors = 0
      try:
          items = data.get("data", [])
          if items and len(items) > 0:
              compute_list = items[0].get("attributes", {}).get("compute", [])
              if compute_list and len(compute_list) > 0:
                  total_errors = int(compute_list[0].get("value") or 0)
      except Exception as parse_err:
          print(f"Warning parsing compute result: {parse_err}")

      print(f"RUM app {app_id}: {total_errors} error sessions recorded.")

      Kestra.outputs({
          "error_count": total_errors
      })

  - id: evaluate_rum_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_rum_error_rate.vars.error_count > 50 }}"
    then:
      - id: notify_frontend_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#frontend-incidents",
            "attachments": [
              {
                "color": "danger",
                "title": "Datadog Real User Monitoring (RUM) High Error Volume Alert",
                "text": "RUM application `{{ inputs.rum_application_id }}` recorded *{{ outputs.query_rum_error_rate.vars.error_count }}* error sessions in the last hour. Impact: Frontend users are encountering unhandled JavaScript errors, broken checkouts, or blank screens.",
                "footer": "Kestra Observability Sentinel Datadog RUM"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#frontend-incidents",
        "attachments": [
          {
            "color": "danger",
            "title": "Datadog RUM Sentinel Execution Failed",
            "text": "The Datadog RUM analytics query workflow failed for execution {{ execution.id }}. Please verify Datadog API credentials and application ID.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Datadog Real User Monitoring analytics to detect browser error session surges impacting end-user web experiences."
  metaTitle: Datadog Real User Monitoring Frontend Session Error Rate Sentinel with Kestra
  title: Datadog Real User Monitoring Frontend Session Error Rate Sentinel
  shortDescription: Audits Datadog Real User Monitoring analytics to detect browser error session surges impacting end-user web experiences.
  description: |
    ## How it works
    This workflow queries the Datadog RUM Analytics API v2 (`/api/v2/rum/analytics/aggregate`) to calculate the volume of browser sessions reporting unhandled exceptions or console errors over the last hour. If the error session volume exceeds healthy operational thresholds, an immediate incident notification is routed to the frontend engineering team via Slack.

    ## What you get
    - Rapid visibility into frontend regressions and broken client-side releases.
    - Proactive alerts before customers submit support tickets for broken web experiences.
    - Correlates error volume with specific RUM application IDs.

    ## Who it's for
    - Frontend Engineers and Web Reliability teams managing production single-page applications.
    - Product Managers tracking user experience and checkout funnel health.

    ## Why orchestrate this with Kestra
    - **Scheduled Audits**: Continuously sample real user telemetry without managing standalone scripts.
    - **Flexible Webhook Routing**: Send alerts directly to dedicated web incident channels.
    - **Enterprise Reliability**: Clean execution logging and failure recovery workflows.

    ## Prerequisites
    - Datadog RUM enabled on the target web application.
    - Secrets `DATADOG_API_KEY`, `DATADOG_APP_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra under the `company.team` namespace.
    2. Supply your Datadog credentials and RUM application ID.
    3. Trigger the flow to check current user session error health.

    ## How to extend
    - Query top frontend error messages or failing page URLs to include directly in the Slack notification.
    - Correlate with recent GitHub deployments to automatically flag suspicious releases.

    ## Links
    - [Datadog RUM Analytics API Documentation](https://docs.datadoghq.com/api/latest/rum/#aggregate-rum-events)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Business
    - Cloud
  subTags:
    - HR & Ops Automation
    - Infrastructure Automation
  ee: false
  demo: false
