id: getyoutubetranscript-transcript-to-csv
namespace: company.team

inputs:
  - id: video
    type: STRING
    defaults: https://www.youtube.com/watch?v=dQw4w9WgXcQ
    description: A YouTube video URL (full or short) or an 11-character video ID.
  - id: language
    type: STRING
    required: false
    description: Caption language code such as en or es. Omit to get the video's default caption track.

tasks:
  - id: build_query
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the inputs and encode the request without interpolating user text into code.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.13.15-slim
    env:
      VIDEO: "{{ inputs.video }}"
      LANGUAGE: "{{ inputs.language ?? '' }}"
    outputFiles:
      - request.json
    script: |
      import json
      import os
      import re
      from pathlib import Path
      from urllib.parse import urlencode

      video = os.environ["VIDEO"].strip()
      language = os.environ["LANGUAGE"].strip()
      if not video or len(video) > 300:
          raise ValueError("Give a YouTube video URL or an 11-character video ID.")
      if language and not re.fullmatch(r"[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})?", language):
          raise ValueError("Use a caption language code such as en, es or pt-BR.")
      params = {"v": video, "timestamps": "true"}
      if language:
          params["language"] = language
      request = {"uri": "https://getyoutubetranscript.com/api/v1/transcript?" + urlencode(params), "params": params}
      Path("request.json").write_text(json.dumps(request, indent=2), encoding="utf-8")

  - id: fetch
    type: io.kestra.plugin.core.http.Request
    description: Make one authenticated transcript request. HTTP errors fail the flow without retries.
    uri: "{{ fromJson(read(outputs.build_query.outputFiles['request.json'])).uri }}"
    method: GET
    headers:
      x-api-key: "{{ secret('GETYOUTUBETRANSCRIPT_API_KEY') }}"
      Accept: application/json

  - id: export
    type: io.kestra.plugin.scripts.python.Script
    description: Write the timestamped transcript to CSV and plain text, and keep the unchanged response.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.13.15-slim
    inputFiles:
      response.json: "{{ outputs.fetch.body }}"
    outputFiles:
      - transcript.csv
      - transcript.txt
      - response.json
    script: |
      import csv
      import json
      from pathlib import Path

      data = json.loads(Path("response.json").read_text(encoding="utf-8"))["data"]

      def spreadsheet_cell(value):
          if isinstance(value, str) and value.lstrip().startswith(("=", "+", "-", "@")):
              return "'" + value
          return value

      with open("transcript.csv", "w", newline="", encoding="utf-8") as stream:
          writer = csv.writer(stream)
          writer.writerow(["start_seconds", "duration_seconds", "watch_url", "text"])
          for segment in data.get("segments", []):
              start = segment["start"]
              writer.writerow([
                  start,
                  segment["duration"],
                  f"https://www.youtube.com/watch?v={data['video_id']}&t={int(start)}s",
                  spreadsheet_cell(segment["text"]),
              ])
      Path("transcript.txt").write_text(data["transcript"], encoding="utf-8")
      print(f"{data['title']} | language {data['language_code']} ({data.get('caption_type')}) | {data['word_count']} words")

extend:
  title: "GetYouTubeTranscript: YouTube Transcript to CSV"
  shortDescription: Fetch a YouTube video's transcript with timestamps and export it as a CSV with watch links, a plain-text file and the raw response.
  metaTitle: YouTube Transcript to CSV with GetYouTubeTranscript and Kestra
  description: |
    Fetch the transcript of one YouTube video, in any caption language the video has,
    and export it as a timestamped CSV and a plain-text file. The unchanged API response
    is kept beside them so a reviewer can see which caption track was returned.

    ## How it works

    1. `build_query` validates the video and optional language code, then URL-encodes
       them into one request. User text is passed through environment variables.
    2. `fetch` sends one authenticated GET request to GetYouTubeTranscript's
       `/api/v1/transcript` endpoint with `timestamps=true`. HTTP errors fail the flow;
       there are no retries.
    3. `export` writes one CSV row per caption line, the whole transcript as text, and
       the response. The flow reads existing captions only; it does not download media
       or generate captions for videos that have none.

    ## What you get

    - `outputs.export.outputFiles['transcript.csv']` contains `start_seconds`,
      `duration_seconds`, `watch_url` (a link cued to that second) and `text`. Leading
      spreadsheet formula characters in text cells are escaped with an apostrophe.
    - `outputs.export.outputFiles['transcript.txt']` contains the transcript as one block of text.
    - `outputs.export.outputFiles['response.json']` preserves the unchanged API response,
      including `language_code` (the caption track actually returned, which can differ
      from the requested language) and `caption_type` (creator captions or speech recognition).

    ## Who it's for

    - Researchers and writers who want a video's words as text with timestamps for quoting.
    - Data teams feeding YouTube transcripts into search, summarization or RAG pipelines.

    ## Why orchestrate this with Kestra

    Kestra keeps the secret-backed request, the exports and the execution history in one
    flow. Each run retains its request and response, so a CSV row can be traced back to
    the call that produced it, and other tasks can consume the files without embedding
    an API key in a script.

    ## Prerequisites

    - A [GetYouTubeTranscript](https://getyoutubetranscript.com) API key, created at
      [getyoutubetranscript.com/developers](https://getyoutubetranscript.com/developers).
      A new account gets 100 credits.
    - Kestra with the Python scripting plugin and a Docker task runner able to pull
      `python:3.13.15-slim`. The scripts use only the Python standard library.
    - Network access from the HTTP task to `https://getyoutubetranscript.com`.

    ### Secrets

    - `GETYOUTUBETRANSCRIPT_API_KEY`: sent in the `x-api-key` header. Store it in Kestra's
      configured secrets mechanism and read it with
      `{{ secret('GETYOUTUBETRANSCRIPT_API_KEY') }}`. Do not paste a key into the flow or its inputs.

    ## Quick start

    1. Set the secret and import this flow into your namespace.
    2. Run it with `video`, a YouTube URL or 11-character ID. It defaults to a public video.
    3. Optionally set `language` to a caption language code such as `en` or `es`.
       Omit it to get the video's default track.
    4. Each successful request costs 1 credit; a failed request (no captions, a private
       or removed video) costs nothing. A video with captions turned off has no transcript.
    5. Download the CSV and check `language_code` in the response before relying on the language.

    ## How to extend

    - Add a `translate` parameter (a language code) to the request to get the transcript
      machine-translated with timestamps kept.
    - Loop over a playlist or a channel's uploads with the API's `/playlist` or
      `/channel/videos` endpoints and run this flow per video.
    - Add a storage or notification task after `export` to archive or share the files.

    ## Links

    - [GetYouTubeTranscript API docs](https://getyoutubetranscript.com/docs)
    - [Kestra Python tasks](https://kestra.io/docs/how-to-guides/python)
    - [Kestra HTTP Request](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
  metaDescription: Fetch a YouTube video's transcript with GetYouTubeTranscript and export timestamped lines with watch links to a CSV and a text file.
  tags:
    - Data
    - Business
  subTags:
    - File & Data Processing Basics
  ee: false
  demo: false
