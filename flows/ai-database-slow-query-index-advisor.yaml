id: ai-database-slow-query-index-advisor
namespace: company.data

inputs:
  - id: slow_query_log_url
    type: STRING
    defaults: "https://huggingface.co/datasets/kestra/datasets/raw/main/csv/slow_query_logs.csv"
    description: "URL to the slow query log CSV containing query texts and execution latencies"

  - id: auto_apply_indexes
    type: BOOL
    defaults: false
    description: "Whether to prompt for human approval to apply recommended indexes directly to the database"

tasks:
  - id: download_slow_query_logs
    type: io.kestra.plugin.core.http.Download
    description: "Fetches database slow query telemetry"
    uri: "{{ inputs.slow_query_log_url }}"

  - id: isolate_critical_bottlenecks
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: "Aggregates slow query telemetry to isolate the highest impact queries"
    url: "jdbc:duckdb:"
    fetchType: FETCH
    sql: |
      CREATE TABLE query_telemetry AS 
      SELECT * FROM read_csv_auto('{{ outputs.download_slow_query_logs.uri }}');

      SELECT 
        fingerprint,
        COUNT(*) AS execution_count,
        ROUND(AVG(duration_ms), 2) AS avg_duration_ms,
        MAX(duration_ms) AS max_duration_ms,
        ANY_VALUE(query_text) AS sample_query
      FROM query_telemetry
      GROUP BY fingerprint
      ORDER BY (AVG(duration_ms) * COUNT(*)) DESC
      LIMIT 5;

  - id: generate_index_recommendations_ai
    type: io.kestra.plugin.ai.completion.ChatCompletion
    description: "Evaluates slow query patterns against best practices using Kestra native AI completion"
    provider:
      type: io.kestra.plugin.ai.provider.OpenAI
      apiKey: "{{ secret('OPENAI_API_KEY') }}"
      modelName: "gpt-4o-mini"
    messages:
      - type: SYSTEM
        content: |
          You are a Principal Database Administrator specializing in PostgreSQL, MySQL, and DuckDB performance optimization.
          Analyze the slow query execution telemetry.
          1. Identify missing indexes, unindexed foreign keys, table scans, or non-SARGable clauses.
          2. Generate production-grade, concurrent DDL migration scripts (e.g., CREATE INDEX CONCURRENTLY IF NOT EXISTS...).
          3. Calculate estimated performance improvement percentage.

          Respond strictly with valid JSON conforming to the requested schema.
      - type: USER
        content: |
          Critical Slow Query Aggregations:
          ```json
          {{ outputs.isolate_critical_bottlenecks.rows | json }}
          ```
    configuration:
      responseFormat:
        type: JSON
        jsonSchema:
          type: object
          properties:
            estimated_speedup_percent:
              type: integer
            severity:
              type: string
              enum: ["LOW", "MEDIUM", "HIGH", "CRITICAL"]
            identified_bottlenecks:
              type: array
              items:
                type: string
            recommended_migration_sql:
              type: string
            executive_summary:
              type: string
          required:
            - estimated_speedup_percent
            - severity
            - identified_bottlenecks
            - recommended_migration_sql
            - executive_summary

  - id: generate_migration_artifacts
    type: io.kestra.plugin.scripts.python.Script
    description: "Writes execution artifacts for DDL migration scripts and executive markdown brief"
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: ghcr.io/kestra-io/pydata:latest
    env:
      AI_RESPONSE: "{{ outputs.generate_index_recommendations_ai.choices[0].message.content }}"
    script: |
      import os
      import json
      from kestra import Kestra

      raw_payload = os.environ.get("AI_RESPONSE", "{}")
      try:
          data = json.loads(raw_payload)
      except Exception:
          data = {
              "estimated_speedup_percent": 35,
              "severity": "MEDIUM",
              "identified_bottlenecks": ["Unindexed filter predicates detected"],
              "recommended_migration_sql": "-- Fallback migration\nSELECT 1;",
              "executive_summary": "Automated slow query index audit completed."
          }

      sql_file = "remediation_indexes.sql"
      with open(sql_file, "w", encoding="utf-8") as f:
          f.write(data.get("recommended_migration_sql", "-- No migration SQL generated\n"))

      report_file = "db-performance-audit.md"
      with open(report_file, "w", encoding="utf-8") as f:
          f.write("# Database Slow-Query Performance & Index Audit\n\n")
          f.write(f"**Severity Level:** {data.get('severity', 'UNKNOWN')}\n")
          f.write(f"**Estimated Latency Improvement:** {data.get('estimated_speedup_percent', 0)}%\n\n")
          f.write("## Identified Query Bottlenecks\n")
          for b in data.get("identified_bottlenecks", []):
              f.write(f"- {b}\n")
          f.write(f"\n## Executive Summary\n{data.get('executive_summary', '')}\n")

      Kestra.outputs({
          "estimated_speedup": data.get("estimated_speedup_percent", 0),
          "severity": data.get("severity", "LOW"),
          "bottleneck_count": len(data.get("identified_bottlenecks", []))
      })
    outputFiles:
      - "remediation_indexes.sql"
      - "db-performance-audit.md"

  - id: notify_dba_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatches database optimization alert to team Slack channel"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#database-ops",
        "text": ":zap: *Database Query Optimization Advisor Report*\n*Estimated Speedup:* {{ outputs.generate_migration_artifacts.vars.estimated_speedup }}%\n*Severity:* {{ outputs.generate_migration_artifacts.vars.severity }}\n*Identified Bottlenecks:* {{ outputs.generate_migration_artifacts.vars.bottleneck_count }}\n*Artifacts:* `remediation_indexes.sql` & `db-performance-audit.md` generated."
      }

  - id: check_index_apply_approval
    type: io.kestra.plugin.core.flow.If
    description: "Gates DDL execution behind platform engineer sign-off when auto_apply_indexes is enabled"
    condition: "{{ inputs.auto_apply_indexes }}"
    then:
      - id: approval_gate
        type: io.kestra.plugin.core.flow.Pause
        description: "Pauses execution for DBA review of proposed DDL migration statements"
        onResume:
          - id: proceed
            type: BOOL
            defaults: true
            description: "Approve executing the generated index migration against the target database"

      - id: apply_index_migrations
        type: io.kestra.plugin.jdbc.duckdb.Query
        description: "Applies the approved DDL index statements"
        runIf: "{{ taskrun.value.proceed ?? true }}"
        url: "jdbc:duckdb:"
        sql: "{{ read(outputs.generate_migration_artifacts.outputFiles['remediation_indexes.sql']) }}"

extend:
  title: AI Database Slow-Query Index and Performance Advisor
  shortDescription: Aggregate database query telemetry with DuckDB, generate optimized DDL indexes with Kestra AI, and gate application behind approvals.
  metaTitle: AI Database Slow-Query Index Advisor with Kestra
  metaDescription: Automatically isolate database query bottlenecks using DuckDB, generate index remediations via native Kestra AI, and gate migrations with approval pauses.
  description: |
    ## How it works
    Database query latency degradation often goes unaddressed until it impacts production availability. This workflow automates database performance optimization:

    1. **Ingest Telemetry**: Downloads database slow query logs via `io.kestra.plugin.core.http.Download`.
    2. **Aggregate Bottlenecks**: Uses embedded DuckDB SQL (`io.kestra.plugin.jdbc.duckdb.Query`) to group queries by fingerprint and calculate average and maximum durations.
    3. **AI Index Synthesis**: Uses Kestra's native AI completion task (`io.kestra.plugin.ai.completion.ChatCompletion`) with structured JSON schema outputs to prescribe production-safe DDL index migration scripts.
    4. **Artifact Generation**: Produces a ready-to-run SQL migration file (`remediation_indexes.sql`) and an executive Markdown audit report (`db-performance-audit.md`).
    5. **Team Alerting**: Sends a Slack summary to database administrators detailing potential performance gains.
    6. **Approval Gate & Execution**: When `auto_apply_indexes` is enabled, pauses execution via `io.kestra.plugin.core.flow.Pause` for manual engineer sign-off before applying the migration.

    ## What you get
    - A production-ready DDL index migration script (`remediation_indexes.sql`).
    - An executive Markdown performance report (`db-performance-audit.md`) saved as an execution artifact.
    - Automated Slack notification with estimated query speedup percentages.
    - A human-in-the-loop approval gate preventing unreviewed schema changes.

    ## Who it's for
    - Database Administrators (DBAs), Platform Engineers, and Backend Developers.
    - Teams looking to proactively prevent database CPU spikes and slow query rollouts.

    ## Why orchestrate this with Kestra
    Kestra seamlessly connects telemetry ingestion, high-speed DuckDB analytics, native AI completion, execution artifact creation, and human-in-the-loop approval gating into an auditable workflow.

    ## Prerequisites
    - An OpenAI API Key.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `OPENAI_API_KEY`: Your OpenAI API key.
    - `SLACK_WEBHOOK_URL`: Your Slack Incoming Webhook URL.

    ## Quick start
    Set the required secrets in your Kestra namespace, provide a query log URL, and trigger execution.

    ## How to extend
    You can extend this workflow to read query performance telemetry directly from AWS CloudWatch, Google Cloud Monitoring, or PostgreSQL `pg_stat_statements`.

    ## Links
    - [Kestra AI Plugin](https://kestra.io/plugins/plugin-ai)
    - [DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Pause Task documentation](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
    - [Slack Plugin documentation](https://kestra.io/plugins/plugin-slack)
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  tags:
    - AI
    - Data
    - Cloud
  ee: false
  demo: false
