id: snowflake-table-time-travel-sentinel
namespace: company.finops

inputs:
  - id: snowflake_account
    type: STRING
    defaults: xy12345.us-east-1
    description: Snowflake account identifier.
  - id: snowflake_username
    type: STRING
    defaults: kestra_monitor
    description: Snowflake service user.
  - id: max_time_travel_tb_threshold
    type: FLOAT
    defaults: 1.0
    description: Maximum allowable Time Travel storage in terabytes per table before alerting.

tasks:
  - id: query_table_storage_metrics
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ inputs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ inputs.snowflake_username }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    sql: |
      SELECT 
        TABLE_CATALOG || '.' || TABLE_SCHEMA || '.' || TABLE_NAME AS FULL_TABLE_NAME,
        ROUND(ACTIVE_BYTES / 1099511627776.0, 2) AS ACTIVE_TB,
        ROUND(TIME_TRAVEL_BYTES / 1099511627776.0, 2) AS TIME_TRAVEL_TB,
        ROUND(FAILSAFE_BYTES / 1099511627776.0, 2) AS FAILSAFE_TB
      FROM SNOWFLAKE.ACCOUNT_USAGE.TABLE_STORAGE_METRICS
      WHERE TIME_TRAVEL_BYTES > ({{ inputs.max_time_travel_tb_threshold }} * 1099511627776)
        AND DELETED = FALSE
      ORDER BY TIME_TRAVEL_BYTES DESC
      LIMIT 5;
    fetchType: FETCH

  - id: evaluate_storage_bloat
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_table_storage_metrics.rows | length > 0 }}"
    then:
      - id: alert_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":money_with_wings: *Snowflake Storage Bloat Alert*: Found {{ outputs.query_table_storage_metrics.rows | length }} tables with Time Travel storage exceeding {{ inputs.max_time_travel_tb_threshold }} TB (Top Table: `{{ outputs.query_table_storage_metrics.rows[0].FULL_TABLE_NAME }}` with {{ outputs.query_table_storage_metrics.rows[0].TIME_TRAVEL_TB }} TB Time Travel and {{ outputs.query_table_storage_metrics.rows[0].FAILSAFE_TB }} TB Fail-safe). Consider converting transient staging tables to `TRANSIENT` to eliminate Fail-safe charges."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Snowflake Storage Sentinel Failure*: Failed to query table storage metrics."
      }

outputs:
  - id: bloated_tables
    type: JSON
    value: "{{ outputs.query_table_storage_metrics.rows }}"
  - id: bloated_table_count
    type: INT
    value: "{{ outputs.query_table_storage_metrics.rows | length }}"

triggers:
  - id: weekly_storage_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true

extend:
  metaDescription: "Audits Snowflake table storage metrics to detect bloated Time Travel and Fail-safe historical storage incurring unnecessary monthly costs."
  metaTitle: Snowflake Table Time Travel Retention and Fail-Safe Storage Bloat Sentinel with Kestra
  title: Snowflake Table Time Travel Retention and Fail-Safe Storage Bloat Sentinel
  shortDescription: Audits Snowflake table storage metrics to detect bloated Time Travel and Fail-safe historical storage incurring unnecessary monthly costs.
  description: |
    ## How it works
    This sentinel leverages the JDBC Snowflake plugin to query `SNOWFLAKE.ACCOUNT_USAGE.TABLE_STORAGE_METRICS`. It calculates storage allocations across active data, Time Travel versions, and 7-day Disaster Recovery Fail-safe storage, alerting FinOps teams when transient or staging tables retain unneeded historical versions.

    ## What you get
    - Continuous validation of Snowflake storage cost efficiency.
    - Identification of ETL staging tables needlessly incurring Time Travel and Fail-safe storage fees.
    - Automated Slack delivery detailing table names, active TB, and Time Travel/Fail-safe TB.

    ## Who it's for
    - FinOps analysts and cloud data architects tracking Snowflake storage expenditures.
    - Data engineers designing staging and ingestion layers in Snowflake.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled analytical health checks natively using the Snowflake JDBC plugin suite, combining SQL telemetry with declarative conditional logic and notification dispatching.

    ## Prerequisites
    - Snowflake account access with permissions on `ACCOUNT_USAGE.TABLE_STORAGE_METRICS`.
    - Secrets `SNOWFLAKE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure account, user, and threshold TB.
    3. Run manually to check current historical storage bloat.

    ## How to extend
    - Propose automated table alterations via `ALTER TABLE ... SET DATA_RETENTION_TIME_IN_DAYS = 1`.
    - Detect deleted tables still accruing Fail-safe charges.
    - Export storage breakdown to an internal cost reporting dashboard.

    ## Links
    - [Kestra Snowflake Plugin](https://kestra.io/plugins/plugin-jdbc-snowflake)
    - [Snowflake Understanding Storage](https://docs.snowflake.com/en/user-guide/storage-considerations)
  tags:
    - Data
    - Cloud
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
