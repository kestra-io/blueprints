id: aws-cloudwatch-alarm-coverage-gap-gate
namespace: company.cloud

description: |
  Audits AWS resources across EC2, RDS, Lambda, and SQS to identify missing CloudWatch metric alarms, degraded configurations, and observability blind spots.

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: Target AWS region to evaluate.

  - id: aws_inventory_file
    type: FILE
    required: false
    description: Optional pre-collected AWS inventory JSON file for air-gapped or CI pipeline audits.

  - id: target_resource_types
    type: ARRAY
    itemType: STRING
    defaults:
      - ec2
      - rds
      - lambda
      - sqs
    description: Configurable list of AWS resource types to audit.

  - id: enforce_coverage
    type: BOOLEAN
    defaults: false
    description: If true, fails the gate when monitoring coverage falls below threshold or unmonitored resources exist. Default is false (advisory mode).

  - id: require_actions_enabled
    type: BOOLEAN
    defaults: true
    description: Flag alarms where ActionsEnabled is false as degraded configuration.

  - id: require_alarm_actions
    type: BOOLEAN
    defaults: true
    description: Flag alarms without notification target ARNs (AlarmActions) as degraded.

  - id: flag_insufficient_data
    type: BOOLEAN
    defaults: true
    description: Flag alarms in INSUFFICIENT_DATA state.

  - id: max_tolerated_coverage_gap_percent
    type: FLOAT
    defaults: 0.0
    description: Maximum acceptable percentage of resources with missing or degraded alarms before failing in enforcement mode.

  - id: excluded_resource_patterns
    type: ARRAY
    itemType: STRING
    defaults:
      - "^test-.*"
      - "^dev-.*"
      - ".*-temp$"
    description: Regex patterns for resource names or IDs exempt from production monitoring requirements.

  - id: slack_webhook_url
    type: STRING
    required: false
    description: Optional Slack incoming webhook URL for summary notifications.

tasks:
  - id: discover_or_load_inventory
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3 kestra
    env:
      AWS_REGION: "{{ inputs.aws_region }}"
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      INVENTORY_FILE_INPUT: "{{ inputs.aws_inventory_file }}"
      TARGET_TYPES: "{{ inputs.target_resource_types | json }}"
    script: |
      import os
      import sys
      import json
      import shutil
      from datetime import datetime, timezone
      from kestra import Kestra

      region = os.environ.get("AWS_REGION", "us-east-1")
      inventory_input = os.environ.get("INVENTORY_FILE_INPUT", "")
      target_types_str = os.environ.get("TARGET_TYPES", '["ec2", "rds", "lambda", "sqs"]')
      try:
          target_types = json.loads(target_types_str)
      except Exception:
          target_types = ["ec2", "rds", "lambda", "sqs"]

      output_inventory_path = "cloudwatch_inventory.json"

      if inventory_input and os.path.exists(inventory_input) and os.path.getsize(inventory_input) > 0:
          print(f"Loading provided offline AWS inventory from: {inventory_input}")
          with open(inventory_input, "r", encoding="utf-8") as src:
              data = json.load(src)
          with open(output_inventory_path, "w", encoding="utf-8") as dst:
              json.dump(data, dst, indent=2)
      else:
          print(f"Querying live AWS APIs in region: {region}")
          import boto3

          cw = boto3.client("cloudwatch", region_name=region)
          alarms = []
          paginator = cw.get_paginator("describe_alarms")
          for page in paginator.paginate():
              for ma in page.get("MetricAlarms", []):
                  alarms.append({
                      "AlarmName": ma.get("AlarmName"),
                      "AlarmArn": ma.get("AlarmArn"),
                      "MetricName": ma.get("MetricName"),
                      "Namespace": ma.get("Namespace"),
                      "Dimensions": ma.get("Dimensions", []),
                      "Metrics": ma.get("Metrics", []),
                      "StateValue": ma.get("StateValue"),
                      "ActionsEnabled": ma.get("ActionsEnabled", True),
                      "AlarmActions": ma.get("AlarmActions", [])
                  })
              for ca in page.get("CompositeAlarms", []):
                  alarms.append({
                      "AlarmName": ca.get("AlarmName"),
                      "AlarmArn": ca.get("AlarmArn"),
                      "StateValue": ca.get("StateValue"),
                      "ActionsEnabled": ca.get("ActionsEnabled", True),
                      "AlarmActions": ca.get("AlarmActions", [])
                  })

          resources = {
              "ec2": [],
              "rds": [],
              "lambda": [],
              "sqs": []
          }

          if "ec2" in target_types:
              ec2 = boto3.client("ec2", region_name=region)
              ec2_paginator = ec2.get_paginator("describe_instances")
              for page in ec2_paginator.paginate(Filters=[{"Name": "instance-state-name", "Values": ["running"]}]):
                  for res in page.get("Reservations", []):
                      for inst in res.get("Instances", []):
                          inst_id = inst.get("InstanceId")
                          name = inst_id
                          tags = {}
                          for t in inst.get("Tags", []):
                              tags[t.get("Key", "")] = t.get("Value", "")
                              if t.get("Key") == "Name":
                                  name = t.get("Value")
                          resources["ec2"].append({
                              "id": inst_id,
                              "name": name,
                              "type": inst.get("InstanceType"),
                              "state": inst.get("State", {}).get("Name"),
                              "tags": tags
                          })

          if "rds" in target_types:
              rds = boto3.client("rds", region_name=region)
              rds_paginator = rds.get_paginator("describe_db_instances")
              for page in rds_paginator.paginate():
                  for db in page.get("DBInstances", []):
                      db_id = db.get("DBInstanceIdentifier")
                      tags = {t.get("Key", ""): t.get("Value", "") for t in db.get("TagList", [])}
                      resources["rds"].append({
                          "id": db_id,
                          "name": db_id,
                          "engine": db.get("Engine"),
                          "status": db.get("DBInstanceStatus"),
                          "tags": tags
                      })

          if "lambda" in target_types:
              lam = boto3.client("lambda", region_name=region)
              lam_paginator = lam.get_paginator("list_functions")
              for page in lam_paginator.paginate():
                  for fn in page.get("Functions", []):
                      fn_name = fn.get("FunctionName")
                      resources["lambda"].append({
                          "id": fn_name,
                          "name": fn_name,
                          "runtime": fn.get("Runtime"),
                          "tags": {}
                      })

          if "sqs" in target_types:
              sqs = boto3.client("sqs", region_name=region)
              try:
                  sqs_res = sqs.list_queues()
                  for q_url in sqs_res.get("QueueUrls", []):
                      q_name = q_url.split("/")[-1]
                      resources["sqs"].append({
                          "id": q_name,
                          "name": q_name,
                          "url": q_url,
                          "tags": {}
                      })
              except Exception as e:
                  print(f"Warning: SQS listing encountered: {e}")

          payload = {
              "region": region,
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "alarms": alarms,
              "resources": resources
          }
          with open(output_inventory_path, "w", encoding="utf-8") as dst:
              json.dump(payload, dst, indent=2)

      print(f"Inventory discovery complete. Stored in {output_inventory_path}")
      Kestra.outputs({"inventory_file": output_inventory_path})

  - id: evaluate_alarm_coverage
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra
    env:
      INVENTORY_FILE: "{{ outputs.discover_or_load_inventory.vars.inventory_file }}"
      TARGET_TYPES: "{{ inputs.target_resource_types | json }}"
      REQUIRE_ACTIONS_ENABLED: "{{ inputs.require_actions_enabled }}"
      REQUIRE_ALARM_ACTIONS: "{{ inputs.require_alarm_actions }}"
      FLAG_INSUFFICIENT_DATA: "{{ inputs.flag_insufficient_data }}"
      MAX_TOLERATED_GAP_PERCENT: "{{ inputs.max_tolerated_coverage_gap_percent }}"
      EXCLUDED_PATTERNS: "{{ inputs.excluded_resource_patterns | json }}"
      ENFORCE_COVERAGE: "{{ inputs.enforce_coverage }}"
    script: |
      import os
      import sys
      import json
      import re
      from datetime import datetime, timezone
      from kestra import Kestra

      inventory_file = os.environ.get("INVENTORY_FILE", "cloudwatch_inventory.json")
      target_types = json.loads(os.environ.get("TARGET_TYPES", '["ec2", "rds", "lambda", "sqs"]'))
      require_actions_enabled = os.environ.get("REQUIRE_ACTIONS_ENABLED", "true").lower() == "true"
      require_alarm_actions = os.environ.get("REQUIRE_ALARM_ACTIONS", "true").lower() == "true"
      flag_insufficient_data = os.environ.get("FLAG_INSUFFICIENT_DATA", "true").lower() == "true"
      max_tolerated_gap_percent = float(os.environ.get("MAX_TOLERATED_GAP_PERCENT", "0.0"))
      excluded_patterns = json.loads(os.environ.get("EXCLUDED_PATTERNS", '["^test-.*", "^dev-.*"]'))
      enforce_coverage = os.environ.get("ENFORCE_COVERAGE", "false").lower() == "true"

      if not os.path.exists(inventory_file):
          print(f"Error: Inventory file {inventory_file} not found.", file=sys.stderr)
          sys.exit(1)

      with open(inventory_file, "r", encoding="utf-8") as f:
          inventory = json.load(f)

      alarms = inventory.get("alarms", [])
      resources_map = inventory.get("resources", {})
      region = inventory.get("region", "us-east-1")

      required_metrics_map = {
          "ec2": {
              "dimension_key": "InstanceId",
              "required_metrics": ["CPUUtilization", "StatusCheckFailed_System", "StatusCheckFailed_Instance"]
          },
          "rds": {
              "dimension_key": "DBInstanceIdentifier",
              "required_metrics": ["CPUUtilization", "FreeStorageSpace", "DatabaseConnections"]
          },
          "lambda": {
              "dimension_key": "FunctionName",
              "required_metrics": ["Errors", "Throttles"]
          },
          "sqs": {
              "dimension_key": "QueueName",
              "required_metrics": ["ApproximateAgeOfOldestMessage"]
          }
      }

      def extract_dimensions_from_alarm(alarm):
          dims = {}
          for d in alarm.get("Dimensions", []):
              if "Name" in d and "Value" in d:
                  dims[d["Name"]] = d["Value"]
          for metric_query in alarm.get("Metrics", []):
              m_stat = metric_query.get("MetricStat", {})
              m_info = m_stat.get("Metric", {})
              for d in m_info.get("Dimensions", []):
                  if "Name" in d and "Value" in d:
                      dims[d["Name"]] = d["Value"]
          return dims

      alarms_by_dimension = {}
      for alarm in alarms:
          dims = extract_dimensions_from_alarm(alarm)
          metrics_found = set()
          if alarm.get("MetricName"):
              metrics_found.add(alarm["MetricName"])
          for metric_query in alarm.get("Metrics", []):
              m_stat = metric_query.get("MetricStat", {})
              m_info = m_stat.get("Metric", {})
              if m_info.get("MetricName"):
                  metrics_found.add(m_info["MetricName"])
          if not metrics_found and alarm.get("Metrics"):
              for metric_query in alarm.get("Metrics", []):
                  if metric_query.get("Id"):
                      metrics_found.add(metric_query["Id"])

          for dim_name, dim_val in dims.items():
              key = (dim_name, dim_val)
              if key not in alarms_by_dimension:
                  alarms_by_dimension[key] = []
              alarms_by_dimension[key].append({
                  "alarm_name": alarm.get("AlarmName", "Unnamed"),
                  "alarm_arn": alarm.get("AlarmArn", ""),
                  "metric_names": list(metrics_found),
                  "state_value": alarm.get("StateValue", "UNKNOWN"),
                  "actions_enabled": bool(alarm.get("ActionsEnabled", False)),
                  "alarm_actions": alarm.get("AlarmActions", [])
              })

      compiled_patterns = [re.compile(p) for p in excluded_patterns if p]

      audited_resources = []
      total_compliant = 0
      total_partially_monitored = 0
      total_unmonitored = 0
      total_gaps_count = 0

      for r_type in target_types:
          if r_type not in required_metrics_map:
              continue

          type_spec = required_metrics_map[r_type]
          dim_key = type_spec["dimension_key"]
          required_metrics = type_spec["required_metrics"]
          resources_list = resources_map.get(r_type, [])

          for res in resources_list:
              res_id = res.get("id", "")
              res_name = res.get("name", res_id)
              res_tags = res.get("tags", {})

              # Check regex exclusions
              is_excluded = False
              for pat in compiled_patterns:
                  if pat.search(res_id) or pat.search(res_name):
                      is_excluded = True
                      break
              if is_excluded:
                  continue

              # Check tag exemption
              if any(k.lower() == "monitoring" and str(v).lower() in ("exempt", "false", "no") for k, v in res_tags.items()):
                  continue

              matched_alarms = alarms_by_dimension.get((dim_key, res_id), [])
              existing_metrics = {m for a in matched_alarms for m in a.get("metric_names", [])}
              missing_metrics = [m for m in required_metrics if m not in existing_metrics]

              config_issues = []
              for a in matched_alarms:
                  issues_for_alarm = []
                  if require_actions_enabled and not a["actions_enabled"]:
                      issues_for_alarm.append("Actions disabled")
                  if require_alarm_actions and len(a["alarm_actions"]) == 0:
                      issues_for_alarm.append("No notification actions configured")
                  if flag_insufficient_data and a["state_value"] == "INSUFFICIENT_DATA":
                      issues_for_alarm.append("State is INSUFFICIENT_DATA")
                  if issues_for_alarm:
                      config_issues.append({
                          "alarm_name": a["alarm_name"],
                          "issues": issues_for_alarm
                      })

              if len(matched_alarms) == 0:
                  status = "UNMONITORED"
                  total_unmonitored += 1
                  total_gaps_count += 1
              elif len(missing_metrics) > 0 or len(config_issues) > 0:
                  status = "PARTIALLY_MONITORED"
                  total_partially_monitored += 1
                  total_gaps_count += 1
              else:
                  status = "COMPLIANT"
                  total_compliant += 1

              audited_resources.append({
                  "resource_id": res_id,
                  "resource_name": res_name,
                  "resource_type": r_type,
                  "status": status,
                  "required_metrics": required_metrics,
                  "covered_metrics": sorted(list(existing_metrics)),
                  "missing_metrics": missing_metrics,
                  "alarm_count": len(matched_alarms),
                  "config_issues": config_issues
              })

      total_audited = len(audited_resources)
      coverage_percentage = round((total_compliant / total_audited * 100.0), 2) if total_audited > 0 else 100.0
      gap_percent = round((100.0 - coverage_percentage), 2)

      policy_violation = False
      if enforce_coverage:
          if gap_percent > max_tolerated_gap_percent or total_unmonitored > 0:
              policy_violation = True

      report = {
          "region": region,
          "timestamp": datetime.now(timezone.utc).isoformat(),
          "summary": {
              "total_audited_resources": total_audited,
              "total_compliant": total_compliant,
              "total_partially_monitored": total_partially_monitored,
              "total_unmonitored": total_unmonitored,
              "coverage_percentage": coverage_percentage,
              "gap_percentage": gap_percent,
              "total_gaps_count": total_gaps_count,
              "enforce_coverage": enforce_coverage,
              "max_tolerated_gap_percent": max_tolerated_gap_percent,
              "policy_violation": policy_violation
          },
          "resources": audited_resources
      }

      out_json_path = "cloudwatch_alarm_coverage_report.json"
      out_md_path = "cloudwatch_alarm_coverage_report.md"

      with open(out_json_path, "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      badge = "PASS (COMPLIANT)" if not policy_violation else "FAIL (MONITORING GAP)"
      md_lines = [
          "# AWS CloudWatch Alarm Coverage & Monitoring Gap Audit Report",
          "",
          f"**Audit Status:** `{badge}`  ",
          f"**Region:** `{region}` | **Coverage Rate:** `{coverage_percentage}%` | **Policy Violation:** `{policy_violation}`",
          "",
          "## Executive Summary",
          "",
          "| Metric | Count | Ratio |",
          "| :--- | :--- | :--- |",
          f"| **Total Audited Resources** | `{total_audited}` | 100% |",
          f"| **Fully Compliant** | `{total_compliant}` | `{coverage_percentage}%` |",
          f"| **Partially Monitored** | `{total_partially_monitored}` | `{round(total_partially_monitored / (total_audited or 1) * 100, 1)}%` |",
          f"| **Completely Unmonitored** | `{total_unmonitored}` | `{round(total_unmonitored / (total_audited or 1) * 100, 1)}%` |",
          f"| **Total Gaps Detected** | `{total_gaps_count}` | — |",
          "",
          "## Gaps & Unmonitored Resources Breakdown",
          ""
      ]

      non_compliant = [r for r in audited_resources if r["status"] != "COMPLIANT"]
      if not non_compliant:
          md_lines.append("All production resources satisfy CloudWatch alarm coverage baseline.")
      else:
          md_lines.append("| Type | Resource ID | Name | Status | Missing Metrics | Alarm Config Issues |")
          md_lines.append("| :--- | :--- | :--- | :--- | :--- | :--- |")
          for r in non_compliant:
              missing_str = ", ".join(f"`{m}`" for m in r["missing_metrics"]) if r["missing_metrics"] else "None"
              issues_list = []
              for ci in r.get("config_issues", []):
                  issues_list.append(f"{ci['alarm_name']} ({', '.join(ci['issues'])})")
              issues_str = "; ".join(issues_list) if issues_list else "None"
              md_lines.append(f"| `{r['resource_type']}` | `{r['resource_id']}` | {r['resource_name']} | **{r['status']}** | {missing_str} | {issues_str} |")

      md_lines.append("")
      md_lines.append("## Recommended Remediation Steps")
      md_lines.append("1. **Attach Missing Alarms:** Create required metric alarms using AWS CLI, Terraform, or CloudFormation.")
      md_lines.append("2. **Verify Notification Actions:** Ensure `ActionsEnabled: true` and at least one active SNS topic ARN is attached.")
      md_lines.append("3. **Resolve Insufficient Data:** Verify dimension matching to resolve alarms stuck in `INSUFFICIENT_DATA` state.")

      with open(out_md_path, "w", encoding="utf-8") as f:
          f.write("\n".join(md_lines))

      print(f"Coverage Evaluation Complete: {coverage_percentage}% covered ({total_compliant}/{total_audited}). Gaps: {total_gaps_count}. Violation: {policy_violation}")

      Kestra.outputs({
          "total_resources": total_audited,
          "compliant_resources": total_compliant,
          "partially_monitored_resources": total_partially_monitored,
          "unmonitored_resources": total_unmonitored,
          "coverage_percentage": coverage_percentage,
          "total_gaps_count": total_gaps_count,
          "policy_violation": policy_violation,
          "audit_report_json": out_json_path,
          "audit_report_md": out_md_path
      })

  - id: check_slack_summary
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.slack_webhook_url != null and inputs.slack_webhook_url != '' }}"
    then:
      - id: send_slack_summary
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ inputs.slack_webhook_url }}"
        payload: |
          {
            "text": "AWS CloudWatch Alarm Coverage Audit Summary",
            "attachments": [
              {
                "color": "{{ outputs.evaluate_alarm_coverage.vars.policy_violation ? '#e01e5a' : '#2eb886' }}",
                "title": "AWS CloudWatch Alarm Coverage & Monitoring Gap Audit",
                "text": "Audited *{{ outputs.evaluate_alarm_coverage.vars.total_resources }}* AWS resources in region *{{ inputs.aws_region }}*.\n• Coverage: *{{ outputs.evaluate_alarm_coverage.vars.coverage_percentage }}%*\n• Fully Compliant: *{{ outputs.evaluate_alarm_coverage.vars.compliant_resources }}*\n• Partially Monitored: *{{ outputs.evaluate_alarm_coverage.vars.partially_monitored_resources }}*\n• Completely Unmonitored: *{{ outputs.evaluate_alarm_coverage.vars.unmonitored_resources }}*\n• Policy Violation: *{{ outputs.evaluate_alarm_coverage.vars.policy_violation }}*",
                "footer": "Kestra CloudWatch Monitoring Gap Gate"
              }
            ]
          }

  - id: enforcement_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.enforce_coverage and outputs.evaluate_alarm_coverage.vars.policy_violation }}"
    then:
      - id: fail_coverage_policy
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "CloudWatch alarm coverage policy violated: {{ outputs.evaluate_alarm_coverage.vars.unmonitored_resources }} unmonitored resources detected and coverage is {{ outputs.evaluate_alarm_coverage.vars.coverage_percentage }}% (threshold: {{ 100.0 - inputs.max_tolerated_coverage_gap_percent }}%). Review cloudwatch_alarm_coverage_report.md for missing alarms."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.core.log.Log
    message: "AWS CloudWatch alarm coverage audit pipeline encountered a fatal execution failure."

triggers:
  - id: weekly_monday_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true

extend:
  title: AWS CloudWatch Alarm Coverage & Monitoring Gap Gate
  metaTitle: AWS CloudWatch Alarm Coverage & Monitoring Gap Gate with Kestra
  shortDescription: Audits AWS resources (EC2, RDS, Lambda, SQS) against CloudWatch alarm policies to detect missing metrics, disabled actions, and observability gaps.
  metaDescription: Audits AWS EC2, RDS, Lambda, and SQS against CloudWatch alarm policies to detect missing metrics, disabled actions, and observability gaps.
  description: |
    Audits production AWS workloads to uncover unmonitored resources, missing metric alarms, and degraded alarm configurations before operational blind spots lead to unhandled outages.

    ## How it works

    1. **Scheduled or On-Demand Execution**: Runs weekly via `io.kestra.plugin.core.trigger.Schedule` or triggers manually for pre-deployment production audits.
    2. **Multi-Service Discovery**: Queries AWS CloudWatch metric alarms, composite alarms, and inventory across EC2 instances, RDS databases, Lambda functions, and SQS queues, or ingests an offline JSON inventory file (`aws_inventory_file`) for CI pipelines.
    3. **Dimension-Aware Metric Mapping**: Correlates alarms to specific resources using CloudWatch metric dimensions (`InstanceId`, `DBInstanceIdentifier`, `FunctionName`, `QueueName`) and evaluates coverage against baseline health metrics (e.g., EC2 status checks, RDS storage/connections, Lambda errors/throttles, SQS message age).
    4. **Alarm Configuration Hygiene**: Verifies that existing alarms have `ActionsEnabled: true`, possess at least one notification ARN in `AlarmActions`, and are not stuck in an `INSUFFICIENT_DATA` state.
    5. **Comprehensive Reporting**: Generates machine-readable `cloudwatch_alarm_coverage_report.json` and human-readable `cloudwatch_alarm_coverage_report.md` artifacts.
    6. **Slack Notifications**: Optionally broadcasts executive coverage metrics and compliance status to incident response teams.
    7. **Policy Enforcement Gate**: In advisory mode (`enforce_coverage: false`, default), logs recommendations without interrupting operations. In enforcement mode (`enforce_coverage: true`), automatically halts the pipeline if coverage falls below threshold or unmonitored resources exist.

    ## What you get

    - Zero-touch visibility into unmonitored production cloud infrastructure.
    - Automated detection of silent monitoring failures (alarms with notifications disabled or missing actions).
    - Clear distinction between alarm existence and alarm effectiveness.
    - Auditable JSON plan and Markdown compliance artifacts for DevOps and SRE teams.
    - Optional Slack alerts with coverage statistics and violation flags.

    ## Who it's for

    - Platform Engineering and DevOps teams enforcing infrastructure observability baselines.
    - Site Reliability Engineers (SREs) safeguarding availability SLAs and incident response readiness.
    - Cloud Operations and Security teams eliminating unmonitored cloud resource sprawl.

    ## Why orchestrate this with Kestra

    - **Declarative Governance**: Enforce consistent observability policies across multiple AWS accounts and regions in declarative YAML.
    - **Safe Dual Mode**: Run safely in advisory mode for continuous posture reporting, or activate enforcement mode as a release gate in CI/CD.
    - **Zero Secrets Logging**: AWS credentials and Slack webhooks are securely retrieved via `{{ secret('NAME') }}` without logging sensitive credentials.
    - **Air-Gapped & Offline Testing**: Test policies against captured JSON inventories in local or CI environments without requiring live AWS API calls.

    ## Prerequisites

    - AWS IAM credentials with read-only permissions for:
      - `cloudwatch:DescribeAlarms`
      - `ec2:DescribeInstances`
      - `rds:DescribeDBInstances`
      - `lambda:ListFunctions`
      - `sqs:ListQueues`
    - Docker container runner enabled on Kestra workers.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID with read-only monitoring permissions.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` secrets in your Kestra namespace.
    2. Import this blueprint into Kestra.
    3. Execute the flow in default advisory mode (`enforce_coverage: false`) to generate your initial coverage report.
    4. Review `cloudwatch_alarm_coverage_report.md` in execution outputs to inspect unmonitored resources.
    5. Activate `weekly_monday_audit` to run automated weekly compliance audits.

    ## How to extend

    - Add an automated remediation branch using AWS CLI tasks to provision standard Terraform/CloudWatch alarm templates for unmonitored resources.
    - Extend target resource types to include ECS services (`CPUUtilization`, `MemoryUtilization`) and Application Load Balancers (`HTTPCode_Target_5XX_Count`).
    - Connect downstream pager routing to PagerDuty or Opsgenie webhooks.

