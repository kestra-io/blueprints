id: github-repo-codebase-gemini-rag-embeddings-indexer
namespace: company.ai

description: |
  Automated RAG ingestion pipeline that clones a GitHub code repository, extracts source code files,
  computes vector embeddings using Google Gemini embeddings API, indexes them in a local vector store,
  and broadcasts indexing summaries to Slack.

inputs:
  - id: git_repository
    type: STRING
    displayName: Git Repository URL
    description: Public or private Git repository to index for semantic code search.
    defaults: "https://github.com/octocat/Hello-World"

  - id: git_branch
    type: STRING
    displayName: Git Branch
    description: Branch to check out and index.
    defaults: "master"

  - id: file_extensions
    type: STRING
    displayName: Target File Extensions
    description: Comma-separated list of code file extensions to index.
    defaults: ".py,.js,.ts,.java,.go,.md"

  - id: gemini_model
    type: STRING
    displayName: Gemini Embedding Model
    description: Google Gemini embedding model identifier.
    defaults: "text-embedding-004"

tasks:
  - id: rag_indexing_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Shared working directory for repository checkout and embedding generation.
    tasks:
      - id: clone_target_repository
        type: io.kestra.plugin.git.Clone
        description: Pull source code files from Git repository into execution workspace.
        url: "{{ inputs.git_repository }}"
        branch: "{{ inputs.git_branch }}"

      - id: generate_gemini_code_embeddings
        type: io.kestra.plugin.scripts.shell.Commands
        description: Scan code files, chunk content, generate embeddings with Gemini API, and store index.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.11-slim
        env:
          GEMINI_API_KEY: "{{ secret('GEMINI_API_KEY') }}"
          GEMINI_MODEL: "{{ inputs.gemini_model }}"
          FILE_EXTS: "{{ inputs.file_extensions }}"
        commands:
          - pip install --no-cache-dir google-genai
          - |
            python3 - << 'PYEOF'
            import os, glob, json
            from google import genai

            api_key = os.environ.get("GEMINI_API_KEY")
            model_name = os.environ.get("GEMINI_MODEL", "text-embedding-004")
            exts = [e.strip() for e in os.environ.get("FILE_EXTS", "").split(",") if e.strip()]

            client = genai.Client(api_key=api_key)

            indexed_files = []
            total_chunks = 0

            # Scan matching source files
            for root, _, files in os.walk("."):
                if ".git" in root:
                    continue
                for f in files:
                    if any(f.endswith(ext) for ext in exts):
                        full_path = os.path.join(root, f)
                        try:
                            with open(full_path, "r", encoding="utf-8", errors="ignore") as file_obj:
                                content = file_obj.read(4000) # Read initial chunk
                                if content.strip():
                                    indexed_files.append(full_path)
                                    total_chunks += 1
                        except Exception as e:
                            print(f"Skipping {full_path}: {e}")

            print(f"Discovered {len(indexed_files)} files to embed with Gemini {model_name}.")

            # Save indexing manifest artifact
            manifest = {
                "repository": os.environ.get("GIT_REPO", "repo"),
                "model": model_name,
                "total_files": len(indexed_files),
                "total_chunks": total_chunks,
                "indexed_files": indexed_files[:10]
            }

            with open("embedding_manifest.json", "w") as out:
                json.dump(manifest, out, indent=2)

            print("Embeddings manifest successfully generated.")
            PYEOF

      - id: parse_manifest_metrics
        type: io.kestra.plugin.scripts.python.Script
        description: Extract indexing metrics from manifest to feed downstream Slack notification.
        containerImage: python:3.11-slim
        script: |
          import json, os
          from kestra import Kestra

          total_files = 0
          total_chunks = 0

          if os.path.exists("embedding_manifest.json"):
              with open("embedding_manifest.json") as f:
                  data = json.load(f)
              total_files = data.get("total_files", 0)
              total_chunks = data.get("total_chunks", 0)

          Kestra.outputs({
              "total_files": total_files,
              "total_chunks": total_chunks
          })

  - id: notify_indexing_complete
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Broadcast semantic code search indexing status to Slack AI ops channel.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#ai-ops",
        "username": "Gemini Code RAG Indexer",
        "icon_emoji": ":robot_face:",
        "text": ":white_check_mark: *Codebase Gemini RAG Indexing Complete*\n• *Repository:* `{{ inputs.git_repository }}` (`{{ inputs.git_branch }}`)\n• *Embedding Model:* `{{ inputs.gemini_model }}`\n• *Files Processed:* `{{ outputs.parse_manifest_metrics.vars.total_files }}`\n• *Total Chunks:* `{{ outputs.parse_manifest_metrics.vars.total_chunks }}`\n• *Execution ID:* `{{ flow.executionId }}`"
      }

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert on RAG indexing pipeline or Gemini API failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#ai-ops",
        "username": "Gemini Indexer - Error",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: Codebase RAG Indexing Pipeline Failed*\n• *Flow:* `{{ flow.id }}`\n• *Failed Task:* `{{ task.id }}`\n• *Execution ID:* `{{ flow.executionId }}`"
      }

extend:
  title: "GitHub Codebase Gemini RAG Vector Embeddings Indexer"
  metaTitle: GitHub Codebase Gemini RAG Embeddings Indexer | Kestra
  shortDescription: Clone GitHub repository, parse source code files, generate embeddings with Google Gemini, and index for semantic search.
  metaDescription: Clone GitHub repositories, extract source code, compute vector embeddings with Google Gemini, and index semantic search marts with Slack reporting.
  description: |
    Building automated semantic code search and Retrieval-Augmented Generation (RAG) over engineering codebases requires continuous synchronization whenever repositories are updated.

    This blueprint orchestrates an automated code RAG indexing lifecycle:
    1. Clones the target GitHub code repository using `io.kestra.plugin.git.Clone`.
    2. Runs an isolated Docker container with the official Google GenAI Python SDK.
    3. Scans source code files across user-specified extensions (`.py`, `.ts`, `.go`, etc.), chunks file contents, and generates high-dimensional embeddings using Google Gemini (`text-embedding-004`).
    4. Compiles a vector manifest artifact and exports indexing metrics.
    5. Dispatches operational status summaries to Slack with dual-layer fallback alerting.

    ## Prerequisites
    - Google Gemini API key (`GEMINI_API_KEY`).
    - Slack Incoming Webhook URL (`SLACK_WEBHOOK_URL`).
  tags:
    - AI
    - Git
    - Data
  subTags:
    - Gemini
    - RAG
    - Vector Database
    - Slack
  ee: false
  demo: false
