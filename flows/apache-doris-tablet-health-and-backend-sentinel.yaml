id: apache-doris-tablet-health-and-backend-sentinel
namespace: company.data

inputs:
  - id: doris_fe_endpoint
    type: STRING
    displayName: Apache Doris Frontend HTTP Endpoint
    description: Base URL of the Apache Doris Frontend (FE) HTTP and Prometheus metrics endpoint.
    defaults: "http://localhost:8030"

  - id: max_allowed_unhealthy_tablets
    type: INT
    displayName: Maximum Allowed Unhealthy Tablets
    description: Threshold of unhealthy or under-replicated tablets allowed before raising a critical incident alert.
    defaults: 0

  - id: send_slack_alert
    type: BOOL
    displayName: Dispatch Slack Incident Alert
    description: Whether to transmit real-time Slack notifications upon tablet corruption or offline backend nodes.
    defaults: true

triggers:
  - id: doris_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recurring audit polling Apache Doris cluster health every 15 minutes.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_doris_metrics
    type: io.kestra.plugin.core.http.Request
    description: Query Apache Doris Frontend Prometheus metrics endpoint for tablet and backend health counters.
    uri: "{{ inputs.doris_fe_endpoint }}/metrics"
    method: GET
    headers:
      Accept: "text/plain"
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT5S
      maxAttempts: 3
    allowFailure: true

  - id: evaluate_cluster_health
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogate Doris Prometheus metrics text, extract unhealthy tablets and offline backends, and classify status.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      metrics.txt: "{{ outputs.probe_doris_metrics.body }}"
    script: |
      import re
      import json

      max_unhealthy = int({{ inputs.max_allowed_unhealthy_tablets }})

      try:
          with open("metrics.txt", "r") as f:
              raw = f.read()
      except Exception:
          raw = ""

      def extract_metric(pattern):
          matches = re.findall(pattern, raw)
          total = 0.0
          for m in matches:
              try:
                  total += float(m)
              except ValueError:
                  pass
          return total

      unhealthy_tablets = extract_metric(r'doris_fe_tablet_unhealthy_count(?:\{[^}]*\})?\s+([0-9\.]+)')
      backends_down = extract_metric(r'doris_fe_backends_down_count(?:\{[^}]*\})?\s+([0-9\.]+)')
      active_connections = extract_metric(r'doris_fe_connection_total(?:\{[^}]*\})?\s+([0-9\.]+)')

      if unhealthy_tablets == 0 and backends_down == 0:
          classification = "CLUSTER_OPTIMAL"
      elif unhealthy_tablets <= max_unhealthy and backends_down == 0:
          classification = "BACKEND_STRESS_WARNING"
      else:
          classification = "CRITICAL_TABLET_CORRUPTION"

      output_payload = {
          "outputs": {
              "unhealthy_tablets_count": int(unhealthy_tablets),
              "backends_down_count": int(backends_down),
              "active_connections": int(active_connections),
              "classification": classification
          }
      }
      print(f"::{json.dumps(output_payload)}::")

  - id: classify_cluster_status
    type: io.kestra.plugin.core.log.Log
    description: Log evaluated Apache Doris cluster health metrics and status classification.
    message: |
      Doris FE Endpoint: {{ inputs.doris_fe_endpoint }}
      Unhealthy Tablets: {{ outputs.evaluate_cluster_health.vars.unhealthy_tablets_count }}
      Backends Down: {{ outputs.evaluate_cluster_health.vars.backends_down_count }}
      Active Connections: {{ outputs.evaluate_cluster_health.vars.active_connections }}
      Classification: {{ outputs.evaluate_cluster_health.vars.classification }}

  - id: route_cluster_gate
    type: io.kestra.plugin.core.flow.Switch
    description: Route flow execution based on Apache Doris cluster health classification.
    value: "{{ outputs.evaluate_cluster_health.vars.classification }}"
    cases:
      CLUSTER_OPTIMAL:
        - id: log_optimal_state
          type: io.kestra.plugin.core.log.Log
          description: Log nominal verification confirming all Doris tablets and backends are healthy.
          message: "OPTIMAL: Apache Doris cluster reports zero unhealthy tablets and zero offline backends."

      BACKEND_STRESS_WARNING:
        - id: log_stress_advisory
          type: io.kestra.plugin.core.log.Log
          description: Log advisory warning when tablet replication stress falls within allowable limits.
          message: "WARNING: Elevated tablet replication latency detected on Doris cluster. Unhealthy tablets: {{ outputs.evaluate_cluster_health.vars.unhealthy_tablets_count }}."

      CRITICAL_TABLET_CORRUPTION:
        - id: alert_slack_tablet_corruption
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch urgent incident alert to data platform engineering channel.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": ":rotating_light: *CRITICAL Apache Doris Data Warehouse Tablet Alert*\n*Endpoint:* `{{ inputs.doris_fe_endpoint }}`\n*Unhealthy Tablets:* `{{ outputs.evaluate_cluster_health.vars.unhealthy_tablets_count }}`\n*Offline Backends:* `{{ outputs.evaluate_cluster_health.vars.backends_down_count }}`\n*Active Connections:* `{{ outputs.evaluate_cluster_health.vars.active_connections }}`\n*Execution:* <{{ flow.url }}|{{ execution.id }}>"
            }

        - id: remediation_fail_gate
          type: io.kestra.plugin.core.execution.Fail
          description: Fail execution to halt downstream ELT pipelines and prevent corrupt reporting consumption.

  - id: final_audit_log
    type: io.kestra.plugin.core.log.Log
    description: Record immutable audit log entry documenting Apache Doris cluster health verification.
    message: |
      [AUDIT] Apache Doris Tablet Health and Backend Sentinel completed.
      Endpoint: {{ inputs.doris_fe_endpoint }}
      Unhealthy Tablets: {{ outputs.evaluate_cluster_health.vars.unhealthy_tablets_count }}
      Backends Down: {{ outputs.evaluate_cluster_health.vars.backends_down_count }}
      Verdict: {{ outputs.evaluate_cluster_health.vars.classification }}

extend:
  title: Apache Doris Tablet Health and Backend Node Sentinel
  metaTitle: Apache Doris Tablet Health Sentinel | Kestra
  shortDescription: Audit Apache Doris unhealthy tablets and offline backends via Prometheus metrics, triggering Slack alerts.
  metaDescription: Audit Apache Doris MPP data warehouse tablet health and offline backends via Prometheus metrics, classify severity, and trigger Slack alerts on tablet errors.
  description: |
    Automated real-time analytical warehouse sentinel that interrogates Apache Doris Frontend Prometheus metrics on a recurring schedule to audit tablet replication health, detect offline Backend (BE) storage nodes, classify cluster degradation severity, and dispatch Slack incident alerts before real-time ingestion pipelines stall.

    ## How it works

    1. A schedule trigger activates every fifteen minutes to audit the Apache Doris Frontend instance.
    2. An HTTP request task queries the Frontend's `/metrics` Prometheus endpoint to harvest real-time tablet replication counters and storage backend statuses.
    3. An embedded Python script parses metric lines, extracting `doris_fe_tablet_unhealthy_count`, `doris_fe_backends_down_count`, and active client connection volume.
    4. An informational log task records evaluated warehouse metrics and current cluster status classification.
    5. A `Switch` flow control task branches execution according to the evaluated status:
       - `CLUSTER_OPTIMAL`: Confirms all partition tablets are healthy and logs nominal storage telemetry.
       - `BACKEND_STRESS_WARNING`: Emits a non-blocking advisory notification when minor tablet re-balancing occurs within allowable thresholds.
       - `CRITICAL_TABLET_CORRUPTION`: Dispatches a detailed Slack incident webhook with unhealthy tablet tallies, offline backend counts, execution deep links, and halts execution via a failure gate.
    6. An immutable final audit log records the comprehensive health verdict and cluster metrics in Kestra execution history.

    ## What you get

    - Real-time data warehouse safeguards catching under-replicated tablets before analytical query performance degrades.
    - Automated detection of crashed or unreachable Doris Backend (BE) worker daemons.
    - Immediate Slack notifications alerting data engineering and DBA teams with exact offline node metrics.
    - Automated execution failure gates that halt dependent ELT and dbt transformation flows when storage backends degrade.
    - Complete, immutable audit records tracking analytical storage cluster health across batch windows.

    ## Who it's for

    - Data Platform Engineers and Database Administrators (DBAs) maintaining Apache Doris clusters.
    - Analytics Engineers relying on real-time Doris data ingestion for business intelligence and reporting.
    - Site Reliability Engineers (SREs) managing high-throughput analytical lakehouse infrastructure.

    ## Why orchestrate this with Kestra

    - Declarative YAML orchestrates metrics harvesting, text parsing, and incident dispatching without dedicated sidecar agents.
    - Native secret masking ensures Slack webhook URLs and administrative credentials remain confidential during automated runs.
    - Built-in conditional branching enables granular escalation policies tailored to tablet replication thresholds.
    - Centralized execution timelines provide instant diagnostic visibility into historical data warehouse failure patterns.

    ## Prerequisites

    - Running Apache Doris cluster (Frontend and Backend nodes) with the Prometheus metrics endpoint enabled (default port `8030`).
    - Network reachability between Kestra and the Doris Frontend HTTP interface.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to transmit critical data warehouse incident alerts.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace or environment variables.
    2. Import this blueprint into your Kestra instance under `company.data`.
    3. Run a manual test execution pointing to your Doris Frontend endpoint to verify metric connectivity and parsing.
    4. Enable the `doris_audit_schedule` trigger to maintain continuous 15-minute cluster monitoring.

    ## How to extend

    - Add an automated tablet repair trigger via Doris MySQL interface (`ADMIN REPAIR TABLE`) in the remediation branch.
    - Correlate unhealthy tablet counts with underlying Backend disk utilization metrics (`doris_be_disk_state`).
    - Route separate alerts to PagerDuty or Opsgenie when offline Backend nodes threaten cluster data durability.

    ## Links

    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/core/http/request)
    - [Apache Doris Metrics Reference](https://doris.apache.org/docs/admin-manual/metrics/)
    - [Apache Doris Architecture Overview](https://doris.apache.org/docs/summary/basic-summary/)
  tags:
    - Data
  subTags:
    - Data Warehouses
    - Monitoring & Alerting
  ee: false
  demo: false
