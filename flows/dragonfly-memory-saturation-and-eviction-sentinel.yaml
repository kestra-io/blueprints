id: dragonfly-memory-saturation-and-eviction-sentinel
namespace: company.cache

inputs:
  - id: dragonfly_host
    type: STRING
    required: true
    defaults: "dragonfly.internal.company.com"
    description: "Dragonfly instance hostname or service VIP"

  - id: dragonfly_port
    type: INT
    required: true
    defaults: 6379
    description: "Dragonfly RESP TCP port (default 6379)"

  - id: memory_threshold_pct
    type: INT
    required: true
    defaults: 85
    description: "Memory utilization warning threshold percentage (0-100)"

  - id: alert_on_evictions
    type: BOOLEAN
    required: true
    defaults: true
    description: "Trigger alert if evicted keys count is greater than zero"

  - id: slack_channel
    type: STRING
    required: true
    defaults: "#cache-ops"
    description: "Target Slack channel for Dragonfly capacity alerts"

triggers:
  - id: periodic_saturation_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"

tasks:
  - id: probe_dragonfly_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: "Connects to Dragonfly via RESP, extracts memory consumption, maxmemory boundaries, and eviction counts"
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install redis kestra
    env:
      DRAGONFLY_HOST: "{{ inputs.dragonfly_host }}"
      DRAGONFLY_PORT: "{{ inputs.dragonfly_port }}"
      DRAGONFLY_PASSWORD: "{{ secret('DRAGONFLY_PASSWORD') }}"
      THRESHOLD_PCT: "{{ inputs.memory_threshold_pct }}"
    script: |
      import os
      import sys
      import redis
      from kestra import Kestra

      host = os.environ.get("DRAGONFLY_HOST", "localhost")
      port = int(os.environ.get("DRAGONFLY_PORT", 6379))
      password = os.environ.get("DRAGONFLY_PASSWORD", None)
      if password == "":
          password = None
      threshold = int(os.environ.get("THRESHOLD_PCT", 85))

      client = redis.Redis(
          host=host,
          port=port,
          password=password,
          socket_connect_timeout=10,
          socket_timeout=10,
          decode_responses=True
      )

      server_info = client.info(section="server")
      memory_info = client.info(section="memory")
      stats_info = client.info(section="stats")

      # Extract Dragonfly & Redis-compatible telemetry
      dragonfly_version = server_info.get("dragonfly_version", server_info.get("redis_version", "unknown"))
      used_memory = int(memory_info.get("used_memory", 0))
      maxmemory = int(memory_info.get("maxmemory", 0))
      used_memory_human = memory_info.get("used_memory_human", f"{used_memory}B")
      maxmemory_human = memory_info.get("maxmemory_human", f"{maxmemory}B")
      evicted_keys = int(stats_info.get("evicted_keys", 0))
      total_keys = client.dbsize()
      connected_clients = int(server_info.get("connected_clients", 0))

      if maxmemory > 0:
          saturation_pct = round((used_memory / maxmemory) * 100, 2)
      else:
          # Unlimited or uncapped memory configuration
          saturation_pct = 0.0

      is_saturated = saturation_pct >= threshold
      is_evicting = evicted_keys > 0

      if is_saturated and is_evicting:
          status = "CRITICAL_SATURATION_AND_EVICTIONS"
          runbook = "Severe memory saturation with active key drops. Increase Dragonfly container memory limit (--maxmemory) or purge stale cache namespaces immediately."
      elif is_saturated:
          status = "WARNING_MEMORY_SATURATION"
          runbook = f"Memory usage ({saturation_pct}%) breached safe ceiling ({threshold}%). Plan memory scaling or review TTL policies for unexpiring datasets."
      elif is_evicting:
          status = "WARNING_EVICTIONS_DETECTED"
          runbook = f"Eviction count is {evicted_keys}. Ensure transient volatile keys have strict TTLs to prevent premature eviction of warm cache entries."
      else:
          status = "HEALTHY"
          runbook = "Memory consumption within safe operating thresholds."

      Kestra.outputs({
          "dragonfly_version": dragonfly_version,
          "used_memory_bytes": used_memory,
          "maxmemory_bytes": maxmemory,
          "used_memory_human": used_memory_human,
          "maxmemory_human": maxmemory_human,
          "saturation_pct": saturation_pct,
          "evicted_keys": evicted_keys,
          "total_keys": total_keys,
          "connected_clients": connected_clients,
          "is_saturated": is_saturated,
          "is_evicting": is_evicting,
          "status": status,
          "runbook": runbook
      })

  - id: evaluate_saturation_state
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates if memory saturation threshold is breached or cache eviction activity is detected"
    condition: "{{ outputs.probe_dragonfly_metrics.vars.is_saturated == true or (inputs.alert_on_evictions == true and outputs.probe_dragonfly_metrics.vars.is_evicting == true) }}"
    then:
      - id: notify_slack_memory_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches high-urgency alert to Slack with memory metrics and recommended runbook action"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "⚠️ *DRAGONFLY CAPACITY SENTINEL ALERT*\n*Status:* `{{ outputs.probe_dragonfly_metrics.vars.status }}`\n*Endpoint:* `{{ inputs.dragonfly_host }}:{{ inputs.dragonfly_port }}` (v{{ outputs.probe_dragonfly_metrics.vars.dragonfly_version }})\n*Memory Saturation:* {{ outputs.probe_dragonfly_metrics.vars.saturation_pct }}% ({{ outputs.probe_dragonfly_metrics.vars.used_memory_human }} / {{ outputs.probe_dragonfly_metrics.vars.maxmemory_human }})\n*Threshold:* {{ inputs.memory_threshold_pct }}%\n*Evicted Keys:* {{ outputs.probe_dragonfly_metrics.vars.evicted_keys }}\n*Total Key Count:* {{ outputs.probe_dragonfly_metrics.vars.total_keys }}\n*Runbook Action:* {{ outputs.probe_dragonfly_metrics.vars.runbook }}\n*Execution:* `{{ execution.id }}`"
          }

    else:
      - id: log_healthy_metrics
        type: io.kestra.plugin.core.log.Log
        description: "Records healthy status and resource telemetry when operating below capacity limits"
        message: "Dragonfly at {{ inputs.dragonfly_host }}:{{ inputs.dragonfly_port }} is healthy. Memory utilization: {{ outputs.probe_dragonfly_metrics.vars.saturation_pct }}% ({{ outputs.probe_dragonfly_metrics.vars.used_memory_human }}/{{ outputs.probe_dragonfly_metrics.vars.maxmemory_human }}). Evicted keys: {{ outputs.probe_dragonfly_metrics.vars.evicted_keys }}."

  - id: finalize_capacity_telemetry
    type: io.kestra.plugin.core.output.OutputValues
    description: "Publishes final structured telemetry for audit history and trend monitoring"
    values:
      execution_id: "{{ execution.id }}"
      host: "{{ inputs.dragonfly_host }}"
      saturation_pct: "{{ outputs.probe_dragonfly_metrics.vars.saturation_pct }}"
      used_memory_human: "{{ outputs.probe_dragonfly_metrics.vars.used_memory_human }}"
      maxmemory_human: "{{ outputs.probe_dragonfly_metrics.vars.maxmemory_human }}"
      evicted_keys: "{{ outputs.probe_dragonfly_metrics.vars.evicted_keys }}"
      status: "{{ outputs.probe_dragonfly_metrics.vars.status }}"

errors:
  - id: notify_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alerts SRE channel if the diagnostic probe fails to connect or query Dragonfly"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "🚨 *DRAGONFLY SENTINEL PROBE FAILED*\n*Target:* `{{ inputs.dragonfly_host }}:{{ inputs.dragonfly_port }}`\n*Failure:* Sentinel was unable to collect RESP metrics or authenticate to the Dragonfly instance.\n*Execution ID:* `{{ execution.id }}`\n*Flow:* `{{ flow.id }}`"
      }

extend:
  title: Dragonfly In-Memory Datastore Saturation and Eviction Sentinel
  metaTitle: Dragonfly In-Memory Datastore Saturation and Eviction Sentinel
  shortDescription: Probes Dragonfly memory saturation, tracks key evictions, and dispatches Slack capacity alerts before OOM outages occur.
  metaDescription: Probes Dragonfly memory saturation and key eviction rates with automated Slack alerting and actionable capacity runbooks.
  description: |
    Dragonfly delivers multi-threaded, high-throughput in-memory data storage as a modern alternative to Redis and Memcached. However, unchecked dataset growth, uncapped caching, or missing time-to-live (TTL) configurations can silently exhaust instance memory limits (`maxmemory`), leading to unexpected key evictions, degraded hit rates, or write errors (`OOM command not allowed`).

    This blueprint provides an automated sentinel that periodically probes Dragonfly via the RESP protocol, measures actual memory saturation against allocated limits, inspects eviction counters, and routes contextual capacity warnings to Slack before cache degradation impacts user-facing services.

    ## How it works

    1. **Scheduled Probing**: The `periodic_saturation_check` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates a sentinel scan every 10 minutes.
    2. **RESP Metric Inspection**: The `probe_dragonfly_metrics` task (`io.kestra.plugin.scripts.python.Script` running inside Docker) connects to the target Dragonfly instance, extracts `INFO memory` and `INFO stats` counters, calculates saturation percentages, and assesses key eviction trends.
    3. **Threshold Gate**: The `evaluate_saturation_state` task (`io.kestra.plugin.core.flow.If`) checks whether memory saturation exceeds `memory_threshold_pct` or if key evictions have occurred:
       - **Alert Path**: Dispatches a rich alert card via `notify_slack_memory_alert` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) containing current memory utilization, total key counts, and specific SRE runbook steps.
       - **Healthy Path**: Logs normal status through `log_healthy_metrics` (`io.kestra.plugin.core.log.Log`) for historical trend tracking.
    4. **Telemetry Export**: The `finalize_capacity_telemetry` task (`io.kestra.plugin.core.output.OutputValues`) exposes clean outputs for external dashboards and capacity audit logs.
    5. **Failure Safeguard**: An `errors` handler (`notify_probe_failure`) ensures immediate Slack notifications if Dragonfly becomes unreachable, network connectivity fails, or authentication credentials expire.

    ## What you get

    - Early detection of memory leaks and unexpiring key spikes before application writes fail.
    - Visibility into cache eviction behavior to safeguard critical warm data.
    - Automated Slack alerting with specific mitigation actions (e.g., scaling `--maxmemory` or auditing TTL policies).
    - Unbroken execution history and metrics logging in Kestra.

    ## Who it's for

    - Site Reliability Engineers (SREs) and DevOps teams managing Dragonfly clusters in production.
    - Backend developers relying on high-performance caching layers for low-latency APIs.
    - Platform engineers migrating workloads from Redis to multi-threaded Dragonfly.

    ## Why orchestrate this with Kestra

    Kestra simplifies infrastructure monitoring by combining scheduled cron triggers, containerized script execution, conditional branching, and enterprise Slack notifications without needing a heavyweight monitoring agent. If a network partition or credentials rotation causes the probe to fail, Kestra captures detailed execution logs and triggers fallback alerts automatically.

    ## Prerequisites

    - A running Dragonfly instance accessible over the network.
    - A Slack Incoming Webhook URL configured with permission to post to the alert channel.
    - Docker enabled on Kestra workers to run the Python probe container.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Incoming Webhook URL for the target Slack workspace.
    - `DRAGONFLY_PASSWORD`: (Optional) AUTH password for protected Dragonfly instances.

    ## Quick start

    1. Store your `SLACK_WEBHOOK_URL` and `DRAGONFLY_PASSWORD` in your Kestra namespace secrets.
    2. Add this blueprint to your Kestra instance under namespace `company.cache`.
    3. Trigger a manual execution with your Dragonfly hostname and port to verify connectivity and telemetry outputs.
    4. Enable the `periodic_saturation_check` trigger to begin continuous 10-minute capacity surveillance.

    ## How to extend

    - Add automated scaling: invoke cloud provider APIs (AWS ECS/EKS or GCP Cloud Run) to increase Dragonfly memory limits dynamically.
    - Incorporate PagerDuty or Opsgenie notifications for critical saturation emergencies where evictions are actively dropping keys.
    - Add an automated key sampling task (`SCAN` or `MEMORY USAGE`) to identify the top memory-consuming keys or cache namespaces.

    ## Links

    - [Dragonfly Official Documentation](https://www.dragonflydb.io/docs)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Redis Protocol (RESP) Reference](https://redis.io/docs/reference/protocol-spec/)
    - This blueprint has been created by [Pranjulchaurasiya](https://github.com/Pranjulchaurasiya)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Database & Storage
  ee: false
  demo: false
