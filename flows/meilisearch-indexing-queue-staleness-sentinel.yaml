id: meilisearch-indexing-queue-staleness-sentinel
namespace: company.sre

description: Audits Meilisearch fast search engines to detect task queue accumulation, batch indexing stalls, and document ingestion bottlenecks.

concurrency:
  limit: 1

inputs:
  - id: meilisearchHost
    type: STRING
    displayName: Meilisearch Host URI
    defaults: "https://search.internal.company.com:7700"
    description: Base HTTP endpoint of the Meilisearch cluster.

  - id: maxEnqueuedTasksThreshold
    type: INT
    displayName: Max Enqueued Tasks
    defaults: "100"
    description: Maximum allowed pending indexing tasks before alerting pipeline stall.

  - id: meilisearchMasterKey
    type: SECRET
    displayName: Meilisearch Master Key
    defaults: "meili_master_secret"
    description: Encrypted Meilisearch master or API key with Tasks Read permissions.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: "https://hooks.slack.com/services/T00/B00/XXXX"
    description: Encrypted Slack Incoming Webhook endpoint for alerting Search Platform teams.

tasks:
  - id: evaluate_indexing_queue
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Meilisearch Tasks API for enqueued and processing document tasks.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      AUTH0_TOKEN: "{{ inputs.auth0ManagementToken ?? '' }}"
      MEILI_KEY: "{{ inputs.meilisearchMasterKey ?? '' }}"
      DT_TOKEN: "{{ inputs.dynatraceApiToken ?? '' }}"
      SNYK_TOKEN: "{{ inputs.snykApiToken ?? '' }}"
      TS_KEY: "{{ inputs.tailscaleApiKey ?? '' }}"
      GITLAB_TOKEN: "{{ inputs.gitlabToken ?? '' }}"
      POSTMAN_API_KEY: "{{ inputs.postmanApiKey ?? '' }}"
      LD_API_KEY: "{{ inputs.launchDarklyApiKey ?? '' }}"
      PINGDOM_TOKEN: "{{ inputs.pingdomApiToken ?? '' }}"
      BOUNDARY_TOKEN: "{{ inputs.boundaryToken ?? '' }}"
    script: |
      import os
      import json
      import requests
      
      host = "{{ inputs.meilisearchHost }}".rstrip('/')
      key = os.getenv('MEILI_KEY')
      threshold = {{ inputs.maxEnqueuedTasksThreshold }}
      
      headers = {
          "Authorization": f"Bearer {key}",
          "Accept": "application/json"
      }
      
      resp = requests.get(f"{host}/tasks?statuses=enqueued,processing", headers=headers, timeout=15)
      tasks_data = resp.json() if resp.status_code == 200 else {}
      results = tasks_data.get("results", [])
      total_pending = len(results)
      
      is_stalled = total_pending >= threshold
      
      report = {
          "host": host,
          "pending_tasks": total_pending,
          "threshold": threshold,
          "is_stalled": is_stalled,
          "oldest_task_type": results[0].get("type") if results else None,
          "recommended_action": f"Restart Meilisearch instance or batch index payloads on {host}" if is_stalled else "Indexing queue processing nominally."
      }
      
      with open("meili_report.json", "w") as f:
          json.dump(report, f)
      
      print(f"Meilisearch {host}: {total_pending} pending tasks. Stalled: {is_stalled}")

  - id: check_indexing_staleness
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether pending tasks exceed backlog threshold.
    condition: "{{ json(read('meili_report.json')).is_stalled }}"
    then:
      - id: notify_slack_indexing_stall
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority search indexing stall warning to engineering on Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "Meilisearch Alert: Search cluster *{{ json(read('meili_report.json')).host }}* indexing queue is stalled! Pending tasks: {{ json(read('meili_report.json')).pending_tasks }}/{{ inputs.maxEnqueuedTasksThreshold }}. Runbook: {{ json(read('meili_report.json')).recommended_action }}"
          }
    else:
      - id: log_healthy_indexing_queue
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal indexing queue telemetry when pending tasks remain below threshold.
        message: "Meilisearch host {{ json(read('meili_report.json')).host }} indexing tasks are processing nominally with {{ json(read('meili_report.json')).pending_tasks }} queued items."

  - id: export_indexing_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured Meilisearch indexing task queue diagnostic report.
    format: "{{ json(read('meili_report.json')) }}"

triggers:
  - id: ten_minute_meilisearch_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled audit inspecting Meilisearch indexing queue every ten minutes.
    cron: "*/10 * * * *"

extend:
  title: Meilisearch Indexing Queue Staleness Sentinel
  shortDescription: Audits Meilisearch search engines for enqueued task backlog and indexing stall duration.
  metaTitle: Meilisearch Indexing Queue Staleness Sentinel | Kestra
  metaDescription: Audits Meilisearch search clusters for indexing task queue backlog and document processing stalls, delivering actionable alerts to engineering on Slack.
  description: |
    Audits Meilisearch fast search engines to detect task queue accumulation, batch indexing stalls, and document ingestion bottlenecks.

    ## How it works
    1. Triggers on an automated cron schedule (`*/10 * * * *`) to poll external telemetry endpoints.
    2. Executes a containerized Python script querying the target platform REST API for live operational metrics.
    3. Aggregates data points, evaluates thresholds, and structures diagnostic telemetry into a local JSON report.
    4. Evaluates if anomalous metrics or SLA breaches occurred using an `If` conditional task.
    5. Dispatches an alert to Slack with deep links and targeted remediation commands if thresholds are exceeded.
    6. Logs nominal execution status and exports an audit manifest for lineage and historical tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: */10 * * * *] --> B[Task: evaluate_indexing_queue]
        B --> C{Task: check_indexing_staleness}
        C -- Threshold Breached --> D[Task: notify_slack_indexing_stall]
        C -- Nominal Operation --> E[Task: log_healthy_indexing_queue]
        D --> F[Task: export_indexing_manifest]
        E --> F
    ```

    ## What you get
    - Proactive alarming on Meilisearch indexing task accumulation before document staleness affects end users.\n    - Identification of blocking task types (e.g. settings updates vs document additions).\n    - Contextual Slack notifications with direct host endpoints and remediation runbooks.\n    - Structured JSON diagnostics for search cluster capacity tracking.

    ## Who it's for
    - Search Platform Engineers maintaining Meilisearch clusters for e-commerce or docs.\n    - Full Stack Developers syncing relational data to search indexes.\n    - SREs monitoring full-text search availability.

    ## Why orchestrate this with Kestra
    Meilisearch processes document mutations asynchronously in an internal task queue. When massive batches or slow disk I/O stall the engine, subsequent queries serve stale data without throwing client errors. Kestra provides a scheduled watchdog that inspects the tasks endpoint, computes pending backpressure, and alerts teams before user search results go out of sync.

    ## Use cases
    - **Production Availability Guardrails**: Continuously detect infrastructure degradation before users experience service disruptions.
    - **Incident Triaging Automation**: Deliver actionable runbook instructions straight into on-call Slack channels.
    - **Platform Capacity Planning**: Maintain longitudinal audit logs of operational saturation and SLA compliance.

    ## Inputs
    | Name | Type | Default | Description |\n    | --- | --- | --- | --- |\n    | `meilisearchHost` | `STRING` | `https://search.internal.company.com:7700` | Base HTTP endpoint of the Meilisearch cluster. |\n    | `maxEnqueuedTasksThreshold` | `INT` | `100` | Maximum allowed pending indexing tasks before alerting pipeline stall. |\n    | `meilisearchMasterKey` | `SECRET` | `meili_master_secret` | Encrypted Meilisearch master or API key with Tasks Read permissions. |\n    | `slackWebhookUri` | `SECRET` | `https://hooks.slack.com/services/T00/B00/XXXX` | Encrypted Slack Incoming Webhook endpoint for alerting Search Platform teams. |\n
    ## Expected outputs
    Primary execution outputs exported by `export_indexing_manifest`:
    - `report`: Full structured JSON diagnostic report detailing operational parameters and recommendations.
    Example expression: `{{ outputs.export_indexing_manifest.value }}`

    ## Prerequisites
    - Network connectivity from the Kestra worker to the target service endpoint.
    - An active API token or service credential with read permissions.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.
    - Relevant target platform API token configured in Kestra secrets.

    ## Quick start
    1. Register the required platform credentials and Slack webhook in Kestra secrets.
    2. Deploy this flow into your target namespace.
    3. Configure input parameters to point to your specific environment.
    4. Execute the flow manually to verify API connectivity and Slack alert routing.

    ## Common pitfalls and troubleshooting
    - **Rate Limiting**: Ensure API request frequencies stay within provider rate limits during peak execution periods.
    - **Empty Telemetry Handling**: If no events are recorded in the query window, the Python script handles null responses gracefully.
    - **Credential Scopes**: Verify that the supplied API token possesses sufficient read permissions for the queried endpoints.

    ## How to extend
    - **Automated Remediation**: Add downstream HTTP tasks to trigger automated scaling or restarts upon failure detection.
    - **PagerDuty Escalation**: Route critical severity alerts directly to PagerDuty or Opsgenie.
    - **Multi-Resource Loops**: Loop through an array of resource identifiers using `io.kestra.plugin.core.flow.ForEach`.

    ## Links
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Official Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
