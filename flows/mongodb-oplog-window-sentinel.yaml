id: mongodb-oplog-window-sentinel
namespace: company.dataops

inputs:
  - id: mongo_uri
    type: STRING
    defaults: mongodb://localhost:27017/?replicaSet=rs0
    description: MongoDB connection URI with replica set configuration.
  - id: min_oplog_window_hours_threshold
    type: FLOAT
    defaults: 24.0
    description: Minimum acceptable oplog window duration in hours before alerting.

tasks:
  - id: inspect_oplog_window
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        mongosh --quiet "{{ inputs.mongo_uri }}" --eval '
        const repl = rs.printReplicationInfo();
        const oplog = db.getSiblingDB("local").oplog.rs;
        const first = oplog.find().sort({$natural: 1}).limit(1).next();
        const last = oplog.find().sort({$natural: -1}).limit(1).next();
        let windowHours = 0;
        if (first && last && first.ts && last.ts) {
          const diffSec = last.ts.getTime() - first.ts.getTime();
          windowHours = diffSec / 3600.0;
        }
        print(JSON.stringify({
          oplog_window_hours: Math.round(windowHours * 100) / 100,
          is_insufficient: windowHours < {{ inputs.min_oplog_window_hours_threshold }}
        }));
        ' > oplog_stats.json
        python3 -c "
        import json
        with open('oplog_stats.json') as f:
            lines = [l.strip() for l in f if l.strip().startswith('{')]
            data = json.loads(lines[-1]) if lines else {'oplog_window_hours': 0, 'is_insufficient': True}
        with open('oplog_summary.json', 'w') as out:
            json.dump(data, out)
        print('MongoDB oplog audit:', data)
        "
    outputFiles:
      - oplog_summary.json

  - id: evaluate_oplog_safety
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.inspect_oplog_window.outputFiles['oplog_summary.json'])).is_insufficient }}"
    then:
      - id: alert_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *MongoDB Oplog Window Alert*: Oplog retention has shrunk to {{ json(read(outputs.inspect_oplog_window.outputFiles['oplog_summary.json'])).oplog_window_hours }} hours (threshold: {{ inputs.min_oplog_window_hours_threshold }} hours). High write throughput threatens replica desynchronization."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *MongoDB Sentinel Execution Failure*: Failed to query oplog metrics from MongoDB replica set."
      }

triggers:
  - id: scheduled_oplog_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: MongoDB Replica Set Oplog Window Headroom Sentinel
  shortDescription: Audits MongoDB replica set oplog duration to detect write volume surges and prevent secondary replica desynchronization.
  description: |
    ## How it works
    This sentinel connects to the MongoDB replica set primary using `mongosh` and evaluates the time difference between the oldest and newest entries in `local.oplog.rs`. It converts the oplog lifespan to hours and alerts DBAs when write spikes shrink the window below safe thresholds.

    ## What you get
    - Proactive visibility into MongoDB replication safety margins.
    - Prevention of full initial resync events caused by secondaries falling off the oplog.
    - Automated Slack incident delivery indicating exact oplog window duration in hours.

    ## Who it's for
    - Database administrators and backend engineers managing high-throughput MongoDB deployments.
    - SREs maintaining high-availability database replication.

    ## Why orchestrate this with Kestra
    Kestra automates database maintenance and health verifications, running scheduled diagnostic scripts with built-in credential management and alerting.

    ## Prerequisites
    - MongoDB replica set reachability with authentication credentials.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `mongo_uri` with your replica set connection string.
    3. Trigger a manual execution to check oplog headroom.

    ## How to extend
    - Query `rs.status()` to correlate oplog shrinkage with secondary replication lag.
    - Automatically resize the oplog collection via `replSetResizeOplog` when write throughput expands.
    - Export oplog duration metrics to CloudWatch or Datadog.

    ## Links
    - [MongoDB Oplog Size Documentation](https://www.mongodb.com/docs/manual/core/replica-set-oplog/)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
