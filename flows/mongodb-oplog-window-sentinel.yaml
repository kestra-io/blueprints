id: mongodb-oplog-window-sentinel
namespace: company.dataops

inputs:
  - id: mongo_uri
    type: STRING
    defaults: mongodb://localhost:27017/?replicaSet=rs0
    description: MongoDB connection URI with replica set configuration.
  - id: min_oplog_window_hours_threshold
    type: FLOAT
    defaults: 24.0
    description: Minimum acceptable oplog window duration in hours before alerting.

tasks:
  - id: inspect_oplog_window
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pymongo==4.15.3
      - kestra==2.0.0
    script: |
      from pymongo import MongoClient
      import sys
      from kestra import Kestra

      mongo_uri = "{{ inputs.mongo_uri }}"
      threshold = float("{{ inputs.min_oplog_window_hours_threshold }}")
      try:
          client = MongoClient(mongo_uri, serverSelectionTimeoutMS=5000)
          oplog = client["local"]["oplog.rs"]
          first = next(oplog.find().sort("$natural", 1).limit(1), None)
          last = next(oplog.find().sort("$natural", -1).limit(1), None)

          if not first or not last:
              raise RuntimeError("Could not retrieve oplog entries from local.oplog.rs")

          diff_sec = last["ts"].time - first["ts"].time
          window_hours = round(diff_sec / 3600.0, 2)
          is_insufficient = window_hours < threshold

          print(f"Oplog window hours: {window_hours}, threshold: {threshold}, is_insufficient: {is_insufficient}")

          Kestra.outputs({
              "oplog_window_hours": window_hours,
              "is_insufficient": is_insufficient
          })
      except Exception as e:
          print(f"Error inspecting MongoDB oplog window: {e}", file=sys.stderr)
          sys.exit(1)

  - id: evaluate_oplog_safety
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_oplog_window.vars.is_insufficient }}"
    then:
      - id: alert_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *MongoDB Oplog Window Alert*: Oplog retention has shrunk to {{ outputs.inspect_oplog_window.vars.oplog_window_hours }} hours (threshold: {{ inputs.min_oplog_window_hours_threshold }} hours). High write throughput threatens replica desynchronization."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *MongoDB Sentinel Execution Failure*: Failed to query oplog metrics from MongoDB replica set."
      }

triggers:
  - id: scheduled_oplog_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

outputs:
  - id: oplog_window_hours
    type: FLOAT
    value: "{{ outputs.inspect_oplog_window.vars.oplog_window_hours }}"
  - id: is_insufficient
    type: BOOLEAN
    value: "{{ outputs.inspect_oplog_window.vars.is_insufficient }}"

extend:
  metaDescription: "Audits MongoDB replica set oplog duration to detect write volume surges and prevent secondary replica desynchronization."
  metaTitle: MongoDB Replica Set Oplog Window Headroom Sentinel with Kestra
  title: MongoDB Replica Set Oplog Window Headroom Sentinel
  shortDescription: Audits MongoDB replica set oplog duration to detect write volume surges and prevent secondary replica desynchronization.
  description: |
    ## How it works
    This sentinel connects to the MongoDB replica set primary via a containerized Python script and evaluates the time difference between the oldest and newest entries in `local.oplog.rs`. It converts the oplog lifespan to hours and alerts DBAs when write spikes shrink the window below safe thresholds.

    ## What you get
    - Proactive visibility into MongoDB replication safety margins.
    - Prevention of full initial resync events caused by secondaries falling off the oplog.
    - Automated Slack incident delivery indicating exact oplog window duration in hours.

    ## Who it's for
    - Database administrators and backend engineers managing high-throughput MongoDB deployments.
    - SREs maintaining high-availability database replication.

    ## Why orchestrate this with Kestra
    Kestra automates database maintenance and health verifications, running scheduled diagnostic scripts with built-in credential management and alerting.

    ## Prerequisites
    - MongoDB replica set reachability with authentication credentials.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `mongo_uri` with your replica set connection string.
    3. Trigger a manual execution to check oplog headroom.

    ## How to extend
    - Query `rs.status()` to correlate oplog shrinkage with secondary replication lag.
    - Automatically resize the oplog collection via `replSetResizeOplog` when write throughput expands.
    - Export oplog duration metrics to CloudWatch or Datadog.

    ## Links
    - [MongoDB Oplog Size Documentation](https://www.mongodb.com/docs/manual/core/replica-set-oplog/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-script-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
