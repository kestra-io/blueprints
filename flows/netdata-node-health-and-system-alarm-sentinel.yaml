id: netdata-node-health-and-system-alarm-sentinel
namespace: company.infrastructure

description: |
  Continuously monitors Netdata real-time host metrics agents, audits active critical and warning alarms for CPU, memory, and disk saturation, and dispatches actionable Slack incident alerts upon node resource degradation.

inputs:
  - id: netdata_url
    type: STRING
    displayName: Netdata Endpoint URL
    defaults: "http://localhost:19999"
    description: "Base HTTP URL of the Netdata monitoring agent."

  - id: target_hostname
    type: STRING
    displayName: Target Hostname
    defaults: "prod-node-01"
    description: "Expected hostname identifier of the audited node."

  - id: slack_channel
    type: STRING
    displayName: SRE Alert Channel
    defaults: "#infra-alerts"
    description: "Slack channel for routing host alarm and node saturation alerts."

triggers:
  - id: scheduled_sentinel_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */1 * * *"
    disabled: true
    inputs:
      netdata_url: "http://localhost:19999"
      target_hostname: "prod-node-01"

tasks:
  - id: probe_node_info
    type: io.kestra.plugin.core.http.Request
    description: "Queries Netdata /api/v1/info to verify agent reachability, OS metadata, and system uptime."
    uri: "{{ inputs.netdata_url }}/api/v1/info"
    method: GET
    failedOnEmptyResponse: false

  - id: probe_active_alarms
    type: io.kestra.plugin.core.http.Request
    description: "Queries Netdata /api/v1/alarms?active to retrieve currently triggered critical and warning alarms."
    uri: "{{ inputs.netdata_url }}/api/v1/alarms?active"
    method: GET
    failedOnEmptyResponse: false

  - id: evaluate_node_alarms
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates Netdata agent responsiveness and active alarms using Pebble conditionals."
    value: |
      {% if outputs.probe_node_info.code != 200 %}
      AGENT_UNREACHABLE
      {% elseif outputs.probe_active_alarms.code != 200 %}
      ALARMS_API_ERROR
      {% elseif outputs.probe_active_alarms.body.alarms is not empty %}
      ALARMS_ACTIVE
      {% else %}
      COMPLIANT
      {% endif %}
    cases:
      COMPLIANT:
        - id: log_compliant_state
          type: io.kestra.plugin.core.log.Log
          level: INFO
          message: "Netdata agent at {{ inputs.netdata_url }} (host: {{ outputs.probe_node_info.body.hostname | default(inputs.target_hostname) }}) is healthy with zero active critical or warning alarms."

      ALARMS_ACTIVE:
        - id: alert_active_alarms
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "Netdata Host Alarm Triggered",
                  "text": "CRITICAL: Active system alarms detected on host `{{ outputs.probe_node_info.body.hostname | default(inputs.target_hostname) }}` via Netdata at `{{ inputs.netdata_url }}`.\nResource saturation or hardware thresholds have been exceeded. Review node dashboards immediately.",
                  "footer": "Kestra Sentinel | Infrastructure Reliability"
                }
              ]
            }
        - id: log_alarms_triggered
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "CRITICAL: Active alarms detected on node {{ outputs.probe_node_info.body.hostname | default(inputs.target_hostname) }}."

      AGENT_UNREACHABLE:
        - id: alert_agent_offline
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#E65100",
                  "title": "Netdata Agent Offline",
                  "text": "WARNING: Netdata monitoring agent at `{{ inputs.netdata_url }}` is unreachable (HTTP status `{{ outputs.probe_node_info.code }}`).\nHost telemetry and automated health evaluations are offline.",
                  "footer": "Kestra Sentinel | Infrastructure Reliability"
                }
              ]
            }
        - id: log_agent_offline
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "WARNING: Netdata agent at {{ inputs.netdata_url }} returned HTTP status {{ outputs.probe_node_info.code }}."

      ALARMS_API_ERROR:
        - id: alert_api_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#F57C00",
                  "title": "Netdata Alarms API Error",
                  "text": "WARNING: Netdata `/api/v1/alarms` query failed with HTTP status `{{ outputs.probe_active_alarms.code }}` on `{{ inputs.netdata_url }}`.",
                  "footer": "Kestra Sentinel | Infrastructure Reliability"
                }
              ]
            }

  - id: record_audit_log
    type: io.kestra.plugin.core.log.Log
    description: "Emits a permanent execution audit log recording node health status."
    level: INFO
    message: "Completed Netdata node health audit on {{ inputs.netdata_url }} for host {{ outputs.probe_node_info.body.hostname | default(inputs.target_hostname) }}. Info code={{ outputs.probe_node_info.code }}, Alarms code={{ outputs.probe_active_alarms.code }}."

extend:
  title: Netdata Node Health and System Alarm Sentinel
  metaTitle: Netdata Node Health and Alarm Sentinel | Kestra
  shortDescription: Audits Netdata host metrics agents, checks active CPU, memory, and disk alarms, and dispatches Slack incident alerts.
  metaDescription: Monitor Netdata node health, audit active system alarms, detect critical resource saturation, and dispatch automated Slack incident alerts with Kestra.
  description: |
    Continuously monitors Netdata real-time host metrics agents, audits active critical and warning alarms for CPU, memory, and disk saturation, and dispatches actionable Slack incident alerts upon node resource degradation.

    ## How it works

    1. A recurrent `Schedule` trigger initiates the sentinel audit workflow hourly (disabled initially for on-demand configuration).
    2. The `probe_node_info` task issues an HTTP request to `/api/v1/info` on the target Netdata agent to confirm agent reachability, operating system version, and system uptime.
    3. The `probe_active_alarms` task calls `/api/v1/alarms?active` to inspect real-time alarms covering CPU throttling, memory exhaustion, disk fill rates, and network interface drops.
    4. The `evaluate_node_alarms` task uses Pebble conditionals inside a `Switch` task to classify health into `COMPLIANT`, `ALARMS_ACTIVE`, `AGENT_UNREACHABLE`, or `ALARMS_API_ERROR`.
    5. If active alarms are detected, contextual incident notifications are sent via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` to notify infrastructure teams, and an execution audit record is preserved in Kestra's execution history.

    ## What you get

    - Automated operational surveillance across Kubernetes worker nodes and standalone Linux instances.
    - Rapid detection of runaway processes causing CPU starvation or memory pressure.
    - Early warning against disk fill rate exhaustion before application volumes enter read-only mode.
    - Contextual Slack alerts directing on-call engineers to the affected hostname and metrics endpoint.
    - Revision-controlled, searchable execution history providing an immutable operational audit log.

    ## Who it's for

    - Platform Engineers and SREs maintaining fleet-wide Linux infrastructure and Kubernetes clusters.
    - DevOps Teams operating automated deployment pipelines requiring node health verification.
    - System Administrators governing server resource saturation and hardware metrics.

    ## Why orchestrate this with Kestra

    - **Declarative Host Governance**: Define node monitoring cadences, target hostnames, and notification channels in revision-controlled YAML blueprints.
    - **Native Secret Isolation**: Inject Slack incoming webhook credentials securely using Kestra namespace secrets via `{{ secret(...) }}` without plaintext exposure.
    - **Multi-Branch Flow Routing**: Isolate complete agent connectivity drops from active resource alarms using built-in `Switch` tasks.
    - **Auditable Execution Telemetry**: Maintain complete execution logs and HTTP diagnostic status codes across every audit run.

    ## Prerequisites

    - A running Netdata monitoring agent (accessible over HTTP) with the REST API enabled (default port 19999).
    - Network reachability from the Kestra worker or runner environment to the Netdata HTTP endpoint.
    - A Slack Incoming Webhook URL configured with permission to post into your target operations channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for routing operational alerts and incidents.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance (e.g., under namespace `company.infrastructure`).
    3. Click **Execute** with default parameters or supply your custom `netdata_url` and `target_hostname`.
    4. Verify that execution logs display successful HTTP 200 response codes under the **Executions** tab.
    5. Activate the `scheduled_sentinel_audit` trigger to establish recurrent automated node health monitoring.

    ## How to extend

    - **Multi-Node Sweep**: Wrap the node info and alarm probes inside a `ForEach` task to evaluate an entire cluster fleet in a single workflow.
    - **Automated Cordon and Drain**: Extend the `ALARMS_ACTIVE` branch with a Kubernetes API task to cordon the saturated node and evict non-critical workloads.
    - **PagerDuty Escalation**: Route `ALARMS_ACTIVE` events directly to on-call schedules in PagerDuty or Opsgenie.
    - **Deployment Health Gate**: Chain this flow as a pre-flight deployment gate in CI/CD pipelines to prevent scheduling workloads onto saturated hosts.

    ## Links

    - [Netdata Documentation](https://learn.netdata.cloud/)
    - [Netdata GitHub Repository](https://github.com/netdata/netdata)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
