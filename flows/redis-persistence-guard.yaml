id: redis-persistence-guard
namespace: company.team

description: |
  Check that a Redis instance used as a data store really persists what it holds: read INFO
  persistence and the save / appendonly configuration, flag an instance with no persistence at
  all, a failed BGSAVE or AOF write, or a snapshot older than allowed while keys keep changing.
  Alert Slack, and optionally turn on the required persistence with CONFIG SET, trigger a
  BGSAVE, wait for it to finish, and read INFO again to verify.

inputs:
  - id: host
    type: STRING
    displayName: Redis host
    defaults: "localhost"

  - id: port
    type: INT
    displayName: Redis port
    defaults: 6379

  - id: required
    type: SELECT
    displayName: Required persistence
    values:
      - RDB
      - AOF
      - RDB_AND_AOF
    defaults: RDB_AND_AOF

  - id: rdb_save_policy
    type: STRING
    displayName: RDB save policy to apply
    description: Value set with CONFIG SET save when RDB is required but disabled. Redis' own default.
    defaults: "3600 1 300 100 60 10000"

  - id: max_snapshot_age_minutes
    type: INT
    displayName: Maximum snapshot age (minutes)
    description: With RDB enabled, a last successful save older than this while keys have changed is flagged.
    defaults: 120

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for CONFIG SET and BGSAVE to run.
    defaults: true

  - id: network
    type: STRING
    displayName: Docker network for redis-cli
    description: Network of the redis-cli container. Leave empty to use Docker's default bridge.
    defaults: ""

tasks:
  - id: info
    type: io.kestra.plugin.redis.cli.RedisCLI
    description: Read-only.
    host: "{{ inputs.host }}"
    port: "{{ inputs.port }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.network }}"
    commands:
      - INFO persistence

  - id: save_config
    type: io.kestra.plugin.redis.cli.RedisCLI
    description: Read-only.
    host: "{{ inputs.host }}"
    port: "{{ inputs.port }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.network }}"
    commands:
      - CONFIG GET save

  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    description: INFO persistence parsed into a map, plus the save policy.
    values:
      info: "{{ outputs.info.vars.command_1 | replace({'\\\\n': '\n', '\\n': '\n'}) | split('\n') | jq('map(select(contains(\":\")) | split(\":\") | {(.[0]): (.[1:] | join(\":\") | gsub(\"\\r\"; \"\"))}) | add') | first | toJson }}"
      save: "{{ outputs.save_config.vars.command_1 | replace({'\\\\n': '\n', '\\n': '\n'}) | split('\n') | jq('.[1] // \"\"') | first }}"

  - id: findings
    type: io.kestra.plugin.core.output.OutputValues
    values:
      items: >-
        {{ {'i': fromJson(outputs.state.values.info), 'save': outputs.state.values.save, 'req': inputs.required, 'now': (now() | timestamp), 'maxAge': inputs.max_snapshot_age_minutes * 60} | jq('
           (.i.aof_enabled == "1") as $aof | (.save | length > 0) as $rdb
           | [ (if ($aof | not) and ($rdb | not) then {code: "NO_PERSISTENCE", detail: "save is empty and appendonly is off: every key is lost on restart"} else empty end),
               (if (.req | test("AOF")) and ($aof | not) then {code: "AOF_REQUIRED_OFF", detail: "appendonly is off"} else empty end),
               (if (.req | test("RDB")) and ($rdb | not) then {code: "RDB_REQUIRED_OFF", detail: "save is empty"} else empty end),
               (if .i.rdb_last_bgsave_status != "ok" then {code: "BGSAVE_FAILED", detail: "rdb_last_bgsave_status=\(.i.rdb_last_bgsave_status)"} else empty end),
               (if $aof and .i.aof_last_write_status != "ok" then {code: "AOF_WRITE_FAILED", detail: "aof_last_write_status=\(.i.aof_last_write_status)"} else empty end),
               (if $rdb and (.i.rdb_changes_since_last_save | tonumber) > 0 and (.now - (.i.rdb_last_save_time | tonumber)) > .maxAge
                then {code: "STALE_SNAPSHOT", detail: "last save \((.now - (.i.rdb_last_save_time | tonumber)) / 60 | floor | tostring | sub("\\.0$"; "")) min ago, \(.i.rdb_changes_since_last_save) changes since"} else empty end) ]') | first | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Redis {{ inputs.host }}:{{ inputs.port }} persistence: appendonly {{ fromJson(outputs.state.values.info).aof_enabled == '1' ? 'on' : 'off' }},
      save "{{ outputs.state.values.save }}", {{ fromJson(outputs.state.values.info).rdb_changes_since_last_save }} changes since the last save.
      Findings: {{ fromJson(outputs.findings.values.items) | jq('if length == 0 then "none" else map("\(.code) (\(.detail))") | join(", ") end') | first }}.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.findings.values.items) | length > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Redis ' ~ inputs.host ~ ':' ~ inputs.port ~ ' is not persisting as required (' ~ inputs.required ~ '): ' ~ (fromJson(outputs.findings.values.items) | jq('map("\(.code): \(.detail)") | join("; ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Enabling persistence now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: enable_aof
            type: io.kestra.plugin.redis.cli.RedisCLI
            runIf: "{{ inputs.required contains 'AOF' and fromJson(outputs.state.values.info).aof_enabled != '1' }}"
            host: "{{ inputs.host }}"
            port: "{{ inputs.port }}"
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.network }}"
            commands:
              - CONFIG SET appendonly yes

          - id: enable_rdb
            type: io.kestra.plugin.redis.cli.RedisCLI
            runIf: "{{ inputs.required contains 'RDB' and outputs.state.values.save | length == 0 }}"
            host: "{{ inputs.host }}"
            port: "{{ inputs.port }}"
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.network }}"
            commands:
              - CONFIG SET save "{{ inputs.rdb_save_policy }}"

          - id: bgsave
            type: io.kestra.plugin.redis.cli.RedisCLI
            description: Take a snapshot now, so the data already in memory is on disk without waiting for the save policy.
            host: "{{ inputs.host }}"
            port: "{{ inputs.port }}"
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.network }}"
            commands:
              - BGSAVE

          - id: wait_for_save
            type: io.kestra.plugin.core.flow.LoopUntil
            description: Poll INFO until the background save has finished and nothing is left unsaved.
            condition: >-
              {{ outputs.poll.vars.command_1 is defined and outputs.poll.vars.command_1 contains 'rdb_bgsave_in_progress:0'
                 and outputs.poll.vars.command_1 contains 'rdb_changes_since_last_save:0' and outputs.poll.vars.command_1 contains 'rdb_last_bgsave_status:ok' }}
            checkFrequency:
              interval: PT2S
              maxIterations: 30
            tasks:
              - id: poll
                type: io.kestra.plugin.redis.cli.RedisCLI
                host: "{{ inputs.host }}"
                port: "{{ inputs.port }}"
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.network }}"
                commands:
                  - INFO persistence

          - id: reinfo
            type: io.kestra.plugin.redis.cli.RedisCLI
            host: "{{ inputs.host }}"
            port: "{{ inputs.port }}"
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.network }}"
            commands:
              - INFO persistence

          - id: resave_config
            type: io.kestra.plugin.redis.cli.RedisCLI
            host: "{{ inputs.host }}"
            port: "{{ inputs.port }}"
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.network }}"
            commands:
              - CONFIG GET save

          - id: after
            type: io.kestra.plugin.core.output.OutputValues
            values:
              info: "{{ outputs.reinfo.vars.command_1 | replace({'\\\\n': '\n', '\\n': '\n'}) | split('\n') | jq('map(select(contains(\":\")) | split(\":\") | {(.[0]): (.[1:] | join(\":\") | gsub(\"\\r\"; \"\"))}) | add') | first | toJson }}"
              save: "{{ outputs.resave_config.vars.command_1 | replace({'\\\\n': '\n', '\\n': '\n'}) | split('\n') | jq('.[1] // \"\"') | first }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            condition: >-
              {{ (inputs.required contains 'AOF' and fromJson(outputs.after.values.info).aof_enabled != '1')
                 or (inputs.required contains 'RDB' and outputs.after.values.save | length == 0)
                 or fromJson(outputs.after.values.info).rdb_last_bgsave_status != 'ok'
                 or fromJson(outputs.after.values.info).rdb_changes_since_last_save != '0' }}
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "Persistence still not as required after remediation: {{ outputs.after.values.info }}"
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Persistence verified: appendonly {{ fromJson(outputs.after.values.info).aof_enabled == '1' ? 'on' : 'off' }}, save "{{ outputs.after.values.save }}",
                  last BGSAVE ok with 0 changes since. CONFIG SET is lost on restart unless redis.conf has the same settings: run CONFIG REWRITE or update your config.
    else:
      - id: persisting
        type: io.kestra.plugin.core.log.Log
        message: "Redis {{ inputs.host }}:{{ inputs.port }} persists as required ({{ inputs.required }})."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Redis persistence guard failed on ' ~ inputs.host ~ ':' ~ inputs.port ~ ' (execution ' ~ execution.id ~ '). Persistence state unknown, check the logs.'} | toJson }}

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode.
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Redis Persistence Guard
  shortDescription: Check that a Redis instance really persists its data (RDB, AOF or both), catch failed saves and stale snapshots, alert Slack, and optionally enable persistence, force a BGSAVE and verify it.
  metaTitle: Redis Persistence Guard for RDB and AOF with Kestra
  metaDescription: Detect Redis instances with no persistence, failed BGSAVE or AOF writes and stale snapshots, alert Slack, enable persistence and verify with INFO.
  description: |
    Redis is often used as more than a cache: session stores, rate limiters, job queues, feature flags. Then the persistence settings matter. They are easy to get wrong:
    - an image started with `--save ""`;
    - `appendonly` left at its default `no`;
    - a disk that filled up so `BGSAVE` has been failing for days.

    Nothing complains until the instance restarts, and every key is gone.

    This blueprint reads `INFO persistence` and the `save` configuration with `redis-cli` and checks them against the persistence you require. It alerts Slack when Redis is not persisting as required. It can also turn persistence on with `CONFIG SET`, force a `BGSAVE`, poll until it completes and read `INFO` again to verify.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Rule |
    |---|---|
    | `NO_PERSISTENCE` | `save` is empty and `appendonly` is off: every key is lost on restart |
    | `AOF_REQUIRED_OFF` / `RDB_REQUIRED_OFF` | The required mechanism is disabled |
    | `BGSAVE_FAILED` | `rdb_last_bgsave_status` is not `ok`, usually a full disk or a permission problem |
    | `AOF_WRITE_FAILED` | `aof_last_write_status` is not `ok` |
    | `STALE_SNAPSHOT` | RDB is on, but the last save is older than `max_snapshot_age_minutes` while keys have changed |

    ## How it works

    1. `info` and `save_config` (`io.kestra.plugin.redis.cli.RedisCLI`, read-only) run `INFO persistence` and `CONFIG GET save`. `state` parses them.
    2. `findings` checks them in one jq expression. `summary` logs the result every run.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **persisting:** logs it.
       - **findings:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `enable_aof` and `enable_rdb` run `CONFIG SET appendonly yes` and `CONFIG SET save "<policy>"` only where needed, then `bgsave` takes a snapshot of what is already in memory.
         - `wait_for_save` (`io.kestra.plugin.core.flow.LoopUntil`) polls `INFO` every 2 seconds until the save has finished with no unsaved change.
         - `verify_result` reads `INFO` and `save` again, and fails if anything is still off.
    4. `errors` alerts Slack when the flow fails, for example on an unreachable host.

    Each `RedisCLI` task runs a single command. `CONFIG SET` lasts until the next restart: the final log reminds you to run `CONFIG REWRITE` or update `redis.conf`.

    ## What you get

    - A persistence check that reads Redis itself, not the config file you think it uses.
    - Findings for no persistence, a disabled required mechanism, failed saves and stale snapshots.
    - A remediation that enables persistence, forces a snapshot, waits for it and verifies it.

    ## Who it's for

    - Teams that use Redis for sessions, queues, rate limits or feature flags, where losing the data is an outage.
    - Platform teams running many Redis instances started from different images and charts.
    - Teams evaluating the Redis plugin who want an example of `RedisCLI` driving checks and changes.

    ## Why orchestrate this with Kestra

    `INFO persistence` answers the question for one instance at one moment. Kestra runs it on a schedule, turns the answer into a Slack alert, gates the change, polls the background save with `LoopUntil` until it is really on disk, and keeps a history that shows when an instance stopped persisting.

    ## Tested end to end

    On Kestra 2.0.5 OSS against Redis 7 containers started with and without persistence, with a local HTTP sink standing in for Slack.

    | Run | Target | Result |
    |---|---|---|
    | 1 | 500 keys, `--save ""`, `--appendonly no` | `NO_PERSISTENCE`, `AOF_REQUIRED_OFF`, `RDB_REQUIRED_OFF`. Alert sent |
    | 2 | same, dry run | Same findings, `CONFIG GET appendonly` still `no` |
    | 3 | same, remediate | AOF and RDB enabled, `BGSAVE` awaited and verified. After `docker restart`, all 520 keys are back |
    | 4 | control: no persistence, not remediated | After `docker restart`, 0 keys |
    | 5 | started with AOF and RDB | Persisting as required, no alert |
    | 6 | RDB, a write 1 minute after the last save, `max_snapshot_age_minutes: 0` | `STALE_SNAPSHOT` |
    | 7 | unknown host | `errors` alert sent |

    ## Prerequisites

    - A Redis instance reachable from the Docker containers the `RedisCLI` tasks start. `CONFIG` must not be renamed or disabled for remediation.
    - Local testing: `docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --save "" --appendonly no`.
    - For a password or ACL user, add `password: "{{ secret('REDIS_PASSWORD') }}"` (and `username`) to each `RedisCLI` task.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block. In Kestra OSS, provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `host` / `port` | `localhost` / `6379` | Redis instance |
    | `required` | `RDB_AND_AOF` | `RDB`, `AOF` or both |
    | `rdb_save_policy` | `3600 1 300 100 60 10000` | Applied when RDB is required but off |
    | `max_snapshot_age_minutes` | `120` | Stale snapshot threshold |
    | `auto_remediate` | `false` | Allow `CONFIG SET` and `BGSAVE` |
    | `dry_run` | `true` | Must be `false` for a change to apply |
    | `network` | empty | Docker network for the `redis-cli` containers |

    The `every_15_minutes` trigger is shipped disabled and always runs in safe mode.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Import the flow and set `host`, `port`, `required` and, if Redis runs in Docker, `network`.
    3. Run it once and read the findings.
    4. Run it with `auto_remediate: true` and `dry_run: false` to enable persistence, then write the same settings to `redis.conf`.
    5. Enable the `every_15_minutes` trigger, which always runs in safe mode.

    ## How to extend

    - Loop over a list of hosts to check every instance in one execution.
    - Add `CONFIG REWRITE` after `verify_result` when your instances run with a writable config file.
    - Check replicas too, with `INFO replication`, and alert when a replica is disconnected.
    - Copy the RDB file to object storage after the verified `BGSAVE` for an off-host backup.

    ## Links

    - Redis persistence: https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/
    - Redis plugin: https://kestra.io/plugins/plugin-redis
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
