id: opensearch-ism-managed-index-failed-step-sentinel
namespace: company.search
inputs:
- id: opensearch_url
  type: STRING
  defaults: https://opensearch.internal:9200
  description: Base URL of the OpenSearch cluster.
- id: index_pattern
  type: STRING
  defaults: logs-*
  description: Index pattern to audit for Index State Management (ISM) failures.
tasks:
- id: inspect_ism_status
  type: io.kestra.plugin.scripts.python.Script
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
  - pip install requests kestra
  env:
    OPENSEARCH_URL: '{{ inputs.opensearch_url }}'
    INDEX_PATTERN: '{{ inputs.index_pattern }}'
    OPENSEARCH_USER: '{{ secret(''OPENSEARCH_USER'') }}'
    OPENSEARCH_PASSWORD: '{{ secret(''OPENSEARCH_PASSWORD'') }}'
  script: "import os\nimport sys\nimport requests\nfrom requests.auth import HTTPBasicAuth\n\
    from kestra import Kestra\n\nopensearch_url = os.environ.get(\"OPENSEARCH_URL\"\
    , \"https://opensearch.internal:9200\").rstrip(\"/\")\nindex_pattern = os.environ.get(\"\
    INDEX_PATTERN\", \"logs-*\")\nuser = os.environ.get(\"OPENSEARCH_USER\", \"\"\
    )\npassword = os.environ.get(\"OPENSEARCH_PASSWORD\", \"\")\n\nauth = HTTPBasicAuth(user,\
    \ password) if user or password else None\nurl = f\"{opensearch_url}/_plugins/_ism/explain/{index_pattern}\"\
    \n\ntry:\n    resp = requests.get(url, auth=auth, verify=False, timeout=12)\n\
    \    resp.raise_for_status()\n    payload = resp.json()\nexcept Exception as err:\n\
    \    sys.stderr.write(f\"Failed to query OpenSearch ISM explain endpoint from\
    \ {url}: {err}\\n\")\n    sys.exit(1)\n\nfailed_indexes = []\nfor idx_name, idx_info\
    \ in payload.items():\n    if isinstance(idx_info, dict):\n        step_status\
    \ = idx_info.get(\"step\", {}).get(\"step_status\", \"\")\n        if step_status\
    \ == \"failed\":\n            failed_indexes.append(idx_name)\n\nfailed_count\
    \ = len(failed_indexes)\nis_breach = failed_count > 0\nsample_indexes = \", \"\
    .join(failed_indexes[:5])\n\nKestra.outputs({\n    \"is_breach\": is_breach,\n\
    \    \"failed_count\": failed_count,\n    \"sample_indexes\": sample_indexes\n\
    })\n"
- id: evaluate_ism_health
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.inspect_ism_status.vars.is_breach }}'
  then:
  - id: notify_search_team
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: "{\n  \"channel\": \"#search-alerts\",\n  \"attachments\": [\n    {\n\
      \      \"color\": \"danger\",\n      \"title\": \"\U0001F6A8 OpenSearch ISM\
      \ Policy Step Failure Alert\",\n      \"text\": \"Detected {{ outputs.inspect_ism_status.vars.failed_count\
      \ }} index(es) with failed Index State Management (ISM) policy steps in pattern\
      \ {{ inputs.index_pattern }}. Sample Indexes: {{ outputs.inspect_ism_status.vars.sample_indexes\
      \ }}. Rollover, rollover-shrink, or cold tier migration is halted.\",\n    \
      \  \"footer\": \"Kestra Search Sentinel \u2022 OpenSearch\"\n    }\n  ]\n}"
errors:
- id: alert_pipeline_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: "{\n  \"channel\": \"#search-alerts\",\n  \"attachments\": [\n    {\n \
    \     \"color\": \"danger\",\n      \"title\": \"\u26A0\uFE0F OpenSearch ISM Sentinel\
    \ Failure\",\n      \"text\": \"Failed to communicate with OpenSearch ISM endpoint\
    \ at {{ inputs.opensearch_url }}.\",\n      \"footer\": \"Kestra Failure Sentinel\"\
    \n    }\n  ]\n}\n"
triggers:
- id: periodic_schedule
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 * * * *
  disabled: true
extend:
  metaDescription: Audits OpenSearch ISM managed indexes to detect failed rollover
    and cold storage migration policy steps.
  metaTitle: OpenSearch Index State Management Failed Policy Step Sentinel with Kestra
  ee: false
  demo: false
  title: OpenSearch Index State Management Failed Policy Step Sentinel
  shortDescription: Audits OpenSearch ISM managed indexes to detect failed rollover
    and cold storage migration policy steps.
  description: '## How it works

    This workflow queries the OpenSearch Index State Management (ISM) explain API
    (`/_plugins/_ism/explain/{pattern}`) to audit the lifecycle execution state across
    all managed indexes matching a target pattern. In log analytics and enterprise
    search architectures, ISM automates lifecycle transitions such as hot-to-warm
    rollover, force-merging shards, and cold tier migration. When rollover aliases
    are misconfigured, disk thresholds are exceeded, or read-only blocks prevent snapshot
    creation, ISM steps enter a `failed` status and halt. This sentinel detects stalled
    indexes and delivers Slack notifications before hot storage exhausts.


    ## What you get

    - Real-time tracking of OpenSearch ISM lifecycle policy execution.

    - Protection against hot tier disk saturation caused by stalled rollovers.

    - Automated Slack incident notifications listing affected index names.


    ## Who it''s for

    - Search and Logging Platform Engineers managing OpenSearch clusters.

    - SREs safeguarding cluster storage headroom and shard distribution.

    - DevOps Teams operating automated log rotation infrastructure.


    ## Why orchestrate this with Kestra

    - **Automated Lifecycle Auditing**: Executes periodic hourly checks without standalone
    exporters.

    - **Encrypted Credential Protection**: Secures OpenSearch admin credentials in
    Kestra''s encrypted vault.

    - **Automated Incident Remediation**: Can trigger an ISM retry call (`POST /_plugins/_ism/retry/{index}`)
    via API.


    ## Prerequisites

    - OpenSearch cluster with ISM plugin enabled.

    - Administrative credentials stored in `OPENSEARCH_USER` and `OPENSEARCH_PASSWORD`
    secrets.

    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.


    ## Quick start

    1. Import this blueprint into your Kestra workspace.

    2. Add `OPENSEARCH_USER`, `OPENSEARCH_PASSWORD`, and `SLACK_WEBHOOK` secrets.

    3. Specify `opensearch_url` and target `index_pattern`.

    4. Enable the schedule trigger for continuous lifecycle surveillance.


    ## How to extend

    - Trigger an automatic retry of failed ISM steps via `POST /_plugins/_ism/retry/{index}`.

    - Correlate with underlying disk storage headroom metrics.

    - Route high-severity lifecycle alerts to PagerDuty or Opsgenie.


    ## Links

    - [OpenSearch ISM API Documentation](https://opensearch.org/docs/latest/im-plugin/ism/api/)

    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)

    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)

    '
  tags:
  - Data
  - Infrastructure
  subTags:
  - ELT & Data Landing
  - Day 2 Operations
outputs:
- id: is_breach
  type: BOOLEAN
  value: '{{ outputs.inspect_ism_status.vars.is_breach }}'
- id: failed_count
  type: INT
  value: '{{ outputs.inspect_ism_status.vars.failed_count }}'
- id: sample_indexes
  type: STRING
  value: '{{ outputs.inspect_ism_status.vars.sample_indexes }}'
