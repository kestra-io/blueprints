id: opensearch-ism-managed-index-failed-step-sentinel
namespace: company.search

inputs:
  - id: opensearch_url
    type: STRING
    defaults: "https://opensearch.internal:9200"
    description: Base URL of the OpenSearch cluster.
  - id: index_pattern
    type: STRING
    defaults: "logs-*"
    description: Index pattern to audit for Index State Management (ISM) failures.

tasks:
  - id: inspect_ism_status
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query OpenSearch ISM explain endpoint for managed index failures
        curl -s -k -u "{{ secret('OPENSEARCH_USER') }}:{{ secret('OPENSEARCH_PASSWORD') }}" \
          "{{ inputs.opensearch_url }}/_plugins/_ism/explain/{{ inputs.index_pattern }}" > /tmp/ism_explain.json

        python3 -c "
        import json
        try:
            with open('/tmp/ism_explain.json') as f:
                data = json.load(f)
            failed_indexes = []
            for idx_name, idx_info in data.items():
                if isinstance(idx_info, dict):
                    step_status = idx_info.get('step', {}).get('step_status', '')
                    if step_status == 'failed':
                        failed_indexes.append(idx_name)
            is_breach = 1 if len(failed_indexes) > 0 else 0
            print(f'{is_breach}|{len(failed_indexes)}|{\", \".join(failed_indexes[:5])}')
        except Exception:
            print('0|0|')
        " > /tmp/ism_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/ism_summary.txt)
        FAILED_COUNT=$(cut -d '|' -f 2 /tmp/ism_summary.txt)
        SAMPLE_INDEXES=$(cut -d '|' -f 3 /tmp/ism_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=failed_count::${FAILED_COUNT:-0}::"
        echo "::set-output name=sample_indexes::$SAMPLE_INDEXES::"

  - id: evaluate_ism_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_ism_status.vars.is_breach | int == 1 }}"
    then:
      - id: notify_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#search-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 OpenSearch ISM Policy Step Failure Alert",
                "text": "Detected {{ outputs.inspect_ism_status.vars.failed_count }} index(es) with failed Index State Management (ISM) policy steps in pattern {{ inputs.index_pattern }}. Sample Indexes: {{ outputs.inspect_ism_status.vars.sample_indexes }}. Rollover, rollover-shrink, or cold tier migration is halted.",
                "footer": "Kestra Search Sentinel • OpenSearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#search-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ OpenSearch ISM Sentinel Failure",
            "text": "Failed to communicate with OpenSearch ISM endpoint at {{ inputs.opensearch_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: OpenSearch Index State Management Failed Policy Step Sentinel
  shortDescription: Audits OpenSearch ISM managed indexes to detect failed rollover and cold storage migration policy steps.
  description: |
    ## How it works
    This workflow queries the OpenSearch Index State Management (ISM) explain API (`/_plugins/_ism/explain/{pattern}`) to audit the lifecycle execution state across all managed indexes matching a target pattern. In log analytics and enterprise search architectures, ISM automates lifecycle transitions such as hot-to-warm rollover, force-merging shards, and cold tier migration. When rollover aliases are misconfigured, disk thresholds are exceeded, or read-only blocks prevent snapshot creation, ISM steps enter a `failed` status and halt. This sentinel detects stalled indexes and delivers Slack notifications before hot storage exhausts.

    ## What you get
    - Real-time tracking of OpenSearch ISM lifecycle policy execution.
    - Protection against hot tier disk saturation caused by stalled rollovers.
    - Automated Slack incident notifications listing affected index names.

    ## Who it's for
    - Search and Logging Platform Engineers managing OpenSearch clusters.
    - SREs safeguarding cluster storage headroom and shard distribution.
    - DevOps Teams operating automated log rotation infrastructure.

    ## Why orchestrate this with Kestra
    - **Automated Lifecycle Auditing**: Executes periodic hourly checks without standalone exporters.
    - **Encrypted Credential Protection**: Secures OpenSearch admin credentials in Kestra's encrypted vault.
    - **Automated Incident Remediation**: Can trigger an ISM retry call (`POST /_plugins/_ism/retry/{index}`) via API.

    ## Prerequisites
    - OpenSearch cluster with ISM plugin enabled.
    - Administrative credentials stored in `OPENSEARCH_USER` and `OPENSEARCH_PASSWORD` secrets.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `OPENSEARCH_USER`, `OPENSEARCH_PASSWORD`, and `SLACK_WEBHOOK` secrets.
    3. Specify `opensearch_url` and target `index_pattern`.
    4. Enable the schedule trigger for continuous lifecycle surveillance.

    ## How to extend
    - Trigger an automatic retry of failed ISM steps via `POST /_plugins/_ism/retry/{index}`.
    - Correlate with underlying disk storage headroom metrics.
    - Route high-severity lifecycle alerts to PagerDuty or Opsgenie.

    ## Links
    - [OpenSearch ISM API Documentation](https://opensearch.org/docs/latest/im-plugin/ism/api/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
