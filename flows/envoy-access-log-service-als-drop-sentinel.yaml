id: envoy-access-log-service-als-drop-sentinel
namespace: company.team

description: |
  Audits Envoy proxy telemetry to detect gRPC Access Log Service (ALS) stream drops, buffer overruns, and telemetry connection resets across service mesh clusters.

concurrency:
  limit: 1

inputs:
  - id: envoy_metrics_url
    type: STRING
    displayName: "Envoy Admin Metrics URL"
    defaults: "http://envoy-ingress.ingress.svc.cluster.local:9901"
    description: "Base HTTP URL exposing administrative Prometheus metrics for the Envoy edge proxy or sidecar."

  - id: envoy_cluster_id
    type: STRING
    displayName: "Envoy Cluster Identifier"
    defaults: "edge-gateway-cluster"
    description: "Target Envoy edge proxy or service mesh gateway under active access log audit."

  - id: max_dropped_logs_threshold
    type: INT
    displayName: "Max Dropped Access Logs Threshold"
    defaults: 50
    description: "Maximum allowable dropped gRPC access log records within the lookback window before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which ALS telemetry drops and buffer overflows are evaluated."

  - id: alert_on_als_drops
    type: BOOL
    displayName: "Alert On ALS Drops"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting gRPC access log telemetry drops."

tasks:
  - id: scan_envoy_als_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Envoy admin Prometheus metrics to calculate ALS buffer drops, flushed records, and gRPC connection errors.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      METRICS_URL: "{{ inputs.envoy_metrics_url }}"
      CLUSTER_ID: "{{ inputs.envoy_cluster_id }}"
      MAX_DROPS: "{{ inputs.max_dropped_logs_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      import json
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://envoy:9901").rstrip("/")
      cluster_id = os.environ.get("CLUSTER_ID", "envoy-gateway")
      max_drops = int(os.environ.get("MAX_DROPS", "50"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      dropped_logs = 0
      flushed_logs = 0
      stream_errors = 0

      try:
          resp = requests.get(f"{metrics_url}/stats/prometheus", timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "envoy_access_log_dropped" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      dropped_logs += int(float(match.group(1)))
              elif "envoy_access_log_flushed" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      flushed_logs += int(float(match.group(1)))
              elif "envoy_grpc_access_log_stream_failure" in line or "envoy_tcp_access_log_dropped" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      stream_errors += int(float(match.group(1)))
      except Exception as err:
          print(f"CRITICAL: Failed to reach Envoy admin metrics endpoint at {metrics_url}: {err}", file=sys.stderr)
          sys.exit(1)

      total_logs = dropped_logs + flushed_logs
      drop_rate_pct = round((float(dropped_logs) / float(total_logs if total_logs > 0 else 100000)) * 100.0, 4)
      is_breached = bool(dropped_logs >= max_drops or stream_errors > 5)
      now_iso = datetime.now(timezone.utc).isoformat()

      report = {
          "cluster_id": cluster_id,
          "dropped_logs": dropped_logs,
          "flushed_logs": flushed_logs,
          "stream_errors": stream_errors,
          "drop_rate_percent": drop_rate_pct,
          "is_alerting": is_breached
      }

      with open("envoy_als_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Envoy ALS Complete: Cluster={cluster_id}, Dropped={dropped_logs}, Flushed={flushed_logs}, StreamErr={stream_errors}, Alert={is_breached}")

      Kestra.outputs({
          "dropped_access_logs_count": dropped_logs,
          "flushed_access_logs_count": flushed_logs,
          "stream_errors_count": stream_errors,
          "drop_rate_percent": drop_rate_pct,
          "is_alerting": is_breached,
          "envoy_cluster_target": cluster_id,
          "audit_timestamp": now_iso
      })
    outputFiles:
      - envoy_als_report.json

  - id: evaluate_als_drop_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether observed Envoy ALS dropped log records or gRPC stream failures exceed operational tolerance bounds.
    condition: "{{ outputs.scan_envoy_als_metrics.vars.is_alerting and inputs.alert_on_als_drops }}"
    then:
      - id: notify_slack_mesh_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident card to Service Mesh SRE Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#service-mesh-alerts",
            "username": "Envoy-ALS-Sentinel",
            "text": "CRITICAL: Envoy Access Log Service (ALS) telemetry drops detected on `{{ inputs.envoy_cluster_id }}`! Dropped logs: `{{ outputs.scan_envoy_als_metrics.vars.dropped_access_logs_count }}`, Stream errors: `{{ outputs.scan_envoy_als_metrics.vars.stream_errors_count }}`."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#service-mesh-alerts",
        "username": "Envoy-ALS-Sentinel",
        "text": "CRITICAL: Envoy Access Log Service Sentinel pipeline failed on `{{ inputs.envoy_cluster_id }}`. Execution ID: `{{ execution.id }}`."
      }

triggers:
  - id: periodic_als_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing Envoy ALS drop counters every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: Envoy Access Log Service ALS Drop Sentinel
  metaTitle: Envoy Access Log Service ALS Drop Sentinel Blueprint
  shortDescription: Audits Envoy proxy metrics to detect gRPC Access Log Service stream drops and buffer overruns.
  metaDescription: Audits Envoy proxy metrics to detect gRPC Access Log Service stream drops, buffer overruns, and telemetry connection resets.
  description: |
    Production service meshes and edge API gateways rely on Envoy's gRPC Access Log Service (ALS) to stream real-time access events to centralized observability stacks. Under heavy traffic surges or downstream collector latency, Envoy's in-memory access log buffer fills up, causing silent event dropping. This sentinel interrogates Envoy Prometheus metrics, isolates buffer drops and stream failures, and alerts SRE teams on Slack.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_als_audit Schedule Trigger] --> B[scan_envoy_als_metrics Python Script]
      B --> C{ALS Drops Exceeded?}
      C -- Yes --> D[notify_slack_mesh_team Webhook]
      C -- No --> E[Logs Streaming Nominal]
    ```

    ## Prerequisites
    - Envoy administrative endpoint reachable over HTTP.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `envoy_metrics_url` and `envoy_cluster_id`.
    3. Run manually to check ALS stream health.

    ## Links
    - [Envoy Access Log Service Documentation](https://www.envoyproxy.io/docs/envoy/latest/api-v3/extensions/access_loggers/grpc/v3/als.proto)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
    - Network
  ee: false
  demo: false
