id: ai-disaster-early-warning
namespace: io.kestra.examples

description: >
  An early-warning workflow that evaluates environmental risk signals
  and generates an actionable disaster-risk alert.

extend:
  title: AI Disaster Early Warning System
  description: >
    Combine environmental indicators into a simple disaster-risk
    assessment and generate an early warning when risk becomes significant.
  metaDescription: >
    Evaluate environmental risk signals and generate actionable early warnings.
  tags:
    - AI
    - Infrastructure
    - System
  ee: false
  demo: true

inputs:
  - id: rainfall
    type: FLOAT
    defaults: 80.0
    description: Rainfall intensity in millimeters per hour.

  - id: soil_moisture
    type: FLOAT
    defaults: 70.0
    description: Soil moisture percentage.

  - id: water_level
    type: FLOAT
    defaults: 60.0
    description: Water level percentage.

tasks:
  - id: calculate_risk_score
    type: io.kestra.plugin.core.debug.Return
    format: >
      Rainfall={{ inputs.rainfall }},
      SoilMoisture={{ inputs.soil_moisture }},
      WaterLevel={{ inputs.water_level }}

  - id: assess_risk
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.rainfall >= 80 or inputs.soil_moisture >= 70 or inputs.water_level >= 60 }}"
    then:
      - id: high_risk_alert
        type: io.kestra.plugin.core.debug.Return
        format: "HIGH RISK: Environmental conditions require immediate attention."

      - id: send_sms_alert
        type: io.kestra.plugin.twilio.notify.sms.Send
        accountSID: "{{ secret('TWILIO_ACCOUNT_SID') }}"
        authToken: "{{ secret('TWILIO_AUTH_TOKEN') }}"
        to: "{{ secret('ALERT_PHONE_NUMBER') }}"
        from: "{{ secret('TWILIO_FROM_NUMBER') }}"
        body: "DISASTER EARLY WARNING: High environmental risk detected. Rainfall={{ inputs.rainfall }}, Soil Moisture={{ inputs.soil_moisture }}, Water Level={{ inputs.water_level }}."

    else:
      - id: normal_conditions
        type: io.kestra.plugin.core.debug.Return
        format: "NORMAL: No immediate disaster warning is required."

triggers:
  - id: hourly_risk_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
