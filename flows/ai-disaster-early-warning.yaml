id: ai-disaster-early-warning
namespace: io.kestra.examples

description: |
  A reusable environmental disaster early-warning workflow that evaluates
  rainfall, soil moisture, and water-level measurements against configurable
  warning thresholds. It classifies the situation as HIGH, MODERATE, or NORMAL
  risk and can optionally send an SMS alert through Twilio.

extend:
  title: Environmental Disaster Early Warning System
  shortDescription: >
    Monitor rainfall, soil moisture, and water levels to identify environmental
    risks and optionally send high-risk alerts through Twilio SMS.
  description: |
    # Environmental Disaster Early Warning System

    This Blueprint evaluates rainfall intensity, soil moisture, and water-level
    measurements against configurable warning and critical thresholds. It
    classifies conditions as HIGH, MODERATE, or NORMAL risk and can optionally
    notify an emergency contact through Twilio SMS.

    ## How it works

    1. Provide environmental measurements and warning thresholds as workflow inputs.
    2. Compare rainfall, soil moisture, and water levels against critical thresholds.
    3. Generate a HIGH RISK alert if any critical threshold is reached.
    4. Otherwise, classify the situation as MODERATE if any warning threshold is reached.
    5. Report NORMAL CONDITIONS when all indicators remain below warning thresholds.
    6. Optionally send an SMS notification when high risk is detected and SMS is enabled.
    7. Run the assessment automatically every hour using the schedule trigger.

    ## What you get

    - Configurable measurements and warning and critical thresholds.
    - Separate HIGH, MODERATE, and NORMAL risk assessment paths.
    - Human-readable alert messages containing the environmental measurements.
    - Optional Twilio SMS notifications for high-risk conditions.
    - An hourly schedule trigger for recurring risk assessments.

    ## Who it's for

    - Teams monitoring flood and heavy-rainfall risks.
    - Environmental monitoring and disaster-response teams.
    - Operators tracking river, reservoir, and water-level conditions.
    - Teams exploring soil-moisture indicators for landslide risk monitoring.
    - Infrastructure and community safety monitoring initiatives.

    ## Why orchestrate this with Kestra

    Kestra organizes the assessment into reusable workflow tasks, supports
    configurable inputs, and routes execution through conditional branches.
    The schedule trigger supports recurring assessments, while the optional
    notification task integrates the workflow with Twilio. This makes the
    assessment easier to adapt, operate, and extend as monitoring needs evolve.

    ## Prerequisites

    The risk assessment can run without Twilio credentials when SMS is disabled.

    ### Secrets

    To enable SMS notifications, configure these Kestra secrets:

    - `TWILIO_ACCOUNT_SID`
    - `TWILIO_AUTH_TOKEN`
    - `TWILIO_FROM_NUMBER`
    - `ALERT_PHONE_NUMBER`

    Set `enable_sms` to `true` only after the required secrets and phone numbers
    have been configured.

    ## Quick start

    1. Import the Blueprint into your Kestra namespace.
    2. Set the rainfall, soil-moisture, and water-level inputs for your scenario.
    3. Adjust the warning and critical thresholds to match your monitoring needs.
    4. Run the flow manually to inspect the resulting risk assessment.
    5. Configure the required Twilio secrets and enable SMS if notifications are needed.
    6. Review the hourly schedule trigger before using it for recurring assessments.

    ## How to extend

    - Connect rainfall, soil-moisture, and water-level inputs to real monitoring systems.
    - Adjust thresholds for local environmental conditions and validated operating procedures.
    - Add persistence or reporting tasks to retain assessment history.
    - Integrate additional notification channels for relevant response teams.
    - Add location metadata and escalation rules for monitored areas.

    ## Links

    - [Kestra documentation](https://kestra.io/docs)
    - [Kestra Blueprint catalog](https://kestra.io/blueprints)

  tags:
    - AI
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
  metaTitle: Environmental Disaster Early Warning System
  metaDescription: >
    Reusable Kestra workflow for monitoring rainfall, soil moisture, and
    water-level signals and generating configurable early-warning alerts.

inputs:
  - id: rainfall
    type: FLOAT
    defaults: 80.0
    description: >
      Current rainfall intensity in millimeters per hour.

  - id: rainfall_warning
    type: FLOAT
    defaults: 50.0
    description: >
      Rainfall threshold at which moderate risk begins.

  - id: rainfall_critical
    type: FLOAT
    defaults: 80.0
    description: >
      Rainfall threshold at which high risk is declared.

  - id: soil_moisture
    type: FLOAT
    defaults: 70.0
    description: >
      Current soil moisture percentage.

  - id: soil_moisture_warning
    type: FLOAT
    defaults: 60.0
    description: >
      Soil moisture threshold at which moderate risk begins.

  - id: soil_moisture_critical
    type: FLOAT
    defaults: 70.0
    description: >
      Soil moisture threshold at which high risk is declared.

  - id: water_level
    type: FLOAT
    defaults: 60.0
    description: >
      Current water level percentage.

  - id: water_level_warning
    type: FLOAT
    defaults: 50.0
    description: >
      Water level threshold at which moderate risk begins.

  - id: water_level_critical
    type: FLOAT
    defaults: 60.0
    description: >
      Water level threshold at which high risk is declared.

  - id: enable_sms
    type: BOOL
    defaults: false
    description: >
      Enable SMS notifications when a high-risk condition is detected.
      Set to true only after configuring the required Twilio secrets.

tasks:
  - id: assess_risk
    type: io.kestra.plugin.core.flow.If
    description: >
      Determine whether any monitored environmental indicator has reached
      its critical threshold.
    condition: >-
      {{
        inputs.rainfall >= inputs.rainfall_critical
        or inputs.soil_moisture >= inputs.soil_moisture_critical
        or inputs.water_level >= inputs.water_level_critical
      }}
    then:
      - id: high_risk_alert
        type: io.kestra.plugin.core.debug.Return
        description: >
          Generate a high-risk alert containing the environmental measurements.
        format: |
          HIGH RISK ALERT

          Environmental conditions have reached a critical threshold.

          Rainfall: {{ inputs.rainfall }} mm/h
          Soil moisture: {{ inputs.soil_moisture }}%
          Water level: {{ inputs.water_level }}%

          Immediate assessment and response are recommended.

      - id: notify_high_risk
        type: io.kestra.plugin.core.flow.If
        description: >
          Send an SMS only when notifications have been explicitly enabled.
        condition: "{{ inputs.enable_sms }}"
        then:
          - id: send_sms_alert
            type: io.kestra.plugin.twilio.notify.sms.Send
            description: >
              Send a high-risk environmental warning to the configured
              emergency contact.
            accountSID: "{{ secret('TWILIO_ACCOUNT_SID') }}"
            authToken: "{{ secret('TWILIO_AUTH_TOKEN') }}"
            from: "{{ secret('TWILIO_FROM_NUMBER') }}"
            to: "{{ secret('ALERT_PHONE_NUMBER') }}"
            body: |
              DISASTER EARLY WARNING

              HIGH RISK detected.

              Rainfall: {{ inputs.rainfall }} mm/h
              Soil moisture: {{ inputs.soil_moisture }}%
              Water level: {{ inputs.water_level }}%

              Immediate assessment is recommended.
        else:
          - id: sms_disabled
            type: io.kestra.plugin.core.debug.Return
            format: >
              HIGH RISK detected. SMS notification is disabled.
              Set enable_sms=true to enable Twilio notifications.
    else:
      - id: assess_moderate_risk
        type: io.kestra.plugin.core.flow.If
        description: >
          Determine whether any environmental indicator has reached
          a warning threshold.
        condition: >-
          {{
            inputs.rainfall >= inputs.rainfall_warning
            or inputs.soil_moisture >= inputs.soil_moisture_warning
            or inputs.water_level >= inputs.water_level_warning
          }}
        then:
          - id: moderate_risk_alert
            type: io.kestra.plugin.core.debug.Return
            description: >
              Record a moderate-risk condition for continued monitoring.
            format: |
              MODERATE RISK

              One or more environmental indicators have reached
              a warning threshold.

              Rainfall: {{ inputs.rainfall }} mm/h
              Soil moisture: {{ inputs.soil_moisture }}%
              Water level: {{ inputs.water_level }}%

              Continue monitoring and prepare for escalation if
              conditions deteriorate.
        else:
          - id: normal_conditions
            type: io.kestra.plugin.core.debug.Return
            description: >
              Record that all monitored indicators are below warning thresholds.
            format: |
              NORMAL CONDITIONS

              No monitored environmental indicator has reached
              its warning threshold.

              Rainfall: {{ inputs.rainfall }} mm/h
              Soil moisture: {{ inputs.soil_moisture }}%
              Water level: {{ inputs.water_level }}%

triggers:
  - id: hourly_risk_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: >
      Run the environmental risk assessment automatically every hour.
    cron: "0 * * * *"
