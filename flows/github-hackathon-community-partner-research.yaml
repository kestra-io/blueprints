id: github-hackathon-community-partner-research
namespace: company.community
inputs:
  - id: organizations
    type: JSON
    defaults:
      - hackclub
      - MLH
      - WeMakeDevs
    description: 1-10 organization logins from your own community partner research; duplicates are folded case-insensitively.
  - id: excluded_organizations
    type: JSON
    defaults: []
    description: Up to 10 organization logins to exclude, for example already contacted or declined communities.
      Maintain this list between runs.
  - id: topics
    type: JSON
    defaults:
      - hackathon
      - hacktoberfest
      - community
      - education
    description: 1-20 exact lowercase GitHub topics matching your event. Only explicit repository topics are used.
  - id: active_days
    type: INT
    defaults: 90
    description: Recent push window in days, between 1 and 365.
tasks:
  - id: prepare
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import json, os, re
      from datetime import datetime, timezone
      def names(value, label):
          if not isinstance(value, list) or len(value) > 10:
              raise ValueError(label + " must be an array of at most 10 GitHub organization logins")
          normalized = []
          for name in value:
              if not isinstance(name, str) or not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?", name) or "--" in name:
                  raise ValueError("Invalid organization login")
              if name.lower() not in normalized:
                  normalized.append(name.lower())
          return normalized
      organizations = names(json.loads(os.environ['ORGANIZATIONS']), 'organizations')
      excluded = names(json.loads(os.environ['EXCLUDED']), 'excluded_organizations')
      if not organizations:
          raise ValueError('Provide at least one organization')
      topics = json.loads(os.environ['TOPICS'])
      if not isinstance(topics, list) or not 1 <= len(topics) <= 20 or any(not isinstance(x, str) or not re.fullmatch(r'[a-z0-9][a-z0-9-]{0,49}', x) for x in topics):
          raise ValueError('Provide 1-20 lowercase GitHub topic names')
      days = int(os.environ['DAYS'])
      if not 1 <= days <= 365:
          raise ValueError('active_days must be between 1 and 365')
      settings = dict(organizations=organizations, excluded=excluded,
          fetch=[x for x in organizations if x not in excluded], topics=sorted(set(topics)),
          active_days=days, observed_at=datetime.now(timezone.utc).isoformat())
      print('::' + json.dumps({'outputs': settings}) + '::')
    env:
      ORGANIZATIONS: '{{ inputs.organizations | toJson }}'
      EXCLUDED: '{{ inputs.excluded_organizations | toJson }}'
      TOPICS: '{{ inputs.topics | toJson }}'
      DAYS: '{{ inputs.active_days }}'
  - id: research_organizations
    type: io.kestra.plugin.core.flow.Loop
    values: '{{ outputs.prepare.vars.fetch }}'
    concurrencyLimit: 1
    tasks:
      - id: profile
        type: io.kestra.plugin.core.http.Download
        uri: https://api.github.com/orgs/{{ item.value }}
        headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: '2022-11-28'
          User-Agent: kestra-community-partner-research
        options:
          timeout:
            connectTimeout: PT10S
            readIdleTimeout: PT30S
      - id: repositories
        type: io.kestra.plugin.core.http.Download
        uri: https://api.github.com/orgs/{{ item.value }}/repos?type=public&sort=pushed&direction=desc&per_page=100
        headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: '2022-11-28'
          User-Agent: kestra-community-partner-research
        options:
          timeout:
            connectTimeout: PT10S
            readIdleTimeout: PT30S
      - id: source_sizes
        type: io.kestra.plugin.core.flow.Parallel
        tasks:
          - id: profile_size
            type: io.kestra.plugin.core.storage.Size
            uri: '{{ outputs.profile.uri }}'
          - id: repositories_size
            type: io.kestra.plugin.core.storage.Size
            uri: '{{ outputs.repositories.uri }}'
      - id: bound_sources
        type: io.kestra.plugin.core.execution.Assert
        conditions:
          - '{{ outputs.profile_size.size <= 1048576 and outputs.repositories_size.size <= 4194304 }}'
      - id: assess
        type: io.kestra.plugin.scripts.python.Script
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          import csv, json, os
          from datetime import datetime, timedelta
          from pathlib import Path
          settings = json.loads(Path('settings.json').read_text())
          settings['organizations'] = [os.environ['ORGANIZATION']]
          observed = datetime.fromisoformat(settings['observed_at'])
          cutoff = observed - timedelta(days=settings['active_days'])
          topics = set(settings['topics'])
          evidence, coverage, shortlist = [], [], []
          def instant(value):
              parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
              if parsed.tzinfo is None:
                  raise ValueError('GitHub returned a timestamp without a timezone')
              return parsed
          for org in settings['organizations']:
              if org in settings['excluded']:
                  coverage.append(dict(organization=org, status='excluded', sampled_repositories=0,
                      sample_may_be_capped=False, matching_active_repositories=0))
                  continue
              profile = json.loads(Path('profile.json').read_text())
              repos = json.loads(Path('repositories.json').read_text())
              if profile.get('type') != 'Organization' or profile['login'].lower() != org or not isinstance(repos, list) or len(repos) > 100:
                  raise ValueError('Unexpected GitHub response for ' + org)
              seen, matches = set(), []
              for repo in repos:
                  if repo['owner']['login'].lower() != org or repo['id'] in seen or repo.get('private') is not False:
                      raise ValueError('Unexpected owner, duplicate, or non-public repository')
                  seen.add(repo['id'])
                  matched = sorted(topics.intersection(repo['topics']))
                  pushed = instant(repo['pushed_at']) if repo.get('pushed_at') else None
                  if pushed and pushed > observed + timedelta(minutes=5):
                      raise ValueError('Repository push timestamp is in the future')
                  if repo['fork'] or repo['archived'] or repo['disabled'] or not matched or not pushed or pushed < cutoff:
                      continue
                  row = dict(organization=org, repository=repo['full_name'], repository_url=repo['html_url'],
                      matching_topics=';'.join(matched), pushed_at=repo['pushed_at'], language=repo.get('language') or '')
                  evidence.append(row)
                  matches.append(row)
              matches.sort(key=lambda r: (-instant(r['pushed_at']).timestamp(), r['repository'].lower()))
              capped = len(repos) == 100
              coverage.append(dict(organization=org, status='review' if matches else 'no_matching_evidence',
                  sampled_repositories=len(repos), sample_may_be_capped=capped,
                  matching_active_repositories=len(matches)))
              if matches:
                  shortlist.append(dict(organization=org, profile_url=profile['html_url'],
                      matching_active_repositories=len(matches),
                      matching_topics=';'.join(sorted({t for r in matches for t in r['matching_topics'].split(';')})),
                      latest_matching_push=matches[0]['pushed_at'], evidence_url=matches[0]['repository_url'],
                      sample_may_be_capped=capped, next_step='Review community fit and existing relationship before contacting'))
          print('::' + json.dumps({'outputs': dict(shortlist=shortlist, evidence=evidence, coverage=coverage)}) + '::')
        env:
          ORGANIZATION: '{{ item.value }}'
        inputFiles:
          settings.json: '{{ outputs.prepare.vars | toJson }}'
          profile.json: '{{ outputs.profile.uri }}'
          repositories.json: '{{ outputs.repositories.uri }}'
    outputs:
      - id: research
        type: JSON
        value: '{{ outputs.assess.vars }}'
  - id: build_research_pack
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import csv, json
      from pathlib import Path
      settings = json.loads(Path('settings.json').read_text())
      results = json.loads(Path('results.json').read_text())
      shortlist, evidence, coverage = [], [], []
      for row in results:
          result = row['outputs']['research']
          shortlist.extend(result['shortlist'])
          evidence.extend(result['evidence'])
          coverage.extend(result['coverage'])
      for org in settings['organizations']:
          if org in settings['excluded']:
              coverage.append(dict(organization=org, status='excluded', sampled_repositories=0,
                  sample_may_be_capped=False, matching_active_repositories=0))
      if sorted(r['organization'] for r in coverage) != sorted(settings['organizations']):
          raise ValueError('Missing or duplicate organization results')
      coverage.sort(key=lambda r: r['organization'])
      shortlist.sort(key=lambda r: (-r['matching_active_repositories'], r['organization']))
      evidence.sort(key=lambda r: (r['organization'], r['repository'].lower()))
      def safe(value):
          # Protect spreadsheet users from formula interpretation in externally sourced text.
          return "'" + value if isinstance(value, str) and value.lstrip().startswith(('=', '+', '-', '@')) else value
      def write_csv(name, rows, fields):
          with open(name, 'w', newline='', encoding='utf-8') as stream:
              writer = csv.DictWriter(stream, fieldnames=fields)
              writer.writeheader()
              writer.writerows({k: safe(v) for k, v in row.items()} for row in rows)
      write_csv('partner-shortlist.csv', shortlist, ['organization','profile_url','matching_active_repositories','matching_topics','latest_matching_push','evidence_url','sample_may_be_capped','next_step'])
      write_csv('repository-evidence.csv', evidence, ['organization','repository','repository_url','matching_topics','pushed_at','language'])
      Path('coverage.json').write_text(json.dumps(dict(settings=settings, organizations=coverage,
          scope='Up to 100 public repositories per organization, sorted by most recently pushed. Not a complete community census.',
          interpretation='A recent push and matching topic are research signals, not verified human activity, partnership interest, or permission to contact.'), indent=2), encoding='utf-8')
      print('::' + json.dumps({'outputs': dict(shortlisted=len(shortlist), evidence=len(evidence), covered=len(coverage))}) + '::')
    inputFiles:
      settings.json: '{{ outputs.prepare.vars | toJson }}'
      results.json: '{{ (outputs.research_organizations.outputs ?? []) | toJson }}'
    outputFiles:
      - partner-shortlist.csv
      - repository-evidence.csv
      - coverage.json
  - id: verify_coverage
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - '{{ outputs.build_research_pack.vars.covered == (outputs.prepare.vars.organizations | length) }}'
outputs:
  - id: shortlist
    type: FILE
    required: false
    value: '{{ outputs.build_research_pack.outputFiles[''partner-shortlist.csv''] ?? null }}'
  - id: evidence
    type: FILE
    required: false
    value: '{{ outputs.build_research_pack.outputFiles[''repository-evidence.csv''] ?? null }}'
  - id: coverage
    type: FILE
    required: false
    value: '{{ outputs.build_research_pack.outputFiles[''coverage.json''] ?? null }}'
triggers:
  - id: weekly_research
    type: io.kestra.plugin.core.trigger.Schedule
    cron: 0 8 * * 1
    timezone: UTC
    disabled: true
extend:
  title: Research GitHub Community Partners for Hackathon Outreach
  metaTitle: GitHub Community Partner Research for Hackathons | Kestra
  shortDescription: Turn a curated set of GitHub organizations into a topic-matched outreach research pack with
    repository evidence and explicit coverage limits.
  metaDescription: Research hackathon community partners using GitHub public repositories. Export a topic-matched
    shortlist, source evidence, and coverage limits.
  description: |
    Build a research pack before approaching developer communities about a hackathon. Start with organizations you have identified; check their public project topics and recent pushes without inventing contact details or sending messages.

    ## How it works

    1. Validate and deduplicate 1-10 organization logins, remove your exclusion list, and capture one UTC observation time.
    2. A sequential Loop downloads each profile and its 100 most recently pushed public repositories to storage. Bound response sizes and assess each organization inside the loop, keeping API bodies out of queue messages.
    3. Keep non-fork, non-archived, enabled repositories with an exact configured topic and a push within the lookback window. Export a review shortlist and its source evidence; assert every requested organization is accounted for.

    ## What you get

    - `partner-shortlist.csv`, ordered by matching repository count, and `repository-evidence.csv` with source links.
    - `coverage.json` records excluded organizations, zero-match results, the observation time, and potentially capped samples. CSV text is guarded against spreadsheet formulas.
    - HTTP failures, including unknown organizations and rate limits, fail the execution before publishing flow outputs. A recent push may be automated; it does not prove engagement or willingness to partner. Empty results are valid.

    ## Who it's for

    - Hackathon organizers and developer relations teams researching a curated set of potential community partners.

    ## Why orchestrate this with Kestra

    Native HTTP tasks expose source failures, bounded sequential iteration limits API use, and a weekly schedule creates execution-linked research artifacts for human review.

    ## Prerequisites

    - Python 3.11+ on the Kestra worker PATH, the Python Script plugin, and HTTPS access to api.github.com. Scripts use the Process runner and standard library only.
    - Up to 20 unauthenticated requests per run share GitHub's IP-based rate allowance. Schedule conservatively on shared workers.

    ### Secrets

    - None. This uses public endpoints without credentials.

    ## Quick start

    1. Set your organization candidates, event topics, exclusions, and active_days.
    2. Execute manually and inspect all three files. A 100-row sample is marked potentially capped; a zero-match result is not proof of inactivity.
    3. Check context and existing relationships before contacting anyone. Keep exclusions updated, then enable the weekly UTC trigger.

    ## How to extend

    Add authenticated requests for a larger shared allowance, paginate public repositories for broader coverage, or compare packs in object storage. Store relationship decisions in your CRM before adding delivery tasks.

    ## Links

    - [GitHub organization repositories](https://docs.github.com/en/rest/repos/repos#list-organization-repositories)
    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
    - [Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
  tags:
    - Business
  subTags:
    - CRM & Marketing Ops
    - Reporting & Digests
  ee: false
  demo: false
