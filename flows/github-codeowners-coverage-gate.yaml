id: github-codeowners-coverage-gate
namespace: company.infrastructure
description: |
  Audit a public GitHub repository's CODEOWNERS file before relying on automatic review routing.
  The flow checks file availability, active rule structure, owner-token syntax, duplicate patterns,
  and an optional catch-all owner rule. It produces JSON evidence and can alert on blocked policy.
  It validates syntax and coverage signals only; it does not prove users or teams exist, have repository
  access, or can approve pull requests.

inputs:
  - id: repository
    type: STRING
    displayName: GitHub repository
    defaults: hashicorp/terraform
    description: Public GitHub repository in owner/name format.
  - id: codeowners_path
    type: STRING
    displayName: CODEOWNERS file path
    defaults: CODEOWNERS
    description: Repository-relative path, such as CODEOWNERS or .github/CODEOWNERS.
  - id: default_branch
    type: STRING
    displayName: Branch or ref
    defaults: main
    description: Branch or tag from which the CODEOWNERS file will be audited.
  - id: require_catch_all
    type: BOOL
    displayName: Require catch-all ownership
    defaults: true
    description: Block if no active '*' or '/*' pattern provides fallback ownership.
  - id: minimum_rules
    type: INT
    displayName: Minimum active rules
    defaults: 1
    description: Minimum number of non-comment CODEOWNERS entries required.
  - id: fail_on_duplicate_patterns
    type: BOOL
    displayName: Fail on duplicate patterns
    defaults: false
    description: Treat repeated active patterns as blocking rather than warnings.
  - id: archive_report
    type: BOOL
    displayName: Archive report to S3
    defaults: false
    description: Save the JSON audit report to S3. AWS secrets are needed only when enabled.
  - id: evidence_bucket
    type: STRING
    displayName: Evidence bucket
    defaults: my-repository-governance-evidence
    description: Existing S3 bucket used when report archival is enabled.
  - id: evidence_prefix
    type: STRING
    displayName: Evidence prefix
    defaults: github-codeowners-audits
    description: Prefix for repository-specific CODEOWNERS audit reports.
  - id: aws_region
    type: STRING
    displayName: AWS region
    defaults: eu-west-1
    description: Region of the evidence bucket.

triggers:
  - id: weekly_codeowners_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Re-audit ownership coverage weekly. Enable after reviewing the policy and alert configuration.
    cron: "0 9 * * 1"
    disabled: true

tasks:
  - id: validate_request
    type: io.kestra.plugin.scripts.python.Script
    description: Validate repository, ref, file path and numeric threshold before calling GitHub.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      REPOSITORY: "{{ inputs.repository }}"
      CODEOWNERS_PATH: "{{ inputs.codeowners_path }}"
      DEFAULT_BRANCH: "{{ inputs.default_branch }}"
      MINIMUM_RULES: "{{ inputs.minimum_rules }}"
    script: |
      import os
      import re

      repository = os.environ.get("REPOSITORY", "").strip()
      path = os.environ.get("CODEOWNERS_PATH", "").strip()
      ref = os.environ.get("DEFAULT_BRANCH", "").strip()
      minimum = os.environ.get("MINIMUM_RULES", "").strip()

      if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
          raise ValueError("repository must be a public GitHub owner/name pair")
      if not path or path.startswith("/") or ".." in path.split("/"):
          raise ValueError("codeowners_path must be a repository-relative file path")
      if not ref or any(char in ref for char in "\r\n"):
          raise ValueError("default_branch must be a non-empty single-line ref")
      try:
          minimum_count = int(minimum)
      except ValueError as exc:
          raise ValueError("minimum_rules must be an integer") from exc
      if minimum_count < 0:
          raise ValueError("minimum_rules cannot be negative")

      print(f"Validated CODEOWNERS audit request for {repository}:{ref}/{path}")

  - id: fetch_codeowners
    type: io.kestra.plugin.core.http.Request
    description: Fetch the CODEOWNERS file through GitHub's Contents API using public repository access.
    uri: "https://api.github.com/repos/{{ inputs.repository }}/contents/{{ inputs.codeowners_path }}?ref={{ inputs.default_branch }}"
    method: GET
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: Kestra-GitHub-CODEOWNERS-Coverage-Gate/1.0
    timeout: PT30S

  - id: audit_codeowners
    type: io.kestra.plugin.scripts.python.Script
    description: Decode the live CODEOWNERS file, validate active entry structure and owner syntax, detect duplicate patterns, and verify catch-all coverage.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra
    inputFiles:
      github-content.json: "{{ outputs.fetch_codeowners.body }}"
    env:
      REPOSITORY: "{{ inputs.repository }}"
      CODEOWNERS_PATH: "{{ inputs.codeowners_path }}"
      REQUIRE_CATCH_ALL: "{{ inputs.require_catch_all }}"
      MINIMUM_RULES: "{{ inputs.minimum_rules }}"
      FAIL_ON_DUPLICATES: "{{ inputs.fail_on_duplicate_patterns }}"
    outputFiles:
      - codeowners-audit.json
    script: |
      import base64
      import json
      import os
      import re
      from collections import Counter
      from datetime import datetime, timezone

      from kestra import Kestra

      repository = os.environ["REPOSITORY"].strip()
      path = os.environ["CODEOWNERS_PATH"].strip()
      require_catch_all = os.environ.get("REQUIRE_CATCH_ALL", "true").lower() == "true"
      minimum_rules = int(os.environ.get("MINIMUM_RULES", "1"))
      fail_on_duplicates = os.environ.get("FAIL_ON_DUPLICATES", "false").lower() == "true"

      with open("github-content.json", encoding="utf-8") as source:
          response = json.load(source)
      if not isinstance(response, dict):
          raise ValueError("GitHub Contents API response must be a JSON object")
      if response.get("message") and not response.get("content"):
          raise ValueError(f"GitHub could not return {repository}/{path}: {response.get('message')}")
      if response.get("type") != "file":
          raise ValueError(f"Expected a regular file for {repository}/{path}; got type={response.get('type')!r}")
      encoded = response.get("content")
      if not encoded:
          raise ValueError(f"GitHub returned an empty or unavailable file payload for {repository}/{path}")
      try:
          decoded = base64.b64decode(encoded, validate=False).decode("utf-8")
      except (ValueError, UnicodeDecodeError) as exc:
          raise ValueError("CODEOWNERS content was not valid base64-encoded UTF-8") from exc

      owner_re = re.compile(r"^@[A-Za-z0-9][A-Za-z0-9._-]*(?:/[A-Za-z0-9][A-Za-z0-9._-]*)?$")
      findings = []
      def add(code, severity, line_number, message):
          findings.append({"code": code, "severity": severity, "line": line_number, "message": message})

      entries = []
      for line_number, raw_line in enumerate(decoded.splitlines(), 1):
          stripped = raw_line.strip()
          if not stripped or stripped.startswith("#"):
              continue
          parts = stripped.split()
          pattern = parts[0] if parts else ""
          owners = parts[1:] if len(parts) > 1 else []
          if not pattern:
              add("PATTERN_MISSING", "BLOCK", line_number, "Active rule has no file pattern.")
              continue
          if not owners:
              add("OWNERS_MISSING", "BLOCK", line_number, f"Pattern {pattern!r} has no owner entries.")
              continue
          invalid_owners = [owner for owner in owners if not owner_re.fullmatch(owner)]
          if invalid_owners:
              add("OWNER_SYNTAX_INVALID", "BLOCK", line_number, f"Pattern {pattern!r} contains invalid owner syntax: {', '.join(invalid_owners)}.")
          entries.append({"line": line_number, "pattern": pattern, "owners": owners})

      patterns = [entry["pattern"] for entry in entries]
      counts = Counter(patterns)
      duplicates = sorted(pattern for pattern, count in counts.items() if count > 1)
      for pattern in duplicates:
          severity = "BLOCK" if fail_on_duplicates else "WARN"
          locations = [str(entry["line"]) for entry in entries if entry["pattern"] == pattern]
          add("DUPLICATE_PATTERN", severity, int(locations[-1]), f"Pattern {pattern!r} appears on multiple active lines: {', '.join(locations)}. The last matching rule wins.")

      catch_all_entries = [
          entry for entry in entries
          if entry["pattern"] in {"*", "/*"} and all(owner_re.fullmatch(owner) for owner in entry["owners"])
      ]
      if require_catch_all and not catch_all_entries:
          add("CATCH_ALL_MISSING", "BLOCK", None, "No active '*' or '/*' pattern with valid owner syntax provides fallback ownership.")
      if len(entries) < minimum_rules:
          add("RULE_COUNT_BELOW_MINIMUM", "BLOCK", None, f"Found {len(entries)} active rule(s), below the configured minimum of {minimum_rules}.")

      invalid_lines = sorted({finding["line"] for finding in findings if finding["severity"] == "BLOCK" and finding["line"] is not None})
      blocking = [finding for finding in findings if finding["severity"] == "BLOCK"]
      warnings = [finding for finding in findings if finding["severity"] == "WARN"]
      owners = sorted({owner for entry in entries for owner in entry["owners"] if owner_re.fullmatch(owner)})
      verdict = "FAIL" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")

      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "repository": repository,
          "path": response.get("path", path),
          "blobSha": response.get("sha"),
          "fileBytes": len(decoded.encode("utf-8")),
          "totalLines": len(decoded.splitlines()),
          "activeRuleCount": len(entries),
          "distinctPatternCount": len(set(patterns)),
          "duplicatePatterns": duplicates,
          "ownerCount": len(owners),
          "owners": owners,
          "catchAllRequired": require_catch_all,
          "catchAllPresent": bool(catch_all_entries),
          "invalidLines": invalid_lines,
          "findings": findings,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "scopeNote": "This audit checks file structure and owner-token syntax only. It does not query GitHub to verify referenced users or teams, repository access, or approval ability.",
      }
      with open("codeowners-audit.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)

      print(f"CODEOWNERS coverage audit: {repository}/{path} verdict={verdict}; rules={len(entries)}, owners={len(owners)}, blocking={len(blocking)}, warnings={len(warnings)}")
      Kestra.outputs({
          "repository": repository,
          "path": response.get("path", path),
          "active_rule_count": len(entries),
          "distinct_pattern_count": len(set(patterns)),
          "owner_count": len(owners),
          "catch_all_present": bool(catch_all_entries),
          "invalid_lines": invalid_lines,
          "duplicate_patterns": duplicates,
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "findings": findings,
          "verdict": verdict,
      })

  - id: optionally_archive_report
    type: io.kestra.plugin.core.flow.If
    description: Optionally archive the audit evidence in S3 for periodic governance reviews.
    condition: "{{ inputs.archive_report }}"
    then:
      - id: upload_codeowners_report
        type: io.kestra.plugin.aws.s3.Upload
        description: Archive the generated JSON report without copying source files.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ inputs.aws_region }}"
        bucket: "{{ inputs.evidence_bucket }}"
        from: "{{ outputs.audit_codeowners.outputFiles['codeowners-audit.json'] }}"
        key: "{{ inputs.evidence_prefix }}/{{ inputs.repository | replace('/', '_') }}/codeowners-audit.json"

  - id: enforce_ownership_policy
    type: io.kestra.plugin.core.flow.If
    description: Fail closed when entries are malformed or required fallback ownership is missing.
    condition: "{{ outputs.audit_codeowners.vars.verdict == 'FAIL' }}"
    then:
      - id: alert_blocked_ownership
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Notify maintainers of invalid entries or missing fallback coverage.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |-
          {{
            {
              "text": ":rotating_light: CODEOWNERS coverage gate BLOCKED\\nRepository: " ~ outputs.audit_codeowners.vars.repository ~
                "\\nPath: " ~ outputs.audit_codeowners.vars.path ~
                "\\nFindings: " ~ (outputs.audit_codeowners.vars.findings | toJson) ~
                "\\nExecution: " ~ execution.id ~
                "\\nReview codeowners-audit.json for details."
            } | toJson
          }}
      - id: fail_ownership_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Stop the downstream release workflow when CODEOWNERS policy fails.
        errorMessage: "CODEOWNERS coverage policy failed for {{ outputs.audit_codeowners.vars.repository }} at {{ outputs.audit_codeowners.vars.path }}."
    else:
      - id: log_ownership_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "CODEOWNERS audit {{ outputs.audit_codeowners.vars.verdict }} for {{ outputs.audit_codeowners.vars.repository }}; active rules={{ outputs.audit_codeowners.vars.active_rule_count }}, owners={{ outputs.audit_codeowners.vars.owner_count }}."

errors:
  - id: alert_codeowners_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert on API, decoding or orchestration failure so it cannot be mistaken for a passing audit.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |-
      {{
        {
          "text": ":warning: CODEOWNERS audit execution failed\\nRepository: " ~ inputs.repository ~
            "\\nExecution: " ~ execution.id ~
            "\\nInspect Kestra logs; inaccessible files must not be interpreted as PASS."
        } | toJson
      }}

outputs:
  - id: ownership_audit
    type: JSON
    description: Machine-readable summary of active ownership rules, catch-all coverage, owner syntax findings and verdict.
    value: "{{ outputs.audit_codeowners.vars | toJson }}"

extend:
  title: GitHub CODEOWNERS Syntax and Coverage Gate
  metaTitle: GitHub CODEOWNERS Syntax and Coverage Gate | Kestra
  shortDescription: Audit a public repository's CODEOWNERS syntax, owner tokens, duplicate patterns and required catch-all rule before relying on automatic review routing.
  metaDescription: Validate GitHub CODEOWNERS entries, owner syntax, duplicate patterns and catch-all reviewer coverage with an auditable governance gate.
  description: |
    Check a public GitHub repository's CODEOWNERS file before relying on automatic reviewer routing. The flow reads the selected file, parses active ownership rules, checks that each rule has owner tokens in the expected GitHub user/team shape, flags repeated patterns, and can require catch-all ownership. It produces evidence, supports optional S3 report retention, and blocks when configured policy requirements fail.

    ## How it works

    1. The validation task checks the repository, ref, path and minimum rule threshold.
    2. The HTTP task reads the file from the chosen branch through GitHub's Contents API.
    3. The Python audit decodes the file, ignores blank/comment lines, checks owner-token syntax, and detects duplicate patterns and missing catch-all coverage.
    4. An optional If branch archives the JSON report to S3.
    5. The policy If sends a Slack alert and fails on blocking findings; otherwise it logs the verdict.

    ## What you get

    - A report with repository, file blob SHA, active rule count, owners, duplicate patterns, invalid lines and findings.
    - Detection of active entries without owners or with malformed owner tokens.
    - A configurable catch-all rule requirement for unmatched files.
    - Optional S3 evidence retention and a failing path for blocked policies.

    ## Who it's for

    - Repository administrators setting up branch protection and required reviews.
    - Platform teams standardizing reviewer routing across repositories.
    - Engineering enablement teams checking ownership changes before releases.

    ## Why orchestrate this with Kestra

    Kestra makes the governance policy configurable, records every audit execution, enables scheduled rechecks, and produces a failed execution with a report artifact when ownership rules need maintenance.

    ## Prerequisites

    - A Kestra 2.x worker with Docker enabled for the Python Script task runner.
    - Network access to api.github.com; public repository content can be audited without a GitHub token.
    - A Slack incoming webhook for alerts. S3 archival is optional and requires write access to the configured bucket.

    ### Secrets

    - SLACK_WEBHOOK_URL: Slack incoming webhook for blocking findings and execution-failure alerts.
    - AWS_ACCESS_KEY_ID: optional AWS access key used only when S3 report archival is enabled.
    - AWS_SECRET_ACCESS_KEY: optional AWS secret key used only when S3 report archival is enabled.

    ## Quick start

    1. Import the flow with repository set to hashicorp/terraform and codeowners_path set to CODEOWNERS for the public example.
    2. Execute manually and review the ownership_audit output and codeowners-audit.json file.
    3. Change codeowners_path to .github/CODEOWNERS or docs/CODEOWNERS if the file lives elsewhere.
    4. Set require_catch_all, minimum_rules and fail_on_duplicate_patterns to match local governance requirements.
    5. Configure Slack and optional S3 secrets before enabling the weekly schedule.

    ## How to extend

    - Query GitHub to verify that listed users and teams exist and have repository access.
    - Compare sensitive-path ownership against a repository-specific owner matrix.
    - Require two owners for high-risk paths or prohibit single-person ownership of production deployment files.
    - Run the gate on CODEOWNERS pull requests and store a review alongside release evidence.

    ## Links

    - [GitHub CODEOWNERS documentation](https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners)
    - [GitHub Contents API](https://docs.github.com/en/rest/repos/contents#get-repository-content)
    - [Kestra HTTP Request plugin](https://kestra.io/plugins/plugin-core/http/io.kestra.plugin.core.http.request)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack/slackincomingwebhook)
    - [Kestra AWS S3 plugin](https://kestra.io/plugins/plugin-aws/s3)
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - CI/CD & Deployment
  ee: false
  demo: false
