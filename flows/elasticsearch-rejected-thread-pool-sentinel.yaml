id: elasticsearch-rejected-thread-pool-sentinel
namespace: company.team

concurrency:
  limit: 1

inputs:
  - id: elasticsearch_host
    type: STRING
    displayName: Elasticsearch Endpoint URL
    description: Base URL for the Elasticsearch cluster REST API.
    defaults: "http://elasticsearch:9200"

  - id: thread_pools_to_audit
    type: STRING
    displayName: Thread Pools to Audit
    description: Comma-separated list of thread pool names to monitor for execution rejections.
    defaults: "write,search,bulk"

  - id: max_rejected_threshold
    type: INT
    displayName: Max Tolerated Rejected Count
    description: Maximum permissible thread rejection count before triggering operational alerts.
    defaults: 50

  - id: alert_on_queue_saturation
    type: BOOL
    displayName: Alert on Queue Saturation
    description: Whether to alert if any monitored thread pool queue reaches maximum queue capacity.
    defaults: true

tasks:
  - id: scan_thread_pools
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Elasticsearch node stats to inspect thread pool queues and detect rejected operations.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.elasticsearch_host }}"
      POOLS: "{{ inputs.thread_pools_to_audit }}"
      THRESHOLD: "{{ inputs.max_rejected_threshold }}"
      API_KEY: "{{ secret('ELASTICSEARCH_API_KEY') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      es_host = os.environ.get("ES_HOST", "http://elasticsearch:9200").rstrip("/")
      target_pools = [p.strip() for p in os.environ.get("POOLS", "write,search,bulk").split(",") if p.strip()]
      threshold = int(os.environ.get("THRESHOLD", "50"))
      api_key = os.environ.get("API_KEY", "")

      headers = {"Accept": "application/json"}
      if api_key:
          headers["Authorization"] = f"ApiKey {api_key}"

      url = f"{es_host}/_nodes/stats/thread_pool"
      rejections = []
      total_rejected = 0

      try:
          resp = requests.get(url, headers=headers, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"CRITICAL: Failed to query Elasticsearch thread pool stats at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      nodes = data.get("nodes", {})
      nodes_scanned = len(nodes)

      for node_id, node_info in nodes.items():
          node_name = node_info.get("name", node_id)
          pools = node_info.get("thread_pool", {})
          for pool_name in target_pools:
              if pool_name in pools:
                  stats = pools[pool_name]
                  rej_count = stats.get("rejected", 0)
                  queue_size = stats.get("queue", 0)
                  active_threads = stats.get("active", 0)
                  if rej_count > threshold or queue_size > 100:
                      rejections.append({
                          "node_name": node_name,
                          "pool_name": pool_name,
                          "rejected_count": rej_count,
                          "queue_size": queue_size,
                          "active_threads": active_threads
                      })
                      total_rejected += rej_count

      print(f"Scanned {nodes_scanned} nodes. Total rejected tasks: {total_rejected}. Flagged anomalies: {len(rejections)}")

      report = {
          "nodes_scanned_count": nodes_scanned,
          "total_rejected_tasks": total_rejected,
          "anomalies_count": len(rejections),
          "rejections": rejections
      }

      with open("rejection_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "nodes_scanned_count": nodes_scanned,
          "total_rejected_tasks": total_rejected,
          "anomalies_count": len(rejections),
          "rejection_details": json.dumps(rejections)
      })
    outputFiles:
      - rejection_report.json

  - id: check_thread_pool_rejections
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any Elasticsearch node reported thread pool rejections exceeding policy thresholds.
    condition: "{{ outputs.scan_thread_pools.vars.total_rejected_tasks > 0 }}"
    then:
      - id: notify_slack_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident alert card to SRE team on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#search-sre-alerts",
            "username": "Elasticsearch-Sentinel",
            "text": "CRITICAL: Elasticsearch Thread Pool Rejections detected on `{{ inputs.elasticsearch_host }}`. Total rejected operations: `{{ outputs.scan_thread_pools.vars.total_rejected_tasks }}` across `{{ outputs.scan_thread_pools.vars.anomalies_count }}` pool anomalies."
          }

  - id: export_rejection_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Outputs structured JSON manifest of scanned nodes and rejected task allocations for capacity planning.
    format:
      cluster_endpoint: "{{ inputs.elasticsearch_host }}"
      nodes_scanned: "{{ outputs.scan_thread_pools.vars.nodes_scanned_count }}"
      total_rejected_tasks: "{{ outputs.scan_thread_pools.vars.total_rejected_tasks }}"
      anomalies_flagged: "{{ outputs.scan_thread_pools.vars.anomalies_count }}"
      details: "{{ outputs.scan_thread_pools.vars.rejection_details }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#search-sre-alerts",
        "username": "Elasticsearch-Sentinel",
        "text": "CRITICAL: Elasticsearch Thread Pool Sentinel failed on `{{ inputs.elasticsearch_host }}`. Execution ID: `{{ execution.id }}`."
      }

triggers:
  - id: periodic_thread_pool_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger checking Elasticsearch thread pool saturation every 10 minutes.
    cron: "*/10 * * * *"

extend:
  title: Elasticsearch Rejected Thread Pool Sentinel
  metaTitle: Elasticsearch Rejected Thread Pool Sentinel Blueprint
  shortDescription: Audits Elasticsearch thread pools to detect saturated queues and rejected write, search, or bulk tasks.
  metaDescription: Audits Elasticsearch thread pools to detect saturated queues and rejected tasks, dispatching actionable diagnostic cards to SREs on Slack.
  description: |
    Elasticsearch relies on dedicated thread pools for coordinating distributed write, search, bulk ingestion, and management operations. When ingestion throughput surges or complex search queries saturate CPU cores, thread pool queues fill to capacity (default 200 for write pools). Subsequent incoming operations are immediately rejected with `EsRejectedExecutionException` errors, resulting in dropped events, client timeouts, and data loss. This sentinel interrogates cluster thread pool telemetry on a recurring cadence, flags saturated queues and rejection spikes, and alerts platform SRE teams with detailed node and pool identities.

    ## How it works
    1. **Scheduled triggering**: Automatically executes every 10 minutes via cron trigger (`*/10 * * * *`) or runs on demand.
    2. **Telemetry extraction**: The containerized Python script polls `GET /_nodes/stats/thread_pool` across all cluster nodes using isolated Docker execution.
    3. **Threshold evaluation**: Inspects queues and cumulative rejection counters for monitored pools (`write`, `search`, `bulk`) against configured thresholds.
    4. **Slack alerting**: When thread rejections or queue saturations are detected, emits an incident card to `#search-sre-alerts`.
    5. **Manifest return**: Emits a structured diagnostic return dictionary for upstream observability pipelines.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_thread_pool_audit Schedule Trigger] --> B[scan_thread_pools Python Script]
      B --> C{Rejections > 0?}
      C -- Yes --> D[notify_slack_sre Slack Webhook]
      C -- No --> E[export_rejection_audit_manifest Return]
      D --> E
    ```

    ## Prerequisites
    - Network reachability from Kestra workers to the Elasticsearch HTTP REST endpoint.
    - Elasticsearch API Key or Basic Authentication credentials configured in Kestra secrets.
    - Slack incoming webhook endpoint configured in `SLACK_WEBHOOK_URL`.

    ## Quick start
    1. Configure `ELASTICSEARCH_API_KEY` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Import this workflow under the `company.team` namespace.
    3. Set `elasticsearch_host` to your cluster endpoint.
    4. Execute a manual run to verify cluster thread pool health.

    ## Links
    - [Elasticsearch Thread Pool Documentation](https://www.elastic.co/guide/en/elasticsearch/reference/current/modules-threadpool.html)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
