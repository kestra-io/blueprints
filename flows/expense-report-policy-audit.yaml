id: expense-report-policy-audit
namespace: company.team

description: |
  Weekly travel and expense audit before reimbursement: check every expense line against the
  policy (per-category and per-city limits, receipts above a threshold, weekend and blocked
  merchant categories, alcohol), find duplicate receipts across reports and employees, split
  transactions that dodge an approval limit, self-approval and approver limits, and claims
  for card spend already paid by the company. Clean reports go into the reimbursement batch;
  flagged lines go back with the reason; repeat offenders are reported to the controller.

inputs:
  - id: week_ending
    type: STRING
    displayName: Week ending (a Sunday)
    defaults: "2026-10-04"
    validator: ^\d{4}-\d{2}-\d{2}$

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: ISSUES adds an employee missing from the HR file and a report in a currency with no rate, which must stop the batch.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

  - id: receipt_threshold
    type: FLOAT
    displayName: Receipt required above (EUR)
    defaults: 25.0

  - id: split_window_days
    type: INT
    displayName: Split transaction window (days)
    description: Charges at the same merchant by the same employee within this window are added up before the approval limit is checked.
    defaults: 2

variables:
  state_key: expense_audit
  pack_dir: "expenses/{{ inputs.week_ending }}"

concurrency:
  limit: 1

triggers:
  - id: every_monday
    type: io.kestra.plugin.core.trigger.Schedule
    description: Monday morning, for the week that just ended. Disabled until the expense tool is wired in.
    cron: "0 6 * * 1"
    disabled: true

tasks:
  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    description: Receipt fingerprints already reimbursed, and flags per employee over the last weeks.
    values:
      s: "{{ kv(vars.state_key, errorOnMissing=false) ?? {'weeks': [], 'paid_receipts': [], 'flags': {}} | toJson }}"

  - id: week_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.state.values.s).weeks contains inputs.week_ending }}"
    then:
      - id: already_audited
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The week ending {{ inputs.week_ending }} is already audited and paid."

  - id: audit
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: the policy, the HR file, the week's expense lines and the corporate
      card feed (demo generator or your expense tool), every rule, the decision per report,
      the reimbursement batch and the repeat-offender list.
    outputFiles:
      - lines
      - reports
      - batch
      - offenders
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE w1 = DATE '{{ inputs.week_ending }}';
      SET VARIABLE w0 = DATE '{{ inputs.week_ending }}' - 6;

      -- =======================================================================
      -- Policy. Replace with your travel and expense policy.
      -- =======================================================================
      CREATE TABLE limits (category VARCHAR, city_tier VARCHAR, max_eur DOUBLE, per VARCHAR);
      INSERT INTO limits VALUES
        ('Hotel', 'A', 260, 'night'), ('Hotel', 'B', 180, 'night'), ('Meals', 'A', 75, 'day'), ('Meals', 'B', 55, 'day'),
        ('Taxi', 'A', 80, 'trip'), ('Taxi', 'B', 60, 'trip'), ('Train', 'A', 400, 'trip'), ('Train', 'B', 400, 'trip'),
        ('Flight', 'A', 900, 'trip'), ('Flight', 'B', 900, 'trip'), ('Client entertainment', 'A', 120, 'person'), ('Client entertainment', 'B', 90, 'person');
      CREATE TABLE cities (city VARCHAR, tier VARCHAR);
      INSERT INTO cities VALUES ('Paris', 'A'), ('London', 'A'), ('New York', 'A'), ('Lyon', 'B'), ('Manchester', 'B'), ('Austin', 'B');
      CREATE TABLE blocked_mcc (mcc VARCHAR, reason VARCHAR);
      INSERT INTO blocked_mcc VALUES ('7995', 'Gambling'), ('5813', 'Bars and nightclubs'), ('7297', 'Massage parlours'), ('5921', 'Liquor stores');
      -- Approval limits by approver level.
      CREATE TABLE approver_limits (level VARCHAR, max_report_eur DOUBLE);
      INSERT INTO approver_limits VALUES ('MANAGER', 2500), ('DIRECTOR', 10000), ('VP', 50000);
      CREATE TABLE rates (currency VARCHAR, eur DOUBLE);
      INSERT INTO rates VALUES ('EUR', 1), ('GBP', 1.17), ('USD', 0.89);

      -- =======================================================================
      -- HR file and the week's expense lines. Replace with your HRIS and expense tool.
      -- =======================================================================
      CREATE TABLE employees AS
      SELECT 'E' || lpad(i::VARCHAR, 3, '0') AS employee, 'Employee ' || i AS name, ['Sales', 'Engineering', 'Finance', 'Marketing'][1 + i % 4] AS department,
             'E' || lpad((1 + (i - 1) // 8)::VARCHAR, 3, '0') AS manager, CASE WHEN i <= 5 THEN 'DIRECTOR' ELSE 'MANAGER' END AS approver_level
      FROM range(1, 61) t(i);

      CREATE TABLE lines AS
      WITH g AS (
        SELECT i, 'E' || lpad((6 + i % 50)::VARCHAR, 3, '0') AS employee,
               ['Hotel', 'Meals', 'Meals', 'Taxi', 'Train', 'Flight', 'Client entertainment', 'Meals', 'Taxi'][1 + i % 9] AS category,
               ['Paris', 'London', 'New York', 'Lyon', 'Manchester', 'Austin'][1 + (i * 7) % 6] AS city,
               getvariable('w0') + (i % 5)::INT AS spent_on
        FROM range(1, 401) t(i)
      )
      SELECT 'EXP-' || lpad(i::VARCHAR, 4, '0') AS line_id, 'R-' || employee || '-' || strftime(getvariable('w1'), '%Y%W') AS report_id, employee, category, city, spent_on,
             CASE city WHEN 'London' THEN 'GBP' WHEN 'Manchester' THEN 'GBP' WHEN 'New York' THEN 'USD' WHEN 'Austin' THEN 'USD' ELSE 'EUR' END AS currency,
             round(CASE category WHEN 'Hotel' THEN 140 WHEN 'Meals' THEN 28 WHEN 'Taxi' THEN 24 WHEN 'Train' THEN 120 WHEN 'Flight' THEN 380 ELSE 160 END
                   * (0.7 + (hash(i) % 50)::INT / 100.0), 2) AS amount,
             CASE category WHEN 'Hotel' THEN 7011 WHEN 'Meals' THEN 5812 WHEN 'Taxi' THEN 4121 WHEN 'Train' THEN 4112 WHEN 'Flight' THEN 4511 ELSE 5812 END::VARCHAR AS mcc,
             CASE category WHEN 'Hotel' THEN 'Hotel ' || city WHEN 'Flight' THEN 'Air ' || (i % 3) WHEN 'Train' THEN 'Rail' WHEN 'Taxi' THEN 'Ride ' || (i % 4) ELSE 'Restaurant ' || (i % 23) END AS merchant,
             'rcpt-' || md5(i::VARCHAR || strftime(getvariable('w1'), '%Y%W')) AS receipt_hash, CASE WHEN category = 'Hotel' THEN 1 + i % 3 ELSE 1 END AS units,
             CASE WHEN category = 'Client entertainment' THEN 2 + i % 3 END AS attendees,
             false AS paid_by_card, NULL::VARCHAR AS card_txn
      FROM g;
      -- The week's planted findings, on fixed lines so every run sees the same week.
      UPDATE lines SET amount = 420.00 WHERE line_id = 'EXP-0018';                                  -- hotel night far over the limit
      UPDATE lines SET receipt_hash = NULL WHERE line_id IN ('EXP-0027', 'EXP-0036');              -- missing receipts
      UPDATE lines SET spent_on = getvariable('w1') WHERE line_id = 'EXP-0037';                    -- a Sunday dinner
      UPDATE lines SET mcc = '5813', merchant = 'Le Bar Rouge' WHERE line_id = 'EXP-0052';         -- a bar
      INSERT INTO lines SELECT 'EXP-0901', report_id, 'E017', category, city, spent_on, currency, amount, mcc, merchant, receipt_hash, units, attendees, false, NULL
        FROM lines WHERE line_id = 'EXP-0006';                                                      -- the same receipt claimed by a colleague
      INSERT INTO lines VALUES                                                                      -- three dinners at one restaurant, one night, to stay under the limit
        ('EXP-0910', 'R-E050-x', 'E050', 'Client entertainment', 'Paris', getvariable('w0') + 2, 'EUR', 2400.00, '5812', 'Maison Blanche', 'rcpt-a1', 1, 6, false, NULL),
        ('EXP-0911', 'R-E050-x', 'E050', 'Client entertainment', 'Paris', getvariable('w0') + 2, 'EUR', 2350.00, '5812', 'Maison Blanche', 'rcpt-a2', 1, 6, false, NULL),
        ('EXP-0912', 'R-E050-x', 'E050', 'Client entertainment', 'Paris', getvariable('w0') + 3, 'EUR', 2280.00, '5812', 'Maison Blanche', 'rcpt-a3', 1, 6, false, NULL);
      UPDATE lines SET report_id = 'R-E050-' || strftime(getvariable('w1'), '%Y%W') WHERE employee = 'E050';
      -- A taxi receipt from last week, already reimbursed, claimed again.
      UPDATE lines SET receipt_hash = 'rcpt-' || md5('3' || strftime(getvariable('w1') - 7, '%Y%W')) WHERE line_id = 'EXP-0057';
      -- A flight booked on the corporate card, claimed again on the report.
      UPDATE lines SET paid_by_card = true, card_txn = 'CARD-77812' WHERE line_id = 'EXP-0014';
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO lines VALUES ('EXP-0950', 'R-E099-x', 'E099', 'Meals', 'Paris', getvariable('w0') + 1, 'EUR', 30.0, '5812', 'Cafe', 'rcpt-z', 1, NULL, false, NULL),
                               ('EXP-0951', 'R-E012-x', 'E012', 'Meals', 'Zurich', getvariable('w0') + 1, 'CHF', 45.0, '5812', 'Cafe Zurich', 'rcpt-y', 1, NULL, false, NULL);
      {% endif %}

      -- Corporate card feed: what the company already paid.
      CREATE TABLE card_feed AS SELECT 'CARD-77812' AS card_txn, 'E' || '021' AS employee, 'Air 0' AS merchant, getvariable('w0') + 1 AS posted_on, 380.0 * 0.85 AS amount_eur;
      UPDATE card_feed SET employee = (SELECT employee FROM lines WHERE line_id = 'EXP-0014');

      -- Reports and who approved them.
      CREATE TABLE reports AS
      SELECT report_id, employee, (SELECT manager FROM employees e WHERE e.employee = l.employee) AS approver FROM lines l GROUP BY ALL;
      -- One employee approved their own report.
      UPDATE reports SET approver = employee WHERE employee = 'E041';

      -- =======================================================================
      -- Data checks: these stop the batch.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'UNKNOWN_EMPLOYEE' AS code, employee AS ref, 'Report ' || any_value(report_id) || ' from an employee not in the HR file' AS detail FROM lines WHERE employee NOT IN (SELECT employee FROM employees) GROUP BY employee
      UNION ALL SELECT 'NO_RATE', line_id, 'No rate for ' || currency FROM lines WHERE currency NOT IN (SELECT currency FROM rates)
      UNION ALL SELECT 'DUPLICATE_LINE_ID', line_id, count(*) || ' rows' FROM lines GROUP BY line_id HAVING count(*) > 1;

      -- =======================================================================
      -- The rules, line by line.
      -- =======================================================================
      CREATE TABLE eur AS
      SELECT l.*, l.amount * r.eur AS eur, c.tier, e.department
      FROM lines l LEFT JOIN rates r USING (currency) LEFT JOIN cities c USING (city) LEFT JOIN employees e USING (employee)
      WHERE l.employee IN (SELECT employee FROM employees) AND l.currency IN (SELECT currency FROM rates);

      CREATE TABLE findings AS
      -- Over the limit for the category and city tier.
      SELECT e.line_id, 'OVER_LIMIT' AS rule, 'REDUCE' AS action,
             round(e.eur - lim.max_eur * coalesce(CASE lim.per WHEN 'night' THEN e.units WHEN 'person' THEN e.attendees END, 1), 2) AS amount_at_issue,
             e.category || ' ' || round(e.eur, 2) || ' EUR against ' || lim.max_eur || ' per ' || lim.per AS detail
      FROM eur e JOIN limits lim ON lim.category = e.category AND lim.city_tier = e.tier
      WHERE e.eur > lim.max_eur * coalesce(CASE lim.per WHEN 'night' THEN e.units WHEN 'person' THEN e.attendees END, 1)
      UNION ALL
      SELECT line_id, 'MISSING_RECEIPT', 'RETURN', round(eur, 2), 'No receipt for ' || round(eur, 2) || ' EUR (required above {{ inputs.receipt_threshold }})'
      FROM eur WHERE receipt_hash IS NULL AND eur > {{ inputs.receipt_threshold }}
      UNION ALL
      SELECT line_id, 'WEEKEND_MEAL', 'QUERY', round(eur, 2), 'Meal on a ' || dayname(spent_on) || ' with no trip that day'
      FROM eur e WHERE category = 'Meals' AND dayofweek(spent_on) IN (0, 6)
        AND NOT EXISTS (SELECT 1 FROM eur x WHERE x.employee = e.employee AND x.spent_on = e.spent_on AND x.category IN ('Hotel', 'Train', 'Flight'))
      UNION ALL
      SELECT e.line_id, 'BLOCKED_MERCHANT', 'REJECT', round(e.eur, 2), b.reason || ' (MCC ' || e.mcc || ', ' || e.merchant || ')'
      FROM eur e JOIN blocked_mcc b USING (mcc)
      UNION ALL
      -- The same receipt claimed twice, by anyone, this week or already paid.
      SELECT e.line_id, 'DUPLICATE_RECEIPT', 'REJECT', round(e.eur, 2),
             'Receipt also claimed on ' || coalesce((SELECT string_agg(x.line_id || ' by ' || x.employee, ', ') FROM eur x WHERE x.receipt_hash = e.receipt_hash AND x.line_id < e.line_id), 'a report already paid')
      FROM eur e WHERE e.receipt_hash IS NOT NULL AND (
        EXISTS (SELECT 1 FROM eur x WHERE x.receipt_hash = e.receipt_hash AND x.line_id < e.line_id)
        OR e.receipt_hash IN (SELECT unnest(from_json('{{ outputs.state.values.s | jq(".paid_receipts") | first | toJson }}', '["VARCHAR"]'))))
      UNION ALL
      SELECT e.line_id, 'PAID_BY_COMPANY_CARD', 'REJECT', round(e.eur, 2), 'Already paid by the company card (' || c.card_txn || ')'
      FROM eur e JOIN card_feed c ON c.card_txn = e.card_txn
      UNION ALL
      -- Splits: same employee, same merchant, within the window, together above the approver's limit,
      -- each line on its own below it.
      SELECT e.line_id, 'SPLIT_TRANSACTION', 'ESCALATE', round(e.eur, 2),
             'Part of ' || g.n || ' charges at ' || e.merchant || ' within {{ inputs.split_window_days }} days totalling ' || round(g.total, 2) || ' EUR, above the approver limit of ' || g.lim
      FROM eur e JOIN (
        SELECT a.line_id, count(*) AS n, sum(b.eur) AS total, any_value(al.max_report_eur) AS lim
        FROM eur a JOIN eur b ON a.employee = b.employee AND a.merchant = b.merchant AND abs(date_diff('day', a.spent_on, b.spent_on)) <= {{ inputs.split_window_days }}
        JOIN reports r ON r.report_id = a.report_id JOIN employees ap ON ap.employee = r.approver JOIN approver_limits al ON al.level = ap.approver_level
        GROUP BY a.line_id HAVING count(*) > 1 AND sum(b.eur) > any_value(al.max_report_eur) AND max(b.eur) <= any_value(al.max_report_eur)
      ) g USING (line_id);

      -- Report-level rules.
      CREATE TABLE report_findings AS
      SELECT r.report_id, 'SELF_APPROVAL' AS rule, 'ESCALATE' AS action, 'Approved by the claimant' AS detail FROM reports r WHERE r.approver = r.employee
      UNION ALL
      SELECT r.report_id, 'ABOVE_APPROVER_LIMIT', 'ESCALATE', 'Report total ' || round(t.total, 2) || ' EUR above ' || ap.approver_level || ' limit ' || al.max_report_eur
      FROM reports r JOIN (SELECT report_id, sum(eur) AS total FROM eur GROUP BY report_id) t USING (report_id)
      JOIN employees ap ON ap.employee = r.approver JOIN approver_limits al ON al.level = ap.approver_level WHERE t.total > al.max_report_eur;

      -- =======================================================================
      -- Decision per report. Lines with REJECT are removed, REDUCE are paid at
      -- the limit, RETURN and QUERY send the line back; ESCALATE holds the
      -- whole report for the controller.
      -- =======================================================================
      CREATE TABLE line_decision AS
      SELECT e.line_id, e.report_id, e.employee, e.category, e.merchant, e.spent_on, round(e.eur, 2) AS claimed_eur,
             string_agg(f.rule, ', ' ORDER BY f.rule) AS rules,
             CASE WHEN bool_or(f.action = 'REJECT') THEN 0
                  WHEN bool_or(f.action IN ('RETURN', 'QUERY')) THEN 0
                  WHEN bool_or(f.action = 'REDUCE') THEN round(e.eur - max(f.amount_at_issue) FILTER (WHERE f.action = 'REDUCE'), 2)
                  ELSE round(e.eur, 2) END AS approved_eur,
             CASE WHEN bool_or(f.action = 'REJECT') THEN 'REJECTED' WHEN bool_or(f.action IN ('RETURN', 'QUERY')) THEN 'RETURNED'
                  WHEN bool_or(f.action = 'REDUCE') THEN 'REDUCED' WHEN bool_or(f.action = 'ESCALATE') THEN 'ESCALATED' ELSE 'OK' END AS status,
             string_agg(f.detail, '; ') AS reasons
      FROM eur e LEFT JOIN findings f USING (line_id) GROUP BY e.line_id, e.report_id, e.employee, e.category, e.merchant, e.spent_on, e.eur;

      CREATE TABLE report_decision AS
      SELECT d.report_id, d.employee, count(*) AS lines, sum(d.claimed_eur) AS claimed_eur, sum(d.approved_eur) AS approved_eur,
             count(*) FILTER (WHERE d.status <> 'OK') AS flagged_lines,
             CASE WHEN bool_or(d.status = 'ESCALATED') OR EXISTS (SELECT 1 FROM report_findings rf WHERE rf.report_id = d.report_id) THEN 'HELD_FOR_CONTROLLER'
                  ELSE 'PAY' END AS decision,
             (SELECT string_agg(rf.rule || ': ' || rf.detail, '; ') FROM report_findings rf WHERE rf.report_id = d.report_id) AS report_reasons
      FROM line_decision d GROUP BY d.report_id, d.employee;

      CREATE TABLE batch AS
      SELECT r.report_id, r.employee, e.name, e.department, round(r.approved_eur, 2) AS amount_eur
      FROM report_decision r JOIN employees e USING (employee) WHERE r.decision = 'PAY' AND r.approved_eur > 0 ORDER BY r.report_id;

      -- Repeat offenders: flags this week plus those stored for the previous weeks.
      CREATE TABLE offenders AS
      WITH now_ AS (SELECT employee, count(*) AS flags FROM line_decision WHERE status IN ('REJECTED', 'RETURNED', 'REDUCED', 'ESCALATED') GROUP BY employee),
           past AS (SELECT key AS employee, value::INT AS flags FROM json_each('{{ outputs.state.values.s | jq(".flags") | first | toJson }}'))
      SELECT coalesce(n.employee, p.employee) AS employee, coalesce(n.flags, 0) AS this_week, coalesce(p.flags, 0) + coalesce(n.flags, 0) AS rolling
      FROM now_ n FULL JOIN past p USING (employee) ORDER BY rolling DESC;

      COPY (SELECT * FROM line_decision ORDER BY status <> 'OK' DESC, line_id) TO '{{ outputFiles.lines }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM report_decision ORDER BY decision, report_id) TO '{{ outputFiles.reports }}' (HEADER, DELIMITER ',');
      COPY batch TO '{{ outputFiles.batch }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM offenders WHERE rolling >= 3) TO '{{ outputFiles.offenders }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM line_decision)::INT AS lines, (SELECT count(DISTINCT report_id) FROM line_decision)::INT AS reports,
        (SELECT round(sum(claimed_eur), 2)::DOUBLE FROM line_decision) AS claimed,
        (SELECT round(sum(amount_eur), 2)::DOUBLE FROM batch) AS to_pay, (SELECT count(*) FROM batch)::INT AS reports_paid,
        (SELECT round(sum(claimed_eur - approved_eur), 2)::DOUBLE FROM line_decision WHERE report_id IN (SELECT report_id FROM report_decision WHERE decision = 'PAY')) AS savings,
        (SELECT string_agg(rule || ' ' || n, ', ' ORDER BY n DESC) FROM (SELECT rule, count(*) AS n FROM findings GROUP BY rule)) AS findings_by_rule,
        (SELECT coalesce(string_agg(report_id || ' (' || report_reasons || ')', '; '), '') FROM report_decision WHERE decision = 'HELD_FOR_CONTROLLER' AND report_reasons IS NOT NULL) AS held_reports,
        (SELECT count(*) FROM report_decision WHERE decision = 'HELD_FOR_CONTROLLER')::INT AS held,
        (SELECT coalesce(string_agg(employee || ' ' || rolling, ', '), '') FROM offenders WHERE rolling >= 3) AS repeat_offenders,
        (SELECT json_group_array(receipt_hash)::VARCHAR FROM eur WHERE receipt_hash IS NOT NULL AND line_id IN (SELECT line_id FROM line_decision WHERE status IN ('OK', 'REDUCED'))
           AND report_id IN (SELECT report_id FROM batch)) AS paid_receipts,
        (SELECT json_group_object(employee, rolling)::VARCHAR FROM offenders) AS flags,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.audit.outputs | last).row | toJson }}"

  - id: log_audit
    type: io.kestra.plugin.core.log.Log
    message: |
      Expense audit, week ending {{ inputs.week_ending }} ({{ inputs.scenario }}).
      {{ outputs.result.values.r | jq('"\(.lines) lines on \(.reports) reports, \(.claimed) EUR claimed. Findings: \(.findings_by_rule)."') | first }}
      {{ outputs.result.values.r | jq('"Batch: \(.reports_paid) reports, \(.to_pay) EUR. Removed or reduced on paid reports: \(.savings) EUR. Held for the controller: \(.held) \(.held_reports)."') | first }}
      {{ outputs.result.values.r | jq('"Repeat offenders (3+ flags): \(.repeat_offenders). Blockers: \(.blockers). \(.blocker_detail)"') | first }}

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/lines.csv": "{{ outputs.audit.outputFiles.lines }}"
      "{{ render(vars.pack_dir) }}/reports.csv": "{{ outputs.audit.outputFiles.reports }}"
      "{{ render(vars.pack_dir) }}/reimbursement-batch.csv": "{{ outputs.audit.outputFiles.batch }}"
      "{{ render(vars.pack_dir) }}/repeat-offenders.csv": "{{ outputs.audit.outputFiles.offenders }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.audit.outputFiles.blockers }}"

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.blockers > 0') | first }}"
    then:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The batch for the week ending {{ inputs.week_ending }} is not released: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: Marks the week as paid, remembers the paid receipts so they can never be claimed again, and keeps the rolling flags.
    key: "{{ vars.state_key }}"
    kvType: JSON
    value: >-
      {{ {'old': fromJson(outputs.state.values.s), 'r': fromJson(outputs.result.values.r), 'w': inputs.week_ending}
         | jq('{weeks: (.old.weeks + [.w]), paid_receipts: (.old.paid_receipts + (.r.paid_receipts | fromjson)), flags: (.r.flags | fromjson)}') | first | toJson }}

  - id: log_released
    type: io.kestra.plugin.core.log.Log
    message: "Reimbursement batch released: {{ outputs.result.values.r | jq('.reports_paid') | first }} reports, {{ outputs.result.values.r | jq('.to_pay') | first }} EUR. File in {{ render(vars.pack_dir) }}/reimbursement-batch.csv."

extend:
  title: Audit expense reports against policy before reimbursement and release a clean payment batch
  metaTitle: Expense report policy audit and reimbursement batch with Kestra and DuckDB
  shortDescription: Check every expense line against limits, receipts, blocked merchants and weekend rules, catch duplicate receipts, split charges, self-approval and card spend claimed twice, then release a clean batch.
  metaDescription: Weekly T&E expense audit in Kestra and DuckDB. Policy limits, duplicate receipts, split transactions, self-approval and a clean reimbursement batch.
  description: |
    Expense fraud and policy leakage are small per line and large in total, and most companies check only a sample of reports. This flow checks every line, every week, before anything is paid. It reduces a line to its policy limit, removes it, sends it back, or holds the report for the controller, and it releases only the clean reimbursements to payroll or AP.

    It runs with no setup and no network. DuckDB generates a week of 400 expense lines from 50 employees in six cities (EUR, GBP, USD). Nine findings are planted in it:
    - a 420 EUR hotel night in Paris,
    - two lines without receipts,
    - a Sunday dinner with no trip,
    - a bar,
    - a receipt claimed again by a colleague,
    - three client dinners at one restaurant on two nights to stay under the approval limit,
    - a flight already paid by the corporate card,
    - a report approved by its own author.

    From the second week on, the demo also reuses a receipt from a week already paid.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Rules

    | Rule | Scope | Action |
    |---|---|---|
    | `OVER_LIMIT` | Category and city-tier limit, per night, trip, day or attendee | Paid at the limit |
    | `MISSING_RECEIPT` | Above `receipt_threshold` | Sent back |
    | `WEEKEND_MEAL` | A meal on Saturday or Sunday with no hotel, train or flight that day | Sent back for an explanation |
    | `BLOCKED_MERCHANT` | Blocked merchant category codes (bars, gambling, liquor stores...) | Rejected |
    | `DUPLICATE_RECEIPT` | The same receipt fingerprint on two lines, by anyone, or already reimbursed in an earlier week (KV) | Rejected |
    | `PAID_BY_COMPANY_CARD` | The line matches a corporate card transaction | Rejected |
    | `SPLIT_TRANSACTION` | Charges by one employee at one merchant within `split_window_days` that together exceed the approver's limit while each one stays under it | Report held |
    | `SELF_APPROVAL` | The approver is the claimant | Report held |
    | `ABOVE_APPROVER_LIMIT` | Report total above the approver level's limit | Report held |

    A report with nothing held goes into `reimbursement-batch.csv`, at the approved amounts. Flags per employee add up across weeks, and three or more puts the employee on the repeat-offender list for the controller.

    ## How it works

    1. `state` reads the paid weeks, the receipt fingerprints already reimbursed and the rolling flags. `week_gate` refuses a week already paid.
    2. `audit` (`io.kestra.plugin.jdbc.duckdb.Queries`) holds the policy, the HR file, the lines, the card feed and the reports. It runs every rule, then makes the line and report decisions, builds the batch and the offender list, and runs the data checks.
    3. `log_audit` prints the result. `evidence` stores `lines.csv` (every line with its rules, approved amount, status and reasons), `reports.csv`, `reimbursement-batch.csv`, `repeat-offenders.csv` and `blockers.csv`.
    4. `gate` stops the batch on data errors: an employee missing from the HR file, a currency with no rate, a duplicate line id.
    5. `save_state` (`io.kestra.plugin.core.kv.Set`) marks the week paid, adds its receipts to the paid list so they can never be claimed again, and stores the flags.

    ## Tested end to end

    On Kestra 2.0.3 OSS.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | week ending 2026-10-04 | 404 lines, 50 reports, 45,342.21 EUR claimed. Every planted finding was caught: 5 over the limit (the hotel night paid at 260 instead of 420), 3 split dinners, 2 missing receipts, 1 weekend meal, 1 duplicate receipt, 1 bar, 1 card-paid flight. 2 reports held: one self-approved, one 7,894.44 EUR above its manager's 2,500 limit. Batch: 48 reports, 35,705.64 EUR |
    | 2 | same week again | Refused: already paid |
    | 3 | week ending 2026-10-11 | Also rejects a taxi receipt reimbursed the week before. The employee with the split dinners now has 6 flags |
    | 4 | 2026-10-18 `ISSUES` | Batch not released: an employee missing from the HR file, a CHF line with no rate |

    I recomputed the batch independently from `lines.csv` and `reports.csv`: the approved amounts of the 48 paid reports add up to 35,705.64.

    ## Problems found while testing

    - **Planted findings landed on the wrong lines.** The first version put a missing receipt and the Sunday dinner on lines that were never claimed. Only 4 of the 9 stories appeared, and nothing failed. The findings are now on lines that exist.
    - **Every receipt looked like a duplicate in week two.** The demo used the same receipt fingerprints every week, so the paid-receipt check rejected 380 lines. Fingerprints now depend on the week, and one real reuse is planted.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `week_ending` | `2026-10-04` | The Sunday ending the week |
    | `scenario` | `CLEAN` | Demo only |
    | `receipt_threshold` | `25.0` | Receipt required above this |
    | `split_window_days` | `2` | Window for split charges |

    ## Use it with your data

    - Replace `limits`, `cities`, `blocked_mcc`, `approver_limits` and `rates` with your policy.
    - Replace `employees`, `lines`, `card_feed` and `reports` with exports from your HRIS, your expense tool (receipt fingerprint = a hash of the image or of date, merchant and amount), and your card program.
    - Send `reimbursement-batch.csv` to payroll or AP, and `lines.csv` back to the expense tool for the returned and rejected lines.

    ## Things to know

    - Flags are cumulative. Reset them yearly by editing the KV key `expense_audit`.
    - VAT recovery on expenses, mileage and per diems need their own rules.

