id: datacite-research-dataset-lakehouse-loader
namespace: company.analytics
description: Ingests persistent research datasets, scientific DOIs, citation metrics, and open-access licensing metadata from DataCite into Parquet lakehouse storage via DuckDB, tracking registered datasets in Kestra KV store.

inputs:
  - id: query_prefix
    type: STRING
    description: DOI authority prefix or query term to filter scientific research data deposits.
    defaults: "prefix:10.5061"

  - id: page_size
    type: INT
    description: Maximum number of research data records to harvest.
    defaults: 25

  - id: citation_impact_threshold
    type: INT
    description: Citation count threshold to classify research datasets as high-impact.
    defaults: 5

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed research DOI identifiers.
    defaults: datacite_monitored_dois_state

variables:
  default_state: "[]"

triggers:
  - id: monthly_datacite_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 1 * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_dois
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import urllib.parse
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_dois = set(json.loads(raw_state)) if raw_state else set()
        except Exception:
            seen_dois = set()

        q_prefix = "{{ inputs.query_prefix }}"
        size = int("{{ inputs.page_size }}")
        threshold = int("{{ inputs.citation_impact_threshold }}")

        encoded_q = urllib.parse.quote(q_prefix)
        url = f"https://api.datacite.org/dois?query={encoded_q}&page[size]={size}"
        headers = {"User-Agent": "KestraDataCiteLakehouse/1.0 (open-science@kestra.io)"}

        records = []
        high_impact_datasets = []
        harvested_dois = []

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                items = data.get("data", [])
                for item in items:
                    doi = item.get("id", "")
                    attrs = item.get("attributes", {})

                    titles = attrs.get("titles", [])
                    primary_title = titles[0].get("title", "") if titles else ""

                    publisher = attrs.get("publisher", "")
                    pub_year = int(attrs.get("publicationYear", 0) or 0)
                    resource_type = attrs.get("types", {}).get("resourceTypeGeneral", "Dataset")

                    creators = attrs.get("creators", [])
                    creator_names = ", ".join([c.get("name", "") for c in creators if c.get("name")])[:200]

                    citation_count = int(attrs.get("citationCount", 0) or 0)
                    download_count = int(attrs.get("downloadCount", 0) or 0)

                    is_impact = citation_count >= threshold
                    is_new = doi not in seen_dois

                    harvested_dois.append(doi)

                    records.append({
                        "doi": doi,
                        "title": primary_title,
                        "creators": creator_names,
                        "publisher": publisher,
                        "publication_year": pub_year,
                        "resource_type": resource_type,
                        "citation_count": citation_count,
                        "download_count": download_count,
                        "is_high_impact": is_impact,
                        "is_new_doi": is_new,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_impact:
                        high_impact_datasets.append({"doi": doi, "title": primary_title, "citations": citation_count})
        except Exception as e:
            print(f"Error fetching DataCite research datasets: {e}")

        with open("datacite_datasets.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE datacite_dois AS SELECT * FROM read_json_auto('datacite_datasets.json')")
            con.execute("COPY datacite_dois TO 'datacite_research_datasets.parquet' (FORMAT PARQUET)")
            con.execute("COPY datacite_dois TO 'datacite_research_datasets.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE datacite_dois (
                    doi VARCHAR,
                    title VARCHAR,
                    creators VARCHAR,
                    publisher VARCHAR,
                    publication_year INTEGER,
                    resource_type VARCHAR,
                    citation_count INTEGER,
                    download_count INTEGER,
                    is_high_impact BOOLEAN,
                    is_new_doi BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY datacite_dois TO 'datacite_research_datasets.parquet' (FORMAT PARQUET)")
            con.execute("COPY datacite_dois TO 'datacite_research_datasets.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_harvested_dois": len(records),
            "high_impact_count": len(high_impact_datasets),
            "high_impact_datasets": high_impact_datasets[:5],
            "updated_state": list(set(list(seen_dois) + harvested_dois))[:500]
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - datacite_research_datasets.parquet
      - datacite_research_datasets.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_dois.vars.updated_state | toJson }}"

  - id: check_high_impact
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_dois.vars.high_impact_count > 0 }}"
    then:
      - id: notify_high_impact
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "🔬 Open Science Research Impact: Harvested {{ outputs.ingest_and_transform_dois.vars.high_impact_count }} dataset(s) with at least {{ inputs.citation_impact_threshold }} academic citations."

outputs:
  - id: total_datasets
    type: INT
    value: "{{ outputs.ingest_and_transform_dois.vars.total_harvested_dois }}"
  - id: high_impact_count
    type: INT
    value: "{{ outputs.ingest_and_transform_dois.vars.high_impact_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_dois.outputFiles['datacite_research_datasets.parquet'] }}"

extend:
  title: DataCite Scientific Research Dataset Lakehouse Loader with DuckDB
  metaTitle: DataCite Scientific Datasets Lakehouse Loader | Kestra
  shortDescription: Ingests persistent research datasets, scientific DOIs, citation metrics, and open-access licensing metadata from DataCite into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll DataCite REST API for research datasets and persistent DOIs, convert citation telemetry into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, bibliometric harmonization, and analytical lakehouse persistence of persistent
    scientific research datasets, digital object identifiers (DOIs), creators, and citation counts from DataCite into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`datacite_monitored_dois_state`) for previously verified research DOI identifiers.
    2. **DataCite Ingestion**: Queries the official DataCite REST API (`api.datacite.org/dois`) across configured repository prefixes or academic disciplines.
    3. **DuckDB Scientometric Normalization**: Unpacks publication years, creators, publishers, resource types, and citation counts into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized scientific dataset records into columnar Parquet and CSV files for academic research tracking and research impact auditing.
    5. **Impact Evaluation & State Commitment**: Detects datasets meeting high-citation criteria, logs discovery summaries, and commits state to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of global open science and research dataset registries.
    - Columnar Parquet datasets queryable with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Academic Research Librarians and Scientometrics Analysts tracking data sharing impact.
    - Open Science Program Officers auditing institutional repository compliance.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical DOI indexing state across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `api.datacite.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding high-impact research notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Configure your target `query_prefix` (e.g. `prefix:10.5061` for Dryad).
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `monthly_datacite_sync` schedule for automated monthly updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition monthly research DOI archives.
    - Connect a CrossRef publication cross-referencing task in DuckDB.

    ## Links

    - [DataCite REST API Documentation](https://support.datacite.org/docs/api)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
