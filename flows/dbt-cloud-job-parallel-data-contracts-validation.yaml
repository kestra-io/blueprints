id: dbt-cloud-job-parallel-data-contracts-validation
namespace: company.team

description: |
  Event-driven data quality and contract validation flow triggered by a dbt Cloud job completion webhook.
  Downloads real run_results.json artifacts from the dbt Cloud API, executes parallel data contract assertions
  and DuckDB analytical smoke queries, and notifies Slack only when regressions or contract violations occur.

inputs:
  - id: dbt_cloud_account_id
    type: STRING
    displayName: dbt Cloud Account ID
    description: Numeric dbt Cloud account ID hosting the production jobs.
    defaults: "123456"

  - id: dbt_cloud_run_id
    type: STRING
    displayName: dbt Cloud Run ID
    description: Fallback run ID for manual test executions when not triggered via webhook.
    defaults: "789101"

  - id: dbt_cloud_job_name
    type: STRING
    displayName: dbt Cloud Job Name
    description: Human-readable name or model namespace of the completed dbt Cloud job.
    defaults: "marts_analytics_daily"

  - id: dbt_cloud_host
    type: STRING
    displayName: dbt Cloud API Host
    description: Base URL for the dbt Cloud Administrative API (e.g. https://cloud.getdbt.com or regional cell domain).
    defaults: "https://cloud.getdbt.com"

  - id: min_rows_affected
    type: INT
    displayName: Minimum Rows Affected
    description: Minimum rows affected threshold for models reporting adapter metrics to detect silent empty builds.
    defaults: 1

  - id: max_run_age_hours
    type: FLOAT
    displayName: Maximum Run Age (Hours)
    description: Maximum allowable elapsed time between artifact generation in dbt Cloud and validation execution.
    defaults: 24.0

  - id: slack_channel
    type: STRING
    displayName: Slack Notification Channel
    description: Target Slack channel receiving alerts when regressions are detected.
    defaults: "#data-ops-alerts"

triggers:
  - id: dbt_cloud_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP webhook endpoint called by dbt Cloud when a job run completes.
    key: "{{ secret('DBT_WEBHOOK_KEY') }}"

tasks:
  - id: verify_run_status
    type: io.kestra.plugin.core.flow.If
    description: Inspect the webhook payload to ensure the dbt Cloud run succeeded before running contract checks
    condition: "{{ (trigger.body.data.runStatus ?? 'Success') == 'Success' }}"
    then:
      - id: check_dbt_run
        type: io.kestra.plugin.dbt.cloud.CheckStatus
        description: Confirm run completion state with dbt Cloud Administrative API
        baseUrl: "{{ inputs.dbt_cloud_host }}"
        accountId: "{{ (trigger.body.accountId ?? inputs.dbt_cloud_account_id) | string }}"
        token: "{{ secret('DBT_CLOUD_API_TOKEN') }}"
        runId: "{{ (trigger.body.data.runId ?? inputs.dbt_cloud_run_id) | string }}"
        failOnUnsuccessful: false
        pollFrequency: PT5S
        maxDuration: PT5M

      - id: download_run_results
        type: io.kestra.plugin.core.http.Download
        description: Download the run_results.json artifact from the dbt Cloud Administrative API
        uri: "{{ inputs.dbt_cloud_host }}/api/v2/accounts/{{ (trigger.body.accountId ?? inputs.dbt_cloud_account_id) }}/runs/{{ (trigger.body.data.runId ?? inputs.dbt_cloud_run_id) }}/artifacts/run_results.json"
        headers:
          Authorization: "Token {{ secret('DBT_CLOUD_API_TOKEN') }}"
          Accept: "application/json"
        failOnEmptyResponse: true
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT10S
          maxAttempts: 3

      - id: parallel_validations
        type: io.kestra.plugin.core.flow.Parallel
        description: Concurrently validate dbt model contract assertions and execute DuckDB analytical smoke tests
        tasks:
          - id: check_data_contracts
            type: io.kestra.plugin.jdbc.duckdb.Query
            description: Assert zero contract violations, compilation failures, or test errors across dbt model results
            inputFiles:
              run_results.json: "{{ outputs.download_run_results.uri }}"
            fetchOne: true
            sql: |
              WITH parsed_results AS (
                SELECT unnest(results) AS r
                FROM read_json_auto('{{ workingDir }}/run_results.json')
              )
              SELECT
                COUNT(*)::INTEGER AS total_executed,
                COUNT(*) FILTER (WHERE r.status IN ('fail', 'error'))::INTEGER AS failed_or_errored_count,
                COUNT(*) FILTER (
                  WHERE r.status IN ('fail', 'error')
                    AND (lower(coalesce(r.message, '')) LIKE '%contract%' OR lower(coalesce(r.message, '')) LIKE '%constraint%')
                )::INTEGER AS contract_violations_count,
                CASE
                  WHEN COUNT(*) FILTER (WHERE r.status IN ('fail', 'error')) > 0
                  THEN true
                  ELSE false
                END AS contract_regression
              FROM parsed_results;

          - id: run_analytical_smoke_tests
            type: io.kestra.plugin.jdbc.duckdb.Query
            description: Execute analytical smoke queries over artifact metadata, verifying run freshness and rows affected
            inputFiles:
              run_results.json: "{{ outputs.download_run_results.uri }}"
            fetchOne: true
            sql: |
              WITH file_data AS (
                SELECT
                  metadata.generated_at::TIMESTAMP AS generated_at,
                  coalesce(elapsed_time, 0.0)::DOUBLE AS total_elapsed_time,
                  results
                FROM read_json_auto('{{ workingDir }}/run_results.json')
              ),
              flattened_models AS (
                SELECT
                  f.generated_at,
                  f.total_elapsed_time,
                  unnest(f.results) AS r
                FROM file_data f
              )
              SELECT
                COUNT(*) FILTER (WHERE r.unique_id LIKE 'model.%')::INTEGER AS total_models_executed,
                round(date_diff('second', min(generated_at), current_timestamp) / 3600.0, 2) AS run_age_hours,
                COUNT(*) FILTER (
                  WHERE r.unique_id LIKE 'model.%'
                    AND r.adapter_response.rows_affected IS NOT NULL
                    AND r.adapter_response.rows_affected < {{ inputs.min_rows_affected }}
                )::INTEGER AS models_below_row_threshold,
                CASE
                  WHEN (date_diff('second', min(generated_at), current_timestamp) / 3600.0) > {{ inputs.max_run_age_hours }}
                    OR COUNT(*) FILTER (
                      WHERE r.unique_id LIKE 'model.%'
                        AND r.adapter_response.rows_affected IS NOT NULL
                        AND r.adapter_response.rows_affected < {{ inputs.min_rows_affected }}
                    ) > 0
                  THEN true
                  ELSE false
                END AS smoke_test_regression
              FROM flattened_models;

      - id: evaluate_regressions
        type: io.kestra.plugin.core.flow.If
        description: Evaluate combined validation gates; dispatch Slack alert on regression or record healthy metrics
        condition: "{{ outputs.check_data_contracts.row.contract_regression == true or outputs.run_analytical_smoke_tests.row.smoke_test_regression == true }}"
        then:
          - id: alert_slack_regression
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Send Slack alert detailing the failed contract checks and dbt Cloud run link
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "channel": "{{ inputs.slack_channel }}",
                "text": "🚨 *dbt Cloud Data Contract Regression Alert*\n*Job:* {{ trigger.body.data.jobName ?? inputs.dbt_cloud_job_name }}\n*Run ID:* {{ trigger.body.data.runId ?? inputs.dbt_cloud_run_id }}\n*Contract Failures:* {{ outputs.check_data_contracts.row.failed_or_errored_count }} failed/errored node(s) ({{ outputs.check_data_contracts.row.contract_violations_count }} contract-specific violations)\n*Smoke Tests:* {{ outputs.run_analytical_smoke_tests.row.models_below_row_threshold }} model(s) below row threshold of {{ inputs.min_rows_affected }}, Run Age: {{ outputs.run_analytical_smoke_tests.row.run_age_hours }}h (max: {{ inputs.max_run_age_hours }}h)\n*Run Console:* <{{ inputs.dbt_cloud_host }}/deploy/{{ trigger.body.accountId ?? inputs.dbt_cloud_account_id }}/projects/runs/{{ trigger.body.data.runId ?? inputs.dbt_cloud_run_id }}|View in dbt Cloud>\nExecution: `{{ execution.id }}`"
              }
        else:
          - id: log_clean_run
            type: io.kestra.plugin.core.log.Log
            description: Log passing validation metrics when zero regressions are detected
            message: |
              ✅ dbt Cloud run validation passed cleanly without regressions.
              Run ID: {{ trigger.body.data.runId ?? inputs.dbt_cloud_run_id }}
              Total Nodes Audited: {{ outputs.check_data_contracts.row.total_executed }}
              Models Evaluated: {{ outputs.run_analytical_smoke_tests.row.total_models_executed }}
              Failed or Errored Tests: {{ outputs.check_data_contracts.row.failed_or_errored_count }}
              Contract Violations: {{ outputs.check_data_contracts.row.contract_violations_count }}
              Run Age: {{ outputs.run_analytical_smoke_tests.row.run_age_hours }} hours
              Zero models below minimum rows affected threshold ({{ inputs.min_rows_affected }}).
              No Slack notification required.
    else:
      - id: log_non_success_status
        type: io.kestra.plugin.core.log.Log
        description: Log warning when dbt Cloud webhook indicates a cancelled or failed job run
        level: WARN
        message: |
          ⚠️ dbt Cloud run {{ trigger.body.data.runId ?? inputs.dbt_cloud_run_id }} finished with status '{{ trigger.body.data.runStatus ?? "Unknown" }}' (expected 'Success').
          Skipping contract assertions and analytical smoke tests because transformation job did not succeed.

outputs:
  - id: contract_regression
    type: BOOLEAN
    value: "{{ outputs.check_data_contracts.row.contract_regression ?? false }}"
  - id: smoke_test_regression
    type: BOOLEAN
    value: "{{ outputs.run_analytical_smoke_tests.row.smoke_test_regression ?? false }}"
  - id: failed_or_errored_count
    type: INT
    value: "{{ outputs.check_data_contracts.row.failed_or_errored_count ?? 0 }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack if dbt Cloud contract validation flow fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "CRITICAL: dbt Cloud data contract validation failed on execution `{{ execution.id }}`."
      }

extend:
  title: Validate dbt Cloud Data Contracts and DuckDB Smoke Tests in Parallel
  metaTitle: dbt Cloud Data Contracts & DuckDB Smoke Validation | Kestra
  shortDescription: Intercept dbt Cloud completion webhooks to run parallel contract assertions and DuckDB analytical smoke tests, alerting Slack only on regressions.
  metaDescription: Validate dbt Cloud job completion with parallel data contract checks and DuckDB smoke queries. Alert Slack only when data regressions occur.
  tags:
    - Data
  subTags:
    - dbt Transformations
    - Testing & Quality
  ee: false
  demo: false
  description: |
    Automate post-transformation data quality enforcement by reacting directly to dbt Cloud job completion events.
    Instead of waiting for downstream dashboard users or business stakeholders to discover broken schemas and
    silent failures, this blueprint intercepts dbt Cloud webhooks, verifies model contract invariants, and executes
    concurrent DuckDB SQL analytical smoke tests before notifying Slack only when an actual data regression occurs.

    ## How it works

    1. **Webhook Ingestion**: An authenticated `io.kestra.plugin.core.trigger.Webhook` triggers the flow upon receiving a `job.run.completed` event from dbt Cloud. The webhook endpoint is secured via `key: "{{ secret('DBT_WEBHOOK_KEY') }}"`. Note: dbt Cloud payload HMAC signatures (`x-dbt-signature`) can be validated at the ingress gateway layer or authenticated directly via Kestra's webhook key parameter.
    2. **Run Status Gate**: An `io.kestra.plugin.core.flow.If` task evaluates whether `trigger.body.data.runStatus` equals `Success`. If the run was canceled, timed out, or crashed upstream, contract checks are bypassed and an informative diagnostic log is emitted.
    3. **dbt Cloud Status Verification**: The `io.kestra.plugin.dbt.cloud.CheckStatus` task queries the dbt Cloud Administrative API with `failOnUnsuccessful: false` to verify run completion and check job status.
    4. **Artifact Retrieval**: The `io.kestra.plugin.core.http.Download` task fetches the genuine `run_results.json` artifact directly from the dbt Cloud Administrative API using `DBT_CLOUD_API_TOKEN`. The HTTP request includes an exponential retry policy and fails immediately if the API response is empty.
    5. **Parallel Validation Engine**: An `io.kestra.plugin.core.flow.Parallel` block initiates two concurrent evaluation branches powered by embedded DuckDB:
       - **Branch A (Contract Schema Assertions)**: Reads the downloaded `run_results.json` and evaluates all executed model and test results, counting node errors and detecting contract or constraint failures.
       - **Branch B (Analytical Smoke Tests)**: Reads `run_results.json` to extract run generation timestamps and model adapter metadata, asserting that the run age is within `max_run_age_hours` and that row modification counts satisfy `min_rows_affected`.
    6. **Conditional Alert Routing**: A downstream `io.kestra.plugin.core.flow.If` task inspects boolean flags from both branches. If any contract violation or smoke test fails, `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` delivers a formatted regression alert with run ID, job name, violation details, and a direct link to the dbt Cloud console. If both branches pass, the flow logs success metrics and finishes silently without alert noise.

    ## What you get

    - **Zero-Lag Event-Driven Assurance**: Immediate contract validation the moment dbt Cloud finishes building models.
    - **Genuine Artifact Inspection**: Direct SQL evaluation over real dbt Cloud build artifacts with no hard-coded or simulated test results.
    - **Concurrent Validation**: Parallel execution of contract assertions alongside analytical smoke tests to reduce overall pipeline latency.
    - **Noise-Free Alerting**: Slack alerts fire strictly when regression criteria are breached; clean runs finish silently with full execution audit logs.
    - **Flexible Manual Execution**: Supports manual trigger executions by falling back to user-provided input parameters when no webhook payload is present.

    ## Who it's for

    - **Analytics Engineers**: Enforcing schema contracts and preventing silent data degradation in core marts.
    - **Data Platform Teams**: Coordinating cross-system data quality gates between dbt Cloud and operational storage.
    - **Data Governance and Quality Practitioners**: Establishing automated audit trails and immediate alerting on contract regressions.

    ## Why orchestrate this with Kestra

    While dbt Cloud can run built-in schema tests, it lacks native mechanisms to coordinate multi-tool post-build gates, execute external DuckDB analytical assertions concurrently, or intelligently suppress alerting on healthy executions while dispatching high-context alerts on failure. Kestra bridges this gap with declarative YAML orchestration, native parallel branch execution, secure secret injection, and event-driven webhook triggering.

    ## Prerequisites

    - A dbt Cloud account with configured jobs.
    - An incoming Slack webhook URL for alert delivery.

    ### Secrets

    - `DBT_WEBHOOK_KEY`: Secret authentication key securing the incoming Kestra webhook URL.
    - `DBT_CLOUD_API_TOKEN`: Service token or personal access token with read permissions for the dbt Cloud Administrative API.
    - `SLACK_WEBHOOK_URL`: Incoming Slack webhook URL receiving regression alerts.

    ## Quick start

    1. Add `DBT_WEBHOOK_KEY`, `DBT_CLOUD_API_TOKEN`, and `SLACK_WEBHOOK_URL` to your Kestra namespace secrets.
    2. In your dbt Cloud Account Settings under **Webhooks**, create a new webhook pointing to your Kestra webhook URL (`https://<kestra-host>/api/v1/main/executions/webhook/company.team/dbt-cloud-job-parallel-data-contracts-validation/<your-webhook-key>`) subscribed to the `Run completed` event.
    3. Test the flow manually in the Kestra UI by clicking **Execute** with default parameters or providing a known failing `dbt_cloud_run_id` to verify Slack alert delivery.
    4. Verify execution logs to confirm parallel contract assertions and DuckDB smoke tests completed successfully.

    ## How to extend

    - **Data Warehouse Connection**: Extend Branch B with additional DuckDB queries pointing to your Snowflake, BigQuery, or MotherDuck warehouse using DuckDB extensions to audit production tables directly.
    - **Automated Rollback**: Add a downstream task in the regression branch to trigger a dbt Cloud rollback job or revert Git branches when critical data contracts fail.
    - **Catalog Lineage Updates**: Emit OpenLineage or DataHub contract certification tags when validations pass successfully.

    ## Links

    - [Kestra dbt Plugin Documentation](https://kestra.io/plugins/plugin-dbt)
    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [dbt Cloud Administrative API Documentation](https://docs.getdbt.com/dbt-cloud/api-v2)
