id: crane-container-image-digest-pinning-and-platform-gate
namespace: company.infrastructure

description: |
  Inspect a remote container image with Crane, pin its mutable tag to an immutable
  SHA256 digest, verify multi-architecture platform coverage, and enforce a layer
  size budget before approving the image for deployment.

inputs:
  - id: image_uri
    type: STRING
    displayName: Container Image URI
    description: Full container image reference to inspect (e.g., cgr.dev/chainguard/static:latest or alpine:3.20).
    required: false
    defaults: cgr.dev/chainguard/static:latest

  - id: required_platforms
    type: STRING
    displayName: Required Platforms
    description: Comma-separated list of target OS/architectures that must be supported by the image index.
    required: false
    defaults: linux/amd64,linux/arm64

  - id: max_image_size_mb
    type: INT
    displayName: Maximum Layer Size Budget (MB)
    description: Maximum permissible compressed layer size in megabytes before flagging a size budget warning.
    required: false
    defaults: 250

  - id: registry_username
    type: STRING
    displayName: Registry Username
    description: Username for private OCI container registry authentication (leave empty for public images).
    required: false
    defaults: ""

  - id: warning_slack_channel
    type: STRING
    displayName: Warning Slack Channel
    description: Slack channel for non-blocking platform/size warnings.
    required: false
    defaults: "#devops-alerts"

  - id: critical_slack_channel
    type: STRING
    displayName: Critical Slack Channel
    description: Slack channel for critical rejections requiring immediate attention.
    required: false
    defaults: "#platform-oncall"

tasks:
  - id: crane_inspect
    type: io.kestra.plugin.scripts.shell.Commands
    description: Query remote OCI container registry using Crane to fetch immutable digest, raw manifest, and image config.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: gcr.io/go-containerregistry/crane:v0.20.2
    env:
      IMAGE_URI: "{{ inputs.image_uri }}"
      REGISTRY_USER: "{{ inputs.registry_username }}"
      REGISTRY_PASS: "{{ secret('REGISTRY_TOKEN') }}"
    commands:
      - |
        set -euo pipefail

        # Authenticate if credentials are provided
        if [ -n "${REGISTRY_USER:-}" ] && [ -n "${REGISTRY_PASS:-}" ]; then
          REGISTRY_HOST=$(echo "${IMAGE_URI}" | cut -d'/' -f1)
          echo "Authenticating to registry: ${REGISTRY_HOST}"
          echo "${REGISTRY_PASS}" | crane auth login "${REGISTRY_HOST}" -u "${REGISTRY_USER}" --password-stdin
        fi

        echo "Inspecting remote image: ${IMAGE_URI}"
        crane digest --full-ref "${IMAGE_URI}" > pinned-digest.txt
        crane manifest "${IMAGE_URI}" > manifest.json
        crane config "${IMAGE_URI}" > config.json || echo "{}" > config.json

        echo "Successfully retrieved OCI manifests and immutable digest."
    outputFiles:
      - pinned-digest.txt
      - manifest.json
      - config.json

  - id: evaluate_platform_policy
    type: io.kestra.plugin.scripts.shell.Commands
    description: Parse OCI manifest and configuration to verify multi-architecture coverage, digest immutability, and layer size budget.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-alpine
    commands:
      - |
        python3 - << 'PYEOF'
        import json
        import os

        digest_file = "{{ outputs.crane_inspect.outputFiles['pinned-digest.txt'] }}"
        manifest_file = "{{ outputs.crane_inspect.outputFiles['manifest.json'] }}"
        config_file = "{{ outputs.crane_inspect.outputFiles['config.json'] }}"

        with open(digest_file, "r", encoding="utf-8") as f:
            pinned_ref = f.read().strip()

        with open(manifest_file, "r", encoding="utf-8") as f:
            manifest = json.load(f)

        with open(config_file, "r", encoding="utf-8") as f:
            config = json.load(f)

        # Determine architectures present
        platforms = []
        total_bytes = 0

        # Case A: OCI Image Index or Docker Manifest List (Multi-arch)
        if "manifests" in manifest:
            for m in manifest["manifests"]:
                plat = m.get("platform", {})
                os_name = plat.get("os", "linux")
                arch = plat.get("architecture", "")
                variant = plat.get("variant", "")
                p_str = f"{os_name}/{arch}" + (f"/{variant}" if variant else "")
                platforms.append(p_str)
                total_bytes += m.get("size", 0)

        # Case B: Single Architecture Image Manifest
        else:
            arch = config.get("architecture", "amd64")
            os_name = config.get("os", "linux")
            platforms.append(f"{os_name}/{arch}")
            for layer in manifest.get("layers", []):
                total_bytes += layer.get("size", 0)

        total_mb = round(total_bytes / (1024 * 1024), 2)
        required = [p.strip() for p in "{{ inputs.required_platforms }}".split(",") if p.strip()]
        max_size_mb = int("{{ inputs.max_image_size_mb }}")

        missing_required = [req for req in required if req not in platforms]

        # Policy classification
        if len(missing_required) == 0:
            if total_mb > max_size_mb:
                status = "WARNING_SINGLE_ARCH_DEGRADED"
                notes = f"All platforms present ({', '.join(platforms)}) but layer size ({total_mb}MB) exceeds budget ({max_size_mb}MB)."
            else:
                status = "APPROVED_FOR_DEPLOYMENT"
                notes = f"Compliant multi-arch image verified ({', '.join(platforms)}), size {total_mb}MB."
        elif "linux/amd64" in platforms:
            status = "WARNING_SINGLE_ARCH_DEGRADED"
            notes = f"Primary platform (linux/amd64) present, but missing: {', '.join(missing_required)}."
        else:
            status = "CRITICAL_REJECTED"
            notes = f"Critical rejection: Primary platform missing. Supported platforms: {', '.join(platforms) if platforms else 'none'}."

        output_payload = {
            "pinned_ref": pinned_ref,
            "platforms": ", ".join(platforms),
            "layer_size_mb": total_mb,
            "status": status,
            "policy_notes": notes
        }

        print(f"Policy Evaluation: Status={status}, Platforms={platforms}, Size={total_mb}MB, Notes={notes}")
        print(f'::{{"outputs": {json.dumps(output_payload)}}}::')
        PYEOF

  - id: route_deployment_approval
    type: io.kestra.plugin.core.flow.Switch
    description: Route image deployment approval based on platform coverage and size budget status.
    value: "{{ outputs.evaluate_platform_policy.vars.status }}"
    cases:
      APPROVED_FOR_DEPLOYMENT:
        - id: log_approved
          type: io.kestra.plugin.core.log.Log
          message: "Container image APPROVED for deployment. Pinned Reference: {{ outputs.evaluate_platform_policy.vars.pinned_ref }} | Platforms: {{ outputs.evaluate_platform_policy.vars.platforms }} | Size: {{ outputs.evaluate_platform_policy.vars.layer_size_mb }}MB."

      WARNING_SINGLE_ARCH_DEGRADED:
        - id: notify_platform_warning
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.warning_slack_channel }}",
              "text": "Multi-Arch Warning: Image {{ inputs.image_uri }} missing architectures or exceeded size budget. Supported: {{ outputs.evaluate_platform_policy.vars.platforms }}. Pinned: {{ outputs.evaluate_platform_policy.vars.pinned_ref }}"
            }

        - id: log_warning
          type: io.kestra.plugin.core.log.Log
          message: "Warning: Image approved with caveats: {{ outputs.evaluate_platform_policy.vars.policy_notes }}"

      CRITICAL_REJECTED:
        - id: notify_critical_rejection
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.critical_slack_channel }}",
              "text": "CRITICAL REJECTION: Container image {{ inputs.image_uri }} rejected by Crane gate policy. Reason: {{ outputs.evaluate_platform_policy.vars.policy_notes }}"
            }

        - id: fail_deployment
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "Container image failed Crane gate policy: {{ outputs.evaluate_platform_policy.vars.policy_notes }}"

triggers:
  - id: weekly_base_image_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"
    disabled: true

extend:
  title: Crane Container Image Immutable Digest Pinning & Multi-Architecture Platform Gate
  metaTitle: Crane Container Image Digest Pinning & Platform Gate | Kestra
  shortDescription: Enforce multi-architecture platform coverage, inspect OCI manifests, and pin immutable digests using Google Crane before deploying containers.
  metaDescription: Inspect container images with Crane to enforce multi-architecture platform coverage, calculate layer size budgets, and pin immutable digests before deployment.
  description: |
    Secure and standardize container deployment pipelines against tag drift, supply chain tampering, and architecture incompatibilities using [Google Container Tools Crane](https://github.com/google/go-containerregistry). In modern containerized infrastructure, deploying mutable tags (such as `:latest`, `:staging`, or `:v1.2`) introduces silent drift and security risks if an image tag is overwritten in the registry. Furthermore, in hybrid Kubernetes clusters operating mixed compute pools (e.g. `linux/amd64` x86 nodes and `linux/arm64` AWS Graviton nodes), deploying an image missing ARM64 architecture support triggers instant runtime crashes (`exec format error`) and service downtime.

    This blueprint inspects remote container images directly over the OCI Distribution API using Crane without downloading heavy layer blobs. It extracts the content-addressable SHA256 digest, parses OCI Image Index manifest lists, verifies required platform architectures (`linux/amd64`, `linux/arm64`), calculates layer size budgets, and routes the execution through an automated gate: approving and outputting immutable pinned references (`image@sha256:...`), alerting platform teams when images lack secondary architectures, and rejecting broken images before deployment.

    ## How it works

    1. **Trigger & Image Input**: Initiated on a scheduled cadence (default: every Monday at 04:00 UTC) to audit base images, or triggered via webhook / flow execution from upstream CI/CD build pipelines with a target container image URI.
    2. **Remote OCI Registry Inspection**: Runs Crane (`gcr.io/go-containerregistry/crane:v0.20.2`) inside Kestra's Docker task runner. It authenticates to private registries if configured, resolves the image tag to an immutable content digest (`crane digest --full-ref`), retrieves the raw OCI manifest (`crane manifest`), and fetches the container configuration (`crane config`).
    3. **Multi-Architecture & Size Policy Triage**: A Python task parses the manifest descriptors to verify whether the image is an OCI Image Index (multi-arch) or single-arch manifest. It checks that all required platforms specified in `required_platforms` are present, computes total compressed layer size in megabytes, and classifies status:
       - `APPROVED_FOR_DEPLOYMENT`: All required platforms present and layer size within budget.
       - `WARNING_SINGLE_ARCH_DEGRADED`: Primary architecture (amd64) present, but missing secondary targets or exceeding size budget.
       - `CRITICAL_REJECTED`: Missing primary architecture, unparseable manifest, or unverified digest.
    4. **Flow Control & Notification**: A `Switch` task evaluates the classified status:
       - `APPROVED_FOR_DEPLOYMENT`: Logs verified audit evidence and exports `pinned_ref` for downstream deployment steps.
       - `WARNING_SINGLE_ARCH_DEGRADED`: Sends an alert to Slack `#devops-alerts` detailing missing architectures and rightsizing opportunities.
       - `CRITICAL_REJECTED`: Sends an urgent Slack alert to `#platform-oncall` and triggers `Fail` to block promotional deployment pipelines.

    ## What you get

    - **Immutable Content Pinning**: Automatically transforms mutable image tags into cryptographically verifiable `image@sha256:...` references to prevent tag mutation drift.
    - **Multi-Architecture Enforcement**: Guarantees container images support both AMD64 and ARM64 before deployment onto heterogeneous Kubernetes node pools.
    - **Sub-Second Remote Inspection**: Inspects image metadata over the network in milliseconds without pulling gigabytes of container layers onto the host worker.
    - **Layer Size Budget Tracking**: Monitors container image bloat and download size to protect edge nodes and autoscale spin-up latency.
    - **Automated Pipeline Protection**: Halts broken or architecture-incompatible images in CI/CD before they reach staging or production environments.

    ## Who it's for

    - **DevOps & Platform Engineers**: Standardizing container image promotion gates across multi-tenant registries and Kubernetes clusters.
    - **Site Reliability Engineers (SREs)**: Preventing scheduling outages caused by `exec format error` on multi-architecture worker nodes.
    - **Security Engineers**: Enforcing immutable digest pinning and eliminating supply chain risks associated with mutable image tags.

    ## Why orchestrate this with Kestra

    - **Zero-Storage Overhead**: Leverage Crane to query remote registries without requiring Docker daemons or local disk caching for multi-gigabyte container layers.
    - **Declarative Policy Governance**: Manage deployment gating policies, platform checklists, and size thresholds centrally in version-controlled YAML.
    - **Secure Credential Injection**: Inject registry tokens securely via Kestra secrets (`{{ secret('REGISTRY_TOKEN') }}`) with automatic log masking.
    - **Downstream CI/CD Integration**: Seamlessly pass the verified pinned digest output (`{{ outputs.evaluate_platform_policy.vars.pinned_ref }}`) into downstream Kubernetes, Helm, or Terraform deploy tasks.

    ## Prerequisites

    - Network access to the target container registry (e.g., Docker Hub, GitHub Packages, Google Artifact Registry, AWS ECR).
    - An incoming Slack webhook URL for notification channels.

    ### Secrets

    - `REGISTRY_TOKEN`: Personal access token, API key, or password for private container registry authentication (optional for public images).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL to deliver architecture warnings and critical rejection notifications (required).

    ## Quick start

    1. Configure your Slack webhook URL in namespace secrets as `SLACK_WEBHOOK_URL`.
    2. If scanning private images, store registry credentials in namespace secrets as `REGISTRY_TOKEN`.
    3. Import this blueprint into your Kestra instance.
    4. Click **Execute** and enter a container image URI (e.g. `cgr.dev/chainguard/static:latest`).
    5. Review the execution log to inspect the resolved immutable digest and verified platforms, then enable the scheduled trigger.

    ## How to extend

    - **Automated Helm / Kube Manifest Update**: Pipe `pinned_ref` into a Git task to automatically update image tags in Helm values or Kustomize manifests.
    - **Cosign Attestation Verification**: Chain a Sigstore Cosign verification task immediately following Crane inspection to verify software supply chain signatures.
    - **Multi-Image Matrix**: Use a `ForEach` loop to scan an entire microservice fleet or nightly base image roster in parallel.

    ## Links

    - [Google Crane GitHub Repository](https://github.com/google/go-containerregistry/blob/main/cmd/crane/README.md)
    - [OCI Image Specification](https://github.com/opencontainers/image-spec)
    - [Kestra Shell Plugin Documentation](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false
