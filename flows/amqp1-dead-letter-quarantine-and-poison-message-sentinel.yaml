id: amqp1-dead-letter-quarantine-and-poison-message-sentinel
namespace: company.infrastructure

inputs:
  - id: amqp_host
    type: STRING
    defaults: localhost
    description: Hostname or IP address of the AMQP 1.0 broker (e.g. ActiveMQ Artemis, RabbitMQ 4, or Azure Service Bus).

  - id: amqp_port
    type: INT
    defaults: 5672
    description: Listening TCP port for AMQP 1.0 connections.

  - id: dlq_address
    type: STRING
    defaults: "orders.dlq"
    description: Target AMQP 1.0 address or queue holding dead-letter and poison messages.

  - id: canary_address
    type: STRING
    defaults: "sentinel.canary"
    description: Target AMQP 1.0 address used to verify broker write availability and link establishment.

  - id: sample_limit
    type: INT
    defaults: 25
    description: Maximum number of dead-letter records to ingest into Kestra internal storage per audit cycle.

  - id: dlq_critical_threshold
    type: INT
    defaults: 10
    description: Number of accumulated dead-letter messages that triggers a critical incident alert.

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"
    disabled: true
    inputs:
      amqp_host: localhost
      amqp_port: 5672
      dlq_address: "orders.dlq"
      canary_address: "sentinel.canary"
      sample_limit: 25
      dlq_critical_threshold: 10

tasks:
  - id: probe_canary_delivery
    type: io.kestra.plugin.amqp.Amqp1Publish
    host: "{{ inputs.amqp_host }}"
    port: "{{ inputs.amqp_port }}"
    username: "{{ secret('AMQP_USERNAME') }}"
    password: "{{ secret('AMQP_PASSWORD') }}"
    address: "{{ inputs.canary_address }}"
    serdeType: JSON
    from:
      - data:
          canary: true
          executionId: "{{ execution.id }}"
          timestamp: "{{ now() }}"
        applicationProperties:
          origin: "kestra-sentinel"
          probeType: "synthetic-heartbeat"
    allowFailure: true
    description: Publishes a synthetic heartbeat message to verify AMQP 1.0 broker connectivity, link opening, and message acceptance.

  - id: probe_dlq_backlog
    type: io.kestra.plugin.amqp.Amqp1Consume
    host: "{{ inputs.amqp_host }}"
    port: "{{ inputs.amqp_port }}"
    username: "{{ secret('AMQP_USERNAME') }}"
    password: "{{ secret('AMQP_PASSWORD') }}"
    address: "{{ inputs.dlq_address }}"
    serdeType: STRING
    maxRecords: "{{ inputs.sample_limit }}"
    maxDuration: PT10S
    pollDuration: PT3S
    autoAck: false
    allowFailure: true
    description: Consumes up to sample_limit dead-letter messages from the DLQ address into Kestra internal storage for inspection.

  - id: classify_broker_posture
    type: io.kestra.plugin.core.debug.Return
    format: >-
      {{
        (outputs.probe_canary_delivery is not defined or outputs.probe_dlq_backlog is not defined) ? 'BROKER_UNREACHABLE' :
        (outputs.probe_canary_delivery.messagesCount == 0) ? 'CANARY_DELIVERY_FAILED' :
        (outputs.probe_dlq_backlog.count >= inputs.dlq_critical_threshold) ? 'DLQ_BACKLOG_BREACH' :
        (outputs.probe_dlq_backlog.count > 0) ? 'DLQ_WARNING' :
        'HEALTHY'
      }}
    description: Evaluates canary publish confirmation and DLQ backlog count to determine overall operational posture.

  - id: route_posture_action
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.classify_broker_posture.value }}"
    cases:
      DLQ_BACKLOG_BREACH:
        - id: alert_dlq_critical_breach
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ {'text': '🚨 *CRITICAL: AMQP 1.0 DLQ Backlog Breach*\n• *Host:* `' ~ inputs.amqp_host ~ ':' ~ inputs.amqp_port ~ '`\n• *DLQ Address:* `' ~ inputs.dlq_address ~ '`\n• *Sampled Messages:* ' ~ outputs.probe_dlq_backlog.count ~ ' (Threshold: ' ~ inputs.dlq_critical_threshold ~ ')\n• *Storage URI:* `' ~ (outputs.probe_dlq_backlog.uri ?? 'None') ~ '`\n• *Execution ID:* `' ~ execution.id ~ '`\n*Action Required:* Investigate poisoned payloads and downstream consumer exceptions.'} | toJson }}"

      CANARY_DELIVERY_FAILED:
        - id: alert_canary_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ {'text': '⚠️ *WARNING: AMQP 1.0 Canary Delivery Failed*\n• *Host:* `' ~ inputs.amqp_host ~ ':' ~ inputs.amqp_port ~ '`\n• *Canary Address:* `' ~ inputs.canary_address ~ '`\n• *Status:* Broker rejected or failed to acknowledge synthetic message.\n• *Execution ID:* `' ~ execution.id ~ '`'} | toJson }}"

      BROKER_UNREACHABLE:
        - id: alert_broker_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ {'text': '🔥 *ALERT: AMQP 1.0 Broker Unreachable*\n• *Host:* `' ~ inputs.amqp_host ~ ':' ~ inputs.amqp_port ~ '`\n• *Error:* Failed to establish TCP connection or authenticate against AMQP 1.0 broker.\n• *Execution ID:* `' ~ execution.id ~ '`'} | toJson }}"

      DLQ_WARNING:
        - id: log_dlq_warning
          type: io.kestra.plugin.core.log.Log
          message: "AMQP 1.0 DLQ address {{ inputs.dlq_address }} holds {{ outputs.probe_dlq_backlog.count }} dead-letter records. Below critical threshold ({{ inputs.dlq_critical_threshold }})."

      HEALTHY:
        - id: log_broker_healthy
          type: io.kestra.plugin.core.log.Log
          message: "AMQP 1.0 broker {{ inputs.amqp_host }}:{{ inputs.amqp_port }} is healthy. Canary delivery confirmed and DLQ address {{ inputs.dlq_address }} is empty."
    description: Routes operational alerts or audit logs based on the classified posture.

  - id: audit_sentinel_run
    type: io.kestra.plugin.core.log.Log
    message: "AMQP 1.0 sentinel execution {{ execution.id }} complete. Verdict: {{ outputs.classify_broker_posture.value }}, DLQ count: {{ outputs.probe_dlq_backlog.count ?? 0 }}, Canary published: {{ outputs.probe_canary_delivery.messagesCount ?? 0 }}."
    description: Records an immutable audit log entry capturing cycle metrics and the final operational verdict.

errors:
  - id: alert_execution_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: "{{ {'text': '❌ *AMQP 1.0 Sentinel Execution Error*\nFlow failed during execution `' ~ execution.id ~ '` against broker `' ~ inputs.amqp_host ~ ':' ~ inputs.amqp_port ~ '`. Check Kestra run logs for stack trace.'} | toJson }}"

extend:
  title: AMQP 1.0 Dead-Letter Queue and Canary Delivery Sentinel
  metaTitle: AMQP 1.0 Dead-Letter Queue & Canary Delivery Sentinel | Kestra
  shortDescription: Monitor AMQP 1.0 brokers (ActiveMQ Artemis, RabbitMQ 4, Azure Service Bus) for poison message dead-letter backlogs and delivery health.
  metaDescription: Audit AMQP 1.0 broker dead-letter queues, verify synthetic canary delivery, classify health status, and alert Slack on poison message backlog breaches.
  description: |
    Enterprise messaging backbones running ISO-standard AMQP 1.0 brokers, such as Apache ActiveMQ Artemis, RabbitMQ 4.x, Azure Service Bus, or Apache Qpid, frequently encounter poison messages caused by unexpected serialization shifts, downstream consumer bugs, or schema drift. When unhandled, failing messages route into dead-letter queues (DLQs) where they silently accumulate, consuming broker storage, exhausting memory quotas, and masking recurring application outages.

    This blueprint provides an automated Day 2 operations sentinel for AMQP 1.0 brokers. On a scheduled interval, it delivers a synthetic canary message to verify broker link creation and acceptance, samples accumulated dead-letter messages without message destruction, classifies cluster health across five operational tiers, and dispatches real-time Slack alerts before buffer limits cause broker degradation.

    ## How it works

    1. The `periodic_schedule` trigger invokes the flow on a 4-hour cadence with explicit parameter bindings, shipped in a disabled state for initial validation.
    2. `probe_canary_delivery` (`io.kestra.plugin.amqp.Amqp1Publish`) publishes a synthetic JSON heartbeat payload carrying the execution ID and timestamp to `canary_address`, validating that the broker opens links and returns delivery acceptance.
    3. `probe_dlq_backlog` (`io.kestra.plugin.amqp.Amqp1Consume`) drains up to `sample_limit` dead-letter records from `dlq_address` within bounded `maxDuration` and `pollDuration` windows, writing the raw payload stream to Kestra internal storage.
    4. `classify_broker_posture` (`io.kestra.plugin.core.debug.Return`) evaluates canary delivery counts and consumed DLQ message volume using Pebble logic to produce an unambiguous status token: `BROKER_UNREACHABLE`, `CANARY_DELIVERY_FAILED`, `DLQ_BACKLOG_BREACH`, `DLQ_WARNING`, or `HEALTHY`.
    5. `route_posture_action` (`io.kestra.plugin.core.flow.Switch`) routes downstream actions: critical backlog breaches and delivery failures dispatch actionable alerts to Slack, minor warnings log diagnostic advice, and clean runs confirm stability.
    6. `audit_sentinel_run` (`io.kestra.plugin.core.log.Log`) writes an immutable summary entry to the execution logs recording the verdict, DLQ count, and published canary metrics.
    7. A flow-level `errors` handler catches unhandled transport failures or authentication timeouts, dispatching an incident notice to Slack.

    ## What you get

    - Automated, continuous validation of AMQP 1.0 broker write and read link protocols.
    - Early warning of poison message accumulation before dead-letter queues exhaust disk or memory quotas.
    - Durable internal storage capture of dead-letter message batches for offline forensic analysis.
    - Real-time Slack notifications pinpointing broker endpoints, message counts, and storage locations.
    - Clean execution history tracking operational SLA trends across messaging backbones.

    ## Who it's for

    - Platform Engineers and SREs maintaining self-hosted ActiveMQ Artemis, Red Hat AMQ, or RabbitMQ 4 clusters.
    - Cloud Infrastructure Teams managing Azure Service Bus namespaces and enterprise event brokers.
    - Integration Engineers and Data Engineers relying on AMQP 1.0 messaging for transactional data transport.

    ## Why orchestrate this with Kestra

    Scripting broker health checks with custom Python or Bash daemons introduces unmanaged cron jobs, unmasked credential exposure, and fragmented logging. Kestra provides native AMQP 1.0 tasks built directly on Apache Qpid Proton-J2, enterprise secret governance, declarative scheduling, execution auditability, and turnkey Slack alerting without requiring sidecar monitoring daemons or custom consumer agents.

    ## Prerequisites

    - An AMQP 1.0 compliant broker reachable from the Kestra worker environment (e.g. Apache ActiveMQ Artemis, RabbitMQ 4, or Azure Service Bus).
    - An existing dead-letter address (e.g. `orders.dlq`) and a designated canary test address (e.g. `sentinel.canary`).
    - A Slack Incoming Webhook URL for alert routing.

    ### Secrets

    - `AMQP_USERNAME`: Authentication username for the AMQP 1.0 broker connection.
    - `AMQP_PASSWORD`: Authentication password or SAS token for the AMQP 1.0 broker connection.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the destination Slack channel.

    ## Quick start

    1. Configure `AMQP_USERNAME`, `AMQP_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local open-source Apache ActiveMQ Artemis container for testing:
       ```bash
       docker run -d --name artemis-sentinel \
         -p 5672:5672 -p 8161:8161 \
         -e ARTEMIS_USER=artemis \
         -e ARTEMIS_PASSWORD=artemis \
         apache/activemq-artemis:latest
       ```
    3. Connect the Artemis container to your Kestra Docker network:
       ```bash
       docker network connect YOUR_KESTRA_NETWORK artemis-sentinel
       ```
    4. Execute a manual test run in the Kestra UI to verify link establishment and check that `HEALTHY` is classified.
    5. Enable the `periodic_schedule` trigger to activate autonomous 4-hour background surveillance.

    ## How to extend

    - Add automated dead-letter message redelivery using an approval-gated `io.kestra.plugin.amqp.Amqp1Publish` task to replay quarantined messages back to the primary intake queue once downstream defects are resolved.
    - Incorporate schema validation with `io.kestra.plugin.serdes.avro` or JSON Schema validation to automatically quarantine messages failing contract compatibility.
    - Route critical alerts to PagerDuty or Opsgenie via `io.kestra.plugin.pagerduty` for tier-1 on-call paging during sustained broker degradations.

    ## Links

    - [Kestra AMQP Plugin Documentation](https://kestra.io/plugins/plugin-amqp)
    - [Apache ActiveMQ Artemis Documentation](https://activemq.apache.org/components/artemis/documentation/)
    - [AMQP 1.0 Protocol Specification (OASIS)](https://www.amqp.org/resources/specifications)
