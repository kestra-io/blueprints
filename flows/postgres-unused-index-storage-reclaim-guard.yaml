id: postgres-unused-index-storage-reclaim-guard
namespace: company.data

description: |
  Audit PostgreSQL unused indexes and storage bloat using pg_stat_user_indexes.
  Validates statistics maturity, detects un-scanned non-constraint indexes,
  exports a downloadable CSV diagnostic report, records telemetry in KV store,
  and dispatches automated Slack storage alerts to DBAs.

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: min_index_size_mb
    type: FLOAT
    displayName: Minimum Index Size Threshold (MB)
    description: Minimum physical index size in megabytes to qualify for reclamation audit. Ignores negligible small indexes.
    defaults: 50.0
    min: 1.0
    max: 100000.0

  - id: min_stats_age_days
    type: INT
    displayName: Minimum Statistics Maturity (Days)
    description: Minimum number of days since pg_stat_database stats_reset. Prevents premature index flagging on newly restarted clusters.
    defaults: 14
    min: 1
    max: 365

  - id: max_indexes_reported
    type: INT
    displayName: Maximum Candidate Indexes to Report
    description: Maximum number of bloated unused index candidates to extract into the diagnostic report.
    defaults: 25
    min: 1
    max: 100

  - id: database_name
    type: STRING
    displayName: PostgreSQL Database Name
    description: Target database name to scope the unused index storage audit.
    defaults: postgres
    validator: ^[A-Za-z_][A-Za-z0-9_]{0,63}$

tasks:
  - id: verify_stats_maturity
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Confirm database statistics have accumulated long enough to avoid false positives.
    url: "{{ secret('POSTGRES_JDBC_URL') }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    sql: |
      SELECT
        datname,
        stats_reset,
        ROUND(EXTRACT(EPOCH FROM (NOW() - COALESCE(stats_reset, NOW() - INTERVAL '30 days'))) / 86400.0, 1) AS stats_age_days,
        CASE
          WHEN (NOW() - COALESCE(stats_reset, NOW() - INTERVAL '30 days')) >= INTERVAL '{{ inputs.min_stats_age_days }} days' THEN true
          ELSE false
        END AS is_stats_mature
      FROM pg_stat_database
      WHERE datname = '{{ inputs.database_name }}';

  - id: evaluate_unused_indexes
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Aggregate total unused index count and cumulative wasted storage in megabytes.
    url: "{{ secret('POSTGRES_JDBC_URL') }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    sql: |
      WITH candidates AS (
        SELECT
          s.schemaname,
          s.relname AS table_name,
          s.indexrelname AS index_name,
          pg_relation_size(s.indexrelid) AS index_bytes
        FROM pg_stat_user_indexes s
        JOIN pg_index i ON i.indexrelid = s.indexrelid
        JOIN pg_class c ON c.oid = s.indexrelid
        JOIN pg_namespace n ON n.oid = c.relnamespace
        WHERE s.idx_scan = 0
          AND NOT i.indisunique
          AND NOT i.indisprimary
          AND n.nspname NOT IN ('pg_catalog', 'information_schema')
          AND pg_relation_size(s.indexrelid) >= ({{ inputs.min_index_size_mb }} * 1024 * 1024)
      )
      SELECT
        COUNT(*) AS unused_index_count,
        COALESCE(ROUND((SUM(index_bytes)::numeric / (1024 * 1024)::numeric), 2), 0.0) AS total_wasted_mb,
        COALESCE(ROUND((SUM(index_bytes)::numeric / (1024 * 1024 * 1024)::numeric), 3), 0.0) AS total_wasted_gb,
        CASE WHEN COUNT(*) > 0 THEN true ELSE false END AS has_unused_indexes
      FROM candidates;

  - id: fetch_unused_indexes_telemetry
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Stream detailed unused index definitions and candidate drop statements to internal storage.
    url: "{{ secret('POSTGRES_JDBC_URL') }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    timeZoneId: UTC
    fetchType: STORE
    sql: |
      SELECT
        s.schemaname,
        s.relname AS table_name,
        s.indexrelname AS index_name,
        ROUND((pg_relation_size(s.indexrelid)::numeric / (1024 * 1024)::numeric), 2) AS index_size_mb,
        ROUND((pg_table_size(s.relid)::numeric / (1024 * 1024)::numeric), 2) AS table_size_mb,
        s.idx_scan AS total_scans,
        pg_get_indexdef(s.indexrelid) AS index_definition,
        format('DROP INDEX CONCURRENTLY IF EXISTS %I.%I;', s.schemaname, s.indexrelname) AS safe_remediation_sql
      FROM pg_stat_user_indexes s
      JOIN pg_index i ON i.indexrelid = s.indexrelid
      JOIN pg_class c ON c.oid = s.indexrelid
      JOIN pg_namespace n ON n.oid = c.relnamespace
      WHERE s.idx_scan = 0
        AND NOT i.indisunique
        AND NOT i.indisprimary
        AND n.nspname NOT IN ('pg_catalog', 'information_schema')
        AND pg_relation_size(s.indexrelid) >= ({{ inputs.min_index_size_mb }} * 1024 * 1024)
      ORDER BY pg_relation_size(s.indexrelid) DESC
      LIMIT {{ inputs.max_indexes_reported }};

  - id: export_diagnostic_csv
    type: io.kestra.plugin.serdes.csv.IonToCsv
    description: Serialize unused index diagnostic telemetry into a downloadable CSV artifact.
    from: "{{ outputs.fetch_unused_indexes_telemetry.uri }}"

  - id: check_health_and_alert
    type: io.kestra.plugin.core.condition.If
    description: Evaluate unused index findings and dispatch notification when wasted storage is detected.
    condition: "{{ outputs.evaluate_unused_indexes.row.has_unused_indexes && outputs.verify_stats_maturity.row.is_stats_mature }}"
    then:
      - id: log_reclamation_opportunity
        type: io.kestra.plugin.core.log.Log
        message: >-
          PostgreSQL Storage Opportunity on database '{{ inputs.database_name }}':
          Found {{ outputs.evaluate_unused_indexes.row.unused_index_count }} unused indexes
          consuming {{ outputs.evaluate_unused_indexes.row.total_wasted_mb }} MB ({{ outputs.evaluate_unused_indexes.row.total_wasted_gb }} GB) of un-scanned storage.
          Stats maturity: {{ outputs.verify_stats_maturity.row.stats_age_days }} days.
          Diagnostic CSV Report URI: {{ outputs.export_diagnostic_csv.uri }}

      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Send storage reclamation advisory to Slack with diagnostic report artifact.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: >-
          [STORAGE ADVISORY] *PostgreSQL Unused Index Reclamation Opportunity*
          *Database:* `{{ inputs.database_name }}`
          *Unused Indexes Detected:* `{{ outputs.evaluate_unused_indexes.row.unused_index_count }}`
          *Wasted Storage:* `{{ outputs.evaluate_unused_indexes.row.total_wasted_mb }} MB` (`{{ outputs.evaluate_unused_indexes.row.total_wasted_gb }} GB`)
          *Statistics Maturity:* `{{ outputs.verify_stats_maturity.row.stats_age_days }} days` (Threshold: >= `{{ inputs.min_stats_age_days }} days`)
          *Diagnostic CSV Report:* `{{ outputs.export_diagnostic_csv.uri }}`
          *Execution ID:* `{{ execution.id }}`
    else:
      - id: log_healthy_state
        type: io.kestra.plugin.core.log.Log
        message: >-
          PostgreSQL database '{{ inputs.database_name }}' is healthy.
          No bloated unused indexes found exceeding {{ inputs.min_index_size_mb }}MB with stats age {{ outputs.verify_stats_maturity.row.stats_age_days }} days.

  - id: update_audit_watermark
    type: io.kestra.plugin.core.kv.Set
    description: Record telemetry snapshot in Kestra KV store for historical capacity tracking.
    key: "postgres_unused_index_audit_{{ inputs.database_name }}"
    value:
      last_audit_timestamp: "{{ now() }}"
      unused_index_count: "{{ outputs.evaluate_unused_indexes.row.unused_index_count }}"
      total_wasted_mb: "{{ outputs.evaluate_unused_indexes.row.total_wasted_mb }}"
      stats_age_days: "{{ outputs.verify_stats_maturity.row.stats_age_days }}"
      diagnostic_csv_uri: "{{ outputs.export_diagnostic_csv.uri }}"

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Notify on task failure if database connectivity or query execution fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: >-
      [ERROR] PostgreSQL Unused Index Audit failed in execution `{{ execution.id }}` on database `{{ inputs.database_name }}`.
      Failed task: `{{ (errorLogs() | length) > 0 ? errorLogs()[0].taskId : 'unknown' }}`.
      Error message: `{{ (errorLogs() | length) > 0 ? errorLogs()[0].message : 'inspect execution logs' }}`.

triggers:
  - id: weekly_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * 1"

extend:
  title: PostgreSQL Unused Index Bloat and Storage Reclamation Guard
  metaTitle: PostgreSQL Unused Index Bloat & Storage Reclamation Guard | Kestra
  shortDescription: Audit PostgreSQL unused indexes via pg_stat_user_indexes, export CSV diagnostic reports, and reclaim wasted disk storage.
  metaDescription: Audit PostgreSQL unused indexes using pg_stat_user_indexes, export CSV reports, and safely reclaim storage in Kestra.
  description: |
    Secondary indexes accelerate read queries but impose a hidden tax on database performance: every index must be updated on every INSERT, UPDATE, and DELETE, consuming buffer pool memory and NVMe disk space. Over months of application schema evolution, feature deprecations leave behind abandoned indexes that never receive scans. This flow audits PostgreSQL's `pg_stat_user_indexes` and `pg_stat_database` on a schedule, confirms statistics maturity, isolates un-scanned non-constraint indexes exceeding size thresholds, exports a downloadable CSV diagnostic report, persists historical metrics in Kestra's Key-Value store, and delivers actionable Slack storage advisories to database administrators.

    ## How it works

    1. The `Schedule` trigger initiates the workflow weekly, or operators can trigger runs manually via the UI.
    2. `verify_stats_maturity` queries `pg_stat_database` to ensure `stats_reset` was at least `min_stats_age_days` ago, preventing false positives on freshly created or reset databases.
    3. `evaluate_unused_indexes` aggregates the count and cumulative disk storage in megabytes consumed by indexes with `idx_scan = 0`, explicitly excluding primary keys and unique constraints.
    4. `fetch_unused_indexes_telemetry` streams detailed metadata (schema, table, index name, sizes, definitions, and safe concurrent drop statements) into internal storage (`STORE` fetch type).
    5. `export_diagnostic_csv` transforms the raw query telemetry into a downloadable CSV artifact using `IonToCsv`.
    6. `check_health_and_alert` (`If` condition) verifies whether bloated unused indexes exist and statistics are mature.
    7. If storage opportunities exist, `notify_slack_alert` posts an advisory with wasted gigabytes and the direct CSV download link.
    8. `update_audit_watermark` updates the `postgres_unused_index_audit_<database>` key in Kestra's KV store for trend analysis.
    9. The `errors` block intercepts connection or query failures and immediately alerts the on-call channel.

    ## What you get

    - Automated discovery of abandoned and zero-scan database indexes consuming expensive cloud storage.
    - Safe validation that preserves all primary keys, unique constraints, and system catalog objects.
    - False-positive prevention through configurable statistics maturity verification.
    - Automated export of candidate index definitions and generated `DROP INDEX CONCURRENTLY` commands into CSV.
    - Persistent state tracking via Kestra KV store without third-party monitoring infrastructure.
    - Automated incident alerts delivered directly to Slack with report links.

    ## Who it's for

    - Database Administrators (DBAs) managing high-write PostgreSQL clusters.
    - Site Reliability Engineers (SREs) optimizing cloud infrastructure costs and disk capacity.
    - Backend Engineers seeking proactive database performance optimization.

    ## Why orchestrate this with Kestra

    Monitoring index usage directly through declarative Kestra workflows eliminates the need for proprietary database monitoring agents. Kestra natively handles database retries, credential isolation via secrets, conditional branching, artifact generation, and key-value state persistence in a single audited YAML pipeline.

    ## Prerequisites

    - PostgreSQL 12 or newer.
    - Database user with `SELECT` permissions on `pg_stat_user_indexes`, `pg_stat_database`, `pg_index`, and `pg_class`.
    - Incoming Slack Webhook URL for alerting notifications.

    ### Secrets

    - `POSTGRES_JDBC_URL`: JDBC connection string (e.g., `jdbc:postgresql://postgres.company.internal:5432/postgres`).
    - `POSTGRES_USERNAME`: Database username with read permissions.
    - `POSTGRES_PASSWORD`: Database user password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint for alerting.

    ## Quick start

    1. Configure the `POSTGRES_JDBC_URL`, `POSTGRES_USERNAME`, `POSTGRES_PASSWORD`, and `SLACK_WEBHOOK_URL` secrets in your Kestra namespace.
    2. Import this blueprint into your Kestra workspace.
    3. Click **Execute** with default inputs to perform an initial audit.
    4. Verify the generated output logs, download the generated CSV report from the **Outputs** tab, and inspect the stored record in the **KV Store** tab.
    5. Enable the weekly schedule trigger for continuous monitoring.

    ## How to extend

    - Add an automated review-gated step to execute the generated `DROP INDEX CONCURRENTLY` statements during maintenance windows.
    - Archive weekly unused index CSV audit logs to Amazon S3 or Google Cloud Storage using `io.kestra.plugin.aws.s3.Upload`.
    - Connect to Jira or GitHub using Kestra plugins to automatically open tracking tickets for bloated indexes.

    ## Links

    - [PostgreSQL JDBC Plugin](https://kestra.io/plugins/plugin-jdbc-postgresql)
    - [Serdes Plugin](https://kestra.io/plugins/plugin-serdes)
    - [Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra Key-Value Store](https://kestra.io/docs/concepts/kv)
    - [PostgreSQL Index Monitoring Documentation](https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-STATS-VIEWS)
  tags:
    - Data
  subTags:
    - Day 2 Operations
    - Storage Optimization
    - Monitoring & Alerting
  ee: false
  demo: false
