id: pypi-download-trend-watch
namespace: company.team
description: |
  Every week, download the daily PyPI download history of a list of Python
  packages from pypistats.org (one request per package, run in a throttled
  loop), compare the last week with the week before and with the 4-week
  average in DuckDB, and flag packages whose downloads surged or dropped.

inputs:
  - id: packages
    type: STRING
    defaults: "duckdb,polars,kestra"
    displayName: "Packages (comma-separated)"
    description: "PyPI package names to track, for example your own libraries and the ones you depend on or compete with."
  - id: change_pct
    type: FLOAT
    defaults: 25.0
    displayName: "Alert Change (%)"
    description: "Flag a package when last week's downloads differ from the week before by at least this percentage (up or down)."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every Monday at 08:00 UTC, once pypistats.org has Sunday's numbers. Shipped disabled.
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: fetch_history
    type: io.kestra.plugin.core.flow.Loop
    description: Download each package's daily history one at a time; pypistats.org rate-limits bursts, so the loop runs sequentially and retries with back-off.
    values: "{{ inputs.packages | split(',') | toJson }}"
    concurrencyLimit: 1
    outputs:
      - id: package
        type: STRING
        value: "{{ item.value | trim }}"
      - id: file
        type: STRING
        value: "{{ outputs.download_overall.uri }}"
    tasks:
      - id: download_overall
        type: io.kestra.plugin.core.http.Download
        description: Daily downloads without mirrors for the last 180 days.
        uri: "https://pypistats.org/api/packages/{{ item.value | trim | lower }}/overall?mirrors=false"
        headers:
          User-Agent: "kestra-pypi-download-trend-watch"
        retry:
          type: exponential
          interval: PT15S
          maxInterval: PT2M
          maxAttempts: 5

  - id: compute_trends
    type: io.kestra.plugin.scripts.python.Script
    description: Load every package's daily rows into DuckDB, compute last 7 days, the 7 days before, the 4-week weekly average and the week-over-week change, flag changes beyond the threshold, and write the table to Parquet.
    containerImage: python:3.12-slim
    beforeCommands:
      - pip install --quiet --disable-pip-version-check duckdb==1.5.6
    inputFiles: >-
      {{ (outputs.fetch_history.outputs ?? []) | toJson | jq('[.[] | {key: ("pkg_" + .outputs.package + ".json"), value: .outputs.file}] | from_entries') | first | toJson }}
    outputFiles:
      - trends.parquet
    script: |
      import glob, json
      import duckdb

      threshold = {{ inputs.change_pct }}
      rows = []
      for path in glob.glob("pkg_*.json"):
          package = path[4:-5]
          for r in json.load(open(path, encoding="utf-8")).get("data", []):
              if r.get("category") == "without_mirrors":
                  rows.append((package, r["date"], r["downloads"]))
      con = duckdb.connect()
      con.execute("CREATE TABLE daily (package VARCHAR, day DATE, downloads BIGINT)")
      con.executemany("INSERT INTO daily VALUES (?, ?, ?)", rows)
      con.execute("""
          CREATE TABLE trends AS
          WITH last_day AS (SELECT package, max(day) AS d FROM daily GROUP BY package)
          SELECT d.package, l.d AS through,
                 sum(downloads) FILTER (WHERE day > l.d - 7) AS last_7d,
                 sum(downloads) FILTER (WHERE day <= l.d - 7 AND day > l.d - 14) AS prev_7d,
                 round(sum(downloads) FILTER (WHERE day <= l.d - 7 AND day > l.d - 35) / 4.0) AS avg_7d_4w
          FROM daily d JOIN last_day l USING (package)
          GROUP BY d.package, l.d
      """)
      con.execute("ALTER TABLE trends ADD COLUMN change_pct DOUBLE")
      con.execute("UPDATE trends SET change_pct = round(100.0 * (last_7d - prev_7d) / nullif(prev_7d, 0), 1)")
      con.execute("COPY (SELECT * FROM trends ORDER BY abs(change_pct) DESC) TO 'trends.parquet' (FORMAT PARQUET)")
      table = con.execute("SELECT package, through, last_7d, prev_7d, avg_7d_4w, change_pct FROM trends ORDER BY abs(change_pct) DESC").fetchall()
      lines, flagged = [], []
      for package, through, last7, prev7, avg4, change in table:
          line = f"{package}: {last7:,} last 7 days vs {prev7:,} the week before ({change:+.1f}%), 4-week weekly average {int(avg4 or 0):,} (data through {through})"
          lines.append(line)
          if change is not None and abs(change) >= threshold:
              flagged.append(("SURGE " if change > 0 else "DROP ") + line)
      print("::" + json.dumps({"outputs": {"packages": len(table), "flagged": len(flagged), "lines": lines, "flagged_lines": flagged}}) + "::")

  - id: report
    type: io.kestra.plugin.core.flow.If
    description: Log the flagged packages first when any change crosses the threshold, otherwise a quiet summary of every package.
    condition: "{{ outputs.compute_trends.vars.flagged > 0 }}"
    then:
      - id: log_flagged
        type: io.kestra.plugin.core.log.Log
        message: |
          PyPI trend watch: {{ outputs.compute_trends.vars.flagged }} of {{ outputs.compute_trends.vars.packages }} package(s) moved by at least {{ inputs.change_pct }}% week over week.
          {% for line in outputs.compute_trends.vars.flagged_lines %}- {{ line }}
          {% endfor %}
    else:
      - id: log_steady
        type: io.kestra.plugin.core.log.Log
        message: |
          PyPI trend watch: no package moved by {{ inputs.change_pct }}% or more.
          {% for line in outputs.compute_trends.vars.lines %}- {{ line }}
          {% endfor %}

outputs:
  - id: trends_parquet
    type: FILE
    value: "{{ outputs.compute_trends.outputFiles['trends.parquet'] }}"
  - id: flagged
    type: INT
    value: "{{ outputs.compute_trends.vars.flagged }}"

extend:
  title: "PyPI Download Trend Watch with pypistats and DuckDB"
  shortDescription: Download the daily PyPI download history of a list of packages every week, compare week over week and against a 4-week average in DuckDB, and flag surges and drops.
  metaTitle: PyPI Download Trend Watch (pypistats + DuckDB) | Kestra
  metaDescription: "Track weekly PyPI downloads for a list of packages with pypistats.org, compare week over week in DuckDB, and flag surges and drops."
  description: |
    Download counts are the closest thing open-source maintainers and developer-tool teams have to a usage metric: a release that breaks installs shows up as a drop, a launch or a mention shows up as a surge, and competitors' curves show where the ecosystem is moving. This blueprint pulls the daily download history of a list of packages from [pypistats.org](https://pypistats.org), compares the last seven days with the week before and with the four-week average in DuckDB, and flags every package whose downloads moved more than a threshold.

    ## How it works

    1. `weekly` (`io.kestra.plugin.core.trigger.Schedule`) runs every Monday at 08:00 UTC. It ships `disabled: true`.
    2. `fetch_history` (`io.kestra.plugin.core.flow.Loop`) iterates over `packages` one at a time (`concurrencyLimit: 1`, because pypistats.org rate-limits bursts) and runs `download_overall` (`io.kestra.plugin.core.http.Download`) on `/api/packages/<name>/overall?mirrors=false` with exponential retries. The loop's `outputs` expose each package with its file.
    3. `compute_trends` (`io.kestra.plugin.scripts.python.Script`) receives all files through `inputFiles` (built from the loop outputs with one jq query), loads the daily rows into DuckDB and computes, per package, the last 7 days, the 7 days before, the average week of the 4 weeks before, and the week-over-week change, then writes `trends.parquet` sorted by the size of the change.
    4. `report` (`io.kestra.plugin.core.flow.If`) logs the flagged packages (SURGE or DROP) when any change reaches `change_pct`, and a quiet summary otherwise. The Parquet file and the flagged count are flow outputs.

    ## What you get

    - A weekly table of downloads per package: last week, the week before, the 4-week average and the change.
    - Surges and drops flagged automatically, with a count output to branch on.
    - One Parquet file per run, ready to append to a warehouse table for long-term trends.
    - Polite, throttled API usage with retries.

    ## Who it's for

    - Open-source maintainers and developer-relations teams.
    - Product teams at developer-tool companies tracking adoption against competitors.
    - Platform teams watching the libraries their stack depends on.

    ## Why orchestrate this with Kestra

    Checking a few charts by hand is easy once; doing it every week for a list of packages, without hammering a rate-limited API, is not. Kestra runs the loop sequentially with retries, hands every file to DuckDB without glue code, keeps each week's Parquet file with its execution, and exposes the flagged count so another flow can notify a team or open a ticket only when something moved.

    ## Prerequisites

    - Outbound HTTPS access to `pypistats.org` (public, no key; please keep the request rate low).
    - A Kestra worker that can run containers (Docker or Kubernetes task runner) and reach PyPI.

    ### Secrets

    - None.

    ## Quick start

    1. Set `packages` to the packages you care about and `change_pct` to your alert level.
    2. Execute the flow and read the `report` logs.
    3. Download `trends_parquet` from the outputs.
    4. Enable `weekly`.

    ## How to extend

    - Notify Slack or email in the `then` branch when a package drops sharply after a release.
    - Append each run's Parquet to a warehouse table and chart the history.
    - Use pypistats' `python_minor` and `system` endpoints to see which Python versions and platforms drive the change.
    - Correlate drops with release dates from the PyPI JSON API.

    ## Links

    - [pypistats.org API](https://pypistats.org/api/)
    - [DuckDB Python API](https://duckdb.org/docs/api/python/overview)
    - [Kestra Loop task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.loop)
    - [Kestra HTTP Download task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.download)
    - [Kestra If task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.if)
  tags:
    - Data
  subTags:
    - ELT & Data Landing
    - Monitoring & Alerting
  ee: false
  demo: false
