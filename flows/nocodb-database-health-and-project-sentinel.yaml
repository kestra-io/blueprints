id: nocodb-database-health-and-project-sentinel
namespace: company.team

description: |
  Continuously monitors NocoDB no-code database and smart spreadsheet platforms by probing core application health endpoints, validating backend SQL database connection pool responsiveness (PostgreSQL/MySQL/SQLite), auditing base project metadata accessibility, classifying operational posture, routing real-time Slack incident alerts, and logging compliance audit records.

inputs:
  - id: nocodb_host
    type: STRING
    displayName: NocoDB Host
    description: Hostname or IP address of the NocoDB instance reachable by the Kestra worker.
    defaults: "localhost"

  - id: nocodb_port
    type: INT
    displayName: NocoDB Port
    description: HTTP port of the NocoDB service (defaults to 8080).
    defaults: 8080

  - id: nocodb_scheme
    type: STRING
    displayName: Protocol Scheme
    description: URI protocol scheme (http or https).
    defaults: "http"

  - id: expected_status
    type: STRING
    displayName: Expected Health Status
    description: Expected string value of the status attribute in NocoDB /api/v1/health response JSON (defaults to OK).
    defaults: "OK"

tasks:
  - id: probe_health_endpoint
    type: io.kestra.plugin.core.http.Request
    description: Queries NocoDB /api/v1/health to audit server liveness and verify that primary metadata database connection pools are operational.
    uri: "{{ inputs.nocodb_scheme }}://{{ inputs.nocodb_host }}:{{ inputs.nocodb_port }}/api/v1/health"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: probe_version_endpoint
    type: io.kestra.plugin.core.http.Request
    description: Queries NocoDB /api/v1/version to verify web server responsiveness and deployment release consistency.
    uri: "{{ inputs.nocodb_scheme }}://{{ inputs.nocodb_host }}:{{ inputs.nocodb_port }}/api/v1/version"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: probe_project_metadata
    type: io.kestra.plugin.core.http.Request
    description: Queries NocoDB /api/v1/db/meta/projects to verify that base project schemas and connected SQL data sources can be queried via API token.
    uri: "{{ inputs.nocodb_scheme }}://{{ inputs.nocodb_host }}:{{ inputs.nocodb_port }}/api/v1/db/meta/projects?limit=10"
    method: GET
    headers:
      Accept: "application/json"
      xc-token: "{{ secret('NOCODB_API_TOKEN') }}"
    options:
      allowFailed: true
    allowFailure: true

  - id: classify_nocodb_posture
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates HTTP status codes across health, version, and project metadata probes to classify NocoDB operational posture.
    format: |
      {{ outputs.probe_health_endpoint.code is not defined or outputs.probe_version_endpoint.code is not defined ? 'INSTANCE_UNREACHABLE' : (outputs.probe_health_endpoint.code != 200 or not (((outputs.probe_health_endpoint.body | json | jq('.status') | first) ?? '') == inputs.expected_status) ? 'DATABASE_STORAGE_DEGRADED' : (outputs.probe_version_endpoint.code != 200 ? 'SERVER_PROCESS_UNHEALTHY' : (outputs.probe_project_metadata.code != 200 ? 'PROJECT_METADATA_UNREADY' : 'HEALTHY_COMPLIANT'))) }}

  - id: route_by_posture
    type: io.kestra.plugin.core.flow.Switch
    description: Routes alerts and logs based on the classified NocoDB operational posture.
    value: "{{ outputs.classify_nocodb_posture.value }}"
    cases:
      "HEALTHY_COMPLIANT":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "NocoDB instance at {{ inputs.nocodb_scheme }}://{{ inputs.nocodb_host }}:{{ inputs.nocodb_port }} is HEALTHY_COMPLIANT. /api/v1/health status: {{ outputs.probe_health_endpoint.code }} ({{ outputs.probe_health_endpoint.body | json | jq('.status') | first }}). Version: {{ outputs.probe_version_endpoint.body | json | jq('.version') | first ?? 'N/A' }}. Project metadata: HTTP {{ outputs.probe_project_metadata.code }}."

      "DATABASE_STORAGE_DEGRADED":
        - id: alert_database_degraded_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "NocoDB Sentinel CRITICAL ALERT: Database backend degraded on " ~ inputs.nocodb_host ~ ":" ~ inputs.nocodb_port ~ "! /api/v1/health returned HTTP " ~ (outputs.probe_health_endpoint.code ?? 'NONE') ~ " (payload: " ~ (outputs.probe_health_endpoint.body ?? 'EMPTY') ~ "). PostgreSQL, MySQL, or SQLite connection pool failed. User spreadsheet updates and API mutations blocked! Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_database_degraded
          type: io.kestra.plugin.core.log.Log
          message: "CRITICAL: NocoDB /api/v1/health returned non-200 or unready status: {{ outputs.probe_health_endpoint.code }}."

      "PROJECT_METADATA_UNREADY":
        - id: alert_project_metadata_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "NocoDB Sentinel WARNING: Project metadata API unready on " ~ inputs.nocodb_host ~ ":" ~ inputs.nocodb_port ~ "! /api/v1/db/meta/projects returned HTTP " ~ (outputs.probe_project_metadata.code ?? 'NONE') ~ ". Check NOCODB_API_TOKEN permissions or schema cache sync. Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_project_metadata
          type: io.kestra.plugin.core.log.Log
          message: "WARNING: NocoDB /api/v1/db/meta/projects returned non-200 code: {{ outputs.probe_project_metadata.code }}."

      "SERVER_PROCESS_UNHEALTHY":
        - id: alert_server_unhealthy_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "NocoDB Sentinel WARNING: Server process unhealthy on " ~ inputs.nocodb_host ~ ":" ~ inputs.nocodb_port ~ "! /api/v1/version returned HTTP " ~ (outputs.probe_version_endpoint.code ?? 'NONE') ~ ". Node.js application process is failing requests. Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_server_unhealthy
          type: io.kestra.plugin.core.log.Log
          message: "WARNING: NocoDB /api/v1/version returned non-200 code: {{ outputs.probe_version_endpoint.code }}."

      "INSTANCE_UNREACHABLE":
        - id: alert_unreachable_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "NocoDB Sentinel OUTAGE: Cannot reach NocoDB instance at " ~ inputs.nocodb_scheme ~ "://" ~ inputs.nocodb_host ~ ":" ~ inputs.nocodb_port ~ ". Container offline, network partitioned, or reverse-proxy connection refused. Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_unreachable
          type: io.kestra.plugin.core.log.Log
          message: "OUTAGE: NocoDB instance unreachable at {{ inputs.nocodb_scheme }}://{{ inputs.nocodb_host }}:{{ inputs.nocodb_port }}."

  - id: audit_summary
    type: io.kestra.plugin.core.output.OutputValues
    description: Exports structured telemetry attributes and endpoint verification metrics for compliance audit reporting.
    values:
      target_instance: "{{ inputs.nocodb_scheme }}://{{ inputs.nocodb_host }}:{{ inputs.nocodb_port }}"
      health_http_code: "{{ outputs.probe_health_endpoint.code ?? 0 }}"
      health_payload_status: "{{ outputs.probe_health_endpoint.body | json | jq('.status') | first ?? 'NONE' }}"
      version_http_code: "{{ outputs.probe_version_endpoint.code ?? 0 }}"
      server_version: "{{ outputs.probe_version_endpoint.body | json | jq('.version') | first ?? 'N/A' }}"
      project_meta_code: "{{ outputs.probe_project_metadata.code ?? 0 }}"
      operational_posture: "{{ outputs.classify_nocodb_posture.value }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on unexpected workflow runtime execution failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {"text": "NocoDB Sentinel workflow failed unexpectedly during execution " ~ execution.id ~ " in namespace " ~ flow.namespace ~ "."} | toJson }}

triggers:
  - id: hourly_canary
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated NocoDB health and database connectivity audit at the top of every hour. Shipped disabled.
    cron: "0 * * * *"
    disabled: true
    inputs:
      nocodb_host: "localhost"
      nocodb_port: 8080
      nocodb_scheme: "http"
      expected_status: "OK"

extend:
  title: NocoDB Database Platform Health, Storage Engine, and Project Sentinel
  metaTitle: NocoDB Database Platform Health, Storage Engine, and Project Sentinel | Kestra
  shortDescription: Continuous health, SQL storage backend, and project metadata monitoring for NocoDB no-code database platforms.
  metaDescription: Audit NocoDB smart spreadsheet health, validate backend database connectivity and project metadata readiness, classify posture, and alert Slack via Kestra.
  description: |
    Continuously audits NocoDB no-code database and smart spreadsheet platforms by probing core application health endpoints, validating backend SQL database connection pool responsiveness (PostgreSQL, MySQL, SQLite), verifying base project metadata accessibility, classifying operational posture, and dispatching real-time incident escalation alerts to Slack.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `probe_health_endpoint` (`io.kestra.plugin.core.http.Request`) queries `/api/v1/health` to verify that the NocoDB application process is live and that its underlying relational database connection pool (PostgreSQL, MySQL, SQL Server, or SQLite) is responsive and accepting query transactions.
    2. `probe_version_endpoint` (`io.kestra.plugin.core.http.Request`) queries `/api/v1/version` to confirm API gateway responsiveness and deployment release consistency.
    3. `probe_project_metadata` (`io.kestra.plugin.core.http.Request`) queries `/api/v1/db/meta/projects` using an API token to verify that base projects, table schema metadata, and data sources can be queried without permission errors.
    4. `classify_nocodb_posture` (`io.kestra.plugin.core.debug.Return`) evaluates endpoint response codes and JSON attributes using a declarative Pebble expression:
       - Classifies as `INSTANCE_UNREACHABLE` if endpoints cannot be reached over the network.
       - Classifies as `DATABASE_STORAGE_DEGRADED` if `/api/v1/health` returns non-200 or the JSON `status` attribute does not equal `expected_status` (indicates database disconnection or query pool exhaustion).
       - Classifies as `SERVER_PROCESS_UNHEALTHY` if `/api/v1/version` returns non-200.
       - Classifies as `PROJECT_METADATA_UNREADY` if `/api/v1/db/meta/projects` fails (invalid token or schema sync stall).
       - Classifies as `HEALTHY_COMPLIANT` when all probes succeed.
    5. `route_by_posture` (`io.kestra.plugin.core.flow.Switch`) routes execution based on the classification:
       - `HEALTHY_COMPLIANT`: Logs successful audit confirmation with system version, status, and project metadata metrics.
       - `DATABASE_STORAGE_DEGRADED`: Posts an urgent Slack alert warning that the backend database is down and spreadsheet data mutations are blocked.
       - `PROJECT_METADATA_UNREADY`: Alerts Slack that project metadata queries or API credentials are misconfigured.
       - `SERVER_PROCESS_UNHEALTHY` / `INSTANCE_UNREACHABLE`: Dispatches high-priority incident notifications for container or network failure.
    6. `audit_summary` (`io.kestra.plugin.core.output.OutputValues`) exports structured metrics capturing endpoint HTTP status codes and operational posture for compliance logging.
    7. `errors` sends a priority failure notification to Slack if unhandled workflow execution errors occur.

    ## What you get

    - Automated, continuous validation of critical internal data platforms without relying on manual user reports.
    - Early warning of relational database connection pool exhaustion before business teams experience spreadsheet save errors.
    - Active verification of project metadata APIs ensuring back-office webhooks and automated integrations remain operational.
    - Contextual Slack alerts detailing exact endpoint failure codes, payload statuses, and target hostnames.
    - Auditable execution history satisfying SOC2 and ISO27001 data management and business continuity operational controls.

    ## Who it's for

    - Platform Engineers and DevOps teams maintaining self-hosted NocoDB instances and internal developer platforms (IDP).
    - Business Operations and Data Teams relying on NocoDB smart spreadsheets for mission-critical operations.
    - Database Administrators (DBAs) monitoring application query connections and schema sync health.

    ## Why orchestrate this with Kestra

    NocoDB transforms standard SQL databases into smart spreadsheets that operational teams depend on daily for order management, customer onboarding, and data entry. When NocoDB's database connection pool starves, web users cannot save records and automated API webhooks fail. Simple TCP port checks cannot verify whether SQL queries are executing or whether project metadata caches are intact. Kestra orchestrates multi-stage HTTP inspection, declarative Pebble classification, failure escalation to Slack, and centralized compliance audit trails in a single workflow.

    ## Prerequisites

    - A running NocoDB instance (Docker container or Kubernetes pod).
    - A NocoDB API token generated under User Settings > API Tokens.
    - An incoming Slack webhook URL for incident notifications.

    ### Secrets

    - `NOCODB_API_TOKEN`: NocoDB user API token (`xc-token`) used for project metadata API inspection.
    - `SLACK_WEBHOOK_URL`: Incoming Slack webhook URL used by `alert_database_degraded_slack`, `alert_project_metadata_slack`, `alert_server_unhealthy_slack`, `alert_unreachable_slack`, and `alert_flow_failure`.

    ## Quick start

    1. Configure `NOCODB_API_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local NocoDB instance using Docker:
       ```bash
       docker run -d --name nocodb -p 8080:8080 nocodb/nocodb:latest
       ```
    3. Import this blueprint into Kestra and click **Execute** with default inputs (`nocodb_host: "localhost"`).
    4. Confirm that `classify_nocodb_posture` classifies `HEALTHY_COMPLIANT` and inspect the structured telemetry in `audit_summary`.
    5. Enable the `hourly_canary` schedule to automate continuous database platform health monitoring.

    ## How to extend

    - Add table row count verification by querying `/api/v1/db/data/v1/{baseId}/{tableName}` to alert on unexpected data truncation.
    - Integrate PagerDuty or Opsgenie alerts for out-of-hours on-call paging during `DATABASE_STORAGE_DEGRADED` or `INSTANCE_UNREACHABLE` incidents.
    - Expand multi-environment monitoring by looping over an array of development, staging, and production NocoDB cluster hostnames using `io.kestra.plugin.core.flow.ForEach`.

    ## Links

    - [NocoDB Documentation](https://docs.nocodb.com/)
    - [NocoDB GitHub Repository](https://github.com/nocodb/nocodb)
    - [NocoDB API Reference](https://docs.nocodb.com/developer-resources/rest-apis)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
