id: openmeteo-geocoding-directory-lakehouse-loader
namespace: company.analytics
description: Ingests global municipality names, administrative provinces, elevations, and geographic coordinates from Open-Meteo Geocoding API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: openmeteo-geocoding-directory-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://geocoding-api.open-meteo.com/v1/search?name=London&count=20"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "results"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for item in items:
            lid = str(item.get('id', 'UNKNOWN'))
            current_ids.append(lid)
            name = item.get('name', 'Unknown')
            try:
                lat = float(item.get('latitude', 0.0))
            except Exception:
                lat = 0.0
            try:
                lon = float(item.get('longitude', 0.0))
            except Exception:
                lon = 0.0
            country = item.get('country', 'Unknown')
            admin1 = item.get('admin1', 'Unknown')
            tz = item.get('timezone', 'UTC')

            records.append({
                'location_id': lid,
                'name': str(name),
                'latitude': lat,
                'longitude': lon,
                'country': str(country),
                'admin1': str(admin1),
                'timezone': str(tz),
                'is_new': bool(lid not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE geocoded_locations (
                location_id VARCHAR,
                name VARCHAR,
                latitude DOUBLE,
                longitude DOUBLE,
                country VARCHAR,
                admin1 VARCHAR,
                timezone VARCHAR,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO geocoded_locations SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY geocoded_locations TO 'geocoded_locations.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    country,
                    COUNT(*) AS match_count
                FROM geocoded_locations
                GROUP BY 1
                ORDER BY match_count DESC
            ) TO 'locations_by_country.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM geocoded_locations WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM geocoded_locations").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - geocoded_locations.parquet
      - locations_by_country.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['geocoded_locations.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "Open-Meteo Spatial Geocoding Directory sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
