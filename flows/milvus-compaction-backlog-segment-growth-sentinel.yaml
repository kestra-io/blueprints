id: milvus-compaction-backlog-segment-growth-sentinel
namespace: company.ai

inputs:
  - id: milvus_metrics_url
    type: STRING
    defaults: "http://milvus.internal:9091/metrics"
    description: Prometheus scrape endpoint for Milvus DataCoord metrics.
  - id: max_compacting_segments
    type: INT
    defaults: 20
    description: "Maximum allowable compacting segments in backlog before alerting (default 20)."

tasks:
  - id: query_milvus_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.milvus_metrics_url }}" > /tmp/milvus_metrics.txt
        
        # Scrape milvus_datacoord_compacting_segment_count or segment count metrics
        COMPACTING=$(grep -E "^milvus_datacoord_compacting_segment_count" /tmp/milvus_metrics.txt | awk '{print $2+0}' | head -n 1)
        echo "::set-output name=compacting_segments::${COMPACTING:-0}::"

  - id: evaluate_compaction_backlog
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_milvus_metrics.vars.compacting_segments | int > inputs.max_compacting_segments }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#ai-platform",
            "attachments": [
              {
                "color": "warning",
                "title": "🚨 Milvus Compaction Backlog Saturated Alert",
                "text": "Milvus instance at `{{ inputs.milvus_metrics_url }}` has *{{ outputs.query_milvus_metrics.vars.compacting_segments }} compacting segments* in backlog! Uncompacted small segments and delayed merges are elevating vector search latency.",
                "footer": "Kestra AI Sentinel • Milvus"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#ai-platform",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Milvus Sentinel Failure",
            "text": "Failed to scrape Milvus metrics endpoint. Verify DataCoord service availability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors Milvus vector database for compaction backlogs and uncompacted segment growth to prevent query latency spikes."
  metaTitle: Milvus Vector Database Compaction Backlog and Segment Growth Sentinel with Kestra
  title: Milvus Vector Database Compaction Backlog and Segment Growth Sentinel
  shortDescription: Monitors Milvus vector database for compaction backlogs and uncompacted segment growth to prevent query latency spikes.
  description: |
    ## How it works
    This workflow queries the Prometheus `/metrics` endpoint of the Milvus DataCoord component (default port `9091`) to monitor the `milvus_datacoord_compacting_segment_count` metric. In Milvus, continuous insert and delete operations create numerous small segments and tombstone records. Compaction merges small segments into larger indexed files (e.g. 512MB) to maintain fast index scans and clean deleted entities. When compaction falls behind, query nodes must scan dozens of unoptimized segments, causing vector query latency degradation. This workflow tracks compaction health and triggers alerts when backlogs build up.

    ## What you get
    - Continuous monitoring of Milvus background compaction efficiency.
    - Prevents vector search latency regression caused by segment fragmentation.
    - Actionable visibility into DataCoord compaction backlogs.

    ## Who it's for
    - MLOps and Big Data Platform Engineers maintaining distributed Milvus clusters.
    - SREs overseeing AI vector search infrastructure.

    ## Why orchestrate this with Kestra
    - **Proactive Performance Sentinel**: Detects fragmentation issues before search latency SLA violations occur.
    - **Native Orchestration**: Runs periodic health audits alongside AI ETL and data ingestion pipelines.
    - **Direct Alert Dispatch**: Delivers diagnostic information directly to AI platform channels.

    ## Prerequisites
    - Milvus cluster with DataCoord metrics endpoint enabled and accessible.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Enter your Milvus metrics URL.
    3. Run the workflow to inspect current compaction backlog metrics.

    ## How to extend
    - Trigger a manual compaction request via Milvus REST API (`/v2/vectordb/entities/compact`) when backpressure clears.
    - Correlate with QueryNode memory consumption.

    ## Links
    - [Milvus Compaction Architecture Documentation](https://milvus.io/docs/compact_data.md)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - AI
    - Data
  subTags:
    - Agents & Structured Output
    - ELT & Data Landing
  ee: false
  demo: false
