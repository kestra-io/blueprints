id: skopeo-container-registry-sync-gate
namespace: company.team
description: |
  Compare a container image's manifest digest between a source and a
  destination registry using Skopeo, and only copy the image across when
  drift is found AND auto_sync is explicitly enabled. dry_run gates whether
  that copy actually runs or is only logged. A Slack message reports the
  outcome every run.

triggers:
  - id: weekly_sync_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly drift check. Shipped disabled; enable it once source_image/dest_image point at real registries and a manual run has been verified. Always fires in safe mode (auto_sync false, dry_run true) regardless of this flow's own defaults.
    cron: "0 2 * * 1"
    disabled: true
    inputs:
      auto_sync: "false"
      dry_run: "true"

inputs:
  - id: source_image
    type: STRING
    displayName: "Source Image"
    defaults: "registry.hub.docker.com/library/alpine:latest"
    description: Source registry image reference, passed to skopeo inspect/copy as docker://<source_image>.

  - id: dest_image
    type: STRING
    displayName: "Destination Image"
    defaults: "localhost:5001/library/alpine:latest"
    description: Destination registry image reference, compared against source_image and, if synced, copied to.

  - id: auto_sync
    type: SELECT
    displayName: "Auto Sync"
    defaults: "false"
    values:
      - "false"
      - "true"
    description: If "true" and drift is detected, actually run the sync branch (still gated by dry_run below). If "false", drift is only logged and alerted, never copied.

  - id: dry_run
    type: SELECT
    displayName: "Dry Run"
    defaults: "true"
    values:
      - "true"
      - "false"
    description: If "true", the sync branch only logs what it would copy. Must be explicitly "false", together with auto_sync "true", for skopeo copy to actually run.

tasks:
  - id: inspect_registry_images
    type: io.kestra.plugin.skopeo.cli.SkopeoCLI
    description: Inspect both images with skopeo inspect, writing each result to its own JSON file. The destination may not exist yet (first sync), so its inspect failure is caught and replaced with a NOT_FOUND placeholder rather than failing the task. io.kestra.plugin.skopeo.cli.SkopeoCLI has no dedicated Inspect/Copy task class, no source/destination/credentials/tlsVerify properties, and no digest output field - it is a generic CLI wrapper (commands, containerImage, outputFiles) whose results are read back from the files it writes.
    outputFiles:
      - source_inspect.json
      - dest_inspect.json
    commands:
      - skopeo inspect docker://{{ inputs.source_image }} > source_inspect.json
      - skopeo inspect docker://{{ inputs.dest_image }} > dest_inspect.json || echo '{"Digest":"NOT_FOUND"}' > dest_inspect.json

  - id: evaluate_drift
    type: io.kestra.plugin.core.flow.If
    description: Drift means the source and destination manifest digests differ. Digests are read from the files inspect_registry_images wrote and extracted with jq, since SkopeoCLI's ScriptOutput exposes only exitCode/outputFiles/vars, not a structured digest field.
    condition: "{{ (read(outputs.inspect_registry_images.outputFiles['source_inspect.json']) | jq('.Digest') | first) != (read(outputs.inspect_registry_images.outputFiles['dest_inspect.json']) | jq('.Digest') | first) }}"
    then:
      - id: route_sync_decision
        type: io.kestra.plugin.core.flow.Switch
        description: Only consider syncing when auto_sync is explicitly "true". Case keys are quoted strings, matching the string values the auto_sync SELECT input actually renders.
        value: "{{ inputs.auto_sync }}"
        cases:
          "true":
            - id: check_dry_run
              type: io.kestra.plugin.core.flow.If
              description: dry_run is a second, independent gate on top of auto_sync - both must allow the copy before it runs for real.
              condition: "{{ inputs.dry_run == \"false\" }}"
              then:
                - id: sync_images
                  type: io.kestra.plugin.skopeo.cli.SkopeoCLI
                  description: Copy the source image to the destination registry, matching the official plugin's own mirroring example.
                  commands:
                    - skopeo copy docker://{{ inputs.source_image }} docker://{{ inputs.dest_image }}
                - id: verify_post_sync
                  type: io.kestra.plugin.skopeo.cli.SkopeoCLI
                  description: Re-inspect the destination after the copy to confirm its digest now matches the source, per this blueprint's post-sync verification goal.
                  outputFiles:
                    - post_sync_inspect.json
                  commands:
                    - skopeo inspect docker://{{ inputs.dest_image }} > post_sync_inspect.json
                - id: log_sync_verified
                  type: io.kestra.plugin.core.log.Log
                  message: "{{ (read(outputs.verify_post_sync.outputFiles['post_sync_inspect.json']) | jq('.Digest') | first) == (read(outputs.inspect_registry_images.outputFiles['source_inspect.json']) | jq('.Digest') | first) ? 'Post-sync verification PASSED: destination digest now matches source after copy.' : 'Post-sync verification FAILED: destination digest still does not match source after copy.' }}"
              else:
                - id: log_dry_run_sync
                  type: io.kestra.plugin.core.log.Log
                  message: "DRY RUN: would copy {{ inputs.source_image }} to {{ inputs.dest_image }} (auto_sync is true, dry_run is true). No changes made."
          "false":
            - id: log_sync_disabled
              type: io.kestra.plugin.core.log.Log
              message: "Drift detected between {{ inputs.source_image }} and {{ inputs.dest_image }}, but auto_sync is false. No action taken."
    else:
      - id: log_no_drift
        type: io.kestra.plugin.core.log.Log
        message: "{{ inputs.source_image }} and {{ inputs.dest_image }} digests match. No drift."

  - id: notify_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Report drift status and what, if anything, ran, so the channel has one message per run regardless of branch. Digests are recomputed here directly from inspect_registry_images rather than from evaluate_drift's own output, since io.kestra.plugin.core.flow.If does not expose a usable boolean result field.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Skopeo registry sync gate finished for execution {{ execution.id }}. Source: {{ inputs.source_image }}. Destination: {{ inputs.dest_image }}. Drift detected: {{ (read(outputs.inspect_registry_images.outputFiles['source_inspect.json']) | jq('.Digest') | first) != (read(outputs.inspect_registry_images.outputFiles['dest_inspect.json']) | jq('.Digest') | first) }}. auto_sync: {{ inputs.auto_sync }}. dry_run: {{ inputs.dry_run }}. Sync executed: {{ outputs.sync_images is defined }}. Post-sync verified: {{ outputs.verify_post_sync is defined }}."
      }

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the flow itself fails outside the handled branches, for example an unreachable registry or a malformed image reference.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Skopeo registry sync gate FAILED in execution {{ execution.id }} for source {{ inputs.source_image }} and destination {{ inputs.dest_image }}. The digest comparison did not complete; investigate before trusting the last known sync status."
      }

extend:
  title: "Skopeo Container Registry Sync Gate & Drift Reconciliation"
  shortDescription: Compare container image digests between a source and destination registry with Skopeo, and conditionally sync and verify when drift is detected and auto_sync is enabled.
  metaTitle: Skopeo Container Registry Sync Gate with Kestra
  metaDescription: "Compare container image digests across registries with Skopeo, conditionally sync on drift, and verify post-sync alignment."
  description: |
    Two registries holding "the same" image tag can silently drift apart - a tag gets
    repushed, a mirror job fails partway, or a promotion step is skipped. There is no
    built-in alert for that drift; you find out when a deploy pulls the wrong bits. This
    blueprint runs `skopeo inspect` against both a source and a destination image, compares
    their manifest digests, and only copies the source over the destination when drift is
    found and `auto_sync` is explicitly `"true"` - itself still gated by `dry_run`, so a
    schedule can safely audit without ever mutating a registry on its own.

    ## How it works

    1. `weekly_sync_check` (`io.kestra.plugin.core.trigger.Schedule`) runs weekly, always forcing `auto_sync: "false"` and `dry_run: "true"` through its own `inputs:` override regardless of this flow's defaults. Shipped disabled so you can validate a manual run first.
    2. `inspect_registry_images` (`io.kestra.plugin.skopeo.cli.SkopeoCLI`) runs `skopeo inspect docker://...` against both images, redirecting each result to its own file (`source_inspect.json`, `dest_inspect.json`). A missing destination image (first sync) is caught with a shell fallback that writes a `NOT_FOUND` placeholder instead of failing the task.
    3. `evaluate_drift` (`io.kestra.plugin.core.flow.If`) extracts each file's `.Digest` field with `jq` and compares them.
       - `then` (drift found): `route_sync_decision` (`io.kestra.plugin.core.flow.Switch`) branches on `auto_sync`. `"false"` only logs that drift exists and nothing ran. `"true"` enters `check_dry_run` (`io.kestra.plugin.core.flow.If`) on `dry_run`: `"false"` runs `sync_images` (`skopeo copy`), then `verify_post_sync` re-inspects the destination and `log_sync_verified` confirms whether the digests now match; `"true"` only logs what would have been copied.
       - `else` (no drift): `log_no_drift` records a clean run.
    4. `notify_slack` posts one summary message every run, and the `errors` block alerts separately if the flow itself fails outside these handled branches.

    ## What you get

    - A registry-to-registry digest comparison using Skopeo's own `inspect`, not a guess from tags or timestamps.
    - Two independent gates (`auto_sync`, `dry_run`) between "drift detected" and "image actually copied".
    - A post-sync re-inspection that confirms the destination's digest actually changed to match the source, not just that `skopeo copy` exited zero.
    - One Slack message per run covering all outcomes: clean, drift-logged-only, dry-run audit, and synced-and-verified.

    ## Who it's for

    - Platform teams running their own registry mirrors or promotion pipelines who need to know when a mirror silently falls behind.
    - Release engineers who want a reviewable gate before any automated cross-registry copy.
    - Anyone who has shipped a stale image because "the mirror job usually works".

    ## Why orchestrate this with Kestra

    Skopeo has no built-in scheduler, no diffing memory between runs, and no branching logic of its own - it runs the command you give it and exits. Kestra supplies the schedule, the digest comparison as a first-class branch, two independent authorization gates before anything is copied, and an execution history that shows exactly when drift was found, whether it was synced, and whether the sync was verified.

    ## Prerequisites

    - Docker available to the Kestra Worker (`SkopeoCLI` defaults to the Docker task runner with the `quay.io/skopeo/stable` image).
    - Network access from the Kestra Worker to both the source and destination registries.
    - For a private destination registry, credentials passed via Skopeo's own CLI flags (`--dest-creds`, `--creds`) added to the `commands` in `sync_images` - Skopeo has no separate connection/credentials task property; see Pitfalls.
    - A Slack incoming webhook for notifications.

    Local testing with a throwaway registry:
    `docker run -d --name registry -p 5001:5000 registry:2`
    `docker network connect YOUR_KESTRA_NETWORK registry` (only needed if the Kestra Worker runs in a separate Docker network than this container).

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `notify_slack` and the `errors` block.
    - This blueprint's default `source_image`/`dest_image` need no registry credentials. If you add `--dest-creds`/`--creds` flags for a private registry, use `{{ secret('REGISTRY_USER') }}:{{ secret('REGISTRY_PASSWORD') }}` as shown in the official plugin examples - never place credentials in `source_image`/`dest_image` or any other input.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_SLACK_WEBHOOK_URL=$(echo -n 'https://hooks.slack.com/...' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `source_image` (STRING, default `registry.hub.docker.com/library/alpine:latest`): source image reference.
    - `dest_image` (STRING, default `localhost:5001/library/alpine:latest`): destination image reference.
    - `auto_sync` (SELECT: `"false"`, `"true"`; default `"false"`): must be `"true"` for the sync branch to be entered at all.
    - `dry_run` (SELECT: `"true"`, `"false"`; default `"true"`): must be explicitly `"false"`, together with `auto_sync: "true"`, for `skopeo copy` to actually run.

    ### Outputs

    - `outputs.inspect_registry_images.outputFiles['source_inspect.json']` / `['dest_inspect.json']`: raw `skopeo inspect` JSON for each image (destination is a `{"Digest":"NOT_FOUND"}` placeholder if it does not exist yet).
    - `outputs.sync_images`: present only when the copy branch actually ran.
    - `outputs.verify_post_sync.outputFiles['post_sync_inspect.json']`: the destination's re-inspected manifest after the copy, present only when a sync ran.

    ## Quick start

    1. Start a local registry with the command above and push a test image to it (or use the defaults, which compare Docker Hub's `alpine:latest` against a non-existent local image - a guaranteed first-run drift).
    2. Add the `SLACK_WEBHOOK_URL` secret.
    3. Run the flow manually with the defaults (`auto_sync: "false"`) and confirm `log_sync_disabled` fires and nothing is copied.
    4. Run once with `auto_sync: "true"` and `dry_run: "true"` and confirm `log_dry_run_sync` describes the copy without making it.
    5. Run once with `auto_sync: "true"` and `dry_run: "false"` against a test destination and confirm `log_sync_verified` reports PASSED.
    6. Enable `weekly_sync_check` once you trust the audit step; it always runs in the safe `auto_sync: "false"` / `dry_run: "true"` mode regardless of what you leave the flow's own defaults set to.

    ## How to extend

    - Loop over a list of image pairs with `io.kestra.plugin.core.flow.Loop` (`ForEach` is deprecated) to audit an entire mirror set in one run.
    - Add a `Pause` approval task between `evaluate_drift` and the sync branch for a human-reviewed gate instead of (or alongside) the static `auto_sync` input.
    - Compare more than the top-level `Digest` - skopeo inspect's JSON also includes `RepoTags`, `Created`, and `Labels`, useful for detecting a retag without a digest change.
    - Add retry policy to `sync_images` for transient registry errors instead of letting the whole execution fail into the `errors` block.

    ## Pitfalls

    - **`io.kestra.plugin.skopeo.cli.SkopeoCLI` has no `source`/`destination`/`credentials`/`tlsVerify` property.** It is a single generic CLI-wrapper task (`commands`, `containerImage`, `outputFiles`) - Skopeo has no separate connection class at all; authentication is passed as raw `--src-creds`/`--dest-creds`/`--creds` flags inside `commands`, per the plugin's own documentation.
    - **There is no `digest` output field.** `SkopeoCLI` returns a core `ScriptOutput` (`exitCode`, `outputFiles`, `vars`, log line counts) - this blueprint gets the digest by redirecting `skopeo inspect`'s JSON to a file, declaring it in `outputFiles`, and extracting `.Digest` with `read(...) | jq(...)`, exactly as the plugin's own sanity-check test does for a different field.
    - **A missing destination image is not a drift-detection failure.** The first run against a destination that does not exist yet would make `skopeo inspect` fail the whole task; the fallback `|| echo '{"Digest":"NOT_FOUND"}'` turns that into a normal "drift found" result (since `NOT_FOUND` never equals a real digest) instead of an `errors`-block alert.
    - **`auto_sync` and `dry_run` are SELECT strings, not booleans.** Comparisons use `== "false"` / `== "true"` string equality, and `Switch` case keys are quoted (`"true":`, `"false":`) to stop YAML from parsing them as boolean map keys, which would silently fail to match the string value `Switch` actually receives.
    - **The Schedule trigger's own `inputs:` override is the real safety net, not this flow's defaults.** `weekly_sync_check` always forces `auto_sync: "false"` / `dry_run: "true"` on every scheduled fire; a manual execution is the only way to pass different values and trigger an actual sync.

    ## Links

    - [plugin-skopeo documentation](https://kestra.io/plugins/plugin-skopeo)
    - [Skopeo inspect command reference](https://github.com/containers/skopeo/blob/main/docs/skopeo-inspect.1.md)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
    - [Nearest existing blueprint: container-image-size-budget](https://github.com/kestra-io/blueprints/blob/main/flows/container-image-size-budget.yaml)
  tags:
    - Infrastructure
    - Data
  subTags:
