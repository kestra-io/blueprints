id: mongodb-chunk-balancer-round-failure-sentinel
namespace: company.data

inputs:
  - id: mongo_uri
    type: STRING
    defaults: "mongodb://mongos.internal:27017"
    description: MongoDB connection URI (must connect via mongos router).

tasks:
  - id: audit_balancer_status
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pymongo==4.15.3
      - kestra==2.0.0
    script: |
      from pymongo import MongoClient
      import datetime
      import sys
      from kestra import Kestra

      mongo_uri = "{{ inputs.mongo_uri }}"
      try:
          client = MongoClient(mongo_uri, serverSelectionTimeoutMS=5000)
          config_db = client["config"]
          one_hour_ago = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=1)

          failures = config_db["changelog"].count_documents({
              "time": {"$gte": one_hour_ago},
              "what": {"$regex": "balancer.round"},
              "details.errorMessage": {"$exists": True}
          })

          balancer_state = config_db["settings"].find_one({"_id": "balancer"})
          is_stopped = bool(balancer_state and balancer_state.get("stopped") is True)

          print(f"Balancer round failures in last hour: {failures}, is_stopped: {is_stopped}")

          Kestra.outputs({
              "failures": failures,
              "is_stopped": is_stopped
          })
      except Exception as e:
          print(f"Error querying MongoDB sharded cluster balancer status: {e}", file=sys.stderr)
          sys.exit(1)

  - id: evaluate_balancer_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_balancer_status.vars.failures | int > 0 or outputs.audit_balancer_status.vars.is_stopped }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#mongodb-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 MongoDB Sharded Cluster Balancer Anomaly Alert",
                "text": "MongoDB cluster at `{{ inputs.mongo_uri }}` detected chunk balancer issues! Recent round failures: *{{ outputs.audit_balancer_status.vars.failures }}*, Balancer Stopped Flag: *{{ outputs.audit_balancer_status.vars.is_stopped }}*. Impact: Chunk distribution is uneven across shards, causing severe storage imbalance, hotspotting, and query skew.",
                "footer": "Kestra Database Sentinel • MongoDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#mongodb-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MongoDB Sharded Cluster Chunk Balancer Failure Sentinel Pipeline Failure",
            "text": "Failed to connect to MongoDB router to inspect chunk balancer state. Check URI and network reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: failures
    type: INT
    value: "{{ outputs.audit_balancer_status.vars.failures }}"
  - id: is_stopped
    type: BOOLEAN
    value: "{{ outputs.audit_balancer_status.vars.is_stopped }}"

extend:
  metaDescription: "Audits MongoDB sharded cluster balancer operations to detect chunk migration failures and balancer lock contention."
  metaTitle: MongoDB Sharded Cluster Chunk Balancer Failure Sentinel with Kestra
  title: MongoDB Sharded Cluster Chunk Balancer Failure Sentinel
  shortDescription: Audits MongoDB sharded cluster balancer operations to detect chunk migration failures and balancer lock contention.
  description: |
    ## How it works
    This workflow connects to the `mongos` router via Python in a Docker container and inspects the `config.changelog` collection for failed balancer rounds within the last hour (`what: /balancer.round/` with `details.errorMessage`). It also verifies that the balancer is not administratively stopped. When chunk migrations fail due to network timeouts, shard lock timeouts, or oversized jumbo chunks, shards become unbalanced. When failures occur, Slack is notified immediately.

    ## What you get
    - Continuous monitoring of MongoDB sharded cluster chunk migration health.
    - Early warning of jumbo chunk migration deadlocks and balancer failures.
    - Prevents single-shard disk saturation and query performance bottlenecks.

    ## Who it's for
    - Database Administrators (DBAs) and SREs managing distributed MongoDB sharded clusters.
    - Data Platform Engineers running multi-terabyte document databases.

    ## Why orchestrate this with Kestra
    - **Containerized Python Driver**: Leverages official PyMongo driver within a Docker container.
    - **Config Database Telemetry**: Directly inspects the internal `config.changelog` without third-party agents.
    - **Automated Incident Response**: Triggers automated notifications and escalation paths.

    ## Prerequisites
    - MongoDB sharded cluster accessible from the Kestra worker.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `mongo_uri` pointing to your mongos routing tier.
    3. Run the workflow to inspect balancer status.

    ## How to extend
    - Query `config.chunks` for jumbo chunks (`jumbo: true`) that need manual splitting.
    - Automatically execute `sh.startBalancer()` if the balancer was accidentally left disabled.

    ## Links
    - [MongoDB Sharding Balancer Documentation](https://www.mongodb.com/docs/manual/core/sharding-balancer-administration/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-script-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
