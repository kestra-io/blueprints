id: github-dependabot-sla-escalation-sentinel
namespace: company.security

description: Audit open GitHub Dependabot vulnerability alerts against SLA deadlines and escalate overdue CVEs to Slack.

triggers:
  - id: daily_sla_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run daily SLA audit for repository security alerts.
    cron: "0 9 * * 1-5"

  - id: on_demand_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Trigger an on-demand audit from SecOps pipelines or GitHub webhooks.
    key: dependabot-sla-check

inputs:
  - id: repository
    type: STRING
    displayName: GitHub Repository
    defaults: kestra-io/kestra
    description: Target repository in owner/repo format.
  - id: critical_sla_days
    type: INT
    displayName: Critical Severity SLA (Days)
    defaults: 7
    description: Maximum allowed days to resolve Critical severity vulnerabilities.
  - id: high_sla_days
    type: INT
    displayName: High Severity SLA (Days)
    defaults: 14
    description: Maximum allowed days to resolve High severity vulnerabilities.
  - id: medium_sla_days
    type: INT
    displayName: Medium Severity SLA (Days)
    defaults: 30
    description: Maximum allowed days to resolve Medium severity vulnerabilities.
  - id: low_sla_days
    type: INT
    displayName: Low Severity SLA (Days)
    defaults: 60
    description: Maximum allowed days to resolve Low severity vulnerabilities.

tasks:
  - id: fetch_dependabot_alerts
    type: io.kestra.plugin.core.http.Request
    description: Retrieve open Dependabot vulnerability alerts from the GitHub REST API.
    uri: "https://api.github.com/repos/{{ inputs.repository }}/dependabot/alerts?state=open&per_page=100&direction=desc&sort=created"
    method: GET
    headers:
      Accept: "application/vnd.github+json"
      User-Agent: "Kestra-Dependabot-SLA-Sentinel"
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"

  - id: audit_sla_breaches
    type: io.kestra.plugin.scripts.python.Script
    description: Evaluate open alerts against defined remediation SLA thresholds.
    containerImage: python:3.11-slim
    inputFiles:
      alerts.json: "{{ outputs.fetch_dependabot_alerts.body | toJson }}"
    script: |
      import json
      from datetime import datetime, timezone

      with open("alerts.json", "r") as f:
          raw = f.read().strip()
          data = json.loads(raw) if raw else []

      alerts = data if isinstance(data, list) else []
      now = datetime.now(timezone.utc)

      sla_limits = {
          "critical": int("{{ inputs.critical_sla_days }}"),
          "high": int("{{ inputs.high_sla_days }}"),
          "medium": int("{{ inputs.medium_sla_days }}"),
          "low": int("{{ inputs.low_sla_days }}")
      }

      total_open = len(alerts)
      breached_alerts = []
      compliant_alerts = []
      by_severity = {"critical": 0, "high": 0, "medium": 0, "low": 0}

      for item in alerts:
          advisory = item.get("security_advisory", {})
          severity = advisory.get("severity", "low").lower()
          if severity not in sla_limits:
              severity = "low"
          by_severity[severity] = by_severity.get(severity, 0) + 1

          created_str = item.get("created_at")
          age_days = 0
          if created_str:
              dt = datetime.fromisoformat(created_str.replace("Z", "+00:00"))
              age_days = (now - dt).days

          allowed_days = sla_limits.get(severity, 60)
          is_breached = age_days > allowed_days

          record = {
              "number": item.get("number"),
              "package": item.get("dependency", {}).get("package", {}).get("name", "unknown"),
              "severity": severity,
              "cve_id": advisory.get("cve_id") or advisory.get("ghsa_id", "N/A"),
              "summary": advisory.get("summary", ""),
              "age_days": age_days,
              "sla_days": allowed_days,
              "overdue_by": age_days - allowed_days if is_breached else 0,
              "html_url": item.get("html_url", "")
          }

          if is_breached:
              breached_alerts.append(record)
          else:
              compliant_alerts.append(record)

      breached_alerts.sort(key=lambda x: x["overdue_by"], reverse=True)

      breach_count = len(breached_alerts)
      has_breaches = breach_count > 0

      alert_lines = []
      for a in breached_alerts[:10]:
          alert_lines.append(
              f"• [{a['severity'].upper()}] {a['package']} ({a['cve_id']}): {a['age_days']}d old (SLA: {a['sla_days']}d, {a['overdue_by']}d overdue) - <{a['html_url']}|View Alert>"
          )
      if breach_count > 10:
          alert_lines.append(f"• ...and {breach_count - 10} more overdue alert(s).")

      breach_details_text = "\n".join(alert_lines) if alert_lines else "No SLA breaches."

      summary = {
          "total_open": total_open,
          "breach_count": breach_count,
          "has_breaches": has_breaches,
          "by_severity": by_severity,
          "breach_details_text": breach_details_text
      }

      print(f"Audited {total_open} alerts: {breach_count} breached SLA thresholds.")
      print("::" + json.dumps({"outputs": summary}) + "::")

  - id: evaluate_sla_breaches
    type: io.kestra.plugin.core.flow.If
    description: Escalate to Slack if any open alerts exceed remediation SLA limits.
    condition: "{{ outputs.audit_sla_breaches.vars.has_breaches == true }}"
    then:
      - id: alert_security_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch urgent remediation alert to Slack security channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":rotating_light: *Dependabot Vulnerability SLA Breach Alert*\n*Repository:* {{ inputs.repository }}\n*Total Open Alerts:* {{ outputs.audit_sla_breaches.vars.total_open }}\n*SLA Breaches:* {{ outputs.audit_sla_breaches.vars.breach_count }}\n*Severity Breakdown:* Critical: {{ outputs.audit_sla_breaches.vars.by_severity.critical }}, High: {{ outputs.audit_sla_breaches.vars.by_severity.high }}, Medium: {{ outputs.audit_sla_breaches.vars.by_severity.medium }}, Low: {{ outputs.audit_sla_breaches.vars.by_severity.low }}\n\n*Overdue Alerts (Immediate Action Required):*\n{{ outputs.audit_sla_breaches.vars.breach_details_text }}"
          }
    else:
      - id: log_sla_compliant
        type: io.kestra.plugin.core.log.Log
        description: Log compliance status when all open alerts are within SLA window.
        message: "Dependabot SLA audit passed for {{ inputs.repository }}. Total open: {{ outputs.audit_sla_breaches.vars.total_open }}, all within remediation SLA."

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Notify Slack when the GitHub API or audit fails so security gaps are not hidden.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":warning: *Dependabot SLA Sentinel Audit Failed*\n*Repository:* {{ inputs.repository }}\n*Execution:* {{ execution.id }}\nCheck GITHUB_TOKEN scope ('security_events' or 'repo') and API rate limits."
      }

outputs:
  - id: audit_summary
    type: JSON
    description: Summary of Dependabot open alerts, SLA breaches, and severity metrics.
    value: "{{ outputs.audit_sla_breaches.vars | toJson }}"

extend:
  title: GitHub Dependabot Vulnerability SLA Escalation Sentinel
  shortDescription: Audit open Dependabot alerts against remediation SLA deadlines and escalate overdue CVEs to Slack.
  metaTitle: GitHub Dependabot SLA Escalation Sentinel
  metaDescription: Track GitHub Dependabot alerts against security SLA deadlines and escalate overdue vulnerabilities to Slack.
  description: |
    Unpatched dependencies represent a major attack vector in modern applications.
    While Dependabot detects vulnerable libraries, security compliance frameworks
    (such as SOC 2, FedRAMP, and ISO 27001) require strict remediation service-level
    agreements (SLAs) based on vulnerability severity.

    This blueprint automatically audits open Dependabot alerts for any GitHub
    repository, calculates vulnerability age against configured SLA thresholds
    (e.g., 7 days for Critical, 14 days for High, 30 days for Medium), and escalates
    overdue CVEs directly to your SecOps or engineering team via Slack.

    ## How it works

    1. `fetch_dependabot_alerts` queries the GitHub REST API for open Dependabot alerts.
    2. `audit_sla_breaches` runs an automated Python script that computes alert age, compares against severity SLAs, aggregates severity metrics, and compiles a remediation digest.
    3. `evaluate_sla_breaches` uses an `If` condition to check whether any alerts breached the configured SLA window.
    4. If breaches exist, `alert_security_slack` sends a structured Slack notification with direct links to the affected alerts for rapid triage.
    5. If all alerts are within SLA, `log_sla_compliant` logs clean compliance telemetry.
    6. The `errors` block alerts Slack if token authorization or network connectivity fails.
    7. Scheduled triggers run the audit automatically on weekdays, while a Webhook trigger enables on-demand audits.

    ## Prerequisites

    - A GitHub Personal Access Token or fine-grained token with `security_events` (read) or `repo` permission.
    - A Slack Incoming Webhook URL for alerting.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub token used to authenticate against the Dependabot alerts API.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL to receive SLA escalation and failure alerts.

    ## Quick start

    1. Add `GITHUB_TOKEN` and `SLACK_WEBHOOK_URL` to your Kestra namespace secrets.
    2. Adjust `repository` to your target repository (e.g. `your-org/your-repo`).
    3. (Optional) Customize the SLA days for critical, high, medium, and low severities.
    4. Run the workflow manually to inspect the `audit_summary` output.
    5. Keep the weekday schedule active to maintain ongoing security compliance.

    ## How to extend

    - Add automatic GitHub issue creation or assignment for teams when an SLA is breached.
    - Integrate with Jira or PagerDuty to page on-call engineers for critical SLA violations.
    - Export vulnerability SLA metrics to ClickHouse, BigQuery, or PostgreSQL for compliance dashboards.

    ## Links

    - https://docs.github.com/en/rest/dependabot/alerts
    - https://kestra.io/plugins/plugin-slack
    - https://kestra.io/plugins/plugin-scripts-python
  tags:
    - Infrastructure
    - Business
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
