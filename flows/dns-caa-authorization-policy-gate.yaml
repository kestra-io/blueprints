id: dns-caa-authorization-policy-gate
namespace: company.security
description: |
  Inspect the DNS Certification Authority Authorization (CAA) policy for a hostname. The flow
  follows the DNS CAA parent lookup, records effective issue and issuewild authorities, checks
  issuer names against an explicit allowlist, and optionally requires a policy to exist. It emits
  JSON evidence and can alert when unexpected certificate authorities are allowed.

inputs:
  - id: domain
    type: STRING
    displayName: DNS hostname
    defaults: test.github.io
    description: Hostname to audit without a scheme, path, credentials or port.
  - id: approved_issuers
    type: STRING
    displayName: Approved certificate authorities
    defaults: letsencrypt.org,sectigo.com,digicert.com
    description: Comma-separated issuer domain names allowed by policy.
  - id: include_wildcard_policy
    type: BOOL
    displayName: Audit wildcard issuance policy
    defaults: true
    description: Also evaluate issuewild records, falling back to issue records when no issuewild tag is present.
  - id: require_caa_records
    type: BOOL
    displayName: Require an explicit CAA policy
    defaults: false
    description: Block when neither the hostname nor its ancestors have a CAA policy. Disable for inventory-only discovery.
  - id: archive_report
    type: BOOL
    displayName: Archive report to S3
    defaults: false
    description: Store the JSON DNS-policy report in S3. AWS credentials are required only when enabled.
  - id: evidence_bucket
    type: STRING
    displayName: S3 evidence bucket
    defaults: my-caa-policy-evidence
    description: Existing S3 bucket used for optional report retention.
  - id: evidence_prefix
    type: STRING
    displayName: S3 evidence prefix
    defaults: dns-caa-policy-audits
    description: Object key prefix for DNS CAA evidence.
  - id: aws_region
    type: STRING
    displayName: AWS region
    defaults: eu-west-1
    description: Region containing the evidence bucket.

triggers:
  - id: weekly_caa_policy_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recheck the effective CAA policy weekly. Enable only after approving the issuer allowlist for the domain.
    cron: "0 7 * * 1"
    disabled: true

tasks:
  - id: validate_caa_policy_inputs
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the DNS hostname and approved CA allowlist before DNS lookup.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      DOMAIN: "{{ inputs.domain }}"
      APPROVED_ISSUERS: "{{ inputs.approved_issuers }}"
    script: |
      import os
      import re

      domain = os.environ.get("DOMAIN", "").strip().lower().rstrip(".")
      if not re.fullmatch(r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}", domain):
          raise ValueError("domain must be a DNS hostname without a URL scheme, path or port")
      issuers = [item.strip().lower().rstrip(".") for item in os.environ.get("APPROVED_ISSUERS", "").split(",") if item.strip()]
      if not issuers:
          raise ValueError("approved_issuers must contain at least one issuer domain")
      if len(issuers) != len(set(issuers)):
          raise ValueError("approved_issuers contains duplicate names")
      if any(not re.fullmatch(r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}", issuer) for issuer in issuers):
          raise ValueError("each approved issuer must be a DNS name")

      print(f"Validated CAA policy target {domain}; {len(issuers)} approved issuer(s) configured.")

  - id: lookup_effective_caa_policy
    type: io.kestra.plugin.scripts.python.Script
    description: Query real DNS CAA records from the hostname upward to its ancestors and stop at the first applicable non-empty CAA record set.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - dnspython
      - kestra
    env:
      DOMAIN: "{{ inputs.domain }}"
      APPROVED_ISSUERS: "{{ inputs.approved_issuers }}"
      INCLUDE_WILDCARD_POLICY: "{{ inputs.include_wildcard_policy }}"
      REQUIRE_CAA_RECORDS: "{{ inputs.require_caa_records }}"
    outputFiles:
      - caa-policy-audit.json
    script: |
      import json
      import os
      from datetime import datetime, timezone

      import dns.exception
      import dns.resolver
      from kestra import Kestra

      domain = os.environ["DOMAIN"].strip().lower().rstrip(".")
      approved = sorted({item.strip().lower().rstrip(".") for item in os.environ["APPROVED_ISSUERS"].split(",") if item.strip()})
      include_wildcard = os.environ.get("INCLUDE_WILDCARD_POLICY", "true").lower() == "true"
      require_caa = os.environ.get("REQUIRE_CAA_RECORDS", "false").lower() == "true"

      resolver = dns.resolver.Resolver()
      resolver.timeout = 3
      resolver.lifetime = 8
      lookup_attempts = []
      effective_owner = None
      records = []

      def text_field(value):
          if isinstance(value, bytes):
              return value.decode("utf-8", errors="replace")
          return str(value)

      query_name = domain

      while query_name:
          try:
              answer = resolver.resolve(query_name, "CAA", raise_on_no_answer=False)
              if answer.rrset:
                  effective_owner = query_name
                  for record in answer:
                      records.append({
                          "flags": int(record.flags),
                          "tag": text_field(record.tag).lower(),
                          "value": text_field(record.value).strip().strip('"'),
                          "ttl": int(answer.rrset.ttl),
                      })
                  break
              lookup_attempts.append({"name": query_name, "result": "NO_CAA_RRSET"})
          except dns.resolver.NXDOMAIN:
              lookup_attempts.append({"name": query_name, "result": "NXDOMAIN"})
          except dns.resolver.NoAnswer:
              lookup_attempts.append({"name": query_name, "result": "NO_ANSWER"})
          except (dns.resolver.NoNameservers, dns.exception.Timeout) as exc:
              raise RuntimeError(f"DNS CAA lookup failed for {query_name}: {type(exc).__name__}") from exc
          labels = query_name.split(".")
          query_name = ".".join(labels[1:]) if len(labels) > 1 else ""

      findings = []
      def add(code, severity, message):
          findings.append({"code": code, "severity": severity, "message": message})

      issue_values = [record["value"] for record in records if record["tag"] == "issue"]
      issuewild_values = [record["value"] for record in records if record["tag"] == "issuewild"]
      iodef_values = [record["value"] for record in records if record["tag"] == "iodef"]

      def issuer_from_value(value):
          issuer = value.strip().split(";", 1)[0].strip().lower().rstrip(".")
          return issuer

      def check_authorities(values, label):
          authorities = []
          explicit_deny = False
          for value in values:
              issuer = issuer_from_value(value)
              if not issuer:
                  explicit_deny = True
              else:
                  authorities.append(issuer)
          unexpected = sorted(set(authorities) - set(approved))
          if unexpected:
              add(f"UNAPPROVED_{label.upper()}_ISSUER", "BLOCK",
                  f"{label} CAA permits issuer(s) outside the allowlist: " + ", ".join(unexpected))
          if explicit_deny:
              add(f"{label.upper()}_ISSUANCE_DENIED", "WARN",
                  f"{label} CAA includes an empty issuer value that explicitly denies issuance for this certificate type.")
          return sorted(set(authorities)), unexpected, explicit_deny

      normal_authorities, normal_unapproved, ordinary_denied = [], [], False
      wildcard_authorities, wildcard_unapproved, wildcard_denied = [], [], False
      wildcard_source = "not_checked"

      if not records:
          if require_caa:
              add("CAA_POLICY_MISSING", "BLOCK", f"No CAA policy was found for {domain} or its queried DNS ancestors.")
          else:
              add("CAA_POLICY_MISSING", "WARN", f"No CAA policy was found for {domain} or its queried DNS ancestors; discovery mode does not block.")
      else:
          if not issue_values:
              add("ISSUE_TAG_MISSING", "BLOCK", "The effective CAA record set has no issue tag authorizing ordinary certificate issuance.")
          else:
              normal_authorities, normal_unapproved, ordinary_denied = check_authorities(issue_values, "issue")
          if include_wildcard:
              if issuewild_values:
                  wildcard_authorities, wildcard_unapproved, wildcard_denied = check_authorities(issuewild_values, "issuewild")
                  wildcard_source = "issuewild"
              else:
                  wildcard_authorities = normal_authorities
                  wildcard_unapproved = normal_unapproved
                  wildcard_denied = ordinary_denied
                  wildcard_source = "issue_inherited"

      blocking = [item for item in findings if item["severity"] == "BLOCK"]
      warnings = [item for item in findings if item["severity"] == "WARN"]
      verdict = "FAIL" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "queriedDomain": domain,
          "effectivePolicyOwner": effective_owner,
          "lookupAttempts": lookup_attempts,
          "records": records,
          "approvedIssuers": approved,
          "issueAuthorities": normal_authorities,
          "unapprovedIssueAuthorities": normal_unapproved,
          "issuewildAuthorities": wildcard_authorities,
          "unapprovedIssuewildAuthorities": wildcard_unapproved,
          "wildcardPolicySource": wildcard_source,
          "iodefContacts": iodef_values,
          "requireCaaRecords": require_caa,
          "includeWildcardPolicy": include_wildcard,
          "findings": findings,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "scopeNote": "This audits the effective DNS CAA record set using an ancestor search and explicit issuer allowlist. It does not test certificate issuance with a CA or prove that changes to DNS were approved.",
      }
      with open("caa-policy-audit.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)

      print(f"DNS CAA policy audit: {domain} effective_owner={effective_owner or 'none'} verdict={verdict}; issue={normal_authorities}, issuewild={wildcard_authorities}, blocking={len(blocking)}, warnings={len(warnings)}")
      Kestra.outputs({
          "domain": domain,
          "effective_policy_owner": effective_owner or "",
          "record_count": len(records),
          "issue_authorities": normal_authorities,
          "unapproved_issue_authorities": normal_unapproved,
          "issuewild_authorities": wildcard_authorities,
          "unapproved_issuewild_authorities": wildcard_unapproved,
          "iodef_contacts": iodef_values,
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "verdict": verdict,
          "findings": findings,
      })

  - id: optionally_archive_report
    type: io.kestra.plugin.core.flow.If
    description: Optionally archive the CAA policy report in S3 under an execution-specific key.
    condition: "{{ inputs.archive_report }}"
    then:
      - id: upload_caa_audit
        type: io.kestra.plugin.aws.s3.Upload
        description: Store DNS policy evidence without exposing credentials or private repository content.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ inputs.aws_region }}"
        bucket: "{{ inputs.evidence_bucket }}"
        from: "{{ outputs.lookup_effective_caa_policy.outputFiles['caa-policy-audit.json'] }}"
        key: "{{ inputs.evidence_prefix }}/{{ execution.id }}/caa-policy-audit.json"

  - id: enforce_caa_policy
    type: io.kestra.plugin.core.flow.If
    description: Fail closed when an issuer is outside the allowlist or required CAA data is missing.
    condition: "{{ outputs.lookup_effective_caa_policy.vars.verdict == 'FAIL' }}"
    then:
      - id: alert_caa_policy_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Send the queried domain, effective policy owner, unexpected authorities and findings to the security team.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |-
          {{
            {
              "text": ":rotating_light: DNS CAA policy failed\nDomain: " ~ outputs.lookup_effective_caa_policy.vars.domain ~
                "\nEffective policy owner: " ~ outputs.lookup_effective_caa_policy.vars.effective_policy_owner ~
                "\nUnapproved issuers: " ~ (outputs.lookup_effective_caa_policy.vars.unapproved_issue_authorities | toJson) ~
                "\nFindings: " ~ (outputs.lookup_effective_caa_policy.vars.findings | toJson) ~
                "\nExecution: " ~ execution.id ~
                "\nReview caa-policy-audit.json before issuing certificates."
            } | toJson
          }}
      - id: fail_caa_policy_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Stop downstream release steps when DNS policy does not meet the configured issuer allowlist.
        errorMessage: "DNS CAA policy failed for {{ outputs.lookup_effective_caa_policy.vars.domain }}. Review caa-policy-audit.json."
    else:
      - id: log_caa_policy_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "DNS CAA policy {{ outputs.lookup_effective_caa_policy.vars.verdict }} for {{ outputs.lookup_effective_caa_policy.vars.domain }}; effective owner={{ outputs.lookup_effective_caa_policy.vars.effective_policy_owner }}."

errors:
  - id: alert_caa_audit_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when DNS resolution, CAA parsing or orchestration fails. Technical failure must not be treated as a passing policy.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |-
      {{
        {
          "text": ":warning: DNS CAA audit execution failed\nDomain: " ~ inputs.domain ~
            "\nExecution: " ~ execution.id ~
            "\nInspect Kestra task logs; do not assume this DNS policy passed."
        } | toJson
      }}

extend:
  title: DNS CAA Certificate Issuer Authorization Gate
  metaTitle: DNS CAA Certificate Issuer Authorization Gate | Kestra
  shortDescription: Audit effective DNS CAA records and fail on certificate authorities outside an explicit allowlist, with separate wildcard policy checks.
  metaDescription: Audit DNS CAA issue and issuewild authorities against an allowlist, record the effective policy owner and block unauthorized certificate issuers.
  description: |
    Audit the effective DNS Certification Authority Authorization policy for a hostname before certificate issuance or release. The workflow queries the hostname and parent names, stops at the first applicable non-empty CAA record set, evaluates ordinary and wildcard issuer properties against an explicit allowlist, and emits machine-readable evidence. Missing CAA can be either a warning or a blocking policy. The flow alerts Slack on a policy violation and optionally retains a JSON report in S3.

    ## How it works

    1. The validation task checks the hostname and issuer allowlist before DNS access.
    2. The CAA lookup queries the hostname, then parent labels until it finds an applicable CAA record set or exhausts the hierarchy.
    3. The task records issue, issuewild and iodef values, evaluates issuer allowlists, and handles wildcard policy separately when requested.
    4. It writes caa-policy-audit.json with DNS lookup attempts, the effective owner, findings and verdict.
    5. The optional S3 branch stores evidence. The policy If alerts and fails for unapproved authorities or missing required CAA data.

    ## What you get

    - The exact CAA owner whose record set was evaluated and the records found there.
    - Separate ordinary and wildcard issuer comparisons against the approved allowlist.
    - Fail-closed handling for unapproved issuers and optional enforcement of an explicit policy.
    - A JSON report for audit trails and optional S3 retention.

    ## Who it's for

    - Security and platform teams who control certificate issuance for public domains.
    - SREs reviewing DNS changes before renewing or onboarding domains.
    - Compliance teams who need a repeatable evidence trail of authorized certificate issuers.

    ## Why orchestrate this with Kestra

    Kestra makes the issuer policy explicit, records each DNS audit, schedules rechecks and routes violations to a security alert and a failing task that downstream release workflows can depend on.

    ## Prerequisites

    - A Kestra 2.x worker with Docker enabled for Python Script tasks.
    - Network access from the worker container to public DNS resolvers.
    - A Slack incoming webhook for policy-failure and execution-error alerts.
    - An S3 bucket and write-capable AWS credentials only when optional report archival is enabled.

    ### Secrets

    - SLACK_WEBHOOK_URL: Slack incoming webhook used for policy failures and execution errors.
    - AWS_ACCESS_KEY_ID: optional AWS access key used only when S3 archival is enabled.
    - AWS_SECRET_ACCESS_KEY: optional AWS secret key used only when S3 archival is enabled.

    ## Quick start

    1. Import the flow with domain=test.github.io and inspect the DNS records returned by the default run.
    2. Review the authoritative CAA owner and set approved_issuers to authorities explicitly permitted by your organization's certificate policy.
    3. Enable require_caa_records when the domain must have an explicit policy; keep it disabled only for inventory discovery.
    4. Set include_wildcard_policy according to whether wildcard issuance needs a separately reviewed policy.
    5. Configure SLACK_WEBHOOK_URL before relying on blocking alerts, then enable the weekly trigger after reviewing the first report.

    ## How to extend

    - Add a versioned organization policy file that maps each business domain to an approved issuer set.
    - Compare observed CAA records to an approved change ticket or prior successful snapshot.
    - Route newly observed issue, issuewild or iodef changes to an approval flow.
    - Add certificate-transparency checks to compare recent issuers with published DNS policy.

    ## Links

    - [RFC 8659: DNS Certification Authority Authorization](https://www.rfc-editor.org/rfc/rfc8659)
    - [dnspython documentation](https://dnspython.readthedocs.io/en/stable/)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack/slackincomingwebhook)
    - [Kestra AWS S3 plugin](https://kestra.io/plugins/plugin-aws/s3)
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
