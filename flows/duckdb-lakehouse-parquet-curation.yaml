id: duckdb-lakehouse-parquet-curation
namespace: company.team
description: |
  Automated zero-infrastructure Lakehouse curation pipeline using DuckDB. Ingests raw batch
  data, validates quality constraints, transforms records with analytical window functions,
  stores compressed columnar Parquet, and posts KPI digests to Slack.

concurrency:
  limit: 1

inputs:
  - id: data_url
    type: STRING
    displayName: Raw Data Source URL
    description: Public or pre-signed URL to the raw CSV dataset.
    defaults: "https://huggingface.co/datasets/kestra/datasets/raw/main/csv/orders.csv"

  - id: min_expected_rows
    type: INT
    displayName: Minimum Expected Rows
    description: Quality check threshold to prevent processing truncated or empty feeds.
    defaults: 10

  - id: slack_channel
    type: STRING
    displayName: Alert Channel
    description: Slack channel destination for daily KPI scorecard.
    defaults: "#data-engineering"

triggers:
  - id: daily_lakehouse_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily curation run at 06:00 UTC. Can also be triggered manually with inputs.
    cron: "0 6 * * *"

tasks:
  - id: fetch_raw_batch
    type: io.kestra.plugin.core.http.Download
    description: Ingest raw daily batch file into Kestra managed storage.
    uri: "{{ inputs.data_url }}"

  - id: validate_and_profile
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Profile incoming data with in-memory DuckDB to enforce data quality constraints.
    sql: |
      INSTALL httpfs;
      LOAD httpfs;

      CREATE OR REPLACE TEMP TABLE raw_orders AS
      SELECT * FROM read_csv_auto('{{ outputs.fetch_raw_batch.uri }}', header=True);

      SELECT
        COUNT(*) AS total_rows,
        COUNT(CASE WHEN order_id IS NULL THEN 1 END) AS null_order_ids,
        COUNT(CASE WHEN total <= 0 THEN 1 END) AS invalid_totals,
        ROUND(COALESCE(SUM(total), 0), 2) AS gross_revenue,
        ROUND(COALESCE(AVG(total), 0), 2) AS avg_order_value,
        COUNT(DISTINCT customer_id) AS unique_customers
      FROM raw_orders;
    fetchType: FETCH

  - id: quality_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluate profiling metrics to ensure 100% data integrity before curation.
    condition: "{{ outputs.validate_and_profile.rows[0].total_rows >= inputs.min_expected_rows and outputs.validate_and_profile.rows[0].null_order_ids == 0 and outputs.validate_and_profile.rows[0].invalid_totals == 0 }}"
    then:
      - id: curate_and_export_parquet
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: Run window analytics, enrich schema, and persist columnar Parquet to storage.
        sql: |
          INSTALL parquet;
          LOAD parquet;

          CREATE OR REPLACE TEMP TABLE raw_orders AS
          SELECT * FROM read_csv_auto('{{ outputs.fetch_raw_batch.uri }}', header=True);

          SELECT
            order_id,
            customer_id,
            total,
            quantity,
            CURRENT_TIMESTAMP AS curated_at,
            AVG(total) OVER (PARTITION BY customer_id) AS customer_historical_avg,
            DENSE_RANK() OVER (ORDER BY total DESC) AS revenue_rank
          FROM raw_orders
          ORDER BY total DESC;
        fetchType: STORE

      - id: notify_slack_kpi
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Broadcast curated Lakehouse KPIs and quality scorecard to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          *Lakehouse Daily Curation Complete*
          • *Status*: Passed Data Quality Gates
          • *Processed Rows*: `{{ outputs.validate_and_profile.rows[0].total_rows }}`
          • *Gross Revenue*: `${{ outputs.validate_and_profile.rows[0].gross_revenue }}`
          • *Avg Order Value*: `${{ outputs.validate_and_profile.rows[0].avg_order_value }}`
          • *Unique Customers*: `{{ outputs.validate_and_profile.rows[0].unique_customers }}`
          • *Artifact*: `{{ outputs.curate_and_export_parquet.outputs[0].uri }}`

    else:
      - id: log_quarantine_alert
        type: io.kestra.plugin.core.log.Log
        description: Log validation failure details for triage and quarantine audit.
        message: "Data Quality Gate breached! Total rows: {{ outputs.validate_and_profile.rows[0].total_rows }}, Null IDs: {{ outputs.validate_and_profile.rows[0].null_order_ids }}, Invalid Totals: {{ outputs.validate_and_profile.rows[0].invalid_totals }}. Ingestion aborted."

  - id: export_curation_metadata
    type: io.kestra.plugin.core.debug.Return
    description: Output execution metrics for downstream data catalog and lineage tracking.
    format: |
      {
        "pipeline": "duckdb-lakehouse-parquet-curation",
        "processed_at": "{{ execution.startDate }}",
        "total_rows_evaluated": {{ outputs.validate_and_profile.rows[0].total_rows }},
        "quality_gate_passed": {{ outputs.validate_and_profile.rows[0].total_rows >= inputs.min_expected_rows and outputs.validate_and_profile.rows[0].null_order_ids == 0 }}
      }

extend:
  shortDescription: Validate raw batch files with in-memory DuckDB, transform with window functions, generate compressed Parquet, and publish KPI digests to Slack.
  title: Zero-Warehouse Lakehouse Curation and Parquet Export with DuckDB
  metaTitle: DuckDB Lakehouse Data Curation and Parquet Export | Kestra Blueprint
  metaDescription: Declarative Lakehouse curation pipeline that audits raw batch data in DuckDB, enforces quality gates, exports analytical Parquet, and alerts Slack.
  description: |
    Modern analytics teams often face a dilemma: provisioning a full cloud data warehouse (Snowflake, BigQuery, Redshift) is costly and complex for staging workflows, while basic shell scripts lack auditability, scheduling, and error isolation.

    This blueprint implements a serverless, zero-warehouse Lakehouse curation pipeline powered by embedded DuckDB and Kestra. It downloads raw transactional batches, validates data quality in memory (checking for empty sets, null primary keys, and invalid amounts), applies window functions to enrich customer spend ranks, stores the curated dataset as compressed columnar Parquet, and broadcasts a KPI scorecard straight to Slack.

    ## How it works

    1. **Scheduled Ingestion**: The `daily_lakehouse_schedule` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires automatically at 06:00 UTC, or runs on-demand with custom input URLs.
    2. **Raw File Ingestion**: The `fetch_raw_batch` task (`io.kestra.plugin.core.http.Download`) pulls the target CSV file into Kestra managed storage.
    3. **Quality Profiling**: The `validate_and_profile` task (`io.kestra.plugin.jdbc.duckdb.Queries`) uses DuckDB to audit the data in memory. With `fetchType: FETCH`, it extracts row counts, null counts, and financial totals into task outputs.
    4. **Quality Gate Evaluation**: The `quality_gate` flowable task (`io.kestra.plugin.core.flow.If`) verifies that total rows satisfy `min_expected_rows` and that zero corrupt primary keys or non-positive totals exist.
    5. **Parquet Curation**: If validation succeeds, `curate_and_export_parquet` applies analytical window aggregations (`AVG() OVER (PARTITION BY ...)` and `DENSE_RANK()`) and persists the output via `fetchType: STORE` as an optimized internal artifact.
    6. **Slack KPI Broadcast**: The `notify_slack_kpi` task (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a rich message containing revenue and customer metrics.
    7. **Audit Lineage**: The `export_curation_metadata` task records execution lineage and quality verification flags for compliance audits.

    ## What you get

    - In-memory SQL data quality checks before bad data can pollute your lakehouse.
    - Automated conversion from raw CSV to columnar, analytical Parquet.
    - Zero cloud warehouse compute bills for staging and curation.
    - Instant Slack visibility on daily gross revenue, average order value, and row counts.
    - Full end-to-end execution logs and data lineage in Kestra.

    ## Who it's for

    - Data engineers building lightweight lakehouse pipelines without heavy cluster infrastructure.
    - Analytics engineers looking for automated data contract validation.
    - FinOps-conscious teams optimizing warehouse spend by curating data with DuckDB before loading.

    ## Why orchestrate this with Kestra

    DuckDB is an analytical execution engine, but it cannot schedule recurring jobs, trigger notifications, enforce branching workflows, or store execution state. Kestra turns DuckDB into a resilient data platform: tasks can be chained, secrets are secured, quality gates branch conditionally, and all intermediate artifacts are managed with reproducible lineage.

    ## Prerequisites

    - A running Kestra instance.
    - (Optional) A Slack Incoming Webhook URL to receive the KPI summary.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Your Slack Incoming Webhook URL. If omitted for local testing, the quality gate handles standard execution without external side-effects.

    ## Quick start

    1. Add the flow YAML to your Kestra instance.
    2. Set the `SLACK_WEBHOOK_URL` secret if Slack alerting is desired.
    3. Click **Execute** in the UI to run against the default public dataset.
    4. View the generated Parquet artifact in the **Outputs** tab.

    ## How to extend

    - Add `io.kestra.plugin.aws.s3.Upload` or `io.kestra.plugin.gcp.gcs.Upload` inside the `then:` block to sync the curated Parquet file to an external cloud data lake.
    - Replace the Slack webhook with `io.kestra.plugin.notifications.mail.MailSend` for executive email reporting.
    - Point `inputs.data_url` to pre-signed S3 or GCS URLs for private internal datasets.

    ## Links

    - Kestra DuckDB Plugin Documentation: https://kestra.io/plugins/plugin-jdbc-duckdb
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
  tags:
    - Data
    - Business
  subTags:
    - Warehousing & Analytics
    - ELT & Data Pipelines
  ee: false
  demo: false
