id: greptimedb-storage-compaction-and-health-sentinel
namespace: company.team

description: |
  Probes GreptimeDB cluster health and table inventory over HTTP, classifies instance availability, alerts Slack upon degraded states, and enables guarded automated LSM-tree storage compaction.

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated GreptimeDB health and storage compaction audits every 15 minutes.
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      greptimedb_host: "greptimedb"
      greptimedb_http_port: 4000
      database: "public"
      target_table: ""
      min_expected_tables: 1
      auto_compact: "false"
      dry_run: "true"

inputs:
  - id: greptimedb_host
    type: STRING
    displayName: GreptimeDB Hostname
    description: Hostname or IP address of the GreptimeDB standalone or frontend instance reachable by Kestra.
    defaults: "greptimedb"

  - id: greptimedb_http_port
    type: INT
    displayName: GreptimeDB HTTP Port
    description: GreptimeDB HTTP service port for /health and /v1/sql administrative endpoints.
    defaults: 4000

  - id: database
    type: STRING
    displayName: GreptimeDB Database Name
    description: Name of the GreptimeDB database to inspect and monitor.
    defaults: "public"

  - id: target_table
    type: STRING
    displayName: Target Table Name
    description: Specific table to target for automated compaction maintenance. If empty, compaction tasks are skipped.
    defaults: ""
    required: false

  - id: min_expected_tables
    type: INT
    displayName: Minimum Expected Tables
    description: Threshold of active user tables below which a WARNING alert is dispatched. Set to 0 to disable table inventory gating.
    defaults: 1

  - id: auto_compact
    type: SELECT
    displayName: Enable Auto Compaction
    description: When true and a target table is specified, triggers regular LSM-tree storage compaction via ADMIN COMPACT_TABLE.
    values:
      - "true"
      - "false"
    defaults: "false"

  - id: dry_run
    type: SELECT
    displayName: Dry Run Toggle
    description: When true, safe remediation only logs the planned ADMIN COMPACT_TABLE command without mutating storage.
    values:
      - "true"
      - "false"
    defaults: "true"

tasks:
  - id: probe_greptimedb_health
    type: io.kestra.plugin.core.http.Request
    description: Queries GreptimeDB /health endpoint to verify HTTP service availability and process vitality.
    uri: "http://{{ inputs.greptimedb_host }}:{{ inputs.greptimedb_http_port }}/health"
    method: GET
    options:
      allowFailed: true
    allowFailure: true

  - id: probe_table_inventory
    type: io.kestra.plugin.core.http.Request
    description: Queries information_schema.tables over the GreptimeDB /v1/sql interface to inspect registered tables and storage engines.
    uri: "http://{{ inputs.greptimedb_host }}:{{ inputs.greptimedb_http_port }}/v1/sql?db={{ inputs.database }}"
    method: POST
    headers:
      Content-Type: "application/x-www-form-urlencoded"
    formData:
      sql: "SELECT table_name, engine FROM information_schema.tables WHERE table_schema = '{{ inputs.database }}' ORDER BY table_name;"
    options:
      allowFailed: true
    allowFailure: true

  - id: classify_health_status
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates HTTP status codes and table query results to classify the node as HEALTHY, WARNING, CRITICAL, or NODE_UNREACHABLE.
    format: "{{ (outputs.probe_greptimedb_health.code is not defined or outputs.probe_greptimedb_health.code != 200) ? 'NODE_UNREACHABLE' : ( (outputs.probe_table_inventory.code is not defined or outputs.probe_table_inventory.code != 200) ? 'CRITICAL' : ( ((outputs.probe_table_inventory.body | json | jq('.output[0].records.rows | length') | first) < inputs.min_expected_tables) ? 'WARNING' : 'HEALTHY' ) ) }}"

  - id: route_by_health_status
    type: io.kestra.plugin.core.flow.Switch
    description: Routes workflow execution based on the health classification result.
    value: "{{ outputs.classify_health_status.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy_state
          type: io.kestra.plugin.core.log.Log
          message: "GreptimeDB on {{ inputs.greptimedb_host }}:{{ inputs.greptimedb_http_port }} is HEALTHY. Database '{{ inputs.database }}' contains {{ outputs.probe_table_inventory.body | json | jq('.output[0].records.rows | length') | first }} table(s). Query execution: {{ outputs.probe_table_inventory.body | json | jq('.execution_time_ms') | first }}ms."

      "WARNING":
        - id: alert_warning_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "GreptimeDB Sentinel WARNING on " ~ inputs.greptimedb_host ~ ":" ~ inputs.greptimedb_http_port ~ ". Found " ~ (outputs.probe_table_inventory.body | json | jq('.output[0].records.rows | length') | first) ~ " table(s) in database '" ~ inputs.database ~ "', below minimum expected threshold of " ~ inputs.min_expected_tables ~ ". Execution: " ~ execution.id ~ "."} | toJson }}

        - id: check_auto_compaction
          type: io.kestra.plugin.core.flow.If
          description: Gates automated table compaction behind the auto_compact input toggle.
          condition: "{{ inputs.auto_compact == 'true' and inputs.target_table != '' }}"
          then:
            - id: evaluate_dry_run
              type: io.kestra.plugin.core.flow.If
              description: Prevents accidental storage mutations when dry_run is active.
              condition: "{{ inputs.dry_run == 'false' }}"
              then:
                - id: execute_admin_compact
                  type: io.kestra.plugin.core.http.Request
                  description: Triggers regular LSM-tree compaction for the target table via the GreptimeDB SQL HTTP API.
                  uri: "http://{{ inputs.greptimedb_host }}:{{ inputs.greptimedb_http_port }}/v1/sql?db={{ inputs.database }}"
                  method: POST
                  headers:
                    Content-Type: "application/x-www-form-urlencoded"
                  formData:
                    sql: "ADMIN COMPACT_TABLE('{{ inputs.target_table }}', 'regular');"
                  options:
                    allowFailed: true
              else:
                - id: log_compaction_dry_run
                  type: io.kestra.plugin.core.log.Log
                  message: "[DRY-RUN] Would execute: ADMIN COMPACT_TABLE('{{ inputs.target_table }}', 'regular') on database '{{ inputs.database }}'."

      "CRITICAL":
        - id: alert_critical_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "GreptimeDB Sentinel CRITICAL on " ~ inputs.greptimedb_host ~ ":" ~ inputs.greptimedb_http_port ~ ". HTTP health check passed but /v1/sql query failed with HTTP " ~ outputs.probe_table_inventory.code ~ ". Execution: " ~ execution.id ~ "."} | toJson }}

      "NODE_UNREACHABLE":
        - id: alert_unreachable_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "GreptimeDB Sentinel NODE_UNREACHABLE. Cannot reach http://" ~ inputs.greptimedb_host ~ ":" ~ inputs.greptimedb_http_port ~ "/health. Service may be offline or network partitioned. Execution: " ~ execution.id ~ "."} | toJson }}

  - id: log_audit_summary
    type: io.kestra.plugin.core.output.OutputValues
    description: Exports structured telemetry and audit attributes for reporting and downstream orchestration.
    values:
      health_status: "{{ outputs.classify_health_status.value }}"
      database: "{{ inputs.database }}"
      target_table: "{{ inputs.target_table }}"
      auto_compact_enabled: "{{ inputs.auto_compact }}"
      dry_run_enabled: "{{ inputs.dry_run }}"

errors:
  - id: alert_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Sends an alert notification if an unexpected exception halts sentinel execution.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {"text": "GreptimeDB Sentinel workflow error during execution " ~ execution.id ~ " in namespace " ~ flow.namespace ~ "."} | toJson }}

extend:
  title: GreptimeDB Storage Compaction and Ingestion Health Sentinel
  metaTitle: GreptimeDB Storage Compaction & Ingestion Health Sentinel | Kestra
  shortDescription: Continuous health probing, table inventory auditing, and guarded LSM-tree compaction for GreptimeDB time-series clusters.
  metaDescription: Audit GreptimeDB time-series database health, monitor table inventory, classify node status, and trigger automated LSM-tree storage compaction via Kestra.
  description: |
    Continuously audits GreptimeDB time-series clusters by probing administrative health endpoints, verifying table inventory across information schemas, classifying node availability, alerting engineering teams on Slack, and orchestrating guarded storage compaction.

    ## How it works

    1. `probe_greptimedb_health` issues an HTTP GET probe against `/health` to verify that the GreptimeDB HTTP server and runtime loops are operational.
    2. `probe_table_inventory` queries `information_schema.tables` via the `/v1/sql` HTTP endpoint, extracting active table counts and storage engines.
    3. `classify_health_status` evaluates response codes and table metrics through a Pebble conditional expression, categorizing the cluster into `HEALTHY`, `WARNING`, `CRITICAL`, or `NODE_UNREACHABLE`.
    4. `route_by_health_status` switches execution based on classification:
       - `HEALTHY`: Logs database metrics, total active tables, and SQL query execution latency.
       - `WARNING`: Dispatches a Slack notification warning of table count anomalies, and if enabled, delegates to safe table compaction.
       - `CRITICAL`: Alerts on-call engineers via Slack that `/v1/sql` queries are failing despite a reachable process.
       - `NODE_UNREACHABLE`: Notifies operations that GreptimeDB HTTP port 4000 is down or experiencing network partitions.
    5. `check_auto_compaction` evaluates `auto_compact` and `dry_run` inputs. When enabled with `dry_run: false`, it issues `ADMIN COMPACT_TABLE('<target_table>', 'regular')` to merge fragmented SST files and purge expired rows.
    6. `log_audit_summary` produces structured outputs capturing health classifications and execution parameters for compliance tracking.
    7. `errors` captures unexpected task exceptions and posts a high-priority incident notice to Slack.

    ## What you get

    - Automated, scheduled validation of GreptimeDB cluster availability without requiring third-party monitoring agents.
    - Early detection of table schema drift, unexpected table drops, or query execution timeouts.
    - Zero-dependency administrative compaction execution to prevent SST file fragmentation, high read amplification, and storage bloat.
    - Guarded remediation architecture pairing `auto_compact` with a mandatory `dry_run` safety latch.
    - Instant Slack incident notifications containing exact execution IDs and diagnostic context.

    ## Who it's for

    - Platform Engineers and Site Reliability Engineers managing GreptimeDB deployments in production.
    - Time-series and IoT Data Engineers ingesting high-throughput metrics and telemetry into GreptimeDB.
    - Database Administrators seeking automated Day-2 maintenance, compaction schedules, and health alerting.

    ## Why orchestrate this with Kestra

    Time-series databases like GreptimeDB continuously ingest high-velocity data, causing rapid accumulation of uncompacted SST files and MemTable flushes. Running unmanaged cron scripts to monitor health or trigger maintenance lacks observability, centralized secret management, retry mechanisms, and auditable history. Kestra provides declarative, reproducible orchestration with built-in scheduling, granular failure alerts, dynamic parameterization, and stateful tracking across all cluster nodes.

    ## Prerequisites

    - A running GreptimeDB instance (standalone or distributed cluster) with HTTP port 4000 accessible from the Kestra worker.
    - An incoming Slack webhook URL for alert routing.

    ### Secrets

    - `SLACK_WEBHOOK`: Incoming Slack webhook URL used by `alert_warning_slack`, `alert_critical_slack`, `alert_unreachable_slack`, and the `errors` handler.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK` secret within your Kestra namespace or environment variables.
    2. Start a local GreptimeDB instance with Docker:
       ```bash
       docker run -d --name greptimedb -p 4000:4000 greptime/greptimedb:latest standalone start
       ```
    3. Execute this flow manually in Kestra with `dry_run: true` to verify connectivity against `greptimedb:4000` (or `localhost:4000`).
    4. Provide a `target_table` name (e.g., `cpu_metrics`) and set `auto_compact: true` with `dry_run: false` to test automated compaction.
    5. Enable the `every_15_minutes` trigger to automate continuous health monitoring and maintenance.

    ## How to extend

    - Add a preliminary task using `io.kestra.plugin.scripts.shell.Commands` to scrape `/metrics` and alert on write amplification or disk queue depth.
    - Extend compaction routing to iterate dynamically over multiple high-throughput tables using `io.kestra.plugin.core.flow.Loop`.
    - Route critical alerts to PagerDuty or Opsgenie using dedicated Kestra notification plugins.
    - Integrate downstream dbt or SQL transforms that run immediately after compaction confirms table optimization.

    ## Links

    - [GreptimeDB Documentation](https://docs.greptime.com/)
    - [GreptimeDB HTTP SQL API Reference](https://docs.greptime.com/reference/sql/http-api/)
    - [GreptimeDB Compaction Architecture](https://docs.greptime.com/user-guide/table-operations/compaction/)
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Database
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
