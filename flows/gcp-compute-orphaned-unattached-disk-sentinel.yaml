id: gcp-compute-orphaned-unattached-disk-sentinel
namespace: company.cloud

inputs:
  - id: project_id
    type: STRING
    description: Google Cloud Project ID to scan.
  - id: max_orphaned_disks_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of detached persistent disks before alerting.

tasks:
  - id: scan_unattached_disks
    type: io.kestra.plugin.gcp.cli.GCloudCLI
    projectId: "{{ inputs.project_id }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    commands:
      - |
        gcloud compute disks list \
          --filter="-users:*" \
          --format=json > /tmp/unattached_disks.json
        
        ORPHANED_COUNT=$(jq '. | length // 0' /tmp/unattached_disks.json)
        TOTAL_GB=$(jq '[.[].sizeGb | tonumber] | add // 0' /tmp/unattached_disks.json)
        
        echo "::set-output name=orphaned_count::$ORPHANED_COUNT::"
        echo "::set-output name=total_gb::$TOTAL_GB::"

  - id: evaluate_orphaned_storage
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_unattached_disks.vars.orphaned_count | int > inputs.max_orphaned_disks_threshold }}"
    then:
      - id: notify_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#finops-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "💰 GCP Orphaned Persistent Disks Detected",
                "text": "Project `{{ inputs.project_id }}` has *{{ outputs.scan_unattached_disks.vars.orphaned_count }}* detached persistent disks consuming *{{ outputs.scan_unattached_disks.vars.total_gb }} GB* of unattached storage! Impact: Detached SSD and standard persistent disks continue incurring full monthly gigabyte billing even when their parent VM instances are terminated.",
                "footer": "Kestra FinOps Sentinel • Google Compute Engine"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#finops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Google Cloud Compute Engine Orphaned Persistent Disk Sentinel Pipeline Failure",
            "text": "Failed to scan Google Compute Engine disks. Verify IAM permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      project_id: replace-with-your-project-id

extend:
  metaDescription: "Scans Google Cloud Compute Engine persistent disks to detect unattached orphaned storage volumes wasting cloud budget."
  metaTitle: Google Cloud Compute Engine Orphaned Persistent Disk Sentinel with Kestra
  title: Google Cloud Compute Engine Orphaned Persistent Disk Sentinel
  shortDescription: Scans Google Cloud Compute Engine persistent disks to detect unattached orphaned storage volumes wasting cloud budget.
  description: |
    ## How it works
    This workflow executes `gcloud compute disks list --filter="-users:*"` to identify persistent disks that have no attached VM instances. In Google Cloud, deleting a Compute Engine VM instance leaves attached persistent disks intact unless `autoDelete: true` was explicitly enabled. Over time, orphaned SSD/HDD disks accumulate silently, consuming significant monthly cloud spend without serving any compute workloads. Slack is alerted with the unattached volume count and total gigabytes.

    ## What you get
    - Continuous FinOps audit of detached Google Compute Engine persistent disks.
    - Prevents cloud waste from forgotten storage volumes after VM decommissionings.
    - Instant visibility into total orphaned gigabytes across zones.

    ## Who it's for
    - FinOps Practitioners and Cloud Cost Management Engineers.
    - Infrastructure Architects managing Google Cloud compute environments.

    ## Why orchestrate this with Kestra
    - **Native GCloud Filtering**: Scans multi-zone persistent disks across the entire project.
    - **Continuous Cost Reclamation**: Schedule regular weekly or daily audits.
    - **Actionable Inventory**: Provides precise counts and gigabyte volumes for cleanup.

    ## Prerequisites
    - Google Cloud project with Compute Engine API enabled.
    - Secrets `GCP_SERVICE_ACCOUNT` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure project ID.
    3. Run the workflow to discover orphaned persistent disks.

    ## How to extend
    - Automatically snapshot and delete detached disks idle for over 30 days.
    - Filter by disk labels to exclude backup cold-storage disks.

    ## Links
    - [Google Compute Engine Persistent Disks Documentation](https://cloud.google.com/compute/docs/disks)
    - [Kestra GCloud Plugin](https://kestra.io/plugins/plugin-gcp/io.kestra.plugin.gcp.gcloud.gcloudcli)
  tags:
    - Cloud
    - Business
  subTags:
    - GCP Services
    - Infrastructure Automation
  ee: false
  verified: false
  demo: false
