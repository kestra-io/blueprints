id: postgres-temp-files-disk-spill-sentinel
namespace: company.database

inputs:
  - id: db_host
    type: STRING
    defaults: "postgres.internal"
    description: PostgreSQL database server hostname or IP.
  - id: db_port
    type: INT
    defaults: 5432
    description: PostgreSQL server port.
  - id: db_name
    type: STRING
    defaults: "postgres"
    description: PostgreSQL database name.
  - id: db_user
    type: STRING
    defaults: "postgres"
    description: PostgreSQL administrative user.
  - id: temp_bytes_threshold
    type: LONG
    defaults: 10737418240
    description: Maximum acceptable cumulative temporary file bytes spilled to disk (default 10GB).

tasks:
  - id: query_temp_file_spill
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.db_host }}:{{ inputs.db_port }}/{{ inputs.db_name }}"
    username: "{{ inputs.db_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
          datname,
          temp_files,
          temp_bytes,
          pg_size_pretty(temp_bytes) AS temp_size_pretty
      FROM pg_stat_database
      WHERE temp_bytes > {{ inputs.temp_bytes_threshold }}
        AND datname NOT IN ('template0', 'template1')
      ORDER BY temp_bytes DESC;
    fetchType: FETCH

  - id: evaluate_temp_spill
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_temp_file_spill.rows | length > 0 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ PostgreSQL Large Temporary Files Disk Spill Alert",
                "text": "Detected *{{ outputs.query_temp_file_spill.rows | length }}* database(s) exceeding temporary file disk spill threshold *{{ inputs.temp_bytes_threshold }} bytes*. Databases: {{ outputs.query_temp_file_spill.rows }}. Root Cause: Heavy sort, hash join, or materialization operations are exceeding `work_mem` and spilling large temporary data to disk, causing severe storage I/O thrashing.",
                "footer": "Kestra Database Sentinel • Postgres Temp Files"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Postgres Temp Spill Sentinel Execution Error",
            "text": "The PostgreSQL temporary file spill query failed. Please verify database connectivity and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: PostgreSQL Query Temporary Files Disk Spill and work_mem Sentinel
  shortDescription: Audits PostgreSQL database statistics to detect queries spilling excessive temporary files to disk due to work_mem starvation.
  description: |
    ## How it works
    This workflow uses the native Kestra PostgreSQL JDBC plugin to query `pg_stat_database` and inspect cumulative `temp_files` and `temp_bytes`. When complex analytical queries, unindexed sorts, or large hash aggregations exceed configured `work_mem`, PostgreSQL spills temporary files to local storage. When disk spill volumes exceed the defined threshold, an automated alert is routed to the database team via Slack.

    ## What you get
    - Proactive visibility into memory-starved queries thrashing disk I/O.
    - Prevents sudden storage disk space exhaustion in cloud databases (RDS, Aurora, Cloud SQL).
    - Pinpoints specific application databases requiring query tuning or `work_mem` adjustments.

    ## Who it's for
    - Database Administrators (DBAs) and SREs optimizing relational database performance.
    - Data Engineers and Backend Developers running complex SQL reporting queries.

    ## Why orchestrate this with Kestra
    - **Native JDBC Driver**: Connects directly via standard PostgreSQL JDBC driver with zero local dependency headaches.
    - **Automated Scheduling**: Sample storage metrics hourly without manual intervention.
    - **Actionable Alerting**: Rich Slack notifications provide exact byte sizes and database names.

    ## Prerequisites
    - PostgreSQL database credentials with read access to `pg_stat_database`.
    - Secrets `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure connection parameters and password secret.
    3. Run the workflow to inspect temporary file generation across databases.

    ## How to extend
    - Query `pg_stat_statements` to identify the specific top queries generating temporary files.
    - Correlate with AWS RDS FreeStorageSpace metrics.

    ## Links
    - [PostgreSQL Database Statistics](https://www.postgresql.org/docs/current/monitoring-stats.html#PG-STAT-DATABASE-VIEW)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
