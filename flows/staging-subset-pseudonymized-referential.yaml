id: staging-subset-pseudonymized-referential
namespace: company.team

inputs:
  - id: sample_pct
    type: INT
    displayName: Customer sample (%)
    description: Share of customers to keep. Every order, order item and ticket that belongs to them comes along, so the subset stays referentially complete.
    defaults: 10

  - id: scrub_free_text
    type: BOOL
    displayName: Scrub free text
    description: Replace emails and phone numbers inside ticket bodies with the same pseudonyms used in the customer table. Set it to false to watch the gate catch the raw PII that free text leaks.
    defaults: true

  - id: refresh_salt
    type: BOOL
    displayName: Rotate the pseudonym salt
    description: Generate a new secret salt. Every pseudonym changes, which breaks continuity with earlier staging copies on purpose.
    defaults: false

variables:
  salt_kv: staging_pseudonym_salt
  staging_prefix: staging/shop

tasks:
  - id: salt
    type: io.kestra.plugin.core.flow.If
    description: The salt is created once and kept in the KV store, so pseudonyms stay stable across refreshes but cannot be recomputed by someone who only knows the source values.
    condition: "{{ inputs.refresh_salt or kv(vars.salt_kv, errorOnMissing=false) is null }}"
    then:
      - id: new_salt
        type: io.kestra.plugin.core.kv.Set
        key: "{{ vars.salt_kv }}"
        value: "{{ uuid() }}{{ uuid() }}{{ id() }}"

  - id: subset_and_verify
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      Generate a production-like shop database, sample customers, follow foreign keys to keep
      their orders, items and tickets, replace personal data with keyed SHA-256 pseudonyms,
      then verify the result: no orphan rows, no raw personal value anywhere (free text
      included) and no pseudonym collisions. Writes each table as Parquet.
    outputFiles:
      - customers
      - orders
      - order_items
      - tickets
    fetchType: FETCH_ONE
    sql: |
      SELECT setseed(0.17);

      -- Production-like source. In real use, ATTACH your database here instead.
      CREATE TABLE src_customers AS
      SELECT i AS customer_id,
             (['Ana', 'Ben', 'Chloe', 'Dev', 'Elif', 'Femi', 'Gita', 'Hugo'])[1 + i % 8] || ' ' ||
             (['Ito', 'Khan', 'Lopez', 'Meyer', 'Nair', 'Okafor', 'Petrov'])[1 + (i * 7) % 7] AS full_name,
             'user' || i || '@' || (['gmail.com', 'outlook.com', 'acme.io'])[1 + i % 3] AS email,
             '+1-555-' || lpad(CAST(200 + (i * 37) % 9800 AS VARCHAR), 4, '0') AS phone,
             (['US', 'DE', 'IN', 'BR'])[1 + i % 4] AS country
      FROM range(1, 5001) t(i);
      CREATE TABLE src_orders AS
      SELECT o AS order_id, 1 + CAST(floor(random() * 5000) AS INTEGER) AS customer_id,
             TIMESTAMP '2026-01-01' + to_days(CAST(floor(random() * 270) AS INTEGER)) AS created_at
      FROM range(1, 20001) t(o);
      CREATE TABLE src_order_items AS
      SELECT order_id, 'SKU-' || CAST(1 + floor(random() * 300) AS INTEGER) AS sku,
             1 + CAST(floor(random() * 3) AS INTEGER) AS qty, round(5 + random() * 95, 2) AS price
      FROM src_orders, range(0, 3) t(n) WHERE random() < 0.7;
      CREATE TABLE src_tickets AS
      SELECT t AS ticket_id, o.customer_id, o.order_id,
             'Order ' || o.order_id || ' arrived damaged. Reach me at ' || c.email || ' or ' || c.phone || '.' AS body
      FROM range(1, 3001) r(t)
      JOIN src_orders o ON o.order_id = 1 + (t * 13) % 20000
      JOIN src_customers c ON c.customer_id = o.customer_id;

      -- Deterministic sample: a customer is in or out based on a keyed hash, not on random().
      CREATE TABLE keep AS
      SELECT customer_id FROM src_customers
      WHERE CAST('0x' || substr(sha256('{{ kv(vars.salt_kv) }}' || customer_id), 1, 8) AS BIGINT) % 100 < {{ inputs.sample_pct }};

      -- Pseudonym map, shared by every table and by the free-text scrub.
      CREATE TABLE pmap AS
      SELECT customer_id, email, phone,
             'c_' || substr(sha256('{{ kv(vars.salt_kv) }}|email|' || email), 1, 12) || '@example.invalid' AS p_email,
             -- 555-0100 to 555-0199 is the range reserved for fiction, so a pseudonym can never be someone's real number.
             '+1-555-01' || lpad(CAST(CAST('0x' || substr(sha256('{{ kv(vars.salt_kv) }}|phone|' || phone), 1, 6) AS BIGINT) % 100 AS VARCHAR), 2, '0') AS p_phone,
             'Customer ' || upper(substr(sha256('{{ kv(vars.salt_kv) }}|name|' || full_name || customer_id), 1, 6)) AS p_name
      FROM src_customers WHERE customer_id IN (SELECT customer_id FROM keep);

      CREATE TABLE customers AS
      SELECT c.customer_id, m.p_name AS full_name, m.p_email AS email, m.p_phone AS phone, c.country
      FROM src_customers c JOIN pmap m USING (customer_id);
      CREATE TABLE orders AS SELECT * FROM src_orders WHERE customer_id IN (SELECT customer_id FROM keep);
      CREATE TABLE order_items AS SELECT * FROM src_order_items WHERE order_id IN (SELECT order_id FROM orders);
      CREATE TABLE tickets AS
      SELECT t.ticket_id, t.customer_id, t.order_id,
             {% if inputs.scrub_free_text %}replace(replace(t.body, m.email, m.p_email), m.phone, m.p_phone){% else %}t.body{% endif %} AS body
      FROM src_tickets t JOIN pmap m USING (customer_id);

      COPY customers TO '{{ outputFiles.customers }}' (FORMAT PARQUET);
      COPY orders TO '{{ outputFiles.orders }}' (FORMAT PARQUET);
      COPY order_items TO '{{ outputFiles.order_items }}' (FORMAT PARQUET);
      COPY tickets TO '{{ outputFiles.tickets }}' (FORMAT PARQUET);

      SELECT
        (SELECT count(*) FROM customers) AS customers,
        (SELECT count(*) FROM orders) AS orders,
        (SELECT count(*) FROM order_items) AS order_items,
        (SELECT count(*) FROM tickets) AS tickets,
        (SELECT count(*) FROM orders WHERE customer_id NOT IN (SELECT customer_id FROM customers))
          + (SELECT count(*) FROM order_items WHERE order_id NOT IN (SELECT order_id FROM orders))
          + (SELECT count(*) FROM tickets WHERE order_id NOT IN (SELECT order_id FROM orders)
                                              OR customer_id NOT IN (SELECT customer_id FROM customers)) AS orphan_rows,
        (SELECT count(*) FROM customers c JOIN src_customers s
            ON c.email = s.email OR c.phone = s.phone OR c.full_name = s.full_name) AS raw_values_in_columns,
        (SELECT count(*) FROM tickets t, src_customers s
          WHERE t.customer_id = s.customer_id AND (contains(t.body, s.email) OR contains(t.body, s.phone))) AS raw_values_in_free_text,
        (SELECT count(*) - count(DISTINCT email) FROM customers) AS pseudonym_collisions,
        (SELECT count(*) FROM tickets t JOIN customers c USING (customer_id) WHERE contains(t.body, c.email)) AS tickets_matching_pseudonym;

  - id: verification
    type: io.kestra.plugin.core.output.OutputValues
    values:
      customers: "{{ (outputs.subset_and_verify.outputs | last).row.customers }}"
      orders: "{{ (outputs.subset_and_verify.outputs | last).row.orders }}"
      order_items: "{{ (outputs.subset_and_verify.outputs | last).row.order_items }}"
      tickets: "{{ (outputs.subset_and_verify.outputs | last).row.tickets }}"
      orphan_rows: "{{ (outputs.subset_and_verify.outputs | last).row.orphan_rows }}"
      raw_in_columns: "{{ (outputs.subset_and_verify.outputs | last).row.raw_values_in_columns }}"
      raw_in_free_text: "{{ (outputs.subset_and_verify.outputs | last).row.raw_values_in_free_text }}"
      collisions: "{{ (outputs.subset_and_verify.outputs | last).row.pseudonym_collisions }}"
      linked_tickets: "{{ (outputs.subset_and_verify.outputs | last).row.tickets_matching_pseudonym }}"

  - id: log_verification
    type: io.kestra.plugin.core.log.Log
    message: >-
      Subset: {{ outputs.verification.values.customers }} customers, {{ outputs.verification.values.orders }} orders,
      {{ outputs.verification.values.order_items }} items, {{ outputs.verification.values.tickets }} tickets.
      Orphan rows {{ outputs.verification.values.orphan_rows }}, raw personal values in columns {{ outputs.verification.values.raw_in_columns }},
      in ticket text {{ outputs.verification.values.raw_in_free_text }}, pseudonym collisions {{ outputs.verification.values.collisions }}.
      {{ outputs.verification.values.linked_tickets }} tickets still mention their customer's pseudonymized email, so joins across text survive.

  - id: release_gate
    type: io.kestra.plugin.core.flow.If
    description: Refresh staging only when the subset is complete, free of raw personal data and free of collisions.
    condition: >-
      {{ (outputs.verification.values.orphan_rows | number) == 0
      and (outputs.verification.values.raw_in_columns | number) == 0
      and (outputs.verification.values.raw_in_free_text | number) == 0
      and (outputs.verification.values.collisions | number) == 0
      and (outputs.verification.values.customers | number) > 0 }}
    then:
      - id: publish_staging
        type: io.kestra.plugin.core.namespace.UploadFiles
        description: Replace the staging copy. Point staging loaders or dbt seeds at these files.
        namespace: "{{ flow.namespace }}"
        filesMap:
          "{{ vars.staging_prefix }}/customers.parquet": "{{ outputs.subset_and_verify.outputFiles.customers }}"
          "{{ vars.staging_prefix }}/orders.parquet": "{{ outputs.subset_and_verify.outputFiles.orders }}"
          "{{ vars.staging_prefix }}/order_items.parquet": "{{ outputs.subset_and_verify.outputFiles.order_items }}"
          "{{ vars.staging_prefix }}/tickets.parquet": "{{ outputs.subset_and_verify.outputFiles.tickets }}"
    else:
      - id: block_refresh
        type: io.kestra.plugin.core.execution.Fail
        description: Staging keeps its previous copy. A subset with raw personal data must never leave production.
        errorMessage: >-
          Staging refresh blocked: {{ outputs.verification.values.orphan_rows }} orphan rows,
          {{ outputs.verification.values.raw_in_columns }} raw personal values in columns,
          {{ outputs.verification.values.raw_in_free_text }} in ticket text,
          {{ outputs.verification.values.collisions }} pseudonym collisions.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Refresh staging every Sunday night.
    cron: "0 1 * * 0"

extend:
  title: Refresh staging with a referentially complete, pseudonymized production subset
  metaTitle: Pseudonymized, referentially complete staging subset with Kestra and DuckDB
  shortDescription: Sample production customers, follow foreign keys to keep their orders, items and tickets, replace personal data with keyed pseudonyms, verify nothing leaked, then refresh staging.
  metaDescription: Build a staging copy from production with Kestra and DuckDB. Keep foreign keys intact, pseudonymize PII with a keyed hash, verify no raw value leaked.
  description: |
    Teams want staging data that behaves like production, but copying production leaks personal data, and random sampling breaks foreign keys: orders without customers, items without orders. This flow builds a **referentially complete** subset and replaces personal data with **keyed, deterministic pseudonyms**. It refreshes staging only after it has proved three things:
    - No orphan row in any table.
    - No raw personal value anywhere, including inside free text.
    - No pseudonym collisions.

    The same email gets the same pseudonym in the customer table and inside ticket bodies, so joins and searches still work in staging.

    It runs with no setup and no network. DuckDB generates a shop database of 5,000 customers, 20,000 orders, about 42,000 order items and 3,000 support tickets whose bodies quote the customer's email and phone, which is where pseudonymization usually misses. Run it with `scrub_free_text: false` to watch the gate block the refresh.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## How it works

    1. `salt` (`io.kestra.plugin.core.flow.If`) creates a secret salt in the KV store on the first run, or when `refresh_salt` is set. The salt keeps pseudonyms stable from one refresh to the next, while nobody can recompute them from the source values.
    2. `subset_and_verify` (`io.kestra.plugin.jdbc.duckdb.Queries`):
       - builds the source tables (replace them with `ATTACH` to your database),
       - keeps customers whose keyed SHA-256 bucket is under `sample_pct`. This is deterministic, unlike `random()`,
       - follows the foreign keys: their orders, then those orders' items, then their tickets,
       - pseudonymizes emails (`c_<hash>@example.invalid`), names (`Customer <HASH>`) and phones (the fictional `+1-555-01xx` range, so a pseudonym is never a real number),
       - replaces the original email and phone inside ticket bodies with the same pseudonyms,
       - writes each table to Parquet and returns one verification row.
    3. `verification` (`io.kestra.plugin.core.output.OutputValues`) and `log_verification` report the counts on every run.
    4. `release_gate` (`io.kestra.plugin.core.flow.If`):
       - Pass: `publish_staging` (`io.kestra.plugin.core.namespace.UploadFiles`) replaces `staging/shop/*.parquet`.
       - Fail: `block_refresh` (`io.kestra.plugin.core.execution.Fail`). Staging keeps its previous copy.
    5. `weekly` (`io.kestra.plugin.core.trigger.Schedule`) refreshes staging every Sunday.

    ## Inputs

    - `sample_pct` (INT, default `10`): share of customers to keep.
    - `scrub_free_text` (BOOL, default `true`).
    - `refresh_salt` (BOOL, default `false`): rotate the salt. Every pseudonym, and the sample itself, changes.

    ## Quick start

    | Run | Input | Result |
    |---|---|---|
    | 1 | defaults | Published: 469 customers, 1,883 orders, 3,926 items, 272 tickets. 0 orphans, 0 raw values, 0 collisions. All 272 tickets mention the pseudonymized email |
    | 2 | `scrub_free_text: false` | Blocked: 272 tickets still contain the real email or phone |
    | 3 | defaults again | Published, byte-identical to run 1 |
    | 4 | `refresh_salt: true` | Published with new pseudonyms and a new sample (505 customers) |

    ## Things to know

    - My first version masked phones into the same `+1-555-XXXX` space as the real numbers, and 260 pseudonyms turned out to be other customers' real phone numbers. The raw-value check caught it. That is why pseudonyms now use the reserved fictional range.
    - The checks only catch values the flow knows about. Free text with personal data that is not in a source column, such as a name typed in a ticket, needs a detector such as Presidio on top.

    ## Expected outputs

    - `outputs.verification.values`: table counts, `orphan_rows`, `raw_in_columns`, `raw_in_free_text`, `collisions`, `linked_tickets`.
    - Namespace files `staging/shop/customers.parquet`, `orders.parquet`, `order_items.parquet`, `tickets.parquet`.
    - KV `staging_pseudonym_salt`.

    ## Using it with your own database

    - `ATTACH 'postgres://...' AS prod (TYPE postgres, READ_ONLY)` at the top of the SQL, then select from `prod.<table>` instead of the generated tables. Credentials go in `{{ secret('NAME') }}`.
    - Add one `CREATE TABLE ... WHERE fk IN (SELECT ...)` per child table and one orphan check per foreign key.
    - Load the Parquet files into the staging database with a DuckDB `ATTACH` or your loader of choice.

    ## Links

    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb
    - DuckDB Postgres extension: https://duckdb.org/docs/extensions/postgres
    - KV store: https://kestra.io/docs/concepts/kv-store
  tags:
    - Data
    - Infrastructure
  subTags:
    - Data Quality
    - Policy & Compliance
  ee: false
  demo: true
