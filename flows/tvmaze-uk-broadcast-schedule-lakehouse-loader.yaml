id: tvmaze-uk-broadcast-schedule-lakehouse-loader
namespace: company.analytics
description: Ingests British broadcast television episodes, network programming, and airing schedules from TVmaze UK Schedule API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: tvmaze-uk-broadcast-schedule-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://api.tvmaze.com/schedule?country=GB"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = ""
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for item in items:
            eid = str(item.get('id', 'UNKNOWN'))
            current_ids.append(eid)
            show = item.get('show', {}) or {}
            sname = show.get('name', 'Unknown')
            network = show.get('network', {}) or {}
            net_name = network.get('name', 'Streaming / Digital') if isinstance(network, dict) else 'Unknown'
            atime = item.get('airtime', 'UNKNOWN')
            try:
                rtime = int(item.get('runtime', 30) or 30)
            except Exception:
                rtime = 30

            records.append({
                'episode_id': eid,
                'show_name': str(sname),
                'network_name': str(net_name),
                'airtime': str(atime),
                'runtime_minutes': rtime,
                'is_new': bool(eid not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE uk_broadcast_schedule (
                episode_id VARCHAR,
                show_name VARCHAR,
                network_name VARCHAR,
                airtime VARCHAR,
                runtime_minutes INTEGER,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO uk_broadcast_schedule SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY uk_broadcast_schedule TO 'uk_broadcast_schedule.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    network_name,
                    COUNT(*) AS broadcast_count,
                    SUM(runtime_minutes) AS total_broadcast_minutes
                FROM uk_broadcast_schedule
                GROUP BY 1
                ORDER BY broadcast_count DESC
                LIMIT 15
            ) TO 'uk_broadcasts_by_network.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM uk_broadcast_schedule WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM uk_broadcast_schedule").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - uk_broadcast_schedule.parquet
      - uk_broadcasts_by_network.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['uk_broadcast_schedule.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "TVmaze UK Broadcast Schedule sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
