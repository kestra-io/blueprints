id: graphql-schema-compatibility-gate
namespace: company.team

description: |
  Compare a baseline GraphQL schema with a candidate schema before release. The workflow
  identifies breaking and dangerous changes, exports a JSON report, and fails the execution
  when the configured compatibility policy is violated. The default schemas are identical,
  so the blueprint can be run immediately without API credentials.

inputs:
  - id: schema_name
    type: STRING
    defaults: orders-api
    displayName: Schema name
    description: Friendly API name shown in task logs and the JSON report.

  - id: baseline_schema
    type: STRING
    displayName: Baseline GraphQL SDL
    defaults: |
      type Query {
        order(id: ID!): Order
        orders: [Order!]!
      }

      enum OrderStatus {
        PENDING
        PAID
      }

      type Order {
        id: ID!
        status: OrderStatus!
        total: Float!
      }
    description: The currently released GraphQL schema in SDL format. Supply the schema used as the compatibility baseline.

  - id: candidate_schema
    type: STRING
    displayName: Candidate GraphQL SDL
    defaults: |
      type Query {
        order(id: ID!): Order
        orders: [Order!]!
      }

      enum OrderStatus {
        PENDING
        PAID
      }

      type Order {
        id: ID!
        status: OrderStatus!
        total: Float!
      }
    description: The proposed schema in SDL format. In CI, replace this input with the schema generated by the candidate build.

  - id: fail_on_dangerous_changes
    type: BOOLEAN
    defaults: true
    displayName: Fail on dangerous changes
    description: When true, fail the gate for GraphQL changes classified as dangerous as well as breaking changes.

triggers:
  - id: weekday_compatibility_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Optional weekday schedule. Disabled by default because baseline and candidate schemas are supplied as inputs.
    cron: "0 9 * * 1-5"
    disabled: true

tasks:
  - id: compare_graphql_schemas
    type: io.kestra.plugin.scripts.python.Script
    description: Parse both GraphQL schemas, classify breaking and dangerous changes, and write a machine-readable report.
    dependencies:
      - "graphql-core>=3.2,<4"
    env:
      SCHEMA_NAME: "{{ inputs.schema_name }}"
      BASELINE_SCHEMA: "{{ inputs.baseline_schema }}"
      CANDIDATE_SCHEMA: "{{ inputs.candidate_schema }}"
      FAIL_ON_DANGEROUS: "{{ inputs.fail_on_dangerous_changes }}"
    outputFiles:
      - schema-diff.json
    script: |
      import json
      import os
      from pathlib import Path
      from graphql import build_schema
      from graphql.utilities import find_breaking_changes, find_dangerous_changes
      from kestra import Kestra

      schema_name = os.environ.get("SCHEMA_NAME", "graphql-api")
      baseline_sdl = os.environ["BASELINE_SCHEMA"]
      candidate_sdl = os.environ["CANDIDATE_SCHEMA"]
      fail_on_dangerous = os.environ.get("FAIL_ON_DANGEROUS", "true").strip().lower() == "true"

      # build_schema validates the SDL and fails fast on syntax/type errors.
      baseline = build_schema(baseline_sdl)
      candidate = build_schema(candidate_sdl)

      def normalize(changes):
          return [
              {
                  "type": getattr(change.type, "name", str(change.type)),
                  "description": change.description,
              }
              for change in changes
          ]

      breaking = normalize(find_breaking_changes(baseline, candidate))
      dangerous = normalize(find_dangerous_changes(baseline, candidate))
      blocking_count = len(breaking) + (len(dangerous) if fail_on_dangerous else 0)
      compatible = blocking_count == 0

      report = {
          "schema_name": schema_name,
          "compatible": compatible,
          "policy": {"fail_on_dangerous_changes": fail_on_dangerous},
          "counts": {
              "breaking": len(breaking),
              "dangerous": len(dangerous),
              "blocking": blocking_count,
          },
          "breaking_changes": breaking,
          "dangerous_changes": dangerous,
      }
      Path("schema-diff.json").write_text(json.dumps(report, indent=2), encoding="utf-8")

      summary = (
          f"GraphQL schema '{schema_name}': {len(breaking)} breaking change(s), "
          f"{len(dangerous)} dangerous change(s), {blocking_count} blocking change(s). "
          f"Compatibility gate: {'PASS' if compatible else 'FAIL'}."
      )
      print(summary)
      Kestra.outputs({
          "schema_name": schema_name,
          "compatible": compatible,
          "breaking_count": len(breaking),
          "dangerous_count": len(dangerous),
          "blocking_count": blocking_count,
          "summary": summary,
      })

  - id: log_schema_comparison
    type: io.kestra.plugin.core.log.Log
    description: Log a concise comparison summary for the execution history.
    message: "{{ outputs.compare_graphql_schemas.vars.summary }}"

  - id: compatibility_gate
    type: io.kestra.plugin.core.flow.If
    description: Fail the execution when breaking changes or policy-blocking dangerous changes are present.
    condition: "{{ outputs.compare_graphql_schemas.vars.blocking_count > 0 }}"
    then:
      - id: fail_incompatible_schema
        type: io.kestra.plugin.core.execution.Fail
        description: Stop a CI/CD release pipeline when the candidate violates the configured compatibility policy.
        errorMessage: |
          GraphQL compatibility gate FAILED for '{{ outputs.compare_graphql_schemas.vars.schema_name }}'.
          Breaking changes: {{ outputs.compare_graphql_schemas.vars.breaking_count }}
          Dangerous changes: {{ outputs.compare_graphql_schemas.vars.dangerous_count }}
          Blocking changes: {{ outputs.compare_graphql_schemas.vars.blocking_count }}
          Review the JSON report at outputs.compare_graphql_schemas.outputFiles['schema-diff.json'].
    else:
      - id: log_compatible_schema
        type: io.kestra.plugin.core.log.Log
        description: Confirm that the candidate schema passes the selected compatibility policy.
        message: |
          GraphQL compatibility gate PASSED for '{{ outputs.compare_graphql_schemas.vars.schema_name }}'.
          Breaking changes: {{ outputs.compare_graphql_schemas.vars.breaking_count }}
          Dangerous changes: {{ outputs.compare_graphql_schemas.vars.dangerous_count }}
          JSON report: outputs.compare_graphql_schemas.outputFiles['schema-diff.json']

extend:
  title: GraphQL Schema Compatibility Gate
  metaTitle: GraphQL Schema Breaking Change Guard | Kestra Blueprint
  shortDescription: Compare released and candidate GraphQL schemas, export a JSON diff, and fail a release gate when compatibility rules are violated.
  description: |
    Catch GraphQL API contract regressions before they reach consumers. This blueprint compares a released schema (baseline SDL) with a candidate schema, classifies breaking and dangerous changes with `graphql-core`, saves a structured JSON diff, and fails the execution when the selected policy is violated.

    ## How it works

    1. `compare_graphql_schemas` validates both SDL documents, uses `find_breaking_changes` and `find_dangerous_changes`, and writes `schema-diff.json`.
    2. `log_schema_comparison` records the change counts and gate result.
    3. `compatibility_gate` uses an `If` task. Any blocking changes run `io.kestra.plugin.core.execution.Fail`, which lets a CI/CD caller stop a release. A compatible schema follows the success log branch.

    ## Prerequisites

    - A Kestra worker able to execute the Python Script task.
    - The Python task installs the `graphql-core` dependency automatically.
    - No API credentials or external services are needed for the included demo.

    ## Inputs

    - `schema_name` (STRING, default `orders-api`): friendly label for the report.
    - `baseline_schema` (STRING): currently released GraphQL schema in SDL format.
    - `candidate_schema` (STRING): candidate GraphQL schema in SDL format.
    - `fail_on_dangerous_changes` (BOOLEAN, default `true`): treat dangerous changes as blocking in addition to breaking changes.

    ## Quick start

    1. Import the flow and run it with the default inputs. The schemas are identical, so the flow should pass.
    2. To exercise the failure path, remove `status: OrderStatus!` from the `Order` type in `candidate_schema` and run again. Removing an output field is a breaking change, so the compatibility gate should fail.
    3. To see dangerous-change behavior without also introducing a breaking change, add a new value such as `CANCELLED` to the candidate `OrderStatus` enum. Compare the report with `fail_on_dangerous_changes` set to `true` and `false`.
    4. In CI/CD, pass the released and candidate SDL as flow inputs. Alternatively, add HTTP tasks that fetch each environment's schema, convert GraphQL introspection JSON to SDL, and feed the resulting text into this comparison task.
    5. Keep the schedule disabled unless the flow is connected to an automated schema source; static input defaults alone do not track a live API.

    ## Outputs

    - `outputs.compare_graphql_schemas.vars.compatible`: boolean gate result.
    - `outputs.compare_graphql_schemas.vars.breaking_count`: number of breaking changes.
    - `outputs.compare_graphql_schemas.vars.dangerous_count`: number of dangerous changes.
    - `outputs.compare_graphql_schemas.vars.summary`: human-readable result.
    - `outputs.compare_graphql_schemas.outputFiles['schema-diff.json']`: full JSON report with change descriptions.

    ## Notes

    - Breaking/dangerous classifications follow `graphql-core`; review the JSON report and tune the release policy for your API's compatibility guarantees.
    - SDL parse/type-validation errors fail the Python task before the gate runs, rather than treating an invalid candidate schema as compatible.
    - A schema comparison is only as current as its inputs. Wire the baseline and candidate schemas to version-controlled build artifacts or environment endpoints before enabling automation.

    ## Links

    - `graphql-core` schema comparison utilities: https://graphql-core-3.readthedocs.io/en/latest/modules/utilities.html#graphql.utilities.find_breaking_changes
    - `graphql-core` project: https://github.com/graphql-python/graphql-core
    - Kestra Python Script plugin: https://kestra.io/plugins/plugin-script-python
    - Kestra `If` flow task: https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if
    - Kestra Schedule trigger: https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.schedule
  tags:
    - Infrastructure
    - Core
  subTags:
    - CI/CD & Deployment
    - Testing & Quality
  ee: false
  demo: true
  metaDescription: Compare baseline and candidate GraphQL SDL for breaking and dangerous changes, export a JSON diff, and fail CI when policy is violated.
