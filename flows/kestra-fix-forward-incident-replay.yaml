id: kestra-fix-forward-incident-replay
namespace: company.platform
description: >-
  Groups the failed executions of opted-in flows into incidents by error fingerprint. Once a fix is deployed, it
  replays every execution the bug failed on the fixed flow revision, from a restart point computed for each
  execution, canary first, then in waves with a failure budget, behind an approval. Kestra 2.0.

labels:
  fix-forward.engine: "true"

inputs:
  - id: action
    type: SELECT
    values:
      - STATUS
      - PLAN
      - REPLAY
      - HALT
      - DISMISS
      - MERGE
      - EXPLAIN
      - WATCH
      - SCAN
    defaults: STATUS
    description: >-
      STATUS lists the incidents. PLAN is the dry run of REPLAY: it groups the executions of an incident into
      chains, picks a restart point for each and writes the plan, without replaying anything. REPLAY runs the plan
      after an approval: canary first, then waves. HALT stops a running campaign before its next wave. DISMISS
      closes an incident without replaying it. MERGE moves the executions of incident merge_from into incident.
      EXPLAIN tells, for one execution, its incident, its chain and its restart point. WATCH and SCAN are what the
      triggers start.
  - id: incident
    type: STRING
    required: false
    validator: ^(ff-[0-9a-f]{12})?$
    description: Incident id, for example ff-1a2b3c4d5e6f, from STATUS or from the alert. Needed by PLAN, REPLAY, HALT and DISMISS.
  - id: merge_from
    type: STRING
    required: false
    validator: ^(ff-[0-9a-f]{12})?$
    description: >-
      For MERGE, the incident whose executions join incident, when two signatures turn out to be one bug. Later
      failures with its signature join incident too.
  - id: failed_after
    type: DATETIME
    required: false
    description: PLAN and REPLAY only consider executions that started at or after this time.
  - id: failed_before
    type: DATETIME
    required: false
    description: PLAN and REPLAY only consider executions that started before this time.
  - id: target_revision
    type: INT
    required: false
    description: Flow revision to replay on. Leave it empty for the latest revision of the flow.
  - id: restart_policy
    type: SELECT
    values:
      - SMART
      - FROM_START
    defaults: SMART
    description: >-
      SMART restarts each execution at the earliest point where the new revision changes what it ran. FROM_START
      replays every execution from its first task.
  - id: allow_from_start
    type: BOOL
    defaults: false
    description: >-
      Lets SMART fall back to a replay from the first task when nothing later is safe, for example when a task that
      ran was removed. Those replays run again every task that already succeeded.
  - id: fixed_outside_flow
    type: BOOL
    defaults: false
    description: >-
      Set it when the cause was outside the flow (data, an API, a namespace file, a secret). Executions are then
      replayed even when the revision changes nothing they ran.
  - id: never_rerun
    type: ARRAY
    itemType: STRING
    required: false
    description: >-
      Ids of tasks that must never run twice for one execution, such as a payment or a customer email. An execution
      whose replay would run one of them again after it succeeded is held instead of replayed. A watched flow can
      also list them in its own label fix-forward.never-rerun, as comma-separated task ids.
  - id: include_superseded
    type: BOOL
    defaults: false
    description: Also replay executions that a later successful run with the same inputs or schedule date already redid.
  - id: count_warning_as_success
    type: BOOL
    defaults: true
    description: Counts a replay that ends in WARNING as fixed.
  - id: canary_breakpoint
    type: STRING
    required: false
    validator: ^([a-zA-Z0-9][a-zA-Z0-9_-]*)?$
    description: >-
      Id of a task of the target revision, such as the one that publishes. The canary replays stop at a breakpoint
      before it, so a person can check their outputs and resume them from the breakpoint, or kill them to stop the
      campaign.
  - id: canary_count
    type: INT
    defaults: 1
    description: How many executions are replayed first, alone. Any canary failure stops the campaign.
  - id: wave_size
    type: INT
    defaults: 10
    description: How many executions each following wave replays at once.
  - id: wave_pause
    type: DURATION
    defaults: PT1M
    description: Wait between two waves.
  - id: max_failure_percent
    type: INT
    defaults: 20
    description: A wave in which more than this share of replays fails stops the campaign.
  - id: replay_window
    type: STRING
    required: false
    validator: ^(([01][0-9]|2[0-3]):[0-5][0-9]-([01][0-9]|2[0-3]):[0-5][0-9])?$
    description: >-
      UTC hours in which a wave may start, such as 22:00-06:00 to replay at night only. A wave due outside it
      waits for the window to open. Leave it empty to replay at any time.
  - id: replay_timeout
    type: DURATION
    defaults: PT2H
    description: How long a wave waits for its replays to finish.
  - id: approval_timeout
    type: DURATION
    defaults: PT24H
    description: How long REPLAY waits for its approval before it cancels itself.
  - id: max_chains
    type: INT
    defaults: 500
    description: Most executions one campaign replays. The next PLAN picks up the rest.
  - id: dismiss_reason
    type: STRING
    required: false
    description: Why the incident is closed without a replay, for DISMISS.
  - id: execution_id
    type: STRING
    required: false
    description: Execution to fingerprint, for a WATCH started by SCAN or by hand, or to explain with EXPLAIN.
  - id: adopt_days
    type: INT
    defaults: 7
    description: SCAN also fingerprints the failed executions of watched flows from this many past days that no WATCH saw.
  - id: verify_hours
    type: INT
    defaults: 24
    description: A RESOLVED incident becomes VERIFIED when SCAN finds no new failure this many hours after the campaign.
  - id: auto_plan
    type: BOOL
    defaults: true
    description: SCAN starts a PLAN run for an incident as soon as it spots a newer revision of its flow.
  - id: retention_days
    type: INT
    defaults: 30
    description: SCAN deletes the card and the reports of an incident VERIFIED, DISMISSED or MERGED this many days ago.
  - id: notify
    type: BOOL
    defaults: true
    description: Sends Slack messages through the SLACK_WEBHOOK_URL secret.
  - id: kestra_url
    type: STRING
    defaults: http://localhost:8080
    validator: ^https?://[^\s/]+(/[^\s]*[^\s/])?$
    description: Base URL of this Kestra instance, used for its API and for links in the messages.
  - id: tenant
    type: STRING
    required: false
    validator: ^[a-zA-Z0-9_-]*$
    description: Tenant id (Enterprise Edition). Leave it empty for open source Kestra.

checks:
  - when: "{{ not (['PLAN', 'REPLAY', 'HALT', 'DISMISS'] contains inputs.action) or (inputs.incident ?? '') != '' }}"
    behavior: BLOCK_EXECUTION
    style: ERROR
    message: PLAN, REPLAY, HALT and DISMISS need the incident input, an id like ff-1a2b3c4d5e6f from STATUS or the alert.
  - when: "{{ inputs.action != 'MERGE' or ((inputs.merge_from ?? '') != '' and inputs.merge_from != (inputs.incident ?? '')) }}"
    behavior: BLOCK_EXECUTION
    style: ERROR
    message: MERGE needs merge_from, another incident than incident.
  - when: "{{ inputs.action != 'EXPLAIN' or (inputs.execution_id ?? '') != '' }}"
    behavior: BLOCK_EXECUTION
    style: ERROR
    message: EXPLAIN needs execution_id, the id of the execution to explain.
  - when: "{{ inputs.action != 'DISMISS' or (inputs.dismiss_reason ?? '') != '' }}"
    behavior: BLOCK_EXECUTION
    style: ERROR
    message: DISMISS needs dismiss_reason, so the incident card says why it was closed without a replay.

sla:
  - id: engine_run_backstop
    type: MAX_DURATION
    duration: P3D
    behavior: FAIL
    labels:
      fix-forward.sla: exceeded

variables:
  # jq programs live here as literal blocks, so Pebble never parses their quotes and backslashes.
  checks_jq: |
    . as $i
    | [ (if (["PLAN", "REPLAY", "HALT", "DISMISS", "MERGE"] | index($i.action)) != null
           and (($i.incident // "") | test("^ff-[0-9a-f]{12}$") | not)
         then "action " + $i.action + " needs incident, an id like ff-1a2b3c4d5e6f" else empty end),
        (if $i.action == "WATCH" and ($i.trigger_exec // "") == "" and ($i.execution_id // "") == ""
         then "WATCH is started by the on_failure trigger, or by hand with execution_id" else empty end),
        (if $i.action == "EXPLAIN" and ($i.execution_id // "") == "" then "EXPLAIN needs execution_id" else empty end),
        (if $i.action == "MERGE" and ((($i.merge_from // "") | test("^ff-[0-9a-f]{12}$") | not) or $i.merge_from == $i.incident)
         then "MERGE needs merge_from, another incident than incident" else empty end),
        (if ($i.after // "") != "" and ($i.before // "") != "" and ($i.after[0:19] >= $i.before[0:19])
         then "failed_after must be earlier than failed_before" else empty end),
        (if $i.wave_size < 1 then "wave_size must be at least 1" else empty end),
        (if $i.verify < 0 then "verify_hours cannot be negative" else empty end),
        (if $i.retention < 0 then "retention_days cannot be negative" else empty end),
        (if $i.canary < 1 then "canary_count must be at least 1" else empty end),
        (if $i.budget < 0 or $i.budget > 100 then "max_failure_percent must be between 0 and 100" else empty end),
        (if $i.max < 1 then "max_chains must be at least 1" else empty end),
        (if $i.adopt < 0 then "adopt_days cannot be negative" else empty end) ]
  # The failing leaf task and the first line of its first ERROR log, with ids, times and numbers masked, so the same
  # bug gives the same signature in every execution.
  fingerprint_jq: |
    . as $i
    | ($i.exec.taskRunList // []) as $runs
    | [$runs[] | select(.state.current == "FAILED")] as $failed
    | ([$failed[] | . as $f | select(([$failed[] | select(.parentTaskRunId == $f.id)] | length) == 0)] | .[0] // null) as $leaf
    | [($i.logs // [])[] | select(.level == "ERROR" and ((.message // "") | length) > 0)] as $errs
    | ((if $leaf == null then [] else [$errs[] | select(.taskRunId == $leaf.id)] end) + $errs) as $ordered
    | (($ordered | .[0].message) // ("the execution ended " + ($i.exec.state.current // "FAILED") + " without an error log")) as $raw
    | ($raw | split("\n") | map(select(test("\\S"))) | (.[0] // "") | .[0:500]) as $line
    | ($line
        | gsub("[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"; "<uuid>")
        | gsub("[0-9]{4}-[0-9]{2}-[0-9]{2}([T ][0-9]{2}:[0-9]{2}(:[0-9]{2}([.][0-9]+)?)?(Z|[+-][0-9]{2}:?[0-9]{2})?)?"; "<time>")
        | gsub("\\b[A-Za-z0-9]{20,24}\\b"; "<id>")
        | gsub("0x[0-9a-fA-F]+"; "<hex>")
        | gsub("[0-9]+([.][0-9]+)?"; "<n>")
        | gsub("\\s+"; " ") | sub("^ +"; "") | sub(" +$"; "")
        | .[0:300]) as $sig
    | {namespace: $i.exec.namespace, flow_id: $i.exec.flowId, execution_id: $i.exec.id, original_id: ($i.exec.originalId // null),
       labels: ($i.exec.labels // []), replay_of: (if ($i.exec.originalId // $i.exec.id) != $i.exec.id then $i.exec.originalId else null end),
       task_id: ($leaf.taskId // "(execution)"), task_run_id: ($leaf.id // ""), signature: $sig, sample: $line,
       revision: ($i.exec.flowRevision // 0), state: ($i.exec.state.current // ""), started: ($i.exec.state.startDate // ""),
       replay: ((($i.exec.labels // []) | map(select(.key == "system.replay" and .value == "true")) | length) > 0),
       incident_label: ((($i.exec.labels // []) | map(select(.key == "fix-forward.incident")) | .[0].value) // null)}
  # Labels POST replaces every non-system label of the execution, so the new ones are merged into the existing set.
  labels_jq: |
    (.set | to_entries | map({key: .key, value: (.value | tostring)})) as $new
    | [(.labels // [])[] | select((.key | startswith("system.")) | not)
        | select(.key as $k | ([$new[] | select(.key == $k)] | length) == 0)] + $new
  card_jq: |
    (.card // {}) as $c
    | $c + (.set // {}) + {updated_at: .now,
        history: ((($c.history // []) + (if .event == null then [] else [.event + {at: .now}] end)) | .[-30:])}
  # One chain per original execution: the original and every replay of it, since a replay keeps originalId on the
  # root. A chain belongs to the incident when one of its executions carries the incident label; the label of its
  # last execution says which incident its latest failure belongs to.
  chains_jq: |
    def canon: if type == "object" then to_entries | sort_by(.key) | map(.value |= canon) | from_entries
      elif type == "array" then map(canon) else . end;
    def done: . as $s | (["SUCCESS", "WARNING", "FAILED", "KILLED", "CANCELLED", "SKIPPED", "RETRIED"] | index($s)) != null;
    def ok($w): (.state.current == "SUCCESS") or ($w and .state.current == "WARNING");
    def is_replay: (.originalId != null) and (.originalId != .id);
    def moved_at: ((.state.histories // []) | map(.date) | max) // .state.endDate // .state.startDate;
    def lab: (((.labels // []) | map(select(.key == "fix-forward.incident")) | .[0].value) // null);
    def key: if ((.trigger.type // "") | endswith(".Schedule")) then "date:" + ((.trigger.variables.date // "") | tostring)
      elif .trigger == null then "inputs:" + ((.inputs // {}) | canon | tojson) else null end;
    . as $i
    | ([($i.members // [])[] | .id] | map({key: ., value: true}) | from_entries) as $mine
    | [($i.successes // [])[] | select(.namespace == $i.ns and .flowId == $i.flow and ok($i.warn_ok))
        | {key: key, root: (.originalId // .id), end: moved_at} | select(.key != null)] as $wins
    | ((($i.execs // []) + ($i.members // [])) | map(select(.namespace == $i.ns and .flowId == $i.flow)) | unique_by(.id))
    | group_by(.originalId // .id)
    | map(select(map(.id) | map($mine[.] // false) | any))
    | map(sort_by(moved_at) as $m
        | (([$m[] | select(is_replay | not)] | .[0]) // $m[0]) as $first
        | ($m | last) as $last
        | ($last | lab) as $ll
        | ($first | key) as $k
        | (if (($first.trigger.type // "") | endswith(".Schedule")) then ($first.trigger.variables.date // null) else null end) as $date
        | ($first.originalId // $first.id) as $root
        | ($k != null and ([$wins[] | select(.key == $k and .root != $root and .end > $first.state.startDate)] | length) > 0) as $superseded
        | {root: ($first.originalId // $first.id), last: $last.id, last_state: $last.state.current,
           last_revision: ($last.flowRevision // 0), last_is_replay: ($last | is_replay), last_label: $ll,
           members: ($m | length), started: $first.state.startDate, inputs: ($first.inputs // {}), schedule_date: $date,
           status: (
             if ($m | map(ok($i.warn_ok)) | any) then "RESOLVED"
             elif ($m | map(.state.current | done | not) | any) then "IN_FLIGHT"
             elif $ll != null and $ll != $i.incident then "MOVED"
             elif ($last | is_replay) and ($last.flowRevision // 0) >= $i.target and ($i.fixed_outside | not) then "FAILED_ON_TARGET"
             elif $superseded and ($i.include_superseded | not) then "SUPERSEDED"
             elif (($i.after // "") != "" and ($first.state.startDate[0:19] < $i.after[0:19]))
               or (($i.before // "") != "" and ($first.state.startDate[0:19] >= $i.before[0:19])) then "OUT_OF_WINDOW"
             else "CANDIDATE" end),
           moved_to: (if $ll != null and $ll != $i.incident then $ll else null end)})
    | sort_by(.started) as $all
    | [$all[] | select(.status == "CANDIDATE")] as $cand
    | {chains: $all,
       counts: ($all | group_by(.status) | map({key: .[0].status, value: length}) | from_entries),
       candidates: ($cand | .[0:$i.max] | map({root, last, last_revision, started, schedule_date, inputs})),
       overflow: (($cand | length) - $i.max | if . > 0 then . else 0 end),
       revisions: ($cand | .[0:$i.max] | map(.last_revision) | unique),
       by_revision: ($cand | .[0:$i.max] | group_by(.last_revision) | map({key: (.[0].last_revision | tostring), value: {count: length, example: .[0].last}}) | from_entries),
       moved: ([$all[] | select(.status == "MOVED") | .moved_to] | unique),
       first_started: (($all | .[0].started) // null)}
  # The restart point of one execution on the target revision, from what Kestra 2.0 replay does:
  #   a task that ran and is gone makes Kestra refuse a replay from a task (HTTP 409);
  #   a task that changed before the failure only takes effect if the replay starts at or before it;
  #   a new task placed before the restart point is never run and the replay stays RUNNING, so the replay starts at
  #   the task before it, or at its parent;
  #   a replay from a loop, or from a task inside one, does not run the loop again, so it starts from the first task.
  restart_jq: |
    def canon: if type == "object" then to_entries | sort_by(.key) | map(.value |= canon) | from_entries
      elif type == "array" then map(canon) else . end;
    def lists: ([(.tasks // []), (.then // []), (.else // []), (.errors // []), (.finally // []), (.defaults // [])]
        + ((.cases // {}) | to_entries | sort_by(.key) | map(.value)))
      | map(select(type == "array" and length > 0)
          | map(if (type == "object" and has("task") and (has("type") | not)) then .task else . end));
    def tw($list; $path): [range(0; $list | length) as $k | $list[$k] as $t
        | [{id: $t.id, type: ($t.type // ""), path: $path, prev: (if $k > 0 then $list[$k - 1].id else null end),
            def: ($t | del(.tasks, .then, .else, .errors, .finally, .defaults, .cases) | canon)}]
          + ([$t | lists[] | tw(.; $path + [$t.id])] | add // [])] | add // [];
    def flat: (tw(.tasks // []; []) + tw(.errors // []; ["(errors)"]) + tw(.finally // []; ["(finally)"]))
      | to_entries | map(.value + {pos: .key});
    . as $i
    | ($i.old | flat) as $O | ($i.new | flat) as $N
    | ($O | map({key: .id, value: .}) | from_entries) as $o
    | ($N | map({key: .id, value: .}) | from_entries) as $n
    | ((($i.old.variables // {}) | canon) != (($i.new.variables // {}) | canon)) as $vars_changed
    | ($i.exec.taskRunList // []) as $runs
    | ($runs | map(.taskId) | unique) as $ran
    | [$runs[] | select(.state.current == "FAILED")] as $failed
    | ([$failed[] | . as $f | select(([$failed[] | select(.parentTaskRunId == $f.id)] | length) == 0)]
        | sort_by(($n[.taskId] // $o[.taskId] // {pos: 100000}).pos) | .[0] // null) as $leaf
    | [$ran[] | select(($n[.] // null) == null)] as $removed
    | [$ran[] | select(($n[.] // null) != null and ($o[.] // null) != null)
        | select(($o[.].def != $n[.].def) or ($vars_changed and ($n[.].def | tojson | test("vars\\."))))] as $changed
    | [$N[] | select(($o[.id] // null) == null and ((.path[0] // "") | startswith("(") | not)) | .id] as $inserted
    | [$N[] | select(.type | test("flow[.](LoopUntil|Loop|ForEach)$")) | .id] as $loops
    | ($i.target | tostring) as $rev
    | (if $i.policy == "FROM_START" then {mode: "FROM_START", start: null, reasons: ["restart_policy is FROM_START"]}
       elif ($removed | length) > 0 then {mode: "FROM_START", start: null,
         reasons: ["task " + ($removed | join(", ")) + " ran but is not in revision " + $rev + ", and Kestra refuses a replay from a task in that case"]}
       elif $leaf == null then {mode: "FROM_START", start: null, reasons: ["no failed task to restart from"]}
       else {mode: "TASK", start: $leaf.taskId, reasons: ["the failed task is " + $leaf.taskId]} end) as $r0
    | ($r0 | if .mode == "TASK" and ($changed | length) > 0 then
          (($changed | sort_by($n[.].pos) | .[0])) as $c
          | if $n[$c].pos < $n[.start].pos then .start = $c
              | .reasons += ["task " + $c + " changed in revision " + $rev + " and ran before the failure, so the replay starts there"]
            else . end
        else . end) as $r1
    | ($r1 | until(.mode != "TASK" or ([$inserted[] as $x | select($n[$x].pos < $n[.start].pos) | $x] | length) == 0;
          ([$inserted[] as $x | select($n[$x].pos < $n[.start].pos) | $x] | sort_by($n[.].pos) | .[0]) as $f
          | ($n[$f].prev) as $p | ($n[$f].path | .[-1] // null) as $parent
          | if $p != null and ($ran | index($p)) != null then .start = $p
              | .reasons += ["new task " + $f + " sits before the restart point and a replay would never run it, so the replay starts at " + $p]
            elif $parent != null and ($ran | index($parent)) != null then .start = $parent
              | .reasons += ["new task " + $f + " is the first task of " + $parent + ", so the replay starts at " + $parent]
            else .mode = "FROM_START" | .start = null
              | .reasons += ["new task " + $f + " comes before every task that ran, so the replay starts from the first task"] end)) as $r2
    | ($r2 | if .mode == "TASK" then
          ([($n[.start].path + [.start])[] as $a | select(($loops | index($a)) != null) | $a] | .[0] // null) as $lp
          | if $lp != null then .mode = "FROM_START" | .start = null
              | .reasons += ["the restart point is in loop " + $lp + ", and a replay from a loop or from a task in it does not run the loop again"]
            else . end
        else . end) as $r3
    | ($r3 | if .mode == "TASK" then
          ([$runs[] | select(.taskId == $r3.start)] | sort_by(.state.startDate // "") | .[0] // null) as $tr
          | if $tr == null then .mode = "FROM_START" | .start = null | .reasons += ["task " + $r3.start + " never ran in this execution"]
            else . + {task_run_id: $tr.id} end
        else . end) as $r4
    | (if $leaf == null then 100000 else ($n[$leaf.taskId] // {pos: 100000}).pos end) as $leaf_pos
    | ([$inserted[] | select($n[.].pos <= $leaf_pos)] | length) as $ins_before
    | ($r4 | if ($changed | length) == 0 and $ins_before == 0 and ($removed | length) == 0
              and $leaf != null and ($n[$leaf.taskId] // null) != null and ($o[$leaf.taskId].def == $n[$leaf.taskId].def)
              and ($i.fixed_outside | not) and $i.policy != "FROM_START"
            then .mode = "NO_FIX" | .reasons += ["revision " + $rev + " changes nothing this execution ran up to the failure; set fixed_outside_flow when the cause was outside the flow"]
            elif .mode == "FROM_START" and $i.policy != "FROM_START" and ($i.allow_from_start | not)
            then .mode = "HOLD" | .reasons += ["a replay from the first task runs every task again; set allow_from_start to accept it"]
            else . end) as $r5
    | (if $r5.mode == "NO_FIX" then []
       elif $r5.mode == "TASK" then
         [$runs[] | select(.state.current == "SUCCESS") | .taskId | select(($n[.] // null) != null and $n[.].pos >= $n[$r5.start].pos)] | unique
       else [$runs[] | select(.state.current == "SUCCESS") | .taskId] | unique end) as $reruns
    | [$reruns[] | select((($i.never // []) | index(.)) != null)] as $guarded
    # A task outside the Kestra core that sends, publishes, uploads or writes, or an HTTP call other than GET, acts on
    # another system: running it again after it succeeded repeats that action.
    | [$reruns[] | . as $t | ($n[$t] // $o[$t]) as $d | select($d != null)
        | select(((($d.type | startswith("io.kestra.plugin.core.")) | not)
                   and ($d.type | test("(notification|[.](mail|email|smtp|slack|teams|discord|telegram|twilio|sendgrid|pagerduty|opsgenie|sms)[.]|[.](Produce|Publish|Send|SendMessage|Upload|Insert|Put|Write|Delete|Create|Update|Trigger)$)"; "i")))
                 or (($d.type | endswith(".http.Request")) and ((($d.def.method // "GET") | ascii_upcase) != "GET")))
        | {id: $t, type: ($d.type | split(".") | .[-2:] | join("."))}] as $side
    | (if ($guarded | length) > 0 and ($r5.mode == "TASK" or $r5.mode == "FROM_START") then
         $r5 + {mode: "HOLD", reasons: ($r5.reasons + ["task " + ($guarded | join(", ")) + " already succeeded and is listed in never_rerun or in the fix-forward.never-rerun label"])}
       else $r5 end)
    + {leaf: ($leaf.taskId // null), changed: $changed, inserted: $inserted, removed: $removed,
       reruns: $reruns, guarded: $guarded, side_effects: $side}
  waves_jq: |
    .candidates as $c | .canary as $k | .size as $s
    | ([$c[0:$k]] + [range(0; (((($c | length) - $k) + $s - 1) / $s) | floor) as $w | $c[($k + $w * $s):($k + ($w + 1) * $s)]])
    | map(select(length > 0))
    | to_entries
    | map({wave: (if .key == 0 then "canary" else "wave-" + (.key | tostring) end),
           items: (.value | map({root, last, last_revision}))})
  # The chains of one wave that still need a replay right now, from a fresh search.
  wave_todo_jq: |
    (.fresh.chains // [] | map({key: .root, value: .}) | from_entries) as $now
    | [.items[] | . as $it | ($now[$it.root] // null) as $c
        | if $c == null then {root: $it.root, last: $it.last, skip: "no longer listed in the incident"}
          elif $c.status != "CANDIDATE" then {root: $it.root, last: $c.last, skip: ("now " + $c.status)}
          else {root: $it.root, last: $c.last, last_revision: $c.last_revision} end]
  wave_eval_jq: |
    def done: . as $s | (["SUCCESS", "WARNING", "FAILED", "KILLED", "CANCELLED", "SKIPPED", "RETRIED"] | index($s)) != null;
    . as $i
    | (($i.ids // []) | map({key: ., value: true}) | from_entries) as $want
    | [($i.page.results // [])[] | select($want[.id] // false) | {id, root: (.originalId // .id), state: .state.current}] as $r
    | ([$r[] | select(.state == "SUCCESS" or ($i.warn_ok and .state == "WARNING"))] | length) as $ok
    | ([$r[] | select(.state | done | not)] | length) as $running
    | (($r | length) - $ok - $running) as $bad
    | ($i.ids | length) as $launched
    | {launched: $launched, seen: ($r | length), ok: $ok, failed: $bad, running: $running,
       done: (($r | length) >= $launched and $running == 0),
       failure_percent: (if $launched > 0 then ($bad * 100 / $launched | floor) else 0 end),
       failed_ids: [$r[] | select((.state == "SUCCESS" or ($i.warn_ok and .state == "WARNING") or (.state | done | not)) | not) | .id],
       breakpoint_ids: [$r[] | select(.state == "BREAKPOINT") | .id]}
  adopt_jq: |
    . as $i
    | [($i.page.results // [])[]
        | select(((.labels // []) | map(.key) | index("fix-forward.incident")) == null)
        | select(.namespace != $i.engine_ns or .flowId != $i.engine_flow)
        | .id]
    | .[0:50]
  status_jq: |
    . as $i
    | ([($i.page.results // [])[] | (((.labels // []) | map(select(.key == "fix-forward.incident")) | .[0].value) // null)
        | select(. != null)] | group_by(.) | map({key: .[0], value: length}) | from_entries) as $failing
    | ($i.cards | sort_by(.opened_at // "") | reverse) as $cards
    | {count: ($cards | length),
       open: ([$cards[] | select((.status // "") | test("^(OPEN|REGRESSED|PARTIAL|INTERRUPTED|IN_CAMPAIGN)$"))] | length),
       excerpt: (if ($cards | length) == 0 then "No incident yet." else
         ($cards | .[0:12] | map(.id + "  " + (.status // "?") + "  " + (.namespace // "") + "." + (.flowId // "")
            + "  task " + (.taskId // "") + "  failed " + (($failing[.id] // 0) | tostring)) | join("\n"))
         + (if ($cards | length) > 12 then "\n" + ((($cards | length) - 12) | tostring) + " more in fix-forward/STATUS.md" else "" end) end),
       markdown: ("# Fix-forward incidents\n\n"
         + (if ($cards | length) == 0 then "No incident yet.\n" else
           "| Incident | Status | Flow | Task | Failed (30 days) | Fix candidate | Resolved on | Signature |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n"
           + ($cards | map("| `" + .id + "` | " + (.status // "?") + " | " + (.namespace // "") + "." + (.flowId // "")
               + " | " + (.taskId // "") + " | " + (($failing[.id] // 0) | tostring)
               + " | " + ((.fix_candidate_revision // "-") | tostring) + " | " + ((.resolved_revision // "-") | tostring)
               + " | " + ((.signature // "") | gsub("[|]"; "/") | .[0:90]) + " |") | join("\n")) + "\n" end))}
  plan_md_jq: |
    . as $i
    | ($i.plan.counts // {}) as $c
    | "# Plan for incident " + $i.card.id + "\n\n"
      + "- Flow: `" + $i.card.namespace + "." + $i.card.flowId + "`, failing task `" + $i.card.taskId + "`\n"
      + "- Signature: `" + ($i.card.signature | gsub("`"; "'")) + "`\n"
      + "- Target revision: " + ($i.target | tostring) + " (latest " + ($i.latest | tostring) + ")\n"
      + "- Chains: " + ($i.plan.chains | length | tostring) + ": "
      + ([$c | to_entries[] | .key + " " + (.value | tostring)] | join(", ")) + "\n"
      + "- Replays planned: " + ($i.plan.candidates | length | tostring)
      + (if $i.plan.overflow > 0 then " (" + ($i.plan.overflow | tostring) + " more wait for the next campaign)" else "" end) + "\n"
      + "- Waves: " + ($i.waves | map(.wave + " " + (.items | length | tostring)) | join(", ")) + "\n"
      + "- Expected restart modes: " + ([$i.estimate | to_entries[] | .key + " " + (.value | tostring)] | join(", ")) + "\n"
      + (if ($i.blockers | length) > 0 then "\n## Blockers\n\n" + ($i.blockers | map("- " + .) | join("\n")) + "\n" else "" end)
      + "\n"
      + "## Restart point by failed revision\n\n"
      + (if ($i.previews | length) == 0 then "No execution to replay.\n" else
        "| Failed on revision | Example | Mode | Restart at | Tasks that run again | Why |\n| --- | --- | --- | --- | --- | --- |\n"
        + ($i.previews | map("| " + (.revision | tostring) + " | `" + .execution + "` | " + .mode + " | "
            + ((.start // "first task") | tostring) + " | " + ((.reruns // []) | join(", ") | if . == "" then "-" else . end)
            + " | " + ((.reasons // []) | join("; ") | gsub("[|]"; "/")) + " |") | join("\n")) + "\n" end)
      + "\nThe restart point is computed again for each execution when it is replayed.\n"
      + (if ($i.warnings | length) > 0 then "\n## Warnings\n\n" + ($i.warnings | map("- " + .) | join("\n")) + "\n" else "" end)
  campaign_md_jq: |
    . as $i
    | "# Campaign " + $i.campaign + " for incident " + $i.card.id + "\n\n"
      + "- Outcome: **" + $i.outcome + "**" + (if ($i.reason // "") != "" then " (" + $i.reason + ")" else "" end) + "\n"
      + "- Target revision: " + ($i.target | tostring) + "\n"
      + "- Replays started: " + ($i.ledger.replays | length | tostring) + ", skipped: " + ($i.ledger.skipped | length | tostring) + "\n"
      + "- Chains after the campaign: " + ([$i.final.counts | to_entries[] | .key + " " + (.value | tostring)] | join(", ")) + "\n\n"
      + "| Wave | Started | Succeeded | Failed | Still running |\n| --- | --- | --- | --- | --- |\n"
      + ($i.ledger.waves | map("| " + .wave + " | " + (.launched | tostring) + " | " + (.ok | tostring) + " | "
          + (.failed | tostring) + " | " + (.running | tostring) + " |") | join("\n")) + "\n\n"
      + "## Replays\n\n| Original | Replay | Wave | Mode | Restart at |\n| --- | --- | --- | --- | --- |\n"
      + ($i.ledger.replays | map("| `" + .root + "` | `" + .replay + "` | " + .wave + " | " + .mode + " | " + ((.start // "first task") | tostring) + " |") | join("\n"))
      + (if ($i.ledger.skipped | length) > 0 then
          "\n\n## Skipped\n\n" + ($i.ledger.skipped | map("- `" + .root + "`: " + .why) | join("\n")) else "" end) + "\n"
  # Pebble keeps '\n' in a string literal as a backslash and an n, so texts turn it into a line break here.
  slack_jq: |
    def nl: gsub("\\\\n"; "\n");
    . as $i
    | ({OPENED: ":rotating_light:", REGRESSED: ":repeat:", FIX: ":wrench:", PLAN: ":clipboard:", APPROVAL: ":raised_hand:",
        CANARY: ":hatching_chick:", STOPPED: ":octagonal_sign:", FINISHED: ":white_check_mark:", PARTIAL: ":warning:",
        DISMISSED: ":see_no_evil:", HALTED: ":double_vertical_bar:", VERIFIED: ":trophy:", MERGED: ":link:",
        BREAKPOINT: ":mag:"}[$i.kind] // ":information_source:") as $icon
    | {text: ($icon + " " + $i.title),
       blocks: ([{type: "header", text: {type: "plain_text", text: ($i.title | .[0:150])}},
                 {type: "section", text: {type: "mrkdwn", text: ($i.text | nl | .[0:2900])}}]
         + (if (($i.fields // []) | length) > 0
            then [{type: "section", fields: ($i.fields | .[0:10] | map({type: "mrkdwn", text: (tostring | nl | .[0:1900])}))}] else [] end)
         + (if ($i.url // "") != ""
            then [{type: "actions", elements: [{type: "button", text: {type: "plain_text", text: ($i.button // "Open in Kestra")}, url: $i.url}]}]
            else [] end)
         + [{type: "context", elements: [{type: "mrkdwn", text: ("incident `" + ($i.card.id // "") + "` | `"
             + ($i.card.namespace // "") + "." + ($i.card.flowId // "") + "` | task `" + ($i.card.taskId // "") + "`")}]}])}
  # A DURATION input renders as seconds, such as "7200.0"; an ISO duration such as PT2H is accepted too.
  duration_jq: |
    (.d | tostring) as $s
    | if ($s | test("^[0-9]+([.][0-9]+)?$")) then ($s | tonumber | floor)
      else (($s | capture("^P((?<d>[0-9]+)D)?(T((?<h>[0-9]+)H)?((?<m>[0-9]+)M)?((?<s>[0-9]+)([.][0-9]+)?S)?)?$") // {}) as $c
        | (($c.d // "0") | tonumber) * 86400 + (($c.h // "0") | tonumber) * 3600 + (($c.m // "0") | tonumber) * 60
          + (($c.s // "0") | tonumber)) end
  cards_jq: |
    [.[] | select(type == "object" and (.id | type) == "string")] | sort_by(.opened_at // "")
  open_cards_jq: |
    map(select((.status // "") | test("^(OPEN|REGRESSED|PARTIAL|INTERRUPTED|IN_CAMPAIGN|RESOLVED)$")))
    | map({id, status, namespace, flowId, campaign: (.campaign // null), fix_candidate_revision: (.fix_candidate_revision // 0),
           resolved_at: (.resolved_at // null), resolved_revision: (.resolved_revision // 0)})
  # Replayable revisions first, so the canary is an execution the campaign can actually replay.
  order_jq: |
    ((.previews // []) | map({key: (.revision | tostring), value: .mode}) | from_entries) as $m
    | (.candidates // [])
    | sort_by([((($m[(.last_revision | tostring)] // "TASK") | (. == "TASK" or . == "FROM_START")) | not), .started])
  previews_list_jq: |
    to_entries | map({revision: (.key | tonumber), count: .value.count, example: .value.example}) | sort_by(.revision)
  ledger_jq: |
    (.ledger // {replays: [], skipped: [], waves: [], stop: false, reason: "", previews: []}) as $l
    | if .kind == "replay" then $l + {replays: (($l.replays // []) + [.add])}
      elif .kind == "skip" then $l + {skipped: (($l.skipped // []) + [.add])}
      elif .kind == "wave" then $l + {waves: (($l.waves // []) + [.add]), stop: (.add.stop // false), reason: (.add.reason // "")}
      elif .kind == "preview" then $l + {previews: (($l.previews // []) + [.add])}
      elif .kind == "stop" then $l + {stop: true, reason: .add.reason, halted: (.add.halted // false)}
      elif .kind == "flag" then $l + .add
      elif .kind == "skips" then $l + {skipped: (($l.skipped // []) + .add)}
      else $l end
  # Every flow a successful replay can start, walked from this flow along Flow trigger and Subflow edges.
  # The engine itself is left out: its Flow trigger only reacts to failures.
  downstream_jq: |
    . as $i
    | (($i.graph.nodes // []) | map({key: .uid, value: (.namespace + "." + .id)}) | from_entries) as $name
    | ($i.graph.edges // []) as $E
    | ([$name | to_entries[] | select(.value == $i.self) | .key] | .[0] // null) as $me
    | [$name | to_entries[] | select(.value == ($i.engine // "")) | .key] as $engine
    | if $me == null then [] else
        {seen: ([$me] + $engine), frontier: [$me], out: []}
        | until((.frontier | length) == 0;
            . as $st
            | [$E[] | select(.source as $x | ($st.frontier | index($x)) != null) | select(.target as $y | ($st.seen | index($y)) == null)] as $next
            | {seen: (($st.seen + ($next | map(.target))) | unique), frontier: ($next | map(.target) | unique),
               out: ($st.out + ($next | map({to: .target, from: .source, relation: (.relation // "")})))})
        | .out | unique_by(.to)
        | map(($name[.to] // .to) + " (" + (.relation | ascii_downcase | gsub("_"; " "))
            + (if .from == $me then "" else ", through " + ($name[.from] // .from) end) + ")")
      end
  task_ids_jq: |
    [(.tasks, .errors, .finally, .afterExecution) | .. | objects
      | select((.id | type) == "string" and (.type | type) == "string" and (.type | contains("."))) | .id]
  merge_targets_jq: |
    . as $i
    | [($i.page.results // [])[] | select(.namespace == $i.ns and .flowId == $i.flow)
        | {id: .id, labels: ((.labels // []) | map(select((.key | startswith("system.")) | not)))}]
  # Seconds until the replay window opens, 0 inside it or without a window. A window may wrap past midnight.
  window_jq: |
    def secs: split(":") | map(tonumber) | (.[0] * 3600 + .[1] * 60 + (.[2] // 0));
    if (.window // "") == "" then 0 else
      (.window | split("-")) as $w
      | (.now | secs) as $n | ($w[0] | secs) as $s | ($w[1] | secs) as $e
      | (if $s <= $e then ($n >= $s and $n < $e) else ($n >= $s or $n < $e) end) as $inside
      | if $inside then 0 else (($s - $n + 86400) % 86400) end
    end
  # The approver can drop executions and change the wave size before the first replay.
  approved_plan_jq: |
    . as $i
    | (($i.skip // "") | split(",") | map(gsub("\\s"; "")) | map(select(length > 0))) as $drop
    | [($i.candidates // [])[] | select(. as $c | (($drop | index($c.root)) == null) and (($drop | index($c.last)) == null))] as $keep
    | {candidates: $keep,
       dropped: [($i.candidates // [])[] | select(. as $c | ($drop | index($c.root)) != null or ($drop | index($c.last)) != null)
         | {root: .root, why: "dropped at approval"}],
       unknown: [$drop[] | . as $d | select(([($i.candidates // [])[] | select(.root == $d or .last == $d)] | length) == 0)]}
  retire_jq: |
    . as $i
    | [($i.cards // [])[] | select((.status // "") | test("^(VERIFIED|DISMISSED|MERGED)$"))
        | select(((.updated_at // .opened_at // "") | tostring | .[0:19]) < $i.cutoff) | .id]
  never_jq: |
    ((.inputs // []) + [(.labels // [])[] | select(.key == "fix-forward.never-rerun") | .value | split(",")[] | gsub("\\s"; "")])
    | map(select(length > 0)) | unique
  busy_jq: |
    . as $i | [($i.page.results // [])[] | select(.namespace == $i.ns and .flowId == $i.flow)] | length
  explain_md_jq: |
    . as $i
    | ($i.chain // {}) as $c
    | "# Execution " + $i.fp.execution_id + "\n\n"
      + "- Flow: `" + $i.fp.namespace + "." + $i.fp.flow_id + "`, revision " + ($i.fp.revision | tostring) + ", state " + $i.fp.state + "\n"
      + "- Failing task: `" + $i.fp.task_id + "`\n"
      + "- Signature: `" + ($i.fp.signature | gsub("`"; "'")) + "`\n"
      + "- Incident: `" + $i.incident + "`" + (if $i.card == null then " (no card yet: the trigger has not seen it, run SCAN or WATCH)" else ", " + ($i.card.status // "?") end) + "\n"
      + "- Chain: " + (if $c == {} then "not found" else ($c.status + ", " + ($c.members | tostring) + " executions, latest `" + $c.last + "` " + $c.last_state
          + (if $c.moved_to != null then ", moved to " + $c.moved_to else "" end)) end) + "\n"
      + "- On the latest revision " + ($i.target | tostring) + ": " + $i.point.mode
      + (if $i.point.start != null then " from task `" + $i.point.start + "`" else "" end) + "\n"
      + "  - " + ($i.point.reasons | join("\n  - ")) + "\n"
      + (if (($i.point.reruns // []) | length) > 0 then "- Tasks that would run again: " + ($i.point.reruns | join(", ")) + "\n" else "" end)
      + (if (($i.point.side_effects // []) | length) > 0 then "- Of those, acting on another system: " + ($i.point.side_effects | map(.id) | join(", ")) + "\n" else "" end)
      + "\n" + ({CANDIDATE: "A REPLAY of the incident replays it.", RESOLVED: "It is fixed: an execution of its chain succeeded.",
          SUPERSEDED: "A later successful run with the same inputs or schedule date already redid it; set include_superseded to replay it anyway.",
          FAILED_ON_TARGET: "It already failed again on the target revision; a REPLAY skips it unless fixed_outside_flow is set.",
          IN_FLIGHT: "An execution of its chain is still running.", MOVED: "Its latest replay failed with another error, see the other incident."}[$c.status // ""]
          // "") + "\n"
  wave_ids_jq: |
    .wave as $w | [(.ledger.replays // [])[] | select(.wave == $w) | .replay]
  plan_summary_jq: |
    . as $i
    | ($i.previews // []) as $pv
    | ($pv | map({key: .mode, value: .count}) | group_by(.key) | map({key: .[0].key, value: (map(.value) | add)}) | from_entries) as $est
    | ([$pv[] | select(.mode == "TASK" or .mode == "FROM_START")] | length) as $replayable
    | {estimate: $est,
       blockers: (
         (if ($i.plan.candidates | length) == 0 then ["no execution of this incident needs a replay ("
            + ([$i.plan.counts | to_entries[] | .key + " " + (.value | tostring)] | join(", ") | if . == "" then "none found" else . end) + ")"] else [] end)
         + (if ($i.plan.candidates | length) > 0 and $replayable == 0 then
             ["revision " + ($i.target | tostring) + " gives no execution a restart point (" + ([$est | to_entries[] | .key + " " + (.value | tostring)] | join(", "))
              + "): deploy the fix, set fixed_outside_flow when the cause was outside the flow, or allow_from_start"] else [] end)
         + (if $i.breakpoint_ok == false then ["canary_breakpoint " + $i.breakpoint + " is not a task of revision " + ($i.target | tostring)] else [] end)
         + (if $i.members_total > 1000 then ["more than 1,000 executions carry this incident and the engine reads one page of 1,000"] else [] end)
         + (if $i.replays_total > 1000 then ["the flow has more than 1,000 replays since the incident started and the engine reads one page of 1,000"] else [] end)),
       warnings: (
         (if $i.plan.overflow > 0 then [($i.plan.overflow | tostring) + " more executions wait for the next campaign (max_chains " + ($i.max | tostring) + ")"] else [] end)
         + ([$pv[] | select(.mode == "HOLD") | (.count | tostring) + " executions that failed on revision " + (.revision | tostring) + " are held: " + (.reasons | join("; "))])
         + ([$pv[] | select(.mode == "NO_FIX") | (.count | tostring) + " executions that failed on revision " + (.revision | tostring) + " are skipped: " + (.reasons | join("; "))])
         + ([$pv[] | select(.mode == "FROM_START") | (.count | tostring) + " executions that failed on revision " + (.revision | tostring) + " replay from the first task and run again: " + ((.reruns // []) | join(", "))])
         + (if (($i.plan.moved // []) | length) > 0 then ["some replays failed with another error and moved to " + ($i.plan.moved | join(", "))] else [] end)
         + (if $i.target < ([$pv[] | .revision] | max // 0) then ["the target revision " + ($i.target | tostring) + " is older than a revision these executions failed on"] else [] end)
         + (if $i.wins_total > 1000 then ["the flow succeeded more than 1,000 times since the incident started; superseded runs are only detected among the first 1,000"] else [] end)
         + (if ($i.card.status // "") == "IN_CAMPAIGN" then ["campaign " + ($i.card.campaign // "?") + " is running for this incident"] else [] end)
         + ([$pv[] | select((.mode == "TASK" or .mode == "FROM_START") and ((.side_effects // []) | length) > 0)
             | (.count | tostring) + " executions that failed on revision " + (.revision | tostring) + " run again tasks that act on another system: "
               + (.side_effects | map(.id + " (" + .type + ")") | join(", ")) + "; list them in never_rerun to hold those executions instead"])
         + (if $i.strict then ["the flow runs at most " + ($i.limit | tostring) + " executions at once and its concurrency behavior "
             + $i.behavior + " drops the others, so waves hold at most " + ($i.limit | tostring) + " replays and each wave waits until the flow is idle"] else [] end)
         + (if (($i.downstream // []) | length) > 0 then ["each successful replay can start downstream flows: " + ($i.downstream | join(", "))] else [] end)),
       downstream: ($i.downstream // [])}

tasks:
  - id: check_inputs
    type: io.kestra.plugin.core.output.OutputValues
    description: Collects every input problem, so one run reports all of them before anything is read or written.
    values:
      problems: >-
        {{ {'action': inputs.action, 'incident': inputs.incident ?? '', 'trigger_exec': trigger.executionId ?? '',
        'execution_id': inputs.execution_id ?? '', 'wave_size': inputs.wave_size, 'canary': inputs.canary_count,
        'budget': inputs.max_failure_percent, 'max': inputs.max_chains, 'adopt': inputs.adopt_days, 'verify': inputs.verify_hours,
        'retention': inputs.retention_days,
        'merge_from': inputs.merge_from ?? '', 'after': (inputs.failed_after ?? null) == null ? '' : (inputs.failed_after | date("yyyy-MM-dd'T'HH:mm:ss", timeZone='UTC')), 'before': (inputs.failed_before ?? null) == null ? '' : (inputs.failed_before | date("yyyy-MM-dd'T'HH:mm:ss", timeZone='UTC'))}
        | jq(vars.checks_jq) | first | toJson }}

  - id: stop_on_input_problems
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ fromJson(outputs.check_inputs.values.problems) | length > 0 }}"
    errorMessage: "Invalid inputs, nothing was read or written: {{ fromJson(outputs.check_inputs.values.problems) | join('; ') }}"

  - id: context
    type: io.kestra.plugin.core.output.OutputValues
    description: The API and UI base of this instance, and the execution a WATCH run looks at.
    values:
      api: "{{ inputs.kestra_url }}/api/v1{{ (inputs.tenant ?? '') == '' ? '' : '/' ~ inputs.tenant }}"
      ui: "{{ inputs.kestra_url }}/ui/{{ (inputs.tenant ?? '') == '' ? 'main' : inputs.tenant }}"
      self_ui: >-
        {{ inputs.kestra_url }}/ui/{{ (inputs.tenant ?? '') == '' ? 'main' : inputs.tenant }}/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}
      watch_execution: "{{ trigger.executionId ?? inputs.execution_id ?? '' }}"
      card_key: "fix-forward.incident.{{ inputs.incident ?? '' }}"
      window_after: >-
        {{ (inputs.failed_after ?? null) == null ? '' : (inputs.failed_after | date("yyyy-MM-dd'T'HH:mm:ss", timeZone='UTC')) }}
      window_before: >-
        {{ (inputs.failed_before ?? null) == null ? '' : (inputs.failed_before | date("yyyy-MM-dd'T'HH:mm:ss", timeZone='UTC')) }}
      scratch_key: "fix-forward.scratch.{{ execution.id }}"

  - id: set_labels
    type: io.kestra.plugin.core.execution.Labels
    description: Every engine run is labeled with its action, and with its incident when it has one.
    labels:
      fix-forward.action: "{{ inputs.action }}"
      fix-forward.for-incident: "{{ inputs.incident ?? 'none' }}"

  # ------------------------------------------------------------------ WATCH: fingerprint one failed execution
  - id: watch
    type: io.kestra.plugin.core.flow.If
    description: >-
      Started by on_failure for each failed execution of a flow labeled fix-forward=watch, or by SCAN for a failure
      no WATCH saw. Fingerprints the failure, labels the execution with its incident and opens or reopens the
      incident card. Several WATCH runs can run at once: a KV key written with overwrite false decides which one
      opens the card and sends the alert.
    condition: "{{ inputs.action == 'WATCH' }}"
    then:
      - id: w_execution
        type: io.kestra.plugin.core.http.Download
        uri: "{{ outputs.context.values.api }}/executions/{{ outputs.context.values.watch_execution }}"
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT1M
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT20S
          maxDuration: PT2M
      - id: w_logs
        type: io.kestra.plugin.core.http.Download
        uri: "{{ outputs.context.values.api }}/logs/{{ outputs.context.values.watch_execution }}?minLevel=ERROR"
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT1M
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT20S
          maxDuration: PT2M
      - id: w_fingerprint
        type: io.kestra.plugin.core.output.OutputValues
        values:
          fp: >-
            {{ {'exec': fromJson(read(outputs.w_execution.uri)), 'logs': fromJson(read(outputs.w_logs.uri))}
            | jq(vars.fingerprint_jq) | first | toJson }}
      - id: w_incident
        type: io.kestra.plugin.core.output.OutputValues
        description: The incident id is a hash of the namespace, the flow, the failing task and the signature.
        values:
          id: >-
            ff-{{ (fromJson(outputs.w_fingerprint.values.fp).namespace ~ '/' ~ fromJson(outputs.w_fingerprint.values.fp).flow_id
            ~ '/' ~ fromJson(outputs.w_fingerprint.values.fp).task_id ~ '/' ~ fromJson(outputs.w_fingerprint.values.fp).signature)
            | sha256 | slice(0, 12) }}
          relevant: >-
            {{ fromJson(outputs.w_fingerprint.values.fp).state == 'FAILED'
            and not (fromJson(outputs.w_fingerprint.values.fp).namespace == flow.namespace and fromJson(outputs.w_fingerprint.values.fp).flow_id == flow.id) }}
      - id: w_alias
        type: io.kestra.plugin.core.kv.Get
        key: "fix-forward.incident.{{ outputs.w_incident.values.id }}"
        errorOnMissing: false
      - id: w_target
        type: io.kestra.plugin.core.output.OutputValues
        description: An incident merged into another one sends its new failures there.
        values:
          id: >-
            {{ ((outputs.w_alias.value ?? {}).status ?? '') == 'MERGED' ? outputs.w_alias.value.merged_into : outputs.w_incident.values.id }}
      - id: w_handle
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.w_incident.values.relevant == 'true' }}"
        then:
          - id: w_label_execution
            type: io.kestra.plugin.core.http.Request
            description: >-
              Labels the failed execution with its incident. The labels endpoint replaces every non-system label, so
              the existing ones are sent back with it. A replay of this execution inherits the label.
            runIf: "{{ (fromJson(outputs.w_fingerprint.values.fp).incident_label ?? '') != outputs.w_target.values.id }}"
            uri: "{{ outputs.context.values.api }}/executions/{{ fromJson(outputs.w_fingerprint.values.fp).execution_id }}/actions/labels"
            method: POST
            contentType: application/json
            body: >-
              {{ {'labels': fromJson(outputs.w_fingerprint.values.fp).labels, 'set': {'fix-forward.incident': outputs.w_target.values.id}}
              | jq(vars.labels_jq) | first | toJson }}
            headers:
              Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
            timeout: PT1M
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT20S
              maxDuration: PT2M
          - id: w_tag_run
            type: io.kestra.plugin.core.execution.Labels
            labels:
              fix-forward.for-incident: "{{ outputs.w_target.values.id }}"
          - id: w_card
            type: io.kestra.plugin.core.kv.Get
            key: "fix-forward.incident.{{ outputs.w_target.values.id }}"
            errorOnMissing: false
          - id: w_decide
            type: io.kestra.plugin.core.output.OutputValues
            description: >-
              NEW opens a card. A failure of a RESOLVED incident on the resolved revision or later reopens it as
              REGRESSED, and any failure of a DISMISSED incident reopens it as OPEN.
            values:
              transition: >-
                {% set c = outputs.w_card.value ?? {} %}{% set fp = fromJson(outputs.w_fingerprint.values.fp) %}{{
                (c.id ?? '') == '' ? 'NEW'
                : (((c.status == 'RESOLVED' or c.status == 'VERIFIED') and fp.revision >= (c.resolved_revision ?? 0)) ? 'REGRESSED'
                : (c.status == 'DISMISSED' ? 'REOPENED' : 'NONE')) }}
              claim_key: >-
                {% set c = outputs.w_card.value ?? {} %}fix-forward.claim.{{ outputs.w_target.values.id }}.{{ c.version ?? 0 }}
          - id: w_transition
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.w_decide.values.transition != 'NONE' }}"
            then:
              - id: w_claim
                type: io.kestra.plugin.core.kv.Set
                description: Only one concurrent WATCH run can write this key, and that run opens the card and alerts.
                key: "{{ outputs.w_decide.values.claim_key }}"
                value: "{{ execution.id }}"
                overwrite: false
                ttl: P7D
                allowFailure: true
              - id: w_claim_read
                type: io.kestra.plugin.core.kv.Get
                key: "{{ outputs.w_decide.values.claim_key }}"
                errorOnMissing: false
              - id: w_won
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.w_claim_read.value ?? '') == execution.id }}"
                then:
                  - id: w_write_card
                    type: io.kestra.plugin.core.kv.Set
                    key: "fix-forward.incident.{{ outputs.w_target.values.id }}"
                    kvType: JSON
                    value: >-
                      {% set fp = fromJson(outputs.w_fingerprint.values.fp) %}{% set t = outputs.w_decide.values.transition %}{{ {
                      'card': outputs.w_card.value ?? {}, 'now': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')),
                      'set': t == 'NEW' ? {'id': outputs.w_target.values.id, 'status': 'OPEN', 'namespace': fp.namespace,
                        'flowId': fp.flow_id, 'taskId': fp.task_id, 'signature': fp.signature, 'sample': fp.sample,
                        'opened_at': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')), 'first_execution': fp.execution_id, 'first_started': fp.started,
                        'first_failed_revision': fp.revision, 'version': 1}
                      : {'status': t == 'REGRESSED' ? 'REGRESSED' : 'OPEN', 'reopened_at': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')), 'reopened_by': fp.execution_id,
                        'reopened_on_revision': fp.revision, 'fix_candidate_revision': null,
                        'version': ((outputs.w_card.value ?? {}).version ?? 0) + 1},
                      'event': {'event': t == 'NEW' ? 'opened' : (t == 'REGRESSED' ? 'failed again on the resolved revision' : 'failed again after it was dismissed'),
                        'execution': fp.execution_id, 'revision': fp.revision}} | jq(vars.card_jq) | first | toJson }}
                  - id: w_alert
                    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                    runIf: "{{ inputs.notify }}"
                    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                    payload: >-
                      {% set fp = fromJson(outputs.w_fingerprint.values.fp) %}{% set t = outputs.w_decide.values.transition %}{{ {
                      'kind': t == 'NEW' ? 'OPENED' : 'REGRESSED',
                      'title': (t == 'NEW' ? 'New failure in ' : (t == 'REGRESSED' ? 'Regression in ' : 'Dismissed failure is back in ')) ~ fp.namespace ~ '.' ~ fp.flow_id,
                      'text': 'Task `' ~ fp.task_id ~ '` failed on revision ' ~ fp.revision ~ ':\n```' ~ (fp.sample | abbreviate(600)) ~ '```\n'
                        ~ 'Executions with the same error join incident `' ~ outputs.w_target.values.id ~ '`. Deploy the fix, then run the engine with '
                        ~ '`action: PLAN` and `incident: ' ~ outputs.w_target.values.id ~ '`.',
                      'url': outputs.context.values.ui ~ '/executions/' ~ fp.namespace ~ '/' ~ fp.flow_id ~ '/' ~ fp.execution_id,
                      'button': 'Open the failed execution',
                      'card': {'id': outputs.w_target.values.id, 'namespace': fp.namespace, 'flowId': fp.flow_id, 'taskId': fp.task_id}}
                      | jq(vars.slack_jq) | first | toJson }}
                    allowFailure: true
          - id: w_result
            type: io.kestra.plugin.core.output.OutputValues
            values:
              summary: >-
                {{ {'action': 'WATCH', 'execution': fromJson(outputs.w_fingerprint.values.fp).execution_id,
                'incident': outputs.w_target.values.id, 'transition': outputs.w_decide.values.transition,
                'task': fromJson(outputs.w_fingerprint.values.fp).task_id, 'signature': fromJson(outputs.w_fingerprint.values.fp).signature} | toJson }}
      - id: w_ignored
        type: io.kestra.plugin.core.log.Log
        runIf: "{{ outputs.w_incident.values.relevant != 'true' }}"
        message: >-
          Execution {{ outputs.context.values.watch_execution }} is {{ fromJson(outputs.w_fingerprint.values.fp).state }}
          or belongs to this engine, so it is not fingerprinted.

  # ------------------------------------------------------------------ incident cards, shared by SCAN and STATUS
  - id: cards
    type: io.kestra.plugin.core.flow.If
    condition: "{{ ['SCAN', 'STATUS'] contains inputs.action }}"
    then:
      - id: c_keys
        type: io.kestra.plugin.core.kv.GetKeys
        prefix: fix-forward.incident.
      - id: c_all
        type: io.kestra.plugin.core.output.OutputValues
        values:
          cards: >-
            [{% for k in (outputs.c_keys.keys ?? []) %}{{ loop.index > 0 ? ',' : '' }}{{ kv(k, errorOnMissing=false) | toJson }}{% endfor %}]

  # ------------------------------------------------------------------ SCAN: adopt missed failures, spot fixes, find stuck campaigns
  - id: scan
    type: io.kestra.plugin.core.flow.If
    description: >-
      Started by the scan schedule. Starts a WATCH run for each recent failure of a watched flow that no WATCH run
      labeled, tells an incident that a newer revision of its flow exists, and marks a campaign whose engine run
      ended without closing it as INTERRUPTED.
    condition: "{{ inputs.action == 'SCAN' }}"
    then:
      - id: s_failed
        type: io.kestra.plugin.core.http.Download
        uri: >-
          {{ outputs.context.values.api }}/executions/search?page=1&size=500&sort=state.startDate:desc&filters%5Bstate%5D%5BIN%5D=FAILED&filters%5Blabels%5D%5BEQUALS%5D%5Bfix-forward%5D=watch&filters%5BstartDate%5D%5BGREATER_THAN_OR_EQUAL_TO%5D={{ now() | dateAdd(0 - inputs.adopt_days, 'DAYS') | date("yyyy-MM-dd'T'HH:mm:ssXXX") | urlencode }}
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT2M
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT30S
          maxDuration: PT3M
      - id: s_unlabeled
        type: io.kestra.plugin.core.output.OutputValues
        values:
          ids: >-
            {{ {'page': fromJson(read(outputs.s_failed.uri)), 'engine_ns': flow.namespace, 'engine_flow': flow.id}
            | jq(vars.adopt_jq) | first | toJson }}
      - id: s_adopt
        type: io.kestra.plugin.core.flow.LoopUntil
        description: >-
          Starts one WATCH run per unlabeled failure through the API, because a Subflow task may not start the flow
          it belongs to.
        runIf: "{{ fromJson(outputs.s_unlabeled.values.ids) | length > 0 }}"
        condition: "{{ outputs.s_adopt_item.values.last == 'true' }}"
        failOnMaxReached: true
        checkFrequency:
          maxIterations: 100
          interval: PT0.1S
        tasks:
          - id: s_adopt_item
            type: io.kestra.plugin.core.output.OutputValues
            values:
              id: "{{ fromJson(outputs.s_unlabeled.values.ids)[outputs.s_adopt.iterationCount - 1] }}"
              last: "{{ outputs.s_adopt.iterationCount >= (fromJson(outputs.s_unlabeled.values.ids) | length) }}"
          - id: s_adopt_start
            type: io.kestra.plugin.core.http.Request
            uri: "{{ outputs.context.values.api }}/executions/{{ flow.namespace }}/{{ flow.id }}?wait=false"
            method: POST
            contentType: multipart/form-data
            formData:
              action: WATCH
              execution_id: "{{ outputs.s_adopt_item.values.id }}"
              kestra_url: "{{ inputs.kestra_url }}"
              tenant: "{{ inputs.tenant ?? '' }}"
              notify: "{{ inputs.notify }}"
            headers:
              Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
            timeout: PT1M
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT20S
              maxDuration: PT2M
      - id: s_open
        type: io.kestra.plugin.core.output.OutputValues
        values:
          cards: "{{ fromJson(outputs.c_all.values.cards) | jq(vars.cards_jq) | first | jq(vars.open_cards_jq) | first | toJson }}"
      - id: s_check
        type: io.kestra.plugin.core.flow.LoopUntil
        runIf: "{{ fromJson(outputs.s_open.values.cards) | length > 0 }}"
        condition: "{{ outputs.s_card.values.last == 'true' }}"
        failOnMaxReached: true
        checkFrequency:
          maxIterations: 10000
          interval: PT0.1S
        tasks:
          - id: s_card
            type: io.kestra.plugin.core.output.OutputValues
            values:
              card: "{{ fromJson(outputs.s_open.values.cards)[outputs.s_check.iterationCount - 1] | toJson }}"
              last: "{{ outputs.s_check.iterationCount >= (fromJson(outputs.s_open.values.cards) | length) }}"
          - id: s_campaign_state
            type: io.kestra.plugin.core.flow.If
            condition: "{{ fromJson(outputs.s_card.values.card).status == 'IN_CAMPAIGN' }}"
            then:
              - id: s_campaign_exec
                type: io.kestra.plugin.core.http.Request
                uri: "{{ outputs.context.values.api }}/executions/{{ fromJson(outputs.s_card.values.card).campaign }}"
                headers:
                  Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
                options:
                  allowFailed: true
                timeout: PT1M
              - id: s_mark_interrupted
                type: io.kestra.plugin.core.kv.Set
                description: The campaign run ended without closing its card, so the card is marked INTERRUPTED.
                runIf: >-
                  {{ outputs.s_campaign_exec.code == 404 or (outputs.s_campaign_exec.code == 200
                  and (['SUCCESS', 'WARNING', 'FAILED', 'KILLED', 'CANCELLED'] contains fromJson(outputs.s_campaign_exec.body).state.current)) }}
                key: "fix-forward.incident.{{ fromJson(outputs.s_card.values.card).id }}"
                kvType: JSON
                value: >-
                  {% set c = kv('fix-forward.incident.' ~ fromJson(outputs.s_card.values.card).id) %}{{ {'card': c, 'now': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')),
                  'set': {'status': 'INTERRUPTED', 'version': (c.version ?? 0) + 1},
                  'event': {'event': 'campaign ' ~ (c.campaign ?? '?') ~ ' ended without closing the incident', 'execution': c.campaign ?? ''}}
                  | jq(vars.card_jq) | first | toJson }}
          - id: s_verify
            type: io.kestra.plugin.core.flow.If
            description: A RESOLVED incident without any new failure for verify_hours becomes VERIFIED.
            condition: >-
              {{ fromJson(outputs.s_card.values.card).status == 'RESOLVED' and (fromJson(outputs.s_card.values.card).resolved_at ?? '') != ''
              and ((now() | timestamp) - (fromJson(outputs.s_card.values.card).resolved_at | timestamp)) >= inputs.verify_hours * 3600 }}
            then:
              - id: s_failed_since
                type: io.kestra.plugin.core.http.Download
                uri: >-
                  {{ outputs.context.values.api }}/executions/search?page=1&size=1&filters%5Bstate%5D%5BIN%5D=FAILED&filters%5Blabels%5D%5BEQUALS%5D%5Bfix-forward.incident%5D={{ fromJson(outputs.s_card.values.card).id }}&filters%5BstartDate%5D%5BGREATER_THAN_OR_EQUAL_TO%5D={{ fromJson(outputs.s_card.values.card).resolved_at | urlencode }}
                headers:
                  Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
                timeout: PT1M
              - id: s_mark_verified
                type: io.kestra.plugin.core.kv.Set
                runIf: "{{ (fromJson(read(outputs.s_failed_since.uri)).total ?? 0) == 0 }}"
                key: "fix-forward.incident.{{ fromJson(outputs.s_card.values.card).id }}"
                kvType: JSON
                value: >-
                  {% set c = kv('fix-forward.incident.' ~ fromJson(outputs.s_card.values.card).id) %}{{ {'card': c, 'now': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')),
                  'set': {'status': 'VERIFIED', 'verified_at': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')), 'version': (c.version ?? 0) + 1},
                  'event': {'event': 'no failure for ' ~ inputs.verify_hours ~ ' hours on revision ' ~ (c.resolved_revision ?? '?')}}
                  | jq(vars.card_jq) | first | toJson }}
              - id: s_tell_verified
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                runIf: "{{ inputs.notify and (fromJson(read(outputs.s_failed_since.uri)).total ?? 0) == 0 }}"
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                payload: >-
                  {% set c = fromJson(outputs.s_card.values.card) %}{{ {'kind': 'VERIFIED', 'title': 'Incident ' ~ c.id ~ ' verified',
                  'text': 'No failure with this error for ' ~ inputs.verify_hours ~ ' hours since the campaign resolved it on revision ' ~ c.resolved_revision ~ '.',
                  'card': c} | jq(vars.slack_jq) | first | toJson }}
                allowFailure: true
          - id: s_revision_check
            type: io.kestra.plugin.core.flow.If
            condition: "{{ not (['IN_CAMPAIGN', 'RESOLVED'] contains fromJson(outputs.s_card.values.card).status) }}"
            then:
              - id: s_flow
                type: io.kestra.plugin.core.http.Download
                uri: "{{ outputs.context.values.api }}/flows/{{ fromJson(outputs.s_card.values.card).namespace }}/{{ fromJson(outputs.s_card.values.card).flowId }}"
                headers:
                  Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
                allowFailure: true
                timeout: PT1M
              - id: s_last_failure
                type: io.kestra.plugin.core.http.Download
                uri: >-
                  {{ outputs.context.values.api }}/executions/search?page=1&size=1&sort=state.startDate:desc&filters%5Bstate%5D%5BIN%5D=FAILED&filters%5Blabels%5D%5BEQUALS%5D%5Bfix-forward.incident%5D={{ fromJson(outputs.s_card.values.card).id }}
                headers:
                  Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
                allowFailure: true
                timeout: PT1M
              - id: s_revisions
                type: io.kestra.plugin.core.output.OutputValues
                values:
                  latest: "{{ (outputs.s_flow.uri ?? '') == '' ? 0 : (fromJson(read(outputs.s_flow.uri)).revision ?? 0) }}"
                  failed_on: >-
                    {{ (outputs.s_last_failure.uri ?? '') == '' ? 0 : ((fromJson(read(outputs.s_last_failure.uri)).results ?? []) | length == 0 ? 0
                    : fromJson(read(outputs.s_last_failure.uri)).results[0].flowRevision) }}
              - id: s_fix_candidate
                type: io.kestra.plugin.core.flow.If
                description: A revision newer than the last failure that nobody was told about yet.
                condition: >-
                  {{ (outputs.s_revisions.values.latest | number) > (outputs.s_revisions.values.failed_on | number)
                  and (outputs.s_revisions.values.failed_on | number) > 0
                  and outputs.s_revisions.values.latest != (fromJson(outputs.s_card.values.card).fix_candidate_revision ~ '') }}
                then:
                  - id: s_record_candidate
                    type: io.kestra.plugin.core.kv.Set
                    key: "fix-forward.incident.{{ fromJson(outputs.s_card.values.card).id }}"
                    kvType: JSON
                    value: >-
                      {% set c = kv('fix-forward.incident.' ~ fromJson(outputs.s_card.values.card).id) %}{{ {'card': c, 'now': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')),
                      'set': {'fix_candidate_revision': outputs.s_revisions.values.latest | number, 'version': (c.version ?? 0) + 1},
                      'event': {'event': 'revision ' ~ outputs.s_revisions.values.latest ~ ' was deployed after the last failure on revision ' ~ outputs.s_revisions.values.failed_on}}
                      | jq(vars.card_jq) | first | toJson }}
                  - id: s_auto_plan
                    type: io.kestra.plugin.core.http.Request
                    description: Starts a PLAN run of this flow for the incident, which posts the plan to Slack.
                    runIf: "{{ inputs.auto_plan }}"
                    uri: "{{ outputs.context.values.api }}/executions/{{ flow.namespace }}/{{ flow.id }}?wait=false"
                    method: POST
                    contentType: multipart/form-data
                    formData:
                      action: PLAN
                      incident: "{{ fromJson(outputs.s_card.values.card).id }}"
                      kestra_url: "{{ inputs.kestra_url }}"
                      tenant: "{{ inputs.tenant ?? '' }}"
                      notify: "{{ inputs.notify }}"
                    headers:
                      Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
                    options:
                      allowFailed: true
                    timeout: PT1M
                  - id: s_tell
                    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                    runIf: "{{ inputs.notify }}"
                    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                    payload: >-
                      {% set c = fromJson(outputs.s_card.values.card) %}{{ {'kind': 'FIX',
                      'title': 'Fix candidate for ' ~ c.namespace ~ '.' ~ c.flowId,
                      'text': 'Revision ' ~ outputs.s_revisions.values.latest ~ ' was deployed after the last failure of incident `' ~ c.id
                        ~ '` (revision ' ~ outputs.s_revisions.values.failed_on ~ ').' ~ (inputs.auto_plan ? ' A PLAN run started; its plan follows.'
                        : ' Run the engine with `action: PLAN` and `incident: ' ~ c.id ~ '` to see which executions it would replay and from which task.'),
                      'url': outputs.context.values.ui ~ '/flows/edit/' ~ flow.namespace ~ '/' ~ flow.id,
                      'button': 'Open the engine', 'card': c} | jq(vars.slack_jq) | first | toJson }}
                    allowFailure: true
      - id: s_retired
        type: io.kestra.plugin.core.output.OutputValues
        values:
          ids: >-
            {{ {'cards': fromJson(outputs.c_all.values.cards) | jq(vars.cards_jq) | first,
            'cutoff': now() | dateAdd(0 - inputs.retention_days, 'DAYS') | date("yyyy-MM-dd'T'HH:mm:ss", timeZone='UTC')} | jq(vars.retire_jq) | first | toJson }}
      - id: s_retire
        type: io.kestra.plugin.core.flow.LoopUntil
        description: Deletes the card and the reports of each incident closed longer than retention_days ago.
        runIf: "{{ fromJson(outputs.s_retired.values.ids) | length > 0 }}"
        condition: "{{ outputs.s_retire_item.values.last == 'true' }}"
        failOnMaxReached: true
        checkFrequency:
          maxIterations: 10000
          interval: PT0.1S
        tasks:
          - id: s_retire_item
            type: io.kestra.plugin.core.output.OutputValues
            values:
              id: "{{ fromJson(outputs.s_retired.values.ids)[outputs.s_retire.iterationCount - 1] }}"
              last: "{{ outputs.s_retire.iterationCount >= (fromJson(outputs.s_retired.values.ids) | length) }}"
          - id: s_retire_files
            type: io.kestra.plugin.core.namespace.DeleteFiles
            namespace: "{{ flow.namespace }}"
            files:
              - "fix-forward/{{ outputs.s_retire_item.values.id }}/**"
            allowFailure: true
          - id: s_retire_card
            type: io.kestra.plugin.core.kv.Delete
            key: "fix-forward.incident.{{ outputs.s_retire_item.values.id }}"
            errorOnMissing: false
      - id: s_result
        type: io.kestra.plugin.core.output.OutputValues
        values:
          summary: >-
            {{ {'action': 'SCAN', 'adopted': fromJson(outputs.s_unlabeled.values.ids) | length,
            'open_incidents': fromJson(outputs.s_open.values.cards) | length, 'retired': fromJson(outputs.s_retired.values.ids)} | toJson }}

  # ------------------------------------------------------------------ STATUS: the incident board
  - id: status
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.action == 'STATUS' }}"
    then:
      - id: st_failures
        type: io.kestra.plugin.core.http.Download
        uri: >-
          {{ outputs.context.values.api }}/executions/search?page=1&size=1000&filters%5Bstate%5D%5BIN%5D=FAILED&filters%5Blabels%5D%5BEQUALS%5D%5Bfix-forward%5D=watch&filters%5BstartDate%5D%5BGREATER_THAN_OR_EQUAL_TO%5D={{ now() | dateAdd(-30, 'DAYS') | date("yyyy-MM-dd'T'HH:mm:ssXXX") | urlencode }}
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT2M
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT30S
          maxDuration: PT3M
      - id: st_board
        type: io.kestra.plugin.core.output.OutputValues
        values:
          board: >-
            {{ {'page': fromJson(read(outputs.st_failures.uri)), 'cards': fromJson(outputs.c_all.values.cards) | jq(vars.cards_jq) | first}
            | jq(vars.status_jq) | first | toJson }}
      - id: st_write
        type: io.kestra.plugin.core.storage.Write
        content: "{{ fromJson(outputs.st_board.values.board).markdown }}"
        extension: .md
      - id: st_publish
        type: io.kestra.plugin.core.namespace.UploadFiles
        description: Keeps the board as the namespace file fix-forward/STATUS.md of the engine namespace.
        namespace: "{{ flow.namespace }}"
        filesMap: "{{ {'fix-forward/STATUS.md': outputs.st_write.uri} | toJson }}"
      - id: st_log
        type: io.kestra.plugin.core.log.Log
        message: "{{ fromJson(outputs.st_board.values.board).markdown }}"
      - id: st_tell
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        runIf: "{{ inputs.notify }}"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {% set b = fromJson(outputs.st_board.values.board) %}{{ {'kind': 'PLAN',
          'title': 'Fix-forward board: ' ~ b.open ~ ' open of ' ~ b.count ~ ' incidents',
          'text': '```' ~ (b.excerpt | abbreviate(2600)) ~ '```',
          'fields': ['*Board file*\nfix-forward/STATUS.md'],
          'url': outputs.context.values.self_ui, 'button': 'Open the board run', 'card': {'id': 'all'}} | jq(vars.slack_jq) | first | toJson }}
        allowFailure: true
      - id: st_result
        type: io.kestra.plugin.core.output.OutputValues
        values:
          summary: >-
            {{ {'action': 'STATUS', 'incidents': fromJson(outputs.st_board.values.board).count,
            'open': fromJson(outputs.st_board.values.board).open, 'board': 'fix-forward/STATUS.md'} | toJson }}

  # ------------------------------------------------------------------ incident actions: PLAN, REPLAY, HALT, DISMISS
  - id: incident
    type: io.kestra.plugin.core.flow.If
    condition: "{{ ['PLAN', 'REPLAY', 'HALT', 'DISMISS', 'MERGE'] contains inputs.action }}"
    then:
      - id: i_card
        type: io.kestra.plugin.core.kv.Get
        key: "{{ outputs.context.values.card_key }}"
        errorOnMissing: false
      - id: i_unknown
        type: io.kestra.plugin.core.execution.Fail
        condition: "{{ ((outputs.i_card.value ?? {}).id ?? '') == '' }}"
        errorMessage: Incident {{ inputs.incident }} does not exist. Run the engine with action STATUS to list the incidents.

  - id: dismiss
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.action == 'DISMISS' }}"
    then:
      - id: d_refuse
        type: io.kestra.plugin.core.execution.Fail
        condition: "{{ outputs.i_card.value.status == 'IN_CAMPAIGN' }}"
        errorMessage: Campaign {{ outputs.i_card.value.campaign }} is replaying incident {{ inputs.incident }}. Run HALT first.
      - id: d_write
        type: io.kestra.plugin.core.kv.Set
        key: "{{ outputs.context.values.card_key }}"
        kvType: JSON
        value: >-
          {% set c = kv(outputs.context.values.card_key) %}{{ {'card': c, 'now': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')),
          'set': {'status': 'DISMISSED', 'dismissed_at': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')), 'dismissed_reason': inputs.dismiss_reason, 'dismissed_by': execution.id,
            'version': (c.version ?? 0) + 1},
          'event': {'event': 'dismissed: ' ~ inputs.dismiss_reason, 'execution': execution.id}} | jq(vars.card_jq) | first | toJson }}
      - id: d_tell
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        runIf: "{{ inputs.notify }}"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {{ {'kind': 'DISMISSED', 'title': 'Incident ' ~ inputs.incident ~ ' dismissed',
          'text': 'Closed without a replay: ' ~ inputs.dismiss_reason ~ '\nA new failure with the same error opens it again.',
          'url': outputs.context.values.self_ui, 'card': outputs.i_card.value} | jq(vars.slack_jq) | first | toJson }}
        allowFailure: true
      - id: d_result
        type: io.kestra.plugin.core.output.OutputValues
        values:
          summary: "{{ {'action': 'DISMISS', 'incident': inputs.incident, 'reason': inputs.dismiss_reason} | toJson }}"

  - id: merge
    type: io.kestra.plugin.core.flow.If
    description: >-
      Moves every execution of incident merge_from into incident, for two signatures of one bug. The merged card
      stays as an alias: WATCH sends its later failures to incident.
    condition: "{{ inputs.action == 'MERGE' }}"
    then:
      - id: m_source
        type: io.kestra.plugin.core.kv.Get
        key: "fix-forward.incident.{{ inputs.merge_from }}"
        errorOnMissing: false
      - id: m_refuse
        type: io.kestra.plugin.core.execution.Fail
        condition: >-
          {{ ((outputs.m_source.value ?? {}).id ?? '') == '' or outputs.m_source.value.status == 'MERGED'
          or outputs.m_source.value.namespace != outputs.i_card.value.namespace or outputs.m_source.value.flowId != outputs.i_card.value.flowId
          or outputs.m_source.value.status == 'IN_CAMPAIGN' or outputs.i_card.value.status == 'IN_CAMPAIGN' }}
        errorMessage: >-
          Incident {{ inputs.merge_from }} cannot be merged into {{ inputs.incident }}: both must exist, belong to the same flow,
          and have no campaign running, and {{ inputs.merge_from }} must not be merged already
          ({{ inputs.merge_from }}: {{ (outputs.m_source.value ?? {}).status ?? 'missing' }} on {{ (outputs.m_source.value ?? {}).namespace ?? '?' }}.{{ (outputs.m_source.value ?? {}).flowId ?? '?' }},
          {{ inputs.incident }}: {{ outputs.i_card.value.status }} on {{ outputs.i_card.value.namespace }}.{{ outputs.i_card.value.flowId }}).
      - id: m_members
        type: io.kestra.plugin.core.http.Download
        uri: >-
          {{ outputs.context.values.api }}/executions/search?page=1&size=1000&filters%5Bnamespace%5D%5BEQUALS%5D={{ outputs.i_card.value.namespace }}&filters%5BflowId%5D%5BEQUALS%5D={{ outputs.i_card.value.flowId }}&filters%5Blabels%5D%5BEQUALS%5D%5Bfix-forward.incident%5D={{ inputs.merge_from }}
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT2M
      - id: m_list
        type: io.kestra.plugin.core.output.OutputValues
        values:
          items: >-
            {{ {'page': fromJson(read(outputs.m_members.uri)), 'ns': outputs.i_card.value.namespace, 'flow': outputs.i_card.value.flowId}
            | jq(vars.merge_targets_jq) | first | toJson }}
      - id: m_relabel
        type: io.kestra.plugin.core.flow.LoopUntil
        runIf: "{{ fromJson(outputs.m_list.values.items) | length > 0 }}"
        condition: "{{ outputs.m_item.values.last == 'true' }}"
        failOnMaxReached: true
        checkFrequency:
          maxIterations: 100000
          interval: PT0.1S
        tasks:
          - id: m_item
            type: io.kestra.plugin.core.output.OutputValues
            values:
              item: "{{ fromJson(outputs.m_list.values.items)[outputs.m_relabel.iterationCount - 1] | toJson }}"
              last: "{{ outputs.m_relabel.iterationCount >= (fromJson(outputs.m_list.values.items) | length) }}"
          - id: m_label
            type: io.kestra.plugin.core.http.Request
            uri: "{{ outputs.context.values.api }}/executions/{{ fromJson(outputs.m_item.values.item).id }}/actions/labels"
            method: POST
            contentType: application/json
            body: >-
              {{ {'labels': fromJson(outputs.m_item.values.item).labels, 'set': {'fix-forward.incident': inputs.incident}} | jq(vars.labels_jq) | first | toJson }}
            headers:
              Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
            timeout: PT1M
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT20S
              maxDuration: PT1M
      - id: m_source_card
        type: io.kestra.plugin.core.kv.Set
        key: "fix-forward.incident.{{ inputs.merge_from }}"
        kvType: JSON
        value: >-
          {% set c = kv('fix-forward.incident.' ~ inputs.merge_from) %}{{ {'card': c, 'now': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')),
          'set': {'status': 'MERGED', 'merged_into': inputs.incident, 'merged_at': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')), 'version': (c.version ?? 0) + 1},
          'event': {'event': 'merged into ' ~ inputs.incident ~ ' with ' ~ (fromJson(outputs.m_list.values.items) | length) ~ ' executions', 'execution': execution.id}}
          | jq(vars.card_jq) | first | toJson }}
      - id: m_target_card
        type: io.kestra.plugin.core.kv.Set
        key: "{{ outputs.context.values.card_key }}"
        kvType: JSON
        value: >-
          {% set c = kv(outputs.context.values.card_key) %}{{ {'card': c, 'now': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')),
          'set': {'aliases': ((c.aliases ?? []) + [{'id': inputs.merge_from, 'signature': outputs.m_source.value.signature, 'taskId': outputs.m_source.value.taskId}]),
            'version': (c.version ?? 0) + 1},
          'event': {'event': 'absorbed ' ~ inputs.merge_from ~ ' (' ~ (fromJson(outputs.m_list.values.items) | length) ~ ' executions)', 'execution': execution.id}}
          | jq(vars.card_jq) | first | toJson }}
      - id: m_tell
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        runIf: "{{ inputs.notify }}"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {{ {'kind': 'MERGED', 'title': 'Incident ' ~ inputs.merge_from ~ ' merged into ' ~ inputs.incident,
          'text': (fromJson(outputs.m_list.values.items) | length) ~ ' executions moved. Signature `' ~ (outputs.m_source.value.signature | abbreviate(300))
            ~ '` now counts as incident `' ~ inputs.incident ~ '`.',
          'url': outputs.context.values.self_ui, 'card': outputs.i_card.value} | jq(vars.slack_jq) | first | toJson }}
        allowFailure: true
      - id: m_result
        type: io.kestra.plugin.core.output.OutputValues
        values:
          summary: >-
            {{ {'action': 'MERGE', 'incident': inputs.incident, 'merged': inputs.merge_from,
            'moved': fromJson(outputs.m_list.values.items) | length} | toJson }}

  - id: halt
    type: io.kestra.plugin.core.flow.If
    description: A running campaign reads this key before each wave and stops when it is set.
    condition: "{{ inputs.action == 'HALT' }}"
    then:
      - id: h_set
        type: io.kestra.plugin.core.kv.Set
        runIf: "{{ outputs.i_card.value.status == 'IN_CAMPAIGN' }}"
        key: "fix-forward.halt.{{ inputs.incident }}"
        value: "{{ execution.id }}"
        ttl: P7D
      - id: h_log
        type: io.kestra.plugin.core.log.Log
        message: >-
          {{ outputs.i_card.value.status == 'IN_CAMPAIGN'
          ? 'Campaign ' ~ outputs.i_card.value.campaign ~ ' of incident ' ~ inputs.incident ~ ' stops before its next wave. Replays already started run to their end.'
          : 'No campaign is running for incident ' ~ inputs.incident ~ ' (status ' ~ outputs.i_card.value.status ~ ').' }}
      - id: h_result
        type: io.kestra.plugin.core.output.OutputValues
        values:
          summary: "{{ {'action': 'HALT', 'incident': inputs.incident, 'campaign': outputs.i_card.value.campaign ?? null, 'halted': outputs.i_card.value.status == 'IN_CAMPAIGN'} | toJson }}"

  # ------------------------------------------------------------------ EXPLAIN: one execution, start to end
  - id: explain
    type: io.kestra.plugin.core.flow.If
    description: >-
      Answers "what would the engine do with this execution?": its fingerprint and incident, the chain it belongs
      to, and its restart point on the latest revision of its flow. It writes nothing.
    condition: "{{ inputs.action == 'EXPLAIN' }}"
    then:
      - id: x_execution
        type: io.kestra.plugin.core.http.Download
        uri: "{{ outputs.context.values.api }}/executions/{{ inputs.execution_id }}"
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT1M
      - id: x_logs
        type: io.kestra.plugin.core.http.Download
        uri: "{{ outputs.context.values.api }}/logs/{{ inputs.execution_id }}?minLevel=ERROR"
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT1M
      - id: x_fingerprint
        type: io.kestra.plugin.core.output.OutputValues
        values:
          fp: >-
            {{ {'exec': fromJson(read(outputs.x_execution.uri)), 'logs': fromJson(read(outputs.x_logs.uri))} | jq(vars.fingerprint_jq) | first | toJson }}
      - id: x_incident
        type: io.kestra.plugin.core.output.OutputValues
        values:
          id: >-
            {{ (fromJson(outputs.x_fingerprint.values.fp).incident_label ?? '') != '' ? fromJson(outputs.x_fingerprint.values.fp).incident_label
            : 'ff-' ~ ((fromJson(outputs.x_fingerprint.values.fp).namespace ~ '/' ~ fromJson(outputs.x_fingerprint.values.fp).flow_id
            ~ '/' ~ fromJson(outputs.x_fingerprint.values.fp).task_id ~ '/' ~ fromJson(outputs.x_fingerprint.values.fp).signature) | sha256 | slice(0, 12)) }}
      - id: x_card
        type: io.kestra.plugin.core.kv.Get
        key: "fix-forward.incident.{{ outputs.x_incident.values.id }}"
        errorOnMissing: false
      - id: x_latest
        type: io.kestra.plugin.core.http.Download
        uri: "{{ outputs.context.values.api }}/flows/{{ fromJson(outputs.x_fingerprint.values.fp).namespace }}/{{ fromJson(outputs.x_fingerprint.values.fp).flow_id }}"
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT1M
      - id: x_old
        type: io.kestra.plugin.core.http.Download
        uri: "{{ outputs.context.values.api }}/flows/{{ fromJson(outputs.x_fingerprint.values.fp).namespace }}/{{ fromJson(outputs.x_fingerprint.values.fp).flow_id }}?revision={{ fromJson(outputs.x_fingerprint.values.fp).revision }}"
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT1M
      - id: x_members
        type: io.kestra.plugin.core.http.Download
        uri: >-
          {{ outputs.context.values.api }}/executions/search?page=1&size=1000&sort=state.startDate:asc&filters%5Bnamespace%5D%5BEQUALS%5D={{ fromJson(outputs.x_fingerprint.values.fp).namespace }}&filters%5BflowId%5D%5BEQUALS%5D={{ fromJson(outputs.x_fingerprint.values.fp).flow_id }}&filters%5Blabels%5D%5BEQUALS%5D%5Bfix-forward.incident%5D={{ outputs.x_incident.values.id }}
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT1M
      - id: x_replays
        type: io.kestra.plugin.core.http.Download
        uri: >-
          {{ outputs.context.values.api }}/executions/search?page=1&size=1000&sort=state.startDate:asc&filters%5Bnamespace%5D%5BEQUALS%5D={{ fromJson(outputs.x_fingerprint.values.fp).namespace }}&filters%5BflowId%5D%5BEQUALS%5D={{ fromJson(outputs.x_fingerprint.values.fp).flow_id }}&filters%5Blabels%5D%5BEQUALS%5D%5Bsystem.replay%5D=true&filters%5BstartDate%5D%5BGREATER_THAN_OR_EQUAL_TO%5D={{ fromJson(outputs.x_fingerprint.values.fp).started | urlencode }}
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT1M
      - id: x_wins
        type: io.kestra.plugin.core.http.Download
        uri: >-
          {{ outputs.context.values.api }}/executions/search?page=1&size=1000&sort=state.startDate:asc&filters%5Bnamespace%5D%5BEQUALS%5D={{ fromJson(outputs.x_fingerprint.values.fp).namespace }}&filters%5BflowId%5D%5BEQUALS%5D={{ fromJson(outputs.x_fingerprint.values.fp).flow_id }}&filters%5Bstate%5D%5BIN%5D=SUCCESS,WARNING&filters%5BstartDate%5D%5BGREATER_THAN_OR_EQUAL_TO%5D={{ fromJson(outputs.x_fingerprint.values.fp).started | urlencode }}
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT1M
      - id: x_analysis
        type: io.kestra.plugin.core.output.OutputValues
        values:
          chain: >-
            {% set fp = fromJson(outputs.x_fingerprint.values.fp) %}{{ ({'members': (fromJson(read(outputs.x_members.uri)).results ?? []) + [fromJson(read(outputs.x_execution.uri))],
            'execs': fromJson(read(outputs.x_replays.uri)).results ?? [], 'successes': fromJson(read(outputs.x_wins.uri)).results ?? [],
            'ns': fp.namespace, 'flow': fp.flow_id, 'incident': outputs.x_incident.values.id, 'target': fromJson(read(outputs.x_latest.uri)).revision,
            'warn_ok': inputs.count_warning_as_success, 'fixed_outside': inputs.fixed_outside_flow, 'include_superseded': inputs.include_superseded, 'after': outputs.context.values.window_after, 'before': outputs.context.values.window_before, 'max': 1000000}
            | jq(vars.chains_jq) | first).chains | jq('map(select(.root == "' ~ (fp.original_id ?? fp.execution_id) ~ '")) | .[0] // {}') | first | toJson }}
          point: >-
            {{ {'exec': fromJson(read(outputs.x_execution.uri)), 'old': fromJson(read(outputs.x_old.uri)), 'new': fromJson(read(outputs.x_latest.uri)),
            'target': fromJson(read(outputs.x_latest.uri)).revision, 'policy': inputs.restart_policy, 'allow_from_start': inputs.allow_from_start,
            'fixed_outside': inputs.fixed_outside_flow, 'never': {'inputs': inputs.never_rerun ?? [], 'labels': fromJson(read(outputs.x_latest.uri)).labels ?? []}
            | jq(vars.never_jq) | first} | jq(vars.restart_jq) | first | toJson }}
      - id: x_markdown
        type: io.kestra.plugin.core.output.OutputValues
        values:
          md: >-
            {{ {'fp': fromJson(outputs.x_fingerprint.values.fp), 'incident': outputs.x_incident.values.id, 'card': outputs.x_card.value ?? null,
            'chain': fromJson(outputs.x_analysis.values.chain), 'point': fromJson(outputs.x_analysis.values.point),
            'target': fromJson(read(outputs.x_latest.uri)).revision} | jq(vars.explain_md_jq) | first }}
      - id: x_report
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.x_markdown.values.md }}"
      - id: x_result
        type: io.kestra.plugin.core.output.OutputValues
        values:
          summary: >-
            {{ {'action': 'EXPLAIN', 'execution': inputs.execution_id, 'incident': outputs.x_incident.values.id,
            'incident_status': (outputs.x_card.value ?? {}).status ?? null, 'chain_status': fromJson(outputs.x_analysis.values.chain).status ?? null,
            'restart': fromJson(outputs.x_analysis.values.point), 'explanation': outputs.x_markdown.values.md} | toJson }}

  # ------------------------------------------------------------------ PLAN: chains, restart points, waves (also the first half of REPLAY)
  - id: plan
    type: io.kestra.plugin.core.flow.If
    description: >-
      Reads every execution of the incident and every replay of the flow since the incident started, groups them
      into chains (an original execution and its replays) and decides, per chain, whether it still needs a replay.
      For each flow revision the remaining executions failed on, it computes the restart point on the target
      revision and explains it.
    condition: "{{ ['PLAN', 'REPLAY'] contains inputs.action }}"
    then:
      - id: p_latest
        type: io.kestra.plugin.core.http.Download
        uri: "{{ outputs.context.values.api }}/flows/{{ outputs.i_card.value.namespace }}/{{ outputs.i_card.value.flowId }}"
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT1M
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT20S
          maxDuration: PT2M
      - id: p_target
        type: io.kestra.plugin.core.output.OutputValues
        values:
          latest: "{{ fromJson(read(outputs.p_latest.uri)).revision }}"
          target: "{{ inputs.target_revision ?? fromJson(read(outputs.p_latest.uri)).revision }}"
      - id: p_bad_target
        type: io.kestra.plugin.core.execution.Fail
        condition: "{{ (outputs.p_target.values.target | number) < 1 or (outputs.p_target.values.target | number) > (outputs.p_target.values.latest | number) }}"
        errorMessage: >-
          target_revision {{ outputs.p_target.values.target }} does not exist: {{ outputs.i_card.value.namespace }}.{{ outputs.i_card.value.flowId }}
          has revisions 1 to {{ outputs.p_target.values.latest }}.
      - id: p_target_def
        type: io.kestra.plugin.core.http.Download
        uri: "{{ outputs.context.values.api }}/flows/{{ outputs.i_card.value.namespace }}/{{ outputs.i_card.value.flowId }}?revision={{ outputs.p_target.values.target }}"
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT1M
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT20S
          maxDuration: PT2M
      - id: p_concurrency
        type: io.kestra.plugin.core.output.OutputValues
        description: >-
          Replays obey the concurrency of the flow. With behavior CANCEL or FAIL, replays beyond the limit would be
          dropped, so waves hold at most limit replays and each wave waits until the flow is idle.
        values:
          limit: "{{ fromJson(read(outputs.p_target_def.uri)).concurrency.limit ?? 0 }}"
          behavior: "{{ fromJson(read(outputs.p_target_def.uri)).concurrency.behavior ?? 'QUEUE' }}"
          strict: >-
            {{ (fromJson(read(outputs.p_target_def.uri)).concurrency.limit ?? 0) > 0
            and (fromJson(read(outputs.p_target_def.uri)).concurrency.behavior ?? 'QUEUE') != 'QUEUE' }}
          wave_size: >-
            {{ ((fromJson(read(outputs.p_target_def.uri)).concurrency.limit ?? 0) > 0 and (fromJson(read(outputs.p_target_def.uri)).concurrency.behavior ?? 'QUEUE') != 'QUEUE'
            and inputs.wave_size > fromJson(read(outputs.p_target_def.uri)).concurrency.limit) ? fromJson(read(outputs.p_target_def.uri)).concurrency.limit : inputs.wave_size }}
          canary: >-
            {{ ((fromJson(read(outputs.p_target_def.uri)).concurrency.limit ?? 0) > 0 and (fromJson(read(outputs.p_target_def.uri)).concurrency.behavior ?? 'QUEUE') != 'QUEUE'
            and inputs.canary_count > fromJson(read(outputs.p_target_def.uri)).concurrency.limit) ? fromJson(read(outputs.p_target_def.uri)).concurrency.limit : inputs.canary_count }}
      - id: p_rules
        type: io.kestra.plugin.core.output.OutputValues
        description: Tasks never to run twice, from the never_rerun input and the fix-forward.never-rerun label of the flow.
        values:
          never: >-
            {{ {'inputs': inputs.never_rerun ?? [], 'labels': fromJson(read(outputs.p_target_def.uri)).labels ?? []} | jq(vars.never_jq) | first | toJson }}
      - id: p_breakpoint
        type: io.kestra.plugin.core.output.OutputValues
        values:
          ok: >-
            {{ (inputs.canary_breakpoint ?? '') == '' or ((fromJson(read(outputs.p_target_def.uri)) | jq(vars.task_ids_jq) | first) contains inputs.canary_breakpoint) }}
      - id: p_downstream
        type: io.kestra.plugin.core.http.Download
        description: Flows that a successful replay starts, through Flow triggers or Subflow tasks, recursively.
        uri: "{{ outputs.context.values.api }}/flows/{{ outputs.i_card.value.namespace }}/{{ outputs.i_card.value.flowId }}/dependencies?destinationOnly=false&expandAll=true"
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        allowFailure: true
        timeout: PT1M
      - id: p_members
        type: io.kestra.plugin.core.http.Download
        description: The executions labeled with the incident, originals and the replays that inherited the label.
        uri: >-
          {{ outputs.context.values.api }}/executions/search?page=1&size=1000&sort=state.startDate:asc&filters%5Bnamespace%5D%5BEQUALS%5D={{ outputs.i_card.value.namespace }}&filters%5BflowId%5D%5BEQUALS%5D={{ outputs.i_card.value.flowId }}&filters%5Blabels%5D%5BEQUALS%5D%5Bfix-forward.incident%5D={{ inputs.incident }}
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT2M
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT30S
          maxDuration: PT3M
      - id: p_since
        type: io.kestra.plugin.core.output.OutputValues
        values:
          start: >-
            {{ (fromJson(read(outputs.p_members.uri)).results ?? []) | length == 0 ? (outputs.i_card.value.first_started ?? (now() | date("yyyy-MM-dd'T'HH:mm:ssXXX")))
            : fromJson(read(outputs.p_members.uri)).results[0].state.startDate }}
          members_total: "{{ fromJson(read(outputs.p_members.uri)).total ?? 0 }}"
      - id: p_related
        type: io.kestra.plugin.core.flow.Parallel
        tasks:
          - id: p_replays
            type: io.kestra.plugin.core.http.Download
            description: Every replay of the flow since the incident started, including the ones a later WATCH moved to another incident.
            uri: >-
              {{ outputs.context.values.api }}/executions/search?page=1&size=1000&sort=state.startDate:asc&filters%5Bnamespace%5D%5BEQUALS%5D={{ outputs.i_card.value.namespace }}&filters%5BflowId%5D%5BEQUALS%5D={{ outputs.i_card.value.flowId }}&filters%5Blabels%5D%5BEQUALS%5D%5Bsystem.replay%5D=true&filters%5BstartDate%5D%5BGREATER_THAN_OR_EQUAL_TO%5D={{ outputs.p_since.values.start | urlencode }}
            headers:
              Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
            timeout: PT2M
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT30S
              maxDuration: PT3M
          - id: p_wins
            type: io.kestra.plugin.core.http.Download
            description: The successful runs of the flow since the incident started, to spot executions a later run already redid.
            uri: >-
              {{ outputs.context.values.api }}/executions/search?page=1&size=1000&sort=state.startDate:asc&filters%5Bnamespace%5D%5BEQUALS%5D={{ outputs.i_card.value.namespace }}&filters%5BflowId%5D%5BEQUALS%5D={{ outputs.i_card.value.flowId }}&filters%5Bstate%5D%5BIN%5D=SUCCESS,WARNING&filters%5BstartDate%5D%5BGREATER_THAN_OR_EQUAL_TO%5D={{ outputs.p_since.values.start | urlencode }}
            headers:
              Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
            timeout: PT2M
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT30S
              maxDuration: PT3M
      - id: p_chains
        type: io.kestra.plugin.core.output.OutputValues
        values:
          plan: >-
            {{ {'members': fromJson(read(outputs.p_members.uri)).results ?? [], 'execs': fromJson(read(outputs.p_replays.uri)).results ?? [],
            'successes': fromJson(read(outputs.p_wins.uri)).results ?? [], 'ns': outputs.i_card.value.namespace, 'flow': outputs.i_card.value.flowId,
            'incident': inputs.incident, 'target': outputs.p_target.values.target | number, 'warn_ok': inputs.count_warning_as_success,
            'fixed_outside': inputs.fixed_outside_flow, 'include_superseded': inputs.include_superseded, 'after': outputs.context.values.window_after, 'before': outputs.context.values.window_before, 'max': inputs.max_chains}
            | jq(vars.chains_jq) | first | toJson }}
          replays_total: "{{ fromJson(read(outputs.p_replays.uri)).total ?? 0 }}"
          wins_total: "{{ fromJson(read(outputs.p_wins.uri)).total ?? 0 }}"
      - id: p_ledger
        type: io.kestra.plugin.core.kv.Set
        description: Scratch state of this run (restart previews, then the campaign ledger). afterExecution deletes it.
        key: "{{ outputs.context.values.scratch_key }}"
        kvType: JSON
        ttl: P7D
        value: '{"replays": [], "skipped": [], "waves": [], "previews": [], "stop": false, "reason": ""}'
      - id: p_previews
        type: io.kestra.plugin.core.flow.LoopUntil
        description: Computes the restart point once per flow revision the remaining executions failed on, on one example execution.
        runIf: "{{ fromJson(outputs.p_chains.values.plan).by_revision | length > 0 }}"
        condition: "{{ outputs.pv_item.values.last == 'true' }}"
        failOnMaxReached: true
        checkFrequency:
          maxIterations: 1000
          interval: PT0.1S
        tasks:
          - id: pv_item
            type: io.kestra.plugin.core.output.OutputValues
            values:
              item: >-
                {{ (fromJson(outputs.p_chains.values.plan).by_revision | jq(vars.previews_list_jq) | first)[outputs.p_previews.iterationCount - 1] | toJson }}
              last: >-
                {{ outputs.p_previews.iterationCount >= (fromJson(outputs.p_chains.values.plan).by_revision | jq(vars.previews_list_jq) | first | length) }}
          - id: pv_def
            type: io.kestra.plugin.core.http.Download
            uri: "{{ outputs.context.values.api }}/flows/{{ outputs.i_card.value.namespace }}/{{ outputs.i_card.value.flowId }}?revision={{ fromJson(outputs.pv_item.values.item).revision }}"
            headers:
              Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
            timeout: PT1M
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT20S
              maxDuration: PT2M
          - id: pv_exec
            type: io.kestra.plugin.core.http.Download
            uri: "{{ outputs.context.values.api }}/executions/{{ fromJson(outputs.pv_item.values.item).example }}"
            headers:
              Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
            timeout: PT1M
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT20S
              maxDuration: PT2M
          - id: pv_point
            type: io.kestra.plugin.core.output.OutputValues
            values:
              point: >-
                {{ {'exec': fromJson(read(outputs.pv_exec.uri)), 'old': fromJson(read(outputs.pv_def.uri)), 'new': fromJson(read(outputs.p_target_def.uri)),
                'target': outputs.p_target.values.target | number, 'policy': inputs.restart_policy, 'allow_from_start': inputs.allow_from_start,
                'fixed_outside': inputs.fixed_outside_flow, 'never': fromJson(outputs.p_rules.values.never)} | jq(vars.restart_jq) | first | toJson }}
          - id: pv_record
            type: io.kestra.plugin.core.kv.Set
            key: "{{ outputs.context.values.scratch_key }}"
            kvType: JSON
            ttl: P7D
            value: >-
              {% set pt = fromJson(outputs.pv_point.values.point) %}{% set it = fromJson(outputs.pv_item.values.item) %}{{ {
              'ledger': kv(outputs.context.values.scratch_key), 'kind': 'preview',
              'add': {'revision': it.revision, 'count': it.count, 'execution': it.example, 'mode': pt.mode, 'start': pt.start ?? null,
                'reasons': pt.reasons, 'reruns': pt.reruns, 'side_effects': pt.side_effects, 'guarded': pt.guarded}} | jq(vars.ledger_jq) | first | toJson }}
      - id: p_summary
        type: io.kestra.plugin.core.output.OutputValues
        values:
          summary: >-
            {{ {'plan': fromJson(outputs.p_chains.values.plan), 'previews': kv(outputs.context.values.scratch_key).previews ?? [],
            'target': outputs.p_target.values.target | number, 'card': outputs.i_card.value, 'max': inputs.max_chains,
            'members_total': outputs.p_since.values.members_total | number, 'replays_total': outputs.p_chains.values.replays_total | number,
            'wins_total': outputs.p_chains.values.wins_total | number, 'strict': outputs.p_concurrency.values.strict == 'true',
            'limit': outputs.p_concurrency.values.limit | number, 'behavior': outputs.p_concurrency.values.behavior,
            'breakpoint': inputs.canary_breakpoint ?? '', 'breakpoint_ok': outputs.p_breakpoint.values.ok == 'true',
            'window': [outputs.context.values.window_after, outputs.context.values.window_before],
            'downstream': (outputs.p_downstream.uri ?? '') == '' ? [] : ({'graph': fromJson(read(outputs.p_downstream.uri)),
              'self': outputs.i_card.value.namespace ~ '.' ~ outputs.i_card.value.flowId, 'engine': flow.namespace ~ '.' ~ flow.id}
              | jq(vars.downstream_jq) | first)}
            | jq(vars.plan_summary_jq) | first | toJson }}
          waves: >-
            {{ {'candidates': {'candidates': fromJson(outputs.p_chains.values.plan).candidates, 'previews': kv(outputs.context.values.scratch_key).previews ?? []}
            | jq(vars.order_jq) | first, 'canary': outputs.p_concurrency.values.canary | number, 'size': outputs.p_concurrency.values.wave_size | number}
            | jq(vars.waves_jq) | first | toJson }}
      - id: p_markdown
        type: io.kestra.plugin.core.output.OutputValues
        values:
          md: >-
            {{ {'card': outputs.i_card.value, 'target': outputs.p_target.values.target | number, 'latest': outputs.p_target.values.latest | number,
            'plan': fromJson(outputs.p_chains.values.plan), 'previews': kv(outputs.context.values.scratch_key).previews ?? [],
            'waves': fromJson(outputs.p_summary.values.waves), 'estimate': fromJson(outputs.p_summary.values.summary).estimate,
            'blockers': fromJson(outputs.p_summary.values.summary).blockers, 'warnings': fromJson(outputs.p_summary.values.summary).warnings}
            | jq(vars.plan_md_jq) | first }}
      - id: p_write
        type: io.kestra.plugin.core.storage.Write
        content: "{{ outputs.p_markdown.values.md }}"
        extension: .md
      - id: p_publish
        type: io.kestra.plugin.core.namespace.UploadFiles
        description: Keeps the latest plan as the namespace file fix-forward/<incident>/plan.md of the engine namespace.
        namespace: "{{ flow.namespace }}"
        filesMap: "{{ {'fix-forward/' ~ inputs.incident ~ '/plan.md': outputs.p_write.uri} | toJson }}"
      - id: p_report
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.p_markdown.values.md }}"
      - id: p_card
        type: io.kestra.plugin.core.kv.Set
        key: "{{ outputs.context.values.card_key }}"
        kvType: JSON
        value: >-
          {% set c = kv(outputs.context.values.card_key) %}{% set pl = fromJson(outputs.p_chains.values.plan) %}{{ {'card': c, 'now': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')),
          'set': {'last_plan': {'at': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')), 'execution': execution.id, 'target': outputs.p_target.values.target | number, 'counts': pl.counts,
            'candidates': pl.candidates | length, 'estimate': fromJson(outputs.p_summary.values.summary).estimate,
            'blockers': fromJson(outputs.p_summary.values.summary).blockers}}} | jq(vars.card_jq) | first | toJson }}
      - id: p_tell
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        runIf: "{{ inputs.notify and inputs.action == 'PLAN' }}"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {% set sm = fromJson(outputs.p_summary.values.summary) %}{% set pl = fromJson(outputs.p_chains.values.plan) %}{{ {'kind': 'PLAN',
          'title': 'Plan for ' ~ inputs.incident ~ ': ' ~ (pl.candidates | length) ~ ' replays on revision ' ~ outputs.p_target.values.target,
          'text': (sm.blockers | length > 0 ? '*Blocked:* ' ~ (sm.blockers | join('; ')) : 'Run the engine with `action: REPLAY` and `incident: ' ~ inputs.incident ~ '` to start the campaign behind an approval.')
            ~ (sm.warnings | length > 0 ? '\n*Warnings:* ' ~ (sm.warnings | join('; ')) : ''),
          'fields': ['*Chains*\n' ~ (pl.counts | toJson), '*Restart modes*\n' ~ (sm.estimate | toJson),
            '*Waves*\n' ~ (fromJson(outputs.p_summary.values.waves) | length), '*Plan file*\nfix-forward/' ~ inputs.incident ~ '/plan.md'],
          'url': outputs.context.values.self_ui, 'button': 'Open the plan run', 'card': outputs.i_card.value} | jq(vars.slack_jq) | first | toJson }}
        allowFailure: true
      - id: p_result
        type: io.kestra.plugin.core.output.OutputValues
        values:
          summary: >-
            {{ {'action': inputs.action, 'incident': inputs.incident, 'target_revision': outputs.p_target.values.target | number,
            'counts': fromJson(outputs.p_chains.values.plan).counts, 'candidates': fromJson(outputs.p_chains.values.plan).candidates | length,
            'estimate': fromJson(outputs.p_summary.values.summary).estimate, 'blockers': fromJson(outputs.p_summary.values.summary).blockers,
            'warnings': fromJson(outputs.p_summary.values.summary).warnings, 'plan_file': 'fix-forward/' ~ inputs.incident ~ '/plan.md'} | toJson }}

  # ------------------------------------------------------------------ REPLAY: lease, approval, canary, waves
  - id: replay
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.action == 'REPLAY' }}"
    then:
      - id: r_blocked
        type: io.kestra.plugin.core.execution.Fail
        condition: "{{ fromJson(outputs.p_summary.values.summary).blockers | length > 0 }}"
        errorMessage: "Nothing was replayed: {{ fromJson(outputs.p_summary.values.summary).blockers | join('; ') }}"
      - id: r_lease_take
        type: io.kestra.plugin.core.kv.Set
        description: >-
          One campaign per incident. The key is written only if it does not exist, then read back, so two REPLAY
          runs started together cannot both win it. The TTL frees it if every cleanup failed.
        key: "fix-forward.lease.{{ inputs.incident }}"
        value: "{{ execution.id }}"
        overwrite: false
        ttl: P3D
        allowFailure: true
      - id: r_lease_read
        type: io.kestra.plugin.core.kv.Get
        key: "fix-forward.lease.{{ inputs.incident }}"
        errorOnMissing: false
      - id: r_lease_contested
        type: io.kestra.plugin.core.flow.If
        condition: "{{ (outputs.r_lease_read.value ?? '') != execution.id }}"
        then:
          - id: r_holder
            type: io.kestra.plugin.core.http.Request
            uri: "{{ outputs.context.values.api }}/executions/{{ outputs.r_lease_read.value ?? 'none' }}"
            headers:
              Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
            options:
              allowFailed: true
            timeout: PT1M
          - id: r_holder_running
            type: io.kestra.plugin.core.execution.Fail
            condition: >-
              {{ outputs.r_holder.code == 200 and not (['SUCCESS', 'WARNING', 'FAILED', 'KILLED', 'CANCELLED']
              contains fromJson(outputs.r_holder.body).state.current) }}
            errorMessage: >-
              Campaign {{ outputs.r_lease_read.value }} is running for incident {{ inputs.incident }}. Wait for it, or stop it
              with action HALT.
          - id: r_lease_steal
            type: io.kestra.plugin.core.kv.Set
            description: The holder ended without releasing the lease, so this run takes it over.
            key: "fix-forward.lease.{{ inputs.incident }}"
            value: "{{ execution.id }}"
            ttl: P3D
          - id: r_lease_reread
            type: io.kestra.plugin.core.kv.Get
            key: "fix-forward.lease.{{ inputs.incident }}"
            errorOnMissing: false
          - id: r_lease_lost
            type: io.kestra.plugin.core.execution.Fail
            condition: "{{ (outputs.r_lease_reread.value ?? '') != execution.id }}"
            errorMessage: Another REPLAY run took the lease of incident {{ inputs.incident }} at the same moment. Nothing was replayed.
      - id: r_card_start
        type: io.kestra.plugin.core.kv.Set
        key: "{{ outputs.context.values.card_key }}"
        kvType: JSON
        value: >-
          {% set c = kv(outputs.context.values.card_key) %}{{ {'card': c, 'now': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')),
          'set': {'status': 'IN_CAMPAIGN', 'previous_status': c.status == 'IN_CAMPAIGN' ? (c.previous_status ?? 'OPEN') : c.status,
            'campaign': execution.id, 'campaign_target': outputs.p_target.values.target | number, 'version': (c.version ?? 0) + 1},
          'event': {'event': 'campaign started, waiting for approval', 'execution': execution.id}} | jq(vars.card_jq) | first | toJson }}
      - id: r_brief
        type: io.kestra.plugin.core.log.Log
        message: >-
          Approval needed to replay {{ fromJson(outputs.p_chains.values.plan).candidates | length }} executions of
          {{ outputs.i_card.value.namespace }}.{{ outputs.i_card.value.flowId }} on revision {{ outputs.p_target.values.target }}
          in {{ fromJson(outputs.p_summary.values.waves) | length }} waves ({{ fromJson(outputs.p_summary.values.waves) | jq('map(.wave + " " + (.items | length | tostring)) | join(", ")') | first }}).
          Restart modes: {{ fromJson(outputs.p_summary.values.summary).estimate | toJson }}. The plan is in the namespace file
          fix-forward/{{ inputs.incident }}/plan.md. Resume with decision APPROVE to start, or REJECT.
      - id: r_ask
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        runIf: "{{ inputs.notify }}"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {% set pl = fromJson(outputs.p_chains.values.plan) %}{{ {'kind': 'APPROVAL',
          'title': 'Approve the replay of ' ~ (pl.candidates | length) ~ ' executions of ' ~ outputs.i_card.value.flowId,
          'text': 'Incident `' ~ inputs.incident ~ '`: replay on revision ' ~ outputs.p_target.values.target ~ ', canary first, then waves of '
            ~ inputs.wave_size ~ ' with a failure budget of ' ~ inputs.max_failure_percent ~ '%.\nResume the execution with decision APPROVE or REJECT before '
            ~ (now() | dateAdd({'d': inputs.approval_timeout | string} | jq(vars.duration_jq) | first, 'SECONDS') | date("yyyy-MM-dd HH:mm 'UTC'", timeZone='UTC')) ~ '.',
          'fields': ['*Restart modes*\n' ~ (fromJson(outputs.p_summary.values.summary).estimate | toJson),
            '*Downstream*\n' ~ (fromJson(outputs.p_summary.values.summary).downstream | length == 0 ? 'none' : fromJson(outputs.p_summary.values.summary).downstream | join(', ')),
            '*Waves*\n' ~ (fromJson(outputs.p_summary.values.waves) | jq('map(.wave + " " + (.items | length | tostring)) | join(", ")') | first),
            '*Warnings*\n' ~ (fromJson(outputs.p_summary.values.summary).warnings | length == 0 ? 'none' : fromJson(outputs.p_summary.values.summary).warnings | join('; '))],
          'url': outputs.context.values.self_ui, 'button': 'Review and approve', 'card': outputs.i_card.value} | jq(vars.slack_jq) | first | toJson }}
        allowFailure: true
      - id: r_approve
        type: io.kestra.plugin.core.flow.Pause
        description: >-
          The campaign waits here for a person. Resume it with decision APPROVE. When approval_timeout passes, the
          execution is cancelled and the incident goes back to its previous status.
        pauseDuration: "{{ inputs.approval_timeout }}"
        behavior: CANCEL
        onResume:
          - id: decision
            type: SELECT
            values:
              - APPROVE
              - REJECT
            defaults: REJECT
            description: APPROVE starts the canary. REJECT ends the campaign without a replay.
          - id: note
            type: STRING
            required: false
            description: Optional note kept on the incident card.
          - id: skip_executions
            type: STRING
            required: false
            description: Comma-separated ids of executions of the plan not to replay (the original or its latest replay).
          - id: wave_size
            type: INT
            required: false
            description: Replaces the wave size of the plan.
      - id: r_rejected
        type: io.kestra.plugin.core.execution.Fail
        condition: "{{ outputs.r_approve.onResume.decision != 'APPROVE' }}"
        errorMessage: >-
          The campaign of incident {{ inputs.incident }} was rejected at approval{{ (outputs.r_approve.onResume.note ?? '') == '' ? '' : ': ' ~ outputs.r_approve.onResume.note }}.
          Nothing was replayed.
      - id: r_plan_final
        type: io.kestra.plugin.core.output.OutputValues
        description: The plan as approved, without the executions the approver dropped and with the wave size they chose.
        values:
          approved: >-
            {{ {'candidates': {'candidates': fromJson(outputs.p_chains.values.plan).candidates, 'previews': kv(outputs.context.values.scratch_key).previews ?? []}
            | jq(vars.order_jq) | first, 'skip': outputs.r_approve.onResume.skip_executions ?? ''} | jq(vars.approved_plan_jq) | first | toJson }}
      - id: r_plan_waves
        type: io.kestra.plugin.core.output.OutputValues
        values:
          waves: >-
            {% set size = (outputs.r_approve.onResume.wave_size ?? 0) > 0 ? outputs.r_approve.onResume.wave_size : (outputs.p_concurrency.values.wave_size | number) %}{{ {
            'candidates': fromJson(outputs.r_plan_final.values.approved).candidates, 'canary': outputs.p_concurrency.values.canary | number,
            'size': (outputs.p_concurrency.values.strict == 'true' and size > (outputs.p_concurrency.values.limit | number)) ? (outputs.p_concurrency.values.limit | number) : size}
            | jq(vars.waves_jq) | first | toJson }}
      - id: r_unknown_skip
        type: io.kestra.plugin.core.execution.Fail
        condition: "{{ fromJson(outputs.r_plan_final.values.approved).unknown | length > 0 }}"
        errorMessage: >-
          skip_executions names executions that are not in the plan: {{ fromJson(outputs.r_plan_final.values.approved).unknown | join(', ') }}.
          Nothing was replayed; start REPLAY again and approve with ids from the plan.
      - id: r_record_dropped
        type: io.kestra.plugin.core.kv.Set
        runIf: "{{ fromJson(outputs.r_plan_final.values.approved).dropped | length > 0 }}"
        key: "{{ outputs.context.values.scratch_key }}"
        kvType: JSON
        ttl: P7D
        value: >-
          {{ {'ledger': kv(outputs.context.values.scratch_key), 'kind': 'skips', 'add': fromJson(outputs.r_plan_final.values.approved).dropped}
          | jq(vars.ledger_jq) | first | toJson }}
      - id: r_card_approved
        type: io.kestra.plugin.core.kv.Set
        key: "{{ outputs.context.values.card_key }}"
        kvType: JSON
        value: >-
          {% set c = kv(outputs.context.values.card_key) %}{{ {'card': c, 'now': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')),
          'event': {'event': 'campaign approved' ~ ((outputs.r_approve.onResume.note ?? '') == '' ? '' : ': ' ~ outputs.r_approve.onResume.note), 'execution': execution.id}}
          | jq(vars.card_jq) | first | toJson }}
      - id: r_nothing_left
        type: io.kestra.plugin.core.execution.Fail
        condition: "{{ fromJson(outputs.r_plan_waves.values.waves) | length == 0 }}"
        errorMessage: The approver dropped every execution of the plan. Nothing was replayed.
      - id: r_waves
        type: io.kestra.plugin.core.flow.LoopUntil
        description: >-
          One iteration per wave. Before each wave the chains are read again, so an execution someone replayed or
          that a later run superseded meanwhile is skipped.
        condition: "{{ outputs.r_wave_end.values.stop == 'true' }}"
        failOnMaxReached: true
        checkFrequency:
          maxIterations: 10000
          interval: PT0.1S
        tasks:
          - id: r_wave
            type: io.kestra.plugin.core.output.OutputValues
            values:
              name: "{{ fromJson(outputs.r_plan_waves.values.waves)[outputs.r_waves.iterationCount - 1].wave }}"
              items: "{{ fromJson(outputs.r_plan_waves.values.waves)[outputs.r_waves.iterationCount - 1].items | toJson }}"
              last: "{{ outputs.r_waves.iterationCount >= (fromJson(outputs.r_plan_waves.values.waves) | length) }}"
              halted: "{{ (kv('fix-forward.halt.' ~ inputs.incident, errorOnMissing=false) ?? '') != '' }}"
          - id: r_wave_go
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.r_wave.values.halted == 'false' }}"
            then:
              - id: r_window
                type: io.kestra.plugin.core.output.OutputValues
                values:
                  wait: >-
                    {{ {'window': inputs.replay_window ?? '', 'now': now() | date('HH:mm:ss', timeZone='UTC')} | jq(vars.window_jq) | first }}
              - id: r_window_wait
                type: io.kestra.plugin.core.flow.Sleep
                description: The wave is due outside replay_window, so it waits for the window to open.
                runIf: "{{ (outputs.r_window.values.wait | number) > 0 }}"
                duration: "PT{{ outputs.r_window.values.wait }}S"
              - id: r_idle_started
                type: io.kestra.plugin.core.output.OutputValues
                runIf: "{{ outputs.p_concurrency.values.strict == 'true' }}"
                values:
                  deadline: "{{ (now() | timestamp) + ({'d': inputs.replay_timeout | string} | jq(vars.duration_jq) | first) }}"
              - id: r_idle
                type: io.kestra.plugin.core.flow.LoopUntil
                description: Waits until no execution of the flow is running, so the replays of the wave are not cancelled by its concurrency limit.
                runIf: "{{ outputs.p_concurrency.values.strict == 'true' }}"
                condition: >-
                  {{ (outputs.r_idle_check.values.busy | number) == 0 or (now() | timestamp) >= (outputs.r_idle_started.values.deadline | number) }}
                failOnMaxReached: false
                checkFrequency:
                  maxIterations: 100000
                  interval: PT0.1S
                tasks:
                  - id: r_idle_poll
                    type: io.kestra.plugin.core.http.Download
                    uri: >-
                      {{ outputs.context.values.api }}/executions/search?page=1&size=100&filters%5Bnamespace%5D%5BEQUALS%5D={{ outputs.i_card.value.namespace }}&filters%5BflowId%5D%5BEQUALS%5D={{ outputs.i_card.value.flowId }}&filters%5Bstate%5D%5BIN%5D=CREATED,RUNNING,PAUSED,RESTARTED,KILLING,QUEUED,RETRYING,BREAKPOINT,SUBMITTED,RESUBMITTED
                    headers:
                      Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
                    timeout: PT1M
                  - id: r_idle_check
                    type: io.kestra.plugin.core.output.OutputValues
                    values:
                      busy: >-
                        {{ {'page': fromJson(read(outputs.r_idle_poll.uri)), 'ns': outputs.i_card.value.namespace, 'flow': outputs.i_card.value.flowId}
                        | jq(vars.busy_jq) | first }}
                  - id: r_idle_pause
                    type: io.kestra.plugin.core.flow.Sleep
                    runIf: "{{ (outputs.r_idle_check.values.busy | number) > 0 and (now() | timestamp) < (outputs.r_idle_started.values.deadline | number) }}"
                    duration: PT5S
              - id: r_fresh_members
                type: io.kestra.plugin.core.http.Download
                uri: >-
                  {{ outputs.context.values.api }}/executions/search?page=1&size=1000&sort=state.startDate:asc&filters%5Bnamespace%5D%5BEQUALS%5D={{ outputs.i_card.value.namespace }}&filters%5BflowId%5D%5BEQUALS%5D={{ outputs.i_card.value.flowId }}&filters%5Blabels%5D%5BEQUALS%5D%5Bfix-forward.incident%5D={{ inputs.incident }}
                headers:
                  Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
                timeout: PT2M
                retry:
                  type: exponential
                  interval: PT2S
                  maxInterval: PT30S
                  maxDuration: PT3M
              - id: r_fresh_replays
                type: io.kestra.plugin.core.http.Download
                uri: >-
                  {{ outputs.context.values.api }}/executions/search?page=1&size=1000&sort=state.startDate:asc&filters%5Bnamespace%5D%5BEQUALS%5D={{ outputs.i_card.value.namespace }}&filters%5BflowId%5D%5BEQUALS%5D={{ outputs.i_card.value.flowId }}&filters%5Blabels%5D%5BEQUALS%5D%5Bsystem.replay%5D=true&filters%5BstartDate%5D%5BGREATER_THAN_OR_EQUAL_TO%5D={{ outputs.p_since.values.start | urlencode }}
                headers:
                  Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
                timeout: PT2M
                retry:
                  type: exponential
                  interval: PT2S
                  maxInterval: PT30S
                  maxDuration: PT3M
              - id: r_todo
                type: io.kestra.plugin.core.output.OutputValues
                values:
                  todo: >-
                    {{ {'fresh': {'members': fromJson(read(outputs.r_fresh_members.uri)).results ?? [], 'execs': fromJson(read(outputs.r_fresh_replays.uri)).results ?? [],
                    'successes': fromJson(read(outputs.p_wins.uri)).results ?? [], 'ns': outputs.i_card.value.namespace, 'flow': outputs.i_card.value.flowId,
                    'incident': inputs.incident, 'target': outputs.p_target.values.target | number, 'warn_ok': inputs.count_warning_as_success,
                    'fixed_outside': inputs.fixed_outside_flow, 'include_superseded': inputs.include_superseded, 'after': outputs.context.values.window_after, 'before': outputs.context.values.window_before, 'max': 1000000} | jq(vars.chains_jq) | first,
                    'items': fromJson(outputs.r_wave.values.items)} | jq(vars.wave_todo_jq) | first | toJson }}
              - id: r_launch
                type: io.kestra.plugin.core.flow.LoopUntil
                runIf: "{{ fromJson(outputs.r_todo.values.todo) | length > 0 }}"
                condition: "{{ outputs.r_item.values.last == 'true' }}"
                failOnMaxReached: true
                checkFrequency:
                  maxIterations: 100000
                  interval: PT0.1S
                tasks:
                  - id: r_item
                    type: io.kestra.plugin.core.output.OutputValues
                    values:
                      item: "{{ fromJson(outputs.r_todo.values.todo)[outputs.r_launch.iterationCount - 1] | toJson }}"
                      skip: "{{ fromJson(outputs.r_todo.values.todo)[outputs.r_launch.iterationCount - 1].skip ?? '' }}"
                      last: "{{ outputs.r_launch.iterationCount >= (fromJson(outputs.r_todo.values.todo) | length) }}"
                  - id: r_item_skipped
                    type: io.kestra.plugin.core.kv.Set
                    runIf: "{{ outputs.r_item.values.skip != '' }}"
                    key: "{{ outputs.context.values.scratch_key }}"
                    kvType: JSON
                    ttl: P7D
                    value: >-
                      {{ {'ledger': kv(outputs.context.values.scratch_key), 'kind': 'skip',
                      'add': {'root': fromJson(outputs.r_item.values.item).root, 'why': outputs.r_item.values.skip, 'wave': outputs.r_wave.values.name}}
                      | jq(vars.ledger_jq) | first | toJson }}
                  - id: r_item_go
                    type: io.kestra.plugin.core.flow.If
                    condition: "{{ outputs.r_item.values.skip == '' }}"
                    then:
                      - id: r_item_exec
                        type: io.kestra.plugin.core.http.Download
                        uri: "{{ outputs.context.values.api }}/executions/{{ fromJson(outputs.r_item.values.item).last }}"
                        headers:
                          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
                        timeout: PT1M
                        retry:
                          type: exponential
                          interval: PT2S
                          maxInterval: PT20S
                          maxDuration: PT2M
                      - id: r_item_def
                        type: io.kestra.plugin.core.http.Download
                        uri: "{{ outputs.context.values.api }}/flows/{{ outputs.i_card.value.namespace }}/{{ outputs.i_card.value.flowId }}?revision={{ fromJson(outputs.r_item.values.item).last_revision }}"
                        headers:
                          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
                        timeout: PT1M
                        retry:
                          type: exponential
                          interval: PT2S
                          maxInterval: PT20S
                          maxDuration: PT2M
                      - id: r_item_point
                        type: io.kestra.plugin.core.output.OutputValues
                        description: The restart point is computed for this very execution, from the tasks it ran.
                        values:
                          point: >-
                            {{ {'exec': fromJson(read(outputs.r_item_exec.uri)), 'old': fromJson(read(outputs.r_item_def.uri)), 'new': fromJson(read(outputs.p_target_def.uri)),
                            'target': outputs.p_target.values.target | number, 'policy': inputs.restart_policy, 'allow_from_start': inputs.allow_from_start,
                            'fixed_outside': inputs.fixed_outside_flow, 'never': fromJson(outputs.p_rules.values.never)} | jq(vars.restart_jq) | first | toJson }}
                      - id: r_item_mode
                        type: io.kestra.plugin.core.output.OutputValues
                        values:
                          replayable: "{{ ['TASK', 'FROM_START'] contains fromJson(outputs.r_item_point.values.point).mode }}"
                      - id: r_item_launch
                        type: io.kestra.plugin.core.flow.If
                        condition: "{{ outputs.r_item_mode.values.replayable == 'true' }}"
                        then:
                          - id: r_item_label
                            type: io.kestra.plugin.core.http.Request
                            description: >-
                              Labels the execution with the campaign and the wave before the replay, which inherits the
                              labels. The wave label is how the campaign finds its replays again.
                            uri: "{{ outputs.context.values.api }}/executions/{{ fromJson(outputs.r_item.values.item).last }}/actions/labels"
                            method: POST
                            contentType: application/json
                            body: >-
                              {{ {'labels': fromJson(read(outputs.r_item_exec.uri)).labels ?? [], 'set': {'fix-forward.campaign': execution.id,
                              'fix-forward.wave': execution.id ~ '-' ~ outputs.r_wave.values.name}} | jq(vars.labels_jq) | first | toJson }}
                            headers:
                              Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
                            options:
                              allowFailed: true
                            timeout: PT1M
                            retry:
                              type: exponential
                              interval: PT2S
                              maxInterval: PT20S
                              maxDuration: PT1M
                          - id: r_item_replay
                            type: io.kestra.plugin.core.http.Request
                            runIf: "{{ outputs.r_item_label.code == 200 }}"
                            uri: >-
                              {% set pt = fromJson(outputs.r_item_point.values.point) %}{{ outputs.context.values.api }}/executions/{{ fromJson(outputs.r_item.values.item).last }}/actions/replay?revision={{ outputs.p_target.values.target }}{{ pt.mode == 'TASK' ? '&taskRunId=' ~ pt.task_run_id : '' }}{{ (outputs.r_wave.values.name == 'canary' and (inputs.canary_breakpoint ?? '') != '') ? '&breakpoints=' ~ inputs.canary_breakpoint : '' }}
                            method: POST
                            headers:
                              Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
                            options:
                              allowFailed: true
                            timeout: PT1M
                          - id: r_item_done
                            type: io.kestra.plugin.core.kv.Set
                            key: "{{ outputs.context.values.scratch_key }}"
                            kvType: JSON
                            ttl: P7D
                            value: >-
                              {% set pt = fromJson(outputs.r_item_point.values.point) %}{% set ok = (outputs.r_item_label.code == 200) and ((outputs.r_item_replay.code ?? 0) == 200) %}{{ {
                              'ledger': kv(outputs.context.values.scratch_key), 'kind': ok ? 'replay' : 'skip',
                              'add': ok ? {'root': fromJson(outputs.r_item.values.item).root, 'last': fromJson(outputs.r_item.values.item).last,
                                  'replay': fromJson(outputs.r_item_replay.body).id, 'wave': outputs.r_wave.values.name, 'mode': pt.mode, 'start': pt.start ?? null}
                                : {'root': fromJson(outputs.r_item.values.item).root, 'wave': outputs.r_wave.values.name,
                                  'why': 'Kestra refused the ' ~ (outputs.r_item_label.code == 200 ? 'replay' : 'label') ~ ': HTTP '
                                    ~ (outputs.r_item_label.code == 200 ? (outputs.r_item_replay.code ?? 0) : outputs.r_item_label.code) ~ ' '
                                    ~ ((outputs.r_item_label.code == 200 ? (outputs.r_item_replay.body ?? '') : (outputs.r_item_label.body ?? '')) | abbreviate(240))}}
                              | jq(vars.ledger_jq) | first | toJson }}
                      - id: r_item_held
                        type: io.kestra.plugin.core.kv.Set
                        runIf: "{{ outputs.r_item_mode.values.replayable != 'true' }}"
                        key: "{{ outputs.context.values.scratch_key }}"
                        kvType: JSON
                        ttl: P7D
                        value: >-
                          {% set pt = fromJson(outputs.r_item_point.values.point) %}{{ {'ledger': kv(outputs.context.values.scratch_key), 'kind': 'skip',
                          'add': {'root': fromJson(outputs.r_item.values.item).root, 'wave': outputs.r_wave.values.name, 'why': pt.mode ~ ': ' ~ (pt.reasons | join('; '))}}
                          | jq(vars.ledger_jq) | first | toJson }}
              - id: r_wait_started
                type: io.kestra.plugin.core.output.OutputValues
                values:
                  ids: "{{ {'ledger': kv(outputs.context.values.scratch_key), 'wave': outputs.r_wave.values.name} | jq(vars.wave_ids_jq) | first | toJson }}"
                  deadline: "{{ (now() | timestamp) + ({'d': inputs.replay_timeout | string} | jq(vars.duration_jq) | first) }}"
              - id: r_wait
                type: io.kestra.plugin.core.flow.LoopUntil
                description: Polls the replays of the wave every 10 seconds until they all ended or replay_timeout passed.
                runIf: "{{ fromJson(outputs.r_wait_started.values.ids) | length > 0 }}"
                condition: >-
                  {{ outputs.r_poll_eval.values.done == 'true'
                  or (now() | timestamp) >= (outputs.r_wait_started.values.deadline | number) }}
                failOnMaxReached: false
                checkFrequency:
                  maxIterations: 100000
                  interval: PT0.1S
                tasks:
                  - id: r_poll
                    type: io.kestra.plugin.core.http.Download
                    uri: >-
                      {{ outputs.context.values.api }}/executions/search?page=1&size=1000&filters%5Bnamespace%5D%5BEQUALS%5D={{ outputs.i_card.value.namespace }}&filters%5BflowId%5D%5BEQUALS%5D={{ outputs.i_card.value.flowId }}&filters%5Blabels%5D%5BEQUALS%5D%5Bfix-forward.wave%5D={{ execution.id }}-{{ outputs.r_wave.values.name }}
                    headers:
                      Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
                    timeout: PT1M
                    retry:
                      type: exponential
                      interval: PT2S
                      maxInterval: PT20S
                      maxDuration: PT2M
                  - id: r_poll_eval
                    type: io.kestra.plugin.core.output.OutputValues
                    values:
                      eval: >-
                        {{ {'page': fromJson(read(outputs.r_poll.uri)), 'ids': fromJson(outputs.r_wait_started.values.ids),
                        'warn_ok': inputs.count_warning_as_success} | jq(vars.wave_eval_jq) | first | toJson }}
                      done: >-
                        {{ ({'page': fromJson(read(outputs.r_poll.uri)), 'ids': fromJson(outputs.r_wait_started.values.ids),
                        'warn_ok': inputs.count_warning_as_success} | jq(vars.wave_eval_jq) | first).done }}
                  - id: r_breakpoint_tell
                    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                    description: Sent once, when a canary replay reaches canary_breakpoint.
                    runIf: >-
                      {{ inputs.notify and outputs.r_wave.values.name == 'canary' and (fromJson(outputs.r_poll_eval.values.eval).breakpoint_ids | length) > 0
                      and not (kv(outputs.context.values.scratch_key).breakpoint_notified ?? false) }}
                    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                    payload: >-
                      {% set ids = fromJson(outputs.r_poll_eval.values.eval).breakpoint_ids %}{{ {'kind': 'BREAKPOINT',
                      'title': 'Canary of ' ~ inputs.incident ~ ' stopped before ' ~ inputs.canary_breakpoint,
                      'text': 'The canary replay ran on revision ' ~ outputs.p_target.values.target ~ ' up to task `' ~ inputs.canary_breakpoint
                        ~ '` and waits there. Check its outputs, then resume it from the breakpoint to continue the campaign, or kill it to stop it. Canary: ' ~ (ids | join(', ')),
                      'url': outputs.context.values.ui ~ '/executions/' ~ outputs.i_card.value.namespace ~ '/' ~ outputs.i_card.value.flowId ~ '/' ~ ids[0],
                      'button': 'Inspect the canary', 'card': outputs.i_card.value} | jq(vars.slack_jq) | first | toJson }}
                    allowFailure: true
                  - id: r_breakpoint_flag
                    type: io.kestra.plugin.core.kv.Set
                    runIf: >-
                      {{ outputs.r_wave.values.name == 'canary' and (fromJson(outputs.r_poll_eval.values.eval).breakpoint_ids | length) > 0
                      and not (kv(outputs.context.values.scratch_key).breakpoint_notified ?? false) }}
                    key: "{{ outputs.context.values.scratch_key }}"
                    kvType: JSON
                    ttl: P7D
                    value: "{{ {'ledger': kv(outputs.context.values.scratch_key), 'kind': 'flag', 'add': {'breakpoint_notified': true}} | jq(vars.ledger_jq) | first | toJson }}"
                  - id: r_poll_pause
                    type: io.kestra.plugin.core.flow.Sleep
                    runIf: >-
                      {{ outputs.r_poll_eval.values.done != 'true' and (now() | timestamp) < (outputs.r_wait_started.values.deadline | number) }}
                    duration: PT10S
              - id: r_verdict
                type: io.kestra.plugin.core.output.OutputValues
                description: >-
                  A canary that does not succeed stops the campaign. A wave whose failures pass max_failure_percent, or
                  whose replays are still running at replay_timeout, stops it too.
                values:
                  verdict: >-
                    {% set ids = fromJson(outputs.r_wait_started.values.ids) %}{% set ev = ids | length == 0 ? {'launched': 0, 'ok': 0, 'failed': 0, 'running': 0, 'failure_percent': 0, 'failed_ids': []} : fromJson(outputs.r_poll_eval.values.eval) %}{{ {
                    'wave': outputs.r_wave.values.name, 'launched': ev.launched, 'ok': ev.ok, 'failed': ev.failed, 'running': ev.running,
                    'failure_percent': ev.failure_percent, 'failed_ids': ev.failed_ids,
                    'stop': ev.launched > 0 and ((outputs.r_wave.values.name == 'canary' and ev.ok < ev.launched) or ev.failure_percent > inputs.max_failure_percent or ev.running > 0),
                    'reason': ev.launched == 0 ? '' : ((outputs.r_wave.values.name == 'canary' and ev.ok < ev.launched) ? 'the canary did not succeed (' ~ ev.failed ~ ' failed, ' ~ ev.running ~ ' still running)'
                      : (ev.failure_percent > inputs.max_failure_percent ? outputs.r_wave.values.name ~ ' failed ' ~ ev.failure_percent ~ '% of its replays, above max_failure_percent ' ~ inputs.max_failure_percent
                      : (ev.running > 0 ? ev.running ~ ' replays of ' ~ outputs.r_wave.values.name ~ ' were still running after replay_timeout' : '')))} | toJson }}
              - id: r_wave_record
                type: io.kestra.plugin.core.kv.Set
                key: "{{ outputs.context.values.scratch_key }}"
                kvType: JSON
                ttl: P7D
                value: "{{ {'ledger': kv(outputs.context.values.scratch_key), 'kind': 'wave', 'add': fromJson(outputs.r_verdict.values.verdict)} | jq(vars.ledger_jq) | first | toJson }}"
              - id: r_canary_tell
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                runIf: "{{ inputs.notify and outputs.r_wave.values.name == 'canary' and fromJson(outputs.r_verdict.values.verdict).launched > 0 }}"
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                payload: >-
                  {% set v = fromJson(outputs.r_verdict.values.verdict) %}{{ {'kind': v.stop ? 'STOPPED' : 'CANARY',
                  'title': v.stop ? 'Canary failed for ' ~ inputs.incident ~ ', campaign stopped' : 'Canary passed for ' ~ inputs.incident,
                  'text': v.stop ? v.reason ~ '. No other execution was replayed. Failed replays: ' ~ (v.failed_ids | join(', '))
                    : v.ok ~ ' of ' ~ v.launched ~ ' canary replays succeeded on revision ' ~ outputs.p_target.values.target ~ '. The waves start in '
                      ~ ({'d': inputs.wave_pause | string} | jq(vars.duration_jq) | first) ~ ' seconds.',
                  'url': outputs.context.values.self_ui, 'card': outputs.i_card.value} | jq(vars.slack_jq) | first | toJson }}
                allowFailure: true
              - id: r_wave_pause
                type: io.kestra.plugin.core.flow.Sleep
                runIf: "{{ fromJson(outputs.r_verdict.values.verdict).stop == false and outputs.r_wave.values.last == 'false' }}"
                duration: "{{ inputs.wave_pause }}"
          - id: r_halt_record
            type: io.kestra.plugin.core.kv.Set
            runIf: "{{ outputs.r_wave.values.halted == 'true' }}"
            key: "{{ outputs.context.values.scratch_key }}"
            kvType: JSON
            ttl: P7D
            value: >-
              {{ {'ledger': kv(outputs.context.values.scratch_key), 'kind': 'stop',
              'add': {'halted': true, 'reason': 'halted by run ' ~ kv('fix-forward.halt.' ~ inputs.incident, errorOnMissing=false) ~ ' before ' ~ outputs.r_wave.values.name}}
              | jq(vars.ledger_jq) | first | toJson }}
          - id: r_wave_end
            type: io.kestra.plugin.core.output.OutputValues
            values:
              stop: "{{ outputs.r_wave.values.last == 'true' or (kv(outputs.context.values.scratch_key).stop ?? false) }}"
      - id: r_final_members
        type: io.kestra.plugin.core.http.Download
        uri: >-
          {{ outputs.context.values.api }}/executions/search?page=1&size=1000&sort=state.startDate:asc&filters%5Bnamespace%5D%5BEQUALS%5D={{ outputs.i_card.value.namespace }}&filters%5BflowId%5D%5BEQUALS%5D={{ outputs.i_card.value.flowId }}&filters%5Blabels%5D%5BEQUALS%5D%5Bfix-forward.incident%5D={{ inputs.incident }}
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT2M
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT30S
          maxDuration: PT3M
      - id: r_final_replays
        type: io.kestra.plugin.core.http.Download
        uri: >-
          {{ outputs.context.values.api }}/executions/search?page=1&size=1000&sort=state.startDate:asc&filters%5Bnamespace%5D%5BEQUALS%5D={{ outputs.i_card.value.namespace }}&filters%5BflowId%5D%5BEQUALS%5D={{ outputs.i_card.value.flowId }}&filters%5Blabels%5D%5BEQUALS%5D%5Bsystem.replay%5D=true&filters%5BstartDate%5D%5BGREATER_THAN_OR_EQUAL_TO%5D={{ outputs.p_since.values.start | urlencode }}
        headers:
          Authorization: "{{ secret('KESTRA_API_AUTHORIZATION') }}"
        timeout: PT2M
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT30S
          maxDuration: PT3M
      - id: r_final
        type: io.kestra.plugin.core.output.OutputValues
        values:
          chains: >-
            {{ {'members': fromJson(read(outputs.r_final_members.uri)).results ?? [], 'execs': fromJson(read(outputs.r_final_replays.uri)).results ?? [],
            'successes': fromJson(read(outputs.p_wins.uri)).results ?? [], 'ns': outputs.i_card.value.namespace, 'flow': outputs.i_card.value.flowId,
            'incident': inputs.incident, 'target': outputs.p_target.values.target | number, 'warn_ok': inputs.count_warning_as_success,
            'fixed_outside': inputs.fixed_outside_flow, 'include_superseded': inputs.include_superseded, 'after': outputs.context.values.window_after, 'before': outputs.context.values.window_before, 'max': 1000000} | jq(vars.chains_jq) | first | toJson }}
      - id: r_outcome
        type: io.kestra.plugin.core.output.OutputValues
        values:
          outcome: >-
            {% set l = kv(outputs.context.values.scratch_key) %}{% set c = fromJson(outputs.r_final.values.chains).counts %}{{
            (l.halted ?? false) ? 'HALTED' : ((l.stop ?? false) and not ((l.reason ?? '') == '') ? 'STOPPED'
            : (((c.CANDIDATE ?? 0) + (c.FAILED_ON_TARGET ?? 0) + (c.IN_FLIGHT ?? 0) + (c.OUT_OF_WINDOW ?? 0)) == 0 ? 'RESOLVED' : 'PARTIAL')) }}
          reason: "{{ kv(outputs.context.values.scratch_key).reason ?? '' }}"
      - id: r_card_final
        type: io.kestra.plugin.core.kv.Set
        key: "{{ outputs.context.values.card_key }}"
        kvType: JSON
        value: >-
          {% set c = kv(outputs.context.values.card_key) %}{% set l = kv(outputs.context.values.scratch_key) %}{% set o = outputs.r_outcome.values.outcome %}{{ {'card': c, 'now': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')),
          'set': {'status': o == 'RESOLVED' ? 'RESOLVED' : 'PARTIAL', 'campaign': null,
            'resolved_revision': o == 'RESOLVED' ? (outputs.p_target.values.target | number) : (c.resolved_revision ?? null),
            'resolved_at': o == 'RESOLVED' ? now() : (c.resolved_at ?? null),
            'last_campaign': {'execution': execution.id, 'outcome': o, 'reason': outputs.r_outcome.values.reason, 'target': outputs.p_target.values.target | number,
              'replays': l.replays | length, 'skipped': l.skipped | length, 'chains': fromJson(outputs.r_final.values.chains).counts, 'ended_at': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC'))},
            'version': (c.version ?? 0) + 1},
          'event': {'event': 'campaign ended ' ~ o ~ (outputs.r_outcome.values.reason == '' ? '' : ': ' ~ outputs.r_outcome.values.reason), 'execution': execution.id}}
          | jq(vars.card_jq) | first | toJson }}
      - id: r_markdown
        type: io.kestra.plugin.core.output.OutputValues
        values:
          md: >-
            {{ {'campaign': execution.id, 'card': outputs.i_card.value, 'outcome': outputs.r_outcome.values.outcome, 'reason': outputs.r_outcome.values.reason,
            'target': outputs.p_target.values.target | number, 'ledger': kv(outputs.context.values.scratch_key), 'final': fromJson(outputs.r_final.values.chains)}
            | jq(vars.campaign_md_jq) | first }}
      - id: r_write
        type: io.kestra.plugin.core.storage.Write
        content: "{{ outputs.r_markdown.values.md }}"
        extension: .md
      - id: r_publish
        type: io.kestra.plugin.core.namespace.UploadFiles
        description: Keeps each campaign report as fix-forward/<incident>/campaign-<execution id>.md.
        namespace: "{{ flow.namespace }}"
        filesMap: "{{ {'fix-forward/' ~ inputs.incident ~ '/campaign-' ~ execution.id ~ '.md': outputs.r_write.uri} | toJson }}"
      - id: r_report
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.r_markdown.values.md }}"
      - id: r_tell
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        runIf: "{{ inputs.notify }}"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {% set o = outputs.r_outcome.values.outcome %}{% set c = fromJson(outputs.r_final.values.chains).counts %}{% set l = kv(outputs.context.values.scratch_key) %}{{ {
          'kind': o == 'RESOLVED' ? 'FINISHED' : (o == 'HALTED' ? 'HALTED' : (o == 'STOPPED' ? 'STOPPED' : 'PARTIAL')),
          'title': (o == 'RESOLVED' ? 'Incident ' ~ inputs.incident ~ ' resolved on revision ' ~ outputs.p_target.values.target : 'Campaign for ' ~ inputs.incident ~ ' ended ' ~ o),
          'text': (l.replays | length) ~ ' replays started, ' ~ (l.skipped | length) ~ ' executions skipped.'
            ~ (outputs.r_outcome.values.reason == '' ? '' : ' ' ~ outputs.r_outcome.values.reason ~ '.')
            ~ (o == 'RESOLVED' ? ' A new failure on this revision or later reopens the incident as REGRESSED.' : ' Run PLAN again to see what is left.'),
          'fields': ['*Chains*\n' ~ (c | toJson), '*Report*\nfix-forward/' ~ inputs.incident ~ '/campaign-' ~ execution.id ~ '.md'],
          'url': outputs.context.values.self_ui, 'card': outputs.i_card.value} | jq(vars.slack_jq) | first | toJson }}
        allowFailure: true
      - id: r_release
        type: io.kestra.plugin.core.kv.Delete
        key: "fix-forward.lease.{{ inputs.incident }}"
        errorOnMissing: false
      - id: r_result
        type: io.kestra.plugin.core.output.OutputValues
        values:
          summary: >-
            {{ {'action': 'REPLAY', 'incident': inputs.incident, 'outcome': outputs.r_outcome.values.outcome, 'reason': outputs.r_outcome.values.reason,
            'target_revision': outputs.p_target.values.target | number, 'replays': kv(outputs.context.values.scratch_key).replays,
            'skipped': kv(outputs.context.values.scratch_key).skipped, 'waves': kv(outputs.context.values.scratch_key).waves,
            'chains': fromJson(outputs.r_final.values.chains).counts,
            'report': 'fix-forward/' ~ inputs.incident ~ '/campaign-' ~ execution.id ~ '.md'} | toJson }}

errors:
  - id: explain_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: >-
      {{ inputs.action }}{{ (inputs.incident ?? '') == '' ? '' : ' of ' ~ inputs.incident }} failed:
      {% for l in errorLogs() %}{{ loop.index < 3 ? '[' ~ l.taskId ~ '] ' ~ (l.message | abbreviate(400)) ~ ' ' : '' }}{% endfor %}
  - id: tell_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    runIf: "{{ inputs.notify and inputs.action == 'REPLAY' and ((outputs.i_card.value ?? {}).id ?? '') != '' }}"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {'kind': 'STOPPED', 'title': 'Campaign for ' ~ inputs.incident ~ ' stopped',
      'text': (errorLogs() | jq('[.[] | .message] | .[0] // "See the logs of the engine run."') | first | abbreviate(800)),
      'url': outputs.context.values.self_ui, 'card': outputs.i_card.value} | jq(vars.slack_jq) | first | toJson }}
    allowFailure: true

afterExecution:
  - id: close_interrupted_campaign
    type: io.kestra.plugin.core.kv.Set
    description: >-
      Runs after every end, kill and cancel included. A campaign still marked as running here did not reach its
      report: the card goes back to its status before the campaign if nothing was replayed, or to INTERRUPTED.
    runIf: >-
      {{ inputs.action == 'REPLAY' and ((kv('fix-forward.incident.' ~ (inputs.incident ?? ''), errorOnMissing=false) ?? {}).status ?? '') == 'IN_CAMPAIGN'
      and ((kv('fix-forward.incident.' ~ (inputs.incident ?? ''), errorOnMissing=false) ?? {}).campaign ?? '') == execution.id }}
    key: "fix-forward.incident.{{ inputs.incident }}"
    kvType: JSON
    value: >-
      {% set c = kv('fix-forward.incident.' ~ inputs.incident) %}{% set l = kv('fix-forward.scratch.' ~ execution.id, errorOnMissing=false) ?? {} %}{% set n = (l.replays ?? []) | length %}{{ {
      'card': c, 'now': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC')),
      'set': {'status': n > 0 ? 'INTERRUPTED' : (c.previous_status ?? 'OPEN'), 'campaign': null, 'version': (c.version ?? 0) + 1,
        'last_campaign': {'execution': execution.id, 'outcome': n > 0 ? 'INTERRUPTED' : 'NOT_STARTED', 'state': execution.state, 'replays': n, 'ended_at': (now() | date("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", timeZone='UTC'))}},
      'event': {'event': 'campaign ended ' ~ execution.state ~ (n > 0 ? ' after ' ~ n ~ ' replays' : ' before any replay'), 'execution': execution.id}}
      | jq(vars.card_jq) | first | toJson }}
  - id: tell_interrupted_campaign
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    runIf: "{{ inputs.notify and inputs.action == 'REPLAY' and (['KILLED', 'CANCELLED'] contains (execution.state ~ '')) }}"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {'kind': 'STOPPED', 'title': 'Campaign for ' ~ inputs.incident ~ ' ' ~ (execution.state | lower),
      'text': 'The engine run ended ' ~ execution.state ~ ' before its report. Run PLAN to see what is left.',
      'url': inputs.kestra_url ~ '/ui/' ~ ((inputs.tenant ?? '') == '' ? 'main' : inputs.tenant) ~ '/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id,
      'card': {'id': inputs.incident}} | jq(vars.slack_jq) | first | toJson }}
    allowFailure: true
  - id: release_lease
    type: io.kestra.plugin.core.kv.Delete
    runIf: "{{ inputs.action == 'REPLAY' and (kv('fix-forward.lease.' ~ (inputs.incident ?? ''), errorOnMissing=false) ?? '') == execution.id }}"
    key: "fix-forward.lease.{{ inputs.incident }}"
    errorOnMissing: false
  - id: clear_halt
    type: io.kestra.plugin.core.kv.Delete
    runIf: "{{ inputs.action == 'REPLAY' }}"
    key: "fix-forward.halt.{{ inputs.incident }}"
    errorOnMissing: false
  - id: drop_scratch
    type: io.kestra.plugin.core.kv.Delete
    key: "fix-forward.scratch.{{ execution.id }}"
    errorOnMissing: false

outputs:
  - id: summary
    type: JSON
    description: What the run did. For REPLAY, the outcome, every replay with its restart point, and the chains after the campaign.
    value: >-
      {{ outputs.r_result.values.summary ?? outputs.p_result.values.summary ?? outputs.st_result.values.summary
      ?? outputs.s_result.values.summary ?? outputs.w_result.values.summary ?? outputs.d_result.values.summary
      ?? outputs.h_result.values.summary ?? outputs.x_result.values.summary ?? outputs.m_result.values.summary ?? '{}' }}

triggers:
  - id: on_failure
    type: io.kestra.plugin.core.trigger.Flow
    description: Starts a WATCH run for every failed execution of a flow that carries the label fix-forward=watch.
    disabled: true
    states:
      - FAILED
    inputs:
      action: WATCH
    dependsOn:
      - labels:
          fix-forward: watch
  - id: weekly_board
    type: io.kestra.plugin.core.trigger.Schedule
    description: Posts the incident board to Slack every Monday morning.
    disabled: true
    cron: "0 8 * * 1"
    inputs:
      action: STATUS
  - id: scan
    type: io.kestra.plugin.core.trigger.Schedule
    description: Adopts failures no WATCH run saw, tells incidents about new revisions and finds stuck campaigns.
    disabled: true
    cron: "*/15 * * * *"
    inputs:
      action: SCAN

extend:
  title: "Fix forward: replay every execution a bug failed on the fixed flow revision"
  metaTitle: Replay failed Kestra executions on the fixed flow revision
  shortDescription: Groups the failed executions of opted-in flows into incidents by error fingerprint. Once the fix is deployed, it replays each of them on the new revision from a restart point computed for that execution, canary first, then in waves with a failure budget, behind an approval.
  metaDescription: Group failed Kestra executions into incidents by error, then replay them on the fixed revision with computed restart points, a canary, waves and an approval.
  description: |
    A bug rarely fails one execution. A daily flow fails seven days in a row, an upstream schema change fails every run of a sync for an afternoon, and each of those executions has its own inputs or schedule date. Once the fix is deployed, Kestra can bulk-replay a selection of them on the latest revision, but each one then starts over from its first task, all at once, so every task that already succeeded runs again. Restarting each one at the right task on the new revision means replaying them one by one and picking the task every time, with no canary, no pacing and no record of what was redone. This flow does that work for every execution of an incident. It fingerprints each failure of the flows you opt in, groups them into incidents, and when a fix lands it replays every affected execution on the fixed revision from a restart point it computes for that execution: a canary first, then waves with a failure budget, after a person approves the plan.

    ## Safety

    | Guard | What it stops |
    | --- | --- |
    | `PLAN` is a dry run, and `REPLAY` waits at a `Pause` whose decision defaults to `REJECT` | a replay nobody read or approved |
    | A restart point per execution, from the tasks it ran and the diff between its revision and the target | a replay that starts after the fixed task, that Kestra refuses with HTTP 409, or that stays RUNNING forever |
    | `NO_FIX` when the target revision changes nothing the execution ran up to its failure | replaying the same bug again, unless `fixed_outside_flow` says the cause was elsewhere |
    | `HOLD` when a replay would start from the first task, unless `allow_from_start` | tasks that already succeeded running again without anyone accepting it |
    | `HOLD` when a task listed in `never_rerun` or in the flow label `fix-forward.never-rerun` already succeeded and would run again | charging a customer or sending an email twice |
    | Warnings for every task outside the Kestra core that sends, publishes, uploads or writes, and every HTTP call other than GET, that a replay runs again | approving without knowing which side effects repeat |
    | Downstream flows (Flow triggers and Subflow calls) listed in the plan and in the approval request | approving without knowing what the successful replays will start |
    | Canary first, with an optional breakpoint before a chosen task | a wrong fix reaching every execution |
    | `max_failure_percent` per wave and `replay_timeout` | a campaign that keeps going while its replays fail or hang |
    | Chains read again before each wave, and SUPERSEDED chains left out | replaying an execution that someone replayed by hand meanwhile, or whose work a later run already redid |
    | A KV lease per incident, written with `overwrite: false` and read back | two campaigns replaying the same incident |
    | Waves capped to the concurrency limit of the flow and started when it is idle, when its behavior is CANCEL or FAIL | replays cancelled or failed by the concurrency limit of the flow |
    | `replay_window` and `HALT` | replays during business hours, a campaign nobody can stop |
    | Flow `checks` with `BLOCK_EXECUTION` | a run with missing inputs: the API answers HTTP 422 and no execution is created |
    | `afterExecution`, which also runs after a kill or a cancel, and the 3-day TTL of the lease | a killed campaign leaving its incident locked |

    ## How it works

    One flow does everything. The `action` input picks the job: the triggers start `WATCH`, `SCAN` and `STATUS`, and people start `PLAN`, `REPLAY`, `HALT`, `DISMISS`, `MERGE` and `EXPLAIN`.

    1. A flow opts in with the label `fix-forward: watch`. The `on_failure` Flow trigger starts a `WATCH` run for each FAILED execution of such a flow.
    2. `WATCH` downloads the execution and its ERROR logs (`w_execution`, `w_logs`). `fingerprint_jq` takes the failed leaf task and the first line of its first error, and masks UUIDs, timestamps, ids of 20 to 24 characters, hex values and numbers. A hash of namespace, flow, task and that signature gives the incident id, such as `ff-1a2b3c4d5e6f`, so the same bug gives the same id in every execution.
    3. `w_label_execution` labels the failed execution `fix-forward.incident=<id>`. The labels endpoint replaces every label that is not a system label, so the existing ones are sent back with the new one. A replay inherits the label, which is how the engine finds every execution of an incident later.
    4. `w_write_card` opens the incident card, the KV pair `fix-forward.incident.<id>`, and `w_alert` posts it to Slack. A failure of a RESOLVED or VERIFIED incident on the resolved revision or a later one reopens it as REGRESSED, and a failure of a DISMISSED one reopens it as OPEN. WATCH runs can run side by side: the first one to write the key `fix-forward.claim.<id>.<version>` with `overwrite: false` writes the card and sends the alert, so each transition gives one message.
    5. `SCAN` runs every 15 minutes. It starts a `WATCH` run for each failure of the last `adopt_days` that no WATCH run labeled, for example while the trigger was disabled. For each open incident it compares the latest revision of the flow with the revision of the last failure. A newer revision is recorded as the fix candidate, posted to Slack and, with `auto_plan`, answered with a `PLAN` run. SCAN also marks a RESOLVED incident VERIFIED after `verify_hours` without a new failure, marks a campaign whose run ended without closing its card INTERRUPTED, and deletes the card and reports of incidents closed more than `retention_days` ago.
    6. `PLAN` reads every execution labeled with the incident, the replays of the flow and its successful runs since the incident started. `chains_jq` groups them into chains: an original execution and its replays, which keep the id of the original in `originalId`. Each chain gets a status (see below), and the chains still to fix become candidates, at most `max_chains`.
    7. For each revision the candidates failed on, `p_previews` computes the restart point of one of them on the target revision with `restart_jq` (see below). PLAN also reads the concurrency of the target revision, checks `canary_breakpoint`, walks the flows downstream through `/dependencies`, and writes everything to `fix-forward/<incident>/plan.md`, the `p_report` log and Slack.
    8. `REPLAY` builds the same plan and fails before taking the lease if the plan has a blocker. It takes the lease `fix-forward.lease.<incident>`, marks the card IN_CAMPAIGN and posts the approval request. `r_approve` waits up to `approval_timeout` for decision `APPROVE`. The approver can also drop executions with `skip_executions` and change `wave_size`.
    9. `r_waves` (LoopUntil) runs the canary, then one wave per iteration. Before each wave it checks the HALT key and `replay_window`, waits until the flow is idle when its concurrency would drop replays, and searches the chains again. For each execution it computes the restart point again from that execution's own task runs, labels it with `fix-forward.campaign` and `fix-forward.wave`, and calls `POST /api/v1/executions/{id}/actions/replay?revision=<target>&taskRunId=<restart point>`, adding `breakpoints=<task>` for the canary when `canary_breakpoint` is set.
    10. `r_wait` polls the wave label every 10 seconds until every replay of the wave ended or `replay_timeout` passed. A canary that does not succeed, a wave whose failures exceed `max_failure_percent`, or a replay still running at the timeout stops the campaign.
    11. At the end, `r_final` reads the chains again. The outcome is RESOLVED when no chain is left to fix, PARTIAL when some are, STOPPED when the canary, the failure budget or the timeout stopped the campaign, and HALTED after HALT. The card, the report `fix-forward/<incident>/campaign-<execution id>.md`, the log and Slack get the outcome, and `r_release` frees the lease. If the run is killed or cancelled instead, `afterExecution` puts the card back to its previous status when nothing was replayed, or to INTERRUPTED, and frees the lease.
    12. `HALT` writes `fix-forward.halt.<incident>`, which the campaign reads before its next wave. `DISMISS` closes an incident with `dismiss_reason`. `MERGE` moves the executions of `merge_from` into `incident` and keeps the merged card as an alias, so later failures with its signature join the surviving incident. `EXPLAIN` tells, for one execution, its signature, incident, chain and restart point on the latest revision.
    13. `STATUS` writes the board of every incident to `fix-forward/STATUS.md`, logs it and posts a summary to Slack. The `weekly_board` schedule runs it every Monday at 08:00.

    ## Restart point

    The rules come from replays measured on Kestra 2.0.8. PLAN shows the result for each failed revision before anything runs, and REPLAY computes it again for each execution.

    | What the target revision changes | What a Kestra 2.0.8 replay does | What the engine does |
    | --- | --- | --- |
    | Nothing the execution ran up to its failure | fails again with the same error | `NO_FIX`, unless `fixed_outside_flow` |
    | The failed task | runs the new definition | `TASK` from the failed task |
    | A task that ran before the failure | ignores the change unless the replay starts at that task | `TASK` from the earliest changed task |
    | A new task placed before the restart point | never runs it, and the replay stays RUNNING | `TASK` from the task before it, or from the flowable that contains it |
    | A task that ran is gone | refuses a replay from any later task with HTTP 409 | `FROM_START`, held unless `allow_from_start` |
    | The restart point is a loop or a task inside one | does not run the loop again | `FROM_START`, held unless `allow_from_start` |
    | `restart_policy: FROM_START` | runs every task again | `FROM_START` |

    On top of that, a replay that would run again a task listed in `never_rerun` or in `fix-forward.never-rerun` after it succeeded is `HOLD`. A held execution is never replayed: its reasons are in the plan, in the campaign report and in `EXPLAIN`.

    ## Incident and chain statuses

    | Incident card | Meaning |
    | --- | --- |
    | OPEN | failing, and no campaign fixed it yet |
    | IN_CAMPAIGN | a REPLAY run holds the lease |
    | RESOLVED | the last campaign left no chain to fix |
    | VERIFIED | RESOLVED, and SCAN found no new failure for `verify_hours` |
    | PARTIAL | the last campaign stopped, was halted or left chains to fix |
    | INTERRUPTED | the campaign run ended without its report after it replayed some executions |
    | REGRESSED | failed again on the resolved revision or a later one |
    | DISMISSED | closed without a replay, with a reason |
    | MERGED | an alias of another incident |

    | Chain | Meaning |
    | --- | --- |
    | CANDIDATE | a campaign replays it |
    | RESOLVED | one of its executions succeeded, or ended in WARNING with `count_warning_as_success` |
    | IN_FLIGHT | one of its executions is still running |
    | FAILED_ON_TARGET | its latest replay already failed on the target revision or a later one; replayed again only with `fixed_outside_flow` |
    | SUPERSEDED | a later successful run with the same schedule date (scheduled runs) or the same inputs (manual and API runs) did the work; replayed only with `include_superseded` |
    | MOVED | its latest replay failed with another error, so it belongs to another incident now |
    | OUT_OF_WINDOW | it started outside `failed_after` and `failed_before` |

    ## What you get

    - One incident per bug instead of one alert per failed execution, with a Slack message when it opens, regresses or comes back after a dismissal.
    - A plan to read before anything runs: the chains by status, the restart point for each revision the executions failed on, the tasks a replay runs again, those that act on another system, the downstream flows and the waves.
    - Replays that start at the right task with their original inputs, show in the UI as replays of the original execution, and carry `fix-forward.campaign` and `fix-forward.wave` labels.
    - A campaign that stops by itself on a failed canary, a broken failure budget, replays still running at `replay_timeout`, HALT, or a kill.
    - An incident card with its status, revisions, last campaign and last 30 events, a report per campaign, and a board of every incident in `fix-forward/STATUS.md`.
    - The history of an incident as a label filter: `fix-forward.incident` on the executions and their replays, `fix-forward.for-incident` and `fix-forward.action` on the engine runs.
    - A `summary` output on every run, so CI or another flow can drive the engine through the API.

    ## Who it's for

    - Platform teams that run Kestra for many teams and want one way to redo what a bug broke.
    - Data engineers with daily or hourly flows, where one bug fails one execution per schedule date and each must be redone for its own date.
    - On-call engineers who fix forward and want a canary, a pace and a record instead of replaying executions one by one.
    - Teams whose flows charge, email or publish, and who need to know which tasks a replay will run again before it does.

    ## Why orchestrate this with Kestra

    Fixing forward needs what Kestra already stores: every execution with its inputs and task runs, every revision of every flow, and a replay API that restarts an execution at a chosen task on a chosen revision. The engine is one flow on top of that API, with no other service or database. The KV store holds the incident cards and the lease, labels tie executions to incidents and waves, and namespace files keep the plans and reports. `Pause` with typed `onResume` inputs is the approval, `LoopUntil` runs the waves and the polling, flow `checks` refuse bad inputs before an execution exists, `afterExecution` closes a killed campaign, an SLA fails a run stuck for 3 days, and every API call retries with a time budget. A Flow trigger filtered on a label is the opt-in.

    ## Tested end to end

    A harness ran 6 scenarios against Kestra 2.0.8 (H2, local storage, basic auth, `plugin-slack` 2.2.3 posting to a local mock): 84 checks, none failing. Each scenario deploys watched test flows, makes them fail, deploys a fix as a new revision and drives the engine through the API.

    | Scenario | Checks | What it covers |
    | --- | --- | --- |
    | happy | 29 | SCAN adopts 2 failures that happened while the trigger was off; 7 failures of a daily flow, each with its own run id, row and time in the error, give one incident and one alert; a manual rerun of one day makes it SUPERSEDED; SCAN spots the fix and starts a PLAN; the campaign replays 6 executions from the fixed task inside an `If`, in a canary and 3 waves, without running the first task again; RESOLVED, report, board, Slack line breaks, VERIFIED, then REGRESSED on a later revision |
    | safety | 14 | HTTP 422 for missing inputs, unknown incident, REPLAY without a fix refused before the lease, a second REPLAY refused while the first waits for approval, REJECT restores the card and frees the lease, a partial fix stops at the failure budget after a passing canary, the next PLAN finds 2 RESOLVED and 2 FAILED_ON_TARGET chains, DISMISS and its reopening |
    | holds | 9 | a removed task holds every execution, `allow_from_start` replays them from the first task, HALT between the canary and the first wave, a kill after the canary gives INTERRUPTED and frees the lease, a new campaign finishes the rest |
    | extras | 13 | a flow with `concurrency.limit: 1` and behavior CANCEL gets waves of 1 and no cancelled replay; an HTTP POST task flagged as a side effect; the downstream flow listed; `never_rerun` and the flow label hold the executions and nobody is charged twice; EXPLAIN, and HTTP 422 without `execution_id` |
    | more | 12 | two errors in one task give two incidents, MERGE and its refusal, a later failure joining the merged incident, `failed_after`, an unknown `canary_breakpoint`, a canary held at its breakpoint until a person resumes it |
    | ops | 7 | UTC timestamps on the card, an unknown id in `skip_executions` stops before any replay, `replay_window`, the approver's `skip_executions` and `wave_size`, retention |

    These Kestra 2.0.8 behaviors were measured while building it, and the flow is written around them:

    - The bulk replay, `POST /executions/replay/by-ids?latestRevision=true`, starts every selected execution over from its first task on the latest revision.
    - A replay keeps the inputs of the execution it replays, and its `originalId` is the first execution of the chain. An execution that is not a replay has its own id as `originalId`.
    - A replay from a task after a task that ran and is gone answers HTTP 409. A new task inserted before the restart point never runs and leaves the replay RUNNING. A replay from a loop, or from a task inside one, does not run the loop again.
    - Replays obey the concurrency limit of the flow: with behavior CANCEL, a burst of replays is cancelled.
    - The execution labels endpoint replaces every label that is not a system label.
    - A `Subflow` task cannot start the flow it belongs to ("Recursive call"), so SCAN starts WATCH and PLAN runs through the executions API.
    - `GET /executions/{id}` returns no outputs, and the logs endpoint ignores its `taskRunId` filter, so the fingerprint picks the leaf task's log lines itself.
    - `/flows/{ns}/{id}/dependencies?destinationOnly=true` returns nothing, so the engine reads the full graph and walks it from the flow.
    - `afterExecution` runs after KILLED and CANCELLED, while `finally` does not run after a kill.
    - Pebble keeps `'\n'` in a string literal as a backslash followed by an n, and `slice` beyond the end of a list throws. Line breaks in Slack texts and the board excerpt are therefore made in jq.
    - A `DURATION` input renders as seconds, such as `7200.0`.

    ## Prerequisites

    - Kestra 2.0, open source. It was written for 2.0 and tested on 2.0.8.
    - `plugin-slack`, included in the full Kestra image.
    - An API credential that can search and read executions and logs, read flows with their revisions and dependencies, set execution labels, replay executions, and start executions of this flow.
    - The flows to watch carry the label `fix-forward: watch`.

    ### Secrets

    - `KESTRA_API_AUTHORIZATION`: the full `Authorization` header value for the API of this instance, such as `Basic <base64 of user:password>` or `Bearer <API token>` (required).
    - `SLACK_WEBHOOK_URL`: a Slack incoming webhook URL for the alerts, plans, approval requests and reports (required while `notify` is true, the default).

    In open source Kestra, a secret is an environment variable such as `SECRET_KESTRA_API_AUTHORIZATION` that holds the base64 of the value.

    ### Labels on watched flows

    - `fix-forward: watch`: opts the flow in (required).
    - `fix-forward.never-rerun: charge,send_invoice`: task ids that must never run twice for one execution (optional).

    ### Inputs

    | Input | Default | Used by | Purpose |
    | --- | --- | --- | --- |
    | `action` | `STATUS` | all | the job of the run |
    | `incident` | | PLAN, REPLAY, HALT, DISMISS, MERGE | incident id, such as `ff-1a2b3c4d5e6f` |
    | `merge_from` | | MERGE | the incident that joins `incident` |
    | `execution_id` | | EXPLAIN, WATCH | the execution to explain, or to fingerprint by hand |
    | `dismiss_reason` | | DISMISS | why the incident is closed without a replay |
    | `failed_after`, `failed_before` | | PLAN, REPLAY | only executions that started in this window |
    | `target_revision` | latest | PLAN, REPLAY | revision to replay on |
    | `restart_policy` | `SMART` | PLAN, REPLAY, EXPLAIN | `SMART` or `FROM_START` |
    | `allow_from_start` | `false` | PLAN, REPLAY, EXPLAIN | accept replays from the first task |
    | `fixed_outside_flow` | `false` | PLAN, REPLAY, EXPLAIN | the cause was data, an API, a file or a secret |
    | `never_rerun` | | PLAN, REPLAY, EXPLAIN | task ids that must not run twice |
    | `include_superseded` | `false` | PLAN, REPLAY | also replay SUPERSEDED chains |
    | `count_warning_as_success` | `true` | PLAN, REPLAY | a WARNING replay counts as fixed |
    | `canary_count` | `1` | REPLAY | executions replayed alone first |
    | `canary_breakpoint` | | REPLAY | stop the canary replays before this task |
    | `wave_size` | `10` | REPLAY | replays per wave |
    | `wave_pause` | `PT1M` | REPLAY | wait between waves |
    | `max_failure_percent` | `20` | REPLAY | failure budget per wave |
    | `replay_window` | | REPLAY | UTC hours in which a wave may start, such as `22:00-06:00` |
    | `replay_timeout` | `PT2H` | REPLAY | how long a wave waits for its replays |
    | `approval_timeout` | `PT24H` | REPLAY | how long the approval waits before the run cancels itself |
    | `max_chains` | `500` | PLAN, REPLAY | most executions per campaign |
    | `adopt_days` | `7` | SCAN | how far back SCAN looks for failures no WATCH saw |
    | `verify_hours` | `24` | SCAN | quiet hours before RESOLVED becomes VERIFIED |
    | `auto_plan` | `true` | SCAN | start a PLAN run when a fix candidate appears |
    | `retention_days` | `30` | SCAN | days before a closed incident and its reports are deleted |
    | `notify` | `true` | all | send Slack messages |
    | `kestra_url` | `http://localhost:8080` | all | base URL of this instance, for the API and the links |
    | `tenant` | | all | tenant id, Enterprise Edition only |

    ### State it keeps

    | Where | Name | What |
    | --- | --- | --- |
    | KV store of the engine namespace | `fix-forward.incident.<id>` | the incident card |
    | KV store | `fix-forward.lease.<id>` | the REPLAY run that holds the incident, 3-day TTL |
    | KV store | `fix-forward.halt.<id>` | written by HALT, cleared when the campaign ends |
    | KV store | `fix-forward.claim.<id>.<version>` | the WATCH run that writes a card transition, 7-day TTL |
    | KV store | `fix-forward.scratch.<execution id>` | the ledger of one PLAN or REPLAY run, deleted when it ends |
    | Namespace files | `fix-forward/STATUS.md`, `fix-forward/<id>/plan.md`, `fix-forward/<id>/campaign-<execution id>.md` | the board, the last plan, one report per campaign |
    | Execution labels | `fix-forward.incident`, `fix-forward.campaign`, `fix-forward.wave` | incident, campaign and wave of the watched executions and their replays |
    | Engine run labels | `fix-forward.action`, `fix-forward.for-incident` | what each engine run did, and for which incident |

    ## Quick start

    1. Create the two secrets on the instance, and save the flow in `company.platform` or any namespace of your choice.
    2. Set the default of `kestra_url` to the URL of this instance, such as `https://kestra.example.com`. The engine calls the API there and builds the Slack links from it, and the triggers run with the defaults.
    3. Add `fix-forward: watch` to the labels of the flows to watch, and `fix-forward.never-rerun` to those whose tasks must not run twice.
    4. Enable the `on_failure` and `scan` triggers, and `weekly_board` for the Monday board. Run `SCAN` once by hand to adopt the failures of the last `adopt_days`.
    5. When a watched flow fails, Slack gets the incident id. Fix the flow and save it, which creates a new revision. Within 15 minutes SCAN posts the fix candidate and, with `auto_plan`, the plan.
    6. Read the plan in the `p_report` log or in the namespace file `fix-forward/<incident>/plan.md`, or run `EXPLAIN` for one execution. Then execute the flow with `action: REPLAY` and `incident: <id>`.
    7. Resume the paused execution with decision `APPROVE`, optionally with `skip_executions` and `wave_size`. Follow the canary and the waves in Slack, and run `HALT` to stop before the next wave.
    8. Run `STATUS` any time for the board.

    ## How to extend

    - Approve from Slack: a small flow with a Webhook trigger, linked from the approval message, that resumes the paused execution through `POST /api/v1/executions/{id}/actions/resume`.
    - Open a ticket in Jira, GitHub or PagerDuty next to `w_alert` when an incident opens or regresses, and close it when the card becomes VERIFIED.
    - Start `REPLAY` from your deployment pipeline after a fix ships. The campaign still waits for its approval.
    - Mask the identifiers of your own error messages in `fingerprint_jq`, so one bug keeps one signature.
    - Add the task types of your stack to the side-effect pattern in `restart_jq`.
    - Chart the cards of the KV store, or the `fix-forward.*` labels, in a dashboard.

    ## What it does not do

    - It only watches FAILED executions of flows labeled `fix-forward: watch`. Executions that end KILLED, CANCELLED or WARNING are not incidents, and the engine never fingerprints its own runs.
    - Each search reads one page of 1,000 executions. PLAN blocks when an incident has more than 1,000 executions or the flow more than 1,000 replays since the incident started, and SUPERSEDED is only detected among the first 1,000 successful runs.
    - Side-effect detection reads task types and HTTP methods, so it is a heuristic. It warns and does not hold: list such tasks in `never_rerun` to hold the executions that would run them again.
    - SUPERSEDED covers scheduled runs, by schedule date, and manual or API runs, by inputs. Executions started by other triggers are never superseded.
    - A failure without an ERROR log gets a generic signature, so such failures of one task share an incident.
    - The restart rules were measured on Kestra 2.0.8. Another 2.x release may replay differently; PLAN and EXPLAIN show the restart point before anything runs.
    - The `tenant` input follows the Enterprise Edition API paths but was only tested on open source Kestra.
    - Nothing a replay did is undone, and the approval happens in Kestra, not with a button in Slack.

