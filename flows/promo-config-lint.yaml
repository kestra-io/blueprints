id: promo-config-lint
namespace: company.team
description: |
  Stop misconfigured promotions from going live by linting every promotion configuration against the rules that quietly destroy revenue - stacking with another promotion without permission, discounts that leave the margin under the floor, windows that are inverted or already closed, and discounts above the catalog cap. The promotion service POSTs promo_id and config to a keyed webhook on every create or update, while a shipped-disabled daily schedule lints the whole promo file as a safety net.
  Any violation opens a GitHub issue, appends one evidence line per violation to lint-report.txt, and reaches the Slack channel, while a clean catalog is recorded as passing. Every execution publishes the verdict, the violations, the promo id under review, and the number of promotions linted.

triggers:
  - id: on_promo_save
    type: io.kestra.plugin.core.trigger.Webhook
    description: The promotion service POSTs promo_id plus the full config on every promotion create or update, so the lint runs before the record is published.
    key: "{{ secret('PROMO_WEBHOOK_KEY') }}"
  - id: nightly_catalog_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled 06:00 sweep of the whole promo file as a fallback net, switched on only after the webhook path is trusted in your environment.
    cron: "0 6 * * *"
    disabled: true

inputs:
  - id: min_margin_pct
    type: FLOAT
    defaults: 10.0
    description: Lowest margin percentage a promotion may leave after its discount is applied, rendered into the lint so the floor can be tightened per environment.

tasks:
  # --- 1. stage the promo file and lint every rule ---
  - id: promo_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the staged promos.json, the lint verdict and the per-violation evidence file all read and write the same files.
    tasks:
      - id: stage_promo_file
        type: io.kestra.plugin.scripts.shell.Commands
        description: Write promos.json with four promotions - one healthy, one that stacks over a thin margin, one with an inverted and expired window, one that blows the discount cap - so the lint is reproducible without promotion service credentials.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: alpine:3.20
        commands:
          - |
            set -eu
            cat > promos.json <<'PROMOS'
            [
              {"promo_id": "SPRING15", "title": "Spring sitewide markdown", "discount_pct": 15, "max_discount_pct": 50, "margin_pct": 42, "stacking_allowed": false, "stacks_with": [], "start": "2026-09-01T00:00:00Z", "end": "2027-06-30T23:59:59Z"},
              {"promo_id": "FLASH40", "title": "Flash sale stacked on the spring markdown", "discount_pct": 40, "max_discount_pct": 50, "margin_pct": 35, "stacks_with": ["SPRING15"], "start": "2026-10-01T00:00:00Z", "end": "2026-12-25T23:59:59Z"},
              {"promo_id": "SUMMER20", "title": "Summer clearance with flipped dates", "discount_pct": 20, "max_discount_pct": 50, "margin_pct": 30, "stacking_allowed": false, "stacks_with": [], "start": "2026-09-15T00:00:00Z", "end": "2026-08-01T00:00:00Z"},
              {"promo_id": "MEGADEAL80", "title": "Clearance markdown far above the cap", "discount_pct": 80, "max_discount_pct": 50, "margin_pct": 92, "stacking_allowed": false, "stacks_with": [], "start": "2026-11-01T00:00:00Z", "end": "2027-01-31T23:59:59Z"}
            ]
            PROMOS
            echo "promos.json staged with $(wc -l < promos.json) lines"

      - id: lint_promotions
        type: io.kestra.plugin.scripts.python.Script
        description: Lint every promotion against the stacking, discount cap, window and margin rules, absorbing the submitted webhook config when there is one, and emit verdict, violations, promo_id and linted_count through the outputs protocol.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          MIN_MARGIN_PCT: "{{ inputs.min_margin_pct }}"
          PROMO_PAYLOAD: "{{ (trigger.body ?? {}) | toJson }}"
        script: |
          import json
          import os
          from datetime import datetime, timezone

          PROMO_FILE = "promos.json"
          DEFAULT_CAP = 50.0


          def as_number(value):
              if isinstance(value, bool):
                  return None
              if isinstance(value, (int, float)):
                  return float(value)
              if isinstance(value, str):
                  try:
                      return float(value.strip())
                  except ValueError:
                      return None
              return None


          def trim(value):
              return ("%.2f" % value).rstrip("0").rstrip(".")


          def parse_stamp(value):
              if not isinstance(value, str) or not value.strip():
                  return None
              text = value.strip().replace("Z", "+00:00")
              try:
                  parsed = datetime.fromisoformat(text)
              except ValueError:
                  return None
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=timezone.utc)
              return parsed.astimezone(timezone.utc)


          def utc_text(value):
              return value.strftime("%Y-%m-%dT%H:%M:%SZ")


          def decode(value, depth=0):
              if isinstance(value, str) and depth < 4:
                  try:
                      return decode(json.loads(value), depth + 1)
                  except ValueError:
                      return value
              return value


          def as_float(name, fallback):
              raw = os.environ.get(name, "")
              if raw is None or not str(raw).strip():
                  return fallback
              try:
                  return float(str(raw).strip())
              except ValueError:
                  return fallback


          def hit(promo_id, rule, detail):
              return {"promo_id": promo_id, "rule": rule, "detail": detail}


          min_margin = as_float("MIN_MARGIN_PCT", 10.0)
          body = decode(os.environ.get("PROMO_PAYLOAD", ""))
          if not isinstance(body, dict):
              body = {}
          promo_ref = str(body.get("promo_id") or "").strip()
          config = decode(body.get("config"))
          submitted = dict(config) if promo_ref and isinstance(config, dict) else None
          if submitted is not None:
              submitted["promo_id"] = promo_ref

          entries = []
          problem = None
          try:
              with open(PROMO_FILE, "r", encoding="utf-8") as handle:
                  catalog = json.load(handle)
          except FileNotFoundError:
              problem = "promos.json is missing, so no promotion could be linted"
          except (OSError, ValueError) as exc:
              problem = "promos.json is not readable JSON (%s)" % exc
          else:
              if isinstance(catalog, dict):
                  catalog = [catalog]
              if isinstance(catalog, list):
                  entries = catalog
              else:
                  problem = "promos.json must hold an array of promotions"

          if submitted is not None:
              placed = False
              for index, entry in enumerate(entries):
                  if isinstance(entry, dict) and str(entry.get("promo_id") or "").strip() == promo_ref:
                      entries[index] = submitted
                      placed = True
                      break
              if not placed:
                  entries.append(submitted)

          violations = []
          if problem:
              violations.append(hit("promos.json", "unreadable-promo-file", problem))
          elif not entries:
              violations.append(hit("promos.json", "empty-promo-file", "promos.json holds no promotions to lint"))

          now = datetime.now(timezone.utc)
          for entry in entries:
              if not isinstance(entry, dict):
                  violations.append(hit("unknown-promo", "malformed-promotion", "catalog entry is not a JSON object"))
                  continue
              promo_id = str(entry.get("promo_id") or "").strip() or "missing-promo-id"
              if promo_id == "missing-promo-id":
                  violations.append(hit(promo_id, "missing-promo-id", "promotion carries no promo_id to report against"))

              stacks = entry.get("stacks_with")
              if isinstance(stacks, list) and stacks:
                  names = ", ".join(str(name) for name in stacks)
                  allowed = entry.get("stacking_allowed")
                  if allowed is None:
                      violations.append(hit(promo_id, "stacking-not-allowed", "combines with " + names + " and stacking_allowed is required when promotions combine"))
                  elif allowed is not True:
                      violations.append(hit(promo_id, "stacking-not-allowed", "combines with " + names + " while stacking_allowed is not true"))
              elif stacks is not None and not isinstance(stacks, list):
                  violations.append(hit(promo_id, "invalid-field", "stacks_with must be an array of promotion ids"))

              discount = as_number(entry.get("discount_pct"))
              margin = as_number(entry.get("margin_pct"))
              if discount is None:
                  violations.append(hit(promo_id, "invalid-field", "discount_pct is missing or is not a number"))
              elif discount < 0:
                  violations.append(hit(promo_id, "invalid-field", "discount_pct is negative"))
              if margin is None:
                  violations.append(hit(promo_id, "invalid-field", "margin_pct is missing or is not a number"))

              cap = as_number(entry.get("max_discount_pct"))
              if cap is None:
                  cap = DEFAULT_CAP
              if discount is not None and discount > cap:
                  violations.append(hit(promo_id, "discount-over-cap", "discount of " + trim(discount) + "% exceeds the cap of " + trim(cap) + "%"))

              if discount is not None and margin is not None:
                  remaining = margin - discount
                  if remaining < min_margin:
                      violations.append(hit(promo_id, "margin-below-floor", "margin after discount is " + trim(remaining) + "%, below the " + trim(min_margin) + "% floor"))

              start = parse_stamp(entry.get("start"))
              end = parse_stamp(entry.get("end"))
              if start is None or end is None:
                  violations.append(hit(promo_id, "invalid-window", "start and end must be ISO 8601 timestamps"))
              else:
                  if start >= end:
                      violations.append(hit(promo_id, "inverted-window", "start " + utc_text(start) + " is not before end " + utc_text(end)))
                  if end < now:
                      violations.append(hit(promo_id, "window-expired", "window closed on " + utc_text(end) + ", which is already in the past"))

          report = {
              "verdict": "violations" if violations else "clean",
              "violations": violations,
              "promo_id": promo_ref if promo_ref else "all-promos",
              "linted_count": len(entries),
          }
          print("lint %s promo=%s promotions=%d violations=%d" % (report["verdict"], report["promo_id"], report["linted_count"], len(violations)))
          print("::" + json.dumps({"outputs": report}, ensure_ascii=True) + "::")

  # --- 2. gate, escalate, or clear ---
  - id: violation_gate
    type: io.kestra.plugin.core.flow.If
    description: Branch on the violations array so a broken promotion opens a ticket, leaves evidence and reaches the channel, while a clean catalog is recorded as passing.
    condition: "{{ (outputs.lint_promotions.vars.violations | length) > 0 }}"
    then:
      - id: write_lint_report
        type: io.kestra.plugin.core.flow.Loop
        description: Append one line per violation to lint-report.txt so the execution carries a readable artifact alongside the JSON verdict.
        values: "{{ outputs.lint_promotions.vars.violations }}"
        concurrencyLimit: 1
        tasks:
          - id: append_lint_line
            type: io.kestra.plugin.scripts.shell.Commands
            description: Print the promotion id, the rule name and the detail for the violation currently in scope into lint-report.txt.
            commands:
              - |
                printf '%s\n' "{{ item.value.promo_id }} | {{ item.value.rule }} | {{ item.value.detail }}" >> lint-report.txt

      - id: file_promo_lint_issue
        type: io.kestra.plugin.github.issues.Create
        description: Open a labeled issue listing every violation so fixing the promotion becomes assignable work in the backlog the merchandising team already watches.
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: acme/storefront-promos
        title: "Promotion lint violations in acme/storefront-promos ({{ (outputs.lint_promotions.vars.violations | length) }} found)"
        labels:
          - promotion-lint
          - blocked-launch
        body: |
          ## Promotion configuration lint

          {{ (outputs.lint_promotions.vars.violations | length) }} rule violation(s) across {{ outputs.lint_promotions.vars.linted_count }} linted promotion(s) block publication. Review scope, promo {{ outputs.lint_promotions.vars.promo_id }}.

          {% for v in outputs.lint_promotions.vars.violations %}- `{{ v.promo_id }}` {{ v.rule }} - {{ v.detail }}
          {% endfor %}
          The same lines are appended to lint-report.txt for this execution.

          Correct the configuration and save the promotion again to clear this issue. Filed by flow `{{ flow.id }}`, execution `{{ execution.id }}`.

      - id: alert_promo_violations
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post the verdict, the violation count and the promo under review so merchandising hears about the block before the promotion is scheduled to go live.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Promotion lint blocked publication - verdict {{ outputs.lint_promotions.vars.verdict }}, {{ (outputs.lint_promotions.vars.violations | length) }} violation(s) across {{ outputs.lint_promotions.vars.linted_count }} promotion(s), review scope promo {{ outputs.lint_promotions.vars.promo_id }}. A GitHub issue is open and lint-report.txt holds one line per violation. Execution {{ execution.id }}."
          }
    else:
      - id: record_clean_catalog
        type: io.kestra.plugin.core.log.Log
        description: Record the passing verdict with the number of promotions inspected, so a clean catalog still leaves evidence that the lint actually ran.
        message: "Promotion lint clean - {{ outputs.lint_promotions.vars.linted_count }} promotion(s) inspected, review scope promo {{ outputs.lint_promotions.vars.promo_id }}, no rule violations, verdict {{ outputs.lint_promotions.vars.verdict }}."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    description: clean when every linted promotion passed all rules, violations as soon as one rule fired.
    value: "{{ outputs.lint_promotions.vars.verdict }}"
  - id: violations
    type: ARRAY
    description: One entry per rule break holding its promo_id, the rule name and a human readable detail.
    value: "{{ outputs.lint_promotions.vars.violations | toJson }}"
  - id: promo_id
    type: STRING
    description: Promotion submitted by the webhook, or all-promos when the schedule linted the whole file.
    value: "{{ outputs.lint_promotions.vars.promo_id }}"
  - id: linted_count
    type: INT
    description: Number of promotions the lint inspected during this execution.
    value: "{{ outputs.lint_promotions.vars.linted_count }}"

extend:
  title: Lint Promotion Configurations Before They Go Live
  metaTitle: Promotion Configuration Lint Before Launch
  shortDescription: Lint promotion configs for stacking, margin, window and cap violations on save, escalate each failure to GitHub and Slack, and publish the verdict.
  metaDescription: Lint promotion configs on save for stacking, margin, window and discount-cap violations, escalate every failure to GitHub and Slack, and publish the verdict.
  description: |
    A promotion that stacks when it must not, discounts past the margin floor, or ships with an inverted window is a revenue incident that nobody catches until the orders arrive. This blueprint lints the configuration instead of trusting the form that produced it.

    ## How it works

    1. `on_promo_save` (`io.kestra.plugin.core.trigger.Webhook`, keyed with the `PROMO_WEBHOOK_KEY` secret) starts a run whenever the promotion service creates or updates a promotion, posting `promo_id` and `config`. `nightly_catalog_sweep` (`io.kestra.plugin.core.trigger.Schedule`, `0 6 * * *`) ships with `disabled: true` and lints the whole promo file each morning once you switch it on.
    2. `promo_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared filesystem, so the staged `promos.json`, the lint verdict and `lint-report.txt` all live in the same directory.
    3. `stage_promo_file` (`io.kestra.plugin.scripts.shell.Commands` on the `io.kestra.plugin.scripts.runner.docker.Docker` runner, image `alpine:3.20`) writes `promos.json` from a heredoc holding four promotions - a healthy 15 percent markdown, a 40 percent promotion that stacks over a 35 percent margin, a window whose dates are inverted and already closed, and an 80 percent discount against a 50 percent cap - so the gate is reproducible without promotion service credentials.
    4. `lint_promotions` (`io.kestra.plugin.scripts.python.Script`) reads `promos.json`, absorbs the submitted webhook config when there is one, and applies five rules per promotion: `stacking_allowed` is required when `stacks_with` is non-empty, `discount_pct` may not exceed `max_discount_pct` (50 by default), `start` must precede `end`, `margin_pct - discount_pct` must stay at or above `min_margin_pct`, and `end` must still be in the future. Each break becomes an entry of `{promo_id, rule, detail}`, and the verdict, the violations, the review scope and the linted count print as a single `::{"outputs": ...}::` line.
    5. `violation_gate` (`io.kestra.plugin.core.flow.If`) branches on the length of the violations array.
    6. When violations exist, `write_lint_report` (`io.kestra.plugin.core.flow.Loop`) appends one line per violation to `lint-report.txt`, `file_promo_lint_issue` (`io.kestra.plugin.github.issues.Create`) files the full list with `promotion-lint` and `blocked-launch` labels, and `alert_promo_violations` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts the verdict and the count to the channel.
    7. When every promotion is clean, `record_clean_catalog` (`io.kestra.plugin.core.log.Log`) records the passing verdict, leaving proof the lint ran rather than silently skipped.
    8. The flow level `errors` handler (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) reports any failure with the execution id, because a lint that dies is indistinguishable from a clean catalog.

    ## What you get

    - A hard gate on the four promotion mistakes that cost money - stacking, margin erosion, broken windows and oversized discounts - checked on every save instead of during a manual review.
    - One labeled GitHub issue listing every violation with its promotion, rule and detail, plus `lint-report.txt` with one line per violation, so the fix is assignable work rather than a screenshot in a thread.
    - A Slack message carrying the verdict, the count and the review scope, so merchandising hears about the block before the promotion goes live.
    - Four typed outputs (`verdict`, `violations`, `promo_id`, `linted_count`) that a publish pipeline or dashboard can branch on directly.

    ## Who it's for

    - Merchandising and growth teams that ship promotions continuously and need a review step that does not depend on someone reading the fine print.
    - Commerce platform engineers and finance pricing owners who want the validation rules versioned next to the orchestration, with proof that no live discount can push a product below the margin floor.

    ## Why orchestrate this with Kestra

    Promotion validation usually lives as a few assertions inside the admin UI, so bulk imports, seed scripts and API callers bypass it and the first warning arrives as a refund request. Kestra puts the trigger, the fixture, the rules, the gate and both escalation channels into one versioned file: the webhook makes the check run on every save, the branch separates escalation from the all clear, the loop turns violations into an evidence file, and the outputs let a publish pipeline refuse the release on its own. A helper function gives you a boolean and no memory.

    ## Prerequisites

    - A Kestra instance with the GitHub and Slack plugins available, a worker with Docker access for the fixture stage, and Python 3 on that worker for the `io.kestra.plugin.core.runner.Process` lint task.
    - The promotion service configured to POST `promo_id` and `config` to the webhook URL on create and update, plus a repository that allows issues for the violation ticket.

    ### Secrets

    - `PROMO_WEBHOOK_KEY`: key segment guarding the webhook URL, anyone holding it can submit promotions for linting.
    - `GITHUB_TOKEN`: token used to open the violation issue, with Issues write access on the target repository.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for violation alerts and failure alerts.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace and set `min_margin_pct` to the floor your pricing policy enforces.
    2. Point `file_promo_lint_issue` at the repository that owns the promotion catalog by changing its `repository` value.
    3. Trigger the flow manually once and read the outputs - expect `verdict: violations` from the staged fixture's stacking, window and cap breaches, a GitHub issue, a Slack message, and `lint-report.txt` holding one line per violation.
    4. Post `{"promo_id": "SPRING15", "config": {...}}` to the webhook URL at `/api/v1/{tenant}/executions/webhook/{namespace}/promo-config-lint/{PROMO_WEBHOOK_KEY}` to lint a single save, then enable `nightly_catalog_sweep` for the whole-file sweep.

    ## How to extend

    - Lint a live catalog by replacing the fixture stage with a `io.kestra.plugin.core.http.Request` that pulls the promo file from the promotion API, and swap the single `min_margin_pct` input for a per category margin map read from the KV store, keeping every rule unchanged.
    - Make the gate a hard stop with `io.kestra.plugin.core.execution.Fail` under `violation_gate`, so no publish job can continue while violations exist.
    - Open one issue per promotion instead of one overall issue by moving `file_promo_lint_issue` inside `write_lint_report`.
    - Track repeat offenders by appending the rule names to a shared report with `io.kestra.plugin.aws.s3.Upload` at the end of the run.

    ## Links

    - [Kestra webhook trigger](https://kestra.io/docs/workflow-triggers)
    - [Kestra working directory and task runners](https://kestra.io/docs/concepts/task-runner)
    - [Kestra GitHub plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
  subTags:
    - promotions
    - pricing
    - linting
    - e-commerce
  ee: false
  demo: false
