id: purge
namespace: system

tasks:
  - id: purge_executions
    type: io.kestra.plugin.core.execution.PurgeExecutions
    endDate: "{{ now() | dateAdd(-1, 'MONTHS') }}"
    purgeLog: false
    states:
      - SUCCESS

  - id: purge_logs
    type: io.kestra.plugin.core.log.PurgeLogs
    endDate: "{{ now() | dateAdd(-1, 'MONTHS') }}"

  # DEBUG logs often include error stacktraces; this shorter window keeps
  # storage lean while still retaining recent failures for debugging.
  - id: purge_debug_logs
    type: io.kestra.plugin.core.log.PurgeLogs
    endDate: "{{ now() | dateAdd(-1, 'WEEKS') }}"
    logLevels:
      - DEBUG

  - id: purge_trace_logs
    type: io.kestra.plugin.core.log.PurgeLogs
    endDate: "{{ now() | dateAdd(-1, 'DAYS') }}"
    logLevels:
      - TRACE

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: 0 9 * * *

extend:
  shortDescription: "Automatically purge Kestra execution data and logs on a daily schedule, with shorter retention windows for verbose log levels."
  title: Purge execution data including logs, metrics and outputs on a schedule
  metaTitle: Purge Kestra Execution Data, Logs and Outputs
  metaDescription: "Schedule a Kestra flow to purge executions and logs with level-aware retention: all logs after one month, DEBUG after one week, TRACE after one day."
  description: |
    Kestra instances accumulate execution data over time: execution records, logs, metrics, and task outputs that pile up in storage and the backend database. Left unchecked, this growth slows down the UI, inflates storage costs, and clutters your execution history. This flow is a scheduled housekeeping routine that purges execution data and logs on a multi-step schedule, applying shorter retention windows to the most verbose log levels.

    ## How it works

    The flow runs four dedicated maintenance tasks in sequence:

    1. `purge_executions` (`io.kestra.plugin.core.execution.PurgeExecutions`) deletes execution data whose `endDate` is older than one month, computed dynamically with `{{ now() | dateAdd(-1, 'MONTHS') }}`. The `states` property is set to `SUCCESS`, so only successful executions are purged and the audit trail of failed runs is preserved. `purgeLog` is set to `false` so that log deletion is handled separately.
    2. `purge_logs` (`io.kestra.plugin.core.log.PurgeLogs`) deletes all logs older than one month. Logs are usually the largest chunk of data, so isolating them in their own task lets you run or rerun this step independently.
    3. `purge_debug_logs` deletes DEBUG-level logs older than one week. Note that error stacktraces are often logged at DEBUG level — this shorter window keeps storage lean while still retaining recent failures for post-incident debugging. Adjust the window if you need those stacktraces longer.
    4. `purge_trace_logs` deletes TRACE-level logs older than one day. TRACE logs are the most verbose and rarely needed beyond the current day.

    A `Schedule` trigger (`io.kestra.plugin.core.trigger.Schedule`) is configured to fire daily at `0 9 * * *`. It ships `disabled: true` so the flow does not run before you have reviewed it.

    ## What you get

    - Automatic, recurring cleanup of stale execution data
    - Level-aware log retention that keeps INFO and above longer than DEBUG and TRACE
    - Lower storage consumption and database bloat
    - A faster, less cluttered Executions UI
    - Preserved audit trail of failed executions
    - Independent log purging you can rerun on its own

    ## Who it's for

    - Platform and DevOps engineers operating Kestra in production
    - Administrators managing retention and storage costs
    - Teams running high-volume workflows that generate large log volumes

    ## Why orchestrate this with Kestra

    Storage hygiene is itself a workflow, and Kestra treats it as one. The declarative YAML makes retention policy explicit and version controlled. The `Schedule` trigger runs cleanup unattended on a cron cadence, while built-in retries and execution history give you observability and lineage over the maintenance job itself, something a manual database `DELETE` or an external cron script cannot offer. Splitting executions and logs into separate tasks means a failure in one step does not block the other, and you can rerun a single task from the UI.

    ## Prerequisites

    - A running Kestra instance with execution history to purge
    - Permissions to delete execution data on that instance

    ### Secrets

    This flow uses core maintenance tasks only and references no secrets.

    ## Quick start

    1. Add the flow to your Kestra instance.
    2. Review the `endDate` cutoffs and the `states` filter, then adjust to your retention policy.
    3. Set the trigger `disabled` property to `false` (or remove that line) to activate the daily schedule.
    4. Optionally run the flow manually once to validate the result before enabling the schedule.

    ## How to extend

    - Leave the `states` field empty to purge executions regardless of status.
    - Change any `dateAdd` window to match your retention requirements.
    - Adjust the cron expression to run more or less frequently.
    - Add a notification task to report how much data was purged on each run.

    Note: this flow will not purge flow definitions or namespace files. Only execution-related data is removed, so your code stays safe.

    ## Links

    - [PurgeExecutions task](https://kestra.io/plugins/core/tasks/execution/io.kestra.plugin.core.execution.PurgeExecutions)
    - [PurgeLogs task](https://kestra.io/plugins/core/tasks/log/io.kestra.plugin.core.log.PurgeLogs)
    - [Schedule trigger](https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.Schedule)
  tags:
    - Core
    - System
  subTags:
    - Day 2 Operations
    - Scheduling
  ee: false
  demo: true
