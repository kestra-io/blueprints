id: gcs-object-encryption-compliance-gate
namespace: company.team
description: |
  List a GCS bucket, flag objects that carry no customer-managed encryption
  key (kmsKeyName), alert Slack on breach, and conditionally quarantine the
  offending objects by moving them under a review prefix. auto_remediate
  and dry_run are two independent gates; nothing is ever deleted, only
  moved, and no object's content or encryption key is ever changed.

triggers:
  - id: periodic_encryption_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every 6 hours. Shipped disabled; enable it once bucket/audit_prefix point at a real bucket and a manual run has been verified. Always fires in safe mode (auto_remediate false, dry_run true) regardless of this flow's own defaults.
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      auto_remediate: "false"
      dry_run: "true"

inputs:
  - id: bucket
    type: STRING
    displayName: "GCS Bucket"
    defaults: "data-lake"
    description: Bucket audited for missing customer-managed encryption keys (CMEK).

  - id: audit_prefix
    type: STRING
    displayName: "Audit Prefix"
    defaults: ""
    description: Restrict the audit to object paths under this prefix. Leave empty to audit the whole bucket.

  - id: max_unencrypted_count
    type: INT
    displayName: "Max Allowed Non-CMEK Objects"
    defaults: 0
    description: Breach when the count of objects with no kmsKeyName exceeds this number. Default 0 means any object using only Google-managed (not customer-managed) encryption at all is a breach.

  - id: quarantine_prefix
    type: STRING
    displayName: "Quarantine Prefix"
    defaults: "unencrypted-review/"
    description: Destination prefix non-compliant objects are moved under when remediation runs. Objects are moved, never deleted outright, and their encryption key is never changed by this flow.

  - id: auto_remediate
    type: SELECT
    displayName: "Auto Remediate"
    defaults: "false"
    values:
      - "false"
      - "true"
    description: If "true" and non-CMEK objects are found, move them into quarantine_prefix for manual re-encryption review (still gated by dry_run below). If "false", the breach is only reported.

  - id: dry_run
    type: SELECT
    displayName: "Dry Run"
    defaults: "true"
    values:
      - "true"
      - "false"
    description: If "true", remediation is only logged, no object is moved. Must be explicitly "false", together with auto_remediate "true", for objects to actually be quarantined.

tasks:
  - id: list_bucket_objects
    type: io.kestra.plugin.gcp.gcs.List
    description: Lists every blob under audit_prefix. Each returned blob carries kmsKeyName, eventBasedHold, temporaryHold, and retentionExpirationTime among other fields - verified from the plugin's own output schema. maxFiles is raised from its documented default of 25 so a real bucket is not silently under-audited.
    from: "gs://{{ inputs.bucket }}/{{ inputs.audit_prefix }}"
    projectId: "{{ secret('GCP_PROJECT_ID') }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    listingType: RECURSIVE
    filter: FILES
    maxFiles: 1000

  - id: evaluate_encryption_policy
    type: io.kestra.plugin.scripts.python.Script
    description: Reads the listing from list_bucket_objects and classifies each blob as missing a customer-managed encryption key or compliant. There is no structured policy-evaluation task in this plugin, so the comparison runs here against the kmsKeyName field the List task actually returns.
    inputFiles:
      blobs.json: "{{ outputs.list_bucket_objects | json }}"
    script: |
      import json
      from kestra import Kestra

      with open("blobs.json") as f:
          listed = json.load(f)

      non_cmek_objects = []
      for blob in listed.get("blobs", []):
          if not blob.get("kmsKeyName"):
              non_cmek_objects.append({
                  "uri": blob.get("uri"),
                  "name": blob.get("name"),
              })

      Kestra.outputs({
          "non_cmek_count": len(non_cmek_objects),
          "non_cmek_objects": non_cmek_objects,
      })

  - id: evaluate_encryption_gate
    type: io.kestra.plugin.core.flow.If
    description: Breach when the non-CMEK object count exceeds max_unencrypted_count.
    condition: "{{ outputs.evaluate_encryption_policy.vars.non_cmek_count > inputs.max_unencrypted_count }}"
    then:
      - id: route_remediation
        type: io.kestra.plugin.core.flow.Switch
        description: auto_remediate only decides whether remediation is considered at all; dry_run, checked separately below, decides whether objects are actually moved.
        value: "{{ inputs.auto_remediate }}"
        cases:
          "true":
            - id: check_dry_run
              type: io.kestra.plugin.core.flow.If
              condition: "{{ inputs.dry_run == \"false\" }}"
              then:
                - id: quarantine_unencrypted_objects
                  type: io.kestra.plugin.core.flow.Loop
                  description: Move each non-compliant object into quarantine_prefix one at a time, so one failed copy never blocks the rest of the batch.
                  values: "{{ outputs.evaluate_encryption_policy.vars.non_cmek_objects }}"
                  concurrencyLimit: 4
                  tasks:
                    - id: quarantine_object
                      type: io.kestra.plugin.gcp.gcs.Copy
                      description: delete true removes the source object once the copy succeeds, turning this into a move into quarantine_prefix. The object's content and encryption key are otherwise unchanged; this task has no property to set a destination KMS key, verified from the plugin's own schema.
                      from: "{{ item.value | jq('.uri') | first }}"
                      to: "gs://{{ inputs.bucket }}/{{ inputs.quarantine_prefix }}{{ item.value | jq('.name') | first }}"
                      delete: true
                      projectId: "{{ secret('GCP_PROJECT_ID') }}"
                      serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
                - id: log_remediation_applied
                  type: io.kestra.plugin.core.log.Log
                  message: "Quarantined {{ outputs.evaluate_encryption_policy.vars.non_cmek_count }} non-CMEK object(s) from {{ inputs.bucket }} under {{ inputs.quarantine_prefix }}."
              else:
                - id: log_dry_run_remediation
                  type: io.kestra.plugin.core.log.Log
                  message: "DRY RUN: would quarantine {{ outputs.evaluate_encryption_policy.vars.non_cmek_count }} non-CMEK object(s) from {{ inputs.bucket }} under {{ inputs.quarantine_prefix }} (dry_run is true). No change made."
          "false":
            - id: log_remediation_disabled
              type: io.kestra.plugin.core.log.Log
              message: "auto_remediate is false: {{ outputs.evaluate_encryption_policy.vars.non_cmek_count }} object(s) in {{ inputs.bucket }} have no customer-managed encryption key, but no quarantine was attempted."
      - id: alert_encryption_risk
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Always alert on any breach, independent of whether it was remediated.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "GCS encryption compliance gate: {{ outputs.evaluate_encryption_policy.vars.non_cmek_count }} object(s) in bucket {{ inputs.bucket }} have no customer-managed encryption key (threshold {{ inputs.max_unencrypted_count }}). auto_remediate: {{ inputs.auto_remediate }}. dry_run: {{ inputs.dry_run }}. Remediated: {{ inputs.auto_remediate == \"true\" and inputs.dry_run == \"false\" }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_encryption_healthy
        type: io.kestra.plugin.core.log.Log
        message: "{{ inputs.bucket }} is compliant: non-CMEK object count is at or below the {{ inputs.max_unencrypted_count }} threshold."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status line for every run, independent of which branch fired, so the execution history always shows the headline numbers.
    message: "Encryption audit complete for {{ inputs.bucket }}. non_cmek_count={{ outputs.evaluate_encryption_policy.vars.non_cmek_count }}. threshold={{ inputs.max_unencrypted_count }}. auto_remediate={{ inputs.auto_remediate }}. dry_run={{ inputs.dry_run }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the flow itself fails outside the handled branches, for example invalid GCP credentials or an unreachable bucket.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "GCS encryption compliance gate FAILED in execution {{ execution.id }} for bucket {{ inputs.bucket }}. The encryption audit did not complete; investigate before trusting the last known compliance status."
      }

extend:
  title: "GCS Object Encryption Compliance Gate"
  shortDescription: List a GCS bucket, flag objects with no customer-managed encryption key, alert Slack on breach, and optionally quarantine the offending objects for review.
  metaTitle: GCS Object Encryption Compliance Gate with Kestra
  metaDescription: "Audit a GCS bucket for objects missing a customer-managed encryption key, alert on breach, and optionally quarantine them."
  description: |
    Google Cloud Storage encrypts every object by default, but a Google-managed key is
    not the same as a customer-managed key (CMEK) that a compliance program, a regulator,
    or a customer contract actually requires - and nothing in GCS itself alerts you when an
    object lands without one. This blueprint lists a bucket, flags any object whose
    `kmsKeyName` is empty, alerts Slack on breach, and can quarantine the offending objects
    by moving them under a review prefix - never deleting anything, and never attempting to
    change an object's encryption key in place.

    ## How it works

    1. `periodic_encryption_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 6 hours, always forcing `auto_remediate: "false"` and `dry_run: "true"` through its own `inputs:` override regardless of this flow's defaults. Shipped disabled so you can validate a manual run first.
    2. `list_bucket_objects` (`io.kestra.plugin.gcp.gcs.List`) lists every blob under `audit_prefix` with `listingType: RECURSIVE`, `filter: FILES`, and `maxFiles: 1000` (raised from the task's documented default of 25), returning each blob's `kmsKeyName`, `uri`, `name`, and other metadata.
    3. `evaluate_encryption_policy` (`io.kestra.plugin.scripts.python.Script`) reads that listing and collects every blob whose `kmsKeyName` is empty into `non_cmek_objects`, emitting `non_cmek_count` and `non_cmek_objects` through `Kestra.outputs`.
    4. `evaluate_encryption_gate` (`io.kestra.plugin.core.flow.If`) flags a breach whenever `non_cmek_count > max_unencrypted_count`.
       - `then` (breach): `route_remediation` (`io.kestra.plugin.core.flow.Switch` on `auto_remediate`) either considers remediation (`"true"`, gated again by `dry_run` through `check_dry_run`) or only logs that remediation is disabled (`"false"`). When both gates allow it, `quarantine_unencrypted_objects` (`io.kestra.plugin.core.flow.Loop`) moves each flagged object into `quarantine_prefix` with `io.kestra.plugin.gcp.gcs.Copy` (`delete: true`, so the source is removed once the copy succeeds). `alert_encryption_risk` always fires to Slack regardless of which path ran.
       - `else` (compliant): `log_encryption_healthy` records a clean check.
    5. `log_audit_complete` always runs last, printing the headline numbers regardless of which branch fired.
    6. The `errors` block alerts Slack separately if the flow itself fails - invalid credentials or an unreachable bucket must not read as "no breach".

    ## What you get

    - A concrete, named list of objects missing a customer-managed encryption key, computed from GCS's own blob metadata, not a guess from bucket-level settings.
    - Remediation that only ever moves an object under `quarantine_prefix` for manual re-encryption review; nothing is deleted, and no object's encryption key or content is ever modified by this flow.
    - Two independent gates (`auto_remediate`, `dry_run`) between "breach detected" and "object actually quarantined".
    - A final status log every run, breach or not, so the execution history doubles as an encryption-compliance trend for the bucket.

    ## Who it's for

    - Platform and security teams running GCS under a compliance program (PCI, HIPAA, SOC 2) that mandates customer-managed keys for at-rest encryption.
    - Data engineers who need to catch an object landed by a misconfigured pipeline before it is flagged in an external audit.
    - Anyone evaluating the GCS plugin who wants a worked example of `List`'s full blob metadata (`kmsKeyName`, `eventBasedHold`, `temporaryHold`, `retentionExpirationTime`) beyond basic file transfer.

    ## Why orchestrate this with Kestra

    GCS itself has no policy engine that compares an object's encryption key against a requirement and decides what to do about it - bucket-level default encryption only governs new writes, it does not retroactively flag or fix what already landed. Kestra fills that gap: `List` supplies the real metadata, the script step applies the actual policy, `If`/`Switch` make the decision a first-class, auditable branch, `Loop` isolates each quarantine move so one failure never blocks the rest, and the whole policy lives in version-controlled YAML instead of a bucket setting nobody audits.

    ## Prerequisites

    - A GCS bucket reachable with the configured `GCP_PROJECT_ID` / `GCP_SERVICE_ACCOUNT` credentials, with read access to list objects and write/delete access if remediation is enabled.
    - A Slack incoming webhook for notifications.

    Local testing (UNVERIFIED end to end - see Pitfalls):
    `docker run -d --name gcs-encryption-gate -p 4443:4443 fsouza/fake-gcs-server -scheme http`
    `docker network connect YOUR_KESTRA_NETWORK gcs-encryption-gate` (only needed if the Kestra Worker runs in a separate Docker network than this container).
    `fsouza/fake-gcs-server` is a community GCS emulator; the official Google Cloud Storage client redirects to it via the `STORAGE_EMULATOR_HOST` environment variable, which must be set on the Kestra Worker process itself (for example `STORAGE_EMULATOR_HOST=http://gcs-encryption-gate:4443` in the Worker's environment) - there is no such property on the `List`/`Copy` tasks themselves. This has not been run against a live Kestra Worker in this environment; confirm it before relying on it.

    ### Secrets

    - `GCP_PROJECT_ID`: GCP project ID, matching this plugin's own documented pattern (see `gcs-download-transform-load.yaml`). Against the emulator above, any non-empty placeholder value is sufficient since the emulator does not validate it.
    - `GCP_SERVICE_ACCOUNT`: GCP service account JSON key. Against the emulator above, this may not be required at all depending on the client library version; a real bucket always requires a real key with list/write/delete permissions.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_encryption_risk` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_SLACK_WEBHOOK_URL=$(echo -n 'https://hooks.slack.com/...' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `bucket` (STRING, default `data-lake`): bucket audited.
    - `audit_prefix` (STRING, default empty): restricts the audit to this prefix; empty audits the whole bucket.
    - `max_unencrypted_count` (INT, default `0`): breach threshold; `0` means any non-CMEK object at all breaches.
    - `quarantine_prefix` (STRING, default `unencrypted-review/`): destination prefix for quarantined objects.
    - `auto_remediate` (SELECT: `"false"`, `"true"`; default `"false"`): must be `"true"` for quarantine to even be considered.
    - `dry_run` (SELECT: `"true"`, `"false"`; default `"true"`): must be explicitly `"false"`, together with `auto_remediate: "true"`, for objects to actually be moved.

    ### Outputs

    - `outputs.list_bucket_objects.blobs`: the raw blob listing (`kmsKeyName`, `uri`, `name`, `size`, `eventBasedHold`, `temporaryHold`, `retentionExpirationTime`, and more) for every run.
    - `outputs.evaluate_encryption_policy.vars.non_cmek_count` / `.non_cmek_objects`: the computed policy result for every run.

    ## Quick start

    1. Point `bucket` and `audit_prefix` at a real bucket with a mix of CMEK-encrypted and default-encrypted objects (or start from the emulator setup above once verified in your own environment).
    2. Add the `GCP_PROJECT_ID`, `GCP_SERVICE_ACCOUNT`, and `SLACK_WEBHOOK_URL` secrets.
    3. Run the flow manually with the defaults (`auto_remediate: "false"`) and confirm `alert_encryption_risk` fires naming the expected non-CMEK count, and that `log_remediation_disabled` logs without moving anything.
    4. Run once with `auto_remediate: "true"` and `dry_run: "true"` and confirm `log_dry_run_remediation` describes the quarantine without running it.
    5. Run once with `auto_remediate: "true"` and `dry_run: "false"` and confirm the flagged objects now live under `quarantine_prefix` and are gone from their original paths.
    6. Enable `periodic_encryption_check` once you trust the check; it always runs in the safe `auto_remediate: "false"` / `dry_run: "true"` mode regardless of what you leave the flow's own defaults set to.

    ## How to extend

    - Extend `evaluate_encryption_policy` to also flag objects with `eventBasedHold`/`temporaryHold` both false (also returned by `List`), if your compliance program requires legal holds on certain prefixes.
    - Loop over several `bucket`/`audit_prefix` pairs with `io.kestra.plugin.core.flow.Loop` (`ForEach` is deprecated) to audit multiple buckets in one run.
    - Add a `Pause` approval task between `evaluate_encryption_gate` and the quarantine branch for a human-reviewed gate instead of (or alongside) the static `auto_remediate` input.
    - Re-encrypt flagged objects with a CMEK key outside this flow (for example `gsutil rewrite -k`), since neither `List` nor `Copy` in this plugin expose a destination KMS key property; this blueprint deliberately only quarantines for review rather than attempting an unsupported in-place re-encryption.

    ## Pitfalls

    - **There is no destination KMS key property on `Copy`.** Verified from the plugin's own schema: `from`, `to`, `delete`, `projectId`, `serviceAccount`, `impersonatedServiceAccount`, `scopes`, `assets` are the only properties. This is why remediation quarantines non-compliant objects for manual re-encryption instead of attempting to re-encrypt them in place.
    - **`List`'s `maxFiles` defaults to 25.** Verified from the plugin's own documentation. This blueprint sets `maxFiles: 1000`; a bucket with more objects than that under `audit_prefix` will still be under-audited, and `evaluate_encryption_policy` has no way to know the listing was truncated.
    - **The local emulator path is UNVERIFIED end to end.** `STORAGE_EMULATOR_HOST` is a convention honored by Google's own Cloud Storage client libraries, not a documented property of this Kestra plugin's tasks; whether it is respected depends on the client library version this plugin bundles, and this has not been confirmed against a running Kestra Worker in this environment.
    - **`auto_remediate` and `dry_run` are independent gates, not a single boolean.** Both must be `"true"`/`"false"` respectively for the quarantine `Loop` to run; setting only one leaves the other still blocking.
    - **`Switch` case keys `"true"`/`"false"` are quoted strings.** `auto_remediate` renders as the literal string `"true"` or `"false"`; unquoted `true:`/`false:` YAML map keys would parse as booleans instead and would not match.

    ## Links

    - [plugin-gcp GCS documentation](https://kestra.io/plugins/plugin-gcp/gcs)
    - [GCS List task reference](https://kestra.io/plugins/plugin-gcp/gcs/io.kestra.plugin.gcp.gcs.list)
    - [GCS Copy task reference](https://kestra.io/plugins/plugin-gcp/gcs/io.kestra.plugin.gcp.gcs.copy)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Policy & Compliance
  ee: false
  demo: false
