id: whatsapp-template-health-sentinel
namespace: company.team
description: |
  Every few hours, read the message templates of a WhatsApp Business
  Account from the Meta Graph API (read-only: no template is edited or
  sent) and classify them as HEALTHY, WARNING, CRITICAL or UNREACHABLE.
  Log quiet runs and alert Slack when Meta pauses, disables or rejects a
  template or its quality rating drops, before order updates and OTPs
  silently stop going out.

inputs:
  - id: template_limit
    type: INT
    defaults: 100
    displayName: "Template Fetch Limit"
    description: "Maximum number of templates to read in one call."

variables:
  graph_api_version: v23.0

triggers:
  - id: template_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check template health every 4 hours. Shipped disabled; enable it once the WhatsApp secrets are set and a manual run has been verified.
    cron: "20 */4 * * *"
    disabled: true

tasks:
  - id: list_templates
    type: io.kestra.plugin.core.http.Request
    description: Read the account's message templates with their review status, category and quality score. This is a GET; no template is edited, deleted or sent.
    uri: "https://graph.facebook.com/{{ vars.graph_api_version }}/{{ secret('WHATSAPP_BUSINESS_ACCOUNT_ID') }}/message_templates?fields=name,status,category,language,quality_score&limit={{ inputs.template_limit }}"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('WHATSAPP_ACCESS_TOKEN') }}"
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: summarize_templates
    type: io.kestra.plugin.core.debug.Return
    description: Read each template's status and quality score (accepting both the object and the plain string form of quality_score), list the paused or disabled ones, the rejected ones and the ones rated RED or YELLOW, and classify in one jq query. A missing or non-200 response becomes UNREACHABLE.
    format: >-
      {{ (outputs.list_templates.code is not defined or outputs.list_templates.code != 200)
      ? '{"status":"UNREACHABLE","templates":0,"approved":0,"stopped":[],"rejected":[],"red":[],"yellow":[]}'
      : (fromJson(outputs.list_templates.body) | jq('
      [.data[] | {name: (.name + " (" + (.language // "?") + ")"), status: .status,
      q: (.quality_score | if type == "object" then (.score // "UNKNOWN") elif type == "string" then . else "UNKNOWN" end)}] as $t
      | [$t[] | select(.status == "PAUSED" or .status == "DISABLED") | .name] as $stopped
      | [$t[] | select(.status == "REJECTED") | .name] as $rejected
      | [$t[] | select(.status == "APPROVED" and .q == "RED") | .name] as $red
      | [$t[] | select(.status == "APPROVED" and .q == "YELLOW") | .name] as $yellow
      | {templates: ($t | length), approved: ([$t[] | select(.status == "APPROVED")] | length),
      stopped: $stopped, rejected: $rejected, red: $red, yellow: $yellow,
      status: (if ($stopped | length) > 0 or ($red | length) > 0 then "CRITICAL"
      elif ($rejected | length) > 0 or ($yellow | length) > 0 then "WARNING"
      else "HEALTHY" end)}
      ') | first | toJson) }}

  - id: route_by_template_health
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when every approved template is healthy, a Slack message when a template was rejected or dropped to YELLOW, or a Slack page when a template is paused, disabled or RED, or the account could not be read.
    value: "{{ fromJson(outputs.summarize_templates.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "WhatsApp templates healthy: {{ fromJson(outputs.summarize_templates.value).approved }} of {{ fromJson(outputs.summarize_templates.value).templates }} template(s) approved, none paused, disabled, rejected or low quality."
      "WARNING":
        - id: alert_warning_templates
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post a Slack message when a template was rejected or an approved template's quality dropped to YELLOW.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "WhatsApp template health WARNING. Rejected: {{ (fromJson(outputs.summarize_templates.value).rejected | length) > 0 ? (fromJson(outputs.summarize_templates.value).rejected | join(', ')) : 'none' }}. Quality YELLOW: {{ (fromJson(outputs.summarize_templates.value).yellow | length) > 0 ? (fromJson(outputs.summarize_templates.value).yellow | join(', ')) : 'none' }}. Fix the content before Meta pauses them. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_templates
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when a template is paused or disabled (messages using it are no longer delivered) or an approved template's quality is RED.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "WhatsApp template health CRITICAL. Paused or disabled: {{ (fromJson(outputs.summarize_templates.value).stopped | length) > 0 ? (fromJson(outputs.summarize_templates.value).stopped | join(', ')) : 'none' }}. Quality RED: {{ (fromJson(outputs.summarize_templates.value).red | length) > 0 ? (fromJson(outputs.summarize_templates.value).red | join(', ')) : 'none' }}. Messages using paused or disabled templates are not being delivered. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the Graph API could not be read, usually an expired access token or a missing whatsapp_business_management permission.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "WhatsApp template sentinel UNREACHABLE: the Graph API did not return a usable response (HTTP {{ outputs.list_templates.code ?? 'no response' }}). Check the access token and its whatsapp_business_management permission. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "WhatsApp template sentinel completed with an unexpected classification: {{ outputs.summarize_templates.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, so template health history stays queryable even if Slack delivery fails.
    message: "WhatsApp template sentinel audit: http={{ outputs.list_templates.code ?? 'n/a' }} summary={{ outputs.summarize_templates.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails, so a broken check is never mistaken for healthy templates.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "WhatsApp template sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Template health is now unknown; check the task logs and WhatsApp Manager."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ fromJson(outputs.summarize_templates.value).status }}"

extend:
  title: "WhatsApp Template Health Sentinel"
  shortDescription: Read WhatsApp Business message templates on a schedule and alert Slack when Meta pauses, disables, rejects or downgrades one.
  metaTitle: WhatsApp Template Health Sentinel for Kestra
  metaDescription: "Read WhatsApp Business templates every 4 hours, change nothing, and alert Slack when Meta pauses, disables, rejects or rates one RED."
  description: |
    Order confirmations, delivery updates and OTPs on the WhatsApp Business Platform all go out through message templates that Meta reviews and rates. When users block or report a template, Meta lowers its quality rating and can pause or disable it, and from then on messages that use it are simply not delivered. The business usually finds out when customers ask where their OTP is. This blueprint turns a scheduled, read-only call to the Meta Graph API into a template health gate: `io.kestra.plugin.core.http.Request` reads every template with its status and quality score, one jq query lists the stopped, rejected and low-quality ones, and the result routes to a quiet log or a Slack alert.

    ## How it works

    1. `list_templates` (`io.kestra.plugin.core.http.Request`) calls `GET /{waba-id}/message_templates` on the Graph API with `fields=name,status,category,language,quality_score` and a bearer token. It is a read: no template is edited, deleted or sent. Retries cover short network blips, and `allowFailed` plus `allowFailure` keep an API error from aborting the flow so it can be reported instead.
    2. `summarize_templates` (`io.kestra.plugin.core.debug.Return`) first guards for a missing or non-200 response (`UNREACHABLE`). Otherwise one jq query reads each template's `status` and quality score, accepting both the object form (`quality_score.score`) and a plain string, and lists templates that are `PAUSED` or `DISABLED`, `REJECTED`, or approved with a `RED` or `YELLOW` score. Any stopped or RED template is `CRITICAL`, any rejected or YELLOW template is `WARNING`, otherwise `HEALTHY`.
    3. `route_by_template_health` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` logs quietly, `WARNING` posts a Slack note naming the templates, `CRITICAL` and `UNREACHABLE` page Slack. A `defaults` fallback logs anything unexpected.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run with the HTTP status and the full summary.
    5. The flow-level `errors` block pages Slack if the flow itself fails.
    6. The `template_check` trigger runs every 4 hours and ships `disabled: true`.

    ## What you get

    - A read-only template health check with no custom scripting and no extra plugin to install.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `UNREACHABLE`) other flows can gate on, for example to fall back to SMS for OTPs while a template is paused.
    - Slack messages that name each affected template and language.
    - An audit line on every run, separate from Slack.

    ## Who it's for

    - Businesses in India and elsewhere that send order updates, delivery alerts and OTPs over the WhatsApp Business Platform.
    - Growth and CRM teams whose marketing templates get paused after a campaign with too many blocks.
    - Engineering teams who own the messaging pipeline and want to know about a pause before support tickets arrive.

    ## Why orchestrate this with Kestra

    Meta notifies template status changes by email or webhook to whoever set up the app, which is easy to miss and hard to audit. Kestra turns a plain, read-only API call into a scheduled, typed classification with retries, a failure path and an execution history, and the `status` output lets the messaging flows themselves switch channel when a template stops working.

    ## Prerequisites

    - A WhatsApp Business Account on the WhatsApp Business Platform (Cloud API), with its WABA ID from WhatsApp Manager or the Meta app dashboard.
    - A System User access token with the `whatsapp_business_management` permission (permanent tokens avoid 24-hour expiry).
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `WHATSAPP_BUSINESS_ACCOUNT_ID`: the WhatsApp Business Account (WABA) ID.
    - `WHATSAPP_ACCESS_TOKEN`: System User access token with `whatsapp_business_management`.
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, for example `SECRET_WHATSAPP_BUSINESS_ACCOUNT_ID=$(echo -n '123456789012345' | base64)`, and read back with `{{ secret('WHATSAPP_BUSINESS_ACCOUNT_ID') }}`. Use the Enterprise secrets backend for encryption at rest and access control.

    ## Quick start

    1. In the Meta app dashboard, add the WhatsApp product; the test WhatsApp Business Account it creates comes with a sample `hello_world` template.
    2. Create a System User in Business Settings, give it the WhatsApp account, and generate a token with `whatsapp_business_management`.
    3. Add the secrets and run the flow manually: with only approved templates, `status` is `HEALTHY`.
    4. Submit a template that breaks the guidelines to see a `REJECTED` result and a `WARNING`, then enable `template_check`.

    ## How to extend

    - Follow `paging.cursors.after` when the account has more templates than `template_limit`.
    - Add a Request to `GET /{phone-number-id}?fields=quality_rating,messaging_limit_tier` to watch the phone number's own rating and messaging limit.
    - Store the last status per template in a KV store and alert only on changes.
    - Trigger a fallback SMS flow with a `Flow` trigger when `status` is `CRITICAL`.

    ## Inputs

    - `template_limit`: type INT, default `100`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `UNREACHABLE`.
    - Example path: `{{ fromJson(outputs.summarize_templates.value).stopped }}` for the list of paused or disabled templates.

    ## Links

    - [WhatsApp Business Account message templates API](https://developers.facebook.com/docs/graph-api/reference/whats-app-business-account/message_templates/)
    - [Template quality rating and pausing](https://developers.facebook.com/docs/whatsapp/business-management-api/message-templates/template-quality)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    ## Pitfalls

    - Graph API versions are retired about two years after release; update `graph_api_version` when Meta deprecates the one in this flow.
    - A temporary user token expires after a few hours and shows up as `UNREACHABLE` with HTTP 401; use a System User token.
    - Templates beyond `template_limit` are not checked unless you follow the paging cursor.
    - This flow only reads; it never edits, deletes or sends a template.
  tags:
    - Business
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
