id: qoswatch
namespace: company.team
description: Reports pods missing CPU/memory requests or limits, naming exactly what each one lacks. Read-only by design.

labels:
  project: qoswatch
  team: platform

inputs:
  - id: namespace
    type: STRING
    displayName: "Namespace"
    description: the namespace whose pods to audit
    defaults: default
  - id: slack_webhook
    type: STRING
    displayName: "Slack Webhook URL"
    description: Incoming webhook URL of the Slack channel for the report

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: audits resource requests and limits every morning
    cron: "0 8 * * *"
    timezone: UTC
    inputs:
      namespace: default
      slack_webhook: "{{ secret('SLACK_WEBHOOK') }}"

tasks:
  - id: list_pods
    type: io.kestra.plugin.scripts.shell.Commands
    description: lists all pods in the namespace as JSON
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: bitnami/kubectl
    inputFiles:
      client.crt: "{{ secret('CLIENT_CRT') }}"
      client.key: "{{ secret('CLIENT_KEY') }}"
    commands:
      - kubectl get pods -n {{ inputs.namespace }} -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > pods.json
    outputFiles:
      - pods.json

  - id: find_unlimited
    type: io.kestra.plugin.scripts.python.Script
    description: finds pods missing requests or limits and names the gaps
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: python:3.11
    dependencies:
      - kestra
    inputFiles:
      pods.json: "{{ outputs.list_pods.outputFiles['pods.json'] }}"
    script: |
      import json
      from kestra import Kestra

      namespace = """{{ inputs.namespace }}"""

      with open('pods.json') as f:
          pods = json.load(f)['items']

      # pod names we already reported, from the KV store (null on first run -> empty)
      raw_state = """{{ kv('qoswatch-state-' ~ inputs.namespace, errorOnMissing=false) }}"""
      already = set(json.loads(raw_state) if raw_state.strip() else [])

      def gaps(container):
          res = container.get('resources', {}) or {}
          req = res.get('requests', {}) or {}
          lim = res.get('limits', {}) or {}
          missing = []
          if 'cpu' not in req:
              missing.append('cpu request')
          if 'memory' not in req:
              missing.append('memory request')
          if 'cpu' not in lim:
              missing.append('cpu limit')
          if 'memory' not in lim:
              missing.append('memory limit')
          return missing

      offenders = []
      for pod in pods:
          meta = pod.get('metadata', {})
          spec = pod.get('spec', {})
          name = meta['name']
          # skip completed/succeeded pods, only running workloads matter here
          if pod.get('status', {}).get('phase') not in ('Running', 'Pending'):
              continue
          pod_gaps = []
          for c in (spec.get('containers', []) or []) + (spec.get('initContainers', []) or []):
              missing = gaps(c)
              if missing:
                  pod_gaps.append(f"{c['name']}: missing {', '.join(missing)}")
          if pod_gaps:
              qos = 'BestEffort' if all('missing' in g and 'request' in g and 'limit' in g for g in pod_gaps) else 'Burstable'
              offenders.append({'pod': name, 'qos': qos, 'gaps': pod_gaps})

      offender_names = sorted(o['pod'] for o in offenders)
      new = [o for o in offenders if o['pod'] not in already]

      lines = [f"*QoSWatch - pods without resource requests/limits in '{namespace}'*", ""]
      for o in new:
          lines.append(f"- *{o['pod']}* ({o['qos']} QoS)")
          for g in o['gaps']:
              lines.append(f"  {g}")
      lines.append("")
      lines.append("these pods get no scheduling guarantees and are first in line for eviction under pressure.")
      alert_text = "\n".join(lines)

      Kestra.outputs({
          'new_offenders': new,
          'count': len(new),
          'alert_text': alert_text,
          'new_state_json': json.dumps(offender_names),
      })

  - id: maybe_alert
    type: io.kestra.plugin.core.flow.If
    description: reports only newly found offenders
    condition: "{{ outputs.find_unlimited.vars.count > 0 }}"
    then:
      - id: send_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: posts the QoS report to Slack
        url: "{{ inputs.slack_webhook }}"
        messageText: "{{ outputs.find_unlimited.vars.alert_text }}"

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: remembers who was reported, so fixed pods drop out quietly
    key: "qoswatch-state-{{ inputs.namespace }}"
    value: "{{ outputs.find_unlimited.vars.new_state_json }}"
    overwrite: true

extend:
  title: "QoSWatch - Kubernetes missing requests/limits reporter"
  shortDescription: "Reports pods missing CPU/memory requests or limits on Slack, naming exactly what each one lacks."
  metaTitle: "QoSWatch: Kubernetes missing requests/limits reporter blueprint for Kestra"
  metaDescription: "A Kestra blueprint that audits Kubernetes pods for missing CPU and memory requests or limits and reports the offenders on Slack, without spamming."
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Infrastructure Automation
  ee: false
  demo: false
  description: |
    ## How it works

    1. `list_pods` (`io.kestra.plugin.scripts.shell.Commands`) dumps the namespace's pods as JSON with kubectl.
    2. `find_unlimited` (`io.kestra.plugin.scripts.python.Script`) inspects every container's (and init container's) resources and lists exactly which of the four are missing: cpu request, memory request, cpu limit, memory limit. Pods with nothing set are flagged BestEffort; the rest Burstable. It compares against the KV state so only newly found offenders are reported.
    3. `maybe_alert` (`io.kestra.plugin.core.flow.If`) posts the Slack report only when there is someone new to name.
    4. `save_state` (`io.kestra.plugin.core.kv.Set`) writes back the current offender list. Fixed pods drop out on their own, so a redeployed-offending pod reports again, and steady-state reruns stay quiet.

    ## What you get

    - A daily audit of which pods run without resource requests or limits, the ones Kubernetes evicts first under pressure.
    - Slack reports naming the pod, its QoS class, and exactly which requests/limits each container lacks.
    - No report spam: the KV-backed memory remembers who was already named.
    - Quiet runs when every pod declares its resources.

    ## Who it's for

    Anyone running workloads on Kubernetes who suspects half their pods have no limits set. Pairs with PodSecurityWatch as a prod-readiness series: this one covers resource hygiene, that one covers security posture.

    ## Why orchestrate this with Kestra

    `kubectl get pods` never told you which ones lack limits. As a flow it audits on a schedule, keeps every run's findings where you can audit them, and only bothers you when a new offender appears. Kestra holds the cluster credentials as secrets out of the YAML.

    ## Prerequisites

    - A Kubernetes cluster with pods you can list.
    - A kubeconfig client certificate and key with permission to list pods in the target namespace.
    - Kestra with the Docker task runner available (used for the kubectl and Python steps).
    - A Slack Incoming Webhook URL.

    ### Secrets

    | Secret | What it is |
    | --- | --- |
    | `CLIENT_CRT` | base64-encoded client certificate from your kubeconfig |
    | `CLIENT_KEY` | base64-encoded client key from your kubeconfig |
    | `MASTERURL` | base64-encoded Kubernetes API server URL, reachable from inside the Kestra container |
    | `SLACK_WEBHOOK` | base64-encoded Slack Incoming Webhook URL |

    In Kestra OSS, secrets come from environment variables prefixed with `SECRET_` and must be base64-encoded. If the API URL uses `127.0.0.1` or `localhost`, replace it with `host.docker.internal` so the Kestra container can reach it.

    ## Quick start

    1. Start Kestra with the secrets above as `SECRET_` environment variables. If minikube restarted since your last run, regenerate `SECRET_MASTERURL` first: the API port changes on every `minikube start`.
    2. Import this flow and create two test pods: one bare `kubectl run qos-bad --image=nginx`, one with limits set. Run the flow: the Slack report names only `qos-bad` with its missing four.
    3. Run again: quiet, already reported.
    4. Delete `qos-bad` and run again: quiet, it dropped out of state.

    ## How to extend

    - Fail the run instead of reporting by adding a Fail task when BestEffort pods exist in production namespaces.
    - Exclude system namespaces or specific workloads with a name/label filter in the Python step.
    - Track QoS class distribution over time by storing counts instead of names.
    - Combine with TopPodsWatch to correlate missing limits with actual high usage.

    ## Inputs

    | Input | Type | Default | What it does |
    | --- | --- | --- | --- |
    | `namespace` | STRING | `default` | the namespace whose pods to audit |
    | `slack_webhook` | STRING | (required) | Incoming webhook URL of the Slack channel for the report |

    ## Links

    - [Kestra blueprint catalog](https://kestra.io/blueprints)
    - [Kubernetes QoS classes documentation](https://kubernetes.io/docs/tasks/configure-pod-container/quality-service-pod/)
    - [Kestra secrets documentation](https://kestra.io/docs/concepts/secrets)

    ## Pitfalls

    - This flow deliberately never sets requests or limits for you. Guessing wrong causes OOMKills or CPU throttling in production; sizing resources is a human judgment call the report informs but does not make.
    - Completed or succeeded pods are skipped. Only Running and Pending pods are audited.
    - The flow is strictly read-only. It lists pods and reports; it never patches anything.
    - Minikube's API server port changes on every `minikube start`. Regenerate `SECRET_MASTERURL` and restart the Kestra container, or the kubectl step fails to connect.
