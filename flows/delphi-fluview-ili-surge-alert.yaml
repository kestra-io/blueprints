id: delphi-fluview-ili-surge-alert
namespace: company.team

description: |
  Weekly influenza-like illness (ILI) surge check on the CDC ILINet data served by the Delphi
  Epidata API. Computes each region's seasonal baseline the CDC way (non-influenza weeks of the
  three previous seasons, mean plus two standard deviations), alerts in Slack when a region
  crosses it or is climbing towards it, and tracks backfill revisions to recent weeks between
  weekly issues.

inputs:
  - id: regions
    type: STRING
    displayName: Regions
    description: Comma-separated Delphi FluView region codes. `nat` is the US, `hhs1` to `hhs10` the HHS regions; census divisions (`cen1` to `cen9`) and state codes (`ny`, `ca`) also work. Unknown codes are reported, not silently dropped.
    defaults: nat,hhs1,hhs2,hhs3,hhs4,hhs5,hhs6,hhs7,hhs8,hhs9,hhs10

  - id: early_warning_pct
    type: INT
    displayName: Early warning at (% of baseline)
    description: A region still below baseline gets one early warning when its wILI reaches this share of the baseline and has risen for `rising_weeks` weeks in a row.
    defaults: 70

  - id: rising_weeks
    type: INT
    displayName: Consecutive weekly rises for an early warning
    defaults: 3

  - id: revision_threshold
    type: FLOAT
    displayName: Revision threshold (percentage points)
    description: A stored week whose weighted ILI changed by at least this much in a later issue is reported as a backfill revision.
    defaults: 0.05

  - id: revision_weeks
    type: INT
    displayName: Weeks kept for revision tracking
    description: How many of the most recent epiweeks per region are stored in KV and compared with the next issue. Most ILINet backfill happens in the first four weeks after a week is first published.
    defaults: 6

  - id: state_key
    type: STRING
    displayName: KV state key
    defaults: delphi_fluview_ili_state

triggers:
  - id: weekly_after_fluview
    type: io.kestra.plugin.core.trigger.Schedule
    description: CDC publishes FluView on Fridays and Delphi ingests it the same day. The Saturday run catches a late ingest; a run that finds no new issue does nothing.
    cron: "0 21 * * 5,6"

concurrency:
  limit: 1

tasks:
  - id: fetch_ili
    type: io.kestra.plugin.core.http.Download
    description: Latest issue of every epiweek from week 40 four years ago onwards, which covers the three seasons the baseline needs plus the current one (about 2,300 rows for 11 regions). `fields` trims the response to the columns used.
    uri: "https://api.delphi.cmu.edu/epidata/fluview/?regions={{ inputs.regions | replace({' ': ''}) }}&epiweeks={{ (now() | date('yyyy') | number) - 4 }}40-{{ now() | date('yyyy') }}53&fields=region,epiweek,issue,lag,wili,num_ili,num_providers"
    headers:
      User-Agent: kestra-delphi-fluview-ili-surge-alert/1.0 (https://kestra.io)
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempts: 4

  - id: fetch_clinical
    type: io.kestra.plugin.core.http.Download
    description: Influenza-positive specimens from clinical labs for the same regions and weeks. They define the non-influenza weeks of each season for the baseline.
    uri: "https://api.delphi.cmu.edu/epidata/fluview_clinical/?regions={{ inputs.regions | replace({' ': ''}) }}&epiweeks={{ (now() | date('yyyy') | number) - 4 }}40-{{ now() | date('yyyy') }}53&fields=region,epiweek,total_a,total_b"
    headers:
      User-Agent: kestra-delphi-fluview-ili-surge-alert/1.0 (https://kestra.io)
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempts: 4

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    description: Last processed issue, regions above baseline and the recent weekly values. Missing on the first (BASELINE) run.
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: evaluate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Baseline per region = mean + 2 SD of weighted ILI over the non-influenza weeks of the three seasons before the
      current one, where a non-influenza week is part of a run of two or more weeks that each held under 2% of the
      season's positive specimens (CDC method). Then the latest week per region (share of baseline, weeks above, weeks
      rising), surge / early warning / back-below events against the stored state, revisions of the stored weeks
      (old issue vs new issue) and the new state.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      ili.json: "{{ outputs.fetch_ili.uri }}"
      clinical.json: "{{ outputs.fetch_clinical.uri }}"
      state.json: "{{ outputs.previous_state.value ?? '{}' }}"
    outputFiles:
      - regions_csv
      - revisions_csv
    parameters:
      regions: "{{ inputs.regions }}"
      threshold: "{{ inputs.revision_threshold }}"
      keep_weeks: "{{ inputs.revision_weeks }}"
      warn_pct: "{{ inputs.early_warning_pct }}"
      rising_weeks: "{{ inputs.rising_weeks }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE api AS
      SELECT CAST(json_extract(i.content, '$.result') AS INTEGER) AS ili_result, json_extract_string(i.content, '$.message') AS ili_message,
             CAST(json_extract(c.content, '$.result') AS INTEGER) AS clin_result
      FROM read_text('ili.json') i, read_text('clinical.json') c;

      CREATE TABLE ili AS
      SELECT e->>'$.region' AS region, CAST(e->>'$.epiweek' AS INTEGER) AS epiweek, CAST(e->>'$.issue' AS INTEGER) AS issue,
             CAST(e->>'$.lag' AS INTEGER) AS lag, TRY_CAST(e->>'$.wili' AS DOUBLE) AS wili, TRY_CAST(e->>'$.num_providers' AS INTEGER) AS providers
      FROM (SELECT unnest(from_json(coalesce(json_extract(content, '$.epidata'), '[]'), '["JSON"]')) AS e FROM read_text('ili.json'));

      CREATE TABLE clin AS
      SELECT e->>'$.region' AS region, CAST(e->>'$.epiweek' AS INTEGER) AS epiweek,
             coalesce(TRY_CAST(e->>'$.total_a' AS INTEGER), 0) + coalesce(TRY_CAST(e->>'$.total_b' AS INTEGER), 0) AS positives
      FROM (SELECT unnest(from_json(coalesce(json_extract(content, '$.epidata'), '[]'), '["JSON"]')) AS e FROM read_text('clinical.json'));

      CREATE MACRO season(ew) AS CASE WHEN ew % 100 >= 40 THEN ew // 100 ELSE ew // 100 - 1 END;
      CREATE TABLE cur AS SELECT season(max(epiweek)) AS season, max(issue) AS issue FROM ili;

      CREATE TABLE nonflu AS
      SELECT region, epiweek, flag AND (coalesce(lag(flag) OVER w, false) OR coalesce(lead(flag) OVER w, false)) AS nonflu
      FROM (SELECT region, epiweek, season(epiweek) AS s,
                   positives < 0.02 * sum(positives) OVER (PARTITION BY region, season(epiweek)) AS flag FROM clin)
      WINDOW w AS (PARTITION BY region, s ORDER BY epiweek);

      CREATE TABLE baseline AS
      SELECT i.region, round(avg(i.wili) + 2 * stddev_samp(i.wili), 2) AS baseline, count(*) AS baseline_weeks
      FROM ili i JOIN nonflu n USING (region, epiweek), cur
      WHERE n.nonflu AND i.wili IS NOT NULL AND season(i.epiweek) BETWEEN cur.season - 3 AND cur.season - 1
      GROUP BY i.region HAVING count(*) >= 10;

      CREATE TABLE prev_state AS
      SELECT TRY_CAST(json_extract(content, '$.issue') AS INTEGER) AS issue,
             coalesce(from_json(json_extract(content, '$.above'), '["VARCHAR"]'), CAST([] AS VARCHAR[])) AS above,
             coalesce(from_json(json_extract(content, '$.warned'), '["VARCHAR"]'), CAST([] AS VARCHAR[])) AS warned,
             coalesce(from_json(json_extract(content, '$.weeks'), '[{"region":"VARCHAR","epiweek":"INTEGER","issue":"INTEGER","wili":"DOUBLE","providers":"INTEGER"}]'),
                      CAST([] AS STRUCT(region VARCHAR, epiweek INTEGER, issue INTEGER, wili DOUBLE, providers INTEGER)[])) AS weeks
      FROM read_text('state.json');
      CREATE TABLE prev_weeks AS SELECT unnest(weeks, recursive := true) FROM prev_state;

      CREATE TABLE recent AS
      SELECT i.*, b.baseline, b.baseline_weeks, coalesce(i.wili >= b.baseline, false) AS above,
             coalesce(i.wili > lead(i.wili) OVER w, false) AS rose, row_number() OVER w AS rn
      FROM ili i LEFT JOIN baseline b ON b.region = i.region
      WINDOW w AS (PARTITION BY i.region ORDER BY i.epiweek DESC);

      CREATE TABLE status AS
      SELECT l.region, l.epiweek, l.issue, l.lag, round(l.wili, 2) AS wili, l.baseline, l.baseline_weeks, l.providers, l.above,
             CAST(round(100 * l.wili / l.baseline) AS INTEGER) AS pct_of_baseline, round(l.wili - p.wili, 2) AS change_wow,
             (SELECT min(s.rn) FROM recent s WHERE s.region = l.region AND NOT s.above) - 1 AS weeks_above,
             (SELECT min(s.rn) FROM recent s WHERE s.region = l.region AND NOT s.rose) - 1 AS weeks_rising,
             list_contains((SELECT above FROM prev_state), l.region) AS was_above,
             list_contains((SELECT warned FROM prev_state), l.region) AS was_warned
      FROM recent l LEFT JOIN recent p ON p.region = l.region AND p.rn = 2 WHERE l.rn = 1;

      CREATE TABLE events AS
      SELECT *, CASE WHEN coalesce((SELECT issue FROM prev_state) >= (SELECT issue FROM cur), false) OR baseline IS NULL THEN NULL
                     WHEN above AND NOT was_above THEN 'surge'
                     WHEN NOT above AND was_above THEN 'cleared'
                     WHEN warning AND NOT was_warned THEN 'warning' END AS event
      FROM (SELECT *, coalesce(NOT above AND pct_of_baseline >= CAST(:warn_pct AS INTEGER) AND weeks_rising >= CAST(:rising_weeks AS INTEGER), false) AS warning
            FROM status);

      CREATE TABLE revisions AS
      SELECT n.region, n.epiweek, o.issue AS old_issue, n.issue AS new_issue, round(o.wili, 3) AS old_wili, round(n.wili, 3) AS new_wili,
             round(n.wili - o.wili, 3) AS delta, n.providers - o.providers AS providers_added, b.baseline,
             coalesce((o.wili >= b.baseline) <> (n.wili >= b.baseline), false) AS crossed_baseline
      FROM prev_weeks o JOIN ili n USING (region, epiweek) LEFT JOIN baseline b USING (region)
      WHERE n.issue > o.issue AND abs(n.wili - o.wili) >= CAST(:threshold AS DOUBLE);

      COPY (SELECT region, epiweek, issue, lag, wili, baseline, baseline_weeks, pct_of_baseline, above, weeks_above, weeks_rising,
                   change_wow, providers, event FROM events ORDER BY region) TO '{{ outputFiles.regions_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM revisions ORDER BY region, epiweek) TO '{{ outputFiles.revisions_csv }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT ili_result FROM api) AS ili_result, (SELECT ili_message FROM api) AS ili_message, (SELECT clin_result FROM api) AS clin_result,
        (SELECT issue FROM cur) AS issue, (SELECT issue FROM prev_state) AS previous_issue,
        (SELECT issue FROM prev_state) IS NULL AS is_baseline,
        coalesce((SELECT issue FROM prev_state) >= (SELECT issue FROM cur), false) AS already_processed,
        (SELECT max(epiweek) FROM ili) AS latest_epiweek,
        count(*) AS regions, count(*) FILTER (WHERE above) AS above_baseline, count(*) FILTER (WHERE warning) AS early_warning,
        count(*) FILTER (WHERE event IS NOT NULL) + (SELECT count(*) FROM revisions WHERE crossed_baseline) AS alerts,
        (SELECT count(*) FROM revisions) AS revisions,
        coalesce((SELECT string_agg(r, ', ') FROM (SELECT DISTINCT trim(lower(unnest(string_split(CAST(:regions AS VARCHAR), ',')))) AS r)
                  WHERE r <> '' AND r NOT IN (SELECT region FROM ili)), '') AS unknown_regions,
        string_agg(region || ' ' || wili || CASE WHEN baseline IS NULL THEN ' (no baseline)' ELSE '/' || baseline END, ', ' ORDER BY region) AS status_line,
        coalesce(string_agg(CASE event WHEN 'surge' THEN 'SURGE ' WHEN 'warning' THEN 'Early warning ' ELSE 'Back below baseline ' END
                 || region || ' epiweek ' || epiweek || ' wILI ' || wili || '% vs baseline ' || baseline || '% (' || pct_of_baseline || '% of baseline, '
                 || CASE WHEN change_wow >= 0 THEN '+' ELSE '' END || change_wow || ' pp week on week, rising ' || weeks_rising || ' week(s)'
                 || CASE WHEN event = 'surge' THEN ', ' || weeks_above || ' week(s) above' ELSE '' END || ', ' || providers || ' providers, lag ' || lag || ')',
                 chr(10) ORDER BY event DESC, pct_of_baseline DESC) FILTER (WHERE event IS NOT NULL), '') AS event_lines,
        coalesce((SELECT string_agg('Revision ' || region || ' epiweek ' || epiweek || ' ' || old_wili || '% (issue ' || old_issue || ') to '
                  || new_wili || '% (issue ' || new_issue || ', ' || CASE WHEN providers_added >= 0 THEN '+' ELSE '' END || providers_added || ' providers)'
                  || CASE WHEN crossed_baseline THEN ', now ' || CASE WHEN new_wili >= baseline THEN 'ABOVE' ELSE 'below' END || ' baseline ' || baseline || '%' ELSE '' END,
                  chr(10) ORDER BY crossed_baseline DESC, abs(delta) DESC) FROM revisions), '') AS revision_lines,
        CAST(json_object('issue', (SELECT issue FROM cur),
             'above', coalesce(list(region ORDER BY region) FILTER (WHERE above), []),
             'warned', coalesce(list(region ORDER BY region) FILTER (WHERE NOT above AND (warning OR (was_warned AND weeks_rising > 0))), []),
             'weeks', (SELECT coalesce(list(json_object('region', region, 'epiweek', epiweek, 'issue', issue, 'wili', wili, 'providers', providers)), [])
                       FROM recent WHERE rn <= CAST(:keep_weeks AS INTEGER))) AS VARCHAR) AS new_state
      FROM events;

  - id: check_api
    type: io.kestra.plugin.core.execution.Fail
    description: Delphi answers HTTP 200 with `result` -2 when nothing matched (all region codes wrong) and 2 when the response was truncated.
    runIf: "{{ outputs.evaluate.outputs[0].row.ili_result != 1 or outputs.evaluate.outputs[0].row.clin_result != 1 }}"
    errorMessage: "Delphi FluView returned result {{ outputs.evaluate.outputs[0].row.ili_result }} ({{ outputs.evaluate.outputs[0].row.ili_message }}), clinical {{ outputs.evaluate.outputs[0].row.clin_result }} for regions {{ inputs.regions }}."

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.evaluate.outputs[0].row.new_state }}"

  - id: alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.outputs[0].row.alerts > 0 }}"
    then:
      - id: log_alert
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "ILINet issue {{ outputs.evaluate.outputs[0].row.issue }}{{ outputs.evaluate.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}:\n{{ outputs.evaluate.outputs[0].row.event_lines }}\n{{ outputs.evaluate.outputs[0].row.revision_lines }}"
      - id: slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: allowFailure keeps the run green without `SLACK_WEBHOOK_URL`; the alert is still in the WARN log and the CSVs.
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: ":chart_with_upwards_trend: *ILINet surge check, issue {{ outputs.evaluate.outputs[0].row.issue }}* ({{ outputs.evaluate.outputs[0].row.above_baseline }} of {{ outputs.evaluate.outputs[0].row.regions }} regions above baseline)\n{{ outputs.evaluate.outputs[0].row.event_lines }}\n{{ outputs.evaluate.outputs[0].row.revision_lines }}\nhttps://www.cdc.gov/fluview/"
    else:
      - id: no_alert
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.evaluate.outputs[0].row.already_processed ? 'Issue ' ~ outputs.evaluate.outputs[0].row.issue ~ ' was already processed, nothing new.' : 'No baseline crossings in issue ' ~ outputs.evaluate.outputs[0].row.issue ~ '.' }} {{ outputs.evaluate.outputs[0].row.revision_lines }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Issue {{ outputs.evaluate.outputs[0].row.issue }} (latest epiweek {{ outputs.evaluate.outputs[0].row.latest_epiweek }}, previous issue {{ outputs.evaluate.outputs[0].row.previous_issue ?? 'none, BASELINE run' }}): {{ outputs.evaluate.outputs[0].row.above_baseline }} of {{ outputs.evaluate.outputs[0].row.regions }} regions above baseline, {{ outputs.evaluate.outputs[0].row.revisions }} revisions of {{ inputs.revision_threshold }} pp or more.
      wILI/baseline: {{ outputs.evaluate.outputs[0].row.status_line }}{{ outputs.evaluate.outputs[0].row.unknown_regions is empty ? '' : '. Unknown region codes (no data returned): ' ~ outputs.evaluate.outputs[0].row.unknown_regions }}

errors:
  - id: slack_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":x: ILINet surge check {{ flow.id }} failed (execution {{ execution.id }}); this week's FluView issue was not evaluated."

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.evaluate.outputs[0].row | toJson }}"
  - id: regions_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.regions_csv }}"
  - id: revisions_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.revisions_csv }}"

extend:
  title: Alert on CDC ILINet Flu Activity Crossing the Seasonal Baseline, with Backfill Revision Tracking (Delphi Epidata)
  metaTitle: Delphi FluView ILI Surge Alert with DuckDB and Slack | Kestra
  shortDescription: Every week, pull CDC ILINet weighted ILI and clinical lab positives per HHS region from the Delphi Epidata API, compute each region's seasonal baseline the CDC way in DuckDB, and post to Slack when a region crosses it, climbs towards it, or when a later issue revises recent weeks.
  metaDescription: Weekly CDC ILINet check via Delphi Epidata - CDC-style seasonal baselines in DuckDB, surge and early-warning alerts in Slack, backfill revisions tracked in KV.
  description: |
    Hospitals plan staffing and beds around the week influenza-like illness (ILI) passes the seasonal baseline. The Delphi Epidata API serves every weekly CDC ILINet issue, and ILINet is backfilled: last week's value changes as more providers report. This flow computes the baseline, alerts once per episode on crossings and early rises, and records revised weeks.

    ## How it works

    1. A `Schedule` trigger runs Friday and Saturday at 21:00 UTC; a processed issue is only logged.
    2. `fetch_ili` (HTTP Download) makes one `/epidata/fluview/` request for all regions since week 40 four years ago, trimmed with `fields`. `fetch_clinical` gets influenza A and B positives from `/epidata/fluview_clinical/` for the same weeks.
    3. `previous_state` (KV Get) reads the last issue, the regions above baseline or already warned, and recent weekly values. Missing on the BASELINE run.
    4. `evaluate` (DuckDB) computes each baseline as CDC does: mean plus two SD of wILI over the non-influenza weeks of the three previous seasons (2+ week runs each under 2% of the season's positives). Events: `surge` (newly above), `warning` (at least `early_warning_pct` of baseline after `rising_weeks` weekly rises), `cleared`. A stored week whose wILI moved by `revision_threshold` or more is a revision; one that crosses the baseline also alerts.
    5. `check_api` (Fail) stops on Delphi `result` -2 (no data) or 2 (truncated); unknown region codes are named in the summary.
    6. `save_state` (KV Set) stores the issue, region lists and last `revision_weeks` weeks per region.
    7. `alert` (If) logs events and revisions at WARN and posts them to Slack (`allowFailure: true`). `errors` reports a failed run.

    ## What you get

    - One Slack message per new issue: wILI, baseline, share of baseline, weekly change, weeks rising, providers, lag, plus revisions.
    - A per-region CSV and a revisions CSV (old and new issue and value, providers added) as flow outputs.

    ## Who it's for

    - Public health epidemiologists and surveillance teams.
    - Hospital capacity planners and preparedness teams.

    ## Why orchestrate this with Kestra

    - Two HTTP calls and one SQL step replace a notebook.
    - KV state makes re-runs safe and keeps the values needed to see backfill; retries and the failure handler are declarative.

    ## Prerequisites

    - Kestra 2.0 with the DuckDB and Slack plugins, outbound HTTPS to `api.delphi.cmu.edu`. No API key: each request stays within the anonymous tier.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; alerts stay in the WARN log and CSVs).

    ## Quick start

    1. Execute with the defaults (US plus HHS regions 1 to 10). On 19 October 2026 (issue 202640) no region was above baseline and three got early warnings: HHS 9 at 76% of its 3.78% baseline after 11 weekly rises, HHS 2 at 72%, HHS 4 at 70%.
    2. Execute again: `Issue 202640 was already processed, nothing new.`
    3. Add `ny` (no clinical lab series, shown as `no baseline`) or a typo like `hhs99` (listed as unknown).
    4. Add `SLACK_WEBHOOK_URL` and enable the schedule.

    ## How to extend

    - Add census divisions (`cen1` to `cen9`) or states with clinical data (`ca`, `tx`).
    - Load the revisions CSV into a warehouse to measure backfill per region over a season.

    ## Links

    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries), [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [KV Get](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.get), [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set), [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Delphi FluView](https://cmu-delphi.github.io/delphi-epidata/api/fluview.html), [FluView Clinical](https://cmu-delphi.github.io/delphi-epidata/api/fluview_clinical.html), [CDC FluView](https://www.cdc.gov/fluview/)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
