id: website-content-change-watch
namespace: company.team
description: |
  Hash a watched page on a schedule, persist the hash in Kestra KV, and alert
  Slack only when the content actually changes — your own five-minute "page watch".

triggers:
  - id: watch_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Checks the page every 30 minutes; shipped disabled until the URL and KV are configured.
    cron: "*/30 * * * *"
    disabled: true
  - id: manual_check
    type: io.kestra.plugin.core.trigger.Webhook
    description: Force an on-demand check when you suspect the page changed.
    key: content-change-check

inputs:
  - id: url
    type: STRING
    defaults: https://example.com
    description: Page to hash and compare.
  - id: kv_key
    type: STRING
    defaults: watched_page_hash
    description: KV key storing the last seen content hash.

tasks:
  - id: load_previous_hash
    type: io.kestra.plugin.core.kv.Get
    description: Read the last stored hash; missing key means this is the first run and should not alert.
    key: "{{ inputs.kv_key }}"
    errorOnMissing: false

  - id: fetch_and_hash
    type: io.kestra.plugin.scripts.python.Script
    description: Fetch the page, strip volatile whitespace, hash the body, and emit the hash for comparison.
    containerImage: python:3.11-slim
    warningOnStdErr: false
    env:
      URL: "{{ inputs.url }}"
    script: |
      import hashlib, json, os, urllib.request

      req = urllib.request.Request(os.environ["URL"], headers={"User-Agent": "kestra-content-watch"})
      with urllib.request.urlopen(req, timeout=30) as r:
          body = r.read().decode("utf-8", "replace")
      normalized = " ".join(body.split())
      digest = hashlib.sha256(normalized.encode("utf-8")).hexdigest()
      print(f"page hash: {digest[:16]}")
      print("::" + json.dumps({"outputs": {"hash": digest}}) + "::")

  - id: compare_hashes
    type: io.kestra.plugin.core.flow.If
    description: Alert only when the hash differs from the stored one — first run and unchanged pages stay quiet.
    condition: "{{ outputs.load_previous_hash.value is not null and outputs.load_previous_hash.value != outputs.fetch_and_hash.vars.hash }}"
    then:
      - id: alert_change
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the old and new hash prefixes plus the URL so a human can eyeball the diff.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":eyes: CONTENT CHANGED at {{ inputs.url }} — hash moved from {{ outputs.load_previous_hash.value }} to {{ outputs.fetch_and_hash.vars.hash }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_unchanged
        type: io.kestra.plugin.core.log.Log
        description: Record the check so unchanged pages leave an audit trail.
        message: "No content change at {{ inputs.url }} (hash {{ outputs.fetch_and_hash.vars.hash }})."

  - id: store_new_hash
    type: io.kestra.plugin.core.kv.Set
    description: Persist the fresh hash for the next run, whether it changed or not — the schedule is stateful through KV.
    key: "{{ inputs.kv_key }}"
    value: "{{ outputs.fetch_and_hash.vars.hash }}"

errors:
  - id: alert_fetch_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the page can't be fetched — silence must not masquerade as "no change".
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Content watch FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.url }}. The watched page may be down."
      }

outputs:
  - id: page_hash
    type: STRING
    description: SHA-256 of the normalized page body from this run.
    value: "{{ outputs.fetch_and_hash.vars.hash }}"

extend:
  title: Watch a Page for Content Changes
  shortDescription: Schedules a page fetch, hashes the content, stores the hash in Kestra KV, and alerts Slack on change.
  metaTitle: Website Content Change Watcher
  metaDescription: Monitor any page for content changes using KV-persisted hashes and Slack alerts.
  description: |
    Competitor pricing pages, status pages of vendors, policy documents, a landing page before a launch — things you refresh manually today. This blueprint hashes the page on a schedule, persists the hash in the Kestra KV store, and only tells you when the hash actually moved.

    ## How it works

    1. `load_previous_hash` (`io.kestra.plugin.core.kv.Get`) reads the last hash, tolerating a missing key on first run.
    2. `fetch_and_hash` (`io.kestra.plugin.scripts.python.Script`) fetches the page, normalizes whitespace, and emits a SHA-256 via the `::{"outputs": ...}::` protocol.
    3. `compare_hashes` (`io.kestra.plugin.core.flow.If`) alerts via `alert_change` only when a stored hash exists and differs; otherwise `log_unchanged`.
    4. `store_new_hash` (`io.kestra.plugin.core.kv.Set`) persists the fresh hash — this is what makes the schedule stateful.
    5. The `errors` block alerts Slack when the fetch fails.

    ## What you get

    - Change alerts instead of a human refreshing tabs.
    - A last-seen hash in KV and in the execution history.
    - A `page_hash` output for downstream comparison steps.

    ## Who it's for

    - Growth teams watching competitor pages.
    - Ops watching vendor status or legal-doc edits.
    - Anyone who has said "I'll just check it every morning".

    ## Why orchestrate this with Kestra

    A cron job that prints a hash goes nowhere. The flow adds state (KV), a branch (change vs not), an alert, failure reporting, and history — and the next step (snapshot diff, archive to S3, open a ticket) is one task away.

    ## Prerequisites

    - The URL reachable from the Kestra Worker.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for change and failure alerts.

    ## Quick start

    1. Add the Slack webhook secret.
    2. Set `url` and a unique `kv_key` per watched page.
    3. Run twice — the second run should log "No content change".
    4. Enable `watch_schedule`.

    ## How to extend

    - Diff the old/new body and post an excerpt in Slack.
    - ForEach over a list of URLs, one KV key each.
    - Hash only a CSS selector region to ignore ads.

    ## Links

    - [Kestra KV store](https://kestra.io/docs/workflow-components/kv-store)
    - [Kestra KV tasks](https://kestra.io/plugins/plugin-core/tasks/kv)
  tags:
    - Infrastructure
    - Monitoring & Alerting
  subTags:
    - Website Monitoring
    - Change Detection
  ee: false
  demo: false
