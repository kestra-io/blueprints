id: emqx-mqtt-broker-connection-exhaustion-sentinel
namespace: company.iot

inputs:
  - id: emqx_api_url
    type: STRING
    defaults: "http://emqx.internal:18083"
    description: Base URL of EMQX HTTP API.
  - id: max_connections
    type: INT
    defaults: 100000
    description: "Maximum allowable connected clients before raising saturation alert (default 100000)."

tasks:
  - id: inspect_emqx_stats
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query EMQX API for cluster statistics
        curl -s -u "{{ secret('EMQX_API_KEY') }}:{{ secret('EMQX_SECRET_KEY') }}"           "{{ inputs.emqx_api_url }}/api/v5/stats" > /tmp/emqx_telemetry.json
        
        CONNECTIONS_COUNT=$(jq '.[0]?.connections.count // 0' /tmp/emqx_telemetry.json)
        CHANNELS_COUNT=$(jq '.[0]?.channels.count // 0' /tmp/emqx_telemetry.json)
        
        echo "::set-output name=connections_count::$CONNECTIONS_COUNT::"
        echo "::set-output name=channels_count::$CHANNELS_COUNT::"

  - id: evaluate_connection_capacity
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_emqx_stats.vars.connections_count | int > inputs.max_connections }}"
    then:
      - id: notify_iot_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#iot-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 EMQX MQTT Broker Connection Capacity Alert",
                "text": "EMQX cluster reached *{{ outputs.inspect_emqx_stats.vars.connections_count }} active connected clients* (threshold {{ inputs.max_connections }})! Erlang VM process limits, socket file descriptors, or broker licensing caps are nearing saturation.",
                "footer": "Kestra IoT Sentinel • EMQX MQTT"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#iot-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ EMQX Sentinel Failure",
            "text": "Failed to query EMQX HTTP API. Verify API credentials and port.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: EMQX Enterprise MQTT Broker Connected Clients and Session Sentinel
  shortDescription: Monitors EMQX MQTT broker for active connected IoT client surges and connection limit exhaustion.
  description: |
    ## How it works
    This workflow connects to the EMQX HTTP API (`/api/v5/stats`) using API keys to monitor active MQTT client connections (`connections.count`) and session channels. In large-scale IoT fleets (smart vehicles, industrial telemetry, smart meters), fleet reboot storms or misconfigured keepalive intervals cause millions of devices to reconnect concurrently. When connections reach operating system file descriptor limits (`nofile`) or Erlang BEAM process table ceilings (`+P`), EMQX drops incoming TCP and TLS handshakes. This workflow tracks connected client counts and alerts IoT infrastructure teams before broker rejection occurs.

    ## What you get
    - Real-time visibility into global IoT client connection counts on EMQX.
    - Prevents device connection drops and IoT fleet data blackouts.
    - Quantitative metrics on active connections and session channel volume.

    ## Who it's for
    - IoT Platform Engineers and Connected Fleet Operations Specialists.
    - SREs maintaining mission-critical MQTT broker clusters.

    ## Why orchestrate this with Kestra
    - **Continuous Fleet Health Auditing**: Periodically polls MQTT broker stats automatically.
    - **Decoupled Architecture**: Connects to standard REST APIs without intrusive local agents.
    - **Direct Team Alerts**: Delivers notifications with connection counts directly to Slack.

    ## Prerequisites
    - EMQX cluster with HTTP API enabled (default port `18083`).
    - Secrets `EMQX_API_KEY`, `EMQX_SECRET_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input EMQX API URL and connection threshold.
    3. Run the workflow to inspect connected client counts.

    ## How to extend
    - Query `/api/v5/metrics` for `messages.dropped` to detect discarded MQTT messages.
    - Automatically scale up EMQX node count via Kubernetes operator when connection volumes rise.

    ## Links
    - [EMQX REST API Documentation](https://docs.emqx.com/en/emqx/latest/admin/api.html)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
