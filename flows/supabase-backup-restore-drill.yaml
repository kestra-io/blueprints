id: supabase-backup-restore-drill
namespace: company.database
description: |
  Back up a Supabase database (or another Postgres database that pg_dump 17 can read) to your own S3, R2 or B2 bucket
  with the open-source backupdrill CLI, then restore the new snapshot into a throwaway Postgres container and check that it came back. A failed backup or
  drill fails the execution and posts to Slack.

triggers:
  - id: weekly_backup
    type: io.kestra.plugin.core.trigger.Schedule
    description: Sundays at 03:00 UTC. Shipped disabled; enable it once the secrets are set.
    cron: "0 3 * * 0"
    timezone: UTC
    disabled: true

concurrency:
  limit: 1
  behavior: QUEUE

# Where the backup goes (bucket, endpoint, region) comes from secrets, not inputs: whoever can
# start an execution must not be able to send the dump and the bucket keys somewhere else.
inputs:
  - id: project_name
    type: STRING
    defaults: my-app
    validator: ^[A-Za-z0-9._-]+$
    description: Name used in the bucket path (<prefix>/<project_name>/<snapshot>/) and in the manifest.
  - id: run_drill
    type: BOOL
    defaults: true
    description: Restore the new snapshot into a throwaway Postgres and check it.
  - id: backupdrill_version
    type: STRING
    defaults: "2"
    validator: ^[0-9]+(\.[0-9]+){0,2}$
    description: backupdrill version from npm. 2 means the newest 2.x release, 2.8.1 pins one.

tasks:
  - id: backup
    type: io.kestra.plugin.scripts.node.Commands
    description: Dump the database with pg_dump 17 and upload the dump, a manifest with sha256 checksums and a RECOVERY.md to the bucket.
    containerImage: node:22-trixie-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      BACKUPDRILL_DATABASE_URL: "{{ secret('BACKUPDRILL_DATABASE_URL') }}"
      BACKUPDRILL_S3_ACCESS_KEY_ID: "{{ secret('BACKUPDRILL_S3_ACCESS_KEY_ID') }}"
      BACKUPDRILL_S3_SECRET_ACCESS_KEY: "{{ secret('BACKUPDRILL_S3_SECRET_ACCESS_KEY') }}"
      BACKUPDRILL_S3_BUCKET: "{{ secret('BACKUPDRILL_S3_BUCKET') }}"
      # For AWS S3, delete the endpoint line here and in the drill task.
      BACKUPDRILL_S3_ENDPOINT: "{{ secret('BACKUPDRILL_S3_ENDPOINT') }}"
      BACKUPDRILL_S3_REGION: "{{ secret('BACKUPDRILL_S3_REGION') }}"
      BACKUPDRILL_PROJECT_NAME: "{{ inputs.project_name }}"
      CLI_VERSION: "{{ inputs.backupdrill_version }}"
      DEBIAN_FRONTEND: noninteractive
      npm_config_update_notifier: "false"
    inputFiles:
      # The CLI prints its result as one JSON line: the whole manifest, with every table name.
      # This keeps it out of the logs and turns the parts worth seeing into task outputs.
      backup-outputs.mjs: |
        import { readFileSync } from "node:fs";
        const { ok, manifest } = JSON.parse(readFileSync("backup.json", "utf8").trim().split("\n").pop());
        if (ok !== true) throw new Error("backup did not report success");
        const outputs = {
          snapshot: manifest.dump.key.split("/").at(-2),
          dumpKey: manifest.dump.key,
          dumpBytes: manifest.dump.bytes,
          tables: manifest.database.tableCount,
          serverVersion: manifest.database.serverVersion,
          cliVersion: manifest.toolVersion,
        };
        console.log("::" + JSON.stringify({ outputs }) + "::");
    beforeCommands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client-17 > /dev/null
      # Installed into its own directory from the public registry, without install scripts.
      - npm install --prefix /opt/backupdrill --ignore-scripts --no-audit --no-fund --loglevel=error --registry https://registry.npmjs.org/ "backupdrill@${CLI_VERSION}"
    commands:
      # An empty setting is removed so the CLI treats it as unset.
      - for name in $(env | sed -n 's/^\(BACKUPDRILL_[A-Z_]*\)=$/\1/p'); do unset "$name"; done
      # --config points at a file that doesn't exist, so only the settings above are used.
      # Progress goes to the log at INFO level, the JSON result to backup.json.
      - /opt/backupdrill/node_modules/.bin/backupdrill backup --config none.json 2>&1 > backup.json
      - node backup-outputs.mjs

  - id: drill_enabled
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.run_drill }}"
    then:
      - id: drill
        type: io.kestra.plugin.scripts.node.Commands
        description: Download the snapshot, verify its checksum, restore it into a throwaway Postgres container and compare the tables with the manifest.
        containerImage: node:22-trixie-slim
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          # The CLI starts the sandbox Postgres through the host's Docker engine and connects to it
          # on 127.0.0.1, so this container shares the host's network and Docker socket.
          networkMode: host
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        # The drill only reads the bucket. It gets no database credentials.
        env:
          BACKUPDRILL_S3_ACCESS_KEY_ID: "{{ secret('BACKUPDRILL_S3_ACCESS_KEY_ID') }}"
          BACKUPDRILL_S3_SECRET_ACCESS_KEY: "{{ secret('BACKUPDRILL_S3_SECRET_ACCESS_KEY') }}"
          BACKUPDRILL_S3_BUCKET: "{{ secret('BACKUPDRILL_S3_BUCKET') }}"
          BACKUPDRILL_S3_ENDPOINT: "{{ secret('BACKUPDRILL_S3_ENDPOINT') }}"
          BACKUPDRILL_S3_REGION: "{{ secret('BACKUPDRILL_S3_REGION') }}"
          BACKUPDRILL_PROJECT_NAME: "{{ inputs.project_name }}"
          CLI_VERSION: "{{ inputs.backupdrill_version }}"
          DEBIAN_FRONTEND: noninteractive
          npm_config_update_notifier: "false"
          SNAPSHOT: "{{ outputs.backup.vars.snapshot }}"
        inputFiles:
          drill-outputs.mjs: |
            import { readFileSync } from "node:fs";
            const text = readFileSync("drill.json", "utf8").trim();
            if (!text) throw new Error("the drill stopped before it wrote a report");
            const { report } = JSON.parse(text.split("\n").pop());
            const outputs = {
              passed: report.pass,
              failedChecks: report.checks.filter((check) => !check.pass).map((check) => check.name),
              tablesRestored: report.restoredTableCount,
              rowsRestored: report.restoredRowTotal,
              restoreSeconds: report.restoreSeconds,
            };
            console.log("::" + JSON.stringify({ outputs }) + "::");
            if (!report.pass) throw new Error(`drill failed: ${outputs.failedChecks.join(", ")}`);
        beforeCommands:
          - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client-17 docker-cli > /dev/null
          - npm install --prefix /opt/backupdrill --ignore-scripts --no-audit --no-fund --loglevel=error --registry https://registry.npmjs.org/ "backupdrill@${CLI_VERSION}"
        commands:
          - for name in $(env | sed -n 's/^\(BACKUPDRILL_[A-Z_]*\)=$/\1/p'); do unset "$name"; done
          # A failed drill still writes its report, so the outputs are read before the task fails.
          - status=0; /opt/backupdrill/node_modules/.bin/backupdrill drill --config none.json --snapshot "$SNAPSHOT" 2>&1 > drill.json || status=$?
          - node drill-outputs.mjs
          - exit "$status"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Snapshot {{ outputs.backup.vars.snapshot }}: {{ outputs.backup.vars.tables }} tables,
      {{ outputs.backup.vars.dumpBytes }} bytes, Postgres {{ outputs.backup.vars.serverVersion }}.
      {% if inputs.run_drill %}Restore drill passed: {{ outputs.drill.vars.tablesRestored }} tables and
      {{ outputs.drill.vars.rowsRestored }} rows restored in {{ outputs.drill.vars.restoreSeconds }}s.{% else %}No restore drill this run.{% endif %}

errors:
  - id: slack_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Runs when the backup or the drill fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Supabase backup flow `{{ flow.namespace }}.{{ flow.id }}` failed in execution {{ execution.id }} (project {{ inputs.project_name }}). The task logs have the reason."
      }

extend:
  title: Back Up Supabase to S3 and Prove It Restores with a Weekly Drill
  metaTitle: Supabase Backup to S3 with Automated Restore Drill | Kestra
  shortDescription: Back up a Supabase or Postgres database to your own S3, R2 or B2 bucket with the backupdrill CLI, then restore it into a throwaway Postgres to prove it works.
  metaDescription: Weekly Supabase backups to your own S3, R2 or B2 bucket, with a restore drill into a throwaway Postgres and a Slack alert when either fails.
  description: |
    Supabase keeps its own backups inside Supabase, and its physical backups can't be downloaded. This flow keeps a copy of the database in a bucket you own and checks every week that the copy restores. It runs the open-source backupdrill CLI, which uses `pg_dump` and `pg_restore` 17 under the hood, so it can also back up other Postgres databases on version 17 or older.

    ## How it works

    1. `weekly_backup` (Schedule) starts the flow on Sundays at 03:00 UTC. It ships disabled.
    2. `backup` runs `backupdrill backup` in a `node:22-trixie-slim` container with `pg_dump` 17. The dump, a `manifest.json` (tables, estimated row counts, sizes, sha256) and a `RECOVERY.md` go to `<prefix>/<project_name>/<snapshot>/` in your bucket. The manifest lists every table name, so it stays out of the logs; the snapshot name, table count and dump size become task outputs.
    3. `drill_enabled` (If) skips the drill when `run_drill` is false.
    4. `drill` runs `backupdrill drill` on the snapshot the backup just wrote: it downloads the dump, checks its sha256, restores it into a throwaway `postgres` container and checks that every table in the manifest came back and that tables with rows still have rows. The drill container gets the bucket keys but not the database URL.
    5. `summary` logs the result. If either task fails, `slack_alert` posts the execution ID to Slack.

    ## What you get

    - A dated snapshot in your own bucket every week, in plain `pg_dump` custom format that `pg_restore` can load without any extra tooling.
    - Proof that the snapshot restores, with tables and rows restored and the restore time as task outputs.
    - A failed execution and a Slack message when the backup or the restore check fails.

    ## Who it's for

    - Teams running production apps on Supabase who want an off-platform copy of their data.
    - Platform and data engineers who need evidence that their backups restore, including for audits.

    ## Why orchestrate this with Kestra

    - Kestra records each execution's logs and outputs, and the `errors` branch sends a Slack alert when a task fails.
    - Secrets come from Kestra's secret store and reach only the tasks that need them.
    - `concurrency` queues a manual run behind a scheduled one, so two backups never overlap.

    ## Prerequisites

    - A Kestra worker that can run Docker containers. The `drill` task mounts `/var/run/docker.sock` and uses host networking, because the CLI starts the sandbox Postgres itself and connects to it on `127.0.0.1`. Mounting the socket needs `volume-enabled: true` in the Docker task runner's plugin configuration. The worker needs enough memory for that extra Postgres container.
    - An S3-compatible bucket (AWS S3, Cloudflare R2, Backblaze B2, MinIO) and a key that can read and write it.
    - For Supabase: the **Session pooler** connection string from the project's **Connect** dialog. The default `postgres` user works. Supabase runs Postgres 15 to 17, and the flow uses `pg_dump` 17, which reads all three.
    - Each backup reads the selected schemas in full, which counts as egress on a Supabase bill. Check the size before switching to a daily schedule.
    - Limit who can edit this flow and its secrets. Anyone who can edit them decides where the dump and the bucket keys go.
    - If an execution is killed during the drill, the sandbox container can be left behind. Remove it with `docker rm -fv <name>`; its name starts with `backupdrill-drill-`.

    ### Secrets

    - `BACKUPDRILL_DATABASE_URL`: connection string of the database, password included.
    - `BACKUPDRILL_S3_ACCESS_KEY_ID`: access key for the backup bucket.
    - `BACKUPDRILL_S3_SECRET_ACCESS_KEY`: secret key for the backup bucket.
    - `BACKUPDRILL_S3_BUCKET`: name of the backup bucket.
    - `BACKUPDRILL_S3_ENDPOINT`: endpoint of an S3-compatible service such as Cloudflare R2, Backblaze B2 or MinIO. For AWS S3, skip this secret and delete the two `BACKUPDRILL_S3_ENDPOINT` lines from the flow.
    - `BACKUPDRILL_S3_REGION`: bucket region. AWS S3 needs the real region, R2 works with `auto`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for failure alerts.

    ## Quick start

    1. Add the secrets to your Kestra instance.
    2. Set `project_name`, which names the folder in the bucket.
    3. Execute the flow once and check the `backup` and `drill` outputs: the snapshot name, the table count, and how many rows the drill restored.
    4. Look in the bucket for `backupdrill/<project_name>/<snapshot>/` with `dump.pgcustom`, `manifest.json` and `RECOVERY.md`.
    5. Enable the `weekly_backup` trigger.

    ## How to extend

    - Back up Supabase Storage files as well: add `BACKUPDRILL_SUPABASE_STORAGE_ENDPOINT`, `_REGION`, `_ACCESS_KEY_ID` and `_SECRET_ACCESS_KEY` to the `backup` task's env, using the S3 access keys from the project's Storage settings. The drill then also checks a sample of file checksums.
    - Dump more than `public` by setting `BACKUPDRILL_SCHEMAS`, for example `public,billing`.
    - Run your own checks against the restored copy with `backupdrill drill --check-cmd "<command>"`. The command gets the sandbox connection string in `BACKUPDRILL_SANDBOX_URL`.
    - Bake `pg_dump`, the Docker CLI and the CLI into your own image to skip the installs on every run.

    ## Links

    - [Node.js Commands task](https://kestra.io/plugins/plugin-script-node/io.kestra.plugin.scripts.node.commands)
    - [Docker task runner](https://kestra.io/docs/task-runners/types/docker-task-runner)
    - [If task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [Slack incoming webhook](https://kestra.io/plugins/plugin-slack/slack-notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [backupdrill CLI documentation](https://backupdrill.com/docs/cli)
    - This blueprint has been created by Super Lede
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Testing & Quality
  ee: false
  demo: false
