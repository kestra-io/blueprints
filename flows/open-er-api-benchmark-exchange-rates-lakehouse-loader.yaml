id: open-er-api-exchange-rates-lakehouse-loader
namespace: company.analytics
description: Ingests daily foreign exchange benchmark rates, international monetary currency matrices, and conversion valuations from Open Exchange Rates API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: open-er-api-exchange-rates-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://open.er-api.com/v6/latest/USD"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "rates"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        base_code = data.get('base_code', 'USD')
        update_time = data.get('time_last_update_utc', now_iso)
        for cur, rate_val in items.items():
            current_ids.append(cur)
            try:
                rate = float(rate_val)
            except Exception:
                rate = 1.0

            records.append({
                'currency_code': str(cur),
                'rate_to_usd': rate,
                'base_code': str(base_code),
                'time_last_update_utc': str(update_time),
                'is_new': bool(cur not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE exchange_rates (
                currency_code VARCHAR,
                rate_to_usd DOUBLE,
                base_code VARCHAR,
                time_last_update_utc VARCHAR,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO exchange_rates SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY exchange_rates TO 'benchmark_exchange_rates.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    currency_code,
                    rate_to_usd
                FROM exchange_rates
                WHERE currency_code IN ('EUR', 'GBP', 'JPY', 'CAD', 'AUD', 'CHF', 'CNY', 'INR')
                ORDER BY currency_code ASC
            ) TO 'major_currencies_rates.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM exchange_rates WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM exchange_rates").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - benchmark_exchange_rates.parquet
      - major_currencies_rates.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['benchmark_exchange_rates.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "Open Exchange Rates Benchmark sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
