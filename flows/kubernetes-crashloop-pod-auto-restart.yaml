id: kubernetes-crashloop-pod-auto-restart
namespace: company.team

description: |
  Detect Kubernetes pods stuck in CrashLoopBackOff across all namespaces, trigger a
  rolling restart of the owning deployment, wait for the pods to stabilise, re-check
  their status, and notify Slack on recovery or escalate if pods are still crashing.

inputs:
  - id: kubeconfig_secret
    type: STRING
    displayName: Kubeconfig Secret Name
    description: Name of the Kestra secret that holds the base64-encoded kubeconfig for cluster access.
    defaults: "KUBECONFIG_BASE64"

  - id: excluded_namespaces
    type: STRING
    displayName: Excluded Namespaces (comma-separated)
    description: Namespaces to skip during the CrashLoopBackOff scan, e.g. kube-system,monitoring.
    defaults: "kube-system"

  - id: stabilisation_wait_seconds
    type: INT
    displayName: Post-Restart Wait (seconds)
    description: Seconds to wait after triggering rollout restarts before re-checking pod statuses.
    defaults: 60
    min: 30
    max: 600

  - id: dry_run
    type: BOOL
    displayName: Dry Run
    description: When true, lists crashing pods and their deployments without issuing any restart.
    defaults: true

variables:
  slack_webhook: "{{ secret('SLACK_WEBHOOK_URL') }}"

tasks:
  - id: write_kubeconfig
    type: io.kestra.plugin.scripts.shell.Commands
    description: Decode the kubeconfig secret to a file for subsequent kubectl calls.
    env:
      KUBECONFIG_B64: "{{ secret(inputs.kubeconfig_secret) }}"
    commands:
      - |
        mkdir -p /tmp/kube
        echo "${KUBECONFIG_B64}" | base64 -d > /tmp/kube/config
        chmod 600 /tmp/kube/config
        echo "Kubeconfig written."

  - id: detect_crashloop_pods
    type: io.kestra.plugin.scripts.shell.Commands
    description: List all pods in CrashLoopBackOff state and resolve their owning deployments.
    commands:
      - |
        set -e
        export KUBECONFIG=/tmp/kube/config
        EXCLUDED="{{ inputs.excluded_namespaces }}"

        kubectl get pods -A --no-headers 2>/dev/null \
          | awk '$4 == "CrashLoopBackOff" { print $1, $2 }' \
          | while read NS POD; do
              # Skip excluded namespaces
              if echo "${EXCLUDED}" | tr ',' '\n' | grep -qx "${NS}"; then
                continue
              fi
              # Resolve owning deployment via replicaset owner
              RS=$(kubectl get pod "${POD}" -n "${NS}" -o jsonpath='{.metadata.ownerReferences[0].name}' 2>/dev/null || true)
              DEPLOY=""
              if [ -n "${RS}" ]; then
                DEPLOY=$(kubectl get replicaset "${RS}" -n "${NS}" \
                  -o jsonpath='{.metadata.ownerReferences[0].name}' 2>/dev/null || true)
              fi
              echo "${NS}/${POD}/${DEPLOY}"
            done > /tmp/crashloop.txt

        POD_COUNT=$(grep -c '/' /tmp/crashloop.txt 2>/dev/null || echo "0")
        cat /tmp/crashloop.txt
        echo "::{ \"outputs\": { \"crashloop_count\": ${POD_COUNT} } }::"
    outputFiles:
      - "/tmp/crashloop.txt"

  - id: check_remediation_needed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.detect_crashloop_pods.vars.crashloop_count | int > 0 }}"
    then:
      - id: restart_or_report
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.dry_run == false }}"
        then:
          - id: restart_deployments
            type: io.kestra.plugin.scripts.shell.Commands
            description: Issue kubectl rollout restart for every unique deployment with crashing pods.
            commands:
              - |
                set -e
                export KUBECONFIG=/tmp/kube/config
                RESTARTED=0

                # Read crashloop.txt and restart unique namespace/deployment pairs
                sort -t'/' -k1,1 -k3,3 /tmp/crashloop.txt | awk -F'/' '!seen[$1"/"$3]++ && $3 != ""' \
                  | while read LINE; do
                      NS=$(echo "${LINE}" | cut -d'/' -f1)
                      DEPLOY=$(echo "${LINE}" | cut -d'/' -f3)
                      echo "Restarting deployment ${DEPLOY} in namespace ${NS}..."
                      kubectl rollout restart deployment/"${DEPLOY}" -n "${NS}" && RESTARTED=$((RESTARTED+1))
                    done

                echo "Rollout restart issued for all affected deployments."
                echo "::{ \"outputs\": { \"restarted_deployment_count\": ${RESTARTED} } }::"

          - id: wait_for_stabilisation
            type: io.kestra.plugin.core.flow.Sleep
            duration: "PT{{ inputs.stabilisation_wait_seconds }}S"

          - id: verify_recovery
            type: io.kestra.plugin.scripts.shell.Commands
            description: Re-check whether any pods are still in CrashLoopBackOff state.
            commands:
              - |
                set -e
                export KUBECONFIG=/tmp/kube/config
                EXCLUDED="{{ inputs.excluded_namespaces }}"

                STILL=$(kubectl get pods -A --no-headers 2>/dev/null \
                  | awk '$4 == "CrashLoopBackOff" { print $1 }' \
                  | while read NS; do
                      echo "${EXCLUDED}" | tr ',' '\n' | grep -qx "${NS}" || echo "${NS}"
                    done | wc -l | tr -d ' ')

                echo "::{ \"outputs\": { \"remaining_crashloop_count\": ${STILL} } }::"
                echo "Pods still in CrashLoopBackOff after restart: ${STILL}."

          - id: notify_result
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.verify_recovery.vars.remaining_crashloop_count | int == 0 }}"
            then:
              - id: notify_success
                type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
                url: "{{ vars.slack_webhook }}"
                payload: |
                  {"text": "✅ *Kubernetes self-healing succeeded* — `{{ outputs.detect_crashloop_pods.vars.crashloop_count }}` pod(s) were in CrashLoopBackOff; rollout restarts resolved all of them. No crashing pods remain."}
            else:
              - id: notify_escalation
                type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
                url: "{{ vars.slack_webhook }}"
                payload: |
                  {"text": "🔴 *Kubernetes escalation required* — `{{ outputs.verify_recovery.vars.remaining_crashloop_count }}` pod(s) remain in CrashLoopBackOff after rollout restart. Container logs and events need manual review."}
        else:
          - id: notify_dry_run
            type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
            url: "{{ vars.slack_webhook }}"
            payload: |
              {"text": "⚠️ *Kubernetes CrashLoopBackOff detected (dry run)* — `{{ outputs.detect_crashloop_pods.vars.crashloop_count }}` pod(s) crashing. Set `dry_run=false` to trigger rollout restarts."}
    else:
      - id: notify_healthy
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ vars.slack_webhook }}"
        payload: |
          {"text": "✅ *Kubernetes pod health OK* — no CrashLoopBackOff pods detected across non-excluded namespaces."}

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ vars.slack_webhook }}"
    payload: |
      {"text": "🔴 *Kubernetes crashloop auto-restart flow failed* — execution `{{ execution.id }}` encountered an unexpected error. Check Kestra logs."}

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  title: "Kubernetes CrashLoopBackOff Pod Auto-Restart"
  description: |
    Detects Kubernetes pods stuck in CrashLoopBackOff across all namespaces, triggers
    a rolling restart of the owning deployment, waits for pods to stabilise, re-checks
    their status, and notifies Slack on recovery or escalates if pods are still crashing.

    ## How it works

    1. `write_kubeconfig` decodes the cluster kubeconfig from a Kestra secret to a
       temporary file so subsequent `kubectl` calls are authenticated.
    2. `detect_crashloop_pods` runs `kubectl get pods -A` and filters for
       `CrashLoopBackOff`, resolving each pod's owning `ReplicaSet` and then its
       parent `Deployment`. Namespaces listed in `excluded_namespaces` are skipped.
    3. `check_remediation_needed` branches on the pod count.
       - **Count > 0** and `dry_run=false`: `restart_deployments` issues
         `kubectl rollout restart deployment/<name>` for every unique
         namespace/deployment pair. `wait_for_stabilisation` then pauses for
         `stabilisation_wait_seconds` seconds.
       - **Count > 0** and `dry_run=true`: `notify_dry_run` posts a Slack warning
         without touching the cluster.
       - **Count == 0**: `notify_healthy` posts a clean-pass message.
    4. `verify_recovery` re-checks pod states after the wait.
    5. `notify_result` posts a success or escalation message based on the remaining count.
    6. The `errors` block catches unexpected flow failures with a dedicated Slack alert.
    7. `schedule` runs every 5 minutes; ship it disabled and enable once verified.

    ## What you get

    - Automated rollout restarts for crashing pods, reducing MTTR for transient
      CrashLoopBackOff incidents caused by configuration reloads, temporary dependency
      unavailability, or OOM kills.
    - A dry-run mode for audit before enabling automated restarts in production.
    - A post-restart verification step that separates genuine recovery from incidents
      that need a human to inspect container logs and events.

    ## Prerequisites

    - `kubectl` installed and on `PATH` on the Kestra worker.
    - A kubeconfig with `get pods`, `get replicasets`, and `rollout restart` permissions,
      stored base64-encoded as a Kestra secret.
    - A Slack incoming webhook stored as `SLACK_WEBHOOK_URL`.

    ## Secrets required

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL.
    - The secret named by `kubeconfig_secret` (default `KUBECONFIG_BASE64`): a
      base64-encoded kubeconfig granting cluster access.

    ## Troubleshooting

    - If `kubectl` commands exit with "Error from server: the server doesn't have a
      resource type", confirm the kubeconfig points to the correct cluster and context.
    - If pods restart but immediately crash again, the root cause is not transient;
      inspect `kubectl logs` and `kubectl describe pod` to identify the application error.
    - In Kestra OSS, supply secrets as environment variables prefixed `SECRET_` and
      base64-encoded.

    ## References

    - [kubectl rollout restart](https://kubernetes.io/docs/reference/kubectl/generated/kubectl_rollout/kubectl_rollout_restart/)
    - [Kubernetes pod lifecycle](https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/)
    - [Kestra Shell Commands plugin](https://kestra.io/plugins/plugin-script-shell)

  tags:
    - Kubernetes
    - Infrastructure
  subTags:
    - Self-Healing
    - Monitoring & Alerting
  ee: false
  demo: false
