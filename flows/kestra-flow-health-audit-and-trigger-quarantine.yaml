id: kestra-flow-health-audit-and-trigger-quarantine
namespace: company.team

description: |
  Hourly health audit of every flow under a namespace prefix, through the Kestra API: validation errors, deprecated or
  renamed task types, failing schedules, stuck triggers and risky configuration, with a scorecard CSV. A Schedule trigger
  whose last K runs failed is disabled for a KV `ttl` lease (after approval, or automatically) and switched back on when
  the lease expires. Dry run by default.

inputs:
  - id: namespace_prefix
    type: STRING
    defaults: company.team
    description: Namespace to audit, child namespaces included (company.team also covers company.team.etl). Empty or wildcard values are refused.

  - id: mode
    type: SELECT
    values: [audit, release, renew, replay]
    defaults: audit
    description: audit checks every flow. release re-enables the `targets` now, renew extends their lease, replay re-checks only the flows whose check failed in an earlier run.

  - id: targets
    type: ARRAY
    itemType: STRING
    required: false
    description: For release and renew, quarantined triggers written as namespace/flowId/triggerId.

  - id: dry_run
    type: BOOL
    defaults: true
    description: true (default) reports what it would disable or re-enable. false changes trigger states.

  - id: auto_quarantine
    type: BOOL
    defaults: false
    description: false (default) waits for an approval before disabling triggers. true disables them without asking.

  - id: quarantine_after_failures
    type: INT
    defaults: 3
    min: 2
    max: 50
    description: Disable a Schedule trigger after this many failed scheduled runs in a row.

  - id: quarantine_ttl
    type: DURATION
    defaults: P2D
    description: How long a quarantine lasts. The trigger is re-enabled by the first audit after the lease expires, unless renewed.

  - id: runs_per_flow
    type: INT
    defaults: 10
    min: 3
    max: 100
    description: Number of most recent finished executions read per flow for the failure rate and the failure streak.

  - id: failing_rate_pct
    type: INT
    defaults: 50
    min: 1
    max: 100
    description: A flow whose failure rate over those runs reaches this percentage is reported as FAILING.

  - id: stuck_after_minutes
    type: INT
    defaults: 120
    min: 5
    description: An enabled trigger that stays locked, or misses its next evaluation, for longer than this is reported as stuck.

  - id: kestra_api_url
    type: STRING
    defaults: http://localhost:8080
    description: Base URL of this Kestra instance's API, as seen from the worker.

variables:
  tenant: main
  key_prefix: flow_health
  probation_ttl: P30D

checks:
  - when: "{{ {'p': inputs.namespace_prefix} | jq('.p | test(\"^[a-z0-9][a-z0-9_-]*([.][a-z0-9_-]+)*$\")') | first }}"
    message: namespace_prefix must be one concrete namespace such as company.team. Empty values, wildcards and stray dots are refused, because the audit can disable triggers in every namespace it covers.
    style: ERROR
  - when: "{{ inputs.mode == 'audit' or inputs.mode == 'replay' or ((inputs.targets ?? []) | length) > 0 }}"
    message: release and renew need at least one target written as namespace/flowId/triggerId.
    style: ERROR
  - when: "{{ {'p': inputs.namespace_prefix, 't': inputs.targets ?? []} | jq('.p as $p | [.t[] | split(\"/\") | select(length != 3 or ((.[0] == $p or (.[0] | startswith($p + \".\"))) | not))] | length == 0') | first }}"
    message: Every target must be namespace/flowId/triggerId inside namespace_prefix.
    style: ERROR
  - when: "{{ inputs.quarantine_after_failures <= inputs.runs_per_flow }}"
    message: quarantine_after_failures cannot be larger than runs_per_flow, the streak is counted within those runs.
    style: ERROR

concurrency:
  limit: 1
  behavior: QUEUE

sla:
  - id: max_runtime
    type: MAX_DURATION
    duration: PT2H
    behavior: FAIL
    labels:
      flow_health_sla: breached

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "20 * * * *"
    description: Every hour with the defaults, so a dry-run report, until you set `dry_run` to false here.

tasks:
  - id: quarantine_records
    type: io.kestra.plugin.core.kv.GetKeys
    description: One durable record per trigger this flow quarantined or released. Records have no ttl while quarantined, so an expired lease is still known.
    prefix: "{{ vars.key_prefix }}_q__"

  - id: load_state
    type: io.kestra.plugin.core.output.OutputValues
    description: Previous statuses, the dead-letter list and each record with whether its lease (a separate key with a ttl) still exists.
    values:
      status: "{{ (kv(vars.key_prefix ~ '_status', errorOnMissing=false) ?? []) | toJson }}"
      dead_letter: "{{ (kv(vars.key_prefix ~ '_dead_letter', errorOnMissing=false) ?? []) | toJson }}"
      records: "[{% for k in (outputs.quarantine_records.keys ?? []) %}{{ loop.index > 0 ? ',' : '' }}{{ {'key': k, 'record': kv(k, errorOnMissing=false), 'lease_alive': kv(k | replace({'_q__': '_lease__'}), errorOnMissing=false) != null} | toJson }}{% endfor %}]"

  - id: list_flows
    type: io.kestra.plugin.core.http.Download
    description: |
      Every flow in scope in one request (PREFIX also matches child namespaces), saved to internal storage: the search returns
      full definitions, 2.2 MB for 99 flows in testing, over the 1 MB limit for a task output. Hard fail with retries.
    failOnEmptyResponse: true
    uri: "{{ inputs.kestra_api_url | trim }}/api/v1/{{ vars.tenant }}/flows/search"
    params:
      "filters[namespace][PREFIX]": "{{ inputs.namespace_prefix }}"
      size: "1000"
    options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
    timeout: PT1M
    retry: {type: exponential, interval: PT5S, maxInterval: PT1M, maxAttempts: 3}

  - id: list_triggers
    type: io.kestra.plugin.core.http.Download
    description: Runtime state of every trigger in scope (disabled, locked, next evaluation), in one request, saved to internal storage.
    failOnEmptyResponse: true
    uri: "{{ inputs.kestra_api_url | trim }}/api/v1/{{ vars.tenant }}/triggers/search"
    params:
      "filters[namespace][PREFIX]": "{{ inputs.namespace_prefix }}"
      size: "1000"
    options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
    timeout: PT1M
    retry: {type: exponential, interval: PT5S, maxInterval: PT1M, maxAttempts: 3}

  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Re-checks the scope (exact namespace or child, never a sibling such as company.teamx), leaves this flow out, picks the
      flows to check for the mode, and fails fast when the lists were truncated or a release target is not a trigger this
      flow quarantined: it never re-enables a trigger that a person disabled.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    timeout: PT2M
    inputFiles:
      flows.json: "{{ outputs.list_flows.uri }}"
      triggers.json: "{{ outputs.list_triggers.uri }}"
    parameters:
      records: "{{ outputs.load_state.values.records }}"
      dead_letter: "{{ outputs.load_state.values.dead_letter }}"
      targets: "{{ (inputs.targets ?? []) | toJson }}"
      mode: "{{ inputs.mode }}"
      prefix: "{{ inputs.namespace_prefix }}"
      self_ns: "{{ flow.namespace }}"
      self_id: "{{ flow.id }}"
      api: "{{ inputs.kestra_api_url | trim }}/api/v1/{{ vars.tenant }}"
      runs: "{{ inputs.runs_per_flow }}"
    sql: |
      CREATE TABLE raw AS SELECT (SELECT CAST(content AS JSON) FROM read_text('{{ workingDir }}/flows.json')) AS flows,
             (SELECT CAST(content AS JSON) FROM read_text('{{ workingDir }}/triggers.json')) AS triggers;
      CREATE TABLE fl AS SELECT json_extract_string(r, '$.namespace') AS namespace, json_extract_string(r, '$.id') AS flow_id
      FROM (SELECT unnest(from_json(json_extract(flows, '$.results'), '["JSON"]')) AS r FROM raw);
      CREATE TABLE tr AS SELECT json_extract_string(r, '$.state.namespace') AS namespace, json_extract_string(r, '$.state.flowId') AS flow_id,
             json_extract_string(r, '$.state.triggerId') AS trigger_id, json_extract_string(r, '$.state.kind') AS kind
      FROM (SELECT unnest(from_json(json_extract(triggers, '$.results'), '["JSON"]')) AS r FROM raw);
      CREATE TABLE q AS SELECT json_extract_string(e, '$.record.namespace') || '/' || json_extract_string(e, '$.record.flowId') || '/' || json_extract_string(e, '$.record.triggerId') AS target,
             json_extract_string(e, '$.record.state') AS state
      FROM (SELECT unnest(from_json(:records, '["JSON"]')) AS e);
      CREATE TABLE problems AS
      SELECT 'more than 1000 flows match ' || :prefix || ', audit a narrower namespace' AS msg
      WHERE (SELECT CAST(json_extract_string(flows, '$.total') AS BIGINT) FROM raw) > (SELECT count(*) FROM fl)
      UNION ALL SELECT 'more than 1000 triggers match ' || :prefix || ', audit a narrower namespace'
      WHERE (SELECT CAST(json_extract_string(triggers, '$.total') AS BIGINT) FROM raw) > (SELECT count(*) FROM tr)
      UNION ALL SELECT 'target ' || t || ' is not quarantined by this flow, only triggers it disabled can be released or renewed'
      FROM (SELECT unnest(from_json(:targets, '["VARCHAR"]')) AS t)
      WHERE :mode IN ('release', 'renew') AND t NOT IN (SELECT target FROM q WHERE state = 'quarantined');
      CREATE TABLE gate AS SELECT CASE WHEN count(*) > 0 THEN error('Nothing was changed. ' || string_agg(msg, '; ')) END AS ok FROM problems;
      CREATE TABLE sel AS
      SELECT f.namespace, f.flow_id, coalesce(string_agg(t.trigger_id, ',' ORDER BY t.trigger_id), '') AS schedules
      FROM fl f LEFT JOIN tr t ON t.namespace = f.namespace AND t.flow_id = f.flow_id AND t.kind = 'SCHEDULE'
      WHERE (f.namespace = :prefix OR starts_with(f.namespace, :prefix || '.'))
        AND NOT (f.namespace = :self_ns AND f.flow_id = :self_id)
        AND (:mode = 'audit' OR (:mode = 'replay' AND f.namespace || '/' || f.flow_id IN (SELECT unnest(from_json(:dead_letter, '["VARCHAR"]')))))
      GROUP BY f.namespace, f.flow_id;
      SELECT (SELECT count(*) FROM fl) AS flows_listed, (SELECT count(*) FROM sel) AS flow_count,
             coalesce((SELECT CAST(to_json(list(json_object('namespace', namespace, 'flow_id', flow_id, 'api', :api,
                 'runs', CAST(:runs AS INTEGER), 'schedules', schedules) ORDER BY namespace, flow_id)) AS VARCHAR) FROM sel), '[]') AS items;

  - id: probe
    type: io.kestra.plugin.core.flow.Loop
    description: |
      One isolated iteration per flow (`transmitFailed: false`): a flow that cannot be read is recorded as PROBE_FAILED and
      dead-lettered, the others are still audited. Loop `outputs` collect one row per flow, failed ones included.
    values: "{{ outputs.plan.outputs[0].row.items }}"
    concurrencyLimit: 4
    transmitFailed: false
    tasks:
      - id: probe_flow
        type: io.kestra.plugin.core.flow.Dag
        description: The validation needs the source first; the two execution reads do not depend on it and run alongside.
        concurrent: 3
        tasks:
          - task:
              id: get_source
              type: io.kestra.plugin.core.http.Request
              description: Stored source and parsed definition. A flow whose plugin is gone comes back with an `exception` instead of tasks.
              uri: "{{ fromJson(item.value).api }}/flows/{{ fromJson(item.value).namespace }}/{{ fromJson(item.value).flow_id }}"
              params: {source: "true"}
              options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
              timeout: PT30S
              retry: {type: exponential, interval: PT2S, maxInterval: PT20S, maxAttempts: 3}
          - task:
              id: validate_source
              type: io.kestra.plugin.core.http.Request
              description: "Same check as the editor: `constraints` (invalid), `deprecationPaths`, `warnings` (e.g. a Subflow whose child was deleted) and `infos` (renamed task types)."
              method: POST
              uri: "{{ fromJson(item.value).api }}/flows/validate"
              contentType: application/x-yaml
              body: "{{ fromJson(outputs.get_source.body).source }}"
              options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
              timeout: PT30S
              retry: {type: exponential, interval: PT2S, maxInterval: PT20S, maxAttempts: 3}
            dependsOn: [get_source]
          - task:
              id: recent_runs
              type: io.kestra.plugin.core.http.Request
              description: Last finished executions of any origin, for the failure rate.
              uri: "{{ fromJson(item.value).api }}/executions/search"
              params:
                "filters[namespace][EQUALS]": "{{ fromJson(item.value).namespace }}"
                "filters[flowId][EQUALS]": "{{ fromJson(item.value).flow_id }}"
                "filters[state][IN]": SUCCESS,WARNING,FAILED,KILLED,CANCELLED
                sort: "state.startDate:desc"
                size: "{{ fromJson(item.value).runs }}"
              options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
              timeout: PT30S
              retry: {type: exponential, interval: PT2S, maxInterval: PT20S, maxAttempts: 3}
          - task:
              id: scheduled_runs
              type: io.kestra.plugin.core.http.Request
              description: Only runs started by the flow's Schedule triggers, so manual test runs never count toward a quarantine.
              runIf: "{{ fromJson(item.value).schedules != '' }}"
              uri: "{{ fromJson(item.value).api }}/executions/search"
              params:
                "filters[namespace][EQUALS]": "{{ fromJson(item.value).namespace }}"
                "filters[flowId][EQUALS]": "{{ fromJson(item.value).flow_id }}"
                "filters[triggerId][IN]": "{{ fromJson(item.value).schedules }}"
                "filters[state][IN]": SUCCESS,WARNING,FAILED,KILLED,CANCELLED
                sort: "state.startDate:desc"
                size: "{{ fromJson(item.value).runs }}"
              options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
              timeout: PT30S
              retry: {type: exponential, interval: PT2S, maxInterval: PT20S, maxAttempts: 3}
    outputs:
      - id: row
        type: JSON
        value: |
          {{ {
            'namespace': fromJson(item.value).namespace,
            'flow_id': fromJson(item.value).flow_id,
            'ok': outputs.get_source.body is defined and outputs.validate_source.body is defined and outputs.recent_runs.body is defined
                  and (fromJson(item.value).schedules == '' or outputs.scheduled_runs.body is defined),
            'exception': outputs.get_source.body is defined ? (fromJson(outputs.get_source.body).exception ?? '') : '',
            'has_concurrency': outputs.get_source.body is defined and (fromJson(outputs.get_source.body).concurrency ?? null) != null,
            'has_errors': outputs.get_source.body is defined and ((fromJson(outputs.get_source.body).errors ?? []) | length) > 0,
            'validation': outputs.validate_source.body is defined ? fromJson(outputs.validate_source.body)[0] : null,
            'deprecated': outputs.validate_source.body is defined ? ({'d': fromJson(outputs.validate_source.body)[0].deprecationPaths ?? [], 's': fromJson(outputs.get_source.body).source}
                          | jq('.s as $s | [.d[] | select((split(".") | last | test("^[A-Za-z]+$") | not) or ($s | contains((split(".") | last) + ":")))]') | first) : [],
            'runs': outputs.recent_runs.body is defined ? (fromJson(outputs.recent_runs.body) | jq('[.results[] | {s: .state.current, t: (.trigger.id // null), d: .state.startDate}]') | first) : [],
            'scheduled_runs': outputs.scheduled_runs.body is defined ? (fromJson(outputs.scheduled_runs.body) | jq('[.results[] | {s: .state.current, t: (.trigger.id // null), d: .state.startDate}]') | first) : []
          } | toJson }}

  - id: assess
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Scores every flow, writes the scorecard CSV, and plans the actions: quarantine candidates (enabled Schedule, last K
      scheduled runs FAILED, counted only after a previous release), expired leases to re-enable, records to close.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    timeout: PT5M
    outputFiles:
      - scorecard_csv
    inputFiles:
      triggers.json: "{{ outputs.list_triggers.uri }}"
    parameters:
      items: "{{ outputs.plan.outputs[0].row.items }}"
      probe: "{{ (outputs.probe.outputs ?? []) | toJson }}"
      records: "{{ outputs.load_state.values.records }}"
      previous: "{{ outputs.load_state.values.status }}"
      targets: "{{ (inputs.targets ?? []) | toJson }}"
      mode: "{{ inputs.mode }}"
      prefix: "{{ inputs.namespace_prefix }}"
      self_ns: "{{ flow.namespace }}"
      self_id: "{{ flow.id }}"
      k: "{{ inputs.quarantine_after_failures }}"
      rate: "{{ inputs.failing_rate_pct }}"
      stuck: "{{ inputs.stuck_after_minutes }}"
      now: "{{ execution.startDate }}"
      execution_id: "{{ execution.id }}"
      key_prefix: "{{ vars.key_prefix }}_q__"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE items AS SELECT json_extract_string(i, '$.namespace') AS namespace, json_extract_string(i, '$.flow_id') AS flow_id FROM (SELECT unnest(from_json(:items, '["JSON"]')) AS i);
      CREATE TABLE p0 AS SELECT json_extract(o, '$.outputs.row') AS r FROM (SELECT unnest(from_json(:probe, '["JSON"]')) AS o);
      CREATE TABLE p AS
      SELECT i.namespace, i.flow_id, coalesce(TRY_CAST(json_extract_string(r, '$.ok') AS BOOLEAN), false) AS ok,
             nullif(json_extract_string(r, '$.exception'), '') AS exception, nullif(json_extract_string(r, '$.validation.constraints'), '') AS constraints,
             coalesce(TRY_CAST(json_extract_string(r, '$.has_concurrency') AS BOOLEAN), false) AS has_concurrency,
             coalesce(TRY_CAST(json_extract_string(r, '$.has_errors') AS BOOLEAN), false) AS has_errors,
             coalesce(from_json(json_extract(r, '$.deprecated'), '["VARCHAR"]'), CAST([] AS VARCHAR[])) AS deprecated,
             list_filter(coalesce(from_json(json_extract(r, '$.validation.infos'), '["VARCHAR"]'), CAST([] AS VARCHAR[])), x -> contains(x, ' is replaced by ')) AS renamed,
             coalesce(from_json(json_extract(r, '$.validation.warnings'), '["VARCHAR"]'), CAST([] AS VARCHAR[])) AS warnings,
             coalesce(json_extract(r, '$.runs'), '[]') AS runs, coalesce(json_extract(r, '$.scheduled_runs'), '[]') AS sruns
      FROM items i LEFT JOIN p0 ON json_extract_string(r, '$.namespace') = i.namespace AND json_extract_string(r, '$.flow_id') = i.flow_id
      QUALIFY row_number() OVER (PARTITION BY i.namespace, i.flow_id ORDER BY length(CAST(r AS VARCHAR)) DESC NULLS LAST) = 1;
      CREATE TABLE runs AS
      SELECT namespace, flow_id, 'all' AS scope, i AS pos, json_extract_string(runs, '$[' || (i - 1) || '].s') AS state,
             json_extract_string(runs, '$[' || (i - 1) || '].t') AS trigger_id, TRY_CAST(json_extract_string(runs, '$[' || (i - 1) || '].d') AS TIMESTAMPTZ) AS started
      FROM p, range(1, CAST(json_array_length(runs) AS BIGINT) + 1) t(i)
      UNION ALL
      SELECT namespace, flow_id, 'scheduled', i, json_extract_string(sruns, '$[' || (i - 1) || '].s'), json_extract_string(sruns, '$[' || (i - 1) || '].t'),
             TRY_CAST(json_extract_string(sruns, '$[' || (i - 1) || '].d') AS TIMESTAMPTZ)
      FROM p, range(1, CAST(json_array_length(sruns) AS BIGINT) + 1) t(i);
      CREATE TABLE tr AS
      SELECT json_extract_string(r, '$.state.namespace') AS namespace, json_extract_string(r, '$.state.flowId') AS flow_id,
             json_extract_string(r, '$.state.triggerId') AS trigger_id, json_extract_string(r, '$.state.kind') AS kind,
             coalesce(TRY_CAST(json_extract_string(r, '$.state.disabled') AS BOOLEAN), false) AS disabled,
             coalesce(TRY_CAST(json_extract_string(r, '$.state.sourceDisabled') AS BOOLEAN), false) AS source_disabled,
             coalesce(TRY_CAST(json_extract_string(r, '$.state.locked') AS BOOLEAN), false) AS locked,
             TRY_CAST(json_extract_string(r, '$.state.nextEvaluationDate') AS TIMESTAMPTZ) AS next_eval,
             TRY_CAST(coalesce(json_extract_string(r, '$.state.lastTriggeredDate'), json_extract_string(r, '$.state.evaluatedAt'), json_extract_string(r, '$.state.updatedAt')) AS TIMESTAMPTZ) AS last_activity
      FROM (SELECT unnest(from_json(json_extract(CAST(content AS JSON), '$.results'), '["JSON"]')) AS r FROM read_text('{{ workingDir }}/triggers.json'))
      WHERE json_extract_string(r, '$.state.namespace') = :prefix OR starts_with(json_extract_string(r, '$.state.namespace'), :prefix || '.');
      CREATE TABLE q AS
      SELECT json_extract_string(e, '$.key') AS record_key, json_extract_string(e, '$.record.namespace') AS namespace, json_extract_string(e, '$.record.flowId') AS flow_id,
             json_extract_string(e, '$.record.triggerId') AS trigger_id, json_extract_string(e, '$.record.state') AS rstate,
             json_extract_string(e, '$.record.since') AS since, TRY_CAST(json_extract_string(e, '$.record.released_at') AS TIMESTAMPTZ) AS released_at,
             coalesce(TRY_CAST(json_extract_string(e, '$.lease_alive') AS BOOLEAN), false) AS lease_alive
      FROM (SELECT unnest(from_json(:records, '["JSON"]')) AS e)
      WHERE json_extract_string(e, '$.record.namespace') = :prefix OR starts_with(json_extract_string(e, '$.record.namespace'), :prefix || '.');
      CREATE TABLE streak AS
      WITH s AS (SELECT r.* FROM runs r LEFT JOIN q USING (namespace, flow_id, trigger_id)
                 WHERE r.scope = 'scheduled' AND r.state IN ('SUCCESS', 'WARNING', 'FAILED') AND (q.released_at IS NULL OR r.started > q.released_at))
      SELECT s.namespace, s.flow_id, s.trigger_id, count(*) FILTER (WHERE s.state = 'FAILED' AND s.pos < coalesce(f.first_ok, 1000000)) AS consecutive_failures
      FROM s LEFT JOIN (SELECT namespace, flow_id, trigger_id, min(pos) AS first_ok FROM s WHERE state <> 'FAILED' GROUP BY ALL) f
           ON f.namespace = s.namespace AND f.flow_id = s.flow_id AND f.trigger_id = s.trigger_id
      GROUP BY s.namespace, s.flow_id, s.trigger_id;
      CREATE TABLE te AS
      SELECT t.*, NOT t.disabled AND NOT t.source_disabled AS enabled, coalesce(s.consecutive_failures, 0) AS consecutive_failures,
             q.record_key, q.rstate, q.lease_alive,
             NOT t.disabled AND NOT t.source_disabled AND ((t.locked AND t.last_activity < CAST(:now AS TIMESTAMPTZ) - to_minutes(CAST(:stuck AS INTEGER)))
               OR (NOT t.locked AND t.next_eval < CAST(:now AS TIMESTAMPTZ) - to_minutes(CAST(:stuck AS INTEGER)))) AS stuck
      FROM tr t LEFT JOIN streak s USING (namespace, flow_id, trigger_id) LEFT JOIN q USING (namespace, flow_id, trigger_id);
      CREATE TABLE cand AS
      SELECT te.* FROM te JOIN p USING (namespace, flow_id)
      WHERE :mode IN ('audit', 'replay') AND p.ok AND te.kind = 'SCHEDULE' AND te.enabled AND coalesce(te.rstate, '') <> 'quarantined'
        AND te.consecutive_failures >= CAST(:k AS INTEGER) AND NOT (te.namespace = :self_ns AND te.flow_id = :self_id);
      CREATE TABLE actions AS
      SELECT 'quarantine' AS action, namespace, flow_id, trigger_id, :key_prefix || namespace || '__' || flow_id || '__' || trigger_id AS record_key,
             consecutive_failures || ' failed scheduled runs in a row' AS reason, consecutive_failures FROM cand
      UNION ALL
      SELECT CASE WHEN t.trigger_id IS NULL THEN 'forget' WHEN NOT t.disabled THEN 'close' WHEN :mode = 'renew' THEN 'renew' ELSE 'release' END,
             q.namespace, q.flow_id, q.trigger_id, q.record_key,
             CASE WHEN t.trigger_id IS NULL THEN 'flow or trigger no longer exists' WHEN NOT t.disabled THEN 'trigger is enabled again (re-enabled by someone, or the disable failed)'
                  WHEN :mode = 'release' THEN 'manual release' WHEN :mode = 'renew' THEN 'lease renewed' ELSE 'quarantine lease expired' END, NULL
      FROM q LEFT JOIN tr t USING (namespace, flow_id, trigger_id)
      WHERE q.rstate = 'quarantined' AND (t.trigger_id IS NULL OR NOT t.disabled OR (:mode IN ('audit', 'replay') AND NOT q.lease_alive)
         OR (:mode IN ('release', 'renew') AND q.namespace || '/' || q.flow_id || '/' || q.trigger_id IN (SELECT unnest(from_json(:targets, '["VARCHAR"]')))));
      CREATE TABLE tf AS
      SELECT namespace, flow_id, string_agg(trigger_id, ',' ORDER BY trigger_id) FILTER (WHERE kind = 'SCHEDULE') AS schedules,
             bool_or(kind = 'SCHEDULE' AND enabled) AS scheduled, max(consecutive_failures) AS streak,
             string_agg(trigger_id, ',') FILTER (WHERE stuck) AS stuck_triggers,
             string_agg(trigger_id, ',') FILTER (WHERE disabled AND rstate = 'quarantined') AS quarantined,
             string_agg(trigger_id, ',') FILTER (WHERE disabled AND coalesce(rstate, '') <> 'quarantined') AS disabled_by_others
      FROM te GROUP BY namespace, flow_id;
      CREATE TABLE rt AS SELECT namespace, flow_id, count(*) FILTER (WHERE state IN ('SUCCESS', 'WARNING', 'FAILED')) AS runs_checked,
             count(*) FILTER (WHERE state = 'FAILED') AS runs_failed FROM runs WHERE scope = 'all' GROUP BY ALL;
      CREATE TABLE cf AS SELECT namespace, flow_id, string_agg(trigger_id, ',' ORDER BY trigger_id) AS candidate_triggers FROM cand GROUP BY ALL;
      CREATE TABLE sc0 AS
      SELECT p.namespace, p.flow_id, p.ok, coalesce(p.constraints, p.exception) AS invalid, p.deprecated, p.renamed, p.warnings,
             coalesce(tf.schedules, '') AS schedules, coalesce(tf.scheduled, false) AS scheduled, coalesce(tf.streak, 0) AS streak,
             tf.stuck_triggers, tf.quarantined, tf.disabled_by_others, cf.candidate_triggers,
             coalesce(rt.runs_checked, 0) AS runs_checked, coalesce(rt.runs_failed, 0) AS runs_failed,
             concat_ws(', ', CASE WHEN NOT p.ok THEN 'flow could not be read, see the probe iteration logs' END,
                             CASE WHEN p.ok AND coalesce(tf.scheduled, false) AND NOT p.has_concurrency THEN 'schedule without concurrency limit' END,
                             CASE WHEN p.ok AND coalesce(tf.scheduled, false) AND NOT p.has_errors THEN 'schedule without errors handler' END) AS risky
      FROM p LEFT JOIN tf USING (namespace, flow_id) LEFT JOIN cf USING (namespace, flow_id) LEFT JOIN rt USING (namespace, flow_id);
      CREATE TABLE sc AS
      SELECT *, CASE WHEN runs_checked = 0 THEN NULL ELSE round(100.0 * runs_failed / runs_checked, 1) END AS failure_rate_pct,
             CASE WHEN NOT ok THEN 'PROBE_FAILED' WHEN invalid IS NOT NULL THEN 'INVALID' WHEN quarantined IS NOT NULL THEN 'QUARANTINED'
                  WHEN candidate_triggers IS NOT NULL THEN 'QUARANTINE_CANDIDATE' WHEN stuck_triggers IS NOT NULL THEN 'STUCK_TRIGGER'
                  WHEN runs_checked > 0 AND 100.0 * runs_failed / runs_checked >= CAST(:rate AS INTEGER) THEN 'FAILING'
                  WHEN len(deprecated) > 0 OR len(renamed) > 0 THEN 'DEPRECATED' WHEN len(warnings) > 0 THEN 'WARNING'
                  WHEN risky <> '' THEN 'RISKY_CONFIG' ELSE 'HEALTHY' END AS status,
             greatest(0, 100 - CASE WHEN invalid IS NOT NULL OR NOT ok THEN 60 ELSE 0 END - CASE WHEN quarantined IS NOT NULL OR candidate_triggers IS NOT NULL THEN 40 ELSE 0 END
                  - CASE WHEN stuck_triggers IS NOT NULL THEN 30 ELSE 0 END - CAST(CASE WHEN runs_checked = 0 THEN 0 ELSE 30.0 * runs_failed / runs_checked END AS INTEGER)
                  - CASE WHEN len(deprecated) > 0 THEN 15 ELSE 0 END - CASE WHEN len(renamed) > 0 THEN 5 ELSE 0 END
                  - CASE WHEN len(warnings) > 0 THEN 10 ELSE 0 END - 5 * (CASE WHEN risky = '' THEN 0 ELSE len(string_split(risky, ', ')) END)) AS health_score
      FROM sc0;
      CREATE TABLE prev AS SELECT json_extract_string(e, '$.flow') AS flow, json_extract_string(e, '$.status') AS status FROM (SELECT unnest(from_json(:previous, '["JSON"]')) AS e);
      CREATE TABLE baseline AS SELECT count(*) = 0 AS is_baseline FROM prev
      WHERE split_part(flow, '/', 1) = :prefix OR starts_with(split_part(flow, '/', 1), :prefix || '.');
      CREATE TABLE card AS
      SELECT :execution_id AS run_execution_id, s.namespace, s.flow_id, s.status, coalesce(pv.status, 'NEW') AS previous_status,
             pv.status IS DISTINCT FROM s.status AS changed, s.health_score, s.schedules AS schedule_triggers, s.runs_checked, s.failure_rate_pct,
             s.streak AS consecutive_failures, coalesce(s.invalid, '') AS invalid, array_to_string(s.deprecated, ' ') AS deprecated_paths,
             array_to_string(s.renamed, '; ') AS renamed_types, array_to_string(s.warnings, '; ') AS warnings, coalesce(s.stuck_triggers, '') AS stuck_triggers,
             s.risky AS risky_config, coalesce(s.quarantined, '') AS quarantined_triggers, coalesce(s.candidate_triggers, '') AS candidate_triggers,
             coalesce(s.disabled_by_others, '') AS disabled_outside_audit
      FROM sc s LEFT JOIN prev pv ON pv.flow = s.namespace || '/' || s.flow_id ORDER BY s.health_score, s.namespace, s.flow_id;
      COPY card TO '{{ outputFiles.scorecard_csv }}' (HEADER, DELIMITER ',');
      CREATE TABLE chg AS
      SELECT namespace || '/' || flow_id AS flow, previous_status AS was, status AS now_status, health_score AS score,
             concat_ws('; ', nullif(invalid, ''), nullif(quarantined_triggers, '') || ' quarantined by this flow', nullif(candidate_triggers, '') || ' failed ' || consecutive_failures || ' scheduled runs in a row',
               nullif(stuck_triggers, '') || ' stuck', CASE WHEN failure_rate_pct >= CAST(:rate AS INTEGER) THEN failure_rate_pct || ' percent of runs failed' END,
               nullif(deprecated_paths, '') || ' deprecated', nullif(renamed_types, ''), nullif(warnings, ''), nullif(risky_config, '')) AS detail
      FROM card WHERE changed AND ((SELECT NOT is_baseline FROM baseline) OR status <> 'HEALTHY')
      UNION ALL SELECT flow, status, 'REMOVED', NULL, 'flow no longer exists' FROM prev
      WHERE :mode = 'audit' AND (split_part(flow, '/', 1) = :prefix OR starts_with(split_part(flow, '/', 1), :prefix || '.')) AND flow NOT IN (SELECT namespace || '/' || flow_id FROM card);
      SELECT (SELECT count(*) FROM card) AS flows_audited,
             (SELECT coalesce(string_agg(status || '=' || n, ' ' ORDER BY status), '') FROM (SELECT status, count(*) AS n FROM card GROUP BY status)) AS by_status,
             (SELECT is_baseline FROM baseline) AS is_baseline,
             coalesce((SELECT CAST(to_json(list(json_object('flow', flow, 'from', was, 'to', now_status, 'score', score, 'detail', detail) ORDER BY score NULLS FIRST)) AS VARCHAR) FROM chg), '[]') AS changes,
             coalesce((SELECT CAST(to_json(list(json_object('flow', flow, 'status', status))) AS VARCHAR) FROM (
                 SELECT flow, status FROM prev WHERE NOT (split_part(flow, '/', 1) = :prefix OR starts_with(split_part(flow, '/', 1), :prefix || '.'))
                    OR (:mode <> 'audit' AND flow NOT IN (SELECT namespace || '/' || flow_id FROM card))
                 UNION ALL SELECT namespace || '/' || flow_id, status FROM card WHERE status <> 'PROBE_FAILED'
                 UNION ALL SELECT pv.flow, pv.status FROM prev pv JOIN card c ON pv.flow = c.namespace || '/' || c.flow_id WHERE c.status = 'PROBE_FAILED')), '[]') AS status_map,
             coalesce((SELECT CAST(to_json(list(namespace || '/' || flow_id)) AS VARCHAR) FROM card WHERE status = 'PROBE_FAILED'), '[]') AS probe_failed,
             coalesce((SELECT CAST(to_json(list(json_object('action', action, 'namespace', namespace, 'flow_id', flow_id, 'trigger_id', trigger_id,
                 'record_key', record_key, 'reason', reason, 'consecutive_failures', consecutive_failures) ORDER BY action, namespace, flow_id)) AS VARCHAR) FROM actions WHERE action = 'quarantine'), '[]') AS candidates,
             coalesce((SELECT CAST(to_json(list(json_object('action', action, 'namespace', namespace, 'flow_id', flow_id, 'trigger_id', trigger_id,
                 'record_key', record_key, 'reason', reason) ORDER BY action, namespace, flow_id)) AS VARCHAR) FROM actions WHERE action <> 'quarantine'), '[]') AS lifecycle;

  - id: log_assessment
    type: io.kestra.plugin.core.log.Log
    message: |
      {{ inputs.dry_run ? 'DRY RUN' : 'LIVE' }} {{ inputs.mode }} of {{ inputs.namespace_prefix }}: {{ outputs.assess.outputs[0].row.flows_audited }} flows ({{ outputs.assess.outputs[0].row.by_status }}){{ outputs.assess.outputs[0].row.is_baseline ? ', first run (baseline)' : '' }}.
      Status changes: {{ fromJson(outputs.assess.outputs[0].row.changes) | length }}
      {% for c in fromJson(outputs.assess.outputs[0].row.changes) %}- {{ c.flow }}: {{ c.from }} -> {{ c.to }} (score {{ c.score ?? 'n/a' }}) {{ c.detail }}
      {% endfor %}Quarantine candidates: {% for c in fromJson(outputs.assess.outputs[0].row.candidates) %}{{ c.namespace }}/{{ c.flow_id }}/{{ c.trigger_id }} ({{ c.reason }}) {% else %}none{% endfor %}
      Lease and record actions: {% for c in fromJson(outputs.assess.outputs[0].row.lifecycle) %}{{ c.action }} {{ c.namespace }}/{{ c.flow_id }}/{{ c.trigger_id }} ({{ c.reason }}) {% else %}none{% endfor %}

  - id: save_status
    type: io.kestra.plugin.core.kv.Set
    description: Status per flow, so the next run reports only changes. A flow that could not be read keeps its previous status.
    runIf: "{{ inputs.mode == 'audit' or inputs.mode == 'replay' }}"
    key: "{{ vars.key_prefix }}_status"
    kvType: JSON
    value: "{{ outputs.assess.outputs[0].row.status_map }}"

  - id: lifecycle
    type: io.kestra.plugin.core.flow.If
    description: Re-enable expired or released quarantines, renew leases, close records. A destructive Loop sits inside an If, never behind a Loop runIf.
    condition: "{{ not inputs.dry_run and (fromJson(outputs.assess.outputs[0].row.lifecycle) | length) > 0 }}"
    then:
      - id: apply_lifecycle
        type: io.kestra.plugin.core.flow.Loop
        values: "{{ outputs.assess.outputs[0].row.lifecycle }}"
        concurrencyLimit: 1
        transmitFailed: false
        tasks:
          - id: lifecycle_scope_guard
            type: io.kestra.plugin.core.flow.If
            description: Last check before touching a trigger, independent of the plan.
            condition: "{{ not ({'n': fromJson(item.value).namespace ?? '', 'p': inputs.namespace_prefix} | jq('.p as $p | .n | . == $p or startswith($p + \".\")') | first) }}"
            then:
              - id: refuse_lifecycle
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "Refusing to change {{ fromJson(item.value).namespace }}/{{ fromJson(item.value).flow_id }}: outside {{ inputs.namespace_prefix }}."
          - id: enable_trigger
            type: io.kestra.plugin.core.http.Request
            description: "`recoverMissedSchedules: false`, so a trigger coming back from a two-day quarantine does not replay every missed slot at once."
            runIf: "{{ fromJson(item.value).action == 'release' }}"
            method: PUT
            uri: "{{ inputs.kestra_api_url | trim }}/api/v1/{{ vars.tenant }}/triggers/set-disabled"
            contentType: application/json
            body: "{{ {'namespace': fromJson(item.value).namespace, 'flowId': fromJson(item.value).flow_id, 'triggerId': fromJson(item.value).trigger_id, 'disabled': false, 'recoverMissedSchedules': false} | toJson }}"
            options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
            timeout: PT30S
            retry: {type: exponential, interval: PT2S, maxInterval: PT20S, maxAttempts: 3}
          - id: renew_lease
            type: io.kestra.plugin.core.kv.Set
            runIf: "{{ fromJson(item.value).action == 'renew' }}"
            key: "{{ fromJson(item.value).record_key | replace({'_q__': '_lease__'}) }}"
            kvType: JSON
            value: "{{ {'renewed_at': execution.startDate, 'execution_id': execution.id} | toJson }}"
            ttl: "{{ inputs.quarantine_ttl }}"
          - id: mark_released
            type: io.kestra.plugin.core.kv.Set
            description: The record stays for 30 days as a probation marker; failures from before the release no longer count.
            runIf: "{{ fromJson(item.value).action == 'release' or fromJson(item.value).action == 'close' }}"
            key: "{{ fromJson(item.value).record_key }}"
            kvType: JSON
            value: "{{ {'namespace': fromJson(item.value).namespace, 'flowId': fromJson(item.value).flow_id, 'triggerId': fromJson(item.value).trigger_id, 'state': 'released', 'released_at': execution.startDate, 'reason': fromJson(item.value).reason, 'execution_id': execution.id} | toJson }}"
            ttl: "{{ vars.probation_ttl }}"
          - id: forget_record
            type: io.kestra.plugin.core.kv.Delete
            runIf: "{{ fromJson(item.value).action == 'forget' }}"
            key: "{{ fromJson(item.value).record_key }}"
            errorOnMissing: false
          - id: drop_lease
            type: io.kestra.plugin.core.kv.Delete
            runIf: "{{ fromJson(item.value).action != 'renew' }}"
            key: "{{ fromJson(item.value).record_key | replace({'_q__': '_lease__'}) }}"
            errorOnMissing: false
          - id: lifecycle_done
            type: io.kestra.plugin.core.output.OutputValues
            description: Only reached when every step above succeeded; a failed step leaves it undefined and the row ok false.
            values:
              trigger_disabled_after: "{{ outputs.enable_trigger.body is defined ? fromJson(outputs.enable_trigger.body).disabled : 'unchanged' }}"
        outputs:
          - id: row
            type: JSON
            value: "{{ fromJson(item.value) | merge({'ok': outputs.lifecycle_done.values is defined and (fromJson(item.value).action != 'release' or (outputs.lifecycle_done.values.trigger_disabled_after ~ '') == 'false')}) | toJson }}"

  - id: quarantine
    type: io.kestra.plugin.core.flow.If
    condition: "{{ not inputs.dry_run and (fromJson(outputs.assess.outputs[0].row.candidates) | length) > 0 }}"
    then:
      - id: approval_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ not inputs.auto_quarantine }}"
        then:
          - id: ask_approval
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Tells the approver a decision is waiting. allowFailure, the candidates are also in log_assessment.
            allowFailure: true
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: "Approval needed within 45 minutes: disable for {{ inputs.quarantine_ttl }} {% for c in fromJson(outputs.assess.outputs[0].row.candidates) %}{{ c.namespace }}/{{ c.flow_id }}/{{ c.trigger_id }} ({{ c.reason }}) {% endfor %}{{ kestra.url ?? inputs.kestra_api_url }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
          - id: approve_quarantine
            type: io.kestra.plugin.core.flow.Pause
            description: "The candidates are listed in log_assessment. Without an answer in 45 minutes the run continues (`behavior: WARN`) with nothing disabled, before the next hourly audit."
            pauseDuration: PT45M
            behavior: WARN
            onResume:
              - id: approve
                type: BOOL
                displayName: Disable the Schedule triggers listed by log_assessment for the quarantine ttl?
                defaults: false
              - id: reason
                type: STRING
                defaults: ""
      - id: decision
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_quarantine or (outputs.approve_quarantine.onResume.approve ?? false) }}"
        then:
          - id: quarantine_triggers
            type: io.kestra.plugin.core.flow.Loop
            values: "{{ outputs.assess.outputs[0].row.candidates }}"
            concurrencyLimit: 1
            transmitFailed: false
            tasks:
              - id: quarantine_scope_guard
                type: io.kestra.plugin.core.flow.If
                condition: "{{ not ({'n': fromJson(item.value).namespace ?? '', 'p': inputs.namespace_prefix} | jq('.p as $p | .n | . == $p or startswith($p + \".\")') | first) or (fromJson(item.value).namespace == flow.namespace and fromJson(item.value).flow_id == flow.id) }}"
                then:
                  - id: refuse_quarantine
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: "Refusing to quarantine {{ fromJson(item.value).namespace }}/{{ fromJson(item.value).flow_id }}: outside {{ inputs.namespace_prefix }} or this flow itself."
              - id: write_record
                type: io.kestra.plugin.core.kv.Set
                description: Written before the trigger is disabled. If the disable then fails, the next run sees an enabled trigger and closes the record, so no trigger is ever disabled without a record.
                key: "{{ fromJson(item.value).record_key }}"
                kvType: JSON
                value: "{{ {'namespace': fromJson(item.value).namespace, 'flowId': fromJson(item.value).flow_id, 'triggerId': fromJson(item.value).trigger_id, 'state': 'quarantined', 'since': execution.startDate, 'reason': fromJson(item.value).reason, 'approved_by': inputs.auto_quarantine ? 'auto_quarantine' : 'approval: ' ~ (outputs.approve_quarantine.onResume.reason ?? ''), 'execution_id': execution.id} | toJson }}"
              - id: disable_trigger
                type: io.kestra.plugin.core.http.Request
                method: PUT
                uri: "{{ inputs.kestra_api_url | trim }}/api/v1/{{ vars.tenant }}/triggers/set-disabled"
                contentType: application/json
                body: "{{ {'namespace': fromJson(item.value).namespace, 'flowId': fromJson(item.value).flow_id, 'triggerId': fromJson(item.value).trigger_id, 'disabled': true} | toJson }}"
                options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
                timeout: PT30S
                retry: {type: exponential, interval: PT2S, maxInterval: PT20S, maxAttempts: 3}
              - id: write_lease
                type: io.kestra.plugin.core.kv.Set
                description: The lease is the only key with the quarantine ttl. When it expires, the next audit re-enables the trigger.
                key: "{{ fromJson(item.value).record_key | replace({'_q__': '_lease__'}) }}"
                kvType: JSON
                value: "{{ {'since': execution.startDate, 'ttl': inputs.quarantine_ttl, 'execution_id': execution.id} | toJson }}"
                ttl: "{{ inputs.quarantine_ttl }}"
              - id: quarantine_done
                type: io.kestra.plugin.core.output.OutputValues
                values:
                  trigger_disabled_after: "{{ fromJson(outputs.disable_trigger.body).disabled }}"
            outputs:
              - id: row
                type: JSON
                value: "{{ fromJson(item.value) | merge({'ok': outputs.quarantine_done.values is defined and (outputs.quarantine_done.values.trigger_disabled_after ~ '') == 'true'}) | toJson }}"
        else:
          - id: not_approved
            type: io.kestra.plugin.core.log.Log
            level: WARN
            message: "Quarantine not approved{{ (outputs.approve_quarantine.onResume.reason ?? '') != '' ? ': ' ~ outputs.approve_quarantine.onResume.reason : ' (rejected or no answer within 45 minutes)' }}. No trigger was disabled; the candidates are proposed again on the next run."

  - id: outcome
    type: io.kestra.plugin.core.output.OutputValues
    description: Flows to re-check with mode replay (unreadable flows, flows whose action failed).
    values:
      failed: "{{ fromJson(outputs.assess.outputs[0].row.probe_failed) | merge(((outputs.apply_lifecycle.outputs ?? []) | merge(outputs.quarantine_triggers.outputs ?? [])) | jq('[.[].outputs.row | select(.ok != true) | .namespace + \"/\" + .flow_id]') | first) | jq('unique') | first | toJson }}"

  - id: dead_letter
    type: io.kestra.plugin.core.flow.If
    description: Kept for 7 days (KV `ttl`). A clean audit clears it. release and renew runs leave it alone.
    condition: "{{ (fromJson(outputs.outcome.values.failed) | length) > 0 }}"
    then:
      - id: remember_failed
        type: io.kestra.plugin.core.kv.Set
        runIf: "{{ inputs.mode == 'audit' or inputs.mode == 'replay' }}"
        key: "{{ vars.key_prefix }}_dead_letter"
        kvType: JSON
        value: "{{ outputs.outcome.values.failed }}"
        ttl: P7D
      - id: report_partial_failure
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Audit finished for the other flows but failed for {{ fromJson(outputs.outcome.values.failed) | join(', ') }}. See the scorecard, fix the cause, then run with mode replay."
    else:
      - id: clear_failed
        type: io.kestra.plugin.core.kv.Delete
        runIf: "{{ inputs.mode == 'audit' or inputs.mode == 'replay' }}"
        key: "{{ vars.key_prefix }}_dead_letter"
        errorOnMissing: false

errors:
  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    description: The last error log is the one that ended the run; earlier ones can come from allowFailure tasks such as a Slack call without its secret.
    message: "{% set e = (errorLogs() | length) > 0 ? (errorLogs() | last) : {} %}Flow health audit failed in {{ e.taskId ?? 'the execution itself (SLA or Pause)' }}: {{ e.message ?? 'no error was logged' }} {{ kestra.url ?? inputs.kestra_api_url }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: allowFailure so a missing `SLACK_WEBHOOK_URL` does not hide the original error; the same text is in the ERROR log above.
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: "{% set e = (errorLogs() | length) > 0 ? (errorLogs() | last) : {} %}:rotating_light: Kestra flow health audit of {{ inputs.namespace_prefix }} failed in `{{ e.taskId ?? 'execution' }}`: {{ e.message ?? 'no error was logged' }} {{ kestra.url ?? inputs.kestra_api_url }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"

finally:
  - id: write_action_log
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Always runs, also after a rejection or a failure, so every run leaves an action log CSV, empty when nothing was planned.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    timeout: PT2M
    outputFiles:
      - actions_csv
    parameters:
      planned: "{{ ((fromJson(outputs.assess.outputs[0].row.candidates ?? '[]')) | merge(fromJson(outputs.assess.outputs[0].row.lifecycle ?? '[]'))) | toJson }}"
      done: "{{ ((outputs.quarantine_triggers.outputs ?? []) | merge(outputs.apply_lifecycle.outputs ?? [])) | toJson }}"
      dry_run: "{{ inputs.dry_run }}"
      decision: "{{ inputs.auto_quarantine ? 'auto' : ((outputs.approve_quarantine.onResume.approve ?? null) == null ? 'none' : (outputs.approve_quarantine.onResume.approve ? 'approved' : 'rejected')) }}"
      execution_id: "{{ execution.id }}"
    sql: |
      CREATE TABLE pl AS SELECT e FROM (SELECT unnest(from_json(:planned, '["JSON"]')) AS e);
      CREATE TABLE dn AS SELECT json_extract(o, '$.outputs.row') AS r FROM (SELECT unnest(from_json(:done, '["JSON"]')) AS o)
      QUALIFY row_number() OVER (PARTITION BY json_extract_string(r, '$.record_key'), json_extract_string(r, '$.action') ORDER BY json_extract_string(r, '$.ok') DESC) = 1;
      CREATE TABLE log AS
      SELECT :execution_id AS run_execution_id, json_extract_string(e, '$.action') AS action, json_extract_string(e, '$.namespace') AS namespace,
             json_extract_string(e, '$.flow_id') AS flow_id, json_extract_string(e, '$.trigger_id') AS trigger_id, json_extract_string(e, '$.reason') AS reason,
             CASE WHEN CAST(:dry_run AS BOOLEAN) THEN 'dry_run'
                  WHEN json_extract_string(e, '$.action') = 'quarantine' AND :decision IN ('none', 'rejected') AND d.r IS NULL THEN 'not_approved_' || :decision
                  WHEN d.r IS NULL THEN 'not_reached'
                  WHEN coalesce(TRY_CAST(json_extract_string(d.r, '$.ok') AS BOOLEAN), false) THEN 'applied' ELSE 'failed' END AS result
      FROM pl LEFT JOIN dn d ON json_extract_string(d.r, '$.record_key') = json_extract_string(e, '$.record_key') AND json_extract_string(d.r, '$.action') = json_extract_string(e, '$.action')
      ORDER BY action, namespace, flow_id;
      COPY log TO '{{ outputFiles.actions_csv }}' (HEADER, DELIMITER ',');
      SELECT count(*) AS planned, count(*) FILTER (WHERE result = 'applied') AS applied, count(*) FILTER (WHERE result = 'failed') AS failed,
             coalesce(string_agg(action || ' ' || namespace || '/' || flow_id || '/' || trigger_id || ' ' || result, '; '), '') AS detail FROM log;

  - id: log_actions
    type: io.kestra.plugin.core.log.Log
    message: "Actions ({{ inputs.dry_run ? 'dry run' : 'live' }}): {{ outputs.write_action_log.outputs[0].row | toJson }}"

afterExecution:
  - id: notify_changes
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: |
      One message per run, only when a status changed, a trigger was changed (or failed to change) or the SLA was breached; quiet runs send nothing.
      Runs once the final state is known. On 2.0.5 an SLA breach skips `finally`, so this is the hook that reports it.
    runIf: "{{ (labels.flow_health_sla ?? '') == 'breached' or (fromJson(outputs.assess.outputs[0].row.changes ?? '[]') | length) > 0 or ((outputs.write_action_log.outputs[0].row.applied ?? 0) + (outputs.write_action_log.outputs[0].row.failed ?? 0)) > 0 }}"
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      Kestra flow health {{ inputs.dry_run ? 'dry run' : 'audit' }} of {{ inputs.namespace_prefix }} ended {{ execution.state }}{{ (labels.flow_health_sla ?? '') == 'breached' ? ' because the 2-hour SLA was breached (no action log was written)' : '' }}.
      {% for c in fromJson(outputs.assess.outputs[0].row.changes ?? '[]') %}- {{ c.flow }}: {{ c.from }} -> {{ c.to }} {{ c.detail }}
      {% endfor %}Actions: {{ outputs.write_action_log.outputs[0].row.detail ?? 'none' }}
      {{ kestra.url ?? inputs.kestra_api_url }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}

outputs:
  - id: scorecard_csv
    type: FILE
    value: "{{ outputs.assess.outputFiles.scorecard_csv }}"
  - id: actions_csv
    type: FILE
    value: "{{ outputs.write_action_log.outputFiles.actions_csv }}"
  - id: summary
    type: JSON
    value: "{{ {'by_status': outputs.assess.outputs[0].row.by_status, 'changes': fromJson(outputs.assess.outputs[0].row.changes), 'actions': outputs.write_action_log.outputs[0].row} | toJson }}"

extend:
  title: Kestra flow health audit with scorecard and trigger quarantine leases
  metaTitle: Kestra Flow Health Audit and Schedule Trigger Quarantine | Kestra
  shortDescription: Audit every flow in a namespace through the Kestra API (validation, deprecations, failure streaks, stuck triggers, risky config), write a scorecard CSV, and disable a failing Schedule for a KV ttl lease that re-enables it on its own.
  metaDescription: Audit Kestra flows for invalid, deprecated, failing or stuck schedules and quarantine a failing trigger on an expiring KV lease, with approval and dry run.
  description: |
    A Schedule that fails every run still costs something: a page per run, a log full of identical stack traces, and a credential or rate limit hammered until someone notices. This flow audits every flow under a namespace prefix through the Kestra API of its own instance, writes a health scorecard, reports only changes, and takes one action: it disables a Schedule trigger whose last K scheduled runs failed, for a limited time. The quarantine is a lease (a KV key with a `ttl`); when it expires, the next audit switches the trigger back on. Everything defaults to a dry run, and nothing is simulated.

    ## How it works

    1. An hourly `Schedule` or a manual run starts the flow. Flow `checks` refuse wildcard prefixes, release or renew without targets, and targets outside the prefix.
    2. `quarantine_records` and `load_state` read the KV state: last statuses, the dead-letter list, and one record per quarantined trigger with whether its lease still exists.
    3. `list_flows` and `list_triggers` read every flow and trigger state in scope in two requests. `plan` (DuckDB) re-checks the scope, leaves this flow out, and fails before any change on a truncated list or a release target this flow did not disable.
    4. `probe` runs one isolated iteration per flow. Inside, the `probe_flow` Dag reads the stored source, sends it to `/flows/validate` (invalid, deprecated, renamed, warnings), and in parallel reads the last runs and the last runs started by the flow's Schedule triggers.
    5. `assess` (DuckDB) scores each flow, writes the scorecard CSV, compares statuses with the previous run, and plans the actions. `save_status` stores the new statuses.
    6. `lifecycle` re-enables triggers whose lease expired (or the `release` targets) with `recoverMissedSchedules: false`, renews leases, and closes records for triggers that someone re-enabled or deleted.
    7. `quarantine` asks for approval in a `Pause` (or not, with `auto_quarantine`), then per trigger writes the record, disables the trigger through `/triggers/set-disabled`, and writes the lease with the `quarantine_ttl`.
    8. Unreadable flows and failed actions go to a dead-letter list for `mode: replay`. `finally` writes the action log CSV, and `afterExecution` sends one message when something changed.

    ## Statuses and edge cases

    Worst first: `PROBE_FAILED`, `INVALID` (validation constraints, or a stored flow whose plugin is gone), `QUARANTINED`, `QUARANTINE_CANDIDATE`, `STUCK_TRIGGER` (enabled but locked, or past its next evaluation, for longer than `stuck_after_minutes`), `FAILING` (failure rate over the last runs), `DEPRECATED` (deprecated task types or properties, renamed types), `WARNING` (for example a Subflow whose child was deleted), `RISKY_CONFIG` (an enabled Schedule without `concurrency` or without `errors`) and `HEALTHY`. Findings lower a 0-100 score.

    - Manual test runs never count toward a quarantine: the streak only reads runs started by the Schedule trigger.
    - After a release, failures from before the release no longer count, so a trigger is not disabled again before it had K new runs.
    - A trigger that a person disabled is reported but never re-enabled; release only accepts triggers this flow disabled.
    - A trigger that someone re-enabled during the quarantine is left on and its record closed.
    - Deprecated properties a plugin reports for its own defaults (DuckDB `connectionPooling`) count only if they appear in the source; otherwise every flow with a DuckDB task would be flagged.

    ## What this blueprint teaches

    - **KV `ttl` as a lease** (`write_lease`, `renew_lease`): an expiring key is a timer that survives restarts. An expired key cannot tell you it existed, so the lease is paired with a durable record (`write_record`) listed by `GetKeys`; the record then stays 30 days as a probation marker (`mark_released`).
    - **Flow `checks`** (`checks`): reject unsafe input before an execution exists. An empty `namespace_prefix` falls back to its default, so empty never means every namespace.
    - **`Dag`** (`probe_flow`): the validation depends on the source, the two execution reads do not, so they run alongside.
    - **Loop isolation** (`probe`, `apply_lifecycle`, `quarantine_triggers`): `transmitFailed: false` and Loop `outputs` give one row per flow or trigger, failed ones included.
    - **Ordered writes for safe partial failure** (`write_record`, `disable_trigger`, `write_lease`): if the disable fails, the next run sees an enabled trigger and closes the record; if the lease write fails, the trigger is re-enabled early. A trigger is never left disabled without a record.
    - **`finally`** (`write_action_log`): the action log CSV is written after a success, a rejection or a failure.
    - **`errors` with `errorLogs()`** (`log_failure`, `alert_failure`): the last error, its task id and the execution link.
    - **`sla` and `afterExecution`** (`max_runtime`, `notify_changes`): on 2.0.5 an SLA breach ends the run at once and skips `finally`, so `afterExecution` reports it (label `flow_health_sla: breached`).
    - **`concurrency`** (`limit: 1`, `QUEUE`): a run started while another waits for approval is queued, not run in parallel.

    A self-calling `Subflow` was considered for the per-flow probe and dropped: 2.0.5 refuses it at save time ("Recursive call to flow").

    ## What you get

    - A scorecard CSV (`scorecard_csv`): status, previous status, score, failure rate, streak, findings and quarantine state per flow.
    - An action log CSV (`actions_csv`) with every planned action and its result (`applied`, `failed`, `dry_run`, ...).
    - Quiet runs: a message only when a status changed or a trigger was changed. The first run is a baseline that lists only unhealthy flows.
    - Idempotent runs: a second run changes nothing.

    ## Who it's for

    - Platform teams and on-call operators running Kestra for many teams.

    ## Why orchestrate this with Kestra

    The quarantine is a declared approval plus an expiring KV key instead of a forgotten manual toggle, and retries, timeouts, replay and the action log are part of the flow.

    ## Prerequisites

    - Kestra 2.0 with the DuckDB and Slack plugins, and an API user that can read flows, executions and triggers and update triggers in the audited namespaces.
    - `kestra_api_url` reachable from the worker (`http://localhost:8080` on a single-node install).

    ### Secrets

    - `KESTRA_API_USERNAME` and `KESTRA_API_PASSWORD`: basic-auth user for the API calls (required).
    - `SLACK_WEBHOOK_URL`: approval requests, change digests and failure alerts (optional; every message is also logged).

    ## Quick start

    1. Add the secrets and set `namespace_prefix` to one team's namespace.
    2. Run with the defaults and read `log_assessment` and the scorecard CSV.
    3. Run with `dry_run: false`, approve the Pause, and check the action log.
    4. Add `inputs: {dry_run: false}` to the `hourly` trigger. Use `mode: release` or `renew` with `targets` to end or extend a quarantine.

    ## How to extend

    - Add more checks to `assess`, such as HTTP tasks without `retry`.
    - Open a ticket per new quarantine instead of a Slack message.

    ## Links

    - [Kestra API reference](https://kestra.io/docs/api-reference)
    - [Schedule trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.schedule), [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set), [Dag](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.dag), [Pause](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
    - [SLA](https://kestra.io/docs/workflow-components/sla), [Concurrency](https://kestra.io/docs/workflow-components/concurrency)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Day 2 Operations
    - Approval Gates
    - Failure Alerting Mechanics
  ee: false
  demo: false
