id: cloudflare-dns-dangling-cname-takeover-guard
namespace: company.security

description: Audits Cloudflare DNS zones to detect dangling CNAME records pointing to decommissioned third-party cloud targets, preventing subdomain takeover vulnerabilities.

concurrency:
  limit: 1

inputs:
  - id: cloudflare_zone_id
    type: STRING
    defaults: 023e105f4ecef8ad9ca31a8372d0c353
    description: Cloudflare DNS Zone ID to inspect for dangling CNAME records.

  - id: audit_dry_run
    type: BOOL
    defaults: true
    description: Whether to execute in audit-only mode without executing automated remediation.

  - id: slack_channel
    type: STRING
    defaults: "#security-triage"
    description: Slack channel destination for DNS security findings.

tasks:
  - id: audit_cname_records
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests dnspython
    env:
      CLOUDFLARE_API_TOKEN: "{{ secret('CLOUDFLARE_API_TOKEN') }}"
      ZONE_ID: "{{ inputs.cloudflare_zone_id }}"
    script: |
      import os
      import json
      import requests
      import dns.resolver
      from kestra import Kestra

      api_token = os.getenv('CLOUDFLARE_API_TOKEN')
      zone_id = os.getenv('ZONE_ID')

      headers = {
          'Authorization': f'Bearer {api_token}',
          'Content-Type': 'application/json'
      }

      url = f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?type=CNAME'
      response = requests.get(url, headers=headers)
      
      records_data = response.fromJson()
      cname_records = records_data.get('result', [])

      vulnerable_targets = [
          's3.amazonaws.com',
          'github.io',
          'herokuapp.com',
          'azurewebsites.net',
          'pantheonsite.io',
          'zendesk.com'
      ]

      dangling_records = []

      for record in cname_records:
          rec_name = record.get('name')
          rec_content = record.get('content', '')
          rec_id = record.get('id')
          proxied = record.get('proxied', False)

          is_suspicious_target = any(target in rec_content.lower() for target in vulnerable_targets)

          if is_suspicious_target and not proxied:
              try:
                  answers = dns.resolver.resolve(rec_content, 'A')
              except (dns.resolver.NXDOMAIN, dns.resolver.NoAnswer):
                  dangling_records.append({
                      'id': rec_id,
                      'name': rec_name,
                      'target': rec_content,
                      'issue': 'NXDOMAIN_UNRESOLVED_TARGET'
                  })
              except Exception:
                  pass

      total_cname = len(cname_records)
      dangling_count = len(dangling_records)
      has_dangling = dangling_count > 0

      Kestra.outputs({
          'total_cname_records': total_cname,
          'dangling_records_count': dangling_count,
          'has_dangling_records': has_dangling,
          'dangling_hostnames': [r['name'] for r in dangling_records]
      })

      report_payload = {
          'zone_id': zone_id,
          'total_cname_records': total_cname,
          'dangling_count': dangling_count,
          'dangling_records': dangling_records
      }

      with open('dns_takeover_audit_report.json', 'w') as f:
          json.dump(report_payload, f, indent=2)

    outputFiles:
      - dns_takeover_audit_report.json

  - id: check_dangling_dns
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_cname_records.vars.has_dangling_records }}"
    then:
      - id: notify_slack_dns_risk
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "Cloudflare DNS Security Alert: {{ outputs.audit_cname_records.vars.dangling_records_count }} dangling CNAME record(s) detected in Zone {{ inputs.cloudflare_zone_id }}.\nExposed Hostnames: {{ outputs.audit_cname_records.vars.dangling_hostnames | join(', ') }}\nImmediate risk of subdomain takeover."
          }
    else:
      - id: log_dns_compliant
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.audit_cname_records.vars.total_cname_records }} CNAME records in Zone {{ inputs.cloudflare_zone_id }} are verified and actively resolve."

  - id: export_dns_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      cloudflare_zone: "{{ inputs.cloudflare_zone_id }}"
      dangling_count: "{{ outputs.audit_cname_records.vars.dangling_records_count | string }}"
      security_posture: "{{ outputs.audit_cname_records.vars.has_dangling_records ? 'VULNERABLE' : 'SECURE' }}"

triggers:
  - id: daily_dns_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * *"

extend:
  title: Cloudflare DNS Dangling CNAME Takeover Guard
  metaTitle: Cloudflare DNS Dangling CNAME Takeover Guard
  shortDescription: Audits Cloudflare DNS zones for dangling CNAME records pointing to orphaned external cloud targets.
  metaDescription: Audits Cloudflare DNS zones to detect dangling CNAME records pointing to decommissioned third-party cloud targets, preventing subdomain takeovers.
  description: |
    This blueprint audits Cloudflare DNS zones to identify dangling CNAME records pointing to decommissioned cloud targets (such as orphaned AWS S3 buckets, GitHub Pages, or Azure Web Apps). Scheduled daily, it performs external DNS resolution tests on suspicious unproxied CNAME aliases and dispatches immediate high-severity Slack alerts before malicious actors claim orphaned resources for subdomain hijacking.

    ## How it works

    1. **Scheduled Daily Audit**: The `daily_dns_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit at 04:00 UTC daily.
    2. **Cloudflare API and DNS Query Inspection**: The `audit_cname_records` task (`io.kestra.plugin.scripts.python.Script`) calls the Cloudflare v4 REST API to extract all CNAME entries, cross-referencing targets against known multi-tenant cloud patterns and executing DNS resolution checks using `dnspython`.
    3. **Vulnerability Evaluation**: The `check_dangling_dns` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any unresolvable CNAME records were discovered.
    4. **Slack Security Dispatch**: When dangling CNAME records are detected, `notify_slack_dns_risk` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) delivers an incident warning with exposed hostnames.
    5. **Healthy Confirmation**: When all aliases resolve to legitimate targets, `log_dns_compliant` records verified security posture.
    6. **Manifest Export**: The `export_dns_manifest` task annotates the execution with searchable labels for audit logging.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Daily 04:00 UTC] --> B[audit_cname_records: Cloudflare API & dnspython]
        B --> C{Dangling CNAMEs Found?}
        C -- Yes --> D[notify_slack_dns_risk: Slack Webhook]
        C -- No --> E[log_dns_compliant: Log]
        D --> F[export_dns_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Subdomain Takeover Prevention**: Detect orphaned SaaS endpoints before hostile adversaries claim the underlying bucket or app service to host phishing campaigns.
    - **Decommissioning Verification**: Verify that DNS cleanup procedures were executed properly following the deprecation of legacy microservices.
    - **Continuous Attack Surface Management**: Maintain continuous automated visibility across multi-zone corporate DNS portfolios.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `cloudflare_zone_id` | STRING | `023e105f4ecef8ad9ca31a8372d0c353` | Cloudflare DNS Zone ID to inspect for dangling CNAME records. |
    | `audit_dry_run` | BOOL | `true` | Whether to execute in audit-only mode without executing automated remediation. |
    | `slack_channel` | STRING | `#security-triage` | Slack channel destination for DNS security findings. |

    ## Expected outputs

    - `{{ outputs.audit_cname_records.vars.total_cname_records }}`: Total CNAME records examined in the zone.
    - `{{ outputs.audit_cname_records.vars.dangling_records_count }}`: Number of dangling or orphaned CNAME records.
    - `{{ outputs.audit_cname_records.vars.has_dangling_records }}`: Boolean flag indicating vulnerability detection.
    - `{{ outputs.audit_cname_records.vars.dangling_hostnames }}`: List of exposed domain hostnames.
    - `{{ outputs.audit_cname_records.outputFiles['dns_takeover_audit_report.json'] }}`: Full JSON diagnostic report.

    ## Prerequisites

    - Cloudflare API Token with `Zone:DNS:Read` permissions on the targeted zone.
    - Incoming Webhook URL configured for your security operations Slack channel.

    ### Secrets

    - `CLOUDFLARE_API_TOKEN`: Cloudflare scoped API bearer token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your Cloudflare Zone ID in `cloudflare_zone_id`.
    4. Click **Execute** in the UI to run an initial DNS dangling CNAME audit across your zone.

    ## Common pitfalls and troubleshooting

    - **Proxied Records**: Cloudflare proxied (orange cloud) records route traffic through Cloudflare edge anycast IPs; only unproxied (grey cloud) CNAMEs pointing directly to unallocated cloud resources are prone to direct takeover.
    - **Rate Limiting**: Large zones with thousands of CNAME records should implement batching to stay well within Cloudflare API query limits.

    ## How to extend

    - Add automated removal of verified dangling records via `DELETE /zones/{zone_id}/dns_records/{record_id}` upon security analyst approval.
    - Expand target fingerprinting list to include Shopify, Fastly, Bitbucket, and Firebase hosting footprints.
    - Integrate with Jira Service Management to open automated tracking tickets for exposed subdomains.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Cloudflare DNS API Documentation: https://developers.cloudflare.com/api/operations/dns-records-for-a-zone-list-dns-records
  tags:
    - Infrastructure
    - Core
  subTags:
    - Infrastructure Automation
    - Policy & Compliance
  ee: false
  demo: false
