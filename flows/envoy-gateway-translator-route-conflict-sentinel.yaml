id: envoy-gateway-translator-route-conflict-sentinel
namespace: company.team

description: |
  Audits Envoy Gateway metrics to detect route translation conflicts, high translation durations, and unprogrammed Gateway status, alerting platform engineering teams on Slack.

concurrency:
  limit: 1

inputs:
  - id: gateway_metrics_url
    type: STRING
    displayName: "Envoy Gateway Metrics URL"
    defaults: "http://envoy-gateway.envoy-gateway-system.svc.cluster.local:19001"
    description: "Prometheus metrics endpoint exposed by the Envoy Gateway control plane controller."

  - id: gateway_class
    type: STRING
    displayName: "GatewayClass Identifier"
    defaults: "eg-production-gateway"
    description: "Target Kubernetes GatewayClass or Gateway instance under configuration translation audit."

  - id: max_route_conflicts_threshold
    type: INT
    displayName: "Max Route Conflicts Threshold"
    defaults: 2
    description: "Maximum allowable HTTPRoute / GRPCRoute configuration translation conflict events before alerting."

  - id: max_translation_duration_ms
    type: INT
    displayName: "Max Translation Duration (ms)"
    defaults: 200
    description: "Maximum allowable GatewayClass xDS translation cycle duration in milliseconds before alerting."

  - id: alert_on_programming_error
    type: BOOL
    displayName: "Alert On Programming Error"
    defaults: true
    description: "Toggle whether alerts are dispatched if Gateway programmed status is false (0)."

tasks:
  - id: scan_envoy_gateway_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Envoy Gateway Prometheus metrics to detect route translation conflicts and compilation latency.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      GATEWAY_URL: "{{ inputs.gateway_metrics_url }}"
      GATEWAY_CLASS: "{{ inputs.gateway_class }}"
      MAX_CONFLICTS: "{{ inputs.max_route_conflicts_threshold }}"
      MAX_DURATION_MS: "{{ inputs.max_translation_duration_ms }}"
      ALERT_PROGRAMMING: "{{ inputs.alert_on_programming_error }}"
    script: |
      import os
      import sys
      import re
      import json
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("GATEWAY_URL", "").rstrip("/")
      gateway_class = os.environ.get("GATEWAY_CLASS", "eg-production-gateway")
      max_conflicts = int(os.environ.get("MAX_CONFLICTS", "2"))
      max_duration = int(os.environ.get("MAX_DURATION_MS", "200"))
      alert_programming = os.environ.get("ALERT_PROGRAMMING", "true").lower() == "true"

      route_conflicts = 0
      translation_duration_ms = 0
      gateway_programmed = 1
      total_routes = 0

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          resp.raise_for_status()
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "envoy_gateway_translator_route_conflict_total" in line:
                  route_conflicts += int(val)
              elif "envoy_gateway_translator_duration_seconds" in line:
                  translation_duration_ms = max(translation_duration_ms, int(val * 1000))
              elif "envoy_gateway_gateway_programmed_total" in line:
                  gateway_programmed = int(val)
              elif "envoy_gateway_routes_total" in line:
                  total_routes += int(val)
      except Exception as err:
          print(f"CRITICAL: Failed to scrape Envoy Gateway metrics at {base_url}: {err}", file=sys.stderr)
          sys.exit(1)

      is_breached = bool(
          (route_conflicts > max_conflicts) or
          (translation_duration_ms > max_duration) or
          (alert_programming and gateway_programmed == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()

      report = {
          "gateway_class": gateway_class,
          "route_conflicts": route_conflicts,
          "translation_duration_ms": translation_duration_ms,
          "gateway_programmed": gateway_programmed,
          "total_routes": total_routes,
          "is_breached": is_breached
      }

      with open("envoy_gateway_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Envoy Gateway audit: conflicts={route_conflicts}, duration={translation_duration_ms}ms, programmed={gateway_programmed}")

      Kestra.outputs({
          "route_conflicts_count": route_conflicts,
          "translation_duration_ms": translation_duration_ms,
          "gateway_programmed_status": gateway_programmed,
          "total_routes_count": total_routes,
          "is_alerting": is_breached,
          "gateway_class_target": gateway_class,
          "audit_timestamp": now_iso
      })
    outputFiles:
      - envoy_gateway_report.json

  - id: evaluate_gateway_conflict_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether route conflicts or translation compilation times exceed operational bounds.
    condition: "{{ outputs.scan_envoy_gateway_metrics.vars.is_alerting }}"
    then:
      - id: notify_slack_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident card to Platform Engineering Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-alerts",
            "username": "EnvoyGateway-Sentinel",
            "text": "CRITICAL: Envoy Gateway Translation Conflict detected for class `{{ inputs.gateway_class }}`! Route conflicts: `{{ outputs.scan_envoy_gateway_metrics.vars.route_conflicts_count }}`, Translation duration: `{{ outputs.scan_envoy_gateway_metrics.vars.translation_duration_ms }}ms`, Programmed: `{{ outputs.scan_envoy_gateway_metrics.vars.gateway_programmed_status }}`."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#platform-alerts",
        "username": "EnvoyGateway-Sentinel",
        "text": "CRITICAL: Envoy Gateway Route Conflict Sentinel failed on `{{ inputs.gateway_class }}`. Execution ID: `{{ execution.id }}`."
      }

triggers:
  - id: periodic_gateway_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger checking Envoy Gateway metrics every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: Envoy Gateway Translator Route Conflict Sentinel
  metaTitle: Envoy Gateway Translator Route Conflict Sentinel Blueprint
  shortDescription: Audits Envoy Gateway control plane metrics to detect route translation conflicts and compilation latency.
  metaDescription: Audits Envoy Gateway metrics to detect route translation conflicts, high translation durations, and unprogrammed status.
  description: |
    Kubernetes Gateway API implementations translate declarative HTTPRoute and GRPCRoute resources into Envoy xDS configuration models. When multiple routes declare conflicting path matches, invalid backend references, or duplicate hostnames, the Envoy Gateway translator rejects routes or enters degraded state. This sentinel monitors Envoy Gateway metrics, alerts platform teams to translation conflicts and compiler latency, and prevents routing outages.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_gateway_audit Schedule Trigger] --> B[scan_envoy_gateway_metrics Python Script]
      B --> C{Translation Conflict or Unprogrammed?}
      C -- Yes --> D[notify_slack_platform_team Webhook]
      C -- No --> E[Gateway Translation Nominal]
    ```

    ## Prerequisites
    - Outbound network access to Envoy Gateway metrics endpoint.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `gateway_metrics_url` and `gateway_class`.
    3. Run manually to check Gateway translation health.

    ## Links
    - [Envoy Gateway Metrics Documentation](https://gateway.envoyproxy.io/docs/tasks/operations/monitoring/)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
    - Network
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
