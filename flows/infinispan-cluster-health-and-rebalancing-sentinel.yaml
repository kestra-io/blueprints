id: infinispan-cluster-health-and-rebalancing-sentinel
namespace: company.team

description: |
  Continuously monitors an Infinispan distributed in-memory data grid cluster by auditing cluster health endpoints, partition rebalancing states, active node membership counts, and cache telemetry, classifying cluster posture, dispatching real-time Slack incident notifications, and exporting structured audit metadata.

inputs:
  - id: infinispan_host
    type: STRING
    displayName: Infinispan Host
    description: Hostname or IP address of the Infinispan REST endpoint reachable by the Kestra worker.
    defaults: "localhost"

  - id: infinispan_port
    type: INT
    displayName: Infinispan Port
    description: HTTP REST API port of the Infinispan server (defaults to 11222).
    defaults: 11222

  - id: infinispan_scheme
    type: STRING
    displayName: Protocol Scheme
    description: URI protocol scheme (http or https).
    defaults: "http"

  - id: infinispan_username
    type: STRING
    displayName: Admin Username
    description: Administrative user with permissions to query cache manager REST endpoints.
    defaults: "admin"

  - id: cache_manager
    type: STRING
    displayName: Cache Manager Name
    description: Target Infinispan cache manager name to audit.
    defaults: "default"

  - id: cache_name
    type: STRING
    displayName: Target Cache Name
    description: Cache name to inspect for operational statistics and memory metrics.
    defaults: "default"

  - id: min_expected_nodes
    type: INT
    displayName: Minimum Expected Nodes
    description: Minimum number of active cluster nodes required to maintain high-availability quorum.
    defaults: 1

tasks:
  - id: probe_cluster_health
    type: io.kestra.plugin.core.http.Request
    description: Queries the Infinispan cache manager health REST endpoint to audit overall cluster status and node membership.
    uri: "{{ inputs.infinispan_scheme }}://{{ inputs.infinispan_host }}:{{ inputs.infinispan_port }}/rest/v2/cache-managers/{{ inputs.cache_manager }}/health"
    method: GET
    headers:
      Accept: application/json
    options:
      allowFailed: true
      auth:
        type: BASIC
        username: "{{ inputs.infinispan_username }}"
        password: "{{ secret('INFINISPAN_PASSWORD') }}"
    allowFailure: true

  - id: probe_cache_stats
    type: io.kestra.plugin.core.http.Request
    description: Queries the target cache statistics endpoint to inspect entry counts, store operations, and eviction pressures.
    uri: "{{ inputs.infinispan_scheme }}://{{ inputs.infinispan_host }}:{{ inputs.infinispan_port }}/rest/v2/caches/{{ inputs.cache_name }}/stats"
    method: GET
    headers:
      Accept: application/json
    options:
      allowFailed: true
      auth:
        type: BASIC
        username: "{{ inputs.infinispan_username }}"
        password: "{{ secret('INFINISPAN_PASSWORD') }}"
    allowFailure: true

  - id: classify_cluster_posture
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates probe responses and classifies Infinispan cluster operational posture via Pebble expressions.
    format: >-
      {{
        outputs.probe_cluster_health.code != 200
          ? 'CLUSTER_UNREACHABLE'
          : (outputs.probe_cluster_health.body.cluster_health.health_status == 'DEGRADED'
            ? 'CLUSTER_DEGRADED'
            : (outputs.probe_cluster_health.body.cluster_health.health_status == 'HEALTHY_REBALANCING'
              ? 'REBALANCING_IN_PROGRESS'
              : (outputs.probe_cluster_health.body.cluster_health.number_of_nodes < inputs.min_expected_nodes
                ? 'NODE_MEMBERSHIP_DEFICIT'
                : 'HEALTHY_OPTIMAL')))
      }}

  - id: route_by_posture
    type: io.kestra.plugin.core.flow.Switch
    description: Routes workflow execution based on the evaluated Infinispan cluster posture.
    value: "{{ outputs.classify_cluster_posture.value }}"
    cases:
      "HEALTHY_OPTIMAL":
        - id: log_cluster_healthy
          type: io.kestra.plugin.core.log.Log
          message: >-
            Infinispan cluster {{ outputs.probe_cluster_health.body.cluster_health.cluster_name ?? 'default' }} is healthy.
            Active nodes: {{ outputs.probe_cluster_health.body.cluster_health.number_of_nodes ?? 0 }}
            ({{ outputs.probe_cluster_health.body.cluster_health.node_names ?? [] }}).
            Cache '{{ inputs.cache_name }}' current entries: {{ outputs.probe_cache_stats.body.approximate_entries ?? 'N/A' }}.

      "CLUSTER_DEGRADED":
        - id: alert_cluster_degraded_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          messageText: |
            :rotating_light: *CRITICAL: Infinispan Cluster Degraded*
            *Host:* `{{ inputs.infinispan_host }}:{{ inputs.infinispan_port }}`
            *Cluster:* `{{ outputs.probe_cluster_health.body.cluster_health.cluster_name ?? 'default' }}`
            *Status:* `{{ outputs.probe_cluster_health.body.cluster_health.health_status }}`
            *Active Nodes:* `{{ outputs.probe_cluster_health.body.cluster_health.number_of_nodes ?? 0 }}`
            *Action Required:* Immediate failover or memory partition remediation needed to prevent cascading session drops.

      "REBALANCING_IN_PROGRESS":
        - id: alert_rebalancing_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          messageText: |
            :warning: *NOTICE: Infinispan Cluster State Rebalancing*
            *Host:* `{{ inputs.infinispan_host }}:{{ inputs.infinispan_port }}`
            *Cluster:* `{{ outputs.probe_cluster_health.body.cluster_health.cluster_name ?? 'default' }}`
            *Status:* `HEALTHY_REBALANCING`
            *Active Nodes:* `{{ outputs.probe_cluster_health.body.cluster_health.number_of_nodes ?? 0 }}`
            *Details:* Node membership change detected. Cache partitions are actively rebalancing across the data grid.

      "NODE_MEMBERSHIP_DEFICIT":
        - id: alert_membership_deficit_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          messageText: |
            :warning: *WARNING: Infinispan Node Membership Deficit*
            *Host:* `{{ inputs.infinispan_host }}:{{ inputs.infinispan_port }}`
            *Cluster:* `{{ outputs.probe_cluster_health.body.cluster_health.cluster_name ?? 'default' }}`
            *Current Nodes:* `{{ outputs.probe_cluster_health.body.cluster_health.number_of_nodes ?? 0 }}` (Expected >= `{{ inputs.min_expected_nodes }}`)
            *Active Members:* `{{ outputs.probe_cluster_health.body.cluster_health.node_names ?? [] }}`
            *Action Required:* Check container orchestrator logs for evicted or failing Infinispan pod instances.

      "CLUSTER_UNREACHABLE":
        - id: alert_unreachable_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          messageText: |
            :skull: *CRITICAL: Infinispan Cluster Unreachable*
            *Endpoint:* `{{ inputs.infinispan_scheme }}://{{ inputs.infinispan_host }}:{{ inputs.infinispan_port }}`
            *HTTP Status Code:* `{{ outputs.probe_cluster_health.code ?? 'Connection Failed' }}`
            *Action Required:* Verify network connectivity, service ports, and container runtime liveness.

  - id: audit_summary
    type: io.kestra.plugin.core.output.OutputValues
    description: Exports structured telemetry capturing cluster posture and operational metrics for compliance logging.
    values:
      cluster_posture: "{{ outputs.classify_cluster_posture.value }}"
      http_response_code: "{{ outputs.probe_cluster_health.code }}"
      cluster_name: "{{ outputs.probe_cluster_health.body.cluster_health.cluster_name ?? 'UNKNOWN' }}"
      active_node_count: "{{ outputs.probe_cluster_health.body.cluster_health.number_of_nodes ?? 0 }}"
      health_status: "{{ outputs.probe_cluster_health.body.cluster_health.health_status ?? 'UNREACHABLE' }}"
      cache_approximate_entries: "{{ outputs.probe_cache_stats.body.approximate_entries ?? -1 }}"
      cache_evictions: "{{ outputs.probe_cache_stats.body.evictions ?? -1 }}"

errors:
  - id: alert_workflow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-priority Slack notifications if the sentinel workflow encounters unhandled execution errors.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :x: *ERROR: Infinispan Sentinel Execution Failed*
      *Execution ID:* `{{ execution.id }}`
      *Flow:* `{{ flow.namespace }}.{{ flow.id }}`
      *Error Message:* Pipeline failed during health audit execution.

triggers:
  - id: scheduled_cluster_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated Infinispan cluster audits every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: Infinispan Distributed Cache Cluster Health and Rebalancing Sentinel
  metaTitle: Infinispan Cache Cluster Health & Rebalancing Sentinel | Kestra
  shortDescription: Continuously monitor Infinispan in-memory data grid health, cluster rebalancing, node membership quorum, and cache statistics with automated Slack alerts.
  metaDescription: Monitor Infinispan in-memory data grid health, partition rebalancing, node membership, and cache metrics with automated Slack incident response.
  description: |
    Continuously audits Infinispan in-memory data grid and distributed cache clusters by querying management REST endpoints, evaluating cluster partition health and topology rebalancing states, verifying minimum node quorum thresholds, and alerting incident response teams via Slack.

    ## How it works

    1. `probe_cluster_health` (`io.kestra.plugin.core.http.Request`) submits an authenticated HTTP GET request to the Infinispan cache manager health endpoint (`/rest/v2/cache-managers/{manager}/health`), pulling real-time metadata including `cluster_name`, `health_status`, `number_of_nodes`, and individual cache degradation states.
    2. `probe_cache_stats` (`io.kestra.plugin.core.http.Request`) queries the target cache metrics endpoint (`/rest/v2/caches/{cache}/stats`) to monitor live entry counts, off-heap memory consumption, and cache eviction pressures.
    3. `classify_cluster_posture` (`io.kestra.plugin.core.debug.Return`) evaluates response status codes and cluster telemetry using a declarative Pebble expression:
       - Classifies as `CLUSTER_UNREACHABLE` if endpoints cannot be reached over the network or return non-200 responses.
       - Classifies as `CLUSTER_DEGRADED` if the cluster health state indicates partition loss or node failure (`DEGRADED`).
       - Classifies as `REBALANCING_IN_PROGRESS` if partition rebalancing is actively migrating data across nodes (`HEALTHY_REBALANCING`).
       - Classifies as `NODE_MEMBERSHIP_DEFICIT` if active cluster nodes fall below the configured `min_expected_nodes` threshold.
       - Classifies as `HEALTHY_OPTIMAL` when all health checks and quorum thresholds succeed.
    4. `route_by_posture` (`io.kestra.plugin.core.flow.Switch`) branches execution based on the evaluated classification:
       - `HEALTHY_OPTIMAL`: Dispatches an informational audit log with cluster topology, member names, and cache entry metrics.
       - `CLUSTER_DEGRADED`: Dispatches a critical Slack alert highlighting degraded cache names and requesting immediate failover intervention.
       - `REBALANCING_IN_PROGRESS`: Sends a warning Slack notification alerting engineering teams of active topology rebalancing.
       - `NODE_MEMBERSHIP_DEFICIT`: Sends a Slack warning flagging missing cluster nodes before quorum is permanently lost.
       - `CLUSTER_UNREACHABLE`: Posts an urgent incident alert indicating network partitions or container runtime crashes.
    5. `audit_summary` (`io.kestra.plugin.core.output.OutputValues`) exports structured metrics for downstream monitoring and compliance auditing.
    6. `errors` captures unexpected workflow execution failures and alerts on-call teams via Slack.

    ## What you get

    - Automated, continuous validation of Infinispan distributed data grid cluster health and partition states.
    - Early detection of node drops and split-brain scenarios before application sessions or distributed locks degrade.
    - Active visibility into partition rebalancing operations following planned maintenance or autoscaling events.
    - Real-time Slack notifications with actionable cluster diagnostic context and degraded cache names.
    - Centralized execution history meeting enterprise SLA and observability requirements.

    ## Who it's for

    - Platform Engineers and SREs maintaining high-availability in-memory caching and session backbones.
    - Kubernetes and Cloud Infrastructure Teams operating stateful Infinispan clusters.
    - Enterprise Architects overseeing identity providers (e.g., Keycloak) and distributed transactional systems reliant on Infinispan data grids.

    ## Why orchestrate this with Kestra

    Infinispan data grid failures are severe incidents that immediately cascade into dependent microservices, API gateways, and session stores. Standard port liveness checks are blind to internal cluster health transitions such as `HEALTHY_REBALANCING` or cache-level `DEGRADED` states. Kestra provides declarative, resilient multi-stage orchestration that probes cluster management APIs, validates quorum policies, isolates transient connection blips, dispatches formatted Slack alerts, and maintains auditable execution logs without managing brittle custom scripts.

    ## Prerequisites

    - A running Infinispan server instance or cluster (version 14.x, 15.x, or later) accessible over HTTP/HTTPS.
    - An administrative user configured in the Infinispan security realm with permissions to access REST endpoints.
    - An incoming Slack webhook URL for operational incident dispatch.

    ### Secrets

    - `INFINISPAN_PASSWORD`: Password for the administrative user used to authenticate HTTP requests against the Infinispan REST API.
    - `SLACK_WEBHOOK_URL`: Incoming Slack webhook URL used by `alert_cluster_degraded_slack`, `alert_rebalancing_slack`, `alert_membership_deficit_slack`, `alert_unreachable_slack`, and `alert_workflow_failure`.

    ## Quick start

    1. Configure `INFINISPAN_PASSWORD` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local Infinispan server using Docker:
       ```bash
       docker run -d --name infinispan -p 11222:11222 -e USER="admin" -e PASS="adminPassword123!" infinispan/server:latest
       ```
    3. Import this blueprint into Kestra and trigger an execution with default inputs (`infinispan_host: "localhost"`).
    4. Verify that `classify_cluster_posture` outputs `HEALTHY_OPTIMAL` and review the recorded metrics in `audit_summary`.
    5. Activate the `scheduled_cluster_audit` trigger to establish recurring health audits every 15 minutes.

    ## How to extend

    - Add automated scaling triggers using Kestra's Docker or Kubernetes plugins to spin up replacement nodes when `NODE_MEMBERSHIP_DEFICIT` is detected.
    - Incorporate memory threshold gates by evaluating `approximate_in_memory_bytes` against configured quotas to warn before out-of-memory evictions occur.
    - Forward audit metrics directly to Prometheus or Datadog using Kestra metric tasks for long-term telemetry trend analysis.

    ## Links

    - [Infinispan Documentation](https://infinispan.org/documentation/)
    - [Infinispan REST API Guide](https://infinispan.org/docs/stable/titles/rest/rest.html)
    - [Infinispan GitHub Repository](https://github.com/infinispan/infinispan)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
