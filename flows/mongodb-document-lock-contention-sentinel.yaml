id: mongodb-document-lock-contention-sentinel
namespace: company.database

inputs:
  - id: mongo_uri
    type: STRING
    defaults: "mongodb://mongo.internal:27017"
    description: MongoDB connection URI string.
  - id: lock_acquisition_wait_threshold_ms
    type: INT
    defaults: 100
    description: Warning threshold in milliseconds for average lock acquisition wait time.

tasks:
  - id: audit_lock_contention
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: mongo:latest
    commands:
      - |
        mongosh --quiet "{{ inputs.mongo_uri }}" --eval '
          const s = db.serverStatus();
          const locks = s.locks || {};
          const globalLock = locks.Global || {};
          const timeAcquiringMicros = (globalLock.timeAcquiringMicros && globalLock.timeAcquiringMicros.r) ? globalLock.timeAcquiringMicros.r : 0;
          const currentQueue = s.globalLock ? s.globalLock.currentQueue : { total: 0, readers: 0, writers: 0 };
          print(JSON.stringify({
            current_queue_total: currentQueue.total,
            readers_waiting: currentQueue.readers,
            writers_waiting: currentQueue.writers,
            time_acquiring_micros: timeAcquiringMicros
          }));
        ' > /tmp/mongo_locks.json
        
        QUEUE_TOTAL=$(jq '.current_queue_total // 0' /tmp/mongo_locks.json)
        LOCK_TELEMETRY=$(cat /tmp/mongo_locks.json)
        
        echo "::set-output name=queue_total::$QUEUE_TOTAL::"
        echo "::set-output name=lock_telemetry::$LOCK_TELEMETRY::"

  - id: evaluate_lock_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_lock_contention.vars.queue_total | int > 5 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 MongoDB Global Lock Wait Contention Alert",
                "text": "Detected high MongoDB lock contention with *{{ outputs.audit_lock_contention.vars.queue_total }}* operations currently queued waiting for locks. Lock telemetry: {{ outputs.audit_lock_contention.vars.lock_telemetry }}. Impact: Write operations and schema changes are blocking document reads, causing request pile-ups and connection pool exhaustion.",
                "footer": "Kestra Database Sentinel • MongoDB Locks"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MongoDB Lock Sentinel Execution Failed",
            "text": "The MongoDB lock contention audit workflow failed. Please verify MongoDB connection URI and authentication credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: MongoDB Global Lock Contention and Operation Queue Sentinel
  shortDescription: Audits MongoDB serverStatus lock metrics to detect operation queue pile-ups and severe document write lock contention.
  description: |
    ## How it works
    This workflow connects to the target MongoDB cluster using official `mongosh` CLI inside a containerized runner. It evaluates `db.serverStatus().locks` and `db.serverStatus().globalLock` metrics, specifically monitoring active operations queued waiting for lock acquisition. When long-running transactions, unindexed updates, or schema indexing operations lock database namespaces, the operation queue spikes. A Slack incident alert is immediately triggered.

    ## What you get
    - Real-time detection of concurrency bottlenecks and lock starvation.
    - Prevents cascading web application 504 timeouts caused by blocked database reads.
    - Detailed lock telemetry including active reader and writer wait queues.

    ## Who it's for
    - Database Administrators (DBAs) and SREs optimizing high-throughput MongoDB clusters.
    - Backend software engineers debugging high tail-latency spikes on document databases.

    ## Why orchestrate this with Kestra
    - **Reliable Periodic Sampling**: Continuously inspect lock metrics without deploying third-party agent daemons.
    - **Containerized Execution**: Runs official MongoDB tooling cleanly inside isolated container environments.
    - **Contextual Alerting**: Route actionable diagnostics directly to on-call database engineers.

    ## Prerequisites
    - MongoDB connection string with read access to administrative `serverStatus`.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Provide your MongoDB connection URI and Slack webhook secret.
    3. Run the workflow to inspect current MongoDB lock contention.

    ## How to extend
    - Query `currentOp()` to identify the exact long-running operation holding exclusive locks.
    - Automatically alert on specific hot collections.

    ## Links
    - [MongoDB Locks and Concurrency Documentation](https://www.mongodb.com/docs/manual/faq/concurrency/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
