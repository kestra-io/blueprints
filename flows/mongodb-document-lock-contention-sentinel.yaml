id: mongodb-document-lock-contention-sentinel
namespace: company.database

inputs:
  - id: mongo_uri
    type: STRING
    defaults: "mongodb://mongo.internal:27017"
    description: MongoDB connection URI string.
  - id: lock_acquisition_wait_threshold_ms
    type: INT
    defaults: 100
    description: Warning threshold in milliseconds for average lock acquisition wait time.

tasks:
  - id: audit_lock_contention
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pymongo==4.15.3
      - kestra==2.0.0
    script: |
      from pymongo import MongoClient
      import sys
      from kestra import Kestra

      mongo_uri = "{{ inputs.mongo_uri }}"
      try:
          client = MongoClient(mongo_uri, serverSelectionTimeoutMS=5000)
          status = client.admin.command("serverStatus")

          locks = status.get("locks", {})
          global_lock = locks.get("Global", {})
          time_acquiring_micros = global_lock.get("timeAcquiringMicros", {}).get("r", 0)

          current_queue = status.get("globalLock", {}).get("currentQueue", {})
          queue_total = int(current_queue.get("total", 0))
          readers_waiting = int(current_queue.get("readers", 0))
          writers_waiting = int(current_queue.get("writers", 0))

          print(f"Queue total: {queue_total}, readers: {readers_waiting}, writers: {writers_waiting}, time acquiring micros: {time_acquiring_micros}")

          Kestra.outputs({
              "queue_total": queue_total,
              "readers_waiting": readers_waiting,
              "writers_waiting": writers_waiting,
              "time_acquiring_micros": time_acquiring_micros
          })
      except Exception as e:
          print(f"Error auditing MongoDB lock contention: {e}", file=sys.stderr)
          sys.exit(1)

  - id: evaluate_lock_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_lock_contention.vars.queue_total | int > 5 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 MongoDB Global Lock Wait Contention Alert",
                "text": "Detected high MongoDB lock contention with *{{ outputs.audit_lock_contention.vars.queue_total }}* operations currently queued waiting for locks (Readers: {{ outputs.audit_lock_contention.vars.readers_waiting }}, Writers: {{ outputs.audit_lock_contention.vars.writers_waiting }}). Impact: Write operations and schema changes are blocking document reads, causing request pile-ups and connection pool exhaustion.",
                "footer": "Kestra Database Sentinel • MongoDB Locks"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MongoDB Lock Sentinel Execution Failed",
            "text": "The MongoDB lock contention audit workflow failed. Please verify MongoDB connection URI and authentication credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: queue_total
    type: INT
    value: "{{ outputs.audit_lock_contention.vars.queue_total }}"
  - id: readers_waiting
    type: INT
    value: "{{ outputs.audit_lock_contention.vars.readers_waiting }}"
  - id: writers_waiting
    type: INT
    value: "{{ outputs.audit_lock_contention.vars.writers_waiting }}"
  - id: time_acquiring_micros
    type: INT
    value: "{{ outputs.audit_lock_contention.vars.time_acquiring_micros }}"

extend:
  metaDescription: "Audits MongoDB serverStatus lock metrics to detect operation queue pile-ups and severe document write lock contention."
  metaTitle: MongoDB Global Lock Contention and Operation Queue Sentinel with Kestra
  title: MongoDB Global Lock Contention and Operation Queue Sentinel
  shortDescription: Audits MongoDB serverStatus lock metrics to detect operation queue pile-ups and severe document write lock contention.
  description: |
    ## How it works
    This workflow connects to the target MongoDB cluster using a Python task inside a Docker runner. It evaluates `db.serverStatus().locks` and `db.serverStatus().globalLock` metrics, specifically monitoring active operations queued waiting for lock acquisition. When long-running transactions, unindexed updates, or schema indexing operations lock database namespaces, the operation queue spikes. A Slack incident alert is immediately triggered.

    ## What you get
    - Real-time detection of concurrency bottlenecks and lock starvation.
    - Prevents cascading web application 504 timeouts caused by blocked database reads.
    - Detailed lock telemetry including active reader and writer wait queues.

    ## Who it's for
    - Database Administrators (DBAs) and SREs optimizing high-throughput MongoDB clusters.
    - Backend software engineers debugging high tail-latency spikes on document databases.

    ## Why orchestrate this with Kestra
    - **Reliable Periodic Sampling**: Continuously inspect lock metrics without deploying third-party agent daemons.
    - **Containerized Execution**: Runs official Python tooling cleanly inside isolated container environments.
    - **Contextual Alerting**: Route actionable diagnostics directly to on-call database engineers.

    ## Prerequisites
    - MongoDB connection string with read access to administrative `serverStatus`.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Provide your MongoDB connection URI and Slack webhook secret.
    3. Run the workflow to inspect current MongoDB lock contention.

    ## How to extend
    - Query `currentOp()` to identify the exact long-running operation holding exclusive locks.
    - Automatically alert on specific hot collections.

    ## Links
    - [MongoDB Locks and Concurrency Documentation](https://www.mongodb.com/docs/manual/faq/concurrency/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-script-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
