id: pypi-package-release-dependency-audit-loader
namespace: company.data

description: |
  Poll the Python Package Index (PyPI) JSON API to monitor version updates and security releases
  across critical production dependencies, parse semver changes and release artifacts into columnar Parquet
  using DuckDB, maintain version state in Kestra KV store, and emit alerts on new package releases.

inputs:
  - id: packages
    type: JSON
    description: List of critical Python package names to monitor for upstream version releases.
    defaults: |
      [
        {"package": "duckdb"},
        {"package": "polars"},
        {"package": "kestra"},
        {"package": "pydantic"},
        {"package": "fastapi"},
        {"package": "requests"}
      ]

  - id: state_key
    type: STRING
    defaults: pypi_monitored_packages_version_state
    description: Kestra KV store key maintaining the latest known version string per package.

concurrency:
  limit: 1
  behavior: CANCEL

triggers:
  - id: daily_pypi_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    description: Check for updated PyPI package releases daily at 08:00 UTC.

tasks:
  - id: fetch_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_releases
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install duckdb requests
    env:
      PACKAGES_JSON: "{{ inputs.packages }}"
      LAST_STATE: "{{ outputs.fetch_state.value ?? '{}' }}"
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb

        packages = json.loads(os.environ.get("PACKAGES_JSON", "[]"))
        state = json.loads(os.environ.get("LAST_STATE", "{}"))

        headers = {"User-Agent": "Kestra-PyPI-Auditor/2.0 (contact@company.internal)"}
        release_records = []
        new_state = dict(state)
        new_releases = []

        for p in packages:
            pkg_name = p.get("package", "").strip().lower()
            if not pkg_name:
                continue

            url = f"https://pypi.org/pypi/{pkg_name}/json"
            try:
                resp = requests.get(url, headers=headers, timeout=20)
                if resp.status_code == 200:
                    data = resp.json()
                    info = data.get("info", {})
                    latest_ver = info.get("version", "0.0.0")
                    summary = info.get("summary", "")
                    author = info.get("author", "Unknown")
                    license_name = info.get("license", "Unknown")
                    requires_python = info.get("requires_python", "")

                    releases = data.get("releases", {})
                    ver_files = releases.get(latest_ver, [])
                    upload_time = ver_files[0].get("upload_time", "") if ver_files else ""
                    filename = ver_files[0].get("filename", "") if ver_files else ""
                    size = ver_files[0].get("size", 0) if ver_files else 0

                    previous_ver = state.get(pkg_name)
                    is_new_release = bool(previous_ver and previous_ver != latest_ver)

                    release_records.append({
                        "package_name": pkg_name,
                        "latest_version": latest_ver,
                        "previous_version": previous_ver if previous_ver else latest_ver,
                        "is_new_release": is_new_release,
                        "summary": summary,
                        "author": author,
                        "license": license_name,
                        "requires_python": requires_python,
                        "release_artifact": filename,
                        "artifact_size_bytes": int(size),
                        "upload_time": upload_time
                    })

                    if is_new_release:
                        new_releases.append({
                            "package": pkg_name,
                            "from_version": previous_ver,
                            "to_version": latest_ver
                        })

                    new_state[pkg_name] = latest_ver
            except Exception as e:
                print(f"Warning: Failed to fetch metadata for {pkg_name}: {e}")

        with open("pypi_releases.json", "w", encoding="utf-8") as f:
            json.dump(release_records, f)

        con = duckdb.connect()
        if release_records:
            con.execute("CREATE TABLE pypi_packages AS SELECT * FROM read_json_auto('pypi_releases.json')")
            con.execute("COPY pypi_packages TO 'pypi_package_audit.parquet' (FORMAT PARQUET)")
            con.execute("COPY pypi_packages TO 'pypi_package_audit.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE pypi_packages (
                    package_name VARCHAR,
                    latest_version VARCHAR,
                    previous_version VARCHAR,
                    is_new_release BOOLEAN,
                    summary VARCHAR,
                    author VARCHAR,
                    license VARCHAR,
                    requires_python VARCHAR,
                    release_artifact VARCHAR,
                    artifact_size_bytes BIGINT,
                    upload_time VARCHAR
                )
            """)
            con.execute("COPY pypi_packages TO 'pypi_package_audit.parquet' (FORMAT PARQUET)")
            con.execute("COPY pypi_packages TO 'pypi_package_audit.csv' (HEADER, DELIMITER ',')")

        output_summary = {
            "monitored_packages": len(release_records),
            "new_releases_count": len(new_releases),
            "new_releases": new_releases,
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(output_summary)}}}::")
        EOF
    outputFiles:
      - pypi_package_audit.parquet
      - pypi_package_audit.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_releases.vars.updated_state | toJson }}"

  - id: check_new_releases
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_releases.vars.new_releases_count > 0 }}"
    then:
      - id: notify_package_update
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "📦 PyPI Dependency Update Detected: {{ outputs.ingest_and_transform_releases.vars.new_releases_count }} production package(s) published new upstream releases."

outputs:
  - id: monitored_count
    type: INT
    value: "{{ outputs.ingest_and_transform_releases.vars.monitored_packages }}"
  - id: new_releases_count
    type: INT
    value: "{{ outputs.ingest_and_transform_releases.vars.new_releases_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_releases.outputFiles['pypi_package_audit.parquet'] }}"

extend:
  title: PyPI Package Release Dependency Audit Loader with DuckDB
  metaTitle: PyPI Package Release Audit Loader | Kestra
  shortDescription: Ingests upstream Python package releases and semver metadata from PyPI into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll PyPI JSON API for package releases, extract semver and artifact metadata into Parquet via DuckDB, and track versions in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Orchestrate automated, reliable synchronization of upstream Python package releases, semver versioning,
    and artifact release metadata directly from the official Python Package Index (PyPI) JSON API into analytical Parquet storage using DuckDB.

    ## How it works

    1. **State Recovery**: Reads previous package version mappings from Kestra KV store (`pypi_monitored_packages_version_state`) to detect newly uploaded semver releases.
    2. **PyPI Ingestion**: Queries the PyPI JSON REST endpoint (`pypi.org/pypi/{package}/json`) across configured critical open-source production dependencies.
    3. **DuckDB Semver Normalization**: Unpacks release upload timestamps, artifact file sizes, license metadata, and Python version constraints into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports package audit records into columnar Parquet and CSV files for dependency supply-chain auditing and internal package tracking.
    5. **Version Change Detection & State Persistence**: Flags packages that published new upstream releases and commits the updated version mapping to Kestra KV store.

    ## What you get

    - Automated recurring dependency release tracking protecting enterprise pipelines from unannounced upstream library breaking changes.
    - Columnar Parquet datasets capturing release history, artifact distributions, and licensing metadata.
    - Built-in KV state management providing idempotent execution and automated semver drift detection.

    ## Who it's for

    - Platform Engineers and SecOps teams managing software supply chain security and dependency drift.
    - Python Data Engineers maintaining shared analytical libraries across data pipelines.
    - DevOps teams automating downstream build and test pipelines when core packages update.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains package version state across runs without external database infrastructure.
    - Ephemeral Docker execution guarantees isolated Python and DuckDB dependencies cleanly.
    - Declarative flow control provides transparent logging, automated error handling, and scheduled execution.

    ## Prerequisites

    - Docker runtime configured on the Kestra worker.
    - Outbound internet access to `pypi.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding dependency upgrade alerts.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Adjust the `packages` input array with your team's critical Python libraries.
    3. Click **Execute** to run an initial release metadata harvest.
    4. Enable the `daily_pypi_sync` trigger for automated daily synchronization.

    ## How to extend

    - Add an S3 or Google Cloud Storage upload task to archive quarterly dependency audit snapshots.
    - Connect an automated PR creation task or GitHub Actions webhook to trigger dependency test suites.

    ## Links

    - [PyPI JSON API Developer Guide](https://warehouse.pypa.io/api-reference/json.html)
    - [DuckDB Parquet Export Guide](https://duckdb.org/docs/data/parquet/overview.html)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
