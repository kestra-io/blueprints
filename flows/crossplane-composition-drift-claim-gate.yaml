id: crossplane-composition-drift-claim-gate
namespace: company.team
description: |
  Crossplane claims drift from composition intent through late-initialized fields and failed polls while still surface-reading Ready, and no deploy gate looks at claim health. A keyed webhook accepts the claim status report with its conditions and managed resources, a Python pass classifies the claim as Ready, NotReady or Unavailable and extracts every drift marker, and a Switch routes on that state. NotReady claims get a Slack alert and a labeled GitHub issue, Unavailable claims get a Slack alert, and the final gate fails the execution whenever the claim is not Ready, with the claim name, state, drift markers and resource counts published as outputs while unexpected failures escalate to Slack.

triggers:
  - id: post_claim_status
    type: io.kestra.plugin.core.trigger.Webhook
    description: POST the claim status report here after each reconcile, for example from a cluster job that reads the claim, its conditions and its composed resources.
    key: "{{ secret('CLAIM_STATUS_WEBHOOK_KEY') }}"
  - id: hourly_claim_safety_net
    type: io.kestra.plugin.core.trigger.Schedule
    description: Hourly 07:00 UTC safety net, shipped disabled so no claim is paged until an operator reviews the classification inputs and switches it on.
    cron: "0 7 * * *"
    disabled: true

inputs:
  - id: claim_namespace
    type: STRING
    defaults: team-a
    description: Namespace recorded in the alert when the posted claim metadata does not carry one, so messages still name where the claim lives.
  - id: condition_stale_hours
    type: INT
    defaults: 24
    description: Hours a non Ready claim may sit in the same condition before the classifier adds a staleness note to the detail text.
  - id: require_all_resources_ready
    type: BOOL
    defaults: true
    description: Whether a composed resource that is not Ready blocks a claim that itself reports Ready.

tasks:
  # --- 1. claim status analysis ---
  - id: inspect_claim_status
    type: io.kestra.plugin.scripts.python.Script
    description: Read the posted claim status, classify it from the Ready condition plus the composed resources, collect drift markers, and emit the state through the outputs protocol.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.12-slim
    inputFiles:
      claim_status.json: "{{ (trigger.body ?? {}) | toJson }}"
    env:
      CLAIM_NAMESPACE: "{{ inputs.claim_namespace }}"
      CONDITION_STALE_HOURS: "{{ inputs.condition_stale_hours }}"
      REQUIRE_ALL_RESOURCES_READY: "{{ inputs.require_all_resources_ready }}"
    script: |
      import json
      import os
      from datetime import datetime, timezone

      REPORT_FILE = "claim_status.json"

      def env_float(name, default):
          try:
              return float(os.environ.get(name, default))
          except (TypeError, ValueError):
              return float(default)

      def env_bool(name, default):
          return str(os.environ.get(name, default)).strip().lower() in ("1", "true", "yes", "on")

      CLAIM_NAMESPACE = os.environ.get("CLAIM_NAMESPACE", "team-a")
      CONDITION_STALE_HOURS = env_float("CONDITION_STALE_HOURS", 24)
      REQUIRE_ALL_RESOURCES_READY = env_bool("REQUIRE_ALL_RESOURCES_READY", "true")

      def parse_timestamp(value):
          if not value:
              return None
          text = str(value).strip()
          if text.endswith("Z"):
              text = text[:-1] + "+00:00"
          try:
              stamp = datetime.fromisoformat(text)
          except ValueError:
              return None
          if stamp.tzinfo is None:
              stamp = stamp.replace(tzinfo=timezone.utc)
          return stamp.astimezone(timezone.utc)

      def load_report(path):
          try:
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return None, "claim report file is missing or empty"
              with open(path, "r", encoding="utf-8") as handle:
                  document = json.load(handle)
              document = json.loads(document) if isinstance(document, str) else document
              if not isinstance(document, dict):
                  return None, "claim report is not a JSON object"
              return document, ""
          except ValueError:
              return None, "claim report is not valid JSON"

      report, problem = load_report(REPORT_FILE)
      now = parse_timestamp(report.get("observedAt")) if report else None
      now = now or datetime.now(timezone.utc)

      claim_name, composition = "unknown-claim", "unknown-composition"
      claim_state, detail = "Unavailable", problem
      markers, blocking = [], []
      non_ready, resource_count, condition_age_hours = 0, 0, 0.0
      if report is not None:
          claim = report.get("claim") or {}
          meta = claim.get("metadata") or {}
          claim_name = str(meta.get("name") or "unnamed-claim")
          namespace = str(meta.get("namespace") or CLAIM_NAMESPACE)
          composition = str((report.get("composition") or {}).get("name") or "unnamed-composition")

          conditions = [row for row in (report.get("conditions") or []) if isinstance(row, dict)]
          ready_status, ready_transition, seen = "", None, []
          for condition in conditions:
              ctype = str(condition.get("type") or "unknown")
              cstatus = str(condition.get("status") or "unknown")
              seen.append("%s=%s" % (ctype, cstatus))
              if ctype == "Ready":
                  ready_status = cstatus
                  ready_transition = parse_timestamp(condition.get("lastTransitionTime"))
          condition_age_hours = round((now - ready_transition).total_seconds() / 3600.0, 1) if ready_transition else 0.0

          resources = [row for row in (report.get("resources") or []) if isinstance(row, dict)]
          resource_count = len(resources)
          for resource in resources:
              rname = str(resource.get("name") or "unnamed-resource")
              rstatus = str(resource.get("ready") or "unknown")
              late = sorted({str(field) for field in (resource.get("lateInitializedFields") or []) if field})
              if rstatus.lower() != "true":
                  non_ready += 1
                  markers.append("%s not Ready (%s)" % (rname, rstatus))
                  if REQUIRE_ALL_RESOURCES_READY:
                      blocking.append("%s not Ready" % rname)
              if late:
                  text = "%s late-initialized %s" % (rname, ", ".join(late))
                  markers.append(text)
                  blocking.append(text)
          if report.get("driftDetected"):
              markers.append("composition reconciler reports spec drift")
              blocking.append("composition reconciler reports spec drift")

          if ready_status in ("", "unknown", "Unknown"):
              claim_state = "Unavailable"
              detail = "claim %s has no Ready condition (observed %s)" % (claim_name, ", ".join(seen) or "none")
          elif ready_status == "False":
              claim_state = "NotReady"
              detail = "claim %s is NotReady - %s" % (claim_name, "; ".join(blocking) or "Ready condition is False")
          elif blocking:
              claim_state = "NotReady"
              detail = "claim %s reports Ready while composition intent drifted - %s" % (claim_name, "; ".join(blocking))
          else:
              claim_state = "Ready"
              detail = "claim %s in %s is Ready on composition %s with %d resource(s) and no drift markers" % (
                  claim_name, namespace, composition, resource_count)
          if claim_state != "Ready" and condition_age_hours > CONDITION_STALE_HOURS:
              detail += "; Ready condition unchanged for %.1fh past the %.0fh policy" % (
                  condition_age_hours, CONDITION_STALE_HOURS)

      gate_blocked = claim_state != "Ready"
      print("state=%s claim=%s composition=%s resources=%d non_ready=%d markers=%d" % (
          claim_state, claim_name, composition, resource_count, non_ready, len(markers)))
      print("::" + json.dumps({"outputs": {
          "claim_name": claim_name,
          "claim_state": claim_state,
          "gate_blocked": gate_blocked,
          "composition": composition,
          "drift_markers": markers,
          "non_ready_resources": non_ready,
          "condition_age_hours": condition_age_hours,
          "detail": detail,
      }}) + "::")

  # --- 2. state routing ---
  - id: route_on_claim_state
    type: io.kestra.plugin.core.flow.Switch
    description: Route on the classified claim state, so each state gets exactly the escalation it deserves instead of one generic claim alert.
    value: "{{ outputs.inspect_claim_status.vars.claim_state }}"
    cases:
      Ready:
        - id: log_ready_claim
          type: io.kestra.plugin.core.log.Log
          description: Record the healthy claim with its composition and resource count so the execution history still proves which claim was inspected.
          message: "Crossplane claim {{ outputs.inspect_claim_status.vars.claim_name }} is Ready - composition {{ outputs.inspect_claim_status.vars.composition }}, {{ outputs.inspect_claim_status.vars.non_ready_resources }} resource(s) not ready, no drift markers."
      NotReady:
        - id: alert_not_ready
          type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
          description: Post the claim name, composition and every drift marker to the platform channel the moment the claim stops matching composition intent.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {"text": "Crossplane claim {{ outputs.inspect_claim_status.vars.claim_name }} is NotReady. {{ outputs.inspect_claim_status.vars.detail }}. Execution {{ execution.id }}."}
        - id: open_claim_issue
          type: io.kestra.plugin.github.issues.Create
          description: Open a labeled GitHub issue carrying the drift markers, so claim repair gets an owner and a thread instead of a channel message that scrolls away.
          oauthToken: "{{ secret('GITHUB_TOKEN') }}"
          repository: your-org/platform-claims
          title: "Crossplane claim {{ outputs.inspect_claim_status.vars.claim_name }} drifted from composition intent"
          body: |
            ## Claim drift detected

            Claim **{{ outputs.inspect_claim_status.vars.claim_name }}** on composition
            **{{ outputs.inspect_claim_status.vars.composition }}** classified
            **{{ outputs.inspect_claim_status.vars.claim_state }}** with
            {{ outputs.inspect_claim_status.vars.non_ready_resources }} resource(s) not ready.
            {{ outputs.inspect_claim_status.vars.detail }}
            Execution `{{ execution.id }}`.

            ```json
            {{ outputs.inspect_claim_status.vars.drift_markers | toJson }}
            ```
          labels:
            - crossplane
            - drift
      Unavailable:
        - id: alert_unavailable
          type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
          description: Raise an Unavailable claim loudly, because a claim with no Ready condition is usually a broken composition or a broken connection secret.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {"text": "Crossplane claim {{ outputs.inspect_claim_status.vars.claim_name }} is Unavailable. {{ outputs.inspect_claim_status.vars.detail }}. Composition {{ outputs.inspect_claim_status.vars.composition }}. Execution {{ execution.id }}."}
    defaults:
      - id: log_unexpected_state
        type: io.kestra.plugin.core.log.Log
        description: Catch any state string the classifier did not predict, so a future condition type cannot slip past the gate silently.
        message: "Unexpected claim state {{ outputs.inspect_claim_status.vars.claim_state }} for claim {{ outputs.inspect_claim_status.vars.claim_name }}."

  # --- 3. gate verdict ---
  - id: claim_gate
    type: io.kestra.plugin.core.flow.If
    description: Fail the execution whenever the claim is not Ready, so a promotion pipeline waiting on claim health stops instead of building on a drifted claim.
    condition: "{{ outputs.inspect_claim_status.vars.gate_blocked }}"
    then:
      - id: alert_gate_blocked
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Announce that the gate is failing the execution, naming the claim, its state and the drift markers, right before the failure stops the pipeline.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "Crossplane claim gate BLOCKED for {{ flow.id }}. {{ outputs.inspect_claim_status.vars.detail }}. Markers {{ outputs.inspect_claim_status.vars.drift_markers | toJson }}. Execution {{ execution.id }}."}
      - id: fail_claim_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Fail with the classifier detail in the error message, naming the exact drift without opening a second channel.
        errorMessage: "Claim gate blocked - {{ outputs.inspect_claim_status.vars.detail }}"
    else:
      - id: log_gate_passed
        type: io.kestra.plugin.core.log.Log
        description: Record the passing verdict with the claim name and composition so the execution history proves gate health.
        message: "Claim gate passed - {{ outputs.inspect_claim_status.vars.claim_name }} on {{ outputs.inspect_claim_status.vars.composition }} is Ready with no drift markers."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: claim_name
    type: STRING
    value: "{{ outputs.inspect_claim_status.vars.claim_name }}"
  - id: claim_state
    type: STRING
    value: "{{ outputs.inspect_claim_status.vars.claim_state }}"
  - id: gate_blocked
    type: BOOL
    value: "{{ outputs.inspect_claim_status.vars.gate_blocked }}"
  - id: composition
    type: STRING
    value: "{{ outputs.inspect_claim_status.vars.composition }}"
  - id: drift_markers
    type: ARRAY
    value: "{{ outputs.inspect_claim_status.vars.drift_markers | toJson }}"
  - id: non_ready_resources
    type: INT
    value: "{{ outputs.inspect_claim_status.vars.non_ready_resources }}"
  - id: detail
    type: STRING
    value: "{{ outputs.inspect_claim_status.vars.detail }}"

extend:
  title: Gate Deploys on Crossplane Claim Health Instead of Trusting a Ready Condition
  metaTitle: Crossplane Claim Drift Gate with Kestra
  shortDescription: "Classify a Crossplane claim from its conditions and composed resources, flag drift behind a Ready surface, and gate the deploy through Slack and GitHub."
  metaDescription: "Classify a Crossplane claim from its conditions and resources, flag drift markers behind a Ready surface, and gate the deploy with Slack and GitHub."
  description: |
    A Crossplane claim can read Ready while the composition behind it has quietly drifted, through late-initialized fields, resources that stopped being Ready, or a reconciler that keeps failing polls, and almost nothing gates a deploy on that position. This blueprint takes one status report carrying the claim conditions and the composed resources, classifies the claim as Ready, NotReady or Unavailable in Python, and routes on that state with a Switch. NotReady claims get a Slack alert and a labeled GitHub issue listing every drift marker, Unavailable claims get a Slack alert, and a final gate fails the execution whenever the claim is not Ready so the pipeline waiting on it stops.

    ## How it works

    1. `post_claim_status` (`io.kestra.plugin.core.trigger.Webhook`, keyed with the `CLAIM_STATUS_WEBHOOK_KEY` secret) accepts the report after each reconcile. `hourly_claim_safety_net` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 7 * * *`) ships `disabled: true` until an operator has reviewed the classification inputs and switched it on.
    2. `inspect_claim_status` (`io.kestra.plugin.scripts.python.Script` on `python:3.12-slim`) reads `claim_status.json` from `inputFiles` and the three thresholds from `env`. It reads the `Ready` condition, counts resources that are not Ready, collects `lateInitializedFields`, notes a reconciler `driftDetected` flag, and ages the Ready condition. The state is `Unavailable` when no Ready condition exists, `NotReady` when Ready is False or when a Ready claim still carries drift markers, and `Ready` only when both surfaces are clean. The verdict is printed as one `::{"outputs": ...}::` line.
    3. `route_on_claim_state` (`io.kestra.plugin.core.flow.Switch`) branches on that state with map shaped `cases`. `Ready` logs the inspection, `NotReady` posts Slack and then opens a labeled GitHub issue with the markers as JSON, and `Unavailable` posts Slack. A `defaults` branch logs any state the classifier did not predict.
    4. `claim_gate` (`io.kestra.plugin.core.flow.If`) is the verdict. A blocked claim gets one Slack summary naming the markers and then fails the execution through `io.kestra.plugin.core.execution.Fail`, a Ready claim logs the pass, and the flow level `errors` handler (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) reports any other failure with the execution id.

    ## What you get

    - A state that reflects composition reality, `NotReady` even when the claim's own condition says `Ready`, if a resource or a late-initialized field proves otherwise.
    - Escalation that fits the state, Slack plus a GitHub issue for drift, Slack for a claim that cannot even report, a quiet log when clean.
    - A configurable stance, `require_all_resources_ready` decides whether a not ready child resource is a blocker or only a note.
    - Gateable outputs (`claim_state`, `gate_blocked`, `drift_markers`, `non_ready_resources`, `composition`, `detail`) a promotion flow can branch on.

    ## Who it's for

    - Platform teams running Crossplane compositions who need a deploy gate on claim health, not just on whether the claim object exists.
    - Kubernetes engineers triaging late-initialized drift and failed polls that never surface in a normal readiness check.
    - GitOps maintainers who want drifted claims to arrive as issues with markers, not as a surprise after the release ships.

    ## Why orchestrate this with Kestra

    Crossplane reconciles continuously and tells you about state one condition at a time, with no memory of what looked wrong yesterday and no opinion about whether a deploy may proceed. Kestra gives the check a keyed entry point for the cluster reporter, a Switch that separates the three states into three different responses, a conditional gate that stops the pipeline, typed outputs a parent flow can branch on, and an execution history showing which claim was classified, with which markers, at which time. Outside Kestra this becomes a controller hook whose alert nobody owns.

    ## Prerequisites

    - A worker with Docker access, the classifier runs in `python:3.12-slim`.
    - A reporter step that POSTs the claim, its conditions and its composed resources, shaped as `claim`, `composition`, `conditions` and `resources`, with optional `driftDetected` and `observedAt` fields.
    - A Slack incoming webhook and a GitHub token that can open issues in the repository named on `open_claim_issue`.

    ### Secrets

    - `CLAIM_STATUS_WEBHOOK_KEY`: key segment guarding the status webhook URL, anyone holding it can post a claim report.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by the routing alerts, the gate summary and the `errors` handler.
    - `GITHUB_TOKEN`: token used to open the drift issue, classic `repo` scope or fine-grained Issues write.

    ## Quick start

    1. Add the three secrets and point `open_claim_issue.repository` at a repository where issues are welcome.
    2. Run the flow once with a clean claim and watch it log `Ready`.

       ```
       curl -X POST -H "Content-Type: application/json" -d '{"observedAt":"2026-10-15T06:00:00Z","claim":{"metadata":{"name":"orders-db","namespace":"team-a"}},"composition":{"name":"xpostgresql-database-aws"},"conditions":[{"type":"Ready","status":"True","lastTransitionTime":"2026-10-15T05:00:00Z"},{"type":"Synced","status":"True"}],"resources":[{"name":"orders-db-rds","ready":"True","lateInitializedFields":[]}],"driftDetected":false}' "https://<kestra>/api/v1/<tenant>/executions/webhook/<namespace>/crossplane-composition-drift-claim-gate/<CLAIM_STATUS_WEBHOOK_KEY>"
       ```

    3. Re-post with `Ready` set to `False` and one resource carrying `lateInitializedFields` to watch the Switch take the `NotReady` branch, post to Slack, open the issue and fail the gate.
    4. Drop the `conditions` array entirely to see the `Unavailable` branch.
    5. Set `require_all_resources_ready` to `false` to prove a not ready child resource stops blocking while the late-initialized markers still block.

    ## How to extend

    - Split drift markers into blocking and advisory lists so cosmetic late initialization can warn without failing every deploy, using a second `Ready with warnings` state.
    - Read the composition revisions with `io.kestra.plugin.core.http.Request` against the Kubernetes API and include the diff in the issue body.
    - Store the last clean marker set in the Kestra KV store and only escalate on markers that are new since the claim was last healthy.
    - Fan the gate across every claim with `io.kestra.plugin.core.flow.ForEachItem` over a claim list, each subflow classifying one claim.

    ## Links

    - [Crossplane documentation](https://docs.crossplane.io/)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra GitHub plugin](https://kestra.io/plugins/plugin-github)
  tags:
    - Infrastructure
  subTags:
    - kubernetes operations
    - infrastructure automation
    - day 2 operations
  ee: false
  demo: false
