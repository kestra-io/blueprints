id: kube-linter-kubernetes-manifest-security-and-hardening-gate
namespace: company.platform

description: |
  Audits Kubernetes YAML manifests and Helm chart templates for container security
  context misconfigurations, privilege escalation risks, host namespace sharing, and
  missing resource limits using KubeLinter in an automated deployment gate. Halts delivery
  pipelines when critical cluster security policies are violated.

inputs:
  - id: manifests_archive
    type: FILE
    displayName: Kubernetes Manifests Archive
    description: Compressed archive (.tar.gz, .tgz, or .zip) containing Kubernetes YAML manifests or rendered Helm charts to audit before cluster apply.
    required: true

  - id: fail_on_critical_security
    type: BOOL
    displayName: Block on Critical Security Violations
    defaults: true
    description: When true, halts execution with an error status if critical security risks (privileged containers, host namespace sharing, sensitive host mounts, wildcard RBAC) are detected.

  - id: fail_on_resource_limits
    type: BOOL
    displayName: Block on Missing Resource Requirements
    defaults: false
    description: When true, also treats missing CPU and memory requests/limits as blocking violations rather than operational advisories.

  - id: slack_channel
    type: STRING
    displayName: Slack Alert Channel
    defaults: "#devsecops-alerts"
    description: Slack channel destination for Kubernetes workload security alerts.

triggers:
  - id: pull_request_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Webhook endpoint called by GitOps and CI/CD pipelines (GitHub Actions, ArgoCD pre-sync hooks, GitLab CI) upon PR update or manifest generation. Streams the uploaded archive into Kestra internal storage and exposes it as trigger.uri."
    key: "{{ secret('KUBELINTER_GATE_WEBHOOK_KEY') }}"
    fetchType: STORE
    disabled: true

tasks:
  - id: run_kubelinter_scan
    type: io.kestra.plugin.scripts.shell.Commands
    description: Extract the Kubernetes manifests archive and execute KubeLinter static analysis in an official container, exporting findings in JSON and plain text formats.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: stackrox/kube-linter:latest
    allowFailure: true
    outputFiles:
      - "kubelinter-report.json"
      - "kubelinter-summary.txt"
    commands:
      - |
        mkdir -p /workspace/manifests
        ARCHIVE_PATH="{{ trigger.uri is defined ? trigger.uri : inputs.manifests_archive }}"

        if [[ "${ARCHIVE_PATH}" == *.tar.gz ]] || [[ "${ARCHIVE_PATH}" == *.tgz ]]; then
          tar -xzf "${ARCHIVE_PATH}" -C /workspace/manifests
        elif [[ "${ARCHIVE_PATH}" == *.zip ]]; then
          unzip -q "${ARCHIVE_PATH}" -d /workspace/manifests
        else
          cp "${ARCHIVE_PATH}" /workspace/manifests/
        fi

        kube-linter lint --format json /workspace/manifests > /workspace/kubelinter-report.json 2>&1 || true
        kube-linter lint --format plain /workspace/manifests > /workspace/kubelinter-summary.txt 2>&1 || true

        cp /workspace/kubelinter-report.json .
        cp /workspace/kubelinter-summary.txt .

        if [ ! -s kubelinter-report.json ] || ! grep -q '^{' kubelinter-report.json; then
          echo '{"Reports": []}' > kubelinter-report.json
        fi

  - id: evaluate_lint_findings
    type: io.kestra.plugin.scripts.python.Script
    description: Parse KubeLinter JSON report, group findings into critical security vs operational advisory categories, and compute an automated deployment gate verdict.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    inputFiles:
      kubelinter-report.json: "{{ read(outputs.run_kubelinter_scan.outputFiles['kubelinter-report.json']) }}"
    outputFiles:
      - "analysis_summary.json"
    script: |
      import json
      import sys

      with open("kubelinter-report.json", "r", encoding="utf-8") as f:
          try:
              raw_result = json.load(f)
          except Exception:
              raw_result = {}

      raw_report = raw_result.get("Reports") or [] if isinstance(raw_result, dict) else []

      # Define check categories
      critical_security_checks = {
          "privileged-container",
          "privileged-ports",
          "host-ipc",
          "host-network",
          "host-pid",
          "sensitive-host-mounts",
          "wildcard-in-rules",
          "no-read-only-root-fs",
          "run-as-non-root",
          "drop-net-raw-capability"
      }

      resource_requirement_checks = {
          "unset-memory-requirements",
          "unset-cpu-requirements"
      }

      fail_on_critical = True if "{{ inputs.fail_on_critical_security }}".lower() in ["true", "1"] else False
      fail_on_resources = True if "{{ inputs.fail_on_resource_limits }}".lower() in ["true", "1"] else False

      critical_violations = []
      resource_violations = []
      advisory_violations = []

      check_counts = {}
      affected_objects = set()

      for item in raw_report:
          check_id = item.get("Check", "unknown-check")
          check_counts[check_id] = check_counts.get(check_id, 0) + 1

          remediation = item.get("Remediation", "")
          diag = item.get("Diagnostic") or {}
          diag_msg = diag.get("Message", "") if isinstance(diag, dict) else str(diag)

          obj = item.get("Object") or {}
          k8s_obj = obj.get("K8sObject") or {} if isinstance(obj, dict) else {}
          gvk = k8s_obj.get("GroupVersionKind") or {} if isinstance(k8s_obj, dict) else {}
          metadata = obj.get("Metadata") or {} if isinstance(obj, dict) else {}

          kind = gvk.get("Kind", "UnknownKind")
          name = k8s_obj.get("Name", "unnamed")
          namespace = k8s_obj.get("Namespace") or "default"
          path = metadata.get("FilePath", "unknown-path")

          object_key = f"{kind}/{name} ({namespace})"
          affected_objects.add(object_key)

          finding = {
              "check": check_id,
              "kind": kind,
              "name": name,
              "namespace": namespace,
              "path": path,
              "message": diag_msg,
              "remediation": remediation
          }

          if check_id in critical_security_checks:
              critical_violations.append(finding)
          elif check_id in resource_requirement_checks:
              resource_violations.append(finding)
          else:
              advisory_violations.append(finding)

      # Determine verdict
      if critical_violations and fail_on_critical:
          verdict = "BLOCK_CRITICAL_SECURITY"
      elif resource_violations and fail_on_resources:
          verdict = "BLOCK_RESOURCE_LIMITS"
      elif critical_violations or resource_violations or advisory_violations:
          verdict = "WARN_POLICY_ADVISORY"
      else:
          verdict = "PASS_COMPLIANT"

      summary = {
          "verdict": verdict,
          "total_violations": len(raw_report),
          "critical_security_count": len(critical_violations),
          "resource_limits_count": len(resource_violations),
          "advisory_count": len(advisory_violations),
          "unique_affected_objects_count": len(affected_objects),
          "top_checks": sorted(check_counts.items(), key=lambda x: x[1], reverse=True)[:10],
          "critical_violations": critical_violations[:15],
          "resource_violations": resource_violations[:15],
          "advisory_violations": advisory_violations[:10]
      }

      with open("analysis_summary.json", "w", encoding="utf-8") as f:
          json.dump(summary, f, indent=2)

      print(f"KubeLinter Evaluation: {verdict}")
      print(f"Total Violations: {len(raw_report)} (Critical: {len(critical_violations)}, Resource Limits: {len(resource_violations)}, Advisories: {len(advisory_violations)})")
      print(f"Affected Kubernetes Objects: {len(affected_objects)}")

  - id: route_gate_verdict
    type: io.kestra.plugin.core.flow.Switch
    description: Route execution and alerting based on KubeLinter manifest compliance verdict.
    value: "{{ fromJson(read(outputs.evaluate_lint_findings.outputFiles['analysis_summary.json'])).verdict }}"
    cases:
      "BLOCK_CRITICAL_SECURITY":
        - id: alert_critical_security
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Alert DevSecOps team when critical container security context or privilege escalation violations are detected.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":rotating_light: *Kubernetes Security Gate: Critical Hardening Violations Detected*",
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "KubeLinter Deployment Gate Failure",
                  "fields": [
                    {
                      "title": "Execution ID",
                      "value": "{{ execution.id }}",
                      "short": true
                    },
                    {
                      "title": "Verdict",
                      "value": "BLOCK_CRITICAL_SECURITY",
                      "short": true
                    },
                    {
                      "title": "Critical Security Flaws",
                      "value": "{{ fromJson(read(outputs.evaluate_lint_findings.outputFiles['analysis_summary.json'])).critical_security_count }}",
                      "short": true
                    },
                    {
                      "title": "Total Violations",
                      "value": "{{ fromJson(read(outputs.evaluate_lint_findings.outputFiles['analysis_summary.json'])).total_violations }}",
                      "short": true
                    },
                    {
                      "title": "Affected Workloads",
                      "value": "{{ fromJson(read(outputs.evaluate_lint_findings.outputFiles['analysis_summary.json'])).unique_affected_objects_count }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra Kubernetes Gate | StackRox KubeLinter"
                }
              ]
            }

        - id: fail_critical_security
          type: io.kestra.plugin.core.execution.Fail
          description: Halt delivery pipeline to prevent insecure Kubernetes manifests from reaching production clusters.
          errorMessage: "Kubernetes deployment gate rejected manifests: critical container security context violations (privileged mode, host namespace sharing, or sensitive mounts) detected."

      "BLOCK_RESOURCE_LIMITS":
        - id: alert_resource_limits
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Alert engineering team when workloads violate strict cluster resource limit policies.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":warning: *Kubernetes Security Gate: Missing Workload Resource Limits*",
              "attachments": [
                {
                  "color": "#FF5722",
                  "title": "KubeLinter Resource Policy Failure",
                  "fields": [
                    {
                      "title": "Execution ID",
                      "value": "{{ execution.id }}",
                      "short": true
                    },
                    {
                      "title": "Missing Resource Requirements",
                      "value": "{{ fromJson(read(outputs.evaluate_lint_findings.outputFiles['analysis_summary.json'])).resource_limits_count }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra Kubernetes Gate | StackRox KubeLinter"
                }
              ]
            }

        - id: fail_resource_limits
          type: io.kestra.plugin.core.execution.Fail
          description: Halt deployment when resource limit compliance is strictly required.
          errorMessage: "Kubernetes deployment gate rejected manifests: CPU or memory resource requirements are unset on target containers."

      "WARN_POLICY_ADVISORY":
        - id: alert_policy_advisory
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Send advisory summary to Slack for operational best practices without failing the deployment.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":information_source: *Kubernetes Security Gate: Non-Blocking Policy Advisories*",
              "attachments": [
                {
                  "color": "#FFA000",
                  "title": "KubeLinter Operational Advisory",
                  "fields": [
                    {
                      "title": "Execution ID",
                      "value": "{{ execution.id }}",
                      "short": true
                    },
                    {
                      "title": "Verdict",
                      "value": "WARN_POLICY_ADVISORY",
                      "short": true
                    },
                    {
                      "title": "Advisory Violations",
                      "value": "{{ fromJson(read(outputs.evaluate_lint_findings.outputFiles['analysis_summary.json'])).advisory_count }}",
                      "short": true
                    },
                    {
                      "title": "Affected Objects",
                      "value": "{{ fromJson(read(outputs.evaluate_lint_findings.outputFiles['analysis_summary.json'])).unique_affected_objects_count }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra Kubernetes Gate | StackRox KubeLinter"
                }
              ]
            }

        - id: log_policy_advisories
          type: io.kestra.plugin.core.log.Log
          message: "KubeLinter identified operational advisories. Deployment allowed to proceed."

      "PASS_COMPLIANT":
        - id: log_clean_compliance
          type: io.kestra.plugin.core.log.Log
          message: "KubeLinter audit completed cleanly: all Kubernetes manifests comply with cluster security and hardening standards."

  - id: audit_compliance_record
    type: io.kestra.plugin.core.log.Log
    description: Record structured security audit metrics for SOC2, CIS benchmark compliance, and platform traceability.
    message: "KubeLinter Gate Audit Complete: execution={{ execution.id }}, verdict={{ fromJson(read(outputs.evaluate_lint_findings.outputFiles['analysis_summary.json'])).verdict }}, total_violations={{ fromJson(read(outputs.evaluate_lint_findings.outputFiles['analysis_summary.json'])).total_violations }}, critical_security={{ fromJson(read(outputs.evaluate_lint_findings.outputFiles['analysis_summary.json'])).critical_security_count }}, affected_objects={{ fromJson(read(outputs.evaluate_lint_findings.outputFiles['analysis_summary.json'])).unique_affected_objects_count }}."

extend:
  title: Enforce Kubernetes Security Best Practices and Hardening with KubeLinter
  metaTitle: Kubernetes Manifest Security and Hardening Gate with KubeLinter | Kestra
  shortDescription: Audit Kubernetes manifests and Helm charts for security context flaws, privileged escalation, and missing resource limits with KubeLinter in an automated gate.
  metaDescription: Audit Kubernetes manifests for security flaws, privileged escalation, and missing resource limits using KubeLinter in a containerized CI/CD deployment gate.
  description: |
    Audits Kubernetes YAML manifests, DaemonSets, Deployments, and rendered Helm charts
    for container security context vulnerabilities, privilege escalation vectors, host
    namespace sharing, and missing resource constraints using Red Hat StackRox KubeLinter.
    Runs static analysis inside an official container, categorizes findings into critical
    security versus operational best practices, alerts platform teams via Slack, and halts
    GitOps or CI/CD pipelines before misconfigured workloads are applied to production clusters.

    ## How it works

    1. **Triggering and Ingestion**: The workflow triggers on-demand with an uploaded Kubernetes manifest archive or via `io.kestra.plugin.core.trigger.Webhook` configured as a pre-commit or pre-sync hook in GitHub Actions, GitLab CI, or ArgoCD.
    2. **Containerized Lint Scan**: The `run_kubelinter_scan` task extracts the manifests archive into an isolated workspace and runs `stackrox/kube-linter:latest` across all YAML files. It produces structured JSON (`--format json`) and plain text reports while handling non-zero exit codes cleanly.
    3. **Findings Classification**: The `evaluate_lint_findings` Python task categorizes findings into critical security risks (`privileged-container`, `host-ipc`, `host-network`, `host-pid`, `sensitive-host-mounts`, `wildcard-in-rules`, `no-read-only-root-fs`), resource constraints (`unset-memory-requirements`, `unset-cpu-requirements`), and general best practices (`latest-tag`, `default-service-account`).
    4. **Policy Enforcement Routing**: The `route_gate_verdict` `Switch` task evaluates the computed verdict (`BLOCK_CRITICAL_SECURITY`, `BLOCK_RESOURCE_LIMITS`, `WARN_POLICY_ADVISORY`, or `PASS_COMPLIANT`).
    5. **Alerting and Execution Control**: For critical security breaches, the flow dispatches a Slack Block Kit alert via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` and halts the release using `io.kestra.plugin.core.execution.Fail`. For non-blocking advisories, an informational alert is sent while allowing the pipeline to proceed.
    6. **Compliance Audit Record**: The `audit_compliance_record` task logs the execution verdict, violation counts, and affected workloads for SOC2, CIS Kubernetes benchmark, and platform audit compliance.

    ## What you get

    - Automated workload security gating enforcing CIS Kubernetes benchmark and Pod Security Standards (PSS) before cluster deployment.
    - Early prevention of dangerous container privileges, root user execution, host PID/network sharing, and sensitive volume mounts.
    - Configurable resource quota policies distinguishing hard cluster security blockers from soft operational recommendations.
    - Rich Slack notifications pinpointing exact Kubernetes resource kinds, namespaces, names, and remediation actions.
    - Zero local tool installation dependencies running entirely inside containerized Docker workers.

    ## Who it's for

    - Platform Engineers and Kubernetes Administrators enforcing workload hardening policies.
    - DevSecOps Engineers implementing automated pre-deployment guardrails in CI/CD.
    - Application Developers seeking fast, actionable feedback on Kubernetes YAML and Helm templates.

    ## Why orchestrate this with Kestra

    - **Declarative Policy as Code**: Manage Kubernetes deployment gates alongside workflow definitions and infrastructure automation.
    - **Containerized Portability**: Run official `stackrox/kube-linter` containers on any Docker or Kubernetes worker without local binary maintenance.
    - **Event-Driven GitOps Integration**: Wire scans directly into CI/CD webhooks or ArgoCD sync pre-hooks with secure token validation.
    - **Intelligent Flow Routing**: Distinguish blocking security vulnerabilities from non-blocking advisories with native Switch and If logic.

    ## Prerequisites

    - A Docker-compatible Kestra task runner (Docker or Kubernetes runner).
    - Incoming Webhook URL for Slack alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Webhook URL for publishing DevSecOps alerts into Slack.
    - `KUBELINTER_GATE_WEBHOOK_KEY`: Authentication secret key protecting the event-driven webhook trigger.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` and `KUBELINTER_GATE_WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Package your Kubernetes YAML manifests or rendered Helm charts into a `.tar.gz` or `.zip` archive.
    3. Execute the workflow manually, uploading the archive to `manifests_archive`.
    4. Inspect execution logs, review the generated `analysis_summary.json`, and verify Slack notifications.
    5. Enable `pull_request_webhook` to automate scans on every pull request or GitOps commit.

    ## How to extend

    - **SARIF Code Scanning**: Export findings using `--format sarif` and upload to GitHub Advanced Security.
    - **ArgoCD Pre-Sync Hook**: Configure Kestra to block or allow ArgoCD sync operations via webhook return status.
    - **Jira Issue Creation**: Automatically create Jira tickets for unresolved operational advisories.

    ## Links

    - [KubeLinter Documentation](https://docs.kubelinter.io/)
    - [KubeLinter GitHub Repository](https://github.com/stackrox/kube-linter)
    - [Kestra Docker Task Runner](https://kestra.io/plugins/plugin-scripts-runner-docker)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Kubernetes Operations
  ee: false
  demo: false