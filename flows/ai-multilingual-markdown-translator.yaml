id: ai-multilingual-markdown-translator
namespace: company.team
description: |
  Concurrent multi-language documentation and content localization pipeline. Translates raw
  Markdown documents into Spanish, German, and French in parallel using OpenAI GPT-4o, validates
  output integrity, and delivers localized publication bundles with Slack notifications.

concurrency:
  limit: 1

inputs:
  - id: source_markdown
    type: STRING
    displayName: Source Markdown Content
    description: Raw markdown text to translate into multiple languages simultaneously.
    defaults: |
      # Product Launch: Autonomous Workflow Engine v2.0

      We are excited to announce the general availability of our next-generation orchestration platform.

      ### Key Features
      - **Sub-millisecond scheduling latency**: Execute mission-critical pipelines with deterministic precision.
      - **Zero-warehouse analytics**: Ingest and curate Parquet files in memory with embedded DuckDB.
      - **Declarative AI integrations**: Connect OpenAI, Anthropic, and Gemini models with first-class tasks.

      ### Getting Started
      Deploy our official Docker container or connect your Kubernetes cluster using our Helm chart. Visit our documentation portal for quickstart guides and configuration templates.

  - id: model
    type: STRING
    displayName: OpenAI Model
    description: OpenAI LLM identifier used for high-fidelity translation and technical tone matching.
    defaults: "gpt-4o-mini"

  - id: slack_channel
    type: STRING
    displayName: Slack Notification Channel
    description: Destination channel for localization publication digests.
    defaults: "#localization-updates"

triggers:
  - id: daily_localization_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily scheduled batch localization run at 03:00 UTC. Can also run on-demand.
    cron: "0 3 * * *"

tasks:
  - id: inspect_source
    type: io.kestra.plugin.core.debug.Return
    description: Extract document statistics and initialize localization metadata.
    format: |
      {
        "source_length_chars": {{ inputs.source_markdown | length }},
        "requested_model": "{{ inputs.model }}",
        "timestamp": "{{ execution.startDate }}"
      }

  - id: parallel_translations
    type: io.kestra.plugin.core.flow.Parallel
    description: Fan out concurrent translation requests across target languages to minimize latency.
    tasks:
      - id: translate_spanish
        type: io.kestra.plugin.openai.ChatCompletion
        description: Translate markdown source into fluent, technically accurate Spanish.
        apiKey: "{{ secret('OPENAI_API_KEY') }}"
        model: "{{ inputs.model }}"
        messages:
          - role: system
            content: |
              You are an expert technical translator specializing in software documentation.
              Translate the user's markdown into Spanish (Español).
              Preserve all markdown syntax, headers, code blocks, bullet points, and technical terms intact.
              Return ONLY the translated markdown with no conversational preamble or outro.
          - role: user
            content: "{{ inputs.source_markdown }}"

      - id: translate_german
        type: io.kestra.plugin.openai.ChatCompletion
        description: Translate markdown source into precise, professional German.
        apiKey: "{{ secret('OPENAI_API_KEY') }}"
        model: "{{ inputs.model }}"
        messages:
          - role: system
            content: |
              You are an expert technical translator specializing in software documentation.
              Translate the user's markdown into German (Deutsch).
              Preserve all markdown syntax, headers, code blocks, bullet points, and technical terms intact.
              Return ONLY the translated markdown with no conversational preamble or outro.
          - role: user
            content: "{{ inputs.source_markdown }}"

      - id: translate_french
        type: io.kestra.plugin.openai.ChatCompletion
        description: Translate markdown source into natural, idiomatic French.
        apiKey: "{{ secret('OPENAI_API_KEY') }}"
        model: "{{ inputs.model }}"
        messages:
          - role: system
            content: |
              You are an expert technical translator specializing in software documentation.
              Translate the user's markdown into French (Français).
              Preserve all markdown syntax, headers, code blocks, bullet points, and technical terms intact.
              Return ONLY the translated markdown with no conversational preamble or outro.
          - role: user
            content: "{{ inputs.source_markdown }}"

  - id: verify_translations
    type: io.kestra.plugin.core.flow.If
    description: Validate that all concurrent translation tasks generated complete markdown outputs.
    condition: "{{ outputs.translate_spanish.choices[0].message.content != null and outputs.translate_german.choices[0].message.content != null and outputs.translate_french.choices[0].message.content != null }}"
    then:
      - id: bundle_localized_content
        type: io.kestra.plugin.core.debug.Return
        description: Aggregate all localized versions into a unified multi-language payload.
        format: |
          {
            "languages": ["es", "de", "fr"],
            "translations": {
              "es": {{ outputs.translate_spanish.choices[0].message.content | json }},
              "de": {{ outputs.translate_german.choices[0].message.content | json }},
              "fr": {{ outputs.translate_french.choices[0].message.content | json }}
            }
          }

      - id: notify_slack_localization
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch localization completion summary and preview card to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          *Multilingual Content Localization Complete*
          • *Source Document Size*: `{{ outputs.inspect_source.value.source_length_chars }}` characters
          • *Model Used*: `{{ inputs.model }}`
          • *Generated Locales*: Spanish (`es`), German (`de`), French (`fr`)
          • *Status*: All 3 parallel translations verified and bundled successfully.

    else:
      - id: log_translation_failure
        type: io.kestra.plugin.core.log.Log
        description: Alert on missing or empty translation responses.
        message: "Localization failure: One or more language translations returned empty payloads. Check OpenAI API quotas."

  - id: export_localization_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emit final publication manifest for downstream static site generator or CMS sync.
    format: |
      {
        "pipeline": "ai-multilingual-markdown-translator",
        "processed_at": "{{ execution.startDate }}",
        "locales_generated": 3,
        "verification_status": "{{ outputs.verify_translations.outputs != null ? 'SUCCESS' : 'FAILED' }}"
      }

extend:
  shortDescription: Translate markdown documentation into Spanish, German, and French concurrently with OpenAI in parallel, with quality gates and Slack notifications.
  title: Parallel Multilingual Markdown Translation with OpenAI
  metaTitle: Parallel Markdown Translation with OpenAI & Slack in Kestra
  metaDescription: Automated workflow to translate markdown documents into Spanish, German, and French simultaneously using OpenAI GPT-4o with Slack notifications.
  description: |
    Global software companies and open-source projects need their product documentation, changelogs, and release announcements available in multiple languages. Translating documents sequentially is slow, and relying on external translation agencies creates days of release friction.

    This blueprint implements an automated, high-speed documentation localization pipeline using OpenAI and Kestra. It takes any raw Markdown document, fans out parallel translation requests across Spanish, German, and French concurrently, enforces output completeness checks, bundles the localized markdown files, and broadcasts a publication summary into Slack.

    ## How it works

    1. **Trigger & Inputs**: The `daily_localization_schedule` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires automatically at 03:00 UTC, or runs on-demand with custom markdown text passed via `inputs.source_markdown`.
    2. **Source Inspection**: The `inspect_source` task (`io.kestra.plugin.core.debug.Return`) measures source document length and records the execution timestamp.
    3. **Parallel Execution Fan-Out**: The `parallel_translations` flowable task (`io.kestra.plugin.core.flow.Parallel`) dispatches three concurrent translation tasks:
       - `translate_spanish` (`io.kestra.plugin.openai.ChatCompletion`): Translates to idiomatic technical Spanish while preserving markdown structure and code blocks.
       - `translate_german` (`io.kestra.plugin.openai.ChatCompletion`): Translates to precise technical German.
       - `translate_french` (`io.kestra.plugin.openai.ChatCompletion`): Translates to natural technical French.
    4. **Quality Verification Gate**: The `verify_translations` flowable task (`io.kestra.plugin.core.flow.If`) verifies that all three language branches completed successfully with non-null content.
    5. **Bundle & Notify**: On success, `bundle_localized_content` packages all three translations into structured JSON, and `notify_slack_localization` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) sends a release summary to Slack.
    6. **Publish Manifest**: The `export_localization_manifest` task records execution audit details for downstream CMS or Git commit triggers.

    ## What you get

    - 3x faster translation speeds by running language models concurrently in parallel.
    - Preserved markdown formatting, headers, lists, code fences, and links.
    - Zero human bottleneck for multi-language release notes and docs.
    - Automated verification to catch partial or empty API responses.
    - Immediate team visibility in Slack.

    ## Who it's for

    - Developer relations and technical writing teams maintaining multilingual documentation portals.
    - Product marketing teams publishing global release announcements.
    - Open source maintainers localizing READMEs and community guides.

    ## Why orchestrate this with Kestra

    Calling LLMs in a loop inside ad-hoc scripts is brittle: timeouts fail the entire run, there is no built-in retry logic, and tasks execute sequentially rather than concurrently. Kestra's `io.kestra.plugin.core.flow.Parallel` runs all target languages concurrently, isolates task logs per language, and manages secrets cleanly.

    ## Prerequisites

    - A running Kestra instance.
    - An OpenAI API key with access to `gpt-4o-mini` or `gpt-4o`.
    - (Optional) A Slack Incoming Webhook URL to receive publication updates.

    ### Secrets

    - `OPENAI_API_KEY`: API key for OpenAI model completions.
    - `SLACK_WEBHOOK_URL`: (Optional) Slack Incoming Webhook URL for publication alerts.

    ## Quick start

    1. Add `OPENAI_API_KEY` (and optionally `SLACK_WEBHOOK_URL`) to your Kestra namespace secrets.
    2. Import the flow YAML into Kestra.
    3. Click **Execute** in the UI to run the pipeline with the default product launch announcement.
    4. Inspect the localized Spanish, German, and French translations in the **Outputs** tab.

    ## How to extend

    - Add additional parallel language branches (e.g. Japanese `ja`, Portuguese `pt`, Italian `it`).
    - Add a `io.kestra.plugin.git.Push` task inside the `then:` block to commit the translated `.md` files directly to your documentation repository.
    - Connect a `io.kestra.plugin.core.trigger.Webhook` so new GitHub release drafts trigger automated translations automatically.

    ## Links

    - Kestra OpenAI Plugin Documentation: https://kestra.io/plugins/plugin-openai
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
  tags:
    - AI
    - Business
  subTags:
    - Content & Documentation
    - Multi-Language Localization
  ee: false
  demo: false
