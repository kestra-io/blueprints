id: dragonfly-cluster-replication-offset-drift-sentinel
namespace: company.team

description: |
  Audits Dragonfly in-memory datastore cluster telemetry to detect replica offset drift, replication stream desync, and stale cache reads.

concurrency:
  limit: 1

inputs:
  - id: dragonfly_metrics_url
    type: STRING
    displayName: "Dragonfly Metrics Endpoint"
    defaults: "http://dragonfly-master.cache.svc.cluster.local:6379/metrics"
    description: "Base HTTP URL exposing Prometheus metrics for the Dragonfly in-memory datastore master node."

  - id: cluster_name
    type: STRING
    displayName: "Target Cluster"
    defaults: "dragonfly-production-cache"
    description: "Identifier of the target Dragonfly in-memory cluster under active replication surveillance."

  - id: max_offset_drift_bytes
    type: INT
    displayName: "Max Offset Drift (Bytes)"
    defaults: 1048576
    description: "Maximum allowable replication offset lag in bytes between primary and replica nodes before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which Dragonfly replication metrics are evaluated."

  - id: alert_on_drift
    type: BOOL
    displayName: "Alert On Offset Drift"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting elevated replication offset drift."

tasks:
  - id: scan_dragonfly_replication_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates Dragonfly Prometheus metrics to evaluate replication stream offsets, replica connection state, and lag bytes.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.dragonfly_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_DRIFT: "{{ inputs.max_offset_drift_bytes }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    outputFiles:
      - dragonfly_replication_drift.json
    script: |
      import os
      import sys
      import re
      import json
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://dragonfly-master:6379/metrics")
      cluster_name = os.environ.get("CLUSTER_NAME", "dragonfly-cache")
      max_drift = int(os.environ.get("MAX_DRIFT", "1048576"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      master_repl_offset = 0
      replica_repl_offset = 0
      connected_replicas = 0

      try:
          resp = requests.get(metrics_url, timeout=15)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "dragonfly_master_repl_offset" in line or "master_repl_offset" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      master_repl_offset = int(float(match.group(1)))
              elif "dragonfly_replica_repl_offset" in line or "replica_repl_offset" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      replica_repl_offset = int(float(match.group(1)))
              elif "dragonfly_connected_slaves" in line or "connected_slaves" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      connected_replicas = int(float(match.group(1)))
      except Exception as err:
          print(f"ERROR: Failed to reach Dragonfly metrics endpoint '{metrics_url}': {err}", file=sys.stderr)
          sys.exit(1)

      offset_drift = abs(master_repl_offset - replica_repl_offset) if master_repl_offset > 0 else 0
      is_breached = bool(offset_drift >= max_drift or connected_replicas == 0)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Dragonfly Audit Complete: Master={master_repl_offset}, Replica={replica_repl_offset}, Drift={offset_drift} bytes, Slaves={connected_replicas}, Alert={is_breached}")

      report = {
          "master_repl_offset": master_repl_offset,
          "replica_repl_offset": replica_repl_offset,
          "replication_offset_drift_bytes": offset_drift,
          "connected_replicas_count": connected_replicas,
          "is_alerting": is_breached,
          "cluster_target": cluster_name,
          "audit_timestamp": now_iso
      }
      with open("dragonfly_replication_drift.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs(report)

  - id: evaluate_drift_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Dragonfly cluster replication offset drift or missing replica connections breach safety limits.
    condition: "{{ outputs.scan_dragonfly_replication_metrics.vars.is_alerting and inputs.alert_on_drift }}"
    then:
      - id: notify_slack_cache_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Slack channel detailing Dragonfly replication desynchronization.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#cache-reliability-alerts",
            "username": "Dragonfly Cluster Sentinel",
            "icon_emoji": ":warning:",
            "text": "CRITICAL: Dragonfly cluster replication offset drift detected on `{{ inputs.cluster_name }}`. Drift: `{{ outputs.scan_dragonfly_replication_metrics.vars.replication_offset_drift_bytes }} bytes` (threshold: `{{ inputs.max_offset_drift_bytes }} bytes`). Connected Replicas: `{{ outputs.scan_dragonfly_replication_metrics.vars.connected_replicas_count }}`. Read-replica queries may be serving stale cache data."
          }
    else:
      - id: log_nominal_dragonfly_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Dragonfly in-memory datastore cluster replicates with minimal offset drift.
        message: "Dragonfly cluster {{ inputs.cluster_name }} nominal. Replication offset drift {{ outputs.scan_dragonfly_replication_metrics.vars.replication_offset_drift_bytes }} bytes is below threshold {{ inputs.max_offset_drift_bytes }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit payload for cache cluster observability tracking, SRE dashboards, and audit logs.
    format: |
      {
        "sentinel_id": "dragonfly-cluster-replication-offset-drift-sentinel",
        "cluster": "{{ inputs.cluster_name }}",
        "master_offset": {{ outputs.scan_dragonfly_replication_metrics.vars.master_repl_offset }},
        "replica_offset": {{ outputs.scan_dragonfly_replication_metrics.vars.replica_repl_offset }},
        "offset_drift_bytes": {{ outputs.scan_dragonfly_replication_metrics.vars.replication_offset_drift_bytes }},
        "connected_slaves": {{ outputs.scan_dragonfly_replication_metrics.vars.connected_replicas_count }},
        "breached": {{ outputs.scan_dragonfly_replication_metrics.vars.is_alerting }}
      }

errors:
  - id: notify_dragonfly_sentinel_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches alert to Slack when Dragonfly Replication Sentinel fails execution.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#cache-reliability-alerts",
        "username": "Dragonfly Cluster Sentinel",
        "icon_emoji": ":warning:",
        "text": "CRITICAL: Dragonfly Replication Sentinel execution failed for cluster `{{ inputs.cluster_name }}` on execution `{{ execution.id }}`. Check Dragonfly metrics endpoint reachability."
      }

triggers:
  - id: periodic_replication_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Dragonfly Cluster Replication Offset Drift Sentinel
  metaTitle: Dragonfly Cluster Replication Offset Drift Sentinel Blueprint
  shortDescription: Audits Dragonfly in-memory datastore cluster metrics for replica stream offset drift and replica connection drops.
  metaDescription: Audits Dragonfly in-memory datastore cluster metrics for replica stream offset drift and replica connection drops with automated Slack alerting.
  description: |
    Dragonfly supports primary-replica replication topologies for read-scaling and disaster recovery. When replication offsets drift excessively due to network partitions or heavy write volume, read queries directed to replicas return stale or inconsistent data. This sentinel interrogates Dragonfly Prometheus metrics, measures offset drift between primary and secondary nodes, and triggers Slack alerts to SRE teams.

    ## How it works
    1. Interrogates Dragonfly Prometheus metrics endpoint using a containerized Python script.
    2. Parses `master_repl_offset`, `replica_repl_offset`, and `connected_slaves`.
    3. Evaluates offset lag bytes against configured thresholds.
    4. Dispatches Slack notifications on drift and exports structured audit manifest.

    ## Prerequisites
    - Reachable Dragonfly Prometheus metrics endpoint.
    - Slack Incoming Webhook secret configured.
  tags:
    - Infrastructure
    - Database
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
