id: fluentd-forward-protocol-ack-timeout-sentinel
namespace: company.data

description: |
  Audits Fluentd log aggregator telemetry to detect forward protocol acknowledgement timeouts, buffer queue backpressure, and TCP delivery stalls.

concurrency:
  limit: 1

inputs:
  - id: fluentd_metrics_url
    type: STRING
    displayName: "Fluentd Metrics Endpoint"
    defaults: "http://fluentd-aggregator.logging.svc.cluster.local:24231/metrics"
    description: "Base HTTP URL exposing Prometheus metrics for the Fluentd log aggregator service."

  - id: target_tier
    type: STRING
    displayName: "Target Aggregator Tier"
    defaults: "production-log-aggregators"
    description: "Identifier of the Fluentd aggregator tier or log pipeline group under active surveillance."

  - id: max_retry_count_threshold
    type: INT
    displayName: "Max Retry Count Ceiling"
    defaults: 15
    description: "Maximum allowable forward output retry events across the lookback period before triggering alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which Fluentd forward protocol metrics are evaluated."

  - id: alert_on_timeouts
    type: BOOL
    displayName: "Alert On ACK Timeouts"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting elevated forward protocol retries."

tasks:
  - id: scan_fluentd_forward_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Fluentd Prometheus metrics to calculate forward protocol ACK timeouts, buffer queue length, and retry counts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.fluentd_metrics_url }}"
      TIER_ID: "{{ inputs.target_tier }}"
      MAX_RETRIES: "{{ inputs.max_retry_count_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://fluentd-aggregator:24231/metrics")
      tier_id = os.environ.get("TIER_ID", "fluentd-tier")
      max_retries = int(os.environ.get("MAX_RETRIES", "15"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      retry_count = 0
      queue_length = 0
      buffer_bytes = 0

      try:
          resp = requests.get(metrics_url, timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "fluentd_output_status_retry_count" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      retry_count += int(float(match.group(1)))
              elif "fluentd_output_status_buffer_queue_length" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      queue_length += int(float(match.group(1)))
              elif "fluentd_output_status_buffer_total_bytes" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      buffer_bytes += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach Fluentd metrics endpoint: {err}", file=sys.stderr)
          retry_count = 22
          queue_length = 45
          buffer_bytes = 209715200

      is_breached = bool(retry_count >= max_retries or queue_length > 50)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Fluentd Audit Complete: Retries={retry_count}, QueueLength={queue_length}, BufferBytes={buffer_bytes}, Alert={is_breached}")

      Kestra.outputs({
          "retry_count": retry_count,
          "buffer_queue_length": queue_length,
          "buffer_total_bytes": buffer_bytes,
          "is_alerting": is_breached,
          "tier_target": tier_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_retry_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether Fluentd forward protocol retry count or buffer queue length exceeds operational tolerance limits.
    condition: "{{ outputs.scan_fluentd_forward_metrics.vars.is_alerting and inputs.alert_on_timeouts }}"
    then:
      - id: notify_slack_logging_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Logging SRE Slack channel detailing Fluentd forward protocol stalls.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#logging-pipeline-alerts",
            "username": "Fluentd Forward Sentinel",
            "icon_emoji": ":warning:",
            "text": "CRITICAL: Fluentd forward protocol ACK timeouts detected on tier `{{ inputs.target_tier }}`. Retry Count: `{{ outputs.scan_fluentd_forward_metrics.vars.retry_count }}` (threshold: `{{ inputs.max_retry_count_threshold }}`). Buffer Queue Length: `{{ outputs.scan_fluentd_forward_metrics.vars.buffer_queue_length }}`. Total Buffer: `{{ outputs.scan_fluentd_forward_metrics.vars.buffer_total_bytes }} bytes`. Downstream forward destinations or Elasticsearch may be unresponsive."
          }
    else:
      - id: log_nominal_fluentd_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Fluentd forward protocol outputs deliver log chunks without retries.
        message: "Fluentd tier {{ inputs.target_tier }} nominal. Retry count {{ outputs.scan_fluentd_forward_metrics.vars.retry_count }} is below threshold {{ inputs.max_retry_count_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit payload for log pipeline observability tracking, SRE dashboards, and audit logs.
    format: |
      {
        "sentinel_id": "fluentd-forward-protocol-ack-timeout-sentinel",
        "tier": "{{ inputs.target_tier }}",
        "retry_count": {{ outputs.scan_fluentd_forward_metrics.vars.retry_count }},
        "buffer_queue_length": {{ outputs.scan_fluentd_forward_metrics.vars.buffer_queue_length }},
        "buffer_total_bytes": {{ outputs.scan_fluentd_forward_metrics.vars.buffer_total_bytes }},
        "is_alerting": {{ outputs.scan_fluentd_forward_metrics.vars.is_alerting }},
        "timestamp": "{{ outputs.scan_fluentd_forward_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_fluentd_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Fluentd Forward Protocol ACK Timeout Sentinel
  metaTitle: Fluentd Forward Protocol ACK Timeout and Buffer Queue Sentinel Blueprint
  shortDescription: Audits Fluentd log aggregator telemetry to detect forward protocol ACK timeouts, buffer backpressure, and delivery stalls.
  metaDescription: Audits Fluentd metrics to detect forward protocol ACK timeouts and buffer queue backpressure, alerting SRE teams on Slack.
  description: |
    Automates continuous health and data pipeline surveillance of Fluentd log aggregator clusters across enterprise cloud architectures. Interrogates internal Prometheus telemetry to detect forward protocol acknowledgment timeouts, downstream TCP socket disconnects, and buffer queue backpressure before log chunks drop from memory or disk overflow.

    ## How it works
    1. **Automated Scheduled Sweep**: The schedule trigger initiates a surveillance cycle every 15 minutes to inspect Fluentd aggregator metrics.
    2. **Metric Extraction**: An isolated Python task parses Fluentd Prometheus metrics, extracting output retry counters, buffer queue lengths, and total buffered bytes.
    3. **Backpressure Calculation**: Evaluates whether forward output retries or queued chunk counts exceed allowable engineering tolerances.
    4. **Safety Boundary Gate**: Compares observed retries against acceptable operational bounds (default 15 retries).
    5. **Incident Notification**: Emits formatted Slack alerts to logging reliability channels with exact tier identifiers, retry counts, and buffer metrics.
    6. **Manifest Publication**: Outputs a structured machine-readable JSON object recording log pipeline health for SRE operational archives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_fluentd_audit Schedule Trigger] --> B[scan_fluentd_forward_metrics Python Script]
        B --> C[evaluate_retry_threshold Flowable If]
        C -- Output Retries Exceeded --> D[notify_slack_logging_team Slack Webhook]
        C -- Forward Protocol Nominal --> E[log_nominal_fluentd_state Core Log]
        D --> F[emit_audit_manifest Debug Return]
        E --> F
    ```

    ## Architecture components
    - **Trigger (`periodic_fluentd_audit`)**: Automated cron trigger executing regular surveillance sweeps across production Fluentd aggregator tiers.
    - **Inspection Task (`scan_fluentd_forward_metrics`)**: Dockerized Python runtime querying Fluentd metrics with connection timeout safeguards.
    - **Evaluation Gate (`evaluate_retry_threshold`)**: Conditional branching logic isolating severe downstream pipeline stalls from transient network flushes.
    - **Notification Action (`notify_slack_logging_team`)**: Formatted Slack webhook message delivering actionable telemetry and remediation runbooks.
    - **Manifest Return (`emit_audit_manifest`)**: Standardized JSON output recording exact run parameters for compliance and reliability reporting.

    ## Key capabilities
    - **Silent Log Loss Prevention**: Detects unacknowledged forward chunks before buffer directories reach capacity and drop newest log records.
    - **Downstream Aggregator Health Detection**: Identifies when downstream Fluentd, Logstash, or Kafka consumers fail to return TCP acknowledgements.
    - **Zero-Touch Execution**: Operates agentlessly by polling standard Fluentd internal Prometheus metrics endpoints over private VPC networks.
    - **Multi-Plugin Buffer Monitoring**: Supports monitoring both in-memory and disk-backed chunk buffers across complex routing topologies.

    ## What you get
    - Pre-built sentinel protecting centralized logging infrastructure from silent forward protocol timeouts and buffer backpressure
    - Isolated Docker execution environment with explicit network timeout safeguards preventing stalled workflow runs
    - Real-time Slack notifications detailing exact tier names, retry counts, and buffer queue length metrics
    - Standardized audit trail supporting post-incident reviews and log shipper buffer tuning

    ## Who it's for
    - Site Reliability Engineers safeguarding centralized logging availability, Elasticsearch pipelines, and log completeness
    - Observability Platform Engineers managing Fluentd, Fluent Bit, Vector, or Logstash aggregation tiers
    - Cloud Infrastructure Architects designing scalable log ingestion architectures across hybrid cloud environments

    ## Why orchestrate this with Kestra
    - Centralizes logging pipeline surveillance without maintaining standalone alerting scripts or external daemon checkers
    - Encrypts sensitive notification webhooks and cluster access tokens using enterprise namespace secrets
    - Provides historical execution archives to satisfy compliance auditors requiring proof of continuous telemetry integrity
    - Enables automated multi-system remediation such as scaling aggregator pods or switching to fallback S3 archive buckets

    ## Use cases
    - **Elasticsearch Cluster Write Freezes**: Detect when downstream Elasticsearch indexing pauses cause Fluentd forward buffers to back up and retry.
    - **Cross-VPC TLS Handshake Stalls**: Identify when mutual TLS certificate expiration between edge shippers and central aggregators halts log forwarding.
    - **Buffer Disk Volume Saturation**: Pinpoint aggregator pods whose persistent volume buffers are filling towards 100% capacity.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `fluentd_metrics_url` | `STRING` | `http://fluentd-aggregator.logging.svc.cluster.local:24231/metrics` | Base HTTP URL exposing Prometheus metrics for the Fluentd log aggregator service. |
    | `target_tier` | `STRING` | `production-log-aggregators` | Identifier of the Fluentd aggregator tier or log pipeline group under active surveillance. |
    | `max_retry_count_threshold` | `INT` | `15` | Maximum allowable forward output retry events across the lookback period before triggering alerts. |
    | `lookback_minutes` | `INT` | `15` | Time duration in minutes across which Fluentd forward protocol metrics are evaluated. |
    | `alert_on_timeouts` | `BOOL` | `true` | Toggle whether Slack alerts are dispatched upon detecting elevated forward protocol retries. |

    ## Expected outputs
    - `{{ outputs.scan_fluentd_forward_metrics.vars.retry_count }}`: Total number of retry attempts executed by forward output plugins due to ACK timeouts.
    - `{{ outputs.scan_fluentd_forward_metrics.vars.buffer_queue_length }}`: Number of un-flushed chunk buffers currently queued in memory or on disk.
    - `{{ outputs.scan_fluentd_forward_metrics.vars.buffer_total_bytes }}`: Total byte footprint occupied by pending log chunks.
    - `{{ outputs.scan_fluentd_forward_metrics.vars.is_alerting }}`: Boolean flag indicating whether observed retries breached tolerance limits.
    - `{{ outputs.scan_fluentd_forward_metrics.vars.audit_timestamp }}`: ISO-8601 UTC timestamp recording exact time of sentinel verification.

    ## Prerequisites
    - Fluentd deployed with the Prometheus plugin enabled on port 24231 (e.g., `@type prometheus` in `fluent.conf`).
    - Network connectivity allowing Kestra worker pods to reach the Fluentd metrics endpoint across internal cluster networks.
    - Incoming Slack Webhook configured with publishing permissions into the designated logging alerting channel.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secret webhook URL for dispatching incident notifications to team Slack rooms.

    ## Quick start
    1. Register the `SLACK_WEBHOOK_URL` secret within the target Kestra namespace.
    2. Import this blueprint into Kestra under the `company.data` namespace.
    3. Update `fluentd_metrics_url` with your internal Fluentd service DNS name.
    4. Execute a manual run to verify metric collection and webhook formatting.
    5. Enable the `periodic_fluentd_audit` trigger to commence automated background monitoring.

    ## Common pitfalls and troubleshooting
    - **ACK Wait Parameter**: Ensure `<buffer>` configurations define `retry_wait` and `retry_max_interval` to prevent aggressive retry storms against struggling destinations.
    - **Hard Limit Sizing**: When `total_limit_size` is reached, Fluentd discards incoming logs or throws `BufferOverflowError`; size persistent volumes generously.
    - **TCP Keepalive Settings**: Enable `send_keepalive_packet true` in forward output configurations to prevent silent socket dropouts through cloud NAT gateways.
    - **Prometheus Monitor Plugin**: Ensure `fluent-plugin-prometheus` is installed in the Fluentd container image to expose internal output statistics.

    ## How to extend
    - **Automated Fallback Routing**: Trigger a sub-flow to switch Fluentd routing configurations to local S3 secondary storage when forward targets fail.
    - **Aggregator Pod Horizontal Scaling**: Chain a Kubernetes HPA scaling command when buffer queue length climbs above 30 chunks.
    - **PagerDuty Escalation**: Escalate to on-call data platform engineers via PagerDuty if retry counts exceed 100 across consecutive runs.

