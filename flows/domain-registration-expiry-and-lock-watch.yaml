id: domain-registration-expiry-and-lock-watch
namespace: company.team
description: |
  Check the registration of the domains your company owns through RDAP, the successor to WHOIS, and
  alert in Slack before a registration expires, and whenever a transfer or update lock is removed or the
  registrar or nameservers change, which are early signs of a lapse or a hijack.

inputs:
  - id: domains
    type: JSON
    displayName: Domains to watch
    description: List of objects with a registered domain (not a subdomain) and an owner to mention.
    defaults: |
      [
        {"domain": "github.com", "owner": "@platform"},
        {"domain": "cloudflare.net", "owner": "@platform"},
        {"domain": "vercel.app", "owner": "@web-team"},
        {"domain": "example.org", "owner": "@marketing"}
      ]

  - id: warning_days
    type: INT
    displayName: Warning window (days)
    defaults: 60

  - id: urgent_days
    type: INT
    displayName: Urgent window (days)
    defaults: 14

tasks:
  - id: for_each_domain
    type: io.kestra.plugin.core.flow.Loop
    description: Check every domain independently, four at a time.
    values: "{{ inputs.domains }}"
    concurrencyLimit: 4
    tasks:
      - id: fetch_rdap
        type: io.kestra.plugin.core.http.Download
        description: Registration data from the registry's RDAP server, found through the rdap.org bootstrap redirect (public, no key).
        uri: "https://rdap.org/domain/{{ fromJson(item.value).domain }}"
        headers:
          Accept: application/rdap+json

      - id: load_previous
        type: io.kestra.plugin.core.kv.Get
        description: Registration state recorded at the last run. Missing on the first run.
        key: "domain_watch_{{ fromJson(item.value).domain | slugify }}"
        errorOnMissing: false

      - id: evaluate
        type: io.kestra.plugin.scripts.python.Script
        description: Extract expiry, registrar, statuses and nameservers, and list what changed or needs attention.
        containerImage: python:3.12-slim
        inputFiles:
          rdap.json: "{{ outputs.fetch_rdap.uri }}"
          previous.json: "{{ (outputs.load_previous.value ?? {}) | toJson }}"
        script: |
          import json
          from datetime import datetime, timezone

          def load(name):
              with open(name, encoding="utf-8") as f:
                  data = json.load(f)
              return json.loads(data) if isinstance(data, str) else data

          rdap = load("rdap.json")
          previous = load("previous.json") or {}

          events = {e.get("eventAction"): e.get("eventDate") for e in rdap.get("events", [])}
          expiry = events.get("expiration")
          days_left = None
          if expiry:
              days_left = (datetime.fromisoformat(expiry.replace("Z", "+00:00")) - datetime.now(timezone.utc)).days

          registrar = None
          for entity in rdap.get("entities", []):
              if "registrar" in entity.get("roles", []):
                  for field in (entity.get("vcardArray") or [None, []])[1]:
                      if field[0] == "fn":
                          registrar = field[3]
          statuses = sorted(s.lower() for s in rdap.get("status", []))
          nameservers = sorted(n.get("ldhName", "").lower().rstrip(".") for n in rdap.get("nameservers", []))

          if days_left is None:
              stage = "unknown"
          elif days_left <= {{ inputs.urgent_days }}:
              stage = "urgent"
          elif days_left <= {{ inputs.warning_days }}:
              stage = "warning"
          else:
              stage = "ok"

          rank = {"unknown": 0, "ok": 0, "warning": 1, "urgent": 2}
          findings = []
          if rank[stage] > rank.get(previous.get("stage", "ok"), 0):
              window = "urgent" if stage == "urgent" else "warning"
              findings.append(f"Registration expires in {days_left} days ({expiry[:10]}), inside the {window} window.")
          danger = [s for s in statuses if any(k in s for k in ("pending delete", "redemption", "hold", "pending transfer"))]
          for s in danger:
              if s not in previous.get("statuses", []):
                  findings.append(f"Status `{s}` appeared.")
          if previous:
              for lock in ("client transfer prohibited", "client delete prohibited", "client update prohibited"):
                  if lock in previous.get("statuses", []) and lock not in statuses:
                      findings.append(f"Lock `{lock}` was removed.")
              if previous.get("registrar") and registrar != previous.get("registrar"):
                  findings.append(f"Registrar changed: {previous['registrar']} -> {registrar}")
              if previous.get("nameservers") and nameservers != previous.get("nameservers"):
                  findings.append(f"Nameservers changed: {', '.join(previous['nameservers'])} -> {', '.join(nameservers)}")

          state = {"stage": stage, "statuses": statuses, "registrar": registrar, "nameservers": nameservers}
          print(f"{rdap.get('ldhName', '').lower()}: expires {expiry} ({days_left} days), registrar {registrar}, "
                f"{len(statuses)} statuses, {len(nameservers)} nameservers, {len(findings)} findings")
          print("::" + json.dumps({"outputs": {
              "findings": findings,
              "has_findings": bool(findings),
              "expiry": (expiry or "unknown")[:10],
              "days_left": days_left,
              "registrar": registrar,
              "locked": any(s in statuses for s in ("client transfer prohibited", "server transfer prohibited")),
              "nameservers": nameservers,
              "state": state,
          }}) + "::")

      - id: if_findings
        type: io.kestra.plugin.core.flow.If
        description: Only post when something new needs attention.
        condition: "{{ outputs.evaluate.vars.has_findings }}"
        then:
          - id: alert_owner
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Post what changed, with the current registration facts from RDAP.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: |
              :globe_with_meridians: *Domain {{ fromJson(item.value).domain }} needs attention* (owner: {{ fromJson(item.value).owner }})
              {% for f in outputs.evaluate.vars.findings %}- {{ f }}
              {% endfor %}Registrar: {{ outputs.evaluate.vars.registrar ?? 'unknown' }} | expires {{ outputs.evaluate.vars.expiry }} | transfer lock: {{ outputs.evaluate.vars.locked ? 'on' : '*off*' }}
              Nameservers: {{ outputs.evaluate.vars.nameservers | join(', ') }}

      - id: remember_state
        type: io.kestra.plugin.core.kv.Set
        description: Store the registration state for the next comparison. Runs after the alert.
        key: "domain_watch_{{ fromJson(item.value).domain | slugify }}"
        kvType: JSON
        overwrite: true
        value: "{{ outputs.evaluate.vars.state | toJson }}"

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: A domain that cannot be checked must not look healthy.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":warning: Domain registration watch failed in execution {{ execution.id }} ({{ flow.namespace }}.{{ flow.id }}). Open the failed loop iteration: the domain may be misspelled, or its TLD may not offer RDAP yet (HTTP 404 from rdap.org)."

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every morning. Disabled until the Slack secret is set.
    cron: "0 6 * * *"
    disabled: true

extend:
  title: Get Slack Alerts Before Your Domains Expire or Lose Their Transfer Lock
  shortDescription: Check your domains through RDAP every day and alert the owner before a registration expires or when a lock, the registrar or the nameservers change.
  metaTitle: Domain Expiry and Registrar Lock Watch with RDAP
  metaDescription: Check your domains through RDAP every day and alert in Slack before a registration expires or when a transfer lock, registrar or nameserver changes.
  description: |
    An expired domain takes down the website, email and every login that depends on it, and a
    domain whose transfer lock was removed is one step from being stolen. Registrars send renewal
    emails, but they go to whoever registered the domain years ago. This blueprint checks your
    domains every day through [RDAP](https://about.rdap.org), the structured successor to WHOIS
    that every gTLD registry must run, and alerts the owning team when something needs attention.

    It reports, once each:

    - the registration entering the warning window (60 days by default) and the urgent window (14 days);
    - a `client transfer prohibited`, `client delete prohibited` or `client update prohibited` lock being removed;
    - a `pending delete`, `redemption period`, `hold` or `pending transfer` status appearing;
    - a change of registrar or nameservers.

    ## How it works

    For each entry in `domains` (Loop, four at a time):

    1. `fetch_rdap` asks `rdap.org`, which redirects to the right registry's RDAP server.
    2. `load_previous` reads the state recorded at the last run from the Kestra KV store.
    3. `evaluate` extracts the expiry date, registrar, statuses and nameservers, and lists the findings.
    4. `if_findings` skips Slack when nothing changed.
    5. `alert_owner` posts the findings and the current registration facts.
    6. `remember_state` stores the state for the next comparison, after the alert.

    Changes are detected from the second run on; the first run only reports domains already inside
    a window or in a dangerous status.

    ## Prerequisites

    - A Slack Incoming Webhook. RDAP is public and needs no key.
    - Domains under TLDs that publish RDAP. All gTLDs do (`.com`, `.net`, `.org`, `.app`, `.dev` and
      about 1,200 more); some ccTLDs such as `.io` and `.de` do not yet, and those iterations fail
      with an HTTP 404 that the `errors` branch reports.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alerts and failures.

    In the open-source edition, secrets are environment variables on the Kestra container,
    prefixed with `SECRET_` and base64-encoded. See
    [how to manage secrets](https://kestra.io/docs/concepts/secret).

    ## Inputs

    - `domains` (JSON): list of `{"domain", "owner"}` objects. Use the registered domain
      (`example.com`), not a subdomain.
    - `warning_days` (INT, default `60`) and `urgent_days` (INT, default `14`): the expiry windows.

    ## Quick start

    1. Add the Slack secret and list your domains.
    2. Execute the flow. Domains already close to expiry are reported; everything else is recorded.
    3. Enable `daily`. From then on, Slack hears about windows, lock changes and registrar or
       nameserver changes.

    To check whether a TLD supports RDAP, open `https://rdap.org/domain/<your-domain>` in a browser.

    ## Outputs

    - `{{ outputs.evaluate.vars }}` per iteration: `expiry`, `days_left`, `registrar`, `locked`, `nameservers`, `findings`.
    - KV entries `domain_watch_<domain>`: the recorded registration state.

    ## Links

    - [About RDAP](https://about.rdap.org) and the [rdap.org bootstrap service](https://rdap.org)
    - [ICANN EPP status codes](https://www.icann.org/resources/pages/epp-status-codes-2014-06-16-en)
    - [Kestra Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Kestra KV store](https://kestra.io/docs/concepts/kv-store)
    - [Slack Incoming Webhook task](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)

    - This blueprint has been created by [StarKnightt](https://github.com/StarKnightt)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
