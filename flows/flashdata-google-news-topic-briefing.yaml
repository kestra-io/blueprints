id: flashdata-google-news-topic-briefing
namespace: company.research
inputs:
- id: query
  type: STRING
  defaults: retrieval augmented generation research
  description: Research question or Google query, 1 to 2000 characters.
- id: country
  type: STRING
  defaults: us
  description: Two-letter country code used for Google results.
- id: language
  type: STRING
  defaults: en
  description: Interface language, such as en or zh-CN.
- id: result_limit
  type: INT
  defaults: 5
  description: Requested result count, 1 to 100. The provider may return a different count.
tasks:
- id: prepare_request
  type: io.kestra.plugin.scripts.python.Script
  description: Validate inputs before any paid call and retain the exact single-page request.
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  containerImage: python:3.13.15-slim
  env:
    INPUTS_B64: '{{ {''query'': inputs.query, ''country'': inputs.country, ''language'': inputs.language, ''result_limit'':
      inputs.result_limit} | toJson | base64encode }}'
  outputFiles:
  - request.json
  script: |
    import base64
    import json
    import os
    import re
    from pathlib import Path

    # Docker runner renders env twice; encoding keeps query text out of the second template pass.
    inputs = json.loads(base64.b64decode(os.environ["INPUTS_B64"]))
    query = inputs["query"].strip()
    country = inputs["country"].strip().lower()
    language = inputs["language"].strip()
    limit = int(inputs["result_limit"])
    if not 1 <= len(query) <= 2000 or "\x00" in query:
        raise ValueError("query must contain 1..2000 characters and no null bytes")
    if not re.fullmatch(r"[a-z]{2}", country):
        raise ValueError("country must be a two-letter country code")
    if not 1 <= len(language) <= 35 or not re.fullmatch(r"[A-Za-z0-9-]+", language):
        raise ValueError("language must contain 1..35 letters, digits or hyphens")
    if not 1 <= limit <= 100:
        raise ValueError("result_limit must be 1..100")
    request = {"source": "google_news", "query": query,
               "params": {"gl": country, "hl": language, "num": limit, "page": 1}}

    Path("request.json").write_text(json.dumps(request, ensure_ascii=False, indent=2), encoding="utf-8")
- id: search_once
  type: io.kestra.plugin.scripts.python.Script
  description: Submit one paid realtime query. No redirects, pagination or automatic retries.
  timeout: PT3M
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  containerImage: python:3.13.15-slim
  env:
    FLASHDATA_API_KEY: '{{ secret(''FLASHDATA_API_KEY'') }}'
  inputFiles:
    request.json: '{{ outputs.prepare_request.outputFiles[''request.json''] }}'
  outputFiles:
  - response.json
  - transport.json
  script: |
    import http.client
    import json
    import os
    import uuid
    from datetime import datetime, timezone
    from pathlib import Path

    key = os.environ["FLASHDATA_API_KEY"]
    if not key or len(key) > 512 or any(ord(c) < 33 or ord(c) > 126 for c in key):
        raise SystemExit("Set a valid FLASHDATA_API_KEY secret before running")
    request_id = "req_" + str(uuid.uuid4())
    print("::" + json.dumps({"outputs": {"request_id": request_id}}, separators=(",", ":")) + "::", flush=True)
    connection = http.client.HTTPSConnection("data.flashdata.dev", timeout=65)
    try:
        connection.request("POST", "/v1/queries/realtime", body=Path("request.json").read_bytes(),
                           headers={"X-API-Key": key, "X-Request-Id": request_id,
                                    "Content-Type": "application/json", "Accept": "application/json"})
        response = connection.getresponse()
        raw = response.read(4 * 1024 * 1024 + 1)
        status = response.status
    except (OSError, http.client.HTTPException):
        raise SystemExit("Query outcome unknown. It may have been charged. Check FlashData Jobs/logs using "
                         + request_id + " before submitting again; no retry was made.") from None
    finally:
        connection.close()
    if len(raw) > 4 * 1024 * 1024:
        raise SystemExit("Response exceeds 4 MiB. Check FlashData logs before another paid query: " + request_id)
    if status != 200:
        raise SystemExit("FlashData returned HTTP " + str(status) + ". No redirect or retry was made. "
                         "Check account access, balance and logs before resubmitting: " + request_id)
    Path("response.json").write_bytes(raw)
    transport = {"request_id": request_id, "http_status": status,
                 "retrieved_at": datetime.now(timezone.utc).isoformat(), "response_bytes": len(raw)}
    Path("transport.json").write_text(json.dumps(transport, indent=2), encoding="utf-8")
- id: group_news
  type: io.kestra.plugin.scripts.python.Script
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  containerImage: python:3.13.15-slim
  description: Deduplicate exact source URLs and group articles without converting relative dates.
  inputFiles:
    request.json: '{{ outputs.prepare_request.outputFiles[''request.json''] }}'
    response.json: '{{ outputs.search_once.outputFiles[''response.json''] }}'
    transport.json: '{{ outputs.search_once.outputFiles[''transport.json''] }}'
  outputFiles:
  - articles.jsonl
  - publisher_groups.json
  - manifest.json
  script: |
    import json
    from pathlib import Path
    from urllib.parse import urlsplit

    def safe_url(value):
        if not isinstance(value, str) or any(ord(c) <= 32 or ord(c) == 127 for c in value):
            return False
        try:
            u = urlsplit(value)
            u.port  # Validate an explicitly supplied port before emitting the URL.
            return bool(u.scheme in ("http", "https") and u.hostname and not u.username and not u.password)
        except ValueError:
            return False

    def string(value):
        return value if isinstance(value, str) and value.strip() else None

    def save(name, value):
        Path(name).write_text(json.dumps(value, ensure_ascii=False, indent=2), encoding="utf-8")

    def jsonl(name, rows):
        Path(name).write_text("".join(json.dumps(r, ensure_ascii=False) + "\n" for r in rows), encoding="utf-8")

    def outputs(**values):
        print("::" + json.dumps({"outputs": values}, separators=(",", ":")) + "::")

    request = json.loads(Path("request.json").read_text())
    response = json.loads(Path("response.json").read_text())
    transport = json.loads(Path("transport.json").read_text())
    if (not isinstance(response, dict) or response.get("source") != "google_news"
            or response.get("status") != "done" or not isinstance(response.get("results"), list)
            or len(response["results"]) != 1 or not isinstance(response["results"][0], dict)):
        raise ValueError("Unexpected response; inspect the saved response, do not repeat the paid request")
    payload = response["results"][0]
    items = payload.get("news", [])
    if not isinstance(items, list):
        raise ValueError("Malformed result list is not an empty search")
    manifest = {"request": request, "transport": transport, "api_created_at": response.get("created_at"),
                "usage": response.get("usage"), "result_field_present": "news" in payload,
                "returned_count": len(items)}
    articles, excluded, groups, seen = [], [], {}, set()
    for index, item in enumerate(items, 1):
        url = item.get("link") if isinstance(item, dict) else None
        if not safe_url(url):
            excluded.append({"result_index": index, "reason": "missing_or_unsafe_url"})
            continue
        if url in seen:
            excluded.append({"result_index": index, "reason": "duplicate_url"})
            continue
        seen.add(url)
        publisher = string(item.get("source"))
        group = "publisher: " + publisher if publisher else "host (publisher not supplied): " + urlsplit(url).hostname
        article = {"result_index": index, "url": url, "title": string(item.get("title")),
                   "snippet": string(item.get("snippet")), "publisher": publisher,
                   "date_raw": item.get("date"), "position": item.get("position"),
                   "query": request["query"], "retrieved_at": transport["retrieved_at"]}
        articles.append(article)
        groups.setdefault(group, []).append(article)
    manifest.update({"article_count": len(articles), "group_count": len(groups), "excluded": excluded,
                     "limitations": "Dates are retained verbatim; no date inference, full-text crawling, fact checking or model summary."})
    jsonl("articles.jsonl", articles)
    save("publisher_groups.json", [{"group": name, "articles": rows} for name, rows in groups.items()])
    save("manifest.json", manifest)
    outputs(article_count=len(articles))
- id: route_brief
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.group_news.vars.article_count > 0 }}'
  then:
  - id: render_news_brief
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.13.15-slim
    inputFiles:
      publisher_groups.json: '{{ outputs.group_news.outputFiles[''publisher_groups.json''] }}'
      manifest.json: '{{ outputs.group_news.outputFiles[''manifest.json''] }}'
    outputFiles:
    - brief.md
    script: |
      import json
      from pathlib import Path
      import html
      from urllib.parse import quote

      def text(value):
          value = "Not supplied" if value is None else str(value)
          value = " ".join(value.split())
          for ch in "\\`*_{}[]()#+-.!|":
              value = value.replace(ch, "\\" + ch)
          return html.escape(value, quote=False)

      def link(value):
          return quote(value, safe="/:?#@!$&'*+,;=%~-._")

      groups = json.loads(Path("publisher_groups.json").read_text())
      manifest = json.loads(Path("manifest.json").read_text())
      lines = ["# Google News topic briefing", "", "Topic: " + text(manifest["request"]["query"]), "",
               "A source reading list, not a generated news summary. Dates below are the provider's original labels.", ""]
      for group in groups:
          lines += ["## " + text(group["group"]), ""]
          for article in group["articles"]:
              lines += ["### " + text(article["title"]), "", "[Read source](" + link(article["url"]) + ")",
                        "Date label: " + text(article["date_raw"]), "", "> " + text(article["snippet"]), ""]
      lines += ["## Coverage", "", str(manifest["article_count"]) + " unique article URLs; "
                + str(len(manifest["excluded"])) + " excluded records. See manifest.json and the original response.", "",
                "[Google News API](https://flashdata.dev/docs/sources/google_news)", ""]
      Path("brief.md").write_text("\n".join(lines), encoding="utf-8")
  else:
  - id: no_articles
    type: io.kestra.plugin.core.storage.Write
    extension: .md
    content: No usable source-linked news articles. Inspect response.json and manifest.json for missing, empty,
      duplicate or unsafe records. No broader query was submitted.
triggers:
- id: weekly_snapshot
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 9 * * 1
  timezone: UTC
  recoverMissedSchedules: NONE
  disabled: true
extend:
  title: Google News topic briefings with FlashData
  metaTitle: Google News topic briefings with FlashData | Kestra
  shortDescription: Turn a topic into a publisher-grouped news reading list while retaining original date labels
    and source links.
  metaDescription: Group Google News results by publisher, remove duplicate URLs and export a source-linked briefing
    with raw date labels using FlashData.
  description: |
    Turn a topic into a publisher-grouped news reading list while retaining original date labels and source links.

    ## How it works

    1. Validate the topic and market before one Google News query.
    2. Save the response, deduplicate exact article URLs and group by publisher.
    3. An If branch renders a reading list or an explicit no-articles note.

    ## What you get

    - `group_news`: articles.jsonl, publisher_groups.json and manifest.json.
    - `render_news_brief`: brief.md; otherwise `no_articles.uri`.
    - Original request, response, retrieval time and exclusion reasons.

    ## Who it's for

    Research and communications teams checking which publications cover a topic.

    ## Why orchestrate this with Kestra

    Separate collection, publisher grouping and reviewable output while preserving file lineage across runs.

    ## Prerequisites

    Kestra 2.0, its Python plugin and Docker runner, and access to `data.flashdata.dev`.
    The pinned Python image uses only the standard library.
    Create a [FlashData account and API key](https://flashdata.dev/app/api-keys).
    Installation is free; each run makes one paid API query using Credits.
    Check [pricing](https://flashdata.dev/pricing) and account limits.

    ### Secrets

    - `FLASHDATA_API_KEY`: permit `google_news` and store it with Kestra secrets, never in inputs.

    ## Quick start

    1. Configure the secret. For manual import, copy the YAML above `extend`; that block is catalog metadata.
    2. Set query, country, language and result_limit (1–100); defaults request five US English results.
    3. Download files from execution Outputs. Treat external text as data, not agent instructions.
    4. Enable the disabled weekly schedule only after reviewing recurring costs.

    Relative dates stay raw; missing publishers use a clearly labeled URL-host group. Snippets are not full articles or verified facts. Requested result counts are not guaranteed; actual counts may differ.
    Requests use a 65-second socket timeout and 4 MiB response limit.
    No retries, redirects or extra pages. On an uncertain timeout, check Jobs/logs before running again.

    ## How to extend

    Feed saved articles to an editorial review or agent task without another search. Any model calls add their own costs.

    ## Links

    - [API inputs and limits](https://flashdata.dev/docs/sources/google_news)
    - [Kestra script files](https://kestra.io/docs/scripts/input-output-files)
    - [Configure secrets](https://kestra.io/docs/how-to-guides/secrets)
  tags:
  - Data
  - AI
  - Business
  subTags:
  - Reporting & Digests
  - RAG & Knowledge Retrieval
  ee: false
  demo: false
