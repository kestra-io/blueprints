id: cassandra-table-compression-disabled-guard
namespace: company.team

description: >-
  Find Cassandra base tables in the keyspaces you name whose compression option carries no
  compressor class, so the table was created with compression disabled and every SSTable is
  stored raw. Uncompressed SSTables waste disk and, more to the point, read IO, because each
  read pulls more bytes off disk than it needs. The guard reads system_schema.tables for those
  keyspaces, flags every base table with no compressor class and alerts Slack. When you allow
  it, it turns on LZ4 with ALTER TABLE one table at a time behind a human approval, then reads
  the schema again and fails the run if any flagged table still has no compressor. Changing the
  option takes effect at once for new SSTables. Data already on disk is recompressed only as
  future compaction rewrites it, so the re-read proves the setting landed, not that every byte
  is compressed yet.

inputs:
  - id: cassandra_host
    type: STRING
    defaults: "cassandra"
    displayName: Cassandra Host
    description: Hostname or IP of one Cassandra contact point reachable from the Kestra Worker.

  - id: cassandra_port
    type: INT
    defaults: 9042
    displayName: Cassandra CQL Port
    description: Native CQL port the contact point listens on.

  - id: cassandra_datacenter
    type: STRING
    defaults: "datacenter1"
    displayName: Local Datacenter
    description: Datacenter the driver treats as local for its load balancing policy. A default Cassandra install uses datacenter1.

  - id: target_keyspaces
    type: ARRAY
    itemType: STRING
    displayName: Target keyspaces
    description: Keyspaces to audit. Any name starting with system is dropped from the list before the query runs, so the built in keyspaces are never in scope.
    defaults:
      - app

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate true, before the approval step is even reached.
    defaults: true

variables:
  scoped_keyspaces: >-
    {{ inputs.target_keyspaces | jq('map(select(startswith("system") | not)) | if length == 0 then "none" else join(", ") end') | first }}
  scan_cql: >-
    SELECT keyspace_name, table_name, compression FROM system_schema.tables WHERE keyspace_name IN ({{ inputs.target_keyspaces | jq('map(select(startswith("system") | not)) | if length == 0 then "\u0027 \u0027" else map("\u0027" + gsub("\u0027"; "\u0027\u0027") + "\u0027") | join(",") end') | first }})
  flag_count_jq: >-
    [.[] | select((.compression.class // "") == "")] | length
  flag_names_jq: >-
    [.[] | select((.compression.class // "") == "") | .keyspace_name + "." + .table_name] | join(", ")
  fix_jq: >-
    [.[] | select((.compression.class // "") == "") | "ALTER TABLE \"" + (.keyspace_name | gsub("\"";"\"\"")) + "\".\"" + (.table_name | gsub("\"";"\"\"")) + "\" WITH compression = {'class': 'LZ4Compressor'}"]

tasks:
  - id: scan_tables
    type: io.kestra.plugin.cassandra.standard.Query
    description: Read only. Lists each base table's compression option for the target keyspaces from system_schema.tables, restricted on the keyspace_name partition key so no ALLOW FILTERING is needed.
    session:
      endpoints:
        - hostname: "{{ inputs.cassandra_host }}"
          port: "{{ inputs.cassandra_port }}"
      localDatacenter: "{{ inputs.cassandra_datacenter }}"
    cql: "{{ render(vars.scan_cql) }}"
    fetchType: FETCH

  - id: flagged
    type: io.kestra.plugin.core.output.OutputValues
    description: Keep the base tables with no compressor class, build one ALTER TABLE per table and a readable name list.
    values:
      fix_sql: "{{ outputs.scan_tables.rows | jq(render(vars.fix_jq)) | first | toJson }}"
      names: "{{ outputs.scan_tables.rows | jq(render(vars.flag_names_jq)) | first }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Compression guard on {{ inputs.cassandra_host }}: scanned {{ outputs.scan_tables.size }} base tables in {{ render(vars.scoped_keyspaces) }}, {{ outputs.scan_tables.rows | jq(render(vars.flag_count_jq)) | first }} with compression disabled.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.scan_tables.rows | jq(render(vars.flag_count_jq)) | first) > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Cassandra ' ~ inputs.cassandra_host ~ ': base tables storing SSTables uncompressed, so each read pulls more bytes off disk than it needs: ' ~ outputs.flagged.values.names ~ '. ' ~ (inputs.auto_remediate and not inputs.dry_run ? 'Asking for approval to turn on LZ4 compression.' : 'No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ' dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: hold
            type: io.kestra.plugin.core.flow.Pause
            description: Human approval before the schema changes. A table is sometimes left uncompressed on purpose, for example data that is already compressed by the application, so a person confirms the list first.
            onResume:
              - id: approved
                type: BOOL
                required: false
                description: Set true to turn on LZ4 compression on the listed tables. Anything else leaves the schema alone.

          - id: approval_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.hold.onResume.approved ?? false }}"
            then:
              - id: remediate
                type: io.kestra.plugin.core.flow.Loop
                description: Sequential remediation on purpose. Concurrent schema changes race Cassandra schema agreement and can leave nodes disagreeing on the schema.
                concurrencyLimit: 1
                values: "{{ outputs.flagged.values.fix_sql }}"
                tasks:
                  - id: apply_compression
                    type: io.kestra.plugin.cassandra.standard.Query
                    description: One ALTER TABLE ... WITH compression per flagged base table, setting the LZ4 compressor class.
                    allowFailure: true
                    session:
                      endpoints:
                        - hostname: "{{ inputs.cassandra_host }}"
                          port: "{{ inputs.cassandra_port }}"
                      localDatacenter: "{{ inputs.cassandra_datacenter }}"
                    cql: "{{ item.value }}"

              - id: settle
                type: io.kestra.plugin.core.flow.Sleep
                description: Give the cluster a moment to reach schema agreement before the re-read, so a slow propagating ALTER does not read back as a false failure.
                duration: PT5S

              - id: reverify
                type: io.kestra.plugin.cassandra.standard.Query
                description: Read system_schema.tables again for the same keyspaces to confirm every flagged base table now carries a compressor class.
                session:
                  endpoints:
                    - hostname: "{{ inputs.cassandra_host }}"
                      port: "{{ inputs.cassandra_port }}"
                  localDatacenter: "{{ inputs.cassandra_datacenter }}"
                cql: "{{ render(vars.scan_cql) }}"
                fetchType: FETCH

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.reverify.rows | jq(render(vars.flag_count_jq)) | first) > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: "Base tables still have compression disabled after ALTER TABLE: {{ outputs.reverify.rows | jq(render(vars.flag_names_jq)) | first }}. The connecting role likely lacks ALTER on these tables. Another cause is a table created without compression while the run waited for approval."
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: "Turned on and verified LZ4 compression on {{ outputs.flagged.values.names }}. This changes the schema option, so new SSTables are written compressed. Data already on disk is recompressed only as future compaction rewrites it, which this run does not force."
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: "Approval was not given, so the compression option was left as it is on {{ outputs.flagged.values.names }}."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "Every base table in {{ render(vars.scoped_keyspaces) }} carries a compressor class."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the guard itself fails, for example an unreachable cluster or a role without ALTER rights, so a broken run never reads as a clean one.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Cassandra compression guard failed on ' ~ inputs.cassandra_host ~ ' (execution ' ~ execution.id ~ '). The compression posture is now unknown. Check the task logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and always in safe mode (auto_remediate false, dry_run true) regardless of this flow's own defaults.
    cron: "25 4 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: "Cassandra Table Compression Disabled Guard"
  shortDescription: Flag Cassandra base tables stored uncompressed, alert Slack, then turn on LZ4 compression with ALTER TABLE behind an approval and re-read the schema.
  metaTitle: Cassandra Table Compression Disabled Guard with Kestra
  metaDescription: Flag Cassandra base tables with compression disabled, alert Slack, turn on LZ4 with ALTER TABLE behind an approval and re-read the schema.
  description: |
    `CREATE TABLE ... WITH compression = {'enabled': false}` is one line in a schema file that nobody revisits after the table exists. It tells Cassandra to write every SSTable for this table raw. On a large table that wastes disk. It also wastes read IO on every read, because each lookup pulls more bytes off disk than a compressed chunk would. The default is LZ4 compression precisely because the trade is almost always worth it, so a table sitting at disabled is usually a mistake rather than a decision.

    This blueprint reads `system_schema.tables` for the keyspaces you name, flags every base table whose `compression` map carries no compressor class and alerts Slack. When you allow it, it turns on LZ4 with `ALTER TABLE ... WITH compression`, one table at a time, behind a human approval, then reads the schema again and fails the run if any flagged table still has no compressor.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    `ALTER TABLE ... WITH compression` changes the setting straight away, so every SSTable written after the change is compressed. It does NOT rewrite the data already on disk. Existing SSTables are recompressed only as future compaction rewrites them, so disk is reclaimed over time, not at the moment of the ALTER. The re-verify step is a schema check: it confirms `system_schema.tables` now shows a compressor class on each flagged table, which proves the setting landed, not that every byte on disk is already compressed. To rewrite existing data at once run `nodetool upgradesstables -a` on each node, which this guard deliberately does not do.

    The remediation loop runs one `ALTER TABLE` at a time (`concurrencyLimit: 1`). Concurrent schema changes race Cassandra's schema agreement and can leave nodes disagreeing on the schema. Both write gates (`auto_remediate` true with `dry_run` false) must be set before any `ALTER TABLE` runs. A human must also approve the Pause.

    ## How it works

    1. `scan_tables` (`io.kestra.plugin.cassandra.standard.Query`, read only) runs `SELECT keyspace_name, table_name, compression FROM system_schema.tables WHERE keyspace_name IN (...)` for the `target_keyspaces` you pass. Any name starting with `system` is dropped from the list first, so the built in keyspaces are never in scope. The restriction is on the `keyspace_name` partition key, so the read needs no `ALLOW FILTERING`. `system_schema.tables` lists base tables only, so views and indexes are out of scope by construction.
    2. `flagged` (`io.kestra.plugin.core.output.OutputValues`) keeps the rows whose `compression` map has no `class` key, which is how a disabled table reads back, then builds one `ALTER TABLE` per table plus a readable name list. `summary` logs the counts.
    3. `route` (`io.kestra.plugin.core.flow.If`) branches on whether any table has compression disabled:
       - **clean:** `clean` logs that every base table in the target keyspaces carries a compressor class.
       - **flagged:** `alert` posts the table list to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true with `dry_run` false.
         - `hold` (`io.kestra.plugin.core.flow.Pause`) waits for a person to approve the list.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs each `ALTER TABLE ... WITH compression` through `io.kestra.plugin.cassandra.standard.Query` in turn.
         - `settle` waits a few seconds for schema agreement, then `reverify` re-reads `system_schema.tables`. `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` if any flagged table still has no compressor class.
    4. The `errors` block alerts Slack when the flow itself fails, for example an unreachable cluster or a role without `ALTER` rights.
    5. The `daily` `Schedule` trigger ships `disabled: true` and always forces safe mode.

    ## What you get

    - A standing answer to which base tables store their SSTables uncompressed, read from Cassandra's own schema rather than from the schema file somebody committed two years ago.
    - LZ4 compression turned on only behind two input gates plus a human approval, one table at a time, with a re-read of the schema as proof.
    - A Slack page listing the tables, plus a separate failure channel when the guard cannot run.
    - A line between a schema fix (what this does) and reclaiming disk already written raw (what `nodetool upgradesstables -a` does).

    ## Who it's for

    - Platform and database reliability teams who want uncompressed tables to be a deliberate choice rather than a copy paste accident.
    - Teams onboarding new keyspaces where a `CREATE TABLE` with compression off is an easy and expensive miss.
    - Anyone evaluating the Cassandra plugin who wants a worked `system_schema.tables` audit that also drives `ALTER TABLE`.

    ## Why orchestrate this with Kestra

    A `DESCRIBE TABLE` in cqlsh answers this for one table at one moment and changes nothing. Kestra reads the whole set on a schedule, turns it into a Slack page and an execution history, applies the fix only behind `auto_remediate` with `dry_run` plus a human approval, one statement at a time, then verifies by reading the schema back. A table created with compression off next month is caught by the next scheduled run instead of by a disk alert.

    ## Tested end to end

    On Kestra 2.0.5 OSS against `cassandra:5` (5.0.x) on the same Docker network, with a local HTTP sink standing in for Slack. Seeded keyspace `app`: `events` and `readings` created `WITH compression = {'enabled': false}`, so both read back with no compressor class, plus `profiles` created `WITH compression = {'class': 'LZ4Compressor'}` which is left untouched to prove precision. Keyspace `app_clean` holds one table on the default LZ4.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | `target_keyspaces: [app_clean]` | Clean. 1 base table scanned, 0 flagged. No alert, no change |
    | 2 | `target_keyspaces: [app]` | 3 scanned, 2 flagged (`app.events`, `app.readings`). Alert sent. `profiles` on LZ4 not flagged. Schema unchanged |
    | 3 | run 2 plus `auto_remediate: true`, `dry_run: true` | Same report. cqlsh confirms both still disabled. No ALTER ran, the Pause was never reached |
    | 4 | run 2, `auto_remediate: true`, `dry_run: false`, resumed with no answer | Pause reached, `declined` branch taken, schema untouched |
    | 5 | same, approved | 2 `ALTER TABLE` ran one at a time, `reverify` found 0 disabled. cqlsh: both now carry the LZ4Compressor class, `profiles` still LZ4 |
    | 6 | same, with `app.hotpath` created with compression off while the run waited for approval | The 2 known tables were fixed, `reverify` found `app.hotpath`, the run FAILED and the `errors` block posted |
    | 7 | `target_keyspaces: [system, system_schema, app_clean]` | 1 base table scanned. The system names are dropped before the query runs |
    | 8 | `cassandra_host` pointed at an unreachable name | `scan_tables` failed, the `errors` block posted to the sink, execution FAILED |

    Before and after `compression` maps from `system_schema.tables` read with `cqlsh` are in the PR description.

    ## Prerequisites

    - A reachable Cassandra cluster with its native CQL port open to the Kestra Worker. For the audit, a role that can read `system_schema.tables`. For remediation, a role with `ALTER` on the target tables.
    - The bundled Cassandra plugin (`io.kestra.plugin.cassandra.standard.Query`), which ships with Kestra.
    - Local testing: `docker run -d --name cassandra --network <kestra-network> -e MAX_HEAP_SIZE=1G -e HEAP_NEWSIZE=256M cassandra:5`, then create a keyspace and a table `WITH compression = {'enabled': false}`. Allow a minute or two before the node accepts CQL.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert` and the `errors` block.
    - This flow connects without a username or password, which matches a local single node Cassandra. For an authenticated cluster, add a `username` plus a `password: {{ secret('CASSANDRA_PASSWORD') }}` to each task's `session` rather than hardcoding them. The driver needs both or neither.
    - In Kestra OSS, provide a secret as a base64-encoded environment variable prefixed `SECRET_`, for example `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `cassandra_host` | `cassandra` | Contact point hostname or IP |
    | `cassandra_port` | `9042` | Native CQL port |
    | `cassandra_datacenter` | `datacenter1` | Local datacenter for the driver |
    | `target_keyspaces` | `[app]` | Keyspaces to audit. Names starting with `system` are dropped |
    | `auto_remediate` | `false` | Allow `ALTER TABLE` |
    | `dry_run` | `true` | Must be `false` before the approval step is reached |

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret. The Cassandra plugin ships with Kestra, so there is nothing extra to install.
    2. Import the flow and set `target_keyspaces` to your application keyspaces.
    3. Run it once with the defaults and read which base tables store their SSTables uncompressed.
    4. Agree the list with the table owners, then run with `auto_remediate: true` and `dry_run: false` and approve the Pause.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Follow the ALTER with a flow that runs `nodetool upgradesstables -a` per node to rewrite existing data at once rather than waiting for compaction.
    - Choose the compressor per keyspace, for example `ZstdCompressor` for cold archive tables and `LZ4Compressor` for hot ones.
    - Keep an allowlist of tables that are meant to stay uncompressed, for example data already compressed by the application, then skip them in `flagged`.
    - Also flag tables on a weak `chunk_length_in_kb` for the read pattern, not only tables with no compressor at all.

    ## Links

    - [Cassandra CQL table options](https://cassandra.apache.org/doc/stable/cassandra/developing/cql/ddl.html#create-table-options)
    - [Cassandra compression subproperties](https://cassandra.apache.org/doc/stable/cassandra/managing/operating/compression.html)
    - [plugin-cassandra documentation](https://kestra.io/plugins/plugin-cassandra)
    - [Slack plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
