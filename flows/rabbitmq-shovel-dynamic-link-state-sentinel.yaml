id: rabbitmq-shovel-dynamic-link-state-sentinel
namespace: company.messaging

inputs:
  - id: rabbitmq_host
    type: STRING
    defaults: "rabbitmq.internal"
    description: Hostname of RabbitMQ server.
  - id: rabbitmq_port
    type: INT
    defaults: 15672
    description: RabbitMQ management HTTP port.
  - id: rabbitmq_user
    type: STRING
    defaults: "guest"
    description: RabbitMQ management user.

tasks:
  - id: query_shovel_status
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query RabbitMQ Management API for shovels status
        curl -s -u "{{ inputs.rabbitmq_user }}:{{ secret('RABBITMQ_PASSWORD') }}"           "http://{{ inputs.rabbitmq_host }}:{{ inputs.rabbitmq_port }}/api/shovels" > /tmp/shovel_telemetry.json
        
        # Count shovels where state != "running"
        UNHEALTHY_SHOVELS=$(jq '[.[]? | select(.state != "running")] | length // 0' /tmp/shovel_telemetry.json)
        TOTAL_SHOVELS=$(jq 'length // 0' /tmp/shovel_telemetry.json)
        
        echo "::set-output name=unhealthy_shovels::$UNHEALTHY_SHOVELS::"
        echo "::set-output name=total_shovels::$TOTAL_SHOVELS::"

  - id: evaluate_shovel_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_shovel_status.vars.unhealthy_shovels | int > 0 }}"
    then:
      - id: notify_messaging_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#messaging-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 RabbitMQ Dynamic Shovel Terminated Alert",
                "text": "RabbitMQ server at `{{ inputs.rabbitmq_host }}` reported *{{ outputs.query_shovel_status.vars.unhealthy_shovels }} unhealthy shovel link(s)* out of {{ outputs.query_shovel_status.vars.total_shovels }} total shovels! Cross-cluster replication has stalled or encountered network socket errors.",
                "footer": "Kestra Messaging Sentinel • RabbitMQ"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#messaging-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ RabbitMQ Shovel Sentinel Failure",
            "text": "Failed to query RabbitMQ Management API for shovels. Verify credentials and management port.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits RabbitMQ dynamic shovels for stalled or terminated replication links to prevent cross-datacenter message stalls."
  metaTitle: RabbitMQ Dynamic Shovel Cross-Cluster Link State Sentinel with Kestra
  title: RabbitMQ Dynamic Shovel Cross-Cluster Link State Sentinel
  shortDescription: Audits RabbitMQ dynamic shovels for stalled or terminated replication links to prevent cross-datacenter message stalls.
  description: |
    ## How it works
    This workflow connects to the RabbitMQ Management HTTP API (`/api/shovels`) using basic authentication to audit the operational status of dynamic shovels. RabbitMQ shovels reliably forward messages between queues or exchanges across different brokers, virtual hosts, or geographic datacenters. When remote brokers become unreachable, SSL handshake errors occur, or credentials expire, shovel links transition from `running` to `terminated` or `starting` retry loops, causing source queues to fill up. This workflow tracks shovel link states and alerts messaging teams immediately upon disconnect.

    ## What you get
    - Real-time detection of broken cross-cluster message replication in RabbitMQ.
    - Prevents source queue message backlogs and queue overflow.
    - Clear quantitative counts of operational versus unhealthy shovel links.

    ## Who it's for
    - Messaging Infrastructure Engineers and RabbitMQ Administrators.
    - Distributed Systems Architects designing hybrid-cloud message forwarding.

    ## Why orchestrate this with Kestra
    - **Continuous Messaging Health Auditing**: Periodically polls broker replication links without custom daemons.
    - **Decoupled Architecture**: Scrapes management API externally.
    - **Instant Team Escalation**: Delivers structured notifications with shovel counts directly to Slack.

    ## Prerequisites
    - RabbitMQ broker running with management plugin enabled (`rabbitmq_management`).
    - Secrets `RABBITMQ_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input RabbitMQ host, port, and user.
    3. Run the workflow to inspect shovel statuses.

    ## How to extend
    - Automatically restart terminated shovels via RabbitMQ HTTP API (`DELETE` and `PUT` shovel definition).
    - Correlate with source queue message depth.

    ## Links
    - [RabbitMQ Shovel Plugin Documentation](https://www.rabbitmq.com/docs/shovel)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  demo: false
