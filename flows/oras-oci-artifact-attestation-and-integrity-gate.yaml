id: oras-oci-artifact-attestation-and-integrity-gate
namespace: company.security

inputs:
  - id: artifact_reference
    type: STRING
    displayName: OCI Artifact Reference
    defaults: "ghcr.io/oras-project/oras:v1.2.2"
    description: Fully qualified OCI registry reference of the container image, Helm chart, or WASM artifact to verify.

  - id: expected_digest
    type: STRING
    displayName: Expected Manifest Digest
    defaults: ""
    description: Optional expected manifest SHA256 digest (sha256:...) to verify cryptographic identity and block tag mutation.

  - id: require_sbom
    type: BOOL
    displayName: Enforce SBOM Attestation Policy
    defaults: true
    description: When true, the artifact must have an attached CycloneDX or SPDX SBOM referrer in the OCI registry.

  - id: require_signature
    type: BOOL
    displayName: Enforce Cryptographic Signature Policy
    defaults: false
    description: When true, the artifact must have an attached Cosign or Notary signature referrer.

  - id: max_artifact_size_mib
    type: INT
    displayName: Maximum Artifact Size Budget (MiB)
    defaults: 500
    description: Maximum permitted aggregate size of all artifact layers in MiB before failing quota checks.

  - id: slack_channel
    type: STRING
    displayName: Slack Notification Channel
    defaults: "#security-release-gates"
    description: Destination Slack channel for supply-chain security alerts and promotion approvals.

triggers:
  - id: oci_artifact_push_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Triggered immediately when a CI pipeline or registry webhook publishes a new OCI artifact.
    key: "{{ secret('OCI_WEBHOOK_KEY') }}"
    disabled: true

  - id: nightly_supply_chain_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled nightly scan of recently released artifacts to verify attestation persistence.
    cron: "0 3 * * *"
    disabled: true

tasks:
  - id: audit_oci_artifact
    type: io.kestra.plugin.scripts.shell.Commands
    description: Queries OCI registry with ORAS to fetch manifests, inspect layer digests, and discover attached supply-chain attestations.
    containerImage: alpine:3.20
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      ARTIFACT_REF: "{{ inputs.artifact_reference }}"
      EXPECTED_DIGEST: "{{ inputs.expected_digest }}"
      REQUIRE_SBOM: "{{ inputs.require_sbom }}"
      REQUIRE_SIG: "{{ inputs.require_signature }}"
      MAX_SIZE_MIB: "{{ inputs.max_artifact_size_mib }}"
      REGISTRY_USER: "{{ secret('OCI_REGISTRY_USERNAME') }}"
      REGISTRY_PASS: "{{ secret('OCI_REGISTRY_PASSWORD') }}"
    beforeCommands:
      - apk add --no-cache curl tar bash python3 jq
      - curl -sLo /tmp/oras.tar.gz https://github.com/oras-project/oras/releases/download/v1.2.2/oras_1.2.2_linux_amd64.tar.gz
      - tar -zxf /tmp/oras.tar.gz -C /usr/local/bin oras && chmod +x /usr/local/bin/oras
    commands:
      - python3 audit_oras.py
    inputFiles:
      audit_oras.py: |
        import os
        import sys
        import json
        import subprocess

        artifact_ref = os.environ.get("ARTIFACT_REF", "ghcr.io/oras-project/oras:v1.2.2").strip()
        expected_digest = os.environ.get("EXPECTED_DIGEST", "").strip()
        require_sbom = os.environ.get("REQUIRE_SBOM", "true").lower() == "true"
        require_sig = os.environ.get("REQUIRE_SIG", "false").lower() == "true"
        max_size_mib = int(os.environ.get("MAX_SIZE_MIB", "500"))
        registry_user = os.environ.get("REGISTRY_USER", "").strip()
        registry_pass = os.environ.get("REGISTRY_PASS", "").strip()

        # Optional registry authentication
        if registry_user and registry_pass:
            registry_host = artifact_ref.split("/")[0]
            login_cmd = subprocess.run(["oras", "login", registry_host, "-u", registry_user, "-p", registry_pass], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
            if login_cmd.returncode != 0:
                print(f"Registry login warning: {login_cmd.stderr.strip()}")

        # Step 1: Fetch the manifest's own descriptor (mediaType/digest/size of the manifest itself,
        # distinct from the digest of its config blob) to verify cryptographic identity.
        manifest_digest = None
        descriptor_fetch = subprocess.run(["oras", "manifest", "fetch", "--descriptor", artifact_ref], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

        if descriptor_fetch.returncode == 0:
            try:
                manifest_digest = json.loads(descriptor_fetch.stdout).get("digest")
            except Exception:
                manifest_digest = None

        # Step 2: Fetch the manifest body to compute aggregate layer size
        manifest_raw = None
        manifest_fetch = subprocess.run(["oras", "manifest", "fetch", artifact_ref], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

        if manifest_fetch.returncode == 0:
            try:
                manifest_raw = json.loads(manifest_fetch.stdout)
            except Exception:
                manifest_raw = None

        if manifest_raw is None or manifest_digest is None:
            output_payload = {
                "compliance_status": "AUDIT_PROBE_FAILED",
                "artifact_digest": "unknown",
                "total_size_mib": 0,
                "referrers_count": 0,
                "has_sbom": False,
                "has_signature": False
            }
            print(f"Unable to fetch manifest or descriptor for {artifact_ref}. manifest_fetch_rc={manifest_fetch.returncode}, descriptor_fetch_rc={descriptor_fetch.returncode}.")
            print(f'::{{"outputs": {json.dumps(output_payload)}}}::')
            sys.exit(0)

        layers = manifest_raw.get("layers", [])
        total_bytes = sum(l.get("size", 0) for l in layers)
        total_mib = total_bytes / (1024 * 1024)

        # Step 3: Discover attached referrers (SBOM, Signatures)
        discover_cmd = subprocess.run(["oras", "discover", artifact_ref, "-o", "json"], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
        referrers = []
        if discover_cmd.returncode == 0:
            try:
                discover_data = json.loads(discover_cmd.stdout)
                referrers = discover_data.get("manifests", [])
            except Exception:
                referrers = []

        has_sbom = any(
            "cyclonedx" in str(r.get("artifactType", "")).lower() or
            "spdx" in str(r.get("artifactType", "")).lower() or
            "cyclonedx" in str(r.get("mediaType", "")).lower()
            for r in referrers
        )

        has_signature = any(
            "sig" in str(r.get("artifactType", "")).lower() or
            "cosign" in str(r.get("artifactType", "")).lower() or
            "notary" in str(r.get("artifactType", "")).lower()
            for r in referrers
        )

        # Step 4: Evaluate compliance policies (manifest_digest already set from the descriptor fetch above)
        digest_mismatch = bool(expected_digest and expected_digest != manifest_digest)
        quota_exceeded = total_mib > max_size_mib
        missing_sbom = require_sbom and not has_sbom
        missing_signature = require_sig and not has_signature

        if digest_mismatch:
            compliance_status = "DIGEST_INTEGRITY_MISMATCH"
        elif missing_sbom or missing_signature:
            compliance_status = "UNATTESTED_ARTIFACT_BLOCKED"
        elif quota_exceeded:
            compliance_status = "ARTIFACT_QUOTA_EXCEEDED"
        else:
            compliance_status = "COMPLIANCE_VERIFIED_CLEAN"

        report = [
            f"# ORAS Supply-Chain Security & Attestation Report",
            f"- **Artifact**: `{artifact_ref}`",
            f"- **Compliance Status**: `{compliance_status}`",
            f"- **Manifest Digest**: `{manifest_digest}`",
            f"- **Total Layer Size**: {total_mib:.2f} MiB (Budget: {max_size_mib} MiB)",
            f"- **Attached Referrers**: {len(referrers)}",
            f"- **SBOM Attestation Attached**: {has_sbom} (Required: {require_sbom})",
            f"- **Signature Attestation Attached**: {has_signature} (Required: {require_sig})",
            "",
            "## Attached Supply-Chain Descriptors"
        ]

        if referrers:
            for r in referrers:
                report.append(f"- `[{r.get('artifactType', r.get('mediaType', 'unknown'))}]` {r.get('digest', 'n/a')} ({r.get('size', 0)} bytes)")
        else:
            report.append("No attached referrers discovered in target OCI registry.")

        report_md = "\n".join(report)
        print(report_md)

        output_payload = {
            "compliance_status": compliance_status,
            "artifact_digest": manifest_digest,
            "total_size_mib": round(total_mib, 2),
            "referrers_count": len(referrers),
            "has_sbom": has_sbom,
            "has_signature": has_signature
        }
        print(f'::{{"outputs": {json.dumps(output_payload)}}}::')

  - id: route_promotion_decision
    type: io.kestra.plugin.core.flow.Switch
    description: Evaluates artifact supply-chain audit to block unverified releases or grant production deployment admission.
    value: "{{ outputs.audit_oci_artifact.vars.compliance_status }}"
    cases:
      "UNATTESTED_ARTIFACT_BLOCKED":
        - id: alert_missing_attestation_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatches supply-chain security incident alert to Slack when an artifact lacks required SBOM attestations.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":rotating_light: *ORAS Supply-Chain Gate Tripped: Unattested OCI Artifact* :rotating_light:\n*Artifact:* `{{ inputs.artifact_reference }}`\n*Error:* Required SBOM or cryptographic signature attestation missing in registry.\n*Action:* Attach a CycloneDX/SPDX SBOM using `oras attach {{ inputs.artifact_reference }} --artifact-type application/vnd.cyclonedx+json sbom.json`."
            }

        - id: halt_on_missing_attestation
          type: io.kestra.plugin.core.execution.Fail
          description: Halts execution to prevent unattested artifacts from entering production Kubernetes clusters.
          errorMessage: "SUPPLY-CHAIN POLICY VIOLATION: OCI artifact lacks required SBOM attestation. Deployment blocked."

      "DIGEST_INTEGRITY_MISMATCH":
        - id: alert_digest_mismatch_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatches high-severity alert to Slack when manifest digest does not match the expected release checksum.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":warning: *ORAS Integrity Gate Tripped: Manifest Digest Mismatch* :warning:\n*Artifact:* `{{ inputs.artifact_reference }}`\n*Observed Digest:* `{{ outputs.audit_oci_artifact.vars.artifact_digest }}`\n*Expected Digest:* `{{ inputs.expected_digest }}`\n*Action:* Investigate potential tag mutation or unauthorized image overwrite."
            }

        - id: halt_on_digest_mismatch
          type: io.kestra.plugin.core.execution.Fail
          description: Halts workflow when artifact digest mismatch indicates potential registry tampering.
          errorMessage: "INTEGRITY ERROR: Artifact manifest digest does not match expected release checksum."

      "ARTIFACT_QUOTA_EXCEEDED":
        - id: alert_quota_breach_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Alerts platform engineering in Slack when aggregate artifact layer size exceeds budget limits.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":warning: *ORAS Size Gate Warning: Artifact Exceeds Quota* :warning:\n*Artifact:* `{{ inputs.artifact_reference }}`\n*Total Size:* `{{ outputs.audit_oci_artifact.vars.total_size_mib }} MiB` (Limit: `{{ inputs.max_artifact_size_mib }} MiB`)\n*Action:* Prune unneeded dependencies or optimize layer caching."
            }

        - id: halt_on_quota_breach
          type: io.kestra.plugin.core.execution.Fail
          description: Halts execution when artifact size budget is exceeded.
          errorMessage: "QUOTA EXCEEDED: OCI artifact total layer size exceeds maximum budget."

      "AUDIT_PROBE_FAILED":
        - id: alert_probe_failure_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Alerts the team when the manifest or descriptor could not be fetched, so compliance status could not be determined.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":warning: *ORAS Audit Probe Failed* :warning:\n*Artifact:* `{{ inputs.artifact_reference }}`\n*Action:* Could not fetch the manifest or its descriptor from the registry. Check registry credentials and reachability; this is not the same as a verified-clean audit."
            }

        - id: halt_on_probe_failure
          type: io.kestra.plugin.core.execution.Fail
          description: Halts execution since compliance could not be verified; treating a failed probe as a pass would be unsafe.
          errorMessage: "AUDIT PROBE FAILED: Could not fetch OCI manifest or descriptor for the artifact. Compliance status unknown."

    defaults:
      - id: log_compliance_certified
        type: io.kestra.plugin.core.log.Log
        description: Logs certification receipt confirming OCI artifact passes all supply-chain attestation and integrity gates.
        message: "ORAS supply-chain gate PASSED: Artifact {{ inputs.artifact_reference }} verified with digest {{ outputs.audit_oci_artifact.vars.artifact_digest }} and verified attestations."

extend:
  title: ORAS OCI Artifact Attestation and Supply Chain Integrity Gate
  metaTitle: ORAS OCI Artifact Attestation & Supply Chain Gate | Kestra
  shortDescription: Audits OCI container images, Helm charts, and WASM artifacts using ORAS to verify SBOM attestations, layer digests, and size quotas before deployment.
  metaDescription: Audit OCI artifacts with ORAS in Kestra to verify SBOM attestations, detect layer digest tampering, and gate deployment pipelines before cluster admission.
  description: |
    Prevents unattested container images, Helm packages, and WebAssembly binaries from reaching production Kubernetes clusters by orchestrating ORAS to verify software bill of materials (SBOM) referrers, detect layer digest tampering, and enforce artifact size quotas.

    ## How it works

    1. **Trigger Ingestion (`oci_artifact_push_webhook`, `nightly_supply_chain_audit`)**: Triggered immediately when CI/CD builders push a new artifact tag or manifest to the OCI registry via authenticated webhook, or executes on a recurring schedule to audit attestation persistence across release repositories.
    2. **ORAS Manifest & Referrer Inspection (`audit_oci_artifact`)**: Runs a containerized ORAS CLI task on Docker (`io.kestra.plugin.scripts.shell.Commands`) that authenticates against the target registry, fetches the manifest's own descriptor (`oras manifest fetch --descriptor`) to obtain its real cryptographic digest, retrieves the manifest body (`oras manifest fetch`) to calculate total layer size, and inspects attached supply-chain referrers (`oras discover`).
    3. **Attestation Policy Evaluation**: Evaluates whether required CycloneDX or SPDX SBOM descriptors (`application/vnd.cyclonedx+json`) and cryptographic signature referrers are linked to the artifact's root digest, and checks total layer weight against configurable size ceilings.
    4. **Promotion Governance Routing (`route_promotion_decision`)**: Evaluates the audit verdict via `io.kestra.plugin.core.flow.Switch`:
       - `UNATTESTED_ARTIFACT_BLOCKED`: Dispatches a security alert to Slack (`alert_missing_attestation_slack`) and halts the release pipeline via `io.kestra.plugin.core.execution.Fail` to enforce NIST SSDF / SLSA compliance.
       - `DIGEST_INTEGRITY_MISMATCH`: Alerts on-call engineers of potential tag mutability attacks or build desynchronizations.
       - `ARTIFACT_QUOTA_EXCEEDED`: Halts promotion when bloated images or artifacts violate storage budgets.
       - `AUDIT_PROBE_FAILED`: Alerts and halts when the manifest or its descriptor could not be fetched at all, since that is not the same as a verified-clean audit.
       - `COMPLIANCE_VERIFIED_CLEAN` (Default): Logs an audit certification receipt (`log_compliance_certified`) confirming the artifact is cryptographically certified for production deployment.

    ## What you get

    - **Zero-Trust Supply Chain Enforcement**: Enforces that no artifact enters production environments without verified SBOM provenance.
    - **Tag Mutability & Tamper Protection**: Validates observed manifest digests against release checksums to block unauthorized image overwrites.
    - **Automated Size Quota Defense**: Prevents multi-gigabyte unoptimized images from exhausting node disk caches.
    - **Audit-Ready Compliance Records**: Maintains detailed task execution logs containing discovered referrer digests and layer metrics.

    ## Who it's for

    - **DevSecOps & Security Engineers** implementing software supply chain security standards (SLSA, Executive Order 14028).
    - **Platform Engineers & SREs** managing enterprise container registries (Harbor, AWS ECR, GCP Artifact Registry, GitHub Packages).
    - **Release Managers** automating gated promotion of Helm charts, container images, and WASM modules into production Kubernetes clusters.

    ## Why orchestrate this with Kestra

    - **Declarative Governance Control Plane**: Integrates registry authentication, CLI referrer discovery, policy branching, and incident alerting into a single version-controlled YAML workflow.
    - **Dual Event & Schedule Triggers**: Combines real-time webhook responsiveness on new registry pushes with periodic drift auditing for persistent compliance.
    - **Secret Masking & Security**: Registry passwords and webhook tokens are injected securely via `{{ secret('NAME') }}` without risk of exposure in task outputs or Gantt visualizations.

    ## Prerequisites

    - A running Kestra v2.0 instance with Docker task runner support (`plugin-scripts-runner-docker`).
    - Network connectivity to the target OCI container registry.

    ### Secrets

    - `OCI_WEBHOOK_KEY`: Secret authentication key used to validate incoming CI/CD webhook payloads (required).
    - `OCI_REGISTRY_USERNAME`: Username for authenticating against private OCI registries (optional for public registries).
    - `OCI_REGISTRY_PASSWORD`: Password or token for private registry access (optional for public registries).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alerting on security policy breaches (optional).

    ## Quick start

    1. Configure `OCI_WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance under the `company.security` namespace.
    3. Click **Execute** with default inputs (`artifact_reference: ghcr.io/oras-project/oras:v1.2.2`) to verify the `COMPLIANCE_VERIFIED_CLEAN` certification path.
    4. Set `artifact_reference` to your team's production container image or Helm chart to verify live OCI referrers.
    5. Point your CI/CD pipeline or registry webhook at `oci_artifact_push_webhook` to automate supply-chain gating on every push.

    ## How to extend

    - **Vulnerability Scanning Integration**: Chain a `trivy` or `grype` scan task to inspect the discovered SBOM for fixable CVEs before granting admission.
    - **Automated Kubernetes Image Promotion**: Add a Git commit task (`io.kestra.plugin.git.Clone`) inside the `defaults` clean branch to automatically update GitOps manifests with the verified digest.
    - **Multi-Registry Mirroring**: Trigger downstream artifact replication to air-gapped or secondary regional registries once compliance is certified.

    ## Links

    - [ORAS Project Documentation](https://oras.land/docs/)
    - [OCI 1.1 Referrers Specification](https://github.com/opencontainers/image-spec/blob/main/manifest.md)
    - [Kestra Docker Task Runner](https://kestra.io/plugins/plugin-scripts-runner-docker)
    - [Kestra Switch Task Documentation](https://kestra.io/docs/workflow-components/flowable-tasks)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false