id: execution-sse-follower-with-state-timeline-and-log-alerts
namespace: company.team

description: |
  Follows any Kestra execution to its end over Server-Sent Events with `SseRequest` (one open connection, no polling loop),
  then turns the stream of execution snapshots into a state timeline CSV, counts WARN and ERROR log lines, publishes metrics
  and labels, keeps a summary in KV and pauses for a human when the followed run failed or logged too many errors.

labels:
  category: monitoring
  source: kestra-api

inputs:
  - id: execution_id
    type: STRING
    defaults: ""
    description: |
      Id of an execution to follow: one started from the UI, the API, a webhook or another namespace. It may already be
      finished, the stream then closes at once with its final state. Leave empty to start `target_flow_id` and follow it.

  - id: target_namespace
    type: STRING
    defaults: company.team
    description: Namespace of the flow to start when `execution_id` is empty.

  - id: target_flow_id
    type: STRING
    defaults: execution-sse-follower-with-state-timeline-and-log-alerts-demo-target
    description: |
      Flow to start and follow when `execution_id` is empty. The default is the small demo flow listed in the
      documentation below (INFO, WARN and ERROR log lines, a sleep, an optional failure). Point it at your own flow.

  - id: target_inputs
    type: JSON
    defaults: {"fail": false, "sleep_seconds": 8}
    description: Inputs passed to the started flow, a JSON object. Ignored when `execution_id` is given.

  - id: max_wait
    type: DURATION
    defaults: PT30M
    description: |
      Longest time the follower keeps the stream open. `SseRequest` only returns when the server closes the stream, so this
      is the task `timeout`; a target that runs longer fails this run (nothing is kept from a timed-out stream).

  - id: error_threshold
    type: INT
    defaults: 0
    min: 0
    description: More ERROR log lines than this in the followed execution, or a final state other than SUCCESS, asks a human for a review.

  - id: review_timeout
    type: DURATION
    defaults: PT1H
    description: How long the review pause waits for an answer. Without one the run continues and fails on the unacknowledged verdict.

  - id: top_n
    type: INT
    defaults: 5
    min: 1
    description: Number of tasks listed in the WARN/ERROR summary, worst first.

  - id: kestra_api_url
    type: STRING
    defaults: http://localhost:8080
    description: Base URL of this Kestra instance's API, as seen from the worker.

variables:
  tenant: main
  api: "{{ inputs.kestra_api_url | trim }}/api/v1/{{ vars.tenant }}"
  kv_prefix: sse_follower

checks:
  - when: "{{ (inputs.execution_id | trim) == '' or ((inputs.execution_id | trim | replace({'[^A-Za-z0-9]': ''}, regexp=true)) == (inputs.execution_id | trim) and (inputs.execution_id | trim | length) >= 10) }}"
    message: execution_id must be a Kestra execution id, letters and digits only. Copy it from the execution URL or the API.
    style: ERROR
    behavior: BLOCK_EXECUTION
  - when: "{{ (inputs.execution_id | trim) != '' or (inputs.target_namespace | trim | replace({'[^a-z0-9._-]': ''}, regexp=true)) == (inputs.target_namespace | trim) and (inputs.target_namespace | trim) != '' }}"
    message: target_namespace is not a valid namespace (lowercase letters, digits, dots, dashes and underscores).
    style: ERROR
    behavior: BLOCK_EXECUTION
  - when: "{{ inputs.target_inputs | jq('type == \"object\"') | first }}"
    message: "target_inputs must be a JSON object of input values for the started flow, for example {\"fail\": false}."
    style: ERROR
    behavior: BLOCK_EXECUTION

concurrency:
  limit: 3
  behavior: QUEUE

sla:
  - id: max_runtime
    type: MAX_DURATION
    duration: PT3H
    behavior: FAIL
    labels:
      sse_follower_sla: breached

triggers:
  - id: nightly_after_batch
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"
    disabled: true
    recoverMissedSchedules: LAST
    description: |
      Example: start the nightly batch and follow it. Enable after setting target_flow_id and target_inputs to your flow.
      LAST runs one catch-up execution after a downtime instead of one per missed slot.
    inputs:
      target_inputs: {"fail": false, "sleep_seconds": 8}

tasks:
  - id: probe_given_execution
    type: io.kestra.plugin.core.http.Request
    description: |
      Only for an execution_id given as input. The follow endpoint waits 10 seconds for an unknown id and then drops the
      stream, which `SseRequest` reports as a generic connection error. A plain GET first gives a clear message instead.
    runIf: "{{ (inputs.execution_id | trim) != '' }}"
    uri: "{{ render(vars.api) }}/executions/{{ (inputs.execution_id | trim) }}"
    options:
      allowFailed: true
      auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}
    timeout: PT1M

  - id: reject_unknown_execution
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ (inputs.execution_id | trim) != '' and (outputs.probe_given_execution.code ?? 200) != 200 }}"
    errorMessage: "Execution {{ (inputs.execution_id | trim) }} was not found in tenant {{ vars.tenant }} (HTTP {{ outputs.probe_given_execution.code ?? 'n/a' }}). Nothing was followed."

  - id: start_target
    type: io.kestra.plugin.core.http.Request
    description: |
      Starts the target through the executions API, the same call the UI makes, and returns at once with the new
      execution; the SSE stream below does the waiting. `formData` takes the whole `target_inputs` object, so any flow
      with any inputs can be started without editing this task (a Subflow task would need every input spelled out).
      A flow id that does not exist is a 404 here, before any stream is opened, and lands in the errors branch.
    runIf: "{{ (inputs.execution_id | trim) == '' }}"
    uri: "{{ render(vars.api) }}/executions/{{ inputs.target_namespace | trim }}/{{ inputs.target_flow_id | trim }}"
    method: POST
    contentType: multipart/form-data
    formData: "{{ inputs.target_inputs }}"
    params:
      labels: "followed_by:{{ execution.id }}"
    options:
      auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}
    timeout: PT1M

  - id: target
    type: io.kestra.plugin.core.output.OutputValues
    values:
      execution_id: "{{ (inputs.execution_id | trim) != '' ? (inputs.execution_id | trim) : fromJson(outputs.start_target.body).id }}"
      source: "{{ (inputs.execution_id | trim) != '' ? 'given' : 'started' }}"

  - id: follow
    type: io.kestra.plugin.core.http.SseRequest
    description: |
      The capability this blueprint teaches. `GET /executions/{id}/follow` is an SSE stream: a `start` event, one
      `progress` event with the whole execution each time a task run changes state, and an `end` event when the
      execution and every task run are terminal, after which the server closes the stream and this task returns.
      `concatJqExpression` runs on every event (`.data` is the execution) and the strings it returns are concatenated
      into `result`: here one JSON line per task run plus one for the execution, so the output is already JSONL.
      `failedOnMissingJq: false` keeps the task alive on the `start` event, which has no state yet. In Kestra 2.0.5 the
      task returns only when the server closes the stream, and an unclean close or the task `timeout` fails it with
      nothing kept, so follow endpoints that end (this one does) and size `max_wait` to the longest expected run.
    uri: "{{ render(vars.api) }}/executions/{{ outputs.target.values.execution_id }}/follow"
    headers:
      Accept: text/event-stream
    options:
      auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}
    timeout: "{{ inputs.max_wait }}"
    failedOnMissingJq: false
    concatJqExpression: >-
      [ (.data.taskRunList[]? | {at: .state.histories[-1].date, scope: "task", id: .taskId, state: .state.current, duration: (.state.duration // "")}),
        (.data | select(.state != null) | {at: .state.histories[-1].date, scope: "execution", id: .flowId, state: .state.current, duration: (.state.duration // "")}) ]
      | map(tojson + "\n") | join("")

  - id: snapshots_file
    type: io.kestra.plugin.core.storage.Write
    description: Moves the JSONL out of the execution context into internal storage, where the line-oriented storage tasks work.
    content: "{{ outputs.follow.result }}"
    extension: .jsonl

  - id: snapshots_ion
    type: io.kestra.plugin.serdes.json.JsonToIon
    from: "{{ outputs.snapshots_file.uri }}"
    newLine: true

  - id: transitions
    type: io.kestra.plugin.core.storage.DeduplicateItems
    description: |
      Every snapshot repeats the states that did not change. Keyed by scope, id and state, one row per state the stream saw
      remains (a state entered and left between two snapshots is not in any of them); `at` is the moment the state was
      entered, so it is the same in every copy. The task keeps the last copy of each key, in first-seen order.
    from: "{{ outputs.snapshots_ion.uri }}"
    expr: "{{ scope ~ '|' ~ id ~ '|' ~ state }}"

  - id: failed_tasks
    type: io.kestra.plugin.core.storage.FilterItems
    description: |
      Columns of the file are variables in the condition. The count is processed minus dropped, and it counts task runs,
      so a failed child inside an If or Sequential counts its parent too.
    from: "{{ outputs.transitions.uri }}"
    filterCondition: "{{ scope == 'task' and state == 'FAILED' }}"
    filterType: INCLUDE

  - id: timeline_csv
    type: io.kestra.plugin.serdes.csv.IonToCsv
    from: "{{ outputs.transitions.uri }}"

  - id: timeline_size
    type: io.kestra.plugin.core.storage.Size
    uri: "{{ outputs.timeline_csv.uri }}"

  - id: fetch_logs
    type: io.kestra.plugin.core.http.Request
    description: WARN and ERROR lines of the followed execution, now that it is finished. The body is a JSON array (the logs API filters with `filters[field][operation]`).
    uri: "{{ render(vars.api) }}/logs/{{ outputs.target.values.execution_id }}"
    params:
      "filters[level][GREATER_THAN_OR_EQUAL_TO]": WARN
    options:
      auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}
    timeout: PT1M
    retry: {type: exponential, interval: PT5S, maxInterval: PT1M, maxAttempts: 3}

  - id: summary
    type: io.kestra.plugin.core.output.OutputValues
    description: |
      The last execution-scope line of the stream is the final state (the `end` event). The JSONL string becomes a JSON
      array with one replace, so `jq` can read it in Pebble. Log lines are grouped per task for the top-N list.
    values:
      final: "{{ fromJson('[' ~ (outputs.follow.result | trim | replace({'\n': ','}, regexp=true)) ~ ']') | jq('map(select(.scope == \"execution\")) | last') | first | toJson }}"
      error_lines: "{{ outputs.fetch_logs.body | jq('map(select(.level == \"ERROR\")) | length') | first }}"
      warn_lines: "{{ outputs.fetch_logs.body | jq('map(select(.level == \"WARN\")) | length') | first }}"
      top: "{{ outputs.fetch_logs.body | jq('group_by(.taskId) | map({taskId: .[0].taskId, errors: (map(select(.level == \"ERROR\")) | length), warnings: (map(select(.level == \"WARN\")) | length)}) | map(select(.errors + .warnings > 0)) | sort_by(-.errors, -.warnings) | .[:' ~ inputs.top_n ~ ']') | first | toJson }}"
      failed_tasks: "{{ outputs.failed_tasks.processedItemsTotal - outputs.failed_tasks.droppedItemsTotal }}"

  - id: verdict
    type: io.kestra.plugin.core.output.OutputValues
    values:
      state: "{{ fromJson(outputs.summary.values.final).state }}"
      duration: "{{ fromJson(outputs.summary.values.final).duration != '' ? fromJson(outputs.summary.values.final).duration : 'PT0S' }}"
      review_needed: "{{ fromJson(outputs.summary.values.final).state != 'SUCCESS' or (outputs.summary.values.error_lines | number) > inputs.error_threshold }}"
      report: |
        {{ {
          'followed_execution': outputs.target.values.execution_id,
          'source': outputs.target.values.source,
          'flow': fromJson(outputs.summary.values.final).id,
          'state': fromJson(outputs.summary.values.final).state,
          'ended_at': fromJson(outputs.summary.values.final).at,
          'duration': fromJson(outputs.summary.values.final).duration,
          'snapshots': outputs.follow.size,
          'transitions': outputs.transitions.numKeys,
          'failed_tasks': outputs.summary.values.failed_tasks | number,
          'error_lines': outputs.summary.values.error_lines | number,
          'warn_lines': outputs.summary.values.warn_lines | number,
          'top_tasks': fromJson(outputs.summary.values.top),
          'follower_execution': execution.id
        } | toJson }}

  - id: publish_metrics
    type: io.kestra.plugin.core.metric.Publish
    description: Counters per run and the followed execution's duration as a timer, so the Metrics tab charts them across runs.
    metrics:
      - type: counter
        name: snapshots
        value: "{{ outputs.follow.size }}"
        tags: {target: "{{ fromJson(outputs.summary.values.final).id }}"}
      - type: counter
        name: transitions
        value: "{{ outputs.transitions.numKeys }}"
        tags: {target: "{{ fromJson(outputs.summary.values.final).id }}"}
      - type: counter
        name: failed_tasks
        value: "{{ outputs.summary.values.failed_tasks }}"
        tags: {target: "{{ fromJson(outputs.summary.values.final).id }}"}
      - type: counter
        name: error_lines
        value: "{{ outputs.summary.values.error_lines }}"
        tags: {target: "{{ fromJson(outputs.summary.values.final).id }}"}
      - type: counter
        name: warn_lines
        value: "{{ outputs.summary.values.warn_lines }}"
        tags: {target: "{{ fromJson(outputs.summary.values.final).id }}"}
      - type: timer
        name: target_duration
        value: "{{ outputs.verdict.values.duration }}"
        tags: {target: "{{ fromJson(outputs.summary.values.final).id }}", state: "{{ outputs.verdict.values.state }}"}

  - id: label_run
    type: io.kestra.plugin.core.execution.Labels
    description: Filter the Executions page by followed execution, final state or error count.
    labels:
      followed_execution: "{{ outputs.target.values.execution_id }}"
      target_state: "{{ outputs.verdict.values.state }}"
      error_lines: "{{ outputs.summary.values.error_lines }}"

  - id: remember_summary
    type: io.kestra.plugin.core.kv.Set
    description: One key per followed flow, so a dashboard or the next run can read the latest report. Expires after 30 days.
    key: "{{ vars.kv_prefix }}_last_{{ fromJson(outputs.summary.values.final).id | replace({'[^A-Za-z0-9_-]': '_'}, regexp=true) }}"
    kvType: JSON
    value: "{{ outputs.verdict.values.report }}"
    ttl: P30D

  - id: review
    type: io.kestra.plugin.core.flow.If
    description: A failed target or too many ERROR lines pauses the run with the top-N list in the logs for the reviewer.
    condition: "{{ outputs.verdict.values.review_needed }}"
    then:
      - id: review_context
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "Review needed: {{ fromJson(outputs.summary.values.final).id }} ended {{ outputs.verdict.values.state }} with {{ outputs.summary.values.error_lines }} ERROR and {{ outputs.summary.values.warn_lines }} WARN lines (threshold {{ inputs.error_threshold }}). Worst tasks: {{ outputs.summary.values.top }}. Followed execution: {{ inputs.kestra_api_url | trim }}/ui/{{ vars.tenant }}/executions/{{ outputs.target.values.execution_id }}"
      - id: wait_for_review
        type: io.kestra.plugin.core.flow.Pause
        description: Without an answer within review_timeout the pause resumes with acknowledged = false and the verdict below fails the run.
        pauseDuration: "{{ inputs.review_timeout }}"
        behavior: RESUME
        onResume:
          - id: acknowledged
            type: BOOL
            displayName: The followed execution was reviewed and this outcome is accepted.
            defaults: false
          - id: note
            type: STRING
            defaults: ""

  - id: assert_outcome
    type: io.kestra.plugin.core.execution.Assert
    description: |
      Green when no review was needed or a human acknowledged it. Otherwise the run fails and the errors branch alerts
      and dead-letters it. OutputValues renders every value to text, so the flag is compared as the string 'false'.
    conditions:
      - "{{ outputs.verdict.values.review_needed == 'false' or (outputs.wait_for_review.onResume.acknowledged ?? false) }}"
    errorMessage: "{{ fromJson(outputs.summary.values.final).id }} ({{ outputs.target.values.execution_id }}) ended {{ outputs.verdict.values.state }} with {{ outputs.summary.values.error_lines }} ERROR lines and nobody acknowledged it{{ (outputs.wait_for_review.onResume.note ?? '') != '' ? ': ' ~ outputs.wait_for_review.onResume.note : '' }}."

errors:
  - id: failure
    type: io.kestra.plugin.core.output.OutputValues
    description: |
      Read once, before anything in this branch logs. The last ERROR line is the most specific one (Assert logs the failed
      condition first and its errorMessage, with the reviewer's note, after it). An SLA breach logs no task error at all.
    values:
      task: "{{ (errorLogs() | length) > 0 ? ((errorLogs() | last).taskId ?? 'none') : 'none' }}"
      reason: "{{ (errorLogs() | length) > 0 ? (errorLogs() | last).message : 'no task error was logged, which is how an SLA breach ends the run' }}"
      followed: "{{ outputs.target.values.execution_id ?? (inputs.execution_id | trim) }}"
      link: "{{ kestra.url ?? inputs.kestra_api_url }}/ui/{{ vars.tenant }}/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"

  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Follower failed in task {{ outputs.failure.values.task }}: {{ outputs.failure.values.reason }} {{ outputs.failure.values.link }}"

  - id: dead_letter
    type: io.kestra.plugin.core.kv.Set
    description: What was being followed and why it failed, kept 7 days, so a replay can pass the same execution_id again.
    key: "{{ vars.kv_prefix }}_dlq_{{ execution.id }}"
    kvType: JSON
    ttl: P7D
    value: |
      {{ {
        'follower_execution': execution.id,
        'followed_execution': outputs.failure.values.followed,
        'target_flow': inputs.target_flow_id,
        'target_state': outputs.verdict.values.state ?? 'unknown',
        'failed_task': outputs.failure.values.task,
        'reason': outputs.failure.values.reason,
        'failed_at': execution.startDate
      } | toJson }}

  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: allowFailure so a missing SLACK_WEBHOOK_URL does not hide the original error; the same text is in the ERROR log above.
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":rotating_light: SSE follower failed for {{ outputs.failure.values.followed != '' ? outputs.failure.values.followed : inputs.target_flow_id }} in `{{ outputs.failure.values.task }}`: {{ outputs.failure.values.reason }} {{ outputs.failure.values.link }}"

finally:
  - id: log_report
    type: io.kestra.plugin.core.log.Log
    description: Always runs, also after a failure, so every run leaves one line with what was followed and how far it got.
    message: "Report: {{ outputs.verdict.values.report ?? ('{\"followed_execution\": \"' ~ (outputs.target.values.execution_id ?? (inputs.execution_id | trim)) ~ '\", \"state\": \"unknown, the stream did not complete\"}') }}"

afterExecution:
  - id: notify_outcome
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Runs once the final state is known. Skipped for ordinary failures, which the errors branch already reported; an SLA breach skips finally, so this is where it shows.
    runIf: "{{ execution.state != 'FAILED' or (labels.sse_follower_sla ?? '') == 'breached' }}"
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: "SSE follower ended {{ execution.state }}{{ (labels.sse_follower_sla ?? '') == 'breached' ? ' because the 3-hour SLA was breached' : '' }}: {{ outputs.verdict.values.report ?? 'no report' }} {{ kestra.url ?? inputs.kestra_api_url }}/ui/{{ vars.tenant }}/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"

outputs:
  - id: timeline_csv
    type: FILE
    required: false
    description: One row per state transition of the followed execution. Absent when the run failed before the stream completed.
    value: "{{ outputs.timeline_csv.uri ?? null }}"
  - id: report
    type: JSON
    value: "{{ outputs.verdict.values.report ?? '{}' }}"
  - id: target_state
    type: STRING
    value: "{{ outputs.verdict.values.state ?? 'unknown' }}"

extend:
  title: Follow any Kestra execution over Server-Sent Events with SseRequest, build its state timeline and alert on its logs
  metaTitle: Follow a Kestra Execution over SSE with SseRequest, Timeline CSV and Log Alerts | Kestra
  shortDescription: Starts or picks a Kestra execution and follows it to the end over one SSE connection with SseRequest, no polling loop. Builds a state-transition CSV, counts WARN and ERROR lines per task, publishes metrics and labels, keeps the report in KV and pauses for a human when the run failed or logged too many errors.
  metaDescription: Server-Sent Events in Kestra with SseRequest. Follow an execution to its end, turn the event stream into a timeline CSV, count log errors per task, publish metrics, pause for review and alert on Slack.
  description: |
    When a flow is started from the UI, the API, a webhook or another team's namespace, somebody wants to wait for it and learn how it went: which tasks ran, when each changed state, how many errors it logged, whether a person should look. The usual answer is a polling loop, one request per tick that still misses short-lived states. This flow waits on one open connection instead: Kestra's API streams every execution as Server-Sent Events at `GET /executions/{id}/follow`, and `io.kestra.plugin.core.http.SseRequest` consumes the stream, shapes each event with `jq` and returns when the server closes it. From that one task come a state timeline CSV, a WARN/ERROR summary per task, metrics, labels, a KV report, a review pause and Slack alerts.

    ## The constraint to know before using SseRequest

    In Kestra 2.0.5 `SseRequest` returns only when the server closes the stream; there is no event limit or idle cut-off (the `maxEvents` seen in some examples is not in the schema). An unclean close, or the task `timeout`, fails the task with nothing kept, not even the events already received. So the stream must be finite and closed cleanly by the server. The execution follow endpoint is: a `start` event, a `progress` event per task run state change, an `end` event once everything is terminal, then the close. The Wikimedia EventStreams feed was tried first and shows what does not work: its edge cuts every connection after 15 minutes and the task failed with no partial result. `/logs/{id}/follow` never completes, so it is unusable too. Size `max_wait` to your longest run.

    ## How it works

    1. `probe_given_execution` (`http.Request`, `allowFailed: true`, only with an `execution_id`) checks the id exists, because the follow endpoint drops the stream for an unknown id after ten seconds and `SseRequest` reports only a generic connection error. `reject_unknown_execution` (`Fail`) turns the 404 into a clear message.
    2. `start_target` (`http.Request`, only without an `execution_id`) starts `target_flow_id` with `POST /executions/{namespace}/{flow}` and `formData: "{{ inputs.target_inputs }}"`, so any flow with any inputs starts without editing the task (`Subflow` needs each input spelled out). An unknown flow id is a 404 here, before any stream opens. `target` (`OutputValues`) resolves the id to follow.
    3. `follow` (`SseRequest`) opens `/executions/{id}/follow` with `timeout: {{ inputs.max_wait }}`. `concatJqExpression` runs on every event (`.data` is the execution) and emits a JSON line per task run plus one for the execution (`at`, `scope`, `id`, `state`, `duration`), so `result` is JSONL. `failedOnMissingJq: false` keeps the task alive on the `start` event, which has no state yet.
    4. `snapshots_file` (`storage.Write`) and `snapshots_ion` (`JsonToIon`) move the JSONL into internal storage. `transitions` (`DeduplicateItems` on `scope|id|state`) keeps one row per state the stream saw, `failed_tasks` (`FilterItems`) counts failed task runs (both reference columns directly, not `item.`), `timeline_csv` (`IonToCsv`) and `timeline_size` (`Size`) write the CSV.
    5. `fetch_logs` (`http.Request`) reads WARN and ERROR lines with `filters[level][GREATER_THAN_OR_EQUAL_TO]=WARN` (`minLevel` is ignored by 2.0.5). `summary` and `verdict` (`OutputValues`) take the last execution-scope line as the final state, group the log lines per task into a worst-first top-N list and ask for a review when the state is not SUCCESS or there are more ERROR lines than `error_threshold`. `OutputValues` renders to text, so `review_needed` is compared with the string `'false'` later.
    6. `publish_metrics` (`metric.Publish`) emits five counters and a timer, `label_run` (`Labels`) sets `followed_execution`, `target_state` and `error_lines`, and `remember_summary` (`kv.Set`, 30-day `ttl`) stores the report as `sse_follower_last_<flow>`.
    7. `review` (`If`) logs the context at WARN and pauses in `wait_for_review` (`Pause`, `onResume` form with `acknowledged` and `note`); unanswered within `review_timeout`, it resumes with `acknowledged = false`. `assert_outcome` (`Assert`) passes when no review was needed or it was acknowledged, otherwise the run fails with the note in the message.

    ## Error handling

    - `errors`: `failure` (`OutputValues`) reads `errorLogs()` once, before the branch logs anything, and takes the last ERROR line, the most specific one (Assert logs the condition first and its `errorMessage` after). `log_failure` writes it, `dead_letter` (`kv.Set`, 7-day `ttl`, key `sse_follower_dlq_<execution>`) keeps the followed id, task and reason for a replay, `alert_failure` (Slack, `allowFailure: true`) posts it.
    - `finally` always logs one report line. `afterExecution` posts the outcome once the final state is known; it skips ordinary failures except an SLA breach, which on 2.0.5 skips `finally` and is only visible here (label `sse_follower_sla: breached`).
    - `checks` block the run before it exists for a malformed `execution_id` or `target_namespace`, or a `target_inputs` that is not a JSON object.

    ## How to run

    Secrets: `KESTRA_API_USERNAME` and `KESTRA_API_PASSWORD` (a user who can read executions and logs and start the target), optionally `SLACK_WEBHOOK_URL`. Create the demo target below and run the follower with its defaults: the target logs INFO and WARN lines, sleeps and succeeds; the follower ends SUCCESS with a ten-row timeline and `error_lines: 0`. Then try `target_inputs: {"reject_rows": true}` (three ERROR lines, the run pauses with the worst tasks in the log; resume with `acknowledged: true`) and `{"fail": true}` (resume with `acknowledged: false` to see the errors branch, the DLQ key and the Slack alert). To follow an existing run, pass its id as `execution_id`.

    ```yaml
    id: execution-sse-follower-with-state-timeline-and-log-alerts-demo-target
    namespace: company.team
    inputs:
      - {id: sleep_seconds, type: INT, defaults: 8}
      - {id: reject_rows, type: BOOL, defaults: false}
      - {id: fail, type: BOOL, defaults: false}
    tasks:
      - {id: extract, type: io.kestra.plugin.core.log.Log, message: Extracted 20 pages}
      - {id: transform, type: io.kestra.plugin.core.log.Log, level: WARN, message: 3 pages had no date}
      - {id: wait_for_downstream, type: io.kestra.plugin.core.flow.Sleep, duration: "PT{{ inputs.sleep_seconds }}S"}
      - id: load
        type: io.kestra.plugin.core.log.Log
        runIf: "{{ inputs.reject_rows }}"
        level: ERROR
        message: [Row 17 rejected, Row 34 rejected, Row 51 rejected]
      - {id: fail_on_demand, type: io.kestra.plugin.core.execution.Fail, runIf: "{{ inputs.fail }}", errorMessage: Load aborted}
      - {id: done, type: io.kestra.plugin.core.log.Log, message: Load finished}
    ```

    ## How to adapt

    - Point `target_flow_id` and `target_inputs` at your own flow and enable the `nightly_after_batch` trigger (`recoverMissedSchedules: LAST` runs one catch-up after downtime).
    - Follow another SSE source: change the `uri` and `concatJqExpression` of `follow`. Any endpoint that closes its stream when done works.
    - Raise `error_threshold` for flows that log expected errors, or make `verdict` look at `warn_lines`.
    - Read the KV report downstream with `kv('sse_follower_last_<flow>')`; replay a dead-lettered follow by passing its `followed_execution` as `execution_id`.

