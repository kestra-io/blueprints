id: argocd-application-target-revision-drift-auto-patch-gate
namespace: company.team

description: |
  Read an Argo CD application's live spec and check whether its targetRevision still matches the
  branch, tag, or commit your GitOps policy approves, classify any drift, auto-patch it back to
  the approved revision only when explicitly authorized, alert Slack otherwise, and log a
  governance audit trail either way.

inputs:
  - id: argocd_application
    type: STRING
    displayName: Argo CD application name
    description: Name of the Argo CD Application to check.
    defaults: "my-argocd-app"

  - id: expected_target_revision
    type: STRING
    displayName: Expected target revision
    description: The branch, tag, or commit this application's spec.source.targetRevision should be pinned to per your GitOps policy.
    defaults: "main"

  - id: confirm_patch
    type: BOOL
    displayName: Confirm automatic patch
    description: When true, this flow is authorized to patch the application's targetRevision back to expected_target_revision itself. When false, a drifted revision only alerts Slack so a human corrects it.
    defaults: false

tasks:
  - id: check_app_spec
    type: io.kestra.plugin.argocd.apps.Status
    description: Read-only probe. `argocd app get --output json` returns the full Application object; Status only parses sync/health state into typed outputs, so the live spec.source.targetRevision has to be read back out of rawOutput. Does not sync, patch, or roll back anything on the cluster.
    allowFailure: true
    server: "{{ secret('ARGOCD_SERVER') }}"
    token: "{{ secret('ARGOCD_TOKEN') }}"
    application: "{{ inputs.argocd_application }}"
    refresh: false

  - id: evaluate
    type: io.kestra.plugin.core.output.OutputValues
    description: Extracts the live targetRevision from the raw Application JSON and classifies it as aligned or drifted, folding confirm_patch into the drifted classification so the Switch branch needs no further nesting.
    values:
      live_target_revision: >-
        {{ outputs.check_app_spec is not defined ? '' : (({'rawOutput': outputs.check_app_spec.rawOutput} | jq('(.rawOutput | fromjson).spec.source.targetRevision // "UNKNOWN"')) | first) }}
      severity: >-
        {{ outputs.check_app_spec is not defined ? 'UNREACHABLE' : (((({'rawOutput': outputs.check_app_spec.rawOutput} | jq('(.rawOutput | fromjson).spec.source.targetRevision // "UNKNOWN"')) | first) == inputs.expected_target_revision) ? 'ALIGNED' : (inputs.confirm_patch ? 'DRIFT_AUTO_PATCH' : 'DRIFT_NEEDS_HUMAN')) }}

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    description: ALIGNED just logs. DRIFT_AUTO_PATCH performs the safe remediation (restoring the GitOps-approved revision) only when confirm_patch authorizes it. DRIFT_NEEDS_HUMAN and UNREACHABLE both alert Slack instead of acting.
    value: "{{ outputs.evaluate.values.severity }}"
    cases:
      "ALIGNED":
        - id: log_aligned
          type: io.kestra.plugin.core.log.Log
          message: "Argo CD application {{ inputs.argocd_application }} is pinned to the approved targetRevision '{{ inputs.expected_target_revision }}'."
      "DRIFT_AUTO_PATCH":
        - id: patch_target_revision
          type: io.kestra.plugin.argocd.apps.Patch
          description: Restores spec.source.targetRevision to the GitOps-approved value now that confirm_patch explicitly authorizes this flow to act.
          server: "{{ secret('ARGOCD_SERVER') }}"
          token: "{{ secret('ARGOCD_TOKEN') }}"
          application: "{{ inputs.argocd_application }}"
          patchType: MERGE
          patch: |
            {"spec": {"source": {"targetRevision": "{{ inputs.expected_target_revision }}"}}}
        - id: alert_auto_patched
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'DRIFT_AUTO_PATCH: Argo CD application ' ~ inputs.argocd_application ~ ' had targetRevision ' ~ '"' ~ outputs.evaluate.values.live_target_revision ~ '"' ~ ' instead of the approved ' ~ '"' ~ inputs.expected_target_revision ~ '"' ~ '. This flow patched it back automatically because confirm_patch is true.'} | toJson }}
      "DRIFT_NEEDS_HUMAN":
        - id: alert_drift
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'DRIFT_NEEDS_HUMAN: Argo CD application ' ~ inputs.argocd_application ~ ' has targetRevision ' ~ '"' ~ outputs.evaluate.values.live_target_revision ~ '"' ~ ' instead of the approved ' ~ '"' ~ inputs.expected_target_revision ~ '"' ~ '. Someone may have bypassed GitOps. Set confirm_patch to true to let this flow correct it, or patch it manually now.'} | toJson }}
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'UNREACHABLE: could not read Argo CD application ' ~ inputs.argocd_application ~ '. Check the server URL, token, and that the application name is correct.'} | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "Argo CD application target revision drift auto-patch gate complete for {{ inputs.argocd_application }}: severity {{ outputs.evaluate.values.severity }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Argo CD application target revision drift auto-patch gate failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable once ARGOCD_SERVER, ARGOCD_TOKEN, and SLACK_WEBHOOK_URL are set and the inputs point at a real application and its approved revision; confirm_patch stays false by default so drift alerts a human rather than being auto-corrected until you deliberately opt in.
    cron: "0 * * * *"
    disabled: true
    inputs:
      argocd_application: "my-argocd-app"
      expected_target_revision: "main"
      confirm_patch: false

extend:
  title: Argo CD Application Target Revision Drift Auto-Patch Gate
  metaTitle: Argo CD Target Revision Drift Auto-Patch Gate with Kestra
  shortDescription: Check whether an Argo CD application's live targetRevision has drifted from your GitOps policy, alert Slack or auto-patch it back, and log a governance audit trail.
  metaDescription: Detect Argo CD targetRevision drift, alert Slack or auto-patch it back to the approved revision, and log the result for platform teams.
  description: |
    Argo CD enforces that the cluster matches whatever `targetRevision` an Application's spec
    currently points to, but it has no opinion on whether that `targetRevision` itself is still
    the one your team approved. Someone with cluster or Argo CD UI access can point an
    Application at a different branch, a stale tag, or a one-off commit, and Argo CD will happily
    sync to it, fully "Synced" and "Healthy" the entire time. This blueprint checks the live spec
    against the revision you expect, and only corrects it once you have explicitly said this flow
    is allowed to.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `check_app_spec` (`io.kestra.plugin.argocd.apps.Status`) reads the full Application object
       via `argocd app get --output json`. The task only parses sync/health state into typed
       outputs, so `evaluate` reads the live `spec.source.targetRevision` back out of
       `rawOutput`.
    2. `evaluate` (`io.kestra.plugin.core.output.OutputValues`) compares the live
       `targetRevision` against `expected_target_revision` and classifies the result as
       `ALIGNED`, `DRIFT_AUTO_PATCH`, `DRIFT_NEEDS_HUMAN`, or `UNREACHABLE`, folding
       `confirm_patch` into the drifted classification itself.
    3. `route` (`io.kestra.plugin.core.flow.Switch`):
       - **ALIGNED:** logs that the application is pinned to the approved revision.
       - **DRIFT_AUTO_PATCH:** runs `io.kestra.plugin.argocd.apps.Patch` with a merge patch
         restoring `spec.source.targetRevision` (the safe remediation, since it restores the
         already-approved value), then posts a Slack notice that it happened automatically.
       - **DRIFT_NEEDS_HUMAN / UNREACHABLE:** posts a Slack alert instead of acting.
    4. `summary` logs the severity, closing the governance cycle.
    5. `errors` alerts Slack if the flow itself fails, for example a revoked Argo CD token.

    ## What you get

    - A drift check that looks at the GitOps policy itself, not just whether the cluster matches
      whatever the Application currently points to.
    - A patch that only ever restores a revision your team already approved, and only once you
      have explicitly set `confirm_patch` to allow it.
    - A Slack alert naming both the live and the expected revision, so a human can see exactly
      what changed without digging through the Argo CD UI.

    ## Who it's for

    - Platform and SRE teams running Argo CD who need to know when an Application's source has
      been pointed somewhere other than the approved branch or tag.
    - Teams evaluating the Argo CD plugin who want a worked example of `apps.Patch` used as a
      governance remediation, distinct from this repo's existing Argo CD blueprints, which watch
      sync and health status rather than the spec's own source configuration.

    ## Why orchestrate this with Kestra

    Argo CD reconciles the cluster to whatever `targetRevision` is currently set; it has no
    policy engine comparing that value against an approved one, and no Slack integration of its
    own. Kestra keeps `expected_target_revision` and `confirm_patch` as flow inputs, turns a raw
    `app get` response into a policy decision, and keeps a full execution history of every drift
    this flow has seen and what it did about it.

    ## Prerequisites

    - An Argo CD instance with API access and a token that can read and patch Applications.
    - An Application you can safely point at a different revision to test both the alert and the
      patch path.
    - A Slack incoming webhook URL.

    A local Argo CD instance can be installed into a `kind` (Kubernetes-in-Docker) cluster via
    Argo CD's official install manifests for a fully local end-to-end test, no managed account
    required.

    ### Secrets

    - `ARGOCD_SERVER`: the Argo CD API server URL used by `check_app_spec` and
      `patch_target_revision`. In Kestra OSS, provide it as the base64-encoded environment
      variable `SECRET_ARGOCD_SERVER`.
    - `ARGOCD_TOKEN`: the Argo CD authentication token. In Kestra OSS, provide it as the
      base64-encoded environment variable `SECRET_ARGOCD_TOKEN`.
    - `SLACK_WEBHOOK_URL`: used by all three Slack alert cases and the `errors` block. In Kestra
      OSS, provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `argocd_application` | `my-argocd-app` | Application to check |
    | `expected_target_revision` | `main` | GitOps-approved branch, tag, or commit |
    | `confirm_patch` | `false` | Authorizes this flow to patch the application itself |

    ### Outputs

    - `{{ outputs.check_app_spec.rawOutput }}`: the full `argocd app get --output json` response,
      as text.
    - `{{ outputs.evaluate.values.live_target_revision }}` / `.severity`: the application's live
      `targetRevision`, and `ALIGNED`, `DRIFT_AUTO_PATCH`, `DRIFT_NEEDS_HUMAN`, or `UNREACHABLE`.

    ### Pitfalls

    - `io.kestra.plugin.argocd.apps.Status`'s `Output` does not expose `spec` at all, only
      `syncStatus`, `healthStatus`, `conditions`, `resources`, and `rawOutput`; this is verified
      directly against the task's source, since neither its Javadoc examples nor its field list
      make that limitation obvious. `evaluate` works around it by parsing `rawOutput` itself with
      `fromjson` inside a `jq` filter.
    - This checks only `spec.source.targetRevision` for a single-source Application. A
      multi-source Application keeps its revisions under `spec.sources[].targetRevision`
      instead, which this blueprint does not read.
    - `confirm_patch` applies to the whole flow, not one specific drift; a scheduled run with
      `confirm_patch: true` will patch back any drift this flow finds on every run, so treat it as
      "this application's revision is fully policy-enforced," not a one-time approval.

    ## Quick start

    1. Add the `ARGOCD_SERVER`, `ARGOCD_TOKEN`, and `SLACK_WEBHOOK_URL` secrets.
    2. Point `argocd_application` at a real Application and `expected_target_revision` at its
       current, correct revision; run manually and confirm `log_aligned` fires.
    3. Change the Application's `targetRevision` (via the Argo CD UI or CLI) and run again with
       `confirm_patch: false`; confirm `alert_drift` fires.
    4. Run again with `confirm_patch: true`; confirm `patch_target_revision` restores it and
       `alert_auto_patched` fires.
    5. Enable the `hourly` trigger once the inputs reflect a real application and policy.

    ## How to extend

    - Extend the `jq` filter to also compare `spec.source.repoURL` and `spec.source.path`, so a
      redirected repository or path counts as drift too, not just the revision.
    - Loop over a list of tracked application names with `io.kestra.plugin.core.flow.ForEach` to
      run this policy check across an entire Argo CD project in one scheduled run.
    - Chain a lookup of the Git commit or PR that last touched the Application manifest to name
      the likely source of the drift in the Slack alert.

    ## Links

    - Argo CD plugin: https://kestra.io/plugins/plugin-argocd
    - Argo CD Application CRD reference: https://argo-cd.readthedocs.io/en/stable/operator-manual/application.yaml/
    - Argo CD local installation guide: https://argo-cd.readthedocs.io/en/stable/getting_started/
    - Slack incoming webhooks: https://api.slack.com/messaging/webhooks
  tags:
    - Infrastructure
  subTags:
    - GitOps & Flow Sync
    - Incident Response
  ee: false
  demo: false
