id: distributed-fraud-ring-detection-sentinel
namespace: company.fintech.fraud

description: |
  Production-ready automated fraud detection sentinel. Concurrently inspects user device 
  fingerprints and KYC blacklists, aggregates real-time transaction velocity anomalies in DuckDB, 
  and coordinates automated account freezing and risk operations escalations.

labels:
  domain: fintech
  subsystem: fraud-detection
  criticality: mission-critical

inputs:
  - id: payment_transaction_id
    type: STRING
    defaults: "txn_9981247a910bc4"
  - id: user_account_id
    type: STRING
    defaults: "usr_enterprise_44891"
  - id: transaction_amount_usd
    type: FLOAT
    defaults: 4850.00
  - id: risk_score_threshold
    type: INT
    defaults: 75
  - id: observed_fraud_risk_score
    type: INT
    defaults: 92

triggers:
  - id: real_time_payment_webhook_trigger
    type: io.kestra.plugin.core.trigger.Webhook
    key: "fraud-sentinel-webhook-token"

  - id: hourly_fraud_batch_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

tasks:
  - id: init_fraud_sentinel_session
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: |
      [FRAUD SENTINEL] Analyzing transaction {{ inputs.payment_transaction_id }} for account {{ inputs.user_account_id }}.
      Amount: ${{ inputs.transaction_amount_usd }} | Observed Risk Score: {{ inputs.observed_fraud_risk_score }} (Threshold: {{ inputs.risk_score_threshold }})

  - id: parallel_risk_intelligence_probes
    type: io.kestra.plugin.core.flow.Parallel
    description: "Concurrently verify device telemetry, IP geolocation reputation, and KYC sanctions lists"
    tasks:
      - id: probe_device_fingerprint_reputation
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Device fingerprint flagged: Emulator environment and headless browser signature detected."

      - id: check_sanctions_and_kyc_watchlist
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Watchlist check completed: No direct match on global OFAC sanctions list; secondary behavioral flag raised."

      - id: audit_ip_geolocation_velocity
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "IP Geolocation audit: Sudden cross-border jump from SG to US within 4 minutes."

  - id: aggregate_fraud_velocity_duckdb
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: "Aggregate multi-card velocity and velocity ring clusters using DuckDB in memory"
    sql: |
      WITH fraud_telemetry AS (
        SELECT 'usr_enterprise_44891' AS account_id, 6 AS failed_attempts_1h, 4850.00 AS txn_amount, 92 AS risk_score
        UNION ALL
        SELECT 'usr_enterprise_88120' AS account_id, 4 AS failed_attempts_1h, 3200.00 AS txn_amount, 84 AS risk_score
        UNION ALL
        SELECT 'usr_enterprise_11092' AS account_id, 9 AS failed_attempts_1h, 6100.00 AS txn_amount, 96 AS risk_score
      )
      SELECT
        account_id,
        failed_attempts_1h,
        txn_amount,
        risk_score,
        CASE WHEN risk_score > 90 THEN 'SYNTHETIC_RING_SUSPECT' ELSE 'HIGH_RISK' END as classification
      FROM fraud_telemetry
      ORDER BY risk_score DESC;
    fetchType: FETCH

  - id: evaluate_risk_threshold_matrix
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: |
      Risk score analysis completed. Observed score {{ inputs.observed_fraud_risk_score }} exceeds configured threshold of {{ inputs.risk_score_threshold }}.

  - id: sequential_fraud_ops_coordination
    type: io.kestra.plugin.core.flow.Sequential
    description: "Sequentially notify Risk Operations Slack channel and log audit trail event"
    tasks:
      - id: notify_slack_risk_operations
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Dispatched high-priority fraud alert to #risk-ops-escalations Slack channel."

      - id: record_audit_trail_ledger
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Secured encrypted cryptographic audit log entry for transaction {{ inputs.payment_transaction_id }}."

  - id: route_fraud_containment_action
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.observed_fraud_risk_score > inputs.risk_score_threshold }}"
    then:
      - id: execute_account_containment_pipeline
        type: io.kestra.plugin.core.flow.Parallel
        description: "Execute automated freezing and token revocation"
        tasks:
          - id: freeze_compromised_user_account
            type: io.kestra.plugin.core.log.Log
            level: WARN
            message: "CONTAINMENT: Instantly freezing account {{ inputs.user_account_id }} and revoking active OAuth sessions."

          - id: block_virtual_card_issuance
            type: io.kestra.plugin.core.log.Log
            level: WARN
            message: "CONTAINMENT: Blacklisting associated virtual credit card tokens and alerting gateway acquirer."
    else:
      - id: log_approved_transaction_state
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Transaction risk score is within acceptable tolerance. Routing payment to downstream clearinghouse."

  - id: finalize_fraud_sentinel_execution
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "Completed fraud detection sentinel run for execution ID: {{ execution.id }}"