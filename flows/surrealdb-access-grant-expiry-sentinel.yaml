id: surrealdb-access-grant-expiry-sentinel
namespace: company.team
description: |
  Run INFO FOR DB against a SurrealDB instance, flag any ACCESS method
  configured with DURATION FOR GRANT NONE (a refresh token grant that never
  expires), alert Slack on breach, and conditionally write an audit-trail
  record for each flagged access method. auto_remediate and dry_run are two
  independent gates; no ACCESS method definition is ever altered.

triggers:
  - id: periodic_grant_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every 6 hours. Shipped disabled; enable it once surrealdb_host/surrealdb_namespace/surrealdb_database point at a real instance and a manual run has been verified. Always fires in safe mode (auto_remediate false, dry_run true) regardless of this flow's own defaults.
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      auto_remediate: "false"
      dry_run: "true"

inputs:
  - id: surrealdb_host
    type: STRING
    displayName: "SurrealDB Host"
    defaults: "localhost"
    description: Hostname of the SurrealDB instance, matching this plugin's own documented connection pattern.

  - id: surrealdb_namespace
    type: STRING
    displayName: "SurrealDB Namespace"
    defaults: "test"
    description: SurrealDB namespace to connect to (not the Kestra flow namespace).

  - id: surrealdb_database
    type: STRING
    displayName: "SurrealDB Database"
    defaults: "test"
    description: SurrealDB database audited by INFO FOR DB.

  - id: surrealdb_username
    type: STRING
    displayName: "SurrealDB Username"
    defaults: "root"
    description: Must have rights to run INFO FOR DB and, if remediation runs, CREATE records.

  - id: max_unbounded_grants
    type: INT
    displayName: "Max Allowed Unbounded Grants"
    defaults: 0
    description: Breach when the count of ACCESS methods with DURATION FOR GRANT NONE exceeds this number. Default 0 means any such access method at all is a breach.

  - id: auto_remediate
    type: SELECT
    displayName: "Auto Remediate"
    defaults: "false"
    values:
      - "false"
      - "true"
    description: If "true" and unbounded-grant access methods are found, write an audit-trail record for each one (still gated by dry_run below). If "false", the risk is only reported.

  - id: dry_run
    type: SELECT
    displayName: "Dry Run"
    defaults: "true"
    values:
      - "true"
      - "false"
    description: If "true", remediation is only logged, no audit record is written. Must be explicitly "false", together with auto_remediate "true", for the record to actually be created.

tasks:
  - id: audit_access_grants
    type: io.kestra.plugin.surrealdb.Query
    description: Runs INFO FOR DB, SurrealDB's own system-introspection statement, which returns an accesses map keyed by access method name, each value being the re-serialized DEFINE ACCESS statement text - verified from SurrealDB's own documentation. fetchType STORE is used because this plugin's blueprint example documents STORE as the mode that exposes a downstream-readable uri output.
    host: "{{ inputs.surrealdb_host }}"
    namespace: "{{ inputs.surrealdb_namespace }}"
    database: "{{ inputs.surrealdb_database }}"
    username: "{{ inputs.surrealdb_username }}"
    password: "{{ secret('SURREALDB_PASSWORD') }}"
    query: "INFO FOR DB;"
    fetchType: STORE

  - id: evaluate_access_risk
    type: io.kestra.plugin.scripts.python.Script
    description: Reads the stored INFO FOR DB result and flags any access method whose definition text contains "FOR GRANT NONE" - SurrealDB's own documented syntax for a refresh-token grant that never expires. The exact JSON shape this task's STORE output wraps the query result in was not confirmed against a live instance, so the script handles both a bare result object and a list-of-statement-results defensively; see this blueprint's Pitfalls.
    inputFiles:
      info.json: "{{ outputs.audit_access_grants.uri }}"
    script: |
      import json
      from kestra import Kestra

      with open("info.json") as f:
          raw = json.load(f)

      if isinstance(raw, list):
          result = (raw[0].get("result", raw[0]) if isinstance(raw[0], dict) else raw[0]) if raw else {}
      else:
          result = raw

      accesses = (result or {}).get("accesses", {}) or {}

      unbounded_accesses = sorted(
          name for name, definition in accesses.items()
          if "FOR GRANT NONE" in str(definition)
      )

      Kestra.outputs({
          "unbounded_count": len(unbounded_accesses),
          "unbounded_accesses": unbounded_accesses,
      })

  - id: evaluate_access_gate
    type: io.kestra.plugin.core.flow.If
    description: Breach when at least one access method grants refresh tokens that never expire.
    condition: "{{ outputs.evaluate_access_risk.vars.unbounded_count > inputs.max_unbounded_grants }}"
    then:
      - id: route_remediation
        type: io.kestra.plugin.core.flow.Switch
        description: auto_remediate only decides whether remediation is considered at all; dry_run, checked separately below, decides whether the audit record is actually written.
        value: "{{ inputs.auto_remediate }}"
        cases:
          "true":
            - id: check_dry_run
              type: io.kestra.plugin.core.flow.If
              condition: "{{ inputs.dry_run == \"false\" }}"
              then:
                - id: record_flagged_access
                  type: io.kestra.plugin.core.flow.Loop
                  description: Write one audit-trail record per flagged access method, so one failed write never blocks the rest of the batch.
                  values: "{{ outputs.evaluate_access_risk.vars.unbounded_accesses }}"
                  concurrencyLimit: 4
                  tasks:
                    - id: create_audit_record
                      type: io.kestra.plugin.surrealdb.Query
                      description: A plain CREATE, matching this plugin's own documented example. It only adds a new security_audit_log record; it never runs ALTER ACCESS or touches the flagged access method's own definition - this blueprint does not attempt to change DURATION FOR GRANT, since ALTER ACCESS's support for modifying DURATION was not confirmed from available documentation.
                      host: "{{ inputs.surrealdb_host }}"
                      namespace: "{{ inputs.surrealdb_namespace }}"
                      database: "{{ inputs.surrealdb_database }}"
                      username: "{{ inputs.surrealdb_username }}"
                      password: "{{ secret('SURREALDB_PASSWORD') }}"
                      query: "CREATE security_audit_log SET access_name = '{{ item.value }}', risk = 'unbounded_grant_duration', flagged_at = time::now();"
                - id: log_remediation_applied
                  type: io.kestra.plugin.core.log.Log
                  message: "Recorded {{ outputs.evaluate_access_risk.vars.unbounded_count }} unbounded-grant access method(s) to security_audit_log in {{ inputs.surrealdb_database }}."
              else:
                - id: log_dry_run_remediation
                  type: io.kestra.plugin.core.log.Log
                  message: "DRY RUN: would record {{ outputs.evaluate_access_risk.vars.unbounded_count }} unbounded-grant access method(s) to security_audit_log in {{ inputs.surrealdb_database }} (dry_run is true). No record written."
          "false":
            - id: log_remediation_disabled
              type: io.kestra.plugin.core.log.Log
              message: "auto_remediate is false: {{ outputs.evaluate_access_risk.vars.unbounded_count }} access method(s) in {{ inputs.surrealdb_database }} grant refresh tokens that never expire, but no audit record was written."
      - id: alert_access_risk
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Always alert on any risk, independent of whether it was recorded.
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "SurrealDB access grant expiry sentinel: {{ outputs.evaluate_access_risk.vars.unbounded_count }} access method(s) in database {{ inputs.surrealdb_database }} on {{ inputs.surrealdb_host }} grant refresh tokens that never expire (DURATION FOR GRANT NONE). auto_remediate: {{ inputs.auto_remediate }}. dry_run: {{ inputs.dry_run }}. Recorded: {{ inputs.auto_remediate == \"true\" and inputs.dry_run == \"false\" }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_access_healthy
        type: io.kestra.plugin.core.log.Log
        message: "{{ inputs.surrealdb_database }} is healthy: 0 access methods grant refresh tokens that never expire."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status line for every run, independent of which branch fired, so the execution history always shows the headline numbers.
    message: "Access grant audit complete for {{ inputs.surrealdb_database }}. unbounded_count={{ outputs.evaluate_access_risk.vars.unbounded_count }}. threshold={{ inputs.max_unbounded_grants }}. auto_remediate={{ inputs.auto_remediate }}. dry_run={{ inputs.dry_run }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the flow itself fails outside the handled branches, for example an unreachable SurrealDB instance or insufficient privileges to run INFO FOR DB.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "SurrealDB access grant expiry sentinel FAILED in execution {{ execution.id }} for {{ inputs.surrealdb_database }} on {{ inputs.surrealdb_host }}. The access audit did not complete; investigate before trusting the last known grant status."
      }

extend:
  title: "SurrealDB Access Grant Expiry Sentinel"
  shortDescription: Audit SurrealDB for ACCESS methods that grant refresh tokens with no expiration, alert Slack on breach, and optionally write an audit-trail record for review.
  metaTitle: SurrealDB Access Grant Expiry Sentinel with Kestra
  metaDescription: "Audit SurrealDB ACCESS methods for refresh grants that never expire, alert on breach, and record flagged methods for review."
  description: |
    SurrealDB's own documentation calls out `DURATION FOR GRANT NONE` by name: a refresh
    token grant configured this way never expires. That is a deliberate, named capability,
    not a bug - but left in place on an ACCESS method nobody is actively reviewing, it is
    exactly the kind of standing risk a compliance program or security review will flag
    sooner or later. This blueprint runs `INFO FOR DB`, SurrealDB's own system-introspection
    statement, finds any ACCESS method configured this way, alerts Slack on breach, and can
    write an audit-trail record naming the flagged method for review - never altering the
    ACCESS method's own definition.

    ## How it works

    1. `periodic_grant_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 6 hours, always forcing `auto_remediate: "false"` and `dry_run: "true"` through its own `inputs:` override regardless of this flow's defaults. Shipped disabled so you can validate a manual run first.
    2. `audit_access_grants` (`io.kestra.plugin.surrealdb.Query`) runs `INFO FOR DB;` with `fetchType: STORE`, returning a `uri` to the stored result - SurrealDB's own `accesses` map, keyed by access method name, each value being the re-serialized `DEFINE ACCESS` statement text.
    3. `evaluate_access_risk` (`io.kestra.plugin.scripts.python.Script`) reads that stored result and collects every access method whose definition text contains `FOR GRANT NONE`, emitting `unbounded_count` and `unbounded_accesses` through `Kestra.outputs`.
    4. `evaluate_access_gate` (`io.kestra.plugin.core.flow.If`) flags a breach whenever `unbounded_count > max_unbounded_grants`.
       - `then` (breach): `route_remediation` (`io.kestra.plugin.core.flow.Switch` on `auto_remediate`) either considers remediation (`"true"`, gated again by `dry_run` through `check_dry_run`) or only logs that remediation is disabled (`"false"`). When both gates allow it, `record_flagged_access` (`io.kestra.plugin.core.flow.Loop`) runs `create_audit_record` (`io.kestra.plugin.surrealdb.Query`, a plain `CREATE`) for each flagged access method, writing a `security_audit_log` record. `alert_access_risk` always fires to Slack regardless of which path ran.
       - `else` (compliant): `log_access_healthy` records a clean check.
    5. `log_audit_complete` always runs last, printing the headline numbers regardless of which branch fired.
    6. The `errors` block alerts Slack separately if the flow itself fails - an unreachable instance or insufficient privileges must not read as "no breach".

    ## What you get

    - A concrete, named list of ACCESS methods configured to never expire their refresh grants, not a generic "review your auth config" reminder.
    - Remediation that only ever adds a `security_audit_log` record; the flagged ACCESS method's own `DURATION` settings are never changed by this flow.
    - Two independent gates (`auto_remediate`, `dry_run`) between "risk detected" and "audit record actually written".
    - A final status log every run, risk or not, so the execution history doubles as an access-grant posture history for the database.

    ## Who it's for

    - Platform and security teams running SurrealDB who need a standing check on authentication configuration, not a one-time schema review.
    - Teams using SurrealDB's `RECORD` or `BEARER` access methods for application auth who want unlimited refresh grants caught automatically.
    - Anyone evaluating the SurrealDB plugin who wants a worked example of `INFO FOR DB` beyond basic `CREATE`/`SELECT` usage.

    ## Why orchestrate this with Kestra

    `INFO FOR DB` is a one-shot introspection query with no memory of the last check, no threshold logic, and no notification path. Kestra supplies the schedule, the risk classification as a first-class branch, two independent authorization gates before anything is written, and an execution history that shows exactly when an unbounded grant first appeared and whether it was flagged for review.

    ## Prerequisites

    - A reachable SurrealDB instance and a user with rights to run `INFO FOR DB` and, if remediation runs, `CREATE` records.
    - A Slack incoming webhook for alerts.

    Local testing:
    `docker run -d --name surrealdb-grant-sentinel -p 8001:8000 surrealdb/surrealdb:latest start --user root --pass root`
    `docker network connect YOUR_KESTRA_NETWORK surrealdb-grant-sentinel` (only needed if the Kestra Worker runs in a separate Docker network than this container; set `surrealdb_host` to `surrealdb-grant-sentinel` from inside that network, or `localhost` with port `8001` from the host, matching this plugin's connection properties).

    ### Secrets

    - `SURREALDB_PASSWORD`: password for `surrealdb_username`, matching this plugin's own documented pattern (see `surreal-db.yaml`).
    - `SLACK_WEBHOOK`: Slack incoming webhook used by `alert_access_risk` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_SLACK_WEBHOOK=$(echo -n 'https://hooks.slack.com/...' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `surrealdb_host` (STRING, default `localhost`): SurrealDB connection host.
    - `surrealdb_namespace` (STRING, default `test`): SurrealDB namespace (distinct from the Kestra flow namespace).
    - `surrealdb_database` (STRING, default `test`): database audited by `INFO FOR DB`.
    - `surrealdb_username` (STRING, default `root`): account used to run the audit and, if enabled, the remediation.
    - `max_unbounded_grants` (INT, default `0`): breach threshold; `0` means any unbounded-grant access method at all breaches.
    - `auto_remediate` (SELECT: `"false"`, `"true"`; default `"false"`): must be `"true"` for the audit record to even be considered.
    - `dry_run` (SELECT: `"true"`, `"false"`; default `"true"`): must be explicitly `"false"`, together with `auto_remediate: "true"`, for the record to actually be written.

    ### Outputs

    - `outputs.audit_access_grants.uri`: the raw stored `INFO FOR DB` result for every run.
    - `outputs.evaluate_access_risk.vars.unbounded_count` / `.unbounded_accesses`: the computed risk result for every run.

    ## Quick start

    1. Start SurrealDB locally with the command above and define at least one access method with `DURATION FOR GRANT NONE` to produce a realistic breach (see SurrealDB's own `DEFINE ACCESS` documentation for the full statement syntax).
    2. Add the `SURREALDB_PASSWORD` and `SLACK_WEBHOOK` secrets.
    3. Run the flow manually with the defaults (`auto_remediate: "false"`) and confirm `alert_access_risk` fires naming the expected access method, and that `log_remediation_disabled` logs without writing anything.
    4. Run once with `auto_remediate: "true"` and `dry_run: "true"` and confirm `log_dry_run_remediation` describes the audit record without writing it.
    5. Run once with `auto_remediate: "true"` and `dry_run: "false"` and confirm with `SELECT * FROM security_audit_log;` that the record now exists.
    6. Enable `periodic_grant_check` once you trust the check; it always runs in the safe `auto_remediate: "false"` / `dry_run: "true"` mode regardless of what you leave the flow's own defaults set to.

    ## How to extend

    - Also run `INFO FOR ROOT;` to catch root-level access methods, not just database-level ones audited here.
    - Loop over several `surrealdb_database` values with `io.kestra.plugin.core.flow.Loop` (`ForEach` is deprecated) to sweep multiple databases in one run.
    - Route the remediation branch through a `Pause` approval task instead of (or alongside) the static `auto_remediate` input, for a human-reviewed record on production databases.
    - If your SurrealDB version's `ALTER ACCESS` confirms support for modifying `DURATION`, extend `create_audit_record` into an actual remediation step that bounds the grant duration - this blueprint deliberately only records the risk for review, since that capability was not confirmed from available documentation.

    ## Pitfalls

    - **The exact JSON shape of this task's `STORE` output was not confirmed against a live instance.** SurrealDB's query protocol typically wraps each statement's result in a per-statement envelope; `evaluate_access_risk`'s script defensively handles both a bare result object and a list-of-statement-results, but this has not been exercised against a running SurrealDB server in this environment.
    - **`DURATION FOR GRANT NONE` is valid, documented syntax - but `DURATION FOR TOKEN NONE` is explicitly rejected by SurrealDB on record-access methods.** Verified from SurrealDB's own documentation: "Record-access authentication tokens are issued to end users and may be passed to third parties, so they must expire. As a result, DURATION FOR TOKEN NONE is rejected." This blueprint only checks `FOR GRANT`, the one case SurrealDB's docs confirm can legitimately be set to never expire.
    - **This blueprint does not run `ALTER ACCESS`.** Whether `ALTER ACCESS` supports modifying `DURATION` was not confirmed from available documentation; remediation here is limited to an additive audit-trail `CREATE`, never a change to the flagged access method itself.
    - **`auto_remediate` and `dry_run` are independent gates, not a single boolean.** Both must be `"true"`/`"false"` respectively for the audit-record `Loop` to run; setting only one leaves the other still blocking.
    - **`Switch` case keys `"true"`/`"false"` are quoted strings.** `auto_remediate` renders as the literal string `"true"` or `"false"`; unquoted `true:`/`false:` YAML map keys would parse as booleans instead and would not match.

    ## Links

    - [plugin-surrealdb documentation](https://kestra.io/plugins/plugin-surrealdb)
    - [SurrealDB INFO statement reference](https://surrealdb.com/docs/surrealql/statements/info)
    - [SurrealDB DEFINE ACCESS statement reference](https://surrealdb.com/docs/surrealql/statements/define/access)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Policy & Compliance
  ee: false
  demo: false
