id: runtime-eol-watch
namespace: company.team

description: >
  Weekly check of the language runtimes and databases you run against the endoflife.date
  public API. Posts to Slack when a version is already past end of life or ends within the
  warning window, and keeps a Markdown table of every tracked version.

inputs:
  - id: runtimes
    type: STRING
    displayName: Runtimes to track
    description: One product:cycle pair per line, using endoflife.date product names. Lines starting with # are ignored.
    defaults: |
      python:3.10
      nodejs:20
      postgresql:14
      redis:7.2

  - id: warn_days
    type: INT
    displayName: Warning window in days
    description: Alert when a version reaches end of life within this many days.
    defaults: 90

tasks:
  - id: check_support_dates
    type: io.kestra.plugin.scripts.python.Script
    description: >
      Look up each product and cycle on endoflife.date and classify it as EXPIRED, EXPIRING,
      SUPPORTED or UNKNOWN. A lookup that fails is reported as UNKNOWN, never as supported.
      Python standard library only.
    containerImage: python:3.12-slim
    outputFiles:
      - eol-report.md
    script: |
      import json
      import urllib.error
      import urllib.request
      from datetime import date, datetime

      warn_days = int("{{ inputs.warn_days }}")
      today = date.today()
      rows = []
      problems = []

      for line in """{{ inputs.runtimes }}""".splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          product, _, cycle = line.partition(":")
          product, cycle = product.strip(), cycle.strip()
          url = f"https://endoflife.date/api/{product}/{cycle}.json"
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "kestra-eol-watch"})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  info = json.load(resp)
          except urllib.error.HTTPError as exc:
              problems.append(f"{product}:{cycle} lookup failed (HTTP {exc.code})")
              rows.append({"product": product, "cycle": cycle, "status": "UNKNOWN", "eol": None, "days_left": None})
              continue
          except Exception as exc:
              problems.append(f"{product}:{cycle} lookup failed ({exc})")
              rows.append({"product": product, "cycle": cycle, "status": "UNKNOWN", "eol": None, "days_left": None})
              continue

          eol = info.get("eol")
          if eol is True:
              status, days_left, eol_text = "EXPIRED", None, "already ended"
          elif eol is False or eol is None:
              status, days_left, eol_text = "SUPPORTED", None, "no end date announced"
          else:
              days_left = (datetime.strptime(eol, "%Y-%m-%d").date() - today).days
              eol_text = eol
              if days_left < 0:
                  status = "EXPIRED"
              elif days_left <= warn_days:
                  status = "EXPIRING"
              else:
                  status = "SUPPORTED"
          rows.append({"product": product, "cycle": cycle, "status": status, "eol": eol_text, "days_left": days_left})

      expired = [r for r in rows if r["status"] == "EXPIRED"]
      expiring = [r for r in rows if r["status"] == "EXPIRING"]

      lines = ["| Runtime | Cycle | Status | End of life | Days left |", "|---|---|---|---|---|"]
      for r in rows:
          days = "" if r["days_left"] is None else str(r["days_left"])
          lines.append(f"| {r['product']} | {r['cycle']} | {r['status']} | {r['eol'] or ''} | {days} |")
      with open("eol-report.md", "w") as fh:
          fh.write("\n".join(lines) + "\n")

      def label(r):
          when = "ended " + r["eol"] if r["status"] == "EXPIRED" and r["days_left"] is not None else (
              f"ends {r['eol']}, {r['days_left']} days left" if r["days_left"] is not None else r["eol"])
          return f"{r['product']} {r['cycle']} ({when})"

      summary = []
      if expired:
          summary.append("Already past end of life: " + ", ".join(label(r) for r in expired))
      if expiring:
          summary.append(f"Ending within {warn_days} days: " + ", ".join(label(r) for r in expiring))
      if problems:
          summary.append("Could not check: " + "; ".join(problems))

      print("::" + json.dumps({"outputs": {
          "expired": len(expired),
          "expiring": len(expiring),
          "unknown": len(problems),
          "attention": bool(expired or expiring or problems),
          "summary": " | ".join(summary) if summary else "All tracked runtimes are supported.",
      }}) + "::")

  - id: needs_attention
    type: io.kestra.plugin.core.flow.If
    description: Alert only when something is expired, expiring soon, or could not be checked.
    condition: "{{ outputs.check_support_dates.vars.attention }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Send the one-line summary so the alert names the runtimes and dates, not just that something is wrong.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: Runtime support check - {{ outputs.check_support_dates.vars.summary }} (execution {{ execution.id }})"
          }
    else:
      - id: log_all_supported
        type: io.kestra.plugin.core.log.Log
        description: Record clean weeks too, so the execution history shows the check kept running.
        message: "{{ outputs.check_support_dates.vars.summary }}"

errors:
  - id: alert_check_failed
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: A failed check must not look like a clean week.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Runtime support check FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check the task logs."
      }

outputs:
  - id: report
    type: FILE
    description: Markdown table with every tracked version, its status and its end-of-life date.
    value: "{{ outputs.check_support_dates.outputFiles['eol-report.md'] }}"

triggers:
  - id: weekly_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true

extend:
  title: Get Warned Before a Runtime or Database Version Runs Out of Support
  shortDescription: Weekly endoflife.date check that alerts Slack when a tracked runtime or database version is past end of life or about to be.
  metaTitle: Runtime and Database End-of-Life Alerts with Kestra
  metaDescription: Check Python, Node.js, PostgreSQL and other versions against endoflife.date every week and alert Slack before support ends.
  description: |
    Old runtimes rarely fail loudly. A Python or Postgres version just stops getting security fixes, and nobody notices until an audit or an incident. This blueprint checks the versions you list against the public endoflife.date API every week and tells Slack when one is already past end of life or ends inside your warning window.

    ## How it works

    1. `check_support_dates` (`io.kestra.plugin.scripts.python.Script`) reads one `product:cycle` pair per line, looks each one up on endoflife.date, and marks it EXPIRED, EXPIRING, SUPPORTED or UNKNOWN. A failed lookup is UNKNOWN, never SUPPORTED. It writes a Markdown table to `eol-report.md` and sends counts and a one-line summary back through the `::{"outputs": ...}::` protocol.
    2. `needs_attention` (`io.kestra.plugin.core.flow.If`) checks whether anything is expired, expiring or unknown. If so, `alert_slack` posts the summary. Otherwise `log_all_supported` records a clean week.
    3. The `errors` block posts to Slack if the check itself fails.
    4. The weekly `Schedule` trigger is disabled by default. Enable it when you are ready.

    ## Prerequisites

    - Secret `SLACK_WEBHOOK_URL`: Slack incoming webhook that receives the alert (required).
    - Network access from the task container to `https://endoflife.date`.
    - Product names must match endoflife.date (for example `python`, `nodejs`, `postgresql`, `redis`). The cycle is the version line, for example `3.10` or `20`.

    ## Inputs

    - `runtimes` (STRING): one `product:cycle` per line. Default: python:3.10, nodejs:20, postgresql:14, redis:7.2.
    - `warn_days` (INT): alert when end of life is this many days away or less. Default: 90.

    ## Outputs

    - `report` (FILE): the Markdown table of every tracked version.

    ## How to extend

    - Add a Jira or GitHub issue task in the `then` branch to open a ticket for each expired version.
    - Read the product and cycle list from a KV store so teams can manage their own list.
    - Add a `Fail` task on EXPIRED to turn this into a release gate.

    ## Links

    - [endoflife.date API](https://endoflife.date/docs/api/)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-notifications/slack)
  tags:
    - Infrastructure
  ee: false
  demo: false
