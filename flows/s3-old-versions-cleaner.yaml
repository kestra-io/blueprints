id: s3-old-versions-cleaner
namespace: company.team

description: |
  Finds billable waste hiding in versioned S3 buckets. Every overwritten or
  deleted object leaves noncurrent versions that keep billing for storage
  forever. This flow lists noncurrent versions older than your cutoff across
  your buckets, reports how many GBs they waste, and can delete them in
  enforce mode (dry run by default).

inputs:
  - id: bucket_names
    type : ARRAY
    itemType: STRING
    defaults: []
    description: Buckets to audit. Leave empty to discover every bucket in the account via list-buckets.
  - id: age_days
    type : INT
    defaults: 90
    description: Noncurrent versions older than this many days count as waste.
  - id: enforce
    type : BOOLEAN
    defaults: false
    description: When true, old versions are actually deleted. Default false = dry-run report only.
  - id: aws_region
    type : STRING
    defaults: "us-east-1"
    description: AWS region used for the bucket discovery call (bucket names are global).

tasks:
  - id: discover_buckets
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Resolve the bucket list from input, or discover all buckets in the account.
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        GIVEN="{{ inputs.bucket_names | join(' ') }}"
        if [ -n "$GIVEN" ]; then
          BUCKETS="$GIVEN"
        else
          BUCKETS=$(aws s3api list-buckets --query 'Buckets[].Name' --output text | tr '\t' ' ')
        fi
        echo "BUCKETS=$BUCKETS"
  - id: check_buckets
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit old object versions bucket by bucket.
    values: "{{ outputs.discover_buckets.vars.BUCKETS.split(' ') }}"
    tasks:
      - id: audit_bucket
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List noncurrent versions older than the cutoff and total their size.
        region: "{{ inputs.aws_region }}"
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - |
            BUCKET="{{ taskrun.value }}"
            ENFORCE="{{ inputs.enforce }}"
            if [ -z "$BUCKET" ]; then
              echo "No buckets to audit."
              exit 0
            fi
            CUTOFF=$(date -u -d "{{ inputs.age_days }} days ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Auditing s3://$BUCKET — noncurrent versions older than $CUTOFF"
            aws s3api list-object-versions --bucket "$BUCKET" \
              --query 'Versions[?IsLatest==`false`].[Key,VersionId,LastModified,Size]' \
              --output json > /tmp/vers.json 2>/dev/null || echo '[]' > /tmp/vers.json
            OLD=$(jq --arg c "$CUTOFF" '[(. // [])[] | select(.[2] < $c)]' /tmp/vers.json)
            COUNT=$(echo "$OLD" | jq 'length')
            BYTES=$(echo "$OLD" | jq '[.[3]] | add // 0')
            GB=$(python3 -c "print('{:.2f}'.format($BYTES/1073741824))")
            echo "OLD_VERSION_COUNT=$COUNT"
            echo "OLD_VERSION_GB=$GB"
            echo "BUCKET_DONE=$BUCKET"
            if [ "$COUNT" -gt 0 ]; then
              echo "WASTE_FOUND"
              echo "Oldest offenders (key, version id, last modified):"
              echo "$OLD" | jq -r '.[:5] | .[] | "\(. [0]) \(.[1]) \(.[2])"'
              if [ "$ENFORCE" = "true" ]; then
                echo "Enforce mode: deleting $COUNT old version(s)..."
                echo "$OLD" | jq -r '.[] | "\(. [0])\t\(.[1])"' | while IFS="$(printf '\t')" read -r KEY VID; do
                  aws s3api delete-object --bucket "$BUCKET" --key "$KEY" --version-id "$VID" >/dev/null
                done
                echo "DELETED_COUNT=$COUNT"
              else
                echo "Dry run — set enforce=true to delete these versions."
              fi
            fi
      - id: notify_bucket
        type: io.kestra.plugin.core.flow.If
        description: Alert on billable old versions, stay quiet on clean buckets.
        condition: "{{ outputs.audit_bucket.stdout contains 'WASTE_FOUND' }}"
        then:
          - id: slack_waste
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":wastebasket: S3 old-versions audit `{{ outputs.audit_bucket.vars.BUCKET_DONE }}` — *{{ outputs.audit_bucket.vars.OLD_VERSION_COUNT }}* noncurrent version(s) older than {{ inputs.age_days }} days, ~*{{ outputs.audit_bucket.vars.OLD_VERSION_GB }} GB* of billable waste. Dry run — set `enforce=true` to delete."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "s3://{{ taskrun.value }} is clean — no noncurrent versions older than {{ inputs.age_days }} days."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Monday at 09:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 9 * * 1"
    disabled: true

extend:
  title: S3 Old Versions Cleaner
  metaTitle: Clean Up Old S3 Object Versions to Cut Storage Costs | Kestra
  shortDescription: Audit versioned S3 buckets for noncurrent object versions older than N days, report the GBs of billable waste, and optionally delete them.
  metaDescription: S3 noncurrent versions bill forever. This flow finds versions older than 90 days, reports the waste, and deletes them in enforce mode.
  description: |
    Versioned S3 buckets are a safety net — until the safety net starts billing you. Every overwrite and every delete leaves a noncurrent version behind, and S3 charges full storage price for each one until it is explicitly deleted or expired by a lifecycle rule. Buckets with heavy churn quietly accumulate gigabytes of data nobody will ever read again.

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 09:00 UTC (shipped disabled).
    2. The flow resolves the bucket list: your `bucket_names` input, or every bucket in the account via `list-buckets` when the input is empty.
    3. A ForEach loop audits each bucket, listing noncurrent versions (`IsLatest=false`) and filtering to those older than the `age_days` cutoff.
    4. Old versions are counted and their bytes summed into a GB waste figure.
    5. An `If` task posts a Slack alert with the count and GBs only when waste is found; with `enforce=true` the old versions are deleted first, otherwise it is a dry-run report.

    ## What you get

    - Per-bucket counts and GBs of noncurrent versions older than your cutoff, with the worst offenders named as evidence.
    - A dry run by default — nothing is deleted until you set `enforce=true`.
    - Enforce mode that deletes exactly the versions it flagged, nothing newer.
    - Silence on clean buckets — alerts only on real findings.

    ## Who it's for

    Platform engineers and FinOps-minded teams whose S3 bills keep growing while their actual data stays flat.

    ## Why orchestrate this with Kestra

    A one-off CLI session finds today's waste and is forgotten by next month. As a scheduled Kestra flow the audit runs itself, the age cutoff and bucket list are inputs anyone can tune, every run is logged for audit, and flipping from dry run to enforce mode is one input — not a new script.

    ## Prerequisites

    - AWS credentials with `s3:ListBucket`, `s3:GetObjectVersion` and (for enforce mode) `s3:DeleteObjectVersion` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the S3 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the S3 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the waste alert.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Run manually once (dry run) and review the Slack report.
    3. Set `enforce=true` and re-run once you trust the findings.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Write the findings to a table (e.g. Postgres) for month-over-month waste trends.
    - Exclude buckets tagged `KeepVersions=true` for compliance-retained data.
    - Auto-apply a noncurrent-version expiration lifecycle rule instead of deleting.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [S3 versioning and storage costs](https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html)
    - [S3 delete-object API](https://docs.aws.amazon.com/cli/latest/reference/s3api/delete-object.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
