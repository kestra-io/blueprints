id: pipauditwatch
namespace: company.team
description: Scans Python requirements for known CVEs with pip-audit and alerts on Slack.

labels:
  project: pipauditwatch
  team: supply-chain

inputs:
  - id: requirements
    type: STRING
    displayName: "Requirements content"
    description: paste your requirements.txt content here
    defaults: |
      gunicorn==23.0.0
      requests==2.34.2
      urllib3==1.26.5
  - id: slack_webhook
    type: STRING
    displayName: "Slack Webhook URL"
    description: Incoming webhook URL of the Slack channel for alerts

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: scans dependencies every morning
    cron: "0 8 * * *"
    timezone: UTC
    inputs:
      requirements: |
        gunicorn==23.0.0
        requests==2.34.2
        urllib3==1.26.5
      slack_webhook: "{{ secret('SLACK_WEBHOOK') }}"

tasks:
  - id: find_vulns
    type: io.kestra.plugin.scripts.python.Script
    description: runs pip-audit and collects new vulnerabilities
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: python:3.11
    dependencies:
      - kestra
      - pip-audit
    inputFiles:
      requirements.txt: "{{ inputs.requirements }}"
    outputFiles:
      - audit.json
    script: |
      import json
      import subprocess
      import sys
      from kestra import Kestra

      # pip-audit exits 1 when it finds anything; the JSON is still written.
      # called as a module because the pip-audit CLI binary is not on PATH
      # in Kestra's python runner, only the installed package is.
      result = subprocess.run(
          [sys.executable, '-m', 'pip_audit', '--requirement', 'requirements.txt', '--format', 'json', '-o', 'audit.json'],
          capture_output=True,
          text=True,
      )
      logger = Kestra.logger()
      logger.info(f"pip-audit exit code: {result.returncode}")
      if result.stderr.strip():
          logger.info(f"pip-audit stderr tail: {result.stderr.strip()[-2000:]}")

      try:
          with open('audit.json') as f:
              report = json.load(f)
      except (FileNotFoundError, json.JSONDecodeError) as e:
          # a crashed scanner must fail loudly, never report a fake "clean"
          raise RuntimeError(
              f"pip-audit produced no usable report ({type(e).__name__}). "
              f"stderr tail: {result.stderr.strip()[-1000:]}"
          )

      vulns = []
      # pip-audit 1.x nests findings under "vulnerabilities", 2.x under "dependencies"
      dep_entries = report.get('vulnerabilities') or report.get('dependencies') or []
      for dep in dep_entries:
          pkg = dep.get('name', '?')
          ver = dep.get('version', '?')
          for v in dep.get('vulns', []) or []:
              vid = v.get('id', '?')
              aliases = [a for a in (v.get('aliases') or []) if a != vid]
              fixes = v.get('fix_versions') or []
              vulns.append({
                  'id': f"{pkg}@{ver}:{vid}",
                  'package': pkg,
                  'version': ver,
                  'vid': vid,
                  'aliases': aliases,
                  'fixes': fixes,
              })

      # CVE ids we already alerted on, from the KV store (null on first run -> empty)
      raw_state = """{{ kv('pipauditwatch-state', errorOnMissing=false) }}"""
      already = set(json.loads(raw_state) if raw_state.strip() else [])

      new = [v for v in vulns if v['id'] not in already]

      lines = ["*PipAuditWatch - vulnerable Python dependencies*", ""]
      for v in new:
          alias_txt = f" ({', '.join(v['aliases'])})" if v['aliases'] else ""
          fix_txt = f"fixed in {', '.join(v['fixes'])}" if v['fixes'] else "no fixed version published"
          lines.append(f"- *{v['package']} {v['version']}*: {v['vid']}{alias_txt} - {fix_txt}")
      lines.append("")
      lines.append("bump the package and the finding drops out on the next run.")
      alert_text = "\n".join(lines)

      Kestra.outputs({
          'new_vulns': new,
          'count': len(new),
          'alert_text': alert_text,
          'new_state_json': json.dumps(sorted(v['id'] for v in vulns)),
      })

  - id: maybe_alert
    type: io.kestra.plugin.core.flow.If
    description: alerts only about new vulnerabilities
    condition: "{{ outputs.find_vulns.vars.count > 0 }}"
    then:
      - id: send_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: posts the vulnerability alert to Slack
        url: "{{ inputs.slack_webhook }}"
        messageText: "{{ outputs.find_vulns.vars.alert_text }}"

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: remembers reported CVEs, so fixed ones alert again if reintroduced
    key: "pipauditwatch-state"
    value: "{{ outputs.find_vulns.vars.new_state_json }}"
    overwrite: true

extend:
  title: "PipAuditWatch - Python dependency CVE watcher"
  shortDescription: "Scans your Python requirements for known vulnerabilities and alerts on Slack."
  metaTitle: "PipAuditWatch: Python dependency CVE watcher blueprint for Kestra"
  metaDescription: "A Kestra blueprint that runs pip-audit against your requirements file and alerts on Slack about known CVEs, without spamming."
  tags:
    - Infrastructure
  subTags:
    - Python
    - Infrastructure Automation
  ee: false
  demo: false
  description: |
    ## How it works

    1. `find_vulns` (`io.kestra.plugin.scripts.python.Script`) writes your pasted requirements to a file and runs `pip-audit` against the OSV database, saving the JSON report. It collects every vulnerability, builds a stable id per finding (`package@version:vuln-id`), and compares against the KV state so only new findings alert. The Slack text names the package, the installed version, the CVE id with aliases, and the fixed version when one is published.
    2. `maybe_alert` (`io.kestra.plugin.core.flow.If`) posts the Slack alert only when there is something new.
    3. `save_state` (`io.kestra.plugin.core.kv.Set`) writes back the current finding ids. Bumped packages drop out on their own, so a reintroduced vulnerability alerts again, and clean reruns stay quiet.

    ## What you get

    - A daily supply-chain check on your Python dependencies, no scanner to install or maintain.
    - Slack alerts with the actionable trio: what is vulnerable, which CVE, and which version fixes it.
    - No alert spam: the KV-backed memory remembers reported CVEs, and fixed packages stop alerting.
    - Quiet runs when everything is clean.

    ## Who it's for

    Anyone shipping Python who wants to know about known CVEs in their dependencies without wiring up a full SCA platform. Paste requirements, get alerts.

    ## Why orchestrate this with Kestra

    Running pip-audit by hand works once; remembering to run it daily does not. As a flow it runs on schedule, keeps every scan's findings where you can audit them, and only bothers you when something new appears. It is also the natural sequel to BumpPilot: BumpPilot bumps your dependencies, this one tells you why you must.

    ## Prerequisites

    - Kestra with the Docker task runner available.
    - A Slack Incoming Webhook URL.
    - Network access to the OSV database from the task container (default).

    ### Secrets

    | Secret | What it is |
    | --- | --- |
    | `SLACK_WEBHOOK` | base64-encoded Slack Incoming Webhook URL |

    In Kestra OSS, secrets come from environment variables prefixed with `SECRET_` and must be base64-encoded.

    ## Quick start

    1. Start Kestra with the secret above as a `SECRET_` environment variable.
    2. Import this flow and run it with the default requirements: the Slack alert lists the known urllib3 CVEs, while the other pinned packages report clean.
    3. Paste your real requirements and run again: new findings alert, known ones do not repeat.
    4. Bump a vulnerable package and run again: quiet for that package.

    ## How to extend

    - Read requirements from a Git repo instead of pasting, by adding a git clone step before the audit.
    - Fail the run (instead of just alerting) when a critical CVE appears, by adding a Fail task on severity.
    - Scan multiple requirement files by looping with a ForEach task.
    - Route alerts to PagerDuty or Opsgenie by swapping the Slack task for another notification task.

    ## Inputs

    | Input | Type | Default | What it does |
    | --- | --- | --- | --- |
    | `requirements` | STRING | a small pinned set, incl. `urllib3==1.26.5` | paste your requirements.txt content here |
    | `slack_webhook` | STRING | (required) | Incoming webhook URL of the Slack channel for alerts |

    ## Links

    - [Kestra blueprint catalog](https://kestra.io/blueprints)
    - [pip-audit documentation](https://pypi.org/project/pip-audit/)
    - [OSV database](https://osv.dev/)
    - [Kestra secrets documentation](https://kestra.io/docs/concepts/secrets)

    ## Pitfalls

    - pip-audit only knows about published vulnerabilities. A brand-new CVE can take hours to land in OSV, so a clean scan is "no known CVEs", not "secure".
    - The default requirements pin a known-vulnerable urllib3 so the first run demonstrates the alert. Replace it with your real requirements before relying on the schedule.
    - Findings are keyed by package, version, and vuln id. Re-pinning the same vulnerable version does not re-alert; changing the version does.
    - The flow is strictly read-only. It never modifies your requirements or installs anything outside its own container.
