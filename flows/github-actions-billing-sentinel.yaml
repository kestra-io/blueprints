id: github-actions-billing-sentinel
namespace: company.team

description: Audits GitHub Actions runner consumption to prevent surprise CI/CD billing spikes and workflow stoppage.

inputs:
  - id: github_organization
    type: STRING
    defaults: kestra-io
    description: GitHub organization name to evaluate for Actions billing.
  - id: usage_percentage_threshold
    type: FLOAT
    defaults: 80.0
    description: Percentage of included monthly minutes consumed before dispatching a budget warning.

outputs:
  - id: total_minutes_used
    type: INT
    value: "{{ outputs.query_billing_minutes.vars.total_minutes_used }}"
  - id: usage_pct
    type: FLOAT
    value: "{{ outputs.query_billing_minutes.vars.usage_pct }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.query_billing_minutes.vars.alert_triggered }}"

tasks:
  - id: query_billing_minutes
    type: io.kestra.plugin.scripts.python.Script
    description: Queries the GitHub Actions billing endpoint and evaluates usage against allowance.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      GITHUB_ORG: "{{ inputs.github_organization }}"
      THRESHOLD: "{{ inputs.usage_percentage_threshold }}"
      GITHUB_TOKEN: "{{ secret('GITHUB_TOKEN') }}"
    outputFiles:
      - billing_summary.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      org = os.environ.get("GITHUB_ORG", "kestra-io")
      threshold = float(os.environ.get("THRESHOLD", "80.0"))
      token = os.environ.get("GITHUB_TOKEN", "")

      headers = {
          "Accept": "application/vnd.github.v3+json",
          "User-Agent": "Kestra-Billing-Sentinel"
      }
      if token:
          headers["Authorization"] = f"Bearer {token}"

      url = f"https://api.github.com/orgs/{org}/settings/billing/actions"
      try:
          resp = requests.get(url, headers=headers, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as err:
          print(f"ERROR: Failed to query GitHub Actions billing: {err}", file=sys.stderr)
          sys.exit(1)

      total_used = data.get("total_minutes_used", 0)
      included = data.get("included_minutes", 0)
      paid_used = data.get("total_paid_minutes_used", 0)
      usage_pct = (total_used / included * 100.0) if included > 0 else 0.0
      alert_triggered = usage_pct >= threshold

      result = {
          "org": org,
          "total_minutes_used": total_used,
          "included_minutes": included,
          "paid_minutes_used": paid_used,
          "usage_pct": round(usage_pct, 1),
          "alert_triggered": alert_triggered
      }

      with open("billing_summary.json", "w", encoding="utf-8") as out:
          json.dump(result, out, indent=2)

      print(f"GitHub billing audit: {result}")
      Kestra.outputs(result)

  - id: evaluate_billing_quota
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_billing_minutes.vars.alert_triggered }}"
    then:
      - id: alert_engineering_leads
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "GitHub Actions Budget Alert: Organization `{{ inputs.github_organization }}` has utilized {{ outputs.query_billing_minutes.vars.usage_pct }}% of included CI/CD runner minutes ({{ outputs.query_billing_minutes.vars.total_minutes_used }} / {{ outputs.query_billing_minutes.vars.included_minutes }} mins)."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "GitHub Actions Sentinel Failure: Failed to query billing settings for `{{ inputs.github_organization }}`."
      }

triggers:
  - id: daily_quota_scan
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    disabled: true

extend:
  metaDescription: "Audits GitHub Actions runner consumption to prevent surprise CI/CD billing spikes and workflow stoppage."
  metaTitle: GitHub Actions Billing Minutes Consumption and Quota Sentinel with Kestra
  title: GitHub Actions Billing Minutes Consumption and Quota Sentinel
  shortDescription: Audits GitHub Actions runner consumption to prevent surprise CI/CD billing spikes and workflow stoppage.
  description: |
    ## How it works
    This workflow queries the GitHub Organization Billing REST API to assess total CI/CD runner minutes utilized against plan allowances. It tracks consumption ratios and warns engineering leadership before included plan quotas exhaust or expensive paid overages accrue.
  tags:
    - Cloud
    - Business
  subTags:
    - FinOps & Cost Management
    - Policy & Compliance
  ee: false
  demo: false
