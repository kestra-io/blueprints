id: github-actions-billing-sentinel
namespace: company.finops

inputs:
  - id: github_organization
    type: STRING
    defaults: kestra-io
    description: GitHub organization name to evaluate for Actions billing.
  - id: usage_percentage_threshold
    type: FLOAT
    defaults: 80.0
    description: Percentage of included monthly minutes consumed before dispatching a budget warning.

tasks:
  - id: query_billing_minutes
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s -H "Authorization: Bearer {{ secret('GITHUB_TOKEN') }}"           -H "Accept: application/vnd.github.v3+json"           "https://api.github.com/orgs/{{ inputs.github_organization }}/settings/billing/actions" > actions_billing.json
        python3 -c "
        import json
        with open('actions_billing.json') as f:
            data = json.load(f)
        total_used = data.get('total_minutes_used', 0)
        included = data.get('included_minutes', 0)
        paid_used = data.get('total_paid_minutes_used', 0)
        usage_pct = (total_used / included * 100.0) if included > 0 else 0.0
        alert_triggered = usage_pct >= {{ inputs.usage_percentage_threshold }}
        result = {
            'org': '{{ inputs.github_organization }}',
            'total_minutes_used': total_used,
            'included_minutes': included,
            'paid_minutes_used': paid_used,
            'usage_pct': round(usage_pct, 1),
            'alert_triggered': alert_triggered
        }
        with open('billing_summary.json', 'w') as out:
            json.dump(result, out)
        print('GitHub billing audit:', result)
        "
    outputFiles:
      - billing_summary.json

  - id: evaluate_billing_quota
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.query_billing_minutes.outputFiles['billing_summary.json'])).alert_triggered }}"
    then:
      - id: alert_engineering_leads
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":credit_card: *GitHub Actions Budget Alert*: Organization `{{ inputs.github_organization }}` has utilized {{ json(read(outputs.query_billing_minutes.outputFiles['billing_summary.json'])).usage_pct }}% of included CI/CD runner minutes ({{ json(read(outputs.query_billing_minutes.outputFiles['billing_summary.json'])).total_minutes_used }} / {{ json(read(outputs.query_billing_minutes.outputFiles['billing_summary.json'])).included_minutes }} mins)."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *GitHub Actions Sentinel Failure*: Failed to query billing settings for `{{ inputs.github_organization }}`."
      }

triggers:
  - id: daily_quota_scan
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    disabled: true

extend:
  title: GitHub Actions Billing Minutes Consumption and Quota Sentinel
  shortDescription: Audits GitHub Actions runner consumption to prevent surprise CI/CD billing spikes and workflow stoppage.
  description: |
    ## How it works
    This workflow queries the GitHub Organization Billing REST API to assess total CI/CD runner minutes utilized against plan allowances. It tracks consumption ratios and warns engineering leadership before included plan quotas exhaust or expensive paid overages accrue.

    ## What you get
    - Continuous tracking of organization-wide GitHub Actions compute burn.
    - Early budget notifications preventing mid-sprint CI pipeline lockouts.
    - Direct Slack notifications detailing total minutes used and paid tier consumption.

    ## Who it's for
    - Engineering directors and DevOps managers overseeing CI/CD infrastructure budgets.
    - Platform teams managing shared runner fleets.

    ## Why orchestrate this with Kestra
    Kestra automates recurring FinOps audits across SaaS developer platforms. Orchestrating developer tools alongside core cloud platforms centralizes organizational governance into one system.

    ## Prerequisites
    - A GitHub Personal Access Token or App token with `admin:org` permissions to view billing settings.
    - Secrets `GITHUB_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Set `github_organization` and adjust the consumption percentage threshold.
    3. Run the workflow manually to check current monthly usage.

    ## How to extend
    - Query individual repository workflow run durations to identify the top compute-consuming workflows.
    - Dynamically switch resource-intensive CI workflows to self-hosted runners when plan minutes drop low.
    - Store monthly billing trends in a data warehouse for historical spend analysis.

    ## Links
    - [GitHub Actions Billing API](https://docs.github.com/en/rest/billing/billing#get-github-actions-billing-for-an-organization)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
  tags:
    - Cloud
    - Business
  subTags:
    - FinOps & Cost Management
    - Governance & Compliance
  ee: false
  demo: false
