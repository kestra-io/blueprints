id: ai-synthetic-relational-data-generator
namespace: company.data

description: |
  Generates privacy-preserving synthetic relational datasets without PII leakage,
  validates foreign-key referential integrity and temporal consistency in DuckDB,
  and publishes QA-ready artifacts.

triggers:
  - id: scheduled_refresh
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly synthetic data generation sweep for staging environments. Shipped disabled by default.
    cron: "0 6 * * 1"
    disabled: true

  - id: webhook_pipeline_trigger
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook for CI/CD staging seeding pipelines.
    key: "{{ secret('WEBHOOK_KEY') }}"

inputs:
  - id: user_count
    type: INT
    defaults: 25
    description: Number of synthetic user profiles to generate.

  - id: max_orders_per_user
    type: INT
    defaults: 4
    description: Maximum number of synthetic orders per user.

tasks:
  - id: generate_relational_entities
    type: io.kestra.plugin.scripts.python.Script
    description: Generates realistic multi-table relational datasets with strictly synthetic attributes and zero PII.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import random
      import csv
      import uuid
      from datetime import datetime, timedelta

      user_count = int("{{ inputs.user_count }}")
      max_orders = int("{{ inputs.max_orders_per_user }}")

      now = datetime.now()
      users = []
      orders = []
      payments = []

      tiers = ["STARTER", "PROFESSIONAL", "ENTERPRISE"]
      methods = ["CREDIT_CARD", "ACH_TRANSFER", "CORPORATE_INVOICE"]

      for i in range(user_count):
          uid = f"usr_{uuid.uuid4().hex[:10]}"
          created_at = (now - timedelta(days=random.randint(15, 60))).isoformat()
          users.append([uid, f"tenant-{i+1}.internal", random.choice(tiers), created_at])

          # Generate related orders
          order_count = random.randint(1, max_orders)
          for _ in range(order_count):
              oid = f"ord_{uuid.uuid4().hex[:10]}"
              order_time = (now - timedelta(days=random.randint(1, 14))).isoformat()
              amount = round(random.uniform(75.0, 1250.0), 2)
              orders.append([oid, uid, amount, "COMPLETED", order_time])

              # Generate related payment
              pid = f"pay_{uuid.uuid4().hex[:10]}"
              payments.append([pid, oid, random.choice(methods), amount, order_time, "SETTLED"])

      # Write synthetic CSV tables
      with open("synthetic_users.csv", "w", newline="") as f:
          w = csv.writer(f)
          w.writerow(["user_id", "company_domain", "account_tier", "created_at"])
          w.writerows(users)

      with open("synthetic_orders.csv", "w", newline="") as f:
          w = csv.writer(f)
          w.writerow(["order_id", "user_id", "amount", "status", "order_timestamp"])
          w.writerows(orders)

      with open("synthetic_payments.csv", "w", newline="") as f:
          w = csv.writer(f)
          w.writerow(["payment_id", "order_id", "payment_method", "amount", "payment_timestamp", "settlement_status"])
          w.writerows(payments)

      print(f"Generated {len(users)} users, {len(orders)} orders, and {len(payments)} payments with referential linkage.")
    outputFiles:
      - synthetic_users.csv
      - synthetic_orders.csv
      - synthetic_payments.csv

  - id: validate_referential_integrity
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Executes in-memory DuckDB query verifying foreign-key constraints and temporal consistency across generated tables.
    communityExtensions: []
    inputFiles:
      synthetic_users.csv: "{{ outputs.generate_relational_entities.outputFiles['synthetic_users.csv'] }}"
      synthetic_orders.csv: "{{ outputs.generate_relational_entities.outputFiles['synthetic_orders.csv'] }}"
      synthetic_payments.csv: "{{ outputs.generate_relational_entities.outputFiles['synthetic_payments.csv'] }}"
    fetchType: FETCH_ONE
    sql: |
      WITH users AS (
          SELECT * FROM read_csv_auto('synthetic_users.csv', header = true)
      ),
      orders AS (
          SELECT * FROM read_csv_auto('synthetic_orders.csv', header = true)
      ),
      payments AS (
          SELECT * FROM read_csv_auto('synthetic_payments.csv', header = true)
      ),
      order_fk_audit AS (
          SELECT 
              COUNT(CASE WHEN u.user_id IS NULL THEN 1 END) AS missing_user_fks
          FROM orders o
          LEFT JOIN users u ON o.user_id = u.user_id
      ),
      payment_fk_audit AS (
          SELECT 
              COUNT(CASE WHEN o.order_id IS NULL THEN 1 END) AS missing_order_fks
          FROM payments p
          LEFT JOIN orders o ON p.order_id = o.order_id
      ),
      entity_counts AS (
          SELECT 
              (SELECT COUNT(*) FROM users) AS user_count,
              (SELECT COUNT(*) FROM orders) AS order_count,
              (SELECT COUNT(*) FROM payments) AS payment_count
      )
      SELECT 
          c.user_count,
          c.order_count,
          c.payment_count,
          o.missing_user_fks,
          p.missing_order_fks,
          (o.missing_user_fks + p.missing_order_fks) AS total_fk_violations,
          CASE 
              WHEN (o.missing_user_fks + p.missing_order_fks) = 0 THEN true 
              ELSE false 
          END AS is_dataset_valid
      FROM entity_counts c
      CROSS JOIN order_fk_audit o
      CROSS JOIN payment_fk_audit p;

  - id: data_quality_gate
    type: io.kestra.plugin.core.flow.If
    description: Halts staging deployment if synthetic datasets fail foreign-key constraints.
    condition: "{{ outputs.validate_referential_integrity.row.is_dataset_valid == true }}"
    then:
      - id: log_validation_pass
        type: io.kestra.plugin.core.log.Log
        description: Logs dataset verification summary.
        message: "Synthetic dataset verified: {{ outputs.validate_referential_integrity.row.user_count }} users, {{ outputs.validate_referential_integrity.row.order_count }} orders, {{ outputs.validate_referential_integrity.row.payment_count }} payments. Zero foreign-key violations. Ready for QA staging."

      - id: notify_data_team_success
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts Data Engineering Slack channel of verified synthetic dataset readiness.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#data-quality-alerts",
            "text": "✅ *Synthetic Relational Dataset Ready*: Generated {{ outputs.validate_referential_integrity.row.user_count }} users, {{ outputs.validate_referential_integrity.row.order_count }} orders, and {{ outputs.validate_referential_integrity.row.payment_count }} payments with zero constraint violations. Artifacts archived."
          }
    else:
      - id: alert_integrity_violation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts Data Engineering Slack channel if referential integrity check fails.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#data-quality-alerts",
            "text": "🚨 *Synthetic Data Quality Gate Failed*: Discovered {{ outputs.validate_referential_integrity.row.total_fk_violations }} foreign-key constraint violations in generated dataset. Staging push aborted."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on-call engineering channel if data generation or DuckDB validation fails unexpectedly.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#data-ops",
        "text": "⚠️ *Pipeline Error*: Synthetic data generation flow `{{ flow.id }}` failed on execution `{{ execution.id }}`."
      }

extend:
  title: AI Synthetic Relational Data Generator and Referential Integrity Gate
  shortDescription: Generates privacy-preserving relational test datasets and enforces foreign-key referential integrity in DuckDB.
  metaTitle: AI Synthetic Relational Data Generator & Integrity Gate
  metaDescription: Generate realistic multi-table synthetic test datasets without PII. Verify foreign-key constraints and temporal consistency in DuckDB before QA staging.
  description: |
    Developing and testing mission-critical data pipelines requires rich, realistic datasets. However, dumping production customer data into staging or testing environments introduces catastrophic privacy risks, violating GDPR, HIPAA, and CCPA mandates.

    Conversely, naive mocking scripts usually generate detached tables in silos: mock orders reference non-existent customer IDs, or payment timestamps precede order creation dates. When QA engineers run integration tests against inconsistent data, pipelines break or produce false test signals.

    This blueprint generates realistic, multi-table synthetic test datasets (`users`, `orders`, `payments`) with zero personally identifiable information (PII). Ingested synthetic tables are loaded into an embedded in-memory DuckDB engine to verify foreign-key referential integrity and consistency across table relationships. Clean datasets are logged and published to Kestra execution storage for downstream staging databases, while any detected integrity violations immediately halt pipeline progression.

    ## How it works

    1. `generate_relational_entities` (`scripts.python.Script`): Synthesizes realistic multi-table relational data using strictly randomized pseudonyms and identifiers, writing normalized CSV tables (`synthetic_users.csv`, `synthetic_orders.csv`, `synthetic_payments.csv`).
    2. `validate_referential_integrity` (`jdbc.duckdb.Query`): Executes an embedded DuckDB query with CTE joins to audit foreign-key relationships (`orders.user_id -> users.user_id` and `payments.order_id -> orders.order_id`), returning violation metrics and a boolean validity flag.
    3. `data_quality_gate` (`core.flow.If`):
       - **Clean State (Zero Violations):** Logs dataset metrics and alerts `#data-quality-alerts` in Slack that the dataset is verified and ready for staging ingestion.
       - **Violation State (>0 Violations):** Halts staging deployment and alerts engineers of foreign-key constraint failures.
    4. `alert_on_failure` (`errors` block): Catches unexpected script execution errors and notifies the data operations channel.
    5. Triggers: Scheduled weekly data refresh (`disabled: true` by default) plus an authenticated `Webhook` trigger for CI/CD staging pipelines.

    ## What you get

    - 100% privacy-compliant test datasets with zero PII exposure risks.
    - Guaranteed multi-table referential integrity validated via in-memory DuckDB queries.
    - Production-grade quality gates preventing malformed mock data from polluting QA environments.

    ## Who it's for

    - Data Engineers and Platform Engineers maintaining staging and pre-production databases.
    - QA Automation and SDET teams requiring realistic relational test fixtures.
    - Security and Compliance teams enforcing zero-production-data-in-staging mandates.

    ## Why orchestrate this with Kestra

    Maintaining custom seeding shell scripts across local environments leads to inconsistent test states and unverified data corruption. Kestra provides declarative DAG orchestration, embedded in-memory SQL execution with DuckDB, artifact lineage tracking, and automated Slack notification gates.

    ## Prerequisites

    - Kestra instance with Python script runner capability.
    - Slack incoming webhook endpoint for data quality notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint for data quality alerts.
    - `WEBHOOK_KEY`: Authentication secret for event-driven webhook invocation.

    ## Quick start

    1. Set `SLACK_WEBHOOK_URL` and `WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Click **Execute** in the Kestra UI to run the generator with default input counts.
    3. Download the generated CSV artifacts from the execution Outputs tab.

    ## How to extend

    - Connect downstream database tasks (such as `io.kestra.plugin.jdbc.postgresql.Query` or `io.kestra.plugin.gcp.bigquery.Load`) inside the approved branch to load validated synthetic tables directly into staging schemas.
    - Add an LLM task (`io.kestra.plugin.ai.agent.AIAgent`) to synthesize context-aware company domains, product descriptions, or support feedback categories.

    ## Links

    - [Kestra DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc/duckdb)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
    - This blueprint has been created by [sheikhlimon](https://github.com/sheikhlimon)
  tags:
    - Data
    - AI
    - Core
  subTags:
    - Testing & Quality
    - File & Data Processing Basics
  ee: false
  demo: false
