id: cloudflare-dns-drift-sentinel
namespace: company.netops

inputs:
  - id: cloudflare_zone_id
    type: STRING
    defaults: 023e105f4ecef8ad9ca31a8372d0c353
    description: The 32-character Cloudflare Zone Tag ID.
  - id: expected_apex_record_name
    type: STRING
    defaults: example.com
    description: Expected DNS record name to audit for configuration drift.
  - id: expected_target_ip
    type: STRING
    defaults: 192.0.2.1
    description: Expected target IP address or CNAME destination.

tasks:
  - id: audit_dns_records
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s -H "Authorization: Bearer {{ secret('CLOUDFLARE_API_TOKEN') }}"           -H "Content-Type: application/json"           "https://api.cloudflare.com/client/v4/zones/{{ inputs.cloudflare_zone_id }}/dns_records?name={{ inputs.expected_apex_record_name }}" > dns_records.json
        python3 -c "
        import json
        with open('dns_records.json') as f:
            data = json.load(f)
        records = data.get('result', [])
        drift_detected = False
        actual_content = 'none'
        if not records:
            drift_detected = True
        else:
            actual_content = records[0].get('content', '')
            if actual_content != '{{ inputs.expected_target_ip }}':
                drift_detected = True
        result = {
            'record_name': '{{ inputs.expected_apex_record_name }}',
            'expected_target': '{{ inputs.expected_target_ip }}',
            'actual_target': actual_content,
            'drift_detected': drift_detected
        }
        with open('dns_summary.json', 'w') as out:
            json.dump(result, out)
        print('Cloudflare DNS audit:', result)
        "
    outputFiles:
      - dns_summary.json

  - id: evaluate_dns_drift
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.audit_dns_records.outputFiles['dns_summary.json'])).drift_detected }}"
    then:
      - id: alert_secops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":shield: *Cloudflare DNS Drift Alert*: DNS record `{{ inputs.expected_apex_record_name }}` does not match expected target `{{ inputs.expected_target_ip }}` (Actual: `{{ json(read(outputs.audit_dns_records.outputFiles['dns_summary.json'])).actual_target }}`). Immediate hijacking or configuration drift investigation required."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Cloudflare Sentinel Execution Failure*: Failed to query DNS records for zone {{ inputs.cloudflare_zone_id }}."
      }

triggers:
  - id: scheduled_dns_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Cloudflare DNS Record Drift and Unauthorized Modification Sentinel
  shortDescription: Audits Cloudflare DNS records to detect configuration drift, accidental route changes, or unauthorized domain hijacking.
  description: |
    ## How it works
    This sentinel calls the Cloudflare DNS API to inspect critical apex and subdomain routing definitions. It compares active DNS answers against expected target values, alerting SecOps teams when manual changes, accidental Terraform overwrites, or compromised credentials modify production traffic routes.

    ## What you get
    - Continuous validation of mission-critical DNS routing definitions.
    - Rapid detection of subdomain takeover or DNS hijacking attempts.
    - Automated Slack incident delivery indicating the drifted record name and detected value.

    ## Who it's for
    - Security operations (SecOps) engineers and network architects managing public DNS zones.
    - SREs maintaining production traffic ingress routing.

    ## Why orchestrate this with Kestra
    Kestra automates distributed cloud observability, executing scheduled health checks with fine-grained error management and notification delivery.

    ## Prerequisites
    - Cloudflare API Token with `Zone.DNS:Read` permissions.
    - Secrets `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `cloudflare_zone_id`, record name, and expected target IP.
    3. Run manually to confirm DNS alignment.

    ## How to extend
    - Automatically revert drifted records via `PUT /dns_records/{id}` in an automated rollback flow.
    - Audit DNSSEC validation status across all zones.
    - Export DNS record changes to security audit logs in S3 or BigQuery.

    ## Links
    - [Cloudflare DNS API Documentation](https://developers.cloudflare.com/api/operations/dns-records-for-a-zone-list-dns-records)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Governance & Compliance
  ee: false
  demo: false
