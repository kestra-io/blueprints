id: mutant-ai-autonomous-resilience
namespace: blueprint.mutant_ai
description: |
  Check the public Mutant AI repository, verify its source can be cloned, and record a
  safety-gated recovery decision when the health check fails. This example does not
  modify production infrastructure or apply patches.

inputs:
  - id: repository_url
    type: STRING
    defaults: https://api.github.com/repos/khanadil84/Mutant-AI
    description: Public GitHub API endpoint used for the repository health check.
  - id: safety_mode
    type: STRING
    defaults: strict
    description: Use strict mode to require explicit authorization before considering remediation.
  - id: recovery_authorized
    type: BOOLEAN
    defaults: false
    description: Explicit approval flag for the recovery decision; no live remediation is performed.

tasks:
  - id: repository_health_probe
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.repository_url }}"
    method: GET
    headers:
      Accept: application/vnd.github+json
      User-Agent: kestra-mutant-ai-blueprint
    options:
      allowFailed: true
      connectTimeout: PT10S
      readTimeout: PT20S
    description: Check whether the configured repository endpoint responds successfully.

  - id: health_decision
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.repository_health_probe.code >= 200 and outputs.repository_health_probe.code < 300 }}"
    then:
      - id: verify_source_checkout
        type: io.kestra.plugin.core.flow.WorkingDirectory
        tasks:
          - id: clone_source_repository
            type: io.kestra.plugin.git.Clone
            url: https://github.com/khanadil84/Mutant-AI
            branch: main
            description: Verify that the public source repository can be cloned.
          - id: report_healthy_repository
            type: io.kestra.plugin.core.log.Log
            message: "Repository health check passed with HTTP {{ outputs.repository_health_probe.code }}; source clone completed."
      - id: persist_healthy_evidence
        type: io.kestra.plugin.core.kv.Set
        key: "mutant_ai_resilience_{{ execution.id }}"
        kvType: STRING
        value: "result=healthy; endpoint={{ inputs.repository_url }}; http_code={{ outputs.repository_health_probe.code }}; recovery=not-needed; execution={{ execution.id }}"
        overwrite: true
    else:
      - id: recovery_safety_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.safety_mode == 'strict' and inputs.recovery_authorized == true }}"
        then:
          - id: authorized_recovery_notice
            type: io.kestra.plugin.core.log.Log
            message: "Health check failed (HTTP {{ outputs.repository_health_probe.code }}). Authorization flag is present, but this blueprint intentionally performs no infrastructure changes. Route the incident to an approved remediation workflow."
        else:
          - id: recovery_blocked_notice
            type: io.kestra.plugin.core.log.Log
            message: "Health check failed (HTTP {{ outputs.repository_health_probe.code }}). Recovery is blocked because strict mode requires explicit authorization. No infrastructure was changed."
      - id: persist_unhealthy_evidence
        type: io.kestra.plugin.core.kv.Set
        key: "mutant_ai_resilience_{{ execution.id }}"
        kvType: STRING
        value: "result=unhealthy; endpoint={{ inputs.repository_url }}; http_code={{ outputs.repository_health_probe.code }}; safety_mode={{ inputs.safety_mode }}; recovery_authorized={{ inputs.recovery_authorized }}; execution={{ execution.id }}"
        overwrite: true

triggers:
  - id: daily_repository_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 * * *"
    description: Run the repository health check daily at midnight (Kestra server timezone).

extend:
  title: Mutant AI - Repository Resilience Check
  shortDescription: Check repository availability, gate recovery decisions, and persist audit evidence.
  metaTitle: Repository Resilience Check with Kestra
  metaDescription: A focused Kestra workflow for repository health checks, safety-gated recovery decisions, and audit evidence.
  description: |
    ## How it works
    1. An HTTP request checks the configured repository endpoint.
    2. A conditional branch verifies the public source can be cloned when the endpoint is healthy.
    3. If the check fails, a strict safety gate checks whether explicit recovery authorization was supplied.
    4. The flow records the outcome in Kestra KV for later inspection.

    ## What you get
    A real HTTP health check, a Git clone verification, a safety-gated failure path, and per-execution audit evidence.

    ## Who it's for
    Platform engineers, SREs, and DevOps teams learning how to orchestrate health checks and safe incident decisions.

    ## Why orchestrate this with Kestra
    Kestra combines scheduled execution, HTTP and Git tasks, conditional branching, task outputs, and persisted execution evidence in one inspectable workflow.

    ## Prerequisites with Secrets
    A Kestra instance with the Core HTTP, Core flow, Core KV, Core schedule-trigger, and Git plugins available. The default endpoint and source repository are public, so no secrets are required.

    ## Quick start
    1. Import this YAML as a Blueprint flow.
    2. Keep the default public repository endpoint or set `repository_url` to another HTTP health endpoint.
    3. Run the flow manually or leave the daily schedule enabled.
    4. Inspect the HTTP task output, branch taken, and KV record named `mutant_ai_resilience_<execution-id>`.

    ## How to extend
    Add bounded retries and alerting for unhealthy results. For real remediation, call a separate approved workflow, keep credentials in Kestra Secrets, and require explicit human approval before any production change. Do not treat the authorization input alone as sufficient protection for live systems.

    ## Links
    - [Mutant AI repository](https://github.com/khanadil84/Mutant-AI)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [Kestra Git plugin](https://kestra.io/plugins/plugin-git)
    - [Kestra Blueprints repository](https://github.com/kestra-io/blueprints)
  tags:
    - resilience
    - automation
    - devops
  subTags:
    - recovery
    - safety
  ee: false
  demo: false
