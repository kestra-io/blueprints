id: thanos-query-frontend-cache-miss-ratio-sentinel
namespace: company.team

inputs:
  - id: thanos_query_frontend_url
    type: STRING
    defaults: "http://thanos-query-frontend.internal:9090"
    description: Base URL of the Thanos Query Frontend service.
  - id: max_cache_miss_percentage
    type: INT
    defaults: 75
    description: "Maximum allowable query cache miss percentage before alerting (default 75%)."

tasks:
  - id: inspect_cache_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        set -euo pipefail

        # Query Thanos metrics endpoint - fail loudly if unreachable
        if ! curl --fail -sS -m 15 "{{ inputs.thanos_query_frontend_url }}/metrics" -o /tmp/thanos_metrics.txt; then
          echo "ERROR: Failed to reach Thanos Query Frontend metrics endpoint at {{ inputs.thanos_query_frontend_url }}/metrics" >&2
          exit 1
        fi

        python3 -c "
        import sys

        hits = 0.0
        queries = 0.0
        with open('/tmp/thanos_metrics.txt', 'r', encoding='utf-8') as f:
            for line in f:
                line = line.strip()
                if not line or line.startswith('#'):
                    continue
                if line.startswith('thanos_query_frontend_queries_total'):
                    queries += float(line.split()[-1])
                elif line.startswith('thanos_query_frontend_cache_hits_total'):
                    hits += float(line.split()[-1])

        if queries > 0:
            misses = queries - hits
            miss_pct = (misses / queries) * 100.0
            is_breach = 1 if miss_pct >= {{ inputs.max_cache_miss_percentage }} else 0
        else:
            miss_pct = 0.0
            is_breach = 0

        with open('/tmp/thanos_summary.txt', 'w') as out:
            out.write(f'{is_breach}|{miss_pct:.1f}|{int(queries)}|{int(hits)}\n')
        "

        IS_BREACH=$(cut -d '|' -f 1 /tmp/thanos_summary.txt)
        MISS_PCT=$(cut -d '|' -f 2 /tmp/thanos_summary.txt)
        TOTAL_QUERIES=$(cut -d '|' -f 3 /tmp/thanos_summary.txt)
        CACHE_HITS=$(cut -d '|' -f 4 /tmp/thanos_summary.txt)

        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=miss_pct::$MISS_PCT::"
        echo "::set-output name=total_queries::$TOTAL_QUERIES::"
        echo "::set-output name=cache_hits::$CACHE_HITS::"

  - id: evaluate_cache_efficiency
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_cache_metrics.vars.is_breach | int == 1 }}"
    then:
      - id: notify_observability_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#observability-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Thanos Query Frontend Cache Degradation Warning",
                "text": "Thanos Query Frontend cache miss ratio is {{ outputs.inspect_cache_metrics.vars.miss_pct }}% ({{ outputs.inspect_cache_metrics.vars.cache_hits }} hits out of {{ outputs.inspect_cache_metrics.vars.total_queries }} queries). Risk of Querier CPU saturation.",
                "footer": "Kestra Observability Sentinel • Thanos"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#observability-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Thanos Sentinel Failure",
            "text": "Failed to query Thanos Query Frontend metrics at {{ inputs.thanos_query_frontend_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Thanos Query Frontend metrics to detect query cache degradation and backend query saturation."
  metaTitle: Thanos Query Frontend Cache Invalidation and Miss Ratio Sentinel with Kestra
  ee: false
  demo: false
  title: Thanos Query Frontend Cache Invalidation and Miss Ratio Sentinel
  shortDescription: Audits Thanos Query Frontend metrics to detect query cache degradation and backend query saturation.
  description: |
    ## How it works
    This workflow connects to the Thanos Query Frontend Prometheus metrics interface (`/metrics`) to audit query caching efficiency. The query frontend splits long-range PromQL queries into daily intervals and caches results in Redis or Memcached. When cache eviction churn surges due to undersized cache clusters, network timeouts, or improper query step parameters, cache miss percentages spike. Uncached queries fall through directly to downstream Thanos Queriers and Store Gateways, causing threadpool exhaustion and dashboard timeouts. This sentinel computes real-time cache miss ratios and dispatches alerts before telemetry systems degrade.

    ## What you get
    - Real-time tracking of Thanos PromQL query cache performance.
    - Protection against Thanos Querier and Store Gateway overload.
    - Automated Slack notifications with query volume and cache hit metrics.

    ## Who it's for
    - Observability Engineers maintaining large-scale Prometheus and Thanos clusters.
    - SREs safeguarding Grafana dashboard responsiveness and metrics query SLAs.
    - Platform Infrastructure teams operating distributed caching tiers.

    ## Why orchestrate this with Kestra
    - **Automated Infrastructure Auditing**: Periodically polls telemetry metrics without deploying standalone exporters.
    - **Correlated Incidents**: Links monitoring cache degradation with downstream Grafana dashboard alert events.
    - **Incident Escalation**: Dispatches formatted diagnostic metrics directly into team communication channels.

    ## Prerequisites
    - Running Thanos Query Frontend service with accessible `/metrics` endpoint.
    - Slack incoming webhook configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK` to your namespace secrets.
    3. Specify `thanos_query_frontend_url` and alert threshold `max_cache_miss_percentage`.
    4. Enable the schedule trigger to activate automatic cache surveillance.

    ## How to extend
    - Inspect Memcached or Redis connection pool latency via Thanos client metrics.
    - Automatically scale Thanos Query Frontend replica sets in Kubernetes.
    - Route high-severity cache outages to PagerDuty or Opsgenie.

    ## Links
    - [Thanos Query Frontend Documentation](https://thanos.io/tip/components/query-frontend.md/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
