id: rabbitmq-cluster-partition-sentinel
namespace: company.messaging

inputs:
  - id: rabbitmq_management_host
    type: STRING
    defaults: rabbitmq.internal:15672
    description: Host and port of the RabbitMQ Management API.
  - id: rabbitmq_username
    type: STRING
    defaults: guest
    description: Username for RabbitMQ Management API.

tasks:
  - id: inspect_cluster_partitions
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects RabbitMQ cluster nodes to detect network partitions and split-brain states.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      RMQ_HOST: "{{ inputs.rabbitmq_management_host }}"
      RMQ_USER: "{{ inputs.rabbitmq_username }}"
      RMQ_PASS: "{{ secret('RABBITMQ_PASSWORD') }}"
    script: |
      import os
      import sys
      import requests
      from requests.auth import HTTPBasicAuth
      from kestra import Kestra

      host = os.environ.get("RMQ_HOST", "").rstrip("/")
      user = os.environ.get("RMQ_USER", "")
      password = os.environ.get("RMQ_PASS", "")
      url = f"http://{host}/api/nodes"

      try:
          resp = requests.get(url, auth=HTTPBasicAuth(user, password), timeout=15)
          resp.raise_for_status()
          nodes = resp.json()
      except Exception as err:
          print(f"Error: Failed to query RabbitMQ nodes from {url}: {err}", file=sys.stderr)
          sys.exit(1)

      partitioned_nodes = []
      for n in nodes:
          name = n.get("name", "")
          partitions = n.get("partitions", [])
          if partitions:
              partitioned_nodes.append({"node": name, "partitions": partitions})

      partition_count = len(partitioned_nodes)
      alert_triggered = bool(partition_count > 0)
      print(f"Partition audit: total_nodes={len(nodes)}, partitioned={partition_count}, alert={alert_triggered}")

      Kestra.outputs({
          "total_nodes": len(nodes),
          "partitioned_nodes_count": partition_count,
          "alert_triggered": alert_triggered
      })

  - id: evaluate_cluster_partition
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_cluster_partitions.vars.alert_triggered }}"
    then:
      - id: alert_messaging_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":rotating_light: *RabbitMQ Network Partition Alert*: Cluster on {{ inputs.rabbitmq_management_host }} has experienced a network partition (Split-Brain) across {{ outputs.inspect_cluster_partitions.vars.partitioned_nodes_count }} nodes. Immediate intervention required to restore cluster consistency."
          }

outputs:
  - id: total_nodes
    type: INT
    value: "{{ outputs.inspect_cluster_partitions.vars.total_nodes }}"
  - id: partitioned_nodes_count
    type: INT
    value: "{{ outputs.inspect_cluster_partitions.vars.partitioned_nodes_count }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.inspect_cluster_partitions.vars.alert_triggered }}"

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *RabbitMQ Sentinel Failure*: Failed to query nodes on {{ inputs.rabbitmq_management_host }}."
      }

triggers:
  - id: scheduled_partition_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  metaDescription: "Audits RabbitMQ cluster nodes to detect network partitions, split-brain conditions, and cluster isolation events."
  metaTitle: RabbitMQ Cluster Network Partition and Split-Brain Alarm Sentinel with Kestra
  title: RabbitMQ Cluster Network Partition and Split-Brain Alarm Sentinel
  shortDescription: Audits RabbitMQ cluster nodes to detect network partitions, split-brain conditions, and cluster isolation events.
  description: |
    ## How it works
    This sentinel queries the RabbitMQ Management HTTP API `/api/nodes` endpoint across all cluster members. It inspects the `partitions` field on each node to verify that inter-node Erlang communication is unbroken, alerting operators immediately when network partitions split the cluster.

    ## What you get
    - Real-time detection of RabbitMQ network partitions and split-brain states.
    - Early prevention of message loss and queue inconsistency across partitioned nodes.
    - Automated Slack incident delivery indicating affected node names and partition peers.

    ## Who it's for
    - Distributed messaging platform engineers and SREs maintaining RabbitMQ clusters.
    - Systems architects ensuring CAP theorem consistency across event backbones.

    ## Why orchestrate this with Kestra
    Kestra automates distributed system observability, executing scheduled health checks with fine-grained error management and notification delivery.

    ## Prerequisites
    - RabbitMQ Management plugin enabled.
    - Secrets `RABBITMQ_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `rabbitmq_management_host` and credentials.
    3. Run manually to check current cluster partition states.

    ## How to extend
    - Query `cluster_partition_handling` configuration to verify `pause_minority` or `autoheal` behavior.
    - Trigger automated node reboot on isolated minority partitions via cloud APIs.
    - Forward partition alerts to PagerDuty.

    ## Links
    - [RabbitMQ Clustering and Network Partitions](https://www.rabbitmq.com/docs/partitions)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
