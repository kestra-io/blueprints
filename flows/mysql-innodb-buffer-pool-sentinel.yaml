id: mysql-innodb-buffer-pool-sentinel
namespace: company.dataops

inputs:
  - id: mysql_host
    type: STRING
    defaults: mysql.internal
    description: Hostname of the MySQL database instance.
  - id: mysql_port
    type: INT
    defaults: 3306
    description: TCP port of the MySQL database instance.
  - id: mysql_database
    type: STRING
    defaults: mysql
    description: Database name to connect to.
  - id: mysql_username
    type: STRING
    defaults: kestra_monitor
    description: MySQL monitoring username.
  - id: min_buffer_pool_hit_rate_threshold
    type: FLOAT
    defaults: 95.0
    description: Minimum acceptable InnoDB buffer pool hit rate percentage before triggering an alert.

tasks:
  - id: query_innodb_buffer_pool_metrics
    type: io.kestra.plugin.jdbc.mysql.Query
    url: "jdbc:mysql://{{ inputs.mysql_host }}:{{ inputs.mysql_port }}/{{ inputs.mysql_database }}"
    username: "{{ inputs.mysql_username }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    sql: |
      SELECT 
        VARIABLE_NAME, 
        VARIABLE_VALUE 
      FROM performance_schema.global_status 
      WHERE VARIABLE_NAME IN ('Innodb_buffer_pool_read_requests', 'Innodb_buffer_pool_reads');
    fetchType: FETCH

  - id: evaluate_buffer_pool_efficiency
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (1.0 - (outputs.query_innodb_buffer_pool_metrics.rows[1].VARIABLE_VALUE / outputs.query_innodb_buffer_pool_metrics.rows[0].VARIABLE_VALUE)) * 100.0 < inputs.min_buffer_pool_hit_rate_threshold }}"
    then:
      - id: alert_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *MySQL Memory Pressure Alert*: InnoDB buffer pool hit rate on {{ inputs.mysql_host }} has fallen below {{ inputs.min_buffer_pool_hit_rate_threshold }}%. Increased disk I/O reads detected."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *MySQL Sentinel Execution Failure*: Failed to query global status metrics on {{ inputs.mysql_host }}."
      }

triggers:
  - id: hourly_buffer_pool_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: MySQL InnoDB Buffer Pool Hit Rate and Memory Efficiency Sentinel
  shortDescription: Audits MySQL InnoDB buffer pool hit ratios to detect memory exhaustion and excessive disk read pressure.
  description: |
    ## How it works
    This workflow executes SQL queries against the MySQL `performance_schema.global_status` table using the `Query` plugin. It computes the InnoDB buffer pool hit ratio from `Innodb_buffer_pool_read_requests` (memory reads) and `Innodb_buffer_pool_reads` (disk reads), triggering alerts when disk reads rise above threshold.

    ## What you get
    - Continuous programmatic validation of MySQL database memory efficiency.
    - Early warning before disk I/O bottlenecks degrade application query response times.
    - Real-time Slack notifications alerting DBAs to buffer pool sizing constraints.

    ## Who it's for
    - Database administrators (DBAs) and performance engineers tuning MySQL workloads.
    - SREs maintaining mission-critical relational database reliability.

    ## Why orchestrate this with Kestra
    Kestra runs automated database health checks natively using the JDBC plugin suite, combining SQL telemetry with declarative conditional logic and notification dispatching.

    ## Prerequisites
    - MySQL database server with `performance_schema` accessible to the monitoring user.
    - Secrets `MYSQL_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure database host, port, and credentials.
    3. Trigger a manual run to evaluate current buffer pool efficiency.

    ## How to extend
    - Query `Innodb_buffer_pool_wait_free` to detect dirty page flush delays.
    - Monitor slow queries via `slow_log` table concurrently.
    - Export historical hit rate metrics to long-term storage in BigQuery.

    ## Links
    - [Kestra MySQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [MySQL InnoDB Buffer Pool Tuning](https://dev.mysql.com/doc/refman/8.0/en/innodb-buffer-pool.html)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
