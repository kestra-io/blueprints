id: stackoverflow-unanswered-question-sla-sentinel
namespace: company.support
description: |
  Monitor unanswered Stack Overflow questions past an answer SLA, create assigned
  GitHub tickets with explicit opt-in, and remember ticketed question IDs in the KV
  Store to prevent repeat alerts.

concurrency:
  limit: 1
  behavior: QUEUE

triggers:
  - id: hourly_sla_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Runs once an hour - unanswered-question SLAs are measured in hours, so hourly resolution is enough to catch a breach shortly after it crosses the threshold. Shipped disabled; enable it once a manual run has been verified against your tag."
    cron: "0 * * * *"
    disabled: true
    inputs:
      so_tag: "kestra"
      sla_hours: 24
      max_questions: 50
      ticket_repository: "your-org/support"
      ticket_owner: "support-owner"
      create_tickets: false

inputs:
  - id: so_tag
    type: STRING
    displayName: "Stack Overflow Tag"
    defaults: "kestra"
    description: "The Stack Overflow tag to watch, passed to the Stack Exchange API's `tagged` filter. The API matches a single tag per request."

  - id: sla_hours
    type: INT
    displayName: "Answer SLA (hours)"
    defaults: 24
    description: "A question with no answers older than this many hours is reported as an SLA breach."

  - id: max_questions
    type: INT
    displayName: "Max Questions per Run"
    defaults: 50
    description: "How many of the newest questions to check each run (Stack Exchange API `pagesize`, capped at 100 by the API itself)."

  - id: ticket_repository
    type: STRING
    defaults: your-org/support
    description: GitHub repository receiving SLA tickets (owner/repo).
  - id: ticket_owner
    type: STRING
    defaults: support-owner
    description: GitHub login to assign. Must have access to the ticket repository.
  - id: create_tickets
    type: BOOL
    defaults: false
    description: Explicit opt-in to create assigned GitHub issues. False previews breaches without marking them alerted.

tasks:
  - id: fetch_tagged_questions
    type: io.kestra.plugin.core.http.Download
    description: "GET the newest questions for the tag from the public Stack Exchange API (/2.3/questions with site=stackoverflow, sorted by creation date). The endpoint needs no API key for anonymous quota (300 requests/day), and the response is stored in internal storage as JSON rather than inlined, so question titles or bodies containing template-like braces can never break expression rendering downstream."
    uri: "https://api.stackexchange.com/2.3/questions?site=stackoverflow&tagged={{ inputs.so_tag }}&pagesize={{ inputs.max_questions }}&sort=creation&order=desc"

  - id: score_sla_breaches
    type: io.kestra.plugin.scripts.python.Script
    description: "Score every fetched question in a dependency-free Python script: a question breaches the SLA when it is still unanswered (`is_answered` false and `answer_count` zero, per the Stack Exchange API's own fields) and its age exceeds `sla_hours`. Emits `breach_count`, `checked_count`, `has_breaches`, and a rendered `digest_markdown` as task outputs, and writes the breach records to `breaches.json` as single-line JSON - the serdes JSON tasks parse files line by line, so pretty-printed multi-line JSON must not be written here."
    containerImage: python:3.11-slim
    inputFiles:
      "questions.json": "{{ outputs.fetch_tagged_questions.uri }}"
    env:
      SO_TAG: "{{ inputs.so_tag }}"
    outputFiles:
      - "breaches.json"
    script: |
      import json
      import os
      from datetime import datetime, timezone

      with open("questions.json") as f:
          response = json.load(f)
      items = response.get("items", [])
      now = datetime.now(timezone.utc)
      sla_seconds = {{ inputs.sla_hours }} * 3600
      breaches = []
      for q in items:
          if q.get("is_answered") or q.get("answer_count", 0) > 0:
              continue
          age = now.timestamp() - q["creation_date"]
          if age > sla_seconds:
              breaches.append({
                  "question_id": q["question_id"],
                  "title": q["title"],
                  "link": q["link"],
                  "age_hours": round(age / 3600, 1),
                  "score": q.get("score", 0),
                  "view_count": q.get("view_count", 0),
                  "tags": q.get("tags", []),
              })
      lines = [
          "# Unanswered Stack Overflow questions past SLA",
          "",
          "Tag: `" + os.environ["SO_TAG"] + "` - SLA: {{ inputs.sla_hours }}h",
          "",
      ]
      if breaches:
          for b in breaches:
              lines.append("- [{title}]({link}) - {age}h old, score {score}, {views} views".format(
                  title=b["title"], link=b["link"], age=b["age_hours"],
                  score=b["score"], views=b["view_count"]))
      else:
          lines.append("All unanswered questions are within the SLA.")
      digest = "\n".join(lines)
      with open("breaches.json", "w") as f:
          json.dump(breaches, f)
      print('::{"outputs":{"breach_count":' + str(len(breaches))
          + ',"breaches":' + json.dumps(breaches)
          + ',"checked_count":' + str(len(items))
          + ',"has_breaches":"' + str(bool(breaches)).lower()
          + '","digest_markdown":' + json.dumps(digest) + '}}::')

  - id: normalize_breach_records
    type: io.kestra.plugin.serdes.json.JsonToIon
    description: "Convert the breach records to Kestra's internal ION format so downstream tasks (file conversions, warehouse loads, alerts built by whoever adopts this blueprint) can consume them as typed rows."
    from: "{{ outputs.score_sla_breaches.outputFiles['breaches.json'] }}"

  - id: escalate_new_breaches
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ outputs.score_sla_breaches.vars.breaches }}"
    concurrencyLimit: 1
    tasks:
      - id: only_unalerted
        type: io.kestra.plugin.core.flow.If
        condition: >-
          {{ kv('so_sla_' ~ (inputs.ticket_repository | replace({'/': '_'})) ~ '_' ~
          (item.value | jq('.question_id') | first), errorOnMissing=false) is null }}
        then:
          - id: ticket_opt_in
            type: io.kestra.plugin.core.flow.If
            condition: "{{ inputs.create_tickets }}"
            then:
              - id: create_assigned_ticket
                type: io.kestra.plugin.core.http.Request
                uri: "https://api.github.com/repos/{{ inputs.ticket_repository }}/issues"
                method: POST
                contentType: application/json
                headers:
                  Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
                  Accept: application/vnd.github+json
                  X-GitHub-Api-Version: "2022-11-28"
                body: >-
                  {{ {'title': '[Stack Overflow SLA] ' ~ (item.value | jq('.title') | first),
                  'body': 'Unanswered question past the answer SLA: ' ~ (item.value | jq('.link') | first) ~
                  ' - Age: ' ~ (item.value | jq('.age_hours') | first) ~
                  ' hours. Please triage and answer the question.', 'assignees': [inputs.ticket_owner]} | toJson }}
              - id: verify_assignment
                type: io.kestra.plugin.core.flow.If
                condition: >-
                  {{ outputs.create_assigned_ticket.code == 201 and
                  (outputs.create_assigned_ticket.body | jq('.assignees[].login')) contains inputs.ticket_owner }}
                then:
                  - id: remember_alerted_question
                    type: io.kestra.plugin.core.kv.Set
                    key: >-
                      {{ 'so_sla_' ~ (inputs.ticket_repository | replace({'/': '_'})) ~ '_' ~
                      (item.value | jq('.question_id') | first) }}
                    value: "{{ outputs.create_assigned_ticket.body }}"
                    description: Record only after GitHub confirms issue creation and the requested assignee.
                else:
                  - id: assignment_not_confirmed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: "Ticket creation or assignment was not confirmed. Inspect the GitHub issue and reconcile KV before retrying."
            else:
              - id: preview_ticket
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Would assign question {{ item.value | jq('.question_id') | first }} to {{ inputs.ticket_owner }}
                  in {{ inputs.ticket_repository }}. Set create_tickets=true after configuring GITHUB_TOKEN.

  - id: report
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.create_tickets }}"
    then:
      - id: report_escalation_complete
        type: io.kestra.plugin.core.log.Log
        message: >-
          Checked {{ outputs.score_sla_breaches.vars.checked_count }} questions:
          {{ outputs.score_sla_breaches.vars.breach_count }} current breaches processed.
          Only previously unticketed questions were escalated; details are in the loop executions and KV Store.
    else:
      - id: publish_preview_digest
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.score_sla_breaches.vars.digest_markdown }}"

extend:
  title: Stack Overflow Unanswered Question SLA Sentinel
  metaTitle: Monitor Stack Overflow Answer SLA with Kestra | Kestra
  shortDescription: Monitor unanswered Stack Overflow questions, create assigned SLA tickets, and deduplicate them with
    the KV Store.
  metaDescription: Monitor unanswered Stack Overflow questions, create assigned SLA tickets, and deduplicate them with
    the KV Store.
  description: |
    Monitor a Stack Overflow tag and turn unanswered questions older than the answer SLA into assigned GitHub issues.

    ## How it works

    1. Download the newest questions and score unanswered ones against `sla_hours`.
    2. Convert breach records to ION and iterate over them sequentially.
    3. Look up each question ID and destination repository in Kestra's namespace KV Store. Already ticketed questions are skipped.
    4. With `create_tickets: true`, create a GitHub issue assigned to `ticket_owner`, verify the returned assignee, then save the successful response in KV. With false (the default), log a preview only, without changing KV.
    5. Log a preview digest in preview mode, or a count summary in ticketing mode. Repeat runs do not re-emit individual alerts for ticketed questions.

    ## Setup

    - Python script and serdes plugins; Docker-compatible runner for `python:3.11-slim`.
    - Set `ticket_repository` to your own support repository and `ticket_owner` to a GitHub login with access. Do not leave the placeholders when enabling creation.
    - Set the `GITHUB_TOKEN` secret with permission to create and assign issues in that repository. No token is read in preview mode.
    - Run once with `create_tickets: false`, inspect the digest, then explicitly enable ticket creation. The hourly trigger is disabled and has its own inputs; configure them before enabling it.

    ## State and failure handling

    Flow concurrency is one (QUEUE) to serialize this flow's read/create/write sequence. KV keys use `so_sla_<owner>_<repo>_<question_id>` in the flow namespace. Do not run another flow concurrently against the same keys. Keys have no TTL: remove a key deliberately to allow a fresh ticket for that question.

    The KV write follows the successful HTTP request. A rejected API call fails the run without marking the question alerted. GitHub issue creation and the KV write are not transactional: if GitHub accepts the issue but its response is lost, assignment is rejected, or the KV write fails, inspect the repository and reconcile the key before retrying to avoid a duplicate. No automatic HTTP retry is configured.

    ## Inputs and outputs

    `so_tag` defaults to `kestra`, `sla_hours` to 24, and `max_questions` to 50. `ticket_repository` and `ticket_owner` are placeholders. `create_tickets` defaults to false. The scorer emits breach records, counts and a markdown digest; `normalize_breach_records.uri` contains ION records. Each successful GitHub response is stored in KV for follow-up.

    ## Limits

    Only the newest page is checked (API maximum 100). Busy tags may require pagination. A question with any answer is not a breach, even without an accepted answer. Anonymous Stack Exchange quota is shared by egress IP; this flow makes one request per run. Titles and links are handled as data, not executable templates.

    ## Testing

    Validated and executed on local Kestra 2.0.6 with Python script 1.18.3 and serdes 2.3.2. HTTP fixtures verified first-run ticket creation plus requested assignee, repeat-run deduplication, preview (no POST or KV write), empty input, HTTP failure without KV write, recovery and deduplication after recovery, and a missing assignee failing without a KV write. A title containing quotes and template-like braces was preserved as data. A live Stack Exchange preview completed successfully. Local runs used the Process runner in place of Docker; GitHub writes used a localhost fixture only, never a real repository. The published Docker runner and real GitHub token permissions were not exercised.
  tags:
  - Business
  subTags:
  - Reporting & Digests
  ee: false
  demo: false
