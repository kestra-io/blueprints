id: stackoverflow-unanswered-question-sla-sentinel
namespace: company.support
description: |
  Poll the public Stack Exchange API for the newest questions on a chosen Stack
  Overflow tag, flag every still-unanswered question older than a configurable
  response-time SLA, and log a markdown digest of the breaches - so a support or
  community team sees which questions have aged past their answer commitment.

triggers:
  - id: hourly_sla_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Runs once an hour - unanswered-question SLAs are measured in hours, so hourly resolution is enough to catch a breach shortly after it crosses the threshold. Shipped disabled; enable it once a manual run has been verified against your tag."
    cron: "0 * * * *"
    disabled: true
    inputs:
      so_tag: "kestra"
      sla_hours: 24
      max_questions: 50

inputs:
  - id: so_tag
    type: STRING
    displayName: "Stack Overflow Tag"
    defaults: "kestra"
    description: "The Stack Overflow tag to watch, passed to the Stack Exchange API's `tagged` filter. The API matches a single tag per request."

  - id: sla_hours
    type: INT
    displayName: "Answer SLA (hours)"
    defaults: 24
    description: "A question with no answers (or none marked as answering it) older than this many hours is reported as an SLA breach."

  - id: max_questions
    type: INT
    displayName: "Max Questions per Run"
    defaults: 50
    description: "How many of the newest questions to check each run (Stack Exchange API `pagesize`, capped at 100 by the API itself)."

tasks:
  - id: fetch_tagged_questions
    type: io.kestra.plugin.core.http.Download
    description: "GET the newest questions for the tag from the public Stack Exchange API (/2.3/questions with site=stackoverflow, sorted by creation date). The endpoint needs no API key for anonymous quota (300 requests/day), and the response is stored in internal storage as JSON rather than inlined, so question titles or bodies containing template-like braces can never break expression rendering downstream."
    uri: "https://api.stackexchange.com/2.3/questions?site=stackoverflow&tagged={{ inputs.so_tag }}&pagesize={{ inputs.max_questions }}&sort=creation&order=desc"

  - id: score_sla_breaches
    type: io.kestra.plugin.scripts.python.Script
    description: "Score every fetched question in a dependency-free Python script: a question breaches the SLA when it is still unanswered (`is_answered` false and `answer_count` zero, per the Stack Exchange API's own fields) and its age exceeds `sla_hours`. Emits `breach_count`, `checked_count`, `has_breaches`, and a rendered `digest_markdown` as task outputs, and writes the breach records to `breaches.json` as single-line JSON - the serdes JSON tasks parse files line by line, so pretty-printed multi-line JSON must not be written here."
    containerImage: python:3.11-slim
    inputFiles:
      "questions.json": "{{ outputs.fetch_tagged_questions.uri }}"
    outputFiles:
      - "breaches.json"
    script: |
      import json
      from datetime import datetime, timezone

      with open("questions.json") as f:
          response = json.load(f)
      items = response.get("items", [])
      now = datetime.now(timezone.utc)
      sla_seconds = {{ inputs.sla_hours }} * 3600
      breaches = []
      for q in items:
          if q.get("is_answered") or q.get("answer_count", 0) > 0:
              continue
          age = now.timestamp() - q["creation_date"]
          if age > sla_seconds:
              breaches.append({
                  "question_id": q["question_id"],
                  "title": q["title"],
                  "link": q["link"],
                  "age_hours": round(age / 3600, 1),
                  "score": q.get("score", 0),
                  "view_count": q.get("view_count", 0),
                  "tags": q.get("tags", []),
              })
      lines = [
          "# Unanswered Stack Overflow questions past SLA",
          "",
          "Tag: `{{ inputs.so_tag }}` - SLA: {{ inputs.sla_hours }}h",
          "",
      ]
      if breaches:
          for b in breaches:
              lines.append("- [{title}]({link}) - {age}h old, score {score}, {views} views".format(
                  title=b["title"], link=b["link"], age=b["age_hours"],
                  score=b["score"], views=b["view_count"]))
      else:
          lines.append("All unanswered questions are within the SLA.")
      digest = "\n".join(lines)
      with open("breaches.json", "w") as f:
          json.dump(breaches, f)
      print('::{"outputs":{"breach_count":' + str(len(breaches))
          + ',"checked_count":' + str(len(items))
          + ',"has_breaches":"' + str(bool(breaches)).lower()
          + '","digest_markdown":' + json.dumps(digest) + '}}::')

  - id: normalize_breach_records
    type: io.kestra.plugin.serdes.json.JsonToIon
    description: "Convert the breach records to Kestra's internal ION format so downstream tasks (file conversions, warehouse loads, alerts built by whoever adopts this blueprint) can consume them as typed rows."
    from: "{{ outputs.score_sla_breaches.outputFiles['breaches.json'] }}"

  - id: report
    type: io.kestra.plugin.core.flow.If
    description: "Publish the digest only when at least one question breached the SLA; otherwise record a clean pass with the number of questions checked, so quiet hours are distinguishable from a broken flow in the execution log."
    condition: "{{ outputs.score_sla_breaches.vars.has_breaches == 'true' }}"
    then:
      - id: publish_digest
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.score_sla_breaches.vars.digest_markdown }}"
    else:
      - id: report_all_within_sla
        type: io.kestra.plugin.core.log.Log
        message: "Checked {{ outputs.score_sla_breaches.vars.checked_count }} questions tagged {{ inputs.so_tag }}: all are within the {{ inputs.sla_hours }}h SLA."

extend:
  title: "Stack Overflow Unanswered Question SLA Sentinel"
  metaTitle: "Monitor Stack Overflow Answer SLA with Kestra | Kestra"
  shortDescription: "Poll the Stack Exchange API for a Stack Overflow tag and log a digest of unanswered questions older than your response-time SLA, every hour."
  metaDescription: "Flag unanswered Stack Overflow questions past your answer SLA - hourly Stack Exchange API check, breach digest, and ION records, no API key needed."
  description: |
    Product and community teams that watch a Stack Overflow tag usually find
    out about neglected questions by manually scrolling the tag page. This
    blueprint polls the public Stack Exchange API on a schedule, flags every
    still-unanswered question older than a configurable answer-time SLA, and
    logs a markdown digest of exactly which questions breached, with age,
    score, and link for each.

    ## How it works

    1. `hourly_sla_check` (`io.kestra.plugin.core.trigger.Schedule`) runs once an hour, explicitly passing `so_tag`, `sla_hours`, and `max_questions` through its own `inputs:` block so the flow is self-contained when the trigger fires. Shipped disabled so a manual run can be verified first.
    2. `fetch_tagged_questions` (`io.kestra.plugin.core.http.Download`) calls the Stack Exchange `/2.3/questions` endpoint for the tag - anonymous quota, no API key - and stores the JSON response in internal storage.
    3. `score_sla_breaches` (`io.kestra.plugin.scripts.python.Script`) loads the stored response, treats a question as a breach when it has no answers and its age exceeds `sla_hours`, writes the breach records to `breaches.json`, and emits `breach_count`, `checked_count`, `has_breaches`, and a pre-rendered `digest_markdown` as task outputs.
    4. `normalize_breach_records` (`io.kestra.plugin.serdes.json.JsonToIon`) converts the breach records to ION for downstream consumers.
    5. `report` (`io.kestra.plugin.core.flow.If`) logs the digest when at least one breach exists, and a "all within SLA" line with the checked count otherwise - quiet hours stay distinguishable from a broken flow in the execution history.

    ## What you get

    - An hourly, machine-checkable digest of unanswered questions past your answer SLA, computed from the Stack Exchange API's own `is_answered`, `answer_count`, and `creation_date` fields - not from a manually maintained tag watch.
    - One log line per breach with title, link, exact age in hours, score, and view count, so the worst-neglected questions are triaged by real numbers.
    - Breach records normalized to ION, ready to fan out to Slack, email, a warehouse, or a ticketing system.
    - A clean-pass log line when nothing breaches, so "no news" is auditable rather than ambiguous.

    ## Who it's for

    - Developer relations and community teams that commit to answering questions on their product's Stack Overflow tag within a fixed window.
    - Support engineering teams who want an objective backlog of aged, unanswered questions instead of manually refreshing the tag page.
    - Anyone evaluating Kestra's HTTP, Python script, serdes, and flow-control plugins who wants a small, self-contained, keyless example.

    ## Why orchestrate this with Kestra

    The Stack Exchange API has no push mechanism for "this question has waited too long" - something has to poll, remember, and report. Kestra supplies the hourly schedule, the breach/no-breach branch as first-class flow control, versioned inputs for tag and SLA, and an execution history showing exactly when a question first crossed the threshold. A cron job could poll the API, but would need its own state handling, error surfacing, and digest formatting rebuilt every time.

    ## Prerequisites

    - Nothing beyond a running Kestra instance with the Python script plugin - the Stack Exchange API allows anonymous read access (300 requests/day per IP), which covers hourly polling of one tag with ample headroom.
    - The Python script task runs in a `python:3.11-slim` container, so a Docker-compatible task runner (the default) is required.

    ### Secrets

    - None. The Stack Exchange API endpoint used here is public and keyless.

    ### Inputs

    | Input | Type | Default | Description |
    |---|---|---|---|
    | `so_tag` | STRING | `kestra` | Stack Overflow tag to monitor |
    | `sla_hours` | INT | `24` | Age in hours after which an unanswered question is a breach |
    | `max_questions` | INT | `50` | Newest questions checked per run (API max 100) |

    ### Outputs

    - `outputs.score_sla_breaches.vars.breach_count` (int): number of questions past the SLA this run.
    - `outputs.score_sla_breaches.vars.checked_count` (int): number of questions returned by the API this run.
    - `outputs.score_sla_breaches.vars.has_breaches` (string): `"true"` / `"false"`, used by the `report` branch.
    - `outputs.score_sla_breaches.vars.digest_markdown` (string): the rendered markdown digest.
    - `outputs.normalize_breach_records.uri` (URI): the breach records as an ION file.

    ## Quick start

    1. Import this blueprint and click **Execute** with default inputs - the `kestra` tag is quiet, so expect the clean-pass branch.
    2. Re-run with `so_tag` set to a busy tag (for example `airflow`) and a low `sla_hours` (for example `4`) to see the breach digest branch.
    3. Confirm both branches in the execution logs, then set your real tag and SLA.
    4. Enable `hourly_sla_check` once you trust the check against your tag.

    ## How to extend

    - Route the digest to Slack or email by replacing `publish_digest` with a notification task (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook` or `io.kestra.plugin.notifications.mail.MailSend`) - the markdown is already rendered.
    - Escalate by age: nest a second `If` on `age_hours` so questions past double the SLA page differently than fresh breaches.
    - Watch several tags by duplicating the flow per tag, or by driving the inputs from a `Loop` over a tag list.
    - Persist `breaches.json` to cloud storage after `normalize_breach_records` to keep a breach history beyond execution retention.

    ## Pitfalls

    - **Anonymous API quota is 300 requests/day per IP.** Hourly polling uses 24, but sharing the egress IP with other Stack Exchange consumers can exhaust it - register a Stack Apps key and add `&key=` to the URI if you need more.
    - **A question with answers is not a breach even if none is accepted.** The SLA here is "someone answered", matching the API's `is_answered`/`answer_count` semantics; tracking accepted answers would need a stricter rule.
    - **`max_questions` only sees the newest page.** On very busy tags more than `max_questions` questions can arrive within one hour; raise it (up to the API's 100) or shorten the schedule interval.
    - **Write single-line JSON for serdes tasks.** `breaches.json` is deliberately written without indentation because the serdes JSON tasks parse input line by line; pretty-printed JSON fails conversion.

    ## Tested

    - Executed end to end on a local Kestra 2.0 standalone server against the live Stack Exchange API. Run 1 (`so_tag=airflow`, `sla_hours=4`) flagged 23 real unanswered questions and published the digest; run 2 (defaults, `so_tag=kestra`) took the clean-pass branch. Both executions succeeded with all tasks green. Local runs used the Process task runner instead of Docker; the published flow keeps the standard `python:3.11-slim` container image.

    ## Links

    - [Kestra HTTP plugin documentation](https://kestra.io/plugins/core/http)
    - [Kestra Python script plugin documentation](https://kestra.io/plugins/plugin-script-python)
    - [Kestra serdes plugin documentation](https://kestra.io/plugins/plugin-serdes)
    - [Stack Exchange API /questions reference](https://api.stackexchange.com/docs/questions)
  tags:
    - Business
  subTags:
    - Reporting & Digests
  ee: false
  demo: false
