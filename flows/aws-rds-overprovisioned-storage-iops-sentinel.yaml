id: aws-rds-overprovisioned-storage-iops-sentinel
namespace: company.team

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: AWS region where the RDS instance is hosted.
  - id: db_instance_identifier
    type: STRING
    description: AWS RDS DB instance identifier to audit.
  - id: iops_utilization_threshold_pct
    type: INT
    defaults: 25
    description: Minimum acceptable average IOPS utilization percentage before flagging overprovisioning.

tasks:
  - id: query_rds_iops_telemetry
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
      DB_IDENTIFIER: "{{ inputs.db_instance_identifier }}"
      THRESHOLD_PCT: "{{ inputs.iops_utilization_threshold_pct }}"
    outputFiles:
      - rds_iops.json
    script: |
      import os
      import sys
      import json
      from datetime import datetime, timezone, timedelta
      import boto3
      from kestra import Kestra

      region = os.environ.get("AWS_DEFAULT_REGION", "us-east-1")
      db_id = os.environ.get("DB_IDENTIFIER")
      threshold_pct = float(os.environ.get("THRESHOLD_PCT", 25))

      if not db_id:
          print("ERROR: DB_IDENTIFIER environment variable is required", file=sys.stderr)
          sys.exit(1)

      try:
          rds = boto3.client("rds", region_name=region)
          resp = rds.describe_db_instances(DBInstanceIdentifier=db_id)
          dbs = resp.get("DBInstances", [])
          if not dbs:
              print(f"ERROR: DB instance '{db_id}' not found in region {region}", file=sys.stderr)
              sys.exit(1)
          provisioned_iops = int(dbs[0].get("Iops", 0))
      except Exception as e:
          print(f"ERROR: Failed to describe DB instance '{db_id}': {e}", file=sys.stderr)
          sys.exit(1)

      now = datetime.now(timezone.utc)
      start_time = now - timedelta(days=1)

      try:
          cw = boto3.client("cloudwatch", region_name=region)
          metrics = cw.get_metric_data(
              MetricDataQueries=[
                  {
                      "Id": "r1",
                      "MetricStat": {
                          "Metric": {
                              "Namespace": "AWS/RDS",
                              "MetricName": "ReadIOPS",
                              "Dimensions": [{"Name": "DBInstanceIdentifier", "Value": db_id}]
                          },
                          "Period": 86400,
                          "Stat": "Average"
                      }
                  },
                  {
                      "Id": "w1",
                      "MetricStat": {
                          "Metric": {
                              "Namespace": "AWS/RDS",
                              "MetricName": "WriteIOPS",
                              "Dimensions": [{"Name": "DBInstanceIdentifier", "Value": db_id}]
                          },
                          "Period": 86400,
                          "Stat": "Average"
                      }
                  }
              ],
              StartTime=start_time,
              EndTime=now
          )
      except Exception as e:
          print(f"ERROR: Failed to query CloudWatch metrics for '{db_id}': {e}", file=sys.stderr)
          sys.exit(1)

      read_iops = 0.0
      write_iops = 0.0
      for r in metrics.get("MetricDataResults", []):
          vals = r.get("Values", [])
          avg_val = float(vals[0]) if vals else 0.0
          if r["Id"] == "r1":
              read_iops = avg_val
          elif r["Id"] == "w1":
              write_iops = avg_val

      consumed_iops = read_iops + write_iops
      if provisioned_iops > 0:
          util_pct = round((consumed_iops * 100.0) / provisioned_iops, 1)
      else:
          util_pct = 100.0

      is_overprovisioned = (provisioned_iops > 0 and util_pct < threshold_pct)

      telemetry = {
          "db_instance_identifier": db_id,
          "region": region,
          "provisioned_iops": provisioned_iops,
          "read_iops": read_iops,
          "write_iops": write_iops,
          "consumed_iops": consumed_iops,
          "util_pct": util_pct,
          "is_overprovisioned": is_overprovisioned
      }

      with open("rds_iops.json", "w", encoding="utf-8") as out:
          json.dump(telemetry, out, indent=2)

      print(f"RDS IOPS audit for {db_id}: provisioned={provisioned_iops}, consumed={consumed_iops:.1f}, util={util_pct}%")

      Kestra.outputs({
          "provisioned_iops": provisioned_iops,
          "util_pct": util_pct,
          "is_overprovisioned": is_overprovisioned
      })

  - id: evaluate_iops_utilization
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_rds_iops_telemetry.vars.is_overprovisioned }}"
    then:
      - id: notify_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#finops-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ AWS RDS Overprovisioned IOPS Cost Optimization",
                "text": "RDS instance `{{ inputs.db_instance_identifier }}` has *{{ outputs.query_rds_iops_telemetry.vars.provisioned_iops }}* provisioned IOPS, but utilized only *{{ outputs.query_rds_iops_telemetry.vars.util_pct }}%* on average over the last 24 hours! Recommendation: Downscale provisioned IOPS (or switch to gp3 storage) to save hundreds of dollars in unutilized storage overhead.",
                "footer": "Kestra Cloud FinOps • AWS RDS"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#finops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ AWS RDS Provisioned Storage IOPS Utilization Sentinel Pipeline Failure",
            "text": "Failed to query RDS IOPS metrics via AWS API. Check instance identifier and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors AWS RDS Read/Write IOPS CloudWatch metrics against provisioned IOPS to detect overprovisioned storage spend."
  metaTitle: AWS RDS Provisioned Storage IOPS Utilization Sentinel with Kestra
  title: AWS RDS Provisioned Storage IOPS Utilization Sentinel
  shortDescription: Monitors AWS RDS Read/Write IOPS CloudWatch metrics against provisioned IOPS to detect overprovisioned storage spend.
  description: |
    ## How it works
    This workflow queries `aws rds describe-db-instances` to inspect the provisioned IOPS allocated to the database, and aggregates `ReadIOPS` and `WriteIOPS` from CloudWatch over a 24-hour evaluation period. In AWS RDS, provisioned IOPS (io1/io2 storage) costs significant recurring cloud spend ($0.10+ per provisioned IOPS-month). When average utilization is below 25%, workloads are overprovisioned and can safely downscale or migrate to `gp3`. Slack is alerted with right-sizing recommendations.

    ## What you get
    - Continuous FinOps audit of AWS RDS provisioned IOPS utilization.
    - Prevents cloud budget waste from idle provisioned database throughput.
    - Actionable recommendations with exact consumed and provisioned IOPS metrics.

    ## Who it's for
    - FinOps Practitioners and Cloud Cost Optimization Engineers.
    - SREs and Database Administrators managing AWS RDS fleets.

    ## Why orchestrate this with Kestra
    - **Native AWS CLI Automation**: Correlates configuration metadata with live CloudWatch telemetry.
    - **Continuous Rightsizing**: Identify waste automatically without third-party SaaS tools.
    - **Actionable Notifications**: Formatted Slack reports with concrete cost-reduction steps.

    ## Prerequisites
    - AWS IAM credentials with `rds:DescribeDBInstances` and `cloudwatch:GetMetricData`.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure DB instance identifier and region.
    3. Run the workflow to inspect RDS IOPS utilization.

    ## How to extend
    - Automatically generate Terraform/CloudFormation PRs to update storage types to gp3.
    - Expand audit across all RDS databases in an account dynamically.

    ## Links
    - [AWS RDS Provisioned IOPS Storage Documentation](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html#USER_PIOPS)
    - [Kestra AWS CLI Plugin](https://kestra.io/plugins/plugin-aws/io.kestra.plugin.aws.cli.awscli)
  tags:
    - Cloud
    - Business
  subTags:
    - AWS Services
    - Infrastructure Automation
  ee: false
  demo: false
