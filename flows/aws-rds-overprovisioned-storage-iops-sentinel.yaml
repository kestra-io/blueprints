id: aws-rds-overprovisioned-storage-iops-sentinel
namespace: company.ops

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: AWS region where the RDS instance is hosted.
  - id: db_instance_identifier
    type: STRING
    description: AWS RDS DB instance identifier to audit.
  - id: iops_utilization_threshold_pct
    type: INT
    defaults: 25
    description: Minimum acceptable average IOPS utilization percentage before flagging overprovisioning.

tasks:
  - id: query_rds_iops_telemetry
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        PROVISIONED_IOPS=$(aws rds describe-db-instances \
          --db-instance-identifier "{{ inputs.db_instance_identifier }}" \
          --query 'DBInstances[0].Iops' --output text)
        PROVISIONED_IOPS=${PROVISIONED_IOPS:-0}
        
        # Query average consumed IOPS (ReadIOPS + WriteIOPS) over last 24h
        aws cloudwatch get-metric-data \
          --metric-data-queries '[{"Id":"r1","MetricStat":{"Metric":{"Namespace":"AWS/RDS","MetricName":"ReadIOPS","Dimensions":[{"Name":"DBInstanceIdentifier","Value":"{{ inputs.db_instance_identifier }}"}]},"Period":86400,"Stat":"Average"}},{"Id":"w1","MetricStat":{"Metric":{"Namespace":"AWS/RDS","MetricName":"WriteIOPS","Dimensions":[{"Name":"DBInstanceIdentifier","Value":"{{ inputs.db_instance_identifier }}"}]},"Period":86400,"Stat":"Average"}}]' \
          --start-time "$(date -u -v-1d +%Y-%m-%dT%H:%M:%SZ)" \
          --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --output json > /tmp/rds_iops.json
        
        READ_IOPS=$(jq '.MetricDataResults[0].Values[0] // 0' /tmp/rds_iops.json)
        WRITE_IOPS=$(jq '.MetricDataResults[1].Values[0] // 0' /tmp/rds_iops.json)
        
        cat << 'EOF' > /tmp/calc_iops.py
        import sys
        prov = float(sys.argv[1])
        r = float(sys.argv[2])
        w = float(sys.argv[3])
        total = r + w
        pct = (total * 100.0) / prov if prov > 0 else 100.0
        print(f"{pct:.1f}")
        EOF
        
        UTIL_PCT=$(python3 /tmp/calc_iops.py "$PROVISIONED_IOPS" "$READ_IOPS" "$WRITE_IOPS")
        
        echo "::set-output name=provisioned_iops::$PROVISIONED_IOPS::"
        echo "::set-output name=util_pct::$UTIL_PCT::"

  - id: evaluate_iops_utilization
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_rds_iops_telemetry.vars.provisioned_iops | int > 0 and outputs.query_rds_iops_telemetry.vars.util_pct | float < inputs.iops_utilization_threshold_pct }}"
    then:
      - id: notify_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#finops-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "💰 AWS RDS Overprovisioned IOPS Cost Optimization",
                "text": "RDS instance `{{ inputs.db_instance_identifier }}` has *{{ outputs.query_rds_iops_telemetry.vars.provisioned_iops }}* provisioned IOPS, but utilized only *{{ outputs.query_rds_iops_telemetry.vars.util_pct }}%* on average over the last 24 hours! Recommendation: Downscale provisioned IOPS (or switch to gp3 storage) to save hundreds of dollars monthly without impacting database performance.",
                "footer": "Kestra FinOps Sentinel • AWS RDS"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#finops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ AWS RDS Provisioned Storage IOPS Utilization Sentinel Pipeline Failure",
            "text": "Failed to query RDS IOPS metrics via AWS CLI. Check instance identifier and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors AWS RDS Read/Write IOPS CloudWatch metrics against provisioned IOPS to detect overprovisioned storage spend."
  metaTitle: AWS RDS Provisioned Storage IOPS Utilization Sentinel with Kestra
  title: AWS RDS Provisioned Storage IOPS Utilization Sentinel
  shortDescription: Monitors AWS RDS Read/Write IOPS CloudWatch metrics against provisioned IOPS to detect overprovisioned storage spend.
  description: |
    ## How it works
    This workflow queries `aws rds describe-db-instances` to inspect the provisioned IOPS allocated to the database, and aggregates `ReadIOPS` and `WriteIOPS` from CloudWatch over a 24-hour evaluation period. In AWS RDS, provisioned IOPS (io1/io2 storage) costs significant recurring cloud spend ($0.10+ per provisioned IOPS-month). When average utilization is below 25%, workloads are overprovisioned and can safely downscale or migrate to `gp3`. Slack is alerted with right-sizing recommendations.

    ## What you get
    - Continuous FinOps audit of AWS RDS provisioned IOPS utilization.
    - Prevents cloud budget waste from idle provisioned database throughput.
    - Actionable recommendations with exact consumed and provisioned IOPS metrics.

    ## Who it's for
    - FinOps Practitioners and Cloud Cost Optimization Engineers.
    - SREs and Database Administrators managing AWS RDS fleets.

    ## Why orchestrate this with Kestra
    - **Native AWS CLI Automation**: Correlates configuration metadata with live CloudWatch telemetry.
    - **Continuous Rightsizing**: Identify waste automatically without third-party SaaS tools.
    - **Actionable Notifications**: Formatted Slack reports with concrete cost-reduction steps.

    ## Prerequisites
    - AWS IAM credentials with `rds:DescribeDBInstances` and `cloudwatch:GetMetricData`.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure DB instance identifier and region.
    3. Run the workflow to inspect RDS IOPS utilization.

    ## How to extend
    - Automatically generate Terraform/CloudFormation PRs to update storage types to gp3.
    - Expand audit across all RDS databases in an account dynamically.

    ## Links
    - [AWS RDS Provisioned IOPS Storage Documentation](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html#USER_PIOPS)
    - [Kestra AWS CLI Plugin](https://kestra.io/plugins/plugin-aws/io.kestra.plugin.aws.cli.awscli)
  tags:
    - Cloud
    - Business
  subTags:
    - AWS Services
    - Infrastructure Automation
  ee: false
  demo: false
