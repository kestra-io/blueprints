id: milvus-memory-mmap-cache-utilization-sentinel
namespace: company.ai

description: |
  Audits Milvus QueryNode memory and mmap cache utilization via Prometheus, detects saturation before OOM kills, and alerts MLOps teams via Slack.

concurrency:
  limit: 1

inputs:
  - id: prometheus_endpoint
    type: STRING
    displayName: Prometheus Endpoint URL
    defaults: "http://prometheus.monitoring:9090"
    description: Base HTTP URL of the Prometheus server scraping Milvus cluster metrics.

  - id: cluster_identifier
    type: STRING
    displayName: Milvus Cluster Name
    defaults: "milvus-production"
    description: Cluster identifier label utilized within Prometheus metrics queries.

  - id: max_memory_utilization_pct
    type: FLOAT
    displayName: Max Memory Utilization (%)
    defaults: 85.0
    description: Upper percentage threshold of QueryNode memory capacity before triggering saturation alerts.

  - id: alert_on_saturation
    type: BOOL
    displayName: Alert On Saturation
    defaults: true
    description: Toggle whether Slack webhook alerts are dispatched upon detecting memory saturation.

tasks:
  - id: scan_milvus_memory_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates operational APIs and emits structured metric diagnostics via Kestra outputs.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      PROMETHEUS_ENDPOINT: "{{ inputs.prometheus_endpoint }}"
      CLUSTER_NAME: "{{ inputs.cluster_identifier }}"
      MAX_UTILIZATION_PCT: "{{ inputs.max_memory_utilization_pct }}"
    script: |
      import os
      import sys
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      prom_url = os.environ.get("PROMETHEUS_ENDPOINT", "http://prometheus.monitoring:9090").rstrip("/")
      cluster = os.environ.get("CLUSTER_NAME", "milvus-production").strip()
      max_pct = float(os.environ.get("MAX_UTILIZATION_PCT", "85.0"))

      query_used = f"sum(milvus_querynode_memory_used_bytes{{cluster='{cluster}'}})/1073741824"
      query_total = f"sum(milvus_querynode_memory_total_bytes{{cluster='{cluster}'}})/1073741824"
      query_mmap = f"sum(milvus_querynode_mmap_allocated_bytes{{cluster='{cluster}'}})/1073741824"

      used_gb = 0.0
      total_gb = 0.0
      mmap_gb = 0.0
      utilization_pct = 0.0

      try:
          print(f"Scraping Milvus metrics from Prometheus at {prom_url}...")
          r_used = requests.get(f"{prom_url}/api/v1/query", params={"query": query_used}, timeout=15)
          r_used.raise_for_status()
          data_used = r_used.json()

          r_total = requests.get(f"{prom_url}/api/v1/query", params={"query": query_total}, timeout=15)
          r_total.raise_for_status()
          data_total = r_total.json()

          r_mmap = requests.get(f"{prom_url}/api/v1/query", params={"query": query_mmap}, timeout=15)
          r_mmap.raise_for_status()
          data_mmap = r_mmap.json()

          val_used = float(data_used["data"]["result"][0]["value"][1])
          val_total = float(data_total["data"]["result"][0]["value"][1])
          val_mmap = float(data_mmap["data"]["result"][0]["value"][1]) if data_mmap.get("data", {}).get("result") else 0.0

          used_gb = round(val_used, 2)
          total_gb = round(val_total, 2)
          mmap_gb = round(val_mmap, 2)
          if total_gb > 0:
              utilization_pct = round((used_gb / total_gb) * 100.0, 2)
      except Exception as e:
          print(f"ERROR: Failed to query Milvus memory metrics from Prometheus: {e}", file=sys.stderr)
          sys.exit(1)

      is_alerting = utilization_pct >= max_pct

      print(f"Milvus Memory: Used={used_gb}GB, Total={total_gb}GB, Util={utilization_pct}%, Alert={is_alerting}")

      Kestra.outputs({
          "used_memory_gb": used_gb,
          "total_memory_gb": total_gb,
          "mmap_allocated_gb": mmap_gb,
          "memory_utilization_pct": utilization_pct,
          "is_alerting": is_alerting,
          "audit_timestamp": datetime.now(timezone.utc).isoformat()
      })

  - id: check_memory_saturation
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether audited operational metrics breached configured tolerance thresholds.
    condition: "{{ outputs.scan_milvus_memory_metrics.vars.is_alerting and inputs.alert_on_saturation }}"
    then:
      - id: notify_slack_mlops_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority operational incident alert to designated Slack webhook channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#mlops-alerts",
            "username": "Milvus-Memory-Sentinel",
            "text": "CRITICAL: Milvus QueryNode memory utilization breached threshold at `{{ outputs.scan_milvus_memory_metrics.vars.memory_utilization_pct }}%` (Threshold: `{{ inputs.max_memory_utilization_pct }}%`)! Total Memory Used: `{{ outputs.scan_milvus_memory_metrics.vars.used_memory_gb }}GB`/`{{ outputs.scan_milvus_memory_metrics.vars.total_memory_gb }}GB`. Mmap Cache Used: `{{ outputs.scan_milvus_memory_metrics.vars.mmap_allocated_gb }}GB`. Risk of QueryNode OOM termination."
          }
    else:
      - id: log_nominal_memory_state
        type: io.kestra.plugin.core.log.Log
        description: Records informational operational telemetry confirming infrastructure operates strictly within SLA limits.
        message: "Milvus QueryNode memory nominal on cluster {{ inputs.cluster_identifier }}: {{ outputs.scan_milvus_memory_metrics.vars.used_memory_gb }}GB / {{ outputs.scan_milvus_memory_metrics.vars.total_memory_gb }}GB ({{ outputs.scan_milvus_memory_metrics.vars.memory_utilization_pct }}%)."

  - id: export_milvus_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured compliance manifest detailing operational metrics for SIEM or analytics ingestion.
    format:
      used_memory_gb: "{{ outputs.scan_milvus_memory_metrics.vars.used_memory_gb }}"
      total_memory_gb: "{{ outputs.scan_milvus_memory_metrics.vars.total_memory_gb }}"
      memory_utilization_pct: "{{ outputs.scan_milvus_memory_metrics.vars.memory_utilization_pct }}"
      is_alerting: "{{ outputs.scan_milvus_memory_metrics.vars.is_alerting }}"
      audit_timestamp: "{{ outputs.scan_milvus_memory_metrics.vars.audit_timestamp }}"

outputs:
  - id: used_memory_gb
    type: NUMBER
    value: "{{ outputs.scan_milvus_memory_metrics.vars.used_memory_gb }}"
  - id: total_memory_gb
    type: NUMBER
    value: "{{ outputs.scan_milvus_memory_metrics.vars.total_memory_gb }}"
  - id: memory_utilization_pct
    type: NUMBER
    value: "{{ outputs.scan_milvus_memory_metrics.vars.memory_utilization_pct }}"
  - id: is_alerting
    type: BOOLEAN
    value: "{{ outputs.scan_milvus_memory_metrics.vars.is_alerting }}"

triggers:
  - id: periodic_memory_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated scheduled trigger inspecting operational health on a recurring interval.
    cron: "*/15 * * * *"

extend:
  title: Milvus Memory and Mmap Cache Utilization Sentinel
  metaTitle: Milvus Memory and Mmap Cache Utilization Sentinel Blueprint
  shortDescription: Audits Milvus QueryNode memory and mmap cache utilization via Prometheus to detect saturation.
  metaDescription: Audits Milvus QueryNode memory and mmap cache utilization via Prometheus, detects saturation before OOM kills, and alerts MLOps teams via Slack.
  description: |
    Audits Milvus QueryNode memory and mmap cache utilization via Prometheus, detects saturation before OOM kills, and alerts MLOps teams via Slack.
  tags:
    - AI
    - Data
