id: arangodb-replication-applier-lag-and-rocksdb-stall-guard
namespace: company.sentinel
description: Audits ArangoDB multi-model cluster replication applier states and RocksDB engine write stalls to prevent follower desynchronization and query timeout.
inputs:
  - id: arangodb_url
    type: STRING
    defaults: http://arangodb.internal:8529
  - id: target_database
    type: STRING
    defaults: _system
  - id: max_write_stalls_threshold
    type: INT
    defaults: 10
tasks:
  - id: probe_arangodb_replication
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_HEADER=""
        if [ -n "{{ secret('ARANGODB_PASSWORD') }}" ]; then
          AUTH_HEADER="-u root:{{ secret('ARANGODB_PASSWORD') }}"
        fi

        curl -sf -m 10 $AUTH_HEADER "{{ inputs.arangodb_url }}/_db/{{ inputs.target_database }}/_api/replication/applier-state" > /tmp/arango_applier.json 2>/dev/null || echo "{}" > /tmp/arango_applier.json
        curl -sf -m 10 $AUTH_HEADER "{{ inputs.arangodb_url }}/_admin/metrics" > /tmp/arango_metrics.txt 2>/dev/null || echo "" > /tmp/arango_metrics.txt

        python3 - <<'PY' > /tmp/arangodb_health.json
        import os, sys, json

        applier_data = {}
        try:
            with open("/tmp/arango_applier.json", "r") as f:
                applier_data = json.load(f)
        except Exception:
            applier_data = {}

        metrics = {}
        try:
            with open("/tmp/arango_metrics.txt", "r") as f:
                for line in f:
                    line = line.strip()
                    if line and not line.startswith("#"):
                        parts = line.split()
                        if len(parts) >= 2:
                            try:
                                metrics[parts[0]] = float(parts[1])
                            except ValueError:
                                pass
        except Exception:
            pass

        state = applier_data.get("state", {})
        running = state.get("running", True)
        last_error = state.get("lastError", {}).get("errorNum", 0)
        write_stalls = int(metrics.get("arangodb_rocksdb_write_stalls", 0))

        res = {
            "applier_running": running,
            "last_error_num": last_error,
            "rocksdb_write_stalls": write_stalls,
            "progress_message": state.get("progress", {}).get("message", "OK")
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/arangodb_health.json"

  - id: evaluate_replication_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_arangodb_replication.outputFiles['/tmp/arangodb_health.json'])).applier_running == false or fromJson(read(outputs.probe_arangodb_replication.outputFiles['/tmp/arangodb_health.json'])).rocksdb_write_stalls > inputs.max_write_stalls_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *ArangoDB Replication & RocksDB Engine Alert*
          *Cluster Endpoint:* `{{ inputs.arangodb_url }}` (DB: `{{ inputs.target_database }}`)
          *Replication Running:* `{{ fromJson(read(outputs.probe_arangodb_replication.outputFiles['/tmp/arangodb_health.json'])).applier_running ? 'YES' : 'STOPPED' }}`
          *Last Error Code:* `{{ fromJson(read(outputs.probe_arangodb_replication.outputFiles['/tmp/arangodb_health.json'])).last_error_num }}`
          *RocksDB Write Stalls:* `{{ fromJson(read(outputs.probe_arangodb_replication.outputFiles['/tmp/arangodb_health.json'])).rocksdb_write_stalls }}` (Threshold: `{{ inputs.max_write_stalls_threshold }}`)
          *Progress Message:* `{{ fromJson(read(outputs.probe_arangodb_replication.outputFiles['/tmp/arangodb_health.json'])).progress_message }}`
          *Action Required:* Check follower replication connectivity or inspect RocksDB memtable flushing capacity to resolve ingestion backpressure.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "ArangoDB audit completed for {{ inputs.arangodb_url }}. Replication running: {{ fromJson(read(outputs.probe_arangodb_replication.outputFiles['/tmp/arangodb_health.json'])).applier_running }}, Write stalls: {{ fromJson(read(outputs.probe_arangodb_replication.outputFiles['/tmp/arangodb_health.json'])).rocksdb_write_stalls }}."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: ArangoDB Health Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach ArangoDB REST API at `{{ inputs.arangodb_url }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: ArangoDB Replication Applier Lag and RocksDB Write Stall Guard
  metaTitle: ArangoDB Replication Applier Guard | Kestra
  shortDescription: Audits ArangoDB multi-model cluster replication applier states and RocksDB engine write stalls to prevent follower desync.
  metaDescription: Audits ArangoDB multi-model cluster replication applier states and RocksDB engine write stalls to prevent follower desynchronization and query timeout.
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits ArangoDB multi-model database clusters for replication applier halts, write stall cascades, and RocksDB storage engine backpressure.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the cluster replication audit.
    2. Probes ArangoDB HTTP replication and metrics endpoints (`/_api/replication/applier-state` and `/_admin/metrics`).
    3. Python parser analyzes whether replication applier daemon is actively synchronizing and counts accumulated RocksDB write stalls.
    4. An `io.kestra.plugin.core.flow.If` condition checks if replication has halted or if RocksDB engine write stalls exceed tolerance limits.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and authentication errors.

    ## What you get

    - Early detection of stopped replication followers before data divergence or split-brain read skew occurs.
    - Visibility into RocksDB memtable saturation that triggers write stalls and spikes API latencies.
    - Automated execution audit trail recorded in Kestra execution artifacts for database compliance.

    ## Who it's for

    - Database Administrators and SREs maintaining production ArangoDB multi-model clusters.
    - Platform Engineers operating graph, document, and search workloads across distributed database instances.

    ## Why orchestrate this with Kestra

    - Declarative replication monitoring without deploying external monitoring daemons.
    - Centralized secret management for administrative database passwords via `{{ secret('ARANGODB_PASSWORD') }}`.
    - Unified alerting and automated remediation pipeline integration in declarative YAML workflows.

    ## Prerequisites

    - Network route from the Kestra worker to the ArangoDB HTTP port 8529.
    - Administrative credentials configured in Kestra secrets (if authentication is enabled).

    ### Secrets

    - `ARANGODB_PASSWORD`: Optional authentication password for secured ArangoDB instances.
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.arangodb_url` and `inputs.target_database` to match your cluster endpoint.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual test run to verify telemetry collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated replication applier restart commands inside the `then` branch.
    - Forward historical write stall metrics to Prometheus or Grafana.
    - Integrate with PagerDuty for critical replication desynchronization events.

    ## Links

    - [ArangoDB Replication API Documentation](https://docs.arangodb.com/latest/develop/http-api/replication/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
