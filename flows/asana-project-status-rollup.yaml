id: asana-project-status-rollup
namespace: company.team

description: |
  Project status meetings still open with someone reading Asana out loud while
  the overdue column has been growing in silence, so this flow turns the task
  list into a rollup that escalates itself. A keyed webhook accepts a rollup
  request and a disabled Friday schedule stands ready as the weekly net; an
  HTTP step pulls tasks with a bearer token and a local tasks.json fixture
  stands in when the API is unreachable. A python step groups every task by
  project and counts overdue, due soon and completion percent per project,
  then the gate emails the stakeholder digest and posts the Slack summary
  whenever anything is overdue and records a clean verdict when nothing is.
  Every run also loops the projects writing one status.md line each and
  publishes the verdict, the project rollup and both totals as typed outputs.

triggers:
  - id: rollup_requested
    type: io.kestra.plugin.core.trigger.Webhook
    description: Program management POSTs here when a fresh Asana rollup is needed between the weekly runs, for example right before a steering review.
    key: "{{ secret('ASANA_ROLLUP_WEBHOOK_KEY') }}"
  - id: weekly_friday_rollup
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled Friday morning sweep that rolls up every tracked project each week until an operator switches it on.
    cron: "0 6 * * 5"
    disabled: true

inputs:
  - id: due_soon_days
    type: INT
    defaults: 7
    description: Horizon in days ahead of today within which an open task counts as due soon instead of safely scheduled.
  - id: completed_target_pct
    type: INT
    defaults: 60
    description: Completion percent at or above which a project counts as on pace, anything lower is flagged under target in the digest.

tasks:
  # --- 1. rollup workspace ---
  - id: rollup_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the tasks fixture, the Asana response and the rollup script all read the same files for the whole run.
    tasks:
      # --- 2. task fixture ---
      - id: write_tasks_fixture
        type: io.kestra.plugin.scripts.shell.Commands
        description: Writes tasks.json from a heredoc of twelve tasks across two projects dated forward and back from today, four of them overdue, three due within the seven day horizon and the rest completed or safely scheduled.
        commands:
          - |
            set -eu
            cat > tasks.json <<TASKS_EOF
            {"gid": "1101", "name": "Sitemap sign-off", "due_on": "$(date -d "-12 days" +%F)", "completed": false, "projects": [{"gid": "1201", "name": "Website Relaunch"}]}
            {"gid": "1102", "name": "Hero copy draft", "due_on": "$(date -d "-5 days" +%F)", "completed": false, "projects": [{"gid": "1201", "name": "Website Relaunch"}]}
            {"gid": "1103", "name": "Accessibility audit", "due_on": "$(date -d "+3 days" +%F)", "completed": false, "projects": [{"gid": "1201", "name": "Website Relaunch"}]}
            {"gid": "1104", "name": "Launch checklist", "due_on": "$(date -d "+6 days" +%F)", "completed": false, "projects": [{"gid": "1201", "name": "Website Relaunch"}]}
            {"gid": "1105", "name": "Wireframe set", "due_on": "$(date -d "-20 days" +%F)", "completed": true, "projects": [{"gid": "1201", "name": "Website Relaunch"}]}
            {"gid": "1106", "name": "Content inventory", "due_on": "$(date -d "+35 days" +%F)", "completed": true, "projects": [{"gid": "1201", "name": "Website Relaunch"}]}
            {"gid": "1107", "name": "Schema freeze", "due_on": "$(date -d "-9 days" +%F)", "completed": false, "projects": [{"gid": "1202", "name": "Data Platform Migration"}]}
            {"gid": "1108", "name": "Backfill dry run", "due_on": "$(date -d "-2 days" +%F)", "completed": false, "projects": [{"gid": "1202", "name": "Data Platform Migration"}]}
            {"gid": "1109", "name": "CDC cutover rehearsal", "due_on": "$(date -d "+5 days" +%F)", "completed": false, "projects": [{"gid": "1202", "name": "Data Platform Migration"}]}
            {"gid": "1110", "name": "Runbook draft", "due_on": "$(date -d "+40 days" +%F)", "completed": false, "projects": [{"gid": "1202", "name": "Data Platform Migration"}]}
            {"gid": "1111", "name": "Vendor contract", "due_on": "$(date -d "-30 days" +%F)", "completed": true, "projects": [{"gid": "1202", "name": "Data Platform Migration"}]}
            {"gid": "1112", "name": "Cluster capacity test", "due_on": "$(date -d "+18 days" +%F)", "completed": false, "projects": [{"gid": "1202", "name": "Data Platform Migration"}]}
            TASKS_EOF
            echo "task rows $(grep -c '"due_on"' tasks.json)"

      # --- 3. asana task fetch ---
      - id: fetch_asana_tasks
        type: io.kestra.plugin.core.http.Request
        description: GET the Asana task list with a bearer token and absorb a non 2xx answer, so an API outage hands the rollup to the fixture instead of failing the status run.
        method: GET
        uri: "https://app.asana.com/api/1.0/tasks?limit=100&opt_fields=name,due_on,completed,projects.name,projects.gid"
        headers:
          Accept: application/json
          Authorization: "Bearer {{ secret('ASANA_TOKEN') }}"
        options:
          allowFailed: true
          followRedirects: true
        timeout: PT30S

      # --- 4. per project rollup ---
      - id: rollup_projects
        type: io.kestra.plugin.scripts.python.Script
        description: Read the Asana response or the fixture, group every task by project and count overdue, due soon and completion percent per project, then emit verdict, projects, overdue_total and due_soon_total through the outputs protocol.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          DUE_SOON_DAYS: "{{ inputs.due_soon_days }}"
          COMPLETED_TARGET_PCT: "{{ inputs.completed_target_pct }}"
          ASANA_BODY: "{{ (outputs.fetch_asana_tasks.body ?? '') | json }}"
        script: |
          import json
          import os
          from datetime import date, datetime

          FIXTURE = "tasks.json"


          def as_int(value, fallback):
              try:
                  return int(str(value).strip())
              except (TypeError, ValueError):
                  return fallback


          def loads_payload(raw):
              text = str(raw or "").strip()
              if not text:
                  return None
              try:
                  parsed = json.loads(text)
              except ValueError:
                  return None
              if isinstance(parsed, str):
                  try:
                      parsed = json.loads(parsed)
                  except ValueError:
                      return None
              return parsed if isinstance(parsed, (dict, list)) else None


          def extract_tasks(document):
              if isinstance(document, dict):
                  rows = document.get("data") or document.get("tasks")
              elif isinstance(document, list):
                  rows = document
              else:
                  rows = None
              if not isinstance(rows, list):
                  return None
              tasks = []
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  name = str(row.get("name") or "").strip()
                  if not name:
                      continue
                  due_raw = str(row.get("due_on") or "").strip()
                  try:
                      due = datetime.strptime(due_raw, "%Y-%m-%d").date() if due_raw else None
                  except ValueError:
                      due = None
                  project_names = []
                  for entry in row.get("projects") or []:
                      pname = str(entry.get("name") or "").strip() if isinstance(entry, dict) else str(entry or "").strip()
                      if pname:
                          project_names.append(pname)
                  tasks.append({"name": name, "completed": bool(row.get("completed")),
                                "due": due, "projects": project_names or ["Unassigned"]})
              return tasks or None


          due_soon_days = as_int(os.environ.get("DUE_SOON_DAYS"), 7)
          completed_target_pct = as_int(os.environ.get("COMPLETED_TARGET_PCT"), 60)

          document = loads_payload(os.environ.get("ASANA_BODY"))
          tasks = extract_tasks(document)
          source = "asana_api" if tasks else "fixture"

          if not tasks:
              fixture_text = ""
              try:
                  with open(FIXTURE, "r", encoding="utf-8") as handle:
                      fixture_text = handle.read()
              except OSError:
                  pass
              tasks = extract_tasks(loads_payload(fixture_text))
              source = "fixture" if tasks else "none"

          if not tasks:
              print("no Asana task could be read from the response or the fixture")
              print("::" + json.dumps({"outputs": {"verdict": "NO_TASK_DATA", "projects": [],
                                                   "overdue_total": 0, "due_soon_total": 0}}) + "::")
              raise SystemExit(0)

          today = date.today()
          rollup = {}
          overdue_total = 0
          due_soon_total = 0

          for task in tasks:
              for project in task["projects"]:
                  entry = rollup.setdefault(project, {"project": project, "total": 0, "open": 0,
                                                      "overdue": 0, "due_soon": 0, "completed": 0,
                                                      "overdue_names": [], "due_soon_names": []})
                  entry["total"] += 1
                  if task["completed"]:
                      entry["completed"] += 1
                      continue
                  entry["open"] += 1
                  due = task["due"]
                  if due is None:
                      continue
                  days_left = (due - today).days
                  if days_left < 0:
                      entry["overdue"] += 1
                      entry["overdue_names"].append(task["name"])
                      overdue_total += 1
                  elif days_left <= due_soon_days:
                      entry["due_soon"] += 1
                      entry["due_soon_names"].append(task["name"])
                      due_soon_total += 1

          for entry in rollup.values():
              entry["completed_pct"] = round(100.0 * entry["completed"] / entry["total"], 1) if entry["total"] else 0.0
              entry["under_target"] = entry["completed_pct"] < completed_target_pct
          projects = [rollup[name] for name in sorted(rollup)]

          if overdue_total > 0:
              verdict = "ACTION_REQUIRED"
          elif due_soon_total > 0:
              verdict = "DUE_SOON_WATCH"
          else:
              verdict = "ALL_ON_TRACK"

          print("source=%s tasks=%d projects=%d overdue=%d due_soon=%d target=%d verdict=%s" % (
              source, len(tasks), len(projects), overdue_total, due_soon_total,
              completed_target_pct, verdict))
          print("::" + json.dumps({"outputs": {"verdict": verdict, "projects": projects,
                                               "overdue_total": overdue_total,
                                               "due_soon_total": due_soon_total}}) + "::")

  # --- 5. overdue gate ---
  - id: overdue_gate
    type: io.kestra.plugin.core.flow.If
    description: Branches on the overdue total so a portfolio carrying late tasks emails the stakeholder digest and posts the Slack summary, while a clean portfolio is recorded without waking anyone.
    condition: "{{ outputs.rollup_projects.vars.overdue_total > 0 }}"
    then:
      - id: send_status_digest
        type: io.kestra.plugin.email.MailSend
        description: Emails the stakeholder group the overdue and due soon totals with one row per project and the overdue task names, so the digest lands before anyone opens Asana for the meeting.
        from: "{{ secret('SMTP_FROM') }}"
        to: "{{ secret('STATUS_STAKEHOLDERS') }}"
        host: "{{ secret('SMTP_HOST') }}"
        username: "{{ secret('SMTP_USERNAME') }}"
        password: "{{ secret('SMTP_PASSWORD') }}"
        port: 465
        subject: "Asana status rollup - {{ outputs.rollup_projects.vars.overdue_total }} overdue across {{ outputs.rollup_projects.vars.projects | length }} project(s)"
        htmlTextContent: |
          <p>Stakeholders,</p>
          <p>The Asana rollup reports <strong>{{ outputs.rollup_projects.vars.overdue_total }}</strong>
          overdue task(s) and <strong>{{ outputs.rollup_projects.vars.due_soon_total }}</strong> task(s)
          due within {{ inputs.due_soon_days }} day(s). Verdict
          <strong>{{ outputs.rollup_projects.vars.verdict }}</strong>.</p>
          <table border="1" cellpadding="4">
            <tr><th>Project</th><th>Total</th><th>Open</th><th>Overdue</th><th>Due soon</th><th>Completed</th><th>Completed %</th></tr>
            {% for p in outputs.rollup_projects.vars.projects %}
            <tr><td>{{ p.project }}</td><td>{{ p.total }}</td><td>{{ p.open }}</td><td>{{ p.overdue }}</td><td>{{ p.due_soon }}</td><td>{{ p.completed }}</td><td>{{ p.completed_pct }}</td></tr>
            {% endfor %}
          </table>
          <p>Overdue work: {% for p in outputs.rollup_projects.vars.projects %}{% for n in p.overdue_names %}{{ p.project }} / {{ n }}; {% endfor %}{% endfor %}</p>
          <p>Reassign, extend the due dates or clear the blockers before the next review. Execution {{ execution.id }}</p>
      - id: alert_rollup_summary
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Posts one channel summary led by the overdue total, with the due soon total and each project's overdue, due soon and completion percent figures.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Asana status rollup - verdict {{ outputs.rollup_projects.vars.verdict }}, {{ outputs.rollup_projects.vars.overdue_total }} overdue, {{ outputs.rollup_projects.vars.due_soon_total }} due within {{ inputs.due_soon_days }} day(s). {% for p in outputs.rollup_projects.vars.projects %}{{ p.project }}: {{ p.overdue }} overdue / {{ p.due_soon }} due soon / {{ p.completed_pct }}% complete. {% endfor %}Stakeholders emailed. Execution {{ execution.id }}."
          }
    else:
      - id: log_all_on_track
        type: io.kestra.plugin.core.log.Log
        description: Records the clean verdict in execution history so a run with nothing overdue still leaves evidence that the rollup was checked.
        message: "Asana rollup - verdict {{ outputs.rollup_projects.vars.verdict }}, overdue_total {{ outputs.rollup_projects.vars.overdue_total }}, due_soon_total {{ outputs.rollup_projects.vars.due_soon_total }}, no escalation sent."

  # --- 6. status file ---
  - id: write_status_lines
    type: io.kestra.plugin.core.flow.Loop
    description: Walks the rolled up projects one at a time and appends one markdown table row per project to status.md, so every run leaves a shareable status file behind.
    values: "{{ outputs.rollup_projects.vars.projects }}"
    concurrencyLimit: 1
    tasks:
      - id: append_status_line
        type: io.kestra.plugin.scripts.shell.Commands
        description: Appends the current project's name, overdue count, due soon count and completion percent as one markdown table row in status.md.
        commands:
          - |
            set -u
            echo "| {{ item.value.project }} | {{ item.value.overdue }} | {{ item.value.due_soon }} | {{ item.value.completed_pct }} |" >> status.md
            echo "status line appended for {{ item.value.project }}"

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    description: One of ACTION_REQUIRED, DUE_SOON_WATCH, ALL_ON_TRACK or NO_TASK_DATA depending on the overdue and due soon totals.
    value: "{{ outputs.rollup_projects.vars.verdict }}"
  - id: projects
    type: ARRAY
    description: 'Per project rollup entries as objects, for example [{"project": "Website Relaunch", "total": 6, "open": 4, "overdue": 2, "due_soon": 2, "completed": 2, "completed_pct": 33.3, "under_target": true, "overdue_names": ["Sitemap sign-off", "Hero copy draft"], "due_soon_names": ["Accessibility audit", "Launch checklist"]}].'
    value: "{{ outputs.rollup_projects.vars.projects | toJson }}"
  - id: overdue_total
    type: INT
    description: Number of open tasks dated before today across every project, for example 4 against the bundled twelve task fixture.
    value: "{{ outputs.rollup_projects.vars.overdue_total }}"
  - id: due_soon_total
    type: INT
    description: Number of open tasks due within due_soon_days across every project, for example 3 against the bundled twelve task fixture.
    value: "{{ outputs.rollup_projects.vars.due_soon_total }}"

extend:
  title: Roll Up Asana Project Status and Escalate the Overdue Work
  metaTitle: Asana Project Status Rollup With Overdue Escalation
  shortDescription: Pull Asana tasks, roll overdue, due soon and completion percent up per project, then escalate to stakeholders and Slack when anything is late.
  metaDescription: Pulls Asana project tasks, rolls overdue, due soon and completion percent up per project, then emails stakeholders and pings Slack when anything is overdue.
  description: |
    A project portfolio only looks healthy in a status meeting because nobody summed the overdue column first. This flow does that sum on every run, so late work surfaces with a digest and a channel alert instead of a surprise.

    ## How it works

    1. `rollup_requested` (`io.kestra.plugin.core.trigger.Webhook`, keyed with the `ASANA_ROLLUP_WEBHOOK_KEY` secret) accepts a POST when a rollup is needed between the weekly runs. `weekly_friday_rollup` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * 5`) is the Friday morning net and ships `disabled: true` until an operator turns it on.
    2. `rollup_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared filesystem so the fixture, the API response and the analysis all see the same files.
    3. `write_tasks_fixture` (`io.kestra.plugin.scripts.shell.Commands`) writes `tasks.json` through a heredoc of twelve tasks across two projects, dated forward and back from today with `date -d`. Four tasks are overdue, three fall inside the seven day horizon and the rest are completed or safely scheduled.
    4. `fetch_asana_tasks` (`io.kestra.plugin.core.http.Request`) GETs `https://app.asana.com/api/1.0/tasks` with `Authorization: Bearer {{ secret('ASANA_TOKEN') }}`, and `options.allowFailed` lets a 4xx or 5xx answer through so the rollup continues on the fixture instead of dying.
    5. `rollup_projects` (`io.kestra.plugin.scripts.python.Script`) prefers the `data` array from the Asana response and falls back to `tasks.json` when the body is missing or unparseable. Every task is grouped by project, overdue counts open tasks dated before today, due soon counts open tasks dated within `due_soon_days`, and completion percent is completed divided by total for the project with `under_target` set against `completed_target_pct`. It prints `verdict`, `projects`, `overdue_total` and `due_soon_total` as a single `::{"outputs": ...}::` line and reports `NO_TASK_DATA` when neither source yields a task.
    6. `overdue_gate` (`io.kestra.plugin.core.flow.If`) branches on `overdue_total > 0`. Above zero, `send_status_digest` (`io.kestra.plugin.email.MailSend`) emails the stakeholder group the totals, a table row per project and the overdue task names, and `alert_rollup_summary` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts the channel summary. At zero, `log_all_on_track` records why nothing was sent.
    7. `write_status_lines` (`io.kestra.plugin.core.flow.Loop`) walks the rolled up projects and `append_status_line` (`io.kestra.plugin.scripts.shell.Commands`) appends one markdown table row per project to `status.md`, so every run leaves a file that can be pasted into the status page.
    8. The flow level `errors` handler (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) reports any failure with the execution id, because a rollup that dies silently looks exactly like a clean portfolio.

    ## What you get

    - A per project rollup with total, open, overdue, due soon, completed, completion percent, under target flag and the overdue and due soon task names, plus portfolio totals as branchable outputs.
    - One stakeholder digest email and one Slack summary when anything is overdue, a quiet log line when nothing is, and a `status.md` table on every run. When the Asana API is unreachable the bundled twelve task fixture produces the same rollup shape.

    ## Who it's for

    - Program and project managers who own a portfolio of Asana projects and need the overdue count before the status meeting, not during it.
    - Delivery leads who want late work escalated to stakeholders on a schedule instead of discovered in a spreadsheet.

    ## Why orchestrate this with Kestra

    Reading Asana in a meeting is a report; scheduling a script that emails a summary is still a report with a calendar habit. Kestra gives the rollup a keyed webhook and a disabled Friday schedule, an HTTP call that degrades to a fixture instead of failing, a python pass that turns raw tasks into per project counts, a branch that separates an overdue portfolio from a clean one, and a loop that leaves a status file behind. The verdict and the totals are typed outputs, so a portfolio dashboard or an approval flow can read the state without scraping logs, and the `errors` handler keeps a broken run visible.

    ## Prerequisites

    - A worker with a shell and Python 3 plus GNU `date`, the calculation uses only `json`, `os` and `datetime`.
    - An Asana personal access token that can read tasks in the tracked projects, a stub of the tasks endpoint while you trial the flow, an SMTP relay for the stakeholder digest and a Slack incoming webhook for the summary and failure alerts.

    ### Secrets

    - `ASANA_ROLLUP_WEBHOOK_KEY`: key segment guarding the rollup webhook URL, anyone holding it can start a run.
    - `ASANA_TOKEN`: bearer token sent to the Asana tasks endpoint.
    - `SMTP_HOST`, `SMTP_USERNAME`, `SMTP_PASSWORD`, `SMTP_FROM`: relay settings used by `send_status_digest`.
    - `STATUS_STAKEHOLDERS`: recipient list that receives the stakeholder digest email.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for the rollup summary and for failure alerts.

    ## Quick start

    1. Add the eight secrets to your Kestra namespace and import the flow.
    2. Run once with the default inputs and confirm `verdict` reads `ACTION_REQUIRED`, `overdue_total` reads 4, `due_soon_total` reads 3 and `projects` lists Website Relaunch at 33.3 percent and Data Platform Migration at 16.7 percent. The gate emails the digest, posts the Slack summary and appends two rows to `status.md`.
    3. Raise `completed_target_pct` to 90 to watch every project flip `under_target` to true, or empty the heredoc rows inside `write_tasks_fixture` to see `NO_TASK_DATA` recorded by the quiet branch.
    4. Trigger `rollup_requested` at `/api/v1/{tenant}/executions/webhook/{namespace}/asana-project-status-rollup/{ASANA_ROLLUP_WEBHOOK_KEY}`, then enable `weekly_friday_rollup` once the Asana token is in place.

    ## How to extend

    - Scope the HTTP call to your workspace by adding the workspace gid to the query and swapping the heredoc for a `io.kestra.plugin.jdbc.postgresql.Queries` snapshot of tracked project gids.
    - Fan the digest out per project with a second `io.kestra.plugin.core.flow.Loop` that sends one email per project owner, escalate a project that stays overdue across three runs with a `io.kestra.plugin.github.issues.Create` rollup issue inside `overdue_gate`, or ship `projects` for trend reporting with `io.kestra.plugin.aws.s3.Upload`.

    ## Links

    - [Kestra Schedule trigger](https://kestra.io/docs/concepts/triggers)
    - [Kestra HTTP request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra email and Slack plugins](https://kestra.io/plugins)
  tags:
    - Business
  subTags:
    - asana
    - project-management
    - status-reporting
    - overdue-tasks
  ee: false
  demo: false
