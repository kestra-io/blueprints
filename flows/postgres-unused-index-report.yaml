id: postgres-unused-index-report
namespace: company.team
description: |
  Find Postgres indexes with zero scans since last stats reset and post the
  list to Slack, so dead indexes stop taxing every write.

inputs:
  - id: jdbc_url
    type: STRING
    defaults: "jdbc:postgresql://localhost:5432/app"
    description: JDBC URL for the target database.

tasks:
  - id: find_unused
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ inputs.jdbc_url }}"
    password: "{{ secret('PG_PASSWORD') }}"
    sql: |
      SELECT indexrelname 
      FROM pg_stat_user_indexes ui 
      JOIN pg_index i ON i.indexrelid = ui.indexrelid 
      WHERE ui.idx_scan = 0 
        AND NOT i.indisprimary 
        AND NOT i.indisunique 
        AND ui.schemaname NOT IN ('pg_catalog','information_schema');
    fetchType: FETCH

  - id: unused_found
    type: io.kestra.plugin.core.flow.If
    description: Only alert when something is unused; a tight schema just logs.
    condition: "{{ outputs.find_unused.rows ? outputs.find_unused.rows | length > 0 : false }}"
    then:
      - id: alert_unused
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Name the candidates so the DROP decision starts there.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":mag: Postgres index audit: {{ outputs.find_unused.rows | length }} index(es) with zero scans since stats reset: {{ outputs.find_unused.rows }}. Consider dropping them before the next write-heavy season. Execution {{ execution.id }}."
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record the clean audit.
        message: "No unused secondary indexes found."

outputs:
  - id: unused_count
    type: INT
    value: "{{ outputs.find_unused.rows ? outputs.find_unused.rows | length : 0 }}"
  - id: unused_indexes
    type: JSON
    value: "{{ outputs.find_unused.rows | toJson }}"

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the audit fails - a dead connection must not read as "schema is tight".
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Postgres unused-index audit FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check the JDBC URL and credentials."
      }

triggers:
  - id: weekly_index_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly review so index hygiene is a standing item, not a yearly surprise.
    cron: "0 5 * * 5"
    disabled: true

extend:
  title: Report Unused Postgres Indexes
  shortDescription: Weekly query for zero-scan indexes and a Slack list for the cleanup ticket.
  metaTitle: Postgres Unused Index Report
  metaDescription: Find indexes with zero scans and alert Slack so write-taxing dead indexes get dropped.
  description: |
    Every index costs write throughput forever, even ones nobody reads. This blueprint queries `pg_stat_user_indexes` for zero-scan secondary indexes and posts the list to Slack weekly.

    ## How it works

    1. `find_unused` (`io.kestra.plugin.jdbc.postgresql.Query`) connects to Postgres and queries zero-scan secondary index names.
    2. `unused_found` (`io.kestra.plugin.core.flow.If`) branches to `alert_unused` or `log_clean`.
    3. The `errors` block alerts on failure.
    4. Trigger: a disabled weekly `Schedule`.

    ## What you get

    - The exact unused index names in Slack.
    - A standing cleanup nudge instead of a forensic session.

    ## Who it's for

    - Teams whose schema accreted indexes from three refactors ago.
    - Write-heavy workloads where every index matters.

    ## Why orchestrate this with Kestra

    The stats view answers the question; the flow makes it a scheduled review with history and alerts. The next step (DROP script, ticket, add to a quarterly runbook) is one task away.

    ## Prerequisites

    - Network reachability to the database and a read-only role.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for findings and failure alerts.
    - `PG_PASSWORD`: database password.

    ## Quick start

    1. Add the Slack webhook and `PG_PASSWORD` secrets.
    2. Set `jdbc_url`.
    3. Run once and read `unused_indexes`.
    4. Enable the weekly schedule.

    ## Links

    - [pg_stat_user_indexes](https://www.postgresql.org/docs/current/monitoring-stats.html)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
  tags:
    - Data
    - Infrastructure
  subTags:
    - PostgreSQL
    - Maintenance
  ee: false
  demo: false
