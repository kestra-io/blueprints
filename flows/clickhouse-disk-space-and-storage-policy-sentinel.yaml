id: clickhouse-disk-space-and-storage-policy-sentinel
namespace: company.analytics

description: |
  Audits ClickHouse system.disks storage volume utilization and available space
  via JDBC SQL query, detects free space exhaustion breaching safety headroom thresholds,
  opens an automated GitHub DBA incident ticket, and alerts Slack.

inputs:
  - id: clickhouse_url
    type: STRING
    displayName: ClickHouse JDBC URL
    defaults: "jdbc:ch://clickhouse.internal.company.com:8123/default"

  - id: free_space_percent_threshold
    type: FLOAT
    displayName: Minimum Free Space Threshold (%)
    defaults: 15.0

  - id: target_repository
    type: STRING
    displayName: Data Infrastructure Issue Repository
    defaults: my-org/data-platform-operations

triggers:
  - id: periodic_clickhouse_disk_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: probe_clickhouse_disks
    type: io.kestra.plugin.jdbc.clickhouse.Query
    description: Interrogates ClickHouse system.disks table for volume total_space, free_space, and storage paths
    url: "{{ inputs.clickhouse_url }}"
    username: "{{ secret('CLICKHOUSE_USER') }}"
    password: "{{ secret('CLICKHOUSE_PASSWORD') }}"
    sql: |
      SELECT 
        name,
        path,
        free_space,
        total_space,
        round((free_space / total_space) * 100, 2) AS free_pct
      FROM system.disks
      ORDER BY free_pct ASC
      LIMIT 1;
    fetchOne: true

  - id: evaluate_disk_headroom
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates lowest free space percentage against storage safety threshold
    format:
      disk_name: "{{ outputs.probe_clickhouse_disks.row.name ?? 'default' }}"
      path: "{{ outputs.probe_clickhouse_disks.row.path ?? '/' }}"
      free_space_bytes: "{{ outputs.probe_clickhouse_disks.row.free_space ?? 0 }}"
      total_space_bytes: "{{ outputs.probe_clickhouse_disks.row.total_space ?? 0 }}"
      free_pct: "{{ outputs.probe_clickhouse_disks.row.free_pct ?? 100.0 }}"
      threshold_pct: "{{ inputs.free_space_percent_threshold }}"
      is_exhaustion_risk: "{{ (outputs.probe_clickhouse_disks.row.free_pct ?? 100.0) <= inputs.free_space_percent_threshold }}"

  - id: branch_on_disk_pressure
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether ClickHouse disk free space breached the safety threshold
    condition: "{{ outputs.evaluate_disk_headroom.value.is_exhaustion_risk == true }}"
    then:
      - id: create_storage_incident_issue
        type: io.kestra.plugin.github.issues.Create
        description: Logs a prioritized GitHub issue documenting ClickHouse disk capacity exhaustion
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.target_repository }}"
        title: "[Data SRE Alert] ClickHouse Disk Free Space Low on Volume: {{ outputs.evaluate_disk_headroom.value.disk_name }} ({{ outputs.evaluate_disk_headroom.value.free_pct }}% Free)"
        body: |
          ## 🚨 ClickHouse Storage Volume Capacity Warning

          The database infrastructure sentinel detected storage space exhaustion on ClickHouse cluster:
          - **ClickHouse Endpoint:** `{{ inputs.clickhouse_url }}`
          - **Storage Disk Name:** `{{ outputs.evaluate_disk_headroom.value.disk_name }}`
          - **Volume Mount Path:** `{{ outputs.evaluate_disk_headroom.value.path }}`
          - **Free Space Percentage:** **{{ outputs.evaluate_disk_headroom.value.free_pct }}%**
          - **Warning Threshold:** `{{ inputs.free_space_percent_threshold }}%`

          If free disk space drops below 5%, ClickHouse switches to read-only mode and refuses incoming insert mutations and background table merges.
          *Generated automatically by Kestra ClickHouse Sentinel.*

      - id: alert_data_sre_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority alert to the data platform Slack channel
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🚨 *ClickHouse Disk Space Exhaustion Alert*\n*Volume:* `" ~ outputs.evaluate_disk_headroom.value.disk_name ~ "` (`" ~ outputs.evaluate_disk_headroom.value.path ~ "`)\n*Free Space:* *" ~ outputs.evaluate_disk_headroom.value.free_pct ~ "%* (Threshold: `" ~ inputs.free_space_percent_threshold ~ "%`)\n*Triage Ticket:* <" ~ (outputs.create_storage_incident_issue.issueUrl ?? "#") ~ "|View GitHub Issue>"
          } | toJson }}

    else:
      - id: log_storage_healthy
        type: io.kestra.plugin.core.log.Log
        message: "ClickHouse volume {{ outputs.evaluate_disk_headroom.value.disk_name }} has ample free space ({{ outputs.evaluate_disk_headroom.value.free_pct }}% > {{ inputs.free_space_percent_threshold }}%)."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status audit log recording ClickHouse disk storage state
    message: "ClickHouse disk audit complete. Volume: {{ outputs.evaluate_disk_headroom.value.disk_name }}, Free: {{ outputs.evaluate_disk_headroom.value.free_pct }}%."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when ClickHouse JDBC query or issue creation fails
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *ClickHouse Disk Sentinel Failed* in execution `" ~ execution.id ~ "`. Unable to execute system.disks query."
      } | toJson }}

extend:
  title: "ClickHouse Storage Disk Space and Capacity Headroom Sentinel"
  shortDescription: "Audit ClickHouse system.disks storage utilization, detect volume exhaustion below 15% free, file GitHub issues, and alert Slack."
  metaTitle: "ClickHouse Storage Disk Space Sentinel with Kestra"
  metaDescription: "Monitor ClickHouse disk capacity and prevent read-only table lockouts with Kestra. Query system.disks, open GitHub issues, and alert Data SRE on Slack."
  description: |
    ClickHouse relies on local NVMe SSDs or mounted block storage volumes to store partitioned columnar data parts and perform asynchronous background merges (`MergeTree`). When available disk space drops below critical thresholds, ClickHouse automatically terminates background merges and places tables into read-only mode, refusing incoming real-time ingestion pipelines. This blueprint queries ClickHouse's `system.disks` table periodically via JDBC, identifies storage volumes breaching safe free space percentages, opens a prioritized GitHub Data SRE incident ticket, and alerts engineering teams on Slack.

    ## How it works

    1. `periodic_clickhouse_disk_check` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every 30 minutes (shipped disabled for safe verification).
    2. `probe_clickhouse_disks` (`io.kestra.plugin.jdbc.clickhouse.Query`) queries `system.disks` for total and free space bytes and calculates the free space percentage across all configured disks.
    3. `evaluate_disk_headroom` (`io.kestra.plugin.core.debug.Return`) calculates if the volume with the least free space breached `free_space_percent_threshold`.
    4. `branch_on_disk_pressure` (`io.kestra.plugin.core.flow.If`) evaluates the condition:
       - `then`: Automatically files a GitHub tracking issue via `create_storage_incident_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the Slack channel via `alert_data_sre_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_storage_healthy`) confirming ample storage headroom.
    5. `log_audit_complete` (`io.kestra.plugin.core.log.Log`) records the final audit outcome.
    6. The `errors` block alerts Slack if database authentication or network connectivity fails.

    ## What you get

    - Automated, scheduled auditing of ClickHouse storage engine capacity.
    - Zero unexpected ingestion halts caused by sudden disk fill-ups.
    - Consolidated GitHub incident tickets with volume names, mount paths, and free space percentages.
    - Real-time Slack notifications with direct ticket hyperlinks.

    ## Who it's for

    - Data Platform Engineers and ClickHouse Administrators operating analytical datalakes.
    - Site Reliability Engineers safeguarding real-time data streaming and metrics storage.
    - Infrastructure Architects sizing cloud storage volumes and retention policies.

    ## Why orchestrate this with Kestra

    Kestra simplifies multi-system reliability by connecting ClickHouse JDBC querying, mathematical threshold evaluation, GitHub issue ticketing, and team alerting into a single declarative pipeline. It manages database credentials securely, provides complete execution history, and eliminates the need for separate standalone monitoring daemons.

    ## Prerequisites

    - A running ClickHouse cluster or standalone instance.
    - A ClickHouse user with read access on the `system.disks` administrative table.
    - A GitHub Personal Access Token with repository issue creation permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `CLICKHOUSE_USER`, `CLICKHOUSE_PASSWORD`: Authentication credentials for ClickHouse JDBC connection.
    - `GITHUB_TOKEN`: GitHub token used to open incident issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for data platform alerts.

    ## Inputs

    - `clickhouse_url` (STRING, default `jdbc:ch://clickhouse.internal.company.com:8123/default`): ClickHouse JDBC connection URL.
    - `free_space_percent_threshold` (FLOAT, default `15.0`): Percentage of free space below which alerts fire.
    - `target_repository` (STRING, default `my-org/data-platform-operations`): Target GitHub repository for logging incident issues.

    ## Outputs

    - `outputs.probe_clickhouse_disks.row.name`: Name of the storage volume with lowest headroom.
    - `outputs.probe_clickhouse_disks.row.free_pct`: Calculated free space percentage.
    - `outputs.evaluate_disk_headroom.value.is_exhaustion_risk`: Boolean indicating whether threshold was breached.

    ## Quick start

    1. Configure `CLICKHOUSE_USER`, `CLICKHOUSE_PASSWORD`, `GITHUB_TOKEN`, and `SLACK_WEBHOOK` in your Kestra namespace.
    2. Import this flow and set `clickhouse_url` to match your cluster endpoint.
    3. Run the flow manually to verify disk metric calculation and Slack notification delivery.
    4. Enable the `periodic_clickhouse_disk_check` trigger for continuous storage headroom monitoring.

    ## How to extend

    - Add an automated table partition drop or cold storage tiering task (`ALTER TABLE ... MOVE PARTITION ... TO DISK 's3'`) to reclaim space.
    - Query `system.parts` to list the top 10 largest tables on the constrained volume.
    - Route urgent alerts to PagerDuty or Opsgenie if free disk space drops below 5%.

    ## Links

    - [ClickHouse system.disks Documentation](https://clickhouse.com/docs/en/operations/system-tables/disks)
    - [Kestra ClickHouse Plugin](https://kestra.io/plugins/plugin-jdbc-clickhouse)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
