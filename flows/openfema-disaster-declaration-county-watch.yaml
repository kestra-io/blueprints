id: openfema-disaster-declaration-county-watch
namespace: company.team

description: |
  Every day, read the FEMA disaster declarations for the states your sites are in from the keyless
  OpenFEMA API (paged with `$top`/`$skip`, trimmed with `$select`, counted with `$inlinecount`), map
  every designated area (county FIPS, county name, statewide `000` rows and tribal areas) to your
  sites in DuckDB, and alert only on what changed since the last run: a new declaration, a county
  added to an existing one, or a program (IH, IA, PA, HM) newly declared for a county. Alerts are
  routed by declaration type (Major Disaster, Emergency, Fire Management) to Slack, and a CSV lists
  every site with its current declarations.

inputs:
  - id: sites
    type: JSON
    displayName: Sites to watch
    description: |
      JSON array of sites. Each needs a unique `name` and a two-letter USPS `state`, plus either `county_fips`
      (3-digit county code or 5-digit state+county code; numbers that lost their leading zero are padded) or
      `county` (name, with or without "County"/"Parish"; add "city" for a Virginia independent city).
      Optional `tribal_area` matches tribal designations (county code 000) whose name contains that text.
    defaults: |
      [
        {"name": "Indianapolis fulfilment centre", "state": "IN", "county_fips": "097"},
        {"name": "Gulfport port terminal", "state": "MS", "county": "Harrison"},
        {"name": "Atlanta regional office", "state": "GA", "county_fips": "13067"},
        {"name": "Reno distribution centre", "state": "NV", "county": "Washoe County"},
        {"name": "Yakima Valley packing plant", "state": "WA", "county": "Yakima", "tribal_area": "Yakama"},
        {"name": "Lane County grain elevator", "state": "KS", "county_fips": 101},
        {"name": "Phoenix PHX-2 data centre", "state": "AZ", "county": "Maricopa"}
      ]

  - id: declaration_types
    type: MULTISELECT
    displayName: Declaration types
    description: "DR = Presidential major disaster, EM = emergency, FM = fire management assistance grant (FMAG)."
    values:
      - DR
      - EM
      - FM
    defaults:
      - DR
      - EM
      - FM

  - id: lookback_days
    type: INT
    defaults: 180
    description: Declarations whose `declarationDate` falls in the last N days are fetched every run; counties and programs added to them later are caught as amendments.

  - id: alert_on_baseline
    type: BOOL
    defaults: true
    description: On the first run (and for a state you add later) every current declaration is a BASELINE row. True posts them once so you see your current exposure; false records them silently and only alerts on later changes.

  - id: page_size
    type: INT
    defaults: 1000
    description: OpenFEMA `$top` per request (API maximum 10000). The flow pages with `$skip` until the `$inlinecount` total is read.

  - id: state_key
    type: STRING
    defaults: openfema_declaration_county_state
    description: KV key holding the declarations already seen. Use a different key per site list.

variables:
  odata_filter: >-
    declarationDate ge '{{ now() | dateAdd(-inputs.lookback_days, 'DAYS') | date("yyyy-MM-dd", timeZone="UTC") }}T00:00:00.000Z'
    and state in ({{ outputs.validate_sites.outputs[0].row.state_list }})
    and declarationType in ({% for t in inputs.declaration_types %}'{{ t }}'{% if not loop.last %},{% endif %}{% endfor %})

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: OpenFEMA republishes declaration summaries several times a day; one check a day after US business hours is enough for insurance and contract workflows.
    cron: "0 23 * * *"

tasks:
  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    description: The (disaster, county) pairs seen so far with their declared programs, and the states already watched. Missing on the first run.
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: validate_sites
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Normalises the site list (state, county FIPS padding, county name), reports invalid rows and builds the state list used in the OData filter, so the API is only asked for states you have sites in.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      sites.json: "{{ inputs.sites | toJson }}"
    sql: |
      -- USPS code and state FIPS for the states and territories FEMA declares in.
      CREATE TABLE fips AS
      SELECT left(x, 2) AS st, right(x, 2) AS st_fips
      FROM unnest(string_split('AL01 AK02 AZ04 AR05 CA06 CO08 CT09 DE10 DC11 FL12 GA13 HI15 ID16 IL17 IN18 IA19 KS20 KY21 LA22 ME23 MD24 MA25 MI26 MN27 MS28 MO29 MT30 NE31 NV32 NH33 NJ34 NM35 NY36 NC37 ND38 OH39 OK40 OR41 PA42 RI44 SC45 SD46 TN47 TX48 UT49 VT50 VA51 WA53 WV54 WI55 WY56 AS60 FM64 GU66 MH68 MP69 PW70 PR72 VI78', ' ')) AS t(x);

      CREATE TABLE site_input AS
      SELECT trim(s ->> 'name') AS site,
             upper(trim(s ->> 'state')) AS st,
             regexp_replace(coalesce(s ->> 'county_fips', ''), '[^0-9]', '', 'g') AS fips_digits,
             trim(coalesce(s ->> 'county', '')) AS county_name,
             nullif(trim(coalesce(s ->> 'tribal_area', '')), '') AS tribal_area,
             row_number() OVER () AS ord
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('sites.json'));

      CREATE TABLE site_check AS
      SELECT i.*, f.st_fips,
             CASE WHEN length(fips_digits) BETWEEN 1 AND 3 THEN lpad(fips_digits, 3, '0')
                  WHEN length(fips_digits) IN (4, 5) THEN right(lpad(fips_digits, 5, '0'), 3) END AS county_code,
             CASE WHEN site IS NULL OR site = '' THEN 'missing name'
                  WHEN f.st IS NULL THEN 'unknown state ' || coalesce(i.st, '(none)')
                  WHEN fips_digits = '' AND county_name = '' AND tribal_area IS NULL THEN 'needs county_fips, county or tribal_area'
                  WHEN length(fips_digits) > 5 THEN 'county_fips must have 3 or 5 digits'
                  WHEN length(fips_digits) IN (4, 5) AND left(lpad(fips_digits, 5, '0'), 2) <> f.st_fips
                    THEN 'county_fips ' || lpad(fips_digits, 5, '0') || ' is not in ' || i.st || ' (state FIPS ' || f.st_fips || ')'
                  WHEN row_number() OVER (PARTITION BY site ORDER BY ord) > 1 THEN 'duplicate name, first entry kept'
             END AS problem
      FROM site_input i LEFT JOIN fips f ON f.st = i.st;

      -- County names compare without the "County/Parish/Borough" suffix, punctuation or "Saint" spelt out.
      SELECT
        (SELECT count(*) FROM site_check WHERE problem IS NULL) AS valid_sites,
        (SELECT count(*) FROM site_check WHERE problem IS NOT NULL) AS invalid_sites,
        (SELECT coalesce(string_agg('row ' || ord || ' ' || coalesce(site, '(no name)') || ': ' || problem, '; ' ORDER BY ord), '') FROM site_check WHERE problem IS NOT NULL) AS invalid_site_list,
        (SELECT coalesce(string_agg(DISTINCT '''' || st || '''', ','), '''XX''') FROM site_check WHERE problem IS NULL) AS state_list,
        (SELECT coalesce(CAST(json_group_array(json_object(
            'site', site, 'st', st, 'county_code', CASE WHEN county_code IS NOT NULL THEN county_code END,
            'county_input', CASE WHEN county_code IS NOT NULL THEN st_fips || county_code ELSE county_name END,
            'county_norm', CASE WHEN county_code IS NULL AND county_name <> '' THEN
                trim(regexp_replace(regexp_replace(regexp_replace(lower(county_name), '^saint ', 'st '), '[^a-z0-9 ]', '', 'g'),
                  '\s+(county|parish|borough|census area|municipality|municipio)$', '')) END,
            'tribal_area', tribal_area)) AS VARCHAR), '[]')
         FROM site_check WHERE problem IS NULL) AS sites_json;

  - id: no_valid_sites
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ outputs.validate_sites.outputs[0].row.valid_sites == 0 }}"
    errorMessage: "No valid site to watch: {{ outputs.validate_sites.outputs[0].row.invalid_site_list }}"

  - id: count_declarations
    type: io.kestra.plugin.core.http.Request
    description: One cheap request (`$top=1`, `$select=id`) with `$inlinecount=allpages`, so `metadata.count` gives the total and the number of pages to fetch.
    uri: https://www.fema.gov/api/open/v2/DisasterDeclarationsSummaries
    method: GET
    params:
      $filter: "{{ render(vars.odata_filter) }}"
      $select: id
      $top: "1"
      $inlinecount: allpages
    headers:
      Accept: application/json
      User-Agent: kestra-openfema-disaster-declaration-county-watch/1.0 (https://kestra.io)
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempts: 4

  - id: fetch_pages
    type: io.kestra.plugin.core.flow.Loop
    description: One `$skip` page per iteration. Each item carries the filter, offset and page size, and `$orderby=id` keeps the pages stable while FEMA refreshes rows.
    values: |
      [{% for s in range(0, max(fromJson(outputs.count_declarations.body).metadata.count - 1, 0), inputs.page_size) %}{"skip": {{ s }}, "top": {{ inputs.page_size }}, "filter": {{ render(vars.odata_filter) | toJson }}}{% if not loop.last %}, {% endif %}{% endfor %}]
    concurrencyLimit: 1
    fetchType: FETCH
    outputs:
      - id: uri
        type: STRING
        value: "{{ outputs.fetch_page.uri }}"
    tasks:
      - id: fetch_page
        type: io.kestra.plugin.core.http.Download
        uri: https://www.fema.gov/api/open/v2/DisasterDeclarationsSummaries
        params:
          $filter: "{{ fromJson(item.value).filter }}"
          $select: id,disasterNumber,femaDeclarationString,state,declarationType,declarationDate,incidentType,declarationTitle,ihProgramDeclared,iaProgramDeclared,paProgramDeclared,hmProgramDeclared,incidentBeginDate,incidentEndDate,fipsStateCode,fipsCountyCode,designatedArea,incidentId
          $orderby: id
          $top: "{{ fromJson(item.value).top }}"
          $skip: "{{ fromJson(item.value).skip }}"
          $metadata: "off"
        headers:
          Accept: application/json
          User-Agent: kestra-openfema-disaster-declaration-county-watch/1.0 (https://kestra.io)
        retry:
          type: exponential
          interval: PT30S
          maxInterval: PT5M
          maxAttempts: 4

  - id: match
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Collapses the pages into one row per (disaster, designated area), diffs them against the KV state
      (new declaration, new county, newly declared program, unchanged, baseline for a newly watched state),
      matches the areas to the sites by county FIPS, county name, statewide 000 rows or tribal area name,
      and writes the site CSV, the new state and one alert group per declaration type.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles: |
      { "sites.json": {{ outputs.validate_sites.outputs[0].row.sites_json | toJson }},
        "state.json": {{ (outputs.previous_state.value ?? {}) | toJson | toJson }}{% for p in outputs.fetch_pages.outputs %},
        "page_{{ loop.index }}.json": "{{ p.outputs.uri }}"{% endfor %} }
    outputFiles:
      - sites_csv
      - state_json
    parameters:
      expected_rows: "{{ fromJson(outputs.count_declarations.body).metadata.count }}"
      alert_on_baseline: "{{ inputs.alert_on_baseline }}"
      since: "{{ now() | dateAdd(-inputs.lookback_days, 'DAYS') | date('yyyy-MM-dd', timeZone='UTC') }}"
    sql: |
      SET TimeZone = 'UTC';

      CREATE MACRO area_norm(a) AS
        CASE WHEN a LIKE '%(Independent City)' THEN lower(trim(regexp_replace(a, '\s*\(.*\)$', ''))) || ' city'
             ELSE regexp_replace(regexp_replace(lower(trim(regexp_replace(a, '\s*\(.*\)$', ''))), '^saint ', 'st '), '[^a-z0-9 ]', '', 'g') END;

      CREATE TABLE raw AS
      SELECT unnest(from_json(json_extract(content, '$.DisasterDeclarationsSummaries'), '["JSON"]')) AS r
      FROM read_text('page_*.json');

      -- One row per (disaster, designated area). Tribal and statewide rows share county code 000, so the area name is part of their key.
      CREATE TABLE decl AS
      SELECT area_key, any_value(dn) AS dn, any_value(decl_string) AS decl_string, any_value(st) AS st, any_value(dtype) AS dtype,
             any_value(title) AS title, any_value(incident_type) AS incident_type, any_value(incident_id) AS incident_id,
             any_value(area) AS area, any_value(fips_state) AS fips_state, any_value(fips_county) AS fips_county,
             min(declared) AS declared, min(incident_begin) AS incident_begin, max(incident_end) AS incident_end,
             bool_or(ih) AS ih, bool_or(ia) AS ia, bool_or(pa) AS pa, bool_or(hm) AS hm
      FROM (
        SELECT DISTINCT ON (r ->> 'id')
               CAST(r ->> 'disasterNumber' AS BIGINT) AS dn, r ->> 'femaDeclarationString' AS decl_string, r ->> 'state' AS st,
               r ->> 'declarationType' AS dtype, r ->> 'declarationTitle' AS title, r ->> 'incidentType' AS incident_type,
               r ->> 'incidentId' AS incident_id, r ->> 'designatedArea' AS area,
               r ->> 'fipsStateCode' AS fips_state, r ->> 'fipsCountyCode' AS fips_county,
               CAST(r ->> 'declarationDate' AS TIMESTAMPTZ) AS declared,
               CAST(r ->> 'incidentBeginDate' AS TIMESTAMPTZ) AS incident_begin,
               TRY_CAST(r ->> 'incidentEndDate' AS TIMESTAMPTZ) AS incident_end,
               CAST(r ->> 'ihProgramDeclared' AS BOOLEAN) AS ih, CAST(r ->> 'iaProgramDeclared' AS BOOLEAN) AS ia,
               CAST(r ->> 'paProgramDeclared' AS BOOLEAN) AS pa, CAST(r ->> 'hmProgramDeclared' AS BOOLEAN) AS hm,
               (r ->> 'disasterNumber') || '|' || (r ->> 'fipsStateCode') || (r ->> 'fipsCountyCode')
                 || CASE WHEN r ->> 'fipsCountyCode' = '000' THEN '|' || (r ->> 'designatedArea') ELSE '' END AS area_key
        FROM raw
      ) GROUP BY area_key;

      CREATE TABLE prev AS
      SELECT * FROM (SELECT unnest(from_json(coalesce(json_extract(content, '$.rows'), '[]'),
                     '[{"k":"VARCHAR","dn":"BIGINT","p":"VARCHAR","d":"VARCHAR"}]'), recursive := true) FROM read_text('state.json'));
      CREATE TABLE prev_states AS
      SELECT unnest(from_json(coalesce(json_extract(content, '$.states'), '[]'), '["VARCHAR"]')) AS st FROM read_text('state.json');

      CREATE TABLE sites AS
      SELECT s ->> 'site' AS site, s ->> 'st' AS st, s ->> 'county_code' AS county_code, s ->> 'county_input' AS county_input,
             s ->> 'county_norm' AS county_norm, s ->> 'tribal_area' AS tribal_area
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('sites.json'));

      CREATE TABLE diffed AS
      SELECT d.*, concat_ws('+', CASE WHEN ih THEN 'IH' END, CASE WHEN ia THEN 'IA' END, CASE WHEN pa THEN 'PA' END, CASE WHEN hm THEN 'HM' END) AS programs,
             concat_ws('+', CASE WHEN ih AND NOT contains(coalesce(p.p, ''), 'IH') THEN 'IH' END, CASE WHEN ia AND NOT contains(coalesce(p.p, ''), 'IA') THEN 'IA' END,
                            CASE WHEN pa AND NOT contains(coalesce(p.p, ''), 'PA') THEN 'PA' END, CASE WHEN hm AND NOT contains(coalesce(p.p, ''), 'HM') THEN 'HM' END) AS new_programs,
             CASE WHEN d.st NOT IN (SELECT st FROM prev_states) THEN 'BASELINE'
                  WHEN d.dn NOT IN (SELECT dn FROM prev) THEN 'NEW_DECLARATION'
                  WHEN p.k IS NULL THEN 'NEW_COUNTY'
                  WHEN (ih AND NOT contains(p.p, 'IH')) OR (ia AND NOT contains(p.p, 'IA')) OR (pa AND NOT contains(p.p, 'PA')) OR (hm AND NOT contains(p.p, 'HM')) THEN 'NEW_PROGRAM'
                  ELSE 'UNCHANGED' END AS status,
             p.p AS previous_programs
      FROM decl d LEFT JOIN prev p ON p.k = d.area_key;

      CREATE TABLE matches AS
      SELECT s.site, s.county_input, s.tribal_area, d.*,
             CASE WHEN d.fips_county = '000' AND lower(d.area) = 'statewide' THEN 'STATEWIDE'
                  WHEN d.fips_county = '000' THEN 'TRIBAL_AREA'
                  WHEN s.county_code IS NOT NULL THEN 'COUNTY_FIPS' ELSE 'COUNTY_NAME' END AS match_type,
             (SELECT string_agg(DISTINCT x.decl_string, ', ') FROM decl x
              WHERE x.incident_id = d.incident_id AND x.decl_string <> d.decl_string AND x.st = d.st) AS related,
             d.status IN ('NEW_DECLARATION', 'NEW_COUNTY', 'NEW_PROGRAM') OR (d.status = 'BASELINE' AND CAST(:alert_on_baseline AS BOOLEAN)) AS alert
      FROM sites s JOIN diffed d ON d.st = s.st AND (
            (d.fips_county <> '000' AND s.county_code IS NOT NULL AND d.fips_county = s.county_code)
         OR (d.fips_county <> '000' AND s.county_code IS NULL AND s.county_norm IS NOT NULL AND s.county_norm = area_norm(d.area))
         OR (d.fips_county = '000' AND lower(d.area) = 'statewide')
         OR (d.fips_county = '000' AND s.tribal_area IS NOT NULL AND contains(lower(d.area), lower(s.tribal_area))));

      COPY (
        SELECT site, st AS state, county_input, match_type, decl_string AS declaration, dtype AS declaration_type, title, incident_type,
               area AS designated_area, fips_state || fips_county AS fips, programs, new_programs, previous_programs, status, alert,
               strftime(declared, '%Y-%m-%d') AS declaration_date, strftime(incident_begin, '%Y-%m-%d') AS incident_begin,
               strftime(incident_end, '%Y-%m-%d') AS incident_end, related, 'https://www.fema.gov/disaster/' || dn AS fema_url
        FROM matches
        UNION ALL
        SELECT site, st, county_input, 'NONE', NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, 'CLEAR', false, NULL, NULL, NULL, NULL, NULL
        FROM sites WHERE site NOT IN (SELECT site FROM matches)
        ORDER BY site, declaration_date DESC NULLS LAST, declaration
      ) TO '{{ outputFiles.sites_csv }}' (HEADER true, DELIMITER ',');

      -- New state: every area seen now, plus older entries still inside the lookback window (a page that failed
      -- to come back does not turn its rows into "new" tomorrow). States are the ones watched in this run.
      COPY (
        SELECT (SELECT list(DISTINCT st ORDER BY st) FROM sites) AS states,
               (SELECT list({'k': k, 'dn': dn, 'p': p, 'd': d} ORDER BY k) FROM (
                  SELECT area_key AS k, dn, programs AS p, strftime(declared, '%Y-%m-%d') AS d FROM diffed
                  UNION ALL
                  SELECT k, dn, p, d FROM prev WHERE k NOT IN (SELECT area_key FROM decl) AND d >= :since
               )) AS rows
      ) TO '{{ outputFiles.state_json }}' (FORMAT JSON);

      WITH lines AS (
        SELECT dtype, site,
               '- *' || site || '* (' || area || ', ' || st || ', ' || lower(replace(match_type, '_', ' ')) || '): <https://www.fema.gov/disaster/' || dn || '|' || decl_string || '> '
               || title || ' (' || incident_type || '), '
               || CASE status WHEN 'NEW_DECLARATION' THEN '*new declaration*'
                              WHEN 'NEW_COUNTY' THEN '*county added to the declaration*'
                              WHEN 'NEW_PROGRAM' THEN '*' || new_programs || ' newly declared* (was ' || coalesce(nullif(previous_programs, ''), 'none') || ')'
                              ELSE 'in force at baseline' END
               || ', programs ' || coalesce(nullif(programs, ''), 'none')
               || ', incident ' || strftime(incident_begin, '%Y-%m-%d') || CASE WHEN incident_end IS NULL THEN ' (ongoing)' ELSE ' to ' || strftime(incident_end, '%Y-%m-%d') END
               || ', declared ' || strftime(declared, '%Y-%m-%d')
               || CASE WHEN related IS NOT NULL THEN ', same incident as ' || related ELSE '' END AS line
        FROM matches WHERE alert
      ),
      groups AS (
        SELECT dtype, count(*) AS n, count(DISTINCT site) AS sites, string_agg(line, chr(10) ORDER BY site, line) AS text
        FROM lines GROUP BY dtype
      )
      SELECT
        (SELECT count(*) FROM raw) AS rows_fetched,
        CAST(:expected_rows AS BIGINT) AS rows_expected,
        (SELECT count(DISTINCT r ->> 'id') FROM raw) AS distinct_rows,
        (SELECT count(*) FROM decl) AS designated_areas,
        (SELECT count(DISTINCT dn) FROM decl) AS declarations,
        (SELECT count(*) FROM decl WHERE fips_county = '000') AS tribal_or_statewide_areas,
        (SELECT count(*) FROM sites) AS sites,
        (SELECT count(*) FROM prev) AS state_rows_before,
        (SELECT coalesce(string_agg(DISTINCT st, ', '), 'none') FROM sites WHERE st NOT IN (SELECT st FROM prev_states)) AS baseline_states,
        (SELECT count(*) FROM matches) AS site_matches,
        (SELECT count(*) FILTER (WHERE status = 'NEW_DECLARATION') FROM matches) AS new_declarations,
        (SELECT count(*) FILTER (WHERE status = 'NEW_COUNTY') FROM matches) AS new_counties,
        (SELECT count(*) FILTER (WHERE status = 'NEW_PROGRAM') FROM matches) AS new_programs,
        (SELECT count(*) FILTER (WHERE status = 'BASELINE') FROM matches) AS baseline_matches,
        (SELECT count(*) FILTER (WHERE status = 'UNCHANGED') FROM matches) AS unchanged,
        (SELECT count(*) FROM matches WHERE alert) AS alerts,
        (SELECT coalesce(string_agg(dtype || ' ' || n, ', ' ORDER BY dtype), 'none') FROM groups) AS alerts_by_type,
        (SELECT coalesce(string_agg(site, ', ' ORDER BY site), 'none') FROM sites WHERE site NOT IN (SELECT site FROM matches)) AS clear_sites,
        (SELECT coalesce(string_agg(site || ' (' || county_input || ', ' || st || ')', '; '), '') FROM sites
         WHERE county_norm IS NOT NULL AND site NOT IN (SELECT site FROM matches)) AS unmatched_county_names,
        (SELECT coalesce(string_agg(site || ' matched ' || n || ' counties by name', '; '), '') FROM (
           SELECT site, count(DISTINCT fips_county) AS n FROM matches WHERE match_type = 'COUNTY_NAME' GROUP BY site HAVING n > 1)) AS ambiguous_names,
        (SELECT coalesce(string_agg(log_line, chr(10) ORDER BY dtype), '') FROM (SELECT dtype, text AS log_line FROM groups)) AS alert_text,
        (SELECT coalesce(CAST(json_group_array(json_object('type', dtype, 'alerts', n, 'sites', sites, 'text', left(text, 2900))) AS VARCHAR), '[]') FROM groups) AS alert_groups;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: Stores the (disaster, area) keys with their declared programs; entries whose declaration left the lookback window are dropped.
    key: "{{ inputs.state_key }}"
    kvType: JSON
    value: "{{ read(outputs.match.outputFiles.state_json) }}"

  - id: data_quality
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.validate_sites.outputs[0].row.invalid_sites > 0 or outputs.match.outputs[0].row.distinct_rows != outputs.match.outputs[0].row.rows_expected or outputs.match.outputs[0].row.ambiguous_names != '' }}"
    level: WARN
    message: |
      Invalid sites skipped: {{ outputs.validate_sites.outputs[0].row.invalid_site_list == '' ? 'none' : outputs.validate_sites.outputs[0].row.invalid_site_list }}
      Rows: {{ outputs.match.outputs[0].row.distinct_rows }} distinct read, {{ outputs.match.outputs[0].row.rows_expected }} expected from $inlinecount (a difference means FEMA refreshed rows between pages; the next run catches up).
      Ambiguous county names: {{ outputs.match.outputs[0].row.ambiguous_names == '' ? 'none' : outputs.match.outputs[0].row.ambiguous_names }}

  - id: route_alerts
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.match.outputs[0].row.alerts > 0 }}"
    then:
      - id: log_alerts
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.match.outputs[0].row.alert_text }}"

      - id: each_type
        type: io.kestra.plugin.core.flow.Loop
        description: One Slack message per declaration type; the Switch gives each type its own heading and the consequences that matter for claims, aid and contracts.
        values: "{{ outputs.match.outputs[0].row.alert_groups }}"
        concurrencyLimit: 1
        tasks:
          - id: by_type
            type: io.kestra.plugin.core.flow.Switch
            value: "{{ fromJson(item.value).type }}"
            cases:
              DR:
                - id: slack_major_disaster
                  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                  allowFailure: true
                  url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                  payload: |
                    {
                      "text": {{ (':rotating_light: Major disaster declaration for ' ~ fromJson(item.value).sites ~ ' site(s)') | toJson }},
                      "blocks": [
                        {"type": "header", "text": {"type": "plain_text", "text": "Presidential major disaster (DR)"}},
                        {"type": "section", "text": {"type": "mrkdwn", "text": {{ fromJson(item.value).text | toJson }}}},
                        {"type": "context", "elements": [{"type": "mrkdwn", "text": "IH = Individuals and Households Program (residents can apply at DisasterAssistance.gov), PA = public assistance, HM = hazard mitigation. A Stafford Act major disaster is the declaration most force-majeure, business-interruption and catastrophe-claim clauses refer to, and IRS disaster tax relief usually follows for counties with individual assistance."}]}
                      ]
                    }
              EM:
                - id: slack_emergency
                  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                  allowFailure: true
                  url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                  payload: |
                    {
                      "text": {{ (':warning: Emergency declaration for ' ~ fromJson(item.value).sites ~ ' site(s)') | toJson }},
                      "blocks": [
                        {"type": "header", "text": {"type": "plain_text", "text": "Emergency declaration (EM)"}},
                        {"type": "section", "text": {"type": "mrkdwn", "text": {{ fromJson(item.value).text | toJson }}}},
                        {"type": "context", "elements": [{"type": "mrkdwn", "text": "An emergency declaration funds protective measures (usually PA category B) before or during an event and often precedes a major disaster declaration for the same incident. Expect disruption, but no individual assistance yet."}]}
                      ]
                    }
              FM:
                - id: slack_fire_management
                  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                  allowFailure: true
                  url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                  payload: |
                    {
                      "text": {{ (':fire: Fire management assistance grant for ' ~ fromJson(item.value).sites ~ ' site(s)') | toJson }},
                      "blocks": [
                        {"type": "header", "text": {"type": "plain_text", "text": "Fire management assistance (FM)"}},
                        {"type": "section", "text": {"type": "mrkdwn", "text": {{ fromJson(item.value).text | toJson }}}},
                        {"type": "context", "elements": [{"type": "mrkdwn", "text": "An FMAG is approved by the FEMA region when an uncontrolled wildfire threatens to become a major disaster. It pays for firefighting only: it is not a Presidential declaration and opens no individual assistance."}]}
                      ]
                    }
            defaults:
              - id: unknown_type
                type: io.kestra.plugin.core.log.Log
                level: WARN
                message: "Unrouted declaration type {{ fromJson(item.value).type }}: {{ fromJson(item.value).text }}"
    else:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No new declaration, county or program for your sites: {{ outputs.match.outputs[0].row.site_matches }} site match(es), {{ outputs.match.outputs[0].row.unchanged }} unchanged, {{ outputs.match.outputs[0].row.baseline_matches }} recorded as baseline."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      OpenFEMA: {{ outputs.match.outputs[0].row.rows_fetched }} rows in {{ outputs.fetch_pages.outputs | length }} page(s) ({{ outputs.match.outputs[0].row.rows_expected }} expected), {{ outputs.match.outputs[0].row.declarations }} declarations, {{ outputs.match.outputs[0].row.designated_areas }} designated areas ({{ outputs.match.outputs[0].row.tribal_or_statewide_areas }} tribal or statewide) for {{ inputs.declaration_types | join('/') }} declared in the last {{ inputs.lookback_days }} days.
      {{ outputs.match.outputs[0].row.sites }} sites, baseline states: {{ outputs.match.outputs[0].row.baseline_states }}. {{ outputs.match.outputs[0].row.site_matches }} site matches: {{ outputs.match.outputs[0].row.new_declarations }} new declarations, {{ outputs.match.outputs[0].row.new_counties }} counties added, {{ outputs.match.outputs[0].row.new_programs }} programs newly declared, {{ outputs.match.outputs[0].row.baseline_matches }} baseline, {{ outputs.match.outputs[0].row.unchanged }} unchanged. Alerts by type: {{ outputs.match.outputs[0].row.alerts_by_type }}.
      Sites with no declaration: {{ outputs.match.outputs[0].row.clear_sites }}. State rows before this run: {{ outputs.match.outputs[0].row.state_rows_before }}.
      {{ outputs.match.outputs[0].row.unmatched_county_names == '' ? '' : 'Sites matched by county name with nothing in the window (if unexpected, check the spelling or switch to county_fips): ' ~ outputs.match.outputs[0].row.unmatched_county_names }}

outputs:
  - id: sites_csv
    type: FILE
    value: "{{ outputs.match.outputFiles.sites_csv }}"
  - id: run_summary
    type: JSON
    value: "{{ outputs.match.outputs[0].row }}"

extend:
  title: Watch FEMA Disaster Declarations for the Counties Where You Have Sites with OpenFEMA
  metaTitle: OpenFEMA Disaster Declaration County Watch for Sites | Kestra
  shortDescription: Check OpenFEMA every day for major disaster, emergency and fire management declarations covering the counties, statewide areas or tribal areas where you have sites, detect new declarations, added counties and newly declared programs, and route Slack alerts by declaration type.
  metaDescription: Daily OpenFEMA check of FEMA declarations for your site counties, with DuckDB matching, KV amendment tracking and Slack alerts by declaration type.
  description: |
    A federal declaration is a legal and administrative event, not a physical one. Whether a county is in a major disaster declaration decides if staff can apply for individual assistance, how catastrophe claims and loan forbearance are handled, and whether a force-majeure clause naming "a declared disaster" applies. This flow watches FEMA's declaration records for your site counties with the keyless OpenFEMA API. It complements `nasa-eonet-asset-proximity-alert`, which measures distance to physical events: a fire 5 km away may never be declared, and a county 200 km from a storm track may be.

    ## How it works

    1. `daily` (Schedule) runs at 23:00 UTC. Each site has a `state` and a `county_fips` (3 or 5 digits) or `county` name, and optionally a `tribal_area`.
    2. `previous_state` (KV Get) reads the (disaster, designated area) pairs already seen with their programs, and the states already watched.
    3. `validate_sites` (DuckDB) rejects unknown states, FIPS codes from another state, missing counties and duplicates, pads FIPS codes that lost a leading zero, normalises county names and builds the state list. `no_valid_sites` (Fail) stops an empty run.
    4. `count_declarations` (HTTP Request) sends the OData `$filter` (`declarationDate` window, `state in`, `declarationType in`) with `$top=1` and `$inlinecount=allpages` to get the total.
    5. `fetch_pages` (Loop) downloads one `$skip` page per iteration with `$select`, `$orderby=id` and a retry.
    6. `match` (DuckDB) diffs each (disaster, area) against the state as `NEW_DECLARATION`, `NEW_COUNTY`, `NEW_PROGRAM` (IH, IA, PA or HM newly declared), `UNCHANGED` or `BASELINE` (state watched for the first time). It maps areas to sites by FIPS, county name, statewide `000` rows and tribal areas, and links declarations that share an `incidentId`.
    7. `save_state` (KV Set) stores the state; `data_quality` warns about skipped sites, ambiguous names or a row count that differs from `$inlinecount`.
    8. `route_alerts` (If) runs when something changed: `each_type` (Loop) and `by_type` (Switch) send one Slack message per type (`DR` major disaster, `EM` emergency, `FM` fire management), each explaining what that type means. Otherwise `nothing_new` logs the counts. `summary` closes the run.

    ## What you get

    - A CSV per site and declaration: match type, programs, newly declared programs, status, dates, related declarations and the FEMA link; sites with nothing in force are `CLEAR`.
    - Alerts split by type, so a fire management grant does not read like a major disaster.
    - Amendments caught: counties added weeks later and programs (often IH) declared after the first notice.
    - Tribal designations matched to the site that names them instead of lost under county code 000.
    - Each change alerts once; a newly added state starts as a baseline. No API key.

    ## Who it's for

    - Insurance and claims teams tracking catastrophe declarations against insured locations.
    - Supply-chain risk teams handling force-majeure for supplier counties.
    - Lenders applying disaster forbearance by county.
    - Multi-site operators and HR teams pointing staff to assistance.

    ## Why orchestrate this with Kestra

    - Count, paging, retries and KV state are declarative: no paging script or state file.
    - DuckDB reads the pages, sites and state as `inputFiles`, so matching and diffing are one SQL task.
    - `If`, `Loop` and `Switch` keep Slack quiet on quiet days and route by type; `allowFailure` keeps the run going without a webhook.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins, and HTTPS to `www.fema.gov`.
    - County FIPS codes where possible; a misspelt county name looks like a county with no declaration (the summary lists name-matched sites with nothing in the window).
    - The filter uses `declarationDate`, not `lastRefresh`: FEMA refreshes in bulk (one October 2026 refresh touched over 10,000 rows back to 2012). `iaProgramDeclared` is legacy; recent declarations use `ihProgramDeclared`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the alerts (optional; without it alerts stay in the WARN log and the CSV).

    ## Quick start

    1. Optionally add `SLACK_WEBHOOK_URL`.
    2. Execute with the default sites. The first run is a baseline and, with `alert_on_baseline: true`, posts what is in force. When tested: DR-4933-IN and EM-3651-IN for Indianapolis (same incident), DR-4930-MS with IH for Gulfport, EM-3657-GA (Hurricane Isaias) for Atlanta, six Washoe County fire declarations for Reno, EM-3650-WA for Yakima County and the Yakama Reservation; Phoenix was clear.
    3. Execute again: everything is `UNCHANGED`.
    4. Put in your own `sites` and enable `daily`.

    ## How to extend

    - Add an owner or webhook per site and route each site's alert to its own channel.
    - Join the CSV to policy or loan tables in your warehouse to list exposed contracts.
    - Pull OpenFEMA `FemaWebDisasterSummaries` for declared disasters to size the impact.

    ## Links

    - [OpenFEMA API](https://www.fema.gov/about/openfema/api) and [Disaster Declarations Summaries v2](https://www.fema.gov/openfema-data-page/disaster-declarations-summaries-v2)
    - [HTTP Request](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request), [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download) and [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set), [Switch](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.switch) and [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Business
  subTags:
    - Policy & Compliance
    - Reporting & Digests
  ee: false
  demo: false
