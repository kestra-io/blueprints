id: caa-and-certificate-issuer-audit
namespace: company.team

description: >
  For every domain you list, read its DNS CAA records and the certificate its server really
  presents, then check three things: the domain has a CAA policy, the live certificate was issued by
  a CA that the CAA policy allows, and the issuer is on your own approved list. Alert Slack on any
  mismatch.

inputs:
  - id: domains
    type: ARRAY
    itemType: STRING
    displayName: Domains to audit
    description: Domain names whose HTTPS certificate and CAA records should be checked.
    defaults:
      - github.com
      - google.com
      - kestra.io

  - id: approved_issuers
    type: ARRAY
    itemType: STRING
    displayName: Approved certificate issuers (optional)
    description: >
      Organisation names your company allows, as they appear in the certificate, for example
      "Let's Encrypt" or "DigiCert Inc". Leave empty to skip this check and only compare against CAA.
    defaults: []

  - id: resolver_url
    type: STRING
    displayName: DNS-over-HTTPS resolver URL
    description: A resolver that returns the JSON format (Cloudflare, Google dns.google/resolve, or your own).
    defaults: https://cloudflare-dns.com/dns-query

tasks:
  - id: audit_domains
    type: io.kestra.plugin.scripts.python.Script
    description: >
      Look up CAA records over DNS-over-HTTPS (walking up to the parent domain as RFC 8659 says),
      open a real TLS connection to read the issuer of the served certificate, and compare. A lookup
      or handshake that fails is reported as ERROR, never as compliant. Python standard library only.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    outputFiles:
      - caa-report.md
      - caa-report.json
    script: |
      import json
      import socket
      import ssl
      import urllib.parse
      import urllib.request

      domains = json.loads(r'''{{ inputs.domains | toJson }}''')
      resolver_url = "{{ inputs.resolver_url }}"
      approved = [a.lower() for a in json.loads(r'''{{ inputs.approved_issuers | default([]) | toJson }}''')]

      # CAA issuer domain -> words that appear in the certificate issuer organisation
      CA_NAMES = {
          "letsencrypt.org": ["let's encrypt", "internet security research group"],
          "pki.goog": ["google trust services"],
          "digicert.com": ["digicert"],
          "sectigo.com": ["sectigo", "comodo"],
          "comodoca.com": ["sectigo", "comodo"],
          "amazon.com": ["amazon"],
          "amazontrust.com": ["amazon"],
          "amazonaws.com": ["amazon"],
          "globalsign.com": ["globalsign"],
          "godaddy.com": ["godaddy", "go daddy"],
          "ssl.com": ["ssl corporation", "ssl.com"],
          "entrust.net": ["entrust"],
          "buypass.com": ["buypass"],
          "zerossl.com": ["zerossl"],
      }

      def doh_caa(name):
          url = resolver_url + "?" + urllib.parse.urlencode({"name": name, "type": "CAA"})
          req = urllib.request.Request(url, headers={"accept": "application/dns-json", "User-Agent": "kestra-caa-audit"})
          with urllib.request.urlopen(req, timeout=15) as resp:
              return json.load(resp)

      def caa_records(domain):
          """Return (zone where CAA was found, list of (tag, value)) walking up the DNS tree."""
          labels = domain.split(".")
          for i in range(len(labels) - 1):
              zone = ".".join(labels[i:])
              answer = doh_caa(zone)
              recs = []
              for a in answer.get("Answer", []):
                  if a.get("type") == 257:
                      data = a["data"]
                      if data.startswith("\\#"):
                          raw = bytes.fromhex("".join(data.split()[2:]))
                          tag_len = raw[1]
                          recs.append((raw[2:2 + tag_len].decode(), raw[2 + tag_len:].decode()))
                      else:
                          parts = data.split(None, 2)
                          recs.append((parts[1], parts[2].strip('"')))
              if recs:
                  return zone, recs
          return None, []

      def served_issuer(domain):
          ctx = ssl.create_default_context()
          with socket.create_connection((domain, 443), timeout=15) as sock:
              with ctx.wrap_socket(sock, server_hostname=domain) as tls:
                  cert = tls.getpeercert()
          issuer = {k: v for rdn in cert["issuer"] for (k, v) in rdn}
          return issuer.get("organizationName", issuer.get("commonName", "unknown"))

      results = []
      for domain in domains:
          domain = domain.strip().rstrip(".").lower()
          row = {"domain": domain, "status": "OK", "issuer": "", "caa": [], "problems": []}
          try:
              zone, recs = caa_records(domain)
              row["caa"] = sorted({v.split(";")[0].strip() for t, v in recs if t == "issue" and v.strip() not in ("", ";")})
              if not recs:
                  row["problems"].append("no CAA record: any CA may issue certificates for this domain")
          except Exception as exc:
              row["problems"].append(f"CAA lookup failed: {type(exc).__name__}: {exc}")
              recs = []
          try:
              row["issuer"] = served_issuer(domain)
          except Exception as exc:
              row["problems"].append(f"TLS check failed: {type(exc).__name__}: {exc}")
          issuer = row["issuer"].lower()
          if issuer and row["caa"]:
              allowed_words = [w for ca in row["caa"] for w in CA_NAMES.get(ca.lower(), [ca.lower()])]
              if not any(w in issuer for w in allowed_words):
                  row["problems"].append(f"served certificate is from {row['issuer']}, which the CAA policy ({', '.join(row['caa'])}) does not list")
          if issuer and approved and not any(a in issuer for a in approved):
              row["problems"].append(f"issuer {row['issuer']} is not on the approved list")
          if row["problems"]:
              row["status"] = "ERROR" if any("failed" in p for p in row["problems"]) else "VIOLATION"
          results.append(row)

      findings = [r for r in results if r["status"] != "OK"]
      lines = ["| Domain | Status | Served issuer | CAA allows | Problems |", "|---|---|---|---|---|"]
      for r in results:
          lines.append(f"| {r['domain']} | {r['status']} | {r['issuer'] or '-'} | {', '.join(r['caa']) or '-'} | {'; '.join(r['problems']) or '-'} |")
      with open("caa-report.md", "w") as fh:
          fh.write("\n".join(lines) + "\n")
      with open("caa-report.json", "w") as fh:
          json.dump(results, fh, indent=2)

      summary = " | ".join(f"{r['domain']}: {'; '.join(r['problems'])}" for r in findings)
      print("::" + json.dumps({"outputs": {
          "findings": len(findings),
          "attention": bool(findings),
          "summary": summary if findings else f"All {len(results)} domains have a CAA policy and a certificate from an allowed issuer.",
      }}) + "::")

  - id: needs_attention
    type: io.kestra.plugin.core.flow.If
    description: Alert only when a domain has no CAA policy, a certificate its CAA does not allow, or could not be checked.
    condition: "{{ outputs.audit_domains.vars.attention }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: CAA and certificate issuer audit - {{ outputs.audit_domains.vars.summary }} (execution {{ execution.id }})"
          }
    else:
      - id: log_all_compliant
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.audit_domains.vars.summary }}"

errors:
  - id: alert_audit_failed
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "CAA and certificate issuer audit FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check the task logs."
      }

outputs:
  - id: report
    type: FILE
    value: "{{ outputs.audit_domains.outputFiles['caa-report.md'] }}"

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 7 * * 1"
    disabled: true

extend:
  title: Audit CAA Records and the Certificate Issuer Your Domains Really Serve
  shortDescription: Reads each domain's DNS CAA policy and the certificate its server presents, then alerts Slack when there is no CAA, the issuer is not allowed by it, or the issuer is not on your approved list.
  metaTitle: CAA Record and Certificate Issuer Audit with Kestra
  metaDescription: Check that every domain has a CAA policy and serves a certificate from a CA that policy allows and your company approves. Alert Slack on mismatch.
  description: |
    A CAA record tells certificate authorities which of them may issue for your domain. Many domains have none, and some serve certificates from a CA nobody approved. This blueprint reads each domain's CAA records and the certificate its server really presents, and tells Slack when they disagree with each other or with your own approved list of issuers.

    Expiry monitors tell you a certificate is about to run out. This one tells you whether the right CA issued it.

    ## How it works

    1. `audit_domains` (`io.kestra.plugin.scripts.python.Script`) runs in a Python container.
    2. For each domain it asks a public DNS-over-HTTPS resolver for CAA records, walking up to the parent domain as RFC 8659 describes.
    3. It opens a real TLS connection on port 443 and reads the issuer organisation of the served certificate.
    4. It flags a domain with no CAA record, a served issuer that the CAA policy does not list, and, if you set `approved_issuers`, an issuer that is not on that list.
    5. A lookup or handshake that fails is ERROR, never compliant. `needs_attention` (`io.kestra.plugin.core.flow.If`) alerts Slack only on findings.

    ## What you get

    - A table of every domain with its served issuer, the CAs its CAA allows and each problem.
    - A Slack alert only when something is wrong.
    - A failure alert if the audit itself breaks.

    ## Who it's for

    Security and platform teams that want a single approved set of certificate authorities across all their domains.

    ## Why orchestrate this with Kestra

    The check is cheap but must run on a schedule across many domains, keep a report per run and reach the right channel. Kestra provides that, and the domain list can come from your DNS provider.

    ## Prerequisites

    - A worker that can run Docker task runners.
    - Outbound HTTPS access to the DNS-over-HTTPS resolver (`cloudflare-dns.com` by default) and to port 443 of the domains you list.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook that receives the alerts.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Replace the `domains` input and optionally set `approved_issuers` to the CA organisation names you allow. Change `resolver_url` if you use another DNS-over-HTTPS resolver.
    3. Run the flow once and read the `report` output.
    4. Remove `disabled: true` from the `weekly_audit` trigger to run it every Monday.

    ## How to extend

    - Export the domain list from your DNS provider in a first task.
    - Open a ticket per finding instead of a Slack message.
    - Add more CAs to the name table in the script.

    ## Links

    - [Kestra Python script plugin](https://kestra.io/plugins/plugin-script-python)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-notifications)
    - [RFC 8659: DNS CAA Resource Record](https://www.rfc-editor.org/rfc/rfc8659)
    - [Cloudflare DNS over HTTPS JSON API](https://developers.cloudflare.com/1.1.1.1/encryption/dns-over-https/make-api-requests/dns-json/)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
