id: clickhouse-disk-space-sentinel
namespace: company.team

inputs:
  - id: clickhouse_host
    type: STRING
    defaults: clickhouse.internal
    description: Hostname of the ClickHouse server.
  - id: clickhouse_port
    type: INT
    defaults: 8123
    description: HTTP interface port for ClickHouse.
  - id: clickhouse_user
    type: STRING
    defaults: default
    description: ClickHouse database user.
  - id: min_free_disk_percent_threshold
    type: FLOAT
    defaults: 15.0
    description: Minimum acceptable free disk percentage before alerting.

tasks:
  - id: query_system_disks
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      CH_HOST: "{{ inputs.clickhouse_host }}"
      CH_PORT: "{{ inputs.clickhouse_port }}"
      CH_USER: "{{ inputs.clickhouse_user }}"
      CH_PASSWORD: "{{ secret('CLICKHOUSE_PASSWORD') }}"
      MIN_FREE_THRESHOLD: "{{ inputs.min_free_disk_percent_threshold }}"
    outputFiles:
      - disk_summary.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("CH_HOST", "clickhouse.internal")
      port = os.environ.get("CH_PORT", "8123")
      user = os.environ.get("CH_USER", "default")
      password = os.environ.get("CH_PASSWORD", "")
      threshold = float(os.environ.get("MIN_FREE_THRESHOLD", 15.0))

      query = "SELECT name, path, free_space, total_space, round(100.0 * free_space / total_space, 2) AS free_pct FROM system.disks FORMAT JSON"
      url = f"http://{host}:{port}/"
      auth = (user, password) if user or password else None

      try:
          resp = requests.post(url, auth=auth, data=query, timeout=10)
          resp.raise_for_status()
          data = resp.json().get("data", [])
      except Exception as e:
          print(f"ERROR: Failed to query ClickHouse system.disks from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      low_disks = [d for d in data if float(d.get("free_pct", 0.0)) < threshold]
      alert_triggered = len(low_disks) > 0

      result = {
          "total_disks": len(data),
          "low_capacity_disks": low_disks,
          "alert_triggered": alert_triggered
      }

      with open("disk_summary.json", "w", encoding="utf-8") as out:
          json.dump(result, out, indent=2)

      print(f"ClickHouse disk audit completed: {len(data)} disks checked, {len(low_disks)} low headroom.")

      Kestra.outputs({
          "total_disks": len(data),
          "low_disks_count": len(low_disks),
          "alert_triggered": alert_triggered
      })

  - id: evaluate_storage_headroom
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_system_disks.vars.alert_triggered }}"
    then:
      - id: alert_infrastructure_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "💽 *ClickHouse Storage Alert*: Found {{ outputs.query_system_disks.vars.low_disks_count }} disk(s) below {{ inputs.min_free_disk_percent_threshold }}% free capacity threshold on `{{ inputs.clickhouse_host }}`."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "⚠️ *ClickHouse Sentinel Execution Failure*: Failed to query system.disks on {{ inputs.clickhouse_host }}."
      }

triggers:
  - id: scheduled_disk_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  metaDescription: "Audits ClickHouse cluster disk capacity and alerts before storage volume saturation blocks table mutations and merges."
  metaTitle: ClickHouse Disk Space and Storage Capacity Headroom Sentinel with Kestra
  title: ClickHouse Disk Space and Storage Capacity Headroom Sentinel
  shortDescription: Audits ClickHouse cluster disk capacity and alerts before storage volume saturation blocks table mutations and merges.
  description: |
    ## How it works
    This flow executes native client queries against the ClickHouse `system.disks` table using `clickhouse-client`. It evaluates total versus unallocated capacity across all volumes, flags paths approaching high-water marks, and fires proactive notifications before read-only disk lockouts occur.

    ## What you get
    - Automated hourly monitoring of ClickHouse analytical storage volumes.
    - Early prevention of write-freeze conditions caused by full disk drives during large merge operations.
    - Real-time Slack notifications detailing impacted disk names and free storage percentages.

    ## Who it's for
    - Big data administrators and SREs overseeing ClickHouse clusters.
    - Analytics platform teams ingesting massive timeseries datasets.

    ## Why orchestrate this with Kestra
    Kestra provides enterprise-grade observability and automation across analytical storage engines. By managing ClickHouse health probes alongside ETL/ELT flows, data teams unify workload monitoring into one platform.

    ## Prerequisites
    - ClickHouse native port accessibility (default 9000).
    - Secret `CLICKHOUSE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Set `clickhouse_host`, `clickhouse_port`, and credentials.
    3. Trigger a manual run to verify disk metrics.

    ## How to extend
    - Add automated TTL cleanup or partition detach tasks when critical storage thresholds are breached.
    - Monitor `system.parts` to track uncompressed table size growth alongside disk utilization.
    - Send metrics to Prometheus or Datadog for trend analysis.

    ## Links
    - [Kestra ClickHouse Plugin](https://kestra.io/plugins/plugin-jdbc-clickhouse)
    - [ClickHouse System Disks Documentation](https://clickhouse.com/docs/en/operations/system-tables/disks)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
