id: mongodb-cursor-timeout-churn-sentinel
namespace: company.database

inputs:
  - id: mongo_uri
    type: STRING
    defaults: "mongodb://mongodb.internal:27017"
    description: MongoDB connection URI string.
  - id: max_timedout_cursors
    type: INT
    defaults: 100
    description: "Maximum allowable cumulative timed out cursors before alerting (default 100)."

tasks:
  - id: query_cursor_stats
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pymongo==4.15.3
      - kestra==2.0.0
    script: |
      from pymongo import MongoClient
      import sys
      from kestra import Kestra

      mongo_uri = "{{ inputs.mongo_uri }}"
      try:
          client = MongoClient(mongo_uri, serverSelectionTimeoutMS=5000)
          status = client.admin.command("serverStatus")
          cursors = status.get("metrics", {}).get("cursor", {})

          timed_out = int(cursors.get("timedOut", 0))
          open_cursors = int(cursors.get("open", {}).get("total", 0))

          print(f"Timed out cursors: {timed_out}, open cursors: {open_cursors}")

          Kestra.outputs({
              "timed_out": timed_out,
              "open_cursors": open_cursors
          })
      except Exception as e:
          print(f"Error querying MongoDB cursor metrics: {e}", file=sys.stderr)
          sys.exit(1)

  - id: evaluate_cursor_leaks
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_cursor_stats.vars.timed_out | int > inputs.max_timedout_cursors }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 MongoDB Cursor Timeout Leak Alert",
                "text": "MongoDB instance has recorded *{{ outputs.query_cursor_stats.vars.timed_out }} timed out cursors* (Open: {{ outputs.query_cursor_stats.vars.open_cursors }})! Client applications are opening unindexed large scans or abandoning cursors without closing them, pinning server memory.",
                "footer": "Kestra Database Sentinel • MongoDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MongoDB Cursor Sentinel Failure",
            "text": "Failed to query MongoDB serverStatus. Verify connection URI and network reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

outputs:
  - id: timed_out
    type: INT
    value: "{{ outputs.query_cursor_stats.vars.timed_out }}"
  - id: open_cursors
    type: INT
    value: "{{ outputs.query_cursor_stats.vars.open_cursors }}"

extend:
  metaDescription: "Audits MongoDB server status for elevated cursor timeouts to detect abandoned client queries and memory resource leaks."
  metaTitle: MongoDB Cursor Timeout Rate and Resource Leak Sentinel with Kestra
  title: MongoDB Cursor Timeout Rate and Resource Leak Sentinel
  shortDescription: Audits MongoDB server status for elevated cursor timeouts to detect abandoned client queries and memory resource leaks.
  description: |
    ## How it works
    This workflow connects to a MongoDB database via a Python task in Docker to evaluate server status cursor metrics (`metrics.cursor.timedOut` and `metrics.cursor.open`). By default, MongoDB cursors time out after 10 minutes of client inactivity to reclaim server-side memory pins. When microservices iterate slowly through large collections, encounter unhandled client-side exceptions, or execute unindexed queries that exceed socket timeouts, thousands of cursors time out. This workflow tracks cursor timeout counts and alerts database teams before memory exhaustion occurs.

    ## What you get
    - Real-time visibility into abandoned or leaking database cursors in MongoDB.
    - Prevents WiredTiger cache pollution caused by lingering cursor context pins.
    - Actionable metrics on open versus timed-out database cursors.

    ## Who it's for
    - MongoDB Database Administrators and Backend Microservice Developers.
    - SREs troubleshooting database connection pool memory creep.

    ## Why orchestrate this with Kestra
    - **Continuous Health Auditing**: Automates server status inspection on a recurring schedule.
    - **Decoupled Monitoring**: Evaluates database operational health without invasive agents.
    - **Instant Team Escalation**: Delivers structured notifications with cursor metrics to Slack.

    ## Prerequisites
    - MongoDB cluster accessible from Kestra worker.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input MongoDB connection URI.
    3. Run the workflow to inspect cursor metrics.

    ## How to extend
    - Inspect `metrics.cursor.open.noTimeout` to identify risky cursors created with `noCursorTimeout()`.
    - Automatically profile slow queries via `system.profile`.

    ## Links
    - [MongoDB Server Status Cursor Metrics](https://www.mongodb.com/docs/manual/reference/command/serverStatus/#mongodb-serverstatus-metrics.cursor)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-script-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
