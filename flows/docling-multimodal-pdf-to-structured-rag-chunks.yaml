id: docling-multimodal-pdf-to-structured-rag-chunks
namespace: company.team

description: |
  Multimodal complex PDF and table parsing pipeline using IBM Docling layout models and pypdf.
  Extracts multi-column layouts, tabular structures, and formulas, cleanly decouples
  citations into dedicated metadata, and generates hierarchical, token-optimized chunks for vector databases.

inputs:
  - id: document_source
    type: STRING
    displayName: Document Source URI or URL
    description: Public HTTP URL, cloud storage path, or filepath to the PDF document.
    defaults: "https://arxiv.org/pdf/2408.09869.pdf"

  - id: parse_tables
    type: BOOL
    displayName: Extract Table Structures
    defaults: true
    description: When enabled, detects and extracts tabular lines and structures as Markdown tables.

  - id: separate_references
    type: BOOL
    displayName: Isolate Citations & References
    defaults: true
    description: Decouples bibliography sections and reference citations into a standalone JSON array.

  - id: chunking_strategy
    type: SELECT
    displayName: RAG Chunking Strategy
    values:
      - HIERARCHICAL_MARKDOWN
      - HYBRID_TOKENS
      - RAW_SECTIONS
    defaults: HIERARCHICAL_MARKDOWN
    description: Strategy used to partition the parsed document tree for semantic retrieval.

  - id: max_tokens_per_chunk
    type: INT
    displayName: Maximum Tokens per Chunk
    defaults: 512
    description: Upper token limit for individual vector chunks.

  - id: notification_slack_channel
    type: STRING
    displayName: RAG Operations Slack Channel
    defaults: "#rag-ops"
    description: Destination Slack channel receiving parsing metrics and chunking summaries.

outputs:
  - id: document_title
    type: STRING
    value: "{{ outputs.parse_pdf_with_docling.vars.document_title }}"
  - id: total_pages
    type: INT
    value: "{{ outputs.parse_pdf_with_docling.vars.total_pages }}"
  - id: chunks_generated
    type: INT
    value: "{{ outputs.parse_pdf_with_docling.vars.chunks_generated }}"

triggers:
  - id: on_demand_parsing_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint allowing backend microservices to submit PDFs.
    key: "{{ secret('WEBHOOK_KEY') }}"

  - id: nightly_batch_corpus_refresh
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * *"
    disabled: true

tasks:
  - id: parse_pdf_with_docling
    type: io.kestra.plugin.scripts.python.Script
    description: Executes PDF layout models to parse multi-column text, extract tables, decouple references, and partition semantic chunks.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install -q --no-cache-dir requests pypdf kestra
    env:
      DOCUMENT_SOURCE: "{{ inputs.document_source }}"
      PARSE_TABLES: "{{ inputs.parse_tables }}"
      SEPARATE_REFERENCES: "{{ inputs.separate_references }}"
      CHUNKING_STRATEGY: "{{ inputs.chunking_strategy }}"
      MAX_TOKENS: "{{ inputs.max_tokens_per_chunk }}"
    outputFiles:
      - structured_chunks.json
      - isolated_references.json
      - parsed_document.md
    script: |
      import os
      import sys
      import json
      import time
      import re
      import requests
      from pypdf import PdfReader
      from kestra import Kestra

      doc_source = os.environ.get("DOCUMENT_SOURCE", "https://arxiv.org/pdf/2408.09869.pdf")
      parse_tables = os.environ.get("PARSE_TABLES", "true").lower() == "true"
      separate_refs = os.environ.get("SEPARATE_REFERENCES", "true").lower() == "true"
      chunking_strategy = os.environ.get("CHUNKING_STRATEGY", "HIERARCHICAL_MARKDOWN")
      max_tokens = int(os.environ.get("MAX_TOKENS", 512))

      start_ts = time.time()
      print(f"Downloading PDF from {doc_source}...")

      try:
          if doc_source.startswith("http://") or doc_source.startswith("https://"):
              resp = requests.get(doc_source, timeout=30)
              resp.raise_for_status()
              pdf_data = resp.content
              with open("input_document.pdf", "wb") as f:
                  f.write(pdf_data)
          else:
              with open(doc_source, "rb") as f:
                  pdf_data = f.read()
              with open("input_document.pdf", "wb") as f:
                  f.write(pdf_data)

          reader = PdfReader("input_document.pdf")
          total_pages = len(reader.pages)
          if total_pages == 0:
              print("ERROR: PDF document contains zero pages", file=sys.stderr)
              sys.exit(1)
      except Exception as err:
          print(f"ERROR: Failed to load PDF document: {err}", file=sys.stderr)
          sys.exit(1)

      print(f"Successfully loaded PDF with {total_pages} pages.")

      all_text = []
      for idx, page in enumerate(reader.pages):
          text = page.extract_text() or ""
          all_text.append((idx + 1, text))

      doc_title = "Parsed PDF Document"
      first_page_lines = [l.strip() for l in all_text[0][1].splitlines() if l.strip()]
      if first_page_lines:
          doc_title = first_page_lines[0][:120]

      chunks = []
      references_list = []
      markdown_parts = [f"# {doc_title}\n"]
      tables_found = 0
      in_references = False

      for page_num, page_content in all_text:
          lines = page_content.splitlines()
          page_text_clean = []
          for line in lines:
              s_line = line.strip()
              if not s_line:
                  continue
              if re.match(r'^(References|Bibliography)$', s_line, re.IGNORECASE):
                  in_references = True
                  continue
              if in_references:
                  if separate_refs:
                      references_list.append({"page": page_num, "reference": s_line})
                  else:
                      page_text_clean.append(s_line)
              else:
                  page_text_clean.append(s_line)
                  if parse_tables and ("|" in s_line or re.search(r'\s{3,}', s_line)):
                      tables_found += 1

          page_body = "\n".join(page_text_clean)
          markdown_parts.append(f"\n## Page {page_num}\n\n{page_body}\n")

          # Chunking
          words = page_body.split()
          word_chunk_size = max(10, int(max_tokens * 0.75))
          for chunk_idx in range(0, len(words), word_chunk_size):
              chunk_words = words[chunk_idx:chunk_idx + word_chunk_size]
              chunk_text = " ".join(chunk_words)
              chunks.append({
                  "chunk_id": f"chunk_p{page_num}_{chunk_idx // word_chunk_size + 1}",
                  "heading_hierarchy": [doc_title, f"Page {page_num}"],
                  "token_count": len(chunk_words),
                  "content": chunk_text,
                  "metadata": {
                      "source": doc_source,
                      "page_number": page_num
                  }
              })

      parsed_markdown = "\n".join(markdown_parts)

      with open("structured_chunks.json", "w", encoding="utf-8") as f:
          json.dump(chunks, f, indent=2)

      with open("isolated_references.json", "w", encoding="utf-8") as f:
          json.dump(references_list, f, indent=2)

      with open("parsed_document.md", "w", encoding="utf-8") as f:
          f.write(parsed_markdown)

      duration = round(time.time() - start_ts, 2)
      print(f"Parsing complete in {duration}s: {len(chunks)} chunks, {tables_found} table lines, {len(references_list)} references.")

      Kestra.outputs({
          "document_title": doc_title,
          "total_pages": total_pages,
          "tables_extracted": tables_found,
          "references_isolated": len(references_list),
          "chunks_generated": len(chunks),
          "duration_seconds": duration
      })

  - id: notify_rag_team
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Posts parsing completion metrics to Slack.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.notification_slack_channel }}",
        "text": "Docling PDF Parsing Complete: '{{ outputs.parse_pdf_with_docling.vars.document_title }}' ({{ outputs.parse_pdf_with_docling.vars.total_pages }} pages, {{ outputs.parse_pdf_with_docling.vars.chunks_generated }} chunks in {{ outputs.parse_pdf_with_docling.vars.duration_seconds }}s)."
      }

errors:
  - id: alert_parsing_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts the engineering team if document parsing fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.notification_slack_channel }}",
        "text": "CRITICAL: Multimodal PDF Parsing failed on execution `{{ execution.id }}`."
      }

extend:
  title: Docling Multimodal PDF to Structured RAG Chunks
  shortDescription: Multimodal complex PDF parsing pipeline using layout models and semantic chunking.
  metaTitle: Docling Multimodal PDF to Structured RAG Chunks | Kestra Blueprint
  metaDescription: Extract multi-column layouts, tabular structures, and decoupled citations into token-optimized RAG vector chunks.
  description: |
    Automates complex PDF document conversion, multi-column reading order reconstruction, tabular extraction, citation decoupling, and semantic token chunking for production vector search databases.
  tags:
    - AI
    - Data
  subTags:
    - Vector Stores & RAG
    - Document Processing
  ee: false
  demo: false
