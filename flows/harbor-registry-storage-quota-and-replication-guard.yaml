id: harbor-registry-storage-quota-and-replication-guard
namespace: company.sentinel
description: Audits Harbor container registry storage volume headroom and cross-datacenter replication execution failures to prevent image push rejection.
inputs:
  - id: harbor_api_url
    type: STRING
    defaults: http://harbor.internal/api/v2.0
  - id: max_storage_percent_threshold
    type: INT
    defaults: 85
  - id: max_failed_replications_threshold
    type: INT
    defaults: 0
tasks:
  - id: probe_harbor_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_HEADER=""
        if [ -n "{{ secret('HARBOR_API_TOKEN') }}" ]; then
          AUTH_HEADER="-H Authorization:Bearer {{ secret('HARBOR_API_TOKEN') }}"
        fi

        curl -sf -m 10 $AUTH_HEADER "{{ inputs.harbor_api_url }}/systeminfo/getvolume" > /tmp/harbor_volume.json 2>/dev/null || echo "{}" > /tmp/harbor_volume.json
        curl -sf -m 10 $AUTH_HEADER "{{ inputs.harbor_api_url }}/replication/executions?page=1&page_size=10" > /tmp/harbor_replications.json 2>/dev/null || echo "[]" > /tmp/harbor_replications.json

        python3 - <<'PY' > /tmp/harbor_health.json
        import os, sys, json

        volume_data = {}
        try:
            with open("/tmp/harbor_volume.json", "r") as f:
                volume_data = json.load(f)
        except Exception:
            volume_data = {}

        replications_data = []
        try:
            with open("/tmp/harbor_replications.json", "r") as f:
                replications_data = json.load(f)
                if not isinstance(replications_data, list):
                    replications_data = []
        except Exception:
            replications_data = []

        total_bytes = int(volume_data.get("storage", {}).get("total", 0))
        free_bytes = int(volume_data.get("storage", {}).get("free", 0))
        used_pct = round(((total_bytes - free_bytes) / total_bytes) * 100, 2) if total_bytes > 0 else 0.0

        failed_replications = 0
        for r in replications_data:
            if r.get("status", "").lower() in ["failed", "error"]:
                failed_replications += 1

        res = {
            "storage_total_bytes": total_bytes,
            "storage_free_bytes": free_bytes,
            "storage_used_pct": used_pct,
            "failed_replications_count": failed_replications,
            "total_recent_replications": len(replications_data)
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/harbor_health.json"

  - id: evaluate_storage_and_replication
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_harbor_metrics.outputFiles['/tmp/harbor_health.json'])).storage_used_pct > inputs.max_storage_percent_threshold or fromJson(read(outputs.probe_harbor_metrics.outputFiles['/tmp/harbor_health.json'])).failed_replications_count > inputs.max_failed_replications_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Harbor Container Registry Sentinel Alert*
          *API Endpoint:* `{{ inputs.harbor_api_url }}`
          *Storage Utilization:* `{{ fromJson(read(outputs.probe_harbor_metrics.outputFiles['/tmp/harbor_health.json'])).storage_used_pct }}%` (Threshold: `{{ inputs.max_storage_percent_threshold }}%`)
          *Failed Replications:* `{{ fromJson(read(outputs.probe_harbor_metrics.outputFiles['/tmp/harbor_health.json'])).failed_replications_count }}` (Threshold: `{{ inputs.max_failed_replications_threshold }}`)
          *Total Recent Sync Runs:* `{{ fromJson(read(outputs.probe_harbor_metrics.outputFiles['/tmp/harbor_health.json'])).total_recent_replications }}`
          *Action Required:* Execute Harbor garbage collection to reclaim untagged layers or inspect remote registry endpoint connectivity.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Harbor audit completed for {{ inputs.harbor_api_url }}. Storage used: {{ fromJson(read(outputs.probe_harbor_metrics.outputFiles['/tmp/harbor_health.json'])).storage_used_pct }}%, Failed replications: {{ fromJson(read(outputs.probe_harbor_metrics.outputFiles['/tmp/harbor_health.json'])).failed_replications_count }}."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: Harbor Registry Health Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach Harbor REST API at `{{ inputs.harbor_api_url }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Harbor Registry Storage Quota and Replication Failure Guard
  metaTitle: Harbor Registry Storage Quota Guard | Kestra
  shortDescription: Audits Harbor container registry storage volume headroom and cross-datacenter replication execution failures.
  metaDescription: Audits Harbor container registry storage volume headroom and cross-datacenter replication execution failures to prevent image push rejection.
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits Harbor enterprise container registries for volume storage exhaustion and cross-cluster image replication synchronization failures.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the registry health inspection.
    2. Probes Harbor API v2.0 endpoints (`/systeminfo/getvolume` and `/replication/executions`).
    3. Python parser analyzes storage capacity utilized versus total available volume bytes, and verifies the execution status of recent replication policies.
    4. An `io.kestra.plugin.core.flow.If` condition checks if storage utilization or failed replication counts exceed configured thresholds.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and authentication failures.

    ## What you get

    - Early detection of storage volume saturation before Docker and Helm client pushes fail with quota errors.
    - Visibility into failed cross-datacenter replication tasks that leave edge clusters with missing container images.
    - Automated execution audit trail recorded in Kestra execution artifacts for compliance and capacity planning.

    ## Who it's for

    - DevOps and Platform Engineers maintaining enterprise container registries and artifact storage.
    - SREs responsible for CI/CD artifact availability and multi-region deployment synchronization.

    ## Why orchestrate this with Kestra

    - Declarative registry capacity auditing without maintaining custom monitoring scraper scripts.
    - Centralized secret management for registry administrative tokens via `{{ secret('HARBOR_API_TOKEN') }}`.
    - Seamless alerting and automated remediation pipeline integration in declarative YAML workflows.

    ## Prerequisites

    - Network route from the Kestra worker to the Harbor API endpoint.
    - Administrative API token or Robot account credentials configured in Kestra secrets.

    ### Secrets

    - `HARBOR_API_TOKEN`: Optional bearer token for authenticated Harbor API endpoints.
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.harbor_api_url` to match your Harbor management API endpoint.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual test run to verify telemetry collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated Harbor garbage collection triggers inside the `then` branch.
    - Forward historical storage utilization metrics into ClickHouse or Grafana.
    - Integrate with PagerDuty for critical registry storage full alerts.

    ## Links

    - [Harbor API Documentation](https://goharbor.io/docs/latest/working-with-projects/working-with-images/pulling-pushing-images/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
