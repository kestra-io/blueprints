id: kms-unused-keys-audit
namespace: company.finops

description: |
  Finds customer-managed KMS keys with zero CloudTrail API calls over 90 days.
  Each unused key bills $1/month — small per key, but orphaned keys from
  deleted projects pile up across regions.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit KMS keys in.
  - id: window_days
    type: INT
    defaults: 90
    description: CloudTrail lookback window in days (default 90, the CloudTrail lookup-events maximum).

tasks:
  - id: check_keys
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit KMS keys region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Find customer-managed keys with no CloudTrail activity in the window.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            DAYS={{ inputs.window_days }}
            START=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Auditing KMS keys in $REGION (CloudTrail window: last $DAYS days)"
            aws kms list-keys --region "$REGION" \
              --query 'Keys[].KeyId' --output text | tr '\t' '\n' | grep -v '^$' > /tmp/keys.txt || true
            UNUSED_COUNT=0
            UNUSED_LIST=""
            while read -r KEYID; do
              [ -z "$KEYID" ] && continue
              META=$(aws kms describe-key --region "$REGION" --key-id "$KEYID" \
                --query '[KeyMetadata.KeyManager,KeyMetadata.KeyState,KeyMetadata.Description]' \
                --output text 2>/dev/null)
              MANAGER=$(echo "$META" | cut -f1); STATE=$(echo "$META" | cut -f2)
              if [ "$MANAGER" != "CUSTOMER" ] || [ "$STATE" != "Enabled" ]; then
                echo "key $KEYID: $MANAGER/$STATE - skipped"
                continue
              fi
              EVENTS=$(aws cloudtrail lookup-events --region "$REGION" \
                --lookup-attributes AttributeKey=ResourceName,AttributeValue="$KEYID" \
                --start-time "$START" --max-results 1 \
                --query 'length(Events)' --output text 2>/dev/null)
              case "$EVENTS" in ''|'None') EVENTS=0;; esac
              echo "key $KEYID: customer-managed, enabled, ${EVENTS} CloudTrail events in window"
              if [ "$EVENTS" -eq 0 ]; then
                UNUSED_LIST="${UNUSED_LIST}${KEYID}, "
                UNUSED_COUNT=$((UNUSED_COUNT + 1))
              fi
            done < /tmp/keys.txt
            WASTE=$(python3 -c "print('{:.2f}'.format($UNUSED_COUNT * 1.0))")
            if [ "$UNUSED_COUNT" -gt 0 ]; then HAS_UNUSED=true; else HAS_UNUSED=false; fi
            echo "HAS_UNUSED=$HAS_UNUSED"
            echo "UNUSED_COUNT=$UNUSED_COUNT"
            echo "UNUSED_KEYS=$UNUSED_LIST"
            echo "EST_MONTHLY_WASTE=$WASTE"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report unused keys, stay quiet when every key is active.
        condition: "{{ outputs.audit_region.vars.HAS_UNUSED == 'true' }}"
        then:
          - id: slack_unused
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":key: KMS key audit `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.UNUSED_COUNT }}* customer-managed key(s) with zero API calls over {{ inputs.window_days }}d (~${{ outputs.audit_region.vars.EST_MONTHLY_WASTE }}/mo waste at $1/key).\n`{{ outputs.audit_region.vars.UNUSED_KEYS }}`\nVerify nothing references them, schedule deletion (7-30 day waiting period), then delete."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "All customer-managed KMS keys in {{ outputs.audit_region.vars.REGION_DONE }} saw API activity in the last {{ inputs.window_days }} days."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 06:30 UTC. Shipped disabled; enable after your first manual run.
    cron: "30 6 * * 0"
    disabled: true

extend:
  title: KMS Unused Keys Audit
  metaTitle: Find Unused KMS Keys Wasting Money | Kestra
  shortDescription: Find customer-managed KMS keys with zero CloudTrail API calls over 90 days and get a Slack report of the $1/month-per-key waste.
  metaDescription: Unused KMS keys cost $1/month each. This flow finds keys with zero CloudTrail activity and reports weekly.
  description: |
    Every customer-managed KMS key costs $1/month, and keys are almost never deleted — every finished project, every rotated-away encryption setup leaves keys behind in every region. At $12/year per key it sounds trivial until you count them. This blueprint counts them with real CloudTrail data.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 06:30 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists KMS keys and keeps only customer-managed keys in `Enabled` state (AWS-managed keys are skipped — you can't delete them anyway).
    4. Each key gets a CloudTrail `lookup-events` call over `window_days` (default 90, the lookup-events maximum) — zero events means zero API calls.
    5. An `If` task posts a Slack report with the unused key IDs and the monthly waste at $1/key.

    ## What you get

    - A weekly list of unused customer-managed KMS keys with CloudTrail evidence.
    - Monthly waste estimate so the cleanup gets prioritized.
    - Multi-region coverage in one run.
    - Silence when every key is active.

    ## Who it's for

    Platform and FinOps teams doing cloud hygiene who have never once deleted a KMS key (everyone).

    ## Why orchestrate this with Kestra

    Correlating KMS inventory with CloudTrail activity across regions is a multi-API chore that nobody does by hand twice. As a scheduled flow it runs weekly, the window is an input, every run is logged, and the report lands in Slack. Note the flow only *reports* — KMS deletion has a 7-30 day waiting period, so that step stays human-approved.

    ## Prerequisites

    - AWS credentials with `kms:ListKeys`, `kms:DescribeKey`, and `cloudtrail:LookupEvents` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the KMS and CloudTrail API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the KMS and CloudTrail API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the unused-key report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions where you create KMS keys.
    3. Run manually once and review the unused keys.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Add an approval-gated step that schedules key deletion after review.
    - Check key policies for wildcard principals while you're auditing — unused keys with broad policies are a double win.
    - Alert on keys approaching their rotation age as a bonus hygiene signal.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [KMS pricing](https://aws.amazon.com/kms/pricing/)
    - [Deleting KMS keys](https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
  ee: false
  demo: false
