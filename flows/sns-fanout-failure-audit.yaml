id: sns-fanout-failure-audit
namespace: company.team
description: |
  Audit SNS topic fanout health the moment delivery metrics land, so
  subscribers that silently fail or get filtered out are caught before they
  drift out of sync. A monitoring pipeline POSTs per subscriber delivery
  counters to a keyed webhook, Python computes the failure rate for every
  subscriber against a configurable threshold, a Loop walks the subscriber
  list and alerts on each over threshold entry, and a final If escalates the
  worst offender and fails the run. Healthy fanouts are logged, and the worst
  subscriber, the totals and the full per subscriber table are published as
  outputs.

triggers:
  - id: on_metrics_publish
    type: io.kestra.plugin.core.trigger.Webhook
    description: The monitoring pipeline or a scheduled exporter POSTs per subscriber SNS delivery metrics here so the fanout is audited as soon as a window closes.
    key: "{{ secret('SNS_METRICS_WEBHOOK_KEY') }}"
  - id: daily_fanout_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily 07:00 UTC net that rescores the last day of delivery metrics, shipped disabled until the webhook path is trusted in your environment.
    cron: "0 7 * * *"
    disabled: true

inputs:
  - id: topic_arn
    type: STRING
    defaults: "arn:aws:sns:us-east-1:123456789012:orders.fanout"
    description: ARN of the SNS topic under audit, echoed in the alerts when the posted metrics omit it.
  - id: failure_rate_threshold_pct
    type: FLOAT
    defaults: 10.0
    description: Per subscriber failure rate percentage that flags a subscriber as over threshold for alerting.
  - id: min_failed_deliveries
    type: INT
    defaults: 5
    description: Minimum absolute failed deliveries a subscriber needs before its rate is allowed to flag, so tiny denominators do not page anyone.

tasks:
  # --- 1. fanout score ---
  - id: audit_fanout
    type: io.kestra.plugin.scripts.python.Script
    description: Read the posted delivery metrics or the bundled example window, compute the failure rate per subscriber, flag entries over both the rate and the absolute floor, and emit the worst subscriber, the totals and the full table through the outputs protocol.
    containerImage: python:3.12-slim
    env:
      SNS_METRICS_JSON: "{{ trigger.body ?? '' }}"
      FAILURE_RATE_THRESHOLD_PCT: "{{ inputs.failure_rate_threshold_pct }}"
      MIN_FAILED_DELIVERIES: "{{ inputs.min_failed_deliveries }}"
    script: |
      import json
      import os

      DEFAULT_METRICS = """
      {
        "topic_arn": "arn:aws:sns:us-east-1:123456789012:orders.fanout",
        "window_hours": 24,
        "subscribers": [
          {"subscriber": "orders-processor-lambda", "protocol": "lambda", "delivered": 18420, "failed": 12, "filtered": 340},
          {"subscriber": "orders-dlq-queue", "protocol": "sqs", "delivered": 18700, "failed": 0, "filtered": 0},
          {"subscriber": "finance-mailing-list", "protocol": "email", "delivered": 46, "failed": 8, "filtered": 0},
          {"subscriber": "analytics-firehose", "protocol": "firehose", "delivered": 12004, "failed": 2, "filtered": 88}
        ]
      }
      """


      def as_int(value, fallback=0):
          try:
              return int(value)
          except (TypeError, ValueError):
              try:
                  return int(float(value))
              except (TypeError, ValueError):
                  return fallback


      def as_float(value, fallback=0.0):
          try:
              return float(value)
          except (TypeError, ValueError):
              return fallback


      raw = (os.environ.get("SNS_METRICS_JSON") or "").strip() or DEFAULT_METRICS.strip()
      threshold = as_float(os.environ.get("FAILURE_RATE_THRESHOLD_PCT"), 10.0)
      min_failed = max(0, as_int(os.environ.get("MIN_FAILED_DELIVERIES"), 5))

      outputs = {
          "audit_ok": False,
          "topic": "unknown",
          "subscribers": [],
          "worst_subscriber": "none",
          "worst_failure_rate": 0.0,
          "total_failed": 0,
          "over_threshold_count": 0,
      }

      try:
          payload = json.loads(raw)
      except ValueError:
          payload = None

      if isinstance(payload, dict):
          subscribers = payload.get("subscribers")
          if not isinstance(subscribers, list):
              subscribers = []
          rows = []
          total_failed = 0
          over = 0
          worst_name = "none"
          worst_rate = 0.0
          for sub in subscribers:
              if not isinstance(sub, dict):
                  continue
              delivered = max(0, as_int(sub.get("delivered")))
              failed = max(0, as_int(sub.get("failed")))
              filtered = max(0, as_int(sub.get("filtered")))
              total_failed += failed
              denominator = delivered + failed
              rate = (failed * 100.0 / denominator) if denominator > 0 else 0.0
              flagged = rate >= threshold and failed >= min_failed
              if flagged:
                  over += 1
              name = str(sub.get("subscriber") or sub.get("arn") or "unknown")
              rows.append({
                  "subscriber": name,
                  "protocol": str(sub.get("protocol") or "unknown"),
                  "delivered": delivered,
                  "failed": failed,
                  "filtered": filtered,
                  "failure_rate_pct": round(rate, 2),
                  "over_threshold": flagged,
              })
              if rate > worst_rate:
                  worst_rate = round(rate, 2)
                  worst_name = name
          outputs.update({
              "audit_ok": True,
              "topic": str(payload.get("topic_arn") or "unknown"),
              "subscribers": rows,
              "worst_subscriber": worst_name,
              "worst_failure_rate": worst_rate,
              "total_failed": total_failed,
              "over_threshold_count": over,
          })

      print("audit_ok=%s subscribers=%d over=%d worst=%s rate=%.2f%% failed=%d" % (
          outputs["audit_ok"], len(outputs["subscribers"]), outputs["over_threshold_count"],
          outputs["worst_subscriber"], outputs["worst_failure_rate"], outputs["total_failed"]))
      print("::" + json.dumps({"outputs": outputs}) + "::")

  # --- 2. per subscriber sweep ---
  - id: review_subscribers
    type: io.kestra.plugin.core.flow.Loop
    description: Walk the scored subscriber rows one at a time so each over threshold entry gets its own alert with the exact counters instead of one blended message.
    concurrencyLimit: 1
    values: "{{ outputs.audit_fanout.vars.subscribers }}"
    tasks:
      - id: flag_subscriber
        type: io.kestra.plugin.core.flow.If
        description: Branch on the per subscriber over threshold flag the scorer already computed, keeping the rate and floor policy in one place.
        condition: "{{ item.value.over_threshold }}"
        then:
          - id: alert_subscriber
            type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
            description: Post the failing subscriber, its protocol, the failed and delivered counts and its failure rate so the owning team can repair the endpoint.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "SNS fanout subscriber {{ item.value.subscriber }} ({{ item.value.protocol }}) on {{ inputs.topic_arn }} is over threshold - {{ item.value.failed }} failed of {{ item.value.delivered }} delivered plus {{ item.value.failed }} failed, a {{ item.value.failure_rate_pct }} percent failure rate against the {{ inputs.failure_rate_threshold_pct }} percent limit. {{ item.value.filtered }} delivery(ies) were filtered by policy. Execution {{ execution.id }}."
              }
        else:
          - id: log_subscriber_ok
            type: io.kestra.plugin.core.log.Log
            description: Record the healthy subscriber for the window so the execution history carries the full per subscriber trail.
            message: "SNS subscriber {{ item.value.subscriber }} healthy - {{ item.value.failed }} failed of {{ item.value.delivered }} delivered, rate {{ item.value.failure_rate_pct }} percent under threshold."

  # --- 3. escalation gate ---
  - id: escalate_worst
    type: io.kestra.plugin.core.flow.If
    description: Branch on the audit verdict so a fanout with any over threshold subscriber escalates the worst offender and fails the run, while a healthy fanout is logged.
    condition: "{{ outputs.audit_fanout.vars.audit_ok and outputs.audit_fanout.vars.over_threshold_count > 0 }}"
    then:
      - id: alert_worst
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post the worst subscriber, its rate, the over threshold count and the window failure total so the on call sees the full blast radius in one message.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "SNS fanout audit ESCALATION for {{ inputs.topic_arn }} - worst subscriber {{ outputs.audit_fanout.vars.worst_subscriber }} at {{ outputs.audit_fanout.vars.worst_failure_rate }} percent failure rate, {{ outputs.audit_fanout.vars.over_threshold_count }} subscriber(s) over the {{ inputs.failure_rate_threshold_pct }} percent threshold, {{ outputs.audit_fanout.vars.total_failed }} total failed deliveries in the window. Subscribers are silently out of sync until repaired. Execution {{ execution.id }}."
          }
      - id: fail_audit
        type: io.kestra.plugin.core.execution.Fail
        description: Turn the execution red so the pipeline watching this audit stops instead of assuming the fanout delivered everything.
        errorMessage: "SNS fanout audit found {{ outputs.audit_fanout.vars.over_threshold_count }} subscriber(s) over threshold, worst {{ outputs.audit_fanout.vars.worst_subscriber }} at {{ outputs.audit_fanout.vars.worst_failure_rate }} percent."
    else:
      - id: log_healthy_fanout
        type: io.kestra.plugin.core.log.Log
        description: Record the healthy verdict with the subscriber count and the failure total so a quiet window still leaves evidence the audit ran.
        message: "SNS fanout audit healthy for {{ inputs.topic_arn }} - {{ outputs.audit_fanout.vars.subscribers | length }} subscriber(s) checked, none over threshold, {{ outputs.audit_fanout.vars.total_failed }} failed deliveries in the window."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: worst_subscriber
    type: STRING
    description: Subscriber with the highest failure rate in the window, for example finance-mailing-list, or none when every rate is zero or nothing could be scored.
    value: "{{ outputs.audit_fanout.vars.worst_subscriber }}"
  - id: worst_failure_rate
    type: FLOAT
    description: Failure rate percentage of the worst subscriber, for example 14.81 when eight of fifty four deliveries failed.
    value: "{{ outputs.audit_fanout.vars.worst_failure_rate }}"
  - id: total_failed
    type: INT
    description: Sum of failed deliveries across every subscriber in the scored window.
    value: "{{ outputs.audit_fanout.vars.total_failed }}"
  - id: over_threshold_count
    type: INT
    description: Number of subscribers whose failure rate met both the rate threshold and the absolute delivery floor.
    value: "{{ outputs.audit_fanout.vars.over_threshold_count }}"
  - id: subscribers
    type: ARRAY
    description: Full per subscriber table with delivered, failed, filtered, failure rate and the over threshold flag for each entry.
    value: "{{ outputs.audit_fanout.vars.subscribers }}"

extend:
  title: Audit SNS Fanout Failures Before Subscribers Drift
  metaTitle: SNS Fanout Failure Rate Audit and Alerting
  shortDescription: Score per subscriber SNS delivery metrics, alert Slack on every over threshold subscriber, and fail the run for follow-up.
  metaDescription: "Audit SNS fanout delivery metrics per subscriber, alert Slack when a failure rate crosses the threshold, and fail the run before subscribers drift."
  description: |
    ## How it works

    1. `on_metrics_publish` (`io.kestra.plugin.core.trigger.Webhook`, keyed with the `SNS_METRICS_WEBHOOK_KEY` secret) receives the per subscriber delivery counters from your monitoring pipeline or exporter. `daily_fanout_audit` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 7 * * *`) is the safety net and ships `disabled: true` until an operator turns it on.
    2. `audit_fanout` (`io.kestra.plugin.scripts.python.Script` on `python:3.12-slim`) prefers the posted webhook body and falls back to a bundled example window so trial runs still demonstrate the audit. For every subscriber it computes the failure rate as failed over delivered plus failed, deliberately excluding filtered deliveries which a filter policy dropped on purpose, and flags an entry only when the rate meets `failure_rate_threshold_pct` and the absolute failed count meets `min_failed_deliveries`. The worst subscriber, the over threshold count, the window failure total and the full table are printed as a single `::{"outputs": ...}::` line.
    3. `review_subscribers` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) walks the scored rows one at a time. `flag_subscriber` (`io.kestra.plugin.core.flow.If`) branches on the per row over threshold flag, so a breaching subscriber gets its own `alert_subscriber` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) with the exact counters, and a healthy subscriber is recorded by `log_subscriber_ok`.
    4. `escalate_worst` (`io.kestra.plugin.core.flow.If`) branches on the audit verdict. Any over threshold subscriber reaches `alert_worst` with the worst offender and the window totals, then `fail_audit` (`io.kestra.plugin.core.execution.Fail`) turns the run red. A clean fanout lands on `log_healthy_fanout`.
    5. The flow level `errors` handler (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) reports any failure with the execution id, because a dead auditor looks exactly like a healthy topic.

    ## What you get

    - Per subscriber failure rates with a rate threshold and an absolute floor, so a two of three blip never pages anyone.
    - One focused Slack alert per breaching subscriber plus a worst offender escalation with the window totals.
    - Filtered deliveries tracked alongside failures, so intentional filter policy drops are visible without polluting the failure rate.
    - `worst_subscriber`, `worst_failure_rate`, `total_failed`, `over_threshold_count` and the full `subscribers` table as typed outputs for dashboards and incident follow-up.
    - A disabled daily audit as a second net once the webhook path is trusted.

    ## Who it's for

    - Platform and messaging engineers responsible for SNS fanout topics feeding Lambda, SQS and email subscribers.
    - SREs who suspect subscribers are silently out of sync and need the failing endpoint named with evidence.
    - Reliability leads who want fanout delivery health gated in the same place as the rest of the pipeline checks.

    ## Why orchestrate this with Kestra

    SNS delivery failures disappear into CloudWatch unless somebody builds a dashboard and remembers to read it. Kestra gives the metrics a webhook to land on, a scorer whose rate and floor policy lives in version control, a Loop that alerts per subscriber instead of blending them, a branch that separates escalation from the all clear, and outputs a ticket or weekly report can consume. A Lambda subscribed to the delivery status queue gives you data but no gate, no history and no alert routing.

    ## Prerequisites

    - A worker with Docker access, the scorer runs in `python:3.12-slim`.
    - A monitoring pipeline or exporter that can POST per subscriber delivery counters to the webhook, or rely on the bundled example window for trial runs.
    - A Slack incoming webhook for the per subscriber alerts and for failure alerts.

    ### Secrets

    - `SNS_METRICS_WEBHOOK_KEY`: key segment guarding the metrics webhook URL, anyone holding it can trigger an audit run.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the subscriber alerts and failure alerts.

    ## Quick start

    1. Add the two secrets to your Kestra namespace.
    2. Run the flow once with the default inputs and confirm `worst_subscriber` reads `finance-mailing-list`, `worst_failure_rate` reads about 14.81, `total_failed` reads 22 and `over_threshold_count` reads 1, and that both the per subscriber and the escalation Slack alerts arrived.
    3. Raise `failure_rate_threshold_pct` to 20 and re-run to watch the same window pass as healthy while the counters stay identical.
    4. Point your exporter at `/api/v1/{tenant}/executions/webhook/{namespace}/sns-fanout-failure-audit/{SNS_METRICS_WEBHOOK_KEY}` and enable `daily_fanout_audit` once the path is trusted.

    ## How to extend

    - Extend the scorer with a filtered rate column and a second threshold so filter policy drift, not just failures, raises an alert.
    - Persist the per subscriber table to a warehouse with `io.kestra.plugin.jdbc.postgresql.Queries` to chart fanout reliability over weeks.
    - Fan out per topic with `io.kestra.plugin.core.flow.ForEachItem` over a subflow that audits one topic ARN each.
    - Add an automatic retry publisher step behind an `io.kestra.plugin.core.http.Request` that replays failed deliveries for topics where replay is safe.

    ## Links

    - [SNS delivery status messaging](https://docs.aws.amazon.com/sns/latest/dg/sns-message-delivery-retries.html)
    - [Kestra Loop task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.loop)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra Webhook trigger](https://kestra.io/docs/workflow-components/triggers/webhook)
  tags:
    - Infrastructure
  subTags:
    - aws services
    - failure alerting
    - incident response
  ee: false
  demo: false
