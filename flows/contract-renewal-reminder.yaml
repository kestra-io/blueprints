id: contract-renewal-reminder
namespace: company.team

description: |
  Auto-renew clauses quietly turn one missed notice window into another paid
  year, so this flow runs a staged countdown over every contract in the book
  and reminds the right owner while the notice window is still open. A keyed
  webhook accepts a newly added contract and a disabled weekly schedule stands
  ready as the fallback net; a shell step writes contracts.csv and a python
  step measures each renewal_date against today and that row's notice_days,
  marking rows inside the window as due and the ones within seven days at high
  value as critical. When anything sits inside a window, every owner gets a
  reminder email, the channel gets one Slack summary led by the criticals, and
  one rollup issue tracks the whole batch, while a quiet book is logged as
  clear. Each run exposes the verdict, the action count, the actionable
  contracts and the next deadline as typed outputs.

triggers:
  - id: contract_added
    type: io.kestra.plugin.core.trigger.Webhook
    description: Procurement or legal POSTs here when a contract is added or its renewal terms change, so a fresh countdown runs immediately.
    key: "{{ secret('CONTRACT_RENEWAL_WEBHOOK_KEY') }}"
  - id: weekly_renewal_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled Monday morning sweep that re-checks the whole contract book each week until an operator switches it on.
    cron: "0 6 * * 1"
    disabled: true

inputs:
  - id: notice_days_default
    type: INT
    defaults: 60
    description: Fallback notice period in days for rows that leave notice_days blank, so the countdown still has a window to measure against.
  - id: critical_value_usd
    type: INT
    defaults: 50000
    description: Annual contract value in USD at or above which a renewal within seven days is escalated as critical instead of merely due.

tasks:
  # --- 1. contract book and countdown ---
  - id: renewal_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the fixture written by the shell step is the exact file the countdown script reads.
    tasks:
      - id: write_contracts
        type: io.kestra.plugin.scripts.shell.Commands
        description: Writes contracts.csv from a heredoc of eight rows whose renewal dates are dated forward from today, two inside their notice window with one of them within seven days and high value, the other six still safe.
        commands:
          - |
            set -eu
            cat > contracts.csv <<CONTRACTS_EOF
            counterparty,renewal_date,notice_days,value_usd,owner_email
            Northwind Cloud Services,$(date -d "+5 days" +%F),30,120000,maria.chen@example.com
            Contoso Data Platforms,$(date -d "+45 days" +%F),60,18000,igor.petrov@example.com
            Fabrikam Security Suite,$(date -d "+90 days" +%F),60,24000,sofia.marchetti@example.com
            Litware Logistics Group,$(date -d "+120 days" +%F),90,76000,diego.ramirez@example.com
            AdventureWorks Telecom,$(date -d "+75 days" +%F),30,31000,hana.sato@example.com
            Tailspin Hardware,$(date -d "+200 days" +%F),60,45000,owen.fitzgerald@example.com
            Proseware Hosting,$(date -d "+150 days" +%F),,9900,mira.cohen@example.com
            Alpine Ski House,$(date -d "+85 days" +%F),60,52000,elena.petrova@example.com
            CONTRACTS_EOF
            echo "contract rows $(($(wc -l < contracts.csv) - 1))"

      - id: assess_renewals
        type: io.kestra.plugin.scripts.python.Script
        description: Reads contracts.csv with the csv module, computes days_to_renewal per row, applies the notice window and the critical value threshold, and emits verdict, action_count, contracts and next_deadline through the outputs protocol.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          NOTICE_DAYS_DEFAULT: "{{ inputs.notice_days_default }}"
          CRITICAL_VALUE_USD: "{{ inputs.critical_value_usd }}"
        script: |
          import csv
          import json
          import os
          from datetime import date, datetime

          CSV_FILE = "contracts.csv"
          REQUIRED = ("counterparty", "renewal_date", "notice_days", "value_usd", "owner_email")


          def env_int(name, fallback):
              try:
                  value = int(str(os.environ.get(name, "")).strip())
              except ValueError:
                  return fallback
              return value if value >= 0 else fallback


          def build():
              notice_default = env_int("NOTICE_DAYS_DEFAULT", 60)
              critical_value = env_int("CRITICAL_VALUE_USD", 50000)
              today = date.today()

              header = []
              rows = []
              if os.path.exists(CSV_FILE):
                  with open(CSV_FILE, newline="", encoding="utf-8") as handle:
                      reader = csv.DictReader(handle)
                      header = list(reader.fieldnames or [])
                      rows = [row for row in reader]

              if not all(name in header for name in REQUIRED) or not rows:
                  return ("NO_DATA", 0, [], "none",
                          "contracts.csv is missing required columns or carries no rows")

              records = []
              skipped = 0
              for row in rows:
                  counterparty = (row.get("counterparty") or "").strip()
                  owner_email = (row.get("owner_email") or "").strip()
                  try:
                      renewal = datetime.strptime(
                          (row.get("renewal_date") or "").strip(), "%Y-%m-%d").date()
                  except ValueError:
                      skipped += 1
                      continue
                  if not counterparty or not owner_email:
                      skipped += 1
                      continue
                  try:
                      value_usd = int(float((row.get("value_usd") or "0").strip()))
                  except ValueError:
                      value_usd = 0
                  raw_notice = (row.get("notice_days") or "").strip()
                  try:
                      notice_days = int(raw_notice) if raw_notice else notice_default
                  except ValueError:
                      notice_days = notice_default

                  days_to_renewal = (renewal - today).days
                  action_now = days_to_renewal <= notice_days
                  if days_to_renewal <= 7 and value_usd >= critical_value:
                      urgency = "critical"
                  elif action_now:
                      urgency = "due"
                  else:
                      urgency = "safe"
                  if action_now:
                      records.append({
                          "counterparty": counterparty,
                          "days_to_renewal": days_to_renewal,
                          "urgency": urgency,
                          "value_usd": value_usd,
                          "owner_email": owner_email,
                          "renewal_date": renewal,
                      })

              if not records and skipped == len(rows):
                  return ("NO_DATA", 0, [], "none",
                          "no row carried a readable renewal_date")

              records.sort(key=lambda r: (r["days_to_renewal"], r["counterparty"]))
              contracts = [{
                  "counterparty": r["counterparty"],
                  "days_to_renewal": r["days_to_renewal"],
                  "urgency": r["urgency"],
                  "value_usd": r["value_usd"],
                  "owner_email": r["owner_email"],
              } for r in records]
              action_count = len(contracts)
              verdict = "ACTION_REQUIRED" if action_count else "ALL_CLEAR"
              next_deadline = records[0]["renewal_date"].isoformat() if records else "none"
              summary = "checked %d contract(s), %d inside a notice window, %d skipped" % (
                  len(rows), action_count, skipped)
              return (verdict, action_count, contracts, next_deadline, summary)


          verdict, action_count, contracts, next_deadline, summary = build()
          print(summary)
          print("::" + json.dumps({"outputs": {
              "verdict": verdict,
              "action_count": action_count,
              "contracts": contracts,
              "next_deadline": next_deadline,
          }}) + "::")

  # --- 2. reminder gate and escalation ---
  - id: reminders_gate
    type: io.kestra.plugin.core.flow.If
    description: Branches on the action count so contracts inside their notice window escalate to owner emails, a critical summary and one rollup issue, while a book with nothing due is recorded without waking anyone.
    condition: "{{ outputs.assess_renewals.vars.action_count > 0 }}"
    then:
      - id: notify_each_owner
        type: io.kestra.plugin.core.flow.Loop
        description: Walks the actionable contracts one at a time so every owner is reminded about their own counterparty instead of receiving one crowded digest.
        values: "{{ outputs.assess_renewals.vars.contracts }}"
        concurrencyLimit: 1
        tasks:
          - id: send_owner_reminder
            type: io.kestra.plugin.email.MailSend
            description: Reminds a single owner that their counterparty is inside its notice window, with the days left, the urgency and the value at stake.
            from: "{{ secret('SMTP_FROM') }}"
            to: "{{ item.value.owner_email }}"
            host: "{{ secret('SMTP_HOST') }}"
            username: "{{ secret('SMTP_USERNAME') }}"
            password: "{{ secret('SMTP_PASSWORD') }}"
            port: 465
            subject: "Renewal notice due for {{ item.value.counterparty }} in {{ item.value.days_to_renewal }} days"
            htmlTextContent: |
              <p>{{ item.value.owner_email }},</p>
              <p><strong>{{ item.value.counterparty }}</strong> renews in
              <strong>{{ item.value.days_to_renewal }}</strong> days with an annual
              value of USD {{ item.value.value_usd }}. The notice window is open and
              the current urgency is <strong>{{ item.value.urgency }}</strong>.</p>
              <p>Send the non-renewal notice or confirm the renewal decision with
              legal before the window closes, then reply on the rollup issue.</p>
              <p>Execution {{ execution.id }}</p>
      - id: alert_criticals
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Posts one summary to the channel that leads with every critical contract, then lists the remaining dues and the next deadline.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "Contract renewal reminders - {{ outputs.assess_renewals.vars.action_count }} contract(s) inside their notice window, next deadline {{ outputs.assess_renewals.vars.next_deadline }}. {% for c in outputs.assess_renewals.vars.contracts %}{% if c.urgency == 'critical' %}CRITICAL {{ c.counterparty }} renews in {{ c.days_to_renewal }} days at USD {{ c.value_usd }}. {% endif %}{% endfor %}{% for c in outputs.assess_renewals.vars.contracts %}{% if c.urgency != 'critical' %}Due {{ c.counterparty }} in {{ c.days_to_renewal }} days. {% endif %}{% endfor %}Execution {{ execution.id }}."}
      - id: open_rollup_issue
        type: io.kestra.plugin.github.issues.Create
        description: Opens one rollup issue listing every contract inside its window with owner, days left, urgency and value, so the whole batch is worked as a single ticket.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: your-org/contract-registry
        title: "Renewal notice rollup - {{ outputs.assess_renewals.vars.action_count }} contract(s), next deadline {{ outputs.assess_renewals.vars.next_deadline }}"
        body: |
          ## Contract renewal notice rollup

          **{{ outputs.assess_renewals.vars.action_count }}** contract(s) are inside their notice window. The next renewal deadline is **{{ outputs.assess_renewals.vars.next_deadline }}**.

          {% for c in outputs.assess_renewals.vars.contracts %}
          - {{ c.counterparty }} - {{ c.days_to_renewal }} days left - {{ c.urgency }} - USD {{ c.value_usd }} - owner {{ c.owner_email }}
          {% endfor %}

          Verdict **{{ outputs.assess_renewals.vars.verdict }}** from {{ flow.id }} execution {{ execution.id }}.

          Send the notice or record the renewal decision for every line above, then close this issue.
        labels:
          - contracts
          - renewal
    else:
      - id: log_nothing_due
        type: io.kestra.plugin.core.log.Log
        description: Records the quiet outcome in execution history so a run with nothing due still leaves evidence that the countdown was checked.
        message: "No contract is inside its notice window - verdict {{ outputs.assess_renewals.vars.verdict }}, action_count {{ outputs.assess_renewals.vars.action_count }}, next deadline {{ outputs.assess_renewals.vars.next_deadline }}."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    description: One of ACTION_REQUIRED, ALL_CLEAR or NO_DATA depending on whether any contract sits inside its notice window.
    value: "{{ outputs.assess_renewals.vars.verdict }}"
  - id: action_count
    type: INT
    description: Number of contracts whose renewal falls on or before the end of their notice period, zero on a quiet book.
    value: "{{ outputs.assess_renewals.vars.action_count }}"
  - id: contracts
    type: ARRAY
    description: 'Actionable contracts as objects, for example [{"counterparty": "Northwind Cloud Services", "days_to_renewal": 5, "urgency": "critical", "value_usd": 120000, "owner_email": "maria.chen@example.com"}].'
    value: "{{ outputs.assess_renewals.vars.contracts | toJson }}"
  - id: next_deadline
    type: STRING
    description: ISO renewal date of the closest actionable contract, or none when nothing needs a notice.
    value: "{{ outputs.assess_renewals.vars.next_deadline }}"

extend:
  title: Send Countdown Reminders Before Contracts Auto-Renew
  metaTitle: Staged Contract Renewal Countdown Reminders
  shortDescription: Measure every contract against its notice window, email each owner inside it, flag critical renewals on Slack and open one rollup issue.
  metaDescription: Count contracts against their notice windows, email each owner inside the window, flag high-value criticals on Slack and open one rollup issue.
  description: |
    A contract that auto-renews because nobody sent the notice in time is a budget line nobody approved. This flow keeps a staged countdown over the contract book, so legal and procurement see the window while it is still open instead of after the renewal.

    ## How it works

    1. `contract_added` (`io.kestra.plugin.core.trigger.Webhook`, keyed) accepts a new or updated contract from procurement and starts a fresh countdown on the spot. `weekly_renewal_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * 1`) is the Monday morning net that re-checks the whole book once someone switches it on.
    2. `renewal_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) gives the run one directory, so the file written by the shell task is the file the countdown script reads.
    3. `write_contracts` (`io.kestra.plugin.scripts.shell.Commands`) drops `contracts.csv` through a heredoc of eight rows dated forward from today with `date -d`. Two rows sit inside their notice window, one of those is within seven days and above the critical value, and the remaining six stay safe, with one row leaving `notice_days` blank to exercise the default.
    4. `assess_renewals` (`io.kestra.plugin.scripts.python.Script`) parses the file with the `csv` module, computes `days_to_renewal` for each row, compares it with the row's `notice_days` or `notice_days_default`, and sets urgency to `critical` when seven days or fewer remain and the value is at or above `critical_value_usd`, to `due` for the rest inside a window, and to `safe` otherwise. It prints the repo-standard `::` plus json outputs plus `::` payload carrying `verdict`, `action_count`, `contracts` and `next_deadline`, and reports `NO_DATA` when the file has no usable header or rows.
    5. `reminders_gate` (`io.kestra.plugin.core.flow.If`) branches on `action_count` being above zero.
    6. In the reminder branch `notify_each_owner` (`io.kestra.plugin.core.flow.Loop`) walks the actionable contracts one at a time and `send_owner_reminder` (`io.kestra.plugin.email.MailSend`) emails that owner their own counterparty with days left, urgency and value. `alert_criticals` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts one summary led by every `critical` line, then `open_rollup_issue` (`io.kestra.plugin.github.issues.Create`) files a single labeled issue listing the whole batch. The quiet branch records `log_nothing_due` (`io.kestra.plugin.core.log.Log`) with the verdict.
    7. The `errors` block posts to Slack whenever the fixture, the calculation or a notifier breaks, because a crashed countdown must never look like a calm quarter.

    ## What you get

    - `verdict` (STRING): `ACTION_REQUIRED` when at least one contract is inside its notice window, `ALL_CLEAR` when none is, `NO_DATA` when the file carries no usable rows.
    - `action_count` (INT): contracts that need a notice or a renewal decision now, zero on a quiet book.
    - `contracts` (ARRAY): one object per actionable contract with `counterparty`, `days_to_renewal`, `urgency`, `value_usd` and `owner_email`, sorted by the days remaining.
    - `next_deadline` (STRING): ISO renewal date of the closest actionable contract, `none` when nothing needs a notice.
    - One email per owner, one Slack summary that leads with the criticals, and one rollup issue when action is required, plus a log line when it is not.

    ## Who it's for

    - Legal and procurement teams who own notice obligations and cannot afford a single missed auto-renew window.
    - Finance partners who want the high-value renewals surfaced first, ahead of the small subscriptions.
    - Contract managers who prefer one rollup ticket and a targeted owner email over a spreadsheet nobody opens.

    ## Why orchestrate this with Kestra

    A calendar reminder works only until somebody clears it, and a spreadsheet with renewal dates runs only when somebody remembers to open it. Kestra gives the countdown a keyed webhook and a disabled weekly schedule, a branch that separates an urgent quarter from a quiet one, a loop that turns one parse into one email per owner, and SMTP, Slack and GitHub routing from a single versioned file. The verdict, the count and the next deadline are typed outputs, so a downstream close process or a dashboard can read the state without scraping logs, and the `errors` handler keeps a broken run visible.

    ## Prerequisites

    - Python 3 and a shell on the Kestra worker with GNU `date`, the calculation uses only `csv`, `json`, `os` and `datetime`.
    - An SMTP relay reachable from the worker, with a sender address allowed to use it.
    - A Slack incoming webhook for the critical summary and for failure alerts.
    - A GitHub token that can open issues in `your-org/contract-registry`, with classic PAT scope `repo` or fine-grained **Issues: write**.
    - Your own contract export in place of the heredoc fixture, keeping the same five columns.

    ### Secrets

    - `CONTRACT_RENEWAL_WEBHOOK_KEY`: key segment guarding the webhook URL, anyone holding it can start a countdown.
    - `SMTP_FROM`, `SMTP_HOST`, `SMTP_USERNAME`, `SMTP_PASSWORD`: relay and credentials used by `send_owner_reminder`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the critical summary and for failure alerts.
    - `GITHUB_TOKEN`: token used to open the rollup issue.

    ## Quick start

    1. Add the six secrets to your namespace and import the flow.
    2. Run once with the default inputs. The bundled fixture puts Northwind Cloud Services five days out at USD 120000, so the run reports `verdict: ACTION_REQUIRED`, `action_count: 2` and `next_deadline` five days ahead, emails two owners, posts the critical line to Slack and opens the rollup issue.
    3. Raise `critical_value_usd` above 120000 to watch the same run degrade the critical line to `due` while the count stays at 2.
    4. Empty the heredoc rows inside `write_contracts` and run again to see `NO_DATA` recorded by the gate.
    5. Trigger `contract_added` at `/api/v1/{tenant}/executions/webhook/{namespace}/contract-renewal-reminder/{CONTRACT_RENEWAL_WEBHOOK_KEY}`, then enable `weekly_renewal_sweep` once the book matches your registry.

    ## How to extend

    - Replace the heredoc with `io.kestra.plugin.jdbc.postgresql.Queries` against the contract registry, or with `io.kestra.plugin.git.Clone` pulling the export, and keep the same python verdict.
    - Add a second threshold input for a warning tier, so contracts within thirty days get a Slack line without an owner email.
    - Group the loop by owner when one person owns several contracts and wants a single digest instead of one mail per counterparty.
    - Fan the rollup out per counterparty with a second loop when each vendor has its own tracking board.
    - Persist `contracts` for trend reporting with `io.kestra.plugin.jdbc.postgresql.Queries` or ship the snapshot to `io.kestra.plugin.aws.s3.Upload`.

    ## Links

    - [Kestra workflow triggers](https://kestra.io/docs/workflow-triggers)
    - [Kestra email plugin](https://kestra.io/plugins/plugin-email)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra GitHub plugin](https://kestra.io/plugins/plugin-github)
  tags:
    - Business
  subTags:
    - contracts
    - procurement
    - reminders
    - legal
  ee: false
  demo: false
