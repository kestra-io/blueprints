id: openmeteo-solar-radiation-telemetry-lakehouse-loader
namespace: company.analytics
description: Ingests direct normal solar irradiance and global tilted solar metrics from Open-Meteo API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: openmeteo-solar-radiation-telemetry-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&hourly=direct_normal_irradiance,global_tilted_irradiance"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "hourly"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        times = items.get('time', [])
        dni_list = items.get('direct_normal_irradiance', [])
        gti_list = items.get('global_tilted_irradiance', [])

        for i in range(len(times)):
            t = times[i]
            current_ids.append(t)
            def safe_f(lst, idx):
                try:
                    return float(lst[idx]) if lst[idx] is not None else 0.0
                except Exception:
                    return 0.0

            records.append({
                'forecast_time': str(t),
                'direct_normal_irradiance': safe_f(dni_list, i),
                'global_tilted_irradiance': safe_f(gti_list, i),
                'is_new': bool(t not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE solar_radiation (
                forecast_time VARCHAR,
                direct_normal_irradiance DOUBLE,
                global_tilted_irradiance DOUBLE,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO solar_radiation SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY solar_radiation TO 'solar_radiation_hourly.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    SUBSTRING(forecast_time, 1, 10) AS forecast_date,
                    MAX(direct_normal_irradiance) AS peak_dni,
                    AVG(direct_normal_irradiance) AS avg_dni,
                    MAX(global_tilted_irradiance) AS peak_gti
                FROM solar_radiation
                GROUP BY 1
                ORDER BY forecast_date ASC
            ) TO 'solar_irradiance_daily_peaks.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM solar_radiation WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM solar_radiation").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - solar_radiation_hourly.parquet
      - solar_irradiance_daily_peaks.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['solar_radiation_hourly.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "Open-Meteo Solar Irradiance Telemetry sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
