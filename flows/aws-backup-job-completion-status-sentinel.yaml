id: aws-backup-job-completion-status-sentinel
namespace: company.team

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: AWS region where AWS Backup jobs are executed.

tasks:
  - id: query_failed_backup_jobs
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        set -euo pipefail

        CREATED_AFTER=$(date -u -d "24 hours ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)

        aws backup list-backup-jobs \
          --by-state FAILED \
          --by-created-after "$CREATED_AFTER" \
          --output json > /tmp/backup_jobs.json

        FAILED_COUNT=$(jq '.BackupJobs | length // 0' /tmp/backup_jobs.json)

        echo "::set-output name=failed_count::${FAILED_COUNT:-0}::"

  - id: evaluate_backup_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_failed_backup_jobs.vars.failed_count | int > 0 }}"
    then:
      - id: notify_backup_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#aws-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 AWS Backup Job Failure Alert",
                "text": "AWS Backup recorded *{{ outputs.query_failed_backup_jobs.vars.failed_count }}* failed backup jobs in region `{{ inputs.aws_region }}` over the last 24 hours! Impact: Scheduled snapshots for EBS volumes, RDS databases, or DynamoDB tables failed, violating disaster recovery RPO objectives and regulatory compliance standards.",
                "footer": "Kestra Disaster Recovery Sentinel • AWS Backup"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#aws-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ AWS Backup Job Completion and Recovery Point Failure Sentinel Pipeline Failure",
            "text": "Failed to list AWS Backup jobs. Check IAM permissions and region parameter.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits AWS Backup job execution states to detect failed backup plans and missing recovery points."
  metaTitle: AWS Backup Job Completion and Recovery Point Failure Sentinel with Kestra
  title: AWS Backup Job Completion and Recovery Point Failure Sentinel
  shortDescription: Audits AWS Backup job execution states to detect failed backup plans and missing recovery points.
  description: |
    ## How it works
    This workflow executes `aws backup list-backup-jobs --by-state FAILED` via the AWS CLI to audit backup job execution across the trailing 24-hour window. When AWS Backup encounters IAM permission revocation, KMS encryption key access issues, or snapshot timeouts on target resources (RDS, EBS, EFS, DynamoDB), recovery points fail to generate. If failed jobs are detected, an incident alert is sent to Slack.

    ## What you get
    - Continuous validation of enterprise backup execution across AWS cloud resources.
    - Prevents silent snapshot failures that compromise disaster recovery readiness.
    - Enforces RPO compliance and auditability for SOC2 and ISO 27001.

    ## Who it's for
    - Cloud SREs and Infrastructure Compliance Engineers managing enterprise disaster recovery.
    - Database Administrators ensuring point-in-time recovery capabilities.

    ## Why orchestrate this with Kestra
    - **Native AWS CLI Invocation**: Authenticates securely using Kestra secrets.
    - **Multi-Service Coverage**: Audits centralized backups across RDS, EBS, EFS, and DynamoDB.
    - **Fast Remediation**: Dispatches immediate alerts so teams can re-trigger failed backup jobs.

    ## Prerequisites
    - AWS IAM credentials with `backup:ListBackupJobs` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Set `aws_region`.
    3. Run the workflow to inspect backup job completion status.

    ## How to extend
    - Automatically trigger on-demand backup execution for failed resource ARNs.
    - Audit `aws backup list-copy-jobs` for cross-region replication failures.

    ## Links
    - [AWS Backup Jobs API Documentation](https://docs.aws.amazon.com/aws-backup/latest/devguide/API_ListBackupJobs.html)
    - [Kestra AWS CLI Plugin](https://kestra.io/plugins/plugin-aws/io.kestra.plugin.aws.cli.awscli)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Day 2 Operations
    - AWS Services
  ee: false
  demo: false
