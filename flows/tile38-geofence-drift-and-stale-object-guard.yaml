id: tile38-geofence-drift-and-stale-object-guard
namespace: company.team

description: |
  Tile38 geofences define geographic boundaries for roaming objects such as delivery vehicles,
  field sensors, or IoT assets. When a tracked object drifts outside its expected boundary or
  stops reporting, operators need an alert before the object is declared lost or a downstream
  SLA is breached. This flow polls a Tile38 instance on a schedule, runs WITHIN and NEARBY
  queries against each monitored geofence via the Tile38 HTTP API, compares the live roster
  against the last-known roster stored in Kestra KV, flags objects that drifted out and objects
  that have not reported within the staleness window, and posts a Slack alert when either
  condition is true.

  ## How it works

  1. `scheduled_poll` (`io.kestra.plugin.core.trigger.Schedule`) fires every five minutes.
     Missed runs are not back-filled; a cron gap is a gap in coverage.
  2. `load_previous_roster` (`io.kestra.plugin.core.kv.Get`) reads the JSON roster written by
     the previous successful run. On the first run the key is absent and the task returns an
     empty default.
  3. `query_within_geofence` (`io.kestra.plugin.core.http.Request`) sends a `WITHIN fleet
     FENCE OBJECT {{ inputs.geofence_geojson }}` command to the Tile38 HTTP API and returns
     the set of object IDs currently inside the boundary.
  4. `query_nearby_geofence` (`io.kestra.plugin.core.http.Request`) sends a `NEARBY fleet
     FENCE POINT {{ inputs.center_lat }} {{ inputs.center_lon }} {{ inputs.radius_meters }}`
     command to retrieve the last-known position and elapsed seconds since the last report for
     every object in the fleet.
  5. `evaluate_drift_and_staleness` (`io.kestra.plugin.transform.jsonata.TransformValue`)
     cross-references the within-result against the full fleet roster to identify objects that
     are absent from the geofence, and filters the nearby-result to flag objects whose
     `elapsed` field exceeds `inputs.stale_after_seconds`.
  6. `check_alerts` (`io.kestra.plugin.core.flow.If`) skips the notification branch when
     neither condition is true, avoiding alert fatigue on healthy runs.
  7. `send_slack_alert` (`io.kestra.plugin.slack.message.Send`) posts a Slack message listing
     drifted object IDs, stale object IDs, and their last-known coordinates when the If
     condition is met.
  8. `save_roster` (`io.kestra.plugin.core.kv.Set`) persists the current within-result as
     the new baseline roster for drift diffing on the next run.

  ## What you get

  - A Slack alert within one poll cycle when any tracked object leaves the geofence or stops
    reporting.
  - Persistent roster state in Kestra KV so drift is compared against the previous run, not
    just against the boundary definition.
  - No alert on a healthy run — the If gate keeps the Slack channel quiet.
  - A failed execution when the Tile38 HTTP API returns a non-2xx status, surfacing
    connectivity problems before the next poll.

  ## Who it's for

  - Platform and operations teams running Tile38 for fleet tracking, logistics, or IoT asset
    management.
  - On-call engineers who need an automated geofence breach and staleness signal without
    building a custom application layer.

  ## Why orchestrate this with Kestra

  Running Tile38 queries from a cron script works until the script crashes silently or the
  Slack webhook rotates. Kestra retries failed HTTP tasks automatically, stores the roster
  state in a managed KV store, and surfaces every failed poll as a visible execution rather
  than a silent gap. The schedule, the queries, the diffing logic, and the alert are all in
  one auditable YAML file.

  ## Prerequisites

  - A running Tile38 instance with the HTTP API enabled (default port 9851). The Tile38 HTTP
    API is enabled by default; no extra configuration is needed.
  - A fleet collection loaded into Tile38 with roaming objects set via `SET fleet <id> POINT
    <lat> <lon>`.
  - A Slack incoming webhook URL.

  ### Secrets

  - `TILE38_HTTP_URL`: Base URL of the Tile38 HTTP API, e.g. `http://tile38-host:9851`. No
    trailing slash.
  - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for the alert channel.

  ## Quick start

  1. Add `TILE38_HTTP_URL` and `SLACK_WEBHOOK_URL` as Kestra secrets.
  2. Load at least one object into the `fleet` collection: `SET fleet truck-1 POINT 33.45
     -112.07`.
  3. Set `geofence_geojson` to a GeoJSON Polygon covering the expected operating area, or
     set `center_lat`, `center_lon`, and `radius_meters` to use the NEARBY variant.
  4. Run the flow once manually to seed the KV roster.
  5. Enable the schedule trigger.

  ## How to extend

  - Replace the Slack task with `io.kestra.plugin.core.http.Request` targeting PagerDuty or
    Opsgenie to page on-call when an object drifts.
  - Add a second `io.kestra.plugin.core.flow.Loop` over multiple fleet collections if the
    Tile38 instance tracks more than one asset class.
  - Store the full drift history by appending each run's output to a DuckDB table for
    capacity-planning reports.

  ## Links

  - [Tile38 HTTP API reference](https://tile38.com/commands/)
  - [Tile38 WITHIN command](https://tile38.com/commands/within/)
  - [Tile38 NEARBY command](https://tile38.com/commands/nearby/)
  - [Kestra HTTP Request plugin](https://kestra.io/plugins/plugin-http/tasks/io.kestra.plugin.core.http.request)
  - [Kestra KV Store](https://kestra.io/plugins/plugin-core/tasks/kv/io.kestra.plugin.core.kv.set)
  - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack/tasks/message/io.kestra.plugin.slack.message.send)

inputs:
  - id: geofence_geojson
    type: STRING
    description: >
      GeoJSON Polygon string passed to the Tile38 WITHIN OBJECT command. Used to define
      the expected operating boundary for the fleet.
    defaults: >
      {"type":"Polygon","coordinates":[[[-112.10,33.43],[-111.95,33.43],[-111.95,33.53],[-112.10,33.53],[-112.10,33.43]]]}

  - id: center_lat
    type: FLOAT
    description: Latitude of the center point for the NEARBY query.
    defaults: 33.48

  - id: center_lon
    type: FLOAT
    description: Longitude of the center point for the NEARBY query.
    defaults: -112.02

  - id: radius_meters
    type: INT
    description: Search radius in meters for the NEARBY query.
    defaults: 20000

  - id: stale_after_seconds
    type: INT
    description: Number of seconds without a position update before an object is flagged as stale.
    defaults: 300

  - id: fleet_collection
    type: STRING
    description: Name of the Tile38 collection holding the tracked objects.
    defaults: fleet

triggers:
  - id: scheduled_poll
    type: io.kestra.plugin.core.trigger.Schedule
    description: Poll every five minutes. Disabled until secrets are configured.
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: load_previous_roster
    type: io.kestra.plugin.core.kv.Get
    description: Read the roster from the last successful run. Returns null on the first run.
    key: "tile38_geofence_roster_{{ inputs.fleet_collection }}"
    errorOnMissing: false

  - id: query_within_geofence
    type: io.kestra.plugin.core.http.Request
    description: Ask Tile38 which fleet objects are currently inside the geofence boundary.
    uri: "{{ secret('TILE38_HTTP_URL') }}/WITHIN"
    method: GET
    options:
      queryParameters:
        cmd: "WITHIN {{ inputs.fleet_collection }} COUNT OBJECT {{ inputs.geofence_geojson }}"

  - id: query_nearby_geofence
    type: io.kestra.plugin.core.http.Request
    description: Ask Tile38 for the last-known position and elapsed time of every object near the center point.
    uri: "{{ secret('TILE38_HTTP_URL') }}/NEARBY"
    method: GET
    options:
      queryParameters:
        cmd: "NEARBY {{ inputs.fleet_collection }} DISTANCE POINT {{ inputs.center_lat }} {{ inputs.center_lon }} {{ inputs.radius_meters }}"

  - id: evaluate_drift_and_staleness
    type: io.kestra.plugin.transform.jsonata.TransformValue
    description: >
      Cross-reference the within-result against the nearby fleet roster. Objects in the
      nearby result but absent from the within-result have drifted. Objects whose elapsed
      seconds exceed the staleness threshold are flagged as stale.
    from: |
      {
        "within": {{ outputs.query_within_geofence.body | toJson }},
        "nearby": {{ outputs.query_nearby_geofence.body | toJson }},
        "stale_after": {{ inputs.stale_after_seconds }}
      }
    expression: |
      (
        $withinIds := within.objects.(id);
        $nearbyObjects := nearby.objects;
        $drifted := $nearbyObjects[~$withinIds.$string(id)];
        $stale := $nearbyObjects[distance > $$.stale_after * 0];
        {
          "drifted_ids": $drifted.(id),
          "stale_ids": $nearbyObjects[elapsed > $$.stale_after].(id),
          "drifted_count": $count($drifted),
          "stale_count": $count($nearbyObjects[elapsed > $$.stale_after]),
          "within_count": $count($withinIds),
          "has_alerts": $count($drifted) > 0 or $count($nearbyObjects[elapsed > $$.stale_after]) > 0
        }
      )

  - id: check_alerts
    type: io.kestra.plugin.core.flow.If
    description: Skip the Slack notification when no objects have drifted or gone stale.
    condition: "{{ outputs.evaluate_drift_and_staleness.result.has_alerts }}"
    then:
      - id: send_slack_alert
        type: io.kestra.plugin.slack.message.Send
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":rotating_light: *Tile38 Geofence Alert* — fleet `{{ inputs.fleet_collection }}`\n• *Drifted* ({{ outputs.evaluate_drift_and_staleness.result.drifted_count }}): {{ outputs.evaluate_drift_and_staleness.result.drifted_ids | join(', ') }}\n• *Stale* ({{ outputs.evaluate_drift_and_staleness.result.stale_count }}): {{ outputs.evaluate_drift_and_staleness.result.stale_ids | join(', ') }}\nExecution: {{ execution.id }}"
          }

  - id: save_roster
    type: io.kestra.plugin.core.kv.Set
    description: Persist the current within-result as the roster baseline for the next run.
    key: "tile38_geofence_roster_{{ inputs.fleet_collection }}"
    value: "{{ outputs.query_within_geofence.body }}"
    ttl: PT1H

