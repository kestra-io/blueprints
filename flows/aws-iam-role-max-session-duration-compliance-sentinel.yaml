id: aws-iam-role-max-session-duration-compliance-sentinel
namespace: company.team

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: AWS region for AWS CLI execution.
  - id: max_session_duration_seconds_threshold
    type: INT
    defaults: 14400
    description: "Maximum acceptable MaxSessionDuration in seconds (default 4 hours / 14400s)."

tasks:
  - id: audit_iam_role_durations
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      MAX_DURATION_THRESHOLD: "{{ inputs.max_session_duration_seconds_threshold }}"
    outputFiles:
      - excessive_roles.json
    script: |
      import os
      import sys
      import json
      import boto3
      from kestra import Kestra

      max_duration = int(os.environ.get("MAX_DURATION_THRESHOLD", 14400))

      try:
          iam = boto3.client("iam")
          paginator = iam.get_paginator("list_roles")
          roles = []
          for page in paginator.paginate():
              roles.extend(page.get("Roles", []))
      except Exception as e:
          print(f"ERROR: Failed to list IAM roles: {e}", file=sys.stderr)
          sys.exit(1)

      excessive_roles = []
      for r in roles:
          duration = r.get("MaxSessionDuration", 3600)
          if duration > max_duration:
              excessive_roles.append({
                  "RoleName": r.get("RoleName"),
                  "Duration": duration
              })

      with open("excessive_roles.json", "w", encoding="utf-8") as out:
          json.dump(excessive_roles, out, indent=2)

      excessive_count = len(excessive_roles)
      print(f"Audited {len(roles)} roles: {excessive_count} exceed {max_duration}s threshold.")

      Kestra.outputs({
          "excessive_count": excessive_count
      })

  - id: evaluate_duration_compliance
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_iam_role_durations.vars.excessive_count > 0 }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#security-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ AWS IAM Role Excessive Session Duration Detected",
                "text": "AWS Account audit detected *{{ outputs.audit_iam_role_durations.vars.excessive_count }}* IAM roles with `MaxSessionDuration` exceeding {{ inputs.max_session_duration_seconds_threshold }} seconds (4 hours)! Impact: Overly long session durations violate least-privilege and SOC2/CIS benchmarks, allowing assumed temporary credentials to remain valid for up to 12 hours if intercepted.",
                "footer": "Kestra Security Sentinel • AWS IAM"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#security-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ AWS IAM Role Max Session Duration Compliance Sentinel Pipeline Failure",
            "text": "Failed to audit AWS IAM roles. Check IAM permissions and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits AWS IAM roles to detect excessive MaxSessionDuration settings violating least-privilege compliance standards."
  metaTitle: AWS IAM Role Max Session Duration Compliance Sentinel with Kestra
  title: AWS IAM Role Max Session Duration Compliance Sentinel
  shortDescription: Audits AWS IAM roles to detect excessive MaxSessionDuration settings violating least-privilege compliance standards.
  description: |
    ## How it works
    This workflow executes `aws iam list-roles` to inspect the `MaxSessionDuration` attribute across all IAM roles in the AWS account. AWS allows roles to be configured with session durations up to 43,200 seconds (12 hours). Security compliance frameworks (CIS, SOC2, NIST) require limiting session durations to minimize the attack surface if temporary STS credentials are stolen. When non-compliant roles are found, Slack is alerted.

    ## What you get
    - Continuous audit of IAM role session duration limits across your AWS account.
    - Enforces least-privilege credential lifetime policies.
    - Prevents long-lived credential compromise from stolen developer tokens.

    ## Who it's for
    - Cloud Security Engineers and Compliance Officers ensuring adherence to CIS benchmarks.
    - Platform Administrators maintaining AWS identity and access management hygiene.

    ## Why orchestrate this with Kestra
    - **Comprehensive Account Auditing**: Evaluates all account roles in a single execution.
    - **Policy Enforcement**: Provides automated detection without manual security questionnaires.
    - **Actionable Inventory**: Lists offending role names and configured durations directly.

    ## Prerequisites
    - AWS IAM credentials with `iam:ListRoles` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure threshold (default 14400s / 4 hours).
    3. Run the workflow to inspect IAM role session durations.

    ## How to extend
    - Automatically remediate role durations via `aws iam update-role --role-name <name> --max-session-duration 3600`.
    - Filter out service-linked roles automatically.

    ## Links
    - [AWS IAM Role MaxSessionDuration Documentation](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use.html#id_roles_use_view-role-max-session)
    - [Kestra AWS CLI Plugin](https://kestra.io/plugins/plugin-aws/io.kestra.plugin.aws.cli.awscli)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Policy & Compliance
    - AWS Services
  ee: false
  demo: false
