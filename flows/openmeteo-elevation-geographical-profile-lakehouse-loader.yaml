id: openmeteo-elevation-geographical-lakehouse-loader
namespace: company.analytics
description: Ingests topographic digital elevation model metrics and terrestrial altitude data from Open-Meteo Elevation API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: openmeteo-elevation-geographical-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://api.open-meteo.com/v1/elevation?latitude=52.52,48.85,51.50,40.71,35.68&longitude=13.41,2.35,-0.12,-74.00,139.69"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "elevation"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        cities = [
            ("Berlin", 52.52, 13.41),
            ("Paris", 48.85, 2.35),
            ("London", 51.50, -0.12),
            ("New York", 40.71, -74.00),
            ("Tokyo", 35.68, 139.69)
        ]
        elevations = items if isinstance(items, list) else []
        for i, (city, lat, lon) in enumerate(cities):
            elev = float(elevations[i]) if i < len(elevations) else 0.0
            cid = f"{city}_{lat}_{lon}"
            current_ids.append(cid)

            records.append({
                'city_label': city,
                'latitude': lat,
                'longitude': lon,
                'elevation_meters': elev,
                'is_new': bool(cid not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE city_elevations (
                city_label VARCHAR,
                latitude DOUBLE,
                longitude DOUBLE,
                elevation_meters DOUBLE,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO city_elevations SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY city_elevations TO 'city_elevations.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    city_label,
                    elevation_meters
                FROM city_elevations
                ORDER BY elevation_meters DESC
            ) TO 'cities_elevation_ranking.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM city_elevations WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM city_elevations").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - city_elevations.parquet
      - cities_elevation_ranking.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['city_elevations.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "Open-Meteo Elevation Profile sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
