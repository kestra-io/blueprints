id: temporal-activity-execution-timeout-sentinel
namespace: company.team

inputs:
  - id: temporal_address
    type: STRING
    defaults: "temporal.internal:7233"
    description: Host and port of the Temporal gRPC frontend.
  - id: temporal_namespace
    type: STRING
    defaults: "default"
    description: Temporal namespace to audit.

tasks:
  - id: inspect_failed_workflows
    type: io.kestra.plugin.scripts.shell.Commands
    description: Queries Temporal CLI for failed or timed out workflow executions over the last hour.
    containerImage: temporalio/admin-tools:latest
    commands:
      - set -euo pipefail
      - |
        echo "Querying Temporal frontend at {{ inputs.temporal_address }}..."
        temporal workflow list \
          --address "{{ inputs.temporal_address }}" \
          --namespace "{{ inputs.temporal_namespace }}" \
          --query "ExecutionStatus IN ('TimedOut', 'Failed') AND CloseTime > NOW() - 1h" \
          --output json > /tmp/temporal_fails.json

        python3 -c "
        import json, sys
        from kestra import Kestra

        try:
            with open('/tmp/temporal_fails.json') as f:
                data = json.load(f)
            fails = len(data) if isinstance(data, list) else 0
            is_breach = fails > 0
            samples = ', '.join([item.get('execution', {}).get('workflowId', 'unknown') for item in (data[:3] if isinstance(data, list) else [])])
            print(f'Audit complete: {fails} failures detected. Breach: {is_breach}')
            Kestra.outputs({
                'is_breach': is_breach,
                'fail_count': fails,
                'samples': samples
            })
        except Exception as e:
            print(f'Error parsing Temporal output: {e}', file=sys.stderr)
            sys.exit(1)
        "

  - id: evaluate_temporal_failures
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_failed_workflows.vars.is_breach }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#orchestration-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Temporal Workflow Failure & Timeout Alert",
                "text": "Detected {{ outputs.inspect_failed_workflows.vars.fail_count }} failed or timed out workflow(s) in namespace {{ inputs.temporal_namespace }} over the last hour. Sample IDs: {{ outputs.inspect_failed_workflows.vars.samples }}. Activity worker starvation or unhandled business exceptions.",
                "footer": "Kestra Workflow Sentinel • Temporal"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#orchestration-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Temporal Sentinel Failure",
            "text": "Failed to communicate with Temporal frontend at {{ inputs.temporal_address }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Temporal namespaces for workflow execution failures and activity timeouts."
  metaTitle: Temporal Activity Execution Failure and Timeout Sentinel with Kestra
  ee: false
  demo: false
  title: Temporal Activity Execution Failure and Timeout Sentinel
  shortDescription: Audits Temporal namespaces for workflow execution failures and activity timeouts.
  description: |
    ## How it works
    This workflow connects to a Temporal cluster frontend using the official Temporal CLI to execute an Advanced Visibility query: `ExecutionStatus IN ('TimedOut', 'Failed') AND CloseTime > NOW() - 1h`. In distributed business process orchestration, activities fail due to downstream service timeouts, database deadlocks, or exhausted retry policies. When workflows terminate in `TimedOut` or `Failed` states, asynchronous payment or fulfillment workflows are abandoned. This sentinel audits recent failures and dispatches Slack notifications with workflow IDs to platform teams.

    ## What you get
    - Real-time tracking of failed and timed out Temporal workflows.
    - Rapid visibility into broken worker deployments and unhandled exceptions.
    - Actionable Slack notifications with sample failing workflow execution IDs.

    ## Who it's for
    - Distributed Systems Engineers running microservice workflows on Temporal.
    - Site Reliability Engineers ensuring task queue worker health.
    - Backend Architects managing mission-critical transactional workflows.

    ## Why orchestrate this with Kestra
    - **Automated Workflow Surveillance**: Regularly polls Temporal visibility indexes on a scheduled cadence.
    - **Consolidated Health Monitoring**: Unifies state machine health alongside Kafka, database, and cloud sentinels.
    - **Incident Escalation**: Delivers structured notifications directly into team incident channels.

    ## Prerequisites
    - Temporal CLI utility installed in the execution container.
    - Network connectivity to Temporal frontend service (`7233`).
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK` secret to your namespace.
    3. Specify `temporal_address` and target `temporal_namespace`.
    4. Enable the schedule trigger for continuous failure surveillance.

    ## How to extend
    - Trigger an automated workflow reset via `temporal workflow reset`.
    - Query specific task queue backlog depths.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [Temporal Visibility Query Syntax](https://docs.temporal.io/visibility#custom-search-attributes)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
