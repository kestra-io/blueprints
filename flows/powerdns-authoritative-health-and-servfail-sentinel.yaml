id: powerdns-authoritative-health-and-servfail-sentinel
namespace: company.team
description: |
  Audits PowerDNS Authoritative Server deployments on a schedule, monitoring
  real-time DNS performance telemetry to detect SERVFAIL response spikes,
  corrupted query packets, and zone availability regressions, dispatching
  structured alerts to Slack before DNS resolution degradation impacts clients.

triggers:
  - id: periodic_dns_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodically queries PowerDNS webserver statistics and authoritative zones. Shipped disabled by default; enable once powerdns_host and powerdns_port point to a running PowerDNS instance."
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      powerdns_host: "localhost"
      powerdns_port: 8081
      max_servfail_threshold: 5
      max_corrupt_threshold: 10
      alert_channel: "#noc-alerts"

inputs:
  - id: powerdns_host
    type: STRING
    displayName: "PowerDNS Host"
    defaults: "localhost"
    description: "Hostname or IP address of the PowerDNS Authoritative Server."

  - id: powerdns_port
    type: INT
    displayName: "PowerDNS Webserver API Port"
    defaults: 8081
    description: "HTTP REST API port exposed by the PowerDNS built-in webserver (default: 8081)."

  - id: max_servfail_threshold
    type: INT
    displayName: "Max ServFail Threshold"
    defaults: 5
    description: "Maximum allowable SERVFAIL responses before triggering an incident alert."

  - id: max_corrupt_threshold
    type: INT
    displayName: "Max Corrupt Packets Threshold"
    defaults: 10
    description: "Maximum allowable corrupt DNS packets before flagging network or malformed query anomalies."

  - id: alert_channel
    type: STRING
    displayName: "Slack Alert Channel"
    defaults: "#noc-alerts"
    description: "Slack channel where operational DNS health alerts are dispatched."

tasks:
  - id: probe_powerdns_statistics
    type: io.kestra.plugin.core.http.Request
    description: "Queries PowerDNS GET /api/v1/servers/localhost/statistics endpoint to fetch live telemetry including servfail-answers and corrupt-packets."
    uri: "http://{{ inputs.powerdns_host }}:{{ inputs.powerdns_port }}/api/v1/servers/localhost/statistics"
    method: GET
    headers:
      X-API-Key: "{{ secret('POWERDNS_API_KEY') }}"
      Accept: "application/json"
    options:
      allowFailed: true

  - id: probe_powerdns_zones
    type: io.kestra.plugin.core.http.Request
    description: "Queries PowerDNS GET /api/v1/servers/localhost/zones endpoint to verify backend database connectivity and zone inventory availability."
    uri: "http://{{ inputs.powerdns_host }}:{{ inputs.powerdns_port }}/api/v1/servers/localhost/zones"
    method: GET
    headers:
      X-API-Key: "{{ secret('POWERDNS_API_KEY') }}"
      Accept: "application/json"
    options:
      allowFailed: true

  - id: classify_dns_health
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates PowerDNS API status codes and metric thresholds to classify operational DNS health."
    value: >-
      {% if outputs.probe_powerdns_statistics.code != 200 %}
      SERVER_UNREACHABLE_OR_AUTH_FAILED
      {% elif (outputs.probe_powerdns_statistics.body | jq('[.[] | select(.name == "servfail-answers") | .value | tonumber] | first') | first ?? 0) >= inputs.max_servfail_threshold %}
      SERVFAIL_SPIKE_DETECTED
      {% elif (outputs.probe_powerdns_statistics.body | jq('[.[] | select(.name == "corrupt-packets") | .value | tonumber] | first') | first ?? 0) >= inputs.max_corrupt_threshold %}
      CORRUPT_PACKETS_EXCEEDED
      {% else %}
      HEALTHY
      {% endif %}
    cases:
      SERVFAIL_SPIKE_DETECTED:
        - id: alert_servfail_spike
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches critical operational alert when PowerDNS SERVFAIL count exceeds safety threshold."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.alert_channel }}",
              "text": ":rotating_light: *PowerDNS SERVFAIL Response Spike Detected*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *PowerDNS SERVFAIL Spike Detected*\n*Host:* `{{ inputs.powerdns_host }}:{{ inputs.powerdns_port }}`\n*Current ServFail Answers:* `{{ outputs.probe_powerdns_statistics.body | jq('[.[] | select(.name == \"servfail-answers\") | .value | tonumber] | first') | first ?? 0 }}` (Threshold: `{{ inputs.max_servfail_threshold }}`)\n*Impact:* Client DNS resolution queries are failing. Backend database (MySQL, PostgreSQL, SQLite) latency, connection loss, or DNSSEC signing failures are likely occurring."
                  }
                }
              ]
            }

      CORRUPT_PACKETS_EXCEEDED:
        - id: alert_corrupt_packets
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches warning alert when corrupt DNS packet volume indicates malformed queries or network degradation."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.alert_channel }}",
              "text": ":warning: *PowerDNS Corrupt Query Packets Exceeded*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *PowerDNS Corrupt Packets Warning*\n*Host:* `{{ inputs.powerdns_host }}:{{ inputs.powerdns_port }}`\n*Corrupt Packets:* `{{ outputs.probe_powerdns_statistics.body | jq('[.[] | select(.name == \"corrupt-packets\") | .value | tonumber] | first') | first ?? 0 }}` (Threshold: `{{ inputs.max_corrupt_threshold }}`)\n*Impact:* Inbound DNS packets are failing checksum or protocol parsing. Check network MTU, firewall packet inspection, or potential UDP flood activity."
                  }
                }
              ]
            }

      SERVER_UNREACHABLE_OR_AUTH_FAILED:
        - id: alert_api_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches alert when PowerDNS webserver API returns an error or rejects the API key."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.alert_channel }}",
              "text": ":x: *PowerDNS API Query Failure*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *PowerDNS API Query Failed*\n*Host:* `{{ inputs.powerdns_host }}:{{ inputs.powerdns_port }}`\n*HTTP Code:* `{{ outputs.probe_powerdns_statistics.code }}`\n*Impact:* The monitoring sentinel received an HTTP error. Verify that the webserver is enabled in pdns.conf and that `POWERDNS_API_KEY` is configured."
                  }
                }
              ]
            }

      HEALTHY:
        - id: log_healthy_state
          type: io.kestra.plugin.core.log.Log
          message: "PowerDNS authoritative server healthy on {{ inputs.powerdns_host }}:{{ inputs.powerdns_port }}. ServFail count: {{ outputs.probe_powerdns_statistics.body | jq('[.[] | select(.name == \"servfail-answers\") | .value | tonumber] | first') | first ?? 0 }}, zones: {{ (fromJson(outputs.probe_powerdns_zones.body) ?? []) | length }}."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: "Persists final execution audit trail with host address and verified telemetry for operational compliance history."
    message: "PowerDNS sentinel audit completed for host {{ inputs.powerdns_host }}:{{ inputs.powerdns_port }}."

errors:
  - id: alert_powerdns_unreachable
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatches out-of-band notification if PowerDNS server cannot be reached."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.alert_channel }}",
        "text": ":rotating_light: *PowerDNS Server Unreachable*",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": ":rotating_light: *PowerDNS Connectivity Outage*\nFailed to connect to PowerDNS webserver at `http://{{ inputs.powerdns_host }}:{{ inputs.powerdns_port }}`. The daemon container may be stopped, network routing interrupted, or firewall blocking the API port."
            }
          }
        ]
      }

extend:
  title: PowerDNS Authoritative Health & ServFail Sentinel
  metaTitle: PowerDNS Health & ServFail Sentinel | Kestra
  shortDescription: Audit PowerDNS authoritative statistics for servfail spikes, corrupt packets, and zone resolution health.
  metaDescription: Audit PowerDNS authoritative statistics for servfail spikes, corrupt packets, and zone resolution health via Slack.
  description: |
    Continuously monitors PowerDNS Authoritative Server deployments in real time, querying built-in webserver statistics to detect SERVFAIL response spikes, packet corruption surges, and zone backend disconnections before DNS outages degrade client traffic.

    ## How it works

    1. `periodic_dns_audit` (`io.kestra.plugin.core.trigger.Schedule`) executes every 15 minutes, passing target host, API port, and threshold parameters through its inputs block. Shipped disabled by default to facilitate safe initial verification.
    2. `probe_powerdns_statistics` (`io.kestra.plugin.core.http.Request`) invokes `GET /api/v1/servers/localhost/statistics` with the `X-API-Key` header to retrieve live server performance metrics, including `servfail-answers`, `corrupt-packets`, and `packetcache-hit`.
    3. `probe_powerdns_zones` (`io.kestra.plugin.core.http.Request`) invokes `GET /api/v1/servers/localhost/zones` to verify backend database connectivity and confirm authoritative zone availability.
    4. `classify_dns_health` (`io.kestra.plugin.core.flow.Switch`) evaluates the probe responses:
       - `SERVFAIL_SPIKE_DETECTED`: Triggers when `servfail-answers` meets or exceeds `max_servfail_threshold`, dispatching a high-priority alert to `#noc-alerts` via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
       - `CORRUPT_PACKETS_EXCEEDED`: Triggers when `corrupt-packets` exceeds `max_corrupt_threshold`, dispatching a warning alert alerting engineers to network MTU or packet anomaly issues.
       - `SERVER_UNREACHABLE_OR_AUTH_FAILED`: Triggers on HTTP errors (e.g. 401 unauthorized or 500 internal error), notifying teams of authentication or webserver failure.
       - `HEALTHY`: Confirms nominal response metrics, logging status via `io.kestra.plugin.core.log.Log`.
    5. `log_audit_complete` always records execution completion and active zone counts for compliance history.
    6. The global `errors` block intercepts connection drops or socket timeouts to immediately notify on-call engineers when the PowerDNS container is unreachable.

    ## What you get

    - Early detection of backend database connection pool exhaustion or query latency causing PowerDNS to drop authoritative replies.
    - Proactive alerting on network packet corruption surges that indicate potential DNS amplification or packet inspection truncation.
    - Continuous validation that administrative REST endpoints can authenticate and query authoritative zones.
    - Centralized execution history providing a clear operational audit trail of DNS availability.

    ## Who it's for

    - Network Operations Center (NOC) and Site Reliability Engineers managing authoritative DNS infrastructure.
    - Telecom and Platform Engineers operating PowerDNS Authoritative Servers in Kubernetes or bare-metal environments.
    - Infrastructure teams responsible for DNS service availability across hybrid and multi-cloud networks.

    ## Why orchestrate this with Kestra

    Authoritative DNS is mission-critical infrastructure where silent degradation causes widespread cascading service failures. Static port checks only confirm whether the UDP/TCP port is open, missing backend database lockouts that result in SERVFAIL responses. Kestra provides declarative scheduling, robust error handling, secret masking, and structured Slack integration without custom sidecar scripts.

    ## Prerequisites

    - A running PowerDNS Authoritative Server (version 4.8+), with its built-in webserver and API enabled in `pdns.conf` (`webserver=yes`, `api=yes`, `api-key=...`). PowerDNS publishes an official open-source Docker image (`powerdns/pdns-auth-48:latest`) requiring no commercial license or account.
    - A Slack incoming webhook URL configured for operational alerts.

    ### Secrets

    - `POWERDNS_API_KEY`: API key configured in `pdns.conf` via the `api-key` directive, used to authenticate against the `/api/v1` REST endpoints.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by `alert_servfail_spike`, `alert_corrupt_packets`, `alert_api_failure`, and the global `errors` block.

    ## Quick start

    1. Start a local PowerDNS container with webserver API enabled:
       ```bash
       docker run -d --name pdns-test -p 8081:8081 -p 53:53/udp -e PDNS_api=yes -e PDNS_api_key=secret-kestra-key -e PDNS_webserver=yes -e PDNS_webserver_address=0.0.0.0 -e PDNS_webserver_allow_from=0.0.0.0/0 powerdns/pdns-auth-48:latest
       ```
    2. Configure the `POWERDNS_API_KEY` and `SLACK_WEBHOOK_URL` secrets in your Kestra namespace.
    3. Import this blueprint into Kestra and trigger an execution with default inputs.
    4. Confirm that `log_healthy_state` logs nominal servfail metrics (`servfail-answers: 0`).
    5. Test alert routing by setting `max_servfail_threshold: 0` to observe `alert_servfail_spike` dispatching to Slack.
    6. Enable `periodic_dns_audit` once verified.

    ## How to extend

    - Add zone serial parity validation using `io.kestra.plugin.core.flow.EachSequential` to check primary and replica zone serial numbers for replication drift.
    - Wire a downstream PagerDuty escalation via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` when `SERVFAIL_SPIKE_DETECTED` fires in production environments.
    - Export DNS latency metrics to Prometheus using `io.kestra.plugin.prometheus.PushGateway` for long-term capacity trending.

    ## Links

    - [PowerDNS Authoritative Server Documentation](https://doc.powerdns.com/authoritative/)
    - [PowerDNS HTTP API Reference](https://doc.powerdns.com/authoritative/http-api/index.html)
    - [PowerDNS Official Docker Hub Image](https://hub.docker.com/r/powerdns/pdns-auth-48)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
