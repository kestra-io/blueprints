    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
    - [Sibling blueprint: nats-event-validation-quarantine](https://github.com/kestra-io/blueprints/blob/main/flows/nats-event-validation-quarantine.yaml)
    - [Sibling blueprint: kafka-dlq-quarantine-and-replay](https://github.com/kestra-io/blueprints/blob/main/flows/kafka-dlq-quarantine-and-replay.yaml)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Realtime & Streaming
  ee: false
  demo: false
