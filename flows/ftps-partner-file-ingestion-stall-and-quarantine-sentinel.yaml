id: ftps-partner-file-ingestion-stall-and-quarantine-sentinel
namespace: company.data

inputs:
  - id: ftps_host
    type: STRING
    defaults: "localhost"
    description: Hostname or IP address of the target FTPS server.

  - id: ftps_port
    type: STRING
    defaults: "990"
    description: Port number for the FTPS service (typically 990 for implicit or 21 for explicit TLS).

  - id: incoming_directory
    type: STRING
    defaults: "/incoming"
    description: Remote directory path where external partners upload incoming batch files.

  - id: quarantine_directory
    type: STRING
    defaults: "/quarantine"
    description: Remote directory path where unprocessable or stale files are isolated.

  - id: file_pattern
    type: STRING
    defaults: ".*\\.(edi|csv|dat|xml)"
    description: Regular expression matching partner file names to monitor and audit.

  - id: backlog_critical_threshold
    type: INT
    defaults: 50
    description: Maximum acceptable count of unread files before declaring an ingestion queue stall.

  - id: auto_quarantine
    type: BOOL
    defaults: false
    description: When true, automatically moves stale or stalled files to the quarantine directory.

  - id: dry_run
    type: BOOL
    defaults: false
    description: When true, simulates quarantine actions without moving files on the FTPS server.

  - id: slack_channel
    type: STRING
    defaults: "#ops-alerts"
    description: Slack channel destination for operational incident notifications.

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true
    inputs:
      ftps_host: "localhost"
      ftps_port: "990"
      incoming_directory: "/incoming"
      quarantine_directory: "/quarantine"
      file_pattern: ".*\\.(edi|csv|dat|xml)"
      backlog_critical_threshold: 50
      auto_quarantine: false
      dry_run: false
      slack_channel: "#ops-alerts"

tasks:
  - id: probe_incoming_files
    type: io.kestra.plugin.fs.ftps.List
    host: "{{ inputs.ftps_host }}"
    port: "{{ inputs.ftps_port }}"
    username: "{{ secret('FTPS_USERNAME') }}"
    password: "{{ secret('FTPS_PASSWORD') }}"
    from: "{{ inputs.incoming_directory }}"
    regExp: "{{ inputs.file_pattern }}"
    sort: LAST_MODIFIED_ASC
    maxFiles: 200
    insecureTrustAllCertificates: true
    allowFailure: true
    description: Probes the FTPS incoming partner directory, retrieving metadata and timestamps for queued files.

  - id: classify_ingestion_health
    type: io.kestra.plugin.core.debug.Return
    format: >-
      {{
        (outputs.probe_incoming_files is not defined or outputs.probe_incoming_files.files is not defined) ? 'PROBE_FAILED' :
        (outputs.probe_incoming_files.files | length >= inputs.backlog_critical_threshold) ? 'CRITICAL_BACKLOG' :
        (outputs.probe_incoming_files.files | length > 0) ? 'ACTIVE_QUEUE' :
        'HEALTHY_EMPTY'
      }}
    description: Evaluates queue depth and file counts against operational SLA thresholds.

  - id: route_by_health_status
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.classify_ingestion_health.value }}"
    cases:
      CRITICAL_BACKLOG:
        - id: alert_critical_backlog_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] FTPS Partner Ingestion Stall Detected\n• Endpoint: {{ inputs.ftps_host }}:{{ inputs.ftps_port }}\n• Directory: {{ inputs.incoming_directory }}\n• Queued Files: {{ outputs.probe_incoming_files.files | length }} (Threshold: {{ inputs.backlog_critical_threshold }})\n• Execution ID: {{ execution.id }}\nAction Required: Downstream processing consumer is stalled. Inspect consumer logs before partner files are overwritten."
            }

        - id: check_remediation
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.auto_quarantine == true and inputs.dry_run == false }}"
          then:
            - id: quarantine_stalled_files
              type: io.kestra.plugin.core.flow.Loop
              values: "{{ outputs.probe_incoming_files.files }}"
              tasks:
                - id: move_to_quarantine
                  type: io.kestra.plugin.fs.ftps.Move
                  host: "{{ inputs.ftps_host }}"
                  port: "{{ inputs.ftps_port }}"
                  username: "{{ secret('FTPS_USERNAME') }}"
                  password: "{{ secret('FTPS_PASSWORD') }}"
                  from: "{{ item.value.path }}"
                  to: "{{ inputs.quarantine_directory }}/"
                  insecureTrustAllCertificates: true

            - id: notify_quarantine_action_slack
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "channel": "{{ inputs.slack_channel }}",
                  "text": "[REMEDIATION] Stalled partner files have been moved to {{ inputs.quarantine_directory }} to unblock the ingestion pipeline."
                }

      ACTIVE_QUEUE:
        - id: log_active_queue
          type: io.kestra.plugin.core.log.Log
          message: "FTPS ingestion queue nominal. Currently processing {{ outputs.probe_incoming_files.files | length }} file(s) in {{ inputs.incoming_directory }}."

      HEALTHY_EMPTY:
        - id: log_healthy_empty
          type: io.kestra.plugin.core.log.Log
          message: "FTPS partner dropzone is clear on {{ inputs.ftps_host }}. Zero pending files in {{ inputs.incoming_directory }}."

      PROBE_FAILED:
        - id: alert_probe_failed_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[ALERT] FTPS Connection Failure\n• Target Host: {{ inputs.ftps_host }}:{{ inputs.ftps_port }}\n• Execution ID: {{ execution.id }}\nUnable to connect to FTPS server or TLS negotiation failed. Verify network routing and credentials."
            }
    description: Dispatches high-priority Slack notifications or triggers safe quarantine remediation based on queue status.

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "FTPS sentinel execution {{ execution.id }} completed. Verdict: {{ outputs.classify_ingestion_health.value }}, Files evaluated: {{ outputs.probe_incoming_files.files | length ?? 0 }}, Remediation triggered: {{ inputs.auto_quarantine and not inputs.dry_run }}."
    description: Records an immutable audit log entry documenting execution metrics and remediation decisions.

errors:
  - id: alert_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "[ERROR] FTPS Sentinel Workflow Failure\nFlow execution {{ execution.id }} encountered an unhandled exception against {{ inputs.ftps_host }}. Review Kestra task logs."
      }

extend:
  title: FTPS Partner File Ingestion Stall & Stale Quarantine Sentinel
  metaTitle: FTPS Partner File Ingestion Sentinel & Quarantine | Kestra
  shortDescription: Audits FTPS directories for partner file ingestion stalls, alerts Slack on SLA breaches, and automates quarantine routing.
  metaDescription: Audit FTPS file drops for partner ingestion stalls, alert Slack on SLA queue backlog breaches, and automate quarantine isolation for stale EDI files.
  description: |
    In enterprise B2B data ecosystems, external trading partners, clearinghouses, and payment gateways routinely deposit critical batch payloads, including HIPAA EDI 837/835 claims, NACHA ACH transaction sets, and SWIFT messages, onto FTPS (FTP over TLS/SSL) servers. When downstream consumer microservices or ETL pipelines stall, unread files accumulate in incoming drop directories. This backlog creates severe compliance liabilities, breaches data freshness Service Level Agreements (SLAs), and risks partner uploads overwriting unread transactions. Conversely, corrupted or unparseable files left lingering in the active dropzone block subsequent batch processing runs.

    This blueprint implements an automated Day 2 operations sentinel for FTPS partner ingestion dropzones. Operating on a 30-minute schedule, it securely audits remote FTPS directories using explicit/implicit TLS, evaluates queue depth against configurable SLA thresholds, escalates critical stall alerts to Slack, and optionally routes unprocessable files to an isolated quarantine folder without human intervention.

    ## How it works

    1. Scheduled trigger (`periodic_schedule`) initiates the diagnostic audit cycle every 30 minutes, with on-demand manual runs supported via configurable inputs.
    2. Diagnostic probe (`probe_incoming_files`) connects to the remote FTPS server over port 990 or 21 with TLS encryption via `io.kestra.plugin.fs.ftps.List`, filtering for partner data files (`.edi`, `.csv`, `.dat`, `.xml`) and sorting entries by oldest modification timestamp.
    3. Classification logic (`classify_ingestion_health`) evaluates the probe output using Pebble expressions to determine operational posture: `CRITICAL_BACKLOG` if queue length breaches threshold, `ACTIVE_QUEUE` if processing is within limits, `HEALTHY_EMPTY` if queue is clear, or `PROBE_FAILED` on network or TLS negotiation failure.
    4. Flow router (`route_by_health_status`) directs execution along dedicated branches according to classified severity.
    5. On `CRITICAL_BACKLOG`, a structured Slack incident card notifies operations channels with queued file counts, endpoint host, and oldest file age.
    6. Guarded remediation (`check_remediation`) evaluates `auto_quarantine` and `dry_run` flags. If enabled, `quarantine_stalled_files` (`io.kestra.plugin.core.flow.Loop`) iterates over stalled files and safely dispatches `move_to_quarantine` (`io.kestra.plugin.fs.ftps.Move`) to isolate unprocessable records without data loss.
    7. Audit log task (`log_audit_summary`) commits an immutable log record capturing execution ID, file counts, and remediation outcomes.

    ## What you get

    - Continuous automated surveillance of partner FTPS dropboxes and EDI exchange directories.
    - Early warning alerting before unprocessed file backlogs cause partner ingestion SLA breaches.
    - Automated self-healing quarantine isolation that unblocks stuck queues without manual SSH/FTP intervention.
    - Zero credential leakage in alert webhooks and task logs via Kestra secret masking.
    - Safe dry-run testing modes enabling operational verification before activating automated file movement.

    ## Who it's for

    - Financial Operations and B2B Integration Engineers managing ACH, NACHA, and SWIFT batch transfers.
    - Healthcare Data Platform Engineers operating HIPAA-compliant EDI 837/835 claim processing drops.
    - Supply Chain and Logistics Integration Teams monitoring EDIFACT and ANSI X12 inventory exchange servers.
    - Site Reliability Engineers ensuring continuous ingestion uptime across third-party file transport endpoints.

    ## Why orchestrate this with Kestra

    Operating legacy cron jobs with Python `ftplib` or bash scripts creates brittle point failures, lacks credential encryption, and provides zero centralized observability or audit trails. Kestra delivers declarative, cloud-native orchestration with first-class FTPS TLS connectivity, atomic secret masking, fine-grained flow control (`Switch`, `Loop`, `If`), and multi-channel alerting without managing external worker daemons or custom polling wrappers.

    ## Prerequisites

    - A running FTPS server (such as vsftpd or Pure-FTPd) accessible over the network with TLS enabled.
    - An FTPS user account with read and write/move permissions in the incoming and quarantine directories.
    - An active Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets

    - `FTPS_USERNAME`: Username for authenticating with the remote FTPS server.
    - `FTPS_PASSWORD`: Password or credential for the FTPS user account.
    - `SLACK_WEBHOOK_URL`: Webhook URL for posting operational incident notifications to Slack.

    ## Quick start

    1. Configure `FTPS_USERNAME`, `FTPS_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local FTPS test container using Docker:
       ```bash
       docker run -d --name ftps-server -p 21:21 -p 990:990 -p 30000-30009:30000-30009 -e FTP_USER=kestra -e FTP_PASS=secret123 -e TLS_ENABLED=true delfer/alpine-ftp-server
       ```
    3. Create the test directories `/incoming` and `/quarantine` on the server and place test `.edi` or `.csv` files in `/incoming`.
    4. Import this blueprint into Kestra and click **Execute** with `dry_run: true` to test the probe and classification logic safely.
    5. Set `auto_quarantine: true` and enable `periodic_schedule` to activate automated background sentinel monitoring.

    ## How to extend

    - Add downstream virus and malware scanning via `io.kestra.plugin.scripts.shell.Commands` with ClamAV before quarantine movement.
    - Connect downstream warehouse loaders (`io.kestra.plugin.snowflake` or `io.kestra.plugin.gcp.bigquery`) to ingest verified files immediately into data landing tables.
    - Integrate PagerDuty via `io.kestra.plugin.pagerduty` for high-severity on-call escalation when critical queue depth breaches occur.

    ## Links

    - [Kestra FTPS Plugin Documentation](https://kestra.io/plugins/plugin-fs/ftps/io.kestra.plugin.fs.ftps.list)
    - [RFC 4217 FTPS Protocol Specification](https://datatracker.ietf.org/doc/html/rfc4217)
    - [Kestra Flow Control Documentation](https://kestra.io/docs/workflow-components/tasks)
  tags:
    - Data
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
