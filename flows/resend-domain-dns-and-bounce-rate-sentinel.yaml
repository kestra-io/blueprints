id: resend-domain-dns-and-bounce-rate-sentinel
namespace: company.messaging

description: |
  Audit Resend email sending domains and DNS verification status on a recurring schedule,
  detecting broken DKIM, SPF, or MX records before email deliverability and sender reputation drop.

inputs:
  - id: target_domain
    type: STRING
    defaults: "example.com"
    displayName: "Sending Domain"
    description: "Primary sending domain name registered on Resend (e.g. mail.yourcompany.com or example.com)."

  - id: notification_channel
    type: STRING
    defaults: "#messaging-ops"
    displayName: "Slack Notification Channel"
    description: "Destination Slack channel receiving DNS drift alerts and domain status warnings."

  - id: remediation_mode
    type: SELECT
    values:
      - "ALERT_ONLY"
      - "LOG_DNS_RECORDS"
    defaults: "ALERT_ONLY"
    displayName: "Remediation Strategy"
    description: "Response strategy on degraded domain: dispatch a Slack notification only or log expected DNS records."

triggers:
  - id: periodic_resend_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    disabled: true
    inputs:
      target_domain: "example.com"
      notification_channel: "#messaging-ops"
      remediation_mode: "ALERT_ONLY"

tasks:
  - id: fetch_resend_domains
    type: io.kestra.plugin.core.http.Request
    description: "Query Resend Domains API to retrieve verification status and DNS records."
    uri: "https://api.resend.com/domains"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('RESEND_API_KEY') }}"
      Content-Type: "application/json"
    contentType: "application/json"

  - id: parse_domain_reputation
    type: io.kestra.plugin.scripts.python.Script
    description: "Inspect domain verification status, check DKIM and SPF records, and isolate unverified domains."
    containerImage: python:3.11-slim
    env:
      RAW_DOMAINS: "{{ outputs.fetch_resend_domains.body }}"
      TARGET_DOMAIN: "{{ inputs.target_domain }}"
    script: |
      import os
      import json

      raw_payload = os.environ.get("RAW_DOMAINS", "{}")
      target_domain = os.environ.get("TARGET_DOMAIN", "").lower().strip()

      try:
          data = json.loads(raw_payload) if isinstance(raw_payload, str) and raw_payload.startswith("{") else {}
      except Exception:
          data = {}

      domain_list = data.get("data", [])
      degraded_domains = []
      matched = False

      for dom in domain_list:
          name = dom.get("name", "").lower()
          if target_domain and target_domain not in name:
              continue

          matched = True
          status = dom.get("status", "not_started").lower()
          records = dom.get("records", [])
          failing_records = [r.get("record", "unknown") for r in records if r.get("status", "").lower() != "verified"]

          if status != "verified" or len(failing_records) > 0:
              degraded_domains.append({
                  "id": dom.get("id"),
                  "name": dom.get("name"),
                  "status": status,
                  "region": dom.get("region", "us-east-1"),
                  "failing_records": failing_records
              })

      classification = "DOMAIN_DEGRADED" if len(degraded_domains) > 0 else "HEALTHY"

      outputs = {
          "status": classification,
          "target_domain_matched": matched,
          "total_domains_checked": len(domain_list),
          "degraded_count": len(degraded_domains),
          "degraded_domains": degraded_domains
      }

      print(f"Resend Audit: {len(degraded_domains)} degraded domains found - Status: {classification}")
      print("::" + json.dumps({"outputs": outputs}) + "::")

  - id: evaluate_domain_health
    type: io.kestra.plugin.core.flow.Switch
    description: "Route workflow execution based on whether sending domains have unverified DNS records."
    value: "{{ outputs.parse_domain_reputation.vars.status }}"
    cases:
      "HEALTHY":
        - id: log_domain_healthy
          type: io.kestra.plugin.core.log.Log
          description: "Record healthy status when sending domains report verified DKIM, SPF, and MX status."
          message: "Resend domain status is healthy for '{{ inputs.target_domain }}'. All DNS records verified."
      "DOMAIN_DEGRADED":
        - id: alert_domain_degradation
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatch urgent operational notification to Slack detailing Resend DNS verification failure."
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "channel": "{{ inputs.notification_channel }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Resend Domain DNS Verification Alert"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Sending Domain:*\n`{{ inputs.target_domain }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Verification State:*\n🔥 *{{ outputs.parse_domain_reputation.vars.degraded_domains[0]['status'] }}*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Domain ID:*\n`{{ outputs.parse_domain_reputation.vars.degraded_domains[0]['id'] }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Region:*\n`{{ outputs.parse_domain_reputation.vars.degraded_domains[0]['region'] }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "⚠️ *Action Required:* Domain `{{ outputs.parse_domain_reputation.vars.degraded_domains[0]['name'] }}` has unverified or failing DNS records. Review DKIM and SPF entries in Cloudflare or Route 53 to prevent email delivery failure."
                  }
                }
              ]
            }
        - id: log_remediation_guidance
          type: io.kestra.plugin.core.log.Log
          description: "Log diagnostic guidance for infrastructure teams to resolve broken Resend DNS records."
          message: "Resend Remediation: Sending domain '{{ outputs.parse_domain_reputation.vars.degraded_domains[0]['name'] }}' is in state '{{ outputs.parse_domain_reputation.vars.degraded_domains[0]['status'] }}'. Verify TXT and CNAME DKIM keys on resend.com/domains. Mode: {{ inputs.remediation_mode }}."
    defaults:
      - id: log_unknown_state
        type: io.kestra.plugin.core.log.Log
        description: "Fallback logger for unclassified domain audit states."
        message: "Resend domain audit completed with unclassified metrics."

  - id: log_audit_completion
    type: io.kestra.plugin.core.log.Log
    description: "Record completion of the Resend domain sentinel inspection run."
    message: "Resend domain sentinel audit pass completed for '{{ inputs.target_domain }}'. Degraded count: {{ outputs.parse_domain_reputation.vars.degraded_count ?? 0 }}."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatch urgent Slack notification if flow execution encounters an unhandled exception."
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {"text": "Flow execution failed: resend-domain-dns-and-bounce-rate-sentinel encountered an unhandled error during execution {{ execution.id }}."}

extend:
  title: Resend Domain DNS & Deliverability Sentinel
  metaTitle: Resend Domain DNS & Deliverability Sentinel Blueprint | Kestra
  shortDescription: Audit Resend sending domain verification status and DNS records on a schedule with automated Slack alerting.
  metaDescription: Audit Resend sending domain DNS verification and DKIM records on a schedule to detect delivery drop risks before sender reputation is damaged.
  description: |
    Transactional and marketing email infrastructure like [Resend](https://resend.com) powers critical customer authentication flows, password resets, and product notifications. Modern email inbox providers (Google, Yahoo, Microsoft) enforce strict sender authentication standards, requiring valid DKIM, SPF, and DMARC alignment. When nameserver migrations, DNS provider changes, or domain renewals inadvertently drop or invalidate TXT and CNAME records, transactional emails are silently dropped or routed to spam folders without application-level HTTP errors.

    This blueprint implements an automated Day 2 operations sentinel for Resend sending domains. Operating on a periodic daily schedule, it directly queries the Resend Domains REST API, inspects domain verification states, detects missing or failing DKIM/SPF DNS records, and dispatches rich Slack incident alert cards with actionable nameserver remediation instructions.

    ## How it works

    1. **Scheduled Invocation**: The workflow executes on a periodic daily schedule (`0 8 * * *`, daily at 08:00 UTC, shipped disabled for initial configuration) or on demand.
    2. **Resend REST Query**: `fetch_resend_domains` executes an HTTP GET request to `https://api.resend.com/domains` via `io.kestra.plugin.core.http.Request`, authenticating with the bearer token secret `RESEND_API_KEY`.
    3. **Python Metric Extraction**: `parse_domain_reputation` executes inside an isolated `python:3.11-slim` container, parsing the domains response. It cross-references `status` and individual DKIM/SPF record verification states against `target_domain`.
    4. **Operational Branching**: `evaluate_domain_health` utilizes `io.kestra.plugin.core.flow.Switch` to evaluate the classified status:
       - **When Healthy**: Emits an audit log confirming all DNS records are verified.
       - **When Degraded**: Invokes `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` to dispatch a formatted alert card to `#messaging-ops` detailing the domain name, status, and recommended DNS verification actions.
    5. **Telemetry Logging**: `log_audit_completion` records the overall audit summary and degraded domain counts.
    6. **Error Resilience**: A dedicated `errors` handler catches HTTP connection timeouts or authentication failures, ensuring on-call teams are alerted if the health check itself cannot reach the API.

    ## What you get

    - **Automated Deliverability Protection**: Continuous verification detects broken DKIM and SPF records hours before transactional emails bounce.
    - **Zero Infrastructure Footprint**: Runs completely serverless using Kestra native tasks and containerized Python parsing, requiring no persistent monitoring agents.
    - **Actionable Slack Alerts**: Context-rich Slack messages direct DevOps and infrastructure engineers immediately to the offending domain with concrete DNS verification directives.
    - **Multi-Domain Support**: Validates individual target sending domains or audits an entire Resend account domain portfolio.

    ## Who it's for

    - **DevOps & Platform Engineers** responsible for managing DNS nameservers, domain renewals, and email infrastructure.
    - **Product Engineers** operating transactional email delivery for critical authentication and customer messaging flows.
    - **Site Reliability Engineers (SREs)** maintaining notification reliability and external third-party API dependencies.

    ## Why orchestrate this with Kestra

    Writing custom cron jobs or Lambda functions to poll email APIs creates unmonitored scripts, unmasked secrets, and brittle alert plumbing. Kestra provides:
    - **Declarative YAML Orchestration**: The entire monitoring and alert topology is codified in version-controlled YAML with transparent execution history.
    - **Encrypted Secret Management**: Resend API keys and Slack incoming webhook URLs remain securely encrypted and masked in all execution logs.
    - **Built-in Flow Logic**: Native `Switch` branching and containerized Python scripts provide robust error recovery without external microservice dependencies.

    ## Prerequisites

    - A Resend account with an API key from [resend.com/api-keys](https://resend.com/api-keys).
    - An incoming Slack webhook URL for operational alerting.

    ### Secrets

    Configure the following secrets in your Kestra namespace or instance settings:

    | Secret Name | Description | Example |
    |---|---|---|
    | `RESEND_API_KEY` | Resend API authentication token | `re_••••••••••••` |
    | `SLACK_WEBHOOK` | Incoming webhook URL for destination Slack channel | `https://hooks.slack.com/services/T00/B00/X00` |

    ## Quick start

    1. In Kestra, navigate to **Flows** and import this blueprint into your designated namespace (e.g., `company.messaging`).
    2. Add your `RESEND_API_KEY` and `SLACK_WEBHOOK` into **Settings > Secrets**.
    3. Click **Execute** and provide your `target_domain` to test the audit pass.
    4. Review execution logs to verify domain parsing and ensure the Slack alert card renders properly.
    5. In the flow definition, toggle `disabled: false` on `periodic_resend_audit` to activate the automated daily monitoring schedule.

    ## How to extend

    - **Cloudflare DNS Auto-Repair**: Chain an automated DNS reconciliation task using `io.kestra.plugin.core.http.Request` to Cloudflare's API to re-add dropped DKIM records when `remediation_mode == 'AUTO_REPAIR'`.
    - **PagerDuty Escalation**: Add an `io.kestra.plugin.pagerduty.Incident` task within the `DOMAIN_DEGRADED` branch to escalate persistent deliverability drops to on-call engineers.
    - **Multi-Domain Sweep**: Replace the single domain input with `io.kestra.plugin.core.flow.ForEach` to audit all organization domains in parallel.

    ## Links

    - [Resend Domains API Documentation](https://resend.com/docs/api-reference/domains/list-domains)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
