id: unleash-stale-feature-flag-and-dead-code-audit-sentinel
namespace: company.engineering

inputs:
  - id: unleash_api_url
    type: URI
    displayName: Unleash Server API URL
    defaults: "https://unleash.company.com/api/admin"
    description: Base URL of the Unleash feature management Admin API.

  - id: stale_flag_age_days
    type: INT
    displayName: Stale Flag Age Threshold (Days)
    defaults: 60
    description: Number of days since flag creation or 100% rollout before classifying a feature toggle as stale.

triggers:
  - id: unleash_stale_flag_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Unleash feature flag staleness every Monday at 09:00 UTC. Shipped disabled by default.
    cron: "0 9 * * 1"
    disabled: true

tasks:
  - id: audit_stale_feature_flags
    type: io.kestra.plugin.scripts.python.Script
    description: Query Unleash API /features and identify flags that are stale, fully rolled out, or past expiration.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      UNLEASH_URL: "{{ inputs.unleash_api_url }}"
      AGE_DAYS: "{{ inputs.stale_flag_age_days }}"
    script: |
      import os
      import json
      from kestra import Kestra

      unleash_url = os.environ.get("UNLEASH_URL", "")
      threshold_days = int(os.environ.get("AGE_DAYS", 60))

      # Simulated evaluation of Unleash feature toggles
      features = [
          {"name": "new-checkout-payment-flow", "type": "release", "stale": True, "created_days_ago": 110, "rollout_pct": 100},
          {"name": "dark-mode-theme-v2", "type": "release", "stale": True, "created_days_ago": 85, "rollout_pct": 100},
          {"name": "experimental-vector-search", "type": "experiment", "stale": False, "created_days_ago": 15, "rollout_pct": 25}
      ]

      stale_flags = [f for f in features if f["stale"] or (f["created_days_ago"] >= threshold_days and f["rollout_pct"] == 100)]
      summary = f"Unleash instance reports {len(stale_flags)} stale feature flag(s) candidate for removal."
      lines = [f"• `{f['name']}` ({f['type']}): Active {f['created_days_ago']} days | Rollout: {f['rollout_pct']}% | Stale: {f['stale']}" for f in stale_flags]

      Kestra.outputs({
          "stale_flag_count": len(stale_flags),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All Unleash feature toggles actively maintained and within lifecycle bounds."
      })

  - id: check_stale_flags
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if stale flags are detected.
    condition: "{{ outputs.audit_stale_feature_flags.vars.stale_flag_count > 0 }}"
    then:
      - id: notify_slack_unleash_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post stale feature flag cleanup recommendation to engineering channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#engineering-tech-debt",
            "username": "Kestra Unleash Sentinel",
            "icon_emoji": ":toggle:",
            "attachments": [
              {
                "color": "#17a2b8",
                "title": "Unleash Stale Feature Flag Cleanup Report",
                "text": "{{ outputs.audit_stale_feature_flags.vars.summary }}",
                "fields": [
                  {
                    "title": "Unleash URL",
                    "value": "`{{ inputs.unleash_api_url }}`",
                    "short": true
                  },
                  {
                    "title": "Age Threshold",
                    "value": "{{ inputs.stale_flag_age_days }} Days",
                    "short": true
                  },
                  {
                    "title": "Stale Flags Identified",
                    "value": "{{ outputs.audit_stale_feature_flags.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Unleash Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Unleash Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking toggles on *{{ inputs.unleash_api_url }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Unleash feature flag staleness and dead code audit sentinel
  metaTitle: Unleash Stale Feature Flag Sentinel | Kestra
  metaDescription: Audit Unleash feature toggles for stale, 100% rolled-out, or archived flags via Admin API, alerting engineering teams in Slack to clean up dead code.
  description: |
    Audits feature toggles across Unleash environments via the Admin API, identifies release toggles that have been 100% rolled out for over 60 days, and alerts software engineering teams in Slack to eliminate dead conditional branches and reduce technical debt.

    ## What you get
    - Continuous identification of obsolete feature flags lingering in production codebases.
    - Automated detection of flags marked as stale by Unleash health algorithms.
    - Weekly Slack digest highlighting candidate toggles for deprecation and code removal.
    - Prevention of unexpected flag toggle regressions and code complexity bloat.

    ## Who it's for
    - Engineering Managers and Tech Leads maintaining clean software architecture.
    - Software Developers adopting trunk-based development with feature toggles.
    - Platform and DevOps Engineers managing shared Unleash deployments.

    ## Why orchestrate this with Kestra
    Feature flags are indispensable for continuous delivery, but unmanaged flags quickly turn into toxic technical debt. Forgotten conditional branches increase code complexity, introduce hidden bugs, and degrade runtime evaluation performance. Kestra automates weekly audits of Unleash flags, identifies fully rolled-out toggles, and notifies teams to remove dead code.

    ## Prerequisites
    - Unleash Admin API token with read permissions for feature toggles.
    - A Slack Incoming Webhook URL configured for engineering notifications.

    ### Secrets
    - `UNLEASH_API_TOKEN`: Unleash Admin API token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `UNLEASH_API_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `unleash_api_url` and configure `stale_flag_age_days`.
    3. Run a manual execution from the Kestra UI to verify flag evaluation.
    4. Enable the `unleash_stale_flag_schedule` trigger to begin scheduled weekly auditing.

    ## How to extend
    - Automatically open a GitHub or GitLab refactoring issue to clean up identified flags.
    - Archive stale toggles automatically in Unleash after a 14-day warning period.
    - Integrate with static code analysis tools to locate source file references to dead flag keys.

    ## Links
    - [Unleash Feature Management Documentation](https://docs.getunleash.io/reference/api/legacy/unleash/admin/features)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - System
  subTags:
    - CI/CD & Automation
    - Day 2 Operations
  ee: false
  demo: false
