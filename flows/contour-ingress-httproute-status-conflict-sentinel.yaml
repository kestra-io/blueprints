id: contour-ingress-httproute-status-conflict-sentinel
namespace: company.team

description: |
  Audits Contour ingress controller telemetry to detect HTTPRoute and IngressRoute status conflicts, orphaned path definitions, and DAG rebuild latency spikes.

concurrency:
  limit: 1

inputs:
  - id: contour_metrics_url
    type: STRING
    displayName: "Contour Metrics URL"
    defaults: "http://contour.projectcontour.svc.cluster.local:8000"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the Contour Kubernetes ingress controller service."

  - id: ingress_namespace
    type: STRING
    displayName: "Target Ingress Namespace"
    defaults: "production-routing"
    description: "Kubernetes namespace under active Gateway API and IngressRoute path conflict surveillance."

  - id: max_conflict_routes_threshold
    type: INT
    displayName: "Max Conflict Routes Threshold"
    defaults: 1
    description: "Maximum allowable HTTPRoute or IngressRoute configuration conflicts before dispatching high-urgency alerts."

  - id: max_dag_rebuild_latency_ms
    type: INT
    displayName: "Max DAG Rebuild Latency (ms)"
    defaults: 1200
    description: "Maximum allowable directed acyclic graph (DAG) routing computation latency in milliseconds."

  - id: alert_on_orphaned_routes
    type: BOOL
    displayName: "Alert on Orphaned Routes"
    defaults: true
    description: "Toggle whether detected orphaned child routes without parent delegation trigger an immediate alert."

tasks:
  - id: scan_contour_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Contour Prometheus metrics to audit HTTPRoute status conflicts, orphaned path delegations, and DAG rebuild durations.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.contour_metrics_url }}"
      NAMESPACE: "{{ inputs.ingress_namespace }}"
      MAX_CONFLICTS: "{{ inputs.max_conflict_routes_threshold }}"
      MAX_DAG_LATENCY: "{{ inputs.max_dag_rebuild_latency_ms }}"
      ALERT_ORPHANED: "{{ inputs.alert_on_orphaned_routes }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      namespace = os.environ.get("NAMESPACE", "production-routing")
      max_conflicts = int(os.environ.get("MAX_CONFLICTS", "1"))
      max_dag_latency = int(os.environ.get("MAX_DAG_LATENCY", "1200"))
      alert_orphaned = os.environ.get("ALERT_ORPHANED", "true").lower() == "true"

      conflict_routes_total = 0
      orphaned_routes_total = 0
      dag_rebuild_latency_ms = 0
      valid_routes_count = 0
      degraded_namespaces = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          resp.raise_for_status()
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "contour_httproute_status_invalid_total" in line:
                  conflict_routes_total += int(val)
                  if conflict_routes_total > max_conflicts:
                      degraded_namespaces.append(namespace)
              elif "contour_ingressroute_orphaned_total" in line:
                  orphaned_routes_total += int(val)
              elif "contour_dag_rebuild_duration_seconds" in line:
                  dag_rebuild_latency_ms = max(dag_rebuild_latency_ms, int(val * 1000))
              elif "contour_httproute_status_valid_total" in line:
                  valid_routes_count = max(valid_routes_count, int(val))
      except Exception as err:
          print(f"CRITICAL: Failed to scrape Contour metrics from {base_url}/metrics: {err}", file=sys.stderr)
          sys.exit(1)

      is_breached = bool(
          (conflict_routes_total > max_conflicts) or
          (dag_rebuild_latency_ms > max_dag_latency) or
          (alert_orphaned and orphaned_routes_total > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Contour namespace '{namespace}' audit: {conflict_routes_total} conflicts, "
          f"{orphaned_routes_total} orphaned routes, {dag_rebuild_latency_ms}ms DAG latency, "
          f"{valid_routes_count} valid routes."
      )
      print(f"Contour Complete: {summary}")

      Kestra.outputs({
          "conflict_routes_total": conflict_routes_total,
          "orphaned_routes_total": orphaned_routes_total,
          "dag_rebuild_latency_ms": dag_rebuild_latency_ms,
          "valid_routes_count": valid_routes_count,
          "degraded_namespaces": list(set(degraded_namespaces)),
          "is_alerting": is_breached,
          "namespace": namespace,
          "audit_timestamp": now_iso
      })

  - id: evaluate_contour_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Contour route conflicts, orphaned delegations, or DAG rebuild latencies breach thresholds.
    condition: "{{ outputs.scan_contour_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_ingress_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Ingress NetOps Slack channel detailing Contour route conflict or orphaned path.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#ingress-routing-alerts",
            "text": "CRITICAL: Contour Route Conflict Detected in Namespace `{{ inputs.ingress_namespace }}`. Conflict Routes: `{{ outputs.scan_contour_telemetry.vars.conflict_routes_total }}` (max allowable: `{{ inputs.max_conflict_routes_threshold }}`). Orphaned Routes: `{{ outputs.scan_contour_telemetry.vars.orphaned_routes_total }}`. DAG Rebuild Latency: `{{ outputs.scan_contour_telemetry.vars.dag_rebuild_latency_ms }}`ms (threshold: `{{ inputs.max_dag_rebuild_latency_ms }}`ms). Audit Timestamp: `{{ outputs.scan_contour_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_contour_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Contour builds routing DAGs cleanly without path overlap or orphaned delegations.
        message: "Contour operating nominally: {{ outputs.scan_contour_telemetry.vars.valid_routes_count }} valid routes, {{ outputs.scan_contour_telemetry.vars.conflict_routes_total }} conflicts, {{ outputs.scan_contour_telemetry.vars.dag_rebuild_latency_ms }}ms DAG rebuild."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for Kubernetes ingress governance and Gateway API route compliance records.
    format: |
      {
        "status": "{{ outputs.scan_contour_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "namespace": "{{ inputs.ingress_namespace }}",
        "conflict_routes": {{ outputs.scan_contour_telemetry.vars.conflict_routes_total }},
        "orphaned_routes": {{ outputs.scan_contour_telemetry.vars.orphaned_routes_total }},
        "dag_rebuild_latency_ms": {{ outputs.scan_contour_telemetry.vars.dag_rebuild_latency_ms }},
        "valid_routes": {{ outputs.scan_contour_telemetry.vars.valid_routes_count }},
        "audit_timestamp": "{{ outputs.scan_contour_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_contour_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

errors:
  - id: alert_contour_ingress_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-urgency Slack incident alert if Contour ingress audit fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#ingress-routing-alerts",
        "text": "CRITICAL: Contour Ingress HTTPRoute Status Conflict Sentinel failed for namespace `{{ inputs.ingress_namespace }}`. Execution ID: `{{ execution.id }}`."
      }

extend:
  title: "Contour Ingress HTTPRoute Status Conflict Sentinel"
  metaTitle: "Contour Ingress Sentinel Blueprint"
  shortDescription: "Audits Contour ingress controller telemetry for HTTPRoute status conflicts, orphaned paths, and DAG latency."
  metaDescription: "Audits Contour ingress controller metrics to detect HTTPRoute and IngressRoute path conflicts, orphaned delegations, and DAG rebuild spikes."
  description: |
    Automates continuous health and route validation surveillance for Contour Kubernetes ingress controllers and Envoy Gateway APIs.

    ## How it works
    1. A schedule trigger executes the Contour ingress health audit workflow every 15 minutes.
    2. The Python task queries the Contour controller Prometheus metrics endpoint on port 8000.
    3. The script extracts invalid route conflict counts, orphaned path delegations, and DAG rebuild latencies.
    4. An evaluation gate determines whether route conflicts, orphaned definitions, or DAG computation lags exceed limits.
    5. When ingress routing conflicts are detected, a high-priority Slack incident alert is dispatched to Ingress NetOps.
    6. When HTTPRoutes and IngressRoutes compile cleanly into Envoy listener clusters, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for ingress governance and Gateway API compliance archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Contour Metrics]
        ScanMetrics --> EvalBreach{Conflicts > 1 OR Orphaned > 0 OR DAG > 1200ms?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Ingress Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Contour State]
        SlackAlert --> EmitManifest[Debug Return: Ingress Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Contour Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether HTTPRoute invalid status counters or orphaned route totals exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with namespace and route conflict metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing ingress routing health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Contour IngressRoute, HTTPRoute (Gateway API), and Envoy proxy data planes.
    - Early warning detection for conflicting path prefixes that cause Envoy to reject routing updates.
    - Automated tracking of orphaned child routes when parent multi-team delegation chains are broken.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into Kubernetes edge ingress configuration validity and routing consistency.
    - Proactive alerts preventing developer routing mistakes from blackholing production HTTP microservices.
    - Standardized audit manifests containing exact valid route counts, conflict totals, and execution timestamps.
    - Zero-overhead deployment compatible with Contour Gateway API and native Ingress resources.

    ## Who it's for
    - Ingress and network platform engineers maintaining multi-tenant Kubernetes edge gateways.
    - Site Reliability Engineers ensuring continuous availability for external client API traffic.
    - DevOps teams adopting Kubernetes Gateway API specifications for multi-team path delegation.
    - Enterprise cloud architects securing layer 7 application ingress routing architectures.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages edge ingress surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical ingress routing metrics in searchable Kestra execution logs.

    ## Use cases
    - **Multi-Tenant Path Collision Detection**: Alerts when two developer teams claim overlapping `/api/v1` routes.
    - **Broken Delegation Warning**: Flags orphaned child IngressRoutes when a parent virtualhost definition is deleted.
    - **Large-Scale DAG Rebuild Latency**: Measures translation latency when thousands of microservice routes update.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `contour_metrics_url` | STRING | `http://contour.projectcontour.svc.cluster.local:8000` | Internal HTTP URL exposing Prometheus metrics for Contour. |
    | `ingress_namespace` | STRING | `production-routing` | Target Kubernetes namespace monitored for routing conflicts. |
    | `max_conflict_routes_threshold` | INT | `1` | Maximum allowable conflicting route definitions before alerting. |
    | `max_dag_rebuild_latency_ms` | INT | `1200` | Maximum allowable DAG rebuild computation latency in milliseconds. |
    | `alert_on_orphaned_routes` | BOOL | `true` | Toggle whether orphaned route definitions trigger an incident alert. |

    ## Expected outputs
    - `{{ outputs.scan_contour_telemetry.vars.conflict_routes_total }}`: Total count of invalid or conflicting HTTPRoutes.
    - `{{ outputs.scan_contour_telemetry.vars.orphaned_routes_total }}`: Count of orphaned route definitions lacking delegation.
    - `{{ outputs.scan_contour_telemetry.vars.dag_rebuild_latency_ms }}`: Maximum observed DAG routing computation latency.
    - `{{ outputs.scan_contour_telemetry.vars.is_alerting }}`: Boolean flag indicating if ingress health bounds are breached.
    - `{{ outputs.scan_contour_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the Contour audit run.

    ## Prerequisites
    - Contour ingress controller installed on Kubernetes with Prometheus metrics enabled on port 8000.
    - Network connectivity from the Kestra worker to the Contour controller metrics service.
    - Configured Slack incoming webhook URL with permissions to post in ingress alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing ingress alerts to the Ingress NetOps Slack channel.

    ## Quick start
    1. Verify that Contour controller exposes Prometheus metrics on HTTP port 8000.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your ingress namespace in `ingress_namespace`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_contour_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Root Namespace Enforcement**: Ensure Contour is configured with `--root-namespaces` to restrict parent delegations.
    - **Gateway API CRD Versioning**: Verify Gateway API CRDs (`HTTPRoute`, `Gateway`) match Contour release specifications.
    - **Envoy xDS Disconnects**: High DAG rebuild times can cause Envoy proxies to lag behind active control plane updates.
    - **Wildcard Hostname Ambiguity**: Mismatched wildcard hostnames (`*.example.com`) across namespaces cause silent conflicts.

    ## How to extend
    - **Automated Route Rollback**: Trigger a GitOps revert task if a newly pushed HTTPRoute introduces a conflict status.
    - **PagerDuty Escalation**: Escalate to on-call network engineers if valid route count drops by more than 20%.
    - **Multi-Gateway Fleet Sweep**: Expand script parameters to monitor all Contour deployments across edge clusters.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Project Contour Official Documentation](https://projectcontour.io/)
    - [Contour Architecture and DAG Routing Design](https://projectcontour.io/docs/main/architecture/)
    - [Contour Metrics and Prometheus Reference Guide](https://projectcontour.io/docs/main/guides/metrics/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
