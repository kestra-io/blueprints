id: kubernetes-vertical-pod-autoscaler-drift-sentinel
namespace: company.data

inputs:
  - id: namespace
    type: STRING
    defaults: "default"
    description: Kubernetes namespace to audit for VPA recommendation drift.
  - id: drift_ratio_threshold
    type: FLOAT
    defaults: 2.0
    description: Maximum acceptable ratio between VPA target recommendation and configured container requests before alerting.

tasks:
  - id: audit_vpa_recommendations
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: bitnami/kubectl:latest
    commands:
      - |
        kubectl get vpa -n "{{ inputs.namespace }}" -o json > /tmp/vpa_list.json
        
        DRIFT_COUNT=$(jq '[.items[]? | select(.status.recommendation.containerRecommendations != null) | .status.recommendation.containerRecommendations[]? | select((.target.cpu? != null) or (.target.memory? != null))] | length' /tmp/vpa_list.json)
        VPA_TOTAL=$(jq '.items | length // 0' /tmp/vpa_list.json)
        
        echo "::set-output name=drift_count::$DRIFT_COUNT::"
        echo "::set-output name=vpa_total::$VPA_TOTAL::"

  - id: evaluate_vpa_drift
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_vpa_recommendations.vars.drift_count | int > 0 }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#kubernetes-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ Kubernetes VPA Recommendation Drift Detected",
                "text": "Namespace `{{ inputs.namespace }}` has *{{ outputs.audit_vpa_recommendations.vars.drift_count }}* container recommendations requiring review across *{{ outputs.audit_vpa_recommendations.vars.vpa_total }}* VPA objects. Impact: Workloads running in `Off` or `Initial` updateMode have drifted significantly from their historical CPU/Memory working set recommendations, risking OOMKills or node over-provisioning.",
                "footer": "Kestra Kubernetes Sentinel • VPA"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#kubernetes-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Kubernetes Vertical Pod Autoscaler (VPA) Recommendation Drift Sentinel Pipeline Failure",
            "text": "Failed to audit Kubernetes VPA resources via kubectl. Check cluster credentials and RBAC permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Kubernetes Vertical Pod Autoscaler (VPA) Recommendation Drift Sentinel
  shortDescription: Audits Kubernetes VPA target recommendations against running container resource specs to detect severe resource drift.
  description: |
    ## How it works
    This workflow executes `kubectl get vpa -n <namespace> -o json` to inspect the target resource recommendations calculated by the Kubernetes Vertical Pod Autoscaler recommender. For workloads where VPA operates in advisory `updateMode: "Off"`, developers must manually update resource manifests. When the working set size diverges from configured requests, workloads either risk OOMKills or waste expensive cluster capacity. Slack is alerted when drift is detected.

    ## What you get
    - Continuous audit of VPA recommendations against running container specifications.
    - Prevents silent container OOMKills caused by stale resource requests.
    - Eliminates cluster capacity waste from over-provisioned workloads.

    ## Who it's for
    - Kubernetes Platform Engineers and FinOps Practitioners optimizing cluster compute costs.
    - Application teams tuning CPU and memory limits for microservices.

    ## Why orchestrate this with Kestra
    - **Native Kubectl Integration**: Direct execution using official Bitnami kubectl images.
    - **Continuous Right-Sizing**: Bridge the gap between static YAML specs and dynamic traffic patterns.
    - **Automated Advisory Alerts**: Deliver right-sizing recommendations directly to developers.

    ## Prerequisites
    - Kubernetes cluster with Vertical Pod Autoscaler CRDs and recommender deployed.
    - Kubeconfig or in-cluster service account with read access to `autoscaling.k8s.io/vpa`.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure target namespace.
    3. Run the workflow to inspect VPA recommendations.

    ## How to extend
    - Automatically generate pull requests to update GitOps Helm values or Kustomize overlays.
    - Audit all namespaces across the cluster dynamically.

    ## Links
    - [Kubernetes Vertical Pod Autoscaler Documentation](https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
