id: unused-security-groups-finder
namespace: company.finops

description: |
  Finds security groups attached to nothing. Unused SGs are free but they are a
  security liability and a review nightmare — hundreds of stale rules nobody
  dares to touch. This flow audits every security group against live network
  interfaces and reports the orphaned ones for cleanup.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for unused security groups.

tasks:
  - id: find_unused
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit security groups region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List SGs and check each against live network interfaces.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            echo "Checking security groups in $REGION"
            aws ec2 describe-security-groups --region "$REGION" \
              --query 'SecurityGroups[?GroupName!=`default`].[GroupId,GroupName]' \
              --output text > /tmp/sgs.txt || true
            UNUSED_COUNT=0
            UNUSED_LIST=""
            while read -r SG NAME; do
              [ -z "$SG" ] && continue
              ATTACHED=$(aws ec2 describe-network-interfaces --region "$REGION" \
                --filters Name=group-id,Values="$SG" \
                --query 'length(NetworkInterfaces)' --output text 2>/dev/null)
              case "$ATTACHED" in ''|'None') ATTACHED=0;; esac
              if [ "$ATTACHED" -eq 0 ]; then
                UNUSED_LIST="${UNUSED_LIST}${SG} (${NAME}), "
                UNUSED_COUNT=$((UNUSED_COUNT + 1))
              fi
            done < /tmp/sgs.txt
            if [ "$UNUSED_COUNT" -gt 0 ]; then HAS_UNUSED=true; else HAS_UNUSED=false; fi
            echo "HAS_UNUSED=$HAS_UNUSED"
            echo "UNUSED_COUNT=$UNUSED_COUNT"
            echo "UNUSED_SGS=$UNUSED_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report orphaned security groups for review.
        condition: "{{ outputs.audit_region.vars.HAS_UNUSED == 'true' }}"
        then:
          - id: slack_unused
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":broom: Unused security groups in `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.UNUSED_COUNT }}* attached to nothing.\n`{{ outputs.audit_region.vars.UNUSED_SGS }}`\nReview and delete them in the EC2 console (check for references in launch templates and CloudFormation first!)."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "No unused security groups in {{ outputs.audit_region.vars.REGION_DONE }} — every SG is attached to a live interface."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: Unused Security Group Finder
  metaTitle: Find Unused Security Groups for Cleanup | Kestra
  shortDescription: Audit security groups across regions against live network interfaces, and get a Slack report of the orphaned ones ready for cleanup review.
  metaDescription: Stale security groups are a security liability. This flow finds SGs attached to nothing and reports them weekly.
  description: |
    Unused security groups cost nothing — but they cost you in the ways that matter: every audit turns into archaeology, every rule change risks breaking something nobody remembers, and stale allow-rules are exactly what attackers hope you forgot. This blueprint finds the orphaned ones with the real EC2 API.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists all non-default security groups, then checks each against live network interfaces.
    4. SGs attached to zero interfaces are flagged unused (default SGs are always excluded).
    5. An `If` task posts a Slack report with the orphaned SG IDs only when something is actually unused.

    ## What you get

    - A weekly list of security groups attached to nothing, with names for context.
    - A smaller, reviewable security surface — fewer stale rules to audit.
    - Multi-region coverage in one run.
    - Silence when everything is in use — alerts only on real findings.

    ## Who it's for

    Platform and security engineers drowning in security groups from deleted environments, where nobody dares delete a rule "just in case."

    ## Why orchestrate this with Kestra

    A one-off CLI session finds today's orphans and is forgotten by next month. As a scheduled Kestra flow the audit runs itself, every run is logged for audit, and adding a region is one list entry — not a new script. Pair it with your change process so cleanup becomes routine.

    ## Prerequisites

    - AWS credentials with `ec2:DescribeSecurityGroups` and `ec2:DescribeNetworkInterfaces` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EC2 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EC2 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the cleanup report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions you run EC2 in.
    3. Run manually once and review the Slack report (or the clean log line).
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Also check references in launch templates and CloudFormation before flagging.
    - Exclude SGs tagged `Keep=true` for known standby setups.
    - Add an opt-in delete gate once the review process is trusted.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [Security group best practices](https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html)
    - [EC2 describe-network-interfaces API](https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-network-interfaces.html)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
