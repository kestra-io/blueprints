id: apache-druid-unserved-segments-query-drift-sentinel
namespace: company.analytics

inputs:
  - id: druid_coordinator_url
    type: STRING
    defaults: "http://druid-coordinator.internal:8081"
    description: Base URL of Apache Druid Coordinator service.

tasks:
  - id: inspect_segment_load
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Druid Coordinator load status for unserved segments
        curl -s -f "{{ inputs.druid_coordinator_url }}/druid/coordinator/v1/loadstatus?full" > /tmp/druid_load_telemetry.json
        
        UNSERVED_COUNT=$(jq '[to_entries[] | select(.value < 100.0)] | length // 0' /tmp/druid_load_telemetry.json)
        echo "::set-output name=unserved_datasources::$UNSERVED_COUNT::"

  - id: evaluate_segment_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_segment_load.vars.unserved_datasources | int > 0 }}"
    then:
      - id: notify_analytics_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#analytics-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Apache Druid Unserved Segments Alert",
                "text": "Druid Coordinator at `{{ inputs.druid_coordinator_url }}` reported *{{ outputs.inspect_segment_load.vars.unserved_datasources }} datasource(s) with unserved segments (< 100% load status)*! Historical nodes are out of disk capacity, tier replication has stalled, or deep storage download timeouts have occurred.",
                "footer": "Kestra Analytics Sentinel • Apache Druid"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#analytics-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Druid Sentinel Failure",
            "text": "Failed to query Druid Coordinator API. Verify coordinator address and network reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Apache Druid Coordinator for unserved segments and historical tier imbalances to prevent analytical query errors."
  metaTitle: Apache Druid Real-Time Ingestion and Unserved Segment Drift Sentinel with Kestra
  title: Apache Druid Real-Time Ingestion and Unserved Segment Drift Sentinel
  shortDescription: Audits Apache Druid Coordinator for unserved segments and historical tier imbalances to prevent analytical query errors.
  description: |
    ## How it works
    This workflow connects to the Apache Druid Coordinator REST API (`/druid/coordinator/v1/loadstatus?full`) to audit datasource segment serving percentages across historical tiers. In Apache Druid, real-time ingestion tasks push published segments to deep storage (S3, GCS, HDFS), after which historical nodes download and serve them in memory. If historical tier disks run out of capacity, or network timeouts prevent segment downloads, segment load percentages drop below 100%. Queries hitting affected intervals return incomplete data or throw query exceptions. This workflow detects unserved segments and alerts analytics teams.

    ## What you get
    - Real-time visibility into Apache Druid segment serving health.
    - Prevents silent analytical reporting gaps and missing time-window metrics.
    - Quantitative tracking of datasources with incomplete segment loads.

    ## Who it's for
    - Real-Time Analytics Engineers and Druid Database Administrators.
    - SREs maintaining high-throughput OLAP reporting clusters.

    ## Why orchestrate this with Kestra
    - **Continuous Cluster Health Auditing**: Regularly audits Coordinator load status automatically.
    - **Decoupled Monitoring**: Uses standard Druid REST endpoints without external monitoring agents.
    - **Instant Team Escalation**: Delivers notifications with affected datasources directly to Slack.

    ## Prerequisites
    - Apache Druid cluster with Coordinator HTTP API accessible.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Druid Coordinator URL.
    3. Run the workflow to inspect segment load status.

    ## How to extend
    - Query `/druid/coordinator/v1/tiers` to identify specific historical tiers running low on disk space.
    - Dynamically update retention rules via Coordinator API to purge stale historical partitions.

    ## Links
    - [Apache Druid Coordinator API Documentation](https://druid.apache.org/docs/latest/operations/api-reference#coordinator)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  verified: false
  demo: false
