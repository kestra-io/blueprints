id: rabbitmq-file-descriptors-sentinel
namespace: company.messaging

inputs:
  - id: rabbitmq_management_host
    type: STRING
    defaults: rabbitmq.internal:15672
    description: Host and port of the RabbitMQ Management API.
  - id: rabbitmq_username
    type: STRING
    defaults: guest
    description: Username for RabbitMQ Management API.
  - id: max_fd_utilization_percent_threshold
    type: FLOAT
    defaults: 80.0
    description: Maximum permissible file descriptor utilization percentage before alerting.

tasks:
  - id: inspect_file_descriptors
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects RabbitMQ cluster nodes to evaluate file descriptor utilization.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      RMQ_HOST: "{{ inputs.rabbitmq_management_host }}"
      RMQ_USER: "{{ inputs.rabbitmq_username }}"
      RMQ_PASS: "{{ secret('RABBITMQ_PASSWORD') }}"
      THRESHOLD: "{{ inputs.max_fd_utilization_percent_threshold }}"
    script: |
      import os
      import sys
      import requests
      from requests.auth import HTTPBasicAuth
      from kestra import Kestra

      host = os.environ.get("RMQ_HOST", "").rstrip("/")
      user = os.environ.get("RMQ_USER", "")
      password = os.environ.get("RMQ_PASS", "")
      threshold = float(os.environ.get("THRESHOLD", "80.0"))
      url = f"http://{host}/api/nodes"

      try:
          resp = requests.get(url, auth=HTTPBasicAuth(user, password), timeout=15)
          resp.raise_for_status()
          nodes = resp.json()
      except Exception as err:
          print(f"Error: Failed to query nodes at {url}: {err}", file=sys.stderr)
          sys.exit(1)

      exhausted_nodes = []
      for n in nodes:
          name = n.get("name", "")
          fd_used = n.get("fd_used", 0)
          fd_total = n.get("fd_total", 1)
          utilization_pct = (fd_used / fd_total * 100.0) if fd_total > 0 else 0.0
          if utilization_pct >= threshold:
              exhausted_nodes.append({
                  "node": name,
                  "fd_used": fd_used,
                  "fd_total": fd_total,
                  "utilization_pct": round(utilization_pct, 1)
              })

      exhausted_count = len(exhausted_nodes)
      alert_triggered = bool(exhausted_count > 0)
      print(f"FD audit: total={len(nodes)}, exhausted={exhausted_count}, alert={alert_triggered}")

      Kestra.outputs({
          "total_nodes": len(nodes),
          "exhausted_nodes_count": exhausted_count,
          "alert_triggered": alert_triggered
      })

  - id: evaluate_fd_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_file_descriptors.vars.alert_triggered }}"
    then:
      - id: alert_messaging_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *RabbitMQ File Descriptor Alert*: Node on {{ inputs.rabbitmq_management_host }} reached {{ fromJson(read(outputs.inspect_file_descriptors.outputFiles['fd_summary.json'])).exhausted_nodes[0].utilization_pct }}% file descriptor utilization ({{ fromJson(read(outputs.inspect_file_descriptors.outputFiles['fd_summary.json'])).exhausted_nodes[0].fd_used }} / {{ fromJson(read(outputs.inspect_file_descriptors.outputFiles['fd_summary.json'])).exhausted_nodes[0].fd_total }} FDs). Increase OS `ulimit -n` to avoid connection rejection."
          }

outputs:
  - id: total_nodes
    type: INT
    value: "{{ outputs.inspect_file_descriptors.vars.total_nodes }}"
  - id: exhausted_nodes_count
    type: INT
    value: "{{ outputs.inspect_file_descriptors.vars.exhausted_nodes_count }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.inspect_file_descriptors.vars.alert_triggered }}"

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *RabbitMQ Sentinel Failure*: Failed to query node metrics on {{ inputs.rabbitmq_management_host }}."
      }

triggers:
  - id: scheduled_fd_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits RabbitMQ broker nodes to detect file descriptor and socket saturation before new client connections are refused."
  metaTitle: RabbitMQ File Descriptor and Socket Exhaustion Sentinel with Kestra
  title: RabbitMQ File Descriptor and Socket Exhaustion Sentinel
  shortDescription: Audits RabbitMQ broker nodes to detect file descriptor and socket saturation before new client connections are refused.
  description: |
    ## How it works
    This sentinel contacts the RabbitMQ Management API `/api/nodes` endpoint across all cluster instances. It computes the percentage of allocated file descriptors in use (`fd_used` vs `fd_total`), alerting SREs before operating system limits cause the Erlang VM to refuse client socket connections.

    ## What you get
    - Continuous validation of operating system file handle headroom on broker hosts.
    - Early warning against connection drops during traffic spikes.
    - Actionable Slack notifications detailing node names, used handles, and total limits.

    ## Who it's for
    - Messaging infrastructure engineers and SREs administering RabbitMQ clusters.
    - System administrators tuning OS kernel limits for high-concurrency microservices.

    ## Why orchestrate this with Kestra
    Kestra automates distributed system observability, executing scheduled health checks with fine-grained error management and notification delivery.

    ## Prerequisites
    - RabbitMQ Management plugin enabled.
    - Secrets `RABBITMQ_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `rabbitmq_management_host` and credentials.
    3. Run manually to check current file descriptor utilization.

    ## How to extend
    - Query `sockets_used` and `sockets_total` concurrently for network socket analysis.
    - Trigger automated alert escalation if FD utilization exceeds 95%.
    - Forward file descriptor metrics to Datadog or Prometheus.

    ## Links
    - [RabbitMQ Production Checklist File Descriptors](https://www.rabbitmq.com/docs/production-checklist#file-descriptors)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
