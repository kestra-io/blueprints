id: api-deprecation-sunset-tracker
namespace: company.content

description: |
  Scan an OpenAPI spec for deprecated endpoints and track sunset dates in Slack.

inputs:
  - id: openapi_url
    type: STRING
    description: Public URL of the OpenAPI JSON spec
    defaults: https://example.com/openapi.json
  - id: warn_within_days
    type: INT
    description: Warn when sunset is within this many days
    defaults: 60

triggers:
  - id: weekly_spec_scan
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every Wednesday at 9 AM UTC
    cron: "0 9 * * 3"
  - id: spec_update_hook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Rescan when the API spec is republished
    key: "{{ secret('SPEC_WEBHOOK_KEY') }}"

tasks:
  - id: fetch_spec
    type: io.kestra.plugin.core.http.Request
    description: Download the OpenAPI JSON document for analysis
    uri: "{{ inputs.openapi_url }}"
    method: GET
  - id: find_deprecations
    type: io.kestra.plugin.scripts.python.Script
    description: List deprecated operations and their sunset dates from the spec
    inputFiles:
      openapi.json: "{{ outputs.fetch_spec.body }}"
    script: |
      import json, datetime
      with open("openapi.json") as f:
          spec = json.load(f)
      paths = spec.get("paths", {})
      cutoff = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(days={{ inputs.warn_within_days }})
      rows = []
      for path, ops in paths.items():
          for method, op in (ops or {}).items():
              if not isinstance(op, dict):
                  continue
              if op.get("deprecated") is True:
                  sunset = (op.get("x-sunset") or op.get("x-sunset-date") or "")
                  rows.append({"endpoint": f"{method.upper()} {path}", "sunset": sunset, "summary": op.get("summary", "")})
      with open("deprecated.json", "w") as out:
          json.dump({"deprecated_count": len(rows), "warn_within_days": {{ inputs.warn_within_days }}, "items": rows[:100]}, out, indent=2)
      print(f"::{{deprecated_count}}::{len(rows)}")
    outputFiles:
      - deprecated.json
  - id: triage_fanout
    type: io.kestra.plugin.core.flow.Parallel
    description: Log the deprecation count and re-verify the spec URL concurrently
    tasks:
      - id: log_deprecation_count
        type: io.kestra.plugin.core.log.Log
        description: Log the deprecation report artifact location
        message: "Deprecation report at {{ outputs.find_deprecations.outputFiles['deprecated.json'] }}"
      - id: recheck_spec
        type: io.kestra.plugin.core.http.Request
        description: Re-issue a HEAD request to confirm the spec is still served
        uri: "{{ inputs.openapi_url }}"
        method: HEAD
  - id: decide_warn
    type: io.kestra.plugin.core.flow.If
    description: Notify Slack only when deprecated endpoints exist
    condition: "{{ json(read(outputs.find_deprecations.outputFiles['deprecated.json'])).deprecated_count > 0 }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the deprecation and sunset tracker to Slack
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": ":warning: {{ inputs.openapi_url }} has deprecated endpoints. Sunset watch ({{ inputs.warn_within_days }}d): {{ outputs.find_deprecations.outputFiles['deprecated.json'] }}"}

extend:
  title: API Deprecation Sunset Tracker
  metaTitle: Track API Deprecations and Sunsets with Kestra
  shortDescription: Scan OpenAPI specs weekly and warn Slack about sunsets.
  description: |
    Short summary: downloads an OpenAPI spec on a schedule or publish webhook, extracts deprecated operations with sunset metadata, and warns Slack.

    Prerequisites:
      - Secrets:
        - SLACK_WEBHOOK_URL: Slack incoming webhook for API governance (required)
        - SPEC_WEBHOOK_KEY: key securing the spec-update webhook (required)
      - Services: public OpenAPI JSON URL, Python runner in Kestra.

    Inputs:
      - openapi_url (STRING, default https://example.com/openapi.json): spec to scan.
      - warn_within_days (INT, default 60): sunset warning horizon; allowed values 7-365.

    Outputs:
      - outputs.find_deprecations.outputFiles['deprecated.json']: JSON with deprecated_count and endpoint items.

    Quick start:
      1. Set secrets SLACK_WEBHOOK_URL and SPEC_WEBHOOK_KEY.
      2. Upload the flow and point openapi_url at your spec.
      3. Enable the Wednesday schedule; POST the webhook whenever the spec republishes.

    How to extend:
      - Parse x-sunset dates and escalate items expiring within warn_within_days via an If branch.
      - Diff against the previous run's deprecated.json to alert only on new deprecations.
      - Create GitHub issues or update a governance dashboard per endpoint.

    Links:
      - [Slack plugin docs](https://kestra.io/plugins/plugin-slack)
      - [OpenAPI specification](https://spec.openapis.org/oas/latest.html)
      - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - DevOps
    - Data
  ee: false
  demo: false
  metaDescription: Scan OpenAPI for deprecated endpoints and warn Slack before sunset.
