id: apache-kafka-consumer-group-dlq-threshold-sentinel
namespace: company.team

inputs:
  - id: kafka_bootstrap
    type: STRING
    defaults: "kafka:9092"
    description: Kafka bootstrap broker address.
  - id: consumer_group
    type: STRING
    defaults: "order-processing-group"
    description: Target Kafka consumer group ID to audit.
  - id: max_acceptable_lag
    type: INT
    defaults: 1000
    description: Maximum acceptable consumer group lag before triggering alerting.

tasks:
  - id: audit_consumer_lag
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kafka-python
    env:
      BOOTSTRAP_SERVER: "{{ inputs.kafka_bootstrap }}"
      GROUP_ID: "{{ inputs.consumer_group }}"
    script: |
      import os
      import sys
      import json
      from kafka import KafkaAdminClient, KafkaConsumer, TopicPartition
      from kestra import Kestra

      bootstrap = os.environ.get("BOOTSTRAP_SERVER", "kafka:9092")
      group_id = os.environ.get("GROUP_ID", "order-processing-group")

      try:
          admin = KafkaAdminClient(bootstrap_servers=bootstrap, request_timeout_ms=10000)
          consumer = KafkaConsumer(bootstrap_servers=bootstrap, group_id=group_id, enable_auto_commit=False, request_timeout_ms=10000)
          
          # List consumer group offsets
          group_offsets = admin.list_consumer_group_offsets(group_id)
          partitions = list(group_offsets.keys())
          
          total_lag = 0
          lag_details = []
          
          if partitions:
              end_offsets = consumer.end_offsets(partitions)
              for tp, offset_and_metadata in group_offsets.items():
                  committed = offset_and_metadata.offset if offset_and_metadata else 0
                  end = end_offsets.get(tp, committed)
                  lag = max(0, end - committed)
                  total_lag += lag
                  if lag > 0:
                      lag_details.append(f"{tp.topic}/{tp.partition}:{lag}")
          
          consumer.close()
          admin.close()
      except Exception as e:
          print(f"CRITICAL: Failed to query Kafka consumer group lag for group '{group_id}' on '{bootstrap}': {e}", file=sys.stderr)
          sys.exit(1)

      lag_summary = ", ".join(lag_details[:10]) if lag_details else "none"

      report = {
          "group_id": group_id,
          "total_lag": total_lag,
          "lag_summary": lag_summary,
          "partitions_audited": len(partitions)
      }

      with open("consumer_lag_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "total_lag": total_lag,
          "lag_summary": lag_summary
      })
      print(f"Consumer lag audit: group={group_id}, total_lag={total_lag}, summary={lag_summary}")
    outputFiles:
      - consumer_lag_report.json

  - id: evaluate_consumer_lag
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_consumer_lag.vars.total_lag | int > inputs.max_acceptable_lag }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#streaming-incidents",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Apache Kafka Consumer Group Lag Spike Alert",
                "text": "Consumer group `{{ inputs.consumer_group }}` has accumulated *{{ outputs.audit_consumer_lag.vars.total_lag }}* unconsumed messages (threshold: {{ inputs.max_acceptable_lag }}). Topic partition lag: {{ outputs.audit_consumer_lag.vars.lag_summary }}. Impact: Real-time event stream processing is stalled or falling significantly behind producers, degrading end-to-end data freshness.",
                "footer": "Kestra Streaming Sentinel • Kafka Consumer Lag"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#streaming-incidents",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Kafka Consumer Group DLQ Sentinel Workflow Failed",
            "text": "Failed to audit Kafka consumer group `{{ inputs.consumer_group }}` lag on `{{ inputs.kafka_bootstrap }}`. Execution ID: {{ execution.id }}",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Apache Kafka consumer group lag to prevent pipeline delays, partition stall backpressure, and DLQ overflow."
  metaTitle: Apache Kafka Consumer Group Lag Sentinel with Kestra
  title: Apache Kafka Consumer Group Lag Sentinel
  shortDescription: Audits Apache Kafka consumer group lag to prevent pipeline delays, partition stall backpressure, and DLQ overflow.
  description: |
    ## How it works
    This workflow connects to the Kafka cluster and queries consumer group commit offsets alongside current log end offsets per topic partition. Unbounded lag accumulation indicates stalled downstream workers, poisoned payload deadlocks, or unmanaged scaling limits. When cumulative group lag breaches threshold boundaries, an urgent Slack incident alert is generated.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_schedule Schedule Trigger] --> B[audit_consumer_lag Python Script]
      B --> C{Total Lag > Threshold?}
      C -- Yes --> D[notify_streaming_team Slack Webhook]
      C -- No --> E[Consumer Group Healthy]
    ```

    ## Prerequisites
    - Kafka broker access via port 9092.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Set `kafka_bootstrap` and `consumer_group`.
    3. Run manually to check consumer group lag.

    ## Links
    - [Apache Kafka Consumer Group Documentation](https://kafka.apache.org/documentation/#basic_ops_consumer_lag)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Event-Driven Architecture
    - Day 2 Operations
  ee: false
  demo: false
