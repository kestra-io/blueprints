id: publicrecords-uk-find-a-tender-scraper
namespace: company.team

inputs:
  - id: max_items
    type: INT
    displayName: Max items
    defaults: 50

tasks:
  - id: run_actor
    type: io.kestra.plugin.apify.actor.Run
    actorId: publicrecords/uk-find-a-tender-scraper
    apiToken: "{{ secret('APIFY_API_TOKEN') }}"
    maxItems: "{{ inputs.max_items }}"
    maxTotalChargeUsd: 5
    input:
      noticeType: ["tender"]
      maxItems: 50

  - id: get_dataset
    type: io.kestra.plugin.apify.dataset.Get
    apiToken: "{{ secret('APIFY_API_TOKEN') }}"
    datasetId: "{{ outputs.run_actor.defaultDatasetId }}"

extend:
  title: Pull UK government tenders
  metaTitle: Pull UK government tenders with Kestra
  shortDescription: Run publicrecords/uk-find-a-tender-scraper and fetch recent Find a Tender / Contracts Finder notices.
  description: |
    Run the **Public Records** Apify Actor `uk-find-a-tender-scraper` on a schedule, using **your** Apify API token stored as the Kestra secret `APIFY_API_TOKEN`. Usage is billed to your Apify account (free tier available).

    Store page: https://apify.com/publicrecords/uk-find-a-tender-scraper

    Disclosure: Public Records maintains this Actor.
  tags:
    - Data
  subTags:
    - Public data
  ee: false
  demo: false
  metaDescription: Schedule the Public Records UK Tenders Apify Actor and fetch Find a Tender / Contracts Finder notices into Kestra.
