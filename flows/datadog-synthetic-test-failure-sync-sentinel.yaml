id: datadog-synthetic-test-failure-sync-sentinel
namespace: company.team

inputs:
  - id: dd_site
    type: STRING
    defaults: "datadoghq.com"
    description: Datadog site hostname.
  - id: failed_test_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of failing synthetic API or browser tests.

tasks:
  - id: audit_synthetic_tests
    type: io.kestra.plugin.scripts.python.Script
    description: Connects to Datadog Synthetics API to detect live tests in Alert state.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      DD_SITE: "{{ inputs.dd_site }}"
      DD_API_KEY: "{{ secret('DATADOG_API_KEY') }}"
      DD_APP_KEY: "{{ secret('DATADOG_APP_KEY') }}"
    outputFiles:
      - synth_tests.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      site = os.environ.get("DD_SITE", "datadoghq.com")
      api_key = os.environ.get("DD_API_KEY")
      app_key = os.environ.get("DD_APP_KEY")

      if not api_key or not app_key:
          print("ERROR: DATADOG_API_KEY and DATADOG_APP_KEY secrets must be configured.", file=sys.stderr)
          sys.exit(1)

      url = f"https://api.{site}/api/v1/synthetics/tests"
      headers = {
          "DD-API-KEY": api_key,
          "DD-APPLICATION-KEY": app_key,
          "Accept": "application/json"
      }

      try:
          resp = requests.get(url, headers=headers, timeout=20)
          resp.raise_for_status()
          data = resp.json()
      except Exception as exc:
          print(f"ERROR querying Datadog synthetics tests API: {exc}", file=sys.stderr)
          sys.exit(1)

      with open("synth_tests.json", "w", encoding="utf-8") as f:
          json.dump(data, f, indent=2)

      all_tests = data.get("tests", [])
      failing_tests = []
      for t in all_tests:
          if t.get("status") == "live" and t.get("overall_state") == "Alert":
              failing_tests.append({
                  "name": t.get("name"),
                  "public_id": t.get("public_id"),
                  "type": t.get("type"),
                  "locations": t.get("locations")
              })

      failing_count = len(failing_tests)
      print(f"Audited {len(all_tests)} synthetic tests, found {failing_count} live tests in Alert state.")

      Kestra.outputs({
          "failing_count": failing_count,
          "failing_tests": json.dumps(failing_tests)
      })

  - id: evaluate_synthetic_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_synthetic_tests.vars.failing_count > inputs.failed_test_threshold }}"
    then:
      - id: notify_oncall_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#production-incidents",
            "attachments": [
              {
                "color": "danger",
                "title": "Datadog Synthetic Test Critical Outage Alert",
                "text": "Detected *{{ outputs.audit_synthetic_tests.vars.failing_count }}* failing Datadog Synthetic API / Browser test(s) in Alert state. Failing tests: {{ outputs.audit_synthetic_tests.vars.failing_tests }}. Impact: Public user journeys (logins, checkouts, landing pages, or public API endpoints) are broken from global monitoring locations.",
                "footer": "Kestra SRE Sentinel Datadog Synthetics"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#production-incidents",
        "attachments": [
          {
            "color": "danger",
            "title": "Datadog Synthetics Sentinel Execution Failed",
            "text": "The Datadog Synthetic test audit query encountered an error for execution {{ execution.id }}. Please verify Datadog API credentials and site parameters.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Datadog Synthetic API and Browser test states to detect end-user application outages and broken customer journeys."
  metaTitle: Datadog Synthetic Test Failure and User Journey Outage Sentinel with Kestra
  title: Datadog Synthetic Test Failure and User Journey Outage Sentinel
  shortDescription: Audits Datadog Synthetic API and Browser test states to detect end-user application outages and broken customer journeys.
  description: |
    ## How it works
    This workflow connects to the Datadog Synthetics API endpoint `/api/v1/synthetics/tests` to audit active synthetic probes worldwide. It inspects all live browser tests, HTTP tests, and SSL check probes. When multi-location synthetic tests enter the `Alert` state, it signifies genuine public user impact (e.g. failing checkout funnels, invalid API responses, broken SSL handshakes). An automated incident alert is immediately routed to Slack.

    ## What you get
    - Rapid visibility into public user-facing service outages.
    - Prevents reliance on delayed customer support tickets to detect broken user flows.
    - Diagnostics detailing test names, public IDs, and test types.

    ## Who it's for
    - SREs and On-Call Engineers responding to production customer-facing outages.
    - QA and Release Engineers verifying post-deployment health across global regions.

    ## Why orchestrate this with Kestra
    - **Continuous Monitoring**: Automate health polling every 15 minutes with complete audit history.
    - **Multi-Channel Dispatch**: Route high-priority incidents directly to Slack, PagerDuty, or Opsgenie.
    - **Automated Incident Response**: Easily chain with automatic rollback or traffic redirection workflows.

    ## Prerequisites
    - Datadog API Key and Application Key with permissions to read synthetic tests.
    - Secrets `DATADOG_API_KEY`, `DATADOG_APP_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra under the `company.team` namespace.
    2. Configure Datadog credentials and Slack webhook secret.
    3. Run the workflow to inspect current synthetic test status across your accounts.

    ## How to extend
    - Query individual test results (`/api/v1/synthetics/tests/{public_id}/results`) to extract exact failure step screenshots and HTTP status codes.
    - Automatically page the on-call engineer via PagerDuty for critical browser flows.

    ## Links
    - [Datadog Synthetics API Documentation](https://docs.datadoghq.com/api/latest/synthetics/#get-the-list-of-all-tests)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Business
    - Cloud
  subTags:
    - HR & Ops Automation
    - Infrastructure Automation
  ee: false
  demo: false
