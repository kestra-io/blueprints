id: envoy-proxy-cluster-circuit-breaker-overflow-sentinel
namespace: company.team
description: Audits Envoy Proxy admin telemetry endpoints for active connection and request circuit breaker overflows protecting downstream services from cascade collapse.

inputs:
  - id: envoy_admin_url
    type: STRING
    defaults: "http://envoy.internal:9901"
    description: Base HTTP URL exposing administrative Prometheus metrics for the Envoy proxy.
  - id: max_circuit_open_threshold
    type: INT
    defaults: 0
    description: Maximum allowable open circuit breakers before alerting.

tasks:
  - id: audit_envoy
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      ENVOY_URL: "{{ inputs.envoy_admin_url }}"
      MAX_OPEN: "{{ inputs.max_circuit_open_threshold }}"
    script: |
      import os
      import sys
      import re
      import json
      import requests
      from kestra import Kestra

      base_url = os.environ.get("ENVOY_URL", "http://envoy.internal:9901").rstrip("/")
      max_open = int(os.environ.get("MAX_OPEN", "0"))

      metrics_url = f"{base_url}/stats/prometheus"
      cx_open = 0
      rq_pending_open = 0

      try:
          resp = requests.get(metrics_url, timeout=12)
          resp.raise_for_status()
          for line in resp.text.splitlines():
              line = line.strip()
              if line.startswith("#") or not line:
                  continue
              if "envoy_cluster_circuit_breakers_default_cx_open" in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      cx_open += int(float(match.group(1)))
              elif "envoy_cluster_circuit_breakers_default_rq_pending_open" in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      rq_pending_open += int(float(match.group(1)))
      except Exception as err:
          print(f"CRITICAL: Failed to query Envoy metrics at {metrics_url}: {err}", file=sys.stderr)
          sys.exit(1)

      total_open = cx_open + rq_pending_open
      report = {
          "cx_open": cx_open,
          "rq_pending_open": rq_pending_open,
          "total_open": total_open,
          "threshold": max_open,
          "is_breached": total_open > max_open
      }

      with open("circuit_breakers.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Envoy Breakers: cx_open={cx_open}, rq_pending_open={rq_pending_open}, total={total_open}")

      Kestra.outputs({
          "cx_open": cx_open,
          "rq_pending_open": rq_pending_open,
          "total_open": total_open,
          "is_breached": total_open > max_open
      })
    outputFiles:
      - circuit_breakers.json

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_envoy.vars.is_breached }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "CRITICAL: Envoy Proxy Circuit Breaker Tripped!\nAdmin: {{ inputs.envoy_admin_url }}\nConnection Breakers Open: {{ outputs.audit_envoy.vars.cx_open }}\nPending Requests Open: {{ outputs.audit_envoy.vars.rq_pending_open }}\nTotal: {{ outputs.audit_envoy.vars.total_open }} (Threshold: {{ inputs.max_circuit_open_threshold }})."
          }

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "CRITICAL: Envoy Proxy Circuit Breaker Sentinel failed on {{ inputs.envoy_admin_url }}. Execution ID: {{ execution.id }}."
      }

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  title: Envoy Proxy Upstream Cluster Circuit Breaker Overflow Sentinel
  metaTitle: Envoy Proxy Circuit Breaker Overflow Sentinel Blueprint
  shortDescription: Audits Envoy Proxy admin metrics for active connection and request circuit breaker overflows.
  metaDescription: Audits Envoy Proxy admin telemetry endpoints for active connection and request circuit breaker overflows.
  description: |
    ## How it works
    This automated sentinel flow continuously assesses operational health and circuit breaker metrics for Envoy Proxy. It scrapes `/stats/prometheus` directly against the running proxy instance, isolates open connection and pending request circuit breaker flags, evaluates thresholds, and triggers instant Slack notifications with actionable contextual diagnostics when limits are breached.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_monitor Schedule Trigger] --> B[audit_envoy Python Script]
      B --> C{Breakers Tripped?}
      C -- Yes --> D[notify_slack Webhook]
      C -- No --> E[Capacity Nominal]
    ```

    ## Prerequisites
    - Outbound HTTP access to Envoy admin endpoint (`/stats/prometheus`).
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `envoy_admin_url` and `max_circuit_open_threshold`.
    3. Run manually or enable the scheduled trigger.

    ## Links
    - [Envoy Admin API Documentation](https://www.envoyproxy.io/docs/envoy/latest/operations/admin)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
    - Network
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
