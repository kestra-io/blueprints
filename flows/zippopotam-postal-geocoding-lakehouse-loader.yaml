id: zippopotam-postal-geocoding-lakehouse-loader
namespace: company.analytics
description: Ingests municipal postal codes, place names, state jurisdictions, and geographic coordinates from Zippopotam.us into Parquet lakehouse storage via DuckDB, tracking geocoding directories in Kestra KV store.

inputs:
  - id: country_code
    type: STRING
    description: ISO two-letter country code.
    defaults: us

  - id: postal_codes
    type: ARRAY
    itemType: STRING
    description: List of postal codes to geocode and persist.
    defaults:
      - "90210"
      - "10001"
      - "60601"
      - "94102"
      - "33101"
      - "98101"

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known geocoded postal code mappings.
    defaults: zippopotam_monitored_postal_state

variables:
  default_state: "{}"

triggers:
  - id: monthly_geocoding_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 1 * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_postal
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            state = json.loads(raw_state) if raw_state else {}
        except Exception:
            state = {}

        country = "{{ inputs.country_code }}"
        postal_codes = json.loads("""{{ inputs.postal_codes | toJson }}""")

        headers = {"User-Agent": "KestraGeocodingLakehouse/1.0 (gis-analytics@kestra.io)"}

        records = []
        new_postal_codes = []
        new_state = dict(state)

        for code in postal_codes:
            try:
                url = f"https://api.zippopotam.us/{country}/{code}"
                resp = requests.get(url, headers=headers, timeout=15)
                if resp.status_code == 200:
                    data = resp.json()
                    c_name = data.get("country", "")
                    post_code = data.get("post code", code)
                    places = data.get("places", [])

                    for p in places:
                        place_name = p.get("place name", "")
                        state_name = p.get("state", "")
                        state_abbr = p.get("state abbreviation", "")
                        lon = float(p.get("longitude", 0.0) or 0.0)
                        lat = float(p.get("latitude", 0.0) or 0.0)

                        is_new = code not in state

                        records.append({
                            "postal_code": post_code,
                            "country": c_name,
                            "place_name": place_name,
                            "state_name": state_name,
                            "state_abbreviation": state_abbr,
                            "longitude": lon,
                            "latitude": lat,
                            "is_new_mapping": is_new,
                            "harvest_time": datetime.utcnow().isoformat()
                        })

                        if is_new:
                            new_postal_codes.append({"code": code, "place": place_name, "state": state_abbr})

                        new_state[code] = place_name
            except Exception as e:
                print(f"Error fetching postal geocoding for '{code}': {e}")

        with open("postal_geocodes.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE postal_geocodes AS SELECT * FROM read_json_auto('postal_geocodes.json')")
            con.execute("COPY postal_geocodes TO 'postal_geocoding_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY postal_geocodes TO 'postal_geocoding_archive.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE postal_geocodes (
                    postal_code VARCHAR,
                    country VARCHAR,
                    place_name VARCHAR,
                    state_name VARCHAR,
                    state_abbreviation VARCHAR,
                    longitude DOUBLE,
                    latitude DOUBLE,
                    is_new_mapping BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY postal_geocodes TO 'postal_geocoding_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY postal_geocodes TO 'postal_geocoding_archive.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_geocoded_places": len(records),
            "new_postal_codes_count": len(new_postal_codes),
            "new_postal_codes": new_postal_codes[:5],
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - postal_geocoding_archive.parquet
      - postal_geocoding_archive.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_postal.vars.updated_state | toJson }}"

  - id: check_new_postal
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_postal.vars.new_postal_codes_count > 0 }}"
    then:
      - id: notify_new_postal
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "📍 Postal Geocoding Update: Ingested {{ outputs.ingest_and_transform_postal.vars.new_postal_codes_count }} new municipal postal code geocoding records."

outputs:
  - id: total_places
    type: INT
    value: "{{ outputs.ingest_and_transform_postal.vars.total_geocoded_places }}"
  - id: new_postal_codes_count
    type: INT
    value: "{{ outputs.ingest_and_transform_postal.vars.new_postal_codes_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_postal.outputFiles['postal_geocoding_archive.parquet'] }}"

extend:
  title: Zippopotam Postal Geocoding Directory Lakehouse Loader with DuckDB
  metaTitle: Zippopotam Postal Geocoding Lakehouse Loader | Kestra
  shortDescription: Ingests municipal postal codes, place names, state jurisdictions, and geographic coordinates from Zippopotam.us into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Zippopotam API for postal geocodes and boundary place names, convert coordinate tables into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, geospatial harmonization, and analytical lakehouse persistence of municipal postal codes,
    place names, state jurisdictions, and geographic latitude/longitude coordinates from Zippopotam.us into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`zippopotam_monitored_postal_state`) for previously verified postal code mappings.
    2. **Zippopotam API Extraction**: Queries the official Zippopotam REST API (`api.zippopotam.us/{country}/{postal_code}`) across configured target postal codes.
    3. **DuckDB GIS Normalization**: Unpacks place names, state abbreviations, latitude, and longitude coordinates into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized postal directory records into columnar Parquet and CSV files for logistics route planning and spatial join dimensions.
    5. **New Mapping Detection & State Commitment**: Detects newly resolved postal zones, logs discovery summaries, and commits mappings to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of global postal code georeference dimensions.
    - Columnar Parquet datasets queryable with DuckDB, GIS toolchains, Snowflake, or ClickHouse.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Logistics and Delivery Operations Engineers maintaining spatial postal lookup tables.
    - GIS Analysts and Demographic Researchers managing boundary reference dimensions.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical postal resolution state across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `api.zippopotam.us`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting teams on newly mapped postal areas.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set your target `postal_codes` array and `country_code`.
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `monthly_geocoding_sync` schedule for automated monthly updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition monthly georeferenced postal lookup files.
    - Connect a customer address validation task downstream in DuckDB.

    ## Links

    - [Zippopotam.us API Documentation](https://www.zippopotam.us/)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
