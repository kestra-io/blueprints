id: postgres-detach-pending-partition-finalize-guard
namespace: company.team

inputs:
  - id: postgres_url
    type: STRING
    defaults: jdbc:postgresql://localhost:5432/postgres
    description: >-
      PostgreSQL JDBC URL for the database whose partition trees are checked. Example jdbc:postgresql://postgres:5432/app.

  - id: use_secret_auth
    type: BOOL
    defaults: true
    description: >-
      Leave true in production so the connection reads POSTGRES_USERNAME and POSTGRES_PASSWORD from secrets. Set false only to pass credentials inline in a disposable test environment.

  - id: postgres_username
    type: STRING
    defaults: postgres
    description: Username used only when use_secret_auth is false. Ignored in production.

  - id: postgres_password
    type: STRING
    defaults: ""
    description: Password used only when use_secret_auth is false. Ignored in production.

  - id: schema
    type: STRING
    defaults: ""
    description: >-
      Optional single schema to restrict the scan to, matched on the parent table's schema. Leave empty to scan every user schema in the database.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, report the partitions stuck in a pending detach without finalizing anything.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: >-
      When true and dry_run is false, run DETACH PARTITION FINALIZE on each stuck partition behind an approval gate, then re-read pg_inherits.

variables:
  detect_sql: |
    WITH live AS (
      SELECT a.pid, upper(a.query) AS q
      FROM pg_stat_activity a
      WHERE a.pid <> pg_backend_pid()
        AND a.state = 'active'
        AND a.query ILIKE '%DETACH PARTITION%'
        AND a.query ILIKE '%CONCURRENTLY%'
        AND a.query NOT ILIKE '%FINALIZE%'
    ),
    pending AS (
      SELECT pn.nspname AS parent_schema, pc.relname AS parent,
             cn.nspname AS child_schema, cc.relname AS child,
             cc.oid AS child_oid,
             pg_get_expr(cc.relpartbound, cc.oid) AS bound,
             cc.reltuples AS reltuples,
             pg_total_relation_size(cc.oid) AS child_bytes
      FROM pg_inherits i
      JOIN pg_class cc ON cc.oid = i.inhrelid
      JOIN pg_namespace cn ON cn.oid = cc.relnamespace
      JOIN pg_class pc ON pc.oid = i.inhparent
      JOIN pg_namespace pn ON pn.oid = pc.relnamespace
      JOIN pg_partitioned_table pt ON pt.partrelid = pc.oid
      WHERE i.inhdetachpending
        AND cc.relkind IN ('r', 'p', 'f')
        AND pn.nspname NOT IN ('pg_catalog', 'information_schema')
        AND pn.nspname NOT LIKE 'pg_toast%'
        AND pn.nspname NOT LIKE 'pg_temp%'
        AND ('{{ inputs.schema }}' = '' OR pn.nspname = '{{ inputs.schema }}')
    )
    SELECT p.parent_schema, p.parent, p.child_schema, p.child,
      (p.parent_schema || '.' || p.parent) AS qparent,
      (p.child_schema || '.' || p.child) AS qchild,
      p.bound,
      CASE WHEN p.reltuples < 0 THEN 'row count unknown, never analyzed'
           ELSE 'about ' || p.reltuples::bigint || ' rows' END AS rows_note,
      pg_size_pretty(p.child_bytes) AS child_size,
      coalesce((SELECT min(l.pid)::text FROM live l
                WHERE l.q LIKE '%' || upper(p.parent) || '%'
                  AND l.q LIKE '%' || upper(p.child) || '%'), '') AS live_pid,
      format('ALTER TABLE %I.%I DETACH PARTITION %I.%I FINALIZE',
             p.parent_schema, p.parent, p.child_schema, p.child) AS finalize_sql,
      (p.parent_schema || '.' || p.parent || ' -> ' || p.child_schema || '.' || p.child
        || ' [' || p.bound || ', '
        || CASE WHEN p.reltuples < 0 THEN 'row count unknown, never analyzed'
                ELSE 'about ' || p.reltuples::bigint || ' rows' END
        || ', ' || pg_size_pretty(p.child_bytes) || ']') AS label
    FROM pending p
    ORDER BY p.parent_schema, p.parent, p.child_schema, p.child

triggers:
  - id: daily_pending_detach_check
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 4 * * *"
    description: >-
      Daily sweep for partitions left in a pending detach. Disabled by default and pinned to safe mode so it reports without finalizing anything until an operator enables it.
    inputs:
      dry_run: true
      auto_remediate: false

tasks:
  - id: detect
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Read pg_inherits for children whose inhdetachpending is true, which is the mark PostgreSQL leaves when DETACH PARTITION CONCURRENTLY was interrupted between its two phases. Only children of a real partitioned parent are considered, so plain inheritance and system schemas are out of scope. Each row carries its bounds, its size and the exact DETACH PARTITION FINALIZE statement, plus live_pid when a concurrent detach for that same pair is still running right now.
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.detect_sql) }}"

  - id: summarize
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      Split the detected rows once into the ones safe to finalize (no concurrent detach running for that pair) and the ones to leave alone, so the log, the alert, the loop and the re-verify all read the same sets.
    values:
      targets_json: >-
        {{ {'v': outputs.detect.rows} | toJson | jq('.v | map(select(.live_pid == ""))') | first | toJson }}
      target_count: >-
        {{ {'v': outputs.detect.rows} | toJson | jq('.v | map(select(.live_pid == "")) | length') | first }}
      target_names: >-
        {{ {'v': outputs.detect.rows} | toJson | jq('.v | map(select(.live_pid == "") | .label) | join(" | ")') | first }}
      inflight_count: >-
        {{ {'v': outputs.detect.rows} | toJson | jq('.v | map(select(.live_pid != "")) | length') | first }}
      inflight_names: >-
        {{ {'v': outputs.detect.rows} | toJson | jq('.v | map(select(.live_pid != "") | .label + " pid " + .live_pid) | join(" | ")') | first }}

  - id: log_detect
    type: io.kestra.plugin.core.log.Log
    message: |
      PostgreSQL partitions stuck in a pending detach: {{ outputs.detect.size }} found.
      Finalizable now: {{ outputs.summarize.values.target_count }}. Targets: {{ outputs.summarize.values.target_names }}
      Left alone because a concurrent detach is still running: {{ outputs.summarize.values.inflight_count }}. {{ outputs.summarize.values.inflight_names }}
      Mode: dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }} schema={{ inputs.schema }}

  - id: guard
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.detect.size > 0 }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: >-
          Alert on every detection, in dry run and in remediate mode, so a human sees the stranded partitions even when nothing is finalized.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "PostgreSQL pending detach guard: {{ outputs.detect.size }} partition(s) are stuck between the two phases of DETACH PARTITION CONCURRENTLY. The parent accepts no further concurrent detach until each one is finalized. Finalizable now {{ outputs.summarize.values.target_count }}: {{ outputs.summarize.values.target_names }}. Still being detached by another session: {{ outputs.summarize.values.inflight_count }}. dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}."}

      - id: mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and (outputs.summarize.values.target_count | number) > 0 }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Hold the run until a human approves finalizing. FINALIZE takes a brief ACCESS EXCLUSIVE lock on the parent and the child, so it is not free on a busy table. It also leaves the child as a standalone table that the operator then owns.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: >-
                  Set true to finalize the listed detaches. Anything else leaves them pending.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: finalize_detaches
                type: io.kestra.plugin.core.flow.Loop
                description: >-
                  Remediation loop. One DETACH PARTITION FINALIZE per stuck partition, concurrencyLimit 1 so two finalizes against the same parent never contend for its lock. allowFailure so one rejected statement does not stop the pass and the re-read of pg_inherits stays the real gate.
                concurrencyLimit: 1
                values: "{{ outputs.summarize.values.targets_json }}"
                tasks:
                  - id: finalize_one
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    description: Complete the interrupted detach for one partition.
                    allowFailure: true
                    url: "{{ inputs.postgres_url }}"
                    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).finalize_sql }}"

                  - id: finalize_log
                    type: io.kestra.plugin.core.log.Log
                    message: "Ran {{ fromJson(item.value).finalize_sql }}. {{ fromJson(item.value).qchild }} keeps its rows as a standalone table."

              - id: reverify
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: >-
                  Re-run the same read of pg_inherits. Any partition that was a target and is still pending detach is a failure.
                url: "{{ inputs.postgres_url }}"
                username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                fetchType: FETCH
                sql: "{{ render(vars.detect_sql) }}"

              - id: verify_plan
                type: io.kestra.plugin.core.output.OutputValues
                description: Keep only the targets that are still pending detach after the pass. A partition another session stranded during the run was never a target, so it does not fail this run.
                values:
                  still_json: >-
                    {{ {'t': fromJson(outputs.summarize.values.targets_json), 'r': outputs.reverify.rows} | toJson | jq('(.r | map(.qchild)) as $rem | .t | map(select(([.qchild] - $rem) | length == 0))') | first | toJson }}
                  still_names: >-
                    {{ {'t': fromJson(outputs.summarize.values.targets_json), 'r': outputs.reverify.rows} | toJson | jq('(.r | map(.qchild)) as $rem | .t | map(select(([.qchild] - $rem) | length == 0) | .label) | join(" | ")') | first }}

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.verify_plan.values.still_json | jq('length') | first) > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      {{ outputs.verify_plan.values.still_json | jq('length') | first }} targeted partition(s) are still pending detach after the pass: {{ outputs.verify_plan.values.still_names }}. The connecting role may not own the parent table. The statement may also have failed to take its lock inside the server's lock timeout.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: "Finalized and verified. {{ outputs.summarize.values.target_count }} partition(s) were pending detach before, 0 of them after. Each one is now an ordinary standalone table with its rows intact. Its former parent accepts DETACH PARTITION CONCURRENTLY again. Dropping the standalone table is a separate decision for you."
            else:
              - id: not_approved
                type: io.kestra.plugin.core.log.Log
                message: "Approval not granted, so nothing was finalized. {{ outputs.detect.size }} partition(s) are still pending detach."
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: "Report only (dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}). {{ outputs.summarize.values.target_count }} partition(s) would be finalized: {{ outputs.summarize.values.target_names }}. No change made."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No partition in scope is pending detach. Every partition tree is either fully attached or fully detached."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: >-
      Post to Slack on any failure, including a connection error or targeted partitions still pending detach after the pass.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "PostgreSQL pending detach guard FAILED (execution {{ execution.id }}). A connection error, a rejected FINALIZE or targeted partitions still pending detach after the pass. Check the run."}

extend:
  title: PostgreSQL Pending Detach Partition Finalize Guard
  shortDescription: Find PostgreSQL partitions left half detached by an interrupted DETACH PARTITION CONCURRENTLY, complete the detach with FINALIZE behind a dry-run and approval gate, then re-read pg_inherits and fail if any target is still pending.
  metaTitle: PostgreSQL Pending Detach Partition Finalize Guard with Kestra
  metaDescription: Detect PostgreSQL partitions stuck pending detach after an interrupted concurrent detach, finalize them behind an approval gate, then re-read pg_inherits.
  description: |
    `ALTER TABLE ... DETACH PARTITION ... CONCURRENTLY` exists so a partition can leave a busy table without an exclusive lock on the parent. It does that by running in two phases: the first marks the partition as going away and commits, the second finishes the job once every transaction that could still use the old plan has ended. Interrupt the session between those phases, with a cancelled statement, a dropped connection or a deploy that killed the job. The partition is then stranded. `pg_inherits.inhdetachpending` stays true, so the partition is neither properly attached nor properly detached. The parent then refuses any further concurrent detach. The only way out is `DETACH PARTITION ... FINALIZE`, which almost nobody knows exists. This guard finds those partitions, finalizes them under a gate and proves the state cleared.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    Measured on PostgreSQL 16.15 while building this blueprint.

    - A stranded partition is invisible to the usual checks. `pg_partition_tree()` already leaves it out and the parent stops reading it, so a row count through the parent looks correct. Meanwhile the child still carries `relispartition = true`, keeps its partition bound plus its `pg_inherits` row. `inhdetachpending` is the only honest signal.
    - The operational bite lands on the next detach. With one partition pending, `ALTER TABLE ... DETACH PARTITION ... CONCURRENTLY` on the same parent fails with `partition "..." already pending detach in partitioned table "..."`. A retention job that detaches a partition a day is stuck from that moment on.
    - `FINALIZE` is not destructive. The child becomes an ordinary standalone table: `relispartition` flips to false, the partition bound is dropped, the `pg_inherits` row goes away and every row stays where it was. Verified at 1200 rows in and 1200 rows out.
    - Running `FINALIZE` while another session's concurrent detach is still waiting completes the detach under that session, which then fails with `relation "..." is not a partition of relation "..."`. That is why this guard reads `pg_stat_activity` and leaves a pair alone while a concurrent detach for it is active.

    ## Safety

    - Read-only by default. `dry_run` is true and `auto_remediate` is false, so a plain run reports and finalizes nothing.
    - A `FINALIZE` happens only when `auto_remediate` is true and `dry_run` is false. It then waits for a human to resume the `Pause` with `approved` set true. An unanswered gate reads as not approved.
    - No rows are lost. `FINALIZE` completes a detach, it does not drop anything. The partition ends up as a standalone table holding exactly the rows it held before. Dropping that table, archiving it or re-attaching it is a separate decision that stays with you.
    - `FINALIZE` is not completely free. It takes a brief `ACCESS EXCLUSIVE` lock on the parent and the child, which is why it sits behind the approval gate rather than running on a schedule.
    - A partition another session is detaching right now is reported and skipped, never finalized, so the guard does not pull the work out from under a live operation.
    - Scope is children of a real partitioned parent. Plain inheritance children, system catalogs, TOAST and temporary schemas are excluded.
    - The re-read of `pg_inherits` is the real gate, so a `FINALIZE` the connecting role is not allowed to run surfaces as a failed run.

    ## How it works

    1. `detect` (`io.kestra.plugin.jdbc.postgresql.Query`) joins `pg_inherits` to `pg_class`, `pg_namespace` and `pg_partitioned_table`, keeps the rows where `inhdetachpending` is true and returns one row per stranded partition with its bound, its estimated row count, its on-disk size and the exact `DETACH PARTITION FINALIZE` statement built with `format('%I')`. The same query reads `pg_stat_activity` and fills `live_pid` when a concurrent detach for that exact parent and child is still running.
    2. `summarize` (`io.kestra.plugin.core.output.OutputValues`) splits the rows once into the finalizable set and the in-flight set, so every later step reads the same lists.
    3. `log_detect` (`io.kestra.plugin.core.log.Log`) logs both counts, the targets and the mode.
    4. `guard` (`io.kestra.plugin.core.flow.If`) branches on the count. With none found, `clean` logs and the run ends. Otherwise `findings_alert` posts the finding on every detection.
    5. `mode` (`io.kestra.plugin.core.flow.If`) enters the remediation branch only when `auto_remediate` is true, `dry_run` is false and at least one target is finalizable. Otherwise `report_only` lists what would be finalized and stops.
    6. `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run until a human resumes it. `finalize_detaches` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) then runs one `ALTER TABLE ... DETACH PARTITION ... FINALIZE` per target.
    7. `reverify` re-reads `pg_inherits` and `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` if any targeted partition is still pending detach. A partition stranded by somebody else during the run was never a target, so it does not fail the run.

    ## What you get

    - A detector for a state no standard monitoring query reports, built on the one catalog column that actually carries it.
    - The exact remediation statement per partition, generated inside PostgreSQL so identifiers are quoted correctly.
    - A clear answer to the question an operator asks first: the rows survive, the partition becomes a standalone table, the follow-up `DROP TABLE` is yours to make.
    - A precision guard that leaves a partition alone while another session is still detaching it.
    - A real verification step. The run passes only when the second read of `pg_inherits` shows no target still pending.
    - Slack alerts on the findings and on any failure.

    ## Who it's for

    - DBAs and platform engineers who run partition retention with concurrent detaches and have had one interrupted by a deploy, a cancelled query or a connection drop.
    - Teams whose nightly detach job started failing with "already pending detach" and who need the FINALIZE path found and run safely.
    - Teams evaluating the PostgreSQL plugin who want an example that reads the catalog, drives gated DDL and proves the state changed.

    ## Why orchestrate this with Kestra

    PostgreSQL leaves no trace of the interrupted statement, raises no alert and will not finish the job itself. The partition sits pending until somebody reads `pg_inherits` and knows the FINALIZE spelling. A cron job running `FINALIZE` blindly is the wrong answer, because the statement takes a short exclusive lock and can collide with a detach another session is still running. Kestra closes the gap. It schedules the sweep, builds each statement from the live catalog, gates the change behind dry-run and human approval, skips the pairs a live detach still owns, re-reads `pg_inherits` to turn a hopeful statement into a verified one, applies the same connection settings to every task and posts a Slack alert the moment a step fails.

    ## Tested end to end

    Run on Kestra 2.0.5 against PostgreSQL 16.15, with a local HTTP sink standing in for Slack. One schema held `appd.events` partitioned by month with three partitions, `appd.orders` partitioned by month with two, `appd.metrics` as a clean control, a plain inheritance parent and child, plus an ordinary table. Partitions were stranded by holding a read transaction on the parent, starting `DETACH PARTITION ... CONCURRENTLY` in a second session and cancelling that backend with `pg_cancel_backend` while it waited. Every count was confirmed with psql against `pg_inherits`.

    - Detector can fail. On the clean tree it returned 0 and took the clean branch. With two partitions stranded it returned exactly those two, never a healthy sibling partition, never the plain inheritance child and never the ordinary table.
    - Dry run reported both targets, alerted and left `inhdetachpending` true for both.
    - Remediate with approval ran both `FINALIZE` statements and the re-read reported 0 of the 2 still pending. Row counts went 1200 in and 1200 out on one target and 400 in and 400 out on the other, both now ordinary tables with `relispartition` false and no partition bound. The healthy sibling partitions stayed attached.
    - The parent that had refused `DETACH PARTITION ... CONCURRENTLY` with "already pending detach" accepted the same statement after the fix.
    - Declining the approval gate finalized nothing and left both partitions pending.
    - A role without ownership of the parent had its `FINALIZE` rejected, the re-read found the target still pending and the run failed and alerted rather than reporting success.
    - A partition with a concurrent detach still waiting in another session was reported as in-flight and skipped, so the run made no change to it.
    - An unreachable host failed the first query and fired the Slack alert.

    ## Prerequisites

    A PostgreSQL server reachable over JDBC, version 14 or later, since `DETACH PARTITION CONCURRENTLY` and `FINALIZE` arrive in 14. The connecting user must be able to read the catalog plus `pg_stat_activity`. To run `FINALIZE` it must also own the parent tables.

    ### Secrets

    - `POSTGRES_USERNAME`: PostgreSQL user, read when `use_secret_auth` is true.
    - `POSTGRES_PASSWORD`: password for that user.
    - `SLACK_WEBHOOK_URL`: used by `findings_alert` and the `errors` block.
    - In Kestra OSS, provide each secret as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `postgres_url` | STRING | `jdbc:postgresql://localhost:5432/postgres` | PostgreSQL JDBC URL for the target database. |
    | `use_secret_auth` | BOOL | `true` | Read credentials from secrets. Set false only for inline test credentials. |
    | `postgres_username` | STRING | `postgres` | Username used only when `use_secret_auth` is false. |
    | `postgres_password` | STRING | `""` | Password used only when `use_secret_auth` is false. |
    | `schema` | STRING | `""` | Optional single schema filter on the parent table. Empty scans every user schema. |
    | `dry_run` | BOOL | `true` | Report without finalizing anything. |
    | `auto_remediate` | BOOL | `false` | Finalize behind the approval gate when `dry_run` is false. |

    ## Quick start

    1. Set `POSTGRES_USERNAME`, `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` as namespace secrets.
    2. Import this flow.
    3. Run it with `postgres_url` pointed at your database. The default dry run reports any partition stuck pending detach.
    4. To clear them, run again with `dry_run` false and `auto_remediate` true, then resume the paused execution with `approved` true.

    ## How to extend

    - Set `schema` to restrict the sweep to one schema on a large database.
    - Fail the run as soon as detection finds anything, for a read-only drift check with no remediation.
    - Add a `DROP TABLE` step after the re-verify for partitions you know you want gone, once your retention policy says so.
    - Chain the retention job that detaches partitions behind this guard, so a stuck pending detach is cleared before the next detach is attempted.

    ## Links

    - PostgreSQL plugin: https://kestra.io/plugins/plugin-jdbc-postgres
    - ALTER TABLE DETACH PARTITION: https://www.postgresql.org/docs/current/sql-altertable.html
    - Table partitioning: https://www.postgresql.org/docs/current/ddl-partitioning.html
    - pg_inherits: https://www.postgresql.org/docs/current/catalog-pg-inherits.html
    - Schedule trigger: https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.schedule
  tags:
    - Data
    - Infrastructure
  subTags:
    - PostgreSQL
    - Maintenance
    - Day 2 Operations
  ee: false
  demo: false
