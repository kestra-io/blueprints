id: aws-kinesis-shard-iterator-age-sentinel
namespace: company.dataops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region where the Kinesis stream is provisioned.
  - id: stream_name
    type: STRING
    defaults: production-telemetry-stream
    description: Name of the Kinesis Data Stream to monitor.
  - id: max_iterator_age_ms_threshold
    type: FLOAT
    defaults: 60000.0
    description: Maximum acceptable consumer record iterator age in milliseconds before alerting (default 60s).

tasks:
  - id: query_iterator_age_metric
    type: io.kestra.plugin.aws.cli.AwsCLI
    runner: PROCESS
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws cloudwatch get-metric-statistics           --namespace AWS/Kinesis           --metric-name GetRecords.IteratorAgeMilliseconds           --dimensions Name=StreamName,Value="{{ inputs.stream_name }}"           --start-time $(date -u -v-15m +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "15 minutes ago" +%Y-%m-%dT%H:%M:%SZ)           --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ)           --period 300           --statistics Maximum           --output json > kinesis_metric.json
        python3 -c "
        import json
        with open('kinesis_metric.json') as f:
            dps = json.load(f).get('Datapoints', [])
        max_age = max((dp.get('Maximum', 0) for dp in dps), default=0.0)
        result = {
            'stream_name': '{{ inputs.stream_name }}',
            'max_iterator_age_ms': round(max_age, 1),
            'alert_triggered': max_age > {{ inputs.max_iterator_age_ms_threshold }}
        }
        with open('kinesis_summary.json', 'w') as out:
            json.dump(result, out)
        print('Kinesis audit:', result)
        "
    outputFiles:
      - kinesis_summary.json

  - id: evaluate_iterator_lag
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.query_iterator_age_metric.outputFiles['kinesis_summary.json'])).alert_triggered }}"
    then:
      - id: alert_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *AWS Kinesis Stream Lag Alert*: Stream `{{ inputs.stream_name }}` record iterator age has reached {{ json(read(outputs.query_iterator_age_metric.outputFiles['kinesis_summary.json'])).max_iterator_age_ms }} ms (threshold: {{ inputs.max_iterator_age_ms_threshold }} ms). Downstream stream consumers are falling behind."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Kinesis Sentinel Execution Failure*: Failed to query CloudWatch metrics for `{{ inputs.stream_name }}` in {{ inputs.aws_region }}."
      }

triggers:
  - id: scheduled_stream_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  title: AWS Kinesis Stream Consumer Shard Iterator Age Lag Sentinel
  shortDescription: Audits Amazon Kinesis Data Streams for high iterator age to detect lagging consumers and prevent stream record expiration.
  description: |
    ## How it works
    This sentinel leverages `AwsCLI` to query Amazon CloudWatch for `GetRecords.IteratorAgeMilliseconds` across the target Kinesis stream. It calculates maximum read age over rolling 15-minute windows and alerts data streaming teams before records exceed the 24-hour stream retention window.

    ## What you get
    - Proactive visibility into stream consumer throughput and processing lag.
    - Early warning against silent data loss caused by Kinesis record expiration.
    - Automated Slack delivery tracking maximum iterator age in milliseconds.

    ## Who it's for
    - Event streaming engineers and data platform teams managing Amazon Kinesis pipelines.
    - SREs supervising real-time analytics stream SLAs.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled operational health checks with native error handling, secret injection, and multi-channel alerting.

    ## Prerequisites
    - AWS IAM credentials with `cloudwatch:GetMetricStatistics` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `stream_name`, `aws_region`, and credentials.
    3. Run manually to check current stream consumer lag.

    ## How to extend
    - Automatically scale up Kinesis stream shard counts via `UpdateShardCount` when iterator age spikes.
    - Monitor `WriteProvisionedThroughputExceeded` concurrently to evaluate producer throttling.
    - Forward stream health metrics to Datadog or Grafana.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [Kinesis CloudWatch Metrics](https://docs.aws.amazon.com/streams/latest/dev/monitoring-with-cloudwatch.html)
  tags:
    - Data
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
