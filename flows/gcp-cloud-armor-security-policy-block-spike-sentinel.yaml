id: gcp-cloud-armor-security-policy-block-spike-sentinel
namespace: company.cloud

inputs:
  - id: project_id
    type: STRING
    description: Google Cloud Project ID.
  - id: security_policy_name
    type: STRING
    description: Cloud Armor Security Policy name.
  - id: block_threshold
    type: INT
    defaults: 500
    description: "Maximum allowable blocked requests in 5-minute sampling interval (default 500)."

tasks:
  - id: query_blocked_requests
    type: io.kestra.plugin.gcp.cli.GCloudCLI
    projectId: "{{ inputs.project_id }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    commands:
      - |
        FILTER='metric.type="loadbalancing.googleapis.com/https/backend_request_count" AND metric.labels.response_code_class="400" AND resource.labels.url_map_name!=""'
        START_TIME=$(date -u -v-15M +%Y-%m-%dT%H:%M:%SZ)
        
        gcloud monitoring timeseries list           --filter="$FILTER"           --interval-start-time="$START_TIME"           --format=json > /tmp/cloud_armor_telemetry.json
        
        TOTAL_BLOCKED=$(jq '[.[]?.points[]?.value.int64Value // 0] | add // 0' /tmp/cloud_armor_telemetry.json)
        echo "::set-output name=blocked_requests::$TOTAL_BLOCKED::"

  - id: evaluate_block_spike
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_blocked_requests.vars.blocked_requests | int > inputs.block_threshold }}"
    then:
      - id: notify_soc_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#soc-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Google Cloud Armor Security Spike Alert",
                "text": "Security Policy `{{ inputs.security_policy_name }}` in project `{{ inputs.project_id }}` recorded *{{ outputs.query_blocked_requests.vars.blocked_requests }} blocked requests* over the last 15 minutes! Layer-7 volumetric DDoS attack, SQL injection (SQLi), or credential stuffing wave detected at edge load balancers.",
                "footer": "Kestra Cloud Sentinel • Google Cloud Armor"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#soc-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Cloud Armor Sentinel Failure",
            "text": "Failed to query Cloud Monitoring for Cloud Armor metrics. Verify project ID and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors Google Cloud Armor security policies for sudden surges in blocked HTTP requests indicating active DDoS or WAF attacks."
  metaTitle: Google Cloud Armor Security Policy Block Spike and DDoS Sentinel with Kestra
  title: Google Cloud Armor Security Policy Block Spike and DDoS Sentinel
  shortDescription: Monitors Google Cloud Armor security policies for sudden surges in blocked HTTP requests indicating active DDoS or WAF attacks.
  description: |
    ## How it works
    This workflow uses the Kestra GCloudCLI plugin to query Google Cloud Monitoring for edge load balancer security policy telemetry (`loadbalancing.googleapis.com/https/backend_request_count`). Google Cloud Armor inspects edge traffic to mitigate distributed denial-of-service (DDoS) attacks, cross-site scripting (XSS), SQL injection, and automated bot scrapes. When blocked request volumes spike significantly above normal baselines, web applications are experiencing an active volumetric assault or bot scanning wave. This workflow aggregates blocked request metrics and immediately escalates the anomaly to security operations.

    ## What you get
    - Real-time detection of volumetric attacks and WAF rule triggers at the Google Cloud edge.
    - Protects backend compute resources and databases from absorbing malicious traffic.
    - Quantitative metrics on blocked edge request volume.

    ## Who it's for
    - DevSecOps Engineers and Security Operations Center (SOC) Responders.
    - Cloud Infrastructure Leads maintaining public-facing Google Cloud web applications.

    ## Why orchestrate this with Kestra
    - **Native GCloud CLI Automation**: Direct integration using Kestra service account secrets.
    - **Proactive Threat Detection**: Detects edge attacks early before backend services feel pressure.
    - **Direct Team Alerts**: Routes incident reports directly to security response channels.

    ## Prerequisites
    - Google Cloud Project with Cloud Armor policies attached to HTTPS Load Balancers.
    - Secrets `GCP_SERVICE_ACCOUNT` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input GCP project ID and Cloud Armor policy name.
    3. Run the workflow to inspect current blocked request rates.

    ## How to extend
    - Query Cloud Logging for the top originating client IP addresses and geographical countries.
    - Automatically update Cloud Armor policy rules to rate-limit offending IP CIDR blocks.

    ## Links
    - [Google Cloud Armor Monitoring Documentation](https://cloud.google.com/armor/docs/monitoring)
    - [Kestra GCloud CLI Plugin](https://kestra.io/plugins/plugin-gcp/io.kestra.plugin.gcp.gcloud.gcloudcli)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Policy & Compliance
    - GCP Services
  ee: false
  demo: false
