id: minio-healing-drives-offline-sentinel
namespace: company.sentinel
description: Audits distributed MinIO object storage clusters for offline drives and active erasure-code healing operations to safeguard parity and storage availability.

concurrency:
  limit: 1

inputs:
  - id: minio_metrics_url
    type: STRING
    defaults: http://minio.internal:9000/minio/v2/metrics/cluster
    description: Prometheus metrics endpoint URL for the distributed MinIO cluster.
  - id: max_offline_drives_threshold
    type: INT
    defaults: 0
    description: Maximum tolerated offline drives before triggering an alert.

tasks:
  - id: audit_minio
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes MinIO cluster metrics to evaluate offline and healing drive counts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      MINIO_METRICS_URL: "{{ inputs.minio_metrics_url }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      url = os.environ.get("MINIO_METRICS_URL", "http://minio.internal:9000/minio/v2/metrics/cluster").strip()
      print(f"Scraping MinIO metrics from {url}...")

      try:
          resp = requests.get(url, timeout=15)
          resp.raise_for_status()
          raw_text = resp.text
      except Exception as e:
          print(f"ERROR: Failed to fetch MinIO metrics from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      offline_drives = 0
      healing_drives = 0

      for line in raw_text.splitlines():
          line = line.strip()
          if line.startswith("#") or not line:
              continue
          if "minio_cluster_drive_offline_total" in line:
              offline_drives = int(float(line.split()[-1]))
          elif "minio_cluster_drive_healing_total" in line:
              healing_drives = int(float(line.split()[-1]))

      print(f"MinIO: Offline Drives={offline_drives}, Healing Drives={healing_drives}")

      Kestra.outputs({
          "offline_drives": offline_drives,
          "healing_drives": healing_drives
      })

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_minio.vars.offline_drives > inputs.max_offline_drives_threshold }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :rotating_light: *MinIO Distributed Drive Failure Detected*
          *Cluster Endpoint:* {{ inputs.minio_metrics_url }}
          *Offline Drives:* {{ outputs.audit_minio.vars.offline_drives }}
          *Healing Drives:* {{ outputs.audit_minio.vars.healing_drives }}
          *Threshold:* {{ inputs.max_offline_drives_threshold }}
          *Urgency:* Critical - Erasure coding parity headroom compromised.

outputs:
  - id: offline_drives
    type: INT
    value: "{{ outputs.audit_minio.vars.offline_drives }}"
  - id: healing_drives
    type: INT
    value: "{{ outputs.audit_minio.vars.healing_drives }}"

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Execution Failure: MinIO Distributed Storage Drive Availability and Healing Sentinel*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Error:* Sentinel inspection encountered an unhandled execution error.

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  metaDescription: "Audits distributed MinIO object storage clusters for offline drives and active erasure-code healing operations to safeguard parity."
  metaTitle: MinIO Distributed Storage Drive Availability and Healing Sentinel with Kestra
  title: MinIO Distributed Storage Drive Availability and Healing Sentinel
  shortDescription: Audits MinIO clusters for offline drives and healing operations.
  description: |
    Audits distributed MinIO object storage clusters for offline drives and active erasure-code healing operations to safeguard parity and storage availability.
  tags:
    - Data
    - Infrastructure
