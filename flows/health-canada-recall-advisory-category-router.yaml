id: health-canada-recall-advisory-category-router
namespace: company.team

description: |
  Route new and updated Government of Canada recalls and safety alerts (Health Canada, CFIA, Transport Canada)
  to the right Slack channel. Each run does a conditional GET on the Recalls and Safety Alerts open data JSON, so an
  unchanged file costs one 304. When the file changed, DuckDB diffs it against a KV watermark, maps each record to a
  food, health product, consumer product or general route, and escalates high-risk classes and catalogue keyword hits.

inputs:
  - id: catalogue_keywords
    type: ARRAY
    itemType: STRING
    defaults:
      - Medline
      - Cardinal Health
      - carvedilol
      - insulin
      - peanut
      - sesame
    description: Words or brands from your product catalogue, matched case-insensitively against title, product, issue and category. A match escalates the record. The defaults are sample data for a distributor of hospital supplies and food; the recalls come from the live feed.

  - id: skip_organizations
    type: ARRAY
    itemType: STRING
    defaults:
      - TC
    description: Values of the feed's `Organization` field to ignore. `TC` (Transport Canada vehicle recalls) is about 40% of the feed and skipped by default; set it to an empty list to route vehicle recalls to the general channel.

  - id: lookback_days
    type: INT
    defaults: 14
    description: First (baseline) run only. Records with a `Last updated` date in the last N days are routed.

  - id: overlap_days
    type: INT
    defaults: 7
    description: Later runs re-read records updated up to N days before the watermark, because records can be published with a `Last updated` date that is a few days old. Already-routed records are skipped by their NID and date.

  - id: force_full_read
    type: BOOL
    defaults: false
    description: Download the file even if its ETag has not changed, for example after editing the keywords.

  - id: state_key
    type: STRING
    defaults: hc_recall_router
    description: Prefix of the two KV keys (`_etag`, `_state`). Use one prefix per routing setup.

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "20 * * * *"
    description: Hourly. The conditional GET makes runs without a new file a single 304 response.

tasks:
  - id: etag
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}_etag"
    errorOnMissing: false

  - id: state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}_state"
    errorOnMissing: false
    description: JSON with the date watermark and the `NID|date` keys already routed inside the overlap window. Missing on the first run.

  - id: download
    type: io.kestra.plugin.core.http.Download
    description: The full feed (about 34,000 records, 16 MB). `If-None-Match` turns an unchanged file into a 304 with no body.
    uri: https://recalls-rappels.canada.ca/sites/default/files/opendata-donneesouvertes/HCRSAMOpenData.json
    failOnEmptyResponse: false
    headers:
      User-Agent: "kestra-health-canada-recall-router/1.0 (https://kestra.io)"
      If-None-Match: "{{ inputs.force_full_read or outputs.state.value is not defined ? '' : (outputs.etag.value ?? '') }}"
    options:
      allowedResponseCodes: [200, 304]
      retryOnStatusCodes: [429, 500, 502, 503, 504]
      retry:
        type: exponential
        interval: PT10S
        maxInterval: PT2M
        maxAttempts: 4

  - id: file_changed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.download.code == 200 }}"
    then:
      - id: diff
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: |
          Parses the feed, keeps unarchived records updated since the watermark minus the overlap (or the lookback on the
          first run), drops records already routed at the same or a later date, labels each one new or updated, maps it to
          a route and builds one Slack payload per route. Class values like `Type I - Type II` count as Type I. The CDN
          sometimes serves an older copy of the file (different ETag, fewer records): the watermark never moves back and
          the routed keys are merged with the previous ones, so the older copy neither re-alerts nor drops state.
        url: "jdbc:duckdb:"
        timeZoneId: UTC
        fetchType: FETCH_ONE
        inputFiles:
          recalls.json: "{{ outputs.download.uri }}"
        outputFiles:
          - routed_csv
        parameters:
          state: "{{ outputs.state.value ?? '' }}"
          keywords: "{{ inputs.catalogue_keywords | toJson }}"
          skip_orgs: "{{ inputs.skip_organizations | toJson }}"
          lookback_days: "{{ inputs.lookback_days }}"
          overlap_days: "{{ inputs.overlap_days }}"
        sql: |
          CREATE MACRO esc(s) AS replace(replace(replace(coalesce(s, ''), '&', '&amp;'), '<', '&lt;'), '>', '&gt;');

          CREATE TABLE recalls AS
          SELECT CAST(NID AS INTEGER) AS nid, trim(Title) AS title, URL AS url, Organization AS organization,
                 trim(Product) AS product, Issue AS issue, Category AS category,
                 coalesce(nullif(nullif(trim("Recall class"), ''), '--'), 'unclassified') AS recall_class,
                 try_cast("Last updated" AS DATE) AS last_updated, Archived = '1' AS archived
          FROM read_json('recalls.json', format = 'array', columns = {
            'NID' : 'VARCHAR', 'Title' : 'VARCHAR', 'URL' : 'VARCHAR', 'Organization' : 'VARCHAR', 'Product' : 'VARCHAR',
            'Issue' : 'VARCHAR', 'Category' : 'VARCHAR', 'Recall class' : 'VARCHAR', 'Last updated' : 'VARCHAR', 'Archived' : 'VARCHAR'});

          CREATE TABLE prev AS
          SELECT try_cast(json_extract_string(s, '$.watermark') AS DATE) AS watermark,
                 coalesce(from_json(json_extract(s, '$.keys'), '["VARCHAR"]'), []) AS keys
          FROM (SELECT CAST(CASE WHEN :state = '' THEN '{}' ELSE :state END AS JSON) AS s);

          CREATE TABLE prev_keys AS
          SELECT k, CAST(split_part(k, '|', 1) AS INTEGER) AS nid, CAST(split_part(k, '|', 2) AS DATE) AS d FROM (SELECT unnest(keys) AS k FROM prev);

          CREATE TABLE win AS
          SELECT coalesce(watermark - CAST(:overlap_days AS INTEGER), current_date - CAST(:lookback_days AS INTEGER)) AS d_from,
                 watermark IS NULL AS is_baseline FROM prev;

          CREATE TABLE kw AS SELECT DISTINCT lower(trim(k)) AS k FROM unnest(from_json(:keywords, '["VARCHAR"]')) AS t(k) WHERE trim(k) <> '';

          CREATE TABLE in_window AS SELECT * FROM recalls WHERE NOT archived AND last_updated >= (SELECT d_from FROM win);

          CREATE TABLE routed AS
          SELECT r.*,
                 CASE WHEN r.nid IN (SELECT nid FROM prev_keys) OR r.nid < (SELECT min(nid) FROM prev_keys) THEN 'updated' ELSE 'new' END AS change,
                 CASE WHEN r.organization = 'CFIA' THEN 'food'
                      WHEN r.organization IN ('Medical devices', 'Drugs and health products', 'Marketed health products',
                                              'Controlled substances and cannabis', 'HC', 'Communications and Public Affairs Branch') THEN 'health_products'
                      WHEN r.organization = 'Consumer product safety' THEN 'consumer_products'
                      ELSE 'general' END AS route,
                 regexp_matches(r.recall_class, '(^|- )(Type I|Class 1)( -|$)') AS high_risk_class,
                 coalesce((SELECT string_agg(k, ', ' ORDER BY k) FROM kw
                           WHERE contains(lower(concat_ws(' ', r.title, r.product, r.issue, r.category)), k)), '') AS matched_keywords
          FROM in_window r
          WHERE r.organization NOT IN (SELECT unnest(from_json(:skip_orgs, '["VARCHAR"]')))
            AND NOT EXISTS (SELECT 1 FROM prev_keys p WHERE p.nid = r.nid AND p.d >= r.last_updated);

          ALTER TABLE routed ADD COLUMN escalate BOOLEAN;
          UPDATE routed SET escalate = high_risk_class OR matched_keywords <> '';

          COPY (SELECT route, escalate, change, nid, last_updated, organization, recall_class, category, issue, matched_keywords, title, product, url
                FROM routed ORDER BY route, escalate DESC, last_updated DESC, nid DESC)
            TO '{{ outputFiles.routed_csv }}' (HEADER, DELIMITER ',');

          CREATE TABLE ranked AS
          SELECT *, row_number() OVER (PARTITION BY route ORDER BY escalate DESC, last_updated DESC, nid DESC) AS rn,
                 CASE WHEN escalate THEN chr(8226) || ' ' || chr(128680) || ' ' ELSE chr(8226) || ' ' END
                   || '*' || recall_class || '* <' || url || '|' || esc(title) || '>' || chr(10)
                   || '    ' || esc(category) || ' / ' || esc(issue) || ' / ' || change || ' ' || strftime(last_updated, '%Y-%m-%d')
                   || CASE WHEN matched_keywords <> '' THEN ' / catalogue match ' || esc(matched_keywords) ELSE '' END AS line
          FROM routed;

          CREATE TABLE route_msgs AS
          SELECT route, records, escalated,
                 CAST(json_object('text',
                   CASE WHEN escalated > 0 THEN '<!here> ' ELSE '' END
                   || '*Canada recalls and alerts - ' || replace(route, '_', ' ') || '*' || chr(10)
                   || records || ' new or updated, ' || escalated || ' escalated' || CASE WHEN is_baseline THEN ' (baseline run)' ELSE '' END || chr(10)
                   || lines
                   || CASE WHEN records > 20 THEN chr(10) || '...and ' || (records - 20) || ' more in the CSV.' ELSE '' END) AS VARCHAR) AS payload
          FROM (SELECT route, count(*) AS records, count(*) FILTER (WHERE escalate) AS escalated,
                       string_agg(line, chr(10) ORDER BY rn) FILTER (WHERE rn <= 20) AS lines
                FROM ranked GROUP BY route) g
          CROSS JOIN win;

          CREATE TABLE new_wm AS
          SELECT greatest(coalesce((SELECT max(last_updated) FROM recalls), current_date),
                          coalesce((SELECT watermark FROM prev), DATE '1970-01-01')) AS wm;

          SELECT
            (SELECT is_baseline FROM win) AS is_baseline,
            strftime((SELECT d_from FROM win), '%Y-%m-%d') AS window_from,
            (SELECT count(*) FROM recalls) AS feed_records,
            (SELECT count(*) FROM recalls WHERE last_updated IS NULL) AS undated_records,
            (SELECT count(*) FROM in_window) AS in_window,
            (SELECT count(*) FROM routed) AS routed,
            (SELECT count(*) FROM routed WHERE change = 'new') AS new_records,
            (SELECT count(*) FROM routed WHERE change = 'updated') AS updated_records,
            (SELECT count(*) FROM routed WHERE escalate) AS escalated,
            (SELECT count(*) FROM routed WHERE high_risk_class) AS high_risk_class,
            (SELECT coalesce(string_agg(route || ' ' || records || ' (' || escalated || ' escalated)', ', ' ORDER BY route), 'none') FROM route_msgs) AS by_route,
            (SELECT coalesce(string_agg(k, ', ' ORDER BY k), 'none') FROM kw WHERE k NOT IN
               (SELECT unnest(string_split(matched_keywords, ', ')) FROM routed)) AS keywords_without_hits,
            (SELECT coalesce(string_agg('[' || route || '] ' || recall_class || ' ' || nid || ' ' || left(title, 100)
               || CASE WHEN matched_keywords <> '' THEN ' (catalogue match ' || matched_keywords || ')' ELSE '' END, chr(10) ORDER BY route, nid), '')
               FROM routed WHERE escalate) AS escalated_lines,
            (SELECT CAST(coalesce(json_group_array(json_object('route', route, 'records', records, 'payload', payload)), '[]') AS VARCHAR) FROM route_msgs) AS routes,
            (SELECT CAST(json_object('watermark', strftime(wm, '%Y-%m-%d'),
               'keys', coalesce((SELECT list(DISTINCT k ORDER BY k) FROM (
                   SELECT nid || '|' || last_updated AS k, last_updated AS d FROM recalls WHERE NOT archived
                   UNION ALL SELECT k, d FROM prev_keys) WHERE d >= wm - CAST(:overlap_days AS INTEGER)), [])) AS VARCHAR)
             FROM new_wm) AS new_state;

      - id: dispatch
        type: io.kestra.plugin.core.flow.Loop
        description: One Slack message per route that has records, one at a time. The Switch picks the webhook; unknown routes go to the general channel.
        concurrencyLimit: 1
        values: "{{ outputs.diff.outputs[0].row.routes }}"
        tasks:
          - id: by_route
            type: io.kestra.plugin.core.flow.Switch
            value: "{{ fromJson(item.value).route }}"
            cases:
              food:
                - id: slack_food
                  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                  allowFailure: true
                  url: "{{ secret('SLACK_FOOD_RECALLS_WEBHOOK') }}"
                  payload: "{{ fromJson(item.value).payload }}"
              health_products:
                - id: slack_health_products
                  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                  allowFailure: true
                  url: "{{ secret('SLACK_HEALTH_PRODUCT_RECALLS_WEBHOOK') }}"
                  payload: "{{ fromJson(item.value).payload }}"
              consumer_products:
                - id: slack_consumer_products
                  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                  allowFailure: true
                  url: "{{ secret('SLACK_CONSUMER_PRODUCT_RECALLS_WEBHOOK') }}"
                  payload: "{{ fromJson(item.value).payload }}"
            defaults:
              - id: slack_general
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                allowFailure: true
                url: "{{ secret('SLACK_RECALLS_WEBHOOK') }}"
                payload: "{{ fromJson(item.value).payload }}"

      - id: log_escalations
        type: io.kestra.plugin.core.log.Log
        runIf: "{{ outputs.diff.outputs[0].row.escalated > 0 }}"
        level: WARN
        message: |
          {{ outputs.diff.outputs[0].row.escalated }} escalated record(s) (Type I / Class 1 or catalogue match):
          {{ outputs.diff.outputs[0].row.escalated_lines }}

      - id: save_state
        type: io.kestra.plugin.core.kv.Set
        key: "{{ inputs.state_key }}_state"
        kvType: STRING
        value: "{{ outputs.diff.outputs[0].row.new_state }}"

      - id: save_etag
        type: io.kestra.plugin.core.kv.Set
        key: "{{ inputs.state_key }}_etag"
        kvType: STRING
        value: "{{ outputs.download.headers['etag'] | first }}"
        description: Saved after the state, so a failed diff downloads the same file again on the next run.

      - id: summary
        type: io.kestra.plugin.core.log.Log
        message: |
          Feed: {{ outputs.diff.outputs[0].row.feed_records }} records ({{ outputs.diff.outputs[0].row.undated_records }} without a date), {{ outputs.diff.outputs[0].row.in_window }} unarchived since {{ outputs.diff.outputs[0].row.window_from }}{{ outputs.diff.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}.
          Routed {{ outputs.diff.outputs[0].row.routed }} ({{ outputs.diff.outputs[0].row.new_records }} new, {{ outputs.diff.outputs[0].row.updated_records }} updated, {{ outputs.diff.outputs[0].row.escalated }} escalated, {{ outputs.diff.outputs[0].row.high_risk_class }} Type I / Class 1): {{ outputs.diff.outputs[0].row.by_route }}.
          Catalogue keywords without a hit: {{ outputs.diff.outputs[0].row.keywords_without_hits }}. CSV: {{ outputs.diff.outputFiles.routed_csv }}
    else:
      - id: unchanged
        type: io.kestra.plugin.core.log.Log
        message: "Feed unchanged since the last run (HTTP 304 for ETag {{ outputs.etag.value }}), nothing to route."

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.diff.outputs[0].row ?? {'file_changed': false} }}"
  - id: routed_csv
    type: FILE
    required: false
    value: "{{ outputs.diff.outputFiles.routed_csv ?? null }}"

extend:
  title: Route Health Canada, CFIA and Transport Canada Recalls to Team Slack Channels with DuckDB
  metaTitle: Health Canada Recall and Safety Alert Router with DuckDB and Slack | Kestra
  shortDescription: Poll the Government of Canada Recalls and Safety Alerts open data file with a conditional GET, diff it against a KV watermark in DuckDB, and send new and updated food, health product and consumer product recalls to separate Slack channels, escalating Type I / Class 1 recalls and catalogue matches.
  metaDescription: Hourly Canada recall router. Conditional GET, DuckDB diff by NID and date, Switch per food, health or consumer route, Slack escalation and a CSV.
  description: |
    Canadian distributors, hospitals and retailers act on recalls from Health Canada, CFIA and Transport Canada, which all land in one open data file, `HCRSAMOpenData.json` (about 34,000 records, 16 MB). This flow downloads it only when it changed, finds what is new since the last run, and posts one Slack message per team.

    ## How it works

    1. An hourly `Schedule` starts the run. `etag` and `state` (KV Get) read the last ETag and the date watermark with the `NID|date` keys already routed.
    2. `download` sends `If-None-Match`. An unchanged file is a 304 with no body and `file_changed` (If) only logs it. `force_full_read` drops the header.
    3. `diff` (DuckDB) keeps unarchived records updated since the watermark minus `overlap_days` (first run: `lookback_days`), drops records already routed at the same or a later date, and labels the rest `new` or `updated`. `Organization` picks the route (food, health_products, consumer_products, general); Transport Canada is skipped by default. Type I / Class 1 recalls (also `Type I - Type II`) and `catalogue_keywords` hits are escalated.
    4. `dispatch` (Loop) runs per route with records and a `Switch` posts to that route's webhook, escalations first with `<!here>`, 20 records per message.
    5. `save_state` and `save_etag` run only after a successful diff. The watermark never moves back and keys are merged, because the CDN sometimes serves an older copy (34,263 and 34,248 records under two ETags on the same day).

    ## What you get

    - One Slack message per route linking to the official recall pages.
    - A CSV of routed records with route, escalation, class, category, issue, catalogue matches and URL.
    - A summary with routed counts per route and catalogue keywords with no hit.
    - Hourly runs that cost one 304 when nothing changed.

    ## Who it's for

    - Quality and regulatory teams at Canadian medical, pharmacy and food distributors, and hospital pharmacies.
    - Retail and food-service QA teams handling allergen recalls.

    ## Why orchestrate this with Kestra

    - `Download` with `allowedResponseCodes: [200, 304]` does the conditional GET without a script.
    - Routing rules are readable SQL, and `Switch` maps routes to webhooks in YAML.
    - KV state is small, and `state_key` lets several setups share the flow.

    ## Prerequisites

    - Kestra 2.0 with the DuckDB and Slack plugins, and HTTPS to `recalls-rappels.canada.ca` (no API key, Open Government Licence - Canada).
    - The default `catalogue_keywords` are sample data; the recalls come from the live feed.

    ### Secrets

    - `SLACK_FOOD_RECALLS_WEBHOOK`: CFIA food recalls.
    - `SLACK_HEALTH_PRODUCT_RECALLS_WEBHOOK`: drugs, devices and Health Canada advisories.
    - `SLACK_CONSUMER_PRODUCT_RECALLS_WEBHOOK`: consumer product recalls.
    - `SLACK_RECALLS_WEBHOOK`: the general route (vehicles, new organization values).

    All optional: Slack tasks have `allowFailure` and escalations are also logged at WARN.

    ## Quick start

    1. Click **Execute**. The first run is a 14-day baseline; in testing it routed 48 records and escalated 12, and `insulin` had no hit.
    2. Execute again: the download is a 304 and nothing is routed.
    3. Put your brands and allergens in `catalogue_keywords`, add the secrets and keep the schedule.

    ## How to extend

    - Route on `Category` too, for example `Dairy` to a cold-chain team.
    - Open a ServiceNow or Jira ticket per escalated record.

    ## Links

    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop) and [Switch](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.switch)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Recalls and Safety Alerts](https://recalls-rappels.canada.ca/en) and its [open data dataset](https://open.canada.ca/data/en/dataset/d38de914-c94c-429b-8ab1-8776c31643e3)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - ELT & Data Landing
  ee: false
  demo: false
