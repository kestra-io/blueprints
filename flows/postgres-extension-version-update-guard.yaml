id: postgres-extension-version-update-guard
namespace: company.team

inputs:
  - id: postgres_url
    type: STRING
    defaults: jdbc:postgresql://localhost:5432/postgres
    description: >-
      PostgreSQL JDBC URL for the database whose registered extension versions are checked. Example jdbc:postgresql://postgres:5432/app.

  - id: use_secret_auth
    type: BOOL
    defaults: true
    description: >-
      Leave true in production so the connection reads POSTGRES_USERNAME and POSTGRES_PASSWORD from secrets. Set false only to pass credentials inline in a disposable test environment.

  - id: postgres_username
    type: STRING
    defaults: postgres
    description: Username used only when use_secret_auth is false. Ignored in production.

  - id: postgres_password
    type: STRING
    defaults: ""
    description: Password used only when use_secret_auth is false. Ignored in production.

  - id: extension_allowlist
    type: STRING
    defaults: ""
    description: >-
      Optional comma separated list of extension names to consider. Leave empty to consider every installed extension.

  - id: extension_skiplist
    type: STRING
    defaults: ""
    description: >-
      Optional comma separated list of extension names to leave alone. Use it for extensions you pin on purpose, for example one whose newer version drops a function you still call.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, report the extensions that lag their available default version without changing anything.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: >-
      When true and dry_run is false, run ALTER EXTENSION UPDATE on each lagging extension behind an approval gate, then re-read pg_extension.extversion.

variables:
  detect_sql: |
    SELECT
      e.extname AS extension,
      n.nspname AS extension_schema,
      e.extversion AS current_version,
      a.default_version AS target_version,
      EXISTS (
        SELECT 1
        FROM pg_extension_update_paths(e.extname) u
        WHERE u.source = e.extversion
          AND u.target = a.default_version
          AND u.path IS NOT NULL
      ) AS path_available,
      format('ALTER EXTENSION %I UPDATE', e.extname) AS fix_sql
    FROM pg_extension e
    JOIN pg_available_extensions a ON a.name = e.extname
    LEFT JOIN pg_namespace n ON n.oid = e.extnamespace
    WHERE e.extversion <> a.default_version
      AND (
        '{{ inputs.extension_allowlist }}' = ''
        OR e.extname = ANY (string_to_array(replace('{{ inputs.extension_allowlist }}', ' ', ''), ','))
      )
      AND NOT (
        e.extname = ANY (string_to_array(replace('{{ inputs.extension_skiplist }}', ' ', ''), ','))
      )
    ORDER BY e.extname

triggers:
  - id: daily_extension_version_check
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 4 * * *"
    description: >-
      Daily sweep for extensions left behind by a binary upgrade. Disabled by default and pinned to safe mode so it reports without changing anything until an operator enables it.
    inputs:
      dry_run: true
      auto_remediate: false

tasks:
  - id: detect
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Compare pg_extension.extversion, the version this database has registered, against pg_available_extensions.default_version, the version the files on disk now provide. Each row carries the from version, the to version, whether the author shipped an upgrade path between them plus the exact ALTER EXTENSION statement.
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.detect_sql) }}"

  - id: summarize
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      Build the human readable target list and the JSON the remediation loop iterates, once, so the log, the alert and the loop all agree.
    values:
      names: >-
        {{ outputs.detect.rows | jq('map(.extension + " " + .current_version + " to " + .target_version + (if .path_available then "" else " (no upgrade path)" end)) | join(", ")') | first }}
      no_path_names: >-
        {{ outputs.detect.rows | jq('map(select(.path_available == false) | .extension) | join(", ")') | first }}
      targets_json: "{{ outputs.detect.rows | toJson }}"

  - id: log_detect
    type: io.kestra.plugin.core.log.Log
    message: |
      PostgreSQL extensions behind their available default version: {{ outputs.detect.size }} found.
      Targets: {{ outputs.summarize.values.names }}
      Mode: dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}

  - id: guard
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.detect.size > 0 }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: >-
          Alert on every detection, in dry run and in remediate mode, so a human sees the lagging extensions even when nothing is changed.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "PostgreSQL extension version update guard: {{ outputs.detect.size }} extension(s) still registered at an older version than the files on disk provide. Targets {{ outputs.summarize.values.names }}. dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}."}

      - id: mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.detect.size > 0 }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Hold the run until a human approves the update. An extension update runs the upgrade scripts the author shipped, so it can change function signatures and behaviour. Read the from version and to version in the finding against the extension release notes before approving.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: >-
                  Set true to run ALTER EXTENSION UPDATE on the listed extensions. Anything else leaves them at their current version.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: update_extensions
                type: io.kestra.plugin.core.flow.Loop
                description: >-
                  Remediation loop. One ALTER EXTENSION UPDATE per lagging extension, concurrencyLimit 1 so the upgrade scripts run in turn. allowFailure so an extension with no upgrade path does not stop the pass, which leaves the re-read as the real gate.
                concurrencyLimit: 1
                values: "{{ outputs.summarize.values.targets_json }}"
                tasks:
                  - id: update_one
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    description: >-
                      Run the upgrade scripts for one extension. This fails when the author shipped no path from the installed version to the default version, which is reported rather than hidden.
                    allowFailure: true
                    url: "{{ inputs.postgres_url }}"
                    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).fix_sql }}"

                  - id: update_log
                    type: io.kestra.plugin.core.log.Log
                    message: "Ran {{ fromJson(item.value).fix_sql }} to move {{ fromJson(item.value).extension }} from {{ fromJson(item.value).current_version }} toward {{ fromJson(item.value).target_version }}"

              - id: reverify
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: >-
                  Re-run the same comparison. Any extension that was a target and still reports an older extversion than the default is a failure.
                url: "{{ inputs.postgres_url }}"
                username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                fetchType: FETCH
                sql: "{{ render(vars.detect_sql) }}"

              - id: verify_plan
                type: io.kestra.plugin.core.output.OutputValues
                description: Keep only the targets that still lag after the pass.
                values:
                  still_json: >-
                    {{ {'t': outputs.detect.rows, 'r': outputs.reverify.rows} | toJson | jq('(.r | map(.extension)) as $rem | .t | map(select(([.extension] - $rem) | length == 0))') | first | toJson }}
                  still_names: >-
                    {{ {'t': outputs.detect.rows, 'r': outputs.reverify.rows} | toJson | jq('(.r | map(.extension)) as $rem | .t | map(select(([.extension] - $rem) | length == 0) | .extension + " still at " + .current_version) | join(", ")') | first }}

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.verify_plan.values.still_json | jq('length') | first) > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      {{ outputs.verify_plan.values.still_json | jq('length') | first }} targeted extension(s) are still registered at their old version after the pass: {{ outputs.verify_plan.values.still_names }}. The usual cause is an extension with no upgrade path between those two versions. The other cause is a connecting role that is not the extension owner.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: "Updated and verified. {{ outputs.detect.size }} target(s) before, 0 of them behind the default version after."
            else:
              - id: not_approved
                type: io.kestra.plugin.core.log.Log
                message: "Approval not granted, so no extension was updated. {{ outputs.detect.size }} extension(s) still run the SQL and C definitions of their older version."
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: "Report only (dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}). {{ outputs.detect.size }} extension(s) would be updated: {{ outputs.summarize.values.names }}. No change made."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "Every installed extension is registered at the default version the files on disk provide. Nothing to update."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: >-
      Post to Slack on any failure, including a connection error or targeted extensions still behind the default version after the pass.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "PostgreSQL extension version update guard FAILED (execution {{ execution.id }}). A connection error, an ALTER EXTENSION error or targeted extensions still at their old version after the pass. Check the run."}

extend:
  title: PostgreSQL Extension Version Update Guard
  shortDescription: Find PostgreSQL extensions still registered at an older version than the files on disk provide, run ALTER EXTENSION UPDATE behind a dry-run and approval gate, then re-read pg_extension.extversion and fail if any target is still behind.
  metaTitle: PostgreSQL Extension Version Update Guard with Kestra
  metaDescription: Detect PostgreSQL extensions whose extversion lags the available default, run ALTER EXTENSION UPDATE behind an approval gate, then re-read to confirm.
  description: |
    Upgrading the PostgreSQL binaries installs newer extension files on disk. So does a `pg_upgrade`. Neither changes what each database has registered. `pg_extension.extversion` keeps the old number while `pg_available_extensions.default_version` moves on, so the database keeps running the old SQL and C definitions.

    The symptoms are confusing. A function the release notes say is fixed is still broken. A new feature the docs describe does not exist. Nothing in PostgreSQL warns you, because both versions are valid states. `ALTER EXTENSION ... UPDATE` is the post-upgrade step that is easy to forget.

    This guard reads both catalogs, lists every extension whose registered version lags the default on disk with its from version and to version, runs the update behind a dry-run plus an approval gate, then re-reads extversion and fails the run if any target is still behind.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Read-only by default. `dry_run` is true and `auto_remediate` is false, so a plain run reports and never updates an extension.
    - A change happens only when `auto_remediate` is true and `dry_run` is false. It then waits for a human to resume the `Pause` with `approved` set true. An unanswered gate reads as not approved.
    - An extension update is a real change. It runs the upgrade scripts the extension author shipped, which can add, drop or redefine functions, operators and types. That is why the finding carries the from version and the to version per extension, so the release notes can be read before anyone approves.
    - `extension_skiplist` leaves an extension alone for good. Use it where a version is pinned on purpose.
    - `ALTER EXTENSION ... UPDATE` fails when the author shipped no upgrade path between the installed version and the default. The detection reports that up front as `path_available`, the loop lets the statement fail without stopping the pass, then the re-read fails the run and names the extension. Nothing is hidden.
    - An extension whose files are gone from disk is not reported, because the join to `pg_available_extensions` drops it. That case needs the binaries fixed, not an update.

    ## How it works

    1. `detect` (`io.kestra.plugin.jdbc.postgresql.Query`) joins `pg_extension` to `pg_available_extensions` and keeps the rows where `extversion` differs from `default_version`. Each row carries the from version, the to version, an `EXISTS` check over `pg_extension_update_paths()` plus the exact `ALTER EXTENSION` statement.
    2. `summarize` (`io.kestra.plugin.core.output.OutputValues`) builds the human readable target list and the JSON the remediation loop iterates, so the log, the alert and the loop all read the same set.
    3. `log_detect` (`io.kestra.plugin.core.log.Log`) logs the count, the per-extension version move and the mode.
    4. `guard` (`io.kestra.plugin.core.flow.If`) branches on the count. With none found, `clean` logs and the run ends. Otherwise `findings_alert` posts the finding on every detection.
    5. `mode` (`io.kestra.plugin.core.flow.If`) enters the remediation branch only when `auto_remediate` is true and `dry_run` is false. Otherwise `report_only` lists what would be updated and stops.
    6. `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run until a human resumes it. `update_extensions` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) then runs one `ALTER EXTENSION ... UPDATE` per target.
    7. `reverify` re-runs the comparison and `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` if any targeted extension is still behind.

    ## What you get

    - A check that reads what the database has actually registered, not what the packages on disk claim, so it catches the gap a binary upgrade leaves behind.
    - The from version and the to version per extension, so release notes can be checked before the update is approved.
    - An up-front `path_available` flag from `pg_extension_update_paths()`, so an extension with no upgrade path is visible in the report instead of being a surprise at apply time.
    - An allowlist for a staged rollout plus a skiplist for versions you pin on purpose.
    - A real verification step. The run passes only when the second read of `pg_extension.extversion` shows every target at the default version.
    - Slack alerts on the findings and on any failure.

    ## Who it's for

    - DBAs and platform engineers who have just upgraded PostgreSQL binaries or finished a `pg_upgrade` and need the per-database follow-up done and proven.
    - Teams running many databases on one cluster, where each one carries its own registered extension versions.
    - Anyone chasing a bug that the extension release notes say was fixed in a version the database is not actually running.

    ## Why orchestrate this with Kestra

    PostgreSQL does not tell you that a database is running an old extension version, has no scheduler to look, no approval step before the upgrade scripts run and no way to prove the update took effect. A one-off script updates what it finds then reports success whether or not the version moved. Kestra adds the missing pieces. It schedules the sweep, keeps it read-only by default, holds the change behind a human approval with the version move on screen, runs the statements one at a time, re-reads the catalog to turn a hopeful fix into a verified one, applies the same connection settings to every task then posts a Slack alert the moment a step fails.

    ## Tested end to end

    Run on Kestra 2.0.5 against a PostgreSQL 16 server, with a local HTTP sink standing in for Slack. The database was seeded with four extensions installed at an explicitly older version (`hstore` 1.4 of 1.8, `citext` 1.4 of 1.6, `pg_trgm` 1.3 of 1.6, `intarray` 1.2 of 1.5), two already at their default version (`pgcrypto` 1.3, `tablefunc` 1.0) plus a local extension built with two versions and no upgrade script between them. Every count and version was confirmed with psql against `pg_extension` joined to `pg_available_extensions`.

    - Detector can fail: with only the two already current extensions present it returned 0. After the four older ones were installed it returned exactly 4, never the two current ones, confirmed with psql.
    - Dry run detected the four, alerted and left every extversion unchanged.
    - Remediate with approval moved all four to their default version and the re-read reported 0 of them still behind. The two already current extensions were untouched.
    - The local extension with no upgrade path failed its `ALTER EXTENSION` inside the loop, the re-read found it still at its old version and the run failed and alerted rather than reporting success.
    - Declining the approval left all four at their old versions.
    - An unreachable host failed the first query and fired the Slack alert.

    ## Prerequisites

    A PostgreSQL server reachable over JDBC. The connecting user must be able to read `pg_extension` plus `pg_available_extensions`. To run `ALTER EXTENSION ... UPDATE` it must be the extension owner or a superuser.

    ### Secrets

    - `POSTGRES_USERNAME`: PostgreSQL user, read when `use_secret_auth` is true.
    - `POSTGRES_PASSWORD`: password for that user.
    - `SLACK_WEBHOOK_URL`: used by `findings_alert` and the `errors` block.
    - In Kestra OSS, provide each secret as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `postgres_url` | STRING | `jdbc:postgresql://localhost:5432/postgres` | PostgreSQL JDBC URL for the target database. |
    | `use_secret_auth` | BOOL | `true` | Read credentials from secrets. Set false only for inline test credentials. |
    | `extension_allowlist` | STRING | `""` | Comma separated extension names to consider. Empty considers all of them. |
    | `extension_skiplist` | STRING | `""` | Comma separated extension names to leave alone. |
    | `dry_run` | BOOL | `true` | Report without changing anything. |
    | `auto_remediate` | BOOL | `false` | Update behind the approval gate when dry_run is false. |

    ## Quick start

    1. Set `POSTGRES_USERNAME`, `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` as namespace secrets.
    2. Import this flow.
    3. Run it with `postgres_url` pointed at a database on a cluster whose binaries were upgraded. The default dry run reports which extensions still carry an older registered version.
    4. Read the release notes for the versions in the report. To apply them, run again with `dry_run` false and `auto_remediate` true, then resume the paused execution with `approved` true.

    ## How to extend

    - Set `extension_allowlist` to one extension per run for a staged rollout across a busy cluster.
    - Put a deliberately pinned extension in `extension_skiplist` so the sweep stops reporting it.
    - Point the flow at each database in turn with a parent flow, since extension versions are registered per database rather than per cluster.
    - Fail the run as soon as detection finds anything, for a read-only drift check with no remediation.
    - Report an extension whose installed version is newer than the default, which happens when binaries are rolled back. The inequality already catches it. The update path check reports no path, so handle that case by fixing the packages.

    ## Links

    - PostgreSQL plugin: https://kestra.io/plugins/plugin-jdbc-postgres
    - ALTER EXTENSION: https://www.postgresql.org/docs/current/sql-alterextension.html
    - Extension version catalogs: https://www.postgresql.org/docs/current/view-pg-available-extensions.html
    - pg_extension: https://www.postgresql.org/docs/current/catalog-pg-extension.html
    - Packaging related objects into an extension: https://www.postgresql.org/docs/current/extend-extensions.html
    - Schedule trigger: https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.schedule
  tags:
    - Data
    - Infrastructure
  subTags:
    - PostgreSQL
    - Maintenance
    - Day 2 Operations
  ee: false
  demo: false
