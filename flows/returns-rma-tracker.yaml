id: returns-rma-tracker
namespace: company.team

description: |
  Stops return merchandise authorizations from aging quietly past the refund
  SLA while nobody is watching. A keyed webhook receives every RMA status
  change posted by the returns system and a disabled daily schedule stands
  ready as the sweep net; a shell step writes the rmas.json register and a
  python step merges the posted change into it, then flags every RMA whose
  current status has sat longer than the SLA input without a next status
  event. When returns are stalled, support gets one chat ping per stalled
  RMA, one GitHub rollup issue is opened and Slack receives the exposure
  summary, while a clean register is logged as on track. Each run publishes
  verdict, stalled_count, rmas and total_value_usd as typed outputs.

triggers:
  - id: on_rma_status_change
    type: io.kestra.plugin.core.trigger.Webhook
    description: The returns system POSTs one status change of rma_id, status, order_id and value_usd so the register is re evaluated the moment a return moves.
    key: "{{ secret('RMA_STATUS_WEBHOOK_KEY') }}"
  - id: daily_aging_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled daily net that would sweep the whole register every morning at 06:00 until someone switches it on.
    cron: "0 6 * * *"
    disabled: true

inputs:
  - id: sla_days
    type: INT
    defaults: 5
    description: Maximum days an RMA may sit in one status before it counts as stalled, applied to every row of the register.
  - id: github_repository
    type: STRING
    defaults: acme-corp/returns-ops
    description: Repository that receives the rollup tracking issue when stalled returns are found.

tasks:
  # --- 1. the RMA register and its verdict ---
  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the rmas.json written by the shell step is the exact file the scanner reads.
    tasks:
      - id: write_register
        type: io.kestra.plugin.scripts.shell.Commands
        description: Writes rmas.json from a heredoc of six returns covering received, inspected, refund_pending and shipped_to_customer, some already past the SLA and some clear of it.
        commands:
          - |
            cat > rmas.json <<'RMAS_EOF'
            [
              {"rma_id": "RMA-2041", "order_id": "ORD-55101", "status": "received", "status_age_days": 9, "next_status": "", "value_usd": 189.0},
              {"rma_id": "RMA-2042", "order_id": "ORD-55118", "status": "inspected", "status_age_days": 7, "next_status": "", "value_usd": 640.5},
              {"rma_id": "RMA-2043", "order_id": "ORD-55127", "status": "refund_pending", "status_age_days": 12, "next_status": "", "value_usd": 1299.99},
              {"rma_id": "RMA-2044", "order_id": "ORD-55140", "status": "shipped_to_customer", "status_age_days": 2, "next_status": "", "value_usd": 240.0},
              {"rma_id": "RMA-2045", "order_id": "ORD-55155", "status": "received", "status_age_days": 3, "next_status": "", "value_usd": 75.25},
              {"rma_id": "RMA-2046", "order_id": "ORD-55163", "status": "refund_pending", "status_age_days": 8, "next_status": "shipped_to_customer", "value_usd": 415.0}
            ]
            RMAS_EOF
            wc -l rmas.json

      - id: scan_rmas
        type: io.kestra.plugin.scripts.python.Script
        description: Merges the posted status change into the register, flags every RMA parked past the sla_days input without a next status event, and prints the repo standard outputs line carrying verdict, stalled_count, rmas and total_value_usd.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          RMA_ID: "{{ trigger is not defined ? '' : ((trigger.body ?? {}).rma_id ?? '') }}"
          STATUS: "{{ trigger is not defined ? '' : ((trigger.body ?? {}).status ?? '') }}"
          ORDER_ID: "{{ trigger is not defined ? '' : ((trigger.body ?? {}).order_id ?? '') }}"
          VALUE_USD: "{{ trigger is not defined ? '' : ((trigger.body ?? {}).value_usd ?? '') }}"
          SLA_DAYS: "{{ inputs.sla_days }}"
        script: |
          import json
          import os

          REGISTER_FILE = "rmas.json"
          DEFAULT_SLA_DAYS = 5


          def as_int(value):
              try:
                  return int(float(str(value).strip()))
              except (TypeError, ValueError):
                  return None


          def as_float(value):
              try:
                  return float(str(value).strip())
              except (TypeError, ValueError):
                  return None


          def load_rows():
              if not os.path.exists(REGISTER_FILE):
                  return []
              try:
                  with open(REGISTER_FILE, encoding="utf-8") as handle:
                      data = json.load(handle)
              except ValueError:
                  return []
              return data if isinstance(data, list) else []


          rows = load_rows()

          event_rma = os.environ.get("RMA_ID", "").strip()
          event_status = os.environ.get("STATUS", "").strip()
          event_order = os.environ.get("ORDER_ID", "").strip()
          event_value = as_float(os.environ.get("VALUE_USD", ""))

          sla_days = as_int(os.environ.get("SLA_DAYS", ""))
          if sla_days is None or sla_days < 0:
              sla_days = DEFAULT_SLA_DAYS

          if event_rma:
              target = None
              for row in rows:
                  if isinstance(row, dict) and str(row.get("rma_id") or "").strip() == event_rma:
                      target = row
                      break
              if target is None:
                  rows.append({
                      "rma_id": event_rma,
                      "order_id": event_order,
                      "status": event_status or "received",
                      "status_age_days": 0,
                      "next_status": "",
                      "value_usd": 0.0 if event_value is None else event_value,
                  })
              else:
                  current = str(target.get("status") or "").strip()
                  if event_status and event_status != current:
                      target["next_status"] = event_status
                  if event_order:
                      target["order_id"] = event_order
                  if event_value is not None:
                      target["value_usd"] = event_value

          stalled = []
          tracked = 0
          for row in rows:
              if not isinstance(row, dict):
                  continue
              rma_id = str(row.get("rma_id") or "").strip()
              age = as_int(row.get("status_age_days"))
              if not rma_id or age is None or age < 0:
                  continue
              tracked += 1
              if age <= sla_days:
                  continue
              if str(row.get("next_status") or "").strip():
                  continue
              value = as_float(row.get("value_usd"))
              stalled.append({
                  "rma_id": rma_id,
                  "order_id": str(row.get("order_id") or "").strip(),
                  "status": str(row.get("status") or "").strip() or "unknown",
                  "status_age_days": age,
                  "days_over_sla": age - sla_days,
                  "value_usd": round(0.0 if value is None else value, 2),
              })

          stalled.sort(key=lambda item: (-item["days_over_sla"], item["rma_id"]))
          stalled_count = len(stalled)
          total_value_usd = 0.0
          for item in stalled:
              total_value_usd += item["value_usd"]
          total_value_usd = float(round(total_value_usd, 2))

          if tracked == 0:
              verdict = "NO_DATA"
          elif stalled_count > 0:
              verdict = "ESCALATE"
          else:
              verdict = "ON_TRACK"

          print("rma register verdict=%s stalled=%d of %d tracked sla_days=%d value=%.2f"
                % (verdict, stalled_count, tracked, sla_days, total_value_usd))
          print("::" + json.dumps({"outputs": {"verdict": verdict, "stalled_count": stalled_count, "rmas": stalled, "total_value_usd": total_value_usd}}, ensure_ascii=True) + "::")

  # --- 2. the stalled gate ---
  - id: stalled_gate
    type: io.kestra.plugin.core.flow.If
    description: Escalates only when at least one RMA is parked past the SLA without a next status event, so a register that is merely busy stays quiet.
    condition: "{{ outputs.scan_rmas.vars.stalled_count > 0 }}"
    then:
      # --- 3. one chat ping per stalled return ---
      - id: ping_support
        type: io.kestra.plugin.core.flow.Loop
        description: Walks the stalled returns one at a time so support gets one message per RMA instead of an unreadable list.
        values: "{{ outputs.scan_rmas.vars.rmas }}"
        concurrencyLimit: 1
        tasks:
          - id: post_status_ping
            type: io.kestra.plugin.core.http.Request
            description: Posts a single chat message to the support webhook naming the RMA, its order, the parked status, the age and the value at risk.
            method: POST
            uri: "{{ secret('SUPPORT_WEBHOOK_URL') }}"
            headers:
              Content-Type: application/json
            body: |
              {"text": "Stalled RMA {{ item.value.rma_id }} ({{ item.value.order_id }}) has been {{ item.value.status }} for {{ item.value.status_age_days }} days, {{ item.value.days_over_sla }} over the {{ inputs.sla_days }} day SLA, value ${{ item.value.value_usd }}. Execution {{ execution.id }}."}
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT10S
              maxAttempts: 3

      # --- 4. the backlog record ---
      - id: open_rollup_issue
        type: io.kestra.plugin.github.issues.Create
        description: Opens one labeled tracking issue listing every stalled RMA with its status, age, days over SLA and value, so the chase leaves a backlog record.
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "Stalled RMAs past the {{ inputs.sla_days }} day SLA - {{ outputs.scan_rmas.vars.stalled_count }} return(s), ${{ outputs.scan_rmas.vars.total_value_usd }}"
        body: |
          ## Stalled returns

          **{{ outputs.scan_rmas.vars.stalled_count }} RMA(s)** are parked past the {{ inputs.sla_days }} day SLA with no next status event, carrying **${{ outputs.scan_rmas.vars.total_value_usd }}** in value.

          | RMA | Order | Status | Age (days) | Over SLA | Value (USD) |
          | --- | --- | --- | --- | --- | --- |
          {% for item in outputs.scan_rmas.vars.rmas %}| {{ item.rma_id }} | {{ item.order_id }} | {{ item.status }} | {{ item.status_age_days }} | {{ item.days_over_sla }} | {{ item.value_usd }} |
          {% endfor %}

          Execution: {{ execution.id }}

          Move each return to its next status, then close this issue once the register is clear again.
        labels:
          - returns
          - sla-breach

      # --- 5. the channel summary ---
      - id: alert_slack
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Summarizes the stalled count, the dollars tied up and the worst offender so the returns channel sees the exposure at once.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "Returns SLA breach - {{ outputs.scan_rmas.vars.stalled_count }} RMA(s) parked past {{ inputs.sla_days }} days, ${{ outputs.scan_rmas.vars.total_value_usd }} tied up. Worst is {{ outputs.scan_rmas.vars.rmas[0].rma_id }} at {{ outputs.scan_rmas.vars.rmas[0].status_age_days }} days in {{ outputs.scan_rmas.vars.rmas[0].status }}. Rollup issue opened in {{ inputs.github_repository }}. Execution {{ execution.id }}."}
    else:
      # --- 6. the quiet register ---
      - id: log_on_track
        type: io.kestra.plugin.core.log.Log
        description: Records the quiet outcome where every tracked RMA is inside its SLA or already carries a next status event, so a clean sweep still leaves evidence.
        message: "RMA register on track - verdict {{ outputs.scan_rmas.vars.verdict }}, {{ outputs.scan_rmas.vars.stalled_count }} stalled across the register, ${{ outputs.scan_rmas.vars.total_value_usd }} exposed against the {{ inputs.sla_days }} day SLA."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.scan_rmas.vars.verdict }}"
  - id: stalled_count
    type: INT
    value: "{{ outputs.scan_rmas.vars.stalled_count }}"
  - id: rmas
    type: ARRAY
    value: "{{ outputs.scan_rmas.vars.rmas | toJson }}"
  - id: total_value_usd
    type: FLOAT
    value: "{{ outputs.scan_rmas.vars.total_value_usd }}"

extend:
  title: Catch stalled returns before the refund SLA slips
  metaTitle: Catch Stalled RMAs Before the Refund SLA Slips
  shortDescription: Read the RMA register on every status change, ping support for each return parked past the SLA, open a GitHub rollup issue and alert Slack.
  metaDescription: Read the RMA register on every status change, flag returns parked past the SLA, ping support per stalled RMA, open a GitHub rollup issue and alert Slack.
  description: |
    Returns rot quietly in the same status for weeks. A customer ships a box back, the RMA sits in received or inspected while the refund queue grows, and nobody notices until the chargeback or the one star review lands. This flow runs on every status change the returns system posts to the keyed webhook, or on the daily sweep once the disabled schedule is switched on, reads the rmas.json register, merges the posted change into it and flags every RMA that has been parked in one status longer than the SLA input without a next status event. Stalled returns are pinged to support one at a time, rolled up into a single GitHub issue and summarized in Slack, while a clean register is logged as on track.

    ## How it works

    1. `on_rma_status_change` (`io.kestra.plugin.core.trigger.Webhook`) accepts one JSON body of `rma_id`, `status`, `order_id` and `value_usd` whenever the returns system moves a return.
    2. `daily_aging_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * *`) sits disabled as the net to switch on for a full morning sweep of the register.
    3. `workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) gives the fixture and the scanner one directory, so both touch the same rmas.json.
    4. `write_register` (`io.kestra.plugin.scripts.shell.Commands`) drops `rmas.json` from a heredoc of six returns spanning received, inspected, refund_pending and shipped_to_customer, with rows already past the five day SLA and rows clear of it.
    5. `scan_rmas` (`io.kestra.plugin.scripts.python.Script` on the Process runner) merges the posted change, ages every row against `sla_days`, sorts the stalled ones worst first, and prints one `::{"outputs": ...}::` line carrying `verdict`, `stalled_count`, `rmas` and `total_value_usd`.
    6. `stalled_gate` (`io.kestra.plugin.core.flow.If`) escalates only when `stalled_count` is above zero.
    7. In the escalation branch `ping_support` (`io.kestra.plugin.core.flow.Loop`) runs `post_status_ping` (`io.kestra.plugin.core.http.Request`) once per stalled RMA against the support chat webhook, `open_rollup_issue` (`io.kestra.plugin.github.issues.Create`) files one labeled issue holding the full table, and `alert_slack` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts the exposure summary; the other branch records the quiet outcome with `log_on_track` (`io.kestra.plugin.core.log.Log`).
    8. The `errors` handler pings Slack when the run itself breaks, because a silent failure looks exactly like a clean register.

    ## What you get

    - `verdict` (STRING): `ESCALATE` when one or more RMAs are stalled, `ON_TRACK` when every tracked RMA is inside its SLA or already carries a next status event, `NO_DATA` when the register holds no usable row.
    - `stalled_count` (INT): RMAs parked past `sla_days` with no next status event, zero on a clean register.
    - `rmas` (ARRAY): one object per stalled RMA with `rma_id`, `order_id`, `status`, `status_age_days`, `days_over_sla` and `value_usd`, sorted worst first so support chases the oldest lapse.
    - `total_value_usd` (FLOAT): combined dollar value of the stalled RMAs, the exposure this run escalates.
    - One chat ping per stalled RMA plus one GitHub rollup issue and a Slack summary when escalation fires, and a log line only when it does not.

    ## Who it's for

    - Returns and support operations teams who own the RMA queue and need every return moved before the refund window or the chargeback clock runs out.
    - Customer experience leads who want a stalled return surfaced in the support chat with its dollar value attached instead of buried in a weekly export.
    - Ops engineers who keep SLA routing in version control next to the rest of the returns workflow.

    ## Why orchestrate this with Kestra

    RMA aging usually lives as a saved report that somebody remembers to open on Monday, so the queue drifts and nobody can say which return stalled first. Kestra puts the status webhook, the disabled daily sweep, the aging scan, the branch, the per return loop and the three notifications into one versioned file: the gate is declarative, every execution leaves its verdict, stalled count and exposure as typed outputs, and a mailbox rule would only give a forwarded message with no record. The loop turns one scan into one actionable chat message per return, and the `errors` handler keeps a broken run visible.

    ## Prerequisites

    - A Kestra instance with the HTTP, GitHub and Slack plugins available to the worker.
    - A returns system that can POST a JSON body of `rma_id`, `status`, `order_id` and `value_usd` to the webhook URL.
    - A support chat incoming webhook that accepts a JSON body with a text field.
    - A GitHub personal access token able to open issues in the returns repository.
    - A Slack incoming webhook for the escalation summary and for failure alerts.
    - An rmas.json register shaped as `rma_id`, `order_id`, `status`, `status_age_days`, `next_status`, `value_usd`, supplied through the heredoc fixture or replaced with your own export task.

    ### Secrets

    - `RMA_STATUS_WEBHOOK_KEY`: key segment guarding the webhook URL, so only your returns system can post status changes.
    - `SUPPORT_WEBHOOK_URL`: support chat incoming webhook that receives one ping per stalled RMA.
    - `GITHUB_TOKEN`: token used by `open_rollup_issue` to file the rollup issue.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the escalation summary and for failure alerts.

    ## Quick start

    1. Add the four secrets to your namespace and import the flow.
    2. Leave `sla_days` at `5` or set it to the promise you actually make to customers, and point `github_repository` at the repo that should receive the rollup issues.
    3. Execute the flow once against the fixture and read `verdict`, `stalled_count`, `rmas` and `total_value_usd` in the outputs.
    4. Point the returns system at `/api/v1/{tenant}/executions/webhook/{namespace}/returns-rma-tracker/RMA_STATUS_WEBHOOK_KEY`, then confirm one chat ping per stalled RMA, the rollup issue and the Slack summary.
    5. Switch on `daily_aging_sweep` when you want the whole register swept every morning instead of only on a status change.

    ## How to extend

    - Replace the heredoc with an export from your returns platform, or a `jdbc` query against the orders database, and keep the same python verdict.
    - Change the SLA per status by branching on `status` inside `scan_rmas` when refunds may sit longer than inspections.
    - Group the stalled returns by warehouse or carrier before the loop when each queue owner should get one digest instead of one ping per return.
    - Write every verdict to a table with `io.kestra.plugin.jdbc.postgresql.Queries` to build an aging trend across many executions.

    ## Links

    - [HTTP Request task](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [GitHub issues Create task](https://kestra.io/plugins/plugin-github/io.kestra.plugin.github.issues.create)
    - [Loop task documentation](https://kestra.io/docs/workflow-components/tasks/flow-control/loop)
    - [Kestra flow triggers](https://kestra.io/docs/concepts/triggers)
  tags:
    - Business
  subTags:
    - returns
    - rma
    - sla
    - support-operations
  ee: false
  demo: false
