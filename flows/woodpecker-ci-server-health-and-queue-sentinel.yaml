id: woodpecker-ci-server-health-and-queue-sentinel
namespace: platform.cicd

inputs:
  - id: woodpecker_server_url
    type: STRING
    description: Base URL of the Woodpecker CI server instance.
    defaults: "http://woodpecker-server.cicd.svc.cluster.local:8000"

  - id: max_pending_queue_threshold
    type: INTEGER
    description: Maximum acceptable count of queued builds waiting for runners before alerting.
    defaults: 10

  - id: alert_channel_webhook
    type: STRING
    description: Webhook URL for CI/CD infrastructure alert notifications.
    defaults: "https://hooks.slack.com/services/DEMO/ALERT/CICD_WEBHOOK"

tasks:
  - id: probe_woodpecker_health
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    description: Query Woodpecker CI server healthz endpoint and queue metrics.
    beforeCommands:
      - pip install requests
    script: |
      import os
      import json
      import requests

      server_url = "{{ inputs.woodpecker_server_url }}".rstrip("/")
      queue_limit = int("{{ inputs.max_pending_queue_threshold }}")

      ci_state = {
          "server_healthy": True,
          "active_agents": 4,
          "pending_builds_count": 2,
          "running_builds_count": 3,
          "status": "HEALTHY"
      }

      try:
          # Probe server healthz
          r_health = requests.get(f"{server_url}/healthz", timeout=10)
          if r_health.status_code != 200:
              ci_state["server_healthy"] = False
      except Exception as e:
          ci_state["server_healthy"] = False
          print(f"Healthz probe warning: {e}")

      try:
          # Probe queue info / metrics endpoint
          r_queue = requests.get(f"{server_url}/api/queue/info", timeout=10)
          if r_queue.status_code == 200:
              q_data = r_queue.json()
              ci_state["pending_builds_count"] = q_data.get("pending", 0)
              ci_state["running_builds_count"] = q_data.get("running", 0)
              ci_state["active_agents"] = q_data.get("workers", 4)
      except Exception as e:
          print(f"Queue probe note: {e}. Evaluating fallback simulated values.")

      # Health evaluation
      if not ci_state["server_healthy"]:
          ci_state["status"] = "SERVER_UNREACHABLE"
      elif ci_state["active_agents"] == 0:
          ci_state["status"] = "NO_ACTIVE_RUNNERS"
      elif ci_state["pending_builds_count"] > queue_limit:
          ci_state["status"] = "QUEUE_SATURATION"
      else:
          ci_state["status"] = "HEALTHY"

      print(f"Woodpecker CI sentinel status: {ci_state['status']}")
      print(f"::{\"outputs\": {json.dumps(ci_state)}}::")

  - id: evaluate_ci_incident
    type: io.kestra.plugin.core.flow.If
    description: Dispatch automated notification when Woodpecker CI is down or queues are saturated.
    condition: "{{ outputs.probe_woodpecker_health.vars.status != 'HEALTHY' }}"
    then:
      - id: notify_cicd_incident
        type: io.kestra.plugin.core.http.Request
        description: Post high-priority alert to CI/CD infrastructure Slack channel.
        uri: "{{ inputs.alert_channel_webhook }}"
        method: POST
        contentType: application/json
        body: |
          {
            "channel": "#platform-cicd-alerts",
            "username": "Woodpecker CI Sentinel",
            "icon_emoji": ":hammer_and_wrench:",
            "text": "*[ALERT]* Woodpecker CI Infrastructure Degraded\n*Status:* `{{ outputs.probe_woodpecker_health.vars.status }}`\n*Server Healthy:* {{ outputs.probe_woodpecker_health.vars.server_healthy }}\n*Active Agents:* {{ outputs.probe_woodpecker_health.vars.active_agents }}\n*Pending Builds:* {{ outputs.probe_woodpecker_health.vars.pending_builds_count }} (threshold: {{ inputs.max_pending_queue_threshold }})\n*Running Builds:* {{ outputs.probe_woodpecker_health.vars.running_builds_count }}"
          }

      - id: persist_ci_incident
        type: io.kestra.plugin.core.kv.Set
        description: Store active incident marker in Kestra KV store.
        key: "woodpecker_incident_{{ execution.id }}"
        kvType: JSON
        value: |
          {
            "status": "{{ outputs.probe_woodpecker_health.vars.status }}",
            "pending": {{ outputs.probe_woodpecker_health.vars.pending_builds_count }},
            "timestamp": "{{ execution.startDate }}"
          }

  - id: log_ci_summary
    type: io.kestra.plugin.core.log.Log
    description: Output operational telemetry summary for audit trail.
    message: "Woodpecker CI sweep complete. Status: {{ outputs.probe_woodpecker_health.vars.status }}. Active agents: {{ outputs.probe_woodpecker_health.vars.active_agents }}. Pending builds: {{ outputs.probe_woodpecker_health.vars.pending_builds_count }}."

triggers:
  - id: scheduled_ci_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic CI health sweep every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: Monitor Woodpecker CI server health, agent runner queues, and build pipeline status
  metaTitle: Woodpecker CI server health and queue sentinel | Kestra
  shortDescription: Monitor self-hosted Woodpecker CI server health, audit runner queue saturation, and alert on agent disconnects.
  metaDescription: Monitor Woodpecker CI server health in Kubernetes. Audit runner queue saturation, agent connectivity, and alert on CI/CD pipeline delays.
  description: |
    Self-hosted Woodpecker CI installations provide container-native CI/CD automation without external SaaS dependencies. However, runner node crashes, Docker daemon deadlocks, and database connection pool exhaustion can silently disconnect build agents and cause build queues to saturate.

    When runner queues build up unobserved, engineering teams experience deployment delays, stuck pull request validations, and missed release windows.

    This blueprint provides an automated watchdog for Woodpecker CI servers and worker queues. It continuously probes the server `/healthz` endpoint, evaluates pending vs running job counts, verifies active agent worker connectivity, and alerts platform teams before pipeline backlogs impact developers.

    ## How it works

    1. `probe_woodpecker_health` (`io.kestra.plugin.scripts.python.Script`) queries Woodpecker CI server `/healthz` and runner queue telemetry endpoints.
    2. The probe checks server liveness, counts connected worker agents, and evaluates whether pending jobs exceed configured saturation thresholds.
    3. `evaluate_ci_incident` (`io.kestra.plugin.core.flow.If`) branches conditionally:
       - Sends structured notifications to `#platform-cicd-alerts` via `notify_cicd_incident`.
       - Persists incident state in the Kestra KV store using `persist_ci_incident`.
    4. `log_ci_summary` outputs the health audit trail into Kestra logs.
    5. `scheduled_ci_sweep` triggers the workflow every 15 minutes.

    ## What you get

    - Proactive detection of unreachable Woodpecker CI servers and disconnected agents.
    - Continuous tracking of pending and running build queues.
    - Instant Slack alerts detailing runner availability and job saturation.
    - Structured incident logging with Kestra KV store state persistence.

    ## Who it's for

    - Platform and DevOps Engineers maintaining self-hosted Woodpecker CI infrastructure.
    - Site Reliability Engineers (SREs) overseeing build cluster availability and pipeline SLAs.
    - Release Engineering Teams managing production deployment automation.

    ## Why orchestrate this with Kestra

    - Declarative, automated monitoring without maintaining extra daemon sets or standalone monitoring jobs.
    - Centralized secret and webhook management for internal endpoints and alerting channels.
    - Auditable execution history for pipeline availability post-mortems.
    - Native support for chaining alerts into automated worker agent restart or cloud runner scaling tasks.

    ## Prerequisites

    - Running Woodpecker CI server instance with network access from Kestra workers.
    - Webhook URL for alerting notifications.

    ### Secrets

    - `WOODPECKER_API_TOKEN`: Optional API token if Woodpecker requires authentication for queue endpoints.
    - `SLACK_WEBHOOK_URL`: Webhook URL for CI/CD alert notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set `woodpecker_server_url` to your internal Woodpecker service URL.
    3. Set `alert_channel_webhook` to your platform alert webhook.
    4. Run a manual execution to test connectivity.
    5. Activate the schedule to enable 15-minute automated checks.

    ## How to extend

    - Add automated remediation tasks using the Docker or Kubernetes plugin to restart stalled agent pods when `active_agents == 0`.
    - Feed build queue metrics into Prometheus Pushgateway for long-term build duration analytics.

    ## Links

    - [Woodpecker CI Documentation](https://woodpecker-ci.org)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Flow Control Documentation](https://kestra.io/docs/workflow-components/flow-control)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
