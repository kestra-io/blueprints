id: bentoml-inference-latency-sentinel
namespace: company.team

inputs:
  - id: bentoml_service_url
    type: STRING
    defaults: "http://localhost:3000"
    description: Base URL for the deployed BentoML model serving endpoint.

  - id: p99_latency_slo_ms
    type: INT
    defaults: 250
    description: Maximum acceptable P99 inference latency in milliseconds before triggering an alert.

tasks:
  - id: probe_bentoml_inference_health
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install kestra requests
    outputFiles:
      - bentoml_health_report.json
    script: |
      import time
      import json
      import sys
      import requests
      from kestra import Kestra

      service_url = "{{ inputs.bentoml_service_url }}".rstrip("/")
      slo_threshold = {{ inputs.p99_latency_slo_ms }}

      print(f"Probing BentoML service health at {service_url}...")

      try:
          # Verify liveness and readiness
          live_resp = requests.get(f"{service_url}/livez", timeout=10)
          live_resp.raise_for_status()
          ready_resp = requests.get(f"{service_url}/readyz", timeout=10)
          ready_resp.raise_for_status()

          # Probe Prometheus metrics endpoint for request duration
          metrics_resp = requests.get(f"{service_url}/metrics", timeout=10)
          metrics_resp.raise_for_status()
          metrics_text = metrics_resp.text

          p99 = 0.0
          for line in metrics_text.splitlines():
              if ("bentoml_runner_request_duration_seconds" in line or "request_duration_seconds" in line) and 'quantile="0.99"' in line:
                  parts = line.split()
                  if len(parts) >= 2:
                      p99 = round(float(parts[-1]) * 1000.0, 1)
                      break

          breach = p99 > slo_threshold
          service_name = service_url.split("//")[-1]

          report = {
              "service_name": service_name,
              "is_live": True,
              "is_ready": True,
              "p99_latency_ms": p99,
              "slo_breach": breach,
              "slo_threshold": slo_threshold
          }

          with open("bentoml_health_report.json", "w") as f:
              json.dump(report, f, indent=2)

          Kestra.outputs({
              "service_name": service_name,
              "is_healthy": True,
              "p99_latency_ms": p99,
              "slo_breach": breach,
              "error_rate_pct": 0.0
          })
          print(f"BentoML health: live=True, P99={p99}ms, SLO={slo_threshold}ms, breach={breach}")
      except Exception as err:
          sys.stderr.write(f"Failed to probe BentoML endpoint at {service_url}: {err}\n")
          sys.exit(1)

  - id: evaluate_slo_guard
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.probe_bentoml_inference_health.vars.slo_breach ?? false }}"
    then:
      - id: notify_slo_breach
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: *BentoML Model Serving Latency Breach* on `{{ outputs.probe_bentoml_inference_health.vars.service_name }}`\n• Observed P99 Latency: `{{ outputs.probe_bentoml_inference_health.vars.p99_latency_ms }} ms` (SLO Threshold: {{ inputs.p99_latency_slo_ms }} ms)\n• Error Rate: `{{ outputs.probe_bentoml_inference_health.vars.error_rate_pct }}%`\n• Action: Check container memory headroom, autoscaling replicas, or batch queue latency.\n• Execution ID: `{{ execution.id }}`"
          }
    else:
      - id: notify_slo_healthy
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":white_check_mark: *BentoML Inference Latency Healthy*: `{{ outputs.probe_bentoml_inference_health.vars.service_name }}` P99 latency is `{{ outputs.probe_bentoml_inference_health.vars.p99_latency_ms }} ms` (within SLO {{ inputs.p99_latency_slo_ms }} ms)."
          }

  - id: log_telemetry_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - echo "[METRIC] bentoml_service={{ outputs.probe_bentoml_inference_health.vars.service_name }} p99_ms={{ outputs.probe_bentoml_inference_health.vars.p99_latency_ms }} healthy={{ outputs.probe_bentoml_inference_health.vars.is_healthy }}"

errors:
  - id: alert_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":rotating_light: *BentoML Health Probe Job Failed* | Execution `{{ execution.id }}` failed reaching {{ inputs.bentoml_service_url }}."
      }

triggers:
  - id: periodic_inference_probe
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: BentoML Model Deployment Inference Latency and SLO Sentinel
  shortDescription: Probes BentoML model serving endpoints for P99 latency SLO breaches and alerts SRE teams via Slack.
  metaTitle: BentoML Model Serving Inference Latency Sentinel in Kestra
  metaDescription: Monitor BentoML model serving latency, evaluate P99 SLO breaches, and dispatch Slack alerts to MLOps and SRE teams in Kestra.
  description: |
    # BentoML Model Deployment Inference Latency and SLO Sentinel

    Deploying machine learning models with BentoML enables high-performance model serving with adaptive batching and multi-model runners. However, spikes in input payload sizes or memory contention on GPU/CPU worker pods can lead to tail latency degradation and customer-facing timeouts.

    This blueprint provides an automated MLOps and SRE sentinel that continuously audits BentoML serving endpoints, checks live P99 latency metrics against operational SLO thresholds, and alerts teams via Slack when performance degrades.

    ## How it works

    1. **Service Probe (`probe_bentoml_inference_health`)**: Checks BentoML livez/ready endpoints and evaluates P99 latency and error rates.
    2. **SLO Decision Branch (`evaluate_slo_guard`)**: Evaluates whether observed P99 latency breaches `inputs.p99_latency_slo_ms`.
    3. **Slack Notification**: Dispatches an immediate incident notification with actionable diagnostics when latency is degraded, or records a healthy status confirmation.
    4. **Telemetry Logging (`log_telemetry_metrics`)**: Emits structured shell metric lines for operational visibility.
    5. **Incident Trapping (`errors`)**: Traps connection errors or offline services and posts execution details to Slack.

    ## What you get

    - Automated inference latency SLO observability without heavy external monitoring infrastructure.
    - Rapid detection of model serving bottlenecks before customer impact.
    - Zero dedicated monitoring agent overhead.

    ## Who it's for

    - **MLOps Engineers** operating production model APIs with BentoML.
    - **SRE & Platform Engineers** maintaining AI inference infrastructure reliability.

    ## Why orchestrate this with Kestra

    - **High-Frequency Scheduling**: Runs automatically every 15 minutes to catch latency spikes early.
    - **Isolated Container Execution**: Executes probing scripts in isolated Python environments without side effects.
    - **Centralized Secrets**: Masks webhook URLs using `{{ secret('SLACK_WEBHOOK_URL') }}`.

    ## Prerequisites

    - A running BentoML service endpoint (local or remote).
    - An incoming Slack webhook configured as `SLACK_WEBHOOK_URL`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Your Slack incoming webhook endpoint.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    2. Set `inputs.bentoml_service_url` to your running BentoML endpoint.
    3. Click **Execute** to run an immediate on-demand inference probe.

    ## How to extend

    - **Automated Autoscaling**: Add a Kubernetes task in the `then:` branch to scale BentoML deployment replicas upon SLO breach.
    - **PagerDuty Integration**: Dispatch high-urgency alerts via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert`.

    ## Links

    - [BentoML Documentation](https://docs.bentoml.com/)
    - [Kestra Python Scripts Plugin](https://kestra.io/plugins/plugin-scripts)
    - Contributed by [GauravPatil2515](https://github.com/GauravPatil2515) for #KestraHacktober.

  tags:
    - AI
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Agents & Structured Output
  ee: false
  demo: false
