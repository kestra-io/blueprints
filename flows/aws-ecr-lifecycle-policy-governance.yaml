id: aws-ecr-lifecycle-policy-governance
namespace: company.security

description: |
  Audits all Amazon ECR repositories in an AWS account and region for missing lifecycle
  policies, alerts security and operations teams on Slack when unmanaged repositories are
  detected, and provides an operator-approved automated remediation gate to apply a baseline
  image retention lifecycle policy.

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: us-east-1
    description: AWS region where Amazon ECR repositories reside.

  - id: auto_enforce
    type: BOOL
    displayName: Enable Remediation Gate
    defaults: false
    description: When true, enables human-in-the-loop approval to automatically apply baseline lifecycle policies to non-compliant repositories.

  - id: untagged_retention_days
    type: INT
    displayName: Untagged Image Retention (Days)
    defaults: 14
    description: Days before untagged image digests expire and are pruned from ECR.

  - id: max_image_count
    type: INT
    displayName: Max Tagged Image Count
    defaults: 100
    description: Maximum number of tagged container images retained per repository.

triggers:
  - id: scheduled_compliance_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    disabled: true

tasks:
  - id: scan_ecr_lifecycle_policies
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Enumerate all ECR repositories in the target region and check for active lifecycle policies.
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.aws_region }}"
    commands:
      - |
        REPOS=$(aws ecr describe-repositories --query "repositories[].repositoryName" --output text)
        
        TOTAL=0
        NON_COMPLIANT_COUNT=0
        COMPLIANT_COUNT=0
        NON_COMPLIANT=""
        COMPLIANT=""

        for repo in $REPOS; do
          TOTAL=$((TOTAL + 1))
          POLICY_OUTPUT=""
          if POLICY_OUTPUT=$(aws ecr get-lifecycle-policy --repository-name "$repo" 2>&1); then
            COMPLIANT_COUNT=$((COMPLIANT_COUNT + 1))
            COMPLIANT="$COMPLIANT $repo"
          else
            if echo "$POLICY_OUTPUT" | grep -q "LifecyclePolicyNotFoundException"; then
              NON_COMPLIANT_COUNT=$((NON_COMPLIANT_COUNT + 1))
              NON_COMPLIANT="$NON_COMPLIANT $repo"
            else
              echo "Notice: get-lifecycle-policy for $repo returned non-missing error: $POLICY_OUTPUT" >&2
            fi
          fi
        done

        NON_COMPLIANT=$(echo "$NON_COMPLIANT" | sed 's/^ *//')
        COMPLIANT=$(echo "$COMPLIANT" | sed 's/^ *//')

        HAS_GAPS=false
        if [ "$NON_COMPLIANT_COUNT" -gt 0 ]; then
          HAS_GAPS=true
        fi

        echo "::{\"outputs\": {\"total_repositories\": $TOTAL, \"compliant_count\": $COMPLIANT_COUNT, \"non_compliant_count\": $NON_COMPLIANT_COUNT, \"has_compliance_gaps\": $HAS_GAPS, \"non_compliant_repositories\": \"$NON_COMPLIANT\", \"compliant_repositories\": \"$COMPLIANT\"}}::"

  - id: evaluate_compliance_gaps
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether any repositories lack lifecycle policies.
    condition: "{{ outputs.scan_ecr_lifecycle_policies.vars.has_compliance_gaps ?? false }}"
    then:
      - id: alert_compliance_gaps
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Notify SecOps channel of non-compliant ECR repositories.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {
            "text": ":warning: *AWS ECR Lifecycle Policy Governance Alert*\nDetected *" ~ outputs.scan_ecr_lifecycle_policies.vars.non_compliant_count ~ "* out of *" ~ outputs.scan_ecr_lifecycle_policies.vars.total_repositories ~ "* Amazon ECR repositories in `" ~ inputs.aws_region ~ "` lacking lifecycle policies.\n\n*Non-compliant repositories:*\n`" ~ outputs.scan_ecr_lifecycle_policies.vars.non_compliant_repositories ~ "`\n\n_Repositories without lifecycle policies retain all image layers and digests indefinitely, driving unnecessary S3 storage consumption._"
          } | toJson }}

      - id: remediation_decision_gate
        type: io.kestra.plugin.core.flow.If
        description: Check if automated remediation workflow is enabled.
        condition: "{{ inputs.auto_enforce }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: Pauses execution for platform operator review and sign-off before applying baseline lifecycle policies.
            pauseDuration: PT30M
            behavior: CANCEL
            onResume:
              - id: proceed
                type: BOOL
                defaults: false
                description: Approve applying baseline lifecycle policy to non-compliant repositories.

          - id: evaluate_remediation_approval
            type: io.kestra.plugin.core.flow.If
            description: Apply policies only if the operator explicitly approved during the pause gate.
            condition: "{{ outputs.approval_gate.onResume.proceed ?? false }}"
            then:
              - id: enforce_baseline_lifecycle_policy
                type: io.kestra.plugin.aws.cli.AwsCLI
                description: Attach standardized baseline lifecycle policy to each non-compliant repository.
                accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
                secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
                region: "{{ inputs.aws_region }}"
                commands:
                  - |
                    cat << 'EOF' > /tmp/baseline_policy.json
                    {
                      "rules": [
                        {
                          "rulePriority": 1,
                          "description": "Expire untagged images older than retention threshold",
                          "selection": {
                            "tagStatus": "untagged",
                            "countType": "sinceImagePushed",
                            "countUnit": "days",
                            "countNumber": {{ inputs.untagged_retention_days }}
                          },
                          "action": {
                            "type": "expire"
                          }
                        },
                        {
                          "rulePriority": 2,
                          "description": "Retain most recent tagged images",
                          "selection": {
                            "tagStatus": "any",
                            "countType": "imageCountMoreThan",
                            "countNumber": {{ inputs.max_image_count }}
                          },
                          "action": {
                            "type": "expire"
                          }
                        }
                      ]
                    }
                    EOF

                    REMEDIATED=""
                    FAILED=""
                    REMEDIATED_COUNT=0
                    FAILED_COUNT=0

                    for repo in {{ outputs.scan_ecr_lifecycle_policies.vars.non_compliant_repositories }}; do
                      if [ -n "$repo" ]; then
                        echo "Applying baseline lifecycle policy to $repo..."
                        if aws ecr put-lifecycle-policy --repository-name "$repo" --lifecycle-policy-text file:///tmp/baseline_policy.json; then
                          REMEDIATED_COUNT=$((REMEDIATED_COUNT + 1))
                          REMEDIATED="$REMEDIATED $repo"
                        else
                          FAILED_COUNT=$((FAILED_COUNT + 1))
                          FAILED="$FAILED $repo"
                        fi
                      fi
                    done

                    REMEDIATED=$(echo "$REMEDIATED" | sed 's/^ *//')
                    FAILED=$(echo "$FAILED" | sed 's/^ *//')

                    echo "::{\"outputs\": {\"remediated_count\": $REMEDIATED_COUNT, \"remediated_repositories\": \"$REMEDIATED\", \"failed_count\": $FAILED_COUNT, \"failed_repositories\": \"$FAILED\"}}::"

              - id: verify_fleet_compliance
                type: io.kestra.plugin.aws.cli.AwsCLI
                description: Re-query ECR to confirm successful lifecycle policy attachment.
                accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
                secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
                region: "{{ inputs.aws_region }}"
                commands:
                  - |
                    VERIFIED_COUNT=0
                    UNVERIFIED_COUNT=0

                    for repo in {{ outputs.enforce_baseline_lifecycle_policy.vars.remediated_repositories }}; do
                      if [ -n "$repo" ]; then
                        if aws ecr get-lifecycle-policy --repository-name "$repo" >/dev/null 2>&1; then
                          VERIFIED_COUNT=$((VERIFIED_COUNT + 1))
                        else
                          UNVERIFIED_COUNT=$((UNVERIFIED_COUNT + 1))
                        fi
                      fi
                    done

                    echo "::{\"outputs\": {\"verified_count\": $VERIFIED_COUNT, \"unverified_count\": $UNVERIFIED_COUNT}}::"

              - id: notify_remediation_summary
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                description: Notify Slack channel that non-compliant ECR repositories were successfully remediated.
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                payload: |
                  {{ {
                    "text": ":white_check_mark: *AWS ECR Lifecycle Policy Remediation Completed*\nRemediated *" ~ outputs.enforce_baseline_lifecycle_policy.vars.remediated_count ~ "* repository(ies) in `" ~ inputs.aws_region ~ "`.\n\n*Applied Policy:*\n• Untagged images expired after `" ~ inputs.untagged_retention_days ~ " days`\n• Tagged images capped at `" ~ inputs.max_image_count ~ " images`\n• Verification status: *" ~ outputs.verify_fleet_compliance.vars.verified_count ~ "* confirmed compliant."
                  } | toJson }}
            else:
              - id: log_remediation_rejected
                type: io.kestra.plugin.core.log.Log
                message: "Operator resumed execution without approving remediation (proceed=false). Skipping lifecycle policy enforcement."
        else:
          - id: log_audit_only
            type: io.kestra.plugin.core.log.Log
            message: "Audit-only mode active (auto_enforce=false). Non-compliant repositories identified: {{ outputs.scan_ecr_lifecycle_policies.vars.non_compliant_repositories }}."
    else:
      - id: log_fleet_healthy
        type: io.kestra.plugin.core.log.Log
        message: "HEALTHY: All {{ outputs.scan_ecr_lifecycle_policies.vars.total_repositories }} Amazon ECR repositories in {{ inputs.aws_region }} have active lifecycle policies configured."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status log recording audit execution summary.
    message: "Amazon ECR governance scan completed for region {{ inputs.aws_region }}. Total repositories: {{ outputs.scan_ecr_lifecycle_policies.vars.total_repositories }}, Non-compliant: {{ outputs.scan_ecr_lifecycle_policies.vars.non_compliant_count }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert SecOps and platform teams on unexpected audit or CLI execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {
        "text": ":x: *AWS ECR Lifecycle Policy Governance Sentinel FAILED*\nExecution `" ~ execution.id ~ "` failed during ECR compliance evaluation in `" ~ inputs.aws_region ~ "`: `" ~ (error.message ?? "Unknown error") ~ "`."
      } | toJson }}

extend:
  title: AWS ECR Lifecycle Policy Governance Sentinel and Remediation Gate
  metaTitle: AWS ECR Lifecycle Policy Governance Sentinel with Kestra
  metaDescription: Audit all Amazon ECR repositories for missing lifecycle policies, alert Slack on governance gaps, and enforce baseline retention policies behind human approval.
  shortDescription: Audit Amazon ECR repositories for missing lifecycle policies, alert Slack, and enforce baseline retention policies behind human approval.
  description: |
    Amazon Elastic Container Registry (ECR) repositories store container images and layer blobs in Amazon S3.
    When a repository lacks an ECR lifecycle policy, orphaned untagged image digests, build artifacts, and stale
    release tags accumulate indefinitely, creating uncontrolled cloud storage costs and compliance gaps.

    This sentinel periodically audits every ECR repository in your AWS region using `io.kestra.plugin.aws.cli.AwsCLI`,
    identifies repositories that have no lifecycle policy attached, posts an actionable alert to Slack, and gates
    automated baseline policy enforcement behind a human-in-the-loop operator approval.

    ## How it works

    1. **Fleet Discovery and Policy Audit**: The `scan_ecr_lifecycle_policies` task executes AWS CLI commands
       to list all ECR repositories via `aws ecr describe-repositories` and tests each repository for an active policy
       via `aws ecr get-lifecycle-policy`. Only repositories returning `LifecyclePolicyNotFoundException` are counted
       as missing policies, ensuring API permission errors are not falsely reported as compliance gaps.
    2. **Governance Gap Classification**: Repositories lacking lifecycle policies are cataloged and counted.
       If `has_compliance_gaps` is true, the workflow transitions to alerting and remediation.
    3. **Slack Team Notification**: SecOps and DevOps engineers receive immediate Slack notifications listing all
       unmanaged repository names with context on the storage risk.
    4. **Human-in-the-Loop Approval**: When `auto_enforce` is enabled, the flow halts at `approval_gate`
       (`io.kestra.plugin.core.flow.Pause`) with a 30-minute safety window (`pauseDuration: PT30M`, `behavior: CANCEL`),
       allowing engineers to inspect the candidate list before any changes are written. Operators must explicitly approve
       by setting `proceed: true` (defaults to `false`), gating baseline policy enforcement, verification, and summary
       alerts behind `evaluate_remediation_approval`.
    5. **Baseline Policy Enforcement**: Upon sign-off, `enforce_baseline_lifecycle_policy` applies a standardized
       rule set via `aws ecr put-lifecycle-policy`:
       - Prunes untagged images older than `untagged_retention_days` (default: 14 days).
       - Retains the most recent `max_image_count` images (default: 100 images).
    6. **Fleet Verification**: The `verify_fleet_compliance` task re-queries the modified repositories to confirm
       active policy attachment and posts a completion summary to Slack.

    ## What you get

    - Account-wide visibility into unmanaged ECR repositories without deploying third-party agent daemons.
    - Automated Slack alerts highlighting non-compliant container repositories before monthly storage invoices spike.
    - Safe human-in-the-loop remediation preventing unintentional image expiration.
    - Full execution lineage, task logs, and compliance audit trail in Kestra.

    ## Who it's for

    - Platform and Cloud Engineering teams maintaining container registries across development and production clusters.
    - FinOps teams tracking and reclaiming wasted cloud storage expenses.
    - DevSecOps engineers enforcing repository governance standards across AWS organizations.

    ## Why orchestrate this with Kestra

    Building this logic in ad-hoc shell scripts or cron jobs leaves no audit trail, requires hardcoded credentials,
    and lacks approval gates. AWS Config or Lambda alternatives require managing SNS topics, IAM event buses, and
    custom function runtimes. Kestra consolidates discovery, decision trees, Slack alerting, and human approval
    into a declarative, self-documenting workflow with namespace secrets and complete execution logs.

    ## Prerequisites

    - An AWS IAM user or role with permissions to read and update ECR repositories:
      - `ecr:DescribeRepositories`
      - `ecr:GetLifecyclePolicy`
      - `ecr:PutLifecyclePolicy` (only required when `auto_enforce` is true)
    - A Slack Incoming Webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for notifications.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Run the workflow manually in audit-only mode (`auto_enforce: false`) to view current compliance status across your ECR repositories.
    3. To enable automated remediation, set `auto_enforce: true` and approve the pause prompt when prompted.
    4. Enable the `scheduled_compliance_audit` trigger to run daily checks automatically.

    ## How to extend

    - **Multi-Region Fleet Scan**: Wrap the flow in a `ForEach` loop iterating over an array of AWS regions.
    - **Tag-Specific Exclusion**: Customize the baseline lifecycle policy JSON to retain images with release tags like `v*` or `prod-*` indefinitely.
    - **Ticket Creation**: Replace or augment the Slack notification task with `io.kestra.plugin.jira.issues.Create` or `io.kestra.plugin.github.issues.Create` to track compliance tickets in your team's backlog.

    ## Links

    - [Amazon ECR Lifecycle Policies documentation](https://docs.aws.amazon.com/AmazonECR/latest/userguide/LifecyclePolicies.html)
    - [Kestra AWS Plugin documentation](https://kestra.io/plugins/plugin-aws)
    - [Kestra Slack Plugin documentation](https://kestra.io/plugins/plugin-slack)
    - [Kestra Pause Task documentation](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
