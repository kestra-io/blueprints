id: ceph-s3-radosgw-bucket-sync-drift-sentinel
namespace: company.storage

inputs:
  - id: rgw_admin_url
    type: STRING
    defaults: "http://radosgw.internal:8000"
    description: Base URL of Ceph RADOS Gateway Admin Ops API.

tasks:
  - id: query_sync_status
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Ceph RadosGW sync status using S3 Admin Ops API
        curl -s -f "{{ inputs.rgw_admin_url }}/admin/sync/status?format=json" > /tmp/ceph_sync_telemetry.json 2>/dev/null || echo '{"data_status":{"status":"failed"}}' > /tmp/ceph_sync_telemetry.json
        
        DATA_STATUS=$(jq -r '.data_status.status // "unknown"' /tmp/ceph_sync_telemetry.json)
        echo "::set-output name=data_status::$DATA_STATUS::"

  - id: evaluate_sync_drift
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_sync_status.vars.data_status != 'healthy' and outputs.query_sync_status.vars.data_status != 'syncing' }}"
    then:
      - id: notify_storage_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#storage-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Ceph RGW S3 Multi-Site Replication Degraded Alert",
                "text": "Ceph RADOS Gateway at `{{ inputs.rgw_admin_url }}` reported abnormal sync status *{{ outputs.query_sync_status.vars.data_status }}*! Cross-zone S3 bucket replication is stalled or out of sync.",
                "footer": "Kestra Storage Sentinel • Ceph RGW"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#storage-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Ceph RGW Sentinel Failure",
            "text": "Failed to query Ceph RGW Admin Ops API. Verify gateway address and network connectivity.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  title: Ceph RadosGW Multi-Site S3 Bucket Sync Drift Sentinel
  shortDescription: Audits Ceph RADOS Gateway multi-site sync status to detect stalled S3 bucket replication streams and metadata drift.
  description: |
    ## How it works
    This workflow connects to the Ceph RADOS Gateway Admin Ops API (`/admin/sync/status`) to audit the health of multi-site S3 bucket data replication. In enterprise private-cloud storage architectures, Ceph RGW multi-site configuration replicates object data and bucket metadata asynchronously across multiple zones and datacenters. When network splits, large object transfer backlogs, or corrupted journal logs stall data sync (`status != "healthy"`), secondary sites serve stale or missing objects. This workflow audits sync status and alerts storage engineers immediately.

    ## What you get
    - Real-time detection of stalled multi-site S3 replication in Ceph object storage.
    - Prevents data inconsistency across private cloud storage zones.
    - Actionable visibility into replication engine health.

    ## Who it's for
    - Storage Administrators and Cloud Infrastructure Engineers managing Ceph clusters.
    - SREs responsible for on-premises object storage high availability.

    ## Why orchestrate this with Kestra
    - **Continuous Storage Assurance**: Periodically evaluates multi-site replication without manual CLI checks.
    - **Decoupled Monitoring**: Communicates with standard HTTP Admin Ops API.
    - **Direct Team Alerts**: Escalates replication stalls directly to storage Slack channels.

    ## Prerequisites
    - Ceph RadosGW cluster with Admin Ops API enabled.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Ceph RGW Admin URL.
    3. Run the workflow to inspect sync health.

    ## How to extend
    - Query bucket-specific sync status via `/admin/bucket?sync-status&bucket={name}`.
    - Alert when replication sync lag delta exceeds 1 hour.

    ## Links
    - [Ceph Multi-Site Sync Status Documentation](https://docs.ceph.com/en/latest/radosgw/multisite/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
