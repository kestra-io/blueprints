id: snowflake-external-stage-accessibility-probe
namespace: company.dataops

description: Proactively probes Snowflake external stages on cloud object storage to verify storage integration credentials before scheduled ELT copy pipelines fail.

concurrency:
  limit: 1

inputs:
  - id: snowflake_account
    type: STRING
    defaults: xy12345.us-east-1
    description: Snowflake account identifier.

  - id: snowflake_warehouse
    type: STRING
    defaults: COMPUTE_WH
    description: Virtual warehouse used to execute stage listing queries.

  - id: snowflake_database
    type: STRING
    defaults: RAW_LANDING
    description: Database containing the target external stage.

  - id: snowflake_stage_name
    type: STRING
    defaults: s3_incoming_events_stage
    description: Name of the external stage pointing to AWS S3, GCS, or Azure Blob.

  - id: slack_channel
    type: STRING
    defaults: "#data-platform-alerts"
    description: Slack channel destination for external storage stage alerts.

tasks:
  - id: probe_external_stage
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install snowflake-connector-python
    env:
      SNOWFLAKE_ACCOUNT: "{{ inputs.snowflake_account }}"
      SNOWFLAKE_WAREHOUSE: "{{ inputs.snowflake_warehouse }}"
      SNOWFLAKE_DATABASE: "{{ inputs.snowflake_database }}"
      STAGE_NAME: "{{ inputs.snowflake_stage_name }}"
      SNOWFLAKE_USER: "{{ secret('SNOWFLAKE_USER') }}"
      SNOWFLAKE_PASSWORD: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    script: |
      import os
      import json
      import snowflake.connector
      from kestra import Kestra

      account = os.getenv('SNOWFLAKE_ACCOUNT')
      warehouse = os.getenv('SNOWFLAKE_WAREHOUSE')
      database = os.getenv('SNOWFLAKE_DATABASE')
      stage_name = os.getenv('STAGE_NAME')
      user = os.getenv('SNOWFLAKE_USER')
      password = os.getenv('SNOWFLAKE_PASSWORD')

      conn = snowflake.connector.connect(
          account=account,
          user=user,
          password=password,
          warehouse=warehouse,
          database=database
      )
      cursor = conn.cursor()

      is_accessible = True
      error_message = None
      files_discovered = 0

      try:
          cursor.execute(f"LIST @{stage_name};")
          rows = cursor.fetchall()
          files_discovered = len(rows)
      except Exception as e:
          is_accessible = False
          error_message = str(e)
      finally:
          conn.close()

      Kestra.outputs({
          'stage_name': stage_name,
          'is_accessible': is_accessible,
          'files_discovered': files_discovered,
          'has_accessibility_failure': not is_accessible,
          'error_message': error_message or 'OK'
      })

      report = {
          'database': database,
          'stage_name': stage_name,
          'is_accessible': is_accessible,
          'files_count': files_discovered,
          'error': error_message
      }

      with open('snowflake_stage_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - snowflake_stage_report.json

  - id: check_stage_accessibility
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.probe_external_stage.vars.has_accessibility_failure }}"
    then:
      - id: notify_slack_dataops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "Snowflake External Stage Access Failure: External stage `@{{ inputs.snowflake_stage_name }}` in `{{ inputs.snowflake_database }}` is inaccessible.\n• Error Message: {{ outputs.probe_external_stage.vars.error_message }}\n• Impact: Scheduled bulk ingestion and `COPY INTO` pipelines will fail.\n• Remediation: Verify AWS IAM role trust policies, KMS key permissions, or cloud storage integration authorization."
          }
    else:
      - id: log_stage_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Snowflake external stage @{{ inputs.snowflake_stage_name }} is healthy and reachable. Successfully discovered {{ outputs.probe_external_stage.vars.files_discovered }} objects."

  - id: export_stage_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      stage_target: "{{ inputs.snowflake_stage_name }}"
      access_status: "{{ outputs.probe_external_stage.vars.has_accessibility_failure ? 'ACCESS_DENIED' : 'ACCESSIBLE' }}"
      objects_found: "{{ outputs.probe_external_stage.vars.files_discovered | string }}"

triggers:
  - id: periodic_stage_probe
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"

extend:
  title: Snowflake External Stage Accessibility Probe
  metaTitle: Snowflake External Stage Accessibility Probe
  shortDescription: Proactively probes Snowflake external stages on cloud object storage to verify storage integration credentials.
  metaDescription: Proactively probes Snowflake external stages on cloud storage to verify IAM credentials before scheduled ELT copy pipelines fail.
  description: |
    This blueprint acts as an automated infrastructure and storage integration sentinel for Snowflake data platforms. Scheduled every 4 hours, it executes probe queries (`LIST @stage_name`) across designated external cloud object storage stages (AWS S3, Google Cloud Storage, or Azure Blob), catching IAM permission revocations, expired STS role trusts, or KMS key rotation failures before production `COPY INTO` pipelines break.

    ## How it works

    1. **Recurring 4-Hour Probe**: The `periodic_stage_probe` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires every 4 hours.
    2. **Snowflake Stage Query**: The `probe_external_stage` task (`io.kestra.plugin.scripts.python.Script`) connects to Snowflake via the Python connector, issues `LIST @stage_name`, and traps storage integration error responses.
    3. **Condition Gate**: The `check_stage_accessibility` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether the stage probe raised an accessibility failure.
    4. **Slack Alert Dispatch**: When storage access fails, `notify_slack_dataops` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an urgent incident card with the root error message.
    5. **Nominal Confirmation**: When the stage is reachable, `log_stage_healthy` records confirmed status.
    6. **Manifest Export**: The `export_stage_manifest` task tags the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 4 Hours] --> B[probe_external_stage: Snowflake LIST @stage]
        B --> C{Stage Inaccessible or Auth Failed?}
        C -- Yes --> D[notify_slack_dataops: Slack Webhook]
        C -- No --> E[log_stage_healthy: Log]
        D --> F[export_stage_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Catch IAM Role Expiration Before Batch ETL Runs**: Prevent nightly analytical load failures caused by modified AWS IAM role trust policies or revoked bucket ACLs.
    - **Multi-Cloud Storage Integration Auditing**: Proactively verify external stages spanning AWS S3, GCS buckets, and Azure Blob containers.
    - **Verify KMS Key Decryption Permissions**: Catch KMS key policy alterations that prevent Snowflake from reading encrypted objects in storage stages.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `snowflake_account` | STRING | `xy12345.us-east-1` | Snowflake account identifier. |
    | `snowflake_warehouse` | STRING | `COMPUTE_WH` | Virtual warehouse used to execute stage listing queries. |
    | `snowflake_database` | STRING | `RAW_LANDING` | Database containing the target external stage. |
    | `snowflake_stage_name` | STRING | `s3_incoming_events_stage` | Name of the external stage pointing to AWS S3, GCS, or Azure Blob. |
    | `slack_channel` | STRING | `#data-platform-alerts` | Slack channel destination for external storage stage alerts. |

    ## Expected outputs

    - `{{ outputs.probe_external_stage.vars.stage_name }}`: Identifier of the probed external stage.
    - `{{ outputs.probe_external_stage.vars.is_accessible }}`: Boolean flag indicating successful stage reachability.
    - `{{ outputs.probe_external_stage.vars.files_discovered }}`: Number of objects discovered in the stage directory.
    - `{{ outputs.probe_external_stage.vars.has_accessibility_failure }}`: Boolean flag indicating authentication failure.
    - `{{ outputs.probe_external_stage.outputFiles['snowflake_stage_report.json'] }}`: Full JSON stage probe diagnostic report.

    ## Prerequisites

    - Snowflake database user with `USAGE` privileges on the database, schema, and target external stage.
    - Incoming Webhook URL configured for your data platform Slack channel.

    ### Secrets

    - `SNOWFLAKE_USER`: Snowflake authentication username.
    - `SNOWFLAKE_PASSWORD`: Snowflake authentication password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `SNOWFLAKE_USER`, `SNOWFLAKE_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your Snowflake connection parameters and stage name in inputs.
    4. Click **Execute** in the UI to perform an immediate external stage probe.

    ## Common pitfalls and troubleshooting

    - **Storage Integration Trust Policies**: When using Snowflake Storage Integrations on AWS S3, ensure the IAM role trust policy matches the `STORAGE_AWS_IAM_USER_ARN` and `STORAGE_AWS_EXTERNAL_ID` returned by `DESC INTEGRATION <name>`.
    - **Warehouse Resumption**: Running `LIST @stage` requires an active virtual warehouse; keep the warehouse size at `X-Small` and enable auto-suspend.

    ## How to extend

    - Add automated description of the storage integration via `DESC STORAGE INTEGRATION <name>` upon access failures to append the expected IAM ARN to Slack.
    - Probe multiple stages in parallel using `io.kestra.plugin.core.flow.EachParallel`.
    - Route critical stage outages to PagerDuty to page on-call data infrastructure engineers.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Snowflake External Stages Documentation: https://docs.snowflake.com/en/user-guide/data-load-s3-create-stage
  tags:
    - Data
    - Cloud
  subTags:
    - Storage
    - ELT & Data Landing
    - Monitoring & Alerting
  ee: false
  demo: false
