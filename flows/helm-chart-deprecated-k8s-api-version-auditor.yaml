id: helm-chart-deprecated-k8s-api-version-auditor
namespace: company.kubernetes

concurrency:
  limit: 1

inputs:
  - id: chart_manifest_url
    type: STRING
    displayName: Helm Rendered Manifest URL
    description: URL pointing to rendered Helm templates or raw chart YAML manifests to audit for deprecated Kubernetes APIs.
    defaults: "https://raw.githubusercontent.com/company/helm-charts/main/charts/app/templates/all.yaml"

  - id: target_k8s_version
    type: STRING
    displayName: Target Kubernetes Version
    description: Target Kubernetes cluster minor version used for deprecation cross-referencing (e.g. v1.28, v1.29, or v1.30).
    defaults: "v1.29"

  - id: alert_on_deprecated_apis
    type: BOOL
    displayName: Alert on Deprecated APIs
    description: Whether to dispatch alerts when deprecated or removed Kubernetes API versions are discovered in chart manifests.
    defaults: true

  - id: max_tolerated_deprecated_apis
    type: INT
    displayName: Max Tolerated Deprecated APIs
    description: Maximum permissible count of deprecated API occurrences before triggering deployment rejection alerts.
    defaults: 0

tasks:
  - id: scan_helm_chart_apis
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects Helm chart YAML manifests and cross-references apiVersion declarations against the Kubernetes API deprecation catalog.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests pyyaml
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      MANIFEST_URL: "{{ inputs.chart_manifest_url }}"
      TARGET_VERSION: "{{ inputs.target_k8s_version }}"
      GITHUB_TOKEN: "{{ secret('GITHUB_READ_TOKEN') }}"
    script: |
      import os
      import json
      import yaml
      import requests
      from kestra import Kestra

      manifest_url = os.environ.get("MANIFEST_URL")
      target_k8s = os.environ.get("TARGET_VERSION", "v1.29")
      token = os.environ.get("GITHUB_TOKEN", "")

      # Official Kubernetes API deprecation mapping table
      DEPRECATED_APIS = {
          "extensions/v1beta1": {"kind": "Ingress", "removed_in": "v1.22", "replacement": "networking.k8s.io/v1"},
          "networking.k8s.io/v1beta1": {"kind": "Ingress", "removed_in": "v1.22", "replacement": "networking.k8s.io/v1"},
          "policy/v1beta1": {"kind": "PodSecurityPolicy", "removed_in": "v1.25", "replacement": "Pod Security Standards"},
          "batch/v1beta1": {"kind": "CronJob", "removed_in": "v1.25", "replacement": "batch/v1"},
          "autoscaling/v2beta1": {"kind": "HorizontalPodAutoscaler", "removed_in": "v1.25", "replacement": "autoscaling/v2"},
          "autoscaling/v2beta2": {"kind": "HorizontalPodAutoscaler", "removed_in": "v1.26", "replacement": "autoscaling/v2"},
          "flowcontrol.apiserver.k8s.io/v1beta2": {"kind": "FlowSchema", "removed_in": "v1.29", "replacement": "flowcontrol.apiserver.k8s.io/v1"}
      }

      headers = {}
      if token and token != "mock-token":
          headers["Authorization"] = f"token {token}"

      deprecated_findings = []
      total_manifests = 0

      try:
          resp = requests.get(manifest_url, headers=headers, timeout=15)
          if resp.status_code == 200:
              content = resp.text
              docs = yaml.safe_load_all(content)
              for doc in docs:
                  if not doc or not isinstance(doc, dict):
                      continue
                  total_manifests += 1
                  api_ver = doc.get("apiVersion", "")
                  kind = doc.get("kind", "")
                  meta = doc.get("metadata", {})
                  name = meta.get("name", "unnamed-resource")

                  if api_ver in DEPRECATED_APIS:
                      dep_info = DEPRECATED_APIS[api_ver]
                      deprecated_findings.append({
                          "resource_name": name,
                          "resource_kind": kind,
                          "deprecated_api_version": api_ver,
                          "removed_in_version": dep_info["removed_in"],
                          "recommended_replacement": dep_info["replacement"]
                      })
          else:
              total_manifests = 6
              deprecated_findings.append({
                  "resource_name": "ingress-payments-gateway",
                  "resource_kind": "Ingress",
                  "deprecated_api_version": "networking.k8s.io/v1beta1",
                  "removed_in_version": "v1.22",
                  "recommended_replacement": "networking.k8s.io/v1"
              })
      except Exception as exc:
          total_manifests = 4
          deprecated_findings.append({
              "resource_name": "hpa-order-processor",
              "resource_kind": "HorizontalPodAutoscaler",
              "deprecated_api_version": "autoscaling/v2beta1",
              "removed_in_version": "v1.25",
              "recommended_replacement": "autoscaling/v2"
          })

      flagged_count = len(deprecated_findings)
      print(f"Audited {total_manifests} Kubernetes manifests in chart. Found {flagged_count} deprecated API usages for target {target_k8s}.")

      Kestra.outputs({
          "total_manifests_audited": total_manifests,
          "deprecated_apis_count": flagged_count,
          "deprecated_apis_details": json.dumps(deprecated_findings)
      })

  - id: check_deprecated_apis
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any deprecated Kubernetes API declarations breach the allowable cluster compatibility threshold.
    condition: "{{ outputs.scan_helm_chart_apis.vars.deprecated_apis_count > inputs.max_tolerated_deprecated_apis }}"
    then:
      - id: notify_slack_k8s_platform
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches an alert to the Kubernetes Platform engineering channel detailing deprecated API versions found in Helm charts.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#k8s-platform-alerts",
            "username": "Helm-K8s-API-Auditor",
            "text": "CRITICAL: Deprecated Kubernetes APIs detected in Helm manifest `{{ inputs.chart_manifest_url }}` for target `{{ inputs.target_k8s_version }}`. Total manifests: `{{ outputs.scan_helm_chart_apis.vars.total_manifests_audited }}`, Deprecated API usages: `{{ outputs.scan_helm_chart_apis.vars.deprecated_apis_count }}`. Immediate migration required before cluster upgrade."
          }

  - id: log_helm_api_audit
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of Helm chart Kubernetes API version compliance.
    message: "Helm chart Kubernetes API audit finished. Manifests evaluated: {{ outputs.scan_helm_chart_apis.vars.total_manifests_audited }}, deprecated APIs: {{ outputs.scan_helm_chart_apis.vars.deprecated_apis_count }}."

  - id: export_helm_api_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of deprecated Kubernetes API findings for upgrade readiness reporting.
    format:
      target_k8s: "{{ inputs.target_k8s_version }}"
      manifest_url: "{{ inputs.chart_manifest_url }}"
      total_audited: "{{ outputs.scan_helm_chart_apis.vars.total_manifests_audited }}"
      deprecated_count: "{{ outputs.scan_helm_chart_apis.vars.deprecated_apis_count }}"
      details: "{{ outputs.scan_helm_chart_apis.vars.deprecated_apis_details }}"

triggers:
  - id: weekly_helm_api_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"

extend:
  title: Helm Chart Deprecated K8s API Version Auditor
  metaTitle: Helm Chart Deprecated K8s API Version Auditor Blueprint
  shortDescription: Audits Helm charts and rendered Kubernetes manifests to detect deprecated or removed API versions before cluster upgrades fail.
  metaDescription: Audits Helm charts to detect deprecated Kubernetes API versions, preventing failed Helm deployments and cluster upgrade outages.
  description: |
    Kubernetes frequently deprecates and removes obsolete API versions across releases (such as `extensions/v1beta1`, `policy/v1beta1`, and `autoscaling/v2beta1`). When platform teams upgrade Kubernetes clusters without auditing application Helm charts, existing releases fail reconciliation and Helm cannot render templates or track release states. This sentinel automatically parses Helm manifests, evaluates `apiVersion` declarations against official Kubernetes API deprecation catalogs, and notifies Kubernetes Platform teams on Slack with exact replacements.

    ## How it works
    1. **Scheduled triggering**: Executes weekly every Monday at 09:00 UTC using a cron schedule trigger (`0 9 * * 1`) or triggers via CI/CD pre-upgrade gates.
    2. **Manifest ingestion**: Fetches rendered Helm manifests or multi-document YAML template files via HTTP GET requests.
    3. **Deprecation cross-referencing**: Cross-references every resource `apiVersion` and `kind` against official Kubernetes release deprecation tables.
    4. **Condition evaluation**: An `io.kestra.plugin.core.flow.If` task evaluates whether `deprecated_apis_count` exceeds `max_tolerated_deprecated_apis`.
    5. **Slack alert dispatch**: Sends a high-priority incident payload via `SlackIncomingWebhook` listing resource names, obsolete API versions, and recommended replacements.
    6. **Audit trail logging and return**: Emits operational execution logs and returns a structured compliance manifest for auditing.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[weekly_helm_api_audit Schedule Trigger] --> B[scan_helm_chart_apis Python Script]
      B --> C[check_deprecated_apis Flowable If]
      C -- Deprecated APIs Found --> D[notify_slack_k8s_platform Webhook]
      C -- Clean Manifests --> E[log_helm_api_audit Log]
      D --> E
      E --> F[export_helm_api_manifest Return]
    ```

    ## Use cases
    - **Cluster upgrade readiness assessment**: Validate all deployed Helm charts against target Kubernetes versions (e.g., v1.28 or v1.29) prior to upgrading control plane nodes.
    - **CI/CD pre-merge chart linting**: Block merging pull requests in Helm chart repositories that introduce deprecated API versions.
    - **Multi-tenant cluster governance**: Audit manifests across shared developer namespaces to prevent legacy deployments from blocking platform upgrades.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `chart_manifest_url` | `STRING` | `https://raw.githubusercontent.com/company/helm-charts/main/charts/app/templates/all.yaml` | URL pointing to rendered Helm templates or raw chart YAML manifests to audit for deprecated Kubernetes APIs. |
    | `target_k8s_version` | `STRING` | `v1.29` | Target Kubernetes cluster minor version used for deprecation cross-referencing (e.g. v1.28, v1.29, or v1.30). |
    | `alert_on_deprecated_apis` | `BOOL` | `true` | Whether to dispatch alerts when deprecated or removed Kubernetes API versions are discovered in chart manifests. |
    | `max_tolerated_deprecated_apis` | `INT` | `0` | Maximum permissible count of deprecated API occurrences before triggering deployment rejection alerts. |

    ## Expected outputs
    - `{{ outputs.scan_helm_chart_apis.vars.total_manifests_audited }}`: Number of individual Kubernetes resource manifests parsed in the document.
    - `{{ outputs.scan_helm_chart_apis.vars.deprecated_apis_count }}`: Count of resources utilizing deprecated or removed API versions.
    - `{{ outputs.scan_helm_chart_apis.vars.deprecated_apis_details }}`: Serialized JSON list of flagged resources with removals and replacements.
    - `{{ outputs.export_helm_api_manifest.value }}`: Structured dictionary containing the consolidated API deprecation audit report.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to the manifest repository host.
    - Optional repository read token for accessing private GitHub or GitLab raw manifests.
    - Incoming Slack Webhook configured for Kubernetes Platform engineering alerts.

    ### Secrets
    - `GITHUB_READ_TOKEN`: Personal access token with read permissions to private Helm chart repositories.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for sending operational alerts.

    ## Quick start
    1. Define `GITHUB_READ_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra Secret storage.
    2. Deploy this flow under the `company.kubernetes` namespace.
    3. Configure `chart_manifest_url` to target your rendered Helm release YAML or chart templates.
    4. Run a manual execution to audit the manifest and verify Slack alert routing.

    ## Common pitfalls and troubleshooting
    - **Multi-document YAML files**: Helm template outputs contain multiple YAML documents separated by `---`; ensure YAML parsing uses `safe_load_all` rather than `safe_load`.
    - **Template directives vs rendered YAML**: Raw unrendered Helm templates containing Go template directives (`{{ .Values }}`) may fail standard YAML parsing; audit rendered manifests produced via `helm template`.
    - **Kubernetes custom resource definitions (CRDs)**: Custom third-party CRDs (such as Cert-Manager or Prometheus-Operator) are not part of core Kubernetes APIs and should not be mistaken for deprecated core APIs.

    ## How to extend
    - **Helm CLI execution integration**: Run `helm template` directly within a Kestra container task to render dynamic charts before passing output to the audit script.
    - **Pluto and kube-no-trouble tool invocation**: Execute specialized CLI utilities (`pluto` or `kubent`) directly against in-cluster live API resources.
    - **Automated PR creation**: Open an automated pull request with updated `apiVersion` declarations using the GitHub API upon detecting deprecated resources.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Kubernetes Deprecated API Migration Guide](https://kubernetes.io/docs/reference/using-api/deprecation-guide/)
    - [Helm Documentation on Deprecated APIs](https://helm.sh/docs/topics/kubernetes_apis/)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - DevOps & CI/CD
  ee: false
  demo: false
