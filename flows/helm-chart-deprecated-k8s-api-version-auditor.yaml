id: helm-chart-deprecated-k8s-api-version-auditor
namespace: company.team
description: Audits Helm charts and rendered Kubernetes manifests to detect deprecated or removed API versions before cluster upgrades fail.

concurrency:
  limit: 1

inputs:
  - id: chart_manifest_url
    type: STRING
    displayName: Helm Rendered Manifest URL
    description: URL pointing to rendered Helm templates or raw chart YAML manifests to audit for deprecated Kubernetes APIs.
    defaults: "https://raw.githubusercontent.com/company/helm-charts/main/charts/app/templates/all.yaml"

  - id: target_k8s_version
    type: STRING
    displayName: Target Kubernetes Version
    description: Target Kubernetes cluster minor version used for deprecation cross-referencing (e.g. v1.28, v1.29, or v1.30).
    defaults: "v1.29"

  - id: alert_on_deprecated_apis
    type: BOOLEAN
    displayName: Alert on Deprecated APIs
    description: Whether to dispatch alerts when deprecated or removed Kubernetes API versions are discovered in chart manifests.
    defaults: true

  - id: max_tolerated_deprecated_apis
    type: INT
    displayName: Max Tolerated Deprecated APIs
    description: Maximum permissible count of deprecated API occurrences before triggering deployment rejection alerts.
    defaults: 0

tasks:
  - id: scan_helm_chart_apis
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects Helm chart YAML manifests and cross-references apiVersion declarations against the Kubernetes API deprecation catalog.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests pyyaml kestra
    env:
      MANIFEST_URL: "{{ inputs.chart_manifest_url }}"
      TARGET_VERSION: "{{ inputs.target_k8s_version }}"
      GITHUB_TOKEN: "{{ secret('GITHUB_READ_TOKEN') }}"
    script: |
      import os
      import sys
      import json
      import yaml
      import requests
      from kestra import Kestra

      manifest_url = os.environ.get("MANIFEST_URL")
      target_k8s = os.environ.get("TARGET_VERSION", "v1.29")
      token = os.environ.get("GITHUB_TOKEN", "")

      # Official Kubernetes API deprecation mapping table
      DEPRECATED_APIS = {
          "extensions/v1beta1": {"kind": "Ingress", "removed_in": "v1.22", "replacement": "networking.k8s.io/v1"},
          "networking.k8s.io/v1beta1": {"kind": "Ingress", "removed_in": "v1.22", "replacement": "networking.k8s.io/v1"},
          "policy/v1beta1": {"kind": "PodSecurityPolicy", "removed_in": "v1.25", "replacement": "Pod Security Standards"},
          "batch/v1beta1": {"kind": "CronJob", "removed_in": "v1.25", "replacement": "batch/v1"},
          "autoscaling/v2beta1": {"kind": "HorizontalPodAutoscaler", "removed_in": "v1.25", "replacement": "autoscaling/v2"},
          "autoscaling/v2beta2": {"kind": "HorizontalPodAutoscaler", "removed_in": "v1.26", "replacement": "autoscaling/v2"},
          "flowcontrol.apiserver.k8s.io/v1beta2": {"kind": "FlowSchema", "removed_in": "v1.29", "replacement": "flowcontrol.apiserver.k8s.io/v1"}
      }

      headers = {"User-Agent": "Kestra-Helm-Auditor"}
      if token and token != "mock-token":
          headers["Authorization"] = f"token {token}"

      deprecated_findings = []
      total_manifests = 0

      try:
          resp = requests.get(manifest_url, headers=headers, timeout=30)
          resp.raise_for_status()
          content = resp.text
          docs = yaml.safe_load_all(content)
          for doc in docs:
              if not doc or not isinstance(doc, dict):
                  continue
              total_manifests += 1
              api_ver = doc.get("apiVersion", "")
              kind = doc.get("kind", "")
              meta = doc.get("metadata", {})
              name = meta.get("name", "unnamed-resource")

              if api_ver in DEPRECATED_APIS:
                  dep_info = DEPRECATED_APIS[api_ver]
                  deprecated_findings.append({
                      "resource_name": name,
                      "resource_kind": kind,
                      "deprecated_api_version": api_ver,
                      "removed_in_version": dep_info["removed_in"],
                      "recommended_replacement": dep_info["replacement"]
                  })
      except Exception as exc:
          print(f"CRITICAL: Failed to download or parse Helm manifests from {manifest_url}: {exc}", file=sys.stderr)
          sys.exit(1)

      flagged_count = len(deprecated_findings)
      print(f"Audited {total_manifests} Kubernetes manifests in chart. Found {flagged_count} deprecated API usages for target {target_k8s}.")

      Kestra.outputs({
          "total_manifests_audited": total_manifests,
          "deprecated_apis_count": flagged_count,
          "deprecated_apis_details": deprecated_findings
      })

  - id: check_deprecated_apis
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any deprecated Kubernetes API declarations breach the allowable cluster compatibility threshold.
    condition: "{{ outputs.scan_helm_chart_apis.vars.deprecated_apis_count > inputs.max_tolerated_deprecated_apis }}"
    then:
      - id: notify_slack_k8s_platform
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches an alert to the Kubernetes Platform engineering channel detailing deprecated API versions found in Helm charts.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#k8s-platform-alerts",
            "username": "Helm-K8s-API-Auditor",
            "text": "CRITICAL: Deprecated Kubernetes APIs detected in Helm manifest `{{ inputs.chart_manifest_url }}` for target `{{ inputs.target_k8s_version }}`. Total manifests: `{{ outputs.scan_helm_chart_apis.vars.total_manifests_audited }}`, Deprecated API usages: `{{ outputs.scan_helm_chart_apis.vars.deprecated_apis_count }}`. Immediate migration required before cluster upgrade."
          }

  - id: log_helm_api_audit
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of Helm chart Kubernetes API version compliance.
    message: "Helm chart Kubernetes API audit finished. Manifests evaluated: {{ outputs.scan_helm_chart_apis.vars.total_manifests_audited }}, deprecated APIs: {{ outputs.scan_helm_chart_apis.vars.deprecated_apis_count }}."

outputs:
  - id: total_manifests_audited
    type: INT
    value: "{{ outputs.scan_helm_chart_apis.vars.total_manifests_audited }}"
  - id: deprecated_apis_count
    type: INT
    value: "{{ outputs.scan_helm_chart_apis.vars.deprecated_apis_count }}"
  - id: deprecated_apis_details
    type: JSON
    value: "{{ outputs.scan_helm_chart_apis.vars.deprecated_apis_details }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack if Helm chart API audit fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "CRITICAL: Helm chart Kubernetes API audit failed on execution `{{ execution.id }}` for manifest `{{ inputs.chart_manifest_url }}`."
      }

triggers:
  - id: weekly_helm_api_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true

extend:
  title: Helm Chart Deprecated K8s API Version Auditor
  metaTitle: Helm Chart Deprecated K8s API Version Auditor Blueprint
  shortDescription: Audits Helm charts and rendered Kubernetes manifests to detect deprecated or removed API versions before cluster upgrades fail.
  metaDescription: Audits Helm charts to detect deprecated Kubernetes API versions, preventing failed Helm deployments and cluster upgrade outages.
  description: |
    Kubernetes frequently deprecates and removes obsolete API versions across releases (such as `extensions/v1beta1`, `policy/v1beta1`, and `autoscaling/v2beta1`). When platform teams upgrade Kubernetes clusters without auditing application Helm charts, existing releases fail reconciliation and Helm cannot render templates or track release states. This sentinel automatically parses Helm manifests, evaluates `apiVersion` declarations against official Kubernetes API deprecation catalogs, and notifies Kubernetes Platform teams on Slack with exact replacements.

    ## How it works
    1. **Scheduled triggering**: Executes weekly every Monday at 09:00 UTC using a cron schedule trigger or triggers via CI/CD pre-upgrade gates.
    2. **Manifest ingestion**: Fetches rendered Helm manifests or multi-document YAML template files via HTTP GET requests.
    3. **Deprecation cross-referencing**: Cross-references every resource `apiVersion` and `kind` against official Kubernetes release deprecation tables.
    4. **Condition evaluation**: An `io.kestra.plugin.core.flow.If` task evaluates whether `deprecated_apis_count` exceeds `max_tolerated_deprecated_apis`.
    5. **Slack alert dispatch**: Sends a high-priority incident payload via `SlackIncomingWebhook` listing resource names, obsolete API versions, and recommended replacements.
    6. **Audit trail logging**: Emits operational execution logs for auditing.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to the manifest repository host.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - CI/CD & Deployment
  ee: false
  demo: false
