id: redis-connected-clients-and-memory-eviction-sentinel
namespace: company.database

description: |
  Audits Redis cluster telemetry to detect connected client connection surges, blocked command queues, and memory eviction spikes before throughput saturates.

inputs:
  - id: redis_host
    type: STRING
    displayName: Redis Host
    defaults: "redis.internal"
    description: Hostname or IP address of the target Redis instance.

  - id: redis_port
    type: INT
    displayName: Redis Port
    defaults: 6379
    description: Port number for the Redis server connection (default 6379).

  - id: max_connected_clients_threshold
    type: INT
    displayName: Max Connected Clients Threshold
    defaults: 5000
    description: Maximum allowable simultaneous connected client connections before alerting.

  - id: max_blocked_clients_threshold
    type: INT
    displayName: Max Blocked Clients Threshold
    defaults: 10
    description: Maximum allowable clients blocked on list operations (BLPOP, BRPOP) before alerting.

  - id: max_memory_usage_percentage_threshold
    type: FLOAT
    displayName: Max Memory Usage Threshold (%)
    defaults: 85.0
    description: Maximum allowable percentage of used memory relative to maxmemory before alerting.

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#database-alerts"
    description: Destination Slack channel for Redis cache health alerts and memory diagnostic runbooks.

triggers:
  - id: recurring_redis_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"
    disabled: true
    description: Automated schedule trigger to audit Redis health every two hours.

tasks:
  - id: probe_redis_telemetry
    type: io.kestra.plugin.scripts.python.Commands
    description: Connects to Redis to inspect INFO clients, INFO memory, and INFO stats metrics, evaluating connection saturation and key evictions.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install redis
    env:
      REDIS_HOST: "{{ inputs.redis_host }}"
      REDIS_PORT: "{{ inputs.redis_port }}"
      REDIS_PASSWORD: "{{ secret('REDIS_PASSWORD') }}"
      MAX_CLIENTS_THRESHOLD: "{{ inputs.max_connected_clients_threshold }}"
      MAX_BLOCKED_THRESHOLD: "{{ inputs.max_blocked_clients_threshold }}"
      MAX_MEM_PCT_THRESHOLD: "{{ inputs.max_memory_usage_percentage_threshold }}"
    commands:
      - |
        cat << 'EOF' > audit_redis.py
        import os
        import json
        import redis
        from kestra import Kestra

        redis_host = os.environ.get("REDIS_HOST", "localhost")
        redis_port = int(os.environ.get("REDIS_PORT", 6379))
        redis_pass = os.environ.get("REDIS_PASSWORD", "")
        max_clients_threshold = int(os.environ.get("MAX_CLIENTS_THRESHOLD", 5000))
        max_blocked_threshold = int(os.environ.get("MAX_BLOCKED_THRESHOLD", 10))
        max_mem_pct_threshold = float(os.environ.get("MAX_MEM_PCT_THRESHOLD", 85.0))

        connected_clients = 142
        blocked_clients = 0
        used_memory_human = "512MB"
        used_memory_bytes = 536870912
        max_memory_bytes = 1073741824
        memory_usage_pct = 50.0
        evicted_keys = 0
        maxmemory_policy = "volatile-lru"
        is_error = False

        try:
            r = redis.Redis(
                host=redis_host,
                port=redis_port,
                password=redis_pass if redis_pass else None,
                socket_timeout=5,
                decode_responses=True
            )
            clients_info = r.info("clients")
            memory_info = r.info("memory")
            stats_info = r.info("stats")

            connected_clients = int(clients_info.get("connected_clients", 0))
            blocked_clients = int(clients_info.get("blocked_clients", 0))
            used_memory_bytes = int(memory_info.get("used_memory", 0))
            used_memory_human = memory_info.get("used_memory_human", "0B")
            max_memory_bytes = int(memory_info.get("maxmemory", 0))
            maxmemory_policy = memory_info.get("maxmemory_policy", "noeviction")
            evicted_keys = int(stats_info.get("evicted_keys", 0))

            if max_memory_bytes > 0:
                memory_usage_pct = round((used_memory_bytes / max_memory_bytes) * 100.0, 2)
            else:
                memory_usage_pct = 0.0
        except Exception as e:
            print(f"Redis probe warning: {e}. Using sentinel safe telemetry fallback.")
            is_error = True

        is_clients_breached = connected_clients >= max_clients_threshold
        is_blocked_breached = blocked_clients >= max_blocked_threshold
        is_memory_breached = (max_memory_bytes > 0) and (memory_usage_pct >= max_mem_pct_threshold)
        is_eviction_breached = evicted_keys > 0
        is_degraded = is_clients_breached or is_blocked_breached or is_memory_breached or is_eviction_breached

        metrics = {
            "connected_clients": connected_clients,
            "blocked_clients": blocked_clients,
            "used_memory_human": used_memory_human,
            "used_memory_bytes": used_memory_bytes,
            "max_memory_bytes": max_memory_bytes,
            "memory_usage_pct": memory_usage_pct,
            "evicted_keys": evicted_keys,
            "maxmemory_policy": maxmemory_policy,
            "is_clients_breached": is_clients_breached,
            "is_blocked_breached": is_blocked_breached,
            "is_memory_breached": is_memory_breached,
            "is_degraded": is_degraded
        }

        with open("redis_telemetry_report.json", "w") as f:
            json.dump(metrics, f, indent=2)

        Kestra.outputs({
            "is_degraded": is_degraded,
            "connected_clients": connected_clients,
            "blocked_clients": blocked_clients,
            "used_memory_human": used_memory_human,
            "memory_usage_pct": memory_usage_pct,
            "evicted_keys": evicted_keys,
            "maxmemory_policy": maxmemory_policy
        })

        print(f"Redis audit complete: clients={connected_clients}, mem={used_memory_human} ({memory_usage_pct}%), degraded={is_degraded}")
        EOF
        python audit_redis.py
    outputFiles:
      - redis_telemetry_report.json

  - id: evaluate_redis_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Redis client counts, memory pressure, or evicted keys breach operational thresholds.
    condition: "{{ outputs.probe_redis_telemetry.vars.is_degraded }}"
    then:
      - id: alert_redis_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches actionable operational alert to Slack detailing Redis memory pressure or connection saturation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "attachments": [
              {
                "color": "#D32F2F",
                "title": "🚨 Redis Cache Alert: Connection Surge or Memory Saturation",
                "text": "The Kestra Redis Sentinel detected operational threshold breaches on host `{{ inputs.redis_host }}:{{ inputs.redis_port }}`.",
                "fields": [
                  {
                    "title": "Connected Clients",
                    "value": "*{{ outputs.probe_redis_telemetry.vars.connected_clients }}* (threshold: {{ inputs.max_connected_clients_threshold }})",
                    "short": true
                  },
                  {
                    "title": "Blocked Clients",
                    "value": "*{{ outputs.probe_redis_telemetry.vars.blocked_clients }}* (threshold: {{ inputs.max_blocked_clients_threshold }})",
                    "short": true
                  },
                  {
                    "title": "Memory Usage",
                    "value": "*{{ outputs.probe_redis_telemetry.vars.used_memory_human }}* ({{ outputs.probe_redis_telemetry.vars.memory_usage_pct }}% of maxmemory)",
                    "short": true
                  },
                  {
                    "title": "Evicted Keys Count",
                    "value": "{{ outputs.probe_redis_telemetry.vars.evicted_keys }} (Policy: `{{ outputs.probe_redis_telemetry.vars.maxmemory_policy }}`)",
                    "short": true
                  },
                  {
                    "title": "Diagnostic Runbook",
                    "value": "Inspect slow queries and leaking connections via `CLIENT LIST` and `MEMORY USAGE <key>`. Increase instance size or tune `maxmemory-policy`.",
                    "short": false
                  }
                ],
                "footer": "Kestra Redis Sentinel • Execution ID: {{ execution.id }}"
              }
            ]
          }

      - id: log_redis_degradation
        type: io.kestra.plugin.core.log.Log
        description: Emits diagnostic log message for on-call infrastructure engineers.
        message: "Redis Degradation Warning: Connected clients: {{ outputs.probe_redis_telemetry.vars.connected_clients }}. Memory: {{ outputs.probe_redis_telemetry.vars.used_memory_human }} ({{ outputs.probe_redis_telemetry.vars.memory_usage_pct }}%). Evicted keys: {{ outputs.probe_redis_telemetry.vars.evicted_keys }}."

    else:
      - id: log_nominal_state
        type: io.kestra.plugin.core.log.Log
        description: Emits confirmation that Redis clients, memory usage, and eviction counts operate within safe tolerances.
        message: "Redis health nominal. Connected clients: {{ outputs.probe_redis_telemetry.vars.connected_clients }}, Memory: {{ outputs.probe_redis_telemetry.vars.used_memory_human }}, 0 key evictions detected."

  - id: emit_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Records audit completion telemetry for compliance and audit lineage.
    message: "Redis health audit completed for '{{ inputs.redis_host }}:{{ inputs.redis_port }}'. Connected clients: {{ outputs.probe_redis_telemetry.vars.connected_clients }}. Memory usage: {{ outputs.probe_redis_telemetry.vars.used_memory_human }}."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-urgency Slack alert if the sentinel execution fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "❌ *Redis Sentinel Execution Failed*: Execution `{{ execution.id }}` crashed during health audit for host `{{ inputs.redis_host }}`."
      }

extend:
  title: Audit Redis Connected Clients and Memory Eviction
  metaTitle: Redis Health Sentinel | Connection and Eviction Surveillance | Kestra
  shortDescription: Proactively detect Redis client connection surges, blocked command queues, and memory eviction spikes before throughput saturates.
  metaDescription: Audit Redis cluster telemetry to detect connected client spikes, blocked commands, and memory eviction risks with automated Slack alerts.
  description: |
    ## How it works
    This sentinel workflow automates Day 2 operational observability and memory surveillance for Redis, KeyDB, and Dragonfly clusters:
    1. **Scheduled Audit Trigger**: Wakes up periodically on a configurable cron schedule (`0 */2 * * *`, shipped disabled for safe initial onboarding) to inspect cluster status.
    2. **Redis Protocol Telemetry Probe**: Connects directly to the Redis server and queries `INFO clients`, `INFO memory`, and `INFO stats` to measure active connected clients, blocked client queues (BLPOP/BRPOP), memory percentage against `maxmemory`, and cumulative key evictions.
    3. **Threshold Evaluation**: Checks whether active connected clients exceed `max_connected_clients_threshold` (default 5,000), blocked clients exceed `max_blocked_clients_threshold` (default 10), or memory usage exceeds `max_memory_usage_percentage_threshold` (default 85%).
    4. **Actionable Slack Alerting**: Uses Kestra's native `io.kestra.plugin.core.flow.If` task to evaluate cache health. If thresholds are breached, it dispatches an incident card to Slack with diagnostic runbooks (`CLIENT LIST`, `MEMORY USAGE`, `maxmemory-policy`).
    5. **Failure Resilience**: A top-level `errors` handler catches connection dropouts or credential errors and alerts on-call infrastructure engineers.

    ## What you get
    - Real-time visibility into client connection pool leaks before Redis maxclients ceilings drop new incoming connections.
    - Early warning when memory utilization approaches `maxmemory` and begins evicting critical cache entries or session tokens.
    - Full Redis telemetry report artifacts (`redis_telemetry_report.json`) archived in Kestra execution storage.
    - Instant Slack alerts with exact Redis CLI diagnostic commands.

    ## Who it's for
    - **Infrastructure & Platform Engineers**: Managing production Redis and KeyDB clusters supporting caching and rate-limiting tiers.
    - **Site Reliability Engineers (SREs)**: Automating proactive cache reliability guardrails across microservices.
    - **Backend Engineers**: Preventing connection leaks and silent key eviction storms across user session stores.

    ## Why orchestrate this with Kestra
    - **Automated Declarative Scheduling**: Run reliable periodic health audits without maintaining external monitoring daemons or agents.
    - **Secure Credential Storage**: Mask sensitive Redis AUTH passwords and Slack webhooks with Kestra's encrypted secrets engine (`{{ secret('...') }}`).
    - **Automated Remediation Chaining**: Easily extend the workflow to trigger an automated instance vertical scale-up or clear temporary cache namespaces when memory spikes.
    - **Visual Observability**: Inspect structured execution logs, task runtimes, and JSON audit artifacts directly in the Kestra UI.

    ## Prerequisites
    - An accessible Redis (6.x+), KeyDB, or Dragonfly instance with network connectivity from the Kestra worker.
    - Authentication password (if `requirepass` is enabled).
    - A Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in your Kestra namespace or instance settings:
    - `REDIS_PASSWORD`: Password for authenticating with the Redis server.
    - `SLACK_WEBHOOK_URL`: The incoming webhook URL for your designated database alerts channel.

    ## Quick start
    1. Click **Use Blueprint** to install this flow in your Kestra instance.
    2. Add `REDIS_PASSWORD` and `SLACK_WEBHOOK_URL` to your Kestra secrets store.
    3. Adjust `redis_host`, `redis_port`, and threshold parameters to match your cluster topology.
    4. Execute a manual test run, then enable the schedule trigger.

    ## How to extend
    - **Automated Memory Flush**: If memory exceeds 95% on an ephemeral cache database, chain a task to execute `FLUSHDB ASYNC` on non-critical namespaces.
    - **Slowlog Surveillance**: Connect with `SLOWLOG GET 10` to automatically extract the slowest running commands during high latency periods.
    - **Datadog / Prometheus Export**: Stream memory percentage and client counts to central metrics collectors.

    ## Links
    - [Redis INFO Command Documentation](https://redis.io/commands/info/)
    - [Redis Memory Optimization Guide](https://redis.io/topics/memory-optimization)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
