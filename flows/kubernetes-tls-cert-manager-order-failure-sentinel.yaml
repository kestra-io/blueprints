id: kubernetes-tls-cert-manager-order-failure-sentinel
namespace: company.sre

inputs:
  - id: kube_context
    type: STRING
    required: false
    description: Optional Kubernetes context name.
  - id: failure_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of failed cert-manager ACME orders or non-ready certificates.

tasks:
  - id: audit_cert_manager_status
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: bitnami/kubectl:latest
    commands:
      - |
        CONTEXT_ARG=""
        if [ -n "{{ inputs.kube_context }}" ]; then
          CONTEXT_ARG="--context={{ inputs.kube_context }}"
        fi
        
        kubectl $CONTEXT_ARG get certificates.cert-manager.io -A -o json > /tmp/certs.json 2>/dev/null || echo '{"items":[]}' > /tmp/certs.json
        kubectl $CONTEXT_ARG get orders.acme.cert-manager.io -A -o json > /tmp/orders.json 2>/dev/null || echo '{"items":[]}' > /tmp/orders.json
        
        FAILED_ORDERS=$(jq '[.items[] | select(.status.state == "errored" or .status.state == "invalid")] | length' /tmp/orders.json)
        UNREADY_CERTS=$(jq '[.items[] | select(.status.conditions[]? | select(.type == "Ready" and .status != "True"))] | length' /tmp/certs.json)
        TOTAL_FAILURES=$((FAILED_ORDERS + UNREADY_CERTS))
        
        DETAILS=$(jq -n --slurpfile certs /tmp/certs.json --slurpfile orders /tmp/orders.json           '{failed_orders: [$orders[0].items[] | select(.status.state == "errored" or .status.state == "invalid") | {namespace: .metadata.namespace, name: .metadata.name, reason: .status.reason}], unready_certificates: [$certs[0].items[] | select(.status.conditions[]? | select(.type == "Ready" and .status != "True")) | {namespace: .metadata.namespace, name: .metadata.name}]}')
        
        echo "::set-output name=total_failures::$TOTAL_FAILURES::"
        echo "::set-output name=failure_details::$DETAILS::"

  - id: evaluate_cert_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_cert_manager_status.vars.total_failures | int > inputs.failure_threshold }}"
    then:
      - id: notify_security_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#sec-ops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 cert-manager ACME Certificate Issuance Failure Alert",
                "text": "Detected *{{ outputs.audit_cert_manager_status.vars.total_failures }}* failed ACME order(s) or non-ready certificate(s). Failure details: {{ outputs.audit_cert_manager_status.vars.failure_details }}. Impact: Ingress endpoints risk serving expired or self-signed TLS certificates to public clients.",
                "footer": "Kestra SRE Orchestrator • cert-manager Sentinel"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#sec-ops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ cert-manager Sentinel Execution Error",
            "text": "The cert-manager certificate audit workflow encountered an execution failure. Please verify CRD accessibility and cluster credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Kubernetes cert-manager certificates and ACME orders to detect certificate issuance failures before domain TLS expiration."
  metaTitle: Kubernetes cert-manager ACME Order Failure and Ingress TLS Sentinel with Kestra
  title: Kubernetes cert-manager ACME Order Failure and Ingress TLS Sentinel
  shortDescription: Audits Kubernetes cert-manager certificates and ACME orders to detect certificate issuance failures before domain TLS expiration.
  description: |
    ## How it works
    This workflow queries `cert-manager.io` Custom Resource Definitions (`certificates` and `orders`) across all cluster namespaces using `kubectl`. It checks for ACME orders stuck in `errored` or `invalid` states, as well as certificates where the `Ready` condition is not `True`. If failures exceed the specified threshold, an immediate incident alert is pushed to Slack with relevant namespaces and failure reasons.

    ## What you get
    - Real-time detection of Let's Encrypt / ACME challenge failures (DNS-01, HTTP-01).
    - Prevents catastrophic ingress certificate expiration outages.
    - Consolidated failure reporting across multi-tenant cluster namespaces.

    ## Who it's for
    - Security Engineers and SREs managing automated public TLS certificates across Kubernetes ingresses.
    - DevOps teams maintaining microservices exposed over HTTPS.

    ## Why orchestrate this with Kestra
    - **Proactive Remediation**: Catch failed renewal attempts 30 days prior to certificate expiration instead of discovering browser security warnings in production.
    - **Robust Error Handling**: Dedicated execution guards catch API outages or missing CRDs cleanly.
    - **Zero Infrastructure Footprint**: Executes cleanly inside lightweight Kubernetes runner containers.

    ## Prerequisites
    - cert-manager installed in the cluster with `certificates.cert-manager.io` and `orders.acme.cert-manager.io` CRDs.
    - Cluster credentials with read access to cert-manager CRDs.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Provide your `SLACK_WEBHOOK` secret.
    3. Run the workflow to verify certificate health across all ingress controllers.

    ## How to extend
    - Trigger an automated cert-manager pod restart or re-issue annotation upon prolonged challenge failures.
    - Integrate with DNS provider monitoring to correlate DNS-01 API rate limits.

    ## Links
    - [cert-manager ACME Orders Documentation](https://cert-manager.io/docs/concepts/order/)
    - [Kestra Kubernetes Plugins](https://kestra.io/plugins/plugin-kubernetes)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Kubernetes Operations
    - Day 2 Operations
  ee: false
  demo: false
