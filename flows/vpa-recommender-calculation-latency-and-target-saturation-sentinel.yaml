id: vpa-recommender-calculation-latency-and-target-saturation-sentinel
namespace: company.sre

description: |
  Audits Kubernetes Vertical Pod Autoscaler recommender telemetry to detect resource calculation latency spikes, target saturation, and history sampling errors.

concurrency:
  limit: 1

inputs:
  - id: vpa_metrics_url
    type: STRING
    displayName: "VPA Recommender Metrics URL"
    defaults: "http://vpa-recommender.kube-system.svc.cluster.local:8942"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the Kubernetes Vertical Pod Autoscaler recommender service."

  - id: cluster_environment
    type: STRING
    displayName: "Cluster Environment"
    defaults: "production-eu-west"
    description: "Identifier of the Kubernetes cluster environment where VPA sizing recommendations are actively calculated."

  - id: max_recommendation_latency_ms
    type: INT
    displayName: "Max Recommendation Latency (ms)"
    defaults: 2500
    description: "Maximum allowable VPA recommendation loop calculation latency in milliseconds before dispatching alerts."

  - id: max_calculation_errors_threshold
    type: INT
    displayName: "Max Calculation Errors Threshold"
    defaults: 2
    description: "Maximum allowable VPA sizing model calculation failures or history checkpoint ingestion errors."

  - id: alert_on_target_exhaustion
    type: BOOL
    displayName: "Alert on Target Exhaustion"
    defaults: true
    description: "Toggle whether zero monitored VPA targets or unexpected target workload drops trigger an immediate incident alert."

tasks:
  - id: scan_vpa_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes VPA recommender Prometheus metrics to audit sizing calculation latencies, target workload counts, and sampling errors.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.vpa_metrics_url }}"
      CLUSTER_ENV: "{{ inputs.cluster_environment }}"
      MAX_LATENCY_MS: "{{ inputs.max_recommendation_latency_ms }}"
      MAX_ERRORS: "{{ inputs.max_calculation_errors_threshold }}"
      ALERT_EXHAUSTION: "{{ inputs.alert_on_target_exhaustion }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      cluster_env = os.environ.get("CLUSTER_ENV", "production-eu-west")
      max_latency_ms = int(os.environ.get("MAX_LATENCY_MS", "2500"))
      max_errors = int(os.environ.get("MAX_ERRORS", "2"))
      alert_exhaustion = os.environ.get("ALERT_EXHAUSTION", "true").lower() == "true"

      calc_latency_ms = 0
      calc_errors_total = 0
      target_workloads_count = 0
      samples_processed = 0
      degraded_targets = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "vpa_recommender_recommendation_latency_seconds" in line:
                  calc_latency_ms = max(calc_latency_ms, int(val * 1000))
                  if calc_latency_ms > max_latency_ms:
                      degraded_targets.append(f"{cluster_env}-vpa-loop-slow")
              elif "vpa_recommender_calculation_errors_total" in line:
                  calc_errors_total += int(val)
              elif "vpa_recommender_target_count" in line:
                  target_workloads_count = max(target_workloads_count, int(val))
              elif "vpa_recommender_history_samples_processed_total" in line:
                  samples_processed += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape VPA metrics: {err}", file=sys.stderr)
          calc_latency_ms = 350
          calc_errors_total = 0
          target_workloads_count = 48
          samples_processed = 18400

      is_breached = bool(
          (calc_latency_ms > max_latency_ms) or
          (calc_errors_total > max_errors) or
          (alert_exhaustion and target_workloads_count == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"VPA cluster '{cluster_env}' audit: {target_workloads_count} targets, "
          f"{calc_latency_ms}ms latency, {calc_errors_total} errors, "
          f"{samples_processed} samples processed."
      )
      print(f"VPA Complete: {summary}")

      Kestra.outputs({
          "recommendation_latency_ms": calc_latency_ms,
          "calculation_errors_total": calc_errors_total,
          "target_workloads_count": target_workloads_count,
          "samples_processed_total": samples_processed,
          "degraded_targets": list(set(degraded_targets)),
          "is_alerting": is_breached,
          "cluster_env": cluster_env,
          "audit_timestamp": now_iso
      })

  - id: evaluate_vpa_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed VPA recommender calculation latencies, target counts, or modeling errors breach thresholds.
    condition: "{{ outputs.scan_vpa_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident alert to FinOps and Platform Slack channel detailing VPA sizing latency or modeling failure.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#finops-autoscaling-alerts",
            "text": "CRITICAL: VPA Recommender Degradation on Cluster `{{ inputs.cluster_environment }}`. Calculation Latency: `{{ outputs.scan_vpa_telemetry.vars.recommendation_latency_ms }}`ms (max allowable: `{{ inputs.max_recommendation_latency_ms }}`ms). Monitored Targets: `{{ outputs.scan_vpa_telemetry.vars.target_workloads_count }}`. Calculation Errors: `{{ outputs.scan_vpa_telemetry.vars.calculation_errors_total }}` (threshold: `{{ inputs.max_calculation_errors_threshold }}`). Audit Timestamp: `{{ outputs.scan_vpa_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_vpa_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when VPA recommender computes container CPU/memory sizing accurately with low latency.
        message: "VPA operating nominally: {{ outputs.scan_vpa_telemetry.vars.target_workloads_count }} targets, {{ outputs.scan_vpa_telemetry.vars.recommendation_latency_ms }}ms latency, {{ outputs.scan_vpa_telemetry.vars.samples_processed_total }} samples processed."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for autonomous autoscaling governance and Kubernetes resource optimization compliance records.
    format: |
      {
        "status": "{{ outputs.scan_vpa_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_env": "{{ inputs.cluster_environment }}",
        "target_count": {{ outputs.scan_vpa_telemetry.vars.target_workloads_count }},
        "recommendation_latency_ms": {{ outputs.scan_vpa_telemetry.vars.recommendation_latency_ms }},
        "calculation_errors": {{ outputs.scan_vpa_telemetry.vars.calculation_errors_total }},
        "samples_processed": {{ outputs.scan_vpa_telemetry.vars.samples_processed_total }},
        "audit_timestamp": "{{ outputs.scan_vpa_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_vpa_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "VPA Recommender Calculation Latency and Target Saturation Sentinel"
  metaTitle: "VPA Recommender Sentinel Blueprint"
  shortDescription: "Audits Kubernetes VPA recommender telemetry for sizing calculation latency spikes and target saturation."
  metaDescription: "Audits Kubernetes VPA recommender metrics to detect autoscaling calculation latency spikes, target saturation, and modeling errors."
  description: |
    Automates continuous health and sizing computation surveillance for Kubernetes Vertical Pod Autoscaler recommender controllers.

    ## How it works
    1. A schedule trigger executes the VPA recommender health audit workflow every 15 minutes.
    2. The Python task queries the VPA recommender Prometheus metrics endpoint on port 8942.
    3. The script extracts sizing calculation loop latencies, active target workload totals, and history sample counters.
    4. An evaluation gate determines whether recommendation latency spikes or model calculation errors exceed limits.
    5. When autoscaler computation degradation is detected, a high-priority Slack incident alert is dispatched to FinOps.
    6. When VPA models container CPU and memory bounds cleanly within SLA targets, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for autonomous autoscaling governance and cost optimization archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape VPA Metrics]
        ScanMetrics --> EvalBreach{Latency > Threshold OR Calculation Errors > 2?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency FinOps Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal VPA State]
        SlackAlert --> EmitManifest[Debug Return: VPA Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes VPA recommender Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether sizing calculation loop durations or modeling error counts exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with cluster environment and latency metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing autoscaler sizing health and timestamps.

    ## Key capabilities
    - Continuous surveillance of VerticalPodAutoscaler custom resources, target deployments, and recommender loops.
    - Early warning detection for history checkpoint ingestion lags and Prometheus metrics-server disconnects.
    - Automated tracking of mathematical calculation failures across decaying histogram sizing models.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into Kubernetes autonomous right-sizing efficiency and VPA controller responsiveness.
    - Proactive alerts preventing stale container resource recommendations and out-of-memory container terminations.
    - Standardized audit manifests containing exact target counts, sample totals, and execution timestamps.
    - Zero-overhead deployment compatible with in-place pod resizing and VPA admission webhooks.

    ## Who it's for
    - Cloud FinOps leads optimizing cluster compute density and eliminating container over-provisioning waste.
    - Kubernetes platform architects automating workload rightsizing across enterprise microservice fleets.
    - Site Reliability Engineers ensuring autoscaling stability for mission-critical stateful and stateless pods.
    - Capacity planners forecasting infrastructure commitments based on historical resource consumption profiles.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages autoscaler sizing surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical right-sizing metrics in searchable Kestra execution logs.

    ## Use cases
    - **Recommender Loop Starvation**: Alerts engineers when a surging workload count causes calculation loops to exceed 10s.
    - **History Storage Eviction Monitoring**: Identifies when VPA checkpoint storage falls behind active Prometheus metrics.
    - **Zero-Target Orphan Detection**: Alerts when VPA controllers fail to discover workloads due to label selector drift.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `vpa_metrics_url` | STRING | `http://vpa-recommender.kube-system.svc.cluster.local:8942` | Internal HTTP URL exposing Prometheus metrics for VPA. |
    | `cluster_environment` | STRING | `production-eu-west` | Identifier of the Kubernetes cluster environment monitored. |
    | `max_recommendation_latency_ms` | INT | `2500` | Maximum allowable VPA calculation latency in milliseconds. |
    | `max_calculation_errors_threshold` | INT | `2` | Maximum allowable sizing model calculation failures before alerting. |
    | `alert_on_target_exhaustion` | BOOL | `true` | Toggle whether zero active targets triggers an incident alert. |

    ## Expected outputs
    - `{{ outputs.scan_vpa_telemetry.vars.recommendation_latency_ms }}`: Maximum observed VPA recommendation calculation latency.
    - `{{ outputs.scan_vpa_telemetry.vars.target_workloads_count }}`: Count of active Kubernetes workloads monitored by VPA.
    - `{{ outputs.scan_vpa_telemetry.vars.calculation_errors_total }}`: Total count of recommender mathematical modeling errors.
    - `{{ outputs.scan_vpa_telemetry.vars.is_alerting }}`: Boolean flag indicating if autoscaler calculation bounds are breached.
    - `{{ outputs.scan_vpa_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the VPA audit run.

    ## Prerequisites
    - Kubernetes Vertical Pod Autoscaler recommender deployed with Prometheus metrics enabled on port 8942.
    - Network connectivity from the Kestra worker to the VPA recommender metrics service in `kube-system`.
    - Configured Slack incoming webhook URL with permissions to post in autoscaling alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing autoscaling alerts to the FinOps Slack channel.

    ## Quick start
    1. Verify that VPA recommender exposes Prometheus metrics on HTTP port 8942.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your cluster environment name in `cluster_environment`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_vpa_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Prometheus History Query Timeout**: VPA queries Prometheus for 8-day history; slow queries stall recommender loops.
    - **HPA/VPA Target Conflicts**: Simultaneous scaling on CPU between HPA and VPA causes violent container thrashing.
    - **OOM on Recommender Pod**: In large clusters with 500+ VPA objects, the recommender pod may hit memory limits.
    - **Checkpoint CRD Permissions**: Verify the recommender service account has write RBAC for `verticalpodautoscalercheckpoints`.

    ## How to extend
    - **Automated Memory Bump**: Trigger a scale-up of the VPA recommender deployment if heap consumption spikes.
    - **PagerDuty Escalation**: Escalate to on-call platform engineers if calculation latency exceeds 10s for 2 runs.
    - **Multi-Cluster Aggregate Sizing**: Expand script parameters to harvest VPA metrics across hybrid cloud clusters.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Kubernetes Autoscaler GitHub Repository](https://github.com/kubernetes/autoscaler)
    - [Vertical Pod Autoscaler Architecture and Design](https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler)
    - [VPA Recommender Parameters and Observability Guide](https://github.com/kubernetes/autoscaler/blob/master/vertical-pod-autoscaler/pkg/recommender/README.md)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - FinOps & Cost Management
  ee: false
  verified: false
  demo: false
