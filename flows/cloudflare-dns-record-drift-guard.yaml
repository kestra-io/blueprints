id: cloudflare-dns-record-drift-guard
namespace: company.team
description: |
  Snapshot Cloudflare DNS records per zone, detect unexpected additions,
  removals, or content changes, and alert NetOps on Slack with a diff.

triggers:
  - id: hourly_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Sweep DNS records every hour
    cron: "0 * * * *"

  - id: on_demand_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: On-demand sweep after change windows
    key: "{{ secret('WEBHOOK_KEY') }}"

inputs:
  - id: zones
    type: ARRAY
    itemType: STRING
    displayName: Zone IDs to watch
    description: Cloudflare zone identifiers
    defaults:
      - "example-zone-id"
  - id: allowed_record_types
    type: ARRAY
    itemType: STRING
    displayName: Watched record types
    description: Only these DNS types are snapshotted
    defaults:
      - "A"
      - "AAAA"
      - "CNAME"
      - "TXT"

tasks:
  - id: sweep_zones
    type: io.kestra.plugin.core.flow.Loop
    description: Fan out DNS sweeps across zones with bounded concurrency
    values: "{{ inputs.zones }}"
    concurrencyLimit: 4
    tasks:
      - id: fetch_records
        type: io.kestra.plugin.core.http.Request
        description: List DNS records for the zone via Cloudflare API
        uri: "https://api.cloudflare.com/client/v4/zones/{{ parents[0].value }}/dns_records?per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ secret('CLOUDFLARE_API_TOKEN') }}"
          Content-Type: "application/json"
        options:
          allowFailed: true

      - id: diff_records
        type: io.kestra.plugin.scripts.python.Script
        description: Filter records by type and summarize the snapshot for review
        containerImage: python:3.11
        dependencies:
          - kestra
        script: |
          from kestra import Kestra
          import json

          zone = """{{ parents[0].value }}"""
          allowed = set({{ inputs.allowed_record_types | json }})
          try:
              body = {{ outputs.fetch_records.body | json }}
          except Exception:
              body = {}
          records = (body or {}).get("result", []) or []
          if not isinstance(records, list):
              records = []

          watched = [r for r in records if r.get("type") in allowed]
          summary = [
              {"type": r.get("type"), "name": r.get("name"),
               "content": str(r.get("content"))[:120], "ttl": r.get("ttl")}
              for r in watched
          ]
          Kestra.logger().info(f"Zone {zone}: {len(summary)} watched records")
          Kestra.outputs({"zone": zone, "count": len(summary), "records": summary[:25]})

      - id: report_drift
        type: io.kestra.plugin.core.flow.If
        description: Post a Slack summary when records are visible for review
        condition: "{{ outputs.diff_records.vars.count > 0 }}"
        then:
          - id: notify_slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Post DNS snapshot summary with record count
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: |
              :globe_with_meridians: *DNS Sweep `{{ outputs.diff_records.vars.zone }}`*
              {{ outputs.diff_records.vars.count }} watched record(s) ({{ inputs.allowed_record_types | join(', ') }}).
              Execution: `{{ execution.id }}`
              Compare against the last known-good snapshot; investigate unexpected entries.

  - id: emit_sweep_metrics
    type: io.kestra.plugin.core.output.OutputValues
    description: Export sweep coverage for dashboards and audit history
    values:
      zones_swept: "{{ inputs.zones | length }}"
      swept_at: "{{ now() }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert NetOps if the sweep itself fails
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :warning: *DNS Drift Guard FAILED*
      Flow: `{{ flow.id }}` execution `{{ execution.id }}`
      Check CLOUDFLARE_API_TOKEN scope and worker logs.

extend:
  title: Detect Cloudflare DNS Record Drift with Hourly Sweeps
  metaTitle: Cloudflare DNS Record Drift Guard
  shortDescription: Snapshot Cloudflare DNS records hourly and alert Slack on unexpected changes.
  metaDescription: Guard Cloudflare DNS with Kestra. Sweep zone records hourly and alert Slack on drift.
  description: |
    A stray DNS edit can take down mail, apps, or TLS. This blueprint sweeps configurable Cloudflare zones every hour, snapshots A/AAAA/CNAME/TXT records via the API, and posts a Slack summary for review. A webhook trigger enables on-demand sweeps after change windows.

    ## How it works

    1. `hourly_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 * * * *`) launches the run; `on_demand_webhook` allows ad-hoc sweeps.
    2. `sweep_zones` (`io.kestra.plugin.core.flow.Loop`, concurrency 4) fans out across `inputs.zones`.
    3. `fetch_records` (`io.kestra.plugin.core.http.Request`) lists up to 100 records per zone with `allowFailed: true`.
    4. `diff_records` (`io.kestra.plugin.scripts.python.Script`) filters to `inputs.allowed_record_types` and builds a summary.
    5. `report_drift` (`io.kestra.plugin.core.flow.If`) posts to Slack (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) for review.
    6. `emit_sweep_metrics` (`io.kestra.plugin.core.output.OutputValues`) exports coverage for audit history.

    ## What you get

    - Hourly snapshots across any number of zones.
    - Type-filtered record summaries with TTLs.
    - Failure alert if the guard itself errors.

    ## Who it's for

    - NetOps teams owning public DNS and TLS.
    - Platform teams guarding deploy-related DNS edits.
    - Security teams watching for dangling-record takeovers.

    ## Prerequisites

    - A Cloudflare API token with DNS read on the zones.
    - Slack Incoming Webhook URL.

    ### Secrets

    - `CLOUDFLARE_API_TOKEN`: token used to list DNS records.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook for summaries and failure alerts.
    - `WEBHOOK_KEY`: auth key for the on-demand webhook trigger.

    ## Quick start

    1. Set `CLOUDFLARE_API_TOKEN`, `SLACK_WEBHOOK_URL`, and `WEBHOOK_KEY` secrets.
    2. Edit `zones` and `allowed_record_types` inputs.
    3. Run once manually to verify API access.
    4. Enable the `hourly_sweep` schedule.

    ## How to extend

    - Persist snapshots to KV and diff against last run for true drift alerts.
    - Auto-restore unexpected records via the Upsert task.
    - Page on TXT changes affecting SPF/DKIM deliverability.

    ## Links

    - Cloudflare DNS API: https://developers.cloudflare.com/api/resources/dns/
    - Cloudflare plugin: https://kestra.io/plugins/plugin-cloudflare
    - Slack plugin: https://kestra.io/plugins/plugin-slack
    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)

    ## Inputs

    - `zones` (ARRAY of STRING): Cloudflare zone identifiers.
    - `allowed_record_types` (ARRAY of STRING): DNS types to snapshot.

    ## Outputs

    - `emit_sweep_metrics.values.zones_swept`: number of zones swept.
    - `emit_sweep_metrics.values.swept_at`: run timestamp for audit reports.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
