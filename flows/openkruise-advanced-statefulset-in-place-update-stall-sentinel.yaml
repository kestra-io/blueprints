    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [OpenKruise Official Documentation](https://openkruise.io/)
    - [OpenKruise AdvancedStatefulSet Architecture and In-Place Guide](https://openkruise.io/docs/user-manuals/advancedstatefulset/)
    - [OpenKruise Controller Monitoring and Metrics Reference](https://openkruise.io/docs/operations/troubleshooting/)
