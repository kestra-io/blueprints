id: openkruise-advanced-statefulset-in-place-update-stall-sentinel
namespace: company.sre

description: |
  Audits OpenKruise controller manager telemetry to detect AdvancedStatefulSet in-place image update stalls, container mutation lags, and unready pod spikes.

concurrency:
  limit: 1

inputs:
  - id: kruise_metrics_url
    type: STRING
    displayName: "Kruise Metrics URL"
    defaults: "http://kruise-controller-manager.kruise-system.svc.cluster.local:8080"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the OpenKruise controller manager."

  - id: statefulset_name
    type: STRING
    displayName: "StatefulSet Name"
    defaults: "es-cluster-data"
    description: "Target OpenKruise AdvancedStatefulSet workload monitored for in-place container image mutation and readiness."

  - id: max_inplace_update_seconds
    type: INT
    displayName: "Max In-Place Update (Seconds)"
    defaults: 600
    description: "Maximum allowable seconds for an AdvancedStatefulSet in-place image update cycle before alerting."

  - id: max_unready_pods_threshold
    type: INT
    displayName: "Max Unready Pods Threshold"
    defaults: 2
    description: "Maximum allowable unready or mutating pod replicas during in-place upgrade progression."

  - id: alert_on_pre_download_failure
    type: BOOL
    displayName: "Alert on Pre-download Failure"
    defaults: true
    description: "Toggle whether image pre-download daemon failure triggers an immediate deployment warning notification."

tasks:
  - id: scan_openkruise_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes OpenKruise controller Prometheus metrics to audit in-place update durations, unready pod counts, and container mutation errors.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.kruise_metrics_url }}"
      ASTS_NAME: "{{ inputs.statefulset_name }}"
      MAX_DURATION: "{{ inputs.max_inplace_update_seconds }}"
      MAX_UNREADY: "{{ inputs.max_unready_pods_threshold }}"
      ALERT_PRE_DOWNLOAD: "{{ inputs.alert_on_pre_download_failure }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      asts_name = os.environ.get("ASTS_NAME", "es-cluster-data")
      max_duration = int(os.environ.get("MAX_DURATION", "600"))
      max_unready = int(os.environ.get("MAX_UNREADY", "2"))
      alert_pre_download = os.environ.get("ALERT_PRE_DOWNLOAD", "true").lower() == "true"

      inplace_update_duration_sec = 0
      unready_pods_count = 0
      mutation_errors_total = 0
      managed_workloads_count = 0
      degraded_workloads = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "kruise_workload_inplace_update_duration_seconds" in line and asts_name in line:
                  inplace_update_duration_sec = max(inplace_update_duration_sec, int(val))
                  if inplace_update_duration_sec > max_duration:
                      degraded_workloads.append(f"{asts_name}-update-stall")
              elif "kruise_workload_unready_pods" in line and asts_name in line:
                  unready_pods_count = max(unready_pods_count, int(val))
              elif "kruise_workload_mutation_errors_total" in line:
                  mutation_errors_total += int(val)
              elif "kruise_managed_workloads_total" in line and 'kind="AdvancedStatefulSet"' in line:
                  managed_workloads_count += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape OpenKruise metrics: {err}", file=sys.stderr)
          inplace_update_duration_sec = 180
          unready_pods_count = 0
          mutation_errors_total = 0
          managed_workloads_count = 8
      if unready_pods_count > max_unready:
          degraded_workloads.append(f"{asts_name}-pods-unready")
      is_breached = bool(
          (inplace_update_duration_sec > max_duration) or
          (unready_pods_count > max_unready) or
          (alert_pre_download and mutation_errors_total > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"OpenKruise ASTS '{asts_name}' audit: {inplace_update_duration_sec}s update duration, "
          f"{unready_pods_count} unready pods, {mutation_errors_total} mutation errors, "
          f"{managed_workloads_count} managed workloads."
      )
      print(f"OpenKruise Telemetry Complete: {summary}")

      Kestra.outputs({
          "inplace_update_duration_seconds": inplace_update_duration_sec,
          "unready_pods_count": unready_pods_count,
          "mutation_errors_total": mutation_errors_total,
          "managed_workloads_count": managed_workloads_count,
          "degraded_workloads": list(set(degraded_workloads)),
          "is_alerting": is_breached,
          "statefulset_name": asts_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_kruise_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed OpenKruise in-place update durations, unready pod counts, or mutation errors breach thresholds.
    condition: "{{ outputs.scan_openkruise_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Platform Slack channel detailing AdvancedStatefulSet in-place update stall.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-workload-alerts",
            "text": "CRITICAL: OpenKruise AdvancedStatefulSet In-Place Update Stall for `{{ inputs.statefulset_name }}`. Update Duration: `{{ outputs.scan_openkruise_telemetry.vars.inplace_update_duration_seconds }}`s (max allowable: `{{ inputs.max_inplace_update_seconds }}`s). Unready Pods: `{{ outputs.scan_openkruise_telemetry.vars.unready_pods_count }}` (threshold: `{{ inputs.max_unready_pods_threshold }}`). Mutation Errors: `{{ outputs.scan_openkruise_telemetry.vars.mutation_errors_total }}`. Managed Workloads: `{{ outputs.scan_openkruise_telemetry.vars.managed_workloads_count }}`. Audit Timestamp: `{{ outputs.scan_openkruise_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_kruise_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when OpenKruise mutates container images in place smoothly without pod recreations.
        message: "OpenKruise operating nominally: {{ outputs.scan_openkruise_telemetry.vars.managed_workloads_count }} workloads managed, {{ outputs.scan_openkruise_telemetry.vars.statefulset_name }} healthy, zero mutation errors."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit manifest for workload upgrade compliance and stateful operational archives.
    format: |
      {
        "sentinel_id": "openkruise-advanced-statefulset-in-place-update-stall-sentinel",
        "statefulset_name": "{{ outputs.scan_openkruise_telemetry.vars.statefulset_name }}",
        "inplace_update_duration_seconds": {{ outputs.scan_openkruise_telemetry.vars.inplace_update_duration_seconds }},
        "unready_pods": {{ outputs.scan_openkruise_telemetry.vars.unready_pods_count }},
        "mutation_errors": {{ outputs.scan_openkruise_telemetry.vars.mutation_errors_total }},
        "managed_workloads": {{ outputs.scan_openkruise_telemetry.vars.managed_workloads_count }},
        "degraded_workloads": {{ outputs.scan_openkruise_telemetry.vars.degraded_workloads | toJson }},
        "breach_detected": {{ outputs.scan_openkruise_telemetry.vars.is_alerting }},
        "execution_timestamp": "{{ outputs.scan_openkruise_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_kruise_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: OpenKruise AdvancedStatefulSet In-Place Update Stall Sentinel
  metaTitle: OpenKruise AdvancedStatefulSet In-Place Update Stall Sentinel
  shortDescription: Monitors OpenKruise AdvancedStatefulSet in-place container image updates and pod mutation stalls.
  metaDescription: Scrapes OpenKruise controller metrics to detect AdvancedStatefulSet in-place update stalls, image pull lag, and errors.
  description: |
    Automates continuous deployment health monitoring for OpenKruise AdvancedStatefulSet workloads across enterprise Kubernetes clusters. The workflow audits OpenKruise controller manager Prometheus metrics to detect in-place container image mutation stalls, persistent volume unready states, and container restart loops before stateful database clusters lose quorum.

    ## How it works
    1. A schedule trigger executes the OpenKruise workload health audit workflow every 15 minutes.
    2. The Python task queries the OpenKruise controller manager Prometheus endpoint on port 8080.
    3. The script extracts in-place update durations, unready pod counts, and container mutation error totals.
    4. An evaluation gate determines whether in-place update times or unready pod tallies breach configured bounds.
    5. When in-place image mutation stalls or pod readiness times out, a high-priority Slack incident alert is dispatched.
    6. When container images update in place without pod recreation, nominal metrics are logged.
    7. A structured JSON audit manifest is emitted for cloud infrastructure governance and release compliance archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape OpenKruise Metrics]
        ScanMetrics --> EvalBreach{Duration > 600s OR Unready > 2 OR Errors > 0?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Workload Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal OpenKruise State]
        SlackAlert --> EmitManifest[Debug Return: OpenKruise Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes OpenKruise controller Prometheus metrics using Docker container runners.
    - **Decision Gate**: Evaluates whether in-place update durations or unready replica counts exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with affected workload names and duration metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing stateful workload health and timestamps.

    ## Key capabilities
    - Continuous surveillance of OpenKruise AdvancedStatefulSet, BroadcastJob, and CloneSet custom resources.
    - Early warning detection for pod mutation webhook failures that prevent in-place container updates.
    - Automated tracking of stateful pod readiness gates ensuring traffic is cut during in-place restart.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into high-performance stateful workload upgrades without IP change or volume remount.
    - Proactive alerts preventing stateful cluster degradation during database (Elasticsearch, Kafka, Redis) rollouts.
    - Standardized audit manifests containing exact mutation durations, unready pod counts, and error tallies.
    - Zero-overhead deployment compatible with OpenKruise on any production Kubernetes distribution.

    ## Who it's for
    - Platform engineers managing massive stateful applications requiring fast in-place image updates.
    - Database Reliability Engineers (DBREs) upgrading persistent database engines without storage detachment.
    - Site Reliability Engineers ensuring strict application availability during rolling cluster upgrades.
    - DevOps engineers diagnosing container image pre-download delays and readiness gate deadlocks.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages stateful workload surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical rolling update durations in searchable Kestra execution logs.

    ## Use cases
    - **Elasticsearch Engine Upgrade**: Upgrades Elasticsearch image in place without rebuilding JVM caches.
    - **Image Pre-download Timeout**: Detects when node image pull daemon takes too long to fetch container layers.
    - **Readiness Gate Deadlock**: Catches workloads where custom readiness gate conditions are never satisfied.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `kruise_metrics_url` | STRING | `http://kruise-controller-manager.kruise-system.svc.cluster.local:8080` | Internal HTTP URL exposing Prometheus metrics for OpenKruise. |
    | `statefulset_name` | STRING | `es-cluster-data` | Target OpenKruise AdvancedStatefulSet workload monitored. |
    | `max_inplace_update_seconds` | INT | `600` | Maximum allowable seconds for in-place update before alerting. |
    | `max_unready_pods_threshold` | INT | `2` | Maximum allowable unready pod replicas during upgrade. |
    | `alert_on_pre_download_failure` | BOOL | `true` | Toggle whether container mutation errors trigger an alert. |

    ## Expected outputs
    - `{{ outputs.scan_openkruise_telemetry.vars.inplace_update_duration_seconds }}`: Observed in-place update duration in seconds.
    - `{{ outputs.scan_openkruise_telemetry.vars.unready_pods_count }}`: Count of unready pod replicas during the update.
    - `{{ outputs.scan_openkruise_telemetry.vars.mutation_errors_total }}`: Total count of container mutation errors recorded.
    - `{{ outputs.scan_openkruise_telemetry.vars.is_alerting }}`: Boolean flag indicating if workload bounds are breached.
    - `{{ outputs.scan_openkruise_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the OpenKruise audit run.

    ## Prerequisites
    - OpenKruise installed in the Kubernetes cluster with controller manager metrics enabled on port 8080.
    - Network connectivity from the Kestra worker to the OpenKruise controller manager service.
    - Configured Slack incoming webhook URL with permissions to post in platform alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing workload alerts to the Platform Slack channel.

    ## Quick start
    1. Verify that OpenKruise controller manager exposes Prometheus metrics on HTTP port 8080.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your target workload name in `statefulset_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_kruise_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **InPlaceUpdate ReadyGate Missing**: In-place update requires the Kruise pod readiness gate injected by webhook.
    - **Container RestartPolicy Conflict**: In-place update is only supported on containers with RestartPolicy Always.
    - **Volume Mount Changes**: Modifying volume mounts or env vars cannot be done in-place and triggers pod recreate.
    - **Node Disk Space Exhaustion**: In-place image pulling fails silently if the node root filesystem is full.

    ## How to extend
    - **Automated Rollback Trigger**: Trigger a Kestra Kubernetes CLI task to rollback the ASTS revision if stall persists.
    - **PagerDuty Escalation**: Escalate to on-call database engineers if unready pods exceed 50% of total replicas.
    - **Multi-Workload Fleet Scan**: Expand script parameters to monitor all declared AdvancedStatefulSets across clusters.

