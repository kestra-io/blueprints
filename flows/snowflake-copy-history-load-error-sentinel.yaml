id: snowflake-copy-history-load-error-sentinel
namespace: company.dataops

description: Audits Snowflake COPY_HISTORY to detect partial loads and rejected data files, alerting data engineering teams before downstream ELT jobs break.

concurrency:
  limit: 1

inputs:
  - id: snowflake_account
    type: STRING
    defaults: xy12345.us-east-1
    description: Snowflake account identifier.

  - id: snowflake_warehouse
    type: STRING
    defaults: COMPUTE_WH
    description: Virtual warehouse used to execute copy history metadata queries.

  - id: snowflake_database
    type: STRING
    defaults: ANALYTICS
    description: Target database to inspect for bulk copy ingestion errors.

  - id: lookback_hours
    type: INT
    defaults: 24
    description: Time window in hours to audit for ingestion load failures.

  - id: slack_channel
    type: STRING
    defaults: "#data-pipeline-alerts"
    description: Slack channel destination for data ingestion alerts.

tasks:
  - id: audit_copy_history
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install snowflake-connector-python
    env:
      SNOWFLAKE_ACCOUNT: "{{ inputs.snowflake_account }}"
      SNOWFLAKE_WAREHOUSE: "{{ inputs.snowflake_warehouse }}"
      SNOWFLAKE_DATABASE: "{{ inputs.snowflake_database }}"
      SNOWFLAKE_USER: "{{ secret('SNOWFLAKE_USER') }}"
      SNOWFLAKE_PASSWORD: "{{ secret('SNOWFLAKE_PASSWORD') }}"
      LOOKBACK_HOURS: "{{ inputs.lookback_hours }}"
    script: |
      import os
      import json
      import snowflake.connector
      from kestra import Kestra

      account = os.getenv('SNOWFLAKE_ACCOUNT')
      warehouse = os.getenv('SNOWFLAKE_WAREHOUSE')
      database = os.getenv('SNOWFLAKE_DATABASE')
      user = os.getenv('SNOWFLAKE_USER')
      password = os.getenv('SNOWFLAKE_PASSWORD')
      lookback_hours = int(os.getenv('LOOKBACK_HOURS', 24))

      conn = snowflake.connector.connect(
          account=account,
          user=user,
          password=password,
          warehouse=warehouse,
          database=database
      )
      cursor = conn.cursor()

      # Query copy history for failed or partially loaded files in the lookback window
      query = f"""
      SELECT 
          table_name,
          file_name,
          status,
          error_count,
          first_error_message,
          row_parsed,
          row_loaded
      FROM TABLE(INFORMATION_SCHEMA.COPY_HISTORY(
          TABLE_NAME => NULL,
          START_TIME => DATEADD(hours, -{lookback_hours}, CURRENT_TIMESTAMP())
      ))
      WHERE status != 'LOADED' OR error_count > 0
      LIMIT 100;
      """
      cursor.execute(query)
      rows = cursor.fetchall()
      conn.close()

      failed_loads = []
      for row in rows:
          failed_loads.append({
              'table_name': row[0],
              'file_name': row[1],
              'status': row[2],
              'error_count': row[3],
              'error_message': row[4],
              'rows_parsed': row[5],
              'rows_loaded': row[6]
          })

      failed_count = len(failed_loads)
      has_failures = failed_count > 0

      Kestra.outputs({
          'failed_load_count': failed_count,
          'has_ingestion_failures': has_failures,
          'affected_tables': list(set(f['table_name'] for f in failed_loads)),
          'sample_errors': failed_loads[:5]
      })

      report = {
          'database': database,
          'window_hours': lookback_hours,
          'failed_count': failed_count,
          'failed_files': failed_loads
      }

      with open('snowflake_copy_history_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - snowflake_copy_history_report.json

  - id: check_ingestion_failures
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_copy_history.vars.has_ingestion_failures }}"
    then:
      - id: notify_slack_dataops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "Snowflake Ingestion Alert: {{ outputs.audit_copy_history.vars.failed_load_count }} file(s) failed or experienced errors during COPY INTO in `{{ inputs.snowflake_database }}`.\n• Affected Tables: {{ outputs.audit_copy_history.vars.affected_tables | join(', ') }}\n• Remediation: Check file format schemas, date formatting, and source S3/GCS stages."
          }
    else:
      - id: log_loads_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All Snowflake COPY INTO operations succeeded with zero errors over the past {{ inputs.lookback_hours }} hours."

  - id: export_ingestion_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      snowflake_db: "{{ inputs.snowflake_database }}"
      failed_files: "{{ outputs.audit_copy_history.vars.failed_load_count | string }}"
      ingestion_state: "{{ outputs.audit_copy_history.vars.has_ingestion_failures ? 'FAILED_FILES' : 'ALL_LOADED' }}"

triggers:
  - id: daily_copy_history_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"

extend:
  title: Snowflake Copy History Load Error Sentinel
  metaTitle: Snowflake Copy History Load Error Sentinel
  shortDescription: Audits Snowflake COPY_HISTORY to detect partial loads and rejected data files.
  metaDescription: Audits Snowflake COPY_HISTORY to detect partial loads, rejected data files, and schema errors, alerting data engineering teams on Slack.
  description: |
    This blueprint acts as an automated ingestion quality guard for Snowflake modern data stack platforms. Scheduled daily, it inspects Snowflake `INFORMATION_SCHEMA.COPY_HISTORY` to identify partial loads, schema parsing discrepancies, and rejected files across bulk data landing stages, delivering actionable alerts to Slack before incomplete tables compromise downstream dimensional models.

    ## How it works

    1. **Daily Ingestion Audit Trigger**: The `daily_copy_history_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires daily at 06:00 UTC.
    2. **Copy History Table Function Inspection**: The `audit_copy_history` task (`io.kestra.plugin.scripts.python.Script`) executes queries against `INFORMATION_SCHEMA.COPY_HISTORY` over the lookback window, extracting failed file names and first error messages.
    3. **Threshold Gate**: The `check_ingestion_failures` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any load errors or partial loads were identified.
    4. **Slack Alert Dispatch**: When failed loads occur, `notify_slack_dataops` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an urgent incident card with affected table names and error reasons.
    5. **Healthy Confirmation**: When all copy operations succeed without error, `log_loads_healthy` records confirmed health.
    6. **Manifest Export**: The `export_ingestion_manifest` task tags the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Daily 06:00 UTC] --> B[audit_copy_history: Snowflake COPY_HISTORY]
        B --> C{Load Errors or Rejected Files?}
        C -- Yes --> D[notify_slack_dataops: Slack Webhook]
        C -- No --> E[log_loads_healthy: Log]
        D --> F[export_ingestion_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Catch Silent `ON_ERROR = CONTINUE` Data Loss**: Uncover pipelines where load commands silently skipped corrupt records and corrupted analytical aggregates.
    - **Identify Upstream Schema Drift**: Detect CSV and JSON file layout mutations from third-party vendor integrations before dbt transformations run.
    - **Automated Data Landing SLAs**: Track ingestion reliability across cloud object storage stages (S3, GCS, Azure Blob).

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `snowflake_account` | STRING | `xy12345.us-east-1` | Snowflake account identifier. |
    | `snowflake_warehouse` | STRING | `COMPUTE_WH` | Virtual warehouse used to execute copy history metadata queries. |
    | `snowflake_database` | STRING | `ANALYTICS` | Target database to inspect for bulk copy ingestion errors. |
    | `lookback_hours` | INT | `24` | Time window in hours to audit for ingestion load failures. |
    | `slack_channel` | STRING | `#data-pipeline-alerts` | Slack channel destination for data ingestion alerts. |

    ## Expected outputs

    - `{{ outputs.audit_copy_history.vars.failed_load_count }}`: Count of files that failed or partially loaded.
    - `{{ outputs.audit_copy_history.vars.has_ingestion_failures }}`: Boolean flag indicating ingestion failure.
    - `{{ outputs.audit_copy_history.vars.affected_tables }}`: List of tables affected by failed loads.
    - `{{ outputs.audit_copy_history.vars.sample_errors }}`: Detailed list of error messages and file names.
    - `{{ outputs.audit_copy_history.outputFiles['snowflake_copy_history_report.json'] }}`: Full JSON copy history audit report.

    ## Prerequisites

    - Snowflake user with `MONITOR USAGE` or read privileges on the target database's `INFORMATION_SCHEMA`.
    - Incoming Webhook URL configured for your data engineering Slack channel.

    ### Secrets

    - `SNOWFLAKE_USER`: Snowflake authentication username.
    - `SNOWFLAKE_PASSWORD`: Snowflake authentication password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `SNOWFLAKE_USER`, `SNOWFLAKE_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your Snowflake account and database in inputs.
    4. Click **Execute** in the UI to perform an immediate ingestion error scan.

    ## Common pitfalls and troubleshooting

    - **Information Schema Latency**: `INFORMATION_SCHEMA.COPY_HISTORY` provides events within minutes of occurrence; `ACCOUNT_USAGE.COPY_HISTORY` provides 1-year history but with 1 to 2 hours of latency.
    - **Warehouse Sizing**: Use `X-Small` virtual warehouses to minimize credit consumption during metadata queries.

    ## How to extend

    - Add automated quarantining of offending stage files to a `bad_records/` prefix via S3 or GCS API tasks.
    - Post validation summaries directly to data quality monitors like Monte Carlo or Soda.
    - Escalate critical pipeline ingestion failures to PagerDuty.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Snowflake COPY_HISTORY Table Function: https://docs.snowflake.com/en/sql-reference/functions/copy_history
  tags:
    - Data
    - Cloud
  subTags:
    - ELT & Data Landing
    - Data Quality & Governance
    - Monitoring & Alerting
  ee: false
  demo: false
