id: typesense-collection-drift-and-zero-hit-sentinel
namespace: company.team

description: |
  Continuously probe Typesense search collections to detect zero-hit search outages,
  catalog depletion drift, and cluster connectivity failures before customer-facing
  applications are impacted. Evaluates document hit counts against configurable safety
  thresholds using Pebble, branches to Slack alerts on degradation, logs clean passes,
  and emits structured audit metrics.

inputs:
  - id: typesense_host
    type: STRING
    displayName: Typesense Host
    description: Hostname or IP address of the Typesense server (e.g., localhost or container name).
    defaults: "localhost"

  - id: typesense_port
    type: INT
    displayName: Typesense Port
    description: Port number for the Typesense HTTP REST API.
    defaults: 8108

  - id: typesense_https
    type: BOOL
    displayName: Use HTTPS
    description: Set to true if connecting to a Typesense cluster behind TLS/HTTPS.
    defaults: false

  - id: collection_name
    type: STRING
    displayName: Collection Name
    description: Name of the Typesense collection to audit.
    defaults: "products"

  - id: canary_query
    type: STRING
    displayName: Canary Search Query
    description: Representative query string that must consistently return documents in a healthy index.
    defaults: "shoes"

  - id: query_by_fields
    type: STRING
    displayName: Query By Fields
    description: Comma-separated list of document fields queried during the probe.
    defaults: "name,category,description"

  - id: facet_by_field
    type: STRING
    displayName: Facet Field
    description: Field used to audit facet distribution and index breadth across the collection.
    defaults: "category"

  - id: min_expected_hits
    type: INT
    displayName: Minimum Expected Hits
    description: Threshold below which catalog depletion drift is flagged as degraded.
    defaults: 5

triggers:
  - id: every_30_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable in production to continuously monitor search health.
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: probe_search_canary
    type: io.kestra.plugin.typesense.Search
    description: Executes a canary query against the collection. allowFailure ensures timeouts or missing collections are caught for downstream classification rather than abruptly failing the workflow.
    allowFailure: true
    host: "{{ inputs.typesense_host }}"
    port: "{{ inputs.typesense_port }}"
    apiKey: "{{ secret('TYPESENSE_API_KEY') }}"
    collection: "{{ inputs.collection_name }}"
    https: "{{ inputs.typesense_https }}"
    query: "{{ inputs.canary_query }}"
    queryBy: "{{ inputs.query_by_fields }}"

  - id: probe_facet_distribution
    type: io.kestra.plugin.typesense.FacetSearch
    description: Evaluates facet distribution across the collection to ensure multi-category index breadth remains intact.
    allowFailure: true
    host: "{{ inputs.typesense_host }}"
    port: "{{ inputs.typesense_port }}"
    apiKey: "{{ secret('TYPESENSE_API_KEY') }}"
    collection: "{{ inputs.collection_name }}"
    https: "{{ inputs.typesense_https }}"
    query: "*"
    queryBy: "{{ inputs.query_by_fields }}"
    facetBy: "{{ inputs.facet_by_field }}"

  - id: classify_sentinel_status
    type: io.kestra.plugin.core.debug.Return
    description: Classify health state into PROBE_FAILED, ZERO_HITS, LOW_INVENTORY_DRIFT, or HEALTHY based on total hits returned.
    format: "{{ outputs.probe_search_canary is not defined or outputs.probe_search_canary.totalHits is not defined ? 'PROBE_FAILED' : (outputs.probe_search_canary.totalHits == 0 ? 'ZERO_HITS' : (outputs.probe_search_canary.totalHits < inputs.min_expected_hits ? 'LOW_INVENTORY_DRIFT' : 'HEALTHY')) }}"

  - id: route_by_sentinel_status
    type: io.kestra.plugin.core.flow.Switch
    description: Route execution based on classified search collection health status.
    value: "{{ outputs.classify_sentinel_status.value }}"
    cases:
      ZERO_HITS:
        - id: alert_zero_hits
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch critical alert to Slack when canary query returns zero hits while the cluster responds.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "🚨 *Typesense Zero-Hit Outage Detected*\n• Collection: `" ~ inputs.collection_name ~ "`\n• Canary Query: `" ~ inputs.canary_query ~ "`\n• Measured Hits: 0 (Threshold: >= " ~ inputs.min_expected_hits ~ ")\n• Impact: Storefront search may be serving blank result pages."} | toJson }}

      LOW_INVENTORY_DRIFT:
        - id: alert_low_inventory
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch warning alert when active search documents drop below safe inventory floor.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "⚠️ *Typesense Catalog Depletion Warning*\n• Collection: `" ~ inputs.collection_name ~ "`\n• Canary Query: `" ~ inputs.canary_query ~ "`\n• Measured Hits: " ~ outputs.probe_search_canary.totalHits ~ " (Threshold: >= " ~ inputs.min_expected_hits ~ ")\n• Impact: Catalog size dropped significantly below expected operational baseline."} | toJson }}

      PROBE_FAILED:
        - id: alert_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch urgent alert when cluster is unreachable or target collection is missing.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "🚨 *Typesense Cluster Connectivity Failure*\n• Target Host: `" ~ inputs.typesense_host ~ ":" ~ inputs.typesense_port ~ "`\n• Collection: `" ~ inputs.collection_name ~ "`\n• Status: Probe task failed to execute or connect.\n• Action: Verify Typesense daemon status and network accessibility."} | toJson }}

      HEALTHY:
        - id: log_healthy_status
          type: io.kestra.plugin.core.log.Log
          description: Record clean health check pass with verified document and facet counts.
          message: "Typesense sentinel passed: collection '{{ inputs.collection_name }}' is healthy with {{ outputs.probe_search_canary.totalHits }} canary hits."

    defaults:
      - id: log_unexpected_status
        type: io.kestra.plugin.core.log.Log
        message: "Unexpected classify_sentinel_status value: {{ outputs.classify_sentinel_status.value }}"

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Final immutable audit log confirming sentinel evaluation details across all branches.
    message: "Typesense sentinel audit completed. execution={{ execution.id }} status={{ outputs.classify_sentinel_status.value }} canary_hits={{ outputs.probe_search_canary.totalHits ?? 'N/A' }} min_threshold={{ inputs.min_expected_hits }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Catch-all notification if workflow encounters fatal execution errors outside handled probe tasks.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {"text": "❌ *Typesense Sentinel Flow Error*\nFlow `" ~ flow.id ~ "` failed during execution `" ~ execution.id ~ "`. Check Kestra execution logs."} | toJson }}

extend:
  title: Typesense Collection Drift and Zero-Hit Sentinel
  metaTitle: Typesense Search Collection Drift and Zero-Hit Sentinel | Kestra
  shortDescription: Monitor Typesense search collections for silent index zero-hit outages and document depletion drift, alerting Slack when hits fall below safety thresholds.
  metaDescription: Monitor Typesense collections on a schedule for zero-hit search outages, document depletion drift, and cluster reachability failures with Slack alerting.
  description: |
    Silent failures in customer-facing search infrastructure are among the most difficult
    production outages to catch with standard infrastructure health checks. A Typesense
    process can report 200 OK on its HTTP `/health` endpoint while the underlying collection
    has been wiped by a faulty ingestion batch, corrupted during a schema migration, or
    depleted due to an unhandled upstream filter drop. When customers type common queries,
    they receive empty search result pages while synthetic ping probes report all systems green.

    This blueprint implements a production-grade sentinel pattern that actively validates search
    result integrity, catalog depth, and facet availability inside Typesense on an automated
    schedule.

    ## How it works

    1. A disabled-by-default `io.kestra.plugin.core.trigger.Schedule` triggers the workflow
       every 30 minutes, or upon manual execution by platform engineers.
    2. `probe_search_canary` (`io.kestra.plugin.typesense.Search`) executes a representative
       query (such as `shoes`) with `allowFailure: true` so network timeouts or deleted collections
       do not crash the flow before classification occurs.
    3. `probe_facet_distribution` (`io.kestra.plugin.typesense.FacetSearch`) evaluates the
       multi-facet category distribution across the collection to confirm index breadth.
    4. `classify_sentinel_status` (`io.kestra.plugin.core.debug.Return`) evaluates probe outputs
       using Pebble logic, categorizing status into `PROBE_FAILED`, `ZERO_HITS`,
       `LOW_INVENTORY_DRIFT`, or `HEALTHY`.
    5. `route_by_sentinel_status` (`io.kestra.plugin.core.flow.Switch`) routes downstream actions:
       - On `ZERO_HITS`: Dispatches a high-priority Slack incident notification.
       - On `LOW_INVENTORY_DRIFT`: Dispatches a Slack warning flagging catalog depletion.
       - On `PROBE_FAILED`: Dispatches an unreachable cluster or missing collection alert.
       - On `HEALTHY`: Emits an operational confirmation log with total hit metrics.
    6. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) records an immutable audit trail
       entry with execution ID and verified document counts.
    7. A top-level `errors` handler catches unexpected orchestration faults and routes them to Slack.

    ## What you get

    - Active search quality and index integrity validation beyond superficial HTTP uptime pings.
    - Automated detection of empty search result states caused by upstream pipeline drops.
    - Tiered Slack alerts differentiating between catastrophic zero-hit outages and catalog depletion drift.
    - Complete execution audit trail recording document hit counts over time.

    ## Who it's for

    - Platform Engineers and SREs maintaining production search clusters and e-commerce storefronts.
    - Data Engineers orchestrating batch ingestion into Typesense who need automated post-sync validation gates.
    - Search Relevance teams monitoring catalog depth across core facets.

    ## Why orchestrate this with Kestra

    Script-based search monitoring typically requires cron servers, unmanaged secrets, and custom
    alerting scripts that fail silently when network errors occur. Kestra provides native Typesense
    tasks, declarative secret injection, robust conditional branching via Pebble expressions,
    and built-in Slack notification dispatching within a single auditable workflow.

    ## Prerequisites

    - A running Typesense server or cluster (e.g., standard Docker image `typesense/typesense:27.1`).
    - An indexed Typesense collection with searchable documents.
    - A Slack incoming webhook URL for alerting.

    ### Secrets

    - `TYPESENSE_API_KEY`: API key with search permissions on the target Typesense collection (required).
    - `SLACK_WEBHOOK`: Slack Incoming Webhook URL used for dispatching alert notifications (required).

    ## Quick start

    1. Configure `TYPESENSE_API_KEY` and `SLACK_WEBHOOK` secrets in your Kestra namespace.
    2. Start a local Typesense container if running locally:
       `docker run -p 8108:8108 -v /tmp/typesense-data:/data typesense/typesense:27.1 --data-dir /data --api-key=xyz`
    3. Import this blueprint into Kestra and click **Execute** with default parameters.
    4. Verify the audit log output in the execution logs tab.
    5. Enable the `every_30_minutes` schedule trigger to establish automated monitoring.

    ## How to extend

    - Add automated rollback or re-sync tasks: wire a downstream subflow execution to trigger a catalog re-ingestion when `ZERO_HITS` is detected.
    - Multi-collection iteration: wrap the probe tasks inside a `ForEach` loop to validate multiple business-critical collections sequentially.
    - PagerDuty integration: replace or supplement Slack alerts with PagerDuty incidents for immediate on-call escalation during critical zero-hit states.

    ## Links

    - [Typesense Plugin Documentation](https://kestra.io/plugins/plugin-typesense)
    - [Typesense Search API Reference](https://typesense.org/docs/latest/api/documents.html#search)
    - [Kestra Switch Task Documentation](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
