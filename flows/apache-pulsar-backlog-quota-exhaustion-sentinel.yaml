id: apache-pulsar-backlog-quota-exhaustion-sentinel
namespace: company.streaming

inputs:
  - id: pulsar_admin_url
    type: STRING
    defaults: "http://pulsar.internal:8080"
    description: Base URL of Pulsar Admin REST service.
  - id: tenant
    type: STRING
    defaults: "public"
    description: Pulsar tenant name.
  - id: namespace_name
    type: STRING
    defaults: "default"
    description: Pulsar namespace name.

tasks:
  - id: inspect_backlog_stats
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Pulsar namespace stats for backlog quota metrics
        curl -s -f -H "Authorization: Bearer {{ secret('PULSAR_AUTH_TOKEN') }}"           "{{ inputs.pulsar_admin_url }}/admin/v2/namespaces/{{ inputs.tenant }}/{{ inputs.namespace_name }}/backlogQuota" > /tmp/pulsar_quota.json 2>/dev/null || echo '{"destination_storage":{"limit":10737418240}}' > /tmp/pulsar_quota.json
        
        # Query namespace internal stats
        curl -s -f -H "Authorization: Bearer {{ secret('PULSAR_AUTH_TOKEN') }}"           "{{ inputs.pulsar_admin_url }}/admin/v2/namespaces/{{ inputs.tenant }}/{{ inputs.namespace_name }}/stats" > /tmp/pulsar_stats.json
        
        BACKLOG_BYTES=$(jq '[.topics[]?.backlogSize // 0] | add // 0' /tmp/pulsar_stats.json)
        QUOTA_LIMIT=$(jq '.destination_storage.limit // 10737418240' /tmp/pulsar_quota.json)
        
        echo "::set-output name=backlog_bytes::$BACKLOG_BYTES::"
        echo "::set-output name=quota_limit::$QUOTA_LIMIT::"

  - id: evaluate_backlog_pressure
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_backlog_stats.vars.backlog_bytes | int > (outputs.inspect_backlog_stats.vars.quota_limit | int * 0.8) }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Apache Pulsar Backlog Quota Saturated Alert",
                "text": "Pulsar namespace `{{ inputs.tenant }}/{{ inputs.namespace_name }}` reached backlog size of *{{ outputs.inspect_backlog_stats.vars.backlog_bytes }} bytes* (> 80% of limit {{ outputs.inspect_backlog_stats.vars.quota_limit }})! Publishers are at risk of being throttled or consumer messages dropped.",
                "footer": "Kestra Streaming Sentinel • Apache Pulsar"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Pulsar Sentinel Failure",
            "text": "Failed to query Pulsar Admin API. Verify admin URL and authentication token.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors Apache Pulsar namespace message backlog quotas to prevent publisher throttling and message loss."
  metaTitle: Apache Pulsar Message Backlog Quota and Retention Headroom Sentinel with Kestra
  title: Apache Pulsar Message Backlog Quota and Retention Headroom Sentinel
  shortDescription: Monitors Apache Pulsar namespace message backlog quotas to prevent publisher throttling and message loss.
  description: |
    ## How it works
    This workflow connects to the Apache Pulsar Admin REST API (`/admin/v2/namespaces/{tenant}/{namespace}/stats`) to monitor total unconsumed message backlog sizes against configured `backlogQuota` storage limits. When consumers stall or disconnect, messages accumulate across BookKeeper ledger bookies. If the backlog reaches the namespace limit, Pulsar enforces the configured policy (such as `producer_request_hold` which throttles publishers, or `consumer_backlog_eviction` which silently discards the oldest unacknowledged messages). This workflow detects quota saturation and alerts streaming operations before data loss occurs.

    ## What you get
    - Real-time detection of unconsumed message accumulation in Apache Pulsar.
    - Prevents producer throttling stalls and silent message eviction.
    - Actionable visibility into namespace storage limits.

    ## Who it's for
    - Event Streaming Platform Engineers and Messaging Architects.
    - SREs maintaining mission-critical Apache Pulsar clusters.

    ## Why orchestrate this with Kestra
    - **Continuous Streaming Assurance**: Automatically audits message broker headroom.
    - **Secure Token Handling**: Safely injects Pulsar JWT tokens via Kestra secret store.
    - **Instant Team Escalation**: Delivers notifications with backlog sizes directly to Slack.

    ## Prerequisites
    - Apache Pulsar cluster with Admin REST endpoint accessible.
    - Secrets `PULSAR_AUTH_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Pulsar Admin URL, tenant, and namespace.
    3. Run the workflow to inspect backlog quota metrics.

    ## How to extend
    - Query subscription-specific backlog counts to identify the exact lagging consumer group.
    - Automatically scale consumer pod replicas via Kubernetes HPA when backlog expands.

    ## Links
    - [Apache Pulsar Backlog Quotas Documentation](https://pulsar.apache.org/docs/en/cookbooks-retention-expiry/#backlog-quotas)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
