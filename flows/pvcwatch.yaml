id: pvcwatch
namespace: company.team
description: Watches Kubernetes PersistentVolumeClaims and alerts on Slack when one gets stuck in Pending.

labels:
  project: pvcwatch
  team: platform

inputs:
  - id: namespace
    type: STRING
    displayName: "Namespace"
    description: the namespace whose PVCs to watch
    defaults: default
  - id: slack_webhook
    type: STRING
    displayName: "Slack Webhook URL"
    description: Incoming webhook URL of the Slack channel for the alerts

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: checks PVC status every morning
    cron: "0 8 * * *"
    timezone: UTC
    inputs:
      namespace: default
      slack_webhook: "{{ secret('SLACK_WEBHOOK') }}"

tasks:
  - id: list_pvcs
    type: io.kestra.plugin.scripts.shell.Commands
    description: lists all PVCs in the namespace as JSON
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: bitnami/kubectl
    inputFiles:
      client.crt: "{{ secret('CLIENT_CRT') }}"
      client.key: "{{ secret('CLIENT_KEY') }}"
    commands:
      - kubectl get pvc -n {{ inputs.namespace }} -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > pvcs.json
    outputFiles:
      - pvcs.json

  - id: find_trouble
    type: io.kestra.plugin.scripts.python.Script
    description: finds PVCs stuck in Pending, drops ones already alerted on
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: python:3.11
    dependencies:
      - kestra
    script: |
      import json
      from kestra import Kestra

      namespace = """{{ inputs.namespace }}"""

      with open("""{{ outputs.list_pvcs.outputFiles['pvcs.json'] }}""") as f:
          pvcs = json.load(f)['items']

      # names we already alerted on, from the KV store (null on first run -> empty)
      raw_state = """{{ kv('pvcwatch-state-' ~ inputs.namespace, errorOnMissing=false) }}"""
      already = set(json.loads(raw_state) if raw_state.strip() else [])

      troubled = []
      for pvc in pvcs:
          name = pvc['metadata']['name']
          phase = pvc.get('status', {}).get('phase', '')
          if phase == 'Pending':
              sc = pvc['spec'].get('storageClassName', '(none)')
              troubled.append({'name': name, 'storage_class': sc})

      troubled_names = set(t['name'] for t in troubled)
      new_trouble = [t for t in troubled if t['name'] not in already]
      # the new state is simply who is troubled right now;
      # bound PVCs drop out on their own, so a future stuck claim alerts again

      lines = [f"*PVCWatch - stuck claims in '{namespace}'*", ""]
      for t in new_trouble:
          lines.append(f"- *{t['name']}*: Pending (storageClass: {t['storage_class']})")
          lines.append(f"  inspect: `kubectl describe pvc {t['name']} -n {namespace}`")
      lines.append("")
      alert_text = "\n".join(lines)

      Kestra.outputs({
          'troubled': new_trouble,
          'count': len(new_trouble),
          'new_state_json': json.dumps(sorted(troubled_names)),
          'alert_text': alert_text,
      })

  - id: maybe_alert
    type: io.kestra.plugin.core.flow.If
    description: only alerts when there is something new to report
    condition: "{{ outputs.find_trouble.vars.count > 0 }}"
    then:
      - id: send_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: posts the stuck PVCs to Slack
        url: "{{ inputs.slack_webhook }}"
        messageText: "{{ outputs.find_trouble.vars.alert_text }}"

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: remembers who is troubled now, so bound PVCs alert again next time
    key: "pvcwatch-state-{{ inputs.namespace }}"
    value: "{{ outputs.find_trouble.vars.new_state_json }}"
    overwrite: true

extend:
  title: "PVCWatch - Kubernetes stuck PersistentVolumeClaim watcher"
  shortDescription: "Watches Kubernetes PVCs and alerts on Slack when one gets stuck in Pending."
  metaTitle: "PVCWatch: Kubernetes stuck PersistentVolumeClaim watcher blueprint for Kestra"
  metaDescription: "A Kestra blueprint that watches Kubernetes PersistentVolumeClaims, detects ones stuck in Pending, and alerts on Slack without spamming."
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  demo: false
  description: |
    ## How it works

    1. `list_pvcs` (`io.kestra.plugin.scripts.shell.Commands`) runs `kubectl get pvc` in the target namespace and saves the full claim list as JSON. It authenticates with a client certificate and key passed as Kestra secrets, the same pattern the Kubernetes gallery blueprints use.
    2. `find_trouble` (`io.kestra.plugin.scripts.python.Script`) reads the remembered state from the KV store, then checks every claim's phase. Anything stuck in `Pending` counts as troubled. Anything already alerted on is dropped.
    3. `maybe_alert` (`io.kestra.plugin.core.flow.If`) runs only when there is something new to report, and `send_alert` posts the stuck claims to Slack with the storage class and a kubectl command to inspect each one.
    4. `save_state` (`io.kestra.plugin.core.kv.Set`) writes back the new list of troubled claim names as one JSON value. Bound claims drop out on their own, so a future stuck claim alerts again.

    ## What you get

    - A daily storage health check for any namespace, no agent to install inside the cluster.
    - Slack alerts only for new trouble: which claim, which storage class it asked for, and the kubectl command to look at it.
    - No alert spam: the KV-backed memory remembers who was already reported, and forgets claims that got bound.
    - Quiet runs when every claim is bound.

    ## Who it's for

    Anyone running stateful workloads on Kubernetes who has watched a pod sit in Pending for hours because its volume never bound. Works on any cluster you can reach with a client certificate: minikube, kind, managed clusters.

    ## Why orchestrate this with Kestra

    A shell script on a cron server can list PVCs, but then you need somewhere to keep the "already alerted" state, somewhere to hold the secrets, and a place to see the run history when an alert looks wrong. Kestra gives you all three: the KV store is the memory, secrets stay out of the YAML, and every run keeps its logs and outputs where you can inspect them.

    ## Prerequisites

    - A Kubernetes cluster reachable from where Kestra runs, with a client certificate and key for authentication.
    - Kestra with the Docker task runner available (used for the kubectl and Python steps).
    - A Slack Incoming Webhook URL.

    ### Secrets

    | Secret | What it is |
    | --- | --- |
    | `CLIENT_CRT` | base64-encoded client certificate for the cluster |
    | `CLIENT_KEY` | base64-encoded client key for the cluster |
    | `MASTERURL` | base64-encoded Kubernetes API server URL, reachable from inside the Kestra container |
    | `SLACK_WEBHOOK` | base64-encoded Slack Incoming Webhook URL |

    In Kestra OSS, secrets come from environment variables prefixed with `SECRET_` and must be base64-encoded.

    ## Quick start

    1. Start Kestra with the four secrets above as `SECRET_` environment variables.
    2. Import this flow and run it with the `namespace` you want to watch.
    3. Create a test claim with a bogus storage class and run again: the Slack alert lists the claim and the class it asked for.
    4. Run once more without changing anything: no second alert. Delete the claim and run again: quiet, and the state is cleared.

    ## How to extend

    - Add a stuck-duration threshold by comparing the claim's creation timestamp against now.
    - Lower the schedule to every hour for faster detection by changing the `cron` trigger.
    - Deploy one copy of the flow per namespace you want to watch, changing only the `namespace` input.
    - Route alerts to PagerDuty or Opsgenie by swapping the Slack task for another notification task.

    ## Inputs

    | Input | Type | Default | What it does |
    | --- | --- | --- | --- |
    | `namespace` | STRING | `default` | the namespace whose PVCs to watch |
    | `slack_webhook` | STRING | (required) | Incoming webhook URL of the Slack channel for the alerts |

    ## Links

    - [Kestra blueprint catalog](https://kestra.io/blueprints)
    - [Kubernetes PersistentVolumeClaims documentation](https://kubernetes.io/docs/concepts/storage/persistent-volumes/#persistentvolumeclaims)
    - [Kestra KV store documentation](https://kestra.io/docs/concepts/kv-store)

    ## Pitfalls

    - A freshly created claim shows Pending for a short while before it binds. This flow alerts on the first sighting, so very fast provisioning can cause a one-time alert. The dedup keeps it to one.
    - Claims with no storage class stay Pending until a PV is manually created or a default class exists. The alert names the requested class so you can spot the typo.
    - Make sure the `MASTERURL` is reachable from inside the Kestra container. `localhost` inside the container is not your host: use `host.docker.internal` when Kestra runs in Docker on the same machine as the cluster.
