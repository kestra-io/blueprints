id: aws-cross-region-kms-dr-key-synchronization
namespace: company.team

description: |
  Read the `default` key policy from a primary AWS KMS multi-region key and synchronize
  it to listed replica regions. Validates key state and region format, creates pre-write
  backups in the working directory, respects a per-run sync cap, reports drift and errors
  to Slack, and fails when errors occur.

inputs:
  - id: primary_key_id
    type: STRING
    displayName: Primary key ID or ARN
    description: KMS multi-region key ID (mrk-...) or ARN in the primary region. Replicas share the same key ID across regions; ARNs are automatically stripped to the key ID in the shell. Only customer-managed keys are supported.
    defaults: "<your-primary-key-id>"

  - id: primary_region
    type: STRING
    displayName: Primary region
    description: AWS region hosting the primary multi-region key from which the policy is read.
    defaults: "us-east-1"

  - id: replica_regions
    type: STRING
    displayName: Replica regions (comma-separated)
    description: Comma-separated list of replica regions to check and optionally sync. Each region is validated against ^[a-z]{2}(-[a-z]+)+-[0-9]$.
    defaults: "us-west-2,eu-west-1"

  - id: max_policy_syncs_per_run
    type: INT
    displayName: Max policy syncs per run
    description: Hard cap on how many replica regions this single run may write to when dry_run is false. Default 5. Set to 1 for a cautious first run.
    defaults: 5

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: When true (the default), the flow detects and reports drift without calling put-key-policy. Set to false to apply changes.
    defaults: true

tasks:
  - id: sync_kms_dr_policies
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: >-
      Validates the primary key is an enabled customer-managed multi-region primary key,
      reads its default policy to primary_policy.json, and inspects each replica region in replica_regions.
      Saves existing replica policies to replica_<region>_previous_policy.json before any write,
      compares policies, and optionally updates out-of-sync replicas up to max_policy_syncs_per_run.
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.primary_region }}"
    outputFiles:
      - "*.json"
    commands:
      - |-
        RAW_KEY="{{ inputs.primary_key_id }}"
        KEY_ID="${RAW_KEY##*/}"
        PRIMARY_REGION="{{ inputs.primary_region }}"
        DRY_RUN="{{ inputs.dry_run }}"
        MAX_SYNCS="{{ inputs.max_policy_syncs_per_run }}"

        echo "Validating primary key $KEY_ID in $PRIMARY_REGION..."
        PRIMARY_DESC=$(aws kms describe-key \
          --key-id "$KEY_ID" \
          --region "$PRIMARY_REGION" \
          --query '[KeyMetadata.MultiRegion, KeyMetadata.MultiRegionConfiguration.MultiRegionKeyType, KeyMetadata.KeyManager, KeyMetadata.KeyState]' \
          --output text 2>/tmp/primary_describe_err.txt)

        if [ $? -ne 0 ]; then
          echo "Failed to describe primary key $KEY_ID in $PRIMARY_REGION: $(cat /tmp/primary_describe_err.txt)" >&2
          exit 1
        fi

        read -r IS_MULTI KEY_TYPE KEY_MGR KEY_STATE <<< "$PRIMARY_DESC"

        if [ "$IS_MULTI" != "True" ] && [ "$IS_MULTI" != "true" ]; then
          echo "Validation failed: primary key $KEY_ID is not a multi-region key (MultiRegion=$IS_MULTI)" >&2
          exit 1
        fi
        if [ "$KEY_TYPE" != "PRIMARY" ]; then
          echo "Validation failed: primary key $KEY_ID MultiRegionKeyType is '$KEY_TYPE', expected 'PRIMARY'" >&2
          exit 1
        fi
        if [ "$KEY_MGR" != "CUSTOMER" ]; then
          echo "Validation failed: primary key $KEY_ID KeyManager is '$KEY_MGR', expected 'CUSTOMER'" >&2
          exit 1
        fi
        if [ "$KEY_STATE" != "Enabled" ]; then
          echo "Validation failed: primary key $KEY_ID KeyState is '$KEY_STATE', expected 'Enabled'" >&2
          exit 1
        fi

        echo "Primary key $KEY_ID validated. Reading default policy..."
        aws kms get-key-policy \
          --key-id "$KEY_ID" \
          --policy-name default \
          --query Policy \
          --output text \
          --region "$PRIMARY_REGION" > primary_policy.json 2>/tmp/primary_policy_err.txt

        if [ $? -ne 0 ] || [ ! -s primary_policy.json ]; then
          echo "Failed to read default policy from primary key $KEY_ID: $(cat /tmp/primary_policy_err.txt)" >&2
          exit 1
        fi

        SYNCS_DONE=0
        DRIFT_REGIONS=""
        SYNCED_REGIONS=""
        SKIPPED_REGIONS=""
        ERROR_REGIONS=""
        CAP_HIT=false

        IFS=',' read -ra REGIONS <<< "{{ inputs.replica_regions }}"
        for REGION in "${REGIONS[@]}"; do
          REGION=$(echo "$REGION" | tr -d ' ')
          [ -z "$REGION" ] && continue

          if ! echo "$REGION" | grep -Eq '^[a-z]{2}(-[a-z]+)+-[0-9]$'; then
            ERROR_REGIONS="${ERROR_REGIONS:+${ERROR_REGIONS} }${REGION}(invalid-region-format)"
            continue
          fi

          aws kms describe-key \
            --key-id "$KEY_ID" \
            --region "$REGION" \
            --query 'KeyMetadata.KeyState' \
            --output text >/dev/null 2>/tmp/describe_err.txt
          DESC_CODE=$?

          if [ $DESC_CODE -ne 0 ]; then
            ERR_MSG=$(cat /tmp/describe_err.txt 2>/dev/null)
            if echo "$ERR_MSG" | grep -qi "NotFound"; then
              REASON="ResourceNotFound"
            elif echo "$ERR_MSG" | grep -qi "AccessDenied"; then
              REASON="AccessDenied"
            else
              REASON="DescribeFailed"
            fi
            ERROR_REGIONS="${ERROR_REGIONS:+${ERROR_REGIONS} }${REGION}(describe-${REASON})"
            continue
          fi

          REPLICA_BACKUP="replica_${REGION}_previous_policy.json"
          aws kms get-key-policy \
            --key-id "$KEY_ID" \
            --policy-name default \
            --query Policy \
            --output text \
            --region "$REGION" > "$REPLICA_BACKUP" 2>/tmp/get_policy_err.txt
          GET_CODE=$?

          if [ $GET_CODE -ne 0 ] || [ ! -s "$REPLICA_BACKUP" ]; then
            ERR_MSG=$(cat /tmp/get_policy_err.txt 2>/dev/null)
            if echo "$ERR_MSG" | grep -qi "NotFound"; then
              REASON="ResourceNotFound"
            elif echo "$ERR_MSG" | grep -qi "AccessDenied"; then
              REASON="AccessDenied"
            else
              REASON="ReadPolicyFailed"
            fi
            ERROR_REGIONS="${ERROR_REGIONS:+${ERROR_REGIONS} }${REGION}(read-${REASON})"
            rm -f "$REPLICA_BACKUP"
            continue
          fi

          PRIMARY_NORM=$(tr -s ' \t\n' ' ' < primary_policy.json)
          REPLICA_NORM=$(tr -s ' \t\n' ' ' < "$REPLICA_BACKUP")

          if [ "$PRIMARY_NORM" = "$REPLICA_NORM" ]; then
            SKIPPED_REGIONS="${SKIPPED_REGIONS:+${SKIPPED_REGIONS} }${REGION}(in-sync)"
            continue
          fi

          DRIFT_REGIONS="${DRIFT_REGIONS:+${DRIFT_REGIONS} }${REGION}"

          if [ "$DRY_RUN" = "true" ]; then
            continue
          fi

          if [ "$SYNCS_DONE" -ge "$MAX_SYNCS" ]; then
            CAP_HIT=true
            SKIPPED_REGIONS="${SKIPPED_REGIONS:+${SKIPPED_REGIONS} }${REGION}(cap-reached)"
            continue
          fi

          aws kms put-key-policy \
            --key-id "$KEY_ID" \
            --policy-name default \
            --policy file://primary_policy.json \
            --region "$REGION" 2>/tmp/put_err.txt
          PUT_CODE=$?

          if [ $PUT_CODE -eq 0 ]; then
            SYNCS_DONE=$((SYNCS_DONE + 1))
            SYNCED_REGIONS="${SYNCED_REGIONS:+${SYNCED_REGIONS} }${REGION}"
          else
            ERR_MSG=$(cat /tmp/put_err.txt 2>/dev/null)
            if echo "$ERR_MSG" | grep -qi "AccessDenied"; then
              REASON="AccessDenied"
            else
              REASON="PutPolicyFailed"
            fi
            ERROR_REGIONS="${ERROR_REGIONS:+${ERROR_REGIONS} }${REGION}(put-${REASON})"
          fi
        done

        echo "::{\"outputs\":{\"drift_regions\":\"${DRIFT_REGIONS}\",\"synced_regions\":\"${SYNCED_REGIONS}\",\"skipped_regions\":\"${SKIPPED_REGIONS}\",\"error_regions\":\"${ERROR_REGIONS}\",\"syncs_done\":\"${SYNCS_DONE}\",\"cap_hit\":\"${CAP_HIT}\"}}::"

  - id: evaluate_result
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any drift or region errors occurred. Alerts Slack on drift or errors; logs clean only when both are empty.
    condition: "{{ (outputs.sync_kms_dr_policies.vars.drift_regions | default('') | trim | length > 0) or (outputs.sync_kms_dr_policies.vars.error_regions | default('') | trim | length > 0) }}"
    then:
      - id: alert_slack_summary
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Posts a Slack notification detailing drifted regions, synced regions, errors, and backup file artifacts.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {
            "text": (":key: *AWS KMS Cross-Region DR Policy Audit Summary*\n"
              ~ "*Primary key:* `" ~ inputs.primary_key_id ~ "` (`" ~ inputs.primary_region ~ "`)\n"
              ~ "*Drift regions:* `" ~ (outputs.sync_kms_dr_policies.vars.drift_regions | default("none")) ~ "`\n"
              ~ "*Synced regions:* `" ~ (outputs.sync_kms_dr_policies.vars.synced_regions | default("none (dry_run=true)")) ~ "`\n"
              ~ "*Error regions:* `" ~ (outputs.sync_kms_dr_policies.vars.error_regions | default("none")) ~ "`\n"
              ~ "*Skipped regions:* `" ~ (outputs.sync_kms_dr_policies.vars.skipped_regions | default("none")) ~ "`\n"
              ~ "*Backup artifacts:* `replica_<region>_previous_policy.json` stored in task execution files\n"
              ~ "*Dry run:* `" ~ inputs.dry_run ~ "`\n"
              ~ (outputs.sync_kms_dr_policies.vars.cap_hit == "true" ? ":warning: Sync cap (" ~ inputs.max_policy_syncs_per_run ~ ") reached. Re-run to sync remaining regions.\n" : "")
              ~ (outputs.sync_kms_dr_policies.vars.error_regions | default('') | trim | length > 0 ? ":rotating_light: One or more replica regions failed. Check error details." : ""))
          } | toJson }}
    else:
      - id: log_all_in_sync
        type: io.kestra.plugin.core.log.Log
        message: "KMS policy sync check complete. All replica regions are in sync with the primary and no errors occurred. key={{ inputs.primary_key_id }} primary_region={{ inputs.primary_region }} replicas={{ inputs.replica_regions }}"

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Always logs a final audit line with all drift, sync, error, and cap counters.
    message: "KMS DR sync run complete. drift_regions={{ outputs.sync_kms_dr_policies.vars.drift_regions | default('none') }} synced_regions={{ outputs.sync_kms_dr_policies.vars.synced_regions | default('none') }} error_regions={{ outputs.sync_kms_dr_policies.vars.error_regions | default('none') }} syncs_done={{ outputs.sync_kms_dr_policies.vars.syncs_done | default('0') }} cap_hit={{ outputs.sync_kms_dr_policies.vars.cap_hit | default('false') }} dry_run={{ inputs.dry_run }}"

  - id: fail_on_errors
    type: io.kestra.plugin.core.flow.If
    description: Fails the execution after sending the Slack summary if any replica region encountered errors.
    condition: "{{ outputs.sync_kms_dr_policies.vars.error_regions | default('') | trim | length > 0 }}"
    then:
      - id: fail_execution
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "KMS DR policy sync encountered errors in replica regions: {{ outputs.sync_kms_dr_policies.vars.error_regions }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {"text": ":x: KMS cross-region DR sync flow failed (execution " ~ execution.id ~ "). Check execution logs. No key policies were modified by the error handler."} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable and tune cron after testing with dry_run true.
    cron: "0 6 * * 1"
    disabled: true
    inputs:
      primary_key_id: "<your-primary-key-id>"
      primary_region: "us-east-1"
      replica_regions: "us-west-2,eu-west-1"
      max_policy_syncs_per_run: 5
      dry_run: true

extend:
  title: AWS Cross-Region KMS DR Key Policy Synchronization
  metaTitle: AWS Cross-Region KMS DR Key Policy Synchronization with Kestra
  metaDescription: Detect and sync AWS KMS multi-region key policy drift across DR replica regions with pre-write backups, error tracking, and a per-run sync cap.
  shortDescription: Detect AWS KMS multi-region key policy drift across disaster recovery replica regions and optionally sync the primary policy to out-of-sync replicas, saving previous policies before writing.
  description: |
    AWS KMS multi-region keys share key material across regions, but key policies remain
    region-scoped. When administrators update the primary key policy, replica keys in disaster
    recovery regions do not inherit the changes automatically. Over time, replica policies drift,
    potentially blocking failover workloads or exposing keys to unauthorized principals during
    a disaster. This workflow audits one multi-region key per execution, compares replica policies
    against the primary policy, stores previous replica policies in the working directory before
    writing, updates out-of-sync replicas up to a safety cap, notifies Slack, and fails when
    unreachable regions or permissions errors occur.

    ## How it works

    1. `sync_kms_dr_policies` (`io.kestra.plugin.aws.cli.AwsCLI`) validates the target key
       and coordinates policy synchronization:
       - Extracts the bare key ID from `primary_key_id` using `${primary_key_id##*/}` so both
         bare IDs (`mrk-...`) and full ARNs are accepted. Replicas share the identical key ID
         across regions.
       - Runs `aws kms describe-key` against `primary_region` using `--query` to verify four
         mandatory conditions: `MultiRegion` is `True`, `MultiRegionKeyType` is `PRIMARY`,
         `KeyManager` is `CUSTOMER`, and `KeyState` is `Enabled`. If any condition is not met,
         the task exits immediately with an error.
       - Extracts the primary `default` policy document using `aws kms get-key-policy
         --policy-name default --query Policy --output text` and saves it to `primary_policy.json`
         in the task working directory.
       - Iterates over comma-separated `replica_regions`. Each region is validated against the
         format pattern `^[a-z]{2}(-[a-z]+)+-[0-9]$` before any AWS call.
       - For each valid replica region, it invokes `aws kms describe-key` in that region. If the
         key is not found or access is denied, it records the failure under `error_regions`
         distinguishing `ResourceNotFound` from `AccessDenied` and other errors.
       - Calls `aws kms get-key-policy` for the replica and saves the existing policy to
         `replica_<region>_previous_policy.json` in the working directory. Because `outputFiles`
         tracks `*.json`, Kestra captures each previous policy as an execution artifact.
       - Compares whitespace-collapsed policy documents. Replicas with identical text are marked
         `skipped(in-sync)`. Note that statement order differences or JSON serialization
         differences count as drift because policy equivalence requires exact structural parity.
       - When drift is detected and `dry_run` is false, it verifies that `syncs_done` has not
         exceeded `max_policy_syncs_per_run`. If under the cap, it runs `aws kms put-key-policy
         --policy-name default --policy file://primary_policy.json --region <region>`.
         The command never uses `BypassPolicyLockoutSafetyCheck`. If the cap is reached,
         remaining drifted regions are flagged `skipped(cap-reached)`.
       - Emits structured execution metrics (`drift_regions`, `synced_regions`, `skipped_regions`,
         `error_regions`, `syncs_done`, `cap_hit`) using the JSON output convention.
    2. `evaluate_result` (`io.kestra.plugin.core.flow.If`) checks whether `drift_regions` or
       `error_regions` contains entries:
       - If drift or errors exist, `alert_slack_summary` posts an itemized breakdown including
         affected regions, sync counts, error categories, and artifact backup filenames.
       - If neither drift nor errors exist, `log_all_in_sync` logs a clean verification message.
    3. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) logs a structured audit trail of
       all counters regardless of branch.
    4. `fail_on_errors` (`io.kestra.plugin.core.flow.If`) evaluates `error_regions`. If any
       replica region failed inspection or write, it triggers `io.kestra.plugin.core.execution.Fail`
       to ensure executions with partial failures are never marked successful.
    5. The `errors` block triggers `alert_flow_failure` to post a failure notification to Slack
       if an unhandled error occurs before the evaluation tasks execute.

    ## What you get

    - Automated detection of cross-region KMS key policy drift across secondary DR regions.
    - Pre-write policy backups (`replica_<region>_previous_policy.json`) stored as Kestra
      artifacts, ensuring rollback recovery if an applied policy requires reversal.
    - Strict blast-radius controls: dry-run default, single-key execution scope, and a per-run
      maximum policy write cap.
    - Granular error categorization distinguishing `ResourceNotFound` from `AccessDenied`
      or invalid region strings, with workflow failure enforcement on error.
    - Direct Slack alerts displaying exact drift and remediation details.

    ## Who it's for

    - Cloud Security Engineers enforcing consistent cryptographic authorization across AWS regions.
    - Site Reliability Engineers maintaining multi-region disaster recovery readiness.
    - Platform Architects managing infrastructure-as-code and preventing configuration drift.

    ## Why orchestrate this with Kestra

    Synchronizing KMS policies across regions with raw scripts often leads to unchecked mass updates,
    unrecorded prior states, and silent failures when individual regional endpoints fail. Kestra
    provides declarative workflow control with pre-flight key validation, automatic artifact
    storage of previous policies via `outputFiles`, bounded remediation caps, team notifications,
    and guaranteed failure signaling when regional endpoints reject updates.

    ## Prerequisites

    - AWS IAM credentials configured with permissions for KMS multi-region key administration:
      - `kms:DescribeKey` on primary and replica key ARNs.
      - `kms:GetKeyPolicy` on primary and replica key ARNs for the `default` policy.
      - `kms:PutKeyPolicy` on replica key ARNs (required only when applying updates with `dry_run: false`).
      - Note: The policy applied to replicas must maintain `kms:PutKeyPolicy` permissions for
        the executing IAM principal, otherwise subsequent syncs will be locked out.
    - An active multi-region primary key and corresponding replica keys created in target regions.
      Replicas must be provisioned before running this synchronization workflow.
    - A Slack incoming webhook URL for operational notifications.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key ID for the KMS administrative principal.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret access key for the KMS administrative principal.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used for alerts and error notifications.

      In Kestra OSS, configure secrets as base64-encoded environment variables prefixed with
      `SECRET_`, such as `SECRET_AWS_ACCESS_KEY_ID` and `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Type | Default | Notes |
    |---|---|---|---|
    | `primary_key_id` | STRING | `<your-primary-key-id>` | Multi-region key ID (`mrk-...`) or ARN. Scope is one key per run. |
    | `primary_region` | STRING | `us-east-1` | AWS region where the primary multi-region key resides. |
    | `replica_regions` | STRING | `us-west-2,eu-west-1` | Comma-separated list of replica regions to check and synchronize. |
    | `max_policy_syncs_per_run` | INT | `5` | Maximum number of replica policy writes permitted in a single run. |
    | `dry_run` | BOOL | `true` | When true, audits drift without modifying replica policies. |

    ## Quick start

    1. Identify your primary multi-region key ID and confirmed replica regions:
       ```
       aws kms describe-key --key-id <your-primary-key-id> --region us-east-1
       ```
    2. Add `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    3. Run the workflow with `dry_run: true` to perform an initial non-destructive audit.
    4. Review execution outputs and download `replica_<region>_previous_policy.json` artifacts from the UI.
    5. Set `dry_run: false` to reconcile detected drift up to `max_policy_syncs_per_run`.
    6. Enable the `weekly` schedule trigger to maintain continuous compliance.

    ## How to extend

    - Orchestrate bulk audits across multiple multi-region keys by creating a parent flow that
      iterates key IDs using `io.kestra.plugin.core.flow.ForEachItem` and triggers this flow.
    - Publish drift metrics to Amazon CloudWatch or Datadog to track policy drift frequency over time.
    - Add an approval gate using `io.kestra.plugin.core.flow.Pause` before executing `put-key-policy`
      when drift is detected in critical production regions.
    - Export execution backup files (`*.json`) to an encrypted Amazon S3 compliance bucket for long-term audit retention.

    ## Links

    - [Kestra AWS CLI Plugin Documentation](https://kestra.io/plugins/plugin-aws/tasks/cli/io.kestra.plugin.aws.cli.awscli)
    - [AWS KMS Multi-Region Keys Developer Guide](https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html)
    - [AWS KMS GetKeyPolicy API Reference](https://docs.aws.amazon.com/kms/latest/APIReference/API_GetKeyPolicy.html)
    - [AWS KMS PutKeyPolicy API Reference](https://docs.aws.amazon.com/kms/latest/APIReference/API_PutKeyPolicy.html)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  verified: false
  demo: false
