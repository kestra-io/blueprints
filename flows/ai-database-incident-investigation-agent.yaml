id: ai-database-incident-investigation-agent
namespace: company.sre

description: |
  Autonomous Tier-1 database incident investigator that ingests active connection alerts,
  traces lock dependency trees using in-memory DuckDB diagnostics, uses an AI agent to
  identify root-cause blocker queries, and synthesizes copy-paste remediation SQL to Slack.

inputs:
  - id: database_engine
    type: STRING
    defaults: POSTGRESQL
    description: Database engine type under operational investigation.

  - id: alert_metric
    type: STRING
    defaults: CONNECTION_POOL_EXHAUSTED
    description: Primary metric symptom reported by infrastructure monitoring.

  - id: incident_context
    type: STRING
    defaults: |
      Connection pool utilization breached 98% threshold (490 of 500 connections active).
      Application p99 checkout response times degraded from 45ms to 3200ms across all worker pods.
    description: Metric alert context and business impact summary.

  - id: model_name
    type: STRING
    defaults: gemini-2.5-flash
    description: Foundational model used by the autonomous incident investigation agent.

  - id: seed_demo_data
    type: BOOL
    defaults: true
    description: Populate realistic session lock tree telemetry for zero-setup demo verification.

tasks:
  - id: collect_diagnostic_telemetry
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Ingests session process state and executes lock dependency analysis using in-memory DuckDB.
    fetchType: FETCH
    sql: |
      CREATE TABLE active_sessions (
          pid INT,
          username VARCHAR,
          client_addr VARCHAR,
          state VARCHAR,
          wait_event_type VARCHAR,
          wait_event VARCHAR,
          duration_sec INT,
          blocked_by INT,
          query_text VARCHAR
      );

      INSERT INTO active_sessions VALUES
      (14201, 'app_checkout', '10.0.4.12', 'active', 'Lock', 'relation', 1240, NULL, 'ALTER TABLE orders ADD COLUMN loyalty_points INT DEFAULT 0;'),
      (14205, 'app_checkout', '10.0.4.15', 'active', 'Lock', 'relation', 1190, 14201, 'INSERT INTO orders (customer_id, amount) VALUES (9821, 149.99);'),
      (14209, 'app_checkout', '10.0.4.18', 'active', 'Lock', 'relation', 1150, 14201, 'UPDATE orders SET status = completed WHERE order_id = 45892;'),
      (14214, 'app_checkout', '10.0.4.22', 'active', 'Lock', 'relation', 1110, 14201, 'SELECT * FROM orders WHERE status = pending FOR UPDATE;'),
      (14220, 'read_replica', '10.0.5.11', 'idle', NULL, NULL, 5, NULL, 'SELECT 1;');

      SELECT 
          COUNT(*) AS total_active_sessions,
          COUNT(blocked_by) AS total_blocked_sessions,
          MAX(duration_sec) AS max_duration_sec,
          (SELECT pid FROM active_sessions WHERE blocked_by IS NULL AND wait_event_type = 'Lock' ORDER BY duration_sec DESC LIMIT 1) AS head_blocker_pid,
          (SELECT query_text FROM active_sessions WHERE blocked_by IS NULL AND wait_event_type = 'Lock' ORDER BY duration_sec DESC LIMIT 1) AS head_blocker_query
      FROM active_sessions;

  - id: investigate_incident
    type: io.kestra.plugin.ai.agent.AIAgent
    description: Investigates lock trees and query symptoms using Google Gemini with structured JSON Schema output.
    provider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      apiKey: "{{ secret('GEMINI_API_KEY') }}"
      modelName: "{{ inputs.model_name }}"
    configuration:
      temperature: 0.1
      maxToken: 2048
      responseFormat:
        type: JSON
        jsonSchema:
          type: object
          required:
            - incident_verdict
            - severity
            - culprit_pid
            - culprit_query
            - root_cause_analysis
            - immediate_remediation_sql
            - preventive_recommendations
          properties:
            incident_verdict:
              type: string
              enum:
                - CRITICAL_LOCK_CONTENTION
                - LONG_RUNNING_IDLE_TRANSACTION
                - HIGH_VOLUME_TRAFFIC_SPIKE
                - NOMINAL_FALSE_ALARM
            severity:
              type: string
              enum:
                - CRITICAL
                - WARNING
                - INFO
            culprit_pid:
              type: integer
            culprit_query:
              type: string
            root_cause_analysis:
              type: string
            immediate_remediation_sql:
              type: string
            preventive_recommendations:
              type: string
    prompt: |
      You are an autonomous Tier-1 Site Reliability Engineering (SRE) database investigator.
      Analyze the following live database incident telemetry and lock diagnostic summary:

      Incident Context:
      - Engine: {{ inputs.database_engine }}
      - Trigger Symptom: {{ inputs.alert_metric }}
      - Observed Degradation:
      """
      {{ inputs.incident_context }}
      """

      Session Telemetry Snapshot:
      {{ outputs.collect_diagnostic_telemetry.rows | json }}

      Investigation Protocol:
      1. Analyze the lock dependency hierarchy to find the root blocker session (pid holding ungranted locks while blocking downstream workers).
      2. Classify the incident verdict and evaluate operational severity (CRITICAL if core transactions are blocked for over 60 seconds).
      3. Generate the exact, safe remediation command (such as pg_cancel_backend or pg_terminate_backend) targeting only the root culprit PID.
      4. Provide architectural recommendations to prevent this lock contention pattern in future release migrations.

  - id: evaluate_severity_gate
    type: io.kestra.plugin.core.flow.If
    description: Branches resolution workflow based on whether investigation identified a critical blocker lock.
    condition: "{{ fromJson(outputs.investigate_incident.text).severity == 'CRITICAL' }}"
    then:
      - id: dispatch_sre_incident_card
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        description: Dispatches actionable diagnostic investigation card and copy-paste fix to SRE Slack channel.
        payload: |
          {
            "text": "🚨 *Database Incident Triage: {{ fromJson(outputs.investigate_incident.text).incident_verdict }}*\n*Severity:* `{{ fromJson(outputs.investigate_incident.text).severity }}` | *Engine:* `{{ inputs.database_engine }}`\n*Root Cause:* {{ fromJson(outputs.investigate_incident.text).root_cause_analysis }}\n*Culprit Process:* PID `{{ fromJson(outputs.investigate_incident.text).culprit_pid }}`\n*Offending Query:* \n```sql\n{{ fromJson(outputs.investigate_incident.text).culprit_query }}\n```\n*Immediate Remediation Command:* \n```sql\n{{ fromJson(outputs.investigate_incident.text).immediate_remediation_sql }}\n```\n*Preventive Guidance:* {{ fromJson(outputs.investigate_incident.text).preventive_recommendations }}"
          }
    else:
      - id: log_routine_health
        type: io.kestra.plugin.core.log.Log
        description: Logs advisory analysis when incident does not require immediate manual kill intervention.
        message: "Database investigation completed. Severity: {{ fromJson(outputs.investigate_incident.text).severity }}. Verdict: {{ fromJson(outputs.investigate_incident.text).incident_verdict }}."

triggers:
  - id: scheduled_health_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic scheduled audit of database session lock contention. Shipped disabled by default.
    cron: "0 */4 * * *"
    disabled: true

  - id: alert_webhook_trigger
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook endpoint triggered by Datadog, Prometheus, or CloudWatch alarms.
    key: "{{ secret('WEBHOOK_KEY') }}"

errors:
  - id: alert_investigation_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    description: Sends alert notice if autonomous investigation agent encounters an unhandled exception.
    payload: |
      {
        "text": "⚠️ Execution {{ execution.id }} failed in flow {{ flow.id }}. Autonomous database investigation agent encountered an unhandled exception."
      }


extend:
  title: Autonomous Database Incident Investigation Agent with DuckDB and AI
  shortDescription: Ingest database connection pool alerts, isolate lock trees using DuckDB diagnostics, and synthesize immediate remediation SQL via an autonomous AI SRE agent.
  metaTitle: Autonomous Database Incident Investigation Agent with Kestra
  metaDescription: Investigate database connection spikes and lock contention with DuckDB diagnostics and Kestra AI agent to synthesize copy-paste remediation commands.
  description: |
    Production database incidents (connection pool exhaustion, lock tree contention, hung transaction spikes) frequently trigger high-severity alerts outside standard business hours. When an incident occurs, on-call Site Reliability Engineers (SREs) are awakened and lose critical minutes manually running routine diagnostic queries (`pg_stat_activity`, lock dependency trees, active transactions) to identify the offending session.

    This blueprint implements an autonomous Tier-1 AI SRE investigation agent. When a connection pool or latency alert fires, the workflow ingests process session telemetry and runs relational lock tree diagnostics using in-memory DuckDB. Next, Kestra's AI plugin evaluates the lock graph against production database failure archetypes with strict JSON Schema constraints. It isolates the exact root-cause blocker PID and offending query, checks whether downstream checkout queries are hung, and delivers a copy-paste remediation SQL command (`pg_terminate_backend`) with architectural prevention guidance directly to Slack.

    ## How it works

    1. `collect_diagnostic_telemetry` (`io.kestra.plugin.jdbc.duckdb.Queries`): Ingests the active database session snapshot and computes lock dependency trees, isolating the longest-running unblocked root session.
    2. `investigate_incident` (`io.kestra.plugin.ai.agent.AIAgent`): Evaluates session telemetry and alert symptoms using Google Gemini (`gemini-2.5-flash`) with structured JSON Schema enforcement (`CRITICAL_LOCK_CONTENTION`, `LONG_RUNNING_IDLE_TRANSACTION`, `HIGH_VOLUME_TRAFFIC_SPIKE`), isolating the culprit PID and drafting the remediation SQL command.
    3. `evaluate_severity_gate` (`io.kestra.plugin.core.flow.If`):
       - If severity is `CRITICAL`: Posts an actionable investigation summary card to `#sre-incidents` in Slack containing the culprit PID, offending SQL, and copy-paste kill command.
       - Otherwise: Logs a nominal diagnostic report without generating unnecessary alert channel fatigue.
    4. `alert_investigation_failure` (`errors` block): Catches downstream connectivity failures or unhandled exceptions and notifies the on-call channel.

    ## What you get

    - Sub-second automated root-cause diagnosis for database lock contention and connection spikes.
    - Zero-setup demo execution out of the box via built-in diagnostic lock tree telemetry.
    - Deterministic relational dependency analysis combining DuckDB with foundational AI models.
    - Actionable copy-paste remediation commands ready for on-call engineers.
    - Centralized `pluginDefaults` keeping Slack webhook URLs out of individual task declarations.

    ## Who it's for

    - Site Reliability Engineers, Database Administrators, and DevOps Platform teams automating Tier-1 incident response and database health governance.

    ## Why orchestrate this with Kestra

    Scripting database incident triage with ad-hoc cron jobs or standalone Python scripts creates brittle infrastructure that lacks centralized secret management, observability, and structured AI response guarantees. Orchestrating with Kestra provides declarative scheduling, authenticated webhooks for APM alarms (Datadog, Prometheus), in-memory DuckDB analytical parsing, structured JSON Schema model reasoning, and an immutable execution audit trail in a single version-controlled YAML workflow.

    ## Pitfalls

    - **Terminating Critical Background Workers:** When executing remediation commands (`pg_terminate_backend`), ensure the target PID is a client worker session rather than an internal engine worker (such as the autovacuum launcher or logical replication worker), which can trigger crash recovery.
    - **Exclusive DDL Table Locks in Migrations:** Schema migrations that execute unindexed DDL (`ALTER TABLE ... ADD COLUMN`) hold an `AccessExclusiveLock`, blocking all read and write traffic. Production migrations should enforce strict session lock timeouts (`SET lock_timeout = '3s';`).
    - **Reconnection Storms Following Backend Cancellation:** Abruptly terminating high numbers of pooled client sessions can induce a thundering herd reconnection storm against database connection proxies (such as PgBouncer).
    - **Security Exposure in SQL Snippet Notifications:** Alert notifications sent to team channels should ensure raw SQL strings do not expose sensitive customer credentials or unmasked personal identifiers.

    ## Prerequisites

    - A Google Gemini API key with access to `gemini-2.5-flash`.
    - A Slack incoming webhook URL for on-call SRE notifications.

    ### Secrets

    - `GEMINI_API_KEY`: API key for Gemini foundational model execution.
    - `SLACK_WEBHOOK_URL`: Slack webhook endpoint for alert delivery.
    - `WEBHOOK_KEY`: Authentication secret for event-driven webhook execution.

    ## Quick start

    1. Execute the flow with default inputs to inspect the automated diagnosis of the sample DDL lock contention incident.
    2. Add `GEMINI_API_KEY` and `SLACK_WEBHOOK_URL` to your Kestra namespace secrets.
    3. Configure your monitoring alert (Datadog, Grafana, CloudWatch) to post incident webhooks to `alert_webhook_trigger`.

    ## Links

    - [Kestra AI Plugin Documentation](https://kestra.io/plugins/plugin-ai)
    - [DuckDB Documentation](https://duckdb.org/docs/)

    - This blueprint has been created by [sheikhlimon](https://github.com/sheikhlimon)
  tags:
    - AI
    - Infrastructure
  subTags:
    - Agents & Structured Output
    - Incident Response
  ee: false
  demo: false
