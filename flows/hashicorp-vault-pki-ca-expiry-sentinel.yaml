id: hashicorp-vault-pki-ca-expiry-sentinel
namespace: company.security

inputs:
  - id: vault_addr
    type: STRING
    defaults: http://vault.internal:8200
    description: Base URL of the HashiCorp Vault server.
  - id: pki_mount
    type: STRING
    defaults: pki
    description: Path where the PKI secrets engine is mounted.
  - id: warning_threshold_days
    type: INT
    defaults: 60
    description: Minimum remaining validity in days before triggering an expiration alert.

tasks:
  - id: inspect_pki_ca_cert
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s "{{ inputs.vault_addr }}/v1/{{ inputs.pki_mount }}/ca/pem" > ca.pem
        openssl x509 -enddate -noout -in ca.pem > enddate.txt
        python3 -c "
        import datetime
        with open('enddate.txt') as f:
            line = f.read().strip()
        date_str = line.replace('notAfter=', '')
        exp_date = datetime.datetime.strptime(date_str, '%b %d %H:%M:%S %Y %Z')
        now = datetime.datetime.utcnow()
        days_left = (exp_date - now).days
        alert_needed = days_left <= {{ inputs.warning_threshold_days }}
        result = {
            'mount': '{{ inputs.pki_mount }}',
            'expiration_date': str(exp_date),
            'days_remaining': days_left,
            'alert_triggered': alert_needed
        }
        import json
        with open('pki_summary.json', 'w') as out:
            json.dump(result, out)
        print('Vault PKI CA audit:', result)
        "
    outputFiles:
      - pki_summary.json

  - id: evaluate_ca_expiration
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.inspect_pki_ca_cert.outputFiles['pki_summary.json'])).alert_triggered }}"
    then:
      - id: alert_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *Vault PKI CA Expiration Alert*: Certificate Authority on mount `{{ inputs.pki_mount }}` expires in {{ fromJson(read(outputs.inspect_pki_ca_cert.outputFiles['pki_summary.json'])).days_remaining }} days (on {{ fromJson(read(outputs.inspect_pki_ca_cert.outputFiles['pki_summary.json'])).expiration_date }} UTC). CA rotation or re-issuance required."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Vault Sentinel Failure*: Failed to retrieve CA certificate from mount `{{ inputs.pki_mount }}` on {{ inputs.vault_addr }}."
      }

triggers:
  - id: weekly_ca_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true

extend:
  metaDescription: "Audits HashiCorp Vault PKI secret engines to detect impending root and intermediate CA certificate expirations."
  metaTitle: HashiCorp Vault PKI Engine CA Certificate Expiration Sentinel with Kestra
  title: HashiCorp Vault PKI Engine CA Certificate Expiration Sentinel
  shortDescription: Audits HashiCorp Vault PKI secret engines to detect impending root and intermediate CA certificate expirations.
  description: |
    ## How it works
    This sentinel retrieves the public CA certificate from the specified Vault PKI mount point via `/v1/{mount}/ca/pem` and parses the `notAfter` X.509 date using OpenSSL. It alerts SecOps teams when a certificate authority approaches expiration, providing sufficient lead time for intermediate CA re-issuance.

    ## What you get
    - Continuous validation of internal PKI infrastructure lifecycles.
    - Early prevention of catastrophic mTLS and internal service authentication failures.
    - Automated Slack delivery tracking PKI mount, expiration timestamp, and days remaining.

    ## Who it's for
    - Security operations (SecOps) teams and cryptography leads managing internal PKI.
    - Platform engineers running service meshes and mTLS architectures.

    ## Why orchestrate this with Kestra
    Kestra automates distributed system observability, executing scheduled health checks with fine-grained error management and notification delivery.

    ## Prerequisites
    - HashiCorp Vault server with PKI secrets engine mounted.
    - OpenSSL installed in the execution environment.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `vault_addr` and `pki_mount`.
    3. Run manually to check current CA certificate expiration.

    ## How to extend
    - Automatically generate an intermediate CSR via `/pki/intermediate/generate/internal`.
    - Loop across all mounted PKI engines using `/v1/sys/mounts`.
    - Export certificate telemetry to an internal compliance dashboard.

    ## Links
    - [HashiCorp Vault PKI Secrets Engine](https://developer.hashicorp.com/vault/api-docs/secret/pki)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
