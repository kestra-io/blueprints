id: hashicorp-vault-pki-ca-expiry-sentinel
namespace: company.team
description: Audits HashiCorp Vault PKI secret engines to detect impending root and intermediate CA certificate expirations.

inputs:
  - id: vault_addr
    type: STRING
    defaults: "http://vault.internal:8200"
    description: Base URL of the HashiCorp Vault server.

  - id: pki_mount
    type: STRING
    defaults: "pki"
    description: Path where the PKI secrets engine is mounted.

  - id: warning_threshold_days
    type: INT
    defaults: 60
    description: Minimum remaining validity in days before triggering an expiration alert.

tasks:
  - id: inspect_pki_ca_cert
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests cryptography kestra
    description: Download CA cert from Vault and calculate remaining days until expiration
    env:
      VAULT_ADDR: "{{ inputs.vault_addr }}"
      PKI_MOUNT: "{{ inputs.pki_mount }}"
      WARNING_THRESHOLD_DAYS: "{{ inputs.warning_threshold_days }}"
      VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
    script: |
      import os
      import sys
      import datetime
      import requests
      from cryptography import x509
      from cryptography.hazmat.backends import default_backend
      from kestra import Kestra

      vault_addr = os.environ.get("VAULT_ADDR", "http://vault.internal:8200").rstrip("/")
      pki_mount = os.environ.get("PKI_MOUNT", "pki").strip("/")
      threshold_days = int(os.environ.get("WARNING_THRESHOLD_DAYS", "60"))
      token = os.environ.get("VAULT_TOKEN")

      headers = {"User-Agent": "Kestra-Vault-Sentinel"}
      if token:
          headers["X-Vault-Token"] = token

      url = f"{vault_addr}/v1/{pki_mount}/ca/pem"
      try:
          resp = requests.get(url, headers=headers, timeout=30)
          resp.raise_for_status()
          pem_bytes = resp.content
      except Exception as e:
          print(f"CRITICAL: Failed to retrieve CA cert from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      try:
          cert = x509.load_pem_x509_certificate(pem_bytes, default_backend())
          not_after = getattr(cert, "not_valid_after_utc", None)
          if not_after is None:
              not_after = cert.not_valid_after.replace(tzinfo=datetime.timezone.utc)
          now = datetime.datetime.now(datetime.timezone.utc)
          days_left = (not_after - now).days
      except Exception as e:
          print(f"CRITICAL: Failed to parse X.509 certificate: {e}", file=sys.stderr)
          sys.exit(1)

      alert_needed = days_left <= threshold_days
      print(f"PKI CA on {pki_mount} expires on {not_after.isoformat()} ({days_left} days remaining, threshold={threshold_days})")

      Kestra.outputs({
          "mount": pki_mount,
          "expiration_date": not_after.isoformat(),
          "days_remaining": days_left,
          "alert_triggered": alert_needed
      })

  - id: evaluate_ca_expiration
    type: io.kestra.plugin.core.flow.If
    description: Alert security team if CA certificate expires within warning threshold
    condition: "{{ outputs.inspect_pki_ca_cert.vars.alert_triggered == true }}"
    then:
      - id: alert_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *Vault PKI CA Expiration Alert*: Certificate Authority on mount `{{ inputs.pki_mount }}` expires in *{{ outputs.inspect_pki_ca_cert.vars.days_remaining }} days* (on {{ outputs.inspect_pki_ca_cert.vars.expiration_date }} UTC). CA rotation or re-issuance required to avoid service mTLS authentication failures."
          }

outputs:
  - id: days_remaining
    type: INT
    value: "{{ outputs.inspect_pki_ca_cert.vars.days_remaining }}"
  - id: expiration_date
    type: STRING
    value: "{{ outputs.inspect_pki_ca_cert.vars.expiration_date }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.inspect_pki_ca_cert.vars.alert_triggered }}"

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Vault Sentinel Failure*: Failed to retrieve or validate CA certificate from mount `{{ inputs.pki_mount }}` on {{ inputs.vault_addr }} during execution `{{ execution.id }}`."
      }

triggers:
  - id: weekly_ca_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true

extend:
  metaDescription: Audits HashiCorp Vault PKI secret engines to detect impending root and intermediate CA certificate expirations.
  metaTitle: HashiCorp Vault PKI Engine CA Certificate Expiration Sentinel with Kestra
  title: HashiCorp Vault PKI Engine CA Certificate Expiration Sentinel
  shortDescription: Audits HashiCorp Vault PKI secret engines to detect impending root and intermediate CA certificate expirations.
  description: |
    ## How it works
    This sentinel retrieves the public CA certificate from the specified Vault PKI mount point via `/v1/{mount}/ca/pem` and parses the X.509 date attributes. It alerts SecOps teams when a certificate authority approaches expiration, providing sufficient lead time for intermediate CA re-issuance.

    ## What you get
    - Continuous validation of internal PKI infrastructure lifecycles.
    - Early prevention of catastrophic mTLS and internal service authentication failures.
    - Automated Slack delivery tracking PKI mount, expiration timestamp, and days remaining.

    ## Who it's for
    - Security operations (SecOps) teams and cryptography leads managing internal PKI.
    - Platform engineers running service meshes and mTLS architectures.

    ## Prerequisites
    - HashiCorp Vault server with PKI secrets engine mounted.
    - Secret `SLACK_WEBHOOK_URL` and `VAULT_TOKEN` configured in Kestra.
  tags:
    - Infrastructure
    - Security
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
