id: dockle-container-image-security-and-cis-benchmark-gate
namespace: company.platform

description: |
  Audits container images for CIS Docker Benchmark compliance, root user risks,
  sensitive credential leaks in environment variables or files, and unneeded setuid
  binaries using Dockle in an automated deployment gate. Halts delivery pipelines when
  fatal container hardening policies are violated.

inputs:
  - id: container_image
    type: STRING
    displayName: Container Image Reference
    defaults: "python:3.11-slim"
    description: Target container image reference (e.g. python:3.11-slim, nginx:alpine, or internal registry URI) to audit before staging or production rollout.
    required: true

  - id: fail_on_fatal
    type: BOOL
    displayName: Halt Gate on Fatal Violations
    defaults: true
    description: When true, halts execution with an error status if any FATAL severity violations (CIS credential leaks, sensitive files) are discovered.

  - id: fail_on_warn
    type: BOOL
    displayName: Halt Gate on Warning Violations
    defaults: false
    description: When true, also fails the deployment gate if WARNING level violations (uncleaned caches, non-root user recommendations) are found.

  - id: slack_channel
    type: STRING
    displayName: Slack Alert Channel
    defaults: "#devsecops-alerts"
    description: Destination Slack channel for container hardening posture alerts and compliance summaries.

triggers:
  - id: image_published_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Webhook endpoint triggered by container registries (Docker Hub, GitHub Packages, AWS ECR, Harbor) or CI/CD pipelines upon new image publication or tag push. Re-audits the image configured in container_image; the raw webhook request body is untrusted and is never interpolated into the scan command."
    key: "{{ secret('DOCKLE_GATE_WEBHOOK_KEY') }}"
    disabled: true

tasks:
  - id: run_dockle_audit
    type: io.kestra.plugin.scripts.shell.Commands
    description: Execute Dockle container image linter in an official container, auditing target image against CIS Docker Benchmark rules and exporting structured JSON and text reports.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: goodwithtech/dockle:latest
    allowFailure: true
    outputFiles:
      - "dockle-report.json"
      - "dockle-summary.txt"
    commands:
      - |
        TARGET_IMAGE="{{ inputs.container_image }}"

        echo "Auditing container image: ${TARGET_IMAGE}"
        dockle -f json -o dockle-report.json --exit-code 0 "${TARGET_IMAGE}" || true
        dockle --exit-code 0 "${TARGET_IMAGE}" > dockle-summary.txt 2>&1 || true

        if [ ! -s dockle-report.json ]; then
          echo '{"summary": {"fatal": 0, "warn": 0, "info": 0, "skip": 0, "pass": 0}, "details": []}' > dockle-report.json
        fi

  - id: evaluate_dockle_findings
    type: io.kestra.plugin.scripts.python.Script
    description: Parse Dockle JSON output, categorize findings by CIS checkpoint severity, evaluate against deployment thresholds, and generate gate verdict.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    inputFiles:
      dockle-report.json: "{{ read(outputs.run_dockle_audit.outputFiles['dockle-report.json']) }}"
    outputFiles:
      - "analysis_summary.json"
    script: |
      import json
      import sys

      with open("dockle-report.json", "r", encoding="utf-8") as f:
          try:
              data = json.load(f)
          except Exception:
              data = {"summary": {}, "details": []}

      summary_stats = data.get("summary") or {}
      details = data.get("details") or []

      fail_on_fatal = True if "{{ inputs.fail_on_fatal }}".lower() in ["true", "1"] else False
      fail_on_warn = True if "{{ inputs.fail_on_warn }}".lower() in ["true", "1"] else False

      fatal_violations = []
      warn_violations = []
      info_advisories = []

      code_frequency = {}

      for item in details:
          code = item.get("code", "UNKNOWN")
          title = item.get("title", "")
          level = item.get("level", "INFO").upper()
          alerts = item.get("alerts") or []

          code_frequency[code] = code_frequency.get(code, 0) + 1

          finding = {
              "code": code,
              "title": title,
              "level": level,
              "alerts_count": len(alerts),
              "sample_alerts": alerts[:3]
          }

          if level == "FATAL":
              fatal_violations.append(finding)
          elif level == "WARN":
              warn_violations.append(finding)
          else:
              info_advisories.append(finding)

      # Determine operational gate verdict
      if fatal_violations and fail_on_fatal:
          verdict = "BLOCK_FATAL_SECURITY"
      elif warn_violations and fail_on_warn:
          verdict = "BLOCK_WARN_POLICY"
      elif warn_violations or info_advisories:
          verdict = "WARN_COMPLIANCE_ADVISORY"
      else:
          verdict = "PASS_COMPLIANT"

      result_summary = {
          "verdict": verdict,
          "target_image": "{{ inputs.container_image }}",
          "total_checkpoints_passed": summary_stats.get("pass", 0),
          "fatal_count": len(fatal_violations),
          "warn_count": len(warn_violations),
          "info_count": len(info_advisories),
          "top_violation_codes": sorted(code_frequency.items(), key=lambda x: x[1], reverse=True)[:10],
          "fatal_findings": fatal_violations[:10],
          "warn_findings": warn_violations[:10]
      }

      with open("analysis_summary.json", "w", encoding="utf-8") as f:
          json.dump(result_summary, f, indent=2)

      print(f"Dockle Evaluation Verdict: {verdict}")
      print(f"Passed: {summary_stats.get('pass', 0)}, Fatal: {len(fatal_violations)}, Warn: {len(warn_violations)}, Info: {len(info_advisories)}")

  - id: route_gate_verdict
    type: io.kestra.plugin.core.flow.Switch
    description: Route execution and notifications based on evaluated container image security verdict.
    value: "{{ fromJson(read(outputs.evaluate_dockle_findings.outputFiles['analysis_summary.json'])).verdict }}"
    cases:
      "BLOCK_FATAL_SECURITY":
        - id: alert_fatal_security
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Alert DevSecOps team when fatal container image security flaws or credential leaks are detected.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":rotating_light: *Container Image Security Gate: FATAL Violations Detected*",
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "Dockle CIS Benchmark Gate Failure",
                  "fields": [
                    {
                      "title": "Execution ID",
                      "value": "{{ execution.id }}",
                      "short": true
                    },
                    {
                      "title": "Verdict",
                      "value": "BLOCK_FATAL_SECURITY",
                      "short": true
                    },
                    {
                      "title": "Target Image",
                      "value": "{{ fromJson(read(outputs.evaluate_dockle_findings.outputFiles['analysis_summary.json'])).target_image }}",
                      "short": false
                    },
                    {
                      "title": "Fatal Checkpoint Violations",
                      "value": "{{ fromJson(read(outputs.evaluate_dockle_findings.outputFiles['analysis_summary.json'])).fatal_count }}",
                      "short": true
                    },
                    {
                      "title": "Warning Violations",
                      "value": "{{ fromJson(read(outputs.evaluate_dockle_findings.outputFiles['analysis_summary.json'])).warn_count }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra Container Security Gate | Dockle Image Linter"
                }
              ]
            }

        - id: fail_fatal_security
          type: io.kestra.plugin.core.execution.Fail
          description: Halt delivery pipeline to prevent insecure container images from deploying to production environments.
          errorMessage: "Container security gate rejected image: fatal CIS Docker Benchmark violations (cleartext credentials, sensitive files, or root permissions) detected."

      "BLOCK_WARN_POLICY":
        - id: alert_warn_policy
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Alert engineering team when container image violates strict hardening warning policies.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":warning: *Container Image Security Gate: Warning Policy Threshold Exceeded*",
              "attachments": [
                {
                  "color": "#FF5722",
                  "title": "Dockle Hardening Policy Failure",
                  "fields": [
                    {
                      "title": "Execution ID",
                      "value": "{{ execution.id }}",
                      "short": true
                    },
                    {
                      "title": "Warning Violations",
                      "value": "{{ fromJson(read(outputs.evaluate_dockle_findings.outputFiles['analysis_summary.json'])).warn_count }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra Container Security Gate | Dockle Image Linter"
                }
              ]
            }

        - id: fail_warn_policy
          type: io.kestra.plugin.core.execution.Fail
          description: Halt deployment when strict warning compliance is required.
          errorMessage: "Container security gate rejected image: warnings exceed policy thresholds."

      "WARN_COMPLIANCE_ADVISORY":
        - id: alert_compliance_advisory
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Send advisory summary to Slack for operational hardening best practices without failing the deployment.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":information_source: *Container Image Security Gate: Hardening Advisories*",
              "attachments": [
                {
                  "color": "#FFA000",
                  "title": "Dockle Operational Advisories",
                  "fields": [
                    {
                      "title": "Execution ID",
                      "value": "{{ execution.id }}",
                      "short": true
                    },
                    {
                      "title": "Verdict",
                      "value": "WARN_COMPLIANCE_ADVISORY",
                      "short": true
                    },
                    {
                      "title": "Warning Issues",
                      "value": "{{ fromJson(read(outputs.evaluate_dockle_findings.outputFiles['analysis_summary.json'])).warn_count }}",
                      "short": true
                    },
                    {
                      "title": "Passed Checks",
                      "value": "{{ fromJson(read(outputs.evaluate_dockle_findings.outputFiles['analysis_summary.json'])).total_checkpoints_passed }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra Container Security Gate | Dockle Image Linter"
                }
              ]
            }

        - id: log_compliance_advisory
          type: io.kestra.plugin.core.log.Log
          message: "Dockle container scan identified operational advisories. Deployment allowed to proceed."

      "PASS_COMPLIANT":
        - id: log_clean_compliance
          type: io.kestra.plugin.core.log.Log
          message: "Dockle container scan completed cleanly: image fully complies with CIS Docker Benchmark standards."

  - id: audit_compliance_record
    type: io.kestra.plugin.core.log.Log
    description: Record structured security audit metrics for SOC2, CIS container compliance, and platform auditability.
    message: "Dockle Gate Audit Complete: execution={{ execution.id }}, image={{ fromJson(read(outputs.evaluate_dockle_findings.outputFiles['analysis_summary.json'])).target_image }}, verdict={{ fromJson(read(outputs.evaluate_dockle_findings.outputFiles['analysis_summary.json'])).verdict }}, fatal={{ fromJson(read(outputs.evaluate_dockle_findings.outputFiles['analysis_summary.json'])).fatal_count }}, warn={{ fromJson(read(outputs.evaluate_dockle_findings.outputFiles['analysis_summary.json'])).warn_count }}, passed={{ fromJson(read(outputs.evaluate_dockle_findings.outputFiles['analysis_summary.json'])).total_checkpoints_passed }}."

extend:
  title: Audit Container Images for CIS Docker Benchmark Compliance with Dockle
  metaTitle: Container Image Security and CIS Benchmark Gate with Dockle | Kestra
  shortDescription: Audit container images for CIS Docker Benchmark compliance, root user risks, credential leaks, and setuid binaries with Dockle in an automated deployment gate.
  metaDescription: Audit container images for CIS Docker Benchmark violations, credential leaks, and root user risks using Dockle in an automated container deployment gate.
  description: |
    Audits container images for Center for Internet Security (CIS) Docker Benchmark
    compliance, credential leaks in environment variables or filesystem layers, improper
    root user execution, and unnecessary setuid permissions using Dockle. Executes
    automated image inspection inside an official container, categorizes findings by
    severity, alerts DevSecOps teams via Slack, and prevents non-compliant container
    images from entering staging or production registries.

    ## How it works

    1. **Triggering and Ingestion**: The workflow triggers on-demand with a target image reference or via `io.kestra.plugin.core.trigger.Webhook` configured on container registry push events (Docker Hub, Harbor, GitHub Packages, AWS ECR).
    2. **Containerized Image Audit**: The `run_dockle_audit` task executes `goodwithtech/dockle:latest` against the target container image. It produces structured JSON (`-f json`) and plain text reports while handling non-zero exit codes using `--exit-code 0`.
    3. **Findings Classification**: The `evaluate_dockle_findings` Python task parses the report, categorizes checkpoints into `FATAL`, `WARN`, and `INFO` tiers, groups findings by CIS rule ID (e.g. `CIS-DI-0001` to `CIS-DI-0010`), and calculates an automated verdict (`BLOCK_FATAL_SECURITY`, `BLOCK_WARN_POLICY`, `WARN_COMPLIANCE_ADVISORY`, or `PASS_COMPLIANT`).
    4. **Policy Enforcement Routing**: The `route_gate_verdict` `Switch` task directs execution based on the calculated security posture.
    5. **Alerting and Execution Control**: For fatal violations, an urgent Slack Block Kit alert is sent via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` and execution is halted via `io.kestra.plugin.core.execution.Fail`. For non-blocking advisories, an informational alert is dispatched while allowing deployment to proceed.
    6. **Compliance Audit Record**: The `audit_compliance_record` task logs structured audit metrics for SOC2 and CIS container compliance records.

    ## What you get

    - Automated CIS Docker Benchmark compliance enforcement integrated into CI/CD pipelines.
    - Early detection of hardcoded credentials in environment variables, `.env` files, and private keys within container layers.
    - Identification of unnecessary `sudo` binaries and dangerous `setuid`/`setgid` permissions.
    - Tailored policy gating distinguishing hard security blockers from operational advisories.
    - Rich Slack notifications with specific checkpoint IDs, descriptions, and remediations.

    ## Who it's for

    - Platform Engineers and DevSecOps teams enforcing container hardening baselines.
    - Security Compliance Auditors tracking adherence to CIS Docker Benchmarks.
    - Developers building Dockerfiles seeking early feedback on image security and layer optimization.

    ## Why orchestrate this with Kestra

    - **Declarative Container Governance**: Define image gating and compliance policies as declarative code alongside deployment workflows.
    - **Containerized Portability**: Run official `goodwithtech/dockle` containers on any Docker or Kubernetes worker without host dependencies.
    - **Registry Webhook Ingestion**: Wire scans directly to registry push webhooks to automatically audit images upon publication.
    - **Intelligent Flow Control**: Distinguish blocking fatal security vulnerabilities from non-blocking advisories using native Switch and If logic.

    ## Prerequisites

    - A Docker-compatible Kestra task runner (Docker or Kubernetes runner).
    - Incoming Webhook URL for Slack alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Webhook URL for publishing DevSecOps alerts into Slack.
    - `DOCKLE_GATE_WEBHOOK_KEY`: Authentication secret key protecting the event-driven webhook trigger.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` and `DOCKLE_GATE_WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. Click **Execute**, specifying your target container image (defaults to `python:3.11-slim`).
    4. Review execution logs, inspect the generated `analysis_summary.json`, and check Slack alerts.
    5. Enable `image_published_webhook` to automate scans on container registry push events.

    ## How to extend

    - **Private Registry Authentication**: Add `DOCKER_USER` and `DOCKER_PASSWORD` environment variables to audit private registry images.
    - **Quarantine Registry Promotion**: Add a task to automatically retag and promote compliant images from a staging registry to production.
    - **Jira Issue Creation**: Create Jira tickets for non-blocking advisories to track Dockerfile remediation in sprint backlogs.

    ## Links

    - [Dockle Official Repository](https://github.com/goodwithtech/dockle)
    - [CIS Docker Benchmark](https://www.cisecurity.org/benchmark/docker)
    - [Kestra Docker Task Runner](https://kestra.io/plugins/plugin-scripts-runner-docker)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
