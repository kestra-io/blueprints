id: aes-argon2id-cryptographic-landing-and-compliance-gate
namespace: company.security

inputs:
  - id: incoming_payload
    type: STRING
    defaults: "Confidential PII Dataset: Customer Financial Records 2026-Q4"
    description: Raw sensitive data payload staged in the landing zone for encryption.

  - id: key_derivation
    type: STRING
    defaults: ARGON2ID
    description: Memory-hard key derivation function (ARGON2ID, SCRYPT, or PBKDF2_SHA256).

  - id: argon2_time_cost
    type: INT
    defaults: 3
    description: Argon2id computational time cost iterations (default 3).

  - id: argon2_memory_kb
    type: INT
    defaults: 65536
    description: Memory hardness in KiB allocated for Argon2id key derivation (default 64MB).

variables:
  secops_channel: "#secops-alerts"

triggers:
  - id: schedule_hourly_landing_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

tasks:
  - id: stage_incoming_dataset
    type: io.kestra.plugin.core.storage.Write
    content: "{{ inputs.incoming_payload }}"
    extension: ".csv"

  - id: encrypt_landing_dataset
    type: io.kestra.plugin.compress.FileEncrypt
    from: "{{ outputs.stage_incoming_dataset.uri }}"
    password: "{{ secret('DATA_ENCRYPTION_PASSPHRASE') }}"
    keyDerivation: "{{ inputs.key_derivation }}"
    argon2TimeCost: "{{ inputs.argon2_time_cost }}"
    memory: "{{ inputs.argon2_memory_kb }}"
    parallelism: 1

  - id: verify_cryptographic_roundtrip
    type: io.kestra.plugin.compress.FileDecrypt
    from: "{{ outputs.encrypt_landing_dataset.uri }}"
    password: "{{ secret('DATA_ENCRYPTION_PASSPHRASE') }}"

  - id: classify_cryptographic_health
    type: io.kestra.plugin.core.execution.Labels
    labels:
      compliance_status: >-
        {{ (outputs.encrypt_landing_dataset.length > 0 and outputs.verify_cryptographic_roundtrip.length == outputs.stage_incoming_dataset.length) ? 'COMPLIANT_SECURED' : 'CRITICAL_INTEGRITY_FAILURE' }}

  - id: handle_compliance_tier
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ taskrun.labels.compliance_status }}"
    cases:
      CRITICAL_INTEGRITY_FAILURE:
        - id: alert_cryptographic_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ vars.secops_channel }}",
              "text": "CRITICAL: Cryptographic round-trip integrity failure detected on landing dataset. Staged size: {{ outputs.stage_incoming_dataset.length }} bytes, Decrypted size: {{ outputs.verify_cryptographic_roundtrip.length | default(0) }} bytes. Execution ID: {{ execution.id }}"
            }
      COMPLIANT_SECURED:
        - id: notify_compliance_secured
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ vars.secops_channel }}",
              "text": "SUCCESS: Dataset encrypted with AES-256 ({{ inputs.key_derivation }}). Integrity verified. Encrypted payload ready at {{ outputs.encrypt_landing_dataset.uri }}. Execution ID: {{ execution.id }}"
            }

  - id: log_compliance_audit
    type: io.kestra.plugin.core.log.Log
    message: |
      Cryptographic Landing Compliance Audit Summary:
      Algorithm: AES-256 (GCM Authenticated)
      Key Derivation: {{ inputs.key_derivation }}
      Staged Payload Size: {{ outputs.stage_incoming_dataset.length }} bytes
      Encrypted Artifact Size: {{ outputs.encrypt_landing_dataset.length }} bytes
      Decrypted Verification Size: {{ outputs.verify_cryptographic_roundtrip.length }} bytes
      Compliance Status: {{ taskrun.labels.compliance_status }}
      Execution ID: {{ execution.id }}
      Timestamp: {{ execution.startDate }}

extend:
  title: AES-256 Argon2id Cryptographic Landing and Compliance Gate
  metaTitle: AES-256 Argon2id Cryptographic Landing Gate | Kestra
  shortDescription: Enforces memory-hard AES-256 Argon2id file encryption on landing zone datasets, verifies cryptographic round-trip integrity, and notifies SecOps.
  metaDescription: Automate AES-256 Argon2id cryptographic data landing compliance, verify round-trip integrity, and alert SecOps before ingesting PII into data warehouses.
  description: |
    Regulatory standards such as GDPR, HIPAA, and PCI-DSS mandate strict encryption-at-rest for sensitive extracts, PII, and financial reports landing in object stores and staging volumes. Simply depositing unencrypted data or relying on weak legacy key derivation functions leaves analytics environments exposed to exfiltration and integrity tampering.

    This sentinel workflow automates cryptographic compliance for landing zones. Using Kestra native AES-256 file encryption with memory-hard Argon2id key derivation, the flow secures staged datasets, validates bidirectional cryptographic round-trip decryption to guarantee non-corruption, routes outcomes through a policy evaluation switch, dispatches Slack alerts to SecOps, and generates an immutable cryptographic compliance audit ledger.

    ## How it works

    1. An automated `Schedule` trigger executes hourly or upon new batch ingestion events in the data landing zone.
    2. The workflow stages incoming batch extracts via `io.kestra.plugin.core.storage.Write` into internal storage.
    3. The file encryption task `io.kestra.plugin.compress.FileEncrypt` applies AES-256-GCM encryption with Argon2id memory-hard key derivation to prevent GPU-based brute-force attacks.
    4. To guarantee that key rotation or derivation errors never lock out downstream pipelines, `io.kestra.plugin.compress.FileDecrypt` runs a verification pass on the encrypted artifact.
    5. A `Labels` task compares the original and decrypted byte lengths to classify status into `COMPLIANT_SECURED` or `CRITICAL_INTEGRITY_FAILURE`.
    6. A `Switch` flow-control task directs execution: critical alerts are dispatched to SecOps if tampering or corruption occurs, while compliant workflows dispatch readiness confirmations.
    7. A final `Log` task outputs structured cryptographic audit telemetry recording key derivation parameters, byte metrics, and execution IDs.

    ## What you get

    - Automated GPU-resistant AES-256-GCM encryption for sensitive files entering the data platform.
    - Guaranteed zero-loss verification by validating round-trip decryption before purging plaintext originals.
    - Prevention of unencrypted PII or corrupted ciphertexts from reaching production data warehouse tables.
    - Instant Slack alerts directed to SecOps with full execution and failure telemetry.
    - Complete declarative audit trails recording key derivation algorithms, iteration costs, and file checksum sizes.

    ## Who it's for

    - Security Engineers enforcing zero-trust data landing policies across distributed cloud environments.
    - Data Platform Engineers handling sensitive customer financial records, medical claims, or PII extracts.
    - Compliance Officers requiring verifiable proof of encryption-at-rest and cryptographic round-trip testing.

    ## Why orchestrate this with Kestra

    - Built-in BouncyCastle cryptographic engines eliminate the need for containerized OpenSSL wrappers or complex bash scripts.
    - Native internal storage abstraction manages encrypted file handles across distributed worker clusters seamlessly.
    - Centralized namespace secrets management protects encryption passphrases from leaking into plaintext logs.
    - End-to-end execution histories provide auditable evidence for security compliance reviews and SOC 2 audits.

    ## Prerequisites

    - Kestra instance with default storage enabled (local or cloud storage backend).
    - An active Slack Incoming Webhook URL configured for incident dispatch.

    ### Secrets

    - `DATA_ENCRYPTION_PASSPHRASE`: Secure master passphrase used to derive AES-256 encryption keys via Argon2id (required).
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for posting cryptographic compliance alerts (required).

    ## Quick start

    1. Set the `DATA_ENCRYPTION_PASSPHRASE` and `SLACK_WEBHOOK_URL` secrets in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Click **Execute** with default parameters to test encryption, verification, and audit logging.
    4. Enable the schedule or trigger the flow from upstream landing notifications.

    ## How to extend

    - Connect downstream warehouse ingestion tasks (e.g., Snowflake, BigQuery, ClickHouse) inside the `COMPLIANT_SECURED` branch to resume processing only after cryptographic approval.
    - Add file hashing with SHA-256 before encryption and after decryption for cryptographic bit-level integrity assertions.
    - Configure automated dead-letter quarantine routing to isolate corrupted files into restricted cloud buckets.

    ## Links

    - [Kestra Compress and Encryption Plugin Documentation](https://kestra.io/plugins/plugin-compress)
    - [Argon2 Specification and Benchmarks](https://github.com/P-H-C/phc-winner-argon2)
  tags:
    - Data
  subTags:
    - ELT & Data Landing
    - Testing & Quality
  ee: false
  demo: false
