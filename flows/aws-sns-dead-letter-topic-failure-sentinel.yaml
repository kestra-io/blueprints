id: aws-sns-dead-letter-topic-failure-sentinel
namespace: company.cloud

description: |
  Audits Amazon SNS subscription delivery status and Dead Letter Queue (DLQ)
  redrive metrics via CloudWatch, detects subscriber notification drops, opens
  an automated GitHub SecOps/Cloud incident issue, and alerts Slack.

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: us-east-1

  - id: topic_name
    type: STRING
    displayName: SNS Topic Name
    defaults: production-security-alerts

  - id: target_repository
    type: STRING
    displayName: Infrastructure Issue Tracking Repository
    defaults: my-org/cloud-operations

triggers:
  - id: periodic_sns_dlq_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_sns_delivery_metrics
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Interrogates CloudWatch for NumberOfNotificationsFailed metrics on target SNS topic
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.aws_region }}"
    commands:
      - aws cloudwatch get-metric-data --metric-data-queries '[{"Id":"m1","MetricStat":{"Metric":{"Namespace":"AWS/SNS","MetricName":"NumberOfNotificationsFailed","Dimensions":[{"Name":"TopicName","Value":"{{ inputs.topic_name }}"}]},"Period":900,"Stat":"Sum"},"ReturnData":true}]' --start-time $(date -u -v-15M +%Y-%m-%dT%H:%M:%SZ) --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) --output json | tr -d '\n' | xargs -0 -I {} echo '::{"outputs":{}}::'

  - id: evaluate_failed_notifications
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates whether any delivery failures occurred across SNS subscribers
    value:
      topic: "{{ inputs.topic_name }}"
      failed_count: "{{ outputs.probe_sns_delivery_metrics.vars.MetricDataResults[0].Values[0] ?? 0 }}"
      has_failures: "{{ (outputs.probe_sns_delivery_metrics.vars.MetricDataResults[0].Values[0] ?? 0) > 0 }}"

  - id: branch_on_sns_failures
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether SNS delivery failures were detected
    condition: "{{ outputs.evaluate_failed_notifications.value.has_failures == true }}"
    then:
      - id: create_sns_incident_issue
        type: io.kestra.plugin.github.issues.Create
        description: Logs a prioritized GitHub issue documenting SNS subscriber delivery failures
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.target_repository }}"
        title: "[SNS Alert] Subscriber Notification Delivery Failures Detected on: {{ inputs.topic_name }}"
        body: |
          ## 🚨 Amazon SNS Subscriber Delivery Failure Alert

          The cloud notification sentinel detected dropped subscriber messages on Amazon SNS:
          - **Topic Name:** `{{ inputs.topic_name }}`
          - **AWS Region:** `{{ inputs.aws_region }}`
          - **Failed Notifications (Last 15m):** **{{ outputs.evaluate_failed_notifications.value.failed_count }}**

          Please inspect subscription endpoint accessibility, IAM permission policies, and DLQ dead letter queues.
          *Generated automatically by Kestra AWS SNS Sentinel.*

      - id: alert_cloud_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts cloud operations Slack channel with failure count and issue hyperlink
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🚨 *Amazon SNS Delivery Failure Alert*\n*Topic:* `" ~ inputs.topic_name ~ "` (" ~ inputs.aws_region ~ ")\n*Failed Notifications:* *" ~ outputs.evaluate_failed_notifications.value.failed_count ~ "*\n*Incident Ticket:* <" ~ (outputs.create_sns_incident_issue.issueUrl ?? "#") ~ "|View GitHub Issue>"
          } | toJson }}

    else:
      - id: log_sns_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Amazon SNS topic {{ inputs.topic_name }} has zero delivery failures in the last 15 minutes."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final audit status log recording SNS delivery health
    message: "SNS delivery audit complete for {{ inputs.topic_name }}. Failed notifications: {{ outputs.evaluate_failed_notifications.value.failed_count }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when CloudWatch API queries fail
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *Amazon SNS Sentinel Failed* in execution `" ~ execution.id ~ "`. Unable to query CloudWatch metrics for `" ~ inputs.topic_name ~ "`."
      } | toJson }}

extend:
  title: "Amazon SNS Subscription Delivery Failure and DLQ Sentinel"
  shortDescription: "Audit Amazon SNS subscriber delivery drops via CloudWatch, detect failed notification bursts, log GitHub issues, and alert Slack."
  metaTitle: "Amazon SNS Subscription Delivery Sentinel with Kestra"
  metaDescription: "Monitor Amazon SNS subscriber notification delivery and DLQ failures with Kestra. Query CloudWatch, open GitHub issues, and alert Slack."
  description: |
    Amazon Simple Notification Service (SNS) acts as a high-throughput fan-out messaging hub, pushing events to SQS queues, HTTP/HTTPS webhooks, AWS Lambda functions, and SMS endpoints. When subscriber endpoints fail authentication, time out, or throw 5xx server errors, SNS retries delivery according to its backoff policy before routing poison messages to dead-letter queues (DLQs) or dropping them completely. This blueprint queries Amazon CloudWatch for `NumberOfNotificationsFailed` on target topics periodically, identifies delivery drops, logs an automated GitHub incident issue, and alerts cloud operations teams via Slack.

    ## How it works

    1. `periodic_sns_dlq_check` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every 15 minutes (shipped disabled for safe verification).
    2. `probe_sns_delivery_metrics` (`io.kestra.plugin.aws.cli.AwsCLI`) queries CloudWatch for `NumberOfNotificationsFailed` across the previous 15-minute window.
    3. `evaluate_failed_notifications` (`io.kestra.plugin.core.debug.Return`) evaluates whether any failed deliveries occurred (`has_failures == true`).
    4. `branch_on_sns_failures` (`io.kestra.plugin.core.flow.If`) evaluates the condition:
       - `then`: Automatically files a GitHub tracking issue via `create_sns_incident_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the Slack channel via `alert_cloud_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_sns_healthy`) confirming 100% delivery success.
    5. `log_audit_complete` (`io.kestra.plugin.core.log.Log`) records the final health summary.
    6. The `errors` block alerts Slack if AWS API calls time out or credentials expire.

    ## What you get

    - Automated, continuous auditing of Amazon SNS subscriber delivery health.
    - Zero silent drops when webhook endpoints or downstream queues fail.
    - Consolidated GitHub incident tickets with topic names, regions, and failed counts.
    - Real-time Slack notifications with direct ticket hyperlinks.

    ## Who it's for

    - Cloud Platform Engineers and SREs maintaining AWS event-driven architectures.
    - Distributed systems developers relying on SNS message fan-out pipelines.
    - DevOps engineers ensuring notification reliability across webhook targets.

    ## Why orchestrate this with Kestra

    Kestra simplifies cloud infrastructure reliability by unifying AWS CLI querying, JSON data extraction, conditional escalation, and chat alerting into a single declarative pipeline. It injects IAM credentials securely, provides complete execution history, and eliminates the need for separate standalone monitoring daemons.

    ## Prerequisites

    - An AWS account with an active Amazon SNS topic.
    - An AWS IAM user or role with `cloudwatch:GetMetricData` permissions.
    - A GitHub Personal Access Token with repository issue creation permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`: Credentials with CloudWatch read permissions.
    - `GITHUB_TOKEN`: GitHub token used to open incident issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for cloud alerts.

    ## Inputs

    - `aws_region` (STRING, default `us-east-1`): Target AWS region hosting the SNS topic.
    - `topic_name` (STRING, default `production-security-alerts`): Name of the audited SNS topic.
    - `target_repository` (STRING, default `my-org/cloud-operations`): Target GitHub repository for logging incident issues.

    ## Outputs

    - `outputs.probe_sns_delivery_metrics.vars.MetricDataResults`: Raw CloudWatch metric data points.
    - `outputs.evaluate_failed_notifications.value.failed_count`: Number of failed notifications detected.
    - `outputs.evaluate_failed_notifications.value.has_failures`: Boolean indicating whether failures occurred.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `GITHUB_TOKEN`, and `SLACK_WEBHOOK` in your Kestra namespace.
    2. Import this flow and set `topic_name` to match an active SNS topic.
    3. Run the flow manually to verify metric retrieval and Slack notification delivery.
    4. Enable the `periodic_sns_dlq_check` trigger for continuous notification delivery monitoring.

    ## How to extend

    - Add an automated subscription health audit (`aws sns list-subscriptions-by-topic`) to identify the exact failing subscriber endpoint.
    - Inspect SQS dead-letter queue depth using `ApproximateNumberOfMessagesVisible`.
    - Route urgent alerts to PagerDuty or Opsgenie if delivery failures exceed 50 messages.

    ## Links

    - [Amazon SNS CloudWatch Metrics Documentation](https://docs.aws.amazon.com/sns/latest/dg/sns-monitoring-using-cloudwatch.html)
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
