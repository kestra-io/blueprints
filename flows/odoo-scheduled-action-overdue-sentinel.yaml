id: odoo-scheduled-action-overdue-sentinel
namespace: company.team
description: |
  On a schedule, read-only count how many active Odoo scheduled actions
  (ir.cron) are overdue past their next-run time (nothing is created,
  written, or deleted) and classify the result as HEALTHY, WARNING,
  CRITICAL, or UNREACHABLE. Log clean runs and page Slack the moment
  Odoo's own background job runner looks stuck or dead.

inputs:
  - id: odoo_url
    type: STRING
    defaults: "http://localhost:8069"
    displayName: "Odoo Base URL"
    description: "Base URL of the target Odoo instance, including scheme and port."
  - id: odoo_db
    type: STRING
    defaults: "odoo"
    displayName: "Odoo Database Name"
    description: "The Odoo database to connect to."
  - id: overdue_grace_minutes
    type: INT
    defaults: 15
    displayName: "Overdue Grace Period (minutes)"
    description: "A scheduled action is counted as overdue once its nextcall timestamp is at least this many minutes in the past."
  - id: warning_overdue_count
    type: INT
    defaults: 1
    displayName: "Warning Overdue Count"
    description: "At or above this many overdue active scheduled actions, the check is classified WARNING."
  - id: critical_overdue_count
    type: INT
    defaults: 5
    displayName: "Critical Overdue Count"
    description: "At or above this many overdue active scheduled actions, the check is classified CRITICAL, strongly suggesting Odoo's cron worker itself has stopped processing jobs."

triggers:
  - id: cron_overdue_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check for overdue scheduled actions every 15 minutes. Shipped disabled; enable it once odoo_url/odoo_db point at a real Odoo instance and a manual run has been verified.
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      overdue_grace_minutes: 15
      warning_overdue_count: 1

tasks:
  - id: count_overdue_crons
    type: io.kestra.plugin.odoo.Query
    description: Ask Odoo's own XML-RPC API how many active ir.cron records have a nextcall timestamp older than the configured grace period. Does not create, write, or delete any record.
    url: "{{ inputs.odoo_url }}"
    db: "{{ inputs.odoo_db }}"
    username: "{{ secret('ODOO_USERNAME') }}"
    password: "{{ secret('ODOO_PASSWORD') }}"
    model: "ir.cron"
    operation: SEARCH_COUNT
    filters:
      - ["active", "=", true]
      - ["nextcall", "<=", "{{ now() | dateAdd(-inputs.overdue_grace_minutes, 'MINUTES') | date('yyyy-MM-dd HH:mm:ss') }}"]
    fetchType: FETCH
    allowFailure: true

  - id: classify_cron_health
    type: io.kestra.plugin.core.debug.Return
    description: Classify the overdue count against the two configured thresholds, treating a missing output as an API or authentication failure rather than a healthy instance.
    format: "{{ outputs.count_overdue_crons.size is not defined ? 'UNREACHABLE' : (outputs.count_overdue_crons.size >= inputs.critical_overdue_count ? 'CRITICAL' : (outputs.count_overdue_crons.size >= inputs.warning_overdue_count ? 'WARNING' : 'HEALTHY')) }}"

  - id: route_by_cron_health
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when no scheduled action is overdue, an informational Slack message for a small number of overdue jobs, or a Slack page when many are overdue or the instance is unreachable.
    value: "{{ outputs.classify_cron_health.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Odoo scheduled actions are healthy on {{ inputs.odoo_url }}: no active ir.cron record is more than {{ inputs.overdue_grace_minutes }} minutes overdue."
      "WARNING":
        - id: alert_warning_overdue
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post an informational Slack message when a small number of scheduled actions are overdue, which can happen briefly under normal load.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Odoo cron sentinel WARNING: {{ outputs.count_overdue_crons.size }} active scheduled action(s) on {{ inputs.odoo_url }} are overdue by more than {{ inputs.overdue_grace_minutes }} minutes, at or above the warning floor of {{ inputs.warning_overdue_count }}. Watch for this count growing on the next check. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_overdue
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when a large number of scheduled actions are overdue at once, which strongly suggests the Odoo cron worker process itself has stopped running rather than one job failing in isolation.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Odoo cron sentinel CRITICAL: {{ outputs.count_overdue_crons.size }} active scheduled action(s) on {{ inputs.odoo_url }} are overdue by more than {{ inputs.overdue_grace_minutes }} minutes, at or above the critical floor of {{ inputs.critical_overdue_count }}. This many overdue jobs at once usually means the cron worker itself is stuck or not running, not a single broken job. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_instance
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the count query could not return a result at all, indicating the Odoo instance is unreachable or credentials are invalid.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Odoo cron sentinel UNREACHABLE: querying ir.cron on {{ inputs.odoo_url }} did not return a count (instance unreachable, invalid database name, or invalid credentials). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Odoo cron sentinel completed with an unexpected classification: {{ outputs.classify_cron_health.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record a single audit line for every run regardless of branch taken, so the check's own history stays queryable independent of Slack.
    message: "Odoo cron sentinel audit: db={{ inputs.odoo_db }} status={{ outputs.classify_cron_health.value }} overdue_count={{ outputs.count_overdue_crons.size is defined ? outputs.count_overdue_crons.size : 'n/a' }} grace_minutes={{ inputs.overdue_grace_minutes }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails outright, so a broken check is never mistaken for a healthy Odoo instance.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Odoo cron sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Scheduled-action health on {{ inputs.odoo_url }} is now unknown; check the task logs and the Odoo instance manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_cron_health.value }}"

extend:
  title: "Odoo Scheduled Action Overdue Sentinel"
  shortDescription: Read-only count overdue Odoo scheduled actions (ir.cron) via XML-RPC on a schedule and page Slack when the background job runner looks stuck or dead.
  metaTitle: Odoo Scheduled Action Overdue Sentinel for Kestra
  metaDescription: Count overdue Odoo ir.cron scheduled actions via XML-RPC on a schedule, change nothing in Odoo, and alert Slack when background jobs stall.
  description: |
    Odoo runs almost every background process, invoicing automation, email queues, inventory reordering rules, through its own `ir.cron` scheduled-action worker, and when that worker gets stuck or dies, dozens of jobs quietly stop running at once with no error anyone sees in the UI. This blueprint turns a scheduled, read-only count into a Day 2 infrastructure health gate: `io.kestra.plugin.odoo.Query` asks Odoo's own XML-RPC API how many active scheduled actions are overdue past their `nextcall` time, a single Pebble expression classifies that count, and the result routes to a quiet log, an informational Slack note, or a Slack page depending on severity.

    ## How it works

    1. `count_overdue_crons` (`io.kestra.plugin.odoo.Query`) runs a `SEARCH_COUNT` against the `ir.cron` model with a domain filter for `active = true` and `nextcall <= now() - overdue_grace_minutes`. The cutoff timestamp is computed entirely in Kestra with `now() | dateAdd(...) | date(...)` before the request is sent, so Odoo only ever has to answer a single count query. This is a read: no record is created, written, or deleted. `allowFailure: true` keeps an unreachable instance or bad credentials from aborting the flow outright.
    2. `classify_cron_health` (`io.kestra.plugin.core.debug.Return`) evaluates a single Pebble ternary against the returned count: missing entirely becomes `UNREACHABLE`, at or above `critical_overdue_count` becomes `CRITICAL`, at or above `warning_overdue_count` becomes `WARNING`, otherwise `HEALTHY`.
    3. `route_by_cron_health` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` logs a quiet confirmation; `WARNING` posts an informational Slack note; `CRITICAL` and `UNREACHABLE` each page Slack; a `defaults` fallback logs the raw value for any classification outside the four known cases.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run, independent of which Switch branch fired, so the check's own history stays queryable even if Slack delivery fails.
    5. The flow-level `errors` block pages Slack separately if the flow fails outright, so a broken sentinel is never mistaken for a healthy instance.
    6. The `cron_overdue_schedule` trigger checks every 15 minutes and ships `disabled: true`, with explicit `inputs:` overrides for `overdue_grace_minutes` and `warning_overdue_count` so the scheduled run's tolerance is pinned regardless of this flow's own defaults.

    ## What you get

    - A scheduled, read-only background-job health check for any Odoo instance with zero custom XML-RPC scripting.
    - A single `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `UNREACHABLE`) other flows can gate on.
    - Three distinct Slack messages, one per severity, each carrying the exact overdue count.
    - An audit log line on every run, separate from Slack, so the check's own history survives a webhook outage.

    ## Who it's for

    - Teams running self-hosted or on-premise Odoo who have no alert when the cron worker process dies or hangs.
    - Operations and IT teams responsible for an Odoo instance's uptime, who need a signal before invoicing, email, or inventory automation silently stalls.
    - Anyone who has been burned by Odoo's UI looking completely normal while every background job behind it has stopped running.

    ## Why orchestrate this with Kestra

    Odoo has no built-in alert for its own cron worker going down; the first sign is usually a business process that should have happened and did not. Kestra's scheduled, read-only count check gives that signal automatically: the schedule, the threshold classification, and the Slack call are all one auditable execution history, with the Switch branch ready to grow into real remediation (restarting the Odoo cron workers, opening a ticket) without rewriting the check itself.

    ## Prerequisites

    - A running Odoo instance reachable at `odoo_url` with XML-RPC enabled (on by default).
    - An Odoo user with read access to the `ir.cron` model.
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE, and flow-failure alerts.

    ### Secrets

    - `ODOO_USERNAME`, `ODOO_PASSWORD`: Odoo login credentials used for XML-RPC authentication.
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}`, for example `SECRET_SLACK_WEBHOOK=$(echo -n 'https://hooks.slack.com/services/<placeholder>' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ## Quick start

    1. Start a local Odoo instance with its required Postgres database, mapping Odoo's web port off host 8080 since Kestra's own UI already uses it:
       `docker run -d --name odoo-db -e POSTGRES_USER=odoo -e POSTGRES_PASSWORD=odoo -e POSTGRES_DB=postgres postgres:15`
       `docker run -d --name odoo-app --link odoo-db:db -p 8069:8069 odoo:17`
    2. If Kestra is also running in Docker, check `docker network ls` for Kestra's network and attach the Odoo container to it:
       `docker network connect YOUR_KESTRA_NETWORK odoo-app`
       Then set `odoo_url` to `http://odoo-app:8069`. From a host-based Kestra install, use `http://localhost:8069` instead.
    3. Complete Odoo's first-run database creation wizard at `odoo_url`, noting the database name for `odoo_db`.
    4. Add the `ODOO_USERNAME`, `ODOO_PASSWORD`, and `SLACK_WEBHOOK` secrets, and run the flow once manually to confirm `status` reads `HEALTHY` on a freshly created instance.
    5. Enable `cron_overdue_schedule` once pointed at a real instance.

    ## How to extend

    - Switch the `operation` from `SEARCH_COUNT` to `SEARCH_READ` with `fields: ["name", "nextcall"]` to name the specific overdue scheduled actions in the Slack alert instead of just the count.
    - Add a second, separate check scoped to one critical cron by `name` (for example, the invoicing or email-queue job) with its own tighter grace period.
    - Push `status` into a KV store and alert only on state transitions instead of every run.
    - Chain a `CRITICAL` branch into a remediation step that restarts the Odoo cron workers via your infrastructure's own automation.

    ## Inputs

    - `odoo_url`: base URL of the Odoo instance.
    - `odoo_db`: the Odoo database to connect to.
    - `overdue_grace_minutes`: minutes past `nextcall` before a scheduled action counts as overdue.
    - `warning_overdue_count`: overdue-count floor at or above which the check is classified WARNING.
    - `critical_overdue_count`: overdue-count floor at or above which the check is classified CRITICAL.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `UNREACHABLE`.
    - Example path: `{{ outputs.classify_cron_health.value }}`, also exposed as the flow output `{{ outputs.status }}`.

    ## Links

    - [Kestra Odoo plugin](https://kestra.io/plugins/plugin-odoo)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
    - [Odoo ir.cron scheduled actions documentation](https://www.odoo.com/documentation/latest/developer/reference/backend/orm.html)

    ## Pitfalls

    - The `now() | dateAdd(...) | date(...)` cutoff computation runs in Kestra's own timezone context; if the Odoo server stores `nextcall` in a different timezone than Kestra expects, the grace period can be effectively shorter or longer than configured. Confirm both systems agree on UTC before trusting the exact threshold.
    - This flow only ever runs `SEARCH_COUNT`; it never calls Odoo's CREATE, WRITE, or UNLINK operations, so there is nothing destructive to default to dry-run for.
    - A single long-interval cron (for example, one that runs once a month) can look permanently overdue under a short `overdue_grace_minutes` right after its last run if `nextcall` was computed far in the future incorrectly; check one connector's schedule before assuming the whole instance is unhealthy from a single `WARNING`.
    - Odoo's XML-RPC endpoint is unauthenticated transport (plain HTTP by default); use `https://` in `odoo_url` for any instance reachable outside a trusted network.
  tags:
    - Infrastructure
    - Business
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
