id: faktory-background-job-queue-sentinel
namespace: company.team
description: |
  Poll a Faktory server's Web UI /stats JSON endpoint on a schedule,
  evaluate queue depth and dead-set thresholds, and alert Slack on backlogs.

inputs:
  - id: faktory_stats_url
    type: STRING
    defaults: "http://faktory:7420/stats"
    displayName: "Faktory Web UI Stats URL"
    description: "Full HTTP URL to Faktory Web UI /stats JSON endpoint (default port 7420)."
  - id: warning_queue_depth
    type: INT
    defaults: 100
    displayName: "Warning Queue Depth Threshold"
    description: "Enqueued job count threshold triggering a WARNING alert."
  - id: critical_queue_depth
    type: INT
    defaults: 500
    displayName: "Critical Queue Depth Threshold"
    description: "Enqueued job count threshold triggering a CRITICAL alert."
  - id: max_dead_jobs
    type: INT
    defaults: 0
    displayName: "Max Allowed Dead Jobs"
    description: "Maximum acceptable dead job count before classifying as CRITICAL."

triggers:
  - id: faktory_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Poll Faktory queue stats every 5 minutes."
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: fetch_and_evaluate_faktory
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates Faktory Web UI /stats endpoint, measures queue depths, dead jobs, and determines status.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      STATS_URL: "{{ inputs.faktory_stats_url }}"
      WARN_DEPTH: "{{ inputs.warning_queue_depth }}"
      CRIT_DEPTH: "{{ inputs.critical_queue_depth }}"
      MAX_DEAD: "{{ inputs.max_dead_jobs }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      stats_url = os.environ.get("STATS_URL", "http://faktory:7420/stats")
      warn_depth = int(os.environ.get("WARN_DEPTH", "100"))
      crit_depth = int(os.environ.get("CRIT_DEPTH", "500"))
      max_dead = int(os.environ.get("MAX_DEAD", "0"))

      try:
          resp = requests.get(stats_url, timeout=10)
          resp.raise_for_status()
          stats = resp.json()
      except Exception as err:
          print(f"CRITICAL: Failed to query Faktory stats at {stats_url}: {err}", file=sys.stderr)
          sys.exit(1)

      faktory_data = stats.get("faktory", {})
      queues = faktory_data.get("queues", {})
      total_enqueued = sum(queues.values()) if isinstance(queues, dict) else int(faktory_data.get("total_enqueued", 0))
      dead_jobs = int(faktory_data.get("sets", {}).get("dead", 0))
      retries = int(faktory_data.get("sets", {}).get("retries", 0))

      status = "HEALTHY"
      if total_enqueued >= crit_depth or dead_jobs > max_dead:
          status = "CRITICAL"
      elif total_enqueued >= warn_depth:
          status = "WARNING"

      report = {
          "stats_url": stats_url,
          "total_enqueued": total_enqueued,
          "dead_jobs": dead_jobs,
          "retries": retries,
          "status": status,
          "queues": queues
      }

      with open("faktory_stats_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Faktory Status: {status}, Enqueued: {total_enqueued}, Dead: {dead_jobs}, Retries: {retries}")

      Kestra.outputs({
          "status": status,
          "total_enqueued": total_enqueued,
          "dead_jobs": dead_jobs,
          "retries": retries
      })
    outputFiles:
      - faktory_stats_report.json

  - id: route_by_severity
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.fetch_and_evaluate_faktory.vars.status }}"
    cases:
      HEALTHY:
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Faktory queues operating normally. Enqueued: {{ outputs.fetch_and_evaluate_faktory.vars.total_enqueued }}."
      WARNING:
        - id: alert_warning
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "WARNING: Faktory queue depth exceeded warning limit! Enqueued: {{ outputs.fetch_and_evaluate_faktory.vars.total_enqueued }} (Threshold: {{ inputs.warning_queue_depth }}). Execution {{ execution.id }}."
            }
      CRITICAL:
        - id: alert_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "CRITICAL: Faktory queue alert! Enqueued: {{ outputs.fetch_and_evaluate_faktory.vars.total_enqueued }} (Limit: {{ inputs.critical_queue_depth }}), Dead jobs: {{ outputs.fetch_and_evaluate_faktory.vars.dead_jobs }} (Limit: {{ inputs.max_dead_jobs }}). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_default
        type: io.kestra.plugin.core.log.Log
        message: "Faktory check completed with status: {{ outputs.fetch_and_evaluate_faktory.vars.status }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "CRITICAL: Faktory sentinel execution failed on {{ inputs.faktory_stats_url }}. Execution ID: {{ execution.id }}."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.fetch_and_evaluate_faktory.vars.status }}"

extend:
  title: Faktory Background Job Queue Sentinel Watchdog
  metaTitle: Faktory Background Job Queue Sentinel for Kestra
  shortDescription: Poll Faktory Web UI /stats endpoint, evaluate queue depths and dead jobs, and page Slack on backlog breaches.
  metaDescription: Monitor Faktory background job queue depths and dead set counters via HTTP stats API and alert Slack on queue backlog spikes.
  description: |
    ## How it works
    Faktory exposes queue depth, dead-set, and retry counters as JSON on its Web UI. This blueprint queries `GET /stats`, evaluates total enqueued job counts and dead set sizes against configurable warning and critical thresholds, logs healthy states, and triggers Slack notifications when queue backlogs spike.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[faktory_sentinel_schedule Schedule Trigger] --> B[fetch_and_evaluate_faktory Python Script]
      B --> C{Route by Severity}
      C -- HEALTHY --> D[log_healthy Log]
      C -- WARNING --> E[alert_warning Webhook]
      C -- CRITICAL --> F[alert_critical Webhook]
    ```

    ## Prerequisites
    - Running Faktory server with Web UI endpoint reachable over HTTP.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `faktory_stats_url` and threshold values.
    3. Run manually or enable the scheduled trigger.

    ## Links
    - [Faktory Web UI & API Documentation](https://github.com/contribsys/faktory)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
    - Network
  ee: false
  demo: false
