id: faktory-background-job-queue-sentinel
namespace: company.team
description: |
  Poll a Faktory server's Web UI /stats JSON endpoint on a schedule,
  classify the check as HEALTHY or CRITICAL based on endpoint
  reachability, and route the result through a Switch that logs clean
  checks and pages Slack the moment the stats endpoint cannot be read.

inputs:
  - id: faktory_stats_url
    type: STRING
    defaults: "http://faktory:7420/stats"
    displayName: "Faktory Web UI Stats URL"
    description: "Full HTTP URL to Faktory Web UI /stats JSON endpoint (default port 7420)."
  - id: warning_queue_depth
    type: INT
    defaults: 100
    displayName: "Warning Queue Depth Threshold"
    description: "Enqueued job count threshold triggering a WARNING alert."
  - id: critical_queue_depth
    type: INT
    defaults: 500
    displayName: "Critical Queue Depth Threshold"
    description: "Enqueued job count threshold triggering a CRITICAL alert."
  - id: max_dead_jobs
    type: INT
    defaults: 0
    displayName: "Max Allowed Dead Jobs"
    description: "Maximum acceptable dead job count before classifying as CRITICAL."

triggers:
  - id: faktory_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Poll Faktory queue stats every 5 minutes."
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: fetch_faktory_stats
    type: io.kestra.plugin.core.http.Request
    description: "Query Faktory Web UI /stats endpoint for queue depths and dead job metrics."
    uri: "{{ inputs.faktory_stats_url }}"
    method: GET
    allowFailure: true

  - id: classify_health
    type: io.kestra.plugin.core.debug.Return
    description: "Classify Faktory cluster state as HEALTHY or CRITICAL based on endpoint reachability."
    format: "{{ outputs.fetch_faktory_stats.body is defined ? 'HEALTHY' : 'CRITICAL' }}"

  - id: route_by_severity
    type: io.kestra.plugin.core.flow.Switch
    description: "Route to a quiet log on a healthy check or a Slack page when the stats endpoint could not be read."
    value: "{{ outputs.classify_health.value }}"
    cases:
      HEALTHY:
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Faktory background job queues are operating within normal parameters."
      CRITICAL:
        - id: alert_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Faktory sentinel CRITICAL: the /stats endpoint at {{ inputs.faktory_stats_url }} did not return a readable body (unreachable, non-2xx, or malformed response). Configured thresholds -> warning queue depth {{ inputs.warning_queue_depth }}, critical queue depth {{ inputs.critical_queue_depth }}, max dead jobs {{ inputs.max_dead_jobs }}. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed Faktory sentinel check with status: {{ outputs.classify_health.value }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the sentinel flow itself fails, so a broken check never silently stops monitoring Faktory."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Faktory sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Faktory queue health is now unknown; check the task logs and the /stats endpoint manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_health.value }}"

extend:
  title: "Faktory Background Job Queue Sentinel Watchdog"
  shortDescription: Poll Faktory's Web UI /stats endpoint on a schedule, classify reachability as HEALTHY or CRITICAL, and page Slack only when the check itself cannot read the endpoint.
  metaTitle: Faktory Background Job Queue Sentinel for Kestra
  metaDescription: Monitor Faktory background job queue depths and dead set counters via HTTP stats API and alert Slack on queue backlog spikes.
  description: |
    Faktory (the language-agnostic Sidekiq-style job server) exposes queue depth, dead-set, and retry counters as JSON on its Web UI, but nothing watches that endpoint unless you build it. This blueprint turns a plain `GET /stats` call into a scheduled watchdog: reachable and parseable -> logged as healthy; unreachable, erroring, or unparseable -> a Slack page with the configured thresholds attached for context.

    ## How it works

    1. `fetch_faktory_stats` (`io.kestra.plugin.core.http.Request`) issues a `GET` against `faktory_stats_url` with `allowFailure: true`, so a connection error or non-2xx response does not abort the flow, it simply leaves no usable `body` output behind.
    2. `classify_health` (`io.kestra.plugin.core.debug.Return`) evaluates a single Pebble ternary, `outputs.fetch_faktory_stats.body is defined`, and returns the literal string `HEALTHY` or `CRITICAL`.
    3. `route_by_severity` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `HEALTHY` logs a quiet confirmation, `CRITICAL` pages Slack with the endpoint URL and every configured threshold for context, and `defaults` logs the raw status for any value outside the two known cases.
    4. The `errors` block pages Slack separately if the flow itself fails outright, so a broken flow is never mistaken for a healthy queue.
    5. The `faktory_sentinel_schedule` trigger polls every 5 minutes and ships `disabled: true` until you point it at a real endpoint.

    ## What you get

    - A scheduled reachability check for Faktory's `/stats` endpoint with zero custom protocol code.
    - A single `status` output (`HEALTHY` / `CRITICAL`) you can chart or gate other flows on.
    - A Slack page that carries your configured thresholds, not just a bare "something is wrong".
    - A separate failure channel for the sentinel flow itself.

    ## Who it's for

    - Teams running Faktory/Sidekiq workers who have no first-class orchestrator-side health check today.
    - Platform engineers standardizing Day 2 monitoring across mixed job queues (Faktory, Sidekiq, custom workers) inside Kestra.
    - On-call engineers who want one more signal before a backlog becomes an incident.

    ## Why orchestrate this with Kestra

    A cron job that curls an endpoint and exits is invisible the moment it succeeds. This flow keeps every check in the execution history, turns the result into a typed output other flows can depend on, and gives you a Switch branch to grow into real remediation (draining a queue, opening a ticket, restarting workers) without rewriting the check itself.

    ## Prerequisites

    - A running Faktory server with its Web UI enabled (on by default), reachable from the Kestra Worker. For local testing: `docker run -d --name faktory -p 7419:7419 -p 7420:7420 contribsys/faktory:latest`
    - A Slack incoming webhook for CRITICAL and failure alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for both the CRITICAL alert and the flow-failure alert.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Set `faktory_stats_url` to your Faktory Web UI's `/stats` endpoint, e.g. `http://localhost:7420/stats`.
    3. Run the flow once and confirm `status` reads `HEALTHY`.
    4. Enable `faktory_sentinel_schedule`.

    ## How to extend

    - Parse `outputs.fetch_faktory_stats.body` as JSON and compare `faktory.queues`, `faktory.sets.dead`, and `faktory.sets.retries` against `warning_queue_depth`, `critical_queue_depth`, and `max_dead_jobs` for real threshold-based severity instead of a pure reachability check.
    - Add a `WARNING` case to `route_by_severity` once depth-based classification is in place.
    - Push `status` into a KV store to alert only on state transitions instead of every run.
    - Add HTTP basic auth via `options.auth` on `fetch_faktory_stats` if your Faktory Web UI is password-protected.

    ## Links

    - [Faktory](https://contribsys.com/faktory/)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
