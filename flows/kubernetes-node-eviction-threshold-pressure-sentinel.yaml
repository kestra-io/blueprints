id: kubernetes-node-eviction-threshold-pressure-sentinel
namespace: company.k8s

inputs:
  - id: ksm_metrics_url
    type: STRING
    defaults: "http://kube-state-metrics.monitoring:8080/metrics"
    description: Prometheus scrape endpoint for kube-state-metrics.

tasks:
  - id: query_node_pressures
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.ksm_metrics_url }}" > /tmp/node_telemetry.txt
        
        # Scrape kube_node_status_condition where status="true" for MemoryPressure, DiskPressure, or PIDPressure
        PRESSURE_COUNT=$(grep -E 'kube_node_status_condition\{.*condition="(MemoryPressure|DiskPressure|PIDPressure)".*status="true".*\}' /tmp/node_telemetry.txt | awk '{sum+=$2} END {print sum+0}')
        echo "::set-output name=pressure_count::$PRESSURE_COUNT::"

  - id: evaluate_node_pressure
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_node_pressures.vars.pressure_count | int > 0 }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#k8s-platform",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kubernetes Node Eviction Pressure Alert",
                "text": "Cluster recorded *{{ outputs.query_node_pressures.vars.pressure_count }} node pressure condition(s)* (MemoryPressure, DiskPressure, or PIDPressure)! Kubelet is actively evicting BestEffort and Burstable pods, causing widespread workload termination.",
                "footer": "Kestra Platform Sentinel • Kubernetes"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#k8s-platform",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Kubernetes Node Pressure Sentinel Failure",
            "text": "Failed to scrape kube-state-metrics. Verify monitoring service reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Kubernetes Kubelet Node Hard Eviction Threshold Pressure Sentinel
  shortDescription: Audits Kubernetes worker nodes for memory and ephemeral storage eviction pressure to prevent cascading pod evictions.
  description: |
    ## How it works
    This workflow scrapes `kube-state-metrics` (`:8080/metrics`) to audit `kube_node_status_condition` across all cluster worker nodes. When a node's available memory, root filesystem, or process ID table drops below kubelet hard eviction thresholds (e.g. `memory.available < 100Mi`, `nodefs.available < 10%`), kubelet immediately flags `MemoryPressure`, `DiskPressure`, or `PIDPressure` and stops scheduling new pods. Kubelet then begins aggressively terminating active pods (ranking by QoS class: BestEffort first, then Burstable). This workflow detects node pressure and alerts platform teams before critical services are evicted.

    ## What you get
    - Real-time detection of kubelet hard eviction threshold breaches across worker nodes.
    - Prevents cascading pod evictions and unexpected microservice outages.
    - Comprehensive cluster-wide visibility across all nodes.

    ## Who it's for
    - Kubernetes Platform Engineers and Site Reliability Engineers.
    - DevOps Leads responsible for cluster compute stability and node capacity.

    ## Why orchestrate this with Kestra
    - **Continuous Health Auditing**: Periodically polls cluster node states without extra monitoring daemons.
    - **Decoupled Architecture**: Directly accesses standard kube-state-metrics.
    - **Instant Team Escalation**: Delivers incident notifications with pressure condition counts directly to Slack.

    ## Prerequisites
    - kube-state-metrics installed in the cluster with metrics port accessible.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input kube-state-metrics URL.
    3. Run the workflow to inspect worker node pressure conditions.

    ## How to extend
    - Print the specific node names and condition types in the Slack notification body.
    - Trigger an automated node drain and replacement via cloud provider autoscaling APIs.

    ## Links
    - [Kubernetes Node-pressure Eviction Documentation](https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
