id: github-actions-flaky-or-broken
namespace: company.engineering

variables:
  repository: my-org/my-repo
  workflow: ci.yml
  branch: main

tasks:
  - id: each_run
    type: io.kestra.plugin.core.flow.Loop
    description: Handle every completed run the trigger reported, one at a time.
    values: "{{ trigger.runs }}"
    concurrencyLimit: 1
    tasks:
      - id: state
        type: io.kestra.plugin.core.kv.Get
        description: What this flow already did for this run, if anything.
        key: "ci_rerun_{{ fromJson(item.value).runId }}"

      - id: route
        type: io.kestra.plugin.core.flow.Switch
        value: >-
          {%- set run = fromJson(item.value) -%}
          {%- set state = outputs.state.value.state ?? 'none' -%}
          {%- if run.conclusion == 'failure' and state == 'none' -%}FIRST_FAILURE
          {%- elseif run.conclusion == 'success' and state == 'rerun_requested' -%}PASSED_ON_RERUN
          {%- elseif run.conclusion == 'failure' and state == 'rerun_requested' -%}FAILED_AGAIN
          {%- else -%}NOTHING_TO_DO
          {%- endif -%}
        cases:
          FIRST_FAILURE:
            - id: first_failure_jobs
              type: io.kestra.plugin.github.actions.GetRun
              oauthToken: "{{ secret('GITHUB_TOKEN') }}"
              repository: "{{ vars.repository }}"
              runId: "{{ fromJson(item.value).runId }}"
              includeJobs: true

            - id: rerun_failed_jobs
              type: io.kestra.plugin.core.http.Request
              description: Re-run only the jobs that failed, on the same commit.
              method: POST
              uri: "https://api.github.com/repos/{{ vars.repository }}/actions/runs/{{ fromJson(item.value).runId }}/rerun-failed-jobs"
              headers:
                Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
                Accept: application/vnd.github+json

            - id: remember_rerun
              type: io.kestra.plugin.core.kv.Set
              key: "ci_rerun_{{ fromJson(item.value).runId }}"
              kvType: JSON
              ttl: P7D
              value: |
                {
                  "state": "rerun_requested",
                  "failedJobs": {{ outputs.first_failure_jobs.jobs | jq('[.[] | select(.conclusion == "failure") | .name]') | first | toJson }}
                }

          PASSED_ON_RERUN:
            - id: find_flaky_issue
              type: io.kestra.plugin.github.issues.Search
              oauthToken: "{{ secret('GITHUB_TOKEN') }}"
              repository: "{{ vars.repository }}"
              query: 'is:issue is:open label:flaky-ci "Flaky CI jobs"'
              fetchType: FETCH_ONE

            - id: if_no_flaky_issue
              type: io.kestra.plugin.core.flow.If
              condition: "{{ outputs.find_flaky_issue.size == 0 }}"
              then:
                - id: open_flaky_issue
                  type: io.kestra.plugin.github.issues.Create
                  oauthToken: "{{ secret('GITHUB_TOKEN') }}"
                  repository: "{{ vars.repository }}"
                  title: "Flaky CI jobs in {{ vars.workflow }}"
                  labels:
                    - flaky-ci
                  body: |
                    Kestra re-runs the failed jobs of `{{ vars.workflow }}` on `{{ vars.branch }}` once. When a job fails and then passes on the same commit, it is flaky, and it is logged here as a comment.

            - id: log_flaky_jobs
              type: io.kestra.plugin.github.issues.Comment
              oauthToken: "{{ secret('GITHUB_TOKEN') }}"
              repository: "{{ vars.repository }}"
              issueNumber: "{{ outputs.open_flaky_issue.issueNumber ?? outputs.find_flaky_issue.row.number }}"
              body: |
                {%- set run = fromJson(item.value) -%}
                Flaky: {% for job in outputs.state.value.failedJobs %}`{{ job }}`{% if not loop.last %}, {% endif %}{% endfor %} failed, then passed when re-run on the same commit.

                Commit {{ run.headSha | slice(0, 7) }}, run [#{{ run.runNumber }}]({{ run.htmlUrl }})

            - id: close_flaky
              type: io.kestra.plugin.core.kv.Set
              key: "ci_rerun_{{ fromJson(item.value).runId }}"
              kvType: JSON
              ttl: P7D
              value: '{"state": "flaky"}'

          FAILED_AGAIN:
            - id: broken_jobs
              type: io.kestra.plugin.github.actions.GetRun
              oauthToken: "{{ secret('GITHUB_TOKEN') }}"
              repository: "{{ vars.repository }}"
              runId: "{{ fromJson(item.value).runId }}"
              includeJobs: true

            - id: log_location
              type: io.kestra.plugin.core.http.Request
              description: GitHub answers with a redirect to a short-lived log URL that must be fetched without the token.
              uri: "https://api.github.com/repos/{{ vars.repository }}/actions/jobs/{{ outputs.broken_jobs.jobs | jq('[.[] | select(.conclusion == \"failure\")][0].id') | first }}/logs"
              options:
                followRedirects: false
              headers:
                Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
                Accept: application/vnd.github+json

            - id: job_log
              type: io.kestra.plugin.core.http.Download
              uri: "{{ outputs.log_location.headers.location | first }}"

            - id: find_broken_issue
              type: io.kestra.plugin.github.issues.Search
              oauthToken: "{{ secret('GITHUB_TOKEN') }}"
              repository: "{{ vars.repository }}"
              query: 'is:issue is:open label:ci-broken "CI broken on {{ vars.branch }}"'
              fetchType: FETCH_ONE

            - id: if_no_broken_issue
              type: io.kestra.plugin.core.flow.If
              condition: "{{ outputs.find_broken_issue.size == 0 }}"
              then:
                - id: open_broken_issue
                  type: io.kestra.plugin.github.issues.Create
                  oauthToken: "{{ secret('GITHUB_TOKEN') }}"
                  repository: "{{ vars.repository }}"
                  title: "CI broken on {{ vars.branch }}: {{ vars.workflow }}"
                  labels:
                    - ci-broken
                  body: |
                    `{{ vars.workflow }}` fails on `{{ vars.branch }}` and still fails when its failed jobs are re-run on the same commit, so this is not a flaky test. Each failing run is added below as a comment. Close this issue once `{{ vars.branch }}` is green again.
              else:
                - id: still_broken
                  type: io.kestra.plugin.core.log.Log
                  message: "Issue #{{ outputs.find_broken_issue.row.number }} is already open, adding this run to it."

            - id: report_broken_run
              type: io.kestra.plugin.github.issues.Comment
              oauthToken: "{{ secret('GITHUB_TOKEN') }}"
              repository: "{{ vars.repository }}"
              issueNumber: "{{ outputs.open_broken_issue.issueNumber ?? outputs.find_broken_issue.row.number }}"
              body: |
                {%- set run = fromJson(item.value) -%}
                {%- set step = read(outputs.job_log.uri) | split('##\[error\]') | first | split('##\[endgroup\]') | last -%}
                {%- set log = step | replace({'(?m)^\S+Z ': '', '\u001B\[[0-9;]*m': ''}, regexp=true) | trim | split('\n') -%}
                Failed twice on commit {{ run.headSha | slice(0, 7) }}, run [#{{ run.runNumber }}]({{ run.htmlUrl }}).

                Failed jobs: {{ outputs.broken_jobs.jobs | jq('[.[] | select(.conclusion == "failure") | "`" + .name + "`"] | join(", ")') | first }}

                Output of the failing step:
                ```
                {{ log | slice(log | length > 30 ? (log | length) - 30 : 0, log | length) | join('
                ') }}
                ```

            - id: close_broken
              type: io.kestra.plugin.core.kv.Set
              key: "ci_rerun_{{ fromJson(item.value).runId }}"
              kvType: JSON
              ttl: P7D
              value: '{"state": "broken"}'

          NOTHING_TO_DO:
            - id: nothing_to_do
              type: io.kestra.plugin.core.log.Log
              message: "Run {{ fromJson(item.value).runNumber }} ended {{ fromJson(item.value).conclusion }}, nothing to do."

triggers:
  - id: on_completed_run
    type: io.kestra.plugin.github.actions.Trigger
    oauthToken: "{{ secret('GITHUB_TOKEN') }}"
    repository: "{{ vars.repository }}"
    workflowId: "{{ vars.workflow }}"
    branch: "{{ vars.branch }}"
    interval: PT1M

extend:
  title: Re-run Failed GitHub Actions Jobs Once to Separate Flaky Tests from Real Breaks
  metaTitle: GitHub Actions Flaky or Broken CI Triage | Kestra
  shortDescription: When a GitHub Actions run fails, re-run its failed jobs once on the same commit. A pass is logged as flaky, a second failure opens an issue with the error output.
  metaDescription: Re-run failed GitHub Actions jobs once on the same commit. Log the flaky ones, and open an issue with the error output when the run fails again.
  description: |
    When CI turns red, is the code broken or is a test flaky? This flow re-runs the failed jobs once on the same commit and lets the result decide.

    ## How it works

    1. The GitHub Actions trigger polls every minute for completed runs of the workflow on the branch. A re-run is reported again when it completes.
    2. A KV entry per run records what the flow already did, and a `Switch` picks the next step.
    3. First failure: `GetRun` lists the failed jobs, and the flow asks GitHub to re-run only those jobs.
    4. Passed on the re-run: the jobs are flaky. They are added as a comment to a "Flaky CI jobs" issue, which is opened the first time.
    5. Failed again: the break is real. The output of the failing step goes into the open "CI broken" issue, or a new one.

    ## What you get

    - At most one automatic re-run per run, so a broken branch never loops.
    - A "Flaky CI jobs" issue with one comment per flaky job and commit.
    - One "CI broken" issue while the branch is red, with the failed jobs, commit, run link and error output, instead of an issue per push.

    ## Who it's for

    Teams on GitHub Actions who re-run red builds by hand, and platform engineers who want flaky jobs tracked instead of silently retried.

    ## Why orchestrate this with Kestra

    - The trigger polls GitHub, so no public webhook endpoint is needed.
    - The decision spans two runs minutes apart. Kestra keeps that state between executions, where a CI step or cron script would need its own storage.
    - Each decision is an execution you can inspect.

    ## Prerequisites

    - A GitHub repository with an Actions workflow that runs on the branch you watch.
    - The GitHub plugin 1.12.0 or later, which adds the Actions trigger and `GetRun`.

    ### Secrets

    - `GITHUB_TOKEN`: fine-grained token for the repository with read and write access to Actions and Issues.

    ## Quick start

    1. Add the `GITHUB_TOKEN` secret to the namespace.
    2. Set `repository`, `workflow` and `branch` in `variables`.
    3. Save the flow and push a commit. A failed run is re-run within a minute, and the outcome appears in the repository's issues.

    ## How to extend

    - Copy the flow per workflow you want to watch.
    - Also post the "CI broken" comment to Slack.
    - Count flaky runs per job in the KV Store and quarantine a job past a threshold.

    ## Links

    - [GitHub Actions Trigger](https://kestra.io/plugins/plugin-github/actions/io.kestra.plugin.github.actions.trigger)
    - [GetRun](https://kestra.io/plugins/plugin-github/actions/io.kestra.plugin.github.actions.getrun)
    - [Issues Search](https://kestra.io/plugins/plugin-github/issues/io.kestra.plugin.github.issues.search) and [Comment](https://kestra.io/plugins/plugin-github/issues/io.kestra.plugin.github.issues.comment)
    - [Re-run failed jobs API](https://docs.github.com/en/rest/actions/workflow-runs#re-run-failed-jobs-from-a-workflow-run)
    - [Download job logs API](https://docs.github.com/en/rest/actions/workflow-jobs#download-job-logs-for-a-workflow-job)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Incident Response
  ee: false
  demo: false
