id: mcp-ephemeral-sql-sandbox
namespace: company.ai

description: |
  Expose an in-memory DuckDB SQL sandbox as an MCP tool for AI coding agents to execute,
  benchmark, and inspect query execution plans safely before touching production.

inputs:
  - id: query_sql
    type: STRING
    displayName: Proposed SQL Query
    description: Analytical SQL query submitted by the AI agent to profile and execute in the sandbox.
    defaults: "SELECT c.customer_id, count(o.order_id) as total_orders, sum(o.amount) as total_spend FROM customers c JOIN orders o ON c.customer_id = o.customer_id GROUP BY 1 ORDER BY 3 DESC LIMIT 10;"

  - id: max_rows
    type: INT
    displayName: Maximum Output Rows
    description: Safety ceiling on the number of result rows returned to the agent.
    defaults: 25

  - id: capture_explain_plan
    type: BOOL
    displayName: Capture Query Plan
    description: When true, captures the DuckDB EXPLAIN execution plan to inspect join algorithms and scan costs.
    defaults: true

tasks:
  - id: sandbox_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Isolated working directory housing the ephemeral DuckDB sandbox file.
    tasks:
      - id: initialize_sandbox_schema
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: Seeds realistic dimensional tables with sample records for join and aggregation testing.
        url: "jdbc:duckdb:sandbox.duckdb"
        fetchType: NONE
        sql: |
          CREATE TABLE customers (
            customer_id VARCHAR PRIMARY KEY,
            company_name VARCHAR,
            account_tier VARCHAR,
            region VARCHAR
          );

          INSERT INTO customers VALUES
            ('CUST-101', 'Acme Corp', 'ENTERPRISE', 'US-EAST'),
            ('CUST-102', 'Stripe Inc', 'ENTERPRISE', 'US-WEST'),
            ('CUST-103', 'Vercel Labs', 'PRO', 'EU-WEST'),
            ('CUST-104', 'Linear Orbit', 'GROWTH', 'US-EAST'),
            ('CUST-105', 'Supabase Cloud', 'PRO', 'EU-CENTRAL');

          CREATE TABLE orders (
            order_id VARCHAR PRIMARY KEY,
            customer_id VARCHAR,
            amount DOUBLE,
            status VARCHAR,
            order_date DATE
          );

          INSERT INTO orders VALUES
            ('ORD-5001', 'CUST-101', 1250.00, 'COMPLETED', DATE '2026-09-01'),
            ('ORD-5002', 'CUST-101', 3400.50, 'COMPLETED', DATE '2026-09-15'),
            ('ORD-5003', 'CUST-102', 820.00, 'COMPLETED', DATE '2026-09-20'),
            ('ORD-5004', 'CUST-103', 150.00, 'COMPLETED', DATE '2026-09-22'),
            ('ORD-5005', 'CUST-101', 940.00, 'REFUNDED', DATE '2026-09-25'),
            ('ORD-5006', 'CUST-104', 2100.00, 'COMPLETED', DATE '2026-10-01'),
            ('ORD-5007', 'CUST-102', 450.00, 'PENDING', DATE '2026-10-02');

      - id: explain_query_plan
        type: io.kestra.plugin.jdbc.duckdb.Query
        description: Extracts query plan diagnostics to detect unindexed scans or Cartesian joins.
        url: "jdbc:duckdb:sandbox.duckdb"
        fetchType: FETCH
        runIf: "{{ inputs.capture_explain_plan }}"
        sql: "EXPLAIN {{ inputs.query_sql }}"

      - id: execute_sandbox_query
        type: io.kestra.plugin.jdbc.duckdb.Query
        description: Executes the agent query and captures the resulting rows.
        url: "jdbc:duckdb:sandbox.duckdb"
        fetchType: FETCH
        sql: "{{ inputs.query_sql }}"

  - id: format_agent_response
    type: io.kestra.plugin.core.output.OutputValues
    description: Packages result rows, row counts, and plan details for the MCP tool output envelope.
    values:
      row_count: "{{ outputs.execute_sandbox_query.rows is not null ? outputs.execute_sandbox_query.rows | length : 0 }}"
      preview: "{{ outputs.execute_sandbox_query.rows is not null ? (outputs.execute_sandbox_query.rows | slice(0, inputs.max_rows)) : [] }}"
      execution_status: "SUCCESS"
      query_plan: "{{ outputs.explain_query_plan.rows ?? [] }}"

  - id: log_verification_summary
    type: io.kestra.plugin.core.log.Log
    description: Records query execution stats in the Kestra execution audit log.
    message: "MCP SQL Sandbox executed successfully. Returned {{ outputs.format_agent_response.values.row_count }} rows (capped to {{ inputs.max_rows }} preview rows)."

outputs:
  - id: status
    type: STRING
    displayName: Execution Status
    description: Verification status returned to the agent.
    value: "{{ outputs.format_agent_response.values.execution_status ?? 'FAILED' }}"

  - id: row_count
    type: INT
    displayName: Returned Row Count
    description: Total number of rows returned by the sandbox query.
    value: "{{ outputs.format_agent_response.values.row_count ?? 0 }}"

  - id: result_preview
    type: JSON
    displayName: Query Result Preview
    description: Slice of returned records formatted as JSON for the agent.
    value: "{{ outputs.format_agent_response.values.preview ?? [] }}"

  - id: query_plan
    type: JSON
    displayName: DuckDB Execution Plan
    description: Query execution plan details for profiling join algorithms.
    value: "{{ outputs.format_agent_response.values.query_plan ?? [] }}"

triggers:
  - id: mcp_sql_sandbox
    type: io.kestra.plugin.core.trigger.McpToolTrigger
    toolName: test_sql_in_sandbox
    title: Ephemeral SQL Sandbox and Profiler
    toolDescription: >
      Executes and profiles an analytical SQL query inside an ephemeral DuckDB database sandbox.
      Call this tool when proposing or testing SQL queries to verify syntax, check row outputs,
      inspect query plans, and validate join logic before committing changes to production code.
    mcpServer: default
    annotations:
      readOnly: true
      destructive: false
      idempotent: true
      openWorld: false
      returnDirect: false

errors:
  - id: handle_sandbox_failure
    type: io.kestra.plugin.core.log.Log
    description: Logs syntax or execution errors encountered during query evaluation.
    message: "SQL Sandbox query evaluation failed. Review query syntax and column references."

extend:
  title: Ephemeral SQL Sandbox and Query Profiler for AI Agents
  shortDescription: Expose an in-memory DuckDB SQL sandbox via MCP for AI agents to test queries, inspect execution plans, and verify results safely.
  metaTitle: Ephemeral SQL Sandbox and Profiler with Kestra MCP
  metaDescription: Test SQL queries in an ephemeral DuckDB sandbox via Kestra MCP. Let AI agents verify syntax, row output, and query plans safely before touching production.
  tags:
    - AI
    - Data
  subTags:
    - Agents & Structured Output
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    When AI coding agents (Claude Code, Cursor, Windsurf) assist developers with database queries, backend migrations, or analytics models, they frequently output untested SQL. LLMs can misjudge join conditions, create unintended Cartesian products, or hallucinate non-existent SQL functions. Granting agents live credentials to development or production databases poses serious data privacy and security risks, while preventing them from testing leaves developers to debug broken SQL manually.

    This blueprint exposes an **ephemeral SQL sandbox and profiler tool** over Kestra's native Model Context Protocol (MCP) server. When an agent proposes an analytical query, it invokes `test_sql_in_sandbox`. Kestra spawns an isolated DuckDB database inside a temporary working directory, seeds baseline customer and order dimensional schemas, captures the `EXPLAIN` execution plan, and executes the query. The verified row count, query plan, and result preview are returned directly to the agent over MCP, allowing the model to self-correct before code is committed.

    ## How it works

    1. An AI agent discovers `test_sql_in_sandbox` exposed on Kestra's built-in MCP server via `mcp_sql_sandbox` (`io.kestra.plugin.core.trigger.McpToolTrigger`).
    2. `sandbox_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) creates an isolated filesystem boundary for the execution.
    3. `initialize_sandbox_schema` (`io.kestra.plugin.jdbc.duckdb.Queries`) provisions an in-memory DuckDB database (`sandbox.duckdb`) and populates baseline tables (`customers`, `orders`).
    4. `explain_query_plan` (`io.kestra.plugin.jdbc.duckdb.Query`) runs `EXPLAIN` on the agent's proposed SQL to capture scan types and join algorithms when `capture_explain_plan` is enabled.
    5. `execute_sandbox_query` (`io.kestra.plugin.jdbc.duckdb.Query`) runs the query, enforcing execution within the sandbox.
    6. `format_agent_response` (`io.kestra.plugin.core.output.OutputValues`) extracts row counts, applies safety slicing using `max_rows`, and outputs structured JSON.
    7. `outputs` returns the execution status, row count, query plan, and result records back to the agent in the MCP tool response.

    ## What you get

    - A safe, read-only SQL evaluation environment for coding agents with zero risk of mutating real databases.
    - Automated detection of syntax errors, broken group-by clauses, and invalid aggregations before pull requests are opened.
    - Transparent query plan inspection allowing agents to verify index usage and join efficiency.
    - Zero infrastructure footprint: DuckDB runs embedded inside Kestra without requiring external database containers.

    ## Who it's for

    - Platform Engineers building governed MCP tool catalogs for AI coding agents.
    - Data Engineers looking to let AI assistants test SQL transformations against sample schemas.
    - Software Developers using Cursor or Claude Code who want fast SQL verification without local database setups.

    ## Why orchestrate this with Kestra

    Kestra provides native MCP server support, declarative task isolation, and embedded database plugins out of the box. Instead of building custom Python web servers with MCP wrappers and managing ephemeral SQLite or DuckDB lifecycle hooks manually, Kestra handles execution tracking, input validation, working directory cleanup, and tool discovery in a single declarative YAML file.

    ## Pitfalls

    - **Dialect Differences:** DuckDB implements standard ANSI SQL and PostgreSQL-compatible syntax. If your production warehouse uses proprietary functions (e.g., Snowflake-specific or Oracle-specific built-ins), ensure the agent targets standard ANSI SQL or loads custom mock scalar functions into the initialization step.
    - **Result Set Size:** Returning millions of rows over MCP can exhaust an LLM's context window. The blueprint enforces `max_rows` slicing (default 25) to protect agent memory limits while returning total `row_count`.

    ## Prerequisites

    - A running Kestra 2.0+ instance with the default MCP server enabled.
    - An MCP-compatible client (Claude Desktop, Claude Code, Cursor, or Windsurf).

    ### Secrets

    - No secrets required. The sandbox runs entirely in-memory with embedded DuckDB.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Connect your MCP client to Kestra's MCP endpoint (e.g., `http://localhost:8080/api/v1/main/mcp/default`).
    3. In your coding assistant (Claude Code or Cursor), ask: *"Run a query in the SQL sandbox to find top customers by total order spend."*
    4. The assistant invokes `test_sql_in_sandbox` and receives the verified row output and execution plan.

    ## How to extend

    - Swap `initialize_sandbox_schema` to ingest real sanitized schema DDL or Parquet files from an S3 bucket or namespace files.
    - Add custom DuckDB extensions (e.g., `httpfs`, `spatial`, or `json`) to support testing complex analytical functions.
    - Add a threshold assertion that fails the task if execution time exceeds a latency budget, flagging unoptimized queries back to the agent.

    ## Links

    - [MCP Tool Trigger Documentation](https://kestra.io/docs/workflow-components/triggers/mcp-tool-trigger)
    - [Kestra MCP Server Guide](https://kestra.io/docs/ai-tools/mcp-server)
    - [DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
