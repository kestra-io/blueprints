id: kafka-consumer-lag-sentinel
namespace: company.team
description: |
  On a schedule, read-only describe a Kafka consumer group via the Kafka
  AdminClient (no messages consumed, nothing committed, no offsets
  altered) and classify the worst per-partition lag as HEALTHY, WARNING,
  CRITICAL, or UNREACHABLE against two thresholds. Log clean runs and page
  Slack the moment a consumer group falls behind or cannot be described.

inputs:
  - id: bootstrap_servers
    type: STRING
    defaults: "localhost:9092"
    displayName: "Kafka Bootstrap Servers"
    description: "Comma-separated host:port list of the Kafka brokers to query via the AdminClient."
  - id: consumer_group_id
    type: STRING
    defaults: "orders-processor"
    displayName: "Consumer Group ID"
    description: "The Kafka consumer group to describe."
  - id: admin_call_timeout
    type: STRING
    defaults: "PT30S"
    displayName: "Admin Call Timeout"
    description: "ISO-8601 duration; maximum time to wait for the AdminClient describe call before failing the task."
  - id: warning_lag_threshold
    type: INT
    defaults: 1000
    displayName: "Warning Lag Threshold"
    description: "Worst per-partition lag (endOffset - currentOffset) at or above which the group is classified WARNING."
  - id: critical_lag_threshold
    type: INT
    defaults: 10000
    displayName: "Critical Lag Threshold"
    description: "Worst per-partition lag at or above which the group is classified CRITICAL."

triggers:
  - id: consumer_lag_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Describe the consumer group every 5 minutes. Shipped disabled; enable it once bootstrap_servers and consumer_group_id point at a real cluster and a manual run has been verified.
    cron: "*/5 * * * *"
    disabled: true
    inputs:
      admin_call_timeout: "PT30S"
      warning_lag_threshold: 1000

tasks:
  - id: describe_consumer_group
    type: io.kestra.plugin.kafka.ConsumerGroupDescribe
    description: Read-only AdminClient call that returns the group's state, members, and per-partition currentOffset/endOffset/lag. Never consumes a message, never commits, never alters an offset.
    groupIds:
      - "{{ inputs.consumer_group_id }}"
    properties:
      bootstrap.servers: "{{ inputs.bootstrap_servers }}"
    callTimeout: "{{ inputs.admin_call_timeout }}"
    allowFailure: true

  - id: classify_consumer_lag
    type: io.kestra.plugin.core.debug.Return
    description: Fold every returned partition's lag down to the single worst value and classify it against the two configured thresholds in one AdminClient-safe jq query, treating a missing output as a broker or group-lookup failure rather than zero lag.
    format: "{{ outputs.describe_consumer_group.groups is not defined ? 'UNREACHABLE' : (outputs.describe_consumer_group.groups | jq('([.[].offsets[].lag] | max) as $m | if $m == null then \"UNREACHABLE\" elif $m >= ' ~ inputs.critical_lag_threshold ~ ' then \"CRITICAL\" elif $m >= ' ~ inputs.warning_lag_threshold ~ ' then \"WARNING\" else \"HEALTHY\" end') | first) }}"

  - id: route_by_lag
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log on a healthy group, an informational Slack message on a building lag, or a Slack page for critical lag or an undescribable group.
    value: "{{ outputs.classify_consumer_lag.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Kafka consumer group {{ inputs.consumer_group_id }} is healthy: worst partition lag is below the warning threshold of {{ inputs.warning_lag_threshold }}."
      "WARNING":
        - id: alert_warning_lag
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post an informational Slack message when the worst partition lag crosses the warning threshold but is not yet critical.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Kafka lag sentinel WARNING: consumer group {{ inputs.consumer_group_id }} on {{ inputs.bootstrap_servers }} has a worst partition lag at or above the warning threshold of {{ inputs.warning_lag_threshold }} but below critical ({{ inputs.critical_lag_threshold }}). Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_lag
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the worst partition lag crosses the critical threshold.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Kafka lag sentinel CRITICAL: consumer group {{ inputs.consumer_group_id }} on {{ inputs.bootstrap_servers }} has a worst partition lag at or above the critical threshold of {{ inputs.critical_lag_threshold }}. Consumers are very likely falling behind or stalled. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_group
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the AdminClient describe call could not return group data at all, indicating the cluster is unreachable or the group does not exist.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Kafka lag sentinel UNREACHABLE: describing consumer group {{ inputs.consumer_group_id }} on {{ inputs.bootstrap_servers }} returned no group data (broker unreachable, group not found, or no committed offsets). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Kafka lag sentinel completed with an unexpected classification: {{ outputs.classify_consumer_lag.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record a single audit line for every run regardless of branch taken, including the raw worst-partition lag, so the check's own history stays queryable independent of Slack.
    message: "Kafka lag sentinel audit: group={{ inputs.consumer_group_id }} status={{ outputs.classify_consumer_lag.value }} worst_partition_lag={{ outputs.describe_consumer_group.groups is defined ? (outputs.describe_consumer_group.groups | jq('[.[].offsets[].lag] | max') | first) : 'n/a' }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails outright, so a broken check is never mistaken for a healthy consumer group.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Kafka lag sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Lag on consumer group {{ inputs.consumer_group_id }} is now unknown; check the task logs and the cluster manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_consumer_lag.value }}"

extend:
  title: "Kafka Consumer Lag Sentinel"
  shortDescription: Read-only describe a Kafka consumer group's per-partition lag via the AdminClient on a schedule and page Slack when it crosses a warning or critical threshold.
  metaTitle: Apache Kafka Consumer Lag Sentinel for Kestra
  metaDescription: Describe a Kafka consumer group's lag via the AdminClient on a schedule, with no messages consumed, and alert Slack on warning or critical lag.
  description: |
    A Kafka consumer group can fall behind for minutes before anyone notices, since nothing in Kafka itself pages on lag. This blueprint turns a scheduled, read-only AdminClient call into a Day 2 health gate: `io.kestra.plugin.kafka.ConsumerGroupDescribe` returns every partition's committed offset, log-end offset, and lag for the group, a single jq query folds that down to the worst lag and classifies it, and the result routes to a quiet log, an informational Slack note, or a Slack page depending on severity.

    ## How it works

    1. `describe_consumer_group` (`io.kestra.plugin.kafka.ConsumerGroupDescribe`) calls the Kafka AdminClient's describe-consumer-group and list-offsets APIs for `consumer_group_id` against `bootstrap_servers`, bounded by `admin_call_timeout`. It returns `groups`, a list where each entry has `groupId`, `state`, `members`, and `offsets` (one entry per `topic`/`partition` with `currentOffset`, `endOffset`, and `lag`). This is a metadata read: no message is consumed, no offset is committed or altered. `allowFailure: true` keeps a broker or group lookup failure from aborting the flow outright.
    2. `classify_consumer_lag` (`io.kestra.plugin.core.debug.Return`) first guards for a missing `groups` output (`UNREACHABLE`), then hands the group list to one jq query that folds every partition's `lag` down to the single worst value with `max`, and classifies it: no lag value at all becomes `UNREACHABLE`, at or above `critical_lag_threshold` becomes `CRITICAL`, at or above `warning_lag_threshold` becomes `WARNING`, otherwise `HEALTHY`. The thresholds are spliced into the jq expression from the flow's own inputs.
    3. `route_by_lag` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` logs a quiet confirmation; `WARNING` posts an informational Slack note; `CRITICAL` and `UNREACHABLE` each page Slack with the thresholds and the execution id; a `defaults` fallback logs the raw value for any classification outside the four known cases.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run, independent of which Switch branch fired, re-deriving the worst partition lag for readability so the check's own history stays queryable even if Slack delivery fails.
    5. The flow-level `errors` block pages Slack separately if the flow fails outright, so a broken sentinel is never mistaken for a healthy group.
    6. The `consumer_lag_schedule` trigger describes the group every 5 minutes and ships `disabled: true`, with explicit `inputs:` overrides for `admin_call_timeout` and `warning_lag_threshold` so the scheduled run's behavior is pinned regardless of this flow's own defaults.

    ## What you get

    - A scheduled, read-only lag check for any Kafka consumer group with zero custom AdminClient code.
    - A single `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `UNREACHABLE`) other flows can gate on.
    - Three distinct Slack messages, one per severity, each carrying the thresholds that were crossed.
    - An audit log line on every run, separate from Slack, with the raw worst-partition lag number, so the check's own history survives a webhook outage.

    ## Who it's for

    - Platform and streaming teams running Kafka who have no orchestrator-side lag alert today.
    - On-call engineers who want a backlog-building signal on a consumer group before an SLA on downstream processing is missed.
    - Teams standardizing Day 2 queue monitoring across mixed messaging systems inside Kestra without writing a bespoke lag-exporter dashboard.

    ## Why orchestrate this with Kestra

    Tools like Burrow or a Prometheus lag exporter can watch consumer lag, but that is another service to deploy, scrape, and alert from outside your orchestration layer. Kestra keeps the whole check in one place: the schedule, the read-only AdminClient describe call, the jq-based threshold classification, and the Slack call are all one auditable execution history, with the Switch branch ready to grow into real remediation (scaling consumers, opening a ticket) without rewriting the check itself.

    ## Prerequisites

    - A running Kafka cluster reachable at `bootstrap_servers`.
    - An existing consumer group `consumer_group_id` with committed offsets on at least one partition.
    - AdminClient read permission on the cluster (describe consumer groups, list offsets); this flow never calls an AdminClient write or delete operation.
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE, and flow-failure alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}`, for example `SECRET_SLACK_WEBHOOK_URL=$(echo -n 'https://hooks.slack.com/services/<placeholder>' | base64)`. This keeps the webhook out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees. If your cluster requires SASL or SSL, add the extra AdminClient properties (for example `sasl.jaas.config`) under the task's `properties` map, sourced from additional `{{ secret('NAME') }}` values rather than inline.

    ## Quick start

    1. Start a local single-broker Kafka cluster in KRaft mode, on a port well away from Kestra's own UI:
       `docker run -d --name kafka-broker -p 9092:9092 apache/kafka:3.7.0`
    2. If Kestra is also running in Docker, attach the broker to Kestra's network so the worker can reach it by container name:
       `docker network connect YOUR_KESTRA_NETWORK kafka-broker`
       Then set `bootstrap_servers` to `kafka-broker:9092`. From a host-based Kestra install, use `localhost:9092` instead.
    3. Create a topic, produce a few records, and commit offsets with a real consumer group so there is something to describe:
       `docker exec kafka-broker /opt/kafka/bin/kafka-topics.sh --create --topic orders --bootstrap-server localhost:9092`
       `docker exec -i kafka-broker /opt/kafka/bin/kafka-console-producer.sh --topic orders --bootstrap-server localhost:9092 <<< "test message"`
       `docker exec kafka-broker /opt/kafka/bin/kafka-console-consumer.sh --topic orders --bootstrap-server localhost:9092 --group orders-processor --from-beginning --max-messages 1`
    4. Add the `SLACK_WEBHOOK_URL` secret, set `consumer_group_id` to `orders-processor`, and run the flow once manually to confirm `status` reads `HEALTHY`.
    5. Enable `consumer_lag_schedule` once pointed at a real cluster and group.

    ## How to extend

    - Pass `groupIds` as a list with more than one entry to watch several consumer groups from a single run, then adjust the jq query to classify per group instead of across all of them.
    - Add a per-topic breakdown to the audit log by changing the jq expression from a flat `max` to a `group_by(.topic)` summary.
    - Add SASL or SSL AdminClient properties under `properties` for a secured cluster, sourced from secrets rather than inline.
    - Push `status` into a KV store and alert only on state transitions instead of every run.

    ## Inputs

    - `bootstrap_servers`: Kafka broker host:port list the AdminClient connects to.
    - `consumer_group_id`: the consumer group to describe.
    - `admin_call_timeout`: ISO-8601 duration cap on the AdminClient describe call.
    - `warning_lag_threshold`: worst-partition-lag floor at or above which the group is classified WARNING.
    - `critical_lag_threshold`: worst-partition-lag floor at or above which the group is classified CRITICAL.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `UNREACHABLE`.

    ## Links

    - [Kestra Apache Kafka plugin](https://kestra.io/plugins/plugin-kafka)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
    - [Kafka AdminClient consumer group APIs](https://kafka.apache.org/documentation/#adminclient)

    ## Pitfalls

    - `ConsumerGroupDescribe` reports lag as of the moment the AdminClient call runs; a group with highly bursty traffic can look healthy between polls while still falling behind briefly in between.
    - A consumer group with zero committed offsets (brand new, or fully caught up with nothing ever consumed) produces an empty `offsets` list; the jq query treats that the same as a missing group and reports `UNREACHABLE`, so confirm the group has run at least once before trusting a non-`UNREACHABLE` result.
    - Setting `warning_lag_threshold` or `critical_lag_threshold` too low relative to real throughput produces false alerts; tune both against an observed healthy baseline before enabling the schedule.
    - This task only reads group metadata; it never calls an AdminClient delete, alter-offsets, or reset operation, so there is nothing destructive to default to dry-run for.
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
