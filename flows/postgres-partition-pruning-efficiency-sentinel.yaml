id: postgres-partition-pruning-efficiency-sentinel
namespace: company.ops
description: Audits PostgreSQL partitioned tables to detect partition pruning failures and expensive multi-partition sequential scans.

inputs:
  - id: pg_host
    type: STRING
    defaults: "postgres.internal"
    description: PostgreSQL server hostname or IP address.
  - id: pg_port
    type: INT
    defaults: 5432
    description: PostgreSQL port.
  - id: pg_user
    type: STRING
    defaults: "postgres"
    description: PostgreSQL username.
  - id: max_seq_scans_threshold
    type: INT
    defaults: 50
    description: Maximum acceptable sequential scans across partitioned child tables before alerting.

tasks:
  - id: query_partition_scans
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.pg_host }}:{{ inputs.pg_port }}/postgres"
    username: "{{ inputs.pg_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
          parent.relname AS parent_table, 
          count(child.inhrelid) AS child_partitions, 
          sum(stat.seq_scan) AS total_seq_scans 
      FROM pg_inherits child 
      JOIN pg_class parent ON child.inhparent = parent.oid 
      JOIN pg_stat_user_tables stat ON child.inhrelid = stat.relid 
      GROUP BY parent.relname 
      HAVING sum(stat.seq_scan) >= {{ inputs.max_seq_scans_threshold }} 
      ORDER BY total_seq_scans DESC 
      LIMIT 1;
    fetchType: FETCH_ONE

  - id: evaluate_pruning_efficiency
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_partition_scans.row is defined and outputs.query_partition_scans.row != null and outputs.query_partition_scans.row.parent_table is defined }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#postgresql-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ PostgreSQL Partition Pruning Inefficiency Alert",
                "text": "Partitioned table `{{ outputs.query_partition_scans.row.parent_table }}` on `{{ inputs.pg_host }}` recorded *{{ outputs.query_partition_scans.row.total_seq_scans }}* full sequential scans across *{{ outputs.query_partition_scans.row.child_partitions }}* child partitions! Impact: Queries without partition key constraints in the WHERE clause are scanning every partition, causing massive I/O disk thrashing and CPU exhaustion.",
                "footer": "Kestra Database Sentinel • PostgreSQL"
              }
            ]
          }

outputs:
  - id: parent_table
    type: STRING
    value: "{{ outputs.query_partition_scans.row ? outputs.query_partition_scans.row.parent_table : '' }}"
  - id: child_count
    type: INT
    value: "{{ outputs.query_partition_scans.row ? outputs.query_partition_scans.row.child_partitions : 0 }}"
  - id: total_seq_scans
    type: INT
    value: "{{ outputs.query_partition_scans.row ? outputs.query_partition_scans.row.total_seq_scans : 0 }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#postgresql-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ PostgreSQL Partition Pruning Efficiency and Scan Sentinel Pipeline Failure",
            "text": "Failed to query PostgreSQL partition catalog. Check host connection and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Audits PostgreSQL partitioned tables to detect partition pruning failures and expensive multi-partition sequential scans.
  metaTitle: PostgreSQL Partition Pruning Efficiency and Scan Sentinel with Kestra
  title: PostgreSQL Partition Pruning Efficiency and Scan Sentinel
  shortDescription: Audits PostgreSQL partitioned tables to detect partition pruning failures and expensive multi-partition sequential scans.
  description: |
    ## How it works
    This workflow inspects PostgreSQL partition hierarchies (`pg_inherits` and `pg_stat_user_tables`) to aggregate sequential scan counters across all child partitions. In declarative partitioning, PostgreSQL's query optimizer eliminates unneeded partitions (pruning) when queries provide partition key filters. When application queries omit partition keys or use immutable functions that disable pruning, every child table is sequentially scanned. When full table scans exceed the threshold, Slack is alerted.

    ## What you get
    - Continuous audit of partitioned table access patterns across PostgreSQL databases.
    - Pinpoints queries and tables bypassing partition pruning optimizations.
    - Prevents runaway disk I/O and query latency degradation on large partitioned datasets.

    ## Who it's for
    - Database Administrators (DBAs) managing time-series or multi-tenant partitioned schemas.
    - Application Developers writing queries against partitioned PostgreSQL tables.

    ## Why orchestrate this with Kestra
    - **Native SQL Catalog Inspection**: Leverages built-in statistics views via official JDBC plugin without heavy APM overhead.
    - **Proactive Performance Guard**: Catch unpruned scans before analytical queries cause production timeouts.
    - **Contextual Notifications**: Delivers exact parent table names and sequential scan volumes.

    ## Prerequisites
    - PostgreSQL 10+ with declarative or inheritance-based partitioning.
    - Secrets `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint into Kestra.
    2. Configure PostgreSQL coordinates and scan threshold.
    3. Run the workflow to inspect partition pruning efficiency.

    ## Links
    - [PostgreSQL Partition Pruning Documentation](https://www.postgresql.org/docs/current/ddl-partitioning.html#DDL-PARTITION-PRUNING)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
