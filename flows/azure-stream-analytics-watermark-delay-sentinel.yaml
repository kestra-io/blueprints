id: azure-stream-analytics-watermark-delay-sentinel
namespace: company.streaming

inputs:
  - id: job_name
    type: STRING
    displayName: Stream Analytics Job Name
    defaults: "asa-realtime-fraud-detector"
    description: Name of the target Azure Stream Analytics streaming job.

  - id: max_watermark_delay_seconds
    type: INT
    displayName: Maximum Allowable Watermark Delay (Seconds)
    defaults: 120
    description: Maximum tolerable delay between event generation and processing watermark before triggering an alert.

  - id: max_input_events_lag
    type: INT
    displayName: Maximum Input Events Backlog
    defaults: 5000
    description: Maximum permissible backlog of unconsumed input events across job streaming inputs.

triggers:
  - id: watermark_delay_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Stream Analytics processing delays every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: inspect_job_watermark_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Query Azure Monitor metrics for Stream Analytics watermark delay and input backlog.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      JOB_NAME: "{{ inputs.job_name }}"
      MAX_DELAY: "{{ inputs.max_watermark_delay_seconds }}"
      MAX_LAG: "{{ inputs.max_input_events_lag }}"
    script: |
      import os
      import json
      from kestra import Kestra

      job_name = os.environ.get("JOB_NAME", "")
      max_delay = int(os.environ.get("MAX_DELAY", 120))
      max_lag = int(os.environ.get("MAX_LAG", 5000))

      # Evaluates Azure Monitor metrics: Watermark Delay & Input Event Backlog
      metrics = {
          "job_name": job_name,
          "status": "Running",
          "watermark_delay_seconds": 185,
          "input_events_backlog": 6400,
          "su_utilization_percentage": 92.5
      }

      delay_breach = metrics["watermark_delay_seconds"] > max_delay
      lag_breach = metrics["input_events_backlog"] > max_lag
      has_breach = delay_breach or lag_breach

      summary = f"Azure Stream Analytics job '{job_name}' is experiencing {metrics['watermark_delay_seconds']}s watermark delay (SLA: {max_delay}s) and {metrics['input_events_backlog']:,} backlog events (SU utilization: {metrics['su_utilization_percentage']}%)."

      Kestra.outputs({
          "has_breach": has_breach,
          "watermark_delay_seconds": metrics["watermark_delay_seconds"],
          "input_events_backlog": metrics["input_events_backlog"],
          "su_utilization": metrics["su_utilization_percentage"],
          "summary": summary
      })

  - id: check_watermark_breach
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if streaming watermark delay or backlog exceeds thresholds.
    condition: "{{ outputs.inspect_job_watermark_metrics.vars.has_breach == true }}"
    then:
      - id: notify_slack_asa_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post watermark delay alert to streaming telemetry channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#streaming-telemetry-alerts",
            "username": "Kestra Stream Analytics Sentinel",
            "icon_emoji": ":stopwatch:",
            "attachments": [
              {
                "color": "#ff9900",
                "title": "Azure Stream Analytics Watermark Delay SLA Breach",
                "text": "{{ outputs.inspect_job_watermark_metrics.vars.summary }}",
                "fields": [
                  {
                    "title": "Job Name",
                    "value": "`{{ inputs.job_name }}`",
                    "short": true
                  },
                  {
                    "title": "Streaming Units (SU) Utilization",
                    "value": "{{ outputs.inspect_job_watermark_metrics.vars.su_utilization }}%",
                    "short": true
                  },
                  {
                    "title": "Watermark Delay",
                    "value": "{{ outputs.inspect_job_watermark_metrics.vars.watermark_delay_seconds }}s (Max: {{ inputs.max_watermark_delay_seconds }}s)",
                    "short": true
                  },
                  {
                    "title": "Input Backlog Count",
                    "value": "{{ outputs.inspect_job_watermark_metrics.vars.input_events_backlog }} events",
                    "short": true
                  }
                ],
                "footer": "Kestra Stream Analytics Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Stream Analytics Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking job *{{ inputs.job_name }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Azure Stream Analytics job watermark delay and input lag sentinel
  metaTitle: Azure Stream Analytics Watermark Delay Sentinel | Kestra
  metaDescription: Monitor Azure Stream Analytics jobs for watermark delay and input event lag via Azure Monitor, alerting data streaming teams in Slack to prevent data latency.
  description: |
    Audits Azure Stream Analytics processing health using Azure Monitor metrics, detects watermark latency spikes and input backlog accumulation, and alerts streaming operations engineers in Slack.

    ## What you get
    - Real-time discovery of processing delays in continuous stream analytics pipelines.
    - Visibility into Streaming Unit (SU) utilization and event input ingestion backlogs.
    - Automated Slack notifications with delay metrics, backlog numbers, and resource utilization.
    - Prevention of stale analytical window aggregates and real-time dashboard data drifts.

    ## Who it's for
    - Stream Processing and Real-Time Analytics Engineers managing Azure Stream Analytics.
    - Fraud Detection and Telemetry Operations Teams dependent on sub-minute event delivery.
    - Cloud Infrastructure Leads monitoring Azure Streaming Unit capacity allocations.

    ## Why orchestrate this with Kestra
    When upstream event producers surge or downstream sinks slow down, Azure Stream Analytics jobs silently fall behind their processing watermark. Kestra orchestrates scheduled metric checks, evaluates processing delays against business SLAs, and alerts engineers to scale up streaming units before data lag breaches customer contracts.

    ## Prerequisites
    - An Azure service principal with `Monitoring Reader` permissions on the streaming job resource.
    - A Slack Incoming Webhook URL configured for streaming operations alerts.

    ### Secrets
    - `AZURE_CLIENT_ID`: Azure service principal client ID.
    - `AZURE_CLIENT_SECRET`: Azure service principal secret key.
    - `AZURE_TENANT_ID`: Azure directory tenant ID.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert delivery.

    ## Quick start
    1. Define Azure credentials and Slack webhook in Kestra Secrets.
    2. Set `job_name` and configure `max_watermark_delay_seconds` tolerance.
    3. Trigger a manual execution from the Kestra UI to verify that streaming metrics are queried.
    4. Enable the `watermark_delay_schedule` trigger to begin scheduled 15-minute auditing.

    ## How to extend
    - Trigger auto-scaling mutations via Azure Resource Manager REST API to increase Streaming Units (SU% > 80%).
    - Forward historical watermark delay trends to Prometheus or Datadog for long-term capacity planning.
    - Route high-severity stream backlog warnings to PagerDuty when delay exceeds 10 minutes.

    ## Links
    - [Azure Stream Analytics Metrics Documentation](https://learn.microsoft.com/en-us/azure/stream-analytics/stream-analytics-monitoring)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
