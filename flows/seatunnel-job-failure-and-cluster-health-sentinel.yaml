id: seatunnel-job-failure-and-cluster-health-sentinel
namespace: company.data

inputs:
  - id: seatunnel_host
    type: STRING
    displayName: SeaTunnel Coordinator Host
    defaults: "seatunnel-coordinator.internal"
    description: Hostname or IP address of the Apache SeaTunnel Zeta Engine coordinator.

  - id: seatunnel_port
    type: INT
    displayName: SeaTunnel REST API Port
    defaults: 8080
    description: Port number for the SeaTunnel Zeta Engine REST API V2 (default 8080).

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#data-platform-alerts"
    description: Slack channel destination for operational pipeline incident cards.

  - id: inspect_cluster_overview
    type: BOOL
    displayName: Inspect Cluster Overview on Failure
    defaults: true
    description: Automatically query /overview to inspect cluster worker slots when failed jobs are detected.

triggers:
  - id: every_fifteen_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: probe_failed_jobs
    type: io.kestra.plugin.core.http.Request
    uri: "http://{{ inputs.seatunnel_host }}:{{ inputs.seatunnel_port }}/finished-jobs/FAILED"
    method: GET
    headers:
      Accept: application/json
    options:
      allowFailed: true
    allowFailure: true

  - id: route_by_job_health
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {% if outputs.probe_failed_jobs.status != 200 or outputs.probe_failed_jobs.body is null %}
      PROBE_FAILED
      {% else %}
        {% set jobs = outputs.probe_failed_jobs.body %}
        {% if jobs is iterable and jobs | length > 0 %}
        CRITICAL
        {% else %}
        HEALTHY
        {% endif %}
      {% endif %}
    cases:
      CRITICAL:
        - id: alert_critical_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] Apache SeaTunnel Ingestion Job Failures Detected - Data Landing Halted",
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "Apache SeaTunnel Job Failure Incident",
                  "fields": [
                    {
                      "title": "Coordinator Endpoint",
                      "value": "{{ inputs.seatunnel_host }}:{{ inputs.seatunnel_port }}",
                      "short": true
                    },
                    {
                      "title": "Failed Jobs Count",
                      "value": "{{ outputs.probe_failed_jobs.body | length }}",
                      "short": true
                    },
                    {
                      "title": "Severity",
                      "value": "CRITICAL - Integration Pipeline Failed",
                      "short": true
                    },
                    {
                      "title": "Inspect Overview",
                      "value": "{{ inputs.inspect_cluster_overview ? 'Enabled' : 'Disabled' }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra SeaTunnel Sentinel | Execution ID: {{ execution.id }}"
                }
              ]
            }

        - id: check_cluster_overview
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.inspect_cluster_overview == true }}"
          then:
            - id: query_cluster_overview
              type: io.kestra.plugin.core.http.Request
              uri: "http://{{ inputs.seatunnel_host }}:{{ inputs.seatunnel_port }}/overview"
              method: GET
              headers:
                Accept: application/json
              options:
                allowFailed: true

            - id: log_cluster_overview
              type: io.kestra.plugin.core.log.Log
              message: "SeaTunnel Zeta cluster overview diagnostics: {{ outputs.query_cluster_overview.body }}"

      PROBE_FAILED:
        - id: alert_probe_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] SeaTunnel Sentinel Probe Failed - Unable to query /finished-jobs/FAILED. Verify coordinator endpoint and port 8080 routing."
            }

      HEALTHY:
        - id: log_jobs_healthy
          type: io.kestra.plugin.core.log.Log
          message: "SeaTunnel Zeta cluster job execution health is normal. No failed data integration jobs detected."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "SeaTunnel job health audit completed. Status: {{ outputs.route_by_job_health.value ?? 'PROCESSED' }}."

errors:
  - id: on_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "[ERROR] Apache SeaTunnel Sentinel flow execution aborted unexpectedly. Execution ID: {{ execution.id }}."
      }

extend:
  title: Apache SeaTunnel Job Failure and Zeta Cluster Health Sentinel
  metaTitle: Apache SeaTunnel Job Health Sentinel | Kestra
  shortDescription: Audits Apache SeaTunnel Zeta Engine REST API for failed streaming or batch jobs and alerts on pipeline stalls.
  metaDescription: Audit Apache SeaTunnel Zeta Engine REST API for failed streaming jobs, dispatch Slack incident alerts, and correlate cluster overview health.
  description: |
    Apache SeaTunnel is a next-generation, high-performance distributed data integration engine designed to synchronize massive volumes of data across heterogeneous data sources, warehouses, and storage engines. Powered by the Zeta distributed execution engine, SeaTunnel manages streaming connectors and batch transformations spanning Kafka, ClickHouse, Apache Iceberg, Hudi, and relational databases. In production, unannounced upstream schema changes, network timeouts between source and sink connectors, or worker slot memory exhaustion can cause streaming pipelines to crash and transition into a `FAILED` state. When integration jobs fail, downstream tables stop receiving fresh landing data, resulting in silent data freshness SLA breaches. This blueprint provides automated continuous surveillance over the SeaTunnel Zeta REST API, detects failed jobs, alerts engineering teams via Slack, and correlates job failures with cluster worker slot metrics via `GET /overview`.

    ## How it works

    1. Scheduled trigger (`every_fifteen_minutes`) initiates diagnostic health verification every 15 minutes, with manual runs supported via customizable inputs.
    2. Diagnostic probe (`probe_failed_jobs`) connects to the SeaTunnel Zeta coordinator REST API (`port 8080`) via `io.kestra.plugin.core.http.Request` and calls `/finished-jobs/FAILED` to inspect recently failed pipelines.
    3. Classification logic evaluates the response array using Pebble templating, discerning whether any integration jobs are in a `FAILED` state (`CRITICAL`), if all jobs are healthy (`HEALTHY`), or if the coordinator endpoint was unreachable (`PROBE_FAILED`).
    4. Routing task (`route_by_job_health`) switches execution along dedicated paths according to the classified severity.
    5. On `CRITICAL` state, structured Slack incident cards notify operations channels with coordinator endpoints, failed job counts, and severity classifications.
    6. When failed jobs are identified and `inspect_cluster_overview` is enabled, `query_cluster_overview` queries `GET /overview` to capture cluster-wide worker slot availability, active thread counts, and memory metrics.
    7. On `PROBE_FAILED`, dedicated alerts notify administrators of unreachable coordinator ports or network partitions.
    8. Audit log task (`log_audit_summary`) writes execution metadata and classified status to task logs.

    ## What you get

    - Automated continuous surveillance of Apache SeaTunnel data integration pipelines across all connected sources and sinks.
    - Early detection of failed streaming jobs before downstream analytics and ML feature stores serve stale data.
    - Automated cluster diagnostics capturing worker slot allocation and coordinator health during active incidents.
    - Full execution traceability and audit logging without leaking infrastructure credentials in logs or alert payloads.
    - Clean code standards with strictly zero emojis across workflow definitions, notifications, and logs.

    ## Who it's for

    - Data Platform Engineers and Analytics Engineers operating large-scale Apache SeaTunnel data ingestion pipelines.
    - Site Reliability Engineers ensuring continuous real-time data landing and pipeline uptime SLAs.
    - Data Infrastructure Teams deploying hybrid cloud ETL and CDC data movement architectures.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition unifies distributed pipeline monitoring, conditional error triage, and cluster diagnostics into version-controlled GitOps workflows.
    - Native HTTP request capabilities interact directly with SeaTunnel's Zeta REST API without external agent daemons or Python container overhead.
    - Built-in conditional routing isolates healthy baseline checks from multi-tiered incident notification cards.
    - Immutable execution history provides operational evidence documenting pipeline recovery timelines and recurring failure patterns.
    - Cloud-native scheduling and flow-level error-trapping ensure continuous sentinel operation independent of external cron infrastructure.

    ## Prerequisites

    - Apache SeaTunnel cluster running with Zeta Engine REST HTTP service enabled (default port 8080).
    - Network connectivity permitting HTTP communication from Kestra to the SeaTunnel coordinator.
    - Slack incoming webhook URL for operational incident dispatch.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for posting incident cards to Slack.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Deploy this blueprint to your Kestra instance and trigger an initial run with default inputs to verify connectivity against your SeaTunnel coordinator.
    3. Review the execution log in the Kestra UI to verify `/finished-jobs/FAILED` response parsing.
    4. Enable the `every_fifteen_minutes` schedule trigger to activate automated continuous monitoring.

    ## How to extend

    - Add `/running-jobs` inspection to calculate elapsed execution time and flag stuck batch jobs.
    - Integrate PagerDuty alerting via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for critical real-time ingestion pipeline failures.
    - Attach automated job restart triggers using SeaTunnel CLI or API to automatically re-enqueue transiently failed jobs.

    ## Links

    - [Apache SeaTunnel Zeta Engine REST API Documentation](https://seatunnel.apache.org/docs/seatunnel-engine/rest-api/)
    - [Apache SeaTunnel Architecture Overview](https://seatunnel.apache.org/docs/concept/architecture/)
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
