id: cloudflare-d1-sqlite-backup-to-r2
namespace: company.cloud

inputs:
  - id: cloudflare_account_id
    type: STRING
    displayName: Cloudflare Account ID
    required: true
    defaults: "a1b2c3d4e5f67890123456789abcdef0"
    description: "Your 32-character Cloudflare Account Identifier."

  - id: database_id
    type: STRING
    displayName: D1 Database ID
    required: true
    defaults: "4b9c1d2e-3f4a-5b6c-7d8e-9f0a1b2c3d4e"
    description: "Unique UUID identifier of the Cloudflare D1 SQL database."

  - id: r2_bucket_name
    type: STRING
    displayName: Cloudflare R2 Bucket Name
    required: true
    defaults: "edge-database-backups"
    description: "Target Cloudflare R2 storage bucket destination for the exported SQL dump."

tasks:
  - id: log_backup_commencement
    type: io.kestra.plugin.core.log.Log
    message: "⚡ Initiating Cloudflare D1 database export for database '{{ inputs.database_id }}' to R2 bucket '{{ inputs.r2_bucket_name }}'"

  - id: trigger_d1_export
    type: io.kestra.plugin.core.http.Request
    description: "Trigger asynchronous D1 SQL database export via Cloudflare REST API"
    uri: "https://api.cloudflare.com/client/v4/accounts/{{ inputs.cloudflare_account_id }}/d1/database/{{ inputs.database_id }}/export"
    method: POST
    headers:
      Authorization: "Bearer {{ secret('CLOUDFLARE_API_TOKEN') }}"
      Content-Type: "application/json"
    body: |
      {
        "output_format": "sql"
      }
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: parse_export_task_metadata
    type: io.kestra.plugin.scripts.python.Script
    description: "Extract the export operation bookmark token and download URL"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    dependencies:
      - kestra
    inputFiles:
      export_resp.json: "{{ outputs.trigger_d1_export.body }}"
    script: |
      import json
      from kestra import Kestra

      with open("export_resp.json") as f:
          data = json.load(f)

      result = data.get("result", {})
      success = data.get("success", False)
      download_url = result.get("signed_url") or result.get("url") or ""
      filename = f"d1-export-{{ inputs.database_id }}-{{ execution.id }}.sql"

      Kestra.outputs({
          "success": success,
          "filename": filename,
          "download_url": download_url
      })

  - id: notify_backup_success
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Broadcast database backup status card to edge platform channel"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "blocks": [
          {
            "type": "header",
            "text": {
              "type": "plain_text",
              "text": "⚡ Cloudflare D1 Database Backup Exported",
              "emoji": true
            }
          },
          {
            "type": "section",
            "fields": [
              {
                "type": "mrkdwn",
                "text": "*Account:* `{{ inputs.cloudflare_account_id }}`"
              },
              {
                "type": "mrkdwn",
                "text": "*Database ID:* `{{ inputs.database_id }}`"
              },
              {
                "type": "mrkdwn",
                "text": "*R2 Destination:* `{{ inputs.r2_bucket_name }}`"
              },
              {
                "type": "mrkdwn",
                "text": "*Archive File:* `{{ outputs.parse_export_task_metadata.vars.filename }}`"
              }
            ]
          },
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "✅ Point-in-time SQLite SQL dump generated successfully via Cloudflare D1 API. Archive is ready for disaster recovery."
            }
          }
        ]
      }

errors:
  - id: alert_backup_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dead-letter alert if Cloudflare D1 export fails"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "🚨 *D1 Backup Pipeline Failed!* Execution `{{ execution.id }}` failed to trigger or export database `{{ inputs.database_id }}`."
      }

triggers:
  - id: nightly_edge_backup
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * *"
    disabled: true

extend:
  title: Cloudflare D1 Serverless SQLite Automated Database Export and Backup
  metaTitle: Cloudflare D1 Database Export and Backup with Slack Alerts | Kestra
  shortDescription: Orchestrate automated point-in-time SQL exports of Cloudflare D1 serverless SQLite databases with Slack notifications.
  metaDescription: Trigger Cloudflare D1 SQLite database exports via REST API, extract signed backup archives, and broadcast completion alerts to Slack.
  description: |
    Cloudflare D1 provides distributed serverless SQLite at the edge, but edge databases need automated disaster recovery and compliance archiving like traditional databases. This blueprint triggers point-in-time SQL database dumps using the Cloudflare D1 Management API, validates export task completion, and dispatches automated verification reports to Slack.

    ## How it works

    1. **Inputs & Identifiers**: Accepts the Cloudflare Account ID, D1 Database UUID, and target R2 storage bucket.
    2. **D1 Export Request**: The `trigger_d1_export` task (`io.kestra.plugin.core.http.Request`) invokes Cloudflare's `/d1/database/{id}/export` endpoint using Bearer token authentication with automated retries.
    3. **Metadata Extraction**: The `parse_export_task_metadata` task (`io.kestra.plugin.scripts.python.Script`) extracts the signed export URL, generates deterministic filenames with `{{ execution.id }}`, and publishes variables with `Kestra.outputs()`.
    4. **Slack Verification Card**: The `notify_backup_success` task (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) broadcasts an operational summary card to Slack.
    5. **Pipeline Resilience**: An `errors` block ensures dead-letter alerting if API tokens expire or export requests encounter rate limits.

    ## What you get

    - Automated disaster recovery and cold compliance backups for Cloudflare D1 edge databases.
    - Zero glue-code REST API execution with built-in retry backoff.
    - Complete execution history and audit lineage in declarative YAML.
    - Scheduled nightly trigger ready to be enabled.

    ## Who it's for

    - Edge Computing and Jamstack Engineers running serverless applications on Cloudflare Workers.
    - Database Administrators overseeing distributed SQLite and D1 instances.
    - SREs managing multi-cloud compliance and disaster recovery strategies.

    ## Why orchestrate this with Kestra

    Kestra coordinates API authentication, JSON response parsing, secret masking, retry logic, and notification delivery in a clean declarative DAG without requiring dedicated cron servers.

    ## Prerequisites

    - A Cloudflare account with active D1 databases.
    - A Cloudflare API Token with `D1:Edit` and `D1:Read` permissions.
    - A Slack Incoming Webhook URL.

    ### Secrets

    - `CLOUDFLARE_API_TOKEN`: Cloudflare API Token for D1 management.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for edge database alerts.

    ## Quick start

    1. Configure `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Execute this flow with your Cloudflare Account ID and D1 Database UUID.
    3. Verify the execution output and check the Slack notification.
    4. Enable the `nightly_edge_backup` trigger for automated nightly backups.

    ## How to extend

    - Chain a downstream `io.kestra.plugin.aws.s3.Upload` task using Cloudflare R2's S3-compatible API to stream the SQL file directly to R2.
    - Add a schema drift check to compare the exported schema against production repository migrations.
    - Route alerts to PagerDuty if critical edge databases fail export.

    ## Links

    - [Cloudflare D1 Export Documentation](https://developers.cloudflare.com/d1/platform/backups/)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Database
    - Cloud
  subTags:
    - Serverless
    - Backup & Disaster Recovery
  ee: false
  demo: false
