id: http-latency-probe-matrix
namespace: company.team
description: |
  Probe a URL repeatedly, compute latency percentiles, and alert Slack when
  p95 climbs past your budget — a lightweight synthetic check you own.

triggers:
  - id: every_15min
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs the probe matrix every 15 minutes; shipped disabled until the URL and budget are set.
    cron: "*/15 * * * *"
    disabled: true
  - id: incident_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Fire an immediate probe run while debugging a live incident.
    key: latency-probe

inputs:
  - id: url
    type: STRING
    defaults: "https://example.com"
    description: Endpoint to probe.

  - id: samples
    type: INT
    defaults: 10
    description: Number of requests per run.

  - id: p95_budget_ms
    type: INT
    defaults: 800
    description: Budget for the 95th-percentile response time in milliseconds.

tasks:
  - id: probe_latency
    type: io.kestra.plugin.scripts.python.Script
    description: Fire N timed requests at the URL and emit min/mean/p95 plus failure count via Kestra outputs.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra
    warningOnStdErr: false
    env:
      URL: "{{ inputs.url }}"
      SAMPLES: "{{ inputs.samples }}"
    script: |
      import os
      import statistics
      import time
      import urllib.request
      from kestra import Kestra

      url = os.environ["URL"]
      samples = int(os.environ["SAMPLES"])
      latencies, failures = [], 0
      for _ in range(samples):
          started = time.perf_counter()
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "kestra-latency-probe"})
              with urllib.request.urlopen(req, timeout=10) as r:
                  r.read(256)
              latencies.append(int((time.perf_counter() - started) * 1000))
          except Exception:
              failures += 1
              latencies.append(10000)

      latencies.sort()
      p95 = latencies[max(0, int(0.95 * len(latencies)) - 1)]
      mean_val = int(statistics.mean(latencies))
      min_val = latencies[0]

      print(f"p95 {p95}ms over {samples} samples, mean {mean_val}ms, failures {failures}")

      Kestra.outputs({
          "p95": p95,
          "mean": mean_val,
          "min": min_val,
          "failures": failures
      })

  - id: check_budget
    type: io.kestra.plugin.core.flow.If
    description: Breach either the p95 budget or the failure allowance -> page Slack with the numbers.
    condition: "{{ outputs.probe_latency.vars.p95 > inputs.p95_budget_ms or outputs.probe_latency.vars.failures > 0 }}"
    then:
      - id: alert_latency_breach
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post p95, mean, and failures next to the budget so the message carries the size of the problem.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: Latency breach on {{ inputs.url }} — p95 {{ outputs.probe_latency.vars.p95 }}ms (budget {{ inputs.p95_budget_ms }}ms), mean {{ outputs.probe_latency.vars.mean }}ms, failures {{ outputs.probe_latency.vars.failures }}/{{ inputs.samples }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_within_budget
        type: io.kestra.plugin.core.log.Log
        description: Record healthy numbers on every run so the execution history is your latency trend.
        message: "Latency within budget on {{ inputs.url }}: p95 {{ outputs.probe_latency.vars.p95 }}ms, mean {{ outputs.probe_latency.vars.mean }}ms, failures {{ outputs.probe_latency.vars.failures }}."

outputs:
  - id: p95
    type: INT
    value: "{{ outputs.probe_latency.vars.p95 }}"
  - id: mean
    type: INT
    value: "{{ outputs.probe_latency.vars.mean }}"
  - id: min
    type: INT
    value: "{{ outputs.probe_latency.vars.min }}"
  - id: failures
    type: INT
    value: "{{ outputs.probe_latency.vars.failures }}"

errors:
  - id: alert_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the probe script itself fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Latency probe FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.url }}."
      }

extend:
  title: Probe Endpoint Latency and Gate on p95
  shortDescription: Fires repeated timed requests at a URL, computes p95/mean, and alerts Slack when the p95 budget breaks.
  metaTitle: HTTP Latency Probe with p95 Gate
  metaDescription: Synthetic latency probe matrix that alerts Slack when p95 exceeds your budget or requests fail.
  description: |
    Uptime says "up"; p95 says "usable". This blueprint fires N timed requests at your URL every 15 minutes, computes min/mean/p95 plus failure count, and pages Slack only when the p95 budget breaks. Clean runs log their numbers so your execution history is the latency trend.

    ## How it works
    1. `probe_latency` (`io.kestra.plugin.scripts.python.Script`) sends `samples` requests, times each, treats errors as 10s sentinels, and emits `p95`, `mean`, `min`, `failures` via Kestra outputs.
    2. `check_budget` (`io.kestra.plugin.core.flow.If`) branches: breach -> `alert_latency_breach` with stats; healthy -> `log_within_budget`.
    3. The `errors` block alerts Slack when the probe script itself fails.
    4. Triggers: a 15-minute `Schedule` (disabled by default) plus a `Webhook` for incident-time probes.

    ## What you get
    - A p95-based alert instead of "is it down".
    - Failure counts alongside latency, not instead of them.
    - Standardized outputs for dashboards and SLO calculations.

    ## Prerequisites
    - The URL reachable from the Kestra Worker.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
