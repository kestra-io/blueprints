id: hashicorp-vault-sys-health-dr-replication-sentinel
namespace: company.security

inputs:
  - id: vault_addr
    type: STRING
    defaults: "http://vault.internal:8200"
    description: Vault server address.

tasks:
  - id: query_vault_replication
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Check Vault sys/health and replication status
        HEALTH_STATUS=$(curl -s "{{ inputs.vault_addr }}/v1/sys/health" | jq -r '.initialized // false')
        
        curl -s -H "X-Vault-Token: {{ secret('VAULT_TOKEN') }}"           "{{ inputs.vault_addr }}/v1/sys/replication/dr/status" > /tmp/vault_dr_telemetry.json
        
        DR_MODE=$(jq -r '.data.mode // "disabled"' /tmp/vault_dr_telemetry.json)
        DR_STATE=$(jq -r '.data.state // "unknown"' /tmp/vault_dr_telemetry.json)
        
        echo "::set-output name=dr_mode::$DR_MODE::"
        echo "::set-output name=dr_state::$DR_STATE::"

  - id: evaluate_replication_state
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_vault_replication.vars.dr_mode != 'disabled' and outputs.query_vault_replication.vars.dr_state != 'running' and outputs.query_vault_replication.vars.dr_state != 'idle' }}"
    then:
      - id: notify_security_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#security-ops",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 HashiCorp Vault DR Replication Degraded Alert",
                "text": "HashiCorp Vault at `{{ inputs.vault_addr }}` reported abnormal DR replication state *{{ outputs.query_vault_replication.vars.dr_state }}* (mode: {{ outputs.query_vault_replication.vars.dr_mode }})! Cross-region secret replication stream is stalled or disconnected.",
                "footer": "Kestra Security Sentinel • HashiCorp Vault"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#security-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Vault DR Sentinel Failure",
            "text": "Failed to connect to Vault API. Verify Vault address and secret token permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: HashiCorp Vault Disaster Recovery (DR) Replication and Health Sentinel
  shortDescription: Audits HashiCorp Vault cluster health and Disaster Recovery (DR) replication stream status to prevent secret synchronization divergence.
  description: |
    ## How it works
    This workflow connects to the HashiCorp Vault HTTP API (`/v1/sys/replication/dr/status`) to audit the Disaster Recovery replication engine status. In enterprise multi-region Vault deployments, DR replication continuously synchronizes cryptographic keys, transit tokens, AppRoles, and secrets from primary clusters to secondary clusters over mTLS streams. If network partitions or raft WAL lag stalls replication (`state != "running"`), the secondary cluster falls out of sync, jeopardizing automated disaster failover capabilities. This workflow validates replication integrity continuously.

    ## What you get
    - Real-time detection of stalled or disconnected Vault DR replication links.
    - Guarantees disaster recovery readiness across secondary cloud regions.
    - Clear visibility into replication modes and operational states.

    ## Who it's for
    - Cloud Security Architects and Platform Engineers managing HashiCorp Vault Enterprise.
    - SREs responsible for multi-region business continuity and secret management.

    ## Why orchestrate this with Kestra
    - **Automated Health Verification**: Polls Vault replication endpoints on an automated schedule.
    - **Secure Token Handling**: Injects administrative tokens safely using Kestra secret store.
    - **Instant Incident Dispatch**: Escalates replication stalls directly to cloud security teams.

    ## Prerequisites
    - HashiCorp Vault cluster with DR replication enabled and admin token.
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input your Vault server address.
    3. Run the workflow to inspect DR replication state.

    ## How to extend
    - Query Performance Replication status (`/v1/sys/replication/performance/status`).
    - Alert on replication WAL lag delta exceeding 1000 transactions.

    ## Links
    - [Vault Disaster Recovery Replication Documentation](https://developer.hashicorp.com/vault/docs/enterprise/replication)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
