id: hashicorp-vault-sys-health-dr-replication-sentinel
namespace: company.team
description: Audits HashiCorp Vault cluster health and Disaster Recovery (DR) replication stream status to prevent secret synchronization divergence.

inputs:
  - id: vault_addr
    type: STRING
    defaults: "http://vault.internal:8200"
    description: Vault server address.

tasks:
  - id: query_vault_replication
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    description: Query Vault sys/health and sys/replication/dr/status endpoints
    env:
      VAULT_ADDR: "{{ inputs.vault_addr }}"
      VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      vault_addr = os.environ.get("VAULT_ADDR", "http://vault.internal:8200").rstrip("/")
      token = os.environ.get("VAULT_TOKEN")

      if not token:
          print("CRITICAL: VAULT_TOKEN secret must be configured", file=sys.stderr)
          sys.exit(1)

      headers = {
          "X-Vault-Token": token,
          "User-Agent": "Kestra-Vault-Sentinel"
      }

      # Check sys/health (returns 200, 429, 472, 473, 501, 503)
      health_url = f"{vault_addr}/v1/sys/health"
      try:
          h_resp = requests.get(health_url, timeout=15)
          if h_resp.status_code in (200, 429, 472, 473, 501, 503):
              h_data = h_resp.json()
          else:
              h_resp.raise_for_status()
              h_data = h_resp.json()
          is_initialized = h_data.get("initialized", False)
      except Exception as e:
          print(f"CRITICAL: Failed to query Vault health at {health_url}: {e}", file=sys.stderr)
          sys.exit(1)

      # Check DR replication status
      dr_url = f"{vault_addr}/v1/sys/replication/dr/status"
      try:
          dr_resp = requests.get(dr_url, headers=headers, timeout=20)
          dr_resp.raise_for_status()
          dr_data = dr_resp.json().get("data", {})
      except Exception as e:
          print(f"CRITICAL: Failed to query Vault DR replication at {dr_url}: {e}", file=sys.stderr)
          sys.exit(1)

      dr_mode = dr_data.get("mode", "disabled")
      dr_state = dr_data.get("state", "unknown")

      is_degraded = (dr_mode != "disabled") and (dr_state not in ("running", "idle"))
      print(f"Replication status: mode={dr_mode}, state={dr_state}, degraded={is_degraded}")

      Kestra.outputs({
          "vault_addr": vault_addr,
          "initialized": is_initialized,
          "dr_mode": dr_mode,
          "dr_state": dr_state,
          "alert_triggered": is_degraded
      })

  - id: evaluate_replication_state
    type: io.kestra.plugin.core.flow.If
    description: Alert security operations if DR replication is degraded
    condition: "{{ outputs.query_vault_replication.vars.alert_triggered == true }}"
    then:
      - id: notify_security_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#security-ops",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 HashiCorp Vault DR Replication Degraded Alert",
                "text": "HashiCorp Vault at `{{ inputs.vault_addr }}` reported abnormal DR replication state *{{ outputs.query_vault_replication.vars.dr_state }}* (mode: {{ outputs.query_vault_replication.vars.dr_mode }})! Cross-region secret replication stream is stalled or disconnected.",
                "footer": "Kestra Security Sentinel • HashiCorp Vault"
              }
            ]
          }

outputs:
  - id: dr_mode
    type: STRING
    value: "{{ outputs.query_vault_replication.vars.dr_mode }}"
  - id: dr_state
    type: STRING
    value: "{{ outputs.query_vault_replication.vars.dr_state }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.query_vault_replication.vars.alert_triggered }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#security-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Vault DR Sentinel Failure",
            "text": "Failed to connect to Vault API at {{ inputs.vault_addr }} on execution `{{ execution.id }}`. Verify Vault address and secret token permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Audits HashiCorp Vault cluster health and Disaster Recovery (DR) replication stream status to prevent secret synchronization divergence.
  metaTitle: HashiCorp Vault Disaster Recovery (DR) Replication and Health Sentinel with Kestra
  title: HashiCorp Vault Disaster Recovery (DR) Replication and Health Sentinel
  shortDescription: Audits HashiCorp Vault cluster health and Disaster Recovery (DR) replication stream status to prevent secret synchronization divergence.
  description: |
    ## How it works
    This workflow connects to the HashiCorp Vault HTTP API (`/v1/sys/replication/dr/status`) to audit the Disaster Recovery replication engine status. In enterprise multi-region Vault deployments, DR replication continuously synchronizes cryptographic keys, transit tokens, AppRoles, and secrets from primary clusters to secondary clusters over mTLS streams. If network partitions or raft WAL lag stalls replication, the secondary cluster falls out of sync, jeopardizing automated disaster failover capabilities. This workflow validates replication integrity continuously.

    ## What you get
    - Real-time detection of stalled or disconnected Vault DR replication links.
    - Guarantees disaster recovery readiness across secondary cloud regions.
    - Clear visibility into replication modes and operational states.

    ## Who it's for
    - Cloud Security Architects and Platform Engineers managing HashiCorp Vault Enterprise.
    - SREs responsible for multi-region business continuity and secret management.

    ## Prerequisites
    - HashiCorp Vault cluster with DR replication enabled and admin token.
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Security
  ee: false
  demo: false
