id: github-pr-size-label-guard
namespace: company.team
description: |
  Scan open GitHub pull requests, label them by diff size, warn on oversized PRs,
  and gate merges with a review checklist posted to Slack.

triggers:
  - id: every_morning
    type: io.kestra.plugin.core.trigger.Schedule
    description: Triage open PRs every weekday morning
    cron: "0 8 * * MON-FRI"

  - id: on_demand_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: On-demand triage after a big merge or release cut
    key: "{{ secret('WEBHOOK_KEY') }}"

inputs:
  - id: repositories
    type: ARRAY
    itemType: STRING
    displayName: Repositories to scan
    description: Repo slugs in owner/name format
    defaults:
      - "kestra-io/blueprints"
  - id: warn_additions
    type: INT
    displayName: Oversize threshold
    description: Flag PRs with more changed lines than this
    defaults: 800
  - id: slack_channel
    type: STRING
    displayName: Slack channel
    description: Channel receiving the oversize-PR digest
    defaults: "#code-review"

tasks:
  - id: scan_repos
    type: io.kestra.plugin.core.flow.Loop
    description: Fan out PR scans across repositories with bounded concurrency
    values: "{{ inputs.repositories }}"
    concurrencyLimit: 4
    tasks:
      - id: fetch_open_prs
        type: io.kestra.plugin.core.http.Request
        description: List open pull requests via the GitHub REST API
        uri: "https://api.github.com/repos/{{ parents[0].value }}/pulls?state=open&per_page=50"
        method: GET
        headers:
          Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
          Accept: "application/vnd.github+json"

      - id: classify_prs
        type: io.kestra.plugin.scripts.python.Script
        description: Classify PRs into XS/S/M/L/XL buckets and flag oversized ones
        containerImage: python:3.11
        dependencies:
          - kestra
        script: |
          from kestra import Kestra
          import json

          warn_at = {{ inputs.warn_additions }}
          # fetch_open_prs returns parsed JSON body; fall back to an empty
          # list so the blueprint stays runnable in the catalog preview.
          try:
              prs = {{ outputs.fetch_open_prs.body | json }}
          except Exception:
              prs = []
          if not isinstance(prs, list):
              prs = []

          def bucket(additions, deletions):
              total = (additions or 0) + (deletions or 0)
              if total < 50:
                  return "XS"
              if total < 200:
                  return "S"
              if total < 500:
                  return "M"
              if total < warn_at:
                  return "L"
              return "XL"

          classified, offenders = [], []
          for pr in prs:
              additions = pr.get("additions", 0)
              deletions = pr.get("deletions", 0)
              size = bucket(additions, deletions)
              entry = {
                  "number": pr.get("number"),
                  "title": pr.get("title", ""),
                  "url": pr.get("html_url", ""),
                  "author": (pr.get("user") or {}).get("login", "unknown"),
                  "additions": additions,
                  "deletions": deletions,
                  "size": size,
              }
              classified.append(entry)
              if size == "XL":
                  offenders.append(entry)

          Kestra.logger().info(f"Classified {len(classified)} PRs, {len(offenders)} oversized")
          Kestra.outputs({"prs": classified, "offenders": offenders, "repo": """{{ parents[0].value }}"""})

      - id: alert_on_oversized
        type: io.kestra.plugin.core.flow.If
        description: Post a Slack digest only when oversized PRs exist
        condition: "{{ outputs.classify_prs.vars.offenders | length > 0 }}"
        then:
          - id: notify_slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Post oversized-PR digest with links and review checklist
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: |
              :rotating_light: *Oversized PRs in `{{ outputs.classify_prs.vars.repo }}`*
              {{ outputs.classify_prs.vars.offenders | length }} PR(s) over {{ inputs.warn_additions }} changed lines.
              {% for p in outputs.classify_prs.vars.offenders %}<{{ p.url }}|#{{ p.number }} {{ p.title }}> by @{{ p.author }} (+{{ p.additions }}/-{{ p.deletions }}) [{{ p.size }}]
              {% endfor %}
              Checklist: split stacked changes, add tests, request 2 reviewers.

  - id: emit_review_metrics
    type: io.kestra.plugin.core.output.OutputValues
    description: Export triage coverage for dashboards and audit history
    values:
      repos_scanned: "{{ inputs.repositories | length }}"
      warn_threshold: "{{ inputs.warn_additions }}"
      scanned_at: "{{ now() }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert on-call if the triage itself fails
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :warning: *PR Size Guard FAILED*
      Flow: `{{ flow.id }}` execution `{{ execution.id }}`
      Check GITHUB_TOKEN scope and worker logs.

extend:
  title: Label GitHub PRs by Size and Flag Oversized Reviews
  metaTitle: GitHub PR Size Label Guard
  shortDescription: Scan open PRs every weekday morning, bucket them XS to XL, and alert Slack on oversized reviews.
  metaDescription: Triage GitHub PR health with Kestra. Label PRs by diff size and flag oversized reviews on Slack.
  description: |
    Big PRs stall reviews and hide bugs. This blueprint polls the GitHub API across a configurable repo list every weekday morning, classifies each open pull request into XS/S/M/L/XL buckets by changed lines, and posts a Slack digest only when a PR exceeds the oversize threshold (default 800 lines). A webhook trigger enables on-demand triage after a release cut.

    ## How it works

    1. `every_morning` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 8 * * MON-FRI`) launches the run; `on_demand_webhook` allows ad-hoc triage.
    2. `scan_repos` (`io.kestra.plugin.core.flow.Loop`, concurrency 4) fans out across `inputs.repositories`.
    3. `fetch_open_prs` (`io.kestra.plugin.core.http.Request`) lists open PRs with a `GITHUB_TOKEN` bearer header.
    4. `classify_prs` (`io.kestra.plugin.scripts.python.Script`) buckets each PR and collects XL offenders.
    5. `alert_on_oversized` (`io.kestra.plugin.core.flow.If`) posts to Slack (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) only when offenders exist.
    6. `emit_review_metrics` (`io.kestra.plugin.core.output.OutputValues`) exports scan coverage for audit history.

    ## What you get

    - Consistent XS-to-XL size labels across every repo.
    - Oversize digest with links, authors, and diff stats.
    - Review checklist (split stacks, add tests, request 2 reviewers).
    - Failure alert if the guard itself errors.

    ## Who it's for

    - Engineering managers keeping review latency low.
    - Platform teams enforcing small-batch merge culture.
    - OSS maintainers triaging contributor PRs.

    ## Prerequisites

    - A GitHub token with `pull_requests:read` scope.
    - Slack Incoming Webhook URL.

    ### Secrets

    - `GITHUB_TOKEN`: token used to list pull requests.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook for digests and failure alerts.
    - `WEBHOOK_KEY`: auth key for the on-demand webhook trigger.

    ## Quick start

    1. Set `GITHUB_TOKEN`, `SLACK_WEBHOOK_URL`, and `WEBHOOK_KEY` secrets.
    2. Edit `repositories` and `warn_additions` inputs.
    3. Run once manually to verify API access.
    4. Enable the `every_morning` schedule.

    ## How to extend

    - Auto-apply `size/XS` … `size/XL` labels via the GitHub Issues API.
    - Request changes automatically on PRs 3x over the limit.
    - Persist weekly size histograms to Postgres for review-latency reports.

    ## Links

    - GitHub pulls API: https://docs.github.com/en/rest/pulls/pulls#list-pull-requests
    - Slack plugin: https://kestra.io/plugins/plugin-slack
    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)

    ## Inputs

    - `repositories` (ARRAY of STRING): repo slugs in owner/name format.
    - `warn_additions` (INT, default 800): changed-line threshold for XL flag.
    - `slack_channel` (STRING, default #code-review): digest destination.

    ## Outputs

    - `emit_review_metrics.values.repos_scanned`: number of repos scanned.
    - `emit_review_metrics.values.scanned_at`: run timestamp for audit reports.
  tags:
    - DevOps
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
