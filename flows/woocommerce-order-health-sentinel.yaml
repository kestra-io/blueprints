id: woocommerce-order-health-sentinel
namespace: company.team
description: |
  On a schedule, read recent orders from the WooCommerce REST API
  (read-only: no order is changed) and classify store health as HEALTHY,
  WARNING, CRITICAL, LOW_VOLUME or UNREACHABLE. Log quiet runs and alert
  Slack when checkout payments start failing or paid orders sit in
  processing without being shipped.

inputs:
  - id: lookback_hours
    type: INT
    defaults: 48
    displayName: "Lookback Window (hours)"
    description: "Judge orders created in this many hours."
  - id: warning_failure_rate
    type: FLOAT
    defaults: 10.0
    displayName: "Warning Failure Rate (%)"
    description: "At or above this share of failed orders among checkout attempts, the check is classified WARNING."
  - id: critical_failure_rate
    type: FLOAT
    defaults: 25.0
    displayName: "Critical Failure Rate (%)"
    description: "At or above this share of failed orders, the check is classified CRITICAL."
  - id: min_attempts
    type: INT
    defaults: 10
    displayName: "Minimum Attempts"
    description: "Below this many checkout attempts, the failure rate is not judged."
  - id: max_processing_hours
    type: INT
    defaults: 24
    displayName: "Maximum Processing Hours"
    description: "A paid order still in processing for longer than this is counted as stuck and classified WARNING."

triggers:
  - id: hourly_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check order health every hour. Shipped disabled; enable it once the WooCommerce secrets are set and a manual run has been verified.
    cron: "15 * * * *"
    disabled: true

tasks:
  - id: list_orders
    type: io.kestra.plugin.core.http.Request
    description: Read up to 100 of the newest orders. The `after` filter is applied in the store's own time zone, so the request asks for an extra day and the exact window is applied in the next task on `date_created_gmt`. This is a GET; no order is changed.
    uri: "{{ secret('WOOCOMMERCE_STORE_URL') }}/wp-json/wc/v3/orders?per_page=100&orderby=date&order=desc&after={{ now() | dateAdd(-(inputs.lookback_hours + 24), 'HOURS') | date(\"yyyy-MM-dd'T'HH:mm:ss\", timeZone=\"UTC\") }}"
    method: GET
    options:
      auth:
        type: BASIC
        username: "{{ secret('WOOCOMMERCE_CONSUMER_KEY') }}"
        password: "{{ secret('WOOCOMMERCE_CONSUMER_SECRET') }}"
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: summarize_orders
    type: io.kestra.plugin.core.debug.Return
    description: Keep orders created inside the window (by `date_created_gmt`), treat failed, processing, on-hold, completed and refunded orders as checkout attempts (pending and cancelled are abandoned checkouts), compute the failed share and the worst payment method, count paid orders stuck in processing, and classify in one jq query. A missing or non-200 response becomes UNREACHABLE.
    format: >-
      {{ (outputs.list_orders.code is not defined or outputs.list_orders.code != 200)
      ? '{"status":"UNREACHABLE","attempts":0,"failed":0,"rate":0,"stuck_processing":0,"worst_method":"none"}'
      : (fromJson(outputs.list_orders.body) | jq('
      [.[] | select(.date_created_gmt >= "' ~ (now() | dateAdd(-inputs.lookback_hours, 'HOURS') | date("yyyy-MM-dd'T'HH:mm:ss", timeZone="UTC")) ~ '")] as $w
      | [$w[] | select(.status == "failed" or .status == "processing" or .status == "on-hold" or .status == "completed" or .status == "refunded")] as $a
      | ($a | length) as $n
      | ([$a[] | select(.status == "failed")] | length) as $f
      | (if $n == 0 then 0 else (($f * 1000 / $n) | floor) / 10 end) as $r
      | ([.[] | select(.status == "processing" and .date_created_gmt < "' ~ (now() | dateAdd(-inputs.max_processing_hours, 'HOURS') | date("yyyy-MM-dd'T'HH:mm:ss", timeZone="UTC")) ~ '")] | length) as $s
      | {attempts: $n, failed: $f, rate: $r, stuck_processing: $s,
      worst_method: ([$a | group_by(.payment_method_title)[] | {m: .[0].payment_method_title, n: length, f: ([.[] | select(.status == "failed")] | length)}] | max_by(.f / .n) | .m // "none"),
      status: (if $n >= ' ~ inputs.min_attempts ~ ' and $r >= ' ~ inputs.critical_failure_rate ~ ' then "CRITICAL"
      elif ($n >= ' ~ inputs.min_attempts ~ ' and $r >= ' ~ inputs.warning_failure_rate ~ ') or $s > 0 then "WARNING"
      elif $n < ' ~ inputs.min_attempts ~ ' then "LOW_VOLUME"
      else "HEALTHY" end)}
      ') | first | toJson) }}

  - id: route_by_order_health
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when orders are healthy or volume is too low to judge, a Slack message when failures rise or paid orders are stuck, or a Slack page when failures cross the critical line or the store could not be read.
    value: "{{ fromJson(outputs.summarize_orders.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "WooCommerce orders healthy: {{ fromJson(outputs.summarize_orders.value).failed }} of {{ fromJson(outputs.summarize_orders.value).attempts }} checkout attempts failed ({{ fromJson(outputs.summarize_orders.value).rate }}%) in the last {{ inputs.lookback_hours }} hour(s), no paid order stuck in processing."
      "LOW_VOLUME":
        - id: log_low_volume
          type: io.kestra.plugin.core.log.Log
          message: "WooCommerce orders: only {{ fromJson(outputs.summarize_orders.value).attempts }} checkout attempt(s) in the last {{ inputs.lookback_hours }} hour(s), below the minimum of {{ inputs.min_attempts }}; failure rate not judged, no paid order stuck in processing."
      "WARNING":
        - id: alert_warning_orders
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post a Slack message when the failure rate is at or above the warning line or paid orders are stuck in processing.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "WooCommerce order health WARNING: {{ fromJson(outputs.summarize_orders.value).failed }} of {{ fromJson(outputs.summarize_orders.value).attempts }} checkout attempts failed ({{ fromJson(outputs.summarize_orders.value).rate }}%, worst method: {{ fromJson(outputs.summarize_orders.value).worst_method }}) and {{ fromJson(outputs.summarize_orders.value).stuck_processing }} paid order(s) have been in processing for more than {{ inputs.max_processing_hours }} hours. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_orders
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the failure rate is at or above the critical line, which usually means the payment gateway or a plugin update broke checkout.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "WooCommerce order health CRITICAL: {{ fromJson(outputs.summarize_orders.value).failed }} of {{ fromJson(outputs.summarize_orders.value).attempts }} checkout attempts failed ({{ fromJson(outputs.summarize_orders.value).rate }}%) in the last {{ inputs.lookback_hours }} hour(s). Worst method: {{ fromJson(outputs.summarize_orders.value).worst_method }}. Customers may be unable to check out. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_store
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the Orders API could not be read, indicating the store is down, the REST API is blocked, or the keys are invalid.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "WooCommerce order sentinel UNREACHABLE: the Orders API did not return a usable response (HTTP {{ outputs.list_orders.code ?? 'no response' }}). Check that the store is up and the REST API keys are valid. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "WooCommerce order sentinel completed with an unexpected classification: {{ outputs.summarize_orders.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, so order health history stays queryable even if Slack delivery fails.
    message: "WooCommerce order sentinel audit: lookback_hours={{ inputs.lookback_hours }} http={{ outputs.list_orders.code ?? 'n/a' }} summary={{ outputs.summarize_orders.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails, so a broken check is never mistaken for a healthy store.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "WooCommerce order sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Store order health is now unknown; check the task logs and WooCommerce > Orders."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ fromJson(outputs.summarize_orders.value).status }}"

extend:
  title: "WooCommerce Order Health Sentinel"
  shortDescription: Read recent WooCommerce orders on a schedule and alert Slack when checkout payments fail or paid orders are stuck in processing.
  metaTitle: WooCommerce Order Health Sentinel for Kestra
  metaDescription: "Read recent WooCommerce orders every hour, change nothing, and alert Slack when checkout failures spike or paid orders sit unshipped."
  description: |
    A WooCommerce store can break quietly: a payment gateway plugin update, an expired API key or a bank outage turns checkouts into `failed` orders, and paid orders can sit in `processing` because nobody picked them. The store owner usually notices from an angry customer. This blueprint turns a scheduled, read-only call to the WooCommerce REST API into a store health gate: `io.kestra.plugin.core.http.Request` reads the newest orders, one jq query works out the failed share of checkout attempts, the worst payment method and the paid orders stuck in processing, and the result routes to a quiet log or a Slack alert.

    ## How it works

    1. `list_orders` (`io.kestra.plugin.core.http.Request`) calls `GET /wp-json/wc/v3/orders` for the 100 newest orders, using HTTP basic auth with the REST API consumer key and secret over HTTPS. WooCommerce applies `after` in the store's own time zone, so the request asks for an extra 24 hours and the exact window is applied on `date_created_gmt` in the next step. It is a read: no order is changed.
    2. `summarize_orders` (`io.kestra.plugin.core.debug.Return`) first guards for a missing or non-200 response (`UNREACHABLE`). Otherwise one jq query keeps orders created in the last `lookback_hours` (UTC), treats `failed`, `processing`, `on-hold`, `completed` and `refunded` as checkout attempts (`pending` and `cancelled` are usually abandoned checkouts), computes the failed share and the payment method with the worst share, and counts `processing` orders older than `max_processing_hours`. With at least `min_attempts` attempts, a failure rate at or above `critical_failure_rate` is `CRITICAL`; at or above `warning_failure_rate`, or any stuck order, is `WARNING`; too few attempts is `LOW_VOLUME`; otherwise `HEALTHY`.
    3. `route_by_order_health` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` and `LOW_VOLUME` log quietly, `WARNING` posts a Slack note, `CRITICAL` and `UNREACHABLE` page Slack. A `defaults` fallback logs anything unexpected.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run with the HTTP status and the full summary.
    5. The flow-level `errors` block pages Slack if the flow itself fails.
    6. The `hourly_check` trigger runs at quarter past every hour and ships `disabled: true`.

    ## What you get

    - An hourly, read-only check of checkout and fulfilment health with no custom scripting and no extra plugin to install.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `LOW_VOLUME` / `UNREACHABLE`) other flows can gate on, for example to pause ads while checkout is broken.
    - Slack messages that name the failing payment method and the number of paid orders waiting to ship.
    - An audit line on every run, separate from Slack.

    ## Who it's for

    - Small and mid-size online stores on WooCommerce, including the many Indian stores using Razorpay, PayU, Cashfree or cash on delivery through WooCommerce plugins.
    - Store owners and operations teams who want to hear about a broken checkout within the hour.
    - Agencies running several client stores who want the same check on each one.

    ## Why orchestrate this with Kestra

    WooCommerce emails the admin per failed order, which is easy to ignore and says nothing about a rate. Kestra turns a plain, read-only REST call into a scheduled, typed classification with retries, a failure path and an execution history, and one flow per store keeps an agency's whole portfolio in one place.

    ## Prerequisites

    - A WooCommerce store served over HTTPS with pretty permalinks enabled (required for `/wp-json/`).
    - REST API keys with Read permission from WooCommerce > Settings > Advanced > REST API.
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `WOOCOMMERCE_STORE_URL`: the store's base URL, for example `https://shop.example.com`, without a trailing slash.
    - `WOOCOMMERCE_CONSUMER_KEY`: the REST API consumer key (`ck_...`).
    - `WOOCOMMERCE_CONSUMER_SECRET`: the REST API consumer secret (`cs_...`).
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, for example `SECRET_WOOCOMMERCE_STORE_URL=$(echo -n 'https://shop.example.com' | base64)`, and read back with `{{ secret('WOOCOMMERCE_STORE_URL') }}`. Use the Enterprise secrets backend for encryption at rest and access control.

    ## Quick start

    1. Run a local WordPress with WooCommerce (for example the official `wordpress` Docker image plus the WooCommerce plugin), enable pretty permalinks and create Read-only REST API keys.
    2. If Kestra runs in Docker, attach the WordPress container to Kestra's network so the store URL resolves: `docker network connect YOUR_KESTRA_NETWORK <wordpress_container>`.
    3. Create a few test orders, set some to Failed and leave one in Processing, then run the flow manually with a low `min_attempts` and check `status`.
    4. Point the secrets at the live store and enable `hourly_check`.

    ## How to extend

    - Page through busy hours with the `page` parameter when more than 100 orders arrive in the window.
    - Add a second Request for `GET /wp-json/wc/v3/system_status` to alert on outdated templates or a failing cron.
    - Store the last status in a KV store and alert only when it changes.
    - Split thresholds by payment method, for example a looser line for cash on delivery.

    ## Inputs

    - `lookback_hours`: type INT, default `48`.
    - `warning_failure_rate`: type FLOAT, default `10.0` (percent).
    - `critical_failure_rate`: type FLOAT, default `25.0` (percent).
    - `min_attempts`: type INT, default `10`.
    - `max_processing_hours`: type INT, default `24`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `LOW_VOLUME`, `UNREACHABLE`.
    - Example path: `{{ fromJson(outputs.summarize_orders.value).stuck_processing }}` for the number of stuck paid orders.

    ## Links

    - [WooCommerce REST API: list all orders](https://woocommerce.github.io/woocommerce-rest-api-docs/#list-all-orders)
    - [WooCommerce REST API authentication](https://woocommerce.github.io/woocommerce-rest-api-docs/#authentication)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    ## Pitfalls

    - Only the 100 newest orders are read; a store with more than 100 orders in `lookback_hours + 24` hours needs paging, and stuck-order detection only sees orders inside that page.
    - Some security plugins and hosts block `/wp-json/` or strip the `Authorization` header; that shows up as `UNREACHABLE` with HTTP 401 or 403.
    - Stores that mark cash on delivery orders as `processing` until delivery will see them as stuck; raise `max_processing_hours` or exclude that method in the jq query.
    - This flow only reads; it never changes an order.
  tags:
    - Business
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
