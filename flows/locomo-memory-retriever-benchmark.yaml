id: locomo-memory-retriever-benchmark
namespace: company.team
description: |
  Benchmark retrieval strategies for long-term conversational memory on the
  public LoCoMo dataset. Every retriever runs in parallel on the same pinned
  question sample, answers are scored with both token F1 and an LLM judge,
  and Slack is alerted when your best real retriever falls below the recall bar.

triggers:
  - id: weekly_benchmark
    type: io.kestra.plugin.core.trigger.Schedule
    description: Re-run the benchmark weekly so model or prompt drift on the reader and judge shows up even when the retrievers did not change. Shipped disabled; enable it after your first manual run.
    cron: "0 7 * * 1"
    disabled: true
  - id: benchmark_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call this from CI when a chunking, embedding, or retrieval change lands, so the benchmark runs on the same commit that made the change.
    key: locomo-memory-benchmark

inputs:
  - id: dataset_url
    type: URI
    defaults: https://raw.githubusercontent.com/snap-research/locomo/main/data/locomo10.json
    description: LoCoMo JSON release to evaluate on. The `dataset_sha256` check below guarantees the file has not changed under you.
  - id: dataset_sha256
    type: STRING
    defaults: 79fa87e90f04081343b8c8debecb80a9a6842b76a7aa537dc9fdf651ea698ff4
    description: Expected SHA-256 of the dataset file. The run fails before spending a single token if the download does not match. Set it to an empty string only if you deliberately point at a different release.
  - id: sample_size
    type: INT
    defaults: 40
    description: Number of questions to evaluate, drawn deterministically from the answerable LoCoMo categories (single-hop, multi-hop, temporal, open-domain). Adversarial questions are excluded because they have no gold answer.
  - id: seed
    type: STRING
    defaults: kestra-locomo-v1
    description: Sampling seed. Keep it fixed to compare runs over time; change it to draw a fresh sample.
  - id: retrievers
    type: ARRAY
    itemType: STRING
    defaults:
      - bm25
      - recency
      - oracle
    description: Retrieval conditions to compare, one parallel branch each. `bm25` ranks turns by lexical match, `recency` takes the last turns of the conversation (a fixed context window baseline), and `oracle` hands the reader the gold evidence turns (the ceiling with perfect retrieval).
  - id: top_k
    type: INT
    defaults: 5
    description: Number of conversation turns each retriever passes to the reader.
  - id: model
    type: STRING
    defaults: gpt-4o-mini
    description: Model that reads the retrieved turns and answers the question.
  - id: judge_model
    type: STRING
    defaults: gpt-4o-mini
    description: Model that grades each answer against the gold answer as CORRECT or WRONG.
  - id: base_url
    type: STRING
    defaults: https://api.openai.com/v1
    description: OpenAI-compatible chat completions endpoint. Point it at Ollama, vLLM, or any compatible server to benchmark local models.
  - id: price_in_per_1m
    type: FLOAT
    defaults: 0.15
    description: USD per million input tokens for your model, used for the pre-run cost estimate. Check your provider's current pricing.
  - id: price_out_per_1m
    type: FLOAT
    defaults: 0.60
    description: USD per million output tokens for your model, used for the pre-run cost estimate.
  - id: max_cost_usd
    type: FLOAT
    defaults: 0.50
    description: Budget for one run. If the estimate exceeds it, the run stops before any model call.
  - id: min_recall
    type: FLOAT
    defaults: 0.5
    description: Alert threshold for recall@k of the best non-oracle retriever (0.0-1.0).

tasks:
  - id: prepare
    type: io.kestra.plugin.scripts.python.Script
    description: Download the dataset, verify its SHA-256, flatten every conversation into turns, draw a deterministic question sample, and estimate the token cost of the full run. Writes turns.json and questions.json for the retriever branches.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    outputFiles:
      - turns.json
      - questions.json
    env:
      DATASET_URL: "{{ inputs.dataset_url }}"
      DATASET_SHA256: "{{ inputs.dataset_sha256 }}"
      SAMPLE_SIZE: "{{ inputs.sample_size }}"
      SEED: "{{ inputs.seed }}"
      RETRIEVERS: "{{ inputs.retrievers | toJson }}"
      TOP_K: "{{ inputs.top_k }}"
      PRICE_IN: "{{ inputs.price_in_per_1m }}"
      PRICE_OUT: "{{ inputs.price_out_per_1m }}"
    script: |
      import hashlib
      import json
      import os
      import random
      import re
      import urllib.request

      CATEGORIES = {1: "multi_hop", 2: "temporal", 3: "open_domain", 4: "single_hop"}

      raw = urllib.request.urlopen(os.environ["DATASET_URL"], timeout=120).read()
      digest = hashlib.sha256(raw).hexdigest()
      expected = os.environ["DATASET_SHA256"].strip().lower()
      if expected and digest != expected:
          raise SystemExit("dataset SHA-256 mismatch: got %s, expected %s" % (digest, expected))

      turns = {}
      questions = []
      for sample in json.loads(raw):
          sample_id = sample["sample_id"]
          conv = sample["conversation"]
          sessions = sorted(int(k.split("_")[1]) for k in conv if re.fullmatch(r"session_\d+", k))
          conv_turns = []
          for n in sessions:
              date = conv.get("session_%d_date_time" % n, "")
              for t in conv["session_%d" % n]:
                  conv_turns.append({"dia_id": t["dia_id"], "speaker": t["speaker"], "text": t["text"], "date": date})
          turns[sample_id] = conv_turns
          known = {t["dia_id"] for t in conv_turns}

          for idx, qa in enumerate(sample.get("qa", [])):
              if qa.get("category") not in CATEGORIES or qa.get("answer") is None:
                  continue
              evidence = [e.replace("(", "").replace(")", "").strip() for e in qa.get("evidence") or []]
              # Skip questions whose evidence ids do not resolve to a turn: recall would be undefined.
              if not evidence or any(e not in known for e in evidence):
                  continue
              questions.append({
                  "qid": "%s::%d" % (sample_id, idx),
                  "sample_id": sample_id,
                  "category": CATEGORIES[qa["category"]],
                  "question": qa["question"],
                  "answer": str(qa["answer"]),
                  "evidence": evidence,
              })

      size = int(os.environ["SAMPLE_SIZE"])
      if size < 1 or size > len(questions):
          raise SystemExit("sample_size must be between 1 and %d" % len(questions))
      questions.sort(key=lambda q: q["qid"])
      sample = random.Random(os.environ["SEED"]).sample(questions, size)

      with open("turns.json", "w") as f:
          json.dump(turns, f)
      with open("questions.json", "w") as f:
          json.dump(sample, f)

      # Rough estimate: 4 characters per token, one reader call and one judge call per question per retriever.
      all_turns = [t for ts in turns.values() for t in ts]
      avg_turn_chars = sum(len(t["text"]) + 40 for t in all_turns) / len(all_turns)
      top_k = int(os.environ["TOP_K"])
      retrievers = json.loads(os.environ["RETRIEVERS"])
      reader_in = (avg_turn_chars * top_k + 400) / 4
      judge_in = 250
      calls_out = 60
      per_question = (reader_in + judge_in) * float(os.environ["PRICE_IN"]) / 1e6 + calls_out * float(os.environ["PRICE_OUT"]) / 1e6
      estimate = round(per_question * size * len(retrievers), 4)

      print("dataset %s verified, %d answerable questions, sampled %d, estimated cost $%s" % (digest[:12], len(questions), size, estimate))
      print('::{"outputs":{"dataset_sha256":"%s","questions":%d,"estimated_cost_usd":%s}}::' % (digest, size, estimate))

  - id: budget_gate
    type: io.kestra.plugin.core.flow.If
    description: Stop before any model call when the estimated cost of the run is above the budget. The errors block then reports the reason to Slack.
    condition: "{{ outputs.prepare.vars.estimated_cost_usd > inputs.max_cost_usd }}"
    then:
      - id: over_budget
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Estimated cost ${{ outputs.prepare.vars.estimated_cost_usd }} is above the ${{ inputs.max_cost_usd }} budget. Lower sample_size, top_k, or the number of retrievers, or raise max_cost_usd."

  - id: evaluate
    type: io.kestra.plugin.core.flow.Loop
    description: Run every retriever as its own parallel branch over the same question sample, so the only thing that differs between rows of the leaderboard is retrieval.
    values: "{{ inputs.retrievers }}"
    concurrencyLimit: 0
    outputs:
      - id: retriever
        type: STRING
        value: "{{ item.value }}"
      - id: results
        type: FILE
        value: "{{ outputs.run_retriever.outputFiles['results.jsonl'] }}"
    tasks:
      - id: run_retriever
        type: io.kestra.plugin.scripts.python.Script
        description: Retrieve top_k turns for each question, measure recall@k against the gold evidence turns, ask the reader model for an answer, then score it with token F1 and with the judge model. Writes one JSON line per question.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        inputFiles:
          turns.json: "{{ outputs.prepare.outputFiles['turns.json'] }}"
          questions.json: "{{ outputs.prepare.outputFiles['questions.json'] }}"
        outputFiles:
          - results.jsonl
        env:
          RETRIEVER: "{{ item.value }}"
          TOP_K: "{{ inputs.top_k }}"
          MODEL: "{{ inputs.model }}"
          JUDGE_MODEL: "{{ inputs.judge_model }}"
          BASE_URL: "{{ inputs.base_url }}"
          OPENAI_API_KEY: "{{ secret('OPENAI_API_KEY') }}"
        script: |
          import collections
          import json
          import math
          import os
          import re
          import string
          import time
          import urllib.error
          import urllib.request

          retriever = os.environ["RETRIEVER"]
          top_k = int(os.environ["TOP_K"])
          base = os.environ["BASE_URL"].rstrip("/")
          key = os.environ["OPENAI_API_KEY"]
          turns = json.load(open("turns.json"))
          questions = json.load(open("questions.json"))
          usage = {"prompt_tokens": 0, "completion_tokens": 0}

          STOP = set("a an the and or of to in on for is are was were be been do did does have has had i you he she it we they me my your his her its our their this that with at by from as what when where who which how why".split())

          def tokens(text):
              return [w for w in re.findall(r"[a-z0-9]+", text.lower()) if w not in STOP]

          index_cache = {}

          def bm25(sample_id, question, k1=1.5, b=0.75):
              if sample_id not in index_cache:
                  docs = [tokens(t["speaker"] + " " + t["text"]) for t in turns[sample_id]]
                  df = collections.Counter(w for d in docs for w in set(d))
                  avg = sum(len(d) for d in docs) / len(docs)
                  index_cache[sample_id] = (docs, df, avg)
              docs, df, avg = index_cache[sample_id]
              n = len(docs)
              scored = []
              for i, doc in enumerate(docs):
                  tf = collections.Counter(doc)
                  s = 0.0
                  for w in tokens(question):
                      if w in tf:
                          idf = math.log(1 + (n - df[w] + 0.5) / (df[w] + 0.5))
                          s += idf * tf[w] * (k1 + 1) / (tf[w] + k1 * (1 - b + b * len(doc) / avg))
                  scored.append((s, -i))
              scored.sort(reverse=True)
              return [turns[sample_id][-neg] for _, neg in scored[:top_k]]

          def retrieve(q):
              conv = turns[q["sample_id"]]
              if retriever == "bm25":
                  return bm25(q["sample_id"], q["question"])
              if retriever == "recency":
                  return conv[-top_k:]
              if retriever == "oracle":
                  wanted = set(q["evidence"])
                  return [t for t in conv if t["dia_id"] in wanted]
              raise SystemExit("unknown retriever '%s' (expected bm25, recency, or oracle)" % retriever)

          def chat(model, system, user):
              body = json.dumps({
                  "model": model,
                  "temperature": 0,
                  "messages": [{"role": "system", "content": system}, {"role": "user", "content": user}],
              }).encode()
              req = urllib.request.Request(
                  base + "/chat/completions",
                  data=body,
                  headers={"Content-Type": "application/json", "Authorization": "Bearer " + key},
                  method="POST",
              )
              last = "unknown error"
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          data = json.load(resp)
                      for field in usage:
                          usage[field] += (data.get("usage") or {}).get(field, 0)
                      return (data["choices"][0]["message"].get("content") or "").strip()
                  except urllib.error.HTTPError as e:
                      last = "HTTP %s: %s" % (e.code, e.read()[:300].decode(errors="replace"))
                      if e.code in (400, 401, 403, 404):
                          break
                  except Exception as e:
                      last = str(e)
                  time.sleep(2 * (attempt + 1))
              raise RuntimeError("model call failed: " + last)

          def normalize(text):
              text = "".join(c for c in text.lower() if c not in set(string.punctuation))
              text = re.sub(r"\b(a|an|the|and)\b", " ", text)
              return text.split()

          def token_f1(prediction, gold):
              p, g = normalize(prediction), normalize(gold)
              common = sum((collections.Counter(p) & collections.Counter(g)).values())
              if common == 0:
                  return 0.0
              precision, recall = common / len(p), common / len(g)
              return 2 * precision * recall / (precision + recall)

          READER = "You answer questions about a long conversation using only the excerpts provided. Reply with a short phrase, not a sentence. If the excerpts do not contain the answer, reply: unknown."
          JUDGE = "You grade answers. Given a question, a gold answer, and a predicted answer, reply with exactly one word: CORRECT if the prediction states the same fact as the gold answer (paraphrases and different date formats are fine), otherwise WRONG."

          rows = []
          with open("results.jsonl", "w") as out:
              for q in questions:
                  hits = sorted(retrieve(q), key=lambda t: turns[q["sample_id"]].index(t))
                  found = {t["dia_id"] for t in hits} & set(q["evidence"])
                  recall = len(found) / len(q["evidence"])
                  excerpts = "\n".join("[%s] %s: %s" % (t["date"], t["speaker"], t["text"]) for t in hits)
                  answer = chat(os.environ["MODEL"], READER, "Excerpts:\n%s\n\nQuestion: %s" % (excerpts, q["question"]))
                  verdict = chat(os.environ["JUDGE_MODEL"], JUDGE, "Question: %s\nGold answer: %s\nPredicted answer: %s" % (q["question"], q["answer"], answer))
                  row = {
                      "retriever": retriever,
                      "qid": q["qid"],
                      "category": q["category"],
                      "recall": round(recall, 4),
                      "f1": round(token_f1(answer, q["answer"]), 4),
                      "judge": 1 if verdict.upper().startswith("CORRECT") else 0,
                      "prediction": answer,
                      "gold": q["answer"],
                  }
                  rows.append(row)
                  out.write(json.dumps(row) + "\n")

          n = len(rows)
          summary = {
              "retriever": retriever,
              "questions": n,
              "recall": round(sum(r["recall"] for r in rows) / n, 4),
              "f1": round(sum(r["f1"] for r in rows) / n, 4),
              "judge_accuracy": round(sum(r["judge"] for r in rows) / n, 4),
              "prompt_tokens": usage["prompt_tokens"],
              "completion_tokens": usage["completion_tokens"],
          }
          print("%s: recall@%d %.3f, F1 %.3f, judge %.3f" % (retriever, top_k, summary["recall"], summary["f1"], summary["judge_accuracy"]))
          print("::" + json.dumps({"outputs": summary}) + "::")

  - id: leaderboard
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Load every branch's results into DuckDB and build the leaderboard. f1_judge_disagreement is the share of answers where token F1 (>= 0.5) and the judge reach different verdicts, a direct read on how much your score depends on the metric you picked.
    inputFiles: |
      {
      {%- for it in outputs.evaluate.outputs %}
        "{{ it.outputs.retriever }}.jsonl": "{{ it.outputs.results }}"{{ loop.last ? '' : ',' }}
      {%- endfor %}
      }
    fetchType: FETCH
    sql: |
      CREATE TABLE results AS SELECT * FROM read_json_auto('{{ workingDir }}/*.jsonl');

      SELECT
        retriever,
        count(*) AS questions,
        round(avg(recall), 3) AS recall_at_k,
        round(avg(f1), 3) AS token_f1,
        round(avg(judge), 3) AS judge_accuracy,
        round(avg(CASE WHEN (f1 >= 0.5) <> (judge = 1) THEN 1 ELSE 0 END), 3) AS f1_judge_disagreement,
        round(max(CASE WHEN retriever <> 'oracle' THEN avg(recall) END) OVER (), 3) AS best_retriever_recall
      FROM results
      GROUP BY retriever
      ORDER BY judge_accuracy DESC;

      SELECT retriever, category, count(*) AS questions, round(avg(recall), 3) AS recall_at_k, round(avg(judge), 3) AS judge_accuracy
      FROM results
      GROUP BY retriever, category
      ORDER BY category, retriever;

  - id: check_recall
    type: io.kestra.plugin.core.flow.If
    description: Alert when the best real retriever (oracle excluded) misses the recall bar; otherwise record the leaderboard in the execution logs.
    condition: "{{ outputs.leaderboard.outputs[0].rows[0].best_retriever_recall < inputs.min_recall }}"
    then:
      - id: alert_low_recall
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the full leaderboard so the alert shows how far each retriever is from the oracle ceiling.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "LoCoMo memory benchmark: best retriever recall@{{ inputs.top_k }} is {{ outputs.leaderboard.outputs[0].rows[0].best_retriever_recall }}, below the {{ inputs.min_recall }} bar.\n{% for r in outputs.leaderboard.outputs[0].rows %}- {{ r.retriever }}: recall {{ r.recall_at_k }}, F1 {{ r.token_f1 }}, judge {{ r.judge_accuracy }}, F1/judge disagreement {{ r.f1_judge_disagreement }}\n{% endfor %}Execution {{ execution.id }}."
          }
    else:
      - id: log_leaderboard
        type: io.kestra.plugin.core.log.Log
        description: Keep a passing run's leaderboard in the execution history so scores can be compared across runs.
        message: |
          LoCoMo memory benchmark passed ({{ outputs.prepare.vars.questions }} questions, top_k {{ inputs.top_k }}, reader {{ inputs.model }}, judge {{ inputs.judge_model }}).
          {%- for r in outputs.leaderboard.outputs[0].rows %}
          {{ r.retriever }}: recall {{ r.recall_at_k }}, F1 {{ r.token_f1 }}, judge {{ r.judge_accuracy }}, F1/judge disagreement {{ r.f1_judge_disagreement }}
          {%- endfor %}

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Report a run that produced no leaderboard (budget gate, dataset hash mismatch, rejected key, unreachable endpoint), so a broken benchmark never looks like a quiet one.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "LoCoMo memory benchmark failed in flow {{ flow.id }} (execution {{ execution.id }}). Check the execution logs: the budget gate, the dataset hash check, or the model endpoint stopped the run."
      }

outputs:
  - id: leaderboard
    type: JSON
    description: One row per retriever with recall_at_k, token_f1, judge_accuracy, and f1_judge_disagreement.
    value: "{{ outputs.leaderboard.outputs[0].rows }}"
  - id: by_category
    type: JSON
    description: Recall and judge accuracy per retriever and LoCoMo question category.
    value: "{{ outputs.leaderboard.outputs[1].rows }}"

extend:
  title: Benchmark Conversational Memory Retrievers on LoCoMo with an LLM Judge
  shortDescription: Compare BM25, recency, and oracle retrieval in parallel on the LoCoMo long-conversation benchmark, scored by token F1 and an LLM judge, with a cost gate.
  metaTitle: LoCoMo Conversational Memory Retrieval Benchmark with Kestra
  metaDescription: Compare memory retrievers in parallel on LoCoMo, score answers with F1 and an LLM judge, gate on cost, and alert Slack on low recall.
  description: |
    A chatbot with long-term memory is only as good as what it retrieves from past conversations, but end-to-end QA scores hide where the points are lost. This blueprint separates the pieces: it runs several retrieval strategies side by side on the public [LoCoMo](https://snap-research.github.io/locomo/) benchmark (long multi-session conversations with annotated evidence turns), measures retrieval directly with recall@k, then scores the final answers twice, once with token F1 and once with an LLM judge. The `oracle` branch hands the reader the gold evidence, so you can see how much headroom better retrieval would buy before you build it.

    ## How it works

    1. `prepare` downloads the LoCoMo release, verifies its SHA-256 against the pinned hash, flattens every conversation into turns, and draws a deterministic sample of answerable questions (single-hop, multi-hop, temporal, open-domain). It also estimates the token cost of the whole run.
    2. `budget_gate` (`io.kestra.plugin.core.flow.If`) fails the run before any model call when the estimate is above `max_cost_usd`.
    3. `evaluate` (`io.kestra.plugin.core.flow.Loop`, unlimited concurrency) runs one branch per retriever. Each branch retrieves `top_k` turns per question, computes recall@k against the gold evidence turns, asks the reader model for a short answer, and scores it with SQuAD-style token F1 and a CORRECT/WRONG verdict from the judge model. Per-question results go to `results.jsonl`.
    4. `leaderboard` (`io.kestra.plugin.jdbc.duckdb.Queries`) loads all branches into DuckDB and returns two tables: one row per retriever, and a per-category breakdown.
    5. `check_recall` alerts Slack with the full leaderboard when the best non-oracle retriever is below `min_recall`; otherwise the leaderboard is written to the execution logs.
    6. The `errors` block reports any failed run (budget gate, hash mismatch, rejected key) to Slack.

    ## What you get

    - A leaderboard per retriever: `recall_at_k`, `token_f1`, `judge_accuracy`, and `f1_judge_disagreement` (how often F1 and the judge disagree on the same answer, which tells you how metric-dependent your score is).
    - A per-category breakdown, since temporal and multi-hop questions usually fail for different reasons than single-hop ones.
    - The gap between each retriever and the `oracle` ceiling, which separates retrieval errors from reader errors.
    - Reproducible runs: a pinned dataset hash, a fixed sampling seed, and temperature 0.

    ## Who it's for

    - Teams building chat assistants or agents with long-term memory who want to choose a retrieval strategy on evidence.
    - Researchers who need a repeatable, budgeted LoCoMo run they can trigger from CI.
    - Anyone who suspects their memory system's score depends more on the judge than on retrieval.

    ## Prerequisites

    - An OpenAI-compatible chat completions endpoint and API key. Set `base_url` to use Ollama, vLLM, or another compatible server.
    - A Slack incoming webhook for alerts.
    - Outbound access from the worker to `raw.githubusercontent.com` to download the dataset.
    - Python 3 on the worker. The scripts use only the standard library and run on the `Process` task runner. To isolate them in a container, swap the task runner for `io.kestra.plugin.scripts.runner.docker.Docker` with a `python:3.12-slim` image.

    ### Secrets

    - `OPENAI_API_KEY`: bearer token sent to the chat completions endpoint.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for low-recall and failure alerts.

    ### Inputs

    - `dataset_url` (URI) and `dataset_sha256` (STRING): the LoCoMo release and its expected hash. Defaults to `locomo10.json` from the official repository, checked against its known hash.
    - `sample_size` (INT, default 40) and `seed` (STRING): size and seed of the deterministic question sample.
    - `retrievers` (ARRAY, default `bm25`, `recency`, `oracle`): retrieval conditions to compare.
    - `top_k` (INT, default 5): turns passed to the reader.
    - `model`, `judge_model`, `base_url` (STRING): reader model, judge model, and endpoint.
    - `price_in_per_1m`, `price_out_per_1m`, `max_cost_usd` (FLOAT): pricing for the estimate and the budget for one run.
    - `min_recall` (FLOAT, default 0.5): recall@k bar for the best non-oracle retriever.

    ### Outputs

    - `leaderboard` (JSON): one row per retriever, also available at `{{ outputs.leaderboard.outputs[0].rows }}`.
    - `by_category` (JSON): per-category rows, at `{{ outputs.leaderboard.outputs[1].rows }}`.
    - Per-question results for each retriever: the `results` file of each iteration in `{{ outputs.evaluate.outputs }}`.

    ## Quick start

    1. Add the `OPENAI_API_KEY` and `SLACK_WEBHOOK_URL` secrets (in the open-source edition, as base64-encoded `SECRET_OPENAI_API_KEY` and `SECRET_SLACK_WEBHOOK_URL` environment variables).
    2. Run the flow once with the defaults. Forty questions across three retrievers costs a few cents with `gpt-4o-mini`.
    3. Open the `leaderboard` output and compare `bm25` and `recency` against `oracle`.
    4. Enable `weekly_benchmark`, or POST to the `locomo-memory-benchmark` webhook from CI when your retrieval code changes.

    ## How to extend

    - Add your own retriever: add a branch to `retrieve()` (for example, embedding search against your vector store) and add its name to `retrievers`.
    - Keep a score history: append the leaderboard to a persistent DuckDB file or Postgres table and alert on a drop relative to the previous run instead of a fixed bar.
    - Calibrate the judge: export the rows where `f1_judge_disagreement` fires and label them by hand to measure how often the judge is right.
    - Stratify the sample by category so every question type gets equal weight.

    ## Notes

    - Token F1 here is the SQuAD-style metric without stemming, so absolute numbers differ slightly from the official LoCoMo scorer. Compare runs of this flow with each other, not with published leaderboards.
    - The judge is a model and can be wrong. The disagreement column exists so you can see how much that matters.

