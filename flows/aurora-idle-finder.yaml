id: aurora-idle-finder
namespace: company.finops

description: |
  Finds Aurora clusters with zero connections over 14 days and estimates the
  hourly savings of pausing or deleting them. Aurora bills per instance-hour —
  an idle cluster is one of the most expensive things to forget.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for idle Aurora clusters.
  - id: window_days
    type: INT
    defaults: 14
    description: CloudWatch lookback window in days (default 14).
  - id: hourly_rate_usd
    type: STRING
    defaults: "0.29"
    description: Blended Aurora instance-hour rate in USD for savings estimates (default 0.29, ~db.r6g.large).

tasks:
  - id: check_clusters
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit Aurora clusters region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Check DatabaseConnections per Aurora cluster and estimate idle cost.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            DAYS={{ inputs.window_days }}
            RATE="{{ inputs.hourly_rate_usd }}"
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Checking Aurora clusters in $REGION (window: last $DAYS days)"
            aws rds describe-db-clusters --region "$REGION" \
              --query 'DBClusters[?contains(Engine, `aurora`)].[DBClusterIdentifier,Engine,DBClusterMembers[0].DBInstanceIdentifier]' \
              --output text > /tmp/clusters.txt
            IDLE_COUNT=0
            IDLE_LIST=""
            while read -r CLUSTER ENGINE MEMBER; do
              [ -z "$CLUSTER" ] && continue
              CONN=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/RDS --metric-name DatabaseConnections \
                --dimensions Name=DBClusterIdentifier,Value="$CLUSTER" \
                --start-time "$START" --end-time "$END" \
                --period 86400 --statistics Maximum \
                --query 'max(Datapoints[].Maximum)' --output text 2>/dev/null)
              case "$CONN" in ''|'None') CONN=0;; esac
              CONN_INT=${CONN%.*}
              MEMBERS=$(aws rds describe-db-clusters --region "$REGION" \
                --db-cluster-identifier "$CLUSTER" \
                --query 'length(DBClusters[0].DBClusterMembers)' --output text 2>/dev/null)
              case "$MEMBERS" in ''|'None') MEMBERS=1;; esac
              echo "cluster $CLUSTER ($ENGINE, $MEMBERS members): max_connections=$CONN_INT"
              if [ "$CONN_INT" -eq 0 ]; then
                SAVINGS=$(python3 -c "print('{:.2f}'.format($MEMBERS * float('$RATE') * 24 * 30))")
                IDLE_LIST="${IDLE_LIST}${CLUSTER} [${ENGINE}, ${MEMBERS} member(s), ~\$${SAVINGS}/mo], "
                IDLE_COUNT=$((IDLE_COUNT + 1))
              fi
            done < /tmp/clusters.txt
            if [ "$IDLE_COUNT" -gt 0 ]; then HAS_IDLE=true; else HAS_IDLE=false; fi
            echo "HAS_IDLE=$HAS_IDLE"
            echo "IDLE_COUNT=$IDLE_COUNT"
            echo "IDLE_CLUSTERS=$IDLE_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Alert on idle Aurora clusters, stay quiet when everything serves traffic.
        condition: "{{ outputs.audit_region.vars.HAS_IDLE == 'true' }}"
        then:
          - id: slack_idle
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":crescent_moon: Aurora idle check `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.IDLE_COUNT }}* idle cluster(s) (zero connections over {{ inputs.window_days }}d).\n`{{ outputs.audit_region.vars.IDLE_CLUSTERS }}`\nConsider pausing the cluster or snapshotting + deleting — verify the rate against your actual instance classes."
              }
        else:
          - id: log_busy
            type: io.kestra.plugin.core.log.Log
            message: "No idle Aurora clusters in {{ outputs.audit_region.vars.REGION_DONE }} — every cluster took connections in the last {{ inputs.window_days }} days."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 03:30 UTC. Shipped disabled; enable after your first manual run.
    cron: "30 3 * * 0"
    disabled: true

extend:
  title: Aurora Idle Finder
  metaTitle: Find Idle Aurora Clusters Wasting Money | Kestra
  shortDescription: Find Aurora clusters with zero connections over 14 days via CloudWatch and get a Slack report with estimated monthly savings per cluster.
  metaDescription: Idle Aurora clusters are expensive to forget. This flow flags zero-connection clusters and estimates savings weekly.
  description: |
    Aurora bills per instance-hour per cluster member — a forgotten two-member cluster burns hundreds of dollars a month doing nothing. Dev clusters from finished projects and migration leftovers are the usual suspects. This blueprint finds them with real connection data.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 03:30 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists Aurora clusters (aurora-mysql and aurora-postgresql engines), then pulls `DatabaseConnections` (maximum) per cluster over `window_days` (default 14).
    4. Clusters with zero connections are flagged idle; monthly waste is estimated from the member count and the `hourly_rate_usd` input.
    5. An `If` task posts a Slack report with the idle cluster IDs, engines, member counts, and savings estimates.

    ## What you get

    - A weekly list of idle Aurora clusters with connection evidence.
    - Per-cluster monthly savings estimates so cleanup gets prioritized.
    - Multi-region coverage in one run.
    - Silence when every cluster serves traffic.

    ## Who it's for

    Platform engineers and FinOps teams running Aurora who want the expensive idle clusters surfaced automatically.

    ## Why orchestrate this with Kestra

    Spotting idle Aurora clusters means correlating CloudWatch metrics across regions — exactly the kind of recurring multi-step audit Kestra is built for. The lookback window and hourly rate are inputs, every run is logged, and the report lands in Slack where someone can act on it.

    ## Prerequisites

    - AWS credentials with `rds:DescribeDBClusters` and `cloudwatch:GetMetricStatistics` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the RDS and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the RDS and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the idle-cluster report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions where you run Aurora, and tune `hourly_rate_usd` to your dominant instance class.
    3. Run manually once and review the findings.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Use the Price List API to compute exact per-instance-class savings instead of the blended rate.
    - Auto-stop idle clusters after N consecutive idle weeks (Aurora Serverless v2 pauses itself; provisioned clusters need the stop call).
    - Exclude clusters tagged `Keep=true` for disaster-recovery standbys.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [Aurora pricing](https://aws.amazon.com/rds/aurora/pricing/)
    - [Stopping an Aurora DB cluster](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-cluster-stop-start.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
