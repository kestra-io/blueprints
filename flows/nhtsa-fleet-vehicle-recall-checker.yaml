id: nhtsa-fleet-vehicle-recall-checker
namespace: company.team

description: |
  Weekly open-recall check for a fleet of vehicles. The VINs of a fleet CSV are decoded in batches with
  NHTSA vPIC (`DecodeVINValuesBatch`), invalid VINs and check-digit failures are flagged, the unique
  make / model / model year combinations are looked up once each in the NHTSA Recalls API, and the
  campaigns are joined back to every VIN in DuckDB. A KV state remembers which campaigns were already
  alerted for each VIN, so only new campaigns alert, and park-it / park-outside advisories are routed to
  Slack as urgent. No API key is needed. Matching is by make, model and model year, which is broader than
  NHTSA's VIN-specific lookup: a campaign may cover only part of a model year, and the API cannot say whether a
  given vehicle has already been repaired.

inputs:
  - id: fleet_csv
    type: STRING
    displayName: Fleet CSV (inline)
    description: |
      CSV with a header row: `vin` (or `VIN`), and optional `unit_id` and `location`. Spaces and dashes in VINs are
      ignored and duplicate VINs are merged. The defaults are public sample VINs: three from the vPIC API examples (Kia Sorento,
      Dodge Ram 2500, Chevrolet HHR, all with a placeholder serial that fails the check digit), two from the Wikipedia
      VIN article (Saturn Vue, MCI coach), a widely used Honda Accord sample, and the incomplete vPIC example
      `5UXWX7C5*BA` as the invalid one.
    defaults: |
      vin,unit_id,location
      5XYKT3A12CG000000,SVC-101,Dallas depot
      3D7KU28C54G000000,TRK-202,Dallas depot
      3GNDA13D76S000000,POOL-303,Austin office
      5GZCZ43D13S812715,POOL-304,Austin office
      1HGCM82633A004352,POOL-305,Austin office
      1M8GDM9AXKP042788,BUS-501,Houston yard
      5UXWX7C5*BA,LEASE-601,Houston yard

  - id: fleet_file
    type: FILE
    required: false
    displayName: Fleet CSV (upload)
    description: Optional uploaded CSV with the same columns. When set it replaces `fleet_csv`.

  - id: include_check_digit_failures
    type: BOOL
    defaults: true
    description: |
      Look up recalls for VINs whose 9th-position check digit fails but that vPIC still decodes to a make, model and
      year (usually a typo in the serial part). They are flagged `CHECK_DIGIT_FAILED` in the CSV either way.

  - id: include_equipment_campaigns
    type: BOOL
    defaults: false
    description: |
      recallsByVehicle also returns equipment (`E`), tire (`T`) and child-seat (`C`) campaigns for aftermarket parts sold
      for the vehicle, which do not apply to a vehicle unless that part is fitted. False keeps vehicle (`V`) campaigns only.

  - id: alert_on_baseline
    type: BOOL
    defaults: true
    description: |
      On the first run (no state yet) every recall of the fleet is new. True alerts on all of them, false only records
      them as known so that later runs report campaigns published after onboarding.

  - id: request_pause
    type: DURATION
    defaults: PT1S
    description: Pause after each NHTSA request in the lookup loops (two run in parallel), to stay polite with the keyless APIs.

  - id: state_key
    type: STRING
    defaults: nhtsa_fleet_recall_alerts
    description: KV key holding the campaigns already alerted per VIN. Use one key per fleet.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * MON"
    description: Monday 06:00 UTC, before the week's dispatch planning. NHTSA adds new campaigns every weekday.

tasks:
  - id: alerted_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: JSON array of {vin, campaign, first_alerted} already alerted. Missing on the first (baseline) run.

  - id: read_fleet
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Reads the fleet CSV, normalises VINs (upper case, only A-Z, 0-9 and the vPIC wildcard `*` kept), merges duplicate
      rows and splits the unique VINs into batches of 50, the vPIC limit per batch request.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      fleet.csv: "{{ inputs.fleet_file ?? inputs.fleet_csv }}"
    outputFiles:
      - fleet_parquet
    sql: |
      CREATE TABLE raw AS
      SELECT row_number() OVER () AS line, to_json(t) AS j
      FROM read_csv('fleet.csv', header = true, all_varchar = true) t;

      CREATE TABLE header_check AS SELECT CASE WHEN count(*) FILTER (WHERE coalesce(json_extract(j, '$.vin'), json_extract(j, '$.VIN')) IS NOT NULL) = 0
                  THEN error('The fleet CSV needs a header row with a vin column.') END AS ok FROM raw;

      CREATE TABLE fleet_rows AS
      SELECT line,
             regexp_replace(upper(coalesce(json_extract_string(j, '$.vin'), json_extract_string(j, '$.VIN'), '')), '[^A-Z0-9*]', '', 'g') AS vin,
             nullif(trim(json_extract_string(j, '$.unit_id')), '') AS unit_id,
             nullif(trim(json_extract_string(j, '$.location')), '') AS location
      FROM raw;

      CREATE TABLE fleet AS
      SELECT vin, min(line) AS first_line, count(*) AS csv_rows,
             string_agg(DISTINCT unit_id, ' / ') AS unit_id, string_agg(DISTINCT location, ' / ') AS location
      FROM fleet_rows WHERE vin <> '' GROUP BY vin;

      CREATE TABLE empty_check AS SELECT CASE WHEN count(*) = 0 THEN error('The fleet CSV has no VIN.') END AS ok FROM fleet;

      COPY (SELECT * FROM fleet ORDER BY first_line) TO '{{ outputFiles.fleet_parquet }}' (FORMAT PARQUET);

      SELECT (SELECT count(*) FROM fleet_rows) AS csv_rows,
             (SELECT count(*) FROM fleet_rows WHERE vin = '') AS blank_rows,
             (SELECT count(*) FROM fleet) AS unique_vins,
             (SELECT coalesce(sum(csv_rows - 1), 0) FROM fleet) AS duplicate_rows,
             (SELECT CAST(json_group_array(data) AS VARCHAR) FROM (
                SELECT string_agg(vin, ';' ORDER BY first_line) AS data
                FROM (SELECT vin, first_line, (row_number() OVER (ORDER BY first_line) - 1) // 50 AS batch FROM fleet)
                GROUP BY batch ORDER BY batch)) AS batches;

  - id: decode
    type: io.kestra.plugin.core.flow.Loop
    description: One POST per batch of up to 50 VINs (a single request for fleets up to 50 vehicles).
    values: "{{ outputs.read_fleet.outputs[0].row.batches }}"
    concurrencyLimit: 1
    tasks:
      - id: decode_batch
        type: io.kestra.plugin.core.http.Download
        uri: https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVINValuesBatch/
        method: POST
        contentType: application/x-www-form-urlencoded
        formData:
          DATA: "{{ item.value }}"
          format: json
        headers:
          User-Agent: "kestra-nhtsa-fleet-vehicle-recall-checker/1.0 (https://kestra.io)"
        options:
          retryOnStatusCodes: [429, 500, 502, 503, 504]
          retry:
            type: exponential
            interval: PT5S
            maxInterval: PT1M
            maxAttempts: 4
    outputs:
      - id: uri
        type: STRING
        value: "{{ outputs.decode_batch.uri }}"

  - id: decoded_files
    type: io.kestra.plugin.core.storage.Concat
    files: "{{ outputs.decode.outputs | jq('[.[].outputs.uri]') | first }}"
    separator: "\n"
    extension: .json

  - id: classify
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Joins the decodes to the fleet and classifies each VIN from the vPIC `ErrorCode` list: codes 5, 6, 7, 9, 10, 11 and
      400 (errors in several positions, incomplete, unregistered manufacturer, glider, off-road, bad model year, invalid
      characters) or a missing make, model or year make it `INVALID`; code 1 (check digit, also reported with the
      corrected-VIN codes 2 to 4) makes it `CHECK_DIGIT_FAILED`; anything else is `VALID`. Lists the make / year pairs
      to look up in the recall model catalog.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      decoded.json: "{{ outputs.decoded_files.uri }}"
      fleet.parquet: "{{ outputs.read_fleet.outputFiles.fleet_parquet }}"
    outputFiles:
      - vins_parquet
    parameters:
      include_cd: "{{ inputs.include_check_digit_failures }}"
      pause: "{{ inputs.request_pause }}"
    sql: |
      CREATE TABLE fleet AS SELECT * FROM read_parquet('fleet.parquet');

      CREATE TABLE decoded AS
      SELECT DISTINCT ON (vin) * FROM (
        SELECT json_extract_string(r, '$.VIN') AS vin,
               string_split(replace(coalesce(json_extract_string(r, '$.ErrorCode'), ''), ' ', ''), ',') AS codes,
               json_extract_string(r, '$.ErrorText') AS error_text,
               nullif(json_extract_string(r, '$.SuggestedVIN'), '') AS suggested_vin,
               nullif(upper(trim(json_extract_string(r, '$.Make'))), '') AS make,
               nullif(trim(json_extract_string(r, '$.Model')), '') AS model,
               nullif(trim(json_extract_string(r, '$.ModelYear')), '') AS model_year,
               nullif(trim(json_extract_string(r, '$.Series')), '') AS series,
               nullif(trim(json_extract_string(r, '$.Trim')), '') AS trim,
               nullif(trim(json_extract_string(r, '$.BodyClass')), '') AS body_class
        FROM read_json_objects('decoded.json', format = 'unstructured') d,
             unnest(from_json(json_extract(d.json, '$.Results'), '["JSON"]')) AS t(r));

      CREATE TABLE vins AS
      SELECT f.vin, f.unit_id, f.location, f.csv_rows, d.make, d.model, d.model_year, d.series, d.trim, d.body_class,
             array_to_string(d.codes, ',') AS error_codes, d.error_text, d.suggested_vin,
             CASE WHEN d.vin IS NULL THEN 'NOT_DECODED'
                  WHEN list_has_any(d.codes, ['5', '6', '7', '9', '10', '11', '400']) OR d.make IS NULL OR d.model IS NULL OR d.model_year IS NULL THEN 'INVALID'
                  WHEN list_contains(d.codes, '1') THEN 'CHECK_DIGIT_FAILED'
                  ELSE 'VALID' END AS vin_status
      FROM fleet f LEFT JOIN decoded d ON d.vin = f.vin;

      CREATE TABLE flagged AS
      SELECT *, vin_status = 'VALID' OR (vin_status = 'CHECK_DIGIT_FAILED' AND CAST(:include_cd AS BOOLEAN)) AS lookup FROM vins;

      COPY (SELECT * FROM flagged) TO '{{ outputFiles.vins_parquet }}' (FORMAT PARQUET);

      SELECT count(*) FILTER (WHERE vin_status = 'VALID') AS valid,
             count(*) FILTER (WHERE vin_status = 'CHECK_DIGIT_FAILED') AS check_digit_failed,
             count(*) FILTER (WHERE vin_status IN ('INVALID', 'NOT_DECODED')) AS invalid,
             count(*) FILTER (WHERE lookup) AS looked_up,
             (SELECT coalesce(string_agg(vin || ' (' || vin_status || ', ' || coalesce(error_text, 'not returned by vPIC') || ')', '; ') FILTER (WHERE rn <= 10), '')
                     || CASE WHEN count(*) > 10 THEN '; and ' || (count(*) - 10) || ' more in the CSV' ELSE '' END
                FROM (SELECT *, row_number() OVER () AS rn FROM flagged WHERE vin_status <> 'VALID')) AS flagged_vins,
             (SELECT CAST(coalesce(json_group_array(json_object('make', make, 'year', model_year, 'pause', :pause)), '[]') AS VARCHAR)
                FROM (SELECT DISTINCT make, model_year FROM flagged WHERE lookup ORDER BY make, model_year)) AS make_years
      FROM flagged;

  - id: lookup
    type: io.kestra.plugin.core.flow.If
    description: Skipped when no VIN can be looked up (for example a file of invalid VINs); the CSV then only lists the vPIC flags.
    condition: "{{ outputs.classify.outputs[0].row.looked_up > 0 }}"
    then:
      - id: catalog
        type: io.kestra.plugin.core.flow.Loop
        description: |
          One request per make and model year to the recall product catalog. vPIC and the recall database do not always
          use the same model name (vPIC decodes a 2004 Ram 2500 as model `Ram`, series `2500`; recalls are filed under both
          `RAM` and `RAM 2500`), so catalog names that equal model + series or model + trim are also queried.
        values: "{{ outputs.classify.outputs[0].row.make_years }}"
        concurrencyLimit: 2
        tasks:
          - id: models
            type: io.kestra.plugin.core.http.Download
            uri: https://api.nhtsa.gov/products/vehicle/models
            params:
              modelYear: "{{ fromJson(item.value).year }}"
              make: "{{ fromJson(item.value).make }}"
              issueType: r
            headers:
              User-Agent: "kestra-nhtsa-fleet-vehicle-recall-checker/1.0 (https://kestra.io)"
            options:
              allowedResponseCodes: [200, 400, 404]
              retryOnStatusCodes: [429, 500, 502, 503, 504]
              retry:
                type: exponential
                interval: PT5S
                maxInterval: PT1M
                maxAttempts: 4
          - id: pace_catalog
            type: io.kestra.plugin.core.flow.Sleep
            duration: "{{ fromJson(item.value).pause }}"
        outputs:
          - id: uri
            type: STRING
            value: "{{ outputs.models.uri }}"

      - id: catalog_files
        type: io.kestra.plugin.core.storage.Concat
        files: "{{ outputs.catalog.outputs | jq('[.[].outputs.uri]') | first }}"
        separator: "\n"
        extension: .json

      - id: plan_recalls
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: Dedupes the VINs to unique make / model / year (plus catalog variants) so each combination is queried once.
        url: "jdbc:duckdb:"
        fetchType: FETCH_ONE
        inputFiles:
          vins.parquet: "{{ outputs.classify.outputFiles.vins_parquet }}"
          catalog.json: "{{ outputs.catalog_files.uri }}"
        outputFiles:
          - names_json
        parameters:
          pause: "{{ inputs.request_pause }}"
        sql: |
          CREATE TABLE vins AS SELECT * FROM read_parquet('vins.parquet') WHERE lookup;

          CREATE TABLE cat AS
          SELECT DISTINCT upper(json_extract_string(r, '$.make')) AS make, json_extract_string(r, '$.modelYear') AS model_year,
                 upper(json_extract_string(r, '$.model')) AS model
          FROM read_json_objects('catalog.json', format = 'unstructured') d,
               unnest(from_json(coalesce(json_extract(d.json, '$.results'), '[]'), '["JSON"]')) AS t(r);

          CREATE TABLE names AS
          SELECT vin, make, model_year, upper(model) AS query_model, 'decoded' AS name_source FROM vins
          UNION
          SELECT v.vin, v.make, v.model_year, c.model, 'catalog' FROM vins v
          JOIN cat c ON c.make = v.make AND c.model_year = v.model_year AND c.model <> upper(v.model)
           AND c.model IN (upper(v.model || ' ' || v.series), upper(v.model || ' ' || split_part(v.series, ' ', 1)), upper(v.model || ' ' || v.trim));

          COPY (SELECT * FROM names) TO '{{ outputFiles.names_json }}' (FORMAT JSON, ARRAY true);

          SELECT (SELECT count(*) FROM vins) AS vins,
                 (SELECT count(DISTINCT (make, model_year, query_model)) FROM names) AS combinations,
                 (SELECT coalesce(string_agg(DISTINCT make || ' ' || query_model || ' ' || model_year, '; '), '') FROM names WHERE name_source = 'catalog') AS catalog_variants,
                 (SELECT CAST(coalesce(json_group_array(json_object('make', make, 'model', query_model, 'year', model_year, 'pause', :pause)), '[]') AS VARCHAR)
                    FROM (SELECT DISTINCT make, query_model, model_year FROM names ORDER BY make, query_model, model_year)) AS queries;

      - id: recalls
        type: io.kestra.plugin.core.flow.Loop
        description: |
          One recallsByVehicle request per combination, two at a time with a pause after each. The API answers 400 with
          `Count 0` when it has no recall for the combination, which is landed as zero recalls.
        values: "{{ outputs.plan_recalls.outputs[0].row.queries }}"
        concurrencyLimit: 2
        tasks:
          - id: by_vehicle
            type: io.kestra.plugin.core.http.Download
            uri: https://api.nhtsa.gov/recalls/recallsByVehicle
            params:
              make: "{{ fromJson(item.value).make }}"
              model: "{{ fromJson(item.value).model }}"
              modelYear: "{{ fromJson(item.value).year }}"
            headers:
              User-Agent: "kestra-nhtsa-fleet-vehicle-recall-checker/1.0 (https://kestra.io)"
            options:
              allowedResponseCodes: [200, 400]
              retryOnStatusCodes: [429, 500, 502, 503, 504]
              retry:
                type: exponential
                interval: PT5S
                maxInterval: PT1M
                maxAttempts: 4
          - id: pace_recalls
            type: io.kestra.plugin.core.flow.Sleep
            duration: "{{ fromJson(item.value).pause }}"
        outputs:
          - id: uri
            type: STRING
            value: "{{ outputs.by_vehicle.uri }}"

      - id: recall_files
        type: io.kestra.plugin.core.storage.Concat
        files: "{{ outputs.recalls.outputs | jq('[.[].outputs.uri]') | first }}"
        separator: "\n"
        extension: .json

  - id: join_and_diff
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Joins the campaigns back to every VIN (one campaign counted once per VIN even if found under two model names),
      flags `parkIt` / `parkOutSide` as urgent, anti-joins against the alerted state and writes the per-VIN CSV, the
      new-alert CSV, the merged state and the Slack payloads.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      vins.parquet: "{{ outputs.classify.outputFiles.vins_parquet }}"
      names.json: "{{ outputs.plan_recalls.outputFiles.names_json ?? '[]' }}"
      recalls.json: "{{ outputs.recall_files.uri ?? '{}' }}"
    outputFiles:
      - vehicles_csv
      - new_alerts_csv
    parameters:
      state: "{{ outputs.alerted_state.value ?? '' }}"
      alert_on_baseline: "{{ inputs.alert_on_baseline }}"
      include_equipment: "{{ inputs.include_equipment_campaigns }}"
      run_started: "{{ execution.startDate }}"
      execution_url: "{{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE vins AS SELECT * FROM read_parquet('vins.parquet');
      CREATE TABLE names AS
      SELECT json_extract_string(n, '$.vin') AS vin, json_extract_string(n, '$.make') AS make, json_extract_string(n, '$.model_year') AS model_year,
             json_extract_string(n, '$.query_model') AS query_model, json_extract_string(n, '$.name_source') AS name_source
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS n FROM read_text('names.json'));

      CREATE TABLE rec AS
      SELECT DISTINCT ON (make, model_year, query_model, campaign) * FROM (
        SELECT upper(json_extract_string(r, '$.Make')) AS make, json_extract_string(r, '$.ModelYear') AS model_year,
               upper(json_extract_string(r, '$.Model')) AS query_model,
               json_extract_string(r, '$.NHTSACampaignNumber') AS campaign,
               coalesce(CAST(json_extract(r, '$.parkIt') AS BOOLEAN), false) AS park_it,
               coalesce(CAST(json_extract(r, '$.parkOutSide') AS BOOLEAN), false) AS park_outside,
               coalesce(CAST(json_extract(r, '$.overTheAirUpdate') AS BOOLEAN), false) AS ota_remedy,
               CAST(try_strptime(json_extract_string(r, '$.ReportReceivedDate'), '%d/%m/%Y') AS DATE) AS report_date,
               json_extract_string(r, '$.Component') AS component, json_extract_string(r, '$.Summary') AS summary,
               json_extract_string(r, '$.Consequence') AS consequence, json_extract_string(r, '$.Remedy') AS remedy
        FROM read_json_objects('recalls.json', format = 'unstructured') d,
             unnest(from_json(coalesce(json_extract(d.json, '$.results'), '[]'), '["JSON"]')) AS t(r));

      CREATE TABLE vin_recalls AS
      SELECT DISTINCT ON (n.vin, r.campaign) n.vin, r.*, r.park_it OR r.park_outside AS urgent
      FROM names n JOIN rec r ON r.make = n.make AND r.model_year = n.model_year AND r.query_model = n.query_model
      WHERE substr(r.campaign, 3, 1) = 'V' OR CAST(:include_equipment AS BOOLEAN)
      ORDER BY n.vin, r.campaign, n.name_source = 'decoded' DESC;

      CREATE TABLE prev AS
      SELECT json_extract_string(s, '$.vin') AS vin, json_extract_string(s, '$.campaign') AS campaign,
             json_extract_string(s, '$.first_alerted') AS first_alerted
      FROM (SELECT unnest(from_json(CASE WHEN :state = '' THEN '[]' ELSE :state END, '["JSON"]')) AS s);

      CREATE TABLE flags AS SELECT :state = '' AS is_baseline, :state = '' AND NOT CAST(:alert_on_baseline AS BOOLEAN) AS silent;

      CREATE TABLE new_alerts AS
      SELECT v.vin, v.unit_id, v.location, v.vin_status, v.make, v.model, v.model_year, vr.campaign, vr.urgent,
             CASE WHEN vr.park_it AND vr.park_outside THEN 'PARK IT, PARK OUTSIDE' WHEN vr.park_it THEN 'PARK IT' WHEN vr.park_outside THEN 'PARK OUTSIDE' ELSE '' END AS advisory,
             vr.report_date, vr.component, vr.ota_remedy, vr.summary, vr.consequence, vr.remedy
      FROM vin_recalls vr JOIN vins v ON v.vin = vr.vin
      WHERE NOT EXISTS (SELECT 1 FROM prev p WHERE p.vin = vr.vin AND p.campaign = vr.campaign);

      COPY (
        SELECT v.vin, v.unit_id, v.location, v.vin_status, v.error_codes, v.error_text, v.suggested_vin,
               v.make, v.model, v.model_year, v.series, v.trim, v.body_class, v.csv_rows,
               CASE WHEN v.lookup THEN coalesce((SELECT string_agg(DISTINCT n.query_model, ' + ') FROM names n WHERE n.vin = v.vin), '') ELSE 'not looked up' END AS recall_models_queried,
               (SELECT count(*) FROM vin_recalls vr WHERE vr.vin = v.vin) AS recalls,
               (SELECT count(*) FROM vin_recalls vr WHERE vr.vin = v.vin AND vr.urgent) AS urgent_recalls,
               coalesce((SELECT string_agg(vr.campaign, ' ' ORDER BY vr.campaign) FROM vin_recalls vr WHERE vr.vin = v.vin AND vr.urgent), '') AS urgent_campaigns,
               coalesce((SELECT string_agg(a.campaign, ' ' ORDER BY a.campaign) FROM new_alerts a WHERE a.vin = v.vin), '') AS new_campaigns,
               coalesce((SELECT string_agg(vr.campaign, ' ' ORDER BY vr.report_date DESC, vr.campaign) FROM vin_recalls vr WHERE vr.vin = v.vin), '') AS all_campaigns
        FROM vins v ORDER BY urgent_recalls DESC, recalls DESC, v.vin
      ) TO '{{ outputFiles.vehicles_csv }}' (HEADER, DELIMITER ',');

      COPY (SELECT * FROM new_alerts ORDER BY urgent DESC, report_date DESC, campaign, vin) TO '{{ outputFiles.new_alerts_csv }}' (HEADER, DELIMITER ',');

      CREATE TABLE grouped AS
      SELECT campaign, any_value(urgent) AS urgent, any_value(advisory) AS advisory, any_value(report_date) AS report_date,
             any_value(component) AS component, any_value(consequence) AS consequence, count(*) AS vehicles,
             string_agg(DISTINCT upper(make) || ' ' || upper(model) || ' ' || model_year, ', ') AS models,
             array_to_string(list_slice(list(coalesce(unit_id, vin) ORDER BY coalesce(unit_id, vin)), 1, 15), ', ')
               || CASE WHEN count(*) > 15 THEN ' and ' || (count(*) - 15) || ' more' ELSE '' END AS units
      FROM new_alerts GROUP BY campaign;

      CREATE TABLE by_campaign AS
      SELECT *, row_number() OVER (PARTITION BY urgent ORDER BY report_date DESC, campaign) AS rn,
             '• `' || campaign || '` ' || CASE WHEN advisory <> '' THEN '*' || advisory || '* ' ELSE '' END
               || models || ', ' || vehicles || ' vehicle(s) (' || units || '), filed '
               || coalesce(strftime(report_date, '%Y-%m-%d'), 'n/a') || chr(10) || '    ' || coalesce(component, '') || '. _' || left(coalesce(consequence, ''), 160) || '_' AS line
      FROM grouped;

      SELECT
        (SELECT is_baseline FROM flags) AS is_baseline,
        (SELECT count(*) FROM vins) AS vehicles,
        (SELECT count(*) FROM rec) AS campaign_rows,
        (SELECT count(DISTINCT campaign) FROM vin_recalls) AS distinct_campaigns,
        (SELECT count(DISTINCT vin) FROM vin_recalls) AS vehicles_with_recalls,
        (SELECT count(DISTINCT vin) FROM vin_recalls WHERE urgent) AS vehicles_with_urgent,
        (SELECT count(*) FROM vins WHERE lookup AND vin NOT IN (SELECT vin FROM vin_recalls)) AS looked_up_without_recalls,
        (SELECT count(*) FROM vin_recalls) AS vin_campaign_pairs,
        (SELECT count(*) FROM new_alerts) AS new_pairs,
        (SELECT count(*) FROM new_alerts WHERE urgent) AS new_urgent_pairs,
        (SELECT count(*) FROM prev) AS previously_alerted,
        CASE WHEN (SELECT count(*) FROM new_alerts) = 0 THEN 'NONE'
             WHEN (SELECT silent FROM flags) THEN 'BASELINE'
             WHEN (SELECT count(*) FROM new_alerts WHERE urgent) > 0 THEN 'URGENT'
             ELSE 'NORMAL' END AS route,
        (SELECT coalesce(string_agg(campaign || ' ' || advisory || ' ' || models || ' (' || units || ')', '; '), '') FROM by_campaign WHERE urgent) AS urgent_lines,
        (SELECT count(DISTINCT campaign) FROM rec WHERE substr(campaign, 3, 1) <> 'V' AND NOT CAST(:include_equipment AS BOOLEAN)) AS skipped_equipment_campaigns,
        (SELECT CAST(json_group_array(json_object('vin', vin, 'campaign', campaign, 'first_alerted', first_alerted)) AS VARCHAR) FROM (
           SELECT vin, campaign, first_alerted FROM prev
           UNION ALL SELECT vin, campaign, CAST(:run_started AS VARCHAR) FROM new_alerts)) AS new_state,
        (SELECT CAST(json_object('text',
            '<!here> *URGENT NHTSA recall advisory* - ' || count(*) || ' new park-it / park-outside campaign(s) on '
              || sum(vehicles) || ' vehicle(s) of the fleet. Follow the advisory (park it: do not drive; park outside: away from buildings) until the remedy is done.' || chr(10)
              || string_agg(line, chr(10) ORDER BY rn) || chr(10) || 'Execution ' || :execution_url) AS VARCHAR)
           FROM by_campaign WHERE urgent) AS urgent_payload,
        (SELECT CAST(json_object('text',
            '*NHTSA fleet recall check* - ' || count(*) || ' new recall campaign(s), ' || sum(vehicles) || ' vehicle-campaign pair(s)'
              || CASE WHEN (SELECT is_baseline FROM flags) THEN ' (baseline run, every open campaign is new)' ELSE '' END || chr(10)
              || string_agg(line, chr(10) ORDER BY rn) FILTER (WHERE rn <= 20)
              || CASE WHEN count(*) > 20 THEN chr(10) || '...and ' || (count(*) - 20) || ' more in the CSV.' ELSE '' END
              || chr(10) || 'Matched by make, model and year; confirm each VIN on nhtsa.gov/recalls. Execution ' || :execution_url) AS VARCHAR)
           FROM by_campaign WHERE NOT urgent) AS normal_payload;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.join_and_diff.outputs[0].row.new_state }}"
    kvType: STRING
    description: Previous pairs plus this run's new ones. Saved before the Slack step so a missed webhook does not re-alert next week.

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    description: URGENT posts an @here message for park-it / park-outside campaigns, then the normal digest if there is one. NORMAL posts the digest only.
    value: "{{ outputs.join_and_diff.outputs[0].row.route }}"
    cases:
      URGENT:
        - id: slack_urgent
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ outputs.join_and_diff.outputs[0].row.urgent_payload }}"
        - id: slack_digest_after_urgent
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          runIf: "{{ outputs.join_and_diff.outputs[0].row.new_pairs > outputs.join_and_diff.outputs[0].row.new_urgent_pairs }}"
          allowFailure: true
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ outputs.join_and_diff.outputs[0].row.normal_payload }}"
        - id: log_urgent
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "URGENT: {{ outputs.join_and_diff.outputs[0].row.new_urgent_pairs }} new park-it / park-outside VIN-campaign pair(s): {{ outputs.join_and_diff.outputs[0].row.urgent_lines }}"
      NORMAL:
        - id: slack_digest
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ outputs.join_and_diff.outputs[0].row.normal_payload }}"
        - id: log_new
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "{{ outputs.join_and_diff.outputs[0].row.new_pairs }} new VIN-campaign pair(s), none urgent; see the new_alerts_csv output."
      BASELINE:
        - id: log_baseline
          type: io.kestra.plugin.core.log.Log
          message: "Baseline recorded without alerts (alert_on_baseline is false): {{ outputs.join_and_diff.outputs[0].row.new_pairs }} VIN-campaign pairs are now known."
    defaults:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No new recall campaign for the fleet: {{ outputs.join_and_diff.outputs[0].row.vin_campaign_pairs }} current VIN-campaign pair(s), all already alerted."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Fleet: {{ outputs.read_fleet.outputs[0].row.csv_rows }} CSV rows, {{ outputs.read_fleet.outputs[0].row.unique_vins }} unique VINs ({{ outputs.read_fleet.outputs[0].row.duplicate_rows }} duplicate rows, {{ outputs.read_fleet.outputs[0].row.blank_rows }} blank). vPIC: {{ outputs.classify.outputs[0].row.valid }} valid, {{ outputs.classify.outputs[0].row.check_digit_failed }} check-digit failures, {{ outputs.classify.outputs[0].row.invalid }} invalid; {{ outputs.classify.outputs[0].row.looked_up }} looked up.
      Recalls API: {{ outputs.plan_recalls.outputs[0].row.combinations ?? 0 }} make/model/year queries{{ (outputs.plan_recalls.outputs[0].row.catalog_variants ?? '') is not empty ? ' (catalog variants: ' ~ outputs.plan_recalls.outputs[0].row.catalog_variants ~ ')' : '' }}, {{ outputs.join_and_diff.outputs[0].row.distinct_campaigns }} distinct vehicle campaigns on {{ outputs.join_and_diff.outputs[0].row.vehicles_with_recalls }} vehicles ({{ outputs.join_and_diff.outputs[0].row.vehicles_with_urgent }} with a park-it / park-outside advisory, {{ outputs.join_and_diff.outputs[0].row.looked_up_without_recalls }} looked up with none){{ outputs.join_and_diff.outputs[0].row.skipped_equipment_campaigns > 0 ? ', ' ~ outputs.join_and_diff.outputs[0].row.skipped_equipment_campaigns ~ ' equipment / tire / child-seat campaigns skipped' : '' }}.
      New VIN-campaign pairs: {{ outputs.join_and_diff.outputs[0].row.new_pairs }} ({{ outputs.join_and_diff.outputs[0].row.new_urgent_pairs }} urgent), route {{ outputs.join_and_diff.outputs[0].row.route }}{{ outputs.join_and_diff.outputs[0].row.is_baseline ? ', BASELINE run' : '' }}. Previously alerted: {{ outputs.join_and_diff.outputs[0].row.previously_alerted }}.
      {{ outputs.classify.outputs[0].row.flagged_vins is not empty ? 'Flagged VINs: ' ~ outputs.classify.outputs[0].row.flagged_vins : 'No VIN flagged by vPIC.' }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.join_and_diff.outputs[0].row | toJson | jq('del(.new_state, .urgent_payload, .normal_payload)') | first }}"
  - id: vehicles_csv
    type: FILE
    value: "{{ outputs.join_and_diff.outputFiles.vehicles_csv }}"
  - id: new_alerts_csv
    type: FILE
    value: "{{ outputs.join_and_diff.outputFiles.new_alerts_csv }}"



extend:
  title: Check a Vehicle Fleet for New NHTSA Safety Recalls with vPIC, DuckDB and Slack
  metaTitle: NHTSA Fleet Vehicle Recall Checker with vPIC VIN Decoding | Kestra
  shortDescription: Decode a fleet CSV of VINs with NHTSA vPIC in batches, look up each unique make, model and year once in the NHTSA Recalls API, join the campaigns back to every VIN in DuckDB and alert in Slack only on new campaigns, with park-it and park-outside advisories routed as urgent.
  metaDescription: Weekly NHTSA recall check for a VIN fleet - vPIC batch decode, invalid VIN flags, deduped recall lookups, per-VIN CSV, KV dedupe and urgent Slack alerts.
  description: |
    Fleets, rental companies and dealerships need to know when a vehicle they run or sell is recalled, above all when NHTSA says not to drive it or to park it outside because of a fire risk. This flow checks a fleet CSV every week with two keyless NHTSA APIs, flags VINs that cannot be trusted and reports each campaign once per vehicle.

    Matching is by make, model and model year, which is broader than NHTSA's VIN-specific lookup on nhtsa.gov/recalls: a campaign may cover only part of a model year, and the API cannot tell whether a vehicle was already repaired. Treat an alert as "check this VIN", not as proof.

    ## How it works

    1. A weekly `Schedule` (Monday 06:00 UTC) starts the run. `alerted_state` (KV Get) reads the campaigns already alerted per VIN; it is missing on the first, baseline run.
    2. `read_fleet` (DuckDB) reads the inline CSV or the uploaded `fleet_file`, normalises VINs, merges duplicates and splits the unique VINs into batches of 50, the vPIC limit. `decode` (Loop) sends one `DecodeVINValuesBatch` POST (form field `DATA`) per batch.
    3. `classify` (DuckDB) reads the vPIC `ErrorCode` list of each VIN. Incomplete VINs, invalid characters, unregistered manufacturers or bad model-year codes make it `INVALID`; a failed check digit makes it `CHECK_DIGIT_FAILED` (vPIC still decodes it; `include_check_digit_failures` decides whether it is looked up).
    4. `lookup` (If) runs only when a VIN can be looked up. `catalog` (Loop) reads the recall model catalog once per make and year, because vPIC and the recall database name models differently: vPIC decodes a 2004 Ram 2500 as model `Ram`, series `2500`, and one vehicle campaign is filed under `RAM` but six (including a Takata air bag recall) under `RAM 2500`. `plan_recalls` (DuckDB) adds such variants and dedupes to unique make / model / year, and `recalls` (Loop, two at a time, `Sleep` after each request) calls `recallsByVehicle` once per combination. Its 400 "no results" is landed as zero recalls; 429 and 5xx are retried.
    5. `join_and_diff` (DuckDB) joins the campaigns back to every VIN, counts a campaign found under two model names once, drops equipment, tire and child-seat campaigns (aftermarket parts, not the vehicle) unless `include_equipment_campaigns` is on, marks `parkIt` / `parkOutSide` as urgent and anti-joins against the alerted state. `save_state` (KV Set) stores the merged pairs.
    6. `route` (Switch) posts an `@here` Slack message for new urgent campaigns plus the digest, the digest alone for normal campaigns, or logs that nothing is new (Slack tasks use `allowFailure`). A final log summarises the run.

    ## What you get

    - A per-VIN CSV: unit, location, VIN status and vPIC error text, decoded make, model, year, series and trim, recall model names queried, recall and urgent counts, new and all campaigns.
    - A new-alerts CSV per VIN and new campaign: advisory, report date, component, summary, consequence, remedy, over-the-air flag.
    - One recall request per make / model / year, however many vehicles share it, and one vPIC request per 50 VINs.
    - Each campaign alerted once per VIN; a vehicle added to the fleet later gets its own alerts.

    ## Who it's for

    - Fleet and transport managers planning which vehicles can be dispatched.
    - Rental, leasing and car-sharing operators who must not hand out a vehicle under an open recall.
    - Dealership and used-car teams checking inventory.

    ## Why orchestrate this with Kestra

    - `Download` handles the form POST, 400 no-match answers and retries; `Loop` with `concurrencyLimit` and `Sleep` paces the APIs.
    - Classification, dedupe, join and diff are readable SQL in DuckDB tasks.
    - The KV store keeps the alert history across weekly runs; `state_key` gives each fleet its own history.
    - `Switch` makes the urgent route explicit, and `allowFailure` keeps the check running when Slack is not configured.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack plugin.
    - Outbound HTTPS to `vpic.nhtsa.dot.gov` and `api.nhtsa.gov`. No account or API key.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the urgent message and the digest (optional; without it the Slack tasks warn and the alerts stay in the logs and CSVs).

    ## Quick start

    1. Import the flow and click **Execute** with the defaults: seven public sample VINs. The first run is a baseline: 31 vehicle campaigns on five vehicles, one urgent (the 2012 Kia Sorento park-outside campaign 23V652000), three check-digit failures and one invalid VIN.
    2. Execute again: every campaign is already alerted and `nothing_new` runs.
    3. Upload your own fleet as `fleet_file`. For a large existing fleet, set `alert_on_baseline` to false on the first run so only campaigns published after onboarding alert.
    4. Add `SLACK_WEBHOOK_URL` and keep the weekly schedule on.

    ## How to extend

    - Read the fleet from your fleet-management database instead of an input.
    - Open a work order per urgent VIN in your maintenance system, or block the vehicle in your dispatch tool.
    - Keep a remedied flag per VIN to skip campaigns already repaired.
    
    ## Links

    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop), [Switch](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.switch) and [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [KV Get](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.get) and [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [NHTSA vPIC API](https://vpic.nhtsa.dot.gov/api/) and [NHTSA datasets and APIs (Recalls)](https://www.nhtsa.gov/nhtsa-datasets-and-apis)
    - [NHTSA recall lookup by VIN](https://www.nhtsa.gov/recalls)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
