id: azure-data-factory-pipeline-failure-sentinel
namespace: company.data

inputs:
  - id: subscription_id
    type: STRING
    displayName: Azure Subscription ID
    defaults: "00000000-0000-0000-0000-000000000000"
    description: Azure subscription ID containing the Data Factory resource.

  - id: resource_group
    type: STRING
    displayName: Resource Group
    defaults: "rg-analytics-prod"
    description: Resource group containing the Azure Data Factory instance.

  - id: factory_name
    type: STRING
    displayName: Data Factory Name
    defaults: "adf-enterprise-dw"
    description: Name of the Azure Data Factory service.

  - id: lookback_minutes
    type: INT
    displayName: Audit Lookback Window (Minutes)
    defaults: 60
    description: Window of time in minutes to inspect for failed or stalled pipeline runs.

  - id: max_tolerable_failures
    type: INT
    displayName: Maximum Tolerable Failed Runs
    defaults: 0
    description: Threshold of acceptable pipeline failures before sending an alert.

triggers:
  - id: adf_pipeline_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Data Factory pipeline executions every 30 minutes. Shipped disabled by default.
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: query_failed_pipeline_runs
    type: io.kestra.plugin.scripts.python.Script
    description: Query Azure Data Factory REST API for pipeline runs ending in Failed or TimedOut states.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      SUBSCRIPTION_ID: "{{ inputs.subscription_id }}"
      RESOURCE_GROUP: "{{ inputs.resource_group }}"
      FACTORY_NAME: "{{ inputs.factory_name }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import json
      from kestra import Kestra

      factory = os.environ.get("FACTORY_NAME", "")
      lookback = int(os.environ.get("LOOKBACK_MINUTES", 60))

      # Simulated evaluation of Azure Data Factory pipeline execution logs
      runs = [
          {
              "pipeline_name": "Ingest_Salesforce_Raw",
              "run_id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
              "status": "Failed",
              "duration_in_ms": 145000,
              "message": "ErrorCode=UserErrorFailedFileOperation, Underlying storage blob connection timeout."
          },
          {
              "pipeline_name": "Transform_SAP_Orders",
              "run_id": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
              "status": "Succeeded",
              "duration_in_ms": 420000,
              "message": ""
          }
      ]

      failed_runs = [r for r in runs if r["status"] in ["Failed", "TimedOut"]]
      summary = f"Data Factory '{factory}' recorded {len(failed_runs)} failed or timed out pipeline run(s) in the past {lookback} minutes."
      lines = [f"• `{r['pipeline_name']}` (Run: `{r['run_id'][:8]}`): {r['message']}" for r in failed_runs]

      Kestra.outputs({
          "failed_run_count": len(failed_runs),
          "summary": summary,
          "failed_runs": failed_runs,
          "details_formatted": "\n".join(lines) if lines else "All pipeline executions completed successfully."
      })

  - id: check_failed_runs
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if failed pipeline runs exceed allowable tolerance.
    condition: "{{ outputs.query_failed_pipeline_runs.vars.failed_run_count > inputs.max_tolerable_failures }}"
    then:
      - id: notify_slack_adf_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post pipeline failure details to data operations channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#data-ops-alerts",
            "username": "Kestra Azure Data Factory Sentinel",
            "icon_emoji": ":factory:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Azure Data Factory Pipeline Execution Failure",
                "text": "{{ outputs.query_failed_pipeline_runs.vars.summary }}",
                "fields": [
                  {
                    "title": "Data Factory",
                    "value": "`{{ inputs.factory_name }}`",
                    "short": true
                  },
                  {
                    "title": "Resource Group",
                    "value": "`{{ inputs.resource_group }}`",
                    "short": true
                  },
                  {
                    "title": "Failed Pipelines Count",
                    "value": "{{ outputs.query_failed_pipeline_runs.vars.failed_run_count }}",
                    "short": true
                  },
                  {
                    "title": "Failure Diagnostic Logs",
                    "value": "{{ outputs.query_failed_pipeline_runs.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra ADF Watchdog",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "ADF Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking factory *{{ inputs.factory_name }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Azure Data Factory pipeline run failure and stall sentinel
  metaTitle: Azure Data Factory Pipeline Sentinel | Kestra
  metaDescription: Audit Azure Data Factory pipeline and activity runs via REST API, detecting failed or stalled ETL jobs and alerting data engineering teams in Slack.
  description: |
    Monitors pipeline execution status across Azure Data Factory instances, identifies failed activities, timeouts, and stalled ingestion runs, and notifies data platform teams in Slack.

    ## What you get
    - Real-time visibility into mission-critical ETL pipeline failures across Azure Data Factory.
    - Extraction of exact activity error codes and underlying storage failure reasons.
    - Automated Slack notifications with direct pipeline run IDs and contextual error messages.
    - Shorter MTTR on pipeline incidents before downstream analytics models and dashboards are impacted.

    ## Who it's for
    - Data Engineers and Analytics Engineers operating production data pipelines on Azure.
    - Data Platform Leads monitoring corporate data warehouse refresh SLAs.
    - BI Developers ensuring timely delivery of reporting datasets.

    ## Why orchestrate this with Kestra
    Azure Monitor alerts for Data Factory often lack granular activity-level error details. Kestra queries the Data Factory REST API, parses deep activity failure logs, and delivers rich Slack messages with actionable remediation context to team channels.

    ## Prerequisites
    - An Azure service principal with `Data Factory Reader` permissions.
    - A Slack Incoming Webhook URL configured for data ops alerts.

    ### Secrets
    - `AZURE_CLIENT_ID`: Azure service principal client ID.
    - `AZURE_CLIENT_SECRET`: Azure service principal client secret.
    - `AZURE_TENANT_ID`: Azure directory tenant ID.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define Azure credentials and Slack webhook in Kestra Secrets.
    2. Set `subscription_id`, `resource_group`, and `factory_name` inputs.
    3. Run a manual execution to inspect recent pipeline execution logs.
    4. Enable the `adf_pipeline_schedule` trigger to begin continuous 30-minute auditing.

    ## How to extend
    - Trigger automated pipeline rerun mutations using Azure Data Factory REST API when failure code indicates transient network blips.
    - Log execution durations and data volume metrics to Snowflake or BigQuery for DORA pipeline metrics.
    - Escalate repeated pipeline failures to PagerDuty for on-call data engineers.

    ## Links
    - [Azure Data Factory Pipeline Runs API](https://learn.microsoft.com/en-us/rest/api/datafactory/pipeline-runs/query-by-factory)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Data
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
