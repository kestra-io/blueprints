id: mongodb-vs-postgresql-read-model-reconcile-guard
namespace: company.team

description: |
  Reconcile a denormalized MongoDB read model against its PostgreSQL source of truth. PostgreSQL is
  read first for the authoritative keyset and a per-row version, then the read-model documents are
  read from MongoDB. A document whose key is gone from PostgreSQL is ORPHANED. A document whose
  version is behind the row it mirrors is STALE. When auto_remediate is set the orphans are deleted
  and the stale documents refreshed from the database, each only behind an approval gate. Both sides
  are then read again and the run fails if any divergence remains.

inputs:
  - id: pg_host
    type: STRING
    displayName: PostgreSQL host
    defaults: "localhost"

  - id: pg_port
    type: INT
    displayName: PostgreSQL port
    defaults: 5432

  - id: pg_db
    type: STRING
    displayName: PostgreSQL database
    defaults: "postgres"

  - id: pg_user
    type: STRING
    displayName: PostgreSQL user
    defaults: "postgres"

  - id: pg_password
    type: STRING
    displayName: PostgreSQL password
    defaults: "{{ secret('POSTGRES_PASSWORD') }}"

  - id: pg_table
    type: STRING
    displayName: Source of truth table
    description: Table that holds the authoritative live rows. A deleted row is gone from it.
    defaults: "orders"

  - id: pg_key_column
    type: STRING
    displayName: Key column
    description: Primary key column that identifies a row and its read-model document.
    defaults: "order_id"

  - id: pg_version_column
    type: STRING
    displayName: Version column
    description: Column that increases on every update, compared against the document version.
    defaults: "version"

  - id: pg_payload_column
    type: STRING
    displayName: Payload column
    description: A denormalized column copied into the document when a stale document is refreshed.
    defaults: "status"

  - id: mongo_uri
    type: STRING
    displayName: MongoDB connection string
    defaults: "{{ secret('MONGODB_URI') }}"

  - id: mongo_db
    type: STRING
    displayName: MongoDB database
    defaults: "appdb"

  - id: mongo_collection
    type: STRING
    displayName: Read-model collection
    defaults: "orders_view"

  - id: doc_key_field
    type: STRING
    displayName: Document key field
    description: Field in the document that carries the row key. Its value matches pg_key_column.
    defaults: "order_id"

  - id: doc_version_field
    type: STRING
    displayName: Document version field
    defaults: "version"

  - id: doc_payload_field
    type: STRING
    displayName: Document payload field
    defaults: "status"

  - id: batch_limit
    type: INT
    displayName: Rows per run
    description: Upper bound on the rows read from each side in one run. A side that reaches it fails the run before the diff, because a cut-off read would show live documents as orphans.
    defaults: 5000

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for any delete or refresh to run.
    defaults: true

variables:
  jdbc_url: "jdbc:postgresql://{{ inputs.pg_host }}:{{ inputs.pg_port }}/{{ inputs.pg_db }}"
  diff_prog: >-
    .pg as $pg | .mg as $mg | .kf as $kf | .vf as $vf
    | ($pg | map({ (.k|tostring): {v: .v, p: .p} }) | add // {}) as $pgm
    | ($mg | map({ k: .[$kf], v: .[$vf] })) as $mgx
    | ($mgx | map(.k|tostring)) as $mgkeys
    | ([ $mgx[]
         | (.k|tostring) as $ks
         | if ($pgm[$ks] == null) then {code: "ORPHAN", key: .k, pg_version: null, mg_version: .v}
           elif (.v < $pgm[$ks].v) then {code: "STALE", key: .k, pg_version: $pgm[$ks].v, mg_version: .v, new_version: $pgm[$ks].v, new_payload: $pgm[$ks].p}
           else empty end ]) as $findings
    | ([ $pg[] | select(([.k|tostring] - $mgkeys) | length > 0) | .k ]) as $misses
    | {findings: $findings, misses: $misses}

tasks:
  - id: pg_read
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Read-only. The authoritative keyset, each row version and the payload column, in key order.
    url: "{{ render(vars.jdbc_url) }}"
    username: "{{ inputs.pg_user }}"
    password: "{{ inputs.pg_password }}"
    fetchType: FETCH
    sql: >-
      SELECT {{ inputs.pg_key_column }} AS k, {{ inputs.pg_version_column }} AS v, {{ inputs.pg_payload_column }} AS p
      FROM {{ inputs.pg_table }}
      ORDER BY {{ inputs.pg_key_column }}
      LIMIT {{ inputs.batch_limit }}

  - id: mongo_read
    type: io.kestra.plugin.mongodb.Find
    description: Read-only. Every read-model document with its key and version, _id dropped.
    connection:
      uri: "{{ inputs.mongo_uri }}"
    database: "{{ inputs.mongo_db }}"
    collection: "{{ inputs.mongo_collection }}"
    filter: {}
    projection:
      _id: 0
    limit: "{{ inputs.batch_limit }}"

  - id: window_check
    type: io.kestra.plugin.core.flow.If
    description: >-
      A side that returned batch_limit rows may be cut off. Diffing a cut-off keyset would report live
      documents as orphans and the delete would remove them, so the run stops before the diff.
    condition: "{{ (outputs.pg_read.rows | length) >= inputs.batch_limit or (outputs.mongo_read.rows | length) >= inputs.batch_limit }}"
    then:
      - id: window_too_small
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          PostgreSQL returned {{ outputs.pg_read.rows | length }} rows and MongoDB returned
          {{ outputs.mongo_read.rows | length }} documents with batch_limit {{ inputs.batch_limit }}.
          A side at the limit may be truncated, so the diff would be wrong. Raise batch_limit above the
          larger side. Nothing was written.

  - id: diff
    type: io.kestra.plugin.core.output.OutputValues
    description: Diff both sides. Orphan when the document key is gone from PostgreSQL, stale when the document version is behind the row version.
    values:
      result: >-
        {{ {'pg': outputs.pg_read.rows, 'mg': outputs.mongo_read.rows, 'kf': inputs.doc_key_field, 'vf': inputs.doc_version_field} | jq(vars.diff_prog) | first | toJson }}

  - id: plan
    type: io.kestra.plugin.core.output.OutputValues
    description: The MongoDB delete filter for the orphan keys and the per-document refresh list for the stale keys.
    values:
      orphan_filter: >-
        {{ {'f': inputs.doc_key_field, 'rows': fromJson(outputs.diff.values.result).findings} | jq('.f as $f | {($f): {"$in": [.rows[] | select(.code=="ORPHAN") | .key]}}') | first | toJson }}
      stale: >-
        {{ {'f': inputs.doc_key_field, 'vf': inputs.doc_version_field, 'pf': inputs.doc_payload_field, 'rows': fromJson(outputs.diff.values.result).findings} | jq('.f as $f | .vf as $vf | .pf as $pf | [.rows[] | select(.code=="STALE") | {filter_str: ({($f): .key} | tojson), set_str: ({"$set": {($vf): .new_version, ($pf): .new_payload}} | tojson)}]') | first | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Reconcile of {{ inputs.mongo_db }}.{{ inputs.mongo_collection }} against {{ render(vars.jdbc_url) }}:
      {{ fromJson(outputs.diff.values.result).findings | length }} divergences
      ({{ fromJson(outputs.diff.values.result).findings | jq('[.[] | select(.code=="ORPHAN")] | length') | first }} orphan,
      {{ fromJson(outputs.diff.values.result).findings | jq('[.[] | select(.code=="STALE")] | length') | first }} stale),
      {{ fromJson(outputs.diff.values.result).misses | length }} rows not yet in the read model.
      {{ fromJson(outputs.diff.values.result).findings | jq('map("\(.code) \(.key) db=\(.pg_version // "gone") doc=\(.mg_version)") | join("; ")') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.diff.values.result).findings | length > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'MongoDB vs PostgreSQL reconcile on ' ~ inputs.mongo_db ~ '.' ~ inputs.mongo_collection ~ ': ' ~ (fromJson(outputs.diff.values.result).findings | jq('map("\(.code) \(.key)") | join(", ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Remediation armed, waiting for approval.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approval
            type: io.kestra.plugin.core.flow.Pause
            description: Hold before any destructive write. Resume with approved true to apply, anything else leaves the read model untouched.
            onResume:
              - id: approved
                type: BOOL
                required: false
                description: Set true to delete the orphans and refresh the stale documents.

          - id: apply_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval.onResume.approved ?? false }}"
            then:
              - id: evict_gate
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (fromJson(outputs.diff.values.result).findings | jq('[.[] | select(.code==\"ORPHAN\")] | length') | first) > 0 }}"
                then:
                  - id: delete_orphans
                    type: io.kestra.plugin.mongodb.Delete
                    description: Delete the documents whose row no longer exists in the source of truth.
                    connection:
                      uri: "{{ inputs.mongo_uri }}"
                    database: "{{ inputs.mongo_db }}"
                    collection: "{{ inputs.mongo_collection }}"
                    operation: DELETE_MANY
                    filter: "{{ outputs.plan.values.orphan_filter }}"

              - id: stale_gate
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (fromJson(outputs.diff.values.result).findings | jq('[.[] | select(.code==\"STALE\")] | length') | first) > 0 }}"
                then:
                  - id: remediate_stale
                    type: io.kestra.plugin.core.flow.Loop
                    description: Refresh each stale document from the current database row. Serial so the writes do not race.
                    concurrencyLimit: 1
                    values: "{{ outputs.plan.values.stale }}"
                    tasks:
                      - id: refresh_doc
                        type: io.kestra.plugin.mongodb.Update
                        connection:
                          uri: "{{ inputs.mongo_uri }}"
                        database: "{{ inputs.mongo_db }}"
                        collection: "{{ inputs.mongo_collection }}"
                        operation: UPDATE_ONE
                        filter: "{{ fromJson(item.value).filter_str }}"
                        document: "{{ fromJson(item.value).set_str }}"

              - id: reverify_pg
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: Read-only. Read the source of truth again after the writes.
                url: "{{ render(vars.jdbc_url) }}"
                username: "{{ inputs.pg_user }}"
                password: "{{ inputs.pg_password }}"
                fetchType: FETCH
                sql: >-
                  SELECT {{ inputs.pg_key_column }} AS k, {{ inputs.pg_version_column }} AS v, {{ inputs.pg_payload_column }} AS p
                  FROM {{ inputs.pg_table }}
                  ORDER BY {{ inputs.pg_key_column }}
                  LIMIT {{ inputs.batch_limit }}

              - id: reverify_mongo
                type: io.kestra.plugin.mongodb.Find
                description: Read the read-model documents again, so the proof comes from MongoDB itself.
                connection:
                  uri: "{{ inputs.mongo_uri }}"
                database: "{{ inputs.mongo_db }}"
                collection: "{{ inputs.mongo_collection }}"
                filter: {}
                projection:
                  _id: 0
                limit: "{{ inputs.batch_limit }}"

              - id: reverify_diff
                type: io.kestra.plugin.core.output.OutputValues
                description: Re-run the same diff. An orphan still present or a document still behind is unresolved.
                values:
                  remaining: >-
                    {{ {'pg': outputs.reverify_pg.rows, 'mg': outputs.reverify_mongo.rows, 'kf': inputs.doc_key_field, 'vf': inputs.doc_version_field} | jq(vars.diff_prog) | first | toJson }}

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ fromJson(outputs.reverify_diff.values.remaining).findings | length > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      Reconcile did not converge: {{ fromJson(outputs.reverify_diff.values.remaining).findings | jq('map("\(.code) \(.key)") | join(", ")') | first }} still diverge.
                      A row may have changed during the run or the connecting MongoDB user may not delete or update these documents.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Reconciled and verified: deleted the orphan documents, refreshed the stale documents, 0 divergence left.
            else:
              - id: withheld
                type: io.kestra.plugin.core.log.Log
                message: "Approval was not granted, so no document was deleted or refreshed. The divergence stands."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "The read model matches the source of truth: every document mirrors a live row at its current version and no deleted row is still a document."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'MongoDB vs PostgreSQL reconcile guard failed on ' ~ inputs.mongo_db ~ '.' ~ inputs.mongo_collection ~ ' (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and always in safe mode.
    cron: "25 * * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: MongoDB Read Model vs PostgreSQL Reconcile Guard
  shortDescription: Reconcile a denormalized MongoDB read model against its PostgreSQL source of truth, find orphaned and stale documents by reading the keyset from PostgreSQL, alert Slack, then behind an approval gate delete and refresh them and re-verify.
  metaTitle: Reconcile a MongoDB read model against PostgreSQL with Kestra
  metaDescription: Find MongoDB documents orphaned or stale against a PostgreSQL source of truth, alert Slack, delete and refresh them, then re-diff and fail if any remain.
  description: |
    A denormalized read model drifts from the table it is built from in two ways that neither system
    can see alone. A row deleted in PostgreSQL can leave its document behind in MongoDB, so the
    application keeps serving a record that no longer exists. A row updated in PostgreSQL can leave an
    older copy in the collection, so the application serves a document that is behind the truth.

    This blueprint reconciles the two. It reads the authoritative keyset and a per-row version from
    PostgreSQL first, then reads the read-model documents from MongoDB and diffs both sides. PostgreSQL
    is the source of truth, so the keyset is driven from it and every run is deterministic. It reports
    the divergence, alerts Slack and on request deletes the orphans with a single `DELETE_MANY` and
    refreshes each stale document from the database row with an `UPDATE_ONE`. Every delete and refresh
    sits behind a `Pause` for human approval. After the writes it reads both sides again and fails the
    run if any divergence remains. PostgreSQL is never written.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Meaning | Fix |
    |---|---|---|
    | `ORPHAN` | The document key is gone from PostgreSQL (the row was deleted) but the document is still in MongoDB | `DELETE_MANY` the key |
    | `STALE` | The row is live but the document version is behind the database version | `UPDATE_ONE` the document to the current database version and payload |

    A live row with no document is a read-model gap, not a divergence, so it is counted and left alone.
    A deleted row with no document is already correct. Only orphan and stale documents are remediated,
    so the gate that must reach zero is the orphan plus stale count.

    ## How it works

    1. `pg_read` (`io.kestra.plugin.jdbc.postgresql.Query`, read-only) returns every live row with its
       key, its version and the payload column, in key order, up to `batch_limit` rows.
    2. `mongo_read` (`io.kestra.plugin.mongodb.Find`, read-only) returns every read-model document with
       its key and version, with `_id` dropped.
    3. `diff` compares the two in code. An orphan is a document whose key is not in the PostgreSQL
       keyset. A stale document is one whose version is below the database version. `plan` builds the
       `DELETE_MANY` filter for the orphan keys and a per-document refresh list for the stale keys.
       `summary` logs the counts.
    4. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs it, nothing to do, no alert.
       - **divergence:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `approval` (`io.kestra.plugin.core.flow.Pause`) holds the run. It resumes only when a human
           sets `approved` true, so an unanswered or declined resume applies nothing.
         - `delete_orphans` (`io.kestra.plugin.mongodb.Delete`, `DELETE_MANY`) removes the orphan
           documents. `remediate_stale` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`)
           refreshes each stale document with `io.kestra.plugin.mongodb.Update`.
         - `reverify_pg` and `reverify_mongo` read both sides again, `reverify_diff` re-runs the diff
           and `verify_result` fails the run if any orphan or stale document is left.
    5. `errors` alerts Slack when the flow fails.

    ## What you get

    - A per-key reconcile across two live systems, with PostgreSQL as the source of truth, not a scan
      of MongoDB on its own.
    - The orphaned and stale documents named, with the database version next to the document version.
    - Deletes and refreshes applied only behind `auto_remediate`, `dry_run` and a human approval, one
      document at a time for the writes, then a second read of both sides as proof.

    ## Who it's for

    - Teams that build a denormalized MongoDB view from a PostgreSQL table and have served a deleted
      record or a stale document.
    - SREs who want a scheduled check that a read model has not drifted from its database.
    - Teams evaluating the PostgreSQL and MongoDB plugins who want one flow that reads from both and
      writes only to the read model.

    ## Why orchestrate this with Kestra

    A read model drifts quietly and the drift spans two systems that each look healthy alone. Kestra
    reads the authoritative keyset from PostgreSQL, reads the documents from MongoDB, sends the
    divergence to Slack, deletes and refreshes only behind two flags and an approval, verifies the
    result and keeps a history of every reconcile.

    ## Tested end to end

    On Kestra 2.0.5 against PostgreSQL 16 and MongoDB 7.0, with a local HTTP sink standing in for
    Slack. The source table held 5 live rows (`1` v5, `2` v5, `3` v7, `4` v3, `5` v2). The read model
    held 6 documents (`1` v5, `2` v5, `3` v4, `4` v2, `6` v9, `7` v4), so `3` and `4` were stale, `6`
    and `7` were orphaned and `5` was a read-model gap.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 4 divergences (orphan `6`, `7`; stale `3` db=7 doc=4, `4` db=3 doc=2), 1 gap. Alert sent. `mongosh` confirmed the 6 documents unchanged |
    | 2 | `auto_remediate: true`, `dry_run: true` | Same 4 divergences, the gate stayed closed, `mongosh` confirmed no document changed |
    | 3 | `auto_remediate: true`, `dry_run: false`, approved | Deleted 2 orphans, refreshed 2 stale documents, re-read reported 0 remaining. `mongosh` after: `6` and `7` gone, `3` now v7, `4` now v3, `1` and `2` untouched. `psql` confirmed the table unchanged |
    | 4 | clean read model, `auto_remediate: true`, `dry_run: false` | 0 divergences, clean branch, no alert |
    | 5 | `auto_remediate: true`, `dry_run: false`, approval declined | 4 divergences, no write, `mongosh` confirmed the 6 documents unchanged |
    | 6 | `auto_remediate: true`, `dry_run: false`, approved, with a writer inserting a new orphan during the pause | Re-read still found the new orphan, `verify_result` failed the run rather than reporting success |
    | 7 | unreachable MongoDB host | `mongo_read` failed, the run failed, the `errors` block posted to Slack |

    Detector proof: the degraded read model reported 4 and the clean read model reported 0, both
    matching the counts measured straight from `psql` and `mongosh`. PostgreSQL held 5 rows before and
    after every run.

    ## Prerequisites

    - A PostgreSQL table that is the source of truth, with a key column, a version that increases on
      every update and a hard delete that removes the row.
    - A MongoDB collection that holds one document per row under a key field, with a version field it
      was written at and a payload field.
    - For the audit, a PostgreSQL role that can read the table. For remediation, a MongoDB user allowed
      to delete and update documents in the collection.
    - Local testing:
      - `docker run -d --name pg --network kw7 -e POSTGRES_PASSWORD=pw postgres:16`;
      - `docker run -d --name view --network kw7 mongo:7.0`;
      - seed a few rows, mirror some as documents at the right version, mirror others a version behind, then leave a document for a deleted row.

    ### Secrets

    - `POSTGRES_PASSWORD`: the password for `pg_user`, read by every query.
    - `MONGODB_URI`: the MongoDB connection string, for example `mongodb://user:pass@host:27017`.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `pg_host` / `pg_port` / `pg_db` / `pg_user` | localhost, 5432, postgres, postgres | PostgreSQL connection |
    | `pg_password` | `secret('POSTGRES_PASSWORD')` | PostgreSQL password |
    | `pg_table` | `orders` | Source of truth table |
    | `pg_key_column` / `pg_version_column` / `pg_payload_column` | order_id, version, status | Row key, version and payload |
    | `mongo_uri` | `secret('MONGODB_URI')` | MongoDB connection string |
    | `mongo_db` / `mongo_collection` | appdb, orders_view | Read-model location |
    | `doc_key_field` / `doc_version_field` / `doc_payload_field` | order_id, version, status | Document key, version and payload |
    | `batch_limit` | `5000` | A side at the limit fails the run |
    | `auto_remediate` | `false` | Allow deletes and refreshes |
    | `dry_run` | `true` | Must be `false` for a change to apply |

    ## Quick start

    1. Add the `POSTGRES_PASSWORD`, `MONGODB_URI` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow and set the connection inputs and the field names to match your read model.
    3. Run it once and read the orphaned and stale documents.
    4. Run it with `auto_remediate: true` and `dry_run: false`, approve the pause, then read the
       `remediated` log for the proof.
    5. Enable the `hourly` trigger, which always runs in safe mode.

    ## How to extend

    - Compare on `updated_at` instead of a numeric version by returning it from the query and storing
      it in the document.
    - Insert a missing document for a read-model gap by adding an `io.kestra.plugin.mongodb.InsertOne`
      branch for the keys that are in PostgreSQL but not in MongoDB.
    - Page through a large table by ordering on the key and carrying a cursor in a KV store.
    - Reconcile several collections by looping over a list of tables and collections.

    ## Links

    - MongoDB plugin: https://kestra.io/plugins/plugin-mongodb
    - PostgreSQL plugin: https://kestra.io/plugins/plugin-jdbc-postgres
    - MongoDB query operators: https://www.mongodb.com/docs/manual/reference/operator/query/
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Testing & Quality
  ee: false
  demo: false
