id: nobel-prize-laureates-lakehouse-loader
namespace: company.analytics
description: Ingests Nobel Prize awards, discipline categories, monetary prize amounts, and laureate citations into Parquet lakehouse storage via DuckDB, tracking annual Nobel announcements in Kestra KV store.

inputs:
  - id: limit
    type: INT
    description: Number of recent Nobel Prize award records to harvest.
    defaults: 25

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking latest recorded Nobel Prize award year.
    defaults: nobel_prize_monitored_year_state

variables:
  default_state: "2020"

triggers:
  - id: monthly_nobel_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 11 1 * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_prizes
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            last_known_year = int(json.loads(raw_state)) if raw_state else 2020
        except Exception:
            last_known_year = 2020

        limit = int("{{ inputs.limit }}")

        url = f"https://api.nobelprize.org/2.1/nobelPrizes?sort=desc&limit={limit}"
        headers = {"User-Agent": "KestraNobelLakehouse/1.0 (awards-analytics@kestra.io)"}

        records = []
        new_year_prizes = []
        max_year = last_known_year

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                prizes = data.get("nobelPrizes", [])
                for p in prizes:
                    award_year = int(p.get("awardYear", 0))
                    category = p.get("category", {}).get("en", "")
                    prize_amount = int(p.get("prizeAmount", 0))
                    date_awarded = p.get("dateAwarded", "")

                    laureates = p.get("laureates", [])
                    laureate_names = []
                    for l in laureates:
                        name = l.get("knownName", {}).get("en") or l.get("orgName", {}).get("en") or ""
                        if name:
                            laureate_names.append(name)
                    laureates_str = ", ".join(laureate_names)

                    if award_year > max_year:
                        max_year = award_year

                    is_new_year = award_year > last_known_year

                    records.append({
                        "award_year": award_year,
                        "category": category,
                        "prize_amount_sek": prize_amount,
                        "laureates": laureates_str,
                        "laureates_count": len(laureate_names),
                        "date_awarded": date_awarded,
                        "is_new_year_announcement": is_new_year,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_new_year:
                        new_year_prizes.append({"year": award_year, "category": category, "laureates": laureates_str})
        except Exception as e:
            print(f"Error fetching Nobel Prize API: {e}")

        with open("nobel_prizes.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE nobel_prizes AS SELECT * FROM read_json_auto('nobel_prizes.json')")
            con.execute("COPY nobel_prizes TO 'nobel_prizes_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY nobel_prizes TO 'nobel_prizes_archive.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE nobel_prizes (
                    award_year INTEGER,
                    category VARCHAR,
                    prize_amount_sek BIGINT,
                    laureates VARCHAR,
                    laureates_count INTEGER,
                    date_awarded VARCHAR,
                    is_new_year_announcement BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY nobel_prizes TO 'nobel_prizes_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY nobel_prizes TO 'nobel_prizes_archive.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_prizes_count": len(records),
            "new_year_prizes_count": len(new_year_prizes),
            "new_year_prizes": new_year_prizes[:5],
            "updated_state": max_year
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - nobel_prizes_archive.parquet
      - nobel_prizes_archive.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_prizes.vars.updated_state | toJson }}"

  - id: check_new_announcements
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_prizes.vars.new_year_prizes_count > 0 }}"
    then:
      - id: notify_nobel_announcement
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "🏅 Nobel Prize Announcement: Discovered {{ outputs.ingest_and_transform_prizes.vars.new_year_prizes_count }} newly recorded Nobel Prize award(s) in the {{ outputs.ingest_and_transform_prizes.vars.updated_state }} edition."

outputs:
  - id: total_prizes
    type: INT
    value: "{{ outputs.ingest_and_transform_prizes.vars.total_prizes_count }}"
  - id: new_year_prizes_count
    type: INT
    value: "{{ outputs.ingest_and_transform_prizes.vars.new_year_prizes_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_prizes.outputFiles['nobel_prizes_archive.parquet'] }}"

extend:
  title: Nobel Prize Laureates and Awards Lakehouse Loader with DuckDB
  metaTitle: Nobel Prize Laureates Lakehouse Loader | Kestra
  shortDescription: Ingests Nobel Prize awards, discipline categories, monetary prize amounts, and laureate citations into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Nobel Prize API for official laureate citations and monetary awards, convert awards into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, historical award harmonization, and analytical persistence of Nobel Prize awards,
    discipline categories, laureate affiliations, and monetary endowment allocations from the Nobel Prize API into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`nobel_prize_monitored_year_state`) for the latest indexed award year.
    2. **Nobel Prize API Ingestion**: Queries the official Nobel Prize REST API (`api.nobelprize.org/2.1/nobelPrizes`) for modern and historical awards.
    3. **DuckDB Award Normalization**: Normalizes discipline categories (Physics, Chemistry, Medicine, Literature, Peace, Economic Sciences), monetary amounts in SEK, and laureate names into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized award records into columnar Parquet and CSV files for academic research and scientometric modeling.
    5. **Announcement Detection & State Commitment**: Detects newly published award editions, logs laureate announcements, and commits the year to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of verified global scientific and cultural laureate citations.
    - Columnar Parquet datasets queryable with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Academic Research Institutes and Scientometrics Analysts tracking breakthrough discoveries.
    - Data Journalists and Encyclopedic Curators maintaining award history archives.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical award year state across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `api.nobelprize.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting teams on newly announced Nobel Laureates.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Adjust the `limit` input parameter.
    3. Click **Execute** to run an immediate harvest and generate the Parquet table.
    4. Enable the `monthly_nobel_sync` schedule for automated monthly updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition annual Nobel Prize archives.
    - Connect a semantic knowledge graph step linking Nobel Laureates to their OpenAlex and CrossRef publications.

    ## Links

    - [Nobel Prize Developer API](https://www.nobelprize.org/about/developer-zone-2/)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
