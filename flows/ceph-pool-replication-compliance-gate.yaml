id: ceph-pool-replication-compliance-gate
namespace: company.team
description: |
  List every Ceph pool via the Dashboard API, flag any replicated pool
  whose replica size is below a minimum, classify HEALTHY (none) or
  AT_RISK (one or more), alert Slack by pool name, and optionally raise
  the under-replicated pools' size back to the minimum. auto_remediate and
  dry_run are two independent gates: a pool at or above the minimum is
  never touched, and this flow only ever raises size, never lowers it.

triggers:
  - id: periodic_replication_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every 30 minutes - a pool created with the wrong replica count is usually a one-time provisioning mistake, not something that changes minute to minute, but durability risk is severe enough to check more often than a daily report. Shipped disabled; enable it once ceph_host points at a real cluster and a manual run has been verified.
    cron: "*/30 * * * *"
    disabled: true
    inputs:
      auto_remediate: "false"
      dry_run: "true"

inputs:
  - id: ceph_host
    type: STRING
    displayName: "Ceph Dashboard Host"
    defaults: "localhost"
    description: Hostname or IP of the Ceph Manager Dashboard, passed as host to every io.kestra.plugin.ceph.pools task in this flow.

  - id: ceph_port
    type: INT
    displayName: "Ceph Dashboard Port"
    defaults: 8443
    description: TCP port of the Ceph Manager Dashboard REST API. 8443 is the plugin's own default.

  - id: min_replica_size
    type: INT
    displayName: "Minimum Replica Size"
    defaults: 3
    description: A replicated pool (type == replicated) with size below this counts as AT_RISK. Erasure-coded pools are not evaluated by this flow - see Pitfalls.

  - id: auto_remediate
    type: SELECT
    displayName: "Auto Remediate"
    defaults: "false"
    values:
      - "false"
      - "true"
    description: If "true" and one or more replicated pools are under-replicated, raise each one's size to min_replica_size (still gated by dry_run below). If "false", the gap is only reported.

  - id: dry_run
    type: SELECT
    displayName: "Dry Run"
    defaults: "true"
    values:
      - "true"
      - "false"
    description: If "true", remediation is only logged, no pool is updated. Must be explicitly "false", together with auto_remediate "true", for replica sizes to actually be raised.

tasks:
  - id: list_pools
    type: io.kestra.plugin.ceph.pools.List
    description: "Calls GET /api/pool (verified from the plugin's own source). The response is a curated PoolInfo per pool (JSON fields pool, pool_name, type, size, pg_num, pg_placement_num, application_metadata - verified from PoolInfo's own @JsonProperty mappings), with fetchType FETCH returning them inline under pools."
    host: "{{ inputs.ceph_host }}"
    port: "{{ inputs.ceph_port }}"
    username: "{{ secret('CEPH_USERNAME') }}"
    password: "{{ secret('CEPH_PASSWORD') }}"
    fetchType: FETCH

  - id: evaluate_pool_replication
    type: io.kestra.plugin.core.flow.If
    description: AT_RISK when one or more replicated pools have size below min_replica_size.
    condition: "{{ outputs.list_pools.pools | jq('.[] | select(.type == \"replicated\" and .size < ' ~ inputs.min_replica_size ~ ')') | length > 0 }}"
    then:
      - id: route_remediation
        type: io.kestra.plugin.core.flow.Switch
        description: auto_remediate only decides whether remediation is considered at all; dry_run, checked separately below, decides whether any pool is actually updated.
        value: "{{ inputs.auto_remediate }}"
        cases:
          "true":
            - id: check_dry_run
              type: io.kestra.plugin.core.flow.If
              condition: "{{ inputs.dry_run == \"false\" }}"
              then:
                - id: raise_under_replicated_pools
                  type: io.kestra.plugin.core.flow.Loop
                  description: One iteration per under-replicated pool, filtered to only the ones below min_replica_size - a pool already at or above it is never included here, so never touched by the Update call below.
                  values: "{{ outputs.list_pools.pools | jq('.[] | select(.type == \"replicated\" and .size < ' ~ inputs.min_replica_size ~ ')') }}"
                  concurrencyLimit: 1
                  tasks:
                    - id: raise_pool_replica_size
                      type: io.kestra.plugin.ceph.pools.Update
                      description: "Calls PUT /api/pool/{pool_name} with only size set (verified from the plugin's own source - fields are only sent if explicitly set, so pgNum and applicationMetadata are left untouched on this pool)."
                      host: "{{ inputs.ceph_host }}"
                      port: "{{ inputs.ceph_port }}"
                      username: "{{ secret('CEPH_USERNAME') }}"
                      password: "{{ secret('CEPH_PASSWORD') }}"
                      poolName: "{{ fromJson(item.value).pool_name }}"
                      size: "{{ inputs.min_replica_size }}"
                - id: log_remediation_applied
                  type: io.kestra.plugin.core.log.Log
                  message: "Raised replica size to {{ inputs.min_replica_size }} on every under-replicated pool."
              else:
                - id: log_dry_run_remediation
                  type: io.kestra.plugin.core.log.Log
                  message: "DRY RUN: would raise replica size to {{ inputs.min_replica_size }} on the under-replicated pool(s) listed in the alert (dry_run is true). No pool was updated."
          "false":
            - id: log_remediation_disabled
              type: io.kestra.plugin.core.log.Log
              message: "auto_remediate is false: one or more replicated pools are below the {{ inputs.min_replica_size }} replica minimum, but no remediation was attempted."
      - id: alert_under_replicated_pools
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Always alert on AT_RISK, independent of whether remediation ran.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Ceph pool replication gate: AT_RISK on {{ inputs.ceph_host }}. Pools below the {{ inputs.min_replica_size }}-replica minimum: {% for p in outputs.list_pools.pools | jq('.[] | select(.type == \"replicated\" and .size < ' ~ inputs.min_replica_size ~ ')') %}{{ fromJson(p).pool_name }} (size={{ fromJson(p).size }}){% if not loop.last %}, {% endif %}{% endfor %}. auto_remediate: {{ inputs.auto_remediate }}. dry_run: {{ inputs.dry_run }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_replication_healthy
        type: io.kestra.plugin.core.log.Log
        message: "HEALTHY: all {{ outputs.list_pools.total }} pool(s) on {{ inputs.ceph_host }} meet or exceed the {{ inputs.min_replica_size }}-replica minimum (erasure-coded pools excluded from this check)."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status line for every run, independent of which branch fired, so the execution history always shows the headline numbers.
    message: "Replication audit complete for {{ inputs.ceph_host }}. total_pools={{ outputs.list_pools.total }}. minimum={{ inputs.min_replica_size }}. auto_remediate={{ inputs.auto_remediate }}. dry_run={{ inputs.dry_run }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the flow itself fails outright - an unreachable Dashboard host, bad credentials, or an Update call that fails outright rather than applying.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Ceph pool replication gate FAILED in execution {{ execution.id }} for {{ inputs.ceph_host }}. The pool list or an update call did not complete; investigate before trusting the last known replication status."
      }

extend:
  title: "Ceph Pool Replication Compliance Gate"
  shortDescription: List Ceph pools, alert Slack on any replicated pool below a minimum replica size, and optionally raise it back up.
  metaTitle: Ceph Pool Replication Compliance Gate with Kestra
  metaDescription: "Audit Ceph pool replica sizes via the Dashboard API, alert Slack on under-replicated pools, and optionally fix them."
  description: |
    A Ceph pool created with `size: 1` or `size: 2` during a rushed provisioning step
    looks completely normal - it accepts writes, serves reads, shows up in every list.
    It just has far less data redundancy than it should, and the gap usually surfaces
    the hard way, during an OSD failure that a properly replicated pool would have
    absorbed without incident. This blueprint lists every pool through the Ceph
    Dashboard API, flags any replicated pool below a minimum replica count you set,
    alerts Slack by name, and can raise the replica size back up - gated behind two
    independent confirmations, and only ever raising size, never lowering it.

    ## How it works

    1. `periodic_replication_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 30 minutes, always forcing `auto_remediate: "false"` and `dry_run: "true"` through its own `inputs:` override regardless of this flow's defaults. Shipped disabled so you can validate a manual run first.
    2. `list_pools` (`io.kestra.plugin.ceph.pools.List`, `fetchType: FETCH`) calls `GET /api/pool`, returning every pool's `pool_name`, `type`, `size`, `pg_num`, and more under `pools`.
    3. `evaluate_pool_replication` (`io.kestra.plugin.core.flow.If`) filters `pools` with a `jq` expression for `type == "replicated" and size < min_replica_size`, branching on whether that count is greater than zero.
       - `else` (HEALTHY): `log_replication_healthy` records a clean check.
       - `then` (AT_RISK): `route_remediation` (`io.kestra.plugin.core.flow.Switch` on `auto_remediate`) either considers remediation (`"true"`, gated again by `dry_run` through `check_dry_run`) or only logs that remediation is disabled (`"false"`). When both gates allow it, `raise_under_replicated_pools` (`io.kestra.plugin.core.flow.Loop` over the same filtered list) calls `io.kestra.plugin.ceph.pools.Update` with `size: min_replica_size` on each affected pool only. `alert_under_replicated_pools` always fires to Slack, naming every affected pool and its current size, regardless of which remediation path ran.
    4. `log_audit_complete` always runs last, printing the headline numbers regardless of which branch fired.
    5. The `errors` block alerts Slack separately if the flow itself fails outright - an unreachable Dashboard host, bad credentials, or a failed `Update` call must not read as "no risk".

    ## What you get

    - A direct read of every pool's actual `size` from the Ceph Dashboard API, not an assumption based on when the pool was created or who created it.
    - The exact pool names and current sizes in the Slack alert, so triage starts with a list, not a bare count.
    - Remediation scoped to exactly `size`, raised to the minimum - `pgNum` and `applicationMetadata` are left untouched on every pool this flow updates, and a pool already at or above the minimum is never included in the update loop at all.
    - Two independent gates (`auto_remediate`, `dry_run`) between "gap detected" and "replica size actually raised".
    - A final status log every run, gap or not, so the execution history doubles as a replication-compliance trend across the whole cluster.

    ## Who it's for

    - Storage and platform teams running Ceph who need a standing check that every pool meant to be triple-replicated (or whatever your minimum is) actually is, not just the ones someone remembered to check at provisioning time.
    - SREs doing periodic durability reviews who want the exact under-replicated pool list pushed to Slack instead of running `ceph osd pool ls detail` by hand.
    - Anyone evaluating the Ceph plugin who wants a second worked example beyond `cluster.GetHealth` - this one exercises `pools.List` and `pools.Update`, a completely different package with its own real governance angle: replication/durability compliance, not overall cluster status.

    ## Why orchestrate this with Kestra

    `ceph osd pool ls detail` run by hand answers one moment in time; it does not decide a cadence, filter for the pools that actually violate a policy, gate a fix behind two independent confirmations, or notify anyone. Kestra supplies the schedule, the threshold filter as a first-class branch, a `Loop` that updates only what is actually out of compliance, and an execution history that shows exactly when a pool fell out of replication compliance and whether it was fixed.

    ## Prerequisites

    - A reachable Ceph cluster with the Dashboard Manager module enabled and at least one replicated pool.
    - A Dashboard account with permission to read `/api/pool` and, if `auto_remediate` will ever be `"true"`, to call `PUT /api/pool/{pool_name}`.
    - A Slack incoming webhook for alerts.

    Local testing: as with this repo's other Ceph blueprint, Ceph is a multi-daemon distributed system with no official single-container demo image (confirmed against Ceph's own containerized-deployment documentation). Use `cephadm bootstrap` to stand up a single-node cluster with the Dashboard enabled, then create a replicated pool with a deliberately low `size` to exercise this flow. The plugin's own default Dashboard port is `8443`, which does not collide with Kestra's own UI on `8080`.

    ### Secrets

    - `CEPH_USERNAME` / `CEPH_PASSWORD`: Dashboard account credentials used by every `io.kestra.plugin.ceph.pools` task in this flow.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_under_replicated_pools` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_CEPH_PASSWORD=$(echo -n '<your-local-password>' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `ceph_host` (STRING, default `localhost`): Ceph Dashboard hostname or IP.
    - `ceph_port` (INT, default `8443`): Ceph Dashboard REST API port.
    - `min_replica_size` (INT, default `3`): replica-count floor for replicated pools.
    - `auto_remediate` (SELECT: `"false"`, `"true"`; default `"false"`): must be `"true"` for remediation to even be considered.
    - `dry_run` (SELECT: `"true"`, `"false"`; default `"true"`): must be explicitly `"false"`, together with `auto_remediate: "true"`, for any pool's `size` to actually be raised.

    ### Outputs

    - `outputs.list_pools.pools` / `.total`: the full pool list and count, every run.
    - `outputs.raise_pool_replica_size` (inside the `Loop`): the updated `PoolInfo` for each pool actually changed, present only when remediation ran.

    ## Quick start

    1. Stand up a Ceph cluster with the Dashboard module enabled, for example via `cephadm bootstrap`.
    2. Create a replicated pool with `size` deliberately below your intended minimum, for example `ceph osd pool create testpool 32 32 replicated` followed by `ceph osd pool set testpool size 1`.
    3. Add the `CEPH_USERNAME`, `CEPH_PASSWORD`, and `SLACK_WEBHOOK_URL` secrets.
    4. Run the flow manually with the defaults and confirm `alert_under_replicated_pools` fires, naming `testpool`.
    5. Run once with `auto_remediate: "true"` and `dry_run: "true"` and confirm `log_dry_run_remediation` describes the fix without applying it.
    6. Run once with `auto_remediate: "true"` and `dry_run: "false"` and confirm `raise_pool_replica_size` runs, then verify with `ceph osd pool get testpool size` that it is now `3`.
    7. Enable `periodic_replication_check` once you trust the check; it always runs in the safe `auto_remediate: "false"` / `dry_run: "true"` mode regardless of what you leave the flow's own defaults set to.

    ## How to extend

    - Add a separate check for erasure-coded pools, which this flow explicitly excludes - their durability is governed by the erasure-coding profile's k/m values, not `size`, and needs a different comparison entirely.
    - Add a `pg_num` sanity check alongside `size`, since a pool with too few placement groups for its size can cause its own imbalance problems distinct from under-replication.
    - Route pools matching a naming convention (for example a `prod-` prefix) to a stricter minimum than everything else, by passing a different `min_replica_size` per `Loop` iteration over a list of `(pool_name_pattern, minimum)` pairs.
    - Chain `cluster.GetHealth` (from this repo's other Ceph blueprint) as a second probe, since a cluster already in `HEALTH_ERR` may not be the moment to also start raising replica sizes and triggering a rebalance.

    ## Pitfalls

    - **This flow only evaluates replicated pools.** The `jq` filter excludes `type == "erasure"` pools entirely - their durability is controlled by the erasure-coding profile, not a simple `size` comparison, and checking them needs different logic this flow does not implement.
    - **Raising `size` is not free.** It increases storage consumption and triggers data rebalancing across OSDs - real resource and I/O cost, which is exactly why this sits behind both `auto_remediate` and `dry_run` rather than running unconditionally.
    - **This flow only ever raises `size`, never lowers it.** `min_replica_size` is a floor, not a target - a pool already above the minimum is excluded from the `jq` filter entirely and is never touched by `Update`, even if its `size` is far above what you set.
    - **There is no structured "list under-replicated pools" task in this plugin.** The filtering happens entirely in this flow's own `jq` expression against `pools.List`'s full result - verified from the plugin's own source, `List` always returns every pool, there is no server-side threshold filter to call instead.
    - **`Update` only sends fields explicitly set.** Verified from the plugin's own source: this flow sets only `size`, so `pgNum` and `applicationMetadata` are left exactly as they were on every pool it updates - this is deliberate, not a limitation to work around.
    - **`auto_remediate` and `dry_run` are independent gates, not a single boolean.** Both must be `"true"`/`"false"` respectively for any pool to actually be updated; setting only one leaves the other still blocking.
    - **`Switch` case keys `"true"`/`"false"` are quoted strings.** `auto_remediate` renders as the literal string `"true"` or `"false"`; unquoted `true:`/`false:` YAML map keys would parse as booleans instead and would not match.
    - **This blueprint is UNTESTED against a live Ceph cluster.** `pools.List`/`pools.Update`'s properties and `PoolInfo`'s fields (`pool`, `pool_name`, `type`, `size`, `pg_num`, `pg_placement_num`, `application_metadata`) are taken verbatim from the plugin's source on `main` - but no Docker/Ceph environment or Kestra engine was run to execute this flow end to end, and the `Loop`-over-`jq`-filtered-objects pattern was not observed running live, only reasoned from this repo's own consistent `fromJson(item.value)` precedent across every other `Loop` example found in this codebase.

    ## Links

    - [plugin-ceph documentation](https://kestra.io/plugins/plugin-ceph)
    - [plugin-ceph source (pools/List.java)](https://github.com/kestra-io/plugin-ceph/blob/main/src/main/java/io/kestra/plugin/ceph/pools/List.java)
    - [plugin-ceph source (pools/Update.java)](https://github.com/kestra-io/plugin-ceph/blob/main/src/main/java/io/kestra/plugin/ceph/pools/Update.java)
    - [Ceph Dashboard REST API documentation](https://docs.ceph.com/en/latest/mgr/dashboard/)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
