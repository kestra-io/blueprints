    - [Kestra MariaDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-mariadb)
    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra Serdes CSV Plugin Documentation](https://kestra.io/plugins/plugin-serdes/csv/io.kestra.plugin.serdes.csv.iontocsv)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)

  tags:
    - Data
    - Business
  subTags:
    - Reporting & Digests
    - ELT & Warehouse Loading
  ee: false
  demo: false
