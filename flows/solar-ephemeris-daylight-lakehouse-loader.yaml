id: solar-ephemeris-daylight-lakehouse-loader
namespace: company.analytics
description: Ingests astronomical sunrise, sunset, solar noon, and civil twilight ephemeris data from Sunrise-Sunset.org into Parquet lakehouse storage via DuckDB, tracking photoperiod day length in Kestra KV store.

inputs:
  - id: latitude
    type: FLOAT
    description: Geographic latitude coordinate of the observation station.
    defaults: 40.7128

  - id: longitude
    type: FLOAT
    description: Geographic longitude coordinate of the observation station.
    defaults: -74.0060

  - id: location_name
    type: STRING
    description: Human-readable moniker for the solar monitoring location.
    defaults: "New York City Station"

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known day length duration in seconds.
    defaults: solar_ephemeris_monitored_daylength_state

variables:
  default_state: "0"

triggers:
  - id: daily_solar_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 1 * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_solar
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            prior_daylength = int(json.loads(raw_state)) if raw_state else 0
        except Exception:
            prior_daylength = 0

        lat = float("{{ inputs.latitude }}")
        lon = float("{{ inputs.longitude }}")
        location = "{{ inputs.location_name }}"

        url = f"https://api.sunrise-sunset.org/json?lat={lat}&lng={lon}&formatted=0"
        headers = {"User-Agent": "KestraSolarLakehouse/1.0 (astronomy-ops@kestra.io)"}

        records = []
        new_daylength = 0

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                results = data.get("results", {})

                sunrise = results.get("sunrise", "")
                sunset = results.get("sunset", "")
                solar_noon = results.get("solar_noon", "")
                day_length_sec = int(results.get("day_length", 0))
                civil_twilight_begin = results.get("civil_twilight_begin", "")
                civil_twilight_end = results.get("civil_twilight_end", "")
                nautical_twilight_begin = results.get("nautical_twilight_begin", "")
                nautical_twilight_end = results.get("nautical_twilight_end", "")
                astronomical_twilight_begin = results.get("astronomical_twilight_begin", "")
                astronomical_twilight_end = results.get("astronomical_twilight_end", "")

                new_daylength = day_length_sec
                delta_sec = (day_length_sec - prior_daylength) if prior_daylength > 0 else 0

                records.append({
                    "location_name": location,
                    "latitude": lat,
                    "longitude": lon,
                    "sunrise_utc": sunrise,
                    "sunset_utc": sunset,
                    "solar_noon_utc": solar_noon,
                    "day_length_seconds": day_length_sec,
                    "day_length_hours": round(day_length_sec / 3600.0, 2),
                    "day_length_delta_seconds": delta_sec,
                    "civil_twilight_begin": civil_twilight_begin,
                    "civil_twilight_end": civil_twilight_end,
                    "astronomical_twilight_begin": astronomical_twilight_begin,
                    "astronomical_twilight_end": astronomical_twilight_end,
                    "harvest_time": datetime.utcnow().isoformat()
                })
        except Exception as e:
            print(f"Error fetching solar ephemeris: {e}")

        with open("solar_ephemeris.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE solar_ephemeris AS SELECT * FROM read_json_auto('solar_ephemeris.json')")
            con.execute("COPY solar_ephemeris TO 'solar_ephemeris_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY solar_ephemeris TO 'solar_ephemeris_archive.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE solar_ephemeris (
                    location_name VARCHAR,
                    latitude DOUBLE,
                    longitude DOUBLE,
                    sunrise_utc VARCHAR,
                    sunset_utc VARCHAR,
                    solar_noon_utc VARCHAR,
                    day_length_seconds INTEGER,
                    day_length_hours DOUBLE,
                    day_length_delta_seconds INTEGER,
                    civil_twilight_begin VARCHAR,
                    civil_twilight_end VARCHAR,
                    astronomical_twilight_begin VARCHAR,
                    astronomical_twilight_end VARCHAR,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY solar_ephemeris TO 'solar_ephemeris_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY solar_ephemeris TO 'solar_ephemeris_archive.csv' (HEADER, DELIMITER ',')")

        summary = {
            "records_count": len(records),
            "day_length_hours": round(new_daylength / 3600.0, 2) if new_daylength else 0.0,
            "day_length_seconds": new_daylength,
            "updated_state": new_daylength
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - solar_ephemeris_archive.parquet
      - solar_ephemeris_archive.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_solar.vars.updated_state | toJson }}"

  - id: log_solar_summary
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "☀️ Solar Ephemeris Ingest: {{ inputs.location_name }} recorded {{ outputs.ingest_and_transform_solar.vars.day_length_hours }} hours of daylight today."

outputs:
  - id: day_length_hours
    type: FLOAT
    value: "{{ outputs.ingest_and_transform_solar.vars.day_length_hours }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_solar.outputFiles['solar_ephemeris_archive.parquet'] }}"

extend:
  title: Solar Ephemeris and Daylight Telemetry Lakehouse Loader with DuckDB
  metaTitle: Solar Ephemeris Lakehouse Loader | Kestra
  shortDescription: Ingests astronomical sunrise, sunset, solar noon, and civil twilight ephemeris data from Sunrise-Sunset.org into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Sunrise-Sunset.org API for solar ephemeris and photoperiod metrics, convert astronomical twilight into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, astronomical harmonization, and analytical lakehouse persistence of solar ephemeris,
    sunrise, sunset, solar noon, and civil twilight intervals from Sunrise-Sunset.org into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`solar_ephemeris_monitored_daylength_state`) for previous day length photoperiod durations.
    2. **Solar Ephemeris Ingestion**: Queries the official Sunrise-Sunset.org REST API (`api.sunrise-sunset.org/json`) across configured latitude and longitude coordinates.
    3. **DuckDB Astronomical Normalization**: Computes day length hours, civil twilight windows, and daily photoperiod delta changes into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized solar records into columnar Parquet and CSV files for renewable energy forecasting, smart agriculture, and municipal lighting schedules.
    5. **State Commitment**: Commits the updated day length duration to Kestra KV store for reliable, stateful incremental processing.

    ## What you get

    - Automated, scheduled collection of astronomical ephemeris and solar radiation intervals.
    - Columnar Parquet datasets queryable with DuckDB, GIS toolchains, Snowflake, or ClickHouse.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Solar Energy Operations Engineers forecasting photovoltaic generation curves.
    - Precision Agriculture Agronomists calculating crop photoperiod indexes.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical ephemeris states across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `api.sunrise-sunset.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding solar cycle notices.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Configure observation `latitude` and `longitude`.
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `daily_solar_sync` schedule for automated daily updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition daily ephemeris archives.
    - Connect a solar irradiance forecasting step joined with Open-Meteo weather cloud cover data.

    ## Links

    - [Sunrise-Sunset.org API Documentation](https://sunrise-sunset.org/api)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
