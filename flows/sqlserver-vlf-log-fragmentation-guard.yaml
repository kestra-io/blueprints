id: sqlserver-vlf-log-fragmentation-guard
namespace: company.team

description: |
  Find SQL Server transaction logs that grew in hundreds of tiny autogrowth steps
  and now carry thousands of Virtual Log Files. The audit reads the VLF count from
  sys.dm_db_log_info and the growth increment from sys.master_files, alerts Slack,
  then behind a safe-by-default gate and a human approval it runs BACKUP LOG,
  DBCC SHRINKFILE, one large ALTER DATABASE MODIFY FILE re-grow and a sane fixed
  FILEGROWTH. It re-reads sys.dm_db_log_info afterwards and fails the run if the
  VLF count is still over the threshold. Only FULL recovery user databases are
  touched, never master, model, msdb or tempdb.

inputs:
  - id: url
    type: STRING
    displayName: JDBC URL
    description: Points at the SQL Server instance. The audit reads instance wide catalog views, so connecting to master is enough.
    defaults: "jdbc:sqlserver://localhost:1433"

  - id: user
    type: STRING
    displayName: SQL Server login
    defaults: sa

  - id: password
    type: STRING
    displayName: SQL Server password
    description: Defaults to the SQLSERVER_PASSWORD secret. Override only for local testing.
    defaults: "{{ secret('SQLSERVER_PASSWORD') }}"

  - id: vlf_threshold
    type: INT
    displayName: VLF count threshold
    description: Flag a log file once its Virtual Log File count reaches this number. A few hundred already slows crash recovery and log reads.
    defaults: 200

  - id: min_growth_mb
    type: INT
    displayName: Minimum healthy growth in MB
    description: A log growing in steps smaller than this keeps adding VLFs. Percent growth always counts as too small.
    defaults: 64

  - id: require_small_growth
    type: BOOL
    displayName: Require a small growth increment
    description: Keep true to flag only logs that are still fragmenting. Set false to flag every log over the VLF threshold, including ones whose growth was already fixed by hand.
    defaults: true

  - id: backup_dir
    type: STRING
    displayName: Log backup directory
    description: Directory the SQL Server service account can write. Each run writes one real log backup per database here. Never point this at NUL.
    defaults: "/var/opt/mssql/backup"

  - id: shrink_target_mb
    type: INT
    displayName: Shrink target in MB
    description: Size DBCC SHRINKFILE aims for before the re-grow. The server keeps whatever the active log still needs.
    defaults: 8

  - id: target_log_mb
    type: INT
    displayName: Target log size in MB
    description: Size the log is re-grown to in one single step, which is what keeps the new VLF count low. Set it to the size the log actually needs.
    defaults: 2048

  - id: filegrowth_mb
    type: INT
    displayName: Fixed FILEGROWTH in MB
    description: The fixed growth increment left on the log file, so future growth adds a handful of VLFs instead of hundreds.
    defaults: 512

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Allow the backup, shrink and re-grow statements to run.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, before any statement runs.
    defaults: true

variables:
  audit_sql: |
    WITH eligible AS (
      SELECT d.database_id, d.name
      FROM sys.databases d
      WHERE d.database_id > 4
        AND d.name NOT IN ('master', 'model', 'msdb', 'tempdb')
        AND d.state_desc = 'ONLINE'
        AND d.recovery_model_desc = 'FULL'
        AND d.is_read_only = 0
        AND d.source_database_id IS NULL
    )
    SELECT
      e.name AS database_name,
      mf.name AS log_file_name,
      CONCAT(CHAR(39), REPLACE(e.name, CHAR(39), CHAR(39) + CHAR(39)), CHAR(39)) AS db_literal,
      CAST(mf.size AS BIGINT) * 8 / 1024 AS size_mb,
      CASE WHEN mf.is_percent_growth = 1 THEN NULL ELSE CAST(mf.growth AS BIGINT) * 8 / 1024 END AS growth_mb,
      mf.is_percent_growth,
      li.vlf_count,
      CONCAT('BACKUP LOG ', QUOTENAME(e.name), ' TO DISK = ', CHAR(39), '{{ inputs.backup_dir | replace({"'": "''"}) }}/', REPLACE(e.name, CHAR(39), '_'), '_log_{{ execution.id }}.trn', CHAR(39)) AS backup_sql,
      CONCAT('EXEC ', QUOTENAME(e.name), '.sys.sp_executesql N', CHAR(39), 'DBCC SHRINKFILE (', REPLACE(QUOTENAME(mf.name), CHAR(39), CHAR(39) + CHAR(39)), ', {{ inputs.shrink_target_mb }})', CHAR(39)) AS shrink_sql,
      CONCAT('ALTER DATABASE ', QUOTENAME(e.name), ' MODIFY FILE (NAME = ', QUOTENAME(mf.name), ', SIZE = {{ inputs.target_log_mb }}MB, FILEGROWTH = {{ inputs.filegrowth_mb }}MB)') AS resize_sql
    FROM eligible e
    JOIN sys.master_files mf ON mf.database_id = e.database_id AND mf.type_desc = 'LOG'
    CROSS APPLY (SELECT COUNT(*) AS vlf_count FROM sys.dm_db_log_info(e.database_id)) li
    WHERE li.vlf_count >= {{ inputs.vlf_threshold }}{% if inputs.require_small_growth %}
      AND (mf.is_percent_growth = 1 OR CAST(mf.growth AS BIGINT) * 8 / 1024 < {{ inputs.min_growth_mb }}){% endif %}
    ORDER BY li.vlf_count DESC

  state_sql: |
    SELECT
      d.name AS database_name,
      mf.name AS log_file_name,
      CAST(mf.size AS BIGINT) * 8 / 1024 AS size_mb,
      CASE WHEN mf.is_percent_growth = 1 THEN NULL ELSE CAST(mf.growth AS BIGINT) * 8 / 1024 END AS growth_mb,
      mf.is_percent_growth,
      li.vlf_count
    FROM sys.databases d
    JOIN sys.master_files mf ON mf.database_id = d.database_id AND mf.type_desc = 'LOG'
    CROSS APPLY (SELECT COUNT(*) AS vlf_count FROM sys.dm_db_log_info(d.database_id)) li
    WHERE d.name IN ({{ outputs.targets.values.db_list }})
    ORDER BY li.vlf_count DESC

  verify_sql: |
    SELECT
      d.name AS database_name,
      mf.name AS log_file_name,
      CAST(mf.size AS BIGINT) * 8 / 1024 AS size_mb,
      CASE WHEN mf.is_percent_growth = 1 THEN NULL ELSE CAST(mf.growth AS BIGINT) * 8 / 1024 END AS growth_mb,
      li.vlf_count
    FROM sys.databases d
    JOIN sys.master_files mf ON mf.database_id = d.database_id AND mf.type_desc = 'LOG'
    CROSS APPLY (SELECT COUNT(*) AS vlf_count FROM sys.dm_db_log_info(d.database_id)) li
    WHERE d.name IN ({{ outputs.targets.values.db_list }})
      AND li.vlf_count >= {{ inputs.vlf_threshold }}
    ORDER BY li.vlf_count DESC

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.sqlserver.Query
    description: Read-only. Counts VLFs per database with sys.dm_db_log_info, reads the log file size and growth increment from sys.master_files. It keeps only ONLINE FULL recovery user databases over the threshold. System databases are excluded by name and by database_id.
    url: "{{ inputs.url }}"
    username: "{{ inputs.user }}"
    password: "{{ inputs.password }}"
    trustServerCertificate: true
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: targets
    type: io.kestra.plugin.core.output.OutputValues
    description: The per database plan. Every statement is built in T-SQL with QUOTENAME so identifiers are quoted by the server. The database name list for the re-read is built the same way.
    values:
      plan: "{{ outputs.audit.rows | jq('map({db: .database_name, logfile: .log_file_name, vlfs: .vlf_count, backup: .backup_sql, shrink: .shrink_sql, resize: .resize_sql})') | first | toJson }}"
      db_list: "{{ outputs.audit.rows | jq('map(.db_literal) | join(\",\")') | first }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      SQL Server VLF audit on {{ inputs.url }}: {{ outputs.audit.size }} log file(s) at or over {{ inputs.vlf_threshold }} VLFs{% if inputs.require_small_growth %} with a growth increment under {{ inputs.min_growth_mb }} MB{% endif %}.
      {{ outputs.audit.rows | jq('map("\(.database_name) vlfs=\(.vlf_count) size=\(.size_mb)MB growth=\(if .growth_mb then "\(.growth_mb)MB" else "percent" end)") | join("; ")') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'SQL Server ' ~ inputs.url ~ ': ' ~ outputs.audit.size ~ ' fragmented transaction log(s): ' ~ (outputs.audit.rows | jq('map("\(.database_name) vlfs=\(.vlf_count) size=\(.size_mb)MB growth=\(if .growth_mb then "\(.growth_mb)MB" else "percent" end)") | join("; ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Waiting for approval to back up, shrink and re-grow.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: Hold the run until a human approves. A log backup, a shrink and a re-grow briefly affect log availability and write throughput, so the sequence never starts on its own.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                required: false
                description: Set true to back up, shrink and re-grow the listed logs. Anything else leaves them alone.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: remediate
                type: io.kestra.plugin.core.flow.Loop
                description: Serial on purpose. concurrencyLimit 1 keeps two shrinks from overlapping. Each statement runs as its own autocommitting Query because BACKUP, DBCC SHRINKFILE and ALTER DATABASE cannot run inside an explicit transaction.
                concurrencyLimit: 1
                values: "{{ outputs.targets.values.plan }}"
                tasks:
                  - id: backup_log
                    type: io.kestra.plugin.jdbc.sqlserver.Query
                    description: A real log backup to a real file, so the log can truncate and the log chain stays intact. Backing up to NUL would break the chain and every differential and log restore after it.
                    url: "{{ inputs.url }}"
                    username: "{{ inputs.user }}"
                    password: "{{ inputs.password }}"
                    trustServerCertificate: true
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).backup }}"

                  - id: shrink_log
                    type: io.kestra.plugin.jdbc.sqlserver.Query
                    description: DBCC SHRINKFILE needs the target database as the current context, so it runs through that database's own sys.sp_executesql. This releases the tiny VLFs the small growth steps created.
                    url: "{{ inputs.url }}"
                    username: "{{ inputs.user }}"
                    password: "{{ inputs.password }}"
                    trustServerCertificate: true
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).shrink }}"

                  - id: resize_log
                    type: io.kestra.plugin.jdbc.sqlserver.Query
                    description: One ALTER DATABASE MODIFY FILE re-grows the log to its working size in a single step, which is what keeps the new VLF count in single digits. It leaves a fixed FILEGROWTH behind so it stays that way.
                    url: "{{ inputs.url }}"
                    username: "{{ inputs.user }}"
                    password: "{{ inputs.password }}"
                    trustServerCertificate: true
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).resize }}"

              - id: after_state
                type: io.kestra.plugin.jdbc.sqlserver.Query
                description: Read the log size, growth increment and VLF count back for every database the run touched, whatever the outcome.
                url: "{{ inputs.url }}"
                username: "{{ inputs.user }}"
                password: "{{ inputs.password }}"
                trustServerCertificate: true
                fetchType: FETCH
                sql: "{{ render(vars.state_sql) }}"

              - id: state_log
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Before: {{ outputs.audit.rows | jq('map("\(.database_name) vlfs=\(.vlf_count) size=\(.size_mb)MB growth=\(if .growth_mb then "\(.growth_mb)MB" else "percent" end)") | join("; ")') | first }}.
                  After: {{ outputs.after_state.rows | jq('map("\(.database_name) vlfs=\(.vlf_count) size=\(.size_mb)MB growth=\(if .growth_mb then "\(.growth_mb)MB" else "percent" end)") | join("; ")') | first }}.

              - id: reverify
                type: io.kestra.plugin.jdbc.sqlserver.Query
                description: Re-read sys.dm_db_log_info for the databases the run touched and return only the ones still at or over the VLF threshold. This read ignores the growth increment on purpose, so fixing FILEGROWTH alone can never report success.
                url: "{{ inputs.url }}"
                username: "{{ inputs.user }}"
                password: "{{ inputs.password }}"
                trustServerCertificate: true
                fetchType: FETCH
                sql: "{{ render(vars.verify_sql) }}"

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.reverify.size > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: "Still fragmented after the shrink and re-grow: {{ outputs.reverify.rows | jq('map(\"\\(.database_name) vlfs=\\(.vlf_count)\") | join(\", \")') | first }}. The shrink released nothing. Either shrink_target_mb is not below the current log size or the active log is held open by a long running transaction, an unreplicated log reader or an open backup. Check log_reuse_wait_desc in sys.databases, take another log backup, then run again."
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: "Backed up, shrunk and re-grown: {{ fromJson(outputs.targets.values.plan) | jq('map(.db) | join(\", \")') | first }}. Every targeted log is now under {{ inputs.vlf_threshold }} VLFs with a fixed {{ inputs.filegrowth_mb }} MB growth increment."
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: "Approval was not given, so nothing was backed up, shrunk or re-grown. The findings stand: {{ fromJson(outputs.targets.values.plan) | jq('map(\"\\(.db) vlfs=\\(.vlfs)\") | join(\", \")') | first }}."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: >-
          Nothing matched on {{ inputs.url }}: no ONLINE FULL recovery user database is at or over {{ inputs.vlf_threshold }} VLFs{% if inputs.require_small_growth %} while still growing in steps under {{ inputs.min_growth_mb }} MB{% endif %}.
          Nothing to back up, shrink or re-grow.{% if inputs.require_small_growth %} Set require_small_growth to false to also list logs that are fragmented but already on a sane growth increment.{% endif %}

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'SQL Server VLF log fragmentation guard failed on ' ~ inputs.url ~ ' (execution ' ~ execution.id ~ '). The audit could not run, the log backup or shrink was rejected or the VLF count is still over the threshold. Check the logs.'} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Always runs in safe mode (audit only).
    cron: "0 4 * * 0"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: SQL Server VLF Log Fragmentation Guard
  shortDescription: Find SQL Server transaction logs with thousands of Virtual Log Files from tiny autogrowth steps, alert Slack, then back up, shrink and re-grow them in one step behind an approval and re-read the VLF count.
  metaTitle: SQL Server VLF Log Fragmentation Guard with Kestra
  metaDescription: Count VLFs per database with sys.dm_db_log_info, alert Slack, then back up, shrink and re-grow the log in one step and re-read to confirm.
  description: |
    A transaction log left on a tiny autogrowth increment, the old 1 MB or 10
    percent default, does not grow once. It grows in hundreds of small steps. Every one
    of those steps carves new Virtual Log Files into the log. A
    log that reached 50 GB in 1 MB pieces can hold tens of thousands of VLFs.

    Nothing in normal monitoring shows it. Disk space looks fine, the log file
    size looks fine, no query is slow. What slows down is everything that has to
    walk the log end to end: crash recovery after a failover or a restart, log
    backups, the log reader for replication and change data capture, plus the redo
    queue on an Always On secondary. A database that should recover in seconds
    takes minutes. The first time anyone finds out is usually during an incident.

    This blueprint counts the VLFs per database from `sys.dm_db_log_info`, reads
    the log file size and growth increment from `sys.master_files` and flags the
    logs that are both fragmented and still growing in steps too small to stop.
    It alerts Slack. When you allow it and a human approves the run, it takes a
    real `BACKUP LOG` so the log can truncate, runs `DBCC SHRINKFILE` on the log,
    re-grows it to its working size in one single `ALTER DATABASE ... MODIFY FILE`
    step and leaves a sane fixed `FILEGROWTH` behind. Then it reads
    `sys.dm_db_log_info` again and fails the run if the VLF count is still over
    the threshold.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Only `ONLINE`, writable, FULL recovery **user** databases are considered. `master`, `model`, `msdb` and `tempdb` are excluded by name and by `database_id > 4`. Database snapshots are excluded by `source_database_id IS NULL`.
    - Read-only by default. `dry_run` is `true` and `auto_remediate` is `false`, so a normal run only counts VLFs and alerts.
    - A write happens only when `auto_remediate` is `true`, `dry_run` is `false` **and** a human resumes the `Pause` with `approved: true`. A pause resumed without an answer reads as a refusal.
    - `backup_dir` must be a real directory the SQL Server service account can write. Backing a log up to `NUL` would truncate the log while discarding the records, which breaks the log chain and every differential and log restore taken after it. The flow therefore takes a real destination and writes one file per database per run.
    - A shrink plus a re-grow briefly affects log availability and write throughput. The re-grow also zeroes the new log file. Run it in a quiet window.
    - The remediation loop has `concurrencyLimit: 1`, so two shrinks never overlap.
    - Each statement runs as its own autocommitting `io.kestra.plugin.jdbc.sqlserver.Query`. `BACKUP`, `DBCC SHRINKFILE` and `ALTER DATABASE` cannot run inside an explicit transaction, so this is never a `Queries` task with `transaction: true`.
    - On an Always On primary, check that the secondaries are synchronising before you shrink. A log that cannot truncate because a secondary is behind will not release space. The re-read then fails the run rather than reporting success.

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.sqlserver.Query`, read-only) joins `sys.databases` to `sys.master_files` for the log file of every eligible database, `CROSS APPLY`s `sys.dm_db_log_info(database_id)` to count the VLFs. It keeps the rows at or over `vlf_threshold`. With `require_small_growth` on, it also requires percent growth or a fixed growth under `min_growth_mb`, so it flags the logs that are still fragmenting. Each row carries its own `BACKUP LOG`, `DBCC SHRINKFILE` and `ALTER DATABASE ... MODIFY FILE` statement, built in T-SQL with `QUOTENAME`.
    2. `targets` (`io.kestra.plugin.core.output.OutputValues`) collects the per database plan and the quoted name list for the re-read. `summary` (`io.kestra.plugin.core.log.Log`) logs each database with its VLF count, log size and growth increment.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs that no eligible database is over the threshold.
       - **findings:** `alert` posts the flagged logs to Slack.
         - `remediate_gate` runs only when `auto_remediate` is `true` and `dry_run` is `false`.
         - `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run until a human resumes it.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs `BACKUP LOG`, then `DBCC SHRINKFILE` through the target database's own `sys.sp_executesql`, then one `ALTER DATABASE ... MODIFY FILE (SIZE, FILEGROWTH)`.
         - `after_state` reads the size, growth and VLF count back for every touched database and `state_log` logs the before and after side by side.
         - `reverify` re-reads `sys.dm_db_log_info` and returns only the databases still at or over the threshold. `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` if there are any. That read ignores the growth increment on purpose, so fixing `FILEGROWTH` alone can never report success.
         - `declined` logs the findings untouched when the approval was refused.
    4. `errors` posts a Slack alert when the audit cannot run, a statement is rejected or the re-read fails the run.

    ## What you get

    - A VLF count per database read from the real DMF, next to the log size and the growth increment that produced it, which is the one number normal monitoring never shows.
    - A fix that does all three parts in the right order. A shrink without a log backup releases nothing. A re-grow in small steps puts the VLFs straight back.
    - A fixed `FILEGROWTH` left behind, so the log stops re-fragmenting the next time it grows.
    - A second read of `sys.dm_db_log_info` that fails the run when the count did not come down, so a shrink blocked by an open transaction or a lagging secondary is never reported as success.
    - A Slack alert on the findings and a separate alert on failure.

    ## Who it's for

    - DBAs who inherited databases created with the default 1 MB or 10 percent log growth and want to find the logs that are quietly slowing recovery.
    - Platform teams who measured a slow failover or a slow restart and need to know whether log fragmentation is the cause.
    - Teams running replication, change data capture or Always On, where the log reader and the redo queue walk the log and pay for every extra VLF.
    - Anyone evaluating the SQL Server plugin who wants an example that reads a dynamic management function and drives real log maintenance behind an approval.

    ## Why orchestrate this with Kestra

    The fix is a sequence where the order is the whole point. Each step can fail on its own. A backup that did not run means the shrink releases nothing. A shrink that worked means nothing if the re-grow happens in small steps. Doing it by hand on twenty databases is a long evening. Doing it blind on a schedule is how a shrink lands in the middle of a busy afternoon. Kestra reads the real VLF counts first, gates the change behind two inputs and a human approval, runs the three statements per database one database at a time, then reads the DMF again and fails loudly if the count did not come down. The Slack alert says what was found and whether anything changed. The run history keeps every before and after.

    ## Tested end to end

    On Kestra 2.0.5 against SQL Server 2022 (16.0.4295.3) on Linux, with a local HTTP sink standing in for Slack. Two FULL recovery databases were seeded and both given a full backup, so the logs really hold records. `appvlf` started with an 8 MB log on `FILEGROWTH = 1MB` and was then grown in 600 one MB steps, which took it to **607 VLFs in a 608 MB log**. `okvlf` was left alone with a 64 MB log on `FILEGROWTH = 64MB` and **4 VLFs**. Every number below was read back with `sqlcmd` against `sys.dm_db_log_info` and `sys.master_files`, not from the flow log.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 1 flagged: `appvlf` 607 VLFs, 608 MB, 1 MB growth. `okvlf` not flagged. Slack alert said "No change applied". `sqlcmd` still read 607 |
    | 2 | `auto_remediate: true`, `dry_run: true` | still 1 flagged, still "No change applied". The dry run blocked the write with `auto_remediate` on |
    | 3 | `auto_remediate: true`, `dry_run: false`, pause resumed with `approved: false` | `declined` logged the findings. `sqlcmd` still read 607 VLFs, 608 MB, 1 MB growth |
    | 4 | same, resumed with `approved: true`, `target_log_mb: 256`, `filegrowth_mb: 64` | `BACKUP LOG` wrote a real 8.1 MB `.trn`, `DBCC SHRINKFILE` ran, one `ALTER DATABASE MODIFY FILE` re-grew it. `reverify` returned 0 rows. `sqlcmd`: **607 to 12 VLFs, 608 MB to 256 MB, 1 MB to 64 MB growth**. `okvlf` untouched at 4 VLFs |
    | 5 | defaults, after run 4 | 0 flagged, `clean` branch |
    | 6 | re-fragmented to 456 VLFs, then `shrink_target_mb: 800` (above the current 700 MB size) with `approved: true` | the shrink released nothing, the re-grow added one VLF, `reverify` returned `appvlf` at 457 and `remediation_failed` **failed the run**. The `errors` block posted to Slack. The growth increment had been fixed to 64 MB by then, which is exactly why the re-read ignores growth |
    | 7 | defaults on that state | 0 flagged. The log is still fragmented but no longer growing in small steps, so it is out of scope for the default audit |
    | 8 | `require_small_growth: false` on the same state | 1 flagged: `appvlf` 457 VLFs, 750 MB, 64 MB growth. `okvlf` still not flagged |
    | 9 | `require_small_growth: false`, `vlf_threshold: 100000` | 0 flagged on the same fragmented instance, which proves the threshold gates the detection |
    | 10 | `require_small_growth: false`, `auto_remediate: true`, `dry_run: false`, `approved: true` | **457 to 13 VLFs, 750 MB to 256 MB**. `reverify` returned 0 rows |
    | 11 | unreachable host | `audit` failed on the TCP connection and the `errors` block posted to Slack |

    Across all eleven runs `okvlf` stayed at 4 VLFs, 64 MB and a 64 MB growth increment. The three remediation runs each wrote their own log backup file named after the execution id.

    ## Prerequisites

    - A SQL Server instance you can reach over JDBC. The audit reads instance wide catalog views, so any database context works.
    - A login that can read `sys.databases`, `sys.master_files` and `sys.dm_db_log_info` (`VIEW SERVER STATE` plus `VIEW ANY DEFINITION`) or `sysadmin`. Remediation also needs `BACKUP LOG` and `ALTER DATABASE` on each target, so `db_backupoperator` plus `db_owner` is enough, as is `sysadmin`.
    - A directory on the server the SQL Server service account can write, for the log backups.
    - A Slack incoming webhook.

    ### Secrets

    - `SQLSERVER_PASSWORD`: password for the login in `user`. The `password` input defaults to this secret.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook, used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `url` | `jdbc:sqlserver://localhost:1433` | SQL Server instance to check |
    | `user` | `sa` | SQL Server login |
    | `password` | `{{ secret('SQLSERVER_PASSWORD') }}` | Password for the login |
    | `vlf_threshold` | `200` | Flag a log at or over this VLF count |
    | `min_growth_mb` | `64` | A growth increment under this counts as too small |
    | `require_small_growth` | `true` | Flag only logs that are still fragmenting |
    | `backup_dir` | `/var/opt/mssql/backup` | Directory for the log backups. Never `NUL` |
    | `shrink_target_mb` | `8` | Size `DBCC SHRINKFILE` aims for |
    | `target_log_mb` | `2048` | Size the log is re-grown to in one step |
    | `filegrowth_mb` | `512` | Fixed `FILEGROWTH` left on the log |
    | `auto_remediate` | `false` | Allow the statements to run |
    | `dry_run` | `true` | Must be `false` for a statement to run |

    ## Quick start

    1. Add the `SQLSERVER_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, set `url` and `user`, then set `backup_dir` to a directory the SQL Server service account can write.
    3. Run it once with the defaults and read the VLF counts. Set `require_small_growth: false` to see every fragmented log, including ones whose growth was already fixed by hand.
    4. Pick `target_log_mb` from the size the log actually reaches between backups, then run with `auto_remediate: true` and `dry_run: false` and approve the pause.
    5. Enable the `weekly` trigger, which always runs in safe mode.

    ## How to extend

    - Size `target_log_mb` per database by reading `used_log_space_in_percent` from `sys.dm_db_log_space_usage` in the audit, instead of using one number for the instance.
    - Check `log_reuse_wait_desc` in the audit and skip a database whose log cannot truncate yet, so the run reports rather than attempting a shrink that will not release anything.
    - Post the before and after VLF counts to Slack so an on-call engineer sees the gain without opening the database.
    - Point `backup_dir` at the same share your regular log backups use, so the files the flow writes stay part of one chain.
    - Add a second `Pause` after the audit on an instance where every database needs its own sign off.

