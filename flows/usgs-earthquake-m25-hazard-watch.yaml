id: usgs-earthquake-m25-hazard-watch
namespace: company.team

description: |
  Monitors the real-time United States Geological Survey (USGS) Earthquake Hazards feed every 15 minutes,
  extracts M2.5+ seismic activity across global tectonic faults in DuckDB, generates columnar Parquet
  records and significant event CSV reports in Kestra internal storage, and triggers automated Slack
  alerts when major or tsunami-warned seismic events occur.

inputs:
  - id: min_magnitude
    type: FLOAT
    displayName: Minimum alert magnitude (M)
    description: Minimum Richter/moment magnitude required to trigger an immediate operations notification. Earthquakes M >= 4.5 can cause localized infrastructure damage.
    defaults: 4.5

  - id: state_key
    type: STRING
    displayName: KV state key
    description: Key in Kestra KV store used to record the latest processed earthquake event IDs and timestamps to prevent duplicate alerts.
    defaults: usgs_earthquake_state

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    recoverMissedSchedules: LAST
    description: Polls the USGS 24-hour summary feed every 15 minutes to capture newly localized seismic events and focal depth updates.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: fetch_usgs_quakes
    type: io.kestra.plugin.core.http.Download
    description: Downloads the latest 24-hour M2.5+ GeoJSON seismic event stream from the USGS Earthquake Hazards Program.
    uri: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson"

  - id: process_earthquakes
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Extracts seismic event features from the USGS GeoJSON feed in DuckDB, unpacks coordinates and event metadata,
      identifies significant high-magnitude events, and generates columnar Parquet and CSV artifacts.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      quakes.json: "{{ outputs.fetch_usgs_quakes.uri }}"
    outputFiles:
      - usgs_quakes_snapshot.parquet
      - significant_earthquakes.csv
    sql: |
      CREATE TABLE raw_feed AS
      SELECT * FROM read_json_auto('quakes.json');

      CREATE TABLE all_quakes AS
      WITH feats AS (
          SELECT unnest(features) AS feat FROM raw_feed
      )
      SELECT 
          feat->>'id' AS quake_id,
          TRY_CAST(feat->'properties'->>'mag' AS DOUBLE) AS magnitude,
          feat->'properties'->>'place' AS place,
          epoch_ms(TRY_CAST(feat->'properties'->>'time' AS BIGINT))::TIMESTAMP AS event_time,
          TRY_CAST(feat->'properties'->>'tsunami' AS INTEGER) AS tsunami_warning,
          TRY_CAST(feat->'geometry'->'coordinates'->0 AS DOUBLE) AS longitude,
          TRY_CAST(feat->'geometry'->'coordinates'->1 AS DOUBLE) AS latitude,
          TRY_CAST(feat->'geometry'->'coordinates'->2 AS DOUBLE) AS depth_km,
          feat->'properties'->>'url' AS usgs_url,
          CURRENT_TIMESTAMP AS processed_at
      FROM feats
      ORDER BY magnitude DESC;

      COPY all_quakes TO 'usgs_quakes_snapshot.parquet' (FORMAT PARQUET);

      CREATE TABLE significant_events AS
      SELECT 
          quake_id,
          magnitude,
          place,
          strftime(event_time, '%Y-%m-%d %H:%M:%S UTC') AS event_time_str,
          depth_km,
          tsunami_warning,
          usgs_url
      FROM all_quakes
      WHERE magnitude >= {{ inputs.min_magnitude }}
         OR tsunami_warning = 1
      ORDER BY magnitude DESC;

      COPY significant_events TO 'significant_earthquakes.csv' (HEADER, DELIMITER ',');

      SELECT 
          (SELECT COUNT(*) FROM all_quakes)::INTEGER AS total_quakes_24h,
          (SELECT COUNT(*) FROM significant_events)::INTEGER AS significant_count,
          (SELECT magnitude FROM all_quakes LIMIT 1) AS peak_magnitude,
          (SELECT place FROM all_quakes LIMIT 1) AS peak_place,
          (SELECT strftime(event_time, '%Y-%m-%d %H:%M:%S UTC') FROM all_quakes LIMIT 1) AS latest_peak_time;

  - id: check_earthquake_hazard
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether any earthquakes met the alert criteria or triggered tsunami warnings.
    condition: "{{ outputs.process_earthquakes.row.significant_count > 0 }}"
    then:
      - id: notify_slack_earthquake
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: Dispatches an emergency notification to the operational Slack channel with earthquake details.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *USGS Seismic Alert: Significant Earthquake Detected*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*USGS Earthquake Hazards Notification*\n• *Peak Magnitude*: `M{{ outputs.process_earthquakes.row.peak_magnitude }}`\n• *Location*: `{{ outputs.process_earthquakes.row.peak_place }}`\n• *Event Timestamp*: `{{ outputs.process_earthquakes.row.latest_peak_time }}`\n• *Total M2.5+ Events (24h)*: `{{ outputs.process_earthquakes.row.total_quakes_24h }}`\n• *Significant Events Detected*: `{{ outputs.process_earthquakes.row.significant_count }}`\n• *Snapshot Storage*: `{{ outputs.process_earthquakes.outputFiles['usgs_quakes_snapshot.parquet'] }}`"
                }
              }
            ]
          }

  - id: persist_quake_state
    type: io.kestra.plugin.core.kv.Set
    description: Saves the highest magnitude and execution timestamp in the KV store.
    key: "{{ inputs.state_key }}"
    value:
      peak_mag: "{{ outputs.process_earthquakes.row.peak_magnitude }}"
      peak_location: "{{ outputs.process_earthquakes.row.peak_place }}"
      last_event_time: "{{ outputs.process_earthquakes.row.latest_peak_time }}"
      updated_at: "{{ now() }}"

extend:
  title: USGS Earthquake M2.5+ Seismic Hazards Real-Time Watch
  metaTitle: USGS Earthquake M2.5+ Seismic Hazards Watch | Kestra
  shortDescription: Ingest real-time USGS M2.5+ earthquake streams, detect significant seismic anomalies in DuckDB, and alert in Slack.
  metaDescription: Ingest real-time USGS M2.5+ earthquake GeoJSON telemetry, filter significant tremors in DuckDB, store Parquet, and alert in Slack.
  description: |
    ## What does this flow do?

    This blueprint provides automated, real-time seismic hazard monitoring using data published by the United States Geological Survey (USGS) Earthquake Hazards Program. Every 15 minutes, the flow downloads the 24-hour global seismic feed containing all localized earthquakes with magnitudes of $M \ge 2.5$.

    The flow parses the nested GeoJSON structure inside DuckDB, unpacks geospatial coordinates, focal depths, and tsunami warning flags, stores a columnar Parquet snapshot in Kestra internal storage, maintains state in the Kestra KV store, and dispatches an immediate Slack notification when seismic events breach the configured magnitude threshold ($M \ge 4.5$) or trigger tsunami advisories.

    ## Why use this?

    Enterprise operations, data centers, logistics hubs, and offshore facilities located in seismically active regions need automated notification pipelines to trigger emergency shutdowns, safety inspections, and supply chain rerouting.

    Key advantages of this flow include:

    - **Official Keyless Scientific Feed**: Uses the authoritative USGS Earthquake Hazards API with no API keys, quotas, or rate-limit paywalls.
    - **In-Memory GeoJSON Transformation**: DuckDB handles JSON feature unnesting, epoch millisecond conversion, and magnitude sorting without external Python runtimes.
    - **Dual Storage Output**: Writes complete 24-hour columnar Parquet archives for geospatial analysis while exporting filtered CSV incident reports for immediate review.
    - **Non-Blocking Notifications**: Slack alerts include `allowFailure: true` to prevent workflow interruption if webhooks are temporarily unreachable.

    ## Architecture

    ```mermaid
    flowchart TD
      A["Schedule Trigger<br/>(Every 15 Minutes)"] --> B["HTTP Download<br/>(USGS GeoJSON Feed)"]
      B --> C["DuckDB Queries<br/>(Unpack Features, Coordinates & Magnitude)"]
      C --> D["Kestra Internal Storage<br/>(usgs_quakes_snapshot.parquet)"]
      C --> E["Kestra Internal Storage<br/>(significant_earthquakes.csv)"]
      C --> F{"If Significant Events > 0"}
      F -- Yes --> G["Slack Notification<br/>(Seismic Alert Payload)"]
      F -- No --> H["Skip Alert"]
      G --> I["KV Set<br/>(Update Peak Magnitude State)"]
      H --> I
    ```

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin (`io.kestra.plugin.jdbc.duckdb.Queries`) and the Slack notifications plugin (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
    - Outbound HTTPS network connectivity to `earthquake.usgs.gov`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Optional Slack incoming webhook endpoint for seismic and tsunami alert notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Click **Execute** using default inputs (`min_magnitude: 4.5`).
    3. Review the outputs under the **Outputs** tab:
       - `usgs_quakes_snapshot.parquet`: Complete columnar archive of all earthquakes recorded in the last 24 hours.
       - `significant_earthquakes.csv`: Tabular report of events meeting or exceeding magnitude 4.5.
    4. View the KV store entry under `usgs_earthquake_state` to see the highest recorded magnitude and location.
    5. Set `SLACK_WEBHOOK_URL` in your Kestra secrets and enable the schedule trigger.

    ## How to extend

    - **Geofenced Facility Proximity**: Use DuckDB's spatial distance formulas (Haversine distance) to alert only on earthquakes within 200 km of your specific corporate coordinates.
    - **Automated PagerDuty Incident**: Replace or supplement Slack with `io.kestra.plugin.pagerduty.Incident` for severe earthquakes ($M \ge 6.0$).
    - **GIS Warehouse Archival**: Pipe the Parquet dataset into AWS S3, Google Cloud Storage, or Snowflake for long-term tectonic trend analysis.

    ## Links

    - [Kestra HTTP Download Plugin](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
    - [Kestra DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Kestra KV Store](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [USGS Real-Time Earthquake Feeds](https://earthquake.usgs.gov/earthquakes/feed/)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
