id: cloud-cost-infrastructure-waste-sentinel
namespace: company.ops.finops

description: |
  Production-ready automated FinOps cloud waste sentinel. Audits idle EBS volumes, 
  zombie EC2 instances, and unassigned Elastic IPs, aggregates financial impact using DuckDB, 
  and coordinates automated JIRA ticketing and SRE Slack alerts sequentially.

labels:
  domain: finops
  subsystem: infrastructure-waste
  criticality: operational

inputs:
  - id: cloud_provider_region
    type: STRING
    defaults: "us-east-1"
  - id: monthly_waste_budget_limit_usd
    type: FLOAT
    defaults: 1500.0
  - id: observed_waste_total_usd
    type: FLOAT
    defaults: 2180.50
  - id: auto_remediation_enabled
    type: BOOLEAN
    defaults: false

triggers:
  - id: weekly_finops_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1" # Every Monday at 8 AM

  - id: manual_finops_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "finops-sentinel-webhook-token"

tasks:
  - id: init_finops_session
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: |
      [FINOPS SENTINEL] Initiating cloud infrastructure waste audit in region {{ inputs.cloud_provider_region }}.
      Monthly Budget Limit: ${{ inputs.monthly_waste_budget_limit_usd }} | Current Waste Detected: ${{ inputs.observed_waste_total_usd }}

  - id: parallel_resource_discovery_probes
    type: io.kestra.plugin.core.flow.Parallel
    description: "Concurrently scan cloud resource inventory for unattached and idle assets"
    tasks:
      - id: scan_unattached_ebs_volumes
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "EBS volume scanner complete: Found 14 unattached volumes."

      - id: scan_zombie_compute_instances
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "EC2 instance scanner complete: Found 3 instances with < 2% CPU utilization over 14 days."

      - id: scan_unassigned_elastic_ips
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "EIP scanner complete: Found 8 unassociated elastic IP addresses."

  - id: aggregate_waste_metrics_duckdb
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: "Aggregate wasted spend by asset category using DuckDB in memory"
    sql: |
      WITH infrastructure_waste AS (
        SELECT 'Unattached EBS Volumes' AS asset_category, 14 AS resource_count, 620.00 AS monthly_cost_usd
        UNION ALL
        SELECT 'Zombie Compute Instances' AS asset_category, 3 AS resource_count, 1340.50 AS monthly_cost_usd
        UNION ALL
        SELECT 'Unassigned Elastic IPs' AS asset_category, 8 AS resource_count, 220.00 AS monthly_cost_usd
      )
      SELECT
        asset_category,
        resource_count,
        monthly_cost_usd,
        ROUND((monthly_cost_usd / 2180.50) * 100, 2) AS cost_percentage
      FROM infrastructure_waste
      ORDER BY monthly_cost_usd DESC;
    fetchType: FETCH

  - id: evaluate_budget_threshold
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: |
      Financial evaluation complete. Total estimated monthly waste: ${{ inputs.observed_waste_total_usd }}.
      Configured threshold limit: ${{ inputs.monthly_waste_budget_limit_usd }}.

  - id: sequential_finops_coordination
    type: io.kestra.plugin.core.flow.Sequential
    description: "Sequentially dispatch audit reports to Slack and file engineering tickets"
    tasks:
      - id: notify_slack_finops_channel
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Dispatched weekly infrastructure waste breakdown report to #finops-alerts Slack channel."

      - id: create_jira_remediation_ticket
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Created JIRA tracking ticket for cloud resource cleanup in region {{ inputs.cloud_provider_region }}."

  - id: route_budget_remediation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.observed_waste_total_usd > inputs.monthly_waste_budget_limit_usd }}"
    then:
      - id: execute_budget_breach_alert
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "BUDGET BREACH! Cloud waste (${{ inputs.observed_waste_total_usd }}) exceeds allowed limit (${{ inputs.monthly_waste_budget_limit_usd }}). Flagging resources for review."
    else:
      - id: log_optimal_infrastructure_spend
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Infrastructure spend is within acceptable budgetary limits."

  - id: finalize_finops_sentinel_run
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "Completed cloud infrastructure waste sentinel execution {{ execution.id }}"