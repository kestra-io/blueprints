id: arangodb-cluster-health-and-supervision-sentinel
namespace: company.team

description: |
  Audits ArangoDB distributed multi-model cluster supervision, monitors coordinator and DBServer node status, classifies cluster health, and dispatches incident alerts to Slack.

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated ArangoDB cluster supervision and node health audits every 15 minutes.
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      arangodb_host: "arangodb-coordinator"
      arangodb_port: 8529
      database: "_system"

inputs:
  - id: arangodb_host
    type: STRING
    displayName: ArangoDB Coordinator Hostname
    description: Hostname or IP address of the ArangoDB coordinator or cluster endpoint reachable by the Kestra worker.
    defaults: "arangodb-coordinator"

  - id: arangodb_port
    type: INT
    displayName: ArangoDB HTTP Port
    description: HTTP port of the ArangoDB cluster service (defaults to 8529).
    defaults: 8529

  - id: database
    type: STRING
    displayName: ArangoDB Database Name
    description: Target database context for administrative health checks (defaults to _system).
    defaults: "_system"

tasks:
  - id: probe_cluster_health
    type: io.kestra.plugin.core.http.Request
    description: Queries the ArangoDB Agency supervision endpoint to inspect real-time health and heartbeat states of all cluster nodes.
    uri: "http://{{ inputs.arangodb_host }}:{{ inputs.arangodb_port }}/_admin/cluster/health"
    method: GET
    headers:
      Authorization: "Basic {{ secret('ARANGODB_AUTH_TOKEN') }}"
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: probe_server_role
    type: io.kestra.plugin.core.http.Request
    description: Probes the targeted endpoint to verify it operates as an active cluster coordinator.
    uri: "http://{{ inputs.arangodb_host }}:{{ inputs.arangodb_port }}/_admin/server/role"
    method: GET
    headers:
      Authorization: "Basic {{ secret('ARANGODB_AUTH_TOKEN') }}"
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: probe_engine_version
    type: io.kestra.plugin.core.http.Request
    description: Retrieves ArangoDB software version and storage engine details for telemetry logging.
    uri: "http://{{ inputs.arangodb_host }}:{{ inputs.arangodb_port }}/_api/version"
    method: GET
    headers:
      Authorization: "Basic {{ secret('ARANGODB_AUTH_TOKEN') }}"
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: classify_cluster_status
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates Agency supervision node states to classify cluster vitality into HEALTHY, WARNING_DEGRADED_NODE, CRITICAL_NODE_FAILURE, or CLUSTER_UNREACHABLE.
    format: |
      {{ (outputs.probe_cluster_health.code is not defined or outputs.probe_cluster_health.code != 200) ? 'CLUSTER_UNREACHABLE' : ( ((outputs.probe_cluster_health.body | json | jq('[.Health | to_entries[] | select(.value.Status == "FAILED")] | length') | first) > 0) ? 'CRITICAL_NODE_FAILURE' : ( ((outputs.probe_cluster_health.body | json | jq('[.Health | to_entries[] | select(.value.Status == "BAD")] | length') | first) > 0) ? 'WARNING_DEGRADED_NODE' : 'HEALTHY' ) ) }}

  - id: route_by_cluster_status
    type: io.kestra.plugin.core.flow.Switch
    description: Routes execution based on the classified cluster supervision state.
    value: "{{ outputs.classify_cluster_status.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy_state
          type: io.kestra.plugin.core.log.Log
          message: "ArangoDB cluster on {{ inputs.arangodb_host }}:{{ inputs.arangodb_port }} is HEALTHY. Total active nodes: {{ outputs.probe_cluster_health.body | json | jq('.Health | length') | first }}. Cluster ID: {{ outputs.probe_cluster_health.body | json | jq('.ClusterId') | first }}. Version: {{ outputs.probe_engine_version.body | json | jq('.version') | first }}."

      "WARNING_DEGRADED_NODE":
        - id: alert_warning_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "ArangoDB Cluster Sentinel WARNING on " ~ inputs.arangodb_host ~ ":" ~ inputs.arangodb_port ~ ". Detected degraded node(s) missing heartbeats: " ~ (outputs.probe_cluster_health.body | json | jq('[.Health | to_entries[] | select(.value.Status == \"BAD\") | .key + \" (\" + .value.Role + \":\" + .value.Endpoint + \")\"] | join(\", \")') | first) ~ ". Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_degraded_warning
          type: io.kestra.plugin.core.log.Log
          message: "ArangoDB cluster degraded node warning: One or more nodes missed supervision heartbeats."

      "CRITICAL_NODE_FAILURE":
        - id: alert_critical_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "ArangoDB Cluster Sentinel CRITICAL on " ~ inputs.arangodb_host ~ ":" ~ inputs.arangodb_port ~ ". Confirmed failed cluster node(s): " ~ (outputs.probe_cluster_health.body | json | jq('[.Health | to_entries[] | select(.value.Status == \"FAILED\") | .key + \" (\" + .value.Role + \":\" + .value.Endpoint + \")\"] | join(\", \")') | first) ~ ". Immediate intervention required. Execution: " ~ execution.id ~ "."} | toJson }}

      "CLUSTER_UNREACHABLE":
        - id: alert_unreachable_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "ArangoDB Cluster Sentinel CLUSTER_UNREACHABLE. Cannot reach coordinator at http://" ~ inputs.arangodb_host ~ ":" ~ inputs.arangodb_port ~ "/_admin/cluster/health. Cluster endpoint may be offline or partitioned. Execution: " ~ execution.id ~ "."} | toJson }}

  - id: log_audit_summary
    type: io.kestra.plugin.core.output.OutputValues
    description: Exports structured audit attributes and node supervision metrics for reporting dashboards.
    values:
      health_status: "{{ outputs.classify_cluster_status.value }}"
      cluster_id: "{{ outputs.probe_cluster_health.body | json | jq('.ClusterId') | first ?? 'UNKNOWN' }}"
      total_nodes: "{{ outputs.probe_cluster_health.body | json | jq('.Health | length') | first ?? 0 }}"
      failed_nodes_count: "{{ outputs.probe_cluster_health.body | json | jq('[.Health | to_entries[] | select(.value.Status == \"FAILED\")] | length') | first ?? 0 }}"
      degraded_nodes_count: "{{ outputs.probe_cluster_health.body | json | jq('[.Health | to_entries[] | select(.value.Status == \"BAD\")] | length') | first ?? 0 }}"

errors:
  - id: alert_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches a high-priority Slack notification if an unhandled error halts sentinel execution.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {"text": "ArangoDB Cluster Sentinel workflow error during execution " ~ execution.id ~ " in namespace " ~ flow.namespace ~ "."} | toJson }}

extend:
  title: ArangoDB Cluster Health and Supervision Sentinel
  metaTitle: ArangoDB Cluster Health & Supervision Sentinel | Kestra
  shortDescription: Continuous cluster supervision auditing, coordinator and DBServer health probing, and Slack incident alerting for ArangoDB.
  metaDescription: Audit ArangoDB multi-model cluster supervision, monitor node health, detect failed cluster members, and dispatch Slack incident alerts via Kestra.
  description: |
    Continuously audits distributed ArangoDB multi-model clusters by querying Agency supervision health endpoints, evaluating coordinator and DBServer heartbeat vitality, classifying cluster status, and dispatching incident alerts to Slack.

    ## How it works

    1. `probe_cluster_health` queries the ArangoDB administrative endpoint `/_admin/cluster/health` using HTTP authentication to retrieve real-time supervision status for all cluster nodes.
    2. `probe_server_role` queries `/_admin/server/role` to verify that the targeted endpoint is operating as an active coordinator.
    3. `probe_engine_version` queries `/_api/version` to extract server version and engine attributes.
    4. `classify_cluster_status` evaluates supervision responses through a Pebble conditional expression:
       - Detects nodes marked as `FAILED` (prolonged missed heartbeats) and classifies state as `CRITICAL_NODE_FAILURE`.
       - Detects nodes marked as `BAD` (transient heartbeat failure) and classifies state as `WARNING_DEGRADED_NODE`.
       - Confirms all cluster members report `GOOD` status to classify state as `HEALTHY`.
       - Identifies unreachable endpoints or non-200 responses to classify state as `CLUSTER_UNREACHABLE`.
    5. `route_by_cluster_status` branches workflow execution based on the classification:
       - `HEALTHY`: Logs cluster identifiers, member node counts, and engine versions.
       - `WARNING_DEGRADED_NODE`: Alerts operations on Slack with exact node IDs, roles, and endpoints missing heartbeats.
       - `CRITICAL_NODE_FAILURE`: Dispatches a high-priority Slack alert naming failed coordinators or DBServers requiring immediate remediation.
       - `CLUSTER_UNREACHABLE`: Alerts on-call engineers that coordinator HTTP endpoints are offline.
    6. `log_audit_summary` produces structured outputs recording cluster IDs, node counts, and classification states for compliance tracking.
    7. `errors` catches unexpected task exceptions and posts a diagnostic notice to Slack.

    ## What you get

    - Automated, continuous surveillance of ArangoDB cluster supervision without external monitoring sidecars.
    - Real-time detection of failed DBServers or coordinators before shard replication splits or graph traversal timeouts occur.
    - Detailed Slack incident notifications containing exact node identifiers, assigned roles, and network endpoints.
    - Centralized audit trail capturing cluster metadata, node capacity, and version distribution.
    - Declarative scheduled execution with manual on-demand trigger support.

    ## Who it's for

    - Platform Engineers and Site Reliability Engineers managing distributed ArangoDB clusters in production.
    - Database Administrators responsible for multi-model NoSQL cluster availability and shard consensus.
    - DevSecOps teams automating health verification gates for document, graph, and search workloads.

    ## Why orchestrate this with Kestra

    ArangoDB clusters depend on the Agency and Supervision consensus to maintain active shard leases and coordinator routing. If a DBServer fails or an agent drops out, running unmonitored can degrade graph queries and compromise transactional integrity. Kestra delivers automated, declarative orchestration with built-in scheduling, unified credential management, granular failure classification, and auditable execution history across all environments.

    ## Prerequisites

    - A running ArangoDB cluster (or standalone test instance) with HTTP port 8529 accessible from the Kestra worker.
    - Administrative credentials or a JWT token for the target ArangoDB database.
    - An incoming Slack webhook URL for alert delivery.

    ### Secrets

    - `ARANGODB_AUTH_TOKEN`: Base64-encoded `username:password` string or token used for HTTP authentication.
    - `SLACK_WEBHOOK`: Incoming Slack webhook URL used by `alert_warning_slack`, `alert_critical_slack`, `alert_unreachable_slack`, and the `errors` handler.

    ## Quick start

    1. Configure the `ARANGODB_AUTH_TOKEN` (e.g. `root:open-sesame` encoded) and `SLACK_WEBHOOK` secrets in your Kestra namespace.
    2. Start a local ArangoDB test instance using Docker:
       ```bash
       docker run -d --name arangodb -e ARANGO_NO_AUTH=1 -p 8529:8529 arangodb:latest
       ```
    3. Execute this flow manually in Kestra setting `arangodb_host: "localhost"` or `"arangodb-coordinator"`.
    4. The workflow queries cluster endpoints, validates supervision status, classifies `HEALTHY`, and records audit outputs.
    5. Enable the `every_15_minutes` trigger to automate continuous background monitoring.

    ## How to extend

    - Add shard synchronization audits by querying `/_admin/cluster/shardDistribution` to detect unaligned shard replicas.
    - Trigger automated node recycling or pod restarts via the Kestra Kubernetes plugin when `CRITICAL_NODE_FAILURE` is detected.
    - Route critical alerts to PagerDuty or Opsgenie using dedicated Kestra notification plugins.
    - Track collection-level read/write statistics using `io.kestra.plugin.scripts.shell.Commands`.

    ## Links

    - [ArangoDB Cluster Administration](https://docs.arangodb.com/stable/deploy-and-maintain/cluster/)
    - [ArangoDB Cluster Health API Documentation](https://docs.arangodb.com/stable/develop/http-api/cluster/)
    - [ArangoDB Supervision Architecture](https://docs.arangodb.com/stable/architecture/supervision/)
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
