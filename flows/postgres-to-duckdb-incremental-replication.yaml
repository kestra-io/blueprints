id: postgres-to-duckdb-incremental-replication
namespace: company.data
 
description: |
  Nightly replication of Postgres tables into a DuckDB analytics file.
  Small tables are fully reloaded; large tables load incrementally using a
  "last modified" watermark column. Every run is recorded in an audit log.

  Requires a `PG_PASSWORD` secret. Set `seed_demo_data` to true to try it
  with generated demo data against a Postgres reachable as `demo-postgres`
  (see the PR for setup commands).
 
labels:
  team: data-engineering
  pattern: replication
 
inputs:
  - id: tables
    type: ARRAY
    itemType: STRING
    defaults:
      - customers
      - products
      - orders
 
  - id: source_schema
    type: STRING
    defaults: source_demo
 
  - id: row_threshold
    type: INT
    description: Tables below this row count are fully reloaded; larger ones load incrementally.
    defaults: 1000
 
  - id: key_column
    type: STRING
    defaults: id
 
  - id: watermark_column
    type: STRING
    defaults: updated_at
 
  - id: force_full_reload
    type: BOOL
    defaults: false
 
  - id: seed_demo_data
    type: BOOL
    description: Create demo tables in Postgres and simulate new activity before replicating.
    defaults: false
 
variables:
  pg_host: demo-postgres
  pg_port: "5432"
  pg_db: kestra
  pg_user: kestra
  pg_password: k3str4   # use "{{ secret('PG_PASSWORD') }}" for real use
  duckdb_file: /tmp/kestra-wd/warehouse.duckdb
 
# DuckDB allows a single writer, so queue overlapping runs
concurrency:
  limit: 1
  behavior: QUEUE
 
tasks:
  - id: prepare_warehouse
    type: io.kestra.plugin.jdbc.duckdb.Queries
    url: "jdbc:duckdb:{{ vars.duckdb_file }}"
    sql: |
      INSTALL postgres;
 
      CREATE TABLE IF NOT EXISTS _replication_log (
        execution_id VARCHAR,
        table_name   VARCHAR,
        mode         VARCHAR,
        rows_loaded  BIGINT,
        loaded_at    TIMESTAMPTZ
      );
 
  - id: maybe_seed_demo_data
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.seed_demo_data }}"
    then:
      - id: seed_demo_data
        type: io.kestra.plugin.jdbc.postgresql.Queries
        url: "jdbc:postgresql://{{ vars.pg_host }}:{{ vars.pg_port }}/{{ vars.pg_db }}"
        username: "{{ vars.pg_user }}"
        password: "{{ vars.pg_password }}"
        sql: |
          CREATE SCHEMA IF NOT EXISTS {{ inputs.source_schema }};
 
          CREATE TABLE IF NOT EXISTS {{ inputs.source_schema }}.customers AS
          SELECT g AS id,
                 'Customer ' || g AS name,
                 'customer' || g || '@example.com' AS email,
                 now() - random() * interval '90 days' AS updated_at
          FROM generate_series(1, 200) AS g;
 
          CREATE TABLE IF NOT EXISTS {{ inputs.source_schema }}.products AS
          SELECT g AS id,
                 'Product ' || g AS name,
                 round((random() * 100 + 5)::numeric, 2) AS price,
                 now() - random() * interval '90 days' AS updated_at
          FROM generate_series(1, 50) AS g;
 
          CREATE TABLE IF NOT EXISTS {{ inputs.source_schema }}.orders AS
          SELECT g AS id,
                 (random() * 199 + 1)::int AS customer_id,
                 (random() * 49 + 1)::int AS product_id,
                 (random() * 4 + 1)::int AS quantity,
                 'placed'::text AS status,
                 now() - random() * interval '90 days' AS updated_at
          FROM generate_series(1, 5000) AS g;
 
          -- Simulate new activity: ship 100 orders, add 250 new ones
          UPDATE {{ inputs.source_schema }}.orders
          SET status = 'shipped', updated_at = now()
          WHERE id IN (
            SELECT id FROM {{ inputs.source_schema }}.orders
            WHERE status = 'placed'
            ORDER BY random()
            LIMIT 100
          );
 
          INSERT INTO {{ inputs.source_schema }}.orders
            (id, customer_id, product_id, quantity, status, updated_at)
          SELECT m.max_id + g,
                 (random() * 199 + 1)::int,
                 (random() * 49 + 1)::int,
                 (random() * 4 + 1)::int,
                 'placed',
                 now()
          FROM generate_series(1, 250) AS g,
               (SELECT MAX(id) AS max_id FROM {{ inputs.source_schema }}.orders) AS m;
 
  - id: replicate_each_table
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ inputs.tables | toJson }}"
    concurrencyLimit: 1
    tasks:
      - id: row_count
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "jdbc:postgresql://{{ vars.pg_host }}:{{ vars.pg_port }}/{{ vars.pg_db }}"
        username: "{{ vars.pg_user }}"
        password: "{{ vars.pg_password }}"
        sql: SELECT COUNT(*) AS cnt FROM {{ inputs.source_schema }}.{{ item.value }}
        fetchType: FETCH_ONE
 
      - id: choose_strategy
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.force_full_reload or outputs.row_count.row.cnt < inputs.row_threshold }}"
        then:
          - id: full_reload
            type: io.kestra.plugin.jdbc.duckdb.Queries
            url: "jdbc:duckdb:{{ vars.duckdb_file }}"
            sql: |
              LOAD postgres;
              ATTACH 'host={{ vars.pg_host }} port={{ vars.pg_port }} dbname={{ vars.pg_db }} user={{ vars.pg_user }} password={{ vars.pg_password }}'
                AS pg (TYPE POSTGRES, READ_ONLY);
 
              CREATE OR REPLACE TABLE {{ item.value }} AS
              SELECT * FROM pg.{{ inputs.source_schema }}.{{ item.value }};
 
              INSERT INTO _replication_log
              SELECT '{{ execution.id }}', '{{ item.value }}', 'full',
                     (SELECT COUNT(*) FROM {{ item.value }}), now();
 
        else:
          - id: incremental_load
            type: io.kestra.plugin.jdbc.duckdb.Queries
            url: "jdbc:duckdb:{{ vars.duckdb_file }}"
            sql: |
              LOAD postgres;
              ATTACH 'host={{ vars.pg_host }} port={{ vars.pg_port }} dbname={{ vars.pg_db }} user={{ vars.pg_user }} password={{ vars.pg_password }}'
                AS pg (TYPE POSTGRES, READ_ONLY);
 
              CREATE TABLE IF NOT EXISTS {{ item.value }} AS
              SELECT * FROM pg.{{ inputs.source_schema }}.{{ item.value }}
              WHERE 1 = 0;
 
              -- Rows changed since the newest row already loaded
              CREATE OR REPLACE TEMP TABLE _changes AS
              SELECT *
              FROM pg.{{ inputs.source_schema }}.{{ item.value }}
              WHERE {{ inputs.watermark_column }} > (
                SELECT COALESCE(MAX({{ inputs.watermark_column }}), TIMESTAMPTZ '1970-01-01 00:00:00+00')
                FROM {{ item.value }}
              );
 
              DELETE FROM {{ item.value }}
              WHERE {{ inputs.key_column }} IN (SELECT {{ inputs.key_column }} FROM _changes);
 
              INSERT INTO {{ item.value }}
              SELECT * FROM _changes;
 
              INSERT INTO _replication_log
              SELECT '{{ execution.id }}', '{{ item.value }}', 'incremental',
                     (SELECT COUNT(*) FROM _changes), now();
 
  - id: run_report
    type: io.kestra.plugin.jdbc.duckdb.Query
    url: "jdbc:duckdb:{{ vars.duckdb_file }}"
    sql: |
      SELECT table_name, mode, rows_loaded
      FROM _replication_log
      WHERE loaded_at >= TIMESTAMPTZ '{{ execution.startDate }}'
      ORDER BY table_name;
    fetchType: FETCH
 
  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Replication complete for {{ inputs.tables | length }} tables.
      {% for r in outputs.run_report.rows %}
        - {{ r.table_name }}: {{ r.mode }}, {{ r.rows_loaded }} rows loaded
      {% endfor %}
 
errors:
  - id: replication_failed
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Replication failed in execution {{ execution.id }}."
 
triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"
    timezone: America/New_York
 
  - id: on_demand_refresh
    type: io.kestra.plugin.core.trigger.Webhook
    key: refresh-replica

extend:
  title: Replicate Postgres tables into DuckDB with full and incremental loads
  metaTitle: Postgres to DuckDB incremental replication with Kestra
  shortDescription: Copy Postgres tables into a DuckDB analytics file every night, fully reloading small tables and loading large ones incrementally from a watermark column, with an audit log of every run.
  metaDescription: Replicate Postgres into DuckDB with Kestra. Full reloads for small tables, watermark-based incremental loads for large ones, and a per-run audit log.
  description: |
    Running analytics directly against a production Postgres database slows it down, and copying every table in full every night wastes time on large tables that barely change. This flow keeps a local DuckDB file in sync with Postgres: it counts the rows of each table, fully reloads small ones, and loads large ones incrementally from a "last modified" watermark column. Every load is recorded in a `_replication_log` table.

    ## How it works

    1. The flow starts on a nightly **Schedule** (02:00 New York time) or on demand through a **Webhook** call.
    2. `prepare_warehouse` installs the DuckDB `postgres` extension and creates the `_replication_log` table if it does not exist.
    3. When `seed_demo_data` is true, `seed_demo_data` creates `customers`, `products` and `orders` demo tables in Postgres, then ships 100 orders and adds 250 new ones to simulate a day of activity.
    4. A **Loop** goes through `tables` one at a time. For each table, `row_count` counts the rows in Postgres.
    5. An **If** task picks the strategy. Tables under `row_threshold` rows, or every table when `force_full_reload` is true, are copied in full with `CREATE OR REPLACE TABLE`.
    6. Larger tables load incrementally: rows whose `watermark_column` is newer than the latest value already in DuckDB are fetched, older copies with the same `key_column` are deleted, and the new versions are inserted. This captures both new and updated rows.
    7. `run_report` reads this execution's rows from `_replication_log` and `summary` logs the mode and number of rows loaded for each table. If any task fails, the `errors` branch logs the failed execution ID.

    ## What you get

    - A DuckDB file with a copy of each Postgres table, ready for local analytics.
    - Incremental loads that read only changed rows from large tables.
    - An audit table (`_replication_log`) with the execution ID, table, mode, row count and timestamp of each load.
    - A per-run summary in the execution logs.
    - Runs that never overlap: `concurrency` queues new executions because DuckDB allows only one writer.

    ## Who it's for

    - Data and analytics engineers building a lightweight local warehouse.
    - Teams that want to take analytics load off a production Postgres database.
    - Anyone learning full versus incremental replication patterns.

    ## Why orchestrate this with Kestra

    - The table list, threshold, key and watermark columns are inputs, so the same flow covers new tables without code changes.
    - Schedule and webhook triggers share one definition, and queued concurrency prevents two runs writing to the DuckDB file at once.
    - Every execution keeps its logs, outputs and per-table status, so a failed load is easy to find and re-run.
    - Credentials are read from Kestra secrets instead of being stored in scripts.

    ## Prerequisites

    - A Postgres database reachable from the Kestra worker. Each replicated table needs a unique key column (default `id`) and a timestamp watermark column (default `updated_at`) that is updated on every change.
    - A path on the worker where the DuckDB file can be written and kept between runs (default `/tmp/kestra-wd/warehouse.duckdb`).

    ### Secrets

    - `PG_PASSWORD`: Password of the Postgres user that reads the source tables (required for real use; reference it in `vars.pg_password`).

    ## Quick start

    1. Add the `PG_PASSWORD` secret and set `pg_host`, `pg_port`, `pg_db`, `pg_user` and `duckdb_file` in `variables` to match your environment.
    2. Execute the flow with `seed_demo_data` set to true to create demo tables and see a full load of `customers` and `products` and an incremental load of `orders`.
    3. Run it again: `orders` loads only the 350 rows changed by the new simulated activity.
    4. Set `tables` and `source_schema` to your own tables and let the nightly schedule run.

    ## How to extend

    - Send a Slack or email alert from the `errors` branch instead of only logging.
    - Export the DuckDB tables to Parquet on S3 or GCS after each run.
    - Trigger dbt models or a BI cache refresh once replication finishes.
    - Handle deletes with soft-delete flags or a periodic full reload using `force_full_reload`.

    ## Links

    - [DuckDB Queries task](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [PostgreSQL Query task](https://kestra.io/plugins/plugin-jdbc-postgres/io.kestra.plugin.jdbc.postgresql.query)
    - [Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Webhook trigger](https://kestra.io/docs/workflow-components/triggers/webhook-trigger)
    - [Kestra secrets](https://kestra.io/docs/concepts/secret)
    - [DuckDB Postgres extension](https://duckdb.org/docs/extensions/postgres)
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - Data Warehouses
  ee: false
  demo: false
