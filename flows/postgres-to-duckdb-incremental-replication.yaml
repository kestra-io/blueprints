id: postgres_to_duckdb_replicator
namespace: company.data
 
description: |
  Nightly replication of Postgres tables into a DuckDB analytics file.
  Small tables are fully reloaded; large tables load incrementally using a
  "last modified" watermark column. Every run is recorded in an audit log.

  Requires a `PG_PASSWORD` secret. Set `seed_demo_data` to true to try it
  with generated demo data against a Postgres reachable as `demo-postgres`
  (see the PR for setup commands).
 
labels:
  team: data-engineering
  pattern: replication
 
inputs:
  - id: tables
    type: ARRAY
    itemType: STRING
    defaults:
      - customers
      - products
      - orders
 
  - id: source_schema
    type: STRING
    defaults: source_demo
 
  - id: row_threshold
    type: INT
    description: Tables below this row count are fully reloaded; larger ones load incrementally.
    defaults: 1000
 
  - id: key_column
    type: STRING
    defaults: id
 
  - id: watermark_column
    type: STRING
    defaults: updated_at
 
  - id: force_full_reload
    type: BOOL
    defaults: false
 
  - id: seed_demo_data
    type: BOOL
    description: Create demo tables in Postgres and simulate new activity before replicating.
    defaults: false
 
variables:
  pg_host: demo-postgres
  pg_port: "5432"
  pg_db: kestra
  pg_user: kestra
  pg_password: k3str4   # use "{{ secret('PG_PASSWORD') }}" for real use
  duckdb_file: /tmp/kestra-wd/warehouse.duckdb
 
# DuckDB allows a single writer, so queue overlapping runs
concurrency:
  limit: 1
  behavior: QUEUE
 
tasks:
  - id: prepare_warehouse
    type: io.kestra.plugin.jdbc.duckdb.Queries
    url: "jdbc:duckdb:{{ vars.duckdb_file }}"
    sql: |
      INSTALL postgres;
 
      CREATE TABLE IF NOT EXISTS _replication_log (
        execution_id VARCHAR,
        table_name   VARCHAR,
        mode         VARCHAR,
        rows_loaded  BIGINT,
        loaded_at    TIMESTAMPTZ
      );
 
  - id: maybe_seed_demo_data
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.seed_demo_data }}"
    then:
      - id: seed_demo_data
        type: io.kestra.plugin.jdbc.postgresql.Queries
        url: "jdbc:postgresql://{{ vars.pg_host }}:{{ vars.pg_port }}/{{ vars.pg_db }}"
        username: "{{ vars.pg_user }}"
        password: "{{ vars.pg_password }}"
        sql: |
          CREATE SCHEMA IF NOT EXISTS {{ inputs.source_schema }};
 
          CREATE TABLE IF NOT EXISTS {{ inputs.source_schema }}.customers AS
          SELECT g AS id,
                 'Customer ' || g AS name,
                 'customer' || g || '@example.com' AS email,
                 now() - random() * interval '90 days' AS updated_at
          FROM generate_series(1, 200) AS g;
 
          CREATE TABLE IF NOT EXISTS {{ inputs.source_schema }}.products AS
          SELECT g AS id,
                 'Product ' || g AS name,
                 round((random() * 100 + 5)::numeric, 2) AS price,
                 now() - random() * interval '90 days' AS updated_at
          FROM generate_series(1, 50) AS g;
 
          CREATE TABLE IF NOT EXISTS {{ inputs.source_schema }}.orders AS
          SELECT g AS id,
                 (random() * 199 + 1)::int AS customer_id,
                 (random() * 49 + 1)::int AS product_id,
                 (random() * 4 + 1)::int AS quantity,
                 'placed'::text AS status,
                 now() - random() * interval '90 days' AS updated_at
          FROM generate_series(1, 5000) AS g;
 
          -- Simulate new activity: ship 100 orders, add 250 new ones
          UPDATE {{ inputs.source_schema }}.orders
          SET status = 'shipped', updated_at = now()
          WHERE id IN (
            SELECT id FROM {{ inputs.source_schema }}.orders
            WHERE status = 'placed'
            ORDER BY random()
            LIMIT 100
          );
 
          INSERT INTO {{ inputs.source_schema }}.orders
            (id, customer_id, product_id, quantity, status, updated_at)
          SELECT m.max_id + g,
                 (random() * 199 + 1)::int,
                 (random() * 49 + 1)::int,
                 (random() * 4 + 1)::int,
                 'placed',
                 now()
          FROM generate_series(1, 250) AS g,
               (SELECT MAX(id) AS max_id FROM {{ inputs.source_schema }}.orders) AS m;
 
  - id: replicate_each_table
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ inputs.tables | toJson }}"
    concurrencyLimit: 1
    tasks:
      - id: row_count
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "jdbc:postgresql://{{ vars.pg_host }}:{{ vars.pg_port }}/{{ vars.pg_db }}"
        username: "{{ vars.pg_user }}"
        password: "{{ vars.pg_password }}"
        sql: SELECT COUNT(*) AS cnt FROM {{ inputs.source_schema }}.{{ item.value }}
        fetchType: FETCH_ONE
 
      - id: choose_strategy
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.force_full_reload or outputs.row_count.row.cnt < inputs.row_threshold }}"
        then:
          - id: full_reload
            type: io.kestra.plugin.jdbc.duckdb.Queries
            url: "jdbc:duckdb:{{ vars.duckdb_file }}"
            sql: |
              LOAD postgres;
              ATTACH 'host={{ vars.pg_host }} port={{ vars.pg_port }} dbname={{ vars.pg_db }} user={{ vars.pg_user }} password={{ vars.pg_password }}'
                AS pg (TYPE POSTGRES, READ_ONLY);
 
              CREATE OR REPLACE TABLE {{ item.value }} AS
              SELECT * FROM pg.{{ inputs.source_schema }}.{{ item.value }};
 
              INSERT INTO _replication_log
              SELECT '{{ execution.id }}', '{{ item.value }}', 'full',
                     (SELECT COUNT(*) FROM {{ item.value }}), now();
 
        else:
          - id: incremental_load
            type: io.kestra.plugin.jdbc.duckdb.Queries
            url: "jdbc:duckdb:{{ vars.duckdb_file }}"
            sql: |
              LOAD postgres;
              ATTACH 'host={{ vars.pg_host }} port={{ vars.pg_port }} dbname={{ vars.pg_db }} user={{ vars.pg_user }} password={{ vars.pg_password }}'
                AS pg (TYPE POSTGRES, READ_ONLY);
 
              CREATE TABLE IF NOT EXISTS {{ item.value }} AS
              SELECT * FROM pg.{{ inputs.source_schema }}.{{ item.value }}
              WHERE 1 = 0;
 
              -- Rows changed since the newest row already loaded
              CREATE OR REPLACE TEMP TABLE _changes AS
              SELECT *
              FROM pg.{{ inputs.source_schema }}.{{ item.value }}
              WHERE {{ inputs.watermark_column }} > (
                SELECT COALESCE(MAX({{ inputs.watermark_column }}), TIMESTAMPTZ '1970-01-01 00:00:00+00')
                FROM {{ item.value }}
              );
 
              DELETE FROM {{ item.value }}
              WHERE {{ inputs.key_column }} IN (SELECT {{ inputs.key_column }} FROM _changes);
 
              INSERT INTO {{ item.value }}
              SELECT * FROM _changes;
 
              INSERT INTO _replication_log
              SELECT '{{ execution.id }}', '{{ item.value }}', 'incremental',
                     (SELECT COUNT(*) FROM _changes), now();
 
  - id: run_report
    type: io.kestra.plugin.jdbc.duckdb.Query
    url: "jdbc:duckdb:{{ vars.duckdb_file }}"
    sql: |
      SELECT table_name, mode, rows_loaded
      FROM _replication_log
      WHERE loaded_at >= TIMESTAMPTZ '{{ execution.startDate }}'
      ORDER BY table_name;
    fetchType: FETCH
 
  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Replication complete for {{ inputs.tables | length }} tables.
      {% for r in outputs.run_report.rows %}
        - {{ r.table_name }}: {{ r.mode }}, {{ r.rows_loaded }} rows loaded
      {% endfor %}
 
errors:
  - id: replication_failed
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Replication failed in execution {{ execution.id }}."
 
triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"
    timezone: America/New_York
 
  - id: on_demand_refresh
    type: io.kestra.plugin.core.trigger.Webhook
    key: refresh-replica
