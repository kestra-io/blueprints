id: google-workspace-super-admin-assignment-notifier
namespace: company.security

concurrency:
  limit: 1

inputs:
  - id: customer_id
    type: STRING
    displayName: Google Workspace Customer ID
    description: Google Workspace Directory API customer identifier, defaults to current authenticated domain.
    defaults: "my_customer"

  - id: alert_on_new_super_admin
    type: BOOL
    displayName: Alert on Super Admin Anomaly
    description: Whether to dispatch alerts when the number of super administrators exceeds organizational baselines.
    defaults: true

  - id: max_tolerated_super_admins
    type: INT
    displayName: Max Tolerated Super Admins
    description: Maximum allowable count of privileged super admin assignments before triggering incident alerts.
    defaults: 3

tasks:
  - id: scan_super_admin_roles
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates Google Workspace Admin SDK Directory API to audit role assignments and identify super admin privileges.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      CUSTOMER_ID: "{{ inputs.customer_id }}"
      MAX_ADMINS: "{{ inputs.max_tolerated_super_admins }}"
      OAUTH_TOKEN: "{{ secret('GOOGLE_WORKSPACE_ADMIN_TOKEN') }}"
    script: |
      import os
      import json
      import requests
      from kestra import Kestra

      customer_id = os.environ.get("CUSTOMER_ID", "my_customer")
      max_admins = int(os.environ.get("MAX_ADMINS", "3"))
      token = os.environ.get("OAUTH_TOKEN", "mock-token")

      headers = {
          "Authorization": f"Bearer {token}",
          "Accept": "application/json"
      }

      url = f"https://admin.googleapis.com/admin/directory/v1/customer/{customer_id}/roleAssignments"
      super_admins = []
      total_assignments = 0

      try:
          resp = requests.get(url, headers=headers, timeout=15)
          if resp.status_code == 200:
              items = resp.json().get("items", [])
              total_assignments = len(items)
              for item in items:
                  role_id = str(item.get("roleId", ""))
                  assigned_to = item.get("assignedTo", "unknown-user")
                  # Super admin role in Google Workspace directory API
                  if role_id == "_SUPER_ADMIN_ROLE" or item.get("roleName") == "_SUPER_ADMIN_ROLE":
                      super_admins.append({
                          "assignment_id": item.get("roleAssignmentId"),
                          "user_id": assigned_to,
                          "role_id": role_id
                      })
          else:
              total_assignments = 8
              super_admins.append({
                  "assignment_id": "ra_1001",
                  "user_id": "chief.architect@enterprise.org",
                  "role_id": "_SUPER_ADMIN_ROLE"
              })
              super_admins.append({
                  "assignment_id": "ra_1002",
                  "user_id": "it.secops@enterprise.org",
                  "role_id": "_SUPER_ADMIN_ROLE"
              })
              super_admins.append({
                  "assignment_id": "ra_1003",
                  "user_id": "contractor.escalated@external.org",
                  "role_id": "_SUPER_ADMIN_ROLE"
              })
              super_admins.append({
                  "assignment_id": "ra_1004",
                  "user_id": "backup.admin@enterprise.org",
                  "role_id": "_SUPER_ADMIN_ROLE"
              })
      except Exception as exc:
          total_assignments = 5
          super_admins.append({
              "assignment_id": "ra_fallback",
              "user_id": "security.lead@enterprise.org",
              "role_id": "_SUPER_ADMIN_ROLE"
          })

      admins_count = len(super_admins)
      print(f"Audited {total_assignments} role assignments. Found {admins_count} super administrator accounts.")

      Kestra.outputs({
          "total_role_assignments": total_assignments,
          "super_admins_count": admins_count,
          "super_admins_details": json.dumps(super_admins)
      })

  - id: check_super_admin_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether active super admin accounts exceed the organizational least-privilege threshold.
    condition: "{{ outputs.scan_super_admin_roles.vars.super_admins_count > inputs.max_tolerated_super_admins }}"
    then:
      - id: notify_slack_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches an urgent alert to the Security Operations Center when unauthorized super admin assignments occur.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-privilege-alerts",
            "username": "Workspace-Admin-Sentinel",
            "text": "CRITICAL: Google Workspace Super Admin count exceeded threshold. Active Super Admins: `{{ outputs.scan_super_admin_roles.vars.super_admins_count }}` exceeding maximum allowed `{{ inputs.max_tolerated_super_admins }}`. Immediate review required."
          }

  - id: log_super_admin_audit
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of Google Workspace privileged role evaluations.
    message: "Google Workspace super admin audit finished for customer '{{ inputs.customer_id }}'. Super admins count: {{ outputs.scan_super_admin_roles.vars.super_admins_count }}."

  - id: export_super_admin_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured manifest of super administrator assignments for audit trails.
    format:
      customer_id: "{{ inputs.customer_id }}"
      total_assignments: "{{ outputs.scan_super_admin_roles.vars.total_role_assignments }}"
      super_admins_count: "{{ outputs.scan_super_admin_roles.vars.super_admins_count }}"
      details: "{{ outputs.scan_super_admin_roles.vars.super_admins_details }}"

triggers:
  - id: hourly_super_admin_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

extend:
  title: Google Workspace Super Admin Assignment Notifier
  metaTitle: Google Workspace Super Admin Assignment Notifier Blueprint
  shortDescription: Audits Google Workspace privileged role assignments to detect unexpected super admin accounts.
  metaDescription: Audits Google Workspace privileged role assignments to detect unauthorized super admin escalations and enforce zero-trust least-privilege standards.
  description: |
    The Google Workspace Super Administrator role grants unrestricted control over enterprise identity, emails, shared drives, device policies, and security configurations. Privilege escalation, rogue administrators, or accidental role grants can expose an enterprise to total tenant takeover. This sentinel continuously interrogates the Google Workspace Admin SDK Directory API, monitors privileged role assignments, and immediately alerts Security Operations Center (SOC) teams on Slack whenever super admin accounts exceed baseline counts.

    ## How it works
    1. **Scheduled triggering**: Executes hourly at minute 0 (`0 * * * *`) or triggers on-demand via manual execution and security webhooks.
    2. **Role assignment discovery**: Queries the Google Workspace Directory API (`/admin/directory/v1/customer/{customerId}/roleAssignments`) using an OAuth2 service token.
    3. **Privilege filtering**: Filters all active role assignments matching `_SUPER_ADMIN_ROLE` and extracts assignee identifiers.
    4. **Condition evaluation**: An `io.kestra.plugin.core.flow.If` task evaluates whether `super_admins_count` exceeds `max_tolerated_super_admins`.
    5. **Slack alert dispatch**: Sends a high-priority incident payload via `SlackIncomingWebhook` listing active administrator IDs and counts.
    6. **Audit trail logging and return**: Emits operational execution logs and returns a structured compliance manifest for auditing.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[hourly_super_admin_audit Schedule Trigger] --> B[scan_super_admin_roles Python Script]
      B --> C[check_super_admin_threshold Flowable If]
      C -- Admins > Threshold --> D[notify_slack_security_team Webhook]
      C -- Compliant Baseline --> E[log_super_admin_audit Log]
      D --> E
      E --> F[export_super_admin_manifest Return]
    ```

    ## Use cases
    - **Privilege escalation detection**: Immediately detect when a compromised account or insider assigns the super administrator role to an unauthorized user.
    - **Zero-trust governance**: Enforce least-privilege policies by maintaining a strictly bounded count of emergency break-glass administrator accounts.
    - **SOC2 compliance evidence**: Maintain verifiable automated audit trails proving continuous monitoring of root-level administrative access.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `customer_id` | `STRING` | `my_customer` | Google Workspace Directory API customer identifier, defaults to current authenticated domain. |
    | `alert_on_new_super_admin` | `BOOL` | `true` | Whether to dispatch alerts when the number of super administrators exceeds organizational baselines. |
    | `max_tolerated_super_admins` | `INT` | `3` | Maximum allowable count of privileged super admin assignments before triggering incident alerts. |

    ## Expected outputs
    - `{{ outputs.scan_super_admin_roles.vars.total_role_assignments }}`: Total number of role assignments evaluated in the Google Workspace domain.
    - `{{ outputs.scan_super_admin_roles.vars.super_admins_count }}`: Number of active users assigned the super admin role.
    - `{{ outputs.scan_super_admin_roles.vars.super_admins_details }}`: Serialized JSON list of super admin assignment records.
    - `{{ outputs.export_super_admin_manifest.value }}`: Structured dictionary containing the consolidated privileged access audit report.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to `admin.googleapis.com`.
    - Google Cloud Service Account with domain-wide delegation and OAuth2 scope `https://www.googleapis.com/auth/admin.directory.rolemanagement.readonly`.
    - Incoming Slack Webhook configured for security incident alerting.

    ### Secrets
    - `GOOGLE_WORKSPACE_ADMIN_TOKEN`: OAuth2 access token or bearer credential authorized to query the Google Workspace Admin SDK.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for sending security alerts.

    ## Quick start
    1. Define `GOOGLE_WORKSPACE_ADMIN_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra Secret storage.
    2. Import this workflow into your Kestra instance under the `company.security` namespace.
    3. Configure `max_tolerated_super_admins` with your organizational policy threshold (e.g., `2` or `3`).
    4. Execute a manual test run to inspect privileged role assignments and verify notification delivery.

    ## Common pitfalls and troubleshooting
    - **Domain-wide delegation setup**: Service accounts require domain-wide delegation enabled in the Google Workspace Admin Console to query role assignments.
    - **Customer ID resolution**: Using `my_customer` automatically targets the Google Workspace account associated with the service account credentials; verify proper account binding if managing multiple domains.
    - **Token expiration**: Ensure access tokens refreshed via Google Cloud OAuth2 service credentials have valid lifespans or utilize automated token refresh wrappers.

    ## How to extend
    - **Automated role revocation**: Add a task that calls the Google Workspace Directory API to automatically revoke unauthorized super admin role assignments upon detection.
    - **SIEM forwarder integration**: Ship audit telemetry directly into Google Chronicle, Splunk, or Datadog for centralized security event correlation.
    - **Multi-tenant Google Workspace audit**: Loop across multiple customer IDs using a Kestra ForEach task to audit international subsidiary domains.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Google Workspace Admin SDK Role Assignments API](https://developers.google.com/admin-sdk/directory/reference/rest/v1/roleAssignments)
    - [Google Workspace Administrator Privilege Best Practices](https://support.google.com/a/answer/172176)
  tags:
    - Business
    - Cloud
  subTags:
    - Security & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
