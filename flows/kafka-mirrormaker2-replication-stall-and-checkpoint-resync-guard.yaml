id: kafka-mirrormaker2-replication-stall-and-checkpoint-resync-guard
namespace: company.streaming

description: |
  Audits Apache Kafka MirrorMaker 2 (MM2) cross-cluster replication flows, detects stalled consumer
  group offset checkpoints and failed worker tasks, evaluates differential offset progression against
  Kestra KV history, executes guarded task restarts behind human approval, and verifies lag recovery.

inputs:
  - id: connect_url
    type: STRING
    displayName: Kafka Connect URL
    description: Base HTTP URL of the Kafka Connect distributed cluster hosting the MirrorMaker 2 connectors.
    defaults: "http://kafka-connect:8083"

  - id: source_bootstrap_servers
    type: STRING
    displayName: Source Kafka Bootstrap Servers
    description: Bootstrap broker endpoints for the primary/source Kafka cluster (e.g. host1:9092,host2:9092).
    defaults: "kafka-primary:9092"

  - id: target_bootstrap_servers
    type: STRING
    displayName: Target Kafka Bootstrap Servers
    description: Bootstrap broker endpoints for the secondary/target disaster-recovery Kafka cluster.
    defaults: "kafka-dr:9092"

  - id: source_cluster_alias
    type: STRING
    displayName: Source Cluster Alias
    description: Alias identifier assigned to the source cluster in MirrorMaker 2 configuration.
    defaults: "primary"

  - id: target_cluster_alias
    type: STRING
    displayName: Target Cluster Alias
    description: Alias identifier assigned to the target cluster in MirrorMaker 2 configuration.
    defaults: "backup"

  - id: monitored_consumer_groups
    type: ARRAY
    itemType: STRING
    displayName: Monitored Consumer Groups
    description: Critical consumer group IDs whose offset replication and translation must be verified across clusters.
    defaults:
      - "orders-processing-service"
      - "inventory-fulfillment-service"

  - id: heartbeat_topic
    type: STRING
    displayName: Heartbeat Topic Name
    description: Topic name used by MirrorHeartbeatConnector to emit cross-cluster connectivity signals.
    defaults: "heartbeats"

  - id: max_checkpoint_lag_records
    type: INT
    displayName: Max Checkpoint Lag Threshold
    description: Maximum permissible difference between source topic partition end-offsets and target replicated offsets.
    defaults: 5000

  - id: consecutive_freeze_threshold
    type: INT
    displayName: Consecutive Freeze Threshold
    description: Number of consecutive diagnostic runs that offset replication must remain stationary while source grows before alerting.
    defaults: 2

  - id: auto_remediate
    type: BOOL
    displayName: Auto Remediate
    description: When true and dry_run is false, automatically restarts failed tasks and resumes paused connectors.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, evaluates health and plans remediation without modifying connector or task runtime states.
    defaults: true

  - id: require_human_approval
    type: BOOL
    displayName: Require Human Approval
    description: When true and dry_run is false, pauses workflow execution for SRE confirmation before applying restarts.
    defaults: true

triggers:
  - id: periodic_mm2_guard
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic scheduled audit running every 15 minutes to inspect replication health.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: fetch_source_connector_status
    type: io.kestra.plugin.kafka.ConnectorGetStatus
    description: Queries the Kafka Connect cluster for MirrorSourceConnector state, active workers, and task health.
    connectUrl: "{{ inputs.connect_url }}"
    connectorName: "{{ inputs.source_cluster_alias }}->{{ inputs.target_cluster_alias }}.MirrorSourceConnector"
    username: "{{ secret('CONNECT_BASIC_AUTH_USERNAME') }}"
    password: "{{ secret('CONNECT_BASIC_AUTH_PASSWORD') }}"

  - id: fetch_checkpoint_connector_status
    type: io.kestra.plugin.kafka.ConnectorGetStatus
    description: Queries status of MirrorCheckpointConnector responsible for translating consumer group offsets.
    connectUrl: "{{ inputs.connect_url }}"
    connectorName: "{{ inputs.source_cluster_alias }}->{{ inputs.target_cluster_alias }}.MirrorCheckpointConnector"
    username: "{{ secret('CONNECT_BASIC_AUTH_USERNAME') }}"
    password: "{{ secret('CONNECT_BASIC_AUTH_PASSWORD') }}"

  - id: fetch_heartbeat_connector_status
    type: io.kestra.plugin.kafka.ConnectorGetStatus
    description: Queries status of MirrorHeartbeatConnector responsible for inter-cluster latency tracking.
    connectUrl: "{{ inputs.connect_url }}"
    connectorName: "{{ inputs.source_cluster_alias }}->{{ inputs.target_cluster_alias }}.MirrorHeartbeatConnector"
    username: "{{ secret('CONNECT_BASIC_AUTH_USERNAME') }}"
    password: "{{ secret('CONNECT_BASIC_AUTH_PASSWORD') }}"

  - id: fetch_source_consumer_groups
    type: io.kestra.plugin.kafka.ConsumerGroupDescribe
    description: Describes monitored consumer groups on the primary source cluster to retrieve partition high watermarks.
    properties:
      bootstrap.servers: "{{ inputs.source_bootstrap_servers }}"
      security.protocol: "PLAINTEXT"
    groupIds: "{{ inputs.monitored_consumer_groups }}"

  - id: fetch_target_consumer_groups
    type: io.kestra.plugin.kafka.ConsumerGroupDescribe
    description: Describes mirrored consumer groups on the target DR cluster to evaluate translated committed offsets.
    properties:
      bootstrap.servers: "{{ inputs.target_bootstrap_servers }}"
      security.protocol: "PLAINTEXT"
    groupIds: "{{ inputs.monitored_consumer_groups }}"

  - id: get_previous_replication_state
    type: io.kestra.plugin.core.kv.Get
    description: Retrieves the previous replication snapshot and stationary offset counters from Kestra KV store.
    key: "kafka_mm2_tracker_{{ inputs.source_cluster_alias }}_{{ inputs.target_cluster_alias }}"
    errorOnMissing: false

  - id: triage_mm2_replication
    type: io.kestra.plugin.scripts.python.Script
    description: Analyzes connector task statuses, evaluates differential offset lag against KV history, and builds a remediation plan.
    containerImage: python:3.11-slim
    outputFiles:
      - "remediation_plan.json"
    env:
      SOURCE_CONNECTOR: "{{ outputs.fetch_source_connector_status | toJson }}"
      CHECKPOINT_CONNECTOR: "{{ outputs.fetch_checkpoint_connector_status | toJson }}"
      HEARTBEAT_CONNECTOR: "{{ outputs.fetch_heartbeat_connector_status | toJson }}"
      SOURCE_GROUPS: "{{ outputs.fetch_source_consumer_groups.groups | toJson }}"
      TARGET_GROUPS: "{{ outputs.fetch_target_consumer_groups.groups | toJson }}"
      PREVIOUS_STATE: "{{ outputs.get_previous_replication_state.value ?? '{}' }}"
      MAX_LAG_THRESHOLD: "{{ inputs.max_checkpoint_lag_records }}"
      FREEZE_THRESHOLD: "{{ inputs.consecutive_freeze_threshold }}"
    script: |
      import json
      import os
      from kestra import Kestra

      source_status = json.loads(os.environ.get("SOURCE_CONNECTOR") or "{}")
      checkpoint_status = json.loads(os.environ.get("CHECKPOINT_CONNECTOR") or "{}")
      heartbeat_status = json.loads(os.environ.get("HEARTBEAT_CONNECTOR") or "{}")
      source_groups = json.loads(os.environ.get("SOURCE_GROUPS") or "[]")
      target_groups = json.loads(os.environ.get("TARGET_GROUPS") or "[]")
      prev_raw = os.environ.get("PREVIOUS_STATE", "{}")
      prev_state = json.loads(prev_raw) if prev_raw and prev_raw != "{}" else {}

      max_lag = int(os.environ.get("MAX_LAG_THRESHOLD", 5000))
      freeze_threshold = int(os.environ.get("FREEZE_THRESHOLD", 2))

      connectors = [source_status, checkpoint_status, heartbeat_status]
      failed_tasks = []
      stalled_connectors = []
      connector_summaries = {}

      for conn in connectors:
          name = conn.get("connectorName", "unknown")
          state = conn.get("connectorState", "UNKNOWN")
          tasks = conn.get("tasks", []) or []
          failed_in_conn = [t for t in tasks if t.get("state") in ("FAILED", "UNASSIGNED")]
          connector_summaries[name] = {
              "state": state,
              "total_tasks": len(tasks),
              "failed_tasks": len(failed_in_conn)
          }
          if failed_in_conn or state in ("FAILED", "PAUSED"):
              stalled_connectors.append(name)
              for t in failed_in_conn:
                  failed_tasks.append({
                      "connector": name,
                      "task_id": t.get("id"),
                      "worker_id": t.get("workerId"),
                      "state": t.get("state"),
                      "trace": (t.get("trace") or "")[:300]
                  })

      # Evaluate partition offset progression across source and target
      target_offset_map = {}
      for g in target_groups:
          gid = g.get("groupId")
          for off in g.get("offsets", []) or []:
              key = f"{gid}::{off.get('topic')}::{off.get('partition')}"
              target_offset_map[key] = {
                  "committed": off.get("currentOffset", 0),
                  "end": off.get("endOffset", 0),
                  "lag": off.get("lag", 0)
              }

      frozen_partitions = []
      prev_offsets = prev_state.get("offsets", {})
      current_offsets_snap = {}

      for g in source_groups:
          gid = g.get("groupId")
          for off in g.get("offsets", []) or []:
              key = f"{gid}::{off.get('topic')}::{off.get('partition')}"
              src_end = off.get("endOffset", 0)
              tgt_data = target_offset_map.get(key, {})
              tgt_committed = tgt_data.get("committed", 0)
              current_offsets_snap[key] = {
                  "src_end": src_end,
                  "tgt_committed": tgt_committed
              }

              prev_entry = prev_offsets.get(key, {})
              prev_src_end = prev_entry.get("src_end", src_end)
              prev_tgt_committed = prev_entry.get("tgt_committed", tgt_committed)
              prev_freeze_count = prev_entry.get("freeze_count", 0)

              src_progressed = src_end > prev_src_end
              tgt_stalled = (tgt_committed == prev_tgt_committed) and src_progressed
              accumulated_lag = max(0, src_end - tgt_committed)

              if tgt_stalled and accumulated_lag >= max_lag:
                  freeze_count = prev_freeze_count + 1
              else:
                  freeze_count = 0

              current_offsets_snap[key]["freeze_count"] = freeze_count

              if freeze_count >= freeze_threshold:
                  frozen_partitions.append({
                      "partition_key": key,
                      "source_end": src_end,
                      "target_committed": tgt_committed,
                      "lag": accumulated_lag,
                      "consecutive_freezes": freeze_count
                  })

      remediation_required = len(failed_tasks) > 0 or len(frozen_partitions) > 0

      status_label = "HEALTHY"
      if failed_tasks:
          status_label = "CRITICAL_TASK_FAILED"
      elif frozen_partitions:
          status_label = "WARNING_CHECKPOINT_STALLED"

      remediation_plan = {
          "status": status_label,
          "remediation_required": remediation_required,
          "stalled_connectors": list(set(stalled_connectors)),
          "failed_tasks": failed_tasks,
          "frozen_partitions": frozen_partitions,
          "connector_summaries": connector_summaries
      }

      with open("remediation_plan.json", "w") as f:
          json.dump(remediation_plan, f, indent=2)

      # Persist state snapshot for next run
      new_state = {
          "offsets": current_offsets_snap,
          "last_status": status_label,
          "failed_task_count": len(failed_tasks)
      }

      Kestra.outputs({
          "remediation_required": remediation_required,
          "status": status_label,
          "stalled_connectors": list(set(stalled_connectors)),
          "failed_task_count": len(failed_tasks),
          "frozen_partition_count": len(frozen_partitions),
          "updated_state_json": json.dumps(new_state)
      })

  - id: persist_replication_state
    type: io.kestra.plugin.core.kv.Set
    description: Stores the updated offset progression baseline and freeze counters in Kestra KV store.
    key: "kafka_mm2_tracker_{{ inputs.source_cluster_alias }}_{{ inputs.target_cluster_alias }}"
    value: "{{ outputs.triage_mm2_replication.vars.updated_state_json }}"

  - id: gate_remediation
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether failed tasks or frozen checkpoints require administrative intervention.
    condition: "{{ outputs.triage_mm2_replication.vars.remediation_required == true }}"
    then:
      - id: dispatch_slack_incident
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches detailed incident triage alert with connector and partition breakdown to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {{ {
            "attachments": [
              {
                "color": "danger",
                "title": ":rotating_light: Kafka MirrorMaker 2 Replication Degradation Detected",
                "text": "MirrorMaker 2 replication between `" ~ inputs.source_cluster_alias ~ "` and `" ~ inputs.target_cluster_alias ~ "` has stalled.\n*Status:* `" ~ outputs.triage_mm2_replication.vars.status ~ "`\n*Failed Tasks:* " ~ outputs.triage_mm2_replication.vars.failed_task_count ~ "\n*Frozen Partitions:* " ~ outputs.triage_mm2_replication.vars.frozen_partition_count ~ "\n*Connectors Affected:* `" ~ (outputs.triage_mm2_replication.vars.stalled_connectors | toJson) ~ "`\n*Execution:* `" ~ execution.id ~ "`"
              }
            ]
          } | toJson }}

      - id: evaluate_live_mutation
        type: io.kestra.plugin.core.flow.If
        description: Determines whether live task restarts should be executed or bypassed in dry-run mode.
        condition: "{{ inputs.auto_remediate == true and inputs.dry_run == false }}"
        then:
          - id: evaluate_approval_requirement
            type: io.kestra.plugin.core.flow.If
            description: Checks if manual operator confirmation is mandated prior to recycling worker tasks.
            condition: "{{ inputs.require_human_approval == true }}"
            then:
              - id: pause_for_operator_approval
                type: io.kestra.plugin.core.flow.Pause
                description: Pauses workflow execution for SRE confirmation before applying task restarts.

          - id: restart_stalled_connectors
            type: io.kestra.plugin.core.flow.Loop
            description: Iterates through each stalled connector to restart failed tasks and resume paused workers.
            values: "{{ outputs.triage_mm2_replication.vars.stalled_connectors }}"
            tasks:
              - id: restart_failed_tasks
                type: io.kestra.plugin.kafka.ConnectorRestart
                description: Invokes Kafka Connect REST API to restart only failed worker tasks on the target connector.
                connectUrl: "{{ inputs.connect_url }}"
                connectorName: "{{ item.value }}"
                includeTasks: true
                onlyFailed: true
                username: "{{ secret('CONNECT_BASIC_AUTH_USERNAME') }}"
                password: "{{ secret('CONNECT_BASIC_AUTH_PASSWORD') }}"

              - id: resume_connector
                type: io.kestra.plugin.kafka.ConnectorResume
                description: Resumes the connector instance if it was placed into an administrative paused state.
                connectUrl: "{{ inputs.connect_url }}"
                connectorName: "{{ item.value }}"
                username: "{{ secret('CONNECT_BASIC_AUTH_USERNAME') }}"
                password: "{{ secret('CONNECT_BASIC_AUTH_PASSWORD') }}"

          - id: emit_heartbeat_canary
            type: io.kestra.plugin.kafka.Produce
            description: Publishes an audit canary record to the source heartbeat topic to stimulate replication flow.
            properties:
              bootstrap.servers: "{{ inputs.source_bootstrap_servers }}"
              security.protocol: "PLAINTEXT"
            topic: "{{ inputs.heartbeat_topic }}"
            from:
              key: "kestra-mm2-resync-guard"
              value: "{{ {'audit_timestamp': now(), 'execution_id': execution.id, 'action': 'RESTART_RECOVERY'} | toJson }}"

          - id: verify_source_connector_recovery
            type: io.kestra.plugin.kafka.ConnectorGetStatus
            description: Re-queries source connector post-remediation to verify recovery to RUNNING state.
            connectUrl: "{{ inputs.connect_url }}"
            connectorName: "{{ inputs.source_cluster_alias }}->{{ inputs.target_cluster_alias }}.MirrorSourceConnector"
            username: "{{ secret('CONNECT_BASIC_AUTH_USERNAME') }}"
            password: "{{ secret('CONNECT_BASIC_AUTH_PASSWORD') }}"

          - id: verify_checkpoint_connector_recovery
            type: io.kestra.plugin.kafka.ConnectorGetStatus
            description: Re-queries checkpoint connector post-remediation to assert task recovery.
            connectUrl: "{{ inputs.connect_url }}"
            connectorName: "{{ inputs.source_cluster_alias }}->{{ inputs.target_cluster_alias }}.MirrorCheckpointConnector"
            username: "{{ secret('CONNECT_BASIC_AUTH_USERNAME') }}"
            password: "{{ secret('CONNECT_BASIC_AUTH_PASSWORD') }}"

          - id: assert_connectors_running
            type: io.kestra.plugin.core.execution.Assert
            description: Asserts that all MirrorMaker 2 connectors returned to RUNNING state following restart.
            conditions:
              - "{{ outputs.verify_source_connector_recovery.connectorState == 'RUNNING' }}"
              - "{{ outputs.verify_checkpoint_connector_recovery.connectorState == 'RUNNING' }}"
            errorMessage: "MirrorMaker 2 connectors failed to reach RUNNING state after restart cycle."

          - id: record_recovery_telemetry
            type: io.kestra.plugin.core.kv.Set
            description: Persists recovery completion manifest in Kestra KV store for audit tracking.
            key: "kafka_mm2_audit_{{ inputs.source_cluster_alias }}_{{ inputs.target_cluster_alias }}"
            value: "{{ {'remediation_execution': execution.id, 'recovered_connectors': outputs.triage_mm2_replication.vars.stalled_connectors, 'timestamp': now()} | toJson }}"

          - id: notify_slack_recovery
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Dispatches recovery success confirmation to Slack.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: >-
              {{ {
                "attachments": [
                  {
                    "color": "good",
                    "title": ":white_check_mark: Kafka MirrorMaker 2 Connectors Successfully Recovered",
                    "text": "Restart cycle completed for `" ~ inputs.source_cluster_alias ~ "->" ~ inputs.target_cluster_alias ~ "`.\n*Recovered Connectors:* `" ~ (outputs.triage_mm2_replication.vars.stalled_connectors | toJson) ~ "`\n*Verified States:* `MirrorSourceConnector: RUNNING`, `MirrorCheckpointConnector: RUNNING`.\n*Execution ID:* `" ~ execution.id ~ "`"
                  }
                ]
              } | toJson }}
        else:
          - id: log_dry_run_simulation
            type: io.kestra.plugin.core.log.Log
            description: Logs planned remediation actions when running in simulated dry-run mode.
            message: "DRY-RUN SIMULATION: Stalled connectors detected: {{ outputs.triage_mm2_replication.vars.stalled_connectors | toJson }}. Live restarts skipped because dry_run=true or auto_remediate=false."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Records final diagnostic telemetry summary for the execution.
    message: "Completed MirrorMaker 2 audit for {{ inputs.source_cluster_alias }}->{{ inputs.target_cluster_alias }}. Overall Status: {{ outputs.triage_mm2_replication.vars.status }} | Failed Tasks: {{ outputs.triage_mm2_replication.vars.failed_task_count }} | Frozen Partitions: {{ outputs.triage_mm2_replication.vars.frozen_partition_count }}."

errors:
  - id: alert_on_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on-call engineering if an unhandled failure halts workflow execution.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {
        "attachments": [
          {
            "color": "danger",
            "title": ":fire: MirrorMaker 2 Replication Guard Execution Crash",
            "text": "Workflow `kafka-mirrormaker2-replication-stall-and-checkpoint-resync-guard` crashed during execution `" ~ execution.id ~ "`. Check Kafka Connect API reachability or broker connectivity."
          }
        ]
      } | toJson }}

extend:
  title: Kafka MirrorMaker 2 Cross-Cluster Replication Stall & Checkpoint Resync Guard
  metaTitle: Kafka MirrorMaker 2 Replication Stall & Checkpoint Resync Guard | Kestra
  shortDescription: Audit Kafka MirrorMaker 2 cross-cluster replication flows, detect frozen consumer group checkpoints and failed tasks, execute safe guarded restarts, and verify lag recovery.
  metaDescription: Audit Kafka MirrorMaker 2 cross-cluster replication flows, detect failed tasks and frozen consumer checkpoints, execute guarded restarts, and verify resync.
  description: |
    Apache Kafka MirrorMaker 2 (MM2) provides cross-cluster topic replication, consumer offset synchronization, and cluster disaster-recovery mirroring for mission-critical streaming architectures. MM2 executes as distributed tasks across three specialized Kafka Connect connectors: `MirrorSourceConnector` for data records, `MirrorCheckpointConnector` for consumer group offset translation, and `MirrorHeartbeatConnector` for inter-cluster latency tracking.

    In production environments, transient broker rebalances, network partitions, deserialization errors, or target broker quota limits can cause individual connector tasks to crash or enter `FAILED` status. Because Kafka Connect does not automatically restart failed tasks by default, replication for affected partitions halts silently while the parent connector continues reporting `RUNNING`. Furthermore, if `MirrorCheckpointConnector` tasks stall, translated consumer offsets freeze, resulting in disastrous consumer lag spikes or massive duplicate re-processing loops during regional disaster recovery cutovers.

    This blueprint implements an automated Day 2 operational guard that continuously monitors MirrorMaker 2 connector tasks, tracks differential consumer group offset progression across clusters using Kestra KV store history, isolates failed tasks and stalled checkpoint partitions, executes guarded automated task restarts behind human approval gates, emits heartbeat canary probes, and verifies post-remediation offset recovery.

    ## How it works

    1. The `fetch_source_connector_status`, `fetch_checkpoint_connector_status`, and `fetch_heartbeat_connector_status` tasks query the Kafka Connect REST API via `io.kestra.plugin.kafka.ConnectorGetStatus` to inspect connector states, assigned worker IDs, task counts, and individual task execution states (`RUNNING`, `PAUSED`, `FAILED`).
    2. The `fetch_source_consumer_groups` and `fetch_target_consumer_groups` tasks query the primary and DR clusters using `io.kestra.plugin.kafka.ConsumerGroupDescribe` to retrieve real-time partition high watermarks and translated committed offsets for monitored consumer groups.
    3. The `get_previous_replication_state` task retrieves previous offset progression baselines and stationary freeze counters from the Kestra Key-Value store under key `kafka_mm2_tracker_{source}_{target}`.
    4. The `triage_mm2_replication` task (`io.kestra.plugin.scripts.python.Script`) inspects the diagnostic payloads:
       - Identifies any tasks in `FAILED` or `UNASSIGNED` status and extracts their worker IDs and error traces.
       - Diffs target committed offsets against historical snapshots: when source topic partitions continue to receive new records (`source_endOffset > previous_endOffset`) but target committed offsets remain completely stationary while exceeding `max_checkpoint_lag_records`, a replication freeze is diagnosed.
       - Compiles a structured remediation plan (`remediation_plan.json`), classifies cluster health into `HEALTHY`, `WARNING_CHECKPOINT_STALLED`, or `CRITICAL_TASK_FAILED`, and emits state updates.
    5. The `persist_replication_state` task (`io.kestra.plugin.core.kv.Set`) stores the updated offset baseline and freeze counters back into Kestra KV.
    6. When remediation is required, `dispatch_slack_incident` sends an actionable triage notification to Slack detailing stalled connectors and affected partition counts.
    7. In live mode (`auto_remediate: true` and `dry_run: false`), if `require_human_approval` is enabled, `pause_for_operator_approval` (`io.kestra.plugin.core.flow.Pause`) halts execution for SRE confirmation.
    8. Upon approval, `restart_stalled_connectors` (`io.kestra.plugin.core.flow.Loop`) triggers `io.kestra.plugin.kafka.ConnectorRestart` with `onlyFailed: true` to recycle wedged worker tasks, resumes any paused connectors, and emits an audit canary record to the source heartbeat topic via `io.kestra.plugin.kafka.Produce`.
    9. Verification tasks re-query connector statuses and assert that all connectors returned to `RUNNING` state, logging audit records to Kestra KV and confirming recovery on Slack.

    ## What you get

    - Automated detection of silent MirrorMaker 2 task failures and consumer offset checkpoint stalls.
    - Historical trend analysis in Kestra KV store distinguishing genuine replication freezes from idle consumer topics.
    - Guarded task restarts restricted to failed worker threads (`onlyFailed: true`) without terminating healthy replication pipelines.
    - Operator approval gates and dry-run verification modes preventing unintended production disruptions.
    - End-to-end post-remediation assertions confirming that connectors and tasks successfully resumed active replication.
    - Complete recovery audit records stored in Kestra namespace KV store for disaster recovery compliance.

    ## Who it's for

    - Streaming Platform Engineers operating multi-region or hybrid-cloud Apache Kafka architectures.
    - Site Reliability Engineers (SREs) responsible for cross-cluster disaster recovery readiness and RPO/RTO SLAs.
    - Data Engineers managing real-time active-passive event replication pipelines across Kafka clusters.

    ## Why orchestrate this with Kestra

    MirrorMaker 2 operates as a set of decoupled Kafka Connect connectors across clusters. When individual worker tasks crash, Kafka Connect exposes no native alerting, self-healing, or cross-run trend analysis. Writing custom shell scripts or ad-hoc cron jobs creates brittle single points of failure without state persistence, approval mechanisms, or unified secrets management.

    Orchestrating this guard with Kestra delivers a declarative workflow with native Kafka Connect and AdminClient plugin tasks, atomic state tracking in Kestra KV store, built-in pause-and-resume approval gates, secure credential encryption, and real-time multi-channel incident notifications.

    ## Prerequisites

    - Reachable Kafka Connect distributed cluster hosting the MirrorMaker 2 connectors (`MirrorSourceConnector`, `MirrorCheckpointConnector`, `MirrorHeartbeatConnector`).
    - Primary (source) and secondary (target) Apache Kafka clusters (v2.4+ or v3.x) accessible over plaintext or SASL/SSL.
    - Administrative user credentials for Kafka Connect basic authentication if secured.
    - A Slack Incoming Webhook URL for incident and recovery notifications.

    ### Secrets

    - `CONNECT_BASIC_AUTH_USERNAME`: Username for authenticating to the Kafka Connect REST API.
    - `CONNECT_BASIC_AUTH_PASSWORD`: Password for authenticating to the Kafka Connect REST API.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for incident alerts and recovery summaries.

    ## Quick start

    1. Configure `CONNECT_BASIC_AUTH_USERNAME`, `CONNECT_BASIC_AUTH_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint and set `connect_url`, `source_bootstrap_servers`, and `target_bootstrap_servers` to match your Kafka environment.
    3. Specify your cluster aliases in `source_cluster_alias` and `target_cluster_alias` (e.g. `primary` and `backup`).
    4. Run a manual execution with default parameters (`dry_run: true`) to record an initial offset baseline and review diagnostic reports.
    5. Enable the `periodic_mm2_guard` schedule trigger to monitor cross-cluster replication health continuously every 15 minutes.

    ## How to extend

    - **Lag-Driven Worker Auto-Scaling**: Add an `io.kestra.plugin.kubernetes.kubectl.Patch` task to dynamically scale Kafka Connect worker pod replicas when aggregate replication lag surges.
    - **PagerDuty Critical Escalation**: Integrate `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for high-severity on-call alerts when checkpoint freezes exceed consecutive retry thresholds.
    - **Dead-Letter Resync Trigger**: Link this workflow with a downstream dead-letter queue processor if poison pill records in source topics cause persistent task deserialization crashes.

