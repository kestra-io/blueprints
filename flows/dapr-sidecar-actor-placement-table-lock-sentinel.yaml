id: dapr-sidecar-actor-placement-table-lock-sentinel
namespace: company.team

description: |
  Audits Dapr actor placement service telemetry to detect table dissemination lock stalls, sidecar rebalance thrashing, and actor invocation failures.

concurrency:
  limit: 1

inputs:
  - id: dapr_placement_metrics_url
    type: STRING
    displayName: "Dapr Placement Metrics URL"
    defaults: "http://dapr-placement-server.dapr-system.svc.cluster.local:9090"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the Dapr virtual actor placement controller service."

  - id: actor_type
    type: STRING
    displayName: "Target Actor Type"
    defaults: "VirtualCartActor"
    description: "Name of the target Dapr virtual actor class and stateful placement table under active runtime surveillance."

  - id: max_lock_duration_ms
    type: INT
    displayName: "Max Lock Duration (ms)"
    defaults: 1500
    description: "Maximum allowable placement table write lock duration in milliseconds before alerting on dissemination stall."

  - id: max_invocation_failures_threshold
    type: INT
    displayName: "Max Invocation Failures Threshold"
    defaults: 3
    description: "Maximum allowable actor method invocation or routing failures across sidecar instances."

  - id: alert_on_rebalance_surge
    type: BOOL
    displayName: "Alert on Rebalance Surge"
    defaults: true
    description: "Toggle whether actor placement table rebalance churn exceeding safe limits triggers an immediate incident alert."

tasks:
  - id: scan_dapr_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Dapr placement Prometheus metrics to audit placement lock durations, actor rebalance counts, and sidecar host connections.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.dapr_placement_metrics_url }}"
      ACTOR_TYPE: "{{ inputs.actor_type }}"
      MAX_LOCK_MS: "{{ inputs.max_lock_duration_ms }}"
      MAX_FAILURES: "{{ inputs.max_invocation_failures_threshold }}"
      ALERT_REBALANCE: "{{ inputs.alert_on_rebalance_surge }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      actor_type = os.environ.get("ACTOR_TYPE", "VirtualCartActor")
      max_lock_ms = int(os.environ.get("MAX_LOCK_MS", "1500"))
      max_failures = int(os.environ.get("MAX_FAILURES", "3"))
      alert_rebalance = os.environ.get("ALERT_REBALANCE", "true").lower() == "true"

      lock_duration_ms = 0
      rebalance_events_total = 0
      invocation_failures_total = 0
      connected_hosts_count = 0
      degraded_actors = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=15)
          resp.raise_for_status()
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "dapr_placement_table_lock_duration_seconds" in line:
                  lock_duration_ms = max(lock_duration_ms, int(val * 1000))
                  if lock_duration_ms > max_lock_ms:
                      degraded_actors.append(actor_type)
              elif "dapr_actor_placement_rebalance_total" in line:
                  rebalance_events_total += int(val)
              elif "dapr_actor_invocation_failure_total" in line:
                  invocation_failures_total += int(val)
              elif "dapr_sidecar_connected_hosts_total" in line:
                  connected_hosts_count = max(connected_hosts_count, int(val))
      except Exception as err:
          sys.stderr.write(f"Failed to scrape Dapr metrics: {err}\n")
          sys.exit(1)

      is_breached = bool(
          (lock_duration_ms > max_lock_ms) or
          (invocation_failures_total > max_failures) or
          (alert_rebalance and rebalance_events_total > 5)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Dapr actor '{actor_type}' audit: {lock_duration_ms}ms lock duration, "
          f"{rebalance_events_total} rebalances, {invocation_failures_total} invocation failures, "
          f"{connected_hosts_count} connected sidecars."
      )
      print(f"Dapr Complete: {summary}")

      Kestra.outputs({
          "lock_duration_ms": lock_duration_ms,
          "rebalance_events_total": rebalance_events_total,
          "invocation_failures_total": invocation_failures_total,
          "connected_hosts_count": connected_hosts_count,
          "degraded_actors": list(set(degraded_actors)),
          "is_alerting": is_breached,
          "actor_type": actor_type,
          "audit_timestamp": now_iso
      })

  - id: evaluate_dapr_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Dapr actor placement lock durations, rebalance churn, or invocation failures breach thresholds.
    condition: "{{ outputs.scan_dapr_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_runtime_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Distributed Runtime Slack channel detailing Dapr actor table lock stall.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#dapr-runtime-alerts",
            "text": "CRITICAL: Dapr Actor Placement Table Degradation for Actor `{{ inputs.actor_type }}`. Lock Duration: `{{ outputs.scan_dapr_telemetry.vars.lock_duration_ms }}`ms (max allowable: `{{ inputs.max_lock_duration_ms }}`ms). Rebalance Churn: `{{ outputs.scan_dapr_telemetry.vars.rebalance_events_total }}`. Invocation Failures: `{{ outputs.scan_dapr_telemetry.vars.invocation_failures_total }}` (threshold: `{{ inputs.max_invocation_failures_threshold }}`). Audit Timestamp: `{{ outputs.scan_dapr_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_dapr_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Dapr placement service synchronizes virtual actor routing tables across sidecars cleanly.
        message: "Dapr operating nominally: {{ outputs.scan_dapr_telemetry.vars.lock_duration_ms }}ms lock latency, {{ outputs.scan_dapr_telemetry.vars.connected_hosts_count }} connected hosts, zero invocation faults."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for distributed actor runtime governance and microservice mesh compliance records.
    format: |
      {
        "status": "{{ outputs.scan_dapr_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "actor_type": "{{ inputs.actor_type }}",
        "lock_duration_ms": {{ outputs.scan_dapr_telemetry.vars.lock_duration_ms }},
        "rebalance_events": {{ outputs.scan_dapr_telemetry.vars.rebalance_events_total }},
        "invocation_failures": {{ outputs.scan_dapr_telemetry.vars.invocation_failures_total }},
        "connected_hosts": {{ outputs.scan_dapr_telemetry.vars.connected_hosts_count }},
        "audit_timestamp": "{{ outputs.scan_dapr_telemetry.vars.audit_timestamp }}"
      }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#dapr-runtime-alerts",
        "text": ":warning: *Dapr Sentinel Failure*: Failed to query placement metrics from `{{ inputs.dapr_placement_metrics_url }}`."
      }

triggers:
  - id: periodic_dapr_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Dapr Sidecar Actor Placement Table Lock Sentinel"
  metaTitle: "Dapr Placement Sentinel Blueprint"
  shortDescription: "Audits Dapr actor placement service telemetry for table dissemination lock stalls, rebalance thrashing, and failures."
  metaDescription: "Audits Dapr placement service metrics to detect actor table lock stalls, sidecar rebalance thrashing, and method invocation errors."
  description: |
    Automates continuous health and virtual actor placement stability surveillance for Dapr distributed application runtimes.

    ## How it works
    1. A schedule trigger executes the Dapr actor placement health audit workflow every 15 minutes.
    2. The Python task queries the Dapr placement service Prometheus metrics endpoint on port 9090.
    3. The script extracts placement table lock durations, actor rebalance event totals, and method invocation failures.
    4. An evaluation gate determines whether dissemination lock durations, rebalance churn, or invocation errors exceed limits.
    5. When virtual actor runtime degradation is detected, a high-priority Slack incident alert is dispatched to Runtime SREs.
    6. When Dapr sidecars maintain synchronized hash rings without lock contention or rebalance storms, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for distributed runtime governance and actor mesh compliance archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Dapr Metrics]
        ScanMetrics --> EvalBreach{Lock > 1500ms OR Failures > 3 OR Rebalance > 5?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Runtime Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Dapr State]
        SlackAlert --> EmitManifest[Debug Return: Dapr Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Dapr placement service Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether placement table write locks or actor invocation error totals exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with actor type and lock latency metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing distributed actor runtime health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Dapr placement server Raft quorums, virtual actor type registrations, and sidecars.
    - Early warning detection for consistent hashing dissemination delays during horizontal microservice auto-scaling.
    - Automated tracking of actor rebalancing storms that cause stateful method calls to return HTTP 500 errors.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into Dapr virtual actor placement efficiency and sidecar mesh connectivity.
    - Proactive alerts preventing stateful actor lockouts and distributed transaction timeouts.
    - Standardized audit manifests containing exact lock durations, host counts, and execution timestamps.
    - Zero-overhead deployment compatible with Dapr on Kubernetes and standalone sidecar clusters.

    ## Who it's for
    - Microservice and distributed systems architects building stateful applications with the virtual actor pattern.
    - Site Reliability Engineers ensuring uninterrupted service-to-service communication via Dapr sidecars.
    - Cloud platform teams operating shared Dapr control planes across enterprise Kubernetes clusters.
    - DevOps engineers diagnosing distributed lock contention and hash ring convergence latency.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages distributed runtime surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical actor placement metrics in searchable Kestra execution logs.

    ## Use cases
    - **Actor Ring Rebalance Storm Alarm**: Detects when rapid pod churn triggers endless placement table recalculations.
    - **Raft Placement Split-Brain Detection**: Identifies when placement server replicas lose consensus leadership.
    - **Sidecar Heartbeat Timeout Surveillance**: Pinpoints network drops between application pods and placement servers.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `dapr_placement_metrics_url` | STRING | `http://dapr-placement-server.dapr-system.svc.cluster.local:9090` | Internal HTTP URL exposing Prometheus metrics for Dapr placement. |
    | `actor_type` | STRING | `VirtualCartActor` | Name of the target Dapr virtual actor class monitored. |
    | `max_lock_duration_ms` | INT | `1500` | Maximum allowable placement table write lock duration in milliseconds. |
    | `max_invocation_failures_threshold` | INT | `3` | Maximum allowable actor method invocation failures before alerting. |
    | `alert_on_rebalance_surge` | BOOL | `true` | Toggle whether excessive actor rebalance churn triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_dapr_telemetry.vars.lock_duration_ms }}`: Maximum observed placement table write lock duration.
    - `{{ outputs.scan_dapr_telemetry.vars.rebalance_events_total }}`: Total count of actor hash ring rebalance events.
    - `{{ outputs.scan_dapr_telemetry.vars.invocation_failures_total }}`: Total count of failed actor method invocations.
    - `{{ outputs.scan_dapr_telemetry.vars.is_alerting }}`: Boolean flag indicating if Dapr runtime health bounds are breached.
    - `{{ outputs.scan_dapr_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the Dapr audit run.

    ## Prerequisites
    - Dapr control plane deployed on Kubernetes with Prometheus metrics enabled on port 9090.
    - Network connectivity from the Kestra worker to the `dapr-placement-server` metrics service.
    - Configured Slack incoming webhook URL with permissions to post in distributed runtime alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing runtime alerts to the Distributed Runtime Slack channel.

    ## Quick start
    1. Verify that Dapr placement server exposes Prometheus metrics on HTTP port 9090.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your actor type identifier in `actor_type`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_dapr_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Placement Server Replication**: Ensure at least 3 placement replicas are running to prevent quorum loss.
    - **Actor State Store Contention**: Actor lock spikes can trace back to high latency on the underlying Redis/CosmosDB store.
    - **mTLS Sidecar Certificate Expiry**: Verify that the Dapr Sentry service issues valid mTLS certs to sidecars.
    - **Actor Idle Timeout**: Misconfigured `actorIdleTimeout` causes premature actor garbage collection and thrashing.

    ## How to extend
    - **Automated Placement Reseed**: Trigger a restart of placement server followers if Raft consensus latency climbs.
    - **PagerDuty Escalation**: Escalate to on-call platform engineers if actor invocation failures exceed 10 across 2 runs.
    - **Multi-Actor Fleet Sweep**: Expand script parameters to monitor all declared virtual actor types across namespaces.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Dapr Official Documentation](https://dapr.io/)
    - [Dapr Virtual Actors Architecture and Placement Service](https://docs.dapr.io/developing-applications/building-blocks/actors/actors-overview/)
    - [Dapr Observability and Prometheus Metrics Reference](https://docs.dapr.io/operations/monitoring/metrics/prometheus/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
