id: docker-exited-container-reaper-guard
namespace: company.team

description: |
  Reap the terminal containers a CI runner or build host leaves behind. Only containers carrying
  a label you set yourself are read, only those in a terminal state (exited, created, dead) past
  an age threshold and absent from a protect-list become targets. Each one is removed with its
  anonymous volumes and never with --force, so a container that started running in the
  meantime is refused rather than killed. The host is then listed again. The run fails if any targeted
  container survived.

inputs:
  - id: docker_host
    type: STRING
    displayName: Docker host
    description: TCP endpoint of the daemon to clean, for example tcp://build-01:2375. TCP is required because the container list is read from the Engine API, which a unix socket does not expose to the worker.
    defaults: "tcp://docker-host:2375"

  - id: label_selector
    type: STRING
    displayName: Label selector
    description: Only containers carrying this label are read, in key=value form. Nothing outside the selector is ever inspected or removed, so a container the flow does not own cannot be a target.
    defaults: "kestra.reap=true"

  - id: target_states
    type: MULTISELECT
    displayName: Terminal states to reap
    description: Container states treated as terminal. Running and paused containers are never in this list.
    values:
      - exited
      - created
      - dead
    defaults:
      - exited
      - created
      - dead

  - id: protected_name_pattern
    type: STRING
    displayName: Protected name pattern
    description: A container whose name matches this regular expression is never removed, even when it carries the label and is old. The protect-list wins over every other rule.
    defaults: "^(prod|db|state|kestra)([-_.].*)?$"

  - id: min_age_minutes
    type: INT
    displayName: Minimum age in minutes
    description: A container is a target only when it stopped (or was created, for a never-started one) longer ago than this. Protects the container a build exited two minutes ago.
    defaults: 1440

  - id: max_removals
    type: INT
    displayName: Removal ceiling
    description: At most this many containers are removed in one run. The rest are reported and left for the next run, so a wrong selector cannot empty a host in one go.
    defaults: 25

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: When false the flow only reports. Must be true, together with dry_run false and the approval, for anything to be removed.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: When true the plan is only logged. Must be false, together with auto_remediate, for anything to be removed.
    defaults: true

variables:
  api: "{{ inputs.docker_host | replace({'tcp://': 'http://'}) }}"

tasks:
  - id: list_terminal
    type: io.kestra.plugin.core.http.Request
    description: Read-only. Asks the Engine API for containers carrying the label selector and sitting in one of the terminal states. A container outside the selector is never returned, so it cannot be seen or touched.
    uri: "{{ render(vars.api) }}/containers/json"
    method: GET
    params:
      all: "true"
      filters: "{{ {'label': [inputs.label_selector], 'status': inputs.target_states} | toJson }}"

  - id: candidates
    type: io.kestra.plugin.core.output.OutputValues
    description: The candidate ids. The list endpoint carries no stop time, which is why each one is inspected next.
    values:
      ids: >-
        {{ ({'c': fromJson(outputs.list_terminal.body)} | toJson) | jq('
           [.c[] | {id: .Id, name: (.Names[0] | ltrimstr("/"))}] | sort_by(.name)') | first | toJson }}

  - id: inspect_each
    type: io.kestra.plugin.core.flow.Loop
    description: One read-only inspect per candidate. The stop time, the exit code and the anonymous volumes exist only here.
    values: "{{ outputs.candidates.values.ids }}"
    concurrencyLimit: 4
    outputs:
      - id: state
        type: STRING
        value: >-
          {{ outputs.inspect.body | jq('{id: .Id, name: (.Name | ltrimstr("/")), image: .Config.Image,
             state: .State.Status, running: .State.Running, exit_code: .State.ExitCode,
             finished_at: (.State.FinishedAt // ""), created: (.Created // ""),
             volumes: [.Mounts[]? | select(.Type == "volume" and ((.Name // "") | test("^[0-9a-f]{64}$"))) | .Name]}') | first | toJson }}
    tasks:
      - id: inspect
        type: io.kestra.plugin.core.http.Request
        uri: "{{ render(vars.api) }}/containers/{{ fromJson(item.value).id }}/json"
        method: GET

  - id: window
    type: io.kestra.plugin.core.output.OutputValues
    description: The instant a container must have stopped before to count as old. Frozen once, so detection and verification share one cutoff.
    values:
      cutoff: >-
        {{ now(timeZone='UTC') | dateAdd(-1 * inputs.min_age_minutes, 'MINUTES') | date("yyyy-MM-dd'T'HH:mm:ss", 'UTC') }}

  - id: assess
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      One row per candidate with its verdict. A never-started container has no stop time, so its
      creation time is used instead. The protect-list and the removal ceiling both win over REAP.
    values:
      rows: >-
        {{ ({'rows': ((outputs.inspect_each.outputs ?? []) | jq('map(.outputs.state | fromjson)') | first),
            'cut': outputs.window.values.cutoff, 're': inputs.protected_name_pattern, 'cap': inputs.max_removals} | toJson) | jq('
           .cut as $cut | .re as $re | .cap as $cap
           | [.rows[] | . + {ref: (if ((.finished_at // "") | startswith("0001")) then (.created // "") else (.finished_at // "") end)}]
           | map(. + {old: ((.ref[0:19]) < $cut),
                      decision: (if .running then "KEEP_RUNNING"
                        elif (.name | test($re)) then "KEEP_PROTECTED"
                        elif ((.ref[0:19]) < $cut | not) then "KEEP_FRESH"
                        else "REAP" end)})
           | sort_by(.ref)
           | ([.[] | select(.decision == "REAP")] | to_entries
              | map(.value + {decision: (if .key < $cap then "REAP" else "KEEP_OVER_CAP" end)})) as $reap
           | ([.[] | select(.decision != "REAP")] + $reap) | sort_by(.decision, .name)') | first | toJson }}
      targets: >-
        {{ ({'rows': ((outputs.inspect_each.outputs ?? []) | jq('map(.outputs.state | fromjson)') | first),
            'cut': outputs.window.values.cutoff, 're': inputs.protected_name_pattern, 'cap': inputs.max_removals} | toJson) | jq('
           .cut as $cut | .re as $re | .cap as $cap
           | [.rows[] | . + {ref: (if ((.finished_at // "") | startswith("0001")) then (.created // "") else (.finished_at // "") end)}]
           | [.[] | select((.running | not) and ((.name | test($re)) | not) and ((.ref[0:19]) < $cut))]
           | sort_by(.ref) | .[0:$cap]
           | map({id: .id, name: .name, state: .state, ref: .ref, volumes: .volumes})') | first | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Terminal container reaper on {{ inputs.docker_host }}, label {{ inputs.label_selector }}:
      {{ fromJson(outputs.assess.values.rows) | length }} candidates,
      {{ fromJson(outputs.assess.values.targets) | length }} to reap, cutoff {{ outputs.window.values.cutoff }}Z.
      {{ fromJson(outputs.assess.values.rows) | jq('group_by(.decision) | map("\(.[0].decision) \(length)") | join(", ")') | first }}.
      Targets: {{ fromJson(outputs.assess.values.targets) | jq('if length == 0 then "none" else map("\(.name) \(.state) since \(.ref)") | join("; ") end') | first }}.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.assess.values.targets) | length > 0 }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Docker terminal container reaper on ' ~ inputs.docker_host ~ ': ' ~ (fromJson(outputs.assess.values.targets) | length) ~ ' of ' ~ (fromJson(outputs.assess.values.rows) | length) ~ ' labelled candidates are terminal and older than ' ~ inputs.min_age_minutes ~ ' minutes (' ~ (fromJson(outputs.assess.values.targets) | jq('map("\(.name) \(.state)") | join(", ")') | first) ~ '). ' ~ (inputs.auto_remediate and not inputs.dry_run ? 'Removal waits for approval on this execution.' : 'Nothing removed (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        description: A container is removed only when auto_remediate is true, dry_run is false and the pause below is approved.
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: hold
            type: io.kestra.plugin.core.flow.Pause
            description: Removing a container destroys its writable layer and its anonymous volumes. Read the plan in the summary above, then resume with approved true.
            onResume:
              - id: approved
                type: BOOL
                required: false
                description: Set true to remove the listed containers. Anything else leaves the host untouched.

          - id: approval_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.hold.onResume.approved ?? false }}"
            then:
              - id: remediate_reap
                type: io.kestra.plugin.core.flow.Loop
                description: One docker rm per target, with its anonymous volumes, never forced. Sequential so a failure is attributable to one container.
                values: "{{ outputs.assess.values.targets }}"
                concurrencyLimit: 1
                tasks:
                  - id: reap_one
                    type: io.kestra.plugin.docker.cli.Rm
                    description: force is false on purpose. A container that started running between detection and here is refused, not killed.
                    allowFailure: true
                    host: "{{ inputs.docker_host }}"
                    containerIds:
                      - "{{ fromJson(item.value).id }}"
                    removeVolumes: true
                    force: false

              - id: relist
                type: io.kestra.plugin.core.http.Request
                description: Every container carrying the label, in any state. The state filter is deliberately dropped here, so a target that started running still shows up as present instead of reading as removed.
                uri: "{{ render(vars.api) }}/containers/json"
                method: GET
                params:
                  all: "true"
                  filters: "{{ {'label': [inputs.label_selector]} | toJson }}"

              - id: result
                type: io.kestra.plugin.core.output.OutputValues
                description: Compare the plan with the host as it is now. A target still present was not removed. A container the plan kept must still be there.
                values:
                  r: >-
                    {{ ({'targets': fromJson(outputs.assess.values.targets),
                        'kept': (fromJson(outputs.assess.values.rows) | jq('[.[] | select(.decision != "REAP")]') | first),
                        'after': fromJson(outputs.relist.body)} | toJson) | jq('
                       ([.after[] | .Id]) as $a
                       | {removed: [.targets[] | select(([.id] - $a) | length > 0)],
                          survivors: [.targets[] | select(([.id] - $a) | length == 0)],
                          kept_missing: [.kept[] | select((([.id] - $a) | length > 0) and (.running | not))],
                          after_count: ($a | length)}') | first | toJson }}

              - id: verify
                type: io.kestra.plugin.core.flow.If
                description: The run fails when a target survived or when a container the plan kept is gone. Reporting success without reading the host again is what this gate exists to prevent.
                condition: "{{ fromJson(outputs.result.values.r).survivors | length > 0 or fromJson(outputs.result.values.r).kept_missing | length > 0 }}"
                then:
                  - id: reap_incomplete
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      Reap did not land on {{ inputs.docker_host }}. Still present after removal:
                      {{ fromJson(outputs.result.values.r).survivors | jq('if length == 0 then "none" else map(.name) | join(", ") end') | first }}
                      (a container that started running again is refused by design, since force is false).
                      Gone but kept by the plan:
                      {{ fromJson(outputs.result.values.r).kept_missing | jq('if length == 0 then "none" else map(.name) | join(", ") end') | first }}.
                else:
                  - id: reaped
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Reaped {{ fromJson(outputs.result.values.r).removed | length }} containers on {{ inputs.docker_host }}
                      ({{ fromJson(outputs.result.values.r).removed | jq('if length == 0 then "none" else map("\(.name) \(.state)") | join(", ") end') | first }})
                      with {{ fromJson(outputs.result.values.r).removed | jq('[.[] | .volumes | length] | add // 0') | first }} anonymous volumes.
                      {{ fromJson(outputs.result.values.r).after_count }} labelled containers remain, every one the plan kept is still there.
            else:
              - id: approval_declined
                type: io.kestra.plugin.core.log.Log
                message: "Approval not granted on execution {{ execution.id }}. Nothing was removed on {{ inputs.docker_host }}."
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: >-
              Report only, nothing removed (auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }}).
              Run with auto_remediate true and dry_run false, then approve the pause, to remove
              {{ fromJson(outputs.assess.values.targets) | jq('map(.name) | join(", ")') | first }}.
    else:
      - id: nothing_to_reap
        type: io.kestra.plugin.core.log.Log
        message: >-
          No labelled container on {{ inputs.docker_host }} is terminal and older than {{ inputs.min_age_minutes }} minutes.
          {{ fromJson(outputs.assess.values.rows) | length }} candidates read, all kept.

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Docker terminal container reaper failed on ' ~ inputs.docker_host ~ ' (execution ' ~ execution.id ~ '). Either the daemon is unreachable or a targeted container survived the removal. Nothing was force removed. Check the execution logs.'} | toJson }}

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and in safe mode. Enabling it only reports until you change these inputs.
    cron: "20 3 * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: Reap Exited Docker Containers by Age and Label
  shortDescription: Remove exited, created and dead containers older than an age threshold on a Docker host, scoped to a label and a protect-list, with their anonymous volumes, never forced, then verify the host.
  metaTitle: Reap Exited Docker Containers by Age and Label with Kestra
  metaDescription: Remove terminal Docker containers past an age threshold, scoped by label and a protect-list, with their anonymous volumes, never forced, then verify.
  description: |
    Exited, created and dead containers pile up on CI runners and build hosts. Every one of them still pins its writable layer and its anonymous volumes, so the disk fills with the remains of builds that finished weeks ago. `docker system prune` frees it, but it is all-or-nothing and age-blind: it takes the container someone kept to read its logs, the one a job exited two minutes ago, the data volume nobody meant to lose. So teams either never run it or run it and lose something.

    This blueprint reaps by age inside a boundary you set. It reads only containers carrying a label you apply yourself, keeps anything matching a protect-list, keeps anything that stopped recently, caps how many go in one run, then removes the rest with their anonymous volumes and without `--force`. Then it lists the host again and fails the run if a target survived.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    Deleting containers is not reversible, so the blueprint is built so that it cannot reach anything but its own target:

    - **Label scoping.** The Engine API query filters on `label_selector`, so a container without that label is never even returned, let alone removed. The label is one you apply to the containers your builds create.
    - **A protect-list.** `protected_name_pattern` wins over every other rule. A container matching it is kept even when it carries the label and is old.
    - **`force: false`.** A running container is refused by the daemon rather than killed. This is what makes the gap between detection and removal safe: a container that started again in between stays up, so the verification step fails the run instead of reporting success.
    - **An age threshold.** Nothing that stopped inside `min_age_minutes` is a target.
    - **A removal ceiling.** `max_removals` bounds one run, so a selector that matches more than you expected cannot empty a host in one execution.
    - **Three gates before any write.** `auto_remediate` true, `dry_run` false, then an approved `Pause`. The shipped defaults and the disabled schedule are read-only.

    ## How it works

    1. `list_terminal` (`io.kestra.plugin.core.http.Request`, read-only) asks the Docker Engine API for containers matching `label_selector` and sitting in one of `target_states`. `candidates` keeps their ids and names.
    2. `inspect_each` (`io.kestra.plugin.core.flow.Loop`, read-only) inspects each candidate. The stop time, the exit code and the anonymous volume names are in the inspect payload only, not in the list.
    3. `window` freezes the age cutoff once, so detection and verification agree. `assess` gives every candidate a verdict:
       - `KEEP_RUNNING`: the daemon reports it running;
       - `KEEP_PROTECTED`: its name matches `protected_name_pattern`;
       - `KEEP_FRESH`: it stopped after the cutoff (a never-started container is dated by its creation time);
       - `KEEP_OVER_CAP`: eligible, but beyond `max_removals` for this run;
       - `REAP`: terminal, old, unprotected, inside the cap.

       `summary` logs the counts and every target.
    4. `route` stops with a log line when there is nothing to reap. Otherwise `findings_alert` posts the plan to Slack and `remediate_gate` checks `auto_remediate` and `dry_run`.
    5. `hold` (`io.kestra.plugin.core.flow.Pause`) waits for approval. `remediate_reap` (`Loop`, `concurrencyLimit: 1`) then runs one `io.kestra.plugin.docker.cli.Rm` per target with `removeVolumes: true` and `force: false`.
    6. `relist` reads every labelled container again, in any state. `result` compares the plan with the host. `verify` fails the run if a target is still present or if a container the plan kept has gone.
    7. `errors` alerts Slack when the flow fails, including when the verification gate fails.

    ## What you get

    - Age-based container reaping with a boundary, instead of an all-or-nothing prune.
    - Anonymous volumes removed with the container that owns them, so a reaped build leaves nothing behind.
    - A run that fails when the removal did not land, so a stuck host cannot read as a clean one.

    ## Who it's for

    - Teams running self-hosted CI runners (GitHub Actions, GitLab, Buildkite, Jenkins agents) whose disks fill with finished job containers.
    - Platform teams operating shared build hosts or Docker-based edge nodes.
    - Anyone who has lost a container to `docker system prune` and stopped running it since.

    ## Why orchestrate this with Kestra

    A cron job running `docker container prune --filter until=24h` cannot keep a protect-list, cannot stop at a ceiling, cannot ask for approval and cannot tell you what it removed. It also cannot check: if the removal is refused, the exit code is lost in a log nobody reads. Kestra reads the host, computes the plan, holds the change behind an approval, removes one container at a time so a failure is attributable, then reads the host again and fails the execution when the result does not match the plan. The execution history is the record of what was removed from which host and who approved it.

    ## Tested end to end

    On Kestra 2.0.5 OSS against an isolated Docker 27.5.1 daemon (Docker-in-Docker on its own network), with a local HTTP sink standing in for Slack. The daemon held six containers: `reap-me` (labelled, exited, with an anonymous volume), `created-only` (labelled, never started), `prod-ledger` (labelled, exited, matching the protect-list), `too-fresh` (labelled, exited seconds ago), `no-label` (exited, no label, with an anonymous volume), `keep-running` (labelled, running).

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults, `min_age_minutes: 1440` | 3 candidates read, 0 targets, everything inside the age window. Nothing removed |
    | 2 | `min_age_minutes: 2` | 4 candidates, 2 targets (`reap-me`, `created-only`). `too-fresh` kept as fresh, `prod-ledger` kept by the protect-list, `no-label` never returned by the query, `keep-running` never returned by the state filter |
    | 3 | run 2 plus `auto_remediate: true` | Same plan, nothing removed. The dry run blocks the change even with auto_remediate on |
    | 4 | run 3 plus `dry_run: false`, pause approved | Both targets removed with the one anonymous volume they owned. Verified with the daemon's own CLI: 6 containers before, 4 after, 2 anonymous volumes before, 1 after |
    | 5 | same, pause resumed with `approved: false` | Nothing removed |
    | 6 | same, pause resumed with no answer at all | Nothing removed, an unanswered pause does not read as approval |
    | 7 | same, but the target was started again during the pause | The daemon refused the removal with HTTP 409 because `force` is false, `verify` failed the run and `errors` posted to Slack |
    | 8 | `min_age_minutes: 0`, `max_removals: 1` | 2 eligible, 1 target, the other reported as `KEEP_OVER_CAP` |
    | 9 | unreachable daemon | `errors` alert sent |

    ## Prerequisites

    - A Docker daemon reachable over TCP from the Kestra worker. The container list comes from the Engine API, which the worker cannot read through a mounted unix socket.
    - A label on the containers you want reaped. Add `--label kestra.reap=true` to the `docker run` in your CI job or set it in the runner configuration, then point `label_selector` at it.
    - Local testing: `docker run -d --privileged --name dind -e DOCKER_TLS_CERTDIR= docker:27-dind --host=tcp://0.0.0.0:2375`, create a few labelled containers inside it, then set `docker_host` to `tcp://dind:2375`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: used by `findings_alert` and the `errors` block. In Kestra OSS, provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `docker_host` | `tcp://docker-host:2375` | Daemon to clean |
    | `label_selector` | `kestra.reap=true` | The only containers read |
    | `target_states` | `exited, created, dead` | States treated as terminal |
    | `protected_name_pattern` | `^(prod\|db\|state\|kestra)([-_.].*)?$` | Names never removed |
    | `min_age_minutes` | `1440` | How long a container must have been stopped |
    | `max_removals` | `25` | Ceiling for one run |
    | `auto_remediate` | `false` | Must be true to remove anything |
    | `dry_run` | `true` | Must be false to remove anything |

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Label the containers your CI creates, for example `docker run --label kestra.reap=true ...`.
    3. Import the flow, set `docker_host` and `label_selector`, run it with the defaults and read the plan.
    4. Run it with `auto_remediate: true` and `dry_run: false`, read the plan in the paused execution, then resume it with `approved: true`.
    5. Enable the `nightly` trigger once the plans look right. Change its inputs when you want it to act.

    ## How to extend

    - Loop over a list of build hosts to reap every runner in one execution.
    - Trigger the flow from a disk usage alert instead of a schedule, so it runs when the space is actually needed.
    - Add `io.kestra.plugin.docker.cli.Prune` with `VOLUMES` to also clear volumes whose container is already gone.
    - Keep the exit code in the decision, for example by keeping failed containers longer than successful ones so a developer can still read their logs.
    - Record the reaped ids in a KV store to report how much a runner churns per week.

    ## Links

    - Docker plugin: https://kestra.io/plugins/plugin-docker
    - Engine API container list and filters: https://docs.docker.com/reference/api/engine/version/v1.47/#tag/Container/operation/ContainerList
  tags:
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
  ee: false
  demo: false
