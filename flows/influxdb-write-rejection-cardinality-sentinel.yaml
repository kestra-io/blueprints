id: influxdb-write-rejection-cardinality-sentinel
namespace: company.timeseries

inputs:
  - id: influxdb_url
    type: STRING
    defaults: "http://influxdb.internal:8086"
    description: Base URL of the InfluxDB v2 server.
  - id: influx_org
    type: STRING
    description: Target InfluxDB organization name.
  - id: bucket_name
    type: STRING
    description: Target InfluxDB bucket to audit.

tasks:
  - id: inspect_storage_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query InfluxDB metrics endpoint for series cardinality and write drops
        curl -s -H "Authorization: Token {{ secret('INFLUXDB_TOKEN') }}" \
          "{{ inputs.influxdb_url }}/metrics" > /tmp/influx_metrics.txt

        python3 -c "
        import re
        try:
            with open('/tmp/influx_metrics.txt') as f:
                lines = f.readlines()
            write_errors = 0.0
            for line in lines:
                if 'storage_writer_err' in line or 'http_api_requests_total' in line and 'status=\"4' in line:
                    parts = line.strip().split()
                    if len(parts) >= 2 and parts[-1].replace('.', '').isdigit():
                        write_errors += float(parts[-1])
            is_breach = 1 if write_errors > 0 else 0
            print(f'{is_breach}|{int(write_errors)}')
        except Exception:
            print('0|0')
        " > /tmp/influx_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/influx_summary.txt)
        ERROR_COUNT=$(cut -d '|' -f 2 /tmp/influx_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=error_count::$ERROR_COUNT::"

  - id: evaluate_write_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_storage_metrics.vars.is_breach | int == 1 }}"
    then:
      - id: notify_timeseries_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#timeseries-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 InfluxDB Write Rejection & Series Limit Alert",
                "text": "InfluxDB instance at {{ inputs.influxdb_url }} has recorded {{ outputs.inspect_storage_metrics.vars.error_count }} storage write error(s). High series cardinality or write quota exceeded.",
                "footer": "Kestra Time-Series Sentinel • InfluxDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#timeseries-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ InfluxDB Sentinel Failure",
            "text": "Failed to query InfluxDB metrics at {{ inputs.influxdb_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: InfluxDB Write Rejection and Series Cardinality Sentinel
  shortDescription: Audits InfluxDB time-series storage metrics to detect write rejections and series cardinality explosion.
  description: |
    ## How it works
    This workflow connects to the InfluxDB v2 Prometheus metrics interface (`/metrics`) to audit write ingestion errors and storage engine rejections. In time-series databases, unbounded tag cardinality (such as indexing unique request IDs or timestamps in measurement tags) triggers exponential series key explosion. Once InfluxDB reaches memory or storage limits, subsequent point writes abort with HTTP 422 or storage writer errors. This sentinel audits aggregate write rejection counters and dispatches alerts before telemetry and sensor metrics are lost.

    ## What you get
    - Real-time tracking of InfluxDB time-series write ingestion errors.
    - Protection against telemetry data loss and measurement index explosion.
    - Contextual Slack alerts detailing write error counts.

    ## Who it's for
    - IoT and Telemetry Platform Engineers managing InfluxDB storage clusters.
    - Observability Engineers safeguarding metrics ingestion pipelines.
    - SREs maintaining time-series monitoring infrastructure.

    ## Why orchestrate this with Kestra
    - **Automated Metric Telemetry**: Routinely monitors storage metrics without writing external exporter scripts.
    - **Encrypted Token Security**: Secures InfluxDB v2 administrative tokens inside Kestra secrets.
    - **Incident Orchestration**: Automatically dispatches diagnostic alerts to responsible platform teams.

    ## Prerequisites
    - InfluxDB v2 instance with accessible HTTP port (`8086`).
    - API token stored in `INFLUXDB_TOKEN` secret.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `INFLUXDB_TOKEN` and `SLACK_WEBHOOK` secrets.
    3. Specify `influxdb_url`, `influx_org`, and `bucket_name`.
    4. Enable the schedule trigger for continuous write health surveillance.

    ## How to extend
    - Execute Flux queries to inspect series cardinality per measurement (`import "influxdata/influxdb/schema"`).
    - Route alerts to PagerDuty or Opsgenie.
    - Trigger automated retention policy adjustments for high-churn buckets.

    ## Links
    - [InfluxDB Metrics Documentation](https://docs.influxdata.com/influxdb/v2/reference/internals/metrics/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
