id: influxdb-write-rejection-cardinality-sentinel
namespace: company.team
description: |
  Audits InfluxDB time-series storage metrics to detect write rejections and series cardinality explosion.

inputs:
  - id: influxdb_url
    type: STRING
    defaults: "http://influxdb.internal:8086"
    description: Base URL of the InfluxDB v2 server.
  - id: influx_org
    type: STRING
    description: Target InfluxDB organization name.
  - id: bucket_name
    type: STRING
    description: Target InfluxDB bucket to audit.

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: inspect_storage_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes InfluxDB Prometheus metrics endpoint to detect storage write rejections and 4xx errors.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      INFLUXDB_URL: "{{ inputs.influxdb_url }}"
      INFLUXDB_TOKEN: "{{ secret('INFLUXDB_TOKEN') }}"
    outputFiles:
      - influx_write_metrics.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      influx_url = os.environ.get("INFLUXDB_URL", "http://influxdb.internal:8086").rstrip("/")
      token = os.environ.get("INFLUXDB_TOKEN", "")

      headers = {}
      if token:
          headers["Authorization"] = f"Token {token}"

      metrics_url = f"{influx_url}/metrics"
      print(f"Scraping metrics from {metrics_url}...")

      try:
          resp = requests.get(metrics_url, headers=headers, timeout=20)
          resp.raise_for_status()
          lines = resp.text.splitlines()
      except Exception as exc:
          print(f"ERROR: Failed to query InfluxDB metrics endpoint: {exc}", file=sys.stderr)
          sys.exit(1)

      write_errors = 0.0
      for line in lines:
          if line.startswith("#"):
              continue
          if "storage_writer_err" in line or ("http_api_requests_total" in line and 'status="4' in line):
              parts = line.strip().split()
              if len(parts) >= 2:
                  try:
                      val = float(parts[-1])
                      write_errors += val
                  except ValueError:
                      pass

      is_breach = write_errors > 0
      summary = {
          "is_breach": is_breach,
          "error_count": int(write_errors),
          "metrics_url": metrics_url
      }

      with open("influx_write_metrics.json", "w", encoding="utf-8") as f:
          json.dump(summary, f, indent=2)

      print(f"Audit completed: breach={is_breach}, write_errors={int(write_errors)}")
      Kestra.outputs({
          "is_breach": is_breach,
          "error_count": int(write_errors)
      })

  - id: evaluate_write_health
    type: io.kestra.plugin.core.flow.If
    description: Alerts Slack if storage write errors or rejections are detected.
    condition: "{{ outputs.inspect_storage_metrics.vars.is_breach == true }}"
    then:
      - id: notify_timeseries_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#timeseries-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 InfluxDB Write Rejection & Series Limit Alert",
                "text": "InfluxDB instance at `{{ inputs.influxdb_url }}` has recorded *{{ outputs.inspect_storage_metrics.vars.error_count }}* storage write error(s). High series cardinality or write quota exceeded.",
                "footer": "Kestra Time-Series Sentinel • InfluxDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#timeseries-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ InfluxDB Sentinel Failure",
            "text": "Failed to query InfluxDB metrics at `{{ inputs.influxdb_url }}` in execution {{ execution.id }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

outputs:
  - id: is_breach
    type: BOOLEAN
    value: "{{ outputs.inspect_storage_metrics.vars.is_breach }}"
  - id: error_count
    type: INT
    value: "{{ outputs.inspect_storage_metrics.vars.error_count }}"

extend:
  title: InfluxDB Write Rejection and Series Cardinality Sentinel
  shortDescription: Audits InfluxDB time-series storage metrics to detect write rejections and series cardinality explosion.
  metaTitle: InfluxDB Write Rejection and Series Cardinality Sentinel with Kestra
  metaDescription: Audits InfluxDB time-series storage metrics to detect write rejections and series cardinality explosion.
  description: |
    Audits InfluxDB time-series storage metrics to detect write rejections and series cardinality explosion.
    Connects to the InfluxDB v2 Prometheus metrics endpoint (`/metrics`) to audit write ingestion errors
    and storage engine rejections.
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
