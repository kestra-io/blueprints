id: dns-propagation-verifier
namespace: company.team
description: |
  Polls DNS records across independent public resolvers (Google, Cloudflare, Quad9, OpenDNS)
  until answers propagate globally or reports stale resolvers on timeout.

triggers:
  - id: propagation_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call this from the deploy pipeline right after terraform apply.
    key: dns-propagation-check
  - id: drift_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Re-verify the record periodically to catch configuration drift.
    cron: "15 */6 * * *"
    disabled: true

inputs:
  - id: hostname
    type: STRING
    defaults: www.example.com
    description: The record name being verified, e.g. www.example.com or api.example.com.
  - id: record_type
    type: STRING
    defaults: A
    description: DNS record type to query (A, AAAA, CNAME, TXT).
  - id: expected_value
    type: STRING
    defaults: 203.0.113.10
    description: The value every resolver should return once the change has fully propagated.
  - id: resolvers
    type: STRING
    defaults: 8.8.8.8,1.1.1.1,9.9.9.9,208.67.222.222
    description: Comma-separated DNS resolvers to interrogate independently.
  - id: timeout_seconds
    type: INT
    defaults: 120
    description: Give up after this many seconds of polling and report which resolvers were still stale.
  - id: poll_interval
    type: INT
    defaults: 10
    description: Seconds to wait between rounds of resolver queries.

tasks:
  - id: check_propagation
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates public DNS resolvers using dnspython and tracks propagation across independent networks.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install dnspython kestra
    env:
      NAME: "{{ inputs.hostname }}"
      TYPE: "{{ inputs.record_type }}"
      EXPECTED: "{{ inputs.expected_value }}"
      RESOLVERS: "{{ inputs.resolvers }}"
      TIMEOUT_SEC: "{{ inputs.timeout_seconds }}"
      POLL_INTERVAL: "{{ inputs.poll_interval }}"
    script: |
      import os
      import sys
      import time
      import json
      import dns.resolver
      from kestra import Kestra

      name = os.environ.get("NAME", "www.example.com")
      rtype = os.environ.get("TYPE", "A").upper()
      expected = os.environ.get("EXPECTED", "").strip()
      resolvers_str = os.environ.get("RESOLVERS", "8.8.8.8,1.1.1.1")
      timeout_sec = int(os.environ.get("TIMEOUT_SEC", "120"))
      interval = int(os.environ.get("POLL_INTERVAL", "10"))

      resolvers = [r.strip() for r in resolvers_str.split(",") if r.strip()]
      if not resolvers:
          print("CRITICAL: No DNS resolvers configured", file=sys.stderr)
          sys.exit(1)

      deadline = time.time() + timeout_sec
      attempt = 0
      all_matched = False
      pending_str = ""
      matched_count = 0

      while True:
          attempt += 1
          matched = 0
          pending_items = []

          for r_ip in resolvers:
              res = dns.resolver.Resolver(configure=False)
              res.nameservers = [r_ip]
              res.lifetime = 3.0
              try:
                  ans = res.resolve(name, rtype)
                  answers = [str(rdata).strip('"').rstrip(".") for rdata in ans]
                  if expected in answers or any(expected in a for a in answers):
                      matched += 1
                  else:
                      pending_items.append(f"{r_ip}={','.join(answers)}")
              except Exception as err:
                  pending_items.append(f"{r_ip}=ERR")

          matched_count = matched
          total_count = len(resolvers)
          print(f"Attempt {attempt}: {matched}/{total_count} resolvers answer {expected}")

          if matched == total_count:
              all_matched = True
              pending_str = ""
              break

          if time.time() >= deadline:
              all_matched = False
              pending_str = "|".join(pending_items)
              break

          time.sleep(interval)

      report = {
          "all_matched": all_matched,
          "matched": matched_count,
          "resolvers": len(resolvers),
          "attempts": attempt,
          "pending": pending_str
      }

      with open("dns_propagation_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "all_matched": all_matched,
          "matched": matched_count,
          "resolvers": len(resolvers),
          "attempts": attempt,
          "pending": pending_str
      })
    outputFiles:
      - dns_propagation_report.json

  - id: check_result
    type: io.kestra.plugin.core.flow.If
    description: Evaluate whether all resolvers observed propagated record.
    condition: "{{ outputs.check_propagation.vars.all_matched == false }}"
    then:
      - id: alert_stale_resolvers
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Name the resolvers still returning stale answers.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "DNS propagation TIMEOUT: {{ inputs.hostname }} {{ inputs.record_type }}={{ inputs.expected_value }} seen by {{ outputs.check_propagation.vars.matched }}/{{ outputs.check_propagation.vars.resolvers }} resolver(s) after {{ inputs.timeout_seconds }}s. Still stale: {{ outputs.check_propagation.vars.pending }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_propagated
        type: io.kestra.plugin.core.log.Log
        description: Record propagation confirmation.
        message: "DNS propagated: {{ inputs.hostname }} {{ inputs.record_type }}={{ inputs.expected_value }} confirmed by all {{ outputs.check_propagation.vars.resolvers }} resolver(s) in {{ outputs.check_propagation.vars.attempts }} round(s)."

errors:
  - id: alert_check_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the check itself encounters a critical error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "DNS propagation check FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.hostname }}."
      }

outputs:
  - id: propagation_summary
    type: JSON
    description: 'The DNS propagation audit verdict.'
    value: "{{ outputs.check_propagation.vars | toJson }}"

extend:
  title: Verify a DNS Change Across Independent Resolvers
  shortDescription: Polls public DNS resolvers until all agree or alerts Slack on stale resolution timeout.
  metaTitle: DNS Propagation Checking with Kestra
  metaDescription: Poll a changed DNS record across independent public resolvers until every answer matches your target, and alert Slack listing stale resolvers on timeout.
  description: |
    ## How it works
    This workflow queries multiple independent public DNS resolvers (Google, Cloudflare, Quad9, OpenDNS) after a DNS deployment. It verifies global propagation, tracks convergence rounds, and flags any resolvers that remain stale past the configured deadline.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[propagation_webhook Webhook] --> B[check_propagation Python Script]
      B --> C{All Resolvers Matched?}
      C -- Yes --> D[log_propagated Log]
      C -- No --> E[alert_stale_resolvers Webhook]
    ```

    ## Prerequisites
    - Outbound UDP/53 access to query public resolvers.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `hostname`, `record_type`, and `expected_value`.
    3. Run manually or call via deploy webhook.

    ## Links
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
  subTags:
    - DNS
    - Monitoring & Alerting
    - Network
  ee: false
  demo: false
