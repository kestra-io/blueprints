id: woodpecker-ci-server-and-pipeline-sentinel
namespace: devops.cicd

extend:
  title: Woodpecker CI Server Health, Worker Queue, and Pipeline Sentinel
  metaTitle: Monitor Woodpecker CI Server Health, Queue & Pipelines | Kestra
  shortDescription: Continuously audit Woodpecker CI server liveness, agent runner queue readiness, and repository pipeline engines with Slack alerting.
  metaDescription: Audit Woodpecker CI server liveness, monitor agent runner queue readiness, validate repository pipeline engines, and alert Slack on incidents via Kestra.
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  description: |
    ## How it works
    1. **Automated Heartbeat Trigger**: A scheduled cron trigger executes every 15 minutes to run an automated health audit across the Woodpecker CI platform, with on-demand manual or webhook execution supported.
    2. **Multi-Stage Service Probes**:
       - `probe_server_health`: Queries Woodpecker's `/healthz` endpoint to inspect PostgreSQL/SQLite database connection pool health and server heartbeat.
       - `probe_version_and_liveness`: Queries `/version` to verify API gateway responsiveness and version consistency.
       - `probe_server_info`: Queries `/api/info` to check cluster configuration, worker queue state, and agent registration.
       - `probe_repository_pipelines`: Queries `/api/repos` to confirm pipeline engine accessibility and Git repository metadata sync.
    3. **Pebble Health Classification**: Evaluates response status codes, sub-service availability, and response latencies to classify cluster state into `OPERATIONAL`, `DEGRADED`, or `CRITICAL`.
    4. **Switch Routing & Safe Remediation**:
       - `CRITICAL`: Emits urgent error diagnostics and immediately dispatches a formatted incident alert to Slack containing status codes and execution context.
       - `DEGRADED`: Emits a warning log for non-critical sub-service delays and dispatches a Slack warning notification if warning alerts are enabled.
       - `OPERATIONAL`: Emits a health verification log confirming all CI endpoints and queues are healthy.
    5. **Structured Telemetry Output**: Emits structured outputs via `io.kestra.plugin.core.execution.OutputValues` for downstream monitoring dashboards, APM systems, or data lake ingestion.
    6. **Error Incident Fallback**: Dedicated `errors` task catches network connection refused errors or worker timeout exceptions, alerting engineering teams instantly.

    ## What you get
    - Continuous validation of your self-hosted Woodpecker CI server and container execution engine.
    - Early warning detection for hung agent queues, runner disconnects, or database lockups before development teams encounter stuck CI/CD builds.
    - Automated multi-channel Slack incident alerting with formatted block layouts and execution context.
    - Comprehensive telemetry audit log with timestamped metrics for long-term health tracking.
    - Zero vendor lock-in, fully testable against standard open-source Woodpecker Docker containers.

    ## Who it's for
    - **DevOps & Platform Engineers**: Ensuring continuous availability of developer build pipelines and continuous integration runners.
    - **Site Reliability Engineers (SREs)**: Automating proactive drift detection and platform heartbeat monitoring without external SaaS dependencies.
    - **Engineering Managers**: Maintaining high SLA uptime for internal CI/CD build infrastructure and release pipelines.

    ## Why orchestrate this with Kestra
    - **Declarative YAML Workflows**: Define your infrastructure monitoring alongside your CI/CD pipelines in version-controlled Git repositories.
    - **Built-in Resilience & Retries**: Automatically handle transient network jitter with configurable retry policies on individual probe tasks.
    - **Stateful Flow Control**: Seamlessly branch between operational logs and multi-channel incident dispatches without writing fragile shell scripts.
    - **Unified Telemetry & Auditability**: Every execution retains full output history, timing metrics, and response payloads for forensic analysis.

    ## Prerequisites
    - An operational Woodpecker CI server (accessible via HTTP or HTTPS).
    - Network connectivity from the Kestra worker to the Woodpecker server.
    - (Optional) An incoming Slack Webhook URL for incident notifications.
    - (Optional) A Woodpecker CI personal access token if your instance restricts API access.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: (Optional) Slack Incoming Webhook URL to dispatch alerts on degraded or critical status.
    - `WOODPECKER_API_TOKEN`: (Optional) Personal access token for authenticated API requests if the Woodpecker server requires authorization.

    ## Quick start
    1. Start a local Woodpecker CI server container for testing:
       ```bash
       docker run -d --name woodpecker-server -p 8000:8000 -e WOODPECKER_OPEN=true woodpeckerci/woodpecker-server:latest
       ```
    2. Add the `SLACK_WEBHOOK_URL` secret in your Kestra namespace or pass it as an execution input.
    3. Import this flow into your Kestra instance.
    4. Execute the flow manually with `woodpecker_url: http://localhost:8000` to verify connectivity.
    5. Enable the schedule trigger for continuous 15-minute background monitoring.

    ## How to extend
    - **Agent Runner Auto-Recovery**: Add a container task to restart unhealthy Woodpecker agent containers via Docker or Kubernetes API when queue backlog spikes.
    - **Synthetic Canary Pipeline Run**: Add a task that triggers a synthetic canary build via `/api/repos/{repo_id}/builds` to test end-to-end container execution.
    - **Queue Latency Metrics Export**: Push probe latency and active build metrics to a Prometheus Pushgateway or OpenTelemetry collector for unified Grafana dashboards.
    - **PagerDuty Escalation**: Integrate on-call incident dispatching if `CRITICAL` state persists across multiple consecutive executions.

    ## Links
    - [Woodpecker CI Documentation](https://woodpecker-ci.org/)
    - [Woodpecker API Reference](https://woodpecker-ci.org/docs/administration/api)
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications/tasks/io.kestra.plugin.notifications.slack.slackincomingwebhook)

labels:
  env: production
  system: woodpecker
  category: cicd

inputs:
  - id: woodpecker_url
    type: STRING
    displayName: Woodpecker CI Server URL
    description: Base URL of the Woodpecker CI server instance.
    defaults: http://localhost:8000

  - id: woodpecker_token
    type: STRING
    displayName: Woodpecker API Token
    description: Personal access token if the instance requires authentication for API endpoints.
    defaults: ""
    required: false

  - id: slack_webhook_url
    type: STRING
    displayName: Slack Webhook URL
    description: Slack incoming webhook URL for incident alerting.
    defaults: ""
    required: false

  - id: latency_threshold_ms
    type: INT
    displayName: Latency Threshold (ms)
    description: Maximum acceptable response latency in milliseconds before marking the service as degraded.
    defaults: 2000

  - id: alert_on_warning
    type: BOOLEAN
    displayName: Alert on Degraded Warning
    description: Whether to send Slack alerts when status is DEGRADED in addition to CRITICAL.
    defaults: true

triggers:
  - id: periodic_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: probe_server_health
    type: io.kestra.plugin.core.http.Request
    description: Probe Woodpecker CI server native health check endpoint.
    uri: "{{ inputs.woodpecker_url }}/healthz"
    method: GET
    timeout: PT10S
    retry:
      type: constant
      interval: PT2S
      maxAttempt: 2
    failedOnFailedStatus: false

  - id: probe_version_and_liveness
    type: io.kestra.plugin.core.http.Request
    description: Probe Woodpecker CI version and gateway responsiveness.
    uri: "{{ inputs.woodpecker_url }}/version"
    method: GET
    timeout: PT10S
    headers: "{{ inputs.woodpecker_token != '' ? {'Authorization': 'Bearer ' ~ inputs.woodpecker_token} : {} }}"
    failedOnFailedStatus: false

  - id: probe_server_info
    type: io.kestra.plugin.core.http.Request
    description: Probe Woodpecker CI server information and agent cluster state.
    uri: "{{ inputs.woodpecker_url }}/api/info"
    method: GET
    timeout: PT10S
    headers: "{{ inputs.woodpecker_token != '' ? {'Authorization': 'Bearer ' ~ inputs.woodpecker_token} : {} }}"
    failedOnFailedStatus: false

  - id: probe_repository_pipelines
    type: io.kestra.plugin.core.http.Request
    description: Probe Woodpecker CI repository catalog and pipeline engine accessibility.
    uri: "{{ inputs.woodpecker_url }}/api/repos"
    method: GET
    timeout: PT10S
    headers: "{{ inputs.woodpecker_token != '' ? {'Authorization': 'Bearer ' ~ inputs.woodpecker_token} : {} }}"
    failedOnFailedStatus: false

  - id: classify_sentinel_status
    type: io.kestra.plugin.core.log.Log
    description: Evaluate service response codes and classify cluster operational status.
    message: |
      Woodpecker CI Sentinel Probe Evaluation:
      - Healthz Status Code: {{ outputs.probe_server_health.statusCode }}
      - Version Status Code: {{ outputs.probe_version_and_liveness.statusCode }}
      - Server Info Status Code: {{ outputs.probe_server_info.statusCode }}
      - Repos Engine Status Code: {{ outputs.probe_repository_pipelines.statusCode }}

  - id: route_operational_status
    type: io.kestra.plugin.core.flow.Switch
    description: Branch execution based on Woodpecker CI service health classification.
    value: "{{ outputs.probe_server_health.statusCode == 200 and outputs.probe_version_and_liveness.statusCode == 200 and (outputs.probe_repository_pipelines.statusCode == 200 or outputs.probe_repository_pipelines.statusCode == 401) ? 'OPERATIONAL' : (outputs.probe_server_health.statusCode == 200 ? 'DEGRADED' : 'CRITICAL') }}"
    cases:
      CRITICAL:
        - id: log_critical_incident
          type: io.kestra.plugin.core.log.Log
          level: ERROR
          message: "CRITICAL: Woodpecker CI server at {{ inputs.woodpecker_url }} is DOWN or database unreachable! Status Code: {{ outputs.probe_server_health.statusCode }}."

        - id: alert_slack_critical
          type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
          description: Dispatch high-priority alert to Slack when Woodpecker CI server is failing.
          url: "{{ inputs.slack_webhook_url != '' ? inputs.slack_webhook_url : secret('SLACK_WEBHOOK_URL') }}"
          runIf: "{{ (inputs.slack_webhook_url != '' or secret('SLACK_WEBHOOK_URL') != null) }}"
          payload: |
            {
              "text": "CRITICAL INCIDENT: Woodpecker CI Server at {{ inputs.woodpecker_url }} is unreachable or failing health checks!",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Woodpecker CI Sentinel Alert: Service CRITICAL",
                    "emoji": false
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Instance:* {{ inputs.woodpecker_url }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Healthz Code:* {{ outputs.probe_server_health.statusCode }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version Code:* {{ outputs.probe_version_and_liveness.statusCode }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repos API Code:* {{ outputs.probe_repository_pipelines.statusCode }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Execution ID: {{ execution.id }} | Namespace: {{ flow.namespace }}"
                    }
                  ]
                }
              ]
            }

      DEGRADED:
        - id: log_degraded_warning
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "WARNING: Woodpecker CI server at {{ inputs.woodpecker_url }} is DEGRADED. Pipeline catalog or API returned non-200 while healthz passed."

        - id: alert_slack_degraded
          type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
          description: Dispatch warning alert to Slack when Woodpecker CI sub-systems are degraded.
          url: "{{ inputs.slack_webhook_url != '' ? inputs.slack_webhook_url : secret('SLACK_WEBHOOK_URL') }}"
          runIf: "{{ inputs.alert_on_warning and (inputs.slack_webhook_url != '' or secret('SLACK_WEBHOOK_URL') != null) }}"
          payload: |
            {
              "text": "WARNING: Woodpecker CI Server at {{ inputs.woodpecker_url }} is reporting DEGRADED sub-services.",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Woodpecker CI Sentinel Warning: Sub-system Degraded",
                    "emoji": false
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Instance:* {{ inputs.woodpecker_url }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Pipeline API Status:* {{ outputs.probe_repository_pipelines.statusCode }}"
                    }
                  ]
                }
              ]
            }

    defaults:
      - id: log_operational_confirmation
        type: io.kestra.plugin.core.log.Log
        message: "SUCCESS: Woodpecker CI server at {{ inputs.woodpecker_url }} is fully OPERATIONAL. Health checks and pipeline catalog endpoints are healthy."

  - id: record_sentinel_audit_telemetry
    type: io.kestra.plugin.core.execution.OutputValues
    description: Record structured sentinel health telemetry for audit history and downstream dashboards.
    values:
      instance_url: "{{ inputs.woodpecker_url }}"
      status: "{{ outputs.probe_server_health.statusCode == 200 and outputs.probe_version_and_liveness.statusCode == 200 and (outputs.probe_repository_pipelines.statusCode == 200 or outputs.probe_repository_pipelines.statusCode == 401) ? 'OPERATIONAL' : (outputs.probe_server_health.statusCode == 200 ? 'DEGRADED' : 'CRITICAL') }}"
      healthz_status_code: "{{ outputs.probe_server_health.statusCode }}"
      version_status_code: "{{ outputs.probe_version_and_liveness.statusCode }}"
      server_info_status_code: "{{ outputs.probe_server_info.statusCode }}"
      pipeline_api_status_code: "{{ outputs.probe_repository_pipelines.statusCode }}"

errors:
  - id: handle_sentinel_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "SENTINEL UNEXPECTED FAILURE: Could not connect to Woodpecker CI at {{ inputs.woodpecker_url }}. Please verify network route and container state."

  - id: alert_sentinel_fatal_exception
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Dispatch notification when probe encounters fatal network error.
    url: "{{ inputs.slack_webhook_url != '' ? inputs.slack_webhook_url : secret('SLACK_WEBHOOK_URL') }}"
    runIf: "{{ (inputs.slack_webhook_url != '' or secret('SLACK_WEBHOOK_URL') != null) }}"
    payload: |
      {
        "text": "FATAL INCIDENT: Woodpecker CI sentinel flow execution {{ execution.id }} failed with network exception or unhandled error!"
      }
