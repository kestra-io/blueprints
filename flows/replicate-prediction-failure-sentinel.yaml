id: replicate-prediction-failure-sentinel
namespace: company.team
description: |
  Every hour, read recent predictions from the Replicate API (read-only: no
  model is run and no prediction is canceled) and classify model inference
  as HEALTHY, WARNING, CRITICAL, LOW_VOLUME or UNREACHABLE. Log quiet runs
  and alert Slack when predictions start failing, with the model that fails
  most and the most common error message.

inputs:
  - id: lookback_hours
    type: INT
    defaults: 6
    displayName: "Lookback Window (hours)"
    description: "Read predictions created in the last this many hours (sent to Replicate as created_after)."
  - id: warning_failure_rate
    type: FLOAT
    defaults: 5.0
    displayName: "Warning Failure Rate (%)"
    description: "At or above this share of failed predictions among finished ones, the check is WARNING."
  - id: critical_failure_rate
    type: FLOAT
    defaults: 20.0
    displayName: "Critical Failure Rate (%)"
    description: "At or above this share of failed predictions among finished ones, the check is CRITICAL."
  - id: min_predictions
    type: INT
    defaults: 20
    displayName: "Minimum Predictions"
    description: "Below this many finished predictions, the rate is too noisy to judge and the run is LOW_VOLUME."

triggers:
  - id: hourly_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check prediction failures every hour. Shipped disabled; enable it once the Replicate token secret is set and a manual run has been verified.
    cron: "20 * * * *"
    disabled: true

tasks:
  - id: list_predictions
    type: io.kestra.plugin.core.http.Request
    description: Read the most recent page (up to 100) of predictions created since the start of the lookback window from the Replicate predictions list. This is a GET; no model is run and nothing is canceled.
    uri: "https://api.replicate.com/v1/predictions?created_after={{ now() | dateAdd(-inputs.lookback_hours, 'HOURS') | date(\"yyyy-MM-dd'T'HH:mm:ss'Z'\", timeZone='UTC') }}"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('REPLICATE_API_TOKEN') }}"
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: summarize_predictions
    type: io.kestra.plugin.core.debug.Return
    description: Keep predictions that have finished (succeeded, failed or aborted), compute the failed-or-aborted share, count canceled and still-running ones, find the model that fails most and the most common error message, and classify in one jq query. A missing or non-200 response becomes UNREACHABLE.
    format: >-
      {{ (outputs.list_predictions.code is not defined or outputs.list_predictions.code != 200)
      ? '{"status":"UNREACHABLE","finished":0,"succeeded":0,"failed":0,"rate":0,"canceled":0,"in_flight":0,"top_model":"none","top_error":"none","more_pages":false}'
      : (fromJson(outputs.list_predictions.body) | jq('
      (.results // []) as $p
      | [$p[] | select(.status == "succeeded" or .status == "failed" or .status == "aborted")] as $f
      | [$f[] | select(.status == "failed" or .status == "aborted")] as $bad
      | ($f | length) as $n
      | (if $n == 0 then 0 else ((($bad | length) * 1000 / $n) | floor) / 10 end) as $r
      | {finished: $n, succeeded: ($n - ($bad | length)), failed: ($bad | length), rate: $r,
      canceled: ([$p[] | select(.status == "canceled")] | length),
      in_flight: ([$p[] | select(.status == "starting" or .status == "processing")] | length),
      top_model: (if ($bad | length) == 0 then "none" else ([$bad[] | (.model // .version // "unknown")] | group_by(.) | map({m: .[0], c: length}) | max_by(.c) | (.m + " x" + (.c | tostring))) end),
      top_error: (if ($bad | length) == 0 then "none" else ([$bad[] | ((.error // (if .status == "aborted" then "aborted before start" else "no error message" end)) | tostring | split("\"") | join("") | split("\n") | join(" ") | .[0:100])] | group_by(.) | map({e: .[0], c: length}) | max_by(.c) | (.e + " (x" + (.c | tostring) + ")")) end),
      more_pages: (.next != null),
      status: (if $n < ' ~ inputs.min_predictions ~ ' then "LOW_VOLUME"
      elif $r >= ' ~ inputs.critical_failure_rate ~ ' then "CRITICAL"
      elif $r >= ' ~ inputs.warning_failure_rate ~ ' then "WARNING"
      else "HEALTHY" end)}
      ') | first | toJson) }}

  - id: route_by_failures
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when predictions are healthy or volume is too low to judge, a Slack message when failures cross the warning line, or a Slack page when they cross the critical line or Replicate could not be read.
    value: "{{ fromJson(outputs.summarize_predictions.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          description: Log a quiet line when the check is healthy; no Slack message is sent.
          message: "Replicate predictions healthy: {{ fromJson(outputs.summarize_predictions.value).failed }} of {{ fromJson(outputs.summarize_predictions.value).finished }} finished predictions failed ({{ fromJson(outputs.summarize_predictions.value).rate }}%) in the last {{ inputs.lookback_hours }} hour(s)."
      "LOW_VOLUME":
        - id: log_low_volume
          type: io.kestra.plugin.core.log.Log
          description: Log a quiet line when there is too little activity in the window to judge; no Slack message is sent.
          message: "Replicate predictions: only {{ fromJson(outputs.summarize_predictions.value).finished }} finished prediction(s) in the last {{ inputs.lookback_hours }} hour(s), below the minimum of {{ inputs.min_predictions }}; rate not judged this run."
      "WARNING":
        - id: alert_warning_failures
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post a Slack message when the prediction failure rate is at or above the warning line.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Replicate predictions WARNING: {{ fromJson(outputs.summarize_predictions.value).failed }} of {{ fromJson(outputs.summarize_predictions.value).finished }} finished predictions failed ({{ fromJson(outputs.summarize_predictions.value).rate }}%) in the last {{ inputs.lookback_hours }} hour(s). Most failing model: {{ fromJson(outputs.summarize_predictions.value).top_model }}. Most common error: {{ fromJson(outputs.summarize_predictions.value).top_error }}. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_failures
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the prediction failure rate is at or above the critical line, which usually means a model version, an input format or a billing limit is broken.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Replicate predictions CRITICAL: {{ fromJson(outputs.summarize_predictions.value).failed }} of {{ fromJson(outputs.summarize_predictions.value).finished }} finished predictions failed ({{ fromJson(outputs.summarize_predictions.value).rate }}%) in the last {{ inputs.lookback_hours }} hour(s). Most failing model: {{ fromJson(outputs.summarize_predictions.value).top_model }}. Most common error: {{ fromJson(outputs.summarize_predictions.value).top_error }}. Features built on this model are failing for users; check the model version and inputs now. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the predictions list could not be read, indicating an outage or an invalid API token.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Replicate prediction sentinel UNREACHABLE: the predictions list did not return a usable response (HTTP {{ outputs.list_predictions.code ?? 'no response' }}). Check the API token. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        description: Fallback for any classification the cases above do not cover, so an unexpected value is visible in the logs.
        message: "Replicate prediction sentinel completed with an unexpected classification: {{ outputs.summarize_predictions.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, so the failure history stays queryable even if Slack delivery fails.
    message: "Replicate prediction sentinel audit: lookback_hours={{ inputs.lookback_hours }} http={{ outputs.list_predictions.code ?? 'n/a' }} summary={{ outputs.summarize_predictions.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails, so a broken check is never mistaken for healthy inference.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Replicate prediction sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Prediction health is now unknown; check the task logs and the Replicate predictions dashboard."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ fromJson(outputs.summarize_predictions.value).status }}"

extend:
  title: "Replicate Prediction Failure Sentinel"
  shortDescription: Read recent Replicate predictions every hour and alert Slack when model runs start failing, with the failing model and the top error.
  metaTitle: Replicate Prediction Failure Sentinel for Kestra
  metaDescription: "Read recent Replicate predictions every hour, run no model, and alert Slack when failures cross your limits, with the failing model and top error."
  description: |
    Image generation, transcription, upscaling and LLM features built on Replicate fail one prediction at a time: a model owner pushes a new version, an input field changes type, a GPU runs out of memory on large inputs, or the account hits a spend limit. Each prediction just ends with `status: failed` and an `error` string, the app shows a generic error, and nobody notices the rate climbing until users complain. This blueprint turns a scheduled, read-only call to the Replicate API into an inference health gate: `io.kestra.plugin.core.http.Request` reads recent predictions, one jq query computes the failure rate, the model that fails most and the most common error, and the result routes to a quiet log or a Slack alert.

    ## How it works

    1. `list_predictions` (`io.kestra.plugin.core.http.Request`) calls `GET /v1/predictions?created_after=...` with a bearer token, which returns the most recent page of up to 100 predictions created since the start of the lookback window. It is a read: no model is run and nothing is canceled. Retries cover short network blips, and `allowFailed` plus `allowFailure` keep an API error from aborting the flow so it can be reported instead.
    2. `summarize_predictions` (`io.kestra.plugin.core.debug.Return`) first guards for a missing or non-200 response (`UNREACHABLE`). Otherwise one jq query keeps predictions whose `status` is final (`succeeded`, `failed` or `aborted`), counts `canceled` ones and ones still `starting` or `processing` separately, computes the share that `failed` or were `aborted` before they started, and groups failed predictions by `model` and by `error`. Fewer than `min_predictions` finished predictions is `LOW_VOLUME`; at or above `critical_failure_rate` is `CRITICAL`; at or above `warning_failure_rate` is `WARNING`; otherwise `HEALTHY`.
    3. `route_by_failures` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` and `LOW_VOLUME` log quietly, `WARNING` posts a Slack note, `CRITICAL` and `UNREACHABLE` page Slack. A `defaults` fallback logs anything unexpected.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run with the HTTP status and the full summary.
    5. The flow-level `errors` block pages Slack if the flow itself fails, and the `hourly_check` trigger runs at 20 minutes past every hour, shipped `disabled: true`.

    ## What you get

    - An hourly, read-only check of model inference with no custom scripting and no extra plugin to install.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `LOW_VOLUME` / `UNREACHABLE`) other flows can gate on, for example to pin a known-good model version or fall back to another provider while failures are high.
    - Slack messages with the failure rate, the model that fails most (`owner/name`) and the most common error message, which usually points at the cause.
    - An audit line on every run, separate from Slack.

    ## Who it's for

    - Product teams shipping image, video, audio or text features on Replicate models.
    - ML engineers who run their own models on Replicate and want to hear about a broken version before users do.
    - Teams that already run their AI pipelines and alerting in Kestra.

    ## Why orchestrate this with Kestra

    Replicate's dashboard lists predictions and webhooks report them one at a time, but neither tells you that one in five predictions failed in the last hour. Kestra turns a plain, read-only API call into a scheduled, typed classification with retries, a failure path and an execution history, and the `status` output lets your generation flows react automatically.

    ## Prerequisites

    - A Replicate account that runs predictions through the API, and an API token from the account settings.
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `REPLICATE_API_TOKEN`: a Replicate API token for the account (or organization) whose predictions you want to watch.
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, for example `SECRET_REPLICATE_API_TOKEN=$(echo -n 'r8_xxxxxxxx' | base64)`, and read back with `{{ secret('REPLICATE_API_TOKEN') }}`. Use the Enterprise secrets backend for encryption at rest and access control.

    ## Quick start

    1. Run a few predictions on any public model, plus one with an invalid input to produce a failure.
    2. Add `REPLICATE_API_TOKEN` and `SLACK_WEBHOOK` as secrets.
    3. Run the flow manually with a low `min_predictions` and compare the counts, model and error in the logs with the predictions list in the Replicate dashboard.
    4. Enable `hourly_check`.

    ## How to extend

    - Follow `next` when you run more than 100 predictions in the window, or shorten `lookback_hours` (the summary reports `more_pages`).
    - Filter the jq to one `model` and give it its own limits, for example for the model behind a paid feature.
    - Add a p95 of `metrics.predict_time` to catch slow models as well as failing ones.
    - Store the last status in a KV store and alert only when it changes.

    ## Inputs

    - `lookback_hours`: type INT, default `6`.
    - `warning_failure_rate`: type FLOAT, default `5.0` (percent).
    - `critical_failure_rate`: type FLOAT, default `20.0` (percent).
    - `min_predictions`: type INT, default `20`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `LOW_VOLUME`, `UNREACHABLE`.
    - Example path: `{{ fromJson(outputs.summarize_predictions.value).top_model }}` for the model that fails most.

    ## Links

    - [Replicate HTTP API: list predictions](https://replicate.com/docs/reference/http#predictions.list)
    - [Replicate prediction lifecycle](https://replicate.com/docs/topics/predictions/lifecycle)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    ## Pitfalls

    - Only the first page (100 predictions, newest first) is read; high-volume accounts need paging with `next` or a shorter window.
    - `canceled` predictions are counted but not treated as failures, because they are usually canceled on purpose by your own code. `aborted` ones (terminated before they started, for example by a deadline) are counted as failures.
    - Predictions created from the web playground are included too; filter on `source == "api"` in the jq if you only care about production calls.
    - This flow only reads; it never creates, cancels or deletes a prediction.
  tags:
    - AI
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
