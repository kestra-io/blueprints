id: github-workflow-execution-success-rate-sentinel
namespace: company.ops

inputs:
  - id: github_owner
    type: STRING
    description: GitHub organization or repository owner.
  - id: github_repo
    type: STRING
    description: GitHub repository name.
  - id: failure_rate_threshold_pct
    type: INT
    defaults: 20
    description: Maximum acceptable CI/CD workflow run failure rate percentage before alerting.

tasks:
  - id: query_workflow_runs
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s -H "Authorization: Bearer {{ secret('GITHUB_TOKEN') }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/{{ inputs.github_owner }}/{{ inputs.github_repo }}/actions/runs?per_page=50" > /tmp/gh_runs.json
        
        TOTAL_RUNS=$(jq '.workflow_runs | length // 0' /tmp/gh_runs.json)
        FAILED_RUNS=$(jq '[.workflow_runs[]? | select(.conclusion == "failure")] | length // 0' /tmp/gh_runs.json)
        
        if [ "$TOTAL_RUNS" -gt 0 ]; then
          FAIL_PCT=$(( FAILED_RUNS * 100 / TOTAL_RUNS ))
        else
          FAIL_PCT=0
        fi
        
        echo "::set-output name=total_runs::$TOTAL_RUNS::"
        echo "::set-output name=failed_runs::$FAILED_RUNS::"
        echo "::set-output name=fail_pct::$FAIL_PCT::"

  - id: evaluate_pipeline_success_rate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_workflow_runs.vars.fail_pct | int >= inputs.failure_rate_threshold_pct and outputs.query_workflow_runs.vars.failed_runs | int > 0 }}"
    then:
      - id: notify_devops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#ci-cd-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 GitHub Actions Workflow Failure Spike Alert",
                "text": "Repository `{{ inputs.github_owner }}/{{ inputs.github_repo }}` recorded a *{{ outputs.query_workflow_runs.vars.fail_pct }}%* CI/CD failure rate (*{{ outputs.query_workflow_runs.vars.failed_runs }}* failed runs out of recent *{{ outputs.query_workflow_runs.vars.total_runs }}*)! Impact: Flaky integration tests, broken dependency mirrors, or runner outages are blocking pull request merges and production deployments.",
                "footer": "Kestra DevOps Sentinel • GitHub Actions"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#ci-cd-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ GitHub Actions Workflow Execution Success Rate Sentinel Pipeline Failure",
            "text": "Failed to query GitHub Actions workflow runs API. Verify GitHub token permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits GitHub Actions workflow runs to detect CI/CD pipeline failure spikes and deployment blockage."
  metaTitle: GitHub Actions Workflow Execution Success Rate Sentinel with Kestra
  title: GitHub Actions Workflow Execution Success Rate Sentinel
  shortDescription: Audits GitHub Actions workflow runs to detect CI/CD pipeline failure spikes and deployment blockage.
  description: |
    ## How it works
    This workflow calls the GitHub REST API (`GET /repos/<owner>/<repo>/actions/runs`) to sample the last 50 workflow executions. It aggregates total completed runs against those with `conclusion == 'failure'` to compute the failure percentage. When a broken base commit, flaky test suite, or third-party package mirror outage causes build failures to spike above the threshold, Slack is alerted immediately.

    ## What you get
    - Real-time detection of widespread CI/CD pipeline breakage.
    - Prevents broken build commits from blocking engineering velocity.
    - Precise metrics on failure counts and failure rates across recent runs.

    ## Who it's for
    - DevOps Engineers and Engineering Productivity Leads managing CI/CD pipelines.
    - Development teams shipping frequent code releases via GitHub Actions.

    ## Why orchestrate this with Kestra
    - **REST API Integration**: Direct querying using standard GitHub REST endpoints.
    - **Continuous Pipeline Telemetry**: Run hourly audits without managing dedicated CI monitoring bots.
    - **Contextual Notifications**: Actionable failure metrics delivered directly to team Slack channels.

    ## Prerequisites
    - GitHub Personal Access Token (PAT) with `repo` or `actions:read` permissions.
    - Secrets `GITHUB_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import blueprint into Kestra.
    2. Configure `github_owner` and `github_repo`.
    3. Run the workflow to inspect CI/CD success rate.

    ## How to extend
    - Query specific critical workflows by workflow file name or ID.
    - Automatically disable pull request auto-merge when CI failure rate spikes.

    ## Links
    - [GitHub Actions Workflow Runs API](https://docs.github.com/en/rest/actions/workflow-runs)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Infrastructure Automation
  ee: false
  demo: false
