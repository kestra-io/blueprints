id: mysql-table-fragmentation-and-optimize-advisor
namespace: company.team
description: |
  Automated MySQL InnoDB storage fragmentation auditor. Inspects DATA_FREE across schema tables,
  calculates reclaimable disk capacity, and prepares off-peak OPTIMIZE TABLE maintenance advisories.

concurrency:
  limit: 1

inputs:
  - id: mysql_url
    type: STRING
    displayName: MySQL JDBC URL
    defaults: "jdbc:mysql://mysql.internal:3306/app_db"
    description: "JDBC connection URL for the target MySQL database server."

  - id: mysql_username
    type: STRING
    displayName: Database Username
    defaults: "db_monitor"
    description: "Database user with SELECT privileges on information_schema.TABLES."

  - id: target_schema
    type: STRING
    displayName: Database Schema
    defaults: "app_db"
    description: "Target database schema name to inspect for table fragmentation."

  - id: fragmentation_ratio_threshold
    type: FLOAT
    displayName: Fragmentation Threshold
    defaults: 0.30
    description: "Minimum ratio of DATA_FREE to total table size to qualify as fragmented (0.30 = 30%)."

  - id: min_wasted_mb_threshold
    type: INT
    displayName: Minimum Wasted MB
    defaults: 500
    description: "Minimum wasted free storage in megabytes before recommending an OPTIMIZE TABLE command."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#dba-maintenance"
    description: "Slack channel destination for DBA storage defragmentation advisories."

triggers:
  - id: weekly_fragmentation_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Executes storage fragmentation audit weekly on Sunday at 04:00 UTC."
    cron: "0 4 * * 0"

tasks:
  - id: query_table_free_space
    type: io.kestra.plugin.jdbc.mysql.Query
    description: "Queries MySQL information_schema.TABLES for InnoDB data and free space allocation."
    url: "{{ inputs.mysql_url }}"
    username: "{{ inputs.mysql_username }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        TABLE_SCHEMA,
        TABLE_NAME,
        ENGINE,
        ROUND(DATA_LENGTH / 1024 / 1024, 2) AS data_size_mb,
        ROUND(INDEX_LENGTH / 1024 / 1024, 2) AS index_size_mb,
        ROUND(DATA_FREE / 1024 / 1024, 2) AS free_space_mb,
        ROUND(DATA_FREE / NULLIF(DATA_LENGTH + INDEX_LENGTH + DATA_FREE, 0), 2) AS fragmentation_ratio
      FROM information_schema.TABLES
      WHERE TABLE_SCHEMA = '{{ inputs.target_schema }}'
        AND ENGINE = 'InnoDB'
        AND DATA_FREE > 0
      ORDER BY DATA_FREE DESC;

  - id: evaluate_table_fragmentation
    type: io.kestra.plugin.scripts.python.Script
    description: "Calculates total reclaimable storage and generates executable OPTIMIZE TABLE statements."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      tables.json: "{{ outputs.query_table_free_space.rows | default('[]') | json }}"
    outputFiles:
      - fragmentation_report.json
    script: |
      import json
      from kestra import Kestra

      with open("tables.json", "r", encoding="utf-8") as f:
          tables = json.load(f)

      ratio_thresh = float("{{ inputs.fragmentation_ratio_threshold }}")
      min_mb_thresh = int("{{ inputs.min_wasted_mb_threshold }}")

      fragmented_tables = []
      total_reclaimable_mb = 0.0

      for t in tables:
          name = t.get("TABLE_NAME", "unknown")
          free_mb = float(t.get("free_space_mb", 0.0))
          data_mb = float(t.get("data_size_mb", 0.0))
          ratio = float(t.get("fragmentation_ratio", 0.0))

          if free_mb >= min_mb_thresh and ratio >= ratio_thresh:
              fragmented_tables.append({
                  "table": name,
                  "free_space_mb": free_mb,
                  "data_size_mb": data_mb,
                  "fragmentation_ratio": ratio,
                  "recommendation": f"OPTIMIZE TABLE `{name}`;"
              })
              total_reclaimable_mb += free_mb

      action_recommended = len(fragmented_tables) > 0

      report = {
          "schema": "{{ inputs.target_schema }}",
          "total_tables_checked": len(tables),
          "fragmented_tables_count": len(fragmented_tables),
          "total_reclaimable_mb": round(total_reclaimable_mb, 2),
          "candidate_tables": fragmented_tables
      }

      with open("fragmentation_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "action_recommended": action_recommended,
          "fragmented_count": len(fragmented_tables),
          "total_reclaimable_mb": round(total_reclaimable_mb, 2),
          "top_table": fragmented_tables[0]["table"] if fragmented_tables else "None",
          "top_table_waste_mb": fragmented_tables[0]["free_space_mb"] if fragmented_tables else 0
      })

  - id: evaluate_advisory_trigger
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether any candidate tables crossed the fragmentation reclaim thresholds."
    condition: "{{ outputs.evaluate_table_fragmentation.vars.action_recommended }}"
    then:
      - id: alert_dba_fragmentation_advisor
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches storage defragmentation advisory card to DBA channel via Slack."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*MySQL Storage Optimization and Defragmentation Advisory*\n• *Target Schema*: `{{ inputs.target_schema }}`\n• *Fragmented Tables Count*: {{ outputs.evaluate_table_fragmentation.vars.fragmented_count }}\n• *Total Reclaimable Storage*: ~{{ outputs.evaluate_table_fragmentation.vars.total_reclaimable_mb }} MB\n• *Top Waste Candidate*: `{{ outputs.evaluate_table_fragmentation.vars.top_table }}` ({{ outputs.evaluate_table_fragmentation.vars.top_table_waste_mb }} MB free space)\n• *Operational Impact*: Heavily fragmented InnoDB tables waste cloud disk storage and degrade buffer pool cache hit ratios during range scans.\n• *Recommended Remediation*: Schedule an `OPTIMIZE TABLE {{ outputs.evaluate_table_fragmentation.vars.top_table }};` statement during the upcoming off-peak maintenance window."
          }

    else:
      - id: log_compact_storage_status
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation of healthy table storage allocation."
        message: "MySQL storage audit compliant. Schema {{ inputs.target_schema }} tables are compact with zero excessive fragmentation."

  - id: export_storage_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON storage audit manifest for maintenance planning."
    format: |
      {
        "pipeline": "mysql-table-fragmentation-and-optimize-advisor",
        "audited_at": "{{ execution.startDate }}",
        "schema": "{{ inputs.target_schema }}",
        "reclaimable_mb": {{ outputs.evaluate_table_fragmentation.vars.total_reclaimable_mb }},
        "status": "{{ outputs.evaluate_table_fragmentation.vars.action_recommended ? 'ADVISORY_PENDING' : 'OPTIMIZED' }}"
      }

extend:
  shortDescription: "Audits InnoDB data_free space across MySQL tables and recommends storage defragmentation."
  title: "MySQL Table Fragmentation and Optimize Advisor"
  metaTitle: "MySQL Table Fragmentation and Optimize Advisor | Kestra Blueprint"
  metaDescription: "Audits MySQL InnoDB tables for storage fragmentation bloat, recommending OPTIMIZE TABLE commands to reclaim disk space."
  description: |
    In active MySQL database workloads with frequent `UPDATE` operations and row deletions, the underlying InnoDB storage engine allocates new extents without automatically releasing unused space back to the operating system filesystem. Over months of application traffic, table data files (`.ibd`) accumulate substantial internal free space (`DATA_FREE`).

    When fragmentation exceeds 30% to 50% of total table capacity, companies incur unnecessary cloud disk storage costs (e.g. AWS EBS gp3 or GCP Persistent Disk). Furthermore, fragmented B-tree index pages degrade buffer pool hit ratios and slow down table range scans.

    This blueprint provides an automated storage advisor that audits MySQL `information_schema.TABLES` weekly, calculates exact fragmentation percentages and reclaimable megabytes, and compiles executable `OPTIMIZE TABLE` remediation advisories directly into your DBA team's Slack channel.

    ## How it works

    1. **Weekly Scheduled Audit**: The `weekly_fragmentation_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) executes every Sunday at 04:00 UTC.
    2. **Free Space Inspection**: The `query_table_free_space` task (`io.kestra.plugin.jdbc.mysql.Query`) queries `information_schema.TABLES` for InnoDB tables with `DATA_FREE > 0`.
    3. **Python Fragmentation Scoring**: The `evaluate_table_fragmentation` task (`io.kestra.plugin.scripts.python.Script`) filters tables exceeding `min_wasted_mb_threshold` and `fragmentation_ratio_threshold`, generating `fragmentation_report.json`.
    4. **Condition Branching**: The `evaluate_advisory_trigger` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether any candidates require defragmentation.
    5. **Slack Advisory Notification**: If reclaimable tables are discovered, `alert_dba_fragmentation_advisor` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable maintenance plan.
    6. **Storage Manifest**: The `export_storage_manifest` task records reclaimable disk stats for capacity planning.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Weekly Sunday 04:00 UTC] --> B[query_table_free_space: MySQL]
        B --> C[evaluate_table_fragmentation: Python Storage Analyzer]
        C --> D{Fragmentation Threshold Breached?}
        D -- Yes --> E[alert_dba_fragmentation_advisor: Slack]
        D -- No --> F[log_compact_storage_status: Log]
        E --> G[export_storage_manifest: Return JSON]
        F --> G
    ```

    ## Use cases

    - **Cloud Storage Cost Optimization**: Recover wasted gigabytes on AWS EBS or Google Persistent Disks caused by InnoDB data_free space.
    - **Buffer Pool Performance Tuning**: Defragment index and data pages to maximize MySQL buffer pool memory efficiency.
    - **Proactive Database Maintenance**: Generate maintenance window advisories with exact OPTIMIZE TABLE commands for DBAs.

    ## What you get

    - Automated discovery of storage fragmentation bloat across MySQL schemas.
    - Exact quantification of reclaimable storage in megabytes.
    - Executable SQL remediation commands (`OPTIMIZE TABLE`) prepared in advance.
    - Zero production locks during the audit phase via non-intrusive metadata queries.

    ## Who it is for

    - MySQL Database Administrators managing high-volume OLTP databases.
    - Cloud Infrastructure Engineers seeking to reduce cloud disk storage expenses.
    - Site Reliability Engineers optimizing database query latency and I/O efficiency.

    ## Why orchestrate this with Kestra

    Manually inspecting table fragmentation across dozens of database instances requires ad-hoc bash scripts and manual metric calculations. Kestra automates the inspection, analysis, and alerting into a scheduled, auditable workflow with zero ongoing maintenance.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `mysql_url` | STRING | `jdbc:mysql://...` | JDBC URL of target MySQL instance. |
    | `mysql_username` | STRING | `db_monitor` | Monitoring database user. |
    | `target_schema` | STRING | `app_db` | Database schema name to inspect. |
    | `fragmentation_ratio_threshold` | FLOAT | `0.30` | Minimum free-to-total size ratio (e.g. 0.30 = 30%). |
    | `min_wasted_mb_threshold` | INT | `500` | Minimum wasted MB to qualify table. |
    | `slack_channel` | STRING | `#dba-maintenance` | Slack channel destination for alerts. |

    ## Expected outputs

    - `{{ outputs.evaluate_table_fragmentation.vars.action_recommended }}`: Boolean flag indicating if any table exceeded thresholds.
    - `{{ outputs.evaluate_table_fragmentation.vars.total_reclaimable_mb }}`: Total estimated disk space reclaimable across the schema.
    - `{{ outputs.evaluate_table_fragmentation.vars.top_table }}`: Name of the table with the greatest wasted space.
    - `{{ outputs.evaluate_table_fragmentation.outputFiles['fragmentation_report.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - MySQL server version 5.7, 8.0, or 8.4 accessible via JDBC (port 3306).
    - Database user credentials stored in Kestra secrets.
    - Slack Incoming Webhook configured for your DBA operations channel.

    ### Secrets

    - `MYSQL_PASSWORD`: Password for the MySQL database user.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `MYSQL_PASSWORD` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI to perform an initial table storage inspection.
    4. Review execution outputs to inspect fragmentation percentages across your tables.

    ## Common pitfalls and troubleshooting

    - **innodb_file_per_table**: Reclaiming disk space back to the host filesystem requires `innodb_file_per_table=ON` (enabled by default in modern MySQL). If disabled, space is reclaimed only within the shared `ibdata1` tablespace.
    - **Disk Space for Table Rebuild**: `OPTIMIZE TABLE` rebuilds the table in place and requires temporary disk space approximately equal to the size of the table.
    - **Maintenance Windows**: While online DDL is supported in modern MySQL, rebuilding large tables generates substantial I/O and should be scheduled during off-peak maintenance hours.

    ## How to extend

    - Add `io.kestra.plugin.core.flow.EachSequential` to automatically iterate through all candidate tables and execute `OPTIMIZE TABLE` during scheduled maintenance windows.
    - Query `SHOW GLOBAL STATUS LIKE 'Innodb_buffer_pool_reads'` to correlate table fragmentation with cache miss spikes.
    - Export reclaimable storage metrics to Prometheus or Grafana dashboards.

    ## Links

    - Kestra MySQL Plugin Documentation: https://kestra.io/plugins/plugin-jdbc-mysql
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - MySQL OPTIMIZE TABLE Documentation: https://dev.mysql.com/doc/refman/8.0/en/optimize-table.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
