id: mysql-table-fragmentation-and-optimize-advisor
namespace: company.team

inputs:
  - id: mysql_url
    type: STRING
    defaults: "jdbc:mysql://mysql.internal:3306/app_db"
    description: "JDBC connection URL for the target MySQL database server."

  - id: mysql_username
    type: STRING
    defaults: "db_monitor"
    description: "Database user with SELECT privileges on information_schema.TABLES."

  - id: target_schema
    type: STRING
    defaults: "app_db"
    description: "Target database schema name to inspect for table fragmentation."

  - id: fragmentation_ratio_threshold
    type: FLOAT
    defaults: 0.30
    description: "Minimum ratio of DATA_FREE to total table size to qualify as fragmented (0.30 = 30%)."

  - id: min_wasted_mb_threshold
    type: INT
    defaults: 500
    description: "Minimum wasted free storage in megabytes before recommending an OPTIMIZE TABLE command."

  - id: slack_webhook_url
    type: STRING
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
    description: "Slack Incoming Webhook URL for DBA storage advisory notifications."

tasks:
  - id: query_table_free_space
    type: io.kestra.plugin.jdbc.mysql.Query
    url: "{{ inputs.mysql_url }}"
    username: "{{ inputs.mysql_username }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        TABLE_SCHEMA,
        TABLE_NAME,
        ENGINE,
        ROUND(DATA_LENGTH / 1024 / 1024, 2) AS data_size_mb,
        ROUND(INDEX_LENGTH / 1024 / 1024, 2) AS index_size_mb,
        ROUND(DATA_FREE / 1024 / 1024, 2) AS free_space_mb,
        ROUND(DATA_FREE / NULLIF(DATA_LENGTH + INDEX_LENGTH + DATA_FREE, 0), 2) AS fragmentation_ratio
      FROM information_schema.TABLES
      WHERE TABLE_SCHEMA = '{{ inputs.target_schema }}'
        AND ENGINE = 'InnoDB'
        AND DATA_FREE > 0
      ORDER BY DATA_FREE DESC;

  - id: evaluate_table_fragmentation
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      tables.json: "{{ outputs.query_table_free_space.rows | default('[]') | json }}"
    outputFiles:
      - fragmentation_report.json
    script: |
      import json
      from kestra import Kestra

      with open("tables.json", "r", encoding="utf-8") as f:
          tables = json.load(f)

      ratio_thresh = float("{{ inputs.fragmentation_ratio_threshold }}")
      min_mb_thresh = int("{{ inputs.min_wasted_mb_threshold }}")

      fragmented_tables = []
      total_reclaimable_mb = 0.0

      for t in tables:
          name = t.get("TABLE_NAME", "unknown")
          free_mb = float(t.get("free_space_mb", 0.0))
          data_mb = float(t.get("data_size_mb", 0.0))
          ratio = float(t.get("fragmentation_ratio", 0.0))

          if free_mb >= min_mb_thresh and ratio >= ratio_thresh:
              fragmented_tables.append({
                  "table": name,
                  "free_space_mb": free_mb,
                  "data_size_mb": data_mb,
                  "fragmentation_ratio": ratio,
                  "recommendation": f"OPTIMIZE TABLE `{name}`;"
              })
              total_reclaimable_mb += free_mb

      action_recommended = len(fragmented_tables) > 0

      report = {
          "schema": "{{ inputs.target_schema }}",
          "total_tables_checked": len(tables),
          "fragmented_tables_count": len(fragmented_tables),
          "total_reclaimable_mb": round(total_reclaimable_mb, 2),
          "candidate_tables": fragmented_tables
      }

      with open("fragmentation_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "action_recommended": action_recommended,
          "fragmented_count": len(fragmented_tables),
          "total_reclaimable_mb": round(total_reclaimable_mb, 2),
          "top_table": fragmented_tables[0]["table"] if fragmented_tables else "None"
      })

  - id: evaluate_advisory_trigger
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate_table_fragmentation.vars.action_recommended }}"
    then:
      - id: alert_dba_fragmentation_advisor
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ inputs.slack_webhook_url }}"
        payload: |
          {
            "text": "MySQL Storage Optimization Advisory: Found {{ outputs.evaluate_table_fragmentation.vars.fragmented_count }} fragmented tables in schema `{{ inputs.target_schema }}` with ~{{ outputs.evaluate_table_fragmentation.vars.total_reclaimable_mb }} MB of reclaimable disk space. Primary table candidate: `{{ outputs.evaluate_table_fragmentation.vars.top_table }}`. Schedule table defragmentation during off-peak maintenance window."
          }

  - id: log_fragmentation_summary
    type: io.kestra.plugin.core.log.Log
    message: "MySQL fragmentation audit completed. Fragmented tables found: {{ outputs.evaluate_table_fragmentation.vars.fragmented_count }}, Reclaimable MB: {{ outputs.evaluate_table_fragmentation.vars.total_reclaimable_mb }}."

triggers:
  - id: weekly_fragmentation_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 0"

extend:
  title: "MySQL Table Fragmentation and Optimize Advisor"
  shortDescription: "Audits InnoDB data_free space across MySQL tables and recommends storage defragmentation."
  metaTitle: "MySQL Table Fragmentation and Optimize Advisor | Kestra Blueprint"
  metaDescription: "Audits MySQL InnoDB tables for storage fragmentation bloat, recommending OPTIMIZE TABLE commands to reclaim disk space."
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
  description: |
    ### What It Does
    This blueprint queries MySQL `information_schema.TABLES` to inspect InnoDB tables where frequent deletes and updates have created significant internal free space (`DATA_FREE`). It calculates fragmentation ratios, aggregates reclaimable disk capacity, and dispatches actionable maintenance advisories with `OPTIMIZE TABLE` commands to database administrators.

    ### Prerequisites
    - Network access to MySQL via standard JDBC port (3306).
    - Database user credentials stored in secret `MYSQL_PASSWORD`.
    - Slack Incoming Webhook configured in secret `SLACK_WEBHOOK_URL`.

    ### Quick Start
    1. Configure your MySQL JDBC endpoint in `mysql_url`.
    2. Specify the target database schema in `target_schema`.
    3. Adjust `min_wasted_mb_threshold` and `fragmentation_ratio_threshold` according to your storage sizing standards.
    4. Run on a weekly schedule (default: Sunday at 04:00 UTC) to prepare maintenance window batches.

    ### Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `mysql_url` | STRING | `jdbc:mysql://...` | JDBC URL of target MySQL instance |
    | `mysql_username` | STRING | `db_monitor` | Monitoring database user |
    | `target_schema` | STRING | `app_db` | Database schema name to inspect |
    | `fragmentation_ratio_threshold` | FLOAT | `0.30` | Minimum free-to-total size ratio |
    | `min_wasted_mb_threshold` | INT | `500` | Minimum wasted MB to report table |
    | `slack_webhook_url` | STRING | `{{ secret('SLACK_WEBHOOK_URL') }}` | Slack notification destination |

    ### Expected Outputs
    - `outputs.evaluate_table_fragmentation.vars.action_recommended`: Boolean indicating if any table exceeded thresholds.
    - `outputs.evaluate_table_fragmentation.vars.total_reclaimable_mb`: Estimated total disk space in megabytes that can be reclaimed.
    - `outputs.evaluate_table_fragmentation.outputFiles['fragmentation_report.json']`: JSON report listing candidate tables and SQL statements.

    ### Common Pitfalls
    - In MySQL InnoDB with `innodb_file_per_table=ON`, `OPTIMIZE TABLE` rebuilds the table and requires sufficient temporary disk space equal to the table size.
    - Rebuilding tables causes disk I/O load and should only be performed during off-peak maintenance hours.
