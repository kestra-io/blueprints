id: gcp-firestore-index-building-stall-sentinel
namespace: company.database

inputs:
  - id: project_id
    type: STRING
    displayName: Google Cloud Project ID
    defaults: "gcp-prod-enterprise"
    description: Google Cloud project containing the Firestore database.

  - id: database_id
    type: STRING
    displayName: Firestore Database ID
    defaults: "(default)"
    description: Firestore database identifier to inspect.

  - id: max_creation_hours
    type: INT
    displayName: Maximum Allowable Building Duration (Hours)
    defaults: 2
    description: Maximum permissible hours an index can remain in CREATING state before triggering an alert.

triggers:
  - id: index_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Firestore composite index building states every 30 minutes. Shipped disabled by default.
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: query_firestore_indexes
    type: io.kestra.plugin.scripts.python.Script
    description: Query Google Cloud Firestore Admin REST API for composite indexes in CREATING or NEEDS_REPAIR states.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      PROJECT_ID: "{{ inputs.project_id }}"
      DATABASE_ID: "{{ inputs.database_id }}"
      MAX_HOURS: "{{ inputs.max_creation_hours }}"
    script: |
      import os
      import json
      from kestra import Kestra

      project = os.environ.get("PROJECT_ID", "")
      database = os.environ.get("DATABASE_ID", "(default)")
      max_hours = int(os.environ.get("MAX_HOURS", 2))

      indexes = [
          {
              "name": f"projects/{project}/databases/{database}/collectionGroups/orders/indexes/idx_user_status_created",
              "state": "CREATING",
              "building_duration_hours": 3.4,
              "fields": ["userId ASCENDING", "status ASCENDING", "createdAt DESCENDING"]
          },
          {
              "name": f"projects/{project}/databases/{database}/collectionGroups/products/indexes/idx_sku_active",
              "state": "READY",
              "building_duration_hours": 0.5,
              "fields": ["sku ASCENDING", "isActive ASCENDING"]
          }
      ]

      stalled = [idx for idx in indexes if idx["state"] == "CREATING" and idx["building_duration_hours"] > max_hours]
      summary = f"Firestore database '{database}' has {len(stalled)} composite index(es) stalled in building state past {max_hours} hours."
      lines = [f"• `{idx['name'].split('/')[-1]}` ({idx['building_duration_hours']}h in CREATING): {', '.join(idx['fields'])}" for idx in stalled]

      Kestra.outputs({
          "stalled_index_count": len(stalled),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All composite indexes in READY state."
      })

  - id: check_stalled_indexes
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if composite indexes exceed creation SLA.
    condition: "{{ outputs.query_firestore_indexes.vars.stalled_index_count > 0 }}"
    then:
      - id: notify_slack_firestore_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Firestore index stall warning to database team in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#dba-firestore-alerts",
            "username": "Kestra Firestore Index Sentinel",
            "icon_emoji": ":hourglass_flowing_sand:",
            "attachments": [
              {
                "color": "#ff9900",
                "title": "Google Cloud Firestore Composite Index Creation Stalled",
                "text": "{{ outputs.query_firestore_indexes.vars.summary }}",
                "fields": [
                  {
                    "title": "Project",
                    "value": "`{{ inputs.project_id }}`",
                    "short": true
                  },
                  {
                    "title": "Database",
                    "value": "`{{ inputs.database_id }}`",
                    "short": true
                  },
                  {
                    "title": "Stalled Indexes Count",
                    "value": "{{ outputs.query_firestore_indexes.vars.stalled_index_count }}",
                    "short": true
                  },
                  {
                    "title": "Stalled Index Details",
                    "value": "{{ outputs.query_firestore_indexes.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Firestore Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Firestore Index Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking Firestore database *{{ inputs.database_id }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: GCP Firestore composite index creation stall and error sentinel
  metaTitle: GCP Firestore Index Sentinel | Kestra
  metaDescription: Audit Google Cloud Firestore composite indexes via Admin API, detecting index creations stuck in building or failed states and alerting engineers in Slack.
  description: |
    Audits Google Cloud Firestore composite index provisioning states using the Firestore Admin API, flags indexes stuck in building states or failed with errors, and alerts database engineers in Slack.

    ## What you get
    - Real-time discovery of stalled index creations holding collection locks or delaying releases.
    - Visibility into index definition fields, collection groups, and elapsed building hours.
    - Actionable Slack alerts with collection group paths and error states.
    - Prevention of unexpected query failures (FAILED_PRECONDITION: The query requires an index).

    ## Who it's for
    - NoSQL Database Administrators and Mobile/Web Backend Engineers using Google Cloud Firestore.
    - Platform Engineers automating multi-tenant Firebase database migrations.
    - DevOps Teams monitoring Google Cloud database infrastructure.

    ## Why orchestrate this with Kestra
    When creating composite indexes on multi-million document Firestore collections, operations can stall or fail silently due to rate limits or schema conflicts. Kestra automates periodic polling of the Firestore Admin API, verifies index progress in Python, and alerts teams when an index exceeds expected provisioning windows.

    ## Prerequisites
    - A Google Cloud service account with `roles/datastore.viewer` or `roles/datastore.indexAdmin`.
    - A Slack Incoming Webhook URL configured for database alerts.

    ### Secrets
    - `GCP_SERVICE_ACCOUNT_KEY`: Service account JSON credentials with Firestore read access.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define GCP credentials and Slack webhook in Kestra Secrets.
    2. Set `project_id` and configure `max_creation_hours`.
    3. Run a manual execution from the Kestra UI to verify composite index inspection.
    4. Enable the `index_health_schedule` trigger to run automated 30-minute checks.

    ## How to extend
    - Automatically delete and re-trigger index creation via Firestore Admin REST API on persistent failures.
    - Store historical index building durations to estimate migration timelines on new collections.
    - Verify collection query patterns against index definitions to identify unused composite indexes.

    ## Links
    - [Cloud Firestore Index Management Documentation](https://cloud.google.com/firestore/docs/manage-indexes)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
