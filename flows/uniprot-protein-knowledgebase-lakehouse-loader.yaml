id: uniprot-protein-knowledgebase-lakehouse-loader
namespace: company.analytics
description: Ingests primary protein sequences, accession IDs, organism taxonomies, and amino acid lengths from UniProtKB into Parquet lakehouse storage via DuckDB, tracking proteomic sequences in Kestra KV store.

inputs:
  - id: search_query
    type: STRING
    description: Protein or gene query term across UniProtKB.
    defaults: "human insulin"

  - id: size
    type: INT
    description: Number of protein entry records to harvest.
    defaults: 20

  - id: sequence_length_threshold
    type: INT
    description: Minimum amino acid sequence length to classify proteins as complex polypeptides.
    defaults: 100

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known UniProt accession IDs.
    defaults: uniprot_monitored_proteins_state

variables:
  default_state: "[]"

triggers:
  - id: monthly_proteomics_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 1 * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_proteins
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import urllib.parse
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_accessions = set(json.loads(raw_state)) if raw_state else set()
        except Exception:
            seen_accessions = set()

        q = "{{ inputs.search_query }}"
        size = int("{{ inputs.size }}")
        threshold = int("{{ inputs.sequence_length_threshold }}")

        encoded_q = urllib.parse.quote(q)
        url = f"https://rest.uniprot.org/uniprotkb/search?query={encoded_q}&size={size}&format=json"
        headers = {"User-Agent": "KestraProteomicsLakehouse/1.0 (bioinformatics-ops@kestra.io)"}

        records = []
        complex_proteins = []
        harvested_accessions = []

        try:
            resp = requests.get(url, headers=headers, timeout=25)
            if resp.status_code == 200:
                data = resp.json()
                results = data.get("results", [])
                for entry in results:
                    acc = entry.get("primaryAccession", "")
                    entry_type = entry.get("entryType", "")

                    organism = entry.get("organism", {}).get("scientificName", "")
                    taxon_id = int(entry.get("organism", {}).get("taxonId", 0) or 0)

                    protein_desc = entry.get("proteinDescription", {})
                    rec_name = protein_desc.get("recommendedName", {}).get("fullName", {}).get("value", "")

                    seq_info = entry.get("sequence", {})
                    seq_len = int(seq_info.get("length", 0) or 0)
                    mol_weight = int(seq_info.get("molWeight", 0) or 0)

                    is_complex = seq_len >= threshold
                    is_new = acc not in seen_accessions

                    harvested_accessions.append(acc)

                    records.append({
                        "primary_accession": acc,
                        "entry_type": entry_type,
                        "protein_name": rec_name,
                        "organism_scientific_name": organism,
                        "taxon_id": taxon_id,
                        "sequence_length_aa": seq_len,
                        "molecular_weight_da": mol_weight,
                        "is_complex_polypeptide": is_complex,
                        "is_new_entry": is_new,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_complex:
                        complex_proteins.append({"acc": acc, "name": rec_name, "len": seq_len})
        except Exception as e:
            print(f"Error fetching UniProt proteins: {e}")

        with open("uniprot_proteins.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE uniprot_proteins AS SELECT * FROM read_json_auto('uniprot_proteins.json')")
            con.execute("COPY uniprot_proteins TO 'uniprot_proteomics_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY uniprot_proteins TO 'uniprot_proteomics_archive.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE uniprot_proteins (
                    primary_accession VARCHAR,
                    entry_type VARCHAR,
                    protein_name VARCHAR,
                    organism_scientific_name VARCHAR,
                    taxon_id INTEGER,
                    sequence_length_aa INTEGER,
                    molecular_weight_da BIGINT,
                    is_complex_polypeptide BOOLEAN,
                    is_new_entry BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY uniprot_proteins TO 'uniprot_proteomics_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY uniprot_proteins TO 'uniprot_proteomics_archive.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_harvested_proteins": len(records),
            "complex_proteins_count": len(complex_proteins),
            "complex_proteins": complex_proteins[:5],
            "updated_state": list(set(list(seen_accessions) + harvested_accessions))[:500]
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - uniprot_proteomics_archive.parquet
      - uniprot_proteomics_archive.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_proteins.vars.updated_state | toJson }}"

  - id: check_complex_proteins
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_proteins.vars.complex_proteins_count > 0 }}"
    then:
      - id: notify_complex_proteins
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "🧬 Proteomics Sequence Ingestion: Harvested {{ outputs.ingest_and_transform_proteins.vars.complex_proteins_count }} protein(s) with sequences exceeding {{ inputs.sequence_length_threshold }} amino acids."

outputs:
  - id: total_proteins
    type: INT
    value: "{{ outputs.ingest_and_transform_proteins.vars.total_harvested_proteins }}"
  - id: complex_proteins_count
    type: INT
    value: "{{ outputs.ingest_and_transform_proteins.vars.complex_proteins_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_proteins.outputFiles['uniprot_proteomics_archive.parquet'] }}"

extend:
  title: UniProt Knowledgebase Protein Sequences Lakehouse Loader with DuckDB
  metaTitle: UniProt Protein Sequences Lakehouse Loader | Kestra
  shortDescription: Ingests primary protein sequences, accession IDs, organism taxonomies, and amino acid lengths from UniProtKB into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll UniProt REST API for protein sequences, convert proteomic taxonomy into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, bioinformatics harmonization, and analytical lakehouse persistence of protein
    accessions, scientific organism taxonomies, amino acid lengths, and molecular weights from UniProt into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`uniprot_monitored_proteins_state`) for previously verified UniProt accession identifiers.
    2. **UniProt REST Ingestion**: Queries the official UniProtKB REST API (`rest.uniprot.org/uniprotkb/search`) across target gene or protein queries.
    3. **DuckDB Proteomics Normalization**: Unpacks primary accessions, organism names, taxon IDs, and amino acid lengths into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized proteomic records into columnar Parquet and CSV files for structural biology modeling and genomic feature stores.
    5. **Sequence Evaluation & State Commitment**: Detects complex polypeptides meeting length criteria and commits accessions to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of institutional-grade proteomic sequence catalogs.
    - Columnar Parquet datasets queryable with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Bioinformaticians and Structural Biologists training protein folding models.
    - Genomic Data Scientists maintaining master biological reference dimensions.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical accession states across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `rest.uniprot.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding proteomic harvest summaries.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set your target `search_query` (e.g. `human insulin`, `hemoglobin`).
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `monthly_proteomics_sync` schedule for automated monthly updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition monthly proteomic reference archives.
    - Connect an ESMFold or AlphaFold sequence prediction container step downstream.

    ## Links

    - [UniProt REST API Documentation](https://www.uniprot.org/help/api)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
