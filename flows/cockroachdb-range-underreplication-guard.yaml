id: cockroachdb-range-underreplication-guard
namespace: company.team

description: |
  Find CockroachDB ranges that have fewer replicas than their zone asks for, name the database and
  table they belong to. Then it says which of three states the cluster is in: ranges with no quorum,
  zones still catching up. The third is a zone config that asks for more replicas than there are live nodes.
  The last one never fixes itself. With approval, lower that zone's num_replicas to the live node
  count, then read the replication report again and fail the run if the count did not fall.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: JDBC URL
    description: Any CockroachDB node. The SQL port is 26257 by default.
    defaults: "jdbc:postgresql://localhost:26257/defaultdb?sslmode=require"

  - id: include_internal_zones
    type: BOOL
    displayName: Also fix CockroachDB internal zones
    description: >-
      CockroachDB asks for 5 replicas on its own system zones, so every cluster with fewer than 5
      nodes reports them as under-replicated. They are always listed. Turn this on to let the
      remediation lower them too, which reduces the durability of cluster metadata.
    defaults: false

  - id: max_report_age_seconds
    type: INT
    displayName: Maximum replication report age
    description: The replication report is rebuilt every kv.replication_reports.interval, one minute by default. Fail rather than audit a report older than this.
    defaults: 900

  - id: settle_duration
    type: DURATION
    displayName: Settle time before re-verify
    description: How long to wait after the zone change for the next replication report. Must be longer than kv.replication_reports.interval.
    defaults: PT150S

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, before any zone is changed.
    defaults: true

variables:
  cluster_sql: |
    WITH nodes AS (
      SELECT count(*) FILTER (WHERE n.is_live)::INT8 AS live_nodes,
             count(*) FILTER (WHERE NOT n.is_live AND coalesce(l.membership, 'active') = 'active')::INT8 AS dead_nodes,
             count(*) FILTER (WHERE coalesce(l.membership, 'active') != 'active')::INT8 AS leaving_nodes
        FROM crdb_internal.gossip_nodes n
        LEFT JOIN crdb_internal.gossip_liveness l ON l.node_id = n.node_id
    ), zc AS (
      SELECT target,
             coalesce(substring(full_config_sql, 'num_replicas = ([0-9]+)')::INT8, 0) AS num_replicas,
             ((target LIKE 'RANGE %' AND target != 'RANGE default') OR coalesce(database_name, '') = 'system') AS internal_zone
        FROM crdb_internal.zones
    ), agg AS (
      SELECT coalesce(sum(s.total_ranges), 0)::INT8 AS total_ranges,
             coalesce(sum(s.unavailable_ranges), 0)::INT8 AS unavailable_ranges,
             coalesce(sum(s.under_replicated_ranges), 0)::INT8 AS under_replicated_ranges,
             coalesce(sum(s.over_replicated_ranges), 0)::INT8 AS over_replicated_ranges,
             max(m.generated) AS generated
        FROM system.replication_stats s JOIN system.reports_meta m ON m.id = s.report_id
    )
    SELECT n.live_nodes, n.dead_nodes, n.leaving_nodes,
           a.total_ranges, a.unavailable_ranges, a.under_replicated_ranges, a.over_replicated_ranges,
           (SELECT count(*) FROM zc z, nodes nn
             WHERE z.num_replicas > nn.live_nodes
               AND (NOT z.internal_zone OR {{ inputs.include_internal_zones }}))::INT8 AS impossible_zones,
           (SELECT count(*) FROM zc z, nodes nn WHERE z.num_replicas > nn.live_nodes)::INT8 AS impossible_zones_all,
           coalesce(extract(EPOCH FROM a.generated)::INT8, -1) AS report_epoch,
           coalesce(extract(EPOCH FROM (now() - a.generated))::INT8, -1) AS report_age_seconds
      FROM nodes n CROSS JOIN agg a

  audit_sql: |
    WITH nodes AS (
      SELECT count(*) FILTER (WHERE n.is_live)::INT8 AS live_nodes,
             count(*) FILTER (WHERE NOT n.is_live AND coalesce(l.membership, 'active') = 'active')::INT8 AS dead_nodes
        FROM crdb_internal.gossip_nodes n
        LEFT JOIN crdb_internal.gossip_liveness l ON l.node_id = n.node_id
    ), zc AS (
      SELECT zone_id, subzone_id, target,
             coalesce(database_name, '') AS database_name,
             coalesce(table_name, '') AS table_name,
             coalesce(index_name, '') AS index_name,
             coalesce(partition_name, '') AS partition_name,
             coalesce(substring(full_config_sql, 'num_replicas = ([0-9]+)')::INT8, 0) AS num_replicas,
             ((target LIKE 'RANGE %' AND target != 'RANGE default') OR coalesce(database_name, '') = 'system') AS internal_zone
        FROM crdb_internal.zones
    ), report AS (
      SELECT s.zone_id, s.subzone_id, s.total_ranges, s.unavailable_ranges,
             s.under_replicated_ranges, s.over_replicated_ranges
        FROM system.replication_stats s
    )
    SELECT r.zone_id, r.subzone_id,
           coalesce(z.target, 'ZONE ' || r.zone_id::STRING) AS zone_target,
           coalesce(z.database_name, '') AS database_name,
           coalesce(z.table_name, '') AS table_name,
           coalesce(z.index_name, '') AS index_name,
           coalesce(z.partition_name, '') AS partition_name,
           coalesce(z.internal_zone, true) AS internal_zone,
           r.total_ranges, r.unavailable_ranges, r.under_replicated_ranges, r.over_replicated_ranges,
           coalesce(z.num_replicas, 0) AS num_replicas, n.live_nodes, n.dead_nodes,
           CASE
             WHEN r.unavailable_ranges > 0 THEN 'UNAVAILABLE'
             WHEN coalesce(z.num_replicas, 0) > n.live_nodes THEN 'ZONE_IMPOSSIBLE'
             WHEN r.under_replicated_ranges > 0 THEN 'UNDER_REPLICATED_TRANSIENT'
             ELSE 'OVER_REPLICATED'
           END AS state,
           CASE
             WHEN coalesce(z.num_replicas, 0) > n.live_nodes AND z.target IS NOT NULL
                  AND (NOT z.internal_zone OR {{ inputs.include_internal_zones }})
             THEN 'ALTER ' || z.target || ' CONFIGURE ZONE USING num_replicas = ' || n.live_nodes::STRING
           END AS fix_sql
      FROM report r
      LEFT JOIN zc z ON z.zone_id = r.zone_id AND z.subzone_id = r.subzone_id
      CROSS JOIN nodes n
     WHERE r.unavailable_ranges > 0 OR r.under_replicated_ranges > 0
        OR r.over_replicated_ranges > 0 OR coalesce(z.num_replicas, 0) > n.live_nodes
     ORDER BY r.unavailable_ranges DESC, r.under_replicated_ranges DESC, r.zone_id, r.subzone_id

  tables_sql: |
    WITH ln AS (
      SELECT node_id FROM crdb_internal.gossip_nodes WHERE is_live
    ), zc AS (
      SELECT target, database_name, schema_name, table_name, index_name, partition_name,
             substring(full_config_sql, 'num_replicas = ([0-9]+)')::INT8 AS num_replicas
        FROM crdb_internal.zones
    ), dflt AS (
      SELECT max(num_replicas) AS num_replicas FROM zc WHERE target = 'RANGE default'
    ), tz AS (
      SELECT database_name, schema_name, table_name, max(num_replicas) AS num_replicas
        FROM zc WHERE table_name IS NOT NULL AND index_name IS NULL AND partition_name IS NULL
       GROUP BY 1, 2, 3
    ), dz AS (
      SELECT database_name, max(num_replicas) AS num_replicas
        FROM zc WHERE database_name IS NOT NULL AND table_name IS NULL GROUP BY 1
    ), rr AS (
      SELECT range_id,
             coalesce(database_name, '(cluster internal)') AS database_name,
             coalesce(schema_name, '') AS schema_name,
             coalesce(table_name, '(system ranges)') AS table_name,
             voting_replicas, learner_replicas
        FROM [SHOW CLUSTER RANGES WITH TABLES]
    ), rv AS (
      SELECT r.range_id, count(*)::INT8 AS voters,
             count(*) FILTER (WHERE ln.node_id IS NOT NULL)::INT8 AS live_voters
        FROM (SELECT range_id, unnest(voting_replicas) AS nid FROM rr) r
        LEFT JOIN ln ON ln.node_id = r.nid
       GROUP BY 1
    ), rng AS (
      SELECT r.range_id, r.database_name, r.schema_name, r.table_name,
             coalesce(rv.voters, 0)::INT8 AS voters,
             coalesce(rv.live_voters, 0)::INT8 AS live_voters,
             coalesce(array_length(r.learner_replicas, 1), 0)::INT8 AS learners,
             (r.database_name IN ('system', '(cluster internal)')) AS internal_table
        FROM rr r LEFT JOIN rv ON rv.range_id = r.range_id
    )
    SELECT r.database_name, r.schema_name, r.table_name, r.internal_table,
           coalesce(tz.num_replicas, dz.num_replicas, d.num_replicas)::INT8 AS target_replicas,
           count(*)::INT8 AS ranges_affected,
           min(r.live_voters)::INT8 AS min_live_voters,
           max(r.live_voters)::INT8 AS max_live_voters,
           min(r.voters)::INT8 AS min_assigned_voters,
           sum(r.learners)::INT8 AS learners,
           count(*) FILTER (WHERE r.live_voters * 2 <= r.voters)::INT8 AS ranges_without_quorum,
           left(string_agg(r.range_id::STRING, ',' ORDER BY r.range_id), 60) AS sample_range_ids
      FROM rng r
      LEFT JOIN tz ON tz.database_name = r.database_name AND tz.schema_name = r.schema_name AND tz.table_name = r.table_name
      LEFT JOIN dz ON dz.database_name = r.database_name
     CROSS JOIN dflt d
     WHERE r.live_voters < coalesce(tz.num_replicas, dz.num_replicas, d.num_replicas)
     GROUP BY 1, 2, 3, 4, 5
     ORDER BY ranges_without_quorum DESC, r.internal_table, min_live_voters, ranges_affected DESC, 1, 3
     LIMIT 50

tasks:
  - id: cluster_before
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Read-only. Node liveness from crdb_internal.gossip_nodes and gossip_liveness, the cluster
      totals from the replication report. It also counts how many zones ask for more replicas than there are
      live nodes.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('COCKROACHDB_USERNAME') }}"
    password: "{{ secret('COCKROACHDB_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: "{{ render(vars.cluster_sql) }}"

  - id: report_freshness
    type: io.kestra.plugin.core.flow.If
    description: The whole audit reads one report. A report that was never built would read as a healthy cluster. So would one far older than its interval.
    condition: "{{ outputs.cluster_before.row.report_epoch < 0 or outputs.cluster_before.row.report_age_seconds > inputs.max_report_age_seconds }}"
    then:
      - id: stale_report
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The replication report is {{ outputs.cluster_before.row.report_age_seconds }}s old (report_epoch {{ outputs.cluster_before.row.report_epoch }}; -1 means it was never built). Check SHOW CLUSTER SETTING kv.replication_reports.interval, which must not be zero. Check also that the audit role can read system.replication_stats."

  - id: audit
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Read-only. One row per zone with a replication problem, classified UNAVAILABLE,
      ZONE_IMPOSSIBLE, UNDER_REPLICATED_TRANSIENT or OVER_REPLICATED. Only ZONE_IMPOSSIBLE gets a
      fix. Internal zones are fixed only when include_internal_zones is on.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('COCKROACHDB_USERNAME') }}"
    password: "{{ secret('COCKROACHDB_PASSWORD') }}"
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: affected_tables
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Read-only. The replication report is keyed by zone, so a table with no zone config of its own
      is counted under RANGE default. This names the databases and tables whose ranges hold fewer
      voting replicas ON LIVE NODES than their effective zone asks for, so a range whose replicas
      are assigned to a dead node is named rather than counted as healthy.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('COCKROACHDB_USERNAME') }}"
    password: "{{ secret('COCKROACHDB_PASSWORD') }}"
    fetchType: FETCH
    sql: "{{ render(vars.tables_sql) }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      CockroachDB replication: {{ outputs.cluster_before.row.live_nodes }} live nodes,
      {{ outputs.cluster_before.row.dead_nodes }} dead, {{ outputs.cluster_before.row.leaving_nodes }} leaving or decommissioned.
      {{ outputs.cluster_before.row.total_ranges }} ranges in the report ({{ outputs.cluster_before.row.report_age_seconds }}s old):
      {{ outputs.cluster_before.row.unavailable_ranges }} unavailable, {{ outputs.cluster_before.row.under_replicated_ranges }} under-replicated,
      {{ outputs.cluster_before.row.over_replicated_ranges }} over-replicated.
      {{ outputs.cluster_before.row.impossible_zones_all }} zones ask for more replicas than there are live nodes,
      {{ outputs.cluster_before.row.impossible_zones }} of them in scope.
      {% for r in outputs.audit.rows %}{{ r.state }} {{ r.zone_target }}: {{ r.under_replicated_ranges }} under-replicated and {{ r.unavailable_ranges }} unavailable of {{ r.total_ranges }} ranges, num_replicas {{ r.num_replicas }} vs {{ r.live_nodes }} live nodes{{ (r.fix_sql ?? '') == '' ? ' (report only)' : ', fix: ' ~ r.fix_sql }}. {% endfor %}
      {% for t in outputs.affected_tables.rows %}Table {{ t.database_name }}.{{ t.table_name }}: {{ t.ranges_affected }} ranges at {{ t.min_live_voters }} to {{ t.max_live_voters }} live voting replicas against a target of {{ t.target_replicas }}, {{ t.ranges_without_quorum }} without quorum, ranges {{ t.sample_range_ids }}. {% endfor %}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'CockroachDB ' ~ inputs.jdbc_url ~ ': ' ~ outputs.cluster_before.row.under_replicated_ranges ~ ' under-replicated and ' ~ outputs.cluster_before.row.unavailable_ranges ~ ' unavailable ranges across ' ~ outputs.cluster_before.row.total_ranges ~ ', on ' ~ outputs.cluster_before.row.live_nodes ~ ' live nodes and ' ~ outputs.cluster_before.row.dead_nodes ~ ' dead. ' ~ (outputs.audit.rows | jq('map("\(.state) \(.zone_target) (\(.under_replicated_ranges) under-replicated, \(.unavailable_ranges) unavailable, num_replicas \(.num_replicas))") | join("; ")') | first) ~ '. Tables: ' ~ (outputs.affected_tables.rows | jq('if length == 0 then "none named" else map("\(.database_name).\(.table_name) x\(.ranges_affected) at \(.min_voters) voters") | join("; ") end') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Asking for approval to lower num_replicas.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and (outputs.audit.rows | jq('map(select((.fix_sql // \"\") != \"\")) | length') | first) > 0 }}"
        then:
          - id: approve
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              num_replicas is a durability setting, so the run holds here. CockroachDB wants an odd
              replication factor, so on an even live node count consider the next lower odd number
              instead. Another option is to bring the dead node back rather than lower the target at all.
            pauseDuration: PT1H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                displayName: Approve the zone change
                description: Set to true to lower num_replicas to the live node count on every zone listed as in scope.
                defaults: false
              - id: change_ticket
                type: STRING
                displayName: Change record
                defaults: ""

          - id: approval_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approve.onResume.approved }}"
            then:
              - id: remediate
                type: io.kestra.plugin.core.flow.Loop
                description: One ALTER CONFIGURE ZONE at a time. Zone configs are written to a single system table, so parallel writes would conflict.
                concurrencyLimit: 1
                values: "{{ outputs.audit.rows | jq('map(select((.fix_sql // \"\") != \"\") | .fix_sql) | unique') | first | toJson }}"
                tasks:
                  - id: apply_zone_change
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    allowFailure: true
                    url: "{{ inputs.jdbc_url }}"
                    username: "{{ secret('COCKROACHDB_USERNAME') }}"
                    password: "{{ secret('COCKROACHDB_PASSWORD') }}"
                    fetchType: NONE
                    sql: "{{ item.value }}"

              - id: settle
                type: io.kestra.plugin.core.flow.Sleep
                description: The replication report is rebuilt on an interval, so the next read has to be of a newer report.
                duration: "{{ inputs.settle_duration }}"

              - id: cluster_after
                type: io.kestra.plugin.jdbc.postgresql.Query
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('COCKROACHDB_USERNAME') }}"
                password: "{{ secret('COCKROACHDB_PASSWORD') }}"
                fetchType: FETCH_ONE
                sql: "{{ render(vars.cluster_sql) }}"

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: >-
                  {{ outputs.cluster_after.row.impossible_zones > 0
                     or outputs.cluster_after.row.report_epoch <= outputs.cluster_before.row.report_epoch
                     or outputs.cluster_after.row.under_replicated_ranges >= outputs.cluster_before.row.under_replicated_ranges }}
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      Zone change did not land. In scope zones still asking for more replicas than
                      live nodes: {{ outputs.cluster_after.row.impossible_zones }} (was {{ outputs.cluster_before.row.impossible_zones }}).
                      Under-replicated ranges {{ outputs.cluster_before.row.under_replicated_ranges }} before,
                      {{ outputs.cluster_after.row.under_replicated_ranges }} after.
                      Report epoch {{ outputs.cluster_before.row.report_epoch }} before, {{ outputs.cluster_after.row.report_epoch }} after;
                      when those are equal the re-verify read the same report and settle_duration needs to be longer than
                      kv.replication_reports.interval. Check the apply_zone_change logs for a rejected ALTER.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Applied: {{ outputs.audit.rows | jq('map(select((.fix_sql // "") != "") | .fix_sql) | unique | join("; ")') | first }}.
                      Change record {{ outputs.approve.onResume.change_ticket == '' ? 'not given' : outputs.approve.onResume.change_ticket }}.
                      Under-replicated ranges {{ outputs.cluster_before.row.under_replicated_ranges }} to {{ outputs.cluster_after.row.under_replicated_ranges }},
                      unavailable {{ outputs.cluster_before.row.unavailable_ranges }} to {{ outputs.cluster_after.row.unavailable_ranges }},
                      in scope impossible zones {{ outputs.cluster_before.row.impossible_zones }} to {{ outputs.cluster_after.row.impossible_zones }},
                      measured against a report {{ outputs.cluster_after.row.report_age_seconds }}s old.
            else:
              - id: approval_declined
                type: io.kestra.plugin.core.log.Log
                message: "Approval declined. No zone changed. {{ outputs.cluster_before.row.impossible_zones }} zones still ask for more replicas than there are live nodes."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "Every range in the report has the replicas its zone asks for, on {{ outputs.cluster_before.row.live_nodes }} live nodes."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'CockroachDB range under-replication guard failed on ' ~ inputs.jdbc_url ~ ' (execution ' ~ execution.id ~ '). A cluster that cannot answer the audit is itself worth looking at. Check the logs.'} | toJson }}

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Always runs in safe mode.
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: CockroachDB Range Under-Replication Guard
  shortDescription: Find CockroachDB ranges with fewer replicas than their zone asks for. Name the affected tables. Tell a node catching up apart from a zone config that can never be satisfied. Lower num_replicas to the live node count after approval.
  metaTitle: CockroachDB Range Under-Replication Guard with Kestra
  metaDescription: Audit CockroachDB under-replicated and unavailable ranges, name the tables, alert Slack, fix impossible zone configs after approval and verify.
  description: |
    CockroachDB splits a table into ranges and keeps each one replicated, three times by default. Lose a node and the ranges that had a replica on it carry one fewer copy until the cluster rebuilds them somewhere else. Lose enough copies and a range has no quorum, so reads and writes against that key span hang or error while the rest of the cluster serves normally. That is what makes it hard to notice. The cluster looks healthy and one table stops answering.

    There is a worse version that never clears. A zone config asking for `num_replicas = 5` on a three node cluster leaves its ranges under-replicated for as long as that config stands. The allocator has nowhere to put the fourth and fifth copy. Waiting does nothing. A dashboard that shows only a count of under-replicated ranges cannot tell that apart from a node that is three minutes into catching up.

    This blueprint reads CockroachDB's own replication report and joins it to the zone configs and to node liveness. Then it says which of those two cases it is. It names the databases and tables behind the affected ranges. With approval, it lowers an impossible zone's `num_replicas` to the live node count, then reads a newer report and fails the run if the count did not fall.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    - The replication report lives in `system.replication_stats`, keyed by `zone_id` and `subzone_id`. It is rebuilt every `kv.replication_reports.interval`, one minute by default. `system.reports_meta` carries the build time, so a run can tell how old the numbers it is reading are. There is no `crdb_internal.replication_stats`.
    - A table with no zone config of its own is counted under `RANGE default`, so the report alone never names it. The table names come from `SHOW CLUSTER RANGES WITH TABLES`, with the effective target resolved from the table zone, then the database zone, then `RANGE default`.
    - CockroachDB asks for 5 replicas on `DATABASE system`, `RANGE meta`, `RANGE system` and `RANGE liveness`. On a three node cluster that is 64 permanently under-replicated ranges out of the box, with no user mistake behind it. They are listed every run. They are left out of the remediation unless `include_internal_zones` is on, because lowering them reduces the durability of cluster metadata.

    ## Safety

    - Every read is a catalog or report query. Nothing touches user data.
    - A zone is only changed when `auto_remediate` is true, when `dry_run` is false and when a human resumes the `Pause`.
    - The only statement the flow ever writes is `ALTER <target> CONFIGURE ZONE USING num_replicas = <live node count>`, built from `crdb_internal.zones.target`. It never drops a zone. It never raises a replica count. It never touches constraints or lease preferences.
    - CockroachDB internal zones are out of scope by default.
    - A report that was never built fails the run. So does one older than `max_report_age_seconds`. A quiet report never reads as a healthy cluster.

    ## How it works

    1. `cluster_before` (`io.kestra.plugin.jdbc.postgresql.Query`, read-only) counts live, dead and leaving nodes from `crdb_internal.gossip_nodes` and `crdb_internal.gossip_liveness`. It sums the replication report. It counts the zones asking for more replicas than there are live nodes. It returns the report age.
    2. `report_freshness` (`io.kestra.plugin.core.flow.If`) fails the run when the report was never built or is older than `max_report_age_seconds`.
    3. `audit` returns one row per zone with a problem: the zone target, its `num_replicas` pulled out of `full_config_sql`, the range counts and a state.

       | State | Meaning | Fix |
       |---|---|---|
       | `UNAVAILABLE` | Ranges in the zone have lost quorum. Queries on that key span hang or error | Page. Bring the nodes back |
       | `ZONE_IMPOSSIBLE` | `num_replicas` is higher than the live node count, so the target cannot be reached | Lower `num_replicas` or add nodes |
       | `UNDER_REPLICATED_TRANSIENT` | Below target while the target is reachable, so the allocator is rebuilding copies | Wait, then re-check |
       | `OVER_REPLICATED` | More replicas than the zone asks for, usually mid-rebalance | Wait, then re-check |

    4. `affected_tables` names the databases and tables whose ranges hold fewer voting replicas than their effective target, with range ids to check by hand.
    5. `summary` logs every zone and every table.
    6. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs it.
       - **findings:** `alert` posts the states, the zones and the named tables to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true, when `dry_run` is false and when at least one zone has a fix.
         - `approve` (`io.kestra.plugin.core.flow.Pause`) holds for up to an hour and records who approved and under which change record. `behavior: FAIL` means an ignored request fails loudly rather than changing a durability setting on its own.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs one `ALTER ... CONFIGURE ZONE` at a time.
         - `settle` waits and `cluster_after` reads the report again. `verify_result` fails unless three things hold: the report is newer than the one audited, no in scope zone still asks for more replicas than there are live nodes, and the under-replicated count fell.
    7. `errors` alerts Slack when the audit itself cannot run.

    ## What you get

    - A count of under-replicated ranges split into the two cases that need opposite responses: wait, or change a config.
    - The databases and tables behind the ranges, which the replication report does not carry.
    - An impossible zone config lowered to a target the cluster can actually reach, behind a human approval.
    - Before and after numbers from two different reports, so a green result is a measurement rather than an assumption.

    ## Who it's for

    - Teams running CockroachDB who want under-replication triaged before a table stops answering.
    - Platform engineers after a node loss, a rolling upgrade or a region change, who need to know whether the cluster is still catching up or has stopped trying.
    - Anyone who has set `num_replicas` higher than the node count and watched the figure never come down.

    ## Why orchestrate this with Kestra

    Under-replication is a state, not an event. The thing that matters is how long it lasts. Kestra runs the same audit every fifteen minutes, keeps each run with its numbers and sends the zones and tables to Slack. The fix is a durability change, so it sits behind `auto_remediate`, `dry_run` and a `Pause` that records the approver and the change record. The run reports success only after a newer report says the count fell.

    ## Tested end to end

    On Kestra 2.0.5 OSS against a five node CockroachDB v24.1 cluster, with a local HTTP sink standing in for Slack. Each node was given its own locality so replicas spread. `server.time_until_store_dead` was raised to 20 minutes so a stopped node held the cluster in the under-replicated state long enough to run the flow against it.

    | Run | Cluster state | Result |
    |---|---|---|
    | 1 | 5 live nodes, no zone overrides | Clean. 0 unavailable, 0 under-replicated of 68 ranges |
    | 2 | `shop.orders` set to `num_replicas = 7` | 1 finding, `ZONE_IMPOSSIBLE` on `TABLE shop.public.orders`, 10 of 10 ranges under-replicated, 7 wanted against 5 live. `shop.orders` named with 10 ranges at 5 voting replicas. Alert sent, no change |
    | 3 | same, `auto_remediate: true`, `dry_run: true` | Same report, zone still at 7 when checked with `cockroach sql` |
    | 4 | same, `auto_remediate: true`, `dry_run: false`, approval declined | `Pause` held, resumed with `approved: false`, zone still at 7 |
    | 5 | same, `auto_remediate: true`, `dry_run: false`, approved | `ALTER TABLE shop.public.orders CONFIGURE ZONE USING num_replicas = 5` applied, under-replicated ranges 10 to 0, verified against a newer report and with `SHOW ZONE CONFIGURATION` |
    | 6 | one node stopped, a second table pinned to it with `num_replicas = 1` | `UNAVAILABLE` and `UNDER_REPLICATED_TRANSIENT` and `ZONE_IMPOSSIBLE` reported together, with the pinned table named at 0 voting replicas |
    | 7 | unreachable host | `errors` alert sent |

    ## Prerequisites

    - A CockroachDB cluster reachable over the Postgres wire protocol, which is what the PostgreSQL plugin speaks to it.
    - The audit role needs `VIEWCLUSTERMETADATA` to read `crdb_internal.gossip_nodes` and the report tables. Remediation needs `ZONECONFIG` on the targets, or admin rights.
    - `kv.replication_reports.interval` must not be zero. At zero the report is never built and the run fails on `report_freshness`.
    - Local testing: a three node insecure cluster is enough to see `ZONE_IMPOSSIBLE`, since CockroachDB's own system zones ask for 5 replicas.

    ### Secrets

    - `COCKROACHDB_USERNAME` / `COCKROACHDB_PASSWORD`: the SQL user for every query.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:postgresql://localhost:26257/defaultdb?sslmode=require` | Any node of the cluster |
    | `include_internal_zones` | `false` | Let the remediation lower CockroachDB's own system zones too |
    | `max_report_age_seconds` | `900` | Fail rather than audit a report older than this |
    | `settle_duration` | `PT150S` | Wait before the re-verify, longer than the report interval |
    | `auto_remediate` | `false` | Allow `ALTER ... CONFIGURE ZONE` |
    | `dry_run` | `true` | Must be `false` before any zone is changed |

    ## Quick start

    1. Add the `COCKROACHDB_USERNAME`, `COCKROACHDB_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow and set `jdbc_url` to one of your nodes.
    3. Run it once. Read the states before anything else, since `UNDER_REPLICATED_TRANSIENT` wants a second run a few minutes later rather than a config change.
    4. For a `ZONE_IMPOSSIBLE` zone, run with `auto_remediate: true` and `dry_run: false`, then resume the `Pause` with `approved: true` and your change record.
    5. Enable the `every_15_minutes` trigger, which always runs in safe mode.

    ## How to extend

    - Alert on how long a zone has been `UNDER_REPLICATED_TRANSIENT` by storing the first-seen time in a KV key, so a rebuild that stalls is paged rather than waited on.
    - Read `system.replication_critical_localities` as well, to catch a range whose replicas all sit in one locality and would be lost together.
    - Propose the next lower odd replica count instead of the live node count, which keeps the Raft quorum odd on an even sized cluster.
    - Add a branch that decommissions a node that has been dead longer than a threshold, so the allocator stops counting it.
    - Loop over several clusters by passing a list of JDBC URLs.

