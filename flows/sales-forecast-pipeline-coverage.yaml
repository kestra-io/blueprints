id: sales-forecast-pipeline-coverage
namespace: company.team

description: |
  Weekly sales forecast roll-up per rep and region: closed won to date, commit, best case and
  pipeline against quota, the coverage ratio for the rest of the quarter, and the hygiene
  checks that make a forecast wrong: close dates in the past, deals pushed again and again,
  stalled deals, deals stuck in a stage, commit deals with no next step. Commit is compared
  with last week's call kept in KV, so the forecast movement and its cause are visible.

inputs:
  - id: week_of
    type: STRING
    displayName: Forecast date
    defaults: "2026-09-07"
    validator: ^\d{4}-\d{2}-\d{2}$

  - id: quarter_start
    type: STRING
    displayName: Quarter start
    defaults: "2026-07-01"
    validator: ^\d{4}-\d{2}-\d{2}$

  - id: target_coverage
    type: FLOAT
    displayName: Target coverage
    description: Open pipeline needed per unit of remaining quota. 2.0 means 2x, a usual mid-quarter target.
    defaults: 2.0

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: ISSUES adds a deal with no owner and a deal with a negative amount, which must stop the roll-up.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

variables:
  state_key: sales_forecast_calls

concurrency:
  limit: 1

tasks:
  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    values:
      last_call: >-
        {{ (kv(vars.state_key, errorOnMissing=false) ?? {'weeks': {}}) | jq('.weeks | to_entries | map(select(.key < "' ~ inputs.week_of ~ '" and .key >= "' ~ inputs.quarter_start ~ '")) | sort_by(.key) | last | .value // {}') | first | toJson }}

  - id: forecast
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: reps and quotas, opportunities with their stage, forecast category,
      close date history and last activity (demo generator or your CRM), then the hygiene checks,
      the roll-up per rep and region, the coverage, and the movement against last week's call.
    outputFiles:
      - reps
      - hygiene
      - movement
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE d = DATE '{{ inputs.week_of }}';
      SET VARIABLE q_start = DATE '{{ inputs.quarter_start }}';
      SET VARIABLE q_end = (DATE '{{ inputs.quarter_start }}' + INTERVAL 3 MONTH)::DATE - 1;

      -- =======================================================================
      -- Reps, quotas and opportunities. Replace with your CRM export.
      -- The demo pipeline is fixed: Q3 2026, two weeks of history.
      -- =======================================================================
      CREATE TABLE reps (rep VARCHAR, region VARCHAR, quota DOUBLE);
      INSERT INTO reps VALUES ('Ana', 'EMEA', 600000), ('Bilal', 'EMEA', 500000), ('Chen', 'AMER', 700000), ('Dana', 'AMER', 650000), ('Eli', 'APAC', 400000);

      -- Stage, probability used for the weighted pipeline, and the normal days in stage.
      CREATE TABLE stages (stage VARCHAR, stage_order INT, probability DOUBLE, max_days INT);
      INSERT INTO stages VALUES ('DISCOVERY', 1, 0.10, 30), ('DEMO', 2, 0.25, 21), ('PROPOSAL', 3, 0.50, 21), ('NEGOTIATION', 4, 0.75, 14), ('CLOSED_WON', 5, 1.0, NULL), ('CLOSED_LOST', 5, 0.0, NULL);

      -- One row per opportunity as of each weekly snapshot. category: COMMIT, BEST_CASE, PIPELINE, OMIT.
      CREATE TABLE opps (snapshot DATE, opp_id VARCHAR, rep VARCHAR, account VARCHAR, amount DOUBLE, stage VARCHAR, category VARCHAR,
                         close_date DATE, close_date_pushes INT, stage_entered DATE, last_activity DATE, next_step VARCHAR);
      INSERT INTO opps VALUES
        -- Week of 2026-08-31
        ('2026-08-31', 'O-101', 'Ana', 'Northwind', 180000, 'CLOSED_WON', 'COMMIT', '2026-08-14', 0, '2026-08-14', '2026-08-14', NULL),
        ('2026-08-31', 'O-102', 'Ana', 'Fabrikam', 220000, 'NEGOTIATION', 'COMMIT', '2026-09-25', 0, '2026-08-20', '2026-08-28', 'Legal review 09-03'),
        ('2026-08-31', 'O-103', 'Ana', 'Contoso', 150000, 'PROPOSAL', 'BEST_CASE', '2026-09-30', 1, '2026-08-10', '2026-08-25', 'Pricing call'),
        ('2026-08-31', 'O-104', 'Ana', 'Litware', 400000, 'DEMO', 'PIPELINE', '2026-09-30', 0, '2026-08-01', '2026-08-29', 'Tech demo'),
        ('2026-08-31', 'O-201', 'Bilal', 'Tailspin', 120000, 'CLOSED_WON', 'COMMIT', '2026-07-30', 0, '2026-07-30', '2026-07-30', NULL),
        ('2026-08-31', 'O-202', 'Bilal', 'Proseware', 260000, 'NEGOTIATION', 'COMMIT', '2026-09-15', 2, '2026-07-20', '2026-08-30', 'Procurement'),
        ('2026-08-31', 'O-203', 'Bilal', 'Adatum', 90000, 'PROPOSAL', 'BEST_CASE', '2026-09-20', 0, '2026-08-25', '2026-08-30', 'Proposal sent'),
        ('2026-08-31', 'O-301', 'Chen', 'Wingtip', 310000, 'CLOSED_WON', 'COMMIT', '2026-08-28', 0, '2026-08-28', '2026-08-28', NULL),
        ('2026-08-31', 'O-302', 'Chen', 'Coho', 240000, 'NEGOTIATION', 'COMMIT', '2026-09-18', 0, '2026-08-24', '2026-08-31', 'Order form'),
        ('2026-08-31', 'O-303', 'Chen', 'Lucerne', 500000, 'PROPOSAL', 'BEST_CASE', '2026-09-28', 0, '2026-08-18', '2026-08-30', 'Exec sponsor'),
        ('2026-08-31', 'O-304', 'Chen', 'Margie', 380000, 'DISCOVERY', 'PIPELINE', '2026-09-29', 0, '2026-08-20', '2026-08-26', 'Discovery 2'),
        ('2026-08-31', 'O-401', 'Dana', 'Humongous', 140000, 'CLOSED_WON', 'COMMIT', '2026-07-21', 0, '2026-07-21', '2026-07-21', NULL),
        ('2026-08-31', 'O-402', 'Dana', 'Relecloud', 300000, 'NEGOTIATION', 'COMMIT', '2026-09-12', 0, '2026-08-27', '2026-08-31', 'Signature'),
        ('2026-08-31', 'O-403', 'Dana', 'VanArsdel', 210000, 'PROPOSAL', 'COMMIT', '2026-09-24', 0, '2026-08-22', '2026-08-29', 'Business case'),
        ('2026-08-31', 'O-404', 'Dana', 'Trey', 160000, 'DEMO', 'BEST_CASE', '2026-09-30', 0, '2026-08-28', '2026-08-31', 'Demo 09-04'),
        ('2026-08-31', 'O-501', 'Eli', 'Woodgrove', 95000, 'CLOSED_WON', 'COMMIT', '2026-08-05', 0, '2026-08-05', '2026-08-05', NULL),
        ('2026-08-31', 'O-502', 'Eli', 'Alpine', 180000, 'PROPOSAL', 'COMMIT', '2026-09-04', 1, '2026-07-25', '2026-08-12', 'Waiting'),
        ('2026-08-31', 'O-503', 'Eli', 'Blue Yonder', 70000, 'DEMO', 'PIPELINE', '2026-09-30', 0, '2026-08-15', '2026-08-20', 'Demo');
      -- Week of 2026-09-07: Proseware pushed into Q4 (third push), Relecloud closed, Coho lost,
      -- Alpine still waiting with its close date now in the past, Litware moved up to commit.
      INSERT INTO opps
      SELECT '2026-09-07'::DATE, opp_id, rep, account, amount, stage, category, close_date, close_date_pushes, stage_entered, last_activity, next_step FROM opps
      WHERE snapshot = '2026-08-31' AND opp_id NOT IN ('O-202', 'O-402', 'O-302', 'O-104', 'O-102', 'O-404');
      INSERT INTO opps VALUES
        ('2026-09-07', 'O-102', 'Ana', 'Fabrikam', 220000, 'NEGOTIATION', 'COMMIT', '2026-09-25', 0, '2026-08-20', '2026-09-03', NULL),
        ('2026-09-07', 'O-104', 'Ana', 'Litware', 400000, 'PROPOSAL', 'COMMIT', '2026-09-30', 0, '2026-09-04', '2026-09-05', 'Proposal review'),
        ('2026-09-07', 'O-202', 'Bilal', 'Proseware', 260000, 'NEGOTIATION', 'BEST_CASE', '2026-10-20', 3, '2026-07-20', '2026-09-04', 'Procurement'),
        ('2026-09-07', 'O-302', 'Chen', 'Coho', 240000, 'CLOSED_LOST', 'OMIT', '2026-09-04', 0, '2026-09-04', '2026-09-04', NULL),
        ('2026-09-07', 'O-402', 'Dana', 'Relecloud', 300000, 'CLOSED_WON', 'COMMIT', '2026-09-03', 0, '2026-09-03', '2026-09-03', NULL),
        ('2026-09-07', 'O-404', 'Dana', 'Trey', 160000, 'PROPOSAL', 'COMMIT', '2026-09-30', 0, '2026-09-05', '2026-09-05', 'Proposal');
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO opps VALUES
        ('2026-09-07', 'O-901', NULL, 'Orphan Ltd', 50000, 'DEMO', 'PIPELINE', '2026-09-30', 0, '2026-09-01', '2026-09-02', 'Demo'),
        ('2026-09-07', 'O-902', 'Eli', 'Credit Note Co', -30000, 'PROPOSAL', 'BEST_CASE', '2026-09-30', 0, '2026-09-01', '2026-09-02', 'Proposal');
      {% endif %}

      -- The snapshot used: the latest one on or before the forecast date.
      CREATE TABLE cur AS SELECT o.*, s.probability, s.max_days FROM opps o JOIN stages s USING (stage)
        WHERE snapshot = (SELECT max(snapshot) FROM opps WHERE snapshot <= getvariable('d'));
      CREATE TABLE blockers AS
      SELECT 'NO_SNAPSHOT' AS code, '{{ inputs.week_of }}' AS ref, 'No CRM snapshot on or before the forecast date' AS detail WHERE NOT EXISTS (SELECT 1 FROM cur)
      UNION ALL SELECT 'NO_OWNER', opp_id, 'Opportunity with no rep: it is in nobody''s forecast' FROM cur WHERE rep IS NULL OR rep NOT IN (SELECT rep FROM reps)
      UNION ALL SELECT 'NON_POSITIVE_AMOUNT', opp_id, 'Amount ' || amount FROM cur WHERE amount <= 0
      UNION ALL SELECT 'STALE_SNAPSHOT', max(snapshot)::VARCHAR, 'CRM snapshot is more than 7 days older than the forecast date' FROM cur HAVING max(snapshot) < getvariable('d') - 7;

      -- In this quarter: closed in the quarter, or open with a close date in the quarter.
      CREATE TABLE q AS SELECT * FROM cur WHERE close_date BETWEEN getvariable('q_start') AND getvariable('q_end') OR (stage NOT LIKE 'CLOSED%' AND close_date < getvariable('q_start'));

      -- =======================================================================
      -- Hygiene. Each check names the deal and what to do.
      -- =======================================================================
      CREATE TABLE hygiene AS
      SELECT rep, opp_id, account, amount, category, 'CLOSE_DATE_PASSED' AS check_code, 'Close date ' || close_date || ' has passed: close it or move the date' AS detail FROM q
        WHERE stage NOT LIKE 'CLOSED%' AND close_date < getvariable('d')
      UNION ALL SELECT rep, opp_id, account, amount, category, 'PUSHED_REPEATEDLY', 'Close date moved ' || close_date_pushes || ' times' FROM cur WHERE stage NOT LIKE 'CLOSED%' AND close_date_pushes >= 2
      UNION ALL SELECT rep, opp_id, account, amount, category, 'STALLED', 'No activity for ' || date_diff('day', last_activity, getvariable('d')) || ' days' FROM q
        WHERE stage NOT LIKE 'CLOSED%' AND last_activity < getvariable('d') - 14
      UNION ALL SELECT rep, opp_id, account, amount, category, 'STUCK_IN_STAGE', stage || ' for ' || date_diff('day', stage_entered, getvariable('d')) || ' days, normal is ' || max_days FROM q
        WHERE max_days IS NOT NULL AND stage_entered < getvariable('d') - max_days
      UNION ALL SELECT rep, opp_id, account, amount, category, 'COMMIT_NO_NEXT_STEP', 'Commit deal with no next step' FROM q WHERE category = 'COMMIT' AND stage NOT LIKE 'CLOSED%' AND coalesce(next_step, '') = ''
      UNION ALL SELECT rep, opp_id, account, amount, category, 'COMMIT_EARLY_STAGE', 'Commit at ' || stage || ' (' || (probability * 100)::INT || '% stage): confirm the call' FROM q
        WHERE category = 'COMMIT' AND stage NOT LIKE 'CLOSED%' AND probability < 0.5;

      -- =======================================================================
      -- Roll-up. Commit = won + open commit; best case = commit + open best case.
      -- Coverage = open pipeline in the quarter / quota still to close.
      -- =======================================================================
      CREATE TABLE r AS
      SELECT p.rep, p.region, p.quota,
             coalesce(sum(amount) FILTER (WHERE stage = 'CLOSED_WON'), 0) AS won,
             coalesce(sum(amount) FILTER (WHERE stage = 'CLOSED_WON' OR (stage NOT LIKE 'CLOSED%' AND category = 'COMMIT')), 0) AS commit_call,
             coalesce(sum(amount) FILTER (WHERE stage = 'CLOSED_WON' OR (stage NOT LIKE 'CLOSED%' AND category IN ('COMMIT', 'BEST_CASE'))), 0) AS best_case,
             coalesce(sum(amount) FILTER (WHERE stage NOT LIKE 'CLOSED%' AND category <> 'OMIT'), 0) AS open_pipeline,
             coalesce(sum(amount * probability) FILTER (WHERE stage NOT LIKE 'CLOSED%' AND category <> 'OMIT'), 0) AS weighted_open,
             coalesce(sum(amount) FILTER (WHERE stage NOT LIKE 'CLOSED%' AND category = 'COMMIT' AND opp_id IN (SELECT opp_id FROM hygiene)), 0) AS commit_at_risk
      FROM reps p LEFT JOIN q USING (rep) GROUP BY p.rep, p.region, p.quota;
      CREATE TABLE prev AS SELECT key AS rep, (value->>'commit')::DOUBLE AS prev_commit, value->>'deals' AS prev_deals FROM json_each('{{ outputs.state.values.last_call }}');
      CREATE TABLE reps_out AS
      SELECT r.*, round(100 * won / quota, 1) AS attainment_pct, round(100 * commit_call / quota, 1) AS commit_pct,
             round(open_pipeline / nullif(greatest(quota - won, 0), 0), 2) AS coverage,
             CASE WHEN quota <= won THEN 'QUOTA_MET' WHEN open_pipeline / (quota - won) < {{ inputs.target_coverage }} THEN 'UNDER_COVERED' ELSE 'COVERED' END AS coverage_status,
             p.prev_commit, commit_call - p.prev_commit AS commit_change
      FROM r LEFT JOIN prev p USING (rep);

      -- Movement: commit deals that entered or left the call since last week, and why.
      CREATE TABLE now_commit AS SELECT rep, opp_id, account, amount, stage FROM q WHERE stage = 'CLOSED_WON' OR (stage NOT LIKE 'CLOSED%' AND category = 'COMMIT');
      CREATE TABLE was_commit AS SELECT p.rep, unnest(from_json(p.prev_deals, '["VARCHAR"]')) AS opp_id FROM prev p WHERE p.prev_deals IS NOT NULL;
      CREATE TABLE movement AS
      SELECT n.rep, n.opp_id, n.account, n.amount, 'ADDED' AS change, 'Now ' || n.stage || ' in commit' AS reason FROM now_commit n
        WHERE (SELECT count(*) FROM was_commit) > 0 AND n.opp_id NOT IN (SELECT opp_id FROM was_commit)
      UNION ALL
      SELECT w.rep, w.opp_id, c.account, c.amount, 'REMOVED',
             CASE WHEN c.opp_id IS NULL THEN 'No longer in the CRM' WHEN c.stage = 'CLOSED_LOST' THEN 'Lost' WHEN c.close_date > getvariable('q_end') THEN 'Pushed to ' || c.close_date
                  ELSE 'Moved to ' || c.category END
      FROM was_commit w LEFT JOIN cur c USING (opp_id) WHERE w.opp_id NOT IN (SELECT opp_id FROM now_commit);

      COPY (SELECT * FROM reps_out ORDER BY region, rep) TO '{{ outputFiles.reps }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM hygiene ORDER BY rep, amount DESC) TO '{{ outputFiles.hygiene }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM movement ORDER BY rep, change, amount DESC) TO '{{ outputFiles.movement }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT format('{:,.0f}', sum(quota)) FROM reps_out) AS quota, (SELECT format('{:,.0f}', sum(won)) FROM reps_out) AS won,
        (SELECT format('{:,.0f}', sum(commit_call)) FROM reps_out) AS commit_call, (SELECT format('{:,.0f}', sum(best_case)) FROM reps_out) AS best_case,
        (SELECT round(100 * sum(commit_call) / sum(quota), 1) FROM reps_out) AS commit_pct,
        (SELECT round(sum(open_pipeline) / sum(greatest(quota - won, 0)), 2) FROM reps_out) AS coverage,
        (SELECT string_agg(region || ' ' || round(100 * c / qq, 1) || '% commit', ', ' ORDER BY region) FROM (SELECT region, sum(commit_call) AS c, sum(quota) AS qq FROM reps_out GROUP BY region)) AS regions,
        (SELECT coalesce(string_agg(rep || ' ' || coverage || 'x', ', ' ORDER BY coverage), '') FROM reps_out WHERE coverage_status = 'UNDER_COVERED') AS under_covered,
        (SELECT count(*) FROM hygiene)::INT AS hygiene_issues,
        (SELECT format('{:,.0f}', sum(commit_at_risk)) FROM reps_out) AS commit_at_risk,
        (SELECT CASE WHEN count(prev_commit) = 0 THEN 'no call last week' ELSE CASE WHEN sum(commit_change) >= 0 THEN '+' ELSE '-' END || format('{:,.0f}', abs(sum(commit_change))) END FROM reps_out) AS commit_change,
        (SELECT coalesce(string_agg(change || ' ' || opp_id || ' ' || account || ' ' || format('{:,.0f}', amount) || ' (' || reason || ')', '; ' ORDER BY change, amount DESC), '') FROM movement) AS movement,
        (SELECT json_group_object(rep, json_object('commit', commit_call, 'deals', (SELECT list(opp_id ORDER BY opp_id) FROM now_commit n WHERE n.rep = o.rep)))
           FROM reps_out o)::VARCHAR AS call,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref, ', ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.forecast.outputs | last).row | toJson }}"

  - id: log_forecast
    type: io.kestra.plugin.core.log.Log
    message: |
      Forecast {{ inputs.week_of }} ({{ inputs.scenario }}). {{ outputs.result.values.r | jq('"Quota \(.quota), won \(.won), commit \(.commit_call) (\(.commit_pct)%), best case \(.best_case). Coverage \(.coverage)x."') | first }}
      {{ outputs.result.values.r | jq('"By region: \(.regions). Under-covered: \(if .under_covered == "" then "none" else .under_covered end)."') | first }}
      {{ outputs.result.values.r | jq('"Commit vs last week: \(.commit_change). \(.movement)"') | first }}
      {{ outputs.result.values.r | jq('"Hygiene: \(.hygiene_issues) issues, \(.commit_at_risk) of commit on deals with an issue."') | first }}
      Blockers: {{ outputs.result.values.r | jq('.blockers') | first }} {{ outputs.result.values.r | jq('.blocker_detail') | first }}

  - id: evidence_blockers
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "sales-forecast/{{ inputs.week_of }}/blockers.csv": "{{ outputs.forecast.outputFiles.blockers }}"

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.blockers > 0') | first }}"
    then:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Forecast not published, fix the CRM first: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "sales-forecast/{{ inputs.week_of }}/reps.csv": "{{ outputs.forecast.outputFiles.reps }}"
      "sales-forecast/{{ inputs.week_of }}/hygiene.csv": "{{ outputs.forecast.outputFiles.hygiene }}"
      "sales-forecast/{{ inputs.week_of }}/movement.csv": "{{ outputs.forecast.outputFiles.movement }}"

  - id: save_call
    type: io.kestra.plugin.core.kv.Set
    key: "{{ vars.state_key }}"
    kvType: JSON
    value: >-
      {{ {'old': (kv(vars.state_key, errorOnMissing=false) ?? {'weeks': {}}), 'wk': inputs.week_of, 'call': fromJson(fromJson(outputs.result.values.r).call)}
         | jq('{weeks: (.old.weeks + {(.wk): .call})}') | first | toJson }}

triggers:
  - id: monday
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * 1"
    disabled: true
    inputs:
      week_of: "{{ trigger.date | date('yyyy-MM-dd') }}"

extend:
  title: Roll up the weekly sales forecast with pipeline coverage, deal hygiene and commit movement
  metaTitle: Weekly sales forecast roll-up and pipeline coverage with Kestra and DuckDB
  shortDescription: Compute won, commit, best case and pipeline coverage per rep and region against quota, flag the deals that make a forecast wrong, and explain how the commit moved since last week's call.
  metaDescription: Sales forecast roll-up in Kestra and DuckDB. Commit and best case vs quota, pipeline coverage, deal hygiene checks and week-over-week commit movement.
  description: |
    Every Monday, sales leaders build the same forecast by hand: export the CRM, sum commit and best case per rep, check coverage against what is left of the quota, and ask why the number moved since last week. The forecast is usually wrong for visible reasons: a close date that passed last week, a deal pushed for the third time, a commit deal with nobody working on it.

    This flow does the roll-up, runs those checks, and keeps each week's call in KV. The next week it can say which deals entered or left the commit, and why.

    It runs with no setup and no network. The demo has five reps in three regions, and two weekly CRM snapshots of a Q3 pipeline. In the second week:
    - one deal closes;
    - one is lost;
    - one is pushed into Q4 for the third time;
    - two move up to commit;
    - one commit deal's close date passes while it sits idle.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## The roll-up

    | Number | Rule |
    |---|---|
    | Won | Closed won in the quarter |
    | Commit | Won, plus open deals in the `COMMIT` category closing this quarter |
    | Best case | Commit, plus open `BEST_CASE` deals |
    | Open pipeline | Open deals closing this quarter, except `OMIT` |
    | Coverage | Open pipeline divided by the quota still to close. Below `target_coverage` the rep is `UNDER_COVERED` |
    | Commit at risk | Open commit on deals with at least one hygiene issue |

    Open deals with a close date before the quarter started are counted in this quarter: they were never moved, which is itself a hygiene issue.

    ## Hygiene checks

    | Check | Rule |
    |---|---|
    | `CLOSE_DATE_PASSED` | Open deal with a close date in the past |
    | `PUSHED_REPEATEDLY` | Close date moved two times or more |
    | `STALLED` | No activity for 14 days |
    | `STUCK_IN_STAGE` | Longer in its stage than the stage's normal duration |
    | `COMMIT_NO_NEXT_STEP` | Commit deal with no next step |
    | `COMMIT_EARLY_STAGE` | Commit deal in a stage below 50% probability |

    ## Movement

    Each week the flow stores the commit total and the commit deals per rep. The next run lists every deal `ADDED` to or `REMOVED` from the commit. A removed deal is explained as lost, pushed to a date after the quarter, moved to another category, or gone from the CRM. Movement is compared within the quarter only.

    ## How it works

    1. `state` loads the latest call of the quarter before this week.
    2. `forecast` (`io.kestra.plugin.jdbc.duckdb.Queries`) holds the reps, quotas, stages and opportunity snapshots. It takes the latest snapshot, checks the data, then runs the hygiene checks, the roll-up and the movement.
    3. `log_forecast` prints the totals, the regions, the under-covered reps, the movement and the commit at risk.
    4. `gate` stops on blockers before any report is written: no snapshot, a snapshot more than 7 days old, a deal with no owner (it is in nobody's forecast), a non-positive amount. Otherwise `evidence` stores `reps.csv`, `hygiene.csv` and `movement.csv`.
    5. `save_call` (`io.kestra.plugin.core.kv.Set`) stores this week's call.

    ## Tested end to end

    On Kestra 2.0.5 OSS.

    | Run | Week | Result |
    |---|---|---|
    | 1 | 2026-08-31 | Quota 2,850,000, won 845,000, commit 2,255,000 (79.1%), best case 3,155,000, coverage 1.58x. 4 reps under 2x. 5 hygiene issues, 440,000 of commit at risk. No earlier call |
    | 2 | 2026-09-07 | Won 1,145,000, commit 2,315,000 (+60,000). Added Litware 400,000 and Trey 160,000. Removed Proseware 260,000 (pushed to 2026-10-20) and Coho 240,000 (lost). Bilal's coverage drops to 0.24x. 9 hygiene issues, including Alpine's close date passing |
    | 3 | 2026-09-21 | Blocked: the latest CRM snapshot is 14 days old |
    | 4 | `ISSUES` | Blocked: a deal with no owner and a deal of -30,000. The reports of the week are not overwritten |

    I recomputed won, commit, best case, open pipeline and coverage for the 5 reps in both weeks independently in Python, from the opportunity rows, together with the added and removed deals. Every value matches.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `week_of` | `2026-09-07` | Forecast date |
    | `quarter_start` | `2026-07-01` | First day of the quarter |
    | `target_coverage` | `2.0` | Coverage target |
    | `scenario` | `CLEAN` | Demo only |

    ## Use it with your data

    - Replace `reps`, `stages` and `opps` with a weekly CRM snapshot: Salesforce or HubSpot opportunities with stage, forecast category, close date, push count and last activity.
    - Enable the `monday` trigger, and send `log_forecast` and `hygiene.csv` per rep to the sales channel.
    - Change `stages` to your stage names, probabilities and normal durations.

    ## Things to know

    - The weighted pipeline in `reps.csv` uses the stage probabilities. It is a cross-check for the call, not the forecast.
    - Multi-currency pipelines need converting to one currency in the snapshot.

