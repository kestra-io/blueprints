id: ai-lead-firmographic-enrichment
namespace: company.team
description: |
  Automated inbound lead firmographic enrichment workflow using Perplexity AI web search. Extracts verified
  company size, industry, and funding details, stores records in PostgreSQL, and alerts sales on enterprise leads.

concurrency:
  limit: 1

inputs:
  - id: lead_email
    type: STRING
    displayName: Prospect Email
    defaults: "alex.taylor@stripe.com"
    description: "Email address of the inbound prospect."

  - id: company_name
    type: STRING
    displayName: Company Name
    defaults: "Stripe"
    description: "Company name provided by the prospect or extracted from the corporate email domain."

  - id: postgres_url
    type: STRING
    displayName: CRM Database JDBC URL
    defaults: "jdbc:postgresql://postgres.internal:5432/crm_db"
    description: "JDBC URL of the CRM database to store enriched lead profiles."

  - id: postgres_username
    type: STRING
    displayName: Database Username
    defaults: "crm_writer"
    description: "Database user with write permissions on the inbound_leads table."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#sales-leads"
    description: "Slack channel destination for notifying enterprise account executives."

triggers:
  - id: inbound_lead_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Executes in real-time upon receiving inbound form submission webhooks."
    key: "inbound-lead-enrichment"

tasks:
  - id: research_company_via_perplexity
    type: io.kestra.plugin.perplexity.ChatCompletion
    description: "Queries Perplexity online sonar model to perform live web research on target company firmographics."
    apiKey: "{{ secret('PERPLEXITY_API_KEY') }}"
    model: "sonar"
    messages:
      - role: user
        content: |
          Search the web and provide current firmographic data for company "{{ inputs.company_name }}".
          Output strictly valid JSON with the following keys:
          {
            "company_name": "{{ inputs.company_name }}",
            "industry": "...",
            "estimated_employees": 5000,
            "headquarters_location": "...",
            "funding_stage": "...",
            "is_enterprise": true
          }
          Set is_enterprise to true if estimated_employees >= 500, otherwise false.

  - id: parse_firmographic_data
    type: io.kestra.plugin.scripts.python.Script
    description: "Parses structured firmographic fields and classifies prospect lead tier."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      raw_perplexity.txt: "{{ outputs.research_company_via_perplexity.choices[0].message.content }}"
    outputFiles:
      - lead_profile.json
    script: |
      import json
      import re
      from kestra import Kestra

      with open("raw_perplexity.txt", "r", encoding="utf-8") as f:
          raw = f.read().strip()

      clean_json = re.sub(r"^```(?:json)?\s*", "", raw, flags=re.MULTILINE)
      clean_json = re.sub(r"\s*```$", "", clean_json, flags=re.MULTILINE).strip()

      try:
          profile = json.loads(clean_json)
      except Exception:
          profile = {
              "company_name": "{{ inputs.company_name }}",
              "industry": "Unknown",
              "estimated_employees": 100,
              "headquarters_location": "Unknown",
              "funding_stage": "Unknown",
              "is_enterprise": False
          }

      is_enterprise = bool(profile.get("is_enterprise", False))

      with open("lead_profile.json", "w", encoding="utf-8") as f:
          json.dump(profile, f, indent=2)

      Kestra.outputs({
          "is_enterprise": is_enterprise,
          "industry": str(profile.get("industry", "Unknown")),
          "employees": int(profile.get("estimated_employees", 0)),
          "hq": str(profile.get("headquarters_location", "Unknown")),
          "funding": str(profile.get("funding_stage", "Unknown"))
      })

  - id: evaluate_enterprise_tier
    type: io.kestra.plugin.core.flow.If
    description: "Branches execution to alert enterprise sales when company headcount exceeds 500."
    condition: "{{ outputs.parse_firmographic_data.vars.is_enterprise }}"
    then:
      - id: alert_enterprise_sales_lead
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches enterprise lead briefing card to Sales Slack channel."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*High-Value Enterprise Lead Alert*\n• *Prospect Email*: `{{ inputs.lead_email }}`\n• *Company*: `{{ inputs.company_name }}`\n• *Industry*: {{ outputs.parse_firmographic_data.vars.industry }}\n• *Estimated Headcount*: {{ outputs.parse_firmographic_data.vars.employees }}+ employees\n• *Headquarters*: {{ outputs.parse_firmographic_data.vars.hq }}\n• *Funding Stage*: {{ outputs.parse_firmographic_data.vars.funding }}\n• *Routing Action*: Enriched via Perplexity AI web search and assigned to Enterprise Account Executive queue."
          }

    else:
      - id: log_standard_lead_tier
        type: io.kestra.plugin.core.log.Log
        description: "Logs classification of mid-market or self-serve lead tier."
        message: "Inbound lead {{ inputs.lead_email }} enriched successfully. Classified as Mid-Market / Commercial account."

  - id: persist_lead_to_database
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: "Persists enriched firmographic dossier into PostgreSQL inbound_leads table."
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.postgres_username }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      INSERT INTO inbound_leads (
        email, company_name, industry, employee_count, hq_location, is_enterprise, enriched_at
      ) VALUES (
        '{{ inputs.lead_email }}',
        '{{ inputs.company_name }}',
        '{{ outputs.parse_firmographic_data.vars.industry }}',
        {{ outputs.parse_firmographic_data.vars.employees }},
        '{{ outputs.parse_firmographic_data.vars.hq }}',
        {{ outputs.parse_firmographic_data.vars.is_enterprise }},
        CURRENT_TIMESTAMP
      )
      ON CONFLICT (email) DO UPDATE SET
        industry = EXCLUDED.industry,
        employee_count = EXCLUDED.employee_count,
        hq_location = EXCLUDED.hq_location,
        is_enterprise = EXCLUDED.is_enterprise,
        enriched_at = CURRENT_TIMESTAMP;

  - id: export_lead_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON lead manifest for marketing automation lineage."
    format: |
      {
        "pipeline": "ai-lead-firmographic-enrichment",
        "audited_at": "{{ execution.startDate }}",
        "company": "{{ inputs.company_name }}",
        "is_enterprise": {{ outputs.parse_firmographic_data.vars.is_enterprise }},
        "status": "ENRICHED"
      }

extend:
  shortDescription: "Enriches inbound leads with real-time web research using Perplexity and flags enterprise accounts."
  title: "AI Lead Firmographic Enrichment"
  metaTitle: "AI Lead Firmographic Enrichment | Kestra Blueprint"
  metaDescription: "Ingests inbound corporate leads, searches company firmographics via Perplexity AI, and routes high-value enterprise prospects to Slack."
  description: |
    When prospective customers submit demo requests or trial signup forms, traditional enrichment providers (such as Clearbit or ZoomInfo) frequently have coverage gaps on high-growth startups, international organizations, or stealth companies. Furthermore, static database records quickly become outdated regarding recent venture rounds, acquisitions, and executive leadership shifts.

    By orchestrating Perplexity AI's real-time web-grounded search models (`sonar`) within Kestra, marketing and sales teams can retrieve real-time firmographic intelligence for any inbound domain within seconds.

    This blueprint listens for inbound lead form submissions via Webhook, prompts Perplexity to search the live web for verified company size, industry vertical, headquarters, and funding status, persists the enriched profile into PostgreSQL, and immediately routes high-value enterprise accounts to sales teams via Slack.

    ## How it works

    1. **Webhook Ingest**: The `inbound_lead_webhook` trigger (`io.kestra.plugin.core.trigger.Webhook`) activates immediately upon form submission.
    2. **Perplexity Web Search**: The `research_company_via_perplexity` task (`io.kestra.plugin.perplexity.ChatCompletion`) queries the `sonar` model to conduct web research and return structured JSON.
    3. **Python Field Parsing**: The `parse_firmographic_data` task (`io.kestra.plugin.scripts.python.Script`) validates fields, evaluates enterprise qualification thresholds, and outputs `lead_profile.json`.
    4. **Condition Branching**: The `evaluate_enterprise_tier` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether the lead meets enterprise size criteria.
    5. **Slack Alert Dispatch**: If classified as enterprise, `alert_enterprise_sales_lead` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable briefing card to the sales team.
    6. **CRM Storage**: The `persist_lead_to_database` task (`io.kestra.plugin.jdbc.postgresql.Query`) saves the enriched record to PostgreSQL with idempotent upsert logic.
    7. **Lead Manifest**: The `export_lead_manifest` task returns execution metadata for marketing analytics.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Trigger: Inbound Webhook] --> B[research_company_via_perplexity: Perplexity Sonar]
        B --> C[parse_firmographic_data: Python Classifier]
        C --> D{Enterprise Tier Lead?}
        D -- Yes --> E[alert_enterprise_sales_lead: Slack]
        D -- No --> F[log_standard_lead_tier: Log]
        E --> G[persist_lead_to_database: PostgreSQL]
        F --> G
        G --> H[export_lead_manifest: Return JSON]
    ```

    ## Use cases

    - **Speed-to-Lead Acceleration**: Enrich inbound signups with live web data within seconds and alert enterprise sales reps.
    - **Automated CRM Hygiene**: Populate PostgreSQL customer databases with verified headcount, industry, and funding stage.
    - **Dynamic Account-Based Routing**: Filter out low-fit consumer signups while escalating high-ARR enterprise prospects.

    ## What you get

    - Real-time web-grounded firmographic enrichment with zero stale database gaps.
    - Automated lead qualification routing enterprise accounts to account executives instantly.
    - Structured persistence into PostgreSQL CRM tables with upsert handling.
    - Formatted Slack alert cards containing company headcount, industry, and funding stage.

    ## Who it is for

    - Revenue Operations (RevOps) engineers automating lead routing and qualification pipelines.
    - Growth Marketing teams optimizing inbound conversion rates and speed-to-lead SLAs.
    - Enterprise Sales Development Representatives (SDRs) prioritizing outreach.

    ## Why orchestrate this with Kestra

    Connecting web forms, generative search APIs, relational databases, and Slack typically requires brittle serverless functions. Kestra consolidates webhook ingestion, real-time AI inference, database upserts, and team notifications into a single observable workflow.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `lead_email` | STRING | `alex.taylor@stripe.com` | Prospect contact email address. |
    | `company_name` | STRING | `Stripe` | Company name to investigate. |
    | `postgres_url` | STRING | `jdbc:postgresql://...` | JDBC URL for CRM storage. |
    | `postgres_username` | STRING | `crm_writer` | Database user for upsert queries. |
    | `slack_channel` | STRING | `#sales-leads` | Slack channel destination for alerts. |

    ## Expected outputs

    - `{{ outputs.parse_firmographic_data.vars.is_enterprise }}`: Boolean flag indicating if company headcount >= 500.
    - `{{ outputs.parse_firmographic_data.vars.industry }}`: Business vertical identified via web search.
    - `{{ outputs.parse_firmographic_data.vars.employees }}`: Estimated employee count.
    - `{{ outputs.parse_firmographic_data.outputFiles['lead_profile.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - Perplexity AI API account with active credits.
    - PostgreSQL CRM database with an `inbound_leads` table.
    - Slack Incoming Webhook configured for your sales notifications channel.

    ### Secrets

    - `PERPLEXITY_API_KEY`: API key for Perplexity AI web search inference.
    - `POSTGRES_PASSWORD`: Password for the PostgreSQL database user.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `PERPLEXITY_API_KEY`, `POSTGRES_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI with a sample corporate domain to test enrichment.
    4. Connect your web signup form to the generated Kestra Webhook URL.

    ## Common pitfalls and troubleshooting

    - **Consumer Email Domains**: Free webmail domains (gmail.com, yahoo.com) lack corporate firmographics; filter consumer domains in front-end forms before webhook triggering.
    - **API Token Credits**: Ensure your Perplexity API account is configured with active usage credits for the `sonar` model.
    - **Database Schema**: Verify the target `inbound_leads` table exists in PostgreSQL with a unique constraint on the `email` column for upsert handling.

    ## How to extend

    - Add `io.kestra.plugin.hubspot.ContactCreate` to automatically sync enriched leads into HubSpot CRM.
    - Generate personalized first-touch cold email copy using Claude or OpenAI based on the retrieved industry and funding data.
    - Score inbound leads using proprietary qualification algorithms in DuckDB before sales routing.

    ## Links

    - Kestra Perplexity Plugin Documentation: https://kestra.io/plugins/plugin-perplexity/io.kestra.plugin.perplexity.ChatCompletion
    - Kestra PostgreSQL Plugin Documentation: https://kestra.io/plugins/plugin-jdbc-postgres
    - Kestra Webhook Triggers Documentation: https://kestra.io/docs/workflow-components/triggers/webhook
  tags:
    - AI
    - Business
  subTags:
    - Agents & Structured Output
    - CRM & Marketing Ops
  ee: false
  demo: false
