id: ai-lead-firmographic-enrichment
namespace: company.team

inputs:
  - id: lead_email
    type: STRING
    defaults: "alex.taylor@stripe.com"
    description: "Email address of the inbound prospect."

  - id: company_name
    type: STRING
    defaults: "Stripe"
    description: "Company name provided by the prospect or extracted from the email domain."

  - id: postgres_url
    type: STRING
    defaults: "jdbc:postgresql://postgres.internal:5432/crm_db"
    description: "JDBC URL of the CRM database to store enriched lead profiles."

  - id: postgres_username
    type: STRING
    defaults: "crm_writer"
    description: "Database user with write permissions on the leads table."

  - id: slack_webhook_url
    type: STRING
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
    description: "Slack Incoming Webhook URL for notifying account executives on enterprise leads."

tasks:
  - id: research_company_via_perplexity
    type: io.kestra.plugin.perplexity.ChatCompletion
    apiKey: "{{ secret('PERPLEXITY_API_KEY') }}"
    model: "sonar"
    messages:
      - role: user
        content: |
          Search the web and provide current firmographic data for company "{{ inputs.company_name }}".
          Output strictly valid JSON with the following keys:
          {
            "company_name": "{{ inputs.company_name }}",
            "industry": "...",
            "estimated_employees": 5000,
            "headquarters_location": "...",
            "funding_stage": "...",
            "is_enterprise": true
          }
          Set is_enterprise to true if estimated_employees >= 500, otherwise false.

  - id: parse_firmographic_data
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      raw_perplexity.txt: "{{ outputs.research_company_via_perplexity.choices[0].message.content }}"
    outputFiles:
      - lead_profile.json
    script: |
      import json
      import re
      from kestra import Kestra

      with open("raw_perplexity.txt", "r", encoding="utf-8") as f:
          raw = f.read().strip()

      clean_json = re.sub(r"^```(?:json)?\s*", "", raw, flags=re.MULTILINE)
      clean_json = re.sub(r"\s*```$", "", clean_json, flags=re.MULTILINE).strip()

      try:
          profile = json.loads(clean_json)
      except Exception:
          profile = {
              "company_name": "{{ inputs.company_name }}",
              "industry": "Unknown",
              "estimated_employees": 100,
              "headquarters_location": "Unknown",
              "funding_stage": "Unknown",
              "is_enterprise": False
          }

      is_enterprise = bool(profile.get("is_enterprise", False))

      with open("lead_profile.json", "w", encoding="utf-8") as f:
          json.dump(profile, f, indent=2)

      Kestra.outputs({
          "is_enterprise": is_enterprise,
          "industry": str(profile.get("industry", "Unknown")),
          "employees": int(profile.get("estimated_employees", 0)),
          "hq": str(profile.get("headquarters_location", "Unknown")),
          "funding": str(profile.get("funding_stage", "Unknown"))
      })

  - id: evaluate_enterprise_tier
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.parse_firmographic_data.vars.is_enterprise }}"
    then:
      - id: alert_enterprise_sales_lead
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ inputs.slack_webhook_url }}"
        payload: |
          {
            "text": "High-Value Enterprise Lead Detected: Inbound lead `{{ inputs.lead_email }}` from `{{ inputs.company_name }}` enriched via Perplexity AI. Industry: {{ outputs.parse_firmographic_data.vars.industry }}, Employees: {{ outputs.parse_firmographic_data.vars.employees }}+, HQ: {{ outputs.parse_firmographic_data.vars.hq }}. Assigned to Enterprise Sales queue."
          }

  - id: persist_lead_to_database
    type: io.kestra.plugin.jdbc.postgres.Query
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.postgres_username }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      INSERT INTO inbound_leads (
        email, company_name, industry, employee_count, hq_location, is_enterprise, enriched_at
      ) VALUES (
        '{{ inputs.lead_email }}',
        '{{ inputs.company_name }}',
        '{{ outputs.parse_firmographic_data.vars.industry }}',
        {{ outputs.parse_firmographic_data.vars.employees }},
        '{{ outputs.parse_firmographic_data.vars.hq }}',
        {{ outputs.parse_firmographic_data.vars.is_enterprise }},
        CURRENT_TIMESTAMP
      )
      ON CONFLICT (email) DO UPDATE SET
        industry = EXCLUDED.industry,
        employee_count = EXCLUDED.employee_count,
        hq_location = EXCLUDED.hq_location,
        is_enterprise = EXCLUDED.is_enterprise,
        enriched_at = CURRENT_TIMESTAMP;

triggers:
  - id: inbound_lead_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "inbound-lead-enrichment"

extend:
  title: "AI Lead Firmographic Enrichment"
  shortDescription: "Enriches inbound leads with real-time web research using Perplexity and flags enterprise accounts."
  metaTitle: "AI Lead Firmographic Enrichment | Kestra Blueprint"
  metaDescription: "Ingests inbound corporate leads, searches company firmographics via Perplexity AI, and routes high-value enterprise prospects to Slack."
  tags:
    - AI
    - Business
    - Data
  ee: false
  demo: false
  description: |
    ### What It Does
    This blueprint listens for inbound marketing lead submissions via Webhook, performs live web research using Perplexity AI (`sonar` model) to extract verified company firmographics (industry, employee count, headquarters, funding), stores the structured profile into PostgreSQL, and immediately alerts Enterprise Account Executives when high-value enterprise prospects arrive.

    ### Prerequisites
    - Perplexity AI API key stored in secret `PERPLEXITY_API_KEY`.
    - PostgreSQL CRM database with an `inbound_leads` table.
    - Slack Incoming Webhook configured in secret `SLACK_WEBHOOK_URL`.

    ### Quick Start
    1. Set the webhook key to trigger execution from web forms.
    2. Configure CRM database connection settings in `postgres_url`.
    3. Test with sample lead parameters (`lead_email` and `company_name`).
    4. Connect your website or product signup webhook to the generated Kestra endpoint.

    ### Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `lead_email` | STRING | `alex.taylor@stripe.com` | Prospect contact email |
    | `company_name` | STRING | `Stripe` | Company name to investigate |
    | `postgres_url` | STRING | `jdbc:postgresql://...` | JDBC URL for CRM storage |
    | `postgres_username` | STRING | `crm_writer` | Database user for inserts |
    | `slack_webhook_url` | STRING | `{{ secret('SLACK_WEBHOOK_URL') }}` | Slack notification destination |

    ### Expected Outputs
    - `outputs.parse_firmographic_data.vars.is_enterprise`: Boolean indicating whether the company qualifies as an enterprise account.
    - `outputs.parse_firmographic_data.vars.employees`: Estimated employee count extracted from live search.
    - `outputs.parse_firmographic_data.outputFiles['lead_profile.json']`: Complete structured JSON firmographic dossier.

    ### Common Pitfalls
    - Free email providers (e.g., gmail.com, hotmail.com) may lack corporate firmographics; filter out consumer domains in upstream forms if necessary.
    - Ensure your Perplexity account has active credits for the `sonar` model.
