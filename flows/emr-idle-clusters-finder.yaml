id: emr-idle-clusters-finder
namespace: company.finops

description: |
  Finds EMR clusters stuck in WAITING state for over 2 hours with no steps
  running — jobs that finished (or failed to start) while the cluster keeps
  billing for EC2 + EMR. Reports cluster age and estimated hourly waste.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for idle EMR clusters.
  - id: max_waiting_hours
    type: INT
    defaults: 2
    description: WAITING clusters older than this many hours with no running steps are flagged.
  - id: hourly_cost_usd
    type: STRING
    defaults: "0.50"
    description: Estimated combined EC2+EMR hourly cost per cluster in USD (tune for your instance mix).

tasks:
  - id: check_clusters
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit EMR clusters region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List WAITING clusters, check age and running steps per cluster.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            HOURS={{ inputs.max_waiting_hours }}
            PRICE="{{ inputs.hourly_cost_usd }}"
            NOW=$(date -u +%s)
            CUTOFF=$((NOW - HOURS * 3600))
            echo "Checking EMR clusters in $REGION waiting longer than $HOURS hours"
            IDLE_LIST=""
            TOTAL=0
            for CID in $(aws emr list-clusters --region "$REGION" --cluster-states WAITING \
              --query 'Clusters[].[Id]' --output text); do
              CREATED=$(aws emr describe-cluster --region "$REGION" --cluster-id "$CID" \
                --query 'Cluster.Status.Timeline.CreationDateTime' --output text)
              AGE_SEC=$(python3 -c "
            import time
            try:
                print(int($NOW - time.mktime(time.strptime('$CREATED'[:19],'%Y-%m-%dT%H:%M:%S'))))
            except Exception:
                print(0)")
              NAME=$(aws emr describe-cluster --region "$REGION" --cluster-id "$CID" \
                --query 'Cluster.Name' --output text)
              if [ "$AGE_SEC" -gt $((HOURS * 3600)) ]; then
                RUNNING=$(aws emr list-steps --region "$REGION" --cluster-id "$CID" \
                  --step-states RUNNING PENDING --query 'length(Steps)' --output text 2>/dev/null)
                case "$RUNNING" in ''|'None') RUNNING=0;; esac
                if [ "$RUNNING" -eq 0 ]; then
                  AGE_H=$(python3 -c "print('{:.1f}'.format($AGE_SEC/3600))")
                  WASTE=$(python3 -c "print('{:.2f}'.format($AGE_H * float('$PRICE')))")
                  IDLE_LIST="${IDLE_LIST}${NAME} (${CID}, waiting ${AGE_H}h ~\$${WASTE} burned), "
                  TOTAL=$(python3 -c "print('{:.2f}'.format(float('$TOTAL') + float('$WASTE')))")
                fi
              fi
            done
            if [ -n "$IDLE_LIST" ]; then HAS_IDLE=true; else HAS_IDLE=false; fi
            echo "HAS_IDLE=$HAS_IDLE"
            echo "IDLE_CLUSTERS=$IDLE_LIST"
            echo "EST_WASTE_BURNED=$TOTAL"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report idle clusters, stay quiet when clusters are working.
        condition: "{{ outputs.audit_region.vars.HAS_IDLE == 'true' }}"
        then:
          - id: slack_idle
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":elephant: EMR audit `{{ outputs.audit_region.vars.REGION_DONE }}` — clusters WAITING 2h+ with no steps running (~${{ outputs.audit_region.vars.EST_WASTE_BURNED }} burned so far):\n`{{ outputs.audit_region.vars.IDLE_CLUSTERS }}`\nTerminate them from the EMR console unless a job is about to be submitted."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "No idle EMR clusters in {{ outputs.audit_region.vars.REGION_DONE }} — WAITING clusters are fresh or have steps running."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: EMR Idle Clusters Finder
  metaTitle: Find Idle EMR Clusters | Kestra
  shortDescription: Audit EMR clusters across regions for WAITING state over 2 hours with no running steps, and get a Slack report with burned cost.
  metaDescription: Forgotten EMR clusters bill EC2+EMR hourly. This flow finds WAITING clusters with no work and reports weekly.
  description: |
    EMR clusters don't terminate themselves. A job finishes, the notebook closes, and the cluster sits in WAITING — billing for every EC2 instance plus the EMR premium — until someone remembers. This blueprint finds clusters that have been waiting longer than your threshold with nothing actually running.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists clusters in WAITING state and computes each one's age from its creation timestamp.
    4. Clusters older than `max_waiting_hours` (default 2) are checked for RUNNING or PENDING steps; with none, they're flagged idle and their burned cost is estimated.
    5. An `If` task posts a Slack report only on findings.

    ## What you get

    - A weekly list of forgotten clusters with names, IDs, waiting time, and burned dollars.
    - The check for running steps first, so interactive/notebook clusters with real work aren't flagged.
    - Silence when the fleet is actually working.

    ## Who it's for

    Data engineering teams where ad-hoc EMR usage outpaced cluster lifecycle discipline.

    ## Why orchestrate this with Kestra

    EMR spend leaks between jobs, not during them. As a scheduled flow the audit catches the leak on a cadence, the waiting threshold is an input, and the report goes straight to the team channel that can terminate with one click.

    ## Prerequisites

    - AWS credentials with `elasticmapreduce:ListClusters`, `elasticmapreduce:DescribeCluster`, and `elasticmapreduce:ListSteps`.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EMR API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EMR API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the idle-cluster report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` and tune `hourly_cost_usd` to your typical cluster shape.
    3. Run manually once and confirm flagged clusters with the data team.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Auto-terminate idle clusters behind an opt-in boolean (keep the default report-only first).
    - Exclude clusters tagged `Keep=true` for long-lived interactive use.
    - Add step-failure analysis: clusters WAITING because every step failed need a different fix.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [EMR pricing](https://aws.amazon.com/emr/pricing/)
    - [EMR list-clusters API](https://docs.aws.amazon.com/cli/latest/reference/emr/list-clusters.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
