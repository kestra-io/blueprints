id: postgres-table-row-count-anomaly-detector
namespace: company.team

description: |
  Monitor PostgreSQL table row counts on a schedule, track volume changes in the KV store,
  and alert Slack when a table drops or spikes beyond configured percentage thresholds.

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: tables
    type: ARRAY
    itemType: STRING
    displayName: Watched Tables
    description: List of schema-qualified or unqualified PostgreSQL tables to audit for row count anomalies.
    defaults:
      - "public.orders"
      - "public.customers"

  - id: drop_threshold_pct
    type: INT
    displayName: Drop Threshold (%)
    description: Percentage decrease from previous count that flags a DROP anomaly.
    defaults: 30

  - id: spike_threshold_pct
    type: INT
    displayName: Spike Threshold (%)
    description: Percentage increase from previous count that flags a SPIKE anomaly.
    defaults: 100

  - id: min_rows_for_alert
    type: INT
    displayName: Minimum Row Count for Alert
    description: Minimum row threshold (max of previous and current) required to trigger an alert, preventing false alarms on small or empty tables.
    defaults: 100

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    description: Slack channel where row count anomaly alerts are delivered.
    defaults: "#data-alerts"

tasks:
  - id: validate_tables
    type: io.kestra.plugin.core.flow.If
    description: Validate every table name against a strict identifier pattern before building or running any SQL queries.
    condition: "{{ inputs.tables | jq('[.[] | select(test(\"^[a-zA-Z_][a-zA-Z0-9_]*(\\\\.[a-zA-Z_][a-zA-Z0-9_]*)?$\") | not)] | length') | first > 0 }}"
    then:
      - id: reject_invalid_table_names
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Invalid table name format in inputs.tables: each table identifier must match '^[a-zA-Z_][a-zA-Z0-9_]*(\\.[a-zA-Z_][a-zA-Z0-9_]*)?$'"

  - id: count_tables
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Read-only query computing exact COUNT(*) for all configured tables in a single UNION ALL round trip with double-quoted identifiers.
    url: "{{ secret('POSTGRES_URL') }}"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      {% for t in inputs.tables %}
      SELECT
        '{{ t }}' AS table_name,
        count(*)::bigint AS current_count
      FROM {% if t contains '.' %}"{{ (t | split('.'))[0] }}"."{{ (t | split('.'))[1] }}"{% else %}"{{ t }}"{% endif %}
      {% if not loop.last %} UNION ALL {% endif %}
      {% endfor %}

  - id: get_previous_counts
    type: io.kestra.plugin.core.kv.Get
    description: Fetch previous table row counts and check timestamp from Kestra KV store. Returns null on the first run.
    key: postgres_table_row_count_baseline
    errorOnMissing: false

  - id: detect_anomalies
    type: io.kestra.plugin.core.debug.Return
    description: Evaluate current counts against baseline, flagging drop and spike anomalies while handling zero counts safely.
    format: |
      {{ {'current': outputs.count_tables.rows, 'previous': outputs.get_previous_counts.value, 'drop_threshold': inputs.drop_threshold_pct, 'spike_threshold': inputs.spike_threshold_pct, 'min_rows': inputs.min_rows_for_alert} | jq('
        . as $root
        | ($root.previous.counts // {}) as $prev_map
        | ($root.previous.checked_at // "N/A") as $checked_at
        | [
            $root.current[]
            | .table_name as $tbl
            | (.current_count | tonumber) as $curr
            | ($prev_map[$tbl]) as $raw_prev
            | if $raw_prev == null then
                empty
              else
                ($raw_prev | tonumber) as $prev
                | ([$curr, $prev] | max) as $max_val
                | if $max_val < $root.min_rows then
                    empty
                  else
                    (if $prev == 0 then
                      (if $curr > 0 then 100.0 else 0.0 end)
                     else
                      ((($curr - $prev) / $prev) * 100.0)
                     end) as $pct
                    | if $prev > 0 and $pct <= (-1 * $root.drop_threshold) then
                        {
                          table: $tbl,
                          type: "DROP",
                          previous: $prev,
                          current: $curr,
                          pct_change: ($pct | round),
                          previous_checked_at: $checked_at
                        }
                      elif $pct >= $root.spike_threshold then
                        {
                          table: $tbl,
                          type: "SPIKE",
                          previous: $prev,
                          current: $curr,
                          pct_change: ($pct | round),
                          previous_checked_at: $checked_at
                        }
                      else
                        empty
                      end
                  end
              end
          ]
      ') | first | toJson }}

  - id: log_baseline_seeding
    type: io.kestra.plugin.core.log.Log
    description: Emits an audit log when no baseline existed in KV, confirming initial seed mode without alerts.
    runIf: "{{ outputs.get_previous_counts.value is null }}"
    message: "No baseline found in KV store (key: postgres_table_row_count_baseline). First run: seeded baseline row counts for {{ inputs.tables | length }} tables without sending alerts."

  - id: check_anomalies_gate
    type: io.kestra.plugin.core.flow.If
    description: Branch execution to alert Slack if any table row count drop or spike was detected.
    condition: "{{ (fromJson(outputs.detect_anomalies.value) | length) > 0 }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Deliver actionable alert card to Slack listing every anomalous table with before and after counts.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        retry:
          type: exponential
          interval: PT5S
          maxInterval: PT30S
          maxAttempts: 3
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": ":warning: *PostgreSQL Table Row Count Anomaly Detected*\n• *Execution*: `{{ execution.id }}`\n• *Watched Tables*: {{ inputs.tables | length }}\n• *Anomalies Found*: {{ fromJson(outputs.detect_anomalies.value) | length }}\n\n{% for a in fromJson(outputs.detect_anomalies.value) %}• *{{ a.table }}*: *{{ a.type }}* ({{ a.pct_change }}%)\n  Previous: `{{ a.previous }}` rows (at {{ a.previous_checked_at }})\n  Current: `{{ a.current }}` rows\n{% endfor %}"
          }

  - id: update_baseline_kv
    type: io.kestra.plugin.core.kv.Set
    description: Persist the current table counts and timestamp to KV store as the new baseline. Runs only after Slack notification succeeds.
    key: postgres_table_row_count_baseline
    kvType: JSON
    overwrite: true
    value: |
      {{ {'current': outputs.count_tables.rows, 'previous': outputs.get_previous_counts.value, 'checked_at': (now() | date("yyyy-MM-dd'T'HH:mm:ss'Z'"))} | jq('
        . as $root
        | ($root.previous.counts // {}) as $prev_map
        | ($root.current | map({(.table_name): (.current_count | tonumber)}) | add) as $curr_map
        | {
            counts: ($prev_map + $curr_map),
            checked_at: $root.checked_at
          }
      ') | first | toJson }}

triggers:
  - id: hourly_anomaly_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Hourly row count audit schedule. Shipped disabled by default until database secrets and watched tables are verified.
    cron: "0 * * * *"
    disabled: true

extend:
  title: Track PostgreSQL Table Row Count Anomalies and Alert Slack
  metaTitle: PostgreSQL Table Row Count Anomaly Detector | Kestra
  shortDescription: Monitor PostgreSQL table row counts on a schedule, track volume changes in the KV store, and alert Slack on sudden drops or spikes.
  metaDescription: Detect PostgreSQL table row count drops and spikes on a schedule using Kestra KV store baselines and dispatch actionable Slack alerts.
  description: |
    Automated data pipelines, replication jobs, and application migrations can inadvertently truncate tables, skip ETL batches, or produce runaway row duplication. Detecting unexpected data volume swings before downstream analytics, machine learning features, or customer reports consume corrupted data is critical for database reliability.

    This workflow queries configured PostgreSQL tables on a schedule, calculates exact row counts in a single round trip, compares current volumes against the previous run stored in Kestra KV store, and posts an incident alert to Slack when any table breaches percentage drop or spike thresholds.

    ## How it works

    1. `hourly_anomaly_check` (`io.kestra.plugin.core.trigger.Schedule`) initiates the workflow on a recurring hourly schedule (shipped disabled).
    2. `validate_tables` (`io.kestra.plugin.core.flow.If`) inspects the input table list with a regular expression filter (`^[a-zA-Z_][a-zA-Z0-9_]*(\.[a-zA-Z_][a-zA-Z0-9_]*)?$`). If an invalid identifier is provided, `reject_invalid_table_names` (`io.kestra.plugin.core.execution.Fail`) halts execution before any database connection is opened.
    3. `count_tables` (`io.kestra.plugin.jdbc.postgresql.Query`) runs a single read-only `UNION ALL` query against PostgreSQL with double-quoted identifiers to fetch exact `count(*)::bigint` for every watched table in one database round trip.
    4. `get_previous_counts` (`io.kestra.plugin.core.kv.Get`) retrieves the previous run row count map and timestamp from Kestra KV store under key `postgres_table_row_count_baseline`. On the initial run, this returns null.
    5. `detect_anomalies` (`io.kestra.plugin.core.debug.Return`) evaluates each table count against its baseline. When a table has no previous entry, it is treated as a baseline seed and ignored for alerts. For tables with a previous count, percent change is calculated. A `DROP` is flagged when count falls by at least `drop_threshold_pct`, and a `SPIKE` is flagged when count grows by at least `spike_threshold_pct`, provided the maximum of previous and current count meets `min_rows_for_alert`. A previous count of zero is treated safely as a 100% spike if current rows exceed `min_rows_for_alert`, avoiding division by zero.
    6. `log_baseline_seeding` (`io.kestra.plugin.core.log.Log`) logs a message when the baseline key was missing, recording that initial counts were seeded.
    7. `check_anomalies_gate` (`io.kestra.plugin.core.flow.If`) evaluates the anomaly list. If one or more tables are flagged, `alert_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an incident card with previous counts, current counts, percentage deltas, and execution metadata.
    8. `update_baseline_kv` (`io.kestra.plugin.core.kv.Set`) updates the KV baseline map with the latest row counts and timestamp. Because this task runs sequentially after the Slack notification, any failure in Slack alert dispatch leaves the old baseline intact for a retry on the next execution.

    ## What you get

    - Single-roundtrip row count audit across multiple PostgreSQL tables without executing multiple distinct connections.
    - SQL injection protection by enforcing strict identifier regex validation and double-quoting schema and table names.
    - Stateful anomaly detection powered by Kestra KV store without requiring external state databases or heavy Python agents.
    - Noise immunity using `min_rows_for_alert` to prevent alerts on small or empty tables.
    - Atomic notification delivery: one structured Slack message summarizing all anomalous tables for the run.
    - Safe state transitions: KV baseline update occurs only after Slack alert delivery succeeds.

    ## Who it's for

    - Data Engineers and Analytics Engineers monitoring warehouse landing tables and ELT replication pipelines.
    - Database Administrators (DBAs) guarding transactional PostgreSQL databases against accidental truncation or mass deletion.
    - Site Reliability Engineers (SREs) tracking data ingestion health across production microservices.

    ## Why orchestrate this with Kestra

    - Declarative YAML orchestration combining database drivers, state persistence, and notification webhooks without writing custom microservices.
    - Native KV store enables stateful metric comparisons between scheduled runs with zero external infrastructure.
    - Flow-level concurrency queuing (`limit: 1`, `behavior: QUEUE`) prevents race conditions between overlapping scheduled runs.
    - Secret masking ensures database credentials and Slack webhook tokens remain encrypted and redacted from execution logs.

    ## Prerequisites

    - Reachable PostgreSQL database (version 12 or higher recommended).
    - Database user with `SELECT` permissions on watched tables. A read-only user is strongly recommended.
    - Incoming Webhook URL configured in Slack for your alerts channel.

    ### Secrets

    - `POSTGRES_URL`: PostgreSQL JDBC connection URL, for example `jdbc:postgresql://<host>:5432/<database>`.
    - `POSTGRES_USER`: Database username with read permissions.
    - `POSTGRES_PASSWORD`: Database user password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start

    1. Configure `POSTGRES_URL`, `POSTGRES_USER`, `POSTGRES_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. Adjust `inputs.tables` to point to the tables you wish to monitor (for example `["public.orders", "public.customers"]`).
    4. Run the flow once manually. The initial run seeds the baseline in the KV store without sending alerts.
    5. Test anomaly detection on a throwaway table: delete half the rows in a test table, re-execute the flow, and verify the `DROP` alert card arrives in Slack.
    6. To reset baselines at any time, delete the `postgres_table_row_count_baseline` KV key in the Kestra UI; the subsequent execution will re-seed silently.
    7. Once verified, enable the `hourly_anomaly_check` schedule trigger.

    ## How to extend

    - **Estimate-based counting for massive tables**: For multi-million or billion-row tables where `SELECT count(*)` causes prolonged sequential table scans, replace exact counting with an estimate query querying `pg_stat_user_tables`:
      ```sql
      SELECT schemaname || '.' || relname AS table_name, n_live_tup AS current_count
      FROM pg_stat_user_tables
      WHERE schemaname || '.' || relname IN (...)
      ```
    - **Multi-channel routing**: Extend `check_anomalies_gate` to page on-call teams via PagerDuty or create Jira incident tickets for drops exceeding 50%.
    - **Dynamic table discovery**: Add an information schema query task upstream to automatically discover all tables in a given schema rather than configuring a static list.

    ## Links

    - [Kestra PostgreSQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-postgres)
    - [Kestra Key-Value Store Documentation](https://kestra.io/docs/concepts/kv-store)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications)
    - [PostgreSQL Table Statistics Documentation](https://www.postgresql.org/docs/current/monitoring-stats.html)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
