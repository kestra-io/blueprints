id: aws-network-firewall-dropped-packets-sentinel
namespace: company.security

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region where the Network Firewall is deployed.
  - id: firewall_name
    type: STRING
    defaults: production-perimeter-firewall
    description: Name of the AWS Network Firewall to monitor.
  - id: max_dropped_packets_threshold
    type: INT
    defaults: 500
    description: Maximum permissible dropped packets in a 15-minute window before alerting.

tasks:
  - id: query_firewall_drops
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws cloudwatch get-metric-statistics           --namespace AWS/NetworkFirewall           --metric-name DroppedPackets           --dimensions Name=FirewallName,Value="{{ inputs.firewall_name }}"           --start-time $(date -u -v-15m +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "15 minutes ago" +%Y-%m-%dT%H:%M:%SZ)           --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ)           --period 900           --statistics Sum           --output json > nfw_drops.json
        python3 -c "
        import json
        with open('nfw_drops.json') as f:
            dps = json.load(f).get('Datapoints', [])
        total_drops = int(sum(dp.get('Sum', 0) for dp in dps))
        result = {
            'firewall_name': '{{ inputs.firewall_name }}',
            'dropped_packets': total_drops,
            'alert_triggered': total_drops > {{ inputs.max_dropped_packets_threshold }}
        }
        with open('nfw_summary.json', 'w') as out:
            json.dump(result, out)
        print('Network Firewall audit:', result)
        "
    outputFiles:
      - nfw_summary.json

  - id: evaluate_packet_drops
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.query_firewall_drops.outputFiles['nfw_summary.json'])).alert_triggered }}"
    then:
      - id: alert_secops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":shield: *AWS Network Firewall Drop Alert*: Firewall `{{ inputs.firewall_name }}` dropped {{ fromJson(read(outputs.query_firewall_drops.outputFiles['nfw_summary.json'])).dropped_packets }} packets in the last 15 minutes. Investigate potential volumetric port scans, brute-force attempts, or misconfigured egress rules."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Network Firewall Sentinel Failure*: Failed to query CloudWatch metrics for firewall `{{ inputs.firewall_name }}`."
      }

triggers:
  - id: scheduled_nfw_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits AWS Network Firewall CloudWatch metrics to detect abnormal packet drop surges caused by security threats or policy misconfigurations."
  metaTitle: AWS Network Firewall Dropped Packets Security Sentinel with Kestra
  title: AWS Network Firewall Dropped Packets Security Sentinel
  shortDescription: Audits AWS Network Firewall CloudWatch metrics to detect abnormal packet drop surges caused by security threats or policy misconfigurations.
  description: |
    ## How it works
    This sentinel leverages `AwsCLI` to query CloudWatch for the `DroppedPackets` metric on the target Network Firewall over rolling 15-minute periods. It detects traffic filtering spikes caused by intrusion detection signatures, domain list blocks, or port scans, alerting SecOps teams to investigate potential cyber threats.

    ## What you get
    - Real-time visibility into perimeter network defense blocks.
    - Early warning against malicious port scanning or outbound malware C2 traffic.
    - Automated Slack delivery tracking firewall name and total dropped packet counts.

    ## Who it's for
    - Security operations (SecOps) teams, SOC analysts, and network security engineers.
    - Platform architects managing perimeter VPC egress inspection.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled operational health checks with native error handling, secret injection, and multi-channel alerting.

    ## Prerequisites
    - AWS IAM credentials with `cloudwatch:GetMetricStatistics` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `firewall_name`, `aws_region`, and credentials.
    3. Run manually to check current dropped packet levels.

    ## How to extend
    - Query CloudWatch Logs for Network Firewall alert and flow logs to extract attacker IPs.
    - Automatically update stateful rule groups to block persistent attacker CIDR blocks.
    - Forward firewall metrics to AWS Security Hub or Datadog.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [AWS Network Firewall CloudWatch Metrics](https://docs.aws.amazon.com/network-firewall/latest/developerguide/monitoring-cloudwatch.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
