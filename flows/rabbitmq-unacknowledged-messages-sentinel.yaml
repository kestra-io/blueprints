id: rabbitmq-unacknowledged-messages-sentinel
namespace: company.messaging

inputs:
  - id: rabbitmq_management_host
    type: STRING
    defaults: rabbitmq.internal:15672
    description: Host and port of the RabbitMQ Management API.
  - id: rabbitmq_username
    type: STRING
    defaults: guest
    description: Username for RabbitMQ Management API.
  - id: max_unack_messages_threshold
    type: INT
    defaults: 100
    description: Maximum permissible unacknowledged messages before alerting.

tasks:
  - id: audit_unack_messages
    type: io.kestra.plugin.scripts.python.Script
    description: Audits RabbitMQ queues for unacknowledged message threshold breaches.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      RMQ_HOST: "{{ inputs.rabbitmq_management_host }}"
      RMQ_USER: "{{ inputs.rabbitmq_username }}"
      RMQ_PASS: "{{ secret('RABBITMQ_PASSWORD') }}"
      THRESHOLD: "{{ inputs.max_unack_messages_threshold }}"
    script: |
      import os
      import sys
      import requests
      from requests.auth import HTTPBasicAuth
      from kestra import Kestra

      host = os.environ.get("RMQ_HOST", "").rstrip("/")
      user = os.environ.get("RMQ_USER", "")
      password = os.environ.get("RMQ_PASS", "")
      threshold = int(os.environ.get("THRESHOLD", "100"))
      url = f"http://{host}/api/queues"

      try:
          resp = requests.get(url, auth=HTTPBasicAuth(user, password), timeout=15)
          resp.raise_for_status()
          queues = resp.json()
      except Exception as err:
          print(f"Error: Failed to query queues at {url}: {err}", file=sys.stderr)
          sys.exit(1)

      unack_list = []
      for q in queues:
          name = q.get("name", "")
          unack = q.get("messages_unacknowledged", 0)
          consumers = q.get("consumers", 0)
          if unack > threshold:
              unack_list.append({"queue": name, "unack_count": unack, "consumers": consumers})

      breached_count = len(unack_list)
      alert_triggered = bool(breached_count > 0)
      print(f"Unack audit: total={len(queues)}, breached={breached_count}, alert={alert_triggered}")

      Kestra.outputs({
          "total_queues": len(queues),
          "breached_count": breached_count,
          "alert_triggered": alert_triggered
      })

  - id: evaluate_worker_lockup
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_unack_messages.vars.alert_triggered }}"
    then:
      - id: alert_messaging_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":fire: *RabbitMQ Unack Spike Alert*: Detected {{ outputs.audit_unack_messages.vars.breached_count }} queues with unacknowledged messages exceeding {{ inputs.max_unack_messages_threshold }} on {{ inputs.rabbitmq_management_host }}. Worker lockup or memory leak likely."
          }

outputs:
  - id: total_queues
    type: INT
    value: "{{ outputs.audit_unack_messages.vars.total_queues }}"
  - id: breached_count
    type: INT
    value: "{{ outputs.audit_unack_messages.vars.breached_count }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.audit_unack_messages.vars.alert_triggered }}"

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *RabbitMQ Sentinel Execution Failure*: Failed to query queue metrics on {{ inputs.rabbitmq_management_host }}."
      }

triggers:
  - id: scheduled_unack_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  metaDescription: "Audits RabbitMQ queues to detect spikes in unacknowledged messages caused by crashed or hung consumer worker processes."
  metaTitle: RabbitMQ Unacknowledged Message Spike and Worker Lockup Sentinel with Kestra
  title: RabbitMQ Unacknowledged Message Spike and Worker Lockup Sentinel
  shortDescription: Audits RabbitMQ queues to detect spikes in unacknowledged messages caused by crashed or hung consumer worker processes.
  description: |
    ## How it works
    This workflow queries the RabbitMQ Management HTTP API across all active queues. It tracks `messages_unacknowledged` counts to detect when worker processes take delivery of messages but fail to acknowledge or reject them due to thread deadlocks, memory leaks, or unhandled exceptions.

    ## What you get
    - Proactive visibility into hung or uncommunicative consumer worker processes.
    - Early prevention of consumer channel prefetch buffer exhaustion.
    - Instant Slack alerts highlighting affected queues, unacknowledged counts, and active consumer numbers.

    ## Who it's for
    - Distributed systems developers and SREs operating RabbitMQ messaging backbones.
    - Application teams maintaining background worker microservice fleets.

    ## Why orchestrate this with Kestra
    Kestra automates operational monitoring across message broker clusters, running scheduled health checks with fine-grained error management and notification delivery.

    ## Prerequisites
    - RabbitMQ Management plugin enabled.
    - Secrets `RABBITMQ_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `rabbitmq_management_host` and credentials.
    3. Run manually to check current unacknowledged message levels.

    ## How to extend
    - Query channel-level connection churn via `/api/channels` to identify the specific hung worker IP.
    - Automatically restart hung worker pods on Kubernetes via kubectl commands.
    - Forward unacknowledged message trends to Prometheus or Datadog.

    ## Links
    - [RabbitMQ Management API Documentation](https://www.rabbitmq.com/docs/management)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
