id: break-glass-privileged-account-use-watchdog
namespace: company.team
description: |
  Watch break-glass privileged accounts for use without a matching approval record. The flow
  takes a list of break-glass accounts, a JSON array of audit events, and a JSON array of
  approval records, then classifies every break-glass use as approved or unapproved. A use
  counts as approved only when an approval record names the same account and its validity
  window covers the event time. Anything else (no record, an expired window, a window that
  has not started yet, or an event that cannot be attributed to an account) counts as
  unapproved, and the flow alerts Slack and fails. The bundled demo data shows one approved
  use, one use with no approval, and one use outside its approval window, so a first run
  exercises the alert path end to end.
triggers:
  - id: daily_break_glass_watch
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Daily 08:00 UTC check. Shipped disabled; enable it once audit_events_json and approvals_json point at real audit and approval feeds and a manual run has been verified."
    cron: "0 8 * * *"
    disabled: true
inputs:
  - id: break_glass_accounts
    type: STRING
    displayName: "Break-Glass Accounts"
    defaults: "bg-admin,bg-root"
    description: Comma-separated list of break-glass privileged account names. Matching is exact after trimming whitespace.
  - id: audit_events_json
    type: STRING
    displayName: "Audit Events JSON"
    defaults: |
      [
        {"account": "bg-admin", "timestamp": "2026-10-20T09:15:00Z", "action": "console-login"},
        {"account": "bg-admin", "timestamp": "2026-10-20T14:30:00Z", "action": "policy-change"},
        {"account": "bg-root", "timestamp": "2026-10-21T02:05:00Z", "action": "console-login"},
        {"account": "alice", "timestamp": "2026-10-20T10:00:00Z", "action": "console-login"}
      ]
    description: JSON array of audit events. Each event needs an account, an ISO 8601 timestamp, and an action. Events for accounts outside the break-glass list are ignored.
  - id: approvals_json
    type: STRING
    displayName: "Approvals JSON"
    defaults: |
      [
        {"account": "bg-admin", "valid_from": "2026-10-20T09:00:00Z", "valid_until": "2026-10-20T10:00:00Z", "ticket": "CHG-1042", "approver": "sec-lead"},
        {"account": "bg-root", "valid_from": "2026-10-19T00:00:00Z", "valid_until": "2026-10-19T23:59:59Z", "ticket": "CHG-1031", "approver": "sec-lead"}
      ]
    description: JSON array of approval records. Each record needs an account, a valid_from timestamp, and a valid_until timestamp. Ticket and approver are recorded in the verdict for traceability.
tasks:
  - id: evaluate_break_glass_use
    type: io.kestra.plugin.scripts.python.Script
    description: Classifies every break-glass use in the audit events against the approval records. Approved requires an exact account match plus an event time inside the approval window. Unapproved covers no record, an expired window, a window not yet started, and events that cannot be attributed to an account. Emits total_uses, approved_uses, unapproved_uses, and unapproved_details through Kestra.outputs.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      BREAK_GLASS_ACCOUNTS: "{{ inputs.break_glass_accounts }}"
      AUDIT_EVENTS_JSON: "{{ inputs.audit_events_json }}"
      APPROVALS_JSON: "{{ inputs.approvals_json }}"
    script: |
      import json
      import os
      from datetime import datetime, timezone

      from kestra import Kestra


      def parse_time(value):
          if not isinstance(value, str):
              return None
          text = value.strip()
          if not text:
              return None
          if text.endswith("Z"):
              text = text[:-1] + "+00:00"
          try:
              parsed = datetime.fromisoformat(text)
          except ValueError:
              return None
          if parsed.tzinfo is None:
              parsed = parsed.replace(tzinfo=timezone.utc)
          return parsed


      accounts = {a.strip() for a in os.environ.get("BREAK_GLASS_ACCOUNTS", "").split(",") if a.strip()}

      try:
          events = json.loads(os.environ.get("AUDIT_EVENTS_JSON", "[]"))
      except json.JSONDecodeError:
          events = []
      try:
          approvals = json.loads(os.environ.get("APPROVALS_JSON", "[]"))
      except json.JSONDecodeError:
          approvals = []
      if not isinstance(events, list):
          events = []
      if not isinstance(approvals, list):
          approvals = []

      approved = []
      unapproved = []
      for event in events:
          if not isinstance(event, dict):
              unapproved.append({"event": event, "reason": "malformed event, not an object"})
              continue
          account = event.get("account")
          timestamp = event.get("timestamp")
          action = event.get("action")
          if not isinstance(account, str) or not account.strip():
              unapproved.append({"event": event, "reason": "unattributable event, no account"})
              continue
          account = account.strip()
          if account not in accounts:
              continue
          event_time = parse_time(timestamp)
          if event_time is None:
              unapproved.append({"account": account, "timestamp": timestamp, "action": action, "reason": "unparseable timestamp, cannot prove approval"})
              continue
          matching = [a for a in approvals if isinstance(a, dict) and a.get("account") == account]
          covering = None
          for record in matching:
              start = parse_time(record.get("valid_from"))
              end = parse_time(record.get("valid_until"))
              if start is not None and end is not None and start <= event_time <= end:
                  covering = record
                  break
          if covering is not None:
              approved.append({"account": account, "timestamp": timestamp, "action": action, "ticket": covering.get("ticket"), "approver": covering.get("approver")})
              continue
          if not matching:
              reason = "no approval record for this account"
          elif any(parse_time(r.get("valid_until")) is not None and event_time > parse_time(r.get("valid_until")) for r in matching):
              reason = "approval window expired before this use"
          elif any(parse_time(r.get("valid_from")) is not None and event_time < parse_time(r.get("valid_from")) for r in matching):
              reason = "approval window had not started at this use"
          else:
              reason = "no approval record covers this use"
          unapproved.append({"account": account, "timestamp": timestamp, "action": action, "reason": reason})

      verdict = "ALERT" if unapproved else "CLEAN"
      Kestra.outputs({
          "total_uses": len(approved) + len(unapproved),
          "approved_uses": len(approved),
          "unapproved_uses": len(unapproved),
          "unapproved_details": unapproved,
          "verdict": verdict,
      })
  - id: alert_on_unapproved_use
    type: io.kestra.plugin.core.flow.If
    description: Alerts Slack and fails the execution when any break-glass use lacks a covering approval. A clean run only logs the verdict.
    condition: "{{ outputs.evaluate_break_glass_use.vars.unapproved_uses > 0 }}"
    then:
      - id: alert_security_channel
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Pages the security channel with the unapproved break-glass use count and details, so an unapproved privileged use is visible immediately.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "ALERT: {{ outputs.evaluate_break_glass_use.vars.unapproved_uses }} unapproved break-glass privileged account use(s) out of {{ outputs.evaluate_break_glass_use.vars.total_uses }} total (verdict {{ outputs.evaluate_break_glass_use.vars.verdict }}, execution {{ execution.id }}). Details: {{ outputs.evaluate_break_glass_use.vars.unapproved_details | json }}. Treat as unauthorized privileged access until an approver confirms otherwise."
          }
      - id: fail_on_unapproved_use
        type: io.kestra.plugin.core.execution.Fail
        description: Fails the execution so an unapproved break-glass use can never read as a passing check.
        message: "Unapproved break-glass privileged account use detected. See the Slack alert and unapproved_details output."
    else:
      - id: log_clean_verdict
        type: io.kestra.plugin.core.log.Log
        description: Records a clean run when every break-glass use had a covering approval.
        message: "Break-glass watchdog verdict CLEAN: {{ outputs.evaluate_break_glass_use.vars.total_uses }} use(s), all approved."
  - id: log_watchdog_complete
    type: io.kestra.plugin.core.log.Log
    description: Always runs last, printing the headline counts regardless of which branch fired.
    message: "Break-glass watchdog complete. Total uses: {{ outputs.evaluate_break_glass_use.vars.total_uses }}, approved: {{ outputs.evaluate_break_glass_use.vars.approved_uses }}, unapproved: {{ outputs.evaluate_break_glass_use.vars.unapproved_uses }}, verdict: {{ outputs.evaluate_break_glass_use.vars.verdict }}."
errors:
  - id: alert_watchdog_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack if the watchdog itself fails, so a broken check never reads as no unapproved use.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Break-glass privileged account watchdog FAILED (flow {{ flow.id }}, execution {{ execution.id }}). The check did not complete, so unapproved use cannot be ruled out. Investigate before trusting the last verdict."
      }
extend:
  title: Break-Glass Privileged Account Use Watchdog
  metaTitle: 'Break-Glass Privileged Account Watchdog | Kestra'
  shortDescription: Watch break-glass privileged accounts for use without a covering approval record, alert Slack, and fail closed on unapproved use.
  metaDescription: 'Daily watchdog for break-glass privileged accounts: classify every use against approval records, alert on unapproved use, and fail closed so a broken check never reads as clean.'
  description: |
    ## What it does

    Break-glass accounts exist for emergencies, which makes their use the highest-signal event in an audit log and the easiest to miss when nobody is watching. This blueprint watches a list of break-glass privileged accounts and classifies every one of their uses against an approval record. A use is approved only when an approval record names the same account and its validity window covers the event time. Every other break-glass use (no approval record, an expired window, a window that has not started yet, or an event that cannot be attributed to an account) is unapproved: the flow alerts Slack with the details and fails, so unapproved privileged use can never read as a passing check. A failure of the watchdog itself alerts Slack separately, so a broken check never reads as a clean bill of health. The flow changes nothing in the audited system; it is audit-only.

    ## Prerequisites

    - A list of break-glass privileged account names (the `break_glass_accounts` input).
    - Audit events as a JSON array (`audit_events_json`), each event with an account, an ISO 8601 timestamp, and an action. Point this at a real audit feed export in production; the bundled demo data is for a first run only.
    - Approval records as a JSON array (`approvals_json`), each record with an account, a valid_from timestamp, and a valid_until timestamp, plus ticket and approver for traceability.
    - A Slack incoming webhook URL stored as the `SLACK_WEBHOOK_URL` secret for the security channel.

    ## How it works

    1. `daily_break_glass_watch` (`io.kestra.plugin.core.trigger.Schedule`) runs the check daily at 08:00 UTC. It ships disabled; enable it once the inputs point at real feeds and a manual run has been verified.
    2. `evaluate_break_glass_use` (`io.kestra.plugin.scripts.python.Script`) parses the accounts, events, and approvals, then classifies each break-glass use. Approval requires an exact account match and an event time inside the validity window. Malformed or unattributable events count as unapproved (fail closed). It emits `total_uses`, `approved_uses`, `unapproved_uses`, `unapproved_details`, and `verdict` through `Kestra.outputs`.
    3. `alert_on_unapproved_use` (`io.kestra.plugin.core.flow.If`) branches on `unapproved_uses > 0`. On the alert branch, `alert_security_channel` posts the count and details to Slack and `fail_on_unapproved_use` fails the execution. On a clean run, `log_clean_verdict` records the verdict.
    4. `log_watchdog_complete` always runs last and prints the headline counts. The `errors` block posts to Slack if the watchdog itself fails.
    5. The bundled demo data yields 3 break-glass uses (1 approved, 2 unapproved) plus 1 ignored non-break-glass event, so a first run exercises the alert path end to end.

    ## How to adapt it

    - Replace the JSON inputs with a fetch step that pulls the audit feed and the approval store (ticketing system export or approval table) on each run, keeping the same event and record shapes so the classifier is unchanged.
    - Tighten or loosen the account list per environment, and add a second alert target (for example a ticketing task) alongside the Slack webhook for unapproved use that needs a tracked incident.
    - Archive `unapproved_details` to a warehouse table on every run to build a break-glass use history for audits, instead of relying on the Slack channel as the record.
    - Add a post-incident step that disables or rotates a break-glass credential after an unapproved use is confirmed, once that action has its own approval gate.
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
