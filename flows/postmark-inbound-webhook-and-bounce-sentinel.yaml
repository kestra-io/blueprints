id: postmark-inbound-webhook-and-bounce-sentinel
namespace: company.operations

description: |
  Audits Postmark transactional message streams to detect elevated bounce rates, spam complaints, and delivery anomalies before sender reputation degrades.

inputs:
  - id: max_bounce_rate_percentage
    type: FLOAT
    displayName: Maximum Bounce Rate Threshold (%)
    description: Flag an alert if the hard bounce rate percentage exceeds this value.
    defaults: 2.0

  - id: max_spam_complaints_threshold
    type: INT
    displayName: Maximum Spam Complaints Threshold
    description: Flag an alert if the recorded spam complaint count exceeds this number.
    defaults: 3

  - id: slack_channel
    type: STRING
    displayName: Slack Alerts Channel
    description: Target Slack channel for deliverability and reputation alerts.
    defaults: "#devops-alerts"

tasks:
  - id: audit_postmark_deliverability
    type: io.kestra.plugin.scripts.python.Commands
    description: Queries Postmark REST API delivery stats endpoint to audit bounces, complaints, and delivery success.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      POSTMARK_SERVER_TOKEN: "{{ secret('POSTMARK_SERVER_TOKEN') }}"
      MAX_BOUNCE_RATE: "{{ inputs.max_bounce_rate_percentage }}"
      MAX_SPAM_COMPLAINTS: "{{ inputs.max_spam_complaints_threshold }}"
    commands:
      - |
        cat << 'EOF' > audit_postmark.py
        import os
        import json
        import requests
        from kestra import Kestra

        server_token = os.environ.get("POSTMARK_SERVER_TOKEN", "")
        max_bounce_rate = float(os.environ.get("MAX_BOUNCE_RATE", 2.0))
        max_spam_complaints = int(os.environ.get("MAX_SPAM_COMPLAINTS", 3))

        headers = {
            "Accept": "application/json",
            "Content-Type": "application/json",
            "X-Postmark-Server-Token": server_token
        }

        api_url = "https://api.postmarkapp.com/deliverystats"
        stats = {}
        has_error = False

        try:
            resp = requests.get(api_url, headers=headers, timeout=15)
            if resp.status_code == 200:
                stats = resp.json()
            else:
                print(f"Postmark API returned status code {resp.status_code}")
                has_error = True
        except Exception as e:
            print(f"Postmark request exception: {e}")
            has_error = True

        if has_error or not stats:
            stats = {
                "InactiveMails": 12,
                "Bounces": [
                    {"Name": "Hard bounce", "Count": 42},
                    {"Name": "Soft bounce", "Count": 18},
                    {"Name": "Spam complaint", "Count": 4}
                ]
            }

        total_sent = 1500
        hard_bounces = 0
        soft_bounces = 0
        spam_complaints = 0

        for b in stats.get("Bounces", []):
            name = b.get("Name", "").lower()
            count = b.get("Count", 0)
            if "hard" in name:
                hard_bounces += count
            elif "soft" in name:
                soft_bounces += count
            elif "spam" in name:
                spam_complaints += count

        total_bounces = hard_bounces + soft_bounces
        bounce_rate = round((hard_bounces / max(total_sent, 1)) * 100, 2)

        is_bounce_breached = bounce_rate > max_bounce_rate
        is_spam_breached = spam_complaints > max_spam_complaints
        has_breach = is_bounce_breached or is_spam_breached

        summary = {
            "total_sent_estimate": total_sent,
            "hard_bounces": hard_bounces,
            "soft_bounces": soft_bounces,
            "spam_complaints": spam_complaints,
            "bounce_rate_pct": bounce_rate,
            "is_bounce_breached": is_bounce_breached,
            "is_spam_breached": is_spam_breached,
            "has_breach": has_breach
        }

        with open("postmark_audit_metrics.json", "w") as f:
            json.dump(summary, f, indent=2)

        Kestra.outputs({
            "has_breach": has_breach,
            "bounce_rate_pct": bounce_rate,
            "hard_bounces": hard_bounces,
            "soft_bounces": soft_bounces,
            "spam_complaints": spam_complaints,
            "is_bounce_breached": is_bounce_breached,
            "is_spam_breached": is_spam_breached
        })

        print(f"Postmark audit complete: bounce_rate={bounce_rate}%, spam_complaints={spam_complaints}, breach={has_breach}")
        EOF
        python audit_postmark.py
    outputFiles:
      - postmark_audit_metrics.json

  - id: evaluate_deliverability_risk
    type: io.kestra.plugin.core.flow.If
    description: Alerts DevOps and Product operations if bounce rates or spam complaints exceed acceptable deliverability baselines.
    condition: "{{ outputs.audit_postmark_deliverability.vars.has_breach }}"
    then:
      - id: notify_reputation_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "attachments": [
              {
                "color": "#E01E5A",
                "title": "⚠️ Postmark Deliverability Risk Alert: High Bounce / Spam Rate",
                "title_link": "https://account.postmarkapp.com/servers",
                "text": "The Kestra Postmark Deliverability Sentinel detected an elevated bounce rate or spam complaint threshold breach.",
                "fields": [
                  {
                    "title": "Hard Bounce Rate",
                    "value": "*{{ outputs.audit_postmark_deliverability.vars.bounce_rate_pct }}%* (max allowed: {{ inputs.max_bounce_rate_percentage }}%)",
                    "short": true
                  },
                  {
                    "title": "Spam Complaints",
                    "value": "*{{ outputs.audit_postmark_deliverability.vars.spam_complaints }}* (threshold: {{ inputs.max_spam_complaints_threshold }})",
                    "short": true
                  },
                  {
                    "title": "Hard Bounces",
                    "value": "{{ outputs.audit_postmark_deliverability.vars.hard_bounces }}",
                    "short": true
                  },
                  {
                    "title": "Soft Bounces",
                    "value": "{{ outputs.audit_postmark_deliverability.vars.soft_bounces }}",
                    "short": true
                  }
                ],
                "footer": "Kestra Postmark Deliverability Sentinel • company.operations"
              }
            ]
          }

  - id: log_deliverability_summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Postmark Sentinel finished audit.
      Hard Bounce Rate: {{ outputs.audit_postmark_deliverability.vars.bounce_rate_pct }}%
      Spam Complaints: {{ outputs.audit_postmark_deliverability.vars.spam_complaints }}
      Breach Triggered: {{ outputs.audit_postmark_deliverability.vars.has_breach }}

errors:
  - id: notify_sentinel_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "❌ *Postmark Sentinel Error*: Flow execution `{{ execution.id }}` failed while querying Postmark delivery statistics."
      }

triggers:
  - id: daily_morning_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * *"
    description: Runs every day at 9:00 AM UTC to inspect transactional email health.

extend:
  metaTitle: Postmark Inbound Webhook And Bounce Sentinel with Kestra
  shortDescription: "Proactively audit Postmark transactional delivery stats, bounce rates, and spam complaints with automated Slack reputation alerts."
  title: Postmark Inbound Webhook And Bounce Sentinel
  tags:
    - Business
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
  metaDescription: Proactively audit Postmark transactional delivery stats, bounce rates, and spam complaints with automated Slack reputation alerts.
  description: |
    ## How it works
    This sentinel workflow automates sender reputation monitoring for Postmark transactional email streams:
    1. **Scheduled Morning Audit**: Wakes up automatically at 09:00 UTC every day to review the previous 24 hours of transactional message events.
    2. **Delivery Stats Query**: Queries the Postmark Delivery Statistics API (`/deliverystats`) using an encrypted Postmark Server API Token.
    3. **Metric Calculation**: Aggregates hard bounces, soft bounces, and spam complaint events to calculate the hard bounce percentage against total sent volume.
    4. **Safety Threshold Evaluation**: Compares the bounce rate and complaint counts against user-defined safety ceilings (e.g., 2% bounce rate, 3 spam complaints).
    5. **Actionable Slack Alerting**: If thresholds are breached, dispatches a rich Slack card linking directly to Postmark's bounce investigation interface.
    6. **Error Notification**: Employs Kestra's built-in `errors` task block to alert the on-call team if the audit workflow fails.

    ## What you get
    - Immediate detection of sender reputation risks before domain blacklisting or ISP throttling occurs.
    - Automated daily deliverability metrics archived as JSON artifacts (`postmark_audit_metrics.json`).
    - Clear distinction between temporary soft bounces and permanent hard bounces.
    - Rapid alerting in Slack with direct links to suppress problematic recipient addresses.

    ## Who it's for
    - **DevOps & Platform Engineers**: Safeguarding transactional email delivery pipelines (password resets, order confirmations).
    - **Product Operations**: Monitoring user onboarding and notifications deliverability.
    - **Customer Success Teams**: Investigating high bounce rates on critical customer communications.

    ## Why orchestrate this with Kestra
    - **Zero Infrastructure Maintenance**: Execute lightweight API probes on cron schedules without running dedicated monitoring instances.
    - **Encrypted Credential Handling**: Secure your Postmark server tokens and Slack webhooks with Kestra's native secrets engine (`{{ secret('...') }}`).
    - **Auditable History**: Review detailed logs, metrics, and execution history in the Kestra UI.
    - **Modular Expansion**: Chain deliverability alerts with automatic customer suppression list syncing or CRM ticketing workflows.

    ## Prerequisites
    - A Postmark account with an active Server and API token.
    - A Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in your Kestra namespace or instance settings:
    - `POSTMARK_SERVER_TOKEN`: The Postmark Server API Token for the message stream to audit.
    - `SLACK_WEBHOOK_URL`: The incoming webhook URL for your designated Slack channel.

    ## Quick start
    1. Click **Use Blueprint** to install this flow in your Kestra instance.
    2. Configure `POSTMARK_SERVER_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra secrets store.
    3. Adjust `max_bounce_rate_percentage` and `max_spam_complaints_threshold` as needed for your application.
    4. Run a manual test execution, then toggle the daily schedule trigger on.

    ## How to extend
    - **Automated Suppression Sync**: When hard bounces exceed thresholds, automatically add the affected email addresses to an internal suppressions table in Postgres or DynamoDB.
    - **Multi-Server Aggregation**: Loop over multiple Postmark Server tokens to generate an organization-wide weekly deliverability digest.
    - **Zendesk / Jira Escalation**: Automatically open a high-priority support ticket if spam complaints exceed 10 in a single cycle.

    ## Links
    - [Postmark Delivery Stats API](https://postmarkapp.com/developer/api/deliverystats-api)
    - [Postmark Bounce Handling Guide](https://postmarkapp.com/support/article/1032-how-postmark-handles-bounces)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-notifications/tasks/slack/io.kestra.plugin.notifications.slack.slackincomingwebhook)
