id: graphql-query-depth-and-complexity-gate
namespace: company.security

inputs:
  - id: graphql_endpoint_url
    type: STRING
    displayName: GraphQL Endpoint URL
    defaults: "https://api.example.com/graphql"
    description: Full HTTP or HTTPS URL of the staging or candidate GraphQL deployment to probe for depth limiting middleware.

  - id: target_nesting_depth
    type: INT
    displayName: Target Nesting Depth Tested
    defaults: 7
    description: Documented maximum nesting depth tested by this security gate probe.

  - id: fail_on_missing_protection
    type: BOOL
    displayName: Fail on Missing Protection
    defaults: true
    description: Whether to fail execution when the GraphQL server executes deep queries without rejection, halting CI/CD release pipelines.

triggers:
  - id: pre_release_security_gate
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled pre-release security validation check. Shipped disabled by default; trigger manually or via CI webhook.
    cron: "0 0 * * *"
    disabled: true
    inputs:
      graphql_endpoint_url: "https://api.example.com/graphql"

tasks:
  - id: test_deep_nested_query
    type: io.kestra.plugin.graphql.Request
    description: Dispatch an intentionally deeply nested query exceeding recommended production complexity limits. failOnGraphQLErrors is disabled so rejection errors can be evaluated.
    uri: "{{ inputs.graphql_endpoint_url }}"
    headers:
      User-Agent: "Kestra-GraphQL-Security-Gate/1.0"
      Authorization: "Bearer {{ secret('GRAPHQL_AUTH_TOKEN') }}"
    failOnGraphQLErrors: false
    query: |
      query DeepComplexityProbe {
        __schema {
          queryType {
            fields {
              type {
                fields {
                  type {
                    fields {
                      type {
                        name
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    options:
      allowFailed: true

  - id: evaluate_depth_protection
    type: io.kestra.plugin.core.flow.If
    description: Check whether the server executed the nested query (VULNERABLE) or rejected it with a complexity/depth error or client failure status code (PROTECTED).
    condition: "{{ outputs.test_deep_nested_query.error is not defined and outputs.test_deep_nested_query.code == 200 and outputs.test_deep_nested_query.body is defined and outputs.test_deep_nested_query.body.__schema is defined }}"
    then:
      - id: alert_missing_depth_protection
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post high-severity security notification to Slack warning that GraphQL query depth limits are absent.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *SECURITY GATE FAILED: GraphQL Query Depth Limiter Missing* 🚨\n\n*Target Endpoint:* `{{ inputs.graphql_endpoint_url }}`\n*Tested Depth:* {{ inputs.target_nesting_depth }} levels\n*Vulnerability:* The server processed an unbounded deeply nested query without rejection, exposing the backend to recursive query Denial-of-Service (DoS) attacks.\n*Execution ID:* {{ execution.id }}\n\n*Remediation:* Enable query depth limiting middleware (e.g. `graphql-depth-limit` or `@escape.tech/graphql-armor`)."
          }

      - id: check_fail_policy
        type: io.kestra.plugin.core.flow.If
        description: Halt pipeline when fail_on_missing_protection is enabled.
        condition: "{{ inputs.fail_on_missing_protection }}"
        then:
          - id: fail_deployment_gate
            type: io.kestra.plugin.core.execution.Fail
            description: Terminate workflow with failure status to block insecure releases from deploying to production.
    else:
      - id: log_depth_protection_verified
        type: io.kestra.plugin.core.log.Log
        description: Log confirmation that the GraphQL server rejected the deep nested query as required.
        message: "PROTECTED: GraphQL endpoint {{ inputs.graphql_endpoint_url }} successfully rejected deep query probe or returned security constraint errors."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for security compliance records.
    message: "GraphQL query depth gate evaluation complete for {{ inputs.graphql_endpoint_url }}. Status: {{ outputs.test_deep_nested_query.error is not defined and outputs.test_deep_nested_query.code == 200 and outputs.test_deep_nested_query.body is defined and outputs.test_deep_nested_query.body.__schema is defined ? 'VULNERABLE' : 'PROTECTED' }}."

errors:
  - id: alert_on_gate_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert SecOps channel if network timeout or host resolution failure prevents security verification.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *GraphQL Depth Gate Probe Error*: Execution `{{ execution.id }}` failed to connect to `{{ inputs.graphql_endpoint_url }}`."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.test_deep_nested_query.error is not defined and outputs.test_deep_nested_query.code == 200 and outputs.test_deep_nested_query.body is defined and outputs.test_deep_nested_query.body.__schema is defined ? 'VULNERABLE' : 'PROTECTED' }}"
  - id: http_response_code
    type: INT
    value: "{{ outputs.test_deep_nested_query.code }}"

extend:
  title: GraphQL query depth and complexity limit enforcement gate
  metaTitle: GraphQL Query Depth Gate | Kestra
  shortDescription: Assert that GraphQL APIs enforce query depth and complexity limits before deployment, blocking recursive DoS vulnerabilities.
  metaDescription: Verify GraphQL APIs enforce query depth and complexity limits before release, preventing nested query denial-of-service vulnerabilities.
  description: |
    Prevent recursive query denial-of-service (DoS) vulnerabilities by validating that GraphQL APIs enforce query depth and complexity limiting middleware before code reaches production. In GraphQL, nested relationship graphs allow clients to send recursive queries (e.g. `user { friends { friends { friends ... } } }`) that force backend resolvers into expensive exponential database joins and CPU exhaustion. To protect servers, production APIs must implement query depth limiters that reject queries exceeding strict nesting thresholds (typically 5 to 7 levels). This gate dispatches an intentionally deep nested query against your candidate deployment, verifies that the server successfully rejects it, alerts SecOps if the query was processed without restriction, and fails deployment pipelines before vulnerable configurations go live.

    ## How it works
    1. A `Schedule` trigger periodically invokes the security gate, or CI/CD pipelines trigger it before promoting staging builds.
    2. Task `test_deep_nested_query` uses `io.kestra.plugin.graphql.Request` to dispatch a 7-level nested introspection query to `inputs.graphql_endpoint_url`. With `failOnGraphQLErrors: false` and `allowFailed: true`, expected security rejection errors (such as `"Query depth limit exceeded"` or HTTP 400 Bad Request) are captured cleanly without crashing the task runner.
    3. Task `evaluate_depth_protection` (`io.kestra.plugin.core.flow.If`) inspects the response:
       - If the server returns HTTP 200 with no GraphQL errors and full data, it processed the deep query without restriction (`VULNERABLE`). The workflow sends an urgent Slack alert and invokes `fail_deployment_gate` (`io.kestra.plugin.core.execution.Fail`) to halt the release.
       - If the server returns GraphQL validation errors or rejects the request, task `log_depth_protection_verified` confirms clean `PROTECTED` status.
    4. Task `log_audit_summary` emits structured compliance metrics for audit logs.
    5. Top-level `errors` handler catches network unreachable or TLS handshake failures.

    ## What you get
    - Automated pre-deployment verification that prevents shipping GraphQL endpoints vulnerable to query complexity attacks.
    - Deterministic testing of GraphQL middleware (such as `graphql-depth-limit`, `graphql-armor`, or Apollo complexity plugins).
    - Immediate Slack notifications detailing the tested endpoint, tested depth, and specific remediation guidelines.
    - Non-intrusive CI/CD gating that integrates seamlessly with GitHub Actions, GitLab CI, or Kestra webhooks.

    ## Who it's for
    - Application Security (AppSec) and SecOps engineers enforcing API resilience standards.
    - Platform and Backend Engineers maintaining high-traffic GraphQL APIs.
    - QA and DevSecOps engineers incorporating automated security regression tests into release workflows.

    ## Why orchestrate this with Kestra
    Ad-hoc security scans or manual Postman testing are rarely integrated consistently into automated promotion gates. Kestra provides declarative, version-controlled execution with native GraphQL querying, conditional branching, secrets management, and automated failure handling. With Kestra, query depth verification functions as an observable, repeatable security contract that runs automatically across staging environments.

    ## Prerequisites
    - Network access from the Kestra worker to the target GraphQL endpoint.
    - A valid authentication token or API key if the endpoint requires credentials.

    ### Secrets
    - `GRAPHQL_AUTH_TOKEN`: Bearer token or API key used in the `Authorization` header to authenticate against the GraphQL endpoint.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to post security alerts and probe failure notifications.

    ## Quick start
    1. Store your Slack webhook and API token in Kestra Secrets (`SLACK_WEBHOOK_URL` and `GRAPHQL_AUTH_TOKEN`).
    2. Configure `graphql_endpoint_url` with your staging GraphQL URL (e.g., `https://staging-api.yourcompany.com/graphql`).
    3. Trigger a manual execution from the Kestra UI to verify that your staging server successfully blocks the deep query.
    4. Connect the workflow to your deployment pipeline via Webhook trigger to enforce automated security gates on every release.

    ## How to extend
    - Add multiple test queries with varying depth levels (e.g. 5, 7, and 10) to determine the exact threshold enforced by the server.
    - Test query complexity cost analysis by dispatching wide queries with aliased fields (e.g. requesting 50 distinct aliases in one call).
    - Automatically create a GitHub security advisory or issue if the gate fails during automated daily sweeps.

    ## Links
    - [OWASP GraphQL Query Complexity Guide](https://cheatsheetseries.owasp.org/cheatsheets/GraphQL_Cheat_Sheet.html#dos-prevention)
    - [Kestra GraphQL Plugin Documentation](https://kestra.io/plugins/plugin-graphql)
    - [GraphQL Armor Security Middleware](https://escape.tech/graphql-armor/)
  tags:
    - Infrastructure
  subTags:
    - Testing & Quality
    - Policy & Compliance
  ee: false
  demo: false
