id: vault-audit-device-policy-gate
namespace: company.team
description: |
  Check that Vault audit devices are enabled and use safe logging settings.
  Write a report without audit destinations or sensitive device options.
inputs:
  - id: minimum_devices
    type: INT
    defaults: 2
    description: Minimum number of enabled audit devices (1-10).
  - id: required_paths
    type: STRING
    defaults: "file/"
    description: Comma-separated audit device mount paths that must exist. Change these to match your Vault configuration.
  - id: block_local
    type: BOOL
    defaults: true
    description: Reject devices marked local, because they are not replicated to other performance clusters.
triggers:
  - id: audit_daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"
    disabled: true
    description: Enable only after you test a valid and an invalid audit policy.
tasks:
  - id: fetch_audit_devices
    type: io.kestra.plugin.core.http.Download
    description: List enabled devices with a token that has read and sudo on sys/audit.
    uri: "{{ secret('VAULT_BASE_URL') }}/v1/sys/audit"
    method: GET
    headers:
      Accept: application/json
      X-Vault-Token: "{{ secret('VAULT_AUDIT_TOKEN') }}"
    options:
      followRedirects: false
      allowFailed: false
    saveAs: vault-audit.json
  - id: check_audit_policy
    type: io.kestra.plugin.scripts.node.Script
    description: Check device count, required paths, raw logging, filtering, and audit token accessor hashing.
    containerImage: node:22-alpine
    env:
      MINIMUM: "{{ inputs.minimum_devices }}"
      REQUIRED_PATHS: "{{ inputs.required_paths }}"
      BLOCK_LOCAL: "{{ inputs.block_local }}"
    inputFiles:
      vault-audit.json: "{{ outputs.fetch_audit_devices.uri }}"
    outputFiles:
      - vault-audit-policy-report.json
    script: |
      function inspectAudit(response,cfg){
       const obj=x=>x!==null&&typeof x==="object"&&!Array.isArray(x);
       if(!obj(response))throw Error("Vault audit response must be an object");
       const root=Object.prototype.hasOwnProperty.call(response,"data")?response.data:response;
       if(!obj(root))throw Error("Vault audit list is invalid");
       const entries=Object.entries(root);
       if(entries.length>100)throw Error("Audit device count exceeds limit");
       const issues=[],report=[];
       const norm=p=>p.endsWith("/")?p:p+"/";
       const seenPaths=new Set(),filePaths=new Map();
       for(const [name,dev] of entries){
         const path=typeof name==="string"&&name?norm(name):"unknown";
         const errors=[];
         if(seenPaths.has(path))errors.push("Duplicate device path");
         seenPaths.add(path);
         if(!obj(dev)){issues.push({path,reasons:["Device record is invalid"]});continue;}
         if(!["file","socket","syslog"].includes(dev.type))errors.push("Device type is missing or unsupported");
         const opts=dev.options===undefined?{}:dev.options;
         if(!obj(opts)){issues.push({path,reasons:["Device options are invalid"]});continue;}
         const flag=(v,missing)=>v===undefined?missing:v===true||v==="true"?true:v===false||v==="false"?false:null;
         const local=flag(dev.local,false);
         if(local===null)errors.push("Device local flag is invalid");
         if(local===true&&cfg.block_local)errors.push("Device is local to one cluster");
         const raw=flag(opts.log_raw,false);
         if(raw===null)errors.push("Raw logging flag is invalid");
         if(raw===true)errors.push("Raw audit logging can expose secret data");
         const accessor=flag(opts.hmac_accessor,true);
         if(accessor===null)errors.push("Accessor HMAC flag is invalid");
         if(accessor===false)errors.push("Accessor HMAC is disabled");
         for(const key of ["filter","exclude"]){
           const v=opts[key];
           if(v!==undefined&&v!=="")errors.push("Audit device uses "+key+" filtering or an invalid option value");
         }
         if(dev.type==="file"){
           if(typeof opts.file_path!=="string"||opts.file_path.trim()==="")errors.push("File audit destination is missing");
           else {
             const target=opts.file_path.trim();
             if(filePaths.has(target))errors.push("File destination is shared with "+filePaths.get(target));
             else filePaths.set(target,path);
           }
         }
         report.push({path,type:dev.type||"unknown",local:local===true});
         if(errors.length)issues.push({path,reasons:errors});
       }
       if(entries.length<cfg.minimum)issues.push({path:"policy",reasons:["Too few enabled audit devices"]});
       for(const path of cfg.required){
         if(!seenPaths.has(norm(path)))issues.push({path:norm(path),reasons:["Required audit device is missing"]});
       }
       const usable=report.filter(x=>x.local!==true).length;
       if(cfg.block_local&&usable<cfg.minimum&&entries.length>=cfg.minimum)issues.push({path:"policy",reasons:["Too few non-local audit devices"]});
       return {status:issues.length?"BLOCK":"PASS",device_count:entries.length,non_local_count:usable,devices:report,violation_count:issues.length,findings:issues};
      }
      const fs=require("fs"),env=process.env;
      const minimum=Number(env.MINIMUM);
      const required=(env.REQUIRED_PATHS||"").split(",").map(x=>x.trim()).filter(Boolean);
      const blockLocal=env.BLOCK_LOCAL==="true";
      if(!Number.isSafeInteger(minimum)||minimum<1||minimum>10||required.some(x=>!/^[A-Za-z0-9_/-]+$/.test(x))||!["true","false"].includes(env.BLOCK_LOCAL))throw Error("Invalid audit policy inputs");
      const raw=fs.readFileSync("vault-audit.json","utf8");
      if(Buffer.byteLength(raw,"utf8")>1048576)throw Error("Vault audit response is larger than 1 MiB");
      const result=inspectAudit(JSON.parse(raw),{minimum,required,block_local:blockLocal});
      fs.writeFileSync("vault-audit-policy-report.json",JSON.stringify(result,null,2));
      console.log("::"+JSON.stringify({outputs:{status:result.status,device_count:result.device_count,violation_count:result.violation_count}})+"::");
      console.log("Vault audit configuration policy: "+result.status);
  - id: publish_audit
    type: io.kestra.plugin.core.output.OutputValues
    description: Publish the report and status before the final gate.
    values:
      result: "{{ outputs.check_audit_policy.vars.status }}"
      report_uri: "{{ outputs.check_audit_policy.outputFiles['vault-audit-policy-report.json'] }}"
      violations: "{{ outputs.check_audit_policy.vars.violation_count }}"
  - id: enforce_audit_policy
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_audit_policy.vars.status == 'BLOCK' }}"
    description: Alert and fail if the audit device configuration breaks policy.
    then:
      - id: alert_audit_policy
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text":"Vault audit policy BLOCK. Findings: {{ outputs.check_audit_policy.vars.violation_count }}. Execution: {{ execution.id }}. Review outputs.publish_audit.values.report_uri."}
      - id: fail_audit_policy
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Vault audit configuration violates policy. Review vault-audit-policy-report.json."
    else:
      - id: log_audit_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Vault audit configuration PASS. Enabled devices: {{ outputs.check_audit_policy.vars.device_count }}."
errors:
  - id: alert_audit_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text":"Vault audit policy probe FAILED. No policy verdict. Execution: {{ execution.id }}. Check task logs and API access."}
  - id: log_audit_probe_failure
    type: io.kestra.plugin.core.log.Log
    message: "Vault audit configuration check failed. No PASS verdict was issued. Execution {{ execution.id }}."
extend:
  title: Vault Audit Device Policy Gate
  metaTitle: HashiCorp Vault Audit Device Configuration Guard
  shortDescription: Detect missing Vault audit devices, raw secret logging, disabled accessor HMAC, and filtered audit entries.
  metaDescription: Check Vault audit device coverage and log safety. Save a redacted report, alert Slack, and fail on unsafe settings.
  description: |
    Vault audit logs record API requests and responses. Missing audit devices
    create a logging gap. Raw logging can expose secret values. This flow
    checks the enabled audit configuration before scheduled compliance reviews.

    ## How it works

    1. Read GET /v1/sys/audit at the root Vault namespace.
    2. Require the configured number of enabled devices and required paths.
    3. Reject devices with log_raw=true, hmac_accessor=false, or nonempty
       filter/exclude options. Reject unknown or malformed device settings.
    4. By default, reject local devices. Detect duplicate file destinations.
    5. Save a JSON report with paths, types, counts, and reasons. Do not store
       the raw API response or device options in the report.
    6. On BLOCK, notify Slack and fail the flow.

    ## What you get

    - PASS or BLOCK for the audited Vault cluster.
    - Enabled audit paths, device types, and policy findings.
    - Report URI at outputs.publish_audit.values.report_uri.
    - Failed execution on access errors, bad JSON, or an invalid policy.
      A failed probe does not produce PASS.

    ## Prerequisites and secrets

    - Vault audit API exposed through trusted HTTPS.
    - A scoped monitoring token with read and sudo capabilities on sys/audit.
      This endpoint requires sudo even for listing. Do not give write rights.
    - Node Script and Slack plugins and a configured task runner.
    - VAULT_BASE_URL: trusted HTTPS Vault origin without trailing slash.
    - VAULT_AUDIT_TOKEN: token with read and sudo on sys/audit.
    - SLACK_WEBHOOK_URL: Slack incoming webhook for blocked audits.

    Example Vault policy for the monitor:

        path "sys/audit" {
          capabilities = ["read", "sudo"]
        }

    ## Quick start

    1. Set the secrets. Set required_paths to your approved mounts.
    2. Use minimum_devices=2 to require two enabled audit devices.
    3. Run on a known-good configuration. Confirm PASS and review the report.
    4. In a test Vault instance, disable one required device or configure
       raw logging. Confirm BLOCK and the Slack message.
    5. Enable the daily schedule only after both results are correct.

    ## Limits

    - This checks device configuration, not actual log delivery or retention.
      Two configured devices do not prove independent storage failure domains.
    - The audit API is privileged. Restrict the policy and protect the token.
    - Filtering and raw-logging checks use conservative defaults. Edit the
      gate only after you review an approved enterprise audit policy.
    - Local audit devices can be valid on performance replication nodes.
      Set block_local=false only when your audit design permits them.
    - The report omits target file paths, addresses, and other device options.
    - This uses a point-in-time API response. Check each independent Vault
      cluster separately.
    - More than 100 devices or 1 MiB of response data makes the task fail.

    ## Links

    - https://developer.hashicorp.com/vault/api-docs/system/audit
    - https://developer.hashicorp.com/vault/docs/audit
    - https://kestra.io/plugins/plugin-script-node
    - Created by [vivekyarra](https://github.com/vivekyarra).
  tags:
    - Infrastructure
    - System
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
