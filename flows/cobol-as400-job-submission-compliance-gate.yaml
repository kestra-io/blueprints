id: cobol-as400-job-submission-compliance-gate
namespace: company.team
description: |
  Submit an IBM i (AS/400) batch job on a schedule, inspect the
  returned system messages for any severity at or above a threshold,
  classify the result as HEALTHY, CRITICAL, or UNREACHABLE, log clean
  submissions, and alert Slack the moment a high-severity message is
  returned or the system cannot be reached.

inputs:
  - id: as400_library
    type: STRING
    defaults: "BATCHLIB"
    displayName: "IBM i Library"
    description: "Library containing the program to submit, e.g. BATCHLIB."
  - id: as400_program
    type: STRING
    defaults: "EODPROC"
    displayName: "IBM i Program"
    description: "Name of the program to submit as a batch job, e.g. EODPROC."
  - id: as400_job_queue
    type: STRING
    defaults: "QBATCH"
    displayName: "IBM i Job Queue"
    description: "Job queue to submit the job to, e.g. QBATCH."
  - id: message_severity_threshold
    type: INT
    defaults: 30
    displayName: "Message Severity Threshold"
    description: "IBM i message severity (0-99) at or above which a returned system message is classified CRITICAL. 30 and above is conventionally an escape or error-level message."

triggers:
  - id: as400_compliance_gate_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Submit and check the batch job every 6 hours."
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      as400_library: "BATCHLIB"
      as400_program: "EODPROC"
      as400_job_queue: "QBATCH"
      message_severity_threshold: 30

tasks:
  - id: submit_batch_job
    type: io.kestra.plugin.cobol.SubmitJob
    description: "Submit the COBOL batch job to the IBM i system via SBMJOB and capture any system messages returned during submission."
    host: "{{ secret('IBM_I_HOST') }}"
    user: "{{ secret('IBM_I_USER') }}"
    password: "{{ secret('IBM_I_PASSWORD') }}"
    library: "{{ inputs.as400_library }}"
    program: "{{ inputs.as400_program }}"
    jobQueue: "{{ inputs.as400_job_queue }}"
    allowFailure: true

  - id: classify_submission_health
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when no messages were returned, CRITICAL when at least one returned message has severity at or above message_severity_threshold, otherwise HEALTHY."
    format: "{{ outputs.submit_batch_job.messages is defined ? ((outputs.submit_batch_job.messages | jq('[.[] | select(.severity >= ' ~ inputs.message_severity_threshold ~ ')] | length') | first | default(0)) > 0 ? 'CRITICAL' : 'HEALTHY') : 'UNREACHABLE' }}"

  - id: route_by_submission_health
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation when the submission is clean, page Slack when a high-severity message is returned, or page Slack when the system could not be reached."
    value: "{{ outputs.classify_submission_health.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Job {{ outputs.submit_batch_job.jobName }}/{{ outputs.submit_batch_job.jobNumber }} submitted to {{ inputs.as400_library }}/{{ inputs.as400_program }} with no message at or above severity {{ inputs.message_severity_threshold }}."
      "CRITICAL":
        - id: alert_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "AS/400 sentinel CRITICAL: submitting {{ inputs.as400_library }}/{{ inputs.as400_program }} to {{ inputs.as400_job_queue }} returned at least one system message at or above severity {{ inputs.message_severity_threshold }}. Job {{ outputs.submit_batch_job.jobName }}/{{ outputs.submit_batch_job.jobNumber }}. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "AS/400 sentinel UNREACHABLE: no messages were returned for the submission of {{ inputs.as400_library }}/{{ inputs.as400_program }} (connection failure, authentication failure, or SBMJOB itself failed before returning messages). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed AS/400 job submission compliance check with status: {{ outputs.classify_submission_health.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit status line recorded on every run regardless of branch, for a continuous submission-health trend in the execution history."
    message: "AS/400 compliance audit: library={{ inputs.as400_library }}, program={{ inputs.as400_program }}, jobQueue={{ inputs.as400_job_queue }}, status={{ outputs.classify_submission_health.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the compliance gate flow itself fails, so a broken check never silently stops monitoring batch job submissions."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "AS/400 job submission compliance gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). Submission health for {{ inputs.as400_library }}/{{ inputs.as400_program }} is now unknown; check the task logs and the IBM i system manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_submission_health.value }}"

extend:
  title: "Cobol AS/400 Job Submission Compliance Gate"
  metaTitle: Cobol AS/400 Job Submission Compliance Gate for Kestra
  shortDescription: Submit an IBM i batch job on a schedule, inspect the returned system messages for high-severity entries, and alert Slack when a submission is unhealthy or unreachable.
  metaDescription: Gate IBM i COBOL batch job submissions on returned message severity and alert Slack on critical messages or connection failure.
  description: |
    SBMJOB returning without an exception does not mean the submission was clean; IBM i can still hand back high-severity system messages that a script checking only the exit code would never see. This blueprint submits a batch job on a schedule, inspects every returned message for severity at or above a threshold, and pages Slack the moment one crosses it or the system cannot be reached at all.

    ## How it works

    1. `submit_batch_job` (`io.kestra.plugin.cobol.SubmitJob`) submits `as400_program` from `as400_library` to `as400_job_queue` via SBMJOB and captures the IBM i system messages returned during submission. `allowFailure: true` means a connection or authentication failure still lets the flow continue instead of aborting.
    2. `classify_submission_health` (`io.kestra.plugin.core.debug.Return`) checks whether `outputs.submit_batch_job.messages` is defined; if not, `UNREACHABLE`. Otherwise it runs a `jq` filter counting messages whose `severity` is at or above `message_severity_threshold`, returning `CRITICAL` when that count is above zero, `HEALTHY` otherwise.
    3. `route_by_submission_health` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `HEALTHY` logs a quiet confirmation, `CRITICAL` pages Slack with the job identity, `UNREACHABLE` pages Slack separately, and `defaults` logs the raw outcome.
    4. `log_audit_status` records a status line on every run regardless of branch, so the execution history is a continuous submission-health trend.
    5. The `errors` block pages Slack separately if the flow itself fails outright.
    6. The `as400_compliance_gate_schedule` trigger polls every 6 hours with explicit input overrides, shipped `disabled: true` until you point it at a real IBM i system.

    ## What you get

    - A scheduled, message-level health check for IBM i batch submissions with zero custom JTOpen code.
    - A three-way `status` output (`HEALTHY` / `CRITICAL` / `UNREACHABLE`) you can chart or gate other flows on.
    - A Slack page naming the exact job identity and library/program behind a high-severity message.
    - A separate failure channel for the gate flow itself, plus a standing audit log line per run.

    ## Who it's for

    - Operations teams running legacy COBOL batch workloads on IBM i (AS/400) who want an orchestrator-side check beyond a bare exit code.
    - Platform teams bridging mainframe-adjacent batch scheduling into a modern orchestrator's execution history and alerting.

    ## Why orchestrate this with Kestra

    A cron-triggered SBMJOB from a shell script tells you nothing once the command returns. This flow keeps every submission and every returned message in the execution history, turns the severity check into a typed output other flows can depend on, and gives you a Switch branch to grow into real remediation (resubmitting, paging the on-call operator, opening a ticket) without rewriting the check itself.

    ## Prerequisites

    - Network access to a real IBM i (AS/400) system with a valid user profile; this plugin connects via IBM's JTOpen library over the standard AS/400 host server ports. There is no open-source Docker image that emulates IBM i, so this blueprint cannot be tested against a free local container the way most other blueprints can; test it against a real or licensed virtual IBM i instance.
    - The target library, program, and job queue must already exist on that system.
    - A Slack incoming webhook for the critical and unreachable alerts.

    ### Secrets

    - `IBM_I_HOST`: hostname or IP address of the IBM i system.
    - `IBM_I_USER`: IBM i user profile to authenticate with.
    - `IBM_I_PASSWORD`: password for that user profile.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the critical alert, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_IBM_I_HOST`, `SECRET_IBM_I_USER`, `SECRET_IBM_I_PASSWORD`, and `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-host>" | base64`.

    ## Quick start

    1. Add the `IBM_I_HOST`, `IBM_I_USER`, `IBM_I_PASSWORD`, and `SLACK_WEBHOOK_URL` secrets.
    2. Set `as400_library`, `as400_program`, and `as400_job_queue` to a real, low-risk program you can submit repeatedly.
    3. Run the flow once and confirm `status` reads `HEALTHY`.
    4. Enable `as400_compliance_gate_schedule`.

    ## How to extend

    - Parse specific IBM i message IDs (for example known escape message prefixes) instead of a blanket severity threshold, for a more precise classification.
    - Add a follow-up task that queries job status after submission, instead of only inspecting the messages returned at submission time.
    - Store the job identity (`jobName`/`jobNumber`/`jobUser`) in a KV store to cross-reference against a later completion check.

    ## Links

    - [IBM i (AS/400) system messages overview](https://www.ibm.com/docs/en/i/7.5?topic=messages-message-handling)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
