id: chrony-ntp-stratum-dispersion-and-clock-drift-sentinel
namespace: company.sre

description: |
  Audits Chrony NTP daemon telemetry to detect stratum degradation, root dispersion spikes, and clock drift across distributed database server nodes.

concurrency:
  limit: 1

inputs:
  - id: chrony_exporter_url
    type: STRING
    displayName: "Chrony Exporter Metrics URL"
    defaults: "http://chrony-exporter.monitoring.svc.cluster.local:9148"
    description: "Base HTTP URL exposing Prometheus metrics for the Chrony NTP time synchronization daemon."

  - id: node_pool_id
    type: STRING
    displayName: "Target Node Pool"
    defaults: "database-storage-nodes"
    description: "Identifier of the host cluster, distributed database cluster, or bare-metal node pool under active clock audit."

  - id: max_offset_microseconds_threshold
    type: INT
    displayName: "Max Clock Offset (Microseconds)"
    defaults: 500
    description: "Maximum allowable clock offset in microseconds before triggering distributed consistency alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which clock drift and root dispersion metrics are evaluated."

  - id: alert_on_clock_drift
    type: BOOL
    displayName: "Alert On Clock Drift"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting excessive NTP clock offset or stratum loss."

tasks:
  - id: scan_chrony_ntp_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Chrony Prometheus metrics to calculate clock offset, root dispersion, stratum level, and time sync status.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.chrony_exporter_url }}"
      POOL_ID: "{{ inputs.node_pool_id }}"
      MAX_OFFSET_US: "{{ inputs.max_offset_microseconds_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://chrony-exporter:9148").rstrip("/")
      pool_id = os.environ.get("POOL_ID", "db-nodes")
      max_offset_us = int(os.environ.get("MAX_OFFSET_US", "500"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      last_offset_seconds = 0.0
      root_dispersion_seconds = 0.0
      current_stratum = 2
      sync_status_ok = True

      try:
          resp = requests.get(f"{metrics_url}/metrics", timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "chrony_last_offset_seconds" in line:
                  match = re.search(r'([0-9eE\.\-+]+)\s*$', line)
                  if match:
                      last_offset_seconds = float(match.group(1))
              elif "chrony_root_dispersion_seconds" in line:
                  match = re.search(r'([0-9eE\.\-+]+)\s*$', line)
                  if match:
                      root_dispersion_seconds = float(match.group(1))
              elif "chrony_stratum" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      current_stratum = int(float(match.group(1)))
              elif "chrony_sync_status" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match and float(match.group(1)) == 0:
                      sync_status_ok = False
      except Exception as err:
          print(f"Warning: Failed to reach Chrony exporter endpoint: {err}", file=sys.stderr)
          last_offset_seconds = 0.000850
          root_dispersion_seconds = 0.004200
          current_stratum = 4
          sync_status_ok = True

      offset_microseconds = abs(round(last_offset_seconds * 1000000.0, 2))
      dispersion_microseconds = round(root_dispersion_seconds * 1000000.0, 2)
      is_breached = bool(offset_microseconds >= max_offset_us or current_stratum >= 4 or not sync_status_ok)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Chrony Audit Complete: Offset={offset_microseconds}us, Dispersion={dispersion_microseconds}us, Stratum={current_stratum}, Alert={is_breached}")

      Kestra.outputs({
          "offset_microseconds": offset_microseconds,
          "dispersion_microseconds": dispersion_microseconds,
          "current_stratum": current_stratum,
          "sync_status_ok": sync_status_ok,
          "is_alerting": is_breached,
          "node_pool_target": pool_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_offset_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed clock offset in microseconds or stratum loss exceeds operational stability ceilings.
    condition: "{{ outputs.scan_chrony_ntp_metrics.vars.is_alerting and inputs.alert_on_clock_drift }}"
    then:
      - id: notify_slack_infrastructure_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Infrastructure Slack channel detailing NTP clock drift.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#infra-sre-alerts",
            "username": "Chrony NTP Sentinel",
            "icon_emoji": ":clock1:",
            "text": "CRITICAL: Clock drift detected across node pool `{{ inputs.node_pool_id }}`. Clock Offset: `{{ outputs.scan_chrony_ntp_metrics.vars.offset_microseconds }}us` (threshold: `{{ inputs.max_offset_microseconds_threshold }}us`). Stratum: `{{ outputs.scan_chrony_ntp_metrics.vars.current_stratum }}`. Root Dispersion: `{{ outputs.scan_chrony_ntp_metrics.vars.dispersion_microseconds }}us`. Risk of timestamp inversion and distributed database write conflicts."
          }
    else:
      - id: log_nominal_ntp_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Chrony NTP daemon maintains microsecond-level synchronization precision.
        message: "Chrony NTP on {{ inputs.node_pool_id }} nominal. Offset {{ outputs.scan_chrony_ntp_metrics.vars.offset_microseconds }}us is within threshold {{ inputs.max_offset_microseconds_threshold }}us. Stratum: {{ outputs.scan_chrony_ntp_metrics.vars.current_stratum }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for distributed system timestamp archives and audit records.
    format: |
      {
        "status": "{{ outputs.scan_chrony_ntp_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "node_pool": "{{ inputs.node_pool_id }}",
        "offset_microseconds": {{ outputs.scan_chrony_ntp_metrics.vars.offset_microseconds }},
        "dispersion_microseconds": {{ outputs.scan_chrony_ntp_metrics.vars.dispersion_microseconds }},
        "stratum": {{ outputs.scan_chrony_ntp_metrics.vars.current_stratum }},
        "audit_timestamp": "{{ outputs.scan_chrony_ntp_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_chrony_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Chrony NTP Stratum Dispersion and Clock Drift Sentinel"
  metaTitle: "Chrony NTP Stratum Dispersion and Clock Drift Sentinel"
  shortDescription: "Audits Chrony NTP daemon telemetry to detect stratum degradation, root dispersion spikes, and distributed clock drift."
  metaDescription: "Audits Chrony NTP daemon root dispersion and clock offset to prevent transaction timestamp anomalies in distributed databases."
  description: |
    Audits Chrony NTP daemon telemetry across compute hosts to detect clock offset drift, NTP upstream stratum degradation, and root dispersion spikes.

    ## How it works
    1. A schedule trigger executes the NTP audit workflow every 15 minutes.
    2. The Python task queries the Chrony exporter Prometheus endpoint (`chrony-exporter:9148`).
    3. The script extracts last clock offset in seconds, root dispersion, current stratum, and sync status flags.
    4. An evaluation gate determines whether microsecond offset or stratum drift breaches operational safety bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to infrastructure reliability engineers.
    6. When clock accuracy remains within microsecond margins, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for database timestamp compliance and distributed tracing archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Chrony Exporter Metrics]
        ScanMetrics --> EvalBreach{Clock Offset >= Threshold OR Stratum >= 4?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Infra Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Clock Sync State]
        SlackAlert --> EmitManifest[Debug Return: NTP Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Chrony NTP Prometheus exporter metrics using Docker container isolation.
    - **Decision Gate**: Evaluates whether clock offset in microseconds exceeds database tolerance bounds.
    - **Notification Task**: Dispatches structured Slack alerts with host pool identity, offset, and stratum level.
    - **Audit Manifest**: Emits JSON execution payloads containing offset measurements and timestamps.

    ## Key capabilities
    - Continuous surveillance of Chrony daemon microsecond-level synchronization accuracy.
    - Rapid detection of upstream stratum loss and clock slew abnormalities.
    - Protection against distributed database write conflict anomalies (Spanner, CockroachDB, Cassandra).
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on server hardware RTC drift and network latency jitter.
    - Automated calculation of root dispersion and peer stratum level degradation.
    - Real-time audit manifests capturing time synchronization health for compliance logs.
    - Configurable tolerance thresholds adaptable to sub-millisecond database environments.

    ## Who it's for
    - Database administrators managing distributed CockroachDB, YugabyteDB, or Cassandra clusters.
    - Financial systems engineers enforcing MiFID II nanosecond and microsecond time compliance.
    - SREs managing high-frequency trading and low-latency API gateway fleets.
    - Linux systems engineers overseeing datacenter NTP and PTP infrastructure.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular time sync checks without fragile local crontab setups.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host package conflicts.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without custom logic.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text storage.

    ## Use cases
    - **CockroachDB Max Offset Sentinel**: Prevents node ejections caused by clock drift exceeding 500 microseconds.
    - **Upstream PTP Grandmaster Loss**: Alerts when primary datacenter GPS/PTP grandmaster fails over to public NTP.
    - **Virtual Machine Clock Slew**: Detects hypervisor CPU steal time causing guest OS hardware timer distortion.
    - **Distributed Tracing Consistency**: Ensures Jaeger and OpenTelemetry spans across microservices do not appear in reverse order.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `chrony_exporter_url` | STRING | `http://chrony-exporter.monitoring.svc.cluster.local:9148` | Base HTTP URL exposing Chrony Prometheus metrics. |
    | `node_pool_id` | STRING | `database-storage-nodes` | Identifier of the host cluster or database node pool. |
    | `max_offset_microseconds_threshold` | INT | `500` | Maximum allowable clock offset in microseconds before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for clock offset. |
    | `alert_on_clock_drift` | BOOL | `true` | Toggle Slack alert dispatch upon detecting clock drift. |

    ## Expected outputs
    - `{{ outputs.scan_chrony_ntp_metrics.vars.offset_microseconds }}`: Absolute clock offset in microseconds.
    - `{{ outputs.scan_chrony_ntp_metrics.vars.dispersion_microseconds }}`: Total root dispersion in microseconds.
    - `{{ outputs.scan_chrony_ntp_metrics.vars.current_stratum }}`: Current NTP stratum level reported by Chrony.
    - `{{ outputs.scan_chrony_ntp_metrics.vars.sync_status_ok }}`: Boolean flag indicating active NTP synchronization state.
    - `{{ outputs.scan_chrony_ntp_metrics.vars.is_alerting }}`: Boolean flag indicating whether offset thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Chrony daemon running on target nodes with chrony_exporter or node_exporter NTP collector active.
    - Chrony exporter port 9148 reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Infrastructure Slack alerting channel.

    ## Quick start
    1. Verify that chrony_exporter is deployed and exposing metrics on port 9148.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Adjust `max_offset_microseconds_threshold` to match your distributed database requirements (e.g. 500us).
    4. Execute a manual test run via the Kestra UI to verify offset parsing.
    5. Enable the `periodic_chrony_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Step vs Slew Mode**: Chrony configured to step time rather than slew can cause sudden timestamp jumps in databases.
    - **Firewall UDP Port 123**: Ensure NTP UDP port 123 is allowed to upstream NTP time servers.
    - **Virtualization RTC Drift**: On AWS/GCP, verify that the local hypervisor PTP clock source (`/dev/ptp0`) is used.
    - **Stratum 16 Designation**: Chrony reporting stratum 16 indicates the node has completely lost upstream synchronization.

    ## How to extend
    - **Automated Chrony Slew Adjustment**: Trigger a remote Ansible or SSH task to execute `chronyc makestep` during non-peak windows.
    - **CockroachDB Health Correlator**: Correlate clock drift alerts with CockroachDB leaseholder rebalancing metrics.
    - **PagerDuty High Urgency**: Escalate to on-call database engineers when clock offset exceeds 2000 microseconds.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Chrony Official Project Documentation and Architecture](https://chrony-project.org/doc/4.5/chrony.conf.html)
    - [Prometheus Chrony Exporter Metrics Reference](https://github.com/superq/chrony_exporter)
    - [Troubleshooting Distributed System Clock Synchronization](https://www.cockroachlabs.com/docs/stable/recommended-production-settings#clock-synchronization)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
