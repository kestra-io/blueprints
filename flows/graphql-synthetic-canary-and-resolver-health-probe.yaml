id: graphql-synthetic-canary-and-resolver-health-probe
namespace: company.monitoring

inputs:
  - id: graphql_endpoint_url
    type: STRING
    displayName: GraphQL Endpoint URL
    defaults: "https://spacex-production.up.railway.app/"
    description: Production or staging GraphQL HTTP endpoint to probe (e.g. 'https://api.mycompany.com/graphql').

  - id: custom_canary_query
    type: STRING
    displayName: Synthetic Canary Query
    defaults: "query SyntheticCanary { __typename }"
    description: Minimal typed GraphQL query executed to validate parser, schema validation, and resolver execution path.

  - id: expected_typename
    type: STRING
    displayName: Expected Typename
    defaults: "Query"
    description: Expected root schema type returned by the introspection field __typename (typically 'Query').

  - id: fail_on_unhealthy
    type: BOOL
    displayName: Fail on Unhealthy Canary
    defaults: true
    description: Whether to fail execution when canary checks fail to trigger downstream incident alerts and status page monitors.

triggers:
  - id: periodic_canary_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: High-frequency 5-minute synthetic health sweep to catch resolver outages immediately. Shipped disabled by default.
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: execute_canary_probe
    type: io.kestra.plugin.graphql.Request
    description: Fire synthetic GraphQL probe query against the target endpoint with relaxed error tolerance to inspect error payloads.
    uri: "{{ inputs.graphql_endpoint_url }}"
    headers:
      Authorization: "Bearer {{ secret('GRAPHQL_API_TOKEN') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-GraphQL-Canary-Probe/1.0"
    failOnGraphQLErrors: false
    query: "{{ inputs.custom_canary_query }}"
    options:
      allowFailed: true

  - id: evaluate_canary_health
    type: io.kestra.plugin.core.flow.If
    description: Validate whether HTTP response succeeded, returned expected root typename, and contains no uncaught resolver errors.
    condition: "{{ outputs.execute_canary_probe.code == 200 and outputs.execute_canary_probe.body is defined and outputs.execute_canary_probe.body.__typename == inputs.expected_typename and (outputs.execute_canary_probe.error is not defined or outputs.execute_canary_probe.error == null) }}"
    then:
      - id: log_canary_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log verified operational state when probe succeeds and returns expected schema typename.
        message: "HEALTHY: GraphQL canary query executed successfully on {{ inputs.graphql_endpoint_url }}. Root __typename returned '{{ inputs.expected_typename }}' with zero resolver errors."
    else:
      - id: alert_canary_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority Slack outage alert with HTTP status code, returned payload, and error diagnostics.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *GRAPHQL SYNTHETIC CANARY OUTAGE ALERT* 🚨\n\n*Endpoint:* `{{ inputs.graphql_endpoint_url }}`\n*HTTP Status:* {{ outputs.execute_canary_probe.code }}\n*Returned Root Typename:* `{{ outputs.execute_canary_probe.body is defined and outputs.execute_canary_probe.body.__typename is defined ? outputs.execute_canary_probe.body.__typename : 'UNDEFINED' }}`\n*GraphQL Errors:* `{{ outputs.execute_canary_probe.error is defined and outputs.execute_canary_probe.error != null ? outputs.execute_canary_probe.error : 'Resolver or payload mismatch' }}`\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* Check GraphQL gateway pod logs, downstream microservice resolvers, and database connection pools immediately."
          }

      - id: check_fail_policy
        type: io.kestra.plugin.core.flow.If
        description: Terminate pipeline with failure when fail_on_unhealthy is enabled.
        condition: "{{ inputs.fail_on_unhealthy }}"
        then:
          - id: fail_canary_execution
            type: io.kestra.plugin.core.execution.Fail
            description: Fail execution to trip Kestra dashboard monitors and alert external status page integrations.

  - id: log_probe_metrics
    type: io.kestra.plugin.core.log.Log
    description: Record probe summary and HTTP status code.
    message: "GraphQL canary probe finished. Endpoint: {{ inputs.graphql_endpoint_url }}, HTTP Status: {{ outputs.execute_canary_probe.code }}."

errors:
  - id: alert_on_probe_exception
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Site Reliability Engineering if DNS resolution fails or connection times out completely.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *GraphQL Canary Probe Failure*: Execution `{{ execution.id }}` failed to connect to `{{ inputs.graphql_endpoint_url }}`. Check edge CDN routing and network connectivity."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.execute_canary_probe.code == 200 and outputs.execute_canary_probe.body is defined and outputs.execute_canary_probe.body.__typename == inputs.expected_typename and (outputs.execute_canary_probe.error is not defined or outputs.execute_canary_probe.error == null) ? 'HEALTHY' : 'UNHEALTHY' }}"
  - id: http_status_code
    type: INT
    value: "{{ outputs.execute_canary_probe.code }}"
  - id: root_typename
    type: STRING
    value: "{{ outputs.execute_canary_probe.body is defined and outputs.execute_canary_probe.body.__typename is defined ? outputs.execute_canary_probe.body.__typename : 'NONE' }}"

extend:
  title: GraphQL synthetic health and resolver canary probe
  metaTitle: GraphQL Synthetic Canary & Health Probe | Kestra
  shortDescription: Automated synthetic canary that queries GraphQL endpoints every 5 minutes to validate resolver availability and alert on silent 200 OK failures.
  metaDescription: Run synthetic GraphQL health canary probes every 5 minutes, validate root typename responses, and dispatch urgent Slack alerts on silent resolver errors.
  description: |
    Catch silent GraphQL API failures and broken resolver dependencies before users do. Unlike REST endpoints that return explicit 5xx HTTP status codes on server faults, GraphQL gateways frequently return HTTP 200 OK while embedding resolver exceptions, database timeouts, and schema validation failures inside the JSON `errors` array. Standard HTTP uptime pings mistake these responses for healthy traffic. This blueprint runs a high-frequency synthetic canary probe every 5 minutes using `io.kestra.plugin.graphql.Request`, asserts that the root `__typename` resolves cleanly, checks for null error arrays, and trips an automated Slack incident alert and pipeline failure when degradation is detected.

    ## How it works
    1. A `Schedule` trigger initiates a synthetic health probe every 5 minutes (shipped disabled by default).
    2. Task `execute_canary_probe` issues a minimal typed query (`query SyntheticCanary { __typename }`) to the GraphQL endpoint (`graphql_endpoint_url`) with `failOnGraphQLErrors: false` and `allowFailed: true` so error payloads can be inspected.
    3. Task `evaluate_canary_health` (`io.kestra.plugin.core.flow.If`) evaluates three criteria: HTTP 200 status code, verified `__typename` matching `expected_typename` ('Query'), and absence of any GraphQL error payload:
       - If healthy: Task `log_canary_healthy` logs clean operational status.
       - If degraded: Task `alert_canary_failure` dispatches an urgent Slack alert containing the HTTP status, returned typename, and error message. If `inputs.fail_on_unhealthy` is enabled, task `fail_canary_execution` terminates the flow with an error.
    4. Task `log_probe_metrics` records audit metrics.
    5. Top-level `errors` handler alerts SRE teams if DNS resolution fails or the gateway drops connections entirely.

    ## What you get
    - Continuous round-trip synthetic health monitoring tailored specifically for GraphQL semantics.
    - Interception of "silent 200 OK" errors where resolvers fail inside successful HTTP responses.
    - Immediate Slack alerting with diagnostic details when schemas fail to parse or backends disconnect.
    - Zero external monitoring agent fees by orchestrating probes directly within Kestra.

    ## Who it's for
    - Site Reliability Engineers (SRE) and Platform teams supporting GraphQL gateways (Apollo Router, Envoy, Yoga, Hasura).
    - Backend engineers maintaining federated subgraphs and microservice resolvers.
    - DevOps engineers configuring synthetic availability alerts and public status page indicators.

    ## Why orchestrate this with Kestra
    Standard synthetic monitoring SaaS tools often lack native understanding of GraphQL response payloads or charge high recurring per-check fees. Kestra provides native GraphQL execution via `io.kestra.plugin.graphql.Request`, secure secret management for API bearer tokens, declarative flow-control logic, and automated multi-channel incident dispatch in plain YAML.

    ## Prerequisites
    - An accessible GraphQL endpoint URL (production, staging, or internal VPC gateway).
    - An API bearer token or secret header if the endpoint requires authentication.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `GRAPHQL_API_TOKEN`: Bearer token passed in the `Authorization` header (can be a dummy string if public).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to transmit outage notifications.

    ## Quick start
    1. Store your endpoint access token and Slack webhook in Kestra Secrets (`GRAPHQL_API_TOKEN` and `SLACK_WEBHOOK_URL`).
    2. Configure `graphql_endpoint_url` with your target GraphQL server URL.
    3. Run a manual execution from the Kestra UI to verify that the `{ __typename }` query executes cleanly.
    4. Enable the `periodic_canary_schedule` trigger to establish 5-minute automated canary sweeps.

    ## How to extend
    - Extend `custom_canary_query` to query a critical business entity (e.g. `viewer { id email }` or `healthCheck { status }`) for deeper synthetic verification.
    - Integrate with PagerDuty or Opsgenie using Kestra notification plugins to page on-call engineers when consecutive canary runs fail.
    - Push probe latency metrics to Prometheus or Datadog to chart API round-trip response times across deployment windows.

    ## Links
    - [GraphQL Specification: Response Format & Errors](https://spec.graphql.org/draft/#sec-Response-Format)
    - [Kestra GraphQL Plugin Documentation](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  verified: false
  demo: false
