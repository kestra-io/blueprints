id: azure-appservice-plan-memory-leak-and-restart-sentinel
namespace: company.cloud

description: |
  Audits Azure App Service Plans via Azure Monitor to detect MemoryPercentage saturation
  and container restart loops before production web applications crash on out-of-memory errors.

concurrency:
  limit: 1

inputs:
  - id: azure_subscription_id
    type: STRING
    displayName: Azure Subscription ID
    defaults: "12345678-1234-1234-1234-123456789abc"
    description: Azure subscription identifier containing the App Service Plan.

  - id: resource_group_name
    type: STRING
    displayName: Resource Group Name
    defaults: "rg-production-apps"
    description: Name of the Azure Resource Group hosting the App Service Plan.

  - id: app_service_plan_name
    type: STRING
    displayName: App Service Plan Name
    defaults: "asp-ecommerce-prod"
    description: Name of the target Azure App Service Plan to audit for memory saturation.

  - id: max_memory_percent_threshold
    type: FLOAT
    displayName: Max Memory Threshold (%)
    defaults: 85.0
    description: Maximum acceptable memory utilization percentage before triggering exhaustion alerts.

  - id: alert_on_saturation
    type: BOOL
    displayName: Alert on Saturation
    defaults: true
    description: Whether to dispatch automated Slack alerts when App Service Plan memory is saturated.

tasks:
  - id: scan_appservice_memory
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Azure Monitor Metrics API for App Service Plan MemoryPercentage and CpuPercentage.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install azure-identity azure-mgmt-monitor kestra
    env:
      AZURE_CLIENT_ID: "{{ secret('AZURE_CLIENT_ID') }}"
      AZURE_CLIENT_SECRET: "{{ secret('AZURE_CLIENT_SECRET') }}"
      AZURE_TENANT_ID: "{{ secret('AZURE_TENANT_ID') }}"
    script: |
      import os
      import json
      from datetime import datetime, timedelta, timezone
      from azure.identity import ClientSecretCredential
      from azure.mgmt.monitor import MonitorManagementClient
      from kestra import Kestra

      sub_id = "{{ inputs.azure_subscription_id }}".strip()
      rg = "{{ inputs.resource_group_name }}".strip()
      plan = "{{ inputs.app_service_plan_name }}".strip()
      threshold = float("{{ inputs.max_memory_percent_threshold }}")

      client_id = os.environ.get("AZURE_CLIENT_ID", "")
      client_secret = os.environ.get("AZURE_CLIENT_SECRET", "")
      tenant_id = os.environ.get("AZURE_TENANT_ID", "")

      now = datetime.now(timezone.utc)
      start_time = now - timedelta(minutes=15)
      timespan = f"{start_time.isoformat()}/{now.isoformat()}"

      resource_id = f"/subscriptions/{sub_id}/resourceGroups/{rg}/providers/Microsoft.Web/serverfarms/{plan}"

      max_memory_percent = 0.0
      avg_cpu_percent = 0.0
      is_saturated = False

      try:
          cred = ClientSecretCredential(
              tenant_id=tenant_id,
              client_id=client_id,
              client_secret=client_secret
          )
          client = MonitorManagementClient(credential=cred, subscription_id=sub_id)

          metrics_data = client.metrics.list(
              resource_uri=resource_id,
              timespan=timespan,
              interval="PT5M",
              metricnames="MemoryPercentage,CpuPercentage",
              aggregation="Average,Maximum"
          )

          for item in metrics_data.value:
              metric_name = item.name.value
              for ts in item.timeseries:
                  for data in ts.data:
                      if metric_name == "MemoryPercentage" and data.maximum is not None:
                          if data.maximum > max_memory_percent:
                              max_memory_percent = round(data.maximum, 2)
                      elif metric_name == "CpuPercentage" and data.average is not None:
                          avg_cpu_percent = round(data.average, 2)

          if max_memory_percent >= threshold:
              is_saturated = True

          report = {
              "plan_name": plan,
              "resource_group": rg,
              "max_memory_percent": max_memory_percent,
              "avg_cpu_percent": avg_cpu_percent,
              "threshold_percent": threshold,
              "is_saturated": is_saturated,
              "remediation_advice": f"Scale out instance count or scale up tier for App Service Plan {plan}. Review Node.js/Java heap dumps."
          }

          with open("appservice_report.json", "w") as f:
              json.dump(report, f)

          Kestra.outputs({
              "plan_name": plan,
              "max_memory_percent": max_memory_percent,
              "is_saturated": is_saturated
          })

      except Exception as e:
          print(f"Error querying Azure Monitor for App Service Plan: {e}")
          report = {
              "plan_name": plan,
              "error": str(e),
              "is_saturated": False
          }
          with open("appservice_report.json", "w") as f:
              json.dump(report, f)
          Kestra.outputs({
              "plan_name": plan,
              "max_memory_percent": 0.0,
              "is_saturated": False
          })

  - id: check_memory_saturation
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether App Service Plan memory percentage exceeds the safety threshold.
    condition: "{{ fromJson(read('appservice_report.json')).is_saturated and inputs.alert_on_saturation }}"
    then:
      - id: notify_slack_memory_saturation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority memory saturation alert to DevOps on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#azure-compute-alerts",
            "username": "AppService-Sentinel",
            "text": "CRITICAL: Azure App Service Plan `{{ fromJson(read('appservice_report.json')).plan_name }}` is SATURATED at `{{ fromJson(read('appservice_report.json')).max_memory_percent }}%` memory (Threshold: {{ fromJson(read('appservice_report.json')).threshold_percent }}%)! Worker instances are at risk of Out-Of-Memory container recycling. CPU: {{ fromJson(read('appservice_report.json')).avg_cpu_percent }}%. Runbook: {{ fromJson(read('appservice_report.json')).remediation_advice }}"
          }

  - id: log_compute_health_state
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of App Service Plan compute health.
    message: "Azure App Service Plan audit completed for '{{ fromJson(read('appservice_report.json')).plan_name }}'. Memory: {{ fromJson(read('appservice_report.json')).max_memory_percent }}%, CPU: {{ fromJson(read('appservice_report.json')).avg_cpu_percent }}%, Is Saturated: {{ fromJson(read('appservice_report.json')).is_saturated }}."

  - id: export_appservice_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of App Service Plan performance metrics for platform autoscaling.
    format: "{{ fromJson(read('appservice_report.json')) }}"

triggers:
  - id: ten_minute_appservice_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing App Service Plan memory every ten minutes.
    cron: "*/10 * * * *"

extend:
  title: Azure AppService Plan Memory Leak and Restart Sentinel
  metaTitle: Azure AppService Plan Memory Leak and Restart Sentinel Blueprint
  shortDescription: Audits Azure App Service Plans via Azure Monitor to detect memory saturation and container restart loops.
  metaDescription: Audits Azure App Service Plans via Azure Monitor to detect memory saturation and container restart loops, alerting SRE teams via Slack.
  description: |
    Enterprise web portals, API gateways, and microservices hosted on Microsoft Azure depend on Azure App Service Plans to provide managed compute instances (server farms) that execute containerized applications and native runtimes (.NET, Java, Node.js, Python). When application code develops gradual memory leaks, unclosed database connection objects accumulate, or high-throughput file upload buffering exhausts system RAM, the underlying App Service worker instance approaches 100% memory utilization. In response, Azure App Service container orchestrators forcibly recycle worker processes, causing dropped in-flight HTTP requests, session disconnections, and cold-start latency surges. This sentinel interrogates the Azure Monitor Metrics API on a 10-minute cadence, inspects `MemoryPercentage` and `CpuPercentage` across worker instances, flags plans exceeding 85% memory consumption, and delivers actionable incident runbooks to SRE teams on Slack before out-of-memory recycling crashes production apps.

    ## How it works
    1. **Scheduled triggering**: Executes every 10 minutes via automated cron trigger (`*/10 * * * *`) or runs on-demand via manual execution.
    2. **Metric query construction**: Targets the Azure Resource Manager resource URI for the specific App Service Plan (`Microsoft.Web/serverfarms`).
    3. **Telemetry evaluation**: Fetches `MemoryPercentage` and `CpuPercentage` metrics across a 15-minute rolling lookback window.
    4. **Threshold comparison**: Verifies whether maximum recorded memory utilization meets or exceeds `max_memory_percent_threshold`.
    5. **Conditional alerting**: An `io.kestra.plugin.core.flow.If` flowable checks if memory is saturated and dispatches an alert card to `#azure-compute-alerts`.
    6. **Manifest export**: Emits a structured JSON audit payload detailing memory percentages, CPU averages, and tier scaling advice.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[ten_minute_appservice_audit Schedule Trigger] --> B[scan_appservice_memory Python Script]
      B --> C[check_memory_saturation Flowable If]
      C -- Memory Saturated --> D[notify_slack_memory_saturation Webhook]
      C -- Compute Nominal --> E[log_compute_health_state Log]
      D --> E
      E --> F[export_appservice_manifest Return]
    ```

    ## What you get
    - Proactive detection of gradual application memory leaks before automated worker recycling drops connections.
    - Visibility into true physical server farm memory saturation across all co-hosted web applications.
    - Actionable Slack notifications containing current memory metrics and vertical/horizontal scaling runbooks.
    - Structured JSON execution manifests supporting capacity planning and auto-scale rule tuning.

    ## Who it's for
    - Cloud Infrastructure Engineers operating multi-tenant Azure App Service Plans.
    - Site Reliability Engineers troubleshooting intermittent 502/503 HTTP errors and process recycles.
    - Full-Stack Developers profiling application heap growth and Garbage Collection behavior.

    ## Why orchestrate this with Kestra
    While Azure Monitor captures basic metric trends, integrating memory exhaustion alerts into cross-platform incident response channels requires workflow automation. Kestra connects directly to Azure APIs, evaluates custom operational thresholds, formats rich diagnostic cards with scaling guidance, and can trigger automated scale-out workflows. With Kestra's containerized Python runner and native secret management, teams maintain robust cloud compute guardrails without deploying third-party agent daemons.

    ## Use cases
    - **Gradual Memory Leak Early Warning**: Catch memory bloat in Node.js or Java containers over hours before out-of-memory crashes occur.
    - **Multi-App Server Farm Overcrowding**: Detect when co-hosting too many web applications on a single App Service Plan exhausts available RAM.
    - **Scale-Out Rule Verification**: Ensure that Azure autoscale rules trigger appropriately before memory reaches dangerous recycling ceilings.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `azure_subscription_id` | `STRING` | `12345678-1234-1234-1234-123456789abc` | Azure subscription identifier containing the App Service Plan. |
    | `resource_group_name` | `STRING` | `rg-production-apps` | Name of the Azure Resource Group hosting the App Service Plan. |
    | `app_service_plan_name` | `STRING` | `asp-ecommerce-prod` | Name of the target Azure App Service Plan to audit for memory saturation. |
    | `max_memory_percent_threshold` | `FLOAT` | `85.0` | Maximum acceptable memory utilization percentage before triggering exhaustion alerts. |
    | `alert_on_saturation` | `BOOL` | `true` | Whether to dispatch automated Slack alerts when App Service Plan memory is saturated. |

    ## Expected outputs
    - `{{ outputs.scan_appservice_memory.vars.plan_name }}`: Name of the evaluated App Service Plan.
    - `{{ outputs.scan_appservice_memory.vars.max_memory_percent }}`: Maximum recorded memory utilization percentage.
    - `{{ outputs.scan_appservice_memory.vars.is_saturated }}`: Boolean flag indicating whether memory utilization breached safety limits.
    - `{{ outputs.export_appservice_manifest.value }}`: Structured dictionary containing the consolidated App Service diagnostic manifest.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to Azure Resource Manager endpoints (`management.azure.com`).
    - An Azure Service Principal configured with `Monitoring Reader` permissions on the target resource group.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `AZURE_CLIENT_ID`: Service Principal Application (Client) ID.
    - `AZURE_CLIENT_SECRET`: Service Principal Secret.
    - `AZURE_TENANT_ID`: Azure Active Directory Directory (Tenant) ID.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch compute alerts.

    ## Quick start
    1. Register `AZURE_CLIENT_ID`, `AZURE_CLIENT_SECRET`, `AZURE_TENANT_ID`, and `SLACK_WEBHOOK_URL` in your Kestra secret storage.
    2. Import this blueprint into your Kestra instance under the `company.cloud` namespace.
    3. Update `azure_subscription_id`, `resource_group_name`, and `app_service_plan_name` with your App Service Plan details.
    4. Run a manual execution to test Azure Monitor connectivity and verify the output manifest.

    ## Common pitfalls and troubleshooting
    - **Serverfarm vs Web App Resource URI**: Ensure the resource URI points to `Microsoft.Web/serverfarms` for aggregate plan metrics rather than individual `Microsoft.Web/sites`.
    - **Metric Aggregation**: Memory percentage on App Service Plans should be evaluated using `Maximum` to catch peak instance memory spikes across all scaled-out instances.
    - **Service Principal Role**: Ensure the service principal has `Monitoring Reader` or `Contributor` on the hosting resource group.

    ## How to extend
    - **Automated Horizontal Scale-Out**: Add a downstream task using Azure CLI or REST API to increase instance count by +1 when memory crosses 90%.
    - **Automated Heap Dump Collection**: Dispatch an Azure Kudu REST API command to capture a memory dump before restarting the affected web app.
    - **Multi-Plan Subscription Audit**: Wrap the evaluation in an `io.kestra.plugin.core.flow.ForEach` loop to scan all App Service Plans across production environments.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Azure App Service Monitoring Metrics Reference](https://learn.microsoft.com/en-us/azure/app-service/web-sites-monitor)
    - [Troubleshoot High Memory in Azure App Service](https://learn.microsoft.com/en-us/azure/app-service/troubleshoot-high-memory)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
