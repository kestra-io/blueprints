    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [WireGuard Official Protocol Technical Whitepaper](https://www.wireguard.com/papers/wireguard.pdf)
    - [WireGuard Linux Interface Configuration Reference](https://git.zx2c4.com/wireguard-tools/about/src/man/wg.8)
    - [Prometheus WireGuard Exporter Documentation](https://github.com/MindFlavor/prometheus_wireguard_exporter)
