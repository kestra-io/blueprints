id: aws-cost-explorer-daily-unblended-surge-sentinel
namespace: company.finops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region for API client calls.
  - id: cost_surge_percentage_threshold
    type: FLOAT
    defaults: 20.0
    description: Percentage increase in daily unblended cost compared to previous day to trigger an alert.
  - id: min_cost_usd_threshold
    type: FLOAT
    defaults: 50.0
    description: Minimum daily spend in USD required before evaluating percentage surges.

tasks:
  - id: query_daily_unblended_cost
    type: io.kestra.plugin.aws.cli.AwsCLI
    runner: PROCESS
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        START_DATE=$(date -u -v-3d +%Y-%m-%d 2>/dev/null || date -u -d "3 days ago" +%Y-%m-%d)
        END_DATE=$(date -u +%Y-%m-%d)
        aws ce get-cost-and-usage           --time-period Start=${START_DATE},End=${END_DATE}           --granularity DAILY           --metrics UnblendedCost           --output json > ce_cost.json
        python3 -c "
        import json, sys
        with open('ce_cost.json') as f:
            data = json.load(f)
        results = data.get('ResultsByTime', [])
        if len(results) < 2:
            surge_pct = 0.0
            latest_cost = float(results[-1]['Total']['UnblendedCost']['Amount']) if results else 0.0
            prev_cost = 0.0
        else:
            prev_cost = float(results[-2]['Total']['UnblendedCost']['Amount'])
            latest_cost = float(results[-1]['Total']['UnblendedCost']['Amount'])
            surge_pct = ((latest_cost - prev_cost) / prev_cost * 100.0) if prev_cost > 0 else 0.0
        surge_detected = (surge_pct >= {{ inputs.cost_surge_percentage_threshold }}) and (latest_cost >= {{ inputs.min_cost_usd_threshold }})
        output = {
            'latest_cost_usd': round(latest_cost, 2),
            'prev_cost_usd': round(prev_cost, 2),
            'surge_percentage': round(surge_pct, 2),
            'surge_detected': surge_detected
        }
        with open('cost_analysis.json', 'w') as out:
            json.dump(output, out)
        print('Cost evaluation:', output)
        "
    outputFiles:
      - cost_analysis.json

  - id: evaluate_cost_surge
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.query_daily_unblended_cost.outputFiles['cost_analysis.json'])).surge_detected }}"
    then:
      - id: alert_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":money_with_wings: *AWS Cost Spike Alert*: Daily unblended cost surged by {{ json(read(outputs.query_daily_unblended_cost.outputFiles['cost_analysis.json'])).surge_percentage }}% (from ${{ json(read(outputs.query_daily_unblended_cost.outputFiles['cost_analysis.json'])).prev_cost_usd }} to ${{ json(read(outputs.query_daily_unblended_cost.outputFiles['cost_analysis.json'])).latest_cost_usd }} USD)."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Cost Sentinel Execution Failure*: Unable to query AWS Cost Explorer API."
      }

triggers:
  - id: daily_finops_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    disabled: true

extend:
  title: AWS Cost Explorer Daily Unblended Spend Surge Sentinel
  shortDescription: Audits daily AWS unblended cost metrics and alerts on anomalous spending surges.
  description: |
    ## How it works
    This sentinel queries AWS Cost Explorer daily unblended metrics across the most recent billing periods using `AwsCLI`. It calculates day-over-day variance, compares against user-defined spend floors and percentage thresholds, and dispatches real-time alerts if runaway cloud spending is detected.

    ## What you get
    - Continuous programmatic tracking of AWS cloud spend without third-party SaaS agents.
    - Automated detection of unexpected cloud resource provisioning or unmonitored autoscaling events.
    - High-fidelity Slack notifications providing exact dollar figures and surge percentages.

    ## Who it's for
    - FinOps engineers and cloud architects tracking daily infrastructure budget adherence.
    - Engineering managers seeking immediate visibility into unexpected AWS cost increases.

    ## Why orchestrate this with Kestra
    Kestra runs scheduled operational sentinels reliably without requiring persistent microservices. By chaining AWS CLI commands directly to conditional branching and notification plugins, teams maintain automated cost governance directly in code.

    ## Prerequisites
    - An AWS IAM user or role with `ce:GetCostAndUsage` permissions.
    - Kestra secrets configured for `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK`.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Configure the required secrets (`AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `SLACK_WEBHOOK`).
    3. Run the flow manually to evaluate baseline spend, then enable the daily trigger schedule.

    ## How to extend
    - Break down cost metrics by service using `--group-by Type=DIMENSION,Key=SERVICE`.
    - Automatically create Jira tickets or ServiceNow incidents for budget breach tracking.
    - Integrate AWS Budgets or tag-based allocation queries for tenant cost attribution.

    ## Links
    - [Kestra AWS Plugin Documentation](https://kestra.io/plugins/plugin-aws)
    - [AWS Cost Explorer API Reference](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_GetCostAndUsage.html)
  tags:
    - Cloud
    - Business
  subTags:
    - FinOps & Cost Management
  ee: false
  demo: false
