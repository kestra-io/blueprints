id: redshift-cluster-concurrency-scaling-audit
namespace: company.finops

description: Audits Amazon Redshift cluster concurrency scaling usage and query wait times, alerting FinOps teams to excessive scaling hours and unbudgeted cloud expenditure.

concurrency:
  limit: 1

inputs:
  - id: redshift_jdbc_url
    type: STRING
    defaults: "jdbc:redshift://redshift-cluster-1.internal:5439/analytics"
    description: JDBC connection URL for the Amazon Redshift data warehouse cluster.

  - id: max_daily_concurrency_scaling_minutes
    type: FLOAT
    defaults: 60.0
    description: Daily threshold for total concurrency scaling usage in minutes before triggering an alert.

  - id: max_queue_wait_seconds_warning
    type: INT
    defaults: 300
    description: Maximum query queue wait duration in seconds before flagging workload queue starvation.

  - id: slack_channel
    type: STRING
    defaults: "#finops-redshift-alerts"
    description: Slack channel destination for Redshift cloud cost notifications.

tasks:
  - id: audit_concurrency_scaling
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install psycopg2-binary
    env:
      JDBC_URL: "{{ inputs.redshift_jdbc_url }}"
      REDSHIFT_USER: "{{ secret('REDSHIFT_USER') }}"
      REDSHIFT_PASSWORD: "{{ secret('REDSHIFT_PASSWORD') }}"
      MAX_SCALING_MINS: "{{ inputs.max_daily_concurrency_scaling_minutes }}"
      MAX_QUEUE_WAIT: "{{ inputs.max_queue_wait_seconds_warning }}"
    script: |
      import os
      import json
      import psycopg2
      from urllib.parse import urlparse
      from kestra import Kestra

      jdbc_url = os.getenv('JDBC_URL')
      # Extract host, port, db from jdbc:redshift://host:port/db
      clean_url = jdbc_url.replace('jdbc:redshift://', 'postgresql://')
      parsed = urlparse(clean_url)

      host = parsed.hostname
      port = parsed.port or 5439
      database = parsed.path.lstrip('/')
      user = os.getenv('REDSHIFT_USER')
      password = os.getenv('REDSHIFT_PASSWORD')
      max_scaling_mins = float(os.getenv('MAX_SCALING_MINS', 60.0))
      max_queue_wait = int(os.getenv('MAX_QUEUE_WAIT', 300))

      conn = psycopg2.connect(
          host=host,
          port=port,
          dbname=database,
          user=user,
          password=password,
          connect_timeout=15
      )
      cursor = conn.cursor()

      # Query concurrency scaling metrics over past 24 hours from STL_WLM_QUERY
      query = """
      SELECT 
          service_class,
          COUNT(*) as total_queries,
          SUM(CASE WHEN concurrency_scaling_status = 1 THEN 1 ELSE 0 END) as scaling_queries,
          COALESCE(SUM(CASE WHEN concurrency_scaling_status = 1 THEN total_exec_time ELSE 0 END), 0) / 1000000.0 as scaling_seconds,
          COALESCE(MAX(total_queue_time), 0) / 1000000.0 as max_queue_wait_seconds
      FROM stl_wlm_query
      WHERE starttime >= CURRENT_TIMESTAMP - INTERVAL '24 hours'
      GROUP BY service_class;
      """
      cursor.execute(query)
      rows = cursor.fetchall()
      conn.close()

      total_scaling_seconds = sum(row[3] for row in rows)
      total_scaling_minutes = total_scaling_seconds / 60.0
      max_queue_wait_observed = max((row[4] for row in rows), default=0.0)

      has_excessive_scaling = total_scaling_minutes > max_scaling_mins
      has_queue_starvation = max_queue_wait_observed > max_queue_wait
      requires_alert = has_excessive_scaling or has_queue_starvation

      Kestra.outputs({
          'total_scaling_minutes_last_24h': round(total_scaling_minutes, 2),
          'max_queue_wait_seconds': round(max_queue_wait_observed, 2),
          'has_excessive_scaling': has_excessive_scaling,
          'has_queue_starvation': has_queue_starvation,
          'requires_alert': requires_alert
      })

      report = {
          'cluster_endpoint': host,
          'total_scaling_minutes': total_scaling_minutes,
          'max_queue_wait_seconds': max_queue_wait_observed,
          'queues_audited': len(rows),
          'requires_alert': requires_alert
      }

      with open('redshift_concurrency_audit_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - redshift_concurrency_audit_report.json

  - id: check_cost_and_latency
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_concurrency_scaling.vars.requires_alert }}"
    then:
      - id: notify_slack_finops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "Amazon Redshift FinOps Alert: Concurrency scaling usage threshold breached.\n• Scaling Usage (24h): {{ outputs.audit_concurrency_scaling.vars.total_scaling_minutes_last_24h }} mins (Threshold: {{ inputs.max_daily_concurrency_scaling_minutes }} mins)\n• Peak Queue Wait: {{ outputs.audit_concurrency_scaling.vars.max_queue_wait_seconds }} secs (Threshold: {{ inputs.max_queue_wait_seconds_warning }} secs)\n• Action: Audit WLM queue allocations or schedule heavy transformations to non-peak hours."
          }
    else:
      - id: log_redshift_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Redshift cluster scaling within safe limits. Total scaling time: {{ outputs.audit_concurrency_scaling.vars.total_scaling_minutes_last_24h }} minutes."

  - id: export_finops_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      scaling_minutes: "{{ outputs.audit_concurrency_scaling.vars.total_scaling_minutes_last_24h | string }}"
      cost_status: "{{ outputs.audit_concurrency_scaling.vars.has_excessive_scaling ? 'OVERCONSUMPTION' : 'WITHIN_BUDGET' }}"

triggers:
  - id: daily_redshift_cost_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"

extend:
  title: Amazon Redshift Concurrency Scaling Audit
  metaTitle: Amazon Redshift Concurrency Scaling Audit
  shortDescription: Audits Amazon Redshift concurrency scaling usage and queue wait times to eliminate runaway cloud costs.
  metaDescription: Audits Amazon Redshift cluster concurrency scaling usage and query wait times, alerting FinOps teams to excessive scaling hours via Slack.
  description: |
    This blueprint acts as an automated FinOps and performance sentinel for Amazon Redshift data warehouses. Scheduled daily, it inspects Redshift system diagnostic tables (`STL_WLM_QUERY`), measures accumulated concurrency scaling seconds over the previous 24-hour window, evaluates maximum query queue wait times, and alerts FinOps teams on Slack when scaling hours threaten monthly cloud infrastructure budgets.

    ## How it works

    1. **Daily FinOps Trigger**: The `daily_redshift_cost_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires every morning at 07:00 UTC.
    2. **WLM Query Metric Inspection**: The `audit_concurrency_scaling` task (`io.kestra.plugin.scripts.python.Script`) queries `STL_WLM_QUERY` via PostgreSQL-compatible Python drivers to aggregate concurrency scaling seconds and peak queue wait durations across all WLM service classes.
    3. **Cost & Latency Gate**: The `check_cost_and_latency` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether scaling minutes or queue starvation exceeded user-defined warning thresholds.
    4. **Slack Alert Dispatch**: When excessive scaling or queue backlog is flagged, `notify_slack_finops` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable incident report.
    5. **Healthy Confirmation**: When usage remains within budget, `log_redshift_healthy` records confirmed status.
    6. **Manifest Export**: The `export_finops_manifest` task tags the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Daily 07:00 UTC] --> B[audit_concurrency_scaling: Redshift STL_WLM_QUERY]
        B --> C{Scaling Minutes or Queue Wait High?}
        C -- Yes --> D[notify_slack_finops: Slack Webhook]
        C -- No --> E[log_redshift_healthy: Log]
        D --> F[export_finops_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Redshift Concurrency Scaling Cost Guard**: Detect unexpected billing spikes before free daily 1-hour credits are exhausted and per-second charges apply.
    - **WLM Queue Starvation Detection**: Catch poorly tuned ETL queues where concurrent analytical queries starve batch ELT pipelines.
    - **Data Engineering Resource Governance**: Identify rogue BI dashboards or unoptimized ad-hoc queries continually bursting into auto-scaled clusters.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `redshift_jdbc_url` | STRING | `jdbc:redshift://redshift-cluster-1.internal:5439/analytics` | JDBC connection URL for the Amazon Redshift data warehouse cluster. |
    | `max_daily_concurrency_scaling_minutes` | FLOAT | `60.0` | Daily threshold for total concurrency scaling usage in minutes before triggering an alert. |
    | `max_queue_wait_seconds_warning` | INT | `300` | Maximum query queue wait duration in seconds before flagging workload queue starvation. |
    | `slack_channel` | STRING | `#finops-redshift-alerts` | Slack channel destination for Redshift cloud cost notifications. |

    ## Expected outputs

    - `{{ outputs.audit_concurrency_scaling.vars.total_scaling_minutes_last_24h }}`: Sum of concurrency scaling runtime in minutes over past 24 hours.
    - `{{ outputs.audit_concurrency_scaling.vars.max_queue_wait_seconds }}`: Maximum observed query queue latency in seconds.
    - `{{ outputs.audit_concurrency_scaling.vars.has_excessive_scaling }}`: Boolean flag indicating scaling threshold breach.
    - `{{ outputs.audit_concurrency_scaling.vars.has_queue_starvation }}`: Boolean flag indicating query queue starvation.
    - `{{ outputs.audit_concurrency_scaling.outputFiles['redshift_concurrency_audit_report.json'] }}`: Full JSON workload management report.

    ## Prerequisites

    - Redshift database credentials with read access to system catalog tables (`stl_wlm_query`).
    - Incoming Webhook URL configured for your FinOps Slack channel.

    ### Secrets

    - `REDSHIFT_USER`: Redshift database administrator username.
    - `REDSHIFT_PASSWORD`: Redshift database administrator password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `REDSHIFT_USER`, `REDSHIFT_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your Redshift JDBC endpoint in `redshift_jdbc_url`.
    4. Click **Execute** in the UI to perform an immediate concurrency scaling cost audit.

    ## Common pitfalls and troubleshooting

    - **System Table Retention**: `STL` system tables retain approximately 2 to 5 days of log history depending on query volume; run daily audits to prevent missing telemetry.
    - **Free Concurrency Scaling Credits**: AWS provides 1 hour of free concurrency scaling credits every 24 hours that the cluster is active; usage exceeding this threshold is billed per second.

    ## How to extend

    - Add automated pausing or rightsizing of specific WLM queues via AWS CLI tasks during off-peak hours.
    - Query `SVL_QUERY_METRICS` to identify specific query hashes and SQL text responsible for triggering cluster scaling.
    - Export monthly concurrency trends directly to S3 or Amazon QuickSight for financial dashboarding.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Amazon Redshift Concurrency Scaling: https://docs.aws.amazon.com/redshift/latest/dg/concurrency-scaling.html
  tags:
    - Cloud
    - Data
  subTags:
    - Cost Management
    - FinOps & Cost Management
    - AWS Services
  ee: false
  demo: false
