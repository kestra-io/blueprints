id: un-security-council-sanctions-screening
namespace: company.team

description: |
  Screen counterparties (individuals and entities) against the UN Security Council Consolidated
  List every day. The keyless XML is parsed with the Python standard library, names are
  normalised (transliteration, punctuation, token order, particles, legal suffixes) and matched
  in DuckDB with Jaro-Winkler and a token-set score, then adjusted by date of birth, country and
  type. Each result is bucketed POTENTIAL_MATCH, WEAK or CLEAR. The list is diffed against the
  previous run by reference number and content fingerprint, so when it changes only the newly
  listed and amended entries are screened against counterparties that were already screened.
  Decision support for a compliance analyst, not a legal determination.

inputs:
  - id: counterparties
    type: STRING
    displayName: Counterparties (CSV)
    description: CSV with a header row. Columns `id`, `name`, `country` (English short name), `birth_date` (YYYY, YYYY-MM or YYYY-MM-DD; for entities the UN list carries no incorporation date, so it is ignored), `type` (`individual` or `entity`). Only `name` is required. Used when no file is uploaded.
    defaults: |
      id,name,country,birth_date,type
      C-001,Ayman al-Zawahiri,Egypt,1951-06-19,individual
      C-002,Yassin Mohamed Ali,Somalia,1965-12-24,individual
      C-003,Ri Won-ho,North Korea,1964-07-17,individual
      C-004,Mohammed Omar,Afghanistan,1981-02-11,individual
      C-005,Ghalib al-Zaidi,Yemen,1992-04-02,individual
      C-006,Yazd Metallurgy Industries Co.,Iran,,entity
      C-007,Amin Industrial Company,Iran,,entity
      C-008,Hanifa Exchange,Syria,,individual
      C-009,Maria Fernanda Lopez,Spain,1984-03-02,individual
      C-010,Nordwind Logistik GmbH,Germany,,entity
      C-011,Kenji Watanabe,Japan,1979-11-30,individual

  - id: counterparties_file
    type: FILE
    displayName: Counterparty file (optional)
    description: Optional CSV upload with the same columns. When set it replaces the inline list.
    required: false

  - id: potential_threshold
    type: FLOAT
    displayName: POTENTIAL_MATCH threshold
    description: Adjusted score (0 to 1) from which a pair is a POTENTIAL_MATCH for analyst review. The name score alone must reach the WEAK threshold for any hit, so boosters confirm a name match but never create one.
    defaults: 0.9

  - id: weak_threshold
    type: FLOAT
    displayName: WEAK threshold
    description: Adjusted score from which a pair is reported as WEAK. Below it the counterparty is CLEAR for that entry.
    defaults: 0.82

  - id: include_low_quality_aliases
    type: BOOL
    displayName: Screen low-quality aliases
    description: The UN marks some aliases as "Low" quality (too broad to identify someone alone). They are screened with a 0.05 penalty by default; switch off to ignore them.
    defaults: true

  - id: force_full_rescreen
    type: BOOL
    displayName: Force a full re-screen
    description: Screen every counterparty against the whole list even if neither changed, for example after changing a threshold.
    defaults: false

  - id: state_key
    type: STRING
    displayName: State key
    description: KV key holding the last list snapshot, the screened counterparty fingerprints and the open hits. Use one key per counterparty book.
    defaults: un_sc_sanctions_screening_state

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 6 * * *"
    description: The UN regenerates the list file daily (dateGenerated moves even on days without a change); a daily run picks up a new listing within a day.

tasks:
  - id: download_list
    type: io.kestra.plugin.core.http.Download
    description: The keyless XML of the Consolidated List (about 2 MB). The URL redirects to a short-lived signed blob URL, so always start from the scsanctions.un.org address.
    uri: https://scsanctions.un.org/resources/xml/en/consolidated.xml
    headers:
      User-Agent: "kestra-un-security-council-sanctions-screening/1.0 (https://kestra.io)"
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempts: 4

  - id: parse
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Standard-library Python. Parses every INDIVIDUAL and ENTITY with its primary name, aliases (Good and Low
      quality, a.k.a. and f.k.a.), name in original script, nationality, address and birth countries, dates of
      birth (exact dates, years, APPROXIMATELY as +-2 years, BETWEEN ranges) and reference number, fingerprints
      each entry's screening-relevant fields, and normalises list names and counterparties the same way. Fails
      instead of screening against a truncated list.
    containerImage: python:3.13-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      consolidated.xml: "{{ outputs.download_list.uri }}"
      counterparties.csv: "{{ inputs.counterparties_file ?? inputs.counterparties }}"
    outputFiles:
      - list_entries.csv
      - list_names.csv
      - counterparties_norm.csv
    script: |
      import csv, hashlib, json, re, unicodedata
      import xml.etree.ElementTree as ET

      FOLD = str.maketrans({"ø": "o", "ł": "l", "đ": "d", "ħ": "h", "ı": "i", "ß": "ss", "æ": "ae", "œ": "oe", "þ": "th", "ð": "d"})
      PARTICLES = {"al", "el", "ul", "bin", "ibn", "bint", "binti"}
      HONORIFICS = {"mullah", "mulla", "maulavi", "maulawi", "maulvi", "mawlawi", "mawlavi", "haji", "hajji", "sheikh", "shaykh", "qari", "dr", "mr", "mrs"}
      LEGAL = {"co", "company", "corp", "corporation", "inc", "ltd", "limited", "llc", "plc", "pte", "pjsc", "jsc", "gmbh", "sa", "sarl", "srl", "bv", "fze", "fzco"}
      MUHAMMAD = {"mohammed", "mohammad", "mohamed", "mohamad", "muhammed", "muhamad", "mohd", "mahomed", "muhamed"}
      COUNTRY_SYNONYMS = {"north korea": "democratic peoples republic of korea", "dprk": "democratic peoples republic of korea",
                          "south korea": "republic of korea", "russia": "russian federation", "syria": "syrian arab republic",
                          "drc": "democratic republic of the congo", "uk": "united kingdom", "usa": "united states", "us": "united states",
                          "iran": "iran islamic republic of", "laos": "lao peoples democratic republic", "turkey": "turkiye"}

      def fold(value):
          value = unicodedata.normalize("NFKD", (value or "").lower().translate(FOLD))
          value = "".join(ch for ch in value if not unicodedata.combining(ch))
          value = re.sub(r"['`‘’ʼʻ]", "", value)  # apostrophes join: Mu'min = Mumin
          return re.sub(r"[\W_]+", " ", value).strip()                # any other punctuation splits tokens

      def norm_tokens(name, entity):
          out = []
          for t in fold(name).split():
              if t in PARTICLES or t in HONORIFICS or (entity and t in LEGAL):
                  continue
              t = "muhammad" if t in MUHAMMAD else re.sub(r"^abd(el|al|ul)(?=\w)", "abd", t)  # Abdelrahman = Abd al-Rahman
              out.append(re.sub(r"(.)\1+", r"\1", t))                                           # Yassin = Yasin, Hassan = Hasan
          return out

      def country_norm(value):
          v = fold(value)
          return COUNTRY_SYNONYMS.get(v, v)

      def text(el, tag):
          v = el.findtext(tag)
          return re.sub(r"\s+", " ", v).strip() if v else ""

      root = ET.parse("consolidated.xml").getroot()
      if root.tag != "CONSOLIDATED_LIST":
          raise SystemExit(f"Unexpected XML root {root.tag}; the UN list format may have changed")
      entries, names = [], []
      for kind, path, alias_tag, addr_tag in (("individual", "./INDIVIDUALS/INDIVIDUAL", "INDIVIDUAL_ALIAS", "INDIVIDUAL_ADDRESS"),
                                              ("entity", "./ENTITIES/ENTITY", "ENTITY_ALIAS", "ENTITY_ADDRESS")):
          for rec in root.findall(path):
              ref = text(rec, "REFERENCE_NUMBER")
              primary = " ".join(filter(None, (text(rec, t) for t in ("FIRST_NAME", "SECOND_NAME", "THIRD_NAME", "FOURTH_NAME"))))
              variants = [("primary", "Good", primary)]
              if "(" in primary:  # "YAZD METALLURGY INDUSTRIES (YMI)", "... (BRANCH LOCATED IN ...)"
                  variants.append(("primary_short", "Good", re.sub(r"\s*\([^)]*\)", "", primary)))
              for a in rec.findall(alias_tag):
                  if text(a, "ALIAS_NAME"):
                      variants.append(("alias", "Low" if text(a, "QUALITY").lower() == "low" else "Good", text(a, "ALIAS_NAME")))
              if text(rec, "NAME_ORIGINAL_SCRIPT"):
                  variants.append(("original_script", "Good", text(rec, "NAME_ORIGINAL_SCRIPT")))
              nationalities = [v.text.strip() for v in rec.findall("NATIONALITY/VALUE") if v.text and v.text.strip()]
              countries = set(nationalities) | {text(a, "COUNTRY") for a in rec.findall(addr_tag)}
              countries |= {text(p, "COUNTRY") for p in rec.findall("INDIVIDUAL_PLACE_OF_BIRTH")}
              dates, years = set(), set()
              for d in rec.findall("INDIVIDUAL_DATE_OF_BIRTH"):
                  slack = 2 if text(d, "TYPE_OF_DATE") == "APPROXIMATELY" else 0
                  if re.fullmatch(r"\d{4}-\d{2}-\d{2}", text(d, "DATE")):
                      dates.add(text(d, "DATE"))
                      years.add((int(text(d, "DATE")[:4]) - slack, int(text(d, "DATE")[:4]) + slack))
                  elif text(d, "YEAR").isdigit():
                      years.add((int(text(d, "YEAR")) - slack, int(text(d, "YEAR")) + slack))
                  elif text(d, "FROM_YEAR").isdigit() and text(d, "TO_YEAR").isdigit():
                      years.add((int(text(d, "FROM_YEAR")), int(text(d, "TO_YEAR"))))
              seen = set()
              for vkind, quality, raw in variants:
                  toks = norm_tokens(raw, kind == "entity")
                  if toks and (" ".join(toks), quality) not in seen:
                      seen.add((" ".join(toks), quality))
                      names.append({"ref": ref, "variant_kind": vkind, "quality": quality, "raw_name": raw, "norm_name": " ".join(toks)})
              entry = {"ref": ref, "entry_type": kind, "un_list": text(rec, "UN_LIST_TYPE"), "primary_name": primary,
                       "listed_on": text(rec, "LISTED_ON"), "nationality": "; ".join(nationalities),
                       "countries_norm": "|".join(sorted(country_norm(c) for c in countries if c)),
                       "dob_dates": "|".join(sorted(dates)), "dob_years": "|".join(f"{a}-{b}" for a, b in sorted(years))}
              entry["fingerprint"] = hashlib.sha256(json.dumps([entry, sorted(seen)], sort_keys=True).encode()).hexdigest()[:16]
              entries.append(entry)

      if len(entries) < 500 or len({e["ref"] for e in entries}) != len(entries):
          raise SystemExit(f"Parsed {len(entries)} entries; refusing to screen against a truncated or malformed list")

      def write(path, rows, cols):
          with open(path, "w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=cols)
              w.writeheader()
              w.writerows(rows)

      write("list_entries.csv", entries, list(entries[0].keys()))
      write("list_names.csv", names, ["ref", "variant_kind", "quality", "raw_name", "norm_name"])

      cps, ids = [], set()
      with open("counterparties.csv", newline="", encoding="utf-8-sig") as f:
          reader = csv.DictReader(f)
          if "name" not in {(h or "").strip().lower() for h in reader.fieldnames or []}:
              raise SystemExit(f"The counterparty CSV needs a name column, got {reader.fieldnames}")
          for line, row in enumerate(reader, start=2):
              row = {(k or "").strip().lower(): (v or "").strip() for k, v in row.items() if k}
              ctype, bd, problems = row.get("type", "").lower(), row.get("birth_date", ""), []
              if ctype not in ("individual", "entity", ""):
                  problems.append(f"unknown type {ctype}, screened as unknown")
                  ctype = ""
              if bd and not re.fullmatch(r"\d{4}(-\d{2}(-\d{2})?)?", bd):
                  problems.append(f"birth_date {bd} is not YYYY, YYYY-MM or YYYY-MM-DD, ignored")
                  bd = ""
              toks = norm_tokens(row.get("name", ""), ctype == "entity")
              cid = row.get("id") or f"{' '.join(toks)}|{bd}"
              status = "OK"
              if not toks:
                  status = "INVALID"
                  problems.append("missing or empty name")
              elif cid in ids:
                  status = "INVALID"
                  problems.append(f"duplicate id {cid}")
              ids.add(cid)
              cps.append({"line": line, "cp_id": cid, "name": row.get("name", ""), "country": row.get("country", ""),
                          "birth_date": bd, "cp_type": ctype, "norm_name": " ".join(toks),
                          "country_norm": country_norm(row.get("country", "")),
                          "fingerprint": hashlib.sha256(json.dumps([toks, country_norm(row.get("country", "")), bd, ctype]).encode()).hexdigest()[:16],
                          "status": status, "problems": "; ".join(problems)})
      if not cps:
          raise SystemExit("The counterparty CSV has no rows")
      write("counterparties_norm.csv", cps, list(cps[0].keys()))

      print("::" + json.dumps({"outputs": {
          "date_generated": root.get("dateGenerated", ""),
          "list_hash": hashlib.sha256("".join(sorted(e["ref"] + e["fingerprint"] for e in entries)).encode()).hexdigest()[:16],
          "entries": len(entries), "individuals": sum(e["entry_type"] == "individual" for e in entries),
          "entities": sum(e["entry_type"] == "entity" for e in entries), "name_variants": len(names),
          "low_quality_aliases": sum(n["quality"] == "Low" for n in names),
          "counterparties": len(cps), "invalid_counterparties": sum(c["status"] == "INVALID" for c in cps)}}) + "::")

  - id: screen
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Diffs the list against the stored snapshot (NEW, AMENDED, DELISTED by reference number and fingerprint), decides
      the scope per counterparty (FULL for new or edited counterparties and on the baseline, DELTA against new and
      amended entries for the others, NONE when nothing changed), scores the name variants and buckets the results.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles:
      list_entries.csv: "{{ outputs.parse.outputFiles['list_entries.csv'] }}"
      list_names.csv: "{{ outputs.parse.outputFiles['list_names.csv'] }}"
      counterparties.csv: "{{ outputs.parse.outputFiles['counterparties_norm.csv'] }}"
      state.json: "{{ kv(inputs.state_key, errorOnMissing=false) ?? '{}' }}"
    outputFiles:
      - review_csv
      - state_json
    parameters:
      potential: "{{ inputs.potential_threshold }}"
      weak: "{{ inputs.weak_threshold }}"
      include_low: "{{ inputs.include_low_quality_aliases }}"
      force_full: "{{ inputs.force_full_rescreen }}"
      date_generated: "{{ outputs.parse.vars.date_generated }}"
      list_hash: "{{ outputs.parse.vars.list_hash }}"
      execution_url: "{{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
    sql: |
      SET TimeZone = 'UTC';

      CREATE TABLE entries AS SELECT coalesce(COLUMNS(*), '') FROM read_csv('list_entries.csv', header = true, all_varchar = true);
      CREATE TABLE variants AS
      SELECT row_number() OVER () AS vid, v.*, len(string_split(norm_name, ' ')) AS n_tok
      FROM (SELECT coalesce(COLUMNS(*), '') FROM read_csv('list_names.csv', header = true, all_varchar = true)) v
      WHERE CAST(:include_low AS BOOLEAN) OR quality <> 'Low';
      CREATE TABLE cps AS SELECT coalesce(COLUMNS(*), '') FROM read_csv('counterparties.csv', header = true, all_varchar = true);

      CREATE TABLE st AS SELECT json_extract(CAST(content AS JSON), '$.state') AS j FROM read_text('state.json');
      CREATE TABLE prev_entries AS
      SELECT e->>'ref' AS ref, e->>'fp' AS fp, e->>'name' AS name, e->>'type' AS entry_type, e->>'list' AS un_list
      FROM (SELECT unnest(from_json(coalesce(json_extract(j, '$.entries'), '[]'), '["JSON"]')) AS e FROM st);
      CREATE TABLE prev_cps AS
      SELECT c->>'id' AS cp_id, c->>'fp' AS fp FROM (SELECT unnest(from_json(coalesce(json_extract(j, '$.counterparties'), '[]'), '["JSON"]')) AS c FROM st);
      CREATE TABLE prev_hits AS
      SELECT h->>'cp_id' AS cp_id, h->>'name' AS cp_name, h->>'ref' AS ref, h->>'bucket' AS bucket, h->>'score' AS score
      FROM (SELECT unnest(from_json(coalesce(json_extract(j, '$.hits'), '[]'), '["JSON"]')) AS h FROM st);
      CREATE TABLE meta AS
      SELECT (SELECT count(*) FROM prev_entries) = 0 AS is_baseline, (SELECT j->>'date_generated' FROM st) AS prev_date_generated;

      CREATE TABLE guard AS SELECT CASE WHEN (SELECT count(*) FROM entries) < 0.5 * (SELECT count(*) FROM prev_entries)
        THEN error('The list shrank from ' || (SELECT count(*) FROM prev_entries) || ' to ' || (SELECT count(*) FROM entries) || ' entries; refusing to treat that as mass delisting') END AS ok;

      CREATE TABLE list_delta AS
      SELECT coalesce(e.ref, p.ref) AS ref,
             CASE WHEN p.ref IS NULL THEN 'NEW' WHEN e.ref IS NULL THEN 'DELISTED' ELSE 'AMENDED' END AS change,
             coalesce(e.primary_name, p.name) AS name, coalesce(e.entry_type, p.entry_type) AS entry_type,
             coalesce(e.un_list, p.un_list) AS un_list
      FROM entries e FULL JOIN prev_entries p ON p.ref = e.ref
      WHERE NOT (SELECT is_baseline FROM meta) AND (p.ref IS NULL OR e.ref IS NULL OR p.fp <> e.fingerprint);

      CREATE TABLE scope AS
      SELECT c.*, CASE WHEN c.status = 'INVALID' THEN 'NONE'
                       WHEN CAST(:force_full AS BOOLEAN) OR (SELECT is_baseline FROM meta) OR p.cp_id IS NULL OR p.fp <> c.fingerprint THEN 'FULL'
                       WHEN EXISTS (SELECT 1 FROM list_delta WHERE change <> 'DELISTED') THEN 'DELTA'
                       ELSE 'NONE' END AS screen_scope
      FROM cps c LEFT JOIN prev_cps p ON p.cp_id = c.cp_id;

      -- Token-level Jaro-Winkler on distinct token pairs. Each token is weighted by how rare it is on the list
      -- (1 / ln(e + number of list names containing it)), so shared common tokens such as MUHAMMAD, ALI or
      -- INDUSTRIES count less than distinctive ones. Blocking: a list name is a candidate when it shares a token
      -- with similarity >= 0.88 or is identical once spaces are removed (Abdulrahman = Abd al-Rahman).
      CREATE TABLE cp_tok AS SELECT cp_id, unnest(string_split(norm_name, ' ')) AS tok FROM scope WHERE screen_scope <> 'NONE';
      CREATE TABLE v_tok AS SELECT vid, ref, unnest(string_split(norm_name, ' ')) AS tok FROM variants;
      CREATE TABLE tok_weight AS SELECT tok, 1.0 / ln(exp(1) + count(DISTINCT vid)) AS w FROM v_tok GROUP BY tok;
      CREATE TABLE sim AS
      SELECT a.tok AS a, b.tok AS b, jaro_winkler_similarity(a.tok, b.tok) AS s
      FROM (SELECT DISTINCT tok FROM cp_tok) a, (SELECT DISTINCT tok FROM v_tok) b
      WHERE jaro_winkler_similarity(a.tok, b.tok) >= 0.8;
      CREATE TABLE candidates AS
      SELECT DISTINCT k.cp_id, k.vid FROM (
        SELECT c.cp_id, v.vid, v.ref FROM cp_tok c JOIN sim ON sim.a = c.tok AND sim.s >= 0.88 JOIN v_tok v ON v.tok = sim.b
        UNION ALL
        SELECT s.cp_id, v.vid, v.ref FROM scope s JOIN variants v ON replace(v.norm_name, ' ', '') = replace(s.norm_name, ' ', '')
        WHERE s.screen_scope <> 'NONE') k
      JOIN scope s ON s.cp_id = k.cp_id
      WHERE s.screen_scope = 'FULL' OR k.ref IN (SELECT ref FROM list_delta WHERE change <> 'DELISTED');
      CREATE TABLE side_c AS
      SELECT cp_id, vid, sum(w * best) / sum(w) AS avg_c FROM (
        SELECT k.cp_id, k.vid, c.tok, coalesce(any_value(tw.w), 1.0 / ln(exp(1) + 1)) AS w, max(coalesce(sim.s, 0)) AS best
        FROM candidates k JOIN cp_tok c ON c.cp_id = k.cp_id JOIN v_tok v ON v.vid = k.vid
        LEFT JOIN sim ON sim.a = c.tok AND sim.b = v.tok LEFT JOIN tok_weight tw ON tw.tok = c.tok
        GROUP BY k.cp_id, k.vid, c.tok) GROUP BY ALL;
      CREATE TABLE side_v AS
      SELECT cp_id, vid, sum(w * best) / sum(w) AS avg_v FROM (
        SELECT k.cp_id, k.vid, v.tok, any_value(tw.w) AS w, max(coalesce(sim.s, 0)) AS best
        FROM candidates k JOIN cp_tok c ON c.cp_id = k.cp_id JOIN v_tok v ON v.vid = k.vid
        LEFT JOIN sim ON sim.a = c.tok AND sim.b = v.tok JOIN tok_weight tw ON tw.tok = v.tok
        GROUP BY k.cp_id, k.vid, v.tok) GROUP BY ALL;

      CREATE TABLE scored AS
      WITH base AS (
        SELECT s.cp_id, s.name AS cp_name, s.country, s.birth_date, s.cp_type, s.country_norm, s.screen_scope,
               v.ref, v.raw_name AS matched_variant, v.variant_kind, v.quality, e.primary_name, e.entry_type, e.un_list,
               e.listed_on, e.nationality, e.countries_norm, e.dob_dates, e.dob_years,
               len(string_split(s.norm_name, ' ')) AS n_c, v.n_tok AS n_v,
               jaro_winkler_similarity(replace(s.norm_name, ' ', ''), replace(v.norm_name, ' ', '')) AS jw_compact,
               least(length(replace(s.norm_name, ' ', '')), length(replace(v.norm_name, ' ', ''))) AS min_len,
               c.avg_c, w.avg_v
        FROM candidates k
        JOIN scope s ON s.cp_id = k.cp_id JOIN variants v ON v.vid = k.vid JOIN entries e ON e.ref = v.ref
        JOIN side_c c ON c.cp_id = k.cp_id AND c.vid = k.vid JOIN side_v w ON w.cp_id = k.cp_id AND w.vid = k.vid),
      named AS (
        -- Token set: weighted best-match average over the shorter name, times a coverage factor (2 of 4 tokens = 0.875).
        -- Whole-name Jaro-Winkler only counts when near-identical (>= 0.95); names under 5 letters must match exactly.
        SELECT *, CASE WHEN jw_compact = 1 THEN 1.0
                       WHEN min_len < 5 THEN 0.0
                       WHEN least(n_c, n_v) < 2 THEN CASE WHEN n_c = n_v AND jw_compact >= 0.95 THEN jw_compact ELSE 0.0 END
                       ELSE greatest(CASE WHEN jw_compact >= 0.95 THEN jw_compact ELSE 0 END,
                                     CASE WHEN n_c < n_v THEN avg_c WHEN n_v < n_c THEN avg_v ELSE least(avg_c, avg_v) END
                                       * (0.75 + 0.25 * least(n_c, n_v) / greatest(n_c, n_v))) END AS name_score,
               CASE WHEN birth_date = '' OR entry_type <> 'individual' OR (dob_dates = '' AND dob_years = '') THEN 'UNKNOWN'
                    WHEN length(birth_date) = 10 AND list_contains(string_split(dob_dates, '|'), birth_date) THEN 'EXACT_DATE'
                    WHEN EXISTS (SELECT 1 FROM unnest(string_split(dob_years, '|')) AS r(x) WHERE x <> ''
                                  AND TRY_CAST(left(birth_date, 4) AS INTEGER) BETWEEN TRY_CAST(split_part(x, '-', 1) AS INTEGER) AND TRY_CAST(split_part(x, '-', 2) AS INTEGER)) THEN 'YEAR'
                    ELSE 'CONFLICT' END AS dob_signal,
               CASE WHEN country_norm = '' OR countries_norm = '' THEN 'UNKNOWN'
                    WHEN EXISTS (SELECT 1 FROM unnest(string_split(countries_norm, '|')) AS r(x)
                                  WHERE x = country_norm OR (length(country_norm) >= 4 AND contains(x, country_norm))) THEN 'MATCH'
                    ELSE 'DIFFERENT' END AS country_signal,
               CASE WHEN cp_type <> '' AND cp_type <> entry_type THEN 'MISMATCH' ELSE '' END AS type_signal
        FROM base),
      adjusted AS (
        SELECT *, least(1.0, name_score
                  + CASE dob_signal WHEN 'EXACT_DATE' THEN 0.06 WHEN 'YEAR' THEN 0.03 WHEN 'CONFLICT' THEN -0.12 ELSE 0 END
                  + CASE country_signal WHEN 'MATCH' THEN 0.03 WHEN 'DIFFERENT' THEN -0.03 ELSE 0 END
                  + CASE WHEN type_signal = 'MISMATCH' THEN -0.15 ELSE 0 END
                  + CASE WHEN quality = 'Low' THEN -0.05 ELSE 0 END) AS final_score
        FROM named)
      SELECT * EXCLUDE (rn) FROM (
        SELECT *, CASE WHEN final_score >= CAST(:potential AS DOUBLE) AND name_score >= CAST(:weak AS DOUBLE) THEN 'POTENTIAL_MATCH'
                       WHEN final_score >= CAST(:weak AS DOUBLE) AND name_score >= CAST(:weak AS DOUBLE) THEN 'WEAK' ELSE 'CLEAR' END AS bucket,
               row_number() OVER (PARTITION BY cp_id, ref ORDER BY final_score DESC, name_score DESC, quality) AS rn
        FROM adjusted) WHERE rn = 1;

      CREATE TABLE hits AS
      SELECT * FROM (SELECT *, row_number() OVER (PARTITION BY cp_id ORDER BY final_score DESC) AS rank FROM scored WHERE bucket <> 'CLEAR') WHERE rank <= 5;
      CREATE TABLE nearest AS
      SELECT * FROM (SELECT *, row_number() OVER (PARTITION BY cp_id ORDER BY final_score DESC) AS rank FROM scored) WHERE rank = 1;
      CREATE TABLE delisted_prior AS
      SELECT h.*, d.name AS listed_name, d.un_list FROM prev_hits h JOIN list_delta d ON d.ref = h.ref AND d.change = 'DELISTED';

      CREATE TABLE review AS
      SELECT h.cp_id, h.cp_name, h.country, h.birth_date, h.cp_type, h.bucket, h.ref AS reference_number, h.un_list,
             h.primary_name AS listed_name, h.matched_variant, h.variant_kind, h.quality AS alias_quality,
             round(h.name_score, 3) AS name_score, h.dob_signal, h.country_signal, h.type_signal, round(h.final_score, 3) AS final_score,
             h.screen_scope, coalesce(d.change, '') AS list_change, h.listed_on, h.nationality, c.problems AS note
      FROM hits h JOIN cps c ON c.cp_id = h.cp_id AND c.status = 'OK' LEFT JOIN list_delta d ON d.ref = h.ref
      UNION ALL
      SELECT s.cp_id, s.name, s.country, s.birth_date, s.cp_type, 'CLEAR', '', '', n.primary_name, n.matched_variant, '', '',
             round(n.name_score, 3), '', '', '', round(n.final_score, 3), s.screen_scope, '', '', '',
             CASE WHEN n.cp_id IS NULL THEN 'no list name shares a close token' ELSE 'nearest name below the WEAK threshold' END
               || CASE WHEN s.screen_scope = 'DELTA' THEN ' (screened against the new and amended entries only; earlier open hits are kept)' ELSE '' END
               || CASE WHEN s.problems <> '' THEN '; ' || s.problems ELSE '' END
      FROM scope s LEFT JOIN nearest n ON n.cp_id = s.cp_id
      WHERE s.screen_scope <> 'NONE' AND s.cp_id NOT IN (SELECT cp_id FROM hits)
      UNION ALL
      SELECT p.cp_id, p.cp_name, '', '', '', 'DELISTED_PRIOR_MATCH', p.ref, p.un_list, p.listed_name, '', '', '', NULL, '', '', '',
             TRY_CAST(p.score AS DOUBLE), '', 'DELISTED', '', '', 'entry removed from the UN list; review any hold placed on this counterparty'
      FROM delisted_prior p
      UNION ALL
      SELECT cp_id, name, country, birth_date, cp_type, 'INVALID', '', '', '', '', '', '', NULL, '', '', '', NULL, 'NONE', '', '', '',
             'line ' || line || ': ' || problems
      FROM cps WHERE status = 'INVALID';

      COPY (SELECT * FROM review
            ORDER BY CASE bucket WHEN 'POTENTIAL_MATCH' THEN 1 WHEN 'WEAK' THEN 2 WHEN 'DELISTED_PRIOR_MATCH' THEN 3 WHEN 'INVALID' THEN 4 ELSE 5 END,
                     final_score DESC NULLS LAST, cp_id)
        TO '{{ outputFiles.review_csv }}' (HEADER, DELIMITER ',');

      -- New state: list snapshot, screened counterparty fingerprints, open hits (old ones not re-screened, minus delisted refs and removed counterparties).
      CREATE TABLE new_hits AS
      SELECT cp_id, cp_name, ref, bucket, CAST(round(final_score, 3) AS VARCHAR) AS score FROM hits
      UNION ALL
      SELECT h.cp_id, h.cp_name, h.ref, h.bucket, h.score FROM prev_hits h JOIN scope s ON s.cp_id = h.cp_id
      WHERE s.status = 'OK' AND s.screen_scope IN ('NONE', 'DELTA') AND h.ref NOT IN (SELECT ref FROM list_delta);
      COPY (SELECT json_object(
              'date_generated', :date_generated, 'list_hash', :list_hash,
              'entries', (SELECT json_group_array(json_object('ref', ref, 'fp', fingerprint, 'name', primary_name, 'type', entry_type, 'list', un_list)) FROM entries),
              'counterparties', (SELECT coalesce(json_group_array(json_object('id', cp_id, 'fp', fingerprint)), '[]') FROM cps WHERE status = 'OK'),
              'hits', (SELECT coalesce(json_group_array(json_object('cp_id', cp_id, 'name', cp_name, 'ref', ref, 'bucket', bucket, 'score', score)), '[]') FROM new_hits)) AS state)
        TO '{{ outputFiles.state_json }}' (FORMAT JSON);

      CREATE TABLE summary AS SELECT
        (SELECT is_baseline FROM meta) AS is_baseline,
        (SELECT coalesce(prev_date_generated, '') FROM meta) AS prev_date_generated,
        (SELECT count(*) FROM list_delta) > 0 AS list_changed,
        (SELECT count(*) FILTER (WHERE change = 'NEW') FROM list_delta) AS newly_listed,
        (SELECT count(*) FILTER (WHERE change = 'AMENDED') FROM list_delta) AS amended,
        (SELECT count(*) FILTER (WHERE change = 'DELISTED') FROM list_delta) AS delisted,
        (SELECT count(*) FROM cps) AS counterparties,
        (SELECT count(*) FILTER (WHERE screen_scope = 'FULL') FROM scope) AS screened_full,
        (SELECT count(*) FILTER (WHERE screen_scope = 'DELTA') FROM scope) AS screened_delta,
        (SELECT count(*) FILTER (WHERE screen_scope = 'NONE' AND status = 'OK') FROM scope) AS not_rescreened,
        (SELECT count(*) FROM cps WHERE status = 'INVALID') AS invalid,
        (SELECT count(*) FROM scored) AS pairs_scored,
        (SELECT count(*) FROM hits WHERE bucket = 'POTENTIAL_MATCH') AS potential_matches,
        (SELECT count(*) FROM hits WHERE bucket = 'WEAK') AS weak_matches,
        (SELECT count(*) FROM review WHERE bucket = 'CLEAR') AS clear,
        (SELECT count(*) FROM delisted_prior) AS delisted_prior_matches,
        (SELECT count(*) FROM new_hits) AS open_hits,
        CASE WHEN EXISTS (SELECT 1 FROM hits WHERE bucket = 'POTENTIAL_MATCH') THEN 'POTENTIAL_MATCH'
             WHEN EXISTS (SELECT 1 FROM hits WHERE bucket = 'WEAK') THEN 'WEAK' ELSE 'CLEAR' END AS top_bucket,
        (SELECT coalesce(string_agg(cp_id || ' ' || cp_name || ' ~ ' || ref || ' ' || primary_name || ' (' || un_list || ') score ' || printf('%.2f', final_score)
                  || ' [name ' || printf('%.2f', name_score) || ', DOB ' || dob_signal || ', country ' || country_signal || CASE WHEN type_signal <> '' THEN ', type MISMATCH' ELSE '' END
                  || CASE WHEN quality = 'Low' THEN ', low-quality alias' ELSE '' END || ']', chr(10) ORDER BY final_score DESC), '')
           FROM (SELECT * FROM hits WHERE bucket = 'POTENTIAL_MATCH' ORDER BY final_score DESC LIMIT 25)) AS potential_lines,
        (SELECT coalesce(string_agg(cp_id || ' ' || cp_name || ' ~ ' || ref || ' ' || primary_name || ' score ' || printf('%.2f', final_score), chr(10) ORDER BY final_score DESC), '')
           FROM (SELECT * FROM hits WHERE bucket = 'WEAK' ORDER BY final_score DESC LIMIT 25)) AS weak_lines,
        (SELECT coalesce(string_agg(change || ' ' || ref || ' ' || name || ' (' || un_list || ')', chr(10) ORDER BY change DESC, ref), '')
           FROM (SELECT * FROM list_delta ORDER BY change DESC, ref LIMIT 40)) AS change_lines,
        (SELECT coalesce(string_agg(cp_id || ' ' || cp_name || ' was ' || bucket || ' against ' || ref || ' ' || listed_name, chr(10)), '') FROM delisted_prior) AS delisted_prior_lines;

      SELECT *,
        '🚨 *UN Security Council list screening: ' || potential_matches || ' potential match(es) need review*' || chr(10) || potential_lines
          || CASE WHEN weak_matches > 0 THEN chr(10) || '_Also ' || weak_matches || ' weak match(es) in the review CSV._' ELSE '' END
          || chr(10) || 'Review CSV and audit trail ' || :execution_url
          || chr(10) || 'Automated decision support, not a legal determination. Confirm identity before freezing assets or reporting.' AS potential_text,
        'UN Security Council list screening: no potential match, ' || weak_matches || ' weak match(es) to glance at' || chr(10) || weak_lines
          || chr(10) || 'Review CSV ' || :execution_url || chr(10) || 'Decision support only, not a legal determination.' AS weak_text,
        'UN Security Council Consolidated List changed (generated ' || :date_generated || ', previous ' || prev_date_generated || ') with '
          || newly_listed || ' newly listed, ' || amended || ' amended, ' || delisted || ' delisted. ' || screened_delta
          || ' unchanged counterparties re-screened against the new and amended entries only.' || chr(10) || change_lines
          || CASE WHEN delisted_prior_matches > 0 THEN chr(10) || '*Delisted entries that matched a counterparty before*' || chr(10) || delisted_prior_lines ELSE '' END AS change_text
      FROM summary;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: One JSON document (about 100 KB for the full list) so the next run can diff the list and skip unchanged counterparties.
    key: "{{ inputs.state_key }}"
    kvType: STRING
    value: "{{ read(outputs.screen.outputFiles.state_json) | trim }}"

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    description: Routes on the strongest bucket found this run. Hits from earlier runs are not re-alerted; they stay in the state as open hits.
    value: "{{ outputs.screen.outputs[0].row.top_bucket }}"
    cases:
      POTENTIAL_MATCH:
        - id: log_potential
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "POTENTIAL_MATCH for analyst review (decision support, not a legal determination):\n{{ outputs.screen.outputs[0].row.potential_lines }}"
        - id: slack_potential
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {"text": {{ outputs.screen.outputs[0].row.potential_text | toJson }}}
      WEAK:
        - id: log_weak
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "WEAK matches only:\n{{ outputs.screen.outputs[0].row.weak_lines }}"
        - id: slack_weak
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {"text": {{ outputs.screen.outputs[0].row.weak_text | toJson }}}
    defaults:
      - id: log_clear
        type: io.kestra.plugin.core.log.Log
        message: "No POTENTIAL_MATCH or WEAK result this run ({{ outputs.screen.outputs[0].row.screened_full }} counterparties screened in full, {{ outputs.screen.outputs[0].row.screened_delta }} against the delta, {{ outputs.screen.outputs[0].row.not_rescreened }} unchanged and not re-screened)."

  - id: list_change_notice
    type: io.kestra.plugin.core.flow.If
    description: Not on the baseline run. Tells compliance what the UN changed, including delisted entries that matched a counterparty before.
    condition: "{{ outputs.screen.outputs[0].row.list_changed }}"
    then:
      - id: log_list_change
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.screen.outputs[0].row.change_text }}"
      - id: slack_list_change
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": {{ outputs.screen.outputs[0].row.change_text | toJson }}}

  - id: warn_invalid
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.screen.outputs[0].row.invalid > 0 }}"
    level: WARN
    message: "{{ outputs.screen.outputs[0].row.invalid }} counterparty row(s) were not screened (missing name or duplicate id); see the INVALID rows in the review CSV."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      UN list generated {{ outputs.parse.vars.date_generated }}: {{ outputs.parse.vars.entries }} entries ({{ outputs.parse.vars.individuals }} individuals, {{ outputs.parse.vars.entities }} entities), {{ outputs.parse.vars.name_variants }} name variants ({{ outputs.parse.vars.low_quality_aliases }} low-quality aliases){{ outputs.screen.outputs[0].row.is_baseline ? ', BASELINE run' : '' }}.
      List delta: {{ outputs.screen.outputs[0].row.newly_listed }} new, {{ outputs.screen.outputs[0].row.amended }} amended, {{ outputs.screen.outputs[0].row.delisted }} delisted.
      Counterparties {{ outputs.screen.outputs[0].row.counterparties }}: full {{ outputs.screen.outputs[0].row.screened_full }}, delta {{ outputs.screen.outputs[0].row.screened_delta }}, not re-screened {{ outputs.screen.outputs[0].row.not_rescreened }}, invalid {{ outputs.screen.outputs[0].row.invalid }}; {{ outputs.screen.outputs[0].row.pairs_scored }} candidate pairs scored.
      POTENTIAL_MATCH {{ outputs.screen.outputs[0].row.potential_matches }}, WEAK {{ outputs.screen.outputs[0].row.weak_matches }}, CLEAR {{ outputs.screen.outputs[0].row.clear }}, delisted prior matches {{ outputs.screen.outputs[0].row.delisted_prior_matches }}, open hits {{ outputs.screen.outputs[0].row.open_hits }}.
      Review CSV: {{ outputs.screen.outputFiles.review_csv }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.screen.outputs[0].row | jq('del(.potential_lines, .weak_lines, .change_lines, .delisted_prior_lines, .potential_text, .weak_text, .change_text)') | first }}"
  - id: review_csv
    type: FILE
    value: "{{ outputs.screen.outputFiles.review_csv }}"

extend:
  title: Screen Counterparties Against the UN Security Council Sanctions List with List-Delta Re-screening
  metaTitle: UN Security Council Sanctions Screening with DuckDB Fuzzy Matching | Kestra
  shortDescription: Download the UN Security Council Consolidated List daily, fuzzy-match your individuals and entities in DuckDB with date of birth, country and type as boosters or reducers, bucket results as POTENTIAL_MATCH, WEAK or CLEAR, and re-screen only against newly listed and amended entries when the list changes.
  metaDescription: Daily UN Security Council sanctions screening with DuckDB fuzzy matching, list diffing, delta re-screening, review CSV and Slack alerts with reference numbers.
  description: |
    Every sanctions programme that implements UN Security Council measures needs the same check: are any of our customers, suppliers or payees on the Consolidated List, and did today's update add one? The UN publishes it as a keyless XML file with about 1,000 entries and 4,000 names once aliases are counted. This flow parses it with standard-library Python, fuzzy-matches and diffs it in DuckDB, keeps the last snapshot in the KV store and routes results to Slack with the UN reference numbers (for example `QDi.006`). It is decision support for a compliance analyst, not a legal determination: every POTENTIAL_MATCH must be confirmed against the full UN entry before an asset freeze or a report.

    ## How it works

    1. A daily `Schedule` (06:30 UTC) runs the flow. Counterparties come from the inline CSV input or from an uploaded CSV file (`id`, `name`, `country`, `birth_date`, `type`; only `name` is required).
    2. `download_list` fetches `scsanctions.un.org/resources/xml/en/consolidated.xml`, which redirects to a short-lived signed URL, with retries.
    3. `parse` (Python, no packages) reads every INDIVIDUAL and ENTITY: primary name, aliases with their quality (Good, Low, a.k.a., f.k.a.), name in original script, nationality, address and birth countries, dates of birth (exact dates, years, APPROXIMATELY as plus or minus two years, BETWEEN ranges) and reference number. Names on both sides are normalised the same way: accents and special letters transliterated, apostrophes joined, punctuation split, particles (al, bin, ibn), honorifics (Mullah, Haji) and legal suffixes (Ltd, Co) dropped, `Mohamed`/`Muhammad` variants folded, doubled letters collapsed. Each entry gets a fingerprint of its screening fields; a list under 500 entries fails the run.
    4. `screen` (DuckDB) diffs the list against the stored snapshot by reference number and fingerprint (NEW, AMENDED, DELISTED). New or edited counterparties, and every counterparty on the first run, are screened against the whole list; unchanged ones only against the new and amended entries; nothing is screened when neither changed. Names are compared token by token with `jaro_winkler_similarity`, each token weighted by how rare it is on the list, with a coverage factor for partial names. An exact date of birth adds 0.06, a matching year 0.03, a conflicting one subtracts 0.12; a matching country adds 0.03, a different one subtracts 0.03; an individual/entity mismatch subtracts 0.15 and a low-quality alias 0.05. Boosters confirm a name match but never create one.
    5. `save_state` stores the snapshot, the counterparty fingerprints and the open hits in one KV entry.
    6. `route` (`Switch`) posts POTENTIAL_MATCH or WEAK results to Slack with the reference numbers; `list_change_notice` (`If`) reports new, amended and delisted entries, including delisted ones a counterparty matched before. Slack tasks use `allowFailure`.

    ## What you get

    - A review CSV per run: counterparty, bucket, UN reference number, regime, listed name, matched alias and its quality, name score, DOB, country and type signals, final score, scope (FULL or DELTA) and list change.
    - CLEAR rows with the nearest list name, INVALID rows for missing names or duplicate ids, and data-quality notes (unparseable birth date, unknown type).
    - Each hit alerted once; re-runs on an unchanged list screen nothing and alert nothing.
    - A guard against truncated downloads, which would otherwise look like mass delisting.

    ## Who it's for

    - Compliance, KYC and AML teams screening customers, suppliers and payees.
    - Data engineers adding sanctions checks to onboarding or payment pipelines.

    ## Why orchestrate this with Kestra

    - Download, parse, diff and alert are retried and logged separately, so an audit shows which list version was used and what was screened.
    - The KV store makes delta re-screening possible without a database.
    - Thresholds, alias handling and full re-screens are inputs, not code.

    ## Prerequisites

    - Kestra 2.0 with the Python script, DuckDB and Slack plugins, and a Docker runner for the `python:3.13-slim` image.
    - Outbound HTTPS to `scsanctions.un.org` and its blob storage redirect; no API key.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for alerts (optional; without it the Slack tasks warn and the results stay in the logs and the CSV).

    ## Quick start

    1. Click **Execute** with the defaults. The first run is a BASELINE: real listed names written the way a counterparty file would hold them (`Ayman al-Zawahiri`, `Ri Won-ho`, `Yazd Metallurgy Industries Co.`) come out as POTENTIAL_MATCH, `Mohammed Omar` and `Ghalib al-Zaidi` (conflicting birth dates) and `Hanifa Exchange` entered as an individual as WEAK, and three unrelated names as CLEAR.
    2. Execute again: nothing is re-screened and the CLEAR branch logs it.
    3. Upload your own CSV, set `SLACK_WEBHOOK_URL`, choose a `state_key` per counterparty book and keep the daily schedule on.
    4. After changing a threshold, run once with `force_full_rescreen` set to true.

    ## How to extend

    - Read counterparties from your CRM or warehouse with a JDBC task instead of a CSV.
    - Add an approval step with a `Pause` task before a hold is placed on a confirmed match.
    - Screen against other lists (EU, UK, OFAC) in parallel with the same matching SQL.

    ## Links

    - [UN Security Council Consolidated List](https://main.un.org/securitycouncil/en/content/un-sc-consolidated-list)
    - [Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries) and [DuckDB text similarity functions](https://duckdb.org/docs/stable/sql/functions/text)
    - [Switch](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.switch) and [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Business
  subTags:
    - Policy & Compliance
    - Reporting & Digests
  ee: false
  demo: false
