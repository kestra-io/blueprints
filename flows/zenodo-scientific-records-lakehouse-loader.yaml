id: zenodo-scientific-records-lakehouse-loader
namespace: company.analytics
description: Ingests open-access scientific publications, software releases, research data files, and DOI citations from CERN Zenodo into Parquet lakehouse storage via DuckDB, tracking research deposits in Kestra KV store.

inputs:
  - id: search_query
    type: STRING
    description: Scientific search term or research community keyword on Zenodo.
    defaults: "orchestration"

  - id: size
    type: INT
    description: Maximum number of research deposit records to harvest.
    defaults: 20

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed Zenodo deposit record IDs.
    defaults: zenodo_monitored_records_state

variables:
  default_state: "[]"

triggers:
  - id: weekly_zenodo_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_zenodo
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import urllib.parse
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state)) if raw_state else set()
        except Exception:
            seen_ids = set()

        q = "{{ inputs.search_query }}"
        size = int("{{ inputs.size }}")

        encoded_q = urllib.parse.quote(q)
        url = f"https://zenodo.org/api/records?q={encoded_q}&size={size}&sort=mostrecent"
        headers = {"User-Agent": "KestraZenodoLakehouse/1.0 (cern-science@kestra.io)"}

        records = []
        new_deposits = []
        harvested_ids = []

        try:
            resp = requests.get(url, headers=headers, timeout=25)
            if resp.status_code == 200:
                data = resp.json()
                hits = data.get("hits", {}).get("hits", [])
                for h in hits:
                    r_id = h.get("id")
                    doi = h.get("doi", "")
                    created_at = h.get("created", "")

                    metadata = h.get("metadata", {})
                    title = metadata.get("title", "")
                    pub_date = metadata.get("publication_date", "")
                    res_type = metadata.get("resource_type", {}).get("title", "Publication")
                    creators = ", ".join([c.get("name", "") for c in metadata.get("creators", []) if c.get("name")])[:200]
                    access_right = metadata.get("access_right", "open")

                    files_list = h.get("files", [])
                    total_file_bytes = sum(f.get("size", 0) for f in files_list)

                    is_new = r_id not in seen_ids
                    harvested_ids.append(r_id)

                    records.append({
                        "record_id": r_id,
                        "doi": doi,
                        "title": title,
                        "creators": creators,
                        "publication_date": pub_date,
                        "resource_type": res_type,
                        "access_right": access_right,
                        "total_files_count": len(files_list),
                        "total_bytes": total_file_bytes,
                        "is_new_deposit": is_new,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_new:
                        new_deposits.append({"id": r_id, "title": title, "doi": doi})
        except Exception as e:
            print(f"Error fetching Zenodo scientific deposits: {e}")

        with open("zenodo_records.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE zenodo_deposits AS SELECT * FROM read_json_auto('zenodo_records.json')")
            con.execute("COPY zenodo_deposits TO 'zenodo_scientific_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY zenodo_deposits TO 'zenodo_scientific_archive.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE zenodo_deposits (
                    record_id BIGINT,
                    doi VARCHAR,
                    title VARCHAR,
                    creators VARCHAR,
                    publication_date VARCHAR,
                    resource_type VARCHAR,
                    access_right VARCHAR,
                    total_files_count INTEGER,
                    total_bytes BIGINT,
                    is_new_deposit BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY zenodo_deposits TO 'zenodo_scientific_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY zenodo_deposits TO 'zenodo_scientific_archive.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_harvested_deposits": len(records),
            "new_deposits_count": len(new_deposits),
            "new_deposits": new_deposits[:5],
            "updated_state": list(set(list(seen_ids) + harvested_ids))[:500]
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - zenodo_scientific_archive.parquet
      - zenodo_scientific_archive.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_zenodo.vars.updated_state | toJson }}"

  - id: check_new_deposits
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_zenodo.vars.new_deposits_count > 0 }}"
    then:
      - id: notify_new_deposits
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "🔬 Zenodo Research Deposit Ingestion: Discovered {{ outputs.ingest_and_transform_zenodo.vars.new_deposits_count }} newly published scientific deposits matching '{{ inputs.search_query }}'."

outputs:
  - id: total_deposits
    type: INT
    value: "{{ outputs.ingest_and_transform_zenodo.vars.total_harvested_deposits }}"
  - id: new_deposits_count
    type: INT
    value: "{{ outputs.ingest_and_transform_zenodo.vars.new_deposits_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_zenodo.outputFiles['zenodo_scientific_archive.parquet'] }}"

extend:
  title: CERN Zenodo Scientific Records Lakehouse Loader with DuckDB
  metaTitle: CERN Zenodo Scientific Lakehouse Loader | Kestra
  shortDescription: Ingests open-access scientific publications, software releases, research data files, and DOI citations from CERN Zenodo into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll CERN Zenodo REST API for scientific publications and open research deposits, convert DOI citation records into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, open science harmonization, and analytical lakehouse persistence of scientific
    publications, research software artifacts, experimental datasets, and DOIs from CERN Zenodo into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`zenodo_monitored_records_state`) for previously verified Zenodo deposit identifiers.
    2. **Zenodo REST Ingestion**: Queries the official CERN Zenodo REST API (`zenodo.org/api/records`) across target academic keywords.
    3. **DuckDB Open Science Normalization**: Unpacks publication titles, creators, resource types, access rights, file counts, and DOIs into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized research deposit records into columnar Parquet and CSV files for academic literature analytics and scientific asset governance.
    5. **New Deposit Detection & State Commitment**: Detects newly deposited research assets, logs publication notices, and commits state to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of global open-access scientific publications and datasets.
    - Columnar Parquet datasets queryable with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Open Science Program Officers and Academic Librarians indexing institutional output.
    - Research Data Engineers building domain-specific literature knowledge stores.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical deposit states across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `zenodo.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting teams on newly deposited research works.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set your `search_query` parameter.
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `weekly_zenodo_sync` schedule for automated weekly updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition weekly research deposit archives.
    - Connect an NLP summarization model over publication abstracts using Hugging Face or Ollama.

    ## Links

    - [CERN Zenodo REST API Documentation](https://developers.zenodo.org/)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
