id: mysql-replication-lag-sentinel
namespace: company.data
description: |
  Inspects MySQL replica Seconds_Behind_Master and IO/SQL replication threads via SHOW REPLICA STATUS,
  alerting DBAs before replication drift causes stale read anomalies or failover hazards.
inputs:
  - id: database_host
    type: STRING
    displayName: MySQL Replica Host
    defaults: mysql-replica-01.internal
  - id: database_port
    type: INT
    displayName: Database Port
    defaults: 3306
  - id: database_name
    type: STRING
    displayName: Database Name
    defaults: production
  - id: database_username
    type: STRING
    displayName: Database Username
    defaults: replica_monitor
  - id: max_seconds_behind_master_threshold
    type: INT
    displayName: Max Replication Lag Seconds Threshold
    defaults: 300

triggers:
  - id: periodic_replication_lag_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: check_replica_status
    type: io.kestra.plugin.jdbc.mysql.Query
    description: Executes SHOW REPLICA STATUS to fetch current replication threads and lag metrics
    url: "jdbc:mysql://{{ inputs.database_host }}:{{ inputs.database_port }}/{{ inputs.database_name }}"
    username: "{{ inputs.database_username }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    sql: "SHOW REPLICA STATUS;"
    fetchType: FETCH_ONE

  - id: evaluate_replication_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates if IO/SQL threads are running and lag is below threshold
    condition: "{{ (outputs.check_replica_status.row.Seconds_Behind_Master ?? 99999) >= inputs.max_seconds_behind_master_threshold or outputs.check_replica_status.row.Replica_IO_Running != 'Yes' or outputs.check_replica_status.row.Replica_SQL_Running != 'Yes' }}"
    then:
      - id: alert_dba_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts DBA team on Slack regarding replication disruption
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "🚨 *MySQL Replication Lag / Thread Alert*\n*Host:* `{{ inputs.database_host }}`\n*Seconds Behind Master:* *{{ outputs.check_replica_status.row.Seconds_Behind_Master ?? 'NULL (Broken)' }}* (Threshold: `{{ inputs.max_seconds_behind_master_threshold }}s`)\n*Replica IO Running:* `{{ outputs.check_replica_status.row.Replica_IO_Running }}`\n*Replica SQL Running:* `{{ outputs.check_replica_status.row.Replica_SQL_Running }}`\n*Last Error:* `{{ outputs.check_replica_status.row.Last_Error ?? 'None' }}`"
          }
    else:
      - id: log_replication_healthy
        type: io.kestra.plugin.core.log.Log
        message: "MySQL replication on {{ inputs.database_host }} is healthy (Lag: {{ outputs.check_replica_status.row.Seconds_Behind_Master ?? 0 }}s)."

errors:
  - id: alert_check_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack on connection or query execution failure
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "⚠️ *MySQL Replication Sentinel Failed* during execution `{{ execution.id }}` on host `{{ inputs.database_host }}`."
      }

extend:
  title: MySQL Replication Lag and Thread Health Sentinel
  shortDescription: Monitor MySQL replica Seconds_Behind_Master and IO/SQL thread statuses via SHOW REPLICA STATUS, alerting DBAs before stale read drift.
  metaTitle: MySQL Replication Lag Sentinel with Kestra
  metaDescription: Automated MySQL replication lag monitoring with Kestra. Query SHOW REPLICA STATUS and alert Slack on replication thread stoppage or lag spikes.
  description: |
    MySQL read replicas are critical for offloading read traffic from primary database masters and serving as hot standby targets. If network latency surges, intensive long-running writes block the SQL thread, or binary log coordinates desynchronize, the replica falls behind (`Seconds_Behind_Master`) or stops replication entirely.

    This blueprint connects to MySQL replicas via JDBC, executes `SHOW REPLICA STATUS`, evaluates `Seconds_Behind_Master`, `Replica_IO_Running`, and `Replica_SQL_Running`, and immediately alerts database administrators via Slack when replication halts or breaches latency SLAs.

    ## How it works

    1. `periodic_replication_lag_check` runs on a 5-minute schedule.
    2. `check_replica_status` executes `SHOW REPLICA STATUS` via JDBC to fetch current replication telemetry.
    3. `evaluate_replication_health` evaluates whether `Replica_IO_Running == 'Yes'`, `Replica_SQL_Running == 'Yes'`, and `Seconds_Behind_Master` is below threshold.
    4. If threads are halted or lag exceeds threshold, `alert_dba_slack` dispatches an urgent diagnostic alert to Slack.
    5. If replication is synchronized, `log_replication_healthy` records normal operation.
    6. `errors` block catches connection drops or query failures.

    ## What you get

    - Automated detection of broken replication threads (`Last_Error`) and lag spikes.
    - Zero dedicated replication monitoring agents required.
    - Rich Slack notifications with replica coordinates and error details.

    ## Who it's for

    - Database Administrators (DBAs) managing MySQL read replicas and High Availability.
    - Backend and Platform Engineers routing read queries to secondary nodes.
    - SREs maintaining database uptime SLAs.

    ## Why orchestrate this with Kestra

    Kestra features native JDBC MySQL plugins that query replication state directly, evaluate status parameters with Pebble expressions, and route alerts seamlessly without custom daemon scripts.

    ## Prerequisites

    - MySQL 5.7+ / 8.0+ replica database.
    - Database user with `REPLICATION CLIENT` privileges.
    - A Slack incoming webhook URL.

    ### Secrets

    - `MYSQL_PASSWORD`: Password for the MySQL monitor user.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for Slack alerts.

    ## Inputs

    - `database_host`: MySQL replica host address.
    - `database_port`: MySQL port (default: 3306).
    - `database_name`: Database name.
    - `database_username`: Database user name.
    - `max_seconds_behind_master_threshold`: Allowed replication lag in seconds (default: 300).

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Configure the `MYSQL_PASSWORD` and `SLACK_WEBHOOK` secrets.
    3. Run manually to test replica connectivity.
    4. Enable the schedule trigger for continuous sentinel monitoring.

    ## How to extend

    - Add automated tasks to temporarily drain traffic from lagging replicas.
    - Route critical alerts to PagerDuty or OpsGenie.

    ## Links

    - [MySQL SHOW REPLICA STATUS Documentation](https://dev.mysql.com/doc/refman/8.0/en/show-replica-status.html)
    - [Kestra MySQL Plugin](https://kestra.io/plugins/plugin-jdbc-mysql)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Database Monitoring
  ee: false
  demo: false
