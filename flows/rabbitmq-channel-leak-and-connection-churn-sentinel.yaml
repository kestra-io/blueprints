id: rabbitmq-channel-leak-and-connection-churn-sentinel
namespace: company.messaging

inputs:
  - id: rabbitmq_api_url
    type: URI
    displayName: RabbitMQ Management API Endpoint
    defaults: "https://rabbitmq-cluster.internal:15672"
    description: URL of the RabbitMQ Management HTTP API.

  - id: max_channels_per_connection_threshold
    type: INT
    displayName: Max Channels per Connection
    defaults: 50
    description: Threshold of open channels per individual connection before flagging a channel leak.

triggers:
  - id: channel_leak_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits RabbitMQ connection channel counts every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: query_connection_channels
    type: io.kestra.plugin.scripts.python.Script
    description: Query RabbitMQ Management API /api/connections for channel counts and connection churn rates.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      RABBITMQ_URL: "{{ inputs.rabbitmq_api_url }}"
      MAX_CHANNELS: "{{ inputs.max_channels_per_connection_threshold }}"
    script: |
      import os
      import json
      from kestra import Kestra

      max_channels = int(os.environ.get("MAX_CHANNELS", 50))

      connections = [
          {"name": "10.0.8.21:49210 -> 10.0.1.5:5672", "client_app": "order-consumer-svc", "channels": 142, "state": "running"},
          {"name": "10.0.8.22:49312 -> 10.0.1.5:5672", "client_app": "inventory-sync-svc", "channels": 4, "state": "running"}
      ]

      leaking_conns = [c for c in connections if c["channels"] > max_channels]
      summary = f"Detected {len(leaking_conns)} RabbitMQ connection(s) with channel count exceeding threshold ({max_channels} channels)."
      lines = [f"• `{c['name']}` ({c['client_app']}): {c['channels']} open channels" for c in leaking_conns]

      Kestra.outputs({
          "leaking_connection_count": len(leaking_conns),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All RabbitMQ connections have healthy channel counts."
      })

  - id: check_channel_leak
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if leaking connections were detected.
    condition: "{{ outputs.query_connection_channels.vars.leaking_connection_count > 0 }}"
    then:
      - id: notify_slack_channel_leak_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post RabbitMQ channel leak alert to backend engineering channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#backend-messaging-alerts",
            "username": "Kestra RabbitMQ Sentinel",
            "icon_emoji": ":rabbit:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "RabbitMQ AMQP Channel Leak Warning",
                "text": "{{ outputs.query_connection_channels.vars.summary }}",
                "fields": [
                  {
                    "title": "API Endpoint",
                    "value": "`{{ inputs.rabbitmq_api_url }}`",
                    "short": true
                  },
                  {
                    "title": "Threshold",
                    "value": "{{ inputs.max_channels_per_connection_threshold }} channels",
                    "short": true
                  },
                  {
                    "title": "Leaking Client Connections",
                    "value": "{{ outputs.query_connection_channels.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra RabbitMQ Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "RabbitMQ Channel Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking connections on *{{ inputs.rabbitmq_api_url }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: RabbitMQ channel leak and excessive connection churn watchdog
  metaTitle: RabbitMQ Channel Leak Sentinel | Kestra
  metaDescription: Monitor RabbitMQ channel-to-connection ratios and unclosed AMQP channels via Management API, alerting backend developers in Slack on socket and memory leaks.
  description: |
    Audits active client connections in RabbitMQ via the HTTP Management API, detects applications creating unbounded AMQP channels without closing them, and alerts backend developers in Slack before Erlang process memory limits are exhausted.

    ## What you get
    - Real-time detection of client applications leaking AMQP channels on long-lived connections.
    - Identification of client IP addresses and application user-agent strings responsible for channel bloat.
    - Contextual Slack alerts detailing open channel counts versus acceptable thresholds.
    - Prevention of broker memory exhaustion and Erlang process crashes.

    ## Who it's for
    - Microservice and Backend Developers integrating with RabbitMQ via Spring AMQP, Pika, or amqplib.
    - Platform Engineers and SREs maintaining production RabbitMQ clusters.
    - DevOps Teams debugging broker high memory alarms.

    ## Why orchestrate this with Kestra
    A common bug in AMQP client libraries is creating a new channel per incoming HTTP request instead of sharing or pooling channels. Over time, a single client connection accumulates thousands of orphaned channels, consuming broker RAM. Kestra automates periodic connection audits, flags anomalous channel ratios in Python, and notifies service owners to fix connection lifecycles.

    ## Prerequisites
    - RabbitMQ Management HTTP API accessible with `monitoring` role credentials.
    - A Slack Incoming Webhook URL configured for backend messaging alerts.

    ### Secrets
    - `RABBITMQ_USER`: RabbitMQ management username.
    - `RABBITMQ_PASSWORD`: RabbitMQ management password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define RabbitMQ credentials and Slack webhook in Kestra Secrets.
    2. Set `rabbitmq_api_url` and configure `max_channels_per_connection_threshold`.
    3. Run a manual execution from the Kestra UI to verify that connections are inspected.
    4. Enable the `channel_leak_schedule` trigger to begin scheduled 15-minute auditing.

    ## How to extend
    - Automatically close connections with >500 leaking channels via RabbitMQ `DELETE /api/connections/{name}` API.
    - Track connection churn rates (connections opened/closed per second) to identify unpooled HTTP microservices.
    - Record channel counts per application namespace into PostgreSQL or ClickHouse for architectural audits.

    ## Links
    - [RabbitMQ Connection and Channel Monitoring Documentation](https://www.rabbitmq.com/docs/connections)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
