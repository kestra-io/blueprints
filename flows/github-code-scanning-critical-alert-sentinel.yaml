id: github-code-scanning-critical-alert-sentinel
namespace: company.security

description: |
  Audits repository GitHub CodeQL code scanning security alerts via GitHub REST API,
  identifies open critical or high-severity vulnerabilities, creates an automated
  remediation tracking issue, and alerts the application security team on Slack.

inputs:
  - id: repository
    type: STRING
    displayName: Target GitHub Repository
    defaults: my-org/production-api

  - id: target_issue_repository
    type: STRING
    displayName: AppSec Issue Tracking Repository
    defaults: my-org/appsec-operations

triggers:
  - id: daily_code_scanning_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"
    disabled: true

tasks:
  - id: probe_codeql_alerts
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates GitHub Code Scanning API for open critical and high severity alerts
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    script: |
      import os
      import requests
      from kestra import Kestra

      repo = "{{ inputs.repository }}"
      token = os.environ.get("GITHUB_TOKEN")

      headers = {
          "Authorization": f"Bearer {token}",
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28"
      }

      url = f"https://api.github.com/repos/{repo}/code-scanning/alerts"
      params = {
          "state": "open",
          "severity": "critical,high",
          "per_page": 50
      }

      try:
          resp = requests.get(url, headers=headers, params=params, timeout=30)
          alerts = resp.json() if resp.status_code == 200 else []
      except Exception as err:
          print(f"Failed to query code scanning alerts: {err}")
          alerts = []

      critical_alerts = []
      high_alerts = []

      for a in alerts:
          sev = a.get("rule", {}).get("severity", "high")
          desc = a.get("rule", {}).get("description", "Unknown security finding")
          path = a.get("most_recent_instance", {}).get("location", {}).get("path", "unknown")
          line = a.get("most_recent_instance", {}).get("location", {}).get("start_line", 0)
          
          item = {
              "number": a.get("number"),
              "rule_id": a.get("rule", {}).get("id"),
              "description": desc,
              "path": f"{path}:{line}",
              "severity": sev
          }
          if sev == "critical":
              critical_alerts.append(item)
          else:
              high_alerts.append(item)

      total_alerts = len(critical_alerts) + len(high_alerts)
      print(f"Repository {repo}: {len(critical_alerts)} Critical, {len(high_alerts)} High alerts")

      Kestra.outputs({
          "repository": repo,
          "critical_count": len(critical_alerts),
          "high_count": len(high_alerts),
          "total_alerts": total_alerts,
          "has_critical": total_alerts > 0,
          "critical_alerts": critical_alerts[:10],
          "high_alerts": high_alerts[:10]
      })

  - id: branch_on_security_findings
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether open critical or high code scanning alerts exist
    condition: "{{ outputs.probe_codeql_alerts.vars.has_critical == true }}"
    then:
      - id: create_appsec_incident_issue
        type: io.kestra.plugin.github.issues.Create
        description: Logs a prioritized GitHub issue tracking CodeQL security alerts
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.target_issue_repository }}"
        title: "[AppSec Alert] Open CodeQL Security Vulnerabilities in {{ inputs.repository }} ({{ outputs.probe_codeql_alerts.vars.total_alerts }} Findings)"
        body: |
          ## 🚨 GitHub CodeQL Code Scanning Security Findings

          Automated static analysis auditing detected open Critical/High vulnerabilities in `{{ inputs.repository }}`:
          - **Critical Vulnerabilities:** **{{ outputs.probe_codeql_alerts.vars.critical_count }}**
          - **High Vulnerabilities:** **{{ outputs.probe_codeql_alerts.vars.high_count }}**

          ### Top Findings:
          {% for a in outputs.probe_codeql_alerts.vars.critical_alerts %}
          - **[CRITICAL] Alert #{{ a.number }}:** `{{ a.rule_id }}` at `{{ a.path }}`, {{ a.description }}
          {% endfor %}
          {% for a in outputs.probe_codeql_alerts.vars.high_alerts %}
          - **[HIGH] Alert #{{ a.number }}:** `{{ a.rule_id }}` at `{{ a.path }}`, {{ a.description }}
          {% endfor %}

          Please remediate or dismiss with security justification to maintain repository security compliance.
          *Generated automatically by Kestra CodeQL Sentinel.*

      - id: alert_appsec_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts AppSec Slack channel with severity counts and issue hyperlink
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🛡️ *GitHub CodeQL Security Alert*\n*Repository:* `" ~ inputs.repository ~ "`\n*Open Vulnerabilities:* Critical: *" ~ outputs.probe_codeql_alerts.vars.critical_count ~ "*, High: *" ~ outputs.probe_codeql_alerts.vars.high_count ~ "*\n*AppSec Ticket:* <" ~ (outputs.create_appsec_incident_issue.issueUrl ?? "#") ~ "|View GitHub Issue>"
          } | toJson }}

    else:
      - id: log_repo_compliant
        type: io.kestra.plugin.core.log.Log
        message: "Repository {{ inputs.repository }} has zero open Critical or High CodeQL code scanning alerts."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final audit status log recording code scanning health
    message: "CodeQL audit complete for {{ inputs.repository }}. Open findings: {{ outputs.probe_codeql_alerts.vars.total_alerts }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when GitHub API queries fail
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *GitHub Code Scanning Sentinel Failed* in execution `" ~ execution.id ~ "`. Unable to query `" ~ inputs.repository ~ "`."
      } | toJson }}

extend:
  title: "GitHub CodeQL Code Scanning Critical Alert Sentinel"
  shortDescription: "Audit GitHub CodeQL code scanning alerts, detect open Critical and High vulnerabilities, log GitHub issues, and alert Slack."
  metaTitle: "GitHub CodeQL Code Scanning Sentinel with Kestra"
  metaDescription: "Monitor GitHub CodeQL code scanning security alerts with Kestra. Query GitHub REST API, open AppSec tracking issues, and alert Slack."
  description: |
    GitHub Advanced Security and CodeQL static application security testing (SAST) continuously scan source code for SQL injection, remote code execution (RCE), cross-site scripting (XSS), and path traversal vulnerabilities. When developers merge branches without addressing security findings, critical flaws reach production deployments. This blueprint queries GitHub's Code Scanning API daily, aggregates unresolved Critical and High vulnerabilities, generates an automated GitHub AppSec tracking ticket with file locations and rule descriptions, and notifies security engineering teams via Slack.

    ## How it works

    1. `daily_code_scanning_audit` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit daily at 07:00 UTC (shipped disabled for safe verification).
    2. `probe_codeql_alerts` (`io.kestra.plugin.scripts.python.Script`) interrogates the GitHub Code Scanning API (`GET /repos/{owner}/{repo}/code-scanning/alerts`), filtering for open alerts with severity `critical` or `high`.
    3. `branch_on_security_findings` (`io.kestra.plugin.core.flow.If`) evaluates whether any critical or high alerts exist (`has_critical == true`):
       - `then`: Automatically files a GitHub tracking issue via `create_appsec_incident_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the Slack channel via `alert_appsec_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_repo_compliant`) confirming clean security posture.
    4. `log_audit_complete` (`io.kestra.plugin.core.log.Log`) records the final audit outcome.
    5. The `errors` block alerts Slack if GitHub API limits are reached or tokens expire.

    ## What you get

    - Automated, scheduled auditing of repository application security posture.
    - Zero ignored CodeQL alerts lingering across production microservice repos.
    - Consolidated GitHub incident tickets with rule IDs, source code paths, and lines.
    - Real-time Slack notifications with direct ticket hyperlinks.

    ## Who it's for

    - Application Security (AppSec) and DevSecOps Engineers governing repository code health.
    - Platform Engineering leads enforcing secure coding standards before production releases.
    - Software Development Managers tracking vulnerability resolution velocity.

    ## Why orchestrate this with Kestra

    Kestra coordinates external API polling, vulnerability data extraction, conditional escalation, and chat alerting inside a single declarative workflow. It manages personal access tokens securely, provides complete execution history, and eliminates the need for separate standalone monitoring daemons.

    ## Prerequisites

    - A GitHub repository with GitHub Code Scanning (CodeQL or third-party SARIF scanner) enabled.
    - A GitHub Personal Access Token or GitHub App token with `security_events:read` and `repo` permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub token used to query code scanning alerts and open tracking issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for security alerts.

    ## Inputs

    - `repository` (STRING, default `my-org/production-api`): Target GitHub repository (`owner/repo`) to audit.
    - `target_issue_repository` (STRING, default `my-org/appsec-operations`): Target repository where security tracking issues will be filed.

    ## Outputs

    - `outputs.probe_codeql_alerts.vars.critical_count`: Count of open critical-severity alerts.
    - `outputs.probe_codeql_alerts.vars.high_count`: Count of open high-severity alerts.
    - `outputs.probe_codeql_alerts.vars.total_alerts`: Total number of unresolved findings.

    ## Quick start

    1. Configure `GITHUB_TOKEN` and `SLACK_WEBHOOK` in your Kestra namespace.
    2. Import this flow and set `repository` to match an active scanned codebase.
    3. Run the flow manually to verify alert extraction and Slack notification delivery.
    4. Enable the `daily_code_scanning_audit` trigger for continuous code security monitoring.

    ## How to extend

    - Add an automated branch protection or deployment gate to block production merges if critical alerts remain open.
    - Integrate with Jira or ServiceNow to create enterprise vulnerability tickets.
    - Loop over all repositories in an organization using `io.kestra.plugin.core.flow.ForEach`.

    ## Links

    - [GitHub Code Scanning REST API Documentation](https://docs.github.com/en/rest/code-scanning/code-scanning)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Infrastructure
    - Core
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
