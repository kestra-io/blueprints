id: aws-transit-gateway-packet-drop-sentinel
namespace: company.netops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region where the Transit Gateway is deployed.
  - id: transit_gateway_id
    type: STRING
    defaults: tgw-0123456789abcdef0
    description: AWS Transit Gateway identifier to monitor.
  - id: max_packet_drops_threshold
    type: INT
    defaults: 100
    description: Maximum permissible dropped packets in a 15-minute window before alerting.

tasks:
  - id: query_tgw_packet_drops
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws cloudwatch get-metric-statistics           --namespace AWS/TransitGateway           --metric-name PacketDropCount           --dimensions Name=TransitGateway,Value="{{ inputs.transit_gateway_id }}"           --start-time $(date -u -v-15m +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "15 minutes ago" +%Y-%m-%dT%H:%M:%SZ)           --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ)           --period 900           --statistics Sum           --output json > tgw_drops.json
        python3 -c "
        import json
        with open('tgw_drops.json') as f:
            dps = json.load(f).get('Datapoints', [])
        total_drops = int(sum(dp.get('Sum', 0) for dp in dps))
        result = {
            'transit_gateway_id': '{{ inputs.transit_gateway_id }}',
            'packet_drop_count': total_drops,
            'alert_triggered': total_drops > {{ inputs.max_packet_drops_threshold }}
        }
        with open('tgw_summary.json', 'w') as out:
            json.dump(result, out)
        print('Transit Gateway audit:', result)
        "
    outputFiles:
      - tgw_summary.json

  - id: evaluate_packet_drops
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.query_tgw_packet_drops.outputFiles['tgw_summary.json'])).alert_triggered }}"
    then:
      - id: alert_network_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *AWS Transit Gateway Packet Drop Alert*: Transit Gateway `{{ inputs.transit_gateway_id }}` dropped {{ fromJson(read(outputs.query_tgw_packet_drops.outputFiles['tgw_summary.json'])).packet_drop_count }} packets in the last 15 minutes. Check route table associations, blackhole routes, or MTU mismatches."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *TGW Sentinel Failure*: Failed to query CloudWatch metrics for Transit Gateway `{{ inputs.transit_gateway_id }}`."
      }

triggers:
  - id: scheduled_tgw_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits AWS Transit Gateway CloudWatch metrics to detect packet drops caused by routing blackholes, MTU mismatches, and bandwidth throttling."
  metaTitle: AWS Transit Gateway Packet Drop Count Sentinel with Kestra
  title: AWS Transit Gateway Packet Drop Count Sentinel
  shortDescription: Audits AWS Transit Gateway CloudWatch metrics to detect packet drops caused by routing blackholes, MTU mismatches, and bandwidth throttling.
  description: |
    ## How it works
    This sentinel leverages `AwsCLI` to query CloudWatch for the `PacketDropCount` metric on the specified Transit Gateway over rolling 15-minute intervals. It alerts network engineering teams when packets are discarded due to unroutable destinations, blackhole routes, or bandwidth throttling across VPC attachments.

    ## What you get
    - Real-time detection of inter-VPC network routing anomalies.
    - Early warning before inter-service network communication fails silently.
    - Automated Slack delivery tracking Transit Gateway ID and total packet drop counts.

    ## Who it's for
    - Cloud network engineers and VPC architecture leads managing AWS Transit Gateways.
    - SREs troubleshooting cross-VPC latency and network packet loss.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled operational health checks with native error handling, secret injection, and multi-channel alerting.

    ## Prerequisites
    - AWS IAM credentials with `cloudwatch:GetMetricStatistics` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `transit_gateway_id`, `aws_region`, and credentials.
    3. Run manually to check current packet drop rates.

    ## How to extend
    - Query `BytesIn` and `BytesOut` concurrently to measure attachment utilization.
    - Inspect Transit Gateway route tables via `ec2:SearchTransitGatewayRoutes` to locate blackhole routes.
    - Forward network metrics to Datadog or Prometheus.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [Transit Gateway CloudWatch Metrics](https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-cloudwatch-metrics.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
