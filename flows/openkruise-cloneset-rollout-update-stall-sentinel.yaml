id: openkruise-cloneset-rollout-update-stall-sentinel
namespace: company.sre
description: 'Audits OpenKruise controller manager telemetry to detect CloneSet in-place
  rollout update stalls, partition revision mismatches, and failed pod updates.

  '
concurrency:
  limit: 1
inputs:
- id: openkruise_metrics_url
  type: STRING
  displayName: OpenKruise Metrics Service URL
  defaults: http://kruise-controller-manager.kruise-system.svc.cluster.local:8080
  description: Internal HTTP URL exposing Prometheus metrics for the OpenKruise controller
    manager.
- id: cloneset_name
  type: STRING
  displayName: CloneSet Workload Identifier
  defaults: production-api-cloneset
  description: Identifier of the target OpenKruise CloneSet workload under active
    rollout surveillance.
- id: max_update_stalls_threshold
  type: INT
  displayName: Max Update Stalls Threshold
  defaults: 2
  description: Maximum allowable CloneSet in-place pod update stalls before dispatching
    an incident alert.
- id: max_rollout_duration_seconds
  type: INT
  displayName: Max Rollout Duration (s)
  defaults: 600
  description: Maximum acceptable total duration in seconds for in-place or recreate
    rollout completion.
- id: alert_on_pod_update_failed
  type: BOOL
  displayName: Alert on Pod Update Failed
  defaults: true
  description: Toggle whether detected in-place container image update failures trigger
    an immediate notification.
tasks:
- id: scan_openkruise_telemetry
  type: io.kestra.plugin.scripts.python.Script
  description: Scrapes OpenKruise Prometheus metrics to audit CloneSet rollout progression,
    update stall counters, and pod revision status.
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
  - pip install requests kestra
  env:
    KRUISE_URL: '{{ inputs.openkruise_metrics_url }}'
    CLONESET_NAME: '{{ inputs.cloneset_name }}'
    MAX_STALLS: '{{ inputs.max_update_stalls_threshold }}'
    MAX_DURATION_S: '{{ inputs.max_rollout_duration_seconds }}'
    ALERT_FAILED: '{{ inputs.alert_on_pod_update_failed }}'
  script: "import os\nimport sys\nimport re\nimport requests\nfrom datetime import\
    \ datetime, timezone\nfrom kestra import Kestra\n\nbase_url = os.environ.get(\"\
    KRUISE_URL\", \"\").rstrip(\"/\")\ncloneset_name = os.environ.get(\"CLONESET_NAME\"\
    , \"production-api-cloneset\")\nmax_stalls = int(os.environ.get(\"MAX_STALLS\"\
    , \"2\"))\nmax_duration_s = int(os.environ.get(\"MAX_DURATION_S\", \"600\"))\n\
    alert_failed = os.environ.get(\"ALERT_FAILED\", \"true\").lower() == \"true\"\n\
    \ntry:\n    resp = requests.get(f\"{base_url}/metrics\", timeout=12)\n    resp.raise_for_status()\n\
    except Exception as err:\n    sys.stderr.write(f\"Failed to scrape OpenKruise\
    \ metrics from {base_url}/metrics: {err}\\n\")\n    sys.exit(1)\n\nupdate_stalls\
    \ = 0\nrollout_duration_s = 0\nfailed_updates = 0\nupdated_ready_pods = 0\ndegraded_workloads\
    \ = []\n\nfor line in resp.text.splitlines():\n    line = line.strip()\n    if\
    \ not line or line.startswith(\"#\"):\n        continue\n    match = re.search(r'([0-9.]+)\\\
    s*$', line)\n    if not match:\n        continue\n    val = float(match.group(1))\n\
    \    if \"kruise_cloneset_update_stalls_total\" in line:\n        update_stalls\
    \ += int(val)\n        if update_stalls > max_stalls:\n            degraded_workloads.append(cloneset_name)\n\
    \    elif \"kruise_cloneset_rollout_duration_seconds\" in line:\n        rollout_duration_s\
    \ = max(rollout_duration_s, int(val))\n    elif \"kruise_cloneset_pod_update_failures_total\"\
    \ in line:\n        failed_updates += int(val)\n    elif \"kruise_cloneset_updated_ready_pods\"\
    \ in line:\n        updated_ready_pods += int(val)\n\nis_breached = bool(\n  \
    \  (update_stalls > max_stalls) or\n    (rollout_duration_s > max_duration_s)\
    \ or\n    (alert_failed and failed_updates > 0)\n)\nnow_iso = datetime.now(timezone.utc).isoformat()\n\
    \nKestra.outputs({\n    \"update_stalls_count\": update_stalls,\n    \"rollout_duration_seconds\"\
    : rollout_duration_s,\n    \"failed_updates_count\": failed_updates,\n    \"updated_ready_pods_total\"\
    : updated_ready_pods,\n    \"degraded_workloads\": list(set(degraded_workloads)),\n\
    \    \"is_alerting\": is_breached,\n    \"cloneset_name\": cloneset_name,\n  \
    \  \"audit_timestamp\": now_iso\n})\n"
  containerImage: python:3.11-slim
- id: evaluate_openkruise_health
  type: io.kestra.plugin.core.flow.If
  description: Evaluates whether observed OpenKruise CloneSet update stalls, rollout
    duration, or pod update failures breach thresholds.
  condition: '{{ outputs.scan_openkruise_telemetry.vars.is_alerting }}'
  then:
  - id: notify_slack_workload_team
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-urgency incident notification to Workload SRE Slack
      channel detailing OpenKruise CloneSet rollout stalls.
    url: '{{ secret(''SLACK_WEBHOOK_URL'') }}'
    payload: "{\n  \"channel\": \"#workload-rollout-alerts\",\n  \"text\": \"CRITICAL:\
      \ OpenKruise CloneSet Rollout Stall on `{{ inputs.cloneset_name }}`. Update\
      \ Stalls: `{{ outputs.scan_openkruise_telemetry.vars.update_stalls_count }}`\
      \ (threshold: `{{ inputs.max_update_stalls_threshold }}`). Duration: `{{ outputs.scan_openkruise_telemetry.vars.rollout_duration_seconds\
      \ }}`s (threshold: `{{ inputs.max_rollout_duration_seconds }}`s). Failed Updates:\
      \ `{{ outputs.scan_openkruise_telemetry.vars.failed_updates_count }}`. Audit\
      \ Timestamp: `{{ outputs.scan_openkruise_telemetry.vars.audit_timestamp }}`.\"\
      \n}\n"
  else:
  - id: log_nominal_openkruise_state
    type: io.kestra.plugin.core.log.Log
    description: Records nominal telemetry when OpenKruise CloneSet in-place updates
      progress smoothly across partition revisions.
    message: 'OpenKruise CloneSet operating nominally: {{ outputs.scan_openkruise_telemetry.vars.update_stalls_count
      }} stalls, {{ outputs.scan_openkruise_telemetry.vars.rollout_duration_seconds
      }}s duration, {{ outputs.scan_openkruise_telemetry.vars.updated_ready_pods_total
      }} updated ready pods.'
- id: emit_audit_manifest
  type: io.kestra.plugin.core.debug.Return
  description: Emits structured audit manifest for advanced Kubernetes workload management
    and progressive delivery records.
  format: "{\n  \"status\": \"{{ outputs.scan_openkruise_telemetry.vars.is_alerting\
    \ ? 'ALERT' : 'NOMINAL' }}\",\n  \"cloneset_name\": \"{{ inputs.cloneset_name\
    \ }}\",\n  \"update_stalls\": {{ outputs.scan_openkruise_telemetry.vars.update_stalls_count\
    \ }},\n  \"rollout_duration_seconds\": {{ outputs.scan_openkruise_telemetry.vars.rollout_duration_seconds\
    \ }},\n  \"failed_updates\": {{ outputs.scan_openkruise_telemetry.vars.failed_updates_count\
    \ }},\n  \"updated_ready_pods\": {{ outputs.scan_openkruise_telemetry.vars.updated_ready_pods_total\
    \ }},\n  \"audit_timestamp\": \"{{ outputs.scan_openkruise_telemetry.vars.audit_timestamp\
    \ }}\"\n}\n"
triggers:
- id: periodic_openkruise_audit
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
extend:
  title: OpenKruise CloneSet Rollout Update Stall Sentinel
  metaTitle: OpenKruise CloneSet Rollout Sentinel Blueprint
  shortDescription: Audits OpenKruise CloneSet for in-place rollout update stalls,
    partition revision mismatches, and pod failures.
  metaDescription: Audits OpenKruise CloneSet telemetry to detect in-place rollout
    update stalls, partition revision mismatches, and pod failures.
  description: "Automates continuous health and progressive rollout surveillance for\
    \ OpenKruise CloneSet workloads in Kubernetes.\n\n## How it works\n1. A schedule\
    \ trigger executes the OpenKruise rollout audit workflow every 15 minutes.\n2.\
    \ The Python task queries the OpenKruise controller manager metrics endpoint on\
    \ port 8080.\n3. The script extracts CloneSet update stall counters, total rollout\
    \ durations, and failed pod update metrics.\n4. An evaluation gate determines\
    \ whether update stalls, duration limits, or pod failures breach operational bounds.\n\
    5. When progressive rollout stalls are detected, a high-priority Slack alert is\
    \ dispatched to the Workload SRE team.\n6. When in-place container updates complete\
    \ smoothly across all partitions, nominal telemetry is logged.\n7. A structured\
    \ JSON audit manifest is emitted for workload governance and progressive rollout\
    \ compliance records.\n\n## Architecture diagram\n```mermaid\ngraph TD\n    Trigger[Schedule\
    \ Trigger: 15m] --> ScanMetrics[Python Script: Scrape OpenKruise Metrics]\n  \
    \  ScanMetrics --> EvalBreach{Update Stalls > 2 OR Duration > 600s?}\n    EvalBreach\
    \ -- Yes --> SlackAlert[Slack: High-Urgency Workload Alert]\n    EvalBreach --\
    \ No --> LogNominal[Log: Nominal OpenKruise State]\n    SlackAlert --> EmitManifest[Debug\
    \ Return: Workload Audit Manifest]\n    LogNominal --> EmitManifest\n```\n\n##\
    \ Architecture components\n- **Trigger**: Automated schedule polling at 15-minute\
    \ recurring intervals.\n- **Script Task**: Scrapes OpenKruise controller manager\
    \ Prometheus metrics endpoints using Docker container runners.\n- **Decision Gate**:\
    \ Evaluates whether CloneSet update stalls or rollout durations exceed limits.\n\
    - **Notification Task**: Dispatches structured Slack alerts with CloneSet workload\
    \ name and stall metrics.\n- **Audit Manifest**: Emits JSON execution payloads\
    \ containing workload rollout health and timestamps.\n\n## Key capabilities\n\
    - Continuous surveillance of OpenKruise CloneSet in-place container image updates\
    \ and recreate rollout strategies.\n- Early warning detection for partition-based\
    \ rollout halts caused by readiness gate failures.\n- Automated tracking of in-place\
    \ update execution duration to prevent long-running deployment pipelines.\n- Zero\
    \ host dependency execution via isolated containerized Python runners.\n\n## What\
    \ you get\n- Real-time visibility into high-scale progressive workload rollout\
    \ progression and pod revision consistency.\n- Proactive alerts preventing stalled\
    \ application rollouts that leave clusters in mixed-version split states.\n- Standardized\
    \ audit manifests containing exact ready pod counts and rollout execution timestamps.\n\
    - Zero-overhead deployment compatible with GitOps deployment workflows driven\
    \ by ArgoCD and Helm.\n\n## Who it's for\n- Kubernetes platform SREs maintaining\
    \ large-scale microservice fleets running OpenKruise CloneSets.\n- Cloud native\
    \ application developers leveraging in-place container updates for fast zero-downtime\
    \ releases.\n- DevOps engineers configuring partition-based canary rollouts and\
    \ automated progressive delivery.\n- Enterprise platform architects standardizing\
    \ advanced workload controllers across multi-tenant clusters.\n\n## Why orchestrate\
    \ this with Kestra\n- **Serverless Docker Isolation**: Executes telemetry scraping\
    \ in ephemeral Docker environments without persistent workers.\n- **Centralized\
    \ Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace\
    \ secrets.\n- **Declarative YAML Workflows**: Manages progressive delivery surveillance\
    \ as versioned code in Git repositories.\n- **Comprehensive Audit History**: Preserves\
    \ historical rollout telemetry in searchable Kestra execution logs.\n\n## Use\
    \ cases\n- **In-Place Update Stall Detection**: Identifies when container image\
    \ downloads hang inside specific worker nodes.\n- **Readiness Gate Lock Prevention**:\
    \ Alerts engineers when custom pod readiness gates block partition progression.\n\
    - **Canary Partition Validation**: Verifies that canary partitions deploy and\
    \ stabilize before manual promotion steps.\n\n## Inputs\n| Name | Type | Default\
    \ | Description |\n| --- | --- | --- | --- |\n| `openkruise_metrics_url` | STRING\
    \ | `http://kruise-controller-manager.kruise-system.svc.cluster.local:8080` |\
    \ Internal HTTP URL exposing Prometheus metrics for OpenKruise. |\n| `cloneset_name`\
    \ | STRING | `production-api-cloneset` | Identifier of the target CloneSet workload.\
    \ |\n| `max_update_stalls_threshold` | INT | `2` | Maximum allowable update stalls\
    \ before raising an alert. |\n| `max_rollout_duration_seconds` | INT | `600` |\
    \ Maximum acceptable rollout duration in seconds. |\n| `alert_on_pod_update_failed`\
    \ | BOOL | `true` | Toggle whether pod update failures trigger an alert. |\n\n\
    ## Expected outputs\n- `{{ outputs.scan_openkruise_telemetry.vars.update_stalls_count\
    \ }}`: Count of CloneSet update progression stalls.\n- `{{ outputs.scan_openkruise_telemetry.vars.rollout_duration_seconds\
    \ }}`: Total duration of active rollout in seconds.\n- `{{ outputs.scan_openkruise_telemetry.vars.failed_updates_count\
    \ }}`: Count of failed in-place container updates.\n- `{{ outputs.scan_openkruise_telemetry.vars.is_alerting\
    \ }}`: Boolean flag indicating if workload rollout SLA is breached.\n- `{{ outputs.scan_openkruise_telemetry.vars.audit_timestamp\
    \ }}`: ISO-8601 UTC timestamp of the workload audit run.\n\n## Prerequisites\n\
    - OpenKruise 1.4+ deployed with Prometheus metrics enabled on port 8080.\n- Network\
    \ connectivity from the Kestra worker to the Kruise controller metrics service.\n\
    - Configured Slack incoming webhook URL with permissions to post in workload alert\
    \ channels.\n\n### Secrets\n- `SLACK_WEBHOOK_URL`: Secure webhook URL for routing\
    \ workload alerts to the Workload SRE Slack channel.\n\n## Quick start\n1. Verify\
    \ that OpenKruise controller manager exposes Prometheus metrics on HTTP port 8080.\n\
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.\n\
    3. Specify your workload name in `cloneset_name`.\n4. Run a manual flow execution\
    \ via the Kestra UI to validate metric ingestion.\n5. Enable the `periodic_openkruise_audit`\
    \ schedule trigger to establish automated monitoring.\n\n## Common pitfalls and\
    \ troubleshooting\n- **Readiness Gate Deadlocks**: If custom readiness gates never\
    \ transition to True, in-place updates halt indefinitely.\n- **Container Restart\
    \ Policies**: Ensure target container images support in-place restarts without\
    \ full pod recreation.\n- **Volume Mount Changes**: Modifying volume mounts requires\
    \ full pod recreation rather than in-place updating.\n- **Resource Quota Exhaustion**:\
    \ If surge pods are configured, ensure namespace resource quotas allow burst capacity.\n\
    \n## How to extend\n- **Automated Rollout Rollback**: Trigger an automated patch\
    \ to revert `spec.template` to the previous Revision.\n- **PagerDuty Escalation**:\
    \ Escalate to on-call platform engineers if rollout duration exceeds 30 minutes.\n\
    - **Multi-CloneSet Sweep**: Expand metric queries to monitor all CloneSet resources\
    \ across namespaces concurrently.\n\n## Links\n- [Kestra Python Script Plugin\
    \ Documentation](https://kestra.io/plugins/plugin-scripts-python)\n- [Kestra Slack\
    \ Plugin Documentation](https://kestra.io/plugins/plugin-slack)\n- [OpenKruise\
    \ Official Documentation](https://openkruise.io/)\n- [OpenKruise CloneSet Architecture\
    \ and In-Place Update Guide](https://openkruise.io/docs/user-manuals/cloneset)\n\
    - [Kubernetes Advanced Workload Management Overview](https://openkruise.io/docs/concepts)\n"
  tags:
  - Infrastructure
  - Cloud
  subTags:
  - Monitoring & Alerting
  - CI/CD & Deployment
  ee: false
  demo: false
outputs:
- id: update_stalls_count
  type: INT
  value: '{{ outputs.scan_openkruise_telemetry.vars.update_stalls_count }}'
- id: rollout_duration_seconds
  type: INT
  value: '{{ outputs.scan_openkruise_telemetry.vars.rollout_duration_seconds }}'
- id: failed_updates_count
  type: INT
  value: '{{ outputs.scan_openkruise_telemetry.vars.failed_updates_count }}'
- id: updated_ready_pods_total
  type: INT
  value: '{{ outputs.scan_openkruise_telemetry.vars.updated_ready_pods_total }}'
- id: is_alerting
  type: BOOLEAN
  value: '{{ outputs.scan_openkruise_telemetry.vars.is_alerting }}'
