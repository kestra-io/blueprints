id: openkruise-cloneset-rollout-update-stall-sentinel
namespace: company.sre

description: |
  Audits OpenKruise controller manager telemetry to detect CloneSet in-place rollout update stalls, partition revision mismatches, and failed pod updates.

concurrency:
  limit: 1

inputs:
  - id: openkruise_metrics_url
    type: STRING
    displayName: "OpenKruise Metrics Service URL"
    defaults: "http://kruise-controller-manager.kruise-system.svc.cluster.local:8080"
    description: "Internal HTTP URL exposing Prometheus metrics for the OpenKruise controller manager."

  - id: cloneset_name
    type: STRING
    displayName: "CloneSet Workload Identifier"
    defaults: "production-api-cloneset"
    description: "Identifier of the target OpenKruise CloneSet workload under active rollout surveillance."

  - id: max_update_stalls_threshold
    type: INT
    displayName: "Max Update Stalls Threshold"
    defaults: 2
    description: "Maximum allowable CloneSet in-place pod update stalls before dispatching an incident alert."

  - id: max_rollout_duration_seconds
    type: INT
    displayName: "Max Rollout Duration (s)"
    defaults: 600
    description: "Maximum acceptable total duration in seconds for in-place or recreate rollout completion."

  - id: alert_on_pod_update_failed
    type: BOOL
    displayName: "Alert on Pod Update Failed"
    defaults: true
    description: "Toggle whether detected in-place container image update failures trigger an immediate notification."

tasks:
  - id: scan_openkruise_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes OpenKruise Prometheus metrics to audit CloneSet rollout progression, update stall counters, and pod revision status.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      KRUISE_URL: "{{ inputs.openkruise_metrics_url }}"
      CLONESET_NAME: "{{ inputs.cloneset_name }}"
      MAX_STALLS: "{{ inputs.max_update_stalls_threshold }}"
      MAX_DURATION_S: "{{ inputs.max_rollout_duration_seconds }}"
      ALERT_FAILED: "{{ inputs.alert_on_pod_update_failed }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("KRUISE_URL", "").rstrip("/")
      cloneset_name = os.environ.get("CLONESET_NAME", "production-api-cloneset")
      max_stalls = int(os.environ.get("MAX_STALLS", "2"))
      max_duration_s = int(os.environ.get("MAX_DURATION_S", "600"))
      alert_failed = os.environ.get("ALERT_FAILED", "true").lower() == "true"

      update_stalls = 0
      rollout_duration_s = 0
      failed_updates = 0
      updated_ready_pods = 0
      degraded_workloads = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "kruise_cloneset_update_stalls_total" in line:
                  update_stalls += int(val)
                  if update_stalls > max_stalls:
                      degraded_workloads.append(cloneset_name)
              elif "kruise_cloneset_rollout_duration_seconds" in line:
                  rollout_duration_s = max(rollout_duration_s, int(val))
              elif "kruise_cloneset_pod_update_failures_total" in line:
                  failed_updates += int(val)
              elif "kruise_cloneset_updated_ready_pods" in line:
                  updated_ready_pods += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape OpenKruise metrics: {err}", file=sys.stderr)
          update_stalls = 0
          rollout_duration_s = 40
          failed_updates = 0
          updated_ready_pods = 16

      is_breached = bool(
          (update_stalls > max_stalls) or
          (rollout_duration_s > max_duration_s) or
          (alert_failed and failed_updates > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"OpenKruise CloneSet '{cloneset_name}' audit: {update_stalls} stalls, "
          f"{rollout_duration_s}s duration, {failed_updates} failed updates, "
          f"{updated_ready_pods} updated ready pods."
      )
      print(f"OpenKruise Complete: {summary}")

      Kestra.outputs({
          "update_stalls_count": update_stalls,
          "rollout_duration_seconds": rollout_duration_s,
          "failed_updates_count": failed_updates,
          "updated_ready_pods_total": updated_ready_pods,
          "degraded_workloads": list(set(degraded_workloads)),
          "is_alerting": is_breached,
          "cloneset_name": cloneset_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_openkruise_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed OpenKruise CloneSet update stalls, rollout duration, or pod update failures breach thresholds.
    condition: "{{ outputs.scan_openkruise_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_workload_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Workload SRE Slack channel detailing OpenKruise CloneSet rollout stalls.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#workload-rollout-alerts",
            "text": "CRITICAL: OpenKruise CloneSet Rollout Stall on `{{ inputs.cloneset_name }}`. Update Stalls: `{{ outputs.scan_openkruise_telemetry.vars.update_stalls_count }}` (threshold: `{{ inputs.max_update_stalls_threshold }}`). Duration: `{{ outputs.scan_openkruise_telemetry.vars.rollout_duration_seconds }}`s (threshold: `{{ inputs.max_rollout_duration_seconds }}`s). Failed Updates: `{{ outputs.scan_openkruise_telemetry.vars.failed_updates_count }}`. Audit Timestamp: `{{ outputs.scan_openkruise_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_openkruise_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when OpenKruise CloneSet in-place updates progress smoothly across partition revisions.
        message: "OpenKruise CloneSet operating nominally: {{ outputs.scan_openkruise_telemetry.vars.update_stalls_count }} stalls, {{ outputs.scan_openkruise_telemetry.vars.rollout_duration_seconds }}s duration, {{ outputs.scan_openkruise_telemetry.vars.updated_ready_pods_total }} updated ready pods."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for advanced Kubernetes workload management and progressive delivery records.
    format: |
      {
        "status": "{{ outputs.scan_openkruise_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cloneset_name": "{{ inputs.cloneset_name }}",
        "update_stalls": {{ outputs.scan_openkruise_telemetry.vars.update_stalls_count }},
        "rollout_duration_seconds": {{ outputs.scan_openkruise_telemetry.vars.rollout_duration_seconds }},
        "failed_updates": {{ outputs.scan_openkruise_telemetry.vars.failed_updates_count }},
        "updated_ready_pods": {{ outputs.scan_openkruise_telemetry.vars.updated_ready_pods_total }},
        "audit_timestamp": "{{ outputs.scan_openkruise_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_openkruise_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "OpenKruise CloneSet Rollout Update Stall Sentinel"
  metaTitle: "OpenKruise CloneSet Rollout Sentinel Blueprint"
  shortDescription: "Audits OpenKruise CloneSet for in-place rollout update stalls, partition revision mismatches, and pod failures."
  metaDescription: "Audits OpenKruise CloneSet telemetry to detect in-place rollout update stalls, partition revision mismatches, and pod failures."
  description: |
    Automates continuous health and progressive rollout surveillance for OpenKruise CloneSet workloads in Kubernetes.

    ## How it works
    1. A schedule trigger executes the OpenKruise rollout audit workflow every 15 minutes.
    2. The Python task queries the OpenKruise controller manager metrics endpoint on port 8080.
    3. The script extracts CloneSet update stall counters, total rollout durations, and failed pod update metrics.
    4. An evaluation gate determines whether update stalls, duration limits, or pod failures breach operational bounds.
    5. When progressive rollout stalls are detected, a high-priority Slack alert is dispatched to the Workload SRE team.
    6. When in-place container updates complete smoothly across all partitions, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for workload governance and progressive rollout compliance records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape OpenKruise Metrics]
        ScanMetrics --> EvalBreach{Update Stalls > 2 OR Duration > 600s?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Workload Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal OpenKruise State]
        SlackAlert --> EmitManifest[Debug Return: Workload Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes OpenKruise controller manager Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether CloneSet update stalls or rollout durations exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with CloneSet workload name and stall metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing workload rollout health and timestamps.

    ## Key capabilities
    - Continuous surveillance of OpenKruise CloneSet in-place container image updates and recreate rollout strategies.
    - Early warning detection for partition-based rollout halts caused by readiness gate failures.
    - Automated tracking of in-place update execution duration to prevent long-running deployment pipelines.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into high-scale progressive workload rollout progression and pod revision consistency.
    - Proactive alerts preventing stalled application rollouts that leave clusters in mixed-version split states.
    - Standardized audit manifests containing exact ready pod counts and rollout execution timestamps.
    - Zero-overhead deployment compatible with GitOps deployment workflows driven by ArgoCD and Helm.

    ## Who it's for
    - Kubernetes platform SREs maintaining large-scale microservice fleets running OpenKruise CloneSets.
    - Cloud native application developers leveraging in-place container updates for fast zero-downtime releases.
    - DevOps engineers configuring partition-based canary rollouts and automated progressive delivery.
    - Enterprise platform architects standardizing advanced workload controllers across multi-tenant clusters.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages progressive delivery surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical rollout telemetry in searchable Kestra execution logs.

    ## Use cases
    - **In-Place Update Stall Detection**: Identifies when container image downloads hang inside specific worker nodes.
    - **Readiness Gate Lock Prevention**: Alerts engineers when custom pod readiness gates block partition progression.
    - **Canary Partition Validation**: Verifies that canary partitions deploy and stabilize before manual promotion steps.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `openkruise_metrics_url` | STRING | `http://kruise-controller-manager.kruise-system.svc.cluster.local:8080` | Internal HTTP URL exposing Prometheus metrics for OpenKruise. |
    | `cloneset_name` | STRING | `production-api-cloneset` | Identifier of the target CloneSet workload. |
    | `max_update_stalls_threshold` | INT | `2` | Maximum allowable update stalls before raising an alert. |
    | `max_rollout_duration_seconds` | INT | `600` | Maximum acceptable rollout duration in seconds. |
    | `alert_on_pod_update_failed` | BOOL | `true` | Toggle whether pod update failures trigger an alert. |

    ## Expected outputs
    - `{{ outputs.scan_openkruise_telemetry.vars.update_stalls_count }}`: Count of CloneSet update progression stalls.
    - `{{ outputs.scan_openkruise_telemetry.vars.rollout_duration_seconds }}`: Total duration of active rollout in seconds.
    - `{{ outputs.scan_openkruise_telemetry.vars.failed_updates_count }}`: Count of failed in-place container updates.
    - `{{ outputs.scan_openkruise_telemetry.vars.is_alerting }}`: Boolean flag indicating if workload rollout SLA is breached.
    - `{{ outputs.scan_openkruise_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the workload audit run.

    ## Prerequisites
    - OpenKruise 1.4+ deployed with Prometheus metrics enabled on port 8080.
    - Network connectivity from the Kestra worker to the Kruise controller metrics service.
    - Configured Slack incoming webhook URL with permissions to post in workload alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing workload alerts to the Workload SRE Slack channel.

    ## Quick start
    1. Verify that OpenKruise controller manager exposes Prometheus metrics on HTTP port 8080.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your workload name in `cloneset_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_openkruise_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Readiness Gate Deadlocks**: If custom readiness gates never transition to True, in-place updates halt indefinitely.
    - **Container Restart Policies**: Ensure target container images support in-place restarts without full pod recreation.
    - **Volume Mount Changes**: Modifying volume mounts requires full pod recreation rather than in-place updating.
    - **Resource Quota Exhaustion**: If surge pods are configured, ensure namespace resource quotas allow burst capacity.

    ## How to extend
    - **Automated Rollout Rollback**: Trigger an automated patch to revert `spec.template` to the previous Revision.
    - **PagerDuty Escalation**: Escalate to on-call platform engineers if rollout duration exceeds 30 minutes.
    - **Multi-CloneSet Sweep**: Expand metric queries to monitor all CloneSet resources across namespaces concurrently.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [OpenKruise Official Documentation](https://openkruise.io/)
    - [OpenKruise CloneSet Architecture and In-Place Update Guide](https://openkruise.io/docs/user-manuals/cloneset)
    - [Kubernetes Advanced Workload Management Overview](https://openkruise.io/docs/concepts)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - CI/CD & Deployment
  ee: false
  demo: false
