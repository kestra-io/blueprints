    - [Azure Table Storage OData filter syntax documentation](https://learn.microsoft.com/en-us/visualstudio/azure/vs-azure-tools-table-designer-construct-filter-strings)
    - [Azurite emulator documentation](https://github.com/Azure/Azurite)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
