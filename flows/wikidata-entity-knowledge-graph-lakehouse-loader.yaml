id: wikidata-entity-knowledge-graph-lakehouse-loader
namespace: company.analytics
description: Ingests structured semantic knowledge entities, concepts, aliases, and encyclopedic claims from Wikimedia Wikidata into Parquet lakehouse storage via DuckDB, tracking entity identifiers in Kestra KV store.

inputs:
  - id: search_query
    type: STRING
    description: Semantic concept or entity to search across Wikidata.
    defaults: "Artificial Intelligence"

  - id: language
    type: STRING
    description: Natural language code for entity labels and descriptions.
    defaults: en

  - id: limit
    type: INT
    description: Maximum number of entity concept matches to extract.
    defaults: 20

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed Wikidata Q-identifiers.
    defaults: wikidata_monitored_entities_state

variables:
  default_state: "[]"

triggers:
  - id: monthly_knowledge_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 1 * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_entities
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import urllib.parse
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_qids = set(json.loads(raw_state)) if raw_state else set()
        except Exception:
            seen_qids = set()

        q = "{{ inputs.search_query }}"
        lang = "{{ inputs.language }}"
        limit = int("{{ inputs.limit }}")

        encoded_q = urllib.parse.quote(q)
        url = f"https://www.wikidata.org/w/api.php?action=wbsearchentities&search={encoded_q}&language={lang}&limit={limit}&format=json"
        headers = {"User-Agent": "KestraWikidataLakehouse/1.0 (knowledge-graph@kestra.io)"}

        records = []
        new_entities = []
        harvested_qids = []

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                results = data.get("search", [])
                for item in results:
                    qid = item.get("id", "")
                    label = item.get("label", "")
                    description = (item.get("description") or "")[:250]
                    aliases = ", ".join(item.get("aliases", []))[:200]
                    concept_url = item.get("concepturi", "")

                    is_new = qid not in seen_qids
                    harvested_qids.append(qid)

                    records.append({
                        "qid": qid,
                        "label": label,
                        "description": description,
                        "aliases": aliases,
                        "concept_uri": concept_url,
                        "language": lang,
                        "is_new_entity": is_new,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_new:
                        new_entities.append({"qid": qid, "label": label})
        except Exception as e:
            print(f"Error fetching Wikidata entities: {e}")

        with open("wikidata_entities.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE wikidata_concepts AS SELECT * FROM read_json_auto('wikidata_entities.json')")
            con.execute("COPY wikidata_concepts TO 'wikidata_entity_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY wikidata_concepts TO 'wikidata_entity_archive.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE wikidata_concepts (
                    qid VARCHAR,
                    label VARCHAR,
                    description VARCHAR,
                    aliases VARCHAR,
                    concept_uri VARCHAR,
                    language VARCHAR,
                    is_new_entity BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY wikidata_concepts TO 'wikidata_entity_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY wikidata_concepts TO 'wikidata_entity_archive.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_entities_count": len(records),
            "new_entities_count": len(new_entities),
            "new_entities": new_entities[:5],
            "updated_state": list(set(list(seen_qids) + harvested_qids))[:500]
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - wikidata_entity_archive.parquet
      - wikidata_entity_archive.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_entities.vars.updated_state | toJson }}"

  - id: check_new_entities
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_entities.vars.new_entities_count > 0 }}"
    then:
      - id: notify_new_entities
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "🌐 Wikidata Semantic Ingestion: Harvested {{ outputs.ingest_and_transform_entities.vars.new_entities_count }} new semantic knowledge entities matching '{{ inputs.search_query }}'."

outputs:
  - id: total_entities
    type: INT
    value: "{{ outputs.ingest_and_transform_entities.vars.total_entities_count }}"
  - id: new_entities_count
    type: INT
    value: "{{ outputs.ingest_and_transform_entities.vars.new_entities_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_entities.outputFiles['wikidata_entity_archive.parquet'] }}"

extend:
  title: Wikimedia Wikidata Entity Knowledge Graph Lakehouse Loader with DuckDB
  metaTitle: Wikidata Entity Knowledge Graph Lakehouse Loader | Kestra
  shortDescription: Ingests structured semantic knowledge entities, concepts, aliases, and encyclopedic claims from Wikimedia Wikidata into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Wikimedia Wikidata Action API for semantic entities and Q-identifiers, convert knowledge graphs into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, semantic harmonization, and analytical lakehouse persistence of structured
    knowledge entities, concept labels, encyclopedic descriptions, and Q-identifiers from Wikimedia Wikidata into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`wikidata_monitored_entities_state`) for previously verified Wikidata Q-identifiers.
    2. **Wikidata API Ingestion**: Queries the official Wikimedia Wikidata API (`wikidata.org/w/api.php?action=wbsearchentities`) across semantic concepts.
    3. **DuckDB Semantic Normalization**: Unpacks entity labels, multilingual descriptions, concept URIs, and aliases into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized knowledge graph records into columnar Parquet and CSV files for entity resolution, master data management, and knowledge graph embeddings.
    5. **New Entity Detection & State Commitment**: Detects newly registered concepts, logs discovery summaries, and commits state to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of global structured encyclopedic reference entities.
    - Columnar Parquet datasets queryable with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Knowledge Engineers and Semantic Web Data Scientists linking corporate ontologies.
    - Master Data Management (MDM) Architects enriching product and entity catalogs.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical entity states across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `www.wikidata.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting teams on newly linked knowledge entities.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set your `search_query` and `language` code.
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `monthly_knowledge_sync` schedule for automated monthly updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition monthly semantic knowledge graph tables.
    - Connect a SPARQL query task to extract relational graph edges between entities.

    ## Links

    - [Wikidata API Documentation](https://www.wikidata.org/wiki/Wikidata:Data_access)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
