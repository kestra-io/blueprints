id: ami-cleanup
namespace: company.finops

description: |
  Finds AMIs older than 180 days that no instance or launch template references,
  then deregisters them and deletes their EBS snapshots. Old AMIs are invisible
  storage waste — every snapshot bills per GB-month forever.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for stale AMIs.
  - id: max_age_days
    type: INT
    defaults: 180
    description: AMIs older than this many days are cleanup candidates (default 180).
  - id: cleanup_enabled
    type: BOOLEAN
    defaults: false
    description: When true, deregisters unused AMIs and deletes their snapshots. Default false = report only.

tasks:
  - id: check_amis
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit stale AMIs region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Find old AMIs not referenced by any instance or launch template, optionally deregister them.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            MAX_AGE={{ inputs.max_age_days }}
            DO_CLEANUP="{{ inputs.cleanup_enabled }}"
            CUTOFF=$(date -u -d "$MAX_AGE days ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Scanning AMIs older than $CUTOFF in $REGION (cleanup_enabled=$DO_CLEANUP)"
            aws ec2 describe-images --region "$REGION" --owners self \
              --query 'Images[].[ImageId,CreationDate,Name]' --output text > /tmp/amis.txt
            # AMI IDs referenced by running/stopped instances
            aws ec2 describe-instances --region "$REGION" \
              --query 'Reservations[].Instances[].ImageId' --output text | tr '\t' '\n' | sort -u > /tmp/used.txt
            # AMI IDs referenced by launch template versions
            > /tmp/lt_images.txt
            aws ec2 describe-launch-templates --region "$REGION" \
              --query 'LaunchTemplates[].LaunchTemplateId' --output text | tr '\t' '\n' > /tmp/lts.txt || true
            for LT in $(cat /tmp/lts.txt); do
              [ -z "$LT" ] && continue
              aws ec2 describe-launch-template-versions --region "$REGION" \
                --launch-template-id "$LT" --versions '$Latest' \
                --query 'LaunchTemplateVersions[].LaunchTemplateData.ImageId' \
                --output text 2>/dev/null >> /tmp/lt_images.txt || true
            done
            cat /tmp/used.txt /tmp/lt_images.txt 2>/dev/null | grep -v '^$' | sort -u > /tmp/referenced.txt
            STALE_COUNT=0
            STALE_LIST=""
            DEREG_COUNT=0
            while IFS="$(printf '\t')" read -r AMI_ID CREATED NAME; do
              [ -z "$AMI_ID" ] && continue
              if [[ "$CREATED" < "$CUTOFF" ]] && ! grep -qx "$AMI_ID" /tmp/referenced.txt 2>/dev/null; then
                SNAP=$(aws ec2 describe-images --region "$REGION" --image-ids "$AMI_ID" \
                  --query 'Images[0].BlockDeviceMappings[0].Ebs.SnapshotId' --output text 2>/dev/null)
                STALE_LIST="${STALE_LIST}${AMI_ID} (${NAME:-unnamed}, ${CREATED}), "
                STALE_COUNT=$((STALE_COUNT + 1))
                if [ "$DO_CLEANUP" = "true" ]; then
                  aws ec2 deregister-image --region "$REGION" --image-id "$AMI_ID"
                  if [ -n "$SNAP" ] && [ "$SNAP" != "None" ]; then
                    aws ec2 delete-snapshot --region "$REGION" --snapshot-id "$SNAP" || true
                  fi
                  DEREG_COUNT=$((DEREG_COUNT + 1))
                fi
              fi
            done < /tmp/amis.txt
            if [ "$STALE_COUNT" -gt 0 ]; then HAS_STALE=true; else HAS_STALE=false; fi
            echo "HAS_STALE=$HAS_STALE"
            echo "STALE_COUNT=$STALE_COUNT"
            echo "STALE_AMIS=$STALE_LIST"
            echo "DEREGISTERED=$DEREG_COUNT"
            echo "CLEANUP_MODE=$DO_CLEANUP"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report stale AMIs, stay quiet when the account is clean.
        condition: "{{ outputs.audit_region.vars.HAS_STALE == 'true' }}"
        then:
          - id: slack_stale
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":cd: AMI cleanup `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.STALE_COUNT }}* stale AMI(s) older than {{ inputs.max_age_days }} days, unreferenced by any instance or launch template.\n`{{ outputs.audit_region.vars.STALE_AMIS }}`\nCleanup mode: `{{ outputs.audit_region.vars.CLEANUP_MODE }}` (deregistered: {{ outputs.audit_region.vars.DEREGISTERED }}). Set `cleanup_enabled=true` to auto-deregister after review."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "No stale AMIs in {{ outputs.audit_region.vars.REGION_DONE }} — every self-owned AMI is either recent or still referenced."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:30 UTC. Shipped disabled; enable after your first manual run.
    cron: "30 2 * * 0"
    disabled: true

extend:
  title: AMI Cleanup
  metaTitle: Clean Up Stale AMIs and Snapshots | Kestra
  shortDescription: Find AMIs older than 180 days that no instance or launch template uses, deregister them, delete their snapshots, and report the reclaimed storage.
  metaDescription: Old AMIs bill snapshot storage forever. This flow finds unreferenced ones, deregisters them, and reports weekly.
  description: |
    Every AMI you ever built leaves an EBS snapshot behind, and that snapshot bills per GB-month until someone deletes it. Nobody deletes them — they accumulate across regions for years, invisible in the console. This blueprint finds the ones that are safe to remove and cleans them up.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:30 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists your self-owned AMIs and keeps only those older than `max_age_days` (default 180).
    4. Each candidate is checked against all EC2 instances and the latest version of every launch template — referenced AMIs are never touched.
    5. Unreferenced AMIs are deregistered and their root snapshots deleted when `cleanup_enabled` is true (default false, so the first run is always a safe report).
    6. An `If` task posts a Slack report with the stale AMI IDs, names, and ages.

    ## What you get

    - A weekly list of stale, unreferenced AMIs with names and creation dates as evidence.
    - Safe cleanup: instances and launch templates are checked before anything is deregistered.
    - Report-first default — nothing is deleted until you flip `cleanup_enabled`.
    - Multi-region coverage in one run.

    ## Who it's for

    Platform teams with years of Packer/Terraform history and anyone who has ever wondered why the snapshot bill never goes down.

    ## Why orchestrate this with Kestra

    AMI hygiene is a recurring chore that cron scripts do badly — no audit trail, no per-region fan-out, no safe defaults. As a Kestra flow the audit is scheduled, every deregistration is logged, the age threshold is an input, and the report lands in Slack where the team actually sees it.

    ## Prerequisites

    - AWS credentials with `ec2:DescribeImages`, `ec2:DescribeInstances`, `ec2:DescribeLaunchTemplates`, `ec2:DescribeLaunchTemplateVersions`, plus `ec2:DeregisterImage` and `ec2:DeleteSnapshot` when cleanup is enabled.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EC2 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EC2 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the stale-AMI report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions where you build AMIs.
    3. Run manually once with `cleanup_enabled=false` and review the report.
    4. Flip `cleanup_enabled=true` once you trust the candidate list, then enable the weekly trigger.

    ## How to extend

    - Also check Auto Scaling Group launch configurations for AMI references.
    - Copy the newest AMI per application tag before deregistering the rest.
    - Estimate reclaimed snapshot GB and dollars in the Slack report.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [Deregister AMI API](https://docs.aws.amazon.com/cli/latest/reference/ec2/deregister-image.html)
    - [EBS snapshot pricing](https://aws.amazon.com/ebs/pricing/)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
