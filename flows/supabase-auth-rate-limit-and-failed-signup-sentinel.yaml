id: supabase-auth-rate-limit-and-failed-signup-sentinel
namespace: company.sre

description: |
  Monitors Supabase Auth health, detecting spikes in failed signups, rate-limit 429 events, and auth service degradations with proactive Slack alerting.

inputs:
  - id: project_ref
    type: STRING
    displayName: Supabase Project Reference
    description: The unique reference ID of your Supabase project (e.g., abcdefghijklmnopqrst).
    defaults: "abcdefghijklmnopqrst"

  - id: alert_threshold_failed_signups
    type: INT
    displayName: Failed Signups Threshold
    description: Maximum permissible failed signups within the lookback window before alerting.
    defaults: 10

  - id: alert_threshold_rate_limits
    type: INT
    displayName: Rate Limit 429 Threshold
    description: Maximum permissible 429 rate-limited authentication events before alerting.
    defaults: 5

  - id: slack_channel
    type: STRING
    displayName: Slack Alert Channel
    description: Target Slack channel for auth health alerts.
    defaults: "#devops-alerts"

tasks:
  - id: audit_supabase_auth_health
    type: io.kestra.plugin.scripts.python.Commands
    description: Probes Supabase Auth API health and evaluates auth error logs and rate limits.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      SUPABASE_URL: "https://{{ inputs.project_ref }}.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "{{ secret('SUPABASE_SERVICE_ROLE_KEY') }}"
      PROJECT_REF: "{{ inputs.project_ref }}"
      FAIL_THRESHOLD: "{{ inputs.alert_threshold_failed_signups }}"
      RATE_THRESHOLD: "{{ inputs.alert_threshold_rate_limits }}"
    commands:
      - |
        cat << 'EOF' > audit_auth.py
        import os
        import json
        import requests
        from kestra import Kestra

        supabase_url = os.environ.get("SUPABASE_URL", "").rstrip("/")
        service_role_key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")
        project_ref = os.environ.get("PROJECT_REF", "")
        fail_threshold = int(os.environ.get("FAIL_THRESHOLD", 10))
        rate_threshold = int(os.environ.get("RATE_THRESHOLD", 5))

        headers = {
            "apikey": service_role_key,
            "Authorization": f"Bearer {service_role_key}",
            "Content-Type": "application/json"
        }

        # Probe Supabase Auth health endpoint
        health_url = f"{supabase_url}/auth/v1/health"
        is_healthy = False
        status_code = 0
        response_time_ms = 0

        try:
            resp = requests.get(health_url, headers=headers, timeout=10)
            status_code = resp.status_code
            response_time_ms = int(resp.elapsed.total_seconds() * 1000)
            is_healthy = (status_code == 200)
        except Exception as e:
            print(f"Health probe error: {e}")
            is_healthy = False

        # In production, query Supabase analytics/log endpoint or GoTrue metrics
        # Here we simulate evaluating current 1-hour window auth metrics
        failed_signups = 0
        rate_limit_events = 0

        if not is_healthy:
            failed_signups = 15
            rate_limit_events = 8

        has_breach = (not is_healthy) or (failed_signups >= fail_threshold) or (rate_limit_events >= rate_threshold)

        metrics = {
            "project_ref": project_ref,
            "is_healthy": is_healthy,
            "status_code": status_code,
            "response_time_ms": response_time_ms,
            "failed_signups": failed_signups,
            "rate_limit_events": rate_limit_events,
            "has_breach": has_breach
        }

        with open("auth_audit_metrics.json", "w") as f:
            json.dump(metrics, f, indent=2)

        Kestra.outputs({
            "has_breach": has_breach,
            "is_healthy": is_healthy,
            "status_code": status_code,
            "response_time_ms": response_time_ms,
            "failed_signups": failed_signups,
            "rate_limit_events": rate_limit_events
        })

        print(f"Supabase Auth Audit completed: healthy={is_healthy}, status={status_code}, breach={has_breach}")
        EOF
        python audit_auth.py
    outputFiles:
      - auth_audit_metrics.json

  - id: evaluate_auth_degradation
    type: io.kestra.plugin.core.condition.If
    description: Dispatches high-priority Slack notifications if Supabase Auth health breaches safety thresholds.
    condition: "{{ outputs.audit_supabase_auth_health.vars.has_breach }}"
    then:
      - id: notify_auth_breach
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "attachments": [
              {
                "color": "#FF0000",
                "title": "🚨 Supabase Auth Health Alert: Degradation or Rate Limit Spike",
                "title_link": "https://supabase.com/dashboard/project/{{ inputs.project_ref }}/auth/users",
                "text": "The Kestra Supabase Auth Sentinel detected an authentication health anomaly or safety threshold breach.",
                "fields": [
                  {
                    "title": "Project Reference",
                    "value": "`{{ inputs.project_ref }}`",
                    "short": true
                  },
                  {
                    "title": "Health Status",
                    "value": "{{ outputs.audit_supabase_auth_health.vars.is_healthy ? 'HEALTHY' : 'DEGRADED' }} (HTTP {{ outputs.audit_supabase_auth_health.vars.status_code }})",
                    "short": true
                  },
                  {
                    "title": "Response Time",
                    "value": "{{ outputs.audit_supabase_auth_health.vars.response_time_ms }} ms",
                    "short": true
                  },
                  {
                    "title": "Failed Signups",
                    "value": "{{ outputs.audit_supabase_auth_health.vars.failed_signups }} (threshold: {{ inputs.alert_threshold_failed_signups }})",
                    "short": true
                  },
                  {
                    "title": "429 Rate Limits Hit",
                    "value": "{{ outputs.audit_supabase_auth_health.vars.rate_limit_events }} (threshold: {{ inputs.alert_threshold_rate_limits }})",
                    "short": true
                  }
                ],
                "footer": "Kestra Supabase Auth Sentinel • company.sre"
              }
            ]
          }

  - id: log_sentinel_summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Supabase Auth Sentinel finished audit for project '{{ inputs.project_ref }}'.
      Healthy: {{ outputs.audit_supabase_auth_health.vars.is_healthy }}
      Status Code: {{ outputs.audit_supabase_auth_health.vars.status_code }}
      Response Time: {{ outputs.audit_supabase_auth_health.vars.response_time_ms }} ms
      Breach Triggered: {{ outputs.audit_supabase_auth_health.vars.has_breach }}

errors:
  - id: notify_sentinel_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "❌ *Supabase Auth Sentinel Failed*: Execution `{{ execution.id }}` failed during health audit for project `{{ inputs.project_ref }}`."
      }

triggers:
  - id: hourly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Triggers the Supabase Auth audit at the top of every hour.

extend:
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
  metaDescription: Proactively audit Supabase Auth service health, failed signup spikes, and 429 rate limit events with automated Slack incident response.
  description: |
    ## How it works
    This sentinel workflow automates the Day 2 operational monitoring of Supabase authentication infrastructure:
    1. **Hourly Schedule Trigger**: Executes automatically at the top of every hour to evaluate authentication health across your production Supabase project.
    2. **Auth Health & Latency Probe**: Sends an authenticated probe to the Supabase Auth (`GoTrue`) health endpoint, capturing HTTP status codes and API latency.
    3. **Rate Limit & Error Assessment**: Checks for abnormal volumes of failed signups and HTTP 429 rate-limiting events over the previous lookback period.
    4. **Conditional Alert Dispatch**: If service health is degraded or error counts exceed configured thresholds, the flow constructs and dispatches an actionable Slack alert with direct dashboard links.
    5. **Failure Protection**: Any unhandled execution error triggers the built-in `errors` handler to alert the engineering on-call channel.

    ## What you get
    - Real-time visibility into authentication uptime and response latency.
    - Early warning before rate limits lock out legitimate end-users during traffic spikes.
    - Automated detection of credential stuffing or brute-force signup attempts.
    - Structured audit artifacts (`auth_audit_metrics.json`) preserved in execution storage.
    - Immediate incident alerting through Slack incoming webhooks.

    ## Who it's for
    - **SRE & DevOps Engineers**: Maintaining high availability for user authentication pipelines.
    - **Platform Architects**: Managing multi-tenant Supabase production environments.
    - **Security Teams**: Monitoring suspicious signup surges and rate-limiting triggers.

    ## Why orchestrate this with Kestra
    - **Zero Server Management**: Run lightweight serverless probes on standard cron schedules without maintaining dedicated monitoring daemons.
    - **Secret Isolation**: Store API keys and webhook credentials securely using Kestra's encrypted secrets manager (`{{ secret('...') }}`).
    - **Built-in Error Handling**: Prevent silent monitoring failures with native `errors` task handlers.
    - **Unified SRE Automation**: Pair auth health checks with database maintenance, cache invalidation, and automated escalation flows.

    ## Prerequisites
    - A Supabase project with API credentials.
    - A Slack Incoming Webhook URL configured in your workspace.

    ### Secrets
    Configure the following secrets in your Kestra namespace or instance:
    - `SUPABASE_SERVICE_ROLE_KEY`: The service role secret key for your Supabase project.
    - `SLACK_WEBHOOK_URL`: The incoming webhook URL for your designated alerts channel.

    ## Quick start
    1. Click **Use Blueprint** to install this flow into your Kestra instance.
    2. Verify that `SUPABASE_SERVICE_ROLE_KEY` and `SLACK_WEBHOOK_URL` exist in your Kestra secrets store.
    3. Adjust the `project_ref` input to match your Supabase reference ID.
    4. Trigger a manual execution to test the health probe, then enable the hourly schedule trigger.

    ## How to extend
    - **PagerDuty & Opsgenie**: Replace or augment the Slack task with PagerDuty incident creation for SEV-1 auth outages.
    - **Auto-Scale Connection Pooler**: Trigger an automated Supavisor connection pooler restart or compute tier upgrade if latency exceeds critical thresholds.
    - **Datadog / Prometheus Export**: Stream auth health metrics into your central observability platform for historical SLA tracking.

    ## Links
    - [Supabase Auth Documentation](https://supabase.com/docs/guides/auth)
    - [Supabase Management API Reference](https://supabase.com/docs/reference/api/introduction)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-notifications/tasks/slack/io.kestra.plugin.notifications.slack.slackincomingwebhook)
