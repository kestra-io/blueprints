id: ace-music-mcp-contract-monitor
namespace: company.integrations
description: Detect changes to ACE Music tool discovery and archive the two public contracts for incident triage.

tasks:
  - id: registry
    type: io.kestra.plugin.core.http.Request
    uri: https://registry.modelcontextprotocol.io/v0.1/servers/io.github.AceDataCloud%2Fmcp-acemusic/versions/latest

  - id: card
    type: io.kestra.plugin.core.http.Request
    uri: https://acemusic.mcp.acedata.cloud/.well-known/mcp/server-card.json

  - id: registry_file
    type: io.kestra.plugin.core.storage.Write
    extension: .json
    content: "{{ outputs.registry.body }}"

  - id: card_file
    type: io.kestra.plugin.core.storage.Write
    extension: .json
    content: "{{ outputs.card.body }}"

  - id: snapshot
    type: io.kestra.plugin.compress.ArchiveCompress
    algorithm: ZIP
    from:
      registry.json: "{{ outputs.registry_file.uri }}"
      server-card.json: "{{ outputs.card_file.uri }}"

  - id: check_contract
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ (outputs.registry.body | jq('[.server.remotes[] | select(.type == "streamable-http") | .url] | index("https://acemusic.mcp.acedata.cloud/mcp") != null') | first) == false
      or (outputs.card.body | jq('[.tools[].name] | (index("acemusic_list_models") != null and index("acemusic_get_task") != null)') | first) == false }}
    then:
      - id: incompatible
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: The public ACE Music registry endpoint or required tool names changed. Compare the saved registry.json and server-card.json.

outputs:
  - id: snapshot_uri
    type: FILE
    value: "{{ outputs.snapshot.uri }}"

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "15 9 * * *"
    timezone: UTC

extend:
  title: Monitor the ACE Music MCP tool contract and archive evidence
  metaTitle: Monitor ACE Music MCP discovery in Kestra
  shortDescription: Check the published MCP endpoint and required tool names against the live ACE Music server card, saving both documents in a ZIP.
  metaDescription: Monitor ACE Music MCP discovery, detect missing tools or registry endpoint changes, and archive both public contracts for investigation.
  description: |
    ## How it works
    Agents that depend on a hosted tool may stop offering it when a publisher changes its name or transport. This flow checks two independent documents. It reads the latest ACE Music entry from the MCP Registry, then fetches the server card published by Ace Data Cloud. It saves the original documents before checking that the registry still advertises the expected Streamable HTTP endpoint and the server still advertises model discovery and retrieval of existing tasks.

    ## What you get
    Each successful run returns a ZIP with registry.json and server-card.json. If the interface check fails, the archive is still available from the snapshot task. A missing HTTP response fails at the relevant request, identifying the unavailable source.

    ## Who it's for
    Teams maintaining automations or agent configurations that rely on the ACE Music MCP service. The check is useful even in environments where agents have no permission to generate audio.

    ## Why orchestrate this with Kestra
    A recurring trigger, two network requests and retained outputs give operators a dated record on both sides of the integration. A failed condition can drive the same alerting and incident workflows as other scheduled jobs.

    ## Prerequisites
    Install the Kestra Compress plugin and allow outbound HTTPS to registry.modelcontextprotocol.io and acemusic.mcp.acedata.cloud.

    ### Secrets
    None. The flow reads public discovery metadata. It does not initialize an authenticated session or create a music task.

    ## Quick start
    1. Import the flow into an integration-monitoring namespace.
    2. Run it manually and download the snapshot output.
    3. Check both JSON files before enabling the daily schedule.

    ## How to extend
    Add a failure notification to an existing operations channel. To track another service, first identify its expected transport and the tool names your own workflows actually need. Comparing all tool names would also flag compatible additions.

    ## Links
    - [ACE Music MCP server](https://github.com/AceDataCloud/AceMusicMCP)
    - [MCP Registry](https://registry.modelcontextprotocol.io)
    - [Kestra Compress plugin](https://kestra.io/plugins/plugin-compress)
  tags:
    - AI
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
