id: ldap-dangling-group-member-cleanup-guard
namespace: company.team

description: |
  Find LDAP group entries whose member DNs point at user entries that no longer exist, then remove those dangling values with an LDIF delete and re-search to prove they are gone.

inputs:
  - id: dry_run
    type: BOOL
    defaults: true
    description: When true the flow only reports dangling member values and never writes to the directory.
  - id: auto_remediate
    type: BOOL
    defaults: false
    description: When true (and dry_run is false) the flow removes the dangling member values after approval.
  - id: ldap_host
    type: STRING
    defaults: ldap.example.com
    description: Hostname of the LDAP server.
  - id: ldap_port
    type: INT
    defaults: 389
    description: LDAP port.
  - id: bind_dn
    type: STRING
    defaults: cn=admin,dc=example,dc=org
    description: Bind DN with permission to search the tree and modify group entries.
  - id: ldap_password
    type: STRING
    defaults: "{{ secret('LDAP_PASSWORD') }}"
    description: Bind password. Defaults to the LDAP_PASSWORD secret.
  - id: base_dn
    type: STRING
    defaults: dc=example,dc=org
    description: Base DN the group search runs under.
  - id: group_filter
    type: STRING
    defaults: "(|(objectClass=groupOfNames)(objectClass=groupOfUniqueNames))"
    description: LDAP filter that selects the group entries to audit.
  - id: member_attribute
    type: SELECT
    values:
      - member
      - uniqueMember
    defaults: member
    description: Attribute holding the member DNs. member for groupOfNames, uniqueMember for groupOfUniqueNames.
  - id: resolve_base_dn
    type: STRING
    defaults: dc=example,dc=org
    description: Base DN of the existence search. A member DN outside this subtree is reported as out of scope and never removed, because this search could not have seen it.
  - id: resolve_filter
    type: STRING
    defaults: "(objectClass=*)"
    description: Filter of the existence search. Keep it wide enough to return every entry a group may legitimately reference.
  - id: protected_object_classes
    type: STRING
    defaults: groupOfNames,groupOfUniqueNames
    description: Comma separated object classes whose schema requires at least one member. A group carrying one of these is refused rather than emptied.
  - id: min_members_required
    type: INT
    defaults: 1
    description: Lowest member count a protected group may be left with. Removing values that would cross this floor is refused.
  - id: max_removals
    type: INT
    defaults: 200
    description: Ceiling on how many member values one run may remove. A larger count means the existence search is probably mis-scoped, so the run reports and refuses to write.

tasks:
  - id: detect_groups
    type: io.kestra.plugin.ldap.Search
    description: Read every group entry under the base DN with its object classes and its member values. The search writes the entries to an LDIF file.
    hostname: "{{ inputs.ldap_host }}"
    port: "{{ inputs.ldap_port }}"
    userDn: "{{ inputs.bind_dn }}"
    password: "{{ inputs.ldap_password }}"
    baseDn: "{{ inputs.base_dn }}"
    filter: "{{ inputs.group_filter }}"
    attributes:
      - cn
      - objectClass
      - member
      - uniqueMember

  - id: resolve_entries
    type: io.kestra.plugin.ldap.Search
    description: Read the DN of every entry under the resolve base. This is the existence universe the member DNs are checked against, so a member that resolves here is left alone.
    hostname: "{{ inputs.ldap_host }}"
    port: "{{ inputs.ldap_port }}"
    userDn: "{{ inputs.bind_dn }}"
    password: "{{ inputs.ldap_password }}"
    baseDn: "{{ inputs.resolve_base_dn }}"
    filter: "{{ inputs.resolve_filter }}"
    attributes:
      - objectClass

  - id: analyze
    type: io.kestra.plugin.scripts.python.Script
    description: >-
      Diff the member values of every group against the set of DNs that exist. A value that is in scope and does not resolve is dangling. A group whose schema needs a member is refused rather than emptied. The target list is emptied altogether when the existence search looks mis-scoped.
    containerImage: python:3.12-slim
    script: |
      import base64, json, re

      MEMBER_ATTR = "{{ inputs.member_attribute }}".strip().lower()
      RESOLVE_BASE = "{{ inputs.resolve_base_dn }}"
      PROTECTED = set(
          c.strip().lower()
          for c in "{{ inputs.protected_object_classes }}".split(",")
          if c.strip()
      )
      MIN_MEMBERS = {{ inputs.min_members_required }}
      MAX_REMOVALS = {{ inputs.max_removals }}


      def split_rdns(dn):
          out = []
          buf = ""
          esc = False
          for ch in dn:
              if esc:
                  buf += ch
                  esc = False
              elif ch == "\\":
                  buf += ch
                  esc = True
              elif ch == ",":
                  out.append(buf)
                  buf = ""
              else:
                  buf += ch
          out.append(buf)
          return out


      def norm(dn):
          return ",".join(p.strip() for p in split_rdns(dn)).lower()


      def parse_ldif(path):
          try:
              raw = open(path, "r", encoding="utf-8", errors="replace").read()
          except OSError:
              return []
          unfolded = re.sub(r"\n[ ]", "", raw)
          entries = []
          cur = None
          for line in unfolded.splitlines():
              if not line.strip():
                  if cur is not None:
                      entries.append(cur)
                  cur = None
                  continue
              if line.startswith("#") or ":" not in line:
                  continue
              key, _, val = line.partition(":")
              key = key.strip().lower()
              val = val.lstrip()
              if val.startswith(":"):
                  try:
                      val = base64.b64decode(val[1:].strip()).decode("utf-8", "replace")
                  except Exception:
                      continue
              elif val.startswith("<"):
                  continue
              if key == "version":
                  continue
              if key == "dn":
                  cur = {"dn": val, "attrs": {}}
                  continue
              if cur is None:
                  continue
              cur["attrs"].setdefault(key, []).append(val)
          if cur is not None:
              entries.append(cur)
          return entries


      groups = parse_ldif("groups.ldif")
      present = parse_ldif("entries.ldif")
      existing = set(norm(e["dn"]) for e in present)
      resolve_suffix = norm(RESOLVE_BASE)

      targets = []
      refused = []
      dangling_lines = []
      out_of_scope_lines = []
      dangling_total = 0
      out_of_scope_total = 0
      removable_total = 0
      affected = 0

      for g in groups:
          members = g["attrs"].get(MEMBER_ATTR, [])
          classes = set(c.strip().lower() for c in g["attrs"].get("objectclass", []))
          dangling = []
          out_of_scope = []
          for m in members:
              nm = norm(m)
              if not nm:
                  continue
              in_scope = nm == resolve_suffix or nm.endswith("," + resolve_suffix)
              if not in_scope:
                  out_of_scope.append(m)
              elif nm not in existing:
                  dangling.append(m)
          out_of_scope_total += len(out_of_scope)
          for m in out_of_scope:
              out_of_scope_lines.append(g["dn"] + " -> " + m)
          if not dangling:
              continue
          affected += 1
          dangling_total += len(dangling)
          for m in dangling:
              dangling_lines.append(g["dn"] + " -> " + m)
          remaining = len(members) - len(dangling)
          if classes & PROTECTED and remaining < MIN_MEMBERS:
              refused.append(
                  g["dn"]
                  + " (removing "
                  + str(len(dangling))
                  + " of "
                  + str(len(members))
                  + " would leave "
                  + str(remaining)
                  + ", schema floor is "
                  + str(MIN_MEMBERS)
                  + ")"
              )
              continue
          removable_total += len(dangling)
          targets.append(
              {"group_dn": g["dn"], "attr": MEMBER_ATTR, "dns": dangling}
          )

      abort = ""
      if len(existing) == 0:
          abort = "the existence search under " + RESOLVE_BASE + " returned no entries, so every member DN would look dangling"
      elif removable_total > MAX_REMOVALS:
          abort = (
              "removable values "
              + str(removable_total)
              + " exceed the max_removals ceiling "
              + str(MAX_REMOVALS)
          )
      if abort:
          targets = []
          removable_total = 0

      print(
          "SCAN groups={} resolved_entries={} affected_groups={} dangling={} removable={} refused={} out_of_scope={}".format(
              len(groups),
              len(existing),
              affected,
              dangling_total,
              removable_total,
              len(refused),
              out_of_scope_total,
          )
      )
      for line in dangling_lines:
          print("DANGLING " + line)
      for line in refused:
          print("REFUSED " + line)
      for line in out_of_scope_lines:
          print("OUT_OF_SCOPE " + line)
      if abort:
          print("ABORT " + abort)

      out = {
          "group_count": str(len(groups)),
          "resolved_count": str(len(existing)),
          "affected_groups": str(affected),
          "dangling_total": str(dangling_total),
          "removable_total": str(removable_total),
          "refused_count": str(len(refused)),
          "out_of_scope_total": str(out_of_scope_total),
          "has_targets": "yes" if targets else "no",
          "has_findings": "yes" if (dangling_total or refused or abort) else "no",
          "safe_to_write": "no" if abort else "yes",
          "abort_reason": abort,
          "dangling_dns": "; ".join(dangling_lines) if dangling_lines else "none",
          "refused_groups": "; ".join(refused) if refused else "none",
          "out_of_scope_dns": "; ".join(out_of_scope_lines) if out_of_scope_lines else "none",
          "targets_json": json.dumps(targets),
      }
      print("::" + json.dumps({"outputs": out}) + "::")
    inputFiles:
      groups.ldif: "{{ outputs.detect_groups.uri }}"
      entries.ldif: "{{ outputs.resolve_entries.uri }}"

  - id: findings_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.analyze.vars.has_findings == 'yes' }}"
    then:
      - id: log_findings
        type: io.kestra.plugin.core.log.Log
        message: "Dangling member values: {{ outputs.analyze.vars.dangling_total }} across {{ outputs.analyze.vars.affected_groups }} group(s). Removable: {{ outputs.analyze.vars.removable_total }}. Refused: {{ outputs.analyze.vars.refused_groups }}. Out of scope: {{ outputs.analyze.vars.out_of_scope_dns }}. Abort reason: {{ outputs.analyze.vars.abort_reason }}."
      - id: notify_findings
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the detection result to Slack so an operator sees the drift even on a read-only run.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "LDAP dangling group member guard: {{ outputs.analyze.vars.dangling_total }} member value(s) in {{ outputs.analyze.vars.affected_groups }} group(s) under {{ inputs.base_dn }} point at entries that do not exist. Removable now: {{ outputs.analyze.vars.removable_total }}. Refused on the schema floor: {{ outputs.analyze.vars.refused_groups }}. Dangling: {{ outputs.analyze.vars.dangling_dns }}. dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}."
          }

  - id: remediate_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.analyze.vars.has_targets == 'yes' and outputs.analyze.vars.safe_to_write == 'yes' }}"
    then:
      - id: approval_hold
        type: io.kestra.plugin.core.flow.Pause
        description: >-
          Removing a member value changes who is in a group, so the write waits for a human. Resume with approved set to true to apply the delete. Set it false to cancel.
        onResume:
          - id: approved
            type: BOOL
            required: false
            description: Set true to remove the dangling member values listed by the detection step.
      - id: apply_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.approval_hold.onResume.approved ?? false }}"
        then:
          - id: remediate_members
            type: io.kestra.plugin.core.flow.Loop
            description: Remediation loop. One LDIF delete per group, concurrencyLimit 1 so the modifies run in turn and never race on the same group entry.
            concurrencyLimit: 1
            values: "{{ outputs.analyze.vars.targets_json }}"
            tasks:
              - id: build_record
                type: io.kestra.plugin.scripts.python.Script
                description: Write the LDIF delete record for this group. Each dangling DN is listed under one delete of the member attribute, so resolving members are never named and never touched.
                containerImage: python:3.12-slim
                outputFiles:
                  - one.ldif
                script: |
                  import json

                  item = json.loads(r"""{{ item.value }}""")
                  lines = [
                      "dn: " + item["group_dn"],
                      "changetype: modify",
                      "delete: " + item["attr"],
                  ]
                  for dn in item["dns"]:
                      lines.append(item["attr"] + ": " + dn)
                  lines.append("-")
                  lines.append("")
                  open("one.ldif", "w", encoding="utf-8").write("\n".join(lines) + "\n")
                  print(
                      "LDIF delete {} value(s) from {}".format(
                          len(item["dns"]), item["group_dn"]
                      )
                  )
              - id: apply_record
                type: io.kestra.plugin.ldap.Modify
                description: Apply the LDIF delete. The plugin logs a rejected record and keeps going without failing, so allowFailure is set and the re-search below is the gate that decides the run.
                allowFailure: true
                hostname: "{{ inputs.ldap_host }}"
                port: "{{ inputs.ldap_port }}"
                userDn: "{{ inputs.bind_dn }}"
                password: "{{ inputs.ldap_password }}"
                inputs:
                  - "{{ outputs.build_record.outputFiles['one.ldif'] }}"
          - id: verify_groups
            type: io.kestra.plugin.ldap.Search
            description: Read the group entries again after the modifies.
            hostname: "{{ inputs.ldap_host }}"
            port: "{{ inputs.ldap_port }}"
            userDn: "{{ inputs.bind_dn }}"
            password: "{{ inputs.ldap_password }}"
            baseDn: "{{ inputs.base_dn }}"
            filter: "{{ inputs.group_filter }}"
            attributes:
              - cn
              - objectClass
              - member
              - uniqueMember
          - id: verify_entries
            type: io.kestra.plugin.ldap.Search
            description: Read the existence universe again, so a member created during the pause counts as resolving rather than as a failure.
            hostname: "{{ inputs.ldap_host }}"
            port: "{{ inputs.ldap_port }}"
            userDn: "{{ inputs.bind_dn }}"
            password: "{{ inputs.ldap_password }}"
            baseDn: "{{ inputs.resolve_base_dn }}"
            filter: "{{ inputs.resolve_filter }}"
            attributes:
              - objectClass
          - id: analyze_verify
            type: io.kestra.plugin.scripts.python.Script
            description: >-
              Re-run the same diff against the targeted groups only. Any targeted value still present means a modify was rejected, which the Modify task never reports, so this count is what the run is judged on.
            containerImage: python:3.12-slim
            script: |
              import base64, json, re

              MEMBER_ATTR = "{{ inputs.member_attribute }}".strip().lower()
              RESOLVE_BASE = "{{ inputs.resolve_base_dn }}"
              TARGETS = json.loads(r"""{{ outputs.analyze.vars.targets_json }}""")


              def split_rdns(dn):
                  out = []
                  buf = ""
                  esc = False
                  for ch in dn:
                      if esc:
                          buf += ch
                          esc = False
                      elif ch == "\\":
                          buf += ch
                          esc = True
                      elif ch == ",":
                          out.append(buf)
                          buf = ""
                      else:
                          buf += ch
                  out.append(buf)
                  return out


              def norm(dn):
                  return ",".join(p.strip() for p in split_rdns(dn)).lower()


              def parse_ldif(path):
                  try:
                      raw = open(path, "r", encoding="utf-8", errors="replace").read()
                  except OSError:
                      return []
                  unfolded = re.sub(r"\n[ ]", "", raw)
                  entries = []
                  cur = None
                  for line in unfolded.splitlines():
                      if not line.strip():
                          if cur is not None:
                              entries.append(cur)
                          cur = None
                          continue
                      if line.startswith("#") or ":" not in line:
                          continue
                      key, _, val = line.partition(":")
                      key = key.strip().lower()
                      val = val.lstrip()
                      if val.startswith(":"):
                          try:
                              val = base64.b64decode(val[1:].strip()).decode("utf-8", "replace")
                          except Exception:
                              continue
                      elif val.startswith("<"):
                          continue
                      if key == "version":
                          continue
                      if key == "dn":
                          cur = {"dn": val, "attrs": {}}
                          continue
                      if cur is None:
                          continue
                      cur["attrs"].setdefault(key, []).append(val)
                  if cur is not None:
                      entries.append(cur)
                  return entries


              groups = parse_ldif("groups.ldif")
              present = parse_ldif("entries.ldif")
              existing = set(norm(e["dn"]) for e in present)
              by_dn = {}
              for g in groups:
                  by_dn[norm(g["dn"])] = g

              wanted = {}
              for t in TARGETS:
                  wanted[norm(t["group_dn"])] = set(norm(d) for d in t["dns"])

              survivors = []
              removed = 0
              collateral = []
              for key, want in wanted.items():
                  g = by_dn.get(key)
                  if g is None:
                      survivors.append(key + " -> group entry missing from the re-search")
                      continue
                  live = [norm(m) for m in g["attrs"].get(MEMBER_ATTR, [])]
                  for dn in sorted(want):
                      if dn in live:
                          survivors.append(g["dn"] + " -> " + dn)
                      else:
                          removed += 1
                  for m in live:
                      if m in want:
                          continue
                      if m and m not in existing:
                          collateral.append(g["dn"] + " -> " + m)

              print(
                  "VERIFY targeted_groups={} removed_values={} still_present={} unresolved_left={}".format(
                      len(wanted), removed, len(survivors), len(collateral)
                  )
              )
              for line in survivors:
                  print("STILL_PRESENT " + line)
              for line in collateral:
                  print("STILL_UNRESOLVED " + line)
              out = {
                  "removed_values": str(removed),
                  "still_present": str(len(survivors)),
                  "has_survivors": "yes" if survivors else "no",
                  "survivor_dns": "; ".join(survivors) if survivors else "none",
                  "unresolved_left": "; ".join(collateral) if collateral else "none",
              }
              print("::" + json.dumps({"outputs": out}) + "::")
            inputFiles:
              groups.ldif: "{{ outputs.verify_groups.uri }}"
              entries.ldif: "{{ outputs.verify_entries.uri }}"
          - id: log_verify
            type: io.kestra.plugin.core.log.Log
            message: "Removed {{ outputs.analyze_verify.vars.removed_values }} dangling member value(s). Still present: {{ outputs.analyze_verify.vars.survivor_dns }}."
          - id: assert_clean
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.analyze_verify.vars.has_survivors == 'yes' }}"
            then:
              - id: still_dangling
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "The re-search still finds targeted member values that do not resolve: {{ outputs.analyze_verify.vars.survivor_dns }}. The Modify task does not fail on a rejected record, so this read is the only proof and it says the cleanup did not land."

triggers:
  - id: daily_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily audit. Disabled by default and pinned to safe mode so enabling it never writes without a deliberate change.
    cron: "0 5 * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert on any failure, including a run that failed because a targeted member value is still in the group after the modify.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "LDAP dangling group member cleanup guard FAILED (execution {{ execution.id }}). Group membership may still reference entries that do not exist. Check the directory and the run logs."
      }

extend:
  title: Remove LDAP Group Members Whose Entries No Longer Exist
  shortDescription: Diff every group's member DNs against the entries that actually exist, then delete the dangling values with an LDIF modify and re-search to prove they are gone.
  metaTitle: LDAP Dangling Group Member Cleanup Guard with Kestra
  metaDescription: Find LDAP group member DNs that no longer resolve, remove them with an LDIF delete, then re-search to confirm the cleanup landed.
  description: |
    A group entry stores membership as a list of DNs. Delete a user or move them to another OU and the DN in the group does not follow. LDAP has no referential integrity of its own, so nothing cleans the stale value up. Membership drifts away from reality: access reviews read the wrong roster, `groupOfNames` entries fill with junk, anything that resolves members to real people starts hitting errors. This blueprint finds those dangling values and removes them.

    ## Safety

    Two rules decide what this flow will not do.

    A `groupOfNames` entry needs at least one `member` by schema, so a group that would drop below the floor is refused, reported by name and left exactly as it was. The operator decides whether that group should be deleted, re-populated or kept. Removing the last member would be rejected by the server anyway. `io.kestra.plugin.ldap.Modify` does not fail the task on a rejected record, so an unguarded run would report success while changing nothing.

    A member DN outside the existence search's own subtree is reported as out of scope and never removed, because that search could not have seen it. If the existence search comes back empty or the removable count passes the `max_removals` ceiling, the run reports and refuses to write at all. Both cases mean the search is mis-scoped rather than the directory being broken.

    OpenLDAP can be configured with the `refint` overlay, which strips a reference when it sees the delete that broke it. That is worth having, but it is not a substitute for this audit. It does nothing for a DN that never resolved (an import or restore that loaded groups before users), nothing for changes made offline with `slapadd`, nothing on 389 Directory Server unless the referential integrity plugin is switched on. It also gives up on the last member of a group, because removing it would break the schema, which is the exact case this flow refuses and reports.

    ## How it works

    1. `detect_groups` (`io.kestra.plugin.ldap.Search`) reads every group entry under `base_dn` with its object classes and its member values, into an LDIF file.
    2. `resolve_entries` (`io.kestra.plugin.ldap.Search`) reads the DN of every entry under `resolve_base_dn`. That is the set of DNs that exist.
    3. `analyze` (`io.kestra.plugin.scripts.python.Script`) parses both LDIF files and diffs them. DN comparison is done on normalised DNs (case folded, RDN whitespace collapsed, escaped commas respected), so a case difference is not mistaken for a missing entry. Each member value comes out as resolving, dangling or out of scope. Groups are then split into targets and refusals on the schema floor. The target list is dropped entirely if the existence search looks mis-scoped.
    4. `findings_alert` (`io.kestra.plugin.core.flow.If`) logs the result and posts it to Slack whenever there is anything to report, so a read-only run still surfaces the drift.
    5. `remediate_gate` runs only when `auto_remediate` is true, `dry_run` is false, there is a target and the write is safe. It pauses for a human, then `remediate_members` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) builds one LDIF `delete` record per group and applies it with `io.kestra.plugin.ldap.Modify`.
    6. `verify_groups` and `verify_entries` re-read the directory and `analyze_verify` re-runs the diff over the targeted values only. `assert_clean` fails the run through `io.kestra.plugin.core.execution.Fail` if any targeted value is still in its group. The `errors` block then alerts Slack.

    The re-search is the gate on purpose. `ldap.Modify` logs a rejected record and carries on with a task state of success, so the task state proves nothing about whether the directory changed. Only reading the group again does.

    ## What you get

    - Every group member DN that points at an entry that does not exist, listed per group.
    - A read-only default. Nothing is written unless two inputs are flipped and a human approves.
    - Resolving members untouched: the LDIF names only the dangling values under a single `delete`, so a live member is never rewritten.
    - A refusal, by name, for any group whose schema would be violated by the cleanup.
    - A re-search that fails the run when a value is still there, which is the only way to catch a silently rejected modify.
    - A Slack alert on detection and a second alert on failure.

    ## Who it's for

    - Identity and IT teams on OpenLDAP or 389 Directory Server where users are deleted or moved between OUs.
    - Security teams running access reviews who need the group roster to match the people who exist.
    - Platform teams whose applications resolve group members at login and fail on a DN that is not there.

    ## Why orchestrate this with Kestra

    Doing this by hand means an `ldapsearch` for groups, an `ldapsearch` per member DN to see if it resolves, hand-written LDIF, `ldapmodify`, then another search to check. Kestra runs the whole sequence as one audited flow with the approval, the schema floor and the re-check built in. The read-only default and the disabled schedule make it safe to leave in a namespace.

    ## Tested end to end

    Run against OpenLDAP (`osixia/openldap:1.5.0`) on Kestra 2.0.5. Seed: five users under `ou=people` plus four groups under `ou=groups`. `app-admins` held two members that both resolve. `app-readers` held two resolving members plus the DNs of two deleted users. `legacy-batch` held nothing but the DN of a deleted user. `uniq-team` was a `groupOfUniqueNames` with one resolving and one deleted `uniqueMember`.

    A pass before the deletions reported `groups=4 resolved_entries=12 dangling=0`. After deleting two users the same pass reported `groups=4 resolved_entries=10 affected_groups=2 dangling=3 removable=2 refused=1`, naming both dangling DNs in `app-readers` and refusing `legacy-batch` because removing its one dangling member would leave zero. A `dry_run` pass left the member lists byte for byte identical under `ldapsearch`. A declined approval did the same. An approved pass removed exactly the two values from `app-readers`, left its two resolving members in place, left `app-admins` and the refused `legacy-batch` untouched, then the re-search reported `removed_values=2 still_present=0`.

    The gate was then proved on purpose. The same approved pass was run bound as an unprivileged account that can read the tree but not write it. The directory rejected the modify with `Insufficient access (50)`. The `io.kestra.plugin.ldap.Modify` task still finished in state `SUCCESS`, then the re-search caught it: `removed_values=0 still_present=1`, the run FAILED on `assert_clean` and the `errors` block posted to Slack. A bad bind password failed the first search with result code 49 and fired the same alert.

    ## Prerequisites

    An LDAP directory reachable from Kestra and a bind account allowed to search the tree and modify group entries.

    ### Secrets

    - `LDAP_PASSWORD`: bind password for the account named in `bind_dn`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the findings and failure alerts.

    ### Inputs

    - `dry_run` (default true) and `auto_remediate` (default false): both guard every write.
    - `ldap_host`, `ldap_port`, `bind_dn`, `base_dn`: connection and group search scope.
    - `group_filter` and `member_attribute`: which entries count as groups and which attribute holds the DNs.
    - `resolve_base_dn` and `resolve_filter`: the existence search. A member outside this subtree is never removed.
    - `protected_object_classes` and `min_members_required`: the schema floor that refuses a group instead of emptying it.
    - `max_removals` (default 200): ceiling on removals per run.

    ## Quick start

    1. Add the `LDAP_PASSWORD` and `SLACK_WEBHOOK_URL` secrets to your namespace.
    2. Run with the defaults. The flow reports dangling member values and writes nothing.
    3. Read the report. Confirm the refused groups and anything marked out of scope are what you expect.
    4. Run again with `dry_run` false and `auto_remediate` true, then approve the pause to remove the values.
    5. Enable the schedule once you trust the report. It stays read-only until you change its inputs.

    ## How to extend

    - Point `base_dn` at one OU of groups and `resolve_base_dn` at the whole tree, so scoping the audit never makes a member look missing.
    - Set `member_attribute` to `uniqueMember` for `groupOfUniqueNames` entries. Run the flow once per attribute if your directory uses both.
    - Add your own attribute to the `attributes` list on both search tasks for a custom membership schema.
    - Lower `max_removals` in a large directory so a mis-scoped search can never remove more than you would review by hand.
    - Add a step that writes the removed values to an archive entry before the delete, for an audit trail outside the Kestra logs.

