id: argocd-repo-server-cache-headroom-sentinel
namespace: company.gitops

inputs:
  - id: argocd_metrics_url
    type: STRING
    defaults: "http://argocd-repo-server.internal:8084"
    description: Base URL of the Argo CD Repo Server Prometheus metrics endpoint.

tasks:
  - id: inspect_repo_server_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Argo CD repo server Prometheus metrics
        curl -s "{{ inputs.argocd_metrics_url }}/metrics" > /tmp/argocd_metrics.txt

        python3 -c "
        try:
            with open('/tmp/argocd_metrics.txt') as f:
                lines = f.readlines()
            pending_manifests = 0.0
            git_err = 0.0
            for line in lines:
                if line.startswith('argocd_repo_server_pending_manifest_requests'):
                    val = line.strip().split()[-1]
                    pending_manifests = float(val)
                elif 'argocd_git_request_total' in line and 'status_code=\"5' in line:
                    val = line.strip().split()[-1]
                    git_err += float(val)
            is_breach = 1 if pending_manifests > 10 or git_err > 0 else 0
            print(f'{is_breach}|{int(pending_manifests)}|{int(git_err)}')
        except Exception:
            print('0|0|0')
        " > /tmp/argocd_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/argocd_summary.txt)
        PENDING_REQ=$(cut -d '|' -f 2 /tmp/argocd_summary.txt)
        GIT_ERRORS=$(cut -d '|' -f 3 /tmp/argocd_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=pending_req::$PENDING_REQ::"
        echo "::set-output name=git_errors::$GIT_ERRORS::"

  - id: evaluate_repo_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_repo_server_metrics.vars.is_breach | int == 1 }}"
    then:
      - id: notify_gitops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#gitops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Argo CD Repo Server Manifest Generation Bottleneck",
                "text": "Argo CD Repo Server at {{ inputs.argocd_metrics_url }} has {{ outputs.inspect_repo_server_metrics.vars.pending_req }} pending manifest requests and {{ outputs.inspect_repo_server_metrics.vars.git_errors }} Git errors. Helm/Kustomize manifest rendering is throttled, blocking cluster synchronization.",
                "footer": "Kestra GitOps Sentinel • Argo CD"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#gitops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Argo CD Repo Server Sentinel Failure",
            "text": "Failed to query Prometheus metrics on Argo CD Repo Server at {{ inputs.argocd_metrics_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: Argo CD Repo Server Manifest Generation Lock Sentinel
  shortDescription: Audits Argo CD Repo Server metrics to detect Git clone lock contention and Helm rendering delays.
  description: |
    ## How it works
    This workflow connects to the Argo CD Repo Server Prometheus metrics endpoint (`/metrics`) to audit manifest generation latency and Git checkout lock contention. The repo-server clones remote Git repositories and executes `helm template` or `kustomize build` to render Kubernetes manifests. When multiple applications share large mono-repos, concurrent Git operations saturate disk I/O and CPU, resulting in a surge of pending manifest requests. This sentinel tracks pending request queues and Git checkout errors, dispatching an alert before continuous deployment queues stall.

    ## What you get
    - Real-time tracking of Argo CD manifest generation request queues.
    - Early warning before cluster synchronization stalls and deployments block.
    - Automated Slack incident notifications detailing pending request counts.

    ## Who it's for
    - GitOps Platform Engineers maintaining large-scale Argo CD deployments.
    - Kubernetes Cluster Administrators managing continuous delivery pipelines.
    - SREs safeguarding application deployment cadences.

    ## Why orchestrate this with Kestra
    - **Automated Metric Surveillance**: Periodically inspects internal component metrics without deploying Prometheus exporters.
    - **Native Command Execution**: Queries standard HTTP endpoints directly from ephemeral runners.
    - **Incident Orchestration**: Notifies platform engineers directly in team collaboration channels.

    ## Prerequisites
    - Argo CD Repo Server with accessible metrics port (`8084`).
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK` secret to your namespace.
    3. Specify `argocd_metrics_url`.
    4. Enable the schedule trigger for continuous repo-server surveillance.

    ## How to extend
    - Automatically scale the `argocd-repo-server` Kubernetes deployment replica count.
    - Audit Git cache hit ratios via `argocd_git_request_duration_seconds`.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [Argo CD Metrics Reference](https://argo-cd.readthedocs.io/en/stable/operator-manual/metrics/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
