id: publicrecords-grants-gov-scraper
namespace: company.team

inputs:
  - id: max_items
    type: INT
    displayName: Max items
    defaults: 50

tasks:
  - id: run_actor
    type: io.kestra.plugin.apify.actor.Run
    actorId: publicrecords/grants-gov-scraper
    apiToken: "{{ secret('APIFY_API_TOKEN') }}"
    maxItems: "{{ inputs.max_items }}"
    maxTotalChargeUsd: 5
    input:
      status: "posted"
      maxItems: 50

  - id: get_dataset
    type: io.kestra.plugin.apify.dataset.Get
    apiToken: "{{ secret('APIFY_API_TOKEN') }}"
    datasetId: "{{ outputs.run_actor.defaultDatasetId }}"

extend:
  title: Pull open US federal grants from Grants.gov
  metaTitle: Pull open US federal grants from Grants.gov with Kestra
  shortDescription: Run publicrecords/grants-gov-scraper on a schedule and fetch the open-grants dataset.
  description: |
    Run the **Public Records** Apify Actor `grants-gov-scraper` on a schedule, using **your** Apify API token stored as the Kestra secret `APIFY_API_TOKEN`. Usage is billed to your Apify account (free tier available).

    Store page: https://apify.com/publicrecords/grants-gov-scraper

    Disclosure: Public Records maintains this Actor.
  tags:
    - Data
  subTags:
    - Public data
  ee: false
  demo: false
  metaDescription: Schedule the Public Records Grants.gov Apify Actor and fetch open US federal grant notices into Kestra.
