    - [Kestra Streamable HTTP MCP client tool](https://kestra.io/plugins/plugin-ai/tool/io.kestra.plugin.ai.tool.streamablehttpmcpclient)
    - [Kestra OpenAI provider](https://kestra.io/plugins/plugin-ai/provider/io.kestra.plugin.ai.provider.openai)
    - [Kestra KV store](https://kestra.io/docs/concepts/kv-store)
    - [Kestra Slack incoming webhook](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Bowmark documentation](https://bowmark.ai/docs)
  tags:
    - AI
  subTags:
    - Agents & Structured Output
    - Monitoring & Alerting
  ee: false
  demo: false
