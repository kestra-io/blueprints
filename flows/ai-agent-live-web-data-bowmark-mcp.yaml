id: ai-agent-live-web-data-bowmark-mcp
namespace: company.ai

inputs:
  - id: watch_question
    type: STRING
    defaults: What are the top 5 stories on the Hacker News front page right now, with their points?
    description: The question the agent answers from live websites on every run.

tasks:
  - id: research
    type: io.kestra.plugin.ai.agent.AIAgent
    description: Answers the question from live websites through the Bowmark MCP server and returns structured JSON.
    provider:
      type: io.kestra.plugin.ai.provider.OpenAI
      apiKey: "{{ secret('OPENAI_API_KEY') }}"
      modelName: gpt-4.1-mini
    configuration:
      temperature: 0.1
      responseFormat:
        type: JSON
        jsonSchema:
          type: object
          required: [summary, changed, findings]
          properties:
            summary:
              type: string
            changed:
              type: boolean
            findings:
              type: array
              items:
                type: object
                required: [site, detail, source_url]
                properties:
                  site: {type: string}
                  detail: {type: string}
                  source_url: {type: string}
    systemMessage: |
      Use the Bowmark tools to read the live websites the question names. Call get_library for each
      site first, then run a script that calls only the functions it returned. Never guess a value.
      Set "changed" to true only if a finding differs from this previous summary:
      {{ kv('bowmark_watch_last_summary', errorOnMissing=false) ?? 'none yet' }}
    prompt: "{{ inputs.watch_question }}"
    tools:
      - type: io.kestra.plugin.ai.tool.StreamableHttpMcpClient
        url: https://api.bowmark.ai/mcp
        headers:
          Authorization: "Bearer {{ secret('BOWMARK_API_KEY') }}"

  - id: store_summary
    type: io.kestra.plugin.core.kv.Set
    key: bowmark_watch_last_summary
    value: "{{ outputs.research.jsonOutput.summary }}"

  - id: notify_if_changed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.research.jsonOutput.changed }}"
    then:
      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: "Web watch changed: {{ outputs.research.jsonOutput.summary }}"
    else:
      - id: no_change
        type: io.kestra.plugin.core.log.Log
        message: No change since the last run.

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    disabled: true

extend:
  title: Watch Live Websites with an AI Agent and the Bowmark MCP Server
  metaTitle: AI Agent Live Web Data Watch with Bowmark MCP | Kestra
  shortDescription: Ask an AI agent a question about live websites every morning, get a typed JSON answer through the Bowmark MCP server, and post to Slack only when the answer changed.
  metaDescription: Daily AI agent that reads live websites through the Bowmark MCP server, stores the last answer in KV and alerts Slack only on change.
  description: |
    Most agent blueprints answer from a model's memory or from a search snippet. This flow answers from the website itself, as it looks right now. The AI agent connects to the remote Bowmark MCP server, looks up the typed functions Bowmark has for the sites the question names (Hacker News, Reddit, GitHub, YouTube, Amazon and many more), runs them, and returns structured JSON. Kestra keeps yesterday's answer in the KV store and only notifies Slack when something actually changed, so a daily watch stays quiet until there is news.

    ## How it works

    1. `daily` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 8 * * *`) runs the watch every morning. It ships disabled: enable it after one manual run succeeds.
    2. `research` (`io.kestra.plugin.ai.agent.AIAgent`) receives the `watch_question` input. Its only tool is `io.kestra.plugin.ai.tool.StreamableHttpMcpClient` pointed at `https://api.bowmark.ai/mcp` with a Bearer key. The system message tells the model to call `get_library` for each site first and then `run` a short script that calls only the functions the library returned, which keeps the agent from guessing an API that does not exist. The agent also sees the previous summary read from KV, and returns JSON matching the `responseFormat` schema: `summary`, `changed` and a list of `findings` with the site, the detail and a source URL.
    3. `store_summary` (`io.kestra.plugin.core.kv.Set`) saves `outputs.research.jsonOutput.summary` under `bowmark_watch_last_summary`, so the next run compares against it.
    4. `notify_if_changed` (`io.kestra.plugin.core.flow.If`) posts the new summary to Slack through `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` when `changed` is true, and logs "No change since the last run." otherwise.

    ## What you get

    - A typed answer from live sites on a schedule: JSON with a summary, a changed flag and per-site findings with source URLs, ready for a downstream task.
    - Quiet by default: Slack hears about a run only when the answer differs from the stored one.
    - No scraper to maintain: the agent calls Bowmark's tested site functions over MCP instead of hand-written selectors.
    - A full execution history in Kestra showing each question, each tool call and each answer.

    ## Who it's for

    - AI practitioners building agents that need current facts from websites rather than training data.
    - Growth, product and research teams watching competitors, launches, prices, threads or repositories.
    - Platform teams who want MCP tool use inside a scheduled, audited workflow instead of a chat window.

    ## Why orchestrate this with Kestra

    A cron job calling an agent from a laptop has no memory between runs, no secret masking and no record of what the model did. Kestra gives the watch a schedule, secrets kept out of the YAML, a KV store for the last answer, a conditional branch that separates the alert from the all clear, and an execution timeline where every tool call can be inspected. Changing the question or the schedule is a one-line edit in a versioned file.

    ## Prerequisites

    - Kestra 2.0 or later with the AI and Slack plugins (both included in the standard image).
    - A Bowmark API key from https://bowmark.ai (new accounts include a free $10 of usage).
    - An OpenAI API key, or swap the provider for any other `io.kestra.plugin.ai.provider` you already use.
    - A Slack incoming webhook for change alerts.

    ### Secrets

    - `BOWMARK_API_KEY`: Bearer key the MCP client sends to `https://api.bowmark.ai/mcp` (required).
    - `OPENAI_API_KEY`: key for the model that drives the agent (required).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for change alerts (required for the alert branch).

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Import this blueprint and click **Execute** with the default question about the Hacker News front page.
    3. Open the `research` task outputs and confirm `jsonOutput` holds a summary and findings with Hacker News URLs. The first run always reports `changed: true` and posts to Slack.
    4. Change `watch_question` to the sites you care about, run it once more, then enable the `daily` trigger.

    ## How to extend

    - Watch several questions at once by wrapping `research` in a `ForEach` over a list input.
    - Write `findings` to a database or a data warehouse table to keep a history, not just the last summary.
    - Route alerts to email, Teams or PagerDuty by swapping the Slack task.
    - Add a second agent that drafts a reply or a ticket from the findings when `changed` is true.

    ## Links

