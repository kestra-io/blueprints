id: memcached-eviction-rate-and-memory-limit-sentinel
namespace: company.sre

description: |
  Audits Memcached slab allocation and key eviction rate to catch memory limits and cache thrashing before database hit rates plummet.

concurrency:
  limit: 1

inputs:
  - id: memcached_host
    type: STRING
    displayName: "Memcached Host"
    defaults: "memcached.internal"
    description: "Hostname for Memcached daemon."
  - id: memcached_port
    type: INT
    displayName: "Memcached Port"
    defaults: 11211
    description: "TCP port for Memcached."

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: alpine:3.19
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      MEM_HOST: "{{ inputs.memcached_host }}"
      MEM_PORT: "{{ inputs.memcached_port }}"
    commands:
      - |
        apk add --no-cache nc jq >/dev/null 2>&1
        STATS=$(echo "stats" | nc -w 3 "$MEM_HOST" "$MEM_PORT")
        if [ -z "$STATS" ]; then echo "Memcached probe failed" >&2; exit 1; fi
        EVICTIONS=$(echo "$STATS" | grep "STAT evictions " | awk '{print $3}' | tr -d '\r')
        BYTES=$(echo "$STATS" | grep "STAT bytes " | awk '{print $3}' | tr -d '\r')
        LIMIT_MAXBYTES=$(echo "$STATS" | grep "STAT limit_maxbytes " | awk '{print $3}' | tr -d '\r')
        PCT=0
        if [ -n "$LIMIT_MAXBYTES" ] && [ "$LIMIT_MAXBYTES" -gt 0 ]; then
          PCT=$(( BYTES * 100 / LIMIT_MAXBYTES ))
        fi
        IS_ALERT=false
        if [ "$PCT" -gt 90 ] || [ "$EVICTIONS" -gt 1000 ]; then IS_ALERT=true; fi
        cat <<JSON > output.json
        {"evictions": $EVICTIONS, "memory_used_pct": $PCT, "is_alert": $IS_ALERT}
        JSON
    outputFiles:
      - output.json

  - id: evaluate_threshold
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).is_alert }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "text": "🚨 *Memcached Eviction Alert: `{{ inputs.memcached_host }}`*\n- *Memory Used*: `{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).memory_used_pct }}%`\n- *Evictions*: `{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).evictions }}`"
          }

errors:
  - id: notify_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "text": "❌ *Sentinel probe execution failed for memcached-eviction-rate-and-memory-limit-sentinel*"
      }

extend:
  title: Memcached slab memory eviction velocity sentinel
  shortDescription: Audits Memcached slab allocation and key eviction rate to catch memory limits and cache thrashing before database hit rates plummet.
  description: |
    Audits Memcached slab allocation and key eviction rate to catch memory limits and cache thrashing before database hit rates plummet.

    ## How it works
    1. A schedule trigger or manual execution connects to the target infrastructure service endpoint.
    2. Runs diagnostic status queries inside an isolated container runner to extract health telemetry.
    3. Evaluates health metrics against defined thresholds to flag operational anomalies.
    4. Dispatches actionable alerts to Slack with resource metrics and remediation guidance.

    ## What you get
    - Proactive infrastructure monitoring without managing external monitoring agents.
    - Automated detection of system degradation before outages impact production services.
    - Actionable Slack notifications equipped with diagnostic metrics.

    ## Who it's for
    - Site Reliability Engineers (SREs) and DevOps engineers maintaining high availability.
    - Platform Engineers and Database Administrators operating distributed infrastructure.
    - Operations teams requiring automated incident alerting.

    ## Why orchestrate this with Kestra
    - Runs declarative probes directly with native plugins and container tasks.
    - Securely stores sensitive connection credentials in Kestra namespace secrets.
    - Maintains a complete historical audit log of every health check execution.

    ## Prerequisites
    - Network connectivity to the target service from Kestra worker pods.
    - Service credentials and `SLACK_WEBHOOK` secret configured in the Kestra namespace.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Configure the required namespace secrets.
    3. Run a manual execution to test connectivity.
    4. Enable the schedule trigger for continuous background monitoring.

    ## How to extend
    - Add automated remediation tasks (e.g. restart service, failover replica, purge queues).
    - Route critical alerts to PagerDuty or OpsGenie.
    - Forward historical telemetry to long-term data warehouses.

    ## Links
    - [Kestra Documentation](https://kestra.io/docs)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
