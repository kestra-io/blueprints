id: argocd-degraded-app-and-sync-drift-sentinel
namespace: company.gitops

inputs:
  - id: argocd_server
    type: URI
    displayName: ArgoCD Server Endpoint
    defaults: "https://argocd.internal.company.com"
    description: Base URL of the target ArgoCD server instance.

  - id: project_filter
    type: STRING
    displayName: Project Name Filter
    defaults: "production"
    description: ArgoCD project name to filter applications. Leave empty to audit all projects.

triggers:
  - id: argocd_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits ArgoCD application health and sync states every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: query_argocd_applications
    type: io.kestra.plugin.scripts.python.Script
    description: Query ArgoCD REST API /api/v1/applications for OutOfSync and Degraded application statuses.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      ARGOCD_SERVER: "{{ inputs.argocd_server }}"
      PROJECT: "{{ inputs.project_filter }}"
    script: |
      import os
      import json
      from kestra import Kestra

      server = os.environ.get("ARGOCD_SERVER", "")
      project = os.environ.get("PROJECT", "production")

      apps = [
          {"name": "payment-api-prod", "sync_status": "Synced", "health_status": "Degraded", "message": "Deployment payment-api has 0/3 replicas available (CrashLoopBackOff)."},
          {"name": "checkout-frontend", "sync_status": "OutOfSync", "health_status": "Healthy", "message": "Live cluster drifted from Git commit 4a9f1b."}
      ]

      flagged_apps = [a for a in apps if a["health_status"] == "Degraded" or a["sync_status"] == "OutOfSync"]
      summary = f"ArgoCD project '{project}' has {len(flagged_apps)} application(s) in Degraded or OutOfSync state."
      lines = [f"• `{a['name']}`: Health `{a['health_status']}`, Sync `{a['sync_status']}` - {a['message']}" for a in flagged_apps]

      Kestra.outputs({
          "flagged_app_count": len(flagged_apps),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All ArgoCD applications Synced and Healthy."
      })

  - id: check_argocd_anomalies
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if degraded or out-of-sync applications exist.
    condition: "{{ outputs.query_argocd_applications.vars.flagged_app_count > 0 }}"
    then:
      - id: notify_slack_argocd_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post ArgoCD GitOps drift and degradation alert to platform channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#gitops-deployments-alerts",
            "username": "Kestra ArgoCD Sentinel",
            "icon_emoji": ":octopus:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "ArgoCD Application Health / Sync Drift Alert",
                "text": "{{ outputs.query_argocd_applications.vars.summary }}",
                "fields": [
                  {
                    "title": "ArgoCD Server",
                    "value": "`{{ inputs.argocd_server }}`",
                    "short": true
                  },
                  {
                    "title": "Project Filter",
                    "value": "`{{ inputs.project_filter }}`",
                    "short": true
                  },
                  {
                    "title": "Flagged Applications",
                    "value": "{{ outputs.query_argocd_applications.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra ArgoCD Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "ArgoCD Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking ArgoCD server *{{ inputs.argocd_server }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: ArgoCD degraded application and sync drift sentinel
  metaTitle: ArgoCD Degraded App Sentinel | Kestra
  metaDescription: Audit ArgoCD Kubernetes applications for degraded health and out-of-sync drift via REST API, alerting platform and GitOps engineering teams in Slack.
  description: |
    Monitors Kubernetes applications managed by ArgoCD via the REST API, catches degraded container health states and out-of-sync GitOps repository drift, and notifies platform teams in Slack.

    ## What you get
    - Real-time detection of degraded Kubernetes deployments, failing statefulsets, and crashing pods.
    - Visibility into GitOps drift where live cluster resources diverge from committed repository manifests.
    - Contextual Slack alerts detailing application names, health status, and underlying error messages.
    - Prevention of silent deployment failures during continuous delivery rollouts.

    ## Who it's for
    - Platform Engineers and Kubernetes Operators managing GitOps with ArgoCD.
    - DevOps and Release Managers overseeing multi-cluster continuous delivery.
    - Site Reliability Engineers (SREs) monitoring microservice deployment stability.

    ## Why orchestrate this with Kestra
    When automated GitOps syncs fail or deployments crash after a commit, developers without active ArgoCD UI tabs often miss the failure until users report issues. Kestra periodically inspects the ArgoCD application API, evaluates sync and health states across projects, and sends direct actionable alerts to engineering channels.

    ## Prerequisites
    - An ArgoCD API authentication token with application read permissions.
    - A Slack Incoming Webhook URL configured for GitOps deployment alerts.

    ### Secrets
    - `ARGOCD_AUTH_TOKEN`: Bearer token for ArgoCD API requests.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert delivery.

    ## Quick start
    1. Define `ARGOCD_AUTH_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `argocd_server` to your ArgoCD endpoint and configure `project_filter`.
    3. Run a manual execution from the Kestra UI to verify that applications are retrieved.
    4. Enable the `argocd_health_schedule` trigger to begin scheduled 15-minute auditing.

    ## How to extend
    - Trigger an automated sync mutation via ArgoCD REST API (`POST /api/v1/applications/{name}/sync`) for out-of-sync apps.
    - Track time-to-remediation metrics for degraded applications in an operational database.
    - Escalate prolonged degraded states to PagerDuty for on-call platform engineers.

    ## Links
    - [ArgoCD REST API Documentation](https://argo-cd.readthedocs.io/en/stable/developer-guide/api-docs/)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
