id: dagster-code-location-reload-and-recovery
namespace: company.dataengineering

description: >-
  Audit Dagster code location health via GraphQL, detect syntax or dependency load failures,
  and trigger dynamic workspace location reloads with automated remediation and safe dry-run controls.

inputs:
  - id: dagster_graphql_url
    type: URI
    displayName: Dagster GraphQL Endpoint
    defaults: "http://dagster-webserver:3000/graphql"
    description: URL of the Dagster GraphQL webserver endpoint.

  - id: target_location_name
    type: STRING
    displayName: Target Code Location Name
    defaults: "analytics_repo"
    description: Exact code location name in Dagster to audit and reconcile.

  - id: auto_remediate
    type: SELECT
    displayName: Auto Remediate
    defaults: "false"
    values:
      - "false"
      - "true"
    description: If true and the location is degraded, trigger reloadWorkspaceLocation mutation.

  - id: dry_run
    type: SELECT
    displayName: Dry Run
    defaults: "true"
    values:
      - "true"
      - "false"
    description: When true, report degradation without firing reload mutations. Must be false to apply fixes.

triggers:
  - id: code_location_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Dagster code location status every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: query_workspace_locations
    type: io.kestra.plugin.core.http.Request
    description: Query Dagster GraphQL API for workspace code location statuses and load errors.
    uri: "{{ inputs.dagster_graphql_url }}"
    method: POST
    contentType: application/json
    headers:
      Content-Type: application/json
      Authorization: "Bearer {{ secret('DAGSTER_TOKEN') }}"
    body: |
      {
        "query": "query WorkspaceLocationsQuery { workspaceOrError { __typename ... on Workspace { locationEntries { id name loadStatus locationOrError { __typename ... on PythonError { message stack } ... on RepositoryLocation { name isReloadSupported repositories { name } } } } } ... on PythonError { message stack } } }"
      }

  - id: evaluate_location_status
    type: io.kestra.plugin.scripts.python.Script
    description: Parse GraphQL workspace response, extract target location load status, and identify errors.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      RESPONSE_BODY: "{{ outputs.query_workspace_locations.body }}"
      TARGET_LOCATION: "{{ inputs.target_location_name }}"
    script: |
      import os
      import json
      from kestra import Kestra

      raw = os.environ.get("RESPONSE_BODY", "{}")
      target = os.environ.get("TARGET_LOCATION", "")
      data = json.loads(raw)

      workspace = data.get("data", {}).get("workspaceOrError", {})
      entries = workspace.get("locationEntries", [])

      matched_entry = None
      for entry in entries:
          if entry.get("name") == target:
              matched_entry = entry
              break

      if not matched_entry:
          Kestra.outputs({
              "location_found": False,
              "is_degraded": True,
              "load_status": "NOT_FOUND",
              "error_message": f"Code location '{target}' not found in Dagster workspace entries.",
              "reload_supported": False
          })
      else:
          load_status = matched_entry.get("loadStatus", "UNKNOWN")
          loc_or_error = matched_entry.get("locationOrError", {}) or {}
          typename = loc_or_error.get("__typename", "")

          is_degraded = (load_status != "LOADED") or (typename == "PythonError")
          error_msg = loc_or_error.get("message", "No error reported") if is_degraded else ""
          reload_supported = loc_or_error.get("isReloadSupported", True) if typename != "PythonError" else True

          Kestra.outputs({
              "location_found": True,
              "is_degraded": is_degraded,
              "load_status": load_status,
              "error_message": error_msg,
              "reload_supported": reload_supported
          })

  - id: route_by_health_status
    type: io.kestra.plugin.core.flow.Switch
    description: Branch execution based on whether the target code location is healthy or degraded.
    value: "{{ outputs.evaluate_location_status.vars.is_degraded ? 'DEGRADED' : 'HEALTHY' }}"
    cases:
      "HEALTHY":
        - id: log_location_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Dagster code location '{{ inputs.target_location_name }}' is healthy with status {{ outputs.evaluate_location_status.vars.load_status }}."

      "DEGRADED":
        - id: evaluate_remediation_mode
          type: io.kestra.plugin.core.flow.If
          description: Verify if automated remediation is enabled and dry-run is disabled.
          condition: "{{ inputs.auto_remediate == 'true' and inputs.dry_run == 'false' }}"
          then:
            - id: trigger_location_reload
              type: io.kestra.plugin.core.http.Request
              description: Issue reloadWorkspaceLocation GraphQL mutation to reload the target code location.
              uri: "{{ inputs.dagster_graphql_url }}"
              method: POST
              contentType: application/json
              headers:
                Content-Type: application/json
                Authorization: "Bearer {{ secret('DAGSTER_TOKEN') }}"
              body: |
                {
                  "query": "mutation ReloadCodeLocation($location: String!) { reloadWorkspaceLocation(location: $location) { __typename ... on WorkspaceLocationEntry { id name loadStatus } ... on PythonError { message stack } } }",
                  "variables": {
                    "location": "{{ inputs.target_location_name }}"
                  }
                }

            - id: verify_reload_outcome
              type: io.kestra.plugin.core.http.Request
              description: Query workspace after reload mutation to confirm the location transitioned back to LOADED.
              uri: "{{ inputs.dagster_graphql_url }}"
              method: POST
              contentType: application/json
              headers:
                Content-Type: application/json
                Authorization: "Bearer {{ secret('DAGSTER_TOKEN') }}"
              body: |
                {
                  "query": "query VerifyReload($location: String!) { workspaceOrError { ... on Workspace { locationEntries { name loadStatus } } } }",
                  "variables": {
                    "location": "{{ inputs.target_location_name }}"
                  }
                }
          else:
            - id: notify_slack_location_degraded
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              description: Alert data engineering on code location degradation when remediation is disarmed or dry-run is active.
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "channel": "#data-platform-alerts",
                  "username": "Kestra Dagster Guard",
                  "icon_emoji": ":warning:",
                  "attachments": [
                    {
                      "color": "#ffc107",
                      "title": "Dagster Code Location Degraded (Remediation Gated)",
                      "text": "Code location *{{ inputs.target_location_name }}* is in state `{{ outputs.evaluate_location_status.vars.load_status }}`.\n*Error:* {{ outputs.evaluate_location_status.vars.error_message }}\n*Remediation Armed:* {{ inputs.auto_remediate == 'true' and inputs.dry_run == 'false' }}",
                      "footer": "Kestra Orchestrator",
                      "ts": "{{ now() | date('X') }}"
                    }
                  ]
                }

errors:
  - id: alert_on_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the workflow itself encounters an unhandled exception or API failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#data-platform-alerts",
        "username": "Kestra Orchestrator Alert",
        "icon_emoji": ":rotating_light:",
        "text": "Workflow *{{ flow.id }}* failed during execution *{{ execution.id }}* while auditing Dagster location *{{ inputs.target_location_name }}*."
      }

outputs:
  - id: load_status
    type: STRING
    value: "{{ outputs.evaluate_location_status.vars.load_status }}"
  - id: is_degraded
    type: BOOLEAN
    value: "{{ outputs.evaluate_location_status.vars.is_degraded }}"

extend:
  title: Dagster Code Location Reload and Recovery
  metaTitle: Dagster Code Location Reload and Recovery | Kestra
  shortDescription: Audit Dagster code location health via GraphQL, detect load errors, and safely trigger reloads.
  metaDescription: Audit Dagster code location health via GraphQL, detect load errors, and safely trigger workspace reload mutations with dry-run controls.
  description: |
    Audits the health and load state of Dagster code locations (user code deployments) via the Dagster GraphQL API. When a code location enters an error state—such as after a git deployment with missing packages or syntax errors—this workflow isolates the failure details and conditionally issues a `reloadWorkspaceLocation` mutation to restore workspace connectivity without manual CLI intervention.

    ## How it works
    1. Sends a `WorkspaceLocationsQuery` to Dagster's GraphQL endpoint to inspect location load statuses.
    2. Parses the JSON response inside an isolated Python task runner to determine if `loadStatus` is `LOADED` or degraded.
    3. Branches execution using `io.kestra.plugin.core.flow.Switch`: healthy locations log confirmation and terminate.
    4. Evaluates safety gates (`auto_remediate` and `dry_run`). If armed, issues a `reloadWorkspaceLocation` GraphQL mutation.
    5. Re-queries the Dagster workspace to verify that the target location has returned to `LOADED`.
    6. Dispatches Slack notifications with diagnostic error context if remediation is disabled or dry-run is active.

    ## What you get
    - Continuous health auditing of Dagster code locations.
    - Zero downtime self-healing for transient git deployment and container load blips.
    - Safe two-phase execution gating with dry-run protection.
    - Contextual Slack alerts detailing root cause Python error stacks.

    ## Who it's for
    - Data Platform Engineers managing multi-tenant Dagster deployments.
    - Analytics Engineers deploying code across distributed code repositories.
    - DevOps and SRE teams maintaining data orchestration infrastructure.

    ## Why orchestrate this with Kestra
    Dagster separates the control plane (webserver and daemon) from the data plane (code locations). While Dagster exposes a UI button to reload locations, external pipelines that depend on these locations can get stalled when a location fails to load. Kestra provides automated, governed self-healing: auditing the workspace, executing recovery mutations, and coordinating downstream dependency runs.

    ## Prerequisites
    - A running Dagster webserver instance with GraphQL access enabled.
    - A Slack incoming webhook URL for notifications.

    ### Secrets
    - `DAGSTER_TOKEN`: Dagster webserver bearer authentication token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Configure `DAGSTER_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `target_location_name` to your Dagster code location (e.g., `analytics_repo`).
    3. Run a manual execution with `dry_run: true` to inspect the location's current load status.
    4. Set `auto_remediate: true` and `dry_run: false` to enable autonomous healing.
    5. Enable the `code_location_audit_schedule` trigger for continuous 15-minute verification.

    ## How to extend
    - Trigger a container restart via Kestra's Docker or Kubernetes plugin if GraphQL reloads fail repeatedly.
    - Chain this flow to execute immediately following a GitHub Actions or GitLab CI/CD deployment pipeline.
    - Send audit logs to Datadog or OpenTelemetry collectors for platform uptime SLA tracking.

    ## Links
    - [Dagster Code Locations Documentation](https://docs.dagster.io/deployment/code-locations)
    - [Dagster GraphQL API Reference](https://docs.dagster.io/deployment/apis/graphql)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.request)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  demo: false
