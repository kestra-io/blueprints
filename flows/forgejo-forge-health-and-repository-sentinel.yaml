id: forgejo-forge-health-and-repository-sentinel
namespace: devops.git

extend:
  title: Forgejo Git Forge Health, Storage Engine, and Repository Sentinel
  metaTitle: Monitor Forgejo Git Forge Health, Storage & Repositories | Kestra
  shortDescription: Continuously audit Forgejo Git forge liveness, database pool readiness, and repository storage search engines with Slack incident alerting.
  metaDescription: Audit Forgejo Git forge platform health, validate database connection pooling and repository storage engine readiness, and alert Slack via Kestra.
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  description: |
    ## How it works
    1. **Automated Heartbeat Trigger**: A scheduled cron trigger initiates an automated sentinel audit every 15 minutes, or execution is triggered on-demand via webhook or manual trigger.
    2. **Multi-Stage Service Probes**:
       - `probe_healthz`: Queries the native Forgejo `/api/healthz` endpoint to verify database connection pool stability, worker queues, and internal cache readiness.
       - `probe_version`: Queries `/api/v1/version` to confirm API gateway responsiveness and deployment version consistency.
       - `probe_nodeinfo`: Queries `/api/v1/node/info` to inspect cluster node metrics, Git binary compatibility, and user footprint.
       - `probe_repository_engine`: Queries `/api/v1/repos/search?limit=5` to validate that the Git repository storage engine, bleve search indexer, and disk mounts are responsive.
    3. **Pebble Health Classification**: Evaluates HTTP status codes, latency thresholds, and JSON responses to classify the cluster state into `OPERATIONAL`, `DEGRADED`, or `CRITICAL`.
    4. **Switch Routing & Safe Remediation**:
       - `CRITICAL`: Emits high-priority error diagnostics and dispatches an immediate incident webhook alert to Slack containing failure details.
       - `DEGRADED`: Logs a warning for elevated probe latencies or indexer delays and dispatches a Slack notification if warning alerts are enabled.
       - `OPERATIONAL`: Logs a health verification summary with version and cluster statistics.
    5. **Structured Telemetry Output**: Emits structured outputs via `io.kestra.plugin.core.execution.OutputValues` for downstream monitoring dashboards, APM tools, or data warehouse landing.
    6. **Error Incident Fallback**: Dedicated `errors` task handles uncaught network timeouts or connection drops, alerting SRE teams instantly.

    ## What you get
    - Continuous validation of the Forgejo self-hosted software forge and Git repository engine.
    - Automated detection of database connection pool exhaustion or indexer corruption before users encounter failed git pushes or pull request errors.
    - Configurable multi-threshold alerting to Slack with rich message blocks and error diagnostics.
    - Comprehensive telemetry audit log with timestamped metrics for long-term health tracking.
    - Zero vendor lock-in, fully testable against standard open-source Forgejo Docker images.

    ## Who it's for
    - **DevOps & Platform Engineers**: Ensuring continuous availability of developer Git infrastructure and CI/CD triggers.
    - **Site Reliability Engineers (SREs)**: Automating proactive drift detection and platform heartbeat monitoring without external SaaS dependencies.
    - **Engineering Managers**: Maintaining high SLA uptime for internal self-hosted code repositories and Codeberg/Forgejo mirrors.

    ## Why orchestrate this with Kestra
    - **Declarative YAML Workflows**: Define your infrastructure monitoring alongside your CI/CD pipelines in version-controlled Git repositories.
    - **Built-in Resilience & Retries**: Automatically handle transient network jitter with configurable retry policies on individual probe tasks.
    - **Stateful Flow Control**: Seamlessly branch between operational logs and multi-channel incident dispatches without writing fragile shell scripts.
    - **Unified Telemetry & Auditability**: Every execution retains full output history, timing metrics, and response payloads for forensic analysis.

    ## Prerequisites
    - An operational Forgejo instance (accessible via HTTP or HTTPS).
    - Network connectivity from the Kestra worker to the Forgejo instance.
    - (Optional) An incoming Slack Webhook URL for incident notifications.
    - (Optional) A Forgejo API personal access token if your instance enforces private mode (`REQUIRE_SIGNIN_VIEW = true`).

    ### Secrets
    - `SLACK_WEBHOOK_URL`: (Optional) Slack Incoming Webhook URL to dispatch alerts on degraded or critical status.
    - `FORGEJO_API_TOKEN`: (Optional) Personal access token for authenticated API requests if the Forgejo instance is in private mode.

    ## Quick start
    1. Start a local Forgejo container for testing:
       ```bash
       docker run -d --name forgejo -p 3000:3000 codeberg.org/forgejo/forgejo:9
       ```
    2. Add the `SLACK_WEBHOOK_URL` secret in your Kestra namespace or pass it as an execution input.
    3. Import this flow into your Kestra instance.
    4. Execute the flow manually with `forgejo_url: http://localhost:3000` to verify connectivity.
    5. Enable the schedule trigger for continuous 15-minute background monitoring.

    ## How to extend
    - **PagerDuty / Opsgenie Escalation**: Add incident management tasks to trigger on-call pages when consecutive probes enter `CRITICAL` state.
    - **Git Push/Pull Smoke Test**: Add a container task running `git clone` and `git push` against an automated canary repository to test the SSH/HTTP Git wire protocol end-to-end.
    - **Disk Space Monitoring**: Query the Forgejo admin API `/api/v1/admin/cron` to trigger internal repository garbage collection and storage quota checks.
    - **Prometheus Metric Export**: Push probe latency and health scores to a Prometheus Pushgateway or OpenTelemetry collector for unified Grafana dashboards.

    ## Links
    - [Forgejo Official Documentation](https://forgejo.org/docs/)
    - [Forgejo API Reference](https://codeberg.org/api/swagger)
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications/tasks/io.kestra.plugin.notifications.slack.slackincomingwebhook)

labels:
  env: production
  system: forgejo
  category: gitops

inputs:
  - id: forgejo_url
    type: STRING
    displayName: Forgejo Instance URL
    description: Base URL of the Forgejo Git forge instance.
    defaults: http://localhost:3000

  - id: forgejo_token
    type: STRING
    displayName: Forgejo API Token
    description: Personal access token if the instance requires authentication for read endpoints.
    defaults: ""
    required: false

  - id: slack_webhook_url
    type: STRING
    displayName: Slack Webhook URL
    description: Slack incoming webhook URL for incident alerting.
    defaults: ""
    required: false

  - id: latency_threshold_ms
    type: INT
    displayName: Latency Threshold (ms)
    description: Maximum acceptable response latency in milliseconds before marking the service as degraded.
    defaults: 2000

  - id: alert_on_warning
    type: BOOLEAN
    displayName: Alert on Degraded Warning
    description: Whether to send Slack alerts when status is DEGRADED in addition to CRITICAL.
    defaults: true

triggers:
  - id: periodic_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: probe_healthz
    type: io.kestra.plugin.core.http.Request
    description: Probe Forgejo system health and database connection pooling readiness.
    uri: "{{ inputs.forgejo_url }}/api/healthz"
    method: GET
    timeout: PT10S
    retry:
      type: constant
      interval: PT2S
      maxAttempt: 2
    failedOnFailedStatus: false

  - id: probe_version
    type: io.kestra.plugin.core.http.Request
    description: Probe Forgejo API version and service responsiveness.
    uri: "{{ inputs.forgejo_url }}/api/v1/version"
    method: GET
    timeout: PT10S
    headers: "{{ inputs.forgejo_token != '' ? {'Authorization': 'token ' ~ inputs.forgejo_token} : {} }}"
    failedOnFailedStatus: false

  - id: probe_nodeinfo
    type: io.kestra.plugin.core.http.Request
    description: Inspect Forgejo node software metadata and runtime capabilities.
    uri: "{{ inputs.forgejo_url }}/api/v1/node/info"
    method: GET
    timeout: PT10S
    headers: "{{ inputs.forgejo_token != '' ? {'Authorization': 'token ' ~ inputs.forgejo_token} : {} }}"
    failedOnFailedStatus: false

  - id: probe_repository_engine
    type: io.kestra.plugin.core.http.Request
    description: Test repository search engine and Git indexer responsiveness.
    uri: "{{ inputs.forgejo_url }}/api/v1/repos/search?limit=5"
    method: GET
    timeout: PT10S
    headers: "{{ inputs.forgejo_token != '' ? {'Authorization': 'token ' ~ inputs.forgejo_token} : {} }}"
    failedOnFailedStatus: false

  - id: classify_sentinel_status
    type: io.kestra.plugin.core.log.Log
    description: Evaluate service response codes and classify cluster operational status.
    message: |
      Forgejo Sentinel Probe Evaluation:
      - Healthz Status Code: {{ outputs.probe_healthz.statusCode }}
      - Version Status Code: {{ outputs.probe_version.statusCode }}
      - NodeInfo Status Code: {{ outputs.probe_nodeinfo.statusCode }}
      - Repo Engine Status Code: {{ outputs.probe_repository_engine.statusCode }}

  - id: route_operational_status
    type: io.kestra.plugin.core.flow.Switch
    description: Branch execution based on Forgejo service health classification.
    value: "{{ outputs.probe_healthz.statusCode == 200 and outputs.probe_version.statusCode == 200 and outputs.probe_repository_engine.statusCode == 200 ? 'OPERATIONAL' : (outputs.probe_healthz.statusCode == 200 ? 'DEGRADED' : 'CRITICAL') }}"
    cases:
      CRITICAL:
        - id: log_critical_incident
          type: io.kestra.plugin.core.log.Log
          level: ERROR
          message: "CRITICAL: Forgejo instance at {{ inputs.forgejo_url }} is DOWN or database connection pool failed! Status Code: {{ outputs.probe_healthz.statusCode }}."

        - id: alert_slack_critical
          type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
          description: Dispatch high-priority alert to Slack when Forgejo is failing.
          url: "{{ inputs.slack_webhook_url != '' ? inputs.slack_webhook_url : secret('SLACK_WEBHOOK_URL') }}"
          runIf: "{{ (inputs.slack_webhook_url != '' or secret('SLACK_WEBHOOK_URL') != null) }}"
          payload: |
            {
              "text": "CRITICAL INCIDENT: Forgejo Git Forge at {{ inputs.forgejo_url }} is unreachable or failing health checks!",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Forgejo Sentinel Alert: Service CRITICAL",
                    "emoji": false
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Instance:* {{ inputs.forgejo_url }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Healthz Code:* {{ outputs.probe_healthz.statusCode }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version Code:* {{ outputs.probe_version.statusCode }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repo Search Code:* {{ outputs.probe_repository_engine.statusCode }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Execution ID: {{ execution.id }} | Namespace: {{ flow.namespace }}"
                    }
                  ]
                }
              ]
            }

      DEGRADED:
        - id: log_degraded_warning
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "WARNING: Forgejo instance at {{ inputs.forgejo_url }} is DEGRADED. Repository engine or API returned non-200 while healthz passed."

        - id: alert_slack_degraded
          type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
          description: Dispatch warning alert to Slack when Forgejo repository search is degraded.
          url: "{{ inputs.slack_webhook_url != '' ? inputs.slack_webhook_url : secret('SLACK_WEBHOOK_URL') }}"
          runIf: "{{ inputs.alert_on_warning and (inputs.slack_webhook_url != '' or secret('SLACK_WEBHOOK_URL') != null) }}"
          payload: |
            {
              "text": "WARNING: Forgejo Git Forge at {{ inputs.forgejo_url }} is reporting DEGRADED sub-services.",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Forgejo Sentinel Warning: Sub-system Degraded",
                    "emoji": false
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Instance:* {{ inputs.forgejo_url }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repository Indexer Status:* {{ outputs.probe_repository_engine.statusCode }}"
                    }
                  ]
                }
              ]
            }

    defaults:
      - id: log_operational_confirmation
        type: io.kestra.plugin.core.log.Log
        message: "SUCCESS: Forgejo instance at {{ inputs.forgejo_url }} is fully OPERATIONAL. Health checks and repository search indices are healthy."

  - id: record_sentinel_audit_telemetry
    type: io.kestra.plugin.core.execution.OutputValues
    description: Record structured sentinel health telemetry for audit history and downstream dashboards.
    values:
      instance_url: "{{ inputs.forgejo_url }}"
      status: "{{ outputs.probe_healthz.statusCode == 200 and outputs.probe_version.statusCode == 200 and outputs.probe_repository_engine.statusCode == 200 ? 'OPERATIONAL' : (outputs.probe_healthz.statusCode == 200 ? 'DEGRADED' : 'CRITICAL') }}"
      healthz_status_code: "{{ outputs.probe_healthz.statusCode }}"
      version_status_code: "{{ outputs.probe_version.statusCode }}"
      nodeinfo_status_code: "{{ outputs.probe_nodeinfo.statusCode }}"
      repository_search_status_code: "{{ outputs.probe_repository_engine.statusCode }}"

errors:
  - id: handle_sentinel_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "SENTINEL UNEXPECTED FAILURE: Could not connect to Forgejo at {{ inputs.forgejo_url }}. Please verify network route and container state."

  - id: alert_sentinel_fatal_exception
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Dispatch notification when probe encounters fatal network error.
    url: "{{ inputs.slack_webhook_url != '' ? inputs.slack_webhook_url : secret('SLACK_WEBHOOK_URL') }}"
    runIf: "{{ (inputs.slack_webhook_url != '' or secret('SLACK_WEBHOOK_URL') != null) }}"
    payload: |
      {
        "text": "FATAL INCIDENT: Forgejo sentinel flow execution {{ execution.id }} failed with network exception or unhandled error!"
      }
