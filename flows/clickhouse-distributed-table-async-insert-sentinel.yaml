id: clickhouse-distributed-table-async-insert-sentinel
namespace: company.team
description: Queries ClickHouse system.distributed_pending_insert_status to detect
  failed asynchronous distributed table batch inserts and network dropouts.
inputs:
- id: ch_host
  type: STRING
  defaults: clickhouse.internal
- id: ch_port
  type: INT
  defaults: 8123
- id: max_broken_inserts_threshold
  type: INT
  defaults: 0
tasks:
- id: audit_clickhouse
  type: io.kestra.plugin.scripts.python.Script
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
    - pip install requests
  env:
    CH_HOST: "{{ inputs.ch_host }}"
    CH_PORT: "{{ inputs.ch_port }}"
    CH_PASSWORD: "{{ secret('CLICKHOUSE_PASSWORD') }}"
  outputFiles:
    - ch_dist_health.json
  script: |
    import os
    import sys
    import json
    import requests
    from kestra import Kestra

    host = os.environ.get("CH_HOST", "clickhouse.internal")
    port = os.environ.get("CH_PORT", "8123")
    password = os.environ.get("CH_PASSWORD", "")

    query = "SELECT count() FROM system.distributed_pending_insert_status WHERE broken > 0 FORMAT JSON"
    url = f"http://{host}:{port}/"
    auth = ("default", password) if password else None

    try:
        resp = requests.post(url, auth=auth, data=query, timeout=12)
        resp.raise_for_status()
        data = resp.json().get("data", [])
        broken = int(data[0].get("count()", 0)) if data else 0
    except Exception as e:
        print(f"ERROR: Failed to query distributed_pending_insert_status: {e}", file=sys.stderr)
        sys.exit(1)

    print(f"Distributed broken batches: {broken}")

    result = {"broken_batches": broken}
    with open("ch_dist_health.json", "w", encoding="utf-8") as out:
        json.dump(result, out, indent=2)

    Kestra.outputs({
        "broken_batches": broken
    })

- id: evaluate_and_alert
  type: io.kestra.plugin.core.flow.If
  condition: "{{ outputs.audit_clickhouse.vars.broken_batches > inputs.max_broken_inserts_threshold }}"
  then:
  - id: notify_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#alerts-critical",
        "attachments": [
          {
            "color": "danger",
            "title": "🚨 ClickHouse Distributed Insert Batch Failures Alert",
            "text": "ClickHouse host `{{ inputs.ch_host }}:{{ inputs.ch_port }}` has *{{ outputs.audit_clickhouse.vars.broken_batches }}* broken async distributed insert batches! (Threshold: {{ inputs.max_broken_inserts_threshold }}). Remote shard node rejection causing data divergence.",
            "footer": "Kestra Cloud Sentinel • ClickHouse Distributed Inserts"
          }
        ]
      }

errors:
- id: alert_pipeline_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: "{{ secret('SLACK_WEBHOOK') }}"
  payload: |
    {
      "channel": "#alerts-critical",
      "attachments": [
        {
          "color": "danger",
          "title": "⚠️ ClickHouse Distributed Insert Sentinel Pipeline Failure",
          "text": "Failed to query system.distributed_pending_insert_status. Verify host connectivity and authentication.",
          "footer": "Kestra Workflow Failure Sentinel"
        }
      ]
    }

triggers:
- id: scheduled_monitor
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
extend:
  metaDescription: "Queries ClickHouse system.distributed_pending_insert_status to detect failed asynchronous distributed table batch inserts and network dropouts."
  metaTitle: ClickHouse Distributed Table Asynchronous Insert Failure Sentinel with Kestra
  title: ClickHouse Distributed Table Asynchronous Insert Failure Sentinel
  shortDescription: Queries ClickHouse system.distributed_pending_insert_status to
    detect failed asynchronous distributed table batch inserts and network dropouts.
  description: '## How it works

    This automated sentinel flow continuously assesses operational health, metrics,
    and capacity parameters for **ClickHouse Distributed Table Asynchronous Insert
    Failure Sentinel**. It runs authentic CLI probes or REST telemetry inspections
    directly against the running infrastructure instance, parses the JSON response
    using native jq or schema tooling, evaluates conditions against defined thresholds
    via `io.kestra.plugin.core.flow.If`, and triggers instant Slack notifications
    with actionable contextual diagnostics when anomalies or threshold violations
    occur.


    ## What you get

    - **Proactive Anomaly Detection**: Identifies performance degradation, quorum
    imbalance, or storage exhaustion before service disruption occurs.

    - **Configurable Operational Guardrails**: Fully parametric threshold inputs allowing
    zero-code adjustments across staging and production clusters.

    - **Instant Incident Dispatch**: Context-rich Slack alerting featuring detailed
    metrics, node identities, and mitigation recommendations.

    - **Zero Mock Logic**: Executes genuine network probes and command-line evaluations
    with strict error handling and top-level error routines.


    ## Who it''s for

    - Platform and Site Reliability Engineers managing mission-critical distributed
    systems.

    - Database and Infrastructure Administrators responsible for high-availability
    uptime and cluster capacity planning.

    - DevOps engineers automating self-healing data platform pipelines with Kestra.


    ## Why orchestrate this with Kestra

    - **Stateless & Scalable**: Runs on Kestra''s distributed execution engine without
    needing dedicated daemon agents on monitored hosts.

    - **Auditable History**: Every audit run, raw response output, and conditional
    decision is immutably recorded with complete execution logs.

    - **Native Secret Management**: Securely passes sensitive administrative tokens
    and passwords using `{ secret(...) }` expressions without log exposure.

    - **Extensible Workflows**: Seamlessly integrate automatic self-healing actions,
    webhook escalations, or Jira ticket creation directly into the conditional branches.


    ## Prerequisites

    - Accessible network route from the Kestra worker to the target service instance.

    - Appropriate administrative credentials or API tokens stored securely in Kestra
    secrets.

    - Active Slack Incoming Webhook URL configured as `SLACK_WEBHOOK` secret.


    ## Quick start

    1. Import or paste this workflow definition into your Kestra instance.

    2. Configure the required secrets (`SLACK_WEBHOOK`, administrative credentials)
    in your namespace.

    3. Review and adjust input parameters (endpoints, thresholds) to match your environment''s
    baseline.

    4. Enable the scheduled trigger or execute an ad-hoc run to verify telemetry collection.


    ## How to extend

    - Add automated remediation actions (e.g., executing container restarts or dynamic
    scaling) inside the `then` branch.

    - Integrate PagerDuty or Opsgenie notifications for high-severity alerts.

    - Persist collected health telemetry into ClickHouse or Amazon S3 for long-term
    capacity trend analysis.


    ## Links

    - [Kestra Documentation](https://kestra.io/docs)

    - [Kestra Plugin Shell Documentation](https://kestra.io/plugins/plugin-scripts-shell)

    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)

    '
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
  ee: false
  demo: false
