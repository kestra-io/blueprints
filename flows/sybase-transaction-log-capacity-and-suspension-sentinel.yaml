id: sybase-transaction-log-capacity-and-suspension-sentinel
namespace: company.database

inputs:
  - id: sybase_url
    type: STRING
    defaults: "jdbc:sybase:Tds:localhost:5000/master"
    description: JDBC connection URL for the target Sybase ASE instance (e.g. jdbc:sybase:Tds:host:port/database).

  - id: sybase_database
    type: STRING
    defaults: "master"
    description: Target database name to monitor for transaction log (syslogs) space consumption.

  - id: max_log_used_percent_threshold
    type: FLOAT
    defaults: 75.0
    description: Warning threshold percentage of transaction log utilization before triggering an operational alert.

  - id: critical_log_used_percent_threshold
    type: FLOAT
    defaults: 90.0
    description: Critical threshold percentage approaching the Last Chance Threshold (LCT) that risks freezing write transactions.

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"
    disabled: true
    inputs:
      sybase_url: "jdbc:sybase:Tds:localhost:5000/master"
      sybase_database: "master"
      max_log_used_percent_threshold: 75.0
      critical_log_used_percent_threshold: 90.0

tasks:
  - id: probe_transaction_log_space
    type: io.kestra.plugin.jdbc.sybase.Query
    url: "{{ inputs.sybase_url }}"
    username: "{{ secret('SYBASE_USERNAME') }}"
    password: "{{ secret('SYBASE_PASSWORD') }}"
    fetchType: FETCH_ONE
    allowFailure: true
    sql: |
      SELECT
        d.name AS db_name,
        sum(u.size) AS total_pages,
        lct_admin("logsegment_freepgs", d.dbid) AS free_log_pages,
        ROUND(100.0 - (100.0 * lct_admin("logsegment_freepgs", d.dbid) / NULLIF(sum(u.size), 0)), 2) AS log_used_percent
      FROM master..sysdatabases d
      JOIN master..sysusages u ON d.dbid = u.dbid
      WHERE d.name = '{{ inputs.sybase_database }}' AND u.segmap & 4 = 4
      GROUP BY d.name, d.dbid
    description: Probes Sybase sysusages and queries the Last Chance Threshold admin function to calculate exact transaction log segment space utilization.

  - id: classify_sybase_log_posture
    type: io.kestra.plugin.core.debug.Return
    format: >-
      {{
        (outputs.probe_transaction_log_space is not defined or outputs.probe_transaction_log_space.row is not defined or outputs.probe_transaction_log_space.row.log_used_percent is not defined) ? 'SYBASE_CONNECTION_FAILED' :
        (outputs.probe_transaction_log_space.row.log_used_percent >= inputs.critical_log_used_percent_threshold) ? 'CRITICAL_LOG_SPACE_EXHAUSTION' :
        (outputs.probe_transaction_log_space.row.log_used_percent >= inputs.max_log_used_percent_threshold) ? 'WARNING_LOG_SPACE_SURGE' :
        'HEALTHY'
      }}
    description: Classifies transaction log health into operational risk postures based on evaluated threshold percentages.

  - id: route_posture_action
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.classify_sybase_log_posture.value }}"
    cases:
      CRITICAL_LOG_SPACE_EXHAUSTION:
        - id: alert_critical_log_exhaustion
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ {'text': '🚨 *CRITICAL: Sybase ASE Transaction Log Imminent Freezing Risk*\n• *Database:* `' ~ inputs.sybase_database ~ '`\n• *Log Utilization:* `' ~ outputs.probe_transaction_log_space.row.log_used_percent ~ '%` (Critical Ceiling: `' ~ inputs.critical_log_used_percent_threshold ~ '%`)\n• *Free Log Pages:* ' ~ outputs.probe_transaction_log_space.row.free_log_pages ~ '\n• *Execution ID:* `' ~ execution.id ~ '`\n*Action Required:* Transaction log is approaching Last Chance Threshold (LCT); dump transaction log or allocate additional log space immediately to avoid suspended write transactions.'} | toJson }}"

      WARNING_LOG_SPACE_SURGE:
        - id: alert_warning_log_surge
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ {'text': '⚠️ *WARNING: Sybase ASE Transaction Log Growth Surge*\n• *Database:* `' ~ inputs.sybase_database ~ '`\n• *Log Utilization:* `' ~ outputs.probe_transaction_log_space.row.log_used_percent ~ '%` (Warning Threshold: `' ~ inputs.max_log_used_percent_threshold ~ '%`)\n• *Execution ID:* `' ~ execution.id ~ '`\n*Notice:* High volume uncommitted transactions or deferred log truncation observed.'} | toJson }}"

      SYBASE_CONNECTION_FAILED:
        - id: alert_connection_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ {'text': '🔥 *ALERT: Sybase ASE Instance Unreachable*\n• *URL:* `' ~ inputs.sybase_url ~ '`\n• *Database:* `' ~ inputs.sybase_database ~ '`\n• *Error:* Unable to establish JDBC connection or authenticate with Sybase TDS driver.\n• *Execution ID:* `' ~ execution.id ~ '`'} | toJson }}"

      HEALTHY:
        - id: log_sybase_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Sybase ASE database '{{ inputs.sybase_database }}' transaction log is healthy. Used: {{ outputs.probe_transaction_log_space.row.log_used_percent }}%, Free pages: {{ outputs.probe_transaction_log_space.row.free_log_pages }}."
    description: Routes operational notifications to Slack or diagnostic execution logs based on evaluated log capacity posture.

  - id: audit_sentinel_run
    type: io.kestra.plugin.core.log.Log
    message: "Sybase transaction log sentinel audit complete for execution {{ execution.id }}. Verdict: {{ outputs.classify_sybase_log_posture.value }}, Log Used: {{ outputs.probe_transaction_log_space.row.log_used_percent ?? 'N/A' }}%, Free Pages: {{ outputs.probe_transaction_log_space.row.free_log_pages ?? 'N/A' }}."
    description: Emits an immutable structured audit log entry recording Sybase capacity metrics and cycle verdicts.

errors:
  - id: alert_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: "{{ {'text': '❌ *Sybase Sentinel Workflow Failure*\nFlow failed unexpectedly during execution `' ~ execution.id ~ '` against `' ~ inputs.sybase_url ~ '`. Inspect Kestra task error logs.'} | toJson }}"

extend:
  title: Sybase ASE Transaction Log Capacity and Suspension Sentinel
  metaTitle: Sybase ASE Transaction Log Capacity Sentinel | Kestra
  shortDescription: Audit Sybase ASE transaction log segment utilization, detect Last Chance Threshold exhaustion, and dispatch Slack alerts.
  metaDescription: Audit Sybase ASE transaction log capacity using JDBC, calculate LCT free space percentages, detect write suspension risks, and trigger Slack alerts.
  description: |
    In enterprise SAP Sybase Adaptive Server Enterprise (ASE) environments, transaction log (`syslogs`) exhaustion represents one of the most severe operational failure modes. When transaction log segment free space drops below the Last Chance Threshold (LCT) without a triggered `sp_thresholdaction` or automated dump, Sybase ASE immediately suspends all write transactions across user sessions. Applications experience hanging queries and connection pool exhaustion without explicit error codes, causing widespread production outages.

    This blueprint implements an automated Day 2 operations sentinel for Sybase ASE databases. Running on an autonomous schedule, it queries system segment catalogs (`sysdatabases`, `sysusages`) and invokes native kernel functions (`lct_admin`) via JDBC to evaluate exact log segment utilization. It classifies operational risk into distinct health tiers, alerting Slack before transaction logs fill and transactions suspend.

    ## How it works

    1. The `periodic_schedule` trigger invokes the flow on a 2-hour cadence with default database and threshold parameters, configured disabled by default for validation.
    2. `probe_transaction_log_space` (`io.kestra.plugin.jdbc.sybase.Query`) connects via TDS JDBC driver and executes a single-row diagnostic query calculating total pages, free log pages, and log usage percentage.
    3. `classify_sybase_log_posture` (`io.kestra.plugin.core.debug.Return`) evaluates query outputs against configured warning and critical thresholds via Pebble, classifying state into `SYBASE_CONNECTION_FAILED`, `CRITICAL_LOG_SPACE_EXHAUSTION`, `WARNING_LOG_SPACE_SURGE`, or `HEALTHY`.
    4. `route_posture_action` (`io.kestra.plugin.core.flow.Switch`) evaluates the classification verdict: critical conditions dispatch urgent Slack incident alerts detailing free pages and required DBA remediation, while healthy runs emit diagnostic metrics.
    5. `audit_sentinel_run` (`io.kestra.plugin.core.log.Log`) writes an immutable execution record detailing evaluated metrics for compliance and long-term capacity trend analysis.
    6. A flow-level `errors` handler captures connection timeouts, network partitions, or authentication failures, ensuring DBA teams are notified of monitoring disruptions.

    ## What you get

    - Proactive visibility into Sybase ASE transaction log segment consumption before writes freeze.
    - Automated detection of Last Chance Threshold (LCT) breaches and abnormal transaction volume spikes.
    - Decoupled threshold alerting directly into operational Slack channels with actionable DBA context.
    - Comprehensive audit logs capturing page allocations and log consumption across execution cycles.
    - Fault-tolerant error handling preventing silent workflow drops during network hiccups.

    ## Who it's for

    - Database Administrators (DBAs) managing mission-critical Sybase ASE and SAP enterprise instances.
    - Site Reliability Engineers (SREs) responsible for legacy and core banking relational database reliability.
    - Platform and Data Engineers maintaining transactional data pipelines feeding analytical warehouses.

    ## Why orchestrate this with Kestra

    Monitoring Sybase ASE using bespoke shell scripts and crontab introduces brittle TDS driver setups, plain-text credential exposure, and silent script failures. Orchestrating with Kestra delivers certified Sybase JDBC connectivity, centralized secret masking, declarative scheduling, robust failure retries, and unified alerting without installing or maintaining specialized host monitoring daemons.

    ## Prerequisites

    - A running SAP Sybase ASE instance (version 15.7+ or 16.0+) reachable from the Kestra worker environment.
    - Database user credentials with permission to query `master..sysdatabases` and `master..sysusages`.
    - An incoming Slack Webhook URL configured in Kestra namespace secrets.

    ### Secrets

    - `SYBASE_USERNAME`: Database user login authorized to inspect Sybase master system tables.
    - `SYBASE_PASSWORD`: Password for the designated Sybase administrative user.
    - `SLACK_WEBHOOK_URL`: The destination Slack webhook URL for operational incident dispatching.

    ## Quick start

    1. Configure `SYBASE_USERNAME`, `SYBASE_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local Sybase ASE container for local validation:
       ```bash
       docker run -d --name sybase-sentinel \
         -p 5000:5000 \
         -e SYBASE_PASSWORD=my_secret_pass \
         datagrip/sybase:latest
       ```
    3. Connect the Sybase container to your local Kestra network:
       ```bash
       docker network connect YOUR_KESTRA_NETWORK sybase-sentinel
       ```
    4. Execute a manual test run in the Kestra UI with `sybase_url: "jdbc:sybase:Tds:sybase-sentinel:5000/master"`.
    5. Verify execution logs confirm successful query execution and log classification (`HEALTHY`).
    6. Enable the `periodic_schedule` trigger to activate autonomous background monitoring.

    ## How to extend

    - Add automated log truncation by chaining an `io.kestra.plugin.jdbc.sybase.Query` executing `DUMP TRANSACTION database_name WITH TRUNCATE_ONLY` when critical thresholds are reached.
    - Implement multi-database sweeps by wrapping the check in an `io.kestra.plugin.core.flow.ForEach` loop iterating over all user databases returned from `sysdatabases`.
    - Integrate multi-channel incident dispatch by routing critical alerts to PagerDuty via `io.kestra.plugin.pagerduty` when log usage exceeds 95%.

    ## Links

    - [Kestra Sybase Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-sybase)
    - [SAP Sybase ASE System Administration Guide: Managing Log Space](https://infocenter.sybase.com/)
    - [Sybase Last Chance Threshold (LCT) Architecture](https://infocenter.sybase.com/)
