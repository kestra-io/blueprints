id: ai-github-issue-triage-routing
namespace: io.kestra.blueprints.ai

extend:
  title: AI-Powered GitHub Issue Triage and Routing with Slack Notifications
  metaTitle: AI-Powered GitHub Issue Triage and Routing with Slack Notifications
  metaDescription: Triage GitHub issues with OpenAI structured JSON schema, tag execution observability, branch by category, apply GitHub labels, and notify Slack.
  shortDescription: Triage GitHub issues with OpenAI structured JSON schema, tag execution observability, branch by category, apply GitHub labels, and notify Slack.
  description: |
    Automate GitHub issue intake, structured AI classification, observability tagging, and conditional routing.
    Whenever a new GitHub issue is opened or triggered via webhook, this workflow:
    1. Extracts and normalizes issue details (title, description, author, repository).
    2. Retrieves current issue state and metadata via the GitHub REST API.
    3. Classifies the issue with OpenAI into structured JSON (`category`, `short_summary`, `priority`, `reasoning`).
    4. Tags the Kestra execution with searchable triage labels for observability.
    5. Branches using a flowable `If` condition to apply `bug` vs other category labels (`enhancement`, `documentation`, `question`, `needs-triage`).
    6. Dispatches a formatted Slack notification with rich issue context and direct links.
    7. Catches runtime failures with an automated Slack alert in the `errors` handler.

    ## How it works

    1. **Triggering**: Listens for GitHub `issues.opened` webhook events using `io.kestra.plugin.core.trigger.Webhook` or processes manual inputs via Kestra UI.
    2. **Normalization**: `extract_issue_data` (`io.kestra.plugin.core.execution.SetVariables`) parses issue fields with null-safe defaults and resolves the `dry_run` toggle.
    3. **Metadata Fetch**: In live mode, `fetch_issue_metadata` (`io.kestra.plugin.core.http.Request`) verifies issue status via the GitHub REST API.
    4. **AI Classification**: `classify_issue` (`io.kestra.plugin.openai.ChatCompletion`) runs `gpt-4o-mini` with a strict `jsonResponseSchema` enforcing `category`, `short_summary`, `priority`, and `reasoning`. In dry-run mode, `mock_classification` (`io.kestra.plugin.core.debug.Return`) supplies a deterministic fixture with zero external API calls.
    5. **Parsing & Validation**: `parse_and_validate_ai_response` (`io.kestra.plugin.core.execution.SetVariables`) safely parses JSON with `raw is json` guards and resolves target label names.
    6. **Observability**: `tag_execution` (`io.kestra.plugin.core.execution.Labels`) attaches `repository`, `issue`, `category`, and `priority` to the execution for UI filtering.
    7. **Branching & Actions**: `branch_on_classification` (`io.kestra.plugin.core.flow.If`) applies `bug` label for bug categories vs categorized labels (`enhancement`, `documentation`, `question`, `needs-triage`) for other categories via GitHub REST API (`io.kestra.plugin.core.http.Request`).
    8. **Alert Delivery**: `send_slack_notification` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) formats a rich Slack Block Kit alert with direct action buttons.
    9. **Error Handling**: An `errors` block catches unhandled runtime failures and posts diagnostic alerts to Slack.

    ## What you get

    - Real-time automated issue triage reducing maintainer backlog response time to seconds.
    - Deterministic structured output from OpenAI using strict JSON schema validation.
    - Zero external API dependency in dry-run mode (`dry_run: true`) for rapid offline testing.
    - Dynamic Kestra execution tagging for instant dashboard filtering by category and priority.
    - Enterprise Slack Block Kit cards with interactive links directly to the triaged GitHub issue.

    ## Who it's for

    - Open source maintainers handling high-volume issue intake.
    - Engineering teams seeking automated issue categorization, labeling, and escalation.
    - DevOps and Platform engineers building event-driven triage pipelines.

    ## Why orchestrate this with Kestra

    Kestra coordinates webhooks, HTTP retries, LLM schemas, dynamic execution labels, conditional branching, and Slack notifications in declarative version-controlled YAML. It provides built-in auditability, retry policies on external calls, and local dry-run simulation without complex custom microservices.

    ## Prerequisites

    - A running Kestra instance with OpenAI and Slack plugins enabled.
    - A GitHub Personal Access Token with `issues:write` permissions.
    - An OpenAI API Key with access to chat completion models.
    - A Slack Incoming Webhook URL for the target channel.

    ### Secrets

    - `GITHUB_WEBHOOK_KEY`: Secret key to authenticate incoming GitHub webhook requests.
    - `GITHUB_TOKEN`: GitHub Personal Access Token or GitHub App token with `issues:write` permissions.
    - `OPENAI_API_KEY`: OpenAI API key for chat completion models.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alerts.

    ### Inputs

    - `repo_owner` (STRING, default: `kestra-io`): GitHub repository owner.
    - `repo_name` (STRING, default: `kestra`): GitHub repository name.
    - `issue_number` (INT, default: `1001`): GitHub issue number to triage.
    - `issue_title` (STRING, default: `App crashes when clicking submit button on settings page`): Issue title.
    - `issue_body` (STRING): Issue body for AI analysis.
    - `issue_url` (STRING, default: `https://github.com/kestra-io/kestra/issues/1001`): Direct URL to the GitHub issue.
    - `issue_author` (STRING, default: `community-contributor`): GitHub author username.
    - `dry_run` (BOOL, default: `false`): When true, executes entirely locally with zero external API calls.

    ### Outputs

    - `outputs.extract_issue_data`: Normalized issue parameters and dry-run flag.
    - `outputs.classify_issue`: Raw OpenAI ChatCompletion response (in live mode).
    - `outputs.mock_classification.value`: Simulated triage response (in dry-run mode).
    - `outputs.parse_and_validate_ai_response`: Validated category, priority, summary, reasoning, and target label.

    ## Quick start

    1. Configure secrets `GITHUB_WEBHOOK_KEY`, `GITHUB_TOKEN`, `OPENAI_API_KEY`, and `SLACK_WEBHOOK_URL`.
    2. Import this flow into Kestra.
    3. Run a zero-API test execution with `dry_run: true` to verify end-to-end normalization, parsing, labeling, and branching.
    4. To enable live triage, set `dry_run: false` or point your GitHub repository webhook to the Kestra webhook URL.

    ## How to extend

    - Add duplicate issue detection by querying GitHub issues before classification.
    - Extend `classification_categories` in `variables:` with custom labels (e.g. `security`, `performance`).
    - Add PagerDuty or Opsgenie escalation for `CRITICAL` priority issues in parallel with Slack.

    ## Common pitfalls

    - **Missing trailing slash in API base**: Ensure `github_api_base` does not contain a trailing slash.
    - **Webhook query parameters**: In Kestra webhooks, query parameters are parsed as lists; this blueprint handles `(trigger.parameters.dry_run | first)` safely.
    - **Unchecked JSON parsing**: Ensure all AI response extraction is guarded by `raw is json` checks.

    ## Links

    - [Kestra OpenAI Plugin](https://kestra.io/plugins/plugin-openai)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
    - [GitHub Issues REST API](https://docs.github.com/en/rest/issues/issues)
  tags:
    - AI
    - Business
  subTags:
    - Classification & Moderation
    - Incident & Ticketing Notification
  ee: false
  demo: false

inputs:
  - id: repo_owner
    type: STRING
    required: true
    defaults: "kestra-io"
    description: "GitHub repository owner (organization or user)."

  - id: repo_name
    type: STRING
    required: true
    defaults: "kestra"
    description: "GitHub repository name."

  - id: issue_number
    type: INT
    required: true
    defaults: 1001
    description: "GitHub issue number to triage."

  - id: issue_title
    type: STRING
    required: true
    defaults: "App crashes when clicking submit button on settings page"
    description: "Issue title for triage."

  - id: issue_body
    type: STRING
    required: true
    defaults: |
      Steps to reproduce:
      1. Navigate to Settings page
      2. Modify notifications setting
      3. Click Save Changes button

      Expected: Settings update confirmation toast appears
      Actual: Uncaught TypeError: Cannot read properties of undefined (reading 'submit')
      Browser: Chrome 132
    description: "Issue body/description for AI analysis."

  - id: issue_url
    type: STRING
    required: true
    defaults: "https://github.com/kestra-io/kestra/issues/1001"
    description: "Direct URL to the GitHub issue."

  - id: issue_author
    type: STRING
    required: true
    defaults: "community-contributor"
    description: "GitHub username of the issue author."

  - id: dry_run
    type: BOOL
    required: true
    defaults: false
    description: "When true, runs entirely locally with zero external API calls (no GitHub, OpenAI, or Slack requests)."

variables:
  # Execution defaults and state tracking
  is_dry_run: "false"
  repo_owner: "kestra-io"
  repo_name: "kestra"
  issue_number: 1001
  issue_title: "Untitled Issue"
  issue_body: "No description provided"
  issue_url: "https://github.com/kestra-io/kestra/issues/1001"
  issue_author: "unknown"
  ai_category: "other"
  ai_priority: "medium"
  ai_summary: "Automated triage classification"
  ai_reasoning: "Awaiting triage classification"
  target_label: "needs-triage"

  # GitHub API configuration (without trailing slash)
  github_api_base: "https://api.github.com"
  github_repo_owner: "kestra-io"
  github_repo_name: "kestra"

  # AI Model parameters
  ai_model: "gpt-4o-mini"
  ai_temperature: 0.2

  # Label mappings (Category -> GitHub Label name)
  label_bug: "bug"
  label_feature: "enhancement"
  label_documentation: "documentation"
  label_question: "question"
  label_other: "needs-triage"

  # Supported AI classification categories
  classification_categories:
    - bug
    - feature
    - documentation
    - question
    - other

triggers:
  - id: github_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Receives GitHub webhook events (e.g. issues opened or labeled)."
    key: "github-webhook"

tasks:
  - id: extract_issue_data
    type: io.kestra.plugin.core.execution.SetVariables
    description: "Extract and normalize issue data from webhook event payload or manual input parameters."
    variables:
      repo_owner: "{{ trigger.body.repository.owner.login ?? (inputs.repo_owner ?? vars.github_repo_owner) }}"
      repo_name: "{{ trigger.body.repository.name ?? (inputs.repo_name ?? vars.github_repo_name) }}"
      issue_number: "{{ trigger.body.issue.number ?? (inputs.issue_number ?? 1001) }}"
      issue_title: "{{ trigger.body.issue.title ?? (inputs.issue_title ?? 'Untitled Issue') }}"
      issue_body: "{{ trigger.body.issue.body ?? (inputs.issue_body ?? 'No description provided') }}"
      issue_url: "{{ trigger.body.issue.html_url ?? (inputs.issue_url ?? ('https://github.com/' ~ (trigger.body.repository.owner.login ?? (inputs.repo_owner ?? vars.github_repo_owner)) ~ '/' ~ (trigger.body.repository.name ?? (inputs.repo_name ?? vars.github_repo_name)) ~ '/issues/' ~ (trigger.body.issue.number ?? (inputs.issue_number ?? 1001)))) }}"
      issue_author: "{{ trigger.body.issue.user.login ?? (inputs.issue_author ?? 'unknown') }}"
      is_dry_run: >-
        {%- if trigger.parameters.dry_run is defined and trigger.parameters.dry_run is not empty -%}
          {{ (trigger.parameters.dry_run | first) == 'true' ? 'true' : 'false' }}
        {%- else -%}
          {{ (inputs.dry_run ?? false) == true ? 'true' : 'false' }}
        {%- endif -%}

  - id: fetch_issue_metadata
    type: io.kestra.plugin.core.http.Request
    description: "Fetch live issue details from GitHub REST API to retrieve current issue state and metadata."
    runIf: "{{ vars.is_dry_run != 'true' }}"
    uri: "{{ vars.github_api_base }}/repos/{{ vars.repo_owner }}/{{ vars.repo_name }}/issues/{{ vars.issue_number }}"
    method: GET
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      X-GitHub-Api-Version: "2022-11-28"
    retry:
      type: constant
      interval: PT2S
      maxAttempts: 3

  - id: classify_issue
    type: io.kestra.plugin.openai.ChatCompletion
    description: "Analyze issue contents using OpenAI LLM with strict JSON schema output (skipped when dry_run=true)."
    runIf: "{{ vars.is_dry_run != 'true' }}"
    apiKey: "{{ secret('OPENAI_API_KEY') }}"
    model: "{{ vars.ai_model }}"
    temperature: 0.2
    messages:
      - role: system
        content: |
          You are an expert GitHub issue triage bot for open source repositories.
          Analyze the provided issue title and description.
          Classify the issue into exactly one of the allowed categories: {{ vars.classification_categories | toJson }}.
          Assign an appropriate priority: "critical", "high", "medium", or "low".
          Provide a concise short_summary (max 100 characters) and a brief reasoning (max 180 characters).
          You MUST respond strictly with a valid JSON object matching the schema.
      - role: user
        content: |
          Repository: {{ vars.repo_owner }}/{{ vars.repo_name }}
          Issue #{{ vars.issue_number }}: {{ vars.issue_title }}
          Author: @{{ vars.issue_author }}

          Description:
          {{ vars.issue_body }}
    jsonResponseSchema: |
      {
        "type": "object",
        "properties": {
          "category": {
            "type": "string",
            "enum": ["bug", "feature", "documentation", "question", "other"]
          },
          "short_summary": {
            "type": "string"
          },
          "priority": {
            "type": "string",
            "enum": ["critical", "high", "medium", "low"]
          },
          "reasoning": {
            "type": "string"
          }
        },
        "required": ["category", "short_summary", "priority", "reasoning"],
        "additionalProperties": false
      }
    retry:
      type: constant
      interval: PT3S
      maxAttempts: 3

  - id: mock_classification
    type: io.kestra.plugin.core.debug.Return
    description: "Deterministic mock classification output for dry-run mode without external API calls."
    runIf: "{{ vars.is_dry_run == 'true' }}"
    format: |
      {
        "category": "bug",
        "short_summary": "Simulated bug triage: form submission error on settings page",
        "priority": "high",
        "reasoning": "Dry-run deterministic mock classification"
      }

  - id: parse_and_validate_ai_response
    type: io.kestra.plugin.core.execution.SetVariables
    description: "Safely parse AI JSON response, validate triage fields with fallbacks, and compute target label."
    variables:
      ai_category: >-
        {%- set is_dry = vars.is_dry_run == 'true' -%}
        {%- set raw = is_dry ? outputs.mock_classification.value : (outputs.classify_issue.choices[0].message.content ?? '{}') -%}
        {%- set parsed = (raw is json) ? ((raw | jq('.category') | first) | trim) : 'other' -%}
        {%- if parsed == 'bug' or parsed == 'feature' or parsed == 'documentation' or parsed == 'question' -%}{{ parsed }}{%- else -%}other{%- endif -%}
      ai_priority: >-
        {%- set is_dry = vars.is_dry_run == 'true' -%}
        {%- set raw = is_dry ? outputs.mock_classification.value : (outputs.classify_issue.choices[0].message.content ?? '{}') -%}
        {%- set parsed = (raw is json) ? ((raw | jq('.priority') | first) | trim) : 'medium' -%}
        {%- if parsed == 'critical' or parsed == 'high' or parsed == 'medium' or parsed == 'low' -%}{{ parsed }}{%- else -%}medium{%- endif -%}
      ai_summary: >-
        {%- set is_dry = vars.is_dry_run == 'true' -%}
        {%- set raw = is_dry ? outputs.mock_classification.value : (outputs.classify_issue.choices[0].message.content ?? '{}') -%}
        {%- set parsed = (raw is json) ? ((raw | jq('.short_summary') | first) | trim) : null -%}
        {{ parsed ?? vars.issue_title }}
      ai_reasoning: >-
        {%- set is_dry = vars.is_dry_run == 'true' -%}
        {%- set raw = is_dry ? outputs.mock_classification.value : (outputs.classify_issue.choices[0].message.content ?? '{}') -%}
        {%- set parsed = (raw is json) ? ((raw | jq('.reasoning') | first) | trim) : null -%}
        {{ parsed ?? 'Automated triage classification' }}
      target_label: >-
        {%- set is_dry = vars.is_dry_run == 'true' -%}
        {%- set raw = is_dry ? outputs.mock_classification.value : (outputs.classify_issue.choices[0].message.content ?? '{}') -%}
        {%- set cat = (raw is json) ? ((raw | jq('.category') | first) | trim) : 'other' -%}
        {%- if cat == 'bug' -%}{{ vars.label_bug }}
        {%- elseif cat == 'feature' -%}{{ vars.label_feature }}
        {%- elseif cat == 'documentation' -%}{{ vars.label_documentation }}
        {%- elseif cat == 'question' -%}{{ vars.label_question }}
        {%- else -%}{{ vars.label_other }}{%- endif -%}

  - id: tag_execution
    type: io.kestra.plugin.core.execution.Labels
    description: "Attach triage metadata to current Kestra execution for easy searching and filtering."
    labels:
      repository: "{{ vars.repo_owner }}_{{ vars.repo_name }}"
      issue: "{{ vars.issue_number }}"
      category: "{{ vars.ai_category }}"
      priority: "{{ vars.ai_priority }}"

  - id: branch_on_classification
    type: io.kestra.plugin.core.flow.If
    description: "Branch workflow execution: apply bug label on bug classification vs appropriate label on others."
    condition: "{{ (vars.ai_category | trim) == 'bug' }}"
    then:
      - id: apply_bug_label
        type: io.kestra.plugin.core.http.Request
        description: "Apply 'bug' label to GitHub issue via GitHub REST API."
        runIf: "{{ vars.is_dry_run != 'true' }}"
        uri: "{{ vars.github_api_base }}/repos/{{ vars.repo_owner }}/{{ vars.repo_name }}/issues/{{ vars.issue_number }}/labels"
        method: POST
        contentType: application/json
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
          X-GitHub-Api-Version: "2022-11-28"
        body: |
          {
            "labels": ["{{ vars.label_bug }}"]
          }
        retry:
          type: constant
          interval: PT2S
          maxAttempts: 3

      - id: log_bug_triage
        type: io.kestra.plugin.core.log.Log
        description: "Log triage verdict for bug flow."
        message: "Bug triage executed for #{{ vars.issue_number }} (Priority: {{ vars.ai_priority }}). Label '{{ vars.label_bug }}' applied."

    else:
      - id: apply_categorized_label
        type: io.kestra.plugin.core.http.Request
        description: "Apply categorized label (enhancement, documentation, question, needs-triage) via GitHub REST API."
        runIf: "{{ vars.is_dry_run != 'true' }}"
        uri: "{{ vars.github_api_base }}/repos/{{ vars.repo_owner }}/{{ vars.repo_name }}/issues/{{ vars.issue_number }}/labels"
        method: POST
        contentType: application/json
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
          X-GitHub-Api-Version: "2022-11-28"
        body: |
          {
            "labels": ["{{ vars.target_label }}"]
          }
        retry:
          type: constant
          interval: PT2S
          maxAttempts: 3

      - id: log_other_triage
        type: io.kestra.plugin.core.log.Log
        description: "Log triage verdict for non-bug flow."
        message: "Standard triage executed for #{{ vars.issue_number }}: classified as '{{ vars.ai_category }}' (Priority: {{ vars.ai_priority }}). Label '{{ vars.target_label }}' applied."

  - id: send_slack_notification
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Post structured triage summary to team Slack channel via incoming webhook."
    runIf: "{{ vars.is_dry_run != 'true' }}"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "GitHub Issue #{{ vars.issue_number }} triaged as [{{ vars.ai_category | upper }}] (Priority: {{ vars.ai_priority | upper }})",
        "blocks": [
          {
            "type": "header",
            "text": {
              "type": "plain_text",
              "text": "🤖 GitHub Issue Triaged & Routed",
              "emoji": true
            }
          },
          {
            "type": "section",
            "fields": [
              {
                "type": "mrkdwn",
                "text": "*Repository:*\n<https://github.com/{{ vars.repo_owner }}/{{ vars.repo_name }}|{{ vars.repo_owner }}/{{ vars.repo_name }}>"
              },
              {
                "type": "mrkdwn",
                "text": "*Issue:*\n<{{ vars.issue_url }}|#{{ vars.issue_number }} - {{ vars.issue_title }}>"
              },
              {
                "type": "mrkdwn",
                "text": "*Classification:*\n`{{ vars.ai_category }}`"
              },
              {
                "type": "mrkdwn",
                "text": "*Priority:*\n`{{ vars.ai_priority | upper }}`"
              },
              {
                "type": "mrkdwn",
                "text": "*Applied Label:*\n`{{ vars.target_label }}`"
              },
              {
                "type": "mrkdwn",
                "text": "*Author:*\n@{{ vars.issue_author }}"
              }
            ]
          },
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "*Summary:*\n{{ vars.ai_summary }}\n\n*Reasoning:*\n_{{ vars.ai_reasoning }}_"
            }
          },
          {
            "type": "actions",
            "elements": [
              {
                "type": "button",
                "text": {
                  "type": "plain_text",
                  "text": "View Issue on GitHub",
                  "emoji": true
                },
                "url": "{{ vars.issue_url }}",
                "style": "{{ vars.ai_category == 'bug' ? 'danger' : 'primary' }}"
              }
            ]
          }
        ]
      }

errors:
  - id: on_failure_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack channel if triage workflow encounters an unhandled failure."
    runIf: "{{ vars.is_dry_run != 'true' }}"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *GitHub Issue Triage Failed* for repository `{{ vars.repo_owner ?? 'unknown' }}/{{ vars.repo_name ?? 'unknown' }}` on issue `#{{ vars.issue_number ?? 'unknown' }}`. Please inspect Kestra execution `{{ execution.id }}`."
      }

  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    description: "Log failure details for execution debugging."
    level: ERROR
    message: "Issue triage execution {{ execution.id }} failed on repository {{ vars.repo_owner }}/{{ vars.repo_name }} for issue #{{ vars.issue_number }}."
