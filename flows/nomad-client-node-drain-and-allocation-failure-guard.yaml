id: nomad-client-node-drain-and-allocation-failure-guard
namespace: company.sentinel
description: Audits HashiCorp Nomad cluster coordinator endpoints for disconnected client worker nodes and recurring task allocation failures.
inputs:
  - id: nomad_api_url
    type: STRING
    defaults: http://nomad.internal:4646
  - id: max_down_nodes_threshold
    type: INT
    defaults: 0
  - id: max_failed_allocations_threshold
    type: INT
    defaults: 5
tasks:
  - id: probe_nomad_cluster_state
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_HEADER=""
        if [ -n "{{ secret('NOMAD_TOKEN') }}" ]; then
          AUTH_HEADER="-H X-Nomad-Token:{{ secret('NOMAD_TOKEN') }}"
        fi

        curl -sf -m 10 $AUTH_HEADER "{{ inputs.nomad_api_url }}/v1/nodes" > /tmp/nomad_nodes.json 2>/dev/null || echo "[]" > /tmp/nomad_nodes.json
        curl -sf -m 10 $AUTH_HEADER "{{ inputs.nomad_api_url }}/v1/allocations?filter=ClientStatus%20%3D%3D%20%22failed%22" > /tmp/nomad_allocs.json 2>/dev/null || echo "[]" > /tmp/nomad_allocs.json

        python3 - <<'PY' > /tmp/nomad_health.json
        import os, sys, json

        nodes = []
        try:
            with open("/tmp/nomad_nodes.json", "r") as f:
                nodes = json.load(f)
                if not isinstance(nodes, list):
                    nodes = []
        except Exception:
            nodes = []

        allocs = []
        try:
            with open("/tmp/nomad_allocs.json", "r") as f:
                allocs = json.load(f)
                if not isinstance(allocs, list):
                    allocs = []
        except Exception:
            allocs = []

        down_nodes = 0
        ready_nodes = 0
        for n in nodes:
            status = n.get("Status", "").lower()
            if status == "ready":
                ready_nodes += 1
            else:
                down_nodes += 1

        failed_allocs = len(allocs)

        res = {
            "total_nodes": len(nodes),
            "ready_nodes": ready_nodes,
            "down_nodes": down_nodes,
            "failed_allocations_count": failed_allocs
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/nomad_health.json"

  - id: evaluate_cluster_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_nomad_cluster_state.outputFiles['/tmp/nomad_health.json'])).down_nodes > inputs.max_down_nodes_threshold or fromJson(read(outputs.probe_nomad_cluster_state.outputFiles['/tmp/nomad_health.json'])).failed_allocations_count > inputs.max_failed_allocations_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *HashiCorp Nomad Cluster Health Sentinel Alert*
          *Nomad Endpoint:* `{{ inputs.nomad_api_url }}`
          *Disconnected/Down Nodes:* `{{ fromJson(read(outputs.probe_nomad_cluster_state.outputFiles['/tmp/nomad_health.json'])).down_nodes }}` (Threshold: `{{ inputs.max_down_nodes_threshold }}`)
          *Failed Task Allocations:* `{{ fromJson(read(outputs.probe_nomad_cluster_state.outputFiles['/tmp/nomad_health.json'])).failed_allocations_count }}` (Threshold: `{{ inputs.max_failed_allocations_threshold }}`)
          *Ready Worker Nodes:* `{{ fromJson(read(outputs.probe_nomad_cluster_state.outputFiles['/tmp/nomad_health.json'])).ready_nodes }}` / Total: `{{ fromJson(read(outputs.probe_nomad_cluster_state.outputFiles['/tmp/nomad_health.json'])).total_nodes }}`
          *Action Required:* Review client node heartbeat logs or inspect OOM-killed container allocation statuses in the Nomad web UI.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Nomad audit completed for {{ inputs.nomad_api_url }}. Ready nodes: {{ fromJson(read(outputs.probe_nomad_cluster_state.outputFiles['/tmp/nomad_health.json'])).ready_nodes }}, Down nodes: {{ fromJson(read(outputs.probe_nomad_cluster_state.outputFiles['/tmp/nomad_health.json'])).down_nodes }}, Failed allocs: {{ fromJson(read(outputs.probe_nomad_cluster_state.outputFiles['/tmp/nomad_health.json'])).failed_allocations_count }}."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: Nomad Cluster Health Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach HashiCorp Nomad HTTP API at `{{ inputs.nomad_api_url }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Nomad Client Node Drain and Task Allocation Failure Guard
  metaTitle: Nomad Client Node Drain Guard | Kestra
  shortDescription: Audits HashiCorp Nomad cluster coordinator endpoints for disconnected client worker nodes and recurring allocation failures.
  metaDescription: Audits HashiCorp Nomad cluster coordinator endpoints for disconnected client worker nodes and recurring task allocation failures.
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Infrastructure Automation
    - Monitoring & Alerting
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits HashiCorp Nomad orchestrator clusters for client node disconnects, drain stalls, and recurring task allocation failures.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the Nomad cluster inspection.
    2. Probes HashiCorp Nomad HTTP v1 endpoints (`/v1/nodes` and `/v1/allocations`).
    3. Python parser analyzes active versus degraded client worker nodes and counts failed job task allocations.
    4. An `io.kestra.plugin.core.flow.If` condition checks if disconnected nodes or failed task allocations cross configured limits.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and authentication failures.

    ## What you get

    - Early detection of disconnected client workers before scheduled batch jobs miss execution deadlines.
    - Visibility into container runtime errors or driver crashes causing repeated allocation restarts.
    - Automated execution audit trail recorded in Kestra execution artifacts for infrastructure reliability audits.

    ## Who it's for

    - Platform Engineers and SREs maintaining production HashiCorp Nomad orchestrators and microservice workloads.
    - Cloud Operations Teams managing hybrid on-premise and multi-cloud Nomad client worker pools.

    ## Why orchestrate this with Kestra

    - Declarative cluster health auditing without maintaining standalone external monitoring agents.
    - Centralized secret management for Nomad ACL management tokens via `{{ secret('NOMAD_TOKEN') }}`.
    - Seamless alerting and automated remediation pipeline integration in declarative YAML workflows.

    ## Prerequisites

    - Network route from the Kestra worker to the Nomad HTTP port 4646.
    - Nomad ACL token with `node:read` and `job:read` capabilities.

    ### Secrets

    - `NOMAD_TOKEN`: Optional ACL token for secured HashiCorp Nomad clusters.
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.nomad_api_url` to match your Nomad coordinator API endpoint.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual test run to verify telemetry collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated node un-drain or job rescheduling commands inside the `then` branch.
    - Forward historical allocation failure counts into ClickHouse or Grafana dashboards.
    - Integrate with PagerDuty for critical worker pool degradation alerts.

    ## Links

    - [Nomad HTTP API Documentation](https://developer.hashicorp.com/nomad/api-docs)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
