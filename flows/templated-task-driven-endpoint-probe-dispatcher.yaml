id: templated-task-driven-endpoint-probe-dispatcher
namespace: company.team

description: |
  Data-driven endpoint probing. Every target in a JSON list (flow input or KV entry) carries its own task spec: method,
  headers, body, timeouts. `TemplatedTask` renders and runs that spec per target, `Assert` gives the verdict, failures
  land in a KV dead-letter with a TTL, counts become metrics and labels.

labels:
  team: platform
  purpose: endpoint-probing

inputs:
  - id: targets
    type: JSON
    description: |
      One object per target. `name` (unique) and `spec` (the task to run, with its `type`) are required.
      `spec` may contain Pebble expressions such as `{{ execution.id }}`; they are rendered right before the task runs.
      Optional: `expect_status` (default 200) and `expect_body_contains` (a string the response body must contain,
      also rendered). Ignored when `targets_kv_key` is set.
    defaults: |
      [
        {"name": "httpbin-get", "expect_status": 200,
         "spec": {"type": "io.kestra.plugin.core.http.Request", "uri": "https://httpbin.org/status/200",
                  "headers": {"X-Probe-Run": "{{ execution.id }}"}}},
        {"name": "httpbin-post-echo", "expect_status": 200, "expect_body_contains": "{{ execution.id }}",
         "spec": {"type": "io.kestra.plugin.core.http.Request", "method": "POST", "uri": "https://httpbin.org/post",
                  "contentType": "application/json", "body": "{\"probe\": \"{{ flow.id }}\", \"run\": \"{{ execution.id }}\"}"}},
        {"name": "httpbin-slow", "expect_status": 200,
         "spec": {"type": "io.kestra.plugin.core.http.Request", "uri": "https://httpbin.org/delay/2",
                  "options": {"timeout": {"readIdleTimeout": "PT20S"}}}}
      ]

  - id: targets_kv_key
    type: STRING
    defaults: ""
    description: |
      When set, the target list is read from this KV key of the flow namespace (same JSON shape as `targets`) and the
      `targets` input is ignored. Lets operators change the probed endpoints without editing the flow.

  - id: mode
    type: SELECT
    values: [all, failed_only]
    defaults: all
    description: failed_only probes only the targets recorded in the dead-letter of an earlier run (useful after a fix).

  - id: fail_on_unhealthy
    type: BOOL
    defaults: true
    description: true ends the execution FAILED when at least one target is unhealthy. false only records, labels and alerts.

  - id: dead_letter_ttl
    type: DURATION
    defaults: P7D
    description: How long the dead-letter KV entry of unhealthy targets is kept. A fully healthy run deletes it.

  - id: kestra_api_url
    type: STRING
    defaults: http://localhost:8080
    description: Base URL of this Kestra instance, used for the execution link in alerts when `kestra.url` is not configured.

variables:
  tenant: main
  state_key: endpoint_probe
  allowed_task_types:
    - io.kestra.plugin.core.http.Request
  spec_defaults:
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT5S
        readIdleTimeout: PT10S

checks:
  - when: "{{ inputs.targets_kv_key != '' or (inputs.targets | jq('type == \"array\" and length > 0') | first) }}"
    message: targets must be a non-empty JSON array of target objects.
    style: ERROR
    behavior: BLOCK_EXECUTION
  - when: >-
      {{ inputs.targets_kv_key != '' or (inputs.targets
         | jq('type != "array" or all(.[]; (.name // "" | tostring | length) > 0 and (.spec | type) == "object" and ((.spec.type // "") | tostring | length) > 0)')
         | first) }}
    message: Every target needs a non-empty `name` and a `spec` object with a `type`. A spec without a type cannot be rendered into a task.
    style: ERROR
    behavior: BLOCK_EXECUTION
  - when: >-
      {{ inputs.targets_kv_key != '' or (inputs.targets
         | jq('type != "array" or (map(.name) | unique | length) == length')
         | first) }}
    message: Target names must be unique, they are the keys of the dead-letter and of the verdict rows.
    style: ERROR
    behavior: BLOCK_EXECUTION
  - when: >-
      {{ inputs.targets_kv_key != '' or (inputs.targets
         | jq('type != "array" or all(.[]; (.expect_status // 200 | type) == "number")')
         | first) }}
    message: expect_status must be a number (for example 200, not "200"), it is compared with the numeric response code.
    style: ERROR
    behavior: BLOCK_EXECUTION

concurrency:
  limit: 1
  behavior: CANCEL

sla:
  - id: probe_window
    type: MAX_DURATION
    duration: PT10M
    behavior: FAIL
    labels:
      probe_sla: breached

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    recoverMissedSchedules: NONE
    disabled: true
    description: |
      Enable once the sample targets are replaced. `recoverMissedSchedules: NONE` because a probe of the past tells you
      nothing about the present; after a downtime the next slot runs, not every missed one.

tasks:
  - id: targets_from_kv
    type: io.kestra.plugin.core.kv.Get
    description: Alternative target source. A missing key is a configuration error, so it fails the run instead of probing nothing.
    runIf: "{{ inputs.targets_kv_key != '' }}"
    key: "{{ inputs.targets_kv_key }}"
    errorOnMissing: true

  - id: dead_letter_last_run
    type: io.kestra.plugin.core.kv.Get
    description: Unhealthy targets of an earlier run, consumed by `mode = failed_only`. Absent after a healthy run or once the TTL passed.
    key: "{{ vars.state_key }}_dead_letter"
    errorOnMissing: false

  - id: validate_targets
    type: io.kestra.plugin.core.execution.Assert
    description: |
      Same rules as the flow `checks`, applied to whichever source was used. The `checks` only see the `targets` input;
      a list read from KV would otherwise reach the loop unvalidated.
    conditions:
      - "{{ (outputs.targets_from_kv.value ?? inputs.targets) | jq('type == \"array\" and length > 0') | first }}"
      - >-
        {{ (outputs.targets_from_kv.value ?? inputs.targets)
           | jq('all(.[]; (.name // "" | tostring | length) > 0 and (.spec | type) == "object" and ((.spec.type // "") | tostring | length) > 0)')
           | first }}
      - "{{ (outputs.targets_from_kv.value ?? inputs.targets) | jq('(map(.name) | unique | length) == length') | first }}"
      - "{{ (outputs.targets_from_kv.value ?? inputs.targets) | jq('all(.[]; (.expect_status // 200 | type) == \"number\")') | first }}"
    errorMessage: "Invalid target list from {{ inputs.targets_kv_key != '' ? 'KV key ' ~ inputs.targets_kv_key : 'the targets input' }}: a non-empty array, every item with a unique name, a spec object with a type, and a numeric expect_status when present."

  - id: plan
    type: io.kestra.plugin.core.output.OutputValues
    description: Picks the source and, in failed_only mode, keeps only the targets named in the dead-letter of the last run.
    values:
      source: "{{ inputs.targets_kv_key != '' ? 'kv:' ~ inputs.targets_kv_key : 'input' }}"
      targets: |-
        {{ inputs.mode == 'failed_only'
           ? ([outputs.targets_from_kv.value ?? inputs.targets, outputs.dead_letter_last_run.value ?? []]
              | jq('(.[1] | map(.name)) as $failed | [.[0][] | select([.name] | inside($failed))]')
              | first | toJson)
           : ((outputs.targets_from_kv.value ?? inputs.targets) | toJson) }}

  - id: nothing_to_probe
    type: io.kestra.plugin.core.flow.If
    description: failed_only with an empty dead-letter. The loop below runs zero iterations and the summary reports zero targets.
    condition: "{{ (fromJson(outputs.plan.values.targets) | length) == 0 }}"
    then:
      - id: log_nothing
        type: io.kestra.plugin.core.log.Log
        message: "mode = failed_only and the dead-letter is empty: no target to probe."

  - id: dispatch
    type: io.kestra.plugin.core.flow.Loop
    description: |
      One iteration per target, three at a time. `transmitFailed: false` keeps the loop going when a target fails; the
      `outputs` below collect one verdict row per target, failed ones included, so nothing is lost for the dead-letter.
    values: "{{ outputs.plan.values.targets }}"
    concurrencyLimit: 3
    transmitFailed: false
    tasks:
      - id: probe
        type: io.kestra.plugin.core.templating.TemplatedTask
        description: |
          The heart of the flow. The target's `spec` is deep-merged over `vars.spec_defaults` (jq `*`, so a target can
          override one timeout and keep the rest), serialised to JSON (valid YAML) and passed through `render()` so the
          Pebble expressions stored in the data are evaluated in this iteration's context. The rendered task runs in
          place and its outputs (`code`, `body`, `headers` for http.Request) become `outputs.probe`. `runIf` refuses task
          types outside `vars.allowed_task_types`: a target list is data, and data must not be able to run arbitrary tasks.
          `allowFailure` lets the verdict task run after a failed render or request instead of ending the iteration early.
        runIf: "{{ vars.allowed_task_types contains fromJson(item.value).spec.type }}"
        allowFailure: true
        timeout: PT2M
        spec: "{{ render([vars.spec_defaults, fromJson(item.value).spec] | jq('.[0] * .[1]') | first | toJson) }}"

      - id: verdict
        type: io.kestra.plugin.core.output.OutputValues
        description: |
          Classifies the outcome. `task_failed` covers everything that produced no response: a spec the parser rejects
          (a malformed duration, a missing `uri`), a connection error or a timeout; the exception is in the `probe` task
          logs of this iteration. A misspelled property name is not caught: the parser ignores it and the request runs.
        values:
          name: "{{ fromJson(item.value).name }}"
          code: "{{ outputs.probe.code ?? '' }}"
          status: |-
            {%- set t = fromJson(item.value) -%}
            {%- if not (vars.allowed_task_types contains t.spec.type) -%}type_not_allowed
            {%- elseif outputs.probe.code is not defined -%}task_failed
            {%- elseif outputs.probe.code != (t.expect_status ?? 200) -%}unexpected_status
            {%- elseif (t.expect_body_contains ?? '') != '' and not ((outputs.probe.body ?? '') contains render(t.expect_body_contains)) -%}body_mismatch
            {%- else -%}healthy
            {%- endif -%}
          reason: |-
            {%- set t = fromJson(item.value) -%}
            {%- if not (vars.allowed_task_types contains t.spec.type) -%}task type {{ t.spec.type }} is not in allowed_task_types
            {%- elseif outputs.probe.code is not defined -%}the rendered task returned no response, see the probe task logs of this iteration
            {%- elseif outputs.probe.code != (t.expect_status ?? 200) -%}expected HTTP {{ t.expect_status ?? 200 }}, got {{ outputs.probe.code }}
            {%- elseif (t.expect_body_contains ?? '') != '' and not ((outputs.probe.body ?? '') contains render(t.expect_body_contains)) -%}HTTP {{ outputs.probe.code }} but the body does not contain "{{ render(t.expect_body_contains) }}"
            {%- else -%}HTTP {{ outputs.probe.code }}
            {%- endif -%}

      - id: assert_healthy
        type: io.kestra.plugin.core.execution.Assert
        description: |
          Marks the iteration FAILED for an unhealthy target, so the Executions view shows which targets failed, while the
          loop itself continues (`transmitFailed: false`). The row is already collected whatever the result.
        conditions:
          - "{{ outputs.verdict.values.status == 'healthy' }}"
        errorMessage: "{{ outputs.verdict.values.name }}: {{ outputs.verdict.values.status }} ({{ outputs.verdict.values.reason }})"
    outputs:
      - id: row
        type: JSON
        value: |-
          {{ {
            'name': fromJson(item.value).name,
            'uri': fromJson(item.value).spec.uri ?? '',
            'status': outputs.verdict.values.status ?? 'no_verdict',
            'reason': outputs.verdict.values.reason ?? 'the verdict task did not run, see the iteration logs',
            'code': (outputs.verdict.values.code ?? '') != '' ? (outputs.verdict.values.code | number) : null
          } | toJson }}

  - id: summary
    type: io.kestra.plugin.core.output.OutputValues
    description: Totals and the list of unhealthy rows (anything that is not `healthy`, `no_verdict` included).
    values:
      source: "{{ outputs.plan.values.source }}"
      total: "{{ (outputs.dispatch.outputs ?? []) | length }}"
      healthy: "{{ (outputs.dispatch.outputs ?? []) | jq('[.[].outputs.row | select(.status == \"healthy\")] | length') | first }}"
      unhealthy: "{{ (outputs.dispatch.outputs ?? []) | jq('[.[].outputs.row | select(.status != \"healthy\")] | sort_by(.name)') | first | toJson }}"
      unhealthy_count: "{{ (outputs.dispatch.outputs ?? []) | jq('[.[].outputs.row | select(.status != \"healthy\")] | length') | first }}"

  - id: publish_metrics
    type: io.kestra.plugin.core.metric.Publish
    description: Counters per run, tagged with the source, for dashboards and alerting on the Kestra metrics endpoint.
    metrics:
      - type: counter
        name: probe_targets_total
        value: "{{ outputs.summary.values.total }}"
        tags:
          source: "{{ outputs.summary.values.source }}"
      - type: counter
        name: probe_targets_healthy
        value: "{{ outputs.summary.values.healthy }}"
        tags:
          source: "{{ outputs.summary.values.source }}"
      - type: counter
        name: probe_targets_unhealthy
        value: "{{ outputs.summary.values.unhealthy_count }}"
        tags:
          source: "{{ outputs.summary.values.source }}"

  - id: label_run
    type: io.kestra.plugin.core.execution.Labels
    description: Filter the Executions view by `probe_result` without opening a run.
    labels:
      probe_result: "{{ (outputs.summary.values.unhealthy_count | number) > 0 ? 'degraded' : 'healthy' }}"
      probe_unhealthy_count: "{{ outputs.summary.values.unhealthy_count }}"
      probe_source: "{{ outputs.summary.values.source }}"

  - id: log_report
    type: io.kestra.plugin.core.log.Log
    description: One line per target, WARN when something is unhealthy so a log-level filter finds degraded runs.
    level: "{{ (outputs.summary.values.unhealthy_count | number) > 0 ? 'WARN' : 'INFO' }}"
    message: |
      Probed {{ outputs.summary.values.total }} target(s) from {{ outputs.summary.values.source }}: {{ outputs.summary.values.healthy }} healthy, {{ outputs.summary.values.unhealthy_count }} unhealthy.
      {% for r in (outputs.dispatch.outputs ?? []) | jq('[.[].outputs.row] | sort_by(.name)') | first %}{{ r.name }}: {{ r.status }} ({{ r.reason }})
      {% endfor %}

  - id: dead_letter
    type: io.kestra.plugin.core.flow.If
    description: |
      Unhealthy rows are kept in KV for `dead_letter_ttl` so `mode = failed_only` can re-probe exactly them, then the
      run fails (unless `fail_on_unhealthy` is false). A fully healthy run deletes the entry.
    condition: "{{ (outputs.summary.values.unhealthy_count | number) > 0 }}"
    then:
      - id: remember_unhealthy
        type: io.kestra.plugin.core.kv.Set
        key: "{{ vars.state_key }}_dead_letter"
        kvType: JSON
        value: "{{ outputs.summary.values.unhealthy }}"
        ttl: "{{ inputs.dead_letter_ttl }}"
        kvDescription: "Unhealthy targets of execution {{ execution.id }} ({{ execution.startDate }})"
      - id: report_unhealthy
        type: io.kestra.plugin.core.execution.Fail
        condition: "{{ inputs.fail_on_unhealthy }}"
        errorMessage: >-
          {{ outputs.summary.values.unhealthy_count }} of {{ outputs.summary.values.total }} target(s) unhealthy:
          {{ fromJson(outputs.summary.values.unhealthy) | jq('map(.name + " (" + .status + ")") | join(", ")') | first }}.
          Fix the cause, then run with mode = failed_only.
    else:
      - id: clear_dead_letter
        type: io.kestra.plugin.core.kv.Delete
        key: "{{ vars.state_key }}_dead_letter"
        errorOnMissing: false

errors:
  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: >-
      Probe run failed in task {{ ((errorLogs() | length) > 0 and (errorLogs()[0].taskId ?? '') != '') ? errorLogs()[0].taskId : 'none' }}:
      {{ (errorLogs() | length) > 0 ? errorLogs()[0].message : 'no task error was logged, which is how an SLA breach ends the run' }}
      {{ kestra.url ?? inputs.kestra_api_url }}/ui/{{ vars.tenant }}/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}

  - id: remember_failure
    type: io.kestra.plugin.core.kv.Set
    description: |
      Run-level dead-letter, distinct from the per-target one: which task failed and why, for the operator who opens the
      KV store before the logs. Also written when `report_unhealthy` fails the run on purpose.
    key: "{{ vars.state_key }}_last_failure"
    kvType: JSON
    ttl: "{{ inputs.dead_letter_ttl }}"
    value: |-
      {{ {
        'execution_id': execution.id,
        'task': (errorLogs() | length) > 0 ? (errorLogs()[0].taskId ?? '') : '',
        'message': (errorLogs() | length) > 0 ? errorLogs()[0].message : 'no task error logged (SLA breach)',
        'unhealthy': outputs.summary.values.unhealthy ?? '[]',
        'date': execution.startDate
      } | toJson }}

  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: allowFailure so a missing `SLACK_WEBHOOK_URL` does not hide the original error; the same text is in the ERROR log above.
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: >-
      :rotating_light: Endpoint probe `{{ flow.id }}` failed:
      {{ (errorLogs() | length) > 0 ? errorLogs()[0].message : 'SLA breach' }}
      {{ kestra.url ?? inputs.kestra_api_url }}/ui/{{ vars.tenant }}/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}

finally:
  - id: log_outcome
    type: io.kestra.plugin.core.log.Log
    description: Runs after success, partial failure and validation errors alike, so every run ends with one line to grep for.
    message: "Outcome: {{ (outputs.summary.values ?? {'total': 0, 'healthy': 0, 'unhealthy_count': 0, 'source': 'none (run ended before the loop)'}) | toJson }}"

afterExecution:
  - id: notify_outcome
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: |
      Runs once the final state is known. Speaks when the run ended healthy or degraded without failing (the `errors`
      branch already reported failures), and on an SLA breach: on 2.0.5 a breach ends the run at once, `finally` and the
      rest of `errors` do not run, so the `probe_sla` label set by the SLA is the only signal left and this is the hook
      that reports it.
    runIf: "{{ (execution.state != 'FAILED' and (outputs.summary.values.total ?? '0') != '0') or (labels.probe_sla ?? '') == 'breached' }}"
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: >-
      {%- if (labels.probe_sla ?? '') == 'breached' -%}
      :rotating_light: Endpoint probe `{{ flow.id }}` breached its 10-minute SLA and was failed before the verdicts were collected.
      {%- else -%}
      :white_check_mark: Endpoint probe `{{ flow.id }}` ended {{ execution.state }}: {{ outputs.summary.values.healthy ?? 0 }}/{{ outputs.summary.values.total ?? 0 }} healthy
      {%- if (outputs.summary.values.unhealthy_count ?? '0') != '0' %}, unhealthy: {{ fromJson(outputs.summary.values.unhealthy) | jq('map(.name) | join(", ")') | first }}{% endif -%}.
      {%- endif %}
      {{ kestra.url ?? inputs.kestra_api_url }}/ui/{{ vars.tenant }}/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}

outputs:
  - id: summary
    type: JSON
    description: Null-safe on purpose. A run that fails before the loop (missing KV key, invalid list) still renders its outputs.
    value: "{{ {'source': outputs.summary.values.source ?? 'none', 'total': (outputs.summary.values.total ?? '0') | number, 'healthy': (outputs.summary.values.healthy ?? '0') | number, 'unhealthy_count': (outputs.summary.values.unhealthy_count ?? '0') | number} }}"
  - id: unhealthy
    type: JSON
    value: "{{ fromJson(outputs.summary.values.unhealthy ?? '[]') }}"

extend:
  title: Data-driven endpoint probes with TemplatedTask, per-target task specs, Assert verdicts and a KV dead-letter
  metaTitle: Data-Driven HTTP Endpoint Probing with TemplatedTask | Kestra
  shortDescription: Probe a list of endpoints where each target carries its own task spec (method, headers, body, timeouts). TemplatedTask renders and runs the spec per target, Assert decides, unhealthy targets go to a KV dead-letter with a TTL, counts become metrics and labels.
  metaDescription: Kestra blueprint for data-driven task dispatch. TemplatedTask renders one task spec per target from a JSON list or KV entry, Assert gives the verdict, failures land in a KV dead-letter with TTL, metrics and labels summarise the run.
  description: |
    Most teams keep a list of endpoints that must answer: internal APIs, webhooks, partner services, the health route of every deployment. The list changes often, and one `http.Request` per endpoint does not fit because every target wants something different: a `GET` with an auth header, a `POST` with a JSON body, a longer read timeout, a `418` instead of a `200`. This flow turns the list into data. Each target carries its own task `spec`; `io.kestra.plugin.core.templating.TemplatedTask` renders that spec with Pebble and runs it, so adding or changing a probe is an edit to a JSON list (flow input or KV entry), not to the flow. The sample targets use httpbin.org.

    ## How it works

    1. `targets_from_kv` (only when `targets_kv_key` is set) reads the list from the KV store, otherwise the `targets` input is used. `dead_letter_last_run` reads the unhealthy targets of an earlier run.
    2. `validate_targets` (`Assert`) applies the rules of the flow `checks` to whichever source was used: non-empty array, unique `name` and `spec.type` per target, numeric `expect_status`. The `checks` only see the `targets` input; a bad KV list would otherwise reach the loop unvalidated.
    3. `plan` picks the targets: all, or in `mode = failed_only` only those named in the last dead-letter.
    4. `dispatch` (`Loop`, three at a time, `transmitFailed: false`) runs one iteration per target:
       - `probe` (`TemplatedTask`) deep-merges the target's `spec` over `vars.spec_defaults` (jq `*`, so a target can override one timeout and keep the rest), serialises it to JSON (valid YAML) and passes it through `render()`, so expressions stored in the data, such as `{{ execution.id }}` in a header, are evaluated in the iteration's context. The rendered task runs in place; its outputs (`code`, `body`, `headers`) become `outputs.probe`. `runIf` refuses task types outside `vars.allowed_task_types`; `allowFailure: true` lets the verdict run after a failed render or request.
       - `verdict` (`OutputValues`) classifies the result: `healthy`, `unexpected_status`, `body_mismatch`, `task_failed` (no response: unparseable spec, connection error, timeout) or `type_not_allowed`, with a readable reason.
       - `assert_healthy` (`Assert`) fails the iteration for an unhealthy target, so the Executions view shows which ones failed, while the loop continues and its `outputs` collect one row per target, failed ones included.
    5. `summary` counts the rows, `publish_metrics` (`metric.Publish`) emits three counters tagged with the source, `label_run` (`Labels`) sets `probe_result`, `probe_unhealthy_count` and `probe_source`, `log_report` prints one line per target.
    6. `dead_letter` (`If`): unhealthy rows go to the KV key `endpoint_probe_dead_letter` with `dead_letter_ttl`, then `report_unhealthy` fails the run unless `fail_on_unhealthy` is false. A fully healthy run deletes the entry.

    ## What this blueprint teaches

    - **`TemplatedTask`**: a task whose definition is data. `spec` is a YAML (or JSON) string rendered with Pebble, parsed into a task and run; the rendered task's outputs are the `TemplatedTask` outputs. Two details matter: the rendered task must be runnable (no flowables, no nested `TemplatedTask`), and `spec` is rendered once, so a spec from data with its own `{{ }}` must go through `render()`.
    - **A task spec is untrusted input.** Whoever edits the KV entry could make the flow run any task type, shell commands included. `vars.allowed_task_types` plus the `runIf` on `probe` is the allow-list; a `scripts.shell.Commands` target was refused this way in the tests.
    - **Verdict first, assertion second**: `allowFailed: true` in the HTTP defaults turns a 5xx into a response with a code, so the decision belongs to `Assert` and the dead-letter says `expected HTTP 200, got 503` rather than "task failed".
    - **Loop rows survive failed iterations**: `transmitFailed: false` plus `??` fallbacks in the Loop `outputs` row keep every verdict.
    - **Dead-letter with TTL and replay**: the KV entry expires on its own, a healthy run deletes it, `mode = failed_only` re-probes exactly the targets it names.

    ## How to run

    Run with the defaults: the three httpbin targets are healthy and the run ends `SUCCESS` with label `probe_result: healthy`. Add your own endpoints to `targets`:

    ```json
    {"name": "orders-api", "expect_status": 200, "expect_body_contains": "\"status\":\"UP\"",
     "spec": {"type": "io.kestra.plugin.core.http.Request", "uri": "https://orders.example.com/health",
              "headers": {"Authorization": "Bearer {{ secret('ORDERS_TOKEN') }}"}}}
    ```

    `expect_status` defaults to 200; `expect_body_contains` is optional and rendered too. To manage the list outside the flow, store the same JSON under a KV key and set `targets_kv_key`. Set `fail_on_unhealthy: false` for labels, metrics and the recap without a failed execution. Enable the `every_15_minutes` trigger once the sample targets are replaced.

    Inputs: `targets` (JSON), `targets_kv_key` (STRING), `mode` (`all` or `failed_only`), `fail_on_unhealthy` (BOOL, default true), `dead_letter_ttl` (DURATION, default `P7D`), `kestra_api_url` (link in alerts when `kestra.url` is not configured). Secret: `SLACK_WEBHOOK_URL`, optional; both Slack tasks have `allowFailure: true` and every message is also in the logs.

    ## Error handling

    - A bad `targets` input (empty, missing `name` or `spec.type`, duplicate names, `"200"` instead of `200`) is blocked by `checks` before an execution exists, each case with its own message.
    - A missing KV key (`errorOnMissing: true`) or an invalid KV list (`validate_targets`) fails the run before anything is probed; `errors` logs the failing task and message with `errorLogs()`, writes `endpoint_probe_last_failure` to KV with the same TTL and sends the Slack alert.
    - Per target: a disallowed type, an unparseable spec (a duration written as `ten seconds`), a missing `uri`, a refused connection, a timeout, a wrong status or a body mismatch each produce a dead-letter row with a reason; the exception is in the iteration's `probe` logs. An unknown property name in a spec is ignored by the parser and the request runs with the default.
    - `concurrency: CANCEL` drops a run that starts while the previous one is still probing. The `sla` fails a run longer than 10 minutes and labels it `probe_sla: breached`; on 2.0.5 the breach ends the run at once and skips `finally`, so `afterExecution` reports it.

    ## How to adapt

    - Add a task type to `vars.allowed_task_types` to probe something other than HTTP, for example `io.kestra.plugin.jdbc.postgresql.Query` with `SELECT 1`; the verdict then reads that task's output instead of `code`.
    - Change `vars.spec_defaults` for fleet-wide timeouts, `followRedirects`, `allowedResponseCodes` or a `retry` block.
    - Raise `concurrencyLimit` on `dispatch` for hundreds of targets, lower it for rate-limited services.

