id: spicedb-schema-watch-stream-disconnect-sentinel
namespace: company.security

inputs:
  - id: spicedb_endpoint
    type: STRING
    defaults: "http://spicedb.internal:8443"
    description: Host and port of the SpiceDB gRPC/HTTP endpoint.

tasks:
  - id: inspect_spicedb_readiness
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      ENDPOINT: "{{ inputs.spicedb_endpoint }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      endpoint = os.environ.get("ENDPOINT", "").rstrip("/")
      if not endpoint:
          print("Error: ENDPOINT is required", file=sys.stderr)
          sys.exit(1)

      try:
          resp = requests.get(f"{endpoint}/healthz", timeout=10)
          content = resp.text.strip()
          is_ready = 1 if ("SERVING" in content or "ok" in content.lower()) else 0
          is_breach = 1 if is_ready == 0 else 0
          health_status = content
      except Exception as exc:
          print(f"Error querying SpiceDB healthz: {exc}", file=sys.stderr)
          sys.exit(1)

      print(f"SpiceDB Readiness: is_breach={is_breach}, status={health_status}")

      Kestra.outputs({
          "is_breach": is_breach,
          "health_status": health_status
      })

  - id: evaluate_spicedb_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_spicedb_readiness.vars.is_breach | int == 1 }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#security-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 SpiceDB ReBAC Authorization Cluster Unready Alert",
                "text": "SpiceDB cluster at {{ inputs.spicedb_endpoint }} returned health status: {{ outputs.inspect_spicedb_readiness.vars.health_status }}. Fine-grained permission checks and relationship evaluations are failing.",
                "footer": "Kestra Security Sentinel • SpiceDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#security-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ SpiceDB Sentinel Failure",
            "text": "Failed to communicate with SpiceDB endpoint at {{ inputs.spicedb_endpoint }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

outputs:
  - id: is_breach
    type: INT
    value: "{{ outputs.inspect_spicedb_readiness.vars.is_breach }}"
  - id: health_status
    type: STRING
    value: "{{ outputs.inspect_spicedb_readiness.vars.health_status }}"

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  metaDescription: "Audits SpiceDB fine-grained authorization clusters to detect datastore disconnects and permission check failures."
  metaTitle: SpiceDB Authorization Engine Health and Readiness Sentinel with Kestra
  ee: false
  demo: false
  title: SpiceDB Authorization Engine Health and Readiness Sentinel
  shortDescription: Audits SpiceDB fine-grained authorization clusters to detect datastore disconnects and permission check failures.
  description: |
    ## How it works
    This workflow connects to a SpiceDB (Google Zanzibar-inspired relationship-based access control engine) cluster via its health check endpoint (`/healthz`) to verify datastore readiness and gRPC serving states. SpiceDB powers fine-grained permission evaluations for microservices. When the underlying CockroachDB or PostgreSQL datastore experiences connection pool exhaustion or schema migrations lock datastore tables, SpiceDB transitions out of `SERVING` state, rejecting all incoming `CheckPermission` calls. This sentinel audits cluster health and alerts security teams before access control failures block application logins.

    ## What you get
    - Continuous surveillance of SpiceDB cluster readiness and serving status.
    - Protection against cascading access control outages across microservices.
    - Automated Slack incident notifications detailing health response status.

    ## Who it's for
    - Application Security and IAM Platform Engineers implementing ReBAC.
    - SREs safeguarding central authorization engine uptime.
    - Backend Architects managing Zanzibar-style authorization topologies.

    ## Why orchestrate this with Kestra
    - **High-Frequency Health Checks**: Executes lightweight cluster audits every 5 minutes.
    - **Native API Capabilities**: Interacts directly with HTTP and gRPC health interfaces.
    - **Incident Orchestration**: Notifies platform engineers directly in team collaboration channels.

    ## Prerequisites
    - Running SpiceDB instance with accessible HTTP/gRPC health port (`8443`).
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK` secret to your namespace.
    3. Specify `spicedb_endpoint`.
    4. Enable the schedule trigger for continuous authorization surveillance.

    ## How to extend
    - Execute a synthetic `CheckPermission` call using the `zed` CLI.
    - Audit relationship tuple dispatch latency metrics via Prometheus endpoint.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [SpiceDB Documentation](https://authzed.com/docs/spicedb)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - Infrastructure Automation
