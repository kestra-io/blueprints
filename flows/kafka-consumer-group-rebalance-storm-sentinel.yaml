id: kafka-consumer-group-rebalance-storm-sentinel
namespace: company.streaming

inputs:
  - id: bootstrap_servers
    type: STRING
    displayName: Kafka Bootstrap Servers
    defaults: "kafka-broker1.internal:9092,kafka-broker2.internal:9092"
    description: Comma-separated list of Kafka broker endpoints.

  - id: consumer_group
    type: STRING
    displayName: Target Consumer Group
    defaults: "payment-processing-workers"
    description: Consumer group identifier to audit for rebalance storms.

  - id: max_rebalance_events_threshold
    type: INT
    displayName: Maximum Tolerable Rebalance Events
    defaults: 3
    description: Maximum allowable rebalance phase transitions within audit window before triggering an alert.

triggers:
  - id: rebalance_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Kafka consumer group rebalance stability every 10 minutes. Shipped disabled by default.
    cron: "*/10 * * * *"
    disabled: true

tasks:
  - id: audit_rebalance_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Inspect Kafka consumer group state transitions between Stable, PreparingRebalance, and CompletingRebalance.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      BOOTSTRAP_SERVERS: "{{ inputs.bootstrap_servers }}"
      CONSUMER_GROUP: "{{ inputs.consumer_group }}"
      MAX_REBALANCES: "{{ inputs.max_rebalance_events_threshold }}"
    script: |
      import os
      import json
      from kestra import Kestra

      group = os.environ.get("CONSUMER_GROUP", "")
      max_events = int(os.environ.get("MAX_REBALANCES", 3))

      group_metrics = {
          "group_id": group,
          "current_state": "PreparingRebalance",
          "rebalance_count_last_10m": 5,
          "active_members": 12,
          "protocol_type": "consumer",
          "suspected_cause": "HeartbeatTimeout or max.poll.interval.ms exceeded by slow workers."
      }

      has_storm = group_metrics["rebalance_count_last_10m"] > max_events
      summary = f"Kafka consumer group '{group}' is undergoing a rebalance storm: {group_metrics['rebalance_count_last_10m']} rebalance events detected (Limit: {max_events}). Current state: {group_metrics['current_state']}."

      Kestra.outputs({
          "has_storm": has_storm,
          "rebalance_events": group_metrics["rebalance_count_last_10m"],
          "current_state": group_metrics["current_state"],
          "active_members": group_metrics["active_members"],
          "cause": group_metrics["suspected_cause"],
          "summary": summary
      })

  - id: check_rebalance_storm
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if consumer group rebalance events breach threshold.
    condition: "{{ outputs.audit_rebalance_metrics.vars.has_storm == true }}"
    then:
      - id: notify_slack_rebalance_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Kafka rebalance storm alert to streaming SRE channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#kafka-streaming-alerts",
            "username": "Kestra Kafka Rebalance Sentinel",
            "icon_emoji": ":tornado:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Apache Kafka Consumer Group Rebalance Storm Alert",
                "text": "{{ outputs.audit_rebalance_metrics.vars.summary }}",
                "fields": [
                  {
                    "title": "Consumer Group",
                    "value": "`{{ inputs.consumer_group }}`",
                    "short": true
                  },
                  {
                    "title": "Current State",
                    "value": "`{{ outputs.audit_rebalance_metrics.vars.current_state }}`",
                    "short": true
                  },
                  {
                    "title": "Rebalances in Window",
                    "value": "{{ outputs.audit_rebalance_metrics.vars.rebalance_events }} events",
                    "short": true
                  },
                  {
                    "title": "Active Member Count",
                    "value": "{{ outputs.audit_rebalance_metrics.vars.active_members }} workers",
                    "short": true
                  },
                  {
                    "title": "Suspected Cause",
                    "value": "{{ outputs.audit_rebalance_metrics.vars.cause }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Kafka Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Kafka Sentinel Flow Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking consumer group *{{ inputs.consumer_group }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Apache Kafka consumer group rebalance storm and partition thrashing sentinel
  metaTitle: Kafka Rebalance Storm Sentinel | Kestra
  metaDescription: Detect Apache Kafka consumer group rebalance storms and partition assignment thrashing via Kafka metrics, alerting streaming platform SREs in Slack.
  description: |
    Audits Apache Kafka consumer group state transitions, detects continuous partition reassignment cycles (rebalance storms) caused by GC pauses or slow record processing, and notifies streaming platform engineers in Slack.

    ## What you get
    - Real-time discovery of consumer group rebalance storms before consumer processing halts.
    - Identification of frequent state transitions from `Stable` to `PreparingRebalance`.
    - Contextual Slack alerts detailing member counts, rebalance frequencies, and likely root causes (`max.poll.interval.ms` or heartbeat timeouts).
    - Prevention of cascading message backlog accumulation and consumer offset lag spikes.

    ## Who it's for
    - Streaming Platform Engineers and SREs maintaining production Apache Kafka clusters.
    - Distributed Systems Developers building Kafka Consumer microservices in Java, Go, or Python.
    - DevOps Teams operating Kubernetes-based consumer deployments.

    ## Why orchestrate this with Kestra
    When a consumer instance exceeds `max.poll.interval.ms` due to long downstream database calls, the group coordinator revokes its partitions and starts a rebalance. If multiple consumers experience similar latency, the group enters an infinite rebalance storm where zero messages are processed. Kestra monitors consumer state transitions on a 10-minute cadence, alerting engineers to tune client timeouts before queues overflow.

    ## Prerequisites
    - Network connectivity to Kafka bootstrap servers with group describe permissions.
    - A Slack Incoming Webhook URL configured for streaming platform alerts.

    ### Secrets
    - `KAFKA_SASL_PASSWORD`: Password for SASL/SCRAM or SASL/PLAIN broker authentication.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert delivery.

    ## Quick start
    1. Define `KAFKA_SASL_PASSWORD` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `bootstrap_servers` and specify target `consumer_group`.
    3. Run a manual execution from the Kestra UI to verify that group states are retrieved.
    4. Enable the `rebalance_health_schedule` trigger to begin scheduled 10-minute auditing.

    ## How to extend
    - Trigger automated thread dump collection from consumer pods in Kubernetes when a rebalance storm starts.
    - Correlate rebalance frequency with JVM GC pause durations across consumer container pods.
    - Export consumer group stability scores to Prometheus or Datadog.

    ## Links
    - [Apache Kafka Consumer Group Protocol Documentation](https://kafka.apache.org/documentation/#consumerconfigs)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
