id: elasticsearch-snapshot-then-delete-retention
namespace: company.team

inputs:
  - id: index_pattern
    type: STRING
    displayName: Index pattern
    description: Indices this retention policy applies to.
    defaults: app-logs-*

  - id: write_alias
    type: STRING
    displayName: Write alias
    description: The current write index behind this alias is never deleted, whatever its age.
    defaults: app-logs-write

  - id: retention_days
    type: FLOAT
    displayName: Retention in days
    description: Indices created before now minus this many days are archived then deleted. Decimals are allowed for tests, for example 0.002 is about 3 minutes.
    defaults: 30

  - id: snapshot_repository
    type: STRING
    displayName: Snapshot repository
    description: A registered Elasticsearch snapshot repository (S3, GCS, Azure or shared filesystem).
    defaults: retention_repo

  - id: max_indices_per_run
    type: INT
    displayName: Max indices per run
    description: Safety cap. A wrong pattern or retention cannot delete more than this many indices in one run.
    defaults: 10

  - id: notify_slack
    type: BOOL
    displayName: Notify Slack
    description: Post the result to Slack. Needs the SLACK_WEBHOOK_URL secret.
    defaults: false

variables:
  cutoff_ms: "{{ (now() | timestampMilli) - (inputs.retention_days * 86400000) }}"

concurrency:
  limit: 1

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run the retention sweep every night at 02:00.
    cron: "0 2 * * *"

tasks:
  - id: cluster_health
    type: io.kestra.plugin.elasticsearch.Request
    description: Read cluster health. A red cluster is never touched.
    connection:
      hosts:
        - "{{ secret('ELASTICSEARCH_HOST') }}"
      basicAuth:
        username: "{{ secret('ELASTICSEARCH_USERNAME') }}"
        password: "{{ secret('ELASTICSEARCH_PASSWORD') }}"
    method: GET
    endpoint: _cluster/health

  - id: verify_repository
    type: io.kestra.plugin.elasticsearch.Request
    description: Ask every node to check it can write to the snapshot repository before anything is archived.
    connection:
      hosts:
        - "{{ secret('ELASTICSEARCH_HOST') }}"
      basicAuth:
        username: "{{ secret('ELASTICSEARCH_USERNAME') }}"
        password: "{{ secret('ELASTICSEARCH_PASSWORD') }}"
    method: POST
    endpoint: "_snapshot/{{ inputs.snapshot_repository }}/_verify"

  - id: preflight
    type: io.kestra.plugin.core.flow.If
    description: >
      The Request task succeeds on any HTTP status, so the flow checks status codes
      itself. Stop when the cluster is red or the repository is not usable.
    condition: "{{ outputs.cluster_health.status == 200 and outputs.cluster_health.response.status != 'red' and outputs.verify_repository.status == 200 }}"
    then:
      - id: list_indices
        type: io.kestra.plugin.elasticsearch.Request
        description: Read the creation date of every index matching the pattern.
        connection:
          hosts:
            - "{{ secret('ELASTICSEARCH_HOST') }}"
          basicAuth:
            username: "{{ secret('ELASTICSEARCH_USERNAME') }}"
            password: "{{ secret('ELASTICSEARCH_PASSWORD') }}"
        method: GET
        endpoint: "{{ inputs.index_pattern }}/_settings"
        parameters:
          filter_path: "*.settings.index.creation_date"
          expand_wildcards: open

      - id: write_index
        type: io.kestra.plugin.elasticsearch.Request
        description: Find the index the write alias currently points at.
        connection:
          hosts:
            - "{{ secret('ELASTICSEARCH_HOST') }}"
          basicAuth:
            username: "{{ secret('ELASTICSEARCH_USERNAME') }}"
            password: "{{ secret('ELASTICSEARCH_PASSWORD') }}"
        method: GET
        endpoint: "_alias/{{ inputs.write_alias }}"

      - id: plan
        type: io.kestra.plugin.core.output.OutputValues
        description: Oldest first, older than the cutoff, never the write index, at most max_indices_per_run.
        values:
          write_index: "{{ outputs.write_index.status == 200 ? (outputs.write_index.response | jq('to_entries | map(select(.value.aliases | to_entries | any(.value.is_write_index == true))) | (.[0].key // \"\")') | first) : '' }}"
          expired: >-
            {{ (outputs.list_indices.status == 200 and outputs.list_indices.response is not empty)
              ? (outputs.list_indices.response | jq('to_entries
                  | map({name: .key, created: (.value.settings.index.creation_date | tonumber)})
                  | map(select(.created < ' ~ render(vars.cutoff_ms) ~ '))
                  | sort_by(.created) | map(.name)') | first)
              : [] }}

      - id: anything_to_do
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.plan.values.expired | jq('map(select(. != \"' ~ outputs.plan.values.write_index ~ '\")) | length') | first > 0 }}"
        then:
          - id: selected
            type: io.kestra.plugin.core.output.OutputValues
            values:
              indices: "{{ outputs.plan.values.expired | jq('map(select(. != \"' ~ outputs.plan.values.write_index ~ '\")) | .[0:' ~ inputs.max_indices_per_run ~ ']') | first }}"

          - id: archive_and_delete
            type: io.kestra.plugin.core.flow.Loop
            description: One index at a time. A failed snapshot stops that index and fails the run, so nothing is deleted without a good archive.
            values: "{{ outputs.selected.values.indices }}"
            concurrencyLimit: 1
            tasks:
              - id: snapshot
                type: io.kestra.plugin.elasticsearch.Request
                description: Snapshot this one index and wait for the result.
                connection:
                  hosts:
                    - "{{ secret('ELASTICSEARCH_HOST') }}"
                  basicAuth:
                    username: "{{ secret('ELASTICSEARCH_USERNAME') }}"
                    password: "{{ secret('ELASTICSEARCH_PASSWORD') }}"
                method: PUT
                endpoint: "_snapshot/{{ inputs.snapshot_repository }}/retention-{{ item.value }}-{{ execution.startDate | date('yyyyMMdd-HHmmss') }}"
                parameters:
                  wait_for_completion: "true"
                body:
                  indices: "{{ item.value }}"
                  include_global_state: false
                  metadata:
                    reason: retention
                    kestra_execution: "{{ execution.id }}"

              - id: snapshot_ok
                type: io.kestra.plugin.core.flow.If
                description: Delete only when the snapshot is SUCCESS with every shard copied.
                condition: "{{ outputs.snapshot.status == 200 and outputs.snapshot.response.snapshot.state == 'SUCCESS' and outputs.snapshot.response.snapshot.shards.failed == 0 and outputs.snapshot.response.snapshot.shards.successful == outputs.snapshot.response.snapshot.shards.total }}"
                then:
                  - id: delete_index
                    type: io.kestra.plugin.elasticsearch.Request
                    description: Delete this exact index by name, never a wildcard.
                    connection:
                      hosts:
                        - "{{ secret('ELASTICSEARCH_HOST') }}"
                      basicAuth:
                        username: "{{ secret('ELASTICSEARCH_USERNAME') }}"
                        password: "{{ secret('ELASTICSEARCH_PASSWORD') }}"
                    method: DELETE
                    endpoint: "{{ item.value }}"

                  - id: delete_ok
                    type: io.kestra.plugin.core.flow.If
                    condition: "{{ outputs.delete_index.status != 200 }}"
                    then:
                      - id: delete_failed
                        type: io.kestra.plugin.core.execution.Fail
                        errorMessage: "Snapshot of {{ item.value }} is good but the delete returned HTTP {{ outputs.delete_index.status }}: {{ outputs.delete_index.response | toJson }}"
                else:
                  - id: snapshot_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: "Snapshot of {{ item.value }} failed (HTTP {{ outputs.snapshot.status }}): {{ outputs.snapshot.response | toJson }}. The index was kept."

          - id: log_done
            type: io.kestra.plugin.core.log.Log
            message: >-
              Archived to {{ inputs.snapshot_repository }} then deleted {{ outputs.selected.values.indices | jq('length') | first }} index(es):
              {{ outputs.selected.values.indices | jq('join(", ")') | first }}. Write index {{ outputs.plan.values.write_index }} kept.

          - id: notify_done
            type: io.kestra.plugin.core.flow.If
            condition: "{{ inputs.notify_slack }}"
            then:
              - id: slack_done
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                payload: |
                  {
                    "text": "Elasticsearch retention: snapshotted then deleted {{ outputs.selected.values.indices | jq('join(", ")') | first }}. Snapshots are in {{ inputs.snapshot_repository }}. Execution {{ execution.id }}."
                  }
        else:
          - id: nothing_expired
            type: io.kestra.plugin.core.log.Log
            message: "No index matching {{ inputs.index_pattern }} is older than {{ inputs.retention_days }} days (write index {{ outputs.plan.values.write_index }} is always kept)."
    else:
      - id: preflight_failed
        type: io.kestra.plugin.core.execution.Fail
        description: End the run as FAILED. No index was snapshotted or deleted.
        errorMessage: "Preflight failed: cluster HTTP {{ outputs.cluster_health.status }} status {{ outputs.cluster_health.response.status ?? 'unknown' }}, repository verify HTTP {{ outputs.verify_repository.status }} {{ outputs.verify_repository.response | toJson }}"

errors:
  - id: notify_error
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.notify_slack }}"
    then:
      - id: slack_error
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Elasticsearch retention FAILED for {{ inputs.index_pattern }}. Any index without a successful snapshot was kept. Check execution {{ execution.id }}."
          }

extend:
  title: Archive Elasticsearch indices to a snapshot before retention deletes them
  metaTitle: Snapshot-then-delete Elasticsearch retention with Kestra
  shortDescription: Find indices past retention, snapshot each one, check the snapshot copied every shard, then delete that exact index. The write index is never touched.
  metaDescription: Elasticsearch retention that never loses data. Kestra snapshots each expired index, checks every shard, then deletes it by exact name. Write index protected.
  description: |
    Retention policies delete old indices. When someone later needs last quarter's logs for an audit or an incident review, the data is gone. This flow archives each expired index to a snapshot repository first, checks that the snapshot is `SUCCESS` with every shard copied, and only then deletes that one index, by its exact name. Any problem stops the run before data is lost.

    Safeguards:
    - A red cluster or a repository that fails `_verify` stops the run before anything is touched.
    - The index behind the write alias is never selected, whatever its age.
    - `max_indices_per_run` caps the damage of a wrong pattern or retention value.
    - Deletes use the exact index name, never a wildcard, so the cluster default `action.destructive_requires_name: true` stays on.
    - `io.kestra.plugin.elasticsearch.Request` reports success on any HTTP status, so the flow checks every status code and the snapshot body itself.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## How it works

    1. `cluster_health` and `verify_repository` (`io.kestra.plugin.elasticsearch.Request`) read `_cluster/health` and call `POST _snapshot/<repository>/_verify`.
    2. `preflight` (`io.kestra.plugin.core.flow.If`) continues only on a non-red cluster and a verified repository. Otherwise `preflight_failed` ends the run as `FAILED` with both responses.
    3. `list_indices` reads `index.creation_date` for every index matching `index_pattern`. `write_index` resolves the write alias.
    4. `plan` (`io.kestra.plugin.core.output.OutputValues`) selects indices created before now minus `retention_days`, oldest first. `selected` removes the write index and applies `max_indices_per_run`.
    5. `archive_and_delete` (`io.kestra.plugin.core.flow.Loop`, one at a time) handles each index:
       - `snapshot`: `PUT _snapshot/<repository>/retention-<index>-<timestamp>?wait_for_completion=true` for that index only.
       - `snapshot_ok` (`If`): state `SUCCESS`, `shards.failed == 0` and `successful == total`. Then `delete_index` sends `DELETE <index>` and checks for HTTP 200.
       - Any failure ends the run through `io.kestra.plugin.core.execution.Fail`. The index is kept.
    6. `log_done` lists what was archived and deleted. `errors` posts a Slack alert when `notify_slack` is on.

    ## Inputs

    - `index_pattern` (STRING, default `app-logs-*`): indices covered by the policy.
    - `write_alias` (STRING, default `app-logs-write`): its write index is always kept.
    - `retention_days` (FLOAT, default `30`): age in days, based on `index.creation_date`.
    - `snapshot_repository` (STRING, default `retention_repo`): a registered snapshot repository.
    - `max_indices_per_run` (INT, default `10`): safety cap.
    - `notify_slack` (BOOL, default `false`): post results to Slack.

    ## Prerequisites

    - Elasticsearch 8.x with a snapshot repository registered, for example `PUT _snapshot/retention_repo {"type": "s3", "settings": {"bucket": "es-archive"}}`.
    - A user with `monitor`, `manage_snapshots`, `view_index_metadata` and `delete_index` on the pattern.

    ### Secrets

    - `ELASTICSEARCH_HOST`: cluster URL, for example `https://es.example.com:9200`.
    - `ELASTICSEARCH_USERNAME` and `ELASTICSEARCH_PASSWORD`: the user above.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook. Only needed when `notify_slack` is `true`.

    ## Quick start

    1. Register the snapshot repository and add the secrets.
    2. Run the flow with the defaults. With no index older than 30 days the log says so and nothing changes.
    3. On a test cluster, run it with a small `retention_days` such as `0.001` and `max_indices_per_run: 1`. One index is snapshotted, then deleted.
    4. Restore an archived index when needed: `POST _snapshot/<repository>/<snapshot>/_restore {"indices": "<index>"}`.

    ## Expected outputs

    - One snapshot per deleted index, named `retention-<index>-<yyyyMMdd-HHmmss>`, with `metadata.kestra_execution` set to the execution id.
    - `outputs.selected.values.indices`: the indices archived and deleted in this run.

    ## How to extend

    - Read the age from a date in the index name when indices are reindexed and lose their original creation date.
    - Add a second policy that deletes snapshots older than the legal hold period.
    - Run one flow per index family with different `retention_days`.

    ## Links

    - Elasticsearch plugin: https://kestra.io/plugins/plugin-elasticsearch
    - Snapshot and restore: https://www.elastic.co/guide/en/elasticsearch/reference/current/snapshot-restore.html
    - Verify repository API: https://www.elastic.co/guide/en/elasticsearch/reference/current/verify-snapshot-repo-api.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Policy & Compliance
  ee: false
  demo: false
