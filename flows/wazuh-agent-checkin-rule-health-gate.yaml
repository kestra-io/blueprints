id: wazuh-agent-checkin-rule-health-gate
namespace: company.team
description: |
  Wazuh agents that stop checking in and detection rules that stop firing both
  mean the fleet went blind, and neither signal ever gated anything. A keyed
  webhook accepts the manager state JSON, a WorkingDirectory materializes it
  for a Python grade that scores every agent's check-in lag against a threshold
  and every rule's 24 hour fire count against an expectation, then a Loop walks
  the graded agents for the execution record. Any dark agent or silent rule
  pages Slack, an unreadable state pages Slack through its own branch, and the
  verdict, the blind agent names, the worst lag and the silent rules are
  published as outputs.

triggers:
  - id: post_manager_state
    type: io.kestra.plugin.core.trigger.Webhook
    description: POST the Wazuh manager state JSON here from the manager or a reporting sidecar after each check-in cycle.
    key: "{{ secret('WAZUH_WEBHOOK_KEY') }}"
  - id: hourly_health_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Fallback net, an hourly fleet health sweep, shipped disabled until an operator switches it on.
    cron: "0 * * * *"
    disabled: true

inputs:
  - id: manager_state
    type: JSON
    defaults:
      manager: prod-wazuh-1
      agents:
        - name: win-eng-011
          status: active
          last_checkin_minutes: 4
          rules_fired_24h: 12
        - name: linux-db-004
          status: active
          last_checkin_minutes: 96
          rules_fired_24h: 3
        - name: k8s-edge-007
          status: never_connected
          last_checkin_minutes: 420
          rules_fired_24h: 0
      rules:
        - name: SQL Injection Attempt
          fired_24h: 6
        - name: Multiple Authentication Failures
          fired_24h: 9
        - name: Local Rootkit Detection
          fired_24h: 0
    description: Wazuh manager state the grade uses when no webhook body is posted, shaped as a manager name with an agents array and a rules array.
  - id: checkin_threshold_minutes
    type: INT
    defaults: 180
    description: Highest check-in lag in minutes an agent may reach before it counts as blind.
  - id: expected_rule_fires
    type: INT
    defaults: 1
    description: Lowest number of times a detection rule must fire in 24 hours before it counts as silent.

tasks:
  # --- 1. manager snapshot grade ---
  - id: checkin_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the shell step that writes the snapshot and the Python step that grades it read the same file.
    tasks:
      - id: write_state_snapshot
        type: io.kestra.plugin.scripts.shell.Commands
        description: Materialize the posted manager state, or the input default on manual runs, into the shared workspace with a quoted heredoc and size it for the log.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          entryPoint: []
        containerImage: python:3.12-slim
        commands:
          - |
            set -u
            cat > manager_state.json <<'STATE_EOF'
            {{ (trigger.body ?? inputs.manager_state) | toJson }}
            STATE_EOF
            echo "wrote $(wc -c < manager_state.json) bytes of Wazuh manager state to the shared workspace"

      - id: grade_checkins
        type: io.kestra.plugin.scripts.python.Script
        description: Score every agent's check-in lag and status against the threshold, collect the rules that fired below the expectation, and emit the fleet verdict through the outputs protocol.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.12-slim
        env:
          CHECKIN_THRESHOLD_MINUTES: "{{ inputs.checkin_threshold_minutes }}"
          EXPECTED_RULE_FIRES: "{{ inputs.expected_rule_fires }}"
        script: |
          import json
          import os

          STATE_FILE = "manager_state.json"

          def env_int(name, default):
              try:
                  return int(os.environ.get(name, default))
              except (TypeError, ValueError):
                  return int(default)

          CHECKIN_THRESHOLD_MINUTES = env_int("CHECKIN_THRESHOLD_MINUTES", 180)
          EXPECTED_RULE_FIRES = env_int("EXPECTED_RULE_FIRES", 1)

          def load_state(path):
              try:
                  if not os.path.exists(path) or os.path.getsize(path) == 0:
                      return None, "manager state file is missing or empty"
                  with open(path, "r", encoding="utf-8") as handle:
                      document = json.load(handle)
                  document = json.loads(document) if isinstance(document, str) else document
                  if not isinstance(document, dict):
                      return None, "manager state is not a JSON object"
                  return document, ""
              except ValueError:
                  return None, "manager state is not valid JSON"

          state, problem = load_state(STATE_FILE)

          manager = "unknown-manager"
          agent_rows = []
          blind_names = []
          silent_rules = []
          worst_lag = 0
          agents_checked = 0
          error = ""
          verdict = "healthy"

          if state is None:
              verdict = "error"
              error = problem
          else:
              manager = str(state.get("manager") or "unknown-manager")
              entries = [row for row in (state.get("agents") or []) if isinstance(row, dict)]
              rules = [row for row in (state.get("rules") or []) if isinstance(row, dict)]
              if not entries:
                  verdict = "error"
                  error = "manager state contains no agents"
              else:
                  for entry in entries:
                      name = str(entry.get("name") or "unnamed-agent")
                      status = str(entry.get("status") or "unknown")
                      try:
                          lag = int(entry.get("last_checkin_minutes") or 0)
                      except (TypeError, ValueError):
                          lag = 0
                      try:
                          fired = int(entry.get("rules_fired_24h") or 0)
                      except (TypeError, ValueError):
                          fired = 0
                      blind = status != "active" or lag > CHECKIN_THRESHOLD_MINUTES
                      agent_rows.append({
                          "name": name,
                          "status": status,
                          "lag_minutes": lag,
                          "rules_fired_24h": fired,
                          "blind": blind,
                      })
                      if blind:
                          blind_names.append(name)
                      worst_lag = max(worst_lag, lag)
                  for rule in rules:
                      rule_name = str(rule.get("name") or "unnamed-rule")
                      try:
                          fired = int(rule.get("fired_24h") or 0)
                      except (TypeError, ValueError):
                          fired = 0
                      if fired < EXPECTED_RULE_FIRES:
                          silent_rules.append(rule_name)
                  agents_checked = len(agent_rows)
                  verdict = "blind_spots" if (blind_names or silent_rules) else "healthy"

          payload = {
              "verdict": verdict,
              "manager": manager,
              "agents_checked": agents_checked,
              "agents": agent_rows,
              "blind_count": len(blind_names),
              "blind_agents": sorted(blind_names),
              "worst_lag_minutes": worst_lag,
              "silent_rules": sorted(silent_rules),
              "silent_rule_count": len(silent_rules),
              "rules_expected": EXPECTED_RULE_FIRES,
              "error": error,
          }
          print("manager=%s checked=%d blind=%d silent=%d verdict=%s" % (
              manager, agents_checked, len(blind_names), len(silent_rules), verdict))
          print("::" + json.dumps({"outputs": payload}) + "::")

  # --- 2. per agent record ---
  - id: loop_agents
    type: io.kestra.plugin.core.flow.Loop
    description: Walk every graded agent so the execution history names each lag and rule contribution even when the gate passes.
    values: "{{ outputs.grade_checkins.vars.agents }}"
    concurrencyLimit: 4
    runIf: "{{ (outputs.grade_checkins.vars.agents | length) > 0 }}"
    tasks:
      - id: log_agent_state
        type: io.kestra.plugin.core.flow.If
        description: Split each agent into the blind branch when it stopped checking in, and the reporting branch otherwise.
        condition: "{{ item.value.blind == true }}"
        then:
          - id: log_blind_agent
            type: io.kestra.plugin.core.log.Log
            description: Record the dark agent with its status, lag and rule fire count.
            message: "blind agent {{ item.value.name }} status {{ item.value.status }} lag {{ item.value.lag_minutes }}m rules fired {{ item.value.rules_fired_24h }} in 24h"
        else:
          - id: log_reporting_agent
            type: io.kestra.plugin.core.log.Log
            description: Record the reporting agent with its status, lag and rule fire count.
            message: "reporting agent {{ item.value.name }} status {{ item.value.status }} lag {{ item.value.lag_minutes }}m rules fired {{ item.value.rules_fired_24h }} in 24h"

  # --- 3. verdict gate ---
  - id: gate_fleet_health
    type: io.kestra.plugin.core.flow.If
    description: Escalate to Slack when any agent went dark or any detection rule stopped firing, and verify the error branch instead of trusting a parse failure.
    condition: "{{ outputs.grade_checkins.vars.verdict == 'blind_spots' }}"
    then:
      - id: alert_blind_spots
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Tell the security channel which agents stopped checking in and which rules went silent, with the worst lag.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Wazuh fleet blind spot on {{ outputs.grade_checkins.vars.manager }} - {{ outputs.grade_checkins.vars.blind_count }} agent(s) dark ({{ outputs.grade_checkins.vars.blind_agents | join(', ') }}), {{ outputs.grade_checkins.vars.silent_rule_count }} rule(s) silent ({{ outputs.grade_checkins.vars.silent_rules | join(', ') }}), worst lag {{ outputs.grade_checkins.vars.worst_lag_minutes }}m. Execution {{ execution.id }}."
          }
    else:
      - id: check_state_error
        type: io.kestra.plugin.core.flow.If
        description: Surface an unreadable manager state as its own branch so a broken payload never reads as a healthy fleet.
        condition: "{{ outputs.grade_checkins.vars.verdict == 'error' }}"
        then:
          - id: alert_unreadable_state
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Tell the security channel the manager state could not be graded and name the load problem.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "Wazuh check-in grade unreadable for {{ outputs.grade_checkins.vars.manager }} - {{ outputs.grade_checkins.vars.error }}. Execution {{ execution.id }}."
              }
        else:
          - id: log_fleet_healthy
            type: io.kestra.plugin.core.log.Log
            description: Record the all clear with the agent count, the worst lag and the rule expectation so the history doubles as evidence.
            message: "wazuh fleet healthy - {{ outputs.grade_checkins.vars.agents_checked }} agent(s) within {{ inputs.checkin_threshold_minutes }}m of the manager, worst lag {{ outputs.grade_checkins.vars.worst_lag_minutes }}m, every rule fired at least {{ inputs.expected_rule_fires }} time(s) in 24h"

errors:
  - id: notify_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    description: healthy when every agent reports and every rule fires, blind_spots when either signal is dark, error when the state could not be graded.
    value: "{{ outputs.grade_checkins.vars.verdict }}"
  - id: manager
    type: STRING
    description: Wazuh manager name the state was graded against, for example prod-wazuh-1.
    value: "{{ outputs.grade_checkins.vars.manager }}"
  - id: agents_checked
    type: INT
    description: Number of agents the grade scored, for example 3.
    value: "{{ outputs.grade_checkins.vars.agents_checked }}"
  - id: blind_count
    type: INT
    description: Number of agents that are dark, either never connected or lagging past the threshold.
    value: "{{ outputs.grade_checkins.vars.blind_count }}"
  - id: blind_agents
    type: ARRAY
    description: 'Names of the dark agents, for example ["k8s-edge-007"].'
    value: "{{ outputs.grade_checkins.vars.blind_agents | toJson }}"
  - id: worst_lag_minutes
    type: INT
    description: Highest check-in lag seen across the fleet in minutes, for example 420.
    value: "{{ outputs.grade_checkins.vars.worst_lag_minutes }}"
  - id: silent_rules
    type: ARRAY
    description: 'Detection rules whose 24 hour fire count sits under the expectation, for example ["Local Rootkit Detection"].'
    value: "{{ outputs.grade_checkins.vars.silent_rules | toJson }}"
  - id: error
    type: STRING
    description: Load problem behind an error verdict, empty when the state graded cleanly.
    value: "{{ outputs.grade_checkins.vars.error }}"

extend:
  title: Catch Wazuh Agents and Detection Rules Going Dark
  metaTitle: Wazuh Agent Check-In and Rule Health Gates
  shortDescription: "Grade a posted Wazuh manager state for check-in lag and silent rules, walk every agent, and escalate blind spots through Slack."
  metaDescription: "Grade a Wazuh manager snapshot for agent check-in lag and silent detection rules, loop every agent, and page Slack when the fleet goes dark."
  description: |
    An agent that stops checking in leaves a hole in the coverage map and a rule
    that stops firing leaves a second one, but Wazuh only shows both to whoever
    opens the dashboard. This blueprint takes one manager state report, grades
    every agent and every rule in a shared workspace, walks the graded agents
    for the execution record and escalates through Slack the moment the fleet
    goes dark, all with the verdict published as outputs.

    ## How it works

    1. `post_manager_state` (`io.kestra.plugin.core.trigger.Webhook`, keyed with the `WAZUH_WEBHOOK_KEY` secret) accepts the state JSON after each check-in cycle; `hourly_health_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 * * * *`) ships `disabled: true` until an operator switches it on.
    2. `checkin_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared directory. `write_state_snapshot` (`io.kestra.plugin.scripts.shell.Commands` on the Docker runner, image `python:3.12-slim`) writes the posted body, or the `manager_state` input default on manual runs, into `manager_state.json` with a quoted heredoc, and `grade_checkins` (`io.kestra.plugin.scripts.python.Script`) reads exactly that file. Both children are scripts inside the workspace and every notification sits after the block, because default tasks are stateless and a temp dir is purged when a task completes.
    3. `grade_checkins` flags an agent as blind when its status is not active or its last check-in lag passes `checkin_threshold_minutes`, flags a rule as silent when its 24 hour fire count sits under `expected_rule_fires`, and prints `healthy`, `blind_spots`, or `error` with the counts as one `::{"outputs": ...}::` line.
    4. `loop_agents` (`io.kestra.plugin.core.flow.Loop`, `runIf` the graded agent list is non empty) walks every agent and `log_agent_state` (`io.kestra.plugin.core.flow.If`) records its lag and rule contribution under `log_blind_agent` or `log_reporting_agent`, so the history names the blind spot even when the gate passes.
    5. `gate_fleet_health` (`io.kestra.plugin.core.flow.If`) escalates `blind_spots` into `alert_blind_spots` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`), an `error` run routes through `check_state_error` and `alert_unreadable_state`, and a clean fleet lands in `log_fleet_healthy`. The flow level `errors` handler reports any workspace or script failure with the execution id.

    ## What you get

    - One gateable verdict, `healthy`, `blind_spots`, or `error`, that any parent flow or promotion pipeline can branch on.
    - Escalation where the team already works, a Slack alert naming the dark agents, the silent rules and the worst lag.
    - A fail safe posture, an unreadable manager state escalates instead of reading as a clean fleet.
    - An execution record that lists every agent's lag and rule contribution run over run, not just a summary count.
    - The blind agent names, the worst lag and the silent rules as typed outputs for evidence packs.

    ## Who it's for

    - Detection engineers who own Wazuh coverage and need silent rules surfaced before an audit does.
    - Platform and SRE teams that run Wazuh agents across mixed fleets and want dark agents paged, not noticed.
    - Security leads who need a dated record that the fleet was checked, agent by agent, on every run.

    ## Why orchestrate this with Kestra

    Wazuh reports state but never pages anyone about it, so the check-in gap and the dead rule wait for a human to open the app. Kestra supplies the keyed webhook for the manager sidecar, two typed thresholds as inputs, a shared workspace where the snapshot and the grade read one file, a loop that records every agent in the history, a verdict branch that separates the all clear from the page, and Slack routing from one declarative file. A cron job on the manager gives you none of that, it only prints to a log nobody reads.

    ## Prerequisites

    - A worker with Docker access, both workspace children run in `python:3.12-slim`.
    - A reporter step that POSTs manager state shaped as a `manager` name plus an `agents` array carrying `name`, `status`, `last_checkin_minutes` and `rules_fired_24h`, and a `rules` array carrying `name` and `fired_24h`, for example assembled from the Wazuh API agent summary and the rule fire counters.
    - A Slack incoming webhook for the blind spot alert, the unreadable state alert and the failure handler.

    ### Secrets

    - `WAZUH_WEBHOOK_KEY`: key guarding the state webhook URL, anyone holding it can post fleet state.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by the blind spot alert and the `errors` handler.

    ## Quick start

    1. Add the two secrets to your Kestra namespace.
    2. Run the flow once with the default inputs and confirm `verdict` is `blind_spots`, the fixture carries the never connected `k8s-edge-007` and the silent `Local Rootkit Detection`.
    3. POST an all active state body to the webhook and watch `verdict` flip to `healthy` with `blind_count` at 0 in the outputs.
    4. Point a manager sidecar at `/api/v1/{tenant}/executions/webhook/{namespace}/wazuh-agent-checkin-rule-health-gate/{WAZUH_WEBHOOK_KEY}` and enable `hourly_health_sweep` once the sidecar is live.

    ## How to extend

    - Pull live inventory before grading by adding an `io.kestra.plugin.core.http.Request` task in front of the workspace that reads the Wazuh API agent summary with a `WAZUH_API_TOKEN` secret.
    - Fan the grade across managers with `io.kestra.plugin.core.flow.ForEachItem` over a manager list, each subflow posting its own state.
    - Keep the previous verdict in the Kestra KV store and page only when a healthy fleet turns blind, so a standing blind spot does not re-page every hour.
    - Turn a blind spot into a red run by adding `io.kestra.plugin.core.execution.Fail` under `gate_fleet_health`.

    ## Links

    - [Wazuh documentation](https://documentation.wazuh.com)
    - [Kestra webhook trigger](https://kestra.io/plugins/triggers/webhook)
    - [Kestra Loop task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.loop)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra Docker task runner](https://kestra.io/plugins/plugin-scripts-docker)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
    - Policy & Compliance
  ee: false
  demo: false
