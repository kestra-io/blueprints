id: duckdb-cohort-retention-pipeline
namespace: company.analytics

description: |
  Automated data analytics workflow that calculates 30-day user cohort retention
  rates using DuckDB SQL, verifies retention thresholds with conditional logic,
  and outputs actionable pipeline metrics.

tasks:
  - id: extract_event_data
    type: io.kestra.plugin.scripts.shell.Commands
    description: Generate simulated user event log stream for analytics processing
    commands:
      - |
        cat << 'EOF' > user_events.csv
        user_id,event_name,signup_date,event_date
        u101,signup,2026-09-01,2026-09-01
        u101,order,2026-09-01,2026-09-15
        u102,signup,2026-09-01,2026-09-01
        u103,signup,2026-09-02,2026-09-02
        u103,order,2026-09-02,2026-09-20
        u104,signup,2026-09-03,2026-09-03
        u105,signup,2026-09-03,2026-09-03
        u105,order,2026-09-03,2026-09-10
        EOF
    outputFiles:
      - user_events.csv

  - id: analyze_retention_duckdb
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Run analytical SQL queries to calculate retention metrics
    sql: |
      CREATE TABLE events AS SELECT * FROM read_csv_auto('{{ outputs.extract_event_data.outputFiles["user_events.csv"] }}');

      SELECT
        strftime(strptime(signup_date, '%Y-%m-%d'), '%Y-%m') AS cohort_month,
        COUNT(DISTINCT user_id) AS total_users,
        COUNT(DISTINCT CASE WHEN event_name = 'order' THEN user_id END) AS retained_users,
        ROUND(
          (COUNT(DISTINCT CASE WHEN event_name = 'order' THEN user_id END)::DOUBLE
           / COUNT(DISTINCT user_id)::DOUBLE) * 100, 2
        ) AS retention_rate_pct
      FROM events
      GROUP BY 1;
    fetchOne: true

  - id: evaluate_retention_health
    type: io.kestra.plugin.core.flow.If
    description: Conditional gate checking if retention rate meets the target threshold
    condition: "{{ outputs.analyze_retention_duckdb.row.retention_rate_pct >= 50.0 }}"
    then:
      - id: log_retention_healthy
        type: io.kestra.plugin.core.log.Log
        message: >-
          Retention health TARGET PASS: Cohort
          {{ outputs.analyze_retention_duckdb.row.cohort_month }}
          retention rate is
          {{ outputs.analyze_retention_duckdb.row.retention_rate_pct }}%
          (Retained {{ outputs.analyze_retention_duckdb.row.retained_users }}
          of {{ outputs.analyze_retention_duckdb.row.total_users }} users).
    else:
      - id: log_retention_warning
        type: io.kestra.plugin.core.log.Log
        message: >-
          Retention health WARNING: Cohort
          {{ outputs.analyze_retention_duckdb.row.cohort_month }}
          retention is below target threshold at
          {{ outputs.analyze_retention_duckdb.row.retention_rate_pct }}%.

triggers:
  - id: daily_analytics_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"

extend:
  title: Automated Cohort Retention Analytics with DuckDB
  metaTitle: Automated DuckDB Cohort Retention Analytics Pipeline | Kestra
  shortDescription: >-
    Calculate user cohort retention metrics using in-process DuckDB SQL
    with conditional evaluation gates.
  metaDescription: >-
    Run automated SQL cohort retention analytics with DuckDB in Kestra,
    featuring conditional threshold gates and daily scheduling.
  description: |
    Automated data analytics pipeline that computes user cohort retention
    metrics using embedded DuckDB SQL transformations, with conditional
    routing based on business metric thresholds.

    ## How it works

    1. The flow is triggered daily at 06:00 UTC via a `Schedule` trigger,
       or manually on-demand.
    2. An event ingestion task prepares raw user lifecycle event records.
    3. The `Query` task leverages DuckDB to execute analytical aggregation
       window queries, grouping users into cohorts and calculating
       conversion and retention percentages.
    4. An `If` flow control gate evaluates whether cohort retention meets
       predefined operational targets (>= 50%), branching to appropriate
       health reporting logs or alert tasks.

    ## What you get

    - In-process analytical SQL transformations without managing external
      database infrastructure.
    - Automated cohort retention rate calculation with precision rounding.
    - Conditional metric alerting gates based on live analytical query
      outputs.
    - Scheduled execution with full auditability and state tracking.

    ## Who it's for

    - Analytics Engineers building automated metric validation pipelines.
    - Data Engineers seeking lightweight, serverless SQL transformations.
    - Product Analytics teams automating weekly/monthly retention reports.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition keeps analytical transformations
      version-controlled and reproducible.
    - Built-in scheduling and conditional flow control avoid brittle
      custom cron scripts.
    - Detailed task run outputs make SQL debugging and pipeline monitoring
      straightforward.

    ## Prerequisites

    - Basic familiarity with SQL and Kestra workflow definitions.
    - Docker or container runtime enabled for DuckDB task execution.

    ### Secrets

    - None required for local in-process execution.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Click **Execute** to run an immediate test batch.
    3. Inspect the `Outputs` tab to review calculated retention
       percentages.
    4. Enable the `daily_analytics_schedule` trigger for automated
       recurring runs.

    ## How to extend

    - Connect `io.kestra.plugin.jdbc.duckdb.Query` to read directly from
      AWS S3 Parquet files using the DuckDB `httpfs` extension.
    - Add a Slack or Microsoft Teams notification task inside the `else`
      branch to notify product teams when retention drops.
    - Export calculated cohorts directly to Postgres, Snowflake, or
      BigQuery for downstream BI dashboards.

    ## Links

    - [Kestra DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra Flow Control](https://kestra.io/docs/workflow-components/flow-control)
  tags:
    - Data
  subTags:
    - Data Warehouses
    - Testing & Quality
  ee: false
  demo: false
