id: duckdb-cohort-retention-pipeline
namespace: company.analytics

description: |
  Lightweight, pure-SQL cohort retention pipeline that ingests user event CSV files
  using DuckDB, computes 30-day signup-to-order cohort retention rates, and validates
  retention against operational SLA targets without requiring external Python environments.

inputs:
  - id: events_file
    type: FILE
    description: CSV file containing user activity events with columns user_id, event_name, signup_date, and event_date
    required: false

tasks:
  - id: analyze_retention_duckdb
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Run analytical SQL queries on uploaded events to calculate cohort retention metrics
    sql: |
      CREATE TABLE events AS SELECT * FROM read_csv_auto('{{ inputs.events_file }}');

      SELECT
        strftime(strptime(signup_date, '%Y-%m-%d'), '%Y-%m') AS cohort_month,
        COUNT(DISTINCT user_id) AS total_users,
        COUNT(DISTINCT CASE WHEN event_name = 'order' THEN user_id END) AS retained_users,
        ROUND(
          (COUNT(DISTINCT CASE WHEN event_name = 'order' THEN user_id END)::DOUBLE
           / COUNT(DISTINCT user_id)::DOUBLE) * 100, 2
        ) AS retention_rate_pct
      FROM events
      GROUP BY 1;
    fetchOne: true

  - id: evaluate_retention_health
    type: io.kestra.plugin.core.flow.If
    description: Conditional gate checking if retention rate meets the target threshold (>= 50%)
    condition: "{{ outputs.analyze_retention_duckdb.row.retention_rate_pct >= 50.0 }}"
    then:
      - id: log_retention_healthy
        type: io.kestra.plugin.core.log.Log
        message: >-
          Retention health TARGET PASS: Cohort
          {{ outputs.analyze_retention_duckdb.row.cohort_month }}
          retention rate is
          {{ outputs.analyze_retention_duckdb.row.retention_rate_pct }}%
          (Retained {{ outputs.analyze_retention_duckdb.row.retained_users }}
          of {{ outputs.analyze_retention_duckdb.row.total_users }} users).
    else:
      - id: log_retention_warning
        type: io.kestra.plugin.core.log.Log
        message: >-
          Retention health WARNING: Cohort
          {{ outputs.analyze_retention_duckdb.row.cohort_month }}
          retention is below target threshold at
          {{ outputs.analyze_retention_duckdb.row.retention_rate_pct }}%.

triggers:
  - id: daily_analytics_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    disabled: true

extend:
  title: Pure-SQL Cohort Retention Analytics with DuckDB
  metaTitle: Pure-SQL DuckDB Cohort Retention Analytics Pipeline | Kestra
  shortDescription: >-
    Calculate user cohort retention rates directly from an input CSV using pure DuckDB SQL
    with conditional health evaluation gates.
  metaDescription: >-
    Lightweight cohort retention analytics in Kestra using in-process DuckDB SQL on input CSV files,
    featuring threshold evaluation without Python or external webhook requirements.
  description: |
    Automated cohort retention pipeline that computes monthly signup-to-order user retention
    metrics directly from user-uploaded event files using pure DuckDB SQL.

    Unlike `cohort-retention-duckdb` (which requires Python scripting, Parquet datasets, and Slack webhooks),
    this blueprint offers a zero-dependency, pure-SQL alternative that teams can drop in immediately
    with standard CSV event logs.

    ## How it works

    1. The flow takes an input CSV file containing raw user event data (`user_id`, `event_name`, `signup_date`, `event_date`).
    2. DuckDB's embedded `read_csv_auto()` reads and parses the event file in-memory.
    3. An analytical SQL query groups users into monthly signup cohorts, identifies repeat purchasers,
       and calculates precise retention percentages.
    4. An `If` conditional gate checks whether the cohort retention meets the target threshold (>= 50%),
       routing to success logs or alert notifications.

    ## What you get

    - Pure SQL analytical transformations with zero Python runtime dependencies.
    - Direct support for CSV event file uploads via Kestra inputs.
    - Automated percentage calculation for user retention and churn tracking.
    - Standalone, lightweight execution with no third-party API keys or webhooks required.

    ## Who it's for

    - Analytics and Data Engineers who want fast SQL-only retention metrics.
    - Product teams looking for an out-of-the-box template to audit customer retention from CSV exports.
    - Teams looking for a simpler alternative to complex Python/webhook pipelines.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition keeps analytical transformations version-controlled and reproducible.
    - Serverless in-process DuckDB execution avoids spinning up dedicated database clusters.
    - Built-in UI file upload allows ad-hoc analyses alongside scheduled production runs.

    ## Prerequisites

    - A CSV file with user activity containing `user_id`, `event_name`, `signup_date`, and `event_date`.

    ### Secrets

    - None required.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Click **Execute** and upload your user events CSV file.
    3. View calculated cohort retention metrics in the **Outputs** tab.

    ## How to extend

    - Connect `read_csv_auto()` directly to S3 or Google Cloud Storage buckets.
    - Add notification tasks (Slack, Email) in the failure branch when retention drops below targets.
    - Export calculated cohorts directly to Postgres, Snowflake, or BigQuery.

    ## Links

    - [Kestra DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra Flow Control](https://kestra.io/docs/workflow-components/flow-control)
  tags:
    - Data
  subTags:
    - Data Warehouses
    - Testing & Quality
  ee: false
  verified: false
  demo: false
