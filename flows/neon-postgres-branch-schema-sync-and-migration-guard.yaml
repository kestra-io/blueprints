id: neon-postgres-branch-schema-sync-and-migration-guard
namespace: company.database

inputs:
  - id: neon_project_id
    type: STRING
    displayName: Neon Project ID
    required: true
    defaults: "ep-autumn-sunset-123456"
    description: "The unique identifier of your Neon Serverless PostgreSQL project."

  - id: parent_branch_name
    type: STRING
    displayName: Parent Branch Name
    required: true
    defaults: "main"
    description: "Source parent production branch to sync schema from."

  - id: ephemeral_branch_name
    type: STRING
    displayName: Ephemeral Branch Name
    required: true
    defaults: "preview-staging"
    description: "Target isolated ephemeral branch to validate migrations against."

tasks:
  - id: log_sync_commencement
    type: io.kestra.plugin.core.log.Log
    message: "🐘 Starting Neon branch migration sync guard: Project={{ inputs.neon_project_id }}, Source={{ inputs.parent_branch_name }}, Target={{ inputs.ephemeral_branch_name }}"

  - id: fetch_branch_details
    type: io.kestra.plugin.core.http.Request
    description: "Query Neon Management API for source and target branch lifecycle statuses"
    uri: "https://console.neon.tech/api/v2/projects/{{ inputs.neon_project_id }}/branches"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('NEON_API_KEY') }}"
      Accept: "application/json"
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: evaluate_branch_health
    type: io.kestra.plugin.scripts.python.Script
    description: "Extract branch readiness states and calculate schema divergence metrics"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    dependencies:
      - kestra
    inputFiles:
      branches.json: "{{ outputs.fetch_branch_details.body }}"
    script: |
      import json
      import os
      from kestra import Kestra

      target_exists = False
      target_ready = False
      source_exists = False

      with open("branches.json") as f:
          data = json.load(f)

      for branch in data.get("branches", []):
          name = branch.get("name")
          current_state = branch.get("current_state", "")
          if name == "{{ inputs.parent_branch_name }}":
              source_exists = True
          elif name == "{{ inputs.ephemeral_branch_name }}":
              target_exists = True
              if current_state == "ready":
                  target_ready = True

      Kestra.outputs({
          "source_exists": source_exists,
          "target_exists": target_exists,
          "target_ready": target_ready,
          "can_migrate": source_exists and target_exists and target_ready
      })

  - id: check_migration_readiness
    type: io.kestra.plugin.core.flow.If
    description: "Verify that both source and target branches exist and are healthy before running schema migrations"
    condition: "{{ outputs.evaluate_branch_health.vars.can_migrate == true }}"
    then:
      - id: notify_migration_approved
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Announce successful branch synchronization and readiness to dev team"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🐘 Neon Branch Schema Guard: Ready for Migration",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Project:* `{{ inputs.neon_project_id }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Target Branch:* `{{ inputs.ephemeral_branch_name }}`"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ Isolated preview branch is verified in state `ready`. Database migrations can proceed safely without locking production."
                }
              }
            ]
          }

    else:
      - id: alert_divergence_halt
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Alert engineering team that ephemeral database branch is unready or missing"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚨 Neon Branch Migration Guard: Sync Halted",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "⚠️ *Migration Blocked:* Target branch `{{ inputs.ephemeral_branch_name }}` or parent `{{ inputs.parent_branch_name }}` is unready or missing in project `{{ inputs.neon_project_id }}`. Check Neon Console to resolve state."
                }
              }
            ]
          }

errors:
  - id: alert_sync_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dead-letter alert if Neon Management API communication fails"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Neon Migration Guard Pipeline Failed!* Execution `{{ execution.id }}` failed to contact the Neon API for project `{{ inputs.neon_project_id }}`."
      }

extend:
  title: Neon Serverless Postgres Branch Schema Sync and Migration Guard
  metaTitle: Neon Postgres Branch Sync and Migration Guard with Slack Alerts | Kestra
  shortDescription: Validate Neon serverless Postgres branch lifecycle states and guard CI/CD database migrations with Slack alerts.
  metaDescription: Orchestrate Neon serverless Postgres ephemeral branch sync, validate health states, and guard database migrations with automated Slack notifications.
  description: |
    Serverless Postgres branches provide instant, copy-on-write database clones for CI/CD staging environments. However, running migrations against unready or stale preview branches causes build flakiness and schema divergence. This blueprint validates Neon serverless Postgres branch readiness using the Neon Management API, evaluates branch lifecycle health, and acts as an automated migration gate that broadcasts real-time status alerts to Slack.

    ## How it works

    1. **Project & Branch Inputs**: The workflow accepts the Neon project ID, parent source branch (e.g., `main`), and ephemeral target branch (e.g., `preview-staging`).
    2. **Branch Status Discovery**: The `fetch_branch_details` task (`io.kestra.plugin.core.http.Request`) authenticates to the Neon v2 Management API with retries to query all active branch configurations.
    3. **Lifecycle Validation**: The `evaluate_branch_health` task (`io.kestra.plugin.scripts.python.Script`) inspects the branch state JSON, verifying that both parent and target branches exist and that the ephemeral branch is in a healthy `ready` state before publishing typed boolean variables via `Kestra.outputs()`.
    4. **Migration Gate**: The `check_migration_readiness` task (`io.kestra.plugin.core.flow.If`) evaluates the readiness verdict:
       - **Approved**: Dispatches an approval card to Slack via `notify_migration_approved` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - **Blocked**: Halts the workflow and issues a diagnostic alert via `alert_divergence_halt`.
    5. **Pipeline Resilience**: An `errors` handler guarantees dead-letter alerts to Slack if API credentials expire or network timeouts occur.

    ## What you get

    - Automated pre-flight validation for serverless Postgres branch migrations.
    - Zero risk of applying schema changes to corrupt or initializing database clones.
    - Real-time Slack notifications with actionable project and branch status metadata.
    - Full execution lineage and audit history in declarative YAML.

    ## Who it's for

    - Platform Engineers and SREs orchestrating ephemeral CI/CD test environments.
    - Database Administrators (DBAs) managing Neon serverless Postgres branching strategies.
    - DevOps teams automating zero-downtime database schema deployments.

    ## Why orchestrate this with Kestra

    Kestra coordinates HTTP requests, containerized Python validation, retry policies, secret protection, and conditional notifications into a clean DAG without requiring external runner scripts.

    ## Prerequisites

    - A Neon Cloud account and an active project.
    - A Neon Management API Key.
    - A Slack Incoming Webhook URL.

    ### Secrets

    - `NEON_API_KEY`: Neon Management API v2 Bearer Token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for database operational alerts.

    ## Quick start

    1. Configure `NEON_API_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Execute the flow with your Neon project ID and branch names.
    3. Confirm the Slack status card matches your Neon Console branch state.
    4. Trigger this flow as a dependency gate in your CI/CD deployment pipeline.

    ## How to extend

    - Add an automated Neon branch creation task using HTTP POST if the target branch does not yet exist.
    - Trigger downstream Prisma, Liquibase, or Flyway database migration flows in the approval branch.
    - Integrate PagerDuty alerting if production parent branch health degrades.

    ## Links

    - [Neon Branching Documentation](https://neon.tech/docs/introduction/branching)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Database
    - Infrastructure
  subTags:
    - Postgres
    - CI/CD & Deployments
  ee: false
  demo: false
