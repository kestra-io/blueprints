id: cross-platform-cicd-failure-diagnosis
namespace: company.devops

inputs:
  - id: ci_platform
    type: SELECT
    description: Originating CI/CD platform of the failed workflow run.
    values:
      - GITHUB_ACTIONS
      - KESTRA
    defaults: GITHUB_ACTIONS

  - id: workflow_identifier
    type: STRING
    description: Identifier or name of the failed pipeline or workflow run.
    defaults: "build-and-test.yml#482"

  - id: failure_log_excerpt
    type: STRING
    description: Raw failure log snippet or traceback extracted from the build run.
    defaults: |
      [ERROR] Failed to execute goal org.apache.maven.plugins:maven-compiler-plugin:3.11.0:compile
      [ERROR] Compilation failure: cannot find symbol
      [ERROR] symbol: class ConfigurationException
      [ERROR] location: package io.kestra.core.exceptions

  - id: alert_channel_webhook
    type: STRING
    description: Webhook URL for DevSecOps incident alerting.
    defaults: "https://hooks.slack.com/services/DEMO/ALERT/CI_DIAGNOSTICS"

tasks:
  - id: diagnose_failure_log
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    description: Sanitize secrets, extract root causes, and categorize CI/CD execution errors.
    beforeCommands:
      - pip install requests
    script: |
      import os
      import re
      import json

      platform = "{{ inputs.ci_platform }}"
      workflow_id = "{{ inputs.workflow_identifier }}"
      raw_logs = """{{ inputs.failure_log_excerpt }}"""

      # Redact common credentials/tokens
      sanitized = re.sub(r'(?i)(token|key|secret|password)\s*[:=]\s*[^\s]+', r'\1: [REDACTED]', raw_logs)

      category = "UNKNOWN_ERROR"
      remediation = "Inspect full runner logs."

      if "Compilation failure" in sanitized or "cannot find symbol" in sanitized or "SyntaxError" in sanitized:
          category = "CODE_COMPILATION_ERROR"
          remediation = "Verify imported classes, syntax compatibility, and language SDK versions."
      elif "OutOfMemoryError" in sanitized or "Killed" in sanitized or "OOMKilled" in sanitized:
          category = "OUT_OF_MEMORY"
          remediation = "Increase runner container memory limits or tune build heap size."
      elif "Could not resolve dependencies" in sanitized or "404 Not Found" in sanitized or "pip install" in sanitized:
          category = "DEPENDENCY_RESOLUTION_FAILURE"
          remediation = "Check artifact repository availability, package lockfiles, and network egress rules."
      elif "Permission denied" in sanitized or "HTTP 403" in sanitized:
          category = "AUTH_PERMISSION_ERROR"
          remediation = "Audit runner IAM roles, GitHub token scopes, or registry credentials."
      elif "timed out" in sanitized or "Timeout" in sanitized:
          category = "EXECUTION_TIMEOUT"
          remediation = "Review slow integration test suites or adjust timeout thresholds."

      diagnosis = {
          "platform": platform,
          "workflow_id": workflow_id,
          "category": category,
          "remediation_advice": remediation,
          "status": "DIAGNOSIS_COMPLETE"
      }

      report_lines = [
          f"# CI/CD Failure Diagnosis: {workflow_id}",
          "",
          f"**Platform:** {platform}",
          f"**Classification:** `{category}`",
          "",
          "## Recommended Action",
          f"> {remediation}",
          "",
          "## Sanitized Log Evidence",
          "```",
          sanitized[:1500],
          "```"
      ]

      with open("diagnosis_report.md", "w") as f:
          f.write("\n".join(report_lines))

      print(f"Diagnosis complete: {category}")
      print(f"::{\"outputs\": {json.dumps(diagnosis)}}::")

  - id: evaluate_alert_dispatch
    type: io.kestra.plugin.core.flow.If
    description: Dispatch notification when actionable failure diagnosis is generated.
    condition: "{{ outputs.diagnose_failure_log.vars.status == 'DIAGNOSIS_COMPLETE' }}"
    then:
      - id: notify_developer_channel
        type: io.kestra.plugin.core.http.Request
        description: Post failure diagnosis card to developer channel.
        uri: "{{ inputs.alert_channel_webhook }}"
        method: POST
        contentType: application/json
        body: |
          {
            "channel": "#dev-ci-alerts",
            "username": "CI Failure Diagnostic Bot",
            "icon_emoji": ":mag:",
            "text": "*[CI FAILURE DIAGNOSIS]* `{{ inputs.workflow_identifier }}` on `{{ inputs.ci_platform }}`\n*Category:* `{{ outputs.diagnose_failure_log.vars.category }}`\n*Remediation:* {{ outputs.diagnose_failure_log.vars.remediation_advice }}"
          }

      - id: record_diagnostic_event
        type: io.kestra.plugin.core.kv.Set
        description: Save failure diagnosis event in Kestra KV store.
        key: "ci_diagnosis_{{ execution.id }}"
        kvType: JSON
        value: |
          {
            "workflow": "{{ inputs.workflow_identifier }}",
            "category": "{{ outputs.diagnose_failure_log.vars.category }}",
            "timestamp": "{{ execution.startDate }}"
          }

  - id: log_diagnostic_summary
    type: io.kestra.plugin.core.log.Log
    description: Output operational summary to execution logs.
    message: "Failure diagnosis finished for '{{ inputs.workflow_identifier }}'. Category: {{ outputs.diagnose_failure_log.vars.category }}."

triggers:
  - id: listen_flow_failures
    type: io.kestra.plugin.core.trigger.Flow
    description: Automatically trigger diagnosis whenever any flow in the namespace fails.
    conditions:
      - type: io.kestra.plugin.core.condition.ExecutionStatusCondition
        in:
          - FAILED

extend:
  title: Diagnose CI/CD workflow failures across GitHub Actions and Kestra
  metaTitle: Cross-platform CI/CD failure diagnosis | Kestra
  shortDescription: Analyze GitHub Actions and Kestra failure logs, extract root causes, and dispatch actionable debugging diagnostics.
  metaDescription: Diagnose CI/CD failures across GitHub Actions and Kestra. Extract root causes, classify error patterns, and dispatch actionable debugging digests.
  description: |
    Software engineering teams spend significant manual effort investigating failed GitHub Actions workflows and Kestra flow executions. Build logs are frequently thousands of lines long, containing deeply nested stack traces and obscure dependency resolution failures that obscure the actual root cause.

    When pipelines fail, developers must navigate multiple systems to piece together error context, slowing recovery times and delaying pull request merges.

    This blueprint provides automated failure root-cause analysis for CI/CD pipelines. It sanitizes sensitive tokens from raw logs, evaluates failure patterns against deterministic heuristics (compilation, out-of-memory, dependency resolution, permissions, timeouts), produces an executive markdown diagnostic report, and notifies engineering channels with immediate remediation steps.

    ## How it works

    1. `diagnose_failure_log` (`io.kestra.plugin.scripts.python.Script`) strips credentials and tokens from input logs and classifies the error into standardized operational categories.
    2. The script compiles an executive Markdown report containing error evidence and recommended resolution steps.
    3. `evaluate_alert_dispatch` (`io.kestra.plugin.core.flow.If`) detects completed diagnoses:
       - Sends actionable alerts to `#dev-ci-alerts` via `notify_developer_channel`.
       - Registers diagnosis metadata into the Kestra KV store using `record_diagnostic_event`.
    4. `log_diagnostic_summary` outputs the diagnostic outcome into execution logs.
    5. `listen_flow_failures` automatically triggers diagnosis on execution failure events.

    ## What you get

    - Automated error classification across GitHub Actions and Kestra executions.
    - Secret redaction preventing credential leakage in diagnostic reports.
    - Prescriptive debugging guidance directing developers straight to the fix.
    - Historical failure trend tracking stored in Kestra KV store.

    ## Who it's for

    - DevOps and Platform Engineers standardizing failure triaging across CI/CD systems.
    - Software Developers reducing time spent investigating long pipeline logs.
    - Engineering Managers monitoring recurring build failure root causes.

    ## Why orchestrate this with Kestra

    - Declarative, automated failure analysis without maintaining standalone webhook servers.
    - Built-in event triggers for listening to execution failures across namespaces.
    - Centralized secret management for developer notification webhooks.
    - Native support for chaining diagnostic findings into automated bug ticket creation.

    ## Prerequisites

    - Kestra runner with Python execution capabilities.
    - Webhook URL for developer alert notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Webhook URL for developer alerting notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set `alert_channel_webhook` to your team alert webhook.
    3. Test the flow by pasting a sample error traceback into `failure_log_excerpt`.
    4. Wire the flow to GitHub Actions failure webhooks or enable the failure trigger.

    ## How to extend

    - Add an AI prompt step using `io.kestra.plugin.ai.agent.AIAgent` to generate natural language explanations and code patch diffs for obscure stack traces.
    - Forward categorized failure events to Datadog or Elasticsearch for fleet-wide build reliability metrics.

    ## Links

    - [GitHub Actions Webhook Events](https://docs.github.com/en/webhooks/webhook-events-and-payloads#workflow_run)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Flow Control Documentation](https://kestra.io/docs/workflow-components/flow-control)
  tags:
    - Infrastructure
    - AI
  subTags:
    - CI/CD & Deployment
    - Incident Response
    - Monitoring & Alerting
  ee: false
  demo: false
