id: elasticsearch-rejected-threads-sentinel
namespace: company.team

inputs:
  - id: elasticsearch_host
    type: STRING
    defaults: elasticsearch.internal:9200
    description: Host and port of the Elasticsearch cluster endpoint.
  - id: elasticsearch_user
    type: STRING
    defaults: elastic
    description: Elasticsearch username.

tasks:
  - id: query_thread_pool_stats
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.elasticsearch_host }}"
      ES_USER: "{{ inputs.elasticsearch_user }}"
      ES_PASSWORD: "{{ secret('ELASTICSEARCH_PASSWORD') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "elasticsearch.internal:9200")
      user = os.environ.get("ES_USER", "elastic")
      password = os.environ.get("ES_PASSWORD", "")

      auth = (user, password) if user and password else None
      url = f"http://{host}/_nodes/stats/thread_pool"

      try:
          resp = requests.get(url, auth=auth, timeout=15)
          resp.raise_for_status()
          data = resp.json().get("nodes", {})
      except Exception as e:
          print(f"CRITICAL: Failed to query Elasticsearch thread pools at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      total_rejected = 0
      node_breakdown = []

      for node_id, node_data in data.items():
          name = node_data.get("name", node_id)
          pools = node_data.get("thread_pool", {})
          search_rej = pools.get("search", {}).get("rejected", 0)
          write_rej = pools.get("write", {}).get("rejected", 0)
          node_rej = search_rej + write_rej
          if node_rej > 0:
              total_rejected += node_rej
              node_breakdown.append({"node": name, "search_rejected": search_rej, "write_rejected": write_rej})

      result = {
          "total_nodes": len(data),
          "total_rejected_tasks": total_rejected,
          "rejected_nodes": node_breakdown,
          "alert_triggered": total_rejected > 0
      }

      with open("thread_summary.json", "w") as out:
          json.dump(result, out, indent=2)

      Kestra.outputs({
          "total_nodes": len(data),
          "total_rejected_tasks": total_rejected,
          "alert_triggered": total_rejected > 0
      })
      print("Elasticsearch thread pool audit:", result)
    outputFiles:
      - thread_summary.json

  - id: evaluate_rejected_threads
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_thread_pool_stats.vars.alert_triggered }}"
    then:
      - id: alert_es_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: *Elasticsearch Queue Pressure Alert*: Detected {{ outputs.query_thread_pool_stats.vars.total_rejected_tasks }} rejected search/write tasks on {{ inputs.elasticsearch_host }}. Client queries or indexing requests are dropping."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":warning: *Elasticsearch Sentinel Execution Failure*: Failed to query thread pool stats on {{ inputs.elasticsearch_host }}. Execution ID: {{ execution.id }}."
      }

triggers:
  - id: scheduled_thread_pool_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Elasticsearch thread pool queues to detect rejected search and write tasks indicating cluster saturation."
  metaTitle: Elasticsearch Rejected Search and Write Threads Sentinel with Kestra
  title: Elasticsearch Rejected Search and Write Threads Sentinel
  shortDescription: Audits Elasticsearch thread pool queues to detect rejected search and write tasks indicating cluster saturation.
  description: |
    ## How it works
    This workflow inspects thread pool performance across all Elasticsearch nodes via `_nodes/stats/thread_pool`. It aggregates rejected execution counts for `search` and `write` thread pools, alerting administrators when client queries or bulk indexing requests begin failing due to queue saturation.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_thread_pool_check Schedule Trigger] --> B[query_thread_pool_stats Python Script]
      B --> C{Rejections > 0?}
      C -- Yes --> D[alert_es_team Slack Webhook]
      C -- No --> E[Thread Pools Healthy]
    ```

    ## Prerequisites
    - Elasticsearch HTTP endpoint reachability (default 9200).
    - Secrets `ELASTICSEARCH_PASSWORD` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import this blueprint under the `company.team` namespace.
    2. Set `elasticsearch_host` and credentials.
    3. Trigger a manual execution to inspect thread pools.

    ## Links
    - [Elasticsearch Thread Pool Settings](https://www.elastic.co/guide/en/elasticsearch/reference/current/modules-threadpool.html)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
