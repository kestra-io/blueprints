id: elasticsearch-rejected-threads-sentinel
namespace: company.dataops

inputs:
  - id: elasticsearch_host
    type: STRING
    defaults: elasticsearch.internal:9200
    description: Host and port of the Elasticsearch cluster endpoint.

tasks:
  - id: query_thread_pool_stats
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s -u "{{ inputs.elasticsearch_user | default('elastic') }}:{{ secret('ELASTICSEARCH_PASSWORD') }}"           "http://{{ inputs.elasticsearch_host }}/_nodes/stats/thread_pool" > thread_pool.json
        python3 -c "
        import json
        with open('thread_pool.json') as f:
            data = json.load(f).get('nodes', {})
        total_rejected = 0
        node_breakdown = []
        for node_id, node_data in data.items():
            name = node_data.get('name', node_id)
            pools = node_data.get('thread_pool', {})
            search_rej = pools.get('search', {}).get('rejected', 0)
            write_rej = pools.get('write', {}).get('rejected', 0)
            node_rej = search_rej + write_rej
            if node_rej > 0:
                total_rejected += node_rej
                node_breakdown.append({'node': name, 'search_rejected': search_rej, 'write_rejected': write_rej})
        result = {
            'total_nodes': len(data),
            'total_rejected_tasks': total_rejected,
            'rejected_nodes': node_breakdown,
            'alert_triggered': total_rejected > 0
        }
        with open('thread_summary.json', 'w') as out:
            json.dump(result, out)
        print('Elasticsearch thread pool audit:', result)
        "
    outputFiles:
      - thread_summary.json

  - id: evaluate_rejected_threads
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.query_thread_pool_stats.outputFiles['thread_summary.json'])).alert_triggered }}"
    then:
      - id: alert_es_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *Elasticsearch Queue Pressure Alert*: Detected {{ json(read(outputs.query_thread_pool_stats.outputFiles['thread_summary.json'])).total_rejected_tasks }} rejected search/write tasks on {{ inputs.elasticsearch_host }}. Client queries or indexing requests are dropping."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Elasticsearch Sentinel Execution Failure*: Failed to query thread pool stats on {{ inputs.elasticsearch_host }}."
      }

triggers:
  - id: scheduled_thread_pool_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  title: Elasticsearch Thread Pool Rejected Tasks Sentinel
  shortDescription: Audits Elasticsearch cluster thread pools to detect rejected search and indexing tasks caused by queue saturation.
  description: |
    ## How it works
    This sentinel contacts the Elasticsearch `_nodes/stats/thread_pool` API to measure rejected tasks across search and write thread pools. It flags backpressure and queue saturation where client indexing bursts or high query volumes exceed worker capacity.

    ## What you get
    - Proactive visibility into indexing queue saturation before client applications throw `429 Too Many Requests`.
    - Early warning when shard routing skews search load onto isolated bottleneck data nodes.
    - Automated Slack incident delivery indicating affected nodes and rejected task counts.

    ## Who it's for
    - Search infrastructure engineers and SREs maintaining production Elasticsearch clusters.
    - Platform teams ingesting high-volume application log streams.

    ## Why orchestrate this with Kestra
    Kestra automates distributed search cluster observability, executing scheduled health checks with fine-grained error management and notification routing.

    ## Prerequisites
    - Elasticsearch HTTP endpoint reachability (default 9200).
    - Secrets `ELASTICSEARCH_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Set `elasticsearch_host` and credentials.
    3. Run manually to check current thread pool rejections.

    ## How to extend
    - Query `/_cat/tasks` to identify long-running bulk indexing tasks causing thread pool backups.
    - Dynamically scale Elasticsearch worker replicas on Kubernetes when rejections persist.
    - Export rejected thread counts to Prometheus or CloudWatch.

    ## Links
    - [Elasticsearch Thread Pool Documentation](https://www.elastic.co/guide/en/elasticsearch/reference/current/modules-threadpool.html)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
