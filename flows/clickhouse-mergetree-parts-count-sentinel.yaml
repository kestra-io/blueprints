id: clickhouse-mergetree-parts-count-sentinel
namespace: company.sentinel
description: Queries ClickHouse system.parts to flag table partitions exceeding 300
  active data parts and prevent TOO_MANY_PARTS query rejection crashes.
inputs:
- id: ch_host
  type: STRING
  defaults: clickhouse.internal
- id: ch_port
  type: INT
  defaults: 8123
- id: max_parts_per_partition_threshold
  type: INT
  defaults: 300
tasks:
- id: audit_clickhouse
  type: io.kestra.plugin.scripts.shell.Commands
  containerImage: ghcr.io/kestra-io/tools:latest
  commands:
  - set -euo pipefail
  - 'curl -sf -u "default:{{ secret(''CLICKHOUSE_PASSWORD'') }}"   "http://{{ inputs.ch_host
    }}:{{ inputs.ch_port }}/?query=SELECT%20max(parts)%20FROM%20(SELECT%20table,%20partition,%20count()%20as%20parts%20FROM%20system.parts%20WHERE%20active%20=%201%20GROUP%20BY%20table,%20partition)%20FORMAT%20JSON"
    > /tmp/ch_parts_raw.json 2>/dev/null || true


    MAX_PARTS=$(jq -r ''.data[0]["max(parts)"] // 0'' /tmp/ch_parts_raw.json 2>/dev/null
    || echo 0)


    echo "{"max_parts": ${MAX_PARTS:-0}}" > /tmp/ch_parts_health.json

    '
  outputFiles:
  - '*.json'
- id: evaluate_and_alert
  type: io.kestra.plugin.core.flow.If
  condition: '{{ json(outputs.audit_clickhouse.outputFiles[''ch_parts_health.json'']).max_parts
    > inputs.max_parts_per_partition_threshold }}'
  then:
  - id: notify_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: ':rotating_light: *ClickHouse Too Many Parts Risk*\n*Host:* {{ inputs.ch_host
      }}:{{ inputs.ch_port }}\n*Max Active Parts in Partition:* {{ json(outputs.audit_clickhouse.outputFiles[''ch_parts_health.json'']).max_parts
      }}\n*Threshold:* {{ inputs.max_parts_per_partition_threshold }}\n*Risk:* Imminent
      table ingestion freeze with DB::Exception: Too many parts in partition.'
errors:
- id: handle_inspection_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: ':rotating_light: *Execution Failure: ClickHouse MergeTree Partition Parts
    Count Sentinel*\n*Execution ID:* `{ execution.id }`\n*State:* `{ execution.state.current
    }`\n*Error:* Sentinel inspection encountered an unhandled execution error.'
triggers:
- id: scheduled_monitor
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
extend:
  title: ClickHouse MergeTree Partition Parts Count Sentinel
  shortDescription: Queries ClickHouse system.parts to flag table partitions exceeding
    300 active data parts and prevent TOO_MANY_PARTS query rejection crashes.
  description: '## How it works

