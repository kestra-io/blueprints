id: aws-kms-customer-managed-key-rotation-sentinel
namespace: company.cloud

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: AWS Region to audit.

tasks:
  - id: audit_kms_keys
    type: io.kestra.plugin.aws.cli.AwsCLI
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.aws_region }}"
    commands:
      - |
        # List all customer managed KMS keys
        aws kms list-keys --query "Keys[*].KeyId" --output text > /tmp/kms_keys.txt
        
        # Check key rotation status for each key
        python3 -c "import subprocess; keys=open('/tmp/kms_keys.txt').read().split(); print(len([k for k in keys if subprocess.run(['aws','kms','get-key-rotation-status','--key-id',k,'--query','KeyRotationEnabled','--output','text'],capture_output=True,text=True).stdout.strip()=='False']))" > /tmp/disabled_count.txt
        
        DISABLED_COUNT=$(cat /tmp/disabled_count.txt | tr -d '[:space:]')
        echo "::set-output name=disabled_count::${DISABLED_COUNT:-0}::"

  - id: evaluate_rotation_compliance
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_kms_keys.vars.disabled_count | int > 0 }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#security-ops",
            "attachments": [
              {
                "color": "warning",
                "title": "🔐 AWS KMS Key Rotation Compliance Warning",
                "text": "AWS Region `{{ inputs.aws_region }}` contains *{{ outputs.audit_kms_keys.vars.disabled_count }} Customer Managed Key(s) with automatic rotation DISABLED*! Cryptographic compliance standards (PCI-DSS, SOC2, HIPAA) mandate annual automatic key rotation.",
                "footer": "Kestra Cloud Sentinel • AWS KMS"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#security-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ AWS KMS Rotation Sentinel Failure",
            "text": "Failed to audit AWS KMS keys. Verify IAM permissions for kms:ListKeys and kms:GetKeyRotationStatus.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true

extend:
  title: AWS KMS Customer Managed Key (CMK) Automatic Rotation Drift Sentinel
  shortDescription: Audits AWS Key Management Service (KMS) Customer Managed Keys for disabled automatic annual key rotation.
  description: |
    ## How it works
    This workflow uses the Kestra AWS CLI plugin to iterate through all Customer Managed symmetric encryption keys (`aws kms list-keys`) and query their automatic rotation status (`aws kms get-key-rotation-status`). Industry security standards (such as PCI-DSS requirement 3.6, SOC 2, and HIPAA) mandate that cryptographic keys used to encrypt sensitive customer data must rotate annually. When automatic rotation is disabled, the same backing key material encrypts data indefinitely, increasing exposure windows. This workflow audits key rotation settings and escalates compliance drift to cloud security teams.

    ## What you get
    - Automated compliance auditing of AWS KMS encryption keys.
    - Prevents compliance audit failures against SOC 2 and PCI-DSS standards.
    - Quantitative metrics on keys with disabled automatic rotation.

    ## Who it's for
    - Cloud Security Engineers and Compliance Officers.
    - AWS Infrastructure Architects enforcing cryptographic governance.

    ## Why orchestrate this with Kestra
    - **Continuous Compliance Assurance**: Automatically audits encryption posture weekly.
    - **Native AWS CLI Automation**: Executes genuine AWS CLI commands via scoped IAM credentials.
    - **Direct Team Alerts**: Delivers compliance reports directly to security operations channels.

    ## Prerequisites
    - AWS IAM User or Role with `kms:ListKeys` and `kms:GetKeyRotationStatus` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input target AWS region.
    3. Run the workflow to inspect KMS key rotation compliance.

    ## How to extend
    - Automatically remediate non-compliant keys using `aws kms enable-key-rotation --key-id <key>`.
    - Expand audit to cover all active AWS regions dynamically.

    ## Links
    - [AWS KMS Key Rotation Documentation](https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html)
    - [Kestra AWS CLI Plugin](https://kestra.io/plugins/plugin-aws/io.kestra.plugin.aws.cli.awscli)
  tags:
    - Cloud
    - Infrastructure
  ee: false
  demo: false
