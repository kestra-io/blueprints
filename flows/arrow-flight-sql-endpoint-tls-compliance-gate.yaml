id: arrow-flight-sql-endpoint-tls-compliance-gate
namespace: company.team

description: |
  Probe an Apache Arrow Flight SQL endpoint with a trivial query, classify it HEALTHY,
  TLS_POLICY_VIOLATION or PROBE_FAILED from the real connection outcome and the real
  encryption setting used to reach it, and alert Slack the moment a consumer connects to a
  shared Flight SQL gateway without the encryption your policy requires.

inputs:
  - id: arrow_flight_host
    type: STRING
    displayName: Arrow Flight SQL host
    description: Hostname or IP of the Arrow Flight SQL endpoint.
    defaults: "localhost"

  - id: arrow_flight_port
    type: INT
    displayName: Arrow Flight SQL port
    description: Port the Arrow Flight SQL endpoint listens on.
    defaults: 31337

  - id: use_encryption
    type: BOOL
    displayName: Use encryption
    description: Whether this probe connects with TLS. Maps to the JDBC URL's useEncryption parameter, which defaults to true in the Arrow Flight SQL JDBC driver itself.
    defaults: true

  - id: disable_certificate_verification
    type: BOOL
    displayName: Disable certificate verification
    description: Only for a local test endpoint serving a self-signed certificate. Maps to the JDBC URL's disableCertificateVerification parameter. Leave false against any real endpoint with a certificate from a trusted CA.
    defaults: true

  - id: require_tls
    type: SELECT
    displayName: Require TLS
    description: Your own policy for this endpoint. When true, a probe that connected with use_encryption false is classified TLS_POLICY_VIOLATION instead of HEALTHY, regardless of whether the query itself succeeded.
    values:
      - "true"
      - "false"
    defaults: "true"

tasks:
  - id: probe_arrow_flight_endpoint
    type: io.kestra.plugin.jdbc.arrowflight.Query
    description: Runs a trivial, backend-agnostic query over the Arrow Flight SQL protocol to confirm the endpoint is reachable and authenticating correctly, independent of any particular dataset.
    allowFailure: true
    url: "jdbc:arrow-flight-sql://{{ inputs.arrow_flight_host }}:{{ inputs.arrow_flight_port }}/?useEncryption={{ inputs.use_encryption }}&disableCertificateVerification={{ inputs.disable_certificate_verification }}"
    username: "{{ secret('ARROWFLIGHT_USERNAME') }}"
    password: "{{ secret('ARROWFLIGHT_PASSWORD') }}"
    sql: "SELECT 1 AS probe"
    fetchType: FETCH_ONE

  - id: classify_endpoint_status
    type: io.kestra.plugin.core.debug.Return
    description: PROBE_FAILED when the probe did not return at all, TLS_POLICY_VIOLATION when the probe succeeded but used_encryption is false while require_tls is true, HEALTHY otherwise.
    format: "{{ outputs.probe_arrow_flight_endpoint is not defined ? 'PROBE_FAILED' : ( (not inputs.use_encryption and inputs.require_tls == 'true') ? 'TLS_POLICY_VIOLATION' : 'HEALTHY' ) }}"

  - id: route_by_endpoint_status
    type: io.kestra.plugin.core.flow.Switch
    description: Branch A logs a reachable, policy-compliant endpoint. Branch B alerts Slack with the real host, port, and encryption setting that triggered it.
    value: "{{ outputs.classify_endpoint_status.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Arrow Flight SQL endpoint {{ inputs.arrow_flight_host }}:{{ inputs.arrow_flight_port }} reachable, use_encryption={{ inputs.use_encryption }}."
      "TLS_POLICY_VIOLATION":
        - id: alert_tls_policy_violation
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "Arrow Flight SQL endpoint " ~ inputs.arrow_flight_host ~ ":" ~ inputs.arrow_flight_port ~ " TLS_POLICY_VIOLATION. The probe connected with use_encryption=false while require_tls is true. A client reaching this endpoint right now may be doing the same."} | toJson }}
      "PROBE_FAILED":
        - id: alert_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "Arrow Flight SQL probe for " ~ inputs.arrow_flight_host ~ ":" ~ inputs.arrow_flight_port ~ " did not return a result. Check the host, port, use_encryption, disable_certificate_verification, and the ARROWFLIGHT_USERNAME and ARROWFLIGHT_PASSWORD secrets."} | toJson }}
    defaults:
      - id: log_unexpected_status
        type: io.kestra.plugin.core.log.Log
        message: "Unexpected classify_endpoint_status value: {{ outputs.classify_endpoint_status.value }}"

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Final audit log confirming the gate ran, regardless of the branch taken above.
    message: "Arrow Flight SQL endpoint TLS compliance gate completed. endpoint={{ inputs.arrow_flight_host }}:{{ inputs.arrow_flight_port }} use_encryption={{ inputs.use_encryption }} require_tls={{ inputs.require_tls }} status={{ outputs.classify_endpoint_status.value }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {"text": "Arrow Flight SQL endpoint TLS compliance gate flow failed (execution " ~ execution.id ~ "). Check the execution logs."} | toJson }}

triggers:
  - id: every_30_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled.
    cron: "*/30 * * * *"
    disabled: true
    inputs:
      arrow_flight_host: "localhost"
      arrow_flight_port: 31337
      use_encryption: true
      disable_certificate_verification: true
      require_tls: "true"

extend:
  title: Arrow Flight SQL Endpoint TLS Compliance Gate
  metaTitle: Arrow Flight SQL Endpoint TLS Compliance Gate with Kestra
  shortDescription: Probe an Apache Arrow Flight SQL endpoint and alert Slack when it answers over an unencrypted connection in violation of your own TLS policy.
  metaDescription: Probe an Arrow Flight SQL endpoint on a schedule and alert Slack when it answers without the TLS encryption your policy requires.
  description: |
    Apache Arrow Flight SQL is a gRPC-based protocol that backends like Dremio and Apache
    DataFusion expose, usually as a shared analytics gateway serving several teams. Because
    it is shared infrastructure, nobody necessarily owns watching whether every client still
    connects over an encrypted channel. A connection string with encryption quietly flipped
    off can sit unnoticed for a long time. This blueprint probes the endpoint with a trivial
    query and separately confirms the way it was reached matches your own TLS policy,
    alerting Slack with the real host and port the moment it does not.

    ## How it works

    1. `probe_arrow_flight_endpoint` (`io.kestra.plugin.jdbc.arrowflight.Query`) runs
       `SELECT 1 AS probe`, a trivial, backend-agnostic query, with `allowFailure: true` so a
       bad host, port, or credential does not stop the flow before it can be classified as
       `PROBE_FAILED` below.
    2. `classify_endpoint_status` (`io.kestra.plugin.core.debug.Return`) returns
       `PROBE_FAILED` when the probe did not return at all, `TLS_POLICY_VIOLATION` when it
       succeeded but `use_encryption` is `false` while `require_tls` is `true`, `HEALTHY`
       otherwise.
    3. `route_by_endpoint_status` (`io.kestra.plugin.core.flow.Switch`) branches on that
       status: `HEALTHY` logs it, the other two alert Slack with the real host, port, and
       encryption setting. A `defaults` branch logs anything unexpected.
    4. `log_audit_summary` always runs last. The `errors` block posts to Slack if the flow
       itself fails outside the gate logic above.

    ## What you get

    - A real connectivity check against the actual endpoint.
    - A TLS compliance check against your own policy, not the driver's own default.
    - A Slack alert naming the real host and port, never a generic notice.
    - A fully local test path against an official reference Arrow Flight SQL server.

    ## Who it's for

    - Platform and data infrastructure teams who run a shared Arrow Flight SQL gateway and
      need to know when a client reaches it without encryption.
    - Teams evaluating the Arrow Flight SQL JDBC plugin who want a working example of its
      connection string, independent of any specific backend's data model.

    ## Why orchestrate this with Kestra

    Arrow Flight SQL has no concept of alerting on how it was reached, that is a property of
    each client connection, not something the protocol surfaces on its own. Kestra adds the
    schedule, the policy comparison, and the Slack alert as one declarative, auditable flow.

    ## Prerequisites

    - For local testing, the official reference Arrow Flight SQL server, which ships a small
      TPC-H dataset by default:

      ```
      docker run --name flight-sql -d -p 31337:31337 \
        -e TLS_ENABLED=1 \
        -e FLIGHT_PASSWORD=flight_password \
        voltrondata/flight-sql:latest
      ```

      With `TLS_ENABLED=1` (this image's own default), the server serves a self-signed
      certificate, which is why `disable_certificate_verification` defaults to `true` here.
      Set it `false` against any real endpoint with a certificate from a trusted CA. The
      image hardcodes its username to `flight_username`; only the password is configurable
      via `FLIGHT_PASSWORD`. Note: this image is marked deprecated on Docker Hub in favor of
      `voltrondata/sqlflite`, but remains published and pullable as of this writing.
    - A Slack incoming webhook for alerts.

    ### Secrets

    - `ARROWFLIGHT_USERNAME`, `ARROWFLIGHT_PASSWORD`: credentials for the endpoint. Against
      the reference server, the username is fixed to `flight_username`; the password is
      whatever `FLIGHT_PASSWORD` it was started with.
    - `SLACK_WEBHOOK`: Slack incoming webhook URL used by the alert tasks and the `errors`
      block.

      In Kestra OSS, set these as base64-encoded environment variables, for example
      `SECRET_ARROWFLIGHT_USERNAME`, `SECRET_SLACK_WEBHOOK`.

    ### Inputs

    | Input | Type | Default | Allowed values |
    |---|---|---|---|
    | `arrow_flight_host` | STRING | `localhost` | any reachable Arrow Flight SQL host |
    | `arrow_flight_port` | INT | `31337` | any valid port |
    | `use_encryption` | BOOL | `true` | `true`, `false` |
    | `disable_certificate_verification` | BOOL | `true` | `true`, `false` |
    | `require_tls` | SELECT | `"true"` | `"true"`, `"false"` |

    ### Outputs

    - `{{ outputs.probe_arrow_flight_endpoint.row }}`: the single probe row, when the query
      succeeded.
    - `{{ outputs.classify_endpoint_status.value }}`: `HEALTHY`, `TLS_POLICY_VIOLATION`, or
      `PROBE_FAILED`.

    ## Quick start

    1. Start the reference server above and add the three secrets.
    2. Run this flow manually with the defaults (`use_encryption: true`,
       `require_tls: "true"`), it should report `HEALTHY`.
    3. Run it again with `use_encryption: false`, it should report `TLS_POLICY_VIOLATION`.
    4. Enable the `every_30_minutes` trigger.

    ## How to extend

    - Point this gate at a Dremio coordinator's or a DataFusion server's own Arrow Flight SQL
      port to monitor a real shared gateway instead of the reference server.
    - Add a second probe with `disable_certificate_verification: false` against your own
      internal CA to also catch an expired or wrongly-issued certificate, not just encryption
      left off entirely.
    - Loop this flow with `io.kestra.plugin.core.flow.Loop` across a list of `host:port`
      endpoints to audit an entire fleet of Flight SQL gateways from one flow.

    ## Pitfalls

    - `disable_certificate_verification: true` is meant for the local test server's
      self-signed certificate. Left `true` against a real endpoint, it silently defeats
      certificate validation, which this gate reports the same as a correctly validated
      connection whenever `use_encryption` is `true`.
    - `TLS_POLICY_VIOLATION` only fires when `use_encryption` is `false`. A connection that
      is encrypted but unauthenticated (`disable_certificate_verification: true` against an
      untrusted cert) is not currently distinguished from one that is both, see How to
      extend.
    - `SELECT 1 AS probe` is deliberately trivial so this gate works against any backend
      behind the protocol, confirming the endpoint answers and authenticates, not that any
      dataset behind it is healthy.

    ## Links

    - [Kestra plugin-jdbc-arrow-flight documentation](https://kestra.io/plugins/plugin-jdbc-arrow-flight)
    - [Apache Arrow Flight SQL JDBC driver](https://arrow.apache.org/java/main/flight_sql_jdbc_driver.html)
    - [Reference Arrow Flight SQL server image](https://hub.docker.com/r/voltrondata/flight-sql)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
