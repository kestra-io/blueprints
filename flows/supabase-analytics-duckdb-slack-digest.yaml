id: supabase-analytics-duckdb-slack-digest
namespace: company.team
description: |
  Extract weekly analytics events from Supabase via PostgREST, compute aggregation metrics
  in-memory using DuckDB SQL, and push a weekly digest report to a Slack channel.

inputs:
  - id: supabase_url
    type: STRING
    displayName: Supabase Project URL
    description: The base REST URL of your Supabase project (e.g. https://xyzcompany.supabase.co).
    defaults: "https://xyzcompany.supabase.co"

  - id: table_name
    type: STRING
    displayName: Analytics Table Name
    description: The Supabase table containing user activity telemetry events.
    defaults: "user_events"

  - id: lookback_days
    type: INT
    displayName: Lookback Period (Days)
    description: Number of days of event history to extract from Supabase.
    defaults: 7

triggers:
  - id: weekly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true

tasks:
  - id: extract_events
    type: io.kestra.plugin.supabase.Select
    description: Query raw user event telemetry from Supabase PostgREST API for the specified lookback window.
    url: "{{ inputs.supabase_url }}"
    apiKey: "{{ secret('SUPABASE_API_KEY') }}"
    table: "{{ inputs.table_name }}"
    select: "id,user_id,event_type,channel,created_at"
    filter: "created_at=gte.{{ execution.startDate | dateAdd(-inputs.lookback_days, 'DAYS') }}"

  - id: analyze_metrics
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Perform fast SQL analytics on extracted Supabase records using DuckDB in-memory engine.
    url: "jdbc:duckdb:"
    inputFiles:
      events.json: "{{ outputs.extract_events.uri }}"
    sql: |
      SELECT
        event_type,
        count(DISTINCT user_id) AS active_users,
        count(*) AS total_events
      FROM read_json_auto('{{ workingDir }}/events.json')
      GROUP BY event_type
      ORDER BY total_events DESC;
    fetchType: FETCH

  - id: check_results
    type: io.kestra.plugin.core.flow.If
    description: Branch based on whether events were found in the lookback window.
    condition: "{{ outputs.analyze_metrics.size > 0 }}"
    then:
      - id: send_slack_digest
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the computed weekly analytics digest to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "📊 *Supabase Weekly Analytics Digest (Past {{ inputs.lookback_days }} Days)*\nTotal event categories: *{{ outputs.analyze_metrics.size }}*\nTop Event: *{{ outputs.analyze_metrics.rows[0].event_type }}* ({{ outputs.analyze_metrics.rows[0].total_events }} events from {{ outputs.analyze_metrics.rows[0].active_users }} active users)"
          }
    else:
      - id: log_no_events
        type: io.kestra.plugin.core.log.Log
        description: Log notice when no event records are present in the lookback window.
        message: "No user events were found in Supabase for the past {{ inputs.lookback_days }} days."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Send a failure alert to Slack if the analytics pipeline errors out.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":rotating_light: Flow {{ flow.namespace }}.{{ flow.id }} (Execution `{{ execution.id }}`) failed - Error: {{ error.message }}"
      }

extend:
  shortDescription: Extract user event telemetry from Supabase, run in-memory SQL analytics with DuckDB, and send a weekly metrics digest to Slack.
  title: Supabase Analytics Pipeline with DuckDB In-Memory Aggregations and Slack Metric Digest
  metaTitle: Supabase Analytics with DuckDB and Kestra
  metaDescription: Extract user telemetry from Supabase, run SQL aggregations in DuckDB, and send automated metric summaries to Slack with Kestra.
  description: |
    Automate weekly analytics reporting on Supabase user event telemetry. This workflow extracts activity records via PostgREST, performs in-memory SQL aggregations with DuckDB, and delivers a metric digest to Slack.

    ## What you get

    - Automated weekly event metrics digest delivered to Slack.
    - Zero-footprint in-memory SQL aggregations using DuckDB.
    - Automatic handling for empty event windows using flow conditional branching.

    ## Prerequisites

    - A Supabase project with an analytics or telemetry event table.
    - A Slack incoming webhook URL for notifications.
    - Note on Supabase Row Cap: PostgREST caps single-request REST queries to 1,000 rows by default.

    ## Secrets

    - `SUPABASE_API_KEY`: Your Supabase API key.
      - **Role note**: Use the `service_role` key to bypass Row Level Security (RLS), or the `anon` key if your RLS policies explicitly allow public read access to the telemetry table.
    - `SLACK_WEBHOOK_URL`: Incoming Webhook URL configured in your Slack workspace.

    ## Quick start

    1. Run the seed SQL below in the Supabase SQL editor.
    2. Add the `SUPABASE_API_KEY` and `SLACK_WEBHOOK_URL` secrets.
    3. Set `supabase_url` to your project URL and run the flow manually.

    ## Expected output

    - `extract_events` writes the fetched rows to `{{ outputs.extract_events.uri }}`.
    - `analyze_metrics` returns one row per event type in `{{ outputs.analyze_metrics.rows }}` (`event_type`, `active_users`, `total_events`).
    - Slack receives a digest with the number of event categories and the top event. With the seed data, `page_view` comes first with 2 events from 2 active users.

    ## Seed SQL

    To set up the sample `user_events` table in your Supabase SQL Editor:

    ```sql
    CREATE TABLE IF NOT EXISTS public.user_events (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL,
        event_type TEXT NOT NULL,
        channel TEXT DEFAULT 'web',
        created_at TIMESTAMPTZ DEFAULT now()
    );

    INSERT INTO public.user_events (user_id, event_type, channel, created_at) VALUES
        ('a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11', 'page_view', 'web', now() - interval '2 days'),
        ('a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11', 'button_click', 'web', now() - interval '2 days'),
        ('b1eebc99-9c0b-4ef8-bb6d-6bb9bd380a22', 'page_view', 'mobile', now() - interval '1 day'),
        ('b1eebc99-9c0b-4ef8-bb6d-6bb9bd380a22', 'checkout_start', 'mobile', now() - interval '1 day'),
        ('c2eebc99-9c0b-4ef8-bb6d-6bb9bd380a33', 'checkout_complete', 'web', now());
    ```

    ## Links

    - [Kestra Supabase Plugin Documentation](https://kestra.io/plugins/plugin-supabase)
    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)

  tags:
    - Data
    - Business
    - Cloud
  subTags:
    - Reporting & Digests
    - ELT & Warehouse Loading
  ee: false
  demo: false
