id: aws-sqs-dead-letter-queue-replay-gate
namespace: company.team

inputs:
  - id: dlq_url
    type: STRING
    defaults: "https://sqs.us-east-1.amazonaws.com/123456789012/order-processing-dlq"
    description: "Amazon SQS Dead Letter Queue (DLQ) URL to monitor."

  - id: target_queue_url
    type: STRING
    defaults: "https://sqs.us-east-1.amazonaws.com/123456789012/order-processing-main"
    description: "Primary Amazon SQS queue URL for consumer replay processing."

  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: "Target AWS Region where the SQS queues reside."

  - id: max_messages_to_inspect
    type: INT
    defaults: 10
    description: "Maximum batch of messages to sample and analyze from the DLQ in each run."

  - id: slack_webhook_url
    type: STRING
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
    description: "Slack Incoming Webhook URL for alerting on DLQ accumulation."

tasks:
  - id: sample_dlq_messages
    type: io.kestra.plugin.aws.sqs.Consume
    queueUrl: "{{ inputs.dlq_url }}"
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    maxNumberOfMessages: "{{ inputs.max_messages_to_inspect }}"
    visibilityTimeout: 30

  - id: analyze_dead_letter_payloads
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      consumed.json: "{{ outputs.sample_dlq_messages.messages | default('[]') | json }}"
    outputFiles:
      - dlq_triage_report.json
    script: |
      import json
      from kestra import Kestra

      with open("consumed.json", "r", encoding="utf-8") as f:
          messages = json.load(f)

      count = len(messages)
      triage_records = []

      for idx, msg in enumerate(messages):
          body = msg.get("data", msg.get("body", "{}"))
          attributes = msg.get("attributes", {})
          message_id = msg.get("id", f"msg-{idx}")

          triage_records.append({
              "message_id": message_id,
              "payload_preview": str(body)[:200],
              "attributes": attributes
          })

      report = {
          "dlq_url": "{{ inputs.dlq_url }}",
          "sampled_count": count,
          "has_backlog": count > 0,
          "records": triage_records
      }

      with open("dlq_triage_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "backlog_detected": count > 0,
          "message_count": count,
          "sample_preview": triage_records[0]["payload_preview"] if triage_records else "None"
      })

  - id: evaluate_backlog_condition
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.analyze_dead_letter_payloads.vars.backlog_detected }}"
    then:
      - id: alert_on_call_dlq_accumulation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ inputs.slack_webhook_url }}"
        payload: |
          {
            "text": "AWS SQS Dead Letter Queue Alert: Detected {{ outputs.analyze_dead_letter_payloads.vars.message_count }} failed messages in DLQ ({{ inputs.dlq_url }}). Target queue: {{ inputs.target_queue_url }}. Sample error preview: {{ outputs.analyze_dead_letter_payloads.vars.sample_preview }}."
          }

  - id: log_dlq_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "AWS SQS DLQ inspection completed. Sampled messages: {{ outputs.analyze_dead_letter_payloads.vars.message_count }}. Backlog detected: {{ outputs.analyze_dead_letter_payloads.vars.backlog_detected }}."

triggers:
  - id: dlq_check_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"

extend:
  title: "AWS SQS Dead Letter Queue Replay Gate"
  shortDescription: "Inspects AWS SQS DLQ backlogs, extracts error context, and alerts operations teams."
  metaTitle: "AWS SQS Dead Letter Queue Replay Gate | Kestra Blueprint"
  metaDescription: "Monitors AWS SQS Dead Letter Queues, samples unprocessable message payloads, and triggers operational alerts before message retention expiration."
  tags:
    - Cloud
    - Infrastructure
    - Data
  ee: false
  demo: false
  description: |
    ### What It Does
    This blueprint monitors Amazon SQS Dead Letter Queues (DLQ) for unprocessable messages diverted from primary microservices. It safely consumes sample batches without dropping payloads, extracts failure context, and alerts engineering teams through Slack before messages expire past the DLQ retention window.

    ### Prerequisites
    - An AWS IAM user or role with permissions: `sqs:ReceiveMessage`, `sqs:GetQueueAttributes`, `sqs:SendMessage`.
    - AWS credentials configured as secrets: `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`.
    - Slack Incoming Webhook configured as secret `SLACK_WEBHOOK_URL`.

    ### Quick Start
    1. Provide your source Dead Letter Queue URL in `dlq_url`.
    2. Set the destination processing queue URL in `target_queue_url`.
    3. Specify the appropriate AWS Region (e.g., `us-east-1` or `eu-west-1`).
    4. Run on schedule to continuously monitor DLQ depth.

    ### Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `dlq_url` | STRING | `https://sqs.us-east-1.amazonaws.com/...` | SQS Dead Letter Queue URL |
    | `target_queue_url` | STRING | `https://sqs.us-east-1.amazonaws.com/...` | Main primary SQS queue URL |
    | `aws_region` | STRING | `us-east-1` | AWS region hosting the queues |
    | `max_messages_to_inspect` | INT | `10` | Maximum message batch to sample per cycle |
    | `slack_webhook_url` | STRING | `{{ secret('SLACK_WEBHOOK_URL') }}` | Slack notification destination |

    ### Expected Outputs
    - `outputs.analyze_dead_letter_payloads.vars.backlog_detected`: Boolean indicating if messages were found in the DLQ.
    - `outputs.analyze_dead_letter_payloads.vars.message_count`: Number of sampled messages from the queue.
    - `outputs.analyze_dead_letter_payloads.outputFiles['dlq_triage_report.json']`: JSON report containing payload previews and message IDs.

    ### Common Pitfalls
    - Ensure `visibilityTimeout` is long enough so sampling does not immediately cause concurrent consumers to re-fetch the same batch.
    - FIFO queues require message deduplication IDs and group IDs when redriving messages.
