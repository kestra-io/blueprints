id: aws-sqs-dead-letter-queue-replay-gate
namespace: company.team
description: |
  Automated Amazon SQS Dead Letter Queue (DLQ) backlog inspector and triage gate. Samples failed messages,
  extracts error attributes, and dispatches actionable Slack alerts before retention timeout expiration.

concurrency:
  limit: 1

inputs:
  - id: dlq_url
    type: STRING
    displayName: SQS Dead Letter Queue URL
    defaults: "https://sqs.us-east-1.amazonaws.com/123456789012/order-processing-dlq"
    description: "Amazon SQS Dead Letter Queue URL to monitor and sample."

  - id: target_queue_url
    type: STRING
    displayName: Primary SQS Target Queue URL
    defaults: "https://sqs.us-east-1.amazonaws.com/123456789012/order-processing-main"
    description: "Primary Amazon SQS queue URL where redriven messages should be routed."

  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: "us-east-1"
    description: "AWS region hosting the target SQS queue instances."

  - id: max_messages_to_inspect
    type: INT
    displayName: Inspection Batch Size
    defaults: 10
    description: "Maximum batch of unprocessable messages to sample and analyze per cycle."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#ops-alerts"
    description: "Slack channel destination for DLQ backlog escalation alerts."

triggers:
  - id: dlq_check_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Executes DLQ inspection every 30 minutes."
    cron: "*/30 * * * *"

tasks:
  - id: sample_dlq_messages
    type: io.kestra.plugin.aws.sqs.Consume
    description: "Samples a batch of messages from the Dead Letter Queue without dropping payloads."
    queueUrl: "{{ inputs.dlq_url }}"
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    maxRecords: "{{ inputs.max_messages_to_inspect }}"
    visibilityTimeout: 30

  - id: analyze_dead_letter_payloads
    type: io.kestra.plugin.scripts.python.Script
    description: "Inspects failed payload structures, extracts diagnostic headers, and compiles triage report."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      consumed.json: "{{ outputs.sample_dlq_messages.messages | default('[]') | json }}"
    outputFiles:
      - dlq_triage_report.json
    script: |
      import json
      from kestra import Kestra

      with open("consumed.json", "r", encoding="utf-8") as f:
          messages = json.load(f)

      count = len(messages)
      triage_records = []

      for idx, msg in enumerate(messages):
          body = msg.get("data", msg.get("body", "{}"))
          attributes = msg.get("attributes", {})
          message_id = msg.get("id", f"msg-{idx}")

          triage_records.append({
              "message_id": message_id,
              "payload_preview": str(body)[:200],
              "attributes": attributes
          })

      report = {
          "dlq_url": "{{ inputs.dlq_url }}",
          "sampled_count": count,
          "has_backlog": count > 0,
          "records": triage_records
      }

      with open("dlq_triage_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "backlog_detected": count > 0,
          "message_count": count,
          "sample_preview": triage_records[0]["payload_preview"] if triage_records else "None"
      })

  - id: evaluate_backlog_condition
    type: io.kestra.plugin.core.flow.If
    description: "Branches execution based on whether unprocessable messages were detected in the DLQ."
    condition: "{{ outputs.analyze_dead_letter_payloads.vars.backlog_detected }}"
    then:
      - id: alert_on_call_dlq_accumulation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches operational triage card to on-call engineers via Slack."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*AWS SQS Dead Letter Queue Backlog Alert*\n• *DLQ Name*: `{{ inputs.dlq_url }}`\n• *Target Primary Queue*: `{{ inputs.target_queue_url }}`\n• *Sampled Dead Letter Messages*: `{{ outputs.analyze_dead_letter_payloads.vars.message_count }}`\n• *Sample Error Payload Preview*: `{{ outputs.analyze_dead_letter_payloads.vars.sample_preview }}`\n• *Operational Impact*: Failed messages in the DLQ indicate consumer deserialization errors, poison pill payloads, or third-party downstream timeouts.\n• *Recommended Remediation*: Inspect payload schema, resolve downstream consumer issues, and initiate redrive to `{{ inputs.target_queue_url }}`."
          }

    else:
      - id: log_clean_dlq_status
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation of empty Dead Letter Queue state."
        message: "AWS SQS DLQ inspection compliant. Zero failed messages detected in {{ inputs.dlq_url }}."

  - id: export_dlq_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON audit manifest for observability dashboards."
    format: |
      {
        "pipeline": "aws-sqs-dead-letter-queue-replay-gate",
        "audited_at": "{{ execution.startDate }}",
        "dlq_url": "{{ inputs.dlq_url }}",
        "messages_detected": {{ outputs.analyze_dead_letter_payloads.vars.message_count }},
        "status": "{{ outputs.analyze_dead_letter_payloads.vars.backlog_detected ? 'BACKLOG_DETECTED' : 'CLEAN' }}"
      }

extend:
  shortDescription: "Inspects AWS SQS DLQ backlogs, extracts error context, and alerts operations teams."
  title: "AWS SQS Dead Letter Queue Replay Gate"
  metaTitle: "AWS SQS Dead Letter Queue Replay Gate | Kestra Blueprint"
  metaDescription: "Monitors AWS SQS Dead Letter Queues, samples unprocessable message payloads, and triggers operational alerts before message retention expiration."
  description: |
    In event-driven cloud architectures using Amazon Simple Queue Service (SQS), Dead Letter Queues (DLQs) act as safety buffers for messages that repeatedly fail consumer processing due to unhandled exceptions, schema shifts, or downstream timeout errors.

    However, messages residing in a DLQ remain subject to standard SQS retention periods (typically 4 to 14 days). If operational teams are unaware of accumulating dead-letter messages, critical customer events, such as invoice generation, order confirmations, or account provisioning, are silently discarded when retention windows elapse.

    This blueprint provides an automated sentinel that probes designated Amazon SQS Dead Letter Queues on a 30-minute schedule. It samples messages without dropping payloads, extracts failure context and payload previews, and posts structured triage notifications to Slack before data loss occurs.

    ## How it works

    1. **Scheduled Monitoring**: The `dlq_check_schedule` trigger (`io.kestra.plugin.core.trigger.Schedule`) executes every 30 minutes.
    2. **Message Sampling**: The `sample_dlq_messages` task (`io.kestra.plugin.aws.sqs.Consume`) fetches a controlled batch of messages with a safety visibility timeout.
    3. **Payload Inspection**: The `analyze_dead_letter_payloads` task (`io.kestra.plugin.scripts.python.Script`) extracts message bodies and metadata attributes into `dlq_triage_report.json`.
    4. **Condition Branching**: The `evaluate_backlog_condition` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether unprocessable messages were identified.
    5. **Slack Notification**: If messages exist, `alert_on_call_dlq_accumulation` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a formatted incident card.
    6. **Audit Manifest**: The `export_dlq_manifest` task records queue health metadata for execution tracking.

    ## What you get

    - Automated DLQ backlog monitoring preventing silent message loss from retention timeouts.
    - Safe batch sampling preserving message payloads in the queue for subsequent remediation.
    - Formatted Slack alerts with error previews, queue targets, and redrive recommendations.
    - JSON diagnostic artifacts capturing raw payload headers for debugging.

    ## Who it is for

    - Cloud Engineers and DevOps teams operating AWS SQS-based event-driven pipelines.
    - Application Developers maintaining microservice consumers that process asynchronous workloads.
    - Reliability Engineers responsible for zero-data-loss SLAs.

    ## Why orchestrate this with Kestra

    Building custom Lambda pollers or CloudWatch metric alarms often requires configuring multiple IAM roles, Lambda deployment packages, and SNS topic subscriptions. Kestra replaces that complexity with a declarative workflow that combines native SQS consumption, Docker-isolated Python inspection, and rich Slack integrations with zero infrastructure maintenance.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `dlq_url` | STRING | `https://sqs.us-east-1.amazonaws.com/...` | Amazon SQS Dead Letter Queue URL to monitor. |
    | `target_queue_url` | STRING | `https://sqs.us-east-1.amazonaws.com/...` | Primary queue where redriven messages should land. |
    | `aws_region` | STRING | `us-east-1` | AWS region hosting the queues. |
    | `max_messages_to_inspect` | INT | `10` | Maximum messages sampled per cycle. |
    | `slack_channel` | STRING | `#ops-alerts` | Slack channel destination for alerts. |

    ## Expected outputs

    - `{{ outputs.analyze_dead_letter_payloads.vars.backlog_detected }}`: Boolean flag indicating if messages were present.
    - `{{ outputs.analyze_dead_letter_payloads.vars.message_count }}`: Number of messages sampled.
    - `{{ outputs.analyze_dead_letter_payloads.vars.sample_preview }}`: Text snippet of the first sampled message payload.
    - `{{ outputs.analyze_dead_letter_payloads.outputFiles['dlq_triage_report.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - AWS IAM user or role with permissions: `sqs:ReceiveMessage`, `sqs:GetQueueAttributes`.
    - AWS credentials configured in Kestra secrets.
    - Slack Incoming Webhook configured for operational notifications.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI to run an initial DLQ sampling check.
    4. Review execution outputs and Slack channels for verification.

    ## Common pitfalls and troubleshooting

    - **Visibility Timeout**: Setting `visibilityTimeout` too low may cause sampled messages to become visible to concurrent consumers immediately; 30 seconds provides sufficient buffer for inspection.
    - **FIFO Queues**: Standard SQS queues use random sampling; FIFO queues strictly preserve message ordering and require Message Deduplication IDs when redriving.
    - **Retention Window**: SQS default retention is 4 days; verify your queue retention settings allow sufficient time for engineer intervention.

    ## How to extend

    - Add an automated redrive task using `io.kestra.plugin.aws.sqs.Produce` to automatically replay sanitized messages back to `target_queue_url`.
    - Integrate with Jira via `io.kestra.plugin.jira.CreateIssue` to track recurring poison-pill messages in sprint backlogs.
    - Filter messages by specific error exception codes before redriving.

    ## Links

    - Kestra AWS SQS Plugin Documentation: https://kestra.io/plugins/plugin-aws/io.kestra.plugin.aws.sqs.Consume
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - AWS SQS Dead Letter Queue Documentation: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - Monitoring & Alerting
  ee: false
  demo: false
