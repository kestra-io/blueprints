id: crossref-funded-research-metadata-loader
namespace: company.data

description: |
  Ingest scholarly publication metadata with grant funding details from the CrossRef REST API,
  flatten nested author and institutional award arrays into columnar Parquet using DuckDB,
  track incremental cursor state in Kestra KV store, and identify high-impact multi-funder research papers.

inputs:
  - id: query_subject
    type: STRING
    defaults: "artificial intelligence"
    description: Bibliographic topic or keyword filter for querying publication records.

  - id: batch_rows
    type: INT
    defaults: 50
    description: Maximum number of research publication records to ingest per execution pass.

  - id: state_key
    type: STRING
    defaults: crossref_last_ingested_doi_state
    description: Kestra KV store key maintaining the latest processed publication DOI identifier.

concurrency:
  limit: 1
  behavior: CANCEL

triggers:
  - id: daily_research_harvest
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"
    description: Synchronize academic publication records daily at 02:00 UTC.

tasks:
  - id: fetch_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_publications
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install duckdb requests
    env:
      QUERY: "{{ inputs.query_subject }}"
      ROWS: "{{ inputs.batch_rows }}"
      LAST_DOI: "{{ outputs.fetch_state.value ?? '' }}"
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import urllib.parse
        import requests
        import duckdb

        query = os.environ.get("QUERY", "artificial intelligence")
        rows = int(os.environ.get("ROWS", 50))
        last_doi = os.environ.get("LAST_DOI", "")

        encoded_query = urllib.parse.quote(query)
        url = f"https://api.crossref.org/works?query={encoded_query}&filter=has-funder:true&sort=indexed&order=desc&rows={rows}"
        headers = {"User-Agent": "Kestra-Research-ETL/2.0 (mailto:data-team@company.internal)"}

        response = requests.get(url, headers=headers, timeout=30)
        response.raise_for_status()
        data = response.json()
        raw_items = data.get("message", {}).get("items", [])

        flattened = []
        for it in raw_items:
            doi = it.get("DOI", "")
            title = it.get("title", [""])[0] if it.get("title") else "Untitled"
            publisher = it.get("publisher", "Unknown")
            type_name = it.get("type", "journal-article")
            citations = it.get("is-referenced-by-count", 0)
            funders = it.get("funder", [])
            funder_names = [f.get("name") for f in funders if f.get("name")]
            created_date = it.get("created", {}).get("date-time", "")

            flattened.append({
                "doi": doi,
                "title": title,
                "publisher": publisher,
                "publication_type": type_name,
                "citation_count": int(citations) if citations is not None else 0,
                "funder_count": len(funder_names),
                "funders_list": ", ".join(funder_names),
                "indexed_date": created_date
            })

        with open("publications.json", "w", encoding="utf-8") as f:
            json.dump(flattened, f)

        con = duckdb.connect()
        if flattened:
            con.execute("CREATE TABLE papers AS SELECT * FROM read_json_auto('publications.json')")
            con.execute("COPY papers TO 'funded_publications.parquet' (FORMAT PARQUET)")
            con.execute("COPY papers TO 'funded_publications.csv' (HEADER, DELIMITER ',')")

            top_funded = con.execute("""
                SELECT doi, title, funder_count, citation_count
                FROM papers
                WHERE funder_count >= 3
                ORDER BY citation_count DESC
            """).df().to_dict(orient="records")

            newest_doi = flattened[0]["doi"]
        else:
            con.execute("""
                CREATE TABLE papers (
                    doi VARCHAR,
                    title VARCHAR,
                    publisher VARCHAR,
                    publication_type VARCHAR,
                    citation_count INT,
                    funder_count INT,
                    funders_list VARCHAR,
                    indexed_date VARCHAR
                )
            """)
            con.execute("COPY papers TO 'funded_publications.parquet' (FORMAT PARQUET)")
            con.execute("COPY papers TO 'funded_publications.csv' (HEADER, DELIMITER ',')")
            top_funded = []
            newest_doi = last_doi

        summary = {
            "papers_ingested": len(flattened),
            "multi_funder_papers": len(top_funded),
            "top_funded": top_funded[:5],
            "latest_doi": newest_doi
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - funded_publications.parquet
      - funded_publications.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_publications.vars.latest_doi }}"

  - id: log_findings
    type: io.kestra.plugin.core.log.Log
    message: "Ingested {{ outputs.ingest_and_transform_publications.vars.papers_ingested }} research publication(s) into Parquet. Identified {{ outputs.ingest_and_transform_publications.vars.multi_funder_papers }} multi-funder grant paper(s)."

outputs:
  - id: papers_count
    type: INT
    value: "{{ outputs.ingest_and_transform_publications.vars.papers_ingested }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_publications.outputFiles['funded_publications.parquet'] }}"

extend:
  title: CrossRef Funded Research Publication Metadata Loader with DuckDB
  metaTitle: CrossRef Research Metadata Loader | Kestra
  shortDescription: Ingests scholarly publications with grant funding data from CrossRef into analytical Parquet lakehouse storage via DuckDB.
  metaDescription: Poll CrossRef REST API for funded research papers, normalize into Parquet with DuckDB, maintain KV state, and catalog grant funders.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Orchestrate automated, reliable synchronization of scholarly research publications, citation metrics,
    and institutional grant funding details from the official CrossRef REST API into analytical Parquet storage using DuckDB.

    ## How it works

    1. **State Recovery**: Retrieves the most recent publication DOI high-watermark from Kestra KV store (`crossref_last_ingested_doi_state`) to maintain incremental pipeline status.
    2. **CrossRef Extraction**: Connects to the public CrossRef REST endpoint (`api.crossref.org/works`) filtering for publications backed by verified grant awards.
    3. **DuckDB Data Normalization**: Flattens nested funding agencies, publishers, and citation metrics into standardized relational schemas inside an isolated Docker container.
    4. **Analytical Lake Export**: Generates columnar Parquet and CSV files for immediate integration into enterprise data warehouses and feature stores.
    5. **High-Impact Identification**: Classifies multi-funder collaborative studies and updates state in Kestra KV store.

    ## What you get

    - Automated recurring academic research tracking without private API credentials or rate charges.
    - Columnar Parquet datasets structured for R&D competitive intelligence and research grant analysis.
    - Built-in KV state management providing idempotent execution and cursor tracking.

    ## Who it's for

    - Corporate R&D and patent intelligence teams tracking external scientific breakthroughs.
    - Academic institutions and university libraries monitoring funded research output.
    - Life sciences and technology analytics teams compiling domain literature feature stores.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains cursor state across runs without external database dependencies.
    - Ephemeral Docker execution isolates Python and DuckDB dependencies cleanly.
    - Declarative YAML workflows provide transparent logging, audit trails, and scheduling.

    ## Prerequisites

    - Docker runtime configured for Kestra task runners.
    - Outbound internet access to `api.crossref.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding high-impact research digests.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Adjust the `query_subject` input with your preferred research domain (e.g. "quantum computing", "crispr").
    3. Click **Execute** to run an on-demand publication extraction.
    4. Enable the `daily_research_harvest` trigger for automated daily refreshes.

    ## How to extend

    - Add an S3 or Google Cloud Storage task to archive daily Parquet partitions.
    - Connect an AI summarization task to generate executive digests of top-cited publications.

    ## Links

    - [CrossRef REST API Documentation](https://www.crossref.org/documentation/retrieve-metadata/rest-api/)
    - [DuckDB Parquet Export Guide](https://duckdb.org/docs/data/parquet/overview.html)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
