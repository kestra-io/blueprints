id: river-flood-early-warning-ollama
namespace: company.team
description: |
  River flood early warning with a local LLM. Every six hours the flow pulls
  the 7-day river discharge forecast for each monitored river point from the
  Open-Meteo Flood API, flags the points whose forecast peak crosses their
  alert level or rises sharply, has an Ollama model write a short
  plain-language risk bulletin, posts it to Slack when a point is at risk, and
  sends a separate Slack alert if the flow fails.

inputs:
  - id: stations
    type: JSON
    displayName: Monitored river points
    description: >-
      List of river points to watch. Each item needs a name, latitude,
      longitude and alert_m3s (the discharge in m³/s that your team treats as
      an alert level). The defaults are two major rivers in Tabasco, Mexico;
      the alert levels are example values, so replace them with the levels
      your local water authority uses.
    defaults: |
      [
        {"name": "Usumacinta at Boca del Cerro (Tabasco, MX)", "latitude": 17.52, "longitude": -91.48, "alert_m3s": 5000},
        {"name": "Grijalva near Villahermosa (Tabasco, MX)", "latitude": 18.09, "longitude": -93.03, "alert_m3s": 2500}
      ]

  - id: rise_alert_pct
    type: INT
    displayName: Sudden rise alert (%)
    description: Non-negative percentage. Also flag a point when its 7-day forecast peak is at least this many percent above today's modeled discharge, even if it stays under alert_m3s.
    defaults: 50

  - id: bulletin_language
    type: SELECT
    displayName: Bulletin language
    description: Language the LLM writes the risk bulletin in.
    values:
      - English
      - Spanish
      - Portuguese
      - French
    defaults: English

  - id: model
    type: STRING
    displayName: Ollama model
    description: Local Ollama model that writes the bulletin. It must already be pulled with `ollama pull <model>`.
    defaults: gemma3:4b

  - id: ollama_endpoint
    type: STRING
    displayName: Ollama endpoint
    description: Base URL where Ollama listens. Use http://host.docker.internal:11434 when Kestra runs in Docker and Ollama runs on the host.
    defaults: "http://localhost:11434"

tasks:
  - id: check_rivers
    type: io.kestra.plugin.core.flow.Loop
    description: Fetch and evaluate the forecast for each river point, one point at a time to stay well inside the API's rate limits.
    values: "{{ inputs.stations }}"
    concurrencyLimit: 1
    tasks:
      - id: fetch_forecast
        type: io.kestra.plugin.core.http.Request
        description: Download today's modeled discharge and the 7-day maximum ensemble discharge forecast (GloFAS) for the current point.
        uri: "https://flood-api.open-meteo.com/v1/flood?latitude={{ fromJson(item.value).latitude }}&longitude={{ fromJson(item.value).longitude }}&daily=river_discharge,river_discharge_max&forecast_days=7"
        method: GET
    outputs:
      - id: name
        type: STRING
        description: Human-readable name of the river point.
        value: "{{ fromJson(item.value).name }}"
      - id: today_m3s
        type: STRING
        description: Modeled discharge for today, in m³/s.
        value: "{{ outputs.fetch_forecast.body | jq('.daily.river_discharge[0]') | first }}"
      - id: peak_m3s
        type: STRING
        description: Highest maximum ensemble discharge forecast over the next 7 days, in m³/s.
        value: "{{ outputs.fetch_forecast.body | jq('.daily.river_discharge_max | max') | first }}"
      - id: peak_date
        type: STRING
        description: Date of the forecast peak.
        value: "{{ outputs.fetch_forecast.body | jq('.daily as $d | ($d.river_discharge_max | index($d.river_discharge_max | max)) as $i | $d.time[$i]') | first }}"
      - id: alert_m3s
        type: STRING
        description: Alert level configured for this point, in m³/s.
        value: "{{ fromJson(item.value).alert_m3s }}"
      - id: at_risk
        type: BOOL
        description: True when the forecast peak reaches the alert level or is at least rise_alert_pct percent above today's modeled discharge.
        value: "{{ outputs.fetch_forecast.body | jq('.daily as $d | ($d.river_discharge_max | max) as $peak | ($peak >= ' ~ fromJson(item.value).alert_m3s ~ ') or ($d.river_discharge[0] > 0 and $peak >= $d.river_discharge[0] * (1 + ' ~ inputs.rise_alert_pct ~ ' / 100))') | first }}"

  - id: write_bulletin
    type: io.kestra.plugin.ai.completion.ChatCompletion
    description: Turn the raw numbers into a short, calm, plain-language bulletin with a local Ollama model, so no data leaves your infrastructure.
    provider:
      type: io.kestra.plugin.ai.provider.Ollama
      modelName: "{{ inputs.model }}"
      endpoint: "{{ inputs.ollama_endpoint }}"
    messages:
      - type: SYSTEM
        content: |
          You write short river flood bulletins for an operations team.
          Use only the data provided; never invent water levels, places or forecasts.
          Write in {{ inputs.bulletin_language }}, in plain text without markdown headings, under 150 words.
          Start with one line saying whether any point needs attention. Then give one line per point with
          today's discharge, the 7-day peak and its date. For at-risk points, add one practical, non-alarmist
          next step (for example: monitor every few hours, check local civil protection notices).
          Remind readers that this is a model forecast and official warnings take priority.
      - type: USER
        content: |
          Forecast summary (discharge in m³/s, source: Open-Meteo Flood API, GloFAS model):
          {% for p in (outputs.check_rivers.outputs | jq('sort_by(.item.iteration) | map(.outputs)') | first) %}
          - {{ p.name }}: today {{ p.today_m3s }}, 7-day peak {{ p.peak_m3s }} on {{ p.peak_date }}, alert level {{ p.alert_m3s }}, at risk: {{ p.at_risk }}
          {% endfor %}

  - id: save_bulletin
    type: io.kestra.plugin.core.storage.Write
    description: Keep every bulletin, with the numbers behind it, as a markdown file in Kestra internal storage for audit and later comparison.
    extension: .md
    content: |
      # River flood bulletin, {{ execution.startDate | date("yyyy-MM-dd HH:mm") }}

      {{ outputs.write_bulletin.textOutput }}

      ## Data
      | Point | Today (m³/s) | 7-day peak (m³/s) | Peak date | Alert level | At risk |
      |---|---|---|---|---|---|
      {% for p in (outputs.check_rivers.outputs | jq('sort_by(.item.iteration) | map(.outputs)') | first) %}| {{ p.name }} | {{ p.today_m3s }} | {{ p.peak_m3s }} | {{ p.peak_date }} | {{ p.alert_m3s }} | {{ p.at_risk }} |
      {% endfor %}

      Source: [Open-Meteo Flood API](https://open-meteo.com/en/docs/flood-api) (GloFAS). Execution {{ execution.id }}.

  - id: alert_if_needed
    type: io.kestra.plugin.core.flow.If
    description: Only notify people when at least one point is at risk, so the channel stays quiet on normal days.
    condition: "{{ outputs.check_rivers.outputs | jq('map(select((.outputs.at_risk | tostring) == \"true\")) | length > 0') | first }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the generated bulletin to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :ocean: River flood early warning ({{ flow.id }})
          {{ outputs.write_bulletin.textOutput }}
          Full bulletin and data: execution {{ execution.id }}
    else:
      - id: all_clear
        type: io.kestra.plugin.core.log.Log
        description: Record that no point met the alert-level or sudden-rise criteria.
        message: "None of the {{ outputs.check_rivers.iterationCount }} river points met the alert-level or sudden-rise criteria for the next 7 days."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Tell the team when the warning itself fails (API down, Ollama unreachable), because a silent early-warning flow is worse than none.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":warning: River flood early warning FAILED in {{ flow.id }} (execution {{ execution.id }}). Check whether the Open-Meteo request or the Ollama call broke."

triggers:
  - id: every_six_hours
    type: io.kestra.plugin.core.trigger.Schedule
    description: Re-check the forecast four times a day; GloFAS updates daily, so more often adds load without new information.
    cron: "0 */6 * * *"
    disabled: true

extend:
  title: River Flood Early Warning with Open-Meteo and a Local Ollama Model
  metaTitle: River Flood Early Warning with Kestra, Open-Meteo and Ollama
  shortDescription: Check 7-day river discharge forecasts from the Open-Meteo Flood API, flag rising rivers, have a local Ollama model write a plain-language bulletin, and alert Slack only when a point is at risk.
  metaDescription: Monitor river discharge forecasts with Open-Meteo, write flood risk bulletins with a local Ollama LLM, and alert Slack only when a river is at risk.
  description: |
    Floods rarely arrive without warning: global hydrological models such as GloFAS forecast river discharge days ahead, and the forecasts are openly available. What's usually missing is the last mile, someone checking the numbers every few hours and telling the right people in plain words. This blueprint automates that last mile. It was built for the Grijalva and Usumacinta rivers in Tabasco, Mexico, a region that floods often, but it works for any river point on the map.

    The bulletin is written by a model running on your own Ollama server, so the LLM call has no hosted API charge, keeps working where cloud APIs are blocked or too expensive, and lets you swap models with a single input.

    ## How it works

    1. `check_rivers` (`io.kestra.plugin.core.flow.Loop`) iterates over the `stations` input with `concurrencyLimit: 1`.
    2. Inside the loop, `fetch_forecast` (`io.kestra.plugin.core.http.Request`) calls the [Open-Meteo Flood API](https://open-meteo.com/en/docs/flood-api) for today's modeled discharge and the 7-day maximum ensemble forecast. The loop's `outputs` use `jq` to extract today's value, the forecast peak and its date, and compute `at_risk`: the peak reaches `alert_m3s`, or it is at least `rise_alert_pct` percent above today.
    3. `write_bulletin` (`io.kestra.plugin.ai.completion.ChatCompletion` with the `io.kestra.plugin.ai.provider.Ollama` provider) turns the numbers into a short bulletin in the language you choose, using only the data it was given.
    4. `save_bulletin` (`io.kestra.plugin.core.storage.Write`) stores the bulletin and a data table as a markdown file in internal storage.
    5. `alert_if_needed` (`io.kestra.plugin.core.flow.If`) posts the bulletin to Slack with `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` only when at least one point is at risk; otherwise `all_clear` logs a one-line summary.
    6. The `errors` branch posts a separate Slack alert if the API or the model call fails.
    7. The `every_six_hours` Schedule trigger runs the flow at minute 0 of every sixth hour. It ships disabled, so you can test manually first.

    ## Prerequisites

    - A Kestra instance with the AI and Slack plugins available.
    - [Ollama](https://ollama.com/) reachable from Kestra at `ollama_endpoint`, with the chosen model pulled (`ollama pull gemma3:4b`).
    - Outbound HTTPS access to `flood-api.open-meteo.com`. No API key is needed for non-commercial use; commercial use requires an Open-Meteo API plan.
    - Secret:
      - `SLACK_WEBHOOK_URL`: Slack incoming webhook that receives at-risk bulletins and failure alerts (required for alerts; the all-clear path doesn't use it).

    ## Inputs

    | Input | Type | Default | Purpose |
    |---|---|---|---|
    | `stations` | JSON | Usumacinta and Grijalva (Tabasco, MX) | River points to watch: `name`, `latitude`, `longitude`, `alert_m3s` |
    | `rise_alert_pct` | INT | `50` | Non-negative. Also flag a point when the 7-day peak is at least this % above today's modeled discharge |
    | `bulletin_language` | SELECT | `English` | English, Spanish, Portuguese or French |
    | `model` | STRING | `gemma3:4b` | Ollama model that writes the bulletin |
    | `ollama_endpoint` | STRING | `http://localhost:11434` | Ollama base URL (`http://host.docker.internal:11434` when Kestra runs in Docker) |

    The default `alert_m3s` values are examples. Replace them with the alert levels your water authority publishes for each point. Open-Meteo snaps coordinates to its ~5 km river grid, so test a few nearby coordinates and keep the one whose discharge matches the main channel.

    ## Outputs

    - `{{ outputs.check_rivers.outputs }}`: one entry per point (each under `.outputs`, sort by `.item.iteration` for input order) with `name`, `today_m3s`, `peak_m3s`, `peak_date`, `alert_m3s` and `at_risk`.
    - `{{ outputs.write_bulletin.textOutput }}`: the bulletin text.
    - `{{ outputs.save_bulletin.uri }}`: the markdown bulletin with its data table, downloadable from the execution's Outputs tab.

    ## Quick start

    1. Pull a model: `ollama pull gemma3:4b`.
    2. Add the `SLACK_WEBHOOK_URL` secret.
    3. Create the flow from this blueprint and execute it. To try the alert path, lower an `alert_m3s` below the current discharge.
    4. Enable the `every_six_hours` trigger.

    ## How to extend

    - Send the bulletin to Telegram, Microsoft Teams or email instead of (or as well as) Slack.
    - Store each run's numbers in a database to build your own discharge history and tune alert levels.
    - Add a second point upstream of each town to get earlier warnings.

    ## Important

    This is a decision-support tool built on model forecasts, not an official warning system. Always follow your national water authority and civil protection alerts.

    ## Links

    - [Open-Meteo Flood API](https://open-meteo.com/en/docs/flood-api)
    - [Kestra AI plugin](https://kestra.io/plugins/plugin-ai)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-notifications/slack)
    - [Ollama](https://ollama.com/)
  tags:
    - AI
  subTags:
    - Monitoring & Alerting
    - Agents & Structured Output
  ee: false
  demo: false
