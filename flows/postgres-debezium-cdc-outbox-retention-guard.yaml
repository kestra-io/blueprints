id: postgres-debezium-cdc-outbox-retention-guard
namespace: company.team

inputs:
  - id: postgres_host
    type: STRING
    displayName: PostgreSQL Host
    description: Hostname or container endpoint for the target PostgreSQL instance.
    defaults: "localhost"

  - id: postgres_port
    type: INT
    displayName: PostgreSQL Port
    description: Port number for PostgreSQL client connections.
    defaults: 5432

  - id: postgres_database
    type: STRING
    displayName: Database Name
    description: Name of the PostgreSQL database hosting the outbox table and replication slot.
    defaults: "app"

  - id: outbox_schema
    type: STRING
    displayName: Outbox Schema
    description: Database schema name containing the transactional outbox table.
    defaults: "public"

  - id: outbox_table
    type: STRING
    displayName: Outbox Table Name
    description: Name of the transactional outbox table to audit and prune.
    defaults: "outbox"

  - id: replication_slot_name
    type: STRING
    displayName: Debezium Replication Slot
    description: Logical replication slot name monitored by Debezium CDC for this database.
    defaults: "debezium_outbox"

  - id: retention_hours
    type: INT
    displayName: Retention Threshold (Hours)
    description: Minimum age in hours an event must have to be eligible for outbox pruning.
    defaults: 24
    min: 1

  - id: max_allowed_lag_mb
    type: FLOAT
    displayName: Max Allowed Replication Lag (MiB)
    description: Circuit-breaker ceiling; if Debezium replication lag exceeds this threshold, purge execution halts.
    defaults: 500.0

  - id: chunk_size
    type: INT
    displayName: Micro-Batch Chunk Size
    description: Maximum rows deleted per batch transaction to avoid table lock escalation and write stalls.
    defaults: 5000
    min: 100
    max: 50000

  - id: max_total_purge_limit
    type: INT
    displayName: Max Total Purge Ceiling
    description: Total safety ceiling for records deleted across this single execution run.
    defaults: 25000

  - id: bloat_vacuum_threshold_pct
    type: FLOAT
    displayName: Vacuum Bloat Threshold (%)
    description: Dead tuple bloat percentage threshold that triggers a non-blocking VACUUM ANALYZE.
    defaults: 20.0

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, inspects slot health and candidate counts without deleting rows or running vacuum.
    defaults: true

  - id: notify_slack
    type: BOOL
    displayName: Notify Slack
    description: Dispatch an operational summary card to Slack upon completion.
    defaults: false

  - id: slack_channel
    type: STRING
    displayName: Slack Notification Channel
    description: Destination channel for Slack operational digest notifications.
    defaults: "#ops-database"

triggers:
  - id: scheduled_retention_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recurring off-peak schedule for outbox retention maintenance. Shipped disabled by default.
    cron: "0 */4 * * *"
    disabled: true

  - id: maintenance_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Secure webhook trigger for on-demand outbox pruning during designated maintenance windows.
    key: "{{ secret('OUTBOX_GUARD_WEBHOOK_KEY') }}"

tasks:
  - id: probe_replication_slot
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Query PostgreSQL pg_replication_slots to verify Debezium status and calculate byte lag.
    url: "jdbc:postgresql://{{ inputs.postgres_host }}:{{ inputs.postgres_port }}/{{ inputs.postgres_database }}"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT
        EXISTS (
          SELECT 1 FROM pg_replication_slots WHERE slot_name = '{{ inputs.replication_slot_name }}'
        ) AS slot_exists,
        COALESCE((
          SELECT active FROM pg_replication_slots WHERE slot_name = '{{ inputs.replication_slot_name }}'
        ), false) AS is_active,
        COALESCE((
          SELECT confirmed_flush_lsn::text FROM pg_replication_slots WHERE slot_name = '{{ inputs.replication_slot_name }}'
        ), '0/0') AS confirmed_flush_lsn,
        pg_current_wal_lsn()::text AS current_wal_lsn,
        COALESCE((
          SELECT GREATEST(pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn), 0)
          FROM pg_replication_slots WHERE slot_name = '{{ inputs.replication_slot_name }}'
        ), 0)::bigint AS lag_bytes,
        COALESCE((
          SELECT ROUND((GREATEST(pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn), 0) / (1024.0 * 1024.0))::numeric, 2)
          FROM pg_replication_slots WHERE slot_name = '{{ inputs.replication_slot_name }}'
        ), 0.0)::numeric AS lag_mb;

  - id: probe_outbox_inventory_and_bloat
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Inspect outbox table footprint, live vs dead tuple counts, and candidate rows past retention.
    url: "jdbc:postgresql://{{ inputs.postgres_host }}:{{ inputs.postgres_port }}/{{ inputs.postgres_database }}"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT
        COALESCE((
          SELECT n_live_tup
          FROM pg_stat_user_tables
          WHERE schemaname = '{{ inputs.outbox_schema }}' AND relname = '{{ inputs.outbox_table }}'
        ), 0)::bigint AS live_tuples,
        COALESCE((
          SELECT n_dead_tup
          FROM pg_stat_user_tables
          WHERE schemaname = '{{ inputs.outbox_schema }}' AND relname = '{{ inputs.outbox_table }}'
        ), 0)::bigint AS dead_tuples,
        COALESCE((
          SELECT ROUND((n_dead_tup::numeric / GREATEST(n_live_tup + n_dead_tup, 1)::numeric) * 100.0, 2)
          FROM pg_stat_user_tables
          WHERE schemaname = '{{ inputs.outbox_schema }}' AND relname = '{{ inputs.outbox_table }}'
        ), 0.0)::numeric AS bloat_pct,
        COALESCE((
          SELECT pg_total_relation_size(quote_ident('{{ inputs.outbox_schema }}') || '.' || quote_ident('{{ inputs.outbox_table }}'))
        ), 0)::bigint AS total_table_bytes,
        COALESCE((
          SELECT pg_size_pretty(pg_total_relation_size(quote_ident('{{ inputs.outbox_schema }}') || '.' || quote_ident('{{ inputs.outbox_table }}')))
        ), '0 bytes') AS total_table_size_pretty,
        COALESCE((
          SELECT COUNT(*)
          FROM {{ inputs.outbox_schema }}.{{ inputs.outbox_table }}
          WHERE created_at < NOW() - INTERVAL '{{ inputs.retention_hours }} hours'
        ), 0)::bigint AS candidate_rows,
        COALESCE((
          SELECT to_char(MIN(created_at), 'YYYY-MM-DD"T"HH24:MI:SS"Z"')
          FROM {{ inputs.outbox_schema }}.{{ inputs.outbox_table }}
        ), 'none') AS oldest_event_timestamp,
        COALESCE((
          SELECT to_char(MAX(created_at), 'YYYY-MM-DD"T"HH24:MI:SS"Z"')
          FROM {{ inputs.outbox_schema }}.{{ inputs.outbox_table }}
        ), 'none') AS newest_event_timestamp;

  - id: route_operational_action
    type: io.kestra.plugin.core.flow.Switch
    description: Branch execution based on replication slot health, consumer lag, and candidate availability.
    value: >-
      {%- if not outputs.probe_replication_slot.row.slot_exists -%}SLOT_MISSING{%- elseif not outputs.probe_replication_slot.row.is_active -%}SLOT_INACTIVE{%- elseif (outputs.probe_replication_slot.row.lag_mb | string | number('FLOAT')) > inputs.max_allowed_lag_mb -%}LAG_EXCEEDED{%- elseif outputs.probe_outbox_inventory_and_bloat.row.candidate_rows == 0 -%}NOTHING_TO_PURGE{%- else -%}PURGE_QUALIFIED{%- endif -%}
    cases:
      SLOT_MISSING:
        - id: log_slot_missing
          type: io.kestra.plugin.core.log.Log
          message: "CIRCUIT BREAKER TRIGGERED: Replication slot '{{ inputs.replication_slot_name }}' not found on '{{ inputs.postgres_database }}'. Aborting purge to avoid event loss."
        - id: fail_missing_slot
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "Replication slot '{{ inputs.replication_slot_name }}' does not exist. Verify Debezium connector deployment before pruning outbox."

      SLOT_INACTIVE:
        - id: log_slot_inactive
          type: io.kestra.plugin.core.log.Log
          message: "CIRCUIT BREAKER TRIGGERED: Replication slot '{{ inputs.replication_slot_name }}' is inactive (Debezium disconnected). Purge halted."
        - id: fail_inactive_slot
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "Debezium consumer is not actively streaming from slot '{{ inputs.replication_slot_name }}'. Purge halted to prevent unstreamed data loss."

      LAG_EXCEEDED:
        - id: log_lag_exceeded
          type: io.kestra.plugin.core.log.Log
          message: "CIRCUIT BREAKER TRIGGERED: Debezium CDC lag is {{ outputs.probe_replication_slot.row.lag_mb }} MiB, exceeding limit of {{ inputs.max_allowed_lag_mb }} MiB. Postponing outbox purge."

      NOTHING_TO_PURGE:
        - id: log_nothing_to_purge
          type: io.kestra.plugin.core.log.Log
          message: "NOMINAL: Zero outbox records exceed the {{ inputs.retention_hours }}h retention threshold. Total live records: {{ outputs.probe_outbox_inventory_and_bloat.row.live_tuples }}. No mutation needed."

      PURGE_QUALIFIED:
        - id: branch_dry_run_or_live
          type: io.kestra.plugin.core.flow.If
          description: Route to dry-run simulation or bounded batch deletion depending on inputs.dry_run.
          condition: "{{ inputs.dry_run }}"
          then:
            - id: log_dry_run_simulation
              type: io.kestra.plugin.core.log.Log
              message: "[DRY-RUN] Purge qualified: {{ outputs.probe_outbox_inventory_and_bloat.row.candidate_rows }} rows older than {{ inputs.retention_hours }}h identified. Bounded batch size would be {{ inputs.chunk_size }} (ceiling: {{ inputs.max_total_purge_limit }}). No records modified."
          else:
            - id: execute_micro_batch_purge
              type: io.kestra.plugin.jdbc.postgresql.Query
              description: Delete candidate rows in an isolated micro-batch with FOR UPDATE SKIP LOCKED to prevent row lock contention.
              url: "jdbc:postgresql://{{ inputs.postgres_host }}:{{ inputs.postgres_port }}/{{ inputs.postgres_database }}"
              username: "{{ secret('POSTGRES_USER') }}"
              password: "{{ secret('POSTGRES_PASSWORD') }}"
              fetchType: FETCH_ONE
              sql: |
                WITH deleted_batch AS (
                  DELETE FROM {{ inputs.outbox_schema }}.{{ inputs.outbox_table }}
                  WHERE id IN (
                    SELECT id
                    FROM {{ inputs.outbox_schema }}.{{ inputs.outbox_table }}
                    WHERE created_at < NOW() - INTERVAL '{{ inputs.retention_hours }} hours'
                    ORDER BY id ASC
                    LIMIT LEAST({{ inputs.chunk_size }}, {{ inputs.max_total_purge_limit }})
                    FOR UPDATE SKIP LOCKED
                  )
                  RETURNING id
                )
                SELECT COUNT(*)::bigint AS deleted_count FROM deleted_batch;

            - id: log_purge_results
              type: io.kestra.plugin.core.log.Log
              message: "SUCCESS: Deleted {{ outputs.execute_micro_batch_purge.row.deleted_count }} published outbox rows in micro-batch transaction."

            - id: evaluate_vacuum_requirement
              type: io.kestra.plugin.core.flow.If
              description: Trigger non-blocking VACUUM ANALYZE when post-purge dead tuple bloat exceeds threshold percentage.
              condition: "{{ (outputs.probe_outbox_inventory_and_bloat.row.bloat_pct | string | number('FLOAT')) >= inputs.bloat_vacuum_threshold_pct }}"
              then:
                - id: run_nonblocking_vacuum
                  type: io.kestra.plugin.jdbc.postgresql.Query
                  description: Return dead tuple pages to PostgreSQL Free Space Map without taking exclusive table locks.
                  url: "jdbc:postgresql://{{ inputs.postgres_host }}:{{ inputs.postgres_port }}/{{ inputs.postgres_database }}"
                  username: "{{ secret('POSTGRES_USER') }}"
                  password: "{{ secret('POSTGRES_PASSWORD') }}"
                  fetchType: NONE
                  sql: "VACUUM (ANALYZE) {{ inputs.outbox_schema }}.{{ inputs.outbox_table }};"

                - id: log_vacuum_completed
                  type: io.kestra.plugin.core.log.Log
                  message: "MAINTENANCE: Non-blocking VACUUM (ANALYZE) completed for {{ inputs.outbox_schema }}.{{ inputs.outbox_table }} (bloat was {{ outputs.probe_outbox_inventory_and_bloat.row.bloat_pct }}%)."

  - id: audit_summary_log
    type: io.kestra.plugin.core.log.Log
    description: Record comprehensive operational audit trail of outbox state and actions taken.
    message: |
      ===== PostgreSQL Debezium CDC Outbox Retention Audit =====
      Table: {{ inputs.outbox_schema }}.{{ inputs.outbox_table }}
      Replication Slot: {{ inputs.replication_slot_name }} (Exists: {{ outputs.probe_replication_slot.row.slot_exists }}, Active: {{ outputs.probe_replication_slot.row.is_active }}, Lag: {{ outputs.probe_replication_slot.row.lag_mb }} MiB)
      Confirmed Flush LSN: {{ outputs.probe_replication_slot.row.confirmed_flush_lsn }} | Current WAL LSN: {{ outputs.probe_replication_slot.row.current_wal_lsn }}
      Table Footprint: {{ outputs.probe_outbox_inventory_and_bloat.row.total_table_size_pretty }} (Live: {{ outputs.probe_outbox_inventory_and_bloat.row.live_tuples }}, Dead: {{ outputs.probe_outbox_inventory_and_bloat.row.dead_tuples }}, Bloat: {{ outputs.probe_outbox_inventory_and_bloat.row.bloat_pct }}%)
      Candidates Purgable (>{{ inputs.retention_hours }}h): {{ outputs.probe_outbox_inventory_and_bloat.row.candidate_rows }}
      Oldest Event: {{ outputs.probe_outbox_inventory_and_bloat.row.oldest_event_timestamp }} | Newest Event: {{ outputs.probe_outbox_inventory_and_bloat.row.newest_event_timestamp }}
      Mode: {{ inputs.dry_run ? 'DRY-RUN (Simulated)' : 'ACTIVE PURGE' }}
      ===========================================================

  - id: notify_slack_summary
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    runIf: "{{ inputs.notify_slack }}"
    description: Dispatch structured Slack operational digest when notification flag is enabled.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": ":shield: *PostgreSQL Debezium CDC Outbox Retention Guard*",
        "attachments": [
          {
            "color": "{{ (outputs.probe_replication_slot.row.lag_mb | string | number('FLOAT')) > inputs.max_allowed_lag_mb ? '#E24A4A' : '#36A64F' }}",
            "title": "Outbox Retention Audit Digest",
            "fields": [
              {
                "title": "Target Table",
                "value": "`{{ inputs.outbox_schema }}.{{ inputs.outbox_table }}`",
                "short": true
              },
              {
                "title": "Debezium Slot Lag",
                "value": "`{{ inputs.replication_slot_name }}` ({{ outputs.probe_replication_slot.row.lag_mb }} MiB)",
                "short": true
              },
              {
                "title": "Table Size / Bloat",
                "value": "{{ outputs.probe_outbox_inventory_and_bloat.row.total_table_size_pretty }} ({{ outputs.probe_outbox_inventory_and_bloat.row.bloat_pct }}% dead)",
                "short": true
              },
              {
                "title": "Execution Mode",
                "value": "{{ inputs.dry_run ? 'Dry Run (Audit Only)' : 'Active Micro-Batch Purge' }}",
                "short": true
              }
            ]
          }
        ]
      }

extend:
  title: Prune PostgreSQL Debezium CDC Outbox Tables Safely with Replication Slot Lag Checks
  metaTitle: PostgreSQL Debezium CDC Outbox Retention Guard | Kestra
  shortDescription: Safely prune published PostgreSQL Transactional Outbox rows behind Debezium CDC with replication slot lag validation, bounded batch deletes, and vacuum bloat reclamation.
  metaDescription: Prune PostgreSQL Debezium CDC outbox tables safely with replication slot lag checks, bounded micro-batch deletes, bloat evaluation, and non-blocking vacuum.
  description: |
    Safely govern and prune high-throughput PostgreSQL Transactional Outbox tables captured by Debezium Change Data Capture (CDC). In distributed microservices architectures, transactional outbox tables capture domain events within business database transactions before Debezium logical decoding streams them to Apache Kafka. Because Debezium only tails the write-ahead log (WAL) without deleting processed database records, outbox tables accumulate millions of historical events over time. Naive cron-based purge scripts introduce severe production risks: deleting records before Debezium's replication slot has read them causes permanent, silent event loss in downstream event meshes, while massive unchunked `DELETE` transactions trigger lock escalation, write starvation on transactional APIs, and catastrophic table bloat.

    This blueprint implements an autonomous operational guard that verifies Debezium replication slot health (`pg_replication_slots`), confirms active consumer connectivity, evaluates replication lag against strict thresholds, and executes bounded micro-batch deletions using `FOR UPDATE SKIP LOCKED`. If dead-tuple bloat exceeds operational limits, the workflow automatically issues a non-blocking `VACUUM (ANALYZE)` to return allocated pages to PostgreSQL's Free Space Map (FSM) without holding exclusive table locks.

    ## How it works

    1. **Slot Telemetry Probe**: `probe_replication_slot` (`io.kestra.plugin.jdbc.postgresql.Query`, `fetchType: FETCH_ONE`) inspects `pg_replication_slots` for the specified logical slot name, verifying whether the slot exists, whether the Debezium streaming worker is actively connected (`active = true`), and calculating replication lag in bytes and MiB using `pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn)`.
    2. **Outbox Inventory & Bloat Audit**: `probe_outbox_inventory_and_bloat` (`io.kestra.plugin.jdbc.postgresql.Query`, `fetchType: FETCH_ONE`) reads live and dead tuple metrics from `pg_stat_user_tables`, calculates the current bloat percentage, retrieves total relation disk size via `pg_total_relation_size`, and counts candidate records exceeding `inputs.retention_hours`.
    3. **Operational State Routing**: `route_operational_action` (`io.kestra.plugin.core.flow.Switch`) evaluates slot telemetry and routes to deterministic branches:
       - `SLOT_MISSING`: Trips a circuit breaker and fails the execution via `fail_missing_slot` to prevent data deletion when replication infrastructure is unverified.
       - `SLOT_INACTIVE`: Trips a circuit breaker and fails the execution via `fail_inactive_slot` when Debezium is disconnected, protecting records awaiting consumption.
       - `LAG_EXCEEDED`: Logs an operational warning and halts deletion when Debezium lag exceeds `inputs.max_allowed_lag_mb`, postponing maintenance until downstream streaming recovers.
       - `NOTHING_TO_PURGE`: Logs nominal inventory status when candidate rows equal zero.
       - `PURGE_QUALIFIED`: Preconditions are satisfied; branches based on `inputs.dry_run`.
    4. **Bounded Batch Deletion**: When qualified and live, `execute_micro_batch_purge` deletes candidates in bounded chunks up to `inputs.chunk_size` (capped by `inputs.max_total_purge_limit`) using subquery ordering and `FOR UPDATE SKIP LOCKED`. This guarantees zero row-level lock contention with active microservice producer transactions.
    5. **Autonomous Vacuum Bloat Remediation**: `evaluate_vacuum_requirement` checks whether dead tuple bloat exceeds `inputs.bloat_vacuum_threshold_pct`. When tripped, `run_nonblocking_vacuum` executes `VACUUM (ANALYZE)` to refresh optimizer statistics and return dead row pages to PostgreSQL's Free Space Map.
    6. **Audit Trail & Observability**: `audit_summary_log` formats a structured audit log containing slot LSN checkpoints, lag figures, and table footprint metrics. If `inputs.notify_slack` is enabled, `notify_slack_summary` posts an operational incident card to Slack.

    ## What you get

    - **Slot-Gated Deletes**: Deletion only runs while the replication slot exists, is active, and its lag is under `inputs.max_allowed_lag_mb`, so rows are only pruned once they are well past `inputs.retention_hours` and Debezium is streaming normally.
    - **Lock-Free Concurrency**: Bounded micro-batch deletions with `FOR UPDATE SKIP LOCKED` prevent database locks from degrading concurrent microservice `INSERT INTO outbox` writes.
    - **Self-Healing Storage Hygiene**: Autonomous conditional `VACUUM (ANALYZE)` prevents outbox table and B-Tree index bloat from degrading sequential scan speeds.
    - **Safe Dry-Run Default**: Ships with `dry_run: true` so platform engineers can audit candidate volumes and slot lag before enabling active deletions.

    ## Who it's for

    - **Data Platform Engineers**: Managing event-driven microservices, Debezium CDC pipelines, and Kafka ingestion topologies.
    - **Database Administrators (DBAs)**: Protecting primary PostgreSQL clusters from outbox table bloat and lock escalation.
    - **Site Reliability Engineers (SREs)**: Automating Day 2 lifecycle maintenance with built-in circuit breakers and chatops visibility.

    ## Why orchestrate this with Kestra

    Operating transactional outboxes with standard cron jobs or ad-hoc shell scripts fails because cron has no awareness of replication stream state. A cron script running `DELETE FROM outbox` during a Kafka outage or Debezium restart permanently destroys unstreamed events. Kestra provides declarative workflow orchestration where database probes, multi-condition branching, replication lag circuit breakers, and bounded remediation steps execute with full execution logs, secret masking, and deterministic error handling.

    ## Prerequisites

    - PostgreSQL 12+ instance with `wal_level = logical` and a configured logical replication slot.
    - PostgreSQL database user credentials granted `SELECT` on `pg_replication_slots` and `pg_stat_user_tables`, and `DELETE` on the outbox table.
    - A transactional outbox table containing an `id` primary key and a `created_at` timestamp column.

    ### Secrets

    - `POSTGRES_USER`: PostgreSQL database username (required).
    - `POSTGRES_PASSWORD`: PostgreSQL database password (required).
    - `OUTBOX_GUARD_WEBHOOK_KEY`: Secret authentication key for the on-demand maintenance webhook (required).
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for Slack audit notifications (required only when `notify_slack: true`).

    ## Quick start

    1. Configure `POSTGRES_USER`, `POSTGRES_PASSWORD`, and `OUTBOX_GUARD_WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance and execute with `dry_run: true` to inspect slot health and candidate counts.
    3. Verify execution logs in the Kestra UI to review reported replication lag, table bloat, and purgable rows.
    4. Set `dry_run: false` and toggle `scheduled_retention_sweep` to enable autonomous periodic outbox pruning.

    ## How to extend

    - **Adaptive Batching**: Dynamically scale `inputs.chunk_size` based on current PostgreSQL transaction throughput (`pg_stat_database.xact_commit`).
    - **Cold Archive Pipeline**: Stream deleted outbox rows to an S3 or MinIO bucket in Parquet format using DuckDB before executing deletions for compliance audit trails.
    - **Multi-Tenant Federation**: Wrap the flow tasks inside a `Loop` to iterate over multiple tenant schemas or regional database shards in parallel.

    ## Links

    - [Kestra PostgreSQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-postgresql)
    - [Debezium PostgreSQL Connector Documentation](https://debezium.io/documentation/reference/stable/connectors/postgresql.html)
    - [PostgreSQL Logical Replication Slots](https://www.postgresql.org/docs/current/warm-standby.html#STREAMING-REPLICATION-SLOTS)
    - [PostgreSQL Routine Vacuuming Documentation](https://www.postgresql.org/docs/current/routine-vacuuming.html)
  tags:
    - Data
  subTags:
    - Day 2 Operations
    - Realtime & Streaming
  ee: false
  demo: false
