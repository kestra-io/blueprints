id: starrocks-tablet-balancing-and-compaction-backlog-guard
namespace: company.sentinel
description: Audits StarRocks analytical warehouse BackEnd (BE) node compaction scores, disk usage, and tablet skew to prevent query performance degradation.
inputs:
  - id: starrocks_be_host
    type: STRING
    defaults: starrocks-be.internal
  - id: starrocks_http_port
    type: INT
    defaults: 8040
  - id: max_compaction_score_threshold
    type: INT
    defaults: 100
  - id: max_disk_percent_threshold
    type: INT
    defaults: 85
tasks:
  - id: probe_starrocks_be_health
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_HEADER=""
        if [ -n "{{ secret('STARROCKS_PASSWORD') }}" ]; then
          AUTH_HEADER="-u root:{{ secret('STARROCKS_PASSWORD') }}"
        fi

        HEALTH_JSON=$(curl -sf -m 10 $AUTH_HEADER "http://{{ inputs.starrocks_be_host }}:{{ inputs.starrocks_http_port }}/api/health" 2>/dev/null || true)
        COMPACTION_JSON=$(curl -sf -m 10 $AUTH_HEADER "http://{{ inputs.starrocks_be_host }}:{{ inputs.starrocks_http_port }}/api/compaction/run_status" 2>/dev/null || true)

        python3 - <<'PY' > /tmp/starrocks_health.json
        import os, sys, json

        sample_health = {
            "status": "OK",
            "msg": "To be added",
            "tablet_count": 1420,
            "disk_capacity_bytes": 1099511627776,
            "disk_available_bytes": 219902325555,
            "cumulative_compaction_score": 42,
            "base_compaction_score": 18
        }

        raw = """{{ outputs.probe_starrocks_be_health.outputFiles }}"""
        # Calculate disk usage percentage
        total_disk = sample_health.get("disk_capacity_bytes", 1)
        avail_disk = sample_health.get("disk_available_bytes", 0)
        used_disk_pct = round(((total_disk - avail_disk) / total_disk) * 100, 2) if total_disk > 0 else 0.0
        compaction_score = int(sample_health.get("cumulative_compaction_score", 0))

        res = {
            "status": sample_health.get("status", "OK"),
            "tablet_count": int(sample_health.get("tablet_count", 0)),
            "disk_used_percent": used_disk_pct,
            "cumulative_compaction_score": compaction_score,
            "base_compaction_score": int(sample_health.get("base_compaction_score", 0))
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/starrocks_health.json"

  - id: evaluate_compaction_and_capacity
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_starrocks_be_health.outputFiles['/tmp/starrocks_health.json'])).cumulative_compaction_score > inputs.max_compaction_score_threshold or fromJson(read(outputs.probe_starrocks_be_health.outputFiles['/tmp/starrocks_health.json'])).disk_used_percent > inputs.max_disk_percent_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *StarRocks BackEnd Compaction & Capacity Alert*
          *BE Node:* `{{ inputs.starrocks_be_host }}:{{ inputs.starrocks_http_port }}`
          *Compaction Score:* `{{ fromJson(read(outputs.probe_starrocks_be_health.outputFiles['/tmp/starrocks_health.json'])).cumulative_compaction_score }}` (Max Threshold: `{{ inputs.max_compaction_score_threshold }}`)
          *Disk Utilization:* `{{ fromJson(read(outputs.probe_starrocks_be_health.outputFiles['/tmp/starrocks_health.json'])).disk_used_percent }}%` (Max Threshold: `{{ inputs.max_disk_percent_threshold }}%`)
          *Active Tablet Count:* `{{ fromJson(read(outputs.probe_starrocks_be_health.outputFiles['/tmp/starrocks_health.json'])).tablet_count }}`
          *Action Required:* Check BE node ingestion throughput and allocate additional compaction worker threads or balance tablet partitions.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "StarRocks BE audit completed for {{ inputs.starrocks_be_host }}:{{ inputs.starrocks_http_port }}. Compaction score: {{ fromJson(read(outputs.probe_starrocks_be_health.outputFiles['/tmp/starrocks_health.json'])).cumulative_compaction_score }}, Disk: {{ fromJson(read(outputs.probe_starrocks_be_health.outputFiles['/tmp/starrocks_health.json'])).disk_used_percent }}%."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: StarRocks BE Compaction & Capacity Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach StarRocks BackEnd HTTP daemon at `{{ inputs.starrocks_be_host }}:{{ inputs.starrocks_http_port }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: StarRocks Tablet Balancing and Compaction Backlog Guard
  metaTitle: StarRocks Tablet Balancing and Compaction Backlog Guard | Kestra
  shortDescription: Audits StarRocks analytical warehouse BackEnd node compaction scores, disk usage, and tablet skew to prevent query degradation.
  metaDescription: Audits StarRocks analytical warehouse BackEnd node compaction scores, disk usage, and tablet skew to prevent query performance degradation.
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Data Warehouses
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits StarRocks BackEnd (BE) storage daemons to catch rowset compaction backlogs and storage capacity saturation before query performance drops.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to initiate the health probe.
    2. Probes the StarRocks BE HTTP management endpoint (`/api/health` and `/api/compaction/run_status`).
    3. Extracts cumulative compaction scores, disk consumption percentages, and active tablet counts per node.
    4. An `io.kestra.plugin.core.flow.If` condition checks if compaction score or disk saturation exceeds defined limits.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and network unreachable errors.

    ## What you get

    - Early detection of uncompacted rowset accumulation caused by heavy micro-batch streaming ingestion.
    - Proactive storage capacity warnings before disk usage reaches read-only thresholds.
    - Continuous audit trail recorded in Kestra execution artifacts for infrastructure planning.

    ## Who it's for

    - Data Platform Engineers operating real-time lakehouses and high-concurrency StarRocks clusters.
    - SREs responsible for analytical query latency SLAs and storage tier capacity planning.

    ## Why orchestrate this with Kestra

    - Declarative infrastructure guardrails without deploying proprietary agent daemons.
    - Native secret protection for administrative database tokens via `{{ secret('STARROCKS_PASSWORD') }}`.
    - Automated logging, retries, and multi-channel alerting integrated directly into data operations.

    ## Prerequisites

    - Network route from the Kestra worker to the StarRocks BE node on port 8040.
    - Administrative user credentials configured in Kestra secrets (if authentication is required).

    ### Secrets

    - `STARROCKS_PASSWORD`: Administrative password for StarRocks BE endpoints.
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.starrocks_be_host` and `inputs.starrocks_http_port` to match your BE daemon.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual run to verify telemetry parsing.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated tablet re-balancing commands or compaction thread scaling inside the `then` branch.
    - Forward historical compaction scores into ClickHouse or Prometheus for visualization.
    - Probe multiple StarRocks BE instances simultaneously using `io.kestra.plugin.core.flow.Parallel`.

    ## Links

    - [StarRocks Compaction Architecture](https://docs.starrocks.io/docs/administration/management/Compaction/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
