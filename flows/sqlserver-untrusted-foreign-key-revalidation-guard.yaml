id: sqlserver-untrusted-foreign-key-revalidation-guard
namespace: company.team

description: |
  Find enabled but untrusted foreign keys on a SQL Server database from
  sys.foreign_keys, alert Slack, then revalidate each one with
  ALTER TABLE ... WITH CHECK CHECK CONSTRAINT behind a safe-by-default gate and
  re-read sys.foreign_keys to confirm none are still untrusted. An untrusted
  foreign key is still enforced on new writes, but the optimizer cannot rely on
  it, so it skips join elimination and existing orphan rows can hide.

inputs:
  - id: url
    type: STRING
    displayName: JDBC URL
    description: Points at the database to check. The query reads sys.foreign_keys in the connected database.
    defaults: "jdbc:sqlserver://localhost:1433;databaseName=app;encrypt=false"

  - id: user
    type: STRING
    displayName: SQL Server login
    defaults: sa

  - id: password
    type: STRING
    displayName: SQL Server password
    description: Defaults to the SQLSERVER_PASSWORD secret. Override only for local testing.
    defaults: "{{ secret('SQLSERVER_PASSWORD') }}"

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Allow the ALTER TABLE ... WITH CHECK CHECK CONSTRAINT statements to run.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for any revalidation to run.
    defaults: true

variables:
  audit_sql: |
    SELECT
      s.name AS schema_name,
      t.name AS table_name,
      fk.name AS fk_name,
      rs.name AS ref_schema_name,
      rt.name AS ref_table_name,
      'ALTER TABLE ' + QUOTENAME(s.name) + '.' + QUOTENAME(t.name)
        + ' WITH CHECK CHECK CONSTRAINT ' + QUOTENAME(fk.name) AS fix_sql
    FROM sys.foreign_keys fk
    JOIN sys.tables t ON t.object_id = fk.parent_object_id
    JOIN sys.schemas s ON s.schema_id = t.schema_id
    JOIN sys.tables rt ON rt.object_id = fk.referenced_object_id
    JOIN sys.schemas rs ON rs.schema_id = rt.schema_id
    WHERE fk.is_not_trusted = 1
      AND fk.is_disabled = 0
    ORDER BY s.name, t.name, fk.name

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.sqlserver.Query
    description: Read-only. Lists every enabled but untrusted foreign key in the connected database and builds the revalidation statement for each with QUOTENAME.
    url: "{{ inputs.url }}"
    username: "{{ inputs.user }}"
    password: "{{ inputs.password }}"
    trustServerCertificate: true
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: fixes
    type: io.kestra.plugin.core.output.OutputValues
    description: The ALTER TABLE statement per untrusted foreign key, built in SQL with QUOTENAME so identifiers are quoted by the server.
    values:
      sql: "{{ outputs.audit.rows | jq('map(.fix_sql)') | first | toJson }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      SQL Server untrusted foreign key audit on {{ inputs.url }}: {{ outputs.audit.size }} enabled but untrusted foreign key(s).
      {{ outputs.audit.rows | jq('map("\(.schema_name).\(.table_name).\(.fk_name) -> \(.ref_schema_name).\(.ref_table_name)") | join("; ")') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'SQL Server ' ~ inputs.url ~ ': ' ~ outputs.audit.size ~ ' enabled but untrusted foreign key(s): ' ~ (outputs.audit.rows | jq('map("\(.schema_name).\(.table_name).\(.fk_name)") | join("; ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Revalidating now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            description: Serial on purpose. Each statement runs as its own autocommitting Query, never a Queries task with transaction true. concurrencyLimit 1 keeps the statements one at a time. A statement whose existing rows violate the foreign key errors here, which is the correct hard fail routed to Slack.
            concurrencyLimit: 1
            values: "{{ outputs.fixes.values.sql }}"
            tasks:
              - id: apply
                type: io.kestra.plugin.jdbc.sqlserver.Query
                description: One ALTER TABLE ... WITH CHECK CHECK CONSTRAINT. Rechecks every existing row and marks the constraint trusted when they all pass.
                url: "{{ inputs.url }}"
                username: "{{ inputs.user }}"
                password: "{{ inputs.password }}"
                trustServerCertificate: true
                fetchType: NONE
                sql: "{{ item.value }}"

          - id: reaudit
            type: io.kestra.plugin.jdbc.sqlserver.Query
            description: Re-read sys.foreign_keys after the revalidation to confirm no enabled foreign key is still untrusted.
            url: "{{ inputs.url }}"
            username: "{{ inputs.user }}"
            password: "{{ inputs.password }}"
            trustServerCertificate: true
            fetchType: FETCH
            sql: "{{ render(vars.audit_sql) }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.reaudit.size > 0 }}"
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "Still untrusted after revalidation: {{ outputs.reaudit.rows | jq('map(\"\\(.schema_name).\\(.table_name).\\(.fk_name)\") | join(\", \")') | first }}. The login needs ALTER on the parent table. Existing rows may also violate the constraint and must be fixed first."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: "Revalidated and verified trusted: {{ fromJson(outputs.fixes.values.sql) | join('; ') }}. Every enabled foreign key is now trusted."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No enabled foreign key on {{ inputs.url }} is untrusted. The optimizer can rely on every one of them."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'SQL Server untrusted foreign key guard failed on ' ~ inputs.url ~ ' (execution ' ~ execution.id ~ '). A revalidation hit a row that violates the constraint. The audit may also have failed. Check the logs.'} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Always runs in safe mode (audit only).
    cron: "0 3 * * 0"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: SQL Server Untrusted Foreign Key Revalidation Guard
  shortDescription: Find enabled but untrusted SQL Server foreign keys in sys.foreign_keys, alert Slack, then revalidate each with WITH CHECK CHECK CONSTRAINT behind a safe-by-default gate and re-read the catalog to confirm.
  metaTitle: SQL Server Untrusted Foreign Key Revalidation Guard with Kestra
  metaDescription: Detect enabled but untrusted SQL Server foreign keys, alert Slack, then revalidate each with WITH CHECK CHECK CONSTRAINT and re-read the catalog to confirm.
  description: |
    A SQL Server foreign key can be enabled yet untrusted. It happens after a bulk load that bypassed the constraint, after a key was added WITH NOCHECK or after a disabled key was re-enabled without a recheck. The constraint still blocks bad new writes, but SQL Server flags it `is_not_trusted = 1`. Once a key is untrusted the optimizer stops trusting it. It skips join elimination and other trusted-constraint shortcuts, so queries read more than they need. Any orphan rows that slipped in before the key was trusted stay hidden.

    This blueprint reads `sys.foreign_keys` for the connected database, flags every foreign key that is enabled (`is_disabled = 0`) but untrusted (`is_not_trusted = 1`) and alerts Slack. When you allow it, it revalidates each one with `ALTER TABLE ... WITH CHECK CHECK CONSTRAINT`, one statement at a time, then reads the catalog again and fails the run if any enabled foreign key is still untrusted.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Read-only by default. `dry_run` is `true` and `auto_remediate` is `false`, so a normal run only reads the catalog and alerts.
    - A write happens only when `auto_remediate` is `true` and `dry_run` is `false`.
    - `WITH CHECK CHECK CONSTRAINT` is `WITH CHECK` plus `CHECK CONSTRAINT`. It rechecks every existing row against the key before marking it trusted. If a row violates the key the statement errors, which is the correct result: the data has an integrity gap that revalidation must not paper over. That error routes to the `errors` block.
    - Each revalidation runs as its own autocommitting `io.kestra.plugin.jdbc.sqlserver.Query`, never a `Queries` task with `transaction: true`.
    - The remediation loop has `concurrencyLimit: 1`, so the statements never run in parallel.

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.sqlserver.Query`, read-only) reads `sys.foreign_keys` joined to `sys.tables` and `sys.schemas` for both the parent and the referenced table. It keeps every key where `is_not_trusted = 1` and `is_disabled = 0`, then builds the `ALTER TABLE ... WITH CHECK CHECK CONSTRAINT` statement for each one with `QUOTENAME`.
    2. `fixes` (`io.kestra.plugin.core.output.OutputValues`) collects the per-key revalidation statements. `summary` (`io.kestra.plugin.core.log.Log`) logs the findings with the referenced table for each key.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs that every enabled foreign key is trusted.
       - **findings:** `alert` posts the flagged keys to Slack.
         - `remediate_gate` runs only when `auto_remediate` is `true` and `dry_run` is `false`.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs each revalidation in turn.
         - `reaudit` re-reads the catalog. `verify_result` fails the run if any enabled foreign key is still untrusted.
    4. `errors` posts a Slack alert when a revalidation hits a violating row or the audit cannot run.

    ## What you get

    - Every enabled foreign key the optimizer has stopped trusting, with the parent and referenced table for each.
    - A revalidation that rechecks the existing rows and marks the key trusted again, so join elimination and the other trusted-constraint plans come back.
    - A re-read of the catalog after the change that fails the run if a key is still untrusted, so a revalidation that did not land is never reported as success.
    - A hard failure and a Slack alert when existing rows violate a key, which surfaces the orphan data the untrusted key was hiding.
    - A Slack alert on findings and a separate alert if the audit cannot run.

    ## Who it's for

    - DBAs who ran a bulk load or added a key WITH NOCHECK and want the trust flag put back without hand-writing the statements.
    - Platform teams who see query plans ignore a foreign key and want to know which keys are untrusted.
    - Teams evaluating the SQL Server plugin who want an example that reads the catalog and drives `ALTER TABLE`.

    ## Why orchestrate this with Kestra

    Finding untrusted keys is a one-line catalog query, but acting on it safely is not. You want to see the list first, revalidate only when you choose, one key at a time, then confirm the flag actually cleared. You want the run to stop and shout if a key turns out to be hiding orphan rows. Kestra reads the catalog, gates the change behind two inputs, runs each `ALTER TABLE` on its own, re-reads the catalog and fails loudly if anything is still untrusted. The Slack alert says what was found and whether anything changed. The run history keeps every before and after.

    ## Tested end to end

    On Kestra 2.0.5 against SQL Server 2022 on Linux, with a local HTTP sink standing in for Slack. A foreign key was added WITH NOCHECK so it was enabled but untrusted. A second key was given a row that violates it to exercise the failure path.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults, one untrusted key with clean rows | 1 key flagged, Slack alert "No change applied". `sys.foreign_keys` still showed `is_not_trusted = 1`, so a default run changed nothing |
    | 2 | `auto_remediate: true`, `dry_run: true` | 1 key flagged, still "No change applied". The dry run blocked the write even with `auto_remediate` on |
    | 3 | `auto_remediate: true`, `dry_run: false` | `remediate` ran one `ALTER TABLE ... WITH CHECK CHECK CONSTRAINT`. `reaudit` returned 0 rows. `sys.foreign_keys` reported `is_not_trusted = 0` |
    | 4 | defaults, after run 3 | 0 keys flagged, `clean` branch |
    | 5 | `auto_remediate: true`, `dry_run: false`, a key with a violating row | `apply` errored with "conflicted with the FOREIGN KEY constraint", the run FAILED and `errors` posted to Slack. `sys.foreign_keys` still showed `is_not_trusted = 1` for that key |
    | 6 | unreachable server | `audit` failed, `errors` block posted to Slack |

    ## Prerequisites

    - A SQL Server database you can reach over JDBC.
    - A login that can read `sys.foreign_keys` for the audit, plus `ALTER` on the parent tables (for example `db_ddladmin`) for revalidation.
    - A Slack incoming webhook.

    ### Secrets

    - `SQLSERVER_PASSWORD`: password for the login in `user`. The `password` input defaults to this secret.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook, used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `url` | `jdbc:sqlserver://localhost:1433;databaseName=app;encrypt=false` | Database to check. The query reads the connected database |
    | `user` | `sa` | SQL Server login |
    | `password` | `{{ secret('SQLSERVER_PASSWORD') }}` | Password for the login |
    | `auto_remediate` | `false` | Allow the revalidation statements |
    | `dry_run` | `true` | Must be `false` for a statement to run |

    ## Quick start

    1. Add the `SQLSERVER_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, then set `url` to the database you want to check and set `user`.
    3. Run it once with the defaults and read the flagged keys.
    4. When you are ready, run with `auto_remediate: true` and `dry_run: false`.
    5. Enable the `weekly` trigger, which always runs in safe mode.

    ## How to extend

    - Limit the audit to one schema by adding a `WHERE s.name = ...` filter so a shared instance is checked in parts.
    - Post the referenced table and the fix statement to Slack so an on-call engineer can act without opening the database.
    - Add a row-count probe for the orphan rows before revalidating, so a key that would fail is reported with the exact bad rows.
    - Loop over several databases on the instance by reading `sys.databases` first.

    ## Links

    - Foreign key trust and WITH CHECK: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-table-transact-sql
    - sys.foreign_keys catalog view: https://learn.microsoft.com/en-us/sql/relational-databases/system-catalog-views/sys-foreign-keys-transact-sql
    - SQL Server plugin: https://kestra.io/plugins/plugin-jdbc-sqlserver
  tags:
    - Infrastructure
    - Data
  subTags:
    - Databases
    - Day 2 Operations
    - Performance
  ee: false
  demo: false
