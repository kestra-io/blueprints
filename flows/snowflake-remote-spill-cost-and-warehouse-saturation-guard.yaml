id: snowflake-remote-spill-cost-and-warehouse-saturation-guard
namespace: company.finops

inputs:
  - id: snowflake_account
    type: STRING
    displayName: Snowflake Account Identifier
    required: true
    defaults: "xy12345.us-east-1"
    description: "Your Snowflake account locator or organization-account identifier."

  - id: warehouse_name
    type: STRING
    displayName: Warehouse Name
    required: true
    defaults: "ANALYTICS_WH"
    description: "The Snowflake virtual warehouse to monitor for disk spillover."

  - id: remote_spill_threshold_gb
    type: INT
    displayName: Remote Storage Spill Threshold (GB)
    required: true
    defaults: 10
    description: "Maximum allowable query bytes spilled to remote S3/GCS/Azure storage before triggering FinOps alert."

tasks:
  - id: log_guard_commencement
    type: io.kestra.plugin.core.log.Log
    message: "❄️ Starting Snowflake FinOps saturation guard for warehouse '{{ inputs.warehouse_name }}' on account {{ inputs.snowflake_account }}"

  - id: query_query_history_spillage
    type: io.kestra.plugin.jdbc.snowflake.Query
    description: "Query snowflake.account_usage.query_history to detect heavy disk spillover and warehouse memory exhaustion"
    url: "jdbc:snowflake://{{ inputs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ inputs.warehouse_name }}&db=SNOWFLAKE&schema=ACCOUNT_USAGE"
    username: "{{ secret('SNOWFLAKE_USER') }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT
          count(query_id) AS heavy_spill_queries_count,
          round(coalesce(sum(bytes_spilled_to_remote_storage) / (1024 * 1024 * 1024), 0), 2) AS total_remote_spill_gb,
          round(coalesce(sum(bytes_spilled_to_local_storage) / (1024 * 1024 * 1024), 0), 2) AS total_local_spill_gb,
          coalesce(max(round(bytes_spilled_to_remote_storage / (1024 * 1024 * 1024), 2)), 0) AS max_single_query_spill_gb
      FROM snowflake.account_usage.query_history
      WHERE warehouse_name = '{{ inputs.warehouse_name }}'
        AND start_time >= dateadd('hour', -1, current_timestamp())
        AND execution_status = 'SUCCESS'
        AND bytes_spilled_to_remote_storage > 0
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: evaluate_finops_risk
    type: io.kestra.plugin.core.flow.If
    description: "Check if remote disk spilling exceeds FinOps cost and warehouse saturation limits"
    condition: "{{ outputs.query_query_history_spillage.row.total_remote_spill_gb >= inputs.remote_spill_threshold_gb }}"
    then:
      - id: alert_finops_warehouse_saturation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatch urgent FinOps warehouse resizing alert to data platform channel"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "❄️ Snowflake FinOps Alert: Severe Remote Spillage",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Warehouse:* `{{ inputs.warehouse_name }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Remote Spill:* `{{ outputs.query_query_history_spillage.row.total_remote_spill_gb }} GB` (Limit: {{ inputs.remote_spill_threshold_gb }} GB)"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Local Spill:* `{{ outputs.query_query_history_spillage.row.total_local_spill_gb }} GB`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Impacting Queries:* `{{ outputs.query_query_history_spillage.row.heavy_spill_queries_count }}`"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "⚠️ *FinOps Impact:* Queries on warehouse `{{ inputs.warehouse_name }}` have exhausted local SSD cache and spilled tens of gigabytes to remote object storage. Remote spilling degrades throughput by up to 10x and burns unnecessary compute credits. Consider upsizing warehouse or tuning large joins and grouping keys."
                }
              }
            ]
          }

    else:
      - id: log_warehouse_healthy
        type: io.kestra.plugin.core.log.Log
        description: "Log healthy warehouse memory telemetry"
        message: "✅ Snowflake warehouse {{ inputs.warehouse_name }} is healthy. Remote spill: {{ outputs.query_query_history_spillage.row.total_remote_spill_gb }} GB in the last hour."

errors:
  - id: alert_guard_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dead-letter alert if Snowflake guard audit fails"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Snowflake FinOps Guard Failed:* Execution `{{ execution.id }}` failed to query account usage for warehouse `{{ inputs.warehouse_name }}`."
      }

triggers:
  - id: hourly_finops_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "15 * * * *"
    disabled: true

extend:
  title: Snowflake Warehouse Remote Spill Cost and FinOps Saturation Guard
  metaTitle: Snowflake Remote Spilling FinOps Cost Guard with Slack Alerts | Kestra
  shortDescription: Audit Snowflake warehouse remote disk spilling from query history and alert Slack on credit waste and query degradation.
  metaDescription: Detect expensive Snowflake query spillage to remote storage, identify memory-exhausted warehouses, and post FinOps alerts to Slack.
  description: |
    In Snowflake, queries that exceed available warehouse memory first spill to local SSD disk, and when local storage is exhausted, spill to remote cloud object storage (S3/GCS/Azure). Remote spilling severely degrades query latency and causes warehouses to stay running longer, rapidly burning cloud credits. This blueprint audits the `snowflake.account_usage.query_history` view every hour, aggregates remote spillage metrics, and alerts FinOps and data engineering teams on Slack before costs spiral.

    ## How it works

    1. **Inputs & Warehouse Scope**: Accepts the Snowflake account identifier, target virtual warehouse name, and remote spillage tolerance threshold in gigabytes.
    2. **Query History Audit**: The `query_query_history_spillage` task (`io.kestra.plugin.jdbc.snowflake.Query`) queries the `account_usage.query_history` schema with retries to compute total remote spillage, local SSD spillage, and count of affected queries within the last rolling hour.
    3. **Threshold Gate**: The `evaluate_finops_risk` task (`io.kestra.plugin.core.flow.If`) evaluates whether total remote spillover exceeds the configured tolerance limit.
    4. **Slack Operational Alert**: If spillage is high, `alert_finops_warehouse_saturation` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a FinOps remediation card outlining credit waste and resizing recommendations.
    5. **Pipeline Resilience**: An `errors` handler guarantees dead-letter Slack alerts if Snowflake authentication or network connections fail.

    ## What you get

    - Automated FinOps cost guardrails for Snowflake warehouse operations.
    - Visibility into query memory saturation without configuring complex third-party tools.
    - Proactive alerts preventing warehouse run-time inflation and credit burnout.
    - Scheduled hourly auditing capability with complete execution lineage.

    ## Who it's for

    - FinOps Practitioners and Data Platform Leaders optimizing Snowflake credit consumption.
    - Data Engineers and Analytics Engineers optimizing heavy ETL and transformation models.
    - Database Administrators overseeing enterprise data warehouse health.

    ## Why orchestrate this with Kestra

    Kestra coordinates Snowflake JDBC execution, secret protection, retry backoffs, conditional routing, and multi-channel messaging into a clean declarative YAML DAG that runs natively in your orchestration environment.

    ## Prerequisites

    - A Snowflake account with user permissions to query `snowflake.account_usage.query_history`.
    - A Slack Incoming Webhook URL.

    ### Secrets

    - `SNOWFLAKE_USER`: Snowflake database username.
    - `SNOWFLAKE_PASSWORD`: Snowflake database password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for FinOps notifications.

    ## Quick start

    1. Configure `SNOWFLAKE_USER`, `SNOWFLAKE_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Run this flow with your Snowflake account identifier and warehouse name.
    3. Review the execution output to verify hourly remote spillage statistics.
    4. Enable the `hourly_finops_audit` trigger for continuous credit protection.

    ## How to extend

    - Add an automated `ALTER WAREHOUSE ... SET WAREHOUSE_SIZE = ...` task to dynamically autoscale warehouse compute.
    - Forward spilled query IDs to Jira or Linear to generate performance optimization tickets for analytics engineers.
    - Export spillage telemetry to Datadog or BigQuery for multi-cloud FinOps dashboards.

    ## Links

    - [Snowflake Query Spilling Documentation](https://docs.snowflake.com/en/user-guide/ui-query-profile#spilling)
    - [Kestra Snowflake Plugin](https://kestra.io/plugins/plugin-jdbc-snowflake)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Database
    - Cloud
  subTags:
    - Snowflake
    - FinOps & Cost Optimization
  ee: false
  demo: false
