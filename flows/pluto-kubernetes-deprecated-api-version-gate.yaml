id: pluto-kubernetes-deprecated-api-version-gate
namespace: company.platform

inputs:
  - id: manifest_file
    type: FILE
    displayName: "Kubernetes Manifest File"
    description: "The Kubernetes manifest YAML file or multi-document YAML to scan for deprecated and removed apiVersions against the target Kubernetes release. Used during manual execution or Subflow chaining; ignored when the webhook trigger fires."

  - id: target_kubernetes_version
    type: STRING
    displayName: "Target Kubernetes Version"
    defaults: "v1.31.0"
    description: "The target Kubernetes version (e.g. v1.30.0, v1.31.0, v1.32.0) against which apiVersion deprecations and removals are evaluated."

triggers:
  - id: scan_on_pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Allows GitOps CI pipelines (e.g., GitHub Actions, GitLab CI, or Argo CD pre-sync hooks) to POST Kubernetes manifest files directly to this gate. fetchType: STORE safely streams the payload into Kestra internal storage as trigger.uri rather than exposing untrusted text to string interpolation."
    key: "{{ secret('PLUTO_WEBHOOK_KEY') }}"
    fetchType: STORE
    disabled: true

tasks:
  - id: run_pluto
    type: io.kestra.plugin.scripts.shell.Commands
    description: |
      Runs Fairwinds Pluto inside an isolated container against the provided Kubernetes manifest.
      Evaluates all declared resources against the embedded Kubernetes deprecation and removal catalog
      for the target release, generating a structured JSON diagnostic report.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      entryPoint: []
    containerImage: fairwinds/pluto:latest
    commands:
      - "cp {{ trigger.uri is defined ? trigger.uri : inputs.manifest_file }} manifest.yaml"
      - "/pluto detect manifest.yaml -o json -t k8s={{ inputs.target_kubernetes_version }} > pluto_report.json || true"
      - "cat pluto_report.json"
    outputFiles:
      - "pluto_report.json"
    allowFailure: true

  - id: classify_api_compliance
    type: io.kestra.plugin.core.debug.Return
    description: |
      Parses pluto_report.json and classifies the outcome:
      - UNREACHABLE: Diagnostic report was never produced due to a container or I/O failure.
      - BLOCK_REMOVED: At least one declared resource uses an apiVersion that has been completely removed in the target Kubernetes version, which causes the API server to reject manifest admission.
      - WARN_DEPRECATED: Manifest contains apiVersions that are deprecated in the target version but not yet removed, requiring migration before future upgrades.
      - PASS: All declared resources use current, non-deprecated apiVersions for the target Kubernetes release.
    format: "{{ outputs.run_pluto.outputFiles['pluto_report.json'] is defined ? (read(outputs.run_pluto.outputFiles['pluto_report.json']) | jq('if (.items == null or (.items | length) == 0) then \"PASS\" elif ([.items[] | select(.removed == true)] | length) > 0 then \"BLOCK_REMOVED\" elif ([.items[] | select(.deprecated == true)] | length) > 0 then \"WARN_DEPRECATED\" else \"PASS\" end') | first) : 'UNREACHABLE' }}"

  - id: route_by_api_compliance
    type: io.kestra.plugin.core.flow.Switch
    description: "Branches on the compliance verdict: BLOCK_REMOVED dispatches an urgent Slack alert detailing the removed resource and replacement apiVersion, then fails the gate via Fail; WARN_DEPRECATED alerts Slack with deprecation warnings without failing the build; PASS confirms clean validation; UNREACHABLE alerts on diagnostic execution failure."
    value: "{{ outputs.classify_api_compliance.value }}"
    cases:
      "BLOCK_REMOVED":
        - id: alert_removed_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches a high-priority alert detailing the removed apiVersion, resource name, kind, and recommended replacement."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "CRITICAL: Kubernetes API compliance gate BLOCKED execution {{ execution.id }} on flow {{ flow.id }}. Removed apiVersion detected for target {{ inputs.target_kubernetes_version }}: {{ read(outputs.run_pluto.outputFiles['pluto_report.json']) | jq('[.items[] | select(.removed == true) | "Kind: " + .api.kind + ", Name: " + .name + " uses removed " + .api.version + " (Replacement: " + .api["replacement-api"] + ")"] | join(" | ")') | first }}. The Kubernetes API server will reject this manifest. Migrate to the replacement apiVersion before merging."
            }
        - id: fail_removed_gate
          type: io.kestra.plugin.core.execution.Fail
          description: "Hard-fails the execution so downstream cluster apply steps or parent GitOps sync pipelines are halted immediately."
          errorMessage: "Kubernetes API compliance gate failed: manifest contains removed apiVersions for target cluster version {{ inputs.target_kubernetes_version }}. Review Pluto report."

      "WARN_DEPRECATED":
        - id: alert_deprecated_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Sends an alert detailing deprecated apiVersions that should be migrated ahead of future cluster minor releases."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Kubernetes API gate WARNING (execution {{ execution.id }}): Deprecated apiVersions found for target {{ inputs.target_kubernetes_version }}: {{ read(outputs.run_pluto.outputFiles['pluto_report.json']) | jq('[.items[] | select(.deprecated == true and .removed == false) | "Kind: " + .api.kind + ", Name: " + .name + " uses deprecated " + .api.version + " (Migrate to: " + .api["replacement-api"] + ")"] | join(" | ")') | first }}."
            }

      "PASS":
        - id: log_clean_manifest
          type: io.kestra.plugin.core.log.Log
          description: "Logs confirmation of clean manifest validation with zero deprecated or removed apiVersions."
          message: "Kubernetes manifest validation passed: all resources comply with target Kubernetes version {{ inputs.target_kubernetes_version }}."

      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Alerts when Pluto container failed to produce a report due to container error or malformed input."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Kubernetes API gate UNREACHABLE: Pluto container failed to produce pluto_report.json. Check task logs for execution {{ execution.id }}."
            }
        - id: fail_unreachable
          type: io.kestra.plugin.core.execution.Fail
          description: "Fails execution when the static analysis engine could not run."
          errorMessage: "Kubernetes manifest scan failed to complete. Check Pluto runner logs."

    defaults:
      - id: log_default_status
        type: io.kestra.plugin.core.log.Log
        message: "Completed Kubernetes apiVersion compliance evaluation with status: {{ outputs.classify_api_compliance.value }}"

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Records persistent audit log entry for passing and warning runs."
    message: "Kubernetes apiVersion compliance gate completed: status={{ outputs.classify_api_compliance.value }}, targetVersion={{ inputs.target_kubernetes_version }}, execution={{ execution.id }}."

errors:
  - id: alert_gate_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Fires when unexpected execution crashes occur or when a Fail task deliberately fails the gate."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Kubernetes API version gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). If status is BLOCK_REMOVED, this failure is intentional to protect the cluster deployment."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_api_compliance.value }}"

extend:
  title: "Fairwinds Pluto Kubernetes Deprecated API Version Gate"
  metaTitle: Fairwinds Pluto Kubernetes Deprecated API Version Gate for Kestra
  shortDescription: Detect deprecated and removed Kubernetes apiVersions in manifests using Fairwinds Pluto, block CI/CD pipelines on breaking removals, and warn on deprecations.
  metaDescription: Block Kubernetes deployments with removed apiVersions and warn on deprecations before cluster upgrades using Fairwinds Pluto.
  description: |
    Kubernetes deprecates and removes API versions across minor releases (such as `extensions/v1beta1`, `policy/v1beta1` PodSecurityPolicy, `batch/v1beta1` CronJob, and `autoscaling/v2beta2` HorizontalPodAutoscaler). When platform engineering teams upgrade clusters or deploy legacy manifests and Helm charts to newer control planes, manifests referencing completely removed API versions are rejected by the Kubernetes API server with fatal admission errors, aborting deployment pipelines midway.

    This blueprint runs Fairwinds Pluto in an isolated container to statically evaluate Kubernetes manifests against the target cluster release without requiring live cluster credentials. Unlike a simplistic binary check, this gate operationalizes Pluto's distinct finding tiers: it immediately hard-blocks the pipeline via `Fail` tasks when a resource references an API version that has been completely removed in the target release (providing exact replacement advice), while emitting non-blocking Slack warnings for versions that are merely deprecated, allowing engineering teams to plan migrations ahead of future upgrades without halting present releases.

    ## How it works

    1. `scan_on_pr_webhook` (`io.kestra.plugin.core.trigger.Webhook`) allows GitOps CI/CD pipelines (e.g. GitHub Actions, GitLab CI, or Argo CD pre-sync hooks) to POST Kubernetes manifest files directly to Kestra. `fetchType: STORE` securely streams the payload into Kestra internal storage as `trigger.uri`, preventing untrusted YAML text from undergoing string interpolation in shell scripts. Manual or parent `Subflow` executions supply the file via `manifest_file`.
    2. `run_pluto` (`io.kestra.plugin.scripts.shell.Commands`) executes the `fairwinds/pluto:latest` container with `entryPoint: []` to run `/pluto detect manifest.yaml -o json -t k8s={{ inputs.target_kubernetes_version }}` against the configuration, outputting diagnostics to `pluto_report.json`. `allowFailure: true` ensures that non-zero linter exit codes do not abort the execution before structured classification.
    3. `classify_api_compliance` (`io.kestra.plugin.core.debug.Return`) inspects `pluto_report.json` using `jq`:
       - If `pluto_report.json` was not generated, it classifies as `UNREACHABLE`.
       - If any item has `removed == true` for the target Kubernetes version, it classifies as `BLOCK_REMOVED`.
       - If any item has `deprecated == true` while `removed == false`, it classifies as `WARN_DEPRECATED`.
       - If zero items are found (`.items == null` or empty array), it classifies as `PASS`.
    4. `route_by_api_compliance` (`io.kestra.plugin.core.flow.Switch`) branches on the classification:
       - `BLOCK_REMOVED`: Sends an urgent Slack alert detailing the exact resource name, kind, removed version, and recommended replacement, then triggers `fail_removed_gate` (`io.kestra.plugin.core.execution.Fail`) to hard-fail the pipeline.
       - `WARN_DEPRECATED`: Dispatches an informational Slack notification detailing deprecated versions to migrate, allowing the execution to succeed.
       - `PASS`: Records confirmation in execution logs.
       - `UNREACHABLE`: Alerts on runner container or storage failure.
    5. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) records a persistent status line in Kestra execution history for continuous cluster upgrade readiness tracking.
    6. Root `errors` block alerts Slack whenever an unexpected system fault occurs or when `Fail` tasks deliberately stop the pipeline.

    ## What you get

    - Early detection of breaking Kubernetes API removals before initiating `kubectl apply` or GitOps sync operations on newer cluster versions.
    - Clear distinction between fatal removed API versions (hard block) and future deprecation warnings (informational Slack notification only).
    - Hard stop: `fail_removed_gate` ensures parent CI/CD flows or Subflow orchestrators halt immediately when a removed API version is detected.
    - Actionable migration advice: alerts indicate the exact resource name, kind, deprecated version, and required replacement apiVersion.
    - Standardized execution output (`status`: `PASS`, `WARN_DEPRECATED`, `BLOCK_REMOVED`, `UNREACHABLE`) for automated downstream routing.

    ## Who it's for

    - Platform Engineers and Kubernetes Administrators preparing clusters for minor version upgrades (e.g., v1.29 to v1.30 or v1.31).
    - DevOps and GitOps teams automating pre-deployment validation gates for Helm charts and Kubernetes YAML manifests.
    - SRE teams seeking an auditable log of API version compliance across enterprise microservice repositories.

    ## Why orchestrate this with Kestra

    Standalone CLI tools produce exit codes, but cannot coordinate multi-tier upgrade decisions, alert designated team channels with tailored replacement guidance, or halt downstream enterprise release flows. Kestra transforms Pluto into an automated, auditable compliance gate with persistent execution history, secure credential handling, and webhook-driven CI integration.

    ## Prerequisites

    - Docker runtime available to the Kestra worker to run the `fairwinds/pluto:latest` container (no live Kubernetes cluster or cloud credentials required).
    - A Kubernetes manifest YAML file or multi-document YAML to evaluate.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `PLUTO_WEBHOOK_KEY`: Secret authentication key for the inbound webhook trigger (`.../executions/webhook/{namespace}/{flowId}/{key}`). Required only if `scan_on_pr_webhook` is enabled.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used to dispatch breaking removal blocks, deprecation warnings, and system failure alerts.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret (and `PLUTO_WEBHOOK_KEY` if using webhooks) in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Click **Execute**, upload a test Kubernetes manifest (for example an Ingress manifest declaring `apiVersion: networking.k8s.io/v1beta1` with `target_kubernetes_version = "v1.31.0"` to observe a `BLOCK_REMOVED` outcome), and verify the execution log.
    4. Enable `scan_on_pr_webhook` and configure your repository CI pipeline or Argo CD pre-sync hook to POST changed manifest files on pull request events.

    ## How to extend

    - Add automated GitHub PR review comments using `io.kestra.plugin.github.pulls.Comment` to post inline deprecation warnings directly on manifest pull requests.
    - Chain this gate into a cluster upgrade preparation pipeline that audits all repository branches before scheduling Kubernetes control plane upgrades.
    - Push compliance metrics to Prometheus or Datadog using `io.kestra.plugin.prometheus.PushGateway` to track organization-wide API migration progress.

    ## Links

    - [Fairwinds Pluto Documentation](https://pluto.docs.fairwinds.com/)
    - [Kubernetes Deprecation Guide](https://kubernetes.io/docs/reference/using-api/deprecation-guide/)
    - [Kestra Docker Script Runner](https://kestra.io/plugins/scripts/runner/docker/io.kestra.plugin.scripts.runner.docker.docker)
    - [Kestra Fail Task](https://kestra.io/plugins/core/tasks/execution/io.kestra.plugin.core.execution.fail)
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Approval Gates
  ee: false
  demo: false
