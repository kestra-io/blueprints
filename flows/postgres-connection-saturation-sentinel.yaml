id: postgres-connection-saturation-sentinel
namespace: company.database
description: Audits PostgreSQL connection utilization to detect impending pool exhaustion and 53300 too many clients fatal errors.

inputs:
  - id: db_host
    type: STRING
    defaults: "postgres.internal"
    description: PostgreSQL database server hostname or IP.
  - id: db_port
    type: INT
    defaults: 5432
    description: PostgreSQL server port.
  - id: db_name
    type: STRING
    defaults: "postgres"
    description: PostgreSQL database name.
  - id: db_user
    type: STRING
    defaults: "postgres"
    description: PostgreSQL administrative user.
  - id: warning_utilization_pct
    type: FLOAT
    defaults: 85.0
    description: Warning threshold percentage of max_connections in active use.

tasks:
  - id: query_connection_saturation
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.db_host }}:{{ inputs.db_port }}/{{ inputs.db_name }}"
    username: "{{ inputs.db_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
          count(*) AS current_connections,
          current_setting('max_connections')::int AS max_connections,
          ROUND(100.0 * count(*) / current_setting('max_connections')::int, 1) AS utilization_pct
      FROM pg_stat_activity;
    fetchType: FETCH_ONE

  - id: evaluate_connection_capacity
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_connection_saturation.row ? outputs.query_connection_saturation.row.utilization_pct | float > inputs.warning_utilization_pct : false }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 PostgreSQL Connection Pool Saturation Alert",
                "text": "PostgreSQL database connection utilization is at *{{ outputs.query_connection_saturation.row.utilization_pct }}%* (*{{ outputs.query_connection_saturation.row.current_connections }}* of *{{ outputs.query_connection_saturation.row.max_connections }}* connections). Impact: New client application connections will be refused with `FATAL: sorry, too many clients already`.",
                "footer": "Kestra Database Sentinel • Postgres Connections"
              }
            ]
          }

outputs:
  - id: current_connections
    type: INT
    value: "{{ outputs.query_connection_saturation.row ? outputs.query_connection_saturation.row.current_connections : 0 }}"
  - id: max_connections
    type: INT
    value: "{{ outputs.query_connection_saturation.row ? outputs.query_connection_saturation.row.max_connections : 0 }}"
  - id: utilization_pct
    type: FLOAT
    value: "{{ outputs.query_connection_saturation.row ? outputs.query_connection_saturation.row.utilization_pct : 0.0 }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Postgres Connection Saturation Sentinel Failed",
            "text": "The PostgreSQL connection capacity query failed. Please verify database connectivity and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Audits PostgreSQL connection utilization to detect impending pool exhaustion and 53300 too many clients fatal errors.
  metaTitle: PostgreSQL Connection Pool Saturation and max_connections Exhaustion Sentinel with Kestra
  title: PostgreSQL Connection Pool Saturation and max_connections Exhaustion Sentinel
  shortDescription: Audits PostgreSQL connection utilization to detect impending pool exhaustion and 53300 too many clients fatal errors.
  description: |
    ## How it works
    This workflow uses the native Kestra PostgreSQL JDBC plugin to query `pg_stat_activity` and compare total active connections against the database's configured `max_connections` setting. When application microservice connection pools leak or surge, PostgreSQL connections saturate. If connection utilization exceeds the warning percentage (default 85%), an urgent alert is sent to Slack before incoming queries fail.

    ## What you get
    - Proactive capacity warning before application outages occur.
    - Exact breakdown of active connections vs configured `max_connections`.
    - Prevents catastrophic cascading failures in upstream API gateways and web microservices.

    ## Who it's for
    - Database Administrators (DBAs) and SREs managing shared PostgreSQL instances.
    - Application developers sizing client-side connection pools (e.g., HikariCP, PgBouncer).

    ## Why orchestrate this with Kestra
    - **Native SQL Execution**: Leverages `io.kestra.plugin.jdbc.postgresql.Query` without external command-line dependencies.
    - **Continuous Health Monitoring**: Run regular, automated health checks with built-in retry and failure alerting.
    - **Multi-Environment Monitoring**: Easily configure separate monitoring workflows across RDS, Aurora, and on-premise clusters.

    ## Prerequisites
    - PostgreSQL database credentials with access to `pg_stat_activity`.
    - Secrets `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure database host, port, and credentials.
    3. Run the workflow to inspect current connection utilization.

    ## Links
    - [PostgreSQL Connections Configuration](https://www.postgresql.org/docs/current/runtime-config-connection.html)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
