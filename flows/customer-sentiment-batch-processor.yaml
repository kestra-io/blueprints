id: customer-sentiment-batch-processor
namespace: company.analytics

extend:
  title: In-Memory DuckDB Customer Sentiment and Health Pipeline
  metaTitle: DuckDB Sentiment Extraction and Parallel Health Diagnostics | Kestra
  shortDescription: Concurrently extracts user feedback using DuckDB SQL, verifies API uptime, and conditionally routes telemetry.
  metaDescription: Orchestrate in-memory DuckDB batch extraction, parallel HTTP checks, and conditional alert logging with Kestra.
  description: |
    Orchestrates in-memory SQL analytics with DuckDB, parallel HTTP status verification, and conditional telemetry logging without external database dependencies.

    ## How it works
    1. A Schedule trigger runs the pipeline automatically on an hourly cron schedule.
    2. DuckDB extracts unprocessed customer reviews directly in memory via SQL.
    3. A Parallel flowable task concurrently queries an API status endpoint and processes log messages.
    4. An If task evaluates HTTP response codes and routes success telemetry accordingly.

    ## What you get
    - Fast in-memory analytics without provisioning external database servers.
    - Concurrent verification of dependent APIs to eliminate pipeline bottlenecks.
    - Automated logging safeguards alerting on execution status.

    ## Who it's for
    - Analytics Engineers looking for zero-setup relational extraction patterns.
    - Platform Teams designing concurrent health diagnostics.

    ## Why orchestrate this with Kestra
    - Declarative YAML workflows with built-in retries and state management.
    - Built-in UI topology and execution tracking for every branch.

    ## Prerequisites
    - Standard Kestra instance with the DuckDB plugin enabled.

    ### Secrets
    - No secrets required.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Click Execute to verify all tasks complete in green.
    3. Enable the hourly schedule trigger.

    ## How to extend
    - Replace the mock records with real Parquet or S3 queries in DuckDB.
    - Connect a Slack or PagerDuty task to the If evaluation branch.

    ## Links
    - [DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Parallel Tasks](https://kestra.io/docs/workflow-components/flowable-tasks/parallel)
  tags:
    - Data
  subTags:
    - Testing & Quality
  ee: false
  verified: false
  demo: false

triggers:
  - id: hourly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

tasks:
  - id: query_mock_feedback
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: "Extract batch feedback in-memory"
    sql: |
      SELECT 101 AS user_id, 'App crash when clicking checkout button' AS review, 'URGENT' AS priority
      UNION ALL
      SELECT 102 AS user_id, 'Great service, loved the UI' AS review, 'NORMAL' AS priority;
    fetchType: FETCH

  - id: parallel_diagnostics
    type: io.kestra.plugin.core.flow.Parallel
    description: "Concurrent diagnostic telemetry"
    tasks:
      - id: check_api_status
        type: io.kestra.plugin.core.http.Request
        uri: "https://httpbin.org/status/200"
        method: GET

      - id: analyze_logs
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - 'echo "Batch extracted: {{ outputs.query_mock_feedback.size }} records"'
          - 'echo "Parsing priority keywords from feedback stream..."'

  - id: evaluate_severity
    type: io.kestra.plugin.core.flow.If
    description: "Conditional routing based on API response"
    condition: "{{ outputs.check_api_status.code == 200 }}"
    then:
      - id: log_batch_metrics
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: |
          Feedback processing succeeded.
          Processed {{ outputs.query_mock_feedback.size }} items.
          API Status: {{ outputs.check_api_status.code }}
