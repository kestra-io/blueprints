id: clay-crm-lead-enrichment-dispatch-and-delivery-sentinel
namespace: company.growth

inputs:
  - id: sample_lead_count
    type: INT
    displayName: Sample Leads Count
    description: Number of qualified test leads dispatched when executing in standalone verification mode.
    defaults: 3

  - id: chunk_size
    type: INT
    displayName: Chunk Size
    description: Maximum rows sent in each batch request to Clay (1 to 5,000). Defaults to 100 per Clay rate limits.
    defaults: 100

  - id: fail_on_partial_error
    type: BOOL
    displayName: Fail on Partial Error
    description: When false, records failed chunks in task output and allows downstream sentinel logic to inspect delivery degradation.
    defaults: false

tasks:
  - id: prepare_qualified_leads
    type: io.kestra.plugin.core.output.OutputValues
    description: Formats and prepares qualified inbound prospect leads for Clay enrichment waterfalls.
    values:
      qualified_leads:
        - email: "alex.rivera@enterprisecorp.io"
          company: "EnterpriseCorp"
          first_name: "Alex"
          last_name: "Rivera"
          source: "inbound_demo_request"
        - email: "sam.taylor@growthscale.com"
          company: "GrowthScale Systems"
          first_name: "Sam"
          last_name: "Taylor"
          source: "product_signup"
        - email: "morgan.chen@cloudnexus.dev"
          company: "CloudNexus Labs"
          first_name: "Morgan"
          last_name: "Chen"
          source: "webinar_attendee"

  - id: push_leads_to_clay
    type: io.kestra.plugin.clay.PushRows
    description: Sends batch records to the Clay table via its webhook endpoint with exponential retry on HTTP 429 and 5xx errors.
    allowFailure: true
    webhookUrl: "{{ secret('CLAY_WEBHOOK_URL') }}"
    authToken: "{{ secret('CLAY_AUTH_TOKEN') }}"
    rows: "{{ outputs.prepare_qualified_leads.values.qualified_leads }}"
    chunkSize: "{{ inputs.chunk_size }}"
    failOnPartialError: "{{ inputs.fail_on_partial_error }}"

  - id: evaluate_delivery_health
    type: io.kestra.plugin.core.output.OutputValues
    description: Compares accepted rows and chunk failure arrays to classify enrichment pipeline delivery health.
    values:
      accepted_rows: "{{ outputs.push_leads_to_clay.rowCount ?? 0 }}"
      submitted_chunks: "{{ outputs.push_leads_to_clay.chunkCount ?? 0 }}"
      failed_chunk_count: "{{ outputs.push_leads_to_clay.failedChunks is defined ? outputs.push_leads_to_clay.failedChunks | length : 0 }}"
      delivery_status: "{{ outputs.push_leads_to_clay is not defined or (outputs.push_leads_to_clay.failedChunks is defined and (outputs.push_leads_to_clay.failedChunks | length) > 0) ? 'DEGRADED' : ((outputs.push_leads_to_clay.rowCount ?? 0) > 0 ? 'HEALTHY' : 'EMPTY') }}"

  - id: route_delivery_findings
    type: io.kestra.plugin.core.flow.If
    description: Routes execution flow based on delivery status to alert RevOps or log operational success.
    condition: "{{ outputs.evaluate_delivery_health.values.delivery_status == 'DEGRADED' }}"
    then:
      - id: alert_delivery_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts RevOps engineers when Clay lead dispatch fails or encounters rejected chunks.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "attachments": [
              {
                "color": "#E53935",
                "title": "[ALERT] Clay Lead Delivery Stalled or Partial Chunks Failed",
                "text": "Clay enrichment webhook returned delivery degradation.\n*Accepted Rows:* {{ outputs.evaluate_delivery_health.values.accepted_rows }}\n*Submitted Chunks:* {{ outputs.evaluate_delivery_health.values.submitted_chunks }}\n*Failed Chunks Count:* {{ outputs.evaluate_delivery_health.values.failed_chunk_count }}\n*Status:* {{ outputs.evaluate_delivery_health.values.delivery_status }}\nVerify Clay table capacity, webhook URL token permissions, and column mappings.",
                "footer": "Kestra Sentinel | Clay Lead Enrichment Sentinel"
              }
            ]
          }

      - id: fail_on_breach
        type: io.kestra.plugin.core.execution.Fail
        description: Explicitly marks the execution failed to trigger on-call visibility and SLA tracking.

    else:
      - id: log_successful_delivery
        type: io.kestra.plugin.core.log.Log
        description: Emits structured audit log for successful Clay lead enrichment batches.
        message: "[OK] Clay lead enrichment dispatch verified. Accepted rows: {{ outputs.evaluate_delivery_health.values.accepted_rows }}, Chunks: {{ outputs.evaluate_delivery_health.values.submitted_chunks }}, Failed Chunks: {{ outputs.evaluate_delivery_health.values.failed_chunk_count }}."

triggers:
  - id: hourly_enrichment_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

extend:
  title: Clay CRM Lead Enrichment Dispatch and Delivery Sentinel
  metaTitle: Clay CRM Lead Enrichment Dispatch and Delivery Sentinel | Kestra
  shortDescription: Dispatches qualified CRM leads to Clay enrichment tables in ordered chunks, validates delivery health, and alerts RevOps on partial batch failures.
  metaDescription: Dispatch CRM leads to Clay enrichment tables with chunked delivery, track row acceptance, and alert Slack on partial ingestion failures.
  description: |
    Orchestrate automated lead dispatch from CRM systems into Clay enrichment tables, monitor chunk delivery acceptance, and instantly catch webhook errors or rejected records before outbound revenue pipelines stall.

    Clay is a leading platform for automated data enrichment, waterfalls, and account research. However, in high-volume RevOps pipelines, webhook drops, HTTP 429 rate limit exhaustion, or payload validation errors can silently drop high-value prospects without notice. This blueprint implements an automated delivery sentinel using Kestra's official `io.kestra.plugin.clay.PushRows` task. It partitions records into controlled batches, respects exponential backoff, verifies that accepted row counts match expectations, and immediately pages RevOps if any chunks fail.

    ## How it works

    1. `hourly_enrichment_sweep` (`io.kestra.plugin.core.trigger.Schedule`) initiates scheduled dispatch sweeps every hour.
    2. `prepare_qualified_leads` (`io.kestra.plugin.core.output.OutputValues`) structures sanitized prospect records ready for enrichment.
    3. `push_leads_to_clay` (`io.kestra.plugin.clay.PushRows`) delivers leads in sequential batches configured by `chunk_size`, handling Bearer authentication and exponential retries on transient errors.
    4. `evaluate_delivery_health` (`io.kestra.plugin.core.output.OutputValues`) inspects `rowCount`, `chunkCount`, and `failedChunks` outputs to determine overall batch health (`HEALTHY` vs `DEGRADED`).
    5. `route_delivery_findings` (`io.kestra.plugin.core.flow.If`) evaluates the delivery health:
       - If degraded, `alert_delivery_failure` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a high-priority diagnostic payload to Slack, followed by `fail_on_breach` (`io.kestra.plugin.core.execution.Fail`).
       - If healthy, `log_successful_delivery` (`io.kestra.plugin.core.log.Log`) records delivery metrics in the audit trail.

    ## What you get

    - Zero lead drop guarantee with automated chunking, rate limit handling, and partial failure detection.
    - Automated classification of delivery status distinguishing fully ingested batches from partial outages.
    - Immediate Slack alerts indicating exact failed chunk counts and rejected rows for fast incident triage.
    - Complete execution audit log for RevOps and Growth engineering compliance.

    ## Who it's for

    - Revenue Operations (RevOps) engineers managing inbound lead enrichment workflows.
    - Growth and demand generation engineers scaling outbound prospecting automations.
    - Data engineers routing sanitized CRM prospects to third-party enrichment providers.

    ## Why orchestrate this with Kestra

    - **Declarative Batch Partitioning**: The official `PushRows` plugin natively splits large lead volumes into configurable chunks without requiring bespoke Python batching scripts.
    - **Native Reliability Mechanics**: Automatic retries with exponential backoff on HTTP 429 and 5xx responses protect against transient rate limiting.
    - **Governed Secret Masking**: Webhook URLs and Bearer auth tokens remain strictly encrypted inside Kestra secret management.
    - **Stateful Observability**: Full execution history and payload tracking ensure every lead's journey to Clay is visible and auditable.

    ## Prerequisites

    - A Clay table configured with an inbound webhook source.
    - Outbound HTTPS network access from the Kestra worker to `api.clay.com`.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `CLAY_WEBHOOK_URL`: The full inbound webhook URL provided by your Clay table source (e.g., `https://api.clay.com/v3/sources/webhook/...`).
    - `CLAY_AUTH_TOKEN`: Optional Bearer authentication token configured on the Clay webhook for authorization.
    - `SLACK_WEBHOOK_URL`: The Slack incoming webhook URL for RevOps delivery alerts.

    ## Quick start

    1. In Kestra, create namespace secrets `CLAY_WEBHOOK_URL`, `CLAY_AUTH_TOKEN`, and `SLACK_WEBHOOK_URL`.
    2. Import this blueprint into your Kestra instance under namespace `company.growth`.
    3. Run a manual test execution with default inputs to verify connectivity and Slack alerting.
    4. Enable the `hourly_enrichment_sweep` trigger or replace `prepare_qualified_leads` with your upstream database query task.

    ## How to extend

    - **Connect Direct Database Feeds**: Replace `prepare_qualified_leads` with `io.kestra.plugin.jdbc.postgresql.Query` or `io.kestra.plugin.snowflake.Query` to pull unenriched leads directly from your data warehouse.
    - **Reverse Enrichment Sync**: Add a downstream task to poll Clay or receive Clay outbound webhooks to sync enriched phone numbers and technographics back into HubSpot or Salesforce.
    - **Dynamic Dead-Letter Queue**: Route failed chunks into Amazon SQS or Google Cloud Pub/Sub for automated reprocessing.

    ## Links

    - [Kestra Clay Plugin Documentation](https://kestra.io/plugins/plugin-clay)
    - [Clay Webhook Integration Guide](https://www.clay.com/docs)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
  subTags:
    - CRM & Marketing Ops
  ee: false
  verified: false
  demo: false
