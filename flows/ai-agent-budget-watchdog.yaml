id: ai-agent-budget-watchdog
namespace: company.team
description: |
  Stop a runaway AI agent before its answer reaches anything downstream. The flow
  runs one live io.kestra.plugin.ai.agent.AIAgent call, then immediately reads that
  call's real tokenUsage and toolExecutions outputs and fails the execution when
  the call blew past the configured token or tool-call budget, so no downstream
  task ever sees an over-budget answer. Within budget, the agent answer is returned
  unchanged. There is no schedule and no sample data: the enforcement point is the
  gate task itself, in the same execution, right after the live call.

inputs:
  - id: prompt
    type: STRING
    displayName: Agent task
    description: The task the live agent must carry out. The agent may call Kestra flows as tools while working on it.
    defaults: |
      Summarize, in under 150 words, what Kestra's AI agent tooling is for and when an agent should call a flow instead of answering directly.
  - id: max_total_tokens
    type: INT
    displayName: Maximum total tokens
    description: Hard cap on input plus output tokens for the single agent call. A call above this cap fails the execution.
    defaults: 20000
  - id: max_tool_calls
    type: INT
    displayName: Maximum tool calls
    description: Hard cap on the number of tool calls the agent may make during the single call. More calls than this fails the execution.
    defaults: 10

tasks:
  - id: run_agent
    type: io.kestra.plugin.ai.agent.AIAgent
    description: The live agent call. Its real tokenUsage and toolExecutions outputs are what the gate below reads; nothing here is stubbed or replayed.
    provider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: gemini-3.5-flash-lite
      apiKey: "{{ secret('GEMINI_API_KEY') }}"
    systemMessage: |
      You are a concise assistant. Answer in plain language and keep the answer short.
      Call a Kestra flow as a tool only when it is clearly needed to answer; otherwise answer directly.
    prompt: "{{ inputs.prompt }}"
    tools:
      - type: io.kestra.plugin.ai.tool.KestraFlow

  - id: budget_gate
    type: io.kestra.plugin.core.flow.If
    description: Inline enforcement, in the same execution and immediately after the live call. The condition reads only the real outputs of run_agent, total tokens (input plus output) and the tool-call count. Over either cap, the Fail task fires and the execution stops here; within both caps, the agent answer is delivered unchanged.
    condition: "{{ (outputs.run_agent.tokenUsage.inputTokenCount ?? 0) + (outputs.run_agent.tokenUsage.outputTokenCount ?? 0) > inputs.max_total_tokens or ((outputs.run_agent.toolExecutions ?? []) | length) > inputs.max_tool_calls }}"
    then:
      - id: budget_exceeded
        type: io.kestra.plugin.core.execution.Fail
        description: Over-budget agent calls fail outright. The agent answer is discarded and no downstream task runs, so an expensive or looping call cannot leak cost or side effects into the rest of the pipeline.
        errorMessage: "AI agent budget exceeded: {{ (outputs.run_agent.tokenUsage.inputTokenCount ?? 0) + (outputs.run_agent.tokenUsage.outputTokenCount ?? 0) }} total tokens (cap {{ inputs.max_total_tokens }}), {{ ((outputs.run_agent.toolExecutions ?? []) | length) }} tool calls (cap {{ inputs.max_tool_calls }}). The agent answer is discarded and no downstream task runs."
    else:
      - id: deliver_answer
        type: io.kestra.plugin.core.debug.Return
        description: Within budget, the agent answer passes through untouched. This task runs only when the gate passes, which is what makes the gate a real enforcement point rather than a report.
        format: "{{ outputs.run_agent.textOutput }}"

extend:
  shortDescription: Fail a live AI agent call the moment it blows its token or tool-call budget
  title: AI Agent Budget Watchdog
  metaTitle: AI Agent Budget Watchdog | Kestra
  description: |
    ## What it does

    A single runaway agent call can burn through a token budget or loop over tool
    calls until someone notices the bill. This blueprint puts a hard budget gate
    directly behind a live AI agent call: it runs one real
    `io.kestra.plugin.ai.agent.AIAgent` task, then immediately reads that task's
    real `tokenUsage` and `toolExecutions` outputs and fails the execution when
    the call exceeded the configured token cap or tool-call cap. The agent answer
    is delivered only when the call stayed within both budgets, so an over-budget
    answer never reaches a downstream task, notification, or side effect.

    This is not a nightly scan over yesterday's usage. The gate runs in the same
    execution, seconds after the live call, before anything consumes the result.
    That ordering is the whole point: a report about an expensive call arrives too
    late, while a gate that fires first prevents the spend from propagating.

    ## How it works

    1. `run_agent` (`io.kestra.plugin.ai.agent.AIAgent`) carries out the task from
    the `prompt` input with the `GoogleGemini` provider, and may call Kestra
    flows as tools while working. Its credentials come from the `GEMINI_API_KEY`
    secret; the flow itself carries no secrets and no sample data.
    2. `budget_gate` (`io.kestra.plugin.core.flow.If`) reads only the real outputs
    of that call: total tokens, computed as input tokens plus output tokens from
    `tokenUsage`, and the tool-call count, computed from `toolExecutions`. Either
    figure above its cap takes the failing branch.
    3. `budget_exceeded` (`io.kestra.plugin.core.execution.Fail`) stops the
    execution with a message naming the actual token count, the actual tool-call
    count, and both caps. Nothing downstream runs.
    4. `deliver_answer` (`io.kestra.plugin.core.debug.Return`) runs only on the
    passing branch and returns the agent's `textOutput` unchanged.

    ## Prerequisites

    - A Google Gemini API key with access to `gemini-3.5-flash-lite`.
    - Kestra flows in a namespace the agent is allowed to call, if you want the
    tool-call budget to have something to count. With no callable flows, the
    agent answers directly and the tool-call count stays at zero.

    ### Secrets

    - `GEMINI_API_KEY`: API key used by the `GoogleGemini` provider (required).

    ## Quick start

    1. Add the `GEMINI_API_KEY` secret to your Kestra namespace.
    2. Import this blueprint and run it with the defaults: the agent answers the
    default prompt well inside a 20000 token cap and a 10 tool-call cap, and the
    answer is returned.
    3. Re-run with `max_total_tokens` set to 1: the gate fails with the real token
    count in the error message, and no answer is delivered. That is the
    enforcement path, exercised on a live call.
    4. Set both caps to your team's real per-call limits and wire the flow into
    any pipeline where an agent answer feeds a downstream step.

    ## How to adapt it

    - Swap `GoogleGemini` for another `io.kestra.plugin.ai.provider` such as
    OpenAI or Anthropic, and set the caps to that model's typical per-call cost.
    - Add a second agent task behind the gate for a retry with a cheaper model,
    instead of failing outright, by replacing the Fail task with a fallback call
    that runs only on the failing branch.
    - Record every gated call in a table or KV store for a per-team spend
    dashboard: the Fail branch already has the real token and tool-call counts.
    - Tighten the tool-call cap per use case: research agents that legitimately
    call many flows need a higher cap than answering agents that should call
    none.

  tags:
    - AI
  subTags:
    - Agents & Structured Output
  ee: false
  demo: false
  metaDescription: "Fail a live AI agent call the moment it blows its token or tool-call budget, before any downstream task sees the answer."
