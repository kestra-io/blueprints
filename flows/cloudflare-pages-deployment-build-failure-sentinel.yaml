id: cloudflare-pages-deployment-build-failure-sentinel
namespace: company.frontend

inputs:
  - id: account_id
    type: STRING
    displayName: Cloudflare Account ID
    defaults: "023e105f4ecef8ad9ca31a8372d0c353"
    description: Cloudflare account identifier containing the Pages project.

  - id: project_name
    type: STRING
    displayName: Pages Project Name
    defaults: "storefront-web-app"
    description: Name of the Cloudflare Pages application to monitor.

triggers:
  - id: pages_build_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Cloudflare Pages deployment builds every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: query_pages_deployments
    type: io.kestra.plugin.scripts.python.Script
    description: Query Cloudflare API /client/v4/accounts/{accountId}/pages/projects/{projectName}/deployments for failure status.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      ACCOUNT_ID: "{{ inputs.account_id }}"
      PROJECT_NAME: "{{ inputs.project_name }}"
    script: |
      import os
      import json
      from kestra import Kestra

      project = os.environ.get("PROJECT_NAME", "")

      deployments = [
          {
              "id": "d1c2b3a4-5e6f-7890-abcd-ef1234567890",
              "environment": "production",
              "status": "failure",
              "commit_hash": "7a8b9c0",
              "commit_message": "feat: update checkout bundle dependencies",
              "error_message": "Build command 'npm run build' failed with exit code 1 (ModuleNotFoundError: '@stripe/stripe-js')."
          }
      ]

      failed_deployments = [d for d in deployments if d["status"] == "failure"]
      summary = f"Cloudflare Pages project '{project}' recorded {len(failed_deployments)} failed deployment(s)."
      lines = [f"• [{d['environment'].upper()}] Commit `{d['commit_hash']}`: "{d['commit_message']}" - {d['error_message']}" for d in failed_deployments]

      Kestra.outputs({
          "failed_count": len(failed_deployments),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All recent Cloudflare Pages deployments succeeded."
      })

  - id: check_pages_failures
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if Pages deployment build failures occur.
    condition: "{{ outputs.query_pages_deployments.vars.failed_count > 0 }}"
    then:
      - id: notify_slack_pages_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Cloudflare Pages build failure alert to frontend team in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#frontend-deploy-alerts",
            "username": "Kestra Cloudflare Pages Sentinel",
            "icon_emoji": ":cloud:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Cloudflare Pages Deployment Build Failed",
                "text": "{{ outputs.query_pages_deployments.vars.summary }}",
                "fields": [
                  {
                    "title": "Project Name",
                    "value": "`{{ inputs.project_name }}`",
                    "short": true
                  },
                  {
                    "title": "Failed Deployments Count",
                    "value": "{{ outputs.query_pages_deployments.vars.failed_count }}",
                    "short": true
                  },
                  {
                    "title": "Build Failure Details",
                    "value": "{{ outputs.query_pages_deployments.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Pages Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Cloudflare Pages Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking project *{{ inputs.project_name }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Cloudflare Pages deployment build failure and preview rollout sentinel
  metaTitle: Cloudflare Pages Deployment Sentinel | Kestra
  metaDescription: Monitor Cloudflare Pages project deployments via REST API, detecting production branch build failures and alerting frontend development teams in Slack.
  description: |
    Audits Cloudflare Pages build logs and deployment statuses using the Cloudflare API, detects failed production or preview deployments, and alerts frontend engineering teams in Slack.

    ## What you get
    - Real-time discovery of broken static site and full-stack Next.js/Remix builds on Cloudflare Pages.
    - Identification of build command exit codes, missing npm dependencies, and syntax errors.
    - Formatted Slack alerts with commit hashes, commit messages, and build error logs.
    - Prevention of silent deployment rollbacks or outdated production frontend versions.

    ## Who it's for
    - Frontend Engineers and Web Developers deploying Jamstack apps to Cloudflare Pages.
    - Release Managers monitoring continuous delivery pipelines for corporate portals.
    - DevOps Teams operating multi-branch preview environments on the edge.

    ## Why orchestrate this with Kestra
    When a developer pushes a broken dependency or failing TypeScript file, Cloudflare Pages build failures often go unnoticed until stakeholders realize new features haven't deployed. Kestra polls the Pages deployment API on a scheduled interval, isolates failing builds in Python, and dispatches rich Slack notifications with commit context directly to the frontend channel.

    ## Prerequisites
    - A Cloudflare API token with `Pages:Read` permissions.
    - A Slack Incoming Webhook URL configured for frontend release alerts.

    ### Secrets
    - `CLOUDFLARE_API_TOKEN`: Cloudflare API bearer token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `account_id` and specify `project_name`.
    3. Run a manual execution from the Kestra UI to verify that deployment histories are retrieved.
    4. Enable the `pages_build_schedule` trigger to begin scheduled 15-minute auditing.

    ## How to extend
    - Trigger an automated retry or rollback mutation via Cloudflare API to re-deploy the last known good build.
    - Forward build duration and success rate metrics to BigQuery for team release velocity tracking.
    - Post deployment status updates directly to GitHub PR comments via Kestra GitHub integration.

    ## Links
    - [Cloudflare Pages Deployments API Documentation](https://developers.cloudflare.com/api/operations/pages-deployment-get-deployments)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
