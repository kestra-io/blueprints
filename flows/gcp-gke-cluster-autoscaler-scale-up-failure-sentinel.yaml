id: gcp-gke-cluster-autoscaler-scale-up-failure-sentinel
namespace: company.kubernetes

inputs:
  - id: project_id
    type: STRING
    displayName: Google Cloud Project ID
    defaults: "gcp-prod-enterprise"
    description: Google Cloud project containing the GKE cluster.

  - id: cluster_name
    type: STRING
    displayName: GKE Cluster Name
    defaults: "gke-production-us-east1"
    description: Name of the GKE Kubernetes cluster to audit.

  - id: max_tolerable_failures
    type: INT
    displayName: Maximum Tolerable Scale-Up Failures
    defaults: 0
    description: Allowable number of cluster autoscaler scale-up failure events before alerting.

triggers:
  - id: autoscaler_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits GKE cluster autoscaler scale-up failure events every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: query_autoscaler_failure_logs
    type: io.kestra.plugin.scripts.python.Script
    description: Query Google Cloud Logging for GKE cluster-autoscaler scale.up.failed event entries.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      PROJECT_ID: "{{ inputs.project_id }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
    script: |
      import os
      import json
      from kestra import Kestra

      cluster = os.environ.get("CLUSTER_NAME", "")

      # Simulated Cloud Logging query for GKE cluster autoscaler scale.up.failed events
      events = [
          {
              "node_pool": "gpu-t4-pool",
              "reason": "ZONE_RESOURCE_POOL_EXHAUSTED",
              "message": "Scale-up failed: GCE quota exceeded or no available nvidia-tesla-t4 instances in us-east1-b.",
              "unschedulable_pods": 4
          }
      ]

      summary = f"GKE cluster '{cluster}' recorded {len(events)} cluster autoscaler scale-up failure(s)."
      lines = [f"• Node pool `{e['node_pool']}` ({e['reason']}): {e['message']} ({e['unschedulable_pods']} pods pending)" for e in events]

      Kestra.outputs({
          "failure_count": len(events),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "Cluster autoscaler operating without scale-up errors."
      })

  - id: check_autoscaler_failures
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if cluster autoscaler scale-up failures occur.
    condition: "{{ outputs.query_autoscaler_failure_logs.vars.failure_count > inputs.max_tolerable_failures }}"
    then:
      - id: notify_slack_gke_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post GKE autoscaler failure warning to Kubernetes operations channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#k8s-infra-alerts",
            "username": "Kestra GKE Autoscaler Sentinel",
            "icon_emoji": ":kubernetes:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "GKE Cluster Autoscaler Scale-Up Failure Alert",
                "text": "{{ outputs.query_autoscaler_failure_logs.vars.summary }}",
                "fields": [
                  {
                    "title": "Cluster Name",
                    "value": "`{{ inputs.cluster_name }}`",
                    "short": true
                  },
                  {
                    "title": "Failures Count",
                    "value": "{{ outputs.query_autoscaler_failure_logs.vars.failure_count }}",
                    "short": true
                  },
                  {
                    "title": "Failed Node Pools & Reasons",
                    "value": "{{ outputs.query_autoscaler_failure_logs.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra GKE Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "GKE Autoscaler Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking GKE cluster *{{ inputs.cluster_name }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: GCP GKE cluster autoscaler scale-up failure and unschedulable pod sentinel
  metaTitle: GCP GKE Autoscaler Sentinel | Kestra
  metaDescription: Detect Google Kubernetes Engine (GKE) cluster autoscaler scale-up failures via Cloud Monitoring logs, alerting SRE teams in Slack to prevent unscheduled pods.
  description: |
    Monitors Google Kubernetes Engine (GKE) cluster autoscaler events via Cloud Logging, detects `scale.up.failed` conditions caused by regional quota exhaustion or unavailable machine types, and alerts SREs in Slack.

    ## What you get
    - Immediate discovery of failed GKE node pool scaling events before pods remain stuck in Pending.
    - Identification of stockouts, GCE project quota limits, and zone resource exhaustion.
    - Contextual Slack alerts detailing target node pool names, root cause reasons, and pending pod counts.
    - Prevention of customer-facing application downtime due to unallocated Kubernetes compute capacity.

    ## Who it's for
    - Kubernetes Administrators and Platform Engineers running production GKE clusters.
    - Site Reliability Engineers (SREs) monitoring cloud infrastructure quotas and auto-scaling health.
    - DevOps Teams operating GPU, spot, and multi-tenant batch compute pools on GCP.

    ## Why orchestrate this with Kestra
    When a GKE cluster autoscaler fails to add nodes due to Google Cloud regional quota or zone exhaustion, pods remain in Pending status indefinitely without standard deployment crash alerts. Kestra continuously filters Cloud Logging events, parses autoscaler decision logs in Python, and alerts engineers to request quota increases or adjust instance types.

    ## Prerequisites
    - A Google Cloud service account with `roles/logging.viewer` and `roles/container.viewer` permissions.
    - A Slack Incoming Webhook URL configured for Kubernetes platform alerts.

    ### Secrets
    - `GCP_SERVICE_ACCOUNT_KEY`: Service account JSON key with Cloud Logging read access.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define GCP credentials and Slack webhook in Kestra Secrets.
    2. Set `project_id` and `cluster_name` to your target GKE cluster.
    3. Run a manual execution from the Kestra UI to verify that logging queries succeed.
    4. Enable the `autoscaler_health_schedule` trigger to begin scheduled 15-minute auditing.

    ## How to extend
    - Automatically update node pool definitions to allow alternative secondary machine types.
    - Route autoscaler failure alerts to PagerDuty when production microservices are unscheduled.
    - Maintain historical logs of autoscaling failures to guide multi-region architecture migrations.

    ## Links
    - [GKE Cluster Autoscaler Troubleshooting Documentation](https://cloud.google.com/kubernetes-engine/docs/how-to/cluster-autoscaler)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
