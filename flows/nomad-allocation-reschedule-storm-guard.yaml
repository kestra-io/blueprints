id: nomad-allocation-reschedule-storm-guard
namespace: company.nomad
concurrency:
  limit: 1
inputs:
- id: nomad_addr
  displayName: Nomad API Address
  type: STRING
  defaults: http://localhost:4646
  description: Base URL of the HashiCorp Nomad server cluster API endpoint.
- id: max_reschedules_threshold
  displayName: Max Reschedules Threshold
  type: INT
  defaults: 10
  description: Maximum allowable reschedule events across jobs within the evaluation
    window.
- id: evaluation_window_minutes
  displayName: Evaluation Window (Minutes)
  type: INT
  defaults: 15
  description: Time window in minutes to inspect allocation lifecycle reschedule events.
- id: slack_channel
  displayName: Slack Channel
  type: STRING
  defaults: '#sre-orchestration-alerts'
  description: Slack channel destination for workload orchestration incident notifications.
triggers:
- id: audit_nomad_allocations
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/10 * * * *'
  description: Periodic health probe monitoring Nomad allocation churn every ten minutes.
  disabled: true
tasks:
- id: scan_rescheduled_allocations
  type: io.kestra.plugin.scripts.python.Script
  containerImage: python:3.11-slim
  beforeCommands:
  - pip install requests kestra
  description: Queries the Nomad Allocations API to detect rapid rescheduling bursts
    and flapping tasks.
  script: "import json\nimport os\nimport sys\nimport requests\nfrom kestra import\
    \ Kestra\n\nnomad_addr = os.environ.get(\"NOMAD_ADDR\", \"http://localhost:4646\"\
    )\nthreshold = int(os.environ.get(\"MAX_RESCHEDULES_THRESHOLD\", 10))\nwindow_minutes\
    \ = int(os.environ.get(\"EVALUATION_WINDOW_MINUTES\", 15))\n\nurl = f\"{nomad_addr.rstrip('/')}/v1/allocations?filter=ClientStatus%20%3D%3D%20%22failed%22%20or%20DesiredStatus%20%3D%3D%20%22run%22\"\
    \nflapping_allocs = []\n\ntry:\n    response = requests.get(url, timeout=10)\n\
    \    response.raise_for_status()\n    allocations = response.json()\nexcept Exception\
    \ as err:\n    sys.stderr.write(f\"Error querying live Nomad API at {url}: {err}\\\
    n\")\n    sys.exit(1)\n\nfor alloc in allocations:\n    reschedule_tracker = alloc.get(\"\
    RescheduleTracker\", {})\n    events = reschedule_tracker.get(\"Events\", [])\n\
    \    if len(events) >= 2 or alloc.get(\"ClientStatus\") == \"failed\":\n     \
    \   flapping_allocs.append({\n            \"alloc_id\": alloc.get(\"ID\", \"\"\
    )[:8],\n            \"job_id\": alloc.get(\"JobID\"),\n            \"task_group\"\
    : alloc.get(\"TaskGroup\"),\n            \"node_name\": alloc.get(\"NodeName\"\
    ),\n            \"reschedule_count\": len(events)\n        })\n\ntotal_reschedules\
    \ = sum(a[\"reschedule_count\"] for a in flapping_allocs)\nhas_reschedule_storm\
    \ = total_reschedules >= threshold or len(flapping_allocs) >= 5\ntop_job = flapping_allocs[0][\"\
    job_id\"] if flapping_allocs else \"None\"\ntop_node = flapping_allocs[0][\"node_name\"\
    ] if flapping_allocs else \"None\"\n\nreport = {\n    \"total_flapping_allocations\"\
    : len(flapping_allocs),\n    \"total_reschedules\": total_reschedules,\n    \"\
    has_reschedule_storm\": has_reschedule_storm,\n    \"flapping_allocations\": flapping_allocs\n\
    }\n\nwith open(\"nomad_reschedule_audit.json\", \"w\") as f:\n    json.dump(report,\
    \ f, indent=2)\n\nKestra.outputs({\n    \"has_reschedule_storm\": has_reschedule_storm,\n\
    \    \"total_reschedules\": total_reschedules,\n    \"flapping_count\": len(flapping_allocs),\n\
    \    \"top_job\": top_job,\n    \"top_node\": top_node\n})\n"
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  env:
    NOMAD_ADDR: '{{ inputs.nomad_addr }}'
    MAX_RESCHEDULES_THRESHOLD: '{{ inputs.max_reschedules_threshold }}'
    EVALUATION_WINDOW_MINUTES: '{{ inputs.evaluation_window_minutes }}'
- id: evaluate_reschedule_storm
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.scan_rescheduled_allocations.vars.has_reschedule_storm }}'
  description: Branches workflow execution based on whether allocation reschedule
    velocity indicates a flapping storm.
  then:
  - id: notify_slack_nomad_storm
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: '{{ secret(''SLACK_WEBHOOK_URL'') }}'
    description: Alerts SRE and platform teams on Slack when task allocation storms
      impact cluster capacity.
    payload: "{\n  \"channel\": \"{{ inputs.slack_channel }}\",\n  \"text\": \"CRITICAL:\
      \ HashiCorp Nomad Allocation Reschedule Storm detected! {{ outputs.scan_rescheduled_allocations.vars.total_reschedules\
      \ }} reschedules across {{ outputs.scan_rescheduled_allocations.vars.flapping_count\
      \ }} allocations. Most affected job: '{{ outputs.scan_rescheduled_allocations.vars.top_job\
      \ }}' on client node '{{ outputs.scan_rescheduled_allocations.vars.top_node\
      \ }}'. Immediate triage: inspect task logs using `nomad alloc logs {{ outputs.scan_rescheduled_allocations.vars.top_job\
      \ }}` or pause job via `nomad job stop -detach`.\"\n}\n"
  else:
  - id: log_healthy_nomad_cluster
    type: io.kestra.plugin.core.log.Log
    description: Records healthy orchestration state when task restart velocity remains
      within normal limits.
    message: 'Nomad workload orchestration state is nominal. Reschedule count: {{
      outputs.scan_rescheduled_allocations.vars.total_reschedules }} within {{ inputs.evaluation_window_minutes
      }}m window.'
- id: export_nomad_reschedule_manifest
  type: io.kestra.plugin.core.debug.Return
  description: Emits structured telemetry summary capturing cluster allocation stability.
  format: "{\n  \"pipeline\": \"nomad-allocation-reschedule-storm-guard\",\n  \"audited_at\"\
    : \"{{ execution.startDate }}\",\n  \"total_reschedules\": {{ outputs.scan_rescheduled_allocations.vars.total_reschedules\
    \ }},\n  \"flapping_allocations\": {{ outputs.scan_rescheduled_allocations.vars.flapping_count\
    \ }},\n  \"status\": \"{{ outputs.scan_rescheduled_allocations.vars.has_reschedule_storm\
    \ ? 'STORM_DETECTED' : 'HEALTHY' }}\"\n}\n"
extend:
  shortDescription: Monitors HashiCorp Nomad allocation reschedule loops across client
    nodes, alerting SREs on container churn.
  title: Nomad Allocation Reschedule Storm Guard
  metaTitle: Nomad Allocation Reschedule Storm Guard | Kestra Blueprint
  metaDescription: Monitors HashiCorp Nomad client allocations for rapid reschedule
    loops, detecting crashing jobs and alerting SRE teams on Slack.
  description: "In distributed workload environments running HashiCorp Nomad, misconfigured\
    \ batch jobs, failing container health checks, or node out-of-memory (OOM) evictions\
    \ can cause task allocations to enter continuous restart loops.\n\nWhen Nomad's\
    \ `reschedule` stanza is configured with aggressive backoff parameters without\
    \ maximum retry ceilings, the Nomad scheduler repeatedly relocates failing allocations\
    \ across client nodes in rapid succession. This behavior creates an allocation\
    \ reschedule storm: client nodes spend excessive CPU cycles pulling Docker images,\
    \ mounting volumes, and allocating ephemeral ports, quickly exhausting host compute\
    \ capacity and degrading co-located production workloads.\n\nThis blueprint provides\
    \ an automated orchestration safety guard. Running on a recurrent ten-minute schedule,\
    \ it interrogates the Nomad Allocations API, counts recent reschedule events and\
    \ task failure frequencies, evaluates metrics against safe thresholds, and notifies\
    \ SRE on-call engineers via Slack with exact diagnostic commands.\n\n## How it\
    \ works\n\n1. **Recurrent Pulse Trigger**: The `audit_nomad_allocations` trigger\
    \ (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every ten minutes.\n\
    2. **Nomad API Inspection**: The `scan_rescheduled_allocations` task (`io.kestra.plugin.scripts.python.Script`)\
    \ queries `/v1/allocations`, parsing `RescheduleTracker` events and identifying\
    \ tasks undergoing repeated restart cycles.\n3. **Threshold Gate**: The `evaluate_reschedule_storm`\
    \ flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether total reschedule\
    \ bursts or flapping allocations exceed safe limits.\n4. **Slack Incident Alert**:\
    \ When a reschedule storm is confirmed, `notify_slack_nomad_storm` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`)\
    \ delivers an actionable incident card detailing the top failing job, client node,\
    \ and exact CLI diagnostic commands (`nomad alloc logs`, `nomad job stop`).\n\
    5. **Healthy Confirmation**: When reschedule rates remain minimal, `log_healthy_nomad_cluster`\
    \ logs nominal cluster stability.\n6. **Manifest Export**: The `export_nomad_reschedule_manifest`\
    \ task records execution state for platform telemetry archives.\n\n## Architecture\
    \ diagram\n\n```mermaid\nflowchart TD\n    A[Schedule: Every 10 Minutes] --> B[scan_rescheduled_allocations:\
    \ Nomad Allocations API]\n    B --> C{Reschedule Storm Detected?}\n    C -- Yes\
    \ --> D[notify_slack_nomad_storm: Slack Webhook]\n    C -- No --> E[log_healthy_nomad_cluster:\
    \ Log]\n    D --> F[export_nomad_reschedule_manifest: Return JSON]\n    E -->\
    \ F\n```\n\n## Use cases\n\n- **Flapping Container Detection**: Detect applications\
    \ crashing immediately upon initialization before they consume cluster-wide ephemeral\
    \ disk or port allocations.\n- **Noisy Neighbor Protection**: Prevent a single\
    \ broken task definition from consuming scheduler evaluations and degrading healthy\
    \ production jobs.\n- **Pre-Production Release Validation**: Automatically catch\
    \ canary deployments with broken database credentials or missing environment variables\
    \ causing instant termination.\n\n## Inputs\n\n| Name | Type | Default | Description\
    \ |\n| :--- | :--- | :--- | :--- |\n| `nomad_addr` | STRING | `\"http://localhost:4646\"\
    ` | Base URL of the HashiCorp Nomad server cluster API endpoint. |\n| `max_reschedules_threshold`\
    \ | INT | `10` | Maximum allowable reschedule events across jobs within the window.\
    \ |\n| `evaluation_window_minutes` | INT | `15` | Time window in minutes to inspect\
    \ allocation lifecycle reschedule events. |\n| `slack_channel` | STRING | `\"\
    #sre-orchestration-alerts\"` | Slack channel destination for workload orchestration\
    \ incident notifications. |\n\n## Expected outputs\n\n- `{{ outputs.scan_rescheduled_allocations.vars.has_reschedule_storm\
    \ }}`: Boolean flag indicating if an active reschedule storm exists.\n- `{{ outputs.scan_rescheduled_allocations.vars.total_reschedules\
    \ }}`: Total count of allocation reschedule events detected.\n- `{{ outputs.scan_rescheduled_allocations.vars.flapping_count\
    \ }}`: Number of distinct allocations undergoing flapping behavior.\n- `{{ outputs.scan_rescheduled_allocations.vars.top_job\
    \ }}`: Name of the job experiencing the highest restart volume.\n- `{{ outputs.scan_rescheduled_allocations.outputFiles['nomad_reschedule_audit.json']\
    \ }}`: Complete JSON diagnostic report.\n\n## Prerequisites\n\n- Reachable HashiCorp\
    \ Nomad server or client endpoint with HTTP API enabled.\n- Incoming Webhook URL\
    \ configured for your Slack SRE alerting channel.\n\n### Secrets\n\n- `SLACK_WEBHOOK_URL`:\
    \ Slack Incoming Webhook endpoint URL with permissions to post messages.\n\n##\
    \ Quick start\n\n1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.\n\
    2. Import this flow YAML into your Kestra workspace.\n3. Update `nomad_addr` with\
    \ your cluster URL (e.g., `https://nomad.prod.internal:4646`).\n4. Execute the\
    \ flow manually from the Kestra UI to run an initial cluster stability audit.\n\
    \n## Common pitfalls and troubleshooting\n\n- **Nomad ACL Tokens**: In secured\
    \ clusters with Nomad ACLs enabled, pass the management or reader token via the\
    \ `X-Nomad-Token` HTTP header in requests.\n- **Dead Allocations vs Active Flapping**:\
    \ Nomad retains dead allocations for garbage collection (`job.trash_after`); ensure\
    \ your query filter targets recent events rather than historical completed jobs.\n\
    \n## How to extend\n\n- Add automated job suspension using `PUT /v1/job/<job-id>/pause`\
    \ to quarantine flapping jobs automatically during severe storms.\n- Integrate\
    \ with PagerDuty for critical alerting when cluster capacity decreases by more\
    \ than 20%.\n- Forward allocation failure logs directly to Elasticsearch or Loki\
    \ for automated root-cause clustering.\n\n## Links\n\n- Kestra Python Script Documentation:\
    \ https://kestra.io/plugins/plugin-scripts-python\n- Kestra Slack Plugin Documentation:\
    \ https://kestra.io/plugins/plugin-notifications\n- HashiCorp Nomad Allocations\
    \ API Documentation: https://developer.hashicorp.com/nomad/api-docs/allocations\n"
  tags:
  - Infrastructure
  - Core
  subTags:
  - Infrastructure Automation
  - Incident Response
  ee: false
  demo: false
outputs:
- id: has_reschedule_storm
  type: BOOLEAN
  value: '{{ outputs.scan_rescheduled_allocations.vars.has_reschedule_storm }}'
- id: total_reschedules
  type: INT
  value: '{{ outputs.scan_rescheduled_allocations.vars.total_reschedules }}'
- id: flapping_count
  type: INT
  value: '{{ outputs.scan_rescheduled_allocations.vars.flapping_count }}'
- id: top_job
  type: STRING
  value: '{{ outputs.scan_rescheduled_allocations.vars.top_job }}'
- id: top_node
  type: STRING
  value: '{{ outputs.scan_rescheduled_allocations.vars.top_node }}'
