id: gbif-biodiversity-occurrences-lakehouse-loader
namespace: company.analytics
description: Ingests natural history specimen records, taxonomic kingdoms, and scientific observation data from GBIF API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: gbif-biodiversity-occurrences-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://api.gbif.org/v1/occurrence/search?limit=50"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "results"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for item in items:
            gid = str(item.get('key', 'UNKNOWN'))
            current_ids.append(gid)
            sname = item.get('scientificName', 'Unknown')
            kingdom = item.get('kingdom', 'Unknown')
            ccode = item.get('countryCode', 'Unknown')
            basis = item.get('basisOfRecord', 'Unknown')

            records.append({
                'occurrence_id': gid,
                'scientific_name': str(sname),
                'kingdom': str(kingdom),
                'country_code': str(ccode),
                'basis_of_record': str(basis),
                'is_new': bool(gid not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE gbif_occurrences (
                occurrence_id VARCHAR,
                scientific_name VARCHAR,
                kingdom VARCHAR,
                country_code VARCHAR,
                basis_of_record VARCHAR,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO gbif_occurrences SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY gbif_occurrences TO 'gbif_occurrences.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    kingdom,
                    basis_of_record,
                    COUNT(*) AS occurrence_count
                FROM gbif_occurrences
                GROUP BY 1, 2
                ORDER BY occurrence_count DESC
            ) TO 'occurrences_by_kingdom.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM gbif_occurrences WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM gbif_occurrences").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - gbif_occurrences.parquet
      - occurrences_by_kingdom.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['gbif_occurrences.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "GBIF Biodiversity Occurrences sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
