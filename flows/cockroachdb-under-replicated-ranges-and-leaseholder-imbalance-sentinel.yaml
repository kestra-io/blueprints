    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CockroachDB Official Documentation and Architecture Guide](https://www.cockroachlabs.com/docs/stable/)
    - [Monitoring CockroachDB with Prometheus and Metrics Reference](https://www.cockroachlabs.com/docs/stable/monitoring-and-alerting)
    - [Troubleshooting Range Replication and Cluster Health in CockroachDB](https://www.cockroachlabs.com/docs/stable/cluster-setup-troubleshooting)
