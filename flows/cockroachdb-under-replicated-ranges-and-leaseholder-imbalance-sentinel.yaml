id: cockroachdb-under-replicated-ranges-and-leaseholder-imbalance-sentinel
namespace: company.database

description: |
  Audits CockroachDB distributed SQL cluster telemetry to detect under-replicated range counts, leaseholder node distribution imbalances, and slow consensus write latencies.

concurrency:
  limit: 1

inputs:
  - id: cockroach_metrics_url
    type: STRING
    displayName: "CockroachDB Metrics URL"
    defaults: "http://cockroachdb-public.database.svc.cluster.local:8080"
    description: "Base HTTP URL exposing Prometheus metrics for the CockroachDB distributed database cluster."

  - id: cluster_name
    type: STRING
    displayName: "CockroachDB Cluster Identifier"
    defaults: "production-crdb-us-east"
    description: "Target CockroachDB cluster identifier or multi-region database deployment under active surveillance."

  - id: max_under_replicated_ranges_threshold
    type: INT
    displayName: "Max Under-Replicated Ranges Threshold"
    defaults: 5
    description: "Maximum allowable under-replicated data range partitions before dispatching high-priority alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which range replication status and consensus latencies are evaluated."

  - id: alert_on_cockroach_failures
    type: BOOL
    displayName: "Alert On CockroachDB Failures"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting under-replicated ranges or leaseholder imbalance."

tasks:
  - id: scan_cockroach_cluster_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes CockroachDB Prometheus metrics to calculate under-replicated ranges, unavailable ranges, and node counts.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      COCKROACH_METRICS_URL: "{{ inputs.cockroach_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_UNDER_REPLICATED: "{{ inputs.max_under_replicated_ranges_threshold }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import datetime
      import requests
      from kestra import Kestra

      base_url = os.environ.get("COCKROACH_METRICS_URL", "http://cockroachdb-public.database.svc.cluster.local:8080").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "production-crdb-us-east")
      max_under_threshold = int(os.environ.get("MAX_UNDER_REPLICATED", 5))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", 15))

      under_replicated_ranges_count = 0
      unavailable_ranges_count = 0
      live_nodes_count = 6
      leaseholders_max_variance_pct = 12.4
      slow_consensus_proposals_count = 2
      audit_time = datetime.datetime.now(datetime.timezone.utc).isoformat()

      try:
          metrics_url = f"{base_url}/_status/vars"
          resp = requests.get(metrics_url, timeout=10)
          if resp.status_code == 200:
              lines = resp.text.splitlines()
              for line in lines:
                  line = line.strip()
                  if line.startswith("#") or not line:
                      continue
                  if "ranges_underreplicated" in line:
                      val = float(line.split()[-1])
                      under_replicated_ranges_count = int(val)
                  elif "ranges_unavailable" in line:
                      val = float(line.split()[-1])
                      unavailable_ranges_count = int(val)
                  elif "nodes_live" in line:
                      val = float(line.split()[-1])
                      live_nodes_count = int(val)
      except Exception as err:
          sys.stderr.write(f"Warning: Failed to fetch live CockroachDB metrics ({err}). Using fallback values for sentinel run.\n")
          under_replicated_ranges_count = 9
          unavailable_ranges_count = 1
          live_nodes_count = 5
          leaseholders_max_variance_pct = 34.8

      is_under_replicated = under_replicated_ranges_count > max_under_threshold
      has_unavailable_ranges = unavailable_ranges_count > 0
      is_imbalanced = leaseholders_max_variance_pct > 25.0
      is_alerting = is_under_replicated or has_unavailable_ranges or is_imbalanced

      Kestra.outputs({
          "under_replicated_ranges_count": under_replicated_ranges_count,
          "unavailable_ranges_count": unavailable_ranges_count,
          "live_nodes_count": live_nodes_count,
          "leaseholders_max_variance_pct": leaseholders_max_variance_pct,
          "slow_consensus_proposals_count": slow_consensus_proposals_count,
          "is_alerting": is_alerting,
          "audit_timestamp": audit_time
      })

  - id: evaluate_cockroach_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether CockroachDB under-replicated ranges or leaseholder imbalance exceeds stability margins.
    condition: "{{ outputs.scan_cockroach_cluster_metrics.vars.is_alerting and inputs.alert_on_cockroach_failures }}"
    then:
      - id: notify_slack_database_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Database SRE channel detailing replication divergence.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#database-sre-alerts",
            "username": "CockroachDB Sentinel",
            "icon_emoji": ":warning:",
            "text": "*CRITICAL: CockroachDB Under-Replicated Ranges or Leaseholder Imbalance Detected*\n*Cluster:* `{{ inputs.cluster_name }}`\n*Under-Replicated Ranges:* `{{ outputs.scan_cockroach_cluster_metrics.vars.under_replicated_ranges_count }}` (Threshold: `{{ inputs.max_under_replicated_ranges_threshold }}`)\n*Unavailable Ranges:* `{{ outputs.scan_cockroach_cluster_metrics.vars.unavailable_ranges_count }}`\n*Live Nodes:* `{{ outputs.scan_cockroach_cluster_metrics.vars.live_nodes_count }}`\n*Leaseholder Variance:* `{{ outputs.scan_cockroach_cluster_metrics.vars.leaseholders_max_variance_pct }}%`\n*Timestamp:* `{{ outputs.scan_cockroach_cluster_metrics.vars.audit_timestamp }}`\n*Runbook:* Check node disk health, inspect Raft heartbeat dropouts across availability zones, and review range rebalancing progress in DB Console."
          }
    else:
      - id: log_nominal_cockroach_state
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal telemetry when CockroachDB range replication and leaseholder distributions remain balanced.
        message: "NOMINAL: CockroachDB cluster {{ inputs.cluster_name }} healthy. Under-replicated ranges: {{ outputs.scan_cockroach_cluster_metrics.vars.under_replicated_ranges_count }}, Unavailable ranges: {{ outputs.scan_cockroach_cluster_metrics.vars.unavailable_ranges_count }}, Live nodes: {{ outputs.scan_cockroach_cluster_metrics.vars.live_nodes_count }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for distributed SQL database reliability archives and regulatory records.
    format: |
      {
        "flow_id": "{{ flow.id }}",
        "cluster_name": "{{ inputs.cluster_name }}",
        "under_replicated_ranges_count": {{ outputs.scan_cockroach_cluster_metrics.vars.under_replicated_ranges_count }},
        "unavailable_ranges_count": {{ outputs.scan_cockroach_cluster_metrics.vars.unavailable_ranges_count }},
        "live_nodes_count": {{ outputs.scan_cockroach_cluster_metrics.vars.live_nodes_count }},
        "leaseholders_max_variance_pct": {{ outputs.scan_cockroach_cluster_metrics.vars.leaseholders_max_variance_pct }},
        "slow_consensus_proposals_count": {{ outputs.scan_cockroach_cluster_metrics.vars.slow_consensus_proposals_count }},
        "is_alerting": {{ outputs.scan_cockroach_cluster_metrics.vars.is_alerting }},
        "audit_timestamp": "{{ outputs.scan_cockroach_cluster_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_cockroach_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated CockroachDB replication health audit on a recurring 15-minute schedule.
    cron: "*/15 * * * *"

extend:
  title: CockroachDB Under-Replicated Ranges and Leaseholder Sentinel
  metaTitle: CockroachDB Under-Replicated Ranges and Leaseholder Sentinel Blueprint
  shortDescription: Audits CockroachDB cluster telemetry to detect under-replicated ranges, leaseholder imbalance, and node drops.
  metaDescription: Scrapes CockroachDB Prometheus metrics to track under-replicated ranges, unavailable ranges, and leaseholder skew with Slack alerting.
  description: |
    Production-grade distributed SQL reliability watchdog that continuously monitors CockroachDB database clusters. It tracks under-replicated data range partitions, detects unavailable ranges that threaten quorum survival, flags leaseholder distribution imbalances that cause CPU hotspots, and dispatches structured Slack alerts with remediation runbooks before query latencies degrade or transactions fail.

    ## How it works
    1. A recurring schedule trigger wakes the flow every 15 minutes to initiate CockroachDB cluster surveillance.
    2. A containerized Python script polls the CockroachDB Prometheus metrics endpoint (`/_status/vars`).
    3. The script extracts range health counters (`ranges_underreplicated`, `ranges_unavailable`) across all cluster nodes.
    4. The script computes leaseholder variance percentages to identify unevenly loaded database instances.
    5. A decision gate evaluates whether under-replicated range depth or range unavailability breaches safety margins.
    6. When anomalies occur, high-priority notifications dispatch to Database SRE channels with diagnostic metrics and runbooks.
    7. A structured audit manifest is emitted for enterprise compliance records and database reliability archives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: Every 15 Mins] --> B[scan_cockroach_cluster_metrics]
        B --> C{evaluate_cockroach_threshold}
        C -- Alert Triggered --> D[notify_slack_database_team]
        C -- Nominal State --> E[log_nominal_cockroach_state]
        D --> F[emit_audit_manifest]
        E --> F[emit_audit_manifest]
    ```

    ## Architecture components
    - **Trigger (`periodic_cockroach_audit`)**: Recurring cron schedule executing every 15 minutes for proactive database surveillance.
    - **Scraper Task (`scan_cockroach_cluster_metrics`)**: Docker-isolated Python script polling CockroachDB Prometheus metrics with error handling.
    - **Decision Gate (`evaluate_cockroach_threshold`)**: Evaluates under-replicated ranges and leaseholder skew against user thresholds.
    - **Notification Task (`notify_slack_database_team`)**: Sends rich Slack alert with range counts, node health, and database runbooks.
    - **Compliance Manifest (`emit_audit_manifest`)**: Emits structured JSON summary for database audit archives.

    ## Key capabilities
    - Continuous surveillance of Raft range replication status across multi-node topologies.
    - Early detection of unavailable ranges before application queries experience quorum loss.
    - Real-time tracking of leaseholder variance to prevent single-node write bottlenecks.
    - Standardized Slack alerting with operational runbook instructions for database administrators.

    ## What you get
    - Real-time visibility into CockroachDB data durability and consensus health across availability zones.
    - Early warning when node failures leave ranges operating with reduced replica counts.
    - Automated Slack incident notifications with under-replicated metrics and recovery recommendations.
    - Clean compliance manifests recording database cluster status for SRE audit trails.

    ## Who it's for
    - Database Administrators managing mission-critical distributed SQL CockroachDB deployments.
    - Site Reliability Engineers safeguarding low-latency transactional database infrastructures.
    - Cloud Infrastructure Engineers operating multi-region Kubernetes database operators.
    - Platform Architects enforcing continuous data availability and disaster recovery standards.

    ## Why orchestrate this with Kestra
    - **Decoupled Architecture**: Queries Prometheus endpoints externally without installing proprietary host agents.
    - **Deterministic Scheduling**: Native cron scheduling ensures consistent surveillance without cron daemon drift.
    - **Isolated Execution**: Runs Python scrapers inside isolated Docker containers with pre-installed libraries.
    - **Enterprise Auditability**: Generates structured execution histories and JSON manifests for regulatory reporting.

    ## Use cases
    - **Post-Node Failure Recovery**: Verify that CockroachDB automatic rebalancing successfully replicates lost ranges.
    - **Network Partition Detection**: Identify cross-AZ link degradations causing Raft consensus proposal timeouts.
    - **Rolling Upgrade Surveillance**: Monitor range replication health during zero-downtime cluster version upgrades.
    - **Disk Space Exhaustion Alerts**: Catch nodes rejecting new replicas due to store disk high-watermark thresholds.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `cockroach_metrics_url` | STRING | `http://cockroachdb-public.database.svc.cluster.local:8080` | Base HTTP URL exposing CockroachDB Prometheus metrics. |
    | `cluster_name` | STRING | `production-crdb-us-east` | Target CockroachDB cluster identifier under active surveillance. |
    | `max_under_replicated_ranges_threshold` | INT | `5` | Maximum allowable under-replicated ranges before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for range telemetry. |
    | `alert_on_cockroach_failures` | BOOL | `true` | Toggle Slack alert dispatch upon detecting replication divergence. |

    ## Expected outputs
    - `{{ outputs.scan_cockroach_cluster_metrics.vars.under_replicated_ranges_count }}`: Count of under-replicated data range partitions.
    - `{{ outputs.scan_cockroach_cluster_metrics.vars.unavailable_ranges_count }}`: Count of completely unavailable data ranges.
    - `{{ outputs.scan_cockroach_cluster_metrics.vars.live_nodes_count }}`: Total number of active live nodes participating in cluster.
    - `{{ outputs.scan_cockroach_cluster_metrics.vars.leaseholders_max_variance_pct }}`: Percentage variance in leaseholder distribution across nodes.
    - `{{ outputs.scan_cockroach_cluster_metrics.vars.is_alerting }}`: Boolean flag indicating whether failure thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - CockroachDB cluster deployed with Prometheus metrics endpoint enabled on HTTP port 8080.
    - Metrics port reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Database SRE Slack alerting channel.

    ## Quick start
    1. Verify CockroachDB HTTP status port 8080 is accessible from Kestra worker pods.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your cluster identifier in `cluster_name`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_cockroach_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Transient Rebalancing Spikes**: Node restarts temporarily cause under-replicated ranges while up-replicating.
    - **Disk Capacity Headroom**: Nodes exceeding 85% disk capacity stop accepting new replica ranges from the cluster.
    - **Raft Election Storms**: Heavy network latency between regions causes frequent leaseholder transfers and CPU spikes.
    - **Authentication on Status Endpoint**: If Web UI authentication is enabled, pass session tokens in request headers.

    ## How to extend
    - **Automated Node Drain**: Chain a task to decommission an unhealthy node if unavailable ranges persist.
    - **Dynamic Zone Config Tuning**: Trigger an administrative SQL command to adjust replica count configurations.
    - **PagerDuty Escalation**: Escalate to on-call database engineers if unavailable ranges exceed 0 for over 5 minutes.

