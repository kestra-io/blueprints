id: clinicaltrials-gov-biomedical-studies-lakehouse-loader
namespace: company.analytics
description: Ingests clinical research protocols, trial status, and intervention metrics from ClinicalTrials.gov API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: page_size
    type: INT
    description: Number of clinical study protocols to retrieve per sync run.
    defaults: 50

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed clinical trials state.
    defaults: clinicaltrials_sync_watermark_state

variables:
  default_state: "[]"

triggers:
  - id: weekly_trial_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_trials
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://clinicaltrials.gov/api/v2/studies"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}
        params = {"pageSize": {{ inputs.page_size }}, "countTotal": "true"}

        resp = requests.get(url, headers=headers, params=params, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        studies = data.get("studies", [])

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_nct_ids = []

        for s in studies:
            protocol = s.get("protocolSection", {})
            id_module = protocol.get("identificationModule", {})
            status_module = protocol.get("statusModule", {})
            design_module = protocol.get("designModule", {})
            sponsor_module = protocol.get("sponsorCollaboratorsModule", {})
            lead_sponsor = sponsor_module.get("leadSponsor", {})

            phases = design_module.get("phases", ["NA"])
            primary_phase = phases[0] if phases else "NA"

            nct_id = id_module.get("nctId", "UNKNOWN")
            current_nct_ids.append(nct_id)
            brief_title = id_module.get("briefTitle", "No title provided")
            overall_status = status_module.get("overallStatus", "UNKNOWN")
            start_date = status_module.get("startDateStruct", {}).get("date", "UNKNOWN")
            completion_date = status_module.get("completionDateStruct", {}).get("date", "UNKNOWN")
            lead_sponsor_name = lead_sponsor.get("name", "Independent")

            records.append({
                "nct_id": str(nct_id),
                "brief_title": str(brief_title),
                "overall_status": str(overall_status),
                "primary_phase": str(primary_phase),
                "lead_sponsor": str(lead_sponsor_name),
                "start_date": str(start_date),
                "completion_date": str(completion_date),
                "is_new": bool(nct_id not in seen_ids),
                "ingestion_timestamp": now_iso
            })

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE clinical_trials (
                nct_id VARCHAR,
                brief_title VARCHAR,
                overall_status VARCHAR,
                primary_phase VARCHAR,
                lead_sponsor VARCHAR,
                start_date VARCHAR,
                completion_date VARCHAR,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO clinical_trials SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY clinical_trials TO 'clinical_trials.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    primary_phase,
                    overall_status,
                    COUNT(*) AS trial_count
                FROM clinical_trials
                GROUP BY 1, 2
                ORDER BY trial_count DESC
            ) TO 'trials_summary_by_phase.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM clinical_trials WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM clinical_trials").fetchone()[0]

        updated_ids = list(seen_ids.union(current_nct_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_trials": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} trials ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - clinical_trials.parquet
      - trials_summary_by_phase.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform_trials.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_trials.outputFiles['clinical_trials.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "ClinicalTrials.gov sync succeeded. Metrics: {{ read(outputs.ingest_and_transform_trials.outputFiles['metrics.json']) }}"
