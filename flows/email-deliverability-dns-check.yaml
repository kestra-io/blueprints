id: email-deliverability-dns-check
namespace: company.team
description: |
  Verify SPF, DKIM selector, and DMARC records for a sending domain, and alert
  Slack when any of them is missing or broken - before the quarterly outage.

triggers:
  - id: weekly_mail_dns_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly check so a DNS edit never silently kills deliverability.
    cron: "0 6 * * 2"
    disabled: true

inputs:
  - id: domain
    type: STRING
    defaults: "example.com"
    description: Sending domain to check.
  - id: dkim_selector
    type: STRING
    defaults: "default"
    description: Selector to probe for the DKIM TXT record.

tasks:
  - id: check_records
    type: io.kestra.plugin.scripts.shell.Commands
    description: dig TXT at the apex (SPF, DMARC) and at the selector (DKIM), then emit booleans via the stdout outputs protocol. Lookup failure reports missing so it cannot read as healthy.
    containerImage: alpine:3.20
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        apk add --no-cache bind-tools python3 >/dev/null 2>&1
        cat > check.py <<'PYEOF'
        import os, json, subprocess
        domain = os.environ.get("DOMAIN", "example.com")
        selector = os.environ.get("SELECTOR", "default")
        def txt(name):
            try:
                out = subprocess.run(["dig", "+short", "TXT", name], capture_output=True, text=True, timeout=20).stdout.lower()
                return out
            except Exception:
                return ""
        apex = txt(domain)
        dmarc = txt(f"_dmarc.{domain}")
        dkim = txt(f"{selector}._domainkey.{domain}")
        spf = "v=spf1" in apex
        dmarc_ok = "v=dmarc1" in dmarc
        dkim_ok = "v=dkim1" in dkim or "p=" in dkim
        missing = [n for n, ok in [("SPF", spf), ("DMARC", dmarc_ok), ("DKIM", dkim_ok)] if not ok]
        print(f"SPF {spf}, DMARC {dmarc_ok}, DKIM {dkim_ok}")
        print("::" + json.dumps({"outputs": {"spf_ok": spf, "dmarc_ok": dmarc_ok, "dkim_ok": dkim_ok, "missing_count": len(missing), "missing": ",".join(missing)}}) + "::")
        PYEOF
        python3 check.py
    env:
      DOMAIN: "{{ inputs.domain }}"
      SELECTOR: "{{ inputs.dkim_selector }}"

  - id: gaps_found
    type: io.kestra.plugin.core.flow.If
    description: Any missing record is an alert; a full set is just a log line.
    condition: "{{ outputs.check_records.vars.missing_count > 0 }}"
    then:
      - id: alert_gaps
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Say exactly which records are missing so the DNS fix starts there.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":email: Deliverability check on {{ inputs.domain }}: missing {{ outputs.check_records.vars.missing }}. Outgoing mail may land in spam or be rejected. Execution {{ execution.id }}."
          }
    else:
      - id: log_ok
        type: io.kestra.plugin.core.log.Log
        description: Record the passing check for the trend.
        message: "SPF, DMARC, and DKIM all present for {{ inputs.domain }}."

errors:
  - id: alert_check_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the check itself fails - a broken resolver must not read as compliant.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Deliverability DNS check FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check dig availability and network egress."
      }

outputs:
  - id: records_status
    type: JSON
    description: 'Record health, e.g. {"spf_ok": true, "dmarc_ok": true, "dkim_ok": false}'
    value: '{{ {"spf_ok": outputs.check_records.vars.spf_ok, "dmarc_ok": outputs.check_records.vars.dmarc_ok, "dkim_ok": outputs.check_records.vars.dkim_ok} | toJson }}'

extend:
  title: Verify SPF, DKIM, and DMARC Records
  shortDescription: Weekly dig of the sending domain's mail security records, alerting Slack on gaps.
  metaTitle: Email Deliverability DNS Check
  metaDescription: Check SPF, DMARC, and DKIM presence for your sending domain and alert Slack when records go missing.
  description: |
    Deliverability dies quietly when a TXT record gets edited or a DKIM selector rotates. This blueprint digs the apex for SPF, `_dmarc` for DMARC, and the DKIM selector record, alerting Slack when any is missing.

    ## How it works

    1. `check_records` (`io.kestra.plugin.scripts.shell.Commands` on Alpine with bind-tools) queries TXT records and classifies them via the `::{"outputs": ...}::` protocol.
    2. `gaps_found` (`io.kestra.plugin.core.flow.If`) branches to `alert_gaps` or `log_ok`.
    3. The `errors` block alerts on lookup failure.
    4. Trigger: a disabled weekly `Schedule`.

    ## What you get

    - Per-record health for your domain.
    - Early warning before mail starts bouncing.

    ## Who it's for

    - Teams that send transactional or marketing email.
    - Anyone who has ever debugged "why did spam score explode".

    ## Why orchestrate this with Kestra

    dig prints TXT records; the flow proves the three that matter are there, on a schedule, with alerts. The next step (auto-fix via DNS API, ticket, fail the weekly digest) is one task away.

    ## Prerequisites

    - Docker available on the Kestra Worker.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for gap and failure alerts.

    ## Quick start

    1. Add the Slack webhook secret.
    2. Set `domain` and `dkim_selector`.
    3. Run once and read `records_status`.
    4. Enable the weekly schedule.

    ## How to extend

    - Check MX and PTR (reverse DNS) too.
    - Alert on DMARC policy weakening (`p=none`).
    - Loop over several domains with a `ForEach`.

    ## Links

    - [DMARC record syntax](https://dmarc.org/overview/dmarc-record/)
    - [DKIM selectors](https://www.dkim.org/selector-lookup.html)
    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - DNS
    - Security
  ee: false
  demo: false
