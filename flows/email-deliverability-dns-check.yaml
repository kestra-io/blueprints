id: email-deliverability-dns-check
namespace: company.team
description: |
  Verify SPF, DKIM selector, and DMARC records for a sending domain, and alert
  Slack when any of them is missing or broken.

triggers:
  - id: weekly_mail_dns_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly check so a DNS edit never silently kills deliverability.
    cron: "0 6 * * 2"
    disabled: true

inputs:
  - id: domain
    type: STRING
    defaults: "example.com"
    description: Sending domain to check.
  - id: dkim_selector
    type: STRING
    defaults: "default"
    description: Selector to probe for the DKIM TXT record.

tasks:
  - id: check_records
    type: io.kestra.plugin.scripts.python.Script
    description: Queries DNS TXT records at the apex (SPF), _dmarc (DMARC), and selector (DKIM) using dnspython.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install dnspython kestra
    env:
      DOMAIN: "{{ inputs.domain }}"
      SELECTOR: "{{ inputs.dkim_selector }}"
    script: |
      import os
      import sys
      import json
      import dns.resolver
      from kestra import Kestra

      domain = os.environ.get("DOMAIN", "example.com").strip()
      selector = os.environ.get("SELECTOR", "default").strip()

      def query_txt(name):
          try:
              answers = dns.resolver.resolve(name, "TXT")
              return " ".join([str(rdata).strip('"').lower() for rdata in answers])
          except Exception:
              return ""

      apex = query_txt(domain)
      dmarc = query_txt(f"_dmarc.{domain}")
      dkim = query_txt(f"{selector}._domainkey.{domain}")

      spf_ok = "v=spf1" in apex
      dmarc_ok = "v=dmarc1" in dmarc
      dkim_ok = ("v=dkim1" in dkim or "p=" in dkim)

      missing = []
      if not spf_ok:
          missing.append("SPF")
      if not dmarc_ok:
          missing.append("DMARC")
      if not dkim_ok:
          missing.append("DKIM")

      report = {
          "domain": domain,
          "selector": selector,
          "spf_ok": spf_ok,
          "dmarc_ok": dmarc_ok,
          "dkim_ok": dkim_ok,
          "missing": missing,
          "missing_count": len(missing)
      }

      with open("deliverability_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Deliverability Audit: SPF={spf_ok}, DMARC={dmarc_ok}, DKIM={dkim_ok}, Missing={missing}")

      Kestra.outputs({
          "spf_ok": spf_ok,
          "dmarc_ok": dmarc_ok,
          "dkim_ok": dkim_ok,
          "missing_count": len(missing),
          "missing": ",".join(missing)
      })
    outputFiles:
      - deliverability_report.json

  - id: gaps_found
    type: io.kestra.plugin.core.flow.If
    description: Any missing record is an alert; a full set is just a log line.
    condition: "{{ outputs.check_records.vars.missing_count > 0 }}"
    then:
      - id: alert_gaps
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Say exactly which records are missing so the DNS fix starts there.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":email: Deliverability check on {{ inputs.domain }}: missing {{ outputs.check_records.vars.missing }}. Outgoing mail may land in spam or be rejected. Execution {{ execution.id }}."
          }
    else:
      - id: log_ok
        type: io.kestra.plugin.core.log.Log
        description: Record the passing check for the trend.
        message: "SPF, DMARC, and DKIM all present for {{ inputs.domain }}."

errors:
  - id: alert_check_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the check itself fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Deliverability DNS check FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check resolver availability and network egress."
      }

outputs:
  - id: records_status
    type: JSON
    description: 'Record health status.'
    value: "{{ outputs.check_records.vars | toJson }}"

extend:
  title: Verify SPF, DKIM, and DMARC Records
  metaTitle: Email Deliverability DNS Check
  shortDescription: Weekly DNS verification of email authentication records (SPF, DKIM, DMARC), alerting Slack on gaps.
  metaDescription: Check SPF, DMARC, and DKIM presence for your sending domain and alert Slack when records go missing.
  description: |
    ## How it works
    Deliverability degrades silently when DNS records are accidentally modified or deleted during provider migrations. This blueprint queries apex DNS records for SPF, `_dmarc` for DMARC, and the DKIM selector record, confirming proper configuration and dispatching alerts to Slack if any records are missing.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[weekly_mail_dns_check Schedule Trigger] --> B[check_records Python Script]
      B --> C{Gaps Found?}
      C -- Yes --> D[alert_gaps Webhook]
      C -- No --> E[log_ok Log]
    ```

    ## Prerequisites
    - Outbound DNS UDP/53 access.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `domain` and `dkim_selector`.
    3. Run manually or enable the weekly schedule.

    ## Links
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
    - Network
  subTags:
    - DNS
    - Monitoring & Alerting
  ee: false
  demo: false
