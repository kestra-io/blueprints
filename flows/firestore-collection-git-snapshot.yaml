id: firestore-collection-git-snapshot
namespace: company.team

inputs:
  - id: project_id
    type: STRING
    description: Google Cloud project that holds the Firestore database.

  - id: collections
    type: ARRAY
    itemType: STRING
    defaults:
      - settings
      - feature_flags
    description: Top-level collections to snapshot. Keep them small, every document is read on each run.

  - id: repo_url
    type: STRING
    description: HTTPS URL of a Git repository used only for these snapshots.

  - id: branch
    type: STRING
    defaults: main

tasks:
  - id: snapshot_collections
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ inputs.collections }}"
    tasks:
      - id: export_collection
        type: io.kestra.plugin.scripts.python.Script
        description: Reads every document of one collection, ordered by ID, and writes one JSON line per document.
        containerImage: python:3.12-slim
        beforeCommands:
          - pip install --quiet google-cloud-firestore==2.34.1
        inputFiles:
          service-account.json: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json
          PROJECT_ID: "{{ inputs.project_id }}"
          COLLECTION: "{{ item.value }}"
        outputFiles:
          - "{{ item.value }}.jsonl"
        script: |
          import json, os
          from google.cloud import firestore

          collection = os.environ["COLLECTION"]
          db = firestore.Client(project=os.environ["PROJECT_ID"])

          count = 0
          with open(f"{collection}.jsonl", "w") as out:
              for doc in db.collection(collection).order_by("__name__").stream():
                  out.write(json.dumps({"id": doc.id, "data": doc.to_dict()}, sort_keys=True, default=str) + "\n")
                  count += 1

          print("::" + json.dumps({"outputs": {"documents": count}}) + "::")

      - id: stage_snapshot
        type: io.kestra.plugin.core.namespace.UploadFiles
        namespace: "{{ flow.namespace }}"
        destination: /firestore-snapshots/
        filesMap:
          "{{ item.value }}.jsonl": "{{ outputs.export_collection.outputFiles[item.value ~ '.jsonl'] }}"

  - id: push_snapshot
    type: io.kestra.plugin.git.PushNamespaceFiles
    description: Commits the staged snapshot files, so the Git history shows which documents changed between runs.
    url: "{{ inputs.repo_url }}"
    username: "{{ secret('GITHUB_USERNAME') }}"
    password: "{{ secret('GITHUB_TOKEN') }}"
    branch: "{{ inputs.branch }}"
    files: "firestore-snapshots/**"
    gitDirectory: firestore
    commitMessage: "Firestore snapshot of {{ inputs.project_id }} on {{ execution.startDate | date('yyyy-MM-dd') }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    messageText: "Firestore snapshot of {{ inputs.project_id }} failed in {{ flow.namespace }}.{{ flow.id }}, execution {{ execution.id }}."

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"
    inputs:
      project_id: my-firebase-project
      repo_url: https://github.com/my-org/firestore-snapshots

extend:
  title: Snapshot Firestore Collections to Git Every Night
  metaTitle: Firestore Collection Snapshots with Git History | Kestra
  shortDescription: Read small Firestore collections every night and commit them to a Git repository, so every change to settings, feature flags or reference data shows up as a reviewable diff.
  metaDescription: Snapshot Firestore collections to Git nightly with Kestra. Each document change becomes a one-line diff, and it runs on the free Firebase plan.
  description: |
    Small, hand-edited Firestore collections such as settings, feature flags or price lists have no history: once someone changes a value in the console, the old one is gone. This flow commits those collections to a Git repository every night, one JSON line per document, so each change shows up as a diff.

    ## How it works

    1. A `Schedule` trigger starts the flow every night at 02:00.
    2. A `Loop` runs once per collection in the `collections` input.
    3. A Python script reads every document with the official Firestore client, ordered by ID, and writes `{"id": ..., "data": ...}` with sorted keys, so an unchanged collection gives an identical file.
    4. `UploadFiles` stages each file as a namespace file, and `PushNamespaceFiles` commits them to `firestore/firestore-snapshots/` in the repository. No commit is made when nothing changed.
    5. If any step fails, the `errors` branch posts the execution ID to Slack.

    ## What you get

    - A dated history of each collection where a diff points at the exact document that changed.
    - No empty commits on quiet nights.
    - A Slack alert when a run fails.
    - Works on the free Spark plan with a read-only service account.

    ## Who it's for

    - Teams that keep app settings, feature flags or reference data in Firestore.

    ## Why orchestrate this with Kestra

    - Secrets stay masked in logs and never reach the repository.
    - Scheduling, failure alerting and execution history come with the flow instead of being built around a cron script.

    ## Prerequisites

    - A Firestore database in Native mode. Billing is not required.
    - A service account with `roles/datastore.viewer` and a JSON key.
    - A repository used only for these snapshots, and a token that can push to it.
    - A worker that can run Docker containers, for the `python:3.12-slim` image.
    - Small collections only: every document is read on each run, and the free plan allows 50,000 reads per day.

    ### Secrets

    - `GCP_SERVICE_ACCOUNT`: service account JSON key used to read Firestore.
    - `GITHUB_USERNAME`: Git username that owns the token.
    - `GITHUB_TOKEN`: token used to push commits, for example a GitHub fine-grained token with `Contents: Read and write` on the snapshot repository.
    - `SLACK_WEBHOOK`: Slack incoming webhook URL for failure alerts.

    ## Quick start

    1. Add the four secrets to your namespace.
    2. Execute the flow with your `project_id`, `repo_url` and collections, then check `firestore/firestore-snapshots/` in the repository.
    3. Change a document in the Firebase console, execute again, and open the new commit.
    4. Set `project_id` and `repo_url` in the trigger inputs to run it nightly.

    ## How to extend

    - Run it hourly for collections that change often.
    - Post the commit diff to Slack so reviewers see changes without opening Git.
    - Push to a separate branch and open a pull request when a protected collection changes.

    ## Links

    - [Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Python Script task](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [UploadFiles task](https://kestra.io/plugins/core/namespace/io.kestra.plugin.core.namespace.uploadfiles)
    - [PushNamespaceFiles task](https://kestra.io/plugins/plugin-git/io.kestra.plugin.git.pushnamespacefiles)
    - [Slack incoming webhook task](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Firestore Python client](https://cloud.google.com/python/docs/reference/firestore/latest)
  tags:
    - Data
  subTags:
    - Day 2 Operations
  ee: false
  demo: false
