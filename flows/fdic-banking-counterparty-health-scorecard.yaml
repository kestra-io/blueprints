id: fdic-banking-counterparty-health-scorecard
namespace: company.team

description: |
  Score the banks that hold your company's cash from their FDIC call reports. One request resolves every
  FDIC certificate (and follows mergers to the successor charter), one request pulls the last five quarters
  of financials, and DuckDB computes QoQ deposit change, quarterly ROA, capital ratios, noncurrent loans,
  the bank's uninsured-deposit share and how much of your own balance sits above the insured limit.
  Only a new quarter, a rating change or a new flag is posted to Slack. Works without an API key.

inputs:
  - id: banks
    type: JSON
    description: |
      Your deposit relationships, one object per account with `cert` (FDIC certificate number, shown on
      BankFind), `label` and `deposits_usd`. Accounts at the same charter are added up, because the insured
      limit applies per bank, not per account or brand. The defaults are SAMPLE balances; every bank
      figure comes from the live FDIC API.
    defaults:
      - {cert: 628, label: JPMorgan operating, deposits_usd: 40000000}
      - {cert: 628, label: JPMorgan payroll, deposits_usd: 6500000}
      - {cert: 3511, label: Wells Fargo lockbox, deposits_usd: 12000000}
      - {cert: 24045, label: Banc of California sweep, deposits_usd: 6000000}
      - {cert: 32541, label: Flagstar escrow, deposits_usd: 3000000}
      - {cert: 58410, label: Cross River payments, deposits_usd: 1500000}
      - {cert: 5649, label: Discover savings, deposits_usd: 900000}
      - {cert: 4297, label: Capital One card settlement, deposits_usd: 400000}
      - {cert: 9999999, label: Typo in CERT, deposits_usd: 250000}

  - id: insured_limit_usd
    type: FLOAT
    defaults: 250000
    description: FDIC standard maximum per depositor, per ownership category, per insured bank. A company's accounts are one category.

  - id: min_leverage_pct
    type: FLOAT
    defaults: 5
    description: Tier 1 leverage ratio floor (5% is "well capitalized" under prompt corrective action).

  - id: min_total_capital_pct
    type: FLOAT
    defaults: 10
    description: Total risk-based capital ratio floor (10% is "well capitalized"). Skipped for community bank leverage ratio filers, which do not report it.

  - id: max_noncurrent_pct
    type: FLOAT
    defaults: 3
    description: Noncurrent loans (90+ days past due or nonaccrual) as a percentage of total loans.

  - id: max_deposit_drop_pct
    type: FLOAT
    defaults: 5
    description: Flag a bank whose total deposits fell more than this percentage quarter over quarter (a run or balance-sheet shrink signal).

  - id: max_uninsured_share_pct
    type: FLOAT
    defaults: 60
    description: Flag a bank whose estimated uninsured deposits exceed this share of its deposits (Silicon Valley Bank was above 90%).

  - id: state_key
    type: STRING
    defaults: fdic_counterparty_scorecard
    description: KV key pointing at the Parquet scorecard of the previous run.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * 1"
    timezone: America/New_York
    description: Call reports land about two months after quarter end; a weekly check posts a new quarter within days and stays silent otherwise.

tasks:
  - id: previous
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: URI of the last scorecard. Missing on the first run, which is the BASELINE (every bank is reported once).

  - id: bootstrap
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.previous.value is not defined or outputs.previous.value is empty }}"
    then:
      - id: empty_state
        type: io.kestra.plugin.jdbc.duckdb.Queries
        url: "jdbc:duckdb:"
        fetchType: NONE
        outputFiles:
          - state_parquet
        sql: |
          CREATE TABLE s (cert INTEGER, repdte VARCHAR, rating VARCHAR, flags VARCHAR);
          COPY s TO '{{ outputFiles.state_parquet }}' (FORMAT PARQUET);

  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Validates the CERT numbers (a non-numeric value would break the API filter) and builds the OR filter for the institutions request.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    outputFiles:
      - accounts_parquet
    parameters:
      banks: "{{ inputs.banks | toJson }}"
    sql: |
      CREATE TABLE a AS
      SELECT row_number() OVER () AS line,
             TRY_CAST(json_extract_string(j, '$.cert') AS INTEGER) AS cert,
             coalesce(json_extract_string(j, '$.label'), 'line ' || row_number() OVER ()) AS label,
             TRY_CAST(json_extract_string(j, '$.deposits_usd') AS DECIMAL(18,2)) AS deposits_usd
      FROM (SELECT unnest(from_json(:banks, '["JSON"]')) AS j);
      COPY a TO '{{ outputFiles.accounts_parquet }}' (FORMAT PARQUET);
      SELECT 'CERT:(' || string_agg(DISTINCT CAST(cert AS VARCHAR), ' OR ') || ')' AS filter,
             CASE WHEN count(cert) = 0 THEN error('No numeric FDIC CERT in the banks input.') END AS guard
      FROM a WHERE cert IS NOT NULL;

  - id: institutions
    type: io.kestra.plugin.core.http.Download
    description: Status of every charter. Inactive ones carry `NEWCERT` (the successor) and `ENDEFYMD` (the date the charter ended).
    uri: https://api.fdic.gov/banks/institutions
    params:
      filters: "{{ outputs.plan.outputs[0].row.filter }}"
      fields: CERT,NAME,ACTIVE,NEWCERT,ENDEFYMD,CHANGEC1,STNAME
      limit: "10000"
    headers:
      User-Agent: kestra-fdic-counterparty-scorecard/1.0 (https://kestra.io)
    options:
      retryOnStatusCodes: [429, 500, 502, 503, 504]
      retry:
        type: exponential
        interval: PT5S
        maxInterval: PT1M
        maxAttempts: 4

  - id: resolve
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Maps every account to the charter that now holds it (one merger hop) and builds the financials filter for those charters over the last five quarters.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      inst.json: "{{ outputs.institutions.uri }}"
    outputFiles:
      - inst_parquet
    sql: |
      CREATE TABLE inst AS
      SELECT CAST(json_extract_string(d, '$.data.CERT') AS INTEGER) AS cert,
             json_extract_string(d, '$.data.NAME') AS name,
             CAST(json_extract_string(d, '$.data.ACTIVE') AS INTEGER) = 1 AS active,
             nullif(CAST(json_extract_string(d, '$.data.NEWCERT') AS INTEGER), 0) AS newcert,
             CAST(strptime(json_extract_string(d, '$.data.ENDEFYMD'), '%m/%d/%Y') AS DATE) AS ended_on
      FROM read_json_objects('inst.json'), unnest(from_json(json_extract(json, '$.data'), '["JSON"]')) AS t(d);
      COPY inst TO '{{ outputFiles.inst_parquet }}' (FORMAT PARQUET);
      SELECT 'CERT:(' || string_agg(DISTINCT CAST(c AS VARCHAR), ' OR ') || ') AND REPDTE:['
             || strftime(current_date - INTERVAL 460 DAY, '%Y%m%d') || ' TO 99991231]' AS filter,
             count(DISTINCT c) AS charters
      FROM (SELECT CASE WHEN active THEN cert ELSE newcert END AS c FROM inst) WHERE c IS NOT NULL;

  - id: financials
    type: io.kestra.plugin.core.http.Download
    description: |
      Call report figures in thousands of USD. NETINC is year to date, so profitability uses ROAQ (the quarter,
      annualised). RBCRWAJ is 0 for community bank leverage ratio filers.
    uri: https://api.fdic.gov/banks/financials
    params:
      filters: "{{ outputs.resolve.outputs[0].row.filter }}"
      fields: CERT,NAMEFULL,REPDTE,ASSET,DEP,DEPUNINS,ROAQ,RBC1AAJ,RBCRWAJ,NCLNLSR
      sort_by: REPDTE
      sort_order: DESC
      limit: "10000"
    headers:
      User-Agent: kestra-fdic-counterparty-scorecard/1.0 (https://kestra.io)
    options:
      retryOnStatusCodes: [429, 500, 502, 503, 504]
      retry:
        type: exponential
        interval: PT5S
        maxInterval: PT1M
        maxAttempts: 4

  - id: score
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Rates each charter on its latest quarter. Capital below a floor or a closed charter without successor is RED,
      any other flag is AMBER. A bank whose latest filing is older than the newest quarter in the answer is flagged
      FILING_MISSING. Accounts at a charter that merged within the last six months stay separately insured (FDIC
      grace period); after that they are added to the successor's exposure. Compares with the previous scorecard.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      fin.json: "{{ outputs.financials.uri }}"
      inst.parquet: "{{ outputs.resolve.outputFiles.inst_parquet }}"
      accounts.parquet: "{{ outputs.plan.outputFiles.accounts_parquet }}"
      state.parquet: "{{ outputs.previous.value ?? outputs.empty_state.outputFiles.state_parquet }}"
    outputFiles:
      - scorecard_csv
      - state_parquet
    parameters:
      insured: "{{ inputs.insured_limit_usd }}"
      min_lev: "{{ inputs.min_leverage_pct }}"
      min_rbc: "{{ inputs.min_total_capital_pct }}"
      max_nc: "{{ inputs.max_noncurrent_pct }}"
      max_drop: "{{ inputs.max_deposit_drop_pct }}"
      max_unins: "{{ inputs.max_uninsured_share_pct }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE fin AS
      SELECT CAST(json_extract_string(d, '$.data.CERT') AS INTEGER) AS cert,
             json_extract_string(d, '$.data.NAMEFULL') AS name,
             json_extract_string(d, '$.data.REPDTE') AS repdte,
             CAST(json_extract_string(d, '$.data.DEP') AS DOUBLE) AS dep,
             CAST(json_extract_string(d, '$.data.DEPUNINS') AS DOUBLE) AS depunins,
             CAST(json_extract_string(d, '$.data.ROAQ') AS DOUBLE) AS roaq,
             CAST(json_extract_string(d, '$.data.RBC1AAJ') AS DOUBLE) AS leverage,
             nullif(CAST(json_extract_string(d, '$.data.RBCRWAJ') AS DOUBLE), 0) AS total_rbc,
             CAST(json_extract_string(d, '$.data.NCLNLSR') AS DOUBLE) AS noncurrent
      FROM read_json_objects('fin.json'), unnest(from_json(json_extract(json, '$.data'), '["JSON"]')) AS t(d);

      CREATE TABLE q AS SELECT *, row_number() OVER (PARTITION BY cert ORDER BY repdte DESC) AS n FROM fin;
      CREATE TABLE latest AS
      SELECT c.*, round(100 * (c.dep - p.dep) / nullif(p.dep, 0), 2) AS dep_qoq_pct,
             round(100 * c.depunins / nullif(c.dep, 0), 1) AS uninsured_share_pct
      FROM q c LEFT JOIN q p ON p.cert = c.cert AND p.n = 2 WHERE c.n = 1;

      CREATE TABLE inst AS SELECT * FROM read_parquet('inst.parquet');
      CREATE TABLE acc AS
      SELECT a.*, i.name AS charter_name, i.active, i.newcert, i.ended_on,
             CASE WHEN i.cert IS NULL THEN NULL WHEN i.active THEN a.cert ELSE i.newcert END AS holder_cert,
             CASE WHEN i.active OR i.ended_on > current_date - INTERVAL 6 MONTH THEN a.cert ELSE i.newcert END AS insurance_cert
      FROM read_parquet('accounts.parquet') a LEFT JOIN inst i ON i.cert = a.cert;

      CREATE TABLE exposure AS
      SELECT holder_cert AS cert, sum(deposits_usd) AS deposits_usd, string_agg(DISTINCT charter_name, ', ') AS charter_names,
             string_agg(label || CASE WHEN cert <> holder_cert THEN ' (via CERT ' || cert || ', merged ' || ended_on || ')' ELSE '' END, '; ') AS accounts
      FROM acc WHERE holder_cert IS NOT NULL GROUP BY holder_cert;
      CREATE TABLE uninsured AS
      SELECT holder_cert AS cert, sum(greatest(0, d - CAST(:insured AS DOUBLE))) AS uninsured_usd
      FROM (SELECT holder_cert, insurance_cert, sum(deposits_usd) AS d FROM acc WHERE holder_cert IS NOT NULL GROUP BY ALL) GROUP BY holder_cert;

      CREATE TABLE flagged AS
      SELECT e.cert, coalesce(l.name, i.name, 'CERT ' || e.cert || ', successor of ' || e.charter_names) AS bank, e.accounts, e.deposits_usd, u.uninsured_usd, l.repdte,
             l.dep_qoq_pct, l.roaq, round(l.leverage, 2) AS leverage_pct, round(l.total_rbc, 2) AS total_rbc_pct,
             round(l.noncurrent, 2) AS noncurrent_pct, l.uninsured_share_pct,
             list_filter([
               CASE WHEN l.cert IS NULL THEN 'NO_CURRENT_FILING' END,
               CASE WHEN l.repdte < (SELECT max(repdte) FROM latest) THEN 'FILING_MISSING' END,
               CASE WHEN l.leverage < CAST(:min_lev AS DOUBLE) THEN 'LOW_LEVERAGE' END,
               CASE WHEN l.total_rbc < CAST(:min_rbc AS DOUBLE) THEN 'LOW_TOTAL_CAPITAL' END,
               CASE WHEN l.roaq < 0 THEN 'QUARTERLY_LOSS' END,
               CASE WHEN l.noncurrent > CAST(:max_nc AS DOUBLE) THEN 'HIGH_NONCURRENT_LOANS' END,
               CASE WHEN l.dep_qoq_pct < -CAST(:max_drop AS DOUBLE) THEN 'DEPOSIT_OUTFLOW' END,
               CASE WHEN l.uninsured_share_pct > CAST(:max_unins AS DOUBLE) THEN 'HIGH_UNINSURED_SHARE' END,
               CASE WHEN l.total_rbc IS NULL AND l.cert IS NOT NULL THEN 'CBLR_FILER' END], x -> x IS NOT NULL) AS flag_list
      FROM exposure e LEFT JOIN latest l ON l.cert = e.cert LEFT JOIN inst i ON i.cert = e.cert JOIN uninsured u ON u.cert = e.cert;

      CREATE TABLE rated AS
      SELECT *, array_to_string(flag_list, ',') AS flags,
             CASE WHEN list_has_any(flag_list, ['NO_CURRENT_FILING', 'LOW_LEVERAGE', 'LOW_TOTAL_CAPITAL']) THEN 'RED'
                  WHEN len(list_filter(flag_list, x -> x <> 'CBLR_FILER')) > 0 THEN 'AMBER' ELSE 'GREEN' END AS rating
      FROM flagged
      UNION ALL
      SELECT a.cert, NULL, a.label, a.deposits_usd, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, CAST([] AS VARCHAR[]),
             CASE WHEN a.cert IS NULL THEN 'INVALID_CERT' ELSE 'CERT_NOT_FOUND' END, 'UNKNOWN'
      FROM acc a WHERE a.holder_cert IS NULL;

      CREATE TABLE prev AS SELECT * FROM read_parquet('state.parquet');
      CREATE TABLE changes AS
      SELECT r.*, p.rating AS previous_rating,
             CASE WHEN p.cert IS NULL THEN 'NEW' WHEN p.rating <> r.rating THEN 'RATING_CHANGED'
                  WHEN p.flags <> r.flags THEN 'FLAGS_CHANGED' WHEN p.repdte IS DISTINCT FROM r.repdte THEN 'NEW_QUARTER' END AS change
      FROM rated r LEFT JOIN prev p ON p.cert IS NOT DISTINCT FROM r.cert AND (r.cert IS NOT NULL OR p.flags = r.flags);

      COPY (SELECT rating, cert, bank, accounts, deposits_usd, uninsured_usd, repdte, dep_qoq_pct, roaq, leverage_pct,
                   total_rbc_pct, noncurrent_pct, uninsured_share_pct, flags, change, previous_rating
            FROM changes ORDER BY CASE rating WHEN 'RED' THEN 1 WHEN 'UNKNOWN' THEN 2 WHEN 'AMBER' THEN 3 ELSE 4 END, uninsured_usd DESC)
        TO '{{ outputFiles.scorecard_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT cert, repdte, rating, flags FROM rated) TO '{{ outputFiles.state_parquet }}' (FORMAT PARQUET);

      SELECT (SELECT max(repdte) FROM latest) AS latest_quarter,
             (SELECT count(*) FROM prev) = 0 AS is_baseline,
             count(*) AS charters,
             count(*) FILTER (WHERE rating = 'RED') AS red,
             count(*) FILTER (WHERE rating = 'AMBER') AS amber,
             count(*) FILTER (WHERE rating = 'GREEN') AS green,
             count(*) FILTER (WHERE rating = 'UNKNOWN') AS unknown,
             CAST(round(coalesce(sum(uninsured_usd), 0)) AS BIGINT) AS uninsured_usd,
             count(*) FILTER (WHERE change IS NOT NULL AND (rating <> 'GREEN' OR change <> 'NEW_QUARTER')) AS alerts,
             coalesce(string_agg(rating || ' ' || coalesce(bank, 'CERT ' || coalesce(CAST(cert AS VARCHAR), '?')) || ' [' || flags || '] '
               || coalesce(change, 'unchanged') || coalesce(' | lev ' || leverage_pct || '%, ROAQ ' || roaq || '%, dep QoQ ' || dep_qoq_pct || '%, NCL ' || noncurrent_pct || '%', '') || ' | our uninsured USD ' || CAST(round(coalesce(uninsured_usd, 0)) AS BIGINT), chr(10)
               ORDER BY rating, cert), '') AS lines,
             CAST(json_object('text', '*FDIC counterparty scorecard* (call reports as of ' || (SELECT max(repdte) FROM latest) || ')' || chr(10)
               || coalesce(string_agg('• *' || rating || '* ' || coalesce(bank, 'CERT ' || coalesce(CAST(cert AS VARCHAR), '?')) || ' - '
                    || CASE WHEN flags = '' THEN 'no flags' ELSE flags END || ' - ' || change
                    || CASE WHEN previous_rating IS NOT NULL AND previous_rating <> rating THEN ' (was ' || previous_rating || ')' ELSE '' END
                    || coalesce(' (lev ' || leverage_pct || '%, ROAQ ' || roaq || '%, deposits QoQ ' || dep_qoq_pct || '%)', '') || ' - our uninsured USD ' || CAST(round(coalesce(uninsured_usd, 0)) AS BIGINT), chr(10) ORDER BY rating, cert)
                  FILTER (WHERE change IS NOT NULL AND (rating <> 'GREEN' OR change <> 'NEW_QUARTER')), '')) AS VARCHAR) AS slack_payload
      FROM changes;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.score.outputFiles.state_parquet }}"

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.score.outputs[0].row.alerts > 0 }}"
    then:
      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the scorecard when the webhook is not configured; the changes are still in the log and CSV.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: "{{ outputs.score.outputs[0].row.slack_payload }}"
    else:
      - id: quiet
        type: io.kestra.plugin.core.log.Log
        message: No new quarter, rating or flag change since the last run.

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      FDIC scorecard{{ outputs.score.outputs[0].row.is_baseline ? ' (BASELINE)' : '' }} for quarter {{ outputs.score.outputs[0].row.latest_quarter }}: {{ outputs.score.outputs[0].row.charters }} charters, {{ outputs.score.outputs[0].row.red }} RED, {{ outputs.score.outputs[0].row.amber }} AMBER, {{ outputs.score.outputs[0].row.green }} GREEN, {{ outputs.score.outputs[0].row.unknown }} unknown, {{ outputs.score.outputs[0].row.alerts }} alert(s). Company deposits above the insured limit: USD {{ outputs.score.outputs[0].row.uninsured_usd }}.
      {{ outputs.score.outputs[0].row.lines }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.score.outputs[0].row }}"
  - id: scorecard_csv
    type: FILE
    value: "{{ outputs.score.outputFiles.scorecard_csv }}"

extend:
  title: Score Your Banking Counterparties from FDIC Call Reports with DuckDB
  metaTitle: FDIC Bank Counterparty Health Scorecard | Kestra
  shortDescription: Rate every bank that holds your company's cash on its latest FDIC call report (capital, losses, noncurrent loans, deposit outflow, uninsured share), follow mergers to the successor charter and alert on changes only.
  metaDescription: Rate the banks holding your cash from FDIC call reports, follow mergers, compute your uninsured exposure and alert in Slack on rating changes.
  description: |
    Corporate treasury keeps cash at several banks, usually far above the FDIC insured limit. The FDIC publishes every insured bank's quarterly call report through a keyless API, but the figures need care: amounts are in thousands, net income is year to date, small banks that elect the community bank leverage ratio report 0 for risk-based capital, and a bank that merged keeps its old certificate number in your treasury system. This flow turns that data into a quarterly scorecard of your banking counterparties.

    ## How it works

    1. A weekly `Schedule` runs the flow. `previous` (KV Get) loads the last scorecard; `bootstrap` (If) creates an empty one on the first run, which is the BASELINE.
    2. `plan` (DuckDB) validates the CERT numbers and builds one OR filter. `institutions` (HTTP Download) returns the status of every charter, with `NEWCERT` and `ENDEFYMD` for closed or merged ones.
    3. `resolve` (DuckDB) maps each account to the charter that holds it now and `financials` fetches the last five quarters of `DEP`, `DEPUNINS`, `ROAQ`, `RBC1AAJ`, `RBCRWAJ` and `NCLNLSR` for all of them in one request.
    4. `score` (DuckDB) adds up your accounts per charter, computes QoQ deposit change and the bank's uninsured share, and flags low leverage, low total capital, a quarterly loss, high noncurrent loans, deposit outflow, a missing filing or no current filing. Capital and closed charters are RED, other flags AMBER. Deposits at a charter merged less than six months ago stay separately insured (FDIC grace period), later they count once against the successor's limit.
    5. The result is compared with the previous scorecard; `save_state` (KV Set) stores the new one and `route` (If) posts new banks, rating and flag changes, and non-green banks in a new quarter to Slack.

    ## What you get

    - A scorecard CSV per charter: rating, flags, ratios, your deposits and the part above the insured limit.
    - Merged charters resolved (Discover Bank to Capital One), failed ones shown as RED, unknown CERTs reported.
    - Silence when nothing changed.

    The default `banks` balances are SAMPLE data; every bank figure comes from the live FDIC API.

    ## Who it's for

    - Corporate treasury, counterparty and vendor risk teams, and CFOs of companies with cash at several banks.

    ## Why orchestrate this with Kestra

    - Two requests per run with retries, KV state for change detection and a Slack alert with `allowFailure`, without a database or a cron server.

    ## Prerequisites

    - Kestra 2.0 with the DuckDB and Slack plugins and HTTPS access to `api.fdic.gov`. No API key.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the alerts (optional).

    ## Quick start

    1. Click **Execute** with the defaults: a baseline of 7 charters (3 AMBER, 3 GREEN, 1 unknown CERT).
    2. Execute again: no alert.
    3. Replace `banks` with your accounts and CERT numbers from BankFind, tune the thresholds, add the secret and enable the schedule.

    ## How to extend

    - Feed `banks` from your treasury management system and write the CSV to your data warehouse.
    - Follow multi-hop successors (a bridge bank that was sold) with a second `institutions` request.
    - Add peer percentiles from the same endpoint, filtered on asset size.

    ## Links

    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries) and [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [FDIC BankFind Suite API](https://api.fdic.gov/banks/docs/) and [FDIC deposit insurance coverage](https://www.fdic.gov/resources/deposit-insurance/understanding-deposit-insurance)
  tags:
    - Business
  subTags:
    - Reporting & Digests
    - Policy & Compliance
  ee: false
  demo: false
