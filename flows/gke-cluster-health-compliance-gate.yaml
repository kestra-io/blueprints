id: gke-cluster-health-compliance-gate
namespace: company.team

description: |
  Read a GKE cluster's real metadata, classify it HEALTHY, WARNING, CRITICAL or PROBE_FAILED
  from its actual node pool statuses and whether logging or monitoring export is disabled,
  alert Slack with the exact node pool names and service values, and log a final audit
  summary either way.

inputs:
  - id: cluster_project_id
    type: STRING
    displayName: Cluster project ID
    description: GCP project that owns the cluster. Maps to the ClusterMetadata task's clusterProjectId field.
    defaults: "my-gcp-project"

  - id: cluster_zone
    type: STRING
    displayName: Cluster zone or region
    description: Zone or region where the cluster resides, for example us-central1-a. Maps to the ClusterMetadata task's clusterZone field.
    defaults: "us-central1-a"

  - id: cluster_id
    type: STRING
    displayName: Cluster ID
    description: Name of the GKE cluster to audit. Maps to the ClusterMetadata task's clusterId field.
    defaults: "production-cluster"

  - id: unhealthy_node_pool_threshold
    type: INT
    displayName: Unhealthy node pool threshold
    description: Number of node pools reporting ERROR, RUNNING_WITH_ERROR or STATUS_UNSPECIFIED at or above which the cluster is classified CRITICAL.
    defaults: 1

  - id: require_observability
    type: BOOL
    displayName: Require observability export
    description: When true, a logging or monitoring service set to none, GKE's own value for disabled, is treated as a CRITICAL compliance violation.
    defaults: true

  - id: observability_scope
    type: SELECT
    displayName: Observability scope checked
    description: Which service require_observability checks. logging checks loggingService only, monitoring checks monitoringService only, both checks either.
    values:
      - "logging"
      - "monitoring"
      - "both"
    defaults: "both"

tasks:
  - id: probe_cluster
    type: io.kestra.plugin.gcp.gke.ClusterMetadata
    description: Read-only. Fetches the cluster's networking, node pool statuses, and logging and monitoring service configuration.
    allowFailure: true
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    clusterProjectId: "{{ inputs.cluster_project_id }}"
    clusterZone: "{{ inputs.cluster_zone }}"
    clusterId: "{{ inputs.cluster_id }}"

  - id: audit_node_pools
    type: io.kestra.plugin.core.output.OutputValues
    description: Splits node pools into those in a failed state and those merely mid-transition. Empty lists when the probe itself did not return.
    values:
      bad_pools: >-
        {{ (outputs.probe_cluster is not defined) ? '[]' : (outputs.probe_cluster.nodePools | jq('[.[] | select(.status == "ERROR" or .status == "RUNNING_WITH_ERROR" or .status == "STATUS_UNSPECIFIED") | .name]') | first | toJson) }}
      transitional_pools: >-
        {{ (outputs.probe_cluster is not defined) ? '[]' : (outputs.probe_cluster.nodePools | jq('[.[] | select(.status == "PROVISIONING" or .status == "RECONCILING" or .status == "STOPPING") | .name]') | first | toJson) }}

  - id: classify_cluster_health
    type: io.kestra.plugin.core.debug.Return
    description: PROBE_FAILED when the probe produced no output at all, CRITICAL when enough node pools are failed or observability export is disabled, WARNING when a node pool is mid-transition, HEALTHY otherwise.
    format: "{{ outputs.probe_cluster is not defined ? 'PROBE_FAILED' : (((fromJson(outputs.audit_node_pools.values.bad_pools) | length) >= inputs.unhealthy_node_pool_threshold or (inputs.require_observability and ((inputs.observability_scope != 'monitoring' and outputs.probe_cluster.loggingService == 'none') or (inputs.observability_scope != 'logging' and outputs.probe_cluster.monitoringService == 'none')))) ? 'CRITICAL' : ((fromJson(outputs.audit_node_pools.values.transitional_pools) | length) > 0 ? 'WARNING' : 'HEALTHY')) }}"

  - id: route_by_cluster_health
    type: io.kestra.plugin.core.flow.Switch
    description: Branch A logs a healthy cluster. Branch B alerts Slack when a node pool failed, is mid-transition, observability export is disabled, or the probe itself failed.
    value: "{{ outputs.classify_cluster_health.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "GKE cluster {{ inputs.cluster_id }} healthy. {{ outputs.probe_cluster.nodePoolsCount }} node pool(s), logging={{ outputs.probe_cluster.loggingService }}, monitoring={{ outputs.probe_cluster.monitoringService }}."
      "WARNING":
        - id: alert_warning
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "GKE cluster " ~ inputs.cluster_id ~ " WARNING. Node pool(s) mid-transition: " ~ (fromJson(outputs.audit_node_pools.values.transitional_pools) | join(", ")) ~ ". No action needed if this is an expected upgrade or scale event, alert again if it persists."} | toJson }}
      "CRITICAL":
        - id: alert_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "GKE cluster " ~ inputs.cluster_id ~ " CRITICAL. Failed node pool(s): " ~ (fromJson(outputs.audit_node_pools.values.bad_pools) | join(", ")) ~ ". loggingService=" ~ outputs.probe_cluster.loggingService ~ " monitoringService=" ~ outputs.probe_cluster.monitoringService ~ "."} | toJson }}
      "PROBE_FAILED":
        - id: alert_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "GKE cluster metadata probe for " ~ inputs.cluster_id ~ " in " ~ inputs.cluster_project_id ~ "/" ~ inputs.cluster_zone ~ " did not return a result. Check GCP_SERVICE_ACCOUNT and that the cluster exists at that project and zone."} | toJson }}

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Final audit log confirming the gate ran, regardless of the branch taken above.
    message: "GKE cluster health compliance gate completed. cluster={{ inputs.cluster_id }} status={{ outputs.classify_cluster_health.value }} require_observability={{ inputs.require_observability }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {"text": "GKE cluster health compliance gate flow failed (execution " ~ execution.id ~ "). Check the execution logs."} | toJson }}

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled.
    cron: "0 * * * *"
    disabled: true
    inputs:
      cluster_project_id: "my-gcp-project"
      cluster_zone: "us-central1-a"
      cluster_id: "production-cluster"
      unhealthy_node_pool_threshold: 1
      require_observability: true
      observability_scope: "both"

extend:
  title: GKE Cluster Health and Observability Compliance Gate
  shortDescription: Read a GKE cluster's real node pool statuses and logging and monitoring configuration, classify it HEALTHY, WARNING, CRITICAL or PROBE_FAILED, and alert Slack with the exact node pools and services involved.
  metaTitle: GKE Cluster Health Compliance Gate with Kestra
  metaDescription: Audit a GKE cluster's node pool health and observability export on a schedule and alert Slack with the exact pools and services affected.
  description: |
    A GKE cluster can drift out of a healthy, compliant state in two ways that are each easy
    to miss: a node pool enters `ERROR` after a failed upgrade or a quota problem and stays
    there until someone opens the console, or `loggingService` and `monitoringService` get set
    to `none`, often as a quick cost cut during a migration, and audit logging silently stops
    long before a security review notices. This blueprint turns both into one Day 2 governance
    gate: it reads the cluster's real metadata, classifies what it finds, and alerts Slack with
    the exact node pool names and service values, never a guess.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `probe_cluster` (`io.kestra.plugin.gcp.gke.ClusterMetadata`) fetches the cluster's
       `nodePools` (each with its real `name` and `status`), `loggingService`, and
       `monitoringService`, with `allowFailure: true` so an unreachable cluster or bad
       credential does not stop the flow before it can be classified as `PROBE_FAILED` below.
    2. `audit_node_pools` (`io.kestra.plugin.core.output.OutputValues`) splits `nodePools` into
       `bad_pools` (`ERROR`, `RUNNING_WITH_ERROR`, or `STATUS_UNSPECIFIED`) and
       `transitional_pools` (`PROVISIONING`, `RECONCILING`, or `STOPPING`), both empty when
       `probe_cluster` produced no output at all.
    3. `classify_cluster_health` (`io.kestra.plugin.core.debug.Return`) returns `PROBE_FAILED`,
       `CRITICAL` (enough `bad_pools` to meet `unhealthy_node_pool_threshold`, or
       `require_observability` is true and `loggingService` or `monitoringService`, per
       `observability_scope`, is `none`), `WARNING` (a pool is merely mid-transition), or
       `HEALTHY`.
    4. `route_by_cluster_health` (`io.kestra.plugin.core.flow.Switch`) branches on that status:
       - **HEALTHY**: `log_healthy` logs the node pool count and both service values.
       - **WARNING**, **CRITICAL**, **PROBE_FAILED**: a `SlackIncomingWebhook` task alerts with
         the exact node pool names and service values involved, never an invented number.
    5. `log_audit_summary` always runs last and logs the final classification.
    6. The `errors` block posts to Slack if the flow itself fails outside the gate logic above.

    ## What you get

    - A real answer to whether every node pool in a cluster is actually healthy, not just
      whether the cluster API responded.
    - A Slack alert naming the exact failed or transitioning node pools and the exact
      `loggingService` and `monitoringService` values, never an invented number.
    - A compliance check for observability export that catches the common "someone disabled it
      during a migration and forgot" drift, with the choice of auditing logging, monitoring,
      or both.

    ## Who it's for

    - Platform and SRE teams who own GKE clusters and need to know about a failed node pool
      before an on-call page, not after.
    - Security and compliance teams who need proof that audit logging and monitoring export
      stay enabled on production clusters between formal reviews.
    - Teams evaluating the GCP plugin who want a working example of
      `io.kestra.plugin.gcp.gke.ClusterMetadata`.

    ## Why orchestrate this with Kestra

    `ClusterMetadata` is a single point-in-time read, GKE itself has no concept of a schedule,
    a threshold, or an alert built from what it returns. Kestra adds the recurring check, the
    node pool classification, the observability compliance check, and a Slack alert built only
    from the cluster's own reported values, all as one declarative YAML file you can version
    and review like code.

    ## Prerequisites

    - A GKE cluster and a GCP service account with `container.clusters.get` permission
      (the `roles/container.viewer` role is enough, this blueprint only reads).
    - A Slack incoming webhook for alerts.
    - GKE is a managed Google Cloud service with no self-hostable open-source emulator, there
      is no local Docker container to start for the cluster itself. This plugin calls the
      Google Cloud Container API directly from the Kestra worker process, there is no
      sub-container `taskRunner` and no Docker network to join.

    ### Secrets

    - `GCP_SERVICE_ACCOUNT`: service account JSON key used by `probe_cluster`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by the alert tasks and the `errors`
      block.

      In Kestra OSS, set both as base64-encoded environment variables:
      `SECRET_GCP_SERVICE_ACCOUNT`, `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Type | Default | Allowed values |
    |---|---|---|---|
    | `cluster_project_id` | STRING | `my-gcp-project` | any GCP project ID |
    | `cluster_zone` | STRING | `us-central1-a` | any GKE zone or region |
    | `cluster_id` | STRING | `production-cluster` | any GKE cluster name |
    | `unhealthy_node_pool_threshold` | INT | `1` | any non-negative integer |
    | `require_observability` | BOOL | `true` | `true`, `false` |
    | `observability_scope` | SELECT | `both` | `logging`, `monitoring`, `both` |

    ## Quick start

    1. Create a GCP service account with `roles/container.viewer` on the project.
    2. Add the `GCP_SERVICE_ACCOUNT` and `SLACK_WEBHOOK` secrets.
    3. Set `cluster_project_id`, `cluster_zone`, and `cluster_id` to a real cluster and run this
       flow manually.
    4. Read `log_audit_summary` for the classification.
    5. Enable the `hourly` trigger.

    ## How to extend

    - Read `outputs.probe_cluster.masterAuth` to compare the cluster's CA certificate against a
      known-good value and flag a private cluster whose control plane certificate rotated
      unexpectedly.
    - Add a second probe for a second cluster and reuse the same classification logic to watch
      a whole fleet from one flow.
    - Chain a downstream task after `CRITICAL` on a failed node pool that opens a ticket with
      the exact pool name already filled in, instead of only alerting Slack.

    ## Pitfalls

    - `PROVISIONING`, `RECONCILING`, and `STOPPING` are normal during a planned upgrade or
      resize, this blueprint reports them as `WARNING`, not `CRITICAL`, specifically so a
      routine maintenance window does not page anyone.
    - `loggingService` and `monitoringService` default to GKE's own managed values on a
      correctly configured cluster, only an explicit `none` is a violation, an empty or null
      value from a very old cluster API version is not the same thing and is not checked here.
    - The service account only needs read access. This blueprint never calls an API that
      modifies the cluster, there is no remediation step because the Kestra GKE plugin has no
      task to drain, resize, or recreate a node pool, that has to be done with `gcloud` or the
      console.

    ## Links

    - [GCP plugin documentation](https://kestra.io/plugins/plugin-gcp)
    - [GKE Cluster resource reference](https://cloud.google.com/kubernetes-engine/docs/reference/rest/v1/projects.locations.clusters)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Policy & Compliance
  ee: false
  demo: false
