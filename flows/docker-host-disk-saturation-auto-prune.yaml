id: docker-host-disk-saturation-auto-prune
namespace: company.team

description: |
  Inspects Docker host storage headroom, identifies dangling build cache and stopped
  containers when disk utilisation crosses an operational threshold, triggers an automated
  system prune, pauses for filesystem sync, verifies disk reclamation, and notifies Slack
  on successful recovery or escalates if disk pressure persists.

inputs:
  - id: disk_usage_threshold_percent
    type: INT
    displayName: Disk Threshold (%)
    description: Storage utilisation percentage on the Docker data mount that triggers cleanup.
    defaults: 80
    min: 50
    max: 95

  - id: docker_data_mount
    type: STRING
    displayName: Docker Data Directory
    description: Host mount path where Docker stores container layers, volumes, and images.
    defaults: "/var/lib/docker"

  - id: build_cache_keep_hours
    type: INT
    displayName: Build Cache Retention (hours)
    description: Evict builder cache older than this age during remediation.
    defaults: 48
    min: 1
    max: 720

  - id: stabilisation_wait_seconds
    type: INT
    displayName: Post-Prune Wait (seconds)
    description: Seconds to wait after cleanup before measuring reclaimed storage.
    defaults: 15
    min: 5
    max: 120

  - id: dry_run
    type: BOOL
    displayName: Dry Run
    description: When true, audits reclaimable storage without evicting containers or images.
    defaults: true

variables:
  slack_webhook: "{{ secret('SLACK_WEBHOOK_URL') }}"

tasks:
  - id: inspect_storage_headroom
    type: io.kestra.plugin.scripts.shell.Commands
    description: Check filesystem capacity on the Docker mount and probe reclaimable engine space.
    commands:
      - |
        set -e
        MOUNT="{{ inputs.docker_data_mount }}"
        if [ ! -d "${MOUNT}" ]; then
          MOUNT="/var/lib"
        fi

        # Obtain percentage used (integer without % sign)
        PCT=$(df -Pk "${MOUNT}" | awk 'NR==2 {gsub("%","",$5); print $5}')
        TOTAL_GB=$(df -BG "${MOUNT}" | awk 'NR==2 {gsub("G","",$2); print $2}')
        AVAIL_GB=$(df -BG "${MOUNT}" | awk 'NR==2 {gsub("G","",$4); print $4}')

        echo "Docker mount [${MOUNT}] is currently ${PCT}% utilized (${AVAIL_GB}GB available of ${TOTAL_GB}GB)."

        # Query Docker system df for reclaimable summaries if docker CLI is available
        RECLAIMABLE_MB=0
        if command -v docker >/dev/null 2>&1; then
          docker system df || true
        fi

        echo "::{ \"outputs\": { \"used_percent\": ${PCT}, \"avail_gb\": ${AVAIL_GB}, \"total_gb\": ${TOTAL_GB} } }::"

  - id: check_remediation_needed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_storage_headroom.vars.used_percent | int >= inputs.disk_usage_threshold_percent }}"
    then:
      - id: evaluate_dry_run
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.dry_run == false }}"
        then:
          - id: prune_docker_engine
            type: io.kestra.plugin.scripts.shell.Commands
            description: Evict stopped containers, unused networks, dangling images, and stale build cache.
            commands:
              - |
                set -e
                echo "Executing automated Docker system prune..."
                docker container prune -f
                docker network prune -f
                docker image prune -a -f --filter "until={{ inputs.build_cache_keep_hours }}h"
                docker builder prune -f --filter "until={{ inputs.build_cache_keep_hours }}h" || true
                echo "Docker prune commands completed."

          - id: wait_for_fs_sync
            type: io.kestra.plugin.core.flow.Sleep
            duration: "PT{{ inputs.stabilisation_wait_seconds }}S"

          - id: verify_disk_recovery
            type: io.kestra.plugin.scripts.shell.Commands
            description: Re-read filesystem utilisation to verify if headroom was successfully recovered.
            commands:
              - |
                set -e
                MOUNT="{{ inputs.docker_data_mount }}"
                if [ ! -d "${MOUNT}" ]; then
                  MOUNT="/var/lib"
                fi

                NEW_PCT=$(df -Pk "${MOUNT}" | awk 'NR==2 {gsub("%","",$5); print $5}')
                NEW_AVAIL_GB=$(df -BG "${MOUNT}" | awk 'NR==2 {gsub("G","",$4); print $4}')
                OLD_AVAIL_GB={{ outputs.inspect_storage_headroom.vars.avail_gb }}
                FREED_GB=$((NEW_AVAIL_GB - OLD_AVAIL_GB))
                if [ ${FREED_GB} -lt 0 ]; then
                  FREED_GB=0
                fi

                echo "Post-cleanup utilisation: ${NEW_PCT}% (${NEW_AVAIL_GB}GB available). Space freed: ${FREED_GB}GB."
                echo "::{ \"outputs\": { \"new_used_percent\": ${NEW_PCT}, \"new_avail_gb\": ${NEW_AVAIL_GB}, \"freed_gb\": ${FREED_GB} } }::"

          - id: notify_remediation_outcome
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.verify_disk_recovery.vars.new_used_percent | int < inputs.disk_usage_threshold_percent }}"
            then:
              - id: notify_remediation_success
                type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
                url: "{{ vars.slack_webhook }}"
                payload: |
                  {"text": "✅ *Docker host disk self-healing succeeded* — storage utilization reduced from `{{ outputs.inspect_storage_headroom.vars.used_percent }}%` to `{{ outputs.verify_disk_recovery.vars.new_used_percent }}%` (`{{ outputs.verify_disk_recovery.vars.freed_gb }} GB` recovered)."}
            else:
              - id: notify_disk_escalation
                type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
                url: "{{ vars.slack_webhook }}"
                payload: |
                  {"text": "🔴 *Docker host storage escalation required* — utilization remains high at `{{ outputs.verify_disk_recovery.vars.new_used_percent }}%` despite automated prune. Active volumes or non-Docker processes require manual disk expansion."}
        else:
          - id: notify_dry_run_findings
            type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
            url: "{{ vars.slack_webhook }}"
            payload: |
              {"text": "⚠️ *Docker host disk saturation detected (dry run)* — mount `{{ inputs.docker_data_mount }}` is at `{{ outputs.inspect_storage_headroom.vars.used_percent }}%` (threshold: `{{ inputs.disk_usage_threshold_percent }}%`). Run with `dry_run=false` to execute automated image/layer prune."}
    else:
      - id: notify_storage_healthy
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ vars.slack_webhook }}"
        payload: |
          {"text": "✅ *Docker storage headroom OK* — disk utilization is `{{ outputs.inspect_storage_headroom.vars.used_percent }}%`, well below the `{{ inputs.disk_usage_threshold_percent }}%` alert threshold."}

errors:
  - id: alert_flow_error
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ vars.slack_webhook }}"
    payload: |
      {"text": "🔴 *Docker storage auto-prune flow encountered an error* — execution `{{ execution.id }}` failed. Check Kestra execution logs."}

triggers:
  - id: periodic_storage_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"
    disabled: true

extend:
  title: "Docker Host Disk Saturation and Dangling Image Auto-Prune"
  description: |
    Monitors Docker host storage utilization, automatically prunes dangling images, stopped
    containers, and stale build caches when disk usage exceeds safety thresholds, validates
    headroom recovery, and alerts Slack on remediation or escalation.

    ## How it works

    1. `inspect_storage_headroom` runs `df -Pk` on the designated Docker data directory
       (`inputs.docker_data_mount`, defaulting to `/var/lib/docker`) and captures percentage used
       alongside available capacity in gigabytes.
    2. `check_remediation_needed` compares current disk utilization against `inputs.disk_usage_threshold_percent`.
       - If utilization is below threshold, `notify_storage_healthy` posts a clean status confirmation.
       - If utilization exceeds threshold and `dry_run=true`, `notify_dry_run_findings` issues a warning
         without evicting any containers or image layers.
       - If utilization exceeds threshold and `dry_run=false`, `prune_docker_engine` executes
         `docker container prune`, `docker network prune`, and timestamp-filtered `docker image prune`
         and `docker builder prune`.
    3. `wait_for_fs_sync` pauses execution for `stabilisation_wait_seconds` to allow kernel filesystem
       drivers to reclaim released ext4/xfs data blocks.
    4. `verify_disk_recovery` measures storage utilization post-remediation and computes exact gigabytes freed.
    5. `notify_remediation_outcome` branches on the post-cleanup percentage:
       - If below threshold, `notify_remediation_success` confirms incident resolution.
       - If still above threshold, `notify_disk_escalation` flags persistent storage pressure for SRE intervention.
    6. `alert_flow_error` catches execution failures with contextual execution metadata.
    7. `periodic_storage_audit` triggers the flow every 2 hours; shipped disabled by default.

    ## What you get

    - Automated prevention of `No space left on device` failures on container host instances.
    - Controlled builder cache eviction retaining actively reused layers up to `build_cache_keep_hours`.
    - Closed-loop verification confirming that automated cleanup actually brought utilization below threshold.
    - Dry-run capability allowing infrastructure engineers to audit storage usage safely.

    ## Who it's for

    - DevOps, SRE, and Platform engineers maintaining dedicated Docker hosts, runner pools, or CI agents.

    ## Why orchestrate this with Kestra

    - Declarative automation replacing ad-hoc cron scripts that fail silently without Slack notifications.
    - Real-time visibility into disk utilization trends and reclaimed storage across cluster worker nodes.
    - Safe conditional branching separating automated remediation from manual escalation.

    ## Prerequisites

    - A Kestra worker running with access to the Docker daemon socket (`/var/run/docker.sock`) or host CLI.
    - A Slack incoming webhook configured as a secret.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for operational alerts.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint and run an execution with `dry_run=true` to evaluate current disk utilization.
    3. Enable the scheduled trigger once verified.

    ## How to extend

    - Add an AWS EBS volume modification task (`io.kestra.plugin.aws.cli`) to dynamically resize the root EBS volume if prune does not reclaim sufficient space.
    - Forward reclaimed metrics to Datadog or Prometheus via Kestra HTTP tasks.

    ## Links

    - [Kestra Shell Commands Plugin](https://kestra.io/plugins/plugin-script-shell)
    - [Docker System Prune Reference](https://docs.docker.com/reference/cli/docker/system/prune/)

  tags:
    - Infrastructure
    - System
  subTags:
    - Self-Healing
    - Monitoring & Alerting
  ee: false
  demo: false
