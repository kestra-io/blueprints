id: hashicorp-vault-pki-root-intermediate-ca-expiration-sentinel
namespace: company.security

inputs:
  - id: vault_addr
    type: STRING
    defaults: "http://vault.internal:8200"
    description: Base URL of Vault server.
  - id: pki_mount
    type: STRING
    defaults: "pki"
    description: PKI secrets engine mount path.

tasks:
  - id: inspect_ca_expiration
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Fetch CA certificate and calculate remaining validity days
        curl -s -H "X-Vault-Token: {{ secret('VAULT_TOKEN') }}"           "{{ inputs.vault_addr }}/v1/{{ inputs.pki_mount }}/ca/pem" > /tmp/vault_ca.pem
        
        EXPIRY_DATE=$(openssl x509 -enddate -noout -in /tmp/vault_ca.pem | cut -d= -f2)
        
        DAYS_REMAINING=$(python3 -c "import datetime; from email.utils import parsedate_to_datetime; print((parsedate_to_datetime('$EXPIRY_DATE') - datetime.datetime.now(datetime.timezone.utc)).days)" 2>/dev/null || echo 999)
        echo "::set-output name=days_remaining::$DAYS_REMAINING::"

  - id: evaluate_ca_expiration
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_ca_expiration.vars.days_remaining | int < 60 }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#security-ops",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Vault PKI CA Expiration Warning",
                "text": "Vault PKI mount `{{ inputs.pki_mount }}` CA certificate expires in *{{ outputs.inspect_ca_expiration.vars.days_remaining }} days*! CA expiration will invalidate all downstream leaf TLS certificates across the enterprise.",
                "footer": "Kestra Security Sentinel • HashiCorp Vault PKI"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#security-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Vault PKI Sentinel Failure",
            "text": "Failed to inspect Vault PKI CA certificate. Verify vault address and mount path.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true

extend:
  title: HashiCorp Vault PKI Engine Root and Intermediate CA Expiration Sentinel
  shortDescription: Audits HashiCorp Vault PKI secrets engine for Root and Intermediate CA certificate expirations within 60 days.
  description: |
    ## How it works
    This workflow connects to the HashiCorp Vault PKI secrets engine (`/v1/{mount}/ca/pem`) to extract active Root or Intermediate Certificate Authority (CA) certificates. In zero-trust mTLS architectures, Vault issues dynamic leaf certificates to microservices and Kubernetes pods. If the issuing CA certificate expires, all active leaf certificates instantly fail cryptographic chain validation, resulting in enterprise-wide mTLS connection refusal. The workflow parses certificate expiration attributes using standard OpenSSL tools and alerts security leads when the CA approaches its final 60 days of validity.

    ## What you get
    - Proactive visibility into critical Certificate Authority expirations.
    - Prevents catastrophic zero-trust mTLS communication outages.
    - Actionable metrics on exact remaining validity days.

    ## Who it's for
    - Cryptographic Security Engineers and DevSecOps Architects.
    - Infrastructure Platform Leads managing HashiCorp Vault PKI.

    ## Why orchestrate this with Kestra
    - **Continuous Cryptographic Governance**: Automates CA lifecycle audits on a weekly schedule.
    - **Secure Credential Injection**: Injects Vault tokens safely using Kestra secret store.
    - **Direct Team Alerts**: Escalates expiration timelines directly to security channels.

    ## Prerequisites
    - HashiCorp Vault cluster with PKI mount enabled.
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Vault server address and PKI mount path.
    3. Run the workflow to inspect CA certificate expiration.

    ## How to extend
    - Automate intermediate CA certificate renewal via Vault PKI API.
    - Audit CRL (Certificate Revocation List) expiration simultaneously.

    ## Links
    - [Vault PKI Secrets Engine Documentation](https://developer.hashicorp.com/vault/docs/secrets/pki)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
