id: hashicorp-vault-pki-root-intermediate-ca-expiration-sentinel
namespace: company.team
description: Audits HashiCorp Vault PKI secrets engine for Root and Intermediate CA certificate expirations within 60 days.

inputs:
  - id: vault_addr
    type: STRING
    defaults: "http://vault.internal:8200"
    description: Base URL of Vault server.

  - id: pki_mount
    type: STRING
    defaults: "pki"
    description: PKI secrets engine mount path.

  - id: warning_threshold_days
    type: INT
    defaults: 60
    description: Days remaining threshold before alerting on CA expiration.

tasks:
  - id: inspect_ca_expiration
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests cryptography kestra
    description: Fetch CA certificate and calculate remaining validity days
    env:
      VAULT_ADDR: "{{ inputs.vault_addr }}"
      PKI_MOUNT: "{{ inputs.pki_mount }}"
      WARNING_THRESHOLD_DAYS: "{{ inputs.warning_threshold_days }}"
      VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
    script: |
      import os
      import sys
      import datetime
      import requests
      from cryptography import x509
      from cryptography.hazmat.backends import default_backend
      from kestra import Kestra

      vault_addr = os.environ.get("VAULT_ADDR", "http://vault.internal:8200").rstrip("/")
      pki_mount = os.environ.get("PKI_MOUNT", "pki").strip("/")
      threshold_days = int(os.environ.get("WARNING_THRESHOLD_DAYS", "60"))
      token = os.environ.get("VAULT_TOKEN")

      headers = {"User-Agent": "Kestra-Vault-Sentinel"}
      if token:
          headers["X-Vault-Token"] = token

      url = f"{vault_addr}/v1/{pki_mount}/ca/pem"
      try:
          resp = requests.get(url, headers=headers, timeout=30)
          resp.raise_for_status()
          pem_bytes = resp.content
      except Exception as e:
          print(f"CRITICAL: Failed to retrieve CA cert from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      try:
          cert = x509.load_pem_x509_certificate(pem_bytes, default_backend())
          not_after = getattr(cert, "not_valid_after_utc", None)
          if not_after is None:
              not_after = cert.not_valid_after.replace(tzinfo=datetime.timezone.utc)
          now = datetime.datetime.now(datetime.timezone.utc)
          days_left = (not_after - now).days
      except Exception as e:
          print(f"CRITICAL: Failed to parse X.509 certificate: {e}", file=sys.stderr)
          sys.exit(1)

      alert_needed = days_left < threshold_days
      print(f"CA Cert on {pki_mount} expires in {days_left} days (notAfter: {not_after.isoformat()})")

      Kestra.outputs({
          "mount": pki_mount,
          "expiration_date": not_after.isoformat(),
          "days_remaining": days_left,
          "alert_triggered": alert_needed
      })

  - id: evaluate_ca_expiration
    type: io.kestra.plugin.core.flow.If
    description: Alert security team if CA expires within threshold
    condition: "{{ outputs.inspect_ca_expiration.vars.alert_triggered == true }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#security-ops",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Vault PKI CA Expiration Warning",
                "text": "Vault PKI mount `{{ inputs.pki_mount }}` CA certificate expires in *{{ outputs.inspect_ca_expiration.vars.days_remaining }} days*! CA expiration will invalidate all downstream leaf TLS certificates across the enterprise.",
                "footer": "Kestra Security Sentinel • HashiCorp Vault PKI"
              }
            ]
          }

outputs:
  - id: days_remaining
    type: INT
    value: "{{ outputs.inspect_ca_expiration.vars.days_remaining }}"
  - id: expiration_date
    type: STRING
    value: "{{ outputs.inspect_ca_expiration.vars.expiration_date }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.inspect_ca_expiration.vars.alert_triggered }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#security-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Vault PKI Sentinel Failure",
            "text": "Failed to inspect Vault PKI CA certificate on {{ inputs.vault_addr }} during execution `{{ execution.id }}`. Verify vault address and mount path.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true

extend:
  metaDescription: Audits HashiCorp Vault PKI secrets engine for Root and Intermediate CA certificate expirations within 60 days.
  metaTitle: HashiCorp Vault PKI Engine Root and Intermediate CA Expiration Sentinel with Kestra
  title: HashiCorp Vault PKI Engine Root and Intermediate CA Expiration Sentinel
  shortDescription: Audits HashiCorp Vault PKI secrets engine for Root and Intermediate CA certificate expirations within 60 days.
  description: |
    ## How it works
    This workflow connects to the HashiCorp Vault PKI secrets engine (`/v1/{mount}/ca/pem`) to extract active Root or Intermediate Certificate Authority (CA) certificates. In zero-trust mTLS architectures, Vault issues dynamic leaf certificates to microservices and Kubernetes pods. If the issuing CA certificate expires, all active leaf certificates instantly fail cryptographic chain validation. The workflow alerts security leads when the CA approaches its final 60 days of validity.

    ## What you get
    - Proactive visibility into critical Certificate Authority expirations.
    - Prevents catastrophic zero-trust mTLS communication outages.
    - Actionable metrics on exact remaining validity days.

    ## Who it's for
    - Cryptographic Security Engineers and DevSecOps Architects.
    - Infrastructure Platform Leads managing HashiCorp Vault PKI.

    ## Prerequisites
    - HashiCorp Vault cluster with PKI mount enabled.
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Security
  ee: false
  demo: false
