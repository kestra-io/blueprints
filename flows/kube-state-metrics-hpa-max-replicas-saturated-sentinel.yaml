id: kube-state-metrics-hpa-max-replicas-saturated-sentinel
namespace: company.k8s

inputs:
  - id: ksm_metrics_url
    type: STRING
    defaults: "http://kube-state-metrics.monitoring:8080/metrics"
    description: Prometheus scrape endpoint for kube-state-metrics.

tasks:
  - id: query_saturated_hpas
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    script: |
      import sys
      import re
      import requests
      from kestra import Kestra

      url = "{{ inputs.ksm_metrics_url }}"
      print(f"Scraping kube-state-metrics from {url}...")
      try:
          resp = requests.get(url, timeout=15)
          resp.raise_for_status()
          text = resp.text
      except Exception as e:
          print(f"ERROR: Failed to scrape kube-state-metrics at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      cur = dict(re.findall(r'kube_horizontalpodautoscaler_status_current_replicas\{.*?hpa="([^"]+)".*?\}\s+([0-9]+)', text))
      mx = dict(re.findall(r'kube_horizontalpodautoscaler_spec_max_replicas\{.*?hpa="([^"]+)".*?\}\s+([0-9]+)', text))

      saturated_hpas = [h for h, c in cur.items() if h in mx and int(c) >= int(mx[h])]
      saturated_count = len(saturated_hpas)

      print(f"Evaluated {len(cur)} HPAs: {saturated_count} saturated at maxReplicas: {saturated_hpas}")
      Kestra.outputs({
          "saturated_count": saturated_count,
          "saturated_hpas": saturated_hpas
      })

  - id: evaluate_hpa_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_saturated_hpas.vars.saturated_count | int > 0 }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#k8s-platform",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kubernetes HPA Max Replicas Saturated Alert",
                "text": "Cluster has *{{ outputs.query_saturated_hpas.vars.saturated_count }} HPA deployment(s)* operating at their absolute maximum replica ceiling (`maxReplicas`): {{ outputs.query_saturated_hpas.vars.saturated_hpas }}. Workloads can no longer scale horizontally to absorb incoming traffic surges.",
                "footer": "Kestra Platform Sentinel • Kubernetes HPA"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#k8s-platform",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Kubernetes HPA Sentinel Failure",
            "text": "Failed to scrape kube-state-metrics endpoint. Verify monitoring service reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: saturated_count
    type: INT
    description: Count of HPA deployments saturated at maxReplicas.
    value: "{{ outputs.query_saturated_hpas.vars.saturated_count }}"
  - id: saturated_hpas
    type: ARRAY
    description: List of names of saturated HPA deployments.
    value: "{{ outputs.query_saturated_hpas.vars.saturated_hpas }}"

extend:
  metaDescription: "Audits Kubernetes HPA resources to detect workloads operating at maximum replica limits unable to handle further traffic surges."
  metaTitle: Kubernetes Horizontal Pod Autoscaler (HPA) Maximum Replicas Ceiling Sentinel with Kestra
  title: Kubernetes Horizontal Pod Autoscaler (HPA) Maximum Replicas Ceiling Sentinel
  shortDescription: Audits Kubernetes HPA resources to detect workloads operating at maximum replica limits unable to handle further traffic surges.
  description: |
    ## How it works
    This workflow scrapes `kube-state-metrics` (`:8080/metrics`) to compare `kube_horizontalpodautoscaler_status_current_replicas` against `kube_horizontalpodautoscaler_spec_max_replicas`. The Kubernetes Horizontal Pod Autoscaler (HPA) automatically adjusts replica counts based on observed CPU or custom metric metrics. When demand pushes a deployment to its configured `maxReplicas` limit, the autoscaler cannot provision additional pods. If traffic continues to rise, existing pods experience severe CPU throttling, queuing delays, and eventual pod crashes. This blueprint identifies saturated HPAs and dispatches proactive alerts.

    ## What you get
    - Real-time detection of saturated Kubernetes autoscaling limits.
    - Prevents service degradation during traffic surges by exposing capacity ceilings.
    - Comprehensive cluster-wide visibility across all namespaces.

    ## Who it's for
    - Kubernetes Platform Engineers and SREs managing cluster scaling configurations.
    - DevOps Teams responsible for application elasticity and capacity planning.

    ## Why orchestrate this with Kestra
    - **Continuous Capacity Guard**: Audits HPA ceilings continuously without extra Prometheus rule sprawl.
    - **Decoupled Architecture**: Directly scrapes metrics without maintaining internal operators.
    - **Automated Incident Escalation**: Sends clear Slack notifications when workloads hit scaling limits.

    ## Prerequisites
    - kube-state-metrics installed in the cluster with metrics port accessible.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input kube-state-metrics URL.
    3. Run the workflow to inspect HPA scaling status.

    ## Links
    - [kube-state-metrics HPA Documentation](https://github.com/kubernetes/kube-state-metrics/blob/main/docs/horizontalpodautoscaler-metrics.md)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Kubernetes Operations
    - Day 2 Operations
  ee: false
  demo: false
