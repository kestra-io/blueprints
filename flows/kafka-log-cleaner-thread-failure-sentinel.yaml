id: kafka-log-cleaner-thread-failure-sentinel
namespace: company.data

inputs:
  - id: kafka_broker_host
    type: STRING
    defaults: "kafka-0.internal"
    description: Apache Kafka broker hostname or IP address.
  - id: kafka_jmx_exporter_port
    type: INT
    defaults: 9404
    description: Prometheus JMX Exporter port exposing Kafka broker metrics.

tasks:
  - id: scrape_log_cleaner_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s "http://{{ inputs.kafka_broker_host }}:{{ inputs.kafka_jmx_exporter_port }}/metrics" > /tmp/kafka_metrics.prom
        
        DEAD_CLEANER_THREADS=$(grep -E '^kafka_log_logcleaner_deadcleanerthreadcount' /tmp/kafka_metrics.prom | awk '{print $2}' | head -n1)
        DEAD_CLEANER_THREADS=${DEAD_CLEANER_THREADS:-0}
        
        CLEANER_MAX_BUFFER_USAGE=$(grep -E '^kafka_log_logcleaner_cleaner_buffer_utilization' /tmp/kafka_metrics.prom | awk '{print $2}' | head -n1)
        CLEANER_MAX_BUFFER_USAGE=${CLEANER_MAX_BUFFER_USAGE:-0}
        
        echo "::set-output name=dead_cleaner_threads::$DEAD_CLEANER_THREADS::"
        echo "::set-output name=buffer_utilization::$CLEANER_MAX_BUFFER_USAGE::"

  - id: evaluate_cleaner_threads
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scrape_log_cleaner_metrics.vars.dead_cleaner_threads | int > 0 }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#kafka-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kafka Log Cleaner Thread Failure Alert",
                "text": "Kafka broker `{{ inputs.kafka_broker_host }}` reported *{{ outputs.scrape_log_cleaner_metrics.vars.dead_cleaner_threads }}* dead log cleaner threads! Impact: Log compaction for compacted topics (changelogs, state stores, KSQL) has completely halted, leading to rapid disk bloat and consumer replay degradation.",
                "footer": "Kestra Streaming Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#kafka-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Kafka Log Cleaner Thread Failure Sentinel Pipeline Failure",
            "text": "Failed to scrape Kafka broker Prometheus JMX exporter. Verify host and port configuration.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Apache Kafka Log Cleaner Thread Failure Sentinel
  shortDescription: Audits Apache Kafka broker JMX/Prometheus metrics to detect dead log cleaner threads and log compaction failures.
  description: |
    ## How it works
    This workflow scrapes the Prometheus JMX exporter endpoint on an Apache Kafka broker, querying `kafka_log_logcleaner_deadcleanerthreadcount`. When log cleaner threads encounter corrupted record batches, unparseable headers, or out-of-memory conditions, they crash silently without failing the broker. Compacted topics stop compacting, ballooning disk utilization. When any dead cleaner thread is detected, Slack is alerted immediately.

    ## What you get
    - Immediate detection of silent Kafka log cleaner thread death.
    - Prevents disk saturation on brokers hosting high-throughput compacted topics.
    - Telemetry on buffer utilization and cleaner thread status.

    ## Who it's for
    - Kafka Administrators and Streaming Platform Engineers managing Kafka clusters.
    - SREs maintaining streaming architectures powered by Kafka Streams, Flink, or Debezium.

    ## Why orchestrate this with Kestra
    - **Native Metric Ingestion**: Scrape Prometheus/JMX metrics directly without external collector agents.
    - **Early Failure Detection**: Detect cleaner crashes before disk alerts fire.
    - **Automated Workflow Orchestration**: Trigger broker rolling restart or topic cleanup procedures.

    ## Prerequisites
    - Kafka broker with Prometheus JMX exporter enabled.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Specify the broker host and JMX exporter port.
    3. Run the flow to audit log cleaner thread status.

    ## How to extend
    - Scrape all brokers in a cluster sequentially or in parallel using EachParallel.
    - Trigger an automated rolling restart workflow via Kubernetes API when dead cleaner threads are confirmed.

    ## Links
    - [Apache Kafka Log Cleaner Documentation](https://kafka.apache.org/documentation/#compaction)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
