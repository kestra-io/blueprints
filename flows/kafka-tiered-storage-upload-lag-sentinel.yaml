id: kafka-tiered-storage-upload-lag-sentinel
namespace: company.streaming

inputs:
  - id: kafka_broker_metrics
    type: STRING
    defaults: "http://kafka.internal:9102/metrics"
    description: Prometheus metrics endpoint of the Kafka broker.
  - id: max_failed_tier_uploads
    type: INT
    defaults: 5
    description: "Maximum allowable remote storage segment copy failures before alerting (default 5)."

tasks:
  - id: inspect_tiered_storage
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    script: |
      import sys
      import requests
      from kestra import Kestra

      url = "{{ inputs.kafka_broker_metrics }}"
      print(f"Scraping tiered storage metrics from {url}...")
      try:
          resp = requests.get(url, timeout=15)
          resp.raise_for_status()
      except Exception as e:
          print(f"ERROR: Failed to scrape Kafka metrics from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      failed_uploads = 0.0
      found_metric = False

      for line in resp.text.splitlines():
          line = line.strip()
          if not line or line.startswith('#'):
              continue
          if 'RemoteLogManager' in line and 'RemoteCopyLagBytes' in line:
              parts = line.split()
              if len(parts) >= 2:
                  try:
                      val = float(parts[-1])
                      failed_uploads = max(failed_uploads, val)
                      found_metric = True
                  except ValueError:
                      pass

      if not found_metric:
          print(f"ERROR: RemoteLogManager RemoteCopyLagBytes metric not found in {url}", file=sys.stderr)
          sys.exit(1)

      is_breach = 1 if failed_uploads > {{ inputs.max_failed_tier_uploads }} else 0
      print(f"Tiered storage upload lag bytes: {failed_uploads}, is_breach: {is_breach}")
      Kestra.outputs({
          "failed_uploads": int(failed_uploads),
          "is_breach": is_breach
      })

  - id: evaluate_tier_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_tiered_storage.vars.is_breach | int == 1 }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kafka Tiered Storage Upload Stagnation Warning",
                "text": "Kafka broker has {{ outputs.inspect_tiered_storage.vars.failed_uploads }} remote log segment upload lag bytes (threshold {{ inputs.max_failed_tier_uploads }}). S3/GCS tiered storage upload is stalling, risking local SSD broker disk saturation.",
                "footer": "Kestra Streaming Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Kafka Tiered Storage Sentinel Failure",
            "text": "Failed to query tiered storage metrics on Kafka broker at {{ inputs.kafka_broker_metrics }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

outputs:
  - id: failed_uploads
    type: INT
    description: Remote log segment upload lag bytes.
    value: "{{ outputs.inspect_tiered_storage.vars.failed_uploads }}"
  - id: is_breach
    type: INT
    description: 1 if upload lag breached threshold, 0 otherwise.
    value: "{{ outputs.inspect_tiered_storage.vars.is_breach }}"

extend:
  metaDescription: "Audits Kafka RemoteLogManager metrics to detect tiered storage upload lag and prevent local broker disk exhaustion."
  metaTitle: Apache Kafka Tiered Storage Remote Segment Upload Lag Sentinel with Kestra
  ee: false
  demo: false
  title: Apache Kafka Tiered Storage Remote Segment Upload Lag Sentinel
  shortDescription: Audits Kafka RemoteLogManager metrics to detect tiered storage upload lag and prevent local broker disk exhaustion.
  description: |
    ## How it works
    This workflow connects to the Kafka broker Prometheus metrics interface (`/metrics` or JMX exporter) to audit the `RemoteCopyLagBytes` metric maintained by Kafka's `RemoteLogManager` (KIP-405 Tiered Storage). In tiered storage architectures, local log segments are asynchronously copied to remote cloud object stores (Amazon S3, Google Cloud Storage, Azure Blob). When cloud IAM authentication expires, network bandwidth saturates, or object storage API rate limits trigger 429s, remote upload lag accumulates. If local segment deletion is blocked, broker SSD volumes fill up, causing Kafka brokers to shut down. This sentinel audits remote upload lag and dispatches alerts before disks saturate.

    ## What you get
    - Real-time tracking of Kafka tiered storage remote log copy lag.
    - Protection against local broker SSD disk space exhaustion.
    - Automated Slack incident notifications detailing upload lag bytes.

    ## Who it's for
    - Streaming Platform Engineers operating Kafka clusters with KIP-405 Tiered Storage.
    - SREs safeguarding high-volume message broker disk headroom.
    - Cloud Infrastructure Architects optimizing long-term Kafka data lake storage.

    ## Why orchestrate this with Kestra
    - **Automated Metric Surveillance**: Periodically inspects internal storage metrics without extra daemon scripts.
    - **Native API Capabilities**: Interacts directly with standard Prometheus metrics endpoints.
    - **Incident Orchestration**: Notifies platform engineers directly in team collaboration channels.

    ## Prerequisites
    - Apache Kafka cluster with enabled Tiered Storage and metrics exporter.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK` secret to your namespace.
    3. Specify `kafka_broker_metrics` and `max_failed_tier_uploads`.
    4. Enable the schedule trigger for continuous tiered storage surveillance.

    ## How to extend
    - Inspect remote delete lag bytes to detect orphaned cloud segments.
    - Automatically scale local log segment retention periods.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [Apache Kafka KIP-405 Tiered Storage](https://cwiki.apache.org/confluence/display/KAFKA/KIP-405%3A+Kafka+Tiered+Storage)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - ELT & Data Landing
