id: meilisearch-database-index-size-disk-headroom-sentinel
namespace: company.search

inputs:
  - id: meilisearch_url
    type: STRING
    defaults: "http://meilisearch.internal:7700"
    description: Base URL of the Meilisearch instance.
  - id: max_database_size_gb
    type: INT
    defaults: 50
    description: "Maximum allowable database size in GB before alerting (default 50 GB)."

tasks:
  - id: inspect_meilisearch_stats
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Meilisearch global stats endpoint
        curl -s -H "Authorization: Bearer {{ secret('MEILISEARCH_MASTER_KEY') }}" \
          "{{ inputs.meilisearch_url }}/stats" > /tmp/meili_stats.json

        python3 -c "
        import json
        try:
            with open('/tmp/meili_stats.json') as f:
                data = json.load(f)
            db_size_bytes = data.get('databaseSize', 0)
            db_size_gb = db_size_bytes / (1024 ** 3)
            indexes = list(data.get('indexes', {}).keys())
            is_breach = 1 if db_size_gb > {{ inputs.max_database_size_gb }} else 0
            print(f'{is_breach}|{db_size_gb:.2f}|{len(indexes)}')
        except Exception:
            print('0|0|0')
        " > /tmp/meili_parsed.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/meili_parsed.txt)
        DB_SIZE_GB=$(cut -d '|' -f 2 /tmp/meili_parsed.txt)
        INDEX_COUNT=$(cut -d '|' -f 3 /tmp/meili_parsed.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=db_size_gb::$DB_SIZE_GB::"
        echo "::set-output name=index_count::$INDEX_COUNT::"

  - id: evaluate_storage_headroom
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_meilisearch_stats.vars.is_breach | int == 1 }}"
    then:
      - id: notify_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#search-infra-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Meilisearch Storage Headroom Warning",
                "text": "Meilisearch database size has reached {{ outputs.inspect_meilisearch_stats.vars.db_size_gb }} GB across {{ outputs.inspect_meilisearch_stats.vars.index_count }} indexes (threshold {{ inputs.max_database_size_gb }} GB). Risk of LMDB max-indexing-memory exhaustion.",
                "footer": "Kestra Search Engine Sentinel • Meilisearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#search-infra-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Meilisearch Sentinel Failure",
            "text": "Failed to connect to Meilisearch endpoint at {{ inputs.meilisearch_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: Meilisearch Database Index Size and Storage Headroom Sentinel
  shortDescription: Monitors Meilisearch search engine index size and disk headroom to prevent LMDB map size crashes.
  description: |
    ## How it works
    This workflow queries the Meilisearch administrative stats endpoint (`/stats`) using a secure Bearer token to inspect global database metrics. In Meilisearch, data is persisted using the LMDB embedded key-value store, which maps files directly into virtual memory. When index sizes approach physical storage boundaries or default LMDB memory caps, write operations fail with disk full errors. This sentinel computes total `databaseSize` in gigabytes, audits active indexes, and dispatches a Slack alert before capacity limits are violated.

    ## What you get
    - Continuous tracking of search index disk consumption.
    - Protection against sudden LMDB write failures and indexing stops.
    - Actionable capacity alerts with total index count and size in GB.

    ## Who it's for
    - Search infrastructure engineers running self-hosted Meilisearch instances.
    - Full-stack developers integrating instant search in e-commerce applications.
    - DevOps teams sizing persistent volume claims for search workloads.

    ## Why orchestrate this with Kestra
    - **Scheduled Telemetry**: Automates periodic health audits without external Prometheus exporters.
    - **Secure Secrets Management**: Safeguards Meilisearch master keys via Kestra's encrypted secret store.
    - **End-to-End Orchestraction**: Integrates with document indexing flows to verify capacity before bulk ingestion.

    ## Prerequisites
    - Meilisearch instance accessible over HTTP/HTTPS.
    - Master key configured in secret `MEILISEARCH_MASTER_KEY`.
    - Slack incoming webhook stored as `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Configure secrets `MEILISEARCH_MASTER_KEY` and `SLACK_WEBHOOK`.
    3. Set `meilisearch_url` and alert threshold `max_database_size_gb`.
    4. Enable the schedule trigger for hourly storage verification.

    ## How to extend
    - Inspect individual index document counts by querying `/indexes/{index_uid}/stats`.
    - Trigger an automated snapshot creation task before disk cleanup.
    - Automatically scale the underlying Kubernetes PersistentVolumeClaim via Kestra.

    ## Links
    - [Meilisearch Stats API](https://www.meilisearch.com/docs/reference/api/stats)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
