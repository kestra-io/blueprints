id: meilisearch-database-index-size-disk-headroom-sentinel
namespace: company.search

description: |
  Continuously monitors Meilisearch database size against disk allocation thresholds, alerting search infrastructure teams on Slack.

concurrency:
  limit: 1

inputs:
  - id: meilisearch_url
    type: STRING
    defaults: "http://meilisearch.internal:7700"
    description: Base URL of the Meilisearch instance.
  - id: max_database_size_gb
    type: INT
    defaults: 50
    description: "Maximum allowable database size in GB before alerting (default 50 GB)."

tasks:
  - id: inspect_meilisearch_stats
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Meilisearch global stats API to inspect LMDB database disk footprint.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      MEILISEARCH_URL: "{{ inputs.meilisearch_url }}"
      MAX_SIZE_GB: "{{ inputs.max_database_size_gb }}"
      MEILISEARCH_MASTER_KEY: "{{ secret('MEILISEARCH_MASTER_KEY') }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      base_url = os.environ.get("MEILISEARCH_URL", "http://meilisearch.internal:7700").rstrip("/")
      max_gb = float(os.environ.get("MAX_SIZE_GB", "50"))
      key = os.environ.get("MEILISEARCH_MASTER_KEY", "").strip()

      headers = {"Accept": "application/json"}
      if key:
          headers["Authorization"] = f"Bearer {key}"

      url = f"{base_url}/stats"
      print(f"Querying Meilisearch stats from {url}...")

      try:
          resp = requests.get(url, headers=headers, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"ERROR: Failed to query Meilisearch stats from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      db_size_bytes = data.get("databaseSize", 0)
      db_size_gb = round(db_size_bytes / (1024 ** 3), 2)
      indexes = list(data.get("indexes", {}).keys())
      index_count = len(indexes)
      is_breach = db_size_gb > max_gb

      print(f"Meilisearch DB size: {db_size_gb} GB, index count: {index_count}, breach: {is_breach}")

      Kestra.outputs({
          "is_breach": is_breach,
          "db_size_gb": db_size_gb,
          "index_count": index_count
      })

  - id: evaluate_storage_headroom
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_meilisearch_stats.vars.is_breach }}"
    then:
      - id: notify_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#search-infra-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Meilisearch Storage Headroom Warning",
                "text": "Meilisearch database size has reached {{ outputs.inspect_meilisearch_stats.vars.db_size_gb }} GB across {{ outputs.inspect_meilisearch_stats.vars.index_count }} indexes (threshold {{ inputs.max_database_size_gb }} GB). Risk of LMDB max-indexing-memory exhaustion.",
                "footer": "Kestra Search Engine Sentinel • Meilisearch"
              }
            ]
          }
    else:
      - id: log_storage_nominal
        type: io.kestra.plugin.core.log.Log
        message: "Meilisearch database size nominal: {{ outputs.inspect_meilisearch_stats.vars.db_size_gb }} GB (limit: {{ inputs.max_database_size_gb }} GB)."

outputs:
  - id: is_breach
    type: BOOLEAN
    value: "{{ outputs.inspect_meilisearch_stats.vars.is_breach }}"
  - id: db_size_gb
    type: NUMBER
    value: "{{ outputs.inspect_meilisearch_stats.vars.db_size_gb }}"
  - id: index_count
    type: INT
    value: "{{ outputs.inspect_meilisearch_stats.vars.index_count }}"

triggers:
  - id: scheduled_storage_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"
    disabled: true

extend:
  title: Meilisearch Database Index Size and Storage Headroom Sentinel
  metaTitle: Meilisearch Storage Headroom Sentinel | Kestra Blueprint
  shortDescription: Monitors Meilisearch database size against disk thresholds and alerts on Slack.
  metaDescription: Continuously monitors Meilisearch database size against disk allocation thresholds, alerting search infrastructure teams on Slack.
  description: |
    Continuously monitors Meilisearch database size against disk allocation thresholds, alerting search infrastructure teams on Slack.
  tags:
    - Data
    - Infrastructure
