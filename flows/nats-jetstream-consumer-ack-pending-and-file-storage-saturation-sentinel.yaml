id: nats-jetstream-consumer-ack-pending-and-file-storage-saturation-sentinel
namespace: company.messaging
description: 'Audits NATS JetStream cluster telemetry to detect unacknowledged message
  accumulation, consumer redelivery loops, and stream storage quota exhaustion.

  '
concurrency:
  limit: 1
inputs:
- id: nats_monitoring_url
  type: STRING
  displayName: NATS Monitoring Endpoint URL
  defaults: http://nats.messaging.svc.cluster.local:8222
  description: Base HTTP URL exposing NATS server monitoring endpoint and JetStream
    status API (/jsz).
- id: stream_name
  type: STRING
  displayName: JetStream Stream Name
  defaults: ORDERS_INGEST_STREAM
  description: Target NATS JetStream stream or subject partition under active reliability
    surveillance.
- id: max_unack_pending_threshold
  type: INT
  displayName: Max Unacknowledged Messages Threshold
  defaults: 2500
  description: Maximum allowable unacknowledged pending messages across consumers
    before dispatching alerts.
- id: lookback_minutes
  type: INT
  displayName: Lookback Period (Minutes)
  defaults: 15
  description: Time duration in minutes across which consumer delivery rates and storage
    fill are evaluated.
- id: alert_on_nats_failures
  type: BOOL
  displayName: Alert On NATS Failures
  defaults: true
  description: Toggle whether Slack alerts are dispatched upon detecting pending message
    accumulation or storage exhaustion.
tasks:
- id: scan_nats_jetstream_metrics
  type: io.kestra.plugin.scripts.python.Script
  description: Scrapes NATS JetStream HTTP monitoring API to calculate consumer pending
    message counts, redeliveries, and storage utilization.
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
  - pip install requests kestra
  env:
    NATS_MONITORING_URL: '{{ inputs.nats_monitoring_url }}'
    STREAM_NAME: '{{ inputs.stream_name }}'
    MAX_UNACK_PENDING: '{{ inputs.max_unack_pending_threshold }}'
    LOOKBACK_MINUTES: '{{ inputs.lookback_minutes }}'
  script: "import os\nimport sys\nimport datetime\nimport requests\nfrom kestra import\
    \ Kestra\n\nbase_url = os.environ.get(\"NATS_MONITORING_URL\", \"http://nats.messaging.svc.cluster.local:8222\"\
    ).rstrip(\"/\")\ntarget_stream = os.environ.get(\"STREAM_NAME\", \"ORDERS_INGEST_STREAM\"\
    )\nmax_unack_threshold = int(os.environ.get(\"MAX_UNACK_PENDING\", 2500))\nlookback_min\
    \ = int(os.environ.get(\"LOOKBACK_MINUTES\", 15))\n\naudit_time = datetime.datetime.now(datetime.timezone.utc).isoformat()\n\
    jsz_url = f\"{base_url}/jsz?streams=true&consumers=true\"\n\ntry:\n    resp =\
    \ requests.get(jsz_url, timeout=10)\n    resp.raise_for_status()\n    data = resp.json()\n\
    except Exception as err:\n    sys.stderr.write(f\"Failed to fetch live NATS metrics\
    \ from {jsz_url}: {err}\\n\")\n    sys.exit(1)\n\nstreams_list = data.get(\"streams\"\
    , [])\nif not streams_list and \"account_details\" in data:\n    for acc in data.get(\"\
    account_details\", []):\n        streams_list.extend(acc.get(\"streams\", []))\n\
    \ntarget_stream_data = None\nfor stm in streams_list:\n    if stm.get(\"name\"\
    ) == target_stream:\n        target_stream_data = stm\n        break\n\nif not\
    \ target_stream_data:\n    sys.stderr.write(f\"Error: Stream '{target_stream}'\
    \ not found in NATS JetStream metrics.\\n\")\n    sys.exit(1)\n\nstate = target_stream_data.get(\"\
    state\", {})\nconfig = target_stream_data.get(\"config\", {})\n\nmessages_stored_count\
    \ = state.get(\"messages\", 0)\nused_bytes = state.get(\"bytes\", 0)\nmax_bytes\
    \ = config.get(\"max_bytes\", -1)\n\nif max_bytes > 0:\n    storage_utilization_pct\
    \ = round((used_bytes / max_bytes) * 100.0, 2)\nelse:\n    storage_utilization_pct\
    \ = 0.0\n\nactive_consumers_count = state.get(\"consumer_count\", 0)\nconsumer_details\
    \ = target_stream_data.get(\"consumer_detail\", [])\n\ntotal_unack_pending = sum(c.get(\"\
    num_ack_pending\", 0) for c in consumer_details)\nconsumer_redeliveries_count\
    \ = sum(c.get(\"num_redelivered\", 0) for c in consumer_details)\n\nis_pending_high\
    \ = total_unack_pending > max_unack_threshold\nis_storage_critical = storage_utilization_pct\
    \ > 85.0\nis_redelivery_storm = consumer_redeliveries_count > 200\nis_alerting\
    \ = is_pending_high or is_storage_critical or is_redelivery_storm\n\nKestra.outputs({\n\
    \    \"total_unack_pending\": total_unack_pending,\n    \"consumer_redeliveries_count\"\
    : consumer_redeliveries_count,\n    \"storage_utilization_pct\": storage_utilization_pct,\n\
    \    \"active_consumers_count\": active_consumers_count,\n    \"messages_stored_count\"\
    : messages_stored_count,\n    \"is_alerting\": is_alerting,\n    \"audit_timestamp\"\
    : audit_time\n})\n"
  containerImage: python:3.11-slim
- id: evaluate_nats_threshold
  type: io.kestra.plugin.core.flow.If
  description: Evaluates whether NATS JetStream unacknowledged message backlog or
    storage utilization exceeds safety margins.
  condition: '{{ outputs.scan_nats_jetstream_metrics.vars.is_alerting and inputs.alert_on_nats_failures
    }}'
  then:
  - id: notify_slack_messaging_team
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-urgency incident notification to Messaging SRE channel
      detailing JetStream consumer stalls.
    url: '{{ secret(''SLACK_WEBHOOK_URL'') }}'
    payload: "{\n  \"channel\": \"#messaging-sre-alerts\",\n  \"username\": \"NATS\
      \ JetStream Sentinel\",\n  \"icon_emoji\": \":warning:\",\n  \"text\": \"*CRITICAL:\
      \ NATS JetStream Consumer Backpressure or Storage Saturation Detected*\\n*Stream:*\
      \ `{{ inputs.stream_name }}`\\n*Unack Pending Messages:* `{{ outputs.scan_nats_jetstream_metrics.vars.total_unack_pending\
      \ }}` (Threshold: `{{ inputs.max_unack_pending_threshold }}`)\\n*Consumer Redeliveries:*\
      \ `{{ outputs.scan_nats_jetstream_metrics.vars.consumer_redeliveries_count }}`\\\
      n*Storage Utilization:* `{{ outputs.scan_nats_jetstream_metrics.vars.storage_utilization_pct\
      \ }}%`\\n*Active Consumers:* `{{ outputs.scan_nats_jetstream_metrics.vars.active_consumers_count\
      \ }}`\\n*Timestamp:* `{{ outputs.scan_nats_jetstream_metrics.vars.audit_timestamp\
      \ }}`\\n*Runbook:* Check downstream consumer worker processing latency, inspect\
      \ Poison Pill messages triggering redelivery loops, and verify JetStream disk\
      \ storage PVC headroom.\"\n}\n"
  else:
  - id: log_nominal_nats_state
    type: io.kestra.plugin.core.log.Log
    description: Logs nominal telemetry when NATS JetStream consumer acknowledgments
      and stream storage remain within enterprise bounds.
    message: 'NOMINAL: NATS JetStream stream {{ inputs.stream_name }} healthy. Unack
      pending: {{ outputs.scan_nats_jetstream_metrics.vars.total_unack_pending }},
      Redeliveries: {{ outputs.scan_nats_jetstream_metrics.vars.consumer_redeliveries_count
      }}, Storage util: {{ outputs.scan_nats_jetstream_metrics.vars.storage_utilization_pct
      }}%.'
- id: emit_audit_manifest
  type: io.kestra.plugin.core.debug.Return
  description: Emits structured audit manifest for messaging reliability telemetry
    archives and architecture records.
  format: "{\n  \"flow_id\": \"{{ flow.id }}\",\n  \"stream_name\": \"{{ inputs.stream_name\
    \ }}\",\n  \"total_unack_pending\": {{ outputs.scan_nats_jetstream_metrics.vars.total_unack_pending\
    \ }},\n  \"consumer_redeliveries_count\": {{ outputs.scan_nats_jetstream_metrics.vars.consumer_redeliveries_count\
    \ }},\n  \"storage_utilization_pct\": {{ outputs.scan_nats_jetstream_metrics.vars.storage_utilization_pct\
    \ }},\n  \"active_consumers_count\": {{ outputs.scan_nats_jetstream_metrics.vars.active_consumers_count\
    \ }},\n  \"messages_stored_count\": {{ outputs.scan_nats_jetstream_metrics.vars.messages_stored_count\
    \ }},\n  \"is_alerting\": {{ outputs.scan_nats_jetstream_metrics.vars.is_alerting\
    \ }},\n  \"audit_timestamp\": \"{{ outputs.scan_nats_jetstream_metrics.vars.audit_timestamp\
    \ }}\"\n}\n"
triggers:
- id: periodic_nats_audit
  type: io.kestra.plugin.core.trigger.Schedule
  description: Executes automated NATS JetStream health audit on a recurring 15-minute
    schedule.
  cron: '*/15 * * * *'
  disabled: true
extend:
  title: NATS JetStream Consumer Ack Pending and Storage Saturation Sentinel
  metaTitle: NATS JetStream Consumer Ack Pending Sentinel Blueprint
  shortDescription: Audits NATS JetStream cluster telemetry to detect unacknowledged
    messages, consumer redeliveries, and storage exhaustion.
  metaDescription: Scrapes NATS JetStream monitoring API to track unacknowledged messages,
    redelivery storms, and stream storage fill with Slack alerting.
  description: "Production-grade messaging reliability watchdog that continuously\
    \ queries the NATS JetStream monitoring API. It tracks unacknowledged message\
    \ backlogs (`num_ack_pending`), detects message redelivery storms caused by failing\
    \ consumer workers, monitors disk storage quota consumption against stream limits,\
    \ and dispatches structured Slack alerts with runbook diagnostics before message\
    \ drops occur.\n\n## How it works\n1. A recurring schedule trigger wakes the flow\
    \ every 15 minutes to initiate NATS JetStream surveillance.\n2. A containerized\
    \ Python script polls the NATS server monitoring endpoint (`/jsz`) for stream\
    \ and consumer metrics.\n3. The script aggregates unacknowledged message counts\
    \ and redelivery events across active consumers.\n4. The script computes stream\
    \ storage quota utilization percentage against configured `max_bytes` thresholds.\n\
    5. A decision gate evaluates whether pending message queues or storage saturation\
    \ exceed enterprise reliability limits.\n6. When bottlenecks emerge, high-priority\
    \ notifications dispatch to Messaging SRE channels with diagnostic metrics and\
    \ runbooks.\n7. A structured audit manifest is emitted for enterprise compliance\
    \ records and message queue telemetry archives.\n\n## Architecture diagram\n```mermaid\n\
    flowchart TD\n    A[Schedule Trigger: Every 15 Mins] --> B[scan_nats_jetstream_metrics]\n\
    \    B --> C{evaluate_nats_threshold}\n    C -- Alert Triggered --> D[notify_slack_messaging_team]\n\
    \    C -- Nominal State --> E[log_nominal_nats_state]\n    D --> F[emit_audit_manifest]\n\
    \    E --> F[emit_audit_manifest]\n```\n\n## Architecture components\n- **Trigger\
    \ (`periodic_nats_audit`)**: Recurring cron schedule executing every 15 minutes\
    \ for proactive messaging surveillance.\n- **Scraper Task (`scan_nats_jetstream_metrics`)**:\
    \ Docker-isolated Python script polling NATS monitoring API with error handling.\n\
    - **Decision Gate (`evaluate_nats_threshold`)**: Evaluates unacknowledged message\
    \ counts and storage utilization against user thresholds.\n- **Notification Task\
    \ (`notify_slack_messaging_team`)**: Sends rich Slack alert with stream metrics,\
    \ redelivery counts, and runbooks.\n- **Compliance Manifest (`emit_audit_manifest`)**:\
    \ Emits structured JSON summary for messaging audit archives.\n\n## Key capabilities\n\
    - Continuous surveillance of unacknowledged message depth across all active JetStream\
    \ consumers.\n- Real-time detection of consumer poison-pill crashes through redelivery\
    \ rate monitoring.\n- Proactive tracking of stream disk quota utilization to prevent\
    \ write throttling.\n- Standardized Slack alerting with operational runbook instructions\
    \ for messaging administrators.\n\n## What you get\n- Real-time visibility into\
    \ NATS JetStream queue health and consumer processing efficiency.\n- Early detection\
    \ of stalled worker pods and infinite message redelivery loops.\n- Automated Slack\
    \ incident notifications with pending counts, storage percentages, and remediation\
    \ advice.\n- Clean compliance manifests recording stream messaging status for\
    \ SRE audit trails.\n\n## Who it's for\n- Message Queue Administrators managing\
    \ high-throughput NATS JetStream topologies.\n- Distributed Systems Engineers\
    \ operating event-driven microservices architectures.\n- Site Reliability Engineers\
    \ safeguarding low-latency asynchronous publish-subscribe backbones.\n- DevOps\
    \ Teams operating distributed stream consumers and real-time data pipelines.\n\
    \n## Why orchestrate this with Kestra\n- **Decoupled Architecture**: Queries standard\
    \ HTTP monitoring APIs without installing custom exporters.\n- **Deterministic\
    \ Scheduling**: Native cron scheduling ensures consistent surveillance without\
    \ cron daemon drift.\n- **Isolated Execution**: Runs Python scrapers inside isolated\
    \ Docker containers with pre-installed libraries.\n- **Enterprise Auditability**:\
    \ Generates structured execution histories and JSON manifests for regulatory reporting.\n\
    \n## Use cases\n- **Consumer Hang Detection**: Identify when consumer subscriber\
    \ instances hang and stop acknowledging processed messages.\n- **Stream Quota\
    \ Sizing**: Verify that stream `max_bytes` configuration accommodates extended\
    \ traffic peaks.\n- **Poison Pill Isolation**: Detect unprocessable messages that\
    \ cycle repeatedly through max delivery attempts.\n- **Cluster Disk Headroom Monitoring**:\
    \ Track persistent volume claim fill rates across NATS cluster nodes.\n\n## Inputs\n\
    | Name | Type | Default | Description |\n|---|---|---|---|\n| `nats_monitoring_url`\
    \ | STRING | `http://nats.messaging.svc.cluster.local:8222` | Base HTTP URL exposing\
    \ NATS server monitoring endpoint. |\n| `stream_name` | STRING | `ORDERS_INGEST_STREAM`\
    \ | Target NATS JetStream stream identifier under surveillance. |\n| `max_unack_pending_threshold`\
    \ | INT | `2500` | Maximum allowable unacknowledged pending messages before alerting.\
    \ |\n| `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes\
    \ for consumer telemetry. |\n| `alert_on_nats_failures` | BOOL | `true` | Toggle\
    \ Slack alert dispatch upon detecting pending backlog or storage fill. |\n\n##\
    \ Expected outputs\n- `{{ outputs.scan_nats_jetstream_metrics.vars.total_unack_pending\
    \ }}`: Total unacknowledged pending messages across consumers.\n- `{{ outputs.scan_nats_jetstream_metrics.vars.consumer_redeliveries_count\
    \ }}`: Cumulative count of message redelivery attempts.\n- `{{ outputs.scan_nats_jetstream_metrics.vars.storage_utilization_pct\
    \ }}`: Percentage of stream disk storage quota utilized.\n- `{{ outputs.scan_nats_jetstream_metrics.vars.active_consumers_count\
    \ }}`: Total number of active consumers bound to the stream.\n- `{{ outputs.scan_nats_jetstream_metrics.vars.is_alerting\
    \ }}`: Boolean flag indicating whether failure thresholds were breached.\n- `{{\
    \ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted\
    \ for compliance archives.\n\n## Prerequisites\n- NATS cluster deployed with JetStream\
    \ enabled and HTTP monitoring port 8222 active (`http_port: 8222`).\n- NATS monitoring\
    \ port reachable from the Kestra worker execution environment.\n- Docker daemon\
    \ running on the Kestra host to execute containerized Python tasks.\n\n### Secrets\n\
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Messaging SRE Slack\
    \ alerting channel.\n\n## Quick start\n1. Ensure NATS server configuration includes\
    \ `http_port: 8222` and JetStream is enabled.\n2. Configure the `SLACK_WEBHOOK_URL`\
    \ secret in your Kestra namespace settings.\n3. Specify your target stream name\
    \ in `stream_name`.\n4. Execute a manual test run via the Kestra UI to verify\
    \ metric ingestion.\n5. Enable the `periodic_nats_audit` trigger to establish\
    \ automated continuous surveillance.\n\n## Common pitfalls and troubleshooting\n\
    - **Ack Wait Exceeded**: High processing latency triggers `AckWait` timeouts causing\
    \ unnecessary redeliveries.\n- **MaxAckPending Sizing**: Too low `MaxAckPending`\
    \ caps consumer throughput; too high causes worker memory spikes.\n- **Discard\
    \ Policy Selection**: When stream fills, `DiscardNew` rejects incoming events\
    \ while `DiscardOld` prunes history.\n- **Authentication on /jsz**: If NATS monitoring\
    \ requires authentication, pass credentials in the scraper task headers.\n\n##\
    \ How to extend\n- **Automated Consumer Restart**: Trigger a Kubernetes restart\
    \ sub-flow for stalled consumer worker deployments.\n- **Dynamic Stream Quota\
    \ Scaling**: Chain a task to update stream `max_bytes` configuration via NATS\
    \ CLI.\n- **PagerDuty Escalation**: Escalate to on-call messaging engineers if\
    \ unacknowledged messages exceed 10,000.\n\n## Links\n- [Kestra Python Script\
    \ Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)\n- [Kestra\
    \ Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)\n- [NATS\
    \ JetStream Official Documentation and Architecture Guide](https://docs.nats.io/nats-concepts/jetstream)\n\
    - [NATS Server Monitoring Endpoint and API Reference](https://docs.nats.io/running-a-nats-service/configuration/monitoring)\n\
    - [NATS JetStream Tuning and Consumer Failure Recovery](https://docs.nats.io/nats-concepts/jetstream/consumers)\n"
  tags:
  - Infrastructure
  - Cloud
  subTags:
  - Monitoring & Alerting
  - Infrastructure Automation
  ee: false
  demo: false
outputs:
- id: total_unack_pending
  type: INT
  value: '{{ outputs.scan_nats_jetstream_metrics.vars.total_unack_pending }}'
- id: consumer_redeliveries_count
  type: INT
  value: '{{ outputs.scan_nats_jetstream_metrics.vars.consumer_redeliveries_count
    }}'
- id: storage_utilization_pct
  type: FLOAT
  value: '{{ outputs.scan_nats_jetstream_metrics.vars.storage_utilization_pct }}'
- id: active_consumers_count
  type: INT
  value: '{{ outputs.scan_nats_jetstream_metrics.vars.active_consumers_count }}'
- id: messages_stored_count
  type: INT
  value: '{{ outputs.scan_nats_jetstream_metrics.vars.messages_stored_count }}'
- id: is_alerting
  type: BOOLEAN
  value: '{{ outputs.scan_nats_jetstream_metrics.vars.is_alerting }}'
