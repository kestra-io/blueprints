id: teamcity-build-queue-stall-gate
namespace: company.team
description: |
  TeamCity queues that stall leave pending builds sitting for hours while
  nobody notices the artifact never arrives. An observer POSTs a queue
  snapshot with each build's state and queued duration to a keyed webhook,
  Python scores every queued build against a configurable SLA, and an If
  escalates only when builds have waited past it. Stalled queues alert Slack
  with the offending build types and can fail the run, while healthy or
  unreadable queues are logged. The verdict, the stall count, the oldest wait
  and the stalled build rows are published as outputs.

triggers:
  - id: on_queue_snapshot
    type: io.kestra.plugin.core.trigger.Webhook
    description: A TeamCity observer or polling job POSTs the build queue snapshot here so the stall gate runs as soon as the queue is captured.
    key: "{{ secret('TEAMCITY_QUEUE_WEBHOOK_KEY') }}"
  - id: hourly_queue_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Hourly fallback net that rescores the staged queue snapshot, shipped disabled until an operator switches it on.
    cron: "0 * * * *"
    disabled: true

inputs:
  - id: queue_sla_minutes
    type: INT
    defaults: 30
    description: Minutes a build may sit in the queued state before the gate counts it as stalled.
  - id: server_name
    type: STRING
    defaults: "teamcity.example.internal:8111"
    description: TeamCity server address echoed in alerts so estates running more than one server stay distinguishable.
  - id: fail_on_stall
    type: BOOL
    defaults: true
    description: Whether a stalled queue turns the execution red after the Slack alert, flip to false for report only runs.

tasks:
  # --- 1. queue workspace ---
  - id: queue_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the staged queue snapshot and the scorer read the same file for the whole run.
    tasks:
      # --- 2. queue fixture ---
      - id: stage_queue_snapshot
        type: io.kestra.plugin.scripts.shell.Commands
        description: Write a TeamCity queue snapshot with a heredoc, three queued builds where one has waited past the SLA plus a running build the scorer must ignore, so trial runs always have a queue to read.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          entryPoint: []
        containerImage: alpine:3.20
        commands:
          - |
            set -u
            cat > teamcity_queue.json <<'JSON'
            {
              "project": "platform-core",
              "builds": [
                {"id": 4312, "build_type": "Nightly Integration Tests", "state": "queued", "queued_minutes": 47},
                {"id": 4313, "build_type": "Deploy Service Catalog", "state": "queued", "queued_minutes": 4},
                {"id": 4314, "build_type": "Agent Health Probe", "state": "queued", "queued_minutes": 12},
                {"id": 4315, "build_type": "Nightly Performance Suite", "state": "running", "queued_minutes": 9}
              ]
            }
            JSON
            echo "staged $(wc -c < teamcity_queue.json) bytes of queue json"

      # --- 3. queue score ---
      - id: score_queue
        type: io.kestra.plugin.scripts.python.Script
        description: Keep the builds in the queued state, clamp negative waits to zero, flag every build whose wait reached the SLA, and emit the verdict, the stall count, the oldest wait and the stalled rows through the outputs protocol.
        containerImage: python:3.12-slim
        env:
          QUEUE_JSON: "{{ trigger.body ?? '' }}"
          QUEUE_SLA_MINUTES: "{{ inputs.queue_sla_minutes }}"
        script: |
          import json
          import os

          DEFAULT_QUEUE = """
          {
            "project": "platform-core",
            "builds": [
              {"id": 4312, "build_type": "Nightly Integration Tests", "state": "queued", "queued_minutes": 47},
              {"id": 4313, "build_type": "Deploy Service Catalog", "state": "queued", "queued_minutes": 4},
              {"id": 4314, "build_type": "Agent Health Probe", "state": "queued", "queued_minutes": 12},
              {"id": 4315, "build_type": "Nightly Performance Suite", "state": "running", "queued_minutes": 9}
            ]
          }
          """


          def as_int(value, fallback=0):
              try:
                  return int(value)
              except (TypeError, ValueError):
                  try:
                      return int(float(value))
                  except (TypeError, ValueError):
                      return fallback


          raw = (os.environ.get("QUEUE_JSON") or "").strip() or DEFAULT_QUEUE.strip()
          sla = max(1, as_int(os.environ.get("QUEUE_SLA_MINUTES"), 30))

          outputs = {
              "queue_ok": False,
              "queue_status": "UNKNOWN",
              "project": "unknown",
              "queued_count": 0,
              "stalled_count": 0,
              "oldest_queued_minutes": 0,
              "stalled_builds": [],
          }

          try:
              document = json.loads(raw)
          except ValueError:
              document = None

          if isinstance(document, dict):
              builds = document.get("builds")
              if not isinstance(builds, list):
                  builds = []
              queued = []
              stalled = []
              oldest = 0
              for build in builds:
                  if not isinstance(build, dict):
                      continue
                  if str(build.get("state") or "").strip().lower() != "queued":
                      continue
                  minutes = max(0, as_int(build.get("queued_minutes")))
                  row = {
                      "id": as_int(build.get("id"), -1),
                      "build_type": str(build.get("build_type") or "unknown"),
                      "queued_minutes": minutes,
                      "stalled": minutes >= sla,
                  }
                  queued.append(row)
                  if minutes > oldest:
                      oldest = minutes
                  if row["stalled"]:
                      stalled.append(row)
              outputs.update({
                  "queue_ok": True,
                  "queue_status": "STALLED" if stalled else "HEALTHY",
                  "project": str(document.get("project") or "unknown"),
                  "queued_count": len(queued),
                  "stalled_count": len(stalled),
                  "oldest_queued_minutes": oldest,
                  "stalled_builds": stalled,
              })

          print("queue_ok=%s status=%s queued=%d stalled=%d oldest=%d sla=%d" % (
              outputs["queue_ok"], outputs["queue_status"], outputs["queued_count"],
              outputs["stalled_count"], outputs["oldest_queued_minutes"], sla))
          print("::" + json.dumps({"outputs": outputs}) + "::")

  # --- 4. stall gate ---
  - id: stall_gate
    type: io.kestra.plugin.core.flow.If
    description: Branch on a parseable queue that actually stalled, so alerts and failure fire only when a build waited past the SLA.
    condition: "{{ outputs.score_queue.vars.queue_ok and outputs.score_queue.vars.stalled_count > 0 }}"
    then:
      # --- 5. stall escalation ---
      - id: alert_stall
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post the server, the stalled build count, the oldest wait and the stalled build types so the on call can free agents or rebalance the queue.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "TeamCity queue STALL on {{ inputs.server_name }} - {{ outputs.score_queue.vars.stalled_count }} build(s) pending past the {{ inputs.queue_sla_minutes }} minute SLA, oldest wait {{ outputs.score_queue.vars.oldest_queued_minutes }} minutes. Stalled builds {{ outputs.score_queue.vars.stalled_builds | map(attribute='build_type') | join(', ') }}. Agents are offline or the queue is starved. Execution {{ execution.id }}."
          }
      - id: enforce_gate
        type: io.kestra.plugin.core.flow.If
        description: Apply the fail_on_stall policy, turning the run red for gating pipelines and staying report only when the input is flipped off.
        condition: "{{ inputs.fail_on_stall }}"
        then:
          - id: fail_execution
            type: io.kestra.plugin.core.execution.Fail
            description: Fail the execution so the pipeline watching this gate stops instead of letting the queue drain silently.
            errorMessage: "TeamCity queue stalled with {{ outputs.score_queue.vars.stalled_count }} build(s) past the {{ inputs.queue_sla_minutes }} minute SLA, oldest wait {{ outputs.score_queue.vars.oldest_queued_minutes }} minutes."
        else:
          - id: log_gate_softened
            type: io.kestra.plugin.core.log.Log
            description: Record that the queue stalled but the fail policy is off, keeping the run green for report only estates.
            message: "TeamCity queue stall on {{ inputs.server_name }} not enforced - fail_on_stall is false, {{ outputs.score_queue.vars.stalled_count }} stalled build(s) alerted only."
    else:
      - id: log_queue_healthy
        type: io.kestra.plugin.core.log.Log
        description: Record the healthy or unreadable outcome so a quiet queue still leaves evidence the gate ran.
        message: "TeamCity queue on {{ inputs.server_name }} clear - {{ outputs.score_queue.vars.queued_count }} queued build(s), none past the {{ inputs.queue_sla_minutes }} minute SLA, oldest wait {{ outputs.score_queue.vars.oldest_queued_minutes }} minutes."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: stalled_count
    type: INT
    description: Number of queued builds whose wait reached the SLA, for example 1 when only the 47 minute nightly sat past the limit.
    value: "{{ outputs.score_queue.vars.stalled_count }}"
  - id: oldest_queued_minutes
    type: INT
    description: Longest wait among the queued builds in the snapshot, in minutes, whether or not it stalled.
    value: "{{ outputs.score_queue.vars.oldest_queued_minutes }}"
  - id: queue_status
    type: STRING
    description: Verdict string for the snapshot, one of STALLED, HEALTHY or UNKNOWN when the posted body could not be parsed.
    value: "{{ outputs.score_queue.vars.queue_status }}"
  - id: queued_count
    type: INT
    description: Builds found in the queued state in the scored snapshot, excluding running or finished builds.
    value: "{{ outputs.score_queue.vars.queued_count }}"
  - id: stalled_builds
    type: ARRAY
    description: Rows for every stalled build with id, build type, queued minutes and the stalled flag for ticket automation.
    value: "{{ outputs.score_queue.vars.stalled_builds }}"

extend:
  title: Catch TeamCity Queue Stalls Before Builds Time Out
  metaTitle: TeamCity Build Queue Stall Gate
  shortDescription: Score TeamCity queue snapshots against a SLA, alert Slack on stalled pending builds, and optionally fail the run.
  metaDescription: "Score TeamCity build queue snapshots against a configurable SLA, alert Slack when builds stall in the queue, and gate the pipeline in Kestra."
  description: |
    ## How it works

    1. `on_queue_snapshot` (`io.kestra.plugin.core.trigger.Webhook`, keyed with the `TEAMCITY_QUEUE_WEBHOOK_KEY` secret) receives the build queue snapshot from your TeamCity observer right after it polls the server. `hourly_queue_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 * * * *`) is the safety net and ships `disabled: true` until an operator turns it on.
    2. `queue_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared directory so the staged snapshot and the scorer read the same file.
    3. `stage_queue_snapshot` (`io.kestra.plugin.scripts.shell.Commands` on the `io.kestra.plugin.scripts.runner.docker.Docker` runner, image `alpine:3.20`) writes `teamcity_queue.json` with a heredoc holding three queued builds where one has waited 47 minutes, plus a running build that must not count toward the stall verdict.
    4. `score_queue` (`io.kestra.plugin.scripts.python.Script` on `python:3.12-slim`) prefers the posted webhook body and falls back to the staged snapshot, keeps only builds in the `queued` state, clamps negative waits to zero, and flags every build whose wait reached `queue_sla_minutes`. The verdict, the stall count, the oldest wait and the stalled rows are printed as a single `::{"outputs": ...}::` line.
    5. `stall_gate` (`io.kestra.plugin.core.flow.If`) branches on `queue_ok and stalled_count > 0`. A stall reaches `alert_stall` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) with the stalled build types, then `enforce_gate` (`io.kestra.plugin.core.flow.If`) applies the `fail_on_stall` policy with `fail_execution` (`io.kestra.plugin.core.execution.Fail`) or the report only `log_gate_softened`. A healthy or unreadable queue lands on `log_queue_healthy`.
    6. The flow level `errors` handler (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) reports any failure with the execution id, because a gate that dies silently looks exactly like a healthy queue.

    ## What you get

    - A per build stall verdict driven by one SLA input, so the gate adapts when your agents get faster or slower.
    - A Slack alert naming the stalled build types and the oldest wait, enough for the on call to free an agent without opening TeamCity first.
    - A fail versus report policy in one input, so the same flow gates the pipeline or feeds a weekly digest.
    - `stalled_count`, `oldest_queued_minutes`, `queue_status`, `queued_count` and `stalled_builds` as typed outputs for dashboards and ticket automation.
    - A disabled hourly sweep as a second net once the webhook path is trusted.

    ## Who it's for

    - Build engineers responsible for TeamCity agents who need pending builds surfaced before release deadlines slip.
    - SREs on call who want a queue stall to page the same channel as every other pipeline failure.
    - Platform teams standardizing release gates across CI servers with a flow that reads the same way as the rest of the estate.

    ## Why orchestrate this with Kestra

    TeamCity reports its queue in its own UI, which nobody watches at 2 a.m., and a stalled build looks identical to a slow one until the artifact misses its window. Kestra gives the snapshot a webhook to land on, a shared workspace for the fixture and the scorer, a branch that separates a stall from a healthy queue, a policy input for fail versus report, and outputs a dashboard or ticket can consume. The SLA, the escalation policy and the execution history that proves the gate ran all live in one version controlled file.

    ## Prerequisites

    - A worker with Docker access, the fixture runs in `alpine:3.20` and the scorer in `python:3.12-slim`.
    - A TeamCity observer or polling job that can POST the build queue snapshot, or rely on the bundled fixture for trial runs.
    - A Slack incoming webhook for the stall alert and for failure alerts.

    ### Secrets

    - `TEAMCITY_QUEUE_WEBHOOK_KEY`: key segment guarding the queue webhook URL, anyone holding it can trigger a gate run.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the stall alert and failure alerts.

    ## Quick start

    1. Add the two secrets to your Kestra namespace.
    2. Run the flow once with the default inputs and confirm `queue_status` reads STALLED, `stalled_count` reads 1, `oldest_queued_minutes` reads 47, and the Slack alert arrived.
    3. Raise `queue_sla_minutes` to 60 and re-run to watch the same snapshot pass as HEALTHY while the counters stay identical.
    4. Re-run with `fail_on_stall` set to false and watch `log_gate_softened` keep the execution green while the alert still fires.
    5. Point your observer at `/api/v1/{tenant}/executions/webhook/{namespace}/teamcity-build-queue-stall-gate/{TEAMCITY_QUEUE_WEBHOOK_KEY}` and enable `hourly_queue_sweep` once the path is trusted.

    ## How to extend

    - Pull the live queue yourself with an `io.kestra.plugin.core.http.Request` against the TeamCity REST API before scoring, keeping the staged fixture as the offline fallback.
    - Persist every snapshot with `io.kestra.plugin.jdbc.postgresql.Queries` to chart queue wait percentiles over weeks.
    - Fan out per project with `io.kestra.plugin.core.flow.ForEachItem` over a subflow that gates one project queue each.
    - File a ticket automatically with `io.kestra.plugin.github.issues.Create` when a stall repeats across consecutive runs.

    ## Links

    - [TeamCity REST API](https://www.jetbrains.com/help/teamcity/rest-api.html)
    - [Kestra If task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.if)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra Webhook trigger](https://kestra.io/docs/workflow-components/triggers/webhook)
  tags:
    - Infrastructure
  subTags:
    - ci/cd & deployment
    - monitoring & alerting
    - failure alerting
  ee: false
  demo: false
