id: gcp-vm-teardown-terraform-dns-cleanup
namespace: company.team
description: |
  Deprovision a Google Cloud VM with Terraform using the state written at
  provisioning time, then clean up its Active Directory computer account and
  forward/reverse DNS records via an Ansible playbook against the Windows DC.

inputs:
  - id: vmName
    type: STRING
    defaults: gcpdevlnxap08

  - id: ipAddress
    type: STRING
    defaults: 10.128.10.8

  - id: vmSize
    type: STRING
    defaults: n1-standard-1

  - id: zone
    type: STRING
    defaults: us-central1-a

  - id: billingAccount
    type: STRING
    description: GCP project ID.
    defaults: my-gcp-project

  - id: osFlavor
    type: STRING
    defaults: ubuntu-os-cloud/ubuntu-2204-lts

  - id: network
    type: STRING
    defaults: default

  - id: subnet
    type: STRING
    defaults: default

tasks:
  - id: deleteVM
    type: io.kestra.plugin.terraform.cli.TerraformCLI
    description: Destroy the VM from the state created at provisioning time.
    env:
      GOOGLE_APPLICATION_CREDENTIALS: gcp-svc-account.json
    inputFiles:
      gcp-svc-account.json: "{{ secret('GCP_SERVICE_ACCOUNT_JSON') }}"
      backend.tf: |
        terraform {
          backend "gcs" {
            # Replace with the state bucket used by your provisioning flow
            bucket = "my-terraform-state-bucket"
          }
        }
      main.tf: |
        # Must match the configuration used to provision the VM
        resource "google_compute_instance" "default" {
          name         = "{{ inputs.vmName }}"
          machine_type = "{{ inputs.vmSize }}"
          zone         = "{{ inputs.zone }}"
          project      = "{{ inputs.billingAccount }}"

          boot_disk {
            initialize_params {
              image = "{{ inputs.osFlavor }}"
            }
          }

          network_interface {
            network            = "{{ inputs.network }}"
            subnetwork         = "{{ inputs.subnet }}"
            subnetwork_project = "{{ inputs.billingAccount }}"
            access_config {}
            network_ip = "{{ inputs.ipAddress }}"
          }
        }
    beforeCommands:
      - terraform init -backend-config="prefix={{ inputs.vmName }}"
    commands:
      - terraform plan
      - terraform destroy -auto-approve -json
    assets:
      inputs:
        - id: "{{ inputs.vmName }}"
      outputs:
        - id: "{{ inputs.vmName }}"
          type: io.kestra.plugin.ee.assets.VM
          metadata:
            vmName: "{{ inputs.vmName }}"
            vmSize: "{{ inputs.vmSize }}"
            zone: "{{ inputs.zone }}"
            billingAccount: "{{ inputs.billingAccount }}"
            osFlavor: "{{ inputs.osFlavor }}"
            network: "{{ inputs.network }}"
            subnet: "{{ inputs.subnet }}"
            ipAddress: "{{ inputs.ipAddress }}"
            state: deleted

  - id: removeDNSentry
    type: io.kestra.plugin.ansible.cli.AnsibleCLI
    description: Remove the AD computer account and DNS records on the Windows DC.
    beforeCommands:
      - pip install pywinrm
    inputFiles:
      inventory.ini: |
        [windows_vms]
        {{ kv('dcConfig').externalIPAddress }}

        [windows_vms:vars]
        ansible_user={{ kv('dcConfig').username }}
        ansible_password="{{ secret('AD_ADMIN_PASSWORD') }}"
        ansible_connection=winrm
        ansible_port=5985
        ansible_winrm_server_cert_validation=ignore
        ansible_winrm_transport=ntlm
      removeDNSEntry-playbook.yml: |
        ---
        - name: Clean up AD and DNS for the removed VM
          hosts: windows_vms
          gather_facts: no
          tasks:
            - name: Remove AD computer account and DNS records
              ansible.windows.win_shell: |
                $ReverseZone = "{{ (kv('dcConfig').subnetCIDR | split('\.'))[1] }}.{{ (kv('dcConfig').subnetCIDR | split('\.'))[0] }}.in-addr.arpa"
                $ClientName  = "{{ inputs.vmName }}"
                $Domain      = "{{ kv('dcConfig').domainName }}"
                $PtrName     = "{{ (inputs.ipAddress | split('\.'))[3] }}.{{ (inputs.ipAddress | split('\.'))[2] }}"

                Write-Host "Removing $ClientName from Active Directory..."
                Get-ADComputer -Identity $ClientName -ErrorAction SilentlyContinue | Remove-ADComputer -Confirm:$false

                Write-Host "Deleting forward DNS record..."
                Remove-DnsServerResourceRecord -ZoneName $Domain -Name $ClientName -RRType "A" -Force -ErrorAction SilentlyContinue

                Write-Host "Deleting reverse DNS record..."
                Remove-DnsServerResourceRecord -ZoneName $ReverseZone -Name $PtrName -RRType "PTR" -Force -ErrorAction SilentlyContinue

                Write-Host "Cleanup complete for $ClientName."
              register: dns_script_output

            - name: Print output to Kestra logs
              debug:
                var: dns_script_output.stdout_lines
    commands:
      - ansible-playbook -i inventory.ini removeDNSEntry-playbook.yml

extend:
  shortDescription: "Deprovision a GCP VM with Terraform and clean up after it: AD computer account, forward DNS, and reverse DNS records removed via Ansible."
  title: GCP VM Teardown with Terraform and AD/DNS Cleanup
  metaTitle: GCP VM Teardown with Terraform, AD, and DNS Cleanup
  metaDescription: Destroy a GCP VM with Terraform from shared state, then remove its Active Directory account and DNS A/PTR records via Ansible over WinRM with Kestra.
  description: |
    Deleting a VM is the easy part; the orphaned AD computer account and stale DNS records are what bite you later. This blueprint does the full teardown: Terraform destroys the Google Cloud instance from the same remote state that provisioned it, the VM asset is flipped to `state: deleted`, and an Ansible playbook connects to your Windows domain controller over WinRM to remove the computer account, the forward `A` record, and the reverse `PTR` record.

    ## How it works
    1. The `deleteVM` task (`io.kestra.plugin.terraform.cli.TerraformCLI`) reconstructs the instance definition from the flow inputs, runs `terraform init -backend-config="prefix={{ inputs.vmName }}"` against a shared GCS backend so each VM has its own state prefix, and executes `terraform destroy -auto-approve -json`. Its `assets` block records lineage and marks the `io.kestra.plugin.ee.assets.VM` asset deleted.
    2. The `removeDNSentry` task (`io.kestra.plugin.ansible.cli.AnsibleCLI`) installs `pywinrm`, builds a WinRM inventory from the `dcConfig` KV record published by the domain controller deployment flow, and runs a playbook whose `ansible.windows.win_shell` task calls `Remove-ADComputer`, then `Remove-DnsServerResourceRecord` for both the `A` record in the domain zone and the `PTR` record in the computed `in-addr.arpa` reverse zone.
    3. Zone names and PTR labels are derived from `kv('dcConfig').subnetCIDR` and the VM's IP octets, so no DNS math is hardcoded.

    ## What you get
    - Symmetric teardown: the destroy consumes the exact Terraform state written at provisioning.
    - No orphaned AD objects or stale DNS entries after decommissioning.
    - Asset catalog updated to reflect the VM's deleted state.
    - All credentials (GCP key, AD admin password) pulled from secrets.

    ## Who it's for
    - Windows-integrated Linux estates where every VM is domain-joined and DNS-registered.
    - Platform teams pairing this with a provisioning flow for a complete VM lifecycle.
    - IT operations tired of cleaning up AD and DNS by hand after VM deletions.

    ## Why orchestrate this with Kestra
    Terraform knows nothing about your directory or DNS zones, and Ansible has no idea which Terraform state to touch. Kestra binds them: shared inputs drive both tools, the KV store carries the domain controller's connection details between flows, secrets stay out of playbooks, and the execution log proves that the instance, the AD account, and both DNS records were removed in one auditable run.

    ## Prerequisites
    - A GCS bucket holding the Terraform state written by your provisioning flow (prefix per VM name).
    - A Windows domain controller reachable over WinRM (port 5985) and a `dcConfig` KV record with `externalIPAddress`, `username`, `domainName`, and `subnetCIDR` (created by the companion AD controller blueprint).
    - Kestra Enterprise Edition for the Assets tracking (remove the `assets` block to run on OSS).

    ### Secrets
    - `GCP_SERVICE_ACCOUNT_JSON`: JSON key of the service account allowed to delete instances and read the state bucket.
    - `AD_ADMIN_PASSWORD`: password of the AD admin user Ansible connects with.

    ## Quick start
    1. Add the secrets above to your Kestra namespace.
    2. Replace the state bucket in `backend.tf` and align `main.tf` with your provisioning configuration.
    3. Ensure the `dcConfig` KV entry exists (deploy the AD controller blueprint first).
    4. Execute with the target `vmName` and `ipAddress`; verify the instance, AD account, and DNS records are gone.

    ## How to extend
    - Add a `io.kestra.plugin.core.flow.Pause` approval gate before the destroy for production hosts.
    - Notify the owner via `io.kestra.plugin.notifications.slack.SlackIncomingWebhook` when cleanup completes.
    - Release the IP back to your IPAM with an `io.kestra.plugin.core.http.Request` task.
    - Drive it from the asset catalog with a `SELECT` input using the `assets()` function.

    ## Links
    - Terraform plugin docs: https://kestra.io/plugins/plugin-terraform
    - Ansible plugin docs: https://kestra.io/plugins/plugin-ansible
    - Kestra Assets docs: https://kestra.io/docs/enterprise/governance/assets
  tags:
    - Infrastructure
  subTags:
    - VM Provisioning
    - GCP Services
    - Customer Success
  ee: true
  demo: false
