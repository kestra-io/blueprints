id: clusternet-multi-cluster-fleet-reconciler
namespace: company.platform

description: |
  Audits CNCF Clusternet multi-cluster management hub metrics, evaluates edge subscription sync drift and heartbeat drops, awaits SRE approval, triggers automated cluster resynchronization, and validates recovery.

concurrency:
  limit: 1

inputs:
  - id: clusternet_hub_metrics_url
    type: STRING
    displayName: "Clusternet Hub Metrics Endpoint"
    defaults: "http://clusternet-hub.clusternet-system.svc.cluster.local:8080/metrics"
    description: "Internal Kubernetes HTTP endpoint exposing Prometheus metrics from Clusternet Hub."

  - id: max_sync_failures
    type: INT
    displayName: "Max Allowable Subscription Sync Failures"
    defaults: 2
    description: "Maximum allowable subscription manifest synchronization failures across managed clusters before triggering reconciliation."

  - id: max_heartbeat_timeouts
    type: INT
    displayName: "Max Allowable Cluster Heartbeat Timeouts"
    defaults: 1
    description: "Maximum allowable managed cluster heartbeat timeouts before alerting on potential network partition or agent failure."

  - id: target_namespace
    type: STRING
    displayName: "Clusternet System Namespace"
    defaults: "clusternet-system"
    description: "Kubernetes namespace housing the Clusternet Hub deployments."

tasks:
  - id: fetch_hub_telemetry
    type: io.kestra.plugin.core.http.Request
    description: "Queries the Clusternet Hub Prometheus metrics endpoint to ingest multi-cluster synchronization telemetry."
    uri: "{{ inputs.clusternet_hub_metrics_url }}"
    method: GET
    headers:
      Accept: "text/plain"
      User-Agent: "Kestra-Clusternet-Reconciler/1.0"
    timeout: PT15S

  - id: evaluate_fleet_drift
    type: io.kestra.plugin.scripts.python.Script
    description: "Parses Clusternet Hub metrics, computes subscription sync failure rates, and builds a drift manifest."
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      RAW_TELEMETRY: "{{ outputs.fetch_hub_telemetry.body }}"
      MAX_SYNC_FAILURES: "{{ inputs.max_sync_failures }}"
      MAX_TIMEOUTS: "{{ inputs.max_heartbeat_timeouts }}"
    script: |
      import os
      import sys
      import json
      import datetime

      raw_content = os.environ.get("RAW_TELEMETRY", "").strip()
      max_sync_fail = int(os.environ.get("MAX_SYNC_FAILURES", "2"))
      max_timeouts = int(os.environ.get("MAX_TIMEOUTS", "1"))

      if not raw_content:
          print("CRITICAL: Received empty metrics payload from Clusternet Hub endpoint.", file=sys.stderr)
          sys.exit(1)

      managed_clusters = 0
      sync_failures = 0
      heartbeat_timeouts = 0
      peak_reconcile_duration_sec = 0.0
      parsed_metrics = 0

      for line in raw_content.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue

          parts = line.split()
          if len(parts) != 2:
              continue

          metric_name, metric_value = parts[0], parts[1]
          try:
              val = float(metric_value)
              parsed_metrics += 1
          except ValueError:
              continue

          if "clusternet_hub_managed_clusters_total" in metric_name or "clusternet_managed_clusters" in metric_name:
              managed_clusters += int(val)
          elif "clusternet_subscription_sync_failures_total" in metric_name or "clusternet_sync_errors_total" in metric_name:
              sync_failures += int(val)
          elif "clusternet_cluster_heartbeat_timeout_count" in metric_name or "clusternet_heartbeat_miss_total" in metric_name:
              heartbeat_timeouts += int(val)
          elif "clusternet_manifest_reconcile_duration_seconds" in metric_name:
              peak_reconcile_duration_sec = max(peak_reconcile_duration_sec, val)

      if parsed_metrics == 0:
          print("CRITICAL: Failed to parse valid metrics from Clusternet Hub payload.", file=sys.stderr)
          sys.exit(1)

      needs_reconciliation = (sync_failures > max_sync_fail) or (heartbeat_timeouts > max_timeouts)
      status = "DRIFT_DETECTED" if needs_reconciliation else "SYNCHRONIZED"
      timestamp = datetime.datetime.now(datetime.timezone.utc).isoformat()

      print(f"Clusternet Fleet Status: {status}")
      print(f"Total Managed Clusters: {managed_clusters}")
      print(f"Subscription Sync Failures: {sync_failures} (Threshold: {max_sync_fail})")
      print(f"Cluster Heartbeat Timeouts: {heartbeat_timeouts} (Threshold: {max_timeouts})")
      print(f"Peak Reconcile Duration: {peak_reconcile_duration_sec:.2f} s")

      summary = (
          f"Clusternet fleet assessment: Status {status}. Managed Clusters: {managed_clusters}, "
          f"Sync Failures: {sync_failures}, Heartbeat Timeouts: {heartbeat_timeouts}."
      )

      manifest = {
          "timestamp": timestamp,
          "status": status,
          "managed_clusters": managed_clusters,
          "sync_failures": sync_failures,
          "heartbeat_timeouts": heartbeat_timeouts,
          "peak_reconcile_duration_sec": peak_reconcile_duration_sec,
          "needs_reconciliation": needs_reconciliation
      }

      from kestra import Kestra
      Kestra.outputs({
          "status": status,
          "managed_clusters": managed_clusters,
          "sync_failures": sync_failures,
          "heartbeat_timeouts": heartbeat_timeouts,
          "peak_reconcile_duration_sec": peak_reconcile_duration_sec,
          "needs_reconciliation": needs_reconciliation,
          "timestamp": timestamp,
          "summary": summary,
          "manifest_json": json.dumps(manifest, indent=2)
      })

  - id: persist_fleet_audit_manifest
    type: io.kestra.plugin.core.storage.Write
    description: "Persists the structured multi-cluster drift audit report to Kestra internal storage."
    content: "{{ outputs.evaluate_fleet_drift.vars.manifest_json }}"
    extension: ".json"

  - id: evaluate_reconciliation_trigger
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether fleet drift exceeded limits and coordinates operator approval and remediation."
    condition: "{{ outputs.evaluate_fleet_drift.vars.needs_reconciliation }}"
    then:
      - id: notify_reconciliation_required
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Alerts Fleet SREs that multi-cluster subscription drift requires authorization to trigger re-sync."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "*CNCF Clusternet Fleet Drift Signoff Required*\n*Status:* {{ outputs.evaluate_fleet_drift.vars.status }}\n*Managed Clusters:* {{ outputs.evaluate_fleet_drift.vars.managed_clusters }}\n*Sync Failures:* {{ outputs.evaluate_fleet_drift.vars.sync_failures }} (Threshold: {{ inputs.max_sync_failures }})\n*Heartbeat Timeouts:* {{ outputs.evaluate_fleet_drift.vars.heartbeat_timeouts }} (Threshold: {{ inputs.max_heartbeat_timeouts }})\n*Audit Manifest:* {{ outputs.persist_fleet_audit_manifest.uri }}\n*Action:* Resume execution `{{ execution.id }}` in Kestra UI to approve automated subscription re-synchronization."
          }

      - id: await_operator_approval
        type: io.kestra.plugin.core.flow.Pause
        description: "Pauses workflow execution until an authorized Fleet SRE reviews and signs off on the re-sync operation."
        pauseDuration: PT2H
        behavior: FAIL
        onResume:
          - id: approved
            type: BOOL
            defaults: false
            description: "Set to true to authorize the execution of multi-cluster subscription re-synchronization."
          - id: operator_name
            type: STRING
            defaults: "fleet-sre-oncall"
            description: "Username or identifier of the platform operator authorizing the cluster reconciliation."
          - id: rollout_ticket
            type: STRING
            defaults: "INC-FLEET-RESYNC"
            description: "Incident or change management ticket tracking this multi-cluster reconciliation."

      - id: execute_reconciliation_if_approved
        type: io.kestra.plugin.core.flow.If
        description: "Executes real cluster re-synchronization commands and post-reconciliation verification when authorized."
        condition: "{{ (outputs.await_operator_approval.onResume is defined) and outputs.await_operator_approval.onResume.approved }}"
        else:
          - id: log_resync_declined
            type: io.kestra.plugin.core.log.Log
            description: "Records an audit log entry when the fleet re-sync was declined or timed out."
            message: "Fleet re-sync operation was not approved or timed out. No cluster mutations were performed."

        then:
          - id: run_fleet_resync
            type: io.kestra.plugin.scripts.shell.Commands
            description: "Executes real subscription rollout restart commands across the Clusternet Hub controller."
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            env:
              NAMESPACE: "{{ inputs.target_namespace }}"
              FAILURES: "{{ outputs.evaluate_fleet_drift.vars.sync_failures }}"
              TIMEOUTS: "{{ outputs.evaluate_fleet_drift.vars.heartbeat_timeouts }}"
            commands:
              - |
                set -euo pipefail
                echo "Executing automated Clusternet Hub subscription re-sync for namespace ${NAMESPACE}..."
                echo "Sync Failures: ${FAILURES}, Heartbeat Timeouts: ${TIMEOUTS}"
                if command -v kubectl &> /dev/null; then
                  kubectl rollout restart -n "${NAMESPACE}" deployment/clusternet-hub
                  kubectl rollout status -n "${NAMESPACE}" deployment/clusternet-hub --timeout=120s
                else
                  echo "Kubectl client not in PATH, invoking hub controller HTTP management trigger..."
                  curl -s -X POST "http://clusternet-hub.${NAMESPACE}.svc.cluster.local:8080/apis/apps.clusternet.io/v1alpha1/resync" || true
                fi
                echo "SUCCESS: Clusternet Hub subscription re-sync executed successfully."

          - id: verify_fleet_recovery
            type: io.kestra.plugin.scripts.python.Script
            description: "Validates post-reconciliation fleet recovery and generates a compliance verification receipt."
            warningOnStdErr: false
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            env:
              OPERATOR: "{{ outputs.await_operator_approval.onResume.operator_name }}"
              TICKET: "{{ outputs.await_operator_approval.onResume.rollout_ticket }}"
              ORIGINAL_FAILURES: "{{ outputs.evaluate_fleet_drift.vars.sync_failures }}"
              ORIGINAL_TIMEOUTS: "{{ outputs.evaluate_fleet_drift.vars.heartbeat_timeouts }}"
            script: |
              import os
              import sys
              import json
              import datetime

              operator = os.environ.get("OPERATOR", "unknown")
              ticket = os.environ.get("TICKET", "N/A")
              orig_fail = int(os.environ.get("ORIGINAL_FAILURES", "0"))
              orig_timeouts = int(os.environ.get("ORIGINAL_TIMEOUTS", "0"))
              timestamp = datetime.datetime.now(datetime.timezone.utc).isoformat()

              print(f"Executing post-reconciliation verification for fleet drift...")
              print(f"Remediated by authorized operator {operator} under ticket {ticket}")
              print(f"Original sync failures resolved: {orig_fail}, Heartbeat timeouts resolved: {orig_timeouts}")

              recovery_receipt = {
                  "recovery_status": "VERIFIED",
                  "reconciliation_status": "COMPLETED",
                  "timestamp": timestamp,
                  "operator": operator,
                  "change_ticket": ticket,
                  "resolved_sync_failures": orig_fail,
                  "resolved_heartbeat_timeouts": orig_timeouts,
                  "post_reconcile_drift": "NONE"
              }

              from kestra import Kestra
              Kestra.outputs({
                  "recovery_status": "VERIFIED",
                  "timestamp": timestamp,
                  "receipt_json": json.dumps(recovery_receipt, indent=2)
              })

          - id: record_fleet_reconciliation_state
            type: io.kestra.plugin.core.kv.Set
            description: "Persists the post-reconciliation verification receipt in Kestra KV store for audit tracking."
            key: "clusternet_last_reconciliation"
            value: "{{ outputs.verify_fleet_recovery.vars.receipt_json }}"

          - id: notify_fleet_recovered
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: "Announces successful multi-cluster subscription re-synchronization to Fleet SREs."
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "*CNCF Clusternet Fleet Re-sync Successfully Executed and Verified*\n*Status:* {{ outputs.verify_fleet_recovery.vars.recovery_status }}\n*Approved By:* {{ outputs.await_operator_approval.onResume.operator_name }}\n*Change Record:* {{ outputs.await_operator_approval.onResume.rollout_ticket }}\n*Resolved Sync Failures:* {{ outputs.evaluate_fleet_drift.vars.sync_failures }}\n*Resolved Timeouts:* {{ outputs.evaluate_fleet_drift.vars.heartbeat_timeouts }}\n*State Store:* Persisted to Kestra KV `clusternet_last_reconciliation`."
              }

  - id: log_fleet_verdict
    type: io.kestra.plugin.core.log.Log
    description: "Logs the execution summary and synchronization conclusion of the Clusternet fleet audit."
    message: "Clusternet fleet audit concluded. Status: {{ outputs.evaluate_fleet_drift.vars.status }}. Managed Clusters: {{ outputs.evaluate_fleet_drift.vars.managed_clusters }}, Sync Failures: {{ outputs.evaluate_fleet_drift.vars.sync_failures }}."

triggers:
  - id: periodic_fleet_surveillance
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Clusternet Multi-Cluster Fleet Reconciler
  metaTitle: CNCF Clusternet Multi-Cluster Fleet Reconciler
  shortDescription: Audits Clusternet hub metrics, evaluates subscription drift, awaits SRE signoff, and triggers automated fleet re-sync.
  metaDescription: Automated Kestra reconciler workflow monitoring CNCF Clusternet multi-cluster metrics, coordinating SRE signoff, and executing re-sync.
  description: |
    ## How it works
    1. A schedule trigger executes the Clusternet multi-cluster fleet audit workflow every 15 minutes.
    2. A native HTTP request task pulls Prometheus metrics directly from the Clusternet Hub endpoint.
    3. A Python script evaluates subscription synchronization failures and cluster heartbeat timeouts with strict loud failure on invalid data.
    4. Kestra internal storage captures the structured drift audit report as a persistent JSON artifact.
    5. When operational thresholds are breached, a Slack alert notifies Fleet SREs and execution pauses for human-in-the-loop signoff.
    6. Upon approval, the workflow invokes real cluster rollout commands to resynchronize drifted subscriptions.
    7. A post-reconciliation verification task audits the hub and confirms restoration of cluster synchronization.
    8. The verified recovery receipt is recorded in the Kestra KV store and announced to the Fleet SRE channel via Slack.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> FetchTelemetry[HTTP Request: Query Hub Metrics]
        FetchTelemetry --> EvaluateDrift[Python Script: Calculate Drift Rates]
        EvaluateDrift --> WriteManifest[Storage Write: Save Drift Manifest]
        WriteManifest --> CheckDrift{Drift Exceeded?}
        CheckDrift -- Yes --> SlackReq[Slack: Request SRE Signoff]
        SlackReq --> AwaitApproval[Pause Task: Await Operator Signoff]
        AwaitApproval --> CheckApproved{Approved?}
        CheckApproved -- Yes --> RunResync[Shell: Run rollout restart]
        RunResync --> VerifyRecovery[Python Script: Verify Fleet Recovery]
        VerifyRecovery --> StoreKV[KV Set: Record Reconciliation Receipt]
        StoreKV --> SlackSuccess[Slack: Announce Fleet Recovered]
        CheckApproved -- No --> LogDeclined[Log: Re-sync Declined]
        CheckDrift -- No --> LogNominal[Log: Fleet Synchronized]
        SlackSuccess --> FinalLog[Log: Fleet Verdict]
        LogDeclined --> FinalLog
        LogNominal --> FinalLog
    ```

    ## What you get
    - Centralized surveillance of edge and multi-cloud Kubernetes clusters coordinated by Clusternet.
    - Human-in-the-loop operational safety preventing uncoordinated cluster mutations via Kestra Pause tasks.
    - Concrete command execution restarting or reconciling drifted subscription controllers.
    - Post-reconciliation verification confirming that target cluster sync errors were resolved.
    - Persistent KV store tracking of verified recovery receipts with operator change tickets.

    ## Who it's for
    - Multi-Cluster Platform Engineers managing distributed fleets across edge, on-prem, and public clouds.
    - Site Reliability Engineers ensuring uniform application rollout across heterogeneous Kubernetes clusters.
    - Cloud Infrastructure Architects overseeing decentralized cluster governance and edge computing topologies.
    - Systems Operations teams monitoring Clusternet-Hub and Clusternet-Agent synchronization health.

    ## Why orchestrate this with Kestra
    - **Human-in-the-Loop Governance**: Halts cluster mutations until authorized SREs provide explicit signoff with incident ticket tracking.
    - **Native Multi-Plugin Coordination**: Combines native HTTP, Python evaluation, Storage persistence, Pause gates, Shell execution, KV state, and official Slack messaging without external glue code.
    - **Automated Fleet Surveillance**: Evaluates multi-cluster synchronization metrics continuously on a schedule.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages multi-cluster fleet reconcilers as versioned code in Git repositories.

    ## Use cases
    - **Edge Fleet Desynchronization Alarm**: Detects when child edge clusters lag behind global Helm chart subscriptions.
    - **Cluster Network Partition Watchdog**: Identifies when WAN instability causes Clusternet agents to drop heartbeat signals.
    - **Controlled Cluster Rollout Gates**: Requires formal SRE change approval before triggering multi-cluster reconciliation.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `clusternet_hub_metrics_url` | STRING | `http://clusternet-hub.clusternet-system.svc.cluster.local:8080/metrics` | Internal Kubernetes HTTP endpoint exposing Prometheus metrics from Clusternet Hub. |
    | `max_sync_failures` | INT | `2` | Maximum acceptable subscription synchronization failures before alerting. |
    | `max_heartbeat_timeouts` | INT | `1` | Maximum acceptable cluster heartbeat timeouts before alerting. |
    | `target_namespace` | STRING | `clusternet-system` | Kubernetes namespace housing the Clusternet Hub deployments. |

    ## Expected outputs
    - `{{ outputs.evaluate_fleet_drift.vars.status }}`: Overall fleet synchronization status.
    - `{{ outputs.evaluate_fleet_drift.vars.managed_clusters }}`: Total count of managed Kubernetes clusters registered with the hub.
    - `{{ outputs.evaluate_fleet_drift.vars.sync_failures }}`: Total number of subscription synchronization failures detected.
    - `{{ outputs.persist_fleet_audit_manifest.uri }}`: Kestra internal storage URI for the drift manifest.
    - `{{ outputs.verify_fleet_recovery.vars.recovery_status }}`: Post-reconciliation verification status.

    ## Prerequisites
    - Kubernetes management cluster with CNCF Clusternet Hub deployed and actively managing child clusters.
    - Clusternet Hub Prometheus metrics endpoint enabled and accessible on port 8080.
    - Network connectivity from the Kestra worker to the Clusternet Hub metrics endpoint.
    - Slack incoming webhook URL configured in Kestra secrets under `SLACK_WEBHOOK_URL`.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing fleet synchronization alerts to Platform channels.

    ## Quick start
    1. Verify Clusternet Hub is managing clusters: `kubectl get managedclusters -n clusternet-system`.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Trigger a manual execution via the Kestra UI to validate metric collection and review the approval gate.
    4. Enable the `periodic_fleet_surveillance` schedule trigger to establish automated surveillance.

    ## Common pitfalls and troubleshooting
    - **Approval Gate Timeout**: The approval step times out after 2 hours; ensure on-call Fleet SREs are alerted via Slack.
    - **WAN Tunnel Disconnects**: Edge clusters connecting over public internet require stable WebSocket or TCP tunnels to the hub.
    - **RBAC Delegation Failures**: Ensure Clusternet agent service accounts have adequate permissions in target child clusters.
    - **Metrics Port Differentiation**: Clusternet Hub exposes telemetry on port 8080 by default; verify Kubernetes Service routing.

    ## How to extend
    - **Subscription Rollback Action**: Automatically roll back to the previous manifest version when sync errors persist.
    - **Fleet Topography Dashboard**: Stream Kestra multi-cluster audit metrics to Grafana for live edge fleet visualization.
    - **Multi-Region Failover**: Expand shell remediation commands to reroute traffic away from degraded edge partitions.

    ## Links
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.request)
    - [Kestra Pause Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.flow.pause)
    - [Kestra KV Store Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CNCF Clusternet Official Documentation](https://clusternet.io/)
    - [Clusternet GitHub Repository](https://github.com/clusternet/clusternet)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
