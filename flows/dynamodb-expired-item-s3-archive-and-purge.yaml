id: dynamodb-expired-item-s3-archive-and-purge
namespace: company.cloud

description: |
  Automated cold storage archival and garbage-collection pipeline for Amazon DynamoDB.
  Scans expired or soft-deleted records matching an ISO-8601 retention cutoff, exports
  them to an Amazon S3 cold bucket with date-partitioned storage, and safely purges the
  pruned items from the primary DynamoDB table once S3 write confirmation succeeds.
  Includes safe-by-default dry-run controls, concurrency queueing, and Slack alerting.

concurrency:
  behavior: QUEUE
  limit: 1

inputs:
  - id: tableName
    type: STRING
    defaults: application_events
    displayName: DynamoDB Table Name
    description: The target Amazon DynamoDB table to scan and purge.

  - id: filterAttribute
    type: STRING
    defaults: expires_at
    displayName: Expiration Attribute Name
    description: DynamoDB ISO-8601 UTC timestamp string attribute (e.g. '2026-07-14T00:00:00Z') evaluated for expiration.

  - id: retentionDays
    type: INT
    defaults: 90
    displayName: Retention Window (Days)
    description: Records older than this retention threshold will be archived and purged.

  - id: s3Bucket
    type: STRING
    defaults: company-dynamodb-cold-archive
    displayName: Amazon S3 Cold Archive Bucket
    description: Target Amazon S3 bucket where archived records will be stored.

  - id: s3Prefix
    type: STRING
    defaults: dynamodb-archives
    displayName: S3 Archive Object Prefix
    description: Root prefix within the target S3 bucket for archival datasets.

  - id: dryRun
    type: BOOLEAN
    defaults: true
    displayName: Dry Run Mode
    description: When true, writes archive manifests to S3 but skips the DynamoDB purge step.

triggers:
  - id: daily_retention_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * *"
    disabled: true
    displayName: Daily Archival Schedule

  - id: on_demand_purge_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('DYNAMODB_PURGE_WEBHOOK_KEY') }}"
    displayName: On-Demand Webhook Trigger

tasks:
  - id: scan_expired_records
    type: io.kestra.plugin.aws.dynamodb.Scan
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_KEY_ID') }}"
    region: "{{ secret('AWS_DEFAULT_REGION') }}"
    tableName: "{{ inputs.tableName }}"
    filterExpression: "{{ inputs.filterAttribute }} <= :cutoff"
    expressionAttributeValues:
      ":cutoff": "{{ now() | dateAdd(-inputs.retentionDays, 'DAYS') | date(\"yyyy-MM-dd'T'HH:mm:ss'Z'\", timeZone=\"UTC\") }}"
    fetchType: FETCH

  - id: evaluate_archival_batch
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_expired_records.size > 0 }}"
    then:
      - id: write_archive_manifest
        type: io.kestra.plugin.core.storage.Write
        extension: .json
        content: "{{ outputs.scan_expired_records.rows | json }}"

      - id: upload_to_s3_archive
        type: io.kestra.plugin.aws.s3.Upload
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_KEY_ID') }}"
        region: "{{ secret('AWS_DEFAULT_REGION') }}"
        from: "{{ outputs.write_archive_manifest.uri }}"
        bucket: "{{ inputs.s3Bucket }}"
        key: "{{ inputs.s3Prefix }}/{{ inputs.tableName }}/{{ execution.startDate | date('yyyy/MM/dd') }}/{{ execution.id }}.json"

      - id: check_dry_run_and_purge
        type: io.kestra.plugin.core.flow.If
        condition: "{{ not inputs.dryRun }}"
        then:
          - id: purge_items_from_dynamodb
            type: io.kestra.plugin.core.flow.Loop
            values: "{{ outputs.scan_expired_records.rows }}"
            tasks:
              - id: delete_item
                type: io.kestra.plugin.aws.dynamodb.DeleteItem
                accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
                secretKeyId: "{{ secret('AWS_SECRET_KEY_ID') }}"
                region: "{{ secret('AWS_DEFAULT_REGION') }}"
                tableName: "{{ inputs.tableName }}"
                key:
                  id: "{{ item.value.id }}"

          - id: log_purge_summary
            type: io.kestra.plugin.core.log.Log
            message: "Successfully archived and purged {{ outputs.scan_expired_records.size }} expired records from DynamoDB table '{{ inputs.tableName }}' to S3 object '{{ outputs.upload_to_s3_archive.key }}'."
        else:
          - id: log_dry_run_summary
            type: io.kestra.plugin.core.log.Log
            message: "DRY RUN ACTIVE: Archived {{ outputs.scan_expired_records.size }} records to S3 object '{{ outputs.upload_to_s3_archive.key }}' without purging from table '{{ inputs.tableName }}'."
    else:
      - id: log_no_expired_records
        type: io.kestra.plugin.core.log.Log
        message: "No expired records found in DynamoDB table '{{ inputs.tableName }}' exceeding retention cutoff of {{ inputs.retentionDays }} days."

errors:
  - id: notify_archival_incident
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":rotating_light: *DynamoDB Archival & Purge Pipeline Incident*\n*Flow:* `{{ flow.namespace }}.{{ flow.id }}`\n*Execution:* `{{ execution.id }}`\n*Target Table:* `{{ inputs.tableName }}`\n*Error Task:* `{{ task.id }}`"
      }

extend:
  title: "Amazon DynamoDB Cold Storage Archival and Purge to S3"
  shortDescription: "Scan expired or soft-deleted records from Amazon DynamoDB, archive them to S3 in JSON format, and safely delete the purged records."
  metaTitle: "DynamoDB Cold Storage Archival to Amazon S3 with Kestra"
  metaDescription: "Archive expired DynamoDB records to Amazon S3 cold storage and safely purge primary table entries with dry-run controls, concurrency queueing, and Slack alerts."
  description: |
    Amazon DynamoDB is built for low-latency operational workloads, but storing historical, soft-deleted, or expired records in primary tables indefinitely leads to unbounded storage expenses. While DynamoDB table storage costs $0.25 per GB-month, Amazon S3 Standard costs $0.023 per GB-month (over 10x cheaper) and archival tiers like S3 Glacier Deep Archive cost less than $0.001 per GB-month (over 250x cheaper). Furthermore, DynamoDB's native Time-to-Live (TTL) feature guarantees deletion only within 48 hours of expiration, which can cause downstream queries to return stale data or violate strict compliance windows.

    This blueprint implements an automated, production-grade retention tiering and garbage collection pipeline for DynamoDB. It scans records matching an ISO-8601 retention cutoff, writes them into internal storage manifests, safely archives them into an Amazon S3 cold bucket under date-partitioned keys, and removes the purged records from the primary DynamoDB table only after S3 write durability is confirmed. The workflow features safe-by-default dry-run controls, serialized execution concurrency to prevent race conditions, and immediate Slack alerting on task failures.

    ## Table Schema & Setup

    This blueprint assumes items in your DynamoDB table contain an `id` partition key and an ISO-8601 UTC timestamp string attribute representing record expiration or soft deletion:

    ```json
    {
      "id": "evt_01HZX87Q9E1K4B9A2M4C5D6E7F",
      "event_type": "ORDER_COMPLETED",
      "customer_id": "cust_90214",
      "expires_at": "2026-07-14T03:00:00Z",
      "payload": {
        "order_id": "ord_88201",
        "total_amount": 128.50
      }
    }
    ```

    ## How it works

    1. **Execution Serialization:** Flow-level `concurrency: { behavior: QUEUE, limit: 1 }` prevents concurrent execution overlap between scheduled cron sweeps and manual on-demand webhook invocations.
    2. **Targeted Expiration Scan:** `scan_expired_records` (`io.kestra.plugin.aws.dynamodb.Scan`) evaluates the table with a filter expression comparing the configured expiration attribute against `:cutoff`. The cutoff timestamp is computed dynamically in Kestra using `{{ now() | dateAdd(-inputs.retentionDays, 'DAYS') | date("yyyy-MM-dd'T'HH:mm:ss'Z'", timeZone="UTC") }}`.
    3. **Short-Circuit Backlog Evaluation:** `evaluate_archival_batch` (`io.kestra.plugin.core.flow.If`) evaluates `outputs.scan_expired_records.size > 0`. If no records exceed the retention threshold, the workflow logs a clean status and completes without executing redundant S3 uploads or downstream loops.
    4. **Archive Manifest Generation:** `write_archive_manifest` (`io.kestra.plugin.core.storage.Write`) converts the matched records into an internal JSON storage file.
    5. **Durable Cold Storage Upload:** `upload_to_s3_archive` (`io.kestra.plugin.aws.s3.Upload`) pushes the manifest into the target Amazon S3 bucket under the key `{{ inputs.s3Prefix }}/{{ inputs.tableName }}/{{ execution.startDate | date('yyyy/MM/dd') }}/{{ execution.id }}.json`.
    6. **Dry-Run Gate & Item Pruning:** `check_dry_run_and_purge` (`io.kestra.plugin.core.flow.If`) verifies `dryRun: false`. It executes `purge_items_from_dynamodb` (`io.kestra.plugin.core.flow.Loop`) over the archived records and sequentially invokes `delete_item` (`io.kestra.plugin.aws.dynamodb.DeleteItem`) by primary key (`id`). Because deletions occur strictly downstream of `upload_to_s3_archive`, records are never deleted unless S3 persistence has succeeded.
    7. **Audit Metrics:** `log_purge_summary` and `log_dry_run_summary` (`io.kestra.plugin.core.log.Log`) output structured confirmation logs with item counts and destination S3 URIs.
    8. **Operational Escalation:** `notify_archival_incident` in the flow-level `errors` block dispatches a Slack alert with execution and task failure context if any step fails.

    ## What you get

    - Up to 90%+ storage cost savings by tiering cold DynamoDB data to Amazon S3 Standard or Glacier.
    - Zero data loss guarantee: records are deleted from DynamoDB only after S3 write durability is confirmed.
    - Safe-by-default operations with `dryRun: true` and `disabled: true` on the schedule trigger to protect production tables until explicitly configured.
    - Automated execution serialization with `QUEUE` concurrency to prevent race conditions.
    - Immediate incident alerting through Slack Incoming Webhooks.
    - Complete execution audit trails and artifact history in Kestra.

    ## Who it's for

    - Cloud and Platform Engineers managing AWS infrastructure and cloud spend.
    - Data Engineers maintaining NoSQL operational stores, compliance retention, and data lakes.
    - Site Reliability Engineers establishing automated, resilient database maintenance runbooks.

    ## Why orchestrate this with Kestra

    Building custom retention tiering scripts with AWS Lambda or EC2 cron jobs introduces operational burdens: Lambda 15-minute execution timeouts, fragile IAM permission configurations, lack of native queueing/serialization, unhandled batch retries, and absent execution lineage. Kestra delivers:

    - A native scheduler (`Schedule`) and authenticated `Webhook` trigger in a single YAML specification.
    - Built-in `QUEUE` concurrency to eliminate overlapping workers without Redis locks or distributed mutexes.
    - Transparent artifact storage lineage from DynamoDB scan to internal storage and final S3 destination.
    - Declarative task-level retries and flow-level error handlers paging Slack out of the box.

    ## Prerequisites

    - An active AWS account with permissions for Amazon DynamoDB (`dynamodb:Scan`, `dynamodb:DeleteItem`) and Amazon S3 (`s3:PutObject`).
    - An Amazon DynamoDB table with an `id` primary key and an ISO-8601 timestamp attribute.
    - An Amazon S3 bucket configured for cold storage retention.
    - A Slack Incoming Webhook URL for error alerts.

    ### Secrets

    Configure the following secrets in your Kestra namespace:

    - `AWS_ACCESS_KEY_ID`: IAM access key with DynamoDB and S3 permissions.
    - `AWS_SECRET_KEY_ID`: Corresponding IAM secret key.
    - `AWS_DEFAULT_REGION`: Target AWS region (e.g. `us-east-1`, `eu-west-1`).
    - `DYNAMODB_PURGE_WEBHOOK_KEY`: Secret authentication key for the manual webhook trigger.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for incident notifications.

    ## Quick start

    1. Configure the required secrets (`AWS_ACCESS_KEY_ID`, `AWS_SECRET_KEY_ID`, `AWS_DEFAULT_REGION`, `DYNAMODB_PURGE_WEBHOOK_KEY`, `SLACK_WEBHOOK_URL`) in your Kestra namespace.
    2. Adjust the default `tableName`, `s3Bucket`, and `retentionDays` inputs to match your AWS environment.
    3. Trigger a manual execution with `dryRun: true` in the Kestra UI to verify that expired records are detected and uploaded to S3 without removing them from DynamoDB.
    4. Verify the uploaded JSON object in your S3 bucket.
    5. Set `dryRun: false` and toggle `disabled: false` on `daily_retention_schedule` to automate ongoing archival sweeps.

    ## How to extend

    - **Parquet Conversion:** Chain an `io.kestra.plugin.jdbc.duckdb.Query` task between the scan and upload to compress JSON manifests into columnar Parquet format before writing to S3.
    - **S3 Glacier Lifecycle:** Configure AWS S3 Lifecycle rules on the target prefix to automatically transition archived objects from S3 Standard to Glacier Deep Archive after 30 days.
    - **Multi-Table Archival:** Wrap the scan-and-archive tasks in a parent `io.kestra.plugin.core.flow.Parallel` task or subflow to sweep multiple application tables concurrently.

