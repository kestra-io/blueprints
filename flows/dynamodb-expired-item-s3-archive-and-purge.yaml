id: dynamodb-expired-item-s3-archive-and-purge
namespace: company.cloud

description: |
  Automated cold storage archival and garbage-collection pipeline for Amazon DynamoDB.
  Scans expired or soft-deleted records matching a retention cutoff, exports them to
  an Amazon S3 cold bucket with execution-level partitioning, and safely purges the
  pruned items from the primary DynamoDB table once S3 write confirmation succeeds.
  Includes non-destructive dry-run controls, concurrency queueing, and Slack alerting.

concurrency:
  behavior: QUEUE
  limit: 1

inputs:
  - id: tableName
    type: STRING
    defaults: application_events
    displayName: DynamoDB Table Name
    description: The target Amazon DynamoDB table to scan and purge.

  - id: filterAttribute
    type: STRING
    defaults: expires_at
    displayName: Expiration Attribute Name
    description: DynamoDB numeric epoch timestamp attribute to evaluate for expiration.

  - id: retentionDays
    type: INT
    defaults: 90
    displayName: Retention Window (Days)
    description: Records older than this retention threshold will be archived and purged.

  - id: batchLimit
    type: INT
    defaults: 100
    displayName: Batch Limit
    description: Maximum number of records to process per archival execution.

  - id: s3Bucket
    type: STRING
    defaults: company-dynamodb-cold-archive
    displayName: Amazon S3 Cold Archive Bucket
    description: Target Amazon S3 bucket where archived records will be stored.

  - id: s3Prefix
    type: STRING
    defaults: dynamodb-archives
    displayName: S3 Archive Object Prefix
    description: Root prefix within the target S3 bucket for archival datasets.

  - id: dryRun
    type: BOOLEAN
    defaults: false
    displayName: Dry Run Mode
    description: When true, writes archive manifests to S3 but skips the DynamoDB purge step.

triggers:
  - id: daily_retention_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * *"
    displayName: Daily Archival Schedule

  - id: on_demand_purge_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('DYNAMODB_PURGE_WEBHOOK_KEY') }}"
    displayName: On-Demand Webhook Trigger

tasks:
  - id: scan_expired_records
    type: io.kestra.plugin.aws.dynamodb.Scan
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_KEY_ID') }}"
    region: "{{ secret('AWS_DEFAULT_REGION') }}"
    tableName: "{{ inputs.tableName }}"
    limit: "{{ inputs.batchLimit }}"
    filterExpression: "#attr <= :cutoff"
    expressionAttributeNames:
      "#attr": "{{ inputs.filterAttribute }}"
    expressionAttributeValues:
      ":cutoff": "{{ now() | dateAdd(-inputs.retentionDays, 'DAYS') | timestamp }}"
    fetchType: FETCH

  - id: evaluate_archival_batch
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_expired_records.size > 0 }}"
    then:
      - id: write_archive_manifest
        type: io.kestra.plugin.core.storage.Write
        extension: .json
        content: "{{ outputs.scan_expired_records.rows | json }}"

      - id: upload_to_s3_archive
        type: io.kestra.plugin.aws.s3.Upload
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_KEY_ID') }}"
        region: "{{ secret('AWS_DEFAULT_REGION') }}"
        from: "{{ outputs.write_archive_manifest.uri }}"
        bucket: "{{ inputs.s3Bucket }}"
        key: "{{ inputs.s3Prefix }}/{{ inputs.tableName }}/{{ execution.startDate | date('yyyy/MM/dd') }}/{{ execution.id }}.json"

      - id: check_dry_run_and_purge
        type: io.kestra.plugin.core.flow.If
        condition: "{{ not inputs.dryRun }}"
        then:
          - id: purge_items_from_dynamodb
            type: io.kestra.plugin.core.flow.Loop
            values: "{{ outputs.scan_expired_records.rows }}"
            tasks:
              - id: delete_item
                type: io.kestra.plugin.aws.dynamodb.DeleteItem
                accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
                secretKeyId: "{{ secret('AWS_SECRET_KEY_ID') }}"
                region: "{{ secret('AWS_DEFAULT_REGION') }}"
                tableName: "{{ inputs.tableName }}"
                key:
                  id: "{{ item.value.id }}"

          - id: log_purge_summary
            type: io.kestra.plugin.core.log.Log
            message: "Successfully archived and purged {{ outputs.scan_expired_records.size }} expired records from DynamoDB table '{{ inputs.tableName }}' to S3 object '{{ outputs.upload_to_s3_archive.key }}'."
        else:
          - id: log_dry_run_summary
            type: io.kestra.plugin.core.log.Log
            message: "DRY RUN ACTIVE: Archived {{ outputs.scan_expired_records.size }} records to S3 object '{{ outputs.upload_to_s3_archive.key }}' without purging from table '{{ inputs.tableName }}'."
    else:
      - id: log_no_expired_records
        type: io.kestra.plugin.core.log.Log
        message: "No expired records found in DynamoDB table '{{ inputs.tableName }}' exceeding retention cutoff of {{ inputs.retentionDays }} days."

errors:
  - id: notify_archival_incident
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":rotating_light: *DynamoDB Archival & Purge Pipeline Incident*\n*Flow:* `{{ flow.namespace }}.{{ flow.id }}`\n*Execution:* `{{ execution.id }}`\n*Target Table:* `{{ inputs.tableName }}`\n*Error Task:* `{{ task.id }}`"
      }

extend:
  tags:
    - Data
    - Cloud
    - Infrastructure
  subTags:
    - NoSQL Database Archival
  metaDescription: Archive expired or soft-deleted DynamoDB records to Amazon S3 cold storage and safely purge primary table entries with dry-run controls and Slack alerting.
  description: |
    Automate cost-optimized retention tiering and garbage collection for Amazon DynamoDB tables using Kestra. This blueprint scans expired or soft-deleted records, exports them to an Amazon S3 cold storage bucket in date-partitioned JSON format, and atomically purges the archived items from the primary DynamoDB table once S3 write durability is confirmed.

    ## Architecture & Operational Guardrails

    1. **Targeted Expiration Scan:** Utilizes `io.kestra.plugin.aws.dynamodb.Scan` with an expression-attribute filter (`#attr <= :cutoff`) to isolate records older than the configured `retentionDays` threshold without loading the entire table.
    2. **Short-Circuit Backlog Evaluation:** Employs `io.kestra.plugin.core.flow.If` to check `outputs.scan_expired_records.size > 0`, completing cleanly and avoiding unnecessary S3 uploads or downstream loops when no expired records exist.
    3. **Durability Verification Gate:** Packages the batch into an internal storage manifest via `io.kestra.plugin.core.storage.Write` and streams it to Amazon S3 with `io.kestra.plugin.aws.s3.Upload`. Items are only deleted from DynamoDB *after* S3 acknowledges receipt of the archive payload.
    4. **Sequential Item Pruning:** Iterates through archived records with `io.kestra.plugin.core.flow.Loop` and invokes `io.kestra.plugin.aws.dynamodb.DeleteItem` against the primary partition key (`id`).
    5. **Non-Destructive Dry Run:** Toggle `dryRun: true` during staging, migrations, or policy updates to verify S3 exports without deleting any production records.
    6. **Concurrency Protection:** Root-level `concurrency: { behavior: QUEUE, limit: 1 }` prevents concurrent execution overlap between scheduled cron sweeps and manual on-demand webhook invocations.
    7. **Automated Incident Escalation:** Flow-level `errors` handler pages on-call engineers via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` with execution details if any step fails.

    ## Prerequisites & Secrets

    Configure the following secrets in your Kestra tenant or environment:
    - `AWS_ACCESS_KEY_ID`: IAM access key with DynamoDB (`Scan`, `DeleteItem`) and S3 (`PutObject`) permissions.
    - `AWS_SECRET_KEY_ID`: Corresponding IAM secret key.
    - `AWS_DEFAULT_REGION`: AWS target region (e.g. `us-east-1`, `eu-west-1`).
    - `DYNAMODB_PURGE_WEBHOOK_KEY`: Secret authentication key for the webhook trigger.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for incident notifications.
