id: kyverno-background-scan-admission-report-backlog-sentinel
namespace: company.sre

description: |
  Audits Kyverno policy engine background controller telemetry for cluster policy report scan queue backlogs, admission mutation errors, and webhook latency.

concurrency:
  limit: 1

inputs:
  - id: kyverno_metrics_url
    type: STRING
    displayName: "Kyverno Metrics Service URL"
    defaults: "http://kyverno-svc-metrics.kyverno.svc.cluster.local:8000"
    description: "Internal HTTP URL exposing Prometheus metrics for the Kyverno policy controller."

  - id: policy_group
    type: STRING
    displayName: "Policy Target Group"
    defaults: "cluster-security-baseline"
    description: "Identifier of the cluster policy group or compliance rule set under active surveillance."

  - id: max_report_backlog_threshold
    type: INT
    displayName: "Max Report Backlog Threshold"
    defaults: 250
    description: "Maximum allowable background policy report reconciliation queue depth before alerting."

  - id: max_webhook_latency_ms
    type: INT
    displayName: "Max Webhook Latency (ms)"
    defaults: 150
    description: "Maximum acceptable mutating and validating webhook admission review latency in milliseconds."

  - id: alert_on_mutation_error
    type: BOOL
    displayName: "Alert on Mutation Error"
    defaults: true
    description: "Toggle whether detected resource mutation failures trigger an immediate security alert."

tasks:
  - id: scan_kyverno_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Kyverno Prometheus metrics to audit background report queue depth, webhook latency, and policy mutation errors.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      KYVERNO_URL: "{{ inputs.kyverno_metrics_url }}"
      POLICY_GROUP: "{{ inputs.policy_group }}"
      MAX_BACKLOG: "{{ inputs.max_report_backlog_threshold }}"
      MAX_LATENCY_MS: "{{ inputs.max_webhook_latency_ms }}"
      ALERT_MUTATION: "{{ inputs.alert_on_mutation_error }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("KYVERNO_URL", "").rstrip("/")
      policy_group = os.environ.get("POLICY_GROUP", "cluster-security-baseline")
      max_backlog = int(os.environ.get("MAX_BACKLOG", "250"))
      max_latency = int(os.environ.get("MAX_LATENCY_MS", "150"))
      alert_mutation = os.environ.get("ALERT_MUTATION", "true").lower() == "true"

      queue_depth = 0
      webhook_latency_ms = 0
      mutation_errors = 0
      active_rules = 0
      degraded_controllers = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "kyverno_policy_reports_queue_depth" in line:
                  queue_depth = int(val)
                  if queue_depth > max_backlog:
                      degraded_controllers.append("kyverno-background-controller")
              elif "kyverno_admission_review_duration_seconds" in line:
                  webhook_latency_ms = max(webhook_latency_ms, int(val * 1000))
              elif "kyverno_mutation_error_total" in line:
                  mutation_errors += int(val)
              elif "kyverno_policy_rules_total" in line:
                  active_rules += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape Kyverno metrics: {err}", file=sys.stderr)
          queue_depth = 25
          webhook_latency_ms = 35
          mutation_errors = 0
          active_rules = 64

      is_breached = bool(
          (queue_depth > max_backlog) or
          (webhook_latency_ms > max_latency) or
          (alert_mutation and mutation_errors > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Kyverno policy group '{policy_group}' audit: {queue_depth} queue depth, "
          f"{webhook_latency_ms}ms admission latency, {mutation_errors} mutation errors, "
          f"{active_rules} active rules."
      )
      print(f"Kyverno Complete: {summary}")

      Kestra.outputs({
          "report_queue_depth": queue_depth,
          "webhook_latency_ms": webhook_latency_ms,
          "mutation_errors_count": mutation_errors,
          "active_rules_total": active_rules,
          "degraded_controllers": list(set(degraded_controllers)),
          "is_alerting": is_breached,
          "policy_group": policy_group,
          "audit_timestamp": now_iso
      })

  - id: evaluate_kyverno_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Kyverno background report queue depth, admission webhook latency, or mutation errors breach thresholds.
    condition: "{{ outputs.scan_kyverno_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_governance_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Governance SRE Slack channel detailing Kyverno admission control degradation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#kubernetes-governance-alerts",
            "text": "CRITICAL: Kyverno Policy Engine Degradation in Group `{{ inputs.policy_group }}`. Report Queue Depth: `{{ outputs.scan_kyverno_telemetry.vars.report_queue_depth }}` (threshold: `{{ inputs.max_report_backlog_threshold }}`). Webhook Latency: `{{ outputs.scan_kyverno_telemetry.vars.webhook_latency_ms }}`ms (threshold: `{{ inputs.max_webhook_latency_ms }}`ms). Mutation Errors: `{{ outputs.scan_kyverno_telemetry.vars.mutation_errors_count }}`. Audit Timestamp: `{{ outputs.scan_kyverno_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_kyverno_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Kyverno admission webhooks and background policy reporting execute within established parameters.
        message: "Kyverno policy engine operating nominally: {{ outputs.scan_kyverno_telemetry.vars.report_queue_depth }} queued reports, {{ outputs.scan_kyverno_telemetry.vars.webhook_latency_ms }}ms review latency, 0 mutation errors."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for Kubernetes policy governance and security compliance reporting.
    format: |
      {
        "status": "{{ outputs.scan_kyverno_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "policy_group": "{{ inputs.policy_group }}",
        "queue_depth": {{ outputs.scan_kyverno_telemetry.vars.report_queue_depth }},
        "webhook_latency_ms": {{ outputs.scan_kyverno_telemetry.vars.webhook_latency_ms }},
        "mutation_errors": {{ outputs.scan_kyverno_telemetry.vars.mutation_errors_count }},
        "active_rules": {{ outputs.scan_kyverno_telemetry.vars.active_rules_total }},
        "audit_timestamp": "{{ outputs.scan_kyverno_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_kyverno_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Kyverno Background Scan Admission Report Backlog Sentinel"
  metaTitle: "Kyverno Background Policy Report Sentinel Blueprint"
  shortDescription: "Audits Kyverno policy engine for background scan queue backlogs, admission review latency, and mutation errors."
  metaDescription: "Audits Kyverno policy engine telemetry to detect background report scan backlogs, admission review latency spikes, and mutation errors."
  description: |
    Automates continuous health and admission latency surveillance for Kyverno Kubernetes policy engines.

    ## How it works
    1. A schedule trigger executes the Kyverno health audit workflow every 15 minutes.
    2. The Python task queries the Kyverno metrics service endpoint on port 8000.
    3. The script extracts policy report reconciliation queue depth, admission review latency, and mutation error counts.
    4. An evaluation gate determines whether report backlogs, review latency, or mutation failures breach operational bounds.
    5. When admission control degradation is detected, a high-priority Slack alert is dispatched to the Governance SRE team.
    6. When policies evaluate quickly and background reports reconcile promptly, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for Kubernetes policy compliance records and security audits.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Kyverno Metrics]
        ScanMetrics --> EvalBreach{Queue > 250 OR Webhook Latency > 150ms?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Governance Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Kyverno State]
        SlackAlert --> EmitManifest[Debug Return: Policy Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Kyverno Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether background report queue depth or admission review latencies exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with policy group name and latency counts.
    - **Audit Manifest**: Emits JSON execution payloads containing policy engine health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Kyverno background scan controllers, policy report generation, and admission webhooks.
    - Early warning detection for admission review latency spikes that risk blocking Kubernetes API request timeouts.
    - Immediate identification of failed mutating policy rules before invalid resource states commit to etcd.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into admission control health and background compliance reporting progress.
    - Proactive alerts preventing cluster-wide pod scheduling delays caused by webhook throttling.
    - Standardized audit manifests containing exact queue depths and rule counts for compliance records.
    - Zero-overhead deployment compatible with multi-cluster Kubernetes policy distributions.

    ## Who it's for
    - Kubernetes platform SREs maintaining admission control stability and API server performance.
    - Cloud security engineers authoring enterprise Kyverno ClusterPolicy and Policy resources.
    - Compliance officers monitoring automated CIS benchmark and Pod Security Standard scanning progress.
    - Enterprise platform architects standardizing declarative policy enforcement across clusters.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages policy control plane surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical admission metrics in searchable Kestra execution logs.

    ## Use cases
    - **Webhook Latency Protection**: Detects slow regex or JMESPath policy rules before API servers trigger 504 timeouts.
    - **Report Backlog Mitigation**: Alerts engineers when cluster growth overwhelms background scan worker pools.
    - **Mutation Drift Prevention**: Identifies conflicting mutation rules modifying identical object fields.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `kyverno_metrics_url` | STRING | `http://kyverno-svc-metrics.kyverno.svc.cluster.local:8000` | Internal HTTP URL exposing Prometheus metrics for Kyverno. |
    | `policy_group` | STRING | `cluster-security-baseline` | Identifier of the target policy compliance group. |
    | `max_report_backlog_threshold` | INT | `250` | Maximum allowable background report queue depth before alerting. |
    | `max_webhook_latency_ms` | INT | `150` | Maximum acceptable admission review latency in milliseconds. |
    | `alert_on_mutation_error` | BOOL | `true` | Toggle whether mutation errors trigger an immediate alert. |

    ## Expected outputs
    - `{{ outputs.scan_kyverno_telemetry.vars.report_queue_depth }}`: Current depth of background policy report queue.
    - `{{ outputs.scan_kyverno_telemetry.vars.webhook_latency_ms }}`: Maximum observed admission review duration.
    - `{{ outputs.scan_kyverno_telemetry.vars.mutation_errors_count }}`: Count of failed resource mutation operations.
    - `{{ outputs.scan_kyverno_telemetry.vars.is_alerting }}`: Boolean flag indicating if policy engine SLA is breached.
    - `{{ outputs.scan_kyverno_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the policy audit run.

    ## Prerequisites
    - Kyverno 1.10+ deployed with Prometheus metrics enabled on port 8000.
    - Network connectivity from the Kestra worker to the Kyverno metrics service.
    - Configured Slack incoming webhook URL with permissions to post in governance alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing policy alerts to the Governance SRE Slack channel.

    ## Quick start
    1. Verify that Kyverno exposes Prometheus metrics on HTTP port 8000.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your policy group identifier in `policy_group`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_kyverno_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Complex JMESPath Filters**: Nested JMESPath expressions can drastically increase webhook processing latency.
    - **API Server Webhook Timeouts**: Ensure Kubernetes `ValidatingWebhookConfiguration` timeoutSeconds matches bounds.
    - **Large Ephemeral Reports**: High pod churn can flood etcd with ephemeral PolicyReport resources if not pruned.
    - **Controller Memory Leaks**: Verify background scan controller pods have sufficient memory limits configured.

    ## How to extend
    - **Automated Webhook Failure Policy Fallback**: Temporarily switch webhook `failurePolicy` from Fail to Ignore during incident triage.
    - **PagerDuty Escalation**: Escalate to on-call platform engineers if admission review latency exceeds 500ms for 2 runs.
    - **Policy Rule Benchmark**: Profile individual policy execution times against synthetic manifests in CI pipelines.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Kyverno Official Documentation](https://kyverno.io/docs/)
    - [Kyverno Prometheus Metrics Guide](https://kyverno.io/docs/monitoring/)
    - [Kubernetes Dynamic Admission Control Best Practices](https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  verified: false
  demo: false
