id: citus-colocation-violation-guard
namespace: company.team

description: |
  Two Citus distributed tables join locally on each worker only while they sit in the same
  colocation group. Create one with colocate_with none or load two tables through different
  paths and they land in different groups. Nothing errors at create time. Every join between
  them then repartitions across workers and a foreign key between them is rejected outright.
  This flow compares a declared set of tables that should colocate against colocationid in
  pg_dist_partition, reports the pairs that drifted apart, then calls
  update_distributed_table_colocation behind a dry run and an approval, re-reads colocationid
  and fails the run if the pair is still split.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: Coordinator JDBC URL
    description: The Citus coordinator. All colocation metadata lives there.
    defaults: "jdbc:postgresql://localhost:5432/citus"

  - id: expected_groups
    type: JSON
    displayName: Tables that should colocate
    description: >-
      A list of groups. Each group is a list of schema qualified table names whose first entry is
      the anchor. Every later entry in a group should share the anchor's colocation group. Tables
      you never join together belong in different groups, so leave them out.
    defaults: [["public.orders", "public.order_items"], ["public.customers", "public.customer_events"]]

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Allow the flow to change a colocation group. Off means report only.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, before any colocation group is changed.
    defaults: true

variables:
  audit_cte: |
    WITH decl AS (
      SELECT g.ord::int AS group_no,
             (g.grp -> 0) #>> '{}' AS anchor_table,
             m.tbl AS member_table
        FROM json_array_elements('{{ inputs.expected_groups }}'::json) WITH ORDINALITY AS g(grp, ord)
        CROSS JOIN LATERAL (
          SELECT e.value #>> '{}' AS tbl, (e.ordinality - 1)::int AS pos
            FROM json_array_elements(g.grp) WITH ORDINALITY AS e(value, ordinality)
        ) m
       WHERE m.pos > 0
    ), part AS (
      SELECT p.logicalrelid AS reloid,
             p.colocationid::int AS colocationid,
             column_to_column_name(p.logicalrelid, p.partkey::text) AS dist_column,
             (SELECT count(*) FROM pg_dist_shard s WHERE s.logicalrelid = p.logicalrelid)::int AS shard_count
        FROM pg_dist_partition p
       WHERE p.partmethod = 'h'
    ), typed AS (
      SELECT t.reloid, t.colocationid, t.dist_column, t.shard_count,
             format_type(a.atttypid, a.atttypmod) AS dist_type
        FROM part t
        JOIN pg_attribute a ON a.attrelid = t.reloid AND a.attname = t.dist_column
                           AND a.attnum > 0 AND NOT a.attisdropped
    ), pair AS (
      SELECT d.group_no, d.anchor_table, d.member_table,
             ta.colocationid AS anchor_colocationid, tm.colocationid AS member_colocationid,
             ta.dist_type AS anchor_dist_type, tm.dist_type AS member_dist_type,
             ta.dist_column AS anchor_dist_column, tm.dist_column AS member_dist_column,
             ta.shard_count AS anchor_shard_count, tm.shard_count AS member_shard_count
        FROM decl d
        LEFT JOIN typed ta ON ta.reloid = to_regclass(d.anchor_table)
        LEFT JOIN typed tm ON tm.reloid = to_regclass(d.member_table)
    ), audit AS (
      SELECT group_no, anchor_table, member_table,
             coalesce(anchor_colocationid, 0) AS anchor_colocationid,
             coalesce(member_colocationid, 0) AS member_colocationid,
             coalesce(anchor_dist_type, 'n/a') AS anchor_dist_type,
             coalesce(member_dist_type, 'n/a') AS member_dist_type,
             coalesce(anchor_dist_column, 'n/a') AS anchor_dist_column,
             coalesce(member_dist_column, 'n/a') AS member_dist_column,
             coalesce(anchor_shard_count, 0) AS anchor_shard_count,
             coalesce(member_shard_count, 0) AS member_shard_count,
             CASE
               WHEN anchor_colocationid IS NULL OR member_colocationid IS NULL THEN 'UNKNOWN_TABLE'
               WHEN anchor_colocationid = member_colocationid THEN 'COLOCATED'
               WHEN anchor_dist_type IS DISTINCT FROM member_dist_type THEN 'TYPE_MISMATCH'
               WHEN anchor_shard_count IS DISTINCT FROM member_shard_count THEN 'SHARD_COUNT_MISMATCH'
               ELSE 'VIOLATION'
             END AS verdict,
             CASE
               WHEN anchor_colocationid IS NULL AND member_colocationid IS NULL
                 THEN 'neither table is a hash distributed Citus table on this coordinator'
               WHEN anchor_colocationid IS NULL
                 THEN 'the anchor is not a hash distributed Citus table on this coordinator'
               WHEN member_colocationid IS NULL
                 THEN 'this table is not a hash distributed Citus table on this coordinator'
               WHEN anchor_colocationid = member_colocationid
                 THEN 'already sharing colocation group ' || member_colocationid
               WHEN anchor_dist_type IS DISTINCT FROM member_dist_type
                 THEN 'distribution column types differ (' || member_dist_type || ' against '
                      || anchor_dist_type || '), so Citus refuses to colocate them'
               WHEN anchor_shard_count IS DISTINCT FROM member_shard_count
                 THEN 'shard counts differ (' || member_shard_count || ' against '
                      || anchor_shard_count || '), so Citus refuses to colocate them'
               ELSE 'same ' || member_dist_type || ' distribution column over '
                    || member_shard_count || ' shards, but colocation group '
                    || member_colocationid || ' against ' || anchor_colocationid
             END AS reason
        FROM pair
    )

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Read-only. One row per declared pair, with each side's colocationid from pg_dist_partition,
      its distribution column and type plus its shard count. A pair is only a violation when the
      two sides agree on type and shard count, because those are what Citus itself requires
      before it will put two tables in one colocation group.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      {{ render(vars.audit_cte) }}
      SELECT * FROM audit ORDER BY group_no, member_table

  - id: assess
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Read-only. Classify the whole declaration as VIOLATION, NOT_COLOCATABLE or OK, build the
      target list for the remediation loop and read citus.enable_repartition_joins, which decides
      whether a split pair makes joins slow or makes them fail outright.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      {{ render(vars.audit_cte) }}
      SELECT
        CASE
          WHEN count(*) FILTER (WHERE verdict = 'VIOLATION') > 0 THEN 'VIOLATION'
          WHEN count(*) FILTER (WHERE verdict <> 'COLOCATED') > 0 THEN 'NOT_COLOCATABLE'
          ELSE 'OK'
        END AS state,
        count(*)::int AS pair_count,
        (count(*) FILTER (WHERE verdict = 'VIOLATION'))::int AS violation_count,
        (count(*) FILTER (WHERE verdict = 'COLOCATED'))::int AS colocated_count,
        (count(*) FILTER (WHERE verdict IN ('TYPE_MISMATCH', 'SHARD_COUNT_MISMATCH')))::int AS refused_count,
        (count(*) FILTER (WHERE verdict = 'UNKNOWN_TABLE'))::int AS unknown_count,
        count(DISTINCT colocationid_pair)::int AS group_spread,
        current_setting('citus.enable_repartition_joins') AS repartition_joins,
        coalesce((SELECT json_agg(json_build_object(
                    'member', member_table, 'anchor', anchor_table,
                    'before_colocationid', member_colocationid,
                    'anchor_colocationid', anchor_colocationid) ORDER BY member_table)::text
                    FROM audit WHERE verdict = 'VIOLATION'), '[]') AS targets_json,
        coalesce((SELECT string_agg(member_table || ' should join ' || anchor_table || ' ('
                    || reason || ')', '; ' ORDER BY member_table)
                    FROM audit WHERE verdict = 'VIOLATION'), '') AS violation_list,
        coalesce((SELECT string_agg('SELECT update_distributed_table_colocation('
                    || quote_literal(member_table) || ', colocate_with => '
                    || quote_literal(anchor_table) || ');', ' ' ORDER BY member_table)
                    FROM audit WHERE verdict = 'VIOLATION'), '') AS plan_sql,
        coalesce((SELECT string_agg(member_table || ' with ' || anchor_table || ' (' || reason || ')',
                    '; ' ORDER BY member_table)
                    FROM audit WHERE verdict IN ('TYPE_MISMATCH', 'SHARD_COUNT_MISMATCH', 'UNKNOWN_TABLE')), '') AS refused_list,
        coalesce((SELECT string_agg(member_table || ' with ' || anchor_table || ' in group '
                    || member_colocationid, '; ' ORDER BY member_table)
                    FROM audit WHERE verdict = 'COLOCATED'), '') AS colocated_list
        FROM (SELECT a.*, a.anchor_colocationid || ':' || a.member_colocationid AS colocationid_pair
                FROM audit a) a

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: >-
      Citus colocation on {{ inputs.jdbc_url }} is {{ outputs.assess.row.state }}.
      {{ outputs.assess.row.pair_count }} declared pairs: {{ outputs.assess.row.colocated_count }} colocated,
      {{ outputs.assess.row.violation_count }} split while colocatable,
      {{ outputs.assess.row.refused_count }} that Citus would refuse,
      {{ outputs.assess.row.unknown_count }} naming a table that is not hash distributed here.
      citus.enable_repartition_joins is {{ outputs.assess.row.repartition_joins }}, so a split pair
      {{ outputs.assess.row.repartition_joins == 'on' ? 'joins through a repartition that ships data between workers' : 'cannot be joined at all (the planner raises "the query contains a join that requires repartitioning")' }}.
      {% for r in outputs.audit.rows %}[{{ r.member_table }} group={{ r.member_colocationid }} vs {{ r.anchor_table }} group={{ r.anchor_colocationid }} on {{ r.member_dist_column }} {{ r.member_dist_type }} x{{ r.member_shard_count }} shards: {{ r.verdict }}] {% endfor %}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.assess.row.state != 'OK' }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Citus colocation on ' ~ inputs.jdbc_url ~ ' is ' ~ outputs.assess.row.state ~ '. ' ~ outputs.assess.row.violation_count ~ ' of ' ~ outputs.assess.row.pair_count ~ ' declared pairs are in different colocation groups while being colocatable, so their joins repartition and a foreign key between them is rejected. ' ~ (outputs.assess.row.violation_list == '' ? '' : 'Split: ' ~ outputs.assess.row.violation_list ~ '. ') ~ (outputs.assess.row.refused_list == '' ? '' : 'Citus would refuse: ' ~ outputs.assess.row.refused_list ~ '. ') ~ (inputs.auto_remediate and not inputs.dry_run ? 'Re-colocation pending approval.' : 'No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: fixable
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.assess.row.violation_count > 0 }}"
        then:
          - id: log_plan
            type: io.kestra.plugin.core.log.Log
            message: >-
              The dry run. These are the exact statements this flow would run, one per split table:
              {{ outputs.assess.row.plan_sql }}
              update_distributed_table_colocation only rewrites pg_dist_partition.colocationid and
              the pg_dist_colocation row count. The shards already line up, so it moves no data and
              copies nothing between workers. It still changes how every future join between these
              tables is planned, which is why it waits for an approval.
              {{ outputs.assess.row.refused_list == '' ? '' : 'Left alone because Citus would refuse them: ' ~ outputs.assess.row.refused_list ~ '.' }}

          - id: remediate_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
            then:
              - id: approve
                type: io.kestra.plugin.core.flow.Pause
                description: >-
                  Resume the execution to run the statements listed by log_plan. Kill it to cancel.
                  The change is metadata only, so it is quick and reversible, but it re-plans every
                  join and every foreign key between these tables, so it is never applied without this.
                onResume:
                  - id: approved
                    type: BOOL
                    description: Set true to apply the re-colocation. Anything else leaves the groups as they are.
                    required: false

              - id: approval_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.approve.onResume.approved ?? false }}"
                then:
                  - id: recolocate
                    type: io.kestra.plugin.core.flow.Loop
                    description: >-
                      Remediation loop. One update_distributed_table_colocation per split table,
                      concurrencyLimit 1 so two statements never rewrite the same pg_dist_colocation
                      row at once. allowFailure on the statement, because a refusal from Citus must
                      not stop the pass: the re-read below is the only thing that decides the outcome.
                    concurrencyLimit: 1
                    values: "{{ outputs.assess.row.targets_json }}"
                    tasks:
                      - id: set_colocation
                        type: io.kestra.plugin.jdbc.postgresql.Query
                        description: >-
                          Move one table into the anchor's colocation group. Citus validates the
                          distribution column type and the shard count itself and raises if they
                          do not match, which is why the audit filters those pairs out first.
                        allowFailure: true
                        url: "{{ inputs.jdbc_url }}"
                        username: "{{ secret('POSTGRES_USERNAME') }}"
                        password: "{{ secret('POSTGRES_PASSWORD') }}"
                        fetchType: NONE
                        sql: >-
                          SELECT update_distributed_table_colocation('{{ fromJson(item.value).member }}', colocate_with => '{{ fromJson(item.value).anchor }}')

                  - id: recheck
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    description: >-
                      The gate. Re-read colocationid from pg_dist_partition for exactly the tables
                      that were targeted and compare it with the anchor again. The function returns
                      void and raises nothing when it silently achieves nothing, so its return is
                      worth less than this read.
                    url: "{{ inputs.jdbc_url }}"
                    username: "{{ secret('POSTGRES_USERNAME') }}"
                    password: "{{ secret('POSTGRES_PASSWORD') }}"
                    fetchType: FETCH_ONE
                    sql: |
                      {{ render(vars.audit_cte) }}, target AS (
                        SELECT (e.value -> 'member') #>> '{}' AS member_table,
                               ((e.value -> 'before_colocationid') #>> '{}')::int AS before_colocationid
                          FROM json_array_elements('{{ outputs.assess.row.targets_json }}'::json) AS e(value)
                      ), outcome AS (
                        SELECT t.member_table, t.before_colocationid,
                               a.member_colocationid AS after_colocationid,
                               a.anchor_table, a.anchor_colocationid, a.verdict
                          FROM target t LEFT JOIN audit a ON a.member_table = t.member_table
                      )
                      SELECT count(*)::int AS targeted,
                             (count(*) FILTER (WHERE verdict = 'COLOCATED'))::int AS now_colocated,
                             (count(*) FILTER (WHERE verdict IS DISTINCT FROM 'COLOCATED'))::int AS still_split,
                             (count(*) FILTER (WHERE verdict IS DISTINCT FROM 'COLOCATED')) = 0 AS fixed,
                             coalesce(string_agg(member_table || ' group ' || before_colocationid
                               || ' to ' || coalesce(after_colocationid::text, 'gone') || ' (anchor '
                               || coalesce(anchor_table, 'unknown') || ' group '
                               || coalesce(anchor_colocationid::text, 'none') || ')', '; '
                               ORDER BY member_table), '') AS movement,
                             coalesce((SELECT string_agg(member_table || ' still in group '
                               || coalesce(after_colocationid::text, 'none') || ' against anchor group '
                               || coalesce(anchor_colocationid::text, 'none'), '; ' ORDER BY member_table)
                               FROM outcome WHERE verdict IS DISTINCT FROM 'COLOCATED'), '') AS survivors
                        FROM outcome

                  - id: verify
                    type: io.kestra.plugin.core.flow.If
                    condition: "{{ outputs.recheck.row.fixed }}"
                    then:
                      - id: recolocated
                        type: io.kestra.plugin.core.log.Log
                        message: >-
                          {{ outputs.recheck.row.now_colocated }} of {{ outputs.recheck.row.targeted }}
                          tables now share their anchor's colocation group, read back from
                          pg_dist_partition after the change: {{ outputs.recheck.row.movement }}.
                          Joins between them plan locally per shard again, a foreign key on the
                          distribution column is accepted again and no data moved to get there.
                          {{ outputs.assess.row.colocated_list == '' ? '' : 'Pairs that were already correct and were not touched: ' ~ outputs.assess.row.colocated_list ~ '.' }}
                    else:
                      - id: remediation_failed
                        type: io.kestra.plugin.core.execution.Fail
                        errorMessage: >-
                          update_distributed_table_colocation ran without raising, but
                          {{ outputs.recheck.row.still_split }} of {{ outputs.recheck.row.targeted }}
                          targeted tables are still outside their anchor's colocation group:
                          {{ outputs.recheck.row.survivors }}. Movement seen:
                          {{ outputs.recheck.row.movement }}. The call needs the table owner or a
                          superuser, it raises on a shard count or distribution type it cannot match,
                          and a concurrent create_distributed_table can move the anchor out from
                          under it. Read pg_dist_partition and pg_dist_colocation on the coordinator.
                else:
                  - id: declined
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      The approval was resumed without approved set to true, so nothing was changed.
                      {{ outputs.assess.row.violation_count }} pairs are still split:
                      {{ outputs.assess.row.violation_list }}.
            else:
              - id: reported_only
                type: io.kestra.plugin.core.log.Log
                message: >-
                  {{ outputs.assess.row.violation_count }} colocatable pairs reported, none changed
                  (auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }}).
                  {{ outputs.assess.row.violation_list }}.
        else:
          - id: cannot_colocate
            type: io.kestra.plugin.core.log.Log
            message: >-
              Nothing here can be fixed by changing a colocation group.
              {{ outputs.assess.row.refused_count }} declared pairs disagree on distribution column
              type or shard count, which Citus checks itself and refuses.
              {{ outputs.assess.row.unknown_count }} declared pairs name a table that is not hash distributed on
              this coordinator: {{ outputs.assess.row.refused_list }}.
              Forcing these is not possible through update_distributed_table_colocation, so this
              flow does not try. Fixing them means an alter_distributed_table to the same shard
              count or distribution column type, which does rewrite the data. The other option is
              correcting the declaration because the two tables were never meant to join.
    else:
      - id: colocated
        type: io.kestra.plugin.core.log.Log
        message: >-
          All {{ outputs.assess.row.pair_count }} declared pairs share their anchor's colocation
          group, so their joins plan locally per shard: {{ outputs.assess.row.colocated_list }}.

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Citus colocation violation guard failed on ' ~ inputs.jdbc_url ~ ' (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and always in safe mode.
    cron: "0 3 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Citus Colocation Violation Guard
  shortDescription: Find Citus distributed tables that should share a colocation group but do not, which turns their joins into repartition joins and blocks foreign keys between them, then re-colocate them behind an approval and prove it from pg_dist_partition.
  metaTitle: Citus Colocation Violation Guard with Kestra
  metaDescription: Detect Citus tables that drifted into different colocation groups, re-colocate them with update_distributed_table_colocation and verify colocationid changed.
  description: |
    Citus colocates two distributed tables when they share a distribution column type and a shard count. That is what lets a join between them run locally on every worker, with no data crossing the network. Create one of them with `colocate_with => 'none'`, load the two through different paths or restore one from a dump and they land in different colocation groups while looking identical in every other way.

    Nothing errors at create time. The cost shows up later and somewhere else. Every join between the two tables becomes a repartition join that ships rows between workers. It fails outright if `citus.enable_repartition_joins` is off, which is the default. A foreign key between them is rejected with "cannot create foreign key constraint since relations are not colocated", so a migration that worked in staging stops at the gate in production.

    This blueprint takes the groups of tables you expect to join as an input, reads `colocationid` for each of them from `pg_dist_partition` then reports the pairs that drifted apart. It calls `update_distributed_table_colocation` behind a dry run and an approval, then reads `colocationid` again and fails the run if the pair is still split.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    Five things that decided how this check is built:

    - **The fix is metadata only when the shards already line up.** `update_distributed_table_colocation` rewrites `pg_dist_partition.colocationid` and the `pg_dist_colocation` row count. It copies nothing and moves no shard, because shard `N` of both tables already lives on the same worker by construction: same distribution column type, same shard count, same hash ranges. That is worth stating plainly, because the neighbouring operation is a shard rebalance, which does move bytes between workers and takes as long as the data is large. This one returned in milliseconds on every pair tested.
    - **A Citus function reporting success does not mean it achieved anything.** `update_distributed_table_colocation` returns `void`. There is no row count, no job id, nothing to branch on. So the flow re-reads `colocationid` from `pg_dist_partition` for exactly the tables it targeted and fails the run when any of them is still outside the anchor's group. The function's return is never the gate.
    - **Citus refuses some pairs itself, so the audit has to refuse them first.** `update_distributed_table_colocation('shipments', colocate_with => 'orders')` raises `cannot colocate tables orders and shipments` with `Shard counts don't match`. The same call across a `bigint` and a `text` distribution column raises `Distribution column types don't match`. A pair that disagrees on either is reported as refused, never attempted. Fixing one of those means `alter_distributed_table`, which does rewrite the data, so it is a different decision and does not belong behind this approval.
    - **Citus checks the pair, it does not check what already depends on the pair.** It refuses to create a foreign key between two tables in different colocation groups, but `update_distributed_table_colocation` does not look for foreign keys at all. Measured: with a valid `FOREIGN KEY (tenant_id, order_id)` from `order_items` to `orders`, moving `order_items` into a third table's group succeeded. The constraint was still there afterwards with `convalidated = true`, now spanning two colocation groups. So this call can quietly undo the thing a colocation group was set up to allow. That is the reason the change sits behind an approval even though it is cheap. It is also why the flow only ever moves a table toward an anchor you named.
    - **Whether a split pair is slow or broken depends on one setting.** With `citus.enable_repartition_joins` off, which is the shipped default, a join across colocation groups does not merely repartition, the planner raises `the query contains a join that requires repartitioning`. With it on, the same query runs as two `MapMergeJob` stages. The flow reads the setting and says which of the two a reader is looking at, because the symptom people report is either "this query is slow" or "this query errors" and both come from the same cause.

    ## Safety

    - The whole detection path is `SELECT` only against `pg_dist_partition`, `pg_dist_shard`, `pg_attribute` and `current_setting`.
    - A change runs only when `auto_remediate` is true, `dry_run` is false, the audit found at least one colocatable pair, a human resumed the `approve` task and that resume carried `approved: true`. An unanswered resume is not an approval.
    - Only tables named in `expected_groups` are ever touched. A pair that is already correct is not re-issued.
    - A pair Citus would refuse is reported and left alone. The flow never reaches for `alter_distributed_table`, which rewrites data.
    - The run fails when `colocationid` did not change, so a silent no-op cannot be reported as a fix.

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.postgresql.Query`, read-only) expands `expected_groups` into one row per pair and joins each side to `pg_dist_partition` by `to_regclass`, so a schema qualified or quoted name resolves the way Postgres resolves it. Each row carries both `colocationid` values, the distribution column from `column_to_column_name`, its `format_type` and the shard count from `pg_dist_shard`.
    2. Each pair gets a verdict:

       | Verdict | Meaning |
       |---|---|
       | `COLOCATED` | Both sides share one `colocationid`. Joins plan locally per shard |
       | `VIOLATION` | Same distribution column type and shard count, different `colocationid`. Fixable, which is what this flow fixes |
       | `SHARD_COUNT_MISMATCH` | Shard counts differ. Citus refuses to colocate them |
       | `TYPE_MISMATCH` | Distribution column types differ. Citus refuses to colocate them |
       | `UNKNOWN_TABLE` | One side is not a hash distributed Citus table on this coordinator |

    3. `assess` rolls the pairs up into `VIOLATION`, `NOT_COLOCATABLE` or `OK`, builds the target list for the loop, writes out the exact statements for the dry run and reads `citus.enable_repartition_joins`.
    4. `report` logs the verdict and every pair with both group ids, the distribution column and the shard count.
    5. `route` (`io.kestra.plugin.core.flow.If`):
       - **OK:** `colocated` lists the pairs that are correct.
       - **anything else:** `alert` posts to Slack.
         - `cannot_colocate` ends the run when nothing is fixable, naming what Citus would refuse and why.
         - `log_plan` prints the `update_distributed_table_colocation` statements, which is the dry run.
         - `remediate_gate` continues only with `auto_remediate` true and `dry_run` false. Otherwise `reported_only` says what would have changed.
         - `approve` (`io.kestra.plugin.core.flow.Pause`) waits for a human. `approval_result` stops at `declined` unless the resume carried `approved: true`.
         - `recolocate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs one `update_distributed_table_colocation` per target, with `allowFailure` so one refusal does not hide the rest.
         - `recheck` re-reads `colocationid` for the targeted tables and compares it with the anchor again.
         - `verify` logs the before and after groups. Otherwise `remediation_failed` fails the run with the tables that are still split.
    6. `errors` alerts Slack when the coordinator cannot be read.

    ## What you get

    - One row per declared pair with both `colocationid` values, the distribution column, its type and the shard count, so the reason a pair is split is on screen next to the pair.
    - The exact statements the flow would run, before anything changes.
    - A re-colocation that only runs after a human resumes it with an explicit yes.
    - A re-read of `pg_dist_partition` that fails the run when the group did not change.
    - A plain statement of whether a split pair currently makes joins slow or makes them error, read from the live setting.

    ## Who it's for

    - Teams on Citus whose multi-tenant tables are expected to join on the tenant key, where one table created with `colocate_with => 'none'` silently costs every join.
    - Platform teams who restore or rebuild one distributed table at a time and need to prove the groups still line up afterwards.
    - Anyone blocked by `cannot create foreign key constraint since relations are not colocated` on a migration that passed in staging.

    ## Why orchestrate this with Kestra

    Colocation drifts quietly. It drifts when a table is rebuilt, when a shard count is set by hand, when a dump is restored into a fresh cluster. Nothing raises at the time and the join that pays for it may not run until month end. Kestra reads the declaration against the live metadata on a schedule, sends the split pairs to Slack, holds the metadata change behind an approval and keeps the before and after group ids on the execution, so the day a join gets slow there is a record of when the groups diverged.

    ## Tested end to end

    On Kestra 2.0.5 OSS against Citus 12.1.6 on PostgreSQL 16, single node with the coordinator holding shards, with a local HTTP sink standing in for Slack. Six distributed tables: `orders` (`bigint`, 8 shards), `order_items` (`bigint`, 8 shards, created with `colocate_with => 'none'`, the planted violation), `customers` and `customer_events` (`bigint`, 8 shards, correctly colocated with each other), `shipments` (`bigint`, 4 shards) and `regions` (`text`, 8 shards).

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | `VIOLATION`. `order_items` in group 2 against `orders` in group 1, `customers` and `customer_events` both group 3 and untouched. Alert sent, one statement planned, nothing applied |
    | 2 | only the correctly colocated pair declared | `OK`. The detector reports zero on a clean declaration, which is what makes run 1 mean something |
    | 3 | `auto_remediate: true`, `dry_run: true` | Same plan, nothing applied. `psql` confirms `order_items` still in group 2 |
    | 4 | `auto_remediate: true`, `dry_run: false` | Paused, resumed with `approved: true`. `order_items` moved from group 2 to group 1, `recheck` read it back from `pg_dist_partition` and `verify` passed |
    | 5 | defaults, straight after run 4 | `OK`. Both pairs colocated |
    | 6 | `auto_remediate: true`, `dry_run: false`, resumed with no answer | `declined`. Nothing changed, group ids unmoved |
    | 7 | declaration pairing `orders` with `shipments` and `regions` | `NOT_COLOCATABLE`. Reported as a shard count mismatch (8 against 4) and a type mismatch (`text` against `bigint`), alert sent, nothing attempted |
    | 8 | `auto_remediate: true`, `dry_run: false` as a role that does not own the table | The failure path. `update_distributed_table_colocation` was rejected, `recheck` found the table still in its old group and `remediation_failed` failed the run with the before and after ids |
    | 9 | unreachable coordinator | `errors` alert sent |

    The payoff was measured directly on the same cluster, not inferred. While `order_items` sat in group 2, `ALTER TABLE order_items ADD CONSTRAINT ... FOREIGN KEY (tenant_id, order_id) REFERENCES orders (tenant_id, order_id)` was rejected with `cannot create foreign key constraint since relations are not colocated or not referencing a reference table`. `SELECT count(*) FROM orders JOIN order_items USING (tenant_id, order_id)` was rejected with `the query contains a join that requires repartitioning`. After the flow re-colocated the table, the same foreign key was accepted and the same join planned as `Citus Adaptive, Task Count: 8` with a local hash join inside each shard pair. Every group id in the table above was read from `pg_dist_partition` in `psql` on the coordinator, not only from the Kestra logs.

    ## Prerequisites

    - A Citus cluster, version 10 or later, reached through its coordinator. `update_distributed_table_colocation` was added in Citus 10.
    - A role that can read `pg_dist_partition`, `pg_dist_shard` and `pg_attribute` for the detection path.
    - The re-colocation needs the owner of both tables or a superuser. A role that owns neither is rejected and the re-read turns that into a failed run rather than a silent pass.
    - The two tables in a pair must already agree on distribution column type and shard count. Pairs that do not are reported, never forced.
    - `citus.enable_repartition_joins` is off by default, so a split pair usually shows up as a planner error rather than a slow query.

    ### Secrets

    - `POSTGRES_USERNAME` / `POSTGRES_PASSWORD`: credentials for the coordinator.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:postgresql://localhost:5432/citus` | Coordinator |
    | `expected_groups` | two example groups | Lists of table names that should colocate, first entry of each is the anchor |
    | `auto_remediate` | `false` | Allow a colocation group to be changed |
    | `dry_run` | `true` | Must be `false` before any group is changed |

    ## Quick start

    1. Add the `POSTGRES_USERNAME`, `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow and set `jdbc_url` to your coordinator.
    3. Replace `expected_groups` with the tables you actually join together. Run it once with the defaults and read the per-pair table.
    4. Run it with `auto_remediate: true` and `dry_run: false`, then resume the `approve` task with `approved: true` to apply the plan.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Derive `expected_groups` from the foreign keys you already have or from `pg_stat_statements`, so the declaration is not maintained by hand.
    - Add the foreign key you actually wanted as a follow-up task, now that the pair is colocated. Let it fail the run if it is still rejected.
    - Record each run's group ids in the KV store, so the day a table changes group shows up as an event rather than as a slow query weeks later.
    - Pair it with a check on `citus.enable_repartition_joins`, so a cluster that hides this class of bug behind repartitioning is flagged on its own.
    - Point the same audit at a staging cluster before a release, so a migration that needs a foreign key is proved possible before the window opens.
    - Extend the verdicts with `alter_distributed_table` as a separate, heavier flow for the pairs this one refuses, keeping the data rewriting decision apart from the metadata one.

