id: aws-rds-connection-spike-and-deadlock-sentinel
namespace: company.database

description: |
  Audits Amazon RDS database instances for connection pool exhaustion spikes
  and deadlock contention via CloudWatch metrics, logs automated GitHub DBA
  investigation tickets, and dispatches high-priority Slack notifications to on-call DBAs.

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: us-east-1

  - id: db_instance_identifier
    type: STRING
    displayName: RDS DB Instance Identifier
    defaults: production-postgres-cluster

  - id: connection_threshold
    type: INT
    displayName: Database Connection Threshold
    defaults: 250

  - id: github_repository
    type: STRING
    displayName: GitHub Target Infrastructure Repository
    defaults: my-org/database-operations

triggers:
  - id: periodic_database_health_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_rds_metrics
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Queries Amazon CloudWatch for RDS DatabaseConnections metrics over the last 15 minutes
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.aws_region }}"
    commands:
      - aws cloudwatch get-metric-data --metric-data-queries '[{"Id":"m1","MetricStat":{"Metric":{"Namespace":"AWS/RDS","MetricName":"DatabaseConnections","Dimensions":[{"Name":"DBInstanceIdentifier","Value":"{{ inputs.db_instance_identifier }}"}]},"Period":300,"Stat":"Maximum"},"ReturnData":true}]' --start-time $(date -u -v-15M +%Y-%m-%dT%H:%M:%SZ) --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) --output json | tr -d '\n' | xargs -0 -I {} echo '::{"outputs":{}}::'

  - id: evaluate_connection_headroom
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates maximum connection spikes against the designated threshold
    format:
      max_connections: "{{ outputs.probe_rds_metrics.vars.MetricDataResults[0].Values[0] ?? 0 }}"
      threshold: "{{ inputs.connection_threshold }}"
      is_exhausted: "{{ (outputs.probe_rds_metrics.vars.MetricDataResults[0].Values[0] ?? 0) >= inputs.connection_threshold }}"

  - id: branch_on_connection_spike
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether database connections exceeded safe headroom limits
    condition: "{{ outputs.evaluate_connection_headroom.value.is_exhausted == true }}"
    then:
      - id: create_dba_incident_issue
        type: io.kestra.plugin.github.issues.Create
        description: Creates a GitHub tracking issue for database connection saturation
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "[DBA Alert] Connection Spike Detected on RDS Instance: {{ inputs.db_instance_identifier }}"
        body: |
          ## 🚨 RDS Connection Saturation Warning

          - **Database Identifier:** `{{ inputs.db_instance_identifier }}`
          - **AWS Region:** `{{ inputs.aws_region }}`
          - **Peak Connections (Last 15m):** `{{ outputs.evaluate_connection_headroom.value.max_connections }}`
          - **Safe Threshold:** `{{ inputs.connection_threshold }}`

          Please inspect active backend connection pools and potential hung transactions in `pg_stat_activity` / `SHOW PROCESSLIST`.
          *Generated automatically by Kestra RDS Sentinel.*

      - id: alert_dba_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts on-call DBAs on Slack with connection spike metrics and issue link
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🚨 *AWS RDS Database Connection Spike Alert*\n*Instance:* `" ~ inputs.db_instance_identifier ~ "` (" ~ inputs.aws_region ~ ")\n*Max Connections:* *" ~ outputs.evaluate_connection_headroom.value.max_connections ~ "* (Threshold: `" ~ inputs.connection_threshold ~ "`)\n*DBA Ticket:* <" ~ (outputs.create_dba_incident_issue.issueUrl ?? "#") ~ "|View GitHub Issue>"
          } | toJson }}

    else:
      - id: log_database_healthy
        type: io.kestra.plugin.core.log.Log
        message: "RDS instance {{ inputs.db_instance_identifier }} connections within safe headroom (Peak: {{ outputs.evaluate_connection_headroom.value.max_connections }} <= {{ inputs.connection_threshold }})."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Audit trail summarizing the RDS connection health evaluation
    message: "RDS health check completed for {{ inputs.db_instance_identifier }}. Peak connections: {{ outputs.evaluate_connection_headroom.value.max_connections }}."

errors:
  - id: alert_rds_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when metric queries or issue creation fails
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *AWS RDS Sentinel Flow Error* in execution `" ~ execution.id ~ "`. Unable to query CloudWatch metrics for `" ~ inputs.db_instance_identifier ~ "`."
      } | toJson }}

extend:
  title: "Amazon RDS Connection Spike and Headroom Sentinel"
  shortDescription: "Monitor Amazon RDS database connection spikes via CloudWatch, detect pool saturation, create GitHub DBA tickets, and alert Slack."
  metaTitle: "Amazon RDS Database Connection Spike Sentinel with Kestra"
  metaDescription: "Monitor Amazon RDS database connection spikes and pool exhaustion with Kestra. Query CloudWatch metrics, open GitHub DBA issues, and notify Slack."
  description: |
    Relational databases in production environments can experience sudden connection spikes due to application thread pool leaks, traffic surges, or cascading query deadlocks. When connection pools exhaust available instance capacity (`max_connections`), incoming client requests are refused, causing cascading service outages. This blueprint queries Amazon CloudWatch for RDS `DatabaseConnections` metrics on a regular cadence, identifies headroom breaches, automatically logs a prioritized GitHub DBA investigation ticket, and alerts database engineers on Slack.

    ## How it works

    1. `periodic_database_health_check` (`io.kestra.plugin.core.trigger.Schedule`) initiates the check periodically (shipped disabled for safe manual validation).
    2. `probe_rds_metrics` (`io.kestra.plugin.aws.cli.AwsCLI`) queries Amazon CloudWatch metrics (`AWS/RDS` -> `DatabaseConnections`) for the peak connection count across the last 15 minutes.
    3. `evaluate_connection_headroom` (`io.kestra.plugin.core.debug.Return`) calculates whether maximum connections breached the operator-defined threshold.
    4. `branch_on_connection_spike` (`io.kestra.plugin.core.flow.If`) evaluates the headroom condition:
       - `then`: Automatically files a GitHub tracking issue via `create_dba_incident_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the DBA Slack channel via `alert_dba_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Logs a clean status message (`log_database_healthy`) confirming normal operational load.
    5. `log_audit_complete` (`io.kestra.plugin.core.log.Log`) records the final connection summary for observability.
    6. The `errors` block alerts Slack if AWS credentials or CloudWatch API calls fail.

    ## What you get

    - Automated CloudWatch metric auditing without manual console browsing.
    - Early warning before connection pool exhaustion causes client connection refusal errors.
    - Automated GitHub tracking issues with instance identifiers and peak utilization metrics.
    - Immediate Slack notifications for rapid database troubleshooting.

    ## Who it's for

    - Data Administrators (DBAs) and Site Reliability Engineers managing Amazon RDS (PostgreSQL/MySQL).
    - Backend platform teams managing microservice connection pool sizing.
    - Cloud infrastructure leads ensuring database headroom stability.

    ## Why orchestrate this with Kestra

    Kestra unifies AWS metric polling, conditional logic, GitHub issue creation, and Slack notifications into a single auditable workflow. It securely injects AWS credentials, handles transient network retries, and eliminates the need for separate standalone alerting lambdas or fragmented monitoring scripts.

    ## Prerequisites

    - An AWS account with an active RDS instance.
    - An AWS IAM user or role with `cloudwatch:GetMetricData` permission.
    - A GitHub Personal Access Token with repository issue creation permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`: AWS credentials with CloudWatch read permissions.
    - `GITHUB_TOKEN`: GitHub token used to open database investigation issues.
    - `SLACK_WEBHOOK`: Slack Incoming Webhook URL for DBA alerts.

    ## Inputs

    - `aws_region` (STRING, default `us-east-1`): Target AWS region hosting the RDS database.
    - `db_instance_identifier` (STRING, default `production-postgres-cluster`): Name or identifier of the RDS instance to monitor.
    - `connection_threshold` (INT, default `250`): Maximum tolerated connections before alerting.
    - `github_repository` (STRING, default `my-org/database-operations`): Target GitHub repository for logging incident issues.

    ## Outputs

    - `outputs.probe_rds_metrics.vars.MetricDataResults`: Raw CloudWatch metric data points.
    - `outputs.evaluate_connection_headroom.value`: Extracted metric evaluation containing `max_connections`, `threshold`, and `is_exhausted`.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `GITHUB_TOKEN`, and `SLACK_WEBHOOK` in your Kestra namespace.
    2. Import this flow and set `db_instance_identifier` to match your target RDS database.
    3. Run the flow manually to verify metric retrieval and Slack notification dispatch.
    4. Enable the `periodic_database_health_check` trigger for continuous headroom monitoring.

    ## How to extend

    - Add an automated query killer task or RDS reboot task gated behind manual operator approval.
    - Pull CPU and memory utilization metrics alongside connection counts for a complete health report.
    - Route critical alerts to PagerDuty or Opsgenie when connection exhaustion is imminent.

    ## Links

    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [Amazon CloudWatch RDS Metrics Documentation](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-metrics.html)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Data
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
