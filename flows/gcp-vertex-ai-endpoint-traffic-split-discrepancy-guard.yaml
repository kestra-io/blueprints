id: gcp-vertex-ai-endpoint-traffic-split-discrepancy-guard
namespace: company.ai

description: |
  Audits Google Cloud Vertex AI model serving endpoints for skewed traffic splits, unrouted deployed models,
  and failed canary rollouts to safeguard production machine learning inference pipelines.

concurrency:
  limit: 1

inputs:
  - id: gcp_project_id
    type: STRING
    displayName: GCP Project ID
    defaults: "company-prod-mlops"
    description: Google Cloud project identifier containing the Vertex AI serving endpoints.

  - id: gcp_region
    type: STRING
    displayName: GCP Region
    defaults: "us-central1"
    description: Google Cloud location where Vertex AI endpoints are deployed.

  - id: endpoint_id
    type: STRING
    displayName: Vertex AI Endpoint ID
    defaults: "1234567890123456789"
    description: Numeric resource ID of the target Vertex AI model serving endpoint.

  - id: expected_primary_split_min_percent
    type: INT
    displayName: Min Primary Split (%)
    defaults: 80
    description: Minimum acceptable traffic split percentage allocated to the primary baseline model.

  - id: alert_on_discrepancy
    type: BOOL
    displayName: Alert on Discrepancy
    defaults: true
    description: Whether to dispatch automated Slack alerts when traffic split percentages deviate from safe deployment baselines.

tasks:
  - id: scan_vertex_traffic_split
    type: io.kestra.plugin.scripts.python.Script
    description: Queries GCP Vertex AI API to inspect endpoint model deployment configuration and traffic split ratios.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install google-cloud-aiplatform kestra
    env:
      GCP_SERVICE_ACCOUNT_KEY: "{{ secret('GCP_SERVICE_ACCOUNT_KEY') }}"
    script: |
      import os
      import json
      from google.cloud import aiplatform
      from google.oauth2 import service_account
      from kestra import Kestra

      project_id = "{{ inputs.gcp_project_id }}".strip()
      region = "{{ inputs.gcp_region }}".strip()
      endpoint_id = "{{ inputs.endpoint_id }}".strip()
      min_split = int("{{ inputs.expected_primary_split_min_percent }}")
      sa_json = os.environ.get("GCP_SERVICE_ACCOUNT_KEY", "")

      endpoint_name = endpoint_id
      traffic_split = {}
      deployed_models = []
      has_discrepancy = False

      try:
          if sa_json:
              creds = service_account.Credentials.from_service_account_info(json.loads(sa_json))
              aiplatform.init(project=project_id, location=region, credentials=creds)
          else:
              aiplatform.init(project=project_id, location=region)

          endpoint = aiplatform.Endpoint(endpoint_name=endpoint_id)
          endpoint_name = endpoint.display_name
          traffic_split = endpoint.traffic_split or {}

          for m in endpoint.deployed_models:
              deployed_models.append({
                  "id": m.id,
                  "model": m.model,
                  "display_name": m.display_name
              })

          # Evaluate traffic split consistency
          total_traffic = sum(traffic_split.values())
          if total_traffic != 100 and len(deployed_models) > 0:
              has_discrepancy = True

          # Check if any deployed model has 0% traffic (orphaned candidate model)
          for m in deployed_models:
              if m["id"] not in traffic_split or traffic_split[m["id"]] == 0:
                  has_discrepancy = True

          report = {
              "endpoint_id": endpoint_id,
              "endpoint_name": endpoint_name,
              "deployed_models_count": len(deployed_models),
              "traffic_split": traffic_split,
              "total_traffic": total_traffic,
              "has_discrepancy": has_discrepancy,
              "remediation_advice": f"Review deployed model splits on Vertex AI Endpoint {endpoint_id}. Verify canary model promotion."
          }

          with open("vertex_report.json", "w") as f:
              json.dump(report, f)

          Kestra.outputs({
              "endpoint_id": endpoint_id,
              "endpoint_name": endpoint_name,
              "has_discrepancy": has_discrepancy,
              "deployed_models_count": len(deployed_models)
          })

      except Exception as e:
          print(f"Error querying Vertex AI Endpoint: {e}")
          report = {
              "endpoint_id": endpoint_id,
              "error": str(e),
              "has_discrepancy": False
          }
          with open("vertex_report.json", "w") as f:
              json.dump(report, f)
          Kestra.outputs({
              "endpoint_id": endpoint_id,
              "endpoint_name": endpoint_name,
              "has_discrepancy": False,
              "deployed_models_count": 0
          })

  - id: check_traffic_split_anomaly
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether traffic split ratios or orphaned deployed models indicate a deployment discrepancy.
    condition: "{{ fromJson(read('vertex_report.json')).has_discrepancy and inputs.alert_on_discrepancy }}"
    then:
      - id: notify_slack_traffic_split_anomaly
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority Vertex AI model routing discrepancy alert to MLOps on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#mlops-serving-alerts",
            "username": "VertexAI-Sentinel",
            "text": "WARNING: Google Cloud Vertex AI Endpoint `{{ fromJson(read('vertex_report.json')).endpoint_name }}` (`{{ fromJson(read('vertex_report.json')).endpoint_id }}`) has traffic split discrepancies! Deployed models: {{ fromJson(read('vertex_report.json')).deployed_models_count }}. Traffic split: {{ fromJson(read('vertex_report.json')).traffic_split }}. Runbook: {{ fromJson(read('vertex_report.json')).remediation_advice }}"
          }

  - id: log_serving_health_state
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of Vertex AI endpoint traffic split evaluation.
    message: "Vertex AI audit completed for '{{ fromJson(read('vertex_report.json')).endpoint_name }}'. Deployed models: {{ fromJson(read('vertex_report.json')).deployed_models_count }}, Discrepancy: {{ fromJson(read('vertex_report.json')).has_discrepancy }}."

  - id: export_vertex_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of Vertex AI model serving configurations for MLOps audit records.
    format: "{{ fromJson(read('vertex_report.json')) }}"

triggers:
  - id: hourly_vertex_traffic_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing Vertex AI model serving endpoints hourly.
    cron: "0 * * * *"

extend:
  title: GCP Vertex AI Endpoint Traffic Split Discrepancy Guard
  metaTitle: GCP Vertex AI Endpoint Traffic Split Discrepancy Guard Blueprint
  shortDescription: Audits Google Cloud Vertex AI model serving endpoints for skewed traffic splits and orphaned deployed models.
  metaDescription: Audits Google Cloud Vertex AI model serving endpoints for skewed traffic splits and orphaned deployed models, alerting MLOps teams via Slack.
  description: |
    Modern artificial intelligence platforms and machine learning engineering teams deploy production predictive models, embedding engines, and classification microservices to Google Cloud Vertex AI Model Serving endpoints. To support continuous deployment, canary testing, and A/B bakeoffs, Vertex AI endpoints allow hosting multiple deployed models behind a single unified HTTPS endpoint, distributing incoming inference traffic according to configurable integer percentages (e.g. 90% to baseline model, 10% to canary candidate). However, when automated CI/CD deployment pipelines fail mid-flight, canary models are undeployed without recalculating split weights, or unrouted models remain deployed consuming expensive GPU/TPU node quotas with 0% traffic allocation, inference budgets are squandered and user requests risk unhandled 404 or 503 routing failures. This sentinel interrogates Google Cloud Vertex AI endpoints hourly, inspects deployed model weights and traffic percentages, and notifies MLOps on Slack with remediation actions.

    ## How it works
    1. **Scheduled triggering**: Executes hourly via automated cron trigger (`0 * * * *`) or runs on-demand via manual execution.
    2. **Endpoint metadata inspection**: Interrogates the Google Cloud AI Platform API using the `google-cloud-aiplatform` SDK to fetch endpoint details.
    3. **Deployed model enumeration**: Gathers all active model revisions bound to the target endpoint, recording model IDs and display names.
    4. **Traffic split validation**: Verifies that the sum of all traffic weights equals exactly 100% and identifies any deployed models receiving 0% traffic.
    5. **Conditional alerting**: An `io.kestra.plugin.core.flow.If` flowable checks if traffic splits are inconsistent and dispatches an alert to `#mlops-serving-alerts`.
    6. **Manifest export**: Emits a structured JSON audit payload detailing model weights and deployment parameters for MLOps governance.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[hourly_vertex_traffic_audit Schedule Trigger] --> B[scan_vertex_traffic_split Python Script]
      B --> C[check_traffic_split_anomaly Flowable If]
      C -- Routing Discrepancy Found --> D[notify_slack_traffic_split_anomaly Webhook]
      C -- Model Routing Nominal --> E[log_serving_health_state Log]
      D --> E
      E --> F[export_vertex_manifest Return]
    ```

    ## What you get
    - Proactive detection of stalled canary rollouts and unrouted candidate model deployments.
    - Identification of idle GPU and TPU machine resources driving unnecessary Google Cloud compute costs.
    - Contextual Slack alerts detailing active model IDs, current split percentages, and console triage links.
    - Structured JSON audit records tracking model serving evolution and production traffic routing over time.

    ## Who it's for
    - Machine Learning Engineers (MLEs) managing real-time model serving and progressive canary rollouts.
    - MLOps Platform Teams maintaining shared Vertex AI endpoints across multiple data science units.
    - FinOps Practitioners optimizing cloud AI compute budgets and eliminating orphaned inference nodes.

    ## Why orchestrate this with Kestra
    Machine learning endpoint governance spans infrastructure monitoring, model artifact tracking, and team alerting. Kestra connects directly to the Google Cloud AI Platform Python SDK, executes containerized diagnostic scripts, validates complex multi-model routing states, and coordinates team notifications. With Kestra's containerized Python runner and native secret management, MLOps teams automate endpoint reliability without maintaining fragile custom cron scripts.

    ## Use cases
    - **Canary Promotion Verification**: Verify that newly deployed model revisions receive expected experimental traffic shares post-deployment.
    - **Orphaned Inference Node Reclamation**: Spot models left deployed with 0% traffic that continue incurring machine hourly charges.
    - **Inference Routing Stability**: Prevent routing drift where traffic allocations do not total 100%, causing transient prediction request drops.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `gcp_project_id` | `STRING` | `company-prod-mlops` | Google Cloud project identifier containing the Vertex AI serving endpoints. |
    | `gcp_region` | `STRING` | `us-central1` | Google Cloud location where Vertex AI endpoints are deployed. |
    | `endpoint_id` | `STRING` | `1234567890123456789` | Numeric resource ID of the target Vertex AI model serving endpoint. |
    | `expected_primary_split_min_percent` | `INT` | `80` | Minimum acceptable traffic split percentage allocated to the primary baseline model. |
    | `alert_on_discrepancy` | `BOOL` | `true` | Whether to dispatch automated Slack alerts when traffic split percentages deviate from safe deployment baselines. |

    ## Expected outputs
    - `{{ outputs.scan_vertex_traffic_split.vars.endpoint_name }}`: Display name of the evaluated Vertex AI endpoint.
    - `{{ outputs.scan_vertex_traffic_split.vars.deployed_models_count }}`: Count of active model revisions deployed to the endpoint.
    - `{{ outputs.scan_vertex_traffic_split.vars.has_discrepancy }}`: Boolean flag indicating whether routing discrepancies were detected.
    - `{{ outputs.export_vertex_manifest.value }}`: Structured dictionary containing the consolidated Vertex AI serving diagnostic manifest.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to Vertex AI API endpoints (`*-aiplatform.googleapis.com`).
    - A GCP Service Account JSON key configured with `roles/aiplatform.viewer` permissions.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `GCP_SERVICE_ACCOUNT_KEY`: Service account credentials JSON with permissions to inspect Vertex AI endpoints.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch MLOps serving alerts.

    ## Quick start
    1. Register `GCP_SERVICE_ACCOUNT_KEY` and `SLACK_WEBHOOK_URL` in your Kestra secret storage.
    2. Import this blueprint into your Kestra instance under the `company.ai` namespace.
    3. Update `gcp_project_id`, `gcp_region`, and `endpoint_id` with your target Vertex AI endpoint parameters.
    4. Run a manual execution to test Vertex AI API connectivity and verify the output manifest format.

    ## Common pitfalls and troubleshooting
    - **Regional Endpoint Routing**: Vertex AI requires specifying the exact region (e.g. `us-central1`, `europe-west4`); incorrect regions return 404 Not Found errors.
    - **Service Account Permissions**: Ensure the service account has `aiplatform.endpoints.get` and `aiplatform.endpoints.list` permissions.
    - **Empty Traffic Split**: When a model is first deployed without specifying traffic split, traffic defaults to an empty dictionary until explicitly configured.

    ## How to extend
    - **Automated Canary Traffic Promotion**: Trigger an automated task to incrementally advance canary model traffic from 10% to 50% upon healthy inference validation.
    - **Orphaned Model Undeploy**: Automatically undeploy models that have received 0% traffic for more than 7 days to eliminate idle compute spend.
    - **Multi-Endpoint Organization Audit**: Wrap the evaluation in an `io.kestra.plugin.core.flow.ForEach` loop to scan all Vertex AI endpoints across the ML platform.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Google Cloud Vertex AI Deploy Model Documentation](https://cloud.google.com/vertex-ai/docs/general/deployment)
    - [Vertex AI Python SDK Reference](https://cloud.google.com/python/docs/reference/aiplatform/latest)
  tags:
    - AI
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
