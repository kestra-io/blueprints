id: cloudflare-waf-custom-rule-block-rate-sentinel
namespace: company.security

description: |
  Continuous security sentinel for Cloudflare WAF custom firewall rules.
  Queries Cloudflare GraphQL Analytics API for adaptive firewall events and time-series
  metrics, inspects mitigated actions (block, challenge, managed_challenge, js_challenge),
  detects acute rate spikes (> 500% over rolling 1-hour baseline), isolates top client ASNs,
  targeted URI paths, and rule IDs, records telemetry in Kestra KV, and alerts Slack.

inputs:
  - id: zone_id
    type: STRING
    displayName: "Cloudflare Zone ID"
    defaults: "023e105f4ecef8ad9ca31a8372d0c353"
    description: "Hexadecimal 32-character identifier of the Cloudflare zone under WAF surveillance."

  - id: spike_threshold_pct
    type: FLOAT
    displayName: "Block Rate Spike Threshold (%)"
    defaults: 500.0
    description: "Percentage surge in mitigated WAF events relative to the rolling 1-hour baseline required to trigger an alert."

  - id: lookback_minutes
    type: INT
    displayName: "Analytics Lookback Window (Minutes)"
    defaults: 75
    description: "Time window in minutes queried from Cloudflare GraphQL Analytics API, capturing the current evaluation period and rolling 1-hour baseline."

  - id: min_block_count_for_spike
    type: INT
    displayName: "Minimum Block Count Threshold"
    defaults: 50
    description: "Minimum absolute number of mitigated requests required in current interval before flagging a rate spike to eliminate low-volume false alarms."

  - id: alert_on_spike
    type: BOOL
    displayName: "Alert On Spike"
    defaults: true
    description: "Determines whether high-priority Slack notifications are dispatched when block rate anomalies or severe spikes are detected."

triggers:
  - id: periodic_waf_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true
    description: "Periodic schedule evaluating Cloudflare WAF block rate trends every 5 minutes. Shipped disabled for initial configuration and manual validation."

  - id: on_waf_security_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('CLOUDFLARE_WAF_WEBHOOK_KEY') }}"
    description: "Inbound webhook trigger for Cloudflare Notification Service or external SIEM systems to initiate an immediate WAF forensic inspection."

tasks:
  - id: get_previous_waf_telemetry
    type: io.kestra.plugin.core.kv.Get
    description: "Retrieves previous WAF telemetry and block rate baseline from Kestra KV store for the specified zone."
    key: "cloudflare_waf_telemetry_{{ inputs.zone_id }}"
    errorOnMissing: false

  - id: query_cloudflare_waf_analytics
    type: io.kestra.plugin.core.http.Request
    description: "Queries Cloudflare GraphQL Analytics API for firewallEventsAdaptiveByTimeGroups and adaptive firewall events."
    uri: "https://api.cloudflare.com/client/v4/graphql"
    method: POST
    contentType: application/json
    headers:
      Authorization: "Bearer {{ secret('CLOUDFLARE_API_TOKEN') }}"
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    allowFailure: true
    body: |
      {
        "query": "query GetWafAnalytics($zoneTag: String!, $start: String!, $end: String!, $actions: [String!]) { viewer { zones(filter: { zoneTag: $zoneTag }) { firewallEventsAdaptiveByTimeGroups(limit: 100, filter: { datetime_geq: $start, datetime_leq: $end, action_in: $actions }, orderBy: [datetimeFiveMinutes_DESC]) { count dimensions { datetimeFiveMinutes action } } firewallEventsAdaptive(limit: 100, filter: { datetime_geq: $start, datetime_leq: $end, action_in: $actions }, orderBy: [datetime_DESC]) { action ruleId clientAsn clientASNDescription clientCountryName clientRequestPath clientIP datetime source } } } }",
        "variables": {
          "zoneTag": "{{ inputs.zone_id }}",
          "start": "{{ now() | dateAdd(-inputs.lookback_minutes, 'MINUTES') | date(\"yyyy-MM-dd'T'HH:mm:ss'Z'\", timeZone='UTC') }}",
          "end": "{{ now() | date(\"yyyy-MM-dd'T'HH:mm:ss'Z'\", timeZone='UTC') }}",
          "actions": ["block", "challenge", "managed_challenge", "js_challenge"]
        }
      }

  - id: evaluate_waf_block_rate_and_anomalies
    type: io.kestra.plugin.scripts.python.Script
    description: "Evaluates Cloudflare WAF block rate trends against historical 1-hour rolling baseline, detects sudden rate spikes (> 500%), and isolates top offending rule IDs, client IP ASNs, and attacked URI paths."
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.12-slim
    beforeCommands:
      - pip install kestra
    inputFiles:
      waf_response.json: "{{ outputs.query_cloudflare_waf_analytics.body | toJson }}"
      previous_telemetry.json: "{{ outputs.get_previous_waf_telemetry.value ?? '{}' }}"
    env:
      ZONE_ID: "{{ inputs.zone_id }}"
      SPIKE_THRESHOLD_PCT: "{{ inputs.spike_threshold_pct }}"
      MIN_BLOCK_COUNT_FOR_SPIKE: "{{ inputs.min_block_count_for_spike }}"
      HTTP_STATUS_CODE: "{{ outputs.query_cloudflare_waf_analytics.code ?? 0 }}"
    script: |
      import json
      import os
      import sys
      from collections import Counter, defaultdict
      from datetime import datetime, timezone
      from kestra import Kestra

      zone_id = os.environ.get("ZONE_ID", "")
      spike_threshold_pct = float(os.environ.get("SPIKE_THRESHOLD_PCT", 500.0))
      min_block_count = int(os.environ.get("MIN_BLOCK_COUNT_FOR_SPIKE", 50))
      http_status_code = int(os.environ.get("HTTP_STATUS_CODE", 0))

      # 1. Load WAF Response and Historical KV Telemetry
      waf_data = {}
      try:
          if os.path.exists("waf_response.json"):
              with open("waf_response.json", "r", encoding="utf-8") as f:
                  raw_content = f.read().strip()
                  if raw_content and raw_content != "null":
                      parsed = json.loads(raw_content)
                      waf_data = json.loads(parsed) if isinstance(parsed, str) else parsed
      except Exception as e:
          print(f"Notice: Failed to load waf_response.json: {e}", file=sys.stderr)

      prev_telemetry = {}
      try:
          if os.path.exists("previous_telemetry.json"):
              with open("previous_telemetry.json", "r", encoding="utf-8") as f:
                  raw_prev = f.read().strip()
                  if raw_prev and raw_prev != "null":
                      parsed_prev = json.loads(raw_prev)
                      prev_telemetry = json.loads(parsed_prev) if isinstance(parsed_prev, str) else parsed_prev
      except Exception as e:
          print(f"Notice: Failed to load previous_telemetry.json: {e}", file=sys.stderr)

      # 2. Extract Data Nodes
      zones = waf_data.get("data", {}).get("viewer", {}).get("zones", []) if isinstance(waf_data, dict) else []
      zone_payload = zones[0] if zones else {}
      time_groups = zone_payload.get("firewallEventsAdaptiveByTimeGroups", []) or []
      raw_events = zone_payload.get("firewallEventsAdaptive", []) or []

      total_mitigated = 0
      current_interval_blocks = 0
      baseline_avg_blocks = 0.0
      baseline_total_blocks = 0
      spike_pct = 0.0
      spike_detected = False

      action_counts = {
          "block": 0,
          "challenge": 0,
          "managed_challenge": 0,
          "js_challenge": 0
      }

      rule_counts = Counter()
      rule_action_map = defaultdict(Counter)
      asn_counts = Counter()
      asn_desc_map = {}
      path_counts = Counter()
      ip_counts = Counter()
      ip_country_map = {}

      # 3. Process Time Groups
      buckets = defaultdict(lambda: {"total": 0, "actions": Counter()})
      for tg in time_groups:
          dt = tg.get("dimensions", {}).get("datetimeFiveMinutes")
          action = tg.get("dimensions", {}).get("action", "unknown").lower()
          cnt = tg.get("count", 0)
          if dt:
              buckets[dt]["total"] += cnt
              buckets[dt]["actions"][action] += cnt
              if action in action_counts:
                  action_counts[action] += cnt
              total_mitigated += cnt

      sorted_intervals = sorted(buckets.keys(), reverse=True)

      if sorted_intervals:
          current_interval_key = sorted_intervals[0]
          current_interval_blocks = buckets[current_interval_key]["total"]

          baseline_intervals = sorted_intervals[1:13]
          if baseline_intervals:
              baseline_total_blocks = sum(buckets[k]["total"] for k in baseline_intervals)
              baseline_avg_blocks = round(baseline_total_blocks / len(baseline_intervals), 2)
          else:
              prev_baseline = prev_telemetry.get("baseline_interval_avg", 0.0) if isinstance(prev_telemetry, dict) else 0.0
              if prev_baseline > 0:
                  baseline_avg_blocks = float(prev_baseline)
              else:
                  baseline_avg_blocks = round(float(current_interval_blocks), 2)

          if baseline_avg_blocks > 0:
              spike_pct = round(((current_interval_blocks - baseline_avg_blocks) / baseline_avg_blocks) * 100.0, 2)
          elif current_interval_blocks >= min_block_count:
              spike_pct = 999.0
          else:
              spike_pct = 0.0
      else:
          current_interval_blocks = len(raw_events)
          total_mitigated = current_interval_blocks
          for ev in raw_events:
              act = ev.get("action", "unknown").lower()
              if act in action_counts:
                  action_counts[act] += 1
          prev_baseline = prev_telemetry.get("baseline_interval_avg", 0.0) if isinstance(prev_telemetry, dict) else 0.0
          if prev_baseline > 0:
              baseline_avg_blocks = float(prev_baseline)
              spike_pct = round(((current_interval_blocks - baseline_avg_blocks) / baseline_avg_blocks) * 100.0, 2)
          elif current_interval_blocks >= min_block_count:
              spike_pct = 999.0

      # 4. Process Raw Events for Dimensions
      for ev in raw_events:
          rule_id = ev.get("ruleId") or "custom_waf_rule"
          action = ev.get("action", "unknown").lower()
          rule_counts[rule_id] += 1
          rule_action_map[rule_id][action] += 1

          asn = str(ev.get("clientAsn") or "Unknown")
          asn_desc = ev.get("clientASNDescription") or "Unknown Network"
          asn_counts[asn] += 1
          asn_desc_map[asn] = asn_desc

          path = ev.get("clientRequestPath") or "/"
          path_counts[path] += 1

          ip = ev.get("clientIP") or "0.0.0.0"
          country = ev.get("clientCountryName") or "Unknown"
          ip_counts[ip] += 1
          ip_country_map[ip] = country

      top_rules = [{"rule_id": r, "count": c} for r, c in rule_counts.most_common(5)]
      top_asns = [{"asn": a, "description": asn_desc_map.get(a, "Unknown"), "count": c} for a, c in asn_counts.most_common(5)]
      top_paths = [{"path": p, "count": c} for p, c in path_counts.most_common(5)]
      top_ips = [{"ip": ip, "country": ip_country_map.get(ip, "Unknown"), "count": c} for ip, c in ip_counts.most_common(5)]

      # Format strings for Slack notification
      top_rules_str = ", ".join([f"`{r['rule_id']}` ({r['count']})" for r in top_rules]) if top_rules else "No rule data"
      top_asns_str = ", ".join([f"AS{a['asn']} ({a['description']}: {a['count']})" for a in top_asns]) if top_asns else "No ASN data"
      top_paths_str = ", ".join([f"`{p['path']}` ({p['count']})" for p in top_paths]) if top_paths else "No URI path data"

      # 5. Status and Anomaly Classification
      status = "NOMINAL_HEALTHY"
      slack_color = "#2EB67D"
      root_cause_summary = "Nominal operations: Cloudflare WAF block rate is within standard baseline limits."

      if http_status_code != 200 and http_status_code != 0:
          status = "API_QUERY_WARNING"
          slack_color = "#ECB22E"
          root_cause_summary = f"Cloudflare GraphQL API returned HTTP status {http_status_code}. Telemetry evaluation operating on cached or empty metrics."
      elif spike_pct >= spike_threshold_pct and current_interval_blocks >= min_block_count:
          spike_detected = True
          status = "ANOMALOUS_BLOCK_RATE_SPIKE"
          slack_color = "#E01E5A"

          top_rule_ratio = (top_rules[0]["count"] / current_interval_blocks) if (top_rules and current_interval_blocks > 0) else 0.0
          top_asn_ratio = (top_asns[0]["count"] / current_interval_blocks) if (top_asns and current_interval_blocks > 0) else 0.0
          top_rule_id = top_rules[0]["rule_id"] if top_rules else "unknown"
          top_path_str = top_paths[0]["path"] if top_paths else "/"

          if top_rule_ratio > 0.65 and top_asn_ratio < 0.40:
              root_cause_summary = (
                  f"POTENTIAL WAF MISCONFIGURATION: Rule '{top_rule_id}' accounts for {round(top_rule_ratio*100, 1)}% of all mitigations across high ASN diversity. "
                  f"Likely blocking legitimate customer traffic on path '{top_path_str}'."
              )
          elif top_asn_ratio > 0.50:
              top_asn_id = top_asns[0]["asn"]
              top_asn_name = top_asns[0]["description"]
              root_cause_summary = (
                  f"ACTIVE BOTNET OR CREDENTIAL STUFFING ATTACK: {round(top_asn_ratio*100, 1)}% of requests originate from ASN {top_asn_id} ({top_asn_name}) "
                  f"targeting '{top_path_str}'. WAF mitigation rules successfully intercepting the flood."
              )
          else:
              root_cause_summary = (
                  f"DISTRIBUTED ATTACK FLOOD: Mitigated {current_interval_blocks} requests (+{spike_pct}% above baseline) across multiple ASNs and rule filters."
              )
      elif current_interval_blocks > 0:
          status = "NOMINAL_WITH_MITIGATIONS"
          root_cause_summary = f"WAF operational: Intercepted {current_interval_blocks} requests within normal baseline variance (Spike: {spike_pct}%)."

      telemetry_payload = {
          "zone_id": zone_id,
          "status": status,
          "spike_detected": spike_detected,
          "spike_percentage": spike_pct,
          "current_interval_blocks": current_interval_blocks,
          "baseline_interval_avg": baseline_avg_blocks,
          "baseline_1h_total": baseline_total_blocks,
          "total_mitigated": total_mitigated,
          "action_breakdown": action_counts,
          "top_rule_ids": top_rules,
          "top_asns": top_asns,
          "top_paths": top_paths,
          "top_client_ips": top_ips,
          "root_cause_summary": root_cause_summary,
          "timestamp": datetime.now(timezone.utc).isoformat()
      }

      print(f"Cloudflare WAF Sentinel Audit Complete. Status: {status}")
      print(f"Zone: {zone_id} | Current Blocks: {current_interval_blocks} | Baseline Avg: {baseline_avg_blocks} | Spike: {spike_pct}%")
      print(f"Root Cause: {root_cause_summary}")

      Kestra.outputs({
          "status": status,
          "spike_detected": spike_detected,
          "spike_percentage": spike_pct,
          "current_interval_blocks": current_interval_blocks,
          "baseline_interval_avg": baseline_avg_blocks,
          "action_blocks": action_counts["block"],
          "action_challenges": action_counts["challenge"],
          "action_managed_challenges": action_counts["managed_challenge"],
          "action_js_challenges": action_counts["js_challenge"],
          "top_rules_str": top_rules_str,
          "top_asns_str": top_asns_str,
          "top_paths_str": top_paths_str,
          "slack_color": slack_color,
          "root_cause_summary": root_cause_summary,
          "telemetry_payload": telemetry_payload
      })

  - id: record_waf_telemetry_in_kv
    type: io.kestra.plugin.core.kv.Set
    description: "Records the latest WAF security telemetry, anomaly metrics, and baseline rates in Kestra KV store for the specified zone."
    key: "cloudflare_waf_telemetry_{{ inputs.zone_id }}"
    value: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.telemetry_payload | toJson }}"
    kvType: JSON

  - id: check_waf_spike_anomaly
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether WAF block rate surge breached anomaly thresholds and triggers incident notification."
    condition: "{{ inputs.alert_on_spike and outputs.evaluate_waf_block_rate_and_anomalies.vars.spike_detected }}"
    then:
      - id: notify_slack_waf_spike
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches rich Slack security incident alert with WAF rule impact analysis and client IP ASN breakdown."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "attachments": [
              {
                "color": "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.slack_color }}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "🚨 Cloudflare WAF Security Alert: Anomaly Spike Detected",
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Execution ID:* `{{ execution.id }}`\n*Status:* *{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.status }}*\n*Assessment:* {{ outputs.evaluate_waf_block_rate_and_anomalies.vars.root_cause_summary }}"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Zone ID:*\n`{{ inputs.zone_id }}`"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Block Rate Surge:*\n`+{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.spike_percentage }}%` (Threshold: `>{{ inputs.spike_threshold_pct }}%`)"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Current Interval Blocks:*\n`{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.current_interval_blocks }}` requests"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Rolling 1h Baseline Avg:*\n`{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.baseline_interval_avg }}` requests / 5m"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Mitigated Action Counts:*\nBlock: `{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.action_blocks }}` | Challenge: `{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.action_challenges }}` | Managed: `{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.action_managed_challenges }}` | JS: `{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.action_js_challenges }}`"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Targeted URI Paths:*\n{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.top_paths_str }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Offending Rule IDs:*\n{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.top_rules_str }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Top Source ASNs:*\n{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.top_asns_str }}"
                      }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "Cloudflare WAF Block Rate Sentinel | Namespace: `{{ flow.namespace }}` | Triage: Review custom rule criteria if false positives affect legitimate users, or apply rate limiting if attack persists."
                      }
                    ]
                  }
                ]
              }
            ]
          }
    else:
      - id: log_nominal_waf_state
        type: io.kestra.plugin.core.log.Log
        description: "Logs nominal WAF state when block rates remain within normal baseline parameters."
        message: "Cloudflare WAF Sentinel NOMINAL: Zone '{{ inputs.zone_id }}' block rate is normal. Current blocks: {{ outputs.evaluate_waf_block_rate_and_anomalies.vars.current_interval_blocks }} (Baseline 5m avg: {{ outputs.evaluate_waf_block_rate_and_anomalies.vars.baseline_interval_avg }}, Spike: {{ outputs.evaluate_waf_block_rate_and_anomalies.vars.spike_percentage }}%)."

  - id: export_waf_sentinel_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Emits structured WAF sentinel summary for downstream SIEM integration or automated incident response subflows."
    format:
      zone_id: "{{ inputs.zone_id }}"
      status: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.status }}"
      spike_detected: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.spike_detected }}"
      spike_percentage: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.spike_percentage }}"
      current_interval_blocks: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.current_interval_blocks }}"
      baseline_interval_avg: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.baseline_interval_avg }}"
      action_blocks: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.action_blocks }}"
      action_challenges: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.action_challenges }}"
      action_managed_challenges: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.action_managed_challenges }}"
      action_js_challenges: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.action_js_challenges }}"
      root_cause_summary: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.root_cause_summary }}"

outputs:
  - id: status
    type: STRING
    description: "Overall security posture and anomaly classification for the zone WAF rules."
    value: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.status }}"

  - id: spike_detected
    type: BOOL
    description: "Boolean flag indicating whether block rate surge breached the configured spike threshold."
    value: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.spike_detected }}"

  - id: spike_percentage
    type: FLOAT
    description: "Calculated percentage change in block rate compared to rolling 1-hour baseline."
    value: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.spike_percentage }}"

  - id: current_interval_blocks
    type: INT
    description: "Total mitigated events during the current evaluation interval."
    value: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.current_interval_blocks }}"

  - id: baseline_interval_avg
    type: FLOAT
    description: "Rolling 1-hour baseline average mitigated events per 5-minute bucket."
    value: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.baseline_interval_avg }}"

  - id: root_cause_summary
    type: STRING
    description: "Diagnostic assessment of root cause differentiating rule misconfiguration from distributed attacks."
    value: "{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.root_cause_summary }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatches emergency alert if the Cloudflare WAF sentinel execution fails unexpectedly."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "CRITICAL: Cloudflare WAF Custom Rule Block Rate Sentinel pipeline failed for zone `{{ inputs.zone_id }}` in namespace `{{ flow.namespace }}` during execution `{{ execution.id }}`! Check Kestra execution logs."
      }

extend:
  title: Cloudflare WAF Custom Rule Block Rate & Anomaly Sentinel
  metaTitle: Cloudflare WAF Custom Rule Block Rate Sentinel | Kestra
  shortDescription: Audits Cloudflare WAF block rate trends via GraphQL Analytics, detects acute mitigation surges over rolling 1-hour baselines, extracts top client ASNs and URIs, and alerts Slack.
  metaDescription: Detect Cloudflare WAF block rate spikes over 1-hour baselines via GraphQL Analytics, track telemetry in KV, and dispatch Slack incident alerts.
  description: |
    Continuously audits Cloudflare Web Application Firewall (WAF) mitigation trends across production zones using the Cloudflare GraphQL Analytics API. The workflow analyzes time-series buckets (`firewallEventsAdaptiveByTimeGroups`) and granular security events (`firewallEventsAdaptive`), tracking mitigated actions including `block`, `challenge`, `managed_challenge`, and `js_challenge`. By contrasting the immediate evaluation window against a rolling 1-hour historical baseline, the flow flags acute surges (> 500%), distinguishes potential custom rule false positives from active DDoS or credential stuffing attacks, persists operational telemetry in Kestra KV store, and routes diagnostic incident cards to Slack.

    ## How it works
    1. **Baseline Retrieval**: Queries Kestra Key-Value store (`cloudflare_waf_telemetry_{zone_id}`) to inspect historical baseline metrics and previous telemetry states.
    2. **GraphQL Analytics Query**: Interrogates `https://api.cloudflare.com/client/v4/graphql` using `io.kestra.plugin.core.http.Request` to pull 5-minute event buckets alongside detailed mitigation records across the configured lookback window.
    3. **Spike & Anomaly Evaluation**: A sandboxed Python container aggregates 5-minute time buckets, calculates rolling 1-hour baseline averages, and computes the relative mitigation spike percentage.
    4. **Forensic Root Cause Isolation**: Extracts and ranks top offending custom rule IDs, client Autonomous System Numbers (ASNs), targeted URI endpoints, and source IP addresses. Differentiates single-rule false positive misconfigurations affecting legitimate traffic from distributed volumetric floods.
    5. **Telemetry Persistence**: Updates Kestra KV storage with structured telemetry (`cloudflare_waf_telemetry_{zone_id}`) for long-term trending.
    6. **Incident Escalation**: If the rate spike breaches configured thresholds, dispatches a rich Slack Block Kit notification detailing rule impact analysis, offending ASNs, and actionable triage recommendations.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_waf_audit Schedule / Webhook Trigger] --> B[get_previous_waf_telemetry KV Get]
        B --> C[query_cloudflare_waf_analytics HTTP Request]
        C --> D[evaluate_waf_block_rate_and_anomalies Python Script]
        D --> E[record_waf_telemetry_in_kv KV Set]
        E --> F[check_waf_spike_anomaly Flowable If]
        F -- Spike Detected --> G[notify_slack_waf_spike Slack Webhook]
        F -- Normal Baseline --> H[log_nominal_waf_state Log]
        G --> I[export_waf_sentinel_manifest Return]
        H --> I
    ```

    ## Architecture components
    - **Schedule & Webhook Triggers (`periodic_waf_audit`, `on_waf_security_webhook`)**: Enables continuous 5-minute interval audits and event-driven SIEM webhook invocations.
    - **KV Store Reader (`get_previous_waf_telemetry`)**: Fetches previous baseline averages to maintain rate consistency across workflow runs.
    - **HTTP Client (`query_cloudflare_waf_analytics`)**: Communicates with Cloudflare GraphQL Analytics API using secure token authentication.
    - **Forensic Engine (`evaluate_waf_block_rate_and_anomalies`)**: Computes rate variance and performs multi-dimensional security triage inside a Python container.
    - **KV Store Writer (`record_waf_telemetry_in_kv`)**: Stores updated security metrics under `cloudflare_waf_telemetry_{zone_id}` for stateful surveillance.
    - **Slack Alerting (`notify_slack_waf_spike`)**: Generates rich Block Kit messages for SecOps response teams.

    ## Key capabilities
    - **Adaptive Sampling Ingestion**: Leverages Cloudflare adaptive firewall event datasets to audit high-volume traffic without truncating surge patterns.
    - **Rolling Baseline Comparison**: Calculates 1-hour moving averages across 5-minute intervals to prevent alert fatigue from steady-state background scanner noise.
    - **Root Cause Disambiguation**: Cross-references top rule hit concentration with ASN diversity to immediately identify whether a new WAF rule is inadvertently dropping legitimate customer traffic or mitigating an actual distributed attack.
    - **Native KV State Tracking**: Uses Kestra's built-in KV store to ensure persistent, stateless execution without external database infrastructure.

    ## What you get
    - Real-time detection of WAF block surges exceeding 500% over standard operating baselines.
    - Automated classification separating custom rule misconfigurations from active credential stuffing and Layer 7 botnets.
    - Forensic breakdown of offending rule IDs, client ASNs, attacking IPs, and targeted paths.
    - State tracking in Kestra KV store under `cloudflare_waf_telemetry_{zone_id}`.
    - Rich Slack notifications with direct triage indicators.

    ## Who it's for
    - Security Operations (SecOps) teams overseeing cloud perimeter defenses and edge firewall policies.
    - Site Reliability Engineers (SREs) managing web application uptime and customer journey availability.
    - DevSecOps engineers verifying newly deployed WAF custom rules and rate-limiting expressions in production.

    ## Why orchestrate this with Kestra
    - **Zero-Infrastructure Orchestration**: Executes end-to-end WAF monitoring, metric parsing, state caching, and alerting without managing external time-series databases or serverless daemons.
    - **Native KV Store Integration**: Built-in Key-Value persistence enables seamless historical baseline tracking across periodic workflow executions.
    - **Robust Error Handling**: Encapsulates API rate limits, transient network partitions, and pipeline failures with native retry parameters and Slack fallback hooks.
    - **Declarative Security Automation**: Standardizes cloud perimeter audits in declarative GitOps-managed YAML workflows.

    ## Use cases
    - **Post-Deployment WAF Rule Validation**: Audit newly published custom firewall expressions to catch over-blocking and false positives before customer checkout workflows fail.
    - **DDoS & Credential Stuffing Early Warning**: Detect volumetric attack floods on login, signup, and API endpoints the moment edge mitigation rates spike.
    - **Edge Security Telemetry Ingestion**: Export continuous WAF mitigation metrics into upstream SIEM and observability dashboards.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `zone_id` | `STRING` | `023e105f4ecef8ad9ca31a8372d0c353` | Hexadecimal 32-character identifier of the Cloudflare zone. |
    | `spike_threshold_pct` | `FLOAT` | `500.0` | Percentage surge over 1-hour baseline required to flag an anomaly. |
    | `lookback_minutes` | `INT` | `75` | Minutes queried from GraphQL API for baseline and current metrics. |
    | `min_block_count_for_spike` | `INT` | `50` | Minimum mitigated requests needed before triggering an alert. |
    | `alert_on_spike` | `BOOL` | `True` | Dispatches Slack alerts when anomalies are confirmed. |

    ## Expected outputs
    - `{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.status }}`: Operational classification (`NOMINAL_HEALTHY`, `NOMINAL_WITH_MITIGATIONS`, `ANOMALOUS_BLOCK_RATE_SPIKE`).
    - `{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.spike_detected }}`: Boolean flag indicating confirmed block rate anomaly.
    - `{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.spike_percentage }}`: Percentage surge relative to baseline average.
    - `{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.current_interval_blocks }}`: Total mitigated requests in current 5-minute interval.
    - `{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.baseline_interval_avg }}`: Rolling 1-hour average mitigated requests per interval.
    - `{{ outputs.evaluate_waf_block_rate_and_anomalies.vars.root_cause_summary }}`: Forensic assessment differentiating misconfigurations from volumetric attacks.

    ## Prerequisites
    - Cloudflare account with active zone on Pro, Business, or Enterprise tier supporting GraphQL Firewall Events Analytics.
    - Cloudflare API Token with `Zone.Analytics:Read` and `Zone.Zone:Read` permissions.
    - Slack Incoming Webhook URL configured for incident escalation.

    ### Secrets
    - `CLOUDFLARE_API_TOKEN`: Cloudflare API token used to query the GraphQL Analytics endpoint.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for security incident notifications.
    - `CLOUDFLARE_WAF_WEBHOOK_KEY`: Authentication key for inbound webhook triggers.

    ## Quick start
    1. Store your Cloudflare API token in Kestra secrets under `CLOUDFLARE_API_TOKEN`.
    2. Store your Slack Incoming Webhook URL under `SLACK_WEBHOOK_URL`.
    3. Import this blueprint into your Kestra instance in namespace `company.security`.
    4. Run a manual execution with your Cloudflare Zone ID to baseline current traffic and establish initial KV records.
    5. Enable the `periodic_waf_audit` schedule trigger to run automated surveillance every 5 minutes.

    ## Common pitfalls and troubleshooting
    - **Adaptive Sampling Estimates**: High-volume DDoS floods utilize Cloudflare adaptive sampling; counts represent statistically accurate aggregations rather than raw request counts.
    - **API Token Scope**: Ensure the API token has `Analytics:Read` permissions at the zone level; account-scoped tokens without zone assignment will return HTTP 403 Forbidden.
    - **Low Baseline False Positives**: On newly created domains with near-zero traffic, a sudden jump from 0 to 10 blocks represents an infinite mathematical percentage spike. Use `min_block_count_for_spike` (default: 50) to prevent alerts on non-threatening bursts.

    ## How to extend
    - **Automated Rule Disabling**: Integrate an `io.kestra.plugin.cloudflare.waf` or HTTP PUT task to automatically toggle a misconfigured custom rule to `log` mode if false positive criteria are met.
    - **PagerDuty Escalation**: Add `io.kestra.plugin.pagerduty.IncidentCreate` to page the on-call SecOps engineer for critical severity attacks.
    - **IP Reputation Enrichment**: Connect an AbuseIPDB or VirusTotal lookup task to enrich top attacking ASNs and client IPs before dispatching Slack notifications.

