id: dependabot-pr-triage-slack
namespace: company.team
description: |
  Triage Dependabot pull requests as they open. Read Dependabot's own commit
  metadata to find semver-major updates, check whether the PR touches GitHub
  Actions workflow files, and alert Slack only when a human should look.

inputs:
  - id: post_pr_comment
    type: BOOL
    displayName: Post a triage comment on the PR
    description: When true, flagged PRs also get one self-updating triage comment. Keep false until the token has write access.
    defaults: false

  - id: flag_workflow_changes
    type: BOOL
    displayName: Flag workflow file changes
    description: When true, any change under .github/workflows/ (github-actions ecosystem) needs review, even for minor bumps.
    defaults: true

variables:
  pr_author: "{{ trigger.body.pull_request.user.login ?? 'none' }}"
  pr_action: "{{ trigger.body.action ?? 'none' }}"

triggers:
  - id: github_pull_request
    type: io.kestra.plugin.core.trigger.Webhook
    description: >
      GitHub webhook (content type application/json, event "Pull requests") pointed at
      /api/v1/main/executions/webhook/company.team/dependabot-pr-triage-slack/<key>.
      Replace the key with a long random value before use.
    key: replace-with-a-long-random-key

tasks:
  - id: log_event
    type: io.kestra.plugin.core.log.Log
    description: Record which event arrived. Pings and non-PR events log `none` instead of failing.
    message: >
      action={{ render(vars.pr_action) }} author={{ render(vars.pr_author) }}
      repo={{ trigger.body.repository.full_name ?? 'none' }}
      pr=#{{ trigger.body.pull_request.number ?? 'none' }} {{ trigger.body.pull_request.title ?? '' }}

  - id: is_dependabot_pr
    type: io.kestra.plugin.core.flow.If
    description: Only Dependabot PRs that were opened, reopened or got a new push (rebase or recreate) are triaged.
    condition: "{{ render(vars.pr_author) == 'dependabot[bot]' and (['opened', 'reopened', 'synchronize'] contains render(vars.pr_action)) }}"
    then:
      - id: list_commits
        type: io.kestra.plugin.core.http.Request
        description: >
          Dependabot writes an `updated-dependencies` YAML block into every commit message,
          with `update-type: version-update:semver-major|minor|patch` per dependency.
          This is the same metadata dependabot/fetch-metadata reads.
        uri: "{{ trigger.body.pull_request.url }}/commits?per_page=100"
        method: GET
        headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
          User-Agent: kestra-dependabot-triage
          Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"

      - id: list_files
        type: io.kestra.plugin.core.http.Request
        description: List the files the PR changes (first 100), to spot GitHub Actions workflow edits.
        uri: "{{ trigger.body.pull_request.url }}/files?per_page=100"
        method: GET
        headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
          User-Agent: kestra-dependabot-triage
          Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"

      - id: classify
        type: io.kestra.plugin.core.output.OutputValues
        description: Turn the two API responses into a verdict with jq. No script container needed.
        values:
          dependencies: >-
            {{ outputs.list_commits.body | jq('[.[].commit.message | split("\n") | .[] | select(startswith("- dependency-name: ")) | ltrimstr("- dependency-name: ")] | unique | join(", ")') | first }}
          major: >-
            {{ outputs.list_commits.body | jq('[.[].commit.message | contains("update-type: version-update:semver-major")] | any') | first }}
          workflow_files: >-
            {{ outputs.list_files.body | jq('[.[].filename | select(startswith(".github/workflows/"))] | join(", ")') | first }}
          files_changed: >-
            {{ outputs.list_files.body | jq('length') | first }}
          needs_review: >-
            {{ (outputs.list_commits.body | jq('[.[].commit.message | contains("update-type: version-update:semver-major")] | any') | first) or (inputs.flag_workflow_changes and (outputs.list_files.body | jq('[.[].filename | select(startswith(".github/workflows/"))] | length') | first) > 0) }}

      - id: needs_review
        type: io.kestra.plugin.core.flow.If
        description: Alert only for semver-major updates or workflow file changes. Everything else stays quiet.
        condition: "{{ outputs.classify.values.needs_review }}"
        then:
          - id: notify_slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: One Slack message per flagged PR with the reasons and a link.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: |
              :rotating_light: *Dependabot PR needs review* in `{{ trigger.body.repository.full_name }}`
              <{{ trigger.body.pull_request.html_url }}|#{{ trigger.body.pull_request.number }} {{ trigger.body.pull_request.title }}>
              *Dependencies:* {{ outputs.classify.values.dependencies is empty ? 'n/a' : outputs.classify.values.dependencies }}
              *Semver-major:* {{ outputs.classify.values.major }}
              *Workflow files:* {{ outputs.classify.values.workflow_files is empty ? 'none' : outputs.classify.values.workflow_files }}
              *Files changed:* {{ outputs.classify.values.files_changed }}

          - id: maybe_comment
            type: io.kestra.plugin.core.flow.If
            description: Posting on the PR is opt-in through the `post_pr_comment` input.
            condition: "{{ inputs.post_pr_comment }}"
            then:
              - id: comment_on_pr
                type: io.kestra.plugin.github.issues.Comment
                description: The update tag keeps one triage comment per PR, edited in place when Dependabot rebases.
                oauthToken: "{{ secret('GITHUB_TOKEN') }}"
                repository: "{{ trigger.body.repository.full_name }}"
                issueNumber: "{{ trigger.body.pull_request.number }}"
                updateTag: kestra-dependabot-triage
                body: |
                  ### Dependabot triage: needs a human review
                  | Check | Result |
                  |---|---|
                  | Dependencies | {{ outputs.classify.values.dependencies is empty ? 'n/a' : outputs.classify.values.dependencies }} |
                  | Semver-major update | {{ outputs.classify.values.major ? ':warning: yes' : 'no' }} |
                  | Workflow files changed | {{ outputs.classify.values.workflow_files is empty ? 'none' : outputs.classify.values.workflow_files }} |
                  | Files changed | {{ outputs.classify.values.files_changed }} |

                  Check the changelog for breaking changes before merging.

                  <sub>Kestra flow `{{ flow.namespace }}.{{ flow.id }}`, execution {{ execution.id }}.</sub>
        else:
          - id: log_routine_update
            type: io.kestra.plugin.core.log.Log
            description: Minor and patch updates are only logged, so Slack stays quiet.
            message: "Routine update ({{ outputs.classify.values.dependencies }}), {{ outputs.classify.values.files_changed }} file(s). No alert."
    else:
      - id: log_ignored
        type: io.kestra.plugin.core.log.Log
        description: Human PRs, closed or labeled events, and webhook pings end here.
        message: "Not a Dependabot PR event (author={{ render(vars.pr_author) }}, action={{ render(vars.pr_action) }}). Skipped."

extend:
  title: Triage Dependabot pull requests and alert Slack only on risky updates
  metaTitle: Dependabot PR triage with Slack alerts for major updates | Kestra
  shortDescription: On every Dependabot pull request, read its update metadata, flag semver-major bumps and workflow file changes, and alert Slack only for those.
  metaDescription: Triage Dependabot PRs with Kestra. Flag semver-major bumps and GitHub Actions workflow changes, alert Slack, keep minor and patch updates quiet.
  description: |
    Dependabot opens a pull request for every update. Most are patch and minor bumps that CI covers. The few that need a human (a new major version, or a change to your GitHub Actions workflows) get lost among them, and a Slack ping on every PR only adds noise.

    This flow runs on every pull request event and alerts Slack only for the Dependabot PRs that need review. It does not guess from the title. Dependabot writes an `updated-dependencies` block into each commit message with `update-type: version-update:semver-major|minor|patch` for every dependency, including grouped updates. The flow reads that block, the same metadata the `dependabot/fetch-metadata` action uses.

    It needs no script container. Two REST calls and a few `jq` expressions do the work.

    ## How it works

    1. `github_pull_request` (`io.kestra.plugin.core.trigger.Webhook`) receives GitHub `pull_request` events. `log_event` records the action, author and PR. Webhook pings and other events are handled too.
    2. `is_dependabot_pr` (`io.kestra.plugin.core.flow.If`) continues only when the PR author is `dependabot[bot]` and the action is `opened`, `reopened` or `synchronize`. Anything else goes to `log_ignored`.
    3. `list_commits` and `list_files` (`io.kestra.plugin.core.http.Request`) read the PR commits and changed files from the GitHub REST API.
    4. `classify` (`io.kestra.plugin.core.output.OutputValues`) extracts the dependency names, detects any `semver-major` update and lists changed files under `.github/workflows/`.
    5. `needs_review` (`io.kestra.plugin.core.flow.If`) checks the verdict:
       - Flagged: `notify_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) posts the PR link, dependencies, the major flag and the workflow files. When `post_pr_comment` is `true`, `comment_on_pr` (`io.kestra.plugin.github.issues.Comment`) also posts a triage table on the PR. Its `updateTag` keeps a single comment that is edited in place when Dependabot rebases.
       - Not flagged: `log_routine_update` logs the update and nothing is sent.

    ## Inputs

    Webhook executions use the defaults. Change them in the flow, or with the trigger `inputs` property.

    - `post_pr_comment` (BOOL, default `false`): also post a triage comment on flagged PRs.
    - `flag_workflow_changes` (BOOL, default `true`): treat any change under `.github/workflows/` as needing review, even for a minor bump.

    ## Prerequisites

    - A GitHub repository with Dependabot version or security updates enabled.
    - A GitHub webhook on that repository (or organization): payload URL `https://<kestra-host>/api/v1/main/executions/webhook/company.team/dependabot-pr-triage-slack/<key>`, content type `application/json`, event "Pull requests".
    - A Slack incoming webhook: https://api.slack.com/messaging/webhooks

    ### Secrets

    - `GITHUB_TOKEN`: token with read access to the repository's pull requests (fine-grained: "Pull requests: Read"). With `post_pr_comment: true` it also needs "Pull requests: Read and write" (or "Issues: write").
    - `SLACK_WEBHOOK_URL`: the Slack incoming webhook URL.

    In the open-source edition, secrets are set as base64-encoded `SECRET_<NAME>` environment variables. See https://kestra.io/docs/concepts/secret

    ## Quick start

    1. Add the `GITHUB_TOKEN` and `SLACK_WEBHOOK_URL` secrets.
    2. Replace the webhook `key` with a long random value and save the flow.
    3. Add the GitHub webhook described above. GitHub sends a ping first, which ends in `log_ignored`.
    4. Wait for Dependabot to open a PR, or re-deliver a past `pull_request` event from the webhook's "Recent Deliveries" tab.
    5. A major bump or a workflow change posts to Slack. A patch bump only writes the `log_routine_update` log.

    ## Expected outputs

    - `outputs.classify.values.dependencies`: dependency names from the Dependabot metadata, for example `express`.
    - `outputs.classify.values.major`: `true` when any dependency has a semver-major update.
    - `outputs.classify.values.workflow_files`: changed files under `.github/workflows/`, comma-separated.
    - `outputs.classify.values.needs_review`: the verdict the `needs_review` branch uses.
    - `outputs.comment_on_pr.commentUrl`: link to the triage comment, when posted.

    ## Common pitfalls

    - The author check uses `pull_request.user.login`. If you use Dependabot through a GitHub App with another name, change `dependabot[bot]` in `is_dependabot_pr`.
    - `list_files` reads the first 100 files. That covers almost every Dependabot PR. Add pagination for very large grouped updates.
    - Kestra must be reachable from GitHub for the webhook. For local tests, replay a saved payload with `curl -X POST -H 'Content-Type: application/json' -d @payload.json <webhook-url>`.

    ## How to extend

    - Add a `needs-review` label with another `io.kestra.plugin.core.http.Request` call to `POST /repos/{owner}/{repo}/issues/{number}/labels`.
    - Auto-approve patch updates of dev dependencies in the `else` branch.
    - Route alerts to a different Slack channel per repository with a `Switch` on `trigger.body.repository.full_name`.

    ## Links

    - Dependabot commit metadata: https://github.com/dependabot/fetch-metadata
    - GitHub pull request webhook events: https://docs.github.com/en/webhooks/webhook-events-and-payloads#pull_request
    - GitHub REST API, pull requests: https://docs.github.com/en/rest/pulls/pulls
    - Webhook trigger: https://kestra.io/docs/workflow-components/triggers/webhook-trigger
    - GitHub plugin: https://kestra.io/plugins/plugin-github
    - Slack plugin: https://kestra.io/plugins/plugin-slack
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
