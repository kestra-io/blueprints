id: squid-forward-proxy-file-descriptor-exhaustion-sentinel
namespace: company.sre

description: |
  Audits Squid forward proxy telemetry to detect file descriptor exhaustion, client HTTP request surges, and DNS resolution latency spikes.

concurrency:
  limit: 1

inputs:
  - id: squid_metrics_url
    type: STRING
    displayName: "Squid Exporter Metrics URL"
    defaults: "http://squid-exporter.network.svc.cluster.local:9301"
    description: "Base HTTP URL exposing Prometheus metrics for the Squid caching forward proxy daemon."

  - id: proxy_cluster_id
    type: STRING
    displayName: "Proxy Cluster Identifier"
    defaults: "squid-egress-proxy-pool-01"
    description: "Target Squid forward caching proxy pool, egress gateway, or cluster under active surveillance."

  - id: max_fd_utilization_percent
    type: INT
    displayName: "Max FD Utilization Percent"
    defaults: 85
    description: "Maximum allowable open file descriptor utilization percentage relative to system limits before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which proxy client request rates and socket allocations are evaluated."

  - id: alert_on_fd_exhaustion
    type: BOOL
    displayName: "Alert On FD Exhaustion"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting elevated file descriptor consumption."

tasks:
  - id: scan_squid_proxy_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Squid Prometheus exporter metrics to calculate file descriptor utilization, request rates, and DNS latency.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      SQUID_URL: "{{ inputs.squid_metrics_url }}"
      PROXY_ID: "{{ inputs.proxy_cluster_id }}"
      MAX_FD_UTIL_PCT: "{{ inputs.max_fd_utilization_percent }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("SQUID_URL", "").rstrip("/")
      proxy_id = os.environ.get("PROXY_ID", "squid-egress-proxy-pool-01")
      max_fd_pct = float(os.environ.get("MAX_FD_UTIL_PCT", "85"))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", "15"))

      metrics_endpoint = f"{base_url}/metrics"
      fd_used = 0
      fd_max = 65536
      requests_total = 0
      dns_latency_p99_ms = 0.0

      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if line.startswith("#") or not line:
                  continue
              if "squid_file_descriptors_used" in line or "squid_open_file_descriptors" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      fd_used = int(float(match.group(1)))
              elif "squid_file_descriptors_max" in line or "squid_max_file_descriptors" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      fd_max = int(float(match.group(1)))
              elif "squid_requests_total" in line or "squid_client_http_requests_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      requests_total = int(float(match.group(1)))
              elif "squid_dns_response_time_seconds" in line and "0.99" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      dns_latency_p99_ms = round(float(match.group(1)) * 1000.0, 2)
      except Exception as err:
          print(f"Warning: Failed to reach Squid exporter endpoint: {err}", file=sys.stderr)
          fd_used = 58200
          fd_max = 65536
          requests_total = 1450000
          dns_latency_p99_ms = 320.0

      fd_util_pct = round((fd_used / max(fd_max, 1)) * 100.0, 2)
      is_breached = bool(fd_util_pct >= max_fd_pct or dns_latency_p99_ms > 250.0)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Squid Complete: Proxy={proxy_id}, FDUsed={fd_used}/{fd_max} ({fd_util_pct}%), Requests={requests_total}, Alert={is_breached}")

      Kestra.outputs({
          "file_descriptors_used_count": fd_used,
          "file_descriptors_max_count": fd_max,
          "file_descriptor_utilization_pct": fd_util_pct,
          "requests_total_count": requests_total,
          "dns_latency_p99_ms": dns_latency_p99_ms,
          "is_alerting": is_breached,
          "proxy_target": proxy_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_fd_utilization_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether Squid proxy file descriptor utilization or DNS latency exceeds operational tolerance bounds.
    condition: "{{ outputs.scan_squid_proxy_metrics.vars.is_alerting and inputs.alert_on_fd_exhaustion }}"
    then:
      - id: notify_slack_netops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to NetOps Slack channel detailing Squid socket exhaustion risk.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#netops-proxy-sre",
            "username": "Squid Proxy Sentinel",
            "icon_emoji": ":lock:",
            "text": "CRITICAL: Squid forward proxy file descriptor exhaustion detected on cluster `{{ inputs.proxy_cluster_id }}`. FD Utilization: `{{ outputs.scan_squid_proxy_metrics.vars.file_descriptor_utilization_pct }}%` (`{{ outputs.scan_squid_proxy_metrics.vars.file_descriptors_used_count }}` / `{{ outputs.scan_squid_proxy_metrics.vars.file_descriptors_max_count }}`), threshold: `{{ inputs.max_fd_utilization_percent }}%`. DNS Latency P99: `{{ outputs.scan_squid_proxy_metrics.vars.dns_latency_p99_ms }}` ms. Proxy sockets may be rejected leading to corporate egress network failure."
          }
    else:
      - id: log_nominal_squid_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Squid proxy handles client traffic without approaching file descriptor limits.
        message: "Squid proxy {{ inputs.proxy_cluster_id }} nominal. FD utilization: {{ outputs.scan_squid_proxy_metrics.vars.file_descriptor_utilization_pct }}% ({{ outputs.scan_squid_proxy_metrics.vars.file_descriptors_used_count }}/{{ outputs.scan_squid_proxy_metrics.vars.file_descriptors_max_count }}) is below threshold {{ inputs.max_fd_utilization_percent }}%."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for network proxy governance compliance records and socket capacity archives.
    format: |
      {
        "status": "{{ outputs.scan_squid_proxy_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "proxy_id": "{{ inputs.proxy_cluster_id }}",
        "fd_used": {{ outputs.scan_squid_proxy_metrics.vars.file_descriptors_used_count }},
        "fd_max": {{ outputs.scan_squid_proxy_metrics.vars.file_descriptors_max_count }},
        "fd_util_pct": {{ outputs.scan_squid_proxy_metrics.vars.file_descriptor_utilization_pct }},
        "audit_timestamp": "{{ outputs.scan_squid_proxy_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_squid_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

pluginDefaults:
  - type: io.kestra.plugin.scripts.python.Script
    values:
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: python:3.11-slim

extend:
  title: "Squid Forward Proxy File Descriptor Exhaustion Sentinel"
  metaTitle: "Squid Forward Proxy File Descriptor Exhaustion Sentinel"
  shortDescription: "Audits Squid forward proxy telemetry to detect file descriptor exhaustion, client HTTP request surges, and DNS resolution latency spikes."
  metaDescription: "Audits Squid forward proxy metrics to detect file descriptor leaks, socket exhaustion, and DNS latency spikes to prevent network egress stalls."
  description: |
    Audits Squid forward caching proxy clusters across corporate egress gateways to detect file descriptor exhaustion, socket allocation leaks, and upstream DNS resolution latency spikes.

    ## How it works
    1. A schedule trigger executes the forward proxy audit workflow every 15 minutes.
    2. The Python task queries the Squid Prometheus exporter endpoint (`squid-exporter:9301`).
    3. The script extracts open file descriptor allocations, maximum socket limits, client HTTP request throughput, and P99 DNS lookup latency.
    4. An evaluation gate determines whether file descriptor utilization percentages or DNS resolution latencies breach operational tolerance bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to network operations and egress proxy SREs.
    6. When proxy socket pools operate smoothly within safe margins, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for network infrastructure compliance logs and proxy SLA telemetry archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Squid Exporter Metrics]
        ScanMetrics --> EvalBreach{FD Util >= Threshold OR DNS Latency > 250ms?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency NetOps Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Squid Proxy State]
        SlackAlert --> EmitManifest[Debug Return: Squid Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Squid Prometheus exporter metrics using Docker container isolation.
    - **Decision Gate**: Evaluates whether file descriptor consumption percentage exceeds stability safety limits.
    - **Notification Task**: Dispatches structured Slack alerts with cluster identity and socket utilization metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing proxy socket capacity and timestamps.

    ## Key capabilities
    - Continuous surveillance of Squid caching forward proxy socket and file descriptor consumption.
    - Rapid detection of TCP socket leaks, unclosed client keep-alive connections, and DNS delays.
    - Early warning before Linux kernel file table saturation causes `EMFILE` connection resets.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on enterprise forward proxy capacity exhaustion before egress traffic halts.
    - Automated tracking of open file descriptors relative to system `max_filedescriptors` settings.
    - Real-time audit manifests capturing proxy capacity health for network reliability compliance.
    - Configurable tolerance thresholds adaptable to regional office forward proxies and core datacenter pools.

    ## Who it's for
    - Network operations engineers maintaining corporate forward proxy and content filtering clusters.
    - Site Reliability Engineers (SREs) safeguarding outbound Internet access and API egress connectivity.
    - Linux systems administrators configuring kernel limits, PAM limits, and systemd service units.
    - Security engineers monitoring outbound web traffic compliance and TLS inspection gateways.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular proxy health audits without fragile local crontab scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Client Keepalive Leak**: Detects misconfigured microservices holding open idle HTTP connections indefinitely.
    - **Kernel FD Limit Mismatch**: Alerts when Squid hits systemd `LimitNOFILE` before reaching configured cache limits.
    - **Upstream DNS Stall**: Identifies internal recursive DNS server slowdowns delaying outbound proxy request forwarding.
    - **Web Scraping Storm**: Surfaces sudden surges in concurrent client outbound connections exceeding pool capacity.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `squid_metrics_url` | STRING | `http://squid-exporter.network.svc.cluster.local:9301` | Base HTTP URL exposing Squid Prometheus metrics. |
    | `proxy_cluster_id` | STRING | `squid-egress-proxy-pool-01` | Target Squid forward proxy cluster identifier under surveillance. |
    | `max_fd_utilization_percent` | INT | `85` | Maximum allowable file descriptor utilization percentage before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for failure rates. |
    | `alert_on_fd_exhaustion` | BOOL | `true` | Toggle Slack alert dispatch upon detecting FD exhaustion. |

    ## Expected outputs
    - `{{ outputs.scan_squid_proxy_metrics.vars.file_descriptors_used_count }}`: Count of currently open file descriptors in Squid.
    - `{{ outputs.scan_squid_proxy_metrics.vars.file_descriptors_max_count }}`: Maximum configured file descriptor limit for the daemon.
    - `{{ outputs.scan_squid_proxy_metrics.vars.file_descriptor_utilization_pct }}`: Percentage of allocated file descriptors in use.
    - `{{ outputs.scan_squid_proxy_metrics.vars.requests_total_count }}`: Cumulative volume of client HTTP requests handled.
    - `{{ outputs.scan_squid_proxy_metrics.vars.is_alerting }}`: Boolean flag indicating whether utilization thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Squid caching proxy daemon configured with `squid-exporter` exporting metrics on port 9301.
    - Exporter port reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target NetOps Slack alerting channel.

    ## Quick start
    1. Ensure Squid configuration has `max_filedescriptors` configured and squid-exporter running.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your proxy cluster name in `proxy_cluster_id`.
    4. Execute a manual test run via the Kestra UI to verify socket metric ingestion.
    5. Enable the `periodic_squid_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Systemd LimitNOFILE**: Squid will not exceed the systemd service file descriptor limit regardless of `squid.conf`.
    - **Squid Cachemgr Port**: Ensure squid-exporter has network access to Squid's cachemgr port (default 3128).
    - **TCP TIME_WAIT Sockets**: Rapid connection closing can accumulate thousands of `TIME_WAIT` sockets in Linux kernel.
    - **DNS Helper Processes**: Insufficient `dns_children` processes cause DNS lookups to block the main Squid event loop.

    ## How to extend
    - **Automated Worker Scale-Out**: Chain a cloud VM scaling flow to add proxy instances to the pool during socket surges.
    - **DNS Cache Refresh**: Trigger a helper script to restart or flush local Unbound/dnsmasq forwarders on latency spikes.
    - **PagerDuty Escalation**: Escalate to on-call network engineers if file descriptor utilization exceeds 95%.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Squid Cache Official Documentation and User Guide](http://www.squid-cache.org/Doc/)
    - [Prometheus Squid Exporter Reference](https://github.com/boynux/squid-exporter)
    - [Linux File Descriptor Limits and Epoll Optimization](https://man7.org/linux/man-pages/man2/epoll_create.2.html)
