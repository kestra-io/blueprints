id: github-issue-triage-discord-digest
namespace: company.team

inputs:
  - id: repository_owner
    type: STRING
    defaults: "kestra-io"
    description: GitHub organization or account name owning the repository.

  - id: repository_name
    type: STRING
    defaults: "kestra"
    description: Name of the GitHub repository to inspect.

  - id: max_issues
    type: INT
    defaults: 15
    description: Maximum number of recently updated open issues to fetch.

tasks:
  - id: fetch_recent_issues
    type: io.kestra.plugin.core.http.Request
    description: Query the GitHub REST API for recently updated open issues.
    uri: "https://api.github.com/repos/{{ inputs.repository_owner }}/{{ inputs.repository_name }}/issues?state=open&per_page={{ inputs.max_issues }}&sort=updated&direction=desc"
    method: GET
    headers:
      Accept: "application/vnd.github+json"
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      X-GitHub-Api-Version: "2022-11-28"

  - id: process_issues_loop
    type: io.kestra.plugin.core.flow.ForEach
    description: Iterate through the fetched issues and inspect priority labels.
    values: "{{ outputs.fetch_recent_issues.body }}"
    tasks:
      - id: check_if_urgent
        type: io.kestra.plugin.core.flow.If
        description: Detect whether the issue contains bug, critical, urgent, or priority labels.
        condition: "{{ (json(taskrun.value).labels | jq('[.[].name | select(. == \"bug\" or . == \"critical\" or . == \"urgent\" or . == \"priority\")] | length') | first) > 0 }}"
        then:
          - id: alert_discord_urgent
            type: io.kestra.plugin.discord.DiscordIncomingWebhook
            description: Send an actionable embed card for the urgent issue to the team Discord channel.
            url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
            payload: |
              {
                "embeds": [
                  {
                    "title": "🚨 High-Priority Issue: {{ json(taskrun.value).title | replace('\"', '\\\"') }}",
                    "url": "{{ json(taskrun.value).html_url }}",
                    "description": "Opened by **@{{ json(taskrun.value).user.login }}**",
                    "color": 15158332,
                    "fields": [
                      {
                        "name": "Issue Number",
                        "value": "#{{ json(taskrun.value).number }}",
                        "inline": true
                      },
                      {
                        "name": "State",
                        "value": "{{ json(taskrun.value).state | upper }}",
                        "inline": true
                      }
                    ],
                    "footer": {
                      "text": "Kestra Automated Issue Triage"
                    }
                  }
                ]
              }
        else:
          - id: log_routine_issue
            type: io.kestra.plugin.core.log.Log
            description: Record standard issues in execution logs without triggering Discord alerts.
            message: "Routine issue passed: #{{ json(taskrun.value).number }} - {{ json(taskrun.value).title }}"

  - id: send_completion_log
    type: io.kestra.plugin.core.log.Log
    description: Output triage execution summary.
    message: "Triage completed for repository: {{ inputs.repository_owner }}/{{ inputs.repository_name }}."

errors:
  - id: alert_api_failure
    type: io.kestra.plugin.discord.DiscordIncomingWebhook
    description: Notify Discord if GitHub API requests fail due to rate limiting, network errors, or auth problems.
    url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
    payload: |
      {
        "content": "⚠️ **Kestra Pipeline Warning:** Failed to fetch or process GitHub issues for `{{ inputs.repository_owner }}/{{ inputs.repository_name }}`. Check token permissions and API rate limits."
      }

triggers:
  - id: weekday_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled run every weekday at 09:00 UTC (shipped disabled by default).
    cron: "0 9 * * 1-5"
    disabled: true

extend:
  title: GitHub Issue Priority Triage and Discord Digest
  metaTitle: GitHub Issue Triage and Discord Digest | Kestra Blueprint
  shortDescription: Fetch open GitHub issues, filter high-priority and critical bugs by label, and dispatch alert cards to Discord via incoming webhook.
  metaDescription: Automatically triage open GitHub issues, filter high-priority bugs, and dispatch alerts to a Discord channel.
  description: |
    Triaging active open-source or product repositories manually often leads to delayed response times for critical bugs. This blueprint automates issue triage by polling the GitHub REST API on a scheduled interval (or on-demand), filtering issues against high-priority label criteria (`bug`, `critical`, `urgent`, `priority`), and sending structured embed alert cards directly into your engineering team's Discord channel.

    Routine issues are logged in the Kestra execution audit trail without notifying chat channels, preventing alert fatigue while keeping high-severity tickets front and center.

    ## How it works

    1. **Fetch Issues (`fetch_recent_issues`)**: An HTTP request task (`io.kestra.plugin.core.http.Request`) queries GitHub's `/issues` endpoint for the target repository, sorting by recent activity.
    2. **Iterate Batch (`process_issues_loop`)**: A flowable `ForEach` task (`io.kestra.plugin.core.flow.ForEach`) loops across each returned issue.
    3. **Evaluate Severity (`check_if_urgent`)**: An `If` conditional task (`io.kestra.plugin.core.flow.If`) applies a `jq` filter against the issue labels to detect critical tags.
    4. **Dispatch Discord Embed (`alert_discord_urgent`)**: If priority labels match, `io.kestra.plugin.discord.DiscordIncomingWebhook` posts a Discord embed card containing the issue number, author, state, and direct URL.
    5. **Log Routine Items (`log_routine_issue`)**: Issues without priority labels are written to the execution log for observability without spamming the Discord channel.
    6. **Error Gate (`alert_api_failure`)**: An `errors` handler catches HTTP timeouts, rate-limit threshold breaches, or invalid tokens, alerting the on-call channel immediately.

    ## What you get

    - Automated detection of critical bugs without manual daily issue scrubbing.
    - Zero alert spam: only issues with designated priority markers trigger Discord webhook pings.
    - Clear execution lineage and audit history in the Kestra UI.
    - Global error trapping to report GitHub API exhaustion or credential invalidation.

    ## Who it is for

    - Engineering leads and maintainers monitoring high-traffic GitHub repositories.
    - DevOps and platform teams seeking chatops integration between GitHub and Discord.
    - On-call engineers who require immediate visibility into blocker bugs.

    ## Why orchestrate this with Kestra

    Building custom cron jobs or serverless scripts for triage leaves teams without centralized logging, credential masking, or retry mechanisms. Kestra turns GitHub issue triage into declarative YAML with built-in secret management, flexible schedules, observable task logs, and native support for notification webhooks.

    ## Prerequisites

    - A GitHub Personal Access Token (classic with `repo` scope or fine-grained with `Issues: Read-only` permission).
    - A Discord channel with an Incoming Webhook configured.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub personal access token used for API authentication.
    - `DISCORD_WEBHOOK_URL`: Discord incoming webhook URL (`https://discord.com/api/webhooks/...`).

    ## Quick start

    1. Configure the secrets `GITHUB_TOKEN` and `DISCORD_WEBHOOK_URL` in your Kestra namespace or instance settings.
    2. Add this flow to your Kestra instance in the desired namespace.
    3. Run the flow manually to test issue retrieval with default parameters (`kestra-io/kestra`).
    4. Adjust `inputs.repository_owner` and `inputs.repository_name` to match your target repository.
    5. Enable the `weekday_schedule` trigger to run automated triage every weekday morning at 09:00 UTC.

    ## How to extend

    - **Custom label rules**: Adjust the label array inside `check_if_urgent` to match your team's specific tags (e.g., `security`, `p0`, `severity:blocker`).
    - **Filter pull requests**: Add a check for `json(taskrun.value).pull_request == null` to exclude pull requests from issue triage.
    - **Mention roles**: Add `<@&ROLE_ID>` to the Discord payload to ping specific triage rotations when critical bugs land.

    ## Links

    - [Kestra Discord Plugin Documentation](https://kestra.io/plugins/plugin-discord)
    - [GitHub REST API Issues Documentation](https://docs.github.com/en/rest/issues/issues)
  tags:
    - Cloud
    - Core
  ee: false
  demo: false
