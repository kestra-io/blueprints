id: github-issue-triage-discord-digest
namespace: company.team

inputs:
  - id: repository_owner
    type: STRING
    defaults: "kestra-io"
    description: GitHub organization or account name owning the repository.

  - id: repository_name
    type: STRING
    defaults: "kestra"
    description: Name of the GitHub repository to inspect.

  - id: max_issues
    type: INT
    defaults: 15
    description: Maximum number of recently updated open issues to fetch.

tasks:
  - id: fetch_recent_issues
    type: io.kestra.plugin.core.http.Request
    description: Query the GitHub REST API for recently updated open issues.
    uri: "https://api.github.com/repos/{{ inputs.repository_owner }}/{{ inputs.repository_name }}/issues?state=open&per_page={{ inputs.max_issues }}&sort=updated&direction=desc"
    method: GET
    headers:
      Accept: "application/vnd.github+json"
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      X-GitHub-Api-Version: "2022-11-28"

  - id: process_issues_loop
    type: io.kestra.plugin.core.flow.Loop
    description: Iterate through fetched issues and inspect priority labels.
    values: "{{ outputs.fetch_recent_issues.body }}"
    tasks:
      - id: check_if_urgent
        type: io.kestra.plugin.core.flow.If
        description: Detect whether the issue contains bug, critical, urgent, or priority labels.
        condition: "{{ (fromJson(item.value).labels | jq('[.[].name | select(. == \"bug\" or . == \"critical\" or . == \"urgent\" or . == \"priority\")] | length') | first) > 0 }}"
        then:
          - id: alert_discord_urgent
            type: io.kestra.plugin.discord.DiscordIncomingWebhook
            description: Send an actionable embed card for the urgent issue to the team Discord channel.
            url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
            payload: |
              {
                "embeds": [
                  {
                    "title": "🚨 High-Priority Issue: {{ fromJson(item.value).title | replace('\"', '\\\"') }}",
                    "url": "{{ fromJson(item.value).html_url }}",
                    "description": "Opened by **@{{ fromJson(item.value).user.login }}**",
                    "color": 15158332,
                    "fields": [
                      {
                        "name": "Issue Number",
                        "value": "#{{ fromJson(item.value).number }}",
                        "inline": true
                      },
                      {
                        "name": "State",
                        "value": "{{ fromJson(item.value).state | upper }}",
                        "inline": true
                      }
                    ],
                    "footer": {
                      "text": "Kestra Automated Issue Triage"
                    }
                  }
                ]
              }
        else:
          - id: log_routine_issue
            type: io.kestra.plugin.core.log.Log
            description: Record standard issues in execution logs without triggering Discord alerts.
            message: "Routine issue passed: #{{ fromJson(item.value).number }} - {{ fromJson(item.value).title }}"

  - id: send_completion_log
    type: io.kestra.plugin.core.log.Log
    description: Output triage execution summary.
    message: "Triage completed for repository: {{ inputs.repository_owner }}/{{ inputs.repository_name }}."

errors:
  - id: alert_api_failure
    type: io.kestra.plugin.discord.DiscordIncomingWebhook
    description: Notify Discord if GitHub API requests fail due to rate limiting, network errors, or auth problems.
    url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
    payload: |
      {
        "content": "⚠️ **Kestra Pipeline Warning:** Failed to fetch or process GitHub issues for `{{ inputs.repository_owner }}/{{ inputs.repository_name }}`. Check token permissions and API rate limits."
      }

triggers:
  - id: weekday_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled run every weekday at 09:00 UTC (shipped disabled by default).
    cron: "0 9 * * 1-5"
    disabled: true

extend:
  title: GitHub Issue Priority Triage and Discord Digest
  metaTitle: GitHub Issue Triage and Discord Digest | Kestra Blueprint
  shortDescription: Triage GitHub issues with deterministic label filtering and send rich alert embed cards directly to Discord via incoming webhook.
  metaDescription: Triage GitHub issues by priority labels and send structured Discord embed alerts. Deterministic, zero-cost triage with no external AI dependencies.
  description: |
    Triaging active open-source or product repositories manually often leads to delayed response times for critical bugs. While AI-based summarization blueprints exist for Slack, many engineering teams run their operations in Discord and prefer deterministic, zero-cost triage that avoids third-party LLM API latency, token charges, and hallucination risks.

    This blueprint automates GitHub issue triage using native label filtering (`bug`, `critical`, `urgent`, `priority`) and delivers structured, color-coded Discord embed alert cards straight into your team's incident or engineering channel via an incoming webhook. Routine issues are logged in Kestra's execution history without pinging Discord, avoiding notification fatigue while surfacing critical bugs in real time.

    ## How it works

    1. **Fetch Issues (`fetch_recent_issues`)**: An HTTP request task (`io.kestra.plugin.core.http.Request`) queries GitHub's `/issues` REST API endpoint for the target repository, sorting by latest update timestamp.
    2. **Iterate Batch (`process_issues_loop`)**: A flowable `Loop` task (`io.kestra.plugin.core.flow.Loop`) iterates through each returned issue.
    3. **Evaluate Labels (`check_if_urgent`)**: An `If` conditional task (`io.kestra.plugin.core.flow.If`) applies a `jq` filter to `fromJson(item.value).labels` to detect priority labels (`bug`, `critical`, `urgent`, `priority`).
    4. **Dispatch Discord Embed (`alert_discord_urgent`)**: For matching priority issues, `io.kestra.plugin.discord.DiscordIncomingWebhook` formats and posts a rich Discord embed card with the issue number, author, state, and direct URL.
    5. **Log Routine Issues (`log_routine_issue`)**: Issues without priority labels are written to execution logs for traceability without triggering chat alerts.
    6. **Error Notification (`alert_api_failure`)**: An `errors` block traps HTTP timeouts, token permission errors, or GitHub rate limits, alerting the team on Discord immediately.

    ## What you get

    - **Deterministic, zero-token triage**: No external LLM dependencies, API quotas, or token bills.
    - **Discord-native cards**: Color-coded rich embed notifications with author handles, issue numbers, and quick links.
    - **Noise reduction**: High-priority issues alert Discord; routine issues remain in execution logs.
    - **Fail-safe observability**: Immediate warning in Discord if GitHub rate limits or credentials fail.

    ## Who it is for

    - Engineering and DevOps teams using Discord for chatops and operational alerts.
    - Open-source maintainers needing automated visibility into blocker bugs across busy repos.
    - Teams looking for a lightweight, zero-LLM-cost alternative to AI triage flows.

    ## Why orchestrate this with Kestra

    Ad-hoc cron scripts or serverless bots lack built-in retry mechanics, secret masking, and execution lineage. Kestra orchestrates the entire triage lifecycle in declarative YAML: scheduling sweeps, securely interpolating credentials, branching conditionally on issue labels, and posting actionable chatops alerts with complete audit history.

    ## Prerequisites

    - A GitHub Personal Access Token (classic with `repo` scope or fine-grained with `Issues: Read-only` permission).
    - A Discord channel with an Incoming Webhook configured.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub personal access token used in the Authorization header.
    - `DISCORD_WEBHOOK_URL`: Full Discord incoming webhook URL (`https://discord.com/api/webhooks/...`).

    ## Quick start

    1. Configure `GITHUB_TOKEN` and `DISCORD_WEBHOOK_URL` in your Kestra namespace or instance secrets.
    2. Import this flow into your target namespace.
    3. Execute the flow manually to test issue inspection on `kestra-io/kestra` (or configure your own repository).
    4. Verify that critical issues appear in your Discord channel as rich embed cards.
    5. Enable the `weekday_schedule` trigger for automated sweeps every weekday at 09:00 UTC.

    ## How to extend

    - **Custom label taxonomies**: Customize the `jq` filter in `check_if_urgent` to match your organization's labels (e.g., `p0`, `severity/critical`, `security`).
    - **Filter pull requests**: Add `fromJson(item.value).pull_request == null` to exclude pull requests if your repository mixes PRs and issues on the endpoint.
    - **On-call mentions**: Add role pings (`<@&ROLE_ID>`) in the Discord payload to notify specific response rotations.

    ## Links

    - [Kestra Discord Plugin Documentation](https://kestra.io/plugins/plugin-discord)
    - [GitHub REST API Issues Documentation](https://docs.github.com/en/rest/issues/issues)
  tags:
    - Cloud
    - Core
  subTags:
    - Reporting & Digests
    - Incident & Ticketing Notification
  ee: false
  demo: false
