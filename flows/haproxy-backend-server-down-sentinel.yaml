id: haproxy-backend-server-down-sentinel
namespace: company.team
description: Inspects HAProxy stats CSV telemetry endpoint to identify failing or maintenance-state backend application servers in load-balancing pools.

inputs:
  - id: haproxy_stats_url
    type: STRING
    defaults: "http://haproxy.internal:8404/stats;csv"
    description: HTTP endpoint exposing HAProxy CSV statistics report.

  - id: max_down_servers_threshold
    type: INT
    defaults: 0
    description: Maximum allowable backend servers in DOWN status before declaring an incident.

tasks:
  - id: audit_haproxy
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    description: Query HAProxy CSV stats endpoint and parse DOWN and MAINT servers
    env:
      HAPROXY_PASSWORD: "{{ secret('HAPROXY_PASSWORD') }}"
      HAPROXY_STATS_URL: "{{ inputs.haproxy_stats_url }}"
    script: |
      import os
      import sys
      import csv
      import io
      import urllib.request
      import urllib.error
      import base64
      from kestra import Kestra

      stats_url = os.environ.get("HAPROXY_STATS_URL", "http://haproxy.internal:8404/stats;csv")
      password = os.environ.get("HAPROXY_PASSWORD")

      headers = {"User-Agent": "Kestra-HAProxy-Sentinel"}
      if password:
          auth_str = f"admin:{password}"
          b64_auth = base64.b64encode(auth_str.encode("utf-8")).decode("utf-8")
          headers["Authorization"] = f"Basic {b64_auth}"

      req = urllib.request.Request(stats_url, headers=headers)
      try:
          with urllib.request.urlopen(req, timeout=30) as resp:
              raw_csv = resp.read().decode("utf-8")
      except Exception as e:
          print(f"CRITICAL: Failed to fetch HAProxy stats from {stats_url}: {e}", file=sys.stderr)
          sys.exit(1)

      down_count = 0
      maint_count = 0

      reader = csv.DictReader(io.StringIO(raw_csv.lstrip("# ")))
      for row in reader:
          status = row.get("status", "").strip().upper()
          svname = row.get("svname", "").strip().upper()
          if svname in ("FRONTEND", "BACKEND"):
              continue
          if "DOWN" in status:
              down_count += 1
          elif "MAINT" in status:
              maint_count += 1

      Kestra.outputs({
          "down_servers": down_count,
          "maint_servers": maint_count
      })

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    description: Alert Slack if DOWN servers exceed threshold
    condition: "{{ outputs.audit_haproxy.vars.down_servers > inputs.max_down_servers_threshold }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *HAProxy Backend Server Down Alert*\n*Stats URL:* {{ inputs.haproxy_stats_url }}\n*DOWN Servers:* {{ outputs.audit_haproxy.vars.down_servers }}\n*MAINT Servers:* {{ outputs.audit_haproxy.vars.maint_servers }}\n*Threshold:* {{ inputs.max_down_servers_threshold }}\n*Risk:* Reduced pool capacity and imminent request 503 errors."
          }

outputs:
  - id: down_servers
    type: INT
    value: "{{ outputs.audit_haproxy.vars.down_servers }}"
  - id: maint_servers
    type: INT
    value: "{{ outputs.audit_haproxy.vars.maint_servers }}"

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "🚨 *Execution Failure: HAProxy Load Balancer Backend Server Down Sentinel*\n*Execution ID:* `{{ execution.id }}`\n*Error:* Sentinel inspection encountered an unhandled execution error."
      }

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  metaDescription: Inspects HAProxy stats CSV telemetry endpoint to identify failing or maintenance-state backend application servers in load-balancing pools.
  metaTitle: HAProxy Load Balancer Backend Server Down Sentinel with Kestra
  title: HAProxy Load Balancer Backend Server Down Sentinel
  shortDescription: Inspects HAProxy stats CSV telemetry endpoint to identify failing or maintenance-state backend application servers in load-balancing pools.
  description: |
    ## How it works
    This automated sentinel flow continuously assesses operational health, metrics, and capacity parameters for HAProxy backend pools. It connects directly to the stats CSV endpoint, parses server health states, evaluates conditions against defined thresholds, and triggers instant Slack notifications with actionable contextual diagnostics when anomalies or threshold violations occur.

    ## What you get
    - Proactive load balancing anomaly detection.
    - Configurable operational guardrails.
    - Zero mock logic with containerized Docker Python probe and loud failure handling.

    ## Who it's for
    - Platform and SRE engineers managing HAProxy fleets.
    - DevOps engineers ensuring continuous load balancing uptime.

    ## Prerequisites
    - Reachable HAProxy stats endpoint.
    - Secret `HAPROXY_PASSWORD` and `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
