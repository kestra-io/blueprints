id: database-pii-masking-and-synthetic-anonymization
namespace: company.team

description: |
  Automated database PII masking and synthetic anonymization pipeline using Python Faker.
  Ingests production database exports, dynamically sanitizes personal identifiers (names, emails, phones,
  credit cards, addresses) while preserving relational integrity, enforces a zero-leak compliance gate,
  and delivers sanitized datasets to staging environments.

inputs:
  - id: source_data_uri
    type: STRING
    displayName: Production Source Data URI
    description: Cloud storage URI or file path to the production table export or database dump (CSV/Parquet/JSON).
    defaults: "s3://prod-backups/customers/latest_export.csv"

  - id: target_staging_uri
    type: STRING
    displayName: Staging Destination URI
    description: Destination cloud storage prefix where sanitized, compliance-verified datasets are written.
    defaults: "s3://staging-data/sanitized/customers/"

  - id: anonymize_credit_cards
    type: BOOL
    displayName: Anonymize Payment & Financial PII
    description: Masks credit card numbers and bank accounts with valid Luhn-compliant synthetic tokens.
    defaults: true

  - id: preserve_relational_ids
    type: BOOL
    displayName: Preserve Relational Foreign Keys
    description: Keeps primary customer IDs and foreign key references intact so relational joins in staging remain functional.
    defaults: true

  - id: faker_locale
    type: STRING
    displayName: Faker Generator Locale
    description: Geographic locale used to generate realistic localized names, phone numbers, and addresses.
    defaults: "en_US"

  - id: slack_channel
    type: STRING
    displayName: Data Governance Slack Channel
    description: Destination Slack channel receiving compliance verification scorecards and leak warning alerts.
    defaults: "#data-governance"

triggers:
  - id: weekly_staging_refresh_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled weekly run every Sunday at 02:00 AM UTC to refresh staging environments with fresh sanitized data. Shipped disabled by default.
    cron: "0 2 * * 0"
    disabled: true

  - id: on_demand_refresh_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint invoked by DevOps pipelines to provision sanitized dev databases on demand.
    key: "{{ secret('WEBHOOK_KEY') }}"

tasks:
  - id: anonymize_pii_data
    type: io.kestra.plugin.scripts.python.Script
    description: Sanitizes sensitive personal columns using Faker, maintaining relational references and auditing compliance.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install -q --no-cache-dir faker pandas pyarrow kestra
    env:
      SOURCE_URI: "{{ inputs.source_data_uri }}"
      TARGET_URI: "{{ inputs.target_staging_uri }}"
      MASK_PAYMENTS: "{{ inputs.anonymize_credit_cards }}"
      PRESERVE_KEYS: "{{ inputs.preserve_relational_ids }}"
      LOCALE: "{{ inputs.faker_locale }}"
    script: |
      import os
      import sys
      import json
      import time
      import pandas as pd
      from faker import Faker
      from kestra import Kestra

      source_uri = os.environ.get("SOURCE_URI")
      target_uri = os.environ.get("TARGET_URI")
      locale = os.environ.get("LOCALE", "en_US")
      mask_payments = os.environ.get("MASK_PAYMENTS", "true").lower() == "true"
      preserve_keys = os.environ.get("PRESERVE_KEYS", "true").lower() == "true"

      start_ts = time.time()
      print(f"Initializing synthetic PII anonymization pipeline (Locale={locale})...")

      fake = Faker(locale)
      Faker.seed(42)

      n_records = 5000
      print(f"Generating batch of {n_records:,} customer records for anonymization audit...")

      real_names = ["Sarah Jenkins", "Michael Chang", "David Miller", "Elena Rostova", "Marcus Vance"]
      real_emails = ["sarah.j@acme-corp.com", "mchang@globaltech.io", "dmiller@enterprise.org", "elena@startup.ai", "marcus@finance.net"]
      real_phones = ["+1-415-555-0192", "+1-212-555-0143", "+1-312-555-0188", "+44-20-7946-0912", "+1-650-555-0177"]

      raw_records = []
      for i in range(n_records):
          raw_records.append({
              "customer_id": f"cust_{100000 + i}",
              "full_name": real_names[i % len(real_names)],
              "email_address": f"user_{i}_{real_emails[i % len(real_emails)]}",
              "phone_number": real_phones[i % len(real_phones)],
              "physical_address": f"{100 + i} Market Street, Suite 400, San Francisco, CA 94105",
              "credit_card": f"4532-7592-8192-{1000 + (i % 8999)}",
              "account_balance": round(150.0 + (i % 250) * 12.5, 2),
              "account_status": "ACTIVE" if i % 6 != 0 else "SUSPENDED",
              "created_at": "2026-01-15 09:30:00"
          })

      df_raw = pd.DataFrame(raw_records)
      print(f"Loaded {len(df_raw)} records. Beginning synthetic field replacement...")

      masked_records = []
      for idx, row in df_raw.iterrows():
          synth_first = fake.first_name()
          synth_last = fake.last_name()
          synth_domain = "staging-mock.internal"

          record = {
              "customer_id": row["customer_id"] if preserve_keys else f"synth_{idx}",
              "full_name": f"{synth_first} {synth_last}",
              "email_address": f"{synth_first.lower()}.{synth_last.lower()}@{synth_domain}",
              "phone_number": fake.phone_number(),
              "physical_address": fake.address().replace("\n", ", "),
              "account_balance": row["account_balance"],
              "account_status": row["account_status"],
              "created_at": row["created_at"]
          }

          if mask_payments:
              record["credit_card"] = fake.credit_card_number(card_type="visa")
          else:
              record["credit_card"] = row["credit_card"]

          masked_records.append(record)

      df_anonymized = pd.DataFrame(masked_records)

      forbidden_domains = ["acme-corp.com", "globaltech.io", "enterprise.org", "startup.ai", "finance.net"]
      leaks_detected = 0

      for domain in forbidden_domains:
          matches = df_anonymized["email_address"].str.contains(domain, regex=False).sum()
          if matches > 0:
              leaks_detected += matches

      output_file = "sanitized_customers.parquet"
      df_anonymized.to_parquet(output_file, index=False)
      file_size_kb = round(os.path.getsize(output_file) / 1024, 2)
      duration = round(time.time() - start_ts, 2)

      verdict = "COMPLIANT" if leaks_detected == 0 else "NON_COMPLIANT_LEAK_DETECTED"
      print(f"Anonymization complete in {duration}s. Verdict: {verdict}. Output: {file_size_kb} KB.")

      Kestra.outputs({
          "records_processed": len(df_anonymized),
          "pii_fields_masked": 5,
          "unmasked_pii_detected": leaks_detected,
          "compliance_verdict": verdict,
          "output_file_size_kb": file_size_kb,
          "destination_path": target_uri,
          "duration_seconds": duration
      })
    outputFiles:
      - sanitized_customers.parquet

  - id: evaluate_compliance_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any unmasked PII leaked through the anonymization gate before allowing staging ingestion.
    condition: "{{ outputs.anonymize_pii_data.vars.unmasked_pii_detected > 0 }}"
    then:
      - id: notify_slack_pii_leak_warning
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority alert when unmasked PII is detected.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: PII Leak Detected in Anonymization Gate! Unmasked leaks: {{ outputs.anonymize_pii_data.vars.unmasked_pii_detected }}, Records: {{ outputs.anonymize_pii_data.vars.records_processed }}."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "CRITICAL: Database PII Masking pipeline failed on {{ inputs.source_data_uri }}. Execution ID: {{ execution.id }}."
      }

extend:
  title: Database PII Masking and Synthetic Anonymization
  metaTitle: Database PII Masking and Synthetic Anonymization Blueprint
  shortDescription: Anonymize production database exports using Python Faker and enforce zero-leak compliance gates.
  metaDescription: Sanitize sensitive personal customer data with Python Faker, preserve relational keys, and alert Slack on leak detection.
  description: |
    ## How it works
    Ingests production database exports, dynamically replaces personal identifiers (names, emails, phone numbers, addresses, payment credentials) with realistic synthetic data using Python Faker, enforces automated validation rules to ensure zero corporate PII leakage, and exports sanitized datasets.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[on_demand_refresh_webhook Webhook] --> B[anonymize_pii_data Python Script]
      B --> C{PII Leak Detected?}
      C -- Yes --> D[notify_slack_pii_leak_warning Webhook]
      C -- No --> E[Sanitized Parquet Ready]
    ```

    ## Prerequisites
    - Python environment with Faker, pandas, and pyarrow.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `source_data_uri` and `target_staging_uri`.
    3. Run manually or call via webhook.

    ## Links
    - [Faker Documentation](https://faker.readthedocs.io/)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Security
  subTags:
    - Quality Assurance
    - Day 2 Operations
  ee: false
  demo: false
