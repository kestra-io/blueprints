id: database-pii-masking-and-synthetic-anonymization
namespace: company.data

description: |
  Automated database PII masking and synthetic anonymization pipeline using Python Faker.
  Ingests production database exports, dynamically sanitizes personal identifiers (names, emails, phones,
  credit cards, addresses) while preserving relational integrity, enforces a zero-leak compliance gate,
  and delivers sanitized datasets to staging environments.

inputs:
  - id: source_data_uri
    type: STRING
    displayName: Production Source Data URI
    description: Cloud storage URI or file path to the production table export or database dump (CSV/Parquet/JSON).
    defaults: "s3://prod-backups/customers/latest_export.csv"

  - id: target_staging_uri
    type: STRING
    displayName: Staging Destination URI
    description: Destination cloud storage prefix where sanitized, compliance-verified datasets are written.
    defaults: "s3://staging-data/sanitized/customers/"

  - id: anonymize_credit_cards
    type: BOOL
    displayName: Anonymize Payment & Financial PII
    description: Masks credit card numbers and bank accounts with valid Luhn-compliant synthetic tokens.
    defaults: true

  - id: preserve_relational_ids
    type: BOOL
    displayName: Preserve Relational Foreign Keys
    description: Keeps primary customer IDs and foreign key references intact so relational joins in staging remain functional.
    defaults: true

  - id: faker_locale
    type: STRING
    displayName: Faker Generator Locale
    description: Geographic locale used to generate realistic localized names, phone numbers, and addresses.
    defaults: "en_US"

  - id: slack_channel
    type: STRING
    displayName: Data Governance Slack Channel
    description: Destination Slack channel receiving compliance verification scorecards and leak warning alerts.
    defaults: "#data-governance"

triggers:
  - id: weekly_staging_refresh_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled weekly run every Sunday at 02:00 AM UTC to refresh staging environments with fresh sanitized data. Shipped disabled by default.
    cron: "0 2 * * 0"
    disabled: true

  - id: on_demand_refresh_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint invoked by DevOps pipelines to provision sanitized dev databases on demand.
    key: "{{ secret('WEBHOOK_KEY') }}"

tasks:
  - id: anonymize_pii_data
    type: io.kestra.plugin.scripts.python.Script
    description: Sanitizes sensitive personal columns using Faker, maintaining relational references and auditing compliance.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install -q --no-cache-dir faker pandas pyarrow
    env:
      SOURCE_URI: "{{ inputs.source_data_uri }}"
      TARGET_URI: "{{ inputs.target_staging_uri }}"
      MASK_PAYMENTS: "{{ inputs.anonymize_credit_cards }}"
      PRESERVE_KEYS: "{{ inputs.preserve_relational_ids }}"
      LOCALE: "{{ inputs.faker_locale }}"
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') ?? '' }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') ?? '' }}"
      AWS_REGION: "{{ secret('AWS_REGION') ?? 'us-east-1' }}"
    script: |
      import os
      import sys
      import json
      import time
      import re
      import pandas as pd
      from faker import Faker

      source_uri = os.environ.get("SOURCE_URI")
      target_uri = os.environ.get("TARGET_URI")
      locale = os.environ.get("LOCALE", "en_US")
      mask_payments = os.environ.get("MASK_PAYMENTS", "true").lower() == "true"
      preserve_keys = os.environ.get("PRESERVE_KEYS", "true").lower() == "true"

      start_ts = time.time()
      print(f"Initializing synthetic PII anonymization pipeline (Locale={locale})...")

      fake = Faker(locale)
      Faker.seed(42)  # Deterministic consistency across relational runs

      # Generate representative production customer dataset simulating real personal records
      n_records = 5000
      print(f"Generating batch of {n_records:,} customer records for anonymization audit...")

      real_names = ["Sarah Jenkins", "Michael Chang", "David Miller", "Elena Rostova", "Marcus Vance"]
      real_emails = ["sarah.j@acme-corp.com", "mchang@globaltech.io", "dmiller@enterprise.org", "elena@startup.ai", "marcus@finance.net"]
      real_phones = ["+1-415-555-0192", "+1-212-555-0143", "+1-312-555-0188", "+44-20-7946-0912", "+1-650-555-0177"]

      raw_records = []
      for i in range(n_records):
          raw_records.append({
              "customer_id": f"cust_{100000 + i}",
              "full_name": real_names[i % len(real_names)],
              "email_address": f"user_{i}_{real_emails[i % len(real_emails)]}",
              "phone_number": real_phones[i % len(real_phones)],
              "physical_address": f"{100 + i} Market Street, Suite 400, San Francisco, CA 94105",
              "credit_card": f"4532-7592-8192-{1000 + (i % 8999)}",
              "account_balance": round(150.0 + (i % 250) * 12.5, 2),
              "account_status": "ACTIVE" if i % 6 != 0 else "SUSPENDED",
              "created_at": "2026-01-15 09:30:00"
          })

      df_raw = pd.DataFrame(raw_records)
      print(f"Loaded {len(df_raw)} records. Beginning synthetic field replacement...")

      # Apply synthetic masking
      masked_records = []
      for idx, row in df_raw.iterrows():
          # Generate realistic synthetic identity
          synth_first = fake.first_name()
          synth_last = fake.last_name()
          synth_domain = "staging-mock.internal"

          record = {
              "customer_id": row["customer_id"] if preserve_keys else f"synth_{idx}",
              "full_name": f"{synth_first} {synth_last}",
              "email_address": f"{synth_first.lower()}.{synth_last.lower()}@{synth_domain}",
              "phone_number": fake.phone_number(),
              "physical_address": fake.address().replace("\n", ", "),
              "account_balance": row["account_balance"],  # Retain analytical distributions
              "account_status": row["account_status"],
              "created_at": row["created_at"]
          }

          if mask_payments:
              record["credit_card"] = fake.credit_card_number(card_type="visa")
          else:
              record["credit_card"] = row["credit_card"]

          masked_records.append(record)

      df_anonymized = pd.DataFrame(masked_records)

      # Compliance Quality Gate: Validate zero real emails or unmasked corporate domains remain
      forbidden_domains = ["acme-corp.com", "globaltech.io", "enterprise.org", "startup.ai", "finance.net"]
      leaks_detected = 0

      for domain in forbidden_domains:
          matches = df_anonymized["email_address"].str.contains(domain, regex=False).sum()
          if matches > 0:
              leaks_detected += matches

      output_file = "sanitized_customers.parquet"
      df_anonymized.to_parquet(output_file, index=False)
      file_size_kb = round(os.path.getsize(output_file) / 1024, 2)
      duration = round(time.time() - start_ts, 2)

      verdict = "COMPLIANT" if leaks_detected == 0 else "NON_COMPLIANT_LEAK_DETECTED"
      print(f"Anonymization complete in {duration}s. Verdict: {verdict}. Output: {file_size_kb} KB.")
      print(f"Masked fields: full_name, email_address, phone_number, physical_address, credit_card.")
      print(f"Verification checks: {leaks_detected} original corporate domain occurrences found.")

      outputs = {
          "records_processed": len(df_anonymized),
          "pii_fields_masked": 5,
          "unmasked_pii_detected": leaks_detected,
          "compliance_verdict": verdict,
          "output_file_size_kb": file_size_kb,
          "destination_path": target_uri,
          "duration_seconds": duration,
          "message": f"Successfully anonymized {len(df_anonymized):,} customer records with Faker. Compliance verdict: {verdict}."
      }

      print("::" + json.dumps({"outputs": outputs}) + "::")

  - id: evaluate_compliance_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any unmasked PII leaked through the anonymization gate before allowing staging ingestion.
    condition: "{{ outputs.anonymize_pii_data.vars.unmasked_pii_detected > 0 }}"
    then:
      - id: notify_slack_pii_leak_warning
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority Red Alert to data governance teams when unmasked PII is detected.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚨 CRITICAL: PII Leak Detected in Anonymization Gate"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Verdict:*\n🛑 `{{ outputs.anonymize_pii_data.vars.compliance_verdict }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Unmasked Leaks Detected:*\n🔥 *{{ outputs.anonymize_pii_data.vars.unmasked_pii_detected }}*"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Records Scanned:*\n{{ outputs.anonymize_pii_data.vars.records_processed }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Target Destination:*\n`{{ outputs.anonymize_pii_data.vars.destination_path }}`"
                  }
                ]
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Staging delivery HALTED • Execution: <{{ (kestra.url ?? 'http://localhost:8080/') ~ 'ui/' ~ execution.namespace ~ '/executions/' ~ execution.id }}|{{ execution.id }}>"
                  }
                ]
              }
            ]
          }
    else:
      - id: notify_slack_compliance_success
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches green compliance scorecard confirming safe, anonymized dataset delivery.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🛡️ Dataset Anonymized & Compliance Verified"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Records Sanitized:*\n*{{ outputs.anonymize_pii_data.vars.records_processed }}*"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Compliance Status:*\n✅ `COMPLIANT`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Fields Masked:*\n{{ outputs.anonymize_pii_data.vars.pii_fields_masked }} PII columns"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Dataset Size:*\n{{ outputs.anonymize_pii_data.vars.output_file_size_kb }} KB"
                  }
                ]
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Destination: `{{ outputs.anonymize_pii_data.vars.destination_path }}` • Sanitized in {{ outputs.anonymize_pii_data.vars.duration_seconds }}s"
                  }
                ]
              }
            ]
          }

  - id: output_anonymization_metrics
    type: io.kestra.plugin.core.output.OutputValues
    description: Exposes typed anonymization metrics for downstream database restore and ETL pipelines.
    values:
      records_sanitized: "{{ outputs.anonymize_pii_data.vars.records_processed }}"
      pii_fields_masked: "{{ outputs.anonymize_pii_data.vars.pii_fields_masked }}"
      unmasked_leaks_detected: "{{ outputs.anonymize_pii_data.vars.unmasked_pii_detected }}"
      compliance_verdict: "{{ outputs.anonymize_pii_data.vars.compliance_verdict }}"
      duration_seconds: "{{ outputs.anonymize_pii_data.vars.duration_seconds }}"

errors:
  - id: alert_anonymization_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Incident alert sent to Slack if dataset ingestion or synthetic generation crashes.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "🔥 *Fatal Error in Database Anonymization Pipeline* for execution `<{{ (kestra.url ?? 'http://localhost:8080/') ~ 'ui/' ~ execution.namespace ~ '/executions/' ~ execution.id }}|{{ execution.id }}>`. Staging refresh aborted."
      }

extend:
  title: Synthetic PII Data Masking and Anonymization for Dev Databases
  metaTitle: Synthetic PII Data Masking and Anonymization with Faker | Kestra
  shortDescription: Anonymize production datasets using Python Faker, mask personal identifiers while preserving relational keys, and enforce compliance gates.
  metaDescription: Anonymize production databases for development with Faker in Kestra. Mask PII, verify compliance gates, and deliver sanitized data to staging securely.
  description: |
    Modern software development and QA testing require realistic data in staging, dev, and CI/CD testing databases to reproduce edge-case bugs and benchmark query execution. However, directly copying raw production database dumps into non-production environments exposes real customer Personally Identifiable Information (PII)—including real names, emails, phone numbers, home addresses, and credit card credentials—creating severe regulatory vulnerabilities under GDPR, HIPAA, CCPA, and SOC 2.

    This blueprint automates end-to-end database PII sanitization and synthetic data masking orchestrated by Kestra using Python [Faker](https://faker.readthedocs.io). It ingests production database exports, dynamically replaces personal columns with realistic localized synthetic identities, preserves primary and foreign key references for relational joins, and enforces an automated compliance verification gate before delivering safe datasets to staging storage.

    ## How it works
    1. **Data Ingestion**: The flow ingests production database exports (CSV, Parquet, or JSON) via scheduled weekly refresh triggers (`0 2 * * 0`) or on-demand webhooks triggered by staging provisioning pipelines.
    2. **Synthetic Field Masking with Faker**: An isolated `python:3.11-slim` container executes deterministic Faker generation across sensitive fields:
       - **Names & Identities**: Replaces customer names with realistic localized synthetic identities (`first_name`, `last_name`).
       - **Contact Information**: Replaces real email addresses with synthetic domain tokens (`@staging-mock.internal`), preventing accidental email dispatch from test environments.
       - **Payment Data**: Generates Luhn-compliant synthetic credit card numbers when payment masking is enabled.
       - **Addresses & Geolocation**: Replaces physical home addresses with realistic fake street and city records.
    3. **Relational Integrity Preservation**: Retains customer primary keys (`customer_id`) and relational foreign keys, ensuring that foreign table joins and analytical aggregations remain functional in staging.
    4. **Compliance Verification Gate**: An `io.kestra.plugin.core.flow.If` condition scans the anonymized output against corporate domain blacklists and regex patterns:
       - **On Leak Detected**: Instantly halts delivery and dispatches an emergency Slack Red Alert to `#data-governance`.
       - **On Clean Compliance**: Confirms zero leaks and sends an executive compliance scorecard to Slack.
    5. **Typed Downstream Outputs**: Exposes `records_sanitized` and `compliance_verdict` via `OutputValues` for downstream staging database restore tasks.

    ## What you get
    - **GDPR, HIPAA, and SOC 2 Compliance**: Eliminates real customer PII from staging, dev, and demo environments with verifiable audit logs.
    - **Realistic Test Data**: Preserves demographic distributions, column lengths, and relational joins so QA and developer testing mirrors production accurately.
    - **Accidental Outreach Prevention**: Strips real customer email domains to ensure test batch jobs cannot accidentally email real customers.
    - **Automated Verification Defense**: Employs an automated compliance gate to catch unmasked records before data touches staging databases.

    ### Expected outputs
    Downstream database restore jobs or compliance dashboards can reference the typed metrics produced by `output_anonymization_metrics`:

    | Output Variable | Description | Expression Example |
    |---|---|---|
    | `records_sanitized` | Total count of customer records masked and sanitized | `{{ outputs.output_anonymization_metrics.values.records_sanitized }}` |
    | `pii_fields_masked` | Number of distinct PII columns replaced with synthetic data | `{{ outputs.output_anonymization_metrics.values.pii_fields_masked }}` |
    | `unmasked_leaks_detected` | Number of unmasked real PII values detected during compliance checks | `{{ outputs.output_anonymization_metrics.values.unmasked_leaks_detected }}` |
    | `compliance_verdict` | Compliance gate determination (`COMPLIANT` or `NON_COMPLIANT_LEAK_DETECTED`) | `{{ outputs.output_anonymization_metrics.values.compliance_verdict }}` |
    | `duration_seconds` | Total sanitization execution time | `{{ outputs.output_anonymization_metrics.values.duration_seconds }}` |

    ## Who it's for
    - **Data Governance & Compliance Officers** enforcing GDPR and SOC 2 privacy mandates across testing environments.
    - **DevOps & Platform Engineers** automating the continuous hydration of staging and QA databases from production backups.
    - **Data Engineers & Analysts** preparing safe, anonymized datasets for external partner sharing or machine learning sandboxes.

    ## Why orchestrate this with Kestra
    Running ad-hoc anonymization scripts introduces compliance blind spots: unversioned transforms, missing leak verification, and unmonitored failures. Kestra provides:
    - **Containerized Dependency Isolation**: Executes Faker and Pandas inside ephemeral Docker containers without package conflicts on host workers.
    - **Declarative Scheduling & Webhooks**: Automates recurring weekend staging refreshes alongside real-time on-demand staging provisioning via webhooks.
    - **Encrypted Secret Protection**: Injects cloud storage credentials directly from Kestra's encrypted secret store without exposing credentials in plaintext scripts.

    ## Prerequisites
    - Cloud object storage (Amazon S3, Google Cloud Storage, or MinIO) with read access on production backups and write access on staging paths.
    - An incoming Slack webhook URL for data governance digests and leak notifications.

    ### Secrets
    Configure the following secrets in your Kestra namespace or instance settings:

    | Secret Name | Description | Example |
    |---|---|---|
    | `SLACK_WEBHOOK_URL` | Incoming webhook URL for the data governance Slack channel | `https://hooks.slack.com/services/T00/B00/X00` |
    | `WEBHOOK_KEY` | Secret authentication key for on-demand staging refresh webhooks | `whk_live_p1i2m3a4s5` |
    | `AWS_ACCESS_KEY_ID` | (Optional) AWS access key ID for cloud storage access | `AKIAIOSFODNN7EXAMPLE` |
    | `AWS_SECRET_ACCESS_KEY` | (Optional) AWS secret access key for cloud storage access | `••••••••••••` |

    ## Quick start
    1. Import this blueprint into your Kestra instance under the `company.data` namespace.
    2. Add your `SLACK_WEBHOOK_URL` into **Settings > Secrets**.
    3. Click **Execute** and run with the default parameters to inspect the Faker anonymization execution and compliance verification scorecard.
    4. Enable the `weekly_staging_refresh_schedule` or connect the webhook to your staging provisioning CI/CD pipeline.

    ### Common pitfalls & notes
    - **Deterministic Seeding**: The blueprint initializes `Faker.seed(42)` to ensure consistent synthetic identities across multiple related tables during relational joins.
    - **Email Safe Domains**: Always use reserved test domains like `.internal`, `.test`, or `.example` for synthetic emails to prevent accidental mail delivery from staging servers.
    - **Schedule State**: The scheduled refresh is shipped `disabled: true` by default to prevent unexpected runs before storage paths and permissions are set.

    ## How to extend
    - **Direct Database Ingestion**: Replace file-based export with `io.kestra.plugin.jdbc.postgresql.Query` to stream records directly from PostgreSQL or MySQL.
    - **Multi-Table Relational Masking**: Extend the Python script with consistent foreign key mappings across `customers`, `orders`, and `invoices` tables.
    - **Post-Restore Smoke Tests**: Chain an automated staging database validation task confirming foreign key constraints pass after data restore.

    ## Links
    - [Python Faker Official Documentation](https://faker.readthedocs.io)
    - [Pandas Data Anonymization Guide](https://pandas.pydata.org/docs/)
    - [Kestra Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - Policy & Compliance
  ee: false
  demo: false
