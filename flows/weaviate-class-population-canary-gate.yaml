id: weaviate-class-population-canary-gate
namespace: company.team
description: |
  Run a Weaviate GraphQL Aggregate meta count query against a class and
  alert Slack when the object count drops below a minimum threshold. A
  class that silently loses objects (a bad delete, a stalled ingest
  pipeline, a wiped collection) still answers queries normally - this
  canary is the check that would otherwise only surface as "why is RAG
  returning nothing" days later.

triggers:
  - id: periodic_population_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every 30 minutes - a bad delete or a stalled ingest pipeline can drain a class well before a daily check would catch it. Shipped disabled; enable it once weaviate_url/class_name point at a real instance and a manual run has been verified.
    cron: "*/30 * * * *"
    disabled: true

inputs:
  - id: weaviate_url
    type: STRING
    displayName: "Weaviate URL"
    defaults: "http://localhost:8081"
    description: Weaviate endpoint, scheme and host with port. The count is read from its /v1/graphql REST endpoint.

  - id: anonymous
    type: BOOL
    displayName: "Anonymous Access"
    defaults: false
    description: Set true for a Weaviate instance with anonymous access. When false the request sends WEAVIATE_API_KEY as a bearer token.

  - id: class_name
    type: STRING
    displayName: "Weaviate Class Name"
    defaults: "Article"
    description: Class (collection) audited via the GraphQL Aggregate meta count query.

  - id: min_object_count
    type: INT
    displayName: "Minimum Object Count"
    defaults: 1
    description: Below this count, class_name counts as AT_RISK. Default of 1 makes this an always-populated canary; raise it to catch a partial data loss on a class that should always hold many more objects than that.

tasks:
  - id: check_class_population
    type: io.kestra.plugin.core.http.Request
    description: "Runs { Aggregate { <class_name> { meta { count } } } } against Weaviate's /v1/graphql endpoint. The Weaviate plugin's Query task (plugin-weaviate 2.0+) lists and searches objects but does not run aggregations, so the exact count comes from the REST API, as the plugin's upgrade guide recommends. The count lands at data.Aggregate.<class_name>[0].meta.count in the response body."
    uri: "{{ inputs.weaviate_url }}/v1/graphql"
    method: POST
    contentType: application/json
    headers:
      Authorization: "{{ inputs.anonymous ? '' : 'Bearer ' ~ secret('WEAVIATE_API_KEY') }}"
    body: |
      {"query": "{ Aggregate { {{ inputs.class_name }} { meta { count } } } }"}

  - id: fail_on_query_error
    type: io.kestra.plugin.core.execution.Fail
    description: Weaviate answers a GraphQL error (for example an undefined class_name) with HTTP 200 and an error list instead of a count. Fail here so that case reaches the errors block instead of reading as zero objects.
    condition: "{{ fromJson(outputs.check_class_population.body) | jq('(.errors // .error) != null') | first }}"
    errorMessage: "Aggregate query on {{ inputs.class_name }} returned an error: {{ fromJson(outputs.check_class_population.body) | jq('(.errors // .error)[0].message') | first }}"

  - id: evaluate_population
    type: io.kestra.plugin.core.flow.If
    description: AT_RISK when the Aggregate count is below min_object_count, including the all-the-way-to-zero case of a fully emptied class.
    condition: "{{ (fromJson(outputs.check_class_population.body) | jq('.data.Aggregate[] | .[0].meta.count') | first) >= inputs.min_object_count }}"
    then:
      - id: log_population_healthy
        type: io.kestra.plugin.core.log.Log
        message: "HEALTHY: {{ inputs.class_name }} has {{ (fromJson(outputs.check_class_population.body) | jq('.data.Aggregate[] | .[0].meta.count') | first) }} object(s), at or above the {{ inputs.min_object_count }} minimum."
    else:
      - id: alert_population_at_risk
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "There is no remediation task to run here by design: the Weaviate plugin exposes BatchCreate, Delete, Query, and SchemaCreate - nothing to reindex, restore, or backfill lost vector objects, so this branch only ever alerts."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Weaviate population canary: AT_RISK. {{ inputs.class_name }} has {{ (fromJson(outputs.check_class_population.body) | jq('.data.Aggregate[] | .[0].meta.count') | first) }} object(s), below the {{ inputs.min_object_count }} minimum. Execution {{ execution.id }}."
          }

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status line for every run, independent of which branch fired, so the execution history always shows the headline numbers.
    message: "Population audit complete for {{ inputs.class_name }}. count={{ (fromJson(outputs.check_class_population.body) | jq('.data.Aggregate[] | .[0].meta.count') | first) }}. minimum={{ inputs.min_object_count }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the flow itself fails outright - an unreachable Weaviate instance, a bad API key, or class_name not existing at all (the Aggregate query errors on an undefined class rather than returning a zero count, and fail_on_query_error turns that into a failure). This case is effectively UNREACHABLE and must not read as "no risk" just because evaluate_population never ran.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Weaviate population canary FAILED in execution {{ execution.id }} for class {{ inputs.class_name }}. The Aggregate query did not complete - the class may not exist, or the instance may be unreachable; investigate before trusting the last known population count."
      }

extend:
  title: "Weaviate Class Population Canary Gate"
  shortDescription: Run a Weaviate GraphQL Aggregate count against a class and alert Slack when the object count drops below a minimum threshold.
  metaTitle: Weaviate Class Population Canary Gate with Kestra
  metaDescription: "Check a Weaviate class's object count via GraphQL Aggregate and alert Slack when it drops below a minimum threshold."
  description: |
    A Weaviate class that gets accidentally emptied - a bad `Delete` call with too
    broad a filter, an ingest pipeline that silently stopped, a collection dropped and
    never rebuilt - still answers every query without error. It just returns nothing
    useful, and the first person to notice is usually whoever is on the receiving end
    of a RAG pipeline that suddenly has no grounding data. This blueprint runs
    Weaviate's own GraphQL `Aggregate` `meta { count }` query against a named class on
    a schedule and alerts Slack the moment the count drops below a minimum you set.

    ## How it works

    1. `periodic_population_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 30 minutes. Shipped disabled so you can validate a manual run first.
    2. `check_class_population` (`io.kestra.plugin.core.http.Request`) posts `{ Aggregate { class_name { meta { count } } } }` to Weaviate's `/v1/graphql` endpoint. The Weaviate plugin's `Query` task (plugin-weaviate 2.0+) searches and lists objects but does not run aggregations, so the exact count is read from the REST API, as the plugin's upgrade guide recommends. The count is at `data.Aggregate.<class_name>[0].meta.count` in the response body.
    3. `fail_on_query_error` (`io.kestra.plugin.core.execution.Fail`) fails the run when Weaviate returns a GraphQL error instead of a count, for example for an undefined `class_name`.
    4. `evaluate_population` (`io.kestra.plugin.core.flow.If`) branches on `count >= min_object_count`.
       - `then` (HEALTHY): `log_population_healthy` records a clean check.
       - `else` (AT_RISK): `alert_population_at_risk` reports the measured count against the minimum. There is deliberately no remediation action here - see Pitfalls for why.
    5. `log_audit_complete` always runs last, printing the headline numbers regardless of which branch fired.
    6. The `errors` block alerts Slack separately if the flow itself fails outright - an unreachable instance, a bad API key, or `class_name` not existing at all, since Weaviate's GraphQL layer errors on an undefined class instead of returning a zero count.

    ## What you get

    - A direct count from Weaviate's own GraphQL `Aggregate` query, not an estimate from a dashboard or a downstream symptom report.
    - A distinct failure path (the `errors` block) for a class that does not exist at all, so that case is never silently read as "zero objects, below threshold" - it is a different, more severe condition.
    - A one-number threshold (`min_object_count`) that works equally as an always-populated canary (default `1`) or a partial-data-loss detector on a class expected to hold far more.
    - A final status log every run, risk or not, so the execution history doubles as a population trend for the class.

    ## Who it's for

    - Platform and RAG infrastructure teams running Weaviate who need an early signal when a class that feeds a retrieval pipeline silently loses its data.
    - Teams who have been burned by a `Delete` call with a filter that matched more than intended and want a scheduled check that would have caught it within the hour instead of the next incident review.
    - Anyone running Weaviate who wants a worked example of reading an exact `Aggregate` count over the REST API when the plugin's `Query` task only lists and searches objects.

    ## Why orchestrate this with Kestra

    An `Aggregate` query run by hand answers one moment in time; it does not decide a cadence, compare the result against a threshold, or notify anyone. Kestra supplies the schedule, the threshold comparison as a first-class branch, and an execution history that shows exactly when a class's population dropped and by how much.

    ## Prerequisites

    - A reachable Weaviate instance with `class_name` already created and expected to be populated.
    - An API key with permission to run GraphQL queries, if the instance has authentication enabled; set `anonymous` to true otherwise.
    - A Slack incoming webhook for alerts.

    Local testing:
    `docker run -d --name weaviate-canary -p 8081:8080 -p 50052:50051 -e QUERY_DEFAULTS_LIMIT=25 -e AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true -e PERSISTENCE_DATA_PATH=/var/lib/weaviate -e DEFAULT_VECTORIZER_MODULE=none cr.weaviate.io/semitechnologies/weaviate:1.39.7`
    `docker network connect YOUR_KESTRA_NETWORK weaviate-canary` (check existing networks first with `docker network ls`; only needed if the Kestra Worker runs in a separate Docker network than this container; set `weaviate_url` to `http://weaviate-canary:8080` from inside that network, or `http://localhost:8081` from the host). Host port `8081` is used here specifically so it never collides with Kestra's own UI on `8080`. With `AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true`, set the `anonymous` input to true: an instance without an auth scheme rejects any `Authorization` header, so the request must not send `WEAVIATE_API_KEY`.

    ### Secrets

    - `WEAVIATE_API_KEY`: API key sent by `check_class_population` as a bearer token, unless `anonymous` is true.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_population_at_risk` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_WEAVIATE_API_KEY=$(echo -n '<your-local-key>' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `weaviate_url` (STRING, default `http://localhost:8081`): Weaviate instance URL.
    - `anonymous` (BOOL, default `false`): skip the API key for an instance with anonymous access.
    - `class_name` (STRING, default `Article`): class (collection) audited.
    - `min_object_count` (INT, default `1`): count floor before the class counts as AT_RISK.

    ### Outputs

    - `outputs.check_class_population.body`: the Aggregate response, with the measured object count at `data.Aggregate.<class_name>[0].meta.count`, every successful run.

    ## Quick start

    1. Start Weaviate locally with the command above and create an `Article` class with a handful of objects (via `SchemaCreate` and `BatchCreate`, or the Weaviate console).
    2. Add the `SLACK_WEBHOOK_URL` secret, plus `WEAVIATE_API_KEY` unless you run with `anonymous` set to true.
    3. Run the flow manually with the defaults and confirm `log_population_healthy` fires with the correct count.
    4. Raise `min_object_count` above the actual count and re-run to confirm `alert_population_at_risk` fires.
    5. Point `class_name` at a class that does not exist and re-run to confirm the `errors` block fires instead of either branch.
    6. Enable `periodic_population_check` once you trust the check.

    ## How to extend

    - Loop over several `class_name` values with `io.kestra.plugin.core.flow.Loop` to run the same canary across every class a RAG pipeline depends on in one flow.
    - Add a second `Aggregate` query filtered with a `where` clause on a recency field (if the class has one) to check not just total population but how many objects were added in the last run window.
    - Store the measured count to the KV store after each run and compare against the previous value, so a slow leak (not just a sudden wipe) also trips an alert.
    - Chain a downstream `Subflow` call to a reingestion pipeline on the AT_RISK branch, if one exists, instead of leaving remediation as alert-only.

    ## Pitfalls

    - **There is no remediation task in the Weaviate plugin for a population drop.** Only `BatchCreate`, `Delete`, `Query`, `SchemaCreate` exist under `io.kestra.plugin.weaviate` - nothing to reindex or restore lost objects, which is why the AT_RISK branch only alerts, unlike this repo's other governance gates that gate a remediation action behind `auto_remediate`/`dry_run`.
    - **A missing class is not the same as a zero count.** `Aggregate` on an undefined `class_name` returns a GraphQL error with HTTP 200, which `fail_on_query_error` turns into a failure - caught by the `errors` block, not by `evaluate_population`. A typo'd `class_name` reads as a flow failure, not as AT_RISK.
    - **The count path follows the query's structure.** The flow reads `data.Aggregate.<class_name>[0].meta.count` with `jq('.data.Aggregate[] | .[0].meta.count')`, which only works because the GraphQL query asks for `Aggregate { class_name { meta { count } } }` specifically; change both together.
    - **`class_name` is spliced directly into the GraphQL query text.** There is no bind-parameter mechanism for a GraphQL type name in this query; treat `class_name` as a trusted input, not one sourced from unescaped external user input.
    - **Tested against Weaviate 1.39.** The healthy, AT_RISK and missing-class paths were run end to end against a local anonymous Weaviate 1.39 instance, and the healthy path again against an API key protected one with `anonymous` set to false.

    ## Links

    - [plugin-weaviate documentation](https://kestra.io/plugins/plugin-weaviate)
    - [Weaviate GraphQL Aggregate API documentation](https://docs.weaviate.io/weaviate/api/graphql/aggregate)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Data
    - AI
  subTags:
    - Vector Stores & RAG
    - Monitoring & Alerting
  ee: false
  demo: false
