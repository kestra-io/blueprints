id: usaspending-federal-agencies-lakehouse-loader
namespace: company.analytics
description: Ingests federal budgetary authority, gross outlays, and congressional appropriations from USAspending API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: usaspending-federal-agencies-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://api.usaspending.gov/api/v2/references/toptier_agencies/"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "results"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for item in items:
            aid = str(item.get('agency_id', 'UNKNOWN'))
            current_ids.append(aid)
            aname = item.get('agency_name', 'Unknown')
            abbr = item.get('abbreviation', 'N/A')
            try:
                budget = float(item.get('budget_authority_amount', 0.0) or 0.0)
            except Exception:
                budget = 0.0
            try:
                outlay = float(item.get('outlay_amount', 0.0) or 0.0)
            except Exception:
                outlay = 0.0

            records.append({
                'agency_id': aid,
                'agency_name': str(aname),
                'abbreviation': str(abbr),
                'budget_authority_amount': budget,
                'outlay_amount': outlay,
                'is_new': bool(aid not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE federal_agencies (
                agency_id VARCHAR,
                agency_name VARCHAR,
                abbreviation VARCHAR,
                budget_authority_amount DOUBLE,
                outlay_amount DOUBLE,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO federal_agencies SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY federal_agencies TO 'federal_agencies_budget.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    agency_name,
                    abbreviation,
                    budget_authority_amount,
                    outlay_amount
                FROM federal_agencies
                ORDER BY budget_authority_amount DESC
                LIMIT 20
            ) TO 'top_agencies_by_budget.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM federal_agencies WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM federal_agencies").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - federal_agencies_budget.parquet
      - top_agencies_by_budget.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['federal_agencies_budget.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "USAspending Federal Agency Budget sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
