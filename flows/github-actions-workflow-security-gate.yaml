id: github-actions-workflow-security-gate
namespace: company.team
description: |
  GitHub Actions Workflow Security Gate. Before a change to a repository's CI is merged, scans every GitHub Actions
  workflow and composite action at two exact commits with zizmor, offline, and blocks only the security findings
  that the candidate commit introduces. Existing findings are reported without blocking, and an incomplete scan is
  never reported as clean.

inputs:
  - id: repo_url
    type: STRING
    displayName: GitHub repository
    description: Public GitHub repository, https://github.com/<owner>/<repo>. No other host, scheme, port or credentials.
    defaults: https://github.com/AyushVUpadhye/kestra-github-actions-security-gate-demo
    validator: '^https://github\.com/[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?/[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$'
  - id: base_commit
    type: STRING
    displayName: Base commit SHA
    description: Full 40-character SHA the change is compared against, usually the pull request's base. Branch and tag names are not accepted.
    defaults: e28ccb0d2447f900e47cbf53899e006dc3f60b05
    validator: '^[0-9a-f]{40}$'
  - id: candidate_commit
    type: STRING
    displayName: Candidate commit SHA
    description: Full 40-character SHA of the change, usually the pull request's head. Branch and tag names are not accepted.
    defaults: cc9759b83b995deebb768e6eadf8b1609f478f0e
    validator: '^[0-9a-f]{40}$'
  - id: min_severity
    type: SELECT
    displayName: Minimum severity
    description: New findings at or above this severity (and the minimum confidence) block the change.
    values:
      - informational
      - low
      - medium
      - high
    defaults: medium
  - id: min_confidence
    type: SELECT
    displayName: Minimum confidence
    description: New findings at or above this confidence (and the minimum severity) block the change.
    values:
      - low
      - medium
      - high
    defaults: medium
  - id: pr_number
    type: INT
    displayName: Pull request number
    description: Optional. When set, the verdict is posted on this pull request of the same repository, and kept up to date on later runs.
    required: false
    min: 1

tasks:
  - id: gate
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One workspace for the pinned scanner and the two checkouts.
    inputFiles:
      requirements.txt: |
        zizmor==1.30.1 --hash=sha256:eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e --hash=sha256:92906f448365672ebb657fb50d36f997290a3aaba8cac723214741ea9054845d
      gate.py: |
        import hashlib
        import json
        import os
        import re
        import subprocess
        import sys
        import time

        ZIZMOR = "/opt/gate/bin/zizmor"
        FLAGS = ["--offline", "--no-config", "--no-ignores", "--strict-collection", "--persona=pedantic",
                 "--format", "json-v1", "--no-progress", "--color", "never"]
        SIDES = ("base", "candidate")
        SEVERITY = {"informational": 0, "low": 1, "medium": 2, "high": 3}
        CONFIDENCE = {"low": 1, "medium": 2, "high": 3}
        MAX_FILES = 200
        MAX_BYTES = 1024 * 1024
        FILE_SECONDS = 60
        TOTAL_SECONDS = 480
        SCHEMA = "kestra-github-actions-workflow-security-gate/1.0"
        UNPARSEABLE = ("failed to parse input", "failed to validate", "failed to load", "is not valid YAML")


        def short(text, limit=200):
            text = " ".join(str(text or "").split())
            return text if len(text) <= limit else text[:limit - 3] + "..."


        def inputs(root):
            """Workflow files and action manifests, regular files only. Symbolic links were already removed on the worker."""
            found = []
            workflows = os.path.join(root, ".github", "workflows")
            if os.path.isdir(workflows) and not os.path.islink(workflows):
                for name in os.listdir(workflows):
                    path = os.path.join(workflows, name)
                    if name.endswith((".yml", ".yaml")) and os.path.isfile(path) and not os.path.islink(path):
                        found.append(os.path.relpath(path, root))
            for folder, dirs, names in os.walk(root, followlinks=False):
                dirs[:] = [d for d in dirs if d != ".git" and not os.path.islink(os.path.join(folder, d))]
                for name in names:
                    path = os.path.join(folder, name)
                    if name in ("action.yml", "action.yaml") and os.path.isfile(path) and not os.path.islink(path):
                        found.append(os.path.relpath(path, root))
            return sorted(set(p.replace(os.sep, "/") for p in found))


        def normalise(raw, root):
            findings = []
            for f in raw:
                locations = f.get("locations") or []
                # A finding without a location is never dropped silently: the caller turns this into a scanner error.
                prim = next((l for l in locations if l["symbolic"].get("kind") == "Primary"), locations[0])
                path = prim["symbolic"]["key"]["Local"]["verbatim_path"]
                if not path.startswith(root + "/"):
                    raise KeyError("finding outside the scanned checkout")
                path = path[len(root) + 1:]
                severity = f["determinations"]["severity"].lower()
                confidence = f["determinations"]["confidence"].lower()
                if severity not in SEVERITY or confidence not in CONFIDENCE:
                    raise KeyError("unknown severity or confidence")
                feature = prim.get("concrete", {}).get("feature", "")
                annotation = prim["symbolic"].get("annotation", "")
                ident = f["ident"]
                findings.append({
                    "audit": ident,
                    "severity": severity,
                    "confidence": confidence,
                    "path": path,
                    "line": prim["concrete"]["location"]["start_point"]["row"] + 1,
                    "annotation": short(annotation, 160),
                    "feature": short(feature, 200),
                    "url": f.get("url", ""),
                    # Line numbers are left out, so a finding that only moved is not new. Severity and confidence are kept,
                    # so a change that makes an existing line more dangerous is.
                    "fingerprint": hashlib.sha256("\x1f".join([ident, path, feature, annotation, severity, confidence]).encode()).hexdigest()[:16],
                })
            return findings


        def scan_side(side, work, deadline):
            root = os.path.realpath(os.path.join(work, side))
            files = inputs(root)
            result = {"files": [], "findings": [], "limit": None, "all": files}
            if len(files) > MAX_FILES:
                result["limit"] = "%d workflow or action files, more than the limit of %d" % (len(files), MAX_FILES)
                files = files[:MAX_FILES]
            for rel in files:
                path = os.path.join(root, rel)
                entry = {"path": rel, "status": "ok", "detail": None, "findings": 0}
                result["files"].append(entry)
                size = os.path.getsize(path)
                if size > MAX_BYTES:
                    entry.update(status="oversized", detail="%d bytes, more than the limit of %d" % (size, MAX_BYTES))
                    continue
                remaining = deadline - time.monotonic()
                if remaining <= 1:
                    entry.update(status="not_scanned", detail="the total scan time limit was reached")
                    continue
                command = ["setpriv", "--reuid=65534", "--regid=65534", "--clear-groups", "env", "-i",
                           "PATH=/usr/bin:/bin", "HOME=/tmp", ZIZMOR] + FLAGS + [path]
                try:
                    done = subprocess.run(command, capture_output=True, timeout=min(FILE_SECONDS, remaining), cwd="/tmp")
                except subprocess.TimeoutExpired:
                    entry.update(status="timeout", detail="scan did not finish within %d seconds" % min(FILE_SECONDS, int(remaining)))
                    continue
                stderr = done.stderr.decode("utf-8", "replace").replace(root + "/", "")
                if done.returncode not in (0, 10, 11, 12, 13, 14):
                    reason = next((l.strip() for l in stderr.splitlines() if "failed to" in l or "error:" in l), "") or "exit code %d" % done.returncode
                    unparseable = any(marker in stderr for marker in UNPARSEABLE)
                    entry.update(status="unparseable" if unparseable else "scanner_error", detail=short(reason, 240))
                    continue
                try:
                    raw = json.loads(done.stdout.decode("utf-8") or "[]")
                except ValueError:
                    entry.update(status="scanner_error", detail="scanner output is not valid JSON")
                    continue
                try:
                    found = normalise(raw, root)
                except (KeyError, TypeError, IndexError, AttributeError):
                    entry.update(status="scanner_error", detail="scanner output has an unexpected structure")
                    continue
                if done.returncode >= 11 and not found:
                    entry.update(status="scanner_error", detail="exit code %d reports findings but the output has none" % done.returncode)
                    continue
                entry["findings"] = len(found)
                result["findings"].extend(found)
            return result


        def scan(work):
            deadline = time.monotonic() + TOTAL_SECONDS
            started = time.monotonic()
            out = {side: scan_side(side, work, deadline) for side in SIDES}
            print("Scanned %d base and %d candidate file(s) in %.1fs" % (
                len(out["base"]["files"]), len(out["candidate"]["files"]), time.monotonic() - started))
            return out


        def symlinked(work, side):
            path = os.path.join(work, ".gate", side + "-symlinked-inputs")
            if not os.path.isfile(path):
                return []
            with open(path, "rb") as f:
                names = [n.decode("utf-8", "replace") for n in f.read().split(b"\0") if n]
            return sorted(set(n[len(side) + 1:] if n.startswith(side + "/") else n for n in names))


        def qualifies(f, min_severity, min_confidence):
            return SEVERITY[f["severity"]] >= SEVERITY[min_severity] and CONFIDENCE.get(f["confidence"], 0) >= CONFIDENCE[min_confidence]


        def classify(env, scanned):
            min_severity, min_confidence = env["MIN_SEVERITY"], env["MIN_CONFIDENCE"]
            base, cand = scanned["base"], scanned["candidate"]
            links = {side: symlinked(env["WORK"], side) for side in SIDES}
            base_status = {f["path"]: f["status"] for f in base["files"]}
            base_all = set(base["all"])

            def comparable(path):
                """Whether a candidate finding in this file can be compared with a fully scanned base version."""
                if any(path == link or path.startswith(link + "/") for link in links["base"]):
                    return False  # the base version was a symbolic link, or sat under one, and was never read
                if path in base_all:
                    return base_status.get(path) == "ok"  # missing here means it was over the file limit
                return True  # the file does not exist in the base, so every finding in it is new

            # Base findings are counted per fingerprint, so two identical findings stay distinct from one.
            remaining = {}
            for f in base["findings"]:
                remaining[f["fingerprint"]] = remaining.get(f["fingerprint"], 0) + 1
            new, existing, unknown = [], [], []
            for f in sorted(cand["findings"], key=lambda x: (x["path"], x["line"], x["audit"], x["fingerprint"])):
                if remaining.get(f["fingerprint"], 0) > 0:
                    remaining[f["fingerprint"]] -= 1
                    existing.append(f)
                elif not comparable(f["path"]):
                    unknown.append(f)  # newness cannot be decided, so this never counts as new or existing
                else:
                    new.append(f)
            cand_prints = {}
            for f in cand["findings"]:
                cand_prints[f["fingerprint"]] = cand_prints.get(f["fingerprint"], 0) + 1
            fixed = []
            for f in sorted(base["findings"], key=lambda x: (x["path"], x["line"], x["audit"], x["fingerprint"])):
                if cand_prints.get(f["fingerprint"], 0) > 0:
                    cand_prints[f["fingerprint"]] -= 1
                else:
                    fixed.append(f)

            q = lambda items: [f for f in items if qualifies(f, min_severity, min_confidence)]
            new_q, existing_q, unknown_q, fixed_q = q(new), q(existing), q(unknown), q(fixed)

            incomplete = []
            for side in SIDES:
                for f in scanned[side]["files"]:
                    if f["status"] != "ok":
                        incomplete.append({"side": side, "path": f["path"], "status": f["status"], "detail": f["detail"]})
                if scanned[side]["limit"]:
                    incomplete.append({"side": side, "path": None, "status": "too_many_files", "detail": scanned[side]["limit"]})
                for path in links[side]:
                    incomplete.append({"side": side, "path": path, "status": "symlink", "detail": "symbolic link, removed and not followed"})
            incomplete.sort(key=lambda x: (x["side"], x["path"] or "", x["status"]))

            codes = {"unparseable": "WORKFLOW_UNPARSEABLE", "scanner_error": "SCANNER_ERROR", "timeout": "SCAN_TIMEOUT",
                     "not_scanned": "SCAN_TIMEOUT", "oversized": "LIMIT_EXCEEDED", "too_many_files": "LIMIT_EXCEEDED",
                     "symlink": "UNSUPPORTED_SYMLINK"}
            inconclusive = sorted({codes[i["status"]] for i in incomplete})
            if new_q:
                verdict, reasons = "BLOCK", ["NEW_FINDINGS"]
            elif inconclusive:
                verdict, reasons = "INCONCLUSIVE", inconclusive
            elif existing_q:
                verdict, reasons = "WARN", ["EXISTING_FINDINGS"]
            else:
                verdict, reasons = "PASS", ([] if cand["files"] else ["NO_WORKFLOW_FILES"])
            if verdict == "BLOCK" and inconclusive:
                reasons = reasons + inconclusive

            slug = re.sub(r"\.git$", "", env["REPO_URL"].replace("https://github.com/", ""))
            below = lambda items: len(items) - len(q(items))
            report = {
                "schema": SCHEMA,
                "verdict": verdict,
                "reasonCodes": reasons,
                "repository": {"url": env["REPO_URL"], "slug": slug, "baseCommit": env["BASE_COMMIT"], "candidateCommit": env["CANDIDATE_COMMIT"]},
                "policy": {"minSeverity": min_severity, "minConfidence": min_confidence, "blockOn": "new findings at or above both thresholds"},
                "summary": {
                    "filesScanned": {side: sum(1 for f in scanned[side]["files"] if f["status"] == "ok") for side in SIDES},
                    "filesFound": {side: len(scanned[side]["all"]) for side in SIDES},  # every file discovered, even past the limit
                    "noWorkflowFiles": not cand["files"],
                    "newQualifying": len(new_q), "existingQualifying": len(existing_q), "fixedQualifying": len(fixed_q),
                    "undecidedQualifying": len(unknown_q),
                    "belowThreshold": {"new": below(new), "existing": below(existing)},
                    "complete": not incomplete,
                },
                "findings": {"new": new_q, "existing": existing_q, "fixed": fixed_q, "undecided": unknown_q},
                "incomplete": incomplete,
                "files": {side: scanned[side]["files"] for side in SIDES},
                "tool": {"name": "zizmor", "version": "1.30.1", "flags": FLAGS[:6], "network": "none", "user": "nobody"},
            }
            return report


        def code(text, limit=120):
            return "`" + short(text, limit).replace("`", "'") + "`"


        def render(report, execution):
            s, f = report["summary"], report["findings"]
            rows = [
                "### GitHub Actions Workflow Security Gate: " + report["verdict"],
                "",
                "| | |",
                "|---|---|",
                "| Repository | " + code(report["repository"]["slug"]) + " |",
                "| Commits | " + code(report["repository"]["baseCommit"][:12]) + " -> " + code(report["repository"]["candidateCommit"][:12]) + " |",
                "| Files scanned | " + str(s["filesScanned"]["candidate"]) + " of " + str(s["filesFound"]["candidate"]) + " in the candidate |",
                "| Policy | block new findings with severity >= " + report["policy"]["minSeverity"] + " and confidence >= " + report["policy"]["minConfidence"] + " |",
                "| Findings | " + str(s["newQualifying"]) + " new, " + str(s["existingQualifying"]) + " existing, " + str(s["fixedQualifying"]) + " fixed |",
            ]
            if s["noWorkflowFiles"]:
                rows += ["", "No workflow files or action manifests were found in the candidate commit, so there was nothing to scan."]

            def listing(title, items, cap):
                if not items:
                    return []
                out = ["", "**" + title + "** (" + str(len(items)) + ")", ""]
                out += ["- " + code(x["audit"], 40) + " " + x["severity"] + "/" + x["confidence"] + " at " + code(x["path"] + ":" + str(x["line"]), 100)
                        + ": " + code(x["annotation"], 100) for x in items[:cap]]
                if len(items) > cap:
                    out.append("- ... " + str(len(items) - cap) + " more in report.json")
                return out

            rows += listing("New findings", f["new"], 20)
            if report["incomplete"]:
                rows += ["", "**Not fully analysed** (" + str(len(report["incomplete"])) + ")", ""]
                rows += ["- " + i["side"] + " " + code(i["path"] or "(repository)", 100) + ": " + i["status"] + (" - " + code(i["detail"], 120) if i["detail"] else "")
                         for i in report["incomplete"][:20]]
            rows += listing("Existing findings", f["existing"], 10)
            rows += ["", "<sub>Kestra execution " + execution + ". zizmor 1.30.1 ran offline with the repository's own configuration and ignore comments disabled; repository code is never executed.</sub>"]
            return "\n".join(rows)


        def main():
            env = os.environ
            scanned = scan(env["WORK"])
            report = classify(env, scanned)
            with open("report.json", "w") as f:
                f.write(json.dumps(report, indent=2, sort_keys=True) + "\n")
            body = render(report, env["EXECUTION_ID"])
            s = report["summary"]
            print("Verdict " + report["verdict"] + (": " + ", ".join(report["reasonCodes"]) if report["reasonCodes"] else "")
                  + " | new %d, existing %d, fixed %d, incomplete %d" % (s["newQualifying"], s["existingQualifying"], s["fixedQualifying"], len(report["incomplete"])))
            print("::" + json.dumps({"outputs": {
                "verdict": report["verdict"], "reasonCodes": report["reasonCodes"], "repository": report["repository"]["slug"],
                "newFindings": s["newQualifying"], "existingFindings": s["existingQualifying"], "commentBody": body}}) + "::")


        if __name__ == "__main__":
            main()
    tasks:
      - id: fetch_tools
        type: io.kestra.plugin.scripts.shell.Commands
        description: Downloads the zizmor wheel for the worker's platform from PyPI, checked against pinned SHA-256 hashes. Runs before anything is cloned, so the only container with network access never sees repository content.
        timeout: PT5M
        retry:
          type: constant
          interval: PT10S
          maxAttempts: 3
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
        commands:
          - |
            pip download --no-deps --only-binary=:all: --require-hashes --no-cache-dir --disable-pip-version-check --timeout 30 --retries 5 --index-url https://pypi.org/simple -r requirements.txt -d wheels

      - id: clone_base
        type: io.kestra.plugin.git.Clone
        description: Checks out the exact base commit, without submodules.
        timeout: PT10M
        url: "{{ inputs.repo_url }}"
        commit: "{{ inputs.base_commit }}"
        cloneSubmodules: false
        directory: base

      - id: clone_candidate
        type: io.kestra.plugin.git.Clone
        description: Checks out the exact candidate commit, without submodules.
        timeout: PT10M
        url: "{{ inputs.repo_url }}"
        commit: "{{ inputs.candidate_commit }}"
        cloneSubmodules: false
        directory: candidate

      - id: verify
        type: io.kestra.plugin.scripts.shell.Commands
        description: Runs on the Kestra worker before the scanner container starts, after dropping every environment variable it does not need. Checks that each checkout is the requested commit, records workflow files and action manifests that are symbolic links, deletes every symbolic link so no container can follow one out of the clone, and removes the .git folders.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          BASE_COMMIT: "{{ inputs.base_commit }}"
          CANDIDATE_COMMIT: "{{ inputs.candidate_commit }}"
        commands:
          - |
            set -eu
            # This task runs on the Kestra worker, whose environment can hold secrets. Keep only what the checks need.
            for NAME in $(export -p | sed -n -e 's/^export \([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' -e 's/^declare -x \([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p'); do
              case "$NAME" in BASE_COMMIT|CANDIDATE_COMMIT|PATH|HOME|PWD) ;; *) unset "$NAME" 2>/dev/null || true ;; esac
            done
            mkdir -p .gate
            REMOVED=0; LINKED=0
            for side in base candidate; do
              if [ "$side" = base ]; then WANT=$BASE_COMMIT; else WANT=$CANDIDATE_COMMIT; fi
              HEAD_SHA=$(cat "$side/.git/HEAD")
              if [ "$HEAD_SHA" != "$WANT" ]; then echo "$side checkout is at '$HEAD_SHA', not the requested commit $WANT."; exit 1; fi
              rm -rf "$side/.git"
              # Workflow inputs that are symbolic links are recorded (and reported as not analysed), never followed.
              find "$side" -type l \( -path "$side/.github" -o -path "$side/.github/workflows" -o -path "$side/.github/workflows/*" -o -name action.yml -o -name action.yaml \) -print0 > ".gate/$side-symlinked-inputs"
              LINKED=$((LINKED + $(tr -cd '\0' < ".gate/$side-symlinked-inputs" | wc -c)))
              # Every symbolic link is deleted before any container starts, so nothing can follow one out of the clone.
              N=$(find "$side" -type l | wc -l); REMOVED=$((REMOVED + N)); find "$side" -type l -delete
            done
            echo "Verified both checkouts are the requested commits. Symbolic links removed: $REMOVED, of which workflow inputs: $LINKED."
            printf '::{"outputs":{"linksRemoved":%s,"symlinkedInputs":%s}}::\n' "$REMOVED" "$LINKED"

      - id: scan
        type: io.kestra.plugin.scripts.shell.Commands
        description: Offline and without secrets. Installs zizmor from the hash-checked wheel, scans each workflow file and action manifest of both commits separately as the unprivileged nobody user with an empty environment, compares the findings and writes report.json.
        timeout: PT10M
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          networkMode: none
          cpu:
            cpus: 2
          memory:
            memory: 1GB
        containerImage: python@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
        env:
          REPO_URL: "{{ inputs.repo_url }}"
          BASE_COMMIT: "{{ inputs.base_commit }}"
          CANDIDATE_COMMIT: "{{ inputs.candidate_commit }}"
          MIN_SEVERITY: "{{ inputs.min_severity }}"
          MIN_CONFIDENCE: "{{ inputs.min_confidence }}"
          EXECUTION_ID: "{{ execution.id }}"
        outputFiles:
          - report.json
        commands:
          - |
            set -eu
            pip install --no-index --find-links wheels --require-hashes --no-deps --target /opt/gate -r requirements.txt --quiet --disable-pip-version-check --root-user-action=ignore
            WORK=$PWD python -I -B gate.py

  - id: comment_on_pr
    type: io.kestra.plugin.core.flow.If
    description: Only touches GitHub when a pull request number was given.
    condition: "{{ (inputs.pr_number ?? 0) > 0 }}"
    then:
      - id: pr_comment
        type: io.kestra.plugin.github.issues.Comment
        description: One comment per pull request. Later runs update it in place instead of adding a new one.
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ outputs.scan.vars.repository }}"
        issueNumber: "{{ inputs.pr_number }}"
        updateTag: github-actions-workflow-security-gate
        body: "{{ outputs.scan.vars.commentBody }}"

  - id: verdict
    type: io.kestra.plugin.core.flow.Switch
    description: BLOCK fails the execution so a pipeline waiting on it stops; INCONCLUSIVE ends in WARNING; PASS and WARN succeed.
    value: "{{ outputs.scan.vars.verdict }}"
    cases:
      BLOCK:
        - id: block
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "New workflow security findings: {{ outputs.scan.vars.newFindings }} ({{ outputs.scan.vars.reasonCodes | join(', ') }})"
      INCONCLUSIVE:
        - id: inconclusive
          type: io.kestra.plugin.core.flow.AllowFailure
          description: Ends the execution in WARNING rather than FAILED, and still publishes the flow outputs.
          tasks:
            - id: not_fully_scanned
              type: io.kestra.plugin.core.execution.Fail
              errorMessage: "The workflows could not be fully scanned: {{ outputs.scan.vars.reasonCodes | join(', ') }}"
    defaults:
      - id: no_new_findings
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.scan.vars.verdict }}: no new findings, {{ outputs.scan.vars.existingFindings }} existing{{ (outputs.scan.vars.reasonCodes | length) > 0 ? ' (' ~ (outputs.scan.vars.reasonCodes | join(', ')) ~ ')' : '' }}"

outputs:
  - id: verdict
    type: STRING
    description: PASS, WARN, BLOCK or INCONCLUSIVE.
    value: "{{ outputs.scan.vars.verdict ?? 'ERROR' }}"
  - id: reason_codes
    type: JSON
    description: Reason codes behind the verdict, for example ["NEW_FINDINGS"].
    value: "{{ (outputs.scan.vars.reasonCodes ?? []) | toJson }}"
  - id: new_findings
    type: INT
    description: Number of new findings at or above both thresholds.
    value: "{{ outputs.scan.vars.newFindings ?? 0 }}"
  - id: report
    type: FILE
    description: report.json, schema kestra-github-actions-workflow-security-gate/1.0.
    value: "{{ outputs.scan.outputFiles['report.json'] ?? '' }}"

triggers:
  - id: pull_request_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: 'POST {"repo_url", "base_commit", "candidate_commit", "pr_number", "min_severity", "min_confidence"} from CI when a pull request changes workflows. Values go through the same validators as a manual run; an invalid request gets HTTP 422 and no execution.'
    key: "{{ secret('WORKFLOW_SECURITY_GATE_WEBHOOK_KEY') }}"
    inputs:
      repo_url: "{{ trigger.body.repo_url }}"
      base_commit: "{{ trigger.body.base_commit }}"
      candidate_commit: "{{ trigger.body.candidate_commit }}"
      min_severity: "{{ trigger.body.min_severity ?? 'medium' }}"
      min_confidence: "{{ trigger.body.min_confidence ?? 'medium' }}"
      pr_number: "{{ trigger.body.pr_number ?? '' }}"

extend:
  title: Block new GitHub Actions workflow security findings before a change is merged
  metaTitle: GitHub Actions Workflow Security Gate with zizmor and Baseline Comparison
  shortDescription: Scan GitHub Actions workflows and composite actions at a pull request's base and head commits with zizmor, offline, and block only the security findings the change introduces.
  metaDescription: Stop risky GitHub Actions changes before merge. Kestra scans base and head workflows offline with zizmor and blocks only newly introduced findings.
  description: |
    A pre-merge security gate for GitHub Actions. It answers one question before a change to a repository's CI is merged: **does this change introduce a new workflow security problem?**

    GitHub Actions workflows run with repository tokens and secrets, so a single unsafe line (an untrusted pull request title expanded into a shell script, `permissions: write-all`, a third-party action pinned to a moving tag, a `pull_request_target` workflow that checks out the contributor's code) can hand an attacker the repository. This blueprint scans every workflow and composite action at the change's base and head commits with [zizmor](https://docs.zizmor.sh), compares the two, and blocks only the findings the change introduces. Findings that already existed are reported without blocking, so the gate can be adopted on a repository with history.

    It complements repository posture tools such as OpenSSF Scorecard: instead of scoring a default branch through the GitHub API, it checks one proposed change, offline, finding by finding, before it lands. Unlike the scheduled, organisation-wide `github-actions-hardening-sweep` blueprint, it is a pre-merge gate that compares individual findings between exact base and candidate commits, blocks on qualifying newly introduced findings, and treats incomplete scans as inconclusive.

    ## How it works

    1. `fetch_tools` downloads the zizmor 1.30.1 wheel for the worker's platform from PyPI with `pip download --require-hashes --only-binary=:all:`, against pinned SHA-256 hashes for the Linux x86_64 and aarch64 wheels. It runs before anything is cloned, so the only container with network access never sees repository content. A slow or stalled download is retried (up to three attempts) instead of failing the gate.
    2. `clone_base` and `clone_candidate` (`io.kestra.plugin.git.Clone`) check out the two exact commits, without submodules.
    3. `verify` runs on the Kestra worker and first drops every environment variable it does not need. It checks that each checkout is the requested commit, records workflow files and action manifests that are symbolic links, deletes every symbolic link so no container can follow one out of the clone, and removes the `.git` folders.
    4. `scan` runs in one container with `networkMode: none`, 2 CPUs, 1 GB of memory and no secrets. It installs zizmor offline from the hash-checked wheel and scans each workflow file (`.github/workflows/*.yml`, `*.yaml`) and each composite action manifest (`action.yml`, `action.yaml`) of both commits **separately**, as the unprivileged `nobody` user with an empty environment, using `--offline --no-config --no-ignores --strict-collection --persona=pedantic --format json-v1`. Findings are fingerprinted without line numbers, compared, and written to `report.json` together with the pull request comment.
    5. `pr_comment` (`io.kestra.plugin.github.issues.Comment`) posts the verdict when `pr_number` is set. `updateTag` keeps one comment per pull request, updated on every run.
    6. `verdict` (Switch) fails the execution on `BLOCK` and ends `INCONCLUSIVE` runs in WARNING, so a pipeline waiting on the gate can tell them apart.

    ## Findings

    zizmor's offline audits cover, among others, template injection of untrusted context into scripts, excessive or undocumented `GITHUB_TOKEN` permissions, dangerous triggers such as `pull_request_target` and `workflow_run`, actions and container images not pinned to a commit or digest, credential persistence through `actions/checkout`, cache poisoning, `GITHUB_ENV` injection, unsafe `secrets: inherit`, self-hosted runners and typosquatted actions. See the [audit list](https://docs.zizmor.sh/audits/).

    - A finding is **qualifying** when its severity is at least `min_severity` and its confidence is at least `min_confidence` (default: medium and medium). The `pedantic` persona is used so nothing is hidden; the thresholds decide what matters.
    - A finding is **new** when the candidate has more findings with its fingerprint than the base. The fingerprint is the audit, the file, the flagged source text, zizmor's annotation, severity and confidence, without the line number: a finding that only moved (lines added above it) is not new, while one whose severity or confidence went up is.
    - A finding in a file whose base version could not be fully scanned (a parse error, a limit, a symbolic link) is **undecided**: it is listed in the report but never counted as new or existing, and the verdict is `INCONCLUSIVE` unless something else is certainly new.
    - Each file is scanned on its own with `--strict-collection`. Scanning a whole directory would silently skip a file zizmor cannot parse; per file, every failure is visible.
    - The repository's own `zizmor.yml` and inline `# zizmor: ignore[...]` comments are **ignored** (`--no-config --no-ignores`), so a change cannot silence the findings it introduces.

    ## Verdicts

    | Verdict | Execution state | Reason codes | When |
    | :--- | :--- | :--- | :--- |
    | `BLOCK` | FAILED | `NEW_FINDINGS` (plus any incomplete-scan code below) | At least one new qualifying finding. A finding that is certain is never hidden by another file failing to scan. |
    | `INCONCLUSIVE` | WARNING | `WORKFLOW_UNPARSEABLE`, `SCANNER_ERROR`, `SCAN_TIMEOUT`, `LIMIT_EXCEEDED`, `UNSUPPORTED_SYMLINK` | Something could not be scanned and no new qualifying finding was found. An incomplete scan is never `PASS`. |
    | `WARN` | SUCCESS | `EXISTING_FINDINGS` | Qualifying findings exist in the candidate, but all of them were already in the base. |
    | `PASS` | SUCCESS | none, or `NO_WORKFLOW_FILES` | Every file was scanned and there is no qualifying finding. `NO_WORKFLOW_FILES` says the candidate has no workflow or action file at all. |

    Limits per commit: 200 files, 1 MiB per file, 60 seconds per file and 480 seconds in total. Anything over a limit is reported as not analysed, never as clean, and a file that does not finish in time is `SCAN_TIMEOUT`. Typical workflow files scan in well under a second.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `repo_url` | STRING | demo repository | Public GitHub repository, `https://github.com/<owner>/<repo>`. No other host, scheme, port, credentials or query. |
    | `base_commit` | STRING | demo commit | Full 40-character SHA the change is compared against, usually the pull request's base. |
    | `candidate_commit` | STRING | demo commit | Full 40-character SHA of the change, usually the pull request's head. |
    | `min_severity` | SELECT | `medium` | `informational`, `low`, `medium` or `high`. |
    | `min_confidence` | SELECT | `medium` | `low`, `medium` or `high`. |
    | `pr_number` | INT | none | Optional. When set, the verdict is posted on that pull request of the same repository. |

    The defaults compare two commits of a small public demo repository where the candidate only adds comment lines above two existing findings: the result is `WARN` (both findings are recognised as existing, not new), and nothing is written to GitHub.

    ## Outputs

    - `verdict`: `PASS`, `WARN`, `BLOCK` or `INCONCLUSIVE`.
    - `reason_codes`: the codes behind the verdict, for example `["NEW_FINDINGS"]`.
    - `new_findings`: number of new qualifying findings.
    - `report`: `report.json` (schema `kestra-github-actions-workflow-security-gate/1.0`) with the commits, the policy, every scanned file and its status, new, existing and fixed qualifying findings (audit, severity, confidence, file, line, zizmor's annotation, the flagged source excerpt, documentation link and fingerprint), counts of findings below the thresholds, and everything that could not be analysed. Lists are sorted and the file contains no timestamps or execution IDs, so the same inputs produce a byte-identical report.

    ## What you get

    - A clear, per-change verdict for workflow edits instead of a repository-wide score.
    - Adoption without a cleanup sprint: existing findings warn, new ones block.
    - Evidence a reviewer can act on: file, line, audit and documentation link for every finding, in `report.json` and in one pull request comment that stays up to date.
    - Honest failure semantics: a file that cannot be parsed, a scanner error, a timeout or a symbolic link is reported as not analysed, never as clean.

    ## Who it's for

    - Platform and DevSecOps teams that review changes to CI before they reach the default branch.
    - Open source maintainers who accept workflow changes from contributors.
    - Security teams that need an auditable record of which CI changes were checked and why they passed.

    ## Why orchestrate this with Kestra

    A scanner on its own reports findings; a gate needs exact commits, a baseline comparison, isolation from the code it reads, retries and timeouts, a durable report and a decision other systems can wait on. Kestra keeps the networked download, the untrusted checkouts and the offline scan in separate tasks with their own limits, records every run with its inputs and `report.json`, exposes the verdict as an execution state for CI, and posts one up-to-date pull request comment.

    ## Prerequisites

    - A Kestra worker that can run Docker containers, with outbound access to `github.com` and `pypi.org` / `files.pythonhosted.org`. The blueprint was tested on Linux x86_64; the aarch64 wheel is pinned too but has not been exercised.

    ### Secrets

    - `GITHUB_TOKEN`: only when `pr_number` is set. A fine-grained token for the repository with **Pull requests: read and write** (or Issues: read and write). It is used by the comment task only and never reaches the scanner.
    - `WORKFLOW_SECURITY_GATE_WEBHOOK_KEY`: random key that forms the webhook URL, only if you use the webhook.

    ## Quick start

    1. Run the flow with the defaults to see a `WARN`. The defaults use [kestra-github-actions-security-gate-demo](https://github.com/AyushVUpadhye/kestra-github-actions-security-gate-demo), a repository of synthetic workflows (GitHub Actions is disabled on it) whose README lists every commit. Keep `repo_url` and try these pairs:

        | `base_commit` | `candidate_commit` | Result |
        | :--- | :--- | :--- |
        | `e28ccb0d2447f900e47cbf53899e006dc3f60b05` | `cc9759b83b995deebb768e6eadf8b1609f478f0e` (comment lines added above two existing findings) | `WARN`: `EXISTING_FINDINGS` (the defaults) |
        | `7239b08f60ff7618aa1a0ca44595c89cb87a8369` (no workflows) | `8fa1d8e1c6041248563513a84d07bd5889e2e82c` (hardened CI workflow) | `PASS` |
        | `8fa1d8e1c6041248563513a84d07bd5889e2e82c` | `43f64722bacb90b8fa1c65bf99522474f2b50a48` (adds a third-party action pinned to a tag) | `BLOCK`: `NEW_FINDINGS` (`unpinned-uses`) |
        | `43f64722bacb90b8fa1c65bf99522474f2b50a48` | `e28ccb0d2447f900e47cbf53899e006dc3f60b05` (adds an issue workflow that expands the issue title into a script) | `BLOCK`: `NEW_FINDINGS` (`template-injection`) |
        | `8fa1d8e1c6041248563513a84d07bd5889e2e82c` | `893ceea45dc2717c8614a0f8ed9a9f3ac9912b1b` (adds a workflow that is not valid YAML) | `INCONCLUSIVE`: `WORKFLOW_UNPARSEABLE` |

    2. Point the inputs at your own repository and the base and head commits of a pull request.
    3. To gate pull requests, call the webhook from CI and pass `pr_number`:

    ```bash
    curl -fsS -X POST -H 'Content-Type: application/json' \
      -d "{\"repo_url\": \"https://github.com/${GITHUB_REPOSITORY}\", \"base_commit\": \"${BASE_SHA}\", \"candidate_commit\": \"${HEAD_SHA}\", \"pr_number\": ${PR_NUMBER}}" \
      "https://<your-kestra-host>/api/v1/<tenant>/executions/webhook/company.team/github-actions-workflow-security-gate/${WORKFLOW_SECURITY_GATE_WEBHOOK_KEY}"
    ```

    Webhook values go through the same validators as a manual run: an invalid request gets HTTP 422 and no execution. `min_severity` and `min_confidence` default to `medium` when omitted.

    ## Security model

    - Repository content is untrusted and only ever read as text. zizmor parses YAML; it never runs workflow steps, scripts, build files or package managers, and nothing from the repository is installed.
    - The scanner runs offline (`--offline` and `networkMode: none`), as `nobody`, with an empty environment, so it cannot use a `GITHUB_TOKEN` and cannot reach the network. `GITHUB_TOKEN` is referenced only by the comment task.
    - Symbolic links are deleted on the worker before any container starts, and inputs are collected as regular files only, so a link cannot pull a file from outside the clone into the scan. A workflow file or action manifest that is a link is reported as `UNSUPPORTED_SYMLINK`.
    - Repository-controlled zizmor configuration and ignore comments are disabled.
    - Text from the repository (file names, annotations) is placed in code spans in the pull request comment, so it cannot inject markup or mentions. The flagged source excerpt is kept in `report.json` only.

    ## Limitations

    - Offline mode skips zizmor's four online audits (`impostor-commit`, `known-vulnerable-actions`, `ref-confusion`, `stale-action-refs`), which need the GitHub API.
    - Only `.github/workflows` and composite action manifests are scanned; Dependabot and pre-commit configuration are not.
    - A renamed workflow file counts as removed and added, so its findings are reported as new.
    - Both commits are cloned in full (without submodules). Very large repositories take longer and are bounded only by the 10-minute clone timeout.
    - zizmor is a static analyser of workflow definitions: it does not see what scripts, actions or containers do at run time, and its findings follow its own rules and personas.
    - The per-file and total time limits and the download retry were checked with shortened limits and a test flow; a scan reaching the real limits and a retry during a genuinely slow PyPI download have not been exercised.

    ## How to extend

    - Raise or lower `min_severity` and `min_confidence`, or run it on a schedule against the default branch with the same commit as base and candidate to get an inventory of existing findings.
    - Send `BLOCK` results to Slack or open an issue from `report.json` by adding tasks after `verdict`.
    - Add a gate-side allowlist of accepted fingerprints, owned by the platform team rather than by the repository being scanned.

    ## Links

    - [zizmor documentation](https://docs.zizmor.sh)
    - [zizmor audits](https://docs.zizmor.sh/audits/)
    - [Security hardening for GitHub Actions](https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions)
