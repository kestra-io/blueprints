
id: datasentinel_quarantine_load_gate
namespace: company.datasentinel

description: |
  Git-based CSV ingestion, data quality validation, quarantine of invalid
  records, and conditional downstream loading.

triggers:
  - id: daily_quality_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"

tasks:
  # 1. Git ingestion and CSV normalization
  - id: git_csv_source
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_dataset
        type: io.kestra.plugin.git.Clone
        url: https://github.com/kestra-io/datasets.git
        branch: main

      - id: normalize_csv
        type: io.kestra.plugin.scripts.python.Script
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        outputFiles:
          - normalized-orders.csv
        script: |
          import csv
          import os
          import json

          source = "csv/orders.csv"
          destination = "normalized-orders.csv"

          if not os.path.isfile(source):
              raise FileNotFoundError(
                  "Expected Git dataset file not found: " + source
              )

          rows_written = 0

          with open(source, newline="", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)
              required = {"order_id", "customer_email", "total"}
              headers = set(reader.fieldnames or [])

              missing = required - headers
              if missing:
                  raise ValueError(
                      "Missing source columns: " + str(sorted(missing))
                  )

              with open(
                  destination, "w", newline="", encoding="utf-8"
              ) as out:
                  writer = csv.DictWriter(
                      out,
                      fieldnames=[
                          "order_id",
                          "customer_email",
                          "amount"
                      ]
                  )
                  writer.writeheader()

                  for row in reader:
                      writer.writerow({
                          "order_id": row.get("order_id", ""),
                          "customer_email": row.get("customer_email", ""),
                          "amount": row.get("total", "")
                      })
                      rows_written += 1

          report = {
              "git_source": source,
              "normalized_file": destination,
              "rows_written": rows_written,
              "status": "SUCCESS"
          }

          print("GIT CSV NORMALIZATION:", json.dumps(report))

  # 2. Validate and quarantine records
  - id: validate_and_quarantine
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      input.csv: "{{ outputs.normalize_csv.outputFiles['normalized-orders.csv'] }}"
    outputFiles:
      - clean.csv
      - quarantine.csv
      - quality-report.json
    script: |
      import csv
      import io
      import json
      import math

      required = ["order_id", "customer_email", "amount"]
      clean = []
      quarantine = []
      seen_ids = set()

      with open("input.csv", "rb") as f:
          text = f.read().decode("utf-8-sig").lstrip("\r\n")

      reader = csv.DictReader(io.StringIO(text))
      headers = [h.strip() for h in (reader.fieldnames or [])]
      missing = [c for c in required if c not in headers]

      for line, raw_row in enumerate(reader, start=2):
          row = {
              (k.strip() if k else k): (v.strip() if v else v)
              for k, v in raw_row.items() if k is not None
          }
          errors = []

          if missing:
              errors.append("missing_columns:" + ",".join(missing))

          for col in required:
              if not row.get(col, ""):
                  errors.append("required_value_missing:" + col)

          order_id = row.get("order_id", "")
          if order_id and order_id in seen_ids:
              errors.append("duplicate_order_id")
          if order_id:
              seen_ids.add(order_id)

          try:
              amount = float(row.get("amount", ""))
              if not math.isfinite(amount) or amount < 0:
                  errors.append("invalid_amount")
          except (ValueError, TypeError):
              errors.append("invalid_amount")

          if errors:
              row["_source_line"] = line
              row["_quality_errors"] = ";".join(sorted(set(errors)))
              quarantine.append(row)
          else:
              clean.append(row)

      with open("clean.csv", "w", newline="", encoding="utf-8") as f:
          writer = csv.DictWriter(f, fieldnames=required)
          writer.writeheader()
          writer.writerows([
              {k: r.get(k, "") for k in required} for r in clean
          ])

      quarantine_fields = required + [
          "_source_line", "_quality_errors"
      ]

      with open("quarantine.csv", "w", newline="", encoding="utf-8") as f:
          writer = csv.DictWriter(f, fieldnames=quarantine_fields)
          writer.writeheader()
          writer.writerows([
              {k: r.get(k, "") for k in quarantine_fields}
              for r in quarantine
          ])

      report = {
          "status": "FAILED" if quarantine or missing else "PASSED",
          "rows_read": len(clean) + len(quarantine),
          "valid_rows": len(clean),
          "quarantined_rows": len(quarantine),
          "missing_columns": missing,
          "required_columns": required
      }

      with open("quality-report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      print("QUALITY REPORT:", json.dumps(report))
      print('::{"outputs":{"quality_status":"' + report["status"] + '"}}::')

  # 3. Conditional quality gate
  - id: quality_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.validate_and_quarantine.vars.quality_status == 'PASSED' }}"
    then:
      - id: downstream_load
        type: io.kestra.plugin.scripts.python.Script
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        inputFiles:
          clean.csv: "{{ outputs.validate_and_quarantine.outputFiles['clean.csv'] }}"
        outputFiles:
          - load-result.json
        script: |
          import csv
          import json

          with open("clean.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))

          result = {
              "load_status": "SUCCESS",
              "rows_processed": len(rows)
          }

          with open("load-result.json", "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2)

          print("DOWNSTREAM RESULT:", json.dumps(result))

    else:
      - id: log_quality_failure
        type: io.kestra.plugin.core.log.Log
        message: "QUALITY GATE FAILED: invalid records were quarantined; downstream load is blocked."

      - id: fail_quality_gate
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Data quality validation failed. Downstream load was blocked; inspect quarantine.csv and quality-report.json."

extend:
  title: DataSentinel - CSV Data Quality and Quarantine
  metaTitle: DataSentinel | Automated Data Quality Pipeline in Kestra
  shortDescription: Ingest CSV data from Git, normalize records, validate quality, quarantine invalid rows, and block unsafe downstream loads.
  metaDescription: Automate CSV ingestion, data validation, quarantine, and conditional downstream loading with Kestra.
  description: |
    DataSentinel is a reusable data quality pipeline that prevents invalid
    records from entering downstream processing.

    ## How it works

    1. Clone a public Git dataset.
    2. Normalize source CSV columns into a standard format.
    3. Validate required fields, duplicate order IDs, and numeric amounts.
    4. Separate valid records into clean.csv and invalid records into quarantine.csv.
    5. Generate quality-report.json.
    6. Allow downstream loading only when validation passes.
    7. Run the workflow daily using a schedule trigger.

    ## What you get

    - Git-based CSV ingestion and normalization.
    - Clean and quarantined CSV files.
    - Machine-readable quality report.
    - Conditional downstream loading.
    - Daily scheduled execution.

    ## Who it's for

    Data engineers, ETL developers, analytics teams, and data platform teams.

    ## Why orchestrate this with Kestra

    Kestra coordinates ingestion, validation, branching, failure handling,
    and downstream processing in one observable workflow.

    ## Prerequisites

    - A running Kestra instance.
    - Python script plugin.
    - Git plugin.
    - Access to the source Git repository.

    ### Secrets

    No secrets are required for the public demonstration dataset.
    Private Git repositories require appropriate credentials.

    ## Quick start

    1. Import the flow into Kestra.
    2. Execute it manually or use the daily schedule.
    3. Inspect quality-report.json.
    4. Review clean.csv and quarantine.csv.
    5. Confirm downstream loading runs only when validation passes.

    ## How to extend

    - Connect your own Git repository.
    - Add domain-specific validation rules.
    - Store quarantined records in a database or object store.
    - Replace the demonstration load task with a production data warehouse.
    - Add alerts for failed quality checks.

    ## Links

    - Kestra documentation: https://kestra.io/docs
    - Python plugin: https://kestra.io/plugins/plugin-script-python
    - Git plugin: https://kestra.io/plugins/plugin-git

  tags:
    - Data
    - Automation
  subTags:
    - Data Quality
    - ETL
  ee: false
  demo: false
