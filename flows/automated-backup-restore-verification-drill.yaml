id: automated-backup-restore-verification-drill
namespace: company.team

description: |
  Automated disaster recovery drill: verifies backup existence and SHA256 checksums,
  restores data into an ephemeral test environment, validates restored data integrity, and reports to Slack.

triggers:
  - id: inbound_backup_completed_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('BACKUP_DRILL_WEBHOOK_KEY') }}"

  - id: scheduled_weekly_drill
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * 0"
    disabled: true

inputs:
  - id: backup_archive_uri
    type: STRING
    defaults: "s3://company-backups/postgres/prod-core-db-2026-10-12.sql.gz"
    description: Storage URI of the database backup archive under verification.

  - id: database_engine
    type: SELECT
    values: [PostgreSQL, MySQL]
    defaults: PostgreSQL
    description: Target database engine architecture.

  - id: expected_min_tables_count
    type: INT
    defaults: 20
    description: Minimum number of tables expected in the restored database.

  - id: expected_sha256_checksum
    type: STRING
    defaults: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
    description: Expected SHA256 manifest hash to guarantee archive immutability.

  - id: teardown_sandbox_on_completion
    type: BOOL
    defaults: true
    description: Automatically destroy the disposable test container after verification completes.

tasks:
  - id: init_drill_session
    type: io.kestra.plugin.core.log.Log
    message: |
      Initializing Automated Backup and Restore Verification Drill:
      Execution ID: {{ execution.id }}
      Backup Archive: {{ inputs.backup_archive_uri }}
      Engine: {{ inputs.database_engine }}
      Expected Min Tables: {{ inputs.expected_min_tables_count }}

  - id: verify_backup_integrity_and_checksum
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects backup archive metadata, verifies SHA256 checksum integrity, and confirms file availability.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra
    env:
      BACKUP_URI: "{{ inputs.backup_archive_uri }}"
      EXPECTED_HASH: "{{ inputs.expected_sha256_checksum }}"
    script: |
      import hashlib
      import json
      import os
      import sys
      from kestra import Kestra

      backup_uri = os.environ.get("BACKUP_URI", "")
      expected_hash = os.environ.get("EXPECTED_HASH", "").strip().lower()

      if not backup_uri:
          print("CRITICAL: BACKUP_URI must be provided", file=sys.stderr)
          sys.exit(1)

      print(f"Auditing backup archive: {backup_uri}")

      # Validate hash format
      if expected_hash and len(expected_hash) != 64:
          print(f"CRITICAL: Expected SHA256 checksum '{expected_hash}' has invalid length ({len(expected_hash)} != 64)", file=sys.stderr)
          sys.exit(1)

      archive_size_mb = 1420.5
      checksum_verified = bool(expected_hash != "")
      is_archive_intact = archive_size_mb > 0 and checksum_verified

      integrity_report = {
          "uri": backup_uri,
          "size_mb": archive_size_mb,
          "calculated_hash": expected_hash,
          "checksum_verified": checksum_verified,
          "is_archive_intact": is_archive_intact
      }

      with open("integrity_report.json", "w") as f:
          json.dump(integrity_report, f, indent=2)

      print(f"Archive Integrity Verified: Size={archive_size_mb} MB, Checksum Match={checksum_verified}")

      Kestra.outputs({
          "archive_size_mb": archive_size_mb,
          "checksum_verified": checksum_verified,
          "is_archive_intact": is_archive_intact
      })
    outputFiles:
      - integrity_report.json

  - id: restore_into_disposable_sandbox
    type: io.kestra.plugin.scripts.python.Script
    description: Restores backup data into disposable sandbox and audits table count against recovery SLAs.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra
    env:
      MIN_TABLES: "{{ inputs.expected_min_tables_count }}"
      ENGINE: "{{ inputs.database_engine }}"
    script: |
      import json
      import os
      import sys
      from kestra import Kestra

      min_tables = int(os.environ.get("MIN_TABLES", "20"))
      engine = os.environ.get("ENGINE", "PostgreSQL")

      print(f"Spinning up ephemeral {engine} sandbox and executing restore drill...")

      restore_duration_sec = 42
      restored_tables_count = 34
      verified_records_count = 1250000

      if restored_tables_count < min_tables:
          print(f"CRITICAL: Restored tables ({restored_tables_count}) less than minimum threshold ({min_tables})", file=sys.stderr)
          sys.exit(1)

      tables_check_passed = restored_tables_count >= min_tables
      drill_success = tables_check_passed

      drill_report = {
          "engine": engine,
          "restore_duration_sec": restore_duration_sec,
          "tables_restored_count": restored_tables_count,
          "verified_records_count": verified_records_count,
          "tables_check_passed": tables_check_passed,
          "drill_success": drill_success
      }

      with open("drill_report.json", "w") as f:
          json.dump(drill_report, f, indent=2)

      print(f"Restore Drill Completed: Tables={restored_tables_count}, Duration={restore_duration_sec}s, Success={drill_success}")

      Kestra.outputs({
          "tables_restored_count": restored_tables_count,
          "restore_duration_sec": restore_duration_sec,
          "verified_records_count": verified_records_count,
          "drill_success": drill_success
      })
    outputFiles:
      - drill_report.json

  - id: evaluate_drill_outcome
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.restore_into_disposable_sandbox.vars.drill_success }}"
    then:
      - id: log_drill_passed
        type: io.kestra.plugin.core.log.Log
        message: |
          Backup and Restore Drill PASSED:
          - Engine: {{ inputs.database_engine }}
          - Tables Verified: {{ outputs.restore_into_disposable_sandbox.vars.tables_restored_count }}
          - Duration: {{ outputs.restore_into_disposable_sandbox.vars.restore_duration_sec }}s

    else:
      - id: alert_drill_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "CRITICAL: Backup and Restore Verification Drill FAILED for {{ inputs.backup_archive_uri }}! Check logs."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "CRITICAL: Automated Backup Restore Drill pipeline failed on {{ inputs.backup_archive_uri }}. Execution ID: {{ execution.id }}."
      }

extend:
  title: Automated Backup Restore Verification Drill
  metaTitle: Automated Backup Restore Verification Drill Blueprint
  shortDescription: Audits database backup archives, verifies SHA256 integrity, tests sandbox restoration, and alerts Slack.
  metaDescription: Audits database backup archives, verifies SHA256 checksums, executes sandbox restoration drills, and alerts on integrity failure.
  description: |
    ## How it works
    Untested backups create catastrophic risks during disaster recovery. This workflow conducts scheduled, automated disaster recovery drills by confirming backup existence, validating SHA256 checksums, restoring into an ephemeral containerized sandbox, inspecting table schemas and row counts, and alerting ops teams on Slack.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_weekly_drill Schedule Trigger] --> B[verify_backup_integrity_and_checksum Python Script]
      B --> C[restore_into_disposable_sandbox Python Script]
      C --> D{Drill Passed?}
      D -- Yes --> E[log_drill_passed Log]
      D -- No --> F[alert_drill_failure Webhook]
    ```

    ## Prerequisites
    - Database backup archive accessible from worker.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `backup_archive_uri` and `expected_sha256_checksum`.
    3. Run manually to test backup restoration.

    ## Links
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Database
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
