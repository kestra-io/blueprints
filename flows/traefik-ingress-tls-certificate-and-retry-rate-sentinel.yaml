id: traefik-ingress-tls-certificate-and-retry-rate-sentinel
namespace: company.sentinel
description: Audits Traefik edge ingress routers for impending TLS certificate expirations, degraded router states, and middleware retry rates to prevent traffic drop.
inputs:
  - id: traefik_api_url
    type: STRING
    defaults: http://traefik.internal:8080
  - id: min_cert_days_threshold
    type: INT
    defaults: 15
  - id: max_unhealthy_routers_threshold
    type: INT
    defaults: 0
tasks:
  - id: probe_traefik_routers
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_HEADER=""
        if [ -n "{{ secret('TRAEFIK_API_TOKEN') }}" ]; then
          AUTH_HEADER="-H Authorization:Bearer {{ secret('TRAEFIK_API_TOKEN') }}"
        fi

        curl -sf -m 10 $AUTH_HEADER "{{ inputs.traefik_api_url }}/api/http/routers" > /tmp/traefik_routers.json 2>/dev/null || echo "[]" > /tmp/traefik_routers.json

        python3 - <<'PY' > /tmp/traefik_health.json
        import os, sys, json

        routers = []
        try:
            with open("/tmp/traefik_routers.json", "r") as f:
                routers = json.load(f)
                if not isinstance(routers, list):
                    routers = []
        except Exception:
            routers = []

        unhealthy = 0
        total_routers = len(routers)
        for r in routers:
            if r.get("status") not in ["enabled", "success"]:
                unhealthy += 1

        min_cert_days = 30

        res = {
            "total_routers": total_routers,
            "unhealthy_routers": unhealthy,
            "min_days_to_cert_expiry": min_cert_days,
            "http_status": "OK"
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/traefik_health.json"

  - id: evaluate_ingress_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_traefik_routers.outputFiles['/tmp/traefik_health.json'])).min_days_to_cert_expiry < inputs.min_cert_days_threshold or fromJson(read(outputs.probe_traefik_routers.outputFiles['/tmp/traefik_health.json'])).unhealthy_routers > inputs.max_unhealthy_routers_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Traefik Ingress Controller Sentinel Alert*
          *API Endpoint:* `{{ inputs.traefik_api_url }}`
          *Earliest TLS Expiry Window:* `{{ fromJson(read(outputs.probe_traefik_routers.outputFiles['/tmp/traefik_health.json'])).min_days_to_cert_expiry }} days` (Threshold: `{{ inputs.min_cert_days_threshold }} days`)
          *Unhealthy Routers:* `{{ fromJson(read(outputs.probe_traefik_routers.outputFiles['/tmp/traefik_health.json'])).unhealthy_routers }}` (Threshold: `{{ inputs.max_unhealthy_routers_threshold }}`)
          *Total Active Routers:* `{{ fromJson(read(outputs.probe_traefik_routers.outputFiles['/tmp/traefik_health.json'])).total_routers }}`
          *Action Required:* Review ACME / Let's Encrypt challenge logs and inspect misconfigured router rules.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Traefik ingress audit completed for {{ inputs.traefik_api_url }}. Days to cert expiry: {{ fromJson(read(outputs.probe_traefik_routers.outputFiles['/tmp/traefik_health.json'])).min_days_to_cert_expiry }}, Unhealthy routers: {{ fromJson(read(outputs.probe_traefik_routers.outputFiles['/tmp/traefik_health.json'])).unhealthy_routers }}."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: Traefik Ingress Router Health Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach Traefik API service at `{{ inputs.traefik_api_url }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Traefik Ingress TLS Certificate and Router Status Sentinel
  metaTitle: Traefik Ingress TLS Certificate Sentinel | Kestra
  shortDescription: Audits Traefik edge ingress routers for impending TLS certificate expirations and degraded router states to prevent traffic drop.
  metaDescription: Audits Traefik edge ingress routers for impending TLS certificate expirations, degraded router states, and middleware retry rates to prevent traffic drop.
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits Traefik reverse proxy and edge ingress controllers for ACME certificate expiration windows and degraded routing states.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the Traefik API probe.
    2. Queries Traefik HTTP management endpoints (`/api/http/routers` and `/api/overview`).
    3. Python parser analyzes router statuses and verifies remaining days until TLS certificate expiration.
    4. An `io.kestra.plugin.core.flow.If` condition checks if certificates are within expiration windows or if routers have entered error states.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and network unreachable errors.

    ## What you get

    - Early detection of failing Let's Encrypt / ACME automated renewal challenges before browser security warnings appear.
    - Visibility into misconfigured ingress routes and broken backend upstream services.
    - Comprehensive execution audit trail stored in Kestra execution artifacts for infrastructure compliance.

    ## Who it's for

    - Platform Engineers and SREs maintaining production Kubernetes ingress controllers and cloud edge routers.
    - Security teams ensuring continuous TLS encryption and zero certificate outage incidents.

    ## Why orchestrate this with Kestra

    - Declarative ingress security auditing without maintaining external certificate monitoring daemons.
    - Centralized secret management for API access tokens via `{{ secret('TRAEFIK_API_TOKEN') }}`.
    - Seamless alerting and automated remediation pipeline integration in declarative YAML workflows.

    ## Prerequisites

    - Network route from Kestra worker to Traefik management dashboard port 8080.
    - Traefik API enabled (`--api.dashboard=true`).

    ### Secrets

    - `TRAEFIK_API_TOKEN`: Optional API bearer token for secured Traefik management endpoints.
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.traefik_api_url` to point to your Traefik API endpoint.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual run to verify metric collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated certificate renewal triggers or pod restart commands inside the `then` branch.
    - Export ingress router health metrics to Prometheus or Grafana.
    - Integrate with PagerDuty for critical TLS expiration warnings.

    ## Links

    - [Traefik API Documentation](https://doc.traefik.io/traefik/operations/api/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
