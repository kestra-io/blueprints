id: redis-acl-user-audit
namespace: company.team

description: |
  Audit Redis ACL users: enabled users with no password, users allowed every command or
  dangerous commands (FLUSHALL, CONFIG, KEYS, DEBUG...), users allowed every key, and users not
  in the list of known accounts. Alert Slack, and optionally disable passwordless users and
  remove dangerous commands with ACL SETUSER, then read ACL LIST again to verify. Password
  hashes are stripped before anything is logged.

inputs:
  - id: host
    type: STRING
    displayName: Redis host
    defaults: "localhost"

  - id: port
    type: INT
    displayName: Redis port
    defaults: 6379

  - id: known_users
    type: ARRAY
    itemType: STRING
    displayName: Known application users
    defaults:
      - app
      - cache-worker

  - id: admin_users
    type: ARRAY
    itemType: STRING
    displayName: Admin users
    description: Users allowed every command and every key.
    defaults:
      - ops-admin

  - id: network
    type: STRING
    displayName: Docker network for redis-cli
    description: Network of the redis-cli containers. Leave empty for Docker's default bridge.
    defaults: ""

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Disable passwordless users (never default) and remove dangerous commands. Medium findings are only reported.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for ACL SETUSER to run.
    defaults: true

variables:
  dangerous: '["+@all", "+@dangerous", "+@admin", "+flushall", "+flushdb", "+config", "+keys", "+debug", "+shutdown", "+save", "+bgsave", "+replicaof", "+slaveof", "+acl", "+module", "+script"]'
  rules: >-
    .known as $known | .admins as $admins | .dangerous as $danger
    | [.list | split("\\n")[] | select(startswith("user ")) | split(" ") | {user: .[1], tokens: (.[2:] | map(select(startswith("#") or startswith(">") | not)))}
       | select(.tokens | index("on")) | . as $u | ($admins | index($u.user) != null) as $admin
       | ([.tokens[] | select(. as $t | $danger | index($t)) | select(. != "+@all" or ($u.tokens | index("-@dangerous") | not))]) as $bad
       | [ (if (.tokens | index("nopass")) then {code: "NOPASS", severity: "HIGH", why: "any client can authenticate as this user without a password",
              fix: (if .user == "default" then null else ["ACL", "SETUSER", .user, "off"] end)} else empty end),
           (if ($bad | length) > 0 and ($admin | not) then {code: "DANGEROUS_COMMANDS", severity: "HIGH", why: "allowed \($bad | join(" "))",
              fix: (if .user == "default" then null else ["ACL", "SETUSER", .user] + (if ($bad | index("+@all")) then ["-@dangerous"] else ($bad | map("-" + .[1:])) end) end)} else empty end),
           (if (.tokens | index("~*")) and ($admin | not) then {code: "ALL_KEYS", severity: "MEDIUM", why: "can read or write every key", fix: null} else empty end),
           (if ($known | index($u.user)) == null and ($admin | not) and .user != "default" then {code: "UNKNOWN_USER", severity: "MEDIUM", why: "not a known application user", fix: null} else empty end) ]
       | .[] | . + {user: $u.user, acl: ($u.tokens | join(" "))}]

tasks:
  - id: acl_list
    type: io.kestra.plugin.redis.cli.RedisCLI
    description: Read-only.
    host: "{{ inputs.host }}"
    port: "{{ inputs.port }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.network }}"
    commands:
      - ACL LIST

  - id: readable
    type: io.kestra.plugin.core.flow.If
    description: A user without ACL LIST permission gets a NOPERM reply, not an error exit code. No user line means the audit saw nothing, which must not read as clean.
    condition: "{{ {'s': outputs.acl_list.vars.command_1 ?? ''} | jq('.s | ltrimstr(\"\\n\") | startswith(\"user \") | not') | first }}"
    then:
      - id: unreadable
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "ACL LIST did not return any user: {{ outputs.acl_list.vars.command_1 ?? 'no output' }}. The connecting user needs the acl|list command."

  - id: findings
    type: io.kestra.plugin.core.output.OutputValues
    values:
      items: "{{ {'list': outputs.acl_list.vars.command_1, 'known': inputs.known_users, 'admins': inputs.admin_users, 'dangerous': fromJson(vars.dangerous)} | jq(vars.rules) | first | toJson }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Redis ACL audit on {{ inputs.host }}:{{ inputs.port }}: {{ fromJson(outputs.findings.values.items) | length }} findings.
      {{ fromJson(outputs.findings.values.items) | jq('map("\(.severity) \(.code) \(.user): \(.why)") | join("; ")') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.findings.values.items) | length > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Redis ACL audit on ' ~ inputs.host ~ ':' ~ inputs.port ~ ': ' ~ (fromJson(outputs.findings.values.items) | jq('map("\(.severity) \(.code) \(.user)") | join(", ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Applying the fixes now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and fromJson(outputs.findings.values.items) | jq('map(select(.fix != null)) | length') | first > 0 }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            concurrencyLimit: 1
            description: One ACL SETUSER per fix. Each one only adds rules, so the rest of the user's ACL is kept.
            values: "{{ fromJson(outputs.findings.values.items) | jq('map(select(.fix != null) | .fix | join(\" \"))') | first | toJson }}"
            tasks:
              - id: setuser
                type: io.kestra.plugin.redis.cli.RedisCLI
                host: "{{ inputs.host }}"
                port: "{{ inputs.port }}"
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.network }}"
                commands:
                  - "{{ item.value }}"

          - id: acl_relist
            type: io.kestra.plugin.redis.cli.RedisCLI
            host: "{{ inputs.host }}"
            port: "{{ inputs.port }}"
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.network }}"
            commands:
              - ACL LIST

          - id: after
            type: io.kestra.plugin.core.output.OutputValues
            values:
              items: "{{ {'list': outputs.acl_relist.vars.command_1, 'known': inputs.known_users, 'admins': inputs.admin_users, 'dangerous': fromJson(vars.dangerous)} | jq(vars.rules) | first | toJson }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            description: Every finding that had a fix must be gone from the second ACL LIST.
            condition: >-
              {{ {'b': fromJson(outputs.findings.values.items), 'a': fromJson(outputs.after.values.items)} | jq('([.a[] | .user + "|" + .code]) as $a
                 | [.b[] | select(.fix != null) | .user + "|" + .code | select(. as $x | $a | index($x))] | length') | first > 0 }}
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "ACL SETUSER ran, but some findings are still there: {{ fromJson(outputs.after.values.items) | jq('map(\"\\(.code) \\(.user)\") | join(\", \")') | first }}."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Fixed and verified: {{ fromJson(outputs.findings.values.items) | jq('map(select(.fix != null) | .fix | join(" ")) | join("; ")') | first }}.
                  Left for review: {{ fromJson(outputs.after.values.items) | jq('if length == 0 then "none" else map("\(.code) \(.user)") | join(", ") end') | first }}.
                  ACL changes live in memory: run ACL SAVE if the server uses an aclfile, or update users.acl or redis.conf.
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No ACL finding."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Redis ACL audit failed on ' ~ inputs.host ~ ':' ~ inputs.port ~ ' (execution ' ~ execution.id ~ '). Treat the ACLs as unaudited.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode.
    cron: "0 7 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Redis ACL User Audit
  shortDescription: Audit Redis ACL users for passwordless logins, dangerous or unrestricted commands, access to every key and unknown accounts, alert Slack, and optionally disable or restrict users with ACL SETUSER and verify.
  metaTitle: Redis ACL User Audit with Kestra
  metaDescription: Find Redis ACL users with nopass, +@all or dangerous commands, every-key access or unknown names, alert Slack, fix with ACL SETUSER and verify.
  description: |
    Redis 6 added ACLs, and many deployments now have a dozen users, some of them risky:
    - a worker created with `nopass` during a test;
    - a legacy service account with `+@all` that can `FLUSHALL` production;
    - a debugging user allowed `KEYS` and `DEBUG`;
    - the `default` user still open to anyone who can reach the port.

    `ACL LIST` shows all of it, but nobody reads it.

    This blueprint reads `ACL LIST` with `redis-cli`, checks every enabled user against a few rules, and alerts Slack. It can disable passwordless users and remove dangerous commands with `ACL SETUSER`, then read `ACL LIST` again to verify. Password hashes are stripped before anything is logged or sent.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Severity | Rule | Fix |
    |---|---|---|---|
    | `NOPASS` | High | Enabled user with `nopass` | `ACL SETUSER <user> off`. Never applied to `default`: reported with the advice to set a password |
    | `DANGEROUS_COMMANDS` | High | `+@all`, `+@dangerous`, `+@admin`, or an explicit `FLUSHALL`, `CONFIG`, `KEYS`, `DEBUG`, `SHUTDOWN`, `ACL`, `MODULE`... outside the admin users | `-@dangerous` for `+@all`, otherwise removes each listed command |
    | `ALL_KEYS` | Medium | `~*` outside the admin users | Report only |
    | `UNKNOWN_USER` | Medium | Not in `known_users` or `admin_users` | Report only |

    Fixes only add rules to the user, so the rest of its ACL is kept.

    ## How it works

    1. `acl_list` (`io.kestra.plugin.redis.cli.RedisCLI`, read-only) runs `ACL LIST`.
    2. `readable` fails the run when no user line came back, for example a `NOPERM` reply. An audit that saw nothing must not read as clean.
    3. `findings` parses the users and applies the rules in one jq program, stored in `vars.rules` and reused for the verification. `summary` logs every finding.
    4. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs it.
       - **findings:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`) runs one `ACL SETUSER` per fix, each in its own `RedisCLI` task.
         - `acl_relist` and `after` apply the same rules to a fresh `ACL LIST`. `verify_result` fails if a fixed finding is still there.
    5. `errors` alerts Slack when the audit cannot run.

    ACL changes live in memory. The final log reminds you to run `ACL SAVE` when the server uses an aclfile, or to update its configuration.

    ## What you get

    - A daily review of every Redis user, with the reason each finding matters.
    - Fixes that restrict users without rewriting their ACL, behind two gates, verified by a second `ACL LIST`.
    - No false clean result when the auditing user is not allowed to list ACLs.

    ## Who it's for

    - Platform teams running Redis for many services with ACL users.
    - Security teams that need evidence that passwordless and over-privileged accounts are removed.
    - Teams evaluating the Redis plugin who want an example of `RedisCLI` driving an audit and its fixes.

    ## Why orchestrate this with Kestra

    `ACL LIST` answers the question for one instance at one moment. Kestra runs it on a schedule, keeps the list of known and admin users next to the flow, turns findings into a Slack alert, applies fixes only behind `auto_remediate` and `dry_run`, and keeps a history that shows when a risky user appeared and when it was fixed.

    ## Tested end to end

    On Kestra 2.0.5 OSS against Redis 7, with a local HTTP sink standing in for Slack. Users seeded with `ACL SETUSER`:
    - `app`, restricted;
    - `cache-worker` with `nopass`;
    - `legacy` with `+@all ~*`;
    - `tmp-debug` with `+keys +debug`;
    - `ops-admin` (admin), and the open `default` user.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 10 findings across `cache-worker`, `default`, `legacy` and `tmp-debug`. `app` and `ops-admin` not flagged. Alert sent |
    | 2 | `auto_remediate: true`, `dry_run: true` | Same report. `ACL GETUSER cache-worker` still `on nopass` |
    | 3 | `auto_remediate: true`, `dry_run: false` | `cache-worker` off, `legacy -@dangerous`, `tmp-debug -keys -debug`. Verified by the second `ACL LIST`. Then in Redis: `AUTH cache-worker` gets `WRONGPASS`, `FLUSHALL` as `legacy` and `KEYS` as `tmp-debug` get `NOPERM`, and `app` still reads and writes |
    | 4 | a server where the connecting user cannot run `ACL LIST` | Fails with the `NOPERM` reply instead of reporting 0 findings |
    | 5 | a server with only a restricted `default` and a known `app` | Only the 2 findings on `default` |
    | 6 | unknown host | `errors` alert sent |

    ## Prerequisites

    - Redis 6 or later, reachable from the Docker containers the `RedisCLI` tasks start.
    - The connecting user needs `acl|list`, and `acl|setuser` for remediation.
    - For a password or a named user, add `password: "{{ secret('REDIS_PASSWORD') }}"` and `username` to each `RedisCLI` task.
    - Local testing: `docker run -d --name redis -p 6379:6379 redis:7-alpine`, then create users with `ACL SETUSER`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block. In Kestra OSS, provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `host` / `port` | `localhost` / `6379` | Redis instance |
    | `known_users` | `[app, cache-worker]` | Expected application users |
    | `admin_users` | `[ops-admin]` | Users allowed every command and key |
    | `network` | empty | Docker network for the `redis-cli` containers |
    | `auto_remediate` | `false` | Allow `ACL SETUSER` |
    | `dry_run` | `true` | Must be `false` for a change to apply |

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Import the flow and set `host`, `known_users`, `admin_users` and, if Redis runs in Docker, `network`.
    3. Run it once and read the findings.
    4. Check which clients use a flagged user, then run with `auto_remediate: true` and `dry_run: false`, and save the ACLs.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Run `ACL SAVE` after `verify_result` when your servers use an aclfile.
    - Loop over a list of hosts to audit every instance in one execution.
    - Add a rule for users with access to every Pub/Sub channel (`&*`).
    - Read `ACL LOG` to report denied commands after a fix, so a broken client is found quickly.

    ## Links

    - Redis ACL: https://redis.io/docs/latest/operate/oss_and_stack/management/security/acl/
    - Redis plugin: https://kestra.io/plugins/plugin-redis
  tags:
    - Data
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Day 2 Operations
  ee: false
  demo: false
