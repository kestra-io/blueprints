id: securityhub-findings-digest
namespace: company.security

description: |
  Turns your unread Security Hub backlog into a weekly Slack digest. The flow
  pulls active CRITICAL and HIGH findings per region, counts them by severity
  and product, and posts the top criticals with titles and affected resources.
  Regions where Security Hub isn't enabled are logged and skipped gracefully.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to pull Security Hub findings from.
  - id: top_criticals
    type: INT
    defaults: 10
    description: How many of the top CRITICAL findings to include in the digest.

tasks:
  - id: fetch_findings
    type: io.kestra.plugin.core.flow.ForEach
    description: Pull active critical/high findings region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: get_findings
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Query Security Hub for active CRITICAL and HIGH findings.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            TOP_N={{ inputs.top_criticals }}
            FILTER='{"RecordState":[{"Value":"ACTIVE","Comparison":"EQUALS"}],"SeverityLabel":[{"Value":"CRITICAL","Comparison":"EQUALS"},{"Value":"HIGH","Comparison":"EQUALS"}]}'
            echo "Pulling active CRITICAL/HIGH findings in $REGION"
            if OUT=$(aws securityhub get-findings --region "$REGION" --filters "$FILTER" --max-results 100 2>/tmp/sh_err.txt); then
              echo "$OUT" > /tmp/findings.json
              echo "HUB_ENABLED=true"
            else
              echo "Security Hub not enabled (or not permitted) in $REGION: $(head -c 200 /tmp/sh_err.txt | tr '\n' ' ')"
              echo "HUB_ENABLED=false"
              echo "HAS_FINDINGS=false"
              echo "CRITICAL_COUNT=0"
              echo "HIGH_COUNT=0"
              echo "TOTAL_COUNT=0"
              echo "TOP_PRODUCTS="
              echo "TOP_CRITICALS="
              echo "REGION_DONE=$REGION"
              exit 0
            fi
            python3 << 'EOF'
            import json
            from collections import Counter

            top_n = {{ inputs.top_criticals }}
            with open("/tmp/findings.json") as f:
                data = json.load(f)
            findings = data.get("Findings", [])
            crit = [x for x in findings if x.get("Severity", {}).get("Label") == "CRITICAL"]
            high = [x for x in findings if x.get("Severity", {}).get("Label") == "HIGH"]
            products = Counter(x.get("ProductName", "unknown") for x in findings)

            def resource_id(x):
                rs = x.get("Resources", [])
                return rs[0].get("Id", "?").split("/")[-1][:60] if rs else "?"

            tops = []
            for i, x in enumerate(crit[:top_n], 1):
                title = x.get("Title", "untitled").replace('"', "'")[:90]
                tops.append("%d. [%s] %s (%s)" % (i, x.get("ProductName", "?"), title, resource_id(x)))

            print("CRITICAL_COUNT=%d" % len(crit))
            print("HIGH_COUNT=%d" % len(high))
            print("TOTAL_COUNT=%d" % len(findings))
            print("TOP_PRODUCTS=" + ", ".join("%s=%d" % kv for kv in products.most_common(3)))
            # literal \n sequences become real newlines inside the Slack JSON payload
            print("TOP_CRITICALS=" + "\\n".join(tops))
            print("HAS_FINDINGS=" + ("true" if findings else "false"))
            print("REGION_DONE={{ taskrun.value }}")
            EOF
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"

      - id: digest
        type: io.kestra.plugin.core.flow.If
        description: Post the digest when findings exist; stay quiet otherwise.
        condition: "{{ outputs.get_findings.vars.HAS_FINDINGS == 'true' }}"
        then:
          - id: slack_digest
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":shield: *Security Hub weekly digest* — `{{ outputs.get_findings.vars.REGION_DONE }}`: *{{ outputs.get_findings.vars.CRITICAL_COUNT }}* CRITICAL, *{{ outputs.get_findings.vars.HIGH_COUNT }}* HIGH ({{ outputs.get_findings.vars.TOTAL_COUNT }} active total).\nTop products: {{ outputs.get_findings.vars.TOP_PRODUCTS }}\n*Top criticals to fix first:*\n{{ outputs.get_findings.vars.TOP_CRITICALS }}\nReview them in the Security Hub console."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "Region {{ outputs.get_findings.vars.REGION_DONE }}: no active CRITICAL/HIGH findings (Security Hub enabled: {{ outputs.get_findings.vars.HUB_ENABLED }})."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Monday at 08:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 8 * * 1"
    disabled: true

extend:
  title: Security Hub Findings Digest
  metaTitle: Weekly Security Hub Findings Digest on Slack | Kestra
  shortDescription: Pull active CRITICAL and HIGH Security Hub findings per region, count them by severity and product, and post the top criticals as a weekly Slack digest.
  metaDescription: Weekly Slack digest of active Security Hub CRITICAL and HIGH findings per region — counts by severity and product plus the top criticals to fix first.
  description: |
    Security Hub findings pile up unread: hundreds of active findings across regions, nobody sure which ones matter this week. This blueprint turns that backlog into a short weekly Slack digest — counts by severity and product, plus the top criticals with titles and affected resources, so the team knows exactly where to start.

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 08:00 UTC (shipped disabled).
    2. A ForEach loop covers each region in `aws_regions`.
    3. Per region, the flow calls `aws securityhub get-findings` filtered to `RecordState=ACTIVE` and `SeverityLabel` CRITICAL/HIGH.
    4. Findings are counted by severity and product; the top N criticals (default 10) are extracted with title, product, and affected resource.
    5. An `If` task posts the digest to Slack only when findings exist — quiet on clean weeks.
    6. Regions where Security Hub isn't enabled fail the API call gracefully: the flow logs it and moves on instead of erroring out.

    ## What you get

    - A weekly per-region digest: CRITICAL/HIGH counts, top products generating findings, and the top criticals to fix first.
    - Graceful handling of regions without Security Hub — logged and skipped, never a failed execution.
    - Silence when there's nothing to report.

    ## Who it's for

    Security engineers and platform teams drowning in unread Security Hub findings who want a prioritized weekly nudge instead of another dashboard.

    ## Why orchestrate this with Kestra

    A digest script on someone's laptop dies with the laptop. As a scheduled Kestra flow the digest arrives every Monday without fail, the region list and top-N are inputs, every run is logged, and extending it (say, auto-creating tickets for new criticals) is one more task — not a rewrite.

    ## Prerequisites

    - AWS credentials with `securityhub:GetFindings` in each audited region (Security Hub enabled there).
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the Security Hub API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the Security Hub API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the weekly digest.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions where you run Security Hub.
    3. Run manually once and review the digest, then enable the weekly schedule.

    ## How to extend

    - Diff against last week's findings and highlight only NEW criticals.
    - Route criticals to PagerDuty/Opsgenie instead of Slack for faster response.
    - Auto-suppress known-benign finding patterns via `BatchUpdateFindings` in a follow-up task.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [AWS Security Hub findings](https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-findings.html)
    - [get-findings API](https://docs.aws.amazon.com/cli/latest/reference/securityhub/get-findings.html)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
