id: timesheet-approval-escalation
namespace: company.team

description: |
  Escalates timesheets that are still waiting for manager approval before the
  payroll cutoff, so nobody loses pay because an approval was missed. A webhook
  starts an on-demand check and a disabled daily schedule stands ready as the
  fallback net; a shell step writes the week's timesheet CSV and a python step
  parses it with the csv module to count pending rows, sum the hours at risk and
  measure the days left to the cutoff day. When approvals are still open and the
  cutoff is three days away or closer, every responsible manager gets a reminder
  email and the channel gets one Slack summary; a clean file is logged as all
  approved. Each run exposes the verdict, the pending count, the offenders array
  and the days to cutoff as typed outputs.

triggers:
  - id: on_demand_check
    type: io.kestra.plugin.core.trigger.Webhook
    description: Payroll or HR posts here whenever someone wants an immediate answer on open timesheet approvals.
    key: "{{ secret('TIMESHEET_ESCALATION_WEBHOOK_KEY') }}"
  - id: pre_cutoff_daily_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled daily net that would sweep for pending approvals each morning until someone switches it on.
    cron: "0 6 * * *"
    disabled: true

inputs:
  - id: cutoff_day_of_month
    type: INT
    defaults: 25
    description: Day of the month payroll must be filed, used to measure the days left before the cutoff.
  - id: team
    type: STRING
    defaults: Field Operations
    description: Team whose timesheet file is checked, carried into the reminder subject and the Slack summary.

tasks:
  # --- 1. the timesheet file and its verdict ---
  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the CSV written by the shell step is the exact file the python step reads.
    tasks:
      - id: write_timesheets
        type: io.kestra.plugin.scripts.shell.Commands
        description: Writes timesheets.csv from a heredoc of eight rows, five approved and three pending with hours and a manager email.
        commands:
          - |
            cat > timesheets.csv <<'TIMESHEETS_EOF'
            person,hours,status,manager
            Diego Ramirez,38.5,approved,maria.chen@example.com
            Priya Natarajan,42.5,pending,maria.chen@example.com
            Tomas Weber,36.0,approved,igor.petrov@example.com
            Lena Kowalski,38.0,pending,igor.petrov@example.com
            Samuel Adeyemi,39.5,approved,sofia.marchetti@example.com
            Hana Sato,36.5,pending,sofia.marchetti@example.com
            Owen Fitzgerald,44.0,approved,maria.chen@example.com
            Mira Cohen,35.5,approved,igor.petrov@example.com
            TIMESHEETS_EOF
            wc -l timesheets.csv

      - id: parse_timesheets
        type: io.kestra.plugin.scripts.python.Script
        description: Parses the CSV with the csv module, keeps the pending rows, sums the hours at risk and counts the days from today to the next cutoff day.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          CUTOFF_DAY: "{{ inputs.cutoff_day_of_month }}"
          TEAM: "{{ inputs.team }}"
        script: |
          import calendar
          import csv
          import json
          import os
          from datetime import date

          CSV_FILE = "timesheets.csv"


          def next_cutoff(today, day):
              year, month = today.year, today.month
              day_in_month = min(day, calendar.monthrange(year, month)[1])
              candidate = date(year, month, day_in_month)
              if candidate >= today:
                  return (candidate - today).days
              month += 1
              if month > 12:
                  month = 1
                  year += 1
              day_in_month = min(day, calendar.monthrange(year, month)[1])
              candidate = date(year, month, day_in_month)
              return (candidate - today).days


          try:
              cutoff_day = int(os.environ.get("CUTOFF_DAY", "25"))
          except ValueError:
              cutoff_day = 25
          team = os.environ.get("TEAM", "Field Operations").strip() or "Field Operations"

          header = []
          rows = []
          if os.path.exists(CSV_FILE):
              with open(CSV_FILE, newline="", encoding="utf-8") as handle:
                  reader = csv.DictReader(handle)
                  header = list(reader.fieldnames or [])
                  rows = [row for row in reader]

          has_columns = all(name in header for name in ("person", "hours", "status", "manager"))

          offenders = []
          hours_at_risk = 0.0
          if has_columns:
              for row in rows:
                  if (row.get("status") or "").strip().lower() != "pending":
                      continue
                  person = (row.get("person") or "").strip()
                  if not person:
                      continue
                  try:
                      hours = round(float((row.get("hours") or "0").strip()), 2)
                  except ValueError:
                      hours = 0.0
                  hours_at_risk += hours
                  offenders.append({
                      "person": person,
                      "hours": hours,
                      "manager": (row.get("manager") or "").strip(),
                  })

          days_to_cutoff = next_cutoff(date.today(), cutoff_day)

          if not has_columns or not rows:
              verdict = "NO_DATA"
          elif not offenders:
              verdict = "ALL_APPROVED"
          elif days_to_cutoff <= 3:
              verdict = "ESCALATE"
          else:
              verdict = "MONITOR"

          print("hours at risk for " + team + " is %.2f across %d pending rows" % (hours_at_risk, len(offenders)))
          print("::" + json.dumps({"outputs": {"verdict": verdict, "pending_count": len(offenders), "offenders": offenders, "days_to_cutoff": days_to_cutoff}}, ensure_ascii=True) + "::")

  # --- 2. the cutoff gate ---
  - id: check_deadline
    type: io.kestra.plugin.core.flow.If
    description: Escalates only when approvals are still missing and the payroll cutoff is three days away or closer.
    condition: "{{ outputs.parse_timesheets.vars.pending_count > 0 and outputs.parse_timesheets.vars.days_to_cutoff <= 3 }}"
    then:
      - id: email_managers
        type: io.kestra.plugin.core.flow.Loop
        description: Walks the offenders one by one so each responsible manager is reminded about their own person.
        values: "{{ outputs.parse_timesheets.vars.offenders }}"
        concurrencyLimit: 1
        tasks:
          - id: send_reminder
            type: io.kestra.plugin.email.MailSend
            description: Reminds a single manager that a named person still has unapproved hours sitting before the payroll cutoff.
            from: "{{ secret('SMTP_FROM') }}"
            to: "{{ item.value.manager }}"
            host: "{{ secret('SMTP_HOST') }}"
            username: "{{ secret('SMTP_USERNAME') }}"
            password: "{{ secret('SMTP_PASSWORD') }}"
            port: 465
            subject: "Timesheet approval pending for {{ item.value.person }} before cutoff"
            htmlTextContent: |
              <p>{{ item.value.manager }},</p>
              <p><strong>{{ item.value.person }}</strong> still has <strong>{{ item.value.hours }}</strong> unapproved hours for {{ inputs.team }}, and the payroll cutoff is {{ outputs.parse_timesheets.vars.days_to_cutoff }} days away.</p>
              <p>Approve the timesheet before the cutoff so those hours reach this payroll run.</p>
              <p>Execution {{ execution.id }}</p>

      - id: alert_slack
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Summarizes the pending rows and the remaining days so the whole team sees the exposure at once.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "Timesheet escalation for {{ inputs.team }}. {{ outputs.parse_timesheets.vars.pending_count }} timesheets are still pending with {{ outputs.parse_timesheets.vars.days_to_cutoff }} days to the cutoff. {% for o in outputs.parse_timesheets.vars.offenders %}{{ o.person }} {{ o.hours }}h with {{ o.manager }}. {% endfor %}Execution {{ execution.id }}."}
    else:
      - id: log_all_approved
        type: io.kestra.plugin.core.log.Log
        description: Records the quiet outcome, where nothing needs chasing before the payroll cutoff.
        message: "All approved or not yet urgent for {{ inputs.team }} - verdict {{ outputs.parse_timesheets.vars.verdict }}, {{ outputs.parse_timesheets.vars.pending_count }} pending, {{ outputs.parse_timesheets.vars.days_to_cutoff }} days to the cutoff."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.parse_timesheets.vars.verdict }}"
  - id: pending_count
    type: INT
    value: "{{ outputs.parse_timesheets.vars.pending_count }}"
  - id: offenders
    type: ARRAY
    value: "{{ outputs.parse_timesheets.vars.offenders | toJson }}"
  - id: days_to_cutoff
    type: INT
    value: "{{ outputs.parse_timesheets.vars.days_to_cutoff }}"

extend:
  title: Chase timesheet approvals before the payroll cutoff
  metaTitle: Escalate Unapproved Timesheets Before Payroll Cutoff
  shortDescription: Check the team timesheet file against the payroll cutoff, email every manager with pending hours and ping Slack when the deadline is within three days.
  metaDescription: Read the team timesheet CSV, count pending approvals against the payroll cutoff, email each manager and ping Slack when three days or fewer remain.
  description: |
    Payroll cutoffs are unforgiving. A timesheet nobody approved is a paycheck that does not arrive, and the employee who loses that money is usually the last person to notice. This flow runs on demand from a webhook, or every morning once the disabled schedule is switched on, reads the team's timesheet CSV and measures every pending row against the next cutoff day. When approvals are still open and the cutoff is three days away or closer, each responsible manager receives a reminder email and the channel gets one Slack summary listing the names, hours and owners at risk; a clean file is logged as all approved instead.

    ## How it works

    1. `on_demand_check` (`io.kestra.plugin.core.trigger.Webhook`) lets payroll or HR kick off a check the moment someone asks. `pre_cutoff_daily_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * *`) sits disabled as the net to switch on for a morning sweep.
    2. `workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared directory for the fixture and for the parser that consumes it.
    3. `write_timesheets` (`io.kestra.plugin.scripts.shell.Commands`) drops `timesheets.csv` with a heredoc of eight rows, five approved and three pending, each pending row carrying its hours and the manager email.
    4. `parse_timesheets` (`io.kestra.plugin.scripts.python.Script`) reads the file with the `csv` module, keeps the pending rows, sums the hours at risk, computes `days_to_cutoff` from today's date to the next `cutoff_day_of_month`, and prints one `::{"outputs": ...}::` line carrying `verdict`, `pending_count`, `offenders` and `days_to_cutoff`.
    5. `check_deadline` (`io.kestra.plugin.core.flow.If`) escalates only when `pending_count` is above zero and `days_to_cutoff` is three or less.
    6. In the escalation branch `email_managers` (`io.kestra.plugin.core.flow.Loop`) runs `send_reminder` (`io.kestra.plugin.email.MailSend`) once per offender against that manager's address, then `alert_slack` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts the summary. The other branch records the quiet outcome with `log_all_approved` (`io.kestra.plugin.core.log.Log`).
    7. The `errors` handler pings Slack when the run itself breaks, because a silent failure looks exactly like a calm payroll week.

    ## What you get

    - `verdict` (STRING): `ESCALATE` when approvals are open and the cutoff is within three days, `MONITOR` when they are open but there is still time, `ALL_APPROVED` when nothing is pending, `NO_DATA` when the file carries no usable header.
    - `pending_count` (INT): rows still waiting on a manager, zero on a clean file.
    - `offenders` (ARRAY): one object per pending row with `person`, `hours` and `manager`, ready to loop over or store.
    - `days_to_cutoff` (INT): whole days from today to the next `cutoff_day_of_month`, zero when today is the cutoff day.
    - One email per responsible manager plus a single Slack summary when escalation fires, and a log line only when it does not.

    ## Who it's for

    - Payroll and finance teams who need every timesheet approved before the cutoff instead of after a missed paycheck.
    - Managers who want a targeted reminder naming their own people rather than a generic weekly nudge.
    - Operations leads who run several teams and want the same check pointed at each one through inputs.

    ## Why orchestrate this with Kestra

    A spreadsheet and a calendar reminder only work when somebody opens both. Kestra supplies the webhook and the disabled daily schedule, the branch that separates an urgent week from a quiet one, the loop that turns one parse into one email per manager, and SMTP and Slack routing from a single versioned file. The verdict, the pending count and the days left are typed outputs, so a dashboard or a downstream payroll flow can read the state without scraping logs, and the `errors` handler keeps a broken run visible.

    ## Prerequisites

    - A Kestra instance with the email and Slack plugins available to the worker.
    - An SMTP relay reachable from the worker, with a sender address allowed to use it.
    - A Slack incoming webhook for the escalation summary and for failure alerts.
    - The payroll cutoff day for the team, supplied through the `cutoff_day_of_month` input.

    ### Secrets

    - `TIMESHEET_ESCALATION_WEBHOOK_KEY`: key segment guarding the webhook URL, so only your payroll tool can start a check.
    - `SMTP_FROM`: sender address shown on every manager reminder.
    - `SMTP_HOST`, `SMTP_USERNAME`, `SMTP_PASSWORD`: SMTP relay and credentials used by `send_reminder`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the escalation summary and for failure alerts.

    ## Quick start

    1. Add the five secrets to your namespace and import the flow.
    2. Leave `cutoff_day_of_month` at 25, or set it to the day payroll closes for `team`.
    3. Execute the flow once against the fixture and read `verdict`, `pending_count` and `days_to_cutoff` in the outputs.
    4. Point your payroll tool at `/api/v1/{tenant}/executions/webhook/{namespace}/timesheet-approval-escalation/{TIMESHEET_ESCALATION_WEBHOOK_KEY}`, then confirm one email per pending manager and the Slack summary.

    ## How to extend

    - Replace the heredoc with a query task against your time tracking system, or with a file downloaded from storage, and keep the same python verdict.
    - Widen or narrow the warning window by editing `days_to_cutoff <= 3` in `check_deadline`, without touching the parser.
    - Group offenders by manager before the loop when one manager should get a single digest instead of one mail per person.
    - Switch on `pre_cutoff_daily_sweep` for an automatic morning check in the days leading up to cutoff.

    ## Links

    - [Email MailSend task](https://kestra.io/plugins/plugin-email/io.kestra.plugin.email.mailsend)
    - [Loop task documentation](https://kestra.io/docs/workflow-components/tasks/flow-control/loop)
    - [Kestra flow triggers](https://kestra.io/docs/concepts/triggers)
  tags:
    - Business
  subTags:
    - payroll
    - timesheets
    - notifications
    - scheduling
  ee: false
  demo: false
