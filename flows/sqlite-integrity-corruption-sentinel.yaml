id: sqlite-integrity-corruption-sentinel
namespace: company.team
description: |
  Run SQLite's own PRAGMA integrity_check against an embedded database file,
  classify the result HEALTHY or CORRUPT, and alert Slack with the exact
  list of problems SQLite's own low-level consistency check reports.

triggers:
  - id: periodic_integrity_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Checks every 6 hours - a low-level page/index consistency scan is comparatively expensive on a large file, so this does not need a tight cadence like a freshness check. Shipped disabled; enable it once sqlite_db_path points at a real database file and a manual run has been verified."
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      sqlite_db_path: "/tmp/sentinel-test.db"
      max_errors_to_report: 10

inputs:
  - id: sqlite_db_path
    type: STRING
    displayName: "SQLite Database File Path"
    defaults: "/tmp/sentinel-test.db"
    description: "Filesystem path to the SQLite database file, resolved on the Kestra worker's local filesystem or a mounted volume, used directly in the JDBC URL jdbc:sqlite:<path> by the io.kestra.plugin.jdbc.sqlite.Query task."

  - id: max_errors_to_report
    type: INT
    displayName: "Max Integrity Errors To Report"
    defaults: 10
    description: "Passed as PRAGMA integrity_check(N) - SQLite's own documentation states the check stops and returns after reporting this many problems (SQLite's own default is 100 when the argument is omitted)."

tasks:
  - id: probe_integrity_check
    type: io.kestra.plugin.jdbc.sqlite.Query
    description: "Single SQL statement (io.kestra.plugin.jdbc.sqlite.Query supports only one statement per task) running SQLite's own PRAGMA integrity_check, which per SQLite's own documentation returns a single row containing the literal value ok when the database is consistent, or one row per problem description when it is not. fetchType FETCH captures every returned row regardless of which case applies."
    url: "jdbc:sqlite:{{ inputs.sqlite_db_path }}"
    fetchType: FETCH
    sql: "PRAGMA integrity_check({{ inputs.max_errors_to_report }})"

  - id: evaluate_integrity
    type: io.kestra.plugin.core.flow.If
    description: "HEALTHY only when exactly one row was returned and its single column holds the literal string ok, per SQLite's own documented integrity_check output contract. The column itself is read positionally via jq's to_entries, since the exact label SQLite's JDBC driver assigns it is not asserted here - see Pitfalls."
    condition: "{{ outputs.probe_integrity_check.size == 1 and (outputs.probe_integrity_check.rows | first | jq('to_entries[0].value') | first) == 'ok' }}"
    then:
      - id: log_integrity_healthy
        type: io.kestra.plugin.core.log.Log
        message: "HEALTHY: PRAGMA integrity_check on {{ inputs.sqlite_db_path }} returned ok."
    else:
      - id: alert_integrity_corruption
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Always alert on CORRUPT so an on-call engineer sees the exact SQLite-reported problems without opening the file by hand."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "SQLite integrity sentinel: CORRUPT. {{ inputs.sqlite_db_path }} failed PRAGMA integrity_check with {{ outputs.probe_integrity_check.size }} reported problem(s): {{ outputs.probe_integrity_check.rows | jq('[.[] | (to_entries[0].value)] | join(\"; \")') | first }}. Execution {{ execution.id }}."
          }

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: "Final status line for every run, independent of which branch fired."
    message: "Integrity audit complete for {{ inputs.sqlite_db_path }}. rows_returned={{ outputs.probe_integrity_check.size }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert when the flow itself fails outside the handled branches, for example a missing file, an unreadable path, or a file that is not a SQLite database at all."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "SQLite integrity sentinel FAILED in execution {{ execution.id }} for {{ inputs.sqlite_db_path }}. PRAGMA integrity_check did not complete; investigate before trusting the last known HEALTHY/CORRUPT status - this includes the file simply not existing at that path."
      }

extend:
  title: "SQLite Database Integrity and Corruption Sentinel"
  shortDescription: "Run SQLite's own PRAGMA integrity_check on an embedded database file, classify it HEALTHY or CORRUPT, and alert Slack with the exact problem list."
  metaTitle: "SQLite Integrity Check and Corruption Sentinel with Kestra"
  metaDescription: "Run SQLite PRAGMA integrity_check on a schedule, classify the database HEALTHY or CORRUPT, and alert Slack with the exact errors."
  description: |
    An embedded SQLite file can go silently corrupt - a crashed write, a
    disk fault, or a killed process mid-transaction can leave pages
    malformed or index entries missing, with no server process around to
    notice or report it. This blueprint runs SQLite's own low-level
    `PRAGMA integrity_check` on a schedule, classifies the result, and
    alerts Slack with the exact problem descriptions SQLite itself reports.

    ## How it works

    1. `periodic_integrity_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 6 hours, explicitly passing `sqlite_db_path` and `max_errors_to_report` through its own `inputs:` block so the flow is self-contained when the trigger fires. Shipped disabled so a manual run can be verified first.
    2. `probe_integrity_check` (`io.kestra.plugin.jdbc.sqlite.Query`, `fetchType: FETCH`) runs `PRAGMA integrity_check(N)` against the file at `sqlite_db_path`. Per SQLite's own documentation, this returns exactly one row containing the literal value `ok` when the database is consistent, or one row per problem description (up to `N`) when it is not.
    3. `evaluate_integrity` (`io.kestra.plugin.core.flow.If`) branches on whether exactly one row came back and that row's value is `ok`.
       - `then` (HEALTHY): `log_integrity_healthy` records a clean check.
       - `else` (CORRUPT): `alert_integrity_corruption` reports every returned problem description to Slack, joined into a single message.
    4. `log_audit_complete` always runs last, printing how many rows `probe_integrity_check` returned regardless of which branch fired.
    5. The `errors` block alerts Slack separately if the flow itself fails outright - a missing file or unreadable path must not read as either HEALTHY or CORRUPT.

    ## What you get

    - A HEALTHY/CORRUPT answer sourced directly from SQLite's own low-level consistency checker, not inferred from query errors or an external agent.
    - The exact problem descriptions SQLite itself reports, delivered to Slack, instead of requiring someone to open the file with the `sqlite3` CLI by hand.
    - No database credentials to manage at all - SQLite is an embedded, fileless-auth engine, so this flow's only secret is the Slack webhook.
    - A configurable error cap (`max_errors_to_report`) so a badly corrupted file does not flood the alert with an unbounded problem list.

    ## Who it's for

    - Teams running SQLite as an embedded store in edge devices, local caches, or lightweight application backends who need an early signal of silent file corruption.
    - On-call engineers who want one Slack alert with SQLite's own problem descriptions instead of running `PRAGMA integrity_check` by hand after a crash is suspected.
    - Anyone evaluating the SQLite JDBC plugin who wants a worked example of `Query` driving a diagnostic `PRAGMA` rather than a table read or write.

    ## Why orchestrate this with Kestra

    `PRAGMA integrity_check` run by hand answers one moment in time; it does not decide a cadence, classify the result, or notify anyone - and SQLite itself has no scheduler or alerting of its own. Kestra supplies the schedule, the HEALTHY/CORRUPT classification as a first-class branch, and an execution history that shows exactly when a file degraded and what SQLite's own checker said about it.

    ## Prerequisites

    - A SQLite database file reachable on the Kestra worker's local filesystem or a mounted volume (update `sqlite_db_path`). SQLite is embedded - there is no separate database server process to reach over the network, and this flow needs no database credentials.
    - A Slack incoming webhook for alerts.

    Local testing (no database server container is needed - SQLite is embedded in the JDBC driver the Kestra worker loads directly; the command below only creates a sample file to point `sqlite_db_path` at):
    ```bash
    docker run --rm -v /tmp:/data nouchka/sqlite3 sqlite3 /data/sentinel-test.db "CREATE TABLE t(id INTEGER PRIMARY KEY, val TEXT); INSERT INTO t VALUES (1,'ok');"
    ```
    `nouchka/sqlite3` is a community (not SQLite-project-official) SQLite CLI image, used here only to create the test fixture at `/tmp/sentinel-test.db` on the host - substitute any SQLite CLI you already have. No `docker network connect` is required for this flow, since no database server container is involved; it only applies if the Kestra worker itself runs in a container that needs the host-mounted path, in which case run `docker network ls` to confirm the Kestra worker and this fixture share a visible filesystem path.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_integrity_corruption` and the `errors` block. This is the only secret this flow uses.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded - for example `SECRET_SLACK_WEBHOOK_URL=$(echo -n '<your-webhook-url>' | base64)` - and read back in flows with `{{ secret('NAME') }}`.

    ### Inputs

    - `sqlite_db_path` (STRING, default `/tmp/sentinel-test.db`): filesystem path to the SQLite file, used as `jdbc:sqlite:<path>`.
    - `max_errors_to_report` (INT, default `10`): passed as `PRAGMA integrity_check(N)`; SQLite's own default is `100` when omitted entirely.

    ### Outputs

    - `outputs.probe_integrity_check.size`: number of rows `PRAGMA integrity_check` returned - `1` on a healthy database, more on a corrupt one.
    - `outputs.probe_integrity_check.rows`: the raw row list; each row's single value is either the literal `ok` or one problem description.

    ## Quick start

    1. Create a sample database file with the command above (or point `sqlite_db_path` at any existing `.sqlite`/`.db` file).
    2. Add the `SLACK_WEBHOOK_URL` secret.
    3. Run the flow manually with the defaults and confirm `log_integrity_healthy` fires against the freshly created file.
    4. To exercise the CORRUPT path, corrupt a copy of the file directly (for example, truncate it mid-file with `truncate -s 50% sentinel-test.db`, which is destructive and should only be done on a disposable copy) and re-run to confirm `alert_integrity_corruption` reports SQLite's own problem descriptions.
    5. Enable `periodic_integrity_check` once you trust the check against your real file.

    ## How to extend

    - Swap the direct `url: jdbc:sqlite:{{ inputs.sqlite_db_path }}` connection for the plugin's own `sqliteFile` property to audit a database file that lives in Kestra internal storage (for example, one uploaded by a separate backup task) instead of the worker's local filesystem.
    - Add a `.backup` step using the same plugin ahead of the probe to snapshot the file before every check, so a CORRUPT verdict always has a last-known-good copy sitting next to it.
    - Loop over several `sqlite_db_path` values with `io.kestra.plugin.core.flow.Loop` to audit every embedded database file on a host in one run.

    ## Pitfalls

    - **The exact column label SQLite's JDBC driver assigns to the `integrity_check` result is not asserted here.** `evaluate_integrity` and the Slack payload both read each row's value positionally via `jq('to_entries[0].value')` rather than by a named key, specifically to avoid depending on an unverified column name.
    - **`io.kestra.plugin.jdbc.sqlite.Query` supports only a single SQL statement per task.** Use `io.kestra.plugin.jdbc.sqlite.Queries` instead for flows that need more than one statement per task.
    - **A missing file at `sqlite_db_path` does not read as CORRUPT.** SQLite's JDBC driver creates a new, empty (and therefore trivially "healthy") database file if none exists at that path for some connection modes, or the connection fails outright depending on URL options - either way, verify the path actually points at the file you intend to audit, since an empty new file passing `integrity_check` is not a meaningful result.
    - **This checks on-disk consistency, not application-level data correctness.** A database can pass `integrity_check` cleanly while still containing logically wrong data; this sentinel only catches the low-level corruption SQLite's own page/index/constraint scan is documented to detect.
    - **This blueprint is UNTESTED against a real corrupted SQLite file.** The `PRAGMA integrity_check` behavior and output contract are taken verbatim from SQLite's own documentation, and the `io.kestra.plugin.jdbc.sqlite.Query` properties and outputs are taken from the plugin's own source on `main` - but no Kestra engine was run to execute this flow end to end, and no genuinely corrupted file was exercised against it.

    ## Links

    - [Kestra SQLite plugin documentation](https://kestra.io/plugins/plugin-jdbc-sqlite)
    - [SQLite PRAGMA statements documentation (integrity_check)](https://sqlite.org/pragma.html)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
