id: scylladb-cdc-log-retention-and-consumer-lag-guard
namespace: company.data

inputs:
  - id: keyspace_name
    type: STRING
    description: Target ScyllaDB keyspace containing the CDC-enabled table.
    defaults: analytics

  - id: table_name
    type: STRING
    description: Target ScyllaDB table monitored for CDC retention and consumer lag.
    defaults: user_events

  - id: consumer_checkpoint_timestamp
    type: STRING
    description: Optional ISO-8601 timestamp or epoch ms of the oldest unacknowledged CDC record from the downstream consumer. If omitted, the guard retrieves the checkpoint from Kestra KV store.
    defaults: ""

  - id: critical_headroom_threshold_pct
    type: INT
    description: Percentage threshold of remaining TTL headroom below which an incident alert and emergency TTL extension fire.
    defaults: 20

  - id: emergency_extended_ttl_seconds
    type: INT
    description: TTL in seconds applied during an emergency extension to prevent CDC compaction data loss while consumers catch up. Defaults to 172800 (48 hours).
    defaults: 172800

  - id: default_safe_ttl_seconds
    type: INT
    description: Default safe TTL in seconds applied when a table has unbounded retention (TTL set to 0 or missing). Defaults to 86400 (24 hours).
    defaults: 86400

  - id: auto_remediate
    type: BOOL
    description: Whether to execute automated CQL schema alterations (extending TTL or bounding retention) when critical risk is detected.
    defaults: false

triggers:
  - id: schedule_guard
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

  - id: webhook_audit
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('CDC_HEALTH_WEBHOOK_KEY') }}"

tasks:
  - id: read_cluster_coordinator
    type: io.kestra.plugin.scylladb.Query
    description: Probe the local ScyllaDB coordinator node to verify connectivity and capture coordinator cluster time.
    connection:
      contactPoints:
        - "{{ secret('SCYLLADB_HOST') }}:{{ secret('SCYLLADB_PORT') }}"
      localDatacenter: "{{ secret('SCYLLADB_LOCAL_DATACENTER') }}"
      username: "{{ secret('SCYLLADB_USERNAME') }}"
      password: "{{ secret('SCYLLADB_PASSWORD') }}"
    cql: "SELECT cluster_name, data_center, toTimestamp(now()) AS cluster_time FROM system.local;"
    fetchType: FETCH_ONE

  - id: read_cdc_table_metadata
    type: io.kestra.plugin.scylladb.Query
    description: Query system_schema.tables to read live CDC configuration options including enabled status and TTL.
    connection:
      contactPoints:
        - "{{ secret('SCYLLADB_HOST') }}:{{ secret('SCYLLADB_PORT') }}"
      localDatacenter: "{{ secret('SCYLLADB_LOCAL_DATACENTER') }}"
      username: "{{ secret('SCYLLADB_USERNAME') }}"
      password: "{{ secret('SCYLLADB_PASSWORD') }}"
    cql: "SELECT keyspace_name, table_name, cdc FROM system_schema.tables WHERE keyspace_name = :keyspace AND table_name = :table;"
    parameters:
      keyspace: "{{ inputs.keyspace_name }}"
      table: "{{ inputs.table_name }}"
    fetchType: FETCH_ONE

  - id: read_cdc_generations
    type: io.kestra.plugin.scylladb.Query
    description: Query system_distributed.cdc_generations to inspect cluster topology stream generation history.
    connection:
      contactPoints:
        - "{{ secret('SCYLLADB_HOST') }}:{{ secret('SCYLLADB_PORT') }}"
      localDatacenter: "{{ secret('SCYLLADB_LOCAL_DATACENTER') }}"
      username: "{{ secret('SCYLLADB_USERNAME') }}"
      password: "{{ secret('SCYLLADB_PASSWORD') }}"
    cql: "SELECT time FROM system_distributed.cdc_generations;"
    fetchType: FETCH

  - id: evaluate_cdc_operational_health
    type: io.kestra.plugin.core.output.OutputValues
    description: Compute consumer lag against configured TTL window and classify CDC operational state into risk tiers.
    values:
      is_cdc_enabled: "{{ outputs.read_cdc_table_metadata.row.cdc.enabled is defined and outputs.read_cdc_table_metadata.row.cdc.enabled == 'true' }}"
      configured_ttl_seconds: "{{ (outputs.read_cdc_table_metadata.row.cdc.ttl is defined and outputs.read_cdc_table_metadata.row.cdc.ttl != '') ? (outputs.read_cdc_table_metadata.row.cdc.ttl | int) : 86400 }}"
      generation_count: "{{ outputs.read_cdc_generations.size ?? 0 }}"
      lag_seconds: >-
        {% set cluster_epoch_sec = (outputs.read_cluster_coordinator.row.cluster_time | timestamp) / 1000 %}
        {% set stored_checkpoint = kv('scylladb_cdc_checkpoint_' ~ inputs.keyspace_name ~ '_' ~ inputs.table_name, errorOnMissing=false) %}
        {% set cp = inputs.consumer_checkpoint_timestamp != '' ? inputs.consumer_checkpoint_timestamp : (stored_checkpoint ?? (cluster_epoch_sec - 1800)) %}
        {{ (cluster_epoch_sec - (cp | int)) | round(0, 'floor') }}
      remaining_headroom_seconds: >-
        {% set ttl = (outputs.read_cdc_table_metadata.row.cdc.ttl is defined and outputs.read_cdc_table_metadata.row.cdc.ttl != '') ? (outputs.read_cdc_table_metadata.row.cdc.ttl | int) : 86400 %}
        {% set cluster_epoch_sec = (outputs.read_cluster_coordinator.row.cluster_time | timestamp) / 1000 %}
        {% set stored_checkpoint = kv('scylladb_cdc_checkpoint_' ~ inputs.keyspace_name ~ '_' ~ inputs.table_name, errorOnMissing=false) %}
        {% set cp = inputs.consumer_checkpoint_timestamp != '' ? inputs.consumer_checkpoint_timestamp : (stored_checkpoint ?? (cluster_epoch_sec - 1800)) %}
        {% set lag = cluster_epoch_sec - (cp | int) %}
        {{ (ttl - lag) | round(0, 'floor') }}
      classification: >-
        {% set enabled = outputs.read_cdc_table_metadata.row.cdc.enabled is defined and outputs.read_cdc_table_metadata.row.cdc.enabled == 'true' %}
        {% set ttl = (outputs.read_cdc_table_metadata.row.cdc.ttl is defined and outputs.read_cdc_table_metadata.row.cdc.ttl != '') ? (outputs.read_cdc_table_metadata.row.cdc.ttl | int) : 86400 %}
        {% set cluster_epoch_sec = (outputs.read_cluster_coordinator.row.cluster_time | timestamp) / 1000 %}
        {% set stored_checkpoint = kv('scylladb_cdc_checkpoint_' ~ inputs.keyspace_name ~ '_' ~ inputs.table_name, errorOnMissing=false) %}
        {% set cp = inputs.consumer_checkpoint_timestamp != '' ? inputs.consumer_checkpoint_timestamp : (stored_checkpoint ?? (cluster_epoch_sec - 1800)) %}
        {% set lag = cluster_epoch_sec - (cp | int) %}
        {% set headroom = ttl - lag %}
        {% if not enabled %}
          CDC_NOT_ENABLED
        {% elseif ttl == 0 %}
          UNBOUNDED_RETENTION_DRIFT
        {% elseif headroom <= (ttl * (inputs.critical_headroom_threshold_pct / 100)) %}
          CRITICAL_LAG_RISK
        {% else %}
          HEALTHY
        {% endif %}

  - id: route_operational_action
    type: io.kestra.plugin.core.flow.Switch
    description: Branch execution based on the CDC operational health classification.
    value: "{{ outputs.evaluate_cdc_operational_health.values.classification }}"
    cases:
      CRITICAL_LAG_RISK:
        - id: log_critical_lag_warning
          type: io.kestra.plugin.core.log.Log
          message: >-
            CRITICAL CDC LAG DETECTED for {{ inputs.keyspace_name }}.{{ inputs.table_name }}!
            Consumer lag is {{ outputs.evaluate_cdc_operational_health.values.lag_seconds }}s.
            Remaining TTL headroom is {{ outputs.evaluate_cdc_operational_health.values.remaining_headroom_seconds }}s
            against configured TTL {{ outputs.evaluate_cdc_operational_health.values.configured_ttl_seconds }}s.
            Data loss is imminent if CDC compaction purges unconsumed mutations.

        - id: check_lag_auto_remediate
          type: io.kestra.plugin.core.flow.If
          description: Conditionally execute emergency TTL extension when auto-remediation is approved.
          condition: "{{ inputs.auto_remediate == true }}"
          then:
            - id: emergency_extend_cdc_ttl
              type: io.kestra.plugin.scylladb.Execute
              description: Safely increase CDC table TTL to prevent compaction from dropping unconsumed mutations.
              connection:
                contactPoints:
                  - "{{ secret('SCYLLADB_HOST') }}:{{ secret('SCYLLADB_PORT') }}"
                localDatacenter: "{{ secret('SCYLLADB_LOCAL_DATACENTER') }}"
                username: "{{ secret('SCYLLADB_USERNAME') }}"
                password: "{{ secret('SCYLLADB_PASSWORD') }}"
              cql: "ALTER TABLE {{ inputs.keyspace_name }}.{{ inputs.table_name }} WITH cdc = {'enabled': 'true', 'ttl': {{ inputs.emergency_extended_ttl_seconds }}};"

            - id: log_emergency_remediation_applied
              type: io.kestra.plugin.core.log.Log
              message: >-
                REMEDIATION APPLIED: ScyllaDB CDC TTL for {{ inputs.keyspace_name }}.{{ inputs.table_name }}
                temporarily extended to {{ inputs.emergency_extended_ttl_seconds }} seconds.

      UNBOUNDED_RETENTION_DRIFT:
        - id: log_unbounded_drift_warning
          type: io.kestra.plugin.core.log.Log
          message: >-
            UNBOUNDED CDC RETENTION DETECTED for {{ inputs.keyspace_name }}.{{ inputs.table_name }}!
            CDC log table has no TTL configured (ttl=0), which causes unbounded SSTable bloat and disk exhaustion.

        - id: check_unbounded_auto_remediate
          type: io.kestra.plugin.core.flow.If
          description: Conditionally enforce a safe default TTL ceiling when auto-remediation is approved.
          condition: "{{ inputs.auto_remediate == true }}"
          then:
            - id: enforce_safe_cdc_ttl
              type: io.kestra.plugin.scylladb.Execute
              description: Enforce bounded 24-hour retention ceiling on the CDC log table.
              connection:
                contactPoints:
                  - "{{ secret('SCYLLADB_HOST') }}:{{ secret('SCYLLADB_PORT') }}"
                localDatacenter: "{{ secret('SCYLLADB_LOCAL_DATACENTER') }}"
                username: "{{ secret('SCYLLADB_USERNAME') }}"
                password: "{{ secret('SCYLLADB_PASSWORD') }}"
              cql: "ALTER TABLE {{ inputs.keyspace_name }}.{{ inputs.table_name }} WITH cdc = {'enabled': 'true', 'ttl': {{ inputs.default_safe_ttl_seconds }}};"

            - id: log_safe_ttl_enforced
              type: io.kestra.plugin.core.log.Log
              message: >-
                REMEDIATION APPLIED: Enforced default safe CDC TTL of {{ inputs.default_safe_ttl_seconds }} seconds
                on {{ inputs.keyspace_name }}.{{ inputs.table_name }}.

      CDC_NOT_ENABLED:
        - id: log_cdc_disabled_notice
          type: io.kestra.plugin.core.log.Log
          message: >-
            CDC is not enabled on table {{ inputs.keyspace_name }}.{{ inputs.table_name }}.
            Verify schema definitions if this table is expected to publish CDC streams.

      HEALTHY:
        - id: log_healthy_telemetry
          type: io.kestra.plugin.core.log.Log
          message: >-
            ScyllaDB CDC health check PASSED for {{ inputs.keyspace_name }}.{{ inputs.table_name }}.
            Configured TTL: {{ outputs.evaluate_cdc_operational_health.values.configured_ttl_seconds }}s.
            Consumer Lag: {{ outputs.evaluate_cdc_operational_health.values.lag_seconds }}s.
            Remaining Headroom: {{ outputs.evaluate_cdc_operational_health.values.remaining_headroom_seconds }}s.
            Active Generations: {{ outputs.evaluate_cdc_operational_health.values.generation_count }}.

extend:
  title: ScyllaDB CDC Log Retention & Consumer Lag Headroom Guard
  metaTitle: ScyllaDB CDC Retention & Consumer Lag Headroom Guard | Kestra
  shortDescription: Audit ScyllaDB CDC table retention options and consumer lag headroom, classify data loss risk, and dynamically adjust TTL to prevent unconsumed mutation drops.
  metaDescription: Audit ScyllaDB CDC table retention options and consumer lag headroom, classify expiration risk, and safely extend TTL to prevent data loss.
  description: |
    ScyllaDB Change Data Capture (CDC) streams table mutations to a dedicated log table (`<keyspace>.<table>_scylla_cdc_log`) governed by a Time-To-Live (TTL) configuration. In high-throughput architectures, if downstream CDC consumers (such as Kafka Connect, Debezium, or Apache Flink) stall or lag beyond the table's configured TTL window, ScyllaDB background compaction permanently drops unconsumed records, resulting in silent data loss and replica desynchronization. Conversely, omitting a TTL or setting it to zero causes unbounded SSTable growth that can exhaust node disk capacity.

    This blueprint implements a Day 2 operations guard for ScyllaDB CDC pipelines. On a recurring schedule or event trigger, it queries the local coordinator and cluster schema catalogs via `io.kestra.plugin.scylladb.Query`, inspects active stream generations, compares consumer checkpoints against the configured TTL window, classifies operational risk into distinct tiers (`CRITICAL_LAG_RISK`, `UNBOUNDED_RETENTION_DRIFT`, `CDC_NOT_ENABLED`, or `HEALTHY`), and conditionally executes safe schema alterations via `io.kestra.plugin.scylladb.Execute` to extend retention or enforce storage bounds.

    ## How it works

    1. Trigger: A recurring schedule (`io.kestra.plugin.core.trigger.Schedule`) audits ScyllaDB CDC tables every 15 minutes, with an optional authenticated Webhook trigger (`io.kestra.plugin.core.trigger.Webhook`) for on-demand pre-maintenance checks.
    2. Coordinator probe: `read_cluster_coordinator` (`io.kestra.plugin.scylladb.Query`) queries `system.local` to verify driver connectivity, obtain the coordinator cluster time, and record datacenter topology.
    3. Metadata inspection: `read_cdc_table_metadata` (`io.kestra.plugin.scylladb.Query`) queries `system_schema.tables` with parameterized values to extract the table's live `cdc` configuration map, verifying whether CDC is enabled and reading the configured `ttl`.
    4. Generation tracking: `read_cdc_generations` (`io.kestra.plugin.scylladb.Query`) reads stream generation records from `system_distributed.cdc_generations` to ensure stream topology is valid.
    5. Headroom calculation: `evaluate_cdc_operational_health` (`io.kestra.plugin.core.output.OutputValues`) computes consumer lag by comparing the coordinator timestamp against the downstream consumer checkpoint (passed as input or retrieved from Kestra KV store), calculating remaining headroom seconds.
    6. Multi-tier classification: The flow evaluates whether remaining headroom has fallen below the critical percentage threshold (`inputs.critical_headroom_threshold_pct`), whether retention is unbounded, or whether CDC is healthy.
    7. Guarded routing: `route_operational_action` (`io.kestra.plugin.core.flow.Switch`) branches on the classification:
       - On `CRITICAL_LAG_RISK`: Logs an alert warning of imminent mutation drops. If `inputs.auto_remediate` is enabled, executes `emergency_extend_cdc_ttl` via `io.kestra.plugin.scylladb.Execute` (`ALTER TABLE ... WITH cdc = {'enabled': 'true', 'ttl': ...}`) to temporarily widen the retention window while downstream consumers catch up.
       - On `UNBOUNDED_RETENTION_DRIFT`: Logs a storage bloat warning. If `inputs.auto_remediate` is enabled, executes `enforce_safe_cdc_ttl` to apply a bounded 24-hour TTL ceiling.
       - On `CDC_NOT_ENABLED`: Emits an advisory notice that CDC is inactive on the target table.
       - On `HEALTHY`: Emits a structured telemetry audit log containing exact lag and headroom metrics.

    ## What you get

    - Automated detection of consumer lag approaching TTL boundaries before SSTable compaction permanently purges unconsumed data.
    - Safe, automated schema remediation via `ALTER TABLE` to dynamically extend retention during consumer outages.
    - Identification and remediation of unbounded CDC tables (missing or zero TTL) to prevent cluster disk exhaustion.
    - Lineage-tracked execution history showing consumer lag trends and schema change audit logs in the Kestra UI.

    ## Who it's for

    - Data Platform Engineers operating real-time CDC ingestion pipelines from ScyllaDB into Apache Kafka or event brokers.
    - Distributed Database Administrators (DBAs) responsible for ScyllaDB cluster disk capacity and SSTable compaction health.
    - Site Reliability Engineers (SREs) monitoring data synchronization SLAs and streaming consumer headroom.

    ## Why orchestrate this with Kestra

    Monitoring ScyllaDB CDC through standalone shell scripts or cron jobs leaves operational blind spots: scripts lack atomic secret masking, centralized audit histories, and reliable conditional branching. If an automated script fails while altering schema options, there is no execution retry or failure notification.

    Orchestrating this workflow with Kestra provides declarative YAML management, native connection pooling via `io.kestra.plugin.scylladb`, integrated secret handling (`{{ secret(...) }}`), and structured branch routing via `Switch` and `If`. Kestra preserves a complete historical timeline of every lag measurement and schema alteration, ensuring team visibility and compliance traceability without maintaining bespoke watcher daemons.

    ## Prerequisites

    - A running ScyllaDB cluster (version 5.0+) with Change Data Capture enabled (`cdc_mode: true` in `scylla.yaml`).
    - Network reachability from Kestra worker nodes to ScyllaDB native CQL port (default `9042`).
    - A ScyllaDB user role with `SELECT` permissions on `system_schema.tables`, `system.local`, and `system_distributed.cdc_generations`, and `ALTER` permission on the target monitored table if auto-remediation is enabled.

    ### Secrets

    - `SCYLLADB_HOST`: Hostname or IP address of a ScyllaDB node (e.g. `scylla.internal` or `localhost`).
    - `SCYLLADB_PORT`: Native CQL binary protocol port (typically `9042`).
    - `SCYLLADB_LOCAL_DATACENTER`: Local datacenter name recognized by the ScyllaDB driver (e.g. `datacenter1`).
    - `SCYLLADB_USERNAME`: Username for database authentication.
    - `SCYLLADB_PASSWORD`: Password for database authentication.
    - `CDC_HEALTH_WEBHOOK_KEY`: Secret authentication key for the inbound Webhook trigger.

    ## Quick start

    1. Start a local ScyllaDB container with experimental and CDC features enabled:
       ```bash
       docker run -d --name scylla-cdc-node -p 9042:9042 scylladb/scylla:latest --smp 1 --memory 1G --overprovisioned 1 --experimental 1
       ```
    2. Wait for the node to initialize, then create a test keyspace and CDC-enabled table using `cqlsh`:
       ```cql
       CREATE KEYSPACE IF NOT EXISTS analytics WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};
       CREATE TABLE IF NOT EXISTS analytics.user_events (
           user_id uuid,
           event_time timestamp,
           event_type text,
           payload text,
           PRIMARY KEY (user_id, event_time)
       ) WITH cdc = {'enabled': 'true', 'ttl': 86400};
       ```
    3. Configure the required secrets (`SCYLLADB_HOST`, `SCYLLADB_PORT`, `SCYLLADB_LOCAL_DATACENTER`, `SCYLLADB_USERNAME`, `SCYLLADB_PASSWORD`, `CDC_HEALTH_WEBHOOK_KEY`) in your Kestra namespace.
    4. Import this blueprint into Kestra, execute the flow with default inputs, and review the evaluated headroom in the execution logs.
    5. Enable the schedule trigger to maintain automated 15-minute operational monitoring.

    ## How to extend

    - Add alert channels: integrate `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` or PagerDuty inside the `CRITICAL_LAG_RISK` branch to immediately notify on-call engineers.
    - Downstream consumer scaling: connect an `io.kestra.plugin.kubernetes.kubectl.Patch` task in the remediation branch to automatically scale up CDC consumer pod replicas when consumer lag surges.
    - Multi-table audit: wrap the table check in an `io.kestra.plugin.core.flow.Loop` loop to scan all CDC-enabled tables across multiple keyspaces in a single audit run.

    ## Links

    - [Kestra ScyllaDB Plugin Documentation](https://kestra.io/plugins/plugin-scylladb)
    - [ScyllaDB Change Data Capture Documentation](https://docs.scylladb.com/stable/using-scylla/cdc/)
    - [ScyllaDB CQL Reference](https://docs.scylladb.com/stable/cql/)
