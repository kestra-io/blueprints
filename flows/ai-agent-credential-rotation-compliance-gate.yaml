id: ai-agent-credential-rotation-compliance-gate
namespace: company.team
description: |
  Triage every credential an AI agent holds against its rotation window and fail closed on
  anything overdue or unprovable. The flow takes a JSON inventory of agent credentials (name,
  owner, last rotated date, rotation window in days), works out the age of each credential
  against a reference date, and reports which credentials are in window, due soon, overdue,
  or malformed. Overdue credentials get a severity from how far past their window they are,
  and a credential rotated exactly at its window edge counts as overdue, due today, never as
  still in window. Malformed entries are reported as invalid without stopping the triage of
  the rest. Any overdue or invalid credential alerts Slack and fails the execution, so a stale
  agent credential cannot linger unnoticed behind a green run. The inventory carries names,
  owners, dates, and windows only, never credential values.
triggers:
  - id: weekly_credential_rotation_gate
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Weekly Monday 08:00 UTC check. Shipped disabled; enable it once credentials_json points at a real inventory export and a manual run has been verified."
    cron: "0 8 * * 1"
    disabled: true
inputs:
  - id: credentials_json
    type: STRING
    displayName: "Agent Credentials JSON"
    defaults: |
      [
        {"name": "agent-search-api", "owner": "team-search", "last_rotated": "2026-10-20", "rotation_window_days": 90},
        {"name": "agent-code-review", "owner": "team-platform", "last_rotated": "2026-08-15", "rotation_window_days": 90},
        {"name": "agent-support-triage", "owner": "team-support", "last_rotated": "2026-07-30", "rotation_window_days": 90},
        {"name": "agent-data-pipeline", "owner": "team-data", "last_rotated": "2026-07-29", "rotation_window_days": 90},
        {"name": "agent-deploy-bot", "owner": "team-release", "last_rotated": "2026-06-01", "rotation_window_days": 90},
        {"name": "agent-legacy-reporter", "owner": "team-ops", "last_rotated": "2025-12-01", "rotation_window_days": 90},
        {"name": "agent-billing-sync", "owner": "team-finance", "last_rotated": "2026-09-01", "rotation_window_days": 30},
        {"name": "agent-docs-writer", "owner": "team-docs", "last_rotated": "2026-10-01", "rotation_window_days": 60},
        {"name": "agent-missing-date", "owner": "team-search", "rotation_window_days": 90},
        {"name": "agent-bad-date", "owner": "team-platform", "last_rotated": "not-a-date", "rotation_window_days": 90},
        {"name": "agent-zero-window", "owner": "team-data", "last_rotated": "2026-10-20", "rotation_window_days": 0},
        {"name": "agent-future-date", "owner": "team-release", "last_rotated": "2027-01-15", "rotation_window_days": 90}
      ]
    description: JSON array of agent credentials. Each entry needs a name, an owner, a last_rotated date (YYYY-MM-DD or ISO 8601 datetime), and a rotation_window_days whole number greater than zero. Names, owners, dates, and windows only; never put a credential value in this input.
  - id: reference_date
    type: STRING
    displayName: "Reference Date"
    defaults: ''
    description: Date ages are measured against, as YYYY-MM-DD. Empty means today in UTC. Pin this to a fixed date to make a run reproducible, for example when verifying the bundled demo data.
  - id: due_soon_days
    type: STRING
    displayName: "Due Soon Window (Days)"
    defaults: "7"
    description: A credential still in window but due within this many days counts as DUE_SOON instead of PASS. Must be a whole number greater than zero; anything else falls back to 7.
tasks:
  - id: evaluate_credential_rotation
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Triages every credential in credentials_json against its rotation window. PASS means the age is inside the window, DUE_SOON means it is due within due_soon_days, OVERDUE means the age has reached or passed the window (an age exactly equal to the window is overdue, due today), and INVALID covers entries that cannot be triaged at all (missing name or owner, an unparseable or future last_rotated date, or a window that is not a whole number above zero). Severity for overdue credentials follows how far past the window they are: due today LOW, 1 to 30 days past MEDIUM, 31 to 90 days past HIGH, more than 90 days past CRITICAL. Emits total, pass_count, due_soon_count, overdue_count, invalid_count, verdict, gate_failed, findings, overdue_details, and invalid_details through Kestra.outputs. The verdict is FAIL when any credential is overdue or invalid, WARN when the only flags are due soon, and PASS otherwise.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      CREDENTIALS_JSON: "{{ inputs.credentials_json }}"
      REFERENCE_DATE: "{{ inputs.reference_date }}"
      DUE_SOON_DAYS: "{{ inputs.due_soon_days }}"
    script: |
      import json
      import os
      from datetime import datetime, timezone

      from kestra import Kestra


      def parse_date(value):
          if not isinstance(value, str):
              return None
          text = value.strip()
          if not text:
              return None
          if text.endswith("Z"):
              text = text[:-1] + "+00:00"
          try:
              parsed = datetime.fromisoformat(text)
          except ValueError:
              return None
          if parsed.tzinfo is not None:
              parsed = parsed.astimezone(timezone.utc)
          return parsed.date()


      def overdue_severity(overdue_days):
          if overdue_days <= 0:
              return "LOW"
          if overdue_days <= 30:
              return "MEDIUM"
          if overdue_days <= 90:
              return "HIGH"
          return "CRITICAL"


      try:
          due_soon_days = int((os.environ.get("DUE_SOON_DAYS", "7") or "7").strip())
      except ValueError:
          due_soon_days = 7
      if due_soon_days <= 0:
          due_soon_days = 7

      reference = parse_date(os.environ.get("REFERENCE_DATE", ""))
      if reference is None:
          reference = datetime.now(timezone.utc).date()

      try:
          entries = json.loads(os.environ.get("CREDENTIALS_JSON", "[]"))
      except json.JSONDecodeError:
          entries = None
      if not isinstance(entries, list):
          entries = [{
              "name": None,
              "owner": None,
              "last_rotated": None,
              "rotation_window_days": None,
              "age_days": None,
              "remaining_days": None,
              "overdue_days": None,
              "status": "INVALID",
              "severity": "UNKNOWN",
              "reason": "credentials input is not a JSON array",
          }]
          findings = entries
          Kestra.outputs({
              "total": len(findings),
              "pass_count": 0,
              "due_soon_count": 0,
              "overdue_count": 0,
              "invalid_count": 1,
              "verdict": "FAIL",
              "gate_failed": True,
              "findings": findings,
              "overdue_details": [],
              "invalid_details": findings,
          })
          raise SystemExit(0)

      findings = []
      for entry in entries:
          if not isinstance(entry, dict):
              findings.append({
                  "name": None,
                  "owner": None,
                  "last_rotated": None,
                  "rotation_window_days": None,
                  "age_days": None,
                  "remaining_days": None,
                  "overdue_days": None,
                  "status": "INVALID",
                  "severity": "UNKNOWN",
                  "reason": "entry is not a JSON object",
              })
              continue
          name = entry.get("name")
          owner = entry.get("owner")
          last_rotated_raw = entry.get("last_rotated")
          window = entry.get("rotation_window_days")
          base = {
              "name": name if isinstance(name, str) else None,
              "owner": owner if isinstance(owner, str) else None,
              "last_rotated": last_rotated_raw,
              "rotation_window_days": window,
              "age_days": None,
              "remaining_days": None,
              "overdue_days": None,
          }
          if not isinstance(name, str) or not name.strip():
              findings.append({**base, "status": "INVALID", "severity": "UNKNOWN", "reason": "missing or empty name"})
              continue
          if not isinstance(owner, str) or not owner.strip():
              findings.append({**base, "status": "INVALID", "severity": "UNKNOWN", "reason": "missing or empty owner"})
              continue
          if isinstance(window, bool) or not isinstance(window, int) or window <= 0:
              findings.append({**base, "status": "INVALID", "severity": "UNKNOWN", "reason": "rotation_window_days must be a whole number greater than zero"})
              continue
          last_rotated = parse_date(last_rotated_raw)
          if last_rotated is None:
              findings.append({**base, "status": "INVALID", "severity": "UNKNOWN", "reason": "last_rotated is missing or not a parseable date"})
              continue
          if last_rotated > reference:
              findings.append({**base, "status": "INVALID", "severity": "UNKNOWN", "reason": "last_rotated is after the reference date"})
              continue
          age_days = (reference - last_rotated).days
          if age_days < window:
              remaining = window - age_days
              if remaining <= due_soon_days:
                  findings.append({**base, "age_days": age_days, "remaining_days": remaining, "status": "DUE_SOON", "severity": "LOW", "reason": "due within the due soon window"})
              else:
                  findings.append({**base, "age_days": age_days, "remaining_days": remaining, "status": "PASS", "severity": "NONE", "reason": "inside the rotation window"})
          else:
              overdue_days = age_days - window
              findings.append({**base, "age_days": age_days, "overdue_days": overdue_days, "status": "OVERDUE", "severity": overdue_severity(overdue_days), "reason": "past the rotation window"})

      pass_count = sum(1 for f in findings if f["status"] == "PASS")
      due_soon_count = sum(1 for f in findings if f["status"] == "DUE_SOON")
      overdue_count = sum(1 for f in findings if f["status"] == "OVERDUE")
      invalid_count = sum(1 for f in findings if f["status"] == "INVALID")
      if overdue_count > 0 or invalid_count > 0:
          verdict = "FAIL"
      elif due_soon_count > 0:
          verdict = "WARN"
      else:
          verdict = "PASS"
      Kestra.outputs({
          "total": len(findings),
          "pass_count": pass_count,
          "due_soon_count": due_soon_count,
          "overdue_count": overdue_count,
          "invalid_count": invalid_count,
          "verdict": verdict,
          "gate_failed": verdict == "FAIL",
          "findings": findings,
          "overdue_details": [f for f in findings if f["status"] == "OVERDUE"],
          "invalid_details": [f for f in findings if f["status"] == "INVALID"],
      })
  - id: gate_on_rotation_verdict
    type: io.kestra.plugin.core.flow.If
    description: Alerts Slack and fails the execution when any credential is overdue or invalid. A run with only due soon credentials logs a warning, and a fully in-window run logs a clean verdict.
    condition: "{{ outputs.evaluate_credential_rotation.vars.gate_failed == true }}"
    then:
      - id: alert_security_channel
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Pages the security channel with the overdue and invalid credential counts and details, so a stale agent credential is visible immediately and never sits in an unread report.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "ALERT: agent credential rotation gate FAILED (verdict {{ outputs.evaluate_credential_rotation.vars.verdict }}, execution {{ execution.id }}). Overdue: {{ outputs.evaluate_credential_rotation.vars.overdue_count }}, invalid: {{ outputs.evaluate_credential_rotation.vars.invalid_count }}, due soon: {{ outputs.evaluate_credential_rotation.vars.due_soon_count }}, in window: {{ outputs.evaluate_credential_rotation.vars.pass_count }} out of {{ outputs.evaluate_credential_rotation.vars.total }} total. Overdue details: {{ outputs.evaluate_credential_rotation.vars.overdue_details | json }}. Invalid details: {{ outputs.evaluate_credential_rotation.vars.invalid_details | json }}. Rotate the overdue credentials and fix the invalid inventory entries before the next run."
          }
      - id: fail_on_overdue_or_invalid
        type: io.kestra.plugin.core.execution.Fail
        description: Fails the execution so an overdue or unprovable agent credential can never read as a passing compliance check.
        message: "Agent credential rotation gate failed. See the Slack alert and the overdue_details and invalid_details outputs."
    else:
      - id: warn_or_clean
        type: io.kestra.plugin.core.flow.If
        description: Logs a warning when credentials are due soon, otherwise logs a clean verdict, so a quiet run still leaves proof the sweep happened.
        condition: "{{ outputs.evaluate_credential_rotation.vars.due_soon_count > 0 }}"
        then:
          - id: log_rotation_warning
            type: io.kestra.plugin.core.log.Log
            description: Records a warning run when credentials are due soon but nothing is overdue or invalid yet.
            message: "Agent credential rotation gate verdict WARN: {{ outputs.evaluate_credential_rotation.vars.due_soon_count }} credential(s) due soon, {{ outputs.evaluate_credential_rotation.vars.pass_count }} in window, {{ outputs.evaluate_credential_rotation.vars.total }} total."
        else:
          - id: log_clean_verdict
            type: io.kestra.plugin.core.log.Log
            description: Records a clean run when every credential is inside its rotation window.
            message: "Agent credential rotation gate verdict PASS: {{ outputs.evaluate_credential_rotation.vars.total }} credential(s), all inside their rotation windows."
  - id: log_gate_complete
    type: io.kestra.plugin.core.log.Log
    description: Runs last on passing and warning runs, printing the headline counts. It does not run when the execution fails on overdue or invalid credentials, by design.
    message: "Agent credential rotation gate complete. Total: {{ outputs.evaluate_credential_rotation.vars.total }}, in window: {{ outputs.evaluate_credential_rotation.vars.pass_count }}, due soon: {{ outputs.evaluate_credential_rotation.vars.due_soon_count }}, overdue: {{ outputs.evaluate_credential_rotation.vars.overdue_count }}, invalid: {{ outputs.evaluate_credential_rotation.vars.invalid_count }}, verdict: {{ outputs.evaluate_credential_rotation.vars.verdict }}."
errors:
  - id: alert_gate_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack if the gate itself fails, so a broken check never reads as no stale credentials.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Agent credential rotation gate FAILED (flow {{ flow.id }}, execution {{ execution.id }}). The check did not complete, so stale credentials cannot be ruled out. Investigate before trusting the last verdict."
      }
extend:
  title: AI Agent Credential Rotation Compliance Gate
  metaTitle: 'AI Agent Credential Rotation Gate | Kestra'
  shortDescription: Triage every AI agent credential against its rotation window, flag overdue and stale credentials with severity, and fail closed on anything overdue or unprovable.
  metaDescription: 'Weekly compliance gate for AI agent credentials: age each credential against its rotation window, report overdue, due soon, and malformed entries with severity, and fail closed so stale credentials never linger unnoticed.'
  description: |
    ## What it does

    AI agents accumulate credentials (API keys, service accounts, tool tokens) that nobody owns on a calendar, and a credential that was rotated once at setup can sit unchanged for a year while the agent keeps working. This blueprint takes an inventory of agent credentials, each with a name, an owner, a last rotated date, and a rotation window in days, and triages every entry against its window. Credentials inside their window pass, credentials due within the due soon window are flagged before they lapse, credentials at or past their window are overdue with a severity set by how far past the window they are, and entries that cannot be triaged at all are reported as invalid without stopping the triage of the rest. A credential rotated exactly at its window edge counts as overdue, due today, never as still in window, because a window that has fully elapsed is not compliance. Any overdue or invalid credential alerts Slack with the details and fails the execution, so a stale agent credential cannot linger unnoticed behind a green run. A run with only due soon credentials warns instead of failing, and a fully in-window run passes with a logged verdict. The inventory carries names, owners, dates, and windows only, never credential values, so the gate itself cannot leak a secret.

    ## Prerequisites

    - An inventory of agent credentials as a JSON array (`credentials_json`), each entry with a name, an owner, a last_rotated date (YYYY-MM-DD or ISO 8601 datetime), and a rotation_window_days whole number greater than zero. The inventory must carry names, owners, dates, and windows only, never credential values.
    - A reference date (`reference_date`) to measure ages against, as YYYY-MM-DD. Empty means today in UTC; pin it to a fixed date to make a run reproducible, for example when verifying the bundled demo data.
    - A due soon window (`due_soon_days`, default 7): a credential still in window but due within this many days counts as DUE_SOON instead of PASS.
    - A Slack incoming webhook URL stored as the `SLACK_WEBHOOK_URL` secret for the security channel.
    - Python 3 on the Kestra worker for the Process runner, or switch the script task to a Docker task runner.

    ## How it works

    1. `weekly_credential_rotation_gate` (`io.kestra.plugin.core.trigger.Schedule`) runs the check weekly on Mondays at 08:00 UTC. It ships disabled; enable it once `credentials_json` points at a real inventory export and a manual run has been verified.
    2. `evaluate_credential_rotation` (`io.kestra.plugin.scripts.python.Script`) parses the inventory and the reference date, then triages each entry. PASS means the age is inside the window, DUE_SOON means it is due within `due_soon_days`, OVERDUE means the age has reached or passed the window, and INVALID covers a missing name or owner, an unparseable or future last rotated date, or a window that is not a whole number above zero. Overdue severity follows how far past the window the credential is: due today LOW, 1 to 30 days past MEDIUM, 31 to 90 days past HIGH, more than 90 days past CRITICAL. Malformed entries are reported as invalid and never crash the triage. It emits `total`, `pass_count`, `due_soon_count`, `overdue_count`, `invalid_count`, `verdict`, `gate_failed`, `findings`, `overdue_details`, and `invalid_details` through `Kestra.outputs`. The verdict is FAIL when any credential is overdue or invalid, WARN when the only flags are due soon, and PASS otherwise.
    3. `gate_on_rotation_verdict` (`io.kestra.plugin.core.flow.If`) branches on `gate_failed`. On the failing branch, `alert_security_channel` posts the overdue and invalid counts and details to Slack, and `fail_on_overdue_or_invalid` fails the execution so an overdue or unprovable credential can never read as a passing check. On the passing branch, `warn_or_clean` logs a warning when credentials are due soon and a clean verdict otherwise.
    4. `log_gate_complete` runs last on passing and warning runs and prints the headline counts. The `errors` block posts to Slack if the gate itself fails.
    5. The bundled demo data, measured against reference date 2026-10-27, yields 12 credentials: 3 PASS, 1 DUE_SOON, 4 OVERDUE (1 LOW for the credential rotated exactly 90 days ago and due today, 1 MEDIUM, 1 HIGH, 1 CRITICAL), and 4 INVALID, so the verdict is FAIL and a first run exercises the alert and fail path end to end.

    ## How to adapt it

    - Point `credentials_json` at a live inventory export (a vault, identity provider, or agent platform export that emits credential names, owners, last rotated dates, and rotation windows, never secret values) and keep the bundled demo data for first runs only. The entry shape stays the same, so the triage is unchanged.
    - Tune `due_soon_days` per environment (a longer window for credentials that need change approval, a shorter one for credentials that rotate automatically), and change the overdue severity bands by editing the thresholds in the script when your policy grades staleness differently.
    - Archive `findings` to a warehouse table on every run to build a rotation history for audits, instead of relying on the Slack channel as the record.
    - Add a rotation step after the alert that calls the vault or identity provider rotation API for each overdue credential, once that action has its own approval gate, so the gate goes from reporting staleness to closing it.
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
