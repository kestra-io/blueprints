id: typesense-orphaned-collection-and-memory-reclamation-guard
namespace: company.search

description: |
  Audit Typesense unaliased collections across reindexing cycles, detect abandoned collections
  leaking memory in RAM, halt behind an interactive approval gate, purge orphaned collections,
  and verify search availability on the live production alias.

inputs:
  - id: typesense_host
    type: STRING
    displayName: Typesense Hostname
    description: Hostname or IP address of the Typesense search cluster.
    defaults: "localhost"

  - id: typesense_port
    type: INT
    displayName: Typesense Port
    description: HTTP API port of the Typesense instance (default 8108).
    defaults: 8108

  - id: active_alias
    type: STRING
    displayName: Production Active Alias
    description: Production collection alias queried by user-facing applications (e.g. 'products').
    defaults: "products"

  - id: canary_query
    type: STRING
    displayName: Canary Search Query
    description: Search term executed against the production alias to verify search health during and after remediation.
    defaults: "*"

  - id: canary_query_by
    type: STRING
    displayName: Canary Query Fields
    description: Comma-separated list of document fields used for the canary search evaluation.
    defaults: "title"

  - id: grace_period_hours
    type: INT
    displayName: Staging Grace Period (Hours)
    description: Minimum age in hours a collection must reach before being considered an orphan, protecting active in-flight reindex jobs.
    defaults: 24

  - id: auto_remediate
    type: BOOL
    displayName: Auto Remediate
    description: When true and dry_run is false, prompts for approval and deletes confirmed orphaned collections.
    defaults: true

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, audits unaliased collections and logs reclamation plans without deleting collections from memory.
    defaults: true

triggers:
  - id: daily_orphan_guard
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled audit running daily at 02:00 UTC to discover and reclaim unaliased Typesense collections.
    cron: "0 2 * * *"

  - id: on_demand_orphan_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint invoked by memory capacity alarms, reindex failure hooks, or incident runbooks.
    key: "{{ secret('TYPESENSE_GUARD_WEBHOOK_KEY') }}"

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    description: Assert operational inputs satisfy threshold and connectivity requirements.
    conditions:
      - "{{ inputs.typesense_host | length > 0 }}"
      - "{{ inputs.typesense_port > 0 }}"
      - "{{ inputs.active_alias | length > 0 }}"
      - "{{ inputs.grace_period_hours >= 1 }}"
    errorMessage: "Invalid inputs. Provide a valid Typesense host, port > 0, active alias, and grace period >= 1."

  - id: load_previous_guard_state
    type: io.kestra.plugin.core.kv.Get
    description: Retrieve previous run unaliased collection audit state from Kestra KV store.
    key: "typesense_orphaned_collections_state"
    errorOnMissing: false

  - id: fetch_collections
    type: io.kestra.plugin.core.http.Request
    description: Query Typesense REST API to retrieve the current list of all registered collections and document counts.
    uri: "http://{{ inputs.typesense_host }}:{{ inputs.typesense_port }}/collections"
    method: GET
    headers:
      X-TYPESENSE-API-KEY: "{{ secret('TYPESENSE_API_KEY') }}"
      Accept: "application/json"

  - id: fetch_aliases
    type: io.kestra.plugin.core.http.Request
    description: Query Typesense REST API to retrieve all active virtual collection aliases and target mappings.
    uri: "http://{{ inputs.typesense_host }}:{{ inputs.typesense_port }}/aliases"
    method: GET
    headers:
      X-TYPESENSE-API-KEY: "{{ secret('TYPESENSE_API_KEY') }}"
      Accept: "application/json"

  - id: triage_orphaned_collections
    type: io.kestra.plugin.scripts.python.Script
    description: Correlate collections against active aliases, calculate age against grace period, and identify abandoned collections leaking RAM.
    containerImage: python:3.11-slim
    inputFiles:
      collections.json: "{{ (outputs.fetch_collections.body ?? []) | toJson }}"
      aliases.json: "{{ (outputs.fetch_aliases.body ?? {}) | toJson }}"
      previous_kv.json: "{{ (outputs.load_previous_guard_state.value ?? {}) | toJson }}"
    env:
      GRACE_PERIOD_HOURS: "{{ inputs.grace_period_hours }}"
    script: |
      import json
      import os
      import time

      try:
          from kestra import Kestra
      except ImportError:
          Kestra = None

      grace_hours = int(os.environ.get("GRACE_PERIOD_HOURS", "24"))
      grace_seconds = grace_hours * 3600
      now_epoch = int(time.time())

      with open("collections.json", "r", encoding="utf-8") as f:
          raw_cols = f.read().strip()
          collections = json.loads(raw_cols) if raw_cols else []

      with open("aliases.json", "r", encoding="utf-8") as f:
          raw_aliases = f.read().strip()
          aliases_data = json.loads(raw_aliases) if raw_aliases else {}

      with open("previous_kv.json", "r", encoding="utf-8") as f:
          raw_kv = f.read().strip()
          previous_state = json.loads(raw_kv) if raw_kv else {}

      aliases_list = aliases_data.get("aliases", [])
      aliased_collection_names = {a.get("collection_name") for a in aliases_list if isinstance(a, dict)}

      orphans = []
      staging_in_flight = []
      new_state = {}
      total_orphaned_docs = 0

      for col in collections:
          if not isinstance(col, dict):
              continue
          name = col.get("name", "")
          if not name:
              continue

          if name in aliased_collection_names:
              continue

          created_at = int(col.get("created_at") or now_epoch)
          age_seconds = now_epoch - created_at

          if age_seconds < grace_seconds:
              staging_in_flight.append({
                  "name": name,
                  "created_at": created_at,
                  "age_hours": round(age_seconds / 3600.0, 1)
              })
              continue

          num_docs = int(col.get("num_documents") or 0)
          total_orphaned_docs += num_docs

          first_seen = previous_state.get(name, {}).get("first_seen", now_epoch)
          orphans.append({
              "name": name,
              "num_documents": num_docs,
              "created_at": created_at,
              "age_hours": round(age_seconds / 3600.0, 1),
              "first_seen_unaliased": first_seen
          })
          new_state[name] = {
              "first_seen": first_seen,
              "last_scanned": now_epoch,
              "docs": num_docs
          }

      orphaned_names = [o["name"] for o in orphans]
      print(f"Scanned {len(collections)} collections. Aliased: {len(aliased_collection_names)}, In-flight staging: {len(staging_in_flight)}, Confirmed orphans: {len(orphans)} ({total_orphaned_docs} docs).")

      output_data = {
          "total_collections": len(collections),
          "aliased_count": len(aliased_collection_names),
          "staging_in_flight_count": len(staging_in_flight),
          "orphaned_count": len(orphans),
          "orphaned_names": orphaned_names,
          "orphaned_collections": orphans,
          "total_orphaned_documents": total_orphaned_docs,
          "new_state": new_state
      }

      if Kestra:
          Kestra.outputs(output_data)
      else:
          print(f"::{json.dumps({'outputs': output_data})}::")

  - id: persist_guard_state
    type: io.kestra.plugin.core.kv.Set
    description: Save current unaliased collection audit assessment into Kestra KV store for cross-run tracking.
    key: "typesense_orphaned_collections_state"
    value: "{{ outputs.triage_orphaned_collections.vars.new_state | toJson }}"

  - id: branch_on_orphaned_collections
    type: io.kestra.plugin.core.flow.If
    description: Branch based on whether confirmed orphaned collections were identified.
    condition: "{{ outputs.triage_orphaned_collections.vars.orphaned_count > 0 }}"
    then:
      - id: quarantine_orphaned_manifest
        type: io.kestra.plugin.core.kv.Set
        description: Save quarantined orphaned collections audit manifest into Kestra KV for compliance auditing.
        key: "typesense_orphaned_collections_manifest"
        value: "{{ outputs.triage_orphaned_collections.vars.orphaned_collections | toJson }}"

      - id: notify_orphaned_collections_detected
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority incident triage notification to Slack detailing unaliased collections and document counts.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {{ {
            "text": ":warning: *Typesense Orphaned Collections Identified*\n*Cluster:* `" ~ inputs.typesense_host ~ ":" ~ inputs.typesense_port ~ "`\n*Orphaned Collections:* *" ~ outputs.triage_orphaned_collections.vars.orphaned_count ~ "*\n*Leaked Document Footprint:* *" ~ outputs.triage_orphaned_collections.vars.total_orphaned_documents ~ " docs*\n*Target Collections:* `" ~ (outputs.triage_orphaned_collections.vars.orphaned_names | join(', ')) ~ "`\n*Auto-Remediate:* `" ~ inputs.auto_remediate ~ "` (Dry Run: `" ~ inputs.dry_run ~ "`)\nReview quarantined collections in execution `" ~ execution.id ~ "` before approving memory purge."
          } | toJson }}

      - id: evaluate_remediation
        type: io.kestra.plugin.core.flow.If
        description: Determine if automated memory reclamation is authorized by inputs.
        condition: "{{ inputs.auto_remediate == true }}"
        then:
          - id: check_dry_run
            type: io.kestra.plugin.core.flow.If
            description: Dispatches collection deletions when dry-run mode is disabled.
            condition: "{{ inputs.dry_run == false }}"
            then:
              - id: pause_for_reclamation_approval
                type: io.kestra.plugin.core.flow.Pause
                description: Interactive human approval gate before deleting orphaned collections from Typesense RAM. Resume to proceed with deletion or cancel to abort.

              - id: delete_orphaned_collections
                type: io.kestra.plugin.core.flow.Loop
                description: Iterate across each identified orphaned collection and dispatch DELETE request to Typesense to free RAM.
                values: "{{ outputs.triage_orphaned_collections.vars.orphaned_names }}"
                tasks:
                  - id: delete_collection
                    type: io.kestra.plugin.core.http.Request
                    description: Drop the unaliased collection from Typesense memory.
                    uri: "http://{{ inputs.typesense_host }}:{{ inputs.typesense_port }}/collections/{{ item.value }}"
                    method: DELETE
                    headers:
                      X-TYPESENSE-API-KEY: "{{ secret('TYPESENSE_API_KEY') }}"

              - id: verify_deleted_collections
                type: io.kestra.plugin.core.flow.Loop
                description: Re-query each deleted collection to assert that Typesense returns HTTP 404 Not Found confirming memory release.
                values: "{{ outputs.triage_orphaned_collections.vars.orphaned_names }}"
                tasks:
                  - id: check_collection_purged
                    type: io.kestra.plugin.core.http.Request
                    description: Check that the deleted collection no longer exists.
                    uri: "http://{{ inputs.typesense_host }}:{{ inputs.typesense_port }}/collections/{{ item.value }}"
                    method: GET
                    headers:
                      X-TYPESENSE-API-KEY: "{{ secret('TYPESENSE_API_KEY') }}"
                    options:
                      allowFailed: true

                  - id: assert_collection_absent
                    type: io.kestra.plugin.core.execution.Assert
                    description: Assert that the collection returned HTTP 404 Not Found.
                    conditions:
                      - "{{ outputs.check_collection_purged.code == 404 }}"
                    errorMessage: "Verification failed: collection {{ item.value }} still exists in Typesense with status {{ outputs.check_collection_purged.code }}."

              - id: verify_production_alias_search
                type: io.kestra.plugin.typesense.Search
                description: Execute canary search against the active production alias to prove live search traffic is operating normally with zero interruption.
                host: "{{ inputs.typesense_host }}"
                port: "{{ inputs.typesense_port }}"
                apiKey: "{{ secret('TYPESENSE_API_KEY') }}"
                collection: "{{ inputs.active_alias }}"
                query: "{{ inputs.canary_query }}"
                queryBy: "{{ inputs.canary_query_by }}"

              - id: assert_canary_search_functional
                type: io.kestra.plugin.core.execution.Assert
                description: Assert that the canary search query resolved successfully and returned non-negative total hits.
                conditions:
                  - "{{ outputs.verify_production_alias_search.totalHits >= 0 }}"
                errorMessage: "Canary search query failed on production alias {{ inputs.active_alias }}."

              - id: notify_reclamation_success
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                description: Dispatch recovery alert to Slack confirming orphaned collections were cleanly purged and production alias verified operational.
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                payload: >-
                  {{ {
                    "text": ":white_check_mark: *Typesense Orphaned Collection Reclamation Succeeded*\n*Cluster:* `" ~ inputs.typesense_host ~ ":" ~ inputs.typesense_port ~ "`\n*Purged Collections:* *" ~ outputs.triage_orphaned_collections.vars.orphaned_count ~ "*\n*Reclaimed Documents:* *" ~ outputs.triage_orphaned_collections.vars.total_orphaned_documents ~ "*\n*Verified 404 Absences:* `" ~ (outputs.triage_orphaned_collections.vars.orphaned_names | join(', ')) ~ "`\n*Canary Search Status:* Verified active (`" ~ inputs.active_alias ~ "`, hits: " ~ outputs.verify_production_alias_search.totalHits ~ ")\nTypesense RAM capacity successfully recovered."
                  } | toJson }}

            else:
              - id: log_dry_run_mode
                type: io.kestra.plugin.core.log.Log
                description: Log dry-run assessment without executing collection drops.
                message: "Dry-run mode active. Identified {{ outputs.triage_orphaned_collections.vars.orphaned_count }} orphaned collections: {{ outputs.triage_orphaned_collections.vars.orphaned_names }}. Skipping deletion."

    else:
      - id: log_collections_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log nominal status when all collections are either aliased or within staging grace window.
        message: "All {{ outputs.triage_orphaned_collections.vars.total_collections }} inspected Typesense collections are active (Aliased: {{ outputs.triage_orphaned_collections.vars.aliased_count }}, Staging: {{ outputs.triage_orphaned_collections.vars.staging_in_flight_count }}). Memory utilization is nominal."

errors:
  - id: alert_on_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Emergency alert dispatched to Slack if Typesense collection audit or reclamation flow fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {
        "text": ":rotating_light: *Flow Execution Failed*: `typesense-orphaned-collection-and-memory-reclamation-guard` (Execution: `" ~ execution.id ~ "`). Failed to complete Typesense collection audit or reclamation pass. Check cluster connectivity and credentials."
      } | toJson }}

extend:
  title: Typesense Orphaned Collection and Memory Reclamation Guard
  metaTitle: Typesense Orphaned Collection Memory Guard | Kestra
  shortDescription: Audit Typesense unaliased collections across reindexing cycles, pause for approval, delete orphaned collections, and verify search availability.
  metaDescription: Audit Typesense unaliased collections, pause for operator approval, purge orphaned collections to reclaim RAM, and verify search availability.
  description: |
    Typesense stores all collections and search indexes directly in host RAM for low-latency search execution. In production search architectures, zero-downtime reindexing workflows create versioned collections (such as `products_20261019_120000`) and atomically switch virtual aliases (`products` pointing to the newest collection). However, when migration scripts crash, reindex jobs abort midway, or post-cutover cleanup steps are omitted, deprecated collections linger unaliased in RAM indefinitely. Over time, these orphaned collections accumulate gigabytes of allocated memory, eventually causing server out-of-memory (OOM) crashes.

    This blueprint implements an automated Typesense memory reclamation sentinel and collection lifecycle guard. It queries the collection catalog and alias registry, calculates collection age against a configurable staging grace period to safeguard active in-flight builds, tracks persistence across runs in Kestra Key-Value store, pauses for operator approval behind an interactive Pause gate, safely drops confirmed orphaned collections, asserts HTTP 404 absence for purged collections, executes a canary search on the live production alias, and alerts Slack.

    ## How it works

    1. The `daily_orphan_guard` schedule trigger executes the audit daily at 02:00 UTC, while `on_demand_orphan_webhook` provides an authenticated HTTP entry point for reindex failure hooks or incident runbooks.
    2. The `validate_inputs` task (`io.kestra.plugin.core.execution.Assert`) validates connection parameters, active alias targets, and grace period constraints.
    3. The `load_previous_guard_state` task (`io.kestra.plugin.core.kv.Get`) retrieves previous scan history from Kestra KV store under key `typesense_orphaned_collections_state` to track unaliased persistence across runs.
    4. The `fetch_collections` and `fetch_aliases` tasks (`io.kestra.plugin.core.http.Request`) query the Typesense REST API to retrieve the complete inventory of collections and active virtual alias targets.
    5. The `triage_orphaned_collections` task (`io.kestra.plugin.scripts.python.Script`) correlates collections against active aliases, evaluates creation timestamps against `grace_period_hours` (default 24h) to protect active reindexing jobs, and identifies abandoned orphaned collections.
    6. The `persist_guard_state` task (`io.kestra.plugin.core.kv.Set`) updates Kestra KV store with current unaliased telemetry for trend tracking on subsequent runs.
    7. The `branch_on_orphaned_collections` task (`io.kestra.plugin.core.flow.If`) evaluates whether confirmed orphaned collections were detected:
       - Archives diagnosed orphan records into `typesense_orphaned_collections_manifest` in Kestra KV.
       - Dispatches an incident alert to Slack detailing collection names, document counts, and estimated memory footprint.
       - When `auto_remediate` is enabled and `dry_run` is false, triggers the interactive `pause_for_reclamation_approval` gate (`io.kestra.plugin.core.flow.Pause`) requiring operator confirmation.
       - Upon approval, the `delete_orphaned_collections` loop (`io.kestra.plugin.core.flow.Loop`) iterates across target names and dispatches `DELETE /collections/{name}` requests to Typesense to immediately release memory back to the host.
       - The `verify_deleted_collections` loop re-queries each deleted collection to assert that Typesense returns HTTP 404 (Not Found).
       - The `verify_production_alias_search` task (`io.kestra.plugin.typesense.Search`) executes a canary search query against `active_alias` to verify live user-facing queries remain fully operational.
       - Posts a confirmation alert to Slack upon successful verification.
    8. An `errors` handler catches unexpected execution errors and pages on-call engineers via Slack.

    ## What you get

    - Automated discovery and triage of Typesense collections orphaned after blue-green reindex cutovers.
    - Staging protection safeguards ensuring active in-flight reindex jobs are never touched during their grace window.
    - Interactive human-in-the-loop approval gate before executing irreversible collection drops.
    - Native HTTP deletion freeing allocated RAM immediately without requiring Typesense service restarts.
    - Two-tier post-remediation verification asserting HTTP 404 deletion status and executing live canary search tests on the production alias.
    - Quarantined audit trail preserved in Kestra KV for compliance and capacity tracking.
    - Context-rich Slack notifications with collection names, document counts, and search latency metrics.

    ## Who it's for

    - Platform Engineers and SREs maintaining self-hosted or cloud Typesense search clusters.
    - E-commerce and Catalog Engineers orchestrating daily full-catalog reindexes and alias cutovers.
    - FinOps and Infrastructure Teams monitoring RAM capacity and memory growth on search node fleets.

    ## Why orchestrate this with Kestra

    Because Typesense stores entire indexes in RAM, memory leaks from orphaned collections directly impact search latency and cluster stability. A blind cleanup script risks deleting a staging collection while an active reindex is writing to it. Kestra solves this by correlating alias pointers, enforcing temporal grace periods across atomic KV storage, gating destructive drops behind interactive Pause approval gates, and proving live query health via native canary searches before declaring success.

    ## Prerequisites

    - Reachable Typesense instance (version 0.25.x, 26.x, 27.x, or newer).
    - Network connectivity from Kestra workers to the Typesense HTTP port (default 8108).
    - Administrative API key with permissions to read/delete collections and query aliases.
    - Slack Incoming Webhook URL configured for incident triage notifications.

    ### Secrets

    - `TYPESENSE_API_KEY`: Administrative API key for authenticating to Typesense REST endpoints and search tasks.
    - `TYPESENSE_GUARD_WEBHOOK_KEY`: Secret authentication key for the on-demand webhook trigger.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for operational notifications and alerts.

    ## Quick start

    1. Configure `TYPESENSE_API_KEY`, `TYPESENSE_GUARD_WEBHOOK_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Run an initial manual execution with default parameters (`dry_run: true`) to audit current collections and inspect detected orphans without deleting collections.
    3. Review the execution logs, Slack triage notification, and Kestra KV store entries under `typesense_orphaned_collections_state`.
    4. Run with `auto_remediate: true` and `dry_run: false`. When orphans are identified, review the collection names and approve the `pause_for_reclamation_approval` gate in the Kestra UI.
    5. Enable the `daily_orphan_guard` schedule trigger to maintain continuous automated search memory reclamation.

    ## How to extend

    - Add multi-alias support to audit multiple distinct search indexes (e.g., `products`, `articles`, `categories`) in a single run.
    - Integrate memory consumption telemetry from Typesense `/stats` to calculate exact megabytes reclaimed per purged collection.
    - Connect PagerDuty or Opsgenie alerts if total orphaned documents exceed critical memory saturation thresholds.
    - Route quarantined collection manifests to Amazon S3 or Google Cloud Storage for permanent regulatory audit logging.

    ## Links

    - [Typesense Collection Aliases Documentation](https://typesense.org/docs/latest/api/collection-alias.html)
    - [Typesense Collections API Reference](https://typesense.org/docs/latest/api/collections.html)
    - [Kestra Typesense Plugin Documentation](https://kestra.io/plugins/plugin-typesense)
    - [Kestra Key-Value Store Documentation](https://kestra.io/docs/concepts/kv-store)
    - [Kestra Pause Flow Documentation](https://kestra.io/plugins/core/flow/pause)

  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Approval Gates
  ee: false
  demo: false
