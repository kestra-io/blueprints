id: iot-edge-digital-twin-reactor
namespace: company.team

description: |
  Maintain a per-device digital twin from realtime MQTT telemetry: merge each
  message into a Redis-backed shadow document, detect drift between desired and
  reported state, and publish a reconcile command back to the device only when
  the reported state actually changes - so steady-state drift never spams the
  command topic.

triggers:
  - id: telemetry_stream
    type: io.kestra.plugin.mqtt.RealtimeTrigger
    description: One execution per telemetry message on any device, with no polling delay.
    server: "{{ secret('MQTT_SERVER') }}"
    clientId: kestra-digital-twin
    topic: "devices/+/telemetry"
    serdeType: JSON
    qos: 1
    disabled: true

inputs:
  - id: desired_state
    type: JSON
    displayName: Desired state
    description: Source of truth for what every device should report back.
    defaults: |
      {"power": "on", "mode": "auto", "report_interval_s": 60}

tasks:
  - id: log_telemetry
    type: io.kestra.plugin.core.log.Log
    description: Record the incoming telemetry in the execution logs for the audit trail.
    message: "Twin telemetry {{ trigger.topic }} device={{ trigger.payload.device_id }}"

  - id: read_twin
    type: io.kestra.plugin.redis.string.Get
    description: Load the current shadow document for this device, if one exists.
    url: "{{ secret('REDIS_URL') }}"
    key: "twin:{{ trigger.payload.device_id }}"
    failedOnMissing: false

  - id: compute_delta
    type: io.kestra.plugin.scripts.python.Script
    description: Merge telemetry into the shadow, diff reported against desired, and build the reconcile command.
    env:
      TELEMETRY: "{{ trigger.payload | toJson }}"
      PRIOR_TWIN: "{{ outputs.read_twin.value | default('{}') }}"
      DESIRED: "{{ inputs.desired_state | toJson }}"
      TOPIC: "{{ trigger.topic }}"
      EXECUTION_ID: "{{ execution.id }}"
    script: |
      import json
      import os
      from datetime import datetime, timezone

      def load(raw, fallback):
          try:
              value = json.loads(raw or "")
              return value if isinstance(value, dict) else fallback
          except Exception:
              return fallback

      telemetry = load(os.environ.get("TELEMETRY"), {})
      prior = load(os.environ.get("PRIOR_TWIN"), {})
      desired = load(os.environ.get("DESIRED"), {})

      topic = os.environ.get("TOPIC") or "unknown"
      parts = topic.split("/")
      topic_device = parts[1] if len(parts) >= 2 and parts[0] == "devices" else topic
      device_id = str(telemetry.get("device_id") or topic_device)
      is_new = not bool(prior)
      previous_reported = prior.get("reported") if isinstance(prior.get("reported"), dict) else {}
      reported = {k: v for k, v in telemetry.items() if k != "device_id"}
      changed = reported != previous_reported

      drift = []
      for field in sorted(desired):
          want = desired[field]
          have = reported.get(field)
          if have != want:
              drift.append({"field": field, "desired": want, "reported": have})
      drift_set = {row["field"]: row["desired"] for row in drift}

      now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
      twin = {
          "device_id": device_id,
          "last_seen": now,
          "previous_seen": prior.get("last_seen"),
          "reported": reported,
          "desired": desired,
          "drift_fields": [row["field"] for row in drift],
          "in_sync": not drift,
      }

      command_doc = {
          "action": "reconcile",
          "device_id": device_id,
          "set": drift_set,
          "reason": "digital-twin-drift",
          "execution_id": os.environ.get("EXECUTION_ID", ""),
          "issued_at": now,
      }

      print(
          "device {} changed={} new={} drift={}".format(
              device_id, changed, is_new, ",".join(row["field"] for row in drift) or "none"
          )
      )
      print(
          "::"
          + json.dumps(
              {
                  "outputs": {
                      "device_id": device_id,
                      "twin": twin,
                      "reported": reported,
                      "drift": drift,
                      "drift_set": drift_set,
                      "command_doc": command_doc,
                      "changed": changed,
                      "is_new": is_new,
                      "in_sync": not drift,
                      "reconcile_planned": (changed or is_new) and bool(drift) and bool(reported),
                  }
              }
          )
          + "::"
      )

  - id: write_twin
    type: io.kestra.plugin.redis.string.Set
    description: Persist the updated shadow so the next message has a baseline.
    url: "{{ secret('REDIS_URL') }}"
    key: "twin:{{ trigger.payload.device_id }}"
    value: "{{ outputs.compute_delta.vars.twin | toJson }}"

  - id: change_gate
    type: io.kestra.plugin.core.flow.If
    description: React only when reported state changed or the device is brand new - steady telemetry never spams commands.
    condition: "{{ outputs.compute_delta.vars.changed or outputs.compute_delta.vars.is_new }}"
    then:
      - id: drift_gate
        type: io.kestra.plugin.core.flow.If
        description: Publish a reconcile command only when reported state is present, newly changed, and misses the desired state.
        condition: "{{ outputs.compute_delta.vars.reconcile_planned }}"
        then:
          - id: publish_reconcile
            type: io.kestra.plugin.mqtt.Publish
            description: Send the reconcile command to the device command topic with QoS 1.
            server: "{{ secret('MQTT_SERVER') }}"
            clientId: kestra-twin-reconciler
            topic: "devices/{{ trigger.payload.device_id }}/commands"
            serdeType: JSON
            qos: 1
            from:
              action: "reconcile"
              device_id: "{{ trigger.payload.device_id }}"
              set: "{{ outputs.compute_delta.vars.drift_set | toJson }}"
              reason: "digital-twin-drift"
              execution_id: "{{ execution.id }}"

          - id: notify_drift
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Post the drift details and the command that was sent.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":satellite: *Digital twin drift* for {{ outputs.compute_delta.vars.device_id }}\n{% for row in outputs.compute_delta.vars.drift %}• {{ row.field }}: reported {{ row.reported }} != desired {{ row.desired }}\n{% endfor %}Reconcile command published to devices/{{ outputs.compute_delta.vars.device_id }}/commands."
              }

        else:
          - id: log_in_sync
            type: io.kestra.plugin.core.log.Log
            description: State changed but already matches desired - nothing to send.
            message: "Twin for {{ outputs.compute_delta.vars.device_id }} changed but is in sync - no reconcile command needed."

    else:
      - id: log_unchanged
        type: io.kestra.plugin.core.log.Log
        description: Identical telemetry - shadow baseline kept, no downstream work.
        message: "No reported-state change for {{ outputs.compute_delta.vars.device_id }} - twin refreshed silently."

outputs:
  - id: device_id
    type: STRING
    description: Device the telemetry came from.
    value: "{{ outputs.compute_delta.vars.device_id }}"

  - id: twin
    type: JSON
    description: The updated shadow document persisted in Redis.
    value: "{{ outputs.compute_delta.vars.twin }}"

  - id: drift
    type: JSON
    description: Fields where reported state misses the desired state.
    value: "{{ outputs.compute_delta.vars.drift }}"

  - id: reconcile_published
    type: STRING
    description: Whether a reconcile command was sent for this message.
    value: "{{ outputs.compute_delta.vars.reconcile_planned ? 'yes' : 'no' }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when twin handling itself fails so shadow updates never fail silently.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":rotating_light: *iot-edge-digital-twin-reactor* failed for device {{ trigger.payload.device_id | default('unknown') }} in flow {{ flow.id }} (execution {{ execution.id }}) - check the execution logs."
      }

extend:
  title: IoT Edge Digital Twin with Drift Reconciliation
  metaTitle: IoT Digital Twin Drift Reconciler
  metaDescription: Realtime MQTT telemetry updates a Redis-backed digital twin, detects desired-vs-reported drift, and publishes reconcile commands only when state changes.
  shortDescription: Redis-backed digital twin fed by realtime MQTT telemetry with drift detection and reconcile commands.
  description: |
    ## How it works
    1. `telemetry_stream` (`io.kestra.plugin.mqtt.RealtimeTrigger`, shipped disabled) holds a live subscription on `devices/+/telemetry` and starts one execution per message, parsing JSON payloads so fields arrive as `{{ trigger.payload.* }}`.
    2. `read_twin` (`io.kestra.plugin.redis.string.Get`, `failedOnMissing: false`) loads the current shadow document from `twin:<device_id>`; a missing key simply means a new device.
    3. `compute_delta` (`scripts.python.Script`, Process runner) merges the message into the shadow: strips `device_id` into identity, diffs the reported map against the previous baseline to decide `changed`, diffs reported against the `desired_state` input field-by-field (sorted, so drift lists are deterministic), and builds both the persisted twin (`last_seen`, `drift_fields`, `in_sync`) and a ready-to-send reconcile command document. Everything returns through Kestra's `::json::` outputs protocol.
    4. `write_twin` (`io.kestra.plugin.redis.string.Set`) always persists the refreshed shadow so the next message has a baseline, even when nothing downstream happens.
    5. `change_gate` (`core.flow.If`) fires only on `changed or is_new` - identical telemetry updates `last_seen` silently instead of spamming the command topic. Inside it, `drift_gate` branches on `reconcile_planned` (present report AND new change AND missing desired fields): drift publishes `io.kestra.plugin.mqtt.Publish` to `devices/<id>/commands` with QoS 1 (flat JSON command shape from `mqtt-command-dispatch`) plus a Slack detail message; in-sync changes just log.
    6. Outputs expose `device_id`, the full `twin`, `drift`, and whether a reconcile was published; `errors` posts failures to Slack with the device id.

    ## What you get
    - A queryable last-known state per device in Redis, refreshed by every telemetry message.
    - Field-level drift detection between desired configuration and what devices actually report.
    - Idempotent reconciliation: steady-state drift publishes once, then stays quiet until state changes again.
    - Per-message execution history - every twin update and reconcile command is auditable.

    ## Who it's for
    IoT platform teams maintaining shadow/ghost state for fleets, ops teams who want configuration drift caught automatically, and anyone replacing a bespoke MQTT-to-Redis bridge daemon.

    ## Why orchestrate this with Kestra
    A consumer loop that writes Redis and fires commands works until it silently dies or double-publishes under load. Kestra supervises the subscription, gives every message an execution with logs and retries, and turns the twin update plus reconciliation into one reviewable graph where adding a Slack digest, a ticket, or an anomaly check is a task away - not another daemon to babysit.

    ## Prerequisites
    - An MQTT broker with devices publishing JSON telemetry to `devices/<device_id>/telemetry`, e.g. `{"device_id": "dev-001", "power": "off", "mode": "manual", "report_interval_s": 60, "temp_c": 41.2}`.
    - A Redis instance for shadow documents.
    - The `desired_state` input adjusted to the fields your devices report.

    ### Secrets
    - `MQTT_SERVER`: broker URI, e.g. tcp://broker.example.com:1883.
    - `REDIS_URL`: Redis connection URL, e.g. redis://redis:6379/0.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for drift alerts.

    ## Quick start
    1. Add the three secrets to your Kestra namespace.
    2. Set `disabled: false` on `telemetry_stream` and save the flow.
    3. Publish telemetry that violates `desired_state`, e.g. `mosquitto_pub -t devices/dev-001/telemetry -m '{"device_id": "dev-001", "power": "off", "mode": "manual", "report_interval_s": 60}'`.
    4. Watch the execution: `drift` lists `power`, `mode` and `report_interval_s`, a reconcile command lands on `devices/dev-001/commands`, and Redis holds the shadow at `twin:dev-001`.
    5. Republish the same payload - the second execution logs `unchanged` and sends nothing.

    ## How to extend
    - Add an anomaly branch inside `change_gate` for out-of-range telemetry (for example `temp_c > 80`) that pages on-call alongside reconciliation.
    - Age out stale twins with a scheduled flow that scans `twin:*` keys and alerts when `last_seen` is old.
    - Replace Redis with a dedicated device-shadow service by swapping the two `redis.string` tasks.
    - Push desired-state changes from a config flow: publish to `devices/<id>/config` and let this flow confirm convergence.

    ## Links
    - [MQTT plugin documentation](https://kestra.io/plugins/plugin-mqtt)
    - [Redis plugin documentation](https://kestra.io/plugins/plugin-redis)
    - Related Kestra blueprints: `mqtt-realtime-alarm-reactor`, `mqtt-command-dispatch`, `mqtt-telemetry-batch-collector`

    - This blueprint has been created by [RudraMalvankar](https://github.com/RudraMalvankar)
  ee: false
  demo: false
  tags:
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - Realtime Events
