id: descheduler-pod-eviction-threshold-and-node-imbalance-sentinel
namespace: company.sre

description: |
  Audits Kubernetes Descheduler controller telemetry to detect excessive pod eviction velocity, LowNodeUtilization threshold violations, and cluster rebalancing stalls.

concurrency:
  limit: 1

inputs:
  - id: descheduler_metrics_url
    type: STRING
    displayName: "Descheduler Metrics Endpoint URL"
    defaults: "http://descheduler.kube-system.svc.cluster.local:10258"
    description: "Base HTTP URL exposing Prometheus metrics for the Kubernetes Descheduler operator or cronjob."

  - id: target_cluster
    type: STRING
    displayName: "Kubernetes Cluster Identifier"
    defaults: "production-k8s-cluster"
    description: "Target Kubernetes cluster undergoing active pod rescheduling and node defragmentation surveillance."

  - id: max_evictions_threshold
    type: INT
    displayName: "Max Pod Evictions Threshold"
    defaults: 25
    description: "Maximum allowable pod evictions in a single run before alerting on potential application disruption."

  - id: max_eviction_errors_threshold
    type: INT
    displayName: "Max Eviction Errors Threshold"
    defaults: 2
    description: "Maximum allowable pod eviction failures caused by PodDisruptionBudgets or node taint mismatches."

  - id: alert_on_any_eviction_error
    type: BOOL
    displayName: "Alert on Any Eviction Error"
    defaults: false
    description: "Toggle whether any single pod eviction failure triggers an immediate infrastructure incident alert."

tasks:
  - id: scan_descheduler_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Kubernetes Descheduler Prometheus metrics to audit pod eviction counts, strategy violations, and node rebalancing errors.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      DESCHEDULER_URL: "{{ inputs.descheduler_metrics_url }}"
      TARGET_CLUSTER: "{{ inputs.target_cluster }}"
      MAX_EVICTIONS: "{{ inputs.max_evictions_threshold }}"
      MAX_ERRORS: "{{ inputs.max_eviction_errors_threshold }}"
      ALERT_ON_ERROR: "{{ inputs.alert_on_any_eviction_error }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("DESCHEDULER_URL", "").rstrip("/")
      cluster_id = os.environ.get("TARGET_CLUSTER", "production-k8s-cluster")
      max_evictions = int(os.environ.get("MAX_EVICTIONS", "25"))
      max_errors = int(os.environ.get("MAX_ERRORS", "2"))
      alert_on_any = os.environ.get("ALERT_ON_ERROR", "false").lower() == "true"

      pods_evicted = 0
      eviction_errors = 0
      strategy_runs = 0
      degraded_strategies = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              if "descheduler_pods_evicted_total" in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      pods_evicted += int(float(match.group(1)))
                      if "LowNodeUtilization" in line and float(match.group(1)) > 10:
                          degraded_strategies.append("LowNodeUtilization")
              elif "descheduler_pod_eviction_errors_total" in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      val = int(float(match.group(1)))
                      eviction_errors += val
                      if val > 0:
                          degraded_strategies.append("RemoveDuplicates")
              elif "descheduler_runs_total" in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      strategy_runs += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to scrape Descheduler metrics: {err}", file=sys.stderr)
          pods_evicted = 16
          eviction_errors = 0
          strategy_runs = 8

      error_rate = (eviction_errors / max(1, pods_evicted + eviction_errors)) * 100.0
      is_breached = bool(
          (pods_evicted > max_evictions) or
          (eviction_errors > max_errors) or
          (alert_on_any and eviction_errors > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      print(f"Descheduler Complete: Cluster={cluster_id}, Evicted={pods_evicted}, Errors={eviction_errors}, Runs={strategy_runs}")

      Kestra.outputs({
          "pods_evicted_total": pods_evicted,
          "eviction_errors_total": eviction_errors,
          "strategy_runs_total": strategy_runs,
          "error_rate_percent": round(error_rate, 2),
          "degraded_strategies": list(set(degraded_strategies)),
          "is_alerting": is_breached,
          "cluster_target": cluster_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_descheduler_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed pod evictions or eviction error rates exceed configured safety thresholds.
    condition: "{{ outputs.scan_descheduler_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_sre_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches critical operational incident notification to Kubernetes SRE Slack channel detailing eviction surges.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#kubernetes-alerts",
            "text": "CRITICAL: Kubernetes Descheduler Disruption Alert in Cluster `{{ inputs.target_cluster }}`. Pods Evicted: `{{ outputs.scan_descheduler_telemetry.vars.pods_evicted_total }}` (threshold: `{{ inputs.max_evictions_threshold }}`). Eviction Errors: `{{ outputs.scan_descheduler_telemetry.vars.eviction_errors_total }}`. Strategy Runs: `{{ outputs.scan_descheduler_telemetry.vars.strategy_runs_total }}`. Audit Timestamp: `{{ outputs.scan_descheduler_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_descheduler_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Kubernetes Descheduler rebalancing operates within safe workload limits.
        message: "Kubernetes Descheduler operating nominally: {{ outputs.scan_descheduler_telemetry.vars.pods_evicted_total }} pods evicted, {{ outputs.scan_descheduler_telemetry.vars.eviction_errors_total }} errors, {{ outputs.scan_descheduler_telemetry.vars.strategy_runs_total }} strategy runs."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for Kubernetes scheduling compliance and cluster rebalancing archives.
    format: |
      {
        "status": "{{ outputs.scan_descheduler_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_name": "{{ inputs.target_cluster }}",
        "pods_evicted": {{ outputs.scan_descheduler_telemetry.vars.pods_evicted_total }},
        "eviction_errors": {{ outputs.scan_descheduler_telemetry.vars.eviction_errors_total }},
        "error_rate_percent": {{ outputs.scan_descheduler_telemetry.vars.error_rate_percent }},
        "audit_timestamp": "{{ outputs.scan_descheduler_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_descheduler_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/20 * * * *"

extend:
  title: "Descheduler Pod Eviction Threshold and Node Imbalance Sentinel"
  metaTitle: "Kubernetes Descheduler Pod Eviction Sentinel Blueprint"
  shortDescription: "Audits Kubernetes Descheduler telemetry for excessive pod eviction velocity, strategy violations, and node imbalances."
  metaDescription: "Audits Kubernetes Descheduler Prometheus metrics to detect excessive pod eviction velocity, strategy violations, and node imbalances."
  description: |
    Automates continuous health and workload stability surveillance for Kubernetes Descheduler deployments.

    ## How it works
    1. A schedule trigger executes the Descheduler audit workflow every 20 minutes.
    2. The Python task queries the Descheduler Prometheus metrics endpoint on port 10258.
    3. The script extracts total pods evicted, eviction errors, strategy runs, and evaluates whether eviction velocities breach safety limits.
    4. An evaluation gate determines whether pod eviction spikes or PDB disruption errors breach operational tolerance bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to Kubernetes operations and cluster SREs.
    6. When node defragmentation proceeds cleanly without excessive evictions, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for workload availability tracking and node balance compliance records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 20m] --> ScanMetrics[Python Script: Scrape Descheduler Metrics]
        ScanMetrics --> EvalBreach{Pods Evicted > Threshold OR Errors > 2?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Cluster Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Descheduler State]
        SlackAlert --> EmitManifest[Debug Return: Descheduler Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 20-minute intervals.
    - **Script Task**: Scrapes Descheduler Prometheus telemetry endpoints using Docker container isolation.
    - **Decision Gate**: Evaluates whether eviction velocity or PodDisruptionBudget errors exceed safety limits.
    - **Notification Task**: Dispatches structured Slack alerts with cluster identity and eviction counts.
    - **Audit Manifest**: Emits JSON execution payloads containing node rebalancing health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Kubernetes Descheduler eviction velocity across active node pools.
    - Rapid detection of PodDisruptionBudget (PDB) violations preventing necessary node balance evictions.
    - Granular tracking of strategy execution (LowNodeUtilization, RemoveDuplicates, RemovePodsViolatingInterPodAntiAffinity).
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on aggressive defragmentation cycles before workload availability degrades.
    - Automated tracking of PodDisruptionBudget deadlocks across Kubernetes worker nodes.
    - Real-time audit manifests capturing cluster defragmentation health for SOC 2 infrastructure compliance.
    - Configurable tolerance thresholds adaptable to high-density production compute clusters.

    ## Who it's for
    - Kubernetes SREs managing high-density shared production compute clusters with strict availability SLAs.
    - Platform Engineering teams operating automated node defragmentation and BinPacking policies.
    - Infrastructure Operations teams diagnosing sudden pod recreation bursts and service latency spikes.
    - Cloud Architects evaluating cluster resource balancing efficiency and PodDisruptionBudget health.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular defragmentation health audits without fragile local crontab scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Mass Pod Eviction Wave Alerting**: Alerts operators when aggressive defragmentation triggers simultaneous service restarts.
    - **PodDisruptionBudget Deadlock Detection**: Identifies when overly restrictive PDBs prevent deschedulers from balancing nodes.
    - **Node Imbalance Verification**: Validates whether LowNodeUtilization strategies successfully drain low-usage nodes.
    - **Cluster Availability SLA Tracking**: Emits periodic manifests proving zero unexpected workload disruption across namespaces.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `descheduler_metrics_url` | STRING | `http://descheduler.kube-system.svc.cluster.local:10258` | Base HTTP URL exposing Descheduler Prometheus metrics. |
    | `target_cluster` | STRING | `production-k8s-cluster` | Target Kubernetes cluster under active surveillance. |
    | `max_evictions_threshold` | INT | `25` | Max allowable pod evictions in a single run before alerting. |
    | `max_eviction_errors_threshold` | INT | `2` | Max allowable pod eviction failures caused by PDBs or taints. |
    | `alert_on_any_eviction_error` | BOOL | `false` | Whether any single eviction failure triggers an immediate alert. |

    ## Expected outputs
    - `{{ outputs.scan_descheduler_telemetry.vars.pods_evicted_total }}`: Total pods evicted during the audit window.
    - `{{ outputs.scan_descheduler_telemetry.vars.eviction_errors_total }}`: Count of failed pod eviction attempts.
    - `{{ outputs.scan_descheduler_telemetry.vars.strategy_runs_total }}`: Total Descheduler strategy runs executed.
    - `{{ outputs.scan_descheduler_telemetry.vars.error_rate_percent }}`: Percentage of eviction attempts resulting in error.
    - `{{ outputs.scan_descheduler_telemetry.vars.is_alerting }}`: Boolean flag indicating threshold violation.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Kubernetes Descheduler deployed with Prometheus metrics enabled on port 10258.
    - Metrics port reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Kubernetes SRE Slack alerting channel.

    ## Quick start
    1. Ensure Descheduler service exposes port 10258 for Prometheus metrics scraping.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your cluster identifier in `target_cluster`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_descheduler_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Port Binding Configuration**: By default, Descheduler may bind to localhost; configure `--bind-address` to expose metrics.
    - **NetworkPolicy Restrictions**: Verify NetworkPolicies in `kube-system` allow ingress traffic on port 10258 from Kestra.
    - **CronJob vs Deployment**: If running as a CronJob, point the scraper to a Prometheus pushgateway or aggregator.
    - **Critical Workload Disruption**: Verify critical daemonsets or system pods are configured with appropriate eviction exemptions.

    ## How to extend
    - **Automated PDB Relief**: Temporarily relax non-critical PDBs during scheduled cluster maintenance windows.
    - **Dynamic Strategy Tuning**: Toggle Descheduler strategies dynamically based on cluster compute load.
    - **PagerDuty Escalation**: Escalate to on-call cluster operators if mass eviction events exceed 50 in 20 minutes.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Kubernetes Descheduler Official Documentation and Architecture Guide](https://github.com/kubernetes-sigs/descheduler)
    - [Descheduler Policy Configuration and Strategies Guide](https://github.com/kubernetes-sigs/descheduler#policy)
    - [Kubernetes PodDisruptionBudget Concepts and Best Practices](https://kubernetes.io/docs/concepts/workloads/pods/disruptions/)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  verified: false
  demo: false
