id: datadog-host-agent-connectivity-loss-sentinel
namespace: company.sre

inputs:
  - id: dd_site
    type: STRING
    defaults: "datadoghq.com"
    description: Datadog site hostname.
  - id: silent_host_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of unresponsive or silent Datadog agent hosts.

tasks:
  - id: audit_host_agents
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s -G "https://api.{{ inputs.dd_site }}/api/v1/hosts?filter=status:silent"           -H "DD-API-KEY: {{ secret('DATADOG_API_KEY') }}"           -H "DD-APPLICATION-KEY: {{ secret('DATADOG_APP_KEY') }}" > /tmp/silent_hosts.json
        
        SILENT_COUNT=$(jq '.total_matching // 0' /tmp/silent_hosts.json)
        SILENT_LIST=$(jq -c '[.host_list[]? | {name: .name, last_reported_time: .last_reported_time, apps: .apps}] | .[0:10]' /tmp/silent_hosts.json)
        
        echo "::set-output name=silent_count::$SILENT_COUNT::"
        echo "::set-output name=silent_list::$SILENT_LIST::"

  - id: evaluate_agent_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_host_agents.vars.silent_count | int > inputs.silent_host_threshold }}"
    then:
      - id: notify_infrastructure_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Datadog Host Agent Connectivity Loss Alert",
                "text": "Detected *{{ outputs.audit_host_agents.vars.silent_count }}* silent host(s) that have ceased reporting telemetry to Datadog. Unresponsive hosts: {{ outputs.audit_host_agents.vars.silent_list }}. Impact: Blind spots in infrastructure monitoring, undetected node failures, or crashed agent daemons.",
                "footer": "Kestra Infrastructure Sentinel • Datadog Host Agent"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Datadog Host Agent Sentinel Workflow Failed",
            "text": "The Datadog host connectivity query failed. Please verify Datadog API credentials and network egress reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Datadog host infrastructure to detect silent agents and unmonitored virtual machines or bare-metal instances."
  metaTitle: Datadog Host Agent Connectivity Loss and Silent Infrastructure Sentinel with Kestra
  title: Datadog Host Agent Connectivity Loss and Silent Infrastructure Sentinel
  shortDescription: Audits Datadog host infrastructure to detect silent agents and unmonitored virtual machines or bare-metal instances.
  description: |
    ## How it works
    This workflow connects to the Datadog API v1 endpoint `/api/v1/hosts` and filters for hosts exhibiting a `silent` status (instances that have stopped transmitting metrics within the expected heartbeat window). If the count of silent hosts exceeds the configured threshold, an automated Slack incident alert is immediately dispatched with host names and last reported timestamps.

    ## What you get
    - Proactive detection of crashed agent daemons, frozen VMs, or network isolation events.
    - Prevents infrastructure blind spots where server outages go completely unnoticed.
    - Rapid recovery dispatch for platform and operations engineers.

    ## Who it's for
    - Systems Administrators and SREs maintaining production server fleets.
    - Cloud Infrastructure Engineers operating hybrid or multi-cloud compute clusters.

    ## Why orchestrate this with Kestra
    - **Automated Fleet Auditing**: Maintain rigorous visibility across hybrid clouds with scheduled polling.
    - **Cross-Platform Resiliency**: Integrates cleanly with enterprise chat, ticketing, and alerting ecosystems.
    - **Zero Local Dependencies**: Runs within lightweight, secure container images.

    ## Prerequisites
    - Datadog API and Application keys with read permissions for infrastructure host status.
    - Secrets `DATADOG_API_KEY`, `DATADOG_APP_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure Datadog credentials and the Slack webhook.
    3. Run the workflow to identify any silent hosts in your infrastructure inventory.

    ## How to extend
    - Trigger an automated SSH or Ansible remediation command to restart the `datadog-agent` service.
    - Query cloud provider APIs (e.g., AWS EC2, GCP Compute) to verify if the VM is actually running or terminated.

    ## Links
    - [Datadog Hosts API Documentation](https://docs.datadoghq.com/api/latest/hosts/#get-all-hosts-for-your-organization)
    - [Kestra Architecture Concepts](https://kestra.io/docs/architecture)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Agents & Structured Output
    - Day 2 Operations
  ee: false
  demo: false
