id: cloudflare-waf-overly-broad-allowlist-gate
namespace: company.team
description: |
  List a Cloudflare zone's WAF IP access rules, flag any whitelist rule
  scoped to a whole country or ASN rather than a specific IP or range,
  alert Slack on breach, and conditionally delete the offending rules.
  auto_remediate and dry_run are two independent gates; every other
  access rule - including narrowly-scoped allow rules and all block or
  challenge rules - is left untouched.

triggers:
  - id: periodic_allowlist_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every 6 hours. Shipped disabled; enable it once zone_id points at a real zone and a manual run has been verified. Always fires in safe mode (auto_remediate false, dry_run true) regardless of this flow's own defaults.
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      auto_remediate: "false"
      dry_run: "true"

inputs:
  - id: zone_id
    type: STRING
    displayName: "Cloudflare Zone ID"
    description: Zone whose WAF IP access rules are audited, matching this plugin's own documented zoneId property (see cloudflare-canary-deploy.yaml).

  - id: max_broad_allow_rules
    type: INT
    displayName: "Max Allowed Broad Allowlist Rules"
    defaults: 0
    description: Breach when the count of whitelist rules scoped to "country" or "asn" exceeds this number. Default 0 means any such rule at all is a breach.

  - id: auto_remediate
    type: SELECT
    displayName: "Auto Remediate"
    defaults: "false"
    values:
      - "false"
      - "true"
    description: If "true" and overly broad whitelist rules are found, delete each one (still gated by dry_run below). If "false", the risk is only reported.

  - id: dry_run
    type: SELECT
    displayName: "Dry Run"
    defaults: "true"
    values:
      - "true"
      - "false"
    description: If "true", remediation is only logged, no rule is deleted. Must be explicitly "false", together with auto_remediate "true", for the rule to actually be removed.

tasks:
  - id: audit_waf_access_rules
    type: io.kestra.plugin.cloudflare.waf.accessrules.List
    description: Lists the zone's IP access rules. This task's documented output is a rules array where each rule carries id, mode, and configuration.{target,value} - verified from the plugin's own output schema, which notably does not document a notes or created_on field, so this audit is scoped to what the task actually returns. Per the plugin's own documentation this lists "using Cloudflare default pagination (first page only)" - see this blueprint's Pitfalls.
    apiToken: "{{ secret('CLOUDFLARE_API_TOKEN') }}"
    zoneId: "{{ inputs.zone_id }}"

  - id: evaluate_allowlist_risk
    type: io.kestra.plugin.scripts.python.Script
    description: Reads the listed rules and flags any whitelist rule whose configuration.target is "country" or "asn" - a single allow rule scoped to an entire country or Autonomous System Number, rather than a specific IP or IP range, bypassing the WAF for a potentially enormous swath of traffic. There is no structured policy-evaluation task in this plugin, so the comparison runs here against the mode/configuration fields the List task actually returns.
    inputFiles:
      rules.json: "{{ outputs.audit_waf_access_rules | json }}"
    script: |
      import json
      from kestra import Kestra

      with open("rules.json") as f:
          raw = json.load(f)

      rules = raw.get("rules", []) if isinstance(raw, dict) else raw

      broad_rules = []
      for rule in rules:
          mode = (rule.get("mode") or "").lower()
          configuration = rule.get("configuration") or {}
          target = (configuration.get("target") or "").lower()
          if mode == "whitelist" and target in ("country", "asn"):
              broad_rules.append({
                  "id": rule.get("id"),
                  "target": target,
                  "value": configuration.get("value"),
              })

      Kestra.outputs({
          "broad_count": len(broad_rules),
          "broad_rules": broad_rules,
      })

  - id: evaluate_allowlist_gate
    type: io.kestra.plugin.core.flow.If
    description: Breach when at least one whitelist rule is scoped to a whole country or ASN.
    condition: "{{ outputs.evaluate_allowlist_risk.vars.broad_count > inputs.max_broad_allow_rules }}"
    then:
      - id: route_remediation
        type: io.kestra.plugin.core.flow.Switch
        description: auto_remediate only decides whether remediation is considered at all; dry_run, checked separately below, decides whether the rule is actually deleted.
        value: "{{ inputs.auto_remediate }}"
        cases:
          "true":
            - id: check_dry_run
              type: io.kestra.plugin.core.flow.If
              condition: "{{ inputs.dry_run == \"false\" }}"
              then:
                - id: remove_broad_allow_rules
                  type: io.kestra.plugin.core.flow.Loop
                  description: Delete each flagged rule one at a time, so one failed delete never blocks the rest of the batch.
                  values: "{{ outputs.evaluate_allowlist_risk.vars.broad_rules }}"
                  concurrencyLimit: 4
                  tasks:
                    - id: delete_broad_allow_rule
                      type: io.kestra.plugin.cloudflare.waf.accessrules.Delete
                      description: Removes the flagged rule by id, matching this plugin's own documented delete pattern (see cloudflare-canary-deploy.yaml). Only the flagged country/asn-scoped whitelist rule is removed; every other access rule in the zone is untouched.
                      apiToken: "{{ secret('CLOUDFLARE_API_TOKEN') }}"
                      zoneId: "{{ inputs.zone_id }}"
                      ruleId: "{{ item.value | jq('.id') | first }}"
                - id: log_remediation_applied
                  type: io.kestra.plugin.core.log.Log
                  message: "Deleted {{ outputs.evaluate_allowlist_risk.vars.broad_count }} overly broad whitelist rule(s) from zone {{ inputs.zone_id }}."
              else:
                - id: log_dry_run_remediation
                  type: io.kestra.plugin.core.log.Log
                  message: "DRY RUN: would delete {{ outputs.evaluate_allowlist_risk.vars.broad_count }} overly broad whitelist rule(s) from zone {{ inputs.zone_id }} (dry_run is true). No change made."
          "false":
            - id: log_remediation_disabled
              type: io.kestra.plugin.core.log.Log
              message: "auto_remediate is false: {{ outputs.evaluate_allowlist_risk.vars.broad_count }} whitelist rule(s) in zone {{ inputs.zone_id }} are scoped to a whole country or ASN, but no deletion was attempted."
      - id: alert_allowlist_risk
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Always alert on any breach, independent of whether it was remediated.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Cloudflare WAF allowlist gate: {{ outputs.evaluate_allowlist_risk.vars.broad_count }} whitelist rule(s) in zone {{ inputs.zone_id }} are scoped to a whole country or ASN (threshold {{ inputs.max_broad_allow_rules }}). auto_remediate: {{ inputs.auto_remediate }}. dry_run: {{ inputs.dry_run }}. Remediated: {{ inputs.auto_remediate == \"true\" and inputs.dry_run == \"false\" }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_allowlist_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Zone {{ inputs.zone_id }} is compliant: 0 whitelist rules are scoped to a whole country or ASN."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status line for every run, independent of which branch fired, so the execution history always shows the headline numbers.
    message: "WAF allowlist audit complete for zone {{ inputs.zone_id }}. broad_count={{ outputs.evaluate_allowlist_risk.vars.broad_count }}. threshold={{ inputs.max_broad_allow_rules }}. auto_remediate={{ inputs.auto_remediate }}. dry_run={{ inputs.dry_run }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the flow itself fails outside the handled branches, for example an invalid API token or an unreachable zone.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Cloudflare WAF allowlist gate FAILED in execution {{ execution.id }} for zone {{ inputs.zone_id }}. The allowlist audit did not complete; investigate before trusting the last known compliance status."
      }

extend:
  title: "Cloudflare WAF Overly Broad Allowlist Gate"
  shortDescription: Audit a Cloudflare zone's WAF access rules for whitelist rules scoped to a whole country or ASN, alert Slack on breach, and optionally delete the offending rules.
  metaTitle: Cloudflare WAF Overly Broad Allowlist Gate with Kestra
  metaDescription: "Audit Cloudflare WAF access rules for country- or ASN-scoped whitelist rules, alert on breach, and optionally remove them."
  description: |
    A Cloudflare WAF whitelist rule scoped to a specific IP is a narrow, reviewable
    exception. The same rule scoped to an entire country or Autonomous System Number is a
    different thing entirely - it waves an unknown number of IP addresses straight past
    every other WAF control for that zone, and it is exactly the kind of rule that gets
    created during an incident ("just allow all of AS12345 through, we'll narrow it later")
    and then never gets narrowed. This blueprint lists a zone's WAF IP access rules, flags
    any whitelist rule scoped this broadly, alerts Slack on breach, and can delete the
    offending rules - leaving every narrowly-scoped allow rule and every block or challenge
    rule untouched.

    ## How it works

    1. `periodic_allowlist_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 6 hours, always forcing `auto_remediate: "false"` and `dry_run: "true"` through its own `inputs:` override regardless of this flow's defaults. Shipped disabled so you can validate a manual run first.
    2. `audit_waf_access_rules` (`io.kestra.plugin.cloudflare.waf.accessrules.List`) lists the zone's IP access rules, each carrying `id`, `mode`, and `configuration.{target,value}`.
    3. `evaluate_allowlist_risk` (`io.kestra.plugin.scripts.python.Script`) collects every rule where `mode == "whitelist"` and `configuration.target` is `"country"` or `"asn"`, emitting `broad_count` and `broad_rules` through `Kestra.outputs`.
    4. `evaluate_allowlist_gate` (`io.kestra.plugin.core.flow.If`) flags a breach whenever `broad_count > max_broad_allow_rules`.
       - `then` (breach): `route_remediation` (`io.kestra.plugin.core.flow.Switch` on `auto_remediate`) either considers remediation (`"true"`, gated again by `dry_run` through `check_dry_run`) or only logs that remediation is disabled (`"false"`). When both gates allow it, `remove_broad_allow_rules` (`io.kestra.plugin.core.flow.Loop`) runs `delete_broad_allow_rule` (`io.kestra.plugin.cloudflare.waf.accessrules.Delete`) for each flagged rule. `alert_allowlist_risk` always fires to Slack regardless of which path ran.
       - `else` (compliant): `log_allowlist_healthy` records a clean check.
    5. `log_audit_complete` always runs last, printing the headline numbers regardless of which branch fired.
    6. The `errors` block alerts Slack separately if the flow itself fails - an invalid token or unreachable zone must not read as "no breach".

    ## What you get

    - A concrete, named list of overly broad WAF allow rules, not a generic "review your firewall rules" reminder.
    - Remediation that only ever deletes the specific country/ASN-scoped whitelist rules flagged; every narrowly-scoped allow rule and every block/challenge rule is left exactly as it was.
    - Two independent gates (`auto_remediate`, `dry_run`) between "breach detected" and "rule actually deleted".
    - A final status log every run, breach or not, so the execution history doubles as a WAF-posture trend for the zone.

    ## Who it's for

    - Platform and security teams running Cloudflare who need a standing check against incident-response allow rules that were never narrowed or removed.
    - SREs who want this as a recurring hygiene pass after every incident where a temporary broad allowlist was created under pressure.
    - Anyone evaluating the Cloudflare plugin who wants a worked example of `waf.accessrules.List` beyond the temporary-rule pattern already shown in this repo's `cloudflare-canary-deploy.yaml`.

    ## Why orchestrate this with Kestra

    Cloudflare's own dashboard shows the current rule list, but it has no scheduled audit, no threshold logic, and no notification path for "this allow rule is scoped too broadly." Kestra supplies the schedule, the risk classification as a first-class branch, two independent authorization gates before anything is deleted, and an execution history that shows exactly when an overly broad rule appeared and whether it was removed.

    ## Prerequisites

    - A Cloudflare zone and an API token with rights to list and, if remediation runs, delete IP access rules for that zone.
    - A Slack incoming webhook for alerts.

    Local testing: this plugin calls Cloudflare's own hosted API directly (`baseUrl` defaults to `https://api.cloudflare.com/client/v4`); there is no self-hosted Cloudflare emulator to run in Docker. Validate this flow against a real, low-traffic test zone - for example by first running `cloudflare-canary-deploy.yaml`'s `allow_canary_source` task (already in this repo) to create a throwaway country-scoped rule for a test zone, confirming this blueprint flags it, then letting this blueprint's own remediation remove it.

    ### Secrets

    - `CLOUDFLARE_API_TOKEN`: Cloudflare API token, matching this plugin's own documented pattern (see `cloudflare-canary-deploy.yaml`).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_allowlist_risk` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_CLOUDFLARE_API_TOKEN=$(echo -n '<your-cloudflare-token>' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `zone_id` (STRING, no default): Cloudflare zone audited.
    - `max_broad_allow_rules` (INT, default `0`): breach threshold; `0` means any country/ASN-scoped whitelist rule at all breaches.
    - `auto_remediate` (SELECT: `"false"`, `"true"`; default `"false"`): must be `"true"` for deletion to even be considered.
    - `dry_run` (SELECT: `"true"`, `"false"`; default `"true"`): must be explicitly `"false"`, together with `auto_remediate: "true"`, for the rule to actually be deleted.

    ### Outputs

    - `outputs.audit_waf_access_rules.rules`: the raw access-rule listing (`id`, `mode`, `configuration.target`, `configuration.value`) for every run.
    - `outputs.evaluate_allowlist_risk.vars.broad_count` / `.broad_rules`: the computed policy result for every run.

    ## Quick start

    1. Create a test whitelist rule scoped to `country` or `asn` on a non-production zone (for example via `cloudflare-canary-deploy.yaml`'s `allow_canary_source` task, or directly in the Cloudflare dashboard).
    2. Add the `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK_URL` secrets.
    3. Run the flow manually with the defaults (`auto_remediate: "false"`) and confirm `alert_allowlist_risk` fires naming the expected rule, and that `log_remediation_disabled` logs without deleting anything.
    4. Run once with `auto_remediate: "true"` and `dry_run: "true"` and confirm `log_dry_run_remediation` describes the deletion without running it.
    5. Run once with `auto_remediate: "true"` and `dry_run: "false"` and confirm via the Cloudflare dashboard or `waf.accessrules.List` that the flagged rule is gone.
    6. Enable `periodic_allowlist_check` once you trust the check; it always runs in the safe `auto_remediate: "false"` / `dry_run: "true"` mode regardless of what you leave the flow's own defaults set to.

    ## How to extend

    - Page through results beyond the first page - this audit currently only sees what `List`'s documented first-page pagination returns; see Pitfalls.
    - Loop over several `zone_id` values with `io.kestra.plugin.core.flow.Loop` (`ForEach` is deprecated) to sweep every zone in an account in one run.
    - Extend `evaluate_allowlist_risk` to also flag `ip_range` targets wider than a configurable CIDR prefix length, once you need finer-grained scope than the binary country/ASN check this blueprint uses.
    - Route the remediation branch through a `Pause` approval task instead of (or alongside) the static `auto_remediate` input, for a human-reviewed deletion on production zones.

    ## Pitfalls

    - **`List`'s documented output has no `notes`, `created_on`, or `scope` field.** Verified from the plugin's own output schema, which only documents `id`, `mode`, and `configuration.{target,value}`. This is why the audit is scoped to rule mode and target type rather than rule age or an expiry tag - those fields are not confirmed to exist in this task's output.
    - **`List` only returns the first page of results.** Verified from the plugin's own description: "Lists IP access rules for a zone using Cloudflare default pagination (first page only)." A zone with more access rules than fit on one page will be under-audited by this blueprint as written; see How to extend.
    - **Deleting an access rule is not reversible by this flow.** Unlike this session's other remediations (which only move, flag, or restrict), `waf.accessrules.Delete` permanently removes the rule; if a deleted country/ASN-scoped rule was actually intentional, it must be recreated by hand. Both `auto_remediate` and `dry_run` exist specifically to make this an explicit, opt-in action.
    - **`auto_remediate` and `dry_run` are independent gates, not a single boolean.** Both must be `"true"`/`"false"` respectively for the delete `Loop` to run; setting only one leaves the other still blocking.
    - **`Switch` case keys `"true"`/`"false"` are quoted strings.** `auto_remediate` renders as the literal string `"true"` or `"false"`; unquoted `true:`/`false:` YAML map keys would parse as booleans instead and would not match.

    ## Links

    - [plugin-cloudflare documentation](https://kestra.io/plugins/plugin-cloudflare)
    - [Cloudflare WAF access rules List task reference](https://kestra.io/plugins/plugin-cloudflare/waf/accessrules/io.kestra.plugin.cloudflare.waf.accessrules.list)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Policy & Compliance
  ee: false
  demo: false
