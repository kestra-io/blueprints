id: prometheus-scrape-target-down-ratio-sentinel
namespace: company.observability

inputs:
  - id: prometheus_url
    type: STRING
    defaults: "http://prometheus.observability:9090"
    description: Base URL of the Prometheus server.
  - id: max_down_targets
    type: INT
    defaults: 0
    description: "Maximum allowable down scrape targets before alerting (default 0)."

tasks:
  - id: query_down_targets
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -G "{{ inputs.prometheus_url }}/api/v1/targets" > /tmp/targets_raw.json
        
        # Filter active targets where health != "up"
        DOWN_TARGETS=$(jq '[.data.activeTargets[] | select(.health != "up") | {job: .labels.job, instance: .labels.instance, error: .lastError}]' /tmp/targets_raw.json)
        DOWN_COUNT=$(echo "$DOWN_TARGETS" | jq 'length')
        
        echo "::set-output name=down_count::$DOWN_COUNT::"

  - id: evaluate_unhealthy_targets
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_down_targets.vars.down_count | int > inputs.max_down_targets }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#observability-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Prometheus Down Scrape Targets Detected",
                "text": "Prometheus server at `{{ inputs.prometheus_url }}` detected *{{ outputs.query_down_targets.vars.down_count }} scrape target(s) in DOWN state*! Microservice pods or node exporters are failing HTTP scrapes.",
                "footer": "Kestra Observability Sentinel • Prometheus"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#observability-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Prometheus Targets Sentinel Failure",
            "text": "Failed to connect to Prometheus API endpoint. Verify Prometheus URL and network policies.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Prometheus Scrape Target Down Ratio and Unhealthy Endpoint Sentinel
  shortDescription: Audits Prometheus server active scrape targets to detect dead services and unreachable monitoring endpoints.
  description: |
    ## How it works
    This workflow queries the Prometheus HTTP Targets API (`/api/v1/targets`) using shell tasks to retrieve the live operational status of all active scrape targets. When monitored microservices crash, experience DNS resolution failures, or become unreachable due to firewall and security group changes, Prometheus marks them as `health != "up"`. The workflow parses the active targets array with `jq`, aggregates failing instances, and dispatches a prioritized Slack alert with diagnostic details.

    ## What you get
    - Immediate detection of dead scrape endpoints across clusters.
    - Prevents blind spots in infrastructure and application metric collection.
    - Automated reporting of endpoint health status without manual dashboard inspection.

    ## Who it's for
    - SREs and Infrastructure Engineers operating Prometheus monitoring infrastructure.
    - Platform teams ensuring comprehensive observability coverage across Kubernetes clusters.

    ## Why orchestrate this with Kestra
    - **Independent Validation**: Monitors the monitoring system itself from an external orchestrator.
    - **Fast Discovery**: Parses JSON directly with native shell utilities and conditional branching.
    - **Flexible Scheduling**: Runs periodically or triggers on-demand during cluster maintenance.

    ## Prerequisites
    - Prometheus server accessible over HTTP with API enabled.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Set your Prometheus base URL.
    3. Run the flow to audit scrape target states.

    ## How to extend
    - Extract and list the exact down jobs and error messages in the Slack alert body.
    - Integrate with Kubernetes API to restart crashed target pods automatically.

    ## Links
    - [Prometheus HTTP API Documentation](https://prometheus.io/docs/prometheus/latest/querying/api/#targets)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
