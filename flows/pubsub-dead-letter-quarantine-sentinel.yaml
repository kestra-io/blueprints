id: pubsub-dead-letter-quarantine-sentinel
namespace: company.team
description: |
  Read Cloud Monitoring's own num_undelivered_messages metric for a GCP
  Pub/Sub dead-letter subscription, classify it NO_DATA, HEALTHY, or
  BACKLOG, and alert Slack when messages are accumulating in quarantine -
  entirely read-only, with no message ever consumed or acknowledged.

triggers:
  - id: periodic_dlq_backlog_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Checks every 15 minutes - messages accumulating in a dead-letter subscription usually mean an upstream consumer is actively failing, so this needs a tighter cadence than a weekly compliance sweep. Shipped disabled; enable it once gcp_project_id and dead_letter_subscription point at a real subscription and a manual run has been verified."
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      gcp_project_id: "<your-gcp-project-id>"
      dead_letter_subscription: "orders-dlq-sub"
      backlog_alert_threshold: 0
      query_window: "PT5M"

inputs:
  - id: gcp_project_id
    type: STRING
    displayName: "GCP Project ID"
    defaults: "<your-gcp-project-id>"
    description: "GCP project containing the dead-letter subscription. Must be replaced with a real project ID - there is no safe universal default."

  - id: dead_letter_subscription
    type: STRING
    displayName: "Dead-Letter Subscription Name"
    defaults: "orders-dlq-sub"
    description: "Name of the subscription configured as the destination of a topic's dead-letter policy, used as the resource.labels.subscription_id filter on Cloud Monitoring's own pubsub.googleapis.com/subscription/num_undelivered_messages metric."

  - id: backlog_alert_threshold
    type: INT
    displayName: "Backlog Alert Threshold"
    defaults: 0
    description: "Above this many undelivered messages on the dead-letter subscription, the result is classified BACKLOG. Default 0 means any quarantined message at all triggers an alert; raise it to tolerate a small, expected trickle."

  - id: query_window
    type: STRING
    displayName: "Metric Lookback Window"
    defaults: "PT5M"
    description: "ISO-8601 duration passed to io.kestra.plugin.gcp.monitoring.Query's own window property (its own documented default is also 5 minutes)."

tasks:
  - id: probe_dlq_backlog_metric
    type: io.kestra.plugin.gcp.monitoring.Query
    description: "Entirely read-only: queries Cloud Monitoring's own num_undelivered_messages time series for the dead-letter subscription - verified as the real, documented Pub/Sub backlog metric from Google's own Cloud Monitoring documentation. No Pub/Sub message is ever pulled, read, or acknowledged by this task, unlike io.kestra.plugin.gcp.pubsub.Consume, which permanently acks everything it drains and was deliberately avoided here for exactly that reason."
    projectId: "{{ inputs.gcp_project_id }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT_JSON') }}"
    filter: metric.type="pubsub.googleapis.com/subscription/num_undelivered_messages" AND resource.labels.subscription_id="{{ inputs.dead_letter_subscription }}"
    window: "{{ inputs.query_window }}"

  - id: evaluate_metric_presence
    type: io.kestra.plugin.core.flow.If
    description: "NO_DATA when Cloud Monitoring returned zero matching time series (count == 0, verified from io.kestra.plugin.gcp.monitoring.Query's own Output class) - most often a misconfigured subscription_id or project, distinct from a genuinely empty backlog, which still reports a time series with value 0."
    condition: "{{ outputs.probe_dlq_backlog_metric.count == 0 }}"
    then:
      - id: log_no_metric_data
        type: io.kestra.plugin.core.log.Log
        message: "NO_DATA: Cloud Monitoring returned no num_undelivered_messages time series for subscription {{ inputs.dead_letter_subscription }} in the last {{ inputs.query_window }}. Verify the subscription and project are correct - this does not necessarily mean the backlog is healthy."
    else:
      - id: evaluate_backlog_threshold
        type: io.kestra.plugin.core.flow.If
        description: "BACKLOG when the most recent sampled value (series[0].points[0], Cloud Monitoring's own documented points ordering returns the newest point first) exceeds backlog_alert_threshold. int64Value is cast with the number filter since protobuf's own JSON mapping serializes INT64 values as strings."
        condition: "{{ (outputs.probe_dlq_backlog_metric.series[0].points[0].value.int64Value | number) > inputs.backlog_alert_threshold }}"
        then:
          - id: alert_backlog_detected
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: "Always alert on BACKLOG so an on-call engineer sees quarantined messages accumulating without opening the Cloud Monitoring console."
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {{ {
                "text": "Pub/Sub dead-letter backlog sentinel: BACKLOG. Subscription " ~ inputs.dead_letter_subscription ~ " has " ~ outputs.probe_dlq_backlog_metric.series[0].points[0].value.int64Value ~ " undelivered message(s) (threshold " ~ inputs.backlog_alert_threshold ~ "). Execution " ~ execution.id ~ "."
              } | toJson }}
        else:
          - id: log_backlog_healthy
            type: io.kestra.plugin.core.log.Log
            message: "HEALTHY: subscription {{ inputs.dead_letter_subscription }} has {{ outputs.probe_dlq_backlog_metric.series[0].points[0].value.int64Value }} undelivered message(s), at or below threshold {{ inputs.backlog_alert_threshold }}."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: "Final status line for every run, independent of which branch fired."
    message: "Dead-letter backlog audit complete for {{ inputs.dead_letter_subscription }}. time_series_count={{ outputs.probe_dlq_backlog_metric.count }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert when the flow itself fails outside the handled branches, for example an unreachable Cloud Monitoring API, invalid credentials, or an unexpected time series shape (such as a series with zero points) that the two If conditions above do not explicitly guard."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {
        "text": "Pub/Sub dead-letter backlog sentinel FAILED in execution " ~ execution.id ~ " for subscription " ~ inputs.dead_letter_subscription ~ ". The Cloud Monitoring query did not complete or returned an unexpected shape; investigate before trusting the last known NO_DATA/HEALTHY/BACKLOG status."
      } | toJson }}

extend:
  title: "GCP Pub/Sub Dead-Letter Backlog Metric Sentinel"
  shortDescription: "Read Cloud Monitoring's own num_undelivered_messages metric for a Pub/Sub dead-letter subscription and alert Slack on backlog - entirely read-only, no message ever consumed."
  metaTitle: "GCP Pub/Sub Dead-Letter Backlog Sentinel with Kestra"
  metaDescription: "Monitor Pub/Sub dead-letter backlog via Cloud Monitoring metrics and alert Slack, without ever consuming or deleting a message."
  description: |
    A message that keeps failing downstream processing lands in its
    Pub/Sub dead-letter subscription and then just sits there - Pub/Sub
    itself has no built-in alert for "something is accumulating in the
    dead-letter queue." Draining the subscription to count what is in it
    is destructive: Pub/Sub acknowledgement is permanent, so a monitoring
    probe that pulls messages just to count them also deletes the evidence
    a human would need to triage. This blueprint instead reads Cloud
    Monitoring's own `num_undelivered_messages` metric for the
    subscription - the same number Pub/Sub itself already tracks - and
    alerts on it without ever touching a single message.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `periodic_dlq_backlog_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 15 minutes, explicitly passing `gcp_project_id`, `dead_letter_subscription`, `backlog_alert_threshold`, and `query_window` through its own `inputs:` block so the flow is self-contained when the trigger fires. Shipped disabled so a manual run can be verified first.
    2. `probe_dlq_backlog_metric` (`io.kestra.plugin.gcp.monitoring.Query`) queries Cloud Monitoring's own `pubsub.googleapis.com/subscription/num_undelivered_messages` metric, filtered to the dead-letter subscription, over the last `query_window`. This is a pure metrics read - no Pub/Sub API call is made at all.
    3. `evaluate_metric_presence` (`io.kestra.plugin.core.flow.If`) branches on whether any time series came back (`count`).
       - `then` (NO_DATA): `log_no_metric_data` flags a likely misconfiguration rather than guessing it means a healthy backlog.
       - `else`: nested `evaluate_backlog_threshold` (`io.kestra.plugin.core.flow.If`) branches on whether the most recent sampled value exceeds `backlog_alert_threshold`.
         - `then` (BACKLOG): `alert_backlog_detected` reports the current count to Slack.
         - `else` (HEALTHY): `log_backlog_healthy` records a clean check.
    4. `log_audit_complete` always runs last, printing the time-series count regardless of which branch fired.
    5. The `errors` block alerts Slack separately if the flow itself fails outright - including the unguarded edge case of a time series with zero points, which would otherwise throw while rendering `series[0].points[0]`.

    ## What you get

    - A NO_DATA/HEALTHY/BACKLOG answer sourced from Cloud Monitoring's own backlog metric, with zero risk to the messages themselves - nothing is ever pulled or acknowledged.
    - A distinct NO_DATA state instead of silently treating a missing metric as "zero backlog," which would hide a misconfigured subscription name or project.
    - A worked example of `io.kestra.plugin.gcp.monitoring.Query` applied to a specific subscription via its `resource.labels.subscription_id` filter label, not just a generic CPU/latency dashboard query.
    - A sentinel that is safe to run as often as you like, since repeated checks cannot themselves cause any data loss - unlike a drain-and-count approach built on `io.kestra.plugin.gcp.pubsub.Consume`.

    ## Who it's for

    - Data platform teams running Pub/Sub dead-letter policies who need an early signal when a consumer starts failing messages into quarantine, without risking the quarantined messages themselves.
    - On-call engineers who want one Slack alert with the real backlog count instead of opening the Cloud Monitoring console, or worse, draining the subscription by hand to see what is in it.
    - Anyone evaluating the GCP Monitoring plugin who wants a worked example of `Query` scoped to one specific Pub/Sub subscription via a Cloud Monitoring resource label filter.

    ## Why orchestrate this with Kestra

    Cloud Monitoring can display this metric on a dashboard, but it has no first-class "check this subscription on a schedule and tell me HEALTHY or BACKLOG" primitive of its own, and GCP's native alerting policies are a separate configuration surface from the flow that actually needs to react. Kestra supplies the schedule, the NO_DATA/HEALTHY/BACKLOG classification as a first-class branch, and an execution history that shows exactly when a dead-letter subscription started accumulating messages.

    ## Prerequisites

    - A GCP project with a Pub/Sub topic whose subscription has a dead-letter policy configured, pointing at `dead_letter_subscription` (update `gcp_project_id`, `dead_letter_subscription`).
    - A GCP service account JSON key with `roles/monitoring.viewer` (read-only; no Pub/Sub permissions are needed at all, since this blueprint never calls the Pub/Sub API).
    - A Slack incoming webhook for alerts.

    This requires a real GCP project - Cloud Monitoring has no official local emulator of its own, unlike some other GCP services, so there is no fully-offline Docker-only way to exercise this specific blueprint. This is the same baseline prerequisite every other GCP-targeting blueprint in this repository assumes.

    ### Secrets

    - `GCP_SERVICE_ACCOUNT_JSON`: service account key used by `io.kestra.plugin.gcp.monitoring.Query`. Only needs Monitoring Viewer, deliberately narrower than the Pub/Sub Subscriber role a drain-based approach would require.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_backlog_detected` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded - for example `SECRET_SLACK_WEBHOOK_URL=$(echo -n '<your-webhook-url>' | base64)` - and read back in flows with `{{ secret('NAME') }}`.

    ### Inputs

    | Input | Type | Default | Purpose |
    |---|---|---|---|
    | `gcp_project_id` | String | `<your-gcp-project-id>` | GCP project containing the subscription |
    | `dead_letter_subscription` | String | `orders-dlq-sub` | Subscription audited via its `subscription_id` resource label |
    | `backlog_alert_threshold` | Integer | `0` | Undelivered-message ceiling before BACKLOG fires |
    | `query_window` | String | `PT5M` | Cloud Monitoring lookback window duration |

    ### Outputs

    - `outputs.probe_dlq_backlog_metric.count`: number of matching time series (expected 0 or 1 for a single-subscription filter).
    - `outputs.probe_dlq_backlog_metric.series`: the raw Cloud Monitoring time series; this blueprint reads only `series[0].points[0].value.int64Value`, the most recent sampled undelivered-message count.

    ## Quick start

    1. Create a topic and a dead-letter-policy subscription in a real GCP project, named to match `dead_letter_subscription`.
    2. Add the `GCP_SERVICE_ACCOUNT_JSON` (Monitoring Viewer role) and `SLACK_WEBHOOK_URL` secrets.
    3. Run the flow manually against a quiet dead-letter subscription and confirm `log_backlog_healthy` (or `log_no_metric_data` if the metric has not reported yet) fires.
    4. Deliberately fail a message enough times on the primary subscription to trigger its dead-letter policy, wait a minute or two for Cloud Monitoring to sample the metric, then re-run to confirm `alert_backlog_detected` fires with the real count.
    5. Enable `periodic_dlq_backlog_check` once you trust the check against your real subscription.

    ## How to extend

    - Loop over several `dead_letter_subscription` values with `io.kestra.plugin.core.flow.Loop` to audit every dead-letter subscription in a project in one run.
    - Add a second, separate approval-gated flow using `io.kestra.plugin.gcp.pubsub.Consume` for the actual replay/triage step once a human has decided to act on a BACKLOG alert - deliberately kept out of this sentinel so the monitoring path itself never touches message data.
    - Track the metric value over successive runs (via a Kestra KV store) to alert on a sustained climbing trend even before any single run's count crosses `backlog_alert_threshold`.

    ## Pitfalls

    - **This blueprint deliberately does not use `io.kestra.plugin.gcp.pubsub.Consume`.** That task permanently acknowledges every message it pulls (verified from its own source - there is no peek-without-ack option), which would destroy the exact quarantined payloads a human needs to triage. Reading the Cloud Monitoring metric instead keeps this sentinel entirely non-destructive.
    - **`series[0].points[0]` is not guarded against a time series with zero points.** Cloud Monitoring's own documentation describes `points` as always present for an active GAUGE metric like this one within a reasonable window, but an edge case here surfaces as a flow failure through the `errors` block rather than a silent misclassification.
    - **Cloud Monitoring's protobuf-JSON mapping serializes INT64 values as JSON strings, not numbers** - `int64Value` is cast with the `number` Pebble filter before the threshold comparison for exactly that reason.
    - **Cloud Monitoring has no local emulator.** Unlike Pub/Sub itself (which does have an official emulator, with its own worker-level environment-variable caveats), there is no way to exercise this specific blueprint without a real GCP project.
    - **This blueprint is UNTESTED against a live GCP project.** The `num_undelivered_messages` metric type, the `subscription_id` resource label, and the `points[].value.int64Value` JSON shape are taken verbatim from Google's own Cloud Monitoring documentation, and the `io.kestra.plugin.gcp.monitoring.Query` properties and outputs are taken from the plugin's own source on `main` - but no Kestra engine was run to execute this flow end to end.

    ## Links

    - [Kestra GCP plugin documentation](https://kestra.io/plugins/plugin-gcp)
    - [GCP Pub/Sub monitoring metrics (num_undelivered_messages)](https://cloud.google.com/pubsub/docs/monitor-subscription)
    - [GCP Cloud Monitoring TimeSeries API reference](https://docs.cloud.google.com/monitoring/api/ref_v3/rest/v3/TimeSeries)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
