id: postgis-polygon-repair-quarantine-approval
namespace: company.data
description: Repair bounded GeoJSON polygon batches in real PostGIS, quarantine unsuitable features, review a sealed
  plan and atomically publish an approved version.
labels:
  team: data-platform
  use-case: geospatial-quality
inputs:
  - id: geojson
    type: FILE
    required: false
    description: Optional RFC 7946 Polygon/MultiPolygon FeatureCollection; omitted uses the labelled four-feature
      example.
  - id: dataset_id
    type: STRING
    defaults: service-zones-demo
    description: Blueprint-owned dataset key; lowercase letters/digits/hyphens, 1–64 characters.
  - id: mode
    type: SELECT
    values:
      - PREVIEW
      - REVIEW_AND_PUBLISH
    defaults: PREVIEW
  - id: allow_partial
    type: BOOL
    defaults: false
    description: Allow review of a replacement snapshot excluding quarantined IDs; approval must acknowledge the
      omissions.
  - id: notify_slack
    type: BOOL
    defaults: false
  - id: kestra_url
    type: STRING
    defaults: http://localhost:8080
variables:
  sample_geojson: '{"type": "FeatureCollection", "features": [{"type": "Feature", "id": "north", "properties": {"name":
    "Valid zone"}, "geometry": {"type": "Polygon", "coordinates": [[[0, 0], [2, 0], [2, 2], [0, 2], [0, 0]]]}},
    {"type": "Feature", "id": "central", "properties": {"name": "Bow tie"}, "geometry": {"type": "Polygon", "coordinates":
    [[[3, 0], [5, 2], [3, 2], [5, 0], [3, 0]]]}}, {"type": "Feature", "id": "south", "properties": {"name": "Collapsed
    zone"}, "geometry": {"type": "Polygon", "coordinates": [[[6, 0], [7, 0], [8, 0], [6, 0]]]}}, {"type": "Feature",
    "id": "west", "properties": {"name": "Missing zone"}, "geometry": null}]}'
  python_image: python:3.13-slim@sha256:3dd7cc108ec1493442514f5c2a871af6af0ec31d768ff6e378a93340c3b3db5f
tasks:
  - id: choose_source
    type: io.kestra.plugin.core.flow.If
    condition: '{{ inputs.geojson is defined and inputs.geojson is not null }}'
    then:
      - id: manual_source
        type: io.kestra.plugin.core.storage.Concat
        files:
          - '{{ inputs.geojson }}'
    else:
      - id: webhook_source
        type: io.kestra.plugin.core.flow.If
        condition: '{{ trigger.body is defined }}'
        then:
          - id: webhook_geojson
            type: io.kestra.plugin.core.storage.Write
            extension: .geojson
            content: '{{ trigger.body.geojson | toJson }}'
        else:
          - id: example_geojson
            type: io.kestra.plugin.core.storage.Write
            extension: .geojson
            content: '{{ vars.sample_geojson }}'
  - id: source_size
    type: io.kestra.plugin.core.storage.Size
    uri: '{{ outputs.manual_source.uri ?? outputs.webhook_geojson.uri ?? outputs.example_geojson.uri }}'
  - id: bound_source
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - '{{ outputs.source_size.size > 0 and outputs.source_size.size <= 1048576 }}'
  - id: copy_source
    type: io.kestra.plugin.core.storage.Concat
    files:
      - '{{ outputs.manual_source.uri ?? outputs.webhook_geojson.uri ?? outputs.example_geojson.uri }}'
  - id: validate_input
    type: io.kestra.plugin.scripts.python.Script
    description: Bound JSON/coordinates and reject ambiguous IDs/CRS before any spatial work. No geometry repair
      is performed here.
    containerImage: '{{ vars.python_image }}'
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      DATASET: '{{ trigger.body.dataset_id ?? inputs.dataset_id }}'
      WEBHOOK: '{{ (trigger.body ?? null) | toJson }}'
      HAS_FILE: '{{ inputs.geojson is defined and inputs.geojson is not null }}'
    inputFiles:
      source.geojson: '{{ outputs.copy_source.uri }}'
    outputFiles:
      - normalized.json
    script: |
      import hashlib,json,math,os,re
      from pathlib import Path
      raw=Path('source.geojson').read_bytes()
      if not 0<len(raw)<=1048576: raise ValueError('Input must be 1 byte–1 MiB')
      def pairs(items):
       d={}
       for k,v in items:
        if k in d: raise ValueError('Duplicate JSON object key')
        d[k]=v
       return d
      doc=json.loads(raw.decode('utf-8'),object_pairs_hook=pairs,parse_constant=lambda x:(_ for _ in ()).throw(ValueError('Nonfinite number')))
      if not isinstance(doc,dict) or doc.get('type')!='FeatureCollection' or set(doc)-{'type','features'}:raise ValueError('Use an RFC 7946 FeatureCollection with type and features only')
      features=doc.get('features')
      if not isinstance(features,list) or not 1<=len(features)<=100:raise ValueError('Provide 1–100 features')
      ids=set();positions=0
      def scan(value,depth=0):
       global positions
       if depth>12:raise ValueError('Coordinate nesting exceeds limit')
       if isinstance(value,list):
        if value and all(isinstance(x,(int,float)) and not isinstance(x,bool) for x in value):
         if len(value)!=2 or not all(math.isfinite(x) for x in value):raise ValueError('Only finite 2D coordinates supported')
         x,y=value
         if not -180<=x<=180 or not -90<=y<=90:raise ValueError('Coordinates outside longitude/latitude bounds')
         positions+=1
         if positions>10000:raise ValueError('Coordinate limit exceeded')
        else:
         for x in value:scan(x,depth+1)
      for f in features:
       if not isinstance(f,dict) or f.get('type')!='Feature' or set(f)-{'type','id','properties','geometry'}:raise ValueError('Invalid Feature envelope or unsupported foreign members')
       fid=f.get('id')
       if not isinstance(fid,str) or not 1<=len(fid)<=128 or fid in ids:raise ValueError('Unique string feature.id required (1–128 characters)')
       ids.add(fid)
       if f.get('properties') is not None and not isinstance(f['properties'],dict):raise ValueError('properties must be object or null')
       g=f.get('geometry')
       if isinstance(g,dict):
        if 'crs' in g:raise ValueError('Explicit CRS is unsupported')
        scan(g.get('coordinates'))
      webhook=json.loads(os.environ.get('WEBHOOK','null'))
      if webhook is not None:
       if os.environ.get('HAS_FILE','false').lower()=='true':raise ValueError('Manual and webhook sources conflict')
       if not isinstance(webhook,dict) or set(webhook)-{'dataset_id','geojson'} or 'geojson' not in webhook:raise ValueError('Webhook accepts dataset_id and geojson only')
      dataset=os.environ['DATASET']
      if not re.fullmatch(r'[a-z][a-z0-9-]{0,63}',dataset):raise ValueError('Invalid dataset_id')
      Path('normalized.json').write_text(json.dumps(doc,ensure_ascii=False,allow_nan=False))
      print('::'+json.dumps({'outputs':{'source_sha256':hashlib.sha256(raw).hexdigest(),'feature_count':len(features),'coordinate_count':positions}})+'::')
  - id: batch_lifecycle
    type: io.kestra.plugin.core.flow.Sequential
    tasks:
      - id: inspect_schema
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Refuse unknown existing schema objects; PostGIS must already be installed by an administrator.
        url: '{{ secret(''POSTGRES_JDBC_URL'') }}'
        username: '{{ secret(''POSTGRES_USERNAME'') }}'
        password: '{{ secret(''POSTGRES_PASSWORD'') }}'
        fetchType: FETCH_ONE
        sql: |-
          SELECT EXISTS(SELECT 1 FROM pg_extension WHERE extname='postgis') AS postgis,
           EXISTS(SELECT 1 FROM pg_namespace WHERE nspname='blueprint_postgis') AS schema_exists,
           COALESCE((SELECT pg_get_userbyid(nspowner)=current_user FROM pg_namespace WHERE nspname='blueprint_postgis'),true) AS owned,
           (SELECT setting::bigint BETWEEN 1 AND 30000 FROM pg_settings WHERE name='statement_timeout') AS bounded_statement,
           (SELECT setting::bigint BETWEEN 1 AND 5000 FROM pg_settings WHERE name='lock_timeout') AS bounded_lock;
        parameters: {}
        retry:
          type: constant
          interval: PT2S
          maxAttempts: 3
        timeout: PT1M
      - id: check_database
        type: io.kestra.plugin.core.execution.Assert
        conditions:
          - '{{ outputs.inspect_schema.row.postgis }}'
          - '{{ outputs.inspect_schema.row.owned }}'
          - '{{ outputs.inspect_schema.row.bounded_statement }}'
          - '{{ outputs.inspect_schema.row.bounded_lock }}'
      - id: initialize_once
        type: io.kestra.plugin.core.flow.If
        condition: '{{ not outputs.inspect_schema.row.schema_exists }}'
        then:
          - id: initialize_schema
            type: io.kestra.plugin.jdbc.postgresql.Queries
            description: Create only the fixed blueprint-owned schema, versioned tables and invoker-rights functions;
              no application tables or extensions are changed.
            url: '{{ secret(''POSTGRES_JDBC_URL'') }}'
            username: '{{ secret(''POSTGRES_USERNAME'') }}'
            password: '{{ secret(''POSTGRES_PASSWORD'') }}'
            sql: |
              SELECT pg_advisory_xact_lock(497550131);
              CREATE SCHEMA IF NOT EXISTS blueprint_postgis;
              CREATE TABLE IF NOT EXISTS blueprint_postgis.contract (id boolean PRIMARY KEY DEFAULT true CHECK(id), version integer NOT NULL);
              DO $guard$ BEGIN
               IF EXISTS (SELECT 1 FROM blueprint_postgis.contract WHERE version <> 1) THEN RAISE EXCEPTION 'Unsupported blueprint schema version'; END IF;
               IF NOT EXISTS (SELECT 1 FROM blueprint_postgis.contract) THEN
                IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='blueprint_postgis' AND table_name <> 'contract') THEN RAISE EXCEPTION 'Unrecognized nonempty blueprint schema'; END IF;
                INSERT INTO blueprint_postgis.contract VALUES(true,1);
               END IF;
               IF NOT EXISTS (SELECT 1 FROM pg_extension WHERE extname='postgis') THEN RAISE EXCEPTION 'Administrator must install PostGIS first'; END IF;
              END $guard$;
              CREATE TABLE IF NOT EXISTS blueprint_postgis.datasets(dataset_id text PRIMARY KEY, active_version text);
              CREATE TABLE IF NOT EXISTS blueprint_postgis.batches(
               batch_id text PRIMARY KEY, dataset_id text NOT NULL REFERENCES blueprint_postgis.datasets,
               source_sha256 text NOT NULL, payload jsonb NOT NULL, allow_partial boolean NOT NULL,
               baseline text, state text NOT NULL DEFAULT 'STAGED', created_at timestamptz NOT NULL DEFAULT clock_timestamp(),
               expires_at timestamptz NOT NULL DEFAULT clock_timestamp()+interval '24 hours', manifest_sha256 text,
               review_plan jsonb, receipt jsonb);
              CREATE TABLE IF NOT EXISTS blueprint_postgis.staged_features(
               batch_id text REFERENCES blueprint_postgis.batches ON DELETE CASCADE, feature_id text,
               original jsonb NOT NULL, candidate geometry(MultiPolygon,4326), disposition text NOT NULL,
               reason text NOT NULL, problem jsonb, PRIMARY KEY(batch_id,feature_id));
              CREATE TABLE IF NOT EXISTS blueprint_postgis.versions(
               version_id text PRIMARY KEY, dataset_id text NOT NULL, identity_sha256 text NOT NULL,
               manifest_sha256 text NOT NULL, receipt jsonb NOT NULL, UNIQUE(dataset_id,identity_sha256));
              CREATE TABLE IF NOT EXISTS blueprint_postgis.version_features(
               version_id text REFERENCES blueprint_postgis.versions, feature_id text,
               properties jsonb, geom geometry(MultiPolygon,4326) NOT NULL, PRIMARY KEY(version_id,feature_id));
              CREATE VIEW blueprint_postgis.current_features AS
               SELECT d.dataset_id,f.version_id,f.feature_id,f.properties,f.geom
               FROM blueprint_postgis.datasets d JOIN blueprint_postgis.version_features f ON f.version_id=d.active_version;
              CREATE FUNCTION blueprint_postgis.fingerprint(p_batch text) RETURNS text
              LANGUAGE sql STABLE SECURITY INVOKER SET search_path=pg_catalog,public AS $fn$
               SELECT encode(sha256(convert_to(jsonb_build_object(
               'contract',1,'dataset',b.dataset_id,'source',b.source_sha256,'payload',b.payload,
               'allow_partial',b.allow_partial,'baseline',b.baseline,'expires_at',b.expires_at,'repair','linework',
               'review_plan',b.review_plan - 'manifest_sha256',
               'features',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',s.feature_id,'original',s.original,
               'candidate',encode(public.ST_AsEWKB(s.candidate),'hex'),'disposition',s.disposition,'reason',s.reason,'problem',s.problem)
               ORDER BY s.feature_id) FROM blueprint_postgis.staged_features s WHERE s.batch_id=b.batch_id),'[]'::jsonb))::text,'UTF8')),'hex')
               FROM blueprint_postgis.batches b WHERE batch_id=p_batch
              $fn$;
              CREATE FUNCTION blueprint_postgis.stage(p_batch text,p_dataset text,p_source text,p_payload jsonb,p_partial boolean)
              RETURNS jsonb LANGUAGE plpgsql SECURITY INVOKER SET search_path=pg_catalog,public AS $fn$
              DECLARE b blueprint_postgis.batches; f jsonb; g geometry; c geometry; why text; loc jsonb; valid boolean; kind text; msg text; plan jsonb; h text; counts jsonb;
              BEGIN
               IF p_dataset !~ '^[a-z][a-z0-9-]{0,63}$' OR p_source !~ '^[a-f0-9]{64}$' THEN RAISE EXCEPTION 'Invalid dataset or source hash'; END IF;
               INSERT INTO blueprint_postgis.datasets VALUES(p_dataset,NULL) ON CONFLICT DO NOTHING;
               SELECT * INTO b FROM blueprint_postgis.batches WHERE batch_id=p_batch FOR UPDATE;
               IF FOUND THEN
                IF b.dataset_id<>p_dataset OR b.source_sha256<>p_source OR b.payload<>p_payload OR b.allow_partial<>p_partial THEN RAISE EXCEPTION 'Batch retry changed content'; END IF;
                IF b.review_plan IS NOT NULL THEN RETURN b.review_plan; END IF;
                RAISE EXCEPTION 'Incomplete existing batch requires a new execution';
               END IF;
               INSERT INTO blueprint_postgis.batches(batch_id,dataset_id,source_sha256,payload,allow_partial,baseline)
               SELECT p_batch,p_dataset,p_source,p_payload,p_partial,active_version FROM blueprint_postgis.datasets WHERE dataset_id=p_dataset;
               FOR f IN SELECT value FROM jsonb_array_elements(p_payload->'features') LOOP
                g:=NULL;c:=NULL;loc:=NULL;why:='';kind:='QUARANTINED';
                IF f->'geometry' IS NULL OR f->'geometry'='null'::jsonb THEN why:='NULL_GEOMETRY';
                ELSIF COALESCE(f->'geometry'->>'type','') NOT IN ('Polygon','MultiPolygon') THEN why:='UNSUPPORTED_GEOMETRY';
                ELSE
                 BEGIN g:=public.ST_GeomFromGeoJSON(f->'geometry');
                 EXCEPTION WHEN data_exception THEN why:='MALFORMED_GEOMETRY';
                  WHEN internal_error THEN
                   GET STACKED DIAGNOSTICS msg=MESSAGE_TEXT;
                   IF msg ~* 'parse error|non.closed rings|too few points|invalid geojson|invalid geometry|array expected|coordinates|polygon must have' THEN why:='MALFORMED_GEOMETRY'; ELSE RAISE; END IF;
                 END;
                 IF g IS NOT NULL THEN
                  IF public.ST_IsEmpty(g) THEN why:='EMPTY_GEOMETRY';
                  ELSIF public.ST_NDims(g)<>2 OR public.ST_SRID(g)<>4326 THEN RAISE EXCEPTION 'Unsupported coordinate contract';
                  ELSE
                   SELECT d.valid,d.reason,public.ST_AsGeoJSON(d.location)::jsonb INTO valid,why,loc FROM public.ST_IsValidDetail(g) d;
                   c:=CASE WHEN valid THEN g ELSE public.ST_MakeValid(g) END;
                   IF public.ST_IsEmpty(c) OR public.ST_GeometryType(c) NOT IN ('ST_Polygon','ST_MultiPolygon') THEN c:=NULL;kind:='QUARANTINED';why:='NON_POLYGON_REPAIR: '||COALESCE(why,'');
                   ELSIF NOT public.ST_IsValid(c) THEN c:=NULL;why:='INVALID_REPAIR';
                   ELSE c:=public.ST_Multi(c);kind:=CASE WHEN valid THEN 'UNCHANGED' ELSE 'REPAIRED' END;why:=CASE WHEN valid THEN 'VALID' ELSE COALESCE(why,'REPAIRED') END;
                   END IF;
                  END IF;
                 END IF;
                END IF;
                INSERT INTO blueprint_postgis.staged_features VALUES(p_batch,f->>'id',f,c,kind,why,loc);
               END LOOP;
               IF (SELECT COALESCE(sum(public.ST_NPoints(candidate)),0) FROM blueprint_postgis.staged_features WHERE batch_id=p_batch)>20000 THEN RAISE EXCEPTION 'Repair output vertex limit exceeded'; END IF;
               SELECT jsonb_build_object('input',count(*),'unchanged',count(*) FILTER(WHERE disposition='UNCHANGED'),
               'repaired',count(*) FILTER(WHERE disposition='REPAIRED'),'quarantined',count(*) FILTER(WHERE disposition='QUARANTINED'),
               'eligible',count(*) FILTER(WHERE candidate IS NOT NULL)) INTO counts FROM blueprint_postgis.staged_features WHERE batch_id=p_batch;
               IF (counts->>'input')::int<>jsonb_array_length(p_payload->'features') THEN RAISE EXCEPTION 'Classification count mismatch'; END IF;
               h:=NULL;
               SELECT jsonb_build_object('batch_id',p_batch,'dataset_id',p_dataset,'source_sha256',p_source,'manifest_sha256',h,
               'baseline',b2.baseline,'allow_partial',p_partial,'counts',counts,'expires_at',b2.expires_at,
               'publication_eligible',(counts->>'eligible')::int>0 AND (p_partial OR (counts->>'quarantined')::int=0),
               'replacement_warning','Complete replacement: excluded or missing feature IDs will not be in the active dataset.',
               'features',(SELECT jsonb_agg(jsonb_build_object('id',feature_id,'disposition',disposition,'reason',reason,'problem',problem,
               'candidate_parts',CASE WHEN candidate IS NULL THEN NULL ELSE public.ST_NumGeometries(candidate) END) ORDER BY feature_id)
               FROM blueprint_postgis.staged_features WHERE batch_id=p_batch)) INTO plan FROM blueprint_postgis.batches b2 WHERE batch_id=p_batch;
               IF octet_length(plan::text)>4194304 THEN RAISE EXCEPTION 'Review plan too large'; END IF;
               UPDATE blueprint_postgis.batches SET review_plan=plan,state='READY' WHERE batch_id=p_batch;
               h:=blueprint_postgis.fingerprint(p_batch);
               plan:=jsonb_set(plan,'{manifest_sha256}',to_jsonb(h));
               UPDATE blueprint_postgis.batches SET manifest_sha256=h,review_plan=plan WHERE batch_id=p_batch;
               RETURN plan;
              END $fn$;
              CREATE FUNCTION blueprint_postgis.publish(p_batch text,p_fingerprint text,p_partial_ack boolean,p_note text,p_actor text)
              RETURNS jsonb LANGUAGE plpgsql SECURITY INVOKER SET search_path=pg_catalog,public AS $fn$
              DECLARE b blueprint_postgis.batches; current_version text; existing blueprint_postgis.versions; identity_hash text; content_hash text; r jsonb; n integer;
              BEGIN
               SELECT * INTO b FROM blueprint_postgis.batches WHERE batch_id=p_batch FOR UPDATE;
               IF NOT FOUND THEN RAISE EXCEPTION 'Unknown batch'; END IF;
               IF b.receipt IS NOT NULL THEN
                IF b.manifest_sha256<>p_fingerprint THEN RAISE EXCEPTION 'Retry approval fingerprint differs'; END IF;
                RETURN b.receipt;
               END IF;
               IF b.state<>'READY' OR clock_timestamp()>=b.expires_at THEN RAISE EXCEPTION 'Batch not ready or approval expired'; END IF;
               IF p_fingerprint IS DISTINCT FROM b.manifest_sha256 OR blueprint_postgis.fingerprint(p_batch) IS DISTINCT FROM b.manifest_sha256 THEN RAISE EXCEPTION 'Reviewed batch fingerprint changed'; END IF;
               IF COALESCE(p_note,'')='' OR length(p_note)>2000 THEN RAISE EXCEPTION 'Review note required, maximum 2000 characters'; END IF;
               IF NOT (b.review_plan->>'publication_eligible')::boolean THEN RAISE EXCEPTION 'Batch is not publication eligible'; END IF;
               IF (b.review_plan->'counts'->>'quarantined')::int>0 AND NOT p_partial_ack THEN RAISE EXCEPTION 'Partial publication acknowledgement required'; END IF;
               SELECT active_version INTO current_version FROM blueprint_postgis.datasets WHERE dataset_id=b.dataset_id FOR UPDATE;
               identity_hash:=encode(sha256(convert_to(jsonb_build_object('payload',b.payload,'allow_partial',b.allow_partial,'contract',1)::text,'UTF8')),'hex');
               SELECT * INTO existing FROM blueprint_postgis.versions WHERE dataset_id=b.dataset_id AND identity_sha256=identity_hash;
               IF FOUND THEN
                r:=existing.receipt||jsonb_build_object('disposition','ALREADY_PUBLISHED','requested_batch',p_batch,'active_version_observed',current_version);
                UPDATE blueprint_postgis.batches SET state='ALREADY_PUBLISHED',receipt=r WHERE batch_id=p_batch;RETURN r;
               END IF;
               IF current_version IS DISTINCT FROM b.baseline THEN RAISE EXCEPTION 'Active dataset changed while awaiting approval; review a new batch'; END IF;
               SELECT count(*) INTO n FROM blueprint_postgis.staged_features WHERE batch_id=p_batch AND candidate IS NOT NULL;
               SELECT encode(sha256(convert_to(COALESCE(jsonb_agg(jsonb_build_object('id',feature_id,'properties',original->'properties','ewkb',encode(public.ST_AsEWKB(candidate),'hex')) ORDER BY feature_id),'[]'::jsonb)::text,'UTF8')),'hex') INTO content_hash FROM blueprint_postgis.staged_features WHERE batch_id=p_batch AND candidate IS NOT NULL;
               r:=jsonb_build_object('disposition','PUBLISHED','dataset_id',b.dataset_id,'version_id',p_batch,'previous_version',current_version,
               'manifest_sha256',p_fingerprint,'content_sha256',content_hash,'source_sha256',b.source_sha256,'published',n,'quarantined',(b.review_plan->'counts'->>'quarantined')::int,
               'review_note',p_note,'resumed_by',p_actor,'committed_at',clock_timestamp());
               INSERT INTO blueprint_postgis.versions VALUES(p_batch,b.dataset_id,identity_hash,p_fingerprint,r);
               INSERT INTO blueprint_postgis.version_features SELECT p_batch,feature_id,original->'properties',candidate FROM blueprint_postgis.staged_features WHERE batch_id=p_batch AND candidate IS NOT NULL;
               UPDATE blueprint_postgis.datasets SET active_version=p_batch WHERE dataset_id=b.dataset_id;
               UPDATE blueprint_postgis.batches SET state='PUBLISHED',receipt=r WHERE batch_id=p_batch;
               RETURN r;
              END $fn$;
            transaction: true
            fetchType: NONE
      - id: check_contract
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Require the recognized schema contract before reading or writing a batch.
        url: '{{ secret(''POSTGRES_JDBC_URL'') }}'
        username: '{{ secret(''POSTGRES_USERNAME'') }}'
        password: '{{ secret(''POSTGRES_PASSWORD'') }}'
        fetchType: FETCH_ONE
        sql: SELECT version=1 AS compatible FROM blueprint_postgis.contract WHERE id=true;
        parameters: {}
        retry:
          type: constant
          interval: PT2S
          maxAttempts: 3
        timeout: PT1M
      - id: require_contract
        type: io.kestra.plugin.core.execution.Assert
        conditions:
          - '{{ outputs.check_contract.row.compatible ?? false }}'
      - id: expire_stage
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Delete only expired temporary feature rows; preserve every published version and audit receipt.
        url: '{{ secret(''POSTGRES_JDBC_URL'') }}'
        username: '{{ secret(''POSTGRES_USERNAME'') }}'
        password: '{{ secret(''POSTGRES_PASSWORD'') }}'
        fetchType: FETCH_ONE
        sql: WITH expired AS (UPDATE blueprint_postgis.batches SET payload='{}'::jsonb,state=CASE WHEN receipt IS
          NULL THEN 'EXPIRED' ELSE state END WHERE expires_at<clock_timestamp() AND payload<>'{}'::jsonb RETURNING
          batch_id) DELETE FROM blueprint_postgis.staged_features WHERE batch_id IN(SELECT batch_id FROM expired)
          RETURNING batch_id;
        parameters: {}
        retry:
          type: constant
          interval: PT2S
          maxAttempts: 3
        timeout: PT1M
      - id: prepare_batch
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Atomically stage original features, run real PostGIS repairs, quarantine whole unsuitable features
          and seal the review plan.
        url: '{{ secret(''POSTGRES_JDBC_URL'') }}'
        username: '{{ secret(''POSTGRES_USERNAME'') }}'
        password: '{{ secret(''POSTGRES_PASSWORD'') }}'
        fetchType: FETCH_ONE
        sql: |-
          SELECT plan::text AS plan, (plan->>'publication_eligible')::boolean AS eligible,
           plan->>'manifest_sha256' AS manifest_sha256, (plan->'counts'->>'quarantined')::int AS quarantined,
           (plan->'counts'->>'eligible')::int AS eligible_count
           FROM (SELECT blueprint_postgis.stage(:batch,:dataset,:source,CAST(:payload AS jsonb),CAST(:partial AS boolean)) AS plan) p;
        parameters:
          batch: '{{ execution.id }}'
          dataset: '{{ trigger.body.dataset_id ?? inputs.dataset_id }}'
          source: '{{ outputs.validate_input.vars.source_sha256 }}'
          payload: '{{ read(outputs.validate_input.outputFiles[''normalized.json'']) }}'
          partial: '{{ inputs.allow_partial }}'
        retry:
          type: constant
          interval: PT2S
          maxAttempts: 3
        timeout: PT1M
      - id: export_evidence
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Read bounded original/candidate/quarantine documents from the sealed batch; no server-side
          file paths are used.
        url: '{{ secret(''POSTGRES_JDBC_URL'') }}'
        username: '{{ secret(''POSTGRES_USERNAME'') }}'
        password: '{{ secret(''POSTGRES_PASSWORD'') }}'
        fetchType: FETCH_ONE
        sql: |-
          SELECT b.payload::text AS original,
           jsonb_build_object('type','FeatureCollection','features',COALESCE(jsonb_agg(jsonb_build_object('type','Feature','id',s.feature_id,'properties',s.original->'properties','geometry',ST_AsGeoJSON(s.candidate,17)::jsonb) ORDER BY s.feature_id) FILTER(WHERE s.candidate IS NOT NULL),'[]'::jsonb))::text AS candidates,
           COALESCE(jsonb_agg(jsonb_build_object('id',s.feature_id,'original',s.original,'reason',s.reason,'problem',s.problem) ORDER BY s.feature_id) FILTER(WHERE s.disposition='QUARANTINED'),'[]'::jsonb)::text AS quarantine
           FROM blueprint_postgis.batches b JOIN blueprint_postgis.staged_features s USING(batch_id)
           WHERE b.batch_id=:batch GROUP BY b.batch_id;
        parameters:
          batch: '{{ execution.id }}'
        retry:
          type: constant
          interval: PT2S
          maxAttempts: 3
        timeout: PT1M
      - id: bound_evidence
        type: io.kestra.plugin.core.execution.Assert
        conditions:
          - '{{ (outputs.export_evidence.row.original | length) + (outputs.export_evidence.row.candidates | length)
            + (outputs.export_evidence.row.quarantine | length) <= 1000000 }}'
      - id: original_geojson
        type: io.kestra.plugin.core.storage.Write
        extension: .geojson
        content: '{{ outputs.export_evidence.row.original }}'
      - id: candidate_geojson
        type: io.kestra.plugin.core.storage.Write
        extension: .geojson
        content: '{{ outputs.export_evidence.row.candidates }}'
      - id: quarantine_json
        type: io.kestra.plugin.core.storage.Write
        extension: .json
        content: '{{ outputs.export_evidence.row.quarantine }}'
      - id: review_plan
        type: io.kestra.plugin.core.storage.Write
        extension: .json
        content: '{{ outputs.prepare_batch.row.plan }}'
      - id: review_summary
        type: io.kestra.plugin.core.storage.Write
        extension: .md
        content: |
          # PostGIS batch review
          Dataset: {{ trigger.body.dataset_id ?? inputs.dataset_id }}
          Batch: {{ execution.id }}
          Fingerprint: {{ outputs.prepare_batch.row.manifest_sha256 }}
          Eligible: {{ outputs.prepare_batch.row.eligible_count }}; quarantined: {{ outputs.prepare_batch.row.quarantined }}.

          This is a COMPLETE REPLACEMENT snapshot. Missing/quarantined IDs will not exist in the new active dataset. See review-plan JSON for every feature and reason. Compare original and candidate GeoJSON in QGIS. Technical validity does not establish the intended business boundary.

          Original: {{ outputs.original_geojson.uri }}
          Candidates: {{ outputs.candidate_geojson.uri }}
          Quarantine: {{ outputs.quarantine_json.uri }}
      - id: publication_mode
        type: io.kestra.plugin.core.flow.If
        condition: '{{ (trigger.body is not defined) and inputs.mode == ''REVIEW_AND_PUBLISH'' }}'
        then:
          - id: eligible_for_review
            type: io.kestra.plugin.core.flow.If
            condition: '{{ outputs.prepare_batch.row.eligible }}'
            then:
              - id: review_notification
                type: io.kestra.plugin.core.flow.If
                condition: '{{ inputs.notify_slack }}'
                then:
                  - id: notify_review
                    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                    url: '{{ secret(''SLACK_WEBHOOK'') }}'
                    messageText: PostGIS batch {{ execution.id }} needs review. Eligible={{ outputs.prepare_batch.row.eligible_count
                      }}, quarantined={{ outputs.prepare_batch.row.quarantined }}. Complete dataset replacement;
                      inspect reports at {{ inputs.kestra_url }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id
                      }}/{{ execution.id }}
                    retry:
                      type: constant
                      interval: PT2S
                      maxAttempts: 3
              - id: review
                type: io.kestra.plugin.core.flow.Pause
                description: Approve the exact reviewed fingerprint; partial replacement additionally requires acknowledgement.
                  Expiry never resumes publication.
                pauseDuration: PT24H
                behavior: FAIL
                onResume:
                  - id: approved
                    type: BOOL
                    defaults: false
                  - id: reviewed_manifest_sha256
                    type: STRING
                    defaults: ''
                  - id: acknowledge_partial
                    type: BOOL
                    defaults: false
                  - id: review_note
                    type: STRING
                    defaults: ''
              - id: approval_decision
                type: io.kestra.plugin.core.flow.If
                condition: '{{ outputs.review.onResume.approved }}'
                then:
                  - id: publish_version
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    description: In one transaction, recheck the fingerprint, expiry and active-version baseline,
                      then insert immutable data and switch the active pointer; retry returns the same receipt.
                    url: '{{ secret(''POSTGRES_JDBC_URL'') }}'
                    username: '{{ secret(''POSTGRES_USERNAME'') }}'
                    password: '{{ secret(''POSTGRES_PASSWORD'') }}'
                    fetchType: FETCH_ONE
                    sql: SELECT blueprint_postgis.publish(:batch,:hash,CAST(:ack AS boolean),:note,:actor)::text
                      AS receipt;
                    parameters:
                      batch: '{{ execution.id }}'
                      hash: '{{ outputs.review.onResume.reviewed_manifest_sha256 }}'
                      ack: '{{ outputs.review.onResume.acknowledge_partial }}'
                      note: '{{ outputs.review.onResume.review_note }}'
                      actor: '{{ outputs.review.resumed.by ?? ''unavailable'' }}'
                    retry:
                      type: constant
                      interval: PT2S
                      maxAttempts: 3
                    timeout: PT1M
                  - id: verify_version
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    description: Verify the committed immutable version, even if another reviewed version has since
                      become active.
                    url: '{{ secret(''POSTGRES_JDBC_URL'') }}'
                    username: '{{ secret(''POSTGRES_USERNAME'') }}'
                    password: '{{ secret(''POSTGRES_PASSWORD'') }}'
                    fetchType: FETCH_ONE
                    sql: |-
                      SELECT b.receipt::text AS receipt,
                       (count(f.feature_id)=(b.receipt->>'published')::int AND COALESCE(bool_and(ST_IsValid(f.geom) AND NOT ST_IsEmpty(f.geom) AND ST_GeometryType(f.geom)='ST_MultiPolygon'),false)
                       AND v.manifest_sha256=b.receipt->>'manifest_sha256'
                       AND encode(sha256(convert_to(jsonb_agg(jsonb_build_object('id',f.feature_id,'properties',f.properties,'ewkb',encode(ST_AsEWKB(f.geom),'hex')) ORDER BY f.feature_id)::text,'UTF8')),'hex')=b.receipt->>'content_sha256') AS verified,
                       (SELECT active_version FROM blueprint_postgis.datasets WHERE dataset_id=b.dataset_id) AS active_version_observed
                       FROM blueprint_postgis.batches b JOIN blueprint_postgis.versions v ON v.version_id=b.receipt->>'version_id'
                       JOIN blueprint_postgis.version_features f ON f.version_id=v.version_id WHERE b.batch_id=:batch
                       GROUP BY b.batch_id,v.version_id;
                    parameters:
                      batch: '{{ execution.id }}'
                    retry:
                      type: constant
                      interval: PT2S
                      maxAttempts: 3
                    timeout: PT1M
                  - id: require_verified
                    type: io.kestra.plugin.core.execution.Assert
                    conditions:
                      - '{{ outputs.verify_version.row.verified }}'
                  - id: publication_receipt
                    type: io.kestra.plugin.core.storage.Write
                    extension: .json
                    content: '{{ outputs.verify_version.row.receipt }}'
                else:
                  - id: record_rejection
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    description: Record a deliberate rejection without changing the active version.
                    url: '{{ secret(''POSTGRES_JDBC_URL'') }}'
                    username: '{{ secret(''POSTGRES_USERNAME'') }}'
                    password: '{{ secret(''POSTGRES_PASSWORD'') }}'
                    fetchType: FETCH_ONE
                    sql: UPDATE blueprint_postgis.batches SET state='REJECTED' WHERE batch_id=:batch AND receipt
                      IS NULL RETURNING state;
                    parameters:
                      batch: '{{ execution.id }}'
                    retry:
                      type: constant
                      interval: PT2S
                      maxAttempts: 3
                    timeout: PT1M
            else:
              - id: record_block
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: Retain the diagnostic disposition before failing a batch that cannot be published.
                url: '{{ secret(''POSTGRES_JDBC_URL'') }}'
                username: '{{ secret(''POSTGRES_USERNAME'') }}'
                password: '{{ secret(''POSTGRES_PASSWORD'') }}'
                fetchType: FETCH_ONE
                sql: UPDATE blueprint_postgis.batches SET state='BLOCKED' WHERE batch_id=:batch AND receipt IS NULL
                  RETURNING state;
                parameters:
                  batch: '{{ execution.id }}'
                retry:
                  type: constant
                  interval: PT2S
                  maxAttempts: 3
                timeout: PT1M
              - id: block_publication
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: No eligible polygons or quarantine is present while allow_partial=false. Review evidence;
                  nothing published.
        else:
          - id: record_preview
            type: io.kestra.plugin.jdbc.postgresql.Query
            description: Preview creates evidence but never updates the active dataset.
            url: '{{ secret(''POSTGRES_JDBC_URL'') }}'
            username: '{{ secret(''POSTGRES_USERNAME'') }}'
            password: '{{ secret(''POSTGRES_PASSWORD'') }}'
            fetchType: FETCH_ONE
            sql: UPDATE blueprint_postgis.batches SET state='PREVIEWED' WHERE batch_id=:batch AND receipt IS NULL
              RETURNING state;
            parameters:
              batch: '{{ execution.id }}'
            retry:
              type: constant
              interval: PT2S
              maxAttempts: 3
            timeout: PT1M
      - id: read_outcome
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Record preview/rejection/publication distinctly; a committed receipt is never replaced with
          a pretend rollback.
        url: '{{ secret(''POSTGRES_JDBC_URL'') }}'
        username: '{{ secret(''POSTGRES_USERNAME'') }}'
        password: '{{ secret(''POSTGRES_PASSWORD'') }}'
        fetchType: FETCH_ONE
        sql: SELECT COALESCE(receipt,jsonb_build_object('disposition',state,'batch_id',batch_id,'dataset_id',dataset_id,'manifest_sha256',manifest_sha256,'counts',review_plan->'counts'))::text
          AS outcome FROM blueprint_postgis.batches WHERE batch_id=:batch;
        parameters:
          batch: '{{ execution.id }}'
        retry:
          type: constant
          interval: PT2S
          maxAttempts: 3
        timeout: PT1M
      - id: outcome_receipt
        type: io.kestra.plugin.core.storage.Write
        extension: .json
        content: '{{ outputs.read_outcome.row.outcome }}'
    finally:
      - id: cleanup_available
        type: io.kestra.plugin.core.flow.If
        condition: '{{ outputs.check_contract.row.compatible ?? false }}'
        then:
          - id: cleanup_stage
            type: io.kestra.plugin.jdbc.postgresql.Query
            description: Remove only this execution’s stage after evidence exists. Keep the batch audit and committed
              receipt; uncertain/failed pre-export stage expires for later scoped cleanup.
            url: '{{ secret(''POSTGRES_JDBC_URL'') }}'
            username: '{{ secret(''POSTGRES_USERNAME'') }}'
            password: '{{ secret(''POSTGRES_PASSWORD'') }}'
            fetchType: FETCH_ONE
            sql: |-
              WITH marked AS (UPDATE blueprint_postgis.batches SET state=CASE WHEN receipt IS NOT NULL THEN state WHEN state='READY' THEN 'FAILED' ELSE state END,
               payload=CASE WHEN CAST(:exported AS boolean) THEN '{}'::jsonb ELSE payload END
               WHERE batch_id=:batch RETURNING batch_id)
               DELETE FROM blueprint_postgis.staged_features WHERE batch_id IN(SELECT batch_id FROM marked) AND CAST(:exported AS boolean) RETURNING feature_id;
            parameters:
              batch: '{{ execution.id }}'
              exported: '{{ outputs.review_summary.uri is defined }}'
            retry:
              type: constant
              interval: PT2S
              maxAttempts: 3
            timeout: PT1M
errors:
  - id: failure_notification
    type: io.kestra.plugin.core.flow.If
    condition: '{{ inputs.notify_slack }}'
    then:
      - id: notify_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: '{{ secret(''SLACK_WEBHOOK'') }}'
        messageText: 'PostGIS batch failed: {{ flow.namespace }}.{{ flow.id }}, execution {{ execution.id }}. Failed
          task: {{ (errorLogs() | length) > 0 ? errorLogs()[0].taskId : ''unknown'' }}. A receipt means publication
          committed even if verification/notification failed; inspect {{ inputs.kestra_url }}/ui/main/executions/{{
          flow.namespace }}/{{ flow.id }}/{{ execution.id }}'
        retry:
          type: constant
          interval: PT2S
          maxAttempts: 3
triggers:
  - id: preview_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: '{{ secret(''POSTGIS_REVIEW_WEBHOOK_KEY'') }}'
    description: POST dataset_id and geojson; webhook always previews and cannot authorize publication.
outputs:
  - id: original
    type: FILE
    value: '{{ outputs.copy_source.uri ?? null }}'
  - id: candidates
    type: FILE
    value: '{{ outputs.candidate_geojson.uri ?? null }}'
  - id: quarantine
    type: FILE
    value: '{{ outputs.quarantine_json.uri ?? null }}'
  - id: review_plan
    type: FILE
    value: '{{ outputs.review_plan.uri ?? null }}'
  - id: review_summary
    type: FILE
    value: '{{ outputs.review_summary.uri ?? null }}'
  - id: outcome
    type: FILE
    value: '{{ outputs.outcome_receipt.uri ?? null }}'
extend:
  title: Repair PostGIS Polygon Batches with Quarantine and Approved Publication
  metaTitle: PostGIS polygon repair, quarantine and approval | Kestra
  shortDescription: Repair real geographic polygons in staging, preserve originals and quarantine unsuitable shapes.
    Review a fingerprinted batch before atomic versioned publication.
  metaDescription: Repair PostGIS polygon batches, quarantine unsuitable shapes and approve a sealed review plan
    before atomic, versioned publication.
  tags:
    - Data
  subTags:
    - Testing & Quality
    - Approval Gates
  ee: false
  demo: false
  description: |
    Repair GeoJSON service zones in real PostGIS while preserving originals. Validity does not establish the intended boundary.

    ## How it works
    1. Manual input or a keyed webhook supplies a bounded polygon batch. Omitted FILE uses a labelled four-feature example.
    2. Native PostgreSQL tasks stage originals, run ST_MakeValid, quarantine whole unsuitable results and seal a SHA256 review plan.
    3. PREVIEW exports evidence only. REVIEW_AND_PUBLISH pauses for 24 hours; expiry fails. Approval pins the fingerprint and acknowledges any exclusions.
    4. One transaction checks expiry/current-version freshness and publishes an immutable snapshot. Read-back verifies content; finally clears run-owned stage.

    ## What you get
    - Original/candidate GeoJSON: `outputs.copy_source.uri`, `outputs.candidate_geojson.uri`.
    - Reasons and fingerprint: `outputs.quarantine_json.uri`, `outputs.review_plan.uri`.
    - Outcome: `outputs.outcome_receipt.uri`; committed receipt: `outputs.publication_receipt.uri` when published. Failed runs retain earlier task artifacts.
    - Rows in `blueprint_postgis.current_features`; versions/receipts remain.

    ## Who it's for
    GIS/data engineers reviewing service-zone polygons.

    ## Why orchestrate this with Kestra
    Separate database repair, evidence, review and publication with retry-safe receipts and cleanup.

    ## Prerequisites
    PostgreSQL 17/PostGIS 3.5 preinstalled; JDBC/Python plugins and Docker worker. Login owns only blueprint_postgis objects, with database CREATE for first setup; unknown schemas are refused. Set its statement_timeout to 30s and lock_timeout to 5s. Input: 2D RFC 7946, unique string IDs, <=1 MiB/100 features/10,000 positions. No reprojection/component dropping.
    ### Secrets
    POSTGRES_JDBC_URL, POSTGRES_USERNAME, POSTGRES_PASSWORD: database access. POSTGIS_REVIEW_WEBHOOK_KEY: trigger protection. Optional SLACK_WEBHOOK: notifications.

    ## Quick start
    1. Run mode=PREVIEW (SELECT default), dataset_id=service-zones-demo (STRING), allow_partial=false and notify_slack=false (BOOL). Upload geojson (optional FILE) or use the example; kestra_url (STRING) defaults to localhost:8080.
    2. Compare before/after GeoJSON in QGIS and inspect quarantines. Run REVIEW_AND_PUBLISH; quarantine blocks unless allow_partial=true.
    3. Resume with approved=true, reviewed_manifest_sha256, review_note and acknowledge_partial=true for omissions. This COMPLETE REPLACEMENT omits quarantined/missing IDs. Rejection changes nothing. Webhook {dataset_id,geojson} always previews.

    ## How to extend
    Add coverage tests. Never trust invalid-source area. Stale approval fails. Inspect receipts before expiry cleanup after abrupt worker loss. Versions are retained, not automatically rolled back/pruned.

    ## Links
    - [PostgreSQL](https://kestra.io/plugins/plugin-jdbc-postgres/io.kestra.plugin.jdbc.postgresql.query)
    - [ST_MakeValid](https://postgis.net/docs/ST_MakeValid.html)
    - This blueprint has been created by [Biplab Bera](https://github.com/blbera)
