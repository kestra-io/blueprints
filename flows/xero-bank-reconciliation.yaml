id: xero-bank-reconciliation
namespace: company.team

description: |
  Reconcile the bank feed against the Xero ledger the moment a statement import lands, so unmatched
  transactions surface the same morning instead of at month end. A webhook fired by the bank feed
  importer starts the run, and a disabled daily schedule stands ready as the backstop until an
  operator switches it on. The flow writes bank and ledger fixtures, pulls live bank transactions
  from Xero with the fixture as fallback, and matches each bank row by exact amount within a date
  window, then by fuzzy description token overlap. Unmatched rows become exceptions; when their
  count crosses the threshold input the flow opens a GitHub issue with the exception table and
  pings Slack, otherwise it logs a balanced close. Verdict, matched count, exception list and the
  total exception amount in USD are published as typed outputs.

triggers:
  - id: bank_feed_imported
    type: io.kestra.plugin.core.trigger.Webhook
    description: The bank feed importer POSTs here after the statement lands in Xero, so reconciliation starts before anyone works the books.
    key: "{{ secret('BANK_FEED_WEBHOOK_KEY') }}"
  - id: daily_backstop
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled 06:00 UTC net that would re-run reconciliation every morning, shipped off until someone enables it after a missed webhook.
    cron: "0 6 * * *"
    disabled: true

inputs:
  - id: exception_threshold
    type: INT
    defaults: 0
    description: Largest number of unmatched bank transactions that can pass without escalation, zero means the first exception opens an issue.
  - id: match_window_days
    type: INT
    defaults: 3
    description: Largest gap in days between a bank transaction and its ledger entry that still counts as an exact amount match.
  - id: github_repository
    type: STRING
    defaults: acme-corp/finance-ops
    description: Repository that receives the exception table whenever unmatched bank transactions cross the threshold.

tasks:
  - id: reconciliation_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the statement fixtures, the live Xero response and the python matcher all read the same files for the whole run.
    tasks:
      - id: write_feed_fixtures
        type: io.kestra.plugin.scripts.shell.Commands
        description: Write the bank statement fixture with five transactions and the ledger fixture with four invoices and payments, the savings transfer left unmatched so the run has a real exception to catch.
        commands:
          - |
            set -u
            cat > bank.csv <<'BANK_EOF'
            bank_id,date,description,amount,currency
            BANK-1001,2026-10-01,ACME CORP PAYMENT INVOICE 4021,1250.00,USD
            BANK-1002,2026-10-02,OFFICE DEPOT OFFICE SUPPLIES,-214.50,USD
            BANK-1003,2026-10-06,STRIPE PAYOUT BATCH 20261002,842.10,USD
            BANK-1004,2026-10-05,AWS CLOUD HOSTING INVOICE 4022,-1980.00,USD
            BANK-1005,2026-10-07,TRANSFER TO SAVINGS ACCOUNT,-5000.00,USD
            BANK_EOF
            cat > ledger.csv <<'LEDGER_EOF'
            ledger_id,doc_type,date,reference,description,amount,currency
            INV-4021,invoice,2026-09-30,4021,Acme Corp payment for invoice 4021,1250.00,USD
            BILL-778,bill,2026-10-01,778,Office Depot office supplies,214.50,USD
            PAY-0912,payment,2026-10-01,STRIPE-20261002,Stripe payout 20261002,842.10,USD
            INV-4022,invoice,2026-10-05,4022,AWS cloud hosting invoice 4022,1980.00,USD
            LEDGER_EOF
            echo "bank rows: $(($(wc -l < bank.csv) - 1))"
            echo "ledger rows: $(($(wc -l < ledger.csv) - 1))"

      - id: fetch_bank_transactions
        type: io.kestra.plugin.core.http.Request
        description: Pull the live bank transactions from the Xero API with a bearer token, with allowFailed and a retry so an outage degrades to the statement fixture instead of killing the reconciliation.
        method: GET
        uri: https://api.xero.com/api.xro/2.0/BankTransactions
        headers:
          Authorization: "Bearer {{ secret('XERO_API_TOKEN') }}"
          Accept: application/json
        timeout: PT30S
        options:
          allowFailed: true
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT10S
          maxAttempts: 3

      - id: match_transactions
        type: io.kestra.plugin.scripts.python.Script
        description: Match every bank row to a ledger entry by exact amount inside the date window first, then by description token overlap on equal amounts, and emit the verdict with unmatched rows as exceptions.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          MATCH_WINDOW_DAYS: "{{ inputs.match_window_days }}"
          BANK_BODY: "{{ outputs.fetch_bank_transactions.body | default('') }}"
        script: |
          import csv
          import json
          import os
          import re
          from datetime import datetime
          BANK_FILE = "bank.csv"
          LEDGER_FILE = "ledger.csv"
          DEFAULT_WINDOW_DAYS = 3
          FUZZY_OVERLAP_MIN = 0.5
          AMOUNT_EPSILON = 0.005
          TOKEN_RE = re.compile(r"[a-z0-9]+")
          def as_float(value):
              try:
                  return float(str(value).replace(",", "").replace("$", "").strip())
              except (TypeError, ValueError):
                  return None
          def parse_date(value):
              text = (value or "").strip()
              for fmt in ("%Y-%m-%d", "%d/%m/%Y", "%m/%d/%Y"):
                  try:
                      return datetime.strptime(text[:10], fmt).date()
                  except ValueError:
                      continue
              return None
          def tokens(text):
              return {t for t in TOKEN_RE.findall((text or "").lower()) if len(t) >= 3}
          def overlap(left, right):
              return len(left & right) / float(len(left | right)) if left and right else 0.0
          def read_csv(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return []
              try:
                  with open(path, "r", encoding="utf-8") as handle:
                      text = handle.read().strip()
                  return list(csv.DictReader(text.splitlines())) if text else []
              except (OSError, csv.Error, TypeError):
                  return []
          def make_row(bank_id, date, description, amount, currency):
              return {
                  "bank_id": bank_id, "date": date.isoformat(), "description": description,
                  "amount": round(abs(amount), 2), "currency": currency, "matched": False,
                  "_day": date, "_tokens": tokens(description),
              }
          def bank_records(rows):
              out = []
              for row in rows:
                  amount = as_float(row.get("amount"))
                  date = parse_date(row.get("date"))
                  if amount is None or date is None:
                      continue
                  desc = (row.get("description") or "").strip()
                  ref = (row.get("bank_id") or "").strip() or ("BANK-%04d" % (len(out) + 1))
                  curr = (row.get("currency") or "USD").strip().upper() or "USD"
                  out.append(make_row(ref, date, desc, amount, curr))
              return out
          def live_records(document):
              if isinstance(document, dict):
                  rows = document.get("BankTransactions") or document.get("data") or []
              elif isinstance(document, list):
                  rows = document
              else:
                  return []
              out = []
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  amount = as_float(row["Total"] if row.get("Total") is not None else row.get("total"))
                  date = parse_date(row.get("Date") or row.get("date"))
                  if amount is None or date is None:
                      continue
                  desc = str(row.get("Description") or row.get("description") or "").strip()
                  ref = str(row.get("BankTransactionID") or row.get("id") or "").strip()
                  out.append(make_row(ref or ("BANK-%04d" % (len(out) + 1)), date, desc, amount, "USD"))
              return out
          def ledger_records(rows):
              out = []
              for row in rows:
                  amount = as_float(row.get("amount"))
                  date = parse_date(row.get("date"))
                  if amount is None or date is None:
                      continue
                  out.append({"amount": round(abs(amount), 2), "matched": False,
                              "_day": date, "_tokens": tokens(row.get("description"))})
              return out
          try:
              window_days = int(float(os.environ.get("MATCH_WINDOW_DAYS", "")))
          except (TypeError, ValueError):
              window_days = DEFAULT_WINDOW_DAYS
          if window_days < 0:
              window_days = DEFAULT_WINDOW_DAYS
          raw_body = (os.environ.get("BANK_BODY", "") or "").strip()
          live = None
          if raw_body:
              try:
                  live = live_records(json.loads(raw_body))
              except ValueError:
                  live = None
          bank_rows, source = (live, "live") if live else (bank_records(read_csv(BANK_FILE)), "fixture")
          ledger_rows = ledger_records(read_csv(LEDGER_FILE))
          matched_count = 0
          for bank_row in bank_rows:
              for ledger_row in ledger_rows:
                  if ledger_row["matched"] or abs(ledger_row["amount"] - bank_row["amount"]) > AMOUNT_EPSILON:
                      continue
                  if abs((bank_row["_day"] - ledger_row["_day"]).days) <= window_days:
                      ledger_row["matched"] = bank_row["matched"] = True
                      matched_count += 1
                      break
          for bank_row in bank_rows:
              if bank_row["matched"]:
                  continue
              best_row, best_score = None, 0.0
              for ledger_row in ledger_rows:
                  if ledger_row["matched"] or abs(ledger_row["amount"] - bank_row["amount"]) > AMOUNT_EPSILON:
                      continue
                  score = overlap(bank_row["_tokens"], ledger_row["_tokens"])
                  if score >= FUZZY_OVERLAP_MIN and score > best_score:
                      best_row, best_score = ledger_row, score
              if best_row is not None:
                  best_row["matched"] = bank_row["matched"] = True
                  matched_count += 1
          exceptions = [
              {"bank_id": row["bank_id"], "date": row["date"], "description": row["description"],
               "amount": row["amount"], "currency": row["currency"],
               "reason": "unmatched_bank_transaction"}
              for row in bank_rows if not row["matched"]
          ]
          total_exceptions_usd = float(round(sum(row["amount"] for row in exceptions), 2))
          matched_count = int(matched_count)
          if not bank_rows or not ledger_rows:
              verdict = "NO_DATA"
          elif exceptions:
              verdict = "EXCEPTIONS_FOUND"
          else:
              verdict = "BALANCED"
          print("::" + json.dumps({"outputs": {"verdict": verdict, "matched_count": matched_count, "exceptions": exceptions, "total_exceptions_usd": total_exceptions_usd}}) + "::")
  - id: build_exception_report
    type: io.kestra.plugin.core.flow.Loop
    description: Walk the exception list so every unmatched bank transaction leaves a plain text line in recon-report.txt beside the GitHub table.
    values: "{{ outputs.match_transactions.vars.exceptions }}"
    tasks:
      - id: append_recon_line
        type: io.kestra.plugin.scripts.shell.Commands
        description: Append this exception as one pipe-delimited recon-report.txt line with the bank id, date, description, amount, currency and reason.
        commands:
          - |
            printf '%s | %s | %s | %.2f | %s | %s\n' "{{ each.bank_id }}" "{{ each.date }}" "{{ each.description }}" {{ each.amount }} "{{ each.currency }}" "{{ each.reason }}" >> recon-report.txt
            echo "appended {{ each.bank_id }} to recon-report.txt"

  - id: exception_gate
    type: io.kestra.plugin.core.flow.If
    description: Escalate whenever the unmatched count crosses the threshold input, a zero threshold means the first exception opens an issue.
    condition: "{{ (outputs.match_transactions.vars.exceptions | length) > inputs.exception_threshold }}"
    then:
      - id: open_exception_issue
        type: io.kestra.plugin.github.issues.Create
        description: Open a labeled issue holding a markdown table of every unmatched bank transaction with its date, description, amount and reason, so bookkeeping owns a backlog record.
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "Xero bank reconciliation exceptions - {{ outputs.match_transactions.vars.exceptions | length }} unmatched, verdict {{ outputs.match_transactions.vars.verdict }}"
        body: |
          ## Unmatched bank transactions

          | Bank ID | Date | Description | Amount | Currency | Reason |
          | --- | --- | --- | --- | --- | --- |
          {% for row in outputs.match_transactions.vars.exceptions %}| {{ row.bank_id }} | {{ row.date }} | {{ row.description }} | {{ row.amount }} | {{ row.currency }} | {{ row.reason }} |
          {% endfor %}

          Verdict `{{ outputs.match_transactions.vars.verdict }}`, {{ outputs.match_transactions.vars.matched_count }} bank transaction(s) matched, {{ outputs.match_transactions.vars.exceptions | length }} exception(s) worth {{ outputs.match_transactions.vars.total_exceptions_usd }} USD against a threshold of {{ inputs.exception_threshold }}.

          Execution `{{ execution.id }}`.

          Post the missing invoices or payments to Xero, then re-run. Raise `match_window_days` only when the bank clears transactions late on purpose, and raise `exception_threshold` only for a known one-off feed gap bookkeeping already triaged.

        labels:
          - bank-reconciliation
          - xero

      - id: alert_finance_ops
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Tell the finance ops channel how many bank transactions went unmatched, what they are worth in USD and where the exception table was filed.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Xero bank reconciliation - verdict {{ outputs.match_transactions.vars.verdict }}, {{ outputs.match_transactions.vars.matched_count }} matched, {{ outputs.match_transactions.vars.exceptions | length }} exception(s) worth {{ outputs.match_transactions.vars.total_exceptions_usd }} USD over threshold {{ inputs.exception_threshold }}. Exception table opened in {{ inputs.github_repository }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_balanced
        type: io.kestra.plugin.core.log.Log
        description: Record the balanced close so the execution history proves every bank transaction found its ledger entry.
        message: "Bank reconciliation balanced - verdict {{ outputs.match_transactions.vars.verdict }}, {{ outputs.match_transactions.vars.matched_count }} transaction(s) matched, nothing over the {{ inputs.exception_threshold }} exception threshold, nothing to escalate."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.match_transactions.vars.verdict }}"
  - id: matched_count
    type: INT
    value: "{{ outputs.match_transactions.vars.matched_count }}"
  - id: exceptions
    type: ARRAY
    value: "{{ outputs.match_transactions.vars.exceptions | toJson }}"
  - id: total_exceptions_usd
    type: FLOAT
    value: "{{ outputs.match_transactions.vars.total_exceptions_usd }}"

extend:
  title: Reconcile the Bank Feed Against the Xero Ledger After Every Import
  metaTitle: Xero Bank Feed Reconciliation with GitHub and Slack
  shortDescription: Matches imported bank transactions against Xero invoices and payments, flags unmatched rows as exceptions and escalates through GitHub and Slack.
  metaDescription: Match imported bank transactions against Xero, flag unmatched rows as exceptions, and escalate through GitHub and Slack when the count crosses the threshold.
  description: |
    ## How it works

    1. `bank_feed_imported` (`io.kestra.plugin.core.trigger.Webhook`, keyed with the `BANK_FEED_WEBHOOK_KEY` secret) starts reconciliation the moment the bank feed importer finishes loading the statement into Xero. `daily_backstop` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * *`) is the morning net and ships `disabled: true` until an operator turns it on for the case where the webhook never fired.
    2. `reconciliation_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared directory so the fixtures, the live response and the matcher all read the same files. `write_feed_fixtures` (`io.kestra.plugin.scripts.shell.Commands`) writes `bank.csv` with five statement rows and `ledger.csv` with four invoices and payments, the savings transfer left unmatched and the Stripe payout five days from its ledger date so only the fuzzy pass can pair it.
    3. `fetch_bank_transactions` (`io.kestra.plugin.core.http.Request`) calls `GET https://api.xero.com/api.xro/2.0/BankTransactions` with a `Bearer` token from the `XERO_API_TOKEN` secret. `options.allowFailed: true` with an exponential retry means a Xero outage degrades to the statement fixture instead of failing the reconciliation.
    4. `match_transactions` (`io.kestra.plugin.scripts.python.Script`) prefers the live response handed over in `BANK_BODY`, falls back to `bank.csv` when the API gave nothing usable, then runs two passes. The first pairs a bank row with an equal ledger amount whose date sits inside `match_window_days`. The second pairs the leftovers on equal amount plus description token overlap of at least 0.5. Anything still alone becomes an exception, printed as one `::{"outputs": ...}::` line carrying `verdict`, `matched_count`, `exceptions` and `total_exceptions_usd`.
    5. `build_exception_report` (`io.kestra.plugin.core.flow.Loop`) walks the exception list and `append_recon_line` (`io.kestra.plugin.scripts.shell.Commands`) writes one pipe-delimited line per exception into `recon-report.txt`. `exception_gate` (`io.kestra.plugin.core.flow.If`) then branches on the exception count crossing `exception_threshold`, so a zero threshold escalates on the first unmatched row. The escalation branch opens `open_exception_issue` (`io.kestra.plugin.github.issues.Create`) with the markdown exception table and posts `alert_finance_ops` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`), while the other branch records `log_balanced`. The flow level `errors` handler reports any failure with the execution id, since a broken reconciliation looks exactly like a clean feed in the logs.

    ## What you get

    - `verdict` (STRING): `EXCEPTIONS_FOUND` when at least one bank transaction is unmatched, `BALANCED` when every row found a ledger entry, `NO_DATA` when either side could not be read.
    - `matched_count` (INT): how many bank transactions found a ledger entry across both passes.
    - `exceptions` (ARRAY): one object per unmatched bank transaction with `bank_id`, `date`, `description`, `amount`, `currency` and `reason`.
    - `total_exceptions_usd` (FLOAT): the dollar total sitting in the exception list, the number the threshold gate weighs, plus a GitHub issue, a Slack message and a `recon-report.txt` trail whenever it crosses the threshold.

    ## Who it's for

    - Finance controllers who need every statement line tied to a Xero invoice or payment before the close, and bookkeeping leads who would rather triage a GitHub exception table than scan the bank feed by eye.
    - Ops engineers who wire the bank feed importer into an automated nightly check with a clear pass or escalate signal.

    ## Why orchestrate this with Kestra

    Reconciling the feed by hand only happens when somebody remembers, and it leaves no record of what was skipped. Kestra supplies the webhook from the importer and the disabled morning backstop, the shared workspace that keeps the fixtures beside the live Xero response, the loop that builds the plain text report, and the gate that separates a balanced feed from an exception list routed to GitHub and Slack. The verdict, the matched count, the exception list and the USD total are typed outputs, so a close checklist or a dashboard can read the state without scraping logs, and the `errors` handler keeps a broken run visible.

    ## Prerequisites

    - A Kestra worker with python available to the process runner and outbound HTTPS access to the Xero API.
    - A Xero tenant with bank feed data and an API token able to read `BankTransactions`, or a stub of that endpoint while you trial the flow.
    - A GitHub token able to open issues in the repository named by `github_repository` (classic PAT scope `repo`, or fine-grained **Issues: write**), and a Slack incoming webhook for the exception and failure alerts.

    ### Secrets

    - `BANK_FEED_WEBHOOK_KEY`: key segment guarding the webhook URL, so only the bank feed importer can start a run.
    - `XERO_API_TOKEN`: bearer token sent to the Xero bank transactions endpoint by `fetch_bank_transactions`.
    - `GITHUB_TOKEN`: token used by `open_exception_issue` to file the exception table.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for the exception alert and for failure alerts.

    ## Quick start

    1. Add the four secrets to your namespace and import the flow.
    2. Run once with the default inputs and confirm `verdict` reads `EXCEPTIONS_FOUND`, `matched_count` reads 4, the exception list carries the savings transfer, and `total_exceptions_usd` reads 5000.0.
    3. Point `github_repository` at a repository where issues are welcome, then re-run with `exception_threshold` at 1 to watch the gate close while the outputs still report the exception.
    4. Trigger `bank_feed_imported` at `/api/v1/{tenant}/executions/webhook/{namespace}/xero-bank-reconciliation/{BANK_FEED_WEBHOOK_KEY}`, or set `disabled: false` on `daily_backstop` once the token and webhook are in place.

    ## How to extend

    - Add a third pass that matches on the Xero reference field before falling back to description tokens, keep the same exception shape, or replace the fixture heredocs with a `io.kestra.plugin.jdbc.postgresql.Queries` task that reads posted invoices straight from the ledger database.
    - Loop the exception list with `io.kestra.plugin.core.flow.ForEach` to open one issue per unmatched bank row when bookkeeping wants per-owner triage.

    ## Links

    - [Kestra HTTP request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra GitHub plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra flow triggers](https://kestra.io/docs/concepts/triggers)
  tags:
    - Business
    - Data
  subTags:
    - bank-reconciliation
    - xero
    - accounting
    - exceptions
  ee: false
  demo: false
