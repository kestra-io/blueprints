id: csv-schema-contract-validator
namespace: company.team
description: |
  Validate an inbound CSV against a JSON schema contract — required columns,
  types, and row limits — and alert Slack when the contract breaks.

triggers:
  - id: file_arrival_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call from your upload or storage pipeline when a new CSV lands.
    key: csv-contract-check
  - id: daily_validation
    type: io.kestra.plugin.core.trigger.Schedule
    description: Optional daily re-validation of the same URL; shipped disabled.
    cron: "0 7 * * *"
    disabled: true

inputs:
  - id: csv_url
    type: STRING
    defaults: https://example.com/data.csv
    description: URL of the CSV to validate.
  - id: schema_json
    type: JSON
    defaults: '{"required_columns": ["id", "name", "email"], "max_rows": 100000, "non_empty_columns": ["id", "email"]}'
    description: Contract — required columns, row limit, and columns that must never be empty.

tasks:
  - id: validate_csv
    type: io.kestra.plugin.scripts.python.Script
    description: Download the CSV, check required columns exist, enforce the row limit, count empty cells, and emit validation results.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      CSV_URL: "{{ inputs.csv_url }}"
      SCHEMA: '{{ inputs.schema_json | toJson }}'
    script: |
      import csv
      import io
      import json
      import os
      import sys
      import requests
      from kestra import Kestra

      schema = json.loads(os.environ["SCHEMA"])
      csv_url = os.environ.get("CSV_URL", "")

      try:
          resp = requests.get(csv_url, timeout=30)
          resp.raise_for_status()
          text = resp.text
      except Exception as exc:
          print(f"CRITICAL: Failed to download CSV from {csv_url}: {exc}", file=sys.stderr)
          sys.exit(1)

      reader = csv.DictReader(io.StringIO(text))
      rows = list(reader)
      violations = []
      missing = [c for c in schema.get("required_columns", []) if c not in (reader.fieldnames or [])]
      if missing:
          violations.append(f"missing columns: {missing}")
      if len(rows) > schema.get("max_rows", float("inf")):
          violations.append(f"row count {len(rows)} exceeds {schema['max_rows']}")
      for col in schema.get("non_empty_columns", []):
          if col in (reader.fieldnames or []):
              empty = sum(1 for row in rows if not (row.get(col) or "").strip())
              if empty:
                  violations.append(f"column '{col}' has {empty} empty rows")

      is_valid = (len(violations) == 0)
      print(f"Validation complete: rows={len(rows)}, violations={len(violations)}, valid={is_valid}")

      report = {
          "rows": len(rows),
          "violations": violations,
          "valid": is_valid
      }

      with open("csv_validation_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "rows": len(rows),
          "violations": violations,
          "valid": is_valid
      })
    outputFiles:
      - csv_validation_report.json

  - id: check_contract
    type: io.kestra.plugin.core.flow.If
    description: Valid -> log the pass; violations -> Slack with the actual violation list.
    condition: "{{ outputs.validate_csv.vars.valid }}"
    then:
      - id: log_valid
        type: io.kestra.plugin.core.log.Log
        description: Record each passing validation so quiet weeks are visible too.
        message: "CSV contract passed for {{ inputs.csv_url }}: {{ outputs.validate_csv.vars.rows }} rows validated."
    else:
      - id: alert_violations
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the violations list — not just 'invalid' — so the producer can fix the file.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":x: CSV contract BROKEN for {{ inputs.csv_url }} — {{ outputs.validate_csv.vars.violations }}. Execution {{ execution.id }}."
          }

errors:
  - id: alert_validation_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when validation itself errors.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "CSV contract validation FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.csv_url }}. Check the URL and schema_json."
      }

outputs:
  - id: validation_result
    type: JSON
    description: 'Row count, violations, and validity flag.'
    value: "{{ outputs.validate_csv.vars | toJson }}"

extend:
  title: Validate CSVs Against a Schema Contract
  shortDescription: Downloads a CSV, checks required columns, row limits, and empty cells against a JSON contract, and alerts Slack on violations.
  metaTitle: CSV Schema Contract Validator
  metaDescription: Enforce a CSV schema contract on inbound files — columns, row limits, non-empty fields — and alert on breakage.
  description: |
    ## How it works
    This workflow downloads an inbound CSV, validates header structure against expected columns, verifies row count limits, ensures critical fields are non-empty, and triggers Slack notifications when schema contracts are breached.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[file_arrival_webhook Webhook] --> B[validate_csv Python Script]
      B --> C{Is Contract Valid?}
      C -- Yes --> D[log_valid Log]
      C -- No --> E[alert_violations Webhook]
    ```

    ## Prerequisites
    - Outbound HTTP access to CSV source URL.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `csv_url` and `schema_json`.
    3. Run manually or call via webhook.

    ## Links
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Quality Assurance
    - Day 2 Operations
  ee: false
  demo: false
