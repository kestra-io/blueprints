id: csv-schema-contract-validator
namespace: company.team
description: |
  Validate an inbound CSV against a JSON schema contract — required columns,
  types, and row limits — and alert Slack when the contract breaks.

triggers:
  - id: file_arrival_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call from your upload or storage pipeline when a new CSV lands.
    key: csv-contract-check
  - id: daily_validation
    type: io.kestra.plugin.core.trigger.Schedule
    description: Optional daily re-validation of the same URL; shipped disabled.
    cron: "0 7 * * *"
    disabled: true

inputs:
  - id: csv_url
    type: STRING
    defaults: https://example.com/data.csv
    description: URL of the CSV to validate.
  - id: schema_json
    type: JSON
    defaults: '{"required_columns": ["id", "name", "email"], "max_rows": 100000, "non_empty_columns": ["id", "email"]}'
    description: Contract — required columns, row limit, and columns that must never be empty.

tasks:
  - id: validate_csv
    type: io.kestra.plugin.scripts.python.Script
    description: Download the CSV, check required columns exist, enforce the row limit, count empty cells in non-empty columns, and emit violations via the stdout outputs protocol.
    containerImage: python:3.11-slim
    warningOnStdErr: false
    env:
      CSV_URL: "{{ inputs.csv_url }}"
      SCHEMA: '{{ inputs.schema_json | toJson }}'
    script: |
      import csv, io, json, os, urllib.request

      schema = json.loads(os.environ["SCHEMA"])
      with urllib.request.urlopen(os.environ["CSV_URL"], timeout=60) as r:
          text = r.read().decode("utf-8", "replace")
      reader = csv.DictReader(io.StringIO(text))
      rows = list(reader)
      violations = []
      missing = [c for c in schema.get("required_columns", []) if c not in (reader.fieldnames or [])]
      if missing:
          violations.append(f"missing columns: {missing}")
      if len(rows) > schema.get("max_rows", float("inf")):
          violations.append(f"row count {len(rows)} exceeds {schema['max_rows']}")
      for col in schema.get("non_empty_columns", []):
          if col in (reader.fieldnames or []):
              empty = sum(1 for row in rows if not (row.get(col) or "").strip())
              if empty:
                  violations.append(f"column '{col}' has {empty} empty rows")
      print(f"rows: {len(rows)}, violations: {len(violations)}")
      print("::" + json.dumps({"outputs": {"rows": len(rows), "violations": violations, "valid": len(violations) == 0}}) + "::")

  - id: check_contract
    type: io.kestra.plugin.core.flow.If
    description: Valid → log the pass; violations → Slack with the actual violation list.
    condition: "{{ outputs.validate_csv.vars.valid }}"
    then:
      - id: log_valid
        type: io.kestra.plugin.core.log.Log
        description: Record each passing validation so quiet weeks are visible too.
        message: "CSV contract passed for {{ inputs.csv_url }}: {{ outputs.validate_csv.vars.rows }} rows validated."
    else:
      - id: alert_violations
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the violations list — not just "invalid" — so the producer can fix the file.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":x: CSV contract BROKEN for {{ inputs.csv_url }} — {{ outputs.validate_csv.vars.violations }}. Execution {{ execution.id }}."
          }

errors:
  - id: alert_validation_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when validation itself errors — an unreadable file must not pass as valid.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "CSV contract validation FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.csv_url }}. Check the URL and schema_json."
      }

outputs:
  - id: validation_result
    type: JSON
    description: 'Row count, violations, and validity flag, e.g. {"rows": 1204, "violations": [], "valid": true}.'
    value: "{{ outputs.validate_csv.vars | toJson }}"

extend:
  title: Validate CSVs Against a Schema Contract
  shortDescription: Downloads a CSV, checks required columns, row limits, and empty cells against a JSON contract, and alerts Slack on violations.
  metaTitle: CSV Schema Contract Validator
  metaDescription: Enforce a CSV schema contract on inbound files — columns, row limits, non-empty fields — and alert on breakage.
  description: |
    Every integration dies the same way: a partner adds a column, drops one, or sends 4M rows instead of 40k. This blueprint validates inbound CSVs against a JSON contract — required columns, a row ceiling, and columns that must never be empty — and tells Slack exactly which rule broke when one does.

    ## How it works

    1. `validate_csv` (`io.kestra.plugin.scripts.python.Script`) downloads the CSV, inspects headers and rows, and emits `rows`, `violations`, `valid` via the `::{"outputs": ...}::` protocol.
    2. `check_contract` (`io.kestra.plugin.core.flow.If`) branches: valid → `log_valid`; violations → `alert_violations` with the violation list.
    3. The `errors` block alerts Slack when the file can't be read or the schema is malformed.
    4. Triggers: a `Webhook` (`csv-contract-check`) for upload pipelines plus a disabled daily `Schedule`.

    ## What you get

    - A real contract gate on partner/vendor files.
    - Violation messages that name the rule that broke.
    - `validation_result` JSON for routing or quarantine steps.

    ## Who it's for

    - Data teams ingesting vendor or partner CSVs.
    - RevOps teams expecting clean CRM exports.
    - Anyone who has debugged "the file format changed" at 11pm.

    ## Why orchestrate this with Kestra

    A pandas snippet in a wiki tells you once; the flow runs it on every arrival, branches on the result, alerts, and logs — and the next step (quarantine the file, open a ticket, notify the vendor) is one task away.

    ## Prerequisites

    - The CSV URL reachable from the Kestra Worker.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for violation and failure alerts.

    ## Quick start

    1. Add the Slack webhook secret.
    2. Set `csv_url` and adjust `schema_json` to your contract.
    3. Run once and read `validation_result`.
    4. Wire the `csv-contract-check` webhook into your ingestion pipeline.

    ## How to extend

    - Quarantine rejected files by moving them to an S3 prefix.
    - ForEach over several inbound files with per-file contracts.
    - Add type checks per column (dates parseable, emails shaped).

    ## Links

    - [CSV Data Description Format](https://tools.ietf.org/html/rfc4180)
    - [Kestra Webhook trigger](https://kestra.io/plugins/triggers/webhook)
  tags:
    - Data
    - Quality
  subTags:
    - Data Contracts
    - Validation
  ee: false
  demo: false
