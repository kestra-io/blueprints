id: jenkins-stuck-build-watchdog
namespace: company.team
description: |
  Poll a Jenkins job's latest build via Jenkins' own REST API, classify it
  RUNNING_OK, STUCK (running past an acceptable duration), HEALTHY
  (finished with result SUCCESS), or FAILED (finished with any other
  result), and alert Slack on anything but a clean, finished build.

triggers:
  - id: periodic_build_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Checks every 15 minutes - a hung executor holds an agent slot for every minute it runs, so this needs a tighter cadence than a weekly compliance sweep. Shipped disabled; enable it once jenkins_url and job_name point at a real job and a manual run has been verified."
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      jenkins_url: "http://localhost:8080"
      job_name: "test"
      max_stuck_minutes: 60

inputs:
  - id: jenkins_url
    type: STRING
    displayName: "Jenkins Base URL"
    defaults: "http://localhost:8080"
    description: "Base HTTP(S) endpoint of the Jenkins controller, used both for the lastBuild/buildNumber lookup and as serverUrl on the io.kestra.plugin.jenkins.JobInfo task."

  - id: job_name
    type: STRING
    displayName: "Jenkins Job Name"
    defaults: "test"
    description: "Job name or foldered path (segments separated by /) to audit, matching Kestra's own io.kestra.plugin.jenkins.JobInfo documentation example."

  - id: max_stuck_minutes
    type: INT
    displayName: "Max Acceptable Running Duration (minutes)"
    defaults: 60
    description: "Above this many minutes since the latest build started, a still-running (building=true) build is classified STUCK."

tasks:
  - id: get_latest_build_number
    type: io.kestra.plugin.core.http.Request
    description: "Jenkins' own lastBuild/buildNumber endpoint returns the newest build number as plain text (verified Jenkins REST API behavior), avoiding a job-level /api/json parse just to discover which build to audit. Authorization is only needed if the Jenkins controller has security enabled; a local QuickStart with security disabled ignores the header."
    method: GET
    uri: "{{ inputs.jenkins_url }}/job/{{ inputs.job_name }}/lastBuild/buildNumber"
    headers:
      Authorization: "Basic {{ (secret('JENKINS_USERNAME') ~ ':' ~ secret('JENKINS_API_TOKEN')) | base64encode }}"
    allowFailure: false

  - id: probe_latest_build
    type: io.kestra.plugin.jenkins.JobInfo
    description: "Fetches the full build JSON from Jenkins' own /api/json endpoint for the build number discovered above. Reads info.building, info.result, and info.timestamp - all verified from Jenkins' own REST API documentation (building: boolean, true while the build is still running; result: string, null while building, SUCCESS/FAILURE/UNSTABLE/ABORTED once finished; timestamp: epoch milliseconds when the build started)."
    serverUrl: "{{ inputs.jenkins_url }}"
    username: "{{ secret('JENKINS_USERNAME') }}"
    apiToken: "{{ secret('JENKINS_API_TOKEN') }}"
    jobName: "{{ inputs.job_name }}"
    buildNumber: "{{ outputs.get_latest_build_number.body | trim | number }}"

  - id: evaluate_still_building
    type: io.kestra.plugin.core.flow.If
    description: "Splits on whether the latest build is still running at all, before deciding STUCK vs HEALTHY/FAILED - a build that already finished is never STUCK, regardless of how long it took."
    condition: "{{ outputs.probe_latest_build.info.building == true }}"
    then:
      - id: evaluate_stuck
        type: io.kestra.plugin.core.flow.If
        description: "STUCK when the running build started before the max_stuck_minutes cutoff. Both sides are compared as UTC ISO-8601 strings (Jenkins' epoch-millis timestamp converted with jq's todate, against now() minus max_stuck_minutes) rather than raw epoch math, since no verified Kestra Pebble filter returns the current time as epoch milliseconds."
        condition: "{{ (outputs.probe_latest_build.info.timestamp | jq('. / 1000 | todate') | first) < (now() | dateAdd(0 - inputs.max_stuck_minutes, 'MINUTES') | date(\"yyyy-MM-dd'T'HH:mm:ss'Z'\", timeZone='UTC')) }}"
        then:
          - id: alert_stuck_build
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: "Always alert on STUCK so an on-call engineer sees the hung executor without opening the Jenkins UI."
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "Jenkins stuck build watchdog: STUCK. Job {{ inputs.job_name }} build #{{ outputs.probe_latest_build.info.number }} has been running past {{ inputs.max_stuck_minutes }} minutes (started {{ outputs.probe_latest_build.info.timestamp | jq('. / 1000 | todate') | first }}). Execution {{ execution.id }}."
              }
        else:
          - id: log_running_ok
            type: io.kestra.plugin.core.log.Log
            message: "RUNNING_OK: {{ inputs.job_name }} build #{{ outputs.probe_latest_build.info.number }} is still running but within {{ inputs.max_stuck_minutes }} minutes of its start."
    else:
      - id: evaluate_result
        type: io.kestra.plugin.core.flow.If
        description: "HEALTHY only when the finished build's own result is exactly SUCCESS; any other finished result (FAILURE, UNSTABLE, ABORTED, or an unexpected value) counts as FAILED."
        condition: "{{ outputs.probe_latest_build.info.result == 'SUCCESS' }}"
        then:
          - id: log_build_healthy
            type: io.kestra.plugin.core.log.Log
            message: "HEALTHY: {{ inputs.job_name }} build #{{ outputs.probe_latest_build.info.number }} finished with result SUCCESS."
        else:
          - id: alert_build_failed
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: "Always alert on a finished, non-SUCCESS result."
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "Jenkins stuck build watchdog: FAILED. Job {{ inputs.job_name }} build #{{ outputs.probe_latest_build.info.number }} finished with result {{ outputs.probe_latest_build.info.result }}. Execution {{ execution.id }}."
              }

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: "Final status line for every run, independent of which branch fired."
    message: "Build audit complete for {{ inputs.job_name }}. build_number={{ outputs.probe_latest_build.info.number }}. building={{ outputs.probe_latest_build.info.building }}. result={{ outputs.probe_latest_build.info.result }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert when the flow itself fails outside the handled branches, for example an unreachable Jenkins controller, a job/build that does not exist (404), or invalid credentials."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Jenkins stuck build watchdog FAILED in execution {{ execution.id }} for job {{ inputs.job_name }}. The build probe did not complete; investigate before trusting the last known RUNNING_OK/STUCK/HEALTHY/FAILED status."
      }

extend:
  title: "Jenkins Stuck Build Watchdog"
  shortDescription: "Classify a Jenkins job's latest build RUNNING_OK, STUCK, HEALTHY, or FAILED from Jenkins' own build API, and alert Slack on anything but a clean finish."
  metaTitle: "Jenkins Stuck Build Watchdog with Kestra"
  metaDescription: "Poll Jenkins' own build API, detect hung or failed builds, and alert Slack before a stuck executor wastes an agent slot."
  description: |
    A Jenkins build that hangs - a test suite deadlocked, a script waiting
    on stdin, a zombie process holding a lock - ties up an executor slot
    indefinitely with no error and no obvious signal in the Jenkins UI
    unless someone happens to look. This blueprint polls Jenkins' own build
    API for a job's latest build, classifies it into a four-state result,
    and alerts Slack on anything short of a clean, finished build.

    ## How it works

    1. `periodic_build_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 15 minutes, explicitly passing `jenkins_url`, `job_name`, and `max_stuck_minutes` through its own `inputs:` block so the flow is self-contained when the trigger fires. Shipped disabled so a manual run can be verified first.
    2. `get_latest_build_number` (`io.kestra.plugin.core.http.Request`) calls Jenkins' own `lastBuild/buildNumber` endpoint, which returns the newest build number as plain text.
    3. `probe_latest_build` (`io.kestra.plugin.jenkins.JobInfo`) fetches that build's full JSON from Jenkins' own `/api/json`, exposing `info.building`, `info.result`, `info.timestamp`, and `info.number`.
    4. `evaluate_still_building` (`io.kestra.plugin.core.flow.If`) branches on `building`.
       - `then` (still running): nested `evaluate_stuck` (`io.kestra.plugin.core.flow.If`) branches on whether the build's start time is older than `max_stuck_minutes` ago.
         - `then` (STUCK): `alert_stuck_build` reports the build number and start time to Slack.
         - `else` (RUNNING_OK): `log_running_ok` records that it is still within the acceptable window.
       - `else` (finished): nested `evaluate_result` (`io.kestra.plugin.core.flow.If`) branches on `result == 'SUCCESS'`.
         - `then` (HEALTHY): `log_build_healthy` records a clean finish.
         - `else` (FAILED): `alert_build_failed` reports the actual Jenkins `result` value (`FAILURE`, `UNSTABLE`, or `ABORTED`) to Slack.
    5. `log_audit_complete` always runs last, printing the build number, `building`, and `result` regardless of which branch fired.
    6. The `errors` block alerts Slack separately if the flow itself fails outright - an unreachable controller or a missing job must not read as any of the four handled states.

    ## What you get

    - A four-state answer (RUNNING_OK / STUCK / HEALTHY / FAILED) sourced directly from Jenkins' own build API, not inferred from a webhook that a hung build never sends.
    - A distinct STUCK state for a build that is neither finished nor failed - the state a dashboard built only on Jenkins' own pass/fail webhooks cannot see at all.
    - One Slack alert with the exact build number, start time, and (for finished builds) the real Jenkins `result` string, instead of opening the Jenkins UI to check.
    - A worked example of combining a generic `io.kestra.plugin.core.http.Request` (for an endpoint the Jenkins-specific plugin does not wrap) with the plugin's own `io.kestra.plugin.jenkins.JobInfo` task.

    ## Who it's for

    - Platform and build engineering teams running self-hosted Jenkins who need an early signal when an executor hangs instead of discovering it when a queue backs up.
    - On-call engineers who want one Slack alert with the build number and duration instead of opening the Jenkins UI to check why a job has not finished.
    - Anyone evaluating the Jenkins plugin who wants a worked example of `JobInfo` driving a real classification, not just a raw JSON dump.

    ## Why orchestrate this with Kestra

    Jenkins' own build page shows one build at a time and sends a webhook only when a build finishes - it has no concept of "this has been running too long" and nothing fires at all for a build that never finishes. Kestra supplies the schedule, the RUNNING_OK/STUCK/HEALTHY/FAILED classification as a first-class branch, and an execution history that shows exactly when a build crossed from merely slow into stuck.

    ## Prerequisites

    - A reachable Jenkins controller with at least one job that has run at least once (update `jenkins_url` and `job_name`).
    - A Jenkins user and API token with read access to that job, if the controller has security enabled.
    - A Slack incoming webhook for alerts.

    Local testing:
    ```bash
    docker run -d --name jenkins-watchdog -p 8080:8081 -p 50000:50000 jenkins/jenkins:lts
    docker network connect YOUR_KESTRA_NETWORK jenkins-watchdog
    ```
    Run `docker network ls` first to find the active Kestra network name. The container's internal port `8080` is mapped to host port `8081` here specifically so it never collides with Kestra's own UI on host port `8080`; open `http://localhost:8081` once to run the first-run setup wizard (unlock key from `docker logs jenkins-watchdog`, create the initial admin user), then create one freestyle job named `test` with a build step that sleeps long enough to exercise the STUCK path (for example `sleep 90`) before pointing `jenkins_url` at the container.

    ### Secrets

    - `JENKINS_USERNAME` / `JENKINS_API_TOKEN`: credentials used by both `get_latest_build_number`'s manually built Basic Auth header and `probe_latest_build`'s own `username`/`apiToken` properties. Jenkins' own documentation describes generating an API token under the user's security settings; a plain password also works for Basic Auth but a token is Jenkins' documented preference.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_stuck_build`, `alert_build_failed`, and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded - for example `SECRET_JENKINS_API_TOKEN=$(echo -n '<your-token>' | base64)` - and read back in flows with `{{ secret('NAME') }}`.

    ### Inputs

    - `jenkins_url` (STRING, default `http://localhost:8080`): base URL of the Jenkins controller.
    - `job_name` (STRING, default `test`): job name or foldered path to audit.
    - `max_stuck_minutes` (INT, default `60`): running-duration ceiling before a still-building build counts as STUCK.

    ### Outputs

    - `outputs.get_latest_build_number.body`: the newest build number, as plain text, before it is cast to an integer for `probe_latest_build`.
    - `outputs.probe_latest_build.info`: the full raw Jenkins build JSON - this blueprint only reads `building`, `result`, `timestamp`, and `number`, but every other field Jenkins returns is present too.

    ## Quick start

    1. Start Jenkins locally with the command above and create the `test` job as described in Prerequisites.
    2. Add the `JENKINS_USERNAME`, `JENKINS_API_TOKEN`, and `SLACK_WEBHOOK_URL` secrets (on a security-disabled local QuickStart, the credentials can be any placeholder value - the header is sent but ignored).
    3. Trigger the `test` job manually in the Jenkins UI, then immediately run this flow and confirm `log_running_ok` or `alert_stuck_build` fires depending on `max_stuck_minutes` and how long the job's build step sleeps.
    4. Let the job finish successfully and re-run to confirm `log_build_healthy` fires; make the job fail and re-run to confirm `alert_build_failed` fires with the real `result` value.
    5. Enable `periodic_build_check` once you trust the check against your real job.

    ## How to extend

    - Loop over several `job_name` values with `io.kestra.plugin.core.flow.Loop` to watchdog every critical job on a controller in one run.
    - Add an `io.kestra.plugin.jenkins.JobBuild` task on the STUCK branch to trigger a replacement build on a different node once the stuck one is manually aborted, rather than just alerting.
    - Track `info.duration` for the last several HEALTHY builds (via a Kestra KV store) to alert on a build that finished successfully but took dramatically longer than its own history, not just an outright STUCK one.

    ## Pitfalls

    - **Kestra's own `io.kestra.plugin.jenkins.JobInfo` Javadoc example uses the property name `serverUri`, but the actual field on `AbstractJenkins` is `serverUrl`.** This blueprint uses `serverUrl`, the real field verified from the plugin's source on `main` - copying the Javadoc example's `serverUri` verbatim would fail.
    - **`io.kestra.plugin.jenkins.JobInfo` requires an explicit integer `buildNumber`; it has no "latest build" mode of its own.** That is why `get_latest_build_number` calls Jenkins' own `lastBuild/buildNumber` endpoint first, rather than assuming a Kestra-native shortcut exists.
    - **No verified Kestra Pebble filter returns the current time as epoch milliseconds**, so the STUCK comparison converts Jenkins' `timestamp` (epoch millis) to a UTC ISO-8601 string with jq's `todate` and compares it against a UTC-formatted `now() | dateAdd(...)` string instead of doing raw millisecond arithmetic.
    - **A freshly created job with no build history yet will fail at `get_latest_build_number`** (no `lastBuild` exists) - this surfaces through the `errors` block, not as a false RUNNING_OK or HEALTHY.
    - **This blueprint is UNTESTED against a live Jenkins controller.** The `lastBuild/buildNumber` endpoint and the `building`/`result`/`timestamp` build JSON fields are taken from Jenkins' own REST API documentation, and the `io.kestra.plugin.jenkins.JobInfo` properties are taken from the plugin's own source on `main` - but no Docker container or Kestra engine was run to execute this flow end to end.

    ## Links

    - [Kestra Jenkins plugin documentation](https://kestra.io/plugins/plugin-jenkins)
    - [Jenkins remote access API documentation](https://www.jenkins.io/doc/book/using/remote-access-api/)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
