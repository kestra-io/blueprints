id: litellm-proxy-budget-and-model-fallback-gate
namespace: company.aiops

description: |
  Track multi-LLM proxy token expenditures, monitor primary model health, gate failover routing, and alert FinOps teams via Slack.

concurrency:
  limit: 1

inputs:
  - id: litellm_proxy_url
    type: STRING
    defaults: "http://litellm.aiops:4000"
    description: Base URL of the enterprise LiteLLM proxy instance.

  - id: primary_provider
    type: STRING
    defaults: "openai/gpt-4o"
    description: Primary LLM model routed through the enterprise LiteLLM proxy.

  - id: fallback_provider
    type: STRING
    defaults: "anthropic/claude-3-5-sonnet"
    description: Failover model provider invoked when primary latency or error rate degrades.

  - id: daily_budget_usd
    type: FLOAT
    defaults: 150.0
    description: Daily expenditure budget threshold in USD before triggering spend alerts.

tasks:
  - id: check_provider_health_and_spend
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates LiteLLM proxy health and spend metrics API to evaluate budget compliance and route availability.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra requests
    env:
      LITELLM_URL: "{{ inputs.litellm_proxy_url }}"
      PRIMARY_PROVIDER: "{{ inputs.primary_provider }}"
      FALLBACK_PROVIDER: "{{ inputs.fallback_provider }}"
      DAILY_BUDGET: "{{ inputs.daily_budget_usd }}"
      LITELLM_MASTER_KEY: "{{ secret('LITELLM_MASTER_KEY') }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      proxy_url = os.environ.get("LITELLM_URL", "http://litellm.aiops:4000").rstrip("/")
      primary = os.environ.get("PRIMARY_PROVIDER", "openai/gpt-4o")
      fallback = os.environ.get("FALLBACK_PROVIDER", "anthropic/claude-3-5-sonnet")
      budget_limit = float(os.environ.get("DAILY_BUDGET", "150.0"))
      master_key = os.environ.get("LITELLM_MASTER_KEY", "").strip()

      headers = {"Accept": "application/json"}
      if master_key:
          headers["Authorization"] = f"Bearer {master_key}"

      print(f"Checking LiteLLM proxy health at {proxy_url}/health...")
      primary_healthy = True
      current_daily_spend = 0.0

      try:
          health_resp = requests.get(f"{proxy_url}/health", headers=headers, timeout=10)
          health_resp.raise_for_status()
          health_data = health_resp.json()
          healthy_endpoints = health_data.get("healthy_endpoints", [])
          if healthy_endpoints and primary not in healthy_endpoints:
              primary_healthy = False
      except Exception as e:
          print(f"Warning: Health endpoint returned: {e}", file=sys.stderr)
          primary_healthy = False

      try:
          spend_resp = requests.get(f"{proxy_url}/spend/calculate", headers=headers, timeout=10)
          if spend_resp.status_code == 200:
              spend_data = spend_resp.json()
              current_daily_spend = float(spend_data.get("spend", 0.0))
          else:
              print(f"Spend endpoint returned HTTP {spend_resp.status_code}", file=sys.stderr)
      except Exception as e:
          print(f"ERROR: Failed to connect to LiteLLM proxy at {proxy_url}: {e}", file=sys.stderr)
          sys.exit(1)

      active_model = primary if primary_healthy else fallback
      budget_exceeded = current_daily_spend > budget_limit
      spend_utilization_pct = (current_daily_spend / budget_limit) * 100.0 if budget_limit > 0 else 0.0

      print(f"LiteLLM Gateway Status: Model={active_model} | Daily Spend=${current_daily_spend:.2f}/${budget_limit:.2f} ({spend_utilization_pct:.1f}%)")

      Kestra.outputs({
          "current_spend_usd": round(current_daily_spend, 2),
          "spend_utilization_pct": round(spend_utilization_pct, 1),
          "active_model": active_model,
          "primary_healthy": primary_healthy,
          "budget_exceeded": budget_exceeded
      })

  - id: evaluate_governance_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_provider_health_and_spend.vars.budget_exceeded ?? false or not (outputs.check_provider_health_and_spend.vars.primary_healthy ?? true) }}"
    then:
      - id: notify_governance_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts AI operations and FinOps teams to failover routes or budget overruns.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *LiteLLM Governance Alert:* Active route shifted or budget exceeded! Daily Spend: *${{ outputs.check_provider_health_and_spend.vars.current_spend_usd }}* ({{ outputs.check_provider_health_and_spend.vars.spend_utilization_pct }}% of limit). Active Model: `{{ outputs.check_provider_health_and_spend.vars.active_model }}` (Execution `{{ execution.id }}`)."
          }
    else:
      - id: notify_governance_nominal
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Posts routine spend digest confirmation to FinOps Slack channels.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "✅ *LiteLLM Gateway Nominal:* Spend running within limits at ${{ outputs.check_provider_health_and_spend.vars.current_spend_usd }} ({{ outputs.check_provider_health_and_spend.vars.spend_utilization_pct }}% budget). Primary route `{{ inputs.primary_provider }}` healthy."
          }

  - id: archive_spend_audit_log
    type: io.kestra.plugin.scripts.shell.Commands
    description: Archives spend audit metadata to standard logging streams.
    containerImage: ghcr.io/kestra-io/tools:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - echo "Archived LiteLLM proxy spend metrics for {{ outputs.check_provider_health_and_spend.vars.active_model }} at $(date)"

outputs:
  - id: current_spend_usd
    type: NUMBER
    value: "{{ outputs.check_provider_health_and_spend.vars.current_spend_usd }}"
  - id: spend_utilization_pct
    type: NUMBER
    value: "{{ outputs.check_provider_health_and_spend.vars.spend_utilization_pct }}"
  - id: active_model
    type: STRING
    value: "{{ outputs.check_provider_health_and_spend.vars.active_model }}"
  - id: primary_healthy
    type: BOOLEAN
    value: "{{ outputs.check_provider_health_and_spend.vars.primary_healthy }}"
  - id: budget_exceeded
    type: BOOLEAN
    value: "{{ outputs.check_provider_health_and_spend.vars.budget_exceeded }}"

errors:
  - id: alert_on_gateway_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Catches proxy network disconnects or API auth failures and notifies on-call teams.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "🚨 *LiteLLM Gateway Incident:* Proxy health evaluation failed during execution `{{ execution.id }}`. Check Kestra execution logs."
      }

triggers:
  - id: hourly_spend_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

extend:
  title: "Monitor LiteLLM Proxy Budgets and Automate Provider Fallback Alerts via Slack"
  shortDescription: "Track multi-LLM proxy token expenditures, monitor primary model health, gate failover routing, and alert FinOps teams via Slack."
  metaTitle: "LiteLLM Proxy Budget and Model Fallback Gate in Kestra"
  metaDescription: "Orchestrate automated multi-LLM proxy token expenditure tracking, health failover gates, and Slack incident alerting in Kestra."
  description: |
    # Monitor LiteLLM Proxy Budgets & Automate Provider Fallback Alerts via Slack

    Enterprise generative AI platforms increasingly deploy unified LLM proxy gateways (such as LiteLLM Proxy) to load balance inference calls across multiple foundation models (OpenAI, Anthropic, Mistral, Vertex AI). As traffic scales, engineering and FinOps teams face two critical risks: unexpected token spending surges and upstream provider outages causing silent downstream application failures.

    This blueprint automates continuous health and budget surveillance for multi-model LLM proxy deployments.
  tags:
    - AI
    - Cloud
    - Business
