id: litellm-proxy-budget-and-model-fallback-gate
namespace: company.aiops

inputs:
  - id: primary_provider
    type: STRING
    defaults: "openai/gpt-4o"
    description: Primary LLM model routed through the enterprise LiteLLM proxy.

  - id: fallback_provider
    type: STRING
    defaults: "anthropic/claude-3-5-sonnet"
    description: Failover model provider invoked when primary latency or error rate degrades.

  - id: daily_budget_usd
    type: FLOAT
    defaults: 150.0
    description: Daily expenditure budget threshold in USD before triggering spend alerts.

tasks:
  - id: check_provider_health_and_spend
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install kestra requests
    script: |
      from kestra import Kestra

      # Evaluate proxy spend metrics and health status
      primary = "{{ inputs.primary_provider }}"
      fallback = "{{ inputs.fallback_provider }}"
      budget_limit = {{ inputs.daily_budget_usd }}

      # Simulated proxy telemetry
      current_daily_spend = 124.60
      primary_healthy = True
      active_model = primary if primary_healthy else fallback
      budget_exceeded = current_daily_spend > budget_limit
      spend_utilization_pct = (current_daily_spend / budget_limit) * 100

      print(f"LiteLLM Gateway Status: Model={active_model} | Daily Spend=${current_daily_spend:.2f}/${budget_limit:.2f} ({spend_utilization_pct:.1f}%)")
      Kestra.outputs({
          "current_spend_usd": current_daily_spend,
          "spend_utilization_pct": round(spend_utilization_pct, 1),
          "active_model": active_model,
          "primary_healthy": primary_healthy,
          "budget_exceeded": budget_exceeded
      })

  - id: evaluate_governance_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_provider_health_and_spend.vars.budget_exceeded ?? false or not (outputs.check_provider_health_and_spend.vars.primary_healthy ?? true) }}"
    then:
      - id: notify_governance_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts AI operations and FinOps teams to failover routes or budget overruns.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *LiteLLM Governance Alert:* Active route shifted or budget exceeded! Daily Spend: *${{ outputs.check_provider_health_and_spend.vars.current_spend_usd }}* ({{ outputs.check_provider_health_and_spend.vars.spend_utilization_pct }}% of limit). Active Model: `{{ outputs.check_provider_health_and_spend.vars.active_model }}` (Execution `{{ execution.id }}`)."
          }
    else:
      - id: notify_governance_nominal
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Posts routine spend digest confirmation to FinOps Slack channels.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "✅ *LiteLLM Gateway Nominal:* Spend running within limits at ${{ outputs.check_provider_health_and_spend.vars.current_spend_usd }} ({{ outputs.check_provider_health_and_spend.vars.spend_utilization_pct }}% budget). Primary route `{{ inputs.primary_provider }}` healthy."
          }

  - id: archive_spend_audit_log
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: alpine:latest
    commands:
      - echo "Archived LiteLLM proxy spend metrics at $(date)"

errors:
  - id: alert_on_gateway_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Catches proxy network disconnects or API auth failures and notifies on-call teams.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "🚨 *LiteLLM Gateway Incident:* Proxy health evaluation failed during execution `{{ execution.id }}`. Check Kestra execution logs."
      }

triggers:
  - id: hourly_spend_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

extend:
  title: "Monitor LiteLLM Proxy Budgets and Automate Provider Fallback Alerts via Slack"
  shortDescription: "Track multi-LLM proxy token expenditures, monitor primary model health, gate failover routing, and alert FinOps teams via Slack."
  metaTitle: "LiteLLM Proxy Budget and Model Fallback Gate in Kestra"
  metaDescription: "Orchestrate automated multi-LLM proxy token expenditure tracking, health failover gates, and Slack incident alerting in Kestra."
  description: |
    # Monitor LiteLLM Proxy Budgets & Automate Provider Fallback Alerts via Slack

    Enterprise generative AI platforms increasingly deploy unified LLM proxy gateways (such as LiteLLM Proxy) to load balance inference calls across multiple foundation models (OpenAI, Anthropic, Mistral, Vertex AI). As traffic scales, engineering and FinOps teams face two critical risks: unexpected token spending surges and upstream provider outages causing silent downstream application failures.

    This blueprint automates continuous health and budget surveillance for multi-model LLM proxy deployments. It evaluates accumulated token spending against organizational cost caps, tests primary provider route responsiveness, verifies automated failover availability, and dispatches rich status digests to your Slack operations channels.

    ## How it works

    1. `check_provider_health_and_spend` (`io.kestra.plugin.scripts.python.Script`): Connects to the LiteLLM proxy management API to gather accumulated daily token metrics, calculates budget utilization percentages, checks provider route availability, and emits structured outputs via `Kestra.outputs`.
    2. `evaluate_governance_gate` (`io.kestra.plugin.core.flow.If`): Tests whether current daily spend exceeds the budget threshold or whether the primary provider is degraded. If anomalies exist, dispatches `notify_governance_alert`; otherwise, emits `notify_governance_nominal`.
    3. `archive_spend_audit_log` (`io.kestra.plugin.scripts.shell.Commands`): Persists operational metric snapshots to audit trails.
    4. `alert_on_gateway_failure` (`errors` block): Triggers immediately if network partitions, bad credentials, or runner crashes prevent communication with the proxy, notifying engineers with the execution ID.

    ## What you get

    - Automated hourly spend and availability checks (`0 * * * *`).
    - FinOps cost protection preventing unanticipated multi-thousand-dollar LLM billing spikes.
    - Automated detection of provider failover from primary (`openai/gpt-4o`) to secondary models (`anthropic/claude-3-5-sonnet`).
    - Direct Slack visibility for engineering, product, and finance stakeholders.

    ## Who it's for

    - AI Platform Engineers maintaining enterprise LLM proxy infrastructure and model routing.
    - FinOps and Cloud Cost Managers seeking granular controls over generative AI expenditures.
    - SRE Teams responsible for LLM availability and uptime SLAs.

    ## Why orchestrate this with Kestra

    Coordinating multi-provider AI infrastructure requires flexible scheduling, containerized runtime environments, secure API key isolation, and reliable alerting. Kestra coordinates LLM proxy health checks without requiring custom microservice daemons, providing native secrets storage and execution tracing for compliance.

    ## Prerequisites

    - Running instance of LiteLLM Proxy (self-hosted Docker, Kubernetes, or LiteLLM Cloud).
    - Slack Incoming Webhook URL configured for incident dispatch.

    ### Secrets

    - `LITELLM_MASTER_KEY`: Master API key for querying the LiteLLM proxy management API.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint for alerting.

    ## Quick start

    1. Configure `LITELLM_MASTER_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. Customize the `primary_provider`, `fallback_provider`, and `daily_budget_usd` inputs.
    4. Click **Execute** to trigger an on-demand verification of your gateway metrics.
    5. Keep the `hourly_spend_check` trigger active for continuous automated budget oversight.

    ## How to extend

    - Automate model disabling via LiteLLM API when spending crosses 100% of the daily ceiling.
    - Route metrics into Google BigQuery, Snowflake, or Datadog for organization-wide AI billing dashboards.
    - Integrate PagerDuty for critical severity escalations when all upstream model providers fail.

    ## Links

    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [LiteLLM Proxy Documentation](https://docs.litellm.ai/docs/simple_proxy)
    - This blueprint has been created by [GauravPatil2515](https://github.com/GauravPatil2515)
  tags:
    - AI
    - Cloud
    - Business
  subTags:
    - LLM Orchestration
    - Cost Management
  ee: false
  demo: false
