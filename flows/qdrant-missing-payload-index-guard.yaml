id: qdrant-missing-payload-index-guard
namespace: company.team
description: Restore reviewed strict-mode filters by adding only missing payload indexes and checking native Qdrant retrieval.
concurrency:
  limit: 1
  behavior: QUEUE
inputs:
  - id: qdrant_url
    type: STRING
    defaults: https://qdrant.example.com:6333
  - id: qdrant_host
    type: STRING
    defaults: qdrant.example.com
  - id: qdrant_port
    type: INT
    defaults: 6334
  - id: tls_enabled
    type: BOOL
    defaults: true
  - id: api_key
    type: SECRET
    defaults: "{{ secret('QDRANT_API_KEY') }}"
  - id: collection
    type: STRING
    required: true
  - id: filter_fields
    type: JSON
    required: true
    description: List of objects with field, type and value. Types are keyword, integer or bool and filters use exact AND matches.
  - id: canary_vector
    type: JSON
    required: true
  - id: expected_ids
    type: JSON
    required: true
  - id: top_k
    type: INT
    defaults: 10
  - id: max_points
    type: INT
    defaults: 100000
  - id: max_indexes
    type: INT
    defaults: 8
  - id: maintenance_confirmed
    type: BOOL
    defaults: false
  - id: dry_run
    type: BOOL
    defaults: true
  - id: auto_remediate
    type: BOOL
    defaults: false
tasks:
  - id: validate_inputs
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    timeout: PT20S
    env:
      SPEC: "{{ {'collection': inputs.collection, 'fields': inputs.filter_fields, 'vector': inputs.canary_vector, 'ids': inputs.expected_ids, 'top': inputs.top_k, 'points': inputs.max_points, 'indexes': inputs.max_indexes, 'url': inputs.qdrant_url, 'port': inputs.qdrant_port} | toJson }}"
    script: |
      import json, math, os, re, urllib.parse
      raw = os.environ['SPEC']
      if len(raw.encode()) > 16384:
          raise ValueError('Input specification exceeds 16 KiB')
      s = json.loads(raw)
      def decoded(v):
          return json.loads(v) if isinstance(v, str) else v
      fields, vector, ids = (decoded(s[k]) for k in ['fields', 'vector', 'ids'])
      if not isinstance(s['collection'], str) or not re.fullmatch(r'[A-Za-z0-9_-]{1,128}', s['collection']):
          raise ValueError('Use one physical collection with a simple name')
      url = urllib.parse.urlsplit(s['url'])
      if url.scheme not in ['http', 'https'] or not url.hostname or url.username or url.password or url.query or url.fragment or url.path not in ['', '/']:
          raise ValueError('Use an operator-trusted base URL without credentials or path')
      if not 1 <= s['port'] <= 65535 or not 1 <= s['points'] <= 1000000 or not 1 <= s['indexes'] <= 8 or not 1 <= s['top'] <= 20:
          raise ValueError('Connection or capacity input is outside the supported range')
      if not isinstance(fields, list) or not 1 <= len(fields) <= s['indexes']:
          raise ValueError('Declare 1 to max_indexes fields')
      names = set()
      for f in fields:
          if not isinstance(f, dict) or set(f) != {'field', 'type', 'value'}:
              raise ValueError('Each field needs exactly field, type and value')
          if not isinstance(f['field'], str) or not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]{0,127}', f['field']) or f['field'] in names:
              raise ValueError('Use distinct simple nonnested payload field names up to 128 characters')
          names.add(f['field'])
          v, t = f['value'], f['type']
          valid = (t == 'keyword' and isinstance(v, str) and 1 <= len(v) <= 256) or (t == 'bool' and type(v) is bool) or (t == 'integer' and type(v) is int and -(2**63) <= v < 2**63)
          if not valid:
              raise ValueError('Exact match value does not fit the declared index type')
      if not isinstance(vector, list) or not 1 <= len(vector) <= 32 or any(type(v) not in [int, float] or not math.isfinite(v) for v in vector) or not any(vector):
          raise ValueError('Supply a finite nonzero dense canary of at most 32 dimensions')
      if not isinstance(ids, list) or not 1 <= len(ids) <= s['top'] or any(type(v) not in [int, str] or len(str(v)) > 64 for v in ids) or len(set(map(str, ids))) != len(ids):
          raise ValueError('Supply distinct reviewed expected IDs within top_k')
      print('::' + json.dumps({'outputs': {'fields': fields, 'vector': vector, 'ids': sorted(map(str, ids)), 'filter': {'must': [{'key': f['field'], 'match': {'value': f['value']}} for f in fields]}, 'collection_path': urllib.parse.quote(s['collection'], safe='')}}) + '::')

  - id: collection_bounds
    type: io.kestra.plugin.qdrant.CollectionInfo
    host: "{{ inputs.qdrant_host }}"
    port: "{{ inputs.qdrant_port }}"
    tlsEnabled: "{{ inputs.tls_enabled }}"
    apiKey: "{{ inputs.api_key }}"
    collectionName: "{{ inputs.collection }}"
    timeout: PT30S

  - id: read_schema
    type: io.kestra.plugin.core.http.Request
    description: Plugin 1.0.0 CollectionInfo does not expose payload_schema or strict-mode configuration.
    uri: "{{ inputs.qdrant_url }}/collections/{{ outputs.validate_inputs.vars.collection_path }}"
    headers:
      api-key: "{{ inputs.api_key }}"
    timeout: PT30S
    options:
      followRedirects: false
      logs: []
      timeout:
        connectTimeout: PT5S
        readIdleTimeout: PT15S

  - id: plan
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    timeout: PT20S
    inputFiles:
      collection.json: "{{ outputs.read_schema.body }}"
    env:
      FIELDS: "{{ outputs.validate_inputs.vars.fields | toJson }}"
      BOUNDS: "{{ {'points': outputs.collection_bounds.pointsCount, 'size': outputs.collection_bounds.vectorSize, 'distance': outputs.collection_bounds.distance, 'max': inputs.max_points, 'width': outputs.validate_inputs.vars.vector | length} | toJson }}"
    script: |
      import json, os
      from pathlib import Path
      if Path('collection.json').stat().st_size > 65536:
          raise ValueError('Collection response exceeds 64 KiB')
      doc = json.loads(Path('collection.json').read_text())
      b = json.loads(os.environ['BOUNDS'])
      fields = json.loads(os.environ['FIELDS'])
      if doc.get('status') != 'ok' or not isinstance(doc.get('result'), dict):
          raise ValueError('Collection read did not return a valid result')
      c = doc['result']
      if type(b['points']) is not int or not 1 <= b['points'] <= b['max'] or c.get('points_count') != b['points'] or b['size'] != b['width'] or str(b['distance']).upper() != 'COSINE':
          raise ValueError('Native and REST collection bounds disagree or exceed scope')
      config = c.get('config', {})
      strict = config.get('strict_mode_config', {})
      vectors = config.get('params', {}).get('vectors', {})
      if strict.get('enabled') is not True or strict.get('unindexed_filtering_retrieve') is not False or vectors.get('size') != b['width'] or config.get('params', {}).get('replication_factor') != 1:
          raise ValueError('Use a single-replica dense collection enforcing indexed retrieval')
      schema = c.get('payload_schema')
      if not isinstance(schema, dict) or len(schema) > 64 or any(not isinstance(k, str) or len(k) > 128 for k in schema):
          raise ValueError('Unsupported or excessive payload schema')
      def shape(s):
          return {k: {'data_type': v.get('data_type'), **({'params': v['params']} if v.get('params') is not None else {})} for k, v in s.items()}
      def normalized(v):
          return {k: normalized(x) for k, x in v.items() if x is not None} if isinstance(v, dict) else v
      for f in fields:
          current = schema.get(f['field'])
          if current is not None and (current.get('data_type') != f['type'] or current.get('params') is not None):
              raise ValueError('Existing declared index has incompatible type or parameters; do not replace it')
      missing = [f for f in fields if f['field'] not in schema]
      print('::' + json.dumps({'outputs': {'missing': missing, 'count': len(missing), 'original': shape(schema), 'config': normalized(config)}}) + '::')

  - id: repair_needed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.plan.vars.count > 0 and inputs.auto_remediate and not inputs.dry_run }}"
    then:
      - id: maintenance_required
        type: io.kestra.plugin.core.execution.Assert
        conditions:
          - "{{ inputs.maintenance_confirmed }}"
      - id: approval
        type: io.kestra.plugin.core.flow.Pause
        pauseDuration: PT1H
        onResume:
          - id: approved
            type: BOOL
            defaults: false
      - id: approved
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.approval.onResume.approved ?? false }}"
        then:
          - id: add_missing
            type: io.kestra.plugin.core.flow.Loop
            values: "{{ outputs.plan.vars.missing | toJson }}"
            concurrencyLimit: 1
            tasks:
              - id: current_schema
                type: io.kestra.plugin.core.http.Request
                uri: "{{ inputs.qdrant_url }}/collections/{{ outputs.validate_inputs.vars.collection_path }}"
                headers:
                  api-key: "{{ inputs.api_key }}"
                timeout: PT30S
                options:
                  followRedirects: false
                  logs: []
                  timeout:
                    connectTimeout: PT5S
                    readIdleTimeout: PT15S
              - id: eligible_now
                type: io.kestra.plugin.scripts.python.Script
                taskRunner:
                  type: io.kestra.plugin.core.runner.Process
                timeout: PT20S
                inputFiles:
                  current.json: "{{ outputs.current_schema.body }}"
                env:
                  ORIGINAL: "{{ outputs.plan.vars.original | toJson }}"
                  CONFIG: "{{ outputs.plan.vars.config | toJson }}"
                  FIELDS: "{{ outputs.validate_inputs.vars.fields | toJson }}"
                  TARGET: "{{ item.value }}"
                  MAX: "{{ inputs.max_points }}"
                script: |
                  import json, os
                  from pathlib import Path
                  if Path('current.json').stat().st_size > 65536:
                      raise ValueError('Collection response exceeds 64 KiB')
                  c = json.loads(Path('current.json').read_text())['result']
                  original = json.loads(os.environ['ORIGINAL'])
                  fields = json.loads(os.environ['FIELDS'])
                  target = json.loads(os.environ['TARGET'])
                  schema = {k: {'data_type': v.get('data_type'), **({'params': v['params']} if v.get('params') is not None else {})} for k, v in c['payload_schema'].items()}
                  def normalized(v):
                      return {k: normalized(x) for k, x in v.items() if x is not None} if isinstance(v, dict) else v
                  if normalized(c['config']) != json.loads(os.environ['CONFIG']) or not 1 <= c['points_count'] <= int(os.environ['MAX']):
                      raise ValueError('Collection changed or exceeds scope after approval')
                  if any(schema.get(k) != v for k, v in original.items()):
                      raise ValueError('An original index changed after approval')
                  allowed = {f['field']: {'data_type': f['type']} for f in fields}
                  if any(k not in original and (k not in allowed or v != allowed[k]) for k, v in schema.items()):
                      raise ValueError('Unexpected or incompatible schema writer drift')
                  current = schema.get(target['field'])
                  if current is not None and current != allowed[target['field']]:
                      raise ValueError('Target index is incompatible')
                  print('::' + json.dumps({'outputs': {'create': current is None}}) + '::')
              - id: still_missing
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.eligible_now.vars.create }}"
                then:
                  - id: create_index
                    type: io.kestra.plugin.core.http.Request
                    description: Plugin 1.0.0 has no payload-index creation task; this PUT adds one reviewed missing index.
                    uri: "{{ inputs.qdrant_url }}/collections/{{ outputs.validate_inputs.vars.collection_path }}/index?wait=true&ordering=strong"
                    method: PUT
                    headers:
                      api-key: "{{ inputs.api_key }}"
                    contentType: application/json
                    body: "{{ {'field_name': fromJson(item.value).field, 'field_schema': fromJson(item.value).type} | toJson }}"
                    timeout: PT45S
                    options:
                      followRedirects: false
                      logs: []
                      timeout:
                        connectTimeout: PT5S
                        readIdleTimeout: PT30S
          - id: schema_after
            type: io.kestra.plugin.core.http.Request
            uri: "{{ inputs.qdrant_url }}/collections/{{ outputs.validate_inputs.vars.collection_path }}"
            headers:
              api-key: "{{ inputs.api_key }}"
            timeout: PT30S
            options:
              followRedirects: false
              logs: []
              timeout:
                connectTimeout: PT5S
                readIdleTimeout: PT15S
          - id: indexes_verified
            type: io.kestra.plugin.scripts.python.Script
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            timeout: PT20S
            inputFiles:
              after.json: "{{ outputs.schema_after.body }}"
            env:
              ORIGINAL: "{{ outputs.plan.vars.original | toJson }}"
              CONFIG: "{{ outputs.plan.vars.config | toJson }}"
              FIELDS: "{{ outputs.validate_inputs.vars.fields | toJson }}"
            script: |
              import json, os
              from pathlib import Path
              if Path('after.json').stat().st_size > 65536:
                  raise ValueError('Collection response exceeds 64 KiB')
              c = json.loads(Path('after.json').read_text())['result']
              original = json.loads(os.environ['ORIGINAL'])
              fields = json.loads(os.environ['FIELDS'])
              schema = {k: {'data_type': v.get('data_type'), **({'params': v['params']} if v.get('params') is not None else {})} for k, v in c['payload_schema'].items()}
              def normalized(v):
                  return {k: normalized(x) for k, x in v.items() if x is not None} if isinstance(v, dict) else v
              expected = dict(original)
              expected.update({f['field']: {'data_type': f['type']} for f in fields})
              if schema != expected or normalized(c['config']) != json.loads(os.environ['CONFIG']):
                  raise ValueError('Index repair incomplete or protected schema/config changed')
              print('Declared indexes verified; protected configuration preserved')

  - id: query_is_eligible
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.plan.vars.count == 0 or (outputs.approval.onResume.approved ?? false) }}"
    then:
      - id: filtered_query
        type: io.kestra.plugin.qdrant.Query
        host: "{{ inputs.qdrant_host }}"
        port: "{{ inputs.qdrant_port }}"
        tlsEnabled: "{{ inputs.tls_enabled }}"
        apiKey: "{{ inputs.api_key }}"
        collectionName: "{{ inputs.collection }}"
        vector: "{{ outputs.validate_inputs.vars.vector }}"
        filter: "{{ outputs.validate_inputs.vars.filter }}"
        limit: "{{ inputs.top_k }}"
        withPayload: false
        fetchType: FETCH
        timeout: PT30S
      - id: retrieval_recovered
        type: io.kestra.plugin.scripts.python.Script
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        timeout: PT20S
        env:
          ROWS: "{{ outputs.filtered_query.rows | toJson }}"
          EXPECTED: "{{ outputs.validate_inputs.vars.ids | toJson }}"
        script: |
          import json, os
          ids = sorted(str(r['id']) for r in json.loads(os.environ['ROWS']))
          if ids != json.loads(os.environ['EXPECTED']):
              raise ValueError('Filtered native retrieval does not match reviewed canary IDs')
          print('Filtered retrieval recovered for ' + str(len(ids)) + ' reviewed IDs')
    else:
      - id: observation_only
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.plan.vars.count }} declared payload indexes are missing. No approved write ran."
errors:
  - id: notify_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: "{{ {'text': 'Payload index repair failed for ' ~ inputs.collection ~ '. Execution ' ~ execution.id ~ ': inspect the last schema and query before retrying.'} | toJson }}"
triggers:
  - id: scheduled_observation
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: '0 * * * *'
    inputs:
      collection: documents
      filter_fields: '[{"field":"tenant_id","type":"keyword","value":"canary"}]'
      canary_vector: '[1,0,0]'
      expected_ids: '[1]'
      dry_run: true
      auto_remediate: false
      maintenance_confirmed: false
extend:
  title: Restore Qdrant filters blocked by missing payload indexes
  metaTitle: Restore strict-mode Qdrant payload filters
  shortDescription: Add only missing declared payload indexes after approval and verify exact filtered retrieval with native Qdrant tasks.
  metaDescription: Restore strict-mode Qdrant filters with a bounded index plan, approval, fresh schema checks and native query verification.
  tags:
    - Data
    - AI
  subTags:
    - Vector Stores & RAG
    - Day 2 Operations
  demo: false
  ee: false
  description: |
    <!-- SPDX-License-Identifier: Apache-2.0. Original blueprint copyright 2026 zkasuran. -->

    ## Safety

    Index creation uses CPU, memory and disk. Exclude collection and schema writers until verification ends. `maintenance_confirmed` acknowledges that contract, not a Qdrant lock. The queue serializes this flow only. A final read cannot prevent a competing write afterwards.

    ## How it works

    1. Native `CollectionInfo` checks the point count and vector width. REST reads `payload_schema` and strict-mode config because plugin 1.0.0 omits them.
    2. `plan` refuses wrong types, parameterized declared indexes, empty collections and unsupported layouts.
    3. Safe defaults report missing indexes. Repair requires `maintenance_confirmed` and a `Pause` resumed with `approved: true`.
    4. A sequential `Loop` rechecks config and original indexes before each PUT. Compatible additions are skipped; incompatible or unrelated drift fails. REST covers the plugin's missing index write task.
    5. Schema readback must preserve original indexes and config. Native `Query` then runs the reviewed AND filter. Exact expected IDs must match or the execution fails. Failures notify Slack.

    ## What you get

    Bounded repair of rejected strict-mode filters. Points, vectors and existing indexes stay intact. Retry reads actual schema and keeps completed indexes. No latency or HNSW rebuild promise.

    ## Who it's for

    Search operators whose single-replica COSINE collection rejects a new exact-match filter.

    ## Why orchestrate this with Kestra

    The plan, approval and actual retrieval share one execution. Accepted index writes alone do not close the incident.

    ## Tested end to end

    Kestra 2.0.6 and 2.0.5 with separately installed Qdrant plugin 1.0.0, Qdrant 1.15.5 and Python 3.12.3. Final runtime checks cover 36 executions and 182 assertions, including a second fresh fixture. Primary cases:

    | Case | Execution | Result |
    | --- | --- | --- |
    | Healthy | `1q8m1pSN2pYZTlsbDppbXM` | SUCCESS |
    | Dry run | `4jN2tMVC5hrFu4Wr2GbWdR` | SUCCESS, no write |
    | Declined | `4G1ih3pWnj25p2MDOmUNGo` | SUCCESS, no write |
    | Repair | `6bepVxw9oFOVASG8pJX3f9` | SUCCESS, two indexes |
    | Repeat | `7VLO7fMViERdHbOk0TtbSG` | SUCCESS, no write |
    | Read-only key | `7QNFypNq30xoEJSBlvD6sJ` | FAILED |
    | Stale schema | `454lKmxP2PiHWTlH0zRJgu` | FAILED before write |

    Independent REST changed from HTTP 400 to 200 with IDs 1 and 2. A 2,000-point case preserved vector and payload bytes. An interrupted eight-index pass committed one; retry kept it and added seven. Schema races, deleted targets, queueing and 128/129-character boundaries ran. Plain keys were absent from execution trees, child logs and KV.

    ## Prerequisites

    Install `io.kestra.plugin:plugin-qdrant:1.0.0`, Python script and Slack plugins with Python 3.12 on the worker. Both endpoints must reach one physical collection enforcing `enabled: true` and `unindexed_filtering_retrieve: false`. Observation needs read access; repair needs index-creation permission. No point writes are used.

    ### Secrets

    `QDRANT_API_KEY` supplies the SECRET input default. `SLACK_WEBHOOK_URL` receives failure alerts.

    ### Inputs

    Supply endpoints, collection, `filter_fields`, `canary_vector` and `expected_ids`. Example: `[{"field":"tenant_id","type":"keyword","value":"alpha"}]`. Types: keyword, integer and bool. Ceilings: eight simple fields, 32 dimensions, 20 results and 1,000,000 points. Defaults keep writes off.

    ## Quick start

    Run observation with reviewed expected IDs. Read `plan`, exclude schema/collection writers then enable repair and approve that snapshot. Keep exclusion until retrieval passes. After interruption rerun the same scope against actual schema.

    ## How to extend

    Invoke per reviewed collection. Nested fields, parameterized indexes, clustered replicas and other filters need separate proof. Responses over 64 KiB are refused after HTTP reads; transport uses its default buffer ceiling. Reads time out after 30 seconds, writes after 45 seconds and approval after one hour. No write retries. Production TLS and real Slack were not tested.

    ## Links
    - [Qdrant payload indexes](https://qdrant.tech/documentation/manage-data/indexing/)
    - [Qdrant plugin](https://kestra.io/plugins/plugin-qdrant)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
