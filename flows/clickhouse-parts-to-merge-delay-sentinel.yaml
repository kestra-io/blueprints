id: clickhouse-parts-to-merge-delay-sentinel
namespace: company.team

inputs:
  - id: clickhouse_host
    type: STRING
    defaults: "clickhouse.internal"
    description: ClickHouse server hostname or IP address.
  - id: clickhouse_http_port
    type: INT
    defaults: 8123
    description: ClickHouse HTTP interface port.
  - id: clickhouse_user
    type: STRING
    defaults: "default"
    description: ClickHouse user name.
  - id: active_parts_threshold
    type: INT
    defaults: 150
    description: Maximum active data parts per partition before insert delay penalty (parts_to_delay_insert).

tasks:
  - id: query_active_parts_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        set -euo pipefail
        SQL_QUERY="SELECT database, table, partition_id, count() as active_parts FROM system.parts WHERE active = 1 GROUP BY database, table, partition_id HAVING active_parts >= {{ inputs.active_parts_threshold }} ORDER BY active_parts DESC LIMIT 10 FORMAT JSON"
        
        RESP=$(curl -fsSL -u "{{ inputs.clickhouse_user }}:{{ secret('CLICKHOUSE_PASSWORD') }}" \
          "http://{{ inputs.clickhouse_host }}:{{ inputs.clickhouse_http_port }}/?query=$(python3 -c 'import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))' "$SQL_QUERY")")
        
        LAGGING_TABLES_COUNT=$(echo "$RESP" | jq '.data | length')
        MAX_PARTS=$(echo "$RESP" | jq '[.data[].active_parts] | max // 0')
        
        echo "::{\"outputs\": {\"lagging_tables_count\": $LAGGING_TABLES_COUNT, \"max_parts\": $MAX_PARTS}}::"
  - id: evaluate_parts_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_active_parts_metrics.vars.lagging_tables_count | int > 0 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#clickhouse-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 ClickHouse Parts Compaction Delay Alert",
                "text": "ClickHouse node `{{ inputs.clickhouse_host }}` recorded *{{ outputs.query_active_parts_metrics.vars.lagging_tables_count }}* partitions with active parts exceeding {{ inputs.active_parts_threshold }} (Peak: *{{ outputs.query_active_parts_metrics.vars.max_parts }}* parts). Impact: ClickHouse will artificially throttle incoming writes via sleep delays or reject inserts with `Too many parts in all data parts`.",
                "footer": "Kestra Database Sentinel • ClickHouse"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#clickhouse-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ ClickHouse Parts to Merge Delay and Compaction Sentinel Pipeline Failure",
            "text": "Failed to query ClickHouse system.parts catalog. Please check connection and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors ClickHouse active data parts per partition to detect compaction lag and prevent insert delay penalties."
  metaTitle: ClickHouse Parts to Merge Delay and Compaction Sentinel with Kestra
  title: ClickHouse Parts to Merge Delay and Compaction Sentinel
  shortDescription: Monitors ClickHouse active data parts per partition to detect compaction lag and prevent insert delay penalties.
  description: |
    ## How it works
    This workflow executes an aggregation on `system.parts` where `active = 1` grouped by table and partition. In ClickHouse, each insert creates new data parts that background merge threads compact into larger parts. If small batch inserts arrive faster than compaction can merge them, active parts exceed `parts_to_delay_insert` (default 150) and ClickHouse throttles writes. If the count exceeds the threshold, Slack is alerted immediately.

    ## What you get
    - Early warning before ClickHouse throttles incoming insert queries.
    - Identification of high-churn tables and uncompacted partitions.
    - Prevents downstream producer timeouts and buffer drops.

    ## Who it's for
    - ClickHouse Administrators and Analytics Engineers managing real-time data ingestion.
    - SREs maintaining streaming pipelines writing directly to MergeTree tables.

    ## Why orchestrate this with Kestra
    - **Targeted Partition Auditing**: Identify exact tables and partitions experiencing compaction lag.
    - **No Agent Overhead**: Query database catalog directly via HTTP API.
    - **Proactive Tuning**: Automate alerts so teams can batch upstream inserts or trigger OPTIMIZE TABLE.

    ## Prerequisites
    - ClickHouse server with HTTP interface enabled.
    - Secrets `CLICKHOUSE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import blueprint into Kestra.
    2. Configure ClickHouse host and threshold.
    3. Run the workflow to inspect partition parts status.

    ## How to extend
    - Automatically trigger `OPTIMIZE TABLE FINAL` during off-peak hours for lagging partitions.
    - Correlate with disk I/O write throughput metrics.

    ## Links
    - [ClickHouse Merges and Parts Documentation](https://clickhouse.com/docs/en/optimize/sparse-primary-indexes#merges)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false