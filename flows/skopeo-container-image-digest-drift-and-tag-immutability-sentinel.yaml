id: skopeo-container-image-digest-drift-and-tag-immutability-sentinel
namespace: company.platform

inputs:
  - id: image_reference
    type: STRING
    displayName: Container Image Reference
    description: Remote container image reference to audit (e.g., docker.io/library/redis:7.2-alpine or ghcr.io/org/app:v1.2.0).
    defaults: "docker.io/library/redis:7.2-alpine"

  - id: expected_digest
    type: STRING
    displayName: Expected Pinned Digest
    description: The approved immutable SHA256 manifest digest. Set to AUTO_DISCOVER to accept the initial remote digest, or specify sha256:... to enforce immutability.
    defaults: "AUTO_DISCOVER"

  - id: enforce_immutability
    type: BOOL
    displayName: Enforce Immutability Gate
    description: When true, fails the execution on detected digest drift or unreachable registry to block downstream deployment pipelines.
    defaults: true

  - id: auto_alert_on_drift
    type: BOOL
    displayName: Auto Alert on Drift
    description: When true, dispatches high-priority diagnostic payload to Slack upon detecting digest drift.
    defaults: true

triggers:
  - id: scheduled_immutability_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"

tasks:
  - id: inspect_remote_image
    type: io.kestra.plugin.skopeo.cli.SkopeoCLI
    description: Queries the remote container registry via Skopeo inspect without pulling image layers, capturing the OCI/Docker manifest digest and metadata.
    commands:
      - skopeo inspect docker://{{ inputs.image_reference }} > inspect_metadata.json || echo '{"error":"INSPECT_FAILED","Digest":"UNKNOWN"}' > inspect_metadata.json
    outputFiles:
      - inspect_metadata.json

  - id: parse_image_digest
    type: io.kestra.plugin.core.output.OutputValues
    description: Extracts the resolved remote digest, architecture, and created timestamp using jq from the Skopeo inspection file.
    values:
      remote_digest: "{{ (read(outputs.inspect_remote_image.outputFiles['inspect_metadata.json']) | jq('.Digest') | first) ?? 'UNKNOWN' }}"
      architecture: "{{ (read(outputs.inspect_remote_image.outputFiles['inspect_metadata.json']) | jq('.Architecture') | first) ?? 'UNKNOWN' }}"
      os: "{{ (read(outputs.inspect_remote_image.outputFiles['inspect_metadata.json']) | jq('.Os') | first) ?? 'UNKNOWN' }}"
      created_at: "{{ (read(outputs.inspect_remote_image.outputFiles['inspect_metadata.json']) | jq('.Created') | first) ?? 'UNKNOWN' }}"

  - id: evaluate_digest_drift
    type: io.kestra.plugin.core.output.OutputValues
    description: Evaluates whether the remote image tag matches the expected pinned digest or has suffered silent overwrite/drift.
    values:
      integrity_status: "{{ outputs.parse_image_digest.values.remote_digest == 'UNKNOWN' ? 'UNREACHABLE' : (inputs.expected_digest == 'AUTO_DISCOVER' or outputs.parse_image_digest.values.remote_digest == inputs.expected_digest ? 'IMMUTABLE' : 'DIGEST_DRIFT') }}"
      drift_detected: "{{ outputs.parse_image_digest.values.remote_digest != 'UNKNOWN' and inputs.expected_digest != 'AUTO_DISCOVER' and outputs.parse_image_digest.values.remote_digest != inputs.expected_digest }}"

  - id: route_integrity_findings
    type: io.kestra.plugin.core.flow.If
    description: Branches on integrity status to alert DevSecOps or commit an operational audit log.
    condition: "{{ outputs.evaluate_digest_drift.values.integrity_status != 'IMMUTABLE' }}"
    then:
      - id: alert_digest_drift
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts platform engineers and DevSecOps when remote container image digest drift is detected.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "attachments": [
              {
                "color": "#E53935",
                "title": "[ALERT] Container Image Digest Drift Detected",
                "text": "Remote container image tag has drifted from approved immutable baseline.\n*Image Reference:* `{{ inputs.image_reference }}`\n*Status:* `{{ outputs.evaluate_digest_drift.values.integrity_status }}`\n*Expected Digest:* `{{ inputs.expected_digest }}`\n*Observed Remote Digest:* `{{ outputs.parse_image_digest.values.remote_digest }}`\n*Platform Architecture:* `{{ outputs.parse_image_digest.values.architecture }}/{{ outputs.parse_image_digest.values.os }}`\n*Remote Created At:* `{{ outputs.parse_image_digest.values.created_at }}`\nVerify build provenance and registry push history to prevent untracked binaries in production.",
                "footer": "Kestra Sentinel | Skopeo Immutability Gate"
              }
            ]
          }

      - id: gate_enforcement
        type: io.kestra.plugin.core.flow.If
        description: Enforces pipeline failure when enforce_immutability is enabled.
        condition: "{{ inputs.enforce_immutability }}"
        then:
          - id: fail_on_drift
            type: io.kestra.plugin.core.execution.Fail
            description: Blocks workflow execution to prevent deployment of mutated or untracked container images.

    else:
      - id: log_immutability_verified
        type: io.kestra.plugin.core.log.Log
        description: Records audit verification log confirming image tag immutability.
        message: "[OK] Container image immutability verified for '{{ inputs.image_reference }}'. Digest: {{ outputs.parse_image_digest.values.remote_digest }}, Arch: {{ outputs.parse_image_digest.values.architecture }}/{{ outputs.parse_image_digest.values.os }}."

extend:
  title: Skopeo Container Image Digest Drift and Tag Immutability Sentinel
  metaTitle: Skopeo Container Image Digest Drift and Tag Immutability Sentinel | Kestra
  shortDescription: Audits remote OCI/Docker container image manifests with Skopeo, detects silent tag digest drift or overwrites, and alerts DevSecOps via Slack.
  metaDescription: Audit remote container image manifests with Skopeo, detect silent tag digest drift or overwrites, and alert Slack to block untracked container deployments.
  description: |
    Continuously verify remote OCI container image immutability without pulling layers, catch silent tag overwrites or digest drift, and enforce deployment gates before untracked binaries reach production clusters.

    In modern container orchestration, deploying mutable tags (such as `:latest`, `:staging`, or release versions like `:v1.2.0`) introduces significant supply chain security risks. If an upstream registry tag is overwritten, whether through an untracked rebuild, CI misconfiguration, or unauthorized push, nodes can pull unverified binaries without triggering standard CI/CD checks. This blueprint orchestrates `skopeo inspect` through Kestra's official `io.kestra.plugin.skopeo.cli.SkopeoCLI` task to inspect remote manifests directly over the network, comparing the resolved SHA256 digest against approved baselines.

    ## How it works

    1. `scheduled_immutability_audit` (`io.kestra.plugin.core.trigger.Schedule`) initiates regular drift detection sweeps every 4 hours.
    2. `inspect_remote_image` (`io.kestra.plugin.skopeo.cli.SkopeoCLI`) queries the target container registry (`docker://<image_reference>`) and streams raw manifest JSON to `inspect_metadata.json` without pulling heavy container layers.
    3. `parse_image_digest` (`io.kestra.plugin.core.output.OutputValues`) extracts the resolved `Digest`, `Architecture`, `Os`, and `Created` timestamps using `jq` filtering.
    4. `evaluate_digest_drift` (`io.kestra.plugin.core.output.OutputValues`) compares the observed digest against `expected_digest`, classifying the outcome into `IMMUTABLE`, `DIGEST_DRIFT`, or `UNREACHABLE`.
    5. `route_integrity_findings` (`io.kestra.plugin.core.flow.If`) evaluates the integrity status:
       - If drift or registry outage is detected, `alert_digest_drift` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a high-priority incident payload to Slack with full OCI manifest details.
       - If `enforce_immutability` is enabled, `fail_on_drift` (`io.kestra.plugin.core.execution.Fail`) halts execution, blocking downstream deployment pipelines.
       - If the digest matches, `log_immutability_verified` (`io.kestra.plugin.core.log.Log`) writes an immutable verification receipt to the execution audit trail.

    ## What you get

    - Zero-bandwidth container inspection: verifies remote image metadata and digests without pulling multi-gigabyte layers.
    - Automated detection of silent tag mutability, unauthorized registry overwrites, or corrupted manifest lists.
    - Structured Slack notifications detailing exact image references, observed vs expected digests, and creation timestamps.
    - An automated deployment gate that halts execution before mutated container images reach staging or production Kubernetes clusters.

    ## Who it's for

    - Platform and Site Reliability Engineers (SREs) safeguarding production Kubernetes and Nomad clusters.
    - DevSecOps teams enforcing software supply chain security and SLSA provenance gates.
    - Release engineers validating container image promotion across environments.

    ## Why orchestrate this with Kestra

    - **Agentless Registry Inspection**: The Skopeo CLI wrapper executes directly within containerized tasks, querying public or private registries without needing Docker daemon privileges.
    - **Pebble & JQ Expression Engine**: Native expression evaluation parses complex OCI manifest trees and hashes directly in memory.
    - **Governed Deployment Gates**: Easily embedded as a pre-flight subflow in deployment pipelines to gate production rollouts behind cryptographic digest validation.
    - **Declarative Audit History**: Every execution captures complete JSON manifests and audit receipts in Kestra internal storage.

    ## Prerequisites

    - A container runtime (Docker) available on the Kestra worker to run `quay.io/skopeo/stable:latest`.
    - Network reachability from the Kestra worker to the target container registry (e.g., Docker Hub, Quay, GHCR, or private ECR/GAR).
    - A Slack incoming webhook URL for incident notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: The Slack incoming webhook URL for platform alerts and supply-chain drift incidents.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    2. Import this blueprint into your Kestra instance under namespace `company.platform`.
    3. Run a manual test execution with default inputs (`AUTO_DISCOVER` mode) to inspect the current remote digest.
    4. Copy the verified SHA256 digest into `expected_digest` and activate the schedule to enforce continuous immutability.

    ## How to extend

    - **Integrate Private Registry Authentication**: Add registry credentials via `--creds {{ secret('REGISTRY_USER') }}:{{ secret('REGISTRY_TOKEN') }}` inside the `skopeo inspect` command flags.
    - **Multi-Region Registry Mirror Check**: Query secondary registry mirrors in parallel and assert digest parity across global clusters.
    - **Automated Quarantine Webhook**: Trigger a downstream Kubernetes admission controller or image security scanner when drift is detected.

    ## Links

    - [Kestra Skopeo Plugin Documentation](https://kestra.io/plugins/plugin-skopeo)
    - [Skopeo GitHub Repository](https://github.com/containers/skopeo)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  verified: false
  demo: false
