id: nasa-eonet-wildfire-activity-lakehouse-loader
namespace: company.analytics
description: Ingests global active wildfire events, burn acreage, and geospatial telemetry from NASA EONET into Parquet lakehouse storage via DuckDB, tracking major wildfire outbreaks in Kestra KV store.

inputs:
  - id: days_window
    type: INT
    description: Historical time window in days to ingest active wildfire events.
    defaults: 30

  - id: major_fire_acres_threshold
    type: FLOAT
    description: Acreage burned threshold to flag a wildfire as a major regional outbreak.
    defaults: 5000.0

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known active wildfire event IDs.
    defaults: nasa_eonet_monitored_wildfire_state

variables:
  default_state: "[]"

triggers:
  - id: daily_wildfire_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_wildfires
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_events = set(json.loads(raw_state)) if raw_state else set()
        except Exception:
            seen_events = set()

        days = int("{{ inputs.days_window }}")
        threshold_acres = float("{{ inputs.major_fire_acres_threshold }}")

        url = f"https://eonet.gsfc.nasa.gov/api/v3/events?category=wildfires&days={days}&status=all"

        records = []
        new_events = []
        major_fires = []
        current_event_ids = []

        try:
            headers = {"User-Agent": "KestraWildfireLakehouse/1.0 (earth-science@kestra.io)"}
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                events = data.get("events", [])

                for ev in events:
                    ev_id = ev.get("id")
                    title = ev.get("title", "")
                    geometry_list = ev.get("geometry", [])
                    sources = [s.get("id") for s in ev.get("sources", [])]

                    latest_geom = geometry_list[-1] if geometry_list else {}
                    coords = latest_geom.get("coordinates", [0.0, 0.0])
                    lon = float(coords[0]) if len(coords) > 0 else 0.0
                    lat = float(coords[1]) if len(coords) > 1 else 0.0
                    event_date = latest_geom.get("date", "")
                    mag_val = latest_geom.get("magnitudeValue")
                    mag_unit = latest_geom.get("magnitudeUnit") or "acres"

                    burned_acres = float(mag_val) if mag_val is not None else 0.0
                    is_major = burned_acres >= threshold_acres
                    is_new = ev_id not in seen_events

                    current_event_ids.append(ev_id)

                    records.append({
                        "event_id": ev_id,
                        "title": title,
                        "longitude": lon,
                        "latitude": lat,
                        "observation_date": event_date,
                        "burned_acres": burned_acres,
                        "magnitude_unit": mag_unit,
                        "is_major_fire": is_major,
                        "is_new_event": is_new,
                        "sources_count": len(sources),
                        "ingest_time": datetime.utcnow().isoformat()
                    })

                    if is_new:
                        new_events.append({"id": ev_id, "title": title, "acres": burned_acres})
                    if is_major:
                        major_fires.append({"id": ev_id, "title": title, "acres": burned_acres})
        except Exception as e:
            print(f"Error fetching NASA EONET wildfire events: {e}")

        with open("wildfire_events.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE wildfires AS SELECT * FROM read_json_auto('wildfire_events.json')")
            con.execute("COPY wildfires TO 'nasa_wildfires_lakehouse.parquet' (FORMAT PARQUET)")
            con.execute("COPY wildfires TO 'nasa_wildfires_lakehouse.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE wildfires (
                    event_id VARCHAR,
                    title VARCHAR,
                    longitude DOUBLE,
                    latitude DOUBLE,
                    observation_date VARCHAR,
                    burned_acres DOUBLE,
                    magnitude_unit VARCHAR,
                    is_major_fire BOOLEAN,
                    is_new_event BOOLEAN,
                    sources_count BIGINT,
                    ingest_time VARCHAR
                )
            """)
            con.execute("COPY wildfires TO 'nasa_wildfires_lakehouse.parquet' (FORMAT PARQUET)")
            con.execute("COPY wildfires TO 'nasa_wildfires_lakehouse.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_wildfires": len(records),
            "new_wildfires_count": len(new_events),
            "major_fires_count": len(major_fires),
            "major_fires": major_fires[:5],
            "updated_state": current_event_ids[:500]
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - nasa_wildfires_lakehouse.parquet
      - nasa_wildfires_lakehouse.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_wildfires.vars.updated_state | toJson }}"

  - id: check_major_fires
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_wildfires.vars.major_fires_count > 0 }}"
    then:
      - id: notify_major_wildfire
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "🔥 Major Wildfire Outbreak Alert: {{ outputs.ingest_and_transform_wildfires.vars.major_fires_count }} active wildfire(s) exceeded the {{ inputs.major_fire_acres_threshold }} acres burn threshold."

outputs:
  - id: total_wildfires
    type: INT
    value: "{{ outputs.ingest_and_transform_wildfires.vars.total_wildfires }}"
  - id: major_fires_count
    type: INT
    value: "{{ outputs.ingest_and_transform_wildfires.vars.major_fires_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_wildfires.outputFiles['nasa_wildfires_lakehouse.parquet'] }}"

extend:
  title: NASA EONET Wildfire Activity Lakehouse Loader with DuckDB
  metaTitle: NASA EONET Wildfire Activity Lakehouse Loader | Kestra
  shortDescription: Ingests global active wildfire events, burn acreage, and geospatial telemetry from NASA EONET into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll NASA EONET API for active wildfires, transform burn acreage and geospatial coordinates into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, geospatial harmonization, and analytical persistence of active wildfire events,
    burn acreage measurements, and satellite telemetry from NASA Earth Observatory Natural Event Tracker (EONET) into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`nasa_eonet_monitored_wildfire_state`) for previously tracked wildfire identifiers.
    2. **NASA EONET Ingestion**: Queries the official EONET REST API (`eonet.gsfc.nasa.gov/api/v3/events`) for global wildfire observations across a configurable day window.
    3. **DuckDB Geospatial Normalization**: Unpacks coordinates, dates, burn acreage, and source observatories into a structured analytical schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized incident records into columnar Parquet and CSV files for environmental risk assessment and geospatial analysis.
    5. **Outbreak Detection & State Commitment**: Detects incidents exceeding major fire burn thresholds, issues warnings, and saves tracked event IDs to the KV store.

    ## What you get

    - Automated, scheduled monitoring of global wildfire activity from official NASA Earth Observatory feeds.
    - Columnar Parquet geospatial datasets ready for high-speed analysis with DuckDB, GIS toolchains, or cloud data warehouses.
    - Built-in KV state management providing idempotent execution and automated new incident detection.

    ## Who it's for

    - Climate and Environmental Data Engineers tracking natural hazard indicators.
    - GIS Analysts and Disaster Response teams monitoring regional fire activity.
    - Analytics Engineers centralizing earth observation data into enterprise data lakes.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical event state without requiring Redis or PostgreSQL infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB dependencies.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `eonet.gsfc.nasa.gov`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting incident response teams on major outbreaks.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Configure the `days_window` and `major_fire_acres_threshold` inputs.
    3. Click **Execute** to run an initial harvest and generate the Parquet dataset.
    4. Enable the `daily_wildfire_sync` schedule for automated daily synchronization.

    ## How to extend

    - Add an S3 or GCS upload step to partition daily wildfire snapshots into an analytical lakehouse.
    - Connect a spatial query step using DuckDB Spatial extension for boundary intersection analysis.

    ## Links

    - [NASA EONET API Documentation](https://eonet.gsfc.nasa.gov/docs/v3)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
