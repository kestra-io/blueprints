id: flagsmith-feature-flag-health-and-drift-sentinel
namespace: company.platform

description: |
  Continuously monitors Flagsmith feature flagging engine readiness and evaluates critical production feature toggle states, detects configuration drift or missing flags, and dispatches actionable Slack incident alerts to safeguard deployment rollouts.

inputs:
  - id: flagsmith_host
    type: STRING
    displayName: Flagsmith Endpoint Host
    defaults: "http://flagsmith.internal:8000"
    description: "Base HTTP URL of the target Flagsmith server API."

  - id: critical_feature_flag
    type: STRING
    displayName: Critical Feature Flag Name
    defaults: "enable_production_checkout"
    description: "Name of the critical feature flag that must be evaluated for state compliance."

  - id: expected_flag_state
    type: BOOL
    displayName: Expected Flag State
    defaults: true
    description: "Expected enabled state (true/false) of the critical feature flag in the target environment."

  - id: slack_channel
    type: STRING
    displayName: Operational Slack Channel
    defaults: "#deploy-alerts"
    description: "Target Slack channel or webhook destination for flag drift and incident alerts."

triggers:
  - id: scheduled_sentinel_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"
    disabled: true
    inputs:
      flagsmith_host: "http://flagsmith.internal:8000"
      critical_feature_flag: "enable_production_checkout"
      expected_flag_state: true
      slack_channel: "#deploy-alerts"

tasks:
  - id: probe_engine_health
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.flagsmith_host }}/health"
    method: GET
    headers:
      Accept: application/json
    timeout: PT15S
    description: "Queries the Flagsmith health endpoint to verify API server availability and core engine responsiveness."

  - id: probe_environment_flags
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.flagsmith_host }}/api/v1/flags/"
    method: GET
    headers:
      Accept: application/json
      X-Environment-Key: "{{ secret('FLAGSMITH_ENVIRONMENT_KEY') }}"
    timeout: PT30S
    description: "Fetches all feature flag states from the target Flagsmith environment using the authenticated environment key."

  - id: evaluate_flag_state_and_health
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {% set health = outputs.probe_engine_health.body %}
      {% set health_status = health.status | default('ok') %}
      {% set flags_payload = outputs.probe_environment_flags.body %}
      {% set flags_list = flags_payload.flags | default(flags_payload | default([])) %}
      {% set target = inputs.critical_feature_flag | lower %}
      {% set matched_flag = null %}
      {% if flags_list is iterable %}
        {% for item in flags_list %}
          {% set item_name = item.feature.name | default(item.name | default('')) | lower %}
          {% if item_name == target %}
            {% set matched_flag = item %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {% if health_status != 'ok' and outputs.probe_engine_health.code != 200 %}
        ENGINE_UNHEALTHY
      {% elseif matched_flag is null %}
        FLAG_NOT_FOUND
      {% elseif matched_flag.enabled != inputs.expected_flag_state %}
        FLAG_STATE_DRIFT
      {% else %}
        COMPLIANT
      {% endif %}
    cases:
      COMPLIANT:
        - id: log_compliant_status
          type: io.kestra.plugin.core.log.Log
          message: "Flagsmith engine on '{{ inputs.flagsmith_host }}' is healthy. Critical flag '{{ inputs.critical_feature_flag }}' matches expected state ({{ inputs.expected_flag_state }})."

      FLAG_STATE_DRIFT:
        - id: alert_flag_drift_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#FFA726",
                  "title": "⚠️ Flagsmith Critical Flag State Drift Detected",
                  "text": "The critical feature flag `{{ inputs.critical_feature_flag }}` has drifted from its expected state on `{{ inputs.flagsmith_host }}`.\n*Expected State:* `{{ inputs.expected_flag_state }}`\n*Action:* Verify whether an unauthorized toggle or emergency rollout override occurred.",
                  "footer": "Kestra Sentinel | Feature Toggle Drift Guard"
                }
              ]
            }

        - id: log_flag_drift
          type: io.kestra.plugin.core.log.Log
          message: "Flag state drift detected for '{{ inputs.critical_feature_flag }}' on '{{ inputs.flagsmith_host }}'. Investigation required."

      FLAG_NOT_FOUND:
        - id: alert_missing_flag_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#E53935",
                  "title": "❌ Flagsmith Critical Flag Missing",
                  "text": "Expected feature flag `{{ inputs.critical_feature_flag }}` was not found in the environment on `{{ inputs.flagsmith_host }}`.\n*Environment Key:* Configured secret\nVerify flag registration in the Flagsmith project dashboard.",
                  "footer": "Kestra Sentinel | Deployment Gate Alert"
                }
              ]
            }

        - id: log_missing_flag
          type: io.kestra.plugin.core.log.Log
          message: "Critical flag '{{ inputs.critical_feature_flag }}' was not returned by the Flagsmith environment API."

      ENGINE_UNHEALTHY:
        - id: alert_engine_unhealthy_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "🚨 Flagsmith Engine Health Check Failed",
                  "text": "Flagsmith health probe returned non-200 or unhealthy status on `{{ inputs.flagsmith_host }}`.\nFeature flag evaluation may be degraded or offline.",
                  "footer": "Kestra Sentinel | Platform Availability Alert"
                }
              ]
            }

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Completed Flagsmith audit for flag '{{ inputs.critical_feature_flag }}' on {{ inputs.flagsmith_host }} at {{ now() }}. Engine status code: {{ outputs.probe_engine_health.code }}."

errors:
  - id: alert_probe_failure_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "attachments": [
          {
            "color": "#D32F2F",
            "title": "🚨 Flagsmith Sentinel Probe Failure",
            "text": "The Flagsmith compliance probe encountered an unhandled network error or connection timeout connecting to `{{ inputs.flagsmith_host }}`.\n*Execution ID:* `{{ flow.executionId }}`\n*Error Message:* `{{ flow.errorMessage | default('Unknown execution error') }}`",
            "footer": "Kestra Orchestrator | Automated Incident Management"
          }
        ]
      }

extend:
  title: Flagsmith Feature Flag Health and Drift Sentinel
  metaTitle: Flagsmith Feature Flag Health & Drift Sentinel | Kestra
  shortDescription: Audits Flagsmith feature flag engine readiness, evaluates critical production toggle states, and dispatches actionable Slack incident alerts.
  metaDescription: Audit Flagsmith feature flag engine readiness, evaluate critical production toggle states, and dispatch automated Slack incident alerts on service drift.
  description: |
    Automated drift auditor and health gate that continuously monitors Flagsmith open-source feature flagging engines for service availability and verifies critical production toggle states against expected baselines. Dispatches structured Slack incident notifications upon toggle drift or missing flags, preventing inadvertent feature rollouts and deployment regressions.

    ## How it works

    1. A recurrent scheduled trigger initiates the feature flag audit every 4 hours, or executes on-demand via webhook before rolling out CD deployments.
    2. The `probe_engine_health` task queries `GET /health` on the target Flagsmith server to verify HTTP service availability and database connectivity.
    3. The `probe_environment_flags` task queries `GET /api/v1/flags/` using an authenticated environment API key to retrieve live flag values, enabled statuses, and segment rules.
    4. Pebble expressions inspect the returned flag list, isolating the `critical_feature_flag` and comparing its live enabled state against `expected_flag_state`.
    5. The `evaluate_flag_state_and_health` flow-control Switch evaluates the classified operational posture:
       - `COMPLIANT`: Logs clean operational metrics when the engine is responsive and the flag matches its expected state.
       - `FLAG_STATE_DRIFT`: Formats and dispatches a rich Slack warning notifying on-call engineers of an unintended toggle state change.
       - `FLAG_NOT_FOUND`: Posts a high-priority Slack incident alert notifying platform engineers that the expected feature flag is missing from the environment.
       - `ENGINE_UNHEALTHY`: Alerts DevOps teams immediately if the Flagsmith health endpoint indicates service degradation or database errors.
    6. A final `log_audit_summary` task records execution audit telemetry, and an `errors` block intercepts connection timeouts or authentication failures with automated Slack escalations.

    ## What you get

    - Early detection of accidental or unauthorized feature flag toggles in production environments.
    - Continuous health monitoring of the Flagsmith API preventing client application fallback failures.
    - Automated Slack incident routing with detailed diagnostic attachments including flag names and expected states.
    - Pre-deployment validation gate to verify required feature flags are active before triggering release pipelines.
    - Complete audit trail of feature flag compliance evaluations preserved directly in Kestra's execution history.

    ## Who it's for

    - Platform Engineers and SREs maintaining self-hosted Flagsmith feature flagging clusters.
    - DevOps Teams operating CI/CD release pipelines and progressive canary rollouts.
    - Software Engineering Leads governing feature toggles and production runtime configurations.

    ## Why orchestrate this with Kestra

    - **Declarative Release Governance**: Codify feature flag compliance policies, expected states, and escalation channels in revision-controlled YAML workflows.
    - **Native Secret Isolation**: Securely manage Flagsmith environment keys and Slack webhook URLs in namespace secret stores via `{{ secret(...) }}` without plaintext exposure.
    - **Coordinated CI/CD Gating**: Chain this flow as an approval gate before deploying frontend or backend microservices to confirm feature flags are provisioned.
    - **Resilient Multi-State Routing**: Differentiate between infrastructure downtime, missing configuration, and toggle drift using native Pebble logic and `Switch` tasks.

    ## Prerequisites

    - A running Flagsmith instance (accessible over HTTP/HTTPS) with standard health and API endpoints exposed.
    - Network connectivity from the Kestra worker or runner environment to the Flagsmith server.
    - A Slack Incoming Webhook URL configured with permissions to post into your target operations channel.

    ### Secrets

    - `FLAGSMITH_ENVIRONMENT_KEY`: Environment API key used for authenticating against the Flagsmith environment flags API.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for operational alerts.

    ## Quick start

    1. Configure the required secrets (`FLAGSMITH_ENVIRONMENT_KEY`, `SLACK_WEBHOOK_URL`) in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance under your desired namespace (e.g., `company.platform`).
    3. Click **Execute** with default inputs or provide your custom `flagsmith_host` and `critical_feature_flag` to validate connectivity against your instance.
    4. Review execution logs under the **Executions** tab to confirm that flag states and engine health codes are parsed correctly.
    5. Enable the `scheduled_sentinel_audit` trigger to establish recurrent 4-hour automated flag health evaluations.

    ## How to extend

    - **Automated Rollback / Remediate**: Extend the drift branch with an authenticated HTTP request (`POST /api/v1/flags/{id}/`) to restore the expected flag state automatically.
    - **Multi-Environment Comparison**: Combine with a Kestra `ForEach` loop task to verify flag parity across staging, canary, and production environments.
    - **PagerDuty Escalation**: Route critical `ENGINE_UNHEALTHY` states directly to PagerDuty or Opsgenie on-call schedules.
    - **CI/CD Pipeline Webhook**: Trigger this flow via an incoming webhook trigger from GitHub Actions or GitLab CI to gate production deployment jobs.

    ## Links

    - [Flagsmith Documentation](https://docs.flagsmith.com/)
    - [Flagsmith GitHub Repository](https://github.com/Flagsmith/flagsmith)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - CI/CD & Deployment
  ee: false
  demo: false
