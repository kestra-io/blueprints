id: mcp-governed-action-status
namespace: company.team

description: |
  MCP tool. Returns the status of a governed action request. If the approver notification failed
  more than 10 minutes ago, it also re-sends the Slack approval link.

inputs:
  - id: request_id
    type: STRING
    required: true
    validator: '^[A-Za-z0-9_-]{1,64}$'
    description: The request_id returned by governed_action_request.

variables:
  # Placeholders: replace with your own values.
  jdbc_url: jdbc:postgresql://demo-postgres:5432/demo
  jdbc_user: governed_actions
  kestra_url: http://localhost:8080

tasks:
  # Claims the re-send atomically: two status calls at the same time send at most one message, and the
  # next re-send waits another 10 minutes.
  - id: claim_renotify
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ vars.jdbc_url }}"
    username: "{{ vars.jdbc_user }}"
    password: "{{ secret('PG_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      UPDATE public.governed_requests SET updated_at = now()
      WHERE request_key = CAST(:key AS text) AND status = 'pending_unnotified'
        AND executor_execution_id IS NOT NULL AND updated_at < now() - interval '10 minutes'
      RETURNING environment, days, executor_execution_id
    parameters:
      key: "{{ inputs.request_id }}"

  - id: renotify_due
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.claim_renotify.size ?? 0) > 0 }}"
    then:
      # A failed re-send must not fail the status call: the row stays pending_unnotified.
      # allowWarning keeps the execution SUCCESS: a WARNING execution is returned to the agent as an MCP error.
      - id: renotify_approvers
        type: io.kestra.plugin.core.flow.Sequential
        allowFailure: true
        allowWarning: true
        tasks:
          - id: renotify_slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            # toJson escapes the whole text, so no input can break the JSON string.
            payload: |
              {
                "text": {{ ('Reminder, approval needed (the first notification failed): ' ~ outputs.claim_renotify.row.environment ~ ' purge of rows older than ' ~ outputs.claim_renotify.row.days ~ ' days (request ' ~ inputs.request_id ~ '). Approve or deny: ' ~ vars.kestra_url ~ '/ui/' ~ flow.tenantId ~ '/executions/' ~ flow.namespace ~ '/mcp-governed-action-executor/' ~ outputs.claim_renotify.row.executor_execution_id) | toJson }}
              }

          - id: record_notified
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ vars.jdbc_url }}"
            username: "{{ vars.jdbc_user }}"
            password: "{{ secret('PG_PASSWORD') }}"
            sql: |
              UPDATE public.governed_requests SET status = 'pending', updated_at = now()
              WHERE request_key = CAST(:key AS text) AND executor_execution_id = CAST(:exec AS text) AND status = 'pending_unnotified'
            parameters:
              key: "{{ inputs.request_id }}"
              exec: "{{ outputs.claim_renotify.row.executor_execution_id }}"

  - id: read_request
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ vars.jdbc_url }}"
    username: "{{ vars.jdbc_user }}"
    password: "{{ secret('PG_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT status, environment, days, executor_execution_id FROM public.governed_requests WHERE request_key = CAST(:key AS text)
    parameters:
      key: "{{ inputs.request_id }}"

  # Each branch builds the response values: from the row when there is one, otherwise the unknown defaults.
  - id: row_found
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.read_request.size ?? 0) > 0 }}"
    then:
      - id: values_from_row
        type: io.kestra.plugin.core.output.OutputValues
        values:
          status: "{{ outputs.read_request.row.status }}"
          environment: "{{ outputs.read_request.row.environment }}"
          days: "{{ outputs.read_request.row.days }}"
          approval_execution_id: "{{ outputs.read_request.row.executor_execution_id ?? '' }}"
    else:
      - id: values_unknown
        type: io.kestra.plugin.core.output.OutputValues
        values:
          status: unknown
          environment: ""
          days: "0"
          approval_execution_id: ""

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.values_from_row.values.status ?? outputs.values_unknown.values.status ?? 'unknown' }}"
  - id: environment
    type: STRING
    value: "{{ outputs.values_from_row.values.environment ?? outputs.values_unknown.values.environment ?? '' }}"
  - id: days
    type: INT
    value: "{{ outputs.values_from_row.values.days ?? outputs.values_unknown.values.days ?? 0 }}"
  - id: approval_execution_id
    type: STRING
    value: "{{ outputs.values_from_row.values.approval_execution_id ?? outputs.values_unknown.values.approval_execution_id ?? '' }}"

triggers:
  - id: mcp
    type: io.kestra.plugin.core.trigger.McpToolTrigger
    toolName: governed_action_status
    title: Check a governed action status
    toolDescription: >-
      Returns the status, environment, days and approval_execution_id of a request made with
      governed_action_request. Status values: claimed (accepted, not started yet), pending
      (production, waiting for a human), pending_unnotified (waiting, but the approver notification
      failed), running, executed, rejected, expired (not approved within 1 hour, or the executor
      failed before the purge started), failed, or unknown (no such request, with empty environment
      and approval_execution_id and days 0). Call it to follow up a production request. Side effect:
      if the request is pending_unnotified for more than 10 minutes, it re-sends the approval link
      to the approvers and the status becomes pending.
    mcpServer: default
    annotations:
      readOnly: false
      destructive: false
      idempotent: false
      openWorld: true

extend:
  title: Governed MCP Action Status Check
  metaTitle: Governed MCP Action Status | Kestra Blueprint
  shortDescription: MCP tool that lets an AI agent check whether a governed action was approved and executed, and re-sends the approval link when the first notification failed.
  metaDescription: MCP tool for AI agents to check a governed action request in Postgres, and re-send the Slack approval link when the first approver notification failed.
  description: |
    Status tool of the governed MCP actions pattern: request, approval, status. Setup, secrets and the security model are in `mcp-governed-action-request`: read it first. Import this flow last, into the same namespace as the other two. Change `kestra_url` in `variables` to your own Kestra URL: it is a placeholder (`http://localhost:8080`), and the re-sent approval link is built from it because `kestra.url` is unset in Kestra 2.0.4, so left as is it points to localhost.

    ## How it works

    1. `claim_renotify` checks whether the request has been `pending_unnotified` for more than 10 minutes. If so, it takes the re-send atomically, so concurrent calls send at most one message.
    2. `renotify_approvers` posts the approval link to Slack again and sets the status back to `pending`. If Slack still fails, the status stays `pending_unnotified` and the next re-send waits another 10 minutes.
    3. `read_request` reads the row, and `row_found` builds the response from it, or the `unknown` response when there is none.

    ## What you get

    - One MCP tool, `governed_action_status`, the agent's follow-up call after a production request: status, environment, days and the `approval_execution_id`.
    - A clear `unknown` answer for a key that does not exist, with empty values and days 0.
    - A re-send of the approval link when the first Slack message failed, sent at most once per 10 minutes even when several calls arrive together.

    ## Who it's for

    AI agents and the people behind them who need to follow up a request without waiting on it, and teams that want a failed approver notification to be retried without adding a scheduler.

    ## Why orchestrate this with Kestra

    The status tool is a flow like any other: the same Postgres query, the same Slack plugin and the same MCP trigger, with the read, the re-send claim and the response in one place, and each call visible as an execution. A failed re-send does not turn the answer into an error for the agent.

    ## Tested end to end

    On Kestra 2.0.4 OSS with Postgres 16, as a least-privilege role, with a local Slack stub.

    - Every status value: `claimed`, `pending`, `pending_unnotified`, `running`, `executed`, `rejected`, `expired`, `failed` and `unknown`.
    - Re-send (tested by back-dating the row 11 minutes): no message before 10 minutes, one message after, none on the next call, and the status goes back to `pending`.
    - With Slack down, a due re-send leaves the row `pending_unnotified`, and the call still returns the status with `isError: false`.

    ## Prerequisites

    - Postgres with the tables from the Database setup in `mcp-governed-action-request`, and that flow and the executor imported in the same namespace.
    - Secrets: `PG_PASSWORD` and `SLACK_WEBHOOK_URL` (Slack incoming webhook).
    - Replace the placeholders in `variables`: `jdbc_url`, `jdbc_user` and `kestra_url` (see above).
    - A private Kestra MCP server named `default`.

    ## Quick start

    1. Import `mcp-governed-action-executor`, `mcp-governed-action-request`, then this flow, all into the same namespace.
    2. Make a production request with `governed_action_request` and keep the returned `request_id`.
    3. Call `governed_action_status` with that `request_id` to follow it from `pending` to `executed` or `rejected`.

    ## How to extend

    Ideas, not tested in this blueprint:

    - Change the 10-minute window in the `interval '10 minutes'` of the SQL in `claim_renotify`.
    - Add more channels to `renotify_approvers`, for example email or a ticket, after the Slack message.
    - Limit how many reminders are sent by adding a counter column to `governed_requests` and checking it in `claim_renotify`.

    ## Inputs

    - `request_id` (STRING, required, `^[A-Za-z0-9_-]{1,64}$`): the `request_id` returned by `governed_action_request`.

    ## Expected outputs

    - `status`: `claimed`, `pending`, `pending_unnotified`, `running`, `executed`, `rejected`, `expired`, `failed` or `unknown`.
    - `environment`: `staging`, `production`, or empty when unknown.
    - `days`: the requested number of days, or 0 when unknown.
    - `approval_execution_id`: the executor execution, empty when unknown or not started yet.

    ## Known limits

    - The tool is not read-only: the re-send is a side effect, so its MCP annotations say `readOnly: false`.
    - A request stuck in `pending` or `running` because the executor was killed or lost needs a manual reset (see the executor flow).

    ## Links

    - [MCP tool trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.mcptooltrigger)
    - [Postgres plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
    - [Slack plugin](https://kestra.io/plugins/plugin-slack)

    This blueprint was created by [daiwangk](https://github.com/daiwangk).
  tags:
    - AI
    - Infrastructure
  subTags:
    - Approval Gates
  ee: false
  demo: false
