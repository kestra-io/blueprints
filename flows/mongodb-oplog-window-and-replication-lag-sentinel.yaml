id: mongodb-oplog-window-and-replication-lag-sentinel
namespace: company.team
description: |
  MongoDB replica set oplog window and replication lag sentinel. Monitors primary oplog retention
  capacity against secondary replication lag to alert DBAs before node desynchronization causes outages.

concurrency:
  limit: 1

inputs:
  - id: mongodb_connection_uri
    type: STRING
    displayName: MongoDB Connection URI
    defaults: "mongodb://mongodb-primary.internal:27017"
    description: "Connection string to the MongoDB primary replica set node."

  - id: min_oplog_window_hours_warning
    type: FLOAT
    displayName: Minimum Oplog Window Hours
    defaults: 24.0
    description: "Minimum acceptable oplog time capacity in hours before triggering a storage buffer alert."

  - id: max_allowed_replication_lag_seconds
    type: INT
    displayName: Max Allowed Replication Lag (Seconds)
    defaults: 300
    description: "Threshold in seconds for secondary node replication lag before raising an alert."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#dba-alerts"
    description: "Slack channel destination for MongoDB replication risk alerts."

triggers:
  - id: daily_oplog_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audits MongoDB oplog window and replication lag daily at 06:00 UTC."
    cron: "0 6 * * *"
    disabled: true

tasks:
  - id: scan_oplog_and_replication
    type: io.kestra.plugin.scripts.python.Script
    description: "Queries MongoDB local.oplog.rs metadata and replica set status to compute oplog duration and secondary node lag."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pymongo==4.15.3
      - kestra==2.0.0
    outputFiles:
      - mongodb_replication_report.json
    script: |
      import os
      import sys
      import json
      import datetime
      from pymongo import MongoClient
      from kestra import Kestra

      uri = "{{ inputs.mongodb_connection_uri }}"
      password = "{{ secret('MONGODB_PASSWORD') }}"
      min_window_hours = float("{{ inputs.min_oplog_window_hours_warning }}")
      max_lag_seconds = int("{{ inputs.max_allowed_replication_lag_seconds }}")

      try:
          client = MongoClient(uri, password=password if password else None, serverSelectionTimeoutMS=8000)
          oplog = client.local.oplog.rs
          first_entry = next(oplog.find().sort("$natural", 1).limit(1), None)
          last_entry = next(oplog.find().sort("$natural", -1).limit(1), None)

          if not first_entry or not last_entry:
              raise RuntimeError("Could not find oplog entries in local.oplog.rs")

          first_ts = first_entry["ts"].time
          last_ts = last_entry["ts"].time
          oplog_window = round((last_ts - first_ts) / 3600.0, 2)
          is_window_low = oplog_window < min_window_hours

          rs_status = client.admin.command("replSetGetStatus")
          primary_time = None
          for member in rs_status.get("members", []):
              if member.get("stateStr") == "PRIMARY":
                  primary_time = member.get("optimeDate", datetime.datetime.now(datetime.timezone.utc))
                  break

          if not primary_time:
              primary_time = datetime.datetime.now(datetime.timezone.utc)

          lagging_members = []
          for m in rs_status.get("members", []):
              if m.get("stateStr") == "SECONDARY":
                  sec_time = m.get("optimeDate", primary_time)
                  lag_sec = int((primary_time - sec_time).total_seconds())
                  if lag_sec > max_lag_seconds:
                      lagging_members.append({
                          "name": m.get("name"),
                          "state_str": m.get("stateStr"),
                          "replication_lag_seconds": lag_sec
                      })

          has_lag_spike = len(lagging_members) > 0
          has_risk = is_window_low or has_lag_spike

          top_lag_node = lagging_members[0]["name"] if lagging_members else "none"
          top_lag_seconds = lagging_members[0]["replication_lag_seconds"] if lagging_members else 0

          risk_reasons = []
          if is_window_low:
              risk_reasons.append(f"Oplog window is {oplog_window:.1f}h (below {min_window_hours:.1f}h threshold)")
          if has_lag_spike:
              risk_reasons.append(f"Secondary node {top_lag_node} lagging by {top_lag_seconds}s")

          report = {
              "replica_set": rs_status.get("set", "rs0"),
              "oplog_window_hours": oplog_window,
              "is_window_low": is_window_low,
              "has_lag_spike": has_lag_spike,
              "lagging_members": lagging_members,
              "reasons": risk_reasons
          }

          with open("mongodb_replication_report.json", "w") as f:
              json.dump(report, f, indent=2)

          Kestra.outputs({
              "has_replication_risk": has_risk,
              "oplog_window_hours": oplog_window,
              "lagging_nodes_count": len(lagging_members),
              "top_lagging_node": top_lag_node,
              "top_lag_seconds": top_lag_seconds,
              "primary_risk_reason": risk_reasons[0] if risk_reasons else "none"
          })
      except Exception as e:
          print(f"Error auditing MongoDB oplog and replication: {e}", file=sys.stderr)
          sys.exit(1)

  - id: check_replication_risk
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether MongoDB oplog capacity or replication lag breaches safety limits."
    condition: "{{ outputs.scan_oplog_and_replication.vars.has_replication_risk }}"
    then:
      - id: notify_slack_dba
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches actionable replication risk alert to DBA Slack channel."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*CRITICAL: MongoDB Oplog Window and Replication Risk*\n• *Target Replica Set*: `{{ inputs.mongodb_connection_uri }}`\n• *Current Oplog Window*: {{ outputs.scan_oplog_and_replication.vars.oplog_window_hours }} hours (Warning Threshold: {{ inputs.min_oplog_window_hours_warning }} hours)\n• *Highest Replication Lag*: {{ outputs.scan_oplog_and_replication.vars.top_lag_seconds }}s on `{{ outputs.scan_oplog_and_replication.vars.top_lagging_node }}`\n• *Diagnosis*: {{ outputs.scan_oplog_and_replication.vars.primary_risk_reason }}\n• *Operational Impact*: If replication lag exceeds the primary oplog window, secondary members fall into RECOVERING status and require a full initial resync from scratch.\n• *Recommended Remediation*: Resize the oplog via `db.adminCommand({replSetResizeOplog: 1, size: <NEW_SIZE_MB>})` or investigate slow network disk I/O on `{{ outputs.scan_oplog_and_replication.vars.top_lagging_node }}`."
          }

    else:
      - id: log_healthy_replication
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation that MongoDB replica set oplog window and sync lag are compliant."
        message: "MongoDB replica set audit compliant. Oplog window is {{ outputs.scan_oplog_and_replication.vars.oplog_window_hours }} hours, and all secondary nodes are synchronizing normally."

  - id: export_replication_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON replication audit manifest."
    format: |
      {
        "pipeline": "mongodb-oplog-window-and-replication-lag-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "oplog_window_hours": {{ outputs.scan_oplog_and_replication.vars.oplog_window_hours }},
        "lagging_nodes_count": {{ outputs.scan_oplog_and_replication.vars.lagging_nodes_count }},
        "status": "{{ outputs.scan_oplog_and_replication.vars.has_replication_risk ? 'ACTION_REQUIRED' : 'HEALTHY' }}"
      }

outputs:
  - id: has_replication_risk
    type: BOOLEAN
    value: "{{ outputs.scan_oplog_and_replication.vars.has_replication_risk }}"
  - id: oplog_window_hours
    type: FLOAT
    value: "{{ outputs.scan_oplog_and_replication.vars.oplog_window_hours }}"
  - id: lagging_nodes_count
    type: INT
    value: "{{ outputs.scan_oplog_and_replication.vars.lagging_nodes_count }}"
  - id: top_lagging_node
    type: STRING
    value: "{{ outputs.scan_oplog_and_replication.vars.top_lagging_node }}"
  - id: top_lag_seconds
    type: INT
    value: "{{ outputs.scan_oplog_and_replication.vars.top_lag_seconds }}"
  - id: primary_risk_reason
    type: STRING
    value: "{{ outputs.scan_oplog_and_replication.vars.primary_risk_reason }}"

extend:
  shortDescription: Audits MongoDB replica sets for shrinking oplog windows and secondary replication lag, alerting DBAs.
  title: MongoDB Oplog Window and Replication Lag Sentinel
  metaTitle: MongoDB Oplog Window and Replication Lag Sentinel | Kestra Blueprint
  metaDescription: Audits MongoDB replica sets for shrinking oplog windows and secondary sync lag, delivering actionable alerts to DBAs on Slack to avoid full resyncs.
  description: |
    In MongoDB replica sets, the primary node records all write operations into a capped collection named the operations log (`local.oplog.rs`). Secondary members continuously tail and replay this oplog to maintain replica synchronicity. The oplog window represents the total duration of historical changes stored in this collection before older operations are overwritten.

    When heavy write batches or bulk data migrations occur, the oplog fills up rapidly, shrinking the oplog window from days to just a few hours. If a secondary node experiences network hiccups, hardware pauses, or slow disk writes, its replication lag can easily exceed the primary's available oplog window. Once a secondary falls off the oplog horizon, it enters a degraded `RECOVERING` or `STALE` state and cannot catch up without a time-consuming and I/O-intensive initial sync from a primary snapshot.

    This blueprint provides an automated database reliability guard. Scheduled daily, it inspects MongoDB replica set metadata, calculates remaining oplog window hours, measures replication lag across all secondary nodes, and dispatches actionable Slack alerts before nodes desynchronize.

    ## How it works

    1. **Scheduled Daily Audit**: The `daily_oplog_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every morning at 06:00 UTC.
    2. **MongoDB Oplog and Replication Inspection**: The `scan_oplog_and_replication` task (`io.kestra.plugin.scripts.python.Script`) inspects the timestamp difference between the oldest and newest oplog entries, measures member lag from `replSetGetStatus`, and exports `mongodb_replication_report.json`.
    3. **Threshold Evaluation**: The `check_replication_risk` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether the oplog window is dangerously narrow or if any secondary lag exceeds the alert threshold.
    4. **Slack Alert Dispatch**: When replication risk is detected, `notify_slack_dba` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an incident card detailing the oplog capacity, the offending secondary node, and the exact `replSetResizeOplog` command.
    5. **Healthy Confirmation**: When all members are in sync and the oplog buffer is generous, `log_healthy_replication` records compliant status.
    6. **Manifest Export**: The `export_replication_manifest` task records execution state for database capacity planning.

    ## Use cases

    - **Secondary Node Desynchronization Prevention**: Avoid multi-hour initial resyncs that saturate primary disk I/O and degrade application read throughput.
    - **Bulk Write Window Governance**: Verify that scheduled high-volume ETL jobs or data migrations do not exhaust the oplog buffer during execution.
    - **Multi-Region Disaster Recovery Validation**: Monitor cross-region read replicas to ensure geographical WAN latency does not compromise data redundancy SLAs.

    ## Prerequisites

    - MongoDB credentials with `clusterMonitor` or `read` permissions on the `local` database and `admin` command access.
    - Incoming Webhook URL configured for your database administrator Slack channel.

    ### Secrets

    - `MONGODB_PASSWORD`: MongoDB administrator password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `MONGODB_PASSWORD` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your replica set primary hostname in `mongodb_connection_uri`.
    4. Click **Execute** in the UI to perform an initial replication health probe across your replica set.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - MongoDB Replica Set Oplog Documentation: https://www.mongodb.com/docs/manual/core/replica-set-oplog/
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
