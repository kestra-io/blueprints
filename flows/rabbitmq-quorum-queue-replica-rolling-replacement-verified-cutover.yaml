id: rabbitmq-quorum-queue-replica-rolling-replacement-verified-cutover
namespace: company.infrastructure

description: |
  Rolls a RabbitMQ quorum queue's replica off one node and onto another
  using the queue's own safe membership mechanism: adds the new node as a
  non-voting "promotable" replica so it never risks the queue's consensus,
  polls the queue's real per-node Raft status until Ra has automatically
  promoted it to a full voter, then after operator approval removes the old
  node's replica and reads the status back to confirm the new node is a
  voter and the old node's replica is actually gone.

inputs:
  - id: rabbitmq_management_url
    type: STRING
    displayName: "RabbitMQ Management API URL"
    description: Base URL of the RabbitMQ Management HTTP API, e.g. http://rabbitmq:15672.
  - id: vhost
    type: STRING
    displayName: "Virtual Host (URL-encoded)"
    defaults: "%2F"
    description: The vhost the quorum queue lives in, URL-encoded as RabbitMQ's Management API requires in the path (the default vhost "/" must be passed as "%2F", matching the convention already used by this catalog's other RabbitMQ Management API blueprints).
  - id: queue_name
    type: STRING
    displayName: "Quorum Queue Name"
    description: The quorum queue whose replica is being rolled.
  - id: new_node
    type: STRING
    displayName: "New RabbitMQ Node Name"
    description: The RabbitMQ node name to add as a replica, e.g. rabbit@new-host. The node must already be joined to the RabbitMQ cluster before this flow is run.
  - id: old_node
    type: STRING
    displayName: "Old RabbitMQ Node Name"
    description: The RabbitMQ node name currently hosting the replica being replaced, e.g. rabbit@old-host.

tasks:
  - id: inspect_current_status
    type: io.kestra.plugin.core.http.Request
    description: Reads the quorum queue's real per-node Raft status via RabbitMQ's own Management HTTP API - confirmed from rabbitmq-server's rabbit_mgmt_wm_quorum_queue_status.erl and rabbit_quorum_queue.erl's status/2 function, which returns one row per replica node with Membership (promotable or voter), Raft State, Commit Index, and Last Applied.
    uri: "{{ inputs.rabbitmq_management_url }}/api/queues/quorum/{{ inputs.vhost }}/{{ inputs.queue_name }}/status"
    method: GET
    options:
      auth:
        type: BASIC
        username: "{{ secret('RABBITMQ_MGMT_USER') }}"
        password: "{{ secret('RABBITMQ_MGMT_PASSWORD') }}"

  - id: evaluate_old_node_is_voter
    type: io.kestra.plugin.scripts.python.Script
    description: Refuses to proceed unless old_node is actually found in the current status with Membership voter, before any new replica is added.
    env:
      STATUS_JSON: "{{ outputs.inspect_current_status.body }}"
    script: |
      import json
      import os

      rows = json.loads(os.environ.get("STATUS_JSON", "[]"))

      old_row = None
      for row in rows:
          if row.get("Node Name") == "{{ inputs.old_node }}":
              old_row = row
              break

      refusal_reasons = []
      if old_row is None:
          refusal_reasons.append(f"No current replica on node '{{ inputs.old_node }}' was found in the queue's status.")
      elif old_row.get("Membership") != "voter":
          refusal_reasons.append(
              f"Replica on '{{ inputs.old_node }}' has Membership '{old_row.get('Membership')}', not 'voter'."
          )

      is_safe = len(refusal_reasons) == 0

      print("::" + json.dumps({
          "outputs": {
              "is_safe": is_safe,
              "refusal_reasons": refusal_reasons,
          }
      }) + "::")

  - id: evaluate_preflight_gate
    type: io.kestra.plugin.core.flow.If
    description: Stops before adding any new replica if the old node's replica could not be confirmed as a current voter.
    condition: "{{ outputs.evaluate_old_node_is_voter.vars.is_safe == false }}"
    then:
      - id: alert_preflight_failed
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "RabbitMQ quorum queue replica roll REFUSED for {{ inputs.vhost }}/{{ inputs.queue_name }} before adding any new replica. Reasons: {{ outputs.evaluate_old_node_is_voter.vars.refusal_reasons | toJson }}. Execution {{ execution.id }}."
          }
      - id: fail_preflight
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Preflight check failed; see the Slack alert and this execution's logs."

  - id: add_promotable_replica
    type: io.kestra.plugin.core.http.Request
    description: Adds the new node as a non-voting "promotable" replica - confirmed from rabbitmq-server's rabbit_mgmt_wm_quorum_queue_replicas_add_member.erl, which defaults membership to promotable precisely so a newly added replica can never cost the queue consensus while it is still catching up.
    uri: "{{ inputs.rabbitmq_management_url }}/api/queues/quorum/{{ inputs.vhost }}/{{ inputs.queue_name }}/replicas/add"
    method: POST
    options:
      auth:
        type: BASIC
        username: "{{ secret('RABBITMQ_MGMT_USER') }}"
        password: "{{ secret('RABBITMQ_MGMT_PASSWORD') }}"
    body: |
      {
        "node": "{{ inputs.new_node }}",
        "membership": "promotable"
      }

  - id: inspect_status_after_add
    type: io.kestra.plugin.core.http.Request
    description: Re-reads the queue's status to see whether Ra (RabbitMQ's Raft implementation) has already auto-promoted the new replica to a full voter, confirmed from rabbit_quorum_queue.erl's replica_state() type (promotable transitions to voter automatically once caught up - there is no separate manual promote call, unlike etcd).
    uri: "{{ inputs.rabbitmq_management_url }}/api/queues/quorum/{{ inputs.vhost }}/{{ inputs.queue_name }}/status"
    method: GET
    options:
      auth:
        type: BASIC
        username: "{{ secret('RABBITMQ_MGMT_USER') }}"
        password: "{{ secret('RABBITMQ_MGMT_PASSWORD') }}"

  - id: evaluate_new_node_caught_up
    type: io.kestra.plugin.scripts.python.Script
    description: Refuses to proceed to approval until the new node's own row shows Membership voter, rather than assuming any fixed wait time was long enough.
    env:
      STATUS_JSON: "{{ outputs.inspect_status_after_add.body }}"
    script: |
      import json
      import os

      rows = json.loads(os.environ.get("STATUS_JSON", "[]"))

      new_row = None
      for row in rows:
          if row.get("Node Name") == "{{ inputs.new_node }}":
              new_row = row
              break

      caught_up = new_row is not None and new_row.get("Membership") == "voter"

      print("::" + json.dumps({
          "outputs": {
              "caught_up": caught_up,
              "new_node_membership": new_row.get("Membership") if new_row else None,
              "new_node_last_applied": new_row.get("Last Applied") if new_row else None,
          }
      }) + "::")

  - id: evaluate_catchup_gate
    type: io.kestra.plugin.core.flow.If
    description: Refuses to approach the old replica's removal while the new one is still promotable, rather than letting an operator approve a cutover onto a replica that is not actually a full member yet.
    condition: "{{ outputs.evaluate_new_node_caught_up.vars.caught_up == false }}"
    then:
      - id: alert_not_caught_up
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "RabbitMQ quorum queue replica roll for {{ inputs.vhost }}/{{ inputs.queue_name }}: new replica on {{ inputs.new_node }} is still '{{ outputs.evaluate_new_node_caught_up.vars.new_node_membership }}', not yet promoted to voter. Re-run this flow once it has had time to catch up. Execution {{ execution.id }}."
          }
      - id: fail_not_caught_up
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "New replica has not been auto-promoted to a full voter yet. Re-run once it has caught up."

  - id: save_rolling_replacement_plan_kv
    type: io.kestra.plugin.core.kv.Set
    description: Persists the queue, old node, and new node before anything irreversible (removing the old replica) happens.
    key: "rabbitmq_qq_roll_{{ inputs.vhost | slugify }}_{{ inputs.queue_name | slugify }}"
    value: |
      {
        "vhost": "{{ inputs.vhost }}",
        "queue_name": "{{ inputs.queue_name }}",
        "old_node": "{{ inputs.old_node }}",
        "new_node": "{{ inputs.new_node }}",
        "new_node_membership_at_approval": "{{ outputs.evaluate_new_node_caught_up.vars.new_node_membership }}"
      }
    kvType: JSON

  - id: pause_for_operator_approval
    type: io.kestra.plugin.core.flow.Pause
    description: Waits indefinitely for an operator to review the caught-up replica before the old node's replica is removed. No pauseDuration is set, so an unattended execution waits rather than silently proceeding.

  - id: remove_old_replica
    type: io.kestra.plugin.core.http.Request
    description: Removes the old node's replica - confirmed from rabbitmq-server's rabbit_mgmt_wm_quorum_queue_replicas_delete_member.erl, which maps directly to rabbit_quorum_queue:delete_member/3.
    uri: "{{ inputs.rabbitmq_management_url }}/api/queues/quorum/{{ inputs.vhost }}/{{ inputs.queue_name }}/replicas/delete"
    method: DELETE
    options:
      auth:
        type: BASIC
        username: "{{ secret('RABBITMQ_MGMT_USER') }}"
        password: "{{ secret('RABBITMQ_MGMT_PASSWORD') }}"
    body: |
      {
        "node": "{{ inputs.old_node }}"
      }

  - id: verify_final_status
    type: io.kestra.plugin.core.http.Request
    description: Reads the queue's status back after removal, rather than trusting the delete call's HTTP response code alone.
    uri: "{{ inputs.rabbitmq_management_url }}/api/queues/quorum/{{ inputs.vhost }}/{{ inputs.queue_name }}/status"
    method: GET
    options:
      auth:
        type: BASIC
        username: "{{ secret('RABBITMQ_MGMT_USER') }}"
        password: "{{ secret('RABBITMQ_MGMT_PASSWORD') }}"

  - id: evaluate_final_verification
    type: io.kestra.plugin.scripts.python.Script
    description: Confirms the new node is present as a full voter and the old node's row no longer appears at all, instead of assuming both changes landed because the API calls returned success.
    env:
      STATUS_JSON: "{{ outputs.verify_final_status.body }}"
    script: |
      import json
      import os

      rows = json.loads(os.environ.get("STATUS_JSON", "[]"))

      new_row = next((r for r in rows if r.get("Node Name") == "{{ inputs.new_node }}"), None)
      old_row_present = any(r.get("Node Name") == "{{ inputs.old_node }}" for r in rows)

      new_node_is_voter = new_row is not None and new_row.get("Membership") == "voter"
      verified = new_node_is_voter and not old_row_present

      print("::" + json.dumps({
          "outputs": {
              "verified": verified,
              "new_node_is_voter": new_node_is_voter,
              "old_row_present": old_row_present,
          }
      }) + "::")

  - id: evaluate_outcome
    type: io.kestra.plugin.core.flow.If
    description: Branches on the real, read-back-verified final state.
    condition: "{{ outputs.evaluate_final_verification.vars.verified == false }}"
    then:
      - id: alert_verification_failed
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Names exactly what did not verify instead of claiming success because the delete call returned 204.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "RabbitMQ quorum queue replica roll for {{ inputs.vhost }}/{{ inputs.queue_name }} completed its calls but FAILED verification. new_node_is_voter={{ outputs.evaluate_final_verification.vars.new_node_is_voter }}, old_row_present={{ outputs.evaluate_final_verification.vars.old_row_present }}. Investigate the queue's status directly before trusting it. Execution {{ execution.id }}."
          }
    else:
      - id: notify_roll_verified
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "RabbitMQ quorum queue replica roll verified for {{ inputs.vhost }}/{{ inputs.queue_name }}: {{ inputs.old_node }} was removed and {{ inputs.new_node }} is confirmed as a full voter, read back from the queue's own status endpoint. Execution {{ execution.id }}."
          }

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack separately if the flow itself fails, so a partially-applied roll (for example a promotable replica added but never promoted or the old one never removed) is never mistaken for a completed or refused one.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "RabbitMQ quorum queue replica roll FAILED in execution {{ execution.id }} for {{ inputs.vhost }}/{{ inputs.queue_name }}. Check the queue's /status endpoint directly for its actual current membership before retrying; a promotable replica may already be present."
      }

outputs:
  - id: verified
    type: BOOL
    value: "{{ outputs.evaluate_final_verification.vars.verified }}"

extend:
  title: "Roll a RabbitMQ Quorum Queue Replica to New Infrastructure with a Verified Cutover"
  metaTitle: Roll a RabbitMQ Quorum Queue Replica with a Verified Cutover in Kestra
  shortDescription: Replace a RabbitMQ quorum queue's replica node using its own promotable-member mechanism, verifying it has been auto-promoted to a full voter before removing the old node's replica.
  metaDescription: "Roll a RabbitMQ quorum queue replica to new infrastructure via its own promotable-member mechanism, with verified cutover."
  description: |
    RabbitMQ quorum queues are backed by Ra, RabbitMQ's own Raft
    implementation, and moving a queue's replica onto new infrastructure by
    hand carries the same risk as any Raft membership change done
    carelessly: add the new node as a full voter too early and a queue that
    was tolerating one node's failure can lose write availability outright
    if the new replica is not actually caught up yet. Ra's own answer is the
    "promotable" membership state: a non-voting replica that Ra itself
    automatically promotes to a full voter once it has genuinely caught up.
    This blueprint drives that exact mechanism end to end - add as
    promotable, poll the queue's own status until Ra has promoted it, then
    after a human approves, remove the old replica and read the status back
    to confirm the outcome instead of trusting the API calls' response
    codes.

    ## How it works

    1. `inspect_current_status` (`io.kestra.plugin.core.http.Request`) calls RabbitMQ's real Management API `GET /api/queues/quorum/{vhost}/{queue}/status`, confirmed from `rabbit_mgmt_wm_quorum_queue_status.erl` and `rabbit_quorum_queue.erl`'s `status/2`, which returns one row per replica with `Membership` (`promotable` or `voter`), `Raft State`, `Commit Index`, and `Last Applied`.
    2. `evaluate_old_node_is_voter` (`io.kestra.plugin.scripts.python.Script`) refuses to proceed unless `old_node` is currently present with `Membership: voter`.
    3. `evaluate_preflight_gate` (`io.kestra.plugin.core.flow.If`) stops with a Slack alert and `io.kestra.plugin.core.execution.Fail` before anything is added if that check fails.
    4. `add_promotable_replica` calls `POST .../replicas/add` with `membership: promotable` - confirmed from `rabbit_mgmt_wm_quorum_queue_replicas_add_member.erl`, which defaults to exactly this membership so the new replica can never cost the queue's consensus while catching up.
    5. `inspect_status_after_add` and `evaluate_new_node_caught_up` re-read the status and refuse to proceed until Ra has itself flipped the new node's `Membership` to `voter` - confirmed from `rabbit_quorum_queue.erl`'s `replica_state()` type, there is no separate manual promote call needed, unlike etcd's raft learners.
    6. `save_rolling_replacement_plan_kv` (`io.kestra.plugin.core.kv.Set`) persists the plan before anything irreversible happens.
    7. `pause_for_operator_approval` (`io.kestra.plugin.core.flow.Pause`) waits indefinitely for a human to review the caught-up replica.
    8. `remove_old_replica` calls `DELETE .../replicas/delete` - confirmed from `rabbit_mgmt_wm_quorum_queue_replicas_delete_member.erl`.
    9. `verify_final_status` reads the status back and `evaluate_final_verification` confirms the new node is a full voter and the old node's row no longer appears, rather than trusting the delete call's HTTP status code.
    10. `evaluate_outcome` alerts Slack with the specific verification failure if the final state does not match, or confirms the verified outcome if it does.
    11. The `errors` block alerts Slack separately if the flow itself fails outright, naming that a promotable replica may already be sitting on the queue unremoved.

    ## What you get

    - A replica replacement that never risks the queue's write availability, because the new node only ever joins as a non-voting `promotable` replica until Ra itself proves it caught up.
    - A real readiness gate (`Membership == voter`, read from the queue's own status) instead of a fixed sleep or a guess at how long catch-up should take.
    - A human approval gate between "the new replica is a full voter" and "the old replica is gone for good."
    - A read-back verification of the final per-node status, naming exactly which part failed (new node not a voter, or old node's row still present) rather than trusting HTTP response codes.
    - A full KV audit record of the queue, old node, and new node for this roll.

    ## Who it's for

    - Platform and SRE teams rolling RabbitMQ clusters that back quorum queues onto new infrastructure (cloud migration, instance replacement, OS upgrade) without risking a queue's write availability mid-roll.
    - Anyone who has manually called the quorum queue replica Management API endpoints and wants the same sequence with a real catch-up check and an audit trail instead of "wait a bit and hope."

    ## Why orchestrate this with Kestra

    RabbitMQ's Management API can add and remove quorum queue replicas, but it has no concept of "wait until Ra has actually promoted this one," no approval gate between that and removing the old replica, and no record of what was done and why. Kestra supplies the readiness gate as a first-class branch, the KV-backed audit record, the human approval pause, and a visible execution history proving the read-back verification actually happened, all driven off RabbitMQ's own real, documented API surface.

    ## Prerequisites

    - A RabbitMQ cluster (3.8+) with the Management plugin enabled and a quorum queue already declared in `vhost`/`queue_name`.
    - The new node already joined to the RabbitMQ cluster (`rabbitmqctl join_cluster`) before this flow adds it as a replica - this blueprint only drives the per-queue replica membership calls, it does not join nodes to the broker cluster itself.
    - A Management API user with administrator permissions (quorum queue replica operations require admin rights).

    ### Secrets

    - `RABBITMQ_MGMT_USER` / `RABBITMQ_MGMT_PASSWORD`: HTTP Basic auth credentials for the Management API, used on every call in this flow.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by every alert in this flow.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}`.

    ### Inputs

    - `rabbitmq_management_url` (STRING, no default): base URL of the Management API.
    - `vhost` (STRING, default `%2F`): the vhost the queue lives in, URL-encoded (the default vhost "/" is `%2F`).
    - `queue_name` (STRING, no default): the quorum queue being rolled.
    - `new_node` / `old_node` (STRING, no default): the RabbitMQ node names being added and replaced.

    ### Outputs

    - `outputs.verified`: whether the final status read-back confirmed success.

    ## Quick start

    1. Join the new node to the RabbitMQ cluster (`rabbitmqctl join_cluster rabbit@existing-node`) but do not add it as a replica to any queue yet.
    2. Add the `RABBITMQ_MGMT_USER` / `RABBITMQ_MGMT_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    3. Run the flow manually and confirm `evaluate_new_node_caught_up` eventually reports `caught_up: true` (re-run if it reports `false` - the replica needs more time to catch up).
    4. Resume `pause_for_operator_approval` and confirm `evaluate_final_verification` reports `verified: true`.
    5. Decommission the old node only after `verified: true` is confirmed.

    ## How to extend

    - Loop this flow over every quorum queue on a node to roll an entire node's replicas onto new infrastructure, one queue at a time, each gated on the previous one's verified completion.
    - Use `POST /api/queues/quorum/replicas/on/:node/grow` with a vhost/queue pattern to add promotable replicas across many matching queues in one call instead of one queue at a time, then apply the same catch-up check and approval gate per queue before using the per-queue `/replicas/delete` to shrink the old node off each one.
    - Add a `max_wait_minutes` input and a retry loop around the catch-up check instead of requiring a manual re-run when the replica has not yet caught up.

    ## Pitfalls

    - **This blueprint does not join the new node to the RabbitMQ cluster.** It assumes the node is already a cluster member (`rabbitmqctl join_cluster`); it only drives this specific queue's replica membership.
    - **Ra promotes a `promotable` replica to `voter` automatically once caught up; there is no manual promote call in this flow.** If `evaluate_new_node_caught_up` keeps reporting `false` for a long time, check the new node's own RabbitMQ logs and network connectivity rather than assuming this flow is missing a step.
    - **This flow never auto-retries a failed removal.** If `evaluate_final_verification` reports `verified: false`, the fix is to inspect the queue's `/status` endpoint directly and resolve the specific gap by hand, not to re-run this flow blindly.
    - **Quorum queue replica operations can be disabled broker-wide** (`rabbit_mgmt_features:is_qq_replica_operations_disabled/0`, confirmed from the same Management API source this blueprint calls); if every request in this flow fails with a 405, that setting is the first thing to check, not this flow's logic.

    ## Links

    - [RabbitMQ Quorum Queues](https://www.rabbitmq.com/docs/quorum-queues)
    - [RabbitMQ Management HTTP API](https://www.rabbitmq.com/docs/management#http-api)
    - [Kestra KV Store Documentation](https://kestra.io/plugins/core/tasks/kv/io.kestra.plugin.core.kv.set)
  tags:
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
  ee: false
  demo: false
