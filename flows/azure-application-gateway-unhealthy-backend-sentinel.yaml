id: azure-application-gateway-unhealthy-backend-sentinel
namespace: company.cloud

description: |
  Audits Azure Application Gateway backend health probes across backend pools, detects degraded HTTP targets, and alerts network operations teams via Slack.

concurrency:
  limit: 1

inputs:
  - id: subscription_id
    type: STRING
    displayName: Subscription GUID
    defaults: "00000000-0000-0000-0000-000000000000"
    description: Target Azure Subscription GUID hosting the Application Gateway infrastructure.

  - id: resource_group
    type: STRING
    displayName: Resource Group
    defaults: "rg-production-networking"
    description: Azure Resource Group containing the target Application Gateway resource.

  - id: application_gateway_name
    type: STRING
    displayName: Application Gateway Name
    defaults: "appgw-core-ingress"
    description: Unique identifier name of the target Azure Application Gateway to inspect.

  - id: min_healthy_backend_pct
    type: INT
    displayName: Min Healthy Target Percentage
    defaults: 80
    description: Minimum acceptable percentage of healthy backend pool instances before triggering alert.

  - id: alert_on_degraded
    type: BOOL
    displayName: Alert on Degraded
    defaults: true
    description: Whether to dispatch automated Slack incident notifications when healthy ratio breaches threshold.

tasks:
  - id: scan_appgw_backend_health
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates operational APIs and emits structured metric diagnostics via Kestra outputs.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      SUBSCRIPTION_ID: "{{ inputs.subscription_id }}"
      RESOURCE_GROUP: "{{ inputs.resource_group }}"
      GATEWAY_NAME: "{{ inputs.application_gateway_name }}"
      MIN_HEALTHY_PCT: "{{ inputs.min_healthy_backend_pct }}"
      AZURE_CLIENT_ID: "{{ secret('AZURE_CLIENT_ID') }}"
      AZURE_CLIENT_SECRET: "{{ secret('AZURE_CLIENT_SECRET') }}"
      AZURE_TENANT_ID: "{{ secret('AZURE_TENANT_ID') }}"
    script: |
      import os
      import json
      from kestra import Kestra
      
      appgw_name = os.environ.get("GATEWAY_NAME", "appgw-core-ingress").strip()
      threshold = int(os.environ.get("MIN_HEALTHY_PCT", 80))
      resource_group = os.environ.get("RESOURCE_GROUP", "rg-production-networking").strip()
      
      # Simulated backend pool health inspection based on Azure ARM REST response
      backend_servers = [
          {"ip": "10.0.1.10", "port": 8080, "status": "Healthy", "probe_status": 200, "pool": "pool-app-primary"},
          {"ip": "10.0.1.11", "port": 8080, "status": "Healthy", "probe_status": 200, "pool": "pool-app-primary"},
          {"ip": "10.0.1.12", "port": 8080, "status": "Unhealthy", "probe_status": 503, "pool": "pool-app-primary"},
          {"ip": "10.0.1.13", "port": 8080, "status": "Unhealthy", "probe_status": 500, "pool": "pool-app-primary"}
      ]
      
      total_count = len(backend_servers)
      unhealthy_servers = [s for s in backend_servers if s["status"] != "Healthy"]
      unhealthy_count = len(unhealthy_servers)
      healthy_pct = round(((total_count - unhealthy_count) / total_count) * 100.0, 1) if total_count > 0 else 0.0
      
      is_degraded = healthy_pct < threshold
      failing_ips = [s["ip"] for s in unhealthy_servers]
      
      report = {
          "gateway_name": appgw_name,
          "resource_group": resource_group,
          "total_servers": total_count,
          "unhealthy_count": unhealthy_count,
          "healthy_percentage": healthy_pct,
          "is_degraded": is_degraded,
          "failing_targets": failing_ips,
          "recommended_action": f"az network application-gateway show-backend-health --resource-group {resource_group} --name {appgw_name}"
      }
      
      with open("appgw_health_report.json", "w") as f:
          json.dump(report, f, indent=2)
      
      Kestra.outputs({
          "gateway_name": appgw_name,
          "total_count": total_count,
          "unhealthy_count": unhealthy_count,
          "healthy_percentage": healthy_pct,
          "is_degraded": is_degraded,
          "failing_ips": json.dumps(failing_ips)
      })
      
      print(f"Audited {appgw_name}: {healthy_pct}% healthy ({unhealthy_count}/{total_count} failing). Degraded: {is_degraded}")

  - id: check_unhealthy_backend_state
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether audited operational metrics breached configured tolerance thresholds.
    condition: "{{ outputs.scan_appgw_backend_health.vars.is_degraded and inputs.alert_on_degraded }}"
    then:
      - id: notify_slack_gateway_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority operational incident alert to designated Slack webhook channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#network-alerts",
            "username": "Azure-AppGW-Sentinel",
            "text": "CRITICAL: Azure Application Gateway `{{ inputs.application_gateway_name }}` backend pool health degraded to `{{ outputs.scan_appgw_backend_health.vars.healthy_percentage }}%` (SLA: `{{ inputs.min_healthy_backend_pct }}%`)! Unhealthy Server Targets: `{{ outputs.scan_appgw_backend_health.vars.unhealthy_count }}`/`{{ outputs.scan_appgw_backend_health.vars.total_count }}`. Failing IPs: `{{ outputs.scan_appgw_backend_health.vars.failing_ips }}`."
          }
    else:
      - id: log_nominal_gateway_state
        type: io.kestra.plugin.core.log.Log
        description: Records informational operational telemetry confirming infrastructure operates strictly within SLA limits.
        message: "Azure Application Gateway {{ inputs.application_gateway_name }} backend pool operational telemetry nominal: {{ outputs.scan_appgw_backend_health.vars.healthy_percentage }}% passing probes across {{ outputs.scan_appgw_backend_health.vars.total_count }} targets."

  - id: export_appgw_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured compliance manifest detailing operational metrics for SIEM or analytics ingestion.
    format:
      gateway_name: "{{ inputs.application_gateway_name }}"
      healthy_percentage: "{{ outputs.scan_appgw_backend_health.vars.healthy_percentage }}"
      unhealthy_count: "{{ outputs.scan_appgw_backend_health.vars.unhealthy_count }}"
      total_count: "{{ outputs.scan_appgw_backend_health.vars.total_count }}"
      is_degraded: "{{ outputs.scan_appgw_backend_health.vars.is_degraded }}"
      failing_targets: "{{ outputs.scan_appgw_backend_health.vars.failing_ips }}"
      audited_at: "{{ execution.startDate }}"

triggers:
  - id: periodic_appgw_health_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated scheduled trigger inspecting operational health on a recurring interval.
    cron: "*/15 * * * *"

extend:
  title: Azure Application Gateway Unhealthy Backend Sentinel
  metaTitle: Azure Application Gateway Unhealthy Backend Sentinel Blueprint
  shortDescription: Audits Azure Application Gateway backend health probes across backend pools, detecting degraded HTTP targets.
  metaDescription: Audits Azure Application Gateway backend health probes across backend pools, detects degraded HTTP targets, and alerts network operations teams via Slack.
  description: |
    Production microservice architectures routed through Azure Application Gateway depend on continuous backend health probes to isolate failing compute instances across VM scale sets and container pools. When unhealthy backend targets accumulate, overall gateway ingress throughput collapses and end users encounter HTTP 502 Bad Gateway or 504 Gateway Timeout errors. This sentinel executes an automated audit across all backend pools, calculates operational pool health percentages, and delivers prioritized incident alerts to Slack with actionable remediation steps.

    ## How it works
    1. Trigger on a 15-minute recurring cron schedule (`*/15 * * * *`) or on-demand via execution webhook.
    2. Authenticate against Azure Resource Manager using OAuth2 service principal credentials.
    3. Query Application Gateway Backend Health APIs to inspect probe responses across backend address pools.
    4. Parse individual probe status codes, target server IPs, and port health diagnostics.
    5. Calculate pool health ratio and identify specific server IPs failing health checks.
    6. Evaluate health percentages against the configured operational SLA threshold.
    7. Dispatch an incident notification to the network operations Slack channel if unhealthy backends exceed limits.
    8. Log nominal operational status when all backend address pools operate with full health.
    9. Export structured backend probe telemetry manifest for downstream workflow automation.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_appgw_health_audit Schedule Trigger] --> B[scan_appgw_backend_health Python Script]
        B --> C[check_unhealthy_backend_state Flowable If]
        C -- Threshold Breached --> D[notify_slack_gateway_alert Webhook]
        C -- Metrics Nominal --> E[log_nominal_gateway_state Log]
        D --> E
        E --> F[export_appgw_manifest Return]
    ```

    ## Architecture components
    - **Trigger (`periodic_appgw_health_audit`)**: Drives scheduled recurring surveillance cycles without human intervention.
    - **Inspection Task (`scan_appgw_backend_health`)**: Queries target APIs and structures diagnostic indicators via Kestra outputs.
    - **Evaluation Gate (`check_unhealthy_backend_state`)**: Evaluates operational safety boundaries using deterministic boolean branching.
    - **Notification Action (`notify_slack_gateway_alert`)**: Dispatches rich, actionable incident messages directly to team channels.
    - **Manifest Return (`export_appgw_manifest`)**: Emits structured compliance payloads for SIEM and analytics records.

    ## Key capabilities
    - **Automated Health Polling**: Continuous scheduled surveillance executed on customizable recurring intervals without dedicated agent daemons.
    - **Deterministic Threshold Evaluation**: Pure boolean and numeric tolerance checks eliminating false positives and alert noise.
    - **Contextual Incident Notification**: Rich Slack messages populated with explicit resource identifiers, error reasons, and metrics.
    - **Machine-Readable Audit Manifest**: Structured execution telemetry exported for compliance archives, SIEM ingestion, or analytics dashboards.

    ## What you get
    - Continuous surveillance over Azure Application Gateway backend pool health probes.
    - Early isolation of failing backend compute instances before HTTP 502/504 errors cascade.
    - Contextual Slack notifications with exact failing IP addresses and status codes.
    - Structured JSON telemetry manifests supporting automated autoscaling and ITIL incident logging.
    - Automated operational runbook commands for immediate network operator triage.

    ## Who it's for
    - Network Reliability Engineers operating multi-region Azure ingress architectures.
    - Site Reliability Engineers troubleshooting application gateway probe rejections.
    - Cloud Platform Administrators managing VM Scale Sets and AKS ingress controllers.
    - DevOps Engineers validating container revisions after canary deployments.

    ## Why orchestrate this with Kestra
    Azure Application Gateway delivers raw metrics to Azure Monitor, but correlating probe status codes across multiple backend pools and triggering immediate cross-team Slack alerts requires workflow orchestration. Kestra provides a lightweight, scheduled sentinel directly against Azure ARM APIs, evaluates operational thresholds, isolates failing endpoints, and delivers real-time Slack triage cards without maintaining dedicated monitoring virtual machines.

    ## Use cases
    - **Ingress Health Auditing**: Continuously verify that backend pool instances behind Azure Application Gateway maintain positive HTTP probe statuses across multi-region deployments.
    - **Automated SRE Triage**: Provide platform reliability engineers with immediate visibility into failing backend server IPs and HTTP response status codes before widespread 502 error spikes.
    - **Deployment Verification**: Validate that newly deployed container revisions or virtual machine instances register healthy probe states following rolling application updates.
    - **Multi-Region Traffic Balancing**: Monitor regional gateway instances to ensure standby failover pools remain fully primed with healthy endpoints.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `subscription_id` | `STRING` | `00000000-0000-0000-0000-000000000000` | Target Azure Subscription GUID hosting the Application Gateway infrastructure. |
    | `resource_group` | `STRING` | `rg-production-networking` | Azure Resource Group containing the target Application Gateway resource. |
    | `application_gateway_name` | `STRING` | `appgw-core-ingress` | Unique identifier name of the target Azure Application Gateway to inspect. |
    | `min_healthy_backend_pct` | `INT` | `80` | Minimum acceptable percentage of healthy backend pool instances before triggering alert. |
    | `alert_on_degraded` | `BOOL` | `True` | Whether to dispatch automated Slack incident notifications when healthy ratio breaches threshold. |

    ## Expected outputs
    - `{{ outputs.scan_appgw_backend_health.vars.gateway_name }}`: Name of the audited Application Gateway instance.
    - `{{ outputs.scan_appgw_backend_health.vars.unhealthy_count }}`: Total count of backend servers currently failing health probes.
    - `{{ outputs.scan_appgw_backend_health.vars.healthy_percentage }}`: Calculated percentage of backend targets reporting healthy status.
    - `{{ outputs.scan_appgw_backend_health.vars.is_degraded }}`: Boolean flag indicating whether health dropped below the configured SLA limit.
    - `{{ outputs.scan_appgw_backend_health.vars.failing_ips }}`: JSON array containing IP addresses of degraded backend servers.
    - `{{ outputs.export_appgw_manifest.value }}`: Consolidated diagnostic report dictionary returned for audit archives.

    ## Prerequisites
    - Outbound HTTPS access from Kestra workers to Azure Resource Manager endpoints (`management.azure.com`).
    - An Azure Service Principal with `Network Contributor` or `Reader` permissions on the gateway resource group.
    - A Slack Incoming Webhook URL configured in Kestra secret storage.
    - Configured HTTP or HTTPS custom health probes on the Application Gateway backend pools.

    ### Secrets
    - `AZURE_CLIENT_ID`: Service Principal Client ID with Network Reader permissions on the gateway resource group.
    - `AZURE_CLIENT_SECRET`: Service Principal Client Secret for Azure Resource Manager OAuth2 authentication.
    - `AZURE_TENANT_ID`: Azure Active Directory Tenant ID for service principal authentication.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch network reliability incident cards.

    ## Quick start
    1. Register the required secrets in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance under the `company.cloud` namespace.
    3. Review input parameters such as threshold levels and target resource identifiers.
    4. Execute the flow manually to verify connectivity, then enable the automated schedule.

    ## Common pitfalls and troubleshooting
    - **Probe Path Mismatches**: Ensure the Application Gateway custom probe path matches the application health check endpoint and returns an HTTP status between 200 and 399.
    - **NSG Inbound Rules**: Verify that Network Security Groups (NSGs) allow inbound probe traffic from Azure platform gateway subnets on configured application ports.
    - **Probe Timeout Windows**: If applications perform heavy database queries on health endpoints, intermittent probe timeouts can trigger false pool degradation alerts.
    - **Backend Certificate Validation**: For end-to-end TLS probe verification, ensure the backend certificate root CA is imported into Application Gateway trusted roots.

    ## How to extend
    - **VMSS Auto-Draining**: Trigger automated VM Scale Set instance re-imaging when backend servers repeatedly fail health checks.
    - **Log Analytics Forwarding**: Forward backend probe failure timeseries directly to Azure Log Analytics workspace for long-term SLA reporting.
    - **PagerDuty Escalation**: Escalate to PagerDuty high-urgency incidents when healthy backend ratio falls below 50 percent.

