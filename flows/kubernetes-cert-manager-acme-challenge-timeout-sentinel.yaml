    - [cert-manager ACME Challenge Troubleshooting Guide](https://cert-manager.io/docs/troubleshooting/acme/)
    - [Kubernetes Python Client Official Documentation](https://github.com/kubernetes-client/python)
    - [Let's Encrypt Challenge Types Reference](https://letsencrypt.org/docs/challenge-types/)
