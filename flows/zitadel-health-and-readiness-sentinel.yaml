id: zitadel-health-and-readiness-sentinel
namespace: company.team

description: |
  Continuously monitors ZITADEL Identity and Access Management (IAM) instances by auditing backend readiness probes, container health endpoints, and OpenID Connect (OIDC) discovery metadata, classifying cluster posture, routing real-time Slack incident alerts, and logging compliance audit records.

inputs:
  - id: zitadel_host
    type: STRING
    displayName: ZITADEL Host
    description: Hostname or IP address of the ZITADEL instance reachable by the Kestra worker.
    defaults: "localhost"

  - id: zitadel_port
    type: INT
    displayName: ZITADEL Port
    description: HTTP port of the ZITADEL instance (defaults to 8080).
    defaults: 8080

  - id: zitadel_scheme
    type: STRING
    displayName: Protocol Scheme
    description: URI protocol scheme (http or https).
    defaults: "http"

  - id: expected_issuer_prefix
    type: STRING
    displayName: Expected Issuer Prefix
    description: Substring that must match the start of the OIDC discovery issuer URL to verify domain integrity.
    defaults: "http"

tasks:
  - id: probe_ready_endpoint
    type: io.kestra.plugin.core.http.Request
    description: Queries ZITADEL /debug/ready endpoint to verify database connection pool availability and storage engine readiness.
    uri: "{{ inputs.zitadel_scheme }}://{{ inputs.zitadel_host }}:{{ inputs.zitadel_port }}/debug/ready"
    method: GET
    options:
      allowFailed: true
    allowFailure: true

  - id: probe_health_endpoint
    type: io.kestra.plugin.core.http.Request
    description: Queries ZITADEL /debug/healthz endpoint to verify HTTP server liveness and internal runtime health.
    uri: "{{ inputs.zitadel_scheme }}://{{ inputs.zitadel_host }}:{{ inputs.zitadel_port }}/debug/healthz"
    method: GET
    options:
      allowFailed: true
    allowFailure: true

  - id: probe_oidc_discovery
    type: io.kestra.plugin.core.http.Request
    description: Queries /.well-known/openid-configuration to verify active OIDC discovery metadata, jwks_uri, and issuer resolution.
    uri: "{{ inputs.zitadel_scheme }}://{{ inputs.zitadel_host }}:{{ inputs.zitadel_port }}/.well-known/openid-configuration"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: classify_zitadel_posture
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates HTTP status codes across readiness, health, and OIDC discovery endpoints to classify cluster operational status.
    format: |
      {{ outputs.probe_ready_endpoint.code is not defined or outputs.probe_health_endpoint.code is not defined ? 'INSTANCE_UNREACHABLE' : (outputs.probe_ready_endpoint.code != 200 ? 'DATABASE_OR_BACKEND_UNREADY' : (outputs.probe_health_endpoint.code != 200 ? 'SERVICE_UNHEALTHY' : (outputs.probe_oidc_discovery.code != 200 or not (((outputs.probe_oidc_discovery.body | json | jq('.issuer') | first) ?? '') contains inputs.expected_issuer_prefix) ? 'OIDC_DISCOVERY_CORRUPTED' : 'HEALTHY_COMPLIANT'))) }}

  - id: route_by_posture
    type: io.kestra.plugin.core.flow.Switch
    description: Routes alerts and logs based on the classified ZITADEL operational posture.
    value: "{{ outputs.classify_zitadel_posture.value }}"
    cases:
      "HEALTHY_COMPLIANT":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "ZITADEL IAM instance at {{ inputs.zitadel_scheme }}://{{ inputs.zitadel_host }}:{{ inputs.zitadel_port }} is HEALTHY_COMPLIANT. Ready status: {{ outputs.probe_ready_endpoint.code }}. Health status: {{ outputs.probe_health_endpoint.code }}. OIDC Issuer: {{ outputs.probe_oidc_discovery.body | json | jq('.issuer') | first }}."

      "DATABASE_OR_BACKEND_UNREADY":
        - id: alert_ready_failure_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "ZITADEL Sentinel CRITICAL ALERT: Database or backend unready on " ~ inputs.zitadel_host ~ ":" ~ inputs.zitadel_port ~ "! /debug/ready returned HTTP " ~ (outputs.probe_ready_endpoint.code ?? 'NONE') ~ ". Database connection pool may be exhausted or migrations stalled. Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_ready_failure
          type: io.kestra.plugin.core.log.Log
          message: "CRITICAL: ZITADEL /debug/ready returned non-200 code: {{ outputs.probe_ready_endpoint.code }}."

      "SERVICE_UNHEALTHY":
        - id: alert_unhealthy_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "ZITADEL Sentinel WARNING: Service unhealthy on " ~ inputs.zitadel_host ~ ":" ~ inputs.zitadel_port ~ "! /debug/healthz returned HTTP " ~ (outputs.probe_health_endpoint.code ?? 'NONE') ~ ". Core HTTP worker process degraded. Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_unhealthy
          type: io.kestra.plugin.core.log.Log
          message: "WARNING: ZITADEL /debug/healthz returned non-200 code: {{ outputs.probe_health_endpoint.code }}."

      "OIDC_DISCOVERY_CORRUPTED":
        - id: alert_discovery_corrupted_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "ZITADEL Sentinel CRITICAL: OIDC discovery metadata corrupted on " ~ inputs.zitadel_host ~ ":" ~ inputs.zitadel_port ~ "! Endpoint returned HTTP " ~ (outputs.probe_oidc_discovery.code ?? 'NONE') ~ " or missing expected issuer prefix '" ~ inputs.expected_issuer_prefix ~ "'. Downstream authentication will fail. Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_discovery_corrupted
          type: io.kestra.plugin.core.log.Log
          message: "CRITICAL: ZITADEL OIDC discovery metadata invalid or unreachable."

      "INSTANCE_UNREACHABLE":
        - id: alert_unreachable_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "ZITADEL Sentinel OUTAGE: Cannot reach ZITADEL instance at " ~ inputs.zitadel_scheme ~ "://" ~ inputs.zitadel_host ~ ":" ~ inputs.zitadel_port ~ ". Network partitioned or container stopped. Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_unreachable
          type: io.kestra.plugin.core.log.Log
          message: "OUTAGE: ZITADEL instance unreachable at {{ inputs.zitadel_scheme }}://{{ inputs.zitadel_host }}:{{ inputs.zitadel_port }}."

  - id: audit_summary
    type: io.kestra.plugin.core.output.OutputValues
    description: Exports structured telemetry attributes and endpoint verification metrics for compliance audit reporting.
    values:
      target_instance: "{{ inputs.zitadel_scheme }}://{{ inputs.zitadel_host }}:{{ inputs.zitadel_port }}"
      ready_http_code: "{{ outputs.probe_ready_endpoint.code ?? 0 }}"
      healthz_http_code: "{{ outputs.probe_health_endpoint.code ?? 0 }}"
      oidc_discovery_code: "{{ outputs.probe_oidc_discovery.code ?? 0 }}"
      oidc_issuer: "{{ outputs.probe_oidc_discovery.body | json | jq('.issuer') | first ?? 'NONE' }}"
      cluster_posture: "{{ outputs.classify_zitadel_posture.value }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on unexpected workflow runtime execution failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {"text": "ZITADEL Sentinel workflow failed unexpectedly during execution " ~ execution.id ~ " in namespace " ~ flow.namespace ~ "."} | toJson }}

triggers:
  - id: hourly_canary
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated ZITADEL health and readiness audit at the top of every hour. Shipped disabled.
    cron: "0 * * * *"
    disabled: true
    inputs:
      zitadel_host: "localhost"
      zitadel_port: 8080
      zitadel_scheme: "http"
      expected_issuer_prefix: "http"

extend:
  title: ZITADEL Identity Provider Health and Readiness Sentinel
  metaTitle: ZITADEL Identity Provider Health and Readiness Sentinel | Kestra
  shortDescription: Continuous ZITADEL IAM cluster readiness probing, OIDC discovery validation, and automated Slack escalation.
  metaDescription: Audit ZITADEL IAM readiness, validate database connection pooling and OIDC discovery endpoints, classify cluster health, and alert Slack via Kestra.
  description: |
    Continuously audits ZITADEL Identity and Access Management (IAM) clusters by probing database readiness endpoints, container health liveness routes, and OpenID Connect (OIDC) discovery metadata, classifying operational health, and dispatching real-time incident escalation alerts to Slack.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `probe_ready_endpoint` (`io.kestra.plugin.core.http.Request`) queries `/debug/ready` to verify that the ZITADEL instance has completed initialization and that its backend database connection pool (CockroachDB or PostgreSQL) is healthy and responsive.
    2. `probe_health_endpoint` (`io.kestra.plugin.core.http.Request`) queries `/debug/healthz` to confirm process liveness and web server responsiveness.
    3. `probe_oidc_discovery` (`io.kestra.plugin.core.http.Request`) queries `/.well-known/openid-configuration` to confirm that the public OpenID Connect discovery document is serving valid JSON with an intact `issuer` URL and cryptographic key endpoints.
    4. `classify_zitadel_posture` (`io.kestra.plugin.core.debug.Return`) evaluates endpoint response codes and metadata using a declarative Pebble expression:
       - Classifies as `INSTANCE_UNREACHABLE` if endpoints cannot be reached over the network.
       - Classifies as `DATABASE_OR_BACKEND_UNREADY` if `/debug/ready` returns non-200 (database stall or connection exhaustion).
       - Classifies as `SERVICE_UNHEALTHY` if `/debug/healthz` returns non-200.
       - Classifies as `OIDC_DISCOVERY_CORRUPTED` if the discovery document is unavailable or the issuer URL prefix does not match expectations.
       - Classifies as `HEALTHY_COMPLIANT` when all probes succeed.
    5. `route_by_posture` (`io.kestra.plugin.core.flow.Switch`) routes execution based on the classification:
       - `HEALTHY_COMPLIANT`: Logs successful audit confirmation with issuer URL and HTTP status codes.
       - `DATABASE_OR_BACKEND_UNREADY`: Posts a critical Slack alert flagging database connection exhaustion.
       - `SERVICE_UNHEALTHY`: Alerts Slack that the core process is degraded.
       - `OIDC_DISCOVERY_CORRUPTED`: Dispatches an urgent Slack alert warning that downstream SSO authentication will fail.
       - `INSTANCE_UNREACHABLE`: Notifies on-call teams of total service unavailability.
    6. `audit_summary` (`io.kestra.plugin.core.output.OutputValues`) exports structured metrics capturing endpoint HTTP status codes and cluster posture for compliance logging.
    7. `errors` sends a priority failure notification to Slack if unhandled workflow execution errors occur.

    ## What you get

    - Automated, continuous validation of critical IAM control planes without relying on manual user login tests.
    - Early warning of database connection exhaustion and migration stalls before end users experience authentication timeouts.
    - Active verification of OIDC discovery documents so single sign-on (SSO) clients and API gateways never receive corrupted metadata.
    - Contextual Slack alerts detailing exact endpoint failure codes and instance hostnames.
    - Auditable execution history satisfying SOC2 and ISO27001 identity infrastructure monitoring controls.

    ## Who it's for

    - Platform Engineers and SREs responsible for uptime and reliability of identity infrastructure.
    - Security Operations (SecOps) teams maintaining high-availability authentication backbones.
    - Cloud Architects managing self-hosted or Kubernetes-deployed ZITADEL IAM clusters.

    ## Why orchestrate this with Kestra

    Identity provider outages are critical Sev-0 incidents that cascade into every downstream microservice and enterprise portal. Standard TCP port checks cannot verify whether ZITADEL's backend database connection pool is functional or whether OIDC discovery documents are returning corrupted issuer URLs. Kestra orchestrates multi-stage HTTP inspection, declarative Pebble classification, failure escalation to Slack, and centralized compliance audit trails in a single workflow.

    ## Prerequisites

    - A running ZITADEL instance (Docker container or Kubernetes cluster).
    - An incoming Slack webhook URL for incident notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Incoming Slack webhook URL used by `alert_ready_failure_slack`, `alert_unhealthy_slack`, `alert_discovery_corrupted_slack`, `alert_unreachable_slack`, and `alert_flow_failure`.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local ZITADEL instance using Docker:
       ```bash
       docker run -d --name zitadel -p 8080:8080 ghcr.io/zitadel/zitadel:latest start-from-init --masterkey "MasterkeyNeedsToHave32Characters"
       ```
    3. Import this blueprint into Kestra and click **Execute** with default inputs (`zitadel_host: "localhost"`).
    4. Confirm that `classify_zitadel_posture` classifies `HEALTHY_COMPLIANT` and inspect the structured telemetry in `audit_summary`.
    5. Enable the `hourly_canary` schedule to automate continuous IAM health monitoring.

    ## How to extend

    - Add authenticated user verification by querying `/v2/users` using a Personal Access Token (PAT) stored in Kestra secrets.
    - Integrate PagerDuty or Opsgenie alerts for out-of-hours on-call paging during `INSTANCE_UNREACHABLE` or `DATABASE_OR_BACKEND_UNREADY` incidents.
    - Expand multi-region monitoring by looping over an array of ZITADEL edge cluster hostnames using `io.kestra.plugin.core.flow.ForEach`.

    ## Links

    - [ZITADEL Documentation](https://zitadel.com/docs)
    - [ZITADEL GitHub Repository](https://github.com/zitadel/zitadel)
    - [ZITADEL Health & Observability Guide](https://zitadel.com/docs/guides/manage/customize/observability)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Business
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
