id: google-drive-stale-file-retention-sentinel
namespace: company.team

description: |
  List Google Drive files under a folder older than a retention threshold, alert Slack with the
  count and reclaimable size when any are found, and log a governance audit trail either way.
  Read-only: this flow never deletes or modifies a file.

inputs:
  - id: folder_id
    type: STRING
    displayName: Drive folder ID
    description: The Drive folder to scan, found in the folder's URL after /folders/.
    defaults: "<your-drive-folder-id>"

  - id: retention_days
    type: INT
    displayName: Retention age in days
    description: A non-trashed file under the folder with a createdTime older than this many days is reported stale.
    defaults: 180

  - id: max_stale_count
    type: INT
    displayName: Max stale count
    description: Alert when this many or more matching files are found.
    defaults: 1

tasks:
  - id: list_stale_files
    type: io.kestra.plugin.googleworkspace.drive.List
    description: Read-only. Server-side filters to non-trashed files under folder_id created before the retention cutoff, computed here so the Drive API does the date comparison.
    allowFailure: true
    serviceAccount: "{{ secret('GOOGLE_SERVICE_ACCOUNT_JSON') }}"
    query: "'{{ inputs.folder_id }}' in parents and trashed = false and createdTime < '{{ now() | dateAdd(-inputs.retention_days, 'DAYS') | date('yyyy-MM-dd') }}T00:00:00'"

  - id: evaluate
    type: io.kestra.plugin.core.output.OutputValues
    description: Counts the matching files and sums their size, in bytes, from the server-side filtered result.
    values:
      stale_count: "{{ outputs.list_stale_files is defined ? (outputs.list_stale_files.files | length) : -1 }}"
      stale_size_bytes: "{{ outputs.list_stale_files is not defined ? 0 : (({'files': outputs.list_stale_files.files} | jq('[.files[].size // 0 | tonumber] | add // 0')) | first) }}"
      severity: "{{ outputs.list_stale_files is not defined ? 'CRITICAL' : ((outputs.list_stale_files.files | length) >= inputs.max_stale_count ? 'STALE_FILES_FOUND' : 'OK') }}"

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.values.severity != 'OK' }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': outputs.evaluate.values.severity ~ ': ' ~ outputs.evaluate.values.stale_count ~ ' file(s) under Drive folder ' ~ inputs.folder_id ~ ' are older than ' ~ inputs.retention_days ~ ' day(s), ' ~ outputs.evaluate.values.stale_size_bytes ~ ' bytes reclaimable.'} | toJson }}
    else:
      - id: compliant
        type: io.kestra.plugin.core.log.Log
        message: "No file under Drive folder {{ inputs.folder_id }} is older than {{ inputs.retention_days }} day(s)."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "Google Drive stale file retention sentinel complete for folder {{ inputs.folder_id }}: {{ outputs.evaluate.values.stale_count }} stale file(s), {{ outputs.evaluate.values.stale_size_bytes }} bytes, severity {{ outputs.evaluate.values.severity }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Google Drive stale file retention sentinel failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable once GOOGLE_SERVICE_ACCOUNT_JSON and SLACK_WEBHOOK_URL are set and folder_id points at a real folder.
    cron: "0 7 * * 1"
    disabled: true
    inputs:
      folder_id: "<your-drive-folder-id>"
      retention_days: 180
      max_stale_count: 1

extend:
  title: Google Drive Stale File Retention Sentinel
  metaTitle: Google Drive Stale File Retention Sentinel with Kestra
  shortDescription: List Google Drive files under a folder past a retention threshold, alert Slack with the count and reclaimable size, and log a governance audit trail.
  metaDescription: List Google Drive files under a folder past a retention threshold, alert Slack with the reclaimable size, and log the result.
  description: |
    Shared drive folders accumulate exports, old reports, and one-off uploads that nobody ever
    circles back to clean up. Google Drive has lifecycle rules for individual files only through
    manual trash, with no scheduled, folder-wide retention sweep of its own. This blueprint reads
    what is actually under a folder, flags what has outlived its retention window, and reports
    the reclaimable size, not just a guess.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `list_stale_files` (`io.kestra.plugin.googleworkspace.drive.List`) runs a Drive v3 search
       query scoped to `folder_id`, server-side filtered to `trashed = false` and `createdTime`
       older than `retention_days`. Read-only; nothing in Drive is changed. `allowFailure: true`
       covers an API or auth error without failing the flow outright.
    2. `evaluate` (`io.kestra.plugin.core.output.OutputValues`) counts the matched files and sums
       their `size` in bytes with a `jq` filter.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **compliant:** logs that nothing is stale.
       - **alert:** posts the count and reclaimable bytes to Slack.
    4. `summary` logs the count, size, and severity, closing the governance cycle.
    5. `errors` alerts Slack if the flow itself fails, for example invalid service account
       credentials.

    ## What you get

    - A number, not a guess: the exact count and byte total of what is sitting past retention
      under a folder.
    - A filter computed server-side by Drive's own query language, so the date comparison does
      not depend on paging through every file client-side first.
    - A read-only check with zero risk of deleting a real file.

    ## Who it's for

    - Platform and IT teams who own shared Drive folders and have no process catching exports or
      reports nobody cleaned up.
    - Teams evaluating the Google Workspace plugin who want a worked example of `drive.List`
      used with a Drive v3 query for a governance check, distinct from this repo's existing
      Google Workspace blueprints, none of which read Drive file metadata this way.

    ## Why orchestrate this with Kestra

    Drive answers one query at a time through its own UI; it does not keep a schedule, compare
    file age against a retention policy you declare, or notify anyone. Kestra keeps
    `retention_days` as a flow input, turns the query into a Slack page with a real byte count,
    and keeps a full execution history of every run.

    ## Prerequisites

    - A Google Cloud service account with Drive API access and read permission on the target
      folder (shared with the service account's email, or domain-wide delegation configured for
      the Workspace).
    - A Drive folder with at least one file old enough to confirm the filter logic against.
    - A Slack incoming webhook URL.

    This flow calls the Google Drive API directly over HTTPS; there is no official local Google
    Drive emulator, so `list_stale_files` cannot be exercised against a local Docker container.

    ### Secrets

    - `GOOGLE_SERVICE_ACCOUNT_JSON`: the full service account JSON key used by
      `list_stale_files`. In Kestra OSS, provide it as the base64-encoded environment variable
      `SECRET_GOOGLE_SERVICE_ACCOUNT_JSON`.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block. In Kestra OSS, provide it as
      the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `folder_id` | `<your-drive-folder-id>` | Drive folder to scan |
    | `retention_days` | `180` | Age past which a file is reported stale |
    | `max_stale_count` | `1` | Matched-file count that triggers the Slack alert |

    ### Outputs

    - `{{ outputs.list_stale_files.files }}`: every matched file (`id`, `name`, `size`, `version`,
      `mimeType`, `createdTime`, `parents`, `trashed`).
    - `{{ outputs.evaluate.values.stale_count }}` / `.stale_size_bytes`: how many files are stale
      and their combined size.
    - `{{ outputs.evaluate.values.severity }}`: `OK`, `STALE_FILES_FOUND`, or `CRITICAL`.

    ### Pitfalls

    - `folder_id` scopes the query to direct children of that folder only; Drive's `in parents`
      operator is not recursive, a nested subfolder's files are not included.
    - `size` is null for native Google Docs/Sheets/Slides (they have no byte size of their own);
      the `jq` sum treats a null size as `0`, so a folder full of native Google files can report
      a correct file count with a reclaimable size of `0`.
    - `createdTime`, not the last-modified time, is what this check compares against
      `retention_days`; a file edited yesterday but created a year ago still counts as stale.

    ## Quick start

    1. Add the `GOOGLE_SERVICE_ACCOUNT_JSON` and `SLACK_WEBHOOK_URL` secrets.
    2. Share the target folder with the service account's email address.
    3. Set `folder_id` to that folder and run the flow, confirming `summary` logs a count.
    4. Lower `retention_days` below a known file's age to confirm `alert` fires with its size.
    5. Enable the `weekly` trigger once `retention_days` matches your actual retention policy.

    ## How to extend

    - Loop over several `folder_id` values with `io.kestra.plugin.core.flow.Loop` to cover more
      than one shared folder in a single scheduled run.
    - Add a remediation branch that moves matched files to a separate "pending deletion" Drive
      folder instead of deleting them outright, gated behind the `auto_remediate`/`dry_run` pair
      used elsewhere in this repo's guard blueprints.
    - Group the alert by `mimeType` to see whether the reclaimable space is mostly large binary
      exports or native Google files with zero size.

    ## Links

    - Google Workspace plugin: https://kestra.io/plugins/plugin-googleworkspace
    - Google Drive search query reference: https://developers.google.com/workspace/drive/api/guides/search-files
    - Slack incoming webhooks: https://api.slack.com/messaging/webhooks
  tags:
    - Business
    - Cloud
  subTags:
    - Policy & Compliance
    - HR & Ops Automation
  ee: false
  demo: false
