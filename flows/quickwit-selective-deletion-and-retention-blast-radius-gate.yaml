id: quickwit-selective-deletion-and-retention-blast-radius-gate
namespace: company.governance

description: |
  Audit and gate Quickwit document deletions by evaluating matched record
  blast radius before queuing irreversible janitor purge tasks on object storage.
  Includes pre-flight dry-run search verification, strict wildcard guards,
  automated risk tier classification, and immutable compliance certificate generation.

inputs:
  - id: quickwit_url
    type: STRING
    displayName: Quickwit Base URL
    description: Base HTTP or HTTPS endpoint of the Quickwit cluster.
    defaults: "http://localhost:7280"

  - id: index_id
    type: STRING
    displayName: Quickwit Index ID
    description: Identifier of the target Quickwit index to evaluate.
    defaults: "app-logs"

  - id: deletion_query
    type: STRING
    displayName: Deletion Query
    description: Query expression selecting documents for deletion using Quickwit query syntax.
    defaults: "tenant_id:test-tenant AND timestamp:<1700000000"

  - id: max_allowed_deletion_count
    type: INT
    displayName: Maximum Allowed Deletion Count
    description: Maximum document count allowed to be pruned in a single execution before the blast radius safety gate trips.
    defaults: 10000

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, evaluates matched document counts and emits diagnostic preview notifications without queuing a delete task.
    defaults: true

  - id: auto_remediate
    type: BOOL
    displayName: Auto Remediate
    description: Must be explicitly set to true along with dry_run=false to authorize queuing the asynchronous delete task.
    defaults: false

tasks:
  - id: preflight_search
    type: io.kestra.plugin.quickwit.search.Search
    description: Execute pre-flight search to evaluate total matching documents and extract preview samples without mutating the index.
    url: "{{ secret('QUICKWIT_URL') }}"
    index: "{{ inputs.index_id }}"
    query: "{{ inputs.deletion_query }}"
    fetchType: FETCH
    maxHits: 5

  - id: get_index_metadata
    type: io.kestra.plugin.quickwit.index.Get
    description: Fetch index metadata to verify cluster connectivity, index existence, and configuration parameters.
    url: "{{ secret('QUICKWIT_URL') }}"
    index: "{{ inputs.index_id }}"

  - id: classify_risk_tier
    type: io.kestra.plugin.core.output.OutputValues
    description: Evaluate matched document blast radius, query safety guards, and dry-run execution toggles.
    values:
      matched_count: "{{ outputs.preflight_search.total ?? 0 }}"
      risk_tier: "{{ (outputs.preflight_search.total ?? 0) == 0 ? 'ZERO_MATCH' : ((inputs.deletion_query == '*' || inputs.deletion_query == '*:*' || (outputs.preflight_search.total ?? 0) > inputs.max_allowed_deletion_count) ? 'UNSAFE_BLAST_RADIUS' : ((inputs.dry_run || !inputs.auto_remediate) ? 'DRY_RUN_PREVIEW' : 'PROCEED_DELETION')) }}"

  - id: route_by_risk_tier
    type: io.kestra.plugin.core.flow.Switch
    description: Route execution based on classified risk tier to ensure safe deletion gating.
    value: "{{ outputs.classify_risk_tier.values.risk_tier }}"
    cases:
      ZERO_MATCH:
        - id: log_zero_match
          type: io.kestra.plugin.core.log.Log
          description: Log zero matching records, confirming compliant state without queuing tasks.
          message: "Quickwit index '{{ inputs.index_id }}' contains 0 documents matching deletion query '{{ inputs.deletion_query }}'. No deletion task required."

      UNSAFE_BLAST_RADIUS:
        - id: alert_unsafe_blast_radius
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post high-urgency security alert to Slack when deletion query exceeds blast radius threshold or attempts wildcard wipe.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": ":rotating_light: *CRITICAL: Quickwit Deletion Blast Radius Gate Tripped*\n*Index:* `{{ inputs.index_id }}`\n*Matched Records:* {{ outputs.classify_risk_tier.values.matched_count }}\n*Allowed Threshold:* {{ inputs.max_allowed_deletion_count }}\n*Attempted Query:* `{{ inputs.deletion_query }}`\n*Action:* Deletion blocked. Quarantined execution to prevent catastrophic data loss."
            }

        - id: fail_on_unsafe_blast_radius
          type: io.kestra.plugin.core.execution.Fail
          description: Fail execution to flag policy breach and prevent downstream execution.
          errorMessage: "Blast radius breach: query '{{ inputs.deletion_query }}' matched {{ outputs.classify_risk_tier.values.matched_count }} records, exceeding safety threshold of {{ inputs.max_allowed_deletion_count }}."

      DRY_RUN_PREVIEW:
        - id: log_dry_run_preview
          type: io.kestra.plugin.core.log.Log
          description: Log simulation preview with total matched documents and dry-run flag.
          message: "DRY-RUN SIMULATION: Query '{{ inputs.deletion_query }}' matched {{ outputs.classify_risk_tier.values.matched_count }} records in '{{ inputs.index_id }}'. Deletion not queued (dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }})."

        - id: notify_dry_run_preview
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post dry-run simulation summary to Slack with matched record counts and preview instructions.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": ":mag: *Quickwit Deletion Dry-Run Preview*\n*Index:* `{{ inputs.index_id }}`\n*Query:* `{{ inputs.deletion_query }}`\n*Matched Records:* {{ outputs.classify_risk_tier.values.matched_count }}\n*Search Latency:* {{ outputs.preflight_search.elapsedTimeMicros }} µs\n*Status:* Dry-run verified. To apply, rerun with `dry_run: false` and `auto_remediate: true`."
            }

      PROCEED_DELETION:
        - id: queue_quickwit_deletion
          type: io.kestra.plugin.quickwit.deletetask.Create
          description: Queue asynchronous deletion task in Quickwit metastore for cluster janitor execution.
          url: "{{ secret('QUICKWIT_URL') }}"
          index: "{{ inputs.index_id }}"
          query: "{{ inputs.deletion_query }}"

        - id: write_compliance_certificate
          type: io.kestra.plugin.core.storage.Write
          description: Store immutable JSON compliance certificate in internal storage recording deletion metadata.
          content: |
            {
              "executionId": "{{ execution.id }}",
              "timestamp": "{{ now() }}",
              "index": "{{ inputs.index_id }}",
              "query": "{{ inputs.deletion_query }}",
              "matchedRecords": {{ outputs.classify_risk_tier.values.matched_count }},
              "opstamp": {{ outputs.queue_quickwit_deletion.opstamp }},
              "status": "QUEUED_FOR_JANITOR_PURGE"
            }
          extension: ".json"

        - id: notify_deletion_queued
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch confirmation notification to Slack with queued opstamp and compliance storage URI.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": ":white_check_mark: *Quickwit Deletion Task Queued*\n*Index:* `{{ inputs.index_id }}`\n*Opstamp:* {{ outputs.queue_quickwit_deletion.opstamp }}\n*Records Purged:* {{ outputs.classify_risk_tier.values.matched_count }}\n*Query:* `{{ inputs.deletion_query }}`\n*Compliance Certificate:* `{{ outputs.write_compliance_certificate.uri }}`"
            }

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Write final audit summary log for observability and compliance tracking.
    message: "[AUDIT] Quickwit deletion gate finished. Execution={{ execution.id }}, Index='{{ inputs.index_id }}', Tier='{{ outputs.classify_risk_tier.values.risk_tier }}', Matched={{ outputs.classify_risk_tier.values.matched_count }}, Query='{{ inputs.deletion_query }}'."

outputs:
  - id: matched_count
    type: INT
    value: "{{ outputs.classify_risk_tier.values.matched_count }}"
  - id: risk_tier
    type: STRING
    value: "{{ outputs.classify_risk_tier.values.risk_tier }}"
  - id: opstamp
    type: INT
    value: "{{ outputs.queue_quickwit_deletion.opstamp ?? null }}"
  - id: compliance_certificate_uri
    type: STRING
    value: "{{ outputs.write_compliance_certificate.uri ?? null }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert operations channel if the workflow itself experiences an unexpected runtime error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":warning: Quickwit Deletion Gate workflow {{ execution.id }} failed with error on task: {{ (errorLogs() | length) > 0 ? errorLogs()[0].taskId : 'unknown' }}."
      }

triggers:
  - id: scheduled_retention_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly automated compliance retention sweep executed every Sunday at 03:00 UTC. Shipped disabled by default.
    cron: "0 3 * * 0"
    disabled: true

  - id: dsar_erasure_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Inbound authenticated webhook trigger for event-driven GDPR DSAR and tenant offboarding requests.
    key: "{{ secret('QUICKWIT_GATE_WEBHOOK_KEY') }}"

extend:
  title: Quickwit Selective Deletion and Retention Blast Radius Gate
  metaTitle: Quickwit Selective Deletion & Retention Blast Radius Gate | Kestra
  shortDescription: Audit and safely execute Quickwit document deletions by verifying matched record blast radius and dry-run previews before queuing irreversible janitor tasks.
  metaDescription: Audit and gate Quickwit document deletions by evaluating matched record blast radius before queuing irreversible janitor purge tasks on object storage.
  description: |
    Automate GDPR Data Subject Access Request (DSAR) erasures, tenant offboarding expulsions, and cold log retention pruning across Quickwit search clusters with rigorous pre-flight safety gates and blast radius guardrails.

    Quickwit decouples compute from storage by indexing terabytes of logs, events, and distributed traces directly into immutable split files hosted on cloud object storage (Amazon S3, Google Cloud Storage, or MinIO). In Quickwit, deletions are executed asynchronously through delete tasks (`deletetask.Create`): the task registers a query in the cluster metastore, and the background janitor rewrites affected splits, permanently removing matched documents.

    Because janitor deletions are irreversible and rewrite underlying object storage splits, an unvetted query containing syntax errors, missing field prefixes, or accidental wildcards (`*`) can inadvertently purge an entire index. This blueprint establishes a multi-tiered operational gate before any delete task is queued: it runs a pre-flight count probe, validates cluster metadata, evaluates the matched record count against strict blast radius ceilings, enforces a mandatory dry-run simulation mode, and generates an immutable JSON compliance certificate in Kestra internal storage upon execution.

    ## How it works

    1. **Pre-Flight Count & Sample Probe (`preflight_search`)**: Executes an immediate search query against the target Quickwit index using `io.kestra.plugin.quickwit.search.Search`. It fetches up to 5 representative document samples and extracts the exact total matching record count (`outputs.preflight_search.total`) without modifying index state.
    2. **Index Metadata Verification (`get_index_metadata`)**: Queries `io.kestra.plugin.quickwit.index.Get` to confirm cluster reachability, index existence, and active configuration before evaluating risk.
    3. **Operational Risk Tier Classification (`classify_risk_tier`)**: Dynamically computes risk tier via `io.kestra.plugin.core.output.OutputValues`:
       - `ZERO_MATCH`: Total matching records equal 0. No deletion task is needed.
       - `UNSAFE_BLAST_RADIUS`: Triggered if the query matches all records (`*`), or if matched records exceed `max_allowed_deletion_count`.
       - `DRY_RUN_PREVIEW`: Triggered when records match within bounds but `dry_run: true` or `auto_remediate: false`.
       - `PROCEED_DELETION`: Triggered only when records are within safe thresholds and operator explicitly authorizes execution with `dry_run: false` and `auto_remediate: true`.
    4. **Safety Branching (`route_by_risk_tier`)**: Evaluates the risk tier using `io.kestra.plugin.core.flow.Switch`:
       - Under `ZERO_MATCH`, logs an audit entry confirming compliance without creating cluster load.
       - Under `UNSAFE_BLAST_RADIUS`, posts a high-priority security alert to Slack via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` and fails the execution via `io.kestra.plugin.core.execution.Fail` to quarantine the operation.
       - Under `DRY_RUN_PREVIEW`, logs matched records and delivers a preview summary to Slack detailing matched document counts and search latency.
       - Under `PROCEED_DELETION`, registers the deletion task in Quickwit via `io.kestra.plugin.quickwit.deletetask.Create`, writes a tamper-evident compliance audit certificate to Kestra internal storage using `io.kestra.plugin.core.storage.Write`, and sends a Slack notification with the cluster opstamp.
    5. **Audit Logging & Triggers**: Emits an end-of-run log entry with execution ID and query parameters. Supports scheduled weekly maintenance via `io.kestra.plugin.core.trigger.Schedule` and on-demand DSAR requests via `io.kestra.plugin.core.trigger.Webhook`.

    ## What you get

    - Fail-safe pre-flight dry-run evaluation that blocks accidental wildcard deletions (`*` and `*:*`).
    - Configurable `max_allowed_deletion_count` blast radius ceiling preventing runaway data loss.
    - Automated risk tier classification separating zero-match, dry-run, unsafe, and authorized states.
    - Asynchronous delete task registration using native Quickwit plugin classes (`deletetask.Create`).
    - Immutable JSON compliance certificates saved to Kestra internal storage with execution ID, opstamp, and timestamp.
    - Operational Slack notifications for critical blast radius breaches, dry-run previews, and successful purge queueing.

    ## Who it's for

    - Platform Engineers and SREs administering Quickwit search and observability clusters on object storage.
    - Data Governance Officers and Compliance Engineers managing automated GDPR DSAR right-to-be-forgotten requests.
    - SecOps Teams enforcing bounded retention policies across multi-tenant log aggregation architectures.

    ## Why orchestrate this with Kestra

    Quickwit's delete task API only registers deletion requests in the metastore; it provides no pre-flight safety checking, dry-run estimation, or blast radius gating. Hand-rolled curl scripts run the risk of passing unescaped queries that delete entire indexes, leaving no auditable execution record. Kestra wraps the lifecycle in declarative YAML: validating index existence, verifying document counts before dispatch, isolating credentials in encrypted secrets, enforcing human dry-run authorization, and generating durable audit certificates.

    ## Prerequisites

    - A running Quickwit cluster reachable from the Kestra worker, accessible via HTTP/HTTPS.
    - A Quickwit index (e.g. `app-logs` or `audit-events`) with searchable timestamp and metadata fields.
    - A Slack Incoming Webhook endpoint URL configured in Kestra namespace secrets.

    ### Secrets

    - `QUICKWIT_URL`: Base HTTP or HTTPS URL of the Quickwit cluster (e.g., `http://quickwit.internal:7280`).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for blast radius alerts, dry-run previews, and completion notices.
    - `QUICKWIT_GATE_WEBHOOK_KEY`: Shared secret key used to authenticate inbound HTTP webhook execution requests.

    ## Quick start

    1. Configure secrets `QUICKWIT_URL`, `SLACK_WEBHOOK_URL`, and `QUICKWIT_GATE_WEBHOOK_KEY` in your Kestra namespace.
    2. Import this blueprint into your Kestra instance under namespace `company.governance`.
    3. Run a test execution with default inputs (`dry_run: true`) to preview matched records without modifying the Quickwit index.
    4. Confirm matched document count and latency in execution logs or Slack preview card.
    5. When ready to delete, execute with `dry_run: false`, `auto_remediate: true`, and your specific tenant or timestamp query.

    ## How to extend

    - **Janitor Split Convergence Check**: Chain an `io.kestra.plugin.quickwit.deletetask.List` polling loop to monitor until the queued `opstamp` has been compacted across all splits.
    - **Cold Archive Offload**: Before queuing deletion, export matching documents to cold compressed Parquet on AWS S3 or MinIO using `io.kestra.plugin.quickwit.search.Search` with `fetchType: STORE`.
    - **Multi-Tenant Fan-Out**: Use a `io.kestra.plugin.core.flow.Loop` task to iterate through a list of offboarded tenant IDs from an external PostgreSQL or Snowflake database.

