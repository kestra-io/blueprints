    - [Kestra Quickwit Delete Task](https://kestra.io/plugins/plugin-quickwit/deletetask/io.kestra.plugin.quickwit.deletetask.create)
    - [Quickwit Delete Task REST API](https://quickwit.io/docs/reference/rest-api#create-a-delete-task)
    - [Quickwit Query Language Reference](https://quickwit.io/docs/reference/query-language)
