id: apache-spark-streaming-batch-processing-delay-sentinel
namespace: company.streaming

inputs:
  - id: spark_driver_url
    type: STRING
    defaults: "http://spark-driver.internal:4040"
    description: Base URL of Spark Driver Web UI / REST API.
  - id: app_id
    type: STRING
    description: Spark application unique identifier.

tasks:
  - id: query_batch_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Spark Streaming REST API for completed batch statistics
        curl -s -f "{{ inputs.spark_driver_url }}/api/v1/applications/{{ inputs.app_id }}/streaming/batches?status=COMPLETED" > /tmp/spark_batches.json
        
        # Extract the latest batch processing time in milliseconds
        LATEST_PROCESSING_TIME=$(jq '.[0]?.batchTime // 0' /tmp/spark_batches.json)
        TOTAL_DELAY=$(jq '.[0]?.totalDelay // 0' /tmp/spark_batches.json)
        
        echo "::set-output name=latest_processing_time::$LATEST_PROCESSING_TIME::"
        echo "::set-output name=total_delay::$TOTAL_DELAY::"

  - id: evaluate_batch_delay
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_batch_metrics.vars.total_delay | int > 30000 }}"
    then:
      - id: notify_data_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Apache Spark Streaming Delay Saturated Alert",
                "text": "Spark Application `{{ inputs.app_id }}` recorded a batch total delay of *{{ outputs.query_batch_metrics.vars.total_delay }} ms* (> 30s)! Processing time has exceeded micro-batch intervals, creating queuing delays across executors.",
                "footer": "Kestra Streaming Sentinel • Apache Spark"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Spark Sentinel Failure",
            "text": "Failed to query Spark Driver REST API. Verify driver URL and application ID.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors Apache Spark Streaming applications for batch processing delays exceeding micro-batch intervals."
  metaTitle: Apache Spark Streaming Processing Delay and Scheduling Lag Sentinel with Kestra
  title: Apache Spark Streaming Processing Delay and Scheduling Lag Sentinel
  shortDescription: Monitors Apache Spark Streaming applications for batch processing delays exceeding micro-batch intervals.
  description: |
    ## How it works
    This workflow queries the Apache Spark Driver REST API (`/api/v1/applications/{app_id}/streaming/batches`) to monitor micro-batch processing times and scheduling delays. In Spark Structured Streaming and micro-batch architectures, if batch processing time exceeds the configured trigger interval (e.g. batch takes 15 seconds on a 5-second trigger), scheduling delays accumulate monotonically. Queued micro-batches flood driver memory, executor garbage collection escalates, and end-to-end data latency spikes. This workflow tracks processing delays and alerts data engineering teams before driver OOM crashes occur.

    ## What you get
    - Real-time visibility into Spark Streaming micro-batch latency and scheduling delays.
    - Prevents runaway memory accumulation on Spark Driver nodes.
    - Actionable metrics on total processing delay across batch runs.

    ## Who it's for
    - Big Data Engineers and Spark Platform Administrators.
    - SREs maintaining high-throughput Spark streaming pipelines.

    ## Why orchestrate this with Kestra
    - **Continuous Pipeline Assurance**: Automatically evaluates streaming batch latency on an automated cadence.
    - **Native API Interaction**: Connects cleanly to Spark Driver REST endpoints.
    - **Direct Team Alerts**: Delivers diagnostic metrics directly to Slack channels.

    ## Prerequisites
    - Spark Driver running with Web UI / REST API accessible (port `4040`).
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Spark Driver URL and Application ID.
    3. Run the workflow to inspect batch processing metrics.

    ## How to extend
    - Monitor executor memory spilling via `/api/v1/applications/{app_id}/executors`.
    - Automatically adjust dynamic allocation executor limits when batch delays persist.

    ## Links
    - [Apache Spark Monitoring REST API](https://spark.apache.org/docs/latest/monitoring.html#rest-api)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - ELT & Data Landing
  ee: false
  demo: false
