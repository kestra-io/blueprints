id: elasticsearch-search-threadpool-queue-sentinel
namespace: company.database

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Hostname or IP of Elasticsearch node.
  - id: es_port
    type: INT
    defaults: 9200
    description: Elasticsearch port.

tasks:
  - id: query_threadpool
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query search thread pool stats via _cat/thread_pool
        curl -s -u "{{ inputs.es_user }}:{{ secret('ES_PASSWORD') }}"           "http://{{ inputs.es_host }}:{{ inputs.es_port }}/_cat/thread_pool/search?format=json&h=host,queue,rejected" > /tmp/es_tp_telemetry.json
        
        REJECTED_COUNT=$(jq '[.[].rejected | tonumber] | add // 0' /tmp/es_tp_telemetry.json)
        MAX_QUEUE=$(jq '[.[].queue | tonumber] | max // 0' /tmp/es_tp_telemetry.json)
        
        echo "::set-output name=rejected_count::$REJECTED_COUNT::"
        echo "::set-output name=max_queue::$MAX_QUEUE::"

  - id: evaluate_threadpool_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_threadpool.vars.rejected_count | int > 0 or outputs.query_threadpool.vars.max_queue | int > 500 }}"
    then:
      - id: notify_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#search-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Search Thread Pool Saturated Alert",
                "text": "Elasticsearch cluster at `{{ inputs.es_host }}` recorded *{{ outputs.query_threadpool.vars.rejected_count }} rejected search tasks* (Peak queue: {{ outputs.query_threadpool.vars.max_queue }})! Search thread pools are completely saturated, rejecting incoming customer queries.",
                "footer": "Kestra Database Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#search-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Thread Pool Sentinel Failure",
            "text": "Failed to query Elasticsearch _cat/thread_pool. Verify credentials and network access.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Elasticsearch Search Thread Pool Queue and Rejection Sentinel
  shortDescription: Monitors Elasticsearch search thread pool queues and rejected tasks to prevent client search request drops.
  description: |
    ## How it works
    This workflow queries the Elasticsearch Cat Thread Pool API (`/_cat/thread_pool/search`) to inspect search worker thread allocation, queue depth, and cumulative rejected tasks. In Elasticsearch, search operations run on a fixed thread pool sized according to available CPU cores (typically `allocated_processors * 3 / 2 + 1`). Incoming search requests beyond active thread capacity buffer in a queue (default 1000). When this queue overflows, Elasticsearch rejects additional requests with `EsRejectedExecutionException`. This workflow tracks queue build-up and task rejections to alert search platform teams immediately.

    ## What you get
    - Real-time detection of search thread pool saturation in Elasticsearch clusters.
    - Prevents query rejection errors and degraded customer search experiences.
    - Quantitative metrics on maximum queue depth across all data nodes.

    ## Who it's for
    - Search Platform Engineers and Database SREs managing Elasticsearch and OpenSearch.
    - Application Developers running high-concurrency search and filter APIs.

    ## Why orchestrate this with Kestra
    - **Continuous Fleet Auditing**: Automatically inspects thread pool health on a periodic schedule.
    - **Zero Infrastructure Footprint**: Uses standard REST APIs with secure secret credential handling.
    - **Instant Team Escalation**: Delivers incident notifications with queue metrics directly to Slack.

    ## Prerequisites
    - Elasticsearch cluster with HTTP API reachable.
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Elasticsearch host, port, and user.
    3. Run the workflow to inspect search thread pool metrics.

    ## How to extend
    - Inspect write thread pool rejections (`_cat/thread_pool/write`) to monitor indexing pressure.
    - Automatically scale up data node count using Kubernetes or cloud VM autoscalers.

    ## Links
    - [Elasticsearch Thread Pool Documentation](https://www.elastic.co/guide/en/elasticsearch/reference/current/modules-threadpool.html)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
