id: elasticsearch-search-threadpool-queue-sentinel
namespace: company.team

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Hostname or IP of Elasticsearch node.
  - id: es_port
    type: INT
    defaults: 9200
    description: Elasticsearch port.
  - id: es_user
    type: STRING
    defaults: "elastic"
    description: Elasticsearch username.

tasks:
  - id: query_threadpool
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.es_host }}"
      ES_PORT: "{{ inputs.es_port }}"
      ES_USER: "{{ inputs.es_user }}"
      ES_PASSWORD: "{{ secret('ES_PASSWORD') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "elasticsearch.internal")
      port = os.environ.get("ES_PORT", "9200")
      user = os.environ.get("ES_USER", "elastic")
      password = os.environ.get("ES_PASSWORD", "")

      auth = (user, password) if user and password else None
      url = f"http://{host}:{port}/_cat/thread_pool/search?format=json&h=host,queue,rejected"

      try:
          resp = requests.get(url, auth=auth, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"CRITICAL: Failed to query Elasticsearch search thread pool at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      rejected_count = 0
      max_queue = 0

      for row in data:
          try:
              rej = int(row.get("rejected", 0))
          except (ValueError, TypeError):
              rej = 0
          try:
              q = int(row.get("queue", 0))
          except (ValueError, TypeError):
              q = 0
          rejected_count += rej
          if q > max_queue:
              max_queue = q

      report = {
          "rejected_count": rejected_count,
          "max_queue": max_queue,
          "nodes": data
      }

      with open("threadpool_search_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "rejected_count": rejected_count,
          "max_queue": max_queue
      })
      print(f"Search thread pool: rejected={rejected_count}, max_queue={max_queue}")
    outputFiles:
      - threadpool_search_report.json

  - id: evaluate_threadpool_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_threadpool.vars.rejected_count | int > 0 or outputs.query_threadpool.vars.max_queue | int > 500 }}"
    then:
      - id: notify_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#search-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Search Thread Pool Saturated Alert",
                "text": "Elasticsearch cluster at `{{ inputs.es_host }}` recorded *{{ outputs.query_threadpool.vars.rejected_count }} rejected search tasks* (Peak queue: {{ outputs.query_threadpool.vars.max_queue }})! Search thread pools are completely saturated, rejecting incoming customer queries.",
                "footer": "Kestra Database Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#search-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Thread Pool Sentinel Failure",
            "text": "Failed to query Elasticsearch _cat/thread_pool. Verify credentials and network access. Execution ID: {{ execution.id }}",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Elasticsearch search thread pool queues to isolate concurrency bottlenecks and rejected search queries."
  metaTitle: Elasticsearch Search Thread Pool Queue Sentinel with Kestra
  title: Elasticsearch Search Thread Pool Queue Sentinel
  shortDescription: Audits Elasticsearch search thread pool queues to isolate concurrency bottlenecks and rejected search queries.
  description: |
    ## How it works
    This workflow queries `_cat/thread_pool/search` across the Elasticsearch cluster. The search thread pool executes read and aggregation tasks. When slow or unoptimized queries saturate worker threads, the queue fills and subsequent requests fail with `EsRejectedExecutionException`. The sentinel detects queue buildup and non-zero rejections, alerting database and search teams.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_schedule Schedule Trigger] --> B[query_threadpool Python Script]
      B --> C{Rejections > 0 or Queue > 500?}
      C -- Yes --> D[notify_search_team Slack Webhook]
      C -- No --> E[Search Queue Nominal]
    ```

    ## Prerequisites
    - Elasticsearch cluster (7.x / 8.x) accessible via REST.
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure cluster host, port, and credentials.
    3. Run manually to evaluate search thread queue health.

    ## Links
    - [Elasticsearch Cat Thread Pool API](https://www.elastic.co/guide/en/elasticsearch/reference/current/cat-thread-pool.html)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
