id: launch-library-upcoming-missions-lakehouse-loader
namespace: company.analytics
description: Ingests upcoming orbital spaceflight launches, rocket configurations, and launchpad coordinates from Launch Library 2 into Parquet lakehouse storage via DuckDB, tracking mission countdowns in Kestra KV store.

inputs:
  - id: upcoming_limit
    type: INT
    description: Number of upcoming orbital spaceflight launch manifests to harvest.
    defaults: 15

  - id: imminent_hours_threshold
    type: INT
    description: Hours until launch window to trigger countdown notifications.
    defaults: 72

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking monitored orbital launch mission IDs.
    defaults: launch_library_monitored_missions_state

variables:
  default_state: "[]"

triggers:
  - id: daily_orbital_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_launches
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_launches = set(json.loads(raw_state)) if raw_state else set()
        except Exception:
            seen_launches = set()

        limit = int("{{ inputs.upcoming_limit }}")
        imminent_threshold = int("{{ inputs.imminent_hours_threshold }}")

        url = f"https://lldev.thespacedevs.com/2.2.0/launch/upcoming/?limit={limit}&mode=normal"
        headers = {"User-Agent": "KestraSpaceflightLakehouse/1.0 (aerospace-ops@kestra.io)"}

        records = []
        imminent_launches = []
        harvested_ids = []

        now = datetime.now(timezone.utc)

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                results = data.get("results", [])
                for item in results:
                    launch_id = item.get("id", "")
                    name = item.get("name", "")
                    status_name = item.get("status", {}).get("name", "")
                    net_time_str = item.get("net", "")

                    lsp = item.get("launch_service_provider", {}).get("name", "")
                    rocket_name = item.get("rocket", {}).get("configuration", {}).get("name", "")
                    mission_desc = (item.get("mission", {}).get("description", "") or "")[:250] if item.get("mission") else ""

                    pad_obj = item.get("pad", {})
                    pad_name = pad_obj.get("name", "")
                    lat = float(pad_obj.get("latitude", 0.0) or 0.0)
                    lon = float(pad_obj.get("longitude", 0.0) or 0.0)
                    location_name = pad_obj.get("location", {}).get("name", "")

                    hours_until_launch = 999.0
                    if net_time_str:
                        try:
                            net_dt = datetime.fromisoformat(net_time_str.replace("Z", "+00:00"))
                            hours_until_launch = max(0.0, (net_dt - now).total_seconds() / 3600.0)
                        except Exception:
                            pass

                    is_imminent = hours_until_launch <= imminent_threshold
                    is_new = launch_id not in seen_launches

                    harvested_ids.append(launch_id)

                    records.append({
                        "launch_id": launch_id,
                        "mission_name": name,
                        "status": status_name,
                        "net_time": net_time_str,
                        "provider": lsp,
                        "rocket": rocket_name,
                        "pad_name": pad_name,
                        "location": location_name,
                        "latitude": lat,
                        "longitude": lon,
                        "hours_until_net": round(hours_until_launch, 1),
                        "is_imminent_launch": is_imminent,
                        "is_new_manifest": is_new,
                        "harvest_time": now.isoformat()
                    })

                    if is_imminent:
                        imminent_launches.append({"mission": name, "provider": lsp, "hours": round(hours_until_launch, 1)})
        except Exception as e:
            print(f"Error fetching Launch Library spaceflight manifest: {e}")

        with open("orbital_launches.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE orbital_launches AS SELECT * FROM read_json_auto('orbital_launches.json')")
            con.execute("COPY orbital_launches TO 'orbital_launches_manifest.parquet' (FORMAT PARQUET)")
            con.execute("COPY orbital_launches TO 'orbital_launches_manifest.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE orbital_launches (
                    launch_id VARCHAR,
                    mission_name VARCHAR,
                    status VARCHAR,
                    net_time VARCHAR,
                    provider VARCHAR,
                    rocket VARCHAR,
                    pad_name VARCHAR,
                    location VARCHAR,
                    latitude DOUBLE,
                    longitude DOUBLE,
                    hours_until_net DOUBLE,
                    is_imminent_launch BOOLEAN,
                    is_new_manifest BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY orbital_launches TO 'orbital_launches_manifest.parquet' (FORMAT PARQUET)")
            con.execute("COPY orbital_launches TO 'orbital_launches_manifest.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_launches_count": len(records),
            "imminent_launches_count": len(imminent_launches),
            "imminent_launches": imminent_launches[:5],
            "updated_state": list(set(list(seen_launches) + harvested_ids))[:500]
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - orbital_launches_manifest.parquet
      - orbital_launches_manifest.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_launches.vars.updated_state | toJson }}"

  - id: check_imminent_launches
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_launches.vars.imminent_launches_count > 0 }}"
    then:
      - id: notify_imminent_launches
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "🚀 Orbital Spaceflight Launch Countdown: {{ outputs.ingest_and_transform_launches.vars.imminent_launches_count }} orbital launch(es) scheduled within the next {{ inputs.imminent_hours_threshold }} hours."

outputs:
  - id: total_launches
    type: INT
    value: "{{ outputs.ingest_and_transform_launches.vars.total_launches_count }}"
  - id: imminent_launches_count
    type: INT
    value: "{{ outputs.ingest_and_transform_launches.vars.imminent_launches_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_launches.outputFiles['orbital_launches_manifest.parquet'] }}"

extend:
  title: Launch Library 2 Upcoming Orbital Spaceflight Lakehouse Loader with DuckDB
  metaTitle: Launch Library 2 Spaceflight Lakehouse Loader | Kestra
  shortDescription: Ingests upcoming orbital spaceflight launches, rocket configurations, and launchpad coordinates from Launch Library 2 into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Launch Library 2 API for upcoming spaceflight launches, convert rocket trajectories into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, aerospace harmonization, and analytical persistence of upcoming orbital spaceflight
    manifests, rocket vehicle configurations, launch service providers, and pad geospatial coordinates from Launch Library 2 into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`launch_library_monitored_missions_state`) for previously tracked orbital mission identifiers.
    2. **Launch Library 2 Ingestion**: Queries the official Launch Library 2 REST API (`lldev.thespacedevs.com/2.2.0/launch/upcoming/`) for scheduled launch windows.
    3. **DuckDB Aerospace Normalization**: Computes countdown hours to launch window, maps coordinates, providers, and rocket configurations into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized mission manifests into columnar Parquet and CSV files for telemetry tracking and aerospace logistics.
    5. **Countdown Evaluation & State Commitment**: Detects imminent launches approaching T-0, issues countdown notifications, and saves manifests to Kestra KV store.

    ## What you get

    - Automated, scheduled monitoring of global commercial and governmental orbital launches.
    - Columnar Parquet datasets queryable with DuckDB, GIS toolchains, Snowflake, or ClickHouse.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Aerospace Systems Engineers and Satellite Operations teams monitoring launch windows.
    - Spaceflight Enthusiasts and Data Journalists tracking launch provider cadences.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical launch manifests across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `lldev.thespacedevs.com`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting teams on imminent orbital launches.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Customize `upcoming_limit` and `imminent_hours_threshold`.
    3. Click **Execute** to run an immediate harvest and generate the Parquet table.
    4. Enable the `daily_orbital_sync` schedule for automated daily updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition daily orbital manifests.
    - Connect a webhook task to notify Discord or Slack channels when T-minus reaches 24 hours.

    ## Links

    - [Launch Library 2 Documentation](https://thespacedevs.com/llapi)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
