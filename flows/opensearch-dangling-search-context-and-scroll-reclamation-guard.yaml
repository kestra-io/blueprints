id: opensearch-dangling-search-context-and-scroll-reclamation-guard
namespace: company.team

description: |
  Monitor OpenSearch cluster search contexts for stranded scroll and Point-in-Time (PIT)
  readers, classify context pressure against operational safety ceilings, automatically
  reclaim dangling scrolls to release pinned Lucene file handles and JVM heap memory,
  and alert SRE teams via Slack before circuit breaker exceptions trigger.

inputs:
  - id: opensearch_hosts
    type: ARRAY
    displayName: OpenSearch Cluster Hosts
    description: List of OpenSearch cluster coordinator or data node HTTP endpoints.
    defaults:
      - "http://localhost:9200"

  - id: open_context_warning_threshold
    type: INT
    displayName: Warning Context Threshold
    description: Number of active open search contexts across all shards at which elevated pressure is logged.
    defaults: 25

  - id: open_context_critical_threshold
    type: INT
    displayName: Critical Context Threshold
    description: Threshold above which open contexts are classified as a memory leak and automatic reclamation is triggered.
    defaults: 50

  - id: auto_remediate
    type: BOOL
    displayName: Enable Auto-Reclamation
    description: When true, automatically issue DELETE /_search/scroll/_all during critical context leak conditions.
    defaults: true

triggers:
  - id: search_context_sweep_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodic search context sweep running every 30 minutes. Shipped disabled so cluster credentials and network reachability can be verified first."
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: probe_cluster_search_contexts
    type: io.kestra.plugin.opensearch.Request
    description: "Query OpenSearch cluster-wide index search stats to retrieve total open contexts and active scroll counts."
    connection:
      hosts: "{{ inputs.opensearch_hosts }}"
      basicAuth:
        username: "{{ secret('OPENSEARCH_USERNAME') }}"
        password: "{{ secret('OPENSEARCH_PASSWORD') }}"
    method: "GET"
    endpoint: "_stats/search"

  - id: classify_context_pressure
    type: io.kestra.plugin.core.debug.Return
    description: "Classify cluster search context pressure into PROBE_FAILED, CRITICAL_CONTEXT_LEAK, ELEVATED_CONTEXT_PRESSURE, or HEALTHY."
    format: "{{ outputs.probe_cluster_search_contexts.status != 200 or outputs.probe_cluster_search_contexts.response._all.total.search.open_contexts is not defined ? 'PROBE_FAILED' : (outputs.probe_cluster_search_contexts.response._all.total.search.open_contexts >= inputs.open_context_critical_threshold ? 'CRITICAL_CONTEXT_LEAK' : (outputs.probe_cluster_search_contexts.response._all.total.search.open_contexts >= inputs.open_context_warning_threshold ? 'ELEVATED_CONTEXT_PRESSURE' : 'HEALTHY')) }}"

  - id: route_by_context_pressure
    type: io.kestra.plugin.core.flow.Switch
    description: "Branch on classified cluster search context pressure state."
    value: "{{ outputs.classify_context_pressure.value }}"
    cases:
      "CRITICAL_CONTEXT_LEAK":
        - id: check_auto_remediate
          type: io.kestra.plugin.core.flow.If
          description: "Verify if automated scroll reclamation is enabled before executing delete command."
          condition: "{{ inputs.auto_remediate }}"
          then:
            - id: reclaim_dangling_scroll_contexts
              type: io.kestra.plugin.opensearch.Request
              description: "Issue cluster-wide delete request to clear all active search scroll contexts and release pinned Lucene memory."
              connection:
                hosts: "{{ inputs.opensearch_hosts }}"
                basicAuth:
                  username: "{{ secret('OPENSEARCH_USERNAME') }}"
                  password: "{{ secret('OPENSEARCH_PASSWORD') }}"
              method: "DELETE"
              endpoint: "_search/scroll/_all"

            - id: log_reclamation_action
              type: io.kestra.plugin.core.log.Log
              message: "Executed DELETE /_search/scroll/_all. Cleared dangling search contexts (observed open_contexts={{ outputs.probe_cluster_search_contexts.response._all.total.search.open_contexts }})."

            - id: alert_critical_context_reclaimed
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              description: "Notify SRE team via Slack that critical search context accumulation occurred and was automatically reclaimed."
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "text": "CRITICAL: OpenSearch cluster search contexts breached safety ceiling with {{ outputs.probe_cluster_search_contexts.response._all.total.search.open_contexts }} open contexts (scroll_current: {{ outputs.probe_cluster_search_contexts.response._all.total.search.scroll_current }}). Automated reclamation executed: DELETE /_search/scroll/_all. Execution: {{ execution.id }}."
                }
          else:
            - id: alert_critical_context_suppressed
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              description: "Notify SRE team that critical search context accumulation occurred and auto-remediation was disabled."
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "text": "URGENT WARNING: OpenSearch cluster search contexts reached {{ outputs.probe_cluster_search_contexts.response._all.total.search.open_contexts }} (threshold: {{ inputs.open_context_critical_threshold }}). Auto-remediation is disabled. Manual scroll cleanup required. Execution: {{ execution.id }}."
                }

      "ELEVATED_CONTEXT_PRESSURE":
        - id: log_elevated_warning
          type: io.kestra.plugin.core.log.Log
          message: "Warning: OpenSearch open search contexts elevated to {{ outputs.probe_cluster_search_contexts.response._all.total.search.open_contexts }} (threshold: {{ inputs.open_context_warning_threshold }}). Monitoring for potential scroll leaks."

      "HEALTHY":
        - id: log_cluster_healthy
          type: io.kestra.plugin.core.log.Log
          message: "OpenSearch search contexts operating within normal limits (open_contexts={{ outputs.probe_cluster_search_contexts.response._all.total.search.open_contexts }}, scroll_current={{ outputs.probe_cluster_search_contexts.response._all.total.search.scroll_current }})."

      "PROBE_FAILED":
        - id: alert_probe_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Alert Slack when OpenSearch index stats endpoint cannot be reached."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "ALERT: Failed to query OpenSearch index stats endpoint '_stats/search' on hosts {{ inputs.opensearch_hosts }}. HTTP status: {{ outputs.probe_cluster_search_contexts.status }}. Execution: {{ execution.id }}."
            }

    defaults:
      - id: log_unclassified_state
        type: io.kestra.plugin.core.log.Log
        message: "OpenSearch search context audit completed with unclassified status: {{ outputs.classify_context_pressure.value }}."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Record immutable audit line for operational visibility and trending."
    message: "OpenSearch Context Audit: open_contexts={{ outputs.probe_cluster_search_contexts.response._all.total.search.open_contexts is defined ? outputs.probe_cluster_search_contexts.response._all.total.search.open_contexts : 0 }}, scroll_current={{ outputs.probe_cluster_search_contexts.response._all.total.search.scroll_current is defined ? outputs.probe_cluster_search_contexts.response._all.total.search.scroll_current : 0 }}, status={{ outputs.classify_context_pressure.value }}, executionId={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack if the guard flow encounters an unexpected runtime error."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "OpenSearch search context guard flow '{{ flow.id }}' failed unexpectedly during execution {{ execution.id }}."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_context_pressure.value }}"

  - id: open_contexts
    type: INT
    value: "{{ outputs.probe_cluster_search_contexts.response._all.total.search.open_contexts is defined ? outputs.probe_cluster_search_contexts.response._all.total.search.open_contexts : 0 }}"

  - id: scroll_current
    type: INT
    value: "{{ outputs.probe_cluster_search_contexts.response._all.total.search.scroll_current is defined ? outputs.probe_cluster_search_contexts.response._all.total.search.scroll_current : 0 }}"

extend:
  title: OpenSearch Dangling Search Context & Scroll Reclamation Guard
  metaTitle: OpenSearch Dangling Search Context & Scroll Reclamation Guard | Kestra
  shortDescription: Monitor OpenSearch search context accumulation, detect stranded scroll and PIT readers, and automatically clear dangling contexts to prevent JVM memory exhaustion.
  metaDescription: Detect dangling OpenSearch scroll contexts, reclaim pinned Lucene memory leaks, and prevent cluster JVM circuit breaker exceptions with Kestra.
  description: |
    Applications frequently use OpenSearch Scroll (`_search?scroll=5m`) and Point-in-Time (PIT) readers for bulk data exports, analytics pipelines, and machine learning feature extraction. When batch consumer processes crash, time out, or disconnect without sending an explicit delete call (`DELETE _search/scroll`), OpenSearch continues to hold the search contexts active on data nodes until their keep-alive timers expire.

    Accumulated dangling search contexts pin underlying Lucene index searchers and segment file descriptors in memory, preventing merged segments from being deleted from disk and consuming massive JVM off-heap and heap capacity. Over time, this leads to `circuit_breaking_exception: [parent] Data too large` failures that reject all incoming search and indexing operations.

    This blueprint provides an automated OpenSearch Search Context & Scroll Reclamation Guard. It queries cluster-wide index search statistics, evaluates open contexts against operational warning and critical thresholds, automatically issues cluster-wide scroll reclamation (`DELETE _search/scroll/_all`) when critical limits are breached, and notifies engineering via Slack.

    ## How it works

    1. `search_context_sweep_schedule` (`io.kestra.plugin.core.trigger.Schedule`) initiates a sweep every 30 minutes.
    2. `probe_cluster_search_contexts` (`io.kestra.plugin.opensearch.Request`) queries the cluster stats endpoint (`GET _stats/search`) to measure `_all.total.search.open_contexts` and `scroll_current` across all active indices.
    3. `classify_context_pressure` (`io.kestra.plugin.core.debug.Return`) evaluates the open context count against `open_context_critical_threshold` and `open_context_warning_threshold`, resolving to `HEALTHY`, `ELEVATED_CONTEXT_PRESSURE`, `CRITICAL_CONTEXT_LEAK`, or `PROBE_FAILED`.
    4. `route_by_context_pressure` (`io.kestra.plugin.core.flow.Switch`) handles the resulting state:
       - **CRITICAL_CONTEXT_LEAK**: If `auto_remediate` is enabled, executes `reclaim_dangling_scroll_contexts` (`io.kestra.plugin.opensearch.Request`) sending `DELETE _search/scroll/_all` to immediately release all stranded searchers, and notifies Slack via `alert_critical_context_reclaimed`.
       - **ELEVATED_CONTEXT_PRESSURE**: Logs an operational warning for proactive visibility.
       - **HEALTHY**: Logs a quiet confirmation documenting clean cluster operation.
       - **PROBE_FAILED**: Dispatches an alert to Slack notifying engineers that the stats endpoint could not be reached.
    5. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) writes an immutable execution record detailing open contexts, scroll counts, and resolution status.
    6. The flow-level `errors` block catches unhandled runtime failures and notifies the SRE rotation.

    ## What you get

    - Automated detection of abandoned or leaking scroll and PIT search readers across OpenSearch clusters.
    - Proactive JVM heap and off-heap memory protection, avoiding `circuit_breaking_exception` outages.
    - Automated garbage collection of stranded Lucene segment file handles to recover disk space after segment merges.
    - Configurable tiered thresholds (`warning` and `critical`) with optional automated remediation toggles.
    - Direct Slack notifications specifying exact context counts and remediation actions.
    - Immutable execution history establishing long-term resource utilization trends.

    ## Who it's for

    - Platform Engineers and SREs maintaining production OpenSearch or Elasticsearch clusters.
    - Data Engineers running batch export jobs, ETL synchronization, or large aggregations.
    - Search Infrastructure Teams looking to safeguard multi-tenant clusters against rogue or poorly designed queries.

    ## Why orchestrate this with Kestra

    Monitoring and clearing stranded search contexts through custom cron bash scripts lacks central execution logging, credential masking, retry mechanics, and visual audit histories. Orchestrating with Kestra provides declarative topology management, native OpenSearch HTTP integration, secure secret handling, visual execution graphs, and automatic multi-channel alerting within an auditable enterprise workflow.

    ## Prerequisites

    - A running OpenSearch cluster (Self-Managed, AWS OpenSearch Service, or Docker) reachable over HTTP/HTTPS.
    - An OpenSearch user with cluster permissions to view index stats (`indices:monitor/stats`) and delete search scrolls (`cluster:admin/search/scroll/clear`).
    - A Slack incoming webhook URL for incident notifications.

    ### Secrets

    - `OPENSEARCH_USERNAME`: Username for authenticating with the OpenSearch cluster.
    - `OPENSEARCH_PASSWORD`: Password for the OpenSearch user.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used for incident notifications and unhandled execution error alerts.

    ## Quick start

    1. Configure `OPENSEARCH_USERNAME`, `OPENSEARCH_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local OpenSearch cluster for testing using Docker:
       `docker run -d -p 9200:9200 -e "discovery.type=single-node" -e "DISABLE_SECURITY_PLUGIN=true" --name opensearch opensearchproject/opensearch:latest`
    3. Update `inputs.opensearch_hosts` if your cluster URL differs from `http://localhost:9200`.
    4. Run the flow manually to verify cluster stats retrieval and audit logging.
    5. Enable `triggers.search_context_sweep_schedule` to activate continuous background protection.

    ## How to extend

    - Route audit metrics to an Elasticsearch or OpenSearch index via `io.kestra.plugin.opensearch.Bulk` for visualization in OpenSearch Dashboards.
    - Add per-node search context inspection using `GET /_nodes/stats/indices/search` to identify specific data nodes experiencing localized heap pressure.
    - Extend remediation to delete Point-in-Time readers via `DELETE /_search/point_in_time/_all` when using OpenSearch 2.x PIT features.

    ## Links

    - [Kestra OpenSearch Plugin Documentation](https://kestra.io/plugins/plugin-opensearch)
    - [OpenSearch Clear Scroll API Documentation](https://opensearch.org/docs/latest/api-reference/scroll/#clear-scroll)
    - [OpenSearch Search Statistics API Documentation](https://opensearch.org/docs/latest/api-reference/index-apis/stats/)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
