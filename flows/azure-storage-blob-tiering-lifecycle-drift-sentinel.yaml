id: azure-storage-blob-tiering-lifecycle-drift-sentinel
namespace: company.cloud

inputs:
  - id: subscription_id
    type: STRING
    description: Azure Subscription ID.
  - id: resource_group
    type: STRING
    description: Azure Resource Group name.
  - id: storage_account_name
    type: STRING
    description: Azure Storage Account name to audit.

tasks:
  - id: audit_lifecycle_policy
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: mcr.microsoft.com/azure-cli:latest
    commands:
      - |
        az login --service-principal -u "{{ secret('AZURE_CLIENT_ID') }}" -p "{{ secret('AZURE_CLIENT_SECRET') }}" --tenant "{{ secret('AZURE_TENANT_ID') }}" --output none
        az account set --subscription "{{ inputs.subscription_id }}"
        
        # Check management policy rules on storage account
        az storage account management-policy show           --account-name "{{ inputs.storage_account_name }}"           --resource-group "{{ inputs.resource_group }}"           --output json > /tmp/lifecycle_telemetry.json 2>/dev/null || echo '{"policy":{"rules":[]}}' > /tmp/lifecycle_telemetry.json
        
        RULES_COUNT=$(jq '.policy.rules | length // 0' /tmp/lifecycle_telemetry.json)
        echo "::set-output name=rules_count::$RULES_COUNT::"

  - id: evaluate_policy_drift
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_lifecycle_policy.vars.rules_count | int == 0 }}"
    then:
      - id: notify_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#cloud-finops",
            "attachments": [
              {
                "color": "warning",
                "title": "💰 Azure Storage Account Lifecycle Policy Drift Alert",
                "text": "Storage Account `{{ inputs.storage_account_name }}` has *no active lifecycle management rules* configured! Blobs remain indefinitely on the expensive Hot tier without transitioning to Cool, Cold, or Archive tiers.",
                "footer": "Kestra Cloud Sentinel • Microsoft Azure FinOps"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#cloud-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Azure Storage Lifecycle Sentinel Failure",
            "text": "Failed to inspect Azure Storage management policies. Verify storage account name and service principal access.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true

extend:
  metaDescription: "Audits Azure Storage Accounts for missing lifecycle management policies to prevent unoptimized storage cost accumulation."
  metaTitle: Microsoft Azure Storage Account Blob Lifecycle Management Policy Drift Sentinel with Kestra
  title: Microsoft Azure Storage Account Blob Lifecycle Management Policy Drift Sentinel
  shortDescription: Audits Azure Storage Accounts for missing lifecycle management policies to prevent unoptimized storage cost accumulation.
  description: |
    ## How it works
    This workflow audits Azure Blob Storage accounts by executing `az storage account management-policy show` inside an Azure CLI container. Data stored in Azure Blob Storage accumulates substantial operational costs when aged objects remain indefinitely on the Hot access tier. Azure Lifecycle Management rules automate transitions from Hot to Cool (30 days), Cold (90 days), and Archive (180+ days), and delete obsolete scratch snapshots. When an account lacks lifecycle rules, the workflow alerts the FinOps team to prevent cloud spend leakage.

    ## What you get
    - Automated detection of unmanaged Azure Blob storage accounts.
    - Prevents cloud cost drift from neglected data tiering.
    - Actionable recommendations to apply automated transition and purge rules.

    ## Who it's for
    - Cloud FinOps Practitioners and Infrastructure Cost Optimization Leads.
    - Azure Administrators and Cloud Architects enforcing storage governance.

    ## Why orchestrate this with Kestra
    - **Continuous Cost Governance**: Automatically audits multi-cloud object stores on a recurring schedule.
    - **Non-Invasive Inspection**: Read-only queries check governance policies without mutating existing blob states.
    - **Direct Team Alerts**: Escalates drift directly to financial operations Slack channels.

    ## Prerequisites
    - Azure Service Principal with `Reader` and `Storage Account Contributor` roles.
    - Secrets `AZURE_CLIENT_ID`, `AZURE_CLIENT_SECRET`, `AZURE_TENANT_ID`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input the Azure subscription ID, resource group, and storage account name.
    3. Run the workflow to inspect lifecycle management rules.

    ## How to extend
    - Add an automated remediation step to apply a default organizational lifecycle rule template using `az storage account management-policy create`.
    - Extend to audit all storage accounts across an entire subscription dynamically.

    ## Links
    - [Optimize Costs by Automatically Managing the Data Lifecycle](https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Cloud
    - Business
  subTags:
    - Azure Services
    - Infrastructure Automation
  ee: false
  demo: false
