id: ghg-emissions-inventory-scope-1-2-3
namespace: company.team

description: |
  Monthly greenhouse gas inventory (GHG Protocol, CSRD ESRS E1): turn fuel, electricity,
  travel and purchase data into tonnes of CO2e with an emission factor table, Scope 1,
  Scope 2 both location-based and market-based, and Scope 3 categories 1, 6 and 7. Every
  line keeps its factor and source for the auditor, data gaps are estimated and flagged,
  and the year to date is tracked against the reduction target in KV.

inputs:
  - id: period
    type: STRING
    displayName: Month (YYYY-MM)
    defaults: "2026-09"
    validator: ^\d{4}-(0[1-9]|1[0-2])$

  - id: annual_target_tco2e
    type: FLOAT
    displayName: Annual target (tCO2e)
    description: Scope 1 + 2 market-based budget for the year, from the reduction plan.
    defaults: 6600.0

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: ISSUES adds a meter reading in an unknown unit and an activity with no emission factor, which must stop the inventory.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

variables:
  state_key: ghg_inventory
  pack_dir: "ghg/{{ inputs.period }}"

concurrency:
  limit: 1

tasks:
  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    values:
      months: >-
        {{ (kv(vars.state_key, errorOnMissing=false) ?? {'months': {}}) | jq('.months | with_entries(select(.key | startswith("' ~ (inputs.period | slice(0, 4)) ~ '-")) | select(.key < "' ~ inputs.period ~ '"))') | first | toJson }}

  - id: inventory
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: sites, emission factors, and the month's activity data (demo generator
      or your utility bills, fleet cards, travel tool and AP ledger), then unit conversion, the
      emissions per line and scope, the gap estimates and the year to date.
    outputFiles:
      - lines
      - summary
      - gaps
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE p = '{{ inputs.period }}';
      SET VARIABLE m_start = strptime(getvariable('p') || '-01', '%Y-%m-%d')::DATE;

      -- =======================================================================
      -- Sites and emission factors. Replace with your factor set (DEFRA/DESNZ,
      -- EPA, IEA, supplier-specific). kg CO2e per unit.
      -- =======================================================================
      CREATE TABLE sites (site VARCHAR, country VARCHAR, grid_region VARCHAR, green_tariff_pct DOUBLE);
      INSERT INTO sites VALUES ('Lyon plant', 'FR', 'FR', 0), ('Leeds office', 'GB', 'GB', 100), ('Austin DC', 'US', 'US-ERCOT', 40), ('Pune office', 'IN', 'IN', 0);

      CREATE TABLE factors (activity VARCHAR, region VARCHAR, unit VARCHAR, kg_co2e_per_unit DOUBLE, source VARCHAR);
      INSERT INTO factors VALUES
        ('natural_gas', '*', 'kWh', 0.18296, 'DESNZ 2025, natural gas, gross CV'),
        ('diesel', '*', 'litre', 2.51279, 'DESNZ 2025, diesel (average biofuel blend)'),
        ('petrol', '*', 'litre', 2.0844, 'DESNZ 2025, petrol (average biofuel blend)'),
        ('refrigerant_r410a', '*', 'kg', 2088, 'IPCC AR5 GWP100, R-410A'),
        ('grid_electricity', 'FR', 'kWh', 0.0520, 'IEA 2025, France'),
        ('grid_electricity', 'GB', 'kWh', 0.2071, 'DESNZ 2025, UK electricity'),
        ('grid_electricity', 'US-ERCOT', 'kWh', 0.3730, 'EPA eGRID 2023, ERCT'),
        ('grid_electricity', 'IN', 'kWh', 0.7130, 'CEA 2024, India'),
        ('residual_mix', 'FR', 'kWh', 0.0590, 'AIB 2025 residual mix, France'),
        ('residual_mix', 'GB', 'kWh', 0.3500, 'AIB 2025 residual mix, UK'),
        ('residual_mix', 'US-ERCOT', 'kWh', 0.4100, 'Green-e 2025 residual mix, ERCOT'),
        ('residual_mix', 'IN', 'kWh', 0.7130, 'No residual mix published: grid average'),
        ('flight_short_haul', '*', 'passenger_km', 0.12786, 'DESNZ 2025, short-haul economy, with RF'),
        ('flight_long_haul', '*', 'passenger_km', 0.14981, 'DESNZ 2025, long-haul economy, with RF'),
        ('rail', '*', 'passenger_km', 0.03546, 'DESNZ 2025, national rail'),
        ('hotel_night', '*', 'night', 13.9, 'DESNZ 2025, hotel stay, average'),
        ('commute_car', '*', 'km', 0.16844, 'DESNZ 2025, average car'),
        ('spend_it_services', '*', 'EUR', 0.21, 'EXIOBASE 3.8, computer services'),
        ('spend_steel', '*', 'EUR', 1.62, 'EXIOBASE 3.8, basic iron and steel'),
        ('spend_packaging', '*', 'EUR', 0.74, 'EXIOBASE 3.8, paper and paperboard');
      -- Unit conversions to the factor's unit.
      CREATE TABLE units (from_unit VARCHAR, to_unit VARCHAR, multiply DOUBLE);
      INSERT INTO units VALUES ('kWh', 'kWh', 1), ('MWh', 'kWh', 1000), ('m3_gas', 'kWh', 10.55), ('litre', 'litre', 1), ('gallon_us', 'litre', 3.78541),
        ('kg', 'kg', 1), ('passenger_km', 'passenger_km', 1), ('passenger_mile', 'passenger_km', 1.60934), ('night', 'night', 1), ('km', 'km', 1), ('EUR', 'EUR', 1), ('USD', 'EUR', 0.92);

      -- =======================================================================
      -- Activity data for the month. Scope 3 cat 1 = purchased goods (spend),
      -- cat 6 = business travel, cat 7 = employee commuting.
      -- =======================================================================
      CREATE TABLE activity (line_id VARCHAR, site VARCHAR, scope VARCHAR, category VARCHAR, activity VARCHAR, quantity DOUBLE, unit VARCHAR, source_doc VARCHAR);
      INSERT INTO activity VALUES
        ('A01', 'Lyon plant', '1', 'Stationary combustion', 'natural_gas', 21000, 'm3_gas', 'GRDF invoice 2026-09'),
        ('A02', 'Leeds office', '1', 'Stationary combustion', 'natural_gas', 18500, 'kWh', 'British Gas invoice 2026-09'),
        ('A03', 'Lyon plant', '1', 'Mobile combustion', 'diesel', 6200, 'litre', 'Fleet card export 2026-09'),
        ('A04', 'Austin DC', '1', 'Mobile combustion', 'petrol', 410, 'gallon_us', 'Fleet card export 2026-09'),
        ('A05', 'Austin DC', '1', 'Fugitive', 'refrigerant_r410a', 6.5, 'kg', 'HVAC service report 2026-09-14'),
        ('A06', 'Lyon plant', '2', 'Purchased electricity', 'grid_electricity', 640, 'MWh', 'EDF invoice 2026-09'),
        ('A07', 'Leeds office', '2', 'Purchased electricity', 'grid_electricity', 52000, 'kWh', 'Octopus invoice 2026-09'),
        ('A08', 'Austin DC', '2', 'Purchased electricity', 'grid_electricity', 1350, 'MWh', 'Utility portal 2026-09'),
        ('A10', NULL, '3', '6 Business travel', 'flight_short_haul', 184000, 'passenger_km', 'Travel tool 2026-09'),
        ('A11', NULL, '3', '6 Business travel', 'flight_long_haul', 96000, 'passenger_mile', 'Travel tool 2026-09'),
        ('A12', NULL, '3', '6 Business travel', 'rail', 41000, 'passenger_km', 'Travel tool 2026-09'),
        ('A13', NULL, '3', '6 Business travel', 'hotel_night', 520, 'night', 'Travel tool 2026-09'),
        ('A14', NULL, '3', '7 Employee commuting', 'commute_car', 310000, 'km', 'Commute survey 2026, monthly'),
        ('A15', NULL, '3', '1 Purchased goods and services', 'spend_it_services', 410000, 'EUR', 'AP ledger 2026-09'),
        ('A16', NULL, '3', '1 Purchased goods and services', 'spend_steel', 260000, 'EUR', 'AP ledger 2026-09'),
        ('A17', NULL, '3', '1 Purchased goods and services', 'spend_packaging', 95000, 'USD', 'AP ledger 2026-09');
      -- Pune's electricity bill has not arrived: there is no A09 line this month.
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO activity VALUES ('A90', 'Leeds office', '1', 'Stationary combustion', 'natural_gas', 900, 'therm', 'Manual entry'),
                                  ('A91', 'Lyon plant', '1', 'Process emissions', 'lime_calcination', 40, 'tonne', 'Plant log');
      {% endif %}

      -- Same month last year, to estimate a missing bill: kWh per site.
      CREATE TABLE last_year (site VARCHAR, activity VARCHAR, quantity DOUBLE, unit VARCHAR);
      INSERT INTO last_year VALUES ('Pune office', 'grid_electricity', 118000, 'kWh'), ('Lyon plant', 'grid_electricity', 702000, 'kWh');

      -- =======================================================================
      -- Checks.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'UNKNOWN_UNIT' AS code, line_id AS ref, 'Unit ' || unit || ' cannot be converted for ' || activity AS detail
        FROM activity a WHERE NOT EXISTS (SELECT 1 FROM units u JOIN factors f ON f.unit = u.to_unit WHERE u.from_unit = a.unit AND f.activity = a.activity)
          AND EXISTS (SELECT 1 FROM factors f WHERE f.activity = a.activity)
      UNION ALL SELECT 'NO_FACTOR', line_id, 'No emission factor for ' || activity FROM activity a WHERE NOT EXISTS (SELECT 1 FROM factors f WHERE f.activity = a.activity)
      UNION ALL SELECT 'NEGATIVE_QUANTITY', line_id, 'Quantity ' || quantity FROM activity WHERE quantity < 0;

      -- Gaps: a site with no electricity line this month is estimated from last year.
      CREATE TABLE gaps AS
      SELECT 'E-' || s.site AS line_id, s.site, '2' AS scope, 'Purchased electricity' AS category, 'grid_electricity' AS activity, ly.quantity, ly.unit,
             'ESTIMATE: same month last year, bill not received' AS source_doc
      FROM sites s JOIN last_year ly ON ly.site = s.site AND ly.activity = 'grid_electricity'
      WHERE NOT EXISTS (SELECT 1 FROM activity a WHERE a.site = s.site AND a.activity = 'grid_electricity');
      CREATE TABLE all_lines AS SELECT *, false AS estimated FROM activity UNION ALL SELECT *, true FROM gaps;

      -- =======================================================================
      -- Emissions per line. Scope 2 is computed twice: location-based with the
      -- grid average, market-based with 0 for the green tariff share and the
      -- residual mix for the rest.
      -- =======================================================================
      CREATE TABLE lines AS
      SELECT l.line_id, l.site, l.scope, l.category, l.activity, l.quantity, l.unit, l.estimated, l.source_doc,
             l.quantity * u.multiply AS converted_qty, f.unit AS factor_unit, f.kg_co2e_per_unit AS factor, f.source AS factor_source,
             round(l.quantity * u.multiply * f.kg_co2e_per_unit / 1000, 3) AS tco2e_location,
             round(CASE WHEN l.scope = '2' THEN l.quantity * u.multiply * (1 - s.green_tariff_pct / 100) * rm.kg_co2e_per_unit / 1000
                        ELSE l.quantity * u.multiply * f.kg_co2e_per_unit / 1000 END, 3) AS tco2e_market,
             CASE WHEN l.scope = '2' THEN rm.source || ', ' || s.green_tariff_pct || '% green tariff at 0' END AS market_basis
      FROM all_lines l
      JOIN factors f ON f.activity = l.activity AND f.region IN ('*', (SELECT grid_region FROM sites x WHERE x.site = l.site))
      JOIN units u ON u.from_unit = l.unit AND u.to_unit = f.unit
      LEFT JOIN sites s ON s.site = l.site
      LEFT JOIN factors rm ON rm.activity = 'residual_mix' AND rm.region = s.grid_region;

      CREATE TABLE summary AS
      SELECT scope, category, round(sum(tco2e_location), 3) AS tco2e_location, round(sum(tco2e_market), 3) AS tco2e_market,
             round(sum(tco2e_market) FILTER (WHERE estimated), 3) AS estimated_tco2e
      FROM lines GROUP BY scope, category ORDER BY scope, category;

      -- Year to date from the earlier months of the year, kept in KV.
      CREATE TABLE ytd_prev AS SELECT key AS period, (value->>'s12_market')::DOUBLE AS s12_market FROM json_each('{{ outputs.state.values.months }}');
      CREATE TABLE totals AS
      SELECT round(sum(tco2e_location) FILTER (WHERE scope = '1'), 1) AS s1,
             round(sum(tco2e_location) FILTER (WHERE scope = '2'), 1) AS s2_location,
             round(sum(tco2e_market) FILTER (WHERE scope = '2'), 1) AS s2_market,
             round(sum(tco2e_market) FILTER (WHERE scope = '3'), 1) AS s3,
             round(sum(tco2e_market) FILTER (WHERE scope IN ('1', '2')), 3) AS s12_market,
             round(sum(tco2e_market) FILTER (WHERE estimated), 1) AS estimated
      FROM lines;

      COPY (SELECT * FROM lines ORDER BY scope, category, line_id) TO '{{ outputFiles.lines }}' (HEADER, DELIMITER ',');
      COPY summary TO '{{ outputFiles.summary }}' (HEADER, DELIMITER ',');
      COPY (SELECT line_id, site, activity, quantity, unit, source_doc FROM gaps) TO '{{ outputFiles.gaps }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT t.s1, t.s2_location, t.s2_market, t.s3, t.s12_market, t.estimated,
             round(t.s1 + t.s2_market + t.s3, 1) AS total_market,
             (SELECT string_agg(category || ' ' || round(tco2e_market, 1), ', ' ORDER BY tco2e_market DESC) FROM summary WHERE scope = '3') AS s3_detail,
             (SELECT count(*) FROM ytd_prev)::INT AS months_before,
             round(coalesce((SELECT sum(s12_market) FROM ytd_prev), 0) + t.s12_market, 1) AS ytd_s12,
             round({{ inputs.annual_target_tco2e }} * ((SELECT count(*) FROM ytd_prev) + 1) / 12, 1) AS ytd_budget,
             (SELECT coalesce(string_agg(site || ' electricity ' || quantity || ' ' || unit, ', '), '') FROM gaps) AS gap_detail,
             (SELECT count(*) FROM blockers)::INT AS blockers,
             (SELECT coalesce(string_agg(code || ' ' || ref, ', ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail
      FROM totals t;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.inventory.outputs | last).row | toJson }}"

  - id: log_inventory
    type: io.kestra.plugin.core.log.Log
    message: |
      GHG inventory {{ inputs.period }} ({{ inputs.scenario }}), tCO2e: {{ outputs.result.values.r | jq('"Scope 1 \(.s1). Scope 2 location \(.s2_location), market \(.s2_market). Scope 3 \(.s3). Total (market) \(.total_market)."') | first }}
      {{ outputs.result.values.r | jq('"Scope 3: \(.s3_detail)."') | first }}
      {{ outputs.result.values.r | jq('"Estimated: \(.estimated // 0) tCO2e (\(if .gap_detail == "" then "no gap" else .gap_detail end))."') | first }}
      {{ outputs.result.values.r | jq('"Year to date, Scope 1+2 market: \(.ytd_s12) against a budget of \(.ytd_budget) after \(.months_before + 1) months."') | first }}
      Blockers: {{ outputs.result.values.r | jq('.blockers') | first }} {{ outputs.result.values.r | jq('.blocker_detail') | first }}

  - id: evidence_blockers
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.inventory.outputFiles.blockers }}"

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.blockers > 0') | first }}"
    then:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "GHG inventory not published: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/lines.csv": "{{ outputs.inventory.outputFiles.lines }}"
      "{{ render(vars.pack_dir) }}/summary.csv": "{{ outputs.inventory.outputFiles.summary }}"
      "{{ render(vars.pack_dir) }}/gaps.csv": "{{ outputs.inventory.outputFiles.gaps }}"

  - id: save
    type: io.kestra.plugin.core.kv.Set
    key: "{{ vars.state_key }}"
    kvType: JSON
    value: >-
      {{ {'old': (kv(vars.state_key, errorOnMissing=false) ?? {'months': {}}), 'p': inputs.period, 'r': fromJson(outputs.result.values.r)}
         | jq('{months: (.old.months + {(.p): {s1: .r.s1, s2_market: .r.s2_market, s2_location: .r.s2_location, s3: .r.s3, s12_market: .r.s12_market, estimated: .r.estimated}})}') | first | toJson }}

  - id: target_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.ytd_s12 > .ytd_budget') | first }}"
    then:
      - id: over_budget
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: >-
          {{ outputs.result.values.r | jq('"Scope 1+2 is \(((.ytd_s12 - .ytd_budget) * 10 | round) / 10) tCO2e over the year-to-date budget."') | first }}

extend:
  title: Build a monthly GHG emissions inventory for Scope 1, 2 and 3 with an audit trail per line
  metaTitle: GHG emissions inventory, Scope 1 2 3 carbon accounting with Kestra and DuckDB
  shortDescription: Convert fuel, electricity, travel, commuting and spend data into tCO2e with a factor table, report Scope 2 location- and market-based, estimate missing bills, and track the year against the reduction target.
  metaDescription: Carbon accounting in Kestra and DuckDB. Scope 1, 2 (location and market) and 3 in tCO2e, factor per line, gap estimates and target tracking.
  description: |
    CSRD (ESRS E1), the SEC and California climate rules, and most large customers now ask for a greenhouse gas inventory that an auditor can trace. The arithmetic is simple: activity × emission factor. The work is everything around it:
    - converting cubic metres of gas and US gallons to the factor's unit;
    - computing Scope 2 twice, location-based and market-based, with the green tariff counted only in the market-based figure;
    - estimating the bill that has not arrived, and saying so;
    - keeping, for every number, the invoice it came from and the factor it used.

    This flow does it every month and tracks Scope 1 + 2 against the year's reduction budget.

    It runs with no setup and no network. The demo company has four sites in France, the UK, Texas and India:
    - gas, fleet fuel, a refrigerant top-up and electricity;
    - business travel, commuting and three spend categories;
    - an electricity bill that has not arrived for the Pune office.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## What is computed

    | Scope | Sources in the demo | Method |
    |---|---|---|
    | 1 | Natural gas, diesel and petrol fleet, R-410A leak | Quantity × factor. Refrigerant uses its GWP100 |
    | 2 location-based | Electricity per site | Grid average factor of the site's region |
    | 2 market-based | Electricity per site | Green tariff share at 0, the rest at the residual mix. Where no residual mix is published, the grid average, as the line says |
    | 3 cat 1 | IT services, steel, packaging | Spend-based factors (EXIOBASE), USD converted to EUR |
    | 3 cat 6 | Flights, rail, hotels | Distance and nights, flights with radiative forcing |
    | 3 cat 7 | Commuting | Survey distance, average car |

    Totals use the market-based Scope 2, as most targets do. Both figures are reported, as the GHG Protocol requires.

    ## Audit trail and gaps

    `lines.csv` has one row per activity line, with:
    - the source document;
    - the quantity, its unit and the converted quantity;
    - the factor and its source;
    - tCO2e both ways, and the market-based basis.

    A site with no electricity line for the month is estimated from the same month last year and marked `estimated`. The estimate is listed in `gaps.csv` and in the log, so it can be trued up when the bill arrives.

    ## How it works

    1. `state` loads the earlier months of the same year from KV.
    2. `inventory` (`io.kestra.plugin.jdbc.duckdb.Queries`) holds the sites, the factors, the unit conversions and the month's activity. It checks the data, estimates the gaps, then computes every line, the summary per scope and category, and the year to date.
    3. `log_inventory` prints the scopes, the Scope 3 categories, the estimates and the year to date. `evidence_blockers` stores `blockers.csv`.
    4. `gate` stops on blockers before anything else is written: a unit that cannot be converted for the activity, an activity with no emission factor, a negative quantity. Otherwise `evidence` stores `lines.csv`, `summary.csv` and `gaps.csv`.
    5. `save` (`io.kestra.plugin.core.kv.Set`) stores the month's totals. Running a month again replaces it, so the year to date never counts a month twice.
    6. `target_gate` warns when Scope 1 + 2 is above the year-to-date budget: the annual target × months reported / 12.

    ## Tested end to end

    On Kestra 2.0.5 OSS.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2026-08 | Scope 1 76.3, Scope 2 location 631.7 and market 454.0, Scope 3 679.5 (purchased goods 572.0, travel 55.4, commuting 52.2). Pune estimated at 84.1. Year to date 530.3 against 550.0 |
    | 2 | 2026-09 | Year to date 1,060.6 against 1,100.0 after 2 months |
    | 3 | 2026-09 again | Same year to date: the month is replaced, not added |
    | 4 | 2026-10, target 6,000 | 1,590.9 against 1,500.0: warning, 90.9 tCO2e over |
    | 5 | `ISSUES` | Blocked: gas in therms, which has no conversion, and lime calcination, which has no factor |

    I recomputed the 17 lines independently in Python from the activity data, the conversions and the factors, location- and market-based. Every line matches, and so do the scope totals.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `period` | `2026-09` | Month |
    | `annual_target_tco2e` | `6600.0` | Scope 1 + 2 market-based budget for the year |
    | `scenario` | `CLEAN` | Demo only |

    ## Use it with your data

    - Replace `activity` with your utility bills or meter data, fleet card exports, travel tool and AP ledger mapped to spend categories.
    - Load `factors` from the factor set you report with (DESNZ, EPA, IEA, AIB, or supplier-specific factors). Update them once a year, and keep the source column.
    - Add the green tariff share per site from your contracts or energy attribute certificates.
    - Replace a spend-based Scope 3 line with supplier data when you have it. The line keeps its own factor and source.

    ## Things to know

    - The demo factors are illustrative values with their published source named. Check them against the current edition before you report.
    - Scope 3 has 15 categories. The demo covers the three most companies start with. The others follow the same pattern.

    ## Links

    - GHG Protocol Scope 2 guidance: https://ghgprotocol.org/scope-2-guidance
    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb
  tags:
    - Business
    - Data
  subTags:
    - Policy & Compliance
    - Reporting & Digests
  ee: false
  demo: true
