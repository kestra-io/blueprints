id: github-release-watcher
namespace: system

description: |
  ReleasePulse runs once a day and does three things:
  checks a repo's releases, opens a GitHub issue when a new release drops,
  and remembers the last tag in the KV store so it never files twice.

inputs:
  - id: repo_owner
    type: STRING
    description: GitHub owner of the repo to watch (e.g. kestra-io)
  - id: repo_name
    type: STRING
    description: GitHub repo name to watch (e.g. kestra)

tasks:
  - id: fetch_release
    type: io.kestra.plugin.core.http.Request
    description: gets the latest release of the repo from the GitHub API
    method: GET
    uri: https://api.github.com/repos/{{ inputs.repo_owner }}/{{ inputs.repo_name }}/releases?per_page=1
    headers:
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      Accept: "application/vnd.github+json"

  - id: check_seen
    type: io.kestra.plugin.core.kv.GetKeys
    description: checks whether we have filed an issue before (empty list on first run)
    prefix: "releasepulse-last-tag"

  - id: process_release
    type: io.kestra.plugin.core.flow.If
    description: only continues if the repo has at least one release
    condition: "{{ (outputs.fetch_release.body | jq('length') | first) > 0 }}"
    then:
      - id: file_issue_if_new
        type: io.kestra.plugin.core.flow.If
        description: files an issue only when the tag is new (first run just saves, no issue)
        condition: "{{ outputs.check_seen.keys | length > 0 and (outputs.fetch_release.body | jq('.[0].tag_name') | first) != kv('releasepulse-last-tag') }}"
        then:
          - id: create_issue
            type: io.kestra.plugin.github.issues.Create
            description: opens a GitHub issue announcing the new release
            oauthToken: "{{ secret('GITHUB_TOKEN') }}"
            repository: "{{ inputs.repo_owner }}/{{ inputs.repo_name }}"
            title: "New release: {{ outputs.fetch_release.body | jq('.[0].tag_name') | first }}"
            body: |
              A new release is out: **{{ outputs.fetch_release.body | jq('.[0].tag_name') | first }}**
              ({{ outputs.fetch_release.body | jq('.[0].name') | first }}).

              Release notes: {{ outputs.fetch_release.body | jq('.[0].html_url') | first }}

              _Filed automatically by ReleasePulse._
            labels:
              - release

      - id: save_seen
        type: io.kestra.plugin.core.kv.Set
        description: remembers this tag in the KV store for the next run
        key: releasepulse-last-tag
        value: "{{ outputs.fetch_release.body | jq('.[0].tag_name') | first }}"
        overwrite: true

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * *"
    timezone: UTC
    inputs:
      repo_owner: kestra-io
      repo_name: kestra

extend:
  title: ReleasePulse
  shortDescription: Watch a GitHub repo's releases daily and open an issue the moment a new one drops.
  metaTitle: "ReleasePulse: GitHub Release Watcher in Kestra"
  metaDescription: Watch any GitHub repo for new releases with Kestra. Daily check, automatic issue filing, and KV-store memory so it never files twice.
  description: |
    ReleasePulse watches a GitHub repository's releases and files a GitHub issue whenever a new release drops. It runs once a day, compares the latest tag against the last one it saw (stored in Kestra's KV store), and only files when the tag is genuinely new. It does not use Slack. The alert is a GitHub issue, so it shows up where the team already works.

    ## How it works

    1. `fetch_release` calls the GitHub Releases API and grabs the latest release.
    2. `check_seen` reads the KV store for the last filed tag (empty on the first run).
    3. `file_issue_if_new` compares the two. A new tag means a new issue through the GitHub plugin. The first run just saves the tag and stays quiet.
    4. `save_seen` stores the latest tag in the KV store so the next run knows where it left off.

    ## Who it's for

    - Maintainers who want release announcements as trackable GitHub issues.
    - Teams watching upstream dependencies who want a paper trail when a new version lands.

    ## Prerequisites

    - A running Kestra instance.

    ### Secrets

    Add this secret to your Kestra instance:

    - `GITHUB_TOKEN`: a GitHub personal access token with `repo` scope (reads releases, creates issues).

    ## Quick start

    1. Add the `GITHUB_TOKEN` secret to your Kestra instance.
    2. Import this flow and Execute it, entering the repo owner and name when prompted.
    3. The first run calibrates silently. The daily 09:00 UTC schedule handles the rest.

    Created by Faizan Parvez.

  tags:
    - Infrastructure
    - Core
  subTags:
    - Scheduling
  ee: false
  demo: false
