id: kubeaudit-kubernetes-manifest-security-and-auto-remediation-gate
namespace: company.infrastructure

description: |
  Audits a Kubernetes manifest with Shopify Kubeaudit's full auditor suite, generates an automated
  unified diff remediation patch via kubeaudit autofix, and gates deployment on critical security
  errors while routing non-blocking warnings to Slack.

inputs:
  - id: manifestYaml
    type: STRING
    displayName: Kubernetes Manifest YAML
    description: Raw Kubernetes manifest YAML content to audit and auto-remediate.
    required: false
    defaults: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web-app
        namespace: production
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: web
        template:
          metadata:
            labels:
              app: web
          spec:
            containers:
              - name: nginx
                image: nginx:1.27
                ports:
                  - containerPort: 80

  - id: minSeverity
    type: STRING
    displayName: Minimum Severity Threshold
    description: Minimum audit finding severity level to trigger remediation warnings (error, warning, info).
    required: false
    defaults: error

  - id: failOnCritical
    type: BOOL
    displayName: Fail on Critical Security Errors
    description: Whether to fail the execution if critical security violations are detected.
    required: false
    defaults: true

tasks:
  - id: audit_manifests
    type: io.kestra.plugin.scripts.shell.Commands
    description: Run Shopify Kubeaudit container to scan Kubernetes manifests and output structured JSON report.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: shopify/kubeaudit:v0.22.2
    env:
      MANIFEST_CONTENT: "{{ inputs.manifestYaml }}"
      MIN_SEVERITY: "{{ inputs.minSeverity }}"
    commands:
      - |
        set -euo pipefail
        mkdir -p workspace
        echo "${MANIFEST_CONTENT}" > workspace/manifest.yaml

        echo "Auditing Kubernetes manifest with Kubeaudit..."
        set +e
        kubeaudit all -f workspace/manifest.yaml --format json --minseverity "${MIN_SEVERITY}" > "{{ outputDir }}/kubeaudit-report.json" 2> kubeaudit-stderr.log
        KUBEAUDIT_EXIT=$?
        set -e

        # kubeaudit exits 0 when clean and 2 (configurable via -e) when error-severity findings
        # exist -- both are a successful run. Any other code (eg. 1 from log.Fatal on a bad flag
        # or malformed manifest) means the tool never actually produced a report; fail loudly
        # instead of silently reporting a false APPROVED_SECURE.
        if [ "$KUBEAUDIT_EXIT" != "0" ] && [ "$KUBEAUDIT_EXIT" != "2" ]; then
          echo "kubeaudit exited with unexpected code ${KUBEAUDIT_EXIT}:" >&2
          cat kubeaudit-stderr.log >&2
          exit 1
        fi

        if [ ! -s "{{ outputDir }}/kubeaudit-report.json" ]; then
          echo '[]' > "{{ outputDir }}/kubeaudit-report.json"
        fi
        echo "Manifest audit completed."
    outputFiles:
      - kubeaudit-report.json
  - id: generate_remediation_patch
    type: io.kestra.plugin.scripts.shell.Commands
    description: Execute Kubeaudit autofix engine to generate hardened manifests and compute a unified diff remediation patch.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: shopify/kubeaudit:v0.22.2
    env:
      MANIFEST_CONTENT: "{{ inputs.manifestYaml }}"
    commands:
      - |
        set -euo pipefail
        mkdir -p workspace
        echo "${MANIFEST_CONTENT}" > workspace/original.yaml

        echo "Generating autofixed Kubernetes manifest..."
        kubeaudit autofix -f workspace/original.yaml -o workspace/fixed.yaml || true

        diff -u workspace/original.yaml workspace/fixed.yaml > "{{ outputDir }}/remediation.patch" || true
        cp workspace/fixed.yaml "{{ outputDir }}/hardened-manifest.yaml"
        echo "Remediation patch generated successfully."
    outputFiles:
      - remediation.patch
      - hardened-manifest.yaml
  - id: triage_security_posture
    type: io.kestra.plugin.scripts.shell.Commands
    description: Parse audit findings JSON and remediation diff to classify security posture and calculate violation metrics.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-alpine
    inputFiles:
      kubeaudit-report.json: "{{ outputs.audit_manifests.outputFiles['kubeaudit-report.json'] }}"
      remediation.patch: "{{ outputs.generate_remediation_patch.outputFiles['remediation.patch'] }}"
    commands:
      - |
        python3 - << 'PYEOF'
        import json
        import os

        report_file = "kubeaudit-report.json"
        patch_file = "remediation.patch"

        findings = []
        with open(report_file, "r", encoding="utf-8") as f:
            for line in f:
                line = line.strip()
                if not line:
                    continue
                try:
                    parsed = json.loads(line)
                except Exception:
                    continue
                if isinstance(parsed, dict):
                    findings.append(parsed)
                # non-dict lines (eg. the "[]" placeholder written for a run with zero
                # findings) are not audit records and are safely ignored here.

        patch_size = 0
        if os.path.exists(patch_file):
            patch_size = os.path.getsize(patch_file)

        errors = 0
        warnings = 0
        critical_violations = []

        for item in findings:
            lvl = item.get("level", "").lower()
            msg = item.get("msg", "")
            auditor = item.get("AuditResultName", item.get("auditor", ""))

            if lvl == "error":
                errors += 1
                critical_violations.append(f"[{auditor}] {msg}")
            elif lvl == "warning":
                warnings += 1

        fail_on_critical = "{{ inputs.failOnCritical }}" == "true"

        if errors > 0 and fail_on_critical:
            status = "CRITICAL_SECURITY_BREACH"
            summary = f"{errors} critical security violation(s) detected. Automated remediation patch generated."
        elif errors > 0 or warnings > 0:
            status = "REMEDIATION_AVAILABLE"
            summary = f"{errors} error(s), {warnings} warning(s). Remediation patch ready to apply."
        else:
            status = "APPROVED_SECURE"
            summary = "Manifest passed all Kubeaudit security checks with zero errors."

        top_violations = "; ".join(critical_violations[:4]) if critical_violations else "None"

        output_payload = {
            "status": status,
            "summary": summary,
            "errors": errors,
            "warnings": warnings,
            "top_violations": top_violations,
            "patch_size_bytes": patch_size,
        }

        print(f"Kubeaudit Triage: Status={status}, Errors={errors}, Warnings={warnings}, PatchSize={patch_size}B")
        print(f'::{{"outputs": {json.dumps(output_payload)}}}::')
        PYEOF
  - id: route_security_verdict
    type: io.kestra.plugin.core.flow.Switch
    description: Route execution based on Kubeaudit security audit results and autofix patch availability.
    value: "{{ outputs.triage_security_posture.vars.status }}"
    cases:
      APPROVED_SECURE:
        - id: log_approved
          type: io.kestra.plugin.core.log.Log
          message: "Kubernetes manifest security audit APPROVED. Zero security errors detected. {{ outputs.triage_security_posture.vars.summary }}"

      REMEDIATION_AVAILABLE:
        - id: notify_remediation_available
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#devops-alerts",
              "text": "Kubeaudit Warning: Kubernetes manifest has security misconfigurations. Automated remediation patch is available in Kestra artifacts. Errors: {{ outputs.triage_security_posture.vars.errors }}, Warnings: {{ outputs.triage_security_posture.vars.warnings }}. Details: {{ outputs.triage_security_posture.vars.top_violations }}"
            }

        - id: log_warning
          type: io.kestra.plugin.core.log.Log
          message: "Warning: Kubernetes manifest requires security hardening. Patch size: {{ outputs.triage_security_posture.vars.patch_size_bytes }} bytes."

      CRITICAL_SECURITY_BREACH:
        - id: notify_critical_breach
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#security-oncall",
              "text": "CRITICAL SECURITY BREACH: Kubernetes deployment blocked by Kubeaudit gate. Violations: {{ outputs.triage_security_posture.vars.top_violations }}. Download remediation.patch from Kestra execution artifacts."
            }

        - id: fail_security_gate
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "Kubernetes manifest failed Kubeaudit security gate: {{ outputs.triage_security_posture.vars.summary }}"

    defaults:
      - id: log_unexpected_verdict
        type: io.kestra.plugin.core.log.Log
        message: "Unexpected Kubeaudit triage status: {{ outputs.triage_security_posture.vars.status }}"

triggers:
  - id: weekly_manifest_compliance_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 * * 1"
    disabled: true

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Posts a pipeline execution error alert if the Kubeaudit audit, autofix, or triage task fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "text": "❌ *Kubeaudit Security Gate Flow Execution Failed*: Execution `{{ execution.id }}` failed on task `{{ task.id }}` in flow `{{ flow.id }}`. Check Kestra execution logs."
      }

extend:
  title: Kubernetes Manifest Security Audit & Automated Remediation Gate with Kubeaudit
  metaTitle: Kubernetes Manifest Security & Auto-Remediation with Kubeaudit | Kestra
  shortDescription: Audit Kubernetes manifests against security best practices and generate automated unified diff remediation patches with Shopify Kubeaudit.
  metaDescription: Audit Kubernetes manifests for security misconfigurations and generate automated remediation diff patches with Shopify Kubeaudit before deploying to clusters.
  description: |
    Enforce container hardening, least-privilege security contexts, and automated YAML remediation across Kubernetes deployment manifests with [Shopify Kubeaudit](https://github.com/Shopify/kubeaudit). In fast-moving engineering environments, developers frequently deploy manifests lacking essential security configurations: running containers as root, omitting read-only root filesystems, granting dangerous Linux capabilities, and allowing unconstrained privilege escalation.

    This blueprint audits raw Kubernetes manifests against Kubeaudit comprehensive auditor suite (AppArmor, Capabilities, HostNamespace, Limits, NetworkPolicies, NonRoot, Privileged, PrivilegeEscalation, and ReadOnlyRootFilesystem). When violations are discovered, it does not merely alert—it automatically invokes Kubeaudit native autofix engine to generate hardened manifests and computes a unified diff patch (`remediation.patch`) stored directly as a Kestra artifact. Teams can review the exact diff, apply it with `git apply`, and prevent insecure workloads from reaching production.

    ## How it works

    1. **Trigger & Input Ingestion**: Executes on a scheduled weekly cadence (default: Mondays at 05:00 UTC) to audit infrastructure manifests, or runs on-demand via webhook from CI/CD GitOps pipelines with the target manifest YAML.
    2. **Multi-Vector Security Audit**: Launches `shopify/kubeaudit:v0.22.2` via Kestra Docker task runner. It evaluates manifests across all security auditors with JSON-formatted diagnostic output saved as `kubeaudit-report.json`.
    3. **Automated Manifest Remediation**: Simultaneously runs `kubeaudit autofix` to inject hardened security contexts (e.g. `runAsNonRoot: true`, `readOnlyRootFilesystem: true`, `allowPrivilegeEscalation: false`, and dropping `ALL` capabilities). It computes a unified diff between the original and repaired YAML, exporting `remediation.patch` and `hardened-manifest.yaml` as execution artifacts.
    4. **Policy Triage & Classification**: A Python task parses the findings, counts critical security errors versus warnings, inspects patch availability, and assigns a tri-state verdict:
       - `APPROVED_SECURE`: Zero security errors; manifest complies with production standards.
       - `REMEDIATION_AVAILABLE`: Non-critical warnings detected; automated patch is generated and flagged to the team without blocking.
       - `CRITICAL_SECURITY_BREACH`: High-risk violations detected (e.g. root execution or privileged containers); blocks deployments when `failOnCritical` is enabled.
    5. **Flow Control & Notifications**: A `Switch` task logs approvals, sends actionable Slack alerts with offending rule codes, and halts execution on critical breaches.

    ## What you get

    - **Automated Security Patch Generation**: Instant `remediation.patch` artifact ready to apply with `git apply remediation.patch` to harden insecure YAML.
    - **Continuous Security Governance**: Automated scanning for root execution, privileged mode, sensitive host volume mounts, and missing capabilities.
    - **Tri-State Operational Gating**: Nuanced triage separating blocking critical exploits from non-blocking hardening recommendations.
    - **Audit Artifact Retention**: Retains both the raw diagnostic report and the auto-remediated YAML file for compliance verification.
    - **Actionable Slack Alerts**: Context-rich Slack notifications detailing exact offending auditors (`[NonRoot]`, `[Privileged]`) and direct artifact download guidance.

    ## Who it's for

    - **Kubernetes Platform & Security Engineers**: Enforcing Pod Security Standards (PSS) and preventing privileged containers in multi-tenant clusters.
    - **DevOps & CI/CD Teams**: Gating GitOps pull requests with automated security reviews and downloadable fix patches.
    - **Site Reliability Engineers (SREs)**: Standardizing security contexts and resource constraints before production promotions.

    ## Why orchestrate this with Kestra

    - **Declarative YAML Orchestration**: Maintain security audit policies and notification channels as version-controlled workflows.
    - **Zero Local Tool Maintenance**: Run Kubeaudit in ephemeral containers without requiring local CLI installations or cluster-wide daemonsets.
    - **Built-In Artifact Management**: Automatically store, index, and download generated patch files and reports directly from the Kestra UI.
    - **CI/CD Pipeline Interoperability**: Seamlessly integrate with GitHub Actions, GitLab CI, or ArgoCD webhooks to gate pull requests before merge.

    ## Prerequisites

    - Docker daemon or container runner configured on the Kestra worker.
    - An incoming Slack webhook URL for notification channels.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL to deliver security posture alerts and remediation notices (required).

    ## Quick start

    1. Configure your Slack webhook URL in namespace secrets as `SLACK_WEBHOOK_URL`.
    2. Import this blueprint into your Kestra instance.
    3. Click **Execute** with the default sample Deployment manifest.
    4. Navigate to the **Execution Artifacts** tab to inspect `remediation.patch` and `hardened-manifest.yaml`.
    5. Enable the scheduled trigger for continuous baseline auditing.

    ## How to extend

    - **Automated Pull Request Creation**: Chain a Git task to commit the generated `remediation.patch` directly to a new remediation branch on GitHub/GitLab.
    - **Multi-File Manifest Scan**: Update the task commands to scan an entire directory of Helm or Kustomize manifests using `kubeaudit all -f manifests/`.
    - **Custom Policy Config**: Mount a custom `kubeaudit-config.yaml` to tailor severity overrides and organizational rule exclusions.

    ## Links

    - [Shopify Kubeaudit GitHub Repository](https://github.com/Shopify/kubeaudit)
    - [Kubernetes Pod Security Standards](https://kubernetes.io/docs/concepts/security/pod-security-standards/)
    - [Kestra Shell Plugin Documentation](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Approval Gates
  ee: false
  demo: false
