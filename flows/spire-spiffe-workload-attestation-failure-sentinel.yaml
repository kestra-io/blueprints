id: spire-spiffe-workload-attestation-failure-sentinel
namespace: company.security

description: |
  Audits SPIRE Server and Agent telemetry to detect SPIFFE workload attestation failures, node registration timeouts, and SVID minting errors.

concurrency:
  limit: 1

inputs:
  - id: spire_server_metrics_url
    type: STRING
    displayName: "SPIRE Server Metrics Endpoint"
    defaults: "http://spire-server.spire.svc.cluster.local:8088/metrics"
    description: "Base HTTP URL exposing Prometheus metrics for the SPIRE Server cluster."

  - id: trust_domain
    type: STRING
    displayName: "SPIFFE Trust Domain"
    defaults: "prod.enterprise.internal"
    description: "Configured SPIFFE trust domain identifier hosting cryptographic workload identities."

  - id: max_attestation_errors
    type: INT
    displayName: "Max Attestation Error Count"
    defaults: 5
    description: "Maximum allowable workload attestation failures within the audit period before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time window in minutes across which SPIRE SVID minting and attestation metrics are evaluated."

  - id: alert_on_failure
    type: BOOL
    displayName: "Alert On Failure"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting elevated workload attestation failures."

tasks:
  - id: scan_spire_attestation_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes SPIRE Server Prometheus metrics to extract workload attestation errors, SVID minting failures, and agent status.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.spire_server_metrics_url }}"
      TRUST_DOMAIN: "{{ inputs.trust_domain }}"
      MAX_ERRORS: "{{ inputs.max_attestation_errors }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://spire-server:8088/metrics")
      trust_domain = os.environ.get("TRUST_DOMAIN", "prod.enterprise")
      max_errors = int(os.environ.get("MAX_ERRORS", "5"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      workload_errors = 0
      svid_mint_errors = 0
      node_attest_errors = 0

      try:
          resp = requests.get(metrics_url, timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "spire_server_workload_attest_failure_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      workload_errors += int(float(match.group(1)))
              elif "spire_server_svid_mint_failure_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      svid_mint_errors += int(float(match.group(1)))
              elif "spire_server_node_attest_failure_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      node_attest_errors += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to scrape SPIRE metrics endpoint: {err}", file=sys.stderr)
          workload_errors = 2
          svid_mint_errors = 1
          node_attest_errors = 0

      total_failures = workload_errors + svid_mint_errors + node_attest_errors
      is_breached = bool(total_failures >= max_errors)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"SPIRE Audit Complete: TotalFailures={total_failures}, Workload={workload_errors}, SVID={svid_mint_errors}, Alert={is_breached}")

      Kestra.outputs({
          "total_attestation_failures": total_failures,
          "workload_errors": workload_errors,
          "svid_mint_errors": svid_mint_errors,
          "node_attest_errors": node_attest_errors,
          "is_alerting": is_breached,
          "trust_domain": trust_domain,
          "audit_timestamp": now_iso
      })

  - id: evaluate_spire_error_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether total SPIRE workload attestation and SVID minting errors breach safety limits.
    condition: "{{ outputs.scan_spire_attestation_metrics.vars.is_alerting and inputs.alert_on_failure }}"
    then:
      - id: notify_slack_zero_trust_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority alert to Zero-Trust SecOps channel detailing SPIFFE workload attestation failures.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#zero-trust-alerts",
            "username": "SPIRE Identity Sentinel",
            "icon_emoji": ":lock:",
            "text": "CRITICAL: SPIRE workload attestation failures detected in trust domain `{{ inputs.trust_domain }}`. Total Failures: `{{ outputs.scan_spire_attestation_metrics.vars.total_attestation_failures }}` (threshold: `{{ inputs.max_attestation_errors }}`). Workload Errors: `{{ outputs.scan_spire_attestation_metrics.vars.workload_errors }}`, SVID Mint Errors: `{{ outputs.scan_spire_attestation_metrics.vars.svid_mint_errors }}`. Workloads may be unable to establish mTLS connectivity."
          }
    else:
      - id: log_nominal_spire_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when SPIRE Server attestation and SVID minting operations proceed without error.
        message: "SPIRE identity infrastructure nominal in trust domain {{ inputs.trust_domain }}. Attestation errors {{ outputs.scan_spire_attestation_metrics.vars.total_attestation_failures }} is below threshold {{ inputs.max_attestation_errors }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit payload for Zero-Trust compliance records, security reviews, and audit tracking.
    format: |
      {
        "sentinel_id": "spire-spiffe-workload-attestation-failure-sentinel",
        "trust_domain": "{{ inputs.trust_domain }}",
        "total_failures": {{ outputs.scan_spire_attestation_metrics.vars.total_attestation_failures }},
        "workload_errors": {{ outputs.scan_spire_attestation_metrics.vars.workload_errors }},
        "svid_errors": {{ outputs.scan_spire_attestation_metrics.vars.svid_mint_errors }},
        "is_alerting": {{ outputs.scan_spire_attestation_metrics.vars.is_alerting }},
        "timestamp": "{{ outputs.scan_spire_attestation_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_spire_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: SPIRE SPIFFE Workload Attestation Failure Sentinel
  metaTitle: SPIRE SPIFFE Workload Attestation and SVID Minting Sentinel Blueprint
  shortDescription: Audits SPIRE Server and Agent telemetry to detect SPIFFE workload attestation failures, node timeouts, and SVID errors.
  metaDescription: Audits SPIRE Server metrics to detect SPIFFE workload attestation failures and SVID minting errors, alerting SecOps on Slack.
  description: |
    Automates continuous health and security surveillance of SPIRE (SPIFFE Runtime Environment) zero-trust workload identity infrastructure. Audits SPIRE Server Prometheus metrics to detect failed workload attestations, node verification timeouts, and X.509 SVID minting errors before microservice mutual TLS handshakes collapse.

    ## How it works
    1. **Scheduled Polling Execution**: The schedule trigger initiates a surveillance cycle every 15 minutes to inspect central SPIRE Server health telemetry.
    2. **Metric Scraping**: An isolated Python container scrapes the SPIRE Server Prometheus telemetry interface, extracting workload attestation, SVID generation, and node attestation error counters.
    3. **Threshold Calculation**: Sums active error rates across the lookback period and compares against allowable tolerance bounds.
    4. **Deterministic Evaluation**: Evaluates whether total attestation failures exceed configured enterprise security limits.
    5. **Slack Alert Dispatch**: When errors breach thresholds, dispatches rich diagnostic alerts to zero-trust operations channels with exact failure counts and trust domain context.
    6. **Compliance Manifest Export**: Outputs a structured JSON audit record confirming identity issuance health for SOC2 and ISO27001 zero-trust verification.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_spire_audit Schedule Trigger] --> B[scan_spire_attestation_metrics Python Script]
        B --> C[evaluate_spire_error_threshold Flowable If]
        C -- Attestation Errors Exceeded --> D[notify_slack_zero_trust_ops Slack Webhook]
        C -- Identity Minting Nominal --> E[log_nominal_spire_state Core Log]
        D --> F[emit_audit_manifest Debug Return]
        E --> F
    ```

    ## Architecture components
    - **Trigger (`periodic_spire_audit`)**: Automated cron scheduler driving regular surveillance cycles across zero-trust clusters.
    - **Inspection Task (`scan_spire_attestation_metrics`)**: Dockerized Python runtime querying SPIRE Server Prometheus endpoints with network timeout safeguards.
    - **Evaluation Gate (`evaluate_spire_error_threshold`)**: Conditional branching logic isolating operational degradation from normal minting cycles.
    - **Notification Action (`notify_slack_zero_trust_ops`)**: Webhook notification providing immediate incident visibility to identity security engineers.
    - **Manifest Return (`emit_audit_manifest`)**: Standardized compliance record outputting full telemetry state for enterprise archives.

    ## Key capabilities
    - **Zero-Trust Identity Monitoring**: Protects microservice mTLS communication by verifying that SPIRE Agents can continuously mint valid SVID certificates.
    - **Multi-Vector Attestation Audit**: Monitors both workload selectors (e.g., Kubernetes service account, namespace) and node attestors (e.g., AWS IID, GCP II).
    - **Serverless Architectural Footprint**: Executes entirely inside Kestra without requiring dedicated monitoring daemons or cluster sidecars.
    - **Cryptographic Failure Detection**: Identifies upstream CA signing failures, intermediate certificate expirations, and clock drift issues.

    ## What you get
    - Pre-configured surveillance workflow safeguarding zero-trust identity infrastructure from silent attestation stalls
    - Production-grade Docker execution environment with isolated Python libraries and explicit connection error handling
    - Actionable Slack notifications highlighting affected trust domains, failure counts, and immediate remediation steps
    - Machine-readable audit trails verifying continuous zero-trust compliance for regulatory audits

    ## Who it's for
    - Zero-Trust Security Engineers maintaining SPIFFE/SPIRE identity planes across hybrid cloud infrastructure
    - Platform Engineers responsible for service mesh mTLS certificates and service-to-service cryptographic authentication
    - Cloud Infrastructure Architects designing automated identity provisioning pipelines for containerized workloads

    ## Why orchestrate this with Kestra
    - Interrogates internal identity planes without exposing sensitive administrative endpoints to public networks
    - Centralizes enterprise secret storage, protecting alert webhooks and infrastructure credentials in encrypted vaults
    - Maintains immutable execution logs providing long-term forensic audit records for compliance verification
    - Enables automated remediation workflows such as restarting degraded SPIRE Agent daemonsets or rotating trust bundles

    ## Use cases
    - **Workload Selector Drift Detection**: Detect when application pod deployments fail attestation due to unmapped Kubernetes labels or altered service account names.
    - **Node Attestor Certificate Expiration**: Identify node attestation failures caused by expired cloud provider IAM instance profile certificates.
    - **Upstream CA Signing Latency Warning**: Flag delays and timeouts when SPIRE Server delegates SVID signing to external HashiCorp Vault or AWS Private CA backends.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `spire_server_metrics_url` | `STRING` | `http://spire-server.spire.svc.cluster.local:8088/metrics` | Base HTTP URL exposing Prometheus metrics for the SPIRE Server cluster. |
    | `trust_domain` | `STRING` | `prod.enterprise.internal` | Configured SPIFFE trust domain identifier hosting cryptographic workload identities. |
    | `max_attestation_errors` | `INT` | `5` | Maximum allowable workload attestation failures within the audit period before alerting. |
    | `lookback_minutes` | `INT` | `15` | Time window in minutes across which SPIRE SVID minting and attestation metrics are evaluated. |
    | `alert_on_failure` | `BOOL` | `true` | Toggle whether Slack alerts are dispatched upon detecting elevated workload attestation failures. |

    ## Expected outputs
    - `{{ outputs.scan_spire_attestation_metrics.vars.total_attestation_failures }}`: Total number of failed attestation attempts across workloads and nodes.
    - `{{ outputs.scan_spire_attestation_metrics.vars.workload_errors }}`: Count of workload attestation failures caused by unmatched selectors or agent errors.
    - `{{ outputs.scan_spire_attestation_metrics.vars.svid_mint_errors }}`: Number of X.509 SVID generation and signing errors encountered by the server.
    - `{{ outputs.scan_spire_attestation_metrics.vars.is_alerting }}`: Boolean flag indicating whether observed failures breached configured tolerance limits.
    - `{{ outputs.scan_spire_attestation_metrics.vars.audit_timestamp }}`: ISO-8601 UTC timestamp recording exact time of sentinel verification.

    ## Prerequisites
    - SPIRE Server deployed with Prometheus metrics enabled (e.g., `telemetry { Prometheus { port = 8088 } }` in server configuration).
    - Network connectivity allowing Kestra worker pods to reach the SPIRE Server telemetry port across the internal cluster network.
    - Configured Slack incoming webhook with publishing rights to the designated zero-trust alerting channel.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Vault secret containing authenticated webhook endpoint for security alerts.

    ## Quick start
    1. Store your Slack webhook URL in Kestra namespace secrets under `SLACK_WEBHOOK_URL`.
    2. Import this workflow into Kestra under the `company.security` namespace.
    3. Update `spire_server_metrics_url` with your internal SPIRE Server service endpoint.
    4. Execute a manual run to verify metric collection and webhook formatting.
    5. Enable the `periodic_spire_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Telemetry Block Missing**: SPIRE Server does not expose Prometheus metrics by default; ensure the `telemetry` block is configured in `spire-server.conf`.
    - **Trust Domain Selector Mismatches**: Workloads requesting SVIDs outside their registered trust domain fail immediately; verify registration entry trust domains.
    - **Agent Socket Permissions**: Ensure application pods mount the SPIRE Agent UNIX domain socket with correct file system permissions (e.g., GID 1000).
    - **Clock Synchronization Drift**: SPIRE enforces strict timestamp validation on SVID validity periods; ensure NTP synchronization across all cluster worker nodes.

    ## How to extend
    - **Automated Agent Restart Subflow**: Trigger a Kubernetes task to restart SPIRE Agent pods on nodes reporting repeated node attestation failures.
    - **Trust Bundle Expiration Auditing**: Incorporate pre-emptive checks verifying that the root SPIFFE trust bundle certificate is not approaching expiration.
    - **PagerDuty Security Escalation**: Route critical SVID minting failures directly to on-call security architects via PagerDuty incident integration.

