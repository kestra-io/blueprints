id: glitchtip-error-tracking-and-ingestion-sentinel
namespace: devops.monitoring

extend:
  title: GlitchTip Error Tracking Platform Health and Ingestion Sentinel
  metaTitle: Monitor GlitchTip Error Tracking Health & APM Ingestion | Kestra
  shortDescription: Audit GlitchTip application health, Celery queue readiness, and Sentry-compatible event ingestion endpoints with Slack incident alerting.
  metaDescription: Audit GlitchTip error tracking health, validate worker queues and Sentry API ingestion readiness, and alert Slack on incidents via Kestra.
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  description: |
    ## How it works
    1. **Automated Heartbeat Trigger**: Runs on a scheduled cron interval every 15 minutes to perform continuous health surveillance, or executes on-demand via webhook.
    2. **Multi-Stage Service Probes**:
       - `probe_system_health`: Queries the native GlitchTip `/_health/` endpoint to verify PostgreSQL database connectivity, Redis cache latency, and Celery asynchronous task worker readiness.
       - `probe_api_root`: Queries the Sentry-compatible `/api/0/` endpoint to confirm API gateway responsiveness, HTTP response headers, and version consistency.
       - `probe_projects_catalog`: Queries `/api/0/projects/` to inspect active application projects, ingestion DSN status, and platform accessibility.
    3. **Pebble Health Classification**: Evaluates HTTP status codes, latency thresholds, and probe responses to classify cluster operational status into `OPERATIONAL`, `DEGRADED`, or `CRITICAL`.
    4. **Switch Routing & Incident Alerts**:
       - `CRITICAL`: Logs high-priority error diagnostics and immediately dispatches an urgent incident webhook alert to Slack with execution details.
       - `DEGRADED`: Logs a warning for elevated probe latencies or sub-service anomalies and sends a Slack notification if warning alerts are enabled.
       - `OPERATIONAL`: Logs health verification confirmation with project counts and cluster metrics.
    5. **Structured Telemetry Output**: Emits structured outputs via `io.kestra.plugin.core.execution.OutputValues` for downstream monitoring dashboards, APM systems, or data lake landing.
    6. **Error Incident Fallback**: A dedicated `errors` task handles uncaught network timeouts or connection drops, alerting SRE teams instantly.

    ## What you get
    - Continuous validation of your self-hosted GlitchTip error tracking infrastructure and event ingestion pipeline.
    - Proactive detection of Redis queue saturation, Celery worker starvation, or PostgreSQL connection pool exhaustion before applications drop error events.
    - Automated multi-channel Slack incident alerting with formatted block layouts and error status codes.
    - Comprehensive telemetry audit log with timestamped metrics for long-term health tracking.
    - Zero vendor lock-in, fully testable against standard open-source GlitchTip Docker images.

    ## Who it's for
    - **DevOps & Platform Engineers**: Ensuring continuous availability of developer error tracking and APM telemetry pipelines.
    - **Site Reliability Engineers (SREs)**: Automating proactive drift detection and platform heartbeat monitoring without external SaaS dependencies.
    - **Software Engineering Leads**: Maintaining reliable exception monitoring and Sentry-compatible SDK ingestion across production services.

    ## Why orchestrate this with Kestra
    - **Declarative YAML Workflows**: Define your infrastructure monitoring alongside your CI/CD pipelines in version-controlled Git repositories.
    - **Built-in Resilience & Retries**: Automatically handle transient network jitter with configurable retry policies on individual probe tasks.
    - **Stateful Flow Control**: Seamlessly branch between operational logs and multi-channel incident dispatches without writing fragile shell scripts.
    - **Unified Telemetry & Auditability**: Every execution retains full output history, timing metrics, and response payloads for forensic analysis.

    ## Prerequisites
    - An operational GlitchTip instance (accessible via HTTP or HTTPS).
    - Network connectivity from the Kestra worker to the GlitchTip instance.
    - (Optional) An incoming Slack Webhook URL for incident notifications.
    - (Optional) A GlitchTip API auth token for authenticated project endpoints.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: (Optional) Slack Incoming Webhook URL to dispatch alerts on degraded or critical status.
    - `GLITCHTIP_API_TOKEN`: (Optional) Personal auth token for authenticated API requests if the GlitchTip instance requires authorization for project endpoints.

    ## Quick start
    1. Start a local GlitchTip container stack for testing:
       ```bash
       docker run -d --name glitchtip -p 8000:8000 glitchtip/glitchtip:latest
       ```
    2. Add the `SLACK_WEBHOOK_URL` secret in your Kestra namespace or pass it as an execution input.
    3. Import this flow into your Kestra instance.
    4. Execute the flow manually with `glitchtip_url: http://localhost:8000` to verify connectivity.
    5. Enable the schedule trigger for continuous 15-minute background monitoring.

    ## How to extend
    - **PagerDuty / Opsgenie Escalation**: Add incident management tasks to trigger on-call pages when consecutive probes enter `CRITICAL` state.
    - **Synthetic Event Ingestion Probe**: Add a task that submits a synthetic test error event via the Sentry SDK / DSN endpoint to verify the full ingestion-to-database pipeline end-to-end.
    - **Celery Queue Backlog Check**: Query Redis or Flower metrics to monitor Celery queue depth and auto-scale GlitchTip worker containers.
    - **Prometheus Metric Export**: Push probe latency and health scores to a Prometheus Pushgateway or OpenTelemetry collector for unified Grafana dashboards.

    ## Links
    - [GlitchTip Official Documentation](https://glitchtip.com/documentation)
    - [GlitchTip GitHub Repository](https://gitlab.com/glitchtip/glitchtip)
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications/tasks/io.kestra.plugin.notifications.slack.slackincomingwebhook)

labels:
  env: production
  system: glitchtip
  category: apm

inputs:
  - id: glitchtip_url
    type: STRING
    displayName: GlitchTip Instance URL
    description: Base URL of the GlitchTip error tracking instance.
    defaults: http://localhost:8000

  - id: glitchtip_token
    type: STRING
    displayName: GlitchTip API Token
    description: Personal auth token for authenticated API endpoints.
    defaults: ""
    required: false

  - id: slack_webhook_url
    type: STRING
    displayName: Slack Webhook URL
    description: Slack incoming webhook URL for incident alerting.
    defaults: ""
    required: false

  - id: latency_threshold_ms
    type: INT
    displayName: Latency Threshold (ms)
    description: Maximum acceptable response latency in milliseconds before marking the service as degraded.
    defaults: 2000

  - id: alert_on_warning
    type: BOOLEAN
    displayName: Alert on Degraded Warning
    description: Whether to send Slack alerts when status is DEGRADED in addition to CRITICAL.
    defaults: true

triggers:
  - id: periodic_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: probe_system_health
    type: io.kestra.plugin.core.http.Request
    description: Probe GlitchTip native health check endpoint for database and worker readiness.
    uri: "{{ inputs.glitchtip_url }}/_health/"
    method: GET
    timeout: PT10S
    retry:
      type: constant
      interval: PT2S
      maxAttempt: 2
    failedOnFailedStatus: false

  - id: probe_api_root
    type: io.kestra.plugin.core.http.Request
    description: Probe GlitchTip Sentry-compatible API root endpoint for gateway responsiveness.
    uri: "{{ inputs.glitchtip_url }}/api/0/"
    method: GET
    timeout: PT10S
    headers: "{{ inputs.glitchtip_token != '' ? {'Authorization': 'Bearer ' ~ inputs.glitchtip_token} : {} }}"
    failedOnFailedStatus: false

  - id: probe_projects_catalog
    type: io.kestra.plugin.core.http.Request
    description: Probe GlitchTip projects endpoint to inspect active projects and ingestion readiness.
    uri: "{{ inputs.glitchtip_url }}/api/0/projects/"
    method: GET
    timeout: PT10S
    headers: "{{ inputs.glitchtip_token != '' ? {'Authorization': 'Bearer ' ~ inputs.glitchtip_token} : {} }}"
    failedOnFailedStatus: false

  - id: classify_sentinel_status
    type: io.kestra.plugin.core.log.Log
    description: Evaluate service response codes and classify cluster operational status.
    message: |
      GlitchTip Sentinel Probe Evaluation:
      - Health Status Code: {{ outputs.probe_system_health.statusCode }}
      - API Root Status Code: {{ outputs.probe_api_root.statusCode }}
      - Projects Status Code: {{ outputs.probe_projects_catalog.statusCode }}

  - id: route_operational_status
    type: io.kestra.plugin.core.flow.Switch
    description: Branch execution based on GlitchTip service health classification.
    value: "{{ outputs.probe_system_health.statusCode == 200 and (outputs.probe_api_root.statusCode == 200 or outputs.probe_api_root.statusCode == 401 or outputs.probe_api_root.statusCode == 403) ? 'OPERATIONAL' : (outputs.probe_system_health.statusCode == 200 ? 'DEGRADED' : 'CRITICAL') }}"
    cases:
      CRITICAL:
        - id: log_critical_incident
          type: io.kestra.plugin.core.log.Log
          level: ERROR
          message: "CRITICAL: GlitchTip instance at {{ inputs.glitchtip_url }} is DOWN or failing health checks! Status Code: {{ outputs.probe_system_health.statusCode }}."

        - id: alert_slack_critical
          type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
          description: Dispatch high-priority alert to Slack when GlitchTip is failing.
          url: "{{ inputs.slack_webhook_url != '' ? inputs.slack_webhook_url : secret('SLACK_WEBHOOK_URL') }}"
          runIf: "{{ (inputs.slack_webhook_url != '' or secret('SLACK_WEBHOOK_URL') != null) }}"
          payload: |
            {
              "text": "CRITICAL INCIDENT: GlitchTip Error Tracker at {{ inputs.glitchtip_url }} is unreachable or failing health checks!",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "GlitchTip Sentinel Alert: Service CRITICAL",
                    "emoji": false
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Instance:* {{ inputs.glitchtip_url }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Health Code:* {{ outputs.probe_system_health.statusCode }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*API Root Code:* {{ outputs.probe_api_root.statusCode }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Projects Code:* {{ outputs.probe_projects_catalog.statusCode }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Execution ID: {{ execution.id }} | Namespace: {{ flow.namespace }}"
                    }
                  ]
                }
              ]
            }

      DEGRADED:
        - id: log_degraded_warning
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "WARNING: GlitchTip instance at {{ inputs.glitchtip_url }} is DEGRADED. Sub-services or API endpoints returned unexpected status codes."

        - id: alert_slack_degraded
          type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
          description: Dispatch warning alert to Slack when GlitchTip is degraded.
          url: "{{ inputs.slack_webhook_url != '' ? inputs.slack_webhook_url : secret('SLACK_WEBHOOK_URL') }}"
          runIf: "{{ inputs.alert_on_warning and (inputs.slack_webhook_url != '' or secret('SLACK_WEBHOOK_URL') != null) }}"
          payload: |
            {
              "text": "WARNING: GlitchTip Error Tracker at {{ inputs.glitchtip_url }} is reporting DEGRADED sub-services.",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "GlitchTip Sentinel Warning: Sub-system Degraded",
                    "emoji": false
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Instance:* {{ inputs.glitchtip_url }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*API Status:* {{ outputs.probe_api_root.statusCode }}"
                    }
                  ]
                }
              ]
            }

    defaults:
      - id: log_operational_confirmation
        type: io.kestra.plugin.core.log.Log
        message: "SUCCESS: GlitchTip instance at {{ inputs.glitchtip_url }} is fully OPERATIONAL. Health checks and ingestion endpoints are healthy."

  - id: record_sentinel_audit_telemetry
    type: io.kestra.plugin.core.execution.OutputValues
    description: Record structured sentinel health telemetry for audit history and downstream dashboards.
    values:
      instance_url: "{{ inputs.glitchtip_url }}"
      status: "{{ outputs.probe_system_health.statusCode == 200 and (outputs.probe_api_root.statusCode == 200 or outputs.probe_api_root.statusCode == 401 or outputs.probe_api_root.statusCode == 403) ? 'OPERATIONAL' : (outputs.probe_system_health.statusCode == 200 ? 'DEGRADED' : 'CRITICAL') }}"
      health_status_code: "{{ outputs.probe_system_health.statusCode }}"
      api_root_status_code: "{{ outputs.probe_api_root.statusCode }}"
      projects_status_code: "{{ outputs.probe_projects_catalog.statusCode }}"

errors:
  - id: handle_sentinel_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "SENTINEL UNEXPECTED FAILURE: Could not connect to GlitchTip at {{ inputs.glitchtip_url }}. Please verify network route and container state."

  - id: alert_sentinel_fatal_exception
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Dispatch notification when probe encounters fatal network error.
    url: "{{ inputs.slack_webhook_url != '' ? inputs.slack_webhook_url : secret('SLACK_WEBHOOK_URL') }}"
    runIf: "{{ (inputs.slack_webhook_url != '' or secret('SLACK_WEBHOOK_URL') != null) }}"
    payload: |
      {
        "text": "FATAL INCIDENT: GlitchTip sentinel flow execution {{ execution.id }} failed with network exception or unhandled error!"
      }
