id: esign-envelope-monitor
namespace: company.team

description: |
  Signature requests stall quietly, an envelope is sent, half the signers open it, and nobody
  notices the reminder never went out until the quarter closes. A keyed webhook accepts the e-sign
  platform callback carrying envelope_id, status and signers, a disabled daily aging sweep stands
  ready as the fallback net, an authenticated GET pulls the current envelope list, and a fixture
  of six envelopes stands in when the API is unreachable. A python pass ages every sent or
  delivered envelope against stall_days and merges the callback so a completed envelope never
  earns a nudge. Past the threshold the flow files one GitHub issue, posts one Slack summary and
  loops a reminder POST per stalled envelope, otherwise it logs the quiet verdict. The verdict,
  the stalled count, the stalled envelope list and the oldest age are published as typed outputs,
  and any failure escalates to Slack.

triggers:
  - id: envelope_status_callback
    type: io.kestra.plugin.core.trigger.Webhook
    description: The e-sign platform POSTs envelope_id, status and signers here on every status change so the aging check reruns the moment a signer acts.
    key: "{{ secret('ESIGN_CALLBACK_WEBHOOK_KEY') }}"
  - id: daily_aging_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled 06:00 UTC sweep across every open envelope, held off until an operator confirms the API token and switches it on.
    cron: "0 6 * * *"
    disabled: true

inputs:
  - id: stall_days
    type: INT
    defaults: 5
    description: How many days a sent or delivered envelope may sit untouched before it counts as stalled and earns a reminder.

tasks:
  # --- 1. envelope workspace ---
  - id: envelope_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the fixture, the API response and the aging analysis all read the same files during the run.
    tasks:
      # --- 2. envelope fixture ---
      - id: write_envelopes_fixture
        type: io.kestra.plugin.scripts.shell.Commands
        description: Writes envelopes.json from a heredoc of six envelopes dated back from today with date -u, two open past the threshold, one delivered three days ago and three already terminal.
        commands:
          - |
            set -eu
            cat > envelopes.json <<JSON
            {
              "as_of": "$(date -u +%FT%TZ)",
              "envelopes": [
                {"envelope_id": "env-7Q41K", "subject": "Vendor MSA FY27", "status": "sent", "sent_at": "$(date -u -d '-7 days' +%FT%TZ)", "signers": ["dana.lee@example.com", "omar.haddad@example.com"]},
                {"envelope_id": "env-7Q42M", "subject": "Mutual NDA Bluepeak", "status": "delivered", "sent_at": "$(date -u -d '-9 days' +%FT%TZ)", "delivered_at": "$(date -u -d '-3 days' +%FT%TZ)", "signers": ["priya.nair@example.com"]},
                {"envelope_id": "env-7Q43P", "subject": "Offer letter K Novak", "status": "completed", "sent_at": "$(date -u -d '-14 days' +%FT%TZ)", "completed_at": "$(date -u -d '-2 days' +%FT%TZ)", "signers": ["kate.novak@example.com"]},
                {"envelope_id": "env-7Q44R", "subject": "Discount approval form", "status": "declined", "sent_at": "$(date -u -d '-6 days' +%FT%TZ)", "declined_at": "$(date -u -d '-4 days' +%FT%TZ)", "signers": ["rowan.albright@example.com"]},
                {"envelope_id": "env-7Q45S", "subject": "Event vendor agreement", "status": "voided", "sent_at": "$(date -u -d '-11 days' +%FT%TZ)", "voided_at": "$(date -u -d '-8 days' +%FT%TZ)", "signers": ["noor.farouk@example.com"]},
                {"envelope_id": "env-7Q46T", "subject": "Renewal order form", "status": "sent", "sent_at": "$(date -u -d '-12 days' +%FT%TZ)", "signers": ["mika.tanaka@example.com", "luis.garcia@example.com", "selam.oyelaran@example.com"]}
              ]
            }
            JSON
            echo "wrote $(wc -c < envelopes.json) bytes of envelope status"

      # --- 3. envelope status api ---
      - id: fetch_envelope_status
        type: io.kestra.plugin.core.http.Request
        description: GET the open envelope list with a Bearer token and absorb a non 2xx answer, so an API problem hands the decision to the fixture instead of failing the aging check.
        method: GET
        uri: "https://api.esign.example.com/v1/envelopes?expanded=signers&limit=100"
        headers:
          Authorization: "Bearer {{ secret('ESIGN_API_TOKEN') }}"
          Accept: application/json
        options:
          allowFailed: true
          followRedirects: true
        timeout: PT30S

      # --- 4. aging analysis ---
      - id: assess_envelopes
        type: io.kestra.plugin.scripts.python.Script
        description: Read the envelope list from the response or the fixture, age every sent or delivered envelope against stall_days, merge the callback status, and emit verdict, stalled_count, envelopes and oldest_days through the outputs protocol.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          STALL_DAYS: "{{ inputs.stall_days }}"
          ESIGN_BODY: "{{ (outputs.fetch_envelope_status.body ?? '') | json }}"
          CALLBACK_ENVELOPE_ID: "{{ trigger is not defined ? '' : ((trigger.body ?? {}).envelope_id ?? '') }}"
          CALLBACK_STATUS: "{{ trigger is not defined ? '' : ((trigger.body ?? {}).status ?? '') }}"
          CALLBACK_SIGNERS: "{{ trigger is not defined ? '[]' : ((trigger.body.signers ?? []) | json) }}"
        script: |
          import json
          import os
          from datetime import datetime, timezone

          FIXTURE = "envelopes.json"
          OPEN_STATUSES = ("sent", "delivered")
          KNOWN_STATUSES = OPEN_STATUSES + ("completed", "declined", "voided", "corrected")

          def env_int(name, fallback):
              try:
                  value = int(str(os.environ.get(name, "")).strip())
              except ValueError:
                  return fallback
              return value if value > 0 else fallback

          def loads_payload(raw):
              if raw is None or not str(raw).strip():
                  return None
              try:
                  parsed = json.loads(str(raw).strip())
                  if isinstance(parsed, str):
                      parsed = json.loads(parsed)
              except ValueError:
                  return None
              return parsed if isinstance(parsed, (dict, list)) else None

          def as_list(value):
              if isinstance(value, list):
                  return value
              if isinstance(value, str):
                  decoded = loads_payload(value)
                  if isinstance(decoded, list):
                      return decoded
                  return [value.strip()] if value.strip() else []
              return []

          def signers_of(row):
              names = []
              for entry in as_list(row.get("signers")):
                  text = str(entry.get("email") or entry.get("name") or "") if isinstance(entry, dict) else str(entry)
                  if text.strip():
                      names.append(text.strip())
              try:
                  declared = int(row.get("signer_count"))
              except (TypeError, ValueError):
                  declared = 0
              while len(names) < declared:
                  names.append("signer-%d" % (len(names) + 1))
              return names

          def parse_moment(value):
              if isinstance(value, (int, float)) and not isinstance(value, bool):
                  try:
                      return datetime.fromtimestamp(float(value), tz=timezone.utc)
                  except (OverflowError, OSError, ValueError):
                      return None
              text = str(value).strip() if value is not None else ""
              if not text:
                  return None
              try:
                  moment = datetime.fromisoformat(text[:-1] + "+00:00" if text.endswith("Z") else text)
              except ValueError:
                  return None
              return moment if moment.tzinfo else moment.replace(tzinfo=timezone.utc)

          def extract_rows(document):
              rows = document.get("envelopes") if isinstance(document, dict) else document
              if not isinstance(rows, list):
                  return None
              records = []
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  envelope_id = str(row.get("envelope_id") or row.get("id") or "").strip()
                  status = str(row.get("status") or "").strip().lower()
                  if not envelope_id or not status:
                      continue
                  subject = str(row.get("subject") or row.get("title") or "").strip() or "untitled envelope"
                  moment = next((m for m in (parse_moment(row.get(k)) for k in
                                ("delivered_at", "sent_at", "created_at", "status_changed_at")) if m), None)
                  records.append({"envelope_id": envelope_id, "subject": subject,
                                  "status": status, "signers": signers_of(row),
                                  "moment": moment, "raw_days": row.get("days_open")})
              return records or None

          stall_days = env_int("STALL_DAYS", 5)
          now = datetime.now(timezone.utc)
          document = loads_payload(os.environ.get("ESIGN_BODY"))
          records = extract_rows(document) if document is not None else None
          if not records:
              try:
                  with open(FIXTURE, "r", encoding="utf-8") as handle:
                      records = extract_rows(loads_payload(handle.read()))
              except OSError:
                  records = None
          callback_id = (os.environ.get("CALLBACK_ENVELOPE_ID") or "").strip()
          callback_status = str(os.environ.get("CALLBACK_STATUS") or "").strip().lower()
          callback_signers = as_list(os.environ.get("CALLBACK_SIGNERS"))
          if callback_id and records:
              for record in records:
                  if record["envelope_id"] != callback_id:
                      continue
                  if callback_status in KNOWN_STATUSES:
                      record["status"] = callback_status
                  if callback_signers and not record["signers"]:
                      record["signers"] = [str(s).strip() for s in callback_signers if str(s).strip()]
                  break
          stalled = []
          open_count = 0
          skipped = 0
          for record in records or []:
              if record["status"] not in OPEN_STATUSES:
                  continue
              open_count += 1
              if record["moment"] is not None:
                  days = max(0, (now - record["moment"]).days)
              else:
                  try:
                      days = max(0, int(record["raw_days"]))
                  except (TypeError, ValueError):
                      skipped += 1
                      continue
              record["days_open"] = days
              if days > stall_days:
                  stalled.append(record)

          stalled.sort(key=lambda r: (-r["days_open"], r["envelope_id"]))
          envelopes = [{"envelope_id": r["envelope_id"], "subject": r["subject"],
                        "status": r["status"], "days_open": r["days_open"],
                        "signer_count": len(r["signers"]), "signers": r["signers"]}
                       for r in stalled]

          verdict = "NO_ENVELOPE_DATA" if not records else ("ACTION_REQUIRED" if envelopes else "ALL_CLEAR")
          stalled_count = len(envelopes)
          oldest_days = envelopes[0]["days_open"] if envelopes else 0

          print("open=%d stalled=%d oldest=%d skipped=%d callback=%s verdict=%s" % (
              open_count, stalled_count, oldest_days, skipped, callback_id or "none", verdict))
          print("::" + json.dumps({"outputs": {
              "verdict": verdict, "stalled_count": stalled_count,
              "envelopes": envelopes, "oldest_days": oldest_days}}) + "::")

  # --- 5. stall gate and escalation ---
  - id: stall_gate
    type: io.kestra.plugin.core.flow.If
    description: Branch on the stalled count so a backlog files the aging ticket, pings the channel and queues one reminder per envelope, while a healthy book is recorded without waking anyone.
    condition: "{{ outputs.assess_envelopes.vars.stalled_count > 0 }}"
    then:
      # --- 6. aging ticket ---
      - id: open_aging_issue
        type: io.kestra.plugin.github.issues.Create
        description: File one aging ticket listing every stalled envelope with its age, subject and waiting signers, so the follow-up work has a single home.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: your-org/esign-ops
        title: "E-sign aging - {{ outputs.assess_envelopes.vars.stalled_count }} stalled envelope(s), oldest {{ outputs.assess_envelopes.vars.oldest_days }} days"
        body: |
          ## Stalled e-sign envelopes

          **{{ outputs.assess_envelopes.vars.stalled_count }}** envelope(s) have been open for more than {{ inputs.stall_days }} days. The oldest has waited **{{ outputs.assess_envelopes.vars.oldest_days }}** days.

          {% for e in outputs.assess_envelopes.vars.envelopes %}
          - {{ e.envelope_id }} - {{ e.status }} - {{ e.days_open }} days - {{ e.signer_count }} signer(s) waiting - {{ e.subject }}
          {% endfor %}

          Verdict **{{ outputs.assess_envelopes.vars.verdict }}** from {{ flow.id }} execution {{ execution.id }}.

          Post the platform reminder, or void and reissue, for every line above, then close this issue.
        labels:
          - esign
          - aging

      # --- 7. channel alert ---
      - id: alert_stalled
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Tell the ops channel the stalled count, the oldest age and every waiting envelope id, so nobody has to open the ticket to see the damage.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "E-sign aging - {{ outputs.assess_envelopes.vars.verdict }}, {{ outputs.assess_envelopes.vars.stalled_count }} envelope(s) past {{ inputs.stall_days }} days, oldest {{ outputs.assess_envelopes.vars.oldest_days }} days. {% for e in outputs.assess_envelopes.vars.envelopes %}{{ e.envelope_id }} ({{ e.status }}, {{ e.days_open }}d, {{ e.signer_count }} signer(s)) {% endfor %}Aging ticket filed, reminders queued. Execution {{ execution.id }}."}

      # --- 8. per envelope reminders ---
      - id: nudge_each_signer
        type: io.kestra.plugin.core.flow.Loop
        description: Walk the stalled envelopes one at a time and post a reminder against each one, so every waiting signer is nudged on their own envelope instead of one generic blast.
        values: "{{ outputs.assess_envelopes.vars.envelopes }}"
        concurrencyLimit: 1
        tasks:
          - id: send_envelope_nudge
            type: io.kestra.plugin.core.http.Request
            description: POST a reminder for a single stalled envelope with the same Bearer token, absorbing a rejected reminder so the ticket and the channel summary still carry the state.
            method: POST
            uri: "https://api.esign.example.com/v1/envelopes/{{ item.value.envelope_id }}/reminders"
            headers:
              Authorization: "Bearer {{ secret('ESIGN_API_TOKEN') }}"
              Content-Type: application/json
            body: '{"envelope_id": "{{ item.value.envelope_id }}", "days_open": {{ item.value.days_open }}, "note": "Reminder from execution {{ execution.id }}"}'
            options:
              allowFailed: true
            timeout: PT30S
    else:
      # --- 9. healthy book ---
      - id: log_no_stall
        type: io.kestra.plugin.core.log.Log
        description: Record the quiet outcome so a run with nothing past the threshold still leaves evidence that the aging check ran.
        message: "E-sign aging - verdict {{ outputs.assess_envelopes.vars.verdict }}, stalled_count {{ outputs.assess_envelopes.vars.stalled_count }}, oldest_days {{ outputs.assess_envelopes.vars.oldest_days }}, no reminder sent."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    description: ACTION_REQUIRED when at least one envelope is past the threshold, ALL_CLEAR when every open envelope is inside it, NO_ENVELOPE_DATA when nothing readable came back.
    value: "{{ outputs.assess_envelopes.vars.verdict }}"
  - id: stalled_count
    type: INT
    description: Number of sent or delivered envelopes open for more than stall_days, for example 2 against the bundled fixture ages of seven and twelve days.
    value: "{{ outputs.assess_envelopes.vars.stalled_count }}"
  - id: envelopes
    type: ARRAY
    description: 'Stalled envelopes as objects, oldest first, for example [{"envelope_id": "env-7Q46T", "subject": "Renewal order form", "status": "sent", "days_open": 12, "signer_count": 3, "signers": ["mika.tanaka@example.com"]}].'
    value: "{{ outputs.assess_envelopes.vars.envelopes | toJson }}"
  - id: oldest_days
    type: INT
    description: Age in days of the oldest stalled envelope, zero when the verdict is ALL_CLEAR or NO_ENVELOPE_DATA.
    value: "{{ outputs.assess_envelopes.vars.oldest_days }}"

extend:
  title: Nudge Signers When an E-Sign Envelope Sits Too Long
  metaTitle: E-Sign Envelope Aging and Nudge Monitor
  shortDescription: Age open envelopes from a status callback or a daily sweep, then file one aging ticket, alert Slack and post a reminder per stalled envelope.
  metaDescription: Age open e-sign envelopes against a stall threshold, then file one aging ticket, alert Slack and post a reminder for every envelope left waiting.
  description: |
    ## How it works
    1. `envelope_status_callback` (`io.kestra.plugin.core.trigger.Webhook`, keyed with the `ESIGN_CALLBACK_WEBHOOK_KEY` secret) accepts the e-sign platform POST carrying `envelope_id`, `status` and `signers`, so the aging check reruns the moment a signer acts. `daily_aging_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * *`) is the daily net over the whole book and ships `disabled: true` until an operator turns it on.
    2. `envelope_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared filesystem so the fixture, the API response and the analysis all see the same files.
    3. `write_envelopes_fixture` (`io.kestra.plugin.scripts.shell.Commands`) writes `envelopes.json` from a heredoc of six envelopes dated back from today with `date -u`, two still open past the threshold at seven and twelve days, one delivered only three days ago, and three already completed, declined or voided.
    4. `fetch_envelope_status` (`io.kestra.plugin.core.http.Request`) GETs `https://api.esign.example.com/v1/envelopes?expanded=signers&limit=100` with `Authorization: Bearer {{ secret('ESIGN_API_TOKEN') }}`, and `options.allowFailed` lets a 4xx or 5xx answer through so the check continues on the fixture instead of dying.
    5. `assess_envelopes` (`io.kestra.plugin.scripts.python.Script`) prefers the response body and falls back to `envelopes.json`, ages every `sent` or `delivered` envelope from `delivered_at` then `sent_at` against `stall_days`, and overlays the callback status so an envelope the platform already marked completed never earns a nudge. It prints `verdict`, `stalled_count`, `envelopes` and `oldest_days` as a single `::{"outputs": ...}::` line and reports `NO_ENVELOPE_DATA` when nothing readable came back.
    6. `stall_gate` (`io.kestra.plugin.core.flow.If`) branches on `stalled_count > 0`. Above zero, `open_aging_issue` (`io.kestra.plugin.github.issues.Create`) files one labeled ticket with the whole stalled list, `alert_stalled` posts the counts and ids to Slack, and `nudge_each_signer` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) walks the list with `send_envelope_nudge` (`io.kestra.plugin.core.http.Request`) POSTing one reminder per envelope. At zero, `log_no_stall` records the quiet outcome.
    7. The flow level `errors` handler (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) reports any failure with the execution id, because a silent aging check looks exactly like a healthy pipeline.

    ## What you get
    - `verdict` (STRING): `ACTION_REQUIRED` when an envelope is past the threshold, `ALL_CLEAR` when every open envelope is inside it, `NO_ENVELOPE_DATA` when the response and the fixture are both unreadable.
    - `stalled_count` (INT): envelopes open for more than `stall_days`, zero on a healthy book.
    - `envelopes` (ARRAY): one object per stalled envelope with `envelope_id`, `subject`, `status`, `days_open`, `signer_count` and `signers`, sorted oldest first.
    - `oldest_days` (INT): age of the oldest stalled envelope, zero when nothing is stalled.

    ## Who it's for
    - Revenue operations and legal operations teams who own signature deadlines and find out about a stuck envelope only when the deal slips.
    - Sales managers who need proof that every open request is being chased, not a shared mailbox nobody watches.

    ## Why orchestrate this with Kestra
    An e-sign platform sends its own reminder schedule and then stops talking about it, so the team sees a green integration while an envelope ages for twelve days. Kestra gives the check a keyed webhook for live callbacks, a disabled daily sweep as the net for envelopes nobody touched, an authenticated status call that degrades to a fixture instead of failing, and a gate that separates a real backlog from a quiet morning. The loop turns one parse into one reminder per envelope, GitHub and Slack carry the escalation, and the verdict, the count and the oldest age are typed outputs a dashboard or a downstream approval can read without scraping logs.

    ## Prerequisites
    - Python 3 and a shell on the Kestra worker with GNU `date`, the calculation uses only `json`, `os` and `datetime`.
    - An e-sign platform API token that can read the envelope list and post reminders, plus a stub of that endpoint while you trial the flow.
    - A Slack incoming webhook for the aging summary and for failure alerts.
    - A GitHub token that can open issues in `your-org/esign-ops`, with classic PAT scope `repo` or fine-grained **Issues: write**.

    ### Secrets
    - `ESIGN_CALLBACK_WEBHOOK_KEY`: key segment guarding the callback webhook URL, anyone holding it can start an aging check.
    - `ESIGN_API_TOKEN`: bearer token sent to the envelope list and reminder endpoints.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for the aging summary and for failure alerts.
    - `GITHUB_TOKEN`: token used to open the aging ticket.

    ## Quick start
    1. Add the four secrets to your Kestra namespace and import the flow.
    2. Run once with the default inputs. The fixture puts `env-7Q41K` at seven days and `env-7Q46T` at twelve, so the run reports `verdict: ACTION_REQUIRED`, `stalled_count: 2` and `oldest_days: 12`, files the ticket, posts the summary and queues two reminders.
    3. Raise `stall_days` to 14 and rerun to watch the same fixture degrade to `verdict: ALL_CLEAR` with `stalled_count: 0` and the gate take the log branch.
    4. Empty the heredoc rows inside `write_envelopes_fixture` and point the flow at a stub that returns a 500, then run again to see `NO_ENVELOPE_DATA` recorded by the gate.
    5. Trigger `envelope_status_callback` at `/api/v1/{tenant}/executions/webhook/{namespace}/esign-envelope-monitor/{ESIGN_CALLBACK_WEBHOOK_KEY}` with `{"envelope_id": "env-7Q41K", "status": "completed", "signers": ["dana.lee@example.com"]}` to watch the callback drop that envelope out of the stalled list, then enable `daily_aging_sweep` once the token is in place.

    ## How to extend
    - Replace the heredoc fixture with a `io.kestra.plugin.core.http.Request` that pulls yesterday's envelope export from your contract store, keeping the fixture as the offline fallback.
    - Add a second input for a per workspace threshold, or split urgent envelopes from routine ones with `io.kestra.plugin.core.flow.Switch` on `signer_count`.
    - Fan the reminder loop out with `io.kestra.plugin.core.flow.ParallelEach` when a single sweep covers hundreds of envelopes and the platform rate limit allows it.
    - Persist the stalled list for trend reporting with `io.kestra.plugin.jdbc.postgresql.Queries` or ship the snapshot to `io.kestra.plugin.aws.s3.Upload`.

    ## Links
    - [Kestra workflow triggers](https://kestra.io/docs/workflow-triggers)
    - [Kestra HTTP request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
  tags: [Business]
  subTags: [esign, envelopes, reminders, monitoring]
  ee: false
  demo: false
