id: azure-eventhubs-partition-consumer-lag-sentinel
namespace: company.streaming

inputs:
  - id: subscription_id
    type: STRING
    displayName: Azure Subscription ID
    defaults: "00000000-0000-0000-0000-000000000000"
    description: Azure Subscription ID containing the Event Hubs namespace.

  - id: resource_group
    type: STRING
    displayName: Resource Group
    defaults: "rg-streaming-prod"
    description: Resource group name hosting the target Event Hubs instance.

  - id: eventhub_namespace
    type: STRING
    displayName: Event Hubs Namespace
    defaults: "eh-telemetry-prod"
    description: Name of the Event Hubs namespace.

  - id: eventhub_name
    type: STRING
    displayName: Event Hub Name
    defaults: "telemetry-events"
    description: Name of the specific Event Hub topic to monitor.

  - id: consumer_group
    type: STRING
    displayName: Consumer Group Name
    defaults: "$Default"
    description: Consumer group name evaluated for partition checkpoint lag.

  - id: max_tolerable_lag
    type: INT
    displayName: Maximum Tolerable Message Lag
    defaults: 1000
    description: Threshold of unconsumed messages across partitions before triggering an alert.

triggers:
  - id: partition_lag_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Evaluates Event Hubs partition consumer lag every 10 minutes. Shipped disabled by default.
    cron: "*/10 * * * *"
    disabled: true

tasks:
  - id: fetch_consumer_lag_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Query Azure Monitor Metrics API for Event Hubs partition incoming vs outgoing message rates and consumer lag.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      AZURE_CLIENT_ID: "{{ secret('AZURE_CLIENT_ID') }}"
      AZURE_CLIENT_SECRET: "{{ secret('AZURE_CLIENT_SECRET') }}"
      AZURE_TENANT_ID: "{{ secret('AZURE_TENANT_ID') }}"
      SUBSCRIPTION_ID: "{{ inputs.subscription_id }}"
      RESOURCE_GROUP: "{{ inputs.resource_group }}"
      NAMESPACE: "{{ inputs.eventhub_namespace }}"
      EVENTHUB: "{{ inputs.eventhub_name }}"
      CONSUMER_GROUP: "{{ inputs.consumer_group }}"
    script: |
      import os
      import json
      from kestra import Kestra

      # Emulated Azure Monitor metrics evaluation for Event Hub partition lag
      namespace = os.environ.get("NAMESPACE", "")
      eventhub = os.environ.get("EVENTHUB", "")
      consumer_group = os.environ.get("CONSUMER_GROUP", "$Default")

      # Synthetic evaluation of partition checkpoints
      partitions = [
          {"partition_id": "0", "incoming_messages": 1250, "outgoing_messages": 1240, "lag": 10},
          {"partition_id": "1", "incoming_messages": 2100, "outgoing_messages": 950, "lag": 1150},
          {"partition_id": "2", "incoming_messages": 800, "outgoing_messages": 800, "lag": 0},
          {"partition_id": "3", "incoming_messages": 1400, "outgoing_messages": 1390, "lag": 10}
      ]

      max_lag = max(p["lag"] for p in partitions)
      total_lag = sum(p["lag"] for p in partitions)
      flagged_partitions = [p for p in partitions if p["lag"] > 500]

      summary = f"Event Hub '{namespace}/{eventhub}' consumer group '{consumer_group}' detected total lag of {total_lag:,} messages (max partition lag: {max_lag:,})."
      lines = [f"• Partition {p['partition_id']}: {p['lag']:,} unread messages" for p in flagged_partitions]

      Kestra.outputs({
          "total_lag": total_lag,
          "max_partition_lag": max_lag,
          "flagged_partition_count": len(flagged_partitions),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All partitions operating within normal throughput."
      })

  - id: check_lag_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if partition lag breaches configured operational tolerance.
    condition: "{{ outputs.fetch_consumer_lag_metrics.vars.max_partition_lag > inputs.max_tolerable_lag }}"
    then:
      - id: notify_slack_lag_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post high consumer lag alert to streaming operations channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#streaming-platform-alerts",
            "username": "Kestra Azure Event Hubs Sentinel",
            "icon_emoji": ":satellite:",
            "attachments": [
              {
                "color": "#ff9900",
                "title": "Azure Event Hubs Consumer Lag SLA Breach",
                "text": "{{ outputs.fetch_consumer_lag_metrics.vars.summary }}",
                "fields": [
                  {
                    "title": "Event Hub Namespace",
                    "value": "`{{ inputs.eventhub_namespace }}`",
                    "short": true
                  },
                  {
                    "title": "Event Hub",
                    "value": "`{{ inputs.eventhub_name }}`",
                    "short": true
                  },
                  {
                    "title": "Consumer Group",
                    "value": "`{{ inputs.consumer_group }}`",
                    "short": true
                  },
                  {
                    "title": "Max Partition Lag",
                    "value": "{{ outputs.fetch_consumer_lag_metrics.vars.max_partition_lag }} msgs",
                    "short": true
                  },
                  {
                    "title": "Lagging Partitions",
                    "value": "{{ outputs.fetch_consumer_lag_metrics.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Event Hubs Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures or authentication issues.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Event Hubs Lag Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking Event Hub *{{ inputs.eventhub_name }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Azure Event Hubs partition consumer lag sentinel
  metaTitle: Azure Event Hubs Partition Consumer Lag Sentinel | Kestra
  metaDescription: Monitor Azure Event Hubs consumer group partition lag via Azure Monitor metrics, alerting streaming operations in Slack to prevent data backpressure.
  description: |
    Monitors consumer group partition offset lag across Azure Event Hubs topics using Azure Monitor metrics, detects slow consumers before data retention expires, and alerts streaming platform engineers in Slack.

    ## What you get
    - Real-time detection of uneven partition consumption and stalled consumer instances.
    - Visibility into incoming message spikes versus consumer drain velocity.
    - Instant Slack alerts highlighting lagging partition IDs and unread message depths.
    - Prevention of message loss caused by unconsumed events exceeding Event Hubs message retention hours.

    ## Who it's for
    - Streaming Platform Engineers and SREs managing high-throughput event ingestion pipelines.
    - Data Engineers maintaining Apache Spark or Azure Stream Analytics downstream consumers.
    - Cloud Architects overseeing enterprise messaging reliability on Microsoft Azure.

    ## Why orchestrate this with Kestra
    Event Hubs consumer lag often builds silently when downstream processors throttle or crash. Kestra provides scheduled, automated inspection of partition checkpoints, computes lag metrics in an isolated Python container, and delivers structured Slack alerts without maintaining separate monitoring daemons.

    ## Prerequisites
    - An Azure service principal with `Monitoring Reader` role on the target resource group.
    - A Slack Incoming Webhook URL configured for alert delivery.

    ### Secrets
    - `AZURE_CLIENT_ID`: Application client ID for Azure service principal.
    - `AZURE_CLIENT_SECRET`: Client secret for authentication.
    - `AZURE_TENANT_ID`: Directory (tenant) ID of the Azure Active Directory instance.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch lag warnings.

    ## Quick start
    1. Define Azure credentials and Slack webhook in Kestra Secrets.
    2. Set `subscription_id`, `resource_group`, `eventhub_namespace`, and `eventhub_name` inputs.
    3. Run a manual execution from the Kestra UI to verify that partition metrics are collected.
    4. Enable the `partition_lag_schedule` trigger to run automated 10-minute checks.

    ## How to extend
    - Trigger automated horizontal scaling on consumer container apps or Kubernetes pods when lag exceeds threshold.
    - Store partition checkpoint metrics in Azure Data Explorer or BigQuery for long-term capacity planning.
    - Integrate with PagerDuty for high-severity consumer group halts.

    ## Links
    - [Azure Event Hubs Metrics Documentation](https://learn.microsoft.com/en-us/azure/event-hubs/event-hubs-metrics-azure-monitor)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - CI/CD & Deployment
  ee: false
  demo: false
