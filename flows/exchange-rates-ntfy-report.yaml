id: exchange-rates-ntfy-report
namespace: company.reporting

description: |
  Fetches the latest exchange rates from the free Frankfurter API (ECB data), saves them
  into a CSV file, summarizes them with DuckDB and sends the report as a push notification
  through ntfy.sh. No password, no account, no secrets.

inputs:
  - id: base
    type: STRING
    defaults: EUR
    description: Base currency (ISO 4217 code).

  - id: symbols
    type: STRING
    defaults: HUF,USD,GBP,CHF,PLN
    description: Comma-separated list of currencies to compare against the base.

  - id: ntfy_topic
    type: STRING
    defaults: kestra-fx-change-this-to-something-unique-4821
    description: Your private topic name on ntfy.sh. Anyone who knows the name can read it, so make it long and random.

  - id: force_notify
    type: BOOLEAN
    defaults: false
    description: Send the notification even if the ECB has not published new rates today (useful for manual test runs).

triggers:
  - id: weekday_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Every weekday at 16:30 Budapest time, after the ECB publishes its daily rates.
    cron: "30 16 * * 1-5"
    timezone: Europe/Budapest
    disabled: false

tasks:
  - id: fetch_rates
    type: io.kestra.plugin.core.http.Request
    description: Gets the latest rates from the Frankfurter API.
    uri: "https://api.frankfurter.dev/v1/latest?base={{ inputs.base }}&symbols={{ inputs.symbols }}"
    method: GET
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT30S
      maxAttempts: 3

  - id: log_report
    type: io.kestra.plugin.core.log.Log
    description: Writes the rates into the execution log.
    message: |
      Exchange rates for {{ fromJson(outputs.fetch_rates.body).date }} (base: {{ inputs.base }})
      {%- for entry in fromJson(outputs.fetch_rates.body).rates %}
      {{ inputs.base }}/{{ entry.key }}: {{ entry.value }}
      {%- endfor %}

  - id: save_csv
    type: io.kestra.plugin.core.storage.Write
    description: Saves the rates into a CSV file in internal storage.
    extension: .csv
    content: |
      date,base,currency,rate
      {%- for entry in fromJson(outputs.fetch_rates.body).rates %}
      {{ fromJson(outputs.fetch_rates.body).date }},{{ inputs.base }},{{ entry.key }},{{ entry.value }}
      {%- endfor %}

  - id: summarize_rates
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Finds the highest and lowest rate in the CSV with an in-memory DuckDB query.
    inputFiles:
      rates.csv: "{{ outputs.save_csv.uri }}"
    sql: |
      SELECT
        count(*) AS currencies,
        arg_max(currency, rate) AS highest_currency,
        max(rate) AS highest_rate,
        arg_min(currency, rate) AS lowest_currency,
        min(rate) AS lowest_rate
      FROM read_csv_auto('{{ workingDir }}/rates.csv');
    fetchType: FETCH_ONE

  - id: check_fresh_rates
    type: io.kestra.plugin.core.flow.If
    description: Notifies only when the ECB published rates today, or when force_notify is true.
    condition: "{{ inputs.force_notify or fromJson(outputs.fetch_rates.body).date == now(format='yyyy-MM-dd', timeZone='Europe/Budapest') }}"
    then:
      - id: send_notification
        type: io.kestra.plugin.core.http.Request
        description: Publishes the report to your ntfy.sh topic as a push notification.
        uri: "https://ntfy.sh/{{ inputs.ntfy_topic }}"
        method: POST
        contentType: text/plain
        headers:
          Title: "Exchange rates {{ fromJson(outputs.fetch_rates.body).date }}"
          Tags: chart_with_upwards_trend
        body: |
          Base: {{ inputs.base }}
          {%- for entry in fromJson(outputs.fetch_rates.body).rates %}
          {{ entry.key }}: {{ entry.value }}
          {%- endfor %}
          Highest: {{ outputs.summarize_rates.row.highest_currency }} ({{ outputs.summarize_rates.row.highest_rate }})
          Lowest: {{ outputs.summarize_rates.row.lowest_currency }} ({{ outputs.summarize_rates.row.lowest_rate }})
    else:
      - id: log_stale_rates
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "No new ECB rates today (latest data is from {{ fromJson(outputs.fetch_rates.body).date }}). Notification skipped."

outputs:
  - id: rates_file
    type: FILE
    description: CSV file with the fetched exchange rates.
    value: "{{ outputs.save_csv.uri }}"

extend:
  title: Daily Exchange Rates to Push Notification with ntfy
  shortDescription: Fetch daily ECB exchange rates from a free API, save them as CSV, summarize with DuckDB and send a push notification through ntfy.sh.
  metaTitle: Daily Exchange Rates Push Notification with ntfy in Kestra
  metaDescription: Fetch daily ECB exchange rates from the free Frankfurter API, save them as CSV, summarize with DuckDB and push the report to your phone with ntfy.sh.
  description: |
    Get the daily exchange rates on your phone without any account, API key or secret. This blueprint calls the free Frankfurter API (ECB reference rates), saves the rates into a CSV file, finds the highest and lowest rate with an in-memory DuckDB query and publishes the report as a push notification through ntfy.sh. A conditional step skips the notification on days when the ECB published no new rates, such as bank holidays.

    ## How it works

    1. The `weekday_schedule` trigger (`io.kestra.plugin.core.trigger.Schedule`) runs the flow every weekday at 16:30 Budapest time, after the ECB publishes its rates.
    2. `fetch_rates` (`io.kestra.plugin.core.http.Request`) calls the Frankfurter API for the `base` and `symbols` inputs, with exponential retries.
    3. `log_report` (`io.kestra.plugin.core.log.Log`) parses the JSON with `fromJson()` and writes the rates into the execution log.
    4. `save_csv` (`io.kestra.plugin.core.storage.Write`) stores the rates as a CSV file in internal storage.
    5. `summarize_rates` (`io.kestra.plugin.jdbc.duckdb.Query`) reads the CSV in memory and returns the highest and lowest rate.
    6. `check_fresh_rates` (`io.kestra.plugin.core.flow.If`) compares the rate date with today's date. If the rates are fresh, or `force_notify` is true, `send_notification` posts the report to ntfy.sh. Otherwise `log_stale_rates` logs a warning.

    ## What you get

    - A weekday push notification with the latest exchange rates and the highest and lowest rate.
    - A CSV file with the rates, downloadable from the execution outputs.
    - No duplicate notifications on days without new ECB data.

    ## Who it's for

    - Finance and treasury teams who want a lightweight daily FX rate check.
    - Freelancers and small businesses invoicing in foreign currencies.
    - Anyone new to Kestra who wants an HTTP, DuckDB and conditional-branching example without any credentials.

    ## Why orchestrate this with Kestra

    A cron job with curl has no retries, no run history and no place to keep the CSV. Kestra gives the pipeline scheduling, retries, conditional branching, file outputs and a full execution history in one declarative flow.

    ## Prerequisites

    - A private topic name on [ntfy.sh](https://ntfy.sh) and the ntfy app on your phone, subscribed to that topic. Anyone who knows the topic can read it, so pick a long random name.
    - No secrets are required.

    ### Inputs

    - `base` (STRING, default `EUR`): base currency.
    - `symbols` (STRING, default `HUF,USD,GBP,CHF,PLN`): currencies to compare against the base.
    - `ntfy_topic` (STRING): your private ntfy.sh topic.
    - `force_notify` (BOOL, default `false`): send the notification even without new rates.

    ### Outputs

    - `rates_file`: CSV file with the rates, available as `{{ outputs.save_csv.uri }}`.

    ## Quick start

    1. Install the ntfy app and subscribe to your own topic.
    2. Set the `ntfy_topic` input default to that topic.
    3. Click **Execute** with `force_notify` set to true and check your phone.
    4. Leave the `weekday_schedule` trigger enabled for daily reports, or set `disabled: true` to run the flow manually only.

    ## How to extend

    - Change `base` and `symbols` to track other currencies.
    - Swap the ntfy request for Slack, Discord or email notifications.
    - Append each CSV to a warehouse table to build a rate history.
    - Add an alert when a rate moves more than a threshold compared with the previous day.

    ## Links

    - [Frankfurter API Documentation](https://frankfurter.dev)
    - [ntfy.sh Publishing Documentation](https://docs.ntfy.sh/publish/)
    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
  tags:
    - Business
    - Core
  ee: false
  demo: false
