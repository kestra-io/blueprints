id: digitraffic-road-weather-slippery-road-alert
namespace: company.team

description: |
  Slippery road alerts for Finnish road sections, built on the keyless Fintraffic Digitraffic road weather API.
  Every 15 minutes the flow reads the latest measurements of all ~530 road weather stations in one request,
  keeps the stations on the roads you drive or maintain, and classifies each one as ICY, RISK or OK from the
  station's own road condition and warning codes, the road surface temperature against the freezing point of
  the moisture on it, and the road surface to dew point gap. A DuckDB ledger in the KV store remembers each
  station's level, so Slack only hears about escalations and, with hysteresis, all-clears.

inputs:
  - id: roads
    type: ARRAY
    itemType: STRING
    displayName: Watched roads
    description: |
      Road prefixes of Digitraffic station names, e.g. `vt4` (main road 4), `kt77` (regional road 77) or `st110`.
      Use `*` for every station in Finland.
    defaults: ["vt1", "vt4", "vt5", "vt6", "vt9"]

  - id: freeze_margin_c
    type: FLOAT
    defaults: 1.0
    description: A moist or wet surface is at RISK when its temperature is at most this many degrees above the freezing point of the moisture on it.

  - id: clear_surface_c
    type: FLOAT
    defaults: 2.0
    description: Hysteresis. A station that was ICY or RISK only clears when its coldest road surface sensor is at or above this temperature.

  - id: max_data_age_minutes
    type: INT
    defaults: 60
    description: Stations whose newest road sensor reading is older than this are STALE; they keep their last level and do not alert.

  - id: alert_clears
    type: BOOL
    defaults: true
    description: Also post CLEAR lines when a station returns to OK.

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: fetch_weather
    type: io.kestra.plugin.core.http.Download
    description: |
      Latest values of every sensor at every road weather station in one request (about 10 MB, 365 KB gzipped).
      Digitraffic answers 406 without `Accept-Encoding: gzip` and asks clients to identify themselves with `Digitraffic-User`.
    uri: https://tie.digitraffic.fi/api/weather/v1/stations/data
    headers:
      Accept-Encoding: gzip
      Digitraffic-User: kestra-blueprint/digitraffic-road-weather-slippery-road-alert
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempts: 4

  - id: fetch_stations
    type: io.kestra.plugin.core.http.Download
    description: Station names (which carry the road number), coordinates and collection status.
    uri: https://tie.digitraffic.fi/api/weather/v1/stations
    headers:
      Accept-Encoding: gzip
      Digitraffic-User: kestra-blueprint/digitraffic-road-weather-slippery-road-alert
    retry:
      type: constant
      interval: PT30S
      maxAttempts: 3

  - id: previous_ledger
    type: io.kestra.plugin.core.kv.Get
    key: digitraffic_road_weather_ledger_uri
    errorOnMissing: false

  - id: first_run
    type: io.kestra.plugin.core.flow.If
    description: Creates an empty ledger on the first run (or after the KV key is deleted); that run is the BASELINE and alerts nothing.
    condition: "{{ outputs.previous_ledger.value is not defined or outputs.previous_ledger.value is empty }}"
    then:
      - id: init_ledger
        type: io.kestra.plugin.jdbc.duckdb.Queries
        outputDbFile: true
        sql: |
          CREATE TABLE station_state (station_id BIGINT PRIMARY KEY, station VARCHAR, road VARCHAR, level INTEGER,
            since TIMESTAMPTZ, surface_c DOUBLE, updated_at TIMESTAMPTZ);
          CREATE TABLE event_log (logged_at TIMESTAMPTZ, execution_id VARCHAR, change VARCHAR, station_id BIGINT, station VARCHAR,
            road VARCHAR, surface_c DOUBLE, friction DOUBLE, reasons VARCHAR, lat DOUBLE, lon DOUBLE);
          CREATE TABLE runs (checked_at TIMESTAMPTZ, execution_id VARCHAR, watched INTEGER, icy INTEGER, risk INTEGER,
            stale INTEGER, changes INTEGER);

  - id: assess
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Per road surface sensor (1 to 4) the station reports a road condition (KELI), a warning level (VAROITUS), the
      surface temperature (TIE) and the freezing point of the moisture on the surface. A sensor is ICY when the station
      sees frost, snow, ice or slush or raises an alarm; RISK when it warns of frost or "beware", or the surface is moist,
      wet or salty and within `freeze_margin_c` of that freezing point (so a salted road at -1 °C with a -6 °C freezing
      point is not flagged). Station-wide, a computed friction below 0.4 is ICY and a surface at or below 0 °C that is
      colder than the dew point (hoar frost forming) is RISK. Sensors reporting a fault (KELI 0) are ignored.
    databaseUri: "{{ outputs.previous_ledger.value ?? outputs.init_ledger.databaseUri }}"
    outputDbFile: true
    timeZoneId: UTC
    fetchType: FETCH
    inputFiles:
      weather.json: "{{ outputs.fetch_weather.uri }}"
      stations.json: "{{ outputs.fetch_stations.uri }}"
    parameters:
      roads: "{{ inputs.roads | toJson }}"
      margin: "{{ inputs.freeze_margin_c }}"
      clear_c: "{{ inputs.clear_surface_c }}"
      max_age: "{{ inputs.max_data_age_minutes }}"
      clears: "{{ inputs.alert_clears }}"
      execution_id: "{{ execution.id }}"
    sql: |
      SET TimeZone = 'UTC';

      CREATE OR REPLACE TEMP TABLE watch AS
      SELECT DISTINCT lower(trim(unnest(from_json(:roads, '["VARCHAR"]')))) AS road;

      CREATE OR REPLACE TEMP TABLE meta AS
      WITH f AS (SELECT unnest(features) AS f FROM read_json('stations.json',
        columns = {'features': 'STRUCT(id BIGINT, geometry STRUCT(coordinates DOUBLE[]), properties STRUCT(name VARCHAR, collectionStatus VARCHAR))[]'}))
      SELECT f.id AS station_id, f.properties.name AS station, lower(regexp_extract(f.properties.name, '^([A-Za-z]+[0-9]+)_', 1)) AS road,
             f.geometry.coordinates[2] AS lat, f.geometry.coordinates[1] AS lon
      FROM f WHERE f.properties.collectionStatus = 'GATHERING' AND NOT starts_with(upper(f.properties.name), 'TEST');

      CREATE OR REPLACE TEMP TABLE scoped AS
      SELECT * FROM meta WHERE road IN (SELECT road FROM watch) OR EXISTS (SELECT 1 FROM watch WHERE road = '*');

      CREATE OR REPLACE TEMP TABLE obs AS
      WITH s AS (SELECT unnest(stations) AS s FROM read_json('weather.json',
        columns = {'stations': 'STRUCT(id BIGINT, sensorValues STRUCT(name VARCHAR, measuredTime TIMESTAMPTZ, "value" DOUBLE)[])[]'})),
      v AS (SELECT s.id AS station_id, unnest(s.sensorValues) AS v FROM s)
      SELECT station_id, v.name AS name, v.measuredTime AS measured_at, v.value AS val FROM v
      WHERE station_id IN (SELECT station_id FROM scoped);

      -- One row per road surface sensor; sensor slots without a surface temperature or reporting a fault are dropped
      CREATE OR REPLACE TEMP TABLE sensors AS
      WITH p AS (
        SELECT station_id, regexp_extract(name, '_([1-4])$', 1) AS slot, max(measured_at) AS measured_at,
               max(val) FILTER (WHERE regexp_matches(name, '^TIE_[1-4]$')) AS surface_c,
               max(val) FILTER (WHERE regexp_matches(name, '^KELI_[1-4]$')) AS cond,
               max(val) FILTER (WHERE regexp_matches(name, '^VAROITUS_[1-4]$')) AS warn,
               max(val) FILTER (WHERE regexp_matches(name, 'TYMISPISTE_[1-4]$')) AS freeze_c
        FROM obs WHERE regexp_matches(name, '^(TIE|KELI|VAROITUS|J.+TYMISPISTE)_[1-4]$') GROUP BY ALL)
      SELECT *, CASE WHEN cond IN (5, 6, 7, 9) OR warn = 2 THEN 2
                     WHEN warn IN (1, 3) OR (cond IN (2, 3, 4, 8) AND surface_c <= coalesce(freeze_c, 0) + CAST(:margin AS DOUBLE)) THEN 1
                     ELSE 0 END AS level,
             CASE cond WHEN 2 THEN 'moist' WHEN 3 THEN 'wet' WHEN 4 THEN 'wet and salty' WHEN 5 THEN 'frost' WHEN 6 THEN 'snow'
                       WHEN 7 THEN 'ice' WHEN 8 THEN 'moist and salty' WHEN 9 THEN 'slush' ELSE NULL END AS cond_txt,
             CASE warn WHEN 1 THEN 'beware' WHEN 2 THEN 'ALARM' WHEN 3 THEN 'frost warning' ELSE NULL END AS warn_txt
      FROM p WHERE surface_c IS NOT NULL AND coalesce(cond, -1) <> 0;

      CREATE OR REPLACE TEMP TABLE now_state AS
      WITH st AS (
        SELECT station_id, min(surface_c) AS surface_c, max(level) AS sensor_level, max(measured_at) AS measured_at, arg_min(freeze_c, surface_c) AS freeze_c,
               string_agg(DISTINCT cond_txt, '/') AS conds, string_agg(DISTINCT warn_txt, '/') AS warns
        FROM sensors GROUP BY station_id),
      x AS (
        SELECT station_id, min(val) FILTER (WHERE name IN ('KITKA1', 'KITKA2')) AS friction,
               min(val) FILTER (WHERE name IN ('KASTEPISTE_ERO_TIE', 'KASTEPISTE_ERO_TIE2')) AS dew_gap,
               max(val) FILTER (WHERE name = 'ILMA') AS air_c
        FROM obs GROUP BY station_id)
      SELECT m.*, st.surface_c, st.freeze_c, st.measured_at, x.friction, x.dew_gap, x.air_c,
             st.measured_at < now() - to_minutes(CAST(:max_age AS INTEGER)) AS stale,
             greatest(st.sensor_level, CASE WHEN x.friction < 0.4 THEN 2 ELSE 0 END,
                      CASE WHEN st.surface_c <= 0 AND x.dew_gap < 0 THEN 1 ELSE 0 END) AS raw_level,
             concat_ws(', ', st.conds, st.warns, CASE WHEN x.friction < 0.4 THEN 'friction ' || x.friction END,
                       CASE WHEN st.surface_c <= 0 AND x.dew_gap < 0 THEN 'surface below dew point' END) AS reasons
      FROM scoped m JOIN st USING (station_id) LEFT JOIN x USING (station_id);

      CREATE OR REPLACE TEMP TABLE evaluated AS
      SELECT n.*, p.level AS prev_level,
             CASE WHEN n.stale THEN coalesce(p.level, 0)
                  WHEN n.raw_level = 0 AND coalesce(p.level, 0) > 0 AND n.surface_c < CAST(:clear_c AS DOUBLE) THEN 1
                  ELSE n.raw_level END AS level,
             n.raw_level = 0 AND coalesce(p.level, 0) > 0 AND n.surface_c < CAST(:clear_c AS DOUBLE) AND NOT n.stale AS holding
      FROM now_state n LEFT JOIN station_state p USING (station_id);

      CREATE OR REPLACE TEMP TABLE changes AS
      SELECT CASE WHEN level = 2 THEN 'ICY' WHEN level = 1 THEN 'RISK' ELSE 'CLEAR' END AS change, *
      FROM evaluated
      WHERE (SELECT count(*) FROM runs) > 0 AND NOT stale
        AND (level > coalesce(prev_level, 0) OR (level = 0 AND prev_level > 0 AND CAST(:clears AS BOOLEAN)));

      INSERT INTO event_log SELECT now(), :execution_id, change, station_id, station, road, surface_c, friction, reasons, lat, lon FROM changes;
      INSERT INTO runs SELECT now(), :execution_id, (SELECT count(*) FROM scoped), (SELECT count(*) FROM evaluated WHERE level = 2 AND NOT stale),
        (SELECT count(*) FROM evaluated WHERE level = 1 AND NOT stale), (SELECT count(*) FROM evaluated WHERE stale), (SELECT count(*) FROM changes);

      INSERT INTO station_state SELECT station_id, station, road, level, now(), surface_c, now() FROM evaluated
      ON CONFLICT (station_id) DO UPDATE SET level = excluded.level, surface_c = excluded.surface_c, updated_at = excluded.updated_at,
        since = CASE WHEN station_state.level = excluded.level THEN station_state.since ELSE excluded.since END;

      CREATE OR REPLACE TEMP TABLE alert_lines AS
      SELECT *, change || ' *' || station || '* surface ' || surface_c || ' °C'
             || coalesce(' (freezing point ' || freeze_c || ' °C)', '') || coalesce(', air ' || air_c || ' °C', '')
             || CASE WHEN change = 'CLEAR' THEN '' ELSE coalesce(' - ' || nullif(reasons, ''), '') END
             || ' https://www.openstreetmap.org/?mlat=' || round(lat, 5) || '&mlon=' || round(lon, 5) AS line
      FROM changes;

      SELECT change, road, station, surface_c, freeze_c, friction, reasons, lat, lon FROM alert_lines ORDER BY level DESC, road, surface_c;

      SELECT (SELECT count(*) FROM runs) = 1 AS is_baseline,
             (SELECT count(*) FROM scoped) AS watched_stations,
             (SELECT count(*) FROM evaluated WHERE NOT stale) AS reporting,
             (SELECT count(*) FROM evaluated WHERE stale) AS stale,
             (SELECT count(*) FROM scoped) - (SELECT count(*) FROM evaluated) AS no_surface_sensor,
             (SELECT count(*) FROM evaluated WHERE level = 2 AND NOT stale) AS icy,
             (SELECT count(*) FROM evaluated WHERE level = 1 AND NOT stale) AS risk,
             (SELECT count(*) FROM evaluated WHERE holding) AS holding,
             (SELECT round(min(surface_c), 1) FROM evaluated WHERE NOT stale) AS coldest_surface_c,
             (SELECT coalesce(string_agg(road, ', '), '') FROM watch WHERE road <> '*' AND road NOT IN (SELECT road FROM scoped)) AS unknown_roads,
             (SELECT count(*) FROM changes) AS changes,
             (SELECT coalesce(string_agg(line, chr(10) ORDER BY level DESC, road, surface_c), '') FROM (SELECT * FROM alert_lines ORDER BY level DESC, road, surface_c LIMIT 40)) AS alert_text,
             (SELECT count(*) FROM event_log) AS logged_events;

  - id: save_ledger
    type: io.kestra.plugin.core.kv.Set
    key: digitraffic_road_weather_ledger_uri
    value: "{{ outputs.assess.databaseUri }}"

  - id: notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.assess.outputs[1].rows[0].changes > 0 }}"
    then:
      - id: log_changes
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.assess.outputs[1].rows[0].alert_text }}"

      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": {{ ('*Road weather changes on ' ~ (inputs.roads | join(', ')) ~ '* (' ~ outputs.assess.outputs[1].rows[0].changes ~ ', first 40 shown)\n' ~ outputs.assess.outputs[1].rows[0].alert_text) | toJson }}}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.assess.outputs[1].rows[0].watched_stations }} road weather stations on {{ inputs.roads | join(', ') }},
      {{ outputs.assess.outputs[1].rows[0].reporting }} reporting{{ outputs.assess.outputs[1].rows[0].is_baseline ? ' (BASELINE run, no alerts)' : '' }}:
      {{ outputs.assess.outputs[1].rows[0].icy }} ICY, {{ outputs.assess.outputs[1].rows[0].risk }} RISK ({{ outputs.assess.outputs[1].rows[0].holding }} held by hysteresis),
      {{ outputs.assess.outputs[1].rows[0].stale }} stale, {{ outputs.assess.outputs[1].rows[0].no_surface_sensor }} without a road surface sensor; coldest surface {{ outputs.assess.outputs[1].rows[0].coldest_surface_c }} °C;
      {{ outputs.assess.outputs[1].rows[0].changes }} changes, {{ outputs.assess.outputs[1].rows[0].logged_events }} events in the ledger.{{ outputs.assess.outputs[1].rows[0].unknown_roads != '' ? ' No stations found for: ' ~ outputs.assess.outputs[1].rows[0].unknown_roads ~ '.' : '' }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.assess.outputs[1].rows[0] }}"
  - id: changes
    type: JSON
    value: "{{ outputs.assess.outputs[0].rows }}"
  - id: ledger
    type: FILE
    value: "{{ outputs.assess.databaseUri }}"

extend:
  title: Slippery Road Alerts for Finnish Roads with Digitraffic Road Weather Stations
  metaTitle: Digitraffic Road Weather Slippery Road Alerts | Kestra
  shortDescription: Every 15 minutes, read all Finnish road weather stations from Digitraffic and alert when stations on your roads turn icy or at risk of freezing, with hysteresis so a road hovering around 0 °C does not flap.
  metaDescription: Watch Finnish road weather stations with the Digitraffic API and get Slack alerts when your roads turn icy or near freezing, with hysteresis and a ledger.
  description: |
    Black ice forms when a moist road surface reaches the freezing point of the water on it, often before the air looks cold. Fintraffic's keyless Digitraffic API publishes the latest readings of every Finnish road weather station: surface temperature, freezing point, road condition, the station's warning level and sometimes friction. This flow turns them into ICY / RISK / OK levels for your roads and reports only changes.

    ## How it works

    1. A `Schedule` trigger runs every 15 minutes.
    2. `fetch_weather` (HTTP Download) reads the latest values of all ~530 stations in one request; `fetch_stations` reads names (prefixed with the road, e.g. `vt4_`), coordinates and status.
    3. `previous_ledger` (KV Get) reads the DuckDB ledger URI; `first_run` (If) creates it when missing. That run is the BASELINE and alerts nothing.
    4. `assess` (DuckDB) keeps active, non-test stations on the watched `roads` and rates each road surface sensor:
       - ICY: the station reports frost, snow, ice or slush, raises an alarm, or friction is below 0.4.
       - RISK: a frost or "beware" warning, a moist, wet or salty surface within `freeze_margin_c` of its freezing point (a salted road at -1 °C freezing at -6 °C is fine), or a surface at or below 0 °C colder than the dew point (hoar frost).
       - Faulty sensors are ignored; stations with no reading in `max_data_age_minutes` are STALE and keep their last level.
       - Hysteresis: an ICY or RISK station only returns to OK once its coldest surface reaches `clear_surface_c`.
    5. `save_ledger` (KV Set) stores the new ledger URI.
    6. `notify` (If) logs escalations and, with `alert_clears`, CLEAR lines, and posts them to Slack with temperatures, reasons and an OpenStreetMap link.

    ## What you get

    - One alert line per station whose level changed, ICY first, capped at 40 lines per message.
    - A DuckDB ledger (output `ledger`) with `station_state`, `event_log` and `runs` tables.
    - Flow outputs `summary` (level counts, coldest surface) and `changes`; roads with no stations (typos) are named.

    ## Who it's for

    - Winter maintenance contractors, fleet and logistics dispatchers, bus operators and field service teams on Finnish roads.

    ## Why orchestrate this with Kestra

    - Two retried requests per run, KV state and readable SQL instead of a cron script with a local file.
    - Each execution keeps its own ledger file for audit; Slack is optional (`allowFailure`).

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins, and outbound HTTPS to `tie.digitraffic.fi` (no API key).
    - Finnish roads only. Levels come from station measurements, not forecasts, and complement official warnings.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the alerts (optional; without it the Slack task warns and the run continues).

    ## Quick start

    1. Click **Execute** with the defaults: a BASELINE of the ~160 stations on main roads 1, 4, 5, 6 and 9.
    2. Execute again: only real changes since the first run are reported.
    3. Set your `roads` (or `*` for the whole country), add `SLACK_WEBHOOK_URL` and keep the 15-minute schedule on.

    ## How to extend

    - Add the station forecast sensors (`TIEN_LÄMPÖTILA_ENNUSTE`) to warn before the surface freezes.
    - Route ICY lines for specific road sections to the maintenance crew on call with a `Switch` on `road`.

    ## Links

    - [Digitraffic road traffic API](https://www.digitraffic.fi/en/road-traffic/) and [Swagger](https://tie.digitraffic.fi/swagger/)
    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if) and [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
