id: portainer-container-crash-loop-sentinel
namespace: company.team

description: |
  Authenticate against a Portainer instance on a schedule, list every
  container on a given Docker endpoint, classify the environment as
  HEALTHY, AT_RISK, CRITICAL, or UNREACHABLE based on how many
  containers are stuck restarting or have exited, log clean checks,
  and alert Slack the moment a container enters a crash loop or
  Portainer itself cannot be reached.

inputs:
  - id: portainer_url
    type: STRING
    defaults: "http://localhost:9000"
    displayName: "Portainer Base URL"
    description: "Base URL of the Portainer instance, no trailing slash."
  - id: endpoint_id
    type: INT
    defaults: 1
    displayName: "Portainer Endpoint ID"
    description: "ID of the Docker environment (endpoint) to list containers for, as shown under Environments in Portainer."

triggers:
  - id: container_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Check every Docker environment's container states every 5 minutes."
    cron: "*/5 * * * *"
    disabled: true
    inputs:
      portainer_url: "http://localhost:9000"
      endpoint_id: 1

tasks:
  - id: login_to_portainer
    type: io.kestra.plugin.core.http.Request
    description: "Authenticate against the Portainer REST API to obtain the JWT used by every subsequent call."
    uri: "{{ inputs.portainer_url }}/api/auth"
    method: POST
    contentType: application/json
    body: |
      {
        "Username": "{{ secret('PORTAINER_USERNAME') }}",
        "Password": "{{ secret('PORTAINER_PASSWORD') }}"
      }
    allowFailure: true

  - id: list_containers
    type: io.kestra.plugin.core.http.Request
    description: "List every container (running and stopped) on the target Docker endpoint via Portainer's Docker API proxy."
    uri: "{{ inputs.portainer_url }}/api/endpoints/{{ inputs.endpoint_id }}/docker/containers/json?all=true"
    method: GET
    headers:
      Authorization: "{{ outputs.login_to_portainer.body is defined ? ('Bearer ' ~ (outputs.login_to_portainer.body | jq('.jwt') | first | default(''))) : '' }}"
    allowFailure: true

  - id: classify_container_health
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when the container list could not be fetched, CRITICAL when at least one container is stuck in the restarting state, AT_RISK when at least one container has exited, otherwise HEALTHY."
    format: "{{ outputs.list_containers.body is defined ? (((outputs.list_containers.body | jq('[.[] | select(.State == \"restarting\")] | length') | first | default(0)) > 0) ? 'CRITICAL' : (((outputs.list_containers.body | jq('[.[] | select(.State == \"exited\")] | length') | first | default(0)) > 0) ? 'AT_RISK' : 'HEALTHY')) : 'UNREACHABLE' }}"

  - id: route_by_container_health
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation when every container is healthy, page Slack when a container is crash-looping or has exited, or page Slack when Portainer could not be reached."
    value: "{{ outputs.classify_container_health.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "All containers on endpoint {{ inputs.endpoint_id }} are healthy: none restarting or exited."
      "AT_RISK":
        - id: alert_at_risk
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Portainer sentinel AT_RISK on endpoint {{ inputs.endpoint_id }}: exited container(s): {{ outputs.list_containers.body | jq('[.[] | select(.State == \"exited\") | (.Names[0] // .Id)] | join(\", \")') | first }}. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Portainer sentinel CRITICAL on endpoint {{ inputs.endpoint_id }}: container(s) stuck restarting: {{ outputs.list_containers.body | jq('[.[] | select(.State == \"restarting\") | (.Names[0] // .Id)] | join(\", \")') | first }}. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Portainer sentinel UNREACHABLE for endpoint {{ inputs.endpoint_id }}: the container list could not be fetched (login failure, invalid credentials, or Portainer/the Docker endpoint is down). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed Portainer container health check with status: {{ outputs.classify_container_health.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-check status line recorded on every run regardless of branch, for a continuous container-health trend in the execution history."
    message: "Portainer audit: endpoint={{ inputs.endpoint_id }}, status={{ outputs.classify_container_health.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the sentinel flow itself fails, so a broken check never silently stops monitoring container health."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Portainer container crash-loop sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Container health for endpoint {{ inputs.endpoint_id }} is now unknown; check the task logs and the Portainer UI manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_container_health.value }}"

extend:
  title: "Portainer Container Crash-Loop Sentinel"
  metaTitle: Portainer Container Crash-Loop Sentinel for Kestra
  shortDescription: Poll Portainer's Docker API proxy on a schedule, detect containers stuck restarting or unexpectedly exited, and alert Slack before a crash loop goes unnoticed.
  metaDescription: Monitor Portainer-managed Docker containers and alert Slack when one is stuck restarting or has exited.
  description: |
    A container stuck in Docker's restart-backoff loop does not show up anywhere unless someone happens to run `docker ps` at the right moment. This blueprint authenticates against Portainer on a schedule, lists every container on a Docker endpoint through Portainer's own Docker API proxy, and pages Slack the moment one is crash-looping, has exited, or Portainer itself cannot be reached.

    ## How it works

    1. `login_to_portainer` (`io.kestra.plugin.core.http.Request`) authenticates against `POST /api/auth` with a Portainer username and password, returning a `jwt`. `allowFailure: true` lets the flow continue into classification instead of aborting on a bad login.
    2. `list_containers` (`io.kestra.plugin.core.http.Request`) calls `GET /api/endpoints/{endpoint_id}/docker/containers/json?all=true` with the `jwt` as a Bearer token, returning Docker's own container list (every container's `State`: `running`, `restarting`, `exited`, `paused`, or `dead`).
    3. `classify_container_health` (`io.kestra.plugin.core.debug.Return`) checks whether `list_containers.body` is defined; if not, `UNREACHABLE`. Otherwise it counts containers with `jq` by `State`: any `restarting` container is `CRITICAL` (Docker is actively retrying a failing container), any `exited` container is `AT_RISK`, otherwise `HEALTHY`.
    4. `route_by_container_health` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `HEALTHY` logs a quiet confirmation, `AT_RISK` and `CRITICAL` each page Slack with the specific container names, `UNREACHABLE` pages Slack separately, and `defaults` logs the raw outcome.
    5. `log_audit_status` records a status line on every run regardless of branch, so the execution history is a continuous container-health trend.
    6. The `errors` block pages Slack separately if the flow itself fails outright.
    7. The `container_health_schedule` trigger polls every 5 minutes with explicit input overrides, shipped `disabled: true` until you point it at a real Portainer instance.

    ## What you get

    - A scheduled, endpoint-wide container crash-loop check with zero custom Docker Engine API client code.
    - A four-way `status` output (`HEALTHY` / `AT_RISK` / `CRITICAL` / `UNREACHABLE`) you can chart or gate other flows on.
    - A Slack page naming the exact container(s) behind a restart loop or an unexpected exit.
    - A separate failure channel for the sentinel flow itself, plus a standing audit log line per run.

    ## Who it's for

    - Platform and DevOps teams running Docker workloads behind Portainer who want a container-level health check without wiring up a full metrics stack.
    - Small teams and homelab operators who use Portainer as their primary Docker management UI and want Slack paging on crash loops.

    ## Why orchestrate this with Kestra

    Checking `docker ps` by hand, or on a bare cron job, tells you nothing once the terminal closes. This flow keeps every login, every container snapshot, and every classification in the execution history, turns the health check into a typed output other flows can depend on, and gives you a Switch branch to grow into real remediation (restarting a specific container via the same Docker API proxy, opening a ticket, paging on-call) without rewriting the check itself.

    ## Prerequisites

    - A Portainer Community Edition instance reachable at `portainer_url`. The free, official Docker image (`portainer/portainer-ce`) is enough to fully test this blueprint locally: `docker run -d -p 9000:9000 -v /var/run/docker.sock:/var/run/docker.sock portainer/portainer-ce:latest`.
    - A Portainer user with API access and at least read permission on the target environment.
    - The numeric `endpoint_id` of the Docker environment to check, visible in the Portainer UI under Environments.
    - A Slack incoming webhook for the warning, critical, and unreachable alerts.

    ### Secrets

    - `PORTAINER_USERNAME`: Portainer username used to authenticate against `/api/auth`.
    - `PORTAINER_PASSWORD`: password for that user.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the AT_RISK alert, the CRITICAL alert, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_PORTAINER_USERNAME`, `SECRET_PORTAINER_PASSWORD`, and `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-value>" | base64`.

    ## Quick start

    1. Add the `PORTAINER_USERNAME`, `PORTAINER_PASSWORD`, and `SLACK_WEBHOOK_URL` secrets.
    2. Set `portainer_url` and `endpoint_id` to your Docker environment.
    3. Stop a test container (or point a bad image at a restart policy of `always`) so there is something to detect, run the flow once, and confirm `status` reads `AT_RISK` or `CRITICAL`.
    4. Enable `container_health_schedule`.

    ## How to extend

    - Call `POST /api/endpoints/{id}/docker/containers/{containerId}/restart` as a safe remediation step for AT_RISK containers instead of only alerting.
    - Add a `Loop` task over `list_containers` to also surface each container's `Image` and uptime in the Slack message for faster triage.
    - Store each snapshot's counts in a KV store to build a longer crash-loop trend than the execution history alone provides.

    ## Links

    - [Portainer API documentation](https://api-docs.portainer.io/)
    - [Docker Engine API: List containers](https://docs.docker.com/reference/api/engine/version/v1.43/#tag/Container/operation/ContainerList)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  verified: false
  demo: false
