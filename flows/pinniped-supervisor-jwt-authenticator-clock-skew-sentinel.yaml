    - [Pinniped Official Documentation](https://pinniped.dev/)
    - [Pinniped Supervisor Architecture and JWT Guide](https://pinniped.dev/docs/background/supervisor/)
    - [Pinniped Monitoring and Metrics Reference](https://pinniped.dev/docs/howto/supervisor/configure-supervisor-metrics/)
