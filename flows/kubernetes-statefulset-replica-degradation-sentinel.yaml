id: kubernetes-statefulset-replica-degradation-sentinel
namespace: company.sre

inputs:
  - id: kube_context
    type: STRING
    required: false
    description: Optional Kubernetes context name.
  - id: degradation_tolerance
    type: INT
    defaults: 0
    description: Maximum acceptable count of degraded StatefulSets with unready replicas.

tasks:
  - id: audit_statefulsets
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: bitnami/kubectl:latest
    commands:
      - |
        CONTEXT_ARG=""
        if [ -n "{{ inputs.kube_context }}" ]; then
          CONTEXT_ARG="--context={{ inputs.kube_context }}"
        fi
        
        kubectl $CONTEXT_ARG get statefulsets -A -o json > /tmp/sts.json
        
        DEGRADED_COUNT=$(jq '[.items[] | select((.status.readyReplicas // 0) < .spec.replicas)] | length' /tmp/sts.json)
        DEGRADED_DETAILS=$(jq '[.items[] | select((.status.readyReplicas // 0) < .spec.replicas) | {namespace: .metadata.namespace, name: .metadata.name, desired: .spec.replicas, ready: (.status.readyReplicas // 0), current: (.status.currentReplicas // 0)}]' /tmp/sts.json)
        
        echo "::set-output name=degraded_count::$DEGRADED_COUNT::"
        echo "::set-output name=degraded_details::$DEGRADED_DETAILS::"

  - id: evaluate_statefulset_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_statefulsets.vars.degraded_count | int > inputs.degradation_tolerance }}"
    then:
      - id: notify_oncall
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kubernetes StatefulSet Replica Degradation Alert",
                "text": "Detected *{{ outputs.audit_statefulsets.vars.degraded_count }}* degraded StatefulSet(s) where ready replicas do not match desired spec. Degradation details: {{ outputs.audit_statefulsets.vars.degraded_details }}. Impact: Cluster quorum loss or read/write degradation for stateful applications.",
                "footer": "Kestra SRE Orchestrator • StatefulSet Sentinel"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ StatefulSet Sentinel Workflow Execution Failed",
            "text": "The StatefulSet replica audit workflow encountered an execution error. Please check cluster RBAC and API server connectivity.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Kubernetes StatefulSets across all namespaces to detect replica count deficits and impending database quorum loss."
  metaTitle: Kubernetes StatefulSet Replica Health and Quorum Degradation Sentinel with Kestra
  title: Kubernetes StatefulSet Replica Health and Quorum Degradation Sentinel
  shortDescription: Audits Kubernetes StatefulSets across all namespaces to detect replica count deficits and impending database quorum loss.
  description: |
    ## How it works
    This workflow audits all `StatefulSet` resources across all Kubernetes namespaces using `kubectl`. It compares the declared `.spec.replicas` against the observed `.status.readyReplicas`. When any StatefulSet experiences unready or crashing pods, the difference indicates replica deficit and risk of quorum degradation. When the count of degraded StatefulSets exceeds the configured tolerance, an automated Slack alert is sent.

    ## What you get
    - Continuous cluster-wide health checks for critical stateful systems (e.g., Kafka, Cassandra, Elasticsearch, Postgres).
    - Instant alerting with exact breakdown of desired vs. ready replicas.
    - Prevents silent partition splits and database election deadlocks.

    ## Who it's for
    - Database Administrators (DBAs) and SREs operating distributed databases on Kubernetes.
    - Platform teams ensuring high availability for stateful microservices.

    ## Why orchestrate this with Kestra
    - **Declarative Scheduling**: Automate periodic stateful audits without maintaining complex cron jobs.
    - **Composable Alerting**: Dispatch alerts across Slack, PagerDuty, or incident management webhooks effortlessly.
    - **Audit Trail**: Every execution is recorded with full execution context and historical logs.

    ## Prerequisites
    - Cluster RBAC role with `get` and `list` permissions for `statefulsets.apps`.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Configure the `SLACK_WEBHOOK` secret.
    3. Run the flow to audit stateful workloads across your clusters.

    ## How to extend
    - Add an automated task to describe unready pods belonging to the degraded StatefulSet and include termination reasons in the Slack payload.
    - Trigger automated scaling or pod recycling workflows conditionally.

    ## Links
    - [Kubernetes StatefulSets Concept](https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/)
    - [Kestra Architecture Overview](https://kestra.io/docs/architecture)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Kubernetes Operations
    - Day 2 Operations
  ee: false
  demo: false
