id: redis-cross-instance-key-reconcile-guard
namespace: company.team

description: |
  Reconcile a secondary Redis instance against a Redis instance the operator designates as the
  source of truth. Both instances are read with one read-only Lua script each, which returns every
  key in a bounded namespace with its type, its remaining TTL and a SHA1 digest of its value. A key
  the source has that the secondary lacks is MISSING. A key whose digests differ is STALE. A key the
  secondary has that the source does not is an ORPHAN. A key whose bytes match but whose expiry does
  not is TTL_DRIFT. Behind a dry run and a Pause the secondary is repaired, copying each value from
  the source with its TTL and deleting the orphans, then both instances are read again and the run
  fails if any divergence remains. Only the secondary is ever written to.

inputs:
  - id: source_host
    type: STRING
    displayName: Source of truth host
    description: The instance whose contents are authoritative. It is only ever read.
    defaults: "localhost"

  - id: source_port
    type: INT
    displayName: Source of truth port
    defaults: 6379

  - id: source_password
    type: STRING
    displayName: Source of truth password
    description: Password for the connecting user on the source of truth. It needs read rights only.
    defaults: "{{ secret('REDIS_SOURCE_PASSWORD') }}"

  - id: mirror_host
    type: STRING
    displayName: Secondary host
    description: The mirror, the warm standby or the regional copy. This is the only instance the flow writes to.
    defaults: "localhost"

  - id: mirror_port
    type: INT
    displayName: Secondary port
    defaults: 6380

  - id: mirror_password
    type: STRING
    displayName: Secondary password
    defaults: "{{ secret('REDIS_MIRROR_PASSWORD') }}"

  - id: designated_source_of_truth
    type: STRING
    displayName: Designated source of truth (host:port)
    description: >-
      Must equal source_host:source_port exactly. Neither Redis instance is authoritative by nature,
      so the flow refuses to guess which side is right. Stating the designation here is what stops a
      transposed host pair from overwriting good data with drifted data.
    defaults: ""

  - id: key_pattern
    type: STRING
    displayName: Key namespace to reconcile
    description: A redis-cli MATCH glob. Keep it narrow, because every matching key on both instances is read in one run.
    defaults: "mirror:*"

  - id: max_keys
    type: INT
    displayName: Maximum keys per run
    description: >-
      Upper bound on the namespace. If either instance holds more matching keys than this the run
      fails without diffing anything, because a partial keyset would report healthy keys as orphans.
    defaults: 1000

  - id: ttl_tolerance_seconds
    type: INT
    displayName: TTL tolerance (seconds)
    description: Two volatile copies of a key whose remaining TTLs differ by less than this are treated as matching.
    defaults: 60

  - id: network
    type: STRING
    displayName: Docker network for redis-cli
    description: Leave empty unless the redis-cli container needs to join a named Docker network to reach the instances.
    defaults: ""

  - id: approval_timeout
    type: DURATION
    displayName: Approval timeout
    description: How long the Pause waits for an answer. With no answer nothing is written.
    defaults: PT1H

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, before any key on the secondary is written or deleted.
    defaults: true

variables:
  source_url: "redis://{{ inputs.source_password == '' ? '' : ':' ~ inputs.source_password ~ '@' }}{{ inputs.source_host }}:{{ inputs.source_port }}"
  mirror_url: "redis://{{ inputs.mirror_password == '' ? '' : ':' ~ inputs.mirror_password ~ '@' }}{{ inputs.mirror_host }}:{{ inputs.mirror_port }}"
  audit_lua: >-
    local p=ARGV[1]; local lim=tonumber(ARGV[2]); local cur='0'; local ks={}; local n=0; repeat local r=redis.call('SCAN',cur,'MATCH',p,'COUNT',500); cur=r[1]; for i=1,#r[2] do n=n+1; if n<=lim then ks[#ks+1]=r[2][i]; end end until cur=='0' or n>lim; if n>lim then return {'__OVERFLOW__ overflow -1 - -1'} end; table.sort(ks); local out={}; for i=1,#ks do local k=ks[i]; local t=redis.call('TYPE',k)['ok']; local d='-'; local l='-1'; if t=='string' then local v=redis.call('GET',k); d=redis.sha1hex(v); l=tostring(string.len(v)); end; local pt=redis.call('PTTL',k); local ts='-1'; if pt>0 then ts=tostring(math.ceil(pt/1000)); end; out[#out+1]=k..' '..t..' '..ts..' '..d..' '..l; end; return out
  parse_prog: >-
    .v | split("\\n") | map(select(length > 0)) | map(split(" "))
    | map({key: (.[0:(length - 4)] | join(" ")), type: .[length - 4], ttl: (.[length - 3] | tonumber), sha: .[length - 2], len: (.[length - 1] | tonumber)})
  overflow_prog: >-
    [.[] | select(.key == "__OVERFLOW__")] | length
  diff_prog: >-
    ([.src[] | {key: .key, value: .}] | from_entries) as $S
    | ([.dst[] | {key: .key, value: .}] | from_entries) as $D
    | (.tol | tonumber) as $tol
    | (([$S | keys] + [$D | keys]) | add | unique) as $U
    | [ $U[] as $k
        | $S[$k] as $s
        | $D[$k] as $d
        | if (($s != null and $s.type != "string") or ($d != null and $d.type != "string"))
          then {code: "UNSUPPORTED", key: $k, ttl: -1, source_type: ($s.type // "absent"), secondary_type: ($d.type // "absent")}
          elif $d == null then {code: "MISSING", key: $k, ttl: $s.ttl, source_bytes: $s.len, secondary_bytes: -1}
          elif $s == null then {code: "ORPHAN", key: $k, ttl: -1, source_bytes: -1, secondary_bytes: $d.len}
          elif $s.sha != $d.sha then {code: "STALE", key: $k, ttl: $s.ttl, source_bytes: $s.len, secondary_bytes: $d.len}
          else ( (if $s.ttl >= $d.ttl then $s.ttl - $d.ttl else $d.ttl - $s.ttl end) as $delta
                 | if ($s.ttl < 0 and $d.ttl < 0) then empty
                   elif ($s.ttl < 0 or $d.ttl < 0 or $delta > $tol)
                   then {code: "TTL_DRIFT", key: $k, ttl: $s.ttl, source_ttl: $s.ttl, secondary_ttl: $d.ttl}
                   else empty end )
          end ]
  copy_prog: >-
    [.[] | select(.code == "MISSING" or .code == "STALE" or .code == "TTL_DRIFT")
         | {key: .key, code: .code, volatile: (.ttl >= 0), ttl: .ttl}]
  orphan_prog: >-
    [.[] | select(.code == "ORPHAN") | .key]
  unsupported_prog: >-
    [.[] | select(.code == "UNSUPPORTED") | .key]
  report_prog: >-
    map("\(.code) \(.key) ttl=\(.ttl)") | join("; ")

tasks:
  - id: designation_gate
    type: io.kestra.plugin.core.flow.If
    description: >-
      Neither instance is authoritative by nature, so the operator states which one is. A missing or
      mismatched designation stops the run before a single key is read.
    condition: >-
      {{ inputs.designated_source_of_truth != (inputs.source_host ~ ':' ~ inputs.source_port)
         or (inputs.source_host == inputs.mirror_host and inputs.source_port == inputs.mirror_port) }}
    then:
      - id: not_designated
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          Refusing to reconcile. designated_source_of_truth is "{{ inputs.designated_source_of_truth }}"
          while the source inputs point at {{ inputs.source_host }}:{{ inputs.source_port }}. The
          secondary is {{ inputs.mirror_host }}:{{ inputs.mirror_port }}. Set
          designated_source_of_truth to the source host and port. Point the two instance input
          groups at different instances.
    else:
      - id: designation_logged
        type: io.kestra.plugin.core.log.Log
        message: >-
          Source of truth {{ inputs.source_host }}:{{ inputs.source_port }} (read only).
          Secondary {{ inputs.mirror_host }}:{{ inputs.mirror_port }} (the only instance this flow writes to).
          Namespace {{ inputs.key_pattern }}, at most {{ inputs.max_keys }} keys.

  - id: source_read
    type: io.kestra.plugin.redis.cli.RedisCLI
    description: >-
      Read the source namespace with EVAL_RO. Redis itself rejects any write from a read-only script,
      so the authoritative instance cannot be modified by this task even if the script were changed.
    host: "{{ inputs.source_host }}"
    port: "{{ inputs.source_port }}"
    password: "{{ inputs.source_password }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.network }}"
    commands:
      - >-
        EVAL_RO "{{ render(vars.audit_lua) }}" 0 "{{ inputs.key_pattern }}" {{ inputs.max_keys }}

  - id: mirror_read
    type: io.kestra.plugin.redis.cli.RedisCLI
    description: Read the same namespace on the secondary with the same read-only script, so both sides are measured the same way.
    host: "{{ inputs.mirror_host }}"
    port: "{{ inputs.mirror_port }}"
    password: "{{ inputs.mirror_password }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.network }}"
    commands:
      - >-
        EVAL_RO "{{ render(vars.audit_lua) }}" 0 "{{ inputs.key_pattern }}" {{ inputs.max_keys }}

  - id: parse
    type: io.kestra.plugin.core.output.OutputValues
    description: One record per key on each side, sorted by key inside the script so the two lists are comparable.
    values:
      source_keys: >-
        {{ {'v': outputs.source_read.vars.command_1} | jq(vars.parse_prog) | first | toJson }}
      secondary_keys: >-
        {{ {'v': outputs.mirror_read.vars.command_1} | jq(vars.parse_prog) | first | toJson }}

  - id: bounds_gate
    type: io.kestra.plugin.core.flow.If
    description: >-
      A namespace larger than max_keys is refused outright. A truncated keyset would read as a pile of
      orphans and the repair would delete live keys.
    condition: >-
      {{ (fromJson(outputs.parse.values.source_keys) | jq(vars.overflow_prog) | first)
         + (fromJson(outputs.parse.values.secondary_keys) | jq(vars.overflow_prog) | first) > 0 }}
    then:
      - id: namespace_too_large
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          The namespace {{ inputs.key_pattern }} holds more than {{ inputs.max_keys }} keys on at least
          one instance. Narrow the pattern or raise max_keys. Nothing was compared or changed.
    else:
      - id: bounds_ok
        type: io.kestra.plugin.core.log.Log
        message: >-
          Read {{ fromJson(outputs.parse.values.source_keys) | length }} keys on the source of truth
          and {{ fromJson(outputs.parse.values.secondary_keys) | length }} on the secondary.

  - id: diff
    type: io.kestra.plugin.core.output.OutputValues
    description: Classify every key in the union of the two keysets. Values are compared by SHA1 digest, so no cached value is ever logged.
    values:
      findings: >-
        {{ {'src': fromJson(outputs.parse.values.source_keys), 'dst': fromJson(outputs.parse.values.secondary_keys), 'tol': inputs.ttl_tolerance_seconds} | jq(vars.diff_prog) | first | toJson }}

  - id: plan
    type: io.kestra.plugin.core.output.OutputValues
    description: Split the findings into keys to copy from the source, keys to delete on the secondary and keys left alone.
    values:
      copies: >-
        {{ fromJson(outputs.diff.values.findings) | jq(vars.copy_prog) | first | toJson }}
      orphans: >-
        {{ fromJson(outputs.diff.values.findings) | jq(vars.orphan_prog) | first | toJson }}
      unsupported: >-
        {{ fromJson(outputs.diff.values.findings) | jq(vars.unsupported_prog) | first | toJson }}
      planned_at: "{{ now() }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ fromJson(outputs.diff.values.findings) | length }} divergences between
      {{ inputs.source_host }}:{{ inputs.source_port }} and {{ inputs.mirror_host }}:{{ inputs.mirror_port }}
      ({{ fromJson(outputs.plan.values.copies) | length }} to copy, {{ fromJson(outputs.plan.values.orphans) | length }} to delete,
      {{ fromJson(outputs.plan.values.unsupported) | length }} unsupported and untouched).
      {{ fromJson(outputs.diff.values.findings) | jq(vars.report_prog) | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.diff.values.findings) | length > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Redis mirror ' ~ inputs.mirror_host ~ ':' ~ inputs.mirror_port ~ ' has drifted from the designated source of truth ' ~ inputs.source_host ~ ':' ~ inputs.source_port ~ ': ' ~ (fromJson(outputs.diff.values.findings) | jq(vars.report_prog) | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Repairing the secondary now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: hold
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Repairing the secondary overwrites and deletes keys on it, so a human answers first.
              With no answer, nothing is written.
            pauseDuration: "{{ inputs.approval_timeout }}"
            onResume:
              - id: approved
                type: BOOL
                displayName: Copy the listed keys onto the secondary and delete its orphans?
                defaults: false
              - id: note
                type: STRING
                displayName: Decision note
                defaults: ""

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.hold.onResume.approved ?? false }}"
            then:
              - id: delete_gate
                type: io.kestra.plugin.core.flow.If
                condition: "{{ fromJson(outputs.plan.values.orphans) | length > 0 }}"
                then:
                  - id: delete_orphans
                    type: io.kestra.plugin.redis.string.Delete
                    description: Delete the keys the source of truth does not have. Runs against the secondary URL only.
                    url: "{{ render(vars.mirror_url) }}"
                    keys: "{{ fromJson(outputs.plan.values.orphans) }}"
                    failedOnMissing: false

              - id: remediate_copies
                type: io.kestra.plugin.core.flow.Loop
                description: >-
                  Copy each key from the source of truth onto the secondary, one at a time so two
                  writes never race on the same key. Reads come from the source, writes go to the secondary.
                concurrencyLimit: 1
                values: "{{ outputs.plan.values.copies }}"
                tasks:
                  - id: read_from_source
                    type: io.kestra.plugin.redis.string.Get
                    description: Read the authoritative value. GET cannot change the instance it reads.
                    url: "{{ render(vars.source_url) }}"
                    key: "{{ fromJson(item.value).key }}"
                    serdeType: STRING
                    failedOnMissing: false

                  - id: write_branch
                    type: io.kestra.plugin.core.flow.If
                    description: A volatile key is written with the source expiry as an absolute date, so a long approval does not extend it. A persistent key is written without one, which also clears a TTL the secondary had.
                    condition: "{{ fromJson(item.value).volatile }}"
                    then:
                      - id: write_volatile
                        type: io.kestra.plugin.redis.string.Set
                        url: "{{ render(vars.mirror_url) }}"
                        key: "{{ fromJson(item.value).key }}"
                        value: "{{ outputs.read_from_source.data }}"
                        serdeType: STRING
                        options:
                          expirationDate: "{{ outputs.plan.values.planned_at | dateAdd(fromJson(item.value).ttl, 'SECONDS') }}"
                    else:
                      - id: write_persistent
                        type: io.kestra.plugin.redis.string.Set
                        url: "{{ render(vars.mirror_url) }}"
                        key: "{{ fromJson(item.value).key }}"
                        value: "{{ outputs.read_from_source.data }}"
                        serdeType: STRING

              - id: reverify_source_read
                type: io.kestra.plugin.redis.cli.RedisCLI
                description: Read both instances again, so the proof comes from Redis rather than from the write tasks.
                host: "{{ inputs.source_host }}"
                port: "{{ inputs.source_port }}"
                password: "{{ inputs.source_password }}"
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.network }}"
                commands:
                  - >-
                    EVAL_RO "{{ render(vars.audit_lua) }}" 0 "{{ inputs.key_pattern }}" {{ inputs.max_keys }}

              - id: reverify_mirror_read
                type: io.kestra.plugin.redis.cli.RedisCLI
                host: "{{ inputs.mirror_host }}"
                port: "{{ inputs.mirror_port }}"
                password: "{{ inputs.mirror_password }}"
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.network }}"
                commands:
                  - >-
                    EVAL_RO "{{ render(vars.audit_lua) }}" 0 "{{ inputs.key_pattern }}" {{ inputs.max_keys }}

              - id: reverify_diff
                type: io.kestra.plugin.core.output.OutputValues
                description: The same comparison over the whole namespace again. Anything left, including a key a writer changed during the Pause, is unresolved.
                values:
                  remaining: >-
                    {{ {'src': ({'v': outputs.reverify_source_read.vars.command_1} | jq(vars.parse_prog) | first), 'dst': ({'v': outputs.reverify_mirror_read.vars.command_1} | jq(vars.parse_prog) | first), 'tol': inputs.ttl_tolerance_seconds} | jq(vars.diff_prog) | first | toJson }}

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ fromJson(outputs.reverify_diff.values.remaining) | jq('[.[] | select(.code != \"UNSUPPORTED\")] | length') | first > 0 }}"
                then:
                  - id: reconcile_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      The secondary still differs from the source of truth:
                      {{ fromJson(outputs.reverify_diff.values.remaining) | jq(vars.report_prog) | first }}.
                      Check that the connecting user on {{ inputs.mirror_host }} may run SET and DEL on
                      this namespace. Check that nothing else is writing to it.
                else:
                  - id: reconciled
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Reconciled and verified. Keys copied from {{ inputs.source_host }}:{{ inputs.source_port }}
                      onto {{ inputs.mirror_host }}:{{ inputs.mirror_port }}:
                      {{ fromJson(outputs.plan.values.copies) | length }}. Orphans deleted:
                      {{ fromJson(outputs.plan.values.orphans) | length }}. 0 divergence left.
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Repair declined or the approval timed out. Note: {{ outputs.hold.onResume.note ?? '' }}.
                  The secondary is unchanged.
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: >-
              Report only. auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }}, so
              no key was written or deleted on {{ inputs.mirror_host }}:{{ inputs.mirror_port }}.
    else:
      - id: in_sync
        type: io.kestra.plugin.core.log.Log
        message: >-
          The secondary matches the source of truth across {{ inputs.key_pattern }}: same keys, same
          value digests, same expiry.

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Redis cross instance reconcile guard failed for secondary ' ~ inputs.mirror_host ~ ':' ~ inputs.mirror_port ~ ' (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and always in safe mode.
    cron: "25 * * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Redis Cross Instance Key Reconcile Guard
  shortDescription: Diff a bounded key namespace between a Redis instance you designate as the source of truth and a secondary, alert Slack, then repair the secondary only and re-read both instances to prove it converged.
  metaTitle: Reconcile a drifting Redis mirror with Kestra
  metaDescription: Diff a key namespace between two Redis instances, repair the secondary behind an approval, then re-read both and fail if any divergence remains.
  description: |
    A second Redis instance kept as a read replica substitute, a regional mirror or a warm standby
    drifts from the authoritative instance the moment a mirroring job fails or a write path misses it.
    Reads served from the mirror then return a stale value or no value at all. Both instances answer
    `PING` happily, both report healthy memory, so nothing flags it. The first symptom is a cache miss
    storm or a customer seeing an old price.

    This blueprint diffs a bounded key namespace between the two instances and repairs the secondary.
    It reads each side with one read-only Lua script that returns every matching key with its type,
    its remaining TTL and a SHA1 digest of its value, so a value never has to travel through a log to
    be compared. Behind a dry run and a Pause it copies the missing and stale keys from the source,
    deletes the orphans, then reads both instances again and fails the run if anything still differs.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    Neither Redis instance is authoritative by nature. One of them has to be designated. Getting
    that backwards would overwrite good data with drifted data, which is worse than the drift. So the
    flow refuses to guess: `designated_source_of_truth` must spell out the source host and port. A
    mismatch or a blank value fails the run before a single key is read. The two instance input
    groups must also point at different instances.

    The source of truth has no write path at all.

    - It is read with `EVAL_RO`, so the server rejects a write from that script even if the script
      were edited. On Redis 7 a write inside `EVAL_RO` answers
      `ERR Write commands are not allowed from read-only scripts`.
    - The only other task pointed at it is `read_from_source` (`io.kestra.plugin.redis.string.Get`),
      which issues `GET`.
    - Every write task (`io.kestra.plugin.redis.string.Set`,
      `io.kestra.plugin.redis.string.Delete`) takes `mirror_url`. There is no task in the flow where a
      write verb meets the source connection.

    TTLs are carried, not dropped. Copying a volatile key without its expiry would silently turn it
    permanent, so the audit reads the remaining TTL next to the value and the repair writes it back:
    a volatile key is set with `expirationDate`, a persistent key is set without one, which also
    clears an expiry the secondary should not have had. A key whose bytes match on both sides but
    whose expiry does not is reported as `TTL_DRIFT` and repaired the same way.

    ## Findings

    | Finding | Meaning | Fix |
    |---|---|---|
    | `MISSING` | The source has the key, the secondary does not | `SET` it on the secondary with the source TTL |
    | `STALE` | Both have it, the value digests differ | `SET` the source value on the secondary |
    | `TTL_DRIFT` | Same bytes, different expiry beyond `ttl_tolerance_seconds` | `SET` it again with the source expiry |
    | `ORPHAN` | The secondary has a key the source does not | `DEL` it on the secondary |
    | `UNSUPPORTED` | The key is not a plain string on one of the sides | Reported, never touched |

    The namespace is read with `SCAN` inside the script, with the cursor drained before anything is
    compared. A partial keyset is never used: if either instance holds more than `max_keys` matching
    keys the run fails without diffing, because a truncated source keyset would report live keys as
    orphans and the repair would delete them.

    ## How it works

    1. `designation_gate` (`io.kestra.plugin.core.flow.If`) checks that
       `designated_source_of_truth` equals `source_host:source_port` and that the two instances are
       not the same one. Otherwise `not_designated` fails the run and nothing is read.
    2. `source_read` and `mirror_read` (`io.kestra.plugin.redis.cli.RedisCLI`) each run one `EVAL_RO`
       script that scans the namespace, sorts the keys and returns `key type ttl sha1 bytes` per line.
    3. `parse` turns both outputs into records. `bounds_gate` fails the run if either side reported the
       namespace overflowing `max_keys`.
    4. `diff` classifies every key in the union of the two keysets. `plan` splits the result into keys
       to copy, orphans to delete and unsupported keys to leave alone. `summary` logs the findings.
    5. `route` (`io.kestra.plugin.core.flow.If`):
       - **in sync:** `in_sync` logs it, nothing to do.
       - **drift:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false, otherwise
           `report_only` records that nothing was touched.
         - `hold` (`io.kestra.plugin.core.flow.Pause`) waits for an answer. Without one, nothing is written.
         - On approval `delete_orphans` (`io.kestra.plugin.redis.string.Delete`) removes the orphans,
           then `remediate_copies` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) reads each
           key from the source with `io.kestra.plugin.redis.string.Get` and writes it to the secondary
           with `io.kestra.plugin.redis.string.Set`, with or without a TTL.
         - `reverify_source_read` plus `reverify_mirror_read` read both instances again,
           `reverify_diff` repeats the comparison and `verify_result` fails the run if any divergence
           is left.
    6. `errors` posts to Slack when the flow fails.

    ## What you get

    - A key level diff between two live Redis instances, with one of them designated as the source of
      truth and the other the only one written to.
    - Four kinds of divergence named per key, including the expiry drift that a value only comparison
      misses.
    - A repair that carries TTLs, runs one key at a time, sits behind two flags plus a human answer,
      then proves itself with a second read of both instances.

    ## Who it's for

    - Teams running a second Redis as a regional mirror, a warm standby or a read replica substitute
      fed by their own mirroring job.
    - SREs who have served a stale value from a mirror and found out from a user.
    - Anyone migrating between Redis instances who needs to know the target matches the source before
      cutting traffic over.

    ## Why orchestrate this with Kestra

    The drift spans two systems that each look healthy on their own, so nothing reports it. Kestra
    reads both instances the same way, holds the designation as a required input, sends the diff to
    Slack, writes only behind `auto_remediate`, `dry_run` and a Pause, verifies the result against the
    instances themselves and keeps the history of every reconcile.

    ## Tested end to end

    On Kestra 2.0.5 OSS against two Redis 7 instances on one Docker network, `w34-redisx-src` as the
    designated source of truth and `w34-redisx-dst` as the secondary, with a local HTTP sink standing
    in for Slack. The source held 6 string keys under `mir:`, two of them volatile (`mir:e` at 3600s,
    `mir:f` at 7200s). The secondary was degraded in all four divergence classes across five keys:
    `mir:c` absent (MISSING), `mir:e` absent while volatile on the source (MISSING with a TTL to
    carry), `mir:d` holding a different value (STALE), `mir:f` holding the same bytes with no expiry
    (TTL_DRIFT) plus `mir:z` present only there (ORPHAN).

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults, degraded secondary | 5 divergences: MISSING `mir:c`, STALE `mir:d`, MISSING `mir:e` ttl=3586, TTL_DRIFT `mir:f` ttl=7186, ORPHAN `mir:z`. Alert sent, nothing changed, confirmed with `redis-cli` on both instances |
    | 2 | `auto_remediate: true`, `dry_run: true` | Same 5 divergences, gate stayed closed, `report_only` logged, no key changed |
    | 3 | `auto_remediate: true`, `dry_run: false`, Pause resumed with `approved: false` | `declined` logged. `redis-cli` on the secondary byte identical to before runs 2 and 3 |
    | 4 | `auto_remediate: true`, `dry_run: false`, Pause resumed with `approved: true` | Copied 4 keys, deleted 1 orphan, re-read reported 0 divergence. `redis-cli` on the secondary then held exactly the 6 source keys at the same digests, with `mir:e` carrying ttl 3485 against the source 3478 and `mir:f` carrying ttl 7085 where it had none |
    | 5 | clean secondary, defaults | 0 divergences, `in_sync` branch, no alert |
    | 6 | designation transposed to the secondary, `auto_remediate: true`, `dry_run: false` | `not_designated` failed the run before either instance was read, `errors` posted to Slack |
    | 7 | `max_keys: 2`, `auto_remediate: true`, `dry_run: false` | `namespace_too_large` failed the run after the reads, before the diff. Nothing compared, nothing changed |
    | 8 | approved, with a writer setting a new value for the in sync key `mir:a` on the secondary during the Pause | The repair fixed its 4 planned keys, then the second read found `STALE mir:a`, which was never in the plan. `verify_result` failed the run instead of reporting success |
    | 9 | unreachable source host | `source_read` failed, the run failed, the `errors` block posted to Slack |
    | 10 | approved, with a hash key `mir:h` added to the source namespace | Reported as `UNSUPPORTED` and left alone: 4 copies, 1 delete, run SUCCESS. `EXISTS mir:h` on the secondary returned 0 |

    Source of truth untouched: its 6 keys, their types, their value digests and their byte lengths were
    identical before and after the full remediation in run 4, read straight from `redis-cli` on the
    source, with only its own TTL countdown moving. A write attempted through `EVAL_RO` against it was
    refused by the server with `ERR Write commands are not allowed from read-only scripts`.

    Detector proof: the same pair reported 5 divergences degraded and 0 when in sync, both matching what
    `redis-cli` showed key by key. Four separate runs failed on purpose: a transposed designation, an
    oversized namespace, a concurrent writer caught by the re-verify, plus an unreachable instance.

    ## Prerequisites

    - Two reachable Redis 7+ instances (for `EVAL_RO`), one designated as the source of truth.
    - String keys under a namespace narrow enough to read in one run. A key that is a hash, a list, a
      set or a stream is reported and left alone.
    - For the audit, a user on each instance allowed to run `EVAL_RO`, `SCAN`, `TYPE`, `GET` and
      `PTTL`. For the repair, a user on the secondary allowed to run `SET` and `DEL`. The source needs
      no write rights at all, which is the posture to grant it.
    - Local testing:
      - `docker run -d --name src --network kw7 redis:7-alpine redis-server --save ''`;
      - `docker run -d --name dst --network kw7 redis:7-alpine redis-server --save ''`;
      - seed a few keys on the source, copy most of them to the destination, then leave one out, change
        one value, drop one expiry and add one key the source does not have.

    ### Secrets

    - `REDIS_SOURCE_PASSWORD`: password for the source of truth, read by the audit tasks.
    - `REDIS_MIRROR_PASSWORD`: password for the secondary, read by the audit plus the repair tasks.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64 encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `source_host` / `source_port` | localhost, 6379 | The instance that is only read |
    | `source_password` | `secret('REDIS_SOURCE_PASSWORD')` | Source password |
    | `mirror_host` / `mirror_port` | localhost, 6380 | The secondary, the only instance written to |
    | `mirror_password` | `secret('REDIS_MIRROR_PASSWORD')` | Secondary password |
    | `designated_source_of_truth` | empty | Must equal `source_host:source_port` or the run refuses |
    | `key_pattern` | `mirror:*` | The namespace to reconcile |
    | `max_keys` | `1000` | Namespace ceiling, over it the run fails without diffing |
    | `ttl_tolerance_seconds` | `60` | How far two expiries may differ before it counts as drift |
    | `network` | empty | Docker network for the `redis-cli` container |
    | `approval_timeout` | `PT1H` | How long the Pause waits |
    | `auto_remediate` | `false` | Allow writes to the secondary |
    | `dry_run` | `true` | Must be `false` for a change to apply |

    ## Quick start

    1. Add the `REDIS_SOURCE_PASSWORD`, `REDIS_MIRROR_PASSWORD` plus `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, point the two instance input groups at your instances, set `key_pattern` to one
       namespace and set `designated_source_of_truth` to the source host and port.
    3. Run it once and read the findings.
    4. Run it with `auto_remediate: true` and `dry_run: false`, answer the Pause, then read the
       `reconciled` log for the proof.
    5. Enable the `hourly` trigger, which always runs in safe mode.

    ## How to extend

    - Reconcile a namespace too large for one run by passing a cursor between runs in a KV store and
      reconciling one slice per execution.
    - Add hash keys by returning a digest of the sorted field list from the script and repairing with
      `HSET`.
    - Fan out to several mirrors by looping over a list of secondary hosts, each diffed against the one
       designated source.
    - Make the diff report only, by setting `auto_remediate` to false on a schedule, then feed the
      findings into a dashboard.

