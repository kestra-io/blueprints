id: faa-nas-ground-stop-delay-alert
namespace: company.team

description: |
  Air traffic management watch for a list of US airports, built on the keyless FAA National
  Airspace System (NAS) Status API. Every 10 minutes the flow reads every active ground stop,
  ground delay program (GDP), airport closure and arrival or departure delay in one request,
  keeps the airports you watch, diffs them against a DuckDB ledger and alerts on new, changed
  and cleared programs. Every change is appended to the ledger's event log.

inputs:
  - id: airports
    type: ARRAY
    itemType: STRING
    displayName: Watched airports
    description: FAA location ids (SFO, EWR). Four-letter ICAO ids of the contiguous US (KLAX) are accepted and shortened. Use `*` to watch every airport in the feed.
    defaults: ["SFO", "LAX", "SAN", "LAS", "DEN", "ORD", "ATL", "EWR", "JFK", "LGA", "PHL", "TEB", "BOS"]

  - id: min_delay_minutes
    type: INT
    defaults: 30
    description: |
      Arrival and departure delays are reported when their upper bound reaches this many minutes; once reported they stay
      tracked until the FAA removes them, so a delay flapping between 29 and 30 minutes does not alert twice. An active
      program is reported again (UPDATED) when its maximum delay grows by this much. Ground stops, GDPs and closures always count.

  - id: include_ga_restrictions
    type: BOOL
    defaults: false
    description: The FAA feed also lists long-running NOTAMs such as "AD AP CLSD TO NON SKED TRANSIENT GA ACFT EXC PPR". They matter to charter and business aviation, not to airline passengers, so they are off by default.

triggers:
  - id: every_10_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    description: Ground stops are often issued for 30 to 60 minutes at a time; a 10-minute check catches them and their extensions.

tasks:
  - id: fetch_events
    type: io.kestra.plugin.core.http.Download
    description: One request returns every airport with an active event. Each item has optional `groundStop`, `groundDelay`, `airportClosure`, `arrivalDelay`, `departureDelay`, `freeForm` (NOTAM) and `deicing` objects. Deicing is ignored. A non-JSON body (error page) makes the DuckDB task fail before the ledger is saved, so it is never read as "everything cleared".
    uri: https://nasstatus.faa.gov/api/airport-events
    headers:
      User-Agent: "kestra-faa-nas-ground-stop-delay-alert/1.0 (+https://kestra.io)"
      Accept: application/json
    retry:
      type: constant
      interval: PT30S
      maxAttempts: 3

  - id: previous_ledger
    type: io.kestra.plugin.core.kv.Get
    key: faa_nas_ledger_uri
    errorOnMissing: false
    description: Internal-storage URI of the DuckDB ledger written by the previous run.

  - id: first_run
    type: io.kestra.plugin.core.flow.If
    description: Creates an empty ledger on the first run (or after the KV key is deleted), which makes that run the BASELINE.
    condition: "{{ outputs.previous_ledger.value is not defined or outputs.previous_ledger.value is empty }}"
    then:
      - id: init_ledger
        type: io.kestra.plugin.jdbc.duckdb.Queries
        outputDbFile: true
        sql: |
          CREATE TABLE active_programs (event_key VARCHAR PRIMARY KEY, airport VARCHAR, program VARCHAR, reason VARCHAR,
            end_time VARCHAR, max_delay_min INTEGER, first_seen TIMESTAMPTZ, last_seen TIMESTAMPTZ);
          CREATE TABLE event_log (logged_at TIMESTAMPTZ, execution_id VARCHAR, change VARCHAR, event_key VARCHAR, airport VARCHAR,
            airport_name VARCHAR, program VARCHAR, reason VARCHAR, start_time VARCHAR, end_time VARCHAR, avg_delay_min INTEGER,
            max_delay_min INTEGER, extension_probability VARCHAR, advisory_url VARCHAR);
          CREATE TABLE runs (checked_at TIMESTAMPTZ, execution_id VARCHAR, feed_airports INTEGER, watched_programs INTEGER, changes INTEGER);

  - id: diff_programs
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      The ledger holds `active_programs` (what was in effect at the last run), `event_log` (every NEW, UPDATED and CLEARED
      change) and `runs`. One row per airport and program type: GROUND_STOP, GDP, CLOSURE, ARRIVAL_DELAY, DEPARTURE_DELAY and
      GA_RESTRICTION. A program is UPDATED when its reason or end time changes (ground stop extended, GDP revised) or when its
      maximum delay grows by `min_delay_minutes`. A program that is gone from the feed is CLEARED; one that is only filtered
      out now (airport removed from the watch list, GA restrictions switched off) is dropped without an alert.
    databaseUri: "{{ outputs.previous_ledger.value ?? outputs.init_ledger.databaseUri }}"
    outputDbFile: true
    timeZoneId: UTC
    fetchType: FETCH
    inputFiles:
      events.json: "{{ outputs.fetch_events.uri }}"
    parameters:
      airports: "{{ inputs.airports | toJson }}"
      min_delay: "{{ inputs.min_delay_minutes }}"
      include_ga: "{{ inputs.include_ga_restrictions }}"
      execution_id: "{{ execution.id }}"
    sql: |
      SET TimeZone = 'UTC';

      CREATE OR REPLACE TEMP TABLE feed AS SELECT unnest(from_json(content, '["JSON"]')) AS j FROM read_text('events.json');

      CREATE OR REPLACE TEMP TABLE watch AS
      SELECT DISTINCT CASE WHEN regexp_full_match(v, 'K[A-Z]{3}') THEN substr(v, 2) ELSE v END AS airport,
             v = '*' OR regexp_full_match(v, '[A-Z0-9]{3}|K[A-Z]{3}') AS valid
      FROM (SELECT upper(trim(unnest(from_json(:airports, '["VARCHAR"]')))) AS v) WHERE v <> '';

      CREATE OR REPLACE TEMP TABLE parsed AS
      WITH programs AS (
        SELECT j->>'$.airportId' AS airport, j->>'$.airportLongName' AS airport_name, p.program, json_extract(j, '$.' || p.field) AS e
        FROM feed CROSS JOIN (VALUES ('GROUND_STOP', 'groundStop'), ('GDP', 'groundDelay'), ('CLOSURE', 'airportClosure'),
          ('ARRIVAL_DELAY', 'arrivalDelay'), ('DEPARTURE_DELAY', 'departureDelay'), ('GA_RESTRICTION', 'freeForm')) p(program, field))
      SELECT airport || '|' || program AS event_key, airport, airport_name, program,
             coalesce(e->>'$.impactingCondition', e->>'$.reason', e->>'$.simpleText') AS reason,
             e->>'$.startTime' AS start_time, e->>'$.endTime' AS end_time,
             CAST(round(TRY_CAST(coalesce(e->>'$.avgDelay', e->>'$.averageDelay') AS DOUBLE)) AS INTEGER) AS avg_delay_min,
             -- GDPs give minutes, arrival and departure delays a phrase such as '1 hour and 5 minutes'
             coalesce(TRY_CAST(e->>'$.maxDelay' AS INTEGER), CASE WHEN e->>'$.arrivalDeparture.max' IS NOT NULL THEN
               coalesce(TRY_CAST(regexp_extract(e->>'$.arrivalDeparture.max', '(\d+) hour', 1) AS INTEGER), 0) * 60
               + coalesce(TRY_CAST(regexp_extract(e->>'$.arrivalDeparture.max', '(\d+) minute', 1) AS INTEGER), 0) END) AS max_delay_min,
             e->>'$.probabilityOfExtension' AS extension_probability, e->>'$.advisoryUrl' AS advisory_url
      FROM programs WHERE json_type(e) = 'OBJECT';

      CREATE OR REPLACE TEMP TABLE cur AS
      SELECT * FROM parsed
      WHERE (airport IN (SELECT airport FROM watch) OR EXISTS (SELECT 1 FROM watch WHERE airport = '*'))
        AND (program <> 'GA_RESTRICTION' OR CAST(:include_ga AS BOOLEAN))
        AND (program NOT IN ('ARRIVAL_DELAY', 'DEPARTURE_DELAY') OR coalesce(max_delay_min, 0) >= CAST(:min_delay AS INTEGER)
             OR event_key IN (SELECT event_key FROM active_programs));

      CREATE OR REPLACE TEMP TABLE changes AS
      SELECT CASE WHEN a.event_key IS NULL THEN 'NEW' ELSE 'UPDATED' END AS change, c.*,
             a.end_time AS previous_end_time, a.max_delay_min AS previous_max_delay_min
      FROM cur c LEFT JOIN active_programs a ON a.event_key = c.event_key
      WHERE a.event_key IS NULL OR c.reason IS DISTINCT FROM a.reason OR c.end_time IS DISTINCT FROM a.end_time
         OR coalesce(c.max_delay_min, 0) >= coalesce(a.max_delay_min, 0) + CAST(:min_delay AS INTEGER)
      UNION ALL BY NAME
      SELECT 'CLEARED' AS change, event_key, airport, program, reason, end_time, max_delay_min
      FROM active_programs
      WHERE event_key NOT IN (SELECT event_key FROM parsed)
        AND (airport IN (SELECT airport FROM watch) OR EXISTS (SELECT 1 FROM watch WHERE airport = '*'));

      INSERT INTO event_log SELECT now(), :execution_id, change, event_key, airport, airport_name, program, reason, start_time, end_time,
        avg_delay_min, max_delay_min, extension_probability, advisory_url FROM changes;
      INSERT INTO runs SELECT now(), :execution_id, (SELECT count(*) FROM feed), (SELECT count(*) FROM cur), (SELECT count(*) FROM changes);

      -- Changed programs store the values that were alerted on, so slow drifts still add up to an UPDATED
      DELETE FROM active_programs WHERE event_key NOT IN (SELECT event_key FROM cur);
      INSERT INTO active_programs
      SELECT event_key, airport, program, reason, end_time, max_delay_min, now(), now() FROM changes WHERE change <> 'CLEARED'
      ON CONFLICT (event_key) DO UPDATE SET reason = excluded.reason, end_time = excluded.end_time, max_delay_min = excluded.max_delay_min;
      UPDATE active_programs SET last_seen = now();

      CREATE OR REPLACE TEMP TABLE alert_lines AS
      SELECT *, CASE program WHEN 'GROUND_STOP' THEN 0 WHEN 'CLOSURE' THEN 1 WHEN 'GDP' THEN 2 ELSE 3 END AS rank,
             change || ' ' || replace(program, '_', ' ') || ' at *' || airport || '*' || coalesce(' (' || airport_name || ')', '')
             || coalesce(' - ' || reason, '')
             || CASE WHEN change = 'CLEARED' THEN '' ELSE
                  coalesce(', avg ' || avg_delay_min || ' min', '') || coalesce(', max ' || max_delay_min || ' min', '')
                  || CASE WHEN previous_max_delay_min <> max_delay_min THEN ' (was ' || previous_max_delay_min || ')' ELSE '' END
                  || coalesce(', until ' || replace(substr(end_time, 1, 16), 'T', ' ') || 'Z', '')
                  || CASE WHEN previous_end_time <> end_time THEN ' (was ' || replace(substr(previous_end_time, 1, 16), 'T', ' ') || 'Z)' ELSE '' END
                  || coalesce(', extension probability ' || extension_probability, '')
                  || coalesce(' <' || replace(advisory_url, ' ', '%20') || '|advisory>', '') END AS line
      FROM changes;

      SELECT change, airport, program, reason, end_time, max_delay_min, line FROM alert_lines ORDER BY rank, airport, change;

      SELECT (SELECT count(*) FROM runs) = 1 AS is_baseline,
             (SELECT count(*) FROM feed) AS feed_airports,
             (SELECT count(*) FROM watch WHERE valid) AS watched_airports,
             (SELECT coalesce(string_agg(airport, ', '), '') FROM watch WHERE NOT valid) AS invalid_ids,
             (SELECT count(*) FROM cur) AS active_programs,
             (SELECT coalesce(string_agg(airport || ' ' || program, ', ' ORDER BY airport), 'none') FROM cur) AS active_list,
             (SELECT count(*) FILTER (WHERE change = 'NEW') FROM changes) AS new_programs,
             (SELECT count(*) FILTER (WHERE change = 'UPDATED') FROM changes) AS updated_programs,
             (SELECT count(*) FILTER (WHERE change = 'CLEARED') FROM changes) AS cleared_programs,
             (SELECT count(*) FILTER (WHERE change <> 'CLEARED' AND program = 'GROUND_STOP') > 0 FROM changes) AS has_ground_stop,
             (SELECT count(*) FROM changes) AS changes,
             (SELECT coalesce(string_agg(line, chr(10) ORDER BY rank, airport, change), '') FROM alert_lines) AS alert_text,
             (SELECT count(*) FROM event_log) AS logged_events;

  - id: save_ledger
    type: io.kestra.plugin.core.kv.Set
    key: faa_nas_ledger_uri
    value: "{{ outputs.diff_programs.databaseUri }}"

  - id: notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.diff_programs.outputs[1].rows[0].changes > 0 }}"
    then:
      - id: log_changes
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.diff_programs.outputs[1].rows[0].alert_text }}"

      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": {{ ((outputs.diff_programs.outputs[1].rows[0].has_ground_stop ? '<!here> ' : '') ~ '*FAA traffic management update for your airports*' ~ (outputs.diff_programs.outputs[1].rows[0].is_baseline ? ' (first run, programs already in effect)' : '') ~ '\n' ~ outputs.diff_programs.outputs[1].rows[0].alert_text) | toJson }}}
    else:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No new, changed or cleared program. In effect: {{ outputs.diff_programs.outputs[1].rows[0].active_list }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.diff_programs.outputs[1].rows[0].feed_airports }} airports in the FAA feed, {{ outputs.diff_programs.outputs[1].rows[0].watched_airports }} watched{{ outputs.diff_programs.outputs[1].rows[0].is_baseline ? ' (BASELINE run)' : '' }}:
      {{ outputs.diff_programs.outputs[1].rows[0].active_programs }} programs in effect, {{ outputs.diff_programs.outputs[1].rows[0].new_programs }} new,
      {{ outputs.diff_programs.outputs[1].rows[0].updated_programs }} updated, {{ outputs.diff_programs.outputs[1].rows[0].cleared_programs }} cleared;
      {{ outputs.diff_programs.outputs[1].rows[0].logged_events }} events in the ledger.{{ outputs.diff_programs.outputs[1].rows[0].invalid_ids != '' ? ' Ignored ids: ' ~ outputs.diff_programs.outputs[1].rows[0].invalid_ids : '' }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.diff_programs.outputs[1].rows[0] }}"
  - id: changes
    type: JSON
    value: "{{ outputs.diff_programs.outputs[0].rows }}"
  - id: ledger
    type: FILE
    value: "{{ outputs.diff_programs.databaseUri }}"

extend:
  title: FAA Ground Stop, Ground Delay Program and Airport Delay Alerts
  metaTitle: FAA NAS Ground Stop and Ground Delay Program Alerts | Kestra
  shortDescription: Every 10 minutes, read the FAA NAS Status airport events, keep the airports you watch and alert on new, changed and cleared ground stops, ground delay programs, closures and delays, with a DuckDB event ledger.
  metaDescription: Watch FAA NAS Status for ground stops, ground delay programs, closures and delays at your airports, with Slack alerts and a DuckDB event ledger.
  description: |
    When the FAA Command Center issues a ground stop or a ground delay program (GDP), flights to that airport are held at their origin, often for hours. The FAA NAS Status site publishes every active traffic management event in one keyless JSON request. This flow watches it for your airports, alerts when a program starts, changes or ends, and keeps a ledger of each change. It covers air traffic programs, not airport weather.

    ## How it works

    1. A `Schedule` trigger runs every 10 minutes.
    2. `fetch_events` (HTTP Download) calls `/api/airport-events` once: one item per airport with an active event.
    3. `previous_ledger` (KV Get) reads the URI of the DuckDB ledger. `first_run` (If) creates an empty one when it is missing,, making that run the BASELINE that reports programs already in effect.
    4. `diff_programs` (DuckDB) flattens the feed to one row per airport and program type and filters it:
       - ICAO ids such as KLAX are shortened to FAA ids (LAX); `*` watches everything; malformed ids are listed as ignored.
       - Arrival and departure delays ("1 hour and 5 minutes" is parsed) count from `min_delay_minutes` and then stay tracked until the FAA removes them, so 29/30-minute flapping does not alert twice.
       - Long-running GA-only NOTAMs ("CLSD TO NON SKED TRANSIENT GA ACFT EXC PPR") are off unless `include_ga_restrictions` is true.
       - A program is NEW, UPDATED (reason or end time changed, or maximum delay grown by `min_delay_minutes`) or CLEARED (gone from the feed), and logged to `event_log`. Programs only filtered out now (shorter watch list, GA switch off) are dropped without a false CLEARED.
    5. `save_ledger` (KV Set) stores the new ledger URI.
    6. `notify` (If) logs the changes at WARN and posts them to Slack (`@here` for a ground stop) with delays, old and new end times and the advisory link. Otherwise it logs what is still in effect.

    ## What you get

    - One alert line per change, ground stops and closures first.
    - A DuckDB ledger (flow output `ledger`) with the event history.
    - Flow outputs `summary` and `changes` as JSON.

    ## Who it's for

    - Corporate travel and duty-of-care teams.
    - Charter and business aviation dispatchers, airline and airport operations centres.

    ## Why orchestrate this with Kestra

    - One retried request per run, state in the KV store, logic in readable SQL.
    - Each execution writes its own ledger file, so past states stay inspectable.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins, and outbound HTTPS to `nasstatus.faa.gov` (no API key).
    - `/api/airport-events` feeds the public NAS Status dashboard and has no published schema; the field names are the ones the dashboard uses.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the alerts (optional; without it the Slack task warns and the run continues).

    ## Quick start

    1. **Execute** with the defaults: a BASELINE listing the programs in effect at 13 busy US airports.
    2. Execute again: nothing new, and the `nothing_new` branch lists what is still in effect.
    3. Set `include_ga_restrictions` to true and add `KLAX` and `XX9Z`: LAX's GA restriction appears and `XX9Z` is ignored.
    4. Put in your airports, add `SLACK_WEBHOOK_URL` and keep the schedule on.

    ## How to extend

    - Use `includedFacilities` (origin centres held by the program) to alert only when your departure city is in scope.
    - Join the ledger to your travellers' itineraries to warn affected passengers.

    ## Links

    - [FAA NAS Status](https://nasstatus.faa.gov/)
    - [ATCSCC advisories database](https://www.fly.faa.gov/adv/advADB)
    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download) and [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
