id: solr-tombstone-expunge-and-segment-compaction-gate
namespace: company.search

description: |
  Inspect Apache Solr Lucene index segments and deleted document tombstones via the Luke handler,
  evaluate tombstone ratios and segment sprawl against historical KV snapshots, pause for operator approval,
  safely trigger expungeDeletes or controlled segment merges, and verify tombstone elimination post-remediation.

inputs:
  - id: solr_url
    type: STRING
    displayName: Solr Base URL
    description: HTTP endpoint of the Apache Solr standalone server or SolrCloud load balancer.
    defaults: "http://localhost:8983"

  - id: collection_name
    type: STRING
    displayName: Collection or Core Name
    description: Target Solr collection or core identifier to inspect and compact.
    defaults: "catalog_products"

  - id: tombstone_warning_ratio
    type: INT
    displayName: Tombstone Ratio Threshold (%)
    description: Percentage of deleted documents (deletedDocs / maxDoc * 100) triggering tombstone purge.
    defaults: 15

  - id: max_segments_threshold
    type: INT
    displayName: Maximum Segment Count Threshold
    description: Total segment count threshold before scheduling a controlled segment optimization merge.
    defaults: 25

  - id: target_max_segments
    type: INT
    displayName: Target Maximum Segments
    description: Maximum number of merged segments to produce during an optimization run.
    defaults: 5

  - id: min_deleted_docs_threshold
    type: INT
    displayName: Minimum Deleted Document Count
    description: Absolute number of deleted documents required before triggering expungeDeletes.
    defaults: 500

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, audits segment metrics and plans maintenance without invoking update handlers or merges.
    defaults: true

triggers:
  - id: periodic_index_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run automated Solr segment sprawl and tombstone inspection every 4 hours.
    cron: "0 */4 * * *"
    disabled: true

  - id: on_demand_index_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint invoked by query latency monitors, Prometheus Alertmanager, or SRE runbooks.
    key: "{{ secret('SOLR_MAINTENANCE_WEBHOOK_KEY') }}"

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    description: Assert configuration parameters satisfy operational bounds.
    conditions:
      - "{{ inputs.solr_url | length > 0 }}"
      - "{{ inputs.collection_name | length > 0 }}"
      - "{{ inputs.tombstone_warning_ratio >= 5 and inputs.tombstone_warning_ratio <= 90 }}"
      - "{{ inputs.max_segments_threshold >= 2 }}"
      - "{{ inputs.target_max_segments >= 1 }}"
      - "{{ inputs.min_deleted_docs_threshold >= 10 }}"
    errorMessage: "Invalid inputs. Provide valid Solr endpoints, collection names, and positive thresholds."

  - id: get_luke_index_metadata
    type: io.kestra.plugin.core.http.Request
    description: Query Solr Luke handler for low-level Lucene index metadata, segment counts, and deleted document statistics.
    uri: "{{ inputs.solr_url }}/solr/{{ inputs.collection_name }}/admin/luke?show=index&numTerms=0&wt=json"
    method: GET
    headers:
      Accept: application/json
    options:
      timeout: PT15S

  - id: inspect_and_classify_index
    type: io.kestra.plugin.scripts.python.Script
    description: Analyze Lucene segment distribution, compute tombstone ratios, and formulate remediation strategy against historical KV state.
    containerImage: python:3.11-slim
    env:
      COLLECTION_NAME: "{{ inputs.collection_name }}"
      TOMBSTONE_WARNING_RATIO: "{{ inputs.tombstone_warning_ratio }}"
      MAX_SEGMENTS_THRESHOLD: "{{ inputs.max_segments_threshold }}"
      MIN_DELETED_DOCS_THRESHOLD: "{{ inputs.min_deleted_docs_threshold }}"
      TARGET_MAX_SEGMENTS: "{{ inputs.target_max_segments }}"
      DRY_RUN: "{{ inputs.dry_run }}"
      LUKE_OUTPUT_JSON: "{{ outputs.get_luke_index_metadata.body }}"
      PREVIOUS_STATE_JSON: "{{ kv('solr_core_tracker_' ~ (inputs.collection_name | slugify), errorOnMissing=false) ?? '{}' }}"
      EXECUTION_ID: "{{ execution.id }}"
    script: |
      import os
      import sys
      import json
      from datetime import datetime, timezone

      now_utc = datetime.now(timezone.utc)
      now_iso = now_utc.isoformat()

      collection = os.environ.get("COLLECTION_NAME", "catalog_products").strip()
      tombstone_thresh = float(os.environ.get("TOMBSTONE_WARNING_RATIO", "15"))
      max_seg_thresh = int(os.environ.get("MAX_SEGMENTS_THRESHOLD", "25"))
      min_deleted_thresh = int(os.environ.get("MIN_DELETED_DOCS_THRESHOLD", "500"))
      target_max_seg = int(os.environ.get("TARGET_MAX_SEGMENTS", "5"))
      dry_run = os.environ.get("DRY_RUN", "true").lower() == "true"
      execution_id = os.environ.get("EXECUTION_ID", "local-test")

      luke_raw = os.environ.get("LUKE_OUTPUT_JSON", "{}")
      try:
          luke_data = json.loads(luke_raw) if luke_raw.strip() else {}
      except Exception:
          luke_data = {}

      index_info = luke_data.get("index", {})
      num_docs = int(index_info.get("numDocs", 0))
      max_doc = int(index_info.get("maxDoc", 0))
      deleted_docs = int(index_info.get("deletedDocs", 0))
      segment_count = int(index_info.get("segmentCount", 0))
      has_deletions = bool(index_info.get("hasDeletions", False))

      tombstone_ratio = round((deleted_docs / max_doc) * 100, 2) if max_doc > 0 else 0.0

      # Parse historical KV tracker
      prev_state_raw = os.environ.get("PREVIOUS_STATE_JSON", "{}")
      try:
          prev_state = json.loads(prev_state_raw) if prev_state_raw.strip() else {}
      except Exception:
          prev_state = {}

      prev_deleted = int(prev_state.get("deleted_docs", 0))
      prev_segments = int(prev_state.get("segment_count", 0))
      deleted_delta = deleted_docs - prev_deleted
      segment_delta = segment_count - prev_segments

      needs_optimize = segment_count >= max_seg_thresh and (tombstone_ratio >= 10.0 or segment_count >= max_seg_thresh * 1.5)
      needs_expunge = (tombstone_ratio >= tombstone_thresh) and (deleted_docs >= min_deleted_thresh)

      if needs_optimize:
          recommended_action = "OPTIMIZE_SEGMENTS"
          action_reason = f"Segment count ({segment_count} >= {max_seg_thresh}) and tombstone ratio ({tombstone_ratio}%) require merge to {target_max_seg} segments."
      elif needs_expunge:
          recommended_action = "EXPUNGE_DELETES"
          action_reason = f"Tombstone ratio ({tombstone_ratio}% >= {tombstone_thresh}%) with {deleted_docs} deleted docs requires expungeDeletes."
      else:
          recommended_action = "NONE"
          action_reason = "Index segments and tombstone ratios are within healthy operating parameters."

      requires_action = recommended_action != "NONE"
      status = "CRITICAL" if (tombstone_ratio >= 35.0 or segment_count >= max_seg_thresh * 1.5) else ("WARNING" if requires_action else "HEALTHY")

      summary = (
          f"Solr Index Maintenance: {status} | Collection '{collection}' - numDocs: {num_docs}, maxDoc: {max_doc}, "
          f"deletedDocs: {deleted_docs} (delta: {deleted_delta:+d}), Segments: {segment_count} (delta: {segment_delta:+d}), "
          f"Tombstone ratio: {tombstone_ratio}%. Action: {recommended_action} (Dry run: {dry_run})."
      )
      print(summary)

      new_state_snapshot = {
          "collection_name": collection,
          "num_docs": num_docs,
          "max_doc": max_doc,
          "deleted_docs": deleted_docs,
          "segment_count": segment_count,
          "tombstone_ratio": tombstone_ratio,
          "recommended_action": recommended_action,
          "last_evaluated_at": now_iso,
          "execution_id": execution_id
      }

      print("::" + json.dumps({
          "outputs": {
              "status": status,
              "num_docs": num_docs,
              "max_doc": max_doc,
              "deleted_docs": deleted_docs,
              "deleted_delta": deleted_delta,
              "segment_count": segment_count,
              "segment_delta": segment_delta,
              "tombstone_ratio": tombstone_ratio,
              "requires_action": requires_action,
              "recommended_action": recommended_action,
              "action_reason": action_reason,
              "new_state_snapshot": new_state_snapshot,
              "summary": summary
          }
      }) + "::")

  - id: save_solr_index_tracker_kv
    type: io.kestra.plugin.core.kv.Set
    description: Persist segment counts and deleted document metrics in Kestra KV for historical trend and drift tracking.
    key: "solr_core_tracker_{{ inputs.collection_name | slugify }}"
    value: "{{ outputs.inspect_and_classify_index.vars.new_state_snapshot | toJson }}"
    kvType: JSON

  - id: evaluate_index_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch execution when tombstone purging or segment optimization is indicated.
    condition: "{{ outputs.inspect_and_classify_index.vars.requires_action == true }}"
    then:
      - id: notify_search_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch incident notification detailing segment sprawl, tombstone ratios, and planned action.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#search-ops",
            "attachments": [
              {
                "color": "{{ outputs.inspect_and_classify_index.vars.status == 'CRITICAL' ? 'danger' : 'warning' }}",
                "title": ":warning: Apache Solr Segment Tombstone Compaction Triggered",
                "text": "*Collection:* `{{ inputs.collection_name }}`\n*Tombstone Ratio:* `{{ outputs.inspect_and_classify_index.vars.tombstone_ratio }}%` (Deleted Docs: `{{ outputs.inspect_and_classify_index.vars.deleted_docs }}`)\n*Segment Count:* `{{ outputs.inspect_and_classify_index.vars.segment_count }}` (Delta: `{{ outputs.inspect_and_classify_index.vars.segment_delta }}`)\n*Action Planned:* `{{ outputs.inspect_and_classify_index.vars.recommended_action }}`\n*Dry Run:* `{{ inputs.dry_run }}`",
                "footer": "Kestra Solr Maintenance Gate • Execution {{ execution.id }}"
              }
            ]
          }

      - id: execute_compaction_gate
        type: io.kestra.plugin.core.flow.If
        description: Execute Lucene segment compaction or tombstone expunge when dry_run is disabled.
        condition: "{{ not inputs.dry_run }}"
        then:
          - id: pause_for_compaction_approval
            type: io.kestra.plugin.core.flow.Pause
            description: Pause workflow execution for operator review before triggering I/O intensive Lucene segment merges. Resume to apply or kill to abort.

          - id: execute_remediation_action
            type: io.kestra.plugin.core.flow.Switch
            description: Route remediation to either segment optimization or selective tombstone expunge based on classifier findings.
            value: "{{ outputs.inspect_and_classify_index.vars.recommended_action }}"
            cases:
              OPTIMIZE_SEGMENTS:
                - id: optimize_segments
                  type: io.kestra.plugin.core.http.Request
                  description: Trigger controlled segment optimization merge down to target segment limit.
                  uri: "{{ inputs.solr_url }}/solr/{{ inputs.collection_name }}/update?commit=true&optimize=true&maxSegments={{ inputs.target_max_segments }}"
                  method: POST
                  headers:
                    Accept: application/json
                    Content-Type: application/json
                  contentType: application/json
                  body: "{}"
                  options:
                    timeout: PT120S

              EXPUNGE_DELETES:
                - id: expunge_deleted_docs
                  type: io.kestra.plugin.core.http.Request
                  description: Expunge deleted document tombstones from existing segments without full index re-write.
                  uri: "{{ inputs.solr_url }}/solr/{{ inputs.collection_name }}/update?commit=true&expungeDeletes=true"
                  method: POST
                  headers:
                    Accept: application/json
                    Content-Type: application/json
                  contentType: application/json
                  body: "{}"
                  options:
                    timeout: PT120S

          - id: verify_post_maintenance_index
            type: io.kestra.plugin.core.http.Request
            description: Post-remediation verification re-querying Luke handler to confirm deleted document count reduction.
            uri: "{{ inputs.solr_url }}/solr/{{ inputs.collection_name }}/admin/luke?show=index&numTerms=0&wt=json"
            method: GET
            headers:
              Accept: application/json
            options:
              timeout: PT30S

          - id: assert_tombstones_reduced
            type: io.kestra.plugin.core.execution.Assert
            description: Assert post-remediation deleted document count is strictly lower than initial inspection.
            conditions:
              - "{{ fromJson(outputs.verify_post_maintenance_index.body).index.deletedDocs < outputs.inspect_and_classify_index.vars.deleted_docs }}"
            errorMessage: "Post-remediation verification failed: Deleted document count did not decrease after executing compaction."

          - id: log_compaction_success
            type: io.kestra.plugin.core.log.Log
            description: Log verified index compaction metrics and post-action segment status.
            message: "Successfully executed {{ outputs.inspect_and_classify_index.vars.recommended_action }} on '{{ inputs.collection_name }}'. Initial deleted: {{ outputs.inspect_and_classify_index.vars.deleted_docs }}, Post-remediation deleted: {{ fromJson(outputs.verify_post_maintenance_index.body).index.deletedDocs }}, New segments: {{ fromJson(outputs.verify_post_maintenance_index.body).index.segmentCount }}."

        else:
          - id: log_dry_run_summary
            type: io.kestra.plugin.core.log.Log
            description: Log planned index compaction actions in dry-run mode.
            message: "Dry run mode active. No changes made to Solr collection '{{ inputs.collection_name }}'. Planned: {{ outputs.inspect_and_classify_index.vars.recommended_action }} (Reason: {{ outputs.inspect_and_classify_index.vars.action_reason }})."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch failure notification if Solr index maintenance flow fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#search-ops",
        "attachments": [
          {
            "color": "danger",
            "title": ":rotating_light: Solr Index Maintenance Flow Failed",
            "text": "Execution `{{ execution.id }}` failed while inspecting collection `{{ inputs.collection_name }}` on `{{ inputs.solr_url }}`. Check Solr endpoint connectivity and collection status."
          }
        ]
      }

extend:
  title: Apache Solr Tombstone Expunge and Segment Compaction Gate
  metaTitle: Apache Solr Tombstone Expunge & Segment Compaction Gate | Kestra
  shortDescription: Audit Solr Lucene segments and deleted document tombstones, safely trigger expungeDeletes or merges with approval gates, and verify recovery.
  metaDescription: Audit Solr Lucene segments and tombstones, safely trigger expungeDeletes or merges with approval gates, and verify recovery post-action in Kestra.
  description: |
    Enterprise search platforms powered by Apache Solr and Apache Lucene rely on immutable
    index segment architectures. When documents are updated or deleted, Lucene does not
    immediately rewrite underlying files; instead, it writes deletion bitsets that mark documents
    as deleted. These tombstones remain in the index until segment merges occur.

    In high-throughput indexing environments with frequent document churn, updates, or catalog
    re-indexing, deleted documents accumulate rapidly. When the tombstone ratio (`deletedDocs / maxDoc`)
    exceeds 15-20%, query response times degrade significantly because Solr must filter through
    dead records during search evaluation. Furthermore, segment counts proliferate into dozens of
    small, unmerged files, causing excessive file descriptor consumption and memory pressure.

    While running an unconditional `optimize` (merging down to 1 segment) is an option, it is
    notoriously I/O intensive, locks disk throughput, and can trigger node dropouts in production.
    The recommended operational approach is selective tombstone purging via `expungeDeletes`
    (which merges only segments containing deletions) or controlled merges down to a conservative
    segment limit (`maxSegments`).

    This blueprint provides an automated Solr maintenance gate. It queries the Solr Luke handler
    to inspect live Lucene segment metadata and tombstone ratios, diffs values against historical
    snapshots in Kestra KV, alerts search engineers, halts for operator approval, invokes selective
    `expungeDeletes` or controlled segment merges, and verifies tombstone reduction post-remediation.

    ## How it works

    1. **Pre-flight Assertion**: The workflow asserts that Solr connection endpoints, collection names, and threshold percentages satisfy sanity bounds.
    2. **Luke Handler Query**: `io.kestra.plugin.core.http.Request` calls the Solr Luke administration handler (`GET /solr/{collection}/admin/luke?show=index&numTerms=0`) to retrieve `numDocs`, `maxDoc`, `deletedDocs`, and `segmentCount`.
    3. **Index Telemetry Classification**: An isolated Python script computes the exact tombstone percentage (`deletedDocs / maxDoc * 100`) and compares metrics against historical KV snapshots stored under `solr_core_tracker_{collection}`. The script determines whether to execute selective `EXPUNGE_DELETES`, controlled `OPTIMIZE_SEGMENTS`, or pass as healthy.
    4. **State Tracking**: `io.kestra.plugin.core.kv.Set` records current segment counts and deleted document metrics in Kestra KV for longitudinal drift detection.
    5. **Team Escalation**: `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` delivers a structured alert summarizing tombstone ratios, segment sprawl, and planned maintenance.
    6. **Safe Remediation with Approval Gate**: When `dry_run` is disabled:
       - Workflow execution pauses (`io.kestra.plugin.core.flow.Pause`) for search engineer review.
       - `io.kestra.plugin.core.flow.Switch` routes execution:
         - `EXPUNGE_DELETES`: Calls `POST /solr/{collection}/update?commit=true&expungeDeletes=true` to prune tombstones without rewriting clean segments.
         - `OPTIMIZE_SEGMENTS`: Calls `POST /solr/{collection}/update?commit=true&optimize=true&maxSegments={target}` to merge sprawling segments.
    7. **Post-Remediation Verification**: The workflow re-queries the Luke handler and executes `io.kestra.plugin.core.execution.Assert` to verify that `deletedDocs` has strictly decreased.

    ## What you get

    - Automated detection of Lucene segment sprawl and deleted document tombstones in Solr.
    - Elimination of search latency degradation caused by high tombstone ratios.
    - Intelligent triage between lightweight `expungeDeletes` and controlled segment optimization merges.
    - Operator approval gates and dry-run preview to prevent unexpected heavy cluster I/O.
    - Longitudinal index health tracking stored across runs in Kestra KV.
    - Post-remediation assertions confirming that deleted document counts were reduced.

    ## Who it's for

    - Search Infrastructure Engineers operating Apache Solr and SolrCloud clusters.
    - Platform and Data Engineers maintaining enterprise search, catalog, and log indexing pipelines.
    - Site Reliability Engineers (SREs) managing search query latency SLAs and cluster disk capacity.

    ## Why orchestrate this with Kestra

    Solr provides update handlers for compaction and segment optimization, but lacks native capabilities to track historical deleted document progression, diff segment sprawl across runs, enforce human approval gates, or dispatch multi-channel alerts.
    Writing ad-hoc cron scripts creates unmonitored failure points without execution audit trails, retry policies, or credential masking.

    Orchestrating this maintenance gate with Kestra provides a declarative workflow with integrated KV state tracking, native HTTP execution, pause-and-resume approval gates, structured Slack notifications, and post-action verification.

    ## Prerequisites

    - An accessible Apache Solr server or SolrCloud cluster (version 8.0 or higher).
    - An existing collection or core with Luke handler access enabled.
    - A Slack Incoming Webhook URL to receive triage alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for search operations alerts.
    - `SOLR_MAINTENANCE_WEBHOOK_KEY`: Secret authentication key protecting the on-demand webhook trigger.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` and `SOLR_MAINTENANCE_WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Import this blueprint and configure `solr_url` and `collection_name` to match your Solr environment.
    3. Run a manual execution with `dry_run: true` to record an initial baseline and review planned actions.
    4. When ready to compact segments or expunge tombstones, run with `dry_run: false` and approve the paused execution.
    5. Enable the `periodic_index_audit` schedule trigger to run segment health audits automatically every 4 hours.

    ## How to extend

    - **Query Latency Canary**: Add an `io.kestra.plugin.core.http.Request` task executing a benchmark query before and after compaction to record search latency speedup.
    - **SolrCloud Core Reload**: Add an `io.kestra.plugin.core.http.Request` task to trigger a collection reload across cluster replicas once optimization finishes.
    - **PagerDuty Emergency Escalation**: Add `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` if tombstone ratio exceeds 50% and query latency degrades.

    ## Links

    - [Apache Solr Luke Request Handler Documentation](https://solr.apache.org/guide/solr/latest/indexing-guide/luke-request-handler.html)
    - [Apache Solr Index Optimization and Commit Parameters](https://solr.apache.org/guide/solr/latest/indexing-guide/update-handlers-in-solrconfig.html)
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra KV Store Documentation](https://kestra.io/plugins/core/tasks/kv/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Approval Gates
  ee: false
  demo: false
