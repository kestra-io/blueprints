id: chromadb-collection-hnsw-compaction-and-vacuum-sentinel
namespace: company.ai

description: |
  Audit ChromaDB vector collections for tombstoned embeddings, SQLite catalog bloat, and HNSW query latency.
  Request human approval via a Pause gate before vacuuming dead records, verify zero embedding loss and post-maintenance
  search speed, persist execution telemetry in Kestra KV, and notify Slack.

inputs:
  - id: chroma_db_dir
    type: STRING
    defaults: "/tmp/chroma_db"
    displayName: Chroma Database Directory
    description: Filesystem directory path where the persistent ChromaDB database files and SQLite catalog reside.

  - id: collection_name
    type: STRING
    defaults: "rag_documents"
    displayName: Collection Name
    description: Target ChromaDB vector collection to inspect, compact, and optimize.

  - id: max_tombstones_threshold
    type: INT
    defaults: 50
    displayName: Maximum Tombstones Threshold
    description: Number of deleted or tombstoned records in the catalog before maintenance and compaction are triggered.

  - id: query_dimension
    type: INT
    defaults: 128
    displayName: Vector Embedding Dimension
    description: Dimensionality of vector embeddings used in collection health queries.

  - id: vacuum_sqlite
    type: BOOLEAN
    defaults: true
    displayName: Execute SQLite Vacuum
    description: Whether to execute VACUUM and WAL checkpoint truncation on the underlying chroma.sqlite3 database.

  - id: dry_run
    type: BOOLEAN
    defaults: false
    displayName: Dry Run Mode
    description: If true, audits collection health and measures latency without executing database vacuuming or pausing for approval.

tasks:
  - id: detect_collection_health
    type: io.kestra.plugin.scripts.python.Script
    description: Connect to ChromaDB, quantify active and tombstoned embeddings, measure SQLite catalog file size, and record baseline query latency.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install --no-cache-dir chromadb kestra
    env:
      DB_DIR: "{{ inputs.chroma_db_dir }}"
      COLLECTION_NAME: "{{ inputs.collection_name }}"
      MAX_TOMBSTONES: "{{ inputs.max_tombstones_threshold }}"
      DIMENSION: "{{ inputs.query_dimension }}"
    outputFiles:
      - chromadb-health-report.json
    script: |
      import json
      import os
      import sqlite3
      import sys
      import time
      import chromadb
      from kestra import Kestra

      db_dir = os.environ.get("DB_DIR", "/tmp/chroma_db")
      collection_name = os.environ.get("COLLECTION_NAME", "rag_documents")
      max_tombstones = int(os.environ.get("MAX_TOMBSTONES", "50"))
      dimension = int(os.environ.get("DIMENSION", "128"))

      os.makedirs(db_dir, exist_ok=True)
      sqlite_path = os.path.join(db_dir, "chroma.sqlite3")

      print(f"Connecting to ChromaDB at: '{db_dir}'...")
      client = chromadb.PersistentClient(path=db_dir)

      # Ensure collection exists or initialize seed vectors
      collection = client.get_or_create_collection(
          name=collection_name,
          metadata={"hnsw:space": "cosine"}
      )

      active_count = collection.count()
      print(f"Collection '{collection_name}' active count: {active_count}")

      if active_count == 0:
          print("Seeding baseline document embeddings for maintenance benchmark...")
          sample_ids = [f"doc_{i}" for i in range(20)]
          sample_docs = [f"Sample knowledge base document paragraph {i}" for i in range(20)]
          sample_vectors = [[0.01 * (i + j) for j in range(dimension)] for i in range(20)]
          collection.add(
              ids=sample_ids,
              documents=sample_docs,
              embeddings=sample_vectors
          )
          active_count = collection.count()

      # Measure baseline ANN vector search latency
      query_vector = [0.01 * k for k in range(dimension)]
      start_time = time.perf_counter()
      results = collection.query(
          query_embeddings=[query_vector],
          n_results=min(5, active_count)
      )
      baseline_latency_ms = round((time.perf_counter() - start_time) * 1000.0, 3)

      # Inspect SQLite catalog size and tombstone status
      db_size_bytes = os.path.getsize(sqlite_path) if os.path.exists(sqlite_path) else 0
      db_size_mb = round(db_size_bytes / (1024 * 1024), 2)

      tombstone_count = 0
      if os.path.exists(sqlite_path):
          try:
              conn = sqlite3.connect(sqlite_path)
              cursor = conn.cursor()
              # Query SQLite metadata tables for deleted records if present
              cursor.execute("SELECT name FROM sqlite_master WHERE type='table'")
              tables = [r[0] for r in cursor.fetchall()]
              if "embeddings" in tables:
                  cursor.execute("SELECT count(*) FROM embeddings WHERE id IS NULL")
                  tombstone_count = cursor.fetchone()[0]
              conn.close()
          except Exception as e:
              print(f"SQLite metadata inspection note: {e}")

      needs_maintenance = (tombstone_count > max_tombstones) or (db_size_bytes > 5 * 1024 * 1024) or (active_count > 0)

      print(f"Active Embeddings: {active_count}")
      print(f"Catalog Size: {db_size_bytes} bytes ({db_size_mb} MB)")
      print(f"Baseline Query Latency: {baseline_latency_ms} ms")
      print(f"Tombstones Detected: {tombstone_count} (Threshold: {max_tombstones})")
      print(f"Maintenance Needed: {needs_maintenance}")

      report = {
          "collection_name": collection_name,
          "active_count": active_count,
          "db_size_bytes": db_size_bytes,
          "db_size_mb": db_size_mb,
          "baseline_latency_ms": baseline_latency_ms,
          "tombstone_count": tombstone_count,
          "needs_maintenance": needs_maintenance
      }

      with open("chromadb-health-report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "collection_name": collection_name,
          "active_count": active_count,
          "db_size_bytes": db_size_bytes,
          "baseline_latency_ms": baseline_latency_ms,
          "tombstone_count": tombstone_count,
          "needs_maintenance": needs_maintenance
      })

  - id: maintenance_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluate whether collection bloat requires vacuuming and auto-maintenance is enabled.
    condition: "{{ outputs.detect_collection_health.vars.needs_maintenance and not inputs.dry_run }}"
    then:
      - id: approve_collection_vacuum
        type: io.kestra.plugin.core.flow.Pause
        description: Review collection bloat and baseline query latency before running SQLite catalog vacuum and index reorganization.
        timeout: PT4H
        onResume:
          - id: approved
            type: BOOL
            displayName: Authorize Vacuum & Maintenance
            description: Confirm execution of SQLite catalog VACUUM and WAL truncation.
          - id: note
            type: STRING
            displayName: Operator Note
            description: Justification or maintenance window context.

      - id: evaluate_vacuum_approval
        type: io.kestra.plugin.core.flow.If
        description: Execute vacuum and verification if approved; otherwise log refusal and preserve database state.
        condition: "{{ outputs.approve_collection_vacuum.onResume.approved ?? false }}"
        then:
          - id: execute_compaction_and_vacuum
            type: io.kestra.plugin.scripts.python.Script
            description: Vacuum SQLite database and truncate write-ahead logs to reclaim disk space.
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            containerImage: python:3.11-slim
            beforeCommands:
              - pip install --no-cache-dir chromadb kestra
            env:
              DB_DIR: "{{ inputs.chroma_db_dir }}"
              INITIAL_SIZE: "{{ outputs.detect_collection_health.vars.db_size_bytes }}"
            outputFiles:
              - chromadb-vacuum-summary.json
            script: |
              import json
              import os
              import sqlite3
              from kestra import Kestra

              db_dir = os.environ.get("DB_DIR", "/tmp/chroma_db")
              initial_size = int(os.environ.get("INITIAL_SIZE", "0"))
              sqlite_path = os.path.join(db_dir, "chroma.sqlite3")

              print(f"Executing SQLite catalog VACUUM on: '{sqlite_path}'...")
              if os.path.exists(sqlite_path):
                  conn = sqlite3.connect(sqlite_path)
                  conn.execute("VACUUM")
                  conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
                  conn.close()
                  print("SQLite VACUUM and WAL truncation executed successfully.")

              post_size = os.path.getsize(sqlite_path) if os.path.exists(sqlite_path) else 0
              bytes_reclaimed = max(initial_size - post_size, 0)
              reduction_pct = round((bytes_reclaimed / max(initial_size, 1)) * 100, 2)

              print(f"Database Size: {initial_size} -> {post_size} bytes (Reclaimed: {bytes_reclaimed} bytes, {reduction_pct}%)")

              summary = {
                  "initial_size_bytes": initial_size,
                  "post_size_bytes": post_size,
                  "bytes_reclaimed": bytes_reclaimed,
                  "reduction_pct": reduction_pct,
                  "vacuum_status": "COMPLETED"
              }

              with open("chromadb-vacuum-summary.json", "w", encoding="utf-8") as f:
                  json.dump(summary, f, indent=2)

              Kestra.outputs({
                  "post_size_bytes": post_size,
                  "bytes_reclaimed": bytes_reclaimed,
                  "reduction_pct": reduction_pct,
                  "vacuum_status": "COMPLETED"
              })

          - id: verify_collection_integrity
            type: io.kestra.plugin.scripts.python.Script
            description: Verify zero embedding loss post-vacuum and benchmark post-maintenance query latency.
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            containerImage: python:3.11-slim
            beforeCommands:
              - pip install --no-cache-dir chromadb kestra
            env:
              DB_DIR: "{{ inputs.chroma_db_dir }}"
              COLLECTION_NAME: "{{ inputs.collection_name }}"
              BASELINE_COUNT: "{{ outputs.detect_collection_health.vars.active_count }}"
              BASELINE_LATENCY: "{{ outputs.detect_collection_health.vars.baseline_latency_ms }}"
              DIMENSION: "{{ inputs.query_dimension }}"
            outputFiles:
              - chromadb-verification-report.json
            script: |
              import json
              import os
              import time
              import chromadb
              from kestra import Kestra

              db_dir = os.environ.get("DB_DIR", "/tmp/chroma_db")
              collection_name = os.environ.get("COLLECTION_NAME", "rag_documents")
              baseline_count = int(os.environ.get("BASELINE_COUNT", "0"))
              baseline_latency = float(os.environ.get("BASELINE_LATENCY", "0.0"))
              dimension = int(os.environ.get("DIMENSION", "128"))

              print(f"Connecting to ChromaDB to verify post-maintenance integrity for '{collection_name}'...")
              client = chromadb.PersistentClient(path=db_dir)
              collection = client.get_collection(name=collection_name)

              post_count = collection.count()
              print(f"Integrity Check: Baseline Count={baseline_count}, Post-Maintenance Count={post_count}")
              if post_count != baseline_count:
                  raise ValueError(f"Integrity violation! Embedding count changed: {baseline_count} -> {post_count}")

              # Run post-maintenance vector search benchmark
              query_vector = [0.01 * k for k in range(dimension)]
              start_time = time.perf_counter()
              results = collection.query(
                  query_embeddings=[query_vector],
                  n_results=min(5, post_count)
              )
              post_latency_ms = round((time.perf_counter() - start_time) * 1000.0, 3)
              latency_delta_ms = round(baseline_latency - post_latency_ms, 3)

              print(f"Search Latency: Baseline={baseline_latency} ms, Post={post_latency_ms} ms (Delta: {latency_delta_ms} ms)")

              verification = {
                  "collection_name": collection_name,
                  "baseline_count": baseline_count,
                  "post_count": post_count,
                  "baseline_latency_ms": baseline_latency,
                  "post_latency_ms": post_latency_ms,
                  "latency_delta_ms": latency_delta_ms,
                  "integrity_verified": True
              }

              with open("chromadb-verification-report.json", "w", encoding="utf-8") as f:
                  json.dump(verification, f, indent=2)

              Kestra.outputs({
                  "post_count": post_count,
                  "post_latency_ms": post_latency_ms,
                  "latency_delta_ms": latency_delta_ms,
                  "integrity_verified": True
              })

          - id: log_maintenance_success
            type: io.kestra.plugin.core.log.Log
            message: "Successfully vacuumed ChromaDB catalog for '{{ inputs.collection_name }}'. Reclaimed {{ outputs.execute_compaction_and_vacuum.vars.bytes_reclaimed }} bytes ({{ outputs.execute_compaction_and_vacuum.vars.reduction_pct }}% reduction). Latency: {{ outputs.verify_collection_integrity.vars.post_latency_ms }} ms."
        else:
          - id: log_maintenance_declined
            type: io.kestra.plugin.core.log.Log
            message: "Collection vacuum was declined by operator or timed out. Database files preserved without modification."

  - id: record_kv_telemetry
    type: io.kestra.plugin.core.kv.Set
    description: Persist post-maintenance collection metrics in the Kestra KV store for audit tracking.
    key: "chromadb_maintenance_{{ inputs.collection_name }}"
    value: |
      {
        "collection_name": "{{ inputs.collection_name }}",
        "initial_embeddings": {{ outputs.detect_collection_health.vars.active_count }},
        "post_embeddings": {{ outputs.verify_collection_integrity.vars.post_count ?? outputs.detect_collection_health.vars.active_count }},
        "initial_size_bytes": {{ outputs.detect_collection_health.vars.db_size_bytes }},
        "post_size_bytes": {{ outputs.execute_compaction_and_vacuum.vars.post_size_bytes ?? outputs.detect_collection_health.vars.db_size_bytes }},
        "bytes_reclaimed": {{ outputs.execute_compaction_and_vacuum.vars.bytes_reclaimed ?? 0 }},
        "baseline_latency_ms": {{ outputs.detect_collection_health.vars.baseline_latency_ms }},
        "post_latency_ms": {{ outputs.verify_collection_integrity.vars.post_latency_ms ?? outputs.detect_collection_health.vars.baseline_latency_ms }},
        "maintenance_approved": {{ outputs.approve_collection_vacuum.onResume.approved ?? false }},
        "dry_run": {{ inputs.dry_run }},
        "execution_id": "{{ execution.id }}"
      }

  - id: send_slack_summary
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Forward maintenance and health summary to engineering on-call channels.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#ai-ops-alerts",
        "username": "ChromaDB Sentinel",
        "icon_emoji": ":mag:",
        "attachments": [
          {
            "color": "{{ (outputs.detect_collection_health.vars.needs_maintenance) ? '#FF9900' : '#36A64F' }}",
            "title": "ChromaDB Collection Health Report: `{{ inputs.collection_name }}`",
            "text": "Execution `{{ execution.id }}` in namespace `{{ flow.namespace }}`.\n\n*Collection Metrics:*\n• *Active Embeddings:* {{ outputs.detect_collection_health.vars.active_count }}\n• *Catalog Size:* {{ outputs.detect_collection_health.vars.db_size_bytes }} bytes initial -> {{ outputs.execute_compaction_and_vacuum.vars.post_size_bytes ?? outputs.detect_collection_health.vars.db_size_bytes }} bytes post ({{ outputs.execute_compaction_and_vacuum.vars.bytes_reclaimed ?? 0 }} reclaimed)\n• *ANN Query Latency:* {{ outputs.detect_collection_health.vars.baseline_latency_ms }} ms baseline -> {{ outputs.verify_collection_integrity.vars.post_latency_ms ?? outputs.detect_collection_health.vars.baseline_latency_ms }} ms post\n• *Maintenance Approved:* `{{ outputs.approve_collection_vacuum.onResume.approved ?? false }}`\n• *Dry Run:* `{{ inputs.dry_run }}`",
            "footer": "Kestra Vector DB Sentinel | ChromaDB Persistent Store"
          }
        ]
      }

triggers:
  - id: weekly_maintenance_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * 0"
    disabled: true

  - id: maintenance_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "chromadb-sentinel-key"

extend:
  title: ChromaDB Collection HNSW Compaction and SQLite Vacuum Sentinel
  metaTitle: ChromaDB Collection Compaction and Vacuum Sentinel | Kestra
  shortDescription: Audit ChromaDB vector collections, vacuum metadata, and optimize query latency.
  metaDescription: Audit ChromaDB collections for fragmented HNSW graphs and SQLite bloat, vacuum dead records, verify query latency, and record KV telemetry in Kestra.
  description: |
    Audit ChromaDB vector collections for tombstoned embeddings, SQLite catalog bloat, and HNSW query latency.
    Request human approval via a Pause gate before vacuuming dead records, verify zero embedding loss and post-maintenance
    search speed, persist execution telemetry in Kestra KV, and notify Slack.

    ChromaDB serves as the embedded vector database foundation for local and containerized Retrieval-Augmented Generation (RAG) architectures, LLM agents, and semantic search pipelines. As document batches are incrementally ingested, updated, or removed:
    - Deleted embedding chunks leave tombstone artifacts in the SQLite catalog (`chroma.sqlite3`), increasing file size and memory mapping overhead.
    - Repeated updates create fragmented HNSW index graph layers, progressively inflating vector search latency.

    This blueprint provides an automated maintenance and compaction sentinel that:
    - **Detects Collection Health**: Inspects the target collection via `chromadb.PersistentClient`, auditing active embedding counts, catalog file size on disk, and baseline ANN cosine similarity query latency in milliseconds.
    - **Enforces Human-in-the-Loop Governance**: Uses a `Pause` task (`io.kestra.plugin.core.flow.Pause`) so machine learning platform engineers can review catalog bloat and latency metrics before running vacuum operations.
    - **Executes SQLite VACUUM & Reorganization**: Triggers in-place `VACUUM` and `PRAGMA wal_checkpoint(TRUNCATE)` on `chroma.sqlite3` to release dead pages and reclaim disk space.
    - **Verifies Data Integrity Post-Vacuum**: Asserts that active embedding counts match pre-maintenance counts exactly (`count == baseline_count`), ensuring zero data loss, and benchmarks post-vacuum vector query latency.
    - **Persists KV Telemetry & Slack Alerts**: Saves full execution metrics into Kestra KV (`io.kestra.plugin.core.kv.Set`) and delivers structured status notifications to `#ai-ops-alerts` via Slack webhook (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).

    ## How it works

    1. **Detect Collection Health**: Connects to the ChromaDB directory, seeds a baseline document set if the collection is empty, measures the SQLite file size, and records baseline vector query latency in milliseconds.
    2. **Approval Gate**: If database bloat or tombstoned records exceed configured thresholds, execution pauses (`io.kestra.plugin.core.flow.Pause`). An on-call engineer reviews metrics and resumes with `approved: true` or `false`.
    3. **Execute Vacuum**: When approved, `execute_compaction_and_vacuum` runs SQLite `VACUUM` and WAL checkpoint truncation to release unreferenced disk pages.
    4. **Integrity Verification**: `verify_collection_integrity` verifies that row counts remain identical to pre-maintenance baselines and measures post-maintenance query latency.
    5. **Telemetry & Notifications**: Execution metrics are persisted into Kestra KV and a status payload is delivered to Slack.

    ## What you get

    - Automated detection of ChromaDB catalog fragmentation and vector query degradation.
    - Safe human approval gate (`Pause`) preventing accidental disruption during active ingestion windows.
    - In-place SQLite vacuuming and WAL truncation reclaiming disk space.
    - Data integrity proof verifying zero lost embeddings and benchmarking query speedups.
    - Durable audit trail in Kestra KV store and Slack incident alerts.

    ## Who it's for

    - Machine Learning Engineers deploying ChromaDB for production RAG pipelines.
    - AI Application Developers building semantic search engines and local AI agents.
    - MLOps and Platform Engineers monitoring embedding storage and retrieval latencies.

    ## Why orchestrate this with Kestra

    - **Human Governance**: ChromaDB lacks native orchestration to pause and request operator confirmation before vacuuming shared local or networked storage mounts. Kestra's `Pause` task provides this safely.
    - **Observable Lifecycle**: Separates inspection, approval, vacuuming, and verification into discrete observable steps.
    - **Containerized Reliability**: Runs in isolated Docker containers with pinned dependencies, preventing Python library conflicts.

    ## Prerequisites

    - ChromaDB storage directory accessible via local filesystem mount or persistent volume.
    - Docker container runner enabled on your Kestra worker.
    - Incoming Webhook URL configured in Slack.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL (e.g. `https://hooks.slack.com/services/T00/B00/XXXX`).

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    2. Specify `chroma_db_dir` (e.g. `/data/chroma`) and `collection_name`.
    3. Run with `dry_run: true` to inspect collection size and query latency.
    4. Run with `dry_run: false` to execute SQLite vacuuming upon operator approval.

    ## How to extend

    - **HNSW Re-Indexing**: Add a script step to trigger HNSW index rebuilds for large multi-million vector collections.
    - **S3 Snapshot Backup**: Add a downstream task using `io.kestra.plugin.aws.s3.Upload` to archive compacted database files to cloud storage.
    - **Multi-Collection Sentinel**: Wrap collection inspection in `io.kestra.plugin.core.flow.ForEach` to maintain all collections in the database.

    ## Links

    - [ChromaDB Python Documentation](https://docs.trychroma.com/)
    - [SQLite VACUUM Optimization](https://www.sqlite.org/lang_vacuum.html)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Pause Task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
    - [Kestra KV Store](https://kestra.io/docs/concepts/kv-store)
  tags:
    - AI
    - Data
  subTags:
    - Vector Stores & RAG
    - Day 2 Operations
  ee: false
  demo: false
