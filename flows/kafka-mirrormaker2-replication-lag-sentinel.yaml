id: kafka-mirrormaker2-replication-lag-sentinel
namespace: company.streaming

inputs:
  - id: mm2_connect_url
    type: STRING
    defaults: "http://kafka-connect.internal:8083"
    description: Base URL of Kafka Connect cluster running MirrorMaker 2.
  - id: connector_name
    type: STRING
    defaults: "MirrorSourceConnector"
    description: MirrorMaker 2 connector name.

tasks:
  - id: inspect_connector_tasks
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    script: |
      import sys
      import requests
      from kestra import Kestra

      url = f"{{ inputs.mm2_connect_url }}/connectors/{{ inputs.connector_name }}/status"
      print(f"Querying MirrorMaker 2 connector status from {url}...")
      try:
          resp = requests.get(url, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"ERROR: Failed to query Kafka Connect REST API at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      connector_state = data.get("connector", {}).get("state", "UNKNOWN")
      tasks = data.get("tasks", [])
      failed_tasks = sum(1 for t in tasks if t.get("state") == "FAILED")
      running_tasks = sum(1 for t in tasks if t.get("state") == "RUNNING")
      total_tasks = len(tasks)

      print(f"Connector: {connector_state}, Tasks: total={total_tasks}, running={running_tasks}, failed={failed_tasks}")
      Kestra.outputs({
          "connector_state": connector_state,
          "failed_tasks": failed_tasks,
          "running_tasks": running_tasks,
          "total_tasks": total_tasks
      })

  - id: evaluate_mirroring_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_connector_tasks.vars.connector_state != 'RUNNING' or outputs.inspect_connector_tasks.vars.failed_tasks | int > 0 }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kafka MirrorMaker 2 Replication Stalled Alert",
                "text": "MirrorMaker 2 connector `{{ inputs.connector_name }}` has state *{{ outputs.inspect_connector_tasks.vars.connector_state }}* with *{{ outputs.inspect_connector_tasks.vars.failed_tasks }} failed task(s)* out of {{ outputs.inspect_connector_tasks.vars.total_tasks }}! Cross-cluster topic replication has halted, breaking active-passive disaster recovery synchronization.",
                "footer": "Kestra Streaming Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MirrorMaker 2 Sentinel Failure",
            "text": "Failed to query Kafka Connect REST API at {{ inputs.mm2_connect_url }}. Verify connector cluster reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: connector_state
    type: STRING
    description: Status of the MirrorMaker 2 connector.
    value: "{{ outputs.inspect_connector_tasks.vars.connector_state }}"
  - id: failed_tasks
    type: INT
    description: Count of failed connector tasks.
    value: "{{ outputs.inspect_connector_tasks.vars.failed_tasks }}"
  - id: total_tasks
    type: INT
    description: Total tasks configured for this connector.
    value: "{{ outputs.inspect_connector_tasks.vars.total_tasks }}"

extend:
  metaDescription: "Monitors Apache Kafka MirrorMaker 2 connector tasks for replication lag and record rate stalls."
  metaTitle: Apache Kafka MirrorMaker 2 Cross-Cluster Replication Lag Sentinel with Kestra
  title: Apache Kafka MirrorMaker 2 Cross-Cluster Replication Lag Sentinel
  shortDescription: Monitors Apache Kafka MirrorMaker 2 connector tasks for replication lag and record rate stalls.
  description: |
    ## How it works
    This workflow connects to the Kafka Connect REST API (`/connectors/{connector_name}/status`) hosting Apache Kafka MirrorMaker 2 to audit cross-datacenter replication task health. MirrorMaker 2 synchronizes topics, partition offsets, ACLs, and consumer group states between active and secondary Kafka clusters. When broker network splits, authentication token expirations, or poison pill records crash connector tasks (`state == "FAILED"`), replication stalls. This workflow continuously tracks connector task states and alerts streaming platform engineers immediately.

    ## What you get
    - Real-time visibility into cross-cluster Kafka topic replication health.
    - Prevents disaster recovery synchronization drift between primary and secondary brokers.
    - Actionable tracking of failed versus running connector tasks.

    ## Who it's for
    - Kafka Administrators and Event Streaming Infrastructure Engineers.
    - SREs maintaining multi-region disaster recovery topologies.

    ## Why orchestrate this with Kestra
    - **Continuous Replication Assurance**: Periodically checks connector tasks automatically.
    - **Decoupled Monitoring**: Uses standard Kafka Connect REST endpoints.
    - **Instant Team Escalation**: Delivers notifications with failed task counts directly to Slack.

    ## Prerequisites
    - Kafka Connect cluster hosting MirrorMaker 2 with REST API enabled.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Kafka Connect URL and connector name.
    3. Run the workflow to inspect connector task states.

    ## How to extend
    - Automatically restart failed tasks via `POST /connectors/{name}/tasks/{task_id}/restart`.
    - Query Prometheus exporter metrics for `record-bytes-lag` per topic partition.

    ## Links
    - [Apache Kafka MirrorMaker 2 Documentation](https://cwiki.apache.org/confluence/display/KAFKA/KIP-382%3A+MirrorMaker+2.0)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - ELT & Data Landing
  ee: false
  demo: false
