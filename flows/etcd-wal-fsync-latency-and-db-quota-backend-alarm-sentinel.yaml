id: etcd-wal-fsync-latency-and-db-quota-backend-alarm-sentinel
namespace: company.team

description: |
  Audits Kubernetes etcd cluster telemetry to detect WAL fsync latency spikes, database quota backend alarms, and leader election churn.

concurrency:
  limit: 1

inputs:
  - id: etcd_metrics_url
    type: STRING
    displayName: "etcd Prometheus Metrics URL"
    defaults: "http://etcd-server.kube-system.svc.cluster.local:2379"
    description: "Base HTTP URL exposing Prometheus metrics for the etcd control plane node."

  - id: cluster_name
    type: STRING
    displayName: "etcd Cluster Identifier"
    defaults: "etcd-k8s-control-plane"
    description: "Target Kubernetes etcd consensus cluster under active surveillance."

  - id: max_fsync_latency_ms_threshold
    type: INT
    displayName: "Max WAL Fsync Latency (ms)"
    defaults: 10
    description: "Maximum allowable 99th percentile write-ahead log disk fsync latency in milliseconds before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which disk fsync latency and leader election changes are evaluated."

  - id: alert_on_etcd_failures
    type: BOOL
    displayName: "Alert On etcd Failures"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting elevated fsync latency or quota alarms."

tasks:
  - id: scan_etcd_cluster_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes etcd Prometheus metrics to calculate WAL fsync latency, database quota headroom, and leader changes.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      ETCD_URL: "{{ inputs.etcd_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_FSYNC_MS: "{{ inputs.max_fsync_latency_ms_threshold }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      import json
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("ETCD_URL", "").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "etcd-k8s-control-plane")
      max_fsync_ms = float(os.environ.get("MAX_FSYNC_MS", "10"))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", "15"))

      metrics_endpoint = f"{base_url}/metrics"
      fsync_latency_p99_ms = 0.0
      leader_changes = 0
      db_size_bytes = 0
      has_leader = 1
      quota_alarm_active = False

      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          resp.raise_for_status()
          for line in resp.text.splitlines():
              line = line.strip()
              if line.startswith("#") or not line:
                  continue
              if "etcd_disk_wal_fsync_duration_seconds" in line and "0.99" in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      fsync_latency_p99_ms = round(float(match.group(1)) * 1000.0, 2)
              elif "etcd_server_leader_changes_seen_total" in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      leader_changes += int(float(match.group(1)))
              elif "etcd_mvcc_db_total_size_in_bytes" in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      db_size_bytes = max(db_size_bytes, int(float(match.group(1))))
              elif "etcd_server_has_leader" in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      has_leader = int(float(match.group(1)))
      except Exception as err:
          print(f"CRITICAL: Failed to reach etcd metrics endpoint at {metrics_endpoint}: {err}", file=sys.stderr)
          sys.exit(1)

      db_size_mb = round(db_size_bytes / (1024 * 1024), 2)
      if db_size_mb > 1900.0:
          quota_alarm_active = True

      is_breached = bool(fsync_latency_p99_ms >= max_fsync_ms or has_leader == 0 or quota_alarm_active)
      now_iso = datetime.now(timezone.utc).isoformat()

      report = {
          "cluster_name": cluster_name,
          "fsync_latency_p99_ms": fsync_latency_p99_ms,
          "leader_changes": leader_changes,
          "db_size_mb": db_size_mb,
          "has_leader": bool(has_leader == 1),
          "quota_alarm_active": quota_alarm_active,
          "is_alerting": is_breached
      }

      with open("etcd_wal_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"etcd Complete: Cluster={cluster_name}, FsyncP99={fsync_latency_p99_ms}ms, DBSize={db_size_mb}MB, Leader={has_leader}, Alert={is_breached}")

      Kestra.outputs({
          "wal_fsync_latency_p99_ms": fsync_latency_p99_ms,
          "leader_changes_count": leader_changes,
          "db_total_size_mb": db_size_mb,
          "has_leader_status": bool(has_leader == 1),
          "is_alerting": is_breached,
          "cluster_target": cluster_name,
          "audit_timestamp": now_iso
      })
    outputFiles:
      - etcd_wal_report.json

  - id: evaluate_etcd_failure_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether etcd WAL fsync latency or leader stability exceeds operational tolerance bounds.
    condition: "{{ outputs.scan_etcd_cluster_metrics.vars.is_alerting and inputs.alert_on_etcd_failures }}"
    then:
      - id: notify_slack_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-control-plane",
            "username": "etcd Sentinel",
            "text": "CRITICAL: Kubernetes etcd WAL fsync latency spike or quorum instability detected on cluster `{{ inputs.cluster_name }}`. Fsync P99 Latency: `{{ outputs.scan_etcd_cluster_metrics.vars.wal_fsync_latency_p99_ms }} ms` (threshold: `{{ inputs.max_fsync_latency_ms_threshold }} ms`). Leader Changes: `{{ outputs.scan_etcd_cluster_metrics.vars.leader_changes_count }}`. DB Size: `{{ outputs.scan_etcd_cluster_metrics.vars.db_total_size_mb }} MB`."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#platform-control-plane",
        "username": "etcd Sentinel",
        "text": "CRITICAL: etcd WAL Fsync Latency Sentinel pipeline failed on {{ inputs.cluster_name }}. Execution ID: {{ execution.id }}."
      }

extend:
  title: etcd WAL Fsync Latency and Quota Sentinel
  metaTitle: etcd WAL Fsync Latency and Quota Sentinel Blueprint
  shortDescription: Audits etcd cluster Prometheus metrics to detect WAL fsync latency spikes and leader instability.
  metaDescription: Audits etcd cluster telemetry to detect WAL fsync latency spikes, quota backend alarms, and leader election churn.
  description: |
    ## How it works
    Kubernetes etcd clusters require fast disk writes to keep the consensus log consistent. When disk I/O degrades or underlying hardware slows down, WAL fsync latency increases, leading to missed heartbeats and leader elections. This sentinel interrogates etcd Prometheus metrics, isolates 99th percentile fsync duration, detects quorum instability, and dispatches alerts to Slack.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scan_etcd_cluster_metrics Python Script] --> B{Fsync > Threshold or Leader Lost?}
      B -- Yes --> C[notify_slack_platform_team Webhook]
      B -- No --> D[Consensus Nominal]
    ```

    ## Prerequisites
    - Outbound HTTP access to etcd metrics endpoint.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `etcd_metrics_url` and `cluster_name`.
    3. Run manually to check control plane latency.

    ## Links
    - [etcd Metrics Documentation](https://etcd.io/docs/latest/op-guide/monitoring/)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
    - Network
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
