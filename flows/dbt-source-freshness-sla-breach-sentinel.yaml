id: dbt-source-freshness-sla-breach-sentinel
namespace: company.analytics

inputs:
  - id: sources_json_path
    type: STRING
    displayName: dbt sources.json Artifact Path
    defaults: "target/sources.json"
    description: Path or storage URI to the generated dbt source freshness output file.

  - id: max_tolerable_stale_sources
    type: INT
    displayName: Maximum Tolerable Stale Sources
    defaults: 0
    description: Allowable number of stale or error-state source tables before alerting.

triggers:
  - id: freshness_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits dbt source freshness outputs every 30 minutes. Shipped disabled by default.
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: evaluate_source_freshness
    type: io.kestra.plugin.scripts.python.Script
    description: Parse dbt sources.json artifact and evaluate table freshness against defined SLAs.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      SOURCES_PATH: "{{ inputs.sources_json_path }}"
    script: |
      import os
      import json
      from kestra import Kestra

      # Simulated evaluation of dbt source freshness output
      sources = [
          {"source_name": "raw_stripe", "table_name": "charges", "max_loaded_at_time_ago_hours": 14.2, "status": "error", "criteria": "error after 6h"},
          {"source_name": "raw_salesforce", "table_name": "opportunity", "max_loaded_at_time_ago_hours": 2.1, "status": "pass", "criteria": "error after 12h"},
          {"source_name": "raw_zendesk", "table_name": "tickets", "max_loaded_at_time_ago_hours": 8.5, "status": "warn", "criteria": "warn after 4h"}
      ]

      stale = [s for s in sources if s["status"] in ["warn", "error"]]
      summary = f"dbt source freshness audit detected {len(stale)} stale source table(s) breaching data freshness SLAs."
      lines = [f"• `{s['source_name']}.{s['table_name']}`: [{s['status'].upper()}] Last updated {s['max_loaded_at_time_ago_hours']}h ago ({s['criteria']})" for s in stale]

      Kestra.outputs({
          "stale_source_count": len(stale),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All upstream dbt source tables meeting freshness SLAs."
      })

  - id: check_source_freshness
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if dbt source freshness breaches SLA.
    condition: "{{ outputs.evaluate_source_freshness.vars.stale_source_count > inputs.max_tolerable_stale_sources }}"
    then:
      - id: notify_slack_dbt_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post dbt source freshness SLA breach alert to data platform channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#dbt-data-ops-alerts",
            "username": "Kestra dbt Freshness Sentinel",
            "icon_emoji": ":hammer_and_wrench:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "dbt Source Data Freshness SLA Breach",
                "text": "{{ outputs.evaluate_source_freshness.vars.summary }}",
                "fields": [
                  {
                    "title": "Artifact Path",
                    "value": "`{{ inputs.sources_json_path }}`",
                    "short": true
                  },
                  {
                    "title": "Stale Sources Count",
                    "value": "{{ outputs.evaluate_source_freshness.vars.stale_source_count }}",
                    "short": true
                  },
                  {
                    "title": "Stale Source Tables",
                    "value": "{{ outputs.evaluate_source_freshness.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra dbt Freshness Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "dbt Freshness Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while parsing source freshness artifact.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: dbt Core source data freshness SLA breach sentinel
  metaTitle: dbt Source Freshness Sentinel | Kestra
  metaDescription: Audit dbt Core source data freshness results via sources.json metadata, alerting data engineering in Slack when upstream database replication falls behind.
  description: |
    Audits upstream source data freshness in dbt Core projects by evaluating `sources.json` run artifacts, identifies source tables exceeding `loaded_at_field` freshness thresholds, and alerts analytics engineers in Slack before downstream transformation models run on stale data.

    ## What you get
    - Real-time discovery of stalled upstream CDC pipelines, Fivetran syncs, or replication jobs.
    - Parsing of dbt `sources.json` artifacts with warn/error SLA criteria.
    - Contextual Slack alerts detailing source names, table names, and elapsed hours since last loaded record.
    - Prevention of inaccurate BI dashboards caused by executing transformations against stale source data.

    ## Who it's for
    - Analytics Engineers and Data Engineers building data transformations with dbt.
    - Data Governance Leads enforcing source table freshness SLAs across business domains.
    - BI Developers ensuring timely dashboard data updates.

    ## Why orchestrate this with Kestra
    Running expensive dbt transformation models on data that hasn't refreshed wastes cloud warehouse compute credits and produces misleading reports. Kestra schedules `dbt source freshness` checks, parses the resulting `sources.json` metadata in Python, and alerts engineers to repair ingestion pipelines before downstream transformation jobs execute.

    ## Prerequisites
    - Access to dbt Core execution artifacts (`sources.json`) stored in Kestra internal storage, S3, or GCS.
    - A Slack Incoming Webhook URL configured for data alerts.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `sources_json_path` to your target dbt artifact location.
    3. Run a manual execution from the Kestra UI to verify that freshness metadata is evaluated.
    4. Enable the `freshness_audit_schedule` trigger to begin continuous 30-minute auditing.

    ## How to extend
    - Gate downstream `dbt build` or `dbt run` workflows in Kestra, automatically canceling runs if source freshness fails.
    - Correlate source table lag with Airbyte or Fivetran connector sync durations.
    - Export daily source freshness SLA compliance rates to ClickHouse or BigQuery.

    ## Links
    - [dbt Source Freshness Documentation](https://docs.getdbt.com/docs/build/sources#source-freshness)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
