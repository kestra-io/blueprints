id: postgres-cross-environment-index-and-constraint-parity-guard
namespace: company.database
description: |
  Audits PostgreSQL databases across staging and production environments for index and constraint drift,
  detecting missing indexes, invalid concurrent indexes, and unvalidated constraints, and alerting engineering on Slack.

concurrency:
  limit: 1

inputs:
  - id: staging_jdbc_url
    type: STRING
    displayName: Staging JDBC URL
    description: JDBC connection URL for the staging or pre-production PostgreSQL database.
    defaults: jdbc:postgresql://localhost:5432/staging_db

  - id: production_jdbc_url
    type: STRING
    displayName: Production JDBC URL
    description: JDBC connection URL for the production PostgreSQL database.
    defaults: jdbc:postgresql://localhost:5432/production_db

  - id: schema_name
    type: STRING
    displayName: Target Schema Name
    description: Schema to inspect for index and constraint parity across environments.
    defaults: public

  - id: fail_on_critical_drift
    type: BOOL
    displayName: Fail on Critical Drift
    description: When true, halts execution with an error if critical schema drift (missing primary keys, unique constraints, or foreign keys) is detected.
    defaults: true

  - id: slack_channel
    type: STRING
    displayName: Alert Channel
    description: Destination Slack channel for schema object parity alerts.
    defaults: "#database-alerts"

triggers:
  - id: post_migration_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled morning parity audit executed at 04:00 UTC Monday through Friday.
    cron: "0 4 * * 1-5"
    disabled: true

tasks:
  - id: query_staging_indexes_and_constraints
    type: io.kestra.plugin.jdbc.postgres.Query
    description: Query staging database catalog for all user table indexes and constraints.
    url: "{{ inputs.staging_jdbc_url }}"
    username: "{{ secret('STAGING_POSTGRES_USER') }}"
    password: "{{ secret('STAGING_POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        'INDEX' AS object_type,
        t.relname AS table_name,
        i.relname AS object_name,
        am.amname AS detail_type,
        ix.indisvalid AS is_valid,
        ix.indisunique AS is_unique,
        pg_get_indexdef(ix.indexrelid) AS definition,
        t.relkind AS table_relkind
      FROM pg_index ix
      JOIN pg_class i ON i.oid = ix.indexrelid
      JOIN pg_class t ON t.oid = ix.indrelid
      JOIN pg_namespace n ON n.oid = t.relnamespace
      JOIN pg_am am ON am.oid = i.relam
      WHERE n.nspname = '{{ inputs.schema_name }}'
        AND t.relkind IN ('r', 'p')
        AND NOT t.relispartition
        AND NOT EXISTS (
          SELECT 1 FROM pg_constraint c
          WHERE c.conindid = ix.indexrelid
            AND c.conrelid = t.oid
            AND c.contype IN ('p', 'u', 'x')
        )

      UNION ALL

      SELECT
        'CONSTRAINT' AS object_type,
        t.relname AS table_name,
        c.conname AS object_name,
        CASE c.contype
          WHEN 'p' THEN 'PRIMARY KEY'
          WHEN 'f' THEN 'FOREIGN KEY'
          WHEN 'u' THEN 'UNIQUE'
          WHEN 'c' THEN 'CHECK'
          WHEN 'x' THEN 'EXCLUSION'
          ELSE c.contype::text
        END AS detail_type,
        c.convalidated AS is_valid,
        CASE WHEN c.contype IN ('p', 'u') THEN true ELSE false END AS is_unique,
        pg_get_constraintdef(c.oid) AS definition,
        t.relkind AS table_relkind
      FROM pg_constraint c
      JOIN pg_class t ON t.oid = c.conrelid
      JOIN pg_namespace n ON n.oid = c.connamespace
      WHERE n.nspname = '{{ inputs.schema_name }}'
        AND t.relkind IN ('r', 'p')
        AND NOT t.relispartition
      ORDER BY object_type, table_name, object_name;

  - id: query_production_indexes_and_constraints
    type: io.kestra.plugin.jdbc.postgres.Query
    description: Query production database catalog for all user table indexes and constraints.
    url: "{{ inputs.production_jdbc_url }}"
    username: "{{ secret('PRODUCTION_POSTGRES_USER') }}"
    password: "{{ secret('PRODUCTION_POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        'INDEX' AS object_type,
        t.relname AS table_name,
        i.relname AS object_name,
        am.amname AS detail_type,
        ix.indisvalid AS is_valid,
        ix.indisunique AS is_unique,
        pg_get_indexdef(ix.indexrelid) AS definition,
        t.relkind AS table_relkind
      FROM pg_index ix
      JOIN pg_class i ON i.oid = ix.indexrelid
      JOIN pg_class t ON t.oid = ix.indrelid
      JOIN pg_namespace n ON n.oid = t.relnamespace
      JOIN pg_am am ON am.oid = i.relam
      WHERE n.nspname = '{{ inputs.schema_name }}'
        AND t.relkind IN ('r', 'p')
        AND NOT t.relispartition
        AND NOT EXISTS (
          SELECT 1 FROM pg_constraint c
          WHERE c.conindid = ix.indexrelid
            AND c.conrelid = t.oid
            AND c.contype IN ('p', 'u', 'x')
        )

      UNION ALL

      SELECT
        'CONSTRAINT' AS object_type,
        t.relname AS table_name,
        c.conname AS object_name,
        CASE c.contype
          WHEN 'p' THEN 'PRIMARY KEY'
          WHEN 'f' THEN 'FOREIGN KEY'
          WHEN 'u' THEN 'UNIQUE'
          WHEN 'c' THEN 'CHECK'
          WHEN 'x' THEN 'EXCLUSION'
          ELSE c.contype::text
        END AS detail_type,
        c.convalidated AS is_valid,
        CASE WHEN c.contype IN ('p', 'u') THEN true ELSE false END AS is_unique,
        pg_get_constraintdef(c.oid) AS definition,
        t.relkind AS table_relkind
      FROM pg_constraint c
      JOIN pg_class t ON t.oid = c.conrelid
      JOIN pg_namespace n ON n.oid = c.connamespace
      WHERE n.nspname = '{{ inputs.schema_name }}'
        AND t.relkind IN ('r', 'p')
        AND NOT t.relispartition
      ORDER BY object_type, table_name, object_name;

  - id: reconcile_parity_drift
    type: io.kestra.plugin.scripts.python.Script
    description: Compute set differences between staging and production schema objects.
    containerImage: python:3.11-slim
    dependencies:
      - kestra
    env:
      SCHEMA_NAME: "{{ inputs.schema_name }}"
      STAGING_OBJECTS: "{{ outputs.query_staging_indexes_and_constraints.rows | toJson }}"
      PROD_OBJECTS: "{{ outputs.query_production_indexes_and_constraints.rows | toJson }}"
    script: |
      import json
      import os
      import re
      from kestra import Kestra

      schema = os.environ.get("SCHEMA_NAME", "public")
      staging = json.loads(os.environ.get("STAGING_OBJECTS") or "[]") or []
      prod = json.loads(os.environ.get("PROD_OBJECTS") or "[]") or []

      def normalize_def(d):
          return re.sub(r'\s+', ' ', d or '').strip()

      staging_map = {(o["table_name"], o["object_type"], o["object_name"]): o for o in staging}
      prod_map = {(o["table_name"], o["object_type"], o["object_name"]): o for o in prod}
      prod_by_def = {(o["table_name"], o["object_type"], normalize_def(o.get("definition"))): o for o in prod}

      missing_in_prod = []
      missing_in_staging = []
      invalid_in_prod = []
      unvalidated_in_prod = []
      definition_drift = []
      name_drift = []
      remediations = []
      critical_drift = False

      for key, s_obj in staging_map.items():
          tbl, obj_type, obj_name = key
          s_norm = normalize_def(s_obj.get("definition"))

          if key not in prod_map:
              def_key = (tbl, obj_type, s_norm)
              if def_key in prod_by_def:
                  p_match = prod_by_def[def_key]
                  name_drift.append({"table": tbl, "staging_name": obj_name, "prod_name": p_match["object_name"]})
                  if obj_type == "INDEX":
                      remediations.append(f'ALTER INDEX "{schema}"."{p_match["object_name"]}" RENAME TO "{obj_name}";')
                  else:
                      remediations.append(f'ALTER TABLE "{schema}"."{tbl}" RENAME CONSTRAINT "{p_match["object_name"]}" TO "{obj_name}";')
              else:
                  missing_in_prod.append(s_obj)
                  if s_obj.get("detail_type") in ("PRIMARY KEY", "UNIQUE", "FOREIGN KEY"):
                      critical_drift = True
                  if obj_type == "INDEX":
                      if s_obj.get("table_relkind") == "p" or " ON ONLY " in s_obj.get("definition", ""):
                          remediations.append(f"{s_obj['definition']};")
                      else:
                          concurrent_def = re.sub(r"^CREATE (UNIQUE )?INDEX ", r"CREATE \1INDEX CONCURRENTLY ", s_obj["definition"])
                          remediations.append(f"{concurrent_def};")
                  elif obj_type == "CONSTRAINT":
                      if s_obj.get("detail_type") in ("CHECK", "FOREIGN KEY"):
                          remediations.append(f'ALTER TABLE "{schema}"."{tbl}" ADD CONSTRAINT "{obj_name}" {s_obj["definition"]} NOT VALID;')
                      else:
                          remediations.append(f'ALTER TABLE "{schema}"."{tbl}" ADD CONSTRAINT "{obj_name}" {s_obj["definition"]};')
          else:
              p_obj = prod_map[key]
              p_norm = normalize_def(p_obj.get("definition"))
              if s_norm != p_norm or s_obj.get("is_unique") != p_obj.get("is_unique"):
                  definition_drift.append({"table": tbl, "object": obj_name, "staging": s_norm, "prod": p_norm})
                  critical_drift = True
              elif obj_type == "INDEX" and not p_obj.get("is_valid"):
                  invalid_in_prod.append(p_obj)
                  critical_drift = True
                  remediations.append(f'REINDEX INDEX CONCURRENTLY "{schema}"."{obj_name}";')
              elif obj_type == "CONSTRAINT" and not p_obj.get("is_valid"):
                  unvalidated_in_prod.append(p_obj)
                  remediations.append(f'ALTER TABLE "{schema}"."{tbl}" VALIDATE CONSTRAINT "{obj_name}";')

      for key, p_obj in prod_map.items():
          if key not in staging_map:
              p_norm = normalize_def(p_obj.get("definition"))
              if (p_obj["table_name"], p_obj["object_type"], p_norm) not in prod_by_def:
                  missing_in_staging.append(p_obj)

      total_drift = len(missing_in_prod) + len(missing_in_staging) + len(invalid_in_prod) + len(unvalidated_in_prod) + len(definition_drift) + len(name_drift)
      drift_detected = total_drift > 0

      lines = [
          f"*PostgreSQL Cross-Environment Index and Constraint Drift Alert*",
          f"• *Schema*: `{schema}` | *Severity*: `{'CRITICAL' if critical_drift else 'WARNING'}`",
          f"• *Missing in Production*: `{len(missing_in_prod)}` objects",
          f"• *Missing in Staging*: `{len(missing_in_staging)}` objects",
          f"• *Definition Drift*: `{len(definition_drift)}` objects",
          f"• *Invalid Production Indexes*: `{len(invalid_in_prod)}` objects",
          f"• *Unvalidated Production Constraints*: `{len(unvalidated_in_prod)}` objects",
          f"• *Remediation Guidance*: Run safe non-blocking DDL statements to reconcile environments."
      ]
      if remediations:
          lines.append("• *Recommended Remediation Statements*:")
          for stmt in remediations[:8]:
              lines.append(f"  `{stmt}`")

      slack_text = "\n".join(lines)

      Kestra.outputs({
          "staging_total_count": len(staging),
          "prod_total_count": len(prod),
          "missing_in_prod_count": len(missing_in_prod),
          "missing_in_staging_count": len(missing_in_staging),
          "invalid_prod_index_count": len(invalid_in_prod),
          "unvalidated_prod_constraint_count": len(unvalidated_in_prod),
          "definition_drift_count": len(definition_drift),
          "name_drift_count": len(name_drift),
          "drift_detected": drift_detected,
          "critical_drift": critical_drift,
          "slack_text": slack_text,
          "remediation_statements": remediations[:10]
      })

  - id: export_parity_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Export structured telemetry recording schema parity audit results before evaluation gates.
    format:
      schema: "{{ inputs.schema_name }}"
      staging_total_count: "{{ outputs.reconcile_parity_drift.vars.staging_total_count }}"
      prod_total_count: "{{ outputs.reconcile_parity_drift.vars.prod_total_count }}"
      missing_in_prod_count: "{{ outputs.reconcile_parity_drift.vars.missing_in_prod_count }}"
      missing_in_staging_count: "{{ outputs.reconcile_parity_drift.vars.missing_in_staging_count }}"
      invalid_prod_index_count: "{{ outputs.reconcile_parity_drift.vars.invalid_prod_index_count }}"
      unvalidated_prod_constraint_count: "{{ outputs.reconcile_parity_drift.vars.unvalidated_prod_constraint_count }}"
      definition_drift_count: "{{ outputs.reconcile_parity_drift.vars.definition_drift_count }}"
      drift_detected: "{{ outputs.reconcile_parity_drift.vars.drift_detected }}"
      status: "{{ outputs.reconcile_parity_drift.vars.drift_detected ? 'DRIFT_DETECTED' : 'PARITY_VERIFIED' }}"

  - id: evaluate_parity_drift
    type: io.kestra.plugin.core.flow.If
    description: Branch execution when index or constraint drift is detected between environments.
    condition: "{{ outputs.reconcile_parity_drift.vars.drift_detected == true }}"
    then:
      - id: notify_slack_parity_drift
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch schema parity alert with drift summary and non-blocking remediation statements.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": {{ outputs.reconcile_parity_drift.vars.slack_text | toJson }}
          }

      - id: check_critical_drift_gate
        type: io.kestra.plugin.core.flow.If
        description: Halt pipeline execution when critical schema drift is present and gating is enabled.
        condition: "{{ inputs.fail_on_critical_drift == true and outputs.reconcile_parity_drift.vars.critical_drift == true }}"
        then:
          - id: fail_on_critical_drift
            type: io.kestra.plugin.core.execution.Fail
            description: Halt workflow to prevent deployment cutover when critical indexes or constraints are absent.
            errorMessage: "Critical database schema drift detected: missing primary keys, unique constraints, foreign keys, or invalid indexes in production environment."

extend:
  title: PostgreSQL Cross-Environment Index and Constraint Parity Guard
  metaDescription: Audit PostgreSQL databases across staging and production for missing indexes, invalid index states, and unvalidated constraints, alerting Slack.
  description: |
    Automated PostgreSQL database reliability guard that reconciles index and constraint definitions across staging and production environments. Identifies missing indexes, aborted concurrent indexes, and unvalidated foreign keys or check constraints, generating safe remediation statements and alerting engineering teams on Slack.

    ## What this blueprint does

    In agile database operations, schema migration tools (Flyway, Liquibase, Alembic, Django, Prisma) frequently leave staging and production environments in subtle, silent drift:

    1. **Aborted Concurrent Indexes**: `CREATE INDEX CONCURRENTLY` operations that time out or fail on locks leave invalid indexes (`indisvalid = false`) that consume storage and write overhead without ever serving queries.
    2. **Un-Backported Production Hotfixes**: Indexes created manually in production during an incident are rarely backported to migration repositories or staging databases, causing staging test suites to benchmark unrepresentative query plans.
    3. **Missing or Unvalidated Constraints**: Foreign keys, unique constraints, or primary keys added with `NOT VALID` that were never validated (`convalidated = false`) allow referential integrity violations to persist undetected.

    This blueprint enforces continuous object parity across environments without running risky DDL alterations:

    1. Queries the PostgreSQL system catalog (`pg_index`, `pg_class`, `pg_am`, `pg_constraint`, `pg_namespace`) on both staging and production.
    2. Filters out constraint-backing indexes from `pg_index` to avoid dual-representation duplicate alerts.
    3. Excludes partition child tables (`NOT t.relispartition`) to focus on canonical root partitioned tables and index specifications.
    4. Reconciles index methods, uniqueness, validity, and full DDL definitions for every user table in the target schema.
    5. Inspects constraints for type (`PRIMARY KEY`, `FOREIGN KEY`, `UNIQUE`, `CHECK`), validation status (`convalidated`), and full constraint definitions.
    6. Identifies synonym and name drift where identical definitions exist under differing names.
    7. Emits safe, non-blocking remediation scripts (`CREATE INDEX CONCURRENTLY`, `REINDEX INDEX CONCURRENTLY`, `ALTER TABLE ... VALIDATE CONSTRAINT`).
    8. Dispatches an alert to Slack and optionally halts deployment pipelines when critical constraints are missing.
    9. Exports a structured audit manifest recording exact parity metrics.

    ## How it works

    1. **Scheduled or Post-Deploy Trigger**: Runs automatically on a weekday morning schedule via `post_migration_audit_schedule` or triggered on-demand following CI/CD migration deployments.
    2. **Staging Catalog Query**: The `query_staging_indexes_and_constraints` task connects to the staging database via `io.kestra.plugin.jdbc.postgres.Query` and retrieves all index and constraint metadata.
    3. **Production Catalog Query**: The `query_production_indexes_and_constraints` task executes the identical query against the production database.
    4. **Reconciliation Analysis**: The `reconcile_parity_drift` task runs a Python reconciliation script that performs set comparisons, detects invalid indexes, isolates unvalidated constraints, and compiles non-blocking remediation SQL.
    5. **Audit Telemetry**: The `export_parity_manifest` task records a structured JSON summary for compliance logs before evaluation gates.
    6. **Conditional Alerting**: The `evaluate_parity_drift` task checks `outputs.reconcile_parity_drift.vars.drift_detected`. When drift is present, `notify_slack_parity_drift` posts a detailed breakdown to Slack.
    7. **Deployment Gate**: If `inputs.fail_on_critical_drift` is enabled and missing primary keys, unique constraints, or invalid indexes are detected, `fail_on_critical_drift` terminates the execution to gate release cutover.

    ## Who it is for

    - **Database Administrators & Platform Engineers**: Preventing query plan regressions and broken constraints caused by silent migration drift.
    - **DevOps & Release Engineers**: Adding automated post-migration verification gates to deployment pipelines.
    - **Backend & Data Engineers**: Verifying that local and staging database definitions match production environments.

    ## Why orchestrate this with Kestra

    Generic schema diff tools attempt full DDL generation that can issue unsafe table locks or fail on complex column conversions. Kestra orchestrates multi-database inspection through native JDBC connections, runs safe set-based parity reconciliation, isolates non-blocking index and constraint issues, and routes actionable alerts directly to engineering workflows.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `staging_jdbc_url` | STRING | `jdbc:postgresql://localhost:5432/staging_db` | JDBC connection URL for the staging database. |
    | `production_jdbc_url` | STRING | `jdbc:postgresql://localhost:5432/production_db` | JDBC connection URL for the production database. |
    | `schema_name` | STRING | `public` | Schema to inspect for index and constraint parity. |
    | `fail_on_critical_drift` | BOOL | `true` | When true, fails the execution if critical constraints or indexes are missing. |
    | `slack_channel` | STRING | `#database-alerts` | Destination Slack channel for parity alerts. |

    ## Expected outputs

    - `{{ outputs.query_staging_indexes_and_constraints.rows }}`: Catalog metadata rows for staging indexes and constraints.
    - `{{ outputs.query_production_indexes_and_constraints.rows }}`: Catalog metadata rows for production indexes and constraints.
    - `{{ outputs.reconcile_parity_drift.vars }}`: Detailed parity metrics including `staging_total_count`, `prod_total_count`, `missing_in_prod_count`, `missing_in_staging_count`, `invalid_prod_index_count`, `unvalidated_prod_constraint_count`, `definition_drift_count`, `drift_detected`, and `remediation_statements`.
    - `{{ outputs.export_parity_manifest.value }}`: Structured telemetry manifest recording final parity status (`PARITY_VERIFIED` vs `DRIFT_DETECTED`).

    ## Prerequisites

    - Two PostgreSQL database instances (staging and production) accessible to Kestra workers.
    - Read permissions on `pg_catalog.pg_index`, `pg_class`, `pg_am`, `pg_constraint`, and `pg_namespace` for both databases.
    - A Slack Incoming Webhook URL configured for your database alerts channel.

    ### Secrets

    - `STAGING_POSTGRES_USER`: Database username for the staging PostgreSQL instance.
    - `STAGING_POSTGRES_PASSWORD`: Database password for the staging PostgreSQL instance.
    - `PRODUCTION_POSTGRES_USER`: Database username for the production PostgreSQL instance.
    - `PRODUCTION_POSTGRES_PASSWORD`: Database password for the production PostgreSQL instance.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for sending parity alerts.

    ## Quick start

    1. Configure `STAGING_POSTGRES_USER`, `STAGING_POSTGRES_PASSWORD`, `PRODUCTION_POSTGRES_USER`, `PRODUCTION_POSTGRES_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI, supplying your staging and production JDBC connection URLs.
    4. Review execution outputs to inspect index and constraint parity status between environments.

    ## Common pitfalls and troubleshooting

    - **Non-Transactional Concurrent Remediation**: `CREATE INDEX CONCURRENTLY` and `REINDEX INDEX CONCURRENTLY` cannot execute inside a transaction block. Any downstream automation executing remediation statements must run with autocommit enabled.
    - **Partitioned Table Indexes**: PostgreSQL disallows `CONCURRENTLY` on partitioned tables (`relkind = 'p'`). The blueprint automatically detects partitioned tables and omits `CONCURRENTLY` for root partition index definitions.
    - **Concurrent Index Builds in Progress**: A concurrent index currently being built by PostgreSQL will temporarily show `indisvalid = false`. Ensure the sentinel runs after scheduled migration jobs finish to avoid false positives.
    - **Cross-Database Connectivity**: Kestra workers must have network access to both staging and production database endpoints. If databases reside in separate VPCs, configure VPC peering or appropriate security group ingress rules.
    - **Excluded System Schemas**: The catalog query explicitly targets the specified `schema_name` (default `public`), excluding internal PostgreSQL schemas (`pg_catalog`, `information_schema`, and `pg_toast`).

    ## How to extend

    - Add automated GitHub or GitLab issue creation with the generated remediation statements when drift is detected.
    - Chain this flow as a Subflow task in your deployment pipeline to gate staging-to-production cutover.
    - Extend the catalog queries to inspect foreign table or partition index alignment using `pg_partitioned_table`.

    ## Links

    - Kestra PostgreSQL Plugin Documentation: https://kestra.io/plugins/plugin-jdbc-postgres
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - PostgreSQL System Catalogs Documentation: https://www.postgresql.org/docs/current/catalogs.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Databases
    - Migration & Maintenance
  ee: false
  demo: false
