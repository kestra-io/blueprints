id: azure-cosmos-db-429-ru-rate-limit-sentinel
namespace: company.cloud

inputs:
  - id: subscription_id
    type: STRING
    description: Azure Subscription ID.
  - id: resource_group
    type: STRING
    description: Azure Resource Group name.
  - id: cosmos_account_name
    type: STRING
    description: Azure Cosmos DB account name.
  - id: threshold_429_count
    type: INT
    defaults: 10
    description: "Maximum allowable HTTP 429 rate limit exceptions before alerting (default 10)."

tasks:
  - id: check_cosmos_rate_limiting
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: mcr.microsoft.com/azure-cli:latest
    commands:
      - |
        az login --service-principal -u "{{ secret('AZURE_CLIENT_ID') }}" -p "{{ secret('AZURE_CLIENT_SECRET') }}" --tenant "{{ secret('AZURE_TENANT_ID') }}" --output none
        az account set --subscription "{{ inputs.subscription_id }}"
        
        RESOURCE_ID="/subscriptions/{{ inputs.subscription_id }}/resourceGroups/{{ inputs.resource_group }}/providers/Microsoft.DocumentDB/databaseAccounts/{{ inputs.cosmos_account_name }}"
        
        az monitor metrics list           --resource "$RESOURCE_ID"           --metric "TotalRequests"           --filter "StatusCode eq '429'"           --interval PT5M           --output json > /tmp/cosmos_telemetry.json
        
        EXCEPTIONS_429=$(jq '[.value[]?.timeseries[]?.data[]?.total // 0] | add // 0' /tmp/cosmos_telemetry.json)
        echo "::set-output name=rate_limited_count::$EXCEPTIONS_429::"

  - id: evaluate_rate_limit
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_cosmos_rate_limiting.vars.rate_limited_count | int > inputs.threshold_429_count }}"
    then:
      - id: notify_data_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#cloud-ops",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Azure Cosmos DB Rate Limit (HTTP 429) Alert",
                "text": "Cosmos DB Account `{{ inputs.cosmos_account_name }}` experienced *{{ outputs.check_cosmos_rate_limiting.vars.rate_limited_count }} HTTP 429 exceptions* over the last 5 minutes! Allocated Request Units per second (RU/s) have been saturated by application queries.",
                "footer": "Kestra Cloud Sentinel • Microsoft Azure"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#cloud-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Azure Cosmos DB Rate Limit Sentinel Failure",
            "text": "Failed to query Azure Monitor metrics for Cosmos DB account. Verify service principal credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      subscription_id: replace-with-your-subscription-id
      resource_group: replace-with-your-resource-group
      cosmos_account_name: replace-with-your-cosmos-account-name

extend:
  metaDescription: "Audits Azure Cosmos DB for HTTP 429 Request Rate Too Large exceptions indicating provisioned RU/s exhaustion."
  metaTitle: Microsoft Azure Cosmos DB 429 Request Unit Rate Limit Sentinel with Kestra
  title: Microsoft Azure Cosmos DB 429 Request Unit Rate Limit Sentinel
  shortDescription: Audits Azure Cosmos DB for HTTP 429 Request Rate Too Large exceptions indicating provisioned RU/s exhaustion.
  description: |
    ## How it works
    This workflow audits Azure Cosmos DB for capacity saturation by monitoring the `TotalRequests` metric filtered by HTTP status code `429` (Request Rate Too Large) via the Azure CLI container. In Cosmos DB, transactions that exceed provisioned Request Units (RU/s) or autoscale limits are throttled with 429 errors, resulting in elevated application latency or request retries. The flow parses metric samples with `jq` and dispatches alerts when rate-limiting exceeds thresholds.

    ## What you get
    - Immediate awareness when Cosmos DB database or container throughput limits are exceeded.
    - Prevents downstream user-facing API degraded performance and query timeouts.
    - Quantitative metrics on throttled database requests.

    ## Who it's for
    - Database Administrators (DBAs) and Application Developers utilizing Azure Cosmos DB.
    - SRE and Cloud Operations teams maintaining high-availability database tiers.

    ## Why orchestrate this with Kestra
    - **Continuous Capacity Guard**: Scheduled monitoring ensures persistent throughput headroom.
    - **Cloud-Native CLI Execution**: Uses standard Azure CLI inside an isolated container execution environment.
    - **Centralized Incident Dispatch**: Direct alerts to Slack with resource IDs and breach metrics.

    ## Prerequisites
    - Azure Service Principal with `Monitoring Reader` permissions on the Cosmos DB account.
    - Secrets `AZURE_CLIENT_ID`, `AZURE_CLIENT_SECRET`, `AZURE_TENANT_ID`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Fill in Azure Subscription ID, Resource Group, and Cosmos DB account name.
    3. Run the workflow to verify current rate-limit metrics.

    ## How to extend
    - Integrate with Azure REST API to automatically bump autoscale max RU/s during workload surges.
    - Store historical 429 breach frequencies in Kestra KV store for weekly capacity reviews.

    ## Links
    - [Diagnose and Troubleshoot Azure Cosmos DB Request Rate Too Large (429) Exceptions](https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/troubleshoot-request-rate-too-large)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Cloud
    - Data
  subTags:
    - Azure Services
    - Infrastructure Automation
  ee: false
  verified: false
  demo: false
