id: clickhouse-async-insert-buffer-overflow-sentinel
namespace: company.team

inputs:
  - id: clickhouse_host
    type: STRING
    defaults: "clickhouse.internal"
    description: ClickHouse server hostname or IP address.
  - id: clickhouse_http_port
    type: INT
    defaults: 8123
    description: ClickHouse HTTP interface port.
  - id: clickhouse_user
    type: STRING
    defaults: "default"
    description: ClickHouse user name.
  - id: failed_batch_threshold
    type: INT
    defaults: 5
    description: Maximum acceptable count of failed asynchronous insert batches in the last 15 minutes.

tasks:
  - id: query_async_insert_failures
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        set -euo pipefail
        python3 -c "
        import requests, json, sys

        host = '{{ inputs.clickhouse_host }}'
        port = {{ inputs.clickhouse_http_port }}
        user = '{{ inputs.clickhouse_user }}'
        pwd = '{{ secret('CLICKHOUSE_PASSWORD') }}'
        query = 'SELECT count() as failed_count, sum(rows) as failed_rows FROM system.asynchronous_insert_log WHERE event_time >= now() - INTERVAL 15 MINUTE AND status != \'Ok\' FORMAT JSON'

        try:
            resp = requests.get(f'http://{host}:{port}/', params={'query': query}, auth=(user, pwd), timeout=15)
            resp.raise_for_status()
            data = resp.json().get('data', [{}])
            failed_count = int(data[0].get('failed_count', 0)) if data else 0
            failed_rows = int(data[0].get('failed_rows', 0)) if data and data[0].get('failed_rows') is not None else 0

            result = {
                'clickhouse_host': host,
                'failed_count': failed_count,
                'failed_rows': failed_rows,
                'alert_triggered': failed_count > {{ inputs.failed_batch_threshold }}
            }
            with open('clickhouse_async_summary.json', 'w') as out:
                json.dump(result, out)
            print('ClickHouse async insert metrics:', result)
        except Exception as err:
            sys.stderr.write(f'ClickHouse query error: {err}\n')
            sys.exit(1)
        "
    outputFiles:
      - clickhouse_async_summary.json

  - id: evaluate_async_insert_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.query_async_insert_failures.outputFiles['clickhouse_async_summary.json'])).alert_triggered }}"
    then:
      - id: notify_data_engineers
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#clickhouse-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": ":rotating_light: ClickHouse Async Insert Buffer Overflow Alert",
                "text": "ClickHouse node `{{ inputs.clickhouse_host }}` recorded *{{ fromJson(read(outputs.query_async_insert_failures.outputFiles['clickhouse_async_summary.json'])).failed_count }}* failed asynchronous insert batches (*{{ fromJson(read(outputs.query_async_insert_failures.outputFiles['clickhouse_async_summary.json'])).failed_rows }}* lost rows) over the last 15 minutes. Impact: Client ingest pipelines are dropping events due to `async_insert_max_data_size` buffer saturation or write timeout.",
                "footer": "Kestra Database Sentinel • ClickHouse"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#clickhouse-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": ":warning: ClickHouse Asynchronous Insert Buffer Overflow Sentinel Pipeline Failure",
            "text": "The ClickHouse async insert monitoring query failed. Please verify network connectivity and database credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors ClickHouse system.asynchronous_insert_log to detect buffer overflow rejections and failed async insert batches."
  metaTitle: ClickHouse Asynchronous Insert Buffer Overflow Sentinel with Kestra
  title: ClickHouse Asynchronous Insert Buffer Overflow Sentinel
  shortDescription: Monitors ClickHouse system.asynchronous_insert_log to detect buffer overflow rejections and failed async insert batches.
  description: |
    ## How it works
    This workflow connects to the ClickHouse HTTP interface and queries `system.asynchronous_insert_log` for batches with `status != 'Ok'` occurring over the trailing 15-minute window. When asynchronous insert buffers fill faster than the server can flush them to disk (governed by `async_insert_busy_timeout_ms` and `async_insert_max_data_size`), batches fail or get dropped. If the count of failed batches exceeds the threshold, an incident alert is sent to Slack.

    ## What you get
    - Real-time detection of dropped event batches and buffer saturation in ClickHouse.
    - Prevents silent data loss in high-throughput streaming pipelines.
    - Instant visibility into lost row counts and failure timestamps.

    ## Who it's for
    - Data Platform Engineers operating high-scale ClickHouse analytic clusters.
    - SREs maintaining streaming data ingestion pipelines (Kafka, Vector, FluentBit).

    ## Why orchestrate this with Kestra
    - **Direct HTTP Querying**: Query ClickHouse system catalog tables natively without external agents.
    - **Proactive Ingestion Guard**: Catch buffer queue exhaustion before upstream producers experience TCP backpressure.
    - **Flexible Notification**: Deliver actionable alerts with exact failure counts to engineering teams.

    ## Prerequisites
    - ClickHouse instance with `asynchronous_insert_log` enabled in server configuration.
    - Secrets `CLICKHOUSE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Set `clickhouse_host` and `clickhouse_http_port`.
    3. Trigger the workflow manually or enable the scheduled trigger.

    ## How to extend
    - Increase `async_insert_max_data_size` or tune `async_insert_busy_timeout_ms` automatically via API.
    - Query `system.events` for `FailedAsyncInsertRows` metric trends.

    ## Links
    - [ClickHouse Asynchronous Inserts Documentation](https://clickhouse.com/docs/en/optimize/asynchronous-inserts)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
