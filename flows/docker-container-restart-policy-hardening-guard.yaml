id: docker-container-restart-policy-hardening-guard
namespace: company.team

description: |
  Find the running containers that will not come back after a reboot. A container started
  without a restart policy stays down once the host or the daemon restarts. The daemon
  reports that as correct because it is exactly what it was told. This flow reads the restart
  policy of every container carrying a label you set yourself, skips a protect-list, then sets
  the policy with docker update behind a dry run and an approval. docker update rewrites the
  configuration in place, so the service keeps running and keeps its container id. Every
  labelled container is inspected again afterwards. The run fails if a target is still
  unprotected or if the workload was disturbed.

inputs:
  - id: docker_host
    type: STRING
    displayName: Docker host
    description: TCP endpoint of the daemon to harden, for example tcp://build-01:2375. TCP is required because the container list comes from the Engine API, which a mounted unix socket does not expose to the worker.
    defaults: "tcp://docker-host:2375"

  - id: docker_cli_network
    type: STRING
    displayName: Docker CLI network
    description: Network the one-off docker CLI container joins so it can reach docker_host. Leave it as bridge when the daemon resolves by DNS. Set it to the user-defined network when the daemon is itself a container, such as a Docker-in-Docker endpoint.
    defaults: "bridge"

  - id: label_selector
    type: STRING
    displayName: Label selector
    description: Only containers carrying this label are read, in key=value form. Nothing outside the selector is inspected or changed, so a container the flow does not own cannot be a target.
    defaults: "kestra.restart-policy=managed"

  - id: desired_policy
    type: SELECT
    displayName: Restart policy to set
    description: unless-stopped brings the container back after a reboot unless you stopped it on purpose. always brings it back even then.
    values:
      - unless-stopped
      - always
    defaults: unless-stopped

  - id: protected_name_pattern
    type: STRING
    displayName: Protected name pattern
    description: A container whose name matches this regular expression keeps the policy it has. One-shot jobs belong here, since a job that is meant to run once should not be restarted by the daemon.
    defaults: "^(batch|job|migrate|oneshot|init)([-_.].*)?$"

  - id: max_updates
    type: INT
    displayName: Update ceiling
    description: At most this many containers are changed in one run. The rest are reported and left for the next run, so a wrong selector cannot rewrite a whole host in one go.
    defaults: 25

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: When false the flow only reports. Must be true, together with dry_run false and the approval, for any policy to be written.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: When true the plan is only logged. Must be false, together with auto_remediate, for any policy to be written.
    defaults: true

variables:
  api: "{{ inputs.docker_host | replace({'tcp://': 'http://'}) }}"

tasks:
  - id: list_running
    type: io.kestra.plugin.core.http.Request
    description: Read-only. Asks the Engine API for running containers carrying the label selector. A container outside the selector is never returned, so it cannot be seen or changed.
    uri: "{{ render(vars.api) }}/containers/json"
    method: GET
    params:
      all: "false"
      filters: "{{ {'label': [inputs.label_selector], 'status': ['running']} | toJson }}"

  - id: candidates
    type: io.kestra.plugin.core.output.OutputValues
    description: The candidate ids and names. The list endpoint carries no restart policy, which is why each one is inspected next.
    values:
      ids: >-
        {{ ({'c': fromJson(outputs.list_running.body)} | toJson) | jq('
           [.c[] | {id: .Id, name: (.Names[0] | ltrimstr("/"))}] | sort_by(.name)') | first | toJson }}

  - id: inspect_each
    type: io.kestra.plugin.core.flow.Loop
    description: One read-only inspect per candidate. The restart policy, the start time and the restart counter exist only here.
    values: "{{ outputs.candidates.values.ids }}"
    concurrencyLimit: 4
    outputs:
      - id: state
        type: STRING
        value: >-
          {{ outputs.inspect.body | jq('{id: .Id, name: (.Name | ltrimstr("/")), image: .Config.Image,
             policy: (.HostConfig.RestartPolicy.Name // ""),
             max_retries: (.HostConfig.RestartPolicy.MaximumRetryCount // 0),
             running: .State.Running, status: .State.Status,
             started_at: (.State.StartedAt // ""), restarts: (.RestartCount // 0)}') | first | toJson }}
    tasks:
      - id: inspect
        type: io.kestra.plugin.core.http.Request
        uri: "{{ render(vars.api) }}/containers/{{ fromJson(item.value).id }}/json"
        method: GET

  - id: assess
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      One row per candidate with its verdict. An empty policy name and the literal "no" both mean
      the daemon will leave the container down after a restart. The protect-list and the update
      ceiling both win over HARDEN.
    values:
      rows: >-
        {{ ({'rows': ((outputs.inspect_each.outputs ?? []) | jq('map(.outputs.state | fromjson)') | first),
            're': inputs.protected_name_pattern, 'cap': inputs.max_updates} | toJson) | jq('
           .re as $re | .cap as $cap
           | [.rows[] | . + {unset: ((.policy == "") or (.policy == "no"))}]
           | map(. + {decision: (if (.running | not) then "KEEP_NOT_RUNNING"
                      elif (.name | test($re)) then "KEEP_PROTECTED"
                      elif (.unset | not) then "KEEP_POLICY_SET"
                      else "HARDEN" end)})
           | sort_by(.name)
           | ([.[] | select(.decision == "HARDEN")] | to_entries
              | map(.value + {decision: (if .key < $cap then "HARDEN" else "KEEP_OVER_CAP" end)})) as $h
           | ([.[] | select(.decision != "HARDEN")] + $h) | sort_by(.decision, .name)') | first | toJson }}
      targets: >-
        {{ ({'rows': ((outputs.inspect_each.outputs ?? []) | jq('map(.outputs.state | fromjson)') | first),
            're': inputs.protected_name_pattern, 'cap': inputs.max_updates} | toJson) | jq('
           .re as $re | .cap as $cap
           | [.rows[] | select(.running and ((.name | test($re)) | not)
               and ((.policy == "") or (.policy == "no")))]
           | sort_by(.name) | .[0:$cap]
           | map({id: .id, name: .name, policy: .policy, started_at: .started_at, restarts: .restarts})') | first | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Restart policy guard on {{ inputs.docker_host }}, label {{ inputs.label_selector }}:
      {{ fromJson(outputs.assess.values.rows) | length }} labelled containers read,
      {{ fromJson(outputs.assess.values.targets) | length }} to harden to {{ inputs.desired_policy }}.
      {{ fromJson(outputs.assess.values.rows) | jq('group_by(.decision) | map("\(.[0].decision) \(length)") | join(", ")') | first }}.
      Targets: {{ fromJson(outputs.assess.values.targets) | jq('if length == 0 then "none" else map("\(.name) policy=\(if .policy == "" then "unset" else .policy end) up since \(.started_at)") | join("; ") end') | first }}.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.assess.values.targets) | length > 0 }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Docker restart policy guard on ' ~ inputs.docker_host ~ ': ' ~ (fromJson(outputs.assess.values.targets) | length) ~ ' of ' ~ (fromJson(outputs.assess.values.rows) | length) ~ ' labelled containers are running with no restart policy, so they stay down after a reboot (' ~ (fromJson(outputs.assess.values.targets) | jq('map("\(.name) policy=\(if .policy == "" then "unset" else .policy end)") | join(", ")') | first) ~ '). ' ~ (inputs.auto_remediate and not inputs.dry_run ? 'Setting ' ~ inputs.desired_policy ~ ' waits for approval on this execution.' : 'Nothing changed (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        description: A policy is written only when auto_remediate is true, dry_run is false and the pause below is approved.
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: hold
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              The change is a configuration rewrite, not a restart, so the listed services keep
              running. Read the plan in the summary above, then resume with approved true.
            onResume:
              - id: approved
                type: BOOL
                required: false
                description: Set true to write the restart policy on the listed containers. Anything else leaves the host untouched.

          - id: approval_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.hold.onResume.approved ?? false }}"
            then:
              - id: remediate_update
                type: io.kestra.plugin.core.flow.Loop
                description: One docker update per target, sequential so a failure is attributable to one container.
                values: "{{ outputs.assess.values.targets }}"
                concurrencyLimit: 1
                tasks:
                  - id: update_one
                    type: io.kestra.plugin.scripts.shell.Commands
                    description: >-
                      docker update rewrites HostConfig.RestartPolicy on the existing container. It
                      does not stop, restart or recreate it, so the process keeps running and the
                      container id stays the same. The docker plugin has no update task, so the CLI
                      runs in a container that talks to docker_host and to nothing else.
                    allowFailure: true
                    taskRunner:
                      type: io.kestra.plugin.scripts.runner.docker.Docker
                      networkMode: "{{ inputs.docker_cli_network }}"
                    containerImage: docker:27-cli
                    env:
                      DOCKER_HOST: "{{ inputs.docker_host }}"
                    commands:
                      - docker update --restart={{ inputs.desired_policy }} {{ fromJson(item.value).id }}

              - id: reverify_each
                type: io.kestra.plugin.core.flow.Loop
                description: >-
                  Read every labelled container again, by name, so a container that was recreated
                  comes back with a different id instead of reading as untouched. A container that
                  disappeared is reported as absent rather than failing the loop.
                values: "{{ outputs.candidates.values.ids }}"
                concurrencyLimit: 4
                outputs:
                  - id: after
                    type: STRING
                    value: >-
                      {{ ({'name': fromJson(item.value).name, 'b': (outputs.reinspect.body ?? '')} | toJson) | jq('
                         if .b == "" then {name: .name, present: false}
                         else (.b | fromjson) as $c
                         | {name: .name, present: true, id: $c.Id,
                            policy: ($c.HostConfig.RestartPolicy.Name // ""),
                            running: $c.State.Running, status: $c.State.Status,
                            started_at: ($c.State.StartedAt // ""), restarts: ($c.RestartCount // 0)} end') | first | toJson }}
                tasks:
                  - id: reinspect
                    type: io.kestra.plugin.core.http.Request
                    allowFailure: true
                    uri: "{{ render(vars.api) }}/containers/{{ fromJson(item.value).name }}/json"
                    method: GET

              - id: result
                type: io.kestra.plugin.core.output.OutputValues
                description: >-
                  Join the plan with the host as it is now. A target counts as hardened only when
                  the policy is the one asked for and the container id, the start time and the
                  running state are all unchanged. Every container the plan kept is checked for
                  collateral damage.
                values:
                  r: >-
                    {{ ({'before': (fromJson(outputs.assess.values.rows)),
                        'after': ((outputs.reverify_each.outputs ?? []) | jq('map(.outputs.after | fromjson)') | first),
                        'want': inputs.desired_policy} | toJson) | jq('
                       .want as $want
                       | (.after | length) as $read
                       | (.after | map({key: .name, value: .}) | from_entries) as $a
                       | [.before[] | . + {now: ($a[.name] // {present: false})}]
                       | [.[] | . + {
                           intact: (.now.present and (.now.id == .id) and (.now.started_at == .started_at) and .now.running),
                           landed: (.now.present and (.now.policy == $want)),
                           unchanged: (.now.present and (.now.policy == .policy))}]
                       | {hardened: [.[] | select(.decision == "HARDEN" and .landed and .intact)
                            | {name: .name, before: .policy, after: .now.policy, id: .id, started_at: .started_at, restarts: .restarts}],
                          survivors: [.[] | select(.decision == "HARDEN" and (.landed | not))
                            | {name: .name, policy: (if .now.present then .now.policy else "absent" end)}],
                          disturbed: [.[] | select(.decision == "HARDEN" and .landed and (.intact | not))
                            | {name: .name, id_before: .id, id_after: (.now.id // "absent"),
                               started_before: .started_at, started_after: (.now.started_at // "absent"),
                               running: (.now.running // false)}],
                          collateral: [.[] | select((.decision != "HARDEN") and (((.unchanged and .intact) | not)))
                            | {name: .name, decision: .decision, policy_before: .policy,
                               policy_after: (if .now.present then .now.policy else "absent" end),
                               id_changed: (.now.id != .id), running: (.now.running // false)}],
                          read: $read}') | first | toJson }}

              - id: verify
                type: io.kestra.plugin.core.flow.If
                description: The run fails when a target is still unprotected, when a hardened container was disturbed or when a container the plan kept changed. Reporting success without reading the host again is what this gate exists to prevent.
                condition: "{{ fromJson(outputs.result.values.r).survivors | length > 0 or fromJson(outputs.result.values.r).disturbed | length > 0 or fromJson(outputs.result.values.r).collateral | length > 0 }}"
                then:
                  - id: hardening_incomplete
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      Restart policy hardening did not land on {{ inputs.docker_host }}. Still without
                      a policy:
                      {{ fromJson(outputs.result.values.r).survivors | jq('if length == 0 then "none" else map("\(.name) policy=\(if .policy == "" then "unset" else .policy end)") | join(", ") end') | first }}.
                      Hardened but disturbed:
                      {{ fromJson(outputs.result.values.r).disturbed | jq('if length == 0 then "none" else map("\(.name) id \(.id_before[0:12]) to \(.id_after[0:12]) started \(.started_before) to \(.started_after)") | join(", ") end') | first }}.
                      Changed outside the plan:
                      {{ fromJson(outputs.result.values.r).collateral | jq('if length == 0 then "none" else map("\(.name) [\(.decision)] \(.policy_before) to \(.policy_after)") | join(", ") end') | first }}.
                else:
                  - id: hardened
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Hardened {{ fromJson(outputs.result.values.r).hardened | length }} containers on {{ inputs.docker_host }} to {{ inputs.desired_policy }}
                      ({{ fromJson(outputs.result.values.r).hardened | jq('if length == 0 then "none" else map("\(.name) \(if .before == "" then "unset" else .before end) to \(.after)") | join(", ") end') | first }}).
                      Every one kept its container id and its start time, so no service was interrupted:
                      {{ fromJson(outputs.result.values.r).hardened | jq('if length == 0 then "none" else map("\(.name) id \(.id[0:12]) up since \(.started_at) restarts \(.restarts)") | join("; ") end') | first }}.
                      {{ fromJson(outputs.result.values.r).read }} labelled containers re-read, none of the ones the plan kept changed.
            else:
              - id: approval_declined
                type: io.kestra.plugin.core.log.Log
                message: "Approval not granted on execution {{ execution.id }}. No restart policy was written on {{ inputs.docker_host }}."
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: >-
              Report only, nothing changed (auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }}).
              Run with auto_remediate true and dry_run false, then approve the pause, to set {{ inputs.desired_policy }} on
              {{ fromJson(outputs.assess.values.targets) | jq('map(.name) | join(", ")') | first }}.
    else:
      - id: nothing_to_harden
        type: io.kestra.plugin.core.log.Log
        message: >-
          Every labelled container on {{ inputs.docker_host }} that this flow watches already has a restart policy.
          {{ fromJson(outputs.assess.values.rows) | length }} read, none unprotected.
          {{ fromJson(outputs.assess.values.rows) | jq('group_by(.decision) | map("\(.[0].decision) \(length)") | join(", ")') | first }}.

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Docker restart policy guard failed on ' ~ inputs.docker_host ~ ' (execution ' ~ execution.id ~ '). Either the daemon is unreachable or a container is still running without a restart policy after the update. Check the execution logs.'} | toJson }}

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and in safe mode. Enabling it only reports until you change these inputs.
    cron: "40 2 * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: Set a Restart Policy on Running Docker Containers Without Restarting Them
  shortDescription: Find running containers whose restart policy is missing, so they stay down after a host reboot, then write the policy in place with docker update behind an approval and prove the container id and start time did not change.
  metaTitle: Harden Docker Container Restart Policies with Kestra
  metaDescription: Find running Docker containers with no restart policy, set it in place behind an approval, then re-read it and prove the service was not interrupted.
  description: |
    A container started with `--restart=no`, which is the default, never comes back. The host reboots or dockerd restarts, then that container stays down. Nothing alerts, because the daemon did exactly what it was told. Someone notices hours later when a queue stops draining or a health check page is missing a tile.

    This blueprint finds those containers while they are still up and fixes them in place. It reads the restart policy of every container carrying a label you apply yourself, keeps anything on a protect-list, caps how many change in one run, then writes the policy you chose with `docker update` behind a dry run and an approval. Every labelled container is inspected again afterwards. The run fails if a target is still unprotected or if the workload was disturbed.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    The write is a configuration rewrite, which is why this flow can act on a running service at all:

    - **`docker update` does not restart anything.** It rewrites `HostConfig.RestartPolicy` on the existing container. The process keeps running and the container keeps its id. The policy takes effect at the next stop. This is the whole reason the flow is safe to run against production containers, where a reaper or a recreate is not.
    - **It is proven, not assumed.** The container id and `State.StartedAt` are captured before the change and read again after it. A target counts as hardened only when the policy is the one asked for and the id, the start time and the running state are all unchanged. A recreated container comes back with a new id, so it cannot read as untouched.
    - **Label scoping.** The Engine API query filters on `label_selector`, so a container without that label is never returned, let alone changed.
    - **A protect-list.** `protected_name_pattern` wins over every other rule. One-shot jobs belong there, since a job meant to run once should stay with no restart policy.
    - **A ceiling.** `max_updates` bounds one run, so a selector that matches more than you expected cannot rewrite a whole host in one execution.
    - **Three gates before any write.** `auto_remediate` true, `dry_run` false, then an approved `Pause`. The shipped defaults and the disabled schedule are read-only.
    - **One target, named by you.** Every read goes to `docker_host` over the Engine API and every write goes to the same endpoint through `DOCKER_HOST`. The flow holds no socket path and no hostname of its own, so the daemon that runs Kestra is never a target.

    ## How it works

    1. `list_running` (`io.kestra.plugin.core.http.Request`, read-only) asks the Docker Engine API for running containers matching `label_selector`. The Docker plugin has no container list task, so the inventory comes from the API. `candidates` keeps the ids and names.
    2. `inspect_each` (`io.kestra.plugin.core.flow.Loop`, read-only) inspects each candidate. `HostConfig.RestartPolicy`, `State.StartedAt` and `RestartCount` are in the inspect payload only, not in the list.
    3. `assess` gives every candidate a verdict. An empty policy name and the literal `no` both mean the daemon will leave the container down:
       - `KEEP_POLICY_SET`: it already has a policy;
       - `KEEP_PROTECTED`: its name matches `protected_name_pattern`;
       - `KEEP_NOT_RUNNING`: the daemon no longer reports it running;
       - `KEEP_OVER_CAP`: eligible, but beyond `max_updates` for this run;
       - `HARDEN`: running, unprotected, no policy, inside the cap.

       `summary` logs the counts, every target and its start time.
    4. `route` stops with a log line when there is nothing to harden. Otherwise `findings_alert` posts the plan to Slack and `remediate_gate` checks `auto_remediate` and `dry_run`.
    5. `hold` (`io.kestra.plugin.core.flow.Pause`) waits for approval. `remediate_update` (`Loop`, `concurrencyLimit: 1`) then runs one `docker update --restart=<policy> <id>` per target through `io.kestra.plugin.scripts.shell.Commands` on the `docker:27-cli` image, pointed at `docker_host` by `DOCKER_HOST`.
    6. `reverify_each` inspects every labelled container again by name. `result` joins the plan with the host. `verify` fails the run in three cases: a target still unprotected, a hardened container that lost its id or its start time, a container the plan kept that changed.
    7. `errors` alerts Slack when the flow fails, including when the verification gate fails.

    ## What you get

    - The reboot problem found while the service is still up, instead of after the next restart.
    - A fix that does not interrupt anything, with the before and after container id and start time in the execution log as the evidence.
    - A run that fails when the policy did not land, so a host that is still exposed cannot read as a clean one.

    ## Who it's for

    - Teams running services on plain Docker hosts or Docker Compose, without an orchestrator that restarts workloads for them.
    - Platform teams who inherited hosts where containers were started by hand and the flags were never audited.
    - Anyone who has had a service stay down after a host reboot because one container was started without `--restart`.

    ## Why orchestrate this with Kestra

    A shell loop can run `docker update` across a host, but it cannot hold the change behind an approval, cannot keep a protect-list, cannot stop at a ceiling and cannot prove it left the running workload alone. That last part is what makes this safe to automate: the run is only green when the policy changed and the container id, the start time and the running state did not. Kestra reads the host, computes the plan, waits for a human, writes one container at a time so a failure is attributable, then reads the host again and fails the execution when the result does not match the plan. The execution history becomes the record of which host was hardened, when it happened and who approved it.

    ## Tested end to end

    On Kestra 2.0.5 OSS against an isolated Docker 27.5.1 daemon (Docker-in-Docker on its own network), with a local HTTP sink standing in for Slack. The daemon held four running containers: `app-ledger` (labelled, `--restart=no`), `app-unlabelled` (no label, `--restart=no`), `app-already` (labelled, already `unless-stopped`), `migrate-once` (labelled, `--restart=no`, matching the protect-list).

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 3 labelled containers read, 1 target (`app-ledger`). `app-already` kept as `KEEP_POLICY_SET`, `migrate-once` kept by the protect-list, `app-unlabelled` never returned by the query |
    | 2 | `auto_remediate: true` | Same plan, nothing changed. The dry run blocks the write even with auto_remediate on |
    | 3 | run 2 plus `dry_run: false`, pause approved | `app-ledger` went from `no` to `unless-stopped`. Same container id, same `State.StartedAt`, still running, `RestartCount` still 0. The other three untouched, confirmed with `docker inspect` on the daemon itself |
    | 4 | same, pause resumed with `approved: false` | Nothing changed |
    | 5 | rerun of run 3 on the now clean host | 0 targets, the `nothing_to_harden` branch |
    | 6 | same as run 3, but the target was recreated during the pause | The policy read back correct while the container id had changed, so `verify` failed the run and `errors` posted to Slack |
    | 7 | `max_updates: 1` with two eligible containers | 1 target, the other reported as `KEEP_OVER_CAP` |
    | 8 | unreachable daemon | `errors` alert sent |

    Proof the whole thing is worth doing: the daemon was restarted after run 3. `app-ledger` came back by itself, `app-unlabelled` stayed down.

    ## Prerequisites

    - A Docker daemon reachable over TCP from the Kestra worker. The container list comes from the Engine API, which the worker cannot read through a mounted unix socket.
    - A label on the containers you want managed. Add `--label kestra.restart-policy=managed` to your `docker run` or to the service in your Compose file, then point `label_selector` at it.
    - The one-off `docker:27-cli` container must be able to reach `docker_host`. Leave `docker_cli_network` as `bridge` for a daemon that resolves by DNS. Point it at the user-defined network when the daemon is itself a container.
    - Local testing: `docker run -d --privileged --name dind -e DOCKER_TLS_CERTDIR= docker:27-dind --host=tcp://0.0.0.0:2375`, start a few labelled containers inside it, then set `docker_host` to `tcp://dind:2375`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: used by `findings_alert` and the `errors` block. In Kestra OSS, provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `docker_host` | `tcp://docker-host:2375` | Daemon to harden |
    | `docker_cli_network` | `bridge` | Network the docker CLI container joins |
    | `label_selector` | `kestra.restart-policy=managed` | The only containers read |
    | `desired_policy` | `unless-stopped` | Policy to write |
    | `protected_name_pattern` | `^(batch\|job\|migrate\|oneshot\|init)([-_.].*)?$` | Names left alone |
    | `max_updates` | `25` | Ceiling for one run |
    | `auto_remediate` | `false` | Must be true to write anything |
    | `dry_run` | `true` | Must be false to write anything |

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Label the containers you want managed, for example `docker run --label kestra.restart-policy=managed ...`.
    3. Import the flow, set `docker_host` and `label_selector`, run it with the defaults and read the plan.
    4. Run it with `auto_remediate: true` and `dry_run: false`, read the plan in the paused execution, then resume it with `approved: true`.
    5. Enable the `nightly` trigger once the plans look right. Change its inputs when you want it to act.

    ## How to extend

    - Normalise a policy you disagree with, not only a missing one, by comparing the current policy with `desired_policy` instead of treating any policy as acceptable.
    - Add `on-failure:N` to `desired_policy` for workloads that should retry a crash a fixed number of times, then split the retry count off the value before it reaches the CLI.
    - Loop over a list of hosts to harden a whole fleet in one execution.
    - Run it from a host boot event rather than a schedule, so the audit happens right after the reboot that would have exposed the gap.
    - Record the hardened ids in a KV store to show how often containers are started without a policy, which is a signal about the deploy path rather than the host.

