id: appwrite-backend-health-gate
namespace: company.team

description: |
  Probe an Appwrite backend's own health endpoints on a schedule , 
  database connectivity, in-memory cache connectivity, and clock drift
  against a trusted remote time source, classify the backend as
  HEALTHY, DEGRADED, or UNREACHABLE, log clean checks, and alert Slack
  the moment a subsystem fails or the server clock drifts too far.

inputs:
  - id: appwrite_url
    type: STRING
    defaults: "http://localhost/v1"
    displayName: "Appwrite API Base URL"
    description: "Base URL of the Appwrite API, including the /v1 suffix, no trailing slash."
  - id: project_id
    type: STRING
    displayName: "Appwrite Project ID"
    description: "ID of the Appwrite project to check, found in the project settings."
  - id: clock_drift_threshold_ms
    type: INT
    defaults: 5000
    displayName: "Clock Drift Threshold (ms)"
    description: "Absolute difference between the Appwrite server clock and a trusted remote time source, in milliseconds, above which the backend is classified DEGRADED."

triggers:
  - id: backend_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Check Appwrite's database, cache, and clock health every 10 minutes."
    cron: "*/10 * * * *"
    disabled: true
    inputs:
      appwrite_url: "http://localhost/v1"
      clock_drift_threshold_ms: 5000
      project_id: replace-with-your-project-id

tasks:
  - id: check_database_health
    type: io.kestra.plugin.core.http.Request
    description: "Check that Appwrite's database server is up and the connection from the API is successful."
    uri: "{{ inputs.appwrite_url }}/health/db"
    method: GET
    headers:
      X-Appwrite-Project: "{{ inputs.project_id }}"
      X-Appwrite-Key: "{{ secret('APPWRITE_API_KEY') }}"
    allowFailure: true

  - id: check_cache_health
    type: io.kestra.plugin.core.http.Request
    description: "Check that Appwrite's in-memory cache server is up and the connection from the API is successful."
    uri: "{{ inputs.appwrite_url }}/health/cache"
    method: GET
    headers:
      X-Appwrite-Project: "{{ inputs.project_id }}"
      X-Appwrite-Key: "{{ secret('APPWRITE_API_KEY') }}"
    allowFailure: true

  - id: check_clock_drift
    type: io.kestra.plugin.core.http.Request
    description: "Check that the Appwrite server's clock is synced with a trusted remote NTP time source."
    uri: "{{ inputs.appwrite_url }}/health/time"
    method: GET
    headers:
      X-Appwrite-Project: "{{ inputs.project_id }}"
      X-Appwrite-Key: "{{ secret('APPWRITE_API_KEY') }}"
    allowFailure: true

  - id: classify_backend_health
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when any health check could not be fetched, DEGRADED when the database check, the cache check, or the clock drift crosses clock_drift_threshold_ms, otherwise HEALTHY."
    format: "{{ (outputs.check_database_health.body is defined and outputs.check_cache_health.body is defined and outputs.check_clock_drift.body is defined) ? (((outputs.check_database_health.body | jq('.status') | first) != 'pass' or (outputs.check_cache_health.body | jq('.status') | first) != 'pass' or ((outputs.check_clock_drift.body | jq('.diff | fabs') | first | default(0)) > inputs.clock_drift_threshold_ms)) ? 'DEGRADED' : 'HEALTHY') : 'UNREACHABLE' }}"

  - id: route_by_backend_health
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation when every subsystem is healthy, page Slack when the database, cache, or clock has degraded, or page Slack when the health checks could not be fetched at all."
    value: "{{ outputs.classify_backend_health.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Appwrite project {{ inputs.project_id }} is healthy: database and cache both pass, clock drift within {{ inputs.clock_drift_threshold_ms }}ms."
      "DEGRADED":
        - id: alert_degraded
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Appwrite sentinel DEGRADED for project {{ inputs.project_id }}: database status={{ outputs.check_database_health.body | jq('.status') | first }}, cache status={{ outputs.check_cache_health.body | jq('.status') | first }}, clock drift={{ outputs.check_clock_drift.body | jq('.diff') | first }}ms (threshold {{ inputs.clock_drift_threshold_ms }}ms). Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Appwrite sentinel UNREACHABLE for project {{ inputs.project_id }}: one or more health endpoints did not respond (invalid API key, wrong project ID, or the Appwrite instance is down). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed Appwrite backend health check with status: {{ outputs.classify_backend_health.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-check status line recorded on every run regardless of branch, for a continuous backend-health trend in the execution history."
    message: "Appwrite audit: project={{ inputs.project_id }}, threshold={{ inputs.clock_drift_threshold_ms }}ms, status={{ outputs.classify_backend_health.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the health gate flow itself fails, so a broken check never silently stops monitoring the Appwrite backend."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Appwrite backend health gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). Backend health for project {{ inputs.project_id }} is now unknown; check the task logs and the Appwrite console manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_backend_health.value }}"

extend:
  title: "Appwrite Backend Health Gate"
  metaTitle: Appwrite Backend Health Gate for Kestra
  shortDescription: Probe Appwrite's own database, cache, and clock health endpoints on a schedule, and alert Slack before a degraded subsystem turns into an outage.
  metaDescription: Check Appwrite database, cache, and clock health and alert Slack when a subsystem degrades.
  description: |
    Appwrite ships its own `/health` endpoints specifically so operators can validate every internal subsystem without guessing from application-level errors. This blueprint calls three of them on a schedule, classifies the backend as healthy or degraded, and pages Slack the moment the database connection fails, the cache connection fails, or the server clock drifts too far from a trusted time source.

    ## How it works

    1. `check_database_health` (`io.kestra.plugin.core.http.Request`) calls `GET /health/db` with the project's API key, returning `{name, ping, status}` where `status` is `pass` or `fail`.
    2. `check_cache_health` calls `GET /health/cache` the same way, checking the in-memory cache connection.
    3. `check_clock_drift` calls `GET /health/time`, returning `{remoteTime, localTime, diff}` where `diff` is the millisecond difference between the Appwrite server's clock and a trusted remote time source. All three tasks use `allowFailure: true` so a single unreachable endpoint does not abort the flow before classification.
    4. `classify_backend_health` (`io.kestra.plugin.core.debug.Return`) checks whether all three response bodies are defined; if not, `UNREACHABLE`. Otherwise it reads each `status` field and the absolute value of `diff` with `jq`, returning `DEGRADED` if the database check failed, the cache check failed, or the clock drift exceeds `clock_drift_threshold_ms`, otherwise `HEALTHY`.
    5. `route_by_backend_health` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `HEALTHY` logs a quiet confirmation, `DEGRADED` pages Slack with the exact failing subsystem(s) and drift value, `UNREACHABLE` pages Slack separately, and `defaults` logs the raw outcome.
    6. `log_audit_status` records a status line on every run regardless of branch, so the execution history is a continuous backend-health trend.
    7. The `errors` block pages Slack separately if the flow itself fails outright.
    8. The `backend_health_schedule` trigger polls every 10 minutes with explicit input overrides, shipped `disabled: true` until you point it at a real Appwrite project.

    ## What you get

    - A scheduled, multi-subsystem backend health check with zero custom Appwrite SDK code.
    - A three-way `status` output (`HEALTHY` / `DEGRADED` / `UNREACHABLE`) you can chart or gate other flows on.
    - A Slack page naming the exact subsystem (database, cache, or clock) behind a degradation, not just a generic warning.
    - A separate failure channel for the gate flow itself, plus a standing audit log line per run.

    ## Who it's for

    - Platform teams running self-hosted Appwrite who want proactive alerting before a degraded database or cache connection turns into a user-facing outage.
    - Teams relying on Appwrite's time-sensitive features (JWT expiry, rate limiting, scheduled functions) who need to know when server clock drift could silently break them.

    ## Why orchestrate this with Kestra

    Hitting `/health/db` from an uptime monitor tells you pass or fail with no history. This flow keeps every probe, every classification, and every alert in the execution history, turns the check into a typed output other flows can depend on, and gives you a Switch branch to grow into real remediation (restarting a specific worker container, opening a ticket per failing subsystem) without rewriting the check itself.

    ## Prerequisites

    - A self-hosted Appwrite instance reachable at `appwrite_url`. The free, official Docker Compose setup (`docker run -it --rm appwrite/appwrite:latest`, which generates the full `docker-compose.yml`) is enough to fully test this blueprint locally.
    - An Appwrite project and a server-side API key with access to the Health scope.
    - A Slack incoming webhook for the degraded and unreachable alerts.

    ### Secrets

    - `APPWRITE_API_KEY`: Appwrite server API key with the Health scope, sent as the `X-Appwrite-Key` header.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the degraded alert, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_APPWRITE_API_KEY` and `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-value>" | base64`.

    ## Quick start

    1. Add the `APPWRITE_API_KEY` and `SLACK_WEBHOOK_URL` secrets.
    2. Set `appwrite_url` and `project_id` to your Appwrite instance and project.
    3. Run the flow once and confirm `status` reads `HEALTHY`.
    4. Enable `backend_health_schedule`.

    ## How to extend

    - Add `GET /health/storage` and `GET /health/pubsub` as two more probe tasks for a full subsystem sweep instead of just database, cache, and clock.
    - Call `GET /health/queue/webhooks` and `GET /health/queue/certificates` to also catch a backlogged internal queue before it delays webhooks or certificate renewal.
    - Store each run's `diff` value in a KV store to build a longer clock-drift trend than the execution history alone provides.

    ## Links

    - [Appwrite Health API reference](https://appwrite.io/docs/references/1.2.x/server-rest/health)
    - [Appwrite self-hosting](https://appwrite.io/docs/advanced/self-hosting)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  verified: false
  demo: false
