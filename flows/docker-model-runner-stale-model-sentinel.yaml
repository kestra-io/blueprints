id: docker-model-runner-stale-model-sentinel
namespace: company.team
description: |
  List locally cached models on a Docker Model Runner (DMR) instance, flag
  any model whose created timestamp is older than a configured age,
  alert Slack on breach, and conditionally delete the stale models with
  Delete. auto_remediate and dry_run are two independent gates; a model
  younger than the threshold is never touched.

inputs:
  - id: dmr_host
    type: STRING
    displayName: "Docker Model Runner Host"
    defaults: "http://localhost:12434"
    description: Base URL of the Docker Model Runner REST API, matching the host property documented on every task in this plugin (default verified from the plugin's own source).
  - id: max_model_age_days
    type: INT
    displayName: "Max Model Age (days)"
    defaults: 30
    description: Breach when a model's created timestamp is older than this many days.
  - id: max_stale_models
    type: INT
    displayName: "Max Allowed Stale Models"
    defaults: 0
    description: Breach when the count of models older than max_model_age_days exceeds this number. Default 0 means any stale model at all is a breach.
  - id: auto_remediate
    type: SELECT
    displayName: "Auto Remediate"
    defaults: "false"
    values:
      - "false"
      - "true"
    description: If "true" and stale models are found, delete each one with Delete (still gated by dry_run below). If "false", the risk is only reported.
  - id: dry_run
    type: SELECT
    displayName: "Dry Run"
    defaults: "true"
    values:
      - "true"
      - "false"
    description: If "true", remediation is only logged, no model is deleted. Must be explicitly "false", together with auto_remediate "true", for a stale model to actually be removed.

triggers:
  - id: periodic_model_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every 24 hours. Shipped disabled; enable it once dmr_host points at a real Docker Model Runner instance and a manual run has been verified. Always fires in safe mode (auto_remediate false, dry_run true) regardless of this flow's own defaults.
    cron: "0 3 * * *"
    disabled: true
    inputs:
      max_model_age_days: 30
      max_stale_models: 0
      auto_remediate: "false"
      dry_run: "true"

tasks:
  - id: list_local_models
    type: io.kestra.plugin.docker.model.List
    description: "Fetches every model cached on the DMR instance. Each returned ModelInfo carries id (content digest), tags (human-readable references like docker.io/ai/nomic-embed-text-v1.5:latest), created (Unix epoch seconds), and config.{format,quantization,parameters,architecture,size} - verified directly from this plugin's own Java source (List.java), not just its doc page."
    host: "{{ inputs.dmr_host }}"

  - id: evaluate_model_age
    type: io.kestra.plugin.scripts.python.Script
    description: Reads the listing and flags any model whose created epoch is older than max_model_age_days. There is no structured policy-evaluation task in this plugin, so the age comparison runs here against the created field the List task actually returns.
    inputFiles:
      models.json: "{{ outputs.list_local_models | json }}"
    script: |
      import json
      import time
      from kestra import Kestra

      with open("models.json") as f:
          raw = json.load(f)

      models = raw.get("models", []) if isinstance(raw, dict) else raw
      cutoff = time.time() - ({{ inputs.max_model_age_days }} * 86400)

      stale_models = []
      for model in models:
          created = model.get("created")
          if created is not None and created < cutoff:
              tags = model.get("tags") or []
              stale_models.append({
                  "id": model.get("id"),
                  "tag": tags[0] if tags else model.get("id"),
                  "created": created,
                  "size": (model.get("config") or {}).get("size"),
              })

      Kestra.outputs({
          "stale_count": len(stale_models),
          "stale_models": stale_models,
      })

  - id: evaluate_model_gate
    type: io.kestra.plugin.core.flow.If
    description: Breach when the stale model count exceeds max_stale_models.
    condition: "{{ outputs.evaluate_model_age.vars.stale_count > inputs.max_stale_models }}"
    then:
      - id: route_remediation
        type: io.kestra.plugin.core.flow.Switch
        description: auto_remediate only decides whether remediation is considered at all; dry_run, checked separately below, decides whether models are actually deleted.
        value: "{{ inputs.auto_remediate }}"
        cases:
          "true":
            - id: check_dry_run
              type: io.kestra.plugin.core.flow.If
              condition: "{{ inputs.dry_run == \"false\" }}"
              then:
                - id: delete_stale_models
                  type: io.kestra.plugin.core.flow.Loop
                  description: Delete each flagged model one at a time, so one failed delete never blocks the rest of the batch.
                  values: "{{ outputs.evaluate_model_age.vars.stale_models }}"
                  concurrencyLimit: 2
                  tasks:
                    - id: delete_stale_model
                      type: io.kestra.plugin.docker.model.Delete
                      description: "Removes the flagged model by its tag (namespace/name reference). This task has no filter or dry-run mode of its own - the double gate above is what makes this safe, matching the plugin's documented model-identifier parsing (ai/smollm2, hf.co/org/repo, or a bare name defaulting to namespace ai)."
                      host: "{{ inputs.dmr_host }}"
                      model: "{{ item.value | jq('.tag') | first }}"
                - id: log_remediation_applied
                  type: io.kestra.plugin.core.log.Log
                  message: "Deleted {{ outputs.evaluate_model_age.vars.stale_count }} stale model(s) from {{ inputs.dmr_host }}."
              else:
                - id: log_dry_run_remediation
                  type: io.kestra.plugin.core.log.Log
                  message: "DRY RUN: would delete {{ outputs.evaluate_model_age.vars.stale_count }} stale model(s) from {{ inputs.dmr_host }} (dry_run is true). No change made."
          "false":
            - id: log_remediation_disabled
              type: io.kestra.plugin.core.log.Log
              message: "auto_remediate is false: {{ outputs.evaluate_model_age.vars.stale_count }} model(s) on {{ inputs.dmr_host }} are older than {{ inputs.max_model_age_days }} days, but no deletion was attempted."
      - id: alert_stale_models_risk
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Always alert on any breach, independent of whether it was remediated.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Docker Model Runner stale model sentinel: {{ outputs.evaluate_model_age.vars.stale_count }} model(s) on {{ inputs.dmr_host }} are older than {{ inputs.max_model_age_days }} days (threshold {{ inputs.max_stale_models }}). auto_remediate: {{ inputs.auto_remediate }}. dry_run: {{ inputs.dry_run }}. Remediated: {{ inputs.auto_remediate == \"true\" and inputs.dry_run == \"false\" }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_models_healthy
        type: io.kestra.plugin.core.log.Log
        message: "{{ inputs.dmr_host }} is compliant: 0 models older than {{ inputs.max_model_age_days }} days."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status line for every run, independent of which branch fired, so the execution history always shows the headline numbers.
    message: "Model age audit complete for {{ inputs.dmr_host }}. stale_count={{ outputs.evaluate_model_age.vars.stale_count }}. threshold={{ inputs.max_stale_models }}. auto_remediate={{ inputs.auto_remediate }}. dry_run={{ inputs.dry_run }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the flow itself fails outside the handled branches, for example an unreachable Docker Model Runner instance.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Docker Model Runner stale model sentinel FAILED in execution {{ execution.id }} for {{ inputs.dmr_host }}. The model audit did not complete; investigate before trusting the last known compliance status."
      }

extend:
  title: "Docker Model Runner Stale Model Sentinel"
  shortDescription: Audit a Docker Model Runner instance for locally cached models older than a configured age, alert Slack on breach, and optionally delete the stale ones.
  metaTitle: Docker Model Runner Stale Model Sentinel with Kestra
  metaDescription: "Audit Docker Model Runner for stale local AI models, alert Slack on breach, and optionally delete them to reclaim disk space."
  description: |
    Docker Model Runner lets a developer or CI machine pull local AI models the same way
    it pulls container images - and those models behave the same way stale images do:
    nobody deletes them, and they are multi-gigabyte files, not a few megabytes. A machine
    that has pulled a dozen embedding and language models over a few months of
    experimentation can be carrying tens of gigabytes nobody is using anymore. This
    blueprint lists every model cached on a DMR instance, flags any older than a configured
    age, alerts Slack on breach, and can delete the stale ones to reclaim disk space.

    ## How it works

    1. `periodic_model_check` (`io.kestra.plugin.core.trigger.Schedule`) runs daily, always forcing `auto_remediate: "false"` and `dry_run: "true"` through its own `inputs:` override regardless of this flow's defaults. Shipped disabled so you can validate a manual run first.
    2. `list_local_models` (`io.kestra.plugin.docker.model.List`) fetches every cached model, each carrying `id`, `tags`, `created` (Unix epoch seconds), and `config.{format,quantization,parameters,architecture,size}` - verified directly from this plugin's own Java source, not just its doc page.
    3. `evaluate_model_age` (`io.kestra.plugin.scripts.python.Script`) compares each model's `created` timestamp against `max_model_age_days`, collecting the stale ones into `stale_models` with their tag, creation time, and on-disk size.
    4. `evaluate_model_gate` (`io.kestra.plugin.core.flow.If`) flags a breach whenever `stale_count > max_stale_models`.
       - `then` (breach): `route_remediation` (`io.kestra.plugin.core.flow.Switch` on `auto_remediate`) either considers remediation (`"true"`, gated again by `dry_run` through `check_dry_run`) or only logs that remediation is disabled (`"false"`). When both gates allow it, `delete_stale_models` (`io.kestra.plugin.core.flow.Loop`) runs `delete_stale_model` (`io.kestra.plugin.docker.model.Delete`) for each flagged model. `alert_stale_models_risk` always fires to Slack regardless of which path ran.
       - `else` (compliant): `log_models_healthy` records a clean check.
    5. `log_audit_complete` always runs last, printing the headline numbers regardless of which branch fired.
    6. The `errors` block alerts Slack separately if the flow itself fails - an unreachable DMR instance must not read as "no breach".

    ## What you get

    - A concrete, named list of stale local models with their size and age, computed from Docker Model Runner's own metadata, not a guess from disk usage alone.
    - Remediation that only ever deletes the specific models flagged as stale; any model younger than the threshold is never touched.
    - Two independent gates (`auto_remediate`, `dry_run`) between "stale model found" and "model actually deleted".
    - A final status log every run, breach or not, so the execution history doubles as a local-model hygiene trend for the host.

    ## Who it's for

    - Platform and MLOps teams managing developer workstations or CI runners that pull local models through Docker Model Runner, who need a routine disk-reclaim pass instead of someone noticing "docker is full" manually.
    - Teams evaluating multiple embedding or small language models locally who accumulate pulled-but-abandoned models across experiments.
    - Anyone evaluating this plugin who wants a worked example of `List` and `Delete` used together as a governance pair, mirroring this repo's existing `docker-host-image-retention-reclaim.yaml` pattern for container images.

    ## Why orchestrate this with Kestra

    Docker Model Runner itself has no retention policy, no age-based cleanup, and no notification path - a model sits on disk until someone runs `docker model rm` by hand. Kestra supplies the schedule, the age-based risk classification as a first-class branch, two independent authorization gates before anything is deleted, and an execution history that shows exactly which models were reclaimed and when.

    ## Prerequisites

    - Docker Desktop or Docker Engine with Model Runner enabled, reachable from the Kestra Worker at `dmr_host`.
    - A Slack incoming webhook for alerts.

    Local testing:
    Docker Model Runner ships as part of Docker Desktop/Engine itself (version 4.40+), not as a separate container - enable it via `docker desktop enable model-runner` or the Docker Desktop settings, then pull at least one test model with `docker model pull ai/smollm2` so there is something to audit.
    `docker network connect YOUR_KESTRA_NETWORK <container>` does not apply here since DMR is not itself a container with a name to connect to; if the Kestra Worker runs inside a container, ensure it can reach the host's DMR port (`12434` by default) via `host.docker.internal:12434` or equivalent, rather than `localhost`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_stale_models_risk` and the `errors` block.
    - This blueprint's `dmr_host` carries no credentials, matching Docker Model Runner's own unauthenticated local-only REST API.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_SLACK_WEBHOOK_URL=$(echo -n 'https://hooks.slack.com/...' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `dmr_host` (STRING, default `http://localhost:12434`): Docker Model Runner REST API base URL.
    - `max_model_age_days` (INT, default `30`): age threshold for the stale-model check.
    - `max_stale_models` (INT, default `0`): breach threshold; `0` means any stale model at all breaches.
    - `auto_remediate` (SELECT: `"false"`, `"true"`; default `"false"`): must be `"true"` for deletion to even be considered.
    - `dry_run` (SELECT: `"true"`, `"false"`; default `"true"`): must be explicitly `"false"`, together with `auto_remediate: "true"`, for a stale model to actually be deleted.

    ### Outputs

    - `outputs.list_local_models.models`: the raw model listing (`id`, `tags`, `created`, `config`) for every run.
    - `outputs.evaluate_model_age.vars.stale_count` / `.stale_models`: the computed policy result for every run.

    ## Quick start

    1. Enable Docker Model Runner and pull a test model (`docker model pull ai/smollm2`); if you need a guaranteed-stale entry immediately, lower `max_model_age_days` to `0` for the first test run instead of waiting for a real model to age.
    2. Add the `SLACK_WEBHOOK_URL` secret.
    3. Run the flow manually with the defaults (`auto_remediate: "false"`) and confirm `alert_stale_models_risk` fires naming the expected model, and that `log_remediation_disabled` logs without deleting anything.
    4. Run once with `auto_remediate: "true"` and `dry_run: "true"` and confirm `log_dry_run_remediation` describes the deletion without running it.
    5. Run once with `auto_remediate: "true"` and `dry_run: "false"` and confirm with `docker model ls` that the flagged model is gone.
    6. Enable `periodic_model_check` once you trust the check; it always runs in the safe `auto_remediate: "false"` / `dry_run: "true"` mode regardless of what you leave the flow's own defaults set to.

    ## How to extend

    - Extend `evaluate_model_age` to also flag models above a total disk-size budget across the whole host, by summing `config.size` after parsing its human-readable units (e.g. `260.86MiB`).
    - Loop over several `dmr_host` values with `io.kestra.plugin.core.flow.Loop` (`ForEach` is deprecated) to sweep a fleet of CI runners or developer machines, each reporting to the same Slack channel.
    - Add an allowlist input of tags that should never be deleted regardless of age (a model pinned for a specific demo or benchmark), and exclude them in `evaluate_model_age`.
    - Route the remediation branch through a `Pause` approval task instead of (or alongside) the static `auto_remediate` input, for a human-reviewed deletion on a shared CI runner.

    ## Pitfalls

    - **This plugin's exact schema is not fully documented on its own doc pages** - the property names used here (`host`, `models`, `id`, `tags`, `created`, `config.{format,quantization,parameters,architecture,size}`, and `Delete`'s `model` property) were verified directly against the plugin's Java source (`List.java`, `Delete.java`, `AbstractModel.java` in `kestra-io/plugin-docker`), not from a doc page, since the doc pages only described these fields in prose.
    - **`config.size` is a human-readable string (e.g. `260.86MiB`), not a byte count.** Verified from the plugin's own source; summing or comparing sizes numerically requires parsing this string first, which this blueprint's age-only check does not need to do.
    - **`Delete`'s `model` property expects a reference like `ai/smollm2` or `hf.co/org/repo`, not the raw `id` content digest.** This blueprint passes the first entry of each flagged model's `tags` array rather than its `id`, matching the plugin's own documented identifier format; a model with no tags at all would need its `id` instead, which this blueprint does not currently fall back to.
    - **There is no dry-run mode on `Delete` itself.** The double gate (`auto_remediate`, `dry_run`) in this flow is what makes deletion safe to test; `Delete` itself deletes immediately and permanently once called.
    - **`auto_remediate` and `dry_run` are independent gates, not a single boolean.** Both must be `"true"`/`"false"` respectively for the delete `Loop` to run; setting only one leaves the other still blocking.
    - **`Switch` case keys `"true"`/`"false"` are quoted strings.** `auto_remediate` renders as the literal string `"true"` or `"false"`; unquoted `true:`/`false:` YAML map keys would parse as booleans instead and would not match.

    ## Links

    - [plugin-docker documentation](https://kestra.io/plugins/plugin-docker)
    - [plugin-docker source (model package)](https://github.com/kestra-io/plugin-docker/tree/main/src/main/java/io/kestra/plugin/docker/model)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
    - AI
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
