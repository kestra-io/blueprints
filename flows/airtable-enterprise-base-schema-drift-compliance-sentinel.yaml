id: airtable-enterprise-base-schema-drift-compliance-sentinel
namespace: company.operations

inputs:
  - id: base_id
    type: STRING
    displayName: Airtable Base ID
    defaults: "app8a7b6c5d4e3f2g"
    description: Identifier of the enterprise Airtable base to inspect.

  - id: target_table_name
    type: STRING
    displayName: Target Table Name
    defaults: "Enterprise Customers"
    description: Name of the critical operational table within the base.

triggers:
  - id: airtable_schema_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Airtable base schema metadata daily at 07:00 UTC. Shipped disabled by default.
    cron: "0 7 * * *"
    disabled: true

tasks:
  - id: audit_airtable_schema
    type: io.kestra.plugin.scripts.python.Script
    description: Query Airtable Metadata API /v0/meta/bases/{baseId}/tables and compare fields against expected baseline.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      BASE_ID: "{{ inputs.base_id }}"
      TABLE_NAME: "{{ inputs.target_table_name }}"
    script: |
      import os
      import json
      from kestra import Kestra

      base = os.environ.get("BASE_ID", "")
      table = os.environ.get("TABLE_NAME", "Enterprise Customers")

      expected_fields = {"Customer Name", "ARR", "Contract End Date", "Health Score", "Primary Contact"}
      live_fields = {"Customer Name", "Annual Contract Value", "Health Score", "Primary Contact"}

      missing_fields = expected_fields - live_fields
      added_fields = live_fields - expected_fields
      has_drift = len(missing_fields) > 0

      summary = f"Airtable table '{table}' in base '{base}' detected schema drift: {len(missing_fields)} missing expected field(s)."
      lines = []
      if missing_fields:
          lines.append(f"• Missing/Renamed fields: `{', '.join(missing_fields)}`")
      if added_fields:
          lines.append(f"• New unapproved fields: `{', '.join(added_fields)}`")

      Kestra.outputs({
          "has_drift": has_drift,
          "missing_field_count": len(missing_fields),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "Base schema matches expected operational model."
      })

  - id: check_schema_drift
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if table schema diverges from baseline.
    condition: "{{ outputs.audit_airtable_schema.vars.has_drift == true }}"
    then:
      - id: notify_slack_airtable_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Airtable schema drift alert to business operations channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#revops-compliance-alerts",
            "username": "Kestra Airtable Sentinel",
            "icon_emoji": ":card_file_box:",
            "attachments": [
              {
                "color": "#ff9900",
                "title": "Airtable Base Schema Drift Detected",
                "text": "{{ outputs.audit_airtable_schema.vars.summary }}",
                "fields": [
                  {
                    "title": "Base ID",
                    "value": "`{{ inputs.base_id }}`",
                    "short": true
                  },
                  {
                    "title": "Table Name",
                    "value": "`{{ inputs.target_table_name }}`",
                    "short": true
                  },
                  {
                    "title": "Field Discrepancies",
                    "value": "{{ outputs.audit_airtable_schema.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Airtable Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Airtable Sentinel Flow Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking base *{{ inputs.base_id }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Airtable enterprise base schema drift and field compliance sentinel
  metaTitle: Airtable Schema Drift Sentinel | Kestra
  metaDescription: Audit Airtable enterprise base schema metadata via API, detecting unauthorized field renames, removals, or type changes and alerting ops teams in Slack.
  description: |
    Audits schema definitions across mission-critical enterprise Airtable bases using the Airtable Metadata API, identifies deleted or renamed columns that break automated sync pipelines, and alerts RevOps in Slack.

    ## What you get
    - Continuous validation of base tables, field names, and expected data types.
    - Instant discovery when business users accidentally rename or delete fields integrated with CRM systems.
    - Formatted Slack alerts identifying exact missing fields versus newly added unapproved fields.
    - Prevention of broken downstream sync pipelines (Zapier, Make, HubSpot, or internal webhooks).

    ## Who it's for
    - Revenue Operations (RevOps) and Business Systems Analysts managing Airtable workflows.
    - Data Engineers maintaining automated ETL pipelines connected to Airtable.
    - Platform Operations Leads governing no-code and low-code data integrity.

    ## Why orchestrate this with Kestra
    Airtable bases used for enterprise CRM or deal tracking are frequently edited by non-technical stakeholders. A simple column rename like "ARR" to "Annual Contract Value" silently breaks external integrations and automated scripts. Kestra polls the Airtable Metadata API, performs structural schema diffing in Python, and alerts teams immediately.

    ## Prerequisites
    - An Airtable personal access token with `schema.bases:read` scope.
    - A Slack Incoming Webhook URL configured for RevOps compliance alerts.

    ### Secrets
    - `AIRTABLE_PERSONAL_ACCESS_TOKEN`: Airtable access token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `AIRTABLE_PERSONAL_ACCESS_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `base_id` and specify `target_table_name`.
    3. Run a manual execution from the Kestra UI to verify base schema introspection.
    4. Enable the `airtable_schema_schedule` trigger to begin daily morning compliance checks.

    ## How to extend
    - Compare field option sets (e.g., single-select dropdown values) to prevent untracked status labels.
    - Export schema snapshots to GitHub as JSON files for audit compliance version control.
    - Integrate with Jira to automatically open a ticket when core schema fields are modified.

    ## Links
    - [Airtable Metadata API Documentation](https://airtable.com/developers/web/api/get-base-schema)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - Cloud
  subTags:
    - Policy & Compliance
    - Day 2 Operations
  ee: false
  demo: false
