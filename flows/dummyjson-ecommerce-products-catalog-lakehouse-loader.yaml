id: dummyjson-ecommerce-products-lakehouse-loader
namespace: company.analytics
description: Ingests retail product inventories, customer ratings, pricing tiers, and brand classifications from DummyJSON API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: dummyjson-ecommerce-products-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://dummyjson.com/products?limit=50"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "products"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for item in items:
            pid = str(item.get('id', 'UNKNOWN'))
            current_ids.append(pid)
            title = item.get('title', 'Unknown')
            cat = item.get('category', 'general')
            try:
                price = float(item.get('price', 0.0))
            except Exception:
                price = 0.0
            try:
                rating = float(item.get('rating', 0.0))
            except Exception:
                rating = 0.0
            try:
                stock = int(item.get('stock', 0))
            except Exception:
                stock = 0
            brand = item.get('brand', 'Generic')

            records.append({
                'product_id': pid,
                'title': str(title),
                'category': str(cat),
                'price': price,
                'rating': rating,
                'stock': stock,
                'brand': str(brand),
                'is_new': bool(pid not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE retail_products (
                product_id VARCHAR,
                title VARCHAR,
                category VARCHAR,
                price DOUBLE,
                rating DOUBLE,
                stock INTEGER,
                brand VARCHAR,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO retail_products SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY retail_products TO 'retail_products.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    category,
                    COUNT(*) AS product_count,
                    AVG(price) AS avg_price,
                    AVG(rating) AS avg_rating
                FROM retail_products
                GROUP BY 1
                ORDER BY product_count DESC
            ) TO 'products_by_category.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM retail_products WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM retail_products").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - retail_products.parquet
      - products_by_category.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['retail_products.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "DummyJSON E-Commerce Catalog sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
