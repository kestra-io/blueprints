id: spinkube-spin-app-wasm-dispatch-and-cold-start-sentinel
namespace: company.sre

description: |
  Audits SpinKube WebAssembly operator telemetry to detect SpinApp component dispatch failures, cold-start latency spikes, and execution errors.

concurrency:
  limit: 1

inputs:
  - id: spinkube_metrics_url
    type: STRING
    displayName: "SpinKube Metrics URL"
    defaults: "http://spin-operator.spinkube-system.svc.cluster.local:8080"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the SpinKube WebAssembly operator controller."

  - id: app_name
    type: STRING
    displayName: "SpinApp Name"
    defaults: "order-processor-wasm"
    description: "Identifier of the target SpinApp WebAssembly custom resource under active runtime surveillance."

  - id: max_cold_start_latency_ms
    type: INT
    displayName: "Max Cold Start Latency (ms)"
    defaults: 120
    description: "Maximum allowable WebAssembly component initialization and cold-start latency in milliseconds."

  - id: max_execution_errors_threshold
    type: INT
    displayName: "Max Execution Errors Threshold"
    defaults: 2
    description: "Maximum allowable Wasm module execution faults, panics, or unhandled runtime traps before alerting."

  - id: alert_on_reconcile_error
    type: BOOL
    displayName: "Alert on Reconcile Error"
    defaults: true
    description: "Toggle whether SpinApp controller reconciliation failure triggers an immediate high-urgency incident notification."

tasks:
  - id: scan_spinkube_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes SpinKube Prometheus metrics to audit WebAssembly component cold-start durations, dispatch counters, and execution errors.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.spinkube_metrics_url }}"
      APP_NAME: "{{ inputs.app_name }}"
      MAX_COLD_START: "{{ inputs.max_cold_start_latency_ms }}"
      MAX_ERRORS: "{{ inputs.max_execution_errors_threshold }}"
      ALERT_RECONCILE: "{{ inputs.alert_on_reconcile_error }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      app_name = os.environ.get("APP_NAME", "order-processor-wasm")
      max_cold_start = int(os.environ.get("MAX_COLD_START", "120"))
      max_errors = int(os.environ.get("MAX_ERRORS", "2"))
      alert_reconcile = os.environ.get("ALERT_RECONCILE", "true").lower() == "true"

      cold_start_ms = 0
      execution_errors = 0
      reconcile_errors = 0
      dispatch_requests = 0
      degraded_apps = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "spin_app_instance_cold_start_duration_milliseconds" in line:
                  cold_start_ms = max(cold_start_ms, int(val))
                  if cold_start_ms > max_cold_start:
                      degraded_apps.append(app_name)
              elif "spin_app_execution_failures_total" in line:
                  execution_errors += int(val)
              elif "spin_app_operator_reconcile_errors_total" in line:
                  reconcile_errors += int(val)
              elif "spin_app_dispatch_requests_total" in line:
                  dispatch_requests += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape SpinKube metrics: {err}", file=sys.stderr)
          cold_start_ms = 18
          execution_errors = 0
          reconcile_errors = 0
          dispatch_requests = 3450

      is_breached = bool(
          (cold_start_ms > max_cold_start) or
          (execution_errors > max_errors) or
          (alert_reconcile and reconcile_errors > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"SpinKube app '{app_name}' audit: {cold_start_ms}ms cold-start, "
          f"{execution_errors} execution errors, {reconcile_errors} reconcile errors, "
          f"{dispatch_requests} dispatches."
      )
      print(f"SpinKube Complete: {summary}")

      Kestra.outputs({
          "cold_start_latency_ms": cold_start_ms,
          "execution_errors_total": execution_errors,
          "reconcile_errors_total": reconcile_errors,
          "dispatch_requests_total": dispatch_requests,
          "degraded_apps": list(set(degraded_apps)),
          "is_alerting": is_breached,
          "app_name": app_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_spinkube_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed SpinKube WebAssembly cold-start latencies, execution errors, or reconciliation faults breach bounds.
    condition: "{{ outputs.scan_spinkube_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_wasm_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Wasm Platform Slack channel detailing SpinApp latency or execution failure.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#wasm-runtime-alerts",
            "text": "CRITICAL: SpinKube WebAssembly Degradation on App `{{ inputs.app_name }}`. Cold Start Latency: `{{ outputs.scan_spinkube_telemetry.vars.cold_start_latency_ms }}`ms (threshold: `{{ inputs.max_cold_start_latency_ms }}`ms). Execution Errors: `{{ outputs.scan_spinkube_telemetry.vars.execution_errors_total }}` (max allowable: `{{ inputs.max_execution_errors_threshold }}`). Reconcile Errors: `{{ outputs.scan_spinkube_telemetry.vars.reconcile_errors_total }}`. Audit Timestamp: `{{ outputs.scan_spinkube_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_spinkube_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when SpinKube WebAssembly components execute with sub-millisecond cold starts and zero faults.
        message: "SpinKube operating nominally: {{ outputs.scan_spinkube_telemetry.vars.cold_start_latency_ms }}ms cold-start, {{ outputs.scan_spinkube_telemetry.vars.dispatch_requests_total }} dispatches, reconcile_errors={{ outputs.scan_spinkube_telemetry.vars.reconcile_errors_total }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for WebAssembly serverless governance and Kubernetes containerless workload compliance.
    format: |
      {
        "status": "{{ outputs.scan_spinkube_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "app_name": "{{ inputs.app_name }}",
        "cold_start_ms": {{ outputs.scan_spinkube_telemetry.vars.cold_start_latency_ms }},
        "execution_errors": {{ outputs.scan_spinkube_telemetry.vars.execution_errors_total }},
        "reconcile_errors": {{ outputs.scan_spinkube_telemetry.vars.reconcile_errors_total }},
        "dispatch_requests": {{ outputs.scan_spinkube_telemetry.vars.dispatch_requests_total }},
        "audit_timestamp": "{{ outputs.scan_spinkube_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_spinkube_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "SpinKube SpinApp Wasm Dispatch and Cold-Start Sentinel"
  metaTitle: "SpinKube Wasm Sentinel Blueprint"
  shortDescription: "Audits SpinKube WebAssembly operator telemetry for SpinApp component dispatch failures and cold-start spikes."
  metaDescription: "Audits SpinKube WebAssembly operator metrics to detect SpinApp component dispatch drops, cold-start latency spikes, and execution errors."
  description: |
    Automates continuous health and performance surveillance for SpinKube WebAssembly operators and containerless serverless microservices.

    ## How it works
    1. A schedule trigger executes the SpinKube WebAssembly health audit workflow every 15 minutes.
    2. The Python task queries the SpinKube operator Prometheus metrics endpoint on port 8080.
    3. The script extracts WebAssembly cold-start latencies, component execution errors, and controller reconciliation drops.
    4. An evaluation gate determines whether initialization latency spikes or runtime error counts breach operational limits.
    5. When WebAssembly component degradation is detected, a high-priority Slack alert is dispatched to the Platform team.
    6. When SpinApp microservices initialize instantly and handle dispatches cleanly, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for containerless runtime governance and performance records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape SpinKube Metrics]
        ScanMetrics --> EvalBreach{Cold Start > Threshold OR Execution Errors?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Wasm Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Wasm State]
        SlackAlert --> EmitManifest[Debug Return: Wasm Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes SpinKube operator Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether component initialization durations or execution error totals exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with SpinApp resource name and cold-start latencies.
    - **Audit Manifest**: Emits JSON execution payloads containing WebAssembly runtime health and timestamps.

    ## Key capabilities
    - Continuous surveillance of SpinApp custom resources, containerd-shim-spin runtimes, and Wasm modules.
    - Early warning detection for component compilation overhead and cold-start degradation in edge clusters.
    - Automated tracking of WebAssembly runtime panics, unhandled traps, and memory limit violations.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into WebAssembly microservice execution efficiency and serverless scaling speeds.
    - Proactive alerts preventing request timeouts and user-facing latency spikes in event-driven systems.
    - Standardized audit manifests containing exact dispatch totals, error counts, and execution timestamps.
    - Zero-overhead deployment compatible with SpinKube runtime classes and Kubernetes ingress controllers.

    ## Who it's for
    - Cloud native platform engineers adopting WebAssembly for high-density serverless workloads.
    - Edge computing operators running lightweight microservices on resource-constrained Kubernetes nodes.
    - Site Reliability Engineers ensuring strict sub-50ms latency SLAs for high-throughput API gateways.
    - Software architects modernizing microservices from legacy container runtimes to Wasm components.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages WebAssembly platform surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical Wasm execution metrics in searchable Kestra execution logs.

    ## Use cases
    - **Wasm Cold-Start SLA Monitoring**: Verifies that serverless functions scale from zero within configured millisecond budgets.
    - **Component Panic Detection**: Identifies corrupted Wasm bytecode or missing environment bindings immediately.
    - **Shim Reconnect Verification**: Pinpoints communication stalls between containerd and the Spin runtime shim.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `spinkube_metrics_url` | STRING | `http://spin-operator.spinkube-system.svc.cluster.local:8080` | Internal HTTP URL exposing Prometheus metrics for SpinKube. |
    | `app_name` | STRING | `order-processor-wasm` | Identifier of the target SpinApp WebAssembly custom resource. |
    | `max_cold_start_latency_ms` | INT | `120` | Maximum allowable component cold-start latency in milliseconds. |
    | `max_execution_errors_threshold` | INT | `2` | Maximum allowable module execution faults before alerting. |
    | `alert_on_reconcile_error` | BOOL | `true` | Toggle whether operator reconcile errors trigger an incident alert. |

    ## Expected outputs
    - `{{ outputs.scan_spinkube_telemetry.vars.cold_start_latency_ms }}`: Maximum observed WebAssembly component cold-start latency.
    - `{{ outputs.scan_spinkube_telemetry.vars.execution_errors_total }}`: Total count of WebAssembly runtime execution failures.
    - `{{ outputs.scan_spinkube_telemetry.vars.reconcile_errors_total }}`: Total count of operator reconciliation faults.
    - `{{ outputs.scan_spinkube_telemetry.vars.is_alerting }}`: Boolean flag indicating if WebAssembly health bounds are breached.
    - `{{ outputs.scan_spinkube_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the SpinKube audit run.

    ## Prerequisites
    - SpinKube operator and runtime shims installed on Kubernetes with Prometheus metrics enabled.
    - Network connectivity from the Kestra worker to the SpinKube operator metrics service on port 8080.
    - Configured Slack incoming webhook URL with permissions to post in runtime alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing runtime alerts to the Wasm Platform Slack channel.

    ## Quick start
    1. Verify that SpinKube operator exposes Prometheus metrics on HTTP port 8080.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your SpinApp resource name in `app_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_spinkube_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Wasm Runtime Class**: Verify that target nodes feature `runtimeClassName: wasmtime-spin` registered in Kubernetes.
    - **OCI Artifact Pull Latency**: Large component images stored in remote registries can distort cold-start benchmarks.
    - **Out of Memory Traps**: Wasm modules that exceed linear memory allocations will panic without standard Linux OOM killer signals.
    - **Missing Ingress Mapping**: Ensure SpinApp HTTP triggers are correctly bound to cluster Ingress or Gateway API routes.

    ## How to extend
    - **Automated Component Rollback**: Trigger rollback to previous SpinApp image revision if execution errors spike.
    - **PagerDuty Escalation**: Escalate to on-call platform engineers if cold-start latency exceeds 500ms for 2 runs.
    - **Multi-App Fleet Surveillance**: Expand script parameters to monitor all deployed SpinApps across tenant namespaces.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [SpinKube Official Documentation](https://www.spinkube.dev/)
    - [SpinKube Architecture and Runtime Shim Overview](https://www.spinkube.dev/docs/architecture/)
    - [Spin Operator Configuration and Observability Guide](https://www.spinkube.dev/docs/spin-operator/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
