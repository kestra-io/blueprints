id: kafka-consumer-group-commit-drift-sentinel
namespace: company.streaming

inputs:
  - id: kafka_bootstrap
    type: STRING
    defaults: "kafka.internal:9092"
    description: Host and port of the Kafka bootstrap broker.
  - id: consumer_group
    type: STRING
    description: Consumer group ID to audit.
  - id: max_allowable_lag
    type: INT
    defaults: 5000
    description: "Maximum allowable total message offset lag across all topic partitions (default 5000)."

tasks:
  - id: inspect_consumer_lag
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Kafka consumer group offset details
        kafka-consumer-groups.sh --bootstrap-server "{{ inputs.kafka_bootstrap }}" \
          --describe --group "{{ inputs.consumer_group }}" > /tmp/kafka_group_desc.txt 2>/dev/null || echo "" > /tmp/kafka_group_desc.txt

        python3 -c "
        try:
            with open('/tmp/kafka_group_desc.txt') as f:
                lines = f.readlines()
            total_lag = 0
            for line in lines:
                parts = line.strip().split()
                if len(parts) >= 6 and parts[5].isdigit():
                    total_lag += int(parts[5])
            is_breach = 1 if total_lag > {{ inputs.max_allowable_lag }} else 0
            print(f'{is_breach}|{total_lag}')
        except Exception:
            print('0|0')
        " > /tmp/kafka_lag_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/kafka_lag_summary.txt)
        TOTAL_LAG=$(cut -d '|' -f 2 /tmp/kafka_lag_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=total_lag::$TOTAL_LAG::"

  - id: evaluate_streaming_lag
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_consumer_lag.vars.is_breach | int == 1 }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kafka Consumer Group Lag Surge Alert",
                "text": "Consumer Group {{ inputs.consumer_group }} has reached {{ outputs.inspect_consumer_lag.vars.total_lag }} uncommitted messages (threshold {{ inputs.max_allowable_lag }}). Risk of pipeline SLA violations.",
                "footer": "Kestra Streaming Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Kafka Sentinel Failure",
            "text": "Failed to describe consumer group on Kafka bootstrap server {{ inputs.kafka_bootstrap }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: Apache Kafka Consumer Group Offset Lag Sentinel
  shortDescription: Audits Apache Kafka consumer group committed offsets and partition lag to prevent streaming processing delays.
  description: |
    ## How it works
    This workflow connects to an Apache Kafka cluster using `kafka-consumer-groups.sh` to describe the committed partition offsets for a target consumer group. By comparing log end offsets against current committed consumer offsets across all assigned topic partitions, it computes the aggregate message lag. When consumer worker instances encounter slow downstream database transactions or crashloops, message lag escalates, violating real-time SLA commitments. This sentinel audits aggregate lag and alerts streaming engineers before consumer backlogs saturate disk retention boundaries.

    ## What you get
    - Real-time visibility into Kafka consumer group partition lag.
    - Early warning before data streaming pipelines breach latency SLAs.
    - Contextual Slack alerts with total uncommitted message counts.

    ## Who it's for
    - Streaming Platform Engineers operating Apache Kafka and Strimzi clusters.
    - Data Engineers maintaining event-driven real-time pipelines.
    - SREs ensuring asynchronous messaging reliability.

    ## Why orchestrate this with Kestra
    - **Agentless Surveillance**: Inspects consumer group states without deploying Kafka Exporter.
    - **Automated Worker Scaling**: Can trigger Kubernetes HPA scaling calls for lagging consumer microservices.
    - **Unified Telemetry**: Consolidates streaming health alongside database and cloud sentinels.

    ## Prerequisites
    - Apache Kafka cluster with accessible bootstrap server (`9092`).
    - Kafka client CLI utilities installed in the runner environment.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `SLACK_WEBHOOK` secret to your namespace.
    3. Specify `kafka_bootstrap` and target `consumer_group`.
    4. Enable the schedule trigger for continuous lag monitoring.

    ## How to extend
    - Break down lag metrics per partition and report top lagging partitions.
    - Trigger consumer container restarts if offsets remain unchanged across multiple evaluations.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [Apache Kafka Consumer Group Documentation](https://kafka.apache.org/documentation/#basic_ops_consumer_group)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
