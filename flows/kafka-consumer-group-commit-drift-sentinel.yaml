id: kafka-consumer-group-commit-drift-sentinel
namespace: company.team

inputs:
  - id: kafka_bootstrap
    type: STRING
    defaults: "kafka.internal:9092"
    description: Host and port of the Kafka bootstrap broker.
  - id: consumer_group
    type: STRING
    description: Consumer group ID to audit.
  - id: max_allowable_lag
    type: INT
    defaults: 5000
    description: "Maximum allowable total message offset lag across all topic partitions (default 5000)."

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: inspect_consumer_lag
    type: io.kestra.plugin.scripts.shell.Commands
    description: Describe Kafka consumer group offset lag using kafka-consumer-groups CLI.
    containerImage: bitnami/kafka:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      BOOTSTRAP: "{{ inputs.kafka_bootstrap }}"
      GROUP: "{{ inputs.consumer_group }}"
      MAX_LAG: "{{ inputs.max_allowable_lag }}"
    outputFiles:
      - kafka_lag_summary.json
    commands:
      - |
        set -euo pipefail
        kafka-consumer-groups.sh --bootstrap-server "$BOOTSTRAP" --describe --group "$GROUP" > /tmp/group_desc.txt

        python3 -c '
        import os
        import sys
        import json
        from kestra import Kestra

        max_lag = int(os.environ.get("MAX_LAG", 5000))
        group = os.environ.get("GROUP", "")

        try:
            with open("/tmp/group_desc.txt", "r") as f:
                lines = f.readlines()
        except Exception as exc:
            print(f"ERROR: Cannot read consumer group output: {exc}", file=sys.stderr)
            sys.exit(1)

        total_lag = 0
        partitions = []
        for line in lines:
            parts = line.strip().split()
            # Standard output format: GROUP TOPIC PARTITION CURRENT-OFFSET LOG-END-OFFSET LAG CONSUMER-ID HOST CLIENT-ID
            if len(parts) >= 6 and parts[5].isdigit():
                lag = int(parts[5])
                total_lag += lag
                partitions.append({"topic": parts[1], "partition": parts[2], "lag": lag})

        is_breach = total_lag > max_lag
        summary = {
            "group": group,
            "total_lag": total_lag,
            "max_allowable_lag": max_lag,
            "is_breach": is_breach,
            "partitions": partitions
        }

        with open("kafka_lag_summary.json", "w") as out:
            json.dump(summary, out, indent=2)

        print(f"Consumer group {group} audit complete: total_lag={total_lag}, breach={is_breach}")
        Kestra.outputs({
            "total_lag": total_lag,
            "is_breach": is_breach
        })
        '

  - id: evaluate_streaming_lag
    type: io.kestra.plugin.core.flow.If
    description: Branch based on lag threshold violation.
    condition: "{{ outputs.inspect_consumer_lag.vars.is_breach == true }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kafka Consumer Group Lag Surge Alert",
                "text": "Consumer Group `{{ inputs.consumer_group }}` has reached *{{ outputs.inspect_consumer_lag.vars.total_lag }}* uncommitted messages (threshold {{ inputs.max_allowable_lag }}). Risk of pipeline SLA violations.",
                "footer": "Kestra Streaming Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Kafka Sentinel Failure",
            "text": "Failed to describe consumer group on Kafka bootstrap server {{ inputs.kafka_bootstrap }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

outputs:
  - id: total_lag
    type: INT
    value: "{{ outputs.inspect_consumer_lag.vars.total_lag }}"
  - id: is_breach
    type: BOOLEAN
    value: "{{ outputs.inspect_consumer_lag.vars.is_breach }}"

extend:
  title: Apache Kafka Consumer Group Offset Lag Sentinel
  shortDescription: Audits Apache Kafka consumer group committed offsets and partition lag to prevent streaming processing delays.
  metaTitle: Apache Kafka Consumer Group Offset Lag Sentinel with Kestra
  metaDescription: Audits Apache Kafka consumer group committed offsets and partition lag to prevent streaming processing delays.
  description: |
    Audits Apache Kafka consumer group committed offsets and partition lag to prevent streaming processing delays.
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - ELT & Data Landing
  ee: false
  demo: false
