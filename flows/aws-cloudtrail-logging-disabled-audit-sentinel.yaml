id: aws-cloudtrail-logging-disabled-audit-sentinel
namespace: company.ops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region to query CloudTrail trails.

tasks:
  - id: describe_trails
    type: io.kestra.plugin.aws.cli.AwsCLI
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.aws_region }}"
    commands:
      - |
        aws cloudtrail describe-trails --include-shadow-trails false --output json > /tmp/trails.json
        TRAIL_COUNT=$(jq '.trailList | length' /tmp/trails.json)
        DISABLED_TRAILS=""
        ISSUES_FOUND=false
        for i in $(seq 0 $((TRAIL_COUNT - 1))); do
          TRAIL_ARN=$(jq -r ".trailList[$i].TrailARN" /tmp/trails.json)
          TRAIL_NAME=$(jq -r ".trailList[$i].Name" /tmp/trails.json)
          IS_MULTI=$(jq -r ".trailList[$i].IsMultiRegionTrail" /tmp/trails.json)
          STATUS=$(aws cloudtrail get-trail-status --name "$TRAIL_ARN" --output json)
          IS_LOGGING=$(echo "$STATUS" | jq -r '.IsLogging')
          LOG_VALIDATION=$(jq -r ".trailList[$i].LogFileValidationEnabled" /tmp/trails.json)
          if [ "$IS_LOGGING" = "false" ]; then
            ISSUES_FOUND=true
            DISABLED_TRAILS="$DISABLED_TRAILS $TRAIL_NAME (MultiRegion=$IS_MULTI, LogValidation=$LOG_VALIDATION)"
          fi
        done
        echo "{\"issues_found\": $ISSUES_FOUND, \"disabled_trails\": \"$DISABLED_TRAILS\", \"trail_count\": $TRAIL_COUNT}"

  - id: evaluate_trails
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.describe_trails.vars.issues_found | default(false) }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":rotating_light: *AWS CloudTrail Logging Disabled Detected*\nOne or more CloudTrail trails have logging disabled.\n• Affected trails: `{{ outputs.describe_trails.vars.disabled_trails }}`\n• Total trails checked: `{{ outputs.describe_trails.vars.trail_count }}`\nRegion: `{{ inputs.aws_region }}`"
          }
    else:
      - id: log_ok
        type: io.kestra.plugin.core.log.Log
        message: "All CloudTrail trails have logging enabled. No issues detected."

errors:
  - id: error_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":x: *AWS CloudTrail Logging Sentinel failed*\nExecution `{{ execution.id }}` encountered an error: `{{ error.message }}`"
      }

triggers:
  - id: scheduled_sentinel_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: AWS CloudTrail Multi-Region Logging Disabled Audit Sentinel
  shortDescription: Audit all CloudTrail trails for disabled logging, missing multi-region coverage, and log validation issues, then alert Slack.
  description: |
    This sentinel periodically enumerates every AWS CloudTrail trail in your account and checks whether each one has
    active logging enabled. Trails with `IsLogging: false` are collected and reported to Slack with their multi-region
    and log-file-validation status, giving security and compliance teams immediate visibility into audit-log gaps.

    ## How it works

    1. `io.kestra.plugin.aws.cli.AwsCLI` calls `aws cloudtrail describe-trails --include-shadow-trails false` to list
       all trails owned by the account.
    2. For each trail, `aws cloudtrail get-trail-status` is called to retrieve `IsLogging`. The trail's
       `IsMultiRegionTrail` and `LogFileValidationEnabled` flags are read from the describe output.
    3. Trails where `IsLogging` is `false` are accumulated into a `disabled_trails` string and `issues_found` is set
       to `true`.
    4. `io.kestra.plugin.core.flow.If` branches on `issues_found`. When `true`, a Slack alert lists the affected
       trail names with their multi-region and validation attributes. When `false`, the flow logs a clean result.
    5. A top-level `errors` block fires a Slack alert on any unhandled exception.

    ## What you get

    - Per-trail audit of logging status across every CloudTrail trail in the account.
    - Slack alerts listing disabled trail names with multi-region and log-validation attributes.
    - Execution history in Kestra for every sentinel check run.
    - A top-level error handler to catch and surface AWS CLI failures.

    ## Who it's for

    - Security engineers enforcing AWS CloudTrail coverage as part of CIS or SOC 2 programmes.
    - Cloud compliance teams that need continuous audit-log gap detection.
    - DevOps teams managing multi-region AWS environments.

    ## Why orchestrate this with Kestra

    AWS Config can detect this condition, but it requires a separate service with its own rule lifecycle and SNS
    notification pipeline. Kestra consolidates describe, status check, conditional branching, and Slack notification
    into a single auditable flow with namespace-scoped secrets, retries, and full execution lineage.

    ## Prerequisites

    - An AWS IAM identity with `cloudtrail:DescribeTrails` and `cloudtrail:GetTrailStatus` permissions.
    - A Slack incoming webhook.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret access key.
    - `SLACK_WEBHOOK`: Slack incoming webhook URL.

    ## Quick start

    1. Add `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` to your Kestra namespace secrets.
    2. Set the `aws_region` input to your target region (default: `us-east-1`).
    3. Enable the schedule trigger or execute manually to audit current CloudTrail state.

    ## How to extend

    - Add a remediation step that calls `aws cloudtrail start-logging --name <arn>` to re-enable logging automatically.
    - Extend the check to verify `IsMultiRegionTrail` and `LogFileValidationEnabled` and alert when either is false.
    - Loop across multiple AWS regions by parameterising the region input and using Kestra's `ForEach`.
    - Persist audit results to S3 or a data warehouse for long-term compliance reporting.

    ## Links

    - [AWS CloudTrail documentation](https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html)
    - [Kestra AWS CLI plugin](https://kestra.io/plugins/plugin-aws)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
  ee: false
  demo: false
