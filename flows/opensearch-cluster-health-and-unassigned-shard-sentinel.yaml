id: opensearch-cluster-health-and-unassigned-shard-sentinel
namespace: company.team

description: |
  Continuously audit OpenSearch cluster health, detect degraded yellow or red states,
  and identify unassigned shard accumulation before search latency spikes or data
  unavailability occurs. Evaluates cluster health diagnostics using Pebble, routes
  through a Switch flow control task, dispatches tiered Slack incident alerts, and
  records an immutable operational audit log.

inputs:
  - id: opensearch_url
    type: STRING
    displayName: OpenSearch URL
    description: Base URL of the OpenSearch cluster (including scheme, host, and port).
    defaults: "http://localhost:9200"

  - id: unassigned_shard_threshold
    type: INT
    displayName: Unassigned Shard Threshold
    description: Maximum allowable unassigned shards before a degraded warning is triggered.
    defaults: 0

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable in production to continuously evaluate cluster health.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_cluster_health
    type: io.kestra.plugin.opensearch.Request
    description: Query cluster health endpoint. allowFailure ensures network timeouts or authentication issues are captured for classification.
    allowFailure: true
    connection:
      hosts:
        - "{{ inputs.opensearch_url }}"
      basicAuth:
        username: "{{ secret('OPENSEARCH_USERNAME') }}"
        password: "{{ secret('OPENSEARCH_PASSWORD') }}"
    method: GET
    endpoint: "_cluster/health"

  - id: probe_cluster_allocation
    type: io.kestra.plugin.opensearch.Request
    description: Query shard allocation explanation to capture diagnostic root cause when unassigned shards exist.
    allowFailure: true
    connection:
      hosts:
        - "{{ inputs.opensearch_url }}"
      basicAuth:
        username: "{{ secret('OPENSEARCH_USERNAME') }}"
        password: "{{ secret('OPENSEARCH_PASSWORD') }}"
    method: GET
    endpoint: "_cluster/allocation/explain"

  - id: classify_health_status
    type: io.kestra.plugin.core.debug.Return
    description: Classify health state into PROBE_FAILED, CLUSTER_RED, CLUSTER_YELLOW, or HEALTHY based on cluster status and shard counts.
    format: "{{ outputs.probe_cluster_health is not defined or outputs.probe_cluster_health.response is not defined or outputs.probe_cluster_health.response.status is not defined ? 'PROBE_FAILED' : (outputs.probe_cluster_health.response.status == 'red' ? 'CLUSTER_RED' : (outputs.probe_cluster_health.response.status == 'yellow' or outputs.probe_cluster_health.response.unassigned_shards > inputs.unassigned_shard_threshold ? 'CLUSTER_YELLOW' : 'HEALTHY')) }}"

  - id: route_by_health_status
    type: io.kestra.plugin.core.flow.Switch
    description: Route execution based on classified OpenSearch cluster health status.
    value: "{{ outputs.classify_health_status.value }}"
    cases:
      CLUSTER_RED:
        - id: alert_cluster_red
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch critical alert when OpenSearch reports red status indicating missing primary shards.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "🚨 *OpenSearch Cluster RED Alert*\n• Cluster: `" ~ inputs.opensearch_url ~ "`\n• Status: RED\n• Active Shards: " ~ outputs.probe_cluster_health.response.active_shards ~ "\n• Unassigned Shards: " ~ outputs.probe_cluster_health.response.unassigned_shards ~ "\n• Impact: One or more primary shards are unassigned. Immediate investigation required to prevent data loss."} | toJson }}

      CLUSTER_YELLOW:
        - id: alert_cluster_yellow
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch warning alert when OpenSearch reports yellow status indicating unassigned replica shards.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "⚠️ *OpenSearch Cluster YELLOW Warning*\n• Cluster: `" ~ inputs.opensearch_url ~ "`\n• Status: YELLOW\n• Active Shards: " ~ outputs.probe_cluster_health.response.active_shards ~ "\n• Unassigned Shards: " ~ outputs.probe_cluster_health.response.unassigned_shards ~ " (Threshold: " ~ inputs.unassigned_shard_threshold ~ ")\n• Impact: Replica shards are unallocated. Reduced cluster redundancy and fault tolerance."} | toJson }}

      PROBE_FAILED:
        - id: alert_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch connectivity alert when OpenSearch endpoints cannot be reached.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "🚨 *OpenSearch Connectivity Failure*\n• Target URL: `" ~ inputs.opensearch_url ~ "`\n• Status: Probe task failed to execute or connect.\n• Action: Verify OpenSearch container/service status and network reachability."} | toJson }}

      HEALTHY:
        - id: log_healthy_pass
          type: io.kestra.plugin.core.log.Log
          description: Record operational log confirming green cluster health.
          message: "OpenSearch cluster health verified: status is GREEN with {{ outputs.probe_cluster_health.response.active_shards }} active shards across {{ outputs.probe_cluster_health.response.number_of_nodes }} nodes."

    defaults:
      - id: log_unexpected_state
        type: io.kestra.plugin.core.log.Log
        message: "Unexpected classify_health_status value: {{ outputs.classify_health_status.value }}"

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Final immutable audit log confirming sentinel evaluation details across all branches.
    message: "OpenSearch sentinel completed. execution={{ execution.id }} status={{ outputs.classify_health_status.value }} active_shards={{ outputs.probe_cluster_health.response.active_shards ?? 'N/A' }} unassigned_shards={{ outputs.probe_cluster_health.response.unassigned_shards ?? 'N/A' }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Catch-all notification if workflow encounters fatal execution errors outside handled probe tasks.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {"text": "❌ *OpenSearch Sentinel Flow Error*\nFlow `" ~ flow.id ~ "` failed during execution `" ~ execution.id ~ "`. Check Kestra execution logs."} | toJson }}

extend:
  title: OpenSearch Cluster Health and Unassigned Shard Sentinel
  metaTitle: OpenSearch Cluster Health and Unassigned Shard Sentinel | Kestra
  shortDescription: Audit OpenSearch cluster health, detect degraded yellow or red states, and alert Slack on unassigned shard accumulation before search outages occur.
  metaDescription: Audit OpenSearch cluster health, detect degraded yellow or red states, and alert Slack on unassigned shard accumulation before search outages occur.
  description: |
    Production search and log analytics clusters running OpenSearch can degrade silently before
    applications experience total outages. When a node restarts, disk watermarks trip, or index
    shards fail to allocate, OpenSearch transitions from green to yellow (missing replica shards)
    or red (missing primary shards). Without proactive monitoring, engineers often only discover
    these issues after users report slow search queries or indexing operations fail.

    This blueprint provides an automated sentinel that proactively monitors OpenSearch cluster
    health and shard allocation on a scheduled basis. It checks both cluster-level status and
    underlying shard allocation diagnostics, classifies cluster operational state, and dispatches
    context-aware Slack alerts.

    ## How it works

    1. A disabled-by-default `io.kestra.plugin.core.trigger.Schedule` triggers the workflow
       every 15 minutes, or upon manual execution by platform engineers.
    2. `probe_cluster_health` (`io.kestra.plugin.opensearch.Request`) queries `_cluster/health`
       with `allowFailure: true` to retrieve the current cluster status (`green`, `yellow`, `red`),
       active shards count, and unassigned shards count.
    3. `probe_cluster_allocation` (`io.kestra.plugin.opensearch.Request`) queries
       `_cluster/allocation/explain` with `allowFailure: true` to capture diagnostic explanations
       when shard allocation issues occur.
    4. `classify_health_status` (`io.kestra.plugin.core.debug.Return`) evaluates probe outputs
       using Pebble expressions, categorizing cluster state into `PROBE_FAILED`, `CLUSTER_RED`,
       `CLUSTER_YELLOW`, or `HEALTHY`.
    5. `route_by_health_status` (`io.kestra.plugin.core.flow.Switch`) routes downstream actions:
       - On `CLUSTER_RED`: Dispatches a critical incident alert to Slack indicating missing primary shards.
       - On `CLUSTER_YELLOW`: Dispatches a warning alert to Slack flagging unassigned replica shards.
       - On `PROBE_FAILED`: Dispatches an unreachable cluster or authentication failure alert.
       - On `HEALTHY`: Emits an operational confirmation log with active shard counts.
    6. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) records an immutable audit log entry
       with execution ID, cluster status, and shard counts.
    7. A top-level `errors` handler catches unexpected orchestration faults and notifies Slack.

    ## What you get

    - Automated cluster health monitoring evaluating primary and replica shard availability.
    - Tiered Slack alerts differentiating between catastrophic red states and degraded yellow states.
    - Early warning detection for unassigned shard accumulation before disk watermarks trigger write blocks.
    - An immutable audit trail of cluster health metrics across every scheduled execution.

    ## Who it's for

    - Platform Engineers and Site Reliability Engineers managing OpenSearch or Elasticsearch clusters.
    - Data Infrastructure teams responsible for centralized log analytics and search clusters.
    - DevOps teams maintaining containerized search backends.

    ## Why orchestrate this with Kestra

    Monitoring distributed search clusters with cron scripts often leads to silent monitoring failures,
    unmanaged credentials, and unformatted alerts that lack diagnostic context. Kestra provides native
    OpenSearch tasks, declarative secret management, robust conditional branching via Pebble, and built-in
    Slack alerting within a single maintainable, auditable workflow.

    ## Prerequisites

    - A running OpenSearch cluster (e.g., standard Docker image `opensearchproject/opensearch:2.14.0`).
    - Network connectivity from the Kestra worker to the OpenSearch HTTP REST API.
    - A Slack incoming webhook URL for alerting.

    ### Secrets

    - `OPENSEARCH_USERNAME`: Username for OpenSearch HTTP basic authentication (required).
    - `OPENSEARCH_PASSWORD`: Password for OpenSearch HTTP basic authentication (required).
    - `SLACK_WEBHOOK`: Slack Incoming Webhook URL used for dispatching alert notifications (required).

    ## Quick start

    1. Configure `OPENSEARCH_USERNAME`, `OPENSEARCH_PASSWORD`, and `SLACK_WEBHOOK` in your Kestra namespace secrets.
    2. Start a local single-node OpenSearch container for testing if needed:
       `docker run -d -p 9200:9200 -e "discovery.type=single-node" -e "OPENSEARCH_INITIAL_ADMIN_PASSWORD=AdminPassword123!" opensearchproject/opensearch:2.14.0`
    3. Import this blueprint into Kestra and click **Execute** with default parameters.
    4. Verify the audit log output in the execution logs tab.
    5. Enable the `every_15_minutes` schedule trigger to establish automated monitoring.

    ## How to extend

    - Add automated shard rerouting: wire an `io.kestra.plugin.opensearch.Request` task on `CLUSTER_YELLOW` to POST `_cluster/reroute?retry_failed=true` to automatically retry stuck shards.
    - Add disk watermark monitoring: add a probe for `_nodes/stats/fs` to detect disk space saturation before shards get blocked.
    - PagerDuty integration: replace or supplement Slack alerts with PagerDuty incidents for immediate on-call escalation during red cluster states.

    ## Links

    - [OpenSearch Plugin Documentation](https://kestra.io/plugins/plugin-opensearch)
    - [OpenSearch Cluster Health API](https://opensearch.org/docs/latest/api-reference/cluster-api/cluster-health/)
    - [OpenSearch Shard Allocation Explain API](https://opensearch.org/docs/latest/api-reference/cluster-api/cluster-allocation/)
    - [Kestra Switch Task Documentation](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
