id: snowflake-cost-anomaly-detector
namespace: company.team
description: |
  Automated FinOps monitoring pipeline for Snowflake data warehouses. Tracks daily credit
  consumption across all compute warehouses, computes rolling 7-day baselines, detects anomalous
  cost spikes, and triggers Slack alerts to prevent unexpected cloud bills.

concurrency:
  limit: 1

inputs:
  - id: alert_threshold_percent
    type: INT
    displayName: Cost Spike Alert Threshold (%)
    description: Percentage increase over rolling baseline that flags an anomaly.
    defaults: 25

  - id: lookback_days
    type: INT
    displayName: Baseline Lookback Window (Days)
    description: Number of days to include when calculating normal historical consumption.
    defaults: 7

  - id: estimated_credit_price_usd
    type: FLOAT
    displayName: Estimated Price per Credit (USD)
    description: Average dollar cost per Snowflake credit for financial impact estimation.
    defaults: 3.00

  - id: slack_channel
    type: STRING
    displayName: FinOps Slack Channel
    description: Destination channel for cost spike alerts.
    defaults: "#finops-alerts"

triggers:
  - id: daily_finops_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily FinOps spend audit executed at 07:00 UTC. Can also be triggered manually.
    cron: "0 7 * * *"

tasks:
  - id: calculate_baseline_and_spikes
    type: io.kestra.plugin.jdbc.snowflake.Query
    description: Query Snowflake Account Usage metering history to evaluate warehouse spend trends.
    url: "{{ secret('SNOWFLAKE_JDBC_URL') }}"
    username: "{{ secret('SNOWFLAKE_USER') }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      WITH daily_warehouse_spend AS (
        SELECT
          warehouse_name,
          DATE_TRUNC('day', start_time) AS usage_date,
          ROUND(SUM(credits_used), 2) AS credits_consumed
        FROM snowflake.account_usage.warehouse_metering_history
        WHERE start_time >= DATEADD(day, -{{ inputs.lookback_days }}, CURRENT_DATE())
        GROUP BY warehouse_name, usage_date
      ),
      baseline_metrics AS (
        SELECT
          warehouse_name,
          AVG(CASE WHEN usage_date < CURRENT_DATE() - 1 THEN credits_consumed END) AS avg_historical_credits,
          MAX(CASE WHEN usage_date = CURRENT_DATE() - 1 THEN credits_consumed ELSE 0 END) AS yesterday_credits
        FROM daily_warehouse_spend
        GROUP BY warehouse_name
      )
      SELECT
        warehouse_name,
        ROUND(yesterday_credits, 2) AS credits_yesterday,
        ROUND(COALESCE(avg_historical_credits, 0), 2) AS baseline_credits,
        ROUND(yesterday_credits * {{ inputs.estimated_credit_price_usd }}, 2) AS estimated_cost_usd,
        CASE
          WHEN COALESCE(avg_historical_credits, 0) > 0 THEN
            ROUND(((yesterday_credits - avg_historical_credits) / avg_historical_credits) * 100, 1)
          ELSE 0
        END AS spike_percentage
      FROM baseline_metrics
      WHERE yesterday_credits > 0
      ORDER BY spike_percentage DESC;

  - id: evaluate_spend_anomalies
    type: io.kestra.plugin.core.flow.If
    description: Branch execution when any warehouse exceeds the allowed spike threshold.
    condition: "{{ outputs.calculate_baseline_and_spikes.rows[0].spike_percentage >= inputs.alert_threshold_percent }}"
    then:
      - id: notify_finops_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Broadcast critical cost anomaly alert with impact figures to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          *Snowflake Cost Anomaly Detected* 🚨
          • *Offending Warehouse*: `{{ outputs.calculate_baseline_and_spikes.rows[0].warehouse_name }}`
          • *Credits Consumed (Yesterday)*: `{{ outputs.calculate_baseline_and_spikes.rows[0].credits_yesterday }}` credits
          • *7-Day Baseline*: `{{ outputs.calculate_baseline_and_spikes.rows[0].baseline_credits }}` credits
          • *Spike*: `+{{ outputs.calculate_baseline_and_spikes.rows[0].spike_percentage }}%` above baseline
          • *Estimated Spend*: `${{ outputs.calculate_baseline_and_spikes.rows[0].estimated_cost_usd }}`
          • *Action Required*: Inspect Snowflake Query History for unoptimized Cartesian joins or runaway clustering tasks.

    else:
      - id: log_healthy_spend
        type: io.kestra.plugin.core.log.Log
        description: Confirm warehouse consumption is healthy and within budget limits.
        message: "Snowflake spend within normal bounds. Top warehouse: {{ outputs.calculate_baseline_and_spikes.rows[0].warehouse_name }} (+{{ outputs.calculate_baseline_and_spikes.rows[0].spike_percentage }}% vs baseline)."

  - id: export_finops_audit
    type: io.kestra.plugin.core.debug.Return
    description: Output structured execution audit for historical tracking and compliance records.
    format: |
      {
        "pipeline": "snowflake-cost-anomaly-detector",
        "audit_timestamp": "{{ execution.startDate }}",
        "top_warehouse": "{{ outputs.calculate_baseline_and_spikes.rows[0].warehouse_name }}",
        "spike_percentage": {{ outputs.calculate_baseline_and_spikes.rows[0].spike_percentage }},
        "anomaly_flagged": {{ outputs.calculate_baseline_and_spikes.rows[0].spike_percentage >= inputs.alert_threshold_percent }}
      }

extend:
  shortDescription: Monitor daily Snowflake credit consumption, compare with rolling 7-day baselines, detect cost spikes, and alert FinOps via Slack.
  title: Snowflake Cost Anomaly Detector and FinOps Alerting
  metaTitle: Snowflake Cost Anomaly Detector with Kestra & Slack
  metaDescription: Automated FinOps workflow to audit Snowflake warehouse metering history, detect credit usage spikes over rolling baselines, and alert Slack.
  description: |
    Cloud data warehouses like Snowflake offer elastic scalability, but unmonitored compute can quickly trigger runaway costs. A single unpartitioned cross-join, accidental warehouse size upgrade, or runaway automated clustering job can result in thousands of dollars in surprise cloud bills.

    This blueprint implements an automated FinOps guardrail for Snowflake data platforms. Every morning, it queries `SNOWFLAKE.ACCOUNT_USAGE.WAREHOUSE_METERING_HISTORY`, calculates yesterday's credit burn against a rolling 7-day historical baseline for every warehouse, flags percentage spikes exceeding your configured threshold, and immediately alerts your FinOps team on Slack with estimated dollar impacts.

    ## How it works

    1. **Scheduled FinOps Audit**: The `daily_finops_schedule` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires automatically at 07:00 UTC once the previous day's metering history is finalized in Snowflake.
    2. **Metering Calculation**: The `calculate_baseline_and_spikes` task (`io.kestra.plugin.jdbc.snowflake.Query`) uses a SQL Common Table Expression (CTE) to aggregate credit usage per warehouse and calculate percentage deviation against the historical rolling window. With `fetchType: FETCH`, rows are returned to the flow execution context.
    3. **Anomaly Evaluation**: The `evaluate_spend_anomalies` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether the highest-spiking warehouse exceeds `alert_threshold_percent`.
    4. **Slack Alerting**: If an anomaly is detected, `notify_finops_alert` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a high-priority alert card detailing the offending warehouse, yesterday's credits, historical baseline, and dollar estimates.
    5. **Audit Metadata**: The `export_finops_audit` task records execution audit details for compliance logs and data platform dashboards.

    ## What you get

    - Automated, hands-free Snowflake credit spend surveillance.
    - Early warning on runaway queries before end-of-month invoice surprises.
    - Rolling baseline comparison that automatically adapts to seasonal business growth.
    - Zero human overhead for data warehouse cost governance.

    ## Who it's for

    - Data Platform Engineers and FinOps teams managing multi-tenant Snowflake accounts.
    - Analytics Engineering leads responsible for compute budget governance.
    - SREs and engineering managers preventing cloud overspending.

    ## Why orchestrate this with Kestra

    Snowflake includes basic resource monitors, but they only support hard quota cutoffs that abruptly terminate running production queries. Kestra provides declarative, intelligent FinOps automation: it computes statistical rolling baselines, sends rich formatted Slack digests, maintains execution lineage, and can conditionally trigger downstream mitigation workflows without disrupting production workloads.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `alert_threshold_percent` | FLOAT | `50.0` | Cost spike threshold percentage above rolling 7-day baseline to trigger a Slack alert. |
    | `baseline_days` | INT | `7` | Historical rolling evaluation window in days to compute daily average spend. |
    | `estimated_credit_price_usd` | FLOAT | `3.00` | Estimated dollar cost per Snowflake credit (standard Enterprise pricing). |
    | `slack_channel` | STRING | `#finops-alerts` | Destination Slack channel for anomaly alert dispatch. |

    ## Expected outputs

    - `{{ outputs.calculate_baseline_and_spikes.rows }}`: Array of warehouse usage records containing `warehouse_name`, `credits_yesterday`, `baseline_credits`, `estimated_cost_usd`, and `spike_percentage`.
    - `{{ outputs.calculate_baseline_and_spikes.size }}`: Total number of active warehouses analyzed.
    - `{{ outputs.evaluate_spend_anomalies }}`: Result of conditional branch checking if top warehouse spike exceeded threshold.
    - `{{ outputs.export_finops_audit.value }}`: Structured JSON manifest recording execution timestamp, top warehouse name, spike percentage, and anomaly flag.

    ## Prerequisites

    - A Snowflake account with access to `SNOWFLAKE.ACCOUNT_USAGE` views (typically granted to `ACCOUNTADMIN` or via custom monitoring role).
    - A Slack Incoming Webhook URL targeting your alert channel.

    ### Secrets

    - `SNOWFLAKE_JDBC_URL`: Snowflake JDBC connection string (e.g. `jdbc:snowflake://<account_identifier>.snowflakecomputing.com?warehouse=COMPUTE_WH&db=SNOWFLAKE&schema=ACCOUNT_USAGE`).
    - `SNOWFLAKE_USER`: Username of the service account authorized to query account usage.
    - `SNOWFLAKE_PASSWORD`: Password for the Snowflake service account.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for sending alert notifications.

    ## Quick start

    1. Configure the Snowflake and Slack secrets in your Kestra namespace.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI to perform an on-demand audit.
    4. Inspect the execution outputs to view credit consumption metrics across all active warehouses.

    ## Common pitfalls & troubleshooting

    - **Account Usage Latency**: Snowflake `ACCOUNT_USAGE` views have an inherent data latency of approximately 45 to 120 minutes. Running the schedule at 07:00 UTC ensures full reconciliation of the prior calendar day's usage.
    - **Warehouse Permissions**: The service account requires `IMPORTED PRIVILEGES` on database `SNOWFLAKE` to read `ACCOUNT_USAGE.WAREHOUSE_METERING_HISTORY`.
    - **JDBC URL Format**: Ensure your account identifier in `SNOWFLAKE_JDBC_URL` uses hyphens rather than underscores if your account uses cloud locator syntax (e.g., `xy12345.us-east-2.aws`).

    ## How to extend

    - Add `io.kestra.plugin.notifications.mail.MailSend` inside the `then:` block to notify finance department heads via email.
    - Lower warehouse sizing automatically during severe spikes using `ALTER WAREHOUSE ... SET WAREHOUSE_SIZE = 'X-SMALL'`.
    - Integrate with PagerDuty for critical tier-1 production warehouse escalations.

    ## Links

    - Kestra Snowflake Plugin Documentation: https://kestra.io/plugins/plugin-jdbc-snowflake
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Snowflake Account Usage Documentation: https://docs.snowflake.com/en/sql-reference/account-usage/warehouse_metering_history
  tags:
    - Data
    - Business
  subTags:
    - Warehousing & Analytics
    - FinOps & Cost Management
  ee: false
  demo: false
