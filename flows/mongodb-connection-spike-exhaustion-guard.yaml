id: mongodb-connection-spike-exhaustion-guard
namespace: company.database

description: Audits MongoDB replica set active connections against configured capacity, alerting DBAs before connection exhaustion rejects client applications.

concurrency:
  limit: 1

inputs:
  - id: mongodb_connection_uri
    type: STRING
    defaults: "mongodb://mongodb-primary.internal:27017"
    description: MongoDB connection string pointing to the primary replica set node.

  - id: max_connection_utilization_percent_warning
    type: FLOAT
    defaults: 80.0
    description: Connection utilization percentage threshold above which a saturation warning is triggered.

  - id: slack_channel
    type: STRING
    defaults: "#mongodb-dba-alerts"
    description: Slack channel destination for MongoDB connection capacity alerts.

tasks:
  - id: audit_mongodb_connections
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install pymongo
    env:
      MONGO_URI: "{{ inputs.mongodb_connection_uri }}"
      MONGO_USER: "{{ secret('MONGODB_USER') }}"
      MONGO_PASSWORD: "{{ secret('MONGODB_PASSWORD') }}"
      UTIL_LIMIT: "{{ inputs.max_connection_utilization_percent_warning }}"
    script: |
      import os
      import json
      from pymongo import MongoClient
      from kestra import Kestra

      uri = os.getenv('MONGO_URI')
      user = os.getenv('MONGODB_USER')
      password = os.getenv('MONGODB_PASSWORD')
      util_limit = float(os.getenv('UTIL_LIMIT', 80.0))

      client = MongoClient(uri, username=user, password=password, serverSelectionTimeoutMS=10000)
      server_status = client.admin.command('serverStatus')
      client.close()

      connections_data = server_status.get('connections', {})
      current_conn = connections_data.get('current', 0)
      available_conn = connections_data.get('available', 1)
      total_capacity = current_conn + available_conn

      utilization_percent = (current_conn / total_capacity) * 100.0 if total_capacity > 0 else 0.0
      has_saturation = utilization_percent >= util_limit

      Kestra.outputs({
          'current_connections': current_conn,
          'available_connections': available_conn,
          'total_capacity': total_capacity,
          'utilization_percent': round(utilization_percent, 2),
          'has_connection_saturation': has_saturation
      })

      report = {
          'server': uri,
          'current_connections': current_conn,
          'available_connections': available_conn,
          'total_capacity': total_capacity,
          'utilization_percent': round(utilization_percent, 2),
          'threshold_percent': util_limit,
          'has_saturation': has_saturation
      }

      with open('mongodb_connections_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - mongodb_connections_report.json

  - id: check_connection_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_mongodb_connections.vars.has_connection_saturation }}"
    then:
      - id: notify_slack_dba
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "MongoDB Connection Saturation Alert: Active connections reached {{ outputs.audit_mongodb_connections.vars.utilization_percent }}% of total cluster capacity (Threshold: {{ inputs.max_connection_utilization_percent_warning }}%).\n• Active Connections: {{ outputs.audit_mongodb_connections.vars.current_connections }} / {{ outputs.audit_mongodb_connections.vars.total_capacity }}\n• Available Slots Remaining: {{ outputs.audit_mongodb_connections.vars.available_connections }}\n• Remediation: Inspect application client connection pool `maxPoolSize` settings and check for dangling unclosed cursors."
          }
    else:
      - id: log_connections_nominal
        type: io.kestra.plugin.core.log.Log
        message: "MongoDB connection capacity is healthy. Utilization is {{ outputs.audit_mongodb_connections.vars.utilization_percent }}% ({{ outputs.audit_mongodb_connections.vars.current_connections }} active of {{ outputs.audit_mongodb_connections.vars.total_capacity }} slots)."

  - id: export_connection_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      active_connections: "{{ outputs.audit_mongodb_connections.vars.current_connections | string }}"
      utilization_ratio: "{{ outputs.audit_mongodb_connections.vars.utilization_percent | string }}"
      capacity_status: "{{ outputs.audit_mongodb_connections.vars.has_connection_saturation ? 'SATURATION_RISK' : 'HEALTHY' }}"

triggers:
  - id: periodic_connection_probe
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"

extend:
  title: MongoDB Connection Spike and Exhaustion Guard
  metaTitle: MongoDB Connection Spike and Exhaustion Guard
  shortDescription: Audits MongoDB replica set active connections against capacity to prevent connection exhaustion.
  metaDescription: Audits MongoDB replica set active connections against configured capacity, alerting DBAs on Slack before connection exhaustion rejects clients.
  description: |
    This blueprint acts as an automated connection capacity guardian for MongoDB database clusters. Scheduled every 10 minutes, it inspects `serverStatus().connections` telemetry, computes active-to-total connection utilization percentages, and alerts database administrators on Slack before connection spikes breach `maxIncomingConnections` ceilings and reject incoming microservice client requests.

    ## How it works

    1. **Recurring 10-Minute Probe**: The `periodic_connection_probe` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires every 10 minutes.
    2. **MongoDB serverStatus Query**: The `audit_mongodb_connections` task (`io.kestra.plugin.scripts.python.Script`) connects to MongoDB via PyMongo, runs the administrative `serverStatus` command, and extracts active and available connection slots.
    3. **Threshold Gate**: The `check_connection_saturation` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether connection utilization reached the warning percentage.
    4. **Slack Alert Dispatch**: When connection saturation is detected, `notify_slack_dba` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an urgent incident card with connection metrics.
    5. **Nominal Confirmation**: When connection capacity remains healthy, `log_connections_nominal` records confirmed status.
    6. **Manifest Export**: The `export_connection_manifest` task tags the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 10 Minutes] --> B[audit_mongodb_connections: MongoDB serverStatus]
        B --> C{Connection Utilization > Threshold?}
        C -- Yes --> D[notify_slack_dba: Slack Webhook]
        C -- No --> E[log_connections_nominal: Log]
        D --> F[export_connection_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Prevent Cascading Client Connection Failures**: Catch connection leaks from microservices that create new client instances per request without reusing pools.
    - **Capacity Planning for Autoscaling Workloads**: Identify when Kubernetes horizontal pod autoscalers deploy excess application replicas that together exceed the database's `net.maxIncomingConnections`.
    - **Detect Dangling Unclosed Cursors**: Spot unclosed cursors that hold open server sockets and pin worker threads in the mongod engine.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `mongodb_connection_uri` | STRING | `mongodb://mongodb-primary.internal:27017` | MongoDB connection string pointing to the primary replica set node. |
    | `max_connection_utilization_percent_warning` | FLOAT | `80.0` | Connection utilization percentage threshold above which a saturation warning is triggered. |
    | `slack_channel` | STRING | `#mongodb-dba-alerts` | Slack channel destination for MongoDB connection capacity alerts. |

    ## Expected outputs

    - `{{ outputs.audit_mongodb_connections.vars.current_connections }}`: Count of active incoming connections.
    - `{{ outputs.audit_mongodb_connections.vars.available_connections }}`: Remaining available connection slots before rejection.
    - `{{ outputs.audit_mongodb_connections.vars.total_capacity }}`: Total configured connection ceiling.
    - `{{ outputs.audit_mongodb_connections.vars.utilization_percent }}`: Percentage of connection capacity consumed.
    - `{{ outputs.audit_mongodb_connections.outputFiles['mongodb_connections_report.json'] }}`: Full JSON connection health report.

    ## Prerequisites

    - MongoDB user credentials with `clusterMonitor` or `read` privileges on the `admin` database.
    - Incoming Webhook URL configured for your database administrator Slack channel.

    ### Secrets

    - `MONGODB_USER`: MongoDB authentication username.
    - `MONGODB_PASSWORD`: MongoDB authentication password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `MONGODB_USER`, `MONGODB_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your MongoDB connection string in `mongodb_connection_uri`.
    4. Click **Execute** in the UI to perform an immediate connection capacity probe.

    ## Common pitfalls and troubleshooting

    - **Connection Ceiling Configuration**: By default, MongoDB sets `net.maxIncomingConnections` to 65,536, but system file descriptor limits (`ulimit -n`) often constrain practical connection capacity much lower (e.g. 1,024 or 4,096); verify operating system file descriptor limits.
    - **Replica Set Routing**: Connection capacity probes should be executed against the active primary where write-heavy client applications maintain pooled connections.

    ## How to extend

    - Query `currentOp()` to identify which client IP addresses and usernames account for the highest share of active connections.
    - Dynamically notify client service teams via email or PagerDuty when connection pools remain above 90% for consecutive intervals.
    - Export connection count histograms to Prometheus or Datadog.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - MongoDB Server Status Connections: https://www.mongodb.com/docs/manual/reference/command/serverStatus/#connections
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
