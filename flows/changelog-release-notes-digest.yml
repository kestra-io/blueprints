id: changelog-release-notes-digest
namespace: company.content

description: |
  Collect GitHub releases, summarize them with Python, and post a digest to Slack.

inputs:
  - id: repo
    type: STRING
    description: GitHub repository in owner/name format
    defaults: kestra-io/kestra
  - id: lookback_days
    type: INT
    description: How many days back to include in the digest
    defaults: 7

triggers:
  - id: weekly_digest
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every Friday at 4 PM UTC
    cron: "0 16 * * 5"
  - id: digest_on_release
    type: io.kestra.plugin.core.trigger.Webhook
    description: Trigger a digest refresh from a GitHub release webhook
    key: "{{ secret('RELEASE_WEBHOOK_KEY') }}"

tasks:
  - id: fetch_releases
    type: io.kestra.plugin.core.http.Request
    description: Fetch recent GitHub releases via the public API
    uri: https://api.github.com/repos/{{ inputs.repo }}/releases
    method: GET
    headers:
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
  - id: build_digest
    type: io.kestra.plugin.scripts.python.Script
    description: Filter releases by lookback window and render a markdown digest
    inputFiles:
      releases.json: "{{ outputs.fetch_releases.body }}"
    script: |
      import json, datetime
      with open("releases.json") as f:
          releases = json.load(f)
      cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days={{ inputs.lookback_days }})
      lines = [f"# Release digest for {{ inputs.repo }}", ""]
      kept = 0
      for r in releases if isinstance(releases, list) else []:
          try:
              dt = datetime.datetime.fromisoformat(r.get("published_at", "").replace("Z", "+00:00"))
          except Exception:
              continue
          if dt >= cutoff:
              kept += 1
              lines += [f"## {r.get('tag_name')} — {r.get('name')}", f"Published: {r.get('published_at')}", (r.get("body") or "")[:800], ""]
      if kept == 0:
          lines.append("No releases in the lookback window.")
      with open("digest.md", "w") as out:
          out.write("\n".join(lines))
      print(f"::{{release_count}}::{kept}")
    outputFiles:
      - digest.md
  - id: publish_fanout
    type: io.kestra.plugin.core.flow.Parallel
    description: Log the digest and verify repo reachability at the same time
    tasks:
      - id: log_digest_path
        type: io.kestra.plugin.core.log.Log
        description: Log where the rendered digest artifact was stored
        message: "Digest written to {{ outputs.build_digest.outputFiles['digest.md'] }}"
      - id: verify_repo_api
        type: io.kestra.plugin.core.http.Request
        description: Confirm the repo API is reachable for audit purposes
        uri: https://api.github.com/repos/{{ inputs.repo }}
        method: GET
        headers:
          Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
  - id: decide_publish
    type: io.kestra.plugin.core.flow.If
    description: Post to Slack only when the lookback window is valid
    condition: "{{ inputs.lookback_days > 0 }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the weekly release-notes digest to Slack
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": ":rocket: Release digest for {{ inputs.repo }} (last {{ inputs.lookback_days }}d): {{ outputs.build_digest.outputFiles['digest.md'] }}"}

extend:
  title: Changelog Release-Notes Digest
  metaTitle: Automate Release-Notes Digests with Kestra
  shortDescription: Build a weekly GitHub release digest and post it to Slack.
  description: |
    Short summary: pulls GitHub releases for a repo on a Friday schedule or release webhook, filters by a lookback window, renders markdown, and posts to Slack.

    Prerequisites:
      - Secrets:
        - GITHUB_TOKEN: GitHub token for API rate limits (required)
        - SLACK_WEBHOOK_URL: Slack incoming webhook for the digest (required)
        - RELEASE_WEBHOOK_KEY: key securing the release webhook trigger (required)
      - Services: GitHub API access, Python runner in Kestra.

    Inputs:
      - repo (STRING, default kestra-io/kestra): owner/name to digest.
      - lookback_days (INT, default 7): window size; allowed values 1-90.

    Outputs:
      - outputs.build_digest.outputFiles['digest.md']: markdown digest of releases in the window.

    Quick start:
      1. Set secrets GITHUB_TOKEN, SLACK_WEBHOOK_URL, and RELEASE_WEBHOOK_KEY.
      2. Upload the flow and set repo to your project.
      3. Enable the Friday schedule; optionally wire a GitHub release webhook to the trigger.

    How to extend:
      - Summarize each release body with an LLM task before posting.
      - Publish digest.md to Notion, Confluence, or email in parallel branches.
      - Filter by prerelease/draft flags or required labels.

    Links:
      - [Slack plugin docs](https://kestra.io/plugins/plugin-slack)
      - [GitHub Releases API](https://docs.github.com/en/rest/releases)
      - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - DevOps
    - Marketing
  ee: false
  demo: false
  metaDescription: Summarize GitHub releases weekly into a Slack digest with Kestra.
