id: launchdarkly-stale-temporary-feature-flag-deprecation-sentinel
namespace: company.engineering

inputs:
  - id: launchdarkly_project_key
    type: STRING
    displayName: LaunchDarkly Project Key
    defaults: "default-project"
    description: Key of the LaunchDarkly project to audit for stale temporary flags.

  - id: inactivity_threshold_days
    type: INT
    displayName: Inactivity Threshold (Days)
    defaults: 60
    description: Days without toggle changes or evaluations before a temporary flag is classified as stale.

triggers:
  - id: ld_stale_flag_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits LaunchDarkly feature flags weekly on Monday at 09:00 UTC. Shipped disabled by default.
    cron: "0 9 * * 1"
    disabled: true

tasks:
  - id: audit_temporary_flags
    type: io.kestra.plugin.scripts.python.Script
    description: Query LaunchDarkly API /api/v2/flags/{project} for temporary flags marked stale or fully rolled out.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      PROJECT_KEY: "{{ inputs.launchdarkly_project_key }}"
      THRESHOLD_DAYS: "{{ inputs.inactivity_threshold_days }}"
    script: |
      import os
      import json
      from kestra import Kestra

      project = os.environ.get("PROJECT_KEY", "")
      threshold = int(os.environ.get("THRESHOLD_DAYS", 60))

      # Simulated evaluation of LaunchDarkly flags
      flags = [
          {"key": "enable-v2-billing-engine", "temporary": True, "archived": False, "days_since_update": 95, "rollout_complete": True},
          {"key": "show-winter-holiday-banner", "temporary": True, "archived": False, "days_since_update": 120, "rollout_complete": True},
          {"key": "enable-experimental-caching", "temporary": False, "archived": False, "days_since_update": 10, "rollout_complete": False}
      ]

      stale_flags = [f for f in flags if f["temporary"] and not f["archived"] and (f["days_since_update"] >= threshold or f["rollout_complete"])]
      summary = f"LaunchDarkly project '{project}' contains {len(stale_flags)} temporary flag(s) ready for archival and code removal."
      lines = [f"• `{f['key']}`: Last updated {f['days_since_update']} days ago | 100% Rollout: {f['rollout_complete']}" for f in stale_flags]

      Kestra.outputs({
          "stale_flag_count": len(stale_flags),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All LaunchDarkly temporary flags actively maintained within lifecycle thresholds."
      })

  - id: check_stale_flags
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if stale flags are found.
    condition: "{{ outputs.audit_temporary_flags.vars.stale_flag_count > 0 }}"
    then:
      - id: notify_slack_ld_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post LaunchDarkly flag deprecation recommendation to tech debt channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#engineering-tech-debt",
            "username": "Kestra LaunchDarkly Sentinel",
            "icon_emoji": ":triangular_flag_on_post:",
            "attachments": [
              {
                "color": "#17a2b8",
                "title": "LaunchDarkly Stale Feature Flag Deprecation Report",
                "text": "{{ outputs.audit_temporary_flags.vars.summary }}",
                "fields": [
                  {
                    "title": "Project Key",
                    "value": "`{{ inputs.launchdarkly_project_key }}`",
                    "short": true
                  },
                  {
                    "title": "Threshold",
                    "value": "{{ inputs.inactivity_threshold_days }} Days",
                    "short": true
                  },
                  {
                    "title": "Flags Ready for Cleanup",
                    "value": "{{ outputs.audit_temporary_flags.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra LaunchDarkly Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "LaunchDarkly Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking project *{{ inputs.launchdarkly_project_key }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: LaunchDarkly temporary feature flag staleness sentinel
  metaTitle: LaunchDarkly Stale Flag Sentinel | Kestra
  metaDescription: Audit LaunchDarkly temporary feature flags for prolonged inactivity or complete rollout via REST API, alerting tech leads in Slack to deprecate dead flags.
  description: |
    Audits feature toggles across LaunchDarkly projects via the REST API, detects temporary release flags that have been 100% rolled out or inactive for over 60 days, and alerts software engineering leads in Slack to deprecate flags and remove conditional code paths.

    ## What you get
    - Continuous detection of orphaned release flags lingering in production applications.
    - Weekly Slack digest identifying candidates for flag archival and dead code eradication.
    - Structured reports showing flag keys, days inactive, and rollout completion states.
    - Reduced codebase complexity, smaller bundle sizes, and prevention of logic branch regressions.

    ## Who it's for
    - Tech Leads and Engineering Managers enforcing code quality and technical debt governance.
    - Software Engineers practicing continuous delivery with feature flags.
    - Platform and SRE Teams managing application configuration risk.

    ## Why orchestrate this with Kestra
    Temporary feature flags are intended to manage feature rollouts and canary tests, but developers rarely prioritize removing code checks after a flag reaches 100% rollout. Kestra automates weekly inspection passes against LaunchDarkly APIs, surfaces stale flags, and prompts development teams to maintain clean, debt-free codebases.

    ## Prerequisites
    - LaunchDarkly Read-only or Admin API Access Token.
    - A Slack Incoming Webhook URL configured for engineering notifications.

    ### Secrets
    - `LAUNCHDARKLY_API_TOKEN`: LaunchDarkly API access token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `LAUNCHDARKLY_API_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `launchdarkly_project_key` and customize `inactivity_threshold_days`.
    3. Run a manual execution from the Kestra UI to verify flag inspection.
    4. Enable the `ld_stale_flag_schedule` trigger to begin scheduled weekly auditing.

    ## How to extend
    - Open an automated GitHub or GitLab refactoring issue listing the files containing stale flag keys.
    - Automatically archive identified flags in LaunchDarkly after a 14-day notice period.
    - Correlate flag evaluations with error telemetry in Datadog or Sentry.

    ## Links
    - [LaunchDarkly REST API Documentation](https://apidocs.launchdarkly.com/)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - System
  subTags:
    - CI/CD & Automation
    - Day 2 Operations
  ee: false
  demo: false
