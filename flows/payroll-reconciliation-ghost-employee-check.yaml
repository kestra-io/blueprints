id: payroll-reconciliation-ghost-employee-check
namespace: company.team

description: |
  Pre-payment payroll control: before the bank file is released, reconcile the payroll
  register to the HR file (joiners, leavers, rate changes), explain the movement in net pay
  against last month employee by employee, check gross-to-net arithmetic, look for ghost
  employees and diverted pay (shared bank accounts, bank details changed just before payday,
  pay after leaving, no time recorded), tie the register to the bank payment file and to the
  payroll journal, and release the payment only when everything is explained.

inputs:
  - id: pay_period
    type: STRING
    displayName: Pay period (YYYY-MM)
    defaults: "2026-09"
    validator: ^\d{4}-(0[1-9]|1[0-2])$

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: >
      CLEAN: a normal month with joiners, leavers, a pay rise and overtime. FRAUD: a ghost
      employee sharing a bank account with a real one, a leaver still paid, and an employee
      whose bank account changed two days before payday. ISSUES: the bank file total differs
      from the register and a payslip does not add up, which must stop the payment.
    values:
      - CLEAN
      - FRAUD
      - ISSUES
    defaults: CLEAN

  - id: variance_threshold_pct
    type: FLOAT
    displayName: Unexplained net pay change (%)
    description: An employee whose net pay moves more than this against last month, without a joiner, leaver, rate change, overtime or bonus to explain it, is flagged.
    defaults: 10.0

  - id: approved_by
    type: STRING
    displayName: Approved by
    description: The payroll manager who releases the bank file after reviewing the flags.
    defaults: ""

variables:
  lock_key: payroll_runs
  pack_dir: "payroll/{{ inputs.pay_period }}"

concurrency:
  limit: 1

tasks:
  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    values:
      released: "{{ (kv(vars.lock_key, errorOnMissing=false) ?? {'released': []}) | jq('.released') | first | toJson }}"

  - id: period_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.state.values.released) contains inputs.pay_period }}"
    then:
      - id: already_released
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The {{ inputs.pay_period }} payroll bank file has already been released."

  - id: reconcile
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: HR master and its change log, time records, this month's and last
      month's payroll registers, the bank payment file and the payroll journal (demo
      generator or your HRIS, payroll and banking exports), the reconciliations and the
      ghost-employee tests.
    outputFiles:
      - movement
      - flags
      - tieout
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE p1 = DATE '{{ inputs.pay_period }}-01';
      SET VARIABLE p0 = (DATE '{{ inputs.pay_period }}-01' - INTERVAL 1 MONTH)::DATE;
      SET VARIABLE p_end = (DATE '{{ inputs.pay_period }}-01' + INTERVAL 1 MONTH - INTERVAL 1 DAY)::DATE;
      SET VARIABLE payday = (DATE '{{ inputs.pay_period }}-01' + INTERVAL 24 DAY)::DATE;

      -- =======================================================================
      -- HR master: one row per employee, with salary, hire and leave dates and
      -- the bank account on file. Replace with your HRIS.
      -- =======================================================================
      CREATE TABLE hr AS
      SELECT 'EMP-' || lpad(i::VARCHAR, 3, '0') AS employee, 'Employee ' || i AS name,
             ['Operations', 'Sales', 'Engineering', 'Finance', 'Warehouse'][1 + i % 5] AS department,
             CASE WHEN i % 5 = 4 THEN 'HOURLY' ELSE 'SALARIED' END AS pay_type,
             round(2600 + (hash(i) % 4200)::INT, -1)::DOUBLE AS monthly_salary, 18.5 + (i % 7) AS hourly_rate,
             CASE WHEN i IN (121, 122) THEN getvariable('p1') + 4 ELSE DATE '2023-01-01' + ((i * 37) % 900)::INT END AS hired_on,
             CASE WHEN i IN (17, 64) THEN getvariable('p1') + 14 WHEN i = 33 THEN getvariable('p0') + 20 ELSE NULL END AS left_on,
             'FR76-3000-' || lpad((10000 + i * 7)::VARCHAR, 8, '0') AS iban
      FROM range(1, 123) t(i);

      -- Change log: rate changes and bank detail changes with their dates.
      CREATE TABLE hr_changes (employee VARCHAR, changed_on DATE, field VARCHAR, old_value VARCHAR, new_value VARCHAR);
      INSERT INTO hr_changes VALUES
        ('EMP-008', getvariable('p1'), 'monthly_salary', '3800', '4180'),
        ('EMP-045', getvariable('p0') + 5, 'iban', 'FR76-3000-00010315', 'FR76-3000-00010315-NEW');
      UPDATE hr SET monthly_salary = 3800 WHERE employee = 'EMP-008';
      {% if inputs.scenario == 'FRAUD' %}
      -- Bank account changed two days before payday, by a user who is not the employee.
      INSERT INTO hr_changes VALUES ('EMP-052', getvariable('payday') - 2, 'iban', 'FR76-3000-00010364', 'LT12-3250-00099812');
      UPDATE hr SET iban = 'LT12-3250-00099812' WHERE employee = 'EMP-052';
      -- A ghost: an employee with no time records, no manager and the same account as a real one.
      INSERT INTO hr VALUES ('EMP-900', 'J. Smith', 'Operations', 'SALARIED', 3900, 0, DATE '2026-02-01', NULL, (SELECT iban FROM hr WHERE employee = 'EMP-011'));
      {% endif %}

      -- Time records for hourly staff, and overtime approvals.
      CREATE TABLE time_records AS
      SELECT employee, month, hours, overtime FROM (
        SELECT h.employee, m.month,
               CASE WHEN h.pay_type = 'HOURLY' THEN 140 + (hash(h.employee || m.month) % 30)::INT ELSE 151.67 END AS hours,
               CASE WHEN h.employee IN ('EMP-019', 'EMP-024') AND m.month = getvariable('p1') THEN 22 ELSE 0 END AS overtime
        FROM hr h, (VALUES (getvariable('p0')), (getvariable('p1'))) m(month)
        WHERE h.hired_on <= m.month + INTERVAL 1 MONTH - INTERVAL 1 DAY AND (h.left_on IS NULL OR h.left_on >= m.month)
          AND h.employee <> 'EMP-900');

      -- =======================================================================
      -- Payroll register. Gross = salary (prorated for joiners and leavers) or
      -- hours x rate, + overtime at 125%, + bonus. Employee deductions 22.5% of
      -- gross, employer charges 42%. Replace with your payroll engine's register.
      -- =======================================================================
      CREATE MACRO gross_for(pay_type, salary, rate, hired_on, left_on, hours, overtime, m) AS
        round(CASE WHEN pay_type = 'HOURLY' THEN hours * rate
                   ELSE salary * (date_diff('day', greatest(hired_on, m), least(coalesce(left_on, (m + INTERVAL 1 MONTH - INTERVAL 1 DAY)::DATE), (m + INTERVAL 1 MONTH - INTERVAL 1 DAY)::DATE)) + 1)
                        / day((m + INTERVAL 1 MONTH - INTERVAL 1 DAY)::DATE) END
              + overtime * rate * 1.25, 2);

      CREATE TABLE register AS
      SELECT r.*, round(r.gross * 0.225, 2) AS deductions, r.gross - round(r.gross * 0.225, 2) AS net, round(r.gross * 0.42, 2) AS employer_charges
      FROM (
        SELECT m.month, h.employee, h.iban,
               gross_for(h.pay_type,
                         CASE WHEN h.employee = 'EMP-008' AND m.month >= getvariable('p1') THEN 4180 ELSE h.monthly_salary END,
                         h.hourly_rate, h.hired_on, h.left_on, coalesce(t.hours, 151.67), coalesce(t.overtime, 0), m.month)
               + CASE WHEN h.employee = 'EMP-070' AND m.month = getvariable('p1') THEN 1500 ELSE 0 END AS gross,
               CASE WHEN h.employee = 'EMP-070' AND m.month = getvariable('p1') THEN 1500 ELSE 0 END AS bonus
        FROM hr h CROSS JOIN (VALUES (getvariable('p0')), (getvariable('p1'))) m(month)
        LEFT JOIN time_records t ON t.employee = h.employee AND t.month = m.month
        WHERE h.hired_on <= m.month + INTERVAL 1 MONTH - INTERVAL 1 DAY AND (h.left_on IS NULL OR h.left_on >= m.month)
      ) r;
      {% if inputs.scenario == 'FRAUD' %}
      -- The leaver of last month is paid again this month.
      INSERT INTO register SELECT getvariable('p1'), employee, iban, gross, bonus, deductions, net, employer_charges FROM register WHERE employee = 'EMP-033' AND month = getvariable('p0');
      {% endif %}
      {% if inputs.scenario == 'ISSUES' %}
      UPDATE register SET net = net + 250 WHERE employee = 'EMP-040' AND month = getvariable('p1');
      {% endif %}

      -- Bank payment file and payroll journal for the month. Replace with your bank file and GL.
      CREATE TABLE bank_file AS SELECT employee, iban, net AS amount FROM register WHERE month = getvariable('p1');
      {% if inputs.scenario == 'ISSUES' %}
      UPDATE bank_file SET amount = amount + 1200 WHERE employee = 'EMP-090';
      {% endif %}
      CREATE TABLE journal AS
      SELECT '6410' AS account, 'Gross salaries' AS name, sum(gross) AS debit, 0.0 AS credit FROM register WHERE month = getvariable('p1')
      UNION ALL SELECT '6450', 'Employer social charges', sum(employer_charges), 0.0 FROM register WHERE month = getvariable('p1')
      UNION ALL SELECT '4310', 'Social charges payable', 0.0, sum(deductions + employer_charges) FROM register WHERE month = getvariable('p1')
      UNION ALL SELECT '4210', 'Net pay payable', 0.0, sum(gross - deductions) FROM register WHERE month = getvariable('p1');

      -- =======================================================================
      -- Blockers: the arithmetic and the tie-outs. Nothing is paid if these fail.
      -- =======================================================================
      CREATE TABLE r1 AS SELECT * FROM register WHERE month = getvariable('p1');
      CREATE TABLE r0 AS SELECT * FROM register WHERE month = getvariable('p0');
      CREATE TABLE blockers AS
      SELECT 'PAYSLIP_DOES_NOT_ADD_UP' AS code, employee AS ref, 'Gross ' || gross || ' - deductions ' || deductions || ' = ' || round(gross - deductions, 2) || ', net ' || net AS detail
        FROM r1 WHERE abs(gross - deductions - net) >= 0.01
      UNION ALL SELECT 'BANK_FILE_DIFFERS', coalesce(b.employee, r.employee), 'Register net ' || coalesce(r.net, 0) || ', bank file ' || coalesce(b.amount, 0)
        FROM r1 r FULL JOIN bank_file b USING (employee) WHERE abs(coalesce(r.net, 0) - coalesce(b.amount, 0)) >= 0.01
      UNION ALL SELECT 'JOURNAL_DOES_NOT_BALANCE', 'journal', 'Debits ' || round(sum(debit), 2) || ', credits ' || round(sum(credit), 2) FROM journal HAVING abs(sum(debit) - sum(credit)) >= 0.01;

      -- =======================================================================
      -- Movement against last month, employee by employee, with its explanation.
      -- =======================================================================
      CREATE TABLE movement AS
      SELECT coalesce(r1.employee, r0.employee) AS employee, coalesce(r0.net, 0) AS net_last, coalesce(r1.net, 0) AS net_this, coalesce(r1.net, 0) - coalesce(r0.net, 0) AS change,
             CASE
               WHEN r0.employee IS NULL AND h.hired_on >= getvariable('p1') THEN 'JOINER'
               WHEN r0.employee IS NULL THEN 'UNEXPLAINED_NEW_PAYEE'
               WHEN r1.employee IS NULL AND h.left_on < getvariable('p1') THEN 'LEAVER'
               WHEN r1.employee IS NULL THEN 'UNEXPLAINED_DROP'
               WHEN h.left_on BETWEEN getvariable('p1') AND getvariable('p_end') THEN 'LEAVER_FINAL_PAY'
               WHEN rc.rate_changed THEN 'RATE_CHANGE'
               WHEN r1.bonus > 0 THEN 'BONUS'
               WHEN ot.overtime > 0 THEN 'OVERTIME'
               WHEN h.pay_type = 'HOURLY' THEN 'HOURS'
               WHEN abs(coalesce(r1.net, 0) - coalesce(r0.net, 0)) < 0.01 THEN 'NO_CHANGE'
               WHEN abs(coalesce(r1.net, 0) / nullif(r0.net, 0) - 1) * 100 <= {{ inputs.variance_threshold_pct }} THEN 'WITHIN_THRESHOLD'
               ELSE 'UNEXPLAINED_CHANGE' END AS explanation
      FROM r1 FULL JOIN r0 USING (employee) LEFT JOIN hr h ON h.employee = coalesce(r1.employee, r0.employee)
      LEFT JOIN (SELECT DISTINCT employee, true AS rate_changed FROM hr_changes WHERE field = 'monthly_salary' AND changed_on BETWEEN getvariable('p1') AND getvariable('p_end')) rc ON rc.employee = h.employee
      LEFT JOIN (SELECT employee, overtime FROM time_records WHERE month = getvariable('p1')) ot ON ot.employee = h.employee;

      -- =======================================================================
      -- Ghost employees and diverted pay.
      -- =======================================================================
      CREATE TABLE flags AS
      SELECT 'SHARED_BANK_ACCOUNT' AS flag, string_agg(employee, ', ' ORDER BY employee) AS employees, 'Account ' || iban || ' receives pay for ' || count(*) || ' employees' AS detail,
             sum(net) AS amount_at_risk
        FROM r1 GROUP BY iban HAVING count(*) > 1
      UNION ALL
      SELECT 'PAID_AFTER_LEAVING', r.employee, 'Left on ' || h.left_on || ', paid ' || r.net || ' for ' || strftime(getvariable('p1'), '%Y-%m'), r.net
        FROM r1 r JOIN hr h USING (employee) WHERE h.left_on < getvariable('p1')
      UNION ALL
      SELECT 'BANK_CHANGED_BEFORE_PAYDAY', c.employee, 'Bank account changed on ' || c.changed_on || ' to ' || c.new_value || ', ' || date_diff('day', c.changed_on, getvariable('payday')) || ' days before payday', r.net
        FROM hr_changes c JOIN r1 r USING (employee) WHERE c.field = 'iban' AND date_diff('day', c.changed_on, getvariable('payday')) BETWEEN 0 AND 10
      UNION ALL
      SELECT 'NO_TIME_RECORDED', r.employee, 'Paid ' || r.net || ' with no time record for the month', r.net
        FROM r1 r WHERE NOT EXISTS (SELECT 1 FROM time_records t WHERE t.employee = r.employee AND t.month = getvariable('p1'))
      UNION ALL
      SELECT 'NOT_IN_HR', r.employee, 'Paid but not in the HR master', r.net FROM r1 r WHERE r.employee NOT IN (SELECT employee FROM hr)
      UNION ALL
      SELECT 'UNEXPLAINED_CHANGE', m.employee, 'Net pay ' || m.net_last || ' -> ' || m.net_this || ' with no joiner, leaver, rate change, overtime or bonus', m.net_this
        FROM movement m WHERE m.explanation IN ('UNEXPLAINED_CHANGE', 'UNEXPLAINED_NEW_PAYEE', 'UNEXPLAINED_DROP');

      CREATE TABLE tieout AS
      SELECT 'Net pay, register' AS item, round(sum(net), 2) AS amount FROM r1
      UNION ALL SELECT 'Net pay, bank file', round(sum(amount), 2) FROM bank_file
      UNION ALL SELECT 'Net pay payable, journal (4210)', round(sum(credit), 2) FROM journal WHERE account = '4210'
      UNION ALL SELECT 'Gross, register', round(sum(gross), 2) FROM r1
      UNION ALL SELECT 'Gross, journal (6410)', round(sum(debit), 2) FROM journal WHERE account = '6410'
      UNION ALL SELECT 'Net pay, last month', round(sum(net), 2) FROM r0
      UNION ALL SELECT 'Movement explained by employee', round(sum(change), 2) FROM movement;

      COPY (SELECT employee, round(net_last, 2) AS net_last, round(net_this, 2) AS net_this, round(change, 2) AS change, explanation FROM movement ORDER BY abs(change) DESC) TO '{{ outputFiles.movement }}' (HEADER, DELIMITER ',');
      COPY (SELECT flag, employees, detail, round(amount_at_risk, 2) AS amount_at_risk FROM flags ORDER BY amount_at_risk DESC) TO '{{ outputFiles.flags }}' (HEADER, DELIMITER ',');
      COPY tieout TO '{{ outputFiles.tieout }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM r1)::INT AS payees, (SELECT round(sum(gross), 2) FROM r1)::DOUBLE AS gross, (SELECT round(sum(net), 2) FROM r1)::DOUBLE AS net,
        (SELECT round(sum(net), 2) FROM r0)::DOUBLE AS net_last,
        (SELECT string_agg(explanation || ' ' || n || ' (' || format('{:,.0f}', c) || ')', ', ' ORDER BY abs(c) DESC) FROM (SELECT explanation, count(*) AS n, sum(change)::DOUBLE AS c FROM movement WHERE explanation NOT IN ('NO_CHANGE') GROUP BY explanation)) AS movement_detail,
        (SELECT count(*) FROM flags)::INT AS flags,
        (SELECT coalesce(string_agg(flag || ' ' || employees || ': ' || detail, '; ' ORDER BY amount_at_risk DESC), '') FROM flags) AS flag_detail,
        (SELECT round(coalesce(sum(amount_at_risk), 0), 2) FROM flags)::DOUBLE AS amount_at_risk,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.reconcile.outputs | last).row | toJson }}"

  - id: log_check
    type: io.kestra.plugin.core.log.Log
    message: |
      Payroll {{ inputs.pay_period }} ({{ inputs.scenario }}).
      {{ outputs.result.values.r | jq('"\(.payees) payees, gross \(.gross), net \(.net) (last month \(.net_last)). Movement: \(.movement_detail)."') | first }}
      {{ outputs.result.values.r | jq('"Flags: \(.flags), at risk \(.amount_at_risk). \(.flag_detail)"') | first }}
      {{ outputs.result.values.r | jq('"Blockers: \(.blockers). \(.blocker_detail)"') | first }}

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/net-pay-movement.csv": "{{ outputs.reconcile.outputFiles.movement }}"
      "{{ render(vars.pack_dir) }}/flags.csv": "{{ outputs.reconcile.outputFiles.flags }}"
      "{{ render(vars.pack_dir) }}/tie-out.csv": "{{ outputs.reconcile.outputFiles.tieout }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.reconcile.outputFiles.blockers }}"

  - id: decide
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {%- set r = outputs.result.values.r -%}
      {%- if (r | jq('.blockers > 0') | first) -%}BLOCKED
      {%- elseif (r | jq('.flags > 0') | first) -%}HOLD
      {%- elseif inputs.approved_by == '' -%}NEEDS_RELEASE
      {%- else -%}RELEASE{%- endif -%}
    cases:
      RELEASE:
        - id: lock_period
          type: io.kestra.plugin.core.kv.Set
          key: "{{ vars.lock_key }}"
          kvType: JSON
          value: >-
            {{ {'old': (kv(vars.lock_key, errorOnMissing=false) ?? {'released': [], 'runs': {}}), 'p': inputs.pay_period, 'r': fromJson(outputs.result.values.r), 'by': inputs.approved_by}
               | jq('{released: (.old.released + [.p]), runs: (.old.runs + {(.p): {net: .r.net, payees: .r.payees, released_by: .by}})}') | first | toJson }}

        - id: log_released
          type: io.kestra.plugin.core.log.Log
          message: "Bank file for {{ inputs.pay_period }} released by {{ inputs.approved_by }}: {{ outputs.result.values.r | jq('.payees') | first }} payments, {{ outputs.result.values.r | jq('.net') | first }}."

      NEEDS_RELEASE:
        - id: release_required
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "Payroll {{ inputs.pay_period }} reconciles with no flags. Net {{ outputs.result.values.r | jq('.net') | first }}. Run again with approved_by to release the bank file."

      HOLD:
        - id: hold
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            Bank file held: {{ outputs.result.values.r | jq('.flags') | first }} flag(s), {{ outputs.result.values.r | jq('.amount_at_risk') | first }} at risk.
            {{ outputs.result.values.r | jq('.flag_detail') | first }}. Investigate, correct the register, and run again.

    defaults:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Payroll {{ inputs.pay_period }} does not reconcile: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

extend:
  title: Reconcile payroll and check for ghost employees before releasing the bank file
  metaTitle: Payroll reconciliation and ghost employee check before payment with Kestra
  shortDescription: Explain every change in net pay against last month, check payslip arithmetic, look for ghost employees and diverted pay, tie the register to the bank file and journal, then release.
  metaDescription: Pre-payment payroll control in Kestra and DuckDB. Net pay movement, ghost employees, bank detail changes, bank file and journal tie-out.
  description: |
    Payroll is usually the largest cash payment a company makes every month, and the one most exposed to two quiet failures:
    - **errors**: a leaver still paid, a payslip that doesn't add up, a bank file that differs from the register;
    - **fraud**: a ghost employee, or a real employee's bank details swapped just before payday.

    This flow runs as the last control before the bank file goes out. It explains the month employee by employee and holds the payment while anything is unexplained.

    It runs with no setup and no network. DuckDB generates 122 employees, salaried and hourly, and two pay months. The month includes two joiners, two mid-month leavers and last month's leaver, a pay rise, overtime for two hourly staff, and a bonus. The `FRAUD` scenario adds:
    - a ghost employee sharing a real employee's bank account,
    - a leaver paid again,
    - a bank account changed to a foreign IBAN two days before payday.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## What is checked

    | Check | Effect |
    |---|---|
    | Gross - deductions = net on every payslip | Blocks |
    | Register net = bank file amount, employee by employee | Blocks |
    | Payroll journal balances | Blocks |
    | Each employee's change in net pay is explained: joiner, leaver, final pay, rate change (from the HR change log), bonus, overtime, hours, or within `variance_threshold_pct` | Unexplained changes are flagged |
    | Shared bank account across employees | Flag |
    | Paid after the leave date | Flag |
    | Bank account changed within 10 days of payday | Flag |
    | Paid with no time record for the month | Flag |
    | Paid but not in the HR master | Flag |

    Blockers stop the run. Flags hold the bank file until they are resolved. A clean month still needs `approved_by` to release, and a released month cannot be released again.

    ## How it works

    1. `state` and `period_gate` refuse a month already released.
    2. `reconcile` (`io.kestra.plugin.jdbc.duckdb.Queries`):
       - builds the HR master, the change log, time records, both registers, the bank file and the journal;
       - runs the blockers and the movement analysis, the ghost-employee tests and the tie-out.
    3. `log_check` prints the result. `evidence` stores `net-pay-movement.csv` (every employee with last month, this month and the explanation), `flags.csv`, `tie-out.csv` and `blockers.csv`.
    4. `decide` (`io.kestra.plugin.core.flow.Switch`):
       - `RELEASE` records the release.
       - Otherwise the run fails: `BLOCKED`, `HOLD` (flags) or `NEEDS_RELEASE`.

    ## Tested end to end

    On Kestra 2.0.3 OSS.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2026-09 `CLEAN` | 121 payees, net 413,978.50 against 410,467.28. Every change explained: 2 joiners (+6,703), last month's leaver (-3,145), 2 final pays (-2,639), a bonus (+1,162), overtime (+1,103), a rate change (+294), hours (+32). No flags: waits for release |
    | 2 | `FRAUD` | Held, 5 flags, 21,681 at risk: the ghost EMP-900 shares EMP-011's account and has no time record; EMP-052's account changed 2 days before payday; EMP-033 paid after leaving on 2026-08-21 |
    | 3 | `ISSUES` | Blocked: EMP-040's payslip is 250.00 off; the bank file pays EMP-090 1,200.00 more than the register |
    | 4 | `CLEAN`, `approved_by` | Released |
    | 5 | again | Refused: already released |

    The employee movements in run 1 add up to the total change in net pay (3,511.22).

    ## Problems found while testing

    - **DuckDB refuses correlated subqueries inside a full outer join.** The movement analysis first looked up rate changes and overtime per employee with subqueries. These are now joined in beforehand.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `pay_period` | `2026-09` | `YYYY-MM`, validated |
    | `scenario` | `CLEAN` | `CLEAN`, `FRAUD` or `ISSUES` |
    | `variance_threshold_pct` | `10.0` | Unexplained change threshold |
    | `approved_by` | empty | The payroll manager |

    ## Use it with your data

    - Replace `hr`, `hr_changes` and `time_records` with your HRIS and time system, `register` with your payroll engine's register for this and last month, and `bank_file` and `journal` with the payment file and the payroll journal.
    - After release, send the bank file from a task gated on `RELEASE`.

    ## Things to know

    - Statutory rates are simplified to two percentages. The checks use the register's own deductions, so real tax and social rules work unchanged.
    - Who changed a bank detail matters as much as when. Add the user to `hr_changes` and flag self-service changes made outside office hours.

    ## Links

    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb
  tags:
    - Business
    - Data
  subTags:
    - Policy & Compliance
    - Approval Gates
  ee: false
  demo: true
