id: email-inbound-sender-domain-compliance-gate
namespace: company.team
description: |
  Listen to a shared mailbox in real time, classify every incoming
  email's sender domain against an allowlist, log clean passes from
  trusted domains, and alert Slack the moment an email arrives from a
  domain outside the allowlist - a lookalike vendor domain, a spoofed
  partner address, or simply an unexpected sender nobody approved.

variables:
  imap_host: "localhost"
  imap_port: 3993
  imap_ssl: true
  imap_folder: "INBOX"

inputs:
  - id: allowed_sender_domains
    type: STRING
    displayName: "Allowed Sender Domains"
    defaults: "REPLACE-WITH-YOUR-TRUSTED-DOMAIN.com"
    description: "Comma-separated list of sender domains this mailbox is allowed to receive mail from without triggering an alert. Must be replaced with your own trusted domain list - there is no safe universal default."

triggers:
  - id: inbound_email_received
    type: io.kestra.plugin.email.RealTimeTrigger
    description: "One execution per email arriving in the monitored folder. IMAP IDLE opens the folder READ_ONLY (verified from the trigger's own source: Imapfolder.open(Folder.READ_ONLY)) - it never marks a message as read, moves it, or deletes it, so this gate cannot itself cause a legitimate email to disappear. Shipped disabled; set the mail variables and secrets first, and point them at a real or local test mailbox before enabling."
    disabled: true
    protocol: IMAP
    host: "{{ vars.imap_host }}"
    port: "{{ vars.imap_port }}"
    ssl: "{{ vars.imap_ssl }}"
    username: "{{ secret('MAILBOX_USERNAME') }}"
    password: "{{ secret('MAILBOX_PASSWORD') }}"
    folder: "{{ vars.imap_folder }}"

tasks:
  - id: extract_sender_domain
    type: io.kestra.plugin.core.debug.Return
    description: "Extracts the domain from trigger.from (verified output field from the trigger's own MailService.EmailData model, the address from the From header). This is a best-effort parse of a free-text mail header - it strips a trailing '>' from a bracketed address like 'Name <user@domain.com>' and lowercases the result, but does not handle every possible header encoding edge case."
    format: "{{ (trigger.from | split('@') | last | split('>') | first | trim | lower) }}"

  - id: evaluate_sender_compliance
    type: io.kestra.plugin.core.flow.If
    description: "UNAUTHORIZED_SENDER_DOMAIN_DETECTED whenever the extracted domain is not present in allowed_sender_domains. Checked on every single email, since this mailbox has no separate 'list messages' probe to poll on a schedule - each real-time trigger firing is itself the one and only inspection opportunity for that email."
    condition: "{{ outputs.extract_sender_domain.value in (inputs.allowed_sender_domains | split(',')) }}"
    then:
      - id: log_sender_compliant
        type: io.kestra.plugin.core.log.Log
        message: "HEALTHY: email from {{ trigger.from }} (domain {{ outputs.extract_sender_domain.value }}) is on the allowed sender domain list. Subject: {{ trigger.subject }}."
    else:
      - id: alert_unauthorized_sender
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Always alert on UNAUTHORIZED_SENDER_DOMAIN_DETECTED so a reviewer sees the exact sender, subject, and domain without opening the mailbox."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {
            "text": "Inbound email compliance gate: UNAUTHORIZED_SENDER_DOMAIN_DETECTED. From: " ~ trigger.from ~ " (domain " ~ outputs.extract_sender_domain.value ~ ", not on the allowed list). Subject: " ~ trigger.subject ~ ". Message ID: " ~ (trigger.messageId ?? "none") ~ ". Execution " ~ execution.id ~ "."
          } | toJson }}

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: "Final status line for every run, independent of which branch fired."
    message: "Sender domain audit complete. from={{ trigger.from }} domain={{ outputs.extract_sender_domain.value }} subject={{ trigger.subject }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert when the flow itself fails outside the handled HEALTHY/UNAUTHORIZED_SENDER_DOMAIN_DETECTED branches, for example a malformed From header the extraction logic cannot parse."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {
        "text": "Inbound email compliance gate FAILED in execution " ~ execution.id ~ ". Sender domain extraction or classification did not complete; investigate the raw From header before trusting the last known compliance status."
      } | toJson }}

extend:
  title: "Inbound Email Sender Domain Compliance Gate"
  metaTitle: "Inbound Email Sender Domain Compliance Gate with Kestra"
  shortDescription: "Listen to a shared mailbox in real time and alert Slack the moment an email arrives from a sender domain outside an approved allowlist."
  metaDescription: "Monitor a shared mailbox for emails from unauthorized sender domains and alert Slack before a spoofed or unapproved sender goes unnoticed."
  description: |
    A shared mailbox - a support alias, a partner-intake address, a
    vendor-facing inbox - has no built-in way to flag mail from a domain
    nobody approved: a spoofed lookalike of a real partner, or simply an
    unexpected sender slipping past manual review. This blueprint listens
    to the mailbox in real time and alerts Slack the instant an email
    arrives from a domain outside a configured allowlist, without ever
    marking the message as read or touching the mailbox otherwise.

    ## How it works

    1. `inbound_email_received` (`io.kestra.plugin.email.RealTimeTrigger`) opens the configured IMAP folder read-only and starts one execution per arriving email, using IMAP IDLE for push-style delivery. Shipped disabled; point `vars.imap_host`/`imap_port`/`imap_ssl`/`imap_folder` at a real or local test mailbox and verify a manual trigger of the flow first.
    2. `extract_sender_domain` (`io.kestra.plugin.core.debug.Return`) pulls the domain out of `trigger.from`.
    3. `evaluate_sender_compliance` (`io.kestra.plugin.core.flow.If`) branches on whether that domain is present in `allowed_sender_domains`.
       - `then` (HEALTHY): `log_sender_compliant` records the pass.
       - `else` (UNAUTHORIZED_SENDER_DOMAIN_DETECTED): `alert_unauthorized_sender` reports the sender, subject, and domain to Slack.
    4. `log_audit_complete` always runs last, printing the sender, domain, and subject regardless of which branch fired.
    5. The `errors` block alerts Slack separately if the flow itself fails outright - for example a From header the extraction logic cannot parse.

    ## What you get

    - A real-time, non-destructive compliance gate on inbound mail, built on IMAP IDLE push delivery rather than a polling probe - verified from the trigger's own source to open the folder `READ_ONLY`, so this gate can never itself mark a message read, move it, or delete it.
    - The exact sender address, subject, and domain surfaced in the Slack alert itself, so a reviewer can act without opening the mailbox.
    - A worked example of `io.kestra.plugin.email.RealTimeTrigger` - a capability added to this plugin on October 1, 2026 - used for a security/governance compliance gate, with no prior blueprint coverage of this specific trigger for this purpose in this repository (one existing blueprint uses the same trigger for AI-driven sponsorship-email business triage, a different use case entirely).

    ## Who it's for

    - Security and operations teams who own a shared mailbox and want automatic flagging of mail from domains nobody approved, instead of relying on every reviewer to notice a lookalike domain by eye.
    - Teams receiving partner, vendor, or customer intake email who want a lightweight allowlist gate without standing up a full email security gateway.
    - Anyone evaluating the email plugin who wants a worked example of its newest real-time IMAP trigger used for governance monitoring.

    ## Why orchestrate this with Kestra

    IMAP itself has no allowlist or domain-governance primitive - a mail server either accepts a message or it doesn't, with no per-domain policy hook exposed to a downstream workflow. Kestra supplies the real-time trigger, the HEALTHY/UNAUTHORIZED_SENDER_DOMAIN_DETECTED classification as a first-class branch, and an execution history showing exactly which emails were flagged and when.

    ## Prerequisites

    - An IMAP-accessible mailbox (a real one, or a local test server such as [GreenMail](https://greenmail-mail-test.github.io/greenmail/), whose official open-source Docker image exposes IMAP on port 3143 and IMAPS on port 3993 - update `vars.imap_host`/`imap_port`/`imap_ssl` accordingly).
    - Mailbox credentials with read access to the monitored folder.
    - A Slack incoming webhook for alerts.

    Local testing: GreenMail's Docker image requires no account or license and is built specifically for this kind of integration testing, satisfying this blueprint's testability without any paid or enterprise-only service.

    ### Secrets

    - `MAILBOX_USERNAME` / `MAILBOX_PASSWORD`: credentials for `io.kestra.plugin.email.RealTimeTrigger`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_unauthorized_sender` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded - for example `SECRET_MAILBOX_PASSWORD=$(echo -n '<your-password>' | base64)` - and read back in flows with `{{ secret('NAME') }}`.

    ### Inputs

    - `allowed_sender_domains` (STRING, must be replaced): comma-separated list of trusted sender domains.

    ### Variables

    - `imap_host` / `imap_port` / `imap_ssl` / `imap_folder`: IMAP connection details fed to the trigger, defaulted to GreenMail's local Docker IMAPS port for easy local testing.

    ### Outputs

    - `trigger.from` / `.subject` / `.to` / `.cc` / `.bcc` / `.date` / `.body` / `.messageId` / `.attachments`: every field verified from the trigger's own `MailService.EmailData` output model.
    - `outputs.extract_sender_domain.value` (String): the parsed sender domain used for classification.

    ## Quick start

    1. Run GreenMail locally (`docker run -p 3993:3993 -p 3143:3143 greenmail/standalone:latest` or the project's own documented Docker command) or point this at a real mailbox.
    2. Add the `MAILBOX_USERNAME`, `MAILBOX_PASSWORD`, and `SLACK_WEBHOOK_URL` secrets, and set `allowed_sender_domains`.
    3. Enable the flow and send a test email from an allowed domain; confirm `log_sender_compliant` fires.
    4. Send a test email from a domain not on the allowlist; confirm `alert_unauthorized_sender` fires with the correct sender, subject, and domain.
    5. Point this at a real production mailbox's IMAP settings once you trust the check.

    ## How to extend

    - Add a second classification layer checking `trigger.subject` or `trigger.body` against a list of known phishing/scam keyword patterns, alongside the domain check this blueprint already performs.
    - Cross-reference `trigger.attachments` against an allowed file-extension list, flagging executable or script attachments from any sender, not just unauthorized domains.
    - Add a remediation branch that moves a flagged email to a quarantine folder via a separate IMAP client call, behind an explicit approval gate - deliberately kept out of this gate so the monitoring path never moves or deletes mail on its own.

    ## Pitfalls

    - **Sender domain extraction is a best-effort parse of a free-text header**, not a validated email-address parser - verified from the trigger's own `from` field being a raw string from the From header. Internationalized domains, unusual quoting, or multiple addresses in one From header can produce an unexpected result; this blueprint does not use a full RFC 5322 address parser.
    - **IMAP IDLE requires a server that supports the IDLE extension** - most modern IMAP servers do, including GreenMail, but a server that only supports POP3 or lacks IDLE falls back to interval polling per the trigger's own documented behavior, which is slower to react.
    - **This gate only sees mail arriving after it is enabled** - it cannot retroactively classify messages already sitting in the folder before the trigger started listening.
    - **This blueprint is UNTESTED against a live mailbox or Kestra engine.** The trigger's `READ_ONLY` folder behavior and the `EmailData` output fields are taken verbatim from the plugin's own source - but no Kestra engine was run to execute this flow end to end.

    ## Links

    - [Kestra email plugin documentation](https://kestra.io/plugins/plugin-email)
    - [GreenMail open-source mail test server](https://greenmail-mail-test.github.io/greenmail/)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
