# SPDX-License-Identifier: Apache-2.0
id: mongodb-stale-distributed-lock-release-guard
namespace: company.team
description: Release abandoned application leases without deleting their fencing generation or overriding a renewed heartbeat.

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: mongodb_uri
    type: SECRET
    defaults: "{{ secret('MONGODB_URI') }}"
    description: Use primary reads and bounded connection, selection and socket timeouts in this URI.
  - id: database
    type: STRING
    defaults: appdata
  - id: collection
    type: STRING
    defaults: resource_leases
  - id: service
    type: STRING
    defaults: batch-worker
    description: Exact service identifier, never a regular expression.
  - id: stale_after_seconds
    type: INT
    defaults: 3600
    min: 60
    max: 604800
  - id: max_releases
    type: INT
    defaults: 10
    min: 1
    max: 25
  - id: dry_run
    type: BOOL
    defaults: true
  - id: auto_remediate
    type: BOOL
    defaults: false

variables:
  literal_service: "{{ inputs.service | toJson | replace({'{': '\\u007b', '}': '\\u007d'}) }}"
  literal_id: "{{ fromJson(item.value)._id | toJson | replace({'{': '\\u007b', '}': '\\u007d'}) }}"
  literal_token: "{{ fromJson(item.value).ownerToken | toJson | replace({'{': '\\u007b', '}': '\\u007d'}) }}"
  cutoff: >-
    {{ execution.startDate | dateAdd(-1 * inputs.stale_after_seconds, 'SECONDS') | date("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", timeZone="UTC") }}
  eligible: >-
    {"contract":{"$eq":"heartbeat-fence-v1"},"service":{"$eq":{{ render(vars.literal_service) }}},"lockState":{"$eq":"held"},"heartbeatAt":{"$type":"date","$lt":{"$date":{{ render(vars.cutoff) | toJson }}}},"fence":{"$type":"long","$gte":0,"$lte":9007199254740990},"$expr":{"$and":[{"$eq":[{"$type":"$contract"},"string"]},{"$eq":[{"$type":"$service"},"string"]},{"$eq":[{"$type":"$lockState"},"string"]},{"$eq":[{"$type":"$heartbeatAt"},"date"]},{"$eq":[{"$type":"$fence"},"long"]},{"$eq":[{"$type":"$_id"},"string"]},{"$eq":[{"$type":"$ownerToken"},"string"]},{"$gte":[{"$strLenBytes":{"$cond":[{"$eq":[{"$type":"$_id"},"string"]},"$_id",""]}},1]},{"$lte":[{"$strLenBytes":{"$cond":[{"$eq":[{"$type":"$_id"},"string"]},"$_id",""]}},256]},{"$gte":[{"$strLenBytes":{"$cond":[{"$eq":[{"$type":"$ownerToken"},"string"]},"$ownerToken",""]}},1]},{"$lte":[{"$strLenBytes":{"$cond":[{"$eq":[{"$type":"$ownerToken"},"string"]},"$ownerToken",""]}},256]}]}}
  observed: >-
    {"$and":[{{ render(vars.eligible) }},{"_id":{"$eq":{{ render(vars.literal_id) }}},"ownerToken":{"$eq":{{ render(vars.literal_token) }}},"heartbeatAt":{"$eq":{"$date":{{ fromJson(item.value).heartbeatAt | toJson }}}},"fence":{"$eq":{"$numberLong":{{ (fromJson(item.value).fence ~ '') | toJson }}}}}]}

tasks:
  - id: validate_scope
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ inputs.database | length > 0 and inputs.database | length <= 64 }}"
      - "{{ inputs.collection | length > 0 and inputs.collection | length <= 120 }}"
      - "{{ inputs.database | replace({'[A-Za-z0-9_-]': ''}, regexp=true) | length == 0 }}"
      - "{{ inputs.collection | replace({'[A-Za-z0-9_-]': ''}, regexp=true) | length == 0 }}"
      - "{{ inputs.service | length > 0 and inputs.service | length <= 128 }}"
      - "{{ inputs.stale_after_seconds >= 60 and inputs.stale_after_seconds <= 604800 }}"
      - "{{ inputs.max_releases >= 1 and inputs.max_releases <= 25 }}"
    errorMessage: Invalid scope or bounds. No MongoDB operation was attempted.

  - id: find_abandoned
    type: io.kestra.plugin.mongodb.Find
    timeout: PT30S
    connection:
      uri: "{{ inputs.mongodb_uri }}"
    database: "{{ inputs.database }}"
    collection: "{{ inputs.collection }}"
    filter: "{{ render(vars.eligible) }}"
    projection:
      _id: 1
      ownerToken: 1
      heartbeatAt: 1
      fence: 1
    sort:
      heartbeatAt: 1
      _id: 1
    limit: "{{ inputs.max_releases }}"
    store: false

  - id: findings
    type: io.kestra.plugin.core.log.Log
    message: >-
      Stale lease candidates={{ outputs.find_abandoned.size }};
      cutoff={{ render(vars.cutoff) }}; page_limit={{ inputs.max_releases }}.
      A full page may leave more candidates. A stale heartbeat is not proof of worker death.

  - id: candidates
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.find_abandoned.size > 0 }}"
    then:
      - id: notify_candidates
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {{ {'text': 'MongoDB lease recovery: ' ~ outputs.find_abandoned.size ~ ' stale candidates. Review execution ' ~ execution.id ~ ' and confirm worker termination or enforced fencing before approval.'} | toJson }}

      - id: write_mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approve_release
            type: io.kestra.plugin.core.flow.Pause
            description: Confirm the old holders cannot perform unfenced work. Resuming alone does not approve release.
            pauseDuration: PT1H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false

          - id: explicit_approval
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approve_release.onResume.approved ?? false }}"
            then:
              - id: release_candidates
                type: io.kestra.plugin.core.flow.Loop
                values: "{{ outputs.find_abandoned.rows }}"
                concurrencyLimit: 1
                tasks:
                  - id: reread_holder
                    type: io.kestra.plugin.mongodb.Find
                    timeout: PT30S
                    connection:
                      uri: "{{ inputs.mongodb_uri }}"
                    database: "{{ inputs.database }}"
                    collection: "{{ inputs.collection }}"
                    filter: "{{ render(vars.observed) }}"
                    projection:
                      _id: 1
                    limit: 1
                    store: false

                  - id: unchanged_holder
                    type: io.kestra.plugin.core.execution.Assert
                    conditions:
                      - "{{ outputs.reread_holder.size == 1 }}"
                    errorMessage: Lease changed or disappeared after approval. Reconcile actual state before a new run.

                  - id: release_with_fence
                    type: io.kestra.plugin.mongodb.Update
                    description: The atomic predicate rejects any intervening heartbeat or owner/generation change. The persistent generation never resets.
                    timeout: PT30S
                    connection:
                      uri: "{{ inputs.mongodb_uri }}"
                    database: "{{ inputs.database }}"
                    collection: "{{ inputs.collection }}"
                    operation: UPDATE_ONE
                    filter: "{{ render(vars.observed) }}"
                    document: '{"$set":{"lockState":"free"},"$inc":{"fence":{"$numberLong":"1"}},"$currentDate":{"releasedAt":true}}'

                  - id: acknowledged_release
                    type: io.kestra.plugin.core.execution.Assert
                    conditions:
                      - "{{ outputs.release_with_fence.wasAcknowledged and outputs.release_with_fence.matchedCount == 1 and outputs.release_with_fence.modifiedCount == 1 }}"
                    errorMessage: Conditional release did not modify exactly one lease. Do not retry from this snapshot.

                  - id: verify_free_generation
                    type: io.kestra.plugin.mongodb.Find
                    timeout: PT30S
                    connection:
                      uri: "{{ inputs.mongodb_uri }}"
                    database: "{{ inputs.database }}"
                    collection: "{{ inputs.collection }}"
                    filter: >-
                      {"_id":{"$eq":{{ render(vars.literal_id) }}},"lockState":{"$eq":"free"},"ownerToken":{"$eq":{{ render(vars.literal_token) }}},"heartbeatAt":{"$eq":{"$date":{{ fromJson(item.value).heartbeatAt | toJson }}}},"fence":{"$eq":{"$numberLong":{{ ((fromJson(item.value).fence + 1) ~ '') | toJson }}}},"releasedAt":{"$type":"date"}}
                    projection:
                      _id: 1
                    limit: 1
                    store: false

                  - id: recovered
                    type: io.kestra.plugin.core.execution.Assert
                    conditions:
                      - "{{ outputs.verify_free_generation.size == 1 }}"
                    errorMessage: Free lease with advanced generation was not observed. Another acquisition or an ineffective release requires reconciliation.

              - id: bounded_recovery
                type: io.kestra.plugin.core.log.Log
                message: Verified {{ outputs.find_abandoned.size }} free lease documents with advanced generations. Application progress must be checked by the worker owner.
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: Approval declined or omitted. Lease documents were not changed.
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: Safe mode. No lease release was attempted.
    else:
      - id: no_candidates
        type: io.kestra.plugin.core.log.Log
        message: No supported stale held lease matched this service. Unsupported documents require separate investigation.

errors:
  - id: notify_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {'text': 'MongoDB lease recovery failed in execution ' ~ execution.id ~ '. Reconcile actual holders and generations before retrying. Earlier releases may have completed.'} | toJson }}

triggers:
  - id: inspect_leases
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: Recover abandoned MongoDB leases without resetting their fence
  metaTitle: Recover stale MongoDB application leases with Kestra
  shortDescription: Release stale heartbeat leases after approval using an atomic owner and generation predicate, then verify the persistent fence advanced.
  metaDescription: Recover stale MongoDB leases after approval. Protect renewed heartbeats and retain the fencing generation with a conditional update and checked recovery.
  description: |
    ## Safety

    This flow operates application leases, not MongoDB internal locks. A stale heartbeat does not prove death. Confirm terminated holders or enforced application fencing before approving.

    | Guard | What it stops |
    | --- | --- |
    | Heartbeat cutoff | Releasing a fresh lease |
    | Atomic tuple predicate | Overriding a renewal or replacement |
    | Permanent generation | Resetting fencing history |
    | Page and safe inputs | Unapproved bulk release |

    ## How it works

    1. MongoDB `Find` selects held leases before a fixed cutoff, projecting identity, token, heartbeat and generation.
    2. A nonempty page posts to Slack. Write mode needs both safe inputs and explicit BOOL approval at `approve_release`.
    3. A sequential Loop re-finds each tuple. MongoDB `Update` repeats its predicate atomically, sets free state and increments fence.
    4. `verify_free_generation` reads the expected free identity and fence. Assertions fail on changed plans, refused writes or unobserved recovery. Errors notify Slack.

    ## What you get

    - A bounded plan of stale heartbeat leases.
    - Approved release with generation history.
    - Failure when recovery is unverified.

    ## Who it's for

    Teams with persistent leases and fenced workers.

    ## Why orchestrate this with Kestra

    Keep checked writes in one execution. The disabled schedule forces safe inputs. Concurrency queues this ID only; MongoDB predicates coordinate with other clients.

    ## Tested end to end

    MongoDB 7.0.45: 21 cases on Kestra 2.0.6 (plugin 1.4.11), nine on 2.0.5 (1.4.9) and nine on a fresh fixture. Mongosh confirmed all 18 documents survived, 17 stayed unchanged and a replacement acquired and committed once. Old-token heartbeat and commit failed. Approval races and partial retry protected holders. Quote, Unicode and template-like IDs passed.

    | Case | Execution | Result |
    | --- | --- | --- |
    | Healthy | `72yivbUXjRaT8ZnVoLlmW6` | SUCCESS, unchanged |
    | Dry run | `6yUn7WYMByKpxGj2ZG7cJD` | SUCCESS, one candidate |
    | Declined | `uswx7Wyv3ISOaOvG9Wprm` | SUCCESS, no write |
    | Release | `7iRn0CH3BxnFXuDxusHlgv` | SUCCESS, fence 7 to 8 |
    | Refused | `OMLEnf04n9uosBi2DSCkj` | FAILED, unchanged |
    | Heartbeat race | `6cOHXEUIoNp9EEyXG8uTLq` | FAILED, renewed holder spared |

    ## Prerequisites

    MongoDB 7.0 with simple collection collation and collection-scoped `find`/`update`. Use primary reads and URI options `serverSelectionTimeoutMS`, `connectTimeoutMS` and `socketTimeoutMS`. Tasks time out after 30 seconds. Database/collection names: ASCII letters, digits, underscores and hyphens.

    Contract: permanent resource document, `contract: heartbeat-fence-v1`, exact `service`, `lockState: held/free`, string `_id` and `ownerToken` (1..256 UTF-8 bytes), BSON date `heartbeatAt` and BSON long `fence` in 0..9007199254740990. Acquisition increments fence. Heartbeat and commits require held state, exact token and fence. Never recreate documents, reuse tokens or rewind generations/heartbeats. External effects need fencing or confirmed termination; this flow does not install it.

    ### Secrets

    - `MONGODB_URI`: connection URI, exposed only as a SECRET input override.
    - `SLACK_WEBHOOK_URL`: candidate and failure notices.

    ### Inputs

    | Input | Default | Purpose |
    | --- | --- | --- |
    | `database`, `collection` | `appdata`, `resource_leases` | Lease collection |
    | `service` | `batch-worker` | Exact scope |
    | `stale_after_seconds` | `3600` | Heartbeat grace, 60..604800 |
    | `max_releases` | `10` | Page and write limit, 1..25 |
    | `dry_run`, `auto_remediate` | `true`, `false` | Safe mode |

    ## Quick start

    1. Confirm the contract, configure secrets and scope and run with defaults.
    2. Confirm holders cannot perform unfenced work. Set `dry_run: false` and `auto_remediate: true`, then approve.
    3. Check application progress independently. After failure inspect generations and create a new plan. Never restore old held documents.

    ## How to extend

    Add an application progress check. Index `service`, `contract`, `lockState` and `heartbeatAt` for large collections.

    Limits: one page per execution. Unsupported schemas are excluded, not certified healthy. Acquisition before verification fails conservatively. Passes are not transactions; completed releases remain. No blanket write retry.

    ## Links

    - [MongoDB atomicity](https://www.mongodb.com/docs/v7.0/core/write-operations-atomicity/)
    - [MongoDB plugin](https://kestra.io/plugins/plugin-mongodb)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
