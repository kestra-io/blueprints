id: duckdb-database-file-fragmentation-sentinel
namespace: company.team

inputs:
  - id: duckdb_file_path
    type: STRING
    defaults: "/var/lib/analytics/warehouse.duckdb"
    description: Absolute file path to the target DuckDB analytical database file.
  - id: max_fragmentation_pct
    type: INT
    defaults: 40
    description: "Maximum allowable free block fragmentation percentage before alerting (default 40%)."

tasks:
  - id: inspect_storage_fragmentation
    type: io.kestra.plugin.scripts.python.Script
    description: Connects to DuckDB database file and executes pragma_database_size to measure fragmentation.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install duckdb kestra
    env:
      DUCKDB_FILE: "{{ inputs.duckdb_file_path }}"
      MAX_FRAG: "{{ inputs.max_fragmentation_pct }}"
    outputFiles:
      - duckdb_summary.json
    script: |
      import os
      import sys
      import json
      import duckdb
      from kestra import Kestra

      db_path = os.environ.get("DUCKDB_FILE")
      max_frag = float(os.environ.get("MAX_FRAG", "40"))

      if not db_path:
          print("ERROR: duckdb_file_path input is required.", file=sys.stderr)
          sys.exit(1)

      try:
          con = duckdb.connect(database=db_path, read_only=True)
          res = con.execute("SELECT total_blocks, free_blocks, round(100.0 * free_blocks / NULLIF(total_blocks, 0), 1) as fragmentation_pct, block_size FROM pragma_database_size();").fetchall()
          con.close()
      except Exception as err:
          print(f"ERROR: Failed to query pragma_database_size on '{db_path}': {err}", file=sys.stderr)
          sys.exit(1)

      if not res:
          print("ERROR: No rows returned from pragma_database_size.", file=sys.stderr)
          sys.exit(1)

      total_blocks = int(res[0][0] or 0)
      free_blocks = int(res[0][1] or 0)
      frag_pct = float(res[0][2] or 0.0)
      block_size = int(res[0][3] or 0)

      is_breach = bool(frag_pct >= max_frag and total_blocks > 1000)

      report = {
          "total_blocks": total_blocks,
          "free_blocks": free_blocks,
          "fragmentation_pct": frag_pct,
          "block_size": block_size,
          "is_breach": is_breach
      }
      with open("duckdb_summary.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      print(f"DuckDB Storage: {free_blocks}/{total_blocks} free blocks ({frag_pct}% fragmentation). Breach: {is_breach}")

      Kestra.outputs(report)

  - id: evaluate_file_bloat
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_storage_fragmentation.vars.is_breach }}"
    then:
      - id: notify_data_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dataops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "DuckDB Database File Fragmentation Warning",
                "text": "Database file {{ inputs.duckdb_file_path }} has {{ outputs.inspect_storage_fragmentation.vars.fragmentation_pct }}% free block fragmentation ({{ outputs.inspect_storage_fragmentation.vars.free_blocks }} free of {{ outputs.inspect_storage_fragmentation.vars.total_blocks }} total blocks). Analytical queries are suffering scan amplification. Execute `CHECKPOINT` or rebuild database.",
                "footer": "Kestra Embedded Data Sentinel DuckDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dataops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "DuckDB Sentinel Failure",
            "text": "Failed to query pragma_database_size on DuckDB file {{ inputs.duckdb_file_path }} for execution {{ execution.id }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 * * *"
    disabled: true

extend:
  metaDescription: "Audits DuckDB database files to detect free storage block fragmentation and vacuum debt."
  metaTitle: DuckDB Database File Storage Fragmentation and Bloat Sentinel with Kestra
  ee: false
  demo: false
  title: DuckDB Database File Storage Fragmentation and Bloat Sentinel
  shortDescription: Audits DuckDB database files to detect free storage block fragmentation and vacuum debt.
  description: |
    ## How it works
    This workflow connects to a DuckDB analytical database file using Python DuckDB to execute `PRAGMA database_size`. In DuckDB, frequent analytical updates, deletions, or append transactions mark existing storage blocks as free without immediately truncating physical file size on disk. Over time, high proportions of free blocks cause physical file bloat, degrade vectorized columnar scan throughput, and waste storage volume capacity. This sentinel computes fragmentation ratios and alerts analytics engineers when database maintenance is warranted.

    ## What you get
    - Real-time tracking of DuckDB internal block fragmentation.
    - Early warning before analytical query vectorized scan throughput degrades.
    - Automated Slack incident notifications detailing total and free storage blocks.

    ## Prerequisites
    - Read access to the target DuckDB database file.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace under the `company.team` namespace.
    2. Add `SLACK_WEBHOOK` secret to your namespace.
    3. Specify `duckdb_file_path` and `max_fragmentation_pct`.
    4. Enable the schedule trigger for daily fragmentation surveillance.

    ## Links
    - [DuckDB PRAGMA Statements Documentation](https://duckdb.org/docs/sql/pragmas)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Core
  subTags:
    - Day 2 Operations
