id: duckdb-database-file-fragmentation-sentinel
namespace: company.data

inputs:
  - id: duckdb_file_path
    type: STRING
    defaults: "/var/lib/analytics/warehouse.duckdb"
    description: Absolute file path to the target DuckDB analytical database file.
  - id: max_fragmentation_pct
    type: INT
    defaults: 40
    description: "Maximum allowable free block fragmentation percentage before alerting (default 40%)."

tasks:
  - id: inspect_storage_fragmentation
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Execute DuckDB pragma database_size to inspect used vs free storage blocks
        duckdb "{{ inputs.duckdb_file_path }}" -json "SELECT total_blocks, free_blocks, round(100.0 * free_blocks / NULLIF(total_blocks, 0), 1) as fragmentation_pct, block_size FROM pragma_database_size();" > /tmp/duckdb_size.json 2>/dev/null || echo "[]" > /tmp/duckdb_size.json

        python3 -c "
        import json
        try:
            with open('/tmp/duckdb_size.json') as f:
                data = json.load(f)
            row = data[0] if data and isinstance(data, list) else {}
            frag = float(row.get('fragmentation_pct', 0.0))
            total_blocks = int(row.get('total_blocks', 0))
            free_blocks = int(row.get('free_blocks', 0))
            is_breach = 1 if frag >= {{ inputs.max_fragmentation_pct }} and total_blocks > 1000 else 0
            print(f'{is_breach}|{frag:.1f}|{total_blocks}|{free_blocks}')
        except Exception:
            print('0|0.0|0|0')
        " > /tmp/duckdb_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/duckdb_summary.txt)
        FRAG_PCT=$(cut -d '|' -f 2 /tmp/duckdb_summary.txt)
        TOTAL_BLOCKS=$(cut -d '|' -f 3 /tmp/duckdb_summary.txt)
        FREE_BLOCKS=$(cut -d '|' -f 4 /tmp/duckdb_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=frag_pct::$FRAG_PCT::"
        echo "::set-output name=total_blocks::$TOTAL_BLOCKS::"
        echo "::set-output name=free_blocks::$FREE_BLOCKS::"

  - id: evaluate_file_bloat
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_storage_fragmentation.vars.is_breach | int == 1 }}"
    then:
      - id: notify_data_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dataops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 DuckDB Database File Fragmentation Warning",
                "text": "Database file {{ inputs.duckdb_file_path }} has {{ outputs.inspect_storage_fragmentation.vars.frag_pct }}% free block fragmentation ({{ outputs.inspect_storage_fragmentation.vars.free_blocks }} free of {{ outputs.inspect_storage_fragmentation.vars.total_blocks }} total blocks). Analytical queries are suffering scan amplification. Execute `CHECKPOINT` or rebuild database.",
                "footer": "Kestra Embedded Data Sentinel • DuckDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dataops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ DuckDB Sentinel Failure",
            "text": "Failed to query pragma_database_size on DuckDB file {{ inputs.duckdb_file_path }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 * * *"
    disabled: true

extend:
  metaDescription: "Audits DuckDB database files to detect free storage block fragmentation and vacuum debt."
  metaTitle: DuckDB Database File Storage Fragmentation and Bloat Sentinel with Kestra
  ee: false
  demo: false
  title: DuckDB Database File Storage Fragmentation and Bloat Sentinel
  shortDescription: Audits DuckDB database files to detect free storage block fragmentation and vacuum debt.
  description: |
    ## How it works
    This workflow connects to a local DuckDB analytical database file using the official DuckDB CLI to execute `PRAGMA database_size`. In DuckDB, frequent analytical updates, deletions, or append transactions mark existing storage blocks as free without immediately truncating physical file size on disk. Over time, high proportions of free blocks cause physical file bloat, degrade vectorized columnar scan throughput, and waste storage volume capacity. This sentinel computes fragmentation ratios and alerts analytics engineers when database maintenance is warranted.

    ## What you get
    - Real-time tracking of DuckDB internal block fragmentation.
    - Early warning before analytical query vectorized scan throughput degrades.
    - Automated Slack incident notifications detailing total and free storage blocks.

    ## Who it's for
    - Analytics Engineers and Data Platform teams deploying embedded DuckDB instances.
    - Data Scientists operating serverless lakehouse workloads with MotherDuck and DuckDB.
    - SREs managing persistent volume claims for analytical data pipelines.

    ## Why orchestrate this with Kestra
    - **Automated Storage Maintenance**: Regularly inspects embedded files on a scheduled cadence.
    - **Native CLI Execution**: Interacts directly with local database files from secure ephemeral runners.
    - **Remediation Integration**: Can trigger automated `CHECKPOINT` or `EXPORT/IMPORT` database compaction routines.

    ## Prerequisites
    - DuckDB CLI binary installed in the runner container.
    - Read access to the target DuckDB database file.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK` secret to your namespace.
    3. Specify `duckdb_file_path` and `max_fragmentation_pct`.
    4. Enable the schedule trigger for daily fragmentation surveillance.

    ## How to extend
    - Automatically execute `CHECKPOINT` or copy into a new clean database file.
    - Archive older analytical partitions to remote Parquet files on Amazon S3.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [DuckDB PRAGMA Statements Documentation](https://duckdb.org/docs/sql/pragmas)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Core
  subTags:
    - Day 2 Operations
    - ELT & Data Landing
