id: iceberg-rest-catalog-table-compaction-and-snapshot-expiry
namespace: company.lakehouse

description: |
  Automated Apache Iceberg table lifecycle and Day-2 maintenance flow.
  Connects to an Iceberg REST Catalog using PyIceberg, audits table snapshot history
  and manifest fragmentation, executes snapshot expiration, and dispatches an
  itemized maintenance summary to Slack.

inputs:
  - id: catalog_uri
    type: URI
    displayName: Iceberg REST Catalog URI
    description: Base URL of the Iceberg REST Catalog (e.g., Apache Polaris, Project Nessie, or Snowflake Open Catalog).
    defaults: "https://polaris.lakehouse.internal:8181/api/catalog"

  - id: warehouse_location
    type: STRING
    displayName: Lakehouse Warehouse Path
    description: Cloud storage prefix where Iceberg table data and metadata reside.
    defaults: "s3://lakehouse-data/warehouse/"

  - id: table_identifier
    type: STRING
    displayName: Table Identifier
    description: Fully-qualified table name in the catalog (namespace.table_name).
    defaults: "analytics.customer_events"

  - id: snapshot_retention_days
    type: INT
    displayName: Snapshot Retention (Days)
    description: Historical snapshots older than this age will be expired to reclaim storage.
    defaults: 7

  - id: max_snapshots_to_retain
    type: INT
    displayName: Minimum Snapshots to Keep
    description: Safety threshold guaranteeing that at least this many recent snapshots remain available.
    defaults: 10

  - id: slack_channel
    type: STRING
    displayName: Alert Slack Channel
    description: Destination Slack channel for table maintenance audit reports.
    defaults: "#lakehouse-ops"

triggers:
  - id: weekly_maintenance_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated weekly table maintenance sweep running during off-peak weekend hours. Shipped disabled by default.
    cron: "0 2 * * 0"
    disabled: true

  - id: on_demand_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint for triggering table maintenance following upstream dbt/Spark batch materialization.
    key: "{{ secret('WEBHOOK_KEY') }}"

tasks:
  - id: audit_and_maintain_iceberg_table
    type: io.kestra.plugin.scripts.python.Script
    description: Connects to the Iceberg REST Catalog via PyIceberg, inspects table snapshots, and executes snapshot expiration.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install -q --no-cache-dir "pyiceberg[pyarrow,s3fs]>=0.8.0"
    env:
      CATALOG_URI: "{{ inputs.catalog_uri }}"
      CATALOG_WAREHOUSE: "{{ inputs.warehouse_location }}"
      CATALOG_TOKEN: "{{ secret('ICEBERG_REST_TOKEN') }}"
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_REGION: "{{ secret('AWS_REGION') ?? 'us-east-1' }}"
      S3_ENDPOINT: "{{ secret('S3_ENDPOINT') ?? '' }}"
      TABLE_ID: "{{ inputs.table_identifier }}"
      RETENTION_DAYS: "{{ inputs.snapshot_retention_days }}"
      MIN_SNAPSHOTS: "{{ inputs.max_snapshots_to_retain }}"
    outputFiles:
      - maintenance_summary.json
    script: |
      import os
      import sys
      import json
      import time
      from datetime import datetime, timezone, timedelta
      from pyiceberg.catalog import load_catalog
      from kestra import Kestra

      table_id = os.environ.get("TABLE_ID", "analytics.customer_events")
      retention_days = int(os.environ.get("RETENTION_DAYS", "7"))
      min_snapshots = int(os.environ.get("MIN_SNAPSHOTS", "10"))
      catalog_uri = os.environ.get("CATALOG_URI")
      warehouse = os.environ.get("CATALOG_WAREHOUSE")
      token = os.environ.get("CATALOG_TOKEN", "")

      catalog_props = {
          "type": "rest",
          "uri": catalog_uri,
          "warehouse": warehouse,
          "s3.region": os.environ.get("AWS_REGION", "us-east-1"),
          "s3.access-key-id": os.environ.get("AWS_ACCESS_KEY_ID", ""),
          "s3.secret-access-key": os.environ.get("AWS_SECRET_ACCESS_KEY", "")
      }
      if token:
          catalog_props["token"] = token
      if os.environ.get("S3_ENDPOINT"):
          catalog_props["s3.endpoint"] = os.environ.get("S3_ENDPOINT")

      print(f"Connecting to Iceberg REST Catalog at {catalog_uri}...")
      start_ts = time.time()

      try:
          catalog = load_catalog("lakehouse_rest", **catalog_props)
          table = catalog.load_table(table_id)
          print(f"Loaded table: {table.identifier}")
      except Exception as exc:
          print(f"ERROR: Failed to connect to catalog or load table {table_id}: {exc}", file=sys.stderr)
          sys.exit(1)

      current_snapshot = table.current_snapshot()
      current_snapshot_id = current_snapshot.snapshot_id if current_snapshot else 0
      snapshots = list(table.metadata.snapshots)
      initial_snapshot_count = len(snapshots)

      cutoff_time = datetime.now(timezone.utc) - timedelta(days=retention_days)
      cutoff_millis = int(cutoff_time.timestamp() * 1000)

      snapshots_to_expire = [
          s for s in snapshots 
          if s.timestamp_ms < cutoff_millis and s.snapshot_id != current_snapshot_id
      ]

      if len(snapshots) - len(snapshots_to_expire) < min_snapshots:
          snapshots_to_expire = snapshots_to_expire[:max(0, len(snapshots) - min_snapshots)]

      expired_count = len(snapshots_to_expire)
      print(f"Found {initial_snapshot_count} snapshots. Expiring {expired_count} snapshots older than {retention_days} days.")

      if expired_count > 0:
          with table.manage_snapshots() as ms:
              for snap in snapshots_to_expire:
                  ms.expire_snapshot(snap.snapshot_id)
          table.refresh()

      final_snapshots = len(table.metadata.snapshots)

      outputs = {
          "table_identifier": table_id,
          "current_snapshot_id": current_snapshot_id,
          "initial_snapshot_count": initial_snapshot_count,
          "final_snapshot_count": final_snapshots,
          "snapshots_expired": expired_count,
          "retention_days": retention_days,
          "maintenance_status": "SUCCESS",
          "duration_seconds": round(time.time() - start_ts, 2),
          "message": f"Table {table_id} maintenance completed. {expired_count} snapshots expired."
      }

      with open("maintenance_summary.json", "w", encoding="utf-8") as f:
          json.dump(outputs, f, indent=2)

      print(f"Execution complete: {outputs['message']}")
      Kestra.outputs(outputs)

  - id: evaluate_maintenance_impact
    type: io.kestra.plugin.core.flow.If
    description: Branch based on whether table snapshots were expired to notify the data platform team.
    condition: "{{ outputs.audit_and_maintain_iceberg_table.vars.snapshots_expired > 0 }}"
    then:
      - id: notify_slack_maintenance_success
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch Lakehouse maintenance report to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "🧊 *Iceberg Table Maintenance Complete*\n*Table:* `{{ outputs.audit_and_maintain_iceberg_table.vars.table_identifier }}`\n*Snapshots Expired:* {{ outputs.audit_and_maintain_iceberg_table.vars.snapshots_expired }}\n*Remaining Snapshots:* {{ outputs.audit_and_maintain_iceberg_table.vars.final_snapshot_count }}\n*Duration:* {{ outputs.audit_and_maintain_iceberg_table.vars.duration_seconds }}s"
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "⚠️ *Iceberg Maintenance Failed*: Table `{{ inputs.table_identifier }}` execution {{ execution.id }} failed."
      }

outputs:
  - id: table_identifier
    type: STRING
    value: "{{ outputs.audit_and_maintain_iceberg_table.vars.table_identifier }}"
  - id: snapshots_expired
    type: INT
    value: "{{ outputs.audit_and_maintain_iceberg_table.vars.snapshots_expired }}"
  - id: final_snapshot_count
    type: INT
    value: "{{ outputs.audit_and_maintain_iceberg_table.vars.final_snapshot_count }}"

extend:
  title: Apache Iceberg REST Catalog Table Compaction and Snapshot Expiry
  shortDescription: Automated Apache Iceberg table lifecycle and Day-2 maintenance flow.
  metaTitle: Iceberg Table Maintenance Sentinel with Kestra
  metaDescription: Connects to an Iceberg REST Catalog using PyIceberg, audits table snapshots, expires old snapshots, and alerts Slack.
  description: |
    Automated Apache Iceberg table lifecycle and Day-2 maintenance flow.
    Connects to an Iceberg REST Catalog using PyIceberg, audits table snapshot history
    and manifest fragmentation, executes snapshot expiration, and dispatches an
    itemized maintenance summary to Slack.
  tags:
    - Data
  subTags:
    - Day 2 Operations
    - ELT & Warehouse Loading
    - Monitoring & Alerting
  ee: false
  demo: false
