id: noaa-tides-storm-surge-residual-alert
namespace: company.team

description: |
  Measure the storm surge residual (observed minus predicted tide) at NOAA CO-OPS gauges, project it onto
  the next high tide against the minor flood level and alert Slack when a station's status changes.

inputs:
  - id: stations
    type: JSON
    displayName: Tide stations
    description: >-
      One object per gauge: `station` (7-digit NOAA CO-OPS id) and optionally `name` and `minor_ft`
      (your own flood threshold in feet above station datum, STND). Without `minor_ft` the NWS minor
      flood level is used, then the NOS minor level. The station list is an example; every water level,
      prediction and flood level comes from the live API.
    defaults: |
      [
        {"station": "8518750", "name": "The Battery, NY"},
        {"station": "8638610", "name": "Sewells Point (Norfolk), VA"},
        {"station": "8665530", "name": "Charleston, SC"},
        {"station": "8726520", "name": "St. Petersburg, FL"},
        {"station": "9410170", "name": "San Diego, CA"},
        {"station": "9447130", "name": "Seattle, WA"}
      ]

  - id: residual_ft
    type: FLOAT
    displayName: Surge residual threshold (ft)
    description: SURGE when the sustained residual (observed minus predicted) is at least this, BLOWOUT when it is at most minus this.
    defaults: 1.0

  - id: sustain_minutes
    type: INT
    displayName: Sustain window (minutes)
    description: The residual is the median of the 6-minute residuals over this window, so a seiche or a single wave spike does not trigger an alert.
    defaults: 60

  - id: lookahead_hours
    type: INT
    displayName: High tide lookahead (hours, max 18)
    description: The highest predicted tide in this window plus the sustained residual is the projected peak compared with the flood threshold. 13 hours covers the next high tide everywhere on a semidiurnal or mixed coast.
    defaults: 13

  - id: stale_minutes
    type: INT
    displayName: Stale after (minutes)
    defaults: 60

  - id: state_key
    type: STRING
    displayName: KV state key
    defaults: noaa_tides_surge_status

triggers:
  - id: every_30_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "4,34 * * * *"
    description: CO-OPS publishes 6-minute water levels a few minutes after each reading.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: fetch_station_list
    type: io.kestra.plugin.core.http.Download
    description: One Metadata API request returns every active water-level station with its tidal and Great Lakes flags and its NOS and NWS flood levels (feet above station datum).
    uri: https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=waterlevels&expand=floodlevels
    headers:
      User-Agent: kestra-noaa-tides-surge-alert/1.0 (https://kestra.io)
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempts: 4

  - id: match_stations
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Unknown or retired ids and non-tidal Great Lakes gauges (no tide predictions, so no residual) are listed and skipped instead of failing the loop.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      list.json: "{{ outputs.fetch_station_list.uri }}"
      stations.json: "{{ inputs.stations | toJson }}"
    outputFiles:
      - stations_parquet
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE meta AS
      SELECT s->>'$.id' AS station, s->>'$.name' AS api_name, s->>'$.state' AS state,
             CAST(s->>'$.tidal' AS BOOLEAN) AS tidal,
             TRY_CAST(s->>'$.floodlevels.nws_minor' AS DOUBLE) AS nws_minor,
             TRY_CAST(s->>'$.floodlevels.nos_minor' AS DOUBLE) AS nos_minor
      FROM (SELECT unnest(from_json(content->'$.stations', '["JSON"]')) AS s FROM read_text('list.json'));

      CREATE TABLE cfg AS
      SELECT row_number() OVER () AS ord, trim(c->>'$.station') AS station, c->>'$.name' AS name,
             TRY_CAST(c->>'$.minor_ft' AS DOUBLE) AS minor_override
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS c FROM read_text('stations.json'));

      CREATE TABLE j AS
      SELECT c.ord, c.station, coalesce(c.name, m.api_name || ', ' || m.state, c.station) AS name,
             m.station IS NOT NULL AS known, coalesce(m.tidal, false) AS tidal,
             coalesce(c.minor_override, m.nws_minor, m.nos_minor) AS minor_ft,
             CASE WHEN c.minor_override IS NOT NULL THEN 'input' WHEN m.nws_minor IS NOT NULL THEN 'NWS' WHEN m.nos_minor IS NOT NULL THEN 'NOS' END AS minor_source
      FROM cfg c LEFT JOIN meta m USING (station);

      COPY (SELECT * FROM j WHERE known AND tidal ORDER BY ord) TO '{{ outputFiles.stations_parquet }}' (FORMAT PARQUET);

      SELECT count(*) FILTER (WHERE known AND tidal) AS usable,
             coalesce(string_agg(station || CASE WHEN known THEN ' (no tide predictions)' ELSE ' (not an active water-level station)' END, ', ' ORDER BY ord) FILTER (WHERE NOT (known AND tidal)), '') AS skipped,
             coalesce(CAST(to_json(list(json_object(
               'station', station, 'begin', strftime(now() - INTERVAL 6 HOUR, '%Y%m%d'),
               'sustain', {{ inputs.sustain_minutes }}, 'lookahead', least({{ inputs.lookahead_hours }}, 18)
             ) ORDER BY ord) FILTER (WHERE known AND tidal)) AS VARCHAR), '[]') AS loop_items
      FROM j;

  - id: require_stations
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ outputs.match_stations.outputs[0].row.usable == 0 }}"
    errorMessage: "No usable tide station. Skipped: {{ outputs.match_stations.outputs[0].row.skipped }}"

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: Last status per station. Missing on the first run (BASELINE), when every station reports once.

  - id: per_station
    type: io.kestra.plugin.core.flow.Loop
    description: Two Data API requests per station, both in feet above station datum (STND) so they compare directly with the flood levels.
    values: "{{ outputs.match_stations.outputs[0].row.loop_items }}"
    concurrencyLimit: 3
    tasks:
      - id: fetch_observed
        type: io.kestra.plugin.core.http.Download
        description: Last 3 hours of preliminary 6-minute water levels. A gauge that is down answers HTTP 200 with an `error` object, which becomes NO_DATA.
        uri: "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=water_level&station={{ fromJson(item.value).station }}&range=3&datum=STND&units=english&time_zone=gmt&format=json&application=kestra-surge-alert"
        retry:
          type: exponential
          interval: PT30S
          maxInterval: PT5M
          maxAttempts: 4

      - id: fetch_predicted
        type: io.kestra.plugin.core.http.Download
        description: 48 hours of 6-minute tide predictions from the UTC day of six hours ago, which always covers the last 3 hours and the next 18.
        uri: "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&station={{ fromJson(item.value).station }}&begin_date={{ fromJson(item.value).begin }}&range=48&interval=6&datum=STND&units=english&time_zone=gmt&format=json&application=kestra-surge-alert"
        retry:
          type: exponential
          interval: PT30S
          maxInterval: PT5M
          maxAttempts: 4

      - id: residuals
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: |
          Observed and predicted values share the 6-minute grid, so they join on time. Readings flagged
          flat (sensor stuck) or out of limits are dropped. The sustained residual is the median over the
          sustain window and needs at least half of its readings.
        url: "jdbc:duckdb:"
        fetchType: FETCH_ONE
        inputFiles:
          obs.json: "{{ outputs.fetch_observed.uri }}"
          pred.json: "{{ outputs.fetch_predicted.uri }}"
        sql: |
          SET TimeZone = 'UTC';
          CREATE TABLE o AS
          SELECT strptime(x.t, '%Y-%m-%d %H:%M') AS ts, TRY_CAST(x.v AS DOUBLE) AS wl
          FROM (SELECT unnest(from_json(content->'$.data', '[{"t":"VARCHAR","v":"VARCHAR","f":"VARCHAR"}]')) AS x FROM read_text('obs.json'))
          WHERE TRY_CAST(x.v AS DOUBLE) IS NOT NULL AND split_part(x.f, ',', 2) <> '1' AND split_part(x.f, ',', 4) <> '1';
          CREATE TABLE p AS
          SELECT strptime(x.t, '%Y-%m-%d %H:%M') AS ts, CAST(x.v AS DOUBLE) AS tide
          FROM (SELECT unnest(from_json(content->'$.predictions', '[{"t":"VARCHAR","v":"VARCHAR"}]')) AS x FROM read_text('pred.json'));
          CREATE TABLE r AS SELECT o.ts, o.wl, p.tide, o.wl - p.tide AS res FROM o JOIN p USING (ts);
          CREATE TABLE last AS SELECT max(ts) AS t FROM r;
          SELECT '{{ fromJson(item.value).station }}' AS station,
                 (SELECT content->>'$.error.message' FROM read_text('obs.json')) AS obs_error,
                 (SELECT content->>'$.error.message' FROM read_text('pred.json')) AS pred_error,
                 (SELECT strftime(t, '%Y-%m-%d %H:%M UTC') FROM last) AS obs_at,
                 (SELECT date_diff('minute', t, CAST(now() AS TIMESTAMP)) FROM last) AS age_min,
                 (SELECT round(arg_max(wl, ts), 2) FROM r) AS observed_ft,
                 (SELECT round(arg_max(tide, ts), 2) FROM r) AS predicted_ft,
                 (SELECT CASE WHEN count(*) * 12 >= {{ fromJson(item.value).sustain }} THEN round(median(res), 2) END
                    FROM r WHERE ts > (SELECT t FROM last) - to_minutes({{ fromJson(item.value).sustain }})) AS residual_ft,
                 (SELECT round(max(res), 2) FROM r) AS residual_max_3h_ft,
                 (SELECT round(max(tide), 2) FROM p WHERE ts > (SELECT t FROM last) AND ts <= (SELECT t FROM last) + to_hours({{ fromJson(item.value).lookahead }})) AS next_high_ft,
                 (SELECT strftime(arg_max(ts, tide), '%Y-%m-%d %H:%M UTC') FROM p WHERE ts > (SELECT t FROM last) AND ts <= (SELECT t FROM last) + to_hours({{ fromJson(item.value).lookahead }})) AS next_high_at;
    outputs:
      - id: stats
        type: STRING
        value: "{{ outputs.residuals.outputs[0].row | toJson }}"

  - id: evaluate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      NO_DATA when the gauge returned no valid reading or the newest is older than `stale_minutes`.
      FLOODING when the observed level is at or above the minor flood threshold, FLOOD_RISK when the
      next high tide plus the sustained residual reaches it, SURGE or BLOWOUT when the residual crosses
      plus or minus `residual_ft`, NORMAL otherwise. Stations without flood levels get residual checks only.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      stations.parquet: "{{ outputs.match_stations.outputFiles.stations_parquet }}"
      stats.json: "[{% for it in outputs.per_station.outputs %}{{ it.outputs.stats }}{% if not loop.last %},{% endif %}{% endfor %}]"
      state.json: "{{ outputs.previous_state.value ?? '[]' }}"
    outputFiles:
      - status_csv
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE prev AS
      SELECT p->>'$.station' AS station, p->>'$.status' AS prev_status
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS p FROM read_text('state.json'));

      CREATE TABLE e AS
      SELECT c.ord, c.station, c.name, c.minor_ft, c.minor_source, s.obs_at, s.age_min, s.observed_ft, s.predicted_ft,
             s.residual_ft, s.residual_max_3h_ft, s.next_high_ft, s.next_high_at,
             round(s.next_high_ft + s.residual_ft, 2) AS projected_peak_ft,
             coalesce(s.obs_error, s.pred_error) AS api_error, p.prev_status
      FROM read_parquet('stations.parquet') c
      LEFT JOIN read_json('stats.json', format = 'array', columns = {station: 'VARCHAR', obs_error: 'VARCHAR', pred_error: 'VARCHAR', obs_at: 'VARCHAR', age_min: 'BIGINT', observed_ft: 'DOUBLE', predicted_ft: 'DOUBLE', residual_ft: 'DOUBLE', residual_max_3h_ft: 'DOUBLE', next_high_ft: 'DOUBLE', next_high_at: 'VARCHAR'}) s USING (station)
      LEFT JOIN prev p USING (station);

      CREATE TABLE r AS
      SELECT *,
             CASE WHEN residual_ft IS NULL OR age_min > {{ inputs.stale_minutes }} THEN 'NO_DATA'
                  WHEN observed_ft >= minor_ft THEN 'FLOODING'
                  WHEN projected_peak_ft >= minor_ft THEN 'FLOOD_RISK'
                  WHEN residual_ft >= {{ inputs.residual_ft }} THEN 'SURGE'
                  WHEN residual_ft <= -{{ inputs.residual_ft }} THEN 'BLOWOUT'
                  ELSE 'NORMAL' END AS status
      FROM e;

      COPY (
        SELECT station, name, status, prev_status AS previous_status, obs_at AS observed_at, age_min, observed_ft, predicted_ft,
               residual_ft, residual_max_3h_ft, next_high_at, next_high_ft, projected_peak_ft, minor_ft AS minor_flood_ft,
               minor_source, round(minor_ft - projected_peak_ft, 2) AS margin_ft, api_error
        FROM r ORDER BY ord
      ) TO '{{ outputFiles.status_csv }}' (HEADER, DELIMITER ',');

      SELECT count(*) AS stations,
             (SELECT count(*) FROM prev) = 0 AS is_baseline,
             count(*) FILTER (WHERE status IS DISTINCT FROM prev_status) AS changes,
             count(*) FILTER (WHERE status IN ('FLOODING', 'FLOOD_RISK')) AS flood_stations,
             string_agg(name || ' ' || status || ' (residual ' || coalesce(CAST(residual_ft AS VARCHAR) || ' ft', 'n/a') || ')', '; ' ORDER BY ord) AS status_line,
             coalesce(CAST(to_json(list(json_object(
               'name', name, 'station', station, 'status', status, 'prev', coalesce(prev_status, 'none'),
               'obs', observed_ft, 'pred', predicted_ft, 'res', residual_ft, 'at', obs_at, 'high', next_high_ft, 'high_at', next_high_at,
               'peak', projected_peak_ft, 'minor', minor_ft, 'src', minor_source, 'err', api_error
             ) ORDER BY ord) FILTER (WHERE status IS DISTINCT FROM prev_status)) AS VARCHAR), '[]') AS change_list,
             CAST(to_json(list(json_object('station', station, 'status', status) ORDER BY ord)) AS VARCHAR) AS new_state
      FROM r;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.evaluate.outputs[0].row.new_state }}"

  - id: on_status_change
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.outputs[0].row.changes > 0 }}"
    then:
      - id: compose
        type: io.kestra.plugin.core.debug.Return
        format: |-
          *Tide gauge surge update*{{ outputs.evaluate.outputs[0].row.is_baseline ? ' (baseline)' : '' }}: {{ outputs.evaluate.outputs[0].row.changes }} station(s) changed, {{ outputs.evaluate.outputs[0].row.flood_stations }} at flood risk or flooding.
          {% for c in fromJson(outputs.evaluate.outputs[0].row.change_list) %}{{ ['FLOODING', 'FLOOD_RISK'] contains c.status ? ':red_circle:' : (['SURGE', 'BLOWOUT'] contains c.status ? ':large_orange_circle:' : (c.status == 'NO_DATA' ? ':grey_question:' : ':large_green_circle:')) }} *<https://tidesandcurrents.noaa.gov/waterlevels.html?id={{ c.station }}|{{ c.name }}>*: {{ c.prev }} -> *{{ c.status }}*.{% if c.res is not null %} Observed {{ c.obs }} ft vs predicted {{ c.pred }} ft at {{ c.at }}, residual {{ c.res >= 0 ? '+' : '' }}{{ c.res }} ft.{% if c.high is not null %} Next high {{ c.high }} ft at {{ c.high_at }}, projected {{ c.peak }} ft{% if c.minor is not null %} vs minor flood {{ c.minor }} ft ({{ c.src }}){% endif %}.{% endif %}{% else %} {{ c.err ?? 'No recent valid reading.' }}{% endif %}
          {% endfor %}
      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the run going when `SLACK_WEBHOOK_URL` is not set; the message is still logged and the CSV written.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: "{{ outputs.compose.value }}"
      - id: log_change
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.compose.value }}"
    else:
      - id: log_no_change
        type: io.kestra.plugin.core.log.Log
        message: "No status change: {{ outputs.evaluate.outputs[0].row.status_line }}."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.evaluate.outputs[0].row.stations }} stations, {{ outputs.evaluate.outputs[0].row.changes }} changes{{ outputs.evaluate.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}.
      {{ outputs.evaluate.outputs[0].row.status_line }}.
      {% if outputs.match_stations.outputs[0].row.skipped != '' %}Skipped: {{ outputs.match_stations.outputs[0].row.skipped }}.{% endif %}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.evaluate.outputs[0].row | toJson }}"
  - id: status_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.status_csv }}"

extend:
  title: Storm Surge Residual and Flood Risk Alert from NOAA Tide Gauges
  metaTitle: Storm Surge Residual Alert with NOAA CO-OPS Tides and Currents | Kestra
  shortDescription: Every 30 minutes, subtract the NOAA tide prediction from the observed water level at each tide gauge, project the sustained surge onto the next high tide and post to Slack when a station turns SURGE, FLOOD_RISK, FLOODING or back to NORMAL.
  metaDescription: Compare NOAA CO-OPS observed water levels with tide predictions, project surge onto the next high tide vs flood levels, KV state, CSV and Slack alerts.
  description: |
    A tide table tells you how high the water should be; wind, pressure and river flow decide how high it is. The difference, the residual or storm surge, is what floods streets when it lands on a high tide. Every 30 minutes this flow measures the sustained residual at each NOAA CO-OPS gauge, adds it to the next predicted high tide, compares the result with the station's minor flood level and alerts Slack on status changes. The default station list is an example; all water levels, predictions and flood levels come from the live API.

    ## How it works

    1. A `Schedule` trigger runs at minutes 4 and 34 with `concurrency.limit: 1`.
    2. `fetch_station_list` makes one Metadata API request (`stations.json?type=waterlevels&expand=floodlevels`) for every active gauge with its flood levels. `match_stations` (DuckDB) skips unknown ids and Great Lakes gauges (no tide predictions) and lists them. The threshold is your `minor_ft`, else NWS minor, else NOS minor.
    3. `per_station` (Loop) downloads the last 3 hours of 6-minute water levels and 48 hours of 6-minute predictions, both in feet above station datum (STND), the datum of the flood levels. `residuals` (DuckDB) drops readings flagged flat or out of limits, joins observed and predicted on time, takes the median residual over `sustain_minutes` (a seiche or a wave spike does not count) and finds the highest predicted tide in the next `lookahead_hours`.
    4. `evaluate` (DuckDB) sets one status per station: NO_DATA (gauge down or older than `stale_minutes`), FLOODING (observed at or above minor flood), FLOOD_RISK (next high tide plus residual reaches it), SURGE or BLOWOUT (residual beyond plus or minus `residual_ft`), or NORMAL.
    5. `save_state` (KV) stores the statuses. `on_status_change` (If) posts one Slack message with every change: observed vs predicted, residual, next high tide, projected peak and threshold. The first run is the BASELINE and reports every station.

    ## What you get

    - Change-only alerts with the numbers behind them and a link to the station page.
    - A flood warning hours before the high tide, from the surge already in the water.
    - BLOWOUT for strong negative surge, which matters for under-keel clearance.
    - A per-station CSV (residuals, next high, projected peak, margin to flood level) as a flow output.

    ## Who it's for

    - Port operators, harbour masters, marine construction teams, emergency managers and facility teams on low-lying coastal sites.

    ## Why orchestrate this with Kestra

    - Stations and thresholds are inputs, the KV store turns a 30-minute poll into change-only alerts, and retries cover API hiccups.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins.
    - Outbound HTTPS to `api.tidesandcurrents.noaa.gov`. No API key is needed.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for status changes (optional; without it the Slack task fails, the run ends in WARNING and the message is still logged).

    ## Quick start

    1. Import the flow and click **Execute**. The first run is the baseline and reports every station.
    2. Execute again: `No status change` unless the water crossed a threshold.
    3. Put your gauges in `stations` (ids on the station map at tidesandcurrents.noaa.gov), set `minor_ft` where your site floods earlier, add `SLACK_WEBHOOK_URL` and enable the schedule.

    ## How to extend

    - Use the NWS moderate and major flood levels from the same Metadata API call for escalation.
    - Trigger a flood-barrier, pump or berth-closure flow on FLOOD_RISK, or load the CSV into a warehouse.

    ## Links

    - [CO-OPS Data API](https://api.tidesandcurrents.noaa.gov/api/prod/)
    - [CO-OPS Metadata API](https://api.tidesandcurrents.noaa.gov/mdapi/prod/)
    - [DuckDB Queries task](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Slack incoming webhook task](https://kestra.io/plugins/plugin-slack/slack-notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
