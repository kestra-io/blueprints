id: github-approved-pull-request-unmerged-sentinel
namespace: company.devops

inputs:
  - id: github_owner
    type: STRING
    displayName: GitHub Organization / Owner
    defaults: "kestra-io"
    description: GitHub organization or username owning the repository.

  - id: github_repository
    type: STRING
    displayName: GitHub Repository
    defaults: "kestra"
    description: GitHub repository slug to monitor for approved pull requests.

  - id: max_approved_queue
    type: INT
    displayName: Maximum Tolerable Approved Queue
    defaults: 0
    description: Maximum allowable unmerged approved pull requests before sending an alert. Defaults to 0 to accelerate merge velocity.

  - id: pr_batch_limit
    type: INT
    displayName: PR Evaluation Limit
    defaults: 25
    description: Maximum number of open pull requests to inspect per run.

triggers:
  - id: weekday_merge_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Twice-daily weekday check at 10:00 and 16:00 UTC to remind developers of approved PRs ready to merge. Shipped disabled by default.
    cron: "0 10,16 * * 1-5"
    disabled: true

tasks:
  - id: fetch_approved_pull_requests
    type: io.kestra.plugin.graphql.Request
    description: Query GitHub GraphQL API for open pull requests and their review decision status.
    uri: "https://api.github.com/graphql"
    headers:
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-GitHub-Approved-PR-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query {
        repository(owner: "{{ inputs.github_owner }}", name: "{{ inputs.github_repository }}") {
          pullRequests(states: OPEN, first: {{ inputs.pr_batch_limit }}, orderBy: {field: UPDATED_AT, direction: ASC}) {
            totalCount
            nodes {
              number
              title
              url
              updatedAt
              reviewDecision
              mergeable
              author {
                login
              }
            }
          }
        }
      }

  - id: evaluate_approved_queue
    type: io.kestra.plugin.core.flow.If
    description: Check whether open pull requests with APPROVED status exceed tolerance threshold.
    condition: "{{ outputs.fetch_approved_pull_requests.body is defined and outputs.fetch_approved_pull_requests.body.repository is defined and outputs.fetch_approved_pull_requests.body.repository.pullRequests is defined and (((outputs.fetch_approved_pull_requests.body.repository.pullRequests.nodes | jq('[.[] | select(.reviewDecision == \"APPROVED\")] | length') | first) | int) > inputs.max_approved_queue) }}"
    then:
      - id: alert_approved_prs
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch Slack alert to Engineering channel reminding authors and maintainers to merge approved changes.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚀 *GITHUB DELIVERY VELOCITY: Approved Pull Requests Ready to Merge* 🚀\n\n*Repository:* `{{ inputs.github_owner }}/{{ inputs.github_repository }}`\n*Approved PRs Awaiting Merge:* {{ outputs.fetch_approved_pull_requests.body.repository.pullRequests.nodes | jq('[.[] | select(.reviewDecision == \"APPROVED\")] | length') | first }}\n\n*Approved Pull Requests:*\n{{ outputs.fetch_approved_pull_requests.body.repository.pullRequests.nodes | jq('[.[] | select(.reviewDecision == \"APPROVED\") | \"• *#\" + (.number | tostring) + \"*: \" + .title + \" (Author: @\" + (.author.login // \"ghost\") + \", State: \" + (.mergeable // \"UNKNOWN\") + \") - <\" + .url + \"|View PR>\"] | join(\"\\n\")') | first }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* Authors and maintainers please complete testing and merge approved branches to avoid merge conflicts."
          }
    else:
      - id: log_queue_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log clean status when zero approved pull requests remain unmerged.
        message: "HEALTHY: All approved pull requests in {{ inputs.github_owner }}/{{ inputs.github_repository }} are merged or within tolerance."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for engineering throughput.
    message: "GitHub approved PR audit completed for {{ inputs.github_owner }}/{{ inputs.github_repository }}. Evaluated: {{ outputs.fetch_approved_pull_requests.body is defined and outputs.fetch_approved_pull_requests.body.repository is defined and outputs.fetch_approved_pull_requests.body.repository.pullRequests is defined ? (outputs.fetch_approved_pull_requests.body.repository.pullRequests.nodes | length) : 0 }}. Approved unmerged: {{ outputs.fetch_approved_pull_requests.body is defined and outputs.fetch_approved_pull_requests.body.repository is defined and outputs.fetch_approved_pull_requests.body.repository.pullRequests is defined ? (outputs.fetch_approved_pull_requests.body.repository.pullRequests.nodes | jq('[.[] | select(.reviewDecision == \"APPROVED\")] | length') | first) : 0 }}."

errors:
  - id: alert_on_github_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Engineering Operations if GitHub GraphQL API returns an error or token expires.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *GitHub Approved PR Sentinel Error*: Execution `{{ execution.id }}` failed to query repository `{{ inputs.github_owner }}/{{ inputs.github_repository }}`. Check GITHUB_TOKEN scope and API status."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.fetch_approved_pull_requests.body is defined and outputs.fetch_approved_pull_requests.body.repository is defined and outputs.fetch_approved_pull_requests.body.repository.pullRequests is defined and (((outputs.fetch_approved_pull_requests.body.repository.pullRequests.nodes | jq('[.[] | select(.reviewDecision == \"APPROVED\")] | length') | first) | int) > inputs.max_approved_queue) ? 'APPROVED_QUEUE_EXCEEDED' : 'HEALTHY' }}"
  - id: approved_count
    type: INT
    value: "{{ outputs.fetch_approved_pull_requests.body is defined and outputs.fetch_approved_pull_requests.body.repository is defined and outputs.fetch_approved_pull_requests.body.repository.pullRequests is defined ? ((outputs.fetch_approved_pull_requests.body.repository.pullRequests.nodes | jq('[.[] | select(.reviewDecision == \"APPROVED\")] | length') | first) | int) : 0 }}"

extend:
  title: GitHub approved pull request unmerged queue sentinel
  metaTitle: GitHub Approved Pull Request Sentinel | Kestra
  shortDescription: Automated DevOps sentinel that queries GitHub GraphQL API for approved pull requests awaiting merge, dispatching Slack reminders to accelerate delivery.
  metaDescription: Audit GitHub open pull requests via GraphQL API for approved changes awaiting merge and alert engineering teams in Slack to prevent release delays.
  description: |
    Accelerate software delivery velocity by ensuring approved code reviews do not sit unmerged in repository queues. In modern software engineering teams, pull requests that have successfully passed automated test suites and received formal peer approvals (`reviewDecision: APPROVED`) often remain unmerged for days because authors or team leads simply lose track of the open notification, leading to painful merge conflicts with trunk, branch drift, and delayed customer value. This blueprint queries the GitHub GraphQL API twice daily on weekdays (`io.kestra.plugin.graphql.Request`), isolates approved open pull requests, and sends a concise Slack reminder itemizing PR numbers, titles, and author handles.

    ## How it works
    1. A `Schedule` trigger executes twice daily on weekdays at 10:00 and 16:00 UTC (shipped disabled by default).
    2. Task `fetch_approved_pull_requests` queries `https://api.github.com/graphql` using a GitHub access token (`GITHUB_TOKEN`). The GraphQL query extracts open pull requests sorted by last updated time, requesting `number`, `title`, `url`, `reviewDecision`, `mergeable`, and `author`.
    3. Task `evaluate_approved_queue` (`io.kestra.plugin.core.flow.If`) applies a jq expression to count pull requests where `reviewDecision == "APPROVED"`:
       - If approved unmerged PRs exceed `inputs.max_approved_queue`, task `alert_approved_prs` delivers a Slack message highlighting approved PRs ready to ship.
       - If all approved pull requests are merged, task `log_queue_healthy` logs that the review queue is clean.
    4. Task `log_audit_summary` logs total evaluated and approved pull request counts.
    5. Top-level `errors` handler alerts engineering if GitHub API rate limits or token expirations occur.

    ## What you get
    - Shorter lead times from code approval to production deployment.
    - Prevention of merge conflicts and branch drift on long-lived approved branches.
    - Actionable Slack notifications directing developers straight to approved pull requests.
    - Improved developer experience and team throughput visibility.

    ## Who it's for
    - Engineering Managers and Team Leads tracking pull request cycle time and delivery speed.
    - Platform and DevOps Engineers automating repository governance.
    - Software Engineers seeking to prevent approved changes from stalling in code review.

    ## Why orchestrate this with Kestra
    Checking pull request review states across multiple repositories manually is inefficient. Kestra provides scheduled, version-controlled automation that executes typed GraphQL queries, evaluates review metadata in memory with jq expressions, and delivers formatted notifications directly to team Slack channels with zero custom bot maintenance.

    ## Prerequisites
    - A GitHub personal access token (classic or fine-grained) with `repo` or `pull_requests:read` permissions.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `GITHUB_TOKEN`: GitHub personal access token passed in the `Authorization: Bearer` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to post merge reminders.

    ## Quick start
    1. Store your GitHub token and Slack webhook in Kestra Secrets (`GITHUB_TOKEN` and `SLACK_WEBHOOK_URL`).
    2. Set `github_owner` and `github_repository` inputs to your target repository (e.g. `kestra-io` and `kestra`).
    3. Run a manual execution from the Kestra UI to verify that the query retrieves pull requests.
    4. Enable the `weekday_merge_check` schedule to begin automated twice-daily merge reminders.

    ## How to extend
    - Add an auto-merge mutation (`enablePullRequestAutoMerge`) via GraphQL to automatically merge PRs once status checks pass.
    - Filter for PRs where `mergeable == "CONFLICTING"` to post specific rebase warnings on author channels.
    - Track merge lead times over quarters to monitor team velocity improvements.

    ## Links
    - [GitHub GraphQL API: PullRequest](https://docs.github.com/en/graphql/reference/objects#pullrequest)
    - [Kestra GraphQL Plugin](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Business
  subTags:
    - CI/CD & Deployment
    - Reporting & Digests
  ee: false
  demo: false
