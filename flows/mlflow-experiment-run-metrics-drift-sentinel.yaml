id: mlflow-experiment-run-metrics-drift-sentinel
namespace: company.mlops

inputs:
  - id: mlflow_tracking_uri
    type: STRING
    defaults: "http://mlflow.internal:5000"
    description: Base URL of the MLflow Tracking Server.
  - id: experiment_id
    type: STRING
    description: Target MLflow Experiment ID to audit.
  - id: min_accuracy_threshold
    type: STRING
    defaults: "0.85"
    description: "Minimum acceptable model validation accuracy threshold (default 0.85)."

tasks:
  - id: inspect_latest_run_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query MLflow REST API for latest completed runs in target experiment
        curl -s -X POST "{{ inputs.mlflow_tracking_uri }}/api/2.0/mlflow/runs/search" \
          -H "Content-Type: application/json" \
          --data '{"experiment_ids": ["{{ inputs.experiment_id }}"], "max_results": 5, "order_by": ["attributes.start_time DESC"]}' > /tmp/mlflow_runs.json

        python3 -c "
        import json
        try:
            with open('/tmp/mlflow_runs.json') as f:
                data = json.load(f)
            runs = data.get('runs', [])
            latest_run = runs[0] if runs else {}
            run_id = latest_run.get('info', {}).get('run_id', 'unknown')
            metrics = {m.get('key'): m.get('value') for m in latest_run.get('data', {}).get('metrics', [])}
            acc = float(metrics.get('accuracy', metrics.get('val_accuracy', 0.0)))
            thresh = float('{{ inputs.min_accuracy_threshold }}')
            is_breach = 1 if acc < thresh and acc > 0.0 else 0
            print(f'{is_breach}|{acc:.4f}|{run_id}')
        except Exception:
            print('0|0.0|none')
        " > /tmp/mlflow_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/mlflow_summary.txt)
        ACCURACY=$(cut -d '|' -f 2 /tmp/mlflow_summary.txt)
        RUN_ID=$(cut -d '|' -f 3 /tmp/mlflow_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=accuracy::$ACCURACY::"
        echo "::set-output name=run_id::$RUN_ID::"

  - id: evaluate_model_quality
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_latest_run_metrics.vars.is_breach | int == 1 }}"
    then:
      - id: notify_mlops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#mlops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 MLflow Model Accuracy Degradation Alert",
                "text": "Run {{ outputs.inspect_latest_run_metrics.vars.run_id }} in Experiment {{ inputs.experiment_id }} achieved accuracy {{ outputs.inspect_latest_run_metrics.vars.accuracy }} (below threshold {{ inputs.min_accuracy_threshold }}). Model quality gate failed.",
                "footer": "Kestra MLOps Sentinel • MLflow"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#mlops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MLflow Sentinel Failure",
            "text": "Failed to communicate with MLflow tracking server at {{ inputs.mlflow_tracking_uri }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: MLflow Model Evaluation Metric Degradation Sentinel
  shortDescription: Audits MLflow tracking runs to detect machine learning model quality regression and metric drift.
  description: |
    ## How it works
    This workflow queries the MLflow Tracking Server REST API (`/api/2.0/mlflow/runs/search`) to inspect evaluation metrics logged by newly completed experiment runs. In production MLOps training pipelines, automated retraining on newly ingested data can lead to catastrophic forgetting, covariate shift, or hyperparameter degradation. This sentinel audits recent runs for a given experiment ID, extracts validation accuracy, and verifies that the model meets defined deployment quality gates before model weights are promoted to production model registries.

    ## What you get
    - Continuous surveillance of ML model training quality and evaluation metrics.
    - Automated deployment quality gate enforcement for ML pipelines.
    - Instant Slack alerts detailing failing run IDs and evaluation scores.

    ## Who it's for
    - Machine Learning Engineers overseeing model retraining pipelines.
    - MLOps Platform Engineers safeguarding production inference models.
    - Data Science Leads enforcing quantitative model promotion criteria.

    ## Why orchestrate this with Kestra
    - **Automated MLOps Quality Gates**: Directly gates downstream model deployment workflows in Kestra.
    - **Language Agnostic**: Interacts with standard REST endpoints without requiring Python ML libraries in the runner.
    - **Historical Audit Trail**: Tracks model quality progression alongside training and data prep flows.

    ## Prerequisites
    - Running MLflow Tracking Server with accessible REST API (`5000`).
    - MLflow Experiment ID.
    - Slack incoming webhook configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK` to your namespace secrets.
    3. Specify `mlflow_tracking_uri` and target `experiment_id`.
    4. Enable the schedule trigger to activate automatic model quality auditing.

    ## How to extend
    - Automatically tag runs with `quality_gate: failed` via MLflow API.
    - Promote passing models to the MLflow Model Registry `Production` stage.
    - Track regression across multiple metrics (e.g., F1-score, latency, AUC-ROC).

    ## Links
    - [MLflow REST API Documentation](https://mlflow.org/docs/latest/rest-api.html)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - AI
    - Data
