id: mlflow-experiment-run-metrics-drift-sentinel
namespace: company.mlops

description: |
  Audits MLflow Tracking Server experiment runs to evaluate model validation accuracy and detect quality regression drift.

concurrency:
  limit: 1

inputs:
  - id: mlflow_tracking_uri
    type: STRING
    defaults: "http://mlflow.internal:5000"
    description: Base URL of the MLflow Tracking Server.
  - id: experiment_id
    type: STRING
    defaults: "0"
    description: Target MLflow Experiment ID to audit.
  - id: min_accuracy_threshold
    type: FLOAT
    defaults: 0.85
    description: "Minimum acceptable model validation accuracy threshold (default 0.85)."

tasks:
  - id: inspect_latest_run_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Queries MLflow REST API for latest completed runs and validates accuracy metrics against drift thresholds.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      MLFLOW_URI: "{{ inputs.mlflow_tracking_uri }}"
      EXPERIMENT_ID: "{{ inputs.experiment_id }}"
      MIN_ACCURACY: "{{ inputs.min_accuracy_threshold }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      mlflow_uri = os.environ.get("MLFLOW_URI", "http://mlflow:5000").rstrip("/")
      exp_id = os.environ.get("EXPERIMENT_ID", "0").strip()
      thresh = float(os.environ.get("MIN_ACCURACY", "0.85"))

      url = f"{mlflow_uri}/api/2.0/mlflow/runs/search"
      payload = {
          "experiment_ids": [exp_id],
          "max_results": 5,
          "order_by": ["attributes.start_time DESC"]
      }

      print(f"Querying latest MLflow runs for experiment {exp_id} from {url}...")

      try:
          resp = requests.post(url, json=payload, headers={"Content-Type": "application/json"}, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"ERROR: Failed to query MLflow API at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      runs = data.get("runs", [])
      if not runs:
          print(f"No runs found for experiment {exp_id}")
          run_id = "none"
          acc = 0.0
          is_breach = True
      else:
          latest_run = runs[0]
          run_id = latest_run.get("info", {}).get("run_id", "unknown")
          metrics = {m.get("key"): m.get("value") for m in latest_run.get("data", {}).get("metrics", [])}
          acc = float(metrics.get("accuracy", metrics.get("val_accuracy", 0.0)))
          is_breach = acc < thresh

      print(f"MLflow Run ID: {run_id}, Accuracy: {acc:.4f}, Threshold: {thresh}, Breach: {is_breach}")

      Kestra.outputs({
          "is_breach": is_breach,
          "accuracy": round(acc, 4),
          "run_id": run_id
      })

  - id: evaluate_model_quality
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_latest_run_metrics.vars.is_breach }}"
    then:
      - id: notify_mlops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#mlops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 MLflow Model Accuracy Regression Alert",
                "text": "Latest MLflow experiment run `{{ outputs.inspect_latest_run_metrics.vars.run_id }}` (Experiment {{ inputs.experiment_id }}) achieved accuracy {{ outputs.inspect_latest_run_metrics.vars.accuracy }}, falling below the quality threshold of {{ inputs.min_accuracy_threshold }}.",
                "footer": "Kestra MLOps Sentinel • MLflow"
              }
            ]
          }
    else:
      - id: log_model_healthy
        type: io.kestra.plugin.core.log.Log
        message: "MLflow model accuracy compliant: {{ outputs.inspect_latest_run_metrics.vars.accuracy }} (threshold: {{ inputs.min_accuracy_threshold }})."

outputs:
  - id: is_breach
    type: BOOLEAN
    value: "{{ outputs.inspect_latest_run_metrics.vars.is_breach }}"
  - id: accuracy
    type: NUMBER
    value: "{{ outputs.inspect_latest_run_metrics.vars.accuracy }}"
  - id: run_id
    type: STRING
    value: "{{ outputs.inspect_latest_run_metrics.vars.run_id }}"

triggers:
  - id: scheduled_mlflow_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"
    disabled: true

extend:
  title: MLflow Experiment Run Metrics Drift Sentinel
  metaTitle: MLflow Metrics Drift Sentinel | Kestra Blueprint
  shortDescription: Audits MLflow experiment runs to detect model accuracy regression drift and alert on Slack.
  metaDescription: Audits MLflow Tracking Server experiment runs to evaluate model validation accuracy and detect quality regression drift.
  description: |
    Audits MLflow Tracking Server experiment runs to evaluate model validation accuracy and detect quality regression drift before models deploy to production.
  tags:
    - AI
    - Data
