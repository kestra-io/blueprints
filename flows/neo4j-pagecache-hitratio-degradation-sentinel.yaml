id: neo4j-pagecache-hitratio-degradation-sentinel
namespace: company.ai
inputs:
- id: neo4j_metrics_url
  type: STRING
  defaults: http://neo4j.internal:2004/metrics
  description: Prometheus metrics endpoint for Neo4j DBMS.
- id: min_hit_ratio
  type: FLOAT
  defaults: 0.95
  description: Minimum acceptable PageCache hit ratio before alerting (default 0.95
    = 95%).
tasks:
- id: query_neo4j_metrics
  type: io.kestra.plugin.scripts.python.Script
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
  - pip install requests kestra
  env:
    NEO4J_METRICS_URL: '{{ inputs.neo4j_metrics_url }}'
  script: "import os\nimport sys\nimport requests\nfrom kestra import Kestra\n\nmetrics_url\
    \ = os.environ.get(\"NEO4J_METRICS_URL\", \"http://neo4j.internal:2004/metrics\"\
    )\n\ntry:\n    resp = requests.get(metrics_url, timeout=10)\n    resp.raise_for_status()\n\
    except Exception as err:\n    sys.stderr.write(f\"Failed to query Neo4j metrics\
    \ endpoint {metrics_url}: {err}\\n\")\n    sys.exit(1)\n\nhit_ratio = None\nfor\
    \ line in resp.text.splitlines():\n    line = line.strip()\n    if line.startswith(\"\
    #\"):\n        continue\n    if \"neo4j_dbms_page_cache_hit_ratio\" in line:\n\
    \        parts = line.split()\n        if len(parts) >= 2:\n            try:\n\
    \                hit_ratio = float(parts[1])\n                break\n        \
    \    except ValueError:\n                pass\n\nif hit_ratio is None:\n    sys.stderr.write(\"\
    Metric 'neo4j_dbms_page_cache_hit_ratio' not found in Neo4j metrics output.\\\
    n\")\n    sys.exit(1)\n\nKestra.outputs({\n    \"hit_ratio\": hit_ratio\n})\n"
- id: evaluate_hit_ratio
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.query_neo4j_metrics.vars.hit_ratio < inputs.min_hit_ratio
    }}'
  then:
  - id: notify_graph_team
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: "{\n  \"channel\": \"#graph-platform\",\n  \"attachments\": [\n    {\n\
      \      \"color\": \"danger\",\n      \"title\": \"\U0001F6A8 Neo4j PageCache\
      \ Hit Ratio Degraded Alert\",\n      \"text\": \"Neo4j DBMS at `{{ inputs.neo4j_metrics_url\
      \ }}` dropped to a PageCache hit ratio of *{{ outputs.query_neo4j_metrics.vars.hit_ratio\
      \ }}* (minimum threshold {{ inputs.min_hit_ratio }})! Graph traversals and Knowledge\
      \ Graph RAG queries are suffering heavy disk I/O thrashing.\",\n      \"footer\"\
      : \"Kestra AI Sentinel \u2022 Neo4j\"\n    }\n  ]\n}"
errors:
- id: alert_pipeline_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: "{\n  \"channel\": \"#graph-platform\",\n  \"attachments\": [\n    {\n\
    \      \"color\": \"danger\",\n      \"title\": \"\u26A0\uFE0F Neo4j Sentinel\
    \ Failure\",\n      \"text\": \"Failed to scrape Neo4j metrics endpoint. Verify\
    \ server address and metrics port.\",\n      \"footer\": \"Kestra Workflow Failure\
    \ Sentinel\"\n    }\n  ]\n}\n"
triggers:
- id: periodic_schedule
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
extend:
  metaDescription: Monitors Neo4j Graph DBMS for PageCache hit ratio degradation to
    prevent severe disk I/O thrashing.
  metaTitle: Neo4j Graph Database PageCache Hit Ratio Degradation Sentinel with Kestra
  title: Neo4j Graph Database PageCache Hit Ratio Degradation Sentinel
  shortDescription: Monitors Neo4j Graph DBMS for PageCache hit ratio degradation
    to prevent severe disk I/O thrashing.
  description: '## How it works

    This workflow queries the Prometheus metrics endpoint of Neo4j Enterprise/Community
    (default port `2004`) to monitor `neo4j_dbms_page_cache_hit_ratio`. In Graph RAG,
    entity resolution, and knowledge graph traversals, Neo4j relies on its internal
    PageCache to keep active graph nodes, relationships, and property stores pinned
    in memory. When the hit ratio drops below 95%, queries are forced to read raw
    store files from disk storage, increasing query latency by orders of magnitude.
    This workflow continuously validates PageCache performance and alerts teams when
    cache starvation occurs.


    ## What you get

    - Real-time detection of graph database memory pressure and disk thrashing.

    - Prevents knowledge graph traversal and Cypher query timeouts in RAG pipelines.

    - Quantitative metrics on cache efficiency.


    ## Who it''s for

    - Graph Database Administrators and Knowledge Graph Engineers managing Neo4j.

    - AI Platform Engineers supporting Graph-RAG application backends.


    ## Why orchestrate this with Kestra

    - **Continuous Engine Health Auditing**: Periodically polls graph engine performance
    metrics.

    - **Decoupled Monitoring**: Audits DBMS health without competing for database
    execution threads.

    - **Actionable Escalation**: Delivers incident notifications with cache hit ratios
    to on-call teams.


    ## Prerequisites

    - Neo4j database instance with Prometheus metrics exporter enabled.

    - Secret `SLACK_WEBHOOK` configured in Kestra.


    ## Quick start

    1. Import the blueprint.

    2. Provide your Neo4j metrics URL.

    3. Run the workflow to inspect current PageCache efficiency.


    ## How to extend

    - Analyze `dbms.memory.pagecache.size` recommendations via Neo4j Cypher system
    procedures.

    - Correlate with transaction commit latency metrics.


    ## Links

    - [Neo4j Metrics and Monitoring](https://neo4j.com/docs/operations-manual/current/monitoring/metrics/)

    - [Kestra Documentation](https://kestra.io/docs)

    '
  tags:
  - AI
  - Data
  subTags:
  - Agents & Structured Output
  - ELT & Data Landing
  ee: false
  demo: false
outputs:
- id: hit_ratio
  type: FLOAT
  value: '{{ outputs.query_neo4j_metrics.vars.hit_ratio }}'
