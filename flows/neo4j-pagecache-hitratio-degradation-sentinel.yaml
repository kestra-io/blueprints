id: neo4j-pagecache-hitratio-degradation-sentinel
namespace: company.ai

inputs:
  - id: neo4j_metrics_url
    type: STRING
    defaults: "http://neo4j.internal:2004/metrics"
    description: Prometheus metrics endpoint for Neo4j DBMS.
  - id: min_hit_ratio
    type: FLOAT
    defaults: 0.95
    description: "Minimum acceptable PageCache hit ratio before alerting (default 0.95 = 95%)."

tasks:
  - id: query_neo4j_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.neo4j_metrics_url }}" > /tmp/neo4j_metrics.txt
        
        # Scrape neo4j_dbms_page_cache_hit_ratio metric
        HIT_RATIO=$(grep -E "^neo4j_dbms_page_cache_hit_ratio" /tmp/neo4j_metrics.txt | awk '{print $2+0}' | head -n 1)
        echo "::set-output name=hit_ratio::${HIT_RATIO:-1.0}::"

  - id: evaluate_hit_ratio
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_neo4j_metrics.vars.hit_ratio | float < inputs.min_hit_ratio }}"
    then:
      - id: notify_graph_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#graph-platform",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Neo4j PageCache Hit Ratio Degraded Alert",
                "text": "Neo4j DBMS at `{{ inputs.neo4j_metrics_url }}` dropped to a PageCache hit ratio of *{{ outputs.query_neo4j_metrics.vars.hit_ratio }}* (minimum threshold {{ inputs.min_hit_ratio }})! Graph traversals and Knowledge Graph RAG queries are suffering heavy disk I/O thrashing.",
                "footer": "Kestra AI Sentinel • Neo4j"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#graph-platform",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Neo4j Sentinel Failure",
            "text": "Failed to scrape Neo4j metrics endpoint. Verify server address and metrics port.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Neo4j Graph Database PageCache Hit Ratio Degradation Sentinel
  shortDescription: Monitors Neo4j Graph DBMS for PageCache hit ratio degradation to prevent severe disk I/O thrashing.
  description: |
    ## How it works
    This workflow queries the Prometheus metrics endpoint of Neo4j Enterprise/Community (default port `2004`) to monitor `neo4j_dbms_page_cache_hit_ratio`. In Graph RAG, entity resolution, and knowledge graph traversals, Neo4j relies on its internal PageCache to keep active graph nodes, relationships, and property stores pinned in memory. When the hit ratio drops below 95%, queries are forced to read raw store files from disk storage, increasing query latency by orders of magnitude. This workflow continuously validates PageCache performance and alerts teams when cache starvation occurs.

    ## What you get
    - Real-time detection of graph database memory pressure and disk thrashing.
    - Prevents knowledge graph traversal and Cypher query timeouts in RAG pipelines.
    - Quantitative metrics on cache efficiency.

    ## Who it's for
    - Graph Database Administrators and Knowledge Graph Engineers managing Neo4j.
    - AI Platform Engineers supporting Graph-RAG application backends.

    ## Why orchestrate this with Kestra
    - **Continuous Engine Health Auditing**: Periodically polls graph engine performance metrics.
    - **Decoupled Monitoring**: Audits DBMS health without competing for database execution threads.
    - **Actionable Escalation**: Delivers incident notifications with cache hit ratios to on-call teams.

    ## Prerequisites
    - Neo4j database instance with Prometheus metrics exporter enabled.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Provide your Neo4j metrics URL.
    3. Run the workflow to inspect current PageCache efficiency.

    ## How to extend
    - Analyze `dbms.memory.pagecache.size` recommendations via Neo4j Cypher system procedures.
    - Correlate with transaction commit latency metrics.

    ## Links
    - [Neo4j Metrics and Monitoring](https://neo4j.com/docs/operations-manual/current/monitoring/metrics/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - AI
    - Data
  ee: false
  demo: false
