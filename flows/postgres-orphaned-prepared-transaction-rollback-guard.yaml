id: postgres-orphaned-prepared-transaction-rollback-guard
namespace: company.team

description: |
  Find and roll back orphaned two-phase commit (2PC) prepared transactions in PostgreSQL.
  Prepared transactions abandoned by distributed transaction managers survive client disconnects
  and database restarts, holding open row locks and pinning the cluster-wide xmin horizon.
  When xmin is held back, autovacuum cannot clean dead tuples from any table, causing runaway
  table bloat and accelerating transaction ID wraparound risk. The flow audits pg_prepared_xacts,
  alerts Slack, gates rollbacks behind operator approval and safety ceilings, rolls back each orphan
  sequentially, and verifies the catalog has cleared.

inputs:
  - id: postgres_url
    type: STRING
    defaults: jdbc:postgresql://localhost:5432/postgres
    description: JDBC connection URL for the target PostgreSQL database.
  - id: use_secret_auth
    type: BOOL
    defaults: true
    description: When true, reads credentials from POSTGRES_USERNAME and POSTGRES_PASSWORD secrets. Set false only in disposable test environments.
  - id: postgres_username
    type: STRING
    defaults: postgres
    description: Username used only when use_secret_auth is false. Ignored in production.
  - id: postgres_password
    type: STRING
    defaults: ""
    description: Password used only when use_secret_auth is false. Ignored in production.
  - id: min_age_minutes
    type: INT
    defaults: 60
    description: Minimum age in minutes before a prepared transaction is treated as an abandoned orphan. Legitimate two-phase commits resolve within seconds.
  - id: max_rollbacks
    type: INT
    defaults: 20
    description: Safety ceiling on the number of prepared transactions permitted to roll back in a single run. Protects against mass rollbacks during distributed coordinator network partitions.
  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, reports detected orphaned prepared transactions without executing ROLLBACK PREPARED.
  - id: auto_remediate
    type: BOOL
    defaults: false
    description: When true and dry_run is false, proceeds past the approval gate to roll back targeted prepared transactions.

triggers:
  - id: hourly_prepared_xacts_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Hourly audit for abandoned prepared transactions. Shipped disabled by default and pinned to safe reporting mode.
    cron: "0 * * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

tasks:
  - id: detect
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Scan pg_prepared_xacts for prepared transactions older than min_age_minutes in the current database.
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
    fetchType: FETCH
    sql: |
      SELECT
        gid,
        prepared,
        owner,
        database,
        ROUND(EXTRACT(EPOCH FROM (now() - prepared)) / 60.0, 1) AS age_minutes,
        'ROLLBACK PREPARED ' || quote_literal(gid) || ';' AS rollback_sql
      FROM pg_prepared_xacts
      WHERE database = current_database()
        AND prepared < now() - ({{ inputs.min_age_minutes }} || ' minutes')::interval
      ORDER BY prepared ASC;

  - id: summarize
    type: io.kestra.plugin.core.output.OutputValues
    description: Build formatted target summary strings and JSON payloads for alerts and remediation loops.
    values:
      names: >-
        {{ outputs.detect.rows | jq('map(.gid + " [owner=" + .owner + ", age=" + (.age_minutes | tostring) + "m]") | join(" | ")') | first }}
      targets_json: "{{ outputs.detect.rows | toJson }}"

  - id: log_detect
    type: io.kestra.plugin.core.log.Log
    description: Record detection counts and execution parameters.
    message: |
      PostgreSQL prepared transactions audit: {{ outputs.detect.size }} orphan(s) found older than {{ inputs.min_age_minutes }}m.
      Targets: {{ outputs.summarize.values.names }}
      Parameters: dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}, max_rollbacks={{ inputs.max_rollbacks }}

  - id: guard
    type: io.kestra.plugin.core.flow.If
    description: Branch based on whether orphaned prepared transactions were detected.
    condition: "{{ outputs.detect.size > 0 }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch Slack alert card detailing detected orphaned transactions and pinned vacuum risks.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "PostgreSQL Prepared Transaction Guard: {{ outputs.detect.size }} orphaned prepared transaction(s) detected on {{ inputs.postgres_url }}. These transactions pin the cluster xmin horizon and block autovacuum dead-tuple cleanup. Targets: {{ outputs.summarize.values.names }}. dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}."}

      - id: ceiling_check
        type: io.kestra.plugin.core.flow.If
        description: Enforce safety ceiling to prevent unintended mass rollbacks if a coordinator temporarily partitions.
        condition: "{{ outputs.detect.size > inputs.max_rollbacks }}"
        then:
          - id: fail_ceiling_breach
            type: io.kestra.plugin.core.execution.Fail
            description: Abort execution when detected orphan count exceeds safe operational limits.
            errorMessage: "Found {{ outputs.detect.size }} prepared transactions, exceeding maximum safety ceiling of {{ inputs.max_rollbacks }}. Investigate coordinator status manually."

      - id: mode
        type: io.kestra.plugin.core.flow.If
        description: Evaluate whether active remediation prerequisites and safety flags are satisfied.
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.detect.size > 0 and outputs.detect.size <= inputs.max_rollbacks }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: Pause execution for operator confirmation before executing destructive ROLLBACK PREPARED statements.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: Set true to confirm and execute rollback of listed prepared transactions.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            description: Proceed with rollbacks only when explicitly approved by an operator.
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: rollback_loop
                type: io.kestra.plugin.core.flow.Loop
                description: Iterate sequentially over each targeted orphan to execute ROLLBACK PREPARED.
                concurrencyLimit: 1
                values: "{{ outputs.summarize.values.targets_json }}"
                tasks:
                  - id: rollback_one
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    description: Execute ROLLBACK PREPARED for a single global transaction identifier.
                    url: "{{ inputs.postgres_url }}"
                    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).rollback_sql }}"

                  - id: log_rollback
                    type: io.kestra.plugin.core.log.Log
                    description: Record successful statement execution for each transaction identifier.
                    message: "Rolled back prepared transaction: gid={{ fromJson(item.value).gid }}, owner={{ fromJson(item.value).owner }}, age={{ fromJson(item.value).age_minutes }}m."

              - id: reverify
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: Re-query pg_prepared_xacts to confirm targeted orphaned transactions have cleared.
                url: "{{ inputs.postgres_url }}"
                username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                fetchType: FETCH
                sql: |
                  SELECT gid, prepared, owner, database FROM pg_prepared_xacts
                  WHERE database = current_database()
                    AND prepared < now() - ({{ inputs.min_age_minutes }} || ' minutes')::interval;

              - id: assert_clean
                type: io.kestra.plugin.core.flow.If
                description: Assert that zero orphaned prepared transactions remain in the catalog.
                condition: "{{ outputs.reverify.size > 0 }}"
                then:
                  - id: fail_unresolved_orphans
                    type: io.kestra.plugin.core.execution.Fail
                    description: Raise execution failure if any targeted prepared transaction survived rollback.
                    errorMessage: "Verification failed: {{ outputs.reverify.size }} prepared transaction(s) still remain in pg_prepared_xacts after rollback."

              - id: notify_resolution
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                description: Dispatch Slack confirmation once transactions are rolled back and verified.
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                payload: |
                  {"text": "PostgreSQL Prepared Transaction Guard: Successfully rolled back {{ outputs.detect.size }} orphaned prepared transaction(s) on {{ inputs.postgres_url }}. Cluster xmin horizon unblocked and verified clean against pg_prepared_xacts."}
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record compliant database state when no orphaned prepared transactions are found.
        message: "PostgreSQL pg_prepared_xacts audit clean. Zero prepared transactions older than {{ inputs.min_age_minutes }} minutes."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch emergency alert to Slack if flow execution fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "PostgreSQL Prepared Transaction Guard FAILED on {{ inputs.postgres_url }} (execution {{ execution.id }}). Check database connectivity, role privileges (requires superuser or owning role), or task error logs."}

extend:
  title: Roll back orphaned prepared transactions holding back PostgreSQL vacuum
  metaTitle: PostgreSQL Orphaned Prepared Transaction Rollback Guard
  shortDescription: Find and roll back orphaned two-phase commit (2PC) prepared transactions before they pin the xmin horizon and bloat PostgreSQL tables.
  metaDescription: Roll back orphaned PostgreSQL 2PC prepared transactions with Kestra. Release pinned xmin horizons, unblock autovacuum, and verify rollback safely.
  description: |
    When distributed transaction managers, microservices, or external orchestrators use two-phase commits (2PC) via `PREPARE TRANSACTION`, prepared transactions are written to disk in `pg_twophase`. Unlike standard backend connections, prepared transactions survive client disconnects, network drops, and database restarts. If a distributed coordinator crashes or loses track of a transaction before issuing a commit or rollback, that transaction remains open indefinitely.

    An orphaned prepared transaction holds exclusive locks on modified rows and tables, blocking subsequent DDL and conflicting writes. More critically, an open prepared transaction pins the cluster-wide transaction horizon (`xmin`). As long as an old prepared transaction exists, PostgreSQL `autovacuum` cannot reclaim dead tuples generated after that transaction across any table in the database. This leads to runaway table and index bloat, disk exhaustion, degraded sequential scan performance, and eventually forces the cluster into emergency read-only mode to prevent transaction ID wraparound.

    This blueprint audits `pg_prepared_xacts` for transactions exceeding an operational age threshold. When abandoned branches are detected, it alerts Slack with the exact identifiers, enforces a safe rollback ceiling, gates destructive action behind human approval (`Pause`), sequentially executes `ROLLBACK PREPARED`, and re-queries PostgreSQL to verify the catalog has cleared.

    ## How it works

    1. `detect` (`io.kestra.plugin.jdbc.postgresql.Query`) queries `pg_prepared_xacts` for transactions older than `min_age_minutes` in `current_database()`, assembling `ROLLBACK PREPARED 'gid';` statements via PostgreSQL's built-in `quote_literal()` function.
    2. `summarize` (`io.kestra.plugin.core.output.OutputValues`) builds human-readable Slack text and JSON payloads for alerts and loops.
    3. `log_detect` (`io.kestra.plugin.core.log.Log`) logs detection counts, transaction identifiers, and parameters.
    4. `guard` (`io.kestra.plugin.core.flow.If`) branches on detection:
       - If orphans exist: `findings_alert` alerts Slack. `ceiling_check` confirms count <= `max_rollbacks`. When `auto_remediate: true` and `dry_run: false`, `approval_gate` pauses for operator approval.
       - Upon approval, `rollback_loop` iterates with `concurrencyLimit: 1` to execute `ROLLBACK PREPARED`.
       - `reverify` and `assert_clean` re-query `pg_prepared_xacts` to prove transactions are gone, failing if any survived.
       - `notify_resolution` sends a success card to Slack.
       - If clean: `log_clean` records nominal database state.
    5. `errors` catches connection failures or insufficient privileges and dispatches an alert to Slack.

    ## What you get
    - Automated detection of abandoned two-phase commits invisible to standard `pg_stat_activity` process monitoring.
    - Protection against cluster-wide autovacuum stalls and catastrophic table bloat caused by pinned `xmin` horizons.
    - Multi-layered safety controls: `dry_run: true` default, `min_age_minutes` filter, `max_rollbacks` safety ceiling, and an interactive `Pause` approval gate.
    - Double-check verification readback confirming all targeted transactions were cleanly aborted.

    ## Who it's for
    - Database Administrators (DBAs) and Site Reliability Engineers managing PostgreSQL in distributed microservice architectures.
    - Platform teams running distributed transaction coordinators (e.g. Narayana, Bitronix, Atomikos, Kafka Connect XA sinks, or custom two-phase commit protocols).
    - Anyone troubleshooting unexplained PostgreSQL table bloat where `pg_stat_activity` shows no active long-running queries.

    ## Why orchestrate this with Kestra
    PostgreSQL provides no automated background daemon to clean up abandoned prepared transactions; the engine assumes an external coordinator will eventually resolve them. Cron scripts running raw `ROLLBACK PREPARED` statements lack visibility, can abort active transactions during transient network hiccups, and offer no audit trail.
    Orchestrating this with Kestra provides scheduled governance with safety gates. Findings are presented in Slack with full operational context. Destructive rollbacks require explicit human sign-off via interactive Kestra UI controls. Every executed statement, execution duration, and post-remediation verification readback is permanently logged in Kestra's execution history.

    ## Pitfalls
    - **Transaction block restriction:** `ROLLBACK PREPARED` cannot execute inside a multi-statement transaction block (`BEGIN ... COMMIT`). The flow executes each rollback as a standalone top-level statement per loop iteration (`transaction: false`).
    - **Rolling back active transactions:** Two-phase commits take a few seconds during normal distributed execution. Setting `min_age_minutes` too low (e.g. under 10 minutes) risks rolling back a legitimate in-flight transaction during transient coordinator latency. The default 60-minute threshold protects legitimate workloads.
    - **Privilege requirements:** `ROLLBACK PREPARED` can only be executed by a PostgreSQL superuser or by the role that initially issued `PREPARE TRANSACTION`. Connecting as an unprivileged application role will result in an `insufficient privilege` error.
    - **Database scope:** Prepared transactions are global to the cluster instance, but tables touched belong to specific databases. The query explicitly filters by `database = current_database()`. Run this flow per database or provide distinct JDBC targets.
    - **Coordinator split-brain:** If a distributed coordinator was partitioned and later attempts to commit a transaction that has been rolled back, the coordinator will receive an unknown transaction identifier error. The flow logs exact transaction identifiers (`gid`) so application teams can reconcile distributed state.

    ## Prerequisites
    - PostgreSQL 12 or higher with `max_prepared_transactions > 0` (if set to 0, prepared transactions are disabled on the server).
    - Connecting role must have superuser permissions or match the owner of the prepared transactions to execute `ROLLBACK PREPARED`.
    - Network connectivity from Kestra to the PostgreSQL JDBC endpoint.
    - Slack incoming webhook endpoint for notifications.

    ### Secrets
    - `POSTGRES_USERNAME`: PostgreSQL database username.
    - `POSTGRES_PASSWORD`: PostgreSQL database user password.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for alert and resolution notifications.

    ### Inputs
    | Input | Default | Purpose |
    |---|---|---|
    | `postgres_url` | `jdbc:postgresql://localhost:5432/postgres` | JDBC endpoint of the target database |
    | `use_secret_auth` | `true` | When true, retrieves credentials from secrets |
    | `postgres_username` | `postgres` | Username used when use_secret_auth is false |
    | `postgres_password` | empty | Password used when use_secret_auth is false |
    | `min_age_minutes` | `60` | Minimum duration in minutes before a transaction is an orphan |
    | `max_rollbacks` | `20` | Maximum number of transactions permitted to roll back in one execution |
    | `dry_run` | `true` | Must be false to execute rollbacks |
    | `auto_remediate` | `false` | Must be true to trigger operator approval and rollbacks |

    ### Outputs
    - `outputs.detect.size`: Count of orphaned prepared transactions identified.
    - `outputs.detect.rows`: Candidate transaction records (`gid`, `prepared`, `owner`, `age_minutes`).
    - `outputs.summarize.values.names`: Formatted summary string for notification cards.
    - `outputs.reverify.size`: Remaining prepared transactions after rollback (0 on verified resolution).

    ## Quick start
    1. Add `POSTGRES_USERNAME`, `POSTGRES_PASSWORD`, and `SLACK_WEBHOOK_URL` to your Kestra namespace secrets.
    2. Import the flow and run a test execution with default parameters (`dry_run: true`).
    3. Review the execution logs or Slack notification to see any detected prepared transactions, their owners, and elapsed age.
    4. To remediate an orphaned transaction, trigger an execution with `dry_run: false` and `auto_remediate: true`. When execution pauses at `approval_gate`, inspect the listed `gid` targets, set `approved: true`, and resume.
    5. Verify in the execution log that `assert_clean` passed and Slack received the resolution confirmation.
    6. Enable `hourly_prepared_xacts_check` to maintain continuous background protection.

    ## How to extend
    - Route persistent findings to PagerDuty or Opsgenie if orphaned transactions exceed 24 hours without resolution.
    - Add automated coordinator lookup: integrate an HTTP request task to query distributed transaction managers (e.g. Narayana or Spring Boot actuator endpoints) to check coordinator status before proposing rollback.
    - Loop across multiple database endpoints in a cluster by passing an array of JDBC URLs.

    ## Links
    - [PostgreSQL Two-Phase Commit Overview](https://www.postgresql.org/docs/current/two-phase.html)
    - [PostgreSQL pg_prepared_xacts Documentation](https://www.postgresql.org/docs/current/view-pg-prepared-xacts.html)
    - [PostgreSQL ROLLBACK PREPARED Reference](https://www.postgresql.org/docs/current/sql-rollback-prepared.html)
    - [Kestra PostgreSQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-postgres)
