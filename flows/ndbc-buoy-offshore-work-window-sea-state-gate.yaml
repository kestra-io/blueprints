id: ndbc-buoy-offshore-work-window-sea-state-gate
namespace: company.team

description: |
  Hourly GO / NO-GO gate for offshore crew transfers from NOAA NDBC buoy wave height and wind gust,
  with a settling window, posting to Slack only when a site's status changes.

inputs:
  - id: sites
    type: JSON
    displayName: Work sites and buoys
    description: >-
      One object per site: `site`, `wave_station` (NDBC id of the buoy that measures waves) and optionally
      `wind_station` (a nearby station that measures wind, for wave-only buoys such as the Scripps Waverider
      buoys), `hs_limit_m` and `gust_limit_ms` to override the flow-wide limits. Leave out `wind_station`
      to read wind from the wave buoy. Site names and limits are examples; observations come from the live API.
    defaults: |
      [
        {"site": "Vineyard Wind 1 transit (Nantucket Sound)", "wave_station": "44020"},
        {"site": "Revolution Wind", "wave_station": "44097", "wind_station": "BUZM3"},
        {"site": "Empire Wind 1", "wave_station": "44025", "wind_station": "44065", "hs_limit_m": 2.0},
        {"site": "Coastal Virginia Offshore Wind", "wave_station": "44099"}
      ]

  - id: hs_limit_m
    type: FLOAT
    displayName: Significant wave height limit (m)
    description: Typical crew transfer vessel limit. Use the limit from your marine coordination procedures.
    defaults: 1.5

  - id: gust_limit_ms
    type: FLOAT
    displayName: Wind gust limit (m/s)
    defaults: 12.0

  - id: settle_hours
    type: INT
    displayName: Settling window (hours)
    description: A site only turns GO when the peak wave height and gust of the last N hours are under the limits, so one calm reading between two big sets does not open the window.
    defaults: 3

  - id: stale_hours
    type: FLOAT
    displayName: Stale after (hours)
    description: A site whose newest wave reading is older than this is NO_DATA, never GO. Wind older than this counts as not measured.
    defaults: 3

  - id: state_key
    type: STRING
    displayName: KV state key
    defaults: offshore_work_window_status

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "20 * * * *"
    description: Most buoys report waves every 30 or 60 minutes and NDBC publishes them within about 15 minutes.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: fetch_active_stations
    type: io.kestra.plugin.core.http.Download
    description: One request lists every active NDBC station with its name, position and whether it reports meteorological and wave data (`met="y"`). Stations with `met="n"` have no real-time file.
    uri: https://www.ndbc.noaa.gov/activestations.xml
    headers:
      User-Agent: kestra-ndbc-offshore-work-window/1.0 (https://kestra.io)
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempts: 4

  - id: match_sites
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Station ids are upper-cased (the real-time files are case-sensitive, `buzm3.txt` is a 404 while `BUZM3.txt` works). Unknown or non-reporting stations are listed instead of failing the loop, and each station is downloaded once even when several sites share it.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      active.xml: "{{ outputs.fetch_active_stations.uri }}"
      sites.json: "{{ inputs.sites | toJson }}"
    outputFiles:
      - sites_parquet
    sql: |
      CREATE TABLE st AS
      SELECT upper(regexp_extract(x, ' id="([^"]*)"', 1)) AS station, regexp_extract(x, ' name="([^"]*)"', 1) AS station_name,
             regexp_extract(x, ' met="([^"]*)"', 1) = 'y' AS reports_met
      FROM (SELECT unnest(regexp_extract_all(content, '<station [^>]*>')) AS x FROM read_text('active.xml'));

      CREATE TABLE cfg AS
      SELECT row_number() OVER () AS ord, coalesce(s->>'$.site', s->>'$.wave_station') AS site,
             upper(trim(s->>'$.wave_station')) AS wave_station,
             upper(trim(coalesce(s->>'$.wind_station', s->>'$.wave_station'))) AS wind_station,
             coalesce(TRY_CAST(s->>'$.hs_limit_m' AS DOUBLE), {{ inputs.hs_limit_m }}) AS hs_limit,
             coalesce(TRY_CAST(s->>'$.gust_limit_ms' AS DOUBLE), {{ inputs.gust_limit_ms }}) AS gust_limit
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('sites.json'));

      CREATE TABLE used AS
      SELECT DISTINCT u.station, st.station_name, coalesce(st.reports_met, false) AS ok
      FROM (SELECT wave_station AS station FROM cfg UNION SELECT wind_station FROM cfg) u LEFT JOIN st USING (station);

      COPY (
        SELECT c.*, w.station_name AS wave_station_name, coalesce(d.ok, false) AS wind_ok
        FROM cfg c JOIN used w ON w.station = c.wave_station AND w.ok LEFT JOIN used d ON d.station = c.wind_station
        ORDER BY ord
      ) TO '{{ outputFiles.sites_parquet }}' (FORMAT PARQUET);

      SELECT (SELECT count(*) FROM cfg c JOIN used w ON w.station = c.wave_station AND w.ok) AS usable_sites,
             coalesce((SELECT string_agg(station, ', ' ORDER BY station) FROM used WHERE NOT ok), '') AS unknown_stations,
             coalesce(CAST(to_json((SELECT list(json_object('station', station, 'settle_hours', {{ inputs.settle_hours }}) ORDER BY station) FROM used WHERE ok)) AS VARCHAR), '[]') AS loop_items;

  - id: require_sites
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ outputs.match_sites.outputs[0].row.usable_sites == 0 }}"
    errorMessage: "No site has an active NDBC wave station. Unknown or non-reporting: {{ outputs.match_sites.outputs[0].row.unknown_stations }}"

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: Last status per site. Missing on the first run (BASELINE), when every site reports its current status once.

  - id: per_station
    type: io.kestra.plugin.core.flow.Loop
    description: Each station's real-time file holds 45 days of observations, newest first. Values the summary needs travel in the loop item.
    values: "{{ outputs.match_sites.outputs[0].row.loop_items }}"
    concurrencyLimit: 3
    tasks:
      - id: fetch_obs
        type: io.kestra.plugin.core.http.Download
        uri: "https://www.ndbc.noaa.gov/data/realtime2/{{ fromJson(item.value).station }}.txt"
        headers:
          User-Agent: kestra-ndbc-offshore-work-window/1.0 (https://kestra.io)
        retry:
          type: exponential
          interval: PT30S
          maxInterval: PT5M
          maxAttempts: 4

      - id: summarise_obs
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: |
          The file is whitespace-separated with `MM` for missing values. Wind is reported every 10 minutes and
          waves only every 20 to 60 minutes, so the latest wave and the latest wind reading are taken separately,
          each with its own timestamp. The wave trend is the least-squares slope of the last 3 hours in m/h.
        url: "jdbc:duckdb:"
        fetchType: FETCH_ONE
        inputFiles:
          obs.txt: "{{ outputs.fetch_obs.uri }}"
        sql: |
          SET TimeZone = 'UTC';
          CREATE TABLE m AS
          SELECT make_timestamptz(CAST(f[1] AS INT), CAST(f[2] AS INT), CAST(f[3] AS INT), CAST(f[4] AS INT), CAST(f[5] AS INT), 0.0) AS ts,
                 TRY_CAST(f[7] AS DOUBLE) AS wspd, TRY_CAST(f[8] AS DOUBLE) AS gst,
                 TRY_CAST(f[9] AS DOUBLE) AS hs, TRY_CAST(f[10] AS DOUBLE) AS dpd
          FROM (SELECT regexp_split_to_array(trim(l), '\s+') AS f
                FROM (SELECT unnest(string_split(content, chr(10))) AS l FROM read_text('obs.txt'))
                WHERE l NOT LIKE '#%' AND length(trim(l)) > 0);
          CREATE TABLE wv AS SELECT ts, hs, dpd FROM m WHERE hs IS NOT NULL;
          CREATE TABLE wd AS SELECT ts, coalesce(gst, wspd) AS gust, wspd FROM m WHERE coalesce(gst, wspd) IS NOT NULL;
          SELECT '{{ fromJson(item.value).station }}' AS station,
                 (SELECT strftime(max(ts), '%Y-%m-%d %H:%M UTC') FROM wv) AS wave_at,
                 (SELECT round(date_diff('minute', max(ts), now()) / 60.0, 1) FROM wv) AS wave_age_h,
                 (SELECT arg_max(hs, ts) FROM wv) AS hs,
                 (SELECT arg_max(dpd, ts) FROM wv) AS dpd,
                 (SELECT max(hs) FROM wv WHERE ts > (SELECT max(ts) FROM wv) - to_hours({{ fromJson(item.value).settle_hours }})) AS hs_peak,
                 (SELECT round(regr_slope(hs, epoch(ts)) * 3600, 2) FROM wv WHERE ts > (SELECT max(ts) FROM wv) - to_hours(3)) AS hs_trend_m_per_h,
                 (SELECT round(date_diff('minute', max(ts), now()) / 60.0, 1) FROM wd) AS wind_age_h,
                 (SELECT arg_max(gust, ts) FROM wd) AS gust,
                 (SELECT arg_max(wspd, ts) FROM wd) AS wspd,
                 (SELECT max(gust) FROM wd WHERE ts > (SELECT max(ts) FROM wd) - to_hours({{ fromJson(item.value).settle_hours }})) AS gust_peak;
    outputs:
      - id: stats
        type: STRING
        value: "{{ outputs.summarise_obs.outputs[0].row | toJson }}"

  - id: evaluate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      NO_DATA when the newest wave reading is older than `stale_hours` (a silent buoy is never a GO). NO_GO when
      the latest wave height or gust is over the limit, or when the peak of the settling window still is. GO
      otherwise. When the wind station has no recent wind (sensor out, or a wave-only buoy without `wind_station`),
      the decision is made on waves alone and flagged.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      sites.parquet: "{{ outputs.match_sites.outputFiles.sites_parquet }}"
      stats.json: "[{% for it in outputs.per_station.outputs %}{{ it.outputs.stats }}{% if not loop.last %},{% endif %}{% endfor %}]"
      state.json: "{{ outputs.previous_state.value ?? '[]' }}"
    outputFiles:
      - status_csv
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE s AS SELECT * FROM read_json('stats.json', format = 'array');
      CREATE TABLE prev AS
      SELECT p->>'$.site' AS site, p->>'$.status' AS prev_status, p->>'$.since' AS prev_since
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS p FROM read_text('state.json'));

      CREATE TABLE e AS
      SELECT c.ord, c.site, c.wave_station, c.wind_station, c.hs_limit, c.gust_limit,
             w.wave_at, w.wave_age_h, w.hs, w.dpd, w.hs_peak, w.hs_trend_m_per_h,
             CASE WHEN c.wind_ok AND d.wind_age_h <= {{ inputs.stale_hours }} THEN d.gust END AS gust,
             CASE WHEN c.wind_ok AND d.wind_age_h <= {{ inputs.stale_hours }} THEN d.gust_peak END AS gust_peak,
             p.prev_status, p.prev_since
      FROM read_parquet('sites.parquet') c
      LEFT JOIN s w ON w.station = c.wave_station
      LEFT JOIN s d ON d.station = c.wind_station
      LEFT JOIN prev p ON p.site = c.site;

      CREATE TABLE r AS
      SELECT *,
             CASE WHEN wave_age_h IS NULL OR wave_age_h > {{ inputs.stale_hours }} THEN 'NO_DATA'
                  WHEN hs > hs_limit OR coalesce(gust, 0) > gust_limit THEN 'NO_GO'
                  WHEN hs_peak > hs_limit OR coalesce(gust_peak, 0) > gust_limit THEN 'NO_GO'
                  ELSE 'GO' END AS status,
             CASE WHEN wave_age_h IS NULL OR wave_age_h > {{ inputs.stale_hours }} THEN coalesce('newest wave reading ' || CAST(wave_age_h AS VARCHAR) || ' h old', 'no wave reading in 45 days')
                  WHEN hs > hs_limit AND coalesce(gust, 0) > gust_limit THEN 'waves and gust over limits'
                  WHEN hs > hs_limit THEN 'waves over limit'
                  WHEN coalesce(gust, 0) > gust_limit THEN 'gust over limit'
                  WHEN hs_peak > hs_limit OR coalesce(gust_peak, 0) > gust_limit THEN 'settling, {{ inputs.settle_hours }} h peak over limit'
                  ELSE 'within limits for {{ inputs.settle_hours }} h' END
               || CASE WHEN gust IS NULL THEN ', wind not measured' ELSE '' END AS reason
      FROM e;

      COPY (
        SELECT site, status, reason, prev_status AS previous_status, wave_station, wave_at AS wave_obs_utc, wave_age_h,
               hs AS hs_m, hs_peak AS hs_peak_m, hs_trend_m_per_h, dpd AS dominant_period_s, hs_limit AS hs_limit_m,
               wind_station, gust AS gust_ms, gust_peak AS gust_peak_ms, gust_limit AS gust_limit_ms
        FROM r ORDER BY ord
      ) TO '{{ outputFiles.status_csv }}' (HEADER, DELIMITER ',');

      SELECT count(*) AS sites,
             (SELECT count(*) FROM prev) = 0 AS is_baseline,
             count(*) FILTER (WHERE status IS DISTINCT FROM prev_status) AS changes,
             count(*) FILTER (WHERE status = 'GO') AS go_sites,
             string_agg(site || ' ' || status || ' (Hs ' || coalesce(CAST(hs AS VARCHAR), 'n/a') || ' m, gust ' || coalesce(CAST(gust AS VARCHAR) || ' m/s', 'not measured') || ')', '; ' ORDER BY ord) AS status_line,
             coalesce(CAST(to_json(list(json_object(
               'site', site, 'status', status, 'prev', coalesce(prev_status, 'none'), 'reason', reason,
               'hs', hs, 'hs_peak', hs_peak, 'trend', hs_trend_m_per_h, 'dpd', dpd, 'hs_limit', hs_limit, 'wave_station', wave_station, 'wave_at', wave_at,
               'gust', gust, 'gust_limit', gust_limit, 'wind_station', wind_station
             ) ORDER BY ord) FILTER (WHERE status IS DISTINCT FROM prev_status)) AS VARCHAR), '[]') AS change_list,
             CAST(to_json(list(json_object('site', site, 'status', status,
               'since', CASE WHEN status IS DISTINCT FROM prev_status OR prev_since IS NULL THEN strftime(now(), '%Y-%m-%dT%H:%M:%SZ') ELSE prev_since END) ORDER BY ord)) AS VARCHAR) AS new_state
      FROM r;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.evaluate.outputs[0].row.new_state }}"

  - id: on_status_change
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.outputs[0].row.changes > 0 }}"
    then:
      - id: compose
        type: io.kestra.plugin.core.debug.Return
        format: |-
          *Offshore work window update*{{ outputs.evaluate.outputs[0].row.is_baseline ? ' (baseline)' : '' }}: {{ outputs.evaluate.outputs[0].row.changes }} site(s) changed, {{ outputs.evaluate.outputs[0].row.go_sites }} of {{ outputs.evaluate.outputs[0].row.sites }} GO.
          {% for c in fromJson(outputs.evaluate.outputs[0].row.change_list) %}{{ c.status == 'GO' ? ':large_green_circle:' : (c.status == 'NO_GO' ? ':red_circle:' : ':grey_question:') }} *{{ c.site }}*: {{ c.prev }} -> *{{ c.status }}* ({{ c.reason }}).{% if c.hs is not null %} Hs {{ c.hs }} m (limit {{ c.hs_limit }}, peak {{ c.hs_peak }}{% if c.trend is not null %}, trend {{ c.trend >= 0 ? '+' : '' }}{{ c.trend }} m/h{% endif %}{% if c.dpd is not null %}, period {{ c.dpd }} s{% endif %}) at buoy {{ c.wave_station }}, {{ c.wave_at }}.{% endif %}{% if c.gust is not null %} Gust {{ c.gust }} m/s at {{ c.wind_station }} (limit {{ c.gust_limit }}).{% endif %}
          {% endfor %}
      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the run going when `SLACK_WEBHOOK_URL` is not set; the message is still logged and the CSV written.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: "{{ outputs.compose.value }}"
      - id: log_change
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.compose.value }}"
    else:
      - id: log_no_change
        type: io.kestra.plugin.core.log.Log
        message: "No status change: {{ outputs.evaluate.outputs[0].row.status_line }}."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.evaluate.outputs[0].row.sites }} sites, {{ outputs.evaluate.outputs[0].row.go_sites }} GO,
      {{ outputs.evaluate.outputs[0].row.changes }} changes{{ outputs.evaluate.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}.
      {{ outputs.evaluate.outputs[0].row.status_line }}.
      {% if outputs.match_sites.outputs[0].row.unknown_stations != '' %}Unknown or non-reporting stations skipped: {{ outputs.match_sites.outputs[0].row.unknown_stations }}.{% endif %}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.evaluate.outputs[0].row | toJson }}"
  - id: status_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.status_csv }}"

extend:
  title: Offshore Work Window GO / NO-GO Gate from NOAA NDBC Buoy Sea State
  metaTitle: Offshore Crew Transfer Sea State Gate with NOAA NDBC Buoys and DuckDB | Kestra
  shortDescription: Every hour, read observed wave height and wind gust from NOAA NDBC buoys for each offshore work site, require them to stay under the vessel limits for a settling window, and post GO / NO-GO changes to Slack.
  metaDescription: Hourly GO / NO-GO for offshore crew transfers from NOAA NDBC buoy wave height and gusts, with a settling window, stale-buoy handling, KV state and Slack.
  description: |
    Crew transfer vessels at offshore wind farms work to sea-state limits, typically a significant wave height (Hs) around 1.5 m and a gust limit. Forecasts plan the week; the go call on the day uses what the buoys measure. This flow reads NOAA National Data Buoy Center (NDBC) real-time observations for each work site every hour, decides GO, NO_GO or NO_DATA, and tells Slack only when a site's status changes. Default site names and limits are examples; all wave and wind values come from the live NDBC files.

    ## How it works

    1. A `Schedule` trigger runs hourly at minute 20 with `concurrency.limit: 1`.
    2. `fetch_active_stations` downloads `activestations.xml`, one file listing every active station and whether it reports met and wave data. `match_sites` (DuckDB) upper-cases the ids (the real-time files are case-sensitive), lists unknown or non-reporting stations and builds one loop item per distinct station. `require_sites` fails the run if no site has a usable wave buoy.
    3. `per_station` (Loop) downloads `/data/realtime2/{STATION}.txt` (45 days, newest first, `MM` for missing) and DuckDB parses it. Wind is logged every 10 minutes and waves every 20 to 60, so the latest wave and wind readings are taken separately, each with its own timestamp, plus the peak over `settle_hours` and the 3-hour Hs trend.
    4. `evaluate` (DuckDB) joins each site to its wave buoy and its wind station. Wave-only buoys or buoys with a dead anemometer can borrow wind from a nearby `wind_station`; otherwise the decision uses waves alone and is flagged. NO_DATA when the newest wave reading is older than `stale_hours`, NO_GO when the latest Hs or gust is over the limit or the settling-window peak still is, GO otherwise.
    5. `save_state` (KV) stores the status per site. `on_status_change` (If) posts one Slack message with every change, values, limits and trend. On the BASELINE run every site reports once.

    ## What you get

    - Change-only Slack alerts for each site: GO, NO_GO (with the reason) or NO_DATA.
    - A settling window, so one calm reading between big sets does not open the window.
    - A silent buoy is NO_DATA, never GO; missing wind is called out rather than ignored.
    - A per-site CSV (Hs, peak, trend, period, gust, limits, observation time) as a flow output.

    ## Who it's for

    - Marine coordinators and O&M planners at offshore wind farms, and survey or construction teams with weather-limited operations.

    ## Why orchestrate this with Kestra

    - Sites, buoys and limits are inputs, so each vessel class or project is a flow copy, not a code change.
    - KV state turns an hourly poll into change-only alerts; retries cover NDBC hiccups.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins.
    - Outbound HTTPS to `www.ndbc.noaa.gov`. No API key is needed.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for status changes (optional; without it the Slack task fails, the run ends in WARNING and the message is still logged).

    ## Quick start

    1. Import the flow and click **Execute**. The first run is the baseline and reports every site.
    2. Execute again: `No status change` unless a buoy crossed a limit.
    3. Replace `sites` with your projects, buoys and vessel limits, add `SLACK_WEBHOOK_URL` and enable the schedule.

    ## How to extend

    - Add a period limit (short, steep seas at the same Hs are worse for step-over transfers) using the `dpd` column.
    - Trigger a permit-to-work flow on GO, or log each status to a warehouse for weather-downtime reports.

    ## Links

    - [NDBC real-time data files](https://www.ndbc.noaa.gov/faq/rt_data_access.shtml)
    - [NDBC measurement descriptions](https://www.ndbc.noaa.gov/faq/measdes.shtml)
    - [DuckDB Queries task](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Slack incoming webhook task](https://kestra.io/plugins/plugin-slack/slack-notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
