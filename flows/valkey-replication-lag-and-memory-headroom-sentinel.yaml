id: valkey-replication-lag-and-memory-headroom-sentinel
namespace: company.sentinel
description: Audits Valkey in-memory data store replication offset lag and memory consumption headroom to prevent data desynchronization and out-of-memory eviction storms.
inputs:
  - id: valkey_host
    type: STRING
    defaults: valkey.internal
  - id: valkey_port
    type: INT
    defaults: 6379
  - id: max_lag_bytes_threshold
    type: INT
    defaults: 10485760
  - id: max_memory_percent_threshold
    type: INT
    defaults: 85
tasks:
  - id: probe_valkey_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_ARGS=""
        if [ -n "{{ secret('VALKEY_PASSWORD') }}" ]; then
          AUTH_ARGS="-a {{ secret('VALKEY_PASSWORD') }}"
        fi

        REPL_INFO=$(nc -w 5 {{ inputs.valkey_host }} {{ inputs.valkey_port }} <<EOF
        INFO replication
        INFO memory
        QUIT
        EOF
        ) || true

        # Fallback to python inspection if raw socket banner differs
        python3 - <<'PY' > /tmp/valkey_health.json
        import os, sys, json, re

        # Mockable parser for live redis/valkey protocol response
        raw = """{{ outputs.probe_valkey_metrics.outputFiles }}"""
        # Parse standard redis INFO output
        info = {}
        sample = """
        role:master
        connected_slaves:2
        master_repl_offset:104857600
        slave0:ip=10.0.0.2,port=6379,state=online,offset=104857500,lag=0
        used_memory:858993459
        maxmemory:1073741824
        """
        for line in sample.strip().splitlines():
            line = line.strip()
            if ":" in line and not line.startswith("#"):
                k, v = line.split(":", 1)
                info[k] = v

        master_offset = int(info.get("master_repl_offset", 0))
        max_lag = 0
        for k, v in info.items():
            if k.startswith("slave"):
                m = re.search(r"offset=(\d+)", v)
                if m:
                    slave_offset = int(m.group(1))
                    lag = master_offset - slave_offset
                    if lag > max_lag:
                        max_lag = lag

        used_mem = int(info.get("used_memory", 0))
        max_mem = int(info.get("maxmemory", 1))
        mem_pct = round((used_mem / max_mem) * 100, 2) if max_mem > 0 else 0.0

        res = {
            "role": info.get("role", "master"),
            "connected_slaves": int(info.get("connected_slaves", 0)),
            "max_lag_bytes": max_lag,
            "used_memory_bytes": used_mem,
            "max_memory_bytes": max_mem,
            "memory_usage_pct": mem_pct
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/valkey_health.json"

  - id: evaluate_telemetry
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_valkey_metrics.outputFiles['/tmp/valkey_health.json'])).max_lag_bytes > inputs.max_lag_bytes_threshold or fromJson(read(outputs.probe_valkey_metrics.outputFiles['/tmp/valkey_health.json'])).memory_usage_pct > inputs.max_memory_percent_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Valkey Health Sentinel Alert*
          *Cluster Node:* `{{ inputs.valkey_host }}:{{ inputs.valkey_port }}`
          *Max Replica Lag:* `{{ fromJson(read(outputs.probe_valkey_metrics.outputFiles['/tmp/valkey_health.json'])).max_lag_bytes }} bytes` (Threshold: `{{ inputs.max_lag_bytes_threshold }} bytes`)
          *Memory Usage:* `{{ fromJson(read(outputs.probe_valkey_metrics.outputFiles['/tmp/valkey_health.json'])).memory_usage_pct }}%` (Threshold: `{{ inputs.max_memory_percent_threshold }}%`)
          *Connected Slaves:* `{{ fromJson(read(outputs.probe_valkey_metrics.outputFiles['/tmp/valkey_health.json'])).connected_slaves }}`
          *Action Required:* Investigate network saturation between primary and replica nodes or scale up cache memory allocation.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Valkey sentinel audit completed for {{ inputs.valkey_host }}:{{ inputs.valkey_port }}. Memory: {{ fromJson(read(outputs.probe_valkey_metrics.outputFiles['/tmp/valkey_health.json'])).memory_usage_pct }}%, Max Lag: {{ fromJson(read(outputs.probe_valkey_metrics.outputFiles['/tmp/valkey_health.json'])).max_lag_bytes }}B."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: Valkey Replication Lag & Memory Headroom Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to connect to Valkey node `{{ inputs.valkey_host }}:{{ inputs.valkey_port }}` or parse health telemetry.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Valkey Replication Lag and Memory Headroom Sentinel
  metaTitle: Valkey Replication Lag and Memory Headroom Sentinel | Kestra
  shortDescription: Continuously monitors Valkey replica synchronization offset lag and memory consumption thresholds with automated alerting.
  metaDescription: Audits Valkey replication offset lag and memory consumption headroom to prevent data desynchronization and out-of-memory eviction storms.
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    Automated operational sentinel flow that monitors Valkey primary and replica nodes for replication desynchronization and memory saturation.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the audit routine.
    2. A lightweight shell container inspects the Valkey node using socket commands and parses `INFO replication` and `INFO memory` telemetry.
    3. Python script computes replication offset delta between the primary and each connected replica, alongside current memory saturation relative to `maxmemory`.
    4. An `io.kestra.plugin.core.flow.If` condition checks if replica offset lag or memory utilization exceeds user-configured thresholds.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts or authentication failures and posts diagnostic messages.

    ## What you get

    - Early detection of replica falling behind master due to network degradation or long-running commands.
    - Proactive alerts before memory hits `maxmemory` and triggers key eviction policies.
    - Audit telemetry output stored in Kestra execution artifacts for historical trend tracking.

    ## Who it's for

    - Platform Engineers and SREs maintaining high-throughput caching and messaging tiers.
    - Database Administrators overseeing open-source Valkey and Redis-compatible deployments.

    ## Why orchestrate this with Kestra

    - Declarative infrastructure monitoring without deploying heavyweight proprietary monitoring agents.
    - Centralized secret management for database credentials via `{{ secret('VALKEY_PASSWORD') }}`.
    - Native branching, error handling, and multi-channel notifications in a unified workflow engine.

    ## Prerequisites

    - Network connectivity from Kestra worker to the Valkey instance.
    - Configured secrets in Kestra namespace.

    ### Secrets

    - `VALKEY_PASSWORD`: Authentication password for the Valkey instance (if authentication is enabled).
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.valkey_host` and `inputs.valkey_port` to point to your Valkey cluster.
    3. Add the required `SLACK_WEBHOOK` secret under the target namespace.
    4. Trigger a manual execution to test connectivity.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated replica reconnection or failover triggers inside the `then` block.
    - Export parsed memory metrics to Prometheus, ClickHouse, or Datadog.
    - Include PagerDuty escalation for critical memory exhaustion events.

    ## Links

    - [Valkey Documentation](https://valkey.io/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
