id: gitlab-runner-balancer
namespace: company.team

description: |
  Reports how a GitLab CI runner pool is balanced across tags and suggests
  scaling so pipelines stop queuing. A webhook fires when a pipeline has been
  pending past its threshold, the project's online runners and its pending and
  running jobs are read from the GitLab API, and one Python task merges them
  into a per-tag busy versus idle picture with a queue depth and a verdict. An
  If gate escalates when the busy ratio crosses the imbalance ratio or the
  queue backs up, fanning out a reassignment suggestion per idle runner,
  opening a GitHub scaling issue and pinging Slack, while a healthy pool is
  simply logged. The verdict, online runner count, busy ratio and queue depth
  are exposed as typed outputs.

triggers:
  - id: pipeline_pending
    type: io.kestra.plugin.core.trigger.Webhook
    description: Receives the pipeline event posted by the relay once a job has been pending longer than the alerting threshold and starts the balance check.
    key: "{{ secret('GITLAB_WEBHOOK_KEY') }}"
  - id: hourly_rebalance_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled hourly net that would sweep the same runner pool until someone switches it on.
    cron: "0 * * * *"
    disabled: true

inputs:
  - id: project_path
    type: STRING
    defaults: acme-inc%2Fpayments-api
    description: URL-encoded group and project path, or numeric project id, used in both GitLab REST calls, with %2F standing for the slash.
  - id: imbalance_ratio
    type: FLOAT
    defaults: 0.8
    description: Busy ratio above which a tag counts as imbalanced and every idle runner gets a reassignment suggestion.

tasks:
  # --- 1. online runner pool ---
  - id: fetch_online_runners
    type: io.kestra.plugin.core.http.Request
    description: Reads every runner that is currently online for the project so busy and idle runners can be counted per tag.
    method: GET
    uri: "https://gitlab.com/api/v4/projects/{{ inputs.project_path }}/runners?status=online"
    headers:
      PRIVATE-TOKEN: "{{ secret('GITLAB_TOKEN') }}"
      Accept: "application/json"
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT15S
      maxAttempts: 3

  # --- 2. queued and executing jobs ---
  - id: fetch_queued_jobs
    type: io.kestra.plugin.core.http.Request
    description: Reads the pending and running jobs of the project, which give the queue depth and the runner ids that are busy right now.
    method: GET
    uri: "https://gitlab.com/api/v4/projects/{{ inputs.project_path }}/jobs?scope[]=pending&scope[]=running"
    headers:
      PRIVATE-TOKEN: "{{ secret('GITLAB_TOKEN') }}"
      Accept: "application/json"
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT15S
      maxAttempts: 3

  # --- 3. merge both payloads into a balance verdict ---
  - id: compute_balance
    type: io.kestra.plugin.scripts.python.Script
    description: Splits online runners into busy and idle per tag, measures the queue and emits the verdict the gate branches on.
    containerImage: python:3.11-slim
    env:
      IMBALANCE_RATIO: "{{ inputs.imbalance_ratio }}"
    inputFiles:
      runners.json: "{{ outputs.fetch_online_runners.body | toJson }}"
      jobs.json: "{{ outputs.fetch_queued_jobs.body | toJson }}"
    script: |
      import json
      import os

      RUNNERS_FILE = "runners.json"
      JOBS_FILE = "jobs.json"
      QUEUE_LIMIT = 5


      def load(path):
          try:
              with open(path, "r", encoding="utf-8") as handle:
                  raw = handle.read().strip()
          except OSError:
              return None
          if not raw:
              return None
          try:
              data = json.loads(raw)
          except ValueError:
              return None
          while isinstance(data, str):
              try:
                  data = json.loads(data)
              except ValueError:
                  return None
          return data


      def rows_of(payload, key):
          if isinstance(payload, list):
              return payload, True
          if isinstance(payload, dict):
              if isinstance(payload.get(key), list):
                  return payload[key], True
              return [], False
          return [], False


      def safe_ratio(busy, total):
          if total <= 0:
              return 0.0
          return round(float(busy) / float(total), 4)


      def tag_names(runner):
          names = []
          for tag in runner.get("tags") or []:
              name = str(tag).strip().lower()
              if name and name not in names:
                  names.append(name)
          return names


      def imbalance_limit():
          raw = os.environ.get("IMBALANCE_RATIO", "0.8")
          try:
              value = float(raw)
          except ValueError:
              return 0.8
          if value < 0:
              return 0.0
          if value > 1:
              return 1.0
          return value


      def main():
          limit = imbalance_limit()

          runner_rows, runners_ok = rows_of(load(RUNNERS_FILE), "runners")
          job_rows, jobs_ok = rows_of(load(JOBS_FILE), "jobs")

          online = []
          for row in runner_rows:
              if not isinstance(row, dict):
                  continue
              if row.get("status") == "offline" or row.get("online") is False:
                  continue
              online.append(row)

          jobs = [row for row in job_rows if isinstance(row, dict)]
          pending = [j for j in jobs if str(j.get("status") or "").lower() == "pending"]
          running = [j for j in jobs if str(j.get("status") or "").lower() == "running"]
          queue_depth = len(pending)

          busy_ids = set()
          for job in running:
              runner = job.get("runner")
              if isinstance(runner, dict) and runner.get("id") is not None:
                  busy_ids.add(runner.get("id"))
              elif isinstance(runner, (int, float)):
                  busy_ids.add(int(runner))

          busy_runners = [r for r in online if r.get("id") in busy_ids]
          idle_runners = [r for r in online if r.get("id") not in busy_ids]

          tag_totals = {}
          tag_busy = {}
          for runner in online:
              for name in tag_names(runner):
                  tag_totals[name] = tag_totals.get(name, 0) + 1
          for runner in busy_runners:
              for name in tag_names(runner):
                  tag_busy[name] = tag_busy.get(name, 0) + 1

          busy_ratio = safe_ratio(len(busy_runners), len(online))
          if tag_totals:
              worst = 0.0
              for name in sorted(tag_totals):
                  value = safe_ratio(tag_busy.get(name, 0), tag_totals[name])
                  if value > worst:
                      worst = value
              busy_ratio = worst

          if not runners_ok or not jobs_ok:
              verdict = "NO_DATA"
          elif busy_ratio > limit or queue_depth > QUEUE_LIMIT:
              verdict = "SCALE_UP"
          elif not online:
              verdict = "NO_RUNNERS"
          else:
              verdict = "BALANCED"

          result = {
              "verdict": verdict,
              "online_runners": len(online),
              "busy_ratio": busy_ratio,
              "idle_runners": [
                  {
                      "id": runner.get("id"),
                      "description": str(
                          runner.get("description") or runner.get("id") or "unknown"
                      ),
                      "tags": tag_names(runner),
                  }
                  for runner in idle_runners
              ],
              "queue_depth": queue_depth,
          }
          print("::" + json.dumps({"outputs": result}, ensure_ascii=True) + "::")


      main()

  # --- 4. the balance gate ---
  - id: balance_gate
    type: io.kestra.plugin.core.flow.If
    description: Opens when the busiest tag crosses the imbalance ratio or more than five jobs are waiting, otherwise records a healthy pool.
    condition: "{{ outputs.compute_balance.vars.busy_ratio > inputs.imbalance_ratio or outputs.compute_balance.vars.queue_depth > 5 }}"
    then:
      - id: suggest_reassignment
        type: io.kestra.plugin.core.flow.Loop
        description: Walks every idle runner and prints which queued job could be moved onto it.
        values: "{{ outputs.compute_balance.vars.idle_runners | toJson }}"
        concurrencyLimit: 2
        tasks:
          - id: log_reassignment
            type: io.kestra.plugin.core.log.Log
            description: Prints one reassignment suggestion naming the idle runner, its tags and the queue it would relieve.
            message: "Reassign one pending job to idle runner {{ item.value.description }} (id {{ item.value.id }}, tags {{ item.value.tags | join(', ') }}) because {{ outputs.compute_balance.vars.queue_depth }} jobs are queued and the busiest tag sits at {{ outputs.compute_balance.vars.busy_ratio }}."
      - id: open_scaling_issue
        type: io.kestra.plugin.github.issues.Create
        description: Files the scaling request in the ops backlog with the verdict, the counts and the idle runners to use first.
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "acme-inc/platform-ops"
        title: "Scale the GitLab runner pool for {{ inputs.project_path }}"
        body: |
          ## Runner pool balance

          - Verdict: {{ outputs.compute_balance.vars.verdict }}
          - Online runners: {{ outputs.compute_balance.vars.online_runners }}
          - Busiest tag busy ratio: {{ outputs.compute_balance.vars.busy_ratio }} against a threshold of {{ inputs.imbalance_ratio }}
          - Queued jobs: {{ outputs.compute_balance.vars.queue_depth }}
          - Idle runners: {{ outputs.compute_balance.vars.idle_runners | toJson }}

          Add runners for the busiest tag, or point the queued jobs at the idle
          runners listed above, so pipelines stop waiting in the queue.
        labels:
          - gitlab-ci
          - runners
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Pings the build channel so an on-call engineer rebalances the pool before the queue grows further.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"channel": "#ci-ops", "text": "GitLab runner pool for {{ inputs.project_path }} is skewed: verdict {{ outputs.compute_balance.vars.verdict }}, busiest tag at {{ outputs.compute_balance.vars.busy_ratio }}, {{ outputs.compute_balance.vars.queue_depth }} jobs queued, {{ outputs.compute_balance.vars.idle_runners | length }} idle runners ready to take work."}
    else:
      - id: log_balanced
        type: io.kestra.plugin.core.log.Log
        description: Records a healthy pool where the gate stayed closed and no scaling is needed this run.
        message: "Runner pool for {{ inputs.project_path }} is in balance: verdict {{ outputs.compute_balance.vars.verdict }}, {{ outputs.compute_balance.vars.online_runners }} online runners, busy ratio {{ outputs.compute_balance.vars.busy_ratio }}, queue depth {{ outputs.compute_balance.vars.queue_depth }}."

errors:
  - id: notify_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Escalates any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.compute_balance.vars.verdict }}"
  - id: online_runners
    type: INT
    value: "{{ outputs.compute_balance.vars.online_runners }}"
  - id: busy_ratio
    type: FLOAT
    value: "{{ outputs.compute_balance.vars.busy_ratio }}"
  - id: queue_depth
    type: INT
    value: "{{ outputs.compute_balance.vars.queue_depth }}"

extend:
  title: Keep GitLab runner pools balanced so pipelines stop queuing
  metaTitle: GitLab Runner Pool Balance and Scaling Suggestions for CI Queues
  shortDescription: Read a project's online runners and pending jobs, then reassign queued work to idle runners, open a scaling issue and alert Slack when the pool skews.
  metaDescription: Report GitLab CI runner pool balance per tag when a pipeline waits too long, then suggest idle runner reassignments, open a scaling issue and ping Slack.
  description: |
    Pipelines queue when the runner pool for a tag is saturated while other runners sit idle, and nobody notices until the merge queue stalls. This flow fires from a webhook the moment a pipeline has been pending past its threshold, reads the project's online runners and its pending and running jobs from the GitLab API, and merges them into a per-tag busy versus idle picture with a queue depth and a verdict. When the busiest tag crosses the imbalance ratio or more than five jobs are waiting, it fans out a reassignment suggestion for every idle runner, opens a GitHub scaling issue and pings Slack; a balanced pool is logged and exits quietly. The verdict, online runner count, busy ratio and queue depth come back as typed outputs.

    ## How it works

    1. `pipeline_pending` (Webhook) receives the pipeline event posted by the relay once a job has waited longer than the alerting threshold. `hourly_rebalance_sweep` is a disabled Schedule kept as a fallback sweep until someone switches it on.
    2. `fetch_online_runners` (`io.kestra.plugin.core.http.Request`) calls `GET /projects/{path}/runners?status=online` with the `GITLAB_TOKEN` secret and retries on transient failures.
    3. `fetch_queued_jobs` (`io.kestra.plugin.core.http.Request`) calls `GET /projects/{path}/jobs?scope[]=pending&scope[]=running` for the same project, which yields both the queue depth and the runner ids that are busy right now.
    4. `compute_balance` (`io.kestra.plugin.scripts.python.Script`) merges the two payloads. It splits online runners into busy and idle by the runner id attached to each running job, divides busy by online for every tag, keeps the highest per-tag busy ratio, and prints one `::{"outputs": ...}::` line carrying `verdict`, `online_runners`, `busy_ratio`, `idle_runners` and `queue_depth`.
    5. `balance_gate` (`io.kestra.plugin.core.flow.If`) opens when `busy_ratio` is greater than `inputs.imbalance_ratio` or `queue_depth` is greater than 5. Inside it, `suggest_reassignment` (`io.kestra.plugin.core.flow.Loop`) logs one suggestion per idle runner, `open_scaling_issue` (`io.kestra.plugin.github.issues.Create`) files the scaling request, and `notify_slack` posts to the build channel. When the gate stays closed, `log_balanced` records the healthy pool.

    ## What you get

    - `verdict` (STRING): `SCALE_UP` when the busiest tag is over the ratio or more than five jobs are queued, `BALANCED` when the pool can absorb the work, `NO_RUNNERS` when nothing is online, `NO_DATA` when the API answered with something unparseable.
    - `online_runners` (INT): runners the project reports as online for the check.
    - `busy_ratio` (FLOAT): highest busy ratio across the pool's tags, or the whole-pool ratio when runners carry no tags.
    - `queue_depth` (INT): jobs waiting in pending right now.
    - `idle_runners` (ARRAY): online runners with nothing assigned, each with its id, description and tags, which is exactly what the loop iterates.

    ## Who it's for

    - Platform and CI teams running shared GitLab runner fleets who see pipelines queue while some runners sit idle.
    - Infrastructure owners who want a scaling request filed automatically instead of discovering the backlog in a standup.

    ## Why orchestrate this with Kestra

    - Two API reads, a merge step and a branch are one versioned file instead of a cron script nobody owns, and the disabled Schedule is the fallback sweep ready to be switched on.
    - The gate, the per-runner loop and the escalations are explicit in the graph, so the threshold that triggers scaling is reviewable rather than buried in code.
    - Failures escalate through the `errors` handler to Slack with the execution url, so an expired token or an unreachable API is never silent.
    - Outputs are typed and machine readable, so an autoscaler or a dashboard can consume `verdict` and `queue_depth` directly.

    ## Prerequisites

    - A Kestra instance with the GitHub and Slack plugins installed.
    - A GitLab project with runners assigned to tags and a relay that posts pipeline events to the webhook once a job has been pending past your threshold.

    ### Secrets

    - `GITLAB_TOKEN`: GitLab personal or project access token that can read online runners and job scopes.
    - `GITLAB_WEBHOOK_KEY`: key the webhook trigger expects from the relay that posts the pipeline event.
    - `GITHUB_TOKEN`: GitHub token that can create the scaling issue in the ops backlog repository.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the rebalance ping and for failure alerts.

    ## Quick start

    1. Add the four secrets and import the flow into your namespace.
    2. Point the relay or GitLab webhook rule at the trigger URL, so it posts only once a pipeline has been pending longer than your threshold, or execute manually with `project_path`.
    3. Read `verdict`, `online_runners`, `busy_ratio` and `queue_depth` in the outputs while the loop, the issue and the Slack task handle the escalation.

    ## How to extend

    - Lower `imbalance_ratio` to escalate earlier, or raise it to tolerate a busier tag before suggesting a scale out.
    - Add a third input for the queue threshold and swap the hard-coded 5 in the gate condition for it when different projects need different tolerances.
    - Point `repository` at one backlog repository per GitLab group by templating it from `project_path`.

    ## Links

    - [GitLab runners API](https://docs.gitlab.com/ee/api/runners.html)
    - [GitLab jobs API](https://docs.gitlab.com/ee/api/jobs.html)
    - [GitHub plugin for Kestra](https://kestra.io/plugins/plugin-github)
    - [Slack plugin for Kestra](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
    - Realtime Events
  ee: false
  demo: false
