    - [AWS Step Functions CloudWatch metrics documentation](https://docs.aws.amazon.com/step-functions/latest/dg/procedure-cw-metrics.html)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
