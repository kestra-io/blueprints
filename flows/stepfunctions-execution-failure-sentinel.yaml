id: stepfunctions-execution-failure-sentinel
namespace: company.team
description: |
  Read AWS CloudWatch's own ExecutionsFailed metric for a Step Functions
  state machine, classify it NO_DATA, HEALTHY, or FAILURES_DETECTED, and
  alert Slack when executions start failing - entirely read-only, with no
  Step Functions execution ever started, stopped, or redriven.

triggers:
  - id: periodic_failure_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Checks every 15 minutes, matching the query_window_minutes default below so each check covers exactly the period since the last one. Shipped disabled; enable it once aws_region and state_machine_arn point at a real state machine and a manual run has been verified."
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      aws_region: "us-east-1"
      state_machine_arn: "<your-state-machine-arn>"
      query_window_minutes: 15
      max_failed_executions: 0

inputs:
  - id: aws_region
    type: STRING
    displayName: "AWS Region"
    defaults: "us-east-1"
    description: "Region passed to io.kestra.plugin.aws.cloudwatch.Query."

  - id: state_machine_arn
    type: STRING
    displayName: "State Machine ARN"
    defaults: "<your-state-machine-arn>"
    description: "ARN of the Step Functions state machine to audit, used as the StateMachineArn dimension on the ExecutionsFailed metric. Must be replaced with a real ARN - there is no safe universal default."

  - id: query_window_minutes
    type: INT
    displayName: "Lookback Window (minutes)"
    defaults: 15
    description: "Minutes of CloudWatch history queried per run, used to build both the window and periodSeconds properties so a single aggregated datapoint covers exactly this period - see Pitfalls."

  - id: max_failed_executions
    type: INT
    displayName: "Max Acceptable Failed Executions"
    defaults: 0
    description: "Above this many failed executions within query_window_minutes, the result is classified FAILURES_DETECTED. Default 0 means any failure at all triggers an alert."

tasks:
  - id: probe_failed_executions
    type: io.kestra.plugin.aws.cloudwatch.Query
    description: "Entirely read-only: queries CloudWatch's own ExecutionsFailed metric under the AWS/States namespace, scoped to this state machine via the StateMachineArn dimension - all verified verbatim from AWS's own Step Functions CloudWatch monitoring documentation. periodSeconds is set to the full window in seconds so CloudWatch returns at most one aggregated datapoint, rather than one per minute that this flow would otherwise have to sum itself. statistic is explicitly Sum rather than the task's own default of Average, per AWS's own documented recommendation for metrics that report a count."
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.aws_region }}"
    namespace: "AWS/States"
    metricName: "ExecutionsFailed"
    statistic: "Sum"
    periodSeconds: "{{ inputs.query_window_minutes * 60 }}"
    window: "PT{{ inputs.query_window_minutes }}M"
    dimensions:
      - name: "StateMachineArn"
        value: "{{ inputs.state_machine_arn }}"

  - id: evaluate_metric_presence
    type: io.kestra.plugin.core.flow.If
    description: "NO_DATA when CloudWatch returned zero datapoints (count == 0, verified from io.kestra.plugin.aws.cloudwatch.Query's own Output class) - most often means zero executions ran at all in this window, which for an infrequently invoked state machine is routine, not necessarily unhealthy."
    condition: "{{ outputs.probe_failed_executions.count == 0 }}"
    then:
      - id: log_no_metric_data
        type: io.kestra.plugin.core.log.Log
        message: "NO_DATA: CloudWatch returned no ExecutionsFailed datapoint for {{ inputs.state_machine_arn }} in the last {{ inputs.query_window_minutes }} minutes. This usually means no executions ran at all in this window."
    else:
      - id: evaluate_failure_threshold
        type: io.kestra.plugin.core.flow.If
        description: "FAILURES_DETECTED when the aggregated Sum value exceeds max_failed_executions. The Sum field is read by its exact CloudWatch SDK member name, since io.kestra.plugin.aws.cloudwatch.Query dumps whichever statistic fields the GetMetricStatistics response actually populated."
        condition: "{{ ((outputs.probe_failed_executions.series[0].sum ?? outputs.probe_failed_executions.series[0].Sum) | number) > inputs.max_failed_executions }}"
        then:
          - id: alert_failures_detected
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: "Always alert on FAILURES_DETECTED so an on-call engineer sees the failure count without opening the CloudWatch or Step Functions console."
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {{ {
                "text": "Step Functions execution failure sentinel: FAILURES_DETECTED. State machine " ~ inputs.state_machine_arn ~ " had " ~ (outputs.probe_failed_executions.series[0].sum ?? outputs.probe_failed_executions.series[0].Sum) ~ " failed execution(s) in the last " ~ inputs.query_window_minutes ~ " minutes (threshold " ~ inputs.max_failed_executions ~ "). Execution " ~ execution.id ~ "."
              } | toJson }}
        else:
          - id: log_executions_healthy
            type: io.kestra.plugin.core.log.Log
            message: "HEALTHY: {{ inputs.state_machine_arn }} had {{ outputs.probe_failed_executions.series[0].sum ?? outputs.probe_failed_executions.series[0].Sum }} failed execution(s) in the last {{ inputs.query_window_minutes }} minutes, at or below threshold {{ inputs.max_failed_executions }}."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: "Final status line for every run, independent of which branch fired."
    message: "Failure audit complete for {{ inputs.state_machine_arn }}. datapoint_count={{ outputs.probe_failed_executions.count }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert when the flow itself fails outside the handled branches, for example an unreachable CloudWatch API, an invalid state machine ARN, or invalid credentials."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {
        "text": "Step Functions execution failure sentinel FAILED in execution " ~ execution.id ~ " for " ~ inputs.state_machine_arn ~ ". The CloudWatch query did not complete; investigate before trusting the last known NO_DATA/HEALTHY/FAILURES_DETECTED status."
      } | toJson }}

extend:
  title: "AWS Step Functions Execution Failure Rate Sentinel"
  shortDescription: "Read CloudWatch's own ExecutionsFailed metric for a Step Functions state machine and alert Slack on failures - entirely read-only, no execution ever started or stopped."
  metaTitle: "AWS Step Functions Failure Sentinel with Kestra"
  metaDescription: "Monitor Step Functions execution failures via CloudWatch's own metrics and alert Slack before a failing workflow goes unnoticed."
  description: |
    A Step Functions state machine that starts failing every execution -
    a broken downstream integration, an expired credential inside a Task
    state, a Lambda that started throwing - has no first-class "alert me"
    primitive of its own; CloudWatch alarms have to be configured and
    wired separately for every state machine. This blueprint reads the
    same `ExecutionsFailed` metric CloudWatch alarms would use, classifies
    it, and alerts Slack directly from a Kestra flow instead.

    ## How it works

    1. `periodic_failure_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 15 minutes, explicitly passing `aws_region`, `state_machine_arn`, `query_window_minutes`, and `max_failed_executions` through its own `inputs:` block so the flow is self-contained when the trigger fires. Shipped disabled so a manual run can be verified first.
    2. `probe_failed_executions` (`io.kestra.plugin.aws.cloudwatch.Query`) queries the `AWS/States` namespace's `ExecutionsFailed` metric, scoped to `state_machine_arn` via the `StateMachineArn` dimension, with `periodSeconds` set to the full lookback window so CloudWatch returns a single aggregated `Sum` datapoint rather than one per minute.
    3. `evaluate_metric_presence` (`io.kestra.plugin.core.flow.If`) branches on whether any datapoint came back at all (`count`).
       - `then` (NO_DATA): `log_no_metric_data` reports that no executions ran in this window at all.
       - `else`: nested `evaluate_failure_threshold` (`io.kestra.plugin.core.flow.If`) branches on whether the aggregated `Sum` exceeds `max_failed_executions`.
         - `then` (FAILURES_DETECTED): `alert_failures_detected` reports the count to Slack.
         - `else` (HEALTHY): `log_executions_healthy` records a clean check.
    4. `log_audit_complete` always runs last, printing the datapoint count regardless of which branch fired.
    5. The `errors` block alerts Slack separately if the flow itself fails outright - an unreachable CloudWatch API or bad credentials must not read as any of the three handled states.

    ## What you get

    - A NO_DATA/HEALTHY/FAILURES_DETECTED answer sourced from the exact same metric CloudWatch's own native alarms would use, with zero risk to the state machine itself - no execution is ever started, stopped, or redriven by this sentinel.
    - A distinct NO_DATA state instead of silently treating a quiet window as either healthy or alarming, which matters for infrequently invoked state machines.
    - A worked example of `io.kestra.plugin.aws.cloudwatch.Query` with `periodSeconds` deliberately set equal to the full lookback window, so the flow reads one pre-aggregated `Sum` value instead of summing several datapoints itself in Pebble.
    - A required AWS IAM permission set (`cloudwatch:GetMetricStatistics` only) that cannot touch Step Functions executions at all, by construction.

    ## Who it's for

    - Platform teams running Step Functions state machines who need an early signal when a workflow starts failing, without wiring a separate CloudWatch alarm and SNS topic per state machine.
    - On-call engineers who want one Slack alert with the exact failure count instead of opening the CloudWatch or Step Functions console to check.
    - Anyone evaluating the AWS CloudWatch plugin who wants a worked example of `Query` scoped to a specific resource via a dimension, with the statistic deliberately chosen to match AWS's own documented guidance for count-type metrics.

    ## Why orchestrate this with Kestra

    CloudWatch alarms can notify on a threshold, but configuring one per state machine, wiring it to SNS, and keeping that configuration in sync with the state machines that actually exist is its own maintenance burden, separate from the flow that needs to react. Kestra supplies the schedule, the NO_DATA/HEALTHY/FAILURES_DETECTED classification as a first-class branch, and an execution history that shows exactly when a state machine started failing and how many executions were affected.

    ## Prerequisites

    - An AWS account with a deployed Step Functions state machine that has run at least once (update `aws_region`, `state_machine_arn`).
    - AWS credentials with `cloudwatch:GetMetricStatistics` permission - nothing from Step Functions itself is required, since this blueprint never calls the Step Functions API.
    - A Slack incoming webhook for alerts.

    This blueprint has no local, account-free testing path. LocalStack's Community image now requires its own account and auth token as of March 2026 (it is no longer a plain, no-signup Docker image), and even where available, LocalStack's CloudWatch metrics support is limited. A real AWS account is the practical prerequisite here, the same baseline every other AWS-targeting blueprint in this repository assumes.

    ### Secrets

    - `AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY`: credentials for `io.kestra.plugin.aws.cloudwatch.Query`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_failures_detected` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded - for example `SECRET_SLACK_WEBHOOK_URL=$(echo -n '<your-webhook-url>' | base64)` - and read back in flows with `{{ secret('NAME') }}`.

    ### Inputs

    - `aws_region` (STRING, default `us-east-1`).
    - `state_machine_arn` (STRING, default `<your-state-machine-arn>`, must be replaced).
    - `query_window_minutes` (INT, default `15`): drives both `window` and `periodSeconds` on the probe task.
    - `max_failed_executions` (INT, default `0`): failure-count ceiling before FAILURES_DETECTED fires.

    ### Outputs

    - `outputs.probe_failed_executions.count`: number of datapoints returned (expected 0 or 1, since `periodSeconds` equals the full window).
    - `outputs.probe_failed_executions.series[0].sum`: the aggregated failed-execution count for the window, only present when `count` is 1 (supports `sum` or `Sum`).

    ## Quick start

    1. Deploy a Step Functions state machine in a real AWS account and let it run at least once successfully.
    2. Add the `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` secrets.
    3. Run the flow manually against a healthy state machine and confirm `log_executions_healthy` or `log_no_metric_data` fires, depending on recent execution volume.
    4. Force an execution to fail (for example, by starting one with input that a Task state's Lambda rejects) and re-run within `query_window_minutes` to confirm `alert_failures_detected` fires.
    5. Enable `periodic_failure_check` once you trust the check against your real state machine.

    ## How to extend

    - Loop over several `state_machine_arn` values with `io.kestra.plugin.core.flow.Loop` to audit every critical state machine in an account in one run.
    - Add a second `io.kestra.plugin.aws.cloudwatch.Query` probe on `ExecutionsTimedOut` (also documented under the same `AWS/States` namespace) to catch stuck-and-timing-out executions as a distinct state from outright failures.
    - Add a third probe on the account-level `OpenExecutionCount` metric (dimensionless, no `StateMachineArn` needed) to additionally catch a state machine approaching its open-execution quota before any individual execution fails.

    ## Pitfalls

    - **CloudWatch metrics are delivered on a best-effort basis**, per AWS's own Step Functions monitoring documentation - a data point can arrive late, or occasionally not at all, so `NO_DATA` is not a perfectly reliable signal that zero executions actually failed, only that CloudWatch has not reported any yet.
    - **AWS's own documentation recommends the `Sum` statistic for count-type metrics like `ExecutionsFailed`**, not the task's own default of `Average` - this blueprint sets `statistic: "Sum"` explicitly for exactly that reason; leaving it at the default would silently report an averaged value instead of a true count.
    - **`periodSeconds` must be kept in sync with `window`.** Both are derived from the single `query_window_minutes` input specifically so they cannot drift apart; setting them independently risks CloudWatch returning multiple smaller datapoints that this flow's single `series[0]` read would then silently ignore all but the first of.
    - **This blueprint has no local, account-free testing path.** LocalStack now requires its own account and token since March 2026, so a real AWS account is the practical prerequisite, verified and disclosed rather than glossed over.
    - **This blueprint is UNTESTED against a live AWS account.** The `ExecutionsFailed` metric, the `AWS/States` namespace, the `StateMachineArn` dimension, and the `Sum`-statistic recommendation are all taken verbatim from AWS's own Step Functions CloudWatch monitoring documentation, and the `io.kestra.plugin.aws.cloudwatch.Query` properties and outputs are taken from the plugin's own source on `main` - but no Kestra engine was run to execute this flow end to end.

