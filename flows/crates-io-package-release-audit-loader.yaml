id: crates-io-package-release-audit-loader
namespace: company.analytics
description: Ingests upstream Rust crate releases and dependency metadata from Crates.io into Parquet lakehouse storage via DuckDB, tracking semver state in Kestra KV store.

inputs:
  - id: crates
    type: ARRAY
    itemType: STRING
    description: List of critical Rust crates to audit and ingest.
    defaults:
      - tokio
      - serde
      - syn
      - reqwest
      - duckdb
      - anyhow

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known crate versions.
    defaults: crates_io_monitored_release_state

variables:
  default_state: "{}"

triggers:
  - id: daily_crates_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_crates
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            state = json.loads(raw_state) if raw_state else {}
        except Exception:
            state = {}

        crates = json.loads("""{{ inputs.crates | toJson }}""")

        headers = {
            "User-Agent": "KestraCratesAuditLakehouse/1.0 (devops-audit@kestra.io)"
        }

        records = []
        new_releases = []
        new_state = dict(state)

        for crate_name in crates:
            try:
                url = f"https://crates.io/api/v1/crates/{crate_name}"
                resp = requests.get(url, headers=headers, timeout=15)
                if resp.status_code == 200:
                    data = resp.json()
                    crate_info = data.get("crate", {})

                    latest_ver = crate_info.get("max_version", "")
                    downloads = crate_info.get("downloads", 0)
                    recent_downloads = crate_info.get("recent_downloads", 0)
                    created_at = crate_info.get("created_at", "")
                    updated_at = crate_info.get("updated_at", "")
                    description = (crate_info.get("description") or "")[:250]
                    documentation = crate_info.get("documentation") or ""
                    repository = crate_info.get("repository") or ""

                    previous_ver = state.get(crate_name)
                    is_new_release = bool(previous_ver and previous_ver != latest_ver)

                    records.append({
                        "crate_name": crate_name,
                        "latest_version": latest_ver,
                        "previous_version": previous_ver if previous_ver else latest_ver,
                        "is_new_release": is_new_release,
                        "downloads": int(downloads),
                        "recent_downloads": int(recent_downloads),
                        "description": description,
                        "repository": repository,
                        "documentation": documentation,
                        "created_at": created_at,
                        "updated_at": updated_at
                    })

                    if is_new_release:
                        new_releases.append({
                            "crate": crate_name,
                            "from_version": previous_ver,
                            "to_version": latest_ver
                        })

                    new_state[crate_name] = latest_ver
            except Exception as e:
                print(f"Warning: Failed to fetch metadata for crate '{crate_name}': {e}")

        with open("crates_releases.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE crates_audit AS SELECT * FROM read_json_auto('crates_releases.json')")
            con.execute("COPY crates_audit TO 'crates_release_audit.parquet' (FORMAT PARQUET)")
            con.execute("COPY crates_audit TO 'crates_release_audit.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE crates_audit (
                    crate_name VARCHAR,
                    latest_version VARCHAR,
                    previous_version VARCHAR,
                    is_new_release BOOLEAN,
                    downloads BIGINT,
                    recent_downloads BIGINT,
                    description VARCHAR,
                    repository VARCHAR,
                    documentation VARCHAR,
                    created_at VARCHAR,
                    updated_at VARCHAR
                )
            """)
            con.execute("COPY crates_audit TO 'crates_release_audit.parquet' (FORMAT PARQUET)")
            con.execute("COPY crates_audit TO 'crates_release_audit.csv' (HEADER, DELIMITER ',')")

        summary = {
            "monitored_crates": len(records),
            "new_releases_count": len(new_releases),
            "new_releases": new_releases,
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - crates_release_audit.parquet
      - crates_release_audit.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_crates.vars.updated_state | toJson }}"

  - id: check_new_releases
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_crates.vars.new_releases_count > 0 }}"
    then:
      - id: notify_crate_update
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "🦀 Crates.io Release Detected: {{ outputs.ingest_and_transform_crates.vars.new_releases_count }} production crate(s) published new upstream releases."

outputs:
  - id: monitored_count
    type: INT
    value: "{{ outputs.ingest_and_transform_crates.vars.monitored_crates }}"
  - id: new_releases_count
    type: INT
    value: "{{ outputs.ingest_and_transform_crates.vars.new_releases_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_crates.outputFiles['crates_release_audit.parquet'] }}"

extend:
  title: Crates.io Rust Package Release Audit Loader with DuckDB
  metaTitle: Crates.io Rust Package Release Audit Loader | Kestra
  shortDescription: Ingests upstream Rust crate releases and dependency metadata from Crates.io into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Crates.io REST API for Rust crate releases, convert semver and download telemetry into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, transformation, and analytical lakehouse persistence of upstream Rust crate releases,
    semver updates, and download telemetry directly from the official Crates.io API into Parquet and CSV formats using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`crates_io_monitored_release_state`) for previous version snapshots of audited crates.
    2. **Crates.io Extraction**: Queries the official Crates.io REST API (`crates.io/api/v1/crates/{crate}`) using compliant user-agent identification.
    3. **DuckDB Semver & Telemetry Processing**: Normalizes crate releases, lifetime downloads, recent velocity metrics, and repository links into a relational schema.
    4. **Analytical Lake Export**: Generates columnar Parquet and CSV files for dependency supply chain security and performance tracking.
    5. **Version Change Detection & State Commitment**: Evaluates newly published versions against previous state, alerts on updates, and saves updated version maps to the KV store.

    ## What you get

    - Automated, scheduled tracking of core Rust libraries and production dependencies.
    - Columnar Parquet audit datasets ready for querying with DuckDB, Trino, Snowflake, or BigQuery.
    - Idempotent KV state tracking with zero external database dependencies.

    ## Who it's for

    - Platform Engineers and SecOps teams governing Rust software supply chain dependencies.
    - Data Engineers building reproducible multi-cloud lakehouse pipelines.
    - Rust systems architects tracking downstream impact of upstream library releases.

    ## Why orchestrate this with Kestra

    - Built-in KV store eliminates external Redis or database infrastructure for tracking state.
    - Ephemeral Docker containers ensure reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `crates.io`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting engineering teams on dependency upgrades.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Adjust the `crates` input list to match your project's critical dependencies.
    3. Click **Execute** to trigger an initial sync and generate the Parquet audit table.
    4. Enable the `daily_crates_sync` schedule for automated daily audit updates.

    ## How to extend

    - Add an S3 or GCS upload step to archive daily crates telemetry to a central data lake.
    - Attach an automated GitHub Actions dispatch step to run integration tests against new crate releases.

    ## Links

    - [Crates.io API Documentation](https://crates.io/data-access)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
