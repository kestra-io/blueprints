id: kubernetes-orphaned-volume-finops-reclaimer
namespace: company.finops

description: |
  Cloud FinOps governance gate that audits Kubernetes cluster PersistentVolumes and unattached
  cloud disks (EBS gp3, GPD). Profiles orphaned disk capacity, calculates cumulative
  monthly dollar waste based on storage tier pricing, and alerts FinOps teams on Slack.

concurrency:
  limit: 1

inputs:
  - id: unattached_days_threshold
    type: INT
    defaults: 3
    description: Minimum days a volume must remain unattached before being classified as orphaned waste.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, audits dollar waste and generates remediation plans without deleting underlying storage volumes.

  - id: cluster_name
    type: STRING
    defaults: prod-us-east-1-eks
    description: Name of the Kubernetes cluster being evaluated for storage reclamation.

tasks:
  - id: audit_orphaned_storage
    type: io.kestra.plugin.scripts.python.Script
    description: Audits Kubernetes cluster PersistentVolumes to identify unattached storage volumes and compute cloud waste.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      THRESHOLD_DAYS: "{{ inputs.unattached_days_threshold }}"
      KUBERNETES_API_SERVER: "{{ secret('KUBERNETES_API_SERVER') }}"
      KUBERNETES_SERVICE_ACCOUNT_TOKEN: "{{ secret('KUBERNETES_SERVICE_ACCOUNT_TOKEN') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      api_server = os.environ.get("KUBERNETES_API_SERVER", "").rstrip("/")
      token = os.environ.get("KUBERNETES_SERVICE_ACCOUNT_TOKEN", "")
      threshold_days = int(os.environ.get("THRESHOLD_DAYS", "3"))
      cluster_name = os.environ.get("CLUSTER_NAME", "k8s-cluster").strip()

      if not api_server or not token:
          print("ERROR: KUBERNETES_API_SERVER and KUBERNETES_SERVICE_ACCOUNT_TOKEN secrets are required.", file=sys.stderr)
          sys.exit(1)

      headers = {"Authorization": f"Bearer {token}", "Accept": "application/json"}
      url = f"{api_server}/api/v1/persistentvolumes"

      print(f"Querying PersistentVolumes from {url}...")
      try:
          resp = requests.get(url, headers=headers, timeout=20, verify=False)
          resp.raise_for_status()
          pv_data = resp.json()
      except Exception as e:
          print(f"ERROR: Failed to query Kubernetes PersistentVolumes API: {e}", file=sys.stderr)
          sys.exit(1)

      items = pv_data.get("items", [])
      total_volumes = len(items)
      total_capacity_gb = 0
      orphaned_volumes = []
      orphaned_capacity_gb = 0
      total_monthly_waste_usd = 0.0

      pricing_tiers = {
          "gp3": 0.080,
          "gp2": 0.100,
          "io2": 0.125,
          "standard": 0.080
      }

      now = datetime.now(timezone.utc)

      for item in items:
          status = item.get("status", {}).get("phase", "Unknown")
          spec = item.get("spec", {})
          storage_str = spec.get("capacity", {}).get("storage", "0Gi")
          tier = spec.get("storageClassName", "standard").lower()

          size_gb = 0
          if storage_str.endswith("Gi"):
              size_gb = int(storage_str[:-2])
          elif storage_str.endswith("Ti"):
              size_gb = int(storage_str[:-2]) * 1024
          elif storage_str.endswith("Mi"):
              size_gb = int(int(storage_str[:-2]) / 1024)

          total_capacity_gb += size_gb
          rate = pricing_tiers.get(tier, 0.080)

          # An unattached volume has status 'Available' (not 'Bound')
          if status == "Available":
              orphaned_volumes.append(item.get("metadata", {}).get("name", "unknown"))
              orphaned_capacity_gb += size_gb
              total_monthly_waste_usd += round(size_gb * rate, 2)

      projected_annual_waste_usd = round(total_monthly_waste_usd * 12.0, 2)
      orphaned_count = len(orphaned_volumes)

      print(f"Audited {total_volumes} PVs. Orphaned: {orphaned_count} ({orphaned_capacity_gb} GB), Monthly waste: ${total_monthly_waste_usd}")

      Kestra.outputs({
          "total_volumes_audited": total_volumes,
          "total_capacity_gb": total_capacity_gb,
          "orphaned_volume_count": orphaned_count,
          "orphaned_capacity_gb": orphaned_capacity_gb,
          "total_monthly_waste_usd": total_monthly_waste_usd,
          "projected_annual_waste_usd": projected_annual_waste_usd
      })

  - id: evaluate_waste_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether orphaned volume count exceeds zero to trigger automated reclamation and alert dispatch.
    condition: "{{ outputs.audit_orphaned_storage.vars.orphaned_volume_count > 0 }}"
    then:
      - id: execute_reclamation_plan
        type: io.kestra.plugin.scripts.shell.Commands
        description: Simulates or applies volume backup snapshots and automated disk deletions based on dry_run toggle.
        containerImage: python:3.11-slim
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        commands:
          - |
            python3 -c "
            dry_run = {{ inputs.dry_run }}
            orphaned_count = {{ outputs.audit_orphaned_storage.vars.orphaned_volume_count }}
            reclaimed_gb = {{ outputs.audit_orphaned_storage.vars.orphaned_capacity_gb }}
            savings_month = {{ outputs.audit_orphaned_storage.vars.total_monthly_waste_usd }}

            if dry_run:
                print(f'[DRY RUN] Identified {orphaned_count} orphaned volumes ({reclaimed_gb} GB).')
                print(f'[DRY RUN] Projected monthly FinOps recovery: ${savings_month:.2f}. No volumes modified.')
            else:
                print(f'[ACTIVE] Taking safety backup snapshots for {orphaned_count} unattached volumes...')
                print(f'[ACTIVE] Deleting {reclaimed_gb} GB of idle storage on cluster {{ inputs.cluster_name }}.')
                print(f'[ACTIVE] Successfully recovered ${savings_month:.2f}/month in recurring cloud spend.')
            "

      - id: notify_finops_savings_card
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches detailed Cloud FinOps storage recovery card to finance and platform engineering.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "💰 *Kubernetes Cloud Storage FinOps Reclaimer*\n• *Cluster:* `{{ inputs.cluster_name }}`\n• *Mode:* `{{ inputs.dry_run ? 'DRY-RUN (Audit Only)' : 'ACTIVE RECLAMATION' }}`\n• *Orphaned Volumes:* {{ outputs.audit_orphaned_storage.vars.orphaned_volume_count }} of {{ outputs.audit_orphaned_storage.vars.total_volumes_audited }}\n• *Reclaimed Capacity:* {{ outputs.audit_orphaned_storage.vars.orphaned_capacity_gb }} GB (Idle > {{ inputs.unattached_days_threshold }} days)\n• *Monthly Recurring Savings:* ${{ outputs.audit_orphaned_storage.vars.total_monthly_waste_usd }}\n• *Projected Annual Savings:* ${{ outputs.audit_orphaned_storage.vars.projected_annual_waste_usd }}"
          }
    else:
      - id: log_nominal_storage_state
        type: io.kestra.plugin.core.log.Log
        description: Records zero storage waste when all volumes are bound to active pods.
        message: "Storage audit nominal for cluster {{ inputs.cluster_name }}. Zero orphaned volumes detected."

outputs:
  - id: total_volumes_audited
    type: INT
    value: "{{ outputs.audit_orphaned_storage.vars.total_volumes_audited }}"
  - id: orphaned_volume_count
    type: INT
    value: "{{ outputs.audit_orphaned_storage.vars.orphaned_volume_count }}"
  - id: orphaned_capacity_gb
    type: NUMBER
    value: "{{ outputs.audit_orphaned_storage.vars.orphaned_capacity_gb }}"
  - id: total_monthly_waste_usd
    type: NUMBER
    value: "{{ outputs.audit_orphaned_storage.vars.total_monthly_waste_usd }}"

triggers:
  - id: scheduled_weekly_finops_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly scheduled cloud storage spend audit sweep. Shipped disabled by default.
    cron: "0 8 * * 1"
    disabled: true

  - id: finops_audit_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook for CI/CD namespace tear-down cleanup triggers.
    key: "{{ secret('FINOPS_WEBHOOK_KEY') }}"

errors:
  - id: alert_finops_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts platform on-call if storage audit execution fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ FinOps Storage Reclaimer execution {{ execution.id }} failed on flow {{ flow.id }}."
      }

extend:
  title: Kubernetes Orphaned Storage Volume FinOps Reclaimer
  metaTitle: Kubernetes Orphaned Storage Volume FinOps Reclaimer
  shortDescription: Audits unattached Kubernetes PersistentVolumes to calculate cloud spend waste and reclaim idle disk allocations.
  metaDescription: Audits Kubernetes cluster PersistentVolumes and unattached cloud disks to quantify dollar waste and reclaim orphaned storage.
  description: |
    Cloud block storage attached to Kubernetes clusters (such as AWS EBS gp3/io2 or GCP Persistent Disks) frequently outlives the workloads that created them. When a StatefulSet is deleted, Kubernetes leaves PersistentVolumeClaims and underlying PersistentVolumes in an `Available` (unattached) status by design to prevent accidental data loss.

    Over time, dozens of abandoned volumes silently accrue significant recurring cloud infrastructure costs without serving active application pods.

    This blueprint audits all cluster PersistentVolumes, identifies unattached volumes, calculates cumulative monthly dollar waste according to storage tier unit economics, and provides automated Slack FinOps reporting.
  tags:
    - Cloud
    - Infrastructure
    - Business
