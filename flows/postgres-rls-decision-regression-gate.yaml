id: postgres-rls-decision-regression-gate
namespace: company.team
description: |
  Test PostgreSQL row-level security as the application actually sees it.
  Two non-owner login roles each read a canary in the protected table. The
  flow blocks when either role loses its own row, sees the other's row,
  bypasses RLS, or connects as an unexpected database user.

concurrency:
  limit: 1
  behavior: QUEUE

triggers:
  - id: policy_change
    type: io.kestra.plugin.core.trigger.Webhook
    key: postgres-rls-change-me
    description: After a policy migration, POST to /api/v1/main/executions/webhook/company.team/postgres-rls-decision-regression-gate/postgres-rls-change-me to run the decision gate.
  - id: hourly_backstop
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "23 * * * *"
    timezone: UTC
    disabled: true
    description: Enable after validating the fixture and credentials; it catches policy changes made outside the migration pipeline.

inputs:
  - id: alpha_id
    type: INT
    defaults: 101
    description: ID of a permanent canary row that the alpha login must see and the beta login must not see.
  - id: beta_id
    type: INT
    defaults: 202
    description: ID of a permanent canary row that the beta login must see and the alpha login must not see.
  - id: alpha_role
    type: STRING
    defaults: rls_alpha
    description: Exact PostgreSQL current_user expected from the alpha connection; catches a service or owner credential used by mistake.
  - id: beta_role
    type: STRING
    defaults: rls_beta
    description: Exact PostgreSQL current_user expected from the beta connection; catches a service or owner credential used by mistake.
  - id: kestra_url
    type: STRING
    defaults: http://localhost:8080
    description: Base URL of your Kestra UI, used only in an actionable failure alert.

tasks:
  - id: validate_canaries
    type: io.kestra.plugin.core.flow.If
    description: A shared or non-positive canary ID would make an allow/deny result meaningless.
    condition: "{{ inputs.alpha_id <= 0 or inputs.beta_id <= 0 or inputs.alpha_id == inputs.beta_id or inputs.alpha_role == inputs.beta_role }}"
    then:
      - id: reject_invalid_canaries
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: Alpha and beta must have distinct positive IDs and distinct expected login roles. No database probe was run.

  - id: read_previous_verdict
    type: io.kestra.plugin.core.kv.Get
    key: postgres_rls_decision_last_verdict
    errorOnMissing: false

  - id: probe_alpha
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Query the protected relation using the real alpha application login, not the owner or a service role.
    url: "{{ secret('POSTGRES_URL') }}"
    username: "{{ secret('POSTGRES_ALPHA_USER') }}"
    password: "{{ secret('POSTGRES_ALPHA_PASSWORD') }}"
    fetchType: FETCH_ONE
    parameters:
      own_id: "{{ inputs.alpha_id }}"
      peer_id: "{{ inputs.beta_id }}"
      expected_role: "{{ inputs.alpha_role }}"
    sql: |
      SELECT current_user AS actual_role,
             row_security_active(CAST('public.tenant_documents' AS regclass)) AS rls_active,
             count(*) FILTER (WHERE id = CAST(:own_id AS bigint)) AS own_rows,
             count(*) FILTER (WHERE id = CAST(:peer_id AS bigint)) AS peer_rows,
             CASE WHEN current_user = :expected_role
                         AND row_security_active(CAST('public.tenant_documents' AS regclass))
                         AND count(*) FILTER (WHERE id = CAST(:own_id AS bigint)) = 1
                         AND count(*) FILTER (WHERE id = CAST(:peer_id AS bigint)) = 0
                  THEN 'PASS' ELSE 'DRIFT' END AS verdict
      FROM public.tenant_documents
      WHERE id IN (CAST(:own_id AS bigint), CAST(:peer_id AS bigint))
    retry: {type: exponential, interval: PT2S, maxInterval: PT10S, maxAttempts: 3}

  - id: probe_beta
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: The inverse read catches a policy that grants only one tenant too much or denies only one tenant too much.
    url: "{{ secret('POSTGRES_URL') }}"
    username: "{{ secret('POSTGRES_BETA_USER') }}"
    password: "{{ secret('POSTGRES_BETA_PASSWORD') }}"
    fetchType: FETCH_ONE
    parameters:
      own_id: "{{ inputs.beta_id }}"
      peer_id: "{{ inputs.alpha_id }}"
      expected_role: "{{ inputs.beta_role }}"
    sql: |
      SELECT current_user AS actual_role,
             row_security_active(CAST('public.tenant_documents' AS regclass)) AS rls_active,
             count(*) FILTER (WHERE id = CAST(:own_id AS bigint)) AS own_rows,
             count(*) FILTER (WHERE id = CAST(:peer_id AS bigint)) AS peer_rows,
             CASE WHEN current_user = :expected_role
                         AND row_security_active(CAST('public.tenant_documents' AS regclass))
                         AND count(*) FILTER (WHERE id = CAST(:own_id AS bigint)) = 1
                         AND count(*) FILTER (WHERE id = CAST(:peer_id AS bigint)) = 0
                  THEN 'PASS' ELSE 'DRIFT' END AS verdict
      FROM public.tenant_documents
      WHERE id IN (CAST(:own_id AS bigint), CAST(:peer_id AS bigint))
    retry: {type: exponential, interval: PT2S, maxInterval: PT10S, maxAttempts: 3}

  - id: evaluate_decisions
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.probe_alpha.row.verdict != 'PASS' or outputs.probe_beta.row.verdict != 'PASS' }}"
    then:
      - id: alert_new_drift
        type: io.kestra.plugin.core.flow.If
        condition: "{{ (outputs.read_previous_verdict.value ?? '') != 'DRIFT' }}"
        then:
          - id: notify_drift
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: >-
              PostgreSQL RLS decision drift: alpha expected {{ inputs.alpha_role }}, actual {{ outputs.probe_alpha.row.actual_role }}
              (own={{ outputs.probe_alpha.row.own_rows }}, peer={{ outputs.probe_alpha.row.peer_rows }},
              RLS={{ outputs.probe_alpha.row.rls_active }}); beta expected {{ inputs.beta_role }}, actual {{ outputs.probe_beta.row.actual_role }}
              (own={{ outputs.probe_beta.row.own_rows }}, peer={{ outputs.probe_beta.row.peer_rows }},
              RLS={{ outputs.probe_beta.row.rls_active }}). Hold the policy deployment; inspect
              public.tenant_documents policies and canary rows. Execution {{ execution.id }}.
            retry: {type: exponential, interval: PT2S, maxInterval: PT10S, maxAttempts: 3}
      - id: remember_drift
        type: io.kestra.plugin.core.kv.Set
        key: postgres_rls_decision_last_verdict
        value: DRIFT
        kvType: STRING
      - id: block_policy_change
        type: io.kestra.plugin.core.execution.Exit
        state: FAILED
    else:
      - id: alert_recovery
        type: io.kestra.plugin.core.flow.If
        condition: "{{ (outputs.read_previous_verdict.value ?? '') == 'DRIFT' or (outputs.read_previous_verdict.value ?? '') == 'ERROR' }}"
        then:
          - id: notify_recovery
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: >-
              PostgreSQL RLS decisions recovered: both roles see exactly their own
              public.tenant_documents canary and neither sees the peer canary.
              The policy migration may continue after review. Execution {{ execution.id }}.
            retry: {type: exponential, interval: PT2S, maxInterval: PT10S, maxAttempts: 3}
      - id: remember_clean
        type: io.kestra.plugin.core.kv.Set
        key: postgres_rls_decision_last_verdict
        value: CLEAN
        kvType: STRING

errors:
  - id: read_previous_error_state
    type: io.kestra.plugin.core.kv.Get
    key: postgres_rls_decision_last_verdict
    errorOnMissing: false
  - id: alert_new_probe_error
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.read_previous_error_state.value ?? '') != 'ERROR' }}"
    then:
      - id: notify_probe_error
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: >-
          PostgreSQL RLS gate could not complete (execution {{ execution.id }}).
          Inspect the failed task at {{ inputs.kestra_url }}/ui/main/executions/company.team/{{ flow.id }}/{{ execution.id }}.
          If validate_canaries failed, correct duplicate IDs or roles. If probe_alpha or
          probe_beta failed, check relation grants, role credentials and PostgreSQL health.
          Do not treat this run as a passing policy test.
        retry: {type: exponential, interval: PT2S, maxInterval: PT10S, maxAttempts: 3}
  - id: remember_probe_error
    type: io.kestra.plugin.core.kv.Set
    key: postgres_rls_decision_last_verdict
    value: ERROR
    kvType: STRING

outputs:
  - id: alpha_decision
    type: JSON
    value: "{{ (outputs.probe_alpha.row ?? {}) | toJson }}"
  - id: beta_decision
    type: JSON
    value: "{{ (outputs.probe_beta.row ?? {}) | toJson }}"
  - id: status
    type: STRING
    value: "{{ outputs.probe_alpha.row.verdict ?? 'UNKNOWN' }} / {{ outputs.probe_beta.row.verdict ?? 'UNKNOWN' }}"

extend:
  title: Catch PostgreSQL Row-Level Security Decision Regressions
  shortDescription: Exercise actual allow and deny reads through two application logins, then block policy changes when either tenant's visibility drifts.
  metaTitle: PostgreSQL RLS Decision Regression Gate with Kestra
  metaDescription: Detect PostgreSQL RLS leaks and lockouts by probing real tenant roles and rows, with change-only Slack alerts and a failing gate.
  description: |
    A table can have RLS enabled while a permissive policy leaks another tenant's rows, or a restrictive change locks out its own tenant. This flow tests the decision each application login actually receives. It reads two permanent canary rows through two non-owner PostgreSQL credentials and fails the execution if any allow or deny decision changes. It never writes application data or changes a policy. This canary pair checks the selected policy path; add further pairs for other roles or conditions.

    ## How it works
    1. `validate_canaries` (`If`) rejects duplicate IDs or roles before making a database call.
    2. `probe_alpha` and `probe_beta` (`PostgreSQL Query`) connect independently as the two application roles. Each checks `current_user`, `row_security_active`, one visible own row, and zero visible peer rows.
    3. `evaluate_decisions` (`If`) sends one actionable Slack alert for a new drift, remembers the verdict in Kestra KV, and ends in `FAILED`. On recovery from drift or a probe error it sends one recovery alert. Repeated clean, drift or error runs stay quiet.

    ## Error handling
    The canary guard fails before the database calls. Each JDBC probe retries transient connection errors with exponential backoff. Missing table permissions, bad credentials and outages fail closed; the `errors` handler names the execution and directs the operator to the logs. It remembers the ERROR state and alerts only on the first failing run until the next clean or drift verdict. The verdict is stored only after Slack succeeds, so a notification failure is retried on the next run. The single-run concurrency limit serializes KV updates.

    ## What this blueprint teaches about Kestra
    Two JDBC tasks with different secrets can test the authorization boundary the application actually uses. A flowable `If` turns those database decisions into a release gate, while Kestra KV suppresses duplicate notifications across scheduled and webhook executions.

    ## Prerequisites
    PostgreSQL 13+ with a protected `public.tenant_documents(id bigint, tenant text, body text)` relation. Put a stable alpha canary at ID 101 and beta canary at ID 202, changing the input IDs if needed. Grant both non-owner login roles `USAGE` on `public` and `SELECT` on the relation. Neither role may own the table, have `BYPASSRLS`, or be superuser. Adapt the relation name and row predicate in both probe SQL statements for your protected table. A Slack incoming webhook receives alerts.

    ### Secrets
    - `POSTGRES_URL`: JDBC URL of the database that holds both canaries.
    - `POSTGRES_ALPHA_USER`, `POSTGRES_ALPHA_PASSWORD`: alpha application's read-only login.
    - `POSTGRES_BETA_USER`, `POSTGRES_BETA_PASSWORD`: beta application's read-only login.
    - `SLACK_WEBHOOK_URL`: incoming webhook for drift and error alerts.

    ### Inputs
    - `alpha_id` (INT, default 101): canary visible only to alpha.
    - `beta_id` (INT, default 202): canary visible only to beta.
    - `alpha_role` (STRING, default `rls_alpha`): expected `current_user` on alpha connection.
    - `beta_role` (STRING, default `rls_beta`): expected `current_user` on beta connection.
    - `kestra_url` (STRING, default `http://localhost:8080`): link base in failure alerts.

    ### Outputs
    - `alpha_decision`, `beta_decision` (JSON): role identity, active-RLS flag, own and peer row counts, and verdict. Empty on a failed execution.
    - `status` (STRING): both probe verdicts on a successful clean run; failed runs have no flow outputs, so use the Slack alert or task outputs.

    ## Quick start
    1. In an empty test database, run this fixture as the table owner (set login passwords through your usual secret manager):

       ```sql
       CREATE ROLE rls_alpha LOGIN;
       CREATE ROLE rls_beta LOGIN;
       CREATE TABLE public.tenant_documents(id bigint PRIMARY KEY, tenant text NOT NULL, body text NOT NULL);
       INSERT INTO public.tenant_documents VALUES (101, 'rls_alpha', 'alpha canary'), (202, 'rls_beta', 'beta canary');
       ALTER TABLE public.tenant_documents ENABLE ROW LEVEL SECURITY;
       CREATE POLICY tenant_read ON public.tenant_documents FOR SELECT USING (tenant = current_user);
       GRANT USAGE ON SCHEMA public TO rls_alpha, rls_beta;
       GRANT SELECT ON public.tenant_documents TO rls_alpha, rls_beta;
       ```

    2. Set the six secrets, run manually, and confirm both `own_rows=1`, both `peer_rows=0`, and both `rls_active=true`. Do not connect as the table owner or a role with `BYPASSRLS`.
    3. Connect a migration job to the webhook trigger. Enable the hourly schedule only after the first clean run. A permissive policy should fail the gate and notify once; restoring the policy should notify once that decisions recovered.

    ## Plugins used
    - [PostgreSQL Query](https://kestra.io/plugins/plugin-jdbc-postgres/io.kestra.plugin.jdbc.postgresql.query)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - Kestra core `If`, `Exit`, `Schedule`, `Webhook`, and KV tasks.

