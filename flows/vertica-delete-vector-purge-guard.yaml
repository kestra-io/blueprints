id: vertica-delete-vector-purge-guard
namespace: company.team

description: |
  Find Vertica projections whose delete vectors have grown past a row threshold, alert Slack,
  then optionally reclaim them. Every UPDATE and DELETE in Vertica writes a delete vector that
  stays on disk and is read on every scan of the projection until it is purged, so a table that
  takes a steady stream of deletes keeps getting slower while its visible row count is flat. The
  guard reads v_monitor.delete_vectors, reports the projections over the threshold with the rows
  each one can reclaim. When asked it advances the Ancient History Mark with MAKE_AHM_NOW, runs
  PURGE_TABLE on each flagged table, then reads v_monitor.delete_vectors again and fails if any
  vectors remain.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: Vertica JDBC URL
    defaults: "jdbc:vertica://vertica:5433/VMart"

  - id: username
    type: STRING
    displayName: Vertica user
    defaults: dbadmin

  - id: password
    type: STRING
    displayName: Vertica password
    description: Defaults to the VERTICA_PASSWORD secret. Override per run only for a passwordless test database.
    defaults: "{{ secret('VERTICA_PASSWORD') }}"

  - id: reclaimable_rows_threshold
    type: INT
    displayName: Reclaimable rows threshold
    description: A projection is flagged when its delete vectors cover more than this many rows.
    defaults: 100000

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for MAKE_AHM_NOW and PURGE_TABLE to run.
    defaults: true

variables:
  audit_sql: |
    SELECT dv.schema_name AS projection_schema,
           dv.projection_name AS projection_name,
           t.table_schema AS anchor_schema,
           t.table_name AS anchor_table,
           SUM(dv.deleted_row_count) AS deleted_rows,
           SUM(dv.used_bytes) AS dv_bytes,
           'SELECT PURGE_TABLE(' || QUOTE_LITERAL(QUOTE_IDENT(t.table_schema) || '.' || QUOTE_IDENT(t.table_name)) || ')' AS purge_sql
      FROM v_monitor.delete_vectors dv
      JOIN v_catalog.projections p
        ON p.projection_schema = dv.schema_name AND p.projection_name = dv.projection_name
      JOIN v_catalog.tables t
        ON t.table_id = p.anchor_table_id
     GROUP BY 1, 2, 3, 4
    HAVING SUM(dv.deleted_row_count) > {{ inputs.reclaimable_rows_threshold }}
     ORDER BY deleted_rows DESC

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.vertica.Query
    description: Read-only. Sums delete-vector rows per projection and keeps the ones over the threshold, with the PURGE_TABLE statement for each anchor table.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ inputs.username }}"
    password: "{{ inputs.password }}"
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: purges
    type: io.kestra.plugin.core.output.OutputValues
    description: One PURGE_TABLE per flagged anchor table, de-duplicated, since one table can carry several projections.
    values:
      sql: "{{ outputs.audit.rows | jq('map(.purge_sql) | unique') | first | toJson }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Vertica delete-vector audit on {{ inputs.jdbc_url }}: {{ outputs.audit.size }} projection(s) over the {{ inputs.reclaimable_rows_threshold }} row threshold.
      {{ outputs.audit.rows | jq('map("\(.anchor_schema).\(.anchor_table) [\(.projection_name)] \(.deleted_rows) rows") | join("; ")') | first }}.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Vertica ' ~ inputs.jdbc_url ~ ': ' ~ outputs.audit.size ~ ' projection(s) carrying delete vectors above ' ~ inputs.reclaimable_rows_threshold ~ ' rows: ' ~ (outputs.audit.rows | jq('map("\(.anchor_schema).\(.anchor_table) (\(.deleted_rows) rows)") | join(", ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Purging now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: advance_ahm
            type: io.kestra.plugin.jdbc.vertica.Query
            description: Advance the Ancient History Mark to now. PURGE only reclaims delete vectors older than the AHM, so without this the purge frees nothing.
            url: "{{ inputs.jdbc_url }}"
            username: "{{ inputs.username }}"
            password: "{{ inputs.password }}"
            fetchType: FETCH
            sql: SELECT MAKE_AHM_NOW()

          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            description: Sequential on purpose. PURGE_TABLE takes locks, so the flagged tables are remediated one at a time.
            concurrencyLimit: 1
            values: "{{ outputs.purges.values.sql }}"
            tasks:
              - id: purge
                type: io.kestra.plugin.jdbc.vertica.Query
                url: "{{ inputs.jdbc_url }}"
                username: "{{ inputs.username }}"
                password: "{{ inputs.password }}"
                fetchType: FETCH
                sql: "{{ item.value }}"

          - id: reaudit
            type: io.kestra.plugin.jdbc.vertica.Query
            url: "{{ inputs.jdbc_url }}"
            username: "{{ inputs.username }}"
            password: "{{ inputs.password }}"
            fetchType: FETCH
            sql: "{{ render(vars.audit_sql) }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.reaudit.size > 0 }}"
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "Delete vectors still over the threshold after purge: {{ outputs.reaudit.rows | jq('map(\"\\(.anchor_schema).\\(.anchor_table) \\(.deleted_rows) rows\") | join(\", \")') | first }}. The connecting user needs to own the flagged tables or be a superuser."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: "Purged and verified. {{ fromJson(outputs.purges.values.sql) | length }} table(s) back under the threshold."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No projection carries delete vectors over the threshold."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Vertica delete-vector purge guard failed on ' ~ inputs.jdbc_url ~ ' (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and always in safe mode.
    cron: "0 4 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Vertica Delete Vector Purge Guard
  shortDescription: Detect Vertica projections whose delete vectors exceed a row threshold, alert Slack, then optionally advance the Ancient History Mark and run PURGE_TABLE to reclaim them before re-checking.
  metaTitle: Vertica Delete Vector Purge Guard with Kestra
  metaDescription: Detect Vertica projections whose delete vectors pass a row threshold, alert Slack, advance the AHM and run PURGE_TABLE to reclaim scan time.
  description: |
    Vertica stores every UPDATE and DELETE as a delete vector, a marker that hides the old rows without rewriting the data. The marker sits on disk next to the projection and is read on every scan until it is purged, so a table that takes a steady stream of deletes keeps getting slower while its visible row count stays flat. The space those rows hold is not given back either.

    This guard reads `v_monitor.delete_vectors`, sums the reclaimable rows per projection and flags the projections over a threshold you set. It alerts Slack. When you let it, it advances the Ancient History Mark with `MAKE_AHM_NOW`, runs `PURGE_TABLE` on each flagged table one at a time, reads `v_monitor.delete_vectors` again then fails the run if any projection is still over the threshold.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Meaning |
    |---|---|
    | Delete vectors over threshold | A projection carries delete vectors covering more rows than `reclaimable_rows_threshold`. Every scan reads them, so the projection slows down and holds disk until it is purged. |

    ## Safety

    `PURGE` only reclaims delete vectors older than the Ancient History Mark (AHM), so the remediation advances the AHM with `MAKE_AHM_NOW` before it purges. Without that step the purge runs clean but frees nothing and the re-check then fails for the wrong reason. The guard stays read-only until `auto_remediate` is true and `dry_run` is false. The purge loop runs one table at a time. The re-check reads the system table a second time so a purge that did not land fails the run.

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.vertica.Query`, read-only) reads `v_monitor.delete_vectors`, joins each projection to its anchor table through `v_catalog.projections` and `v_catalog.tables`, sums the delete-vector rows per projection and returns the ones over `reclaimable_rows_threshold` with a `PURGE_TABLE` statement for each anchor table.
    2. `purges` keeps the distinct `PURGE_TABLE` statements, since one table can carry several projections. `summary` logs the flagged projections.
    3. `route` (`io.kestra.plugin.core.flow.If`) branches on whether anything was flagged.
       - clean: logs it.
       - flagged: `alert` posts to Slack. `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `advance_ahm` runs `SELECT MAKE_AHM_NOW()` so the delete vectors become purgeable.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs each `PURGE_TABLE` in turn.
         - `reaudit` and `verify_result` fail the run if any projection is still over the threshold.
    4. `errors` posts a Slack alert when any task fails.

    ## What you get

    - The projections that are actually slowing scans, with the rows each one can reclaim and the exact `PURGE_TABLE` to run.
    - A read-only default. Nothing is purged until you set `auto_remediate` true and `dry_run` false.
    - The AHM advanced before the purge, so the purge reclaims space instead of running clean and freeing nothing.
    - A second read of `v_monitor.delete_vectors` as proof, so a purge that did not reclaim fails the run.

    ## Who it's for

    - Teams running Vertica tables that take steady UPDATE or DELETE traffic and watch scans get slower.
    - DBAs who purge delete vectors by hand and want it on a schedule with a safe default.
    - Teams trying the Vertica plugin who want an example that reads a system table and drives maintenance from it.

    ## Why orchestrate this with Kestra

    Vertica purges delete vectors on its own only as the Tuple Mover ages them past the AHM, which can lag for days on a table under constant deletes. Running the purge on demand needs the AHM advance, the purge and the re-check wired together in the right order, with an alert when a table is behind and a hard stop when a purge does not land. Kestra runs that on a schedule, keeps the write behind two inputs, purges one table at a time, verifies the result and keeps a history of every run.

    ## Tested end to end

    On Kestra 2.0.5 OSS against Vertica Community Edition 9.2 (database `docker`, schema `analytics`), with the shared HTTP sink standing in for Slack. A table `analytics.events` was loaded with 5000 rows through `COPY ... DIRECT`, then rows were deleted and moved out to create delete vectors. `v_monitor.delete_vectors` was read directly before and after each run to confirm the result.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | clean table, threshold 100 | SUCCESS (`63soIhBwuFhnCo3zfoHJMr`). audit returned 0 projections. `v_monitor.delete_vectors` stayed at 0 rows. Clean path logged |
    | 2 | degraded table, threshold 500 | SUCCESS (`2B31SQQJ9g4ddGb84KZgtT`). 1 projection flagged (`analytics.events`, 1334 rows). Slack alert sent (HTTP 200). `delete_vectors` unchanged at 1334 |
    | 3 | `auto_remediate: true`, `dry_run: true` | SUCCESS (`5V8lXJzaQbtFlzgU5nfMgk`). Same report. dry_run held the purge back, so `delete_vectors` stayed at 1334 |
    | 4 | `auto_remediate: true`, `dry_run: false` | SUCCESS (`3txYU1SDyoIrJQJ6LxXL67`). `MAKE_AHM_NOW` then `PURGE_TABLE('analytics.events')`. The re-check came back clean. `delete_vectors` went 1334 to 0, confirmed in vsql |
    | 5 | unreachable database | FAILED (`1cgnbNKhtdhVnQQ6yFnoF7`). audit could not connect, so the `errors` block posted the failure alert to Slack (HTTP 200) |

    ## Prerequisites

    - A reachable Vertica cluster and its JDBC URL in `jdbc_url`.
    - For the audit, a user that can read `v_monitor.delete_vectors`, `v_catalog.projections` and `v_catalog.tables`. For remediation, a user that owns the flagged tables or is a superuser, since `PURGE_TABLE` and `MAKE_AHM_NOW` need that.
    - Local testing: `docker run -d --name vertica -p 5433:5433 jbfavre/vertica:latest` brings up a single node with a passwordless `dbadmin` and a database named `docker`.

    ### Secrets

    - `VERTICA_PASSWORD`: password for the Vertica user. The `password` input defaults to it.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:vertica://vertica:5433/VMart` | Vertica cluster to check |
    | `username` | `dbadmin` | Vertica user |
    | `password` | `{{ secret('VERTICA_PASSWORD') }}` | Password for that user |
    | `reclaimable_rows_threshold` | `100000` | Flag a projection over this many delete-vector rows |
    | `auto_remediate` | `false` | Allow MAKE_AHM_NOW and PURGE_TABLE |
    | `dry_run` | `true` | Must be `false` for a purge to run |

    ## Quick start

    1. Add the `VERTICA_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow and set `jdbc_url`, `username` and `reclaimable_rows_threshold`.
    3. Run it once with the defaults and read the flagged projections.
    4. When you are ready to reclaim, run with `auto_remediate: true` and `dry_run: false`.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Lower `reclaimable_rows_threshold` on tables where scan latency matters more than purge cost.
    - Swap `PURGE_TABLE` for `PURGE_PROJECTION` to reclaim one projection at a time on very large tables.
    - Drive a per-table threshold from a map instead of one number for the whole database.
    - Point the loop at a list of clusters to sweep a whole Vertica estate.
    - Replace the Slack alert with PagerDuty, Microsoft Teams or email.

    ## Links

    - Vertica plugin: https://kestra.io/plugins/plugin-jdbc-vertica
    - Vertica documentation: https://docs.vertica.com
  tags:
    - Data
    - Infrastructure
  subTags:
    - Data Warehouses
    - Maintenance & Optimization
    - Storage
  ee: false
  demo: false





