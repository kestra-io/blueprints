id: temporal-signal-broadcast
namespace: company.team
description: |
  Send the same signal to a list of running Temporal workflows in one
  operational action, then report to Discord how many workflows received it.

inputs:
  - id: workflow_ids
    type: JSON
    defaults:
      - order-processing-1001
      - order-processing-1002
      - order-processing-1003
    description: List of running Temporal workflow IDs that should receive the signal.

  - id: signal_name
    type: STRING
    defaults: pauseProcessing
    description: Signal name matching a registered signal handler on the target workflows, for example pauseProcessing, resumeProcessing, or reloadConfig.

  - id: signal_reason
    type: STRING
    defaults: planned maintenance window
    description: Human-readable reason passed to each signal handler as its single JSON-encoded argument.

  - id: temporal_namespace
    type: STRING
    defaults: default
    description: Temporal namespace hosting the target workflows.

tasks:
  - id: broadcast
    type: io.kestra.plugin.core.flow.ForEach
    description: Iterate over the workflow ID list and deliver the signal to each running workflow.
    values: "{{ inputs.workflow_ids }}"
    tasks:
      - id: send_signal
        type: io.kestra.plugin.temporal.workflow.Signal
        description: Send the named signal with the reason as a JSON-encoded argument to the latest open run of the current workflow ID.
        endpoint: "{{ secret('TEMPORAL_ENDPOINT') }}"
        namespace: "{{ inputs.temporal_namespace }}"
        workflowId: "{{ taskrun.value }}"
        signalName: "{{ inputs.signal_name }}"
        args:
          - '"{{ inputs.signal_reason }}"'

  - id: notify
    type: io.kestra.plugin.discord.DiscordIncomingWebhook
    description: Summarize the broadcast in Discord with the signal name and the number of workflows it reached.
    url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
    payload: |
      {
        "content": "Signal {{ inputs.signal_name }} delivered to {{ inputs.workflow_ids | length }} running Temporal workflows (execution {{ execution.id }})."
      }

errors:
  - id: alert_failure
    type: io.kestra.plugin.discord.DiscordIncomingWebhook
    description: Alert when any signal delivery fails so a partially applied broadcast never goes unnoticed.
    url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
    payload: |
      {
        "content": "Temporal signal broadcast FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Some workflows may not have received {{ inputs.signal_name }}; check the task logs for the failing workflow ID."
      }

extend:
  title: Broadcast a Signal to Running Temporal Workflows
  shortDescription: Fan out one Temporal signal, such as pause, resume, or config reload, to a list of running workflow IDs and report the delivery count to Discord.
  metaTitle: Broadcast Temporal Signals with Kestra
  metaDescription: Send one signal to many running Temporal workflows from Kestra. Fan out pause, resume, or config-reload signals over a workflow ID list, then report to Discord.
  description: |
    Signaling one Temporal workflow is a CLI one-liner; signaling fifty of them during an incident is a script someone writes in a hurry and loses afterwards. This blueprint turns that operational broadcast into a reviewable, repeatable flow: a `ForEach` iterates over a list of running workflow IDs and `io.kestra.plugin.temporal.workflow.Signal` delivers the same named signal, such as `pauseProcessing`, `resumeProcessing`, or `reloadConfig`, to each one, with a reason string passed to every handler. Discord gets a summary with the exact delivery count.

    ## How it works

    1. The `workflow_ids` input takes a JSON list of running workflow IDs, and `signal_name` selects which registered signal handler to invoke on them.
    2. `broadcast` (`io.kestra.plugin.core.flow.ForEach`) iterates over the list; its direct child `send_signal` (`io.kestra.plugin.temporal.workflow.Signal`) targets `{{ taskrun.value }}` and sends the signal with `signal_reason` as a single JSON-encoded argument. With no `runId` set, the signal reaches the latest open run of each workflow ID.
    3. `notify` posts the signal name and the list length to Discord, so the channel records how many workflows the broadcast reached.
    4. The `errors` block posts a distinct Discord alert when any delivery fails, since a partially applied pause is worse than no pause at all.

    ## What you get

    - One command that pauses, resumes, or reconfigures a whole fleet of running workflows.
    - An execution history entry for every broadcast, with per-workflow task runs showing exactly which deliveries succeeded.
    - A reason string attached to every signal, so workflow histories in Temporal record why they were signaled.
    - A failure alert that flags partial application immediately.

    ## Who it's for

    - On-call engineers who need to pause a class of workflows while a downstream dependency is degraded.
    - Platform teams rolling out configuration changes to long-running workflows without restarting them.
    - Anyone replacing ad hoc temporal CLI loops with an auditable operational runbook.

    ## Why orchestrate this with Kestra

    Temporal handles the signal semantics inside each workflow, but the broadcast itself, which IDs to hit, in what namespace, with what argument, and who gets told about it, is operational plumbing. Kestra keeps that plumbing declarative: the ID list and signal name are typed inputs, the endpoint lives in a secret, every run is auditable, and the same flow serves the incident at 3 a.m. and the planned maintenance window.

    ## Prerequisites

    - Running Temporal workflows whose implementations register a signal handler matching `signal_name`.
    - A Discord incoming webhook for the summary and failure alerts.
    - For Temporal Cloud, set the task's `apiKey` property; for mTLS clusters, provide `caCert`, `clientCert`, and `clientKey`.

    ### Secrets

    - `TEMPORAL_ENDPOINT`: Temporal frontend address in host:port format, for example temporal.example.com:7233.
    - `DISCORD_WEBHOOK_URL`: Discord incoming webhook URL.

    ## Quick start

    1. Add the two secrets to your Kestra namespace.
    2. Execute the flow with the IDs of a few running workflows and a signal name their implementation registers.
    3. Check the Discord summary and confirm the signals in each workflow's history in the Temporal UI.

    ## How to extend

    - Build the workflow ID list dynamically from an upstream task, such as a database query or an API call, instead of a static input.
    - Add a second `ForEach` that queries each workflow after signaling to confirm the state change, as shown in the Temporal workflow state probe blueprint.
    - Pair the pause broadcast with a resume broadcast in a second flow and chain them around a maintenance task.
    - Start workflows in bulk rather than signaling them, as shown in the Temporal batch launcher blueprint.

    ## Links

    - [Temporal plugin documentation](https://kestra.io/plugins/plugin-temporal)
    - [Temporal signals documentation](https://docs.temporal.io/sending-messages)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Flow Control & Conditions
  ee: false
  demo: false
