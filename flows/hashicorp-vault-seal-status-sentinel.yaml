id: hashicorp-vault-seal-status-sentinel
namespace: company.team
description: Audits HashiCorp Vault cluster nodes to verify seal status, initialization state, and leader readiness.

inputs:
  - id: vault_address
    type: STRING
    defaults: "http://vault.internal:8200"
    description: Base URL of the HashiCorp Vault cluster node to inspect.

tasks:
  - id: inspect_vault_cluster_health
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    description: Query Vault sys/health and sys/leader endpoints to audit cluster operational readiness
    env:
      VAULT_ADDR: "{{ inputs.vault_address }}"
      VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      vault_addr = os.environ.get("VAULT_ADDR", "http://vault.internal:8200").rstrip("/")
      token = os.environ.get("VAULT_TOKEN")

      # Vault sys/health returns HTTP 200 (healthy), 429 (standby), 472 (DR secondary),
      # 473 (perf standby), 501 (not initialized), 503 (sealed).
      # All of these status codes return structured JSON detailing the exact node posture.
      health_url = f"{vault_addr}/v1/sys/health"
      try:
          resp = requests.get(health_url, timeout=15)
          if resp.status_code in (200, 429, 472, 473, 501, 503):
              h = resp.json()
          else:
              resp.raise_for_status()
              h = resp.json()
      except Exception as e:
          print(f"CRITICAL: Failed to query Vault /v1/sys/health at {health_url}: {e}", file=sys.stderr)
          sys.exit(1)

      leader_headers = {"User-Agent": "Kestra-Vault-Sentinel"}
      if token:
          leader_headers["X-Vault-Token"] = token

      leader_url = f"{vault_addr}/v1/sys/leader"
      is_leader = False
      try:
          l_resp = requests.get(leader_url, headers=leader_headers, timeout=15)
          if l_resp.status_code == 200:
              l = l_resp.json()
              is_leader = l.get("is_self", False)
      except Exception as err:
          print(f"Warning: unable to query leader status: {err}", file=sys.stderr)

      is_sealed = h.get("sealed", True)
      is_init = h.get("initialized", False)
      cluster_degraded = is_sealed or (not is_init)

      print(f"Vault health: initialized={is_init}, sealed={is_sealed}, is_leader={is_leader}")

      Kestra.outputs({
          "vault_addr": vault_addr,
          "initialized": is_init,
          "sealed": is_sealed,
          "version": h.get("version", "unknown"),
          "cluster_name": h.get("cluster_name", "unknown"),
          "is_leader": is_leader,
          "alert_triggered": cluster_degraded
      })

  - id: evaluate_cluster_readiness
    type: io.kestra.plugin.core.flow.If
    description: Alert security operations if node is sealed or uninitialized
    condition: "{{ outputs.inspect_vault_cluster_health.vars.alert_triggered == true }}"
    then:
      - id: alert_security_operations
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *HashiCorp Vault Critical Alert*: Vault node at `{{ inputs.vault_address }}` is sealed or uninitialized (Sealed: {{ outputs.inspect_vault_cluster_health.vars.sealed }}, Initialized: {{ outputs.inspect_vault_cluster_health.vars.initialized }}). Immediate unseal intervention required."
          }

outputs:
  - id: sealed
    type: BOOLEAN
    value: "{{ outputs.inspect_vault_cluster_health.vars.sealed }}"
  - id: initialized
    type: BOOLEAN
    value: "{{ outputs.inspect_vault_cluster_health.vars.initialized }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.inspect_vault_cluster_health.vars.alert_triggered }}"

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Vault Sentinel Execution Failure*: Unable to reach Vault endpoint at {{ inputs.vault_address }} during execution `{{ execution.id }}`."
      }

triggers:
  - id: scheduled_health_pulse
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  metaDescription: Audits HashiCorp Vault cluster nodes to verify seal status, initialization state, and leader readiness.
  metaTitle: HashiCorp Vault Seal Status and HA Cluster Readiness Sentinel with Kestra
  title: HashiCorp Vault Seal Status and HA Cluster Readiness Sentinel
  shortDescription: Audits HashiCorp Vault cluster nodes to verify seal status, initialization state, and leader readiness.
  description: |
    ## How it works
    This sentinel queries the HashiCorp Vault `/v1/sys/health` and `/v1/sys/leader` API endpoints. It validates that the node is properly initialized, unsealed, and able to participate in High Availability consensus, firing emergency notifications if an unexpected seal event locks out identity operations.

    ## What you get
    - Continuous programmatic validation of secret engine readiness.
    - Rapid detection of accidental node reboot or unseal threshold lockouts.
    - Immediate incident alerting sent directly to security operations channels.

    ## Who it's for
    - Security operations (SecOps) engineers and platform administrators managing Vault infrastructure.
    - SREs responsible for central secret management availability.

    ## Prerequisites
    - Network connectivity to HashiCorp Vault HTTP/HTTPS port (default 8200).
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Infrastructure
    - Security
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
