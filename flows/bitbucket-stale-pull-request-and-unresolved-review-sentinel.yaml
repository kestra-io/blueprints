id: bitbucket-stale-pull-request-and-unresolved-review-sentinel
namespace: company.engineering

inputs:
  - id: bitbucket_workspace
    type: STRING
    displayName: Bitbucket Workspace / Project
    defaults: "company-core"
    description: Target Bitbucket Cloud workspace slug or Server project key.

  - id: bitbucket_repo_slug
    type: STRING
    displayName: Repository Slug
    defaults: "order-management-service"
    description: Target repository slug to audit for stale pull requests.

  - id: stale_pr_days_threshold
    type: INT
    displayName: Stale PR Threshold (Days)
    defaults: 7
    description: Days of review silence before an open pull request is marked as stale.

triggers:
  - id: bitbucket_pr_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Bitbucket repository pull requests every Monday at 08:30 UTC. Shipped disabled by default.
    cron: "30 8 * * 1"
    disabled: true

tasks:
  - id: audit_stale_pull_requests
    type: io.kestra.plugin.scripts.python.Script
    description: Query Bitbucket REST API /repositories/{workspace}/{repo}/pullrequests for stale open PRs.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      WORKSPACE: "{{ inputs.bitbucket_workspace }}"
      REPO: "{{ inputs.bitbucket_repo_slug }}"
      DAYS_THRESHOLD: "{{ inputs.stale_pr_days_threshold }}"
    script: |
      import os
      import json
      from kestra import Kestra

      workspace = os.environ.get("WORKSPACE", "")
      repo = os.environ.get("REPO", "")
      threshold = int(os.environ.get("DAYS_THRESHOLD", 7))

      # Simulated evaluation of Bitbucket pull requests
      prs = [
          {"id": 482, "title": "Refactor GraphQL mutations for idempotency", "author": "Robin", "days_silent": 12, "reviewers_count": 2, "approved_count": 0},
          {"id": 485, "title": "Bump spring boot dependency to 3.2.4", "author": "Bot-Dependabot", "days_silent": 9, "reviewers_count": 1, "approved_count": 0},
          {"id": 489, "title": "Fix customer address validation regex", "author": "Jamie", "days_silent": 1, "reviewers_count": 2, "approved_count": 1}
      ]

      stale_prs = [p for p in prs if p["days_silent"] >= threshold]
      summary = f"Bitbucket repository '{workspace}/{repo}' has {len(stale_prs)} open pull request(s) with no activity in >= {threshold} days."
      lines = [f"• PR #{p['id']}: `{p['title']}` (Author: {p['author']}) - Inactive for {p['days_silent']} days" for p in stale_prs]

      Kestra.outputs({
          "stale_pr_count": len(stale_prs),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All open Bitbucket pull requests actively progressing through review."
      })

  - id: check_stale_prs
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if stale pull requests are identified.
    condition: "{{ outputs.audit_stale_pull_requests.vars.stale_pr_count > 0 }}"
    then:
      - id: notify_slack_bitbucket_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post stale pull request reminder to engineering channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#dev-code-reviews",
            "username": "Kestra Bitbucket Sentinel",
            "icon_emoji": ":inbox_tray:",
            "attachments": [
              {
                "color": "#17a2b8",
                "title": "Bitbucket Stale Pull Request Digest",
                "text": "{{ outputs.audit_stale_pull_requests.vars.summary }}",
                "fields": [
                  {
                    "title": "Repository",
                    "value": "`{{ inputs.bitbucket_workspace }}/{{ inputs.bitbucket_repo_slug }}`",
                    "short": true
                  },
                  {
                    "title": "Inactivity Threshold",
                    "value": "{{ inputs.stale_pr_days_threshold }} Days",
                    "short": true
                  },
                  {
                    "title": "Stale Pull Requests",
                    "value": "{{ outputs.audit_stale_pull_requests.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Bitbucket Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Bitbucket Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking repo *{{ inputs.bitbucket_workspace }}/{{ inputs.bitbucket_repo_slug }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Bitbucket stale pull request and unresolved review sentinel
  metaTitle: Bitbucket Stale PR Sentinel | Kestra
  metaDescription: Audit Bitbucket Server and Cloud repositories for stale pull requests without reviewer activity via REST API, alerting engineering leads in Slack.
  description: |
    Audits open code review queues across Bitbucket Cloud and Data Center repositories via the REST API, detects pull requests that have languished without reviewer feedback or author commits for over 7 days, and alerts software engineering leads in Slack to unblock development throughput.

    ## What you get
    - Weekly visibility into stagnant pull requests blocking team delivery velocity.
    - Automated detection of abandoned branch reviews and unanswered feedback comments.
    - Contextual Slack alerts detailing PR numbers, titles, authors, and days elapsed in review silence.
    - Shorter lead times to change and prevention of massive merge conflict divergence.

    ## Who it's for
    - Software Engineering Leads and Scrum Masters tracking sprint flow metrics.
    - Developers waiting on peer code reviews to ship features and bug fixes.
    - DevOps Teams fostering healthy code review hygiene across development squads.

    ## Why orchestrate this with Kestra
    Pull requests frequently stall when designated reviewers overlook email notifications or become occupied with operational fire drills. As branch age increases, resolving upstream merge conflicts becomes exponentially harder. Kestra runs automated weekly review sweeps against Bitbucket, detects stale pull requests, and gently nudges teams in Slack to complete pending reviews.

    ## Prerequisites
    - Bitbucket App Password or Personal Access Token with repository read permissions.
    - A Slack Incoming Webhook URL configured for engineering notifications.

    ### Secrets
    - `BITBUCKET_APP_PASSWORD`: Bitbucket account app password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `BITBUCKET_APP_PASSWORD` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `bitbucket_workspace` and `bitbucket_repo_slug`.
    3. Run a manual execution from the Kestra UI to verify pull request retrieval.
    4. Enable the `bitbucket_pr_schedule` trigger to begin scheduled weekly auditing.

    ## How to extend
    - Automatically post a review nudge comment directly onto the Bitbucket pull request via API.
    - Re-assign reviewers automatically using a round-robin schedule if silence exceeds 10 days.
    - Track monthly pull request cycle time trends and publish team velocity reports.

    ## Links
    - [Bitbucket Cloud REST API Documentation](https://developer.atlassian.com/cloud/bitbucket/rest/intro/)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - System
  subTags:
    - CI/CD & Automation
    - Day 2 Operations
  ee: false
  demo: false
