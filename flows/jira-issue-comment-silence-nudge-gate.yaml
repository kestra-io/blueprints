id: jira-issue-comment-silence-nudge-gate
namespace: company.team

description: |
  Read a Jira issue's full comment history, classify how many days have passed since the last
  real comment, post an automatic nudge comment only when explicitly authorized, alert Slack
  otherwise, and log a governance audit trail either way.

inputs:
  - id: jira_base_url
    type: STRING
    displayName: Jira base URL
    description: Base Jira Cloud or Server URL, for example https://your-domain.atlassian.net.
    defaults: "https://your-domain.atlassian.net"

  - id: jira_username
    type: STRING
    displayName: Jira username
    description: Jira account email used for Basic authentication alongside the API token.
    defaults: "<your-jira-account-email>"

  - id: issue_key
    type: STRING
    displayName: Issue key
    description: Jira issue key to monitor, for example PROJ-123.
    defaults: "PROJ-123"

  - id: silence_days
    type: INT
    displayName: Silence threshold in days
    description: An issue whose most recent comment is this many days old or older is classified silent.
    defaults: 7

  - id: confirm_nudge
    type: BOOL
    displayName: Confirm automatic nudge
    description: When true, this flow is authorized to post a nudge comment on the issue itself. When false, silence only alerts Slack so a human follows up.
    defaults: false

tasks:
  - id: get_comments
    type: io.kestra.plugin.jira.comments.Get
    description: Read-only probe. Fetches every comment on the issue; nothing is posted here.
    allowFailure: true
    baseUrl: "{{ inputs.jira_base_url }}"
    username: "{{ inputs.jira_username }}"
    password: "{{ secret('JIRA_API_TOKEN') }}"
    issueIdOrKey: "{{ inputs.issue_key }}"
    fetchType: FETCH

  - id: evaluate
    type: io.kestra.plugin.core.output.OutputValues
    description: Takes the date-only portion of every comment's created timestamp (sidestepping Jira's non-standard timezone-offset format, which jq's fromdateiso8601 cannot parse directly) and compares the most recent one against silence_days, folding confirm_nudge into the silent classification so the Switch branch needs no further nesting.
    values:
      comment_count: "{{ outputs.get_comments is not defined ? -1 : outputs.get_comments.size }}"
      last_comment_date: >-
        {{ outputs.get_comments is not defined ? '' : (({'rows': outputs.get_comments.rows} | jq('[(.rows // [])[] | .created[0:10]] | if length == 0 then "1970-01-01" else max end')) | first) }}
      severity: >-
        {{ outputs.get_comments is not defined ? 'PROBE_FAILED' : (((({'rows': outputs.get_comments.rows} | jq('[(.rows // [])[] | .created[0:10]] | if length == 0 then "1970-01-01" else max end')) | first) <= (now() | dateAdd(-inputs.silence_days, 'DAYS') | date('yyyy-MM-dd'))) ? (inputs.confirm_nudge ? 'SILENT_AUTO_NUDGE' : 'SILENT_NEEDS_HUMAN') : 'ACTIVE') }}

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    description: ACTIVE just logs. SILENT_AUTO_NUDGE performs the safe remediation (a comment is reversible and adds visibility, it changes no issue field) only when confirm_nudge authorizes it. SILENT_NEEDS_HUMAN and PROBE_FAILED both alert Slack instead.
    value: "{{ outputs.evaluate.values.severity }}"
    cases:
      "ACTIVE":
        - id: log_active
          type: io.kestra.plugin.core.log.Log
          message: "{{ inputs.issue_key }} has {{ outputs.evaluate.values.comment_count }} comment(s), last on {{ outputs.evaluate.values.last_comment_date }}, within the {{ inputs.silence_days }}-day silence threshold."
      "SILENT_AUTO_NUDGE":
        - id: post_nudge_comment
          type: io.kestra.plugin.jira.issues.CreateComment
          description: Posts an automatic nudge comment now that confirm_nudge explicitly authorizes this flow to act; a comment is reversible and changes no issue field.
          baseUrl: "{{ inputs.jira_base_url }}"
          username: "{{ inputs.jira_username }}"
          password: "{{ secret('JIRA_API_TOKEN') }}"
          issueIdOrKey: "{{ inputs.issue_key }}"
          body: "Automated nudge: this issue has had no comment since {{ outputs.evaluate.values.last_comment_date }}, over the {{ inputs.silence_days }}-day silence threshold. Flagging for an update."
        - id: alert_auto_nudged
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'SILENT_AUTO_NUDGE: ' ~ inputs.issue_key ~ ' has had no comment since ' ~ outputs.evaluate.values.last_comment_date ~ ', over the ' ~ inputs.silence_days ~ '-day threshold. Posted an automatic nudge comment.'} | toJson }}
      "SILENT_NEEDS_HUMAN":
        - id: alert_silent
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'SILENT_NEEDS_HUMAN: ' ~ inputs.issue_key ~ ' has had no comment since ' ~ outputs.evaluate.values.last_comment_date ~ ', over the ' ~ inputs.silence_days ~ '-day threshold. Set confirm_nudge to true to let this flow comment automatically, or follow up manually now.'} | toJson }}
      "PROBE_FAILED":
        - id: alert_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'PROBE_FAILED: could not read comments for ' ~ inputs.issue_key ~ '. Check the JIRA_API_TOKEN secret, jira_base_url, and that the issue key is correct.'} | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "Jira issue comment silence nudge gate complete for {{ inputs.issue_key }}: {{ outputs.evaluate.values.comment_count }} comment(s), severity {{ outputs.evaluate.values.severity }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Jira issue comment silence nudge gate failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable once JIRA_API_TOKEN and SLACK_WEBHOOK_URL are set and issue_key points at a real issue; confirm_nudge stays false by default so silence alerts a human rather than auto-commenting until you deliberately opt in.
    cron: "0 9 * * *"
    disabled: true
    inputs:
      jira_base_url: "https://your-domain.atlassian.net"
      jira_username: "<your-jira-account-email>"
      issue_key: "PROJ-123"
      silence_days: 7
      confirm_nudge: false

extend:
  title: Jira Issue Comment Silence Nudge Gate
  metaTitle: Jira Issue Comment Silence Nudge Gate with Kestra
  shortDescription: Read a Jira issue's comment history, alert Slack or post an automatic nudge comment on silence, and log a governance audit trail.
  metaDescription: Audit Jira issue comment silence, alert Slack or auto-post a nudge comment, and log the result for engineering and support teams.
  description: |
    An open Jira issue can sit for weeks with its status field untouched while the real signal of
    neglect is quieter: nobody has said anything about it. A status-based SLA check can show an
    issue as still "In Progress" right up until someone closes it, long after anyone actually
    looked at it. This blueprint reads the issue's full comment history, measures the real number
    of days since the last comment, and can post an automatic nudge once you have explicitly said
    this flow is allowed to.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `get_comments` (`io.kestra.plugin.jira.comments.Get`) fetches every comment on the
       issue. Read-only; nothing is posted here. `allowFailure: true` covers an API or auth
       error without failing the flow outright.
    2. `evaluate` (`io.kestra.plugin.core.output.OutputValues`) takes the date-only portion of
       every comment's `created` timestamp, finds the most recent one, and compares it against
       `silence_days`, classifying the issue as `ACTIVE`, `SILENT_AUTO_NUDGE`,
       `SILENT_NEEDS_HUMAN`, or `PROBE_FAILED`, folding `confirm_nudge` into the silent
       classification itself.
    3. `route` (`io.kestra.plugin.core.flow.Switch`):
       - **ACTIVE:** logs the comment count and last comment date.
       - **SILENT_AUTO_NUDGE:** runs `io.kestra.plugin.jira.issues.CreateComment` (the safe
         remediation, since a comment is reversible and changes no issue field), then posts a
         Slack notice.
       - **SILENT_NEEDS_HUMAN / PROBE_FAILED:** posts a Slack alert instead of commenting.
    4. `summary` logs the comment count and severity, closing the governance cycle.
    5. `errors` alerts Slack if the flow itself fails, for example an expired API token.

    ## What you get

    - A silence measurement from the issue's real comment timeline, not its status field, which
      can sit unchanged for weeks regardless of whether anyone is actually paying attention.
    - A nudge comment that only ever gets posted once you have explicitly set `confirm_nudge` to
      allow it, and that changes no issue field, assignee, or status.
    - A Slack alert naming the exact last-comment date, so a human can see at a glance how long
      the issue has actually been quiet.

    ## Who it's for

    - Engineering managers and support leads who want silence on a specific issue caught by its
      real comment activity, not by trusting a status field someone forgot to update.
    - Teams evaluating the Jira plugin who want a worked example of `comments.Get` and
      `issues.CreateComment` used together as a compliance gate, distinct from this repo's
      existing Jira blueprints, which search by status and `updated` timestamp via JQL rather
      than reading an issue's actual comment history, and which are explicitly read-only.

    ## Why orchestrate this with Kestra

    Jira can list and post comments on request, but it has no silence policy, no escalation, and
    no Slack integration of its own. Kestra keeps `silence_days` and `confirm_nudge` as flow
    inputs, turns a raw comment timeline into a silence decision, and keeps a full execution
    history of every issue this flow has checked and what it did about it.

    ## Prerequisites

    - A Jira Cloud or Server instance with an API token that can read and comment on the
      watched issue.
    - A real issue you can compare against, with at least one comment older than `silence_days`
      to confirm the silent path.
    - A Slack incoming webhook URL.

    Jira is a hosted SaaS platform (or a self-managed Server instance) with no simple official
    standalone Docker image for Cloud, so `get_comments` cannot be exercised against a local
    container; validate against a real Jira Cloud free-tier site first.

    ### Secrets

    - `JIRA_API_TOKEN`: the Jira API token used by `get_comments` and `post_nudge_comment`,
      alongside `jira_username` for Basic authentication. In Kestra OSS, provide it as the
      base64-encoded environment variable `SECRET_JIRA_API_TOKEN`.
    - `SLACK_WEBHOOK_URL`: used by all three Slack alert cases and the `errors` block. In Kestra
      OSS, provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `issue_key` | `PROJ-123` | Jira issue to monitor |
    | `silence_days` | `7` | Days since the last comment past which the issue is silent |
    | `confirm_nudge` | `false` | Authorizes this flow to post a nudge comment itself |

    ### Outputs

    - `{{ outputs.get_comments.rows }}` / `.size`: every comment on the issue and how many there
      are, as Jira's REST v2 API reports them.
    - `{{ outputs.evaluate.values.comment_count }}` / `.last_comment_date`: the comment count and
      the date-only portion of the most recent comment's timestamp.
    - `{{ outputs.evaluate.values.severity }}`: `ACTIVE`, `SILENT_AUTO_NUDGE`,
      `SILENT_NEEDS_HUMAN`, or `PROBE_FAILED`.

    ### Pitfalls

    - Jira's REST v2 comment `created` field uses a timezone-offset format (for example
      `2026-09-01T10:15:30.000+0000`), not the `Z`-suffixed format jq's `fromdateiso8601`
      expects; verified directly against `comments.Get`'s own response handling, since neither
      its Javadoc nor its field list documents the exact timestamp format. This blueprint
      deliberately compares only the first 10 characters (the date) rather than parsing the full
      timestamp, avoiding the format mismatch entirely at the cost of day-level, not
      hour-level, precision.
    - An issue with zero comments is treated as maximally silent (a `1970-01-01` sentinel date),
      not as a parsing error, since `allowFailure` only catches a failed API call, not an empty
      but valid comment list.
    - `confirm_nudge` applies to every run that finds the issue silent, not once; a scheduled
      run with it set to `true` posts a new nudge comment every time it fires and the issue is
      still silent, so raise `silence_days` or disable the trigger once a human has picked the
      issue up to avoid repeat nudges.

    ## Quick start

    1. Add the `JIRA_API_TOKEN` and `SLACK_WEBHOOK_URL` secrets.
    2. Set `jira_base_url`, `jira_username`, and `issue_key` to a real Jira Cloud issue.
    3. Run the flow manually and confirm `summary` logs a comment count and date.
    4. With an issue silent past `silence_days` and `confirm_nudge: false`, confirm
       `alert_silent` fires.
    5. Run again with `confirm_nudge: true` and confirm `post_nudge_comment` posts a comment and
       `alert_auto_nudged` fires.
    6. Enable the `daily` trigger once the inputs reflect a real issue and policy.

    ## How to extend

    - Feed `issue_key` from a JQL search (such as this repo's existing
      `jira-stale-issue-sla-compliance-gate`) to run this comment-silence check across every
      issue a status-based sweep already flagged, instead of one issue at a time.
    - Skip the nudge when the most recent comment was itself a bot or automation account, to
      avoid an infinite loop of automated nudges answering each other.
    - Route `confirm_nudge` per issue priority, auto-nudging only `Critical`/`Blocker` issues
      while lower-priority ones stay alert-only.

    ## Links

    - Jira plugin: https://kestra.io/plugins/plugin-jira
    - Jira REST API v2 comment reference: https://developer.atlassian.com/cloud/jira/platform/rest/v2/api-group-issue-comments/
    - Slack incoming webhooks: https://api.slack.com/messaging/webhooks
