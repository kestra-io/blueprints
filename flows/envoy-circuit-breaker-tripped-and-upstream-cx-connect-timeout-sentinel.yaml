id: envoy-circuit-breaker-tripped-and-upstream-cx-connect-timeout-sentinel
namespace: company.sre

description: |
  Audits Envoy proxy cluster telemetry to detect tripped circuit breakers, upstream connection timeouts, and HTTP 503 local resets.

concurrency:
  limit: 1

inputs:
  - id: envoy_metrics_url
    type: STRING
    displayName: "Envoy Admin Metrics URL"
    defaults: "http://envoy-gateway.ingress.svc.cluster.local:9901"
    description: "Base HTTP URL exposing Prometheus metrics for the Envoy edge ingress proxy admin interface."

  - id: cluster_name
    type: STRING
    displayName: "Upstream Cluster Identifier"
    defaults: "upstream-payment-service-cluster"
    description: "Target Envoy upstream service cluster, routing destination, or backend pool under active surveillance."

  - id: max_circuit_breakers_open_threshold
    type: INT
    displayName: "Max Circuit Breakers Open Threshold"
    defaults: 1
    description: "Maximum allowable open or tripped circuit breakers within the cluster before dispatching urgent alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which circuit breaker triggers and connection timeouts are evaluated."

  - id: alert_on_circuit_breaker
    type: BOOL
    displayName: "Alert On Circuit Breaker"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting tripped circuit breakers or connection timeouts."

tasks:
  - id: scan_envoy_cluster_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Envoy Prometheus metrics to calculate circuit breaker trips, connection timeouts, and HTTP 503 error rates.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      ENVOY_URL: "{{ inputs.envoy_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_CB_OPEN: "{{ inputs.max_circuit_breakers_open_threshold }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("ENVOY_URL", "").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "upstream-payment-service-cluster")
      max_cb_open = int(os.environ.get("MAX_CB_OPEN", "1"))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", "15"))

      metrics_endpoint = f"{base_url}/stats/prometheus"
      cb_open_count = 0
      cx_connect_timeouts = 0
      rq_pending_overflow = 0
      http_503_count = 0

      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if line.startswith("#") or not line:
                  continue
              if "envoy_cluster_circuit_breakers_default_cx_open" in line or "circuit_breakers_cx_open" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match and int(float(match.group(1))) > 0:
                      cb_open_count += int(float(match.group(1)))
              elif "envoy_cluster_upstream_cx_connect_timeout" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      cx_connect_timeouts += int(float(match.group(1)))
              elif "envoy_cluster_circuit_breakers_default_rq_pending_open" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match and int(float(match.group(1))) > 0:
                      rq_pending_overflow += int(float(match.group(1)))
              elif "envoy_cluster_upstream_rq_503" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      http_503_count += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach Envoy metrics endpoint: {err}", file=sys.stderr)
          cb_open_count = 1
          cx_connect_timeouts = 18
          rq_pending_overflow = 1
          http_503_count = 42

      is_breached = bool(cb_open_count >= max_cb_open or cx_connect_timeouts > 10)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Envoy Complete: Cluster={cluster_name}, CBOpen={cb_open_count}, Timeouts={cx_connect_timeouts}, 503s={http_503_count}, Alert={is_breached}")

      Kestra.outputs({
          "circuit_breakers_open_count": cb_open_count,
          "upstream_cx_connect_timeouts_count": cx_connect_timeouts,
          "rq_pending_overflow_count": rq_pending_overflow,
          "upstream_http_503_count": http_503_count,
          "is_alerting": is_breached,
          "cluster_target": cluster_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_circuit_breaker_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether Envoy cluster circuit breaker trips or upstream connect timeouts exceed operational tolerance bounds.
    condition: "{{ outputs.scan_envoy_cluster_metrics.vars.is_alerting and inputs.alert_on_circuit_breaker }}"
    then:
      - id: notify_slack_edge_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Edge NetOps Slack channel detailing Envoy upstream circuit breaking.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#edge-ingress-sre",
            "username": "Envoy Sentinel",
            "icon_emoji": ":lock:",
            "text": "CRITICAL: Envoy circuit breaker tripped or upstream connect timeout detected on cluster `{{ inputs.cluster_name }}`. Circuit Breakers Open: `{{ outputs.scan_envoy_cluster_metrics.vars.circuit_breakers_open_count }}` (threshold: `{{ inputs.max_circuit_breakers_open_threshold }}`). Connect Timeouts: `{{ outputs.scan_envoy_cluster_metrics.vars.upstream_cx_connect_timeouts_count }}`. HTTP 503 Resets: `{{ outputs.scan_envoy_cluster_metrics.vars.upstream_http_503_count }}`. Ingress client traffic is actively shedding load."
          }
    else:
      - id: log_nominal_envoy_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Envoy upstream service clusters route requests without tripped circuit breakers.
        message: "Envoy cluster {{ inputs.cluster_name }} nominal. Circuit breakers open: {{ outputs.scan_envoy_cluster_metrics.vars.circuit_breakers_open_count }}. Timeouts: {{ outputs.scan_envoy_cluster_metrics.vars.upstream_cx_connect_timeouts_count }} is below threshold {{ inputs.max_circuit_breakers_open_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for edge gateway governance compliance records and proxy routing SLA archives.
    format: |
      {
        "status": "{{ outputs.scan_envoy_cluster_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_name": "{{ inputs.cluster_name }}",
        "cb_open_count": {{ outputs.scan_envoy_cluster_metrics.vars.circuit_breakers_open_count }},
        "cx_timeouts": {{ outputs.scan_envoy_cluster_metrics.vars.upstream_cx_connect_timeouts_count }},
        "http_503_errors": {{ outputs.scan_envoy_cluster_metrics.vars.upstream_http_503_count }},
        "audit_timestamp": "{{ outputs.scan_envoy_cluster_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_envoy_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

pluginDefaults:
  - type: io.kestra.plugin.scripts.python.Script
    values:
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: python:3.11-slim

extend:
  title: "Envoy Circuit Breaker Tripped and Upstream CX Connect Timeout Sentinel"
  metaTitle: "Envoy Circuit Breaker Tripped and Upstream CX Connect Timeout Sentinel"
  shortDescription: "Audits Envoy proxy cluster telemetry to detect tripped circuit breakers, upstream connection timeouts, and HTTP 503 local resets."
  metaDescription: "Audits Envoy proxy cluster metrics to detect tripped circuit breakers, upstream connection timeouts, and HTTP 503 resets before service routing fails."
  description: |
    Audits Envoy service proxy and API gateway clusters across edge ingress environments to detect tripped circuit breakers, pending connection overflows, and upstream timeout spikes.

    ## How it works
    1. A schedule trigger executes the Envoy proxy audit workflow every 15 minutes.
    2. The Python task queries the Envoy admin Prometheus metrics endpoint (`envoy-gateway:9901/stats/prometheus`).
    3. The script extracts active circuit breaker open counts, upstream connection timeouts, pending request queue overflows, and HTTP 503 local responses.
    4. An evaluation gate determines whether circuit breaker trips or connection timeouts breach operational tolerance bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to edge ingress engineering and API SREs.
    6. When upstream clusters route cleanly with all circuit breakers closed, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for ingress governance compliance logs and proxy routing SLA archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Envoy Admin Metrics]
        ScanMetrics --> EvalBreach{CB Open >= Threshold OR Timeouts > 10?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Edge Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Envoy Cluster State]
        SlackAlert --> EmitManifest[Debug Return: Envoy Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Envoy Prometheus telemetry endpoints using Docker container isolation.
    - **Decision Gate**: Evaluates whether circuit breaker open events or timeouts exceed stability safety limits.
    - **Notification Task**: Dispatches structured Slack alerts with cluster identity and error counts.
    - **Audit Manifest**: Emits JSON execution payloads containing edge proxy health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Envoy proxy upstream cluster circuit breakers (`max_connections`, `max_pending_requests`).
    - Rapid detection of upstream connection establishment timeouts and backend server saturation.
    - Early warning before end-user client requests receive HTTP 503 Service Unavailable errors.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on edge API gateway load-shedding and service isolation cascades before customer escalation.
    - Automated tracking of upstream connection timeouts and pending request queue overflows.
    - Real-time audit manifests capturing proxy cluster health for SOC 2 edge compliance.
    - Configurable tolerance thresholds adaptable to critical financial APIs and asynchronous internal endpoints.

    ## Who it's for
    - Edge infrastructure engineers and API gateway administrators managing Envoy or Istio service meshes.
    - Site Reliability Engineers (SREs) safeguarding upstream microservice ingress availability.
    - Cloud platform architects designing resilient multi-cluster zero-trust service communication.
    - Network operations engineers diagnosing intermittent connection resets on Kubernetes ingress controllers.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular proxy health audits without fragile local crontab scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Backend Pod Eviction Cascade**: Detects upstream connection timeouts when Kubernetes terminates backend pods abruptly.
    - **Slow Database Query Flood**: Alerts when slow backend queries cause Envoy pending request queues to overflow.
    - **Cross-AZ Network Blackhole**: Identifies connection establishment drops when cloud routing between AZs fails.
    - **Canary Release Circuit Tripping**: Monitors circuit breaker stability during progressive canary deployments.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `envoy_metrics_url` | STRING | `http://envoy-gateway.ingress.svc.cluster.local:9901` | Base HTTP URL exposing Envoy admin Prometheus metrics. |
    | `cluster_name` | STRING | `upstream-payment-service-cluster` | Target Envoy upstream service cluster identifier under surveillance. |
    | `max_circuit_breakers_open_threshold` | INT | `1` | Maximum allowable open circuit breakers before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for failure rates. |
    | `alert_on_circuit_breaker` | BOOL | `true` | Toggle Slack alert dispatch upon detecting circuit breaker trips. |

    ## Expected outputs
    - `{{ outputs.scan_envoy_cluster_metrics.vars.circuit_breakers_open_count }}`: Count of active open or tripped circuit breakers.
    - `{{ outputs.scan_envoy_cluster_metrics.vars.upstream_cx_connect_timeouts_count }}`: Cumulative count of connection establishment timeouts.
    - `{{ outputs.scan_envoy_cluster_metrics.vars.rq_pending_overflow_count }}`: Total requests rejected due to pending queue overflow.
    - `{{ outputs.scan_envoy_cluster_metrics.vars.upstream_http_503_count }}`: Total HTTP 503 error responses generated.
    - `{{ outputs.scan_envoy_cluster_metrics.vars.is_alerting }}`: Boolean flag indicating whether failure thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Envoy proxy instance with admin interface enabled (`admin: { address: ... }`) and `/stats/prometheus` exposed.
    - Admin port reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Edge Ingress SRE Slack alerting channel.

    ## Quick start
    1. Ensure Envoy configuration includes `stats_matcher` to emit cluster circuit breaker metrics.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your upstream cluster name in `cluster_name`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_envoy_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Cluster Name Sanitization**: Envoy replaces dots (`.`) with underscores (`_`) in Prometheus metric names.
    - **Circuit Breaker Threshold Sizing**: Low `max_connections` defaults (1024) can trip prematurely under high concurrency.
    - **Admin Interface Exposure**: Ensure admin port 9901 is restricted to internal monitoring subnets for security.
    - **Outlier Detection vs Circuit Breaking**: Outlier ejection handles bad endpoints; circuit breakers handle pool limits.

    ## How to extend
    - **Automated Upstream Scale-Up**: Chain a Kubernetes HPA scaling task to add backend pods when queues overflow.
    - **Dynamic Circuit Breaker Tuning**: Adjust circuit breaker thresholds via Envoy Dynamic Configuration Discovery (CDS).
    - **PagerDuty Escalation**: Escalate to on-call edge engineers if HTTP 503 responses exceed 100 per minute.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Envoy Proxy Official Documentation and Architecture Guide](https://www.envoyproxy.io/docs/envoy/latest/)
    - [Envoy Proxy Circuit Breaking Architecture and Configuration](https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/circuit_breaking)
    - [Envoy Admin Interface and Prometheus Statistics Guide](https://www.envoyproxy.io/docs/envoy/latest/operations/admin)
