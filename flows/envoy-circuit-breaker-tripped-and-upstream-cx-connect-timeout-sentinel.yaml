id: envoy-circuit-breaker-tripped-and-upstream-cx-connect-timeout-sentinel
namespace: company.team

description: |
  Audits Envoy proxy cluster metrics to detect tripped circuit breakers, connection pool exhaustion, and upstream connection timeouts across service mesh endpoints.

concurrency:
  limit: 1

inputs:
  - id: envoy_metrics_url
    type: STRING
    displayName: "Envoy Metrics Endpoint URL"
    defaults: "http://envoy-proxy.ingress.svc.cluster.local:9901"
    description: "HTTP URL exposing administrative Prometheus metrics for the Envoy edge proxy or sidecar."

  - id: cluster_name
    type: STRING
    displayName: "Upstream Cluster Name"
    defaults: "upstream-payment-service-cluster"
    description: "Target Envoy upstream cluster name under circuit breaker audit."

  - id: max_circuit_breakers_open_threshold
    type: INT
    displayName: "Max Circuit Breakers Open Threshold"
    defaults: 1
    description: "Maximum allowable open circuit breaker flags before dispatching incident alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Evaluation Lookback Window (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which upstream circuit breaker and connection timeout telemetry is evaluated."

  - id: alert_on_circuit_break
    type: BOOL
    displayName: "Alert On Circuit Breaker Events"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting tripped circuit breakers."

tasks:
  - id: scan_envoy_circuit_breaker_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Envoy Prometheus metrics to detect open circuit breakers, connection timeouts, and HTTP 503 overflows.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ENVOY_URL: "{{ inputs.envoy_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_CB_OPEN: "{{ inputs.max_circuit_breakers_open_threshold }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      import json
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("ENVOY_URL", "").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "upstream-payment-service-cluster")
      max_cb_open = int(os.environ.get("MAX_CB_OPEN", "1"))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", "15"))

      metrics_endpoint = f"{base_url}/stats/prometheus"
      cb_open_count = 0
      cx_connect_timeouts = 0
      rq_pending_overflow = 0
      http_503_count = 0

      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          resp.raise_for_status()
          for line in resp.text.splitlines():
              line = line.strip()
              if line.startswith("#") or not line:
                  continue
              if "envoy_cluster_circuit_breakers_default_cx_open" in line or "circuit_breakers_cx_open" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match and int(float(match.group(1))) > 0:
                      cb_open_count += int(float(match.group(1)))
              elif "envoy_cluster_upstream_cx_connect_timeout" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      cx_connect_timeouts += int(float(match.group(1)))
              elif "envoy_cluster_circuit_breakers_default_rq_pending_open" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match and int(float(match.group(1))) > 0:
                      rq_pending_overflow += int(float(match.group(1)))
              elif "envoy_cluster_upstream_rq_503" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      http_503_count += int(float(match.group(1)))
      except Exception as err:
          print(f"CRITICAL: Failed to reach Envoy metrics endpoint at {metrics_endpoint}: {err}", file=sys.stderr)
          sys.exit(1)

      is_breached = bool(cb_open_count >= max_cb_open or cx_connect_timeouts > 10)
      now_iso = datetime.now(timezone.utc).isoformat()

      report = {
          "cluster_name": cluster_name,
          "circuit_breakers_open": cb_open_count,
          "connect_timeouts": cx_connect_timeouts,
          "pending_overflow": rq_pending_overflow,
          "http_503_count": http_503_count,
          "is_breached": is_breached
      }

      with open("envoy_cb_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Envoy Complete: Cluster={cluster_name}, CBOpen={cb_open_count}, Timeouts={cx_connect_timeouts}, 503s={http_503_count}, Alert={is_breached}")

      Kestra.outputs({
          "circuit_breakers_open_count": cb_open_count,
          "upstream_cx_connect_timeouts_count": cx_connect_timeouts,
          "rq_pending_overflow_count": rq_pending_overflow,
          "http_503_count": http_503_count,
          "is_alerting": is_breached,
          "envoy_cluster_target": cluster_name,
          "audit_timestamp": now_iso
      })
    outputFiles:
      - envoy_cb_report.json

  - id: evaluate_circuit_breaker_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Envoy circuit breaker trips or connection timeouts exceed allowable limits.
    condition: "{{ outputs.scan_envoy_circuit_breaker_metrics.vars.is_alerting and inputs.alert_on_circuit_break }}"
    then:
      - id: notify_slack_mesh_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident card to Service Mesh SRE Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#service-mesh-alerts",
            "username": "Envoy-CircuitBreaker-Sentinel",
            "text": "CRITICAL: Envoy Upstream Circuit Breakers Tripped on `{{ inputs.cluster_name }}`! Open CBs: `{{ outputs.scan_envoy_circuit_breaker_metrics.vars.circuit_breakers_open_count }}`, Connect timeouts: `{{ outputs.scan_envoy_circuit_breaker_metrics.vars.upstream_cx_connect_timeouts_count }}`, 503 errors: `{{ outputs.scan_envoy_circuit_breaker_metrics.vars.http_503_count }}`."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#service-mesh-alerts",
        "username": "Envoy-CircuitBreaker-Sentinel",
        "text": "CRITICAL: Envoy Circuit Breaker Sentinel failed on `{{ inputs.cluster_name }}`. Execution ID: `{{ execution.id }}`."
      }

triggers:
  - id: periodic_circuit_breaker_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing Envoy circuit breaker states every 10 minutes.
    cron: "*/10 * * * *"

extend:
  title: Envoy Circuit Breaker and Connection Timeout Sentinel
  metaTitle: Envoy Circuit Breaker and Connection Timeout Sentinel Blueprint
  shortDescription: Audits Envoy proxy metrics to detect open circuit breakers and upstream connection timeouts.
  metaDescription: Audits Envoy proxy cluster metrics to detect open circuit breakers, connection pool exhaustion, and upstream timeouts.
  description: |
    Envoy circuit breakers act as the first line of defense against cascading service failures. When downstream services become unresponsive, connection pools saturate and requests queue up until circuit breakers open, shedding load with HTTP 503 responses. This sentinel interrogates Envoy Prometheus metrics, alerts SRE teams to open circuit breakers and connection timeouts, and helps isolate network degradation.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_circuit_breaker_audit Schedule Trigger] --> B[scan_envoy_circuit_breaker_metrics Python Script]
      B --> C{Circuit Breaker Open?}
      C -- Yes --> D[notify_slack_mesh_sre Webhook]
      C -- No --> E[Pools Nominal]
    ```

    ## Prerequisites
    - Envoy administrative endpoint reachable over HTTP.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `envoy_metrics_url` and `cluster_name`.
    3. Run manually to check circuit breaker status.

    ## Links
    - [Envoy Circuit Breaking Documentation](https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/circuit_breaking)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
    - Network
  ee: false
  demo: false
