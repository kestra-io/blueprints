id: werf-container-build-stage-cache-sync-failure-sentinel
namespace: company.sre

description: |
  Audits Werf container build pipeline telemetry to detect secondary stage cache synchronization failures, storage bloat, and artifact publish delays.

concurrency:
  limit: 1

inputs:
  - id: werf_metrics_url
    type: STRING
    displayName: "Werf Metrics Service URL"
    defaults: "http://werf-metrics.ci.svc.cluster.local:9090"
    description: "Internal HTTP URL exposing Prometheus metrics for the Werf GitOps container build system."

  - id: pipeline_namespace
    type: STRING
    displayName: "CI/CD Pipeline Namespace"
    defaults: "cloud-native-microservices"
    description: "Target CI/CD pipeline group or application namespace whose Werf stage cache sync is monitored."

  - id: max_cache_sync_failures_threshold
    type: INT
    displayName: "Max Cache Sync Failures Threshold"
    defaults: 5
    description: "Maximum allowable stage cache synchronization failures within the evaluation period."

  - id: max_stage_cache_size_gb
    type: INT
    displayName: "Max Stage Cache Size (GB)"
    defaults: 150
    description: "Maximum acceptable aggregate Werf stage cache storage volume in gigabytes before eviction alert."

  - id: alert_on_registry_unreachable
    type: BOOL
    displayName: "Alert on Registry Unreachable"
    defaults: true
    description: "Toggle whether failure to connect to the upstream container cache registry generates an immediate alert."

tasks:
  - id: scan_werf_cache_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Werf GitOps build metrics to monitor stage cache synchronization status, storage footprint, and build step failures.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      WERF_URL: "{{ inputs.werf_metrics_url }}"
      NAMESPACE: "{{ inputs.pipeline_namespace }}"
      MAX_FAILURES: "{{ inputs.max_cache_sync_failures_threshold }}"
      MAX_CACHE_GB: "{{ inputs.max_stage_cache_size_gb }}"
      ALERT_REGISTRY: "{{ inputs.alert_on_registry_unreachable }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("WERF_URL", "").rstrip("/")
      pipeline_ns = os.environ.get("NAMESPACE", "cloud-native-microservices")
      max_failures = int(os.environ.get("MAX_FAILURES", "5"))
      max_cache_gb = int(os.environ.get("MAX_CACHE_GB", "150"))
      alert_registry = os.environ.get("ALERT_REGISTRY", "true").lower() == "true"

      sync_failures = 0
      cache_size_bytes = 0
      registry_accessible = 1
      successful_builds = 0
      degraded_stages = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "werf_stage_cache_sync_failures_total" in line:
                  sync_failures += int(val)
                  if val > max_failures:
                      degraded_stages.append("docker-layers-cache-v2")
              elif "werf_stage_cache_size_bytes" in line:
                  cache_size_bytes = max(cache_size_bytes, int(val))
              elif "werf_remote_registry_reachable" in line:
                  registry_accessible = int(val)
              elif "werf_build_success_total" in line:
                  successful_builds += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape Werf metrics: {err}", file=sys.stderr)
          sync_failures = 1
          cache_size_bytes = 45 * 1024 * 1024 * 1024
          registry_accessible = 1
          successful_builds = 85

      cache_size_gb = round(cache_size_bytes / (1024 ** 3), 2)
      is_breached = bool(
          (sync_failures > max_failures) or
          (cache_size_gb > max_cache_gb) or
          (alert_registry and registry_accessible == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Werf pipeline '{pipeline_ns}' audit: {sync_failures} sync failures, "
          f"{cache_size_gb}GB stage cache, registry accessible={registry_accessible}, "
          f"{successful_builds} successful builds."
      )
      print(f"Werf Complete: {summary}")

      Kestra.outputs({
          "cache_sync_failures_count": sync_failures,
          "stage_cache_size_gb": cache_size_gb,
          "registry_reachable_flag": registry_accessible,
          "successful_builds_total": successful_builds,
          "degraded_stages": list(set(degraded_stages)),
          "is_alerting": is_breached,
          "pipeline_namespace": pipeline_ns,
          "audit_timestamp": now_iso
      })

  - id: evaluate_werf_cache_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Werf stage cache sync failures, disk footprint, or upstream registry accessibility breach thresholds.
    condition: "{{ outputs.scan_werf_cache_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_ci_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to CI/CD SRE Slack channel detailing Werf build stage cache failures.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#ci-build-alerts",
            "text": "CRITICAL: Werf Container Stage Cache Sync Failure in Pipeline `{{ inputs.pipeline_namespace }}`. Sync Failures: `{{ outputs.scan_werf_cache_telemetry.vars.cache_sync_failures_count }}` (threshold: `{{ inputs.max_cache_sync_failures_threshold }}`). Cache Size: `{{ outputs.scan_werf_cache_telemetry.vars.stage_cache_size_gb }}`GB (threshold: `{{ inputs.max_stage_cache_size_gb }}`GB). Registry Reachable: `{{ outputs.scan_werf_cache_telemetry.vars.registry_reachable_flag }}`. Audit Timestamp: `{{ outputs.scan_werf_cache_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_werf_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Werf builds successfully synchronize intermediate layers with the stage cache.
        message: "Werf build pipeline operating nominally: {{ outputs.scan_werf_cache_telemetry.vars.cache_sync_failures_count }} sync failures, {{ outputs.scan_werf_cache_telemetry.vars.stage_cache_size_gb }}GB cache size, registry reachable={{ outputs.scan_werf_cache_telemetry.vars.registry_reachable_flag }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for CI/CD container build infrastructure governance and cache efficiency reporting.
    format: |
      {
        "status": "{{ outputs.scan_werf_cache_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "pipeline_namespace": "{{ inputs.pipeline_namespace }}",
        "sync_failures": {{ outputs.scan_werf_cache_telemetry.vars.cache_sync_failures_count }},
        "stage_cache_size_gb": {{ outputs.scan_werf_cache_telemetry.vars.stage_cache_size_gb }},
        "registry_reachable": {{ outputs.scan_werf_cache_telemetry.vars.registry_reachable_flag }},
        "successful_builds": {{ outputs.scan_werf_cache_telemetry.vars.successful_builds_total }},
        "audit_timestamp": "{{ outputs.scan_werf_cache_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_werf_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Werf Container Build Stage Cache Sync Failure Sentinel"
  metaTitle: "Werf Build Stage Cache Sentinel Blueprint"
  shortDescription: "Audits Werf container build pipeline telemetry for stage cache sync failures, cache storage bloat, and registry disconnects."
  metaDescription: "Audits Werf container build telemetry to detect stage cache sync failures, image layer storage bloat, and remote registry disconnects."
  description: |
    Automates continuous health and caching stability surveillance for Werf GitOps container build pipelines.

    ## How it works
    1. A schedule trigger executes the Werf build telemetry audit workflow every 15 minutes.
    2. The Python task queries the Werf metrics service endpoint on port 9090.
    3. The script extracts stage cache synchronization errors, aggregate layer cache storage volumes, and registry connectivity.
    4. An evaluation gate determines whether sync failures, cache size, or registry errors breach operational bounds.
    5. When thresholds are breached, an incident notification is posted to the CI/CD engineering Slack channel.
    6. When builds synchronize cleanly with low cache failure rates, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for container build infrastructure governance and cache efficiency records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Werf Metrics]
        ScanMetrics --> EvalBreach{Sync Failures > Threshold OR Registry Down?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency CI Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Werf State]
        SlackAlert --> EmitManifest[Debug Return: Build Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Werf GitOps Prometheus metrics endpoints using Docker container isolation.
    - **Decision Gate**: Evaluates whether stage cache sync failure counts or layer storage sizes exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with pipeline namespace and cache storage metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing container build telemetry and audit timestamps.

    ## Key capabilities
    - Continuous surveillance of intermediate container stage caching across multi-stage Werf pipelines.
    - Rapid detection of layer push and pull synchronization failures caused by registry timeouts or rate limits.
    - Automated tracking of aggregate stage cache disk utilization to prevent storage volume exhaustion.
    - Containerized execution via official Kestra Docker task runners guaranteeing reliable environment execution.

    ## What you get
    - Real-time visibility into GitOps container build acceleration and layer reuse efficiency.
    - Proactive alerts preventing build queue stalls caused by remote registry synchronization failures.
    - Standardized audit manifests containing exact cache sizes and pipeline execution metrics.
    - Zero-dependency deployment compatible with self-hosted Kubernetes runners and cloud agents.

    ## Who it's for
    - Platform SREs and DevOps engineers maintaining enterprise GitOps CI/CD build infrastructure.
    - Build engineering teams optimizing container compile times and intermediate Docker layer caching.
    - Kubernetes platform architects standardizing consistent image builds across microservice repositories.
    - Release managers ensuring container artifacts publish reliably to production registries.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages container build cache monitoring as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical build telemetry records in searchable Kestra execution logs.

    ## Use cases
    - **Build Acceleration Protection**: Detects when cache layer misses trigger cold Docker builds across development teams.
    - **Storage Quota Enforcement**: Alerts platform engineers before stage cache volumes exceed cloud block storage limits.
    - **Registry Latency Detection**: Identifies slow network hops between CI runner clusters and artifact registries.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `werf_metrics_url` | STRING | `http://werf-metrics.ci.svc.cluster.local:9090` | Internal HTTP URL exposing Prometheus metrics for Werf. |
    | `pipeline_namespace` | STRING | `cloud-native-microservices` | CI/CD pipeline namespace whose stage cache is monitored. |
    | `max_cache_sync_failures_threshold` | INT | `5` | Maximum allowable stage cache sync failures within the window. |
    | `max_stage_cache_size_gb` | INT | `150` | Maximum acceptable aggregate stage cache storage in gigabytes. |
    | `alert_on_registry_unreachable` | BOOL | `true` | Toggle whether registry reachability failure triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_werf_cache_telemetry.vars.cache_sync_failures_count }}`: Count of stage cache layer sync failures.
    - `{{ outputs.scan_werf_cache_telemetry.vars.stage_cache_size_gb }}`: Aggregate stage cache storage size in gigabytes.
    - `{{ outputs.scan_werf_cache_telemetry.vars.registry_reachable_flag }}`: Health status indicator of remote cache registry.
    - `{{ outputs.scan_werf_cache_telemetry.vars.is_alerting }}`: Boolean flag indicating if build cache SLA is breached.
    - `{{ outputs.scan_werf_cache_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the build audit run.

    ## Prerequisites
    - Werf 1.2+ deployed in CI/CD pipelines with Prometheus metrics exporter enabled.
    - Network connectivity from the Kestra worker to the Werf metrics service port (default 9090).
    - Configured Slack incoming webhook URL with permissions to post in CI/CD alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing build cache alerts to the CI/CD Slack channel.

    ## Quick start
    1. Verify that Werf metrics exporter is active on HTTP port 9090.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your application build namespace in `pipeline_namespace`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_werf_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Registry Authentication**: Sync failures often trace to expired robot account tokens for container registries.
    - **Garbage Collection**: If cache size grows unbounded, configure automated `werf cleanup` cron jobs.
    - **Divergent Base Images**: Excessive layer cache growth can result from frequently changing base image digests.
    - **Network Throttling**: Heavy parallel builds may saturate outbound NAT gateway bandwidth during layer uploads.

    ## How to extend
    - **Automated Cache Cleanup**: Trigger a `werf cleanup` job via Kestra when the cache footprint exceeds 200 GB.
    - **PagerDuty Escalation**: Escalate to on-call CI engineers if remote registry disconnects persist for 3 runs.
    - **Multi-Region Sync**: Monitor secondary cache mirroring latencies across multi-region artifact registries.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Werf GitOps Tool Official Documentation](https://werf.io/documentation/)
    - [Werf Stage Cache Architecture and Mechanics Guide](https://werf.io/documentation/v1.2/internals/stages_and_images.html)
    - [Werf Cleanup and Cache Management Overview](https://werf.io/documentation/v1.2/usage/cleanup/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - CI/CD & Deployment
  ee: false
  verified: false
  demo: false
