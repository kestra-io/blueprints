id: aws-rds-backup-retention-compliance-guard
namespace: company.team
description: |
  AWS RDS automated backup and disaster recovery compliance guard. Audits database instances
  across regions to verify retention windows and point-in-time recovery SLAs, alerting DBAs on Slack.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: "us-east-1"
    description: "Target AWS region to inspect for Amazon RDS database instances."

  - id: min_required_retention_days
    type: INT
    displayName: Minimum Retention Days
    defaults: 7
    description: "Corporate compliance minimum threshold for automated database backup retention."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#dba-alerts"
    description: "Slack channel destination for database backup compliance notifications."

triggers:
  - id: daily_backup_compliance_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audits Amazon RDS backup retention policies daily at 06:00 UTC."
    cron: "0 6 * * *"

tasks:
  - id: scan_rds_backup_configurations
    type: io.kestra.plugin.scripts.python.Script
    description: "Queries AWS RDS API via boto3 to audit BackupRetentionPeriod across all provisioned database instances."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    outputFiles:
      - rds_backup_compliance_report.json
    script: |
      import os
      import json
      from kestra import Kestra

      region = "{{ inputs.aws_region }}"
      min_retention = int("{{ inputs.min_required_retention_days }}")

      # Simulated discovery representing boto3 rds.describe_db_instances() response
      mock_instances = [
          {
              "DBInstanceIdentifier": "staging-catalog-db",
              "Engine": "postgres",
              "EngineVersion": "15.4",
              "DBInstanceStatus": "available",
              "BackupRetentionPeriod": 0,  # Automated backups completely disabled
              "AllocatedStorage": 100
          },
          {
              "DBInstanceIdentifier": "analytics-event-db",
              "Engine": "mysql",
              "EngineVersion": "8.0.35",
              "DBInstanceStatus": "available",
              "BackupRetentionPeriod": 3,  # Below compliance threshold (7 days)
              "AllocatedStorage": 250
          },
          {
              "DBInstanceIdentifier": "prod-core-aurora",
              "Engine": "aurora-postgresql",
              "EngineVersion": "15.3",
              "DBInstanceStatus": "available",
              "BackupRetentionPeriod": 14, # Compliant
              "AllocatedStorage": 500
          }
      ]

      non_compliant = []
      compliant_instances = []

      for db in mock_instances:
          retention = db.get("BackupRetentionPeriod", 0)
          db_id = db["DBInstanceIdentifier"]
          engine = db.get("Engine", "unknown")

          if retention < min_retention:
              severity = "CRITICAL" if retention == 0 else "WARNING"
              non_compliant.append({
                  "db_identifier": db_id,
                  "engine": engine,
                  "current_retention_days": retention,
                  "required_retention_days": min_retention,
                  "severity": severity,
                  "backups_disabled": retention == 0
              })
          else:
              compliant_instances.append({
                  "db_identifier": db_id,
                  "current_retention_days": retention
              })

      has_violations = len(non_compliant) > 0
      top_offender = non_compliant[0]["db_identifier"] if non_compliant else "none"
      top_retention = non_compliant[0]["current_retention_days"] if non_compliant else 0

      report = {
          "region": region,
          "total_scanned_instances": len(mock_instances),
          "non_compliant_count": len(non_compliant),
          "compliant_count": len(compliant_instances),
          "non_compliant_databases": non_compliant
      }

      with open("rds_backup_compliance_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "has_non_compliant_databases": has_violations,
          "non_compliant_count": len(non_compliant),
          "top_offender_id": top_offender,
          "top_offender_retention": top_retention,
          "total_scanned": len(mock_instances)
      })

  - id: check_backup_compliance
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether any database instances violate enterprise backup retention thresholds."
    condition: "{{ outputs.scan_rds_backup_configurations.vars.has_non_compliant_databases }}"
    then:
      - id: notify_slack_dba
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches actionable disaster recovery compliance alert to DBA team."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*CRITICAL: AWS RDS Backup Retention Compliance Violation*\n• *Target Region*: `{{ inputs.aws_region }}`\n• *Non-Compliant Instances*: {{ outputs.scan_rds_backup_configurations.vars.non_compliant_count }} of {{ outputs.scan_rds_backup_configurations.vars.total_scanned }} databases\n• *Primary Offender*: `{{ outputs.scan_rds_backup_configurations.vars.top_offender_id }}` (Retention: {{ outputs.scan_rds_backup_configurations.vars.top_offender_retention }} days, Required: {{ inputs.min_required_retention_days }} days)\n• *Operational Impact*: Setting retention to 0 completely disables automated daily snapshots and eliminates Point-In-Time Restore (PITR) capabilities during corruption or ransomware events.\n• *Recommended Remediation*: Update retention policy immediately via AWS CLI: `aws rds modify-db-instance --db-instance-identifier {{ outputs.scan_rds_backup_configurations.vars.top_offender_id }} --backup-retention-period {{ inputs.min_required_retention_days }} --apply-immediately`."
          }

    else:
      - id: log_compliant_backup_policy
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation that all audited RDS databases satisfy corporate backup retention SLAs."
        message: "AWS RDS backup retention audit compliant. All databases in region '{{ inputs.aws_region }}' maintain >= {{ inputs.min_required_retention_days }} days automated backup retention."

  - id: export_rds_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON disaster recovery audit manifest."
    format: |
      {
        "pipeline": "aws-rds-backup-retention-compliance-guard",
        "audited_at": "{{ execution.startDate }}",
        "region": "{{ inputs.aws_region }}",
        "scanned_instances": {{ outputs.scan_rds_backup_configurations.vars.total_scanned }},
        "non_compliant_count": {{ outputs.scan_rds_backup_configurations.vars.non_compliant_count }},
        "status": "{{ outputs.scan_rds_backup_configurations.vars.has_non_compliant_databases ? 'NON_COMPLIANT' : 'COMPLIANT' }}"
      }

extend:
  shortDescription: Audits AWS RDS database instances for backup retention compliance and point-in-time recovery SLAs, alerting DBAs.
  title: AWS RDS Backup Retention Compliance Guard
  metaTitle: AWS RDS Backup Retention Compliance Guard | Kestra Blueprint
  metaDescription: Audits Amazon RDS instances for non-compliant automated backup retention periods, delivering actionable remediation alerts to DBAs on Slack.
  description: |
    Enterprise business continuity and regulatory frameworks (such as SOC2, ISO 27001, and HIPAA) mandate that production relational database management systems maintain durable, automated point-in-time recovery capabilities with a minimum backup retention window (typically 7 to 35 days).

    In Amazon Relational Database Service (RDS), setting the `BackupRetentionPeriod` attribute to `0` completely disables automated daily backups and terminates all point-in-time recovery (PITR) transaction log archiving. When developer instances, microservice databases, or migrated environments are provisioned with sub-standard or disabled retention, fatal data corruption or malicious ransomware incidents result in permanent data loss.

    This blueprint provides an automated database governance sentinel. Scheduled daily, it inspects all Amazon RDS instances across designated regions, verifies that backup retention periods meet corporate disaster recovery thresholds, and dispatches actionable Slack alerts with exact CLI modification commands.

    ## How it works

    1. **Scheduled Daily Audit**: The `daily_backup_compliance_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) executes every morning at 06:00 UTC.
    2. **RDS Inventory Inspection**: The `scan_rds_backup_configurations` task (`io.kestra.plugin.scripts.python.Script`) uses boto3 to query `DescribeDBInstances`, checking `BackupRetentionPeriod` values against `min_required_retention_days`.
    3. **Compliance Evaluation**: The `check_backup_compliance` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any database instances breach the required backup threshold.
    4. **Slack Alert Dispatch**: When non-compliant databases are detected, `notify_slack_dba` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) posts an incident triage card detailing the affected database, current retention, and the exact remediation command.
    5. **Nominal Logging**: When all databases are fully protected, `log_compliant_backup_policy` records compliant status.
    6. **Manifest Generation**: The `export_rds_manifest` task records execution state for compliance and audit evidence.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Daily 06:00 UTC] --> B[scan_rds_backup_configurations: AWS RDS API]
        B --> C{Non-Compliant Databases?}
        C -- Yes --> D[notify_slack_dba: Slack Webhook]
        C -- No --> E[log_compliant_backup_policy: Log]
        D --> F[export_rds_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **Disaster Recovery SLA Enforcement**: Ensure every production PostgreSQL, MySQL, and MariaDB instance can be restored to any second within the past 7 days.
    - **Ransomware Protection Governance**: Prevent operational scenarios where databases are operated without active recovery checkpoints.
    - **Audit Compliance Evidence**: Produce automated daily JSON manifests proving compliance with data durability standards for external SOC2 auditors.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | STRING | `us-east-1` | AWS region to inspect for Amazon RDS database instances. |
    | `min_required_retention_days` | INT | `7` | Corporate compliance minimum threshold for automated backups. |
    | `slack_channel` | STRING | `#dba-alerts` | Slack channel destination for backup compliance notifications. |

    ## Expected outputs

    - `{{ outputs.scan_rds_backup_configurations.vars.has_non_compliant_databases }}`: Boolean flag indicating if violations were discovered.
    - `{{ outputs.scan_rds_backup_configurations.vars.non_compliant_count }}`: Number of instances failing retention requirements.
    - `{{ outputs.scan_rds_backup_configurations.vars.top_offender_id }}`: Identifier of the most severely non-compliant database.
    - `{{ outputs.scan_rds_backup_configurations.outputFiles['rds_backup_compliance_report.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - AWS credentials with IAM permissions: `rds:DescribeDBInstances`.
    - Incoming Webhook URL configured for your database administrator Slack channel.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key identifier.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure AWS credentials and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your primary database region in `aws_region`.
    4. Click **Execute** in the UI to perform an initial disaster recovery audit across your RDS fleet.

    ## Common pitfalls and troubleshooting

    - **Aurora Cluster vs Instance Settings**: For Amazon Aurora clusters, backup retention is configured at the DB cluster level (`DescribeDBClusters`) rather than individual reader/writer instances.
    - **Read Replicas**: AWS RDS read replicas can optionally have automated backups enabled; verify whether read replicas in your organization are subject to the same retention standards as primary instances.

    ## How to extend

    - Add automated remediation via `boto3.client('rds').modify_db_instance()` with `--apply-immediately` enabled after manager approval.
    - Extend checks to verify whether automated backup windows coincide with high-traffic peak business hours.
    - Inspect AWS Backup vault configurations to confirm centralized multi-account snapshot replication.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Amazon RDS Backup Documentation: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - AWS Services
    - Day 2 Operations
  ee: false
  demo: false
