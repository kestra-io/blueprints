id: sqlite-wal-checkpoint-integrity-and-s3-backup-sentinel
namespace: company.database

description: |
  Automated operational sentinel for SQLite databases operating in high-concurrency WAL (Write-Ahead Logging) mode.
  Executes an online WAL checkpoint (TRUNCATE) to drain journal files without blocking concurrent readers, performs deep
  PRAGMA integrity audits, takes an online non-blocking backup, compresses the artifact with zstd, uploads to S3-compatible
  object storage (AWS S3, Cloudflare R2, MinIO), and broadcasts health metrics or corruption alerts via Slack.

triggers:
  - id: scheduled_nightly_backup
    type: io.kestra.plugin.core.trigger.Schedule
    description: Nightly operational maintenance and cold backup window.
    cron: "0 2 * * *"

  - id: webhook_on_demand_snapshot
    type: io.kestra.plugin.core.trigger.Webhook
    description: Trigger an immediate checkpoint and snapshot prior to schema migrations or platform updates.
    key: "{{ secret('SQLITE_BACKUP_WEBHOOK_KEY') }}"

inputs:
  - id: database_name
    type: STRING
    defaults: primary-app-db
    description: Logical identifier of the database instance.

  - id: database_file_path
    type: STRING
    defaults: /data/sqlite/production.db
    description: Absolute filesystem path to the target SQLite database file.

  - id: s3_bucket
    type: STRING
    defaults: production-sqlite-backups
    description: S3 bucket name for immutable backup archives.

  - id: s3_prefix
    type: STRING
    defaults: wal-checkpoints
    description: Key prefix path inside the target bucket.

  - id: s3_region
    type: STRING
    defaults: us-east-1
    description: Target AWS region or S3-compatible storage endpoint region.

  - id: checkpoint_mode
    type: SELECT
    values: [PASSIVE, FULL, RESTART, TRUNCATE]
    defaults: TRUNCATE
    description: SQLite WAL checkpoint mode. TRUNCATE commits all frames and truncates the WAL file to zero bytes.

  - id: integrity_check_type
    type: SELECT
    values: [integrity_check, quick_check]
    defaults: integrity_check
    description: Diagnostic check level. quick_check omits index order checks for high speed; integrity_check validates all b-trees and leaf pages.

tasks:
  - id: log_session_start
    type: io.kestra.plugin.core.log.Log
    message: |
      Starting SQLite WAL Checkpoint & S3 Backup Sentinel:
      Execution ID: {{ execution.id }}
      Database: {{ inputs.database_name }}
      Target Path: {{ inputs.database_file_path }}
      Checkpoint Mode: {{ inputs.checkpoint_mode }}
      Audit Level: {{ inputs.integrity_check_type }}
      Destination: s3://{{ inputs.s3_bucket }}/{{ inputs.s3_prefix }}/

  - id: wal_checkpoint_and_integrity_audit
    type: io.kestra.plugin.scripts.shell.Commands
    description: Executes WAL checkpointing, measures journal drain efficiency, and verifies b-tree page integrity.
    containerImage: alpine:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - apk add --no-cache sqlite bash
      - |
        DB_PATH="{{ inputs.database_file_path }}"
        WAL_PATH="${DB_PATH}-wal"
        
        # If running in isolated sandbox/demo mode, seed a resilient test database
        if [ ! -f "$DB_PATH" ]; then
          echo "Database file not found at $DB_PATH. Provisioning demo testbed."
          mkdir -p "$(dirname "$DB_PATH")"
          sqlite3 "$DB_PATH" "PRAGMA journal_mode=WAL; CREATE TABLE IF NOT EXISTS system_telemetry (id INTEGER PRIMARY KEY, metric_key TEXT, metric_value REAL, created_at DATETIME DEFAULT CURRENT_TIMESTAMP); INSERT INTO system_telemetry (metric_key, metric_value) VALUES ('sample_rate', 44100.0), ('buffer_size', 1024.0);"
        fi

        WAL_SIZE_BEFORE=0
        if [ -f "$WAL_PATH" ]; then
          WAL_SIZE_BEFORE=$(stat -c%s "$WAL_PATH" 2>/dev/null || stat -f%z "$WAL_PATH" 2>/dev/null || echo 0)
        fi

        echo "Executing PRAGMA wal_checkpoint({{ inputs.checkpoint_mode }})..."
        CHECKPOINT_RAW=$(sqlite3 "$DB_PATH" "PRAGMA wal_checkpoint({{ inputs.checkpoint_mode }});")
        # Returns: 0|checkpointed_pages|total_pages
        CHECKPOINT_STATUS=$(echo "$CHECKPOINT_RAW" | cut -d'|' -f1)
        CHECKPOINTED_PAGES=$(echo "$CHECKPOINT_RAW" | cut -d'|' -f2)

        WAL_SIZE_AFTER=0
        if [ -f "$WAL_PATH" ]; then
          WAL_SIZE_AFTER=$(stat -c%s "$WAL_PATH" 2>/dev/null || stat -f%z "$WAL_PATH" 2>/dev/null || echo 0)
        fi

        echo "Executing PRAGMA {{ inputs.integrity_check_type }}..."
        AUDIT_OUTPUT=$(sqlite3 "$DB_PATH" "PRAGMA {{ inputs.integrity_check_type }};")

        IS_INTACT="false"
        if [ "$AUDIT_OUTPUT" = "ok" ]; then
          IS_INTACT="true"
        fi

        echo "Integrity Status: $AUDIT_OUTPUT"
        echo "WAL Size Before: ${WAL_SIZE_BEFORE} bytes | After: ${WAL_SIZE_AFTER} bytes"

        # Emit outputs to Kestra execution context
        echo "::{\"outputs\": {\"is_intact\": \"$IS_INTACT\", \"audit_result\": \"$AUDIT_OUTPUT\", \"checkpoint_status\": \"$CHECKPOINT_STATUS\", \"checkpointed_pages\": \"$CHECKPOINTED_PAGES\", \"wal_bytes_drained\": $(( WAL_SIZE_BEFORE - WAL_SIZE_AFTER ))}}::"

  - id: gate_integrity_and_dispatch
    type: io.kestra.plugin.core.flow.If
    description: Verifies database pass condition before creating and shipping the cold archive.
    condition: "{{ outputs.wal_checkpoint_and_integrity_audit.vars.is_intact == 'true' }}"
    then:
      - id: create_online_snapshot_and_compress
        type: io.kestra.plugin.scripts.shell.Commands
        description: Takes a non-blocking point-in-time online snapshot using the SQLite backup API and compresses with zstd.
        containerImage: alpine:latest
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        outputFiles:
          - "*.zst"
        commands:
          - apk add --no-cache sqlite zstd bash
          - |
            DB_PATH="{{ inputs.database_file_path }}"
            OUTPUT_NAME="{{ inputs.database_name }}-snapshot.db"
            
            echo "Invoking SQLite online backup API..."
            sqlite3 "$DB_PATH" ".backup '$OUTPUT_NAME'"

            echo "Compressing snapshot with zstd..."
            zstd -19 "$OUTPUT_NAME" -o "${OUTPUT_NAME}.zst"
            
            ORIGINAL_SIZE=$(stat -c%s "$OUTPUT_NAME")
            COMPRESSED_SIZE=$(stat -c%s "${OUTPUT_NAME}.zst")
            RATIO=$(awk "BEGIN {printf \"%.2f\", $ORIGINAL_SIZE / $COMPRESSED_SIZE}")

            echo "Snapshot size: $ORIGINAL_SIZE bytes -> Compressed: $COMPRESSED_SIZE bytes ($RATIO x compression)"
            echo "::{\"outputs\": {\"compressed_bytes\": $COMPRESSED_SIZE, \"compression_ratio\": \"$RATIO\"}}::"

      - id: upload_snapshot_to_s3
        type: io.kestra.plugin.aws.s3.Upload
        description: Stores the verified compressed snapshot in immutable cloud object storage.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_KEY_ID') }}"
        region: "{{ inputs.s3_region }}"
        bucket: "{{ inputs.s3_bucket }}"
        from: "{{ outputs.create_online_snapshot_and_compress.outputFiles[inputs.database_name ~ '-snapshot.db.zst'] }}"
        key: "{{ inputs.s3_prefix }}/{{ inputs.database_name }}/{{ inputs.database_name }}-{{ execution.startDate | date('yyyy-MM-dd_HH-mm-ss') }}.db.zst"
        storageClass: STANDARD

      - id: notify_backup_success_slack
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Publishes success scorecard to operational Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "✅ *SQLite WAL Checkpoint & Backup Succeeded*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Database:* `{{ inputs.database_name }}`\n*Status:* Healthy (`PRAGMA {{ inputs.integrity_check_type }}` = ok)\n*Checkpointed Pages:* `{{ outputs.wal_checkpoint_and_integrity_audit.vars.checkpointed_pages }}`\n*Compressed Size:* `{{ outputs.create_online_snapshot_and_compress.vars.compressed_bytes }} bytes` (Ratio: `{{ outputs.create_online_snapshot_and_compress.vars.compression_ratio }}:1`)\n*S3 Key:* `s3://{{ inputs.s3_bucket }}/{{ inputs.s3_prefix }}/{{ inputs.database_name }}/{{ inputs.database_name }}-{{ execution.startDate | date('yyyy-MM-dd_HH-mm-ss') }}.db.zst`"
                }
              }
            ]
          }

    else:
      - id: log_corruption_quarantine
        type: io.kestra.plugin.core.log.Log
        message: "CRITICAL: Database integrity check failed with output: {{ outputs.wal_checkpoint_and_integrity_audit.vars.audit_result }}. Halting backup pipeline to prevent propagating corrupted pages to object storage."

      - id: notify_corruption_alert_slack
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Alerts engineering team immediately on database corruption detection.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *CRITICAL ALERT: SQLite Database Integrity Failure*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "🚨 *SQLite Corruption Detected!*\n*Database:* `{{ inputs.database_name }}`\n*Target Path:* `{{ inputs.database_file_path }}`\n*Diagnostic Output:* `{{ outputs.wal_checkpoint_and_integrity_audit.vars.audit_result }}`\n*Action Taken:* Backup halted immediately. WAL checkpoint aborted to safeguard recovery journals."
                }
              }
            ]
          }

errors:
  - id: notify_pipeline_failure_slack
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Triggered if any step suffers unhandled network or host environment failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *SQLite Maintenance Pipeline Execution Failure*",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "⚠️ *Execution Failed:*\n*Execution ID:* `{{ execution.id }}`\n*Flow ID:* `{{ flow.id }}`\n*Namespace:* `{{ flow.namespace }}`\n*State:* `{{ execution.state.current }}`"
            }
          }
        ]
      }
