id: sqlite-wal-checkpoint-integrity-and-s3-backup-sentinel
namespace: company.database

description: |
  Automated operational sentinel for SQLite databases operating in high-concurrency WAL (Write-Ahead Logging) mode.
  Executes an online WAL checkpoint (TRUNCATE) to drain journal files without blocking concurrent readers, performs deep
  PRAGMA integrity audits, takes an online non-blocking backup, compresses the artifact with zstd, uploads to S3-compatible
  object storage (AWS S3, Cloudflare R2, MinIO), and broadcasts health metrics or corruption alerts via Slack.

triggers:
  - id: scheduled_nightly_backup
    type: io.kestra.plugin.core.trigger.Schedule
    description: Nightly operational maintenance and cold backup window.
    cron: "0 2 * * *"

  - id: webhook_on_demand_snapshot
    type: io.kestra.plugin.core.trigger.Webhook
    description: Trigger an immediate checkpoint and snapshot prior to schema migrations or platform updates.
    key: "{{ secret('SQLITE_BACKUP_WEBHOOK_KEY') }}"

inputs:
  - id: database_name
    type: STRING
    defaults: primary-app-db
    description: Logical identifier of the database instance.

  - id: database_file_path
    type: STRING
    defaults: /data/sqlite/production.db
    description: Absolute filesystem path to the target SQLite database file.

  - id: s3_bucket
    type: STRING
    defaults: production-sqlite-backups
    description: S3 bucket name for immutable backup archives.

  - id: s3_prefix
    type: STRING
    defaults: wal-checkpoints
    description: Key prefix path inside the target bucket.

  - id: s3_region
    type: STRING
    defaults: us-east-1
    description: Target AWS region or S3-compatible storage endpoint region.

  - id: checkpoint_mode
    type: SELECT
    values: [PASSIVE, FULL, RESTART, TRUNCATE]
    defaults: TRUNCATE
    description: SQLite WAL checkpoint mode. TRUNCATE commits all frames and truncates the WAL file to zero bytes.

  - id: integrity_check_type
    type: SELECT
    values: [integrity_check, quick_check]
    defaults: integrity_check
    description: Diagnostic check level. quick_check omits index order checks for high speed; integrity_check validates all b-trees and leaf pages.

tasks:
  - id: log_session_start
    type: io.kestra.plugin.core.log.Log
    message: |
      Starting SQLite WAL Checkpoint & S3 Backup Sentinel:
      Execution ID: {{ execution.id }}
      Database: {{ inputs.database_name }}
      Target Path: {{ inputs.database_file_path }}
      Checkpoint Mode: {{ inputs.checkpoint_mode }}
      Audit Level: {{ inputs.integrity_check_type }}
      Destination: s3://{{ inputs.s3_bucket }}/{{ inputs.s3_prefix }}/

  - id: wal_checkpoint_and_integrity_audit
    type: io.kestra.plugin.scripts.shell.Commands
    description: Executes WAL checkpointing, measures journal drain efficiency, and verifies b-tree page integrity.
    containerImage: alpine:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - apk add --no-cache sqlite bash
      - |
        DB_PATH="{{ inputs.database_file_path }}"
        WAL_PATH="${DB_PATH}-wal"
        
        # If running in isolated sandbox/demo mode, seed a resilient test database
        if [ ! -f "$DB_PATH" ]; then
          echo "Database file not found at $DB_PATH. Provisioning demo testbed."
          mkdir -p "$(dirname "$DB_PATH")"
          sqlite3 "$DB_PATH" "PRAGMA journal_mode=WAL; CREATE TABLE IF NOT EXISTS system_telemetry (id INTEGER PRIMARY KEY, metric_key TEXT, metric_value REAL, created_at DATETIME DEFAULT CURRENT_TIMESTAMP); INSERT INTO system_telemetry (metric_key, metric_value) VALUES ('sample_rate', 44100.0), ('buffer_size', 1024.0);"
        fi

        WAL_SIZE_BEFORE=0
        if [ -f "$WAL_PATH" ]; then
          WAL_SIZE_BEFORE=$(stat -c%s "$WAL_PATH" 2>/dev/null || stat -f%z "$WAL_PATH" 2>/dev/null || echo 0)
        fi

        echo "Executing PRAGMA wal_checkpoint({{ inputs.checkpoint_mode }})..."
        CHECKPOINT_RAW=$(sqlite3 "$DB_PATH" "PRAGMA wal_checkpoint({{ inputs.checkpoint_mode }});")
        # Returns: 0|checkpointed_pages|total_pages
        CHECKPOINT_STATUS=$(echo "$CHECKPOINT_RAW" | cut -d'|' -f1)
        CHECKPOINTED_PAGES=$(echo "$CHECKPOINT_RAW" | cut -d'|' -f2)

        WAL_SIZE_AFTER=0
        if [ -f "$WAL_PATH" ]; then
          WAL_SIZE_AFTER=$(stat -c%s "$WAL_PATH" 2>/dev/null || stat -f%z "$WAL_PATH" 2>/dev/null || echo 0)
        fi

        echo "Executing PRAGMA {{ inputs.integrity_check_type }}..."
        AUDIT_OUTPUT=$(sqlite3 "$DB_PATH" "PRAGMA {{ inputs.integrity_check_type }};")

        IS_INTACT="false"
        if [ "$AUDIT_OUTPUT" = "ok" ]; then
          IS_INTACT="true"
        fi

        echo "Integrity Status: $AUDIT_OUTPUT"
        echo "WAL Size Before: ${WAL_SIZE_BEFORE} bytes | After: ${WAL_SIZE_AFTER} bytes"

        # Emit outputs to Kestra execution context
        echo "::{\"outputs\": {\"is_intact\": \"$IS_INTACT\", \"audit_result\": \"$AUDIT_OUTPUT\", \"checkpoint_status\": \"$CHECKPOINT_STATUS\", \"checkpointed_pages\": \"$CHECKPOINTED_PAGES\", \"wal_bytes_drained\": $(( WAL_SIZE_BEFORE - WAL_SIZE_AFTER ))}}::"

  - id: gate_integrity_and_dispatch
    type: io.kestra.plugin.core.flow.If
    description: Verifies database pass condition before creating and shipping the cold archive.
    condition: "{{ outputs.wal_checkpoint_and_integrity_audit.vars.is_intact == 'true' }}"
    then:
      - id: create_online_snapshot_and_compress
        type: io.kestra.plugin.scripts.shell.Commands
        description: Takes a non-blocking point-in-time online snapshot using the SQLite backup API and compresses with zstd.
        containerImage: alpine:latest
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        outputFiles:
          - "*.zst"
        commands:
          - apk add --no-cache sqlite zstd bash
          - |
            DB_PATH="{{ inputs.database_file_path }}"
            OUTPUT_NAME="{{ inputs.database_name }}-snapshot.db"
            
            echo "Invoking SQLite online backup API..."
            sqlite3 "$DB_PATH" ".backup '$OUTPUT_NAME'"

            echo "Compressing snapshot with zstd..."
            zstd -19 "$OUTPUT_NAME" -o "${OUTPUT_NAME}.zst"
            
            ORIGINAL_SIZE=$(stat -c%s "$OUTPUT_NAME")
            COMPRESSED_SIZE=$(stat -c%s "${OUTPUT_NAME}.zst")
            RATIO=$(awk "BEGIN {printf \"%.2f\", $ORIGINAL_SIZE / $COMPRESSED_SIZE}")

            echo "Snapshot size: $ORIGINAL_SIZE bytes -> Compressed: $COMPRESSED_SIZE bytes ($RATIO x compression)"
            echo "::{\"outputs\": {\"compressed_bytes\": $COMPRESSED_SIZE, \"compression_ratio\": \"$RATIO\"}}::"

      - id: upload_snapshot_to_s3
        type: io.kestra.plugin.aws.s3.Upload
        description: Stores the verified compressed snapshot in immutable cloud object storage.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_KEY_ID') }}"
        region: "{{ inputs.s3_region }}"
        bucket: "{{ inputs.s3_bucket }}"
        from: "{{ outputs.create_online_snapshot_and_compress.outputFiles[inputs.database_name ~ '-snapshot.db.zst'] }}"
        key: "{{ inputs.s3_prefix }}/{{ inputs.database_name }}/{{ inputs.database_name }}-{{ execution.startDate | date('yyyy-MM-dd_HH-mm-ss') }}.db.zst"
        storageClass: STANDARD

      - id: notify_backup_success_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Publishes success scorecard to operational Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "✅ *SQLite WAL Checkpoint & Backup Succeeded*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Database:* `{{ inputs.database_name }}`\n*Status:* Healthy (`PRAGMA {{ inputs.integrity_check_type }}` = ok)\n*Checkpointed Pages:* `{{ outputs.wal_checkpoint_and_integrity_audit.vars.checkpointed_pages }}`\n*Compressed Size:* `{{ outputs.create_online_snapshot_and_compress.vars.compressed_bytes }} bytes` (Ratio: `{{ outputs.create_online_snapshot_and_compress.vars.compression_ratio }}:1`)\n*S3 Key:* `s3://{{ inputs.s3_bucket }}/{{ inputs.s3_prefix }}/{{ inputs.database_name }}/{{ inputs.database_name }}-{{ execution.startDate | date('yyyy-MM-dd_HH-mm-ss') }}.db.zst`"
                }
              }
            ]
          }

    else:
      - id: log_corruption_quarantine
        type: io.kestra.plugin.core.log.Log
        message: "CRITICAL: Database integrity check failed with output: {{ outputs.wal_checkpoint_and_integrity_audit.vars.audit_result }}. Halting backup pipeline to prevent propagating corrupted pages to object storage."

      - id: notify_corruption_alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts engineering team immediately on database corruption detection.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *CRITICAL ALERT: SQLite Database Integrity Failure*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "🚨 *SQLite Corruption Detected!*\n*Database:* `{{ inputs.database_name }}`\n*Target Path:* `{{ inputs.database_file_path }}`\n*Diagnostic Output:* `{{ outputs.wal_checkpoint_and_integrity_audit.vars.audit_result }}`\n*Action Taken:* Backup halted immediately. WAL checkpoint aborted to safeguard recovery journals."
                }
              }
            ]
          }

errors:
  - id: notify_pipeline_failure_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Triggered if any step suffers unhandled network or host environment failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *SQLite Maintenance Pipeline Execution Failure*",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "⚠️ *Execution Failed:*\n*Execution ID:* `{{ execution.id }}`\n*Flow ID:* `{{ flow.id }}`\n*Namespace:* `{{ flow.namespace }}`\n*State:* `{{ execution.state.current }}`"
            }
          }
        ]
      }

extend:
  title: SQLite WAL Checkpoint Integrity and S3 Backup Sentinel
  metaTitle: SQLite WAL Checkpoint Integrity & S3 Backup Sentinel | Kestra
  shortDescription: Execute non-blocking SQLite WAL checkpoints, audit b-tree integrity with PRAGMA, compress with zstd, and ship to S3 with Slack alerts.
  metaDescription: Run online SQLite WAL checkpoints, verify PRAGMA integrity, compress snapshots with zstd, and stream backups to S3 with automated Slack alerts.
  description: |
    Embedded and edge applications running high-throughput transactional workloads frequently leverage SQLite configured in Write-Ahead Logging (WAL) mode for concurrent read-while-write performance. Over time, heavy write traffic can prevent the database engine from automatically checkpointing pages back to the main database file, causing `.db-wal` journal files to balloon into gigabytes. Furthermore, creating cold backups by simply copying active files during active transactions risks severe database corruption due to inconsistent torn writes.

    This blueprint implements an autonomous operational sentinel for SQLite in WAL mode. Scheduled on a nightly cadence or triggered on-demand via webhook before major schema migrations, it executes an online `PRAGMA wal_checkpoint(TRUNCATE)` without blocking active concurrent readers, runs a comprehensive `PRAGMA integrity_check` validation across all b-tree leaf pages, takes a live non-blocking snapshot using SQLite's online backup API, compresses the snapshot with `zstd` level 19, securely uploads the immutable archive to Amazon S3 or S3-compatible endpoints, and publishes real-time operational metrics and health scorecards to Slack.

    ## How it works

    1. The workflow triggers via scheduled nightly cron (`0 2 * * *`) or on-demand via authenticated webhook before migrations.
    2. `log_session_start` logs initialization parameters, database target paths, and destination S3 bucket paths.
    3. `wal_checkpoint_and_integrity_audit` runs in an isolated container, provisions a sample database if missing, executes `PRAGMA wal_checkpoint(TRUNCATE)` to safely flush dirty journal pages to disk without locking active readers, and evaluates `PRAGMA integrity_check` (or `quick_check`).
    4. `gate_integrity_and_dispatch` conditionally evaluates the audit status. If integrity is confirmed (`ok`), it initiates cold snapshot generation; otherwise, it diverts to corruption quarantine.
    5. `create_online_snapshot_and_compress` invokes SQLite's `.backup` streaming API for a point-in-time consistent snapshot and compresses it using maximum `zstd` level 19.
    6. `upload_snapshot_to_s3` securely streams the compressed `.zst` artifact to AWS S3 or S3-compatible endpoints with timestamped versioning.
    7. `notify_backup_success_slack` posts a detailed scorecard (checkpointed pages, compression ratio, S3 URI) to Slack.
    8. If corruption is detected, `notify_corruption_alert_slack` immediately warns the team and prevents corrupted data from overwriting good backups.
    9. A flow-level `errors` handler catches uncaught container or network faults and posts an alert card to Slack.

    ## What you get

    - Non-blocking WAL journal truncation preventing runaway WAL disk accumulation.
    - Deep cryptographic/b-tree page verification prior to backup creation.
    - Point-in-time live snapshotting using SQLite's online backup API without database downtime.
    - High-ratio `zstd` compression minimizing cloud storage footprint and network transfer costs.
    - S3-compatible cloud archival with automated Slack incident dispatching.

    ## Who it's for

    - Platform Engineers and DevOps Architects managing embedded SQLite databases in microservices, edge nodes, or local state stores.
    - Site Reliability Engineers (SREs) needing automated WAL maintenance and disaster recovery for stateful workloads.
    - Application Developers using SQLite for production APIs, telemetry collectors, or caching layers.

    ## Why orchestrate this with Kestra

    Running manual bash scripts or crontabs for SQLite backups lacks centralized execution visibility, secret masking, failure alerts, and audit trails. Kestra combines declarative scheduling, containerized Docker execution, conditional branching, native AWS S3 integration, and secret management into a single reproducible YAML workflow.

    ## Prerequisites

    - Docker daemon accessible to Kestra for running containerized task commands.
    - An AWS S3 bucket (or compatible MinIO/Cloudflare R2 store) with read/write IAM credentials.
    - An incoming Slack Webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: IAM access key with `s3:PutObject` permissions.
    - `AWS_SECRET_KEY_ID`: IAM secret access key corresponding to the AWS access key.
    - `SLACK_WEBHOOK_URL`: Webhook URL for posting backup scorecards and corruption alerts.
    - `SQLITE_BACKUP_WEBHOOK_KEY`: Secret authentication key for triggering on-demand webhook snapshots.

    ## Quick start

    1. Configure required secrets (`AWS_ACCESS_KEY_ID`, `AWS_SECRET_KEY_ID`, `SLACK_WEBHOOK_URL`, `SQLITE_BACKUP_WEBHOOK_KEY`) in your Kestra namespace.
    2. Import this blueprint into Kestra.
    3. Run a test execution with default parameters to verify containerized execution, WAL truncation, and S3 upload.
    4. Adjust `database_file_path`, `s3_bucket`, and `s3_prefix` inputs to point to your target SQLite database and backup repository.
    5. Enable the `scheduled_nightly_backup` trigger to activate automated nightly runs.

    ## How to extend

    - Add retention lifecycle policies or automated cleanup tasks using `io.kestra.plugin.aws.s3.Delete` to prune snapshots older than 30 days.
    - Integrate with PagerDuty via `io.kestra.plugin.pagerduty` for high-severity alerts when database corruption is detected.
    - Add automated restore testing tasks that download the backup, decompress it, and run verification queries against a staging container.

    ## Links

    - [Kestra AWS S3 Plugin Documentation](https://kestra.io/plugins/plugin-aws/s3)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [SQLite WAL Mode Official Documentation](https://www.sqlite.org/wal.html)
    - [SQLite Online Backup API](https://www.sqlite.org/backup.html)
