id: clickhouse-background-pool-tasks-backlog-sentinel
namespace: company.team

inputs:
  - id: clickhouse_host
    type: STRING
    defaults: "clickhouse.internal"
    description: ClickHouse server hostname or IP address.
  - id: clickhouse_http_port
    type: INT
    defaults: 8123
    description: ClickHouse HTTP interface port.
  - id: clickhouse_user
    type: STRING
    defaults: "default"
    description: ClickHouse user name.
  - id: pool_task_threshold
    type: INT
    defaults: 16
    description: Maximum acceptable active background pool tasks before alerting on thread saturation.

tasks:
  - id: query_background_pool_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        set -euo pipefail
        python3 -c "
        import requests, json, sys

        host = '{{ inputs.clickhouse_host }}'
        port = {{ inputs.clickhouse_http_port }}
        user = '{{ inputs.clickhouse_user }}'
        pwd = '{{ secret('CLICKHOUSE_PASSWORD') }}'
        query = \"SELECT metric, value FROM system.metrics WHERE metric IN ('BackgroundPoolTask', 'BackgroundMergesAndMutationsPoolTask', 'BackgroundFetchesPoolTask') FORMAT JSON\"

        try:
            resp = requests.get(f'http://{host}:{port}/', params={'query': query}, auth=(user, pwd), timeout=15)
            resp.raise_for_status()
            data = resp.json().get('data', [])
            total_tasks = sum(int(item.get('value', 0)) for item in data)
            merge_tasks = 0
            for item in data:
                if item.get('metric') == 'BackgroundMergesAndMutationsPoolTask':
                    merge_tasks = int(item.get('value', 0))

            result = {
                'clickhouse_host': host,
                'total_pool_tasks': total_tasks,
                'merge_tasks': merge_tasks,
                'alert_triggered': total_tasks >= {{ inputs.pool_task_threshold }}
            }
            with open('clickhouse_pool_summary.json', 'w') as out:
                json.dump(result, out)
            print('ClickHouse pool metrics:', result)
        except Exception as err:
            sys.stderr.write(f'ClickHouse pool query error: {err}\n')
            sys.exit(1)
        "
    outputFiles:
      - clickhouse_pool_summary.json

  - id: evaluate_pool_backlog
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.query_background_pool_metrics.outputFiles['clickhouse_pool_summary.json'])).alert_triggered }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#clickhouse-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": ":rotating_light: ClickHouse Background Pool Saturation Alert",
                "text": "ClickHouse node `{{ inputs.clickhouse_host }}` background thread pool is saturated! Active tasks: *{{ fromJson(read(outputs.query_background_pool_metrics.outputFiles['clickhouse_pool_summary.json'])).total_pool_tasks }}* (Merge/Mutation tasks: *{{ fromJson(read(outputs.query_background_pool_metrics.outputFiles['clickhouse_pool_summary.json'])).merge_tasks }}*). Impact: Table parts accumulation will trigger `Too many parts in all data parts in table` write rejections.",
                "footer": "Kestra Database Sentinel • ClickHouse"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#clickhouse-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": ":warning: ClickHouse Background Pool Tasks Backlog Sentinel Pipeline Failure",
            "text": "Failed to query ClickHouse background pool metrics. Please verify server status and network connectivity.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors ClickHouse system.metrics to detect background merge and mutation pool saturation."
  metaTitle: ClickHouse Background Pool Tasks Backlog Sentinel with Kestra
  title: ClickHouse Background Pool Tasks Backlog Sentinel
  shortDescription: Monitors ClickHouse system.metrics to detect background merge and mutation pool saturation.
  description: |
    ## How it works
    This workflow queries `system.metrics` for `BackgroundPoolTask` and `BackgroundMergesAndMutationsPoolTask`. In ClickHouse, background pools manage data part compaction, TTL cleanup, and mutation execution. When insert volumes are high or mutations are heavy, the pool saturates (`background_pool_size` limit reached), causing part accumulation and catastrophic write rejections. When saturation is detected, Slack is notified immediately.

    ## What you get
    - Real-time detection of background thread starvation in ClickHouse.
    - Prevents the classic 'Too many parts in all data parts' write rejection outage.
    - Breakdown of merge tasks vs fetch tasks.

    ## Who it's for
    - Data Engineers and Infrastructure Architects operating high-volume ClickHouse clusters.
    - SREs responsible for database write availability and query throughput.

    ## Why orchestrate this with Kestra
    - **Continuous Background Health Monitoring**: Monitor internal thread pools without custom Prometheus exporters.
    - **Preemptive Notification**: Catch backlog before write queries begin failing.
    - **Automated Workflow Orchestration**: Execute remediation flows such as pausing non-critical mutations.

    ## Prerequisites
    - ClickHouse HTTP interface accessible to the Kestra worker.
    - Secrets `CLICKHOUSE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Set `clickhouse_host` and threshold.
    3. Run the workflow to inspect background thread utilization.

    ## How to extend
    - Automatically pause long-running ALTER TABLE UPDATE/DELETE mutations during high-traffic ingestion windows.
    - Alert PagerDuty on prolonged background pool exhaustion.

    ## Links
    - [ClickHouse Merges and Mutations Documentation](https://clickhouse.com/docs/en/optimize/sparse-primary-indexes#merges)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
