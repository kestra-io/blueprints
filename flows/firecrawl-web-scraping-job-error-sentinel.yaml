id: firecrawl-web-scraping-job-error-sentinel
namespace: company.ai

inputs:
  - id: firecrawl_api_url
    type: STRING
    defaults: "https://api.firecrawl.dev/v1"
    description: Base URL of the Firecrawl web scraping API.
  - id: crawl_job_id
    type: STRING
    description: Target crawl job ID to audit.

tasks:
  - id: inspect_crawl_status
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Firecrawl API for crawl job status
        curl -s -H "Authorization: Bearer {{ secret('FIRECRAWL_API_KEY') }}" \
          "{{ inputs.firecrawl_api_url }}/crawl/{{ inputs.crawl_job_id }}" > /tmp/firecrawl_res.json

        python3 -c "
        import json
        try:
            with open('/tmp/firecrawl_res.json') as f:
                data = json.load(f)
            status = data.get('status', 'unknown')
            total = data.get('total', 0)
            completed = data.get('completed', 0)
            is_failed = 1 if status in ['failed', 'cancelled'] else 0
            print(f'{is_failed}|{status}|{total}|{completed}')
        except Exception:
            print('0|unknown|0|0')
        " > /tmp/firecrawl_summary.txt

        IS_FAILED=$(cut -d '|' -f 1 /tmp/firecrawl_summary.txt)
        JOB_STATUS=$(cut -d '|' -f 2 /tmp/firecrawl_summary.txt)
        TOTAL_PAGES=$(cut -d '|' -f 3 /tmp/firecrawl_summary.txt)
        COMPLETED_PAGES=$(cut -d '|' -f 4 /tmp/firecrawl_summary.txt)
        
        echo "::set-output name=is_failed::${IS_FAILED:-0}::"
        echo "::set-output name=job_status::$JOB_STATUS::"
        echo "::set-output name=total_pages::$TOTAL_PAGES::"
        echo "::set-output name=completed_pages::$COMPLETED_PAGES::"

  - id: evaluate_crawl_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_crawl_status.vars.is_failed | int == 1 }}"
    then:
      - id: notify_ai_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#ai-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Firecrawl Web Scraping Job Failure Alert",
                "text": "Crawl Job {{ inputs.crawl_job_id }} entered status {{ outputs.inspect_crawl_status.vars.job_status }} ({{ outputs.inspect_crawl_status.vars.completed_pages }} of {{ outputs.inspect_crawl_status.vars.total_pages }} pages scraped). Downstream RAG embedding pipelines are missing documentation context.",
                "footer": "Kestra AI Ingestion Sentinel • Firecrawl"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#ai-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Firecrawl Sentinel Failure",
            "text": "Failed to communicate with Firecrawl API at {{ inputs.firecrawl_api_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true
    inputs:
      crawl_job_id: replace-with-your-crawl-job-id

extend:
  metaDescription: "Audits Firecrawl scraping jobs to detect crawl failures and prevent LLM knowledge drift."
  metaTitle: Firecrawl Web Scraping Job Error and Stagnation Sentinel with Kestra
  ee: false
  verified: false
  demo: false
  title: Firecrawl Web Scraping Job Error and Stagnation Sentinel
  shortDescription: Audits Firecrawl scraping jobs to detect crawl failures and prevent LLM knowledge drift.
  description: |
    ## How it works
    This workflow queries the Firecrawl REST API (`/v1/crawl/{id}`) with an API key to audit the execution status of web scraping and markdown conversion jobs. In generative AI and RAG architectures, Firecrawl indexes external developer documentation and knowledge bases into clean markdown. When target domains enforce anti-bot protections, rate limits, or SSL handshake resets, crawl operations transition into `failed` or `cancelled` states. This sentinel verifies job completion and alerts AI data engineers when scraping pipelines fail before chunking and embedding phases.

    ## What you get
    - Real-time tracking of AI web scraping jobs in Firecrawl.
    - Protection against missing documentation context in RAG vector indexes.
    - Automated Slack incident notifications detailing failed job status and scraped page counts.

    ## Who it's for
    - AI Engineers building RAG pipelines and knowledge graph embeddings.
    - Data Engineers ingesting unstructured web content for LLM fine-tuning.
    - SREs maintaining production AI data ingestion pipelines.

    ## Why orchestrate this with Kestra
    - **End-to-End Orchestration**: Integrates scraping validation directly with vector database upserts.
    - **Encrypted API Security**: Safely injects Firecrawl API keys using Kestra's encrypted secrets engine.
    - **Automated Retries**: Can trigger an automated crawl retry upon failure.

    ## Prerequisites
    - Firecrawl account and API key.
    - Firecrawl Crawl Job ID.
    - Secrets `FIRECRAWL_API_KEY` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `FIRECRAWL_API_KEY` and `SLACK_WEBHOOK` secrets.
    3. Specify `crawl_job_id`.
    4. Enable the schedule trigger for continuous crawl verification.

    ## How to extend
    - Trigger an automated retry crawl request with a modified rate limit.
    - Forward scraped content directly into Qdrant or Pinecone vector stores.
    - Alert to Microsoft Teams or Discord.

    ## Links
    - [Firecrawl API Reference](https://docs.firecrawl.dev/api-reference/endpoint/get-crawl-status)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - AI
    - Data
  subTags:
    - Agents & Structured Output
    - ELT & Data Landing
