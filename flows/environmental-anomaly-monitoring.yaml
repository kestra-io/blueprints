id: environmental-anomaly-monitoring
namespace: company.team

inputs:
  - id: latitude
    type: FLOAT
    defaults: 52.52
    description: Latitude coordinate of the monitored location (default is Berlin, Germany).

  - id: longitude
    type: FLOAT
    defaults: 13.41
    description: Longitude coordinate of the monitored location (default is Berlin, Germany).

  - id: temperature_threshold
    type: FLOAT
    defaults: 35.0
    description: Maximum acceptable ambient temperature in degrees Celsius (°C).

  - id: humidity_threshold
    type: FLOAT
    defaults: 80.0
    description: Maximum acceptable relative humidity percentage (0-100%).

  - id: wind_speed_threshold
    type: FLOAT
    defaults: 25.0
    description: Maximum acceptable wind speed in km/h.

tasks:
  - id: fetch_weather_data
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.open-meteo.com/v1/forecast?latitude={{ inputs.latitude }}&longitude={{ inputs.longitude }}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation"
    method: GET
    contentType: application/json
    retry:
      type: exponential
      maxAttempts: 3
      interval: PT5S
      maxInterval: PT30S
      delayFactor: 2.0

  - id: analyze_weather_data
    type: io.kestra.plugin.scripts.python.Script
    beforeCommands:
      - pip install kestra
    inputFiles:
      weather.json: "{{ outputs.fetch_weather_data.body }}"
    env:
      TEMP_THRESHOLD: "{{ inputs.temperature_threshold }}"
      HUMIDITY_THRESHOLD: "{{ inputs.humidity_threshold }}"
      WIND_SPEED_THRESHOLD: "{{ inputs.wind_speed_threshold }}"
      LATITUDE: "{{ inputs.latitude }}"
      LONGITUDE: "{{ inputs.longitude }}"
    script: |
      import json
      import os
      import sys

      def evaluate():
          temp_thresh = float(os.environ.get("TEMP_THRESHOLD", "35.0"))
          humidity_thresh = float(os.environ.get("HUMIDITY_THRESHOLD", "80.0"))
          wind_thresh = float(os.environ.get("WIND_SPEED_THRESHOLD", "25.0"))
          lat = os.environ.get("LATITUDE", "unknown")
          lon = os.environ.get("LONGITUDE", "unknown")

          # Read input weather payload from file
          raw_data = "{}"
          if os.path.exists("weather.json"):
              with open("weather.json", "r", encoding="utf-8") as f:
                  raw_data = f.read()

          try:
              data = json.loads(raw_data)
          except Exception as exc:
              print(f"Warning: Failed to parse weather JSON: {exc}", file=sys.stderr)
              data = {}

          current = data.get("current", {})

          try:
              temperature = float(current.get("temperature_2m", 0.0))
          except (ValueError, TypeError):
              temperature = 0.0

          try:
              humidity = float(current.get("relative_humidity_2m", 0.0))
          except (ValueError, TypeError):
              humidity = 0.0

          try:
              wind_speed = float(current.get("wind_speed_10m", 0.0))
          except (ValueError, TypeError):
              wind_speed = 0.0

          try:
              precipitation = float(current.get("precipitation", 0.0))
          except (ValueError, TypeError):
              precipitation = 0.0

          timestamp = current.get("time", "N/A")

          # Threshold anomaly evaluations
          reasons = []
          if temperature > temp_thresh:
              reasons.append(f"Temperature ({temperature}°C) exceeded threshold ({temp_thresh}°C)")
          if humidity > humidity_thresh:
              reasons.append(f"Humidity ({humidity}%) exceeded threshold ({humidity_thresh}%)")
          if wind_speed > wind_thresh:
              reasons.append(f"Wind speed ({wind_speed} km/h) exceeded threshold ({wind_thresh} km/h)")

          anomaly_detected = len(reasons) > 0
          reasons_summary = "; ".join(reasons) if anomaly_detected else "All metrics within thresholds"
          reasons_formatted = "\\n".join([f"• {r}" for r in reasons]) if anomaly_detected else "None"

          result = {
              "temperature": temperature,
              "humidity": humidity,
              "wind_speed": wind_speed,
              "precipitation": precipitation,
              "timestamp": timestamp,
              "temperature_threshold": temp_thresh,
              "humidity_threshold": humidity_thresh,
              "wind_speed_threshold": wind_thresh,
              "anomaly_detected": anomaly_detected,
              "reasons": reasons,
              "reasons_summary": reasons_summary,
              "reasons_formatted": reasons_formatted
          }

          print("--- Environmental Sensor Analysis Result ---")
          print(json.dumps(result, indent=2))

          # Output variables to Kestra context
          try:
              from kestra import Kestra
              Kestra.outputs(result)
          except ImportError:
              print(f"::{json.dumps({'outputs': result})}::")

      if __name__ == "__main__":
          evaluate()

  - id: check_anomaly_condition
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.analyze_weather_data.vars.anomaly_detected }}"
    then:
      - id: send_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "🚨 Environmental Anomaly Alert: {{ outputs.analyze_weather_data.vars.reasons_summary }} (Flow: {{ flow.id }})",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚨 Environmental Sensor Anomaly Alert",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*One or more environmental thresholds were breached during periodic sensor monitoring.*"
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*📍 Location:*\n`Lat {{ inputs.latitude }}, Lon {{ inputs.longitude }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*⏱ Observation Time:*\n`{{ outputs.analyze_weather_data.vars.timestamp }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*🌡 Temperature:*\n*{{ outputs.analyze_weather_data.vars.temperature }}°C* (Threshold: {{ inputs.temperature_threshold }}°C)"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*💧 Relative Humidity:*\n*{{ outputs.analyze_weather_data.vars.humidity }}%* (Threshold: {{ inputs.humidity_threshold }}%)"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*💨 Wind Speed:*\n*{{ outputs.analyze_weather_data.vars.wind_speed }} km/h* (Threshold: {{ inputs.wind_speed_threshold }} km/h)"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*🌧 Precipitation:*\n*{{ outputs.analyze_weather_data.vars.precipitation }} mm*"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*⚠️ Triggered Anomalies:*\n{{ outputs.analyze_weather_data.vars.reasons_formatted }}"
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Flow ID: `{{ flow.id }}` | Namespace: `{{ flow.namespace }}` | Execution ID: `{{ execution.id }}`"
                  }
                ]
              }
            ]
          }
    else:
      - id: log_normal_status
        type: io.kestra.plugin.core.log.Log
        message: |
          ✅ All environmental metrics within configured thresholds.
          Location: Lat {{ inputs.latitude }}, Lon {{ inputs.longitude }}
          Temperature: {{ outputs.analyze_weather_data.vars.temperature }}°C (Max: {{ inputs.temperature_threshold }}°C)
          Humidity: {{ outputs.analyze_weather_data.vars.humidity }}% (Max: {{ inputs.humidity_threshold }}%)
          Wind Speed: {{ outputs.analyze_weather_data.vars.wind_speed }} km/h (Max: {{ inputs.wind_speed_threshold }} km/h)
          Precipitation: {{ outputs.analyze_weather_data.vars.precipitation }} mm
          Status: NORMAL

triggers:
  - id: every_5_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"

extend:
  title: "Environmental Sensor Anomaly Monitoring and Slack Alerting"
  metaTitle: "Environmental Sensor Anomaly Monitoring and Slack Alerting with Kestra"
  shortDescription: "Periodically monitor real-time weather and sensor data, detect environmental threshold breaches using Python, and dispatch alerts to Slack."
  metaDescription: "Monitor real-time environmental data with Kestra, detect temperature and humidity anomalies via Python, and trigger automated Slack alerts."
  tags:
    - Data
    - Alerting
  subTags:
    - Monitoring
    - Python
  ee: false
  demo: false
  description: |
    Automate continuous environmental and weather sensor monitoring with real-time REST API ingestion, Python anomaly detection, conditional flow branching, and Slack alerting.

    ## How it works
    1. **Automated Scheduling**: An `io.kestra.plugin.core.trigger.Schedule` triggers the workflow every 5 minutes (`*/5 * * * *`).
    2. **REST API Ingestion**: An `io.kestra.plugin.core.http.Request` task fetches live environmental conditions (temperature, humidity, wind speed, precipitation) from the Open-Meteo REST API for the configured latitude and longitude. The task includes an exponential backoff retry mechanism for transient network resilience.
    3. **Python Analytical Processing**: An `io.kestra.plugin.scripts.python.Script` task runs in an isolated Python environment, reads the ingested payload, validates numeric types, compares values against user-defined thresholds, evaluates anomaly conditions, and produces a structured machine-readable result outputting variables back to the Kestra context via `Kestra.outputs()`.
    4. **Conditional Branching**: An `io.kestra.plugin.core.flow.If` task evaluates the Python `anomaly_detected` boolean flag:
       - **THEN (Anomaly Detected)**: Calls `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` to dispatch a Slack message using Block Kit cards displaying current readings, breached thresholds, coordinate location, and execution metadata.
       - **ELSE (Normal Conditions)**: Executes an `io.kestra.plugin.core.log.Log` task reporting that all sensor readings remain within normal thresholds.

    ## What you get
    - Fully automated real-time environmental monitoring without infrastructure maintenance.
    - Configurable coordinate inputs allowing instant redeployment to any global location.
    - Isolated Python container execution ensuring reproducible data processing.
    - Slack notification payloads formatted with Block Kit for mobile and desktop clarity.
    - Auditability with complete execution history, logs, and captured metric outputs in Kestra.

    ## Who it's for
    - IoT and facility management engineers monitoring server rooms, greenhouses, or warehouses.
    - Data and DevOps engineers orchestrating automated external monitoring and incident alerting pipelines.
    - Environmental scientists tracking micro-climate spikes and weather anomalies across multiple locations.

    ## Why orchestrate this with Kestra
    - **Declarative YAML Workflow**: Combine API requests, Python scripts, conditional logic, and notifications in a single declarative definition.
    - **Zero Mocking**: Ingest real REST API endpoints and process real data directly out of the box.
    - **Built-in Secrets Engine**: Securely reference incoming webhook credentials using `secret('SLACK_WEBHOOK')` without leaking secrets in logs or code.
    - **Native Conditional Control**: Built-in `If` tasks branch execution based on dynamic task outputs without requiring boilerplate glue code.
    - **Execution Observability**: Every execution captures input values, task outputs, retry attempts, and logs for fast debugging.

    ## Prerequisites
    - A Kestra instance (Open Source or Enterprise) version 0.16.0 or higher.
    - An active Slack workspace with an Incoming Webhook URL configured.
    - Internet connectivity from the Kestra worker to access `api.open-meteo.com` (no API key required).

    ### Secrets
    - `SLACK_WEBHOOK`: The complete Slack Incoming Webhook URL (e.g., `https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX`).

    ## Quick start
    1. In the Kestra UI, navigate to **Administration > Secrets** and create a secret named `SLACK_WEBHOOK` with your Slack Incoming Webhook URL.
    2. Navigate to **Flows** and create a new flow using this Blueprint YAML.
    3. Click **Execute** to run a test execution. Inspect the execution Gantt chart and task logs.
    4. Under **Triggers**, toggle the `every_5_minutes` schedule to enabled for automated periodic monitoring.

    ## How to extend
    - **Multi-channel Alerting**: Add an email (`io.kestra.plugin.notifications.mail.MailSend`), Microsoft Teams, or PagerDuty task alongside Slack in the `then` branch.
    - **Historical Timeseries Persistence**: Write sensor readings and anomaly events directly into PostgreSQL, DuckDB, or BigQuery for historical reporting.
    - **Multi-sensor Aggregation**: Expand the inputs and API parameters to track air quality index (PM2.5, PM10), UV index, or soil moisture sensors.

    ## Links
    - [Kestra Documentation](https://kestra.io/docs)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
    - [Open-Meteo Weather API Documentation](https://open-meteo.com/en/docs)
