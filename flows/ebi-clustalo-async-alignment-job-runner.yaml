id: ebi-clustalo-async-alignment-job-runner
namespace: company.team

description: |
  Run a Clustal Omega multiple sequence alignment on the EMBL-EBI Job Dispatcher: fetch the sequences from
  UniProt (or take raw FASTA), submit one asynchronous job, poll its status with LoopUntil, download the
  alignment, percent identity matrix and guide tree, and summarise the matrix in DuckDB (closest pair,
  near-duplicates, outliers). The same sequence set is only re-aligned when its content changes.

inputs:
  - id: email
    type: STRING
    defaults: ""
    description: Your email address. The EBI Job Dispatcher requires one on every submission and uses it to contact you about problem jobs. Required (the run stops before submitting if it is empty).

  - id: accessions
    type: STRING
    defaults: "P69905,P69907,P68871,P02144,P01942,P02088,P61626,P00001"
    description: |
      UniProtKB accessions, comma-separated, fetched live as FASTA. The defaults are human, chimpanzee and mouse
      haemoglobin alpha (human and chimpanzee are identical, so they show up as a near-duplicate), human and mouse
      haemoglobin beta, human myoglobin (a distant globin), human lysozyme C (an unrelated protein, flagged as an
      outlier) and P00001, which UniProt does not return (reported as missing). Ignored when `fasta` is set.

  - id: fasta
    type: STRING
    defaults: ""
    description: Raw FASTA to align instead of `accessions` (2 to 4000 sequences, unique identifiers). A Webhook call can send it as `fasta` in the JSON body.

  - id: stype
    type: SELECT
    values: [protein, dna, rna]
    defaults: protein
    description: Sequence type passed to Clustal Omega.

  - id: outlier_identity
    type: FLOAT
    defaults: 25.0
    description: A sequence whose best identity to any other sequence is below this percentage is flagged as an outlier (wrong family, wrong accession).

  - id: redundant_identity
    type: FLOAT
    defaults: 98.0
    description: Pairs at or above this percentage identity are flagged as near-duplicates.

  - id: force_rerun
    type: BOOL
    defaults: false
    description: Submit a new job even if this exact sequence set was aligned before.

variables:
  email: "{{ trigger.body.email ?? inputs.email }}"
  fasta: "{{ trigger.body.fasta ?? inputs.fasta }}"
  ebi: https://www.ebi.ac.uk/Tools/services/rest/clustalo

triggers:
  - id: on_new_sequences
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('CLUSTALO_WEBHOOK_KEY') }}"
    description: POST a JSON body with `fasta` (and optionally `email`) to align sequences produced by another system, for example a sequencing or curation pipeline.

  - id: weekly_panel_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 * * 1"
    description: Weekly re-check of the accession panel. UniProt sequence revisions change the content hash and trigger a new alignment; otherwise the run reports the panel as unchanged without submitting a job.
    inputs:
      email: research-computing@example.com

tasks:
  - id: check_email
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ render(vars.email) is empty }}"
    errorMessage: The EBI Job Dispatcher requires an email address. Set the `email` input (or `email` in the webhook body).

  - id: fetch_uniprot
    type: io.kestra.plugin.core.http.Request
    runIf: "{{ render(vars.fasta) is empty }}"
    description: One request for all accessions. UniProt silently omits accessions it does not know, so the next task compares requested and returned accessions.
    uri: "https://rest.uniprot.org/uniprotkb/accessions?accessions={{ inputs.accessions | replace({' ': ''}) | urlencode }}&format=fasta"
    headers:
      User-Agent: kestra-ebi-clustalo-async-alignment-job-runner/1.0

  - id: prepare
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Parses the FASTA headers, lists requested accessions UniProt did not return and computes a SHA-256 of the exact sequence set, used as the cache key.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      seqs.fa: "{{ render(vars.fasta) is empty ? outputs.fetch_uniprot.body : render(vars.fasta) }}"
    parameters:
      accessions: "{{ render(vars.fasta) is empty ? inputs.accessions : '' }}"
    sql: |
      CREATE TABLE fa AS SELECT replace(content, chr(13), '') AS content FROM read_text('seqs.fa');
      CREATE TABLE recs AS
      SELECT split_part(split_part(r, chr(10), 1), ' ', 1) AS seq_id,
             coalesce(nullif(split_part(split_part(r, chr(10), 1), '|', 2), ''), split_part(split_part(r, chr(10), 1), ' ', 1)) AS accession
      FROM fa, unnest(string_split(content, '>')) AS t(r) WHERE trim(r) <> '';
      CREATE TABLE requested AS
      SELECT DISTINCT upper(trim(a)) AS accession FROM unnest(string_split(:accessions, ',')) AS t(a) WHERE trim(a) <> '';
      SELECT (SELECT count(*) FROM recs) AS n_sequences,
             (SELECT coalesce(string_agg(accession, ', ' ORDER BY accession), '') FROM requested ANTI JOIN recs USING (accession)) AS missing_accessions,
             (SELECT left(sha256(content), 16) FROM fa) AS set_hash,
             (SELECT content FROM fa) AS fasta;

  - id: warn_missing
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.prepare.outputs[0].row.missing_accessions is not empty }}"
    level: WARN
    message: "UniProt returned no entry for: {{ outputs.prepare.outputs[0].row.missing_accessions }} (deleted, merged or mistyped). Continuing with the {{ outputs.prepare.outputs[0].row.n_sequences }} sequences that were found."

  - id: previous_run
    type: io.kestra.plugin.core.kv.Get
    key: "clustalo_{{ outputs.prepare.outputs[0].row.set_hash }}"
    errorOnMissing: false

  - id: align_if_new
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.previous_run.value ?? '') is empty or inputs.force_rerun }}"
    then:
      - id: submit
        type: io.kestra.plugin.core.http.Request
        description: Submits the job. The service validates the input synchronously and answers HTTP 400 with a reason (fewer than 2 sequences, duplicated identifiers, missing email); `allowFailed` lets the next task report that reason.
        method: POST
        uri: "{{ vars.ebi }}/run"
        contentType: application/x-www-form-urlencoded
        formData:
          email: "{{ render(vars.email) }}"
          title: "kestra {{ flow.id }} {{ execution.id }}"
          stype: "{{ inputs.stype }}"
          outfmt: clustal_num
          order: input
          sequence: "{{ outputs.prepare.outputs[0].row.fasta }}"
        options:
          allowFailed: true

      - id: rejected
        type: io.kestra.plugin.core.execution.Fail
        runIf: "{{ outputs.submit.code != 200 }}"
        errorMessage: "EBI rejected the job (HTTP {{ outputs.submit.code }}): {{ outputs.submit.body | split('<description>') | last | split('</description>') | first | trim }}"

      - id: wait_for_job
        type: io.kestra.plugin.core.flow.LoopUntil
        description: Checks the status every 30 seconds. Clustal Omega itself takes seconds, but the shared EBI queue can hold a job for many minutes.
        condition: "{{ not (['QUEUED', 'RUNNING', 'PENDING'] contains (outputs.poll_status.body | trim)) }}"
        checkFrequency:
          interval: PT30S
          maxDuration: PT3H
        failOnMaxReached: true
        tasks:
          - id: poll_status
            type: io.kestra.plugin.core.http.Request
            uri: "{{ vars.ebi }}/status/{{ outputs.submit.body | trim }}"

      - id: route_status
        type: io.kestra.plugin.core.flow.Switch
        value: "{{ outputs.poll_status.body | trim }}"
        cases:
          FINISHED:
            - id: download_pim
              type: io.kestra.plugin.core.http.Download
              uri: "{{ vars.ebi }}/result/{{ outputs.submit.body | trim }}/pim"

            - id: download_alignment
              type: io.kestra.plugin.core.http.Download
              uri: "{{ vars.ebi }}/result/{{ outputs.submit.body | trim }}/aln-clustal_num"

            - id: download_tree
              type: io.kestra.plugin.core.http.Download
              uri: "{{ vars.ebi }}/result/{{ outputs.submit.body | trim }}/phylotree"

            - id: analyse
              type: io.kestra.plugin.jdbc.duckdb.Queries
              description: Turns the percent identity matrix into one row per pair, finds near-duplicates and outliers, and counts fully conserved columns from the Clustal conservation line.
              url: "jdbc:duckdb:"
              fetchType: FETCH_ONE
              inputFiles:
                pim.txt: "{{ outputs.download_pim.uri }}"
                aln.txt: "{{ outputs.download_alignment.uri }}"
              outputFiles:
                - pairs_csv
              parameters:
                outlier: "{{ inputs.outlier_identity }}"
                redundant: "{{ inputs.redundant_identity }}"
              sql: |
                SET TimeZone = 'UTC';
                CREATE TABLE rows AS
                SELECT CAST(regexp_extract(l, '^\s*([0-9]+)[^0-9 ]\s*(\S+)\s+(.*)$', 1) AS INTEGER) AS i,
                       regexp_extract(l, '^\s*([0-9]+)[^0-9 ]\s*(\S+)\s+(.*)$', 2) AS seq_id,
                       regexp_split_to_array(trim(regexp_extract(l, '^\s*([0-9]+)[^0-9 ]\s*(\S+)\s+(.*)$', 3)), '\s+') AS vals
                FROM (SELECT unnest(string_split(replace(content, chr(13), ''), chr(10))) AS l FROM read_text('pim.txt'))
                WHERE regexp_matches(l, '^\s*[0-9]+[^0-9 ]\s*\S+\s+[0-9]');
                CREATE TABLE pairs AS
                SELECT a.seq_id AS seq_a, b.seq_id AS seq_b, CAST(a.vals[b.i] AS DOUBLE) AS identity_pct
                FROM rows a JOIN rows b ON a.i < b.i;
                CREATE TABLE best AS
                SELECT seq_id, max(identity_pct) AS best_identity
                FROM (SELECT seq_a AS seq_id, identity_pct FROM pairs UNION ALL SELECT seq_b, identity_pct FROM pairs)
                GROUP BY seq_id;
                CREATE TABLE aln AS
                SELECT unnest(string_split(replace(content, chr(13), ''), chr(10))) AS l FROM read_text('aln.txt');
                COPY (SELECT *, identity_pct >= :redundant AS near_duplicate FROM pairs ORDER BY identity_pct DESC)
                  TO '{{ outputFiles.pairs_csv }}' (HEADER, DELIMITER ',');
                SELECT (SELECT count(*) FROM rows) AS aligned_sequences,
                       (SELECT round(avg(identity_pct), 2) FROM pairs) AS mean_identity,
                       (SELECT seq_a || ' / ' || seq_b || ' ' || identity_pct || '%' FROM pairs ORDER BY identity_pct DESC LIMIT 1) AS closest_pair,
                       (SELECT seq_a || ' / ' || seq_b || ' ' || identity_pct || '%' FROM pairs ORDER BY identity_pct LIMIT 1) AS most_divergent_pair,
                       (SELECT coalesce(string_agg(seq_a || ' / ' || seq_b || ' ' || identity_pct || '%', '; '), '') FROM pairs WHERE identity_pct >= :redundant) AS near_duplicates,
                       (SELECT coalesce(string_agg(seq_id || ' (best ' || best_identity || '%)', '; '), '') FROM best WHERE best_identity < :outlier) AS outliers,
                       (SELECT sum(length(regexp_extract(l, '^\S+\s+(\S+)', 1))) FROM aln
                         WHERE regexp_extract(l, '^(\S+)', 1) = (SELECT seq_id FROM rows WHERE i = 1)) AS alignment_columns,
                       (SELECT coalesce(sum(length(l) - length(replace(l, '*', ''))), 0) FROM aln WHERE regexp_matches(l, '^\s+[*:. ]*\*')) AS conserved_columns;

            - id: log_result
              type: io.kestra.plugin.core.log.Log
              message: "Job {{ outputs.submit.body | trim }} FINISHED: {{ outputs.analyse.outputs[0].row.aligned_sequences }} sequences, {{ outputs.analyse.outputs[0].row.alignment_columns }} columns, {{ outputs.analyse.outputs[0].row.conserved_columns }} fully conserved, mean pairwise identity {{ outputs.analyse.outputs[0].row.mean_identity }}%. Closest {{ outputs.analyse.outputs[0].row.closest_pair }}, most divergent {{ outputs.analyse.outputs[0].row.most_divergent_pair }}."

            - id: warn_flags
              type: io.kestra.plugin.core.log.Log
              runIf: "{{ outputs.analyse.outputs[0].row.outliers is not empty or outputs.analyse.outputs[0].row.near_duplicates is not empty }}"
              level: WARN
              message: "Outliers (best identity < {{ inputs.outlier_identity }}%): {{ outputs.analyse.outputs[0].row.outliers | default('none') }}. Near-duplicates (>= {{ inputs.redundant_identity }}%): {{ outputs.analyse.outputs[0].row.near_duplicates | default('none') }}."

            - id: notify
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              allowFailure: true
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {"text": ":dna: Clustal Omega alignment finished: {{ outputs.analyse.outputs[0].row.aligned_sequences }} sequences, {{ outputs.analyse.outputs[0].row.alignment_columns }} columns ({{ outputs.analyse.outputs[0].row.conserved_columns }} fully conserved), mean identity {{ outputs.analyse.outputs[0].row.mean_identity }}%.\nClosest: {{ outputs.analyse.outputs[0].row.closest_pair }}. Most divergent: {{ outputs.analyse.outputs[0].row.most_divergent_pair }}.\nOutliers: {{ outputs.analyse.outputs[0].row.outliers | default('none') }}\nJob: {{ vars.ebi }}/result/{{ outputs.submit.body | trim }}/aln-clustal_num (kept 7 days by EBI)"}

            - id: save_run
              type: io.kestra.plugin.core.kv.Set
              key: "clustalo_{{ outputs.prepare.outputs[0].row.set_hash }}"
              value: |
                {"job_id": "{{ outputs.submit.body | trim }}", "aligned_at": "{{ now() | date("yyyy-MM-dd HH:mm 'UTC'", timeZone="UTC") }}", "sequences": {{ outputs.analyse.outputs[0].row.aligned_sequences }}, "mean_identity": {{ outputs.analyse.outputs[0].row.mean_identity }}, "closest_pair": "{{ outputs.analyse.outputs[0].row.closest_pair }}"}

          FAILURE:
            - id: fetch_error
              type: io.kestra.plugin.core.http.Request
              uri: "{{ vars.ebi }}/result/{{ outputs.submit.body | trim }}/error"
              allowFailure: true

            - id: job_failed
              type: io.kestra.plugin.core.execution.Fail
              errorMessage: "Clustal Omega job {{ outputs.submit.body | trim }} ended in FAILURE: {{ outputs.fetch_error.body ?? 'no error output' }}"
        defaults:
          - id: job_lost
            type: io.kestra.plugin.core.execution.Fail
            errorMessage: "Clustal Omega job {{ outputs.submit.body | trim }} ended with status {{ outputs.poll_status.body | trim }} (ERROR is a service-side problem, NOT_FOUND means the job id is unknown or expired)."
    else:
      - id: unchanged
        type: io.kestra.plugin.core.log.Log
        message: "This exact set of {{ outputs.prepare.outputs[0].row.n_sequences }} sequences was already aligned at {{ fromJson(outputs.previous_run.value).aligned_at }} (job {{ fromJson(outputs.previous_run.value).job_id }}, mean identity {{ fromJson(outputs.previous_run.value).mean_identity }}%). Nothing submitted; set force_rerun to align again."

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.analyse.outputs[0].row ?? (outputs.previous_run.value ?? '{}') }}"
  - id: pairwise_identity_csv
    type: FILE
    required: false
    value: "{{ outputs.analyse.outputFiles.pairs_csv ?? null }}"
  - id: alignment
    type: FILE
    required: false
    value: "{{ outputs.download_alignment.uri ?? null }}"
  - id: guide_tree
    type: FILE
    required: false
    value: "{{ outputs.download_tree.uri ?? null }}"

extend:
  title: Run Clustal Omega Alignments on the EMBL-EBI Job Dispatcher with Async Polling
  metaTitle: EBI Clustal Omega Async Alignment Job Runner with DuckDB | Kestra
  shortDescription: Fetch protein sequences from UniProt, submit a Clustal Omega job to the EMBL-EBI Job Dispatcher, poll it with LoopUntil, download the alignment, identity matrix and guide tree, and flag near-duplicate and outlier sequences.
  metaDescription: Submit Clustal Omega jobs to EMBL-EBI, poll with LoopUntil, parse the percent identity matrix in DuckDB and skip sequence sets already aligned.
  description: |
    The EMBL-EBI Job Dispatcher runs Clustal Omega for free, but only asynchronously: submit, poll until the job leaves the shared queue, then fetch each result type. This flow runs that loop declaratively on live UniProt entries (or FASTA from a webhook) and turns the percent identity matrix into a pairwise table that flags near-duplicate and outlier sequences.

    ## How it works

    1. A manual run, the `on_new_sequences` Webhook (JSON body with `fasta`, optionally `email`) or the weekly `Schedule` starts the flow; `check_email` stops it if no email is set.
    2. `fetch_uniprot` gets all `accessions` as FASTA in one request. UniProt silently drops unknown accessions, so `prepare` (DuckDB) lists them and hashes the exact FASTA.
    3. `previous_run` (KV Get) looks up the hash; if the set was aligned before and `force_rerun` is false, the `If` logs the earlier job and stops.
    4. `submit` POSTs to `/clustalo/run` (`email`, `stype`, `outfmt=clustal_num`, `order=input`). EBI validates synchronously and returns HTTP 400 for fewer than 2 sequences or duplicated identifiers; `rejected` fails with EBI's reason.
    5. `wait_for_job` (LoopUntil) checks `/status/{jobId}` every 30 seconds until it is no longer QUEUED or RUNNING, for at most 3 hours.
    6. `route_status` (Switch): FINISHED downloads `pim`, `aln-clustal_num` and `phylotree`; FAILURE fetches the job's `error` output and fails with it; ERROR or NOT_FOUND fails with the status.
    7. `analyse` (DuckDB) builds one row per pair and reports the closest pair, near-duplicates, outliers and conserved columns; the result is logged, sent to Slack and saved under the hash.

    ## What you get

    - Alignment, Newick guide tree, pairwise identity CSV and a JSON summary as flow outputs.
    - Warnings for missing accessions, redundant and likely wrong-family sequences; no duplicate submissions to a shared service.

    ## Who it's for

    - Bioinformaticians, phylogenetics researchers and research software engineers wrapping EBI tools into pipelines.

    ## Why orchestrate this with Kestra

    - `LoopUntil` replaces a polling script with a declared interval, time limit and failure state; `Switch` makes each status a branch.
    - The KV store caches results without a database.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins; outbound HTTPS to `www.ebi.ac.uk` and `rest.uniprot.org` (no API keys).
    - A real email address for `email`, also in the Schedule trigger's `inputs`.

    ### Secrets

    - `CLUSTALO_WEBHOOK_KEY`: key in the webhook URL (Webhook trigger only).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; `notify` has `allowFailure`).

    ## Quick start

    1. Execute with your email. The default accessions are fetched live: 7 sequences are aligned, P00001 is reported missing, human and chimpanzee haemoglobin alpha are a 100% near-duplicate and lysozyme C is an outlier.
    2. Execute again: unchanged, nothing submitted. With `force_rerun` and `redundant_identity` 80 the human/mouse orthologue pairs are flagged too.
    3. Add the secrets, set your email in the Schedule trigger and point an upstream system at the webhook.

    ## How to extend

    - Send the tree or the aligned FASTA (`fa` result type) to a phylogeny or HMM tool.
    - Reuse the pattern for MUSCLE, MAFFT or NCBI BLAST on the Job Dispatcher.

    ## Links

    - [LoopUntil](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loopuntil) and [Switch](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.switch)
    - [HTTP Request](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request) and [Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [EBI Clustal Omega REST API](https://www.ebi.ac.uk/Tools/services/rest/clustalo) and [Job Dispatcher docs](https://www.ebi.ac.uk/jdispatcher/docs/)
    - [UniProt REST API](https://www.uniprot.org/help/api)
  tags:
    - Data
  subTags:
    - File & Data Processing Basics
    - Monitoring & Alerting
  ee: false
  demo: false
