id: git-mirror-s3-verified-backup
namespace: company.team
description: Create a restorable Git bundle in S3 and verify it after downloading the object.

inputs:
  - id: owner
    type: STRING
    defaults: kestra-io
    description: GitHub owner of a public repository.
  - id: repository
    type: STRING
    defaults: plugin-debezium
    description: Public GitHub repository to back up.
  - id: bucket
    type: STRING
    description: Existing S3 bucket for verified Git backups.
  - id: region
    type: STRING
    defaults: us-east-1
    description: S3 bucket region.
  - id: max_bundle_mib
    type: INT
    defaults: 500
    description: Reject a generated bundle larger than this limit, in MiB.

triggers:
  - id: weekly_backup
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * 0"
    disabled: true
    description: Enable only after testing one backup and restore.
    inputs:
      bucket: "{{ secret('GIT_MIRROR_S3_BUCKET') }}"

concurrency:
  limit: 1

tasks:
  - id: make_bundle
    type: io.kestra.plugin.scripts.shell.Commands
    description: Mirror the advertised Git refs and create a bundle and ref inventory.
    containerImage: alpine:3.20
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      OWNER: "{{ inputs.owner }}"
      REPOSITORY: "{{ inputs.repository }}"
      MAX_MIB: "{{ inputs.max_bundle_mib }}"
      EXECUTION_ID: "{{ execution.id }}"
    inputFiles:
      backup.sh: |
        #!/bin/sh
        set -eu
        export LC_ALL=C

        case "$OWNER" in
          ""|*[!A-Za-z0-9_.-]*) echo "Invalid GitHub owner" >&2; exit 1 ;;
        esac
        case "$REPOSITORY" in
          ""|*[!A-Za-z0-9_.-]*) echo "Invalid GitHub repository" >&2; exit 1 ;;
        esac
        case "$OWNER/$REPOSITORY" in
          *..* ) echo "Repository path cannot contain '..'" >&2; exit 1 ;;
        esac
        case "$MAX_MIB" in
          ""|*[!0-9]*) echo "max_bundle_mib must be a positive integer" >&2; exit 1 ;;
        esac
        if [ "$MAX_MIB" -le 0 ]; then
          echo "max_bundle_mib must be positive" >&2
          exit 1
        fi

        git clone --quiet --mirror "https://github.com/$OWNER/$REPOSITORY.git" source.git
        git -C source.git for-each-ref --format='%(refname) %(objectname)' | sort > expected-refs.txt
        REF_COUNT=$(wc -l < expected-refs.txt | tr -d ' ')
        if [ "$REF_COUNT" -eq 0 ]; then
          echo "No refs were fetched; refusing an empty backup" >&2
          exit 1
        fi

        git -C source.git bundle create ../backup.bundle --all
        git -C source.git bundle verify ../backup.bundle >/dev/null 2>&1
        SIZE=$(wc -c < backup.bundle | tr -d ' ')
        if [ "$SIZE" -le 0 ] || [ "$SIZE" -gt "$((MAX_MIB * 1048576))" ]; then
          echo "Bundle is empty or exceeds max_bundle_mib" >&2
          exit 1
        fi
        SHA=$(sha256sum backup.bundle | cut -d' ' -f1)

        printf '%s\n' \
          '{' \
          "  \"repository\": \"https://github.com/$OWNER/$REPOSITORY\"," \
          "  \"execution\": \"$EXECUTION_ID\"," \
          "  \"sha256\": \"$SHA\"," \
          "  \"size_bytes\": $SIZE," \
          "  \"ref_count\": $REF_COUNT" \
          '}' > manifest.json

        printf '::{"outputs":{"sha256":"%s","ref_count":%s,"size_bytes":%s}}::\n' \
          "$SHA" "$REF_COUNT" "$SIZE"
    beforeCommands:
      - apk add --no-cache git
    commands:
      - sh backup.sh
    outputFiles:
      - backup.bundle
      - expected-refs.txt
      - manifest.json
    timeout: PT30M

  - id: upload_bundle
    type: io.kestra.plugin.aws.s3.Upload
    description: Stage the archive under this execution's unique S3 prefix.
    bucket: "{{ inputs.bucket }}"
    region: "{{ inputs.region }}"
    key: git-mirrors/{{ inputs.owner }}/{{ inputs.repository }}/{{ execution.id }}/backup.bundle
    from: "{{ outputs.make_bundle.outputFiles['backup.bundle'] }}"

  - id: download_bundle
    type: io.kestra.plugin.aws.s3.Download
    description: Read the staged S3 object back before publishing a manifest.
    bucket: "{{ inputs.bucket }}"
    region: "{{ inputs.region }}"
    key: git-mirrors/{{ inputs.owner }}/{{ inputs.repository }}/{{ execution.id }}/backup.bundle

  - id: verify_roundtrip
    type: io.kestra.plugin.scripts.shell.Commands
    description: Hash the downloaded bundle, restore it, and compare every ref target OID.
    containerImage: alpine:3.20
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      EXPECTED_SHA256: "{{ outputs.make_bundle.vars.sha256 }}"
    inputFiles:
      backup.bundle: "{{ outputs.download_bundle.uri }}"
      expected-refs.txt: "{{ outputs.make_bundle.outputFiles['expected-refs.txt'] }}"
      verify.sh: |
        #!/bin/sh
        set -eu
        export LC_ALL=C

        RECOVERY_DIR=$(mktemp -d)
        trap 'rm -rf "$RECOVERY_DIR"' EXIT

        STATUS=PASS
        REASON=OK
        ACTUAL=$(sha256sum backup.bundle | cut -d' ' -f1)

        if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
          STATUS=BLOCK
          REASON=DIGEST_MISMATCH
        elif ! git clone --quiet --mirror backup.bundle "$RECOVERY_DIR/recovered.git" >/dev/null 2>&1; then
          STATUS=BLOCK
          REASON=BUNDLE_UNREADABLE
        else
          git -C "$RECOVERY_DIR/recovered.git" for-each-ref --format='%(refname) %(objectname)' | sort > recovered-refs.txt
          if ! cmp -s expected-refs.txt recovered-refs.txt; then
            STATUS=BLOCK
            REASON=REF_MISMATCH
          fi
        fi

        printf '{"verdict":"%s","reason":"%s","expected_sha256":"%s","actual_sha256":"%s"}\n' \
          "$STATUS" "$REASON" "$EXPECTED_SHA256" "$ACTUAL" > verification.json
        printf '::{"outputs":{"verdict":"%s","reason":"%s"}}::\n' "$STATUS" "$REASON"
    beforeCommands:
      - apk add --no-cache git
    commands:
      - sh verify.sh
    outputFiles:
      - verification.json
    timeout: PT30M

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.verify_roundtrip.vars.verdict == 'PASS' }}"
    then:
      - id: publish_ref_inventory
        type: io.kestra.plugin.aws.s3.Upload
        description: Store source ref names and object IDs beside the verified bundle.
        bucket: "{{ inputs.bucket }}"
        region: "{{ inputs.region }}"
        key: git-mirrors/{{ inputs.owner }}/{{ inputs.repository }}/{{ execution.id }}/expected-refs.txt
        from: "{{ outputs.make_bundle.outputFiles['expected-refs.txt'] }}"
      - id: commit_manifest
        type: io.kestra.plugin.aws.s3.Upload
        description: Publish the manifest last. Its existence marks a verified backup.
        bucket: "{{ inputs.bucket }}"
        region: "{{ inputs.region }}"
        key: git-mirrors/{{ inputs.owner }}/{{ inputs.repository }}/{{ execution.id }}/manifest.json
        from: "{{ outputs.make_bundle.outputFiles['manifest.json'] }}"
      - id: backup_completed
        type: io.kestra.plugin.core.log.Log
        message: "Verified {{ outputs.make_bundle.vars.ref_count }} Git refs. SHA-256 {{ outputs.make_bundle.vars.sha256 }}. Manifest s3://{{ outputs.commit_manifest.bucket }}/{{ outputs.commit_manifest.key }}"
    else:
      - id: block_unrestorable_backup
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Read-back validation failed: {{ outputs.verify_roundtrip.vars.reason }}. No manifest was published."

extend:
  title: Back up GitHub repository history to S3 with a tested Git bundle
  metaTitle: Verified Git Repository Mirror Backup to S3 with Kestra
  shortDescription: Mirror a public GitHub repository to S3, recover its Git bundle, and compare every ref before publishing a verified manifest.
  metaDescription: Back up GitHub refs to S3 with a Git bundle. Download, restore, and compare refs before publishing a verified manifest.
  description: |
    Keep an independent copy of a public GitHub repository's fetched refs and
    reachable objects in S3. Upload success alone cannot prove recoverability.
    The flow restores the uploaded Git bundle and verifies its contents before
    publishing a completion manifest.

    ## How it works

    1. Clone the public repository with --mirror and inventory every fetched
       ref name and object ID.
    2. Create and verify a Git bundle. Record its SHA-256, size, and ref count.
    3. Upload the bundle to an execution-specific S3 prefix and download it.
    4. Verify the downloaded checksum, restore it into a new bare repository,
       and compare every restored ref name and object ID with the inventory.
    5. Publish the ref inventory and manifest only after verification passes.
       If verification fails, the flow fails and publishes no manifest.

    ## What you get

    - An S3 backup.bundle containing fetched Git history and reachable objects.
    - An expected-refs.txt inventory of backed-up ref names and object IDs.
    - A manifest.json with repository, execution ID, SHA-256, byte size, and
      ref count. Its presence indicates the read-back verification succeeded.
    - A verification.json output recording PASS or BLOCK and a reason.
    - Outputs at outputs.make_bundle, outputs.verify_roundtrip, and
      outputs.commit_manifest for inspection and downstream automation.

    ## Who it's for

    - Platform engineers keeping independent, recoverable Git history copies.
    - Teams checking backup integrity before trusting an S3 archive.
    - Operators who need a repeatable recovery drill for public repositories.

    ## Why orchestrate this with Kestra

    - Kestra sequences clone, upload, download, restore, and validation tasks.
    - Each execution uses an isolated S3 prefix, making backups auditable.
    - A failed verification blocks manifest publication, instead of marking
      an unusable upload as completed.
    - Enable the included disabled schedule after a successful restore drill.

    ## Prerequisites

    - A Kestra worker with Docker and the Scripts Shell and AWS S3 plugins.
    - Network access to github.com and Alpine package repositories.
    - An existing S3 bucket in the specified Region. Grant the worker
      s3:PutObject and s3:GetObject on the git-mirrors prefix.
    - Sufficient worker disk space for clone, bundle, and restored copy.
    - Read-only Git access is sufficient; no source repository is modified.

    ### Secrets

    - GIT_MIRROR_S3_BUCKET: S3 bucket name used by scheduled executions.
      Manual executions can pass the bucket input directly.
    - Use your Kestra worker's IAM role for S3 authorization; the flow
      does not require AWS access keys in inputs or scripts.

    ## Quick start

    1. Enter a public GitHub owner, repository, bucket, and Region.
    2. Run manually, then inspect verification.json for a PASS verdict.
    3. Confirm the execution-specific S3 prefix has backup.bundle,
       expected-refs.txt, and manifest.json.
    4. Download backup.bundle and run:
       git clone --mirror backup.bundle restored.git
    5. Compare refs with expected-refs.txt and perform a recovery drill.
       Set GIT_MIRROR_S3_BUCKET and enable the schedule only afterward.

    ## How to extend

    - Add alerts for failed executions and missing expected manifests.
    - Apply S3 encryption, least-privilege access, versioning, and retention.
    - Add lifecycle rules and periodic restore drills for older bundles.
    - A bundle does not contain Git LFS objects, issues, comments, releases,
      wikis, or refs the clone endpoint does not advertise. Back these up
      separately if needed.
    - A fetched clone is a snapshot, not a transactionally consistent
      GitHub export. The size limit is checked after bundle creation.

    ## Links

    - https://git-scm.com/docs/git-bundle
    - https://kestra.io/plugins/plugin-script-shell
    - https://kestra.io/plugins/plugin-aws
    - Created by [vivekyarra](https://github.com/vivekyarra).

  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - AWS Services
  ee: false
  demo: false
