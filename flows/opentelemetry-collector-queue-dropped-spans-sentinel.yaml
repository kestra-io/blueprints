id: opentelemetry-collector-queue-dropped-spans-sentinel
namespace: company.observability
description: Monitors OpenTelemetry Collector exporter queues for buffer saturation and dropped telemetry spans.

inputs:
  - id: otel_collector_metrics_url
    type: STRING
    defaults: "http://otel-collector.observability:8888/metrics"
    description: Prometheus scrape endpoint URL for OpenTelemetry Collector internal metrics.
  - id: dropped_spans_threshold
    type: INT
    defaults: 0
    description: "Maximum allowable dropped spans in sampling interval (default 0)."

tasks:
  - id: scrape_otel_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.otel_collector_metrics_url }}"
    script: |
      import os
      import sys
      import re
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://otel-collector.observability:8888/metrics")

      try:
          resp = requests.get(metrics_url, timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()
      except Exception as err:
          print(f"Error scraping OTel metrics: {err}", file=sys.stderr)
          sys.exit(1)

      dropped_spans = 0
      for line in lines:
          if line.startswith("#") or not line.strip():
              continue
          if "otelcol_exporter_enqueue_failed_spans" in line or "otelcol_exporter_send_failed_spans" in line:
              match = re.search(r'([0-9\.]+)\s*$', line)
              if match:
                  dropped_spans += int(float(match.group(1)))

      print(f"Scraped dropped spans: {dropped_spans}")
      Kestra.outputs({"dropped_spans": dropped_spans})

  - id: evaluate_dropped_spans
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scrape_otel_metrics.vars.dropped_spans > inputs.dropped_spans_threshold }}"
    then:
      - id: notify_observability_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#observability-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 OpenTelemetry Collector Dropped Spans Alert",
                "text": "OpenTelemetry Collector at `{{ inputs.otel_collector_metrics_url }}` recorded *{{ outputs.scrape_otel_metrics.vars.dropped_spans }} dropped/failed spans*! Downstream trace storage or export backends are rejecting batches or exporter memory queues are saturated.",
                "footer": "Kestra Observability Sentinel • OpenTelemetry"
              }
            ]
          }

outputs:
  - id: dropped_spans
    type: INT
    value: "{{ outputs.scrape_otel_metrics.vars.dropped_spans }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#observability-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ OpenTelemetry Collector Sentinel Failure",
            "text": "Failed to scrape metrics endpoint from OpenTelemetry Collector. Verify network connectivity and collector health.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  metaDescription: Monitors OpenTelemetry Collector exporter queues for buffer saturation and dropped telemetry spans.
  metaTitle: OpenTelemetry Collector Exporter Buffer Queue Dropped Spans Sentinel with Kestra
  title: OpenTelemetry Collector Exporter Buffer Queue Dropped Spans Sentinel
  shortDescription: Monitors OpenTelemetry Collector exporter queues for buffer saturation and dropped telemetry spans.
  description: |
    ## How it works
    This workflow connects directly to the OpenTelemetry Collector's internal Prometheus metrics port (default `:8888/metrics`) via containerized Python probes to monitor exporter queue health. When downstream observability platforms (such as Jaeger, Tempo, Datadog, or Honeycomb) throttle traffic or suffer rate limits, the OpenTelemetry Collector's internal buffer fills up, causing `otelcol_exporter_enqueue_failed_spans` to increment and silently discarding distributed trace telemetry. This blueprint extracts cumulative dropped span metrics and raises alerts before trace data loss impacts incident response.

    ## What you get
    - Real-time detection of telemetry loss in distributed tracing infrastructure.
    - Prevents silent drop of critical application traces during traffic surges.
    - Actionable visibility into OpenTelemetry Collector queue saturation.

    ## Who it's for
    - Site Reliability Engineers and Platform Engineers maintaining OpenTelemetry pipelines.
    - Observability Engineers operating tracing infrastructure at scale.

    ## Why orchestrate this with Kestra
    - **Agentless Metric Inspection**: Queries HTTP endpoints directly without requiring extra daemonsets.
    - **Cross-Service Alerting**: Integrates seamlessly with Slack for instant incident escalation.
    - **Standardized Health Checks**: Enforce uniform observability pipeline health monitoring across hybrid environments.

    ## Prerequisites
    - OpenTelemetry Collector running with internal telemetry enabled (`telemetry.metrics.address: 0.0.0.0:8888`).
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Provide your collector internal metrics URL.
    3. Run the workflow to inspect current dropped span metrics.

    ## Links
    - [OpenTelemetry Collector Internal Telemetry](https://opentelemetry.io/docs/collector/internal-telemetry/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Realtime & Streaming
    - Monitoring & Alerting
  ee: false
  demo: false
