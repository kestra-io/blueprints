id: redis-blocked-clients-pubsub-blpop-sentinel
namespace: company.database

inputs:
  - id: redis_host
    type: STRING
    defaults: "redis.internal"
    description: Redis server hostname or IP address.
  - id: redis_port
    type: INT
    defaults: 6379
    description: Redis server port.
  - id: blocked_client_threshold
    type: INT
    defaults: 50
    description: Maximum acceptable count of blocked clients (BLPOP, BRPOP, XREADGROUP).

tasks:
  - id: query_blocked_clients
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install redis kestra
    env:
      REDIS_HOST: "{{ inputs.redis_host }}"
      REDIS_PORT: "{{ inputs.redis_port }}"
      REDIS_PASSWORD: "{{ secret('REDIS_PASSWORD') }}"
    script: |
      import os
      import sys
      import redis
      from kestra import Kestra

      host = os.environ.get("REDIS_HOST", "redis.internal")
      port = int(os.environ.get("REDIS_PORT", "6379"))
      password = os.environ.get("REDIS_PASSWORD") or None

      try:
          r = redis.Redis(host=host, port=port, password=password, socket_connect_timeout=10, socket_timeout=10)
          info = r.info("clients")
      except Exception as e:
          print(f"Error connecting or querying Redis at {host}:{port}: {e}", file=sys.stderr)
          sys.exit(1)

      blocked_count = int(info.get("blocked_clients", 0))
      print(f"Redis blocked clients: {blocked_count}")
      Kestra.outputs({
          "blocked_count": blocked_count
      })

  - id: evaluate_blocked_clients
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_blocked_clients.vars.blocked_count | int > inputs.blocked_client_threshold }}"
    then:
      - id: notify_infrastructure_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Redis Blocked Clients Spike Alert (Queue Starvation)",
                "text": "Redis instance `{{ inputs.redis_host }}:{{ inputs.redis_port }}` has *{{ outputs.query_blocked_clients.vars.blocked_count }}* blocked clients waiting on commands (threshold: {{ inputs.blocked_client_threshold }}). Impact: Worker threads are hung waiting on empty queues (BLPOP/BRPOP) or stuck consumer groups, exhausting application connection pool capacity.",
                "footer": "Kestra In-Memory Sentinel • Redis Blocked Clients"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Redis Blocked Clients Sentinel Failed",
            "text": "The Redis blocked clients query workflow failed. Please verify Redis connectivity and authentication credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: blocked_count
    type: INT
    value: "{{ outputs.query_blocked_clients.vars.blocked_count }}"

extend:
  metaDescription: "Audits Redis server telemetry to detect blocked client spikes and queue consumer starvation across background workers."
  metaTitle: Redis Blocked Clients Queue Starvation and Connection Pool Sentinel with Kestra
  title: Redis Blocked Clients Queue Starvation and Connection Pool Sentinel
  shortDescription: Audits Redis server telemetry to detect blocked client spikes and queue consumer starvation across background workers.
  description: |
    ## How it works
    This workflow connects to the target Redis instance using official `redis-cli` in a containerized environment to sample `info clients`. It inspects `blocked_clients`, which measures client connections waiting in blocking primitives such as `BLPOP`, `BRPOP`, `BRPOPLPUSH`, or `XREADGROUP BLOCK`. When worker processes pile up waiting on unfulfilled work queues, connection pools exhaust. When blocked clients exceed the threshold, an automated Slack alert is dispatched.

    ## What you get
    - Immediate detection of upstream task producer outages stalling background worker pools.
    - Prevents cascading exhaustion of Redis client connections.
    - Fast visibility into queue health across distributed job processing architectures.

    ## Who it's for
    - SREs and Backend Engineers operating Redis-backed task queues (Celery, BullMQ, Sidekiq).
    - Platform teams ensuring health of in-memory messaging and pub/sub pipelines.

    ## Why orchestrate this with Kestra
    - **Automated Sampling**: Schedule non-intrusive metadata sampling at regular intervals.
    - **Containerized CLI**: Runs official Redis client binaries inside secure containers without local dependencies.
    - **Direct Alerting**: Route actionable diagnostics directly to on-call infrastructure channels.

    ## Prerequisites
    - Network connectivity to the target Redis instance.
    - Secrets `REDIS_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure Redis host, port, and password secret.
    3. Run the workflow to inspect current blocked client counts.

    ## How to extend
    - Query `redis-cli client list` to identify client IP addresses and blocking commands.
    - Trigger automated scaling of worker consumers when queues fill up.

    ## Links
    - [Redis INFO Clients Documentation](https://redis.io/docs/latest/commands/info/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
