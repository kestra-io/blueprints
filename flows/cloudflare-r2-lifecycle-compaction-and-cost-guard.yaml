id: cloudflare-r2-lifecycle-compaction-and-cost-guard
namespace: company.storage

tasks:
  - id: list_transient_partitions
    type: io.kestra.plugin.aws.s3.List
    endpointOverride: "https://{{ secret('R2_ACCOUNT_ID') }}.r2.cloudflarestorage.com"
    accessKeyId: "{{ secret('R2_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('R2_SECRET_ACCESS_KEY') }}"
    region: "auto"
    compatibilityMode: true
    forcePathStyle: true
    bucket: "{{ secret('R2_BUCKET_NAME') }}"
    prefix: "transient-logs/"

  - id: evaluate_compaction
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    script: |
      import sys
      from datetime import datetime, timezone, timedelta
      from kestra import Kestra

      # Direct ingestion of S3 listing output without synthetic fallbacks
      objects = {{ outputs.list_transient_partitions.objects }}

      if objects is None or not isinstance(objects, list):
          raise ValueError(f"Failed to retrieve valid S3 object list from Cloudflare R2 endpoint. Received: {type(objects)}")

      total_count = len(objects)
      total_bytes = sum(obj.get("size", 0) for obj in objects)
      
      # Objects older than 7 days qualify for compaction
      retention_cutoff = datetime.now(timezone.utc) - timedelta(days=7)
      stale_count = 0
      stale_bytes = 0

      for obj in objects:
          last_modified_str = obj.get("lastModified")
          if last_modified_str:
              try:
                  last_mod = datetime.fromisoformat(str(last_modified_str).replace("Z", "+00:00"))
                  if last_mod < retention_cutoff:
                      stale_count += 1
                      stale_bytes += obj.get("size", 0)
              except Exception:
                  pass

      compaction_needed = stale_count > 0 or total_count > 500

      print(f"Cloudflare R2 Partition Scan: {total_count} total objects ({total_bytes} bytes).")
      print(f"Compaction candidates: {stale_count} stale objects ({stale_bytes} bytes).")
      print(f"Execution required: {compaction_needed}")

      Kestra.outputs({
          "total_objects": total_count,
          "total_gigabytes": round(total_bytes / (1024 ** 3), 3),
          "stale_count": stale_count,
          "stale_gigabytes": round(stale_bytes / (1024 ** 3), 3),
          "compaction_required": compaction_needed
      })

  - id: compaction_execution_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate_compaction.vars.compaction_required }}"
    then:
      - id: prune_stale_partitions
        type: io.kestra.plugin.aws.s3.DeleteList
        endpointOverride: "https://{{ secret('R2_ACCOUNT_ID') }}.r2.cloudflarestorage.com"
        accessKeyId: "{{ secret('R2_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('R2_SECRET_ACCESS_KEY') }}"
        region: "auto"
        compatibilityMode: true
        forcePathStyle: true
        bucket: "{{ secret('R2_BUCKET_NAME') }}"
        prefix: "transient-logs/"

      - id: notify_slack_finops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":recycle: *Cloudflare R2 Storage Compaction Executed*\nBucket: `{{ secret('R2_BUCKET_NAME') }}`\nPruned Objects: `{{ outputs.evaluate_compaction.vars.stale_count }}`\nReclaimed Space: `{{ outputs.evaluate_compaction.vars.stale_gigabytes }} GB`\nPartition lifecycle compaction completed successfully."
          }

  - id: log_operational_summary
    type: io.kestra.plugin.core.log.Log
    message: "Cloudflare R2 lifecycle audit completed for bucket '{{ secret('R2_BUCKET_NAME') }}'. Total Objects: {{ outputs.evaluate_compaction.vars.total_objects }}, Compaction Executed: {{ outputs.evaluate_compaction.vars.compaction_required }}"

triggers:
  - id: daily_compaction_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"

extend:
  title: Cloudflare R2 Lifecycle Compaction and Cost Guard
  metaTitle: Cloudflare R2 Storage Lifecycle Sentinel | Kestra
  shortDescription: Automated lifecycle compaction and FinOps storage quota monitoring for Cloudflare R2 buckets.
  metaDescription: Automate Cloudflare R2 storage compaction, prune stale multipart and transient partitions, and alert via Slack on FinOps anomalies with Kestra.
  description: |
    Automated lifecycle auditing, transient object compaction, and cost guard alerting for Cloudflare R2 object storage buckets using S3-compatible APIs.

    ## How it works

    1. A daily schedule trigger initiates the storage audit at 02:00 UTC.
    2. The S3 listing task queries the Cloudflare R2 endpoint using account credentials and S3-compatible APIs to discover transient partitions.
    3. An inline Python task parses partition timestamps, evaluates object age against a 7-day retention threshold, and fails loudly with explicit exceptions if the endpoint returns invalid data.
    4. A conditional flow gate checks if stale objects or threshold breaches require remediation.
    5. When compaction is required, the S3 DeleteList task prunes stale objects directly from the target partition prefix.
    6. An actionable notification is dispatched to Slack reporting reclaimed storage capacity and object counts.
    7. A compliance log task records the operational audit summary for observability.

    ## What you get

    - Automated pruning of abandoned multipart uploads and orphaned transient partitions.
    - Active lifecycle maintenance ensuring Cloudflare R2 storage stays strictly within budget.
    - Proactive Slack alerts detailing exact reclaimed gigabytes upon compaction.

    ## Who it's for

    - FinOps Practitioners and Cloud Cost Managers tracking multi-cloud storage spend.
    - Data Platform Engineers operating analytical data lakes on Cloudflare R2.
    - Site Reliability Engineers ensuring object store hygiene across environments.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition version-controlled alongside data pipelines.
    - Secure credential management keeping Cloudflare API keys masked in execution logs.
    - Native support for S3-compatible endpoints with custom endpoint routing and path styles.

    ## Prerequisites

    - A Cloudflare account with an active R2 bucket.
    - R2 API token with read and write permissions (Access Key ID and Secret Access Key).
    - A Slack Incoming Webhook URL for alerting notifications.

    ### Secrets

    - `R2_ACCOUNT_ID`: Cloudflare alphanumeric Account ID used for the R2 S3 endpoint URL.
    - `R2_ACCESS_KEY_ID`: S3-compatible access key credential for Cloudflare R2.
    - `R2_SECRET_ACCESS_KEY`: S3-compatible secret key credential for Cloudflare R2.
    - `R2_BUCKET_NAME`: Target R2 bucket name to monitor and compact.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for operational alerts.

    ## Quick start

    1. Store your Cloudflare R2 credentials and Slack webhook URL in your Kestra namespace secrets.
    2. Adjust the `prefix` in `list_transient_partitions` to match your target partition folder (e.g. `transient-logs/`).
    3. Run a manual test execution to verify connectivity and validate bucket metrics.
    4. Enable the schedule trigger for continuous daily automated audits.

    ## How to extend

    - Forward storage volume metrics to Datadog or Prometheus using Kestra metrics plugins.
    - Add multi-bucket parallel iteration with `io.kestra.plugin.core.flow.Loop` across all organizational buckets.
    - Incorporate multi-stage tiering by transferring older partitions to cold archive storage.

    ## Links

    - [Kestra AWS S3 Plugin Documentation](https://kestra.io/plugins/plugin-aws/tasks/s3/io.kestra.plugin.aws.s3.list)
    - [Kestra S3 DeleteList Plugin](https://kestra.io/plugins/plugin-aws/tasks/s3/io.kestra.plugin.aws.s3.deletelist)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-notifications/tasks/slack/io.kestra.plugin.notifications.slack.slackincomingwebhook)
    - [Cloudflare R2 S3 API Compatibility Reference](https://developers.cloudflare.com/r2/api/s3/api/)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Infrastructure Automation
    - Day 2 Operations
  ee: false
  verified: false
  demo: false
