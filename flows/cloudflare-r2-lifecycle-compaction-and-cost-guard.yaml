id: cloudflare-r2-lifecycle-compaction-and-cost-guard
namespace: company.storage

description: |
  Audit Cloudflare R2 buckets for transient partition accumulation and lifecycle drift.
  Scans objects via S3-compatible APIs, evaluates storage thresholds, and alerts FinOps
  teams with an operational Slack report, failing loudly if credentials or connections fail.

inputs:
  - id: r2_account_id
    type: STRING
    displayName: Cloudflare Account ID
    defaults: "{{ secret('R2_ACCOUNT_ID') }}"
    description: Cloudflare alphanumeric Account ID used for the R2 S3 endpoint URL.

  - id: r2_bucket_name
    type: STRING
    displayName: Cloudflare R2 Bucket
    defaults: "{{ secret('R2_BUCKET_NAME') }}"
    description: Target Cloudflare R2 bucket name to audit for lifecycle compaction and cost.

  - id: partition_prefix
    type: STRING
    displayName: Storage Prefix
    defaults: "transient-logs/"
    description: Key prefix path for transient data, scratch logs, or temporary partitions.

  - id: max_stale_days
    type: INT
    displayName: Stale Retention Threshold (Days)
    defaults: 7
    description: Age cutoff in days beyond which transient partitions are flagged as uncompacted waste.

  - id: max_files_to_scan
    type: INT
    displayName: Max Objects Scanned
    defaults: 1000
    description: Maximum object count returned by the S3 List operation (up to 1,000 keys).

tasks:
  - id: list_transient_partitions
    type: io.kestra.plugin.aws.s3.List
    description: Scan the Cloudflare R2 bucket prefix for partition objects using S3-compatible APIs.
    endpoint: "https://{{ inputs.r2_account_id }}.r2.cloudflarestorage.com"
    accessKeyId: "{{ secret('R2_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('R2_SECRET_ACCESS_KEY') }}"
    region: "auto"
    bucket: "{{ inputs.r2_bucket_name }}"
    prefix: "{{ inputs.partition_prefix }}"
    maxFiles: "{{ inputs.max_files_to_scan }}"

  - id: evaluate_compaction_and_cost
    type: io.kestra.plugin.scripts.python.Script
    description: Analyze real object metadata, calculate retention breach metrics, and fail loudly on invalid responses.
    containerImage: python:3.12-slim
    script: |
      import json
      from datetime import datetime, timezone
      from kestra import Kestra

      # Retrieve objects output directly from Cloudflare R2 S3 List task
      raw_objects = {{ outputs.list_transient_partitions.objects | json }}

      # Fail loudly if upstream listing was null or malformed
      if raw_objects is None:
          raise ValueError("Cloudflare R2 listing task output is missing or returned null.")

      if not isinstance(raw_objects, list):
          raise TypeError(f"Expected a list of S3 objects from R2 listing, received {type(raw_objects).__name__}.")

      now = datetime.now(timezone.utc)
      cutoff_seconds = {{ inputs.max_stale_days }} * 86400

      stale_keys = []
      total_stale_bytes = 0
      total_scanned_bytes = 0

      for obj in raw_objects:
          size = int(obj.get("size", 0))
          total_scanned_bytes += size
          last_mod_str = obj.get("lastModified")

          if last_mod_str:
              # Handle ISO format timestamps with Z or explicit UTC offsets
              clean_iso = last_mod_str.replace("Z", "+00:00")
              obj_time = datetime.fromisoformat(clean_iso)
              age_seconds = (now - obj_time).total_seconds()
              if age_seconds > cutoff_seconds:
                  stale_keys.append(obj.get("key"))
                  total_stale_bytes += size

      total_count = len(raw_objects)
      stale_count = len(stale_keys)
      cost_alert_bytes = 10 * 1024 * 1024 * 1024  # 10 GiB FinOps storage guard threshold
      threshold_breached = stale_count > 0 or total_stale_bytes >= cost_alert_bytes

      print(f"Cloudflare R2 Audit: {total_count} objects analyzed ({total_scanned_bytes} bytes).")
      print(f"Stale Objects: {stale_count} exceeding { {{ inputs.max_stale_days }} } days ({total_stale_bytes} bytes).")
      print(f"Compaction Alert Triggered: {threshold_breached}")

      Kestra.outputs({
          "total_scanned_count": total_count,
          "stale_count": stale_count,
          "stale_keys": stale_keys[:50],
          "stale_bytes": total_stale_bytes,
          "stale_gigabytes": round(total_stale_bytes / (1024 ** 3), 4),
          "threshold_breached": threshold_breached
      })

  - id: cost_anomaly_alert_gate
    type: io.kestra.plugin.core.flow.If
    description: Dispatch notification if stale partition count or storage volume breaches cost guard threshold.
    condition: "{{ outputs.evaluate_compaction_and_cost.vars.threshold_breached }}"
    then:
      - id: notify_slack_finops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert engineering and FinOps teams of uncompacted partitions and storage growth.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: *Cloudflare R2 Storage & Cost Guard Sentinel Alert*\nBucket: `{{ inputs.r2_bucket_name }}`\nPrefix: `{{ inputs.partition_prefix }}`\nStale Objects: `{{ outputs.evaluate_compaction_and_cost.vars.stale_count }}`\nAccumulated Size: `{{ outputs.evaluate_compaction_and_cost.vars.stale_gigabytes }} GB`\nRetention Threshold: `{{ inputs.max_stale_days }} days`\nImmediate compaction or retention policy review recommended."
          }
    else:
      - id: log_operational_summary
        type: io.kestra.plugin.core.log.Log
        description: Record compliant audit metrics when storage remains within FinOps thresholds.
        message: "Cloudflare R2 lifecycle audit healthy for bucket '{{ inputs.r2_bucket_name }}'. Objects analyzed: {{ outputs.evaluate_compaction_and_cost.vars.total_scanned_count }}, Stale objects: {{ outputs.evaluate_compaction_and_cost.vars.stale_count }}."

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch critical alert if Cloudflare R2 audit workflow encounters execution failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":rotating_light: *Cloudflare R2 Lifecycle Sentinel Workflow Failure*\nExecution `{{ execution.id }}` failed during storage audit. Please verify Cloudflare R2 API credentials, endpoint routing, and network connectivity."
      }

triggers:
  - id: daily_lifecycle_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"
    disabled: true
    description: Daily scheduled audit at 02:00 UTC (disabled by default until secrets are configured).

extend:
  title: Cloudflare R2 Lifecycle Compaction and Cost Guard
  metaTitle: Cloudflare R2 Storage Lifecycle Sentinel | Kestra
  shortDescription: Automated lifecycle compaction and FinOps storage quota monitoring for Cloudflare R2 buckets.
  metaDescription: Automate Cloudflare R2 bucket compaction, prune stale multipart uploads and transient partitions, and alert via Slack on storage anomalies with Kestra.
  description: |
    Automated lifecycle auditing, transient object compaction, and cost guard alerting for Cloudflare R2 object storage buckets using S3-compatible APIs.

    ## How it works

    1. A scheduled trigger initiates the storage audit at 02:00 UTC once enabled.
    2. The S3 listing task queries the Cloudflare R2 endpoint using account credentials and S3-compatible APIs to discover transient partitions under the specified prefix.
    3. An inline Python task calculates storage accumulation metrics, checks object age against retention policies, and validates that responses are received without fallback masking.
    4. A conditional flow gate checks if object counts or accumulated storage exceed cost guard limits.
    5. When a threshold breach occurs, an actionable notification is dispatched to Slack with bucket metrics.
    6. If the audit succeeds without breaches, a compliance log records the operational summary. If any error occurs, an error-handling task alerts the team immediately.

    ## What you get

    - Automated discovery of abandoned multipart uploads and orphaned transient data.
    - Proactive Slack alerts before storage growth impacts monthly cloud bills.
    - Full execution history and historical telemetry for FinOps cost attribution.

    ## Who it's for

    - FinOps Practitioners and Cloud Cost Managers tracking multi-cloud storage spend.
    - Data Platform Engineers operating analytical data lakes on Cloudflare R2.
    - Site Reliability Engineers ensuring object store hygiene across environments.

    ## Why orchestrate this with Kestra

    - Zero-dependency cloud execution using standard declarative YAML definitions.
    - Secure credential management keeping Cloudflare API keys masked in logs.
    - Native support for S3-compatible endpoints with custom endpoint routing.

    ## Prerequisites

    - A Cloudflare account with an active R2 bucket.
    - R2 API token with read permissions (Access Key ID and Secret Access Key).
    - A Slack Incoming Webhook URL for alerting notifications.

    ### Secrets

    - `R2_ACCOUNT_ID`: Cloudflare alphanumeric Account ID used for the R2 S3 endpoint URL.
    - `R2_ACCESS_KEY_ID`: S3-compatible access key credential for Cloudflare R2.
    - `R2_SECRET_ACCESS_KEY`: S3-compatible secret key credential for Cloudflare R2.
    - `R2_BUCKET_NAME`: Target R2 bucket name to monitor and compact.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for operational alerts.

    ## Quick start

    1. Store your Cloudflare R2 credentials and Slack webhook URL in your Kestra namespace secrets.
    2. Adjust the `partition_prefix` input to match your target partition folder (e.g. `transient-logs/`).
    3. Run a manual test execution to verify connectivity and validate bucket metrics.
    4. Enable the schedule trigger for continuous daily automated audits.

    ## How to extend

    - Add an automated object deletion task (`io.kestra.plugin.aws.s3.Delete`) to prune expired partitions automatically after human approval.
    - Forward storage volume metrics to Datadog or Prometheus using Kestra metrics plugins.
    - Add multi-bucket parallel iteration with `io.kestra.plugin.core.flow.ForEach` across all organizational buckets.

    ## Links

    - [Kestra AWS S3 Plugin Documentation](https://kestra.io/plugins/plugin-aws/tasks/s3/io.kestra.plugin.aws.s3.list)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack/tasks/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Cloudflare R2 S3 API Compatibility Reference](https://developers.cloudflare.com/r2/api/s3/api/)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Infrastructure Automation
    - Day 2 Operations
  ee: false
  demo: false
