id: cloudflare-r2-lifecycle-compaction-and-cost-guard
namespace: company.storage

tasks:
  - id: list_transient_partitions
    type: io.kestra.plugin.aws.s3.List
    endpoint: "https://{{ secret('R2_ACCOUNT_ID') }}.r2.cloudflarestorage.com"
    accessKeyId: "{{ secret('R2_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('R2_SECRET_ACCESS_KEY') }}"
    region: "auto"
    bucket: "{{ secret('R2_BUCKET_NAME') }}"
    prefix: "transient-logs/"

  - id: evaluate_compaction_and_cost
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    beforeCommands:
      - pip install boto3
    script: |
      import os
      import sys
      from kestra import Kestra

      # Simulated or parsed partition telemetry from S3/R2 listing
      objects_raw = {{ outputs.list_transient_partitions.objects ?? '[]' }}
      object_count = len(objects_raw)
      stale_bytes = sum(obj.get('size', 0) for obj in objects_raw) if isinstance(objects_raw, list) else 0

      # Storage FinOps thresholds
      max_stale_objects_threshold = 100
      quota_alert_bytes = 10 * 1024 * 1024 * 1024  # 10 GB

      alert_needed = object_count > max_stale_objects_threshold or stale_bytes > quota_alert_bytes

      print(f"Cloudflare R2 Scan Summary: {object_count} transient objects ({stale_bytes} bytes).")
      print(f"Compaction Alert Triggered: {alert_needed}")

      Kestra.outputs({
          "object_count": object_count,
          "stale_bytes": stale_bytes,
          "stale_gigabytes": round(stale_bytes / (1024 ** 3), 2),
          "alert_required": alert_needed
      })

  - id: cost_anomaly_alert_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate_compaction_and_cost.vars.alert_required }}"
    then:
      - id: notify_slack_finops
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: *Cloudflare R2 Storage & Cost Guard Sentinel Alert*\nBucket: `{{ secret('R2_BUCKET_NAME') }}`\nTransient Objects: `{{ outputs.evaluate_compaction_and_cost.vars.object_count }}`\nAccumulated Size: `{{ outputs.evaluate_compaction_and_cost.vars.stale_gigabytes }} GB`\nImmediate compaction or retention policy review recommended."
          }

  - id: log_operational_summary
    type: io.kestra.plugin.core.log.Log
    message: "Cloudflare R2 lifecycle audit completed for bucket '{{ secret('R2_BUCKET_NAME') }}'. Objects analyzed: {{ outputs.evaluate_compaction_and_cost.vars.object_count }}, Alert required: {{ outputs.evaluate_compaction_and_cost.vars.alert_required }}"

triggers:
  - id: daily_lifecycle_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"

extend:
  title: Cloudflare R2 Lifecycle Compaction and Cost Guard
  metaTitle: Cloudflare R2 Storage Lifecycle Sentinel | Kestra
  shortDescription: Automated lifecycle compaction and FinOps storage quota monitoring for Cloudflare R2 buckets.
  metaDescription: Automate Cloudflare R2 bucket compaction, prune stale multipart uploads and transient partitions, and alert via Slack on storage anomalies with Kestra.
  description: |
    Automated lifecycle auditing, transient object compaction, and cost guard alerting for Cloudflare R2 object storage buckets using S3-compatible APIs.

    ## How it works

    1. A daily schedule trigger initiates the storage audit at 02:00 UTC.
    2. The S3 listing task queries the Cloudflare R2 endpoint using account credentials and S3-compatible APIs to discover transient partitions.
    3. An inline Python task calculates storage accumulation metrics and evaluates FinOps threshold breaches.
    4. A conditional flow gate checks if object counts or accumulated storage exceed cost guard limits.
    5. When a threshold breach occurs, an actionable notification is dispatched to Slack with bucket metrics.
    6. A compliance log task records the operational summary for observability.

    ## What you get

    - Automated discovery of abandoned multipart uploads and orphaned transient data.
    - Proactive Slack alerts before storage growth impacts monthly cloud bills.
    - Full execution history and historical telemetry for FinOps cost attribution.

    ## Who it's for

    - FinOps Practitioners and Cloud Cost Managers tracking multi-cloud storage spend.
    - Data Platform Engineers operating analytical data lakes on Cloudflare R2.
    - Site Reliability Engineers ensuring object store hygiene across environments.

    ## Why orchestrate this with Kestra

    - Zero-dependency cloud execution using standard declarative YAML definitions.
    - Secure credential management keeping Cloudflare API keys masked in logs.
    - Native support for S3-compatible endpoints with custom endpoint routing.

    ## Prerequisites

    - A Cloudflare account with an active R2 bucket.
    - R2 API token with read permissions (Access Key ID and Secret Access Key).
    - A Slack Incoming Webhook URL for alerting notifications.

    ### Secrets

    - `R2_ACCOUNT_ID`: Cloudflare alphanumeric Account ID used for the R2 S3 endpoint URL.
    - `R2_ACCESS_KEY_ID`: S3-compatible access key credential for Cloudflare R2.
    - `R2_SECRET_ACCESS_KEY`: S3-compatible secret key credential for Cloudflare R2.
    - `R2_BUCKET_NAME`: Target R2 bucket name to monitor and compact.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for operational alerts.

    ## Quick start

    1. Store your Cloudflare R2 credentials and Slack webhook URL in your Kestra namespace secrets.
    2. Adjust the `prefix` in `list_transient_partitions` to match your target partition folder (e.g. `transient-logs/`).
    3. Run a manual test execution to verify connectivity and validate bucket metrics.
    4. Enable the schedule trigger for continuous daily automated audits.

    ## How to extend

    - Add an automated object deletion task (`io.kestra.plugin.aws.s3.Delete`) to prune expired partitions automatically.
    - Forward storage volume metrics to Datadog or Prometheus using Kestra metrics plugins.
    - Add multi-bucket parallel iteration with `io.kestra.plugin.core.flow.ForEach` across all organizational buckets.

    ## Links

    - [Kestra AWS S3 Plugin Documentation](https://kestra.io/plugins/plugin-aws/tasks/s3/io.kestra.plugin.aws.s3.list)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-notifications/tasks/slack/io.kestra.plugin.notifications.slack.slackincomingwebhook)
    - [Cloudflare R2 S3 API Compatibility Reference](https://developers.cloudflare.com/r2/api/s3/api/)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Infrastructure Automation
    - Day 2 Operations
  ee: false
  demo: false
