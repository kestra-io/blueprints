
id: datasentinel-csv-quality
namespace: company.datasentinel

description: |
  Clone a public CSV dataset, validate its schema and records,
  quarantine invalid rows, and generate a data-quality report.

inputs:
  - id: run_quality_check
    type: BOOL
    defaults: true

tasks:
  - id: git_ingestion
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Clone and process the public CSV dataset.
    outputFiles:
      - clean.csv
      - quarantine.csv
      - quality-report.json

    tasks:
      - id: clone_dataset
        type: io.kestra.plugin.git.Clone
        description: Clone the official Kestra datasets repository.
        url: https://github.com/kestra-io/datasets.git
        branch: main

      - id: inspect_csv
        type: io.kestra.plugin.scripts.python.Script
        description: Inspect the CSV file and its column names.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          import csv
          from pathlib import Path

          source = Path("csv/orders.csv")
          if not source.is_file():
              raise FileNotFoundError(f"CSV file not found: {source}")

          with source.open(newline="", encoding="utf-8-sig") as f:
              headers = next(csv.reader(f), [])

          if not headers:
              raise ValueError("CSV file has no header row.")

          print("CSV header:", headers)

      - id: validate_csv
        type: io.kestra.plugin.scripts.python.Script
        description: Validate CSV records, quarantine invalid rows, and create a quality report.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        outputFiles:
          - clean.csv
          - quarantine.csv
          - quality-report.json
        script: |
          import csv
          import json
          import math
          from pathlib import Path

          source = Path("csv/orders.csv")
          required = [
              "order_id",
              "customer_name",
              "customer_email",
              "product_id",
              "price",
              "quantity",
              "total"
          ]
          numeric_columns = ("price", "quantity", "total")

          if not source.is_file():
              raise FileNotFoundError(f"CSV file not found: {source}")

          with source.open(newline="", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)
              headers = reader.fieldnames or []
              rows = list(reader)

          if not headers:
              raise ValueError("CSV file has no header row.")

          missing = sorted(set(required) - set(headers))
          clean = []
          quarantine = []
          seen_order_ids = set()

          for line, row in enumerate(rows, start=2):
              errors = []

              if None in row:
                  errors.append("malformed_row:extra_columns")

              for column in missing:
                  errors.append("missing_column:" + column)

              for column in required:
                  if column in headers:
                      value = row.get(column)
                      if value is None or not value.strip():
                          errors.append("required_value_missing:" + column)

              order_id = (row.get("order_id") or "").strip()
              if order_id:
                  if order_id in seen_order_ids:
                      errors.append("duplicate_order_id")
                  seen_order_ids.add(order_id)

              for column in numeric_columns:
                  if column not in headers:
                      continue

                  value = (row.get(column) or "").strip()
                  if not value:
                      continue

                  try:
                      number = float(value)
                      if not math.isfinite(number):
                          errors.append("invalid_" + column)
                      elif number < 0:
                          errors.append("negative_" + column)
                  except ValueError:
                      errors.append("invalid_" + column)

              if errors:
                  quarantine.append({
                      **{k: v for k, v in row.items() if k is not None},
                      "_source_line": line,
                      "_quality_errors": ";".join(sorted(set(errors)))
                  })
              else:
                  clean.append({k: row.get(k) for k in headers})

          with open("clean.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=headers)
              writer.writeheader()
              writer.writerows(clean)

          quarantine_headers = list(dict.fromkeys(
              headers + ["_source_line", "_quality_errors"]
          ))

          with open("quarantine.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=quarantine_headers)
              writer.writeheader()
              writer.writerows(quarantine)

          report = {
              "status": "FAILED" if missing or quarantine else "PASSED",
              "source": str(source),
              "rows_read": len(rows),
              "valid_rows": len(clean),
              "quarantined_rows": len(quarantine),
              "required_columns": required,
              "missing_columns": missing,
              "validation_rules": [
                  "required columns present",
                  "required values non-empty",
                  "numeric values finite and non-negative",
                  "order_id unique"
              ]
          }

          Path("quality-report.json").write_text(
              json.dumps(report, indent=2),
              encoding="utf-8"
          )

          print(json.dumps(report, indent=2))
          print("Data quality validation completed.")
          print('::{"outputs":{"quality_status":"' + report["status"] + '"}}::')

  - id: quality_gate
    type: io.kestra.plugin.core.flow.If
    description: Select the quality-review branch using the input.
    condition: "{{ inputs.run_quality_check }}"
    then:
      - id: quality_check_enabled
        type: io.kestra.plugin.core.log.Log
        message: "DataSentinel quality review enabled. Inspect quality-report.json and quarantine.csv."
    else:
      - id: quality_check_skipped
        type: io.kestra.plugin.core.log.Log
        message: "DataSentinel quality review skipped by input."

extend:
  title: "DataSentinel — CSV Data Quality and Quarantine"
  metaTitle: "DataSentinel CSV Quality Pipeline | Kestra"
  shortDescription: "Validate CSV datasets, quarantine invalid records, and generate a machine-readable data-quality report using Kestra."
  metaDescription: "Automate CSV schema and record validation with Kestra, quarantined rows, clean output, and a JSON data-quality report."
  description: |
    DataSentinel is a reusable CSV quality pipeline for teams that need to detect malformed or incomplete records before downstream processing. It clones a public dataset, inspects its schema, validates records, separates invalid rows, and creates a JSON report.

    ## How it works

    1. A daily schedule triggers the flow at 08:00. Users can also execute it manually.
    2. The Git Clone plugin retrieves the public Kestra datasets repository.
    3. A Python task inspects the CSV header and fails if the file or header is missing.
    4. The validator checks required columns and values, duplicate order IDs, and numeric values that are invalid, non-finite, or negative.
    5. Valid rows are written to clean.csv; invalid rows are written to quarantine.csv with source-line numbers and quality errors. A JSON report summarizes the results.
    6. An If flowable selects the quality-review log branch according to the run_quality_check input.

    ## What you get

    - clean.csv containing records that pass validation.
    - quarantine.csv containing rejected records and their quality errors.
    - quality-report.json with row counts, missing columns, validation rules, and overall status.
    - A scheduled execution and a configurable quality-review branch.
    - Execution logs and task-level failure visibility when source access or validation fails.

    ## Who it's for

    - Data engineers building ingestion pipelines.
    - Analytics engineers preparing reliable datasets.
    - Platform teams adding repeatable data-quality checks before downstream jobs.

    ## Why orchestrate this with Kestra

    Kestra makes ingestion, validation, scheduling, and review steps visible in one execution graph. Task states and logs help identify failures, while the flow can be extended without hiding the entire process inside one standalone script.

    ## Prerequisites

    - Kestra 2.0 or compatible version.
    - Python Script plugin with a Process task runner.
    - Git plugin available to the Kestra worker.
    - Network access to https://github.com/kestra-io/datasets.git.
    - The repository must contain csv/orders.csv with the expected columns.

    ### Secrets

    - No secrets are required for the public dataset used by this example.

    ## Quick start

    1. Import this YAML into your Kestra instance.
    2. Execute the flow with run_quality_check set to true.
    3. Inspect the execution and download clean.csv, quarantine.csv, and quality-report.json.
    4. Review the report status and quarantined records. A FAILED report indicates data-quality issues; the flow currently reports these in its outputs rather than failing the execution solely because records were quarantined.
    5. Enable the daily_schedule trigger when you are ready for recurring runs.

    ## How to extend

    - Send alerts when the report status is FAILED.
    - Upload outputs to object storage or a data lake.
    - Add stricter business rules, email validation, or cross-file checks.
    - Route successful datasets to a warehouse only after a separate quality-status decision.

    ## Links

    - [Kestra Blueprints contribution guidelines](https://github.com/kestra-io/blueprints#blueprint-yaml-contribution-guidelines)
    - [Git Clone plugin](https://kestra.io/plugins/plugin-git)
    - [Python Script plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra documentation](https://kestra.io/docs)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - File & Data Processing Basics
  ee: false
  demo: false

triggers:
  - id: daily_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run the pipeline daily at 08:00.
    cron: "0 8 * * *"
