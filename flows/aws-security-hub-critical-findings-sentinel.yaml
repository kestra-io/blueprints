id: aws-security-hub-critical-findings-sentinel
namespace: company.ops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region where Security Hub is enabled.
  - id: max_findings
    type: INT
    defaults: 25
    description: Maximum number of critical findings to retrieve per run.

tasks:
  - id: get_critical_findings
    type: io.kestra.plugin.aws.cli.AwsCLI
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.aws_region }}"
    commands:
      - |
        RESULT=$(aws securityhub get-findings \
          --filters '{"SeverityLabel":[{"Value":"CRITICAL","Comparison":"EQUALS"}],"RecordState":[{"Value":"ACTIVE","Comparison":"EQUALS"}]}' \
          --max-items {{ inputs.max_findings }} \
          --output json 2>/dev/null)
        COUNT=$(echo "$RESULT" | jq '.Findings | length')
        TITLES=$(echo "$RESULT" | jq -r '[.Findings[:5][].Title] | join(", ")')
        PRODUCT_NAMES=$(echo "$RESULT" | jq -r '[.Findings[:5][].ProductName] | unique | join(", ")')
        if [ "$COUNT" -gt 0 ]; then
          echo "{\"findings_found\": true, \"count\": $COUNT, \"sample_titles\": \"$TITLES\", \"products\": \"$PRODUCT_NAMES\"}"
        else
          echo "{\"findings_found\": false, \"count\": 0, \"sample_titles\": \"\", \"products\": \"\"}"
        fi

  - id: evaluate_findings
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.get_critical_findings.vars.findings_found | default(false) }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":rotating_light: *AWS Security Hub Critical Findings Detected*\n• Active CRITICAL findings: `{{ outputs.get_critical_findings.vars.count }}`\n• Sample titles: `{{ outputs.get_critical_findings.vars.sample_titles }}`\n• Products: `{{ outputs.get_critical_findings.vars.products }}`\nRegion: `{{ inputs.aws_region }}`"
          }
    else:
      - id: log_ok
        type: io.kestra.plugin.core.log.Log
        message: "No active CRITICAL Security Hub findings detected. Region: {{ inputs.aws_region }}"

errors:
  - id: error_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":x: *AWS Security Hub Sentinel failed*\nExecution `{{ execution.id }}` encountered an error: `{{ error.message }}`"
      }

triggers:
  - id: scheduled_sentinel_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: AWS Security Hub Critical Severity Compliance Findings Sentinel
  shortDescription: Poll AWS Security Hub for active CRITICAL severity findings and alert Slack with finding titles and source products.
  description: |
    This sentinel continuously polls AWS Security Hub for active findings with CRITICAL severity. When critical findings
    are present, a Slack alert is sent with the count, sample finding titles, and the names of the security products
    that generated them, giving security and compliance teams immediate visibility into the most urgent open issues.

    ## How it works

    1. `io.kestra.plugin.aws.cli.AwsCLI` calls `aws securityhub get-findings` with filters for
       `SeverityLabel=CRITICAL` and `RecordState=ACTIVE`, capped to `max_findings` (default 25) items.
    2. The JSON response is parsed with `jq` to extract the finding count, the first five finding titles, and the
       unique set of product names that generated the findings.
    3. `io.kestra.plugin.core.flow.If` branches on `findings_found`. When `true`, a Slack message is sent with the
       count, sample titles, and products. When `false`, the flow logs a clean result.
    4. A top-level `errors` block fires a Slack alert on any unhandled exception.

    ## What you get

    - Automated detection of active CRITICAL Security Hub findings every 15 minutes.
    - Slack alerts with finding count, representative titles, and source product names.
    - A configurable `max_findings` input to control how many findings are fetched per run.
    - Full Kestra execution history for every sentinel check.

    ## Who it's for

    - Security engineers managing AWS Security Hub as a central compliance aggregator.
    - Cloud security teams enforcing CIS, PCI DSS, or AWS Foundational Security Best Practices standards.
    - Incident response teams needing real-time Slack alerts for critical compliance failures.

    ## Why orchestrate this with Kestra

    Security Hub can send events to EventBridge, but that requires configuring rules, targets, and SNS topics
    separately. Kestra consolidates the findings query, conditional branching, and Slack notification into a single
    declarative flow with retries, execution lineage, and namespace-scoped secrets.

    ## Prerequisites

    - An AWS IAM identity with `securityhub:GetFindings` permission.
    - AWS Security Hub enabled in the target region.
    - A Slack incoming webhook.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret access key.
    - `SLACK_WEBHOOK`: Slack incoming webhook URL.

    ## Quick start

    1. Add `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` to your Kestra namespace secrets.
    2. Set `aws_region` to the region where Security Hub is enabled.
    3. Adjust `max_findings` if needed (default: `25`).
    4. Enable the schedule trigger or execute manually.

    ## How to extend

    - Add a second branch for HIGH severity findings with a separate alert channel.
    - Loop across multiple regions using Kestra `ForEach`.
    - Suppress known-false-positive finding titles by filtering the `TITLES` list before alerting.
    - Persist finding details to S3 or a data warehouse for compliance trend analysis.

    ## Links

    - [AWS Security Hub documentation](https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub.html)
    - [Kestra AWS CLI plugin](https://kestra.io/plugins/plugin-aws)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
  ee: false
  demo: false
