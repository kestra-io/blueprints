id: elasticsearch-flush-latency-and-disk-throttling-sentinel
namespace: company.team

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Elasticsearch cluster hostname or IP address.
  - id: es_port
    type: INT
    defaults: 9200
    description: Elasticsearch HTTP port.
  - id: es_user
    type: STRING
    defaults: "elastic"
    description: Elasticsearch username.
  - id: max_flush_time_ms_threshold
    type: INT
    defaults: 5000
    description: Maximum acceptable flush duration in milliseconds before alerting.

tasks:
  - id: query_node_flush_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.es_host }}"
      ES_PORT: "{{ inputs.es_port }}"
      ES_USER: "{{ inputs.es_user }}"
      ES_PASSWORD: "{{ secret('ES_PASSWORD') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "elasticsearch.internal")
      port = os.environ.get("ES_PORT", "9200")
      user = os.environ.get("ES_USER", "elastic")
      password = os.environ.get("ES_PASSWORD", "")

      auth = (user, password) if user and password else None
      url = f"http://{host}:{port}/_nodes/stats/indices/flush,indexing"

      try:
          resp = requests.get(url, auth=auth, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"CRITICAL: Failed to query Elasticsearch flush stats at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      nodes = data.get("nodes", {})
      throttled_count = 0
      peak_flush_time = 0

      for node_id, node_data in nodes.items():
          indices = node_data.get("indices", {})
          indexing = indices.get("indexing", {})
          if indexing.get("is_throttled", False):
              throttled_count += 1
          flush = indices.get("flush", {})
          flush_time = flush.get("total_time_in_millis", 0)
          if flush_time > peak_flush_time:
              peak_flush_time = flush_time

      report = {
          "throttled_nodes": throttled_count,
          "peak_flush_time": peak_flush_time
      }

      with open("flush_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "throttled_nodes": throttled_count,
          "peak_flush_time": peak_flush_time
      })
      print(f"Flush metrics: throttled_nodes={throttled_count}, peak_flush_time={peak_flush_time}ms")
    outputFiles:
      - flush_report.json

  - id: evaluate_flush_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_node_flush_metrics.vars.throttled_nodes | int > 0 or outputs.query_node_flush_metrics.vars.peak_flush_time | int > inputs.max_flush_time_ms_threshold }}"
    then:
      - id: notify_infrastructure_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#elasticsearch-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Disk Throttling & Slow Flush Alert",
                "text": "Elasticsearch cluster at `{{ inputs.es_host }}` reported *{{ outputs.query_node_flush_metrics.vars.throttled_nodes }}* nodes experiencing indexing write throttling (Peak flush time: *{{ outputs.query_node_flush_metrics.vars.peak_flush_time }} ms*)! Impact: Disk I/O bottlenecks or translog fsync delays are artificially throttling client indexing threads.",
                "footer": "Kestra Search Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#elasticsearch-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Flush Latency & Disk Throttling Sentinel Failure",
            "text": "Failed to scrape Elasticsearch node flush stats. Verify cluster connectivity. Execution ID: {{ execution.id }}",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Elasticsearch shard flush times and indexing throttle flags to isolate disk I/O bottlenecks."
  metaTitle: Elasticsearch Flush Latency and Disk Throttling Sentinel with Kestra
  title: Elasticsearch Flush Latency and Disk Throttling Sentinel
  shortDescription: Audits Elasticsearch shard flush times and indexing throttle flags to isolate disk I/O bottlenecks.
  description: |
    ## How it works
    This workflow polls `GET /_nodes/stats/indices/flush,indexing` across the Elasticsearch cluster. Lucene flushes write in-memory buffers to disk segments and commit translogs. When storage volume IOPS saturate or write caches stall, Elasticsearch throttles incoming bulk index requests. The sentinel checks for active indexing throttle states and excessive flush latency, notifying operations teams immediately.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_schedule Schedule Trigger] --> B[query_node_flush_metrics Python Script]
      B --> C{Disk Throttling or High Flush Time?}
      C -- Yes --> D[notify_infrastructure_team Slack Webhook]
      C -- No --> E[Storage Performance Nominal]
    ```

    ## Prerequisites
    - Elasticsearch cluster (7.x / 8.x) accessible via REST.
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure cluster host, port, and flush time threshold.
    3. Run manually to verify cluster I/O performance.

    ## Links
    - [Elasticsearch Indices Flush API](https://www.elastic.co/guide/en/elasticsearch/reference/current/indices-flush.html)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
