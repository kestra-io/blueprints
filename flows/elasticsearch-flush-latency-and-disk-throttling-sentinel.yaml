id: elasticsearch-flush-latency-and-disk-throttling-sentinel
namespace: company.data

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Elasticsearch cluster hostname or IP address.
  - id: es_port
    type: INT
    defaults: 9200
    description: Elasticsearch HTTP port.
  - id: es_user
    type: STRING
    defaults: "elastic"
    description: Elasticsearch username.
  - id: max_flush_time_ms_threshold
    type: INT
    defaults: 5000
    description: Maximum acceptable flush duration in milliseconds before alerting.

tasks:
  - id: query_node_flush_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s -u "{{ inputs.es_user }}:{{ secret('ES_PASSWORD') }}" \
          "http://{{ inputs.es_host }}:{{ inputs.es_port }}/_nodes/stats/indices/flush,indexing" > /tmp/es_flush.json
        
        THROTTLED_NODES=$(jq '[.nodes | to_entries[] | select(.value.indices.indexing.is_throttled == true)] | length' /tmp/es_flush.json)
        PEAK_FLUSH_TIME=$(jq '[.nodes | to_entries[].value.indices.flush.total_time_in_millis] | max // 0' /tmp/es_flush.json)
        
        echo "::set-output name=throttled_nodes::$THROTTLED_NODES::"
        echo "::set-output name=peak_flush_time::$PEAK_FLUSH_TIME::"

  - id: evaluate_flush_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_node_flush_metrics.vars.throttled_nodes | int > 0 }}"
    then:
      - id: notify_infrastructure_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#elasticsearch-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Disk Throttling & Slow Flush Alert",
                "text": "Elasticsearch cluster at `{{ inputs.es_host }}` reported *{{ outputs.query_node_flush_metrics.vars.throttled_nodes }}* nodes experiencing indexing write throttling! Impact: Disk I/O bottlenecks or translog fsync delays are artificially throttling client indexing threads.",
                "footer": "Kestra Search Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#elasticsearch-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Flush Latency and Disk Write Throttling Sentinel Pipeline Failure",
            "text": "Failed to scrape Elasticsearch node flush stats. Check cluster network accessibility.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Elasticsearch Flush Latency and Disk Write Throttling Sentinel
  shortDescription: Monitors Elasticsearch node stats to detect indexing write throttling and slow Lucene commit flushes.
  description: |
    ## How it works
    This workflow inspects `_nodes/stats/indices/flush,indexing` across all nodes. In Elasticsearch, when underlying storage cannot keep up with write throughput, Elasticsearch flags `is_throttled = true` and throttles indexing threads to prevent translog exhaustion. Slow flushes also increase heap retention. If any node is throttled, an incident notification is sent to Slack.

    ## What you get
    - Immediate notification of disk write throttling across Elasticsearch nodes.
    - Prevents indexing thread pool rejections and ingestion queue backups.
    - Clear visibility into node-level storage performance.

    ## Who it's for
    - SREs and Infrastructure Architects managing storage IOPS on Elasticsearch clusters.
    - Platform teams running high-volume ingestion workloads (Logstash, FluentBit, OpenTelemetry).

    ## Why orchestrate this with Kestra
    - **Cluster-Wide Aggregation**: Inspect all nodes in a single declarative task.
    - **Proactive Scaling**: Detect storage saturation before nodes drop out of the cluster.
    - **Seamless Slack Integration**: Formatted diagnostic reports delivered directly to on-call engineers.

    ## Prerequisites
    - Elasticsearch cluster (7.x / 8.x) accessible to Kestra.
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure Elasticsearch connection parameters.
    3. Run the workflow to inspect flush and throttling metrics.

    ## How to extend
    - Automatically adjust `index.translog.sync_interval` or increase provisioned EBS IOPS via AWS CLI.
    - Monitor translog generation rate alongside flush metrics.

    ## Links
    - [Elasticsearch Node Stats API](https://www.elastic.co/guide/en/elasticsearch/reference/current/cluster-nodes-stats.html)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
