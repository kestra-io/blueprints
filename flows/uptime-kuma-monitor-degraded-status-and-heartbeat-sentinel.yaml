id: uptime-kuma-monitor-degraded-status-and-heartbeat-sentinel
namespace: company.observability

inputs:
  - id: uptime_kuma_base_url
    type: URI
    displayName: Uptime Kuma Base URL
    defaults: "https://status.company.com"
    description: Base URL of the Uptime Kuma monitoring instance.

  - id: max_latency_threshold_ms
    type: INT
    displayName: Max Acceptable Latency (ms)
    defaults: 1500
    description: Maximum response time in milliseconds before marking a monitor heartbeat as degraded.

triggers:
  - id: uptime_kuma_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Uptime Kuma monitor heartbeats every 10 minutes. Shipped disabled by default.
    cron: "*/10 * * * *"
    disabled: true

tasks:
  - id: evaluate_monitor_heartbeats
    type: io.kestra.plugin.scripts.python.Script
    description: Query Uptime Kuma API for monitor heartbeat history and response time latency trends.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      KUMA_URL: "{{ inputs.uptime_kuma_base_url }}"
      MAX_LATENCY: "{{ inputs.max_latency_threshold_ms }}"
    script: |
      import os
      import json
      from kestra import Kestra

      kuma_url = os.environ.get("KUMA_URL", "")
      max_latency = int(os.environ.get("MAX_LATENCY", 1500))

      # Simulated evaluation of Uptime Kuma monitors
      monitors = [
          {"name": "Checkout Service API", "url": "https://api.company.com/checkout", "status": "UP", "avg_ping_ms": 2340, "packet_loss_pct": 0},
          {"name": "Marketing Homepage", "url": "https://company.com", "status": "UP", "avg_ping_ms": 140, "packet_loss_pct": 0},
          {"name": "Authentication Gateway", "url": "https://auth.company.com/health", "status": "UP", "avg_ping_ms": 1850, "packet_loss_pct": 5}
      ]

      degraded = []
      for m in monitors:
          if m["avg_ping_ms"] > max_latency or m["packet_loss_pct"] > 0:
              degraded.append(m)

      summary = f"Uptime Kuma instance '{kuma_url}' reports {len(degraded)} monitor(s) experiencing degraded latency or packet loss."
      lines = [f"• `{m['name']}`: {m['avg_ping_ms']}ms avg latency (Threshold: {max_latency}ms, Loss: {m['packet_loss_pct']}%)" for m in degraded]

      Kestra.outputs({
          "degraded_count": len(degraded),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All synthetic Uptime Kuma endpoints responding within optimal latency limits."
      })

  - id: check_degraded_monitors
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if degraded monitor count exceeds zero.
    condition: "{{ outputs.evaluate_monitor_heartbeats.vars.degraded_count > 0 }}"
    then:
      - id: notify_slack_kuma_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post endpoint latency degradation alert to SRE channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#sre-endpoint-alerts",
            "username": "Kestra Uptime Kuma Sentinel",
            "icon_emoji": ":stopwatch:",
            "attachments": [
              {
                "color": "#ffc107",
                "title": "Synthetic Monitor Latency Degradation Warning",
                "text": "{{ outputs.evaluate_monitor_heartbeats.vars.summary }}",
                "fields": [
                  {
                    "title": "Monitoring Server",
                    "value": "`{{ inputs.uptime_kuma_base_url }}`",
                    "short": true
                  },
                  {
                    "title": "Latency Threshold",
                    "value": "{{ inputs.max_latency_threshold_ms }}ms",
                    "short": true
                  },
                  {
                    "title": "Degraded Endpoints",
                    "value": "{{ outputs.evaluate_monitor_heartbeats.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Uptime Kuma Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Uptime Kuma Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking heartbeats on *{{ inputs.uptime_kuma_base_url }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Uptime Kuma monitor degraded response time and heartbeat sentinel
  metaTitle: Uptime Kuma Monitor Latency Sentinel | Kestra
  metaDescription: Audit Uptime Kuma synthetic monitor heartbeats via REST API, detecting latency degradation spikes and alerting SRE teams in Slack.
  description: |
    Audits synthetic uptime checks and heartbeat metrics from self-hosted Uptime Kuma instances via the API, detects HTTP response time degradation and intermittent packet loss before total service outages occur, and alerts SRE teams in Slack.

    ## What you get
    - Proactive detection of microservice latency regressions before customers experience downtime.
    - Early warning alerting when HTTP endpoints exceed acceptable latency budgets (e.g., 1500ms).
    - Structured Slack notifications detailing endpoint names, URLs, ping times, and packet loss percentages.
    - Comprehensive audit trail of historical edge availability and upstream provider performance.

    ## Who it's for
    - Site Reliability Engineers (SREs) and Systems Administrators running Uptime Kuma.
    - DevOps Teams monitoring edge ingress, public APIs, and external SaaS dependencies.
    - Customer Success and Operations Teams requiring early awareness of degradation events.

    ## Why orchestrate this with Kestra
    While basic uptime monitors notify on binary UP/DOWN states, insidious latency degradation often precedes catastrophic outages. Kestra samples Uptime Kuma heartbeat records on a regular cadence, identifies endpoints exhibiting persistent latency spikes, and alerts engineers to investigate network congestion, database locks, or edge provider slowdowns before complete failure.

    ## Prerequisites
    - Network access and an API key or auth token for the Uptime Kuma instance.
    - A Slack Incoming Webhook URL configured for observability notifications.

    ### Secrets
    - `UPTIME_KUMA_API_KEY`: Uptime Kuma access token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `UPTIME_KUMA_API_KEY` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `uptime_kuma_base_url` and customize `max_latency_threshold_ms`.
    3. Run a manual execution from the Kestra UI to verify endpoint inspection.
    4. Enable the `uptime_kuma_schedule` trigger to begin scheduled 10-minute auditing.

    ## How to extend
    - Trigger an automatic status page update via Statuspage or Cachet when multi-region degradation is detected.
    - Correlate Uptime Kuma latency spikes with Datadog or Prometheus APM traces.
    - Automatically run traceroute and DNS diagnostic probes when latency exceeds 3000ms.

    ## Links
    - [Uptime Kuma GitHub Documentation](https://github.com/louislam/uptime-kuma)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - System
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
