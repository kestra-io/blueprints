id: ap-three-way-match-ai-triage-gate
namespace: company.finance

description: |
  Automate Accounts Payable (AP) 3-way matching across Purchase Orders (POs),
  Goods Receipt Notes (GRNs), and Vendor Invoices using DuckDB SQL, generate
  auto-approved ERP payment batches and held exception reports, and optionally
  run Gemini AI root-cause triage, Slack alerting, and human approval gating.

triggers:
  - id: nightly_ap_reconciliation
    type: io.kestra.plugin.core.trigger.Schedule
    description: Nightly Accounts Payable 3-way match sweep before ERP payment run. Shipped disabled by default.
    cron: "0 2 * * 1-5"
    disabled: true

  - id: erp_invoice_batch_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Webhook trigger for on-demand AP subledger or OCR invoice batch ingestion.
    key: "{{ secret('AP_WEBHOOK_KEY') }}"

inputs:
  - id: inject_discrepancies
    type: BOOL
    defaults: true
    description: When true, evaluates the full 6-invoice demo batch including 4 realistic AP discrepancies (overbilling, price variance, missing receipt, duplicate invoice). Set to false to simulate a 100% clean batch.

  - id: price_tolerance_pct
    type: FLOAT
    defaults: 2.0
    description: Maximum allowed positive unit price variance percentage above the contracted PO unit price before placing an invoice on hold.

  - id: qty_tolerance_pct
    type: FLOAT
    defaults: 0.0
    description: Maximum allowed quantity overbilling percentage above accepted Goods Receipt Note (GRN) quantity.

  - id: enable_ai_triage
    type: BOOL
    defaults: false
    description: Enable optional Google Gemini AI triage to generate vendor debit-memo drafts and remediation actions (requires GEMINI_API_KEY secret).

  - id: send_slack_alert
    type: BOOL
    defaults: false
    description: Enable optional Slack notification to the Accounts Payable review channel when exceptions are held (requires SLACK_WEBHOOK_URL secret).

  - id: require_human_approval
    type: BOOL
    defaults: false
    description: Pause workflow execution for interactive Controller sign-off when held exceptions are detected.

  - id: model_name
    type: STRING
    defaults: gemini-2.5-flash
    description: Gemini model used when enable_ai_triage is set to true.

