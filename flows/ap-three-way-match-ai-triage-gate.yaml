tasks:
  - id: stage_ap_documents
    type: io.kestra.plugin.scripts.python.Script
    description: Normalizes inbound PO, GRN, and Vendor Invoice JSON payloads into structured CSV staging files for DuckDB reconciliation.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    inputFiles:
      purchase_orders.json: "{{ inputs.purchase_orders | toJson }}"
      goods_receipts.json: "{{ inputs.goods_receipts | toJson }}"
      vendor_invoices.json: "{{ inputs.vendor_invoices | toJson }}"
    outputFiles:
      - purchase_orders.csv
      - goods_receipts.csv
      - vendor_invoices.csv
    script: |
      import csv
      import json
      from pathlib import Path

      inject_discrepancies = "{{ inputs.inject_discrepancies }}".strip().lower() == "true"

      pos = json.loads(Path("purchase_orders.json").read_text(encoding="utf-8"))
      grns = json.loads(Path("goods_receipts.json").read_text(encoding="utf-8"))
      invoices = json.loads(Path("vendor_invoices.json").read_text(encoding="utf-8"))

      if not inject_discrepancies:
          clean_invoice_ids = {"INV-7001", "INV-7005"}
          filtered = [inv for inv in invoices if inv.get("invoice_id") in clean_invoice_ids]
          if filtered:
              invoices = filtered

      def write_csv(filename: str, fieldnames: list[str], rows: list[dict]) -> None:
          with open(filename, "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              for row in rows:
                  writer.writerow({k: row.get(k, "") for k in fieldnames})

      write_csv(
          "purchase_orders.csv",
          ["po_id", "vendor_id", "vendor_name", "item_sku", "item_description", "ordered_qty", "po_unit_price", "currency"],
          pos,
      )
      write_csv(
          "goods_receipts.csv",
          ["grn_id", "po_id", "item_sku", "accepted_qty", "received_date"],
          grns,
      )
      write_csv(
          "vendor_invoices.csv",
          ["invoice_id", "vendor_invoice_number", "vendor_id", "po_id", "item_sku", "billed_qty", "billed_unit_price", "invoice_date"],
          invoices,
      )
      print(f"Staged {len(pos)} POs, {len(grns)} GRNs, and {len(invoices)} Vendor Invoices (inject_discrepancies={inject_discrepancies}).")

  - id: reconcile_three_way_match
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Executes deterministic 3-way match SQL joining Purchase Orders, aggregated Goods Receipts, and deduplicated Vendor Invoices.
    url: "jdbc:duckdb:"
    inputFiles:
      purchase_orders.csv: "{{ outputs.stage_ap_documents.outputFiles['purchase_orders.csv'] }}"
      goods_receipts.csv: "{{ outputs.stage_ap_documents.outputFiles['goods_receipts.csv'] }}"
      vendor_invoices.csv: "{{ outputs.stage_ap_documents.outputFiles['vendor_invoices.csv'] }}"
    fetchType: FETCH
    sql: |
      WITH po AS (
          SELECT
              CAST(po_id AS VARCHAR) AS po_id,
              CAST(vendor_id AS VARCHAR) AS vendor_id,
              CAST(vendor_name AS VARCHAR) AS vendor_name,
              CAST(item_sku AS VARCHAR) AS item_sku,
              CAST(item_description AS VARCHAR) AS item_description,
              CAST(ordered_qty AS DOUBLE) AS ordered_qty,
              CAST(po_unit_price AS DOUBLE) AS po_unit_price,
              CAST(currency AS VARCHAR) AS currency
          FROM read_csv_auto('purchase_orders.csv', header = true)
      ),
      grn_agg AS (
          SELECT
              CAST(po_id AS VARCHAR) AS po_id,
              CAST(item_sku AS VARCHAR) AS item_sku,
              SUM(CAST(accepted_qty AS DOUBLE)) AS received_qty,
              MAX(CAST(received_date AS VARCHAR)) AS last_received_date
          FROM read_csv_auto('goods_receipts.csv', header = true)
          GROUP BY po_id, item_sku
      ),
      ranked_invoices AS (
          SELECT
              CAST(invoice_id AS VARCHAR) AS invoice_id,
              CAST(vendor_invoice_number AS VARCHAR) AS vendor_invoice_number,
              CAST(vendor_id AS VARCHAR) AS vendor_id,
              CAST(po_id AS VARCHAR) AS po_id,
              CAST(item_sku AS VARCHAR) AS item_sku,
              CAST(billed_qty AS DOUBLE) AS billed_qty,
              CAST(billed_unit_price AS DOUBLE) AS billed_unit_price,
              CAST(invoice_date AS VARCHAR) AS invoice_date,
              ROW_NUMBER() OVER (
                  PARTITION BY CAST(vendor_id AS VARCHAR), CAST(vendor_invoice_number AS VARCHAR), CAST(item_sku AS VARCHAR)
                  ORDER BY CAST(invoice_date AS VARCHAR), CAST(invoice_id AS VARCHAR)
              ) AS duplicate_rank
          FROM read_csv_auto('vendor_invoices.csv', header = true)
      ),
      reconciled AS (
          SELECT
              inv.invoice_id,
              inv.vendor_invoice_number,
              inv.vendor_id,
              COALESCE(po.vendor_name, 'UNREGISTERED_VENDOR') AS vendor_name,
              inv.po_id,
              inv.item_sku,
              COALESCE(po.item_description, 'UNCATALOGUED_ITEM') AS item_description,
              COALESCE(po.currency, 'USD') AS currency,
              COALESCE(po.ordered_qty, 0.0) AS po_ordered_qty,
              COALESCE(po.po_unit_price, 0.0) AS po_unit_price,
              COALESCE(grn.received_qty, 0.0) AS grn_received_qty,
              inv.billed_qty,
              inv.billed_unit_price,
              inv.invoice_date,
              inv.duplicate_rank,
              ROUND(inv.billed_qty * inv.billed_unit_price, 2) AS billed_amount_usd,
              ROUND(COALESCE(grn.received_qty, 0.0) * COALESCE(po.po_unit_price, 0.0), 2) AS received_po_value_usd,
              ROUND(
                  CASE
                      WHEN inv.duplicate_rank > 1 THEN inv.billed_qty * inv.billed_unit_price
                      ELSE (inv.billed_qty * inv.billed_unit_price) - (COALESCE(grn.received_qty, 0.0) * COALESCE(po.po_unit_price, 0.0))
                  END,
                  2
              ) AS line_variance_usd,
              ROUND(
                  CASE
                      WHEN COALESCE(po.po_unit_price, 0.0) > 0.0
                          THEN ((inv.billed_unit_price - po.po_unit_price) / po.po_unit_price) * 100.0
                      WHEN COALESCE(po.po_unit_price, 0.0) = 0.0 AND inv.billed_unit_price = 0.0
                          THEN 0.0
                      ELSE 100.0
                  END,
                  2
              ) AS price_variance_pct,
              GREATEST(0.0, inv.billed_qty - COALESCE(grn.received_qty, 0.0)) AS overbilled_qty,
              CASE
                  WHEN po.po_id IS NULL THEN 'UNMATCHED_PO'
                  WHEN inv.duplicate_rank > 1 THEN 'DUPLICATE_INVOICE'
                  WHEN COALESCE(grn.received_qty, 0.0) <= 0.0 THEN 'MISSING_RECEIPT'
                  WHEN inv.billed_qty > COALESCE(grn.received_qty, 0.0) * (1.0 + ({{ inputs.qty_tolerance_pct }} / 100.0)) THEN 'QTY_OVERBILLED'
                  WHEN po.po_unit_price < 0.0 OR inv.billed_unit_price < 0.0 THEN 'INVALID_UNIT_PRICE'
                  WHEN po.po_unit_price = 0.0 AND inv.billed_unit_price > 0.0 THEN 'PRICE_VARIANCE_EXCEEDED'
                  WHEN po.po_unit_price > 0.0 AND ((inv.billed_unit_price - po.po_unit_price) / po.po_unit_price) * 100.0 > {{ inputs.price_tolerance_pct }} THEN 'PRICE_VARIANCE_EXCEEDED'
                  ELSE 'MATCHED_AUTO_APPROVED'
              END AS exception_code
          FROM ranked_invoices inv
          LEFT JOIN po
              ON inv.po_id = po.po_id
             AND inv.item_sku = po.item_sku
          LEFT JOIN grn_agg grn
              ON inv.po_id = grn.po_id
             AND inv.item_sku = grn.item_sku
      )
      SELECT
          invoice_id,
          vendor_invoice_number,
          vendor_id,
          vendor_name,
          po_id,
          item_sku,
          item_description,
          currency,
          po_ordered_qty,
          po_unit_price,
          grn_received_qty,
          billed_qty,
          billed_unit_price,
          billed_amount_usd,
          received_po_value_usd,
          line_variance_usd,
          price_variance_pct,
          overbilled_qty,
          exception_code,
          CASE
              WHEN exception_code = 'MATCHED_AUTO_APPROVED' THEN 'AUTO_APPROVED'
              ELSE 'HELD_FOR_REVIEW'
          END AS match_status,
          CASE
              WHEN exception_code = 'DUPLICATE_INVOICE'
                  THEN 'Duplicate submission of vendor invoice ' || vendor_invoice_number || ' for vendor ' || vendor_id || ' ($' || CAST(billed_amount_usd AS VARCHAR) || ' duplicate exposure blocked).'
              WHEN exception_code = 'MISSING_RECEIPT'
                  THEN 'No Goods Receipt Note (GRN) recorded for ' || po_id || ' / ' || item_sku || ' (billed ' || CAST(CAST(billed_qty AS INTEGER) AS VARCHAR) || ' units vs 0 received).'
              WHEN exception_code = 'QTY_OVERBILLED'
                  THEN 'Billed quantity (' || CAST(CAST(billed_qty AS INTEGER) AS VARCHAR) || ') exceeds GRN accepted quantity (' || CAST(CAST(grn_received_qty AS INTEGER) AS VARCHAR) || ') by ' || CAST(CAST(overbilled_qty AS INTEGER) AS VARCHAR) || ' units ($' || CAST(line_variance_usd AS VARCHAR) || ' variance).'
              WHEN exception_code = 'INVALID_UNIT_PRICE'
                  THEN 'Invalid negative unit price detected (billed $' || CAST(billed_unit_price AS VARCHAR) || ' vs PO $' || CAST(po_unit_price AS VARCHAR) || ').'
              WHEN exception_code = 'PRICE_VARIANCE_EXCEEDED'
                  THEN 'Billed unit price ($' || CAST(billed_unit_price AS VARCHAR) || ') exceeds PO unit price ($' || CAST(po_unit_price AS VARCHAR) || ') by ' || CAST(price_variance_pct AS VARCHAR) || '%, breaching the {{ inputs.price_tolerance_pct }}% tolerance ($' || CAST(line_variance_usd AS VARCHAR) || ' variance).'
              WHEN exception_code = 'UNMATCHED_PO'
                  THEN 'Invoice references non-existent PO ' || po_id || ' or SKU ' || item_sku || '.'
              ELSE '3-way match verified within PO/GRN tolerances (price variance: ' || CAST(price_variance_pct AS VARCHAR) || '%).'
          END AS hold_explanation
      FROM reconciled
      ORDER BY invoice_id;

  - id: generate_erp_and_exception_batches
    type: io.kestra.plugin.scripts.python.Script
    description: Partitions reconciled invoices into an ERP auto-approval CSV batch, a held exceptions CSV report, a JSON metrics summary, and a Markdown audit report.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    inputFiles:
      reconciled_rows.json: "{{ outputs.reconcile_three_way_match.rows | toJson }}"
    outputFiles:
      - auto_approved_erp_batch.csv
      - held_exceptions_report.csv
      - reconciliation_metrics.json
      - ap_three_way_match_audit_report.md
    script: |
      import csv
      import json
      from pathlib import Path

      rows = json.loads(Path("reconciled_rows.json").read_text(encoding="utf-8"))

      approved_rows = [r for r in rows if r.get("match_status") == "AUTO_APPROVED"]
      held_rows = [r for r in rows if r.get("match_status") == "HELD_FOR_REVIEW"]

      columns = [
          "invoice_id",
          "vendor_invoice_number",
          "vendor_id",
          "vendor_name",
          "po_id",
          "item_sku",
          "po_ordered_qty",
          "po_unit_price",
          "grn_received_qty",
          "billed_qty",
          "billed_unit_price",
          "billed_amount_usd",
          "received_po_value_usd",
          "line_variance_usd",
          "price_variance_pct",
          "overbilled_qty",
          "exception_code",
          "match_status",
          "hold_explanation",
      ]

      def write_batch(filename: str, dataset: list[dict]) -> None:
          with open(filename, "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=columns)
              writer.writeheader()
              for item in dataset:
                  writer.writerow({col: item.get(col, "") for col in columns})

      write_batch("auto_approved_erp_batch.csv", approved_rows)
      write_batch("held_exceptions_report.csv", held_rows)

      total_billed = round(sum(float(r.get("billed_amount_usd", 0.0)) for r in rows), 2)
      approved_amount = round(sum(float(r.get("billed_amount_usd", 0.0)) for r in approved_rows), 2)
      held_exposure = round(sum(float(r.get("billed_amount_usd", 0.0)) for r in held_rows), 2)
      held_overcharge_variance = round(sum(max(0.0, float(r.get("line_variance_usd", 0.0))) for r in held_rows), 2)

      exception_breakdown = {}
      for r in held_rows:
          code = r.get("exception_code", "UNKNOWN")
          exception_breakdown[code] = exception_breakdown.get(code, 0) + 1

      metrics = {
          "total_invoices_evaluated": len(rows),
          "auto_approved_count": len(approved_rows),
          "held_exceptions_count": len(held_rows),
          "total_billed_amount_usd": total_billed,
          "auto_approved_amount_usd": approved_amount,
          "held_exposure_amount_usd": held_exposure,
          "held_overcharge_variance_usd": held_overcharge_variance,
          "exception_breakdown": exception_breakdown,
      }
      Path("reconciliation_metrics.json").write_text(json.dumps(metrics, indent=2), encoding="utf-8")

      md_lines = [
          "# Accounts Payable 3-Way Match Audit Report",
          "",
          "## Executive Summary",
          f"- **Total Invoices Evaluated:** {metrics['total_invoices_evaluated']} (`${total_billed:,.2f}`)",
          f"- **Auto-Approved for ERP Payment:** {metrics['auto_approved_count']} (`${approved_amount:,.2f}`)",
          f"- **Held for AP Exception Review:** {metrics['held_exceptions_count']} (`${held_exposure:,.2f}` total invoice exposure; `${held_overcharge_variance:,.2f}` net overcharge/unbacked variance)",
          f"- **Configured Tolerances:** Price Variance <= `{{ inputs.price_tolerance_pct }}%`, Quantity Overbill <= `{{ inputs.qty_tolerance_pct }}%`",
          "",
          "## Held Exceptions Requiring Controller / Buyer Action",
      ]

      if held_rows:
          md_lines.extend([
              "| Invoice ID | Vendor Invoice # | Vendor | PO ID | SKU | Exception Code | Billed ($) | Variance ($) | Hold Explanation |",
              "| :--- | :--- | :--- | :--- | :--- | :--- | ---: | ---: | :--- |",
          ])
          for r in held_rows:
              md_lines.append(
                  f"| `{r['invoice_id']}` | `{r['vendor_invoice_number']}` | {r['vendor_name']} | `{r['po_id']}` | `{r['item_sku']}` | **{r['exception_code']}** | ${float(r['billed_amount_usd']):,.2f} | ${float(r['line_variance_usd']):,.2f} | {r['hold_explanation']} |"
              )
      else:
          md_lines.append("_No discrepancies detected. All invoices satisfied 3-way match tolerances._")

      md_lines.extend([
          "",
          "## Auto-Approved ERP Payment Batch",
          "| Invoice ID | Vendor Invoice # | Vendor | PO ID | SKU | Billed Qty | Unit Price ($) | Approved Total ($) | Status |",
          "| :--- | :--- | :--- | :--- | :--- | ---: | ---: | ---: | :--- |",
      ])
      for r in approved_rows:
          md_lines.append(
              f"| `{r['invoice_id']}` | `{r['vendor_invoice_number']}` | {r['vendor_name']} | `{r['po_id']}` | `{r['item_sku']}` | {int(float(r['billed_qty']))} | ${float(r['billed_unit_price']):,.2f} | ${float(r['billed_amount_usd']):,.2f} | `{r['match_status']}` |"
          )

      Path("ap_three_way_match_audit_report.md").write_text("\n".join(md_lines) + "\n", encoding="utf-8")
      print("::" + json.dumps({"outputs": metrics}) + "::")

  - id: expose_reconciliation_metrics
    type: io.kestra.plugin.core.output.OutputValues
    description: Publishes structured 3-way match counts and dollar exposure metrics to execution outputs.
    values:
      total_invoices_evaluated: "{{ outputs.generate_erp_and_exception_batches.vars.total_invoices_evaluated }}"
      auto_approved_count: "{{ outputs.generate_erp_and_exception_batches.vars.auto_approved_count }}"
      held_exceptions_count: "{{ outputs.generate_erp_and_exception_batches.vars.held_exceptions_count }}"
      auto_approved_amount_usd: "{{ outputs.generate_erp_and_exception_batches.vars.auto_approved_amount_usd }}"
      held_exposure_amount_usd: "{{ outputs.generate_erp_and_exception_batches.vars.held_exposure_amount_usd }}"
      held_overcharge_variance_usd: "{{ outputs.generate_erp_and_exception_batches.vars.held_overcharge_variance_usd }}"

  - id: route_reconciliation_outcome
    type: io.kestra.plugin.core.flow.If
    description: Branches workflow between the exception quarantine path (when held_exceptions_count > 0) and the clean ERP batch path.
    condition: "{{ outputs.generate_erp_and_exception_batches.vars.held_exceptions_count > 0 }}"
    then:
      - id: log_exception_hold_summary
        type: io.kestra.plugin.core.log.Log
        description: Logs the deterministic rule-based 3-way match exception hold summary to the execution log.
        message: |
          AP 3-WAY MATCH GATE: {{ outputs.expose_reconciliation_metrics.values.held_exceptions_count }} invoice(s) placed on payment hold (${{ outputs.expose_reconciliation_metrics.values.held_exposure_amount_usd }} total held exposure; ${{ outputs.expose_reconciliation_metrics.values.held_overcharge_variance_usd }} net variance).
          Auto-approved batch ({{ outputs.expose_reconciliation_metrics.values.auto_approved_count }} invoices, ${{ outputs.expose_reconciliation_metrics.values.auto_approved_amount_usd }}) exported to auto_approved_erp_batch.csv.
          Held exceptions exported to held_exceptions_report.csv.

      - id: check_ai_triage_enabled
        type: io.kestra.plugin.core.flow.If
        description: Runs optional Google Gemini AI exception triage when enable_ai_triage is set to true.
        condition: "{{ inputs.enable_ai_triage == true }}"
        then:
          - id: ai_triage_exceptions
            type: io.kestra.plugin.ai.completion.ChatCompletion
            description: Uses Google Gemini to synthesize per-invoice root-cause explanations, vendor debit-memo communication drafts, and ERP remediation actions.
            provider:
              type: io.kestra.plugin.ai.provider.GoogleGemini
              apiKey: "{{ secret('GEMINI_API_KEY') }}"
              modelName: "{{ inputs.model_name }}"
            messages:
              - type: SYSTEM
                content: |
                  You are a Senior Accounts Payable Controller and Procurement Audit Specialist.
                  Analyze the held 3-way match invoice exceptions exported from DuckDB.
                  For each held invoice:
                  1. Classify the root cause (Duplicate Billing, Unreceived Goods, Quantity Overbill, or Unit Price Overcharge).
                  2. State the exact dollar variance and recommended ERP action (Block Payment, Request Warehouse Receiving Confirmation, Issue Debit Memo, or Reject Duplicate).
                  3. Draft a concise, professional vendor dispute notice referencing the PO ID, Vendor Invoice Number, and exact variance figures.
              - type: USER
                content: |
                  Reconciliation Metrics:
                  {{ read(outputs.generate_erp_and_exception_batches.outputFiles['reconciliation_metrics.json']) }}

                  Held Exceptions CSV:
                  {{ read(outputs.generate_erp_and_exception_batches.outputFiles['held_exceptions_report.csv']) }}

          - id: save_ai_triage_memo
            type: io.kestra.plugin.core.storage.Write
            description: Saves the Gemini AI triage memo and vendor dispute drafts to internal storage.
            content: "{{ outputs.ai_triage_exceptions.textOutput }}"
            extension: .md

      - id: check_slack_alert_enabled
        type: io.kestra.plugin.core.flow.If
        description: Sends optional Slack notification to the AP team when send_slack_alert is set to true.
        condition: "{{ inputs.send_slack_alert == true }}"
        then:
          - id: notify_ap_slack_channel
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Posts a rich AP 3-way match exception alert to Slack with held exposure metrics.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":rotating_light: *AP 3-Way Match Exception Gate Triggered*\n*Execution:* `{{ execution.id }}`\n*Auto-Approved Invoices:* `{{ outputs.expose_reconciliation_metrics.values.auto_approved_count }}` (`${{ outputs.expose_reconciliation_metrics.values.auto_approved_amount_usd }}`)\n*Held Invoices:* `{{ outputs.expose_reconciliation_metrics.values.held_exceptions_count }}` (`${{ outputs.expose_reconciliation_metrics.values.held_exposure_amount_usd }}` exposure | `${{ outputs.expose_reconciliation_metrics.values.held_overcharge_variance_usd }}` variance)\nReview `held_exceptions_report.csv` and `ap_three_way_match_audit_report.md` in Kestra UI."
              }

      - id: check_human_approval_required
        type: io.kestra.plugin.core.flow.If
        description: Optionally pauses execution for Controller sign-off when require_human_approval is set to true.
        condition: "{{ inputs.require_human_approval == true }}"
        then:
          - id: await_controller_signoff
            type: io.kestra.plugin.core.flow.Pause
            description: Pauses the pipeline until an AP Controller reviews the held exceptions and records a disposition decision.
            onResume:
              - id: controller_decision
                type: SELECT
                values:
                  - RELEASE_AUTO_APPROVED_AND_QUARANTINE_HELD
                  - OVERRIDE_AND_RELEASE_ALL
                  - REJECT_ENTIRE_BATCH
                defaults: RELEASE_AUTO_APPROVED_AND_QUARANTINE_HELD
                description: Select the Accounts Payable Controller disposition for the current batch.
              - id: controller_notes
                type: STRING
                defaults: "Verified 3-way match audit report; release clean batch and issue vendor debit memos for held invoices."
                description: Audit log note recorded by the approving Controller.

          - id: log_controller_disposition
            type: io.kestra.plugin.core.log.Log
            description: Records the Controller's interactive approval decision and audit note.
            message: "Controller disposition recorded: {{ outputs.await_controller_signoff.onResume.controller_decision }}, Notes: {{ outputs.await_controller_signoff.onResume.controller_notes }}"
    else:
      - id: log_clean_batch_posting
        type: io.kestra.plugin.core.log.Log
        description: Logs clean audit confirmation when 100% of invoices pass 3-way matching within tolerance.
        message: "All {{ outputs.expose_reconciliation_metrics.values.auto_approved_count }} invoice(s) (${{ outputs.expose_reconciliation_metrics.values.auto_approved_amount_usd }}) passed 3-way match tolerances with zero held exceptions. Ready for ERP payment run."

extend:
  title: Accounts Payable 3-Way Match with DuckDB, AI Triage, and Approval Gate
  shortDescription: Reconcile Purchase Orders, Goods Receipt Notes, and Vendor Invoices in DuckDB to block overbilling and duplicate payments.
  metaTitle: Accounts Payable 3-Way Match with DuckDB & AI Exception Triage
  metaDescription: Reconcile Purchase Orders, Goods Receipts, and Vendor Invoices with DuckDB SQL, isolate AP variances, and optionally run Gemini AI triage and approval gates.
  description: |
    Accounts Payable (AP) teams lose significant working capital to duplicate vendor invoices, unreceived goods billing, quantity overbilling on partial deliveries, and unauthorized unit price hikes. Manually cross-checking Purchase Orders (POs), warehouse Goods Receipt Notes (GRNs), and inbound Vendor Invoices in spreadsheets slows down payment cycles and lets costly variances slip into ERP payment runs.

    This blueprint automates deterministic **Accounts Payable 3-Way Matching** using embedded DuckDB SQL and Python, partitioning inbound invoices into a clean ERP payment batch (`auto_approved_erp_batch.csv`) and a quarantined exception report (`held_exceptions_report.csv`). By default, it runs completely self-contained with realistic sample data and zero external credentials required, while providing one-click toggles for **Google Gemini AI dispute drafting**, **Slack alerting**, and **human-in-the-loop Controller approval gating**.

    ## How it works

    1. `stage_ap_documents` (`io.kestra.plugin.scripts.python.Script`) normalizes the inbound `purchase_orders`, `goods_receipts`, and `vendor_invoices` JSON inputs into staging CSV files. Toggling `inject_discrepancies` (`true` by default) lets you test either the 6-invoice discrepancy scenario or a 100% clean batch.
    2. `reconcile_three_way_match` (`io.kestra.plugin.jdbc.duckdb.Query`) joins Purchase Orders, aggregated Goods Receipt quantities (`SUM(accepted_qty)` per PO and SKU), and deduplicated Vendor Invoices (`ROW_NUMBER() OVER (PARTITION BY vendor_id, vendor_invoice_number, item_sku)`). It evaluates deterministic control rules against configurable `price_tolerance_pct` (default `2.0%`) and `qty_tolerance_pct` (default `0.0%`):
       - `DUPLICATE_INVOICE`: Blocks duplicate submissions of the same vendor invoice number (`INV-7006` duplicating `APEX-88410`).
       - `MISSING_RECEIPT`: Holds invoices billed before any warehouse Goods Receipt Note is recorded (`INV-7004` with `0` received units).
       - `QTY_OVERBILLED`: Flags invoices billing for more units than accepted on the warehouse GRN (`INV-7002` billing `50` units against `40` received).
       - `INVALID_UNIT_PRICE`: Quarantines records where either the contracted PO unit price or the billed unit price is negative (`< 0.0`).
       - `PRICE_VARIANCE_EXCEEDED`: Flags unit price overcharges exceeding `price_tolerance_pct` (`INV-7003` at `+10.0%` variance), as well as any positive charge (`billed_unit_price > 0.0`) against a zero-price PO line (`po_unit_price = 0.0`), while auto-approving zero-for-zero lines and minor variances within tolerance (`INV-7005` at `+1.0%` variance).
    3. `generate_erp_and_exception_batches` (`io.kestra.plugin.scripts.python.Script`) splits the reconciled dataset into `auto_approved_erp_batch.csv` and `held_exceptions_report.csv`, writes `reconciliation_metrics.json`, renders an executive Markdown audit table (`ap_three_way_match_audit_report.md`), and emits structured metrics via Kestra's stdout output protocol (`::{"outputs": ...}::`).
    4. `expose_reconciliation_metrics` (`io.kestra.plugin.core.output.OutputValues`) publishes structured counts and dollar variance metrics to the execution outputs.
    5. `route_reconciliation_outcome` (`io.kestra.plugin.core.flow.If`) branches on `held_exceptions_count > 0`. When exceptions exist, it logs the hold summary and evaluates three optional governance gates:
       - `check_ai_triage_enabled` (`enable_ai_triage: true`): Calls `io.kestra.plugin.ai.completion.ChatCompletion` with Google Gemini to draft vendor debit memos and ERP remediation steps (`save_ai_triage_memo`).
       - `check_slack_alert_enabled` (`send_slack_alert: true`): Posts an exception summary card via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
       - `check_human_approval_required` (`require_human_approval: true`): Pauses the execution via `io.kestra.plugin.core.flow.Pause` (`await_controller_signoff`) to record the Controller's disposition and audit notes.

    ## What you get

    - **Ready-to-post ERP Batch** (`{{ outputs.generate_erp_and_exception_batches.outputFiles['auto_approved_erp_batch.csv'] }}`): Clean invoices verified against PO prices and warehouse receipts.
    - **Quarantined Exceptions Report** (`{{ outputs.generate_erp_and_exception_batches.outputFiles['held_exceptions_report.csv'] }}`): Held invoices with exact `exception_code`, `line_variance_usd`, `price_variance_pct`, `overbilled_qty`, and human-readable `hold_explanation`.
    - **Executive Markdown Audit Report** (`{{ outputs.generate_erp_and_exception_batches.outputFiles['ap_three_way_match_audit_report.md'] }}`): Formatted summary tables for internal audit and SOX control evidence.
    - **Structured Execution Metrics** (`{{ outputs.expose_reconciliation_metrics.values }}`): `total_invoices_evaluated`, `auto_approved_count`, `held_exceptions_count`, `auto_approved_amount_usd`, `held_exposure_amount_usd`, and `held_overcharge_variance_usd`.
    - **Optional AI Dispute Memo** (`{{ outputs.save_ai_triage_memo.uri }}`): Generated when `enable_ai_triage` is set to `true`.

    ## Who it's for

    - Finance Automation and FinOps Engineers building automated procurement-to-pay (P2P) controls.
    - Accounts Payable Controllers seeking deterministic SQL guardrails combined with optional LLM dispute drafting.
    - Data Engineers integrating ERP subledgers (NetSuite, SAP, Dynamics, Coupa, or Stripe Billing) with warehouse receiving logs.

    ## Prerequisites

    - **Default dry-run mode requires zero external credentials or services.** You can click **Execute** immediately using the built-in PO, GRN, and Invoice datasets.
    - To enable optional integrations, configure the corresponding namespace secrets:

    ### Secrets

    - `AP_WEBHOOK_KEY`: Authentication key for the `erp_invoice_batch_webhook` trigger.
    - `GEMINI_API_KEY`: Google Gemini API key (required only when `enable_ai_triage` is set to `true`).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL (required only when `send_slack_alert` is set to `true`).

    ## Quick start

    1. Click **Execute** with the default inputs (`inject_discrepancies: true`, `price_tolerance_pct: 2.0`) to run the 6-invoice 3-way match demo without any secrets.
    2. Open the **Outputs** tab to download `auto_approved_erp_batch.csv` (`2` approved invoices totaling `$37,120.00`), `held_exceptions_report.csv` (`4` held invoices totaling `$49,900.00` in exposure and `$36,100.00` in variance), and `ap_three_way_match_audit_report.md`.
    3. Re-run with `inject_discrepancies: false` to verify the clean-batch branch (`else` path) where `100%` of invoices pass.
    4. Optionally set `enable_ai_triage: true` (with `GEMINI_API_KEY`), `send_slack_alert: true` (with `SLACK_WEBHOOK_URL`), or `require_human_approval: true` to test the full exception governance workflow.

    ## Links

    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra AI Plugin Documentation](https://kestra.io/plugins/plugin-ai)
    - [Kestra Slack Notifications Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - This blueprint has been created by [Sufiyan367](https://github.com/Sufiyan367)
