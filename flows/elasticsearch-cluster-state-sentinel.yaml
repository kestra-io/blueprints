id: elasticsearch-cluster-state-sentinel
namespace: company.team

inputs:
  - id: elasticsearch_host
    type: STRING
    defaults: elasticsearch.internal:9200
    description: Host and port of the Elasticsearch cluster endpoint.

  - id: elasticsearch_user
    type: STRING
    defaults: elastic
    description: Elasticsearch username.

tasks:
  - id: query_cluster_health
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.elasticsearch_host }}"
      ES_USER: "{{ inputs.elasticsearch_user }}"
      ES_PASSWORD: "{{ secret('ELASTICSEARCH_PASSWORD') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "elasticsearch.internal:9200")
      user = os.environ.get("ES_USER", "elastic")
      password = os.environ.get("ES_PASSWORD", "")

      auth = (user, password) if user and password else None
      url = f"http://{host}/_cluster/health"

      try:
          resp = requests.get(url, auth=auth, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"CRITICAL: Failed to query Elasticsearch cluster health at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      status = data.get("status", "unknown")
      unassigned = data.get("unassigned_shards", 0)
      active_shards_pct = data.get("active_shards_percent_as_number", 100.0)
      is_degraded = status in ("yellow", "red") or unassigned > 0

      result = {
          "status": status,
          "unassigned_shards": unassigned,
          "active_shards_percent": active_shards_pct,
          "number_of_nodes": data.get("number_of_nodes", 0),
          "alert_triggered": is_degraded
      }

      with open("health_summary.json", "w") as out:
          json.dump(result, out, indent=2)

      Kestra.outputs({
          "status": status,
          "unassigned_shards": unassigned,
          "active_shards_percent": active_shards_pct,
          "number_of_nodes": data.get("number_of_nodes", 0),
          "alert_triggered": is_degraded
      })
      print("Elasticsearch cluster health:", result)
    outputFiles:
      - health_summary.json

  - id: evaluate_cluster_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_cluster_health.vars.alert_triggered }}"
    then:
      - id: alert_es_administrators
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":rotating_light: *Elasticsearch Health Alert*: Cluster on {{ inputs.elasticsearch_host }} is in `{{ outputs.query_cluster_health.vars.status }}` state (Active shards: {{ outputs.query_cluster_health.vars.active_shards_percent }}%, Unassigned shards: {{ outputs.query_cluster_health.vars.unassigned_shards }})."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":warning: *Elasticsearch Sentinel Execution Failure*: Failed to query cluster health on {{ inputs.elasticsearch_host }}. Execution ID: {{ execution.id }}."
      }

triggers:
  - id: scheduled_health_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Elasticsearch cluster health status to detect red/yellow states and unassigned shards threatening data availability."
  metaTitle: Elasticsearch Cluster Health State and Degraded Shard Sentinel with Kestra
  title: Elasticsearch Cluster Health State and Degraded Shard Sentinel
  shortDescription: Audits Elasticsearch cluster health status to detect red/yellow states and unassigned shards threatening data availability.
  description: |
    ## How it works
    This sentinel queries the Elasticsearch `/_cluster/health` API to inspect the overall cluster state. It flags yellow (replica shard unassigned) and red (primary shard unassigned) conditions, providing immediate incident notification before data loss or search degradation impacts users.

    ## What you get
    - Rapid detection of node dropouts, split-brain conditions, and shard allocation stalls.
    - Continuous validation that 100% of primary and replica shards are active and healthy.
    - Automated Slack incident delivery indicating cluster state, node counts, and unassigned shard quantities.

    ## Who it's for
    - Search infrastructure engineers and SREs supervising Elasticsearch or OpenSearch clusters.
    - Platform teams ensuring high availability for critical search and logging pipelines.

    ## Why orchestrate this with Kestra
    Kestra automates distributed search cluster observability, executing scheduled health checks with fine-grained error management and notification routing.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_health_check Schedule Trigger] --> B[query_cluster_health Python Script]
      B --> C{Cluster Degraded?}
      C -- Yes --> D[alert_es_administrators Slack Webhook]
      C -- No --> E[Cluster Healthy]
    ```

    ## Prerequisites
    - Elasticsearch HTTP endpoint reachability (default 9200).
    - Secrets `ELASTICSEARCH_PASSWORD` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra under the `company.team` namespace.
    2. Set `elasticsearch_host` and credentials.
    3. Run manually to check current cluster health.

    ## How to extend
    - Query `/_cluster/allocation/explain` automatically when status is yellow/red to diagnose root cause.
    - Trigger automated node provisioning on Kubernetes when node count drops.
    - Forward health metrics to Datadog or Prometheus.

    ## Links
    - [Elasticsearch Cluster Health API](https://www.elastic.co/guide/en/elasticsearch/reference/current/cluster-health.html)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
