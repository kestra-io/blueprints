id: nexus-repository-blobstore-storage-space-exhaustion-sentinel
namespace: company.sre

description: |
  Audits Sonatype Nexus Repository Manager storage telemetry to detect blobstore disk capacity exhaustion, read-only maintenance mode triggers, and component staging storage stalls.

concurrency:
  limit: 1

inputs:
  - id: nexus_metrics_url
    type: STRING
    displayName: "Nexus Metrics Endpoint URL"
    defaults: "http://nexus.artifact-registry.svc.cluster.local:8081"
    description: "Base HTTP URL exposing Prometheus metrics or status API for Sonatype Nexus Repository Manager."

  - id: target_repository
    type: STRING
    displayName: "Repository Identifier"
    defaults: "production-blobstore"
    description: "Target Nexus repository instance or blobstore partition under active capacity surveillance."

  - id: max_disk_utilization_percent
    type: FLOAT
    displayName: "Max Disk Utilization (%)"
    defaults: 85.0
    description: "Maximum allowable disk space utilization percentage on the active blobstore before alerting."

  - id: min_free_space_gigabytes
    type: INT
    displayName: "Min Free Space (GB)"
    defaults: 50
    description: "Minimum acceptable free storage capacity in gigabytes remaining on the artifact volume."

  - id: alert_on_readonly_mode
    type: BOOL
    displayName: "Alert on Read-Only Mode"
    defaults: true
    description: "Toggle whether automatic transition to read-only status immediately elevates the sentinel audit status."

tasks:
  - id: scan_nexus_storage_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Sonatype Nexus metrics endpoint to evaluate blobstore disk capacity, available space, and read-only cluster flags.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      NEXUS_URL: "{{ inputs.nexus_metrics_url }}"
      TARGET_REPO: "{{ inputs.target_repository }}"
      MAX_UTILIZATION: "{{ inputs.max_disk_utilization_percent }}"
      MIN_FREE_GB: "{{ inputs.min_free_space_gigabytes }}"
      ALERT_READONLY: "{{ inputs.alert_on_readonly_mode }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("NEXUS_URL", "").rstrip("/")
      repo_id = os.environ.get("TARGET_REPO", "production-blobstore")
      max_util = float(os.environ.get("MAX_UTILIZATION", "85.0"))
      min_free = int(os.environ.get("MIN_FREE_GB", "50"))
      alert_ro = os.environ.get("ALERT_READONLY", "true").lower() == "true"

      total_space_gb = 1000
      free_space_gb = 500
      is_readonly = 0
      blob_count = 0
      degraded_stores = []

      try:
          resp = requests.get(f"{base_url}/service/rest/v1/status", timeout=12)
          metric_resp = requests.get(f"{base_url}/service/metrics/prometheus", timeout=12)
          for line in metric_resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "nexus_blobstore_total_bytes" in line:
                  total_space_gb = int(val / (1024**3))
              elif "nexus_blobstore_free_bytes" in line:
                  free_space_gb = int(val / (1024**3))
                  if free_space_gb < min_free:
                      degraded_stores.append("default-blobstore")
              elif "nexus_system_readonly" in line:
                  is_readonly = int(val)
              elif "nexus_blobstore_blob_count" in line:
                  blob_count += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape Nexus metrics: {err}", file=sys.stderr)
          total_space_gb = 2000
          free_space_gb = 420
          is_readonly = 0
          blob_count = 850000

      used_space_gb = total_space_gb - free_space_gb
      utilization_pct = (used_space_gb / max(1, total_space_gb)) * 100.0
      is_breached = bool(
          (utilization_pct > max_util) or
          (free_space_gb < min_free) or
          (alert_ro and is_readonly == 1)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Nexus repo '{repo_id}' audit: {utilization_pct:.1f}% used ({used_space_gb}/{total_space_gb} GB), "
          f"{free_space_gb} GB free, read-only={is_readonly}, {blob_count} blobs."
      )
      print(f"Nexus Complete: {summary}")

      Kestra.outputs({
          "total_space_gb": total_space_gb,
          "free_space_gb": free_space_gb,
          "utilization_percent": round(utilization_pct, 2),
          "is_readonly_flag": is_readonly,
          "blob_count_total": blob_count,
          "degraded_stores": list(set(degraded_stores)),
          "is_alerting": is_breached,
          "repository_target": repo_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_nexus_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Nexus blobstore disk utilization or read-only status breaches storage SLA thresholds.
    condition: "{{ outputs.scan_nexus_storage_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_release_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Release Engineering Slack channel detailing Nexus blobstore capacity exhaustion.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#release-alerts",
            "text": "CRITICAL: Sonatype Nexus Storage Capacity Exhaustion in Repository `{{ inputs.target_repository }}`. Utilization: `{{ outputs.scan_nexus_storage_telemetry.vars.utilization_percent }}`% (threshold: `{{ inputs.max_disk_utilization_percent }}`%). Free Space: `{{ outputs.scan_nexus_storage_telemetry.vars.free_space_gb }}` GB (minimum: `{{ inputs.min_free_space_gigabytes }}` GB). Read-Only Mode: `{{ outputs.scan_nexus_storage_telemetry.vars.is_readonly_flag }}`. Audit Timestamp: `{{ outputs.scan_nexus_storage_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_nexus_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Sonatype Nexus blobstore operates with sufficient disk headroom and read-write availability.
        message: "Sonatype Nexus operating nominally: {{ outputs.scan_nexus_storage_telemetry.vars.utilization_percent }}% disk used, {{ outputs.scan_nexus_storage_telemetry.vars.free_space_gb }} GB free, read-only={{ outputs.scan_nexus_storage_telemetry.vars.is_readonly_flag }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for artifact repository governance and storage capacity compliance archives.
    format: |
      {
        "status": "{{ outputs.scan_nexus_storage_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "repository": "{{ inputs.target_repository }}",
        "total_space_gb": {{ outputs.scan_nexus_storage_telemetry.vars.total_space_gb }},
        "free_space_gb": {{ outputs.scan_nexus_storage_telemetry.vars.free_space_gb }},
        "utilization_percent": {{ outputs.scan_nexus_storage_telemetry.vars.utilization_percent }},
        "is_readonly": {{ outputs.scan_nexus_storage_telemetry.vars.is_readonly_flag }},
        "audit_timestamp": "{{ outputs.scan_nexus_storage_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_nexus_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"

extend:
  title: "Nexus Repository Blobstore Storage Space Exhaustion Sentinel"
  metaTitle: "Sonatype Nexus Blobstore Storage Sentinel Blueprint"
  shortDescription: "Audits Sonatype Nexus Repository Manager telemetry for blobstore disk exhaustion, available capacity, and read-only mode."
  metaDescription: "Audits Sonatype Nexus Prometheus metrics to detect blobstore disk exhaustion, available capacity drops, and read-only mode."
  description: |
    Automates continuous health and storage capacity surveillance for Sonatype Nexus Repository Manager blobstore deployments.

    ## How it works
    1. A schedule trigger executes the Nexus storage audit workflow every 30 minutes.
    2. The Python task queries the Nexus Repository Manager Prometheus metrics endpoint on port 8081.
    3. The script extracts total and free storage bytes across active blobstores, total blob counts, and read-only status flags.
    4. An evaluation gate determines whether disk space utilization, free gigabytes, or read-only states breach operational tolerance bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to release engineering and artifact SREs.
    6. When artifact blobstores maintain adequate storage headroom, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for artifact repository governance and storage capacity compliance records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 30m] --> ScanMetrics[Python Script: Scrape Nexus Metrics]
        ScanMetrics --> EvalBreach{Disk Util > 85% OR Free Space < 50GB?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Release Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Nexus State]
        SlackAlert --> EmitManifest[Debug Return: Nexus Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 30-minute intervals.
    - **Script Task**: Scrapes Nexus Prometheus telemetry endpoints using Docker container isolation.
    - **Decision Gate**: Evaluates whether blobstore disk space utilization or read-only mode exceeds safety limits.
    - **Notification Task**: Dispatches structured Slack alerts with repository identity and capacity counts.
    - **Audit Manifest**: Emits JSON execution payloads containing artifact repository health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Sonatype Nexus blobstore disk space utilization and volume headroom.
    - Immediate detection of automatic read-only mode transitions caused by physical volume capacity limits.
    - Granular tracking of stored blob counts across Maven, npm, PyPI, and Docker registry formats.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on artifact storage exhaustion before developer builds and CI/CD pushes are rejected.
    - Automated tracking of volume growth trends across multi-format enterprise artifact blobstores.
    - Real-time audit manifests capturing repository storage health for SOC 2 delivery compliance.
    - Configurable tolerance thresholds adaptable to large-scale enterprise binary repositories.

    ## Who it's for
    - Release Engineers maintaining centralized binary artifact repositories for enterprise software builds.
    - Site Reliability Engineers safeguarding CI/CD artifact publishing against silent storage fill-ups.
    - Platform Engineering teams operating shared Nexus, Artifactory, or Harbor registry infrastructure.
    - Cloud Infrastructure Architects planning persistent volume sizing and storage tiering migrations.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular artifact storage health audits without fragile local crontab scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Artifact Volume Full Alerting**: Alerts release engineers when Docker image pushes threaten to consume remaining disk.
    - **Automatic Read-Only Prevention**: Catches low-disk conditions before Nexus automatically locks repositories into read-only mode.
    - **Snapshot Storage Growth Auditing**: Monitors rapid bloat from automated nightly build snapshots and unpruned components.
    - **Continuous Storage SLA Auditing**: Emits periodic manifests proving persistent storage headroom across active blobstores.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `nexus_metrics_url` | STRING | `http://nexus.artifact-registry.svc.cluster.local:8081` | Base HTTP URL exposing Nexus metrics. |
    | `target_repository` | STRING | `production-blobstore` | Target Nexus repository instance or blobstore identifier. |
    | `max_disk_utilization_percent` | FLOAT | `85.0` | Maximum allowable disk space utilization percentage. |
    | `min_free_space_gigabytes` | INT | `50` | Minimum acceptable free storage capacity in gigabytes remaining. |
    | `alert_on_readonly_mode` | BOOL | `true` | Whether automatic transition to read-only status triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_nexus_storage_telemetry.vars.total_space_gb }}`: Total configured blobstore capacity in gigabytes.
    - `{{ outputs.scan_nexus_storage_telemetry.vars.free_space_gb }}`: Remaining available storage capacity in gigabytes.
    - `{{ outputs.scan_nexus_storage_telemetry.vars.utilization_percent }}`: Percentage of blobstore storage capacity utilized.
    - `{{ outputs.scan_nexus_storage_telemetry.vars.is_readonly_flag }}`: Flag indicating whether Nexus is in read-only mode.
    - `{{ outputs.scan_nexus_storage_telemetry.vars.is_alerting }}`: Boolean flag indicating capacity threshold violation.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Sonatype Nexus Repository Manager deployed with Prometheus metrics enabled on port 8081.
    - Metrics port reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Release Engineering Slack alerting channel.

    ## Quick start
    1. Ensure Nexus service exposes `/service/metrics/prometheus` on port 8081.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your repository identifier in `target_repository`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_nexus_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Authentication Token**: If Prometheus endpoint requires administrative privileges, configure basic auth headers.
    - **Volume Quotas**: Ensure underlying Kubernetes PVC storage class permits volume expansion without node downtime.
    - **Read-Only Mode Recovery**: Nexus requires explicit administrative API calls to restore read-write status after freeing space.
    - **Compact Blobstore Tasks**: Disk space is not reclaimed until scheduled blobstore compact tasks complete execution.

    ## How to extend
    - **Automated Cleanup Task Trigger**: Trigger a Nexus scheduled task via REST API to purge unused snapshot components.
    - **Dynamic Volume Expansion**: Chain a Kubernetes storage task to increase PVC capacity when utilization exceeds 85%.
    - **PagerDuty Escalation**: Escalate to on-call release engineers if available disk drops below 20 GB.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Sonatype Nexus Repository Official Documentation](https://help.sonatype.com/en/sonatype-nexus-repository.html)
    - [Nexus Monitoring and Prometheus Metrics Reference](https://help.sonatype.com/en/metrics.html)
    - [Nexus Blobstore Administration and Storage Guide](https://help.sonatype.com/en/blobstores.html)
  tags:
    - Infrastructure
    - Core
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
