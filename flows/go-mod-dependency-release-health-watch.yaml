id: go-mod-dependency-release-health-watch
namespace: company.team
description: |
  Audits the Go dependencies declared in a go.mod file against the official Go Module Proxy (proxy.golang.org).
  It checks whether pinned module versions lag behind the latest release, use unreleased pseudo-versions,
  or have had no updates for a long time (stale), and sends a Slack alert only when new issues are detected.

inputs:
  - id: go_mod_url
    type: STRING
    description: Raw HTTPS URL of the go.mod file to inspect. Works for any public repository on GitHub, GitLab, etc.
    defaults: https://raw.githubusercontent.com/gin-gonic/gin/master/go.mod
  - id: direct_only
    type: BOOL
    description: When true, only direct dependencies are audited, skipping "// indirect" requirements.
    defaults: true
  - id: max_modules
    type: INT
    description: Maximum number of modules to audit in a single execution.
    defaults: 25
  - id: outdated_threshold
    type: SELECT
    description: Minimum version lag required to mark a dependency as OUTDATED. Selecting major checks only for major version differences (or minor for 0.x packages).
    values:
      - major
      - minor
      - patch
    defaults: major
  - id: stale_after_days
    type: INT
    description: A module is flagged as STALE if its latest release is older than this many days.
    defaults: 365

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every Monday at 08:00 UTC. Disabled by default until you configure the Slack incoming webhook.
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: fetch_go_mod
    type: io.kestra.plugin.core.http.Request
    description: Download the go.mod file from the specified URL.
    uri: "{{ inputs.go_mod_url }}"
    method: GET

  - id: list_modules
    type: io.kestra.plugin.transform.jsonata.TransformValue
    description: Parse required modules and versions from go.mod, optionally filter indirect dependencies, and limit to max_modules.
    from: "{{ outputs.fetch_go_mod.body }}"
    expression: |
      (
        $lines := $split($, "\n");
        $depLines := $lines[$contains($, /^[ \t]*(require[ \t]+)?[a-zA-Z0-9_.-]+(\/[a-zA-Z0-9_.-]+)+[ \t]+v[0-9]/)];
        $filterLines := {{ inputs.direct_only }} ? $depLines[$not($contains($, "// indirect"))] : $depLines;
        $parsed := $filterLines.{
          "name": $replace($, /^[ \t]*(require[ \t]+)?([a-zA-Z0-9_.-]+(\/[a-zA-Z0-9_.-]+)+)[ \t]+(v[0-9][a-zA-Z0-9_.-]*).*$/, "$2"),
          "pinned": $replace($, /^[ \t]*(require[ \t]+)?([a-zA-Z0-9_.-]+(\/[a-zA-Z0-9_.-]+)+)[ \t]+(v[0-9][a-zA-Z0-9_.-]*).*$/, "$4"),
          "isIndirect": $contains($, "// indirect")
        };
        $parsed[[0..{{ inputs.max_modules }} - 1]]
      )

  - id: check_modules
    type: io.kestra.plugin.core.flow.Loop
    description: Query the official Go Module Proxy for each module and assess release health against the pinned version.
    values: "{{ outputs.list_modules.value | toJson }}"
    concurrencyLimit: 2
    outputs:
      - id: verdict
        type: JSON
        value: "{{ outputs.assess_health.value }}"
    tasks:
      - id: fetch_proxy_metadata
        type: io.kestra.plugin.core.http.Request
        description: Query the official Go Module Proxy (@latest endpoint) for current release metadata.
        uri: "https://proxy.golang.org/{{ item.value.name }}/@latest"
        method: GET
        headers:
          Accept: "application/json"
        retry:
          type: constant
          interval: PT3S
          maxAttempts: 3

      - id: assess_health
        type: io.kestra.plugin.transform.jsonata.TransformValue
        description: Assess whether the pinned version is outdated, a pseudo-version, or stale.
        from: "{{ outputs.fetch_proxy_metadata.body }}"
        expression: |
          (
            $pinned := "{{ item.value.pinned }}";
            $latest := Version ? Version : $pinned;
            $releaseTime := Time;
            $age := $releaseTime ? ($toMillis($now()) - $toMillis($releaseTime)) / 86400000 : 0;
            $cleanP := $replace($replace($pinned, /^v/, ""), /[-+].*$/, "");
            $cleanL := $replace($replace($latest, /^v/, ""), /[-+].*$/, "");
            $p := $split($cleanP, ".");
            $l := $split($cleanL, ".");
            $isPseudo := $contains($pinned, "-") and $contains($pinned, "0.0.0-");
            $behind := (
              ($number($l[0]) > $number($p[0]) or ($p[0] = "0" and $l[0] = "0" and $number($l[1]) > $number($p[1]))) ? 3
              : ($number($l[0]) = $number($p[0]) and $number($l[1]) > $number($p[1])) ? 2
              : ($pinned != $latest and $pinned != "latest") ? 1
              : 0
            );
            $needed := {"major": 3, "minor": 2, "patch": 1}."{{ inputs.outdated_threshold }}";
            $status := $isPseudo ? "PSEUDO_VERSION"
              : ($latest = null or $latest = "") ? "UNKNOWN_MODULE"
              : $age > {{ inputs.stale_after_days }} ? "STALE"
              : $behind >= $needed ? "OUTDATED"
              : "OK";
            {
              "module": "{{ item.value.name }}",
              "pinned": $pinned,
              "latest": $latest,
              "status": $status,
              "isIndirect": {{ item.value.isIndirect }},
              "latestAgeDays": $round($age),
              "requiresAttention": $status != "OK"
            }
          )

      - id: pause_for_rate_limit
        type: io.kestra.plugin.core.flow.Pause
        description: Pause briefly between module lookups to respect Go module proxy rate limits.
        pauseDuration: PT0.5S

  - id: summarize
    type: io.kestra.plugin.transform.jsonata.TransformValue
    description: Aggregate verdicts into a health digest with counts and actionable items.
    from: "{{ outputs.check_modules.verdict | default([]) | toJson }}"
    expression: |
      (
        $reports := $;
        $issues := $reports[requiresAttention = true];
        $counts := {
          "total": $count($reports),
          "outdated": $count($reports[status = "OUTDATED"]),
          "pseudo": $count($reports[status = "PSEUDO_VERSION"]),
          "stale": $count($reports[status = "STALE"]),
          "unknown": $count($reports[status = "UNKNOWN_MODULE"]),
          "ok": $count($reports[status = "OK"])
        };
        {
          "counts": $counts,
          "issues": $issues,
          "hasIssues": $count($issues) > 0,
          "digest": $issues.{
            "module": module,
            "pinned": pinned,
            "latest": latest,
            "status": status,
            "latestAgeDays": latestAgeDays
          }
        }
      )

  - id: previous_report
    type: io.kestra.plugin.core.kv.Get
    description: Retrieve the previous health digest from Kestra's KV store.
    key: "go_mod_report_{{ inputs.go_mod_url | slugify }}"
    errorOnMissing: false

  - id: alert_if_new
    type: io.kestra.plugin.core.flow.If
    description: Send a Slack alert only if issues exist and the digest has changed since the last execution.
    condition: "{{ outputs.summarize.value.hasIssues and (outputs.previous_report.value != (outputs.summarize.value.digest | toJson)) }}"
    then:
      - id: send_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the Go module dependency health summary to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🐹 *Go Module Dependency Health Alert (Go Proxy)*",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🐹 Go Module Dependency Health Alert",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Manifest:* `{{ inputs.go_mod_url }}`\n*Total audited:* {{ outputs.summarize.value.counts.total }} | *Issues found:* {{ outputs.summarize.value.counts.total - outputs.summarize.value.counts.ok }}\n• Outdated: {{ outputs.summarize.value.counts.outdated }} | Pseudo-version: {{ outputs.summarize.value.counts.pseudo }} | Stale: {{ outputs.summarize.value.counts.stale }}"
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Actionable Modules:*\n{% for item in outputs.summarize.value.digest %}• *{{ item.module }}*: pinned `{{ item.pinned }}` → latest `{{ item.latest }}` [{{ item.status }}]{% if item.latestAgeDays > 0 %} (latest release {{ item.latestAgeDays }}d ago){% endif %}\n{% endfor %}"
                }
              }
            ]
          }

  - id: remember_report
    type: io.kestra.plugin.core.kv.Set
    description: Store the current digest in KV to prevent redundant alerts on subsequent executions.
    key: "go_mod_report_{{ inputs.go_mod_url | slugify }}"
    value: "{{ outputs.summarize.value.digest | toJson }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Notify Slack when the Go module dependency audit encounters an unhandled execution error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Go Module Dependency Health Watch Failed*\nFlow `{{ flow.id }}` in namespace `{{ flow.namespace }}` failed execution `{{ execution.id }}` while fetching `{{ inputs.go_mod_url }}`."
      }

extend:
  title: Go Modules Dependency Health Check with Go Proxy Registry
  metaTitle: Go Modules Dependency Health Check with Go Proxy Registry and Kestra
  shortDescription: Audits go.mod dependencies against the Go Module Proxy for major version lag, pseudo-versions, and stale packages, alerting Slack on changes.
  metaDescription: Audit Go module dependencies from go.mod against the Go proxy registry for outdated, pseudo, and stale packages with automated Slack alerts and KV diffing.
  description: |
    Dependencies in a Go application often slip behind newer major versions or remain anchored to unreleased pseudo-versions without engineering teams realizing it. Instead of drowning in notifications from automated pull request bots for every minor release, this blueprint periodically inspects your `go.mod` file, queries the official Go Module Proxy (`proxy.golang.org`), and dispatches a prioritized Slack digest only when actionable version lag, pseudo-versions, or stale unmaintained packages are detected.

    ## How it works

    1. `weekly` (`io.kestra.plugin.core.trigger.Schedule`) triggers the workflow every Monday at 08:00 UTC (disabled by default until configured).
    2. `fetch_go_mod` (`io.kestra.plugin.core.http.Request`) downloads the raw `go.mod` file from `go_mod_url`.
    3. `list_modules` (`io.kestra.plugin.transform.jsonata.TransformValue`) parses module paths and pinned semantic versions, optionally skips indirect dependencies when `direct_only` is enabled, and limits the list to `max_modules`.
    4. `check_modules` (`io.kestra.plugin.core.flow.Loop`) iterates through each module. `fetch_proxy_metadata` queries the public Go Module Proxy `@latest` endpoint, and `assess_health` evaluates the pinned version against the proxy's current release, classifying it as `PSEUDO_VERSION`, `UNKNOWN_MODULE`, `STALE`, `OUTDATED`, or `OK`. `pause_for_rate_limit` pauses briefly between calls to respect proxy rate limits.
    5. `summarize` (`io.kestra.plugin.transform.jsonata.TransformValue`) consolidates module findings into an actionable health report.
    6. `previous_report` (`io.kestra.plugin.core.kv.Get`) retrieves the previous execution report from Kestra's KV store. `alert_if_new` (`io.kestra.plugin.core.flow.If`) posts to Slack only if actionable issues are detected and the report differs from the previous run. `remember_report` updates the KV store with the latest report state.
    7. The `errors` block catches network or parsing failures and posts an execution alert to Slack.

    ## What you get

    - Automated, scheduled auditing of Go dependencies against official Go Module Proxy metadata.
    - Detection of unreleased commit hashes (pseudo-versions) and stale packages with no releases in over a year.
    - Zero alert spam: identical reports are deduplicated via Kestra's KV store and sent only when status changes.
    - Dedicated failure handling informing the team if your repository or the Go Module Proxy becomes unreachable.

    ## Who it's for

    - Go backend engineers, platform developers, and cloud-native teams maintaining Go services and microservices.
    - DevOps engineers monitoring software supply-chain health and library obsolescence.

    ## Why orchestrate this with Kestra

    Building this logic as an ad-hoc cron script requires maintaining custom scheduling infrastructure, secret encryption, rate-limiting loops, state storage across runs, and error handling. Kestra provides declarative scheduling, built-in KV state persistence, visual execution logs, and robust retry mechanics in a portable YAML workflow.

    ## Prerequisites

    - HTTPS network access to `proxy.golang.org` and your raw `go.mod` URL.
    - A Slack incoming webhook URL for receiving notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch status reports and failure alerts (required).

    ## Quick start

    1. Store the `SLACK_WEBHOOK_URL` secret in your Kestra namespace (**Namespaces → Secrets**).
    2. Set `go_mod_url` to the raw HTTPS URL of your target `go.mod`.
    3. Click **Execute** in the Kestra UI to run an initial audit and inspect the `summarize` output.
    4. Enable the `weekly` schedule trigger to run automated recurring checks.

    ## How to extend

    - Set `direct_only: false` to audit transitive/indirect dependencies as well.
    - Increase `max_modules` to audit larger dependency manifests or monorepos.
    - Replace the Slack webhook task with Microsoft Teams, PagerDuty, or Discord notifications.

    ## Links

    - [Go Module Proxy Protocol Documentation](https://go.dev/ref/mod#goproxy-protocol)
    - [Kestra JSONata TransformValue Plugin](https://kestra.io/plugins/plugin-transform-json/jsonata/io.kestra.plugin.transform.jsonata.transformvalue)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
