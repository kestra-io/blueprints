id: mcp-governed-action-request
namespace: company.team

description: |
  MCP tool. Requests a destructive purge. Staging runs immediately; production returns
  status pending plus an approval_execution_id and waits for a human in the executor flow.
  Never blocks the agent on a human.

inputs:
  - id: environment
    type: SELECT
    required: true
    values:
      - staging
      - production
    description: Target environment. Production requires human approval.

  - id: days
    type: INT
    required: true
    min: 1
    max: 3650
    description: Number of days of rows to keep. Older rows are deleted.

  - id: key
    type: STRING
    required: true
    validator: '^[A-Za-z0-9_-]{1,64}$'
    description: Idempotency key. Only a key that expired, was rejected or failed can be claimed again.

variables:
  # Placeholders: replace with your own values.
  jdbc_url: jdbc:postgresql://demo-postgres:5432/demo
  jdbc_user: governed_actions

tasks:
  # Atomic claim: one INSERT ... ON CONFLICT statement, decided by the primary key.
  # A key can be claimed again only if its row is expired, rejected or failed, with the same environment and days.
  - id: claim_key
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ vars.jdbc_url }}"
    username: "{{ vars.jdbc_user }}"
    password: "{{ secret('PG_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      INSERT INTO public.governed_requests AS r (request_key, environment, days, status, request_execution_id)
      VALUES (CAST(:key AS text), CAST(:environment AS text), CAST(:days AS integer), 'claimed', CAST(:exec AS text))
      ON CONFLICT (request_key) DO UPDATE
      SET status = 'claimed', request_execution_id = EXCLUDED.request_execution_id,
          executor_execution_id = NULL, decided_by = NULL, updated_at = now()
      WHERE r.status IN ('expired', 'rejected', 'failed')
        AND r.environment = EXCLUDED.environment AND r.days = EXCLUDED.days
      RETURNING request_key
    parameters:
      key: "{{ inputs.key }}"
      environment: "{{ inputs.environment }}"
      days: "{{ inputs.days }}"
      exec: "{{ execution.id }}"

  # Only the winner of the claim starts an executor. A duplicate skips to the reads and ends SUCCESS.
  - id: winner_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.claim_key.size ?? 0) > 0 }}"
    then:
      - id: route_by_environment
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.environment == 'production' }}"
        then:
          # wait: false returns at once with the execution id: the agent never waits on a human.
          - id: request_production_approval
            type: io.kestra.plugin.core.flow.Subflow
            namespace: "{{ flow.namespace }}"
            flowId: mcp-governed-action-executor
            wait: false
            inputs:
              key: "{{ inputs.key }}"

          # Store the executor id right away so repeat calls can return it. The executor writes the same value.
          - id: record_executor_id
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ vars.jdbc_url }}"
            username: "{{ vars.jdbc_user }}"
            password: "{{ secret('PG_PASSWORD') }}"
            sql: |
              UPDATE public.governed_requests SET executor_execution_id = CAST(:eid AS text), updated_at = now()
              WHERE request_key = CAST(:key AS text) AND request_execution_id = CAST(:exec AS text) AND executor_execution_id IS NULL
            parameters:
              key: "{{ inputs.key }}"
              exec: "{{ execution.id }}"
              eid: "{{ outputs.request_production_approval.executionId }}"
        else:
          - id: run_staging
            type: io.kestra.plugin.core.flow.Subflow
            namespace: "{{ flow.namespace }}"
            flowId: mcp-governed-action-executor
            wait: true
            transmitFailed: false
            allowFailure: true
            inputs:
              key: "{{ inputs.key }}"

  - id: peek_request
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ vars.jdbc_url }}"
    username: "{{ vars.jdbc_user }}"
    password: "{{ secret('PG_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT status, environment, days, executor_execution_id FROM public.governed_requests WHERE request_key = CAST(:key AS text)
    parameters:
      key: "{{ inputs.key }}"

  # A duplicate that arrives a few milliseconds after the winner can see the row before the executor id is stored.
  # Wait one second, then read again.
  - id: settle_duplicate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.claim_key.size ?? 0) == 0 and (outputs.peek_request.row.executor_execution_id ?? '') == '' and ((outputs.peek_request.row.status ?? '') == 'claimed' or (outputs.peek_request.row.status ?? '') == 'pending') }}"
    then:
      - id: wait_for_executor_id
        type: io.kestra.plugin.core.flow.Sleep
        duration: PT1S

  - id: read_request
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ vars.jdbc_url }}"
    username: "{{ vars.jdbc_user }}"
    password: "{{ secret('PG_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT status, environment, days, executor_execution_id FROM public.governed_requests WHERE request_key = CAST(:key AS text)
    parameters:
      key: "{{ inputs.key }}"

  # conflict: the key exists with another environment or days.
  - id: classify_request
    type: io.kestra.plugin.core.output.OutputValues
    values:
      conflict: "{{ ((outputs.read_request.row.environment ?? inputs.environment) != inputs.environment or (outputs.read_request.row.days ?? inputs.days) != inputs.days) ? 'yes' : 'no' }}"

  - id: build_response
    type: io.kestra.plugin.core.output.OutputValues
    values:
      # claimed on production with an executor id means the executor has not written pending yet.
      status: >-
        {{ outputs.classify_request.values.conflict == 'yes' ? 'conflict'
           : (((outputs.read_request.row.status ?? '') == 'claimed' and inputs.environment == 'production' and (outputs.read_request.row.executor_execution_id ?? '') != '') ? 'pending'
           : (outputs.read_request.row.status ?? 'unknown')) }}
      approval_execution_id: "{{ outputs.classify_request.values.conflict == 'yes' ? '' : (outputs.request_production_approval.executionId ?? outputs.read_request.row.executor_execution_id ?? '') }}"
      duplicate: "{{ (outputs.claim_key.size ?? 0) == 0 }}"

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.build_response.values.status ?? 'unknown' }}"
  - id: request_id
    type: STRING
    value: "{{ inputs.key }}"
  - id: approval_execution_id
    type: STRING
    value: "{{ outputs.build_response.values.approval_execution_id ?? '' }}"
  - id: duplicate
    type: BOOL
    value: "{{ outputs.build_response.values.duplicate ?? true }}"

triggers:
  - id: mcp
    type: io.kestra.plugin.core.trigger.McpToolTrigger
    toolName: governed_action_request
    title: Request a governed purge
    toolDescription: >-
      Deletes rows older than `days` days from the demo table of an environment. Returns status,
      request_id, approval_execution_id and duplicate. Staging runs immediately and returns status
      executed, failed, or claimed (the executor could not claim the request), with the id of the
      executor execution. Production never runs immediately: it returns status pending and the
      approval_execution_id of the executor execution waiting for a human, and a human must approve
      it. approval_execution_id may be empty if the executor has not started yet. Do not wait for
      approval; call governed_action_status with the request_id later. Possible status values:
      pending, pending_unnotified, running, executed, rejected, expired, failed, claimed, conflict.
      Reusing a key returns the existing request with duplicate true and the same
      approval_execution_id. A key
      can be requested again only after it expired, was rejected or failed, with the same
      environment and days. The same key with a different environment or days returns status
      conflict, an empty approval_execution_id, and starts nothing.
    mcpServer: default
    annotations:
      readOnly: false
      destructive: true
      idempotent: false
      openWorld: true

extend:
  title: Governed MCP Action Request with Production Approval
  metaTitle: Governed MCP Action Request | Kestra Blueprint
  shortDescription: Expose a destructive action to an AI agent as an MCP tool, with an atomic Postgres claim per key and human approval for production.
  metaDescription: Let an AI agent request destructive actions over MCP. Staging runs freely, production needs human approval, duplicate keys are claimed once in Postgres.
  description: |
    Give an AI agent a destructive tool it can call over MCP, without giving it the power to approve itself. Staging runs immediately; production returns a request id at once, waits for a human in Kestra, and the same idempotency key can never trigger the purge twice.

    This blueprint is three flows that work together: `mcp-governed-action-request` (this MCP tool), `mcp-governed-action-executor` (claims the request, asks a human when needed, runs the purge) and `mcp-governed-action-status` (MCP tool to follow up a request).

    ## How it works

    1. `claim_key` inserts the request into `public.governed_requests`. The primary key makes this atomic: with `INSERT ... ON CONFLICT (request_key) DO UPDATE ... WHERE status IN ('expired','rejected','failed')`, concurrent calls with the same key claim it once.
    2. If the claim was won, the flow starts `mcp-governed-action-executor`: staging waits for it, production does not (the agent never waits on a human). For production, `record_executor_id` stores the executor execution id in the row.
    3. `peek_request`, `settle_duplicate` and `read_request` read the row. A duplicate that arrives a few milliseconds after the winner waits one second if the executor id is not stored yet.
    4. `build_response` returns the status. A key that exists with a different environment or days returns `conflict` and starts nothing. A key that was `executed` is never reused.

    ## Security model

    - MCP annotations (`destructive`, `readOnly`, `idempotent`, `openWorld`) are hints for the agent. They enforce nothing.
    - The Pause only waits. The purge is blocked by the explicit `decision == 'approve'` check and by SQL guards: the row must be `running` for this executor execution.
    - Approval is only as strong as who can call the resume endpoint (`POST /api/v1/{tenant}/executions/{id}/actions/resume`). On Kestra OSS 2.0.4, a private MCP server uses Kestra basic auth, the same login that can call that endpoint. Keep the login in the MCP client configuration, out of the agent's reach: never give the agent a shell, an HTTP tool, or a file it can read that holds those credentials.
    - A public MCP server needs no credentials: anyone who can reach it can request purges. Do not expose this tool on one.
    - The executor webhook has no authentication beyond its key (the `GOVERNED_EXECUTOR_WEBHOOK_KEY` secret). It cannot bypass approval, but anyone with the key can take over a `claimed` request.
    - The approver name is self-asserted text, not an authenticated identity.

    ## What you get

    - One MCP tool, `governed_action_request`, with a fixed set of status values and an `approval_execution_id` the agent can hand to a human.
    - An idempotency key claimed atomically in Postgres: concurrent calls with the same key start one request, and a key that was executed is never reused.
    - Staging that runs at once and production that returns at once and waits for a human, so the agent never blocks.
    - A purge and its `executed` status in one SQL statement, guarded so it only runs for an approved, claimed row.
    - The companion executor and status flows, and SQL for a least-privilege database role.

    ## Who it's for

    Teams that want to give AI agents write access to real systems, with a human in the loop for production. `purge_and_record` in the executor is the slot for your own destructive action: replace the demo `DELETE` with yours and keep its guards (the `EXISTS ... status = 'running'` check and the `executed` update in the same statement).

    ## Why orchestrate this with Kestra

    - Durable approval state: the request lives in Postgres and the approval in a paused Kestra execution, so nothing depends on the agent's session staying open.
    - Audit trail: every request, approval and purge is an execution, with `environment`, `decision` and `decided_by` labels on the executor, and the decision stored in the row.
    - Retries: the Slack notification is retried, calling the status tool re-sends it if it still failed after 10 minutes, and a request that expired, was rejected or failed can be made again with the same key.
    - The agent never blocks: production returns at once with the id of the execution waiting for approval, and the agent follows up with `governed_action_status`.

    ## Tested end to end

    On Kestra 2.0.4 OSS with Postgres 16, a private MCP server with basic auth and a local Slack stub. The flows ran unmodified (only `extend` removed, because the flow API rejects it), as the `governed_actions` role created by the SQL below. That SQL was run twice on a fresh database: both runs succeed, and the second changes nothing.

    - Staging success; production approve and deny; repeat call with the same key; conflict (other days or other environment); reuse after `expired`, `rejected` and `failed`.
    - Slack down: the request goes to `pending_unnotified`, approval still works, and calling the status tool re-sends the link after 10 minutes (tested by back-dating the row 11 minutes): one message, none before.
    - Restart after a failed purge deletes nothing and fails with "Nothing was deleted". A stuck `claimed` row is recovered by a direct run or a Restart.
    - Resume with no fields, with a wrong field, and with `deny` never reach the `DELETE`; an invalid value is rejected with 422. A real Pause expiry ends in `expired` with nothing deleted (tested with a 20-second copy of the pause, not the 1-hour literal).
    - The private MCP server returns 401 with no or wrong credentials; the webhook returns 404 for a wrong key.
    - Concurrency, with a database audit of every status change and every `DELETE` statement:
      - 50 concurrent calls, same staging key: 1 winner, 49 duplicates, 1 executor, 1 `DELETE`.
      - 50 concurrent calls, same production key: 1 winner, 49 duplicates, 1 executor waiting, 1 Slack message, nothing deleted before approval. Five simultaneous approvals: one accepted, four answered 409, one `DELETE`.
      - 50 distinct keys (25 staging, 25 production): 25 staging `DELETE`s, 25 Slack messages, then 13 approved and 12 denied gave 13 production `DELETE`s.
      - 25 keys with 50 webhook calls racing the starting executor: every key executed exactly once. For 5 of the 10 production keys the webhook won the claim, so the id returned to the agent pointed to an executor that did nothing.
      - No key was ever executed twice, and no status ever left `executed`.
    - Not covered: the real 1-hour expiry, opening the Slack link in a browser, more than one MCP server or tenant.

    ## Prerequisites

    - Postgres, with the database setup below.
    - Kestra with a private MCP server named `default`.
    - Secrets: `PG_PASSWORD` (password of the `governed_actions` role), `SLACK_WEBHOOK_URL` (Slack incoming webhook) and `GOVERNED_EXECUTOR_WEBHOOK_KEY` (a long random value). On Kestra OSS, secrets are `SECRET_`-prefixed, base64-encoded environment variables.
    - The placeholders in `variables`, replaced in all three flows.

    ### Database setup

    Run as a database owner. Replace the password. It is safe to run twice: the role is only created when missing and the demo rows are only inserted into empty tables. `CREATE TABLE IF NOT EXISTS` does not upgrade an older `governed_requests` table: drop or migrate it yourself.

    ```sql
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'governed_actions') THEN
        CREATE ROLE governed_actions LOGIN PASSWORD 'change-me';
      END IF;
    END
    $$;

    -- Demo target tables: the purge deletes old rows from these.
    CREATE SCHEMA IF NOT EXISTS staging;
    CREATE SCHEMA IF NOT EXISTS production;
    CREATE TABLE IF NOT EXISTS staging.demo_events (
      id bigserial PRIMARY KEY,
      payload text,
      created_at timestamptz NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS production.demo_events (
      id bigserial PRIMARY KEY,
      payload text,
      created_at timestamptz NOT NULL DEFAULT now()
    );

    -- Request state. The primary key on request_key makes the claim atomic.
    CREATE TABLE IF NOT EXISTS public.governed_requests (
      request_key           text PRIMARY KEY CHECK (request_key ~ '^[A-Za-z0-9_-]{1,64}$'),
      environment           text NOT NULL CHECK (environment IN ('staging', 'production')),
      days                  int  NOT NULL CHECK (days BETWEEN 1 AND 3650),
      status                text NOT NULL CHECK (status IN (
                              'claimed', 'pending', 'pending_unnotified', 'running',
                              'executed', 'rejected', 'expired', 'failed')),
      request_execution_id  text,
      executor_execution_id text,
      decided_by            text,
      created_at            timestamptz NOT NULL DEFAULT now(),
      updated_at            timestamptz NOT NULL DEFAULT now()
    );

    -- Least privilege: the flows can read and write request state and delete demo rows, nothing else.
    GRANT USAGE ON SCHEMA staging, production TO governed_actions;
    GRANT SELECT, DELETE ON staging.demo_events, production.demo_events TO governed_actions;
    GRANT SELECT, INSERT, UPDATE ON public.governed_requests TO governed_actions;

    -- Optional demo data: 5 old rows per environment, only into empty tables.
    INSERT INTO staging.demo_events (payload, created_at) SELECT 'old', now() - interval '400 days' FROM generate_series(1, 5) WHERE NOT EXISTS (SELECT 1 FROM staging.demo_events);
    INSERT INTO production.demo_events (payload, created_at) SELECT 'old', now() - interval '400 days' FROM generate_series(1, 5) WHERE NOT EXISTS (SELECT 1 FROM production.demo_events);
    ```

    ## Quick start

    1. Run the SQL from Database setup in your Postgres database.
    2. Create the secrets listed in Prerequisites.
    3. Replace the placeholders in `variables` in all three flows: `jdbc_url`, `jdbc_user`, and `kestra_url` (executor and status). Set `kestra_url` to your own Kestra URL: `kestra.url` is unset in Kestra 2.0.4, so the Slack approval links would otherwise point to `http://localhost:8080`.
    4. Import `mcp-governed-action-executor`, then this flow, then `mcp-governed-action-status`, all into the SAME namespace: this flow starts the executor in its own namespace, and the status tool links to it.
    5. Connect your MCP client to the private `default` MCP server and call `governed_action_request`. Read the security model first.

    ## How to extend

    Ideas, not tested in this blueprint:

    - Replace the demo `DELETE` in `purge_and_record` (executor) with your own destructive action, and keep its guards.
    - Point the purge at your own tables by editing the fixed `schemas` map in the executor's `variables` and the table name in `purge_and_record`. The environment and days always come from the claimed row, never from the agent's input.
    - Replace the self-asserted approver with a checked identity, for example by approving through your own front end that checks who the user is before it calls the resume endpoint.
    - Add your own tools next to this one on the same private MCP server, with the same claim, approval and status pattern.

    ## Inputs

    - `environment` (SELECT: staging, production, required).
    - `days` (INT, required, 1 to 3650): keep the rows from the last N days, older rows are deleted.
    - `key` (STRING, required, `^[A-Za-z0-9_-]{1,64}$`): idempotency key.

    ## Expected outputs

    - `status`: `pending`, `pending_unnotified`, `running`, `executed`, `rejected`, `expired`, `failed`, `claimed` or `conflict`. Production returns `pending`.
    - `request_id`: the key.
    - `approval_execution_id`: the executor execution. For production it is the execution waiting for approval, for staging the execution that ran. A duplicate returns the same id. It is empty on `conflict`, or when the executor has not started yet.
    - `duplicate`: true when the key was not claimed by this call.

    ## Known limits

    - A database outage makes the call fail: the agent gets an MCP error with no body.
    - The Postgres tasks have no timeout, so if the database is unreachable, a call waits until the connection fails or returns.
    - If `record_executor_id` fails after the production executor started, the call returns an error although a request is pending. A retry with the same key is safe: it returns the existing request and its executor id.
    - Staging waits for the executor synchronously, so a slow purge can exceed the MCP client timeout while the purge continues. A retry with the same key is safe: it returns the current status.
    - If the executor cannot be started (for example the flow is missing), the call returns an error and the row stays `claimed`. See the executor flow for recovery, and for resetting a killed executor.

    ## Links

    - [MCP tool trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.mcptooltrigger)
    - [Subflow task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.subflow)
    - [Postgres plugin](https://kestra.io/plugins/plugin-jdbc-postgres)

    This blueprint was created by [daiwangk](https://github.com/daiwangk).
  tags:
    - AI
    - Infrastructure
  subTags:
    - Approval Gates
  ee: false
  demo: false
