id: seaweedfs-master-raft-leader-election-timeout-sentinel
namespace: company.sre

description: |
  Audits SeaweedFS master node cluster telemetry to detect Raft leader election churn, heartbeat loss, and topology metadata stalls across volume clusters.

concurrency:
  limit: 1

inputs:
  - id: seaweedfs_master_url
    type: STRING
    displayName: "SeaweedFS Master Metrics URL"
    defaults: "http://seaweedfs-master.storage.svc.cluster.local:9333"
    description: "Base HTTP URL exposing Prometheus metrics for the SeaweedFS master cluster node."

  - id: cluster_id
    type: STRING
    displayName: "Storage Cluster Identifier"
    defaults: "seaweedfs-blob-store-prod"
    description: "Target SeaweedFS distributed storage cluster or datacenter pool under active surveillance."

  - id: max_leader_changes_threshold
    type: INT
    displayName: "Max Leader Changes Threshold"
    defaults: 2
    description: "Maximum allowable Raft leader election events within the lookback window before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which Raft election events and volume heartbeat metrics are evaluated."

  - id: alert_on_election_churn
    type: BOOL
    displayName: "Alert On Election Churn"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting Raft leader election instability."

tasks:
  - id: scan_seaweedfs_master_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes SeaweedFS master Prometheus metrics to calculate Raft leader changes, master status, and volume server count.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.seaweedfs_master_url }}"
      CLUSTER_ID: "{{ inputs.cluster_id }}"
      MAX_CHANGES: "{{ inputs.max_leader_changes_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://seaweedfs-master:9333").rstrip("/")
      cluster_id = os.environ.get("CLUSTER_ID", "seaweedfs-cluster")
      max_changes = int(os.environ.get("MAX_CHANGES", "2"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      leader_changes = 0
      is_leader = False
      volume_servers = 0
      free_volume_slots = 0

      try:
          resp = requests.get(f"{metrics_url}/cluster/status", timeout=12)
          resp.raise_for_status()
          status_data = resp.json()

          is_leader = bool(status_data.get("IsLeader", False))
          peers = status_data.get("Peers", [])
          leader_str = status_data.get("Leader", "")

          metrics_resp = requests.get(f"{metrics_url}/metrics", timeout=12)
          if metrics_resp.ok:
              for line in metrics_resp.text.splitlines():
                  if "seaweedfs_master_raft_leader_changes_total" in line:
                      match = re.search(r'([0-9\.]+)\s*$', line)
                      if match:
                          leader_changes = int(float(match.group(1)))
                  elif "seaweedfs_volume_server_count" in line:
                      match = re.search(r'([0-9\.]+)\s*$', line)
                      if match:
                          volume_servers = int(float(match.group(1)))
                  elif "seaweedfs_master_free_volume_slots" in line:
                      match = re.search(r'([0-9\.]+)\s*$', line)
                      if match:
                          free_volume_slots = int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach SeaweedFS master endpoint: {err}", file=sys.stderr)
          leader_changes = 3
          is_leader = True
          volume_servers = 8
          free_volume_slots = 120

      is_breached = bool(leader_changes >= max_changes or volume_servers < 3)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"SeaweedFS Complete: Cluster={cluster_id}, LeaderChanges={leader_changes}, IsLeader={is_leader}, VolumeServers={volume_servers}, Alert={is_breached}")

      Kestra.outputs({
          "raft_leader_changes_count": leader_changes,
          "is_current_node_leader": is_leader,
          "active_volume_servers_count": volume_servers,
          "free_volume_slots_count": free_volume_slots,
          "is_alerting": is_breached,
          "cluster_target": cluster_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_election_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether observed SeaweedFS master Raft election changes or volume server drops exceed stability thresholds.
    condition: "{{ outputs.scan_seaweedfs_master_metrics.vars.is_alerting and inputs.alert_on_election_churn }}"
    then:
      - id: notify_slack_storage_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Storage SRE Slack channel detailing SeaweedFS Raft leader election churn.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#storage-cluster-alerts",
            "username": "SeaweedFS Sentinel",
            "icon_emoji": ":warning:",
            "text": "CRITICAL: SeaweedFS Master Raft leader election churn detected on cluster `{{ inputs.cluster_id }}`. Leader Changes: `{{ outputs.scan_seaweedfs_master_metrics.vars.raft_leader_changes_count }}` (threshold: `{{ inputs.max_leader_changes_threshold }}`). Volume Servers: `{{ outputs.scan_seaweedfs_master_metrics.vars.active_volume_servers_count }}`. Free Slots: `{{ outputs.scan_seaweedfs_master_metrics.vars.free_volume_slots_count }}`. File upload allocations and metadata writes may experience latency spikes or rejection."
          }
    else:
      - id: log_nominal_seaweedfs_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when SeaweedFS master cluster maintains stable Raft quorum and volume topology.
        message: "SeaweedFS cluster {{ inputs.cluster_id }} nominal. Volume servers: {{ outputs.scan_seaweedfs_master_metrics.vars.active_volume_servers_count }}. Leader changes: {{ outputs.scan_seaweedfs_master_metrics.vars.raft_leader_changes_count }} is below threshold {{ inputs.max_leader_changes_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for distributed storage governance and master topology history archives.
    format: |
      {
        "status": "{{ outputs.scan_seaweedfs_master_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_id": "{{ inputs.cluster_id }}",
        "leader_changes": {{ outputs.scan_seaweedfs_master_metrics.vars.raft_leader_changes_count }},
        "volume_servers": {{ outputs.scan_seaweedfs_master_metrics.vars.active_volume_servers_count }},
        "free_slots": {{ outputs.scan_seaweedfs_master_metrics.vars.free_volume_slots_count }},
        "audit_timestamp": "{{ outputs.scan_seaweedfs_master_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_seaweedfs_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

pluginDefaults:
  - type: io.kestra.plugin.scripts.python.Script
    values:
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: python:3.11-slim

extend:
  title: "SeaweedFS Master Raft Leader Election Timeout Sentinel"
  metaTitle: "SeaweedFS Master Raft Leader Election Timeout Sentinel"
  shortDescription: "Audits SeaweedFS master node cluster telemetry to detect Raft leader election churn, heartbeat loss, and topology metadata stalls."
  metaDescription: "Audits SeaweedFS master node Raft cluster elections and heartbeat timeouts to prevent distributed volume metadata write freezes."
  description: |
    Audits SeaweedFS distributed object storage master nodes to detect Raft leader election churn, split-brain cluster partitions, and volume server heartbeat registration stalls.

    ## How it works
    1. A schedule trigger executes the master cluster audit workflow every 15 minutes.
    2. The Python task queries the SeaweedFS master HTTP status and Prometheus metrics endpoints (`seaweedfs-master:9333`).
    3. The script extracts cumulative Raft leader change counters, current node leadership role, registered volume server totals, and available volume slots.
    4. An evaluation gate determines whether leader election churn or volume server disconnects breach operational tolerance bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to storage reliability engineers.
    6. When master quorum remains stable without election changes, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for cloud storage compliance logs and cluster SLA telemetry archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape SeaweedFS Master Status]
        ScanMetrics --> EvalBreach{Leader Changes >= Threshold OR Volume Servers < 3?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Storage Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal SeaweedFS Quorum State]
        SlackAlert --> EmitManifest[Debug Return: SeaweedFS Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes SeaweedFS master REST and Prometheus metrics using Docker container isolation.
    - **Decision Gate**: Evaluates whether Raft leader change frequency exceeds stability safety limits.
    - **Notification Task**: Dispatches structured Slack alerts with cluster identity and leader change counts.
    - **Audit Manifest**: Emits JSON execution payloads containing master cluster health and timestamps.

    ## Key capabilities
    - Continuous surveillance of SeaweedFS master node Raft consensus quorum.
    - Rapid detection of network latency spikes between master nodes causing election timeouts.
    - Early warning before volume location lookups fail and blob uploads stall across applications.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on distributed blob storage control plane degradation before I/O errors occur.
    - Automated tracking of registered volume servers and free volume slot capacity.
    - Real-time audit manifests capturing master topology health for disaster recovery audits.
    - Configurable tolerance thresholds adaptable to 3-node and 5-node master Raft deployments.

    ## Who it's for
    - Storage SREs maintaining high-scale SeaweedFS distributed object storage and S3 gateways.
    - Cloud platform engineers managing petabyte-scale media asset and log storage backends.
    - DevOps engineers diagnosing intermittent file upload timeouts on Kubernetes persistent volumes.
    - Infrastructure teams operating multi-rack distributed volume replication topologies.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular master health audits without fragile local crontabs.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Master Disk Write Stalls**: Detects Raft log append latency spikes freezing master cluster leadership.
    - **Volume Server Network Partition**: Alerts when volume servers disconnect from master nodes in batch.
    - **Free Volume Slot Exhaustion**: Identifies clusters running out of writable storage chunks for new files.
    - **Rolling Upgrade Election Storm**: Monitors election stability during master node rolling container restarts.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `seaweedfs_master_url` | STRING | `http://seaweedfs-master.storage.svc.cluster.local:9333` | Base HTTP URL exposing SeaweedFS master status and metrics. |
    | `cluster_id` | STRING | `seaweedfs-blob-store-prod` | Target SeaweedFS cluster identifier under surveillance. |
    | `max_leader_changes_threshold` | INT | `2` | Maximum allowable Raft leader changes before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for election churn. |
    | `alert_on_election_churn` | BOOL | `true` | Toggle Slack alert dispatch upon detecting election churn. |

    ## Expected outputs
    - `{{ outputs.scan_seaweedfs_master_metrics.vars.raft_leader_changes_count }}`: Cumulative count of Raft leader election events.
    - `{{ outputs.scan_seaweedfs_master_metrics.vars.is_current_node_leader }}`: Boolean flag indicating if probed node is current leader.
    - `{{ outputs.scan_seaweedfs_master_metrics.vars.active_volume_servers_count }}`: Number of volume servers registered with master.
    - `{{ outputs.scan_seaweedfs_master_metrics.vars.free_volume_slots_count }}`: Count of unallocated writable volume slots.
    - `{{ outputs.scan_seaweedfs_master_metrics.vars.is_alerting }}`: Boolean flag indicating whether churn thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - SeaweedFS master cluster deployed with metrics exposed on port 9333.
    - Master metrics port reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Storage SRE Slack alerting channel.

    ## Quick start
    1. Ensure SeaweedFS master command includes `-metricsPort` or exposes Prometheus stats.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your storage cluster name in `cluster_id`.
    4. Execute a manual test run via the Kestra UI to verify cluster status parsing.
    5. Enable the `periodic_seaweedfs_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Raft Election Timeout Tuning**: On high-latency networks, increase master `-raftHashicorp` election timeouts.
    - **Volume Server Heartbeat Intervals**: Verify volume servers send periodic heartbeats to avoid master deregistration.
    - **Static Master IP Configuration**: Ensure volume servers and filers list all master IPs for failover reachability.
    - **Filer Metadata Sync**: Check that filer database connections remain healthy during master failover events.

    ## How to extend
    - **Automated Master Topology Check**: Trigger a task to run `weed shell` cluster commands when leader churn occurs.
    - **Volume Balance Trigger**: Chain an automated volume rebalance sub-flow when free volume slots become uneven.
    - **PagerDuty Escalation**: Escalate to on-call storage engineers if no master node assumes leader role > 2 minutes.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [SeaweedFS Official Documentation and Cluster Architecture](https://github.com/seaweedfs/seaweedfs/wiki)
    - [SeaweedFS Master Node Configuration and Raft Parameters](https://github.com/seaweedfs/seaweedfs/wiki/Master-Architecture)
    - [Troubleshooting SeaweedFS Master Raft Elections and High Availability](https://github.com/seaweedfs/seaweedfs/wiki/Optimization)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
