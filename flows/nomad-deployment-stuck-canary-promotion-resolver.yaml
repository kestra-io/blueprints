id: nomad-deployment-stuck-canary-promotion-resolver
namespace: company.infrastructure

description: |
  Detects a Nomad job deployment stuck in status "running" because its canary
  allocations are waiting on manual promotion (or have gone unhealthy) and
  nobody has acted, tracks how long it has actually been stuck via Kestra KV
  across runs, then, after a timeout and operator approval, calls Nomad's real
  promote or fail deployment API to resolve it and verifies the deployment
  left the running state.

inputs:
  - id: nomad_address
    type: STRING
    displayName: "Nomad Address"
    defaults: "http://localhost:4646"
    description: Base URL of the Nomad HTTP API.
  - id: nomad_namespace
    type: STRING
    displayName: "Nomad Namespace"
    defaults: "default"
    description: Nomad namespace the job runs in.
  - id: job_id
    type: STRING
    displayName: "Nomad Job ID"
    description: The job whose latest deployment is audited.
  - id: stuck_threshold_minutes
    type: INT
    displayName: "Stuck Threshold (minutes)"
    defaults: 15
    description: How long a deployment must remain in status "running" with the same deployment ID before this flow treats it as stuck and offers to act, instead of acting on the first observation.

triggers:
  - id: periodic_deployment_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check the job's latest deployment every 5 minutes. Shipped disabled; enable after a manual run confirms nomad_address and job_id are correct.
    cron: "*/5 * * * *"
    disabled: true
    inputs:
      job_id: "my-service"

tasks:
  - id: fetch_latest_deployment
    type: io.kestra.plugin.core.http.Request
    description: Requests the job's latest deployment - confirmed from Nomad's own source (command/agent/job_endpoint.go, jobLatestDeployment) that this handler returns the flat Deployment object directly, not wrapped under a "Deployment" key, unlike the raw SingleDeploymentResponse RPC type it reads from internally.
    uri: "{{ inputs.nomad_address }}/v1/job/{{ inputs.job_id }}/deployment?namespace={{ inputs.nomad_namespace }}"
    method: GET
    headers:
      X-Nomad-Token: "{{ secret('NOMAD_TOKEN') }}"

  - id: evaluate_deployment_state
    type: io.kestra.plugin.scripts.python.Script
    description: Classifies the deployment's real Status/StatusDescription/TaskGroups fields (verified against nomad/structs/deployment.go) and compares the deployment ID against the previous run's Kestra KV snapshot to compute actual elapsed stuck time, not just a single-run snapshot.
    env:
      DEPLOYMENT_JSON: "{{ outputs.fetch_latest_deployment.body }}"
      STUCK_THRESHOLD_MINUTES: "{{ inputs.stuck_threshold_minutes }}"
      PREVIOUS_STATE_JSON: "{{ kv('nomad_deployment_tracker_' ~ (inputs.job_id | slugify), errorOnMissing=false) ?? '{}' }}"
    script: |
      import json
      import os
      from datetime import datetime, timezone

      now = datetime.now(timezone.utc)
      now_iso = now.isoformat()

      deployment_raw = os.environ.get("DEPLOYMENT_JSON", "null")
      stuck_threshold_minutes = int(os.environ.get("STUCK_THRESHOLD_MINUTES", "15"))

      prev_raw = os.environ.get("PREVIOUS_STATE_JSON", "{}")
      try:
          prev_state = json.loads(prev_raw) if prev_raw.strip() else {}
      except Exception:
          prev_state = {}

      try:
          deployment = json.loads(deployment_raw) if deployment_raw.strip() else None
      except Exception:
          deployment = None

      if not deployment:
          # No deployment exists for this job at all (e.g. job never deployed, or was purged).
          new_state = {}
          needs_action = False
          status = "NONE"
          status_description = ""
          deployment_id = None
          minutes_stuck = 0
          recommended_action = "NONE"
          reasoning = f"No deployment found for this job."
      else:
          status = deployment.get("Status", "unknown")
          status_description = deployment.get("StatusDescription", "")
          deployment_id = deployment.get("ID")
          task_groups = deployment.get("TaskGroups") or {}

          if status != "running":
              # Deployment already resolved on its own (successful, failed, cancelled, paused) - clear tracking.
              new_state = {}
              needs_action = False
              minutes_stuck = 0
              recommended_action = "NONE"
              reasoning = f"Deployment status is '{status}', not running. No action needed; tracking cleared."
          else:
              if prev_state.get("deployment_id") == deployment_id and prev_state.get("first_seen_stuck_at"):
                  first_seen = datetime.fromisoformat(prev_state["first_seen_stuck_at"])
                  minutes_stuck = (now - first_seen).total_seconds() / 60.0
                  first_seen_stuck_at = prev_state["first_seen_stuck_at"]
              else:
                  minutes_stuck = 0.0
                  first_seen_stuck_at = now_iso

              new_state = {
                  "deployment_id": deployment_id,
                  "first_seen_stuck_at": first_seen_stuck_at,
                  "last_checked_at": now_iso,
              }

              all_canaries_healthy = True
              any_unhealthy = False
              for group_name, group_state in task_groups.items():
                  desired_canaries = group_state.get("DesiredCanaries", 0)
                  healthy = group_state.get("HealthyAllocs", 0)
                  unhealthy = group_state.get("UnhealthyAllocs", 0)
                  if unhealthy > 0:
                      any_unhealthy = True
                  if desired_canaries > 0 and healthy < desired_canaries:
                      all_canaries_healthy = False

              if minutes_stuck >= stuck_threshold_minutes:
                  if any_unhealthy:
                      needs_action = True
                      recommended_action = "FAIL"
                      reasoning = (
                          f"Deployment {deployment_id} has been running for {minutes_stuck:.1f} minute(s) "
                          f"(threshold {stuck_threshold_minutes}) with at least one unhealthy canary allocation. "
                          f"Recommending FAIL to trigger auto-revert where the job has it configured."
                      )
                  elif all_canaries_healthy:
                      needs_action = True
                      recommended_action = "PROMOTE"
                      reasoning = (
                          f"Deployment {deployment_id} has been running for {minutes_stuck:.1f} minute(s) "
                          f"(threshold {stuck_threshold_minutes}) with all canaries healthy and status "
                          f"description '{status_description}'. Recommending PROMOTE to advance the rollout."
                      )
                  else:
                      needs_action = False
                      recommended_action = "NONE"
                      reasoning = (
                          f"Deployment {deployment_id} has been running for {minutes_stuck:.1f} minute(s) "
                          f"but canary health is still ambiguous (not all healthy, none explicitly unhealthy yet). Waiting."
                      )
              else:
                  needs_action = False
                  recommended_action = "NONE"
                  reasoning = (
                      f"Deployment {deployment_id} has been running for {minutes_stuck:.1f} minute(s), "
                      f"under the {stuck_threshold_minutes} minute threshold. Tracking, not acting yet."
                  )

      print(reasoning)

      print("::" + json.dumps({
          "outputs": {
              "needs_action": needs_action,
              "recommended_action": recommended_action,
              "deployment_id": deployment_id,
              "status": status,
              "status_description": status_description,
              "minutes_stuck": round(minutes_stuck, 1),
              "reasoning": reasoning,
              "new_state": new_state,
          }
      }) + "::")

  - id: save_tracking_state
    type: io.kestra.plugin.core.kv.Set
    description: Persist the deployment-tracking snapshot (or clear it to empty if the deployment already resolved) so the next run can compute real elapsed stuck time instead of starting over.
    key: "nomad_deployment_tracker_{{ inputs.job_id | slugify }}"
    value: "{{ outputs.evaluate_deployment_state.vars.new_state | toJson }}"
    kvType: JSON

  - id: evaluate_action_needed
    type: io.kestra.plugin.core.flow.If
    description: Gate the whole remediation path behind the computed needs_action verdict.
    condition: "{{ outputs.evaluate_deployment_state.vars.needs_action == true }}"
    then:
      - id: pause_for_operator_approval
        type: io.kestra.plugin.core.flow.Pause
        description: Wait indefinitely for an operator to review and resume before promoting or failing the deployment. No pauseDuration is set, so an unattended execution waits rather than silently proceeding.

      - id: execute_remediation
        type: io.kestra.plugin.core.flow.If
        description: Call Nomad's real promote or fail deployment endpoint per the computed recommendation.
        condition: "{{ outputs.evaluate_deployment_state.vars.recommended_action == 'PROMOTE' }}"
        then:
          - id: promote_deployment
            type: io.kestra.plugin.core.http.Request
            description: Promotes all task groups in the deployment, confirmed from Nomad's api/deployments.go DeploymentPromoteRequest shape (DeploymentID, All).
            uri: "{{ inputs.nomad_address }}/v1/deployment/promote/{{ outputs.evaluate_deployment_state.vars.deployment_id }}?namespace={{ inputs.nomad_namespace }}"
            method: PUT
            headers:
              X-Nomad-Token: "{{ secret('NOMAD_TOKEN') }}"
            body: |
              {
                "DeploymentID": "{{ outputs.evaluate_deployment_state.vars.deployment_id }}",
                "All": true
              }
        else:
          - id: fail_deployment
            type: io.kestra.plugin.core.http.Request
            description: Force-fails the deployment, confirmed from Nomad's api/deployments.go DeploymentFailRequest shape (DeploymentID only). Triggers the job's configured auto_revert if set.
            uri: "{{ inputs.nomad_address }}/v1/deployment/fail/{{ outputs.evaluate_deployment_state.vars.deployment_id }}?namespace={{ inputs.nomad_namespace }}"
            method: PUT
            headers:
              X-Nomad-Token: "{{ secret('NOMAD_TOKEN') }}"
            body: |
              {
                "DeploymentID": "{{ outputs.evaluate_deployment_state.vars.deployment_id }}"
              }

      - id: verify_resolution
        type: io.kestra.plugin.core.http.Request
        description: Re-fetches the job's latest deployment after the mutation to confirm it actually left the running state, rather than assuming the promote/fail call succeeded.
        uri: "{{ inputs.nomad_address }}/v1/job/{{ inputs.job_id }}/deployment?namespace={{ inputs.nomad_namespace }}"
        method: GET
        headers:
          X-Nomad-Token: "{{ secret('NOMAD_TOKEN') }}"

      - id: evaluate_verification
        type: io.kestra.plugin.core.flow.If
        description: Branch on whether the post-action status is still "running" (verification failed) or has moved on (verification succeeded).
        condition: "{{ (outputs.verify_resolution.body | jq('.Status') | first) == 'running' }}"
        then:
          - id: alert_remediation_did_not_resolve
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: The promote or fail call was made but the deployment is still running; this needs human intervention, not a silent success claim.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "Nomad deployment resolver: called {{ outputs.evaluate_deployment_state.vars.recommended_action }} on deployment {{ outputs.evaluate_deployment_state.vars.deployment_id }} for job {{ inputs.job_id }}, but it is STILL in status running after the call. Manual investigation needed. Execution {{ execution.id }}."
              }
        else:
          - id: notify_resolution_succeeded
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Confirms the real, verified outcome rather than just that the API call returned 2xx.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "Nomad deployment resolver: {{ outputs.evaluate_deployment_state.vars.recommended_action }} applied to deployment {{ outputs.evaluate_deployment_state.vars.deployment_id }} for job {{ inputs.job_id }}, which had been stuck running for {{ outputs.evaluate_deployment_state.vars.minutes_stuck }} minute(s). Verified it left the running state. Execution {{ execution.id }}."
              }
    else:
      - id: log_no_action_needed
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.evaluate_deployment_state.vars.reasoning }}"

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack separately if the flow itself fails, so a broken check never silently reads as "deployment healthy".
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Nomad deployment resolver FAILED in execution {{ execution.id }} for job {{ inputs.job_id }}. The check did not complete; do not trust the last known status until this is fixed."
      }

outputs:
  - id: needs_action
    type: BOOL
    value: "{{ outputs.evaluate_deployment_state.vars.needs_action }}"
  - id: recommended_action
    type: STRING
    value: "{{ outputs.evaluate_deployment_state.vars.recommended_action }}"

extend:
  title: "Resolve a Nomad Deployment Stuck Waiting on Manual Canary Promotion"
  metaTitle: Resolve Stuck Nomad Canary Deployments with Kestra
  shortDescription: Detect a Nomad deployment stuck running on an unpromoted or unhealthy canary, track elapsed time in KV, then promote or fail it with operator approval and verify the fix.
  metaDescription: "Detect a Nomad deployment stuck running on a canary awaiting promotion, track it in KV, promote or fail it with approval, verify."
  description: |
    A Nomad rolling deployment that uses canaries can get stuck in status
    "running" indefinitely: canaries can go healthy and simply wait for
    manual promotion when `auto_promote` isn't set, or a canary can go
    unhealthy without `auto_revert` configured to clean it up. Either way,
    the deployment sits there with old and new allocations running side by
    side until a human notices and runs `nomad deployment promote` or
    `nomad deployment fail` by hand. This blueprint watches a job's latest
    deployment, tracks real elapsed stuck time across runs (not a single
    snapshot), and resolves it through Nomad's own deployment API once a
    human has approved the action.

    ## How it works

    1. `periodic_deployment_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 5 minutes, shipped disabled so a manual run can be verified first.
    2. `fetch_latest_deployment` (`io.kestra.plugin.core.http.Request`) calls Nomad's `GET /v1/job/{job_id}/deployment`, confirmed from Nomad's own source to return the flat `Deployment` object (`Status`, `StatusDescription`, `TaskGroups`), not a wrapped response.
    3. `evaluate_deployment_state` (`io.kestra.plugin.scripts.python.Script`) compares the current deployment ID against the previous run's Kestra KV snapshot under `nomad_deployment_tracker_{job_id}` to compute real elapsed minutes stuck in status "running", classifies canary health from each task group's `DesiredCanaries`/`HealthyAllocs`/`UnhealthyAllocs`, and recommends `PROMOTE` (all canaries healthy) or `FAIL` (at least one unhealthy) once `stuck_threshold_minutes` is exceeded.
    4. `save_tracking_state` (`io.kestra.plugin.core.kv.Set`) persists the snapshot, or clears it once the deployment has resolved on its own.
    5. `evaluate_action_needed` (`io.kestra.plugin.core.flow.If`) gates the remediation path behind the computed verdict; a clean or not-yet-stuck-long-enough run just logs and exits.
    6. `pause_for_operator_approval` (`io.kestra.plugin.core.flow.Pause`) waits indefinitely for a human to resume before anything is mutated.
    7. `execute_remediation` branches on the recommendation and calls Nomad's real `PUT /v1/deployment/promote/{id}` (with `All: true`) or `PUT /v1/deployment/fail/{id}`.
    8. `verify_resolution` re-fetches the job's latest deployment and `evaluate_verification` confirms status is no longer "running" before declaring success; if it's still running, Slack is told explicitly that manual investigation is needed instead of claiming a false success.
    9. The `errors` block alerts Slack separately if the flow itself fails.

    ## What you get

    - Real elapsed-time tracking of how long a deployment has actually been stuck, computed from a Kestra KV snapshot across runs, not a single poll.
    - An explicit, tool-specific PROMOTE vs FAIL recommendation computed from each task group's real canary health counts, not a flat threshold.
    - A human approval gate between detection and any mutation of live deployment state.
    - Verified resolution: the flow re-checks Nomad's own deployment status after acting instead of trusting the mutation call's HTTP response code alone.

    ## Who it's for

    - Platform engineers running Nomad rolling deployments with canaries who want stuck rollouts surfaced and resolved instead of discovered by a user-facing incident.
    - SREs who are tired of `nomad deployment status` being the first step of every "is the deploy actually done" investigation.
    - Teams that deliberately run with `auto_promote: false` for a manual gate, but still want that gate to page someone instead of silently sitting forever.

    ## Why orchestrate this with Kestra

    Nomad tracks deployment state but has no built-in alert for "this has been running too long" and no concept of operator approval before a promote or fail call. A cron job hitting the Nomad API ad hoc has no cross-run memory of when a deployment first became stuck, no safe pause-and-resume gate, and no execution history proving what was actually verified after the mutation. Kestra supplies the KV-backed elapsed-time tracking, the approval gate, and a visible, auditable run history.

    ## Prerequisites

    - A Nomad cluster (or `nomad agent -dev` for local testing) reachable from the Kestra worker, with a job running a rolling deployment with canaries configured.
    - A Nomad ACL token with permission to read and act on deployments for the target namespace, if ACLs are enabled.
    - A Slack incoming webhook for alerts.

    ### Secrets

    - `NOMAD_TOKEN`: Nomad ACL token sent as the `X-Nomad-Token` header by every HTTP call in this flow, confirmed from Nomad's own `api/api.go` client source. Leave the secret empty/unset if ACLs are disabled on the target cluster.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by the resolution alerts and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}`.

    ### Inputs

    - `nomad_address` (STRING, default `http://localhost:4646`): base URL of the Nomad HTTP API.
    - `nomad_namespace` (STRING, default `default`): Nomad namespace the job runs in.
    - `job_id` (STRING, no default): the job whose latest deployment is audited.
    - `stuck_threshold_minutes` (INT, default `15`): minutes a deployment must stay in status running before this flow offers to act.

    ### Outputs

    - `outputs.needs_action` / `outputs.recommended_action`: the headline verdict for every run.
    - `outputs.evaluate_deployment_state.vars.minutes_stuck` / `.reasoning`: the full computed detail behind that verdict.

    ## Quick start

    1. Run `nomad agent -dev` locally, or point `nomad_address` at a real test cluster.
    2. Deploy a job with `update { canary = 1, auto_promote = false }` so a rollout will genuinely sit waiting for manual promotion.
    3. Add the `NOMAD_TOKEN` (if ACLs are enabled) and `SLACK_WEBHOOK_URL` secrets.
    4. Run the flow manually once with a short `stuck_threshold_minutes` (e.g. `1`) while the deployment is mid-canary; confirm `evaluate_deployment_state` reports `needs_action: true` after the second run.
    5. Resume the `pause_for_operator_approval` step and confirm `promote_deployment` (or `fail_deployment`) fires and `verify_resolution` shows the deployment has left status running.
    6. Enable `periodic_deployment_check` once you trust the check, and set `stuck_threshold_minutes` to a realistic value for your rollout SLAs.

    ## How to extend

    - Loop this flow over every job in a namespace (fetch `/v1/jobs`, filter to those with an active deployment) instead of auditing one `job_id` at a time.
    - Add a Slack interactive approval (buttons that resume the flow) in place of the bare `Pause`, so the human decision happens in Slack rather than the Kestra UI.
    - If your org's policy is "always revert, never promote automatically" even for healthy canaries, make `recommended_action` configurable via an input instead of letting canary health decide it.

    ## Pitfalls

    - **This blueprint never disables `auto_revert`/`auto_promote` on the job itself.** It only acts on deployments that are already stuck because those settings weren't enough (or weren't set) for this particular rollout.
    - **The elapsed-stuck-time tracking is keyed by `job_id`, and only tracks the single latest deployment Nomad reports.** If a job is redeployed while already stuck (a new deployment ID appears), the timer resets rather than carrying over, since the new deployment is a genuinely different rollout attempt.
    - **FAIL is only a recommendation when at least one canary is unhealthy; it does not itself guarantee a rollback.** Whether failing a deployment actually reverts allocations depends entirely on the job's own `auto_revert` setting, confirmed from Nomad's own `DeploymentState.AutoRevert` field - this flow does not set that field, it only calls fail.
    - **`verify_resolution` checks that status is no longer "running", not that the outcome was the one requested.** A promote call that Nomad itself rejects (for example, a job redeployed mid-flow) could still leave status as "running" or move it to "cancelled" instead of "successful"; the Slack alert names the actual post-verification status for a human to read.

    ## Links

    - [Nomad Deployment HTTP API](https://developer.hashicorp.com/nomad/api-docs/deployments)
    - [Nomad Job Update Block (canary, auto_promote, auto_revert)](https://developer.hashicorp.com/nomad/docs/job-specification/update)
    - [Kestra KV Store Documentation](https://kestra.io/plugins/core/tasks/kv/io.kestra.plugin.core.kv.set)
  tags:
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Incident Response
  ee: false
  demo: false
