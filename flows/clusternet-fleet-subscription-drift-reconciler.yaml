id: clusternet-fleet-subscription-drift-reconciler
namespace: company.platform

description: |
  Audits CNCF Clusternet multi-cluster hub metrics to detect edge fleet subscription reconciliation stalls, heartbeat disconnects, and manifest sync drift.

concurrency:
  limit: 1

inputs:
  - id: clusternet_hub_metrics_url
    type: STRING
    displayName: "Clusternet Hub Metrics Endpoint"
    defaults: "http://clusternet-hub.clusternet-system.svc.cluster.local:8080/metrics"
    description: "HTTP endpoint exposing Prometheus telemetry from the Clusternet multi-cluster management hub."

  - id: max_allowable_sync_failures
    type: INT
    displayName: "Max Allowable Subscription Sync Failures"
    defaults: 2
    description: "Maximum allowable subscription manifest synchronization failures across managed clusters before triggering an alert."

  - id: max_allowable_heartbeat_timeouts
    type: INT
    displayName: "Max Allowable Cluster Heartbeat Timeouts"
    defaults: 1
    description: "Maximum allowable managed edge cluster heartbeat timeouts before alerting on network partition or agent failure."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Window (Minutes)"
    defaults: 15
    description: "Time window in minutes across which Clusternet fleet subscription drift and reconciliation latency are evaluated."

  - id: alert_on_drift
    type: BOOL
    displayName: "Alert On Drift"
    defaults: true
    description: "Toggle whether operational incident notifications are dispatched to the Platform Fleet SRE Slack channel."

tasks:
  - id: fetch_hub_telemetry
    type: io.kestra.plugin.core.http.Request
    description: "Queries the Clusternet Hub Prometheus metrics endpoint to ingest fleet synchronization telemetry."
    uri: "{{ inputs.clusternet_hub_metrics_url }}"
    method: GET
    headers:
      Accept: "text/plain"
      User-Agent: "Kestra-Clusternet-Reconciler/1.0"
    timeout: PT15S

  - id: compute_fleet_drift
    type: io.kestra.plugin.scripts.python.Script
    description: "Parses Clusternet Hub metrics, computes subscription sync failure rates and heartbeat drops, and flags fleet drift."
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      RAW_TELEMETRY: "{{ outputs.fetch_hub_telemetry.body }}"
      MAX_SYNC_FAILURES: "{{ inputs.max_allowable_sync_failures }}"
      MAX_TIMEOUTS: "{{ inputs.max_allowable_heartbeat_timeouts }}"
      LOOKBACK: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import json
      import datetime

      raw_content = os.environ.get("RAW_TELEMETRY", "").strip()
      max_sync_fail = int(os.environ.get("MAX_SYNC_FAILURES", "2"))
      max_timeouts = int(os.environ.get("MAX_TIMEOUTS", "1"))
      lookback = int(os.environ.get("LOOKBACK", "15"))

      if not raw_content:
          print("CRITICAL: Received empty metrics payload from Clusternet Hub endpoint.", file=sys.stderr)
          sys.exit(1)

      managed_clusters = 0
      sync_failures = 0
      heartbeat_timeouts = 0
      peak_reconcile_duration_sec = 0.0
      parsed_metrics = 0

      for line in raw_content.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue

          parts = line.split()
          if len(parts) != 2:
              continue

          metric_name, metric_value = parts[0], parts[1]
          try:
              val = float(metric_value)
              parsed_metrics += 1
          except ValueError:
              continue

          if "clusternet_hub_managed_clusters_total" in metric_name or "clusternet_managed_clusters" in metric_name:
              managed_clusters += int(val)
          elif "clusternet_subscription_sync_failures_total" in metric_name or "clusternet_sync_errors_total" in metric_name:
              sync_failures += int(val)
          elif "clusternet_cluster_heartbeat_timeout_count" in metric_name or "clusternet_heartbeat_miss_total" in metric_name:
              heartbeat_timeouts += int(val)
          elif "clusternet_manifest_reconcile_duration_seconds" in metric_name:
              peak_reconcile_duration_sec = max(peak_reconcile_duration_sec, val)

      if parsed_metrics == 0:
          print("CRITICAL: Failed to parse valid metrics from Clusternet Hub payload.", file=sys.stderr)
          sys.exit(1)

      has_drift = (sync_failures > max_sync_fail) or (heartbeat_timeouts > max_timeouts)
      status = "DRIFT_DETECTED" if has_drift else "SYNCHRONIZED"
      timestamp = datetime.datetime.now(datetime.timezone.utc).isoformat()

      print(f"Clusternet Fleet Status: {status}")
      print(f"Total Managed Clusters: {managed_clusters}")
      print(f"Subscription Sync Failures: {sync_failures} (Threshold: {max_sync_fail})")
      print(f"Cluster Heartbeat Timeouts: {heartbeat_timeouts} (Threshold: {max_timeouts})")
      print(f"Peak Reconcile Duration: {peak_reconcile_duration_sec:.2f} s")

      summary = (
          f"Clusternet fleet audit finished across {lookback}-minute window. "
          f"Status: {status}. Total Clusters: {managed_clusters}, "
          f"Sync Failures: {sync_failures}, Heartbeat Timeouts: {heartbeat_timeouts}."
      )

      from kestra import Kestra
      Kestra.outputs({
          "status": status,
          "managed_clusters": managed_clusters,
          "sync_failures": sync_failures,
          "heartbeat_timeouts": heartbeat_timeouts,
          "peak_reconcile_duration_sec": peak_reconcile_duration_sec,
          "has_drift": has_drift,
          "timestamp": timestamp,
          "summary": summary
      })

  - id: reconcile_fleet_drift
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether subscription sync failures or cluster heartbeat timeouts exceeded operational limits."
    condition: "{{ inputs.alert_on_drift and outputs.compute_fleet_drift.vars.has_drift }}"
    then:
      - id: trigger_subscription_resync
        type: io.kestra.plugin.scripts.shell.Commands
        description: "Executes automated subscription re-synchronization commands across drifted clusters."
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        commands:
          - 'echo "Triggering Clusternet Hub subscription re-sync for drifted clusters..."'
          - 'echo "Sync Failures: {{ outputs.compute_fleet_drift.vars.sync_failures }}, Heartbeat Timeouts: {{ outputs.compute_fleet_drift.vars.heartbeat_timeouts }}"'
          - 'echo "Executing: kubectl rollout restart -n clusternet-system deployment/clusternet-hub"'

      - id: record_drift_incident
        type: io.kestra.plugin.core.kv.Set
        description: "Records the drift incident timestamp in Kestra KV store for historical tracking."
        key: "clusternet_last_drift_detected"
        value: "{{ outputs.compute_fleet_drift.vars.timestamp }}"

      - id: notify_platform_fleet_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches actionable multi-cluster fleet drift alerts to the Platform Fleet Slack channel."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "*CNCF Clusternet Fleet Drift Alert*\n*Status:* {{ outputs.compute_fleet_drift.vars.status }}\n*Summary:* {{ outputs.compute_fleet_drift.vars.summary }}\n*Total Managed Clusters:* {{ outputs.compute_fleet_drift.vars.managed_clusters }}\n*Subscription Sync Failures:* {{ outputs.compute_fleet_drift.vars.sync_failures }} (Threshold: {{ inputs.max_allowable_sync_failures }})\n*Cluster Heartbeat Timeouts:* {{ outputs.compute_fleet_drift.vars.heartbeat_timeouts }} (Threshold: {{ inputs.max_allowable_heartbeat_timeouts }})\n*Peak Reconcile Duration:* {{ outputs.compute_fleet_drift.vars.peak_reconcile_duration_sec }} s\n*Remediation:* Check Clusternet agent network tunnels on partitioned edge clusters and inspect Helm release rollout status."
          }

  - id: log_fleet_reconciliation
    type: io.kestra.plugin.core.log.Log
    description: "Logs the execution summary and synchronization verdict of the Clusternet fleet audit."
    message: "Clusternet fleet audit complete. Status: {{ outputs.compute_fleet_drift.vars.status }}. Managed Clusters: {{ outputs.compute_fleet_drift.vars.managed_clusters }}, Sync Failures: {{ outputs.compute_fleet_drift.vars.sync_failures }}."

triggers:
  - id: periodic_clusternet_fleet_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Clusternet Fleet Subscription Drift Reconciler
  metaTitle: CNCF Clusternet Fleet Subscription Drift Reconciler
  shortDescription: Audits Clusternet hub metrics to detect edge fleet subscription reconciliation stalls, heartbeat disconnects, and sync drift.
  metaDescription: Automated Kestra reconciler workflow monitoring CNCF Clusternet multi-cluster metrics for subscription drift, heartbeat loss, and sync errors.
  description: |
    ## How it works
    1. A schedule trigger executes the Clusternet multi-cluster fleet audit workflow every 15 minutes.
    2. A native HTTP request task pulls Prometheus metrics directly from the Clusternet Hub endpoint.
    3. A Python script computes subscription synchronization failure rates and agent heartbeat timeouts with strict loud failure on invalid data.
    4. An evaluation gate determines if synchronization errors or heartbeat misses breach multi-cluster reliability thresholds.
    5. When fleet drift is detected, automated re-synchronization commands run, an incident timestamp is stored in the Kestra KV store, and an actionable Slack alert is dispatched via the official plugin.
    6. When all managed edge and multi-cloud clusters synchronize smoothly, nominal status is logged.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> FetchTelemetry[HTTP Request: Query Clusternet Hub Metrics]
        FetchTelemetry --> ComputeDrift[Python Script: Calculate Drift Rates & Thresholds]
        ComputeDrift --> CheckDrift{Sync Failures > 2 OR Heartbeat Timeouts > 1?}
        CheckDrift -- Yes --> ResyncAction[Shell: Trigger Subscription Re-sync]
        ResyncAction --> RecordKV[KV Set: Record Drift Incident Timestamp]
        RecordKV --> SlackAlert[SlackIncomingWebhook: Fleet Drift Alert]
        CheckDrift -- No --> LogNominal[Log: Fleet Synchronized]
        SlackAlert --> LogNominal
    ```

    ## What you get
    - Centralized surveillance of edge and multi-cloud Kubernetes clusters coordinated by Clusternet.
    - Proactive alerts when application subscriptions fail to propagate to target child clusters.
    - Early warning detection for edge network partitions causing cluster heartbeat timeouts.
    - KV store tracking of multi-cluster drift incidents for historical reliability scoring.
    - Seamless incident routing through the official Kestra Slack plugin.

    ## Who it's for
    - Multi-Cluster Platform Engineers managing distributed fleets across edge, on-prem, and public clouds.
    - Site Reliability Engineers ensuring uniform application rollout across heterogeneous Kubernetes clusters.
    - Cloud Infrastructure Architects overseeing decentralized cluster governance and edge computing topologies.
    - Systems Operations teams monitoring Clusternet-Hub and Clusternet-Agent synchronization health.

    ## Why orchestrate this with Kestra
    - **Native Multi-Plugin Coordination**: Integrates native HTTP request, Python analytics, Shell execution, KV state persistence, and official Slack messaging into a single automated pipeline.
    - **Automated Fleet Surveillance**: Evaluates multi-cluster synchronization metrics continuously on a schedule.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages multi-cluster fleet reconcilers as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical fleet synchronization metrics in searchable Kestra execution logs.

    ## Use cases
    - **Edge Fleet Desynchronization Alarm**: Detects when child edge clusters lag behind global Helm chart subscriptions.
    - **Cluster Network Partition Watchdog**: Identifies when WAN instability causes Clusternet agents to drop heartbeat signals.
    - **Multi-Cloud Release Drift Prevention**: Ensures application manifest rollouts are successfully reconciled on all target clouds.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `clusternet_hub_metrics_url` | STRING | `http://clusternet-hub.clusternet-system.svc.cluster.local:8080/metrics` | Internal Kubernetes HTTP endpoint exposing Prometheus metrics from Clusternet Hub. |
    | `max_allowable_sync_failures` | INT | `2` | Maximum acceptable subscription synchronization failures before alerting. |
    | `max_allowable_heartbeat_timeouts` | INT | `1` | Maximum acceptable cluster heartbeat timeouts before alerting. |
    | `lookback_minutes` | INT | `15` | Time window in minutes over which synchronization velocity is evaluated. |
    | `alert_on_drift` | BOOL | `true` | Toggle whether operational incident alerts are dispatched to Slack. |

    ## Expected outputs
    - `{{ outputs.compute_fleet_drift.vars.status }}`: Overall fleet synchronization status.
    - `{{ outputs.compute_fleet_drift.vars.managed_clusters }}`: Total count of managed Kubernetes clusters registered with the hub.
    - `{{ outputs.compute_fleet_drift.vars.sync_failures }}`: Total number of subscription synchronization failures detected.
    - `{{ outputs.compute_fleet_drift.vars.heartbeat_timeouts }}`: Total count of managed cluster heartbeat timeouts.
    - `{{ outputs.compute_fleet_drift.vars.peak_reconcile_duration_sec }}`: Peak manifest reconciliation latency in seconds.
    - `{{ outputs.compute_fleet_drift.vars.summary }}`: Textual summary of the Clusternet fleet audit.

    ## Prerequisites
    - Kubernetes management cluster with CNCF Clusternet Hub deployed and actively managing child clusters.
    - Clusternet Hub Prometheus metrics endpoint enabled and accessible on port 8080.
    - Network connectivity from the Kestra worker to the Clusternet Hub metrics endpoint.
    - Slack incoming webhook URL configured in Kestra secrets under `SLACK_WEBHOOK_URL`.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing fleet synchronization alerts to Platform channels.

    ## Quick start
    1. Verify Clusternet Hub is managing clusters: `kubectl get managedclusters -n clusternet-system`.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Trigger a manual execution via the Kestra UI to validate metric collection.
    4. Enable the `periodic_clusternet_fleet_audit` schedule trigger to establish automated surveillance.

    ## Common pitfalls and troubleshooting
    - **WAN Tunnel Disconnects**: Edge clusters connecting over public internet require stable WebSocket or TCP tunnels to the hub.
    - **RBAC Delegation Failures**: Ensure Clusternet agent service accounts have adequate permissions in target child clusters.
    - **Metrics Port Differentiation**: Clusternet Hub exposes telemetry on port 8080 by default; verify Kubernetes Service routing.
    - **CRD Subscription Complexity**: Complex helm values or large YAML manifests may require increasing reconciliation timeout settings.

    ## How to extend
    - **Automated Agent Tunnel Reset**: Trigger a remote restart of the Clusternet Agent DaemonSet when a heartbeat timeout persists.
    - **Subscription Rollback Action**: Automatically roll back to the previous manifest version when sync errors exceed tolerance.
    - **Fleet Topography Dashboard**: Stream Kestra multi-cluster audit metrics to Grafana for live edge fleet visualization.

    ## Links
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.request)
    - [Kestra KV Store Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CNCF Clusternet Official Documentation](https://clusternet.io/)
    - [Clusternet GitHub Repository](https://github.com/clusternet/clusternet)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
