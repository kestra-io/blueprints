id: postgres-missing-partition-provision-guard
namespace: company.team

inputs:
  - id: postgres_url
    type: STRING
    defaults: jdbc:postgresql://localhost:5432/postgres
    description: >-
      PostgreSQL JDBC URL for the database whose RANGE partitioned tables are checked. Example jdbc:postgresql://postgres:5432/app.

  - id: use_secret_auth
    type: BOOL
    defaults: true
    description: >-
      Leave true in production so the connection reads POSTGRES_USERNAME and POSTGRES_PASSWORD from secrets. Set false only to pass credentials inline in a disposable test environment.

  - id: postgres_username
    type: STRING
    defaults: postgres
    description: Username used only when use_secret_auth is false. Ignored in production.

  - id: postgres_password
    type: STRING
    defaults: ""
    description: Password used only when use_secret_auth is false. Ignored in production.

  - id: schema
    type: STRING
    defaults: ""
    description: >-
      Optional single schema to restrict the scan to. Leave empty to scan every user schema in the database.

  - id: window_size
    type: SELECT
    values:
      - day
      - week
      - month
    defaults: day
    description: >-
      Size of each partition window. day keeps a daily partition, week a weekly one starting Monday, month a calendar month. It must match how the tables are already partitioned.

  - id: windows_ahead
    type: INT
    defaults: 7
    description: >-
      How many future windows to keep provisioned, counted from the current window. With day and 7, the current day and the next six days must each have a covering partition.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, report the missing partitions without creating anything.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: >-
      When true and dry_run is false, create each missing partition behind an approval gate, then re-read the partition tree.

variables:
  detect_sql: |
    WITH params AS (
      SELECT
        (CASE '{{ inputs.window_size }}'
           WHEN 'day' THEN interval '1 day'
           WHEN 'week' THEN interval '1 week'
           ELSE interval '1 month' END) AS step,
        date_trunc('{{ inputs.window_size }}', now()) AS w0
    ),
    win AS (
      SELECT gs AS win_lo, gs + p.step AS win_hi
      FROM params p,
           generate_series(p.w0, p.w0 + (({{ inputs.windows_ahead }} - 1) * p.step), p.step) gs
    ),
    parents AS (
      SELECT c.oid AS parent_oid, n.nspname AS schema, c.relname AS parent,
             a.attname AS key_col, a.atttypid AS key_typid
      FROM pg_partitioned_table pt
      JOIN pg_class c ON c.oid = pt.partrelid
      JOIN pg_namespace n ON n.oid = c.relnamespace
      JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum = pt.partattrs[0]
      WHERE pt.partstrat = 'r'
        AND pt.partnatts = 1
        AND a.atttypid IN ('date'::regtype, 'timestamp'::regtype, 'timestamptz'::regtype)
        AND n.nspname NOT IN ('pg_catalog', 'information_schema')
        AND ('{{ inputs.schema }}' = '' OR n.nspname = '{{ inputs.schema }}')
    ),
    children AS (
      SELECT p.parent_oid, pg_get_expr(ch.relpartbound, ch.oid) AS bexpr
      FROM parents p
      JOIN pg_inherits i ON i.inhparent = p.parent_oid
      JOIN pg_class ch ON ch.oid = i.inhrelid
    ),
    parsed AS (
      SELECT parent_oid,
        (bexpr = 'DEFAULT') AS is_default,
        substring(bexpr from 'FROM \((.*)\) TO ') AS lo_tok,
        substring(bexpr from 'TO \((.*)\)$') AS hi_tok
      FROM children
    ),
    bounds AS (
      SELECT parent_oid, is_default,
        CASE WHEN lo_tok IS NULL OR lo_tok IN ('MINVALUE', 'MAXVALUE') THEN NULL
             ELSE btrim(lo_tok, '''')::timestamptz END AS lo_ts,
        CASE WHEN hi_tok IS NULL OR hi_tok IN ('MINVALUE', 'MAXVALUE') THEN NULL
             ELSE btrim(hi_tok, '''')::timestamptz END AS hi_ts
      FROM parsed
    ),
    missing AS (
      SELECT p.schema, p.parent, p.key_col, p.key_typid, w.win_lo, w.win_hi
      FROM parents p
      CROSS JOIN win w
      WHERE NOT EXISTS (
        SELECT 1 FROM bounds b
        WHERE b.parent_oid = p.parent_oid
          AND NOT b.is_default
          AND (b.lo_ts IS NULL OR b.lo_ts < w.win_hi)
          AND (b.hi_ts IS NULL OR b.hi_ts > w.win_lo)
      )
    ),
    gen AS (
      SELECT schema, parent, key_col, win_lo, win_hi,
        CASE WHEN key_typid = 'date'::regtype THEN to_char(win_lo, 'YYYY-MM-DD')
             ELSE to_char(win_lo, 'YYYY-MM-DD HH24:MI:SS') END AS lo_lit,
        CASE WHEN key_typid = 'date'::regtype THEN to_char(win_hi, 'YYYY-MM-DD')
             ELSE to_char(win_hi, 'YYYY-MM-DD HH24:MI:SS') END AS hi_lit,
        (parent || '_' || to_char(win_lo, 'YYYYMMDD')) AS child
      FROM missing
    )
    SELECT schema, parent, key_col, child,
      (schema || '.' || child) AS qchild,
      win_lo::text AS win_lo, win_hi::text AS win_hi,
      format('CREATE TABLE %I.%I PARTITION OF %I.%I FOR VALUES FROM (%L) TO (%L)',
             schema, child, schema, parent, lo_lit, hi_lit) AS create_sql,
      (schema || '.' || parent || ' -> ' || child || ' [' || lo_lit || ' , ' || hi_lit || ')') AS label
    FROM gen
    ORDER BY schema, parent, win_lo

triggers:
  - id: daily_missing_partition_check
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 3 * * *"
    description: >-
      Daily missing partition sweep. Disabled by default and pinned to safe mode so it reports without creating anything until an operator enables it.
    inputs:
      dry_run: true
      auto_remediate: false

tasks:
  - id: detect
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Find every RANGE partitioned parent keyed on a single date or timestamp column, read its existing child bounds and work out which of the next windows_ahead windows no partition covers. Each row carries the deterministic child name and the exact CREATE TABLE PARTITION OF statement.
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.detect_sql) }}"

  - id: summarize
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      Build the human readable target list and the JSON the remediation loop iterates, once, so the log, the alert and the loop all read the same set.
    values:
      names: >-
        {{ outputs.detect.rows | jq('map(.label) | join(" | ")') | first }}
      targets_json: "{{ outputs.detect.rows | toJson }}"

  - id: log_detect
    type: io.kestra.plugin.core.log.Log
    message: |
      PostgreSQL RANGE partitions missing for the next {{ inputs.windows_ahead }} {{ inputs.window_size }} window(s): {{ outputs.detect.size }} found.
      Targets: {{ outputs.summarize.values.names }}
      Mode: dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }} window_size={{ inputs.window_size }} windows_ahead={{ inputs.windows_ahead }}

  - id: guard
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.detect.size > 0 }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: >-
          Alert on every detection, in dry run and in remediate mode, so a human sees the uncovered windows even when nothing is created.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "PostgreSQL missing partition guard: {{ outputs.detect.size }} window(s) in the next {{ inputs.windows_ahead }} {{ inputs.window_size }}(s) have no covering partition. New rows land in the DEFAULT partition or fail outright. Targets {{ outputs.summarize.values.names }}. dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}."}

      - id: mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.detect.size > 0 }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Hold the run until a human approves creating the missing partitions. The change never starts on its own.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: >-
                  Set true to create the listed partitions. Anything else leaves them uncreated.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: create_partitions
                type: io.kestra.plugin.core.flow.Loop
                description: >-
                  Remediation loop. One CREATE TABLE PARTITION OF per missing window, concurrencyLimit 1 so the statements run in turn and never race on the parent lock. allowFailure so one rejected create (for example a DEFAULT partition that already holds rows for the window) does not stop the pass and the re-read stays the real gate.
                concurrencyLimit: 1
                values: "{{ outputs.summarize.values.targets_json }}"
                tasks:
                  - id: create_one
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    description: Create one missing partition for its window.
                    allowFailure: true
                    url: "{{ inputs.postgres_url }}"
                    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).create_sql }}"

                  - id: create_log
                    type: io.kestra.plugin.core.log.Log
                    message: "Ran {{ fromJson(item.value).create_sql }}"

              - id: reverify
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: >-
                  Re-run the same detection. Any window that was a target and still has no covering partition is a failure.
                url: "{{ inputs.postgres_url }}"
                username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                fetchType: FETCH
                sql: "{{ render(vars.detect_sql) }}"

              - id: verify_plan
                type: io.kestra.plugin.core.output.OutputValues
                description: Keep only the targets that are still uncovered after the pass. A new window that rolled in during the run is excluded by design.
                values:
                  still_json: >-
                    {{ {'t': outputs.detect.rows, 'r': outputs.reverify.rows} | toJson | jq('(.r | map(.qchild)) as $rem | .t | map(select(([.qchild] - $rem) | length == 0))') | first | toJson }}
                  still_names: >-
                    {{ {'t': outputs.detect.rows, 'r': outputs.reverify.rows} | toJson | jq('(.r | map(.qchild)) as $rem | .t | map(select(([.qchild] - $rem) | length == 0) | .label) | join(" | ")') | first }}

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.verify_plan.values.still_json | jq('length') | first) > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      {{ outputs.verify_plan.values.still_json | jq('length') | first }} targeted window(s) still have no covering partition after the pass: {{ outputs.verify_plan.values.still_names }}. A DEFAULT partition may already hold rows for the window or the connecting role may not be allowed to create it.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: "Created and verified. {{ outputs.detect.size }} window(s) were uncovered before, 0 of them after."
            else:
              - id: not_approved
                type: io.kestra.plugin.core.log.Log
                message: "Approval not granted, so nothing was created. {{ outputs.detect.size }} window(s) still have no covering partition."
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: "Report only (dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}). {{ outputs.detect.size }} window(s) would be provisioned: {{ outputs.summarize.values.names }}. No change made."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "Every RANGE partitioned table in scope already has a covering partition for each of the next {{ inputs.windows_ahead }} {{ inputs.window_size }} window(s). Nothing to create."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: >-
      Post to Slack on any failure, including a connection error or targeted windows still uncovered after the pass.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "PostgreSQL missing partition guard FAILED (execution {{ execution.id }}). A connection error, a CREATE error or targeted windows still uncovered after the pass. Check the run."}

extend:
  title: PostgreSQL Missing Partition Provision Guard
  shortDescription: Find RANGE partitioned PostgreSQL tables whose next windows have no partition, create the missing ones behind a dry-run and approval gate, then re-read the partition tree and fail if any of the next N windows is still uncovered.
  metaTitle: PostgreSQL Missing Partition Provision Guard with Kestra
  metaDescription: Detect RANGE partitioned PostgreSQL tables missing future partitions, create them behind an approval gate, then re-read the partition tree to confirm.
  description: |
    A RANGE partitioned table splits its rows across child tables by a time range. Someone has to create next week's partitions before next week arrives. When nobody does, every new row either falls into the DEFAULT partition, which then grows without bound and cannot be split later without an exclusive lock or, with no DEFAULT, the insert fails with "no partition of relation found for row". Either way it is a day-2 outage waiting on the calendar. This guard reads the live partition tree, works out which of the next N windows have no covering partition, creates the missing ones under a gate and proves they landed.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Read-only by default. `dry_run` is true and `auto_remediate` is false, so a plain run reports and never creates a partition.
    - A create happens only when `auto_remediate` is true and `dry_run` is false. It then waits for a human to resume the `Pause` with `approved` set true. An unanswered gate reads as not approved.
    - Creating a partition is additive. It adds an empty child table and changes no existing row. It is idempotent. A window that already has a covering partition is skipped and no create ever overlaps an existing partition.
    - A DEFAULT partition is respected. The guard provisions forward windows so new rows stop landing in DEFAULT. It never detaches or splits a DEFAULT. When the DEFAULT already holds rows for a window being created, PostgreSQL rejects that one create, the re-read reports the window still uncovered and the run fails rather than reporting a false success.
    - The re-read of the partition tree is the real gate, so a create the connecting role is not allowed to run surfaces as a failed run.
    - Scope is RANGE partitioning on a single date or timestamp key, the common time-based case. LIST and HASH partitioning, multi-column range keys and non-temporal range keys are ignored.

    ## How it works

    1. `detect` (`io.kestra.plugin.jdbc.postgresql.Query`) reads `pg_partitioned_table` for RANGE parents keyed on one date or timestamp column, enumerates each parent's children through `pg_inherits`, parses the FROM and TO bounds from `pg_get_expr`, builds the next `windows_ahead` windows from `date_trunc(window_size, now())` and returns one row per window no partition covers. Each row carries the deterministic child name and the exact `CREATE TABLE PARTITION OF` statement, built with `format('%I')` and `format('%L')` so identifiers and bounds are quoted by the database.
    2. `summarize` (`io.kestra.plugin.core.output.OutputValues`) builds the human readable target list and the JSON the loop iterates, so the log, the alert and the loop read the same set.
    3. `log_detect` (`io.kestra.plugin.core.log.Log`) logs the count, the targets and the mode.
    4. `guard` (`io.kestra.plugin.core.flow.If`) branches on the count. With none found, `clean` logs and the run ends. Otherwise `findings_alert` posts the finding on every detection.
    5. `mode` (`io.kestra.plugin.core.flow.If`) enters the remediation branch only when `auto_remediate` is true and `dry_run` is false. Otherwise `report_only` lists what would be created and stops.
    6. `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run until a human resumes it. `create_partitions` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) then runs one `CREATE TABLE PARTITION OF` per target.
    7. `reverify` re-runs the detection and `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` if any targeted window is still uncovered. A window that rolled in during the run is not a target, so it does not fail the run.

    ## What you get

    - A check that reads the real partition tree, so it catches the tables that are about to overflow their last bound.
    - A deterministic child name per window (`<parent>_YYYYMMDD`) and a `CREATE` built inside PostgreSQL, correct for date, timestamp and timestamptz keys.
    - Idempotent provisioning. Run it as often as you like. It only creates what is genuinely missing and never overlaps an existing partition.
    - A real verification step. The run passes only when the second read of the partition tree shows every target covered.
    - Slack alerts on the findings and on any failure.

    ## Who it's for

    - DBAs and platform engineers who run time-partitioned tables and need next week's partitions in place before the inserts arrive.
    - Teams who adopted native partitioning without pg_partman or a cron job and meet the gap the hard way.
    - Teams evaluating the PostgreSQL plugin who want an example that reads the catalog and drives gated, verified DDL.

    ## Why orchestrate this with Kestra

    PostgreSQL has no scheduler, no dry run, no approval step and no way to prove a partition was created. pg_partman solves the scheduling with an extension you have to install and trust. A hand-rolled cron creates blindly and says nothing when a create is rejected. Kestra adds the missing pieces. It schedules the sweep, computes the exact missing windows from the live partition tree, gates the change behind dry-run and approval, builds each `CREATE` inside the database so identifiers and bounds are correct, re-reads the tree to turn a hopeful create into a verified one, applies the same connection settings to every task and posts a Slack alert the moment a step fails.

    ## Tested end to end

    Run on Kestra 2.0.5 against a PostgreSQL 16 server, with a local HTTP sink standing in for Slack. One schema held four tables: `events_default` partitioned by day with a DEFAULT partition and days behind through tomorrow provisioned, `events_strict` partitioned by day with no DEFAULT and only today and tomorrow provisioned, `metrics_full` partitioned by day and already provisioned for the next seven days, plus a plain non-partitioned table. A LIST partitioned table was also present. Every count was confirmed with psql against pg_partition_tree.

    - Detector can fail. At `windows_ahead` 7 the detector returned exactly 10 uncovered windows (five on each of the two under-provisioned tables), never `metrics_full` and never the non-partitioned or LIST table. At `windows_ahead` 1 it returned 0, because today is already covered everywhere.
    - Dry run detected the 10, alerted and left every table at its original child count.
    - Remediate with approval created all 10 and the re-read reported 0 of them still uncovered. `events_default` went from 4 children to 9 and `events_strict` from 2 to 7, `metrics_full` stayed at 7 and the LIST table was untouched. An insert for a previously uncovered day then landed in its own new child rather than in DEFAULT or an error, confirmed with the row's tableoid.
    - A second dry run against the now provisioned tables returned 0 and took the clean branch, so the guard is idempotent.
    - A DEFAULT partition holding a row for one target window blocked that single create. The other 9 were created, the re-read reported that one window still uncovered and the run failed and alerted, which is the honest outcome because splitting a DEFAULT is out of scope.
    - An unreachable host failed the first query and fired the Slack alert.

    ## Prerequisites

    A PostgreSQL server reachable over JDBC with one or more RANGE partitioned tables keyed on a date or timestamp column. The connecting user must be able to read the catalog and to create partitions on the parent tables.

    ### Secrets

    - `POSTGRES_USERNAME`: PostgreSQL user, read when `use_secret_auth` is true.
    - `POSTGRES_PASSWORD`: password for that user.
    - `SLACK_WEBHOOK_URL`: used by `findings_alert` and the `errors` block.
    - In Kestra OSS, provide each secret as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `postgres_url` | STRING | `jdbc:postgresql://localhost:5432/postgres` | PostgreSQL JDBC URL for the target database. |
    | `use_secret_auth` | BOOL | `true` | Read credentials from secrets. Set false only for inline test credentials. |
    | `schema` | STRING | `""` | Optional single schema filter. Empty scans every user schema. |
    | `window_size` | SELECT | `day` | Partition window size: `day`, `week` or `month`. Match how the tables are partitioned. |
    | `windows_ahead` | INT | `7` | How many future windows to keep provisioned, counted from the current window. |
    | `dry_run` | BOOL | `true` | Report without creating anything. |
    | `auto_remediate` | BOOL | `false` | Create behind the approval gate when dry_run is false. |

    ## Quick start

    1. Set `POSTGRES_USERNAME`, `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` as namespace secrets.
    2. Import this flow.
    3. Run it with `postgres_url` pointed at a database that has RANGE partitioned tables. The default dry run reports the missing windows.
    4. To provision them, run again with `dry_run` false and `auto_remediate` true, then resume the paused execution with `approved` true.

    ## How to extend

    - Set `window_size` to `week` or `month` to match a weekly or monthly partitioned table.
    - Raise `windows_ahead` to keep a longer runway of future partitions ready.
    - Set `schema` to restrict the sweep to one schema on a large database.
    - Fail the run as soon as detection finds anything, for a read-only drift check with no remediation.

    ## Links

    - PostgreSQL plugin: https://kestra.io/plugins/plugin-jdbc-postgres
    - Table partitioning: https://www.postgresql.org/docs/current/ddl-partitioning.html
    - CREATE TABLE PARTITION OF: https://www.postgresql.org/docs/current/sql-createtable.html
    - Schedule trigger: https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.schedule
  tags:
    - Data
    - Infrastructure
  subTags:
    - PostgreSQL
    - Maintenance
    - Day 2 Operations
  ee: false
  demo: false
