id: noaa-swpc-geomagnetic-storm-watch
namespace: company.team

description: |
  Monitors real-time planetary K-index (Kp) geomagnetic telemetry from the NOAA Space Weather Prediction
  Center (SWPC), classifies solar storm intensity on the official NOAA G-scale (G1-Minor to G5-Extreme)
  using DuckDB, persists columnar Parquet records in Kestra internal storage, and triggers automated Slack
  alerts when geomagnetic disturbances threaten power grid or satellite infrastructure.

inputs:
  - id: storm_threshold_kp
    type: FLOAT
    displayName: Storm alert threshold (Kp)
    description: Minimum estimated Kp index value (from 0.0 to 9.0) required to trigger a geomagnetic storm alert. Kp >= 5.0 indicates an active G1 geomagnetic storm.
    defaults: 5.0

  - id: lookback_hours
    type: INT
    displayName: Lookback window (hours)
    description: Number of recent hours of 1-minute SWPC telemetry to evaluate for peak geomagnetic activity and trend acceleration.
    defaults: 6

  - id: state_key
    type: STRING
    displayName: KV state key
    description: Key in Kestra KV store used to track previous storm alert states and prevent duplicate notifications during ongoing storms.
    defaults: noaa_geomagnetic_storm_state

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    recoverMissedSchedules: LAST
    description: Evaluates new planetary K-index telemetry every 15 minutes to track rapid coronal mass ejection impacts and magnetosphere disturbances.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: fetch_swpc_telemetry
    type: io.kestra.plugin.core.http.Download
    description: Downloads the latest 1-minute planetary K-index telemetry JSON feed from NOAA SWPC.
    uri: "https://services.swpc.noaa.gov/json/planetary_k_index_1m.json"

  - id: analyze_storm_telemetry
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Processes raw NOAA SWPC telemetry records in DuckDB, computes rolling geomagnetic indices, classifies NOAA
      G-scale storm categories, and produces columnar Parquet and CSV artifacts for audit and alerting.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      telemetry.json: "{{ outputs.fetch_swpc_telemetry.uri }}"
    outputFiles:
      - swpc_kindex_snapshot.parquet
      - active_storm_alerts.csv
    sql: |
      CREATE TABLE raw_telemetry AS
      SELECT * FROM read_json_auto('telemetry.json');

      CREATE TABLE telemetry_enriched AS
      SELECT 
          time_tag::TIMESTAMP AS observation_time,
          kp_index::DOUBLE AS kp_index,
          estimated_kp::DOUBLE AS estimated_kp,
          CASE 
              WHEN estimated_kp >= 9.0 THEN 'G5_EXTREME'
              WHEN estimated_kp >= 8.0 THEN 'G4_SEVERE'
              WHEN estimated_kp >= 7.0 THEN 'G3_STRONG'
              WHEN estimated_kp >= 6.0 THEN 'G2_MODERATE'
              WHEN estimated_kp >= 5.0 THEN 'G1_MINOR'
              WHEN estimated_kp >= 4.0 THEN 'UNSETTLED_ACTIVE'
              ELSE 'QUIET'
          END AS noaa_storm_scale,
          CURRENT_TIMESTAMP AS processed_at
      FROM raw_telemetry
      ORDER BY time_tag DESC;

      COPY (SELECT * FROM telemetry_enriched LIMIT 360) TO 'swpc_kindex_snapshot.parquet' (FORMAT PARQUET);

      CREATE TABLE storm_alerts AS
      SELECT 
          observation_time,
          kp_index,
          estimated_kp,
          noaa_storm_scale
      FROM telemetry_enriched
      WHERE estimated_kp >= {{ inputs.storm_threshold_kp }}
      ORDER BY observation_time DESC;

      COPY storm_alerts TO 'active_storm_alerts.csv' (HEADER, DELIMITER ',');

      SELECT 
          (SELECT estimated_kp FROM telemetry_enriched LIMIT 1) AS latest_kp,
          (SELECT noaa_storm_scale FROM telemetry_enriched LIMIT 1) AS current_scale,
          (SELECT MAX(estimated_kp) FROM telemetry_enriched) AS peak_kp_window,
          (SELECT COUNT(*) FROM storm_alerts)::INTEGER AS alert_count,
          (SELECT strftime(observation_time, '%Y-%m-%d %H:%M:%S UTC') FROM telemetry_enriched LIMIT 1) AS latest_observation_time;

  - id: check_storm_event
    type: io.kestra.plugin.core.flow.If
    description: Checks whether an active geomagnetic disturbance or solar storm is currently detected.
    condition: "{{ outputs.analyze_storm_telemetry.row.alert_count > 0 }}"
    then:
      - id: notify_slack_storm
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: Emits an urgent alert to the operations Slack channel when geomagnetic storm conditions are reached.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *NOAA Space Weather Alert: Geomagnetic Storm Detected*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*NOAA SWPC Geomagnetic Disturbance Alert*\n• *Current Storm Scale*: `{{ outputs.analyze_storm_telemetry.row.current_scale }}`\n• *Latest Estimated Kp*: `{{ outputs.analyze_storm_telemetry.row.latest_kp }}`\n• *Peak Kp in Window*: `{{ outputs.analyze_storm_telemetry.row.peak_kp_window }}`\n• *Observation Time*: `{{ outputs.analyze_storm_telemetry.row.latest_observation_time }}`\n• *Snapshot Storage*: `{{ outputs.analyze_storm_telemetry.outputFiles['swpc_kindex_snapshot.parquet'] }}`"
                }
              }
            ]
          }

  - id: persist_storm_state
    type: io.kestra.plugin.core.kv.Set
    description: Updates the latest observed geomagnetic state in the Kestra KV store.
    key: "{{ inputs.state_key }}"
    value:
      last_kp: "{{ outputs.analyze_storm_telemetry.row.latest_kp }}"
      last_scale: "{{ outputs.analyze_storm_telemetry.row.current_scale }}"
      last_observation: "{{ outputs.analyze_storm_telemetry.row.latest_observation_time }}"
      updated_at: "{{ now() }}"

extend:
  title: NOAA Space Weather Planetary K-Index & Geomagnetic Storm Watch
  metaTitle: NOAA Planetary K-Index & Geomagnetic Storm Watch | Kestra
  shortDescription: Ingest real-time NOAA SWPC planetary K-index telemetry, classify solar storm levels in DuckDB, and alert on geomagnetic risk.
  metaDescription: Ingest NOAA SWPC planetary K-index telemetry, classify geomagnetic solar storm levels in DuckDB, store Parquet, and alert in Slack.
  description: |
    ## What does this flow do?

    This blueprint monitors real-time solar space weather telemetry published by the National Oceanic and Atmospheric Administration (NOAA) Space Weather Prediction Center (SWPC). Every 15 minutes, the workflow ingests 1-minute resolution planetary K-index (Kp) measurements derived from a network of global ground-based magnetometers.

    The flow parses the SWPC JSON telemetry stream inside an embedded DuckDB instance, classifies geomagnetic activity according to the official NOAA Space Weather Scales (G1-Minor, G2-Moderate, G3-Strong, G4-Severe, and G5-Extreme), exports columnar Parquet snapshots to Kestra internal storage, maintains telemetry state in the Kestra KV store, and dispatches automated Slack notifications when geomagnetic activity exceeds critical operational thresholds.

    ## Why use this?

    Severe solar geomagnetic storms caused by coronal mass ejections (CMEs) and solar wind coronal hole streams induce geomagnetically induced currents (GIC) in power transmission grids, disrupt high-frequency (HF) radio communications, degrade satellite orbits and GNSS/GPS positioning accuracy, and pose radiation hazards for high-altitude aviation.

    Key benefits of this automated pipeline include:

    - **Official Federal Science Telemetry**: Directly ingests authentic, real-time observational data from the NOAA SWPC without intermediaries or API key requirements.
    - **Native Analytical Processing**: DuckDB transforms time-series JSON feeds into structured relational tables, calculates peak window values, and writes compressed Parquet files directly into internal storage.
    - **Standardized Operational Severity**: Automatically maps continuous Kp values into actionable NOAA G-scale storm categories to drive downstream operational runbooks.
    - **Resilient State Management**: Employs Kestra KV store to track previous storm levels and avoid redundant alerts during persistent multi-day solar storms.

    ## Architecture

    ```mermaid
    flowchart TD
      A["Schedule Trigger<br/>(Every 15 Minutes)"] --> B["HTTP Download<br/>(NOAA SWPC 1-Minute JSON)"]
      B --> C["DuckDB Queries<br/>(Classify NOAA G1-G5 Storm Scales)"]
      C --> D["Kestra Internal Storage<br/>(swpc_kindex_snapshot.parquet)"]
      C --> E["Kestra Internal Storage<br/>(active_storm_alerts.csv)"]
      C --> F{"If Alert Count > 0"}
      F -- Yes --> G["Slack Notification<br/>(Geomagnetic Storm Alert)"]
      F -- No --> H["Skip Alert"]
      G --> I["KV Set<br/>(Update Last Geomagnetic State)"]
      H --> I
    ```

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin (`io.kestra.plugin.jdbc.duckdb.Queries`) and the Slack notifications plugin (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
    - Outbound HTTPS network connectivity to `services.swpc.noaa.gov`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Optional Slack incoming webhook endpoint for real-time space weather threshold alerts.

    ## Quick start

    1. Import this flow into your Kestra instance.
    2. Click **Execute** using default inputs (`storm_threshold_kp: 5.0`).
    3. Verify the execution outputs under the **Outputs** tab:
       - `swpc_kindex_snapshot.parquet`: Columnar historical snapshot containing the latest 360 observations with NOAA storm scales.
       - `active_storm_alerts.csv`: Tabular CSV listing all readings meeting or exceeding the alert threshold.
    4. Check the **KV Store** tab for the `noaa_geomagnetic_storm_state` key to confirm recorded telemetry values.
    5. Set the `SLACK_WEBHOOK_URL` secret and enable the schedule trigger for continuous 24/7 space weather surveillance.

    ## How to extend

    - **Aurora Borealis Visibility Trigger**: Lower `storm_threshold_kp` to `4.0` or `3.5` to power automated astrophotography or consumer Northern Lights notification feeds.
    - **Multi-Sensor Correlation**: Integrate NOAA solar flare flux telemetry (`https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json`) to track solar proton events simultaneously.
    - **Cloud Data Warehouse Ingestion**: Add downstream tasks using `io.kestra.plugin.aws.s3.Upload` or `io.kestra.plugin.snowflake.Load` to archive multi-year geomagnetic datasets for academic research.

    ## Links

    - [Kestra HTTP Download Plugin](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
    - [Kestra DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Kestra KV Store](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [NOAA Space Weather Prediction Center](https://www.swpc.noaa.gov/)
    - [NOAA Space Weather Scales Explanation](https://www.swpc.noaa.gov/noaa-scales-explanation)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
