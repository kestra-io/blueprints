id: ai-agent-tool-result-replay-verifier
namespace: company.team
description: |
  Do not take an agent's word for what its tools returned. This verifier re-executes every
  recorded tool call from an agent run transcript in a sandbox registry of deterministic stub
  tools and compares each reproduced output with the output the agent claimed. A deterministic
  claim that does not reproduce is a fabricated claim, and a transcript that is mostly
  unverifiable is not evidence at all. The run ends with a verdict and an evidence pack, and a
  failed gate stops the execution with a Fail task, so no downstream step can consume an
  unverified transcript. Nothing is escalated anywhere: no GitHub issue, no Slack alert, no LLM
  judge. The Fail task is the enforcement.
  What it does: it turns an agent run transcript into a verifiability verdict by replaying the
  recorded tool calls, scoring reproduced claims, and blocking downstream consumption when the
  transcript fails the gate. Prerequisites: a JSON export of an agent run transcript (the
  bundled demo transcript shows the shape); no secrets, no agent endpoint, and no external
  services are needed to run it. How it works: the scheduled run ingests the transcript,
  replays every step against the stub tool registry, builds the verdict and the evidence pack,
  and branches on the gate: a passing run is recorded, a failing run is stopped by the Fail
  task. How to adapt it: replace the stub registry with deterministic reimplementations of
  your own tools, tune min_verified_rate and max_unverifiable_share to your release bar, and
  point previous_verdict_url at each published verdict so the trend builds over time.
triggers:
  - id: nightly_replay
    type: io.kestra.plugin.core.trigger.Schedule
    description: Nightly 07:00 UTC replay of the previous day's agent run transcripts; run it on
      demand from the UI or API right after an agent run completes, with transcript_url pointing
      at that run's export.
    cron: 0 7 * * *
inputs:
  - id: transcript_url
    type: STRING
    defaults: ''
    description: URL (http, https, or file) of a JSON transcript export to verify instead of the
      bundled demo transcript. Each step carries step, tool, args, and claimed_output.
  - id: transcript_override
    type: STRING
    defaults: ''
    description: Leave empty in production. Demo and testing seam. A JSON array of transcript
      steps in the same shape as the export, so the verifier can be exercised without a live
      log pipeline.
  - id: min_verified_rate
    type: INT
    defaults: 90
    description: Minimum verified rate (percent) across deterministic steps for the run to pass.
      A deterministic step is one whose tool is in the replay registry and is marked
      deterministic; nondeterministic and unknown tools are excluded from this rate.
  - id: max_unverifiable_share
    type: INT
    defaults: 30
    description: Maximum share (percent) of steps that may be unverifiable before the gate
      fails, even when every deterministic claim reproduces. A transcript that is mostly
      unverifiable is not evidence, however clean its replayable part looks.
  - id: previous_verdict_url
    type: STRING
    defaults: ''
    description: URL (http, https, or file) of the previous run's verdict.json, used for the
      trend comparison. Empty marks this run as the baseline.
tasks:
  - id: replay_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the transcript, the replay results, and the verdict are
      the same files every stage reads.
    tasks:
      - id: ingest_transcript
        type: io.kestra.plugin.scripts.python.Script
        description: Resolve the transcript (inline override, then URL, then the bundled demo
          transcript), validate every step for the fields the replay needs, and write
          transcript.json. A malformed transcript fails here, loudly, instead of being
          silently treated as verified.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          TRANSCRIPT_URL: '{{ inputs.transcript_url }}'
          TRANSCRIPT_OVERRIDE: '{{ inputs.transcript_override }}'
        script: |
          import json, os, urllib.request
          from kestra import Kestra

          DEMO = [
              {"step": 1, "tool": "calculator",
               "args": {"expression": "6 * 7"}, "claimed_output": "42"},
              {"step": 2, "tool": "order_lookup",
               "args": {"order_id": "8841"}, "claimed_output": "shipped"},
              {"step": 3, "tool": "currency_convert",
               "args": {"amount": 100, "from": "USD", "to": "EUR"},
               "claimed_output": "92.00 EUR"},
              {"step": 4, "tool": "text_stats",
               "args": {"text": "hello world from the agent"},
               "claimed_output": "words=5 chars=26"},
              {"step": 5, "tool": "date_add",
               "args": {"date": "2026-10-20", "days": 14},
               "claimed_output": "2026-11-03"},
              {"step": 6, "tool": "live_lookup",
               "args": {"query": "current weather"},
               "claimed_output": "sunny, 24C"},
          ]

          def validate(steps):
              if not isinstance(steps, list):
                  raise ValueError("transcript must be a JSON array of steps")
              for step in steps:
                  if not isinstance(step, dict):
                      raise ValueError("each transcript step must be an object")
                  for field in ("step", "tool", "args", "claimed_output"):
                      if field not in step:
                          raise ValueError("transcript step missing field: " + field)
                  if not isinstance(step["args"], dict):
                      raise ValueError("step args must be an object")
                  if not isinstance(step["claimed_output"], str):
                      raise ValueError("step claimed_output must be a string")
              return steps

          override = os.environ.get("TRANSCRIPT_OVERRIDE", "").strip()
          url = os.environ.get("TRANSCRIPT_URL", "").strip()
          if override:
              steps = validate(json.loads(override))
              source = "override"
          elif url:
              with urllib.request.urlopen(url, timeout=30) as resp:
                  steps = validate(json.loads(resp.read().decode()))
              source = "url"
          else:
              steps = validate(DEMO)
              source = "demo"
          with open("transcript.json", "w") as fh:
              json.dump(steps, fh, indent=2)
          Kestra.outputs({"step_count": len(steps), "source": source})
          print("ingested %d steps from %s" % (len(steps), source))

      - id: replay_steps
        type: io.kestra.plugin.scripts.python.Script
        description: |
          Re-execute every transcript step against the stub tool registry. The
          registry holds deterministic reimplementations only (a calculator with a safe
          expression evaluator, an order lookup over bundled data, a fixed-rate currency
          converter, a text statistics function, and date arithmetic). Tools that depend on
          live state (live_lookup) and tools the registry does not know are never replayed;
          they are recorded as UNVERIFIABLE with the reason, not silently passed or failed.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          import ast
          import json
          from datetime import date, timedelta
          from kestra import Kestra

          ORDERS = {"8841": "shipped", "9207": "delivered", "9315": "processing"}
          RATES = {("USD", "EUR"): 0.92, ("EUR", "USD"): 1.09,
                   ("USD", "GBP"): 0.79, ("GBP", "USD"): 1.27}
          NONDETERMINISTIC = {"live_lookup"}

          def calc(expression):
              if not isinstance(expression, str):
                  raise ValueError("expression must be a string")
              tree = ast.parse(expression, mode="eval")

              def ev(node):
                  if isinstance(node, ast.Expression):
                      return ev(node.body)
                  if isinstance(node, ast.Constant) and isinstance(node.value, (int, float)) \
                          and not isinstance(node.value, bool):
                      return node.value
                  if isinstance(node, ast.BinOp) and isinstance(
                          node.op, (ast.Add, ast.Sub, ast.Mult, ast.Div, ast.Mod, ast.FloorDiv)):
                      left, right = ev(node.left), ev(node.right)
                      if isinstance(node.op, ast.Add):
                          return left + right
                      if isinstance(node.op, ast.Sub):
                          return left - right
                      if isinstance(node.op, ast.Mult):
                          return left * right
                      if isinstance(node.op, ast.Div):
                          return left / right
                      if isinstance(node.op, ast.Mod):
                          return left % right
                      return left // right
                  if isinstance(node, ast.UnaryOp) and isinstance(node.op, (ast.USub, ast.UAdd)):
                      value = ev(node.operand)
                      return -value if isinstance(node.op, ast.USub) else value
                  raise ValueError("unsupported expression element")
              result = ev(tree)
              if isinstance(result, float) and result.is_integer():
                  return str(int(result))
              if isinstance(result, float):
                  return str(round(result, 6))
              return str(result)

          def order_lookup(args):
              order_id = str(args.get("order_id", ""))
              if order_id not in ORDERS:
                  raise ValueError("unknown order_id: " + order_id)
              return ORDERS[order_id]

          def currency_convert(args):
              amount = args.get("amount")
              src, dst = args.get("from"), args.get("to")
              if isinstance(amount, bool) or not isinstance(amount, (int, float)):
                  raise ValueError("amount must be a number")
              if (src, dst) not in RATES:
                  raise ValueError("unsupported currency pair: %s to %s" % (src, dst))
              return "%.2f %s" % (amount * RATES[(src, dst)], dst)

          def text_stats(args):
              text = args.get("text")
              if not isinstance(text, str):
                  raise ValueError("text must be a string")
              return "words=%d chars=%d" % (len(text.split()), len(text))

          def date_add(args):
              raw = args.get("date")
              days = args.get("days")
              if not isinstance(raw, str) or isinstance(days, bool) \
                      or not isinstance(days, int):
                  raise ValueError("date must be a string and days an integer")
              year, month, day = (int(part) for part in raw.split("-"))
              return (date(year, month, day) + timedelta(days=days)).isoformat()

          TOOLS = {"calculator": lambda a: calc(a.get("expression")),
                   "order_lookup": order_lookup,
                   "currency_convert": currency_convert,
                   "text_stats": text_stats,
                   "date_add": date_add}

          steps = json.load(open("transcript.json"))
          results = []
          for step in steps:
              tool = step["tool"]
              claimed = step["claimed_output"].strip()
              if tool in NONDETERMINISTIC:
                  results.append({"step": step["step"], "tool": tool,
                                  "claimed_output": step["claimed_output"],
                                  "replayed_output": None, "status": "UNVERIFIABLE",
                                  "reason": "nondeterministic tool, output depends on live state"})
              elif tool not in TOOLS:
                  results.append({"step": step["step"], "tool": tool,
                                  "claimed_output": step["claimed_output"],
                                  "replayed_output": None, "status": "UNVERIFIABLE",
                                  "reason": "tool not in replay registry"})
              else:
                  try:
                      replayed = TOOLS[tool](step["args"])
                  except Exception as exc:
                      results.append({"step": step["step"], "tool": tool,
                                      "claimed_output": step["claimed_output"],
                                      "replayed_output": None, "status": "REPLAY_ERROR",
                                      "reason": "replay failed: %s" % exc})
                  else:
                      if replayed.strip() == claimed:
                          results.append({"step": step["step"], "tool": tool,
                                          "claimed_output": step["claimed_output"],
                                          "replayed_output": replayed, "status": "VERIFIED",
                                          "reason": "replayed output matches claimed output"})
                      else:
                          results.append({"step": step["step"], "tool": tool,
                                          "claimed_output": step["claimed_output"],
                                          "replayed_output": replayed, "status": "FABRICATED",
                                          "reason": "replayed output differs from claimed output"})
          with open("replay_results.json", "w") as fh:
              json.dump(results, fh, indent=2)
          counts = {}
          for result in results:
              counts[result["status"]] = counts.get(result["status"], 0) + 1
          Kestra.outputs({"replayed_steps": len(results), "counts": counts})
          print("replayed %d steps: %s" % (len(results), json.dumps(counts, sort_keys=True)))

      - id: build_verdict
        type: io.kestra.plugin.scripts.python.Script
        description: Build the verdict and the evidence pack from the replay results. The
          verified rate covers deterministic steps only; a fabricated claim or a replay error
          fails the gate outright, as does a verified rate below the floor or an unverifiable
          share above its cap. The evidence pack (verdict.json and verdict.md) records every
          step with its claimed output, its replayed output, and its status, so a reviewer can
          check the gate without rerunning anything.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          MIN_VERIFIED_RATE: '{{ inputs.min_verified_rate }}'
          MAX_UNVERIFIABLE_SHARE: '{{ inputs.max_unverifiable_share }}'
          PREVIOUS_VERDICT_URL: '{{ inputs.previous_verdict_url }}'
        script: |
          import json, os, urllib.request
          from kestra import Kestra

          min_rate = int(os.environ.get("MIN_VERIFIED_RATE", "90"))
          max_share = int(os.environ.get("MAX_UNVERIFIABLE_SHARE", "30"))
          previous_url = os.environ.get("PREVIOUS_VERDICT_URL", "").strip()

          results = json.load(open("replay_results.json"))
          total = len(results)
          verified = sum(1 for r in results if r["status"] == "VERIFIED")
          fabricated = sum(1 for r in results if r["status"] == "FABRICATED")
          replay_errors = sum(1 for r in results if r["status"] == "REPLAY_ERROR")
          unverifiable = sum(1 for r in results if r["status"] == "UNVERIFIABLE")
          deterministic = verified + fabricated + replay_errors
          verified_rate = round(100.0 * verified / deterministic, 1) if deterministic else 0.0
          unverifiable_share = round(100.0 * unverifiable / total, 1) if total else 0.0
          passed = (total > 0 and fabricated == 0 and replay_errors == 0
                    and verified_rate >= min_rate and unverifiable_share <= max_share)
          verdict = "VERIFIED" if passed else "REJECTED"

          trend = {"previous_verified_rate": None, "previous_verdict": None,
                   "note": "baseline run, no previous verdict"}
          if previous_url:
              try:
                  with urllib.request.urlopen(previous_url, timeout=30) as resp:
                      previous = json.loads(resp.read().decode())
                  prev_rate = float(previous["verified_rate"])
                  prev_verdict = str(previous["verdict"])
                  delta = round(verified_rate - prev_rate, 1)
                  note = ("verified rate up" if delta > 0 else
                          ("verified rate down" if delta < 0 else "verified rate unchanged"))
                  trend = {"previous_verified_rate": prev_rate,
                           "previous_verdict": prev_verdict, "delta": delta, "note": note}
              except Exception as exc:
                  trend = {"previous_verified_rate": None, "previous_verdict": None,
                           "note": "previous verdict unreadable: %s" % exc}

          payload = {"steps_total": total, "verified": verified,
                     "fabricated": fabricated, "replay_errors": replay_errors,
                     "unverifiable": unverifiable, "verified_rate": verified_rate,
                     "unverifiable_share": unverifiable_share,
                     "min_verified_rate": min_rate, "max_unverifiable_share": max_share,
                     "passed": passed, "verdict": verdict, "trend": trend,
                     "results": results}
          with open("verdict.json", "w") as fh:
              json.dump(payload, fh, indent=2)

          lines = ["# Agent tool-result replay verdict: %s" % verdict, "",
                   "Replayed **%d steps**: %d verified, %d fabricated, %d replay errors, "
                   "%d unverifiable. Verified rate **%.1f%%** (gate %d%%), unverifiable share "
                   "**%.1f%%** (cap %d%%). Trend: %s." % (
                       total, verified, fabricated, replay_errors, unverifiable,
                       verified_rate, min_rate, unverifiable_share, max_share,
                       trend["note"]),
                   "", "| Step | Tool | Status | Claimed | Replayed |",
                   "| --- | --- | --- | --- | --- |"]
          for result in results:
              lines.append("| %s | %s | %s | %s | %s |" % (
                  result["step"], result["tool"], result["status"],
                  result["claimed_output"], result["replayed_output"] or "not replayed"))
          lines += ["", "## Gate",
                    "",
                    "A REJECTED verdict means this transcript must not be consumed downstream: "
                    "either a deterministic claim did not reproduce, a recorded call could not "
                    "run at all, the verified rate fell below the floor, or too much of the "
                    "transcript is unverifiable to count as evidence. Fix the agent or the "
                    "recording, then rerun; do not override the gate by editing the verdict."]
          with open("verdict.md", "w") as fh:
              fh.write("\n".join(lines) + "\n")

          Kestra.outputs(payload)
          Kestra.vars({"passed": passed, "verified_rate": verified_rate,
                       "fabricated_count": fabricated, "replay_error_count": replay_errors,
                       "unverifiable_share": unverifiable_share, "verdict": verdict})
          print("verdict=%s verified=%d fabricated=%d replay_errors=%d unverifiable=%d "
                "rate=%.1f share=%.1f passed=%s" % (
                    verdict, verified, fabricated, replay_errors, unverifiable,
                    verified_rate, unverifiable_share, passed))

  - id: block_unverified
    type: io.kestra.plugin.core.flow.If
    description: Branch on the replay gate. A verified transcript is recorded and the pipeline
      may proceed; a rejected transcript stops the execution here, so no downstream step can
      consume claims that did not reproduce.
    condition: '{{ outputs.build_verdict.vars.passed == false }}'
    then:
      - id: block_downstream
        type: io.kestra.plugin.core.execution.Fail
        description: |
          Fail the execution so the pipeline stops before an unverified transcript
          reaches any downstream consumer. This is the whole enforcement mechanism (there is
          no issue, no alert, and no judge to appeal to, only the evidence pack).
        errorMessage: 'Replay gate rejected this transcript: {{ outputs.build_verdict.vars.fabricated_count }} fabricated claims, {{ outputs.build_verdict.vars.replay_error_count }} replay errors, verified rate {{ outputs.build_verdict.vars.verified_rate }} percent, verdict {{ outputs.build_verdict.vars.verdict }}. See verdict.json and verdict.md.'
    else:
      - id: record_verified_run
        type: io.kestra.plugin.core.log.Log
        description: Record the verified run so the execution history doubles as the audit
          trail for transcripts that passed the gate.
        message: 'Transcript verified: verified rate {{ outputs.build_verdict.vars.verified_rate }} percent, unverifiable share {{ outputs.build_verdict.vars.unverifiable_share }} percent, verdict {{ outputs.build_verdict.vars.verdict }}.'

extend:
  title: Verify an Agent Run by Replaying Its Tool Calls
  metaTitle: 'AI Agent Tool-Result Replay Verifier | Kestra'
  shortDescription: Re-execute the recorded tool calls from an agent run transcript, compare
    each reproduced output with the claimed output, and block downstream use when the
    transcript fails the gate.
  metaDescription: 'Deterministic replay verification for agent run transcripts, with a stub
    tool registry, fabricated-claim detection, an unverifiable-share cap, an evidence pack,
    and a Fail task that stops the pipeline on a rejected transcript.'
  description: |
    ## What it does

    Agents report what their tools returned, and downstream steps usually believe them. That
    trust is misplaced whenever a run is misrecorded, edited, or hallucinated: a claimed order
    status, a claimed calculation, or a claimed conversion that never happened flows straight
    into decisions, tickets, and customer replies. This blueprint stops that at the gate. It
    takes a recorded run transcript, re-executes every tool call in a sandbox registry of
    deterministic stub tools, and compares each reproduced output with the output the agent
    claimed. Deterministic claims that do not reproduce are fabricated claims. Steps whose
    tools depend on live state, or that the registry does not know, are recorded as
    unverifiable, never silently passed. The run ends with a verdict and an evidence pack, and
    a rejected transcript stops the execution with a Fail task, so no downstream step can
    consume it. Nothing is escalated anywhere: no GitHub issue, no Slack alert, no LLM judge.
    The Fail task is the enforcement, and the evidence pack is the appeal.

    ## Prerequisites

    A JSON export of an agent run transcript: an array of steps, each carrying step, tool,
    args, and claimed_output (the bundled demo transcript shows the shape, and it runs with
    no inputs at all). No secrets, no agent endpoint, and no external service are needed: the
    replay runs against deterministic stub tools in the flow itself. In production, point
    transcript_url at your run export and replace the stub registry with deterministic
    reimplementations of your own tools, keeping every reimplementation free of network
    access, clocks, and randomness, or the replay proves nothing.

    ## How it works

    1. `nightly_replay` (`io.kestra.plugin.core.trigger.Schedule`) runs the verifier nightly
    at 07:00 UTC. Run it on demand after an agent run completes, with transcript_url pointing
    at that run's export.
    2. `ingest_transcript` ([Python scripts](https://kestra.io/plugins/plugin-script-python))
    resolves the transcript from the override input, the URL input, or the bundled demo set,
    validates every step for the fields the replay needs, and writes transcript.json. A
    malformed transcript fails here, loudly, instead of being silently treated as verified.
    3. `replay_steps` (Python) re-executes every step against the stub tool registry: a
    calculator with a safe expression evaluator, an order lookup over bundled data, a
    fixed-rate currency converter, a text statistics function, and date arithmetic.
    Nondeterministic tools and unknown tools are recorded as UNVERIFIABLE with the reason.
    4. `build_verdict` (Python) scores the replay: the verified rate covers deterministic
    steps only, a fabricated claim or a replay error fails the gate outright, and an
    unverifiable share above the cap fails it too. It writes the evidence pack
    (verdict.json and verdict.md) with every step, its claimed output, its replayed output,
    and its status, plus the trend against the previous verdict.
    5. `block_unverified` ([Kestra flow tasks](https://kestra.io/docs/workflow-components/tasks#flow-tasks))
    branches on the gate: a verified transcript is recorded by `record_verified_run`, and a
    rejected transcript is stopped by `block_downstream`
    (`io.kestra.plugin.core.execution.Fail`), so the pipeline stops before an unverified
    transcript reaches any downstream consumer.

    ## Quick start

    1. Run the flow once with no inputs: the bundled demo transcript exercises the full
    pipeline and produces a VERIFIED verdict (five deterministic claims reproduce, one
    live_lookup step is honestly unverifiable, inside the cap).
    2. Read verdict.md for the per-step table and the gate verdict.
    3. Point transcript_url at a real run export, replace the stub registry with
    deterministic reimplementations of your own tools, and tune min_verified_rate and
    max_unverifiable_share to your release bar.
    4. Point previous_verdict_url at each published verdict so the trend builds over time.

    ## Expected outputs

    transcript.json (the validated transcript), replay_results.json (one record per step with
    claimed output, replayed output, status, and reason), and verdict.json plus verdict.md
    (counts, verified rate, unverifiable share, gate verdict, trend, and the per-step table).
    On a rejected transcript the execution itself fails at `block_downstream`; there is no
    issue and no alert, by design.

    ## How to adapt it

    Add deterministic reimplementations of your own tools to the registry in replay_steps,
    keeping each one free of network access, clocks, and randomness, and mark any tool that
    cannot meet that bar as nondeterministic so its steps count against the unverifiable
    cap instead of being faked as verified. Tune min_verified_rate to your tolerance for
    failed reproductions (the default 90 percent still fails on any fabricated claim, since
    fabricated claims fail the gate outright) and max_unverifiable_share to the fraction of
    a transcript you are willing to take on trust. Keep the Fail task as the enforcement:
    swapping it for an alert turns this gate back into a scanner that downstream steps can
    ignore.
  tags:
    - AI
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
