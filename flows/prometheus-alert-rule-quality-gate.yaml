id: prometheus-alert-rule-quality-gate
namespace: company.observability
description: |
  Review a public PrometheusRule resource or Prometheus rule file before deploying alerts. The flow
  verifies rule group structure, ensures alert and recording rules have expressions, checks for duplicate
  alert names, validates required severity labels against an allowlist, and reports missing alert summaries
  or hold durations. It produces auditable JSON evidence, can archive the report to S3, and blocks on
  malformed or policy-incompatible rules. This does not parse or execute PromQL expressions; use promtool
  against the target Prometheus version for full syntax validation.

inputs:
  - id: rules_url
    type: STRING
    displayName: Prometheus rules URL
    defaults: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/main/manifests/kubernetesControlPlane-prometheusRule.yaml
    description: Public URL to a PrometheusRule Kubernetes resource or a direct Prometheus rules YAML file.
  - id: allowed_severities
    type: STRING
    displayName: Allowed alert severities
    defaults: critical,warning,info
    description: Comma-separated severity values allowed for alerting rules.
  - id: require_severity
    type: BOOL
    displayName: Require severity labels
    defaults: true
    description: Block alerts without an allowed severity label.
  - id: require_summary
    type: BOOL
    displayName: Require summary annotation
    defaults: true
    description: Block alerts without a non-empty annotations.summary.
  - id: warn_when_for_missing
    type: BOOL
    displayName: Warn when for is missing
    defaults: true
    description: Report alerting rules with no for duration. Some alerts intentionally fire immediately.
  - id: block_duplicate_alert_names
    type: BOOL
    displayName: Block duplicate alert names
    defaults: false
    description: Block duplicates across groups. By default, duplicates are reported as warnings because rules can intentionally be scoped to separate clusters.
  - id: notify_slack
    type: BOOL
    displayName: Send Slack notifications
    defaults: false
    description: Enable only when SLACK_WEBHOOK_URL is configured in the Kestra namespace.
  - id: archive_report
    type: BOOL
    displayName: Archive report to S3
    defaults: false
    description: Store the JSON rule-quality report in S3. AWS secrets are required only when enabled.
  - id: evidence_bucket
    type: STRING
    displayName: Evidence bucket
    defaults: my-observability-evidence
    description: Existing S3 bucket used when report archival is enabled.
  - id: evidence_prefix
    type: STRING
    displayName: Evidence prefix
    defaults: prometheus-rule-audits
    description: Prefix for per-config rule-quality reports.
  - id: aws_region
    type: STRING
    displayName: AWS region
    defaults: eu-west-1
    description: Region of the evidence bucket.

triggers:
  - id: weekly_prometheus_rule_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Re-audit the selected Prometheus rules weekly and after rule changes. Enable after reviewing the source file and thresholds.
    cron: "0 9 * * 1"
    disabled: true

tasks:
  - id: validate_request
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the source URL and severity allowlist before fetching rule content.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      RULES_URL: "{{ inputs.rules_url }}"
      ALLOWED_SEVERITIES: "{{ inputs.allowed_severities }}"
    script: |
      import os
      from urllib.parse import urlsplit

      url = os.environ.get("RULES_URL", "").strip()
      severities = [value.strip().lower() for value in os.environ.get("ALLOWED_SEVERITIES", "").split(",") if value.strip()]
      parsed = urlsplit(url)
      if parsed.scheme.lower() != "https" or not parsed.hostname:
          raise ValueError("rules_url must be an absolute HTTPS URL")
      if parsed.username or parsed.password:
          raise ValueError("rules_url must not contain embedded credentials")
      if not severities:
          raise ValueError("allowed_severities must contain at least one severity")
      print(f"Validated Prometheus rules URL with {len(severities)} allowed severity value(s).")

  - id: fetch_prometheus_rules
    type: io.kestra.plugin.core.http.Request
    description: Fetch the live PrometheusRule manifest or rules YAML to evaluate.
    uri: "{{ inputs.rules_url }}"
    method: GET
    headers:
      Accept: application/yaml, text/yaml, text/plain, */*
      User-Agent: Kestra-Prometheus-Alert-Rule-Quality-Gate/1.0
    timeout: PT45S

  - id: audit_rule_quality
    type: io.kestra.plugin.scripts.python.Script
    description: Parse Prometheus rule groups, check expression and metadata presence, flag duplicate alert names, and apply severity policy.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install pyyaml kestra
    inputFiles:
      prometheus-rules.yaml: "{{ outputs.fetch_prometheus_rules.body }}"
    env:
      RULES_URL: "{{ inputs.rules_url }}"
      ALLOWED_SEVERITIES: "{{ inputs.allowed_severities }}"
      REQUIRE_SEVERITY: "{{ inputs.require_severity }}"
      REQUIRE_SUMMARY: "{{ inputs.require_summary }}"
      WARN_FOR_MISSING: "{{ inputs.warn_when_for_missing }}"
      BLOCK_DUPLICATES: "{{ inputs.block_duplicate_alert_names }}"
    outputFiles:
      - prometheus-rule-audit.json
    script: |
      import json
      import os
      import re
      from collections import defaultdict
      from datetime import datetime, timezone

      import yaml
      from kestra import Kestra

      rules_url = os.environ["RULES_URL"].strip()
      allowed_severities = {value.strip().lower() for value in os.environ.get("ALLOWED_SEVERITIES", "").split(",") if value.strip()}
      require_severity = os.environ.get("REQUIRE_SEVERITY", "true").lower() == "true"
      require_summary = os.environ.get("REQUIRE_SUMMARY", "true").lower() == "true"
      warn_for_missing = os.environ.get("WARN_FOR_MISSING", "true").lower() == "true"
      block_duplicates = os.environ.get("BLOCK_DUPLICATES", "false").lower() == "true"

      with open("prometheus-rules.yaml", encoding="utf-8") as source:
          raw = source.read()
      try:
          documents = [doc for doc in yaml.safe_load_all(raw) if doc is not None]
      except yaml.YAMLError as exc:
          raise ValueError(f"Prometheus rule YAML is invalid: {exc}") from exc

      findings = []
      def add(code, severity, message, location=None, rule_name=None):
          findings.append({
              "code": code,
              "severity": severity,
              "message": message,
              "location": location,
              "ruleName": rule_name,
          })

      groups = []
      resource_count = 0
      for document_index, document in enumerate(documents):
          if not isinstance(document, dict):
              add("DOCUMENT_SHAPE_INVALID", "BLOCK", "Each YAML document must be a mapping.", f"document[{document_index}]")
              continue
          if document.get("kind") == "PrometheusRule":
              resource_count += 1
              spec = document.get("spec") or {}
              if not isinstance(spec, dict):
                  add("PROMETHEUSRULE_SPEC_INVALID", "BLOCK", "PrometheusRule spec must be a mapping.", f"document[{document_index}].spec")
                  continue
              document_groups = spec.get("groups") or []
          else:
              document_groups = document.get("groups") or []
          if not isinstance(document_groups, list):
              add("GROUP_LIST_INVALID", "BLOCK", "Rule groups must be a list.", f"document[{document_index}].groups")
              continue
          for group_index, group in enumerate(document_groups):
              groups.append({
                  "source": f"document[{document_index}].groups[{group_index}]",
                  "group": group,
              })

      seen_alerts = defaultdict(list)
      seen_records = defaultdict(list)
      rule_count = 0
      alert_count = 0
      recording_count = 0
      missing_for = []
      missing_summaries = []
      missing_severities = []
      for group_item in groups:
          group = group_item["group"]
          group_location = group_item["source"]
          if not isinstance(group, dict):
              add("GROUP_ENTRY_INVALID", "BLOCK", "Rule group must be a mapping.", group_location)
              continue
          group_name = str(group.get("name") or "").strip()
          if not group_name:
              add("GROUP_NAME_MISSING", "BLOCK", "Rule group has no name.", group_location)
          rules = group.get("rules") or []
          if not isinstance(rules, list):
              add("RULE_LIST_INVALID", "BLOCK", "Group rules must be a list.", group_location)
              continue
          for rule_index, rule in enumerate(rules):
              rule_count += 1
              location = f"{group_location}.rules[{rule_index}]"
              if not isinstance(rule, dict):
                  add("RULE_ENTRY_INVALID", "BLOCK", "Rule entry must be a mapping.", location)
                  continue
              alert = str(rule.get("alert") or "").strip()
              record = str(rule.get("record") or "").strip()
              if bool(alert) == bool(record):
                  add("RULE_KIND_INVALID", "BLOCK", "Each rule must define exactly one of alert or record.", location)
                  continue
              expr = rule.get("expr")
              if expr is None or not str(expr).strip():
                  add("RULE_EXPRESSION_MISSING", "BLOCK", "Rule has no non-empty expression.", location, alert or record)
              if alert:
                  alert_count += 1
                  seen_alerts[alert].append({"group": group_name, "location": location})
                  labels = rule.get("labels") or {}
                  annotations = rule.get("annotations") or {}
                  if not isinstance(labels, dict):
                      add("ALERT_LABELS_INVALID", "BLOCK", "Alert labels must be a mapping.", location, alert)
                      labels = {}
                  if not isinstance(annotations, dict):
                      add("ALERT_ANNOTATIONS_INVALID", "BLOCK", "Alert annotations must be a mapping.", location, alert)
                      annotations = {}
                  severity = str(labels.get("severity") or "").strip().lower()
                  if not severity or severity not in allowed_severities:
                      missing_severities.append({"alert": alert, "group": group_name, "severity": severity or None})
                      if require_severity:
                          add("ALERT_SEVERITY_MISSING_OR_DISALLOWED", "BLOCK", f"Alert severity {severity!r} is missing or outside the allowed severity list.", location, alert)
                      else:
                          add("ALERT_SEVERITY_MISSING_OR_DISALLOWED", "WARN", f"Alert severity {severity!r} is missing or outside the allowed severity list.", location, alert)
                  summary = str(annotations.get("summary") or "").strip()
                  if not summary:
                      missing_summaries.append(alert)
                      severity_level = "BLOCK" if require_summary else "WARN"
                      add("ALERT_SUMMARY_MISSING", severity_level, "Alert has no annotations.summary.", location, alert)
                  if not str(rule.get("for") or "").strip():
                      missing_for.append(alert)
                      if warn_for_missing:
                          add("ALERT_FOR_DURATION_MISSING", "WARN", "Alert has no for duration; confirm immediate firing is intentional.", location, alert)
              else:
                  recording_count += 1
                  seen_records[record].append({"group": group_name, "location": location})

      duplicate_alerts = []
      for alert_name, locations in seen_alerts.items():
          if len(locations) > 1:
              duplicate_alerts.append({"name": alert_name, "locations": locations})
              severity_level = "BLOCK" if block_duplicates else "WARN"
              add("DUPLICATE_ALERT_NAME", severity_level, f"Alert name appears in {len(locations)} rule locations; check whether the groups are intentionally distinct.", None, alert_name)

      blocking = [finding for finding in findings if finding["severity"] == "BLOCK"]
      warnings = [finding for finding in findings if finding["severity"] == "WARN"]
      verdict = "FAIL" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "rulesUrl": rules_url,
          "documentCount": len(documents),
          "prometheusRuleResourceCount": resource_count,
          "groupCount": len(groups),
          "ruleCount": rule_count,
          "alertRuleCount": alert_count,
          "recordingRuleCount": recording_count,
          "allowedSeverities": sorted(allowed_severities),
          "duplicateAlertNames": duplicate_alerts,
          "missingForDurationCount": len(missing_for),
          "missingSummaryCount": len(missing_summaries),
          "missingSeverityCount": len(missing_severities),
          "findings": findings,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "scopeNote": "This checks rule metadata and expression presence; it does not parse or execute PromQL. Use promtool with the target Prometheus version for complete syntax validation.",
      }
      with open("prometheus-rule-audit.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)

      print(f"Prometheus rule quality audit: verdict={verdict}; groups={len(groups)}, rules={rule_count}, alerts={alert_count}, recording={recording_count}, duplicate_alert_names={len(duplicate_alerts)}, blocking={len(blocking)}")
      Kestra.outputs({
          "rules_url": rules_url,
          "document_count": len(documents),
          "prometheus_rule_resource_count": resource_count,
          "group_count": len(groups),
          "rule_count": rule_count,
          "alert_rule_count": alert_count,
          "recording_rule_count": recording_count,
          "duplicate_alert_name_count": len(duplicate_alerts),
          "missing_for_duration_count": len(missing_for),
          "missing_summary_count": len(missing_summaries),
          "missing_severity_count": len(missing_severities),
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "findings": findings,
          "verdict": verdict,
      })

  - id: optionally_archive_report
    type: io.kestra.plugin.core.flow.If
    description: Optionally archive the rule quality report in S3 for review and release evidence.
    condition: "{{ inputs.archive_report }}"
    then:
      - id: upload_prometheus_rule_report
        type: io.kestra.plugin.aws.s3.Upload
        description: Store the report without copying source repositories or runtime telemetry.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ inputs.aws_region }}"
        bucket: "{{ inputs.evidence_bucket }}"
        from: "{{ outputs.audit_rule_quality.outputFiles['prometheus-rule-audit.json'] }}"
        key: "{{ inputs.evidence_prefix }}/prometheus-rule-audit.json"

  - id: enforce_rule_policy
    type: io.kestra.plugin.core.flow.If
    description: Fail closed when rule expressions, group structure or required alert metadata violate policy; Slack is optional.
    condition: "{{ outputs.audit_rule_quality.vars.verdict == 'FAIL' }}"
    then:
      - id: optionally_alert_blocked_prometheus_rules
        type: io.kestra.plugin.core.flow.If
        description: Send a Slack alert only when explicitly enabled and the webhook secret is configured.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: alert_blocked_prometheus_rules
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Notify observability owners when alert rule quality checks fail.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |-
              {{
                {
                  "text": ":rotating_light: Prometheus rule quality gate BLOCKED\\nURL: " ~ outputs.audit_rule_quality.vars.rules_url ~
                    "\\nFindings: " ~ (outputs.audit_rule_quality.vars.findings | toJson) ~
                    "\\nExecution: " ~ execution.id ~
                    "\\nReview prometheus-rule-audit.json for details."
                } | toJson
              }}
      - id: fail_prometheus_rule_policy
        type: io.kestra.plugin.core.execution.Fail
        description: Prevent deployment of malformed or policy-incompatible alert rule sets.
        errorMessage: "Prometheus rule quality policy failed for {{ outputs.audit_rule_quality.vars.rules_url }}."
    else:
      - id: log_prometheus_rule_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Prometheus rule quality audit {{ outputs.audit_rule_quality.vars.verdict }}: groups={{ outputs.audit_rule_quality.vars.group_count }}, alerts={{ outputs.audit_rule_quality.vars.alert_rule_count }}, blocking={{ outputs.audit_rule_quality.vars.blocking_finding_count }}."

errors:
  - id: optionally_alert_prometheus_rule_audit_failure
    type: io.kestra.plugin.core.flow.If
    description: Optionally notify the configured Slack channel when the fetch or audit task fails; the workflow failure remains visible without Slack.
    condition: "{{ inputs.notify_slack }}"
    then:
      - id: alert_prometheus_rule_audit_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert if the rules file cannot be fetched or parsed so an incomplete audit is not mistaken for a pass.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |-
          {{
            {
              "text": ":warning: Prometheus rule audit execution failed\\nURL: " ~ inputs.rules_url ~
                "\\nExecution: " ~ execution.id ~
                "\\nInspect Kestra logs; fetch and YAML parsing errors must not be interpreted as PASS."
            } | toJson
          }}

outputs:
  - id: rules_source
    type: STRING
    description: Public source URL audited by this flow. Detailed inventory, findings and verdict are available in the audit_rule_quality task outputs and prometheus-rule-audit.json file.
    value: "{{ inputs.rules_url }}"

extend:
  title: Prometheus Alert Rule Quality and Metadata Gate
  metaTitle: Prometheus Alert Rule Quality and Metadata Gate | Kestra
  shortDescription: Audit Prometheus rule groups for missing expressions, duplicate alerts, invalid severity labels, missing summaries and absent hold durations before deployment.
  metaDescription: Check PrometheusRule YAML for valid group structure, expression presence, duplicate alert names and consistent severity and summary metadata.
  description: |
    Review a PrometheusRule resource or Prometheus rules file before deploying alerts. The flow parses YAML, verifies rule group and expression structure, checks alert severity against an allowed list, requires alert summary annotations when configured, and reports duplicate alert names and missing hold durations. It produces a JSON report, supports optional S3 evidence archival, and blocks on malformed or policy-incompatible rules.

    ## How it works

    1. Validate the public rules URL and severity allowlist.
    2. Fetch the live YAML source.
    3. Parse Kubernetes PrometheusRule resources or direct Prometheus rule groups.
    4. Check group names, alert/record rule kind, expression presence, severity metadata, summary annotations and duplicate alert names.
    5. Optionally archive the report to S3 and route blocking findings to Slack and a failed task.

    ## What you get

    - Rule and group counts, including alert and recording rule totals.
    - Detection of missing expressions and malformed rule or group structure.
    - Severity allowlist enforcement and missing summary annotation findings.
    - Duplicate alert name diagnostics and warnings for alerts with no hold duration.
    - Optional S3 evidence storage and a blocking policy result.

    ## Who it's for

    - SRE teams maintaining Prometheus alert rules.
    - Kubernetes platform teams managing Prometheus Operator resources.
    - Observability engineers reviewing alert metadata and routing consistency before deployment.

    ## Why orchestrate this with Kestra

    Kestra makes the quality checks repeatable, records the source URL and output report, allows periodic drift detection, and provides an explicit failed execution for required deployment gates.

    ## Prerequisites

    - A Kestra 2.x worker with Docker enabled for Python Script tasks.
    - Network access to the public YAML source.
    - A Slack incoming webhook for blocking findings; S3 archival is optional.

    ### Secrets

    - SLACK_WEBHOOK_URL: optional Slack incoming webhook; only required when notify_slack is enabled.
    - AWS_ACCESS_KEY_ID: optional AWS access key used only when report archival is enabled.
    - AWS_SECRET_ACCESS_KEY: optional AWS secret key used only when report archival is enabled.

    ## Quick start

    1. Import the flow with the kube-prometheus Kubernetes control-plane rule resource URL.
    2. Execute once and inspect prometheus-rule-audit.json and the prometheus_rule_audit output.
    3. Adjust allowed_severities and require_summary to match the organization's alert conventions.
    4. Review duplicate alert names manually; some may intentionally appear in multiple groups with different matchers or cluster scopes.
    5. Use promtool against the target Prometheus version for full PromQL syntax validation, then enable the weekly schedule.

    ## How to extend

    - Check that runbook URLs resolve and follow an approved domain allowlist.
    - Require ownership, team and service labels for production alerts.
    - Add policy for critical alerts with no for duration or no runbook.
    - Invoke promtool or the Prometheus Operator admission validator in a pinned build container for version-aware validation.

    ## Links

    - [Prometheus rule configuration](https://prometheus.io/docs/prometheus/latest/configuration/recording_rules/)
    - [Prometheus Operator PrometheusRule API](https://prometheus-operator.dev/docs/api-reference/api/#monitoring.coreos.com/v1.PrometheusRule)
    - [kube-prometheus source rule](https://github.com/prometheus-operator/kube-prometheus/blob/main/manifests/kubernetesControlPlane-prometheusRule.yaml)
    - [Kestra HTTP Request plugin](https://kestra.io/plugins/plugin-core/http/io.kestra.plugin.core.http.request)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack/slackincomingwebhook)
    - [Kestra AWS S3 plugin](https://kestra.io/plugins/plugin-aws/s3)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
