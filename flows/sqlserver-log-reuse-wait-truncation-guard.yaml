id: sqlserver-log-reuse-wait-truncation-guard
namespace: company.team

description: |
  Find SQL Server databases whose transaction log cannot truncate and is close to
  filling its file. The audit reads log_reuse_wait_desc from sys.databases next to
  the used percentage from sys.dm_db_log_stats, splits the findings by reason then
  alerts Slack. Behind a safe by default gate and a human approval it runs
  BACKUP LOG on the databases held by LOG_BACKUP, then re-reads the reason and the
  used percentage and fails the run if the log still cannot truncate. A log held
  by an open transaction, replication, a running backup or a lagging replica is
  reported instead, because a log backup does not clear those.

inputs:
  - id: url
    type: STRING
    displayName: JDBC URL
    description: Points at the SQL Server instance. The audit reads instance wide catalog views, so connecting to master is enough.
    defaults: "jdbc:sqlserver://localhost:1433"

  - id: user
    type: STRING
    displayName: SQL Server login
    defaults: sa

  - id: password
    type: STRING
    displayName: SQL Server password
    description: Defaults to the SQLSERVER_PASSWORD secret. Override only for local testing.
    defaults: "{{ secret('SQLSERVER_PASSWORD') }}"

  - id: used_pct_threshold
    type: INT
    displayName: Log used percentage threshold
    description: Flag a database once the active part of its log reaches this share of the log file. Above it the next growth step or the next write is what fills the volume.
    defaults: 70

  - id: min_log_size_mb
    type: INT
    displayName: Minimum log size in MB
    description: Ignore a log file smaller than this. A tiny log at a high percentage grows past the number before it threatens anything.
    defaults: 8

  - id: include_bulk_logged
    type: BOOL
    displayName: Include BULK_LOGGED databases
    description: BULK_LOGGED behaves like FULL for log truncation, so it needs log backups too. Set false to look at FULL only.
    defaults: true

  - id: backup_dir
    type: STRING
    displayName: Log backup directory
    description: A real directory the SQL Server service account can write. Each run writes one log backup file per database here. Never point this at NUL. The value goes inside a T-SQL string literal, so quotes and other special characters are rejected.
    defaults: "/var/opt/mssql/backup"
    validator: '^[A-Za-z0-9_ .:/\\-]+$'

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Allow BACKUP LOG to run on the databases held by LOG_BACKUP.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, before any log backup runs.
    defaults: true

variables:
  audit_sql: |
    WITH eligible AS (
      SELECT d.database_id, d.name, d.recovery_model_desc, d.log_reuse_wait_desc
      FROM sys.databases d
      WHERE d.database_id > 4
        AND d.name NOT IN ('master', 'model', 'msdb', 'tempdb')
        AND d.state_desc = 'ONLINE'
        AND d.is_read_only = 0
        AND d.source_database_id IS NULL
        AND d.recovery_model_desc IN ('FULL'{% if inputs.include_bulk_logged %}, 'BULK_LOGGED'{% endif %})
    )
    SELECT
      e.name AS database_name,
      e.recovery_model_desc AS recovery_model,
      e.log_reuse_wait_desc AS reuse_wait,
      CAST(s.total_log_size_mb AS DECIMAL(18, 1)) AS total_log_mb,
      CAST(s.active_log_size_mb AS DECIMAL(18, 1)) AS active_log_mb,
      CAST(100.0 * s.active_log_size_mb / NULLIF(s.total_log_size_mb, 0) AS DECIMAL(5, 1)) AS used_pct,
      CAST(s.log_since_last_log_backup_mb AS DECIMAL(18, 1)) AS since_backup_mb,
      s.total_vlf_count,
      CASE WHEN e.log_reuse_wait_desc = 'LOG_BACKUP' THEN 'BACKUP_LOG' ELSE 'REPORT_ONLY' END AS fix_action,
      CASE e.log_reuse_wait_desc
        WHEN 'LOG_BACKUP' THEN 'No log backup has been taken since the records were written. A log backup clears this.'
        WHEN 'ACTIVE_TRANSACTION' THEN 'An open transaction holds the log. Find the transaction and commit or roll it back. A log backup does not clear this.'
        WHEN 'REPLICATION' THEN 'The log reader has not read these records yet. Check the log reader agent or change data capture. A log backup does not clear this.'
        WHEN 'ACTIVE_BACKUP_OR_RESTORE' THEN 'A backup or restore is running against this database. Wait for it. A log backup does not clear this.'
        WHEN 'AVAILABILITY_REPLICA' THEN 'A secondary replica has not hardened these records. Check the replica and its send queue. A log backup does not clear this.'
        WHEN 'DATABASE_MIRRORING' THEN 'The mirror is behind. Check the mirroring session. A log backup does not clear this.'
        WHEN 'OLDEST_PAGE' THEN 'Indirect checkpoint has not written the oldest dirty page yet. A log backup does not clear this.'
        WHEN 'XTP_CHECKPOINT' THEN 'The in memory OLTP checkpoint is behind. A log backup does not clear this.'
        WHEN 'CHECKPOINT' THEN 'No checkpoint has run since the records were written. Usually transient. A log backup does not clear this.'
        WHEN 'LOG_SCAN' THEN 'A log scan is reading the log. Usually transient. A log backup does not clear this.'
        ELSE 'Read the reason and act on it directly. A log backup does not clear this.'
      END AS reason_note,
      CONCAT(CHAR(39), REPLACE(e.name, CHAR(39), CHAR(39) + CHAR(39)), CHAR(39)) AS db_literal,
      CONCAT('BACKUP LOG ', QUOTENAME(e.name), ' TO DISK = ', CHAR(39), '{{ inputs.backup_dir }}/', REPLACE(REPLACE(e.name, CHAR(39), '_'), ' ', '_'), '_log_{{ execution.id }}.trn', CHAR(39), ' WITH INIT') AS backup_sql
    FROM eligible e
    CROSS APPLY sys.dm_db_log_stats(e.database_id) s
    WHERE e.log_reuse_wait_desc <> 'NOTHING'
      AND s.total_log_size_mb >= {{ inputs.min_log_size_mb }}
      AND 100.0 * s.active_log_size_mb / NULLIF(s.total_log_size_mb, 0) >= {{ inputs.used_pct_threshold }}
    ORDER BY used_pct DESC

  state_sql: |
    SELECT
      d.name AS database_name,
      d.log_reuse_wait_desc AS reuse_wait,
      CAST(s.total_log_size_mb AS DECIMAL(18, 1)) AS total_log_mb,
      CAST(s.active_log_size_mb AS DECIMAL(18, 1)) AS active_log_mb,
      CAST(100.0 * s.active_log_size_mb / NULLIF(s.total_log_size_mb, 0) AS DECIMAL(5, 1)) AS used_pct,
      CAST(s.log_since_last_log_backup_mb AS DECIMAL(18, 1)) AS since_backup_mb
    FROM sys.databases d
    CROSS APPLY sys.dm_db_log_stats(d.database_id) s
    WHERE d.name IN ({{ outputs.targets.values.db_list }})
    ORDER BY used_pct DESC

  verify_sql: |
    SELECT
      d.name AS database_name,
      d.log_reuse_wait_desc AS reuse_wait,
      CAST(100.0 * s.active_log_size_mb / NULLIF(s.total_log_size_mb, 0) AS DECIMAL(5, 1)) AS used_pct
    FROM sys.databases d
    CROSS APPLY sys.dm_db_log_stats(d.database_id) s
    WHERE d.name IN ({{ outputs.targets.values.db_list }})
      AND d.log_reuse_wait_desc <> 'NOTHING'
      AND 100.0 * s.active_log_size_mb / NULLIF(s.total_log_size_mb, 0) >= {{ inputs.used_pct_threshold }}
    ORDER BY used_pct DESC

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.sqlserver.Query
    description: Read-only. Joins log_reuse_wait_desc from sys.databases to the log sizes from sys.dm_db_log_stats for every ONLINE writable user database in FULL or BULK_LOGGED recovery. It keeps the ones whose log cannot truncate and is at or over the used percentage threshold. System databases are excluded by name and by database_id, snapshots by source_database_id.
    url: "{{ inputs.url }}"
    username: "{{ inputs.user }}"
    password: "{{ inputs.password }}"
    trustServerCertificate: true
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: targets
    type: io.kestra.plugin.core.output.OutputValues
    description: Split the findings by reason. Only the LOG_BACKUP rows carry a BACKUP LOG statement, built in T-SQL with QUOTENAME so the server quotes the identifier. Everything else is report only.
    values:
      backup_plan: "{{ outputs.audit.rows | jq('[.[] | select(.fix_action == \"BACKUP_LOG\") | {db: .database_name, reason: .reuse_wait, used: .used_pct, total: .total_log_mb, backup: .backup_sql}]') | first | toJson }}"
      db_list: "{{ outputs.audit.rows | jq('[.[] | select(.fix_action == \"BACKUP_LOG\") | .db_literal] | join(\",\")') | first }}"
      backup_count: "{{ outputs.audit.rows | jq('[.[] | select(.fix_action == \"BACKUP_LOG\")] | length') | first }}"
      report_count: "{{ outputs.audit.rows | jq('[.[] | select(.fix_action != \"BACKUP_LOG\")] | length') | first }}"
      report_lines: "{{ outputs.audit.rows | jq('[.[] | select(.fix_action != \"BACKUP_LOG\") | \"\\(.database_name) reuse_wait=\\(.reuse_wait) used=\\(.used_pct)% of \\(.total_log_mb)MB: \\(.reason_note)\"] | join(\" | \")') | first }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      SQL Server log reuse audit on {{ inputs.url }}: {{ outputs.audit.size }} database(s) whose log cannot truncate at or over {{ inputs.used_pct_threshold }}% used.
      {{ outputs.targets.values.backup_count }} fixable by a log backup, {{ outputs.targets.values.report_count }} held by something a log backup does not clear.
      {{ outputs.audit.rows | jq('[.[] | "\(.database_name) \(.recovery_model) reuse_wait=\(.reuse_wait) used=\(.used_pct)% active=\(.active_log_mb)MB of \(.total_log_mb)MB since_backup=\(.since_backup_mb)MB"] | join("; ")') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'SQL Server ' ~ inputs.url ~ ': ' ~ outputs.audit.size ~ ' log(s) cannot truncate at or over ' ~ inputs.used_pct_threshold ~ '% used. ' ~ (outputs.audit.rows | jq('[.[] | "\(.database_name) reuse_wait=\(.reuse_wait) used=\(.used_pct)% of \(.total_log_mb)MB"] | join("; ")') | first) ~ '. ' ~ outputs.targets.values.backup_count ~ ' fixable by a log backup, ' ~ outputs.targets.values.report_count ~ ' not.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Waiting for approval to run BACKUP LOG.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: reason_split
        type: io.kestra.plugin.core.flow.If
        condition: "{{ (outputs.targets.values.report_count | number) > 0 }}"
        then:
          - id: not_fixable_by_backup
            type: io.kestra.plugin.core.log.Log
            level: WARN
            message: >-
              {{ outputs.targets.values.report_count }} log(s) cannot truncate for a reason a log backup does not clear, so this flow leaves them alone and reports them: {{ outputs.targets.values.report_lines }}.
        else:
          - id: all_fixable_by_backup
            type: io.kestra.plugin.core.log.Log
            message: Every flagged log is held only by a missing log backup, so a log backup clears all of them.

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: backup_scope
            type: io.kestra.plugin.core.flow.If
            condition: "{{ (outputs.targets.values.backup_count | number) > 0 }}"
            then:
              - id: approval_gate
                type: io.kestra.plugin.core.flow.Pause
                description: Hold the run until a human approves. A log backup writes a real file and moves the log chain forward, so it never starts on its own.
                pauseDuration: PT2H
                behavior: FAIL
                onResume:
                  - id: approved
                    type: BOOL
                    required: false
                    description: Set true to run BACKUP LOG on the listed databases. Anything else leaves them alone.

              - id: apply
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
                then:
                  - id: remediate
                    type: io.kestra.plugin.core.flow.Loop
                    description: Serial on purpose. concurrencyLimit 1 keeps two log backups from writing at once, which would compete for the same disk and the same log chain.
                    concurrencyLimit: 1
                    values: "{{ outputs.targets.values.backup_plan }}"
                    tasks:
                      - id: backup_log
                        type: io.kestra.plugin.jdbc.sqlserver.Query
                        description: A real log backup to a real file. This is what lets the inactive part of the log truncate and it keeps the log chain intact. Backing up to NUL would truncate the log while throwing the records away, which breaks every differential and log restore taken after it.
                        url: "{{ inputs.url }}"
                        username: "{{ inputs.user }}"
                        password: "{{ inputs.password }}"
                        trustServerCertificate: true
                        fetchType: NONE
                        sql: "{{ fromJson(item.value).backup }}"

                  - id: after_state
                    type: io.kestra.plugin.jdbc.sqlserver.Query
                    description: Read the reason, the log size and the used percentage back for every database the run touched, whatever the outcome.
                    url: "{{ inputs.url }}"
                    username: "{{ inputs.user }}"
                    password: "{{ inputs.password }}"
                    trustServerCertificate: true
                    fetchType: FETCH
                    sql: "{{ render(vars.state_sql) }}"

                  - id: state_log
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Before: {{ fromJson(outputs.targets.values.backup_plan) | jq('[.[] | "\(.db) reuse_wait=\(.reason) used=\(.used)%"] | join("; ")') | first }}.
                      After: {{ outputs.after_state.rows | jq('[.[] | "\(.database_name) reuse_wait=\(.reuse_wait) used=\(.used_pct)% active=\(.active_log_mb)MB of \(.total_log_mb)MB"] | join("; ")') | first }}.

                  - id: reverify
                    type: io.kestra.plugin.jdbc.sqlserver.Query
                    description: Re-read the reason and the used percentage for the databases the run touched. It returns only the ones whose log still cannot truncate and is still at or over the threshold. This read does not ask for LOG_BACKUP, because that is the value the fix moves. A log that flipped to ACTIVE_TRANSACTION and stayed full is still a log that cannot truncate.
                    url: "{{ inputs.url }}"
                    username: "{{ inputs.user }}"
                    password: "{{ inputs.password }}"
                    trustServerCertificate: true
                    fetchType: FETCH
                    sql: "{{ render(vars.verify_sql) }}"

                  - id: verify_result
                    type: io.kestra.plugin.core.flow.If
                    condition: "{{ outputs.reverify.size > 0 }}"
                    then:
                      - id: remediation_failed
                        type: io.kestra.plugin.core.execution.Fail
                        errorMessage: "The log backup ran but the log still cannot truncate: {{ outputs.reverify.rows | jq('[.[] | \"\\(.database_name) reuse_wait=\\(.reuse_wait) used=\\(.used_pct)%\"] | join(\", \")') | first }}. Read the reuse_wait value above. A different value means another holder took over. Still LOG_BACKUP means the log kept being written while the backup ran, usually by a long transaction that has not committed, so one backup did not free anything reusable. Clear that holder, then run this flow again."
                    else:
                      - id: remediated
                        type: io.kestra.plugin.core.log.Log
                        message: "Log backup taken on {{ fromJson(outputs.targets.values.backup_plan) | jq('[.[] | .db] | join(\", \")') | first }}. Every one of them can truncate again and is back under {{ inputs.used_pct_threshold }}% used."
                else:
                  - id: declined
                    type: io.kestra.plugin.core.log.Log
                    message: "Approval was not given, so no log backup ran. The findings stand: {{ fromJson(outputs.targets.values.backup_plan) | jq('[.[] | \"\\(.db) used=\\(.used)%\"] | join(\", \")') | first }}."
            else:
              - id: no_backup_target
                type: io.kestra.plugin.core.log.Log
                level: WARN
                message: >-
                  Nothing here is fixable by a log backup, so no statement ran even with auto_remediate on and dry_run off.
                  All {{ outputs.targets.values.report_count }} finding(s) are held by something else: {{ outputs.targets.values.report_lines }}.
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: >-
          Nothing matched on {{ inputs.url }}: no ONLINE writable user database in FULL{% if inputs.include_bulk_logged %} or BULK_LOGGED{% endif %} recovery has a log that cannot truncate at or over {{ inputs.used_pct_threshold }}% used with a log file of at least {{ inputs.min_log_size_mb }} MB.
          Either every log can truncate or the ones that cannot still have room. Nothing to back up.

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'SQL Server log reuse wait guard failed on ' ~ inputs.url ~ ' (execution ' ~ execution.id ~ '). The audit could not run, a log backup was rejected or the log still cannot truncate after the backup. Check the logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Always runs in safe mode (audit only).
    cron: "0 3 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: SQL Server Log Reuse Wait Truncation Guard
  shortDescription: Find SQL Server logs that cannot truncate and are close to full, split the findings by reason, then run BACKUP LOG on the ones a log backup fixes and re-read to confirm the log can truncate again.
  metaTitle: SQL Server Log Reuse Wait Truncation Guard with Kestra
  metaDescription: Read log_reuse_wait_desc and the log used percentage, alert Slack, run BACKUP LOG where it helps, then re-read to confirm the log can truncate.
  description: |
    A database in FULL recovery whose log has never been backed up cannot truncate.
    Nothing reclaims the inactive part of the log, so the file grows on every
    autogrowth step until the volume fills. Then every write in that database
    fails with error 9002 and the application stops. The database is online and
    healthy right up to that point, which is why nobody sees it coming. The fix is
    a log backup, the one piece of routine maintenance that was never set up.

    `sys.databases.log_reuse_wait_desc` names the reason the log cannot truncate.
    When it reads `LOG_BACKUP` a log backup clears it. When it reads
    `ACTIVE_TRANSACTION`, `REPLICATION`, `ACTIVE_BACKUP_OR_RESTORE` or
    `AVAILABILITY_REPLICA` a log backup does nothing. Running one anyway just
    hides the real holder for another hour.

    This blueprint reads both numbers that matter, the reason and how full the log
    already is. It routes on the reason. It alerts Slack with the whole picture.
    When you allow it and a human approves the run, it takes a real `BACKUP LOG`
    on the databases held by `LOG_BACKUP` only. Then it re-reads
    `log_reuse_wait_desc` and the used percentage and fails the run if the log
    still cannot truncate.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Only `ONLINE`, writable **user** databases in `FULL` or `BULK_LOGGED` recovery are considered. `master`, `model`, `msdb` and `tempdb` are excluded by name and by `database_id > 4`. Database snapshots are excluded by `source_database_id IS NULL`. A `SIMPLE` recovery database is never touched, since its log truncates at every checkpoint.
    - Read-only by default. `dry_run` is `true` and `auto_remediate` is `false`, so a normal run only reads and alerts.
    - A write happens only when `auto_remediate` is `true`, `dry_run` is `false` **and** a human resumes the `Pause` with `approved: true`. A pause resumed without an answer reads as a refusal.
    - Only the rows whose reason is `LOG_BACKUP` carry a statement. A log held by anything else is reported and left alone, so the flow never pretends a backup helped.
    - `backup_dir` must be a real directory the SQL Server service account can write. `BACKUP LOG ... TO DISK = 'NUL'` would truncate the log while throwing the records away, which breaks the log chain and every differential and log restore taken after it. The flow therefore takes a real destination and writes one file per database per run.
    - The loop has `concurrencyLimit: 1`, so two log backups never write at once.
    - Each `BACKUP LOG` runs as its own autocommitting `io.kestra.plugin.jdbc.sqlserver.Query`, because `BACKUP` cannot run inside an explicit transaction.
    - A log backup taken by this flow is part of the real log chain. If a scheduled backup job also runs, point `backup_dir` at the same place so the files stay together.

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.sqlserver.Query`, read-only) joins `log_reuse_wait_desc` from `sys.databases` to `sys.dm_db_log_stats(database_id)` for every eligible database. It keeps the rows where the reason is not `NOTHING`, the log file is at least `min_log_size_mb` and `active_log_size_mb / total_log_size_mb` is at or over `used_pct_threshold`. Each row carries its reason, its used percentage, the megabytes written since the last log backup, a plain sentence saying what clears that reason. A `LOG_BACKUP` row also carries a `BACKUP LOG` statement built in T-SQL with `QUOTENAME`.
    2. `targets` (`io.kestra.plugin.core.output.OutputValues`) splits the rows into the ones a log backup fixes and the ones it does not. It builds the quoted name list for the re-read from the fixable rows only. `summary` (`io.kestra.plugin.core.log.Log`) logs every finding with its reason and sizes.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs that no eligible database has a log that cannot truncate and is at or over the threshold.
       - **findings:** `alert` posts the reasons and the counts to Slack.
         - `reason_split` warns with one line per database that a log backup cannot help. Otherwise it confirms that every finding is fixable by a log backup.
         - `remediate_gate` runs only when `auto_remediate` is `true` and `dry_run` is `false`.
         - `backup_scope` runs only when at least one finding is held by `LOG_BACKUP`. When none is, `no_backup_target` says so and nothing is executed, not even the pause.
         - `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run until a human resumes it.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs one `BACKUP LOG` per database.
         - `after_state` reads the reason, the sizes and the used percentage back and `state_log` logs before and after side by side.
         - `reverify` returns the databases whose log still cannot truncate and is still at or over the threshold. `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` if there are any. That read does not ask for `LOG_BACKUP`, because that is the value the fix moves: a log that flipped to `ACTIVE_TRANSACTION` and stayed full is still a log that cannot truncate.
         - `declined` logs the findings untouched when the approval was refused.
    4. `errors` posts a Slack alert when the audit cannot run, a backup is rejected or the re-read fails the run.

    ## What you get

    - The reason the log cannot truncate, next to how full the log already is. One of those numbers on its own tells you nothing. A log at 20 percent with `LOG_BACKUP` is a backup job to set up next week. The same reason at 98 percent is an outage this afternoon.
    - Routing on the reason, so a database held by an open transaction or a lagging replica is named and left alone instead of being handed a backup that cannot help it.
    - A real log backup to a real file, which keeps the log chain usable, rather than a truncate that throws the records away.
    - A second read of `log_reuse_wait_desc` and the used percentage that fails the run when the log still cannot truncate, so a log held by a second reason is never reported as fixed.
    - `log_since_last_log_backup_mb` per database, which says how much of the log a backup is about to free.
    - A Slack alert on the findings and a separate alert on failure.

    ## Who it's for

    - DBAs who inherited databases someone set to `FULL` recovery without ever adding a log backup job, which is the most common way a SQL Server volume fills.
    - Platform teams who want the 9002 error caught while the log is at 80 percent instead of at 100.
    - Teams running replication, change data capture or Always On, where the reason is often not `LOG_BACKUP` and a backup would be the wrong move.
    - Anyone evaluating the SQL Server plugin who wants an example that reads a dynamic management function, routes on what it found and gates the write.

    ## Why orchestrate this with Kestra

    The decision here is not whether to run a backup, it is whether a backup is even the right action. That depends on a value you have to read first. Doing it by hand means connecting to the instance, reading `sys.databases` for every database, working out how full each log is, then picking the ones a backup helps. It is also the kind of check nobody does until an application is already down. Kestra reads both values, splits the findings by reason, gates the write behind two inputs and a human approval, runs one backup at a time, then reads the reason again and fails loudly if the log still cannot truncate. The Slack alert carries the reasons, so an on-call engineer knows whether this is a backup job to add or a transaction to go and find. The run history keeps every before and after.

    ## Tested end to end

    On Kestra 2.0.5 against SQL Server 2022 on Linux, with a local HTTP sink standing in for Slack. Four databases were seeded on one instance: `appreuse` in `FULL` recovery with a full backup taken and then 4200 wide rows written and no log backup ever, `txreuse` in `FULL` recovery with a log backup taken and then an open transaction left holding the log, `failreuse` in `FULL` recovery with an open transaction holding the log while its reason still read `LOG_BACKUP`, plus `simplereuse` left untouched in `SIMPLE` recovery. Every number below was read back with `sqlcmd` against `sys.databases` and `sys.dm_db_log_stats`, not from the flow log.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 2 flagged: `appreuse` `LOG_BACKUP` at 98.1% of a 34.0 MB log, `txreuse` `ACTIVE_TRANSACTION` at 71.5% of 16.0 MB. 1 fixable by a log backup, 1 report only. `simplereuse` not flagged |
    | 2 | `auto_remediate: true`, `dry_run: true` | the same 2 findings, the same Slack line, no `.trn` written. The dry run blocked the write with `auto_remediate` on |
    | 3 | `auto_remediate: true`, `dry_run: false`, pause resumed with `approved: false` | `declined` logged the findings. `sqlcmd` still read `LOG_BACKUP` at 98.1% |
    | 4 | same, resumed with `approved: true` | one real 33.5 MB `.trn` written, named after the execution id. `appreuse`: **`LOG_BACKUP` at 98.1% to `NOTHING` at 0.2%**, confirmed with `sqlcmd`. `reverify` returned 0 rows. `txreuse` untouched |
    | 5 | defaults, after run 4 | 1 flagged, only `txreuse`. `appreuse` is out of the findings |
    | 6 | `auto_remediate: true`, `dry_run: false` on that state | `no_backup_target`. No statement ran and the pause was never even reached, because the only finding is not fixable by a log backup |
    | 7 | `used_pct_threshold: 99` on the degraded instance | 0 flagged, `clean` branch, which proves the percentage gates the detection |
    | 8 | `failreuse` at `LOG_BACKUP` 72.6% with an open transaction holding its log, `used_pct_threshold: 50`, approved | the backup ran, the reason flipped to `ACTIVE_TRANSACTION`, the log stayed at 71.0%, `reverify` returned the row and `remediation_failed` **failed the run**. The `errors` block posted to Slack |
    | 9 | defaults with `failreuse` switched to `BULK_LOGGED` | flagged as `BULK_LOGGED` `LOG_BACKUP` at 76.5%, so BULK_LOGGED is covered |
    | 10 | the same state with `include_bulk_logged: false` | `failreuse` dropped out and only `txreuse` was left, so the recovery model filter works both ways |
    | 11 | unreachable host | `audit` failed on the TCP connection and the `errors` block posted to Slack |
    | 12 | both held transactions killed, both logs backed up by hand, then defaults | 0 flagged, `clean` branch. `txreuse` read `LOG_BACKUP` at 0.7% at that moment and was correctly left out, because the reason on its own is not a finding |

    Across every run `simplereuse` stayed out of the findings. No statement ever ran against a database whose reason was not `LOG_BACKUP`. Run 8 was repeated with the transaction still writing while the backup ran: the reason then stayed `LOG_BACKUP` at 76.4% rather than flipping. The re-read failed the run just the same, which is why that read does not ask for a particular reason.

    ## Prerequisites

    - A SQL Server instance you can reach over JDBC, 2016 SP2 or later for `sys.dm_db_log_stats`. The audit reads instance wide catalog views, so any database context works.
    - A login that can read `sys.databases` and `sys.dm_db_log_stats` (`VIEW SERVER STATE` plus `VIEW ANY DEFINITION`) or `sysadmin`. The remediation also needs `BACKUP LOG` on each target, so `db_backupoperator` is enough, as is `sysadmin`.
    - A directory on the server the SQL Server service account can write, for the log backups.
    - A Slack incoming webhook.

    ### Secrets

    - `SQLSERVER_PASSWORD`: password for the login in `user`. The `password` input defaults to this secret.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook, used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `url` | `jdbc:sqlserver://localhost:1433` | SQL Server instance to check |
    | `user` | `sa` | SQL Server login |
    | `password` | `{{ secret('SQLSERVER_PASSWORD') }}` | Password for the login |
    | `used_pct_threshold` | `70` | Flag a log at or over this used percentage |
    | `min_log_size_mb` | `8` | Ignore a log file smaller than this |
    | `include_bulk_logged` | `true` | Also check `BULK_LOGGED` databases |
    | `backup_dir` | `/var/opt/mssql/backup` | Directory for the log backups. Never `NUL`. Quotes are rejected |
    | `auto_remediate` | `false` | Allow `BACKUP LOG` to run |
    | `dry_run` | `true` | Must be `false` for a backup to run |

    ## Quick start

    1. Add the `SQLSERVER_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, set `url` and `user`, then set `backup_dir` to a directory the SQL Server service account can write.
    3. Run it once with the defaults and read the reasons. Lower `used_pct_threshold` to see logs that cannot truncate but still have room.
    4. For the `LOG_BACKUP` findings, run with `auto_remediate: true` and `dry_run: false` and approve the pause. Then add a real log backup schedule, because this flow buys time rather than replacing one.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Add a `log_since_last_log_backup_mb` floor to the audit, so a database that only wrote a few megabytes since its last backup is left for the regular schedule.
    - Read `sys.dm_tran_database_transactions` and `sys.dm_exec_sessions` in the `ACTIVE_TRANSACTION` branch, so the report names the session holding the log instead of only the reason.
    - Point the `REPLICATION` branch at `sys.dm_repl_traninfo` or the log reader agent history, so the report says how far behind the log reader is.
    - Alert on the trend rather than the level by writing each run's used percentage to a KV key, so a log climbing two points a day is caught before it reaches the threshold.
    - Add a second input that refuses to back up a database whose log is already over a size you consider broken, so a log that needs a shrink is handed to a human instead.

