id: api-key-rotation-manager
namespace: company.security

extend:
  title: Automated API Key Lifecycle and Rotation Manager
  metaTitle: Automated API Key Rotation and Credential Lifecycle Pipeline | Kestra
  shortDescription: Audits API key expiration dates, generates cryptographic replacement tokens in Python, and executes zero-downtime rollover.
  metaDescription: Orchestrate automated API key rotation, parallel gateway probes, and credential lifecycle management with Kestra.
  description: |
    Automates third-party and internal API key rotation to prevent production outages caused by expired credentials. Evaluates expiration thresholds, provisions cryptographically secure replacement tokens in Python, verifies gateway availability in parallel, and safely executes phased token rollover.

    ## How it works
    1. A Schedule trigger (weekly) or an on-demand Webhook initiates the credential audit.
    2. A Parallel block checks dependent API gateway availability.
    3. A Python script generates secure replacement tokens and evaluates expiration urgency.
    4. An If branch provisions the new key and initiates a graceful grace period if expiration is near, or logs a healthy status otherwise.

    ## What you get
    - Zero-downtime credential rotation without manual spreadsheet tracking.
    - Automated cryptographic token generation and fingerprint logging.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Click Execute with default inputs to test the automated rotation branch.

    ## Links
    - [Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Parallel Tasks](https://kestra.io/docs/workflow-components/flowable-tasks/parallel)
  tags:
    - DevOps
  subTags:
    - Security
  ee: false
  demo: false

inputs:
  - id: target_service_name
    type: STRING
    defaults: "stripe-billing-gateway"
  - id: current_key_id
    type: STRING
    defaults: "key_prod_9941a"
  - id: days_until_expiration
    type: INT
    defaults: 4
  - id: expiration_warning_threshold
    type: INT
    defaults: 7

triggers:
  - id: weekly_rotation_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * 1"

  - id: manual_rotation_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "rotate-api-key-secret"

tasks:
  - id: evaluate_expiration_urgency
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: |
      [CREDENTIAL AUDIT] Evaluating API key [{{ inputs.current_key_id }}] for service [{{ inputs.target_service_name }}].
      Days until expiration: {{ inputs.days_until_expiration }} (Threshold: {{ inputs.expiration_warning_threshold }} days).

  - id: parallel_service_connectivity_check
    type: io.kestra.plugin.core.flow.Parallel
    description: "Verify that dependent API gateways are reachable before initiating key rollover"
    tasks:
      - id: probe_primary_gateway
        type: io.kestra.plugin.core.http.Request
        uri: "https://jsonplaceholder.typicode.com/posts/1"
        method: GET

      - id: probe_secondary_gateway
        type: io.kestra.plugin.core.http.Request
        uri: "https://jsonplaceholder.typicode.com/posts/2"
        method: GET

  - id: generate_cryptographic_token
    type: io.kestra.plugin.scripts.python.Script
    description: "Generate a secure replacement API key and compute SHA-256 fingerprint hash"
    beforeCommands:
      - pip install kestra
    script: |
      from kestra import Kestra
      import secrets
      import hashlib

      raw_token = f"sk_live_{secrets.token_urlsafe(32)}"
      token_hash = hashlib.sha256(raw_token.encode()).hexdigest()[:12]
      new_key_id = f"key_prod_{token_hash}"

      days_left = {{ inputs.days_until_expiration }}
      threshold = {{ inputs.expiration_warning_threshold }}
      needs_rotation = days_left <= threshold

      summary = f"Generated replacement token ID [{new_key_id}]. Rotation required: {needs_rotation}."
      print(summary)

      Kestra.outputs({
          'new_key_id': new_key_id,
          'needs_rotation': needs_rotation,
          'summary': summary
      })

  - id: route_rotation_action
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.generate_cryptographic_token.vars.needs_rotation == true }}"
    then:
      - id: execute_zero_downtime_rollover
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: |
          [ROTATION EXECUTED] Successfully provisioned replacement key [{{ outputs.generate_cryptographic_token.vars.new_key_id }}] 
          for {{ inputs.target_service_name }}. Old key [{{ inputs.current_key_id }}} placed in 24h grace period.

      - id: notify_security_channel
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "[ALERT] Zero-downtime rotation completed for {{ inputs.target_service_name }}."
    else:
      - id: log_credential_healthy
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "[HEALTHY] API key [{{ inputs.current_key_id }}] has {{ inputs.days_until_expiration }} days remaining. No rotation needed."

  - id: finalize_audit_ledger
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "Completed API key lifecycle run for {{ inputs.target_service_name }}."
