id: cerebras-model-allowlist-drift-sentinel
namespace: company.team

description: |
  List the Cerebras models your API key can currently reach, flag any model outside your
  approved allowlist that has become accessible and any approved model that has silently
  disappeared, alert Slack when either happens, and log a governance audit trail either way.
  Read-only: this flow never runs a completion or changes account configuration.

inputs:
  - id: approved_models
    type: ARRAY
    itemType: STRING
    displayName: Approved model allowlist
    description: The exact Cerebras model IDs your production flows are authorized to call.
    defaults:
      - llama3.1-8b
      - llama-3.3-70b
      - qwen-3-32b

  - id: alert_on_drift
    type: BOOL
    displayName: Alert on any drift
    description: When true, both an unapproved model becoming available and an approved model disappearing trigger the Slack alert.
    defaults: true

tasks:
  - id: list_models
    type: io.kestra.plugin.cerebras.ListModels
    description: Read-only. Calls GET /models and returns every model id the API key can currently see.
    allowFailure: true
    apiKey: "{{ secret('CEREBRAS_API_KEY') }}"

  - id: evaluate
    type: io.kestra.plugin.core.output.OutputValues
    description: Diffs the live model list against approved_models in both directions with jq.
    values:
      available_model_ids: >-
        {{ (outputs.list_models is not defined or outputs.list_models.models is not defined) ? '' : (({'models': outputs.list_models.models} | jq('[.models[]?.id] | join("; ")')) | first) }}
      unapproved_models: >-
        {{ (outputs.list_models is not defined or outputs.list_models.models is not defined) ? '' : (({'models': outputs.list_models.models, 'approved': inputs.approved_models} | jq('([.models[]?.id] - .approved) | join("; ")')) | first) }}
      missing_models: >-
        {{ (outputs.list_models is not defined or outputs.list_models.models is not defined) ? '' : (({'models': outputs.list_models.models, 'approved': inputs.approved_models} | jq('(.approved - [.models[]?.id]) | join("; ")')) | first) }}
      drift_count: >-
        {{ (outputs.list_models is not defined or outputs.list_models.models is not defined) ? -1 : (({'models': outputs.list_models.models, 'approved': inputs.approved_models} | jq('(([.models[]?.id] - .approved) | length) + ((.approved - [.models[]?.id]) | length)')) | first | number) }}
      severity: >-
        {{ (outputs.list_models is not defined or outputs.list_models.models is not defined) ? 'CRITICAL' : (((({'models': outputs.list_models.models, 'approved': inputs.approved_models} | jq('(([.models[]?.id] - .approved) | length) + ((.approved - [.models[]?.id]) | length)')) | first | number) > 0 and inputs.alert_on_drift) ? 'MODEL_DRIFT' : 'OK') }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.values.severity != 'OK' }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': outputs.evaluate.values.severity ~ ': Cerebras model allowlist drift detected. Unapproved and now-accessible: [' ~ outputs.evaluate.values.unapproved_models ~ ']. Approved but no longer available: [' ~ outputs.evaluate.values.missing_models ~ '].'} | toJson }}
    else:
      - id: compliant
        type: io.kestra.plugin.core.log.Log
        message: "Cerebras model list matches the approved allowlist. Available: {{ outputs.evaluate.values.available_model_ids }}."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "Cerebras model allowlist drift sentinel complete: drift_count={{ outputs.evaluate.values.drift_count }}, severity {{ outputs.evaluate.values.severity }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Cerebras model allowlist drift sentinel failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable once CEREBRAS_API_KEY and SLACK_WEBHOOK_URL are set and approved_models matches your real allowlist.
    cron: "0 8 * * *"
    disabled: true
    inputs:
      approved_models:
        - llama3.1-8b
        - llama-3.3-70b
        - qwen-3-32b
      alert_on_drift: true

extend:
  title: Cerebras Model Allowlist Drift Sentinel
  metaTitle: Cerebras Model Allowlist Drift Sentinel with Kestra
  shortDescription: List the Cerebras models your API key can reach, alert Slack when an unapproved model appears or an approved one disappears, and log a governance audit trail.
  metaDescription: List reachable Cerebras models, alert Slack on allowlist drift or a disappeared model, and log the result for AI platform teams.
  description: |
    An inference provider's model catalog is not static: a preview model can become reachable
    on an account without anyone opting in, and a model your production flows depend on can be
    deprecated and removed with no warning beyond a changelog entry. Cerebras exposes the live
    list through its own Models API; this blueprint diffs that list against the allowlist you
    actually approved, in both directions, instead of assuming the catalog never changes.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `list_models` (`io.kestra.plugin.cerebras.ListModels`) calls `GET /models` and returns
       every model id the API key can currently see. Read-only; nothing in the Cerebras account
       is changed. `allowFailure: true` covers an API or auth error without failing the flow
       outright.
    2. `evaluate` (`io.kestra.plugin.core.output.OutputValues`) computes, with `jq`, the set of
       available-but-not-approved models (`unapproved_models`) and the set of
       approved-but-no-longer-available models (`missing_models`), plus a combined
       `drift_count`.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **compliant:** logs the live model list, matching the allowlist.
       - **alert:** posts both drift directions to Slack by name.
    4. `summary` logs the drift count and severity, closing the governance cycle.
    5. `errors` alerts Slack if the flow itself fails, for example an expired API key.

    ## What you get

    - A two-way diff against a real, live API response, not a changelog you have to read
      yourself: an unauthorized model becoming reachable and a depended-on model disappearing
      are both caught by the same check.
    - The exact model ids involved in the Slack alert, not just a generic "something changed."
    - A read-only check with zero risk of triggering a billed completion or touching account
      configuration.

    ## Who it's for

    - AI platform and ML ops teams who standardize on an approved model list across Cerebras
      consumers and want drift from that list surfaced automatically, not discovered when a
      flow using a removed model starts failing.
    - Teams evaluating the Cerebras plugin who want a worked example of `ListModels` used as a
      standing compliance check rather than a one-off lookup before a `ChatCompletion` call.

    ## Why orchestrate this with Kestra

    Cerebras reports what is reachable right now; it does not know what your organization
    approved, compare the two lists, or notify anyone when they diverge. Kestra keeps
    `approved_models` as a flow input instead of a wiki page nobody reads, turns the diff into a
    Slack page naming the exact models involved, and keeps a full execution history of every
    run.

    ## Prerequisites

    - A Cerebras account with an API key that has access to the Models API.
    - A written-down list of the exact model ids your production flows are authorized to call.
    - A Slack incoming webhook URL.

    This flow calls the Cerebras API directly over HTTPS; there is no official local Cerebras
    emulator, so `list_models` cannot be exercised against a local Docker container.

    ### Secrets

    - `CEREBRAS_API_KEY`: the Cerebras API key used by `list_models`. In Kestra OSS, provide it
      as the base64-encoded environment variable `SECRET_CEREBRAS_API_KEY`.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block. In Kestra OSS, provide it as
      the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Type | Default | Description |
    |---|---|---|---|
    | `approved_models` | ARRAY | `["llama3.1-8b", "llama-3.3-70b", "qwen-3-32b"]` | Model IDs your flows are authorized to call |
    | `alert_on_drift` | BOOL | `true` | Whether allowlist drift triggers the Slack alert |

    ### Outputs

    - `{{ outputs.list_models.models }}`: every model the API key can see (`id`, `ownedBy`,
      `created`).
    - `{{ outputs.evaluate.values.unapproved_models }}` / `.missing_models`: semicolon-joined
      model ids present but not approved, and approved but no longer present.
    - `{{ outputs.evaluate.values.drift_count }}` / `.severity`: `OK`, `MODEL_DRIFT`, or
      `CRITICAL`.

    ### Pitfalls

    - `ListModels` only reports what the API key is scoped to see; an organization-wide model
      rollout invisible to this particular key will not show up as drift until the key itself
      gains access.
    - `created` is null for a model entry when the Cerebras API does not provide a meaningful
      timestamp; this blueprint does not depend on it, but a downstream extension that sorts by
      age should account for nulls.
    - `missing_models` cannot distinguish "deprecated and removed" from "temporarily
      unavailable during a provider incident"; a model disappearing for one run and returning on
      the next still counts as drift on the run where it was absent.

    ## Quick start

    1. Add the `CEREBRAS_API_KEY` and `SLACK_WEBHOOK_URL` secrets.
    2. Set `approved_models` to your actual production allowlist.
    3. Run the flow manually and confirm `compliant` logs the live model list.
    4. Temporarily remove a real model id from `approved_models` to confirm `alert` fires with
       it listed under unapproved, then restore it.
    5. Enable the `daily` trigger once the allowlist reflects what your flows are actually
       approved to call.

    ## How to extend

    - Call `io.kestra.plugin.cerebras.ChatCompletion` against each `missing_models` entry before
      alerting, to distinguish a true removal from a transient listing glitch.
    - Store each run's `available_model_ids` in a KV entry to diff consecutive runs and report
      exactly when a model first appeared or disappeared, not just that it currently differs.
    - Route unapproved-model alerts to a security or platform-governance Slack channel
      separately from missing-model alerts, since the two have different owners.

    ## Links

    - [Kestra Cerebras Plugin Documentation](https://kestra.io/plugins/plugin-cerebras)
    - [Cerebras Models API Reference](https://inference-docs.cerebras.ai/api-reference/models/list-models)
    - [Slack Incoming Webhooks Documentation](https://docs.slack.dev/messaging/sending-messages-using-incoming-webhooks/)
  tags:
    - AI
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
