id: minio-zero-byte-truncated-object-repair-guard
namespace: company.team
concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: endpoint
    type: STRING
    defaults: http://localhost:9000
  - id: bucket
    type: STRING
    defaults: landing
  - id: object_key
    type: STRING
    defaults: incoming/orders.csv
  - id: source_key
    type: STRING
    defaults: accepted/orders.csv
  - id: source_version
    type: STRING
    description: Exact non-null accepted data version in the same bucket.
  - id: expected_size
    type: INT
    description: Recorded accepted byte count, from 1 through 33554432.
  - id: expected_sha256
    type: STRING
  - id: expected_header
    type: ARRAY
    itemType: STRING
    defaults: [id, amount]
  - id: expected_rows
    type: INT
    description: Recorded positive CSV data row count, at most 100000.
  - id: access_key
    type: SECRET
    defaults: "{{ secret('MINIO_ACCESS_KEY_ID') }}"
  - id: secret_key
    type: SECRET
    defaults: "{{ secret('MINIO_SECRET_KEY_ID') }}"
  - id: slack_webhook
    type: SECRET
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
  - id: docker_network
    type: STRING
    defaults: bridge
  - id: auto_remediate
    type: BOOL
    defaults: false
  - id: dry_run
    type: BOOL
    defaults: true

variables:
  common: |
    import csv, hashlib, io, json, os, re
    import boto3
    from botocore.config import Config
    c = json.load(open('config.json', encoding='utf-8'))
    s3 = boto3.client('s3', endpoint_url=c['endpoint'], region_name='us-east-1',
        aws_access_key_id=os.environ['ACCESS_KEY'], aws_secret_access_key=os.environ['SECRET_KEY'],
        config=Config(signature_version='s3v4', s3={'addressing_style':'path'},
        connect_timeout=3, read_timeout=5, retries={'total_max_attempts':1}))
    def head(key, version=None):
        r = s3.head_object(Bucket=c['bucket'], Key=key,
                          **({'VersionId':version} if version else {}))
        return {'size':r['ContentLength'], 'etag':r['ETag'], 'version':r.get('VersionId')}
    def versioning():
        if s3.get_bucket_versioning(Bucket=c['bucket']).get('Status') != 'Enabled':
            raise ValueError('Enabled bucket versioning is required')
    def parse(path):
        with open(path, 'rb') as f:
            data = f.read(c['expected_size'] + 1)
        if len(data) != c['expected_size'] or hashlib.sha256(data).hexdigest() != c['expected_sha256']:
            raise ValueError('Accepted byte count or SHA256 mismatch')
        csv.field_size_limit(65536)
        reader = csv.reader(io.StringIO(data.decode('utf-8'), newline=''), strict=True)
        if next(reader, None) != c['expected_header']:
            raise ValueError('CSV header mismatch')
        count = 0
        for row in reader:
            if len(row) != len(c['expected_header']) or any(not cell for cell in row):
                raise ValueError('CSV record width or empty field mismatch')
            count += 1
            if count > c['expected_rows']:
                raise ValueError('CSV row ceiling exceeded')
        if count != c['expected_rows']:
            raise ValueError('CSV row count mismatch')
        return count

tasks:
  - id: inspect
    type: io.kestra.plugin.scripts.python.Script
    description: HeadObject and bucket versioning have no MinIO plugin task. Inspect only the exact key.
    timeout: PT45S
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.docker_network }}"
      memory:
        memory: 268435456
    containerImage: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    beforeCommands:
      - pip install --quiet --disable-pip-version-check boto3==1.40.61 botocore==1.40.76
    env:
      ACCESS_KEY: "{{ inputs.access_key }}"
      SECRET_KEY: "{{ inputs.secret_key }}"
    inputFiles:
      config.json: |
        {"endpoint":{{ inputs.endpoint | toJson }},"bucket":{{ inputs.bucket | toJson }},"object_key":{{ inputs.object_key | toJson }},"source_key":{{ inputs.source_key | toJson }},"source_version":{{ inputs.source_version | toJson }},"expected_size":{{ inputs.expected_size }},"expected_sha256":{{ inputs.expected_sha256 | toJson }},"expected_header":{{ inputs.expected_header | toJson }},"expected_rows":{{ inputs.expected_rows }}}
    outputFiles: [config.json, plan.json]
    script: |
      {{ vars.common }}
      from urllib.parse import urlsplit
      url = urlsplit(c['endpoint'])
      if url.scheme not in ('http','https') or not url.hostname or url.username or url.password or url.query or url.fragment:
          raise ValueError('Use an HTTP(S) MinIO endpoint without embedded credentials')
      for name in ('object_key','source_key'):
          key = c[name]
          if not isinstance(key,str) or not 1 <= len(key.encode('utf-8')) <= 1024 or any(ord(x)<32 for x in key):
              raise ValueError('Invalid exact object key')
      if c['object_key'] == c['source_key'] or not c['source_version'] or c['source_version'] == 'null':
          raise ValueError('Use distinct keys and an explicit non-null source version')
      if not 1 <= c['expected_size'] <= 33554432 or not 1 <= c['expected_rows'] <= 100000:
          raise ValueError('Recorded size or rows outside ceiling')
      if not re.fullmatch('[0-9a-f]{64}',c['expected_sha256']) or not 1 <= len(c['expected_header']) <= 64:
          raise ValueError('Invalid recorded digest or header')
      versioning()
      source = head(c['source_key'],c['source_version'])
      current = head(c['object_key'])
      if source['size'] != c['expected_size'] or source['version'] != c['source_version'] or not current['version'] or current['version']=='null':
          raise ValueError('Source record or destination version mismatch')
      if current['size'] > c['expected_size']:
          raise ValueError('Larger current object is outside short-payload recovery')
      plan = {'source':source,'current':current,'short':current['size'] < c['expected_size']}
      json.dump(plan,open('plan.json','w'),sort_keys=True)
      print('::'+json.dumps({'outputs':{'short':plan['short'],'observed_size':current['size'],'current_version':current['version']}})+'::')

  - id: accepted_bytes
    type: io.kestra.plugin.minio.Download
    timeout: PT20S
    endpoint: "{{ inputs.endpoint }}"
    accessKeyId: "{{ inputs.access_key }}"
    secretKeyId: "{{ inputs.secret_key }}"
    bucket: "{{ inputs.bucket }}"
    key: "{{ inputs.source_key }}"
    versionId: "{{ inputs.source_version }}"

  - id: validate_source
    type: io.kestra.plugin.scripts.python.Script
    timeout: PT45S
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.docker_network }}"
      memory:
        memory: 268435456
    containerImage: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    beforeCommands:
      - pip install --quiet --disable-pip-version-check boto3==1.40.61 botocore==1.40.76
    env:
      ACCESS_KEY: "{{ inputs.access_key }}"
      SECRET_KEY: "{{ inputs.secret_key }}"
    inputFiles:
      config.json: "{{ outputs.inspect.outputFiles['config.json'] }}"
      accepted.csv: "{{ outputs.accepted_bytes.uri }}"
    script: |
      {{ vars.common }}
      print('Accepted source parsed rows='+str(parse('accepted.csv')))

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect.vars.short and inputs.auto_remediate and not inputs.dry_run }}"
    then:
      - id: approval
        type: io.kestra.plugin.core.flow.Pause
        timeout: PT1H
        description: Review plan.json. Quiesce every writer and lifecycle deletion until verification ends.
        onResume:
          - id: approved
            type: BOOL
            defaults: false
            description: Approve this exact recorded recovery.
          - id: writers_quiesced
            type: BOOL
            defaults: false
            description: All destination writers and lifecycle deletion are excluded through verification.
      - id: consent
        type: io.kestra.plugin.core.flow.If
        condition: "{{ (outputs.approval.onResume.approved ?? false) and (outputs.approval.onResume.writers_quiesced ?? false) }}"
        then:
          - id: recheck
            type: io.kestra.plugin.scripts.python.Script
            timeout: PT45S
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.docker_network }}"
              memory:
                memory: 268435456
            containerImage: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
            beforeCommands:
              - pip install --quiet --disable-pip-version-check boto3==1.40.61 botocore==1.40.76
            env:
              ACCESS_KEY: "{{ inputs.access_key }}"
              SECRET_KEY: "{{ inputs.secret_key }}"
            inputFiles:
              config.json: "{{ outputs.inspect.outputFiles['config.json'] }}"
              plan.json: "{{ outputs.inspect.outputFiles['plan.json'] }}"
            script: |
              {{ vars.common }}
              p = json.load(open('plan.json'))
              versioning()
              if head(c['object_key']) != p['current'] or head(c['source_key'],c['source_version']) != p['source']:
                  raise ValueError('Stale approval; no copy attempted')
              print('Current destination and pinned source still match approval')
          - id: repair
            type: io.kestra.plugin.minio.Copy
            timeout: PT20S
            endpoint: "{{ inputs.endpoint }}"
            accessKeyId: "{{ inputs.access_key }}"
            secretKeyId: "{{ inputs.secret_key }}"
            delete: false
            from:
              bucket: "{{ inputs.bucket }}"
              key: "{{ inputs.source_key }}"
              versionId: "{{ inputs.source_version }}"
            to:
              bucket: "{{ inputs.bucket }}"
              key: "{{ inputs.object_key }}"
          - id: repaired_head
            type: io.kestra.plugin.scripts.python.Script
            timeout: PT45S
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.docker_network }}"
              memory:
                memory: 268435456
            containerImage: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
            beforeCommands:
              - pip install --quiet --disable-pip-version-check boto3==1.40.61 botocore==1.40.76
            env:
              ACCESS_KEY: "{{ inputs.access_key }}"
              SECRET_KEY: "{{ inputs.secret_key }}"
            inputFiles:
              config.json: "{{ outputs.inspect.outputFiles['config.json'] }}"
              plan.json: "{{ outputs.inspect.outputFiles['plan.json'] }}"
            script: |
              {{ vars.common }}
              p = json.load(open('plan.json'))
              current = head(c['object_key'])
              if current['size'] != c['expected_size'] or current['etag'] != p['source']['etag'] or not current['version'] or current['version'] == 'null' or current['version'] == p['current']['version']:
                  raise ValueError('Copied current object is outside the accepted download bound')
              print('::'+json.dumps({'outputs':{'version':current['version']}})+'::')
          - id: recovered_bytes
            type: io.kestra.plugin.minio.Download
            timeout: PT20S
            endpoint: "{{ inputs.endpoint }}"
            accessKeyId: "{{ inputs.access_key }}"
            secretKeyId: "{{ inputs.secret_key }}"
            bucket: "{{ inputs.bucket }}"
            key: "{{ inputs.object_key }}"
            versionId: "{{ outputs.repaired_head.vars.version }}"
          - id: verify
            type: io.kestra.plugin.scripts.python.Script
            timeout: PT45S
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.docker_network }}"
              memory:
                memory: 268435456
            containerImage: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
            beforeCommands:
              - pip install --quiet --disable-pip-version-check boto3==1.40.61 botocore==1.40.76
            env:
              ACCESS_KEY: "{{ inputs.access_key }}"
              SECRET_KEY: "{{ inputs.secret_key }}"
            inputFiles:
              config.json: "{{ outputs.inspect.outputFiles['config.json'] }}"
              plan.json: "{{ outputs.inspect.outputFiles['plan.json'] }}"
              recovered.csv: "{{ outputs.recovered_bytes.uri }}"
              recovered-version.json: "{{ outputs.repaired_head.vars.version | toJson }}"
            outputFiles: [receipt.json]
            script: |
              {{ vars.common }}
              p = json.load(open('plan.json'))
              versioning()
              current = head(c['object_key'])
              recovered_version = json.load(open('recovered-version.json'))
              if current['size'] != c['expected_size'] or current['etag'] != p['source']['etag'] or current['version'] != recovered_version or current['version'] == p['current']['version']:
                  raise ValueError('Native copy did not produce expected current metadata')
              if head(c['object_key'],p['current']['version']) != p['current'] or head(c['source_key'],c['source_version']) != p['source']:
                  raise ValueError('Protected original or source version changed')
              rows = parse('recovered.csv')
              json.dump({'verified':True,'current':current,'rows':rows,'source_version':c['source_version']},open('receipt.json','w'))
              print('Verified restored bytes='+str(current['size'])+' rows='+str(rows))
        else:
          - id: declined
            type: io.kestra.plugin.core.log.Log
            message: Approval or exclusive-writer attestation absent. No copy attempted.
    else:
      - id: same_size
        type: io.kestra.plugin.core.flow.If
        condition: "{{ not outputs.inspect.vars.short }}"
        then:
          - id: healthy_bytes
            type: io.kestra.plugin.minio.Download
            timeout: PT20S
            endpoint: "{{ inputs.endpoint }}"
            accessKeyId: "{{ inputs.access_key }}"
            secretKeyId: "{{ inputs.secret_key }}"
            bucket: "{{ inputs.bucket }}"
            key: "{{ inputs.object_key }}"
            versionId: "{{ outputs.inspect.vars.current_version }}"
          - id: verify_healthy
            type: io.kestra.plugin.scripts.python.Script
            timeout: PT45S
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.docker_network }}"
              memory:
                memory: 268435456
            containerImage: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
            beforeCommands:
              - pip install --quiet --disable-pip-version-check boto3==1.40.61 botocore==1.40.76
            env:
              ACCESS_KEY: "{{ inputs.access_key }}"
              SECRET_KEY: "{{ inputs.secret_key }}"
            inputFiles:
              config.json: "{{ outputs.inspect.outputFiles['config.json'] }}"
              current.csv: "{{ outputs.healthy_bytes.uri }}"
            script: |
              {{ vars.common }}
              print('Current accepted CSV rows='+str(parse('current.csv')))
      - id: observation
        type: io.kestra.plugin.core.log.Log
        message: "Short payload={{ outputs.inspect.vars.short }}. Observed bytes={{ outputs.inspect.vars.observed_size }}. No write requested."

errors:
  - id: error_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ inputs.slack_webhook }}"
    payload: '{"text":"MinIO landing recovery failed. Inspect execution {{ execution.id }} before retrying any copy."}'
triggers:
  - id: hourly_observation
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false
      source_version: configure-accepted-version
      expected_size: 1
      expected_sha256: configure-accepted-digest
      expected_rows: 1

extend:
  title: Repair a short MinIO landing CSV from an accepted version
  metaTitle: Repair a short MinIO landing CSV with Kestra
  shortDescription: Restore one short landing CSV from a recorded source version after approval and writer exclusion, then verify the bytes and parsed rows.
  metaDescription: Recover an empty or short MinIO landing CSV from an accepted version. Preserve history, recheck approval and verify SHA256 plus parsed rows.
  description: |
    An importer can successfully overwrite a landing key with an empty body or a header-only CSV. The key still exists but its accepted rows are gone. This flow repairs one explicitly recorded short payload. Interrupted multipart uploads are not this incident.

    ## Safety

    Native Copy has no destination compare-and-swap. Every writer and lifecycle deletion must be excluded from the final recheck through verification. Approval attests that contract. Versioning preserves old data but does not prevent a concurrent version being shadowed.

    ## How it works

    Inspect the exact current key and pinned source version. Download and parse the accepted source. For a strictly shorter destination, dry_run false plus auto_remediate true requests approval. Recheck the observed version before native minio.Copy with delete false. Download the result and require the recorded SHA256, size, CSV header and row count. Verify the original destination version and source metadata still exist.

    ## What you get

    A versioned repair without a missing-key window, a saved plan and a verified receipt. Repeat recovery checks the current accepted bytes and creates no additional version. Missing, larger or invalid-source objects fail closed.

    ## Who it's for

    Data platform teams with accepted CSV records and a maintenance window for a faulty importer.

    ## Why orchestrate this with Kestra

    The plan survives approval. Native MinIO tasks copy and download while API reads cover HeadObject and versioning, which this plugin does not expose. Python checks recorded bytes and CSV structure.

    ## Tested end to end

    Kestra 2.0.6 restored 0 bytes to the accepted 25-byte CSV with 3 parsed rows, preserving the source and destination history. A real 32 MiB CSV with 1024 rows and a 100000-row CSV passed. A writer held by a cooperative lock waited through verification. Key cases also ran on 2.0.5 and a fresh MinIO instance.

    | Case | Execution | Result |
    |---|---|---|
    | Empty overwrite recovery | 7MkL1EkGS9EW75pBPiot1a | SUCCESS |
    | Healthy arrival during approval | 3xaOO8BjFLntJv0FJSGnAW | FAILED before Copy |
    | Read-only copy refusal | 4ifcex89FtX4ujY5yDksbI | FAILED |
    | Interrupted after Copy | 5CdUluvSFA0JVMk0jggwHL | KILLED |
    | Retry after interruption | 7jwhX4L5dezTvc14YmdpPb | SUCCESS without Copy |
    | Older-runtime recovery | 3U3F43HFVGoLfK9QuSMCsL | SUCCESS |

    ## Prerequisites

    Versioning Enabled, retained history and quiesced writers. Docker runners need MinIO connectivity and package access. Minimum actions are s3:GetBucketVersioning and s3:GetBucketLocation on the bucket plus s3:GetObject, s3:GetObjectVersion and target-only s3:PutObject on the explicit keys. No deletion permission is needed.

    ### Secrets

    MINIO_ACCESS_KEY_ID, MINIO_SECRET_KEY_ID and SLACK_WEBHOOK_URL supply SECRET inputs. Do not paste credentials into STRING inputs.

    ### Inputs

    Provide bucket, object_key, source_key, source_version, expected_size, expected_sha256, expected_header and expected_rows from the accepted record. Set endpoint and docker_network for your deployment. Safe defaults are dry_run true and auto_remediate false.

    ## Quick start

    Run observation with an accepted source record. Inspect plan.json and the source parse. Quiesce all writers, request remediation and approve both the repair and writer exclusion. Keep exclusion through receipt verification. On timeout inspect current versions before retrying.

    ## How to extend

    Use an application-owned lock if all writers already share one. Do not generalize selection to arbitrary zero-byte keys. Limits: one CSV, at most 32 MiB, 100000 data rows, 64 columns and 65536 characters per field. API reads have 3-second connect and 5-second read deadlines. Task timeouts bound execution but do not prove server cancellation. Downloads pin versions after size checks. QUEUE1 serializes only this flow. Tags, ACLs and retention policy are outside the recovery claim. Equal-size mismatches fail without replacement.

    ## Links

    - [Native Copy source](https://github.com/kestra-io/plugin-minio/blob/204aa84ff963b43d9e798f433388b7c61e693ecb/src/main/java/io/kestra/plugin/minio/Copy.java)
    - [Multipart publication](https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags: [Data, Infrastructure]
  subTags: [Day 2 Operations, Testing & Quality]
  ee: false
  demo: false
