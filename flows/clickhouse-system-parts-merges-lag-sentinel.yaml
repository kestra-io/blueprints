id: clickhouse-system-parts-merges-lag-sentinel
namespace: company.team

inputs:
  - id: ch_host
    type: STRING
    defaults: "clickhouse.internal"
    description: Hostname of the ClickHouse server.
  - id: ch_port
    type: INT
    defaults: 8123
    description: HTTP port of the ClickHouse server.
  - id: ch_database
    type: STRING
    defaults: "default"
    description: ClickHouse database to audit.
  - id: max_parts_threshold
    type: INT
    defaults: 300
    description: "Maximum allowable active data parts per partition before alerting (default 300)."

tasks:
  - id: inspect_parts_count
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      CH_HOST: "{{ inputs.ch_host }}"
      CH_PORT: "{{ inputs.ch_port }}"
      CH_DATABASE: "{{ inputs.ch_database }}"
      CH_USER: "{{ secret('CH_USER') }}"
      CH_PASSWORD: "{{ secret('CH_PASSWORD') }}"
      MAX_PARTS: "{{ inputs.max_parts_threshold }}"
    outputFiles:
      - ch_parts.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("CH_HOST", "clickhouse.internal")
      port = os.environ.get("CH_PORT", "8123")
      db = os.environ.get("CH_DATABASE", "default")
      user = os.environ.get("CH_USER", "default")
      password = os.environ.get("CH_PASSWORD", "")
      max_parts = int(os.environ.get("MAX_PARTS", 150))

      query = f"SELECT table, partition, count() as parts FROM system.parts WHERE active=1 AND database='{db}' GROUP BY table, partition HAVING parts > {max_parts} ORDER BY parts DESC LIMIT 5 FORMAT JSON"
      url = f"http://{host}:{port}/"
      auth = (user, password) if user or password else None

      try:
          resp = requests.post(url, auth=auth, data=query, timeout=12)
          resp.raise_for_status()
          rows = resp.json().get("data", [])
      except Exception as e:
          print(f"ERROR: Failed to query system.parts from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      count = len(rows)
      samples = ", ".join([f"{r.get('table')}({r.get('parts')})" for r in rows[:3]])
      is_breach = 1 if count > 0 else 0

      result = {
          "is_breach": is_breach,
          "row_count": count,
          "samples": samples,
          "rows": rows
      }

      with open("ch_parts.json", "w", encoding="utf-8") as out:
          json.dump(result, out, indent=2)

      print(f"ClickHouse parts lag audit: is_breach={is_breach}, count={count}, samples={samples}")

      Kestra.outputs({
          "is_breach": is_breach,
          "row_count": count,
          "samples": samples
      })

  - id: evaluate_parts_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_parts_count.vars.is_breach | int == 1 }}"
    then:
      - id: notify_analytics_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#analytics-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 ClickHouse Partition Parts Accumulation Warning",
                "text": "Detected {{ outputs.inspect_parts_count.vars.row_count }} partition(s) with over {{ inputs.max_parts_threshold }} active data parts in database {{ inputs.ch_database }}. Sample Tables: {{ outputs.inspect_parts_count.vars.samples }}. Risk of 'Too many parts in all data parts in table' write rejection.",
                "footer": "Kestra Analytics Sentinel • ClickHouse"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#analytics-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ ClickHouse Sentinel Failure",
            "text": "Failed to query system.parts on ClickHouse instance {{ inputs.ch_host }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Audits ClickHouse system.parts to detect background merge delays and prevent 'Too many parts' write rejections."
  metaTitle: ClickHouse Partition Active Parts Accumulation Sentinel with Kestra
  ee: false
  demo: false
  title: ClickHouse Partition Active Parts Accumulation Sentinel
  shortDescription: Audits ClickHouse system.parts to detect background merge delays and prevent 'Too many parts' write rejections.
  description: |
    ## How it works
    This workflow connects to ClickHouse via HTTP REST API to query `system.parts` for partitions with excessively high numbers of active data parts. In ClickHouse MergeTree engines, small batch inserts continuously produce new parts that background threads asynchronously merge into larger parts. When insert frequency is too high or disk I/O saturates, merges cannot keep pace. If the number of parts in a single partition exceeds limits (default 300), ClickHouse throttles inserts, and once it exceeds 600, it throws `Too many parts in all data parts in table` errors. This sentinel audits active parts and alerts data engineers before write operations are rejected.

    ## What you get
    - Real-time detection of ClickHouse background merge lag.
    - Protection against insert throttling and write rejections.
    - Contextual Slack alerts detailing bloated table names and part counts.

    ## Who it's for
    - Data Engineers running high-velocity streaming ingestion into ClickHouse.
    - Database Administrators maintaining analytical OLAP clusters.
    - SREs safeguarding real-time dashboard query performance.

    ## Why orchestrate this with Kestra
    - **Automated OLAP Surveillance**: Periodically inspects internal table engines without deploying external exporters.
    - **Encrypted Credential Security**: Injects ClickHouse authentication tokens via Kestra secrets.
    - **Remediation Integration**: Can trigger manual `OPTIMIZE TABLE ... FINAL` operations during low-traffic windows.

    ## Prerequisites
    - ClickHouse server with accessible HTTP API (`8123`).
    - Dedicated read-only user with access to `system.parts`.
    - Secrets `CH_USER`, `CH_PASSWORD`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `CH_USER`, `CH_PASSWORD`, and `SLACK_WEBHOOK` secrets.
    3. Specify `ch_host`, `ch_port`, and `ch_database`.
    4. Enable the schedule trigger for continuous parts monitoring.

    ## How to extend
    - Query `system.merges` to inspect active merge progress and ETA.
    - Automatically adjust batch insert sizing in upstream Kafka Connect flows.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [ClickHouse system.parts Documentation](https://clickhouse.com/docs/en/operations/system-tables/parts)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
