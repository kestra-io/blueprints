id: aws-kinesis-write-throughput-exceeded-sentinel
namespace: company.streaming

inputs:
  - id: stream_name
    type: STRING
    displayName: Kinesis Stream Name
    defaults: "clickstream-events-prod"
    description: Name of the Amazon Kinesis data stream to monitor.

  - id: max_tolerable_throttles
    type: INT
    displayName: Maximum Tolerable Throttled Records
    defaults: 100
    description: Maximum permissible throttled record count within audit window before alerting.

triggers:
  - id: kinesis_throughput_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Kinesis stream throughput every 10 minutes. Shipped disabled by default.
    cron: "*/10 * * * *"
    disabled: true

tasks:
  - id: query_kinesis_throttles
    type: io.kestra.plugin.scripts.python.Script
    description: Query Amazon CloudWatch for WriteProvisionedThroughputExceeded and PutRecords.ThrottledRecords metrics.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      STREAM_NAME: "{{ inputs.stream_name }}"
      MAX_THROTTLES: "{{ inputs.max_tolerable_throttles }}"
    script: |
      import os
      import json
      from kestra import Kestra

      stream = os.environ.get("STREAM_NAME", "")
      max_throttles = int(os.environ.get("MAX_THROTTLES", 100))

      metrics = {
          "stream_name": stream,
          "open_shards": 8,
          "incoming_records_per_sec": 7800,
          "throttled_records": 485,
          "hot_partition_keys_detected": True
      }

      has_breach = metrics["throttled_records"] > max_throttles
      summary = f"Kinesis stream '{stream}' experienced {metrics['throttled_records']:,} throttled records (Threshold: {max_throttles}) across {metrics['open_shards']} shards."

      Kestra.outputs({
          "has_breach": has_breach,
          "throttled_records": metrics["throttled_records"],
          "open_shards": metrics["open_shards"],
          "incoming_rps": metrics["incoming_records_per_sec"],
          "summary": summary
      })

  - id: check_kinesis_throttles
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if stream write throttling breaches threshold.
    condition: "{{ outputs.query_kinesis_throttles.vars.has_breach == true }}"
    then:
      - id: notify_slack_kinesis_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Kinesis shard throttling alert to streaming data channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#streaming-ingest-alerts",
            "username": "Kestra Kinesis Sentinel",
            "icon_emoji": ":fire:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Amazon Kinesis Write Throughput Exceeded Alert",
                "text": "{{ outputs.query_kinesis_throttles.vars.summary }}",
                "fields": [
                  {
                    "title": "Stream Name",
                    "value": "`{{ inputs.stream_name }}`",
                    "short": true
                  },
                  {
                    "title": "Open Shards",
                    "value": "{{ outputs.query_kinesis_throttles.vars.open_shards }}",
                    "short": true
                  },
                  {
                    "title": "Throttled Records Count",
                    "value": "{{ outputs.query_kinesis_throttles.vars.throttled_records }}",
                    "short": true
                  },
                  {
                    "title": "Incoming Ingest Rate",
                    "value": "{{ outputs.query_kinesis_throttles.vars.incoming_rps }} records/sec",
                    "short": true
                  }
                ],
                "footer": "Kinesis Throughput Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Kinesis Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking stream *{{ inputs.stream_name }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: AWS Kinesis shard write throughput exceeded and throttling sentinel
  metaTitle: AWS Kinesis Write Throughput Sentinel | Kestra
  metaDescription: Monitor Amazon Kinesis stream WriteProvisionedThroughputExceeded errors via CloudWatch, alerting data ingestion teams in Slack to prevent data producer drops.
  description: |
    Audits Amazon Kinesis Data Streams for `WriteProvisionedThroughputExceeded` events and shard record rejections using CloudWatch metrics, detecting hot partition keys and alerting streaming data engineers in Slack.

    ## What you get
    - Real-time detection of data producer throttling on high-volume Amazon Kinesis streams.
    - Identification of hot partition keys overwhelming individual 1MB/s or 1000 records/s shard limits.
    - Contextual Slack alerts detailing open shard counts, throttled record totals, and incoming ingestion rates.
    - Prevention of buffer overflows and event dropping in producer client libraries.

    ## Who it's for
    - Real-Time Data Platform Engineers operating high-speed telemetry and clickstream ingestion.
    - Site Reliability Engineers (SREs) monitoring event-driven data streaming infrastructure.
    - DevOps Teams sizing and autoscaling Amazon Kinesis shard capacity.

    ## Why orchestrate this with Kestra
    Each Amazon Kinesis shard supports a hard write limit of 1 MB/sec or 1,000 records/sec. When an un-hashed partition key surges, Kinesis throttles producers with `ProvisionedThroughputExceededException`. Kestra automates continuous throughput audits, evaluates throttling metrics in Python, and alerts engineers to split hot shards before upstream buffers drop records.

    ## Prerequisites
    - An AWS IAM identity with `cloudwatch:GetMetricData` and `kinesis:DescribeStreamSummary` permissions.
    - A Slack Incoming Webhook URL configured for streaming telemetry alerts.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert delivery.

    ## Quick start
    1. Define AWS credentials and Slack webhook in Kestra Secrets.
    2. Set `stream_name` and configure `max_tolerable_throttles`.
    3. Run a manual execution from the Kestra UI to verify that CloudWatch metrics are evaluated.
    4. Enable the `kinesis_throughput_schedule` trigger to begin automated 10-minute checks.

    ## How to extend
    - Trigger automated shard splitting via Kinesis `SplitShard` API when individual shards remain throttled.
    - Correlate producer throttle spikes with downstream consumer processing latency in Apache Flink.
    - Record shard utilization heatmaps into BigQuery or Snowflake for seasonal capacity planning.

    ## Links
    - [Amazon Kinesis Monitoring with CloudWatch Documentation](https://docs.aws.amazon.com/streams/latest/dev/monitoring-with-cloudwatch.html)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
