id: nasa-cmr-nrt-granule-latency-gate
namespace: company.team

description: |
  Every 30 minutes, ask NASA's Common Metadata Repository (CMR) for the newest granules of the
  near-real-time (NRT) satellite collections your pipeline depends on, measure how old the newest
  acquisition is and how long LANCE took to publish it, and gate downstream processing on it:
  collections inside their latency SLA with a granule not yet handed over are passed to a
  downstream subflow, late or stalled collections are held back and posted to Slack once when
  they breach and once when they recover. Two keyless CMR requests per run, KV state.

inputs:
  - id: collections
    type: JSON
    displayName: NRT collections and latency SLAs
    description: |
      JSON array of `short_name`, optional `provider` and `version` (needed when the short name also exists as a
      science-quality collection, e.g. MOD14 at LPCLOUD) and `max_age_minutes`, the maximum age of the newest
      acquisition before the collection counts as LATE. LANCE targets publication within 3 hours of observation.
    defaults: |
      [
        {"short_name": "MOD14", "provider": "LANCEMODIS", "max_age_minutes": 90},
        {"short_name": "MYD14", "provider": "LANCEMODIS", "max_age_minutes": 90},
        {"short_name": "VNP14IMG_NRT", "max_age_minutes": 180},
        {"short_name": "VJ114IMG_NRT", "max_age_minutes": 180},
        {"short_name": "VJ214IMG_NRT", "max_age_minutes": 180}
      ]

  - id: window_hours
    type: INT
    defaults: 6
    description: Look-back window for the granule search. A collection with no granule acquired in this window is STALE. The window also drives the granule count, the publish-latency median and the largest gap.

  - id: downstream_flow_id
    type: STRING
    required: false
    description: Optional flow in the same namespace to start when fresh granules are ready. It receives a JSON input `granules` (one object per ready collection with the granule id, times and data URL). Leave empty to only log the gate decision.

  - id: state_key
    type: STRING
    defaults: cmr_nrt_latency_gate_state
    description: KV key holding the last status and the last granule handed downstream per collection.

triggers:
  - id: every_30_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: MODIS granules are 5 minutes and VIIRS granules 6 minutes long; checking every 30 minutes catches a stalled feed well inside a 2-3 hour SLA.
    cron: "*/30 * * * *"

tasks:
  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    description: Per-collection status, since when, and the last granule passed downstream. Missing on the first run (baseline).
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: lookup_collections
    type: io.kestra.plugin.core.http.Download
    description: One collection search for every short name (`short_name[]` is repeatable and case-insensitive), without a provider filter, so the flow can tell a typo (no match) from a short name that exists both as NRT and as a science-quality collection.
    uri: "https://cmr.earthdata.nasa.gov/search/collections.json?page_size=200{% for c in inputs.collections %}&short_name%5B%5D={{ (c.short_name ?? '') | trim | urlencode }}{% endfor %}"
    headers:
      Accept: application/json
      User-Agent: kestra-nasa-cmr-nrt-granule-latency-gate/1.0 (https://kestra.io)
    retry:
      type: exponential
      interval: PT20S
      maxInterval: PT2M
      maxAttempts: 4

  - id: resolve
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Matches every input entry to exactly one CMR collection concept id (short name, then provider and version when given) and flags INVALID, NOT_FOUND, AMBIGUOUS and DUPLICATE entries with the candidates CMR knows about.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles:
      collections.json: "{{ inputs.collections | toJson }}"
      lookup.json: "{{ outputs.lookup_collections.uri }}"
    outputFiles:
      - resolved_csv
    sql: |
      SET TimeZone = 'UTC';

      CREATE TABLE wanted AS
      SELECT row_number() OVER () AS input_order,
             trim(coalesce(c ->> 'short_name', '')) AS short_name,
             nullif(trim(coalesce(c ->> 'provider', '')), '') AS provider,
             nullif(trim(coalesce(c ->> 'version', '')), '') AS version,
             TRY_CAST(c ->> 'max_age_minutes' AS DOUBLE) AS max_age_minutes
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS c FROM read_text('collections.json'));

      CREATE TABLE cmr AS
      SELECT e ->> 'id' AS concept_id, e ->> 'short_name' AS cmr_short_name, e ->> 'version_id' AS cmr_version,
             e ->> 'data_center' AS cmr_provider
      FROM (SELECT unnest(from_json(coalesce(json_extract(content, '$.feed.entry'), '[]'), '["JSON"]')) AS e FROM read_text('lookup.json'));

      CREATE TABLE resolved AS
      WITH m AS (
        SELECT w.input_order,
               count(c.concept_id) AS matches,
               any_value(c.concept_id) AS concept_id,
               any_value(c.cmr_provider) AS cmr_provider
        FROM wanted w
        LEFT JOIN cmr c ON lower(c.cmr_short_name) = lower(w.short_name)
                       AND (w.provider IS NULL OR upper(c.cmr_provider) = upper(w.provider))
                       AND (w.version IS NULL OR c.cmr_version = w.version)
        GROUP BY w.input_order
      ),
      known AS (
        SELECT lower(cmr_short_name) AS sn,
               string_agg(cmr_provider || ' v' || cmr_version || ' ' || concept_id, ', ' ORDER BY concept_id) AS candidates
        FROM cmr GROUP BY 1
      ),
      r AS (
        SELECT w.input_order, w.short_name, w.provider, w.version, w.max_age_minutes, m.matches, k.candidates,
               CASE WHEN m.matches = 1 THEN m.concept_id END AS concept_id,
               CASE WHEN m.matches = 1 THEN m.cmr_provider END AS cmr_provider
        FROM wanted w JOIN m USING (input_order) LEFT JOIN known k ON k.sn = lower(w.short_name)
      )
      SELECT *,
             CASE WHEN short_name = '' THEN 'INVALID'
                  WHEN max_age_minutes IS NULL OR max_age_minutes <= 0 THEN 'INVALID'
                  WHEN matches = 0 THEN 'NOT_FOUND'
                  WHEN matches > 1 THEN 'AMBIGUOUS'
                  WHEN row_number() OVER (PARTITION BY concept_id, max_age_minutes > 0 ORDER BY input_order) > 1 THEN 'DUPLICATE'
                  ELSE 'OK' END AS resolution,
             CASE WHEN short_name = '' THEN 'missing short_name'
                  WHEN max_age_minutes IS NULL OR max_age_minutes <= 0 THEN 'max_age_minutes must be a positive number'
                  WHEN matches = 0 AND candidates IS NULL THEN 'no CMR collection has this short_name'
                  WHEN matches = 0 THEN 'no match for the given provider/version, CMR has ' || candidates
                  WHEN matches > 1 THEN 'set provider (and version) to pick one of ' || candidates
                  WHEN row_number() OVER (PARTITION BY concept_id, max_age_minutes > 0 ORDER BY input_order) > 1 THEN 'same collection as an earlier entry'
             END AS problem
      FROM r ORDER BY input_order;

      COPY (SELECT * FROM resolved ORDER BY input_order) TO '{{ outputFiles.resolved_csv }}' (HEADER true, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM resolved) AS entries,
        (SELECT count(*) FROM resolved WHERE resolution = 'OK') AS resolved,
        (SELECT coalesce(string_agg('&collection_concept_id%5B%5D=' || concept_id, '' ORDER BY input_order), '') FROM resolved WHERE resolution = 'OK') AS concept_params,
        (SELECT coalesce(string_agg('row ' || input_order || ' ' || CASE WHEN short_name = '' THEN '(no short_name)' ELSE short_name END || ' ' || resolution || ', ' || problem, '; ' ORDER BY input_order), '') FROM resolved WHERE resolution <> 'OK') AS problems,
        strftime(CAST('{{ execution.startDate }}' AS TIMESTAMPTZ) - to_hours(CAST({{ inputs.window_hours }} AS BIGINT)), '%Y-%m-%dT%H:%M:%SZ') AS window_start;

  - id: warn_config
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.resolve.outputs[0].row.problems != '' }}"
    level: WARN
    message: "Skipped collection entries: {{ outputs.resolve.outputs[0].row.problems }}"

  - id: nothing_resolved
    type: io.kestra.plugin.core.execution.Fail
    description: Without at least one resolved concept id the granule search would not be scoped to your collections, so the run stops here.
    runIf: "{{ outputs.resolve.outputs[0].row.resolved == 0 }}"
    errorMessage: "None of the {{ outputs.resolve.outputs[0].row.entries }} collection entries resolved to a CMR collection: {{ outputs.resolve.outputs[0].row.problems }}"

  - id: fetch_granules
    type: io.kestra.plugin.core.http.Download
    description: |
      One granule search for all resolved collections (`collection_concept_id[]` is repeatable), limited to granules
      acquired since the window start and sorted newest first. With 5-6 minute swaths a 6 hour window is about
      60-75 granules per collection, well under `page_size=2000`; the `CMR-Hits` header is compared with what came back.
    uri: "https://cmr.earthdata.nasa.gov/search/granules.json?sort_key=-start_date&page_size=2000&temporal={{ outputs.resolve.outputs[0].row.window_start }},{{ outputs.resolve.outputs[0].row.concept_params }}"
    headers:
      Accept: application/json
      User-Agent: kestra-nasa-cmr-nrt-granule-latency-gate/1.0 (https://kestra.io)
    retry:
      type: exponential
      interval: PT20S
      maxInterval: PT2M
      maxAttempts: 4

  - id: evaluate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Per collection: newest granule, its age at the run start (from the acquisition end time, or from the CMR
      publication time when the end time is still in the future, as for daily products), median and worst publish
      latency (CMR `updated` minus acquisition end), granule count and largest gap in the window. Compares with the
      KV state to find breaches, recoveries and fresh granules not yet handed downstream.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles:
      resolved.csv: "{{ outputs.resolve.outputFiles.resolved_csv }}"
      granules.json: "{{ outputs.fetch_granules.uri }}"
      state.json: "{{ (outputs.previous_state.value ?? []) | toJson }}"
    outputFiles:
      - latency_csv
      - state_json
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE run AS SELECT CAST('{{ execution.startDate }}' AS TIMESTAMPTZ) AS now_utc;

      CREATE TABLE resolved AS SELECT * FROM read_csv('resolved.csv', header = true, all_varchar = true);

      CREATE TABLE granules AS
      SELECT x ->> 'collection_concept_id' AS concept_id,
             coalesce(x ->> 'producer_granule_id', x ->> 'title') AS granule,
             x ->> 'id' AS granule_concept_id,
             CAST(x ->> 'time_start' AS TIMESTAMPTZ) AS t_start,
             CAST(coalesce(x ->> 'time_end', x ->> 'time_start') AS TIMESTAMPTZ) AS t_end,
             CAST(x ->> 'updated' AS TIMESTAMPTZ) AS t_updated,
             (SELECT l ->> 'href' FROM unnest(from_json(x -> 'links', '["JSON"]')) AS t(l)
              WHERE (l ->> 'rel') LIKE '%/data#' AND (l ->> 'inherited') IS NULL LIMIT 1) AS data_url
      FROM (SELECT unnest(from_json(coalesce(json_extract(content, '$.feed.entry'), '[]'), '["JSON"]')) AS x FROM read_text('granules.json'));

      CREATE TABLE per_coll AS
      WITH g AS (
        SELECT *, row_number() OVER (PARTITION BY concept_id ORDER BY t_start DESC, t_updated DESC) AS rn,
               date_diff('second', lag(t_end) OVER (PARTITION BY concept_id ORDER BY t_start), t_start) / 60.0 AS gap_min
        FROM granules
      )
      SELECT concept_id, count(*) AS granules_in_window,
             any_value(granule) FILTER (WHERE rn = 1) AS latest_granule,
             any_value(granule_concept_id) FILTER (WHERE rn = 1) AS latest_granule_concept_id,
             any_value(t_start) FILTER (WHERE rn = 1) AS latest_start,
             any_value(t_end) FILTER (WHERE rn = 1) AS latest_end,
             any_value(data_url) FILTER (WHERE rn = 1) AS latest_data_url,
             max(t_updated) AS last_published,
             round(median(date_diff('second', t_end, t_updated)) / 60.0, 1) AS p50_publish_min,
             round(max(date_diff('second', t_end, t_updated)) / 60.0, 1) AS max_publish_min,
             round(coalesce(max(gap_min), 0), 1) AS max_gap_min
      FROM g GROUP BY concept_id;

      CREATE TABLE state AS
      SELECT s ->> 'concept_id' AS concept_id, s ->> 'status' AS status, s ->> 'since' AS since,
             s ->> 'last_granule' AS last_granule, s ->> 'last_end' AS last_end, s ->> 'dispatched_granule' AS dispatched_granule
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('state.json'));

      CREATE TABLE measured AS
      SELECT CAST(r.input_order AS INTEGER) AS input_order, r.short_name, r.cmr_provider AS provider, r.concept_id,
             CAST(r.max_age_minutes AS DOUBLE) AS max_age_minutes, coalesce(p.granules_in_window, 0) AS granules_in_window,
             p.latest_granule, p.latest_granule_concept_id, p.latest_start, p.latest_end, p.latest_data_url, p.last_published,
             p.p50_publish_min, p.max_publish_min, p.max_gap_min,
             CASE WHEN p.latest_end > run.now_utc THEN 'published' ELSE 'acquired' END AS age_basis,
             round(date_diff('second', CASE WHEN p.latest_end > run.now_utc THEN p.last_published ELSE p.latest_end END, run.now_utc) / 60.0, 1) AS age_minutes,
             s.status AS previous_status, s.since AS previous_since, s.last_granule AS state_last_granule, s.last_end AS state_last_end,
             s.dispatched_granule
      FROM resolved r CROSS JOIN run
      LEFT JOIN per_coll p ON p.concept_id = r.concept_id
      LEFT JOIN state s ON s.concept_id = r.concept_id
      WHERE r.resolution = 'OK';

      CREATE TABLE result AS
      WITH st AS (
        SELECT *, CASE WHEN latest_granule IS NULL THEN 'STALE' WHEN age_minutes > max_age_minutes THEN 'LATE' ELSE 'FRESH' END AS status
        FROM measured
      )
      SELECT *,
             CASE WHEN previous_status IS NULL AND status = 'FRESH' THEN 'BASELINE'
                  WHEN previous_status IS NULL OR (status <> previous_status AND status <> 'FRESH') THEN 'BREACH'
                  WHEN status <> previous_status THEN 'RECOVERED'
                  ELSE 'UNCHANGED' END AS change,
             status = 'FRESH' AND latest_granule IS DISTINCT FROM dispatched_granule AS ready,
             CASE WHEN status IS DISTINCT FROM previous_status THEN strftime((SELECT now_utc FROM run), '%Y-%m-%dT%H:%M:%SZ') ELSE previous_since END AS since
      FROM st;

      COPY (
        SELECT input_order, short_name, provider, concept_id, 'OK' AS resolution, status, change, ready, age_minutes, age_basis, max_age_minutes,
               latest_granule, strftime(latest_start, '%Y-%m-%dT%H:%M:%SZ') AS latest_start_utc, strftime(latest_end, '%Y-%m-%dT%H:%M:%SZ') AS latest_end_utc,
               strftime(last_published, '%Y-%m-%dT%H:%M:%SZ') AS last_published_utc, p50_publish_min, max_publish_min, granules_in_window, max_gap_min,
               since AS status_since, latest_data_url, NULL AS problem
        FROM result
        UNION ALL
        SELECT CAST(input_order AS INTEGER), short_name, provider, concept_id, resolution, NULL, NULL, false, NULL, NULL, CAST(max_age_minutes AS DOUBLE),
               NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, problem
        FROM resolved WHERE resolution <> 'OK'
        ORDER BY input_order
      ) TO '{{ outputFiles.latency_csv }}' (HEADER true, DELIMITER ',');

      -- New state: one row per resolved collection; a STALE collection keeps the last granule it was seen with.
      COPY (
        SELECT concept_id, short_name, status, since,
               coalesce(latest_granule, state_last_granule) AS last_granule,
               coalesce(strftime(latest_end, '%Y-%m-%dT%H:%M:%SZ'), state_last_end) AS last_end,
               CASE WHEN ready THEN latest_granule ELSE dispatched_granule END AS dispatched_granule
        FROM result ORDER BY input_order
      ) TO '{{ outputFiles.state_json }}' (FORMAT JSON, ARRAY true);

      WITH lines AS (
        SELECT input_order, change,
               CASE status WHEN 'FRESH' THEN ':large_green_circle: *' || short_name || '* recovered, was ' || previous_status || ' since ' || coalesce(previous_since, '?')
                           WHEN 'LATE' THEN ':red_circle: *' || short_name || '* LATE'
                           ELSE ':black_circle: *' || short_name || '* STALE, no granule acquired in the last {{ inputs.window_hours }} h' END
               || CASE WHEN latest_granule IS NOT NULL
                       THEN '. Newest `' || latest_granule || '` ' || age_basis || ' ' || age_minutes || ' min ago (SLA ' || max_age_minutes || ' min), median publish latency '
                            || p50_publish_min || ' min, ' || granules_in_window || ' granules in window, largest gap ' || max_gap_min || ' min'
                       ELSE CASE WHEN state_last_granule IS NOT NULL THEN '. Last seen `' || state_last_granule || '` ending ' || state_last_end ELSE '' END END AS line
        FROM result WHERE change IN ('BREACH', 'RECOVERED')
      )
      SELECT
        (SELECT count(*) FROM granules) AS granules_returned,
        (SELECT count(*) FROM result) AS collections,
        (SELECT count(*) FROM state) = 0 AS is_first_run,
        (SELECT count(*) FROM result WHERE status = 'FRESH') AS fresh,
        (SELECT count(*) FROM result WHERE status = 'LATE') AS late,
        (SELECT count(*) FROM result WHERE status = 'STALE') AS stale,
        (SELECT count(*) FROM result WHERE change = 'BREACH') AS breaches,
        (SELECT count(*) FROM result WHERE change = 'RECOVERED') AS recoveries,
        (SELECT count(*) FROM result WHERE ready) AS ready,
        (SELECT coalesce(string_agg(short_name || ' ' || status || ' ' || coalesce(CAST(age_minutes AS VARCHAR) || '/' || max_age_minutes || ' min', 'no granule') || CASE WHEN ready THEN ' (new granule)' ELSE '' END, ', ' ORDER BY input_order), '') FROM result) AS status_line,
        (SELECT coalesce(string_agg(line, chr(10) ORDER BY input_order), '') FROM lines) AS alert_text,
        (SELECT coalesce(string_agg(short_name, ', ' ORDER BY input_order), '') FROM result WHERE status <> 'FRESH') AS held_back,
        (SELECT coalesce(CAST(json_group_array(json_object('short_name', short_name, 'provider', provider, 'collection_concept_id', concept_id,
                  'granule', latest_granule, 'granule_concept_id', latest_granule_concept_id,
                  'time_start', strftime(latest_start, '%Y-%m-%dT%H:%M:%SZ'), 'time_end', strftime(latest_end, '%Y-%m-%dT%H:%M:%SZ'),
                  'age_minutes', age_minutes, 'data_url', latest_data_url)) AS VARCHAR), '[]')
           FROM result WHERE ready) AS ready_granules;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    kvType: JSON
    value: "{{ read(outputs.evaluate.outputFiles.state_json) }}"

  - id: notify_changes
    type: io.kestra.plugin.core.flow.If
    description: Slack only on a change, a new breach (FRESH to LATE or STALE, or a breach on the first run) or a recovery, not every 30 minutes while a feed stays late.
    condition: "{{ (outputs.evaluate.outputs[0].row.breaches + outputs.evaluate.outputs[0].row.recoveries) > 0 }}"
    then:
      - id: log_changes
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.evaluate.outputs[0].row.alert_text }}"

      - id: slack_changes
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: allowFailure keeps the gate working when `SLACK_WEBHOOK_URL` is not set or Slack is down; the same text is in the WARN log.
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": {{ ('NRT latency: ' ~ outputs.evaluate.outputs[0].row.breaches ~ ' breach(es), ' ~ outputs.evaluate.outputs[0].row.recoveries ~ ' recovery(ies)') | toJson }},
            "blocks": [
              {"type": "section", "text": {"type": "mrkdwn", "text": {{ outputs.evaluate.outputs[0].row.alert_text | toJson }}}},
              {"type": "context", "elements": [{"type": "mrkdwn", "text": {{ ('NASA CMR via Kestra ' ~ flow.namespace ~ '.' ~ flow.id ~ ', execution ' ~ execution.id) | toJson }}}]}
            ]
          }

  - id: gate
    type: io.kestra.plugin.core.flow.If
    description: Opens only for collections that are inside their SLA and have a granule newer than the last one handed downstream; late and stale collections are held back.
    condition: "{{ outputs.evaluate.outputs[0].row.ready > 0 }}"
    then:
      - id: log_ready
        type: io.kestra.plugin.core.log.Log
        message: "Gate open for {{ outputs.evaluate.outputs[0].row.ready }} collection(s): {{ outputs.evaluate.outputs[0].row.ready_granules }}"

      - id: start_downstream
        type: io.kestra.plugin.core.flow.Subflow
        runIf: "{{ (inputs.downstream_flow_id ?? '') | trim != '' }}"
        namespace: "{{ flow.namespace }}"
        flowId: "{{ inputs.downstream_flow_id }}"
        wait: false
        inputs:
          granules: "{{ outputs.evaluate.outputs[0].row.ready_granules }}"
    else:
      - id: gate_closed
        type: io.kestra.plugin.core.log.Log
        message: "Gate closed: no collection has a fresh granule that was not handed downstream yet. Held back: {{ outputs.evaluate.outputs[0].row.held_back == '' ? 'none' : outputs.evaluate.outputs[0].row.held_back }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      CMR returned {{ outputs.evaluate.outputs[0].row.granules_returned }} granules of {{ outputs.fetch_granules.headers['cmr-hits'][0] ?? '?' }} CMR hits for {{ outputs.evaluate.outputs[0].row.collections }} collections since {{ outputs.resolve.outputs[0].row.window_start }}{{ outputs.evaluate.outputs[0].row.is_first_run ? ' (first run: baseline, any collection already out of SLA alerts once)' : '' }}.
      {{ outputs.evaluate.outputs[0].row.fresh }} fresh, {{ outputs.evaluate.outputs[0].row.late }} late, {{ outputs.evaluate.outputs[0].row.stale }} stale; {{ outputs.evaluate.outputs[0].row.breaches }} breach(es), {{ outputs.evaluate.outputs[0].row.recoveries }} recovery(ies), {{ outputs.evaluate.outputs[0].row.ready }} ready for downstream.
      {{ outputs.evaluate.outputs[0].row.status_line }}

outputs:
  - id: latency_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.latency_csv }}"
  - id: ready_granules
    type: JSON
    value: "{{ outputs.evaluate.outputs[0].row.ready_granules }}"
  - id: run_summary
    type: JSON
    value: "{{ outputs.evaluate.outputs[0].row }}"

extend:
  title: Gate Satellite Pipelines on NASA CMR Near-Real-Time Granule Latency
  metaTitle: NASA CMR NRT Granule Latency SLA Gate for Satellite Pipelines | Kestra
  shortDescription: Check the newest granules of LANCE near-real-time collections (MODIS and VIIRS active fires and more) in NASA CMR every 30 minutes, hold back collections that breach their latency SLA, alert Slack on breach and recovery, and start a downstream flow only for fresh granules not yet processed.
  metaDescription: Every 30 min, measure NASA CMR NRT granule latency per collection, alert Slack on SLA breaches and start downstream processing only for fresh granules.
  description: |
    Near-real-time satellite pipelines depend on LANCE publishing MODIS and VIIRS granules within hours of the overpass; when a feed stalls, a scheduled job reprocesses an old granule or builds an empty product. This flow checks the newest granules of each collection in NASA's Common Metadata Repository (CMR) against a per-collection SLA and gates downstream work: fresh collections with an unhandled granule go to a downstream flow, late or stalled ones are held back and posted to Slack once on breach and once on recovery.

    ## How it works

    1. `every_30_minutes` (Schedule) starts the check.
    2. `previous_state` (KV Get) loads the last status and handed-over granule per collection. First run: collections already out of SLA alert once.
    3. `lookup_collections` makes one CMR collection search (repeated `short_name[]`). `resolve` (DuckDB) maps each entry to one concept id and flags typos (NOT_FOUND), short names that also exist as science-quality collections, e.g. MOD14 at LPCLOUD (AMBIGUOUS), duplicates and invalid SLAs. `nothing_resolved` fails the run if none resolve.
    4. `fetch_granules` makes one granule search for all collections (`collection_concept_id[]`, `temporal` = last `window_hours`, newest first).
    5. `evaluate` (DuckDB) computes the newest granule's age, median and worst publish latency (CMR `updated` minus acquisition end), granule count and largest gap, and sets FRESH, LATE or STALE (nothing acquired in the window). Daily products with a future end time are aged from publication.
    6. `save_state` (KV Set) stores the state; `notify_changes` (If) logs and posts to Slack only on breach or recovery.
    7. `gate` (If) opens when a FRESH collection has a granule newer than the last one handed over and starts `downstream_flow_id` (Subflow) with a `granules` JSON input; otherwise `gate_closed` logs what is held back.

    ## What you get

    - A latency CSV (flow output) with status, age, SLA, newest granule, publish latency, gaps, data URL and a reason for every skipped entry.
    - Slack only when a feed goes late or stale and when it recovers.
    - Downstream runs that never start on a stale feed and never twice for the same granule.

    ## Who it's for

    - Remote-sensing and geospatial data engineers running NRT ingestion.
    - Emergency-management and insurance analytics teams.

    ## Why orchestrate this with Kestra

    - Schedule, retries, KV state and the downstream Subflow live in one YAML file; `allowFailure` keeps the gate working when Slack is down; a separate `state_key` per pipeline reuses the flow.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins, and HTTPS to `cmr.earthdata.nasa.gov` (metadata search needs no key or Earthdata Login).
    - Optional: a flow in the same namespace with a JSON input `granules`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for breach and recovery messages (optional; otherwise WARN log only).

    ## Quick start

    1. Optionally add `SLACK_WEBHOOK_URL`.
    2. Execute with the defaults: real LANCE collections for Terra and Aqua MODIS fire (90 minute SLA) and Suomi NPP, NOAA-20 and NOAA-21 VIIRS 375 m fire (180 minutes, the LANCE target). The SLA values are examples to tune.
    3. Execute again: only collections with a new granule are ready.
    4. Set `downstream_flow_id` and enable the trigger.

    ## How to extend

    - Add any CMR collection (OMI, TROPOMI, AMSR2), with a longer SLA for daily products.
    - Download the `ready_granules` data URLs with an Earthdata Login token.

