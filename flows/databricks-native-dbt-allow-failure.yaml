id: databricks-native-dbt-allow-failure
namespace: company.data.engineering

description: |
  ## How the quality gate works
  When staging dbt tests fail, dbt skips the production merge via its native dependency skip logic. Kestra's AllowFailure traps the failing job so telemetry and Slack alerting still run.

  **Expected behavior:** a failed run shows `INTERNAL_ERROR` on the Databricks job and a caught task failure in Kestra — that is the design.

  ## dbt project setup (required)
  The audit table is written by this `on-run-end` hook:

  {% raw %}
  `macros/save_test_results.sql`:
  ```sql
  {% macro save_test_results() %}
    {% if execute %}
      {% set create_sql %}
        CREATE TABLE IF NOT EXISTS {{ target.catalog }}.{{ target.schema }}.dbt_test_results (
          run_started_at TIMESTAMP, invocation_id STRING,
          test_name STRING, status STRING, failures BIGINT
        )
      {% endset %}
      {% do run_query(create_sql) %}
      {% for result in results %}
        {% if result.node is defined and result.node.resource_type == 'test' %}
          {% set failures = result.failures if result.failures is not none else 0 %}
          {% set insert_sql %}
            INSERT INTO {{ target.catalog }}.{{ target.schema }}.dbt_test_results
            VALUES (TIMESTAMP '{{ run_started_at }}', '{{ invocation_id }}',
                    '{{ result.node.name }}', '{{ result.status }}', {{ failures }})
          {% endset %}
          {% do run_query(insert_sql) %}
        {% endif %}
      {% endfor %}
    {% endif %}
  {% endmacro %}
  ```
  {% endraw %}

  And in `dbt_project.yml`: `on-run-end: ["{{ save_test_results() }}"]`

  ## Create the Databricks job (once, in the UI)
  1. Jobs → Create job → Source: Git provider → your repo/branch
  2. dbt task: `dbt deps`, then `dbt build --select stg_orders+` (match your staging model's name)
  3. Set warehouse/catalog/schema to match your dbt project; run once manually; copy the Job ID as the `dbt_job_id` input

  ## Secrets
  `DATABRICKS_HOST` (bare hostname) · `DATABRICKS_TOKEN` · `DATABRICKS_HTTP_PATH` (`/sql/1.0/warehouses/...`) · `SLACK_WEBHOOK_URL`. OSS/docker installs: base64-encode values into `SECRET_`-prefixed env vars.

  ## Running it
  - Clean run (defaults): all tests pass → success log, no alert
  - Quarantine run: rows with a duplicate `order_id` or a status outside the accepted list → merge skipped → Slack alert with failing test names

  ## Limitations
  Telemetry is scoped to invocations from the current execution, but overlapping executions can still read each other's latest invocation — run one at a time.

extend:
  title: Databricks native dbt build with AllowFailure quarantine
  description: |
    Uploads a CSV into a Unity Catalog volume, triggers a native git-sourced
    Databricks dbt job, then reads dbt's own test-results audit table and
    alerts via Slack if any tests failed. Production models are protected by
    dbt's native skip logic.
  metaDescription: Governed dbt builds on Databricks with failure quarantine and Slack alerts.
  tags:
    - databricks
    - dbt
    - data-quality
    - slack
  ee: false
  demo: false

inputs:
  - id: csv_content
    type: STRING
    description: Raw CSV rows to upload into the landing volume
    defaults: |
      order_id,customer_id,order_date,status,amount
      1,101,2026-10-01,delivered,250.00
      2,102,2026-10-02,shipped,180.50
      3,103,2026-10-03,pending,99.99
  - id: csv_file_name
    type: STRING
    description: File name to write inside the volume
    defaults: new_orders.csv
  - id: volume_path
    type: STRING
    description: Unity Catalog volume path that receives the CSV
    defaults: /Volumes/workspace/staging/raw_landing_volume
  - id: dbt_catalog
    type: STRING
    description: Catalog where dbt writes (audit table lives here too)
    defaults: workspace
  - id: dbt_schema
    type: STRING
    description: Schema where dbt writes (audit table lives here too)
    defaults: staging
  - id: dbt_job_id
    type: STRING
    description: ID of the Databricks job created in the UI (see README) — replace this placeholder
    defaults: "000000000000000"

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 * * * *"

tasks:
  - id: upload_to_uc_volume
    type: io.kestra.plugin.core.http.Request
    description: "PUT the CSV into the UC Volume via the Databricks Files API"
    uri: "https://{{ secret('DATABRICKS_HOST') }}/api/2.0/fs/files{{ inputs.volume_path }}/{{ inputs.csv_file_name }}?overwrite=true"
    method: PUT
    contentType: text/csv
    headers:
      Authorization: "Bearer {{ secret('DATABRICKS_TOKEN') }}"
    body: "{{ inputs.csv_content }}"

  - id: allow_dbt_failure_trap
    type: io.kestra.plugin.core.flow.AllowFailure
    description: "Traps dbt/job failures so downstream telemetry still runs and reports"
    tasks:
      - id: run_governed_dbt_build
        type: io.kestra.plugin.databricks.job.SubmitRun
        description: "Runs the pre-built native dbt job (created once in the Databricks UI)"
        host: "{{ secret('DATABRICKS_HOST') }}"
        authentication:
          token: "{{ secret('DATABRICKS_TOKEN') }}"
        waitForCompletion: PT30M
        runTasks:
          - taskKey: invoke_dbt_job
            runJobTask:
              jobId: "{{ inputs.dbt_job_id }}"

  - id: fetch_dbt_test_telemetry
    type: io.kestra.plugin.databricks.sql.Query
    description: "Reads the audit table populated by dbt's on-run-end hook, scoped to this execution"
    accessToken: "{{ secret('DATABRICKS_TOKEN') }}"
    host: "{{ secret('DATABRICKS_HOST') }}"
    httpPath: "{{ secret('DATABRICKS_HTTP_PATH') }}"
    sql: |
      WITH latest AS (
        SELECT invocation_id
        FROM {{ inputs.dbt_catalog }}.{{ inputs.dbt_schema }}.dbt_test_results
        WHERE run_started_at >= TIMESTAMP'{{ execution.startDate | date(format="yyyy-MM-dd HH:mm:ss", timeZone="UTC") }}'
        ORDER BY run_started_at DESC
        LIMIT 1
      )
      SELECT
        COUNT(*) AS total_tests,
        COUNT_IF(status IN ('fail','error')) AS failure_count,
        COALESCE(
          ARRAY_JOIN(COLLECT_LIST(CASE WHEN status IN ('fail','error') THEN test_name END), '; '),
          'none'
        ) AS failed_tests
      FROM {{ inputs.dbt_catalog }}.{{ inputs.dbt_schema }}.dbt_test_results
      WHERE invocation_id IN (SELECT invocation_id FROM latest);

  - id: results_to_json
    type: io.kestra.plugin.serdes.json.IonToJson
    description: "Convert the single-row query result into one JSON object (JSONL)"
    from: "{{ outputs.fetch_dbt_test_telemetry.uri }}"
    newLine: true

  - id: evaluate_test_results
    type: io.kestra.plugin.core.flow.If
    description: "Route to quarantine alert or success based on dbt test outcomes"
    condition: "{{ fromJson(read(outputs.results_to_json.uri)).failure_count > 0 }}"
    then:
      - id: send_quarantine_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :rotating_light: *dbt quarantine triggered*
          *Failed tests:* {{ fromJson(read(outputs.results_to_json.uri)).failed_tests }}
          *Impact:* this run did NOT update production tables — upstream models were skipped by dbt.
    else:
      - id: check_zero_tests
        type: io.kestra.plugin.core.flow.If
        description: "0 rows means telemetry never landed — warn instead of false success"
        condition: "{{ fromJson(read(outputs.results_to_json.uri)).total_tests == 0 }}"
        then:
          - id: warn_missing_telemetry
            type: io.kestra.plugin.core.log.Log
            message:
              - "No test rows found for this execution — check that the on-run-end hook is deployed in the dbt project."
        else:
          - id: log_success
            type: io.kestra.plugin.core.log.Log
            message:
              - "All {{ fromJson(read(outputs.results_to_json.uri)).total_tests }} dbt tests passed. Production tables updated."
