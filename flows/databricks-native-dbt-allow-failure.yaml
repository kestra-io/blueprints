id: databricks-native-dbt-allow-failure
namespace: company.data.engineering

description: |
  Lands a CSV in a Databricks Unity Catalog Volume, runs it through a native dbt build
  job with a Write-Audit-Publish quality gate, and alerts Slack if any staging test fails.

extend:
  title: Databricks native dbt build with AllowFailure quarantine and Slack alerts
  description: |
    ### What this does
    Lands a CSV directly in a Databricks Unity Catalog volume, runs it through a native,
    Git-sourced [Databricks dbt job](https://docs.databricks.com/aws/en/jobs/dbt), reads
    back which [dbt tests](https://docs.getdbt.com/docs/build/data-tests) failed (if any),
    and alerts Slack with the specifics -- all without letting bad rows reach the
    production table.

    ### Why this approach
    Most dbt-in-Kestra blueprints run dbt inside a throwaway Docker container that talks
    to a warehouse from the outside. Here dbt instead runs as a first-class
    [dbt task](https://docs.databricks.com/aws/en/jobs/dbt) inside Databricks' own governed
    compute, so it inherits Unity Catalog permissions and cluster policies rather than
    needing its own credentials. The flow runs
    [`dbt build`](https://docs.getdbt.com/reference/commands/build), not `dbt run` plus a
    separate `dbt test`, so dbt's own DAG-aware skip logic does the actual gatekeeping: if
    a test on the staging model fails, the production merge model is skipped
    automatically, before Kestra evaluates anything. Kestra's job is to observe that
    outcome and turn it into a Slack alert a human can act on.

    ### How it works
    1. **Land the CSV** -- `upload_to_uc_volume` PUTs the CSV straight to the
       [Databricks Files API](https://docs.databricks.com/api/workspace/files) at the
       target Volume path.
    2. **Run dbt natively, without crashing the flow** -- `run_governed_dbt_build`
       triggers a pre-created Databricks job (see setup below) via
       [`SubmitRun`](https://kestra.io/plugins/plugin-databricks/job/io-kestra-plugin-databricks-job-submitrun)
       with a `runJobTask`. It's wrapped in
       [`AllowFailure`](https://kestra.io/docs/flow-examples/allow-failure) so a failed
       dbt test (which fails the Databricks job) doesn't halt the flow before the
       telemetry and alerting tasks get a chance to run.
    3. **Read back what happened** -- `fetch_dbt_test_telemetry` queries an audit table
       that dbt itself writes via an
       [`on-run-end` hook](https://docs.getdbt.com/reference/project-configs/on-run-start-on-run-end)
       (macro below), scoped to this specific invocation.
    4. **Convert and branch** -- `results_to_json` turns the query's Ion output into JSON,
       and the `evaluate_test_results` / `check_zero_tests` `If` tasks branch on it: alert
       Slack on a real failure, warn if no telemetry rows landed at all (likely the
       `on-run-end` hook never deployed), or log success.

    ### Prerequisites
    - A Databricks workspace with Unity Catalog and a SQL warehouse.
    - A Git repo containing a dbt project with a staging model (reading from the landing
      Volume) and a production model that `ref()`s it, plus the `on-run-end` hook below.
    - Secrets: `DATABRICKS_HOST` (bare hostname) · `DATABRICKS_TOKEN` ·
      `DATABRICKS_HTTP_PATH` (`/sql/1.0/warehouses/...`) · `SLACK_WEBHOOK_URL`
      ([create one here](https://api.slack.com/messaging/webhooks)). On OSS/Docker
      installs, base64-encode each value into a `SECRET_`-prefixed env var.
    - A [Schedule](https://kestra.io/plugins/plugin-core/trigger/io-kestra-plugin-core-trigger-schedule)
      trigger (shipped disabled; hourly) -- enable it once the flow is validated.

    ### dbt project setup (required, one-time)
    Add this hook so dbt writes its own test results to a queryable table.
    {% raw %}
    In `macros/save_test_results.sql`:
    ```sql
    {% macro save_test_results() %}
      {% if execute %}
        {% set create_sql %}
          CREATE TABLE IF NOT EXISTS {{ target.catalog }}.{{ target.schema }}.dbt_test_results (
            run_started_at TIMESTAMP, invocation_id STRING,
            test_name STRING, status STRING, failures BIGINT
          )
        {% endset %}
        {% do run_query(create_sql) %}
        {% for result in results %}
          {% if result.node is defined and result.node.resource_type == 'test' %}
            {% set failures = result.failures if result.failures is not none else 0 %}
            {% set insert_sql %}
              INSERT INTO {{ target.catalog }}.{{ target.schema }}.dbt_test_results
              VALUES (TIMESTAMP '{{ run_started_at }}', '{{ invocation_id }}',
                      '{{ result.node.name }}', '{{ result.status }}', {{ failures }})
            {% endset %}
            {% do run_query(insert_sql) %}
          {% endif %}
        {% endfor %}
      {% endif %}
    {% endmacro %}
    ```

    And in `dbt_project.yml`:
    ```yaml
    on-run-end:
      - "{{ save_test_results() }}"
    ```
    {% endraw %}

    Then, once, in the Databricks UI: Jobs → Create job → Source: Git provider → your
    repo/branch → add a dbt task running `dbt deps` then
    `dbt build --select stg_orders+` (match your staging model's name) → set the
    warehouse/catalog/schema to match your dbt project → run once manually → copy the
    resulting Job ID into this flow's `dbt_job_id` input.

    ### Expected outputs
    - **Clean run** (all CSV rows pass every test): production table updated, a single
      success log line, no Slack message.
    - **Quarantine run** (e.g. a duplicate `order_id` or an out-of-range `status`): the
      production merge model is skipped by dbt itself, and Slack receives an alert naming
      exactly which tests failed.

    ### Warnings
    - Telemetry is scoped to invocations after this execution's start time, but two
      overlapping executions can still read each other's latest invocation -- avoid
      running this flow concurrently with itself.
    - `SubmitRun` triggers an *existing* job (`dbt_job_id`) rather than creating a new one
      each run, by design -- using `CreateJob` on a schedule would otherwise spawn a new
      Databricks Job object on every execution.

    ### Flow structure used
    Flowable tasks: `core.flow.If` (on `evaluate_test_results` and `check_zero_tests`).
    Runnable tasks: `core.http.Request` (`upload_to_uc_volume`), `databricks.job.SubmitRun`
    (`run_governed_dbt_build`), `databricks.sql.Query` (`fetch_dbt_test_telemetry`),
    `serdes.json.IonToJson` (`results_to_json`), `slack.notifications.SlackIncomingWebhook`
    (`send_quarantine_alert`), `core.log.Log` (`warn_missing_telemetry`, `log_success`).
    Trigger: `core.trigger.Schedule` (disabled by default). `AllowFailure` wraps the dbt run.
  metaDescription: Orchestrate governed dbt builds on Databricks with structural error trapping, isolated telemetry parsing, and Slack notification integration.
  tags:
    - databricks
    - dbt
    - data-quality
    - slack
  ee: false
  demo: false

inputs:
  - id: csv_content
    type: STRING
    description: Raw CSV text structure containing sample transactional information to upload into the staging zone volume
    defaults: |
      order_id,customer_id,order_date,status,amount
      1,101,2026-10-01,delivered,250.00
      2,102,2026-10-02,shipped,180.50
      3,103,2026-10-03,pending,99.99
  - id: csv_file_name
    type: STRING
    description: Destination filename target inside the volume directory path
    defaults: new_orders.csv
  - id: volume_path
    type: STRING
    description: Full Unity Catalog volume route where the raw landing area resides
    defaults: /Volumes/workspace/staging/raw_landing_volume
  - id: dbt_catalog
    type: STRING
    description: Target catalog structure where dbt assets and audit logging telemetry write data
    defaults: workspace
  - id: dbt_schema
    type: STRING
    description: Target schema workspace mapping area where test records land
    defaults: staging
  - id: dbt_job_id
    type: STRING
    description: Target identification key for the UI-provisioned Databricks pipeline deployment
    defaults: "000000000000000"

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 * * * *"

tasks:
  - id: upload_to_uc_volume
    type: io.kestra.plugin.core.http.Request
    description: "Uploads raw dataset files directly into the targeted Unity Catalog landing zone volume using the native Databricks REST Files API."
    uri: "https://{{ secret('DATABRICKS_HOST') }}/api/2.0/fs/files{{ inputs.volume_path }}/{{ inputs.csv_file_name }}?overwrite=true"
    method: PUT
    contentType: text/csv
    headers:
      Authorization: "Bearer {{ secret('DATABRICKS_TOKEN') }}"
    body: "{{ inputs.csv_content }}"

  - id: allow_dbt_failure_trap
    type: io.kestra.plugin.core.flow.AllowFailure
    description: "Acts as an automated quarantine trap. Catches up-stream data model execution errors to preserve the run context so telemetry gathering can run uninterrupted."
    tasks:
      - id: run_governed_dbt_build
        type: io.kestra.plugin.databricks.job.SubmitRun
        description: "Executes the pre-configured Git-integrated dbt model compilation and processing pipeline directly inside the Databricks execution runtime environment."
        host: "{{ secret('DATABRICKS_HOST') }}"
        authentication:
          token: "{{ secret('DATABRICKS_TOKEN') }}"
        waitForCompletion: PT30M
        runTasks:
          - taskKey: invoke_dbt_job
            runJobTask:
              jobId: "{{ inputs.dbt_job_id }}"

  - id: fetch_dbt_test_telemetry
    type: io.kestra.plugin.databricks.sql.Query
    description: "Queries the local dbt on-run-end audit infrastructure to parse out specific data quality rule failure statistics corresponding cleanly to this runtime window."
    accessToken: "{{ secret('DATABRICKS_TOKEN') }}"
    host: "{{ secret('DATABRICKS_HOST') }}"
    httpPath: "{{ secret('DATABRICKS_HTTP_PATH') }}"
    sql: |
      WITH latest AS (
        SELECT invocation_id
        FROM {{ inputs.dbt_catalog }}.{{ inputs.dbt_schema }}.dbt_test_results
        WHERE run_started_at >= TIMESTAMP'{{ execution.startDate | date(format="yyyy-MM-dd HH:mm:ss", timeZone="UTC") }}'
        ORDER BY run_started_at DESC
        LIMIT 1
      )
      SELECT
        COUNT(*) AS total_tests,
        COUNT_IF(status IN ('fail','error')) AS failure_count,
        COALESCE(
          ARRAY_JOIN(COLLECT_LIST(CASE WHEN status IN ('fail','error') THEN test_name END), '; '),
          'none'
        ) AS failed_tests
      FROM {{ inputs.dbt_catalog }}.{{ inputs.dbt_schema }}.dbt_test_results
      WHERE invocation_id IN (SELECT invocation_id FROM latest);

  - id: results_to_json
    type: io.kestra.plugin.serdes.json.IonToJson
    description: "Converts the single-row query result from Ion into JSON for the downstream branching tasks."
    from: "{{ outputs.fetch_dbt_test_telemetry.uri }}"
    newLine: false

  - id: evaluate_test_results
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates the parsed JSON metric dataset. Splits flow routing paths dynamically based on structural error presence or missing data rows."
    condition: "{{ fromJson(read(outputs.results_to_json.uri)).failure_count > 0 }}"
    then:
      - id: send_quarantine_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches a comprehensive markdown incident report directly to Slack containing granular detail regarding violated data rules."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":rotating_light: *dbt quarantine triggered*\n*Failed tests:* {{ fromJson(read(outputs.results_to_json.uri)).failed_tests }}\n*Impact:* this run did NOT update production tables — upstream models were skipped by dbt. Delta tables are safe."
          }
    else:
      - id: check_zero_tests
        type: io.kestra.plugin.core.flow.If
        description: "Validates against empty data states to prevent undetected missing logging tables from evaluating as false successes."
        condition: "{{ fromJson(read(outputs.results_to_json.uri)).total_tests == 0 }}"
        then:
          - id: warn_missing_telemetry
            type: io.kestra.plugin.core.log.Log
            message:
              - "No test rows found for this execution — check that the on-run-end hook is deployed in the dbt project."
        else:
          - id: log_success
            type: io.kestra.plugin.core.log.Log
            message:
              - "All {{ fromJson(read(outputs.results_to_json.uri)).total_tests }} dbt tests passed. Production tables updated."