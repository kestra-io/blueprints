id: databricks-native-dbt-allow-failure
namespace: company.team
description: |
  Lands a CSV in a Databricks Unity Catalog Volume, runs it through a native dbt build
  job with a Write-Audit-Publish quality gate, and alerts Slack if any staging test fails.

inputs:
  - id: csv_content
    type: STRING
    description: Raw CSV text to upload.
    defaults: |
      order_id,customer_id,order_date,status,amount
      1,101,2026-10-01,delivered,250.00
      2,102,2026-10-02,shipped,180.50
      3,103,2026-10-03,pending,99.99
  - id: csv_file_name
    type: STRING
    description: Destination filename.
    defaults: new_orders.csv
  - id: volume_path
    type: STRING
    description: Full Unity Catalog volume path.
    defaults: /Volumes/workspace/staging/raw_landing_volume
  - id: dbt_catalog
    type: STRING
    description: Target catalog for dbt assets.
    defaults: workspace
  - id: dbt_schema
    type: STRING
    description: Target schema for test records.
    defaults: staging
  - id: dbt_job_id
    type: STRING
    description: Databricks Job ID.
    defaults: "000000000000000"

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 * * * *"

tasks:
  - id: upload_to_uc_volume
    type: io.kestra.plugin.core.http.Request
    uri: "https://{{ secret('DATABRICKS_HOST') }}/api/2.0/fs/files{{ inputs.volume_path }}/{{ inputs.csv_file_name }}?overwrite=true"
    method: PUT
    contentType: text/csv
    headers:
      Authorization: "Bearer {{ secret('DATABRICKS_TOKEN') }}"
    body: "{{ inputs.csv_content }}"

  - id: allow_dbt_failure_trap
    type: io.kestra.plugin.core.flow.AllowFailure
    tasks:
      - id: run_governed_dbt_build
        type: io.kestra.plugin.databricks.job.SubmitRun
        host: "{{ secret('DATABRICKS_HOST') }}"
        authentication:
          token: "{{ secret('DATABRICKS_TOKEN') }}"
        waitForCompletion: PT30M
        runTasks:
          - taskKey: invoke_dbt_job
            runJobTask:
              jobId: "{{ inputs.dbt_job_id }}"

  - id: fetch_dbt_test_telemetry
    type: io.kestra.plugin.databricks.sql.Query
    accessToken: "{{ secret('DATABRICKS_TOKEN') }}"
    host: "{{ secret('DATABRICKS_HOST') }}"
    httpPath: "{{ secret('DATABRICKS_HTTP_PATH') }}"
    sql: |
      WITH latest AS (
        SELECT invocation_id
        FROM {{ inputs.dbt_catalog }}.{{ inputs.dbt_schema }}.dbt_test_results
        WHERE run_started_at >= TIMESTAMP'{{ execution.startDate | date(format="yyyy-MM-dd HH:mm:ss", timeZone="UTC") }}'
        ORDER BY run_started_at DESC
        LIMIT 1
      )
      SELECT
        COUNT(*) AS total_tests,
        COUNT_IF(status IN ('fail','error')) AS failure_count,
        COALESCE(
          ARRAY_JOIN(COLLECT_LIST(CASE WHEN status IN ('fail','error') THEN test_name END), '; '),
          'none'
        ) AS failed_tests
      FROM {{ inputs.dbt_catalog }}.{{ inputs.dbt_schema }}.dbt_test_results
      WHERE invocation_id IN (SELECT invocation_id FROM latest);

  - id: results_to_json
    type: io.kestra.plugin.serdes.json.IonToJson
    from: "{{ outputs.fetch_dbt_test_telemetry.uri }}"
    newLine: false

  - id: evaluate_test_results
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.results_to_json.uri)).failure_count > 0 }}"
    then:
      - id: send_quarantine_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":rotating_light: *dbt quarantine triggered*\n*Failed tests:* {{ fromJson(read(outputs.results_to_json.uri)).failed_tests }}\n*Impact:* this run did NOT update production tables - upstream models were skipped by dbt. Delta tables are safe."
          }
    else:
      - id: check_zero_tests
        type: io.kestra.plugin.core.flow.If
        condition: "{{ fromJson(read(outputs.results_to_json.uri)).total_tests == 0 }}"
        then:
          - id: warn_missing_telemetry
            type: io.kestra.plugin.core.log.Log
            message: "No test rows found for this execution - check that the on-run-end hook is deployed in the dbt project."
        else:
          - id: log_success
            type: io.kestra.plugin.core.log.Log
            message: "All {{ fromJson(read(outputs.results_to_json.uri)).total_tests }} dbt tests passed. Production tables updated."

outputs:
  - id: total_tests
    type: INT
    value: "{{ fromJson(read(outputs.results_to_json.uri)).total_tests }}"

extend:
  title: "Databricks native dbt build with AllowFailure quarantine and Slack alerts"
  shortDescription: Governed dbt builds on Databricks with automated test monitoring and Slack alerts.
  metaTitle: Databricks dbt Orchestration with Quality Gating and Slack Notifications
  metaDescription: Orchestrate governed dbt builds on Databricks with structural error trapping, isolated telemetry parsing, and Slack notification integration.
  description: |
    Data quality failures in dbt pipelines can prevent reliable data from reaching production. This blueprint combines a Databricks-native dbt job with Kestra orchestration to collect test results, identify failed tests, and notify the team through Slack.

    ## How it works

    1. `upload_to_uc_volume` (`io.kestra.plugin.core.http.Request`) uploads a CSV directly to a Databricks Unity Catalog volume using the Files API.
    2. `run_governed_dbt_build` (`io.kestra.plugin.databricks.job.SubmitRun`) triggers a pre-created Databricks dbt job. This is wrapped in an `allow_dbt_failure_trap` (`io.kestra.plugin.core.flow.AllowFailure`) block. This block captures the error signal if a dbt test fails (which fails the Databricks job), preventing the flow from stopping so that the subsequent telemetry tasks can execute.
    3. `fetch_dbt_test_telemetry` (`io.kestra.plugin.databricks.sql.Query`) queries an audit table populated by a dbt `on-run-end` hook. It specifically looks for the `invocation_id` corresponding to the job run triggered in step 2 to parse results.
    4. `evaluate_test_results` (`io.kestra.plugin.core.flow.If`) evaluates the parsed JSON metric dataset. Splits flow routing paths dynamically based on structural error presence or missing data rows to notify Slack.

    ## What you get

    - **Write-Audit-Publish (WAP) Pattern**: Bad data is stopped at the staging layer by dbt's DAG logic, while Kestra provides the visibility and alerting layer.
    - **Governed Execution**: By running dbt as a Databricks Job Task, the process inherits Unity Catalog permissions and cluster policies.
    - **Resilient Orchestration**: The flow captures the failure reason and communicates it to the team instead of failing silently.

    ## Who it's for

    Data Engineers using Databricks and dbt who want to move beyond simple pass/fail pipelines and implement robust data quality alerting without managing external containers.

    ## Why orchestrate this with Kestra

    Kestra bridges the gap between Databricks execution and external communication. While Databricks runs the heavy compute, Kestra handles the logic of what happens when things go wrong, integrating Slack notifications and conditional branching that are difficult to manage within a standard dbt-only environment.

    ## Prerequisites

    - A Databricks workspace with Unity Catalog and a SQL warehouse.
    - A Git repo containing a dbt project with the `on-run-end` hook for telemetry.
    - A pre-configured Databricks Job with a dbt task.

    ### Secrets

    - `DATABRICKS_HOST`: Your Databricks workspace URL.
    - `DATABRICKS_TOKEN`: A Personal Access Token.
    - `DATABRICKS_HTTP_PATH`: The HTTP path for your SQL Warehouse.
    - `SLACK_WEBHOOK_URL`: Your Slack application incoming webhook.

    ## Quick start

    1. **Add the dbt Macro**: Add the `save_test_results` macro to your dbt project to enable telemetry.
    2. **Configure the Flow**: Update the `dbt_job_id` and `volume_path` inputs to match your environment.
    3. **Run**: Execute the flow; it will land data, trigger the build, and monitor the results.

    ## How to extend

    - **Post-Failure Cleanup**: Add a task to delete the landing CSV if the dbt job fails.
    - **Alternative Alerts**: Replace the Slack task with Microsoft Teams or PagerDuty.
    - **Data Freshness**: Add a `dbt source freshness` check as an additional preceding task.

    ## Outputs

    - `total_tests`: The total number of dbt test results found for the execution.

    ## Links

    - [Databricks dbt Jobs Documentation](https://docs.databricks.com/aws/en/jobs/dbt)
    - [Kestra Databricks Plugin](https://kestra.io/plugins/plugin-databricks)
    - [dbt Data Tests](https://docs.getdbt.com/docs/build/data-tests)

  tags:
    - Data
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false