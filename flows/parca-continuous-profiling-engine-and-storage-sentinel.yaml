id: parca-continuous-profiling-engine-and-storage-sentinel
namespace: company.platform

description: |
  Continuously audits Parca continuous profiling service availability, verifies FrostDB storage engine readiness, evaluates profile query execution paths, and dispatches actionable Slack incident alerts upon telemetry ingestion failure or engine degradation.

inputs:
  - id: parca_url
    type: STRING
    displayName: Parca Endpoint URL
    defaults: "http://localhost:7070"
    description: "Base HTTP URL of the Parca continuous profiling server."

  - id: canary_query
    type: STRING
    displayName: Canary Profile Query
    defaults: "parca_agent_cpu"
    description: "Sample profile metric query executed to verify profile query engine responsiveness."

  - id: slack_channel
    type: STRING
    displayName: SRE Alert Channel
    defaults: "#platform-alerts"
    description: "Slack channel for routing profiling engine outage and degradation alerts."

triggers:
  - id: scheduled_sentinel_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"
    disabled: true
    inputs:
      parca_url: "http://localhost:7070"
      canary_query: "parca_agent_cpu"

tasks:
  - id: probe_parca_readiness
    type: io.kestra.plugin.core.http.Request
    description: "Queries Parca /readyz to verify FrostDB storage initialization and query engine readiness."
    uri: "{{ inputs.parca_url }}/readyz"
    method: GET
    failedOnEmptyResponse: false

  - id: probe_parca_metrics
    type: io.kestra.plugin.core.http.Request
    description: "Scrapes Prometheus metrics from Parca to verify telemetry scraper and storage compaction health."
    uri: "{{ inputs.parca_url }}/metrics"
    method: GET
    failedOnEmptyResponse: false

  - id: probe_profile_query
    type: io.kestra.plugin.core.http.Request
    description: "Executes a canary profile query against the Parca API to verify query engine execution."
    uri: "{{ inputs.parca_url }}/api/v1/query"
    method: POST
    headers:
      Content-Type: "application/json"
    body: |
      {
        "mode": "MODE_MERGE",
        "reportType": "REPORT_TYPE_FLAMEGRAPH_ARROW",
        "query": "{{ inputs.canary_query }}"
      }
    failedOnEmptyResponse: false

  - id: evaluate_parca_health
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates Parca readiness and profile query responses using Pebble conditionals."
    value: |
      {% if outputs.probe_parca_readiness.code != 200 %}
      ENGINE_UNHEALTHY
      {% elseif outputs.probe_parca_metrics.code != 200 %}
      METRICS_SCRAPE_ERROR
      {% elseif outputs.probe_profile_query.code != 200 and outputs.probe_profile_query.code != 404 %}
      QUERY_EXECUTION_FAILED
      {% else %}
      COMPLIANT
      {% endif %}
    cases:
      COMPLIANT:
        - id: log_compliant_state
          type: io.kestra.plugin.core.log.Log
          level: INFO
          message: "Parca continuous profiling engine at {{ inputs.parca_url }} is operational, storage is ready, and profile query APIs are responding nominally."

      ENGINE_UNHEALTHY:
        - id: alert_engine_offline
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "Parca Profiling Engine Offline",
                  "text": "CRITICAL: Parca readiness probe at `{{ inputs.parca_url }}/readyz` returned HTTP status `{{ outputs.probe_parca_readiness.code }}`.\nFrostDB storage or query coordinator may have crashed. Continuous performance profiling is degraded.",
                  "footer": "Kestra Sentinel | Observability Operations"
                }
              ]
            }
        - id: log_engine_offline
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "CRITICAL: Parca readiness probe failed with status code {{ outputs.probe_parca_readiness.code }}."

      METRICS_SCRAPE_ERROR:
        - id: alert_metrics_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#E65100",
                  "title": "Parca Metrics Endpoint Failure",
                  "text": "WARNING: Parca metrics endpoint `{{ inputs.parca_url }}/metrics` failed with HTTP status `{{ outputs.probe_parca_metrics.code }}`.\nInternal telemetry and compaction tracking are offline.",
                  "footer": "Kestra Sentinel | Observability Operations"
                }
              ]
            }

      QUERY_EXECUTION_FAILED:
        - id: alert_query_error
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#F57C00",
                  "title": "Parca Profile Query Execution Failure",
                  "text": "WARNING: Canary profile query for `{{ inputs.canary_query }}` on `{{ inputs.parca_url }}` returned HTTP status `{{ outputs.probe_profile_query.code }}`.\nProfile query execution path may be degraded or corrupted.",
                  "footer": "Kestra Sentinel | Observability Operations"
                }
              ]
            }

  - id: record_audit_log
    type: io.kestra.plugin.core.log.Log
    description: "Emits a permanent execution audit log recording Parca profiling engine status."
    level: INFO
    message: "Completed Parca sentinel audit on {{ inputs.parca_url }}. Readiness code={{ outputs.probe_parca_readiness.code }}, Metrics code={{ outputs.probe_parca_metrics.code }}, Query code={{ outputs.probe_profile_query.code }}."

extend:
  title: Parca Continuous Profiling Engine and Storage Sentinel
  metaTitle: Parca Profiling Engine and Storage Sentinel | Kestra
  shortDescription: Audits Parca continuous profiling readiness, verifies FrostDB storage ingestion, evaluates profile query execution, and alerts via Slack.
  metaDescription: Audit Parca continuous profiling readiness, verify FrostDB storage ingestion, evaluate profile query latency, and dispatch Slack incident alerts with Kestra.
  description: |
    Continuously audits Parca continuous profiling service availability, verifies FrostDB storage engine readiness, evaluates profile query execution paths, and dispatches actionable Slack incident alerts upon telemetry ingestion failure or engine degradation.

    ## How it works

    1. A recurrent `Schedule` trigger initiates the sentinel audit workflow every 2 hours (disabled initially for on-demand configuration).
    2. The `probe_parca_readiness` task queries the Parca `/readyz` endpoint to confirm FrostDB columnar datastore initialization, memory allocator stability, and query coordinator readiness.
    3. The `probe_parca_metrics` task queries `/metrics` to ensure internal telemetry, block compaction pipelines, and scraper metrics are responsive.
    4. The `probe_profile_query` task posts a canary profile query to `/api/v1/query` to evaluate real-time Arrow flamegraph generation and query responsiveness.
    5. The `evaluate_parca_health` task evaluates response codes using Pebble conditionals inside a `Switch` task, classifying health into `COMPLIANT`, `ENGINE_UNHEALTHY`, `METRICS_SCRAPE_ERROR`, or `QUERY_EXECUTION_FAILED`.
    6. When degradation is detected, contextual Slack notifications are posted via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` with diagnostic details, and a permanent audit trail is preserved in Kestra's execution history.

    ## What you get

    - Automated operational surveillance over eBPF continuous profiling clusters and FrostDB storage nodes.
    - Early warning when memory consumption spikes prevent Parca from executing profile queries or flamegraphs.
    - Continuous validation that Parca scraper daemons and Prometheus metric exports remain healthy.
    - Actionable Slack notifications directing engineers straight to failing endpoints and query errors.
    - Centralized, revision-controlled execution audit logs for compliance and performance reviews.

    ## Who it's for

    - Platform Engineers and SREs maintaining production continuous profiling infrastructure.
    - Performance Engineers identifying CPU bottlenecks, memory leaks, and goroutine starvation across microservices.
    - DevOps Teams operating automated deployment pipelines dependent on continuous observability.

    ## Why orchestrate this with Kestra

    - **Declarative Observability Governance**: Codify profiling audit cadences, target queries, and notification channels as version-controlled YAML blueprints.
    - **Native Secret Isolation**: Inject Slack webhook credentials securely using Kestra namespace secrets via `{{ secret(...) }}` without plaintext exposure.
    - **Multi-Branch Flow Routing**: Automatically isolate storage engine crashes from metric scraper degradation or query syntax errors using native `Switch` tasks.
    - **Auditable Execution Telemetry**: Maintain complete execution logs and HTTP diagnostic status codes across every audit run.

    ## Prerequisites

    - A running Parca continuous profiling server (accessible over HTTP) with REST and gRPC gateway enabled (default port 7070).
    - Network reachability from the Kestra worker or runner environment to the Parca HTTP endpoint.
    - A Slack Incoming Webhook URL configured with permission to post into your target operations channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for routing operational alerts and incidents.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance (e.g., under namespace `company.platform`).
    3. Click **Execute** with default parameters or supply your custom `parca_url` and `canary_query`.
    4. Confirm that execution logs display successful HTTP 200 response codes under the **Executions** tab.
    5. Activate the `scheduled_sentinel_audit` trigger to establish recurrent automated Parca health monitoring.

    ## How to extend

    - **Automated Memory Dump**: Extend the `ENGINE_UNHEALTHY` branch to capture heap profiles or FrostDB diagnostics before restarting pods.
    - **Multi-Cluster Sweep**: Wrap the readiness and query probes inside a `ForEach` task to evaluate Parca instances across multiple Kubernetes clusters in a single workflow.
    - **PagerDuty Escalation**: Route `ENGINE_UNHEALTHY` events directly to on-call schedules in PagerDuty or Opsgenie.
    - **Pre-Release Performance Gate**: Chain this flow as a prerequisite task before load-testing canary deployments to confirm profiling telemetry is active.

    ## Links

    - [Parca Documentation](https://www.parca.dev/docs/overview)
    - [Parca GitHub Repository](https://github.com/parca-dev/parca)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
