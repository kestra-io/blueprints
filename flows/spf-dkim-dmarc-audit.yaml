id: spf-dkim-dmarc-audit
namespace: company.team
description: |
  Audit a domain's SPF, DKIM, and DMARC records straight from live DNS,
  report missing or weak email-auth configuration, and alert Slack until
  every check passes — with an optional strict DMARC mode.

triggers:
  - id: monthly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audit email authentication once a month. Shipped disabled; enable it after your first successful manual run.
    cron: "0 5 1 * *"
    disabled: true
  - id: audit_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call this after changing email-auth DNS records to confirm they landed correctly everywhere.
    key: email-auth-audit

inputs:
  - id: domain
    type: STRING
    defaults: example.com
    description: The domain whose email-auth records are audited (the organizational domain your mail is sent from).
  - id: dkim_selectors
    type: STRING
    defaults: google,selector1,default
    description: Comma-separated DKIM selectors to probe as <selector>._domainkey.<domain>. List the selectors your mail senders actually use.
  - id: require_strict_dmarc
    type: BOOLEAN
    defaults: false
    description: When true, a DMARC policy of p=none counts as a failure — use it once you have moved past monitoring-only.

tasks:
  - id: audit_records
    type: io.kestra.plugin.scripts.shell.Commands
    description: Install dig in a throwaway Alpine container, then read SPF on the apex, DMARC at _dmarc, and a TXT record for every listed DKIM selector. Quoted and chunked TXT records are concatenated before matching, policies are extracted from the DMARC record, and the verdict — spf_found, dmarc_found, dmarc_policy, dkim_found/checked, overall_ok — is published through Kestra's stdout outputs protocol. Missing records are findings with exit 0, not crashes — an unaudited domain and a broken check are different problems.
    containerImage: alpine:3.20
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        set -eu
        apk add --no-cache bind-tools >/dev/null 2>&1
        DOMAIN="{{ inputs.domain }}"
        SELECTORS="{{ inputs.dkim_selectors }}"
        STRICT={{ inputs.require_strict_dmarc }}

        txt_records() {
          dig +short +time=3 +tries=3 TXT "$1" 2>/dev/null | sed 's/" "//g' | tr -d '"'
        }

        SPF_RAW=$(txt_records "$DOMAIN" | grep -m1 'v=spf1' || true)
        SPF_FOUND=false
        if [ -n "$SPF_RAW" ]; then
          SPF_FOUND=true
        fi
        echo "SPF on $DOMAIN: ${SPF_RAW:-MISSING}"

        DMARC_RAW=$(txt_records "_dmarc.$DOMAIN" | grep -m1 'v=DMARC1' || true)
        DMARC_FOUND=false
        DMARC_POLICY="missing"
        if [ -n "$DMARC_RAW" ]; then
          DMARC_FOUND=true
          P=$(printf '%s' "$DMARC_RAW" | grep -o 'p=[a-z]*' | head -n 1 | cut -d= -f 2 || true)
          DMARC_POLICY=${P:-unspecified}
        fi
        echo "DMARC on $DOMAIN: ${DMARC_RAW:-MISSING} (policy: $DMARC_POLICY)"

        DKIM_FOUND=0
        DKIM_CHECKED=0
        OLDIFS=$IFS
        IFS=','
        for s in $SELECTORS; do
          s=$(printf '%s' "$s" | tr -d ' ')
          if [ -z "$s" ]; then
            continue
          fi
          DKIM_CHECKED=$(( DKIM_CHECKED + 1 ))
          REC=$(txt_records "${s}._domainkey.$DOMAIN" | grep -m1 -e 'v=DKIM1' -e 'p=' || true)
          if [ -n "$REC" ]; then
            DKIM_FOUND=$(( DKIM_FOUND + 1 ))
            echo "DKIM selector '$s': present"
          else
            echo "DKIM selector '$s': MISSING"
          fi
        done
        IFS=$OLDIFS

        STRICT_OK=true
        if [ "$STRICT" = "true" ]; then
          case "$DMARC_POLICY" in
            reject|quarantine) STRICT_OK=true ;;
            *) STRICT_OK=false ;;
          esac
        fi

        OVERALL=false
        if [ "$SPF_FOUND" = "true" ] && [ "$DMARC_FOUND" = "true" ] && [ "$DKIM_FOUND" -gt 0 ] && [ "$STRICT_OK" = "true" ]; then
          OVERALL=true
        fi

        echo "verdict: overall_ok=$OVERALL (strict=$STRICT)"
        printf '::{"outputs":{"spf_found":%s,"dmarc_found":%s,"dmarc_policy":"%s","dkim_found":%d,"dkim_checked":%d,"overall_ok":%s}}::\n' \
          "$SPF_FOUND" "$DMARC_FOUND" "$DMARC_POLICY" "$DKIM_FOUND" "$DKIM_CHECKED" "$OVERALL"

  - id: check_verdict
    type: io.kestra.plugin.core.flow.If
    description: Branch on the verdict — a fully passing domain gets a quiet logged record, anything missing or weak gets an alert that names each individual gap.
    condition: "{{ outputs.audit_records.vars.overall_ok == false }}"
    then:
      - id: alert_auth_gaps
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: List which of SPF, DMARC, and DKIM is missing, the DMARC policy in force, and how many selectors answered, so the DNS owner can fix the exact record instead of reading a generic warning.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Email auth audit: {{ inputs.domain }} — SPF {{ outputs.audit_records.vars.spf_found }}, DMARC {{ outputs.audit_records.vars.dmarc_found }} (policy: {{ outputs.audit_records.vars.dmarc_policy }}), DKIM {{ outputs.audit_records.vars.dkim_found }}/{{ outputs.audit_records.vars.dkim_checked }} selectors found. Strict mode: {{ inputs.require_strict_dmarc }}. Fix the missing records so spoofed mail cannot pass as yours. Execution {{ execution.id }}."
          }
    else:
      - id: log_pass
        type: io.kestra.plugin.core.log.Log
        description: Record the passing configuration — policy and selector counts — so future runs can show exactly when something changed.
        message: "Email auth audit passed for {{ inputs.domain }}: SPF present, DMARC policy {{ outputs.audit_records.vars.dmarc_policy }}, {{ outputs.audit_records.vars.dkim_found }}/{{ outputs.audit_records.vars.dkim_checked }} DKIM selector(s) found (strict={{ inputs.require_strict_dmarc }})."

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the audit itself could not run — resolver blocked, no dig, container pull failure — because a crashed audit must never be read as a passing domain.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Email auth audit FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.domain }}. No verdict was produced — verify the Worker can reach DNS on UDP/53 and that the alpine image is pullable."
      }

outputs:
  - id: auth_summary
    type: JSON
    description: 'The verdict — e.g. {"spf_found": true, "dmarc_found": true, "dmarc_policy": "reject", "dkim_found": 2, "dkim_checked": 3, "overall_ok": true} — ready for dashboards or a compliance gate.'
    value: "{{ outputs.audit_records.vars | toJson }}"

extend:
  title: Prove Your Domain's Email Authentication Is Actually Enforced
  shortDescription: Monthly SPF, DKIM, and DMARC audit straight from live DNS that names every missing record and alerts Slack, with optional strict p=reject enforcement.
  metaTitle: SPF DKIM and DMARC Monitoring with Kestra
  metaDescription: Audit a domain's SPF, DKIM, and DMARC records from live DNS, report missing or weak configuration, and alert Slack until every check passes.
  description: |
    Spoofed mail from your own domain is the cheapest attack in the book, and the defenses — SPF, DKIM, DMARC — rot silently: a vendor change breaks the include chain, a selector rotates out, DMARC sits on p=none forever because nobody scheduled the follow-up. This blueprint reads the records straight from live DNS on a cadence, extracts the DMARC policy, probes every selector your senders use, and reports a single verdict. Missing records are findings, not crashes, so the alert tells you exactly which record to add; enable strict mode and a monitoring-only p=none starts failing too.

    ## How it works

    1. `audit_records` (`io.kestra.plugin.scripts.shell.Commands` on the Docker task runner) installs `dig` in a throwaway `alpine:3.20` container and performs three lookups: SPF TXT on the apex, DMARC TXT at `_dmarc.<domain>`, and one TXT per selector in `dkim_selectors` at `<selector>._domainkey.<domain>`. Quoted chunked TXT records are concatenated before matching (long SPF strings arrive split), the `p=` policy is cut from the DMARC record, and the verdict — `spf_found`, `dmarc_found`, `dmarc_policy`, `dkim_found`, `dkim_checked`, `overall_ok` — is published through the `::{"outputs": ...}::` protocol. Absent records exit 0 with `overall_ok: false`; only a broken check (no dig, no network) exits non-zero.
    2. `check_verdict` (`io.kestra.plugin.core.flow.If`) branches on `overall_ok`. False: `alert_auth_gaps` posts each individual gap and the policy in force to Slack. True: `log_pass` records the configuration so the history shows when policy or selectors changed.
    3. The `errors` block alerts Slack when the audit itself fails — a crashed audit must never read as a passing domain.
    4. Triggers: a monthly `Schedule` (shipped disabled) plus a `Webhook` (`email-auth-audit`) to confirm record changes right after they are made.

    ## What you get

    - One verdict across the three records that protect your domain from spoofing, computed from live DNS rather than a dashboard's cache.
    - Per-selector DKIM probing — the check follows the selectors your senders really use, not a guess.
    - A strict mode that turns `p=none` into a failure, so DMARC enforcement actually completes.
    - An `auth_summary` JSON output for dashboards or a compliance gate.

    ## Who it's for

    - IT and mail admins who own the domain's DNS and are responsible for DMARC enforcement reaching p=reject.
    - Security teams doing continuous checks on subsidiary or acquired domains.
    - Anyone who inherited a domain with SPF, DKIM, and DMARC "somewhere" and no idea of their current state.

    ## Why orchestrate this with Kestra

    `dig` in a terminal shows today's records; Kestra shows the policy over time. The flow adds the cadence, the branch that separates enforcement from monitoring-only, the alert that names the gap, the webhook to verify a change the moment it lands, and an execution history where "when did DMARC go to p=reject" has an answer. It is the same pattern as the DNS propagation blueprint: DNS truth, made operational.

    ## Prerequisites

    - Outbound UDP/53 from the Worker to public resolvers.
    - The DKIM selectors your mail senders publish (Google Workspace: `google`; Microsoft 365: `selector1`, `selector2`; add yours to the list).
    - A Slack incoming webhook for gap and failure alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for gap and verifier-failure alerts.

    ## Quick start

    1. Add the Slack webhook secret to your namespace.
    2. Set `domain` and list your real `dkim_selectors`.
    3. Run once and read `auth_summary` — compare it with `dig TXT` output by hand.
    4. Enable `monthly_audit`, then flip `require_strict_dmarc` to true when you are ready to fail on p=none.

    ## How to extend

    - Fan out over many domains by calling this flow as a subflow from a domains input list.
    - Add an `If` on `dmarc_policy == "none"` that opens a ticket to finish enforcement — the classic stalled-DMARC pattern.
    - Chain this audit after `dns-propagation-verifier` when you change email-auth records: verify propagation first, audit the verdict second.
    - Push `auth_summary` into a dashboard alongside the other domain-health checks.

    ## Links

    - [DMARCorg — How DMARC works](https://dmarc.org/)
    - [SPF record syntax](https://datatracker.ietf.org/doc/html/rfc7208)
    - [Kestra Docker task runner](https://kestra.io/plugins/plugin-scripts)
    - This blueprint has been created by [RudraMalvankar](https://github.com/RudraMalvankar)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Networking / DNS
    - Security & Compliance
  ee: false
  demo: false
