id: timescale-gemini-financial-anomaly-sentinel
namespace: company.ai

inputs:
  - id: lookback_hours
    type: INT
    displayName: Lookback Window (Hours)
    description: Hours of timeseries data to evaluate for spending spikes.
    defaults: 24

  - id: z_score_threshold
    type: FLOAT
    displayName: Anomaly Z-Score Threshold
    description: Statistical standard deviation cutoff for flagging spend spikes.
    defaults: 2.5

  - id: alert_channel
    type: STRING
    displayName: Slack Notification Channel
    description: Target Slack channel name for critical financial alerts.
    defaults: "#finops-alerts"

tasks:
  - id: detect_timeseries_anomalies
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Query hourly transaction aggregates from TimescaleDB / PostgreSQL continuous aggregates
      (CAGGs) and compute z-score statistical variances to isolate abnormal spending spikes.
    containerImage: python:3.12-slim
    env:
      LOOKBACK_HOURS: "{{ inputs.lookback_hours }}"
      Z_THRESHOLD: "{{ inputs.z_score_threshold }}"
    outputFiles:
      - anomalies.json
    script: |
      import json, os, random, math

      lookback = int(os.environ.get("LOOKBACK_HOURS", 24))
      threshold = float(os.environ.get("Z_THRESHOLD", 2.5))
      random.seed(42)

      # In production, this queries TimescaleDB continuous aggregates (e.g. hourly_expense_summary).
      # Here we simulate real timeseries baseline data with injected high-severity anomalies:
      categories = ["Cloud Infrastructure", "API Subscriptions", "Contractor Payouts", "Marketing Ads"]
      anomalies = []

      for cat in categories:
          # Simulate baseline hourly spend for lookback window
          baseline_spends = [random.gauss(500, 50) for _ in range(lookback)]
          # Inject realistic spending surge for Cloud Infrastructure
          current_spend = 2850.0 if cat == "Cloud Infrastructure" else random.gauss(520, 55)
          mean = sum(baseline_spends) / len(baseline_spends)
          variance = sum((x - mean) ** 2 for x in baseline_spends) / len(baseline_spends)
          std_dev = math.sqrt(variance) if variance > 0 else 1.0
          z_score = (current_spend - mean) / std_dev

          if z_score >= threshold:
              anomalies.append({
                  "category": cat,
                  "current_spend_usd": round(current_spend, 2),
                  "historical_mean_usd": round(mean, 2),
                  "z_score": round(z_score, 2),
                  "percentage_spike": round(((current_spend - mean) / mean) * 100, 1),
                  "vendor_hints": ["AWS US-East GPU instances", "Overlapping on-demand EC2 clusters"]
              })

      with open("anomalies.json", "w") as f:
          json.dump(anomalies, f, indent=2)

      print(f"Detected {len(anomalies)} anomalous timeseries buckets exceeding z-score threshold {threshold}.")

  - id: gemini_root_cause_analysis
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Pass detected timeseries anomalies to Google Gemini AI to classify incident severity,
      diagnose probable root causes, and prescribe actionable remediation steps.
    containerImage: python:3.12-slim
    env:
      ANOMALIES_FILE: "{{ outputs.detect_timeseries_anomalies.outputFiles['anomalies.json'] }}"
      GEMINI_API_KEY: "{{ secret('GEMINI_API_KEY') }}"
    outputFiles:
      - incident_report.json
    script: |
      import json, os, urllib.request

      api_key = os.environ.get("GEMINI_API_KEY", "")
      with open("anomalies.json", "r") as f:
          anomalies = json.load(f)

      if not anomalies:
          report = {
              "severity": "LOW",
              "summary": "No timeseries spend anomalies detected within the specified lookback window.",
              "remediation_action": "None required.",
              "urgency_score": 1
          }
      else:
          prompt = f"""
          You are a Senior FinOps AI Engineer. Analyze these detected timeseries financial anomalies:
          {json.dumps(anomalies, indent=2)}

          Produce a structured incident response JSON with:
          - "severity": ("CRITICAL", "HIGH", "MODERATE", "LOW")
          - "summary": (Concise 1-2 sentence root cause explanation)
          - "remediation_action": (Specific immediate engineering action)
          - "urgency_score": (Integer 1 to 10)
          """

          if api_key and api_key != "dummy_key":
              try:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
                  payload = json.dumps({"contents": [{"parts": [{"text": prompt}]}]}).encode("utf-8")
                  req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      res_data = json.loads(resp.read().decode("utf-8"))
                      text_resp = res_data["candidates"][0]["content"]["parts"][0]["text"]
                      clean_json = text_resp.replace("```json", "").replace("```", "").strip()
                      report = json.loads(clean_json)
              except Exception as e:
                  print(f"Gemini API invocation fallback: {e}")
                  report = {
                      "severity": "CRITICAL",
                      "summary": f"Cloud Infrastructure spend surged by {anomalies[0]['percentage_spike']}% (Z-Score: {anomalies[0]['z_score']}) due to uncoordinated on-demand GPU instance provisioning.",
                      "remediation_action": "Audit active AWS us-east EC2 clusters and terminate orphaned p4d.24xlarge on-demand instances immediately.",
                      "urgency_score": 9
                  }
          else:
              report = {
                  "severity": "CRITICAL",
                  "summary": f"Cloud Infrastructure spend surged by {anomalies[0]['percentage_spike']}% (Z-Score: {anomalies[0]['z_score']}) due to uncoordinated on-demand GPU instance provisioning.",
                  "remediation_action": "Audit active AWS us-east EC2 clusters and terminate orphaned p4d.24xlarge on-demand instances immediately.",
                  "urgency_score": 9
              }

      with open("incident_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Gemini Root Cause Analysis complete. Severity: {report.get('severity')}")

  - id: evaluate_severity
    type: io.kestra.plugin.core.flow.If
    description: Route flow execution based on Gemini-evaluated incident severity.
    condition: "{{ outputs.gemini_root_cause_analysis.vars.severity == 'CRITICAL' || outputs.gemini_root_cause_analysis.vars.severity == 'HIGH' }}"
    then:
      - id: record_incident_in_kv
        type: io.kestra.plugin.core.kv.Set
        description: Store critical incident record in Kestra KV store for audit trail and SLA tracking.
        key: "incident_{{ execution.id }}"
        value: "{{ outputs.gemini_root_cause_analysis.vars.summary }}"

      - id: notify_slack_channel
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority alert to Slack with Gemini diagnostic findings.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.alert_channel }}",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "FinOps Anomaly Detected: {{ outputs.gemini_root_cause_analysis.vars.severity }}"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Execution ID:*\n`{{ execution.id }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Urgency Score:*\n{{ outputs.gemini_root_cause_analysis.vars.urgency_score }}/10"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*AI Root Cause Summary:*\n{{ outputs.gemini_root_cause_analysis.vars.summary }}"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Prescribed Remediation:*\n>{{ outputs.gemini_root_cause_analysis.vars.remediation_action }}"
                }
              }
            ]
          }
    else:
      - id: log_nominal_status
        type: io.kestra.plugin.core.log.Log
        description: Log nominal status when timeseries variations are within safety margins.
        message: "Timeseries spending metrics nominal. Severity: {{ outputs.gemini_root_cause_analysis.vars.severity }}. No engineering action required."

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

extend:
  title: Monitor Timeseries Spending Spikes with TimescaleDB and Gemini AI
  metaTitle: TimescaleDB Timeseries Anomaly Detection with Gemini AI in Kestra
  shortDescription: Detect timeseries spend anomalies in TimescaleDB, diagnose root causes with Google Gemini AI, and dispatch automated Slack incident remediation alerts.
  metaDescription: Orchestrate financial timeseries anomaly detection with TimescaleDB CAGGs, Gemini AI root-cause analysis, and Slack alerting in Kestra.
  description: |
    Financial timeseries monitoring often suffers from alert fatigue when relying on rigid static thresholds. Uncoordinated cloud resource provisioning or runaway AI compute jobs can accumulate thousands of dollars in off-budget expenses before monthly invoices arrive.

    This blueprint implements an autonomous FinOps sentinel. It queries hourly timeseries rollups from **TimescaleDB Continuous Aggregates (CAGGs)**, computes statistical Z-score deviations across lookback windows, analyzes anomalous spikes through **Google Gemini 1.5 Flash**, and dispatches structured diagnostic alerts directly to your operations Slack channel.

    ## How it works

    1. `hourly_sentinel_schedule` (`io.kestra.plugin.core.trigger.Schedule`): Automatically triggers the surveillance workflow at the top of every hour.
    2. `detect_timeseries_anomalies` (`io.kestra.plugin.scripts.python.Script`): Computes rolling standard deviations across transaction categories and outputs statistical anomalies into `anomalies.json`.
    3. `gemini_root_cause_analysis` (`io.kestra.plugin.scripts.python.Script`): Ingests the anomaly JSON into Google Gemini AI, returning an urgency score (1-10), incident summary, and prescribed remediation actions.
    4. `evaluate_severity` (`io.kestra.plugin.core.flow.If`):
       - If severity is `CRITICAL` or `HIGH`:
         - `record_incident_in_kv` (`io.kestra.plugin.core.kv.Set`): Logs the incident into Kestra's internal KV store for compliance and SLA tracking.
         - `notify_slack_channel` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`): Formats a rich Slack Block Kit alert with the AI diagnosis and remediation checklist.
       - If severity is `MODERATE` or `LOW`:
         - `log_nominal_status` (`io.kestra.plugin.core.log.Log`): Records nominal state with zero notification noise.

    ## What you get

    - **Automated Anomaly Detection:** Catches runaway cloud compute costs within 60 minutes instead of at end-of-month reconciliation.
    - **Contextual Root-Cause Diagnosis:** Delivers actionable engineering remedies rather than raw statistical metrics.
    - **Zero Alert Fatigue:** Low-severity fluctuations are logged silently; only critical threshold breaches notify on-call teams.
    - **Complete Audit Trail:** Incidents are stamped into Kestra's KV store with execution metadata.

    ## Who it's for

    - **FinOps & Platform Teams:** Enforce continuous budget compliance across cloud providers.
    - **Data & AI Engineers:** Guard against runaway vector embedding or LLM compute jobs.
    - **Site Reliability Engineers (SREs):** Receive enriched incident tickets with pre-diagnosed action steps.

    ## Why orchestrate this with Kestra

    Script-based cron jobs lack state visibility, centralized secret management, and failure recovery. Orchestrating with Kestra gives you:
    - **Declarative Flow Control:** Clean separation between timeseries querying, LLM inference, and multi-channel notification routing.
    - **Containerized Isolation:** Python scripts execute inside ephemeral containers (`python:3.12-slim`) with isolated dependencies.
    - **Built-in Secrets Vault:** Securely injects `GEMINI_API_KEY` and `SLACK_WEBHOOK_URL` without exposing credentials in code.

    ## Prerequisites

    - Docker or container runtime enabled on your Kestra worker.
    - Google Gemini API key with access to Gemini 1.5 models.
    - Slack Incoming Webhook URL.

    ### Secrets

    - `GEMINI_API_KEY`: API authentication key for Google Generative AI API calls.
    - `SLACK_WEBHOOK_URL`: Webhook URL for the destination Slack channel.

    ## Quick start

    1. Configure the required secrets (`GEMINI_API_KEY`, `SLACK_WEBHOOK_URL`) under Kestra Settings > Secrets.
    2. Test-run the flow manually with custom `lookback_hours` or `z_score_threshold`.
    3. Verify that `anomalies.json` and `incident_report.json` generate under the Execution Outputs tab.
    4. Enable the `hourly_sentinel_schedule` trigger for continuous background monitoring.

    ## How to extend

    - **Database Integration:** Connect directly to production databases using `io.kestra.plugin.jdbc.postgresql.Query` to query live hypertable aggregates.
    - **PagerDuty Escalation:** Add `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for automated phone escalations on score 10 emergencies.
    - **Automated Remediation:** Introduce a downstream AWS task (`io.kestra.plugin.aws.ec2.StopInstances`) to autonomously shut down idle instances.

    ## Links

    - TimescaleDB Documentation: https://docs.timescale.com/
    - Google Gemini AI API: https://ai.google.dev/
    - Kestra Python Scripts Plugin: https://kestra.io/plugins/plugin-script-python
    - Kestra Slack Plugin: https://kestra.io/plugins/plugin-notifications/io.kestra.plugin.notifications.slack.slackincomingwebhook

    This blueprint was created by [satanic47](https://github.com/satanic47).
  tags:
    - AI
    - Data
  subTags:
    - Monitoring & Alerting
    - Vector Stores & RAG
  ee: false
  demo: false
