id: aws-s3-public-access-block-drift-sentinel
namespace: company.ops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region to target.

tasks:
  - id: get_public_access_block
    type: io.kestra.plugin.aws.cli.AwsCLI
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.aws_region }}"
    commands:
      - |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        aws s3control get-public-access-block --account-id "$ACCOUNT_ID" --output json > /tmp/pab.json
        cat /tmp/pab.json
        BLOCK_PUBLIC_ACLS=$(jq -r '.PublicAccessBlockConfiguration.BlockPublicAcls' /tmp/pab.json)
        IGNORE_PUBLIC_ACLS=$(jq -r '.PublicAccessBlockConfiguration.IgnorePublicAcls' /tmp/pab.json)
        BLOCK_PUBLIC_POLICY=$(jq -r '.PublicAccessBlockConfiguration.BlockPublicPolicy' /tmp/pab.json)
        RESTRICT_PUBLIC_BUCKETS=$(jq -r '.PublicAccessBlockConfiguration.RestrictPublicBuckets' /tmp/pab.json)
        if [ "$BLOCK_PUBLIC_ACLS" = "true" ] && [ "$IGNORE_PUBLIC_ACLS" = "true" ] && [ "$BLOCK_PUBLIC_POLICY" = "true" ] && [ "$RESTRICT_PUBLIC_BUCKETS" = "true" ]; then
          echo '{"drift_detected": false, "block_public_acls": true, "ignore_public_acls": true, "block_public_policy": true, "restrict_public_buckets": true}'
        else
          echo "{\"drift_detected\": true, \"block_public_acls\": $BLOCK_PUBLIC_ACLS, \"ignore_public_acls\": $IGNORE_PUBLIC_ACLS, \"block_public_policy\": $BLOCK_PUBLIC_POLICY, \"restrict_public_buckets\": $RESTRICT_PUBLIC_BUCKETS}"
        fi

  - id: evaluate_drift
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.get_public_access_block.vars.drift_detected | default(false) }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":rotating_light: *AWS S3 Public Access Block Drift Detected*\nAccount-level S3 public access block settings are not fully enabled.\n• BlockPublicAcls: `{{ outputs.get_public_access_block.vars.block_public_acls }}`\n• IgnorePublicAcls: `{{ outputs.get_public_access_block.vars.ignore_public_acls }}`\n• BlockPublicPolicy: `{{ outputs.get_public_access_block.vars.block_public_policy }}`\n• RestrictPublicBuckets: `{{ outputs.get_public_access_block.vars.restrict_public_buckets }}`\nRegion: `{{ inputs.aws_region }}`"
          }
    else:
      - id: log_ok
        type: io.kestra.plugin.core.log.Log
        message: "All S3 account-level public access block settings are enabled. No drift detected."

errors:
  - id: error_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":x: *AWS S3 Public Access Block Sentinel failed*\nExecution `{{ execution.id }}` encountered an error: `{{ error.message }}`"
      }

triggers:
  - id: scheduled_sentinel_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: AWS S3 Account Public Access Block Configuration Drift Sentinel
  shortDescription: Continuously audit your AWS account-level S3 public access block settings and alert Slack if any protection is disabled.
  description: |
    This sentinel runs on a schedule to verify that all four AWS account-level S3 public access block settings are enabled:
    `BlockPublicAcls`, `IgnorePublicAcls`, `BlockPublicPolicy`, and `RestrictPublicBuckets`. If any setting has drifted to
    `false`, a Slack alert fires immediately with the exact flags that are misconfigured.

    ## How it works

    1. `io.kestra.plugin.aws.cli.AwsCLI` calls `aws sts get-caller-identity` to resolve the current account ID, then
       calls `aws s3control get-public-access-block` to retrieve the four block flags for that account.
    2. A shell conditional evaluates each flag. If all four are `true`, `drift_detected` is set to `false`; otherwise it
       is set to `true` and each individual flag value is emitted as a variable.
    3. `io.kestra.plugin.core.flow.If` branches on `drift_detected`. When `true`, a Slack alert lists the exact
       misconfigured flags. When `false`, the flow logs a clean health message and exits.
    4. A top-level `errors` block fires a Slack alert if the AWS CLI or any other task throws an unhandled exception.

    ## What you get

    - Automated detection of account-level S3 public access block drift every 15 minutes.
    - Precise per-flag Slack notifications identifying exactly which settings are disabled.
    - A top-level error handler that surfaces execution failures without silent failures.
    - A fully auditable execution history in Kestra for every sentinel check.

    ## Who it's for

    - Security engineers enforcing AWS S3 data-exposure controls.
    - Cloud platform teams running CIS AWS benchmark compliance programmes.
    - DevOps teams that need automated drift detection without a dedicated CSPM tool.

    ## Why orchestrate this with Kestra

    AWS Config can flag this rule, but it requires a separate service, rule set, and notification pipeline. Kestra
    consolidates the check, the conditional logic, and the Slack alert into a single declarative flow with full execution
    lineage, retries, and namespace-scoped secret management — no additional infrastructure required.

    ## Prerequisites

    - An AWS IAM identity with `s3control:GetPublicAccessBlock` and `sts:GetCallerIdentity` permissions.
    - A Slack incoming webhook.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret access key.
    - `SLACK_WEBHOOK`: Slack incoming webhook URL.

    ## Quick start

    1. Add `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` to your Kestra namespace secrets.
    2. Set the `aws_region` input to your target region (default: `us-east-1`).
    3. Enable the schedule trigger or execute manually to verify the current account state.

    ## How to extend

    - Loop over multiple AWS accounts by storing account IDs as a Kestra variable and using `ForEach`.
    - Add automated remediation by calling `aws s3control put-public-access-block` when drift is detected.
    - Route critical findings to PagerDuty or OpsGenie in addition to Slack.
    - Persist results to a database or S3 for long-term compliance trend analysis.

    ## Links

    - [AWS S3 Public Access Block documentation](https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html)
    - [Kestra AWS CLI plugin](https://kestra.io/plugins/plugin-aws)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
  ee: false
  demo: false
