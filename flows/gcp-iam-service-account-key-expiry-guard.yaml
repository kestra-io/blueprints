id: gcp-iam-service-account-key-expiry-guard
namespace: company.security

description: Audits Google Cloud Platform (GCP) IAM Service Account user-managed keys across projects, alerting security teams when unrotated keys exceed compliance age thresholds.

concurrency:
  limit: 1

inputs:
  - id: gcp_project_id
    type: STRING
    defaults: my-production-project
    description: Google Cloud project ID to audit for stale service account keys.

  - id: max_key_age_days
    type: INT
    defaults: 90
    description: Maximum permissible age in days for active service account keys before rotation violation.

  - id: slack_channel
    type: STRING
    defaults: "#cloud-security"
    description: Slack channel destination for GCP identity governance notifications.

tasks:
  - id: audit_service_account_keys
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install google-api-python-client google-auth
    env:
      GCP_SERVICE_ACCOUNT_KEY: "{{ secret('GCP_SERVICE_ACCOUNT_KEY') }}"
      PROJECT_ID: "{{ inputs.gcp_project_id }}"
      MAX_AGE_DAYS: "{{ inputs.max_key_age_days }}"
    script: |
      import os
      import json
      from datetime import datetime, timezone
      from google.oauth2 import service_account
      from googleapiclient import discovery
      from kestra import Kestra

      project_id = os.getenv('PROJECT_ID')
      max_age = int(os.getenv('MAX_AGE_DAYS', 90))
      sa_json = os.getenv('GCP_SERVICE_ACCOUNT_KEY')

      creds_dict = json.loads(sa_json)
      credentials = service_account.Credentials.from_service_account_info(creds_dict)
      iam = discovery.build('iam', 'v1', credentials=credentials)

      now = datetime.now(timezone.utc)
      stale_keys = []
      total_keys_audited = 0

      # List all Service Accounts in project
      sa_resource = f"projects/{project_id}"
      sa_resp = iam.projects().serviceAccounts().list(name=sa_resource).execute()
      accounts = sa_resp.get('accounts', [])

      for sa in accounts:
          sa_email = sa['email']
          sa_name = sa['name']

          # List keys for this Service Account
          keys_resp = iam.projects().serviceAccounts().keys().list(
              name=sa_name,
              keyTypes=['USER_MANAGED']
          ).execute()

          for k in keys_resp.get('keys', []):
              total_keys_audited += 1
              key_id = k['name'].split('/')[-1]
              valid_after_time_str = k.get('validAfterTime')

              if valid_after_time_str:
                  try:
                      created_time = datetime.fromisoformat(valid_after_time_str.replace('Z', '+00:00'))
                      age_days = (now - created_time).days
                      if age_days > max_age:
                          stale_keys.append({
                              'service_account': sa_email,
                              'key_id': key_id,
                              'age_days': age_days,
                              'created_at': valid_after_time_str
                          })
                  except Exception:
                      pass

      stale_count = len(stale_keys)
      has_stale = stale_count > 0

      Kestra.outputs({
          'total_service_accounts': len(accounts),
          'total_user_managed_keys': total_keys_audited,
          'stale_keys_count': stale_count,
          'has_stale_keys': has_stale,
          'stale_service_accounts': list(set(k['service_account'] for k in stale_keys))
      })

      report_payload = {
          'project_id': project_id,
          'timestamp': now.isoformat(),
          'total_service_accounts': len(accounts),
          'total_keys_audited': total_keys_audited,
          'stale_keys_count': stale_count,
          'stale_keys': stale_keys
      }

      with open('gcp_key_audit_report.json', 'w') as f:
          json.dump(report_payload, f, indent=2)

    outputFiles:
      - gcp_key_audit_report.json

  - id: check_stale_keys
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_service_account_keys.vars.has_stale_keys }}"
    then:
      - id: notify_slack_security
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "GCP IAM Key Rotation Alert: {{ outputs.audit_service_account_keys.vars.stale_keys_count }} stale service account key(s) detected in project {{ inputs.gcp_project_id }}.\nAffected Service Accounts: {{ outputs.audit_service_account_keys.vars.stale_service_accounts | join(', ') }}\nKeys exceed rotation policy ({{ inputs.max_key_age_days }} days)."
          }
    else:
      - id: log_compliant_keys
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.audit_service_account_keys.vars.total_user_managed_keys }} user-managed service account keys in project {{ inputs.gcp_project_id }} comply with rotation policy."

  - id: export_audit_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      gcp_project: "{{ inputs.gcp_project_id }}"
      stale_keys_count: "{{ outputs.audit_service_account_keys.vars.stale_keys_count | string }}"
      governance_status: "{{ outputs.audit_service_account_keys.vars.has_stale_keys ? 'NON_COMPLIANT' : 'COMPLIANT' }}"

triggers:
  - id: weekly_gcp_iam_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"

extend:
  title: GCP IAM Service Account Key Expiry Guard
  metaTitle: GCP IAM Service Account Key Expiry Guard
  shortDescription: Audits Google Cloud Platform IAM Service Account keys and alerts on unrotated credentials.
  metaDescription: Audits GCP IAM Service Account user-managed keys across projects, alerting security teams when unrotated keys exceed compliance age thresholds.
  description: |
    This blueprint audits Google Cloud Platform (GCP) IAM Service Account user-managed credentials across organization projects. Scheduled on a weekly cadence, it identifies long-lived private keys exceeding organization rotation policies (default: 90 days) and dispatches actionable incident notifications to Slack, helping security operations teams enforce CIS Google Cloud Platform Foundation Benchmark recommendations.

    ## How it works

    1. **Scheduled Audit Trigger**: The `weekly_gcp_iam_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every Monday at 08:00 UTC.
    2. **GCP IAM Discovery API Inspection**: The `audit_service_account_keys` task (`io.kestra.plugin.scripts.python.Script`) iterates over all service accounts within the target Google Cloud project, queries `USER_MANAGED` credentials, and computes age deltas against the creation timestamp.
    3. **Compliance Evaluation Gate**: The `check_stale_keys` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any unrotated keys violate the maximum permissible age.
    4. **Slack Security Alert**: When unrotated keys are discovered, `notify_slack_security` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) delivers an incident card detailing the affected service accounts and key IDs.
    5. **Healthy Confirmation**: When all user-managed keys are within rotation limits, `log_compliant_keys` records the compliant state.
    6. **Manifest Export**: The `export_audit_manifest` task tags the execution with searchable labels for audit logging.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Weekly Monday 08:00 UTC] --> B[audit_service_account_keys: Google Cloud IAM API]
        B --> C{Stale Keys Detected?}
        C -- Yes --> D[notify_slack_security: Slack Webhook]
        C -- No --> E[log_compliant_keys: Log]
        D --> F[export_audit_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **CIS GCP Benchmark Enforcement**: Automate verification of recommendation 1.7 (Ensure user-managed / external keys for service accounts are rotated every 90 days).
    - **Credential Exposure Blast Radius Reduction**: Mitigate risks of lingering developer and CI/CD service account key leaks.
    - **Multi-Project Security Posture Verification**: Centrally inventory and monitor cryptographic key lifecycles across enterprise GCP resource hierarchies.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `gcp_project_id` | STRING | `my-production-project` | Google Cloud project ID to audit for stale service account keys. |
    | `max_key_age_days` | INT | `90` | Maximum permissible age in days for active service account keys before rotation violation. |
    | `slack_channel` | STRING | `#cloud-security` | Slack channel destination for GCP identity governance notifications. |

    ## Expected outputs

    - `{{ outputs.audit_service_account_keys.vars.total_service_accounts }}`: Count of service accounts examined.
    - `{{ outputs.audit_service_account_keys.vars.total_user_managed_keys }}`: Count of user-managed keys evaluated.
    - `{{ outputs.audit_service_account_keys.vars.stale_keys_count }}`: Number of keys violating rotation policy.
    - `{{ outputs.audit_service_account_keys.vars.has_stale_keys }}`: Boolean flag indicating compliance failure.
    - `{{ outputs.audit_service_account_keys.vars.stale_service_accounts }}`: List of unique service account emails with stale keys.
    - `{{ outputs.audit_service_account_keys.outputFiles['gcp_key_audit_report.json'] }}`: Full JSON audit report.

    ## Prerequisites

    - Google Cloud Service Account credentials with `roles/iam.serviceAccountViewer` or `roles/viewer` on the targeted project.
    - Incoming Webhook URL configured for your security operations Slack channel.

    ### Secrets

    - `GCP_SERVICE_ACCOUNT_KEY`: Google Cloud Service Account JSON key string.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `GCP_SERVICE_ACCOUNT_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your target Google Cloud Project ID in `gcp_project_id`.
    4. Click **Execute** in the UI to perform an initial service account key hygiene audit.

    ## Common pitfalls and troubleshooting

    - **System-Managed Keys**: Google automatically creates and manages internal keys for default service accounts; this blueprint deliberately filters for `USER_MANAGED` keys to prevent false alarms on internal platform keys.
    - **IAM API Activation**: Ensure the `iam.googleapis.com` API is enabled in the audited GCP project.

    ## How to extend

    - Add automated key disabling via `iam.projects().serviceAccounts().keys().disable()` after multi-tier escalation notifications.
    - Iterate across entire Google Cloud Organization folders using Resource Manager API.
    - Integrate findings with Google Cloud Security Command Center (SCC) as custom security source findings.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - GCP Service Account Key Management: https://cloud.google.com/iam/docs/best-practices-for-managing-service-account-keys
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Day 2 Operations
  ee: false
  demo: false
