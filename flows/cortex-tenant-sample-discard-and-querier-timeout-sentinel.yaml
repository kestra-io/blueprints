    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Cortex Official Documentation and Architecture Guide](https://cortexmetrics.io/docs/)
    - [Cortex Prometheus Metrics and Monitoring Configuration](https://cortexmetrics.io/docs/guides/monitoring-cortex/)
    - [Cortex Architecture, Ingesters, and Ring Consensus Guide](https://cortexmetrics.io/docs/architecture/)
