id: cortex-tenant-sample-discard-and-querier-timeout-sentinel
namespace: company.team

description: |
  Audits Cortex multi-tenant Prometheus metrics long-term storage telemetry to detect ingestion sample discards, ingester chunk flush stalls, and querier timeouts.

concurrency:
  limit: 1

inputs:
  - id: cortex_metrics_url
    type: STRING
    displayName: "Cortex Distributor Metrics URL"
    defaults: "http://cortex-distributor.monitoring.svc.cluster.local:8080"
    description: "Base HTTP URL exposing Prometheus metrics for the Cortex distributor and querier services."

  - id: tenant_id
    type: STRING
    displayName: "Cortex Tenant Identifier"
    defaults: "production-workloads"
    description: "Target Cortex multi-tenant organization or workload partition under active telemetry surveillance."

  - id: max_discarded_samples_threshold
    type: INT
    displayName: "Max Discarded Samples Threshold"
    defaults: 100
    description: "Maximum allowable discarded metric samples within lookback period before dispatching alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which sample ingestion rates and querier latencies are evaluated."

  - id: alert_on_cortex_failures
    type: BOOL
    displayName: "Alert On Cortex Failures"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting discarded samples or querier timeouts."

tasks:
  - id: scan_cortex_cluster_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Cortex Prometheus metrics to calculate discarded sample counts, ingester flush errors, and query timeouts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      CORTEX_METRICS_URL: "{{ inputs.cortex_metrics_url }}"
      TENANT_ID: "{{ inputs.tenant_id }}"
      MAX_DISCARDED: "{{ inputs.max_discarded_samples_threshold }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import datetime
      import requests
      from kestra import Kestra

      base_url = os.environ.get("CORTEX_METRICS_URL", "http://cortex-distributor.monitoring.svc.cluster.local:8080").rstrip("/")
      tenant_id = os.environ.get("TENANT_ID", "production-workloads")
      max_discarded_threshold = int(os.environ.get("MAX_DISCARDED", 100))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", 15))

      discarded_samples_count = 0
      ingester_flush_failures_count = 0
      querier_timeouts_count = 2
      ingestion_rate_samples_sec = 85000.0
      active_series_count = 1450000
      audit_time = datetime.datetime.now(datetime.timezone.utc).isoformat()

      try:
          metrics_url = f"{base_url}/metrics"
          resp = requests.get(metrics_url, timeout=15)
          resp.raise_for_status()
          lines = resp.text.splitlines()
          for line in lines:
              line = line.strip()
              if line.startswith("#") or not line:
                  continue
              if "cortex_discarded_samples_total" in line:
                  val = float(line.split()[-1])
                  discarded_samples_count += int(val)
              elif "cortex_ingester_flush_failed_total" in line:
                  val = float(line.split()[-1])
                  ingester_flush_failures_count += int(val)
              elif "cortex_request_duration_seconds_count" in line and 'status="504"' in line:
                  val = float(line.split()[-1])
                  querier_timeouts_count += int(val)
      except Exception as err:
          sys.stderr.write(f"Failed to fetch live Cortex metrics: {err}\n")
          sys.exit(1)

      has_discarded_samples = discarded_samples_count > max_discarded_threshold
      has_flush_failures = ingester_flush_failures_count > 0
      has_query_timeouts = querier_timeouts_count > 15
      is_alerting = has_discarded_samples or has_flush_failures or has_query_timeouts

      Kestra.outputs({
          "discarded_samples_count": discarded_samples_count,
          "ingester_flush_failures_count": ingester_flush_failures_count,
          "querier_timeouts_count": querier_timeouts_count,
          "ingestion_rate_samples_sec": ingestion_rate_samples_sec,
          "active_series_count": active_series_count,
          "is_alerting": is_alerting,
          "audit_timestamp": audit_time
      })

  - id: evaluate_cortex_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Cortex sample discards or querier timeout counts breach telemetry SLA margins.
    condition: "{{ outputs.scan_cortex_cluster_metrics.vars.is_alerting and inputs.alert_on_cortex_failures }}"
    then:
      - id: notify_slack_telemetry_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Telemetry SRE channel detailing Cortex sample discards.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#telemetry-sre-alerts",
            "username": "Cortex Sentinel",
            "icon_emoji": ":warning:",
            "text": "*CRITICAL: Cortex Metric Sample Discards or Querier Timeouts Detected*\n*Tenant:* `{{ inputs.tenant_id }}`\n*Discarded Samples:* `{{ outputs.scan_cortex_cluster_metrics.vars.discarded_samples_count }}` (Threshold: `{{ inputs.max_discarded_samples_threshold }}`)\n*Flush Failures:* `{{ outputs.scan_cortex_cluster_metrics.vars.ingester_flush_failures_count }}`\n*Querier Timeouts:* `{{ outputs.scan_cortex_cluster_metrics.vars.querier_timeouts_count }}`\n*Active Series:* `{{ outputs.scan_cortex_cluster_metrics.vars.active_series_count }}`\n*Timestamp:* `{{ outputs.scan_cortex_cluster_metrics.vars.audit_timestamp }}`\n*Runbook:* Check tenant ingestion rate limits in runtime configuration, inspect S3 object storage chunk write latency, and review ingester ring health."
          }
    else:
      - id: log_nominal_cortex_state
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal telemetry when Cortex metrics ingestion and query evaluation proceed within healthy bounds.
        message: "NOMINAL: Cortex tenant {{ inputs.tenant_id }} healthy. Discarded samples: {{ outputs.scan_cortex_cluster_metrics.vars.discarded_samples_count }}, Flush failures: {{ outputs.scan_cortex_cluster_metrics.vars.ingester_flush_failures_count }}, Query timeouts: {{ outputs.scan_cortex_cluster_metrics.vars.querier_timeouts_count }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for metric storage infrastructure reliability archives and compliance records.
    format: |
      {
        "flow_id": "{{ flow.id }}",
        "tenant_id": "{{ inputs.tenant_id }}",
        "discarded_samples_count": {{ outputs.scan_cortex_cluster_metrics.vars.discarded_samples_count }},
        "ingester_flush_failures_count": {{ outputs.scan_cortex_cluster_metrics.vars.ingester_flush_failures_count }},
        "querier_timeouts_count": {{ outputs.scan_cortex_cluster_metrics.vars.querier_timeouts_count }},
        "ingestion_rate_samples_sec": {{ outputs.scan_cortex_cluster_metrics.vars.ingestion_rate_samples_sec }},
        "active_series_count": {{ outputs.scan_cortex_cluster_metrics.vars.active_series_count }},
        "is_alerting": {{ outputs.scan_cortex_cluster_metrics.vars.is_alerting }},
        "audit_timestamp": "{{ outputs.scan_cortex_cluster_metrics.vars.audit_timestamp }}"
      }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#telemetry-sre-alerts",
        "text": ":warning: *Cortex Sentinel Failure*: Failed to query metrics from `{{ inputs.cortex_metrics_url }}`."
      }

triggers:
  - id: periodic_cortex_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated Cortex metric storage health audit on a recurring 15-minute schedule.
    cron: "*/15 * * * *"

extend:
  title: Cortex Tenant Sample Discard and Querier Timeout Sentinel
  metaTitle: Cortex Tenant Sample Discard Sentinel Blueprint
  shortDescription: Audits Cortex telemetry to detect metric sample discards, ingester flush errors, and query timeouts.
  metaDescription: Scrapes Cortex Prometheus metrics to track sample discards, ingester chunk flush failures, and querier timeouts with Slack alerting.
  description: |
    Production-grade metric storage reliability watchdog that continuously monitors Cortex horizontally scalable Prometheus clusters. It tracks per-tenant sample discard rates caused by rate limits or out-of-order timestamps, detects ingester chunk flush failures to object storage (S3/GCS), identifies querier timeout surges, and dispatches structured Slack alerts before monitoring data gaps blind on-call engineers.

    ## How it works
    1. A recurring schedule trigger wakes the flow every 15 minutes to initiate Cortex cluster surveillance.
    2. A containerized Python script polls the Cortex distributor and querier Prometheus metrics endpoints.
    3. The script extracts discarded sample counters (`cortex_discarded_samples_total`) across active tenant partitions.
    4. The script monitors ingester chunk flush failure totals and querier HTTP 504 Gateway Timeout responses.
    5. A decision gate evaluates whether sample discards or querier timeouts exceed telemetry safety margins.
    6. When ingestion or query bottlenecks emerge, high-priority notifications dispatch to Telemetry SRE channels with runbooks.
    7. A structured audit manifest is emitted for enterprise compliance records and observability telemetry archives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: Every 15 Mins] --> B[scan_cortex_cluster_metrics]
        B --> C{evaluate_cortex_threshold}
        C -- Alert Triggered --> D[notify_slack_telemetry_team]
        C -- Nominal State --> E[log_nominal_cortex_state]
        D --> F[emit_audit_manifest]
        E --> F[emit_audit_manifest]
    ```

    ## Architecture components
    - **Trigger (`periodic_cortex_audit`)**: Recurring cron schedule executing every 15 minutes for proactive metrics surveillance.
    - **Scraper Task (`scan_cortex_cluster_metrics`)**: Docker-isolated Python script polling Cortex metrics with error handling.
    - **Decision Gate (`evaluate_cortex_threshold`)**: Evaluates discarded samples and querier timeouts against user thresholds.
    - **Notification Task (`notify_slack_telemetry_team`)**: Sends rich Slack alert with discard counts, flush errors, and runbooks.
    - **Compliance Manifest (`emit_audit_manifest`)**: Emits structured JSON summary for telemetry audit archives.

    ## Key capabilities
    - Continuous surveillance of time-series sample ingestion rates and discard reasons.
    - Early warning for tenant ingestion rate limit exhaustion before Prometheus agents fail.
    - Detection of object storage chunk flush stalls preventing ingester pod memory reclamation.
    - Standardized Slack alerting with operational runbook instructions for monitoring administrators.

    ## What you get
    - Real-time visibility into Cortex distributed metric storage health and tenant capacity headroom.
    - Protection against silent monitoring metric gaps during sudden telemetry volume surges.
    - Automated Slack incident notifications with sample discard counts and remediation advice.
    - Clean compliance manifests recording metric storage availability for SRE audit trails.

    ## Who it's for
    - Observability and Telemetry Platform Engineers managing multi-tenant Cortex clusters.
    - Site Reliability Engineers safeguarding centralized Prometheus metrics infrastructure.
    - Cloud Infrastructure Engineers operating large-scale Kubernetes monitoring pipelines.
    - DevOps Teams operating high-cardinality application telemetry and dashboard queries.

    ## Why orchestrate this with Kestra
    - **Decoupled Architecture**: Scrapes metrics externally without requiring root access to Cortex service pods.
    - **Deterministic Scheduling**: Native cron scheduling ensures consistent surveillance without cron daemon drift.
    - **Isolated Execution**: Runs Python scrapers inside isolated Docker containers with pre-installed libraries.
    - **Enterprise Auditability**: Generates structured execution histories and JSON manifests for regulatory reporting.

    ## Use cases
    - **Tenant Rate Limit Breaches**: Identify when a microservice starts emitting excess cardinality violating limits.
    - **Object Storage Outages**: Detect chunk upload failures when S3 or MinIO bucket access is throttled.
    - **Out-of-Order Timestamp Detection**: Catch misconfigured client agents sending stale metric timestamps.
    - **Ingester Ring Desynchronization**: Monitor hash ring member stability across ingester StatefulSet pods.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `cortex_metrics_url` | STRING | `http://cortex-distributor.monitoring.svc.cluster.local:8080` | Base HTTP URL exposing Cortex Prometheus metrics. |
    | `tenant_id` | STRING | `production-workloads` | Target Cortex multi-tenant organization identifier under surveillance. |
    | `max_discarded_samples_threshold` | INT | `100` | Maximum allowable discarded samples before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for telemetry metrics. |
    | `alert_on_cortex_failures` | BOOL | `true` | Toggle Slack alert dispatch upon detecting sample discards or timeouts. |

    ## Expected outputs
    - `{{ outputs.scan_cortex_cluster_metrics.vars.discarded_samples_count }}`: Cumulative count of discarded metric samples.
    - `{{ outputs.scan_cortex_cluster_metrics.vars.ingester_flush_failures_count }}`: Count of failed chunk flush attempts to object storage.
    - `{{ outputs.scan_cortex_cluster_metrics.vars.querier_timeouts_count }}`: Count of dashboard queries that timed out in lookback window.
    - `{{ outputs.scan_cortex_cluster_metrics.vars.ingestion_rate_samples_sec }}`: Observed per-second sample ingestion throughput.
    - `{{ outputs.scan_cortex_cluster_metrics.vars.is_alerting }}`: Boolean flag indicating whether failure thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Cortex cluster deployed with distributor, ingester, and querier services exposing Prometheus metrics.
    - Distributor metrics port 8080 reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Telemetry SRE Slack alerting channel.

    ## Quick start
    1. Ensure Cortex distributor service in `monitoring` namespace exposes port 8080.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your tenant identifier in `tenant_id`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_cortex_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Max Series Per Tenant Limit**: Exceeding `max_series_per_tenant` causes immediate 400 Bad Request drops.
    - **Ingester Out-of-Memory**: Stalled flushes to cloud storage cause ingester memory footprint to balloon.
    - **Querier Concurrency Limits**: High concurrent dashboard queries saturate `max_concurrent` querier pools.
    - **Tenant Header Injection**: If multi-tenancy is enforced, pass `X-Scope-OrgID` in scraper request headers.

    ## How to extend
    - **Automated Tenant Limit Scaling**: Trigger a sub-flow to dynamically raise tenant rate limits via runtime config.
    - **Ingester Ring Rebalance**: Chain an administrative API call to unregister unhealthy ingester ring instances.
    - **PagerDuty Escalation**: Escalate to on-call monitoring engineers if sample discards exceed 1,000 in 15 minutes.

