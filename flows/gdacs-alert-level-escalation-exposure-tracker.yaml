id: gdacs-alert-level-escalation-exposure-tracker
namespace: company.team

description: |
  Every three hours, ask GDACS (the UN/EU Global Disaster Alert and Coordination System) for the
  Orange and Red disaster events of the last two weeks in one request, keep each event's alert level
  and the watched countries it touches in a KV state, and post one Slack digest only when an event
  is new, escalates (Orange to Red) or spreads into another watched country. No API key.

inputs:
  - id: event_types
    type: MULTISELECT
    displayName: GDACS hazard types
    description: TC tropical cyclone, EQ earthquake, FL flood, VO volcano, DR drought, WF wildfire. Sent as one `eventlist` parameter.
    values:
      - TC
      - EQ
      - FL
      - VO
      - DR
      - WF
    defaults:
      - TC
      - EQ
      - FL
      - VO
      - DR

  - id: min_alert_level
    type: SELECT
    values:
      - Orange
      - Red
    defaults: Orange
    description: Lowest GDACS overall alert level to track. `Orange` asks for Orange and Red events.

  - id: watch_countries
    type: ARRAY
    itemType: STRING
    displayName: Watched countries (ISO3)
    description: ISO 3166 alpha-3 codes of the countries where you have people, suppliers or stock. An event is relevant when its main country or any affected country is in the list. Leave the list empty to track every country.
    defaults:
      - JPN
      - PHL
      - MEX
      - USA
      - DEU
      - KEN
      - BRA

  - id: lookback_days
    type: INT
    defaults: 14
    description: GDACS returns events active at any time in this window, so long droughts and floods stay in view.

  - id: state_key
    type: STRING
    defaults: gdacs_alert_state
    description: KV key holding the last known alert level per event. Use a different key per country list.

triggers:
  - id: every_3_hours
    type: io.kestra.plugin.core.trigger.Schedule
    description: GDACS recomputes cyclone alerts with every 6-hourly advisory and earthquake alerts within minutes, so a 3-hour cadence catches both.
    cron: "17 */3 * * *"

tasks:
  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    description: Last known alert score and watched countries per event. Missing on the first run, so every relevant event is reported once as NEW.
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: fetch_events
    type: io.kestra.plugin.core.http.Download
    description: |
      One request for all hazard types. `alertlevel` filters on the overall (peak) alert level of the event, `fromDate`
      and `toDate` select events active in the window, and `pageSize=100` is the API maximum. GDACS answers HTTP 204
      with an empty body when nothing matches, so `failOnEmptyResponse` is off and the SQL treats it as zero events.
    uri: https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH
    params:
      eventlist: "{{ inputs.event_types | join(';') }}"
      alertlevel: "{{ inputs.min_alert_level == 'Red' ? 'Red' : 'Orange;Red' }}"
      fromDate: "{{ now() | dateAdd(-inputs.lookback_days, 'DAYS') | date('yyyy-MM-dd') }}"
      toDate: "{{ now() | dateAdd(1, 'DAYS') | date('yyyy-MM-dd') }}"
      pageSize: "100"
    headers:
      Accept: application/json
      User-Agent: kestra-gdacs-alert-level-escalation-exposure-tracker/1.0 (https://kestra.io)
    failOnEmptyResponse: false
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempts: 4

  - id: compare
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Flattens the GeoJSON features, builds each event's country set from `iso3` plus `affectedcountries` (either can be
      empty on its own), keeps the events that touch a watched country, compares them with the KV state and writes the
      events CSV, the new state and the Slack digest.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles:
      events.json: "{{ outputs.fetch_events.uri }}"
      watch.json: "{{ inputs.watch_countries | toJson }}"
      state.json: "{{ (outputs.previous_state.value ?? []) | toJson }}"
    outputFiles:
      - events_csv
      - state_json
    sql: |
      SET TimeZone = 'UTC';

      CREATE TABLE watch AS
      SELECT list_distinct(list_transform(from_json(content, '["VARCHAR"]'), c -> upper(trim(c)))) AS codes
      FROM read_text('watch.json');

      -- HTTP 204 gives an empty file: read it as an empty FeatureCollection.
      CREATE TABLE features AS
      SELECT unnest(from_json(json_extract(coalesce(nullif(trim(content), ''), '{"features": []}'), '$.features'), '["JSON"]')) AS f
      FROM read_text('events.json');

      CREATE TABLE raw AS
      SELECT f ->> '$.properties.eventtype' AS event_type,
             CAST(f ->> '$.properties.eventid' AS BIGINT) AS event_id,
             CAST(f ->> '$.properties.episodeid' AS BIGINT) AS episode_id,
             f ->> '$.properties.eventname' AS event_name,
             f ->> '$.properties.country' AS country_text,
             f ->> '$.properties.alertlevel' AS alert_level,
             CAST(f ->> '$.properties.alertscore' AS DOUBLE) AS alert_score,
             f ->> '$.properties.episodealertlevel' AS episode_alert_level,
             f ->> '$.properties.istemporary' = 'true' AS is_temporary,
             f ->> '$.properties.iscurrent' = 'true' AS is_current,
             CAST(f ->> '$.properties.fromdate' AS TIMESTAMP) AS from_date,
             CAST(f ->> '$.properties.todate' AS TIMESTAMP) AS to_date,
             f ->> '$.properties.severitydata.severitytext' AS severity,
             f ->> '$.properties.url.report' AS report_url,
             list_filter(list_distinct(list_prepend(f ->> '$.properties.iso3',
               list_transform(coalesce(from_json(f -> '$.properties.affectedcountries', '[{"iso3": "VARCHAR"}]'), []), c -> c.iso3))),
               c -> c IS NOT NULL AND c <> '') AS countries
      FROM features;

      -- One row per event (the latest episode). Earthquakes and floods have no name, so build a label.
      CREATE TABLE events AS
      SELECT r.*,
             event_type || '|' || event_id AS event_key,
             CASE WHEN len(w.codes) = 0 THEN countries ELSE list_intersect(countries, w.codes) END AS watched_hits,
             coalesce(nullif(event_name, ''),
               CASE event_type WHEN 'EQ' THEN 'Earthquake' WHEN 'FL' THEN 'Flood' WHEN 'TC' THEN 'Tropical cyclone'
                    WHEN 'VO' THEN 'Volcano' WHEN 'DR' THEN 'Drought' WHEN 'WF' THEN 'Wildfire' ELSE event_type END
               || ' in ' || country_text) AS label
      FROM raw r, watch w
      QUALIFY row_number() OVER (PARTITION BY event_type, event_id ORDER BY episode_id DESC) = 1;

      CREATE TABLE state AS
      SELECT s ->> 'event_key' AS event_key, CAST(s ->> 'alert_score' AS DOUBLE) AS alert_score,
             s ->> 'alert_level' AS alert_level, from_json(s -> 'watched_hits', '["VARCHAR"]') AS watched_hits
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('state.json'));

      CREATE TABLE compared AS
      SELECT e.*, s.alert_level AS previous_level,
             list_filter(e.watched_hits, c -> NOT list_contains(coalesce(s.watched_hits, []), c)) AS new_countries,
             CASE WHEN len(e.watched_hits) = 0 THEN 'NOT_WATCHED'
                  WHEN s.event_key IS NULL THEN 'NEW'
                  WHEN e.alert_score > s.alert_score THEN 'ESCALATED'
                  WHEN e.alert_score < s.alert_score THEN 'DOWNGRADED'
                  WHEN len(list_filter(e.watched_hits, c -> NOT list_contains(s.watched_hits, c))) > 0 THEN 'NEW_COUNTRY'
                  ELSE 'UNCHANGED' END AS status
      FROM events e LEFT JOIN state s USING (event_key);

      COPY (
        SELECT status, event_type, event_id, episode_id, label, alert_level, previous_level, episode_alert_level,
               is_temporary, is_current, array_to_string(watched_hits, ' ') AS watched_countries,
               array_to_string(countries, ' ') AS all_countries, severity,
               strftime(from_date, '%Y-%m-%d') AS from_date, strftime(to_date, '%Y-%m-%d') AS to_date, report_url
        FROM compared ORDER BY alert_score DESC, to_date DESC
      ) TO '{{ outputFiles.events_csv }}' (HEADER true, DELIMITER ',');

      -- The state is simply every event in the current window, so events that leave the window drop out.
      COPY (
        SELECT event_key, alert_score, alert_level, watched_hits FROM compared ORDER BY event_key
      ) TO '{{ outputFiles.state_json }}' (FORMAT JSON, ARRAY true);

      WITH lines AS (
        SELECT alert_score, to_date,
               CASE status WHEN 'NEW' THEN '*NEW*' WHEN 'ESCALATED' THEN '*ESCALATED ' || previous_level || ' to ' || alert_level || '*'
                    ELSE '*NOW IN ' || array_to_string(new_countries, ', ') || '*' END
               || ' <' || report_url || '|' || label || '> (' || event_type || ', ' || alert_level || ')'
               || CASE WHEN episode_alert_level <> alert_level THEN ', latest episode ' || episode_alert_level || ' (peak ' || alert_level || ')' ELSE '' END
               || CASE WHEN is_temporary THEN ', preliminary alert' ELSE '' END
               || ', in ' || array_to_string(watched_hits[1:8], ' ') || CASE WHEN len(watched_hits) > 8 THEN ' +' || (len(watched_hits) - 8) || ' more' ELSE '' END
               || CASE WHEN coalesce(severity, '') <> '' THEN ', ' || severity ELSE '' END
               || ', ' || strftime(from_date, '%d %b %Y') || ' to ' || strftime(to_date, '%d %b %Y') AS line
        FROM compared WHERE status IN ('NEW', 'ESCALATED', 'NEW_COUNTRY')
      )
      SELECT
        (SELECT count(*) FROM features) AS features_returned,
        (SELECT coalesce(array_to_string(list_filter(codes, c -> NOT regexp_full_match(c, '[A-Z]{3}')), ', '), '') FROM watch) AS invalid_codes,
        (SELECT count(*) FROM events) AS events,
        (SELECT count(*) FROM events WHERE len(watched_hits) > 0) AS watched_events,
        (SELECT count(*) FROM state) AS state_events_before,
        (SELECT count(*) FROM state) = 0 AS is_first_run,
        (SELECT count(*) FROM compared WHERE status = 'NEW') AS new_events,
        (SELECT count(*) FROM compared WHERE status = 'ESCALATED') AS escalated,
        (SELECT count(*) FROM compared WHERE status = 'NEW_COUNTRY') AS new_country,
        (SELECT count(*) FROM compared WHERE status = 'DOWNGRADED') AS downgraded,
        (SELECT count(*) FROM compared WHERE status = 'UNCHANGED') AS unchanged,
        (SELECT count(*) FROM state WHERE event_key NOT IN (SELECT event_key FROM events)) AS dropped_from_window,
        (SELECT coalesce(string_agg(line, chr(10) ORDER BY alert_score DESC, to_date DESC), '') FROM lines) AS alert_text,
        -- A Slack section block holds at most 3,000 characters; the full list stays in the log and the CSV.
        (SELECT coalesce(left(string_agg(line, chr(10) ORDER BY alert_score DESC, to_date DESC), 2900), '') FROM lines) AS slack_text,
        (SELECT 'GDACS alerts for watched countries, ' || count(*) FILTER (WHERE status = 'NEW') || ' new, '
                || count(*) FILTER (WHERE status = 'ESCALATED') || ' escalated, '
                || count(*) FILTER (WHERE status = 'NEW_COUNTRY') || ' spread to another watched country'
                || CASE WHEN (SELECT count(*) FROM state) = 0 THEN ' (first run)' ELSE '' END FROM compared) AS headline;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    kvType: JSON
    value: "{{ read(outputs.compare.outputFiles.state_json) }}"

  - id: warn_page_cap
    type: io.kestra.plugin.core.log.Log
    description: 100 is the GDACS page maximum; reaching it means older events may be missing. Shorten `lookback_days` or narrow `event_types`.
    runIf: "{{ outputs.compare.outputs[0].row.features_returned >= 100 }}"
    level: WARN
    message: GDACS returned the 100-event page maximum; older events in the window may be missing.

  - id: warn_invalid_codes
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.compare.outputs[0].row.invalid_codes != '' }}"
    level: WARN
    message: "Ignored watch_countries entries that are not ISO 3166 alpha-3 codes: {{ outputs.compare.outputs[0].row.invalid_codes }}"

  - id: notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.compare.outputs[0].row.new_events + outputs.compare.outputs[0].row.escalated + outputs.compare.outputs[0].row.new_country) > 0 }}"
    then:
      - id: log_alerts
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.compare.outputs[0].row.alert_text }}"

      - id: slack_digest
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: allowFailure keeps the run green when `SLACK_WEBHOOK_URL` is not set; the same lines are in the WARN log and the CSV.
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": {{ outputs.compare.outputs[0].row.headline | toJson }},
            "blocks": [
              {"type": "section", "text": {"type": "mrkdwn", "text": {{ ('*' ~ outputs.compare.outputs[0].row.headline ~ '*') | toJson }}}},
              {"type": "section", "text": {"type": "mrkdwn", "text": {{ outputs.compare.outputs[0].row.slack_text | toJson }}}}
            ]
          }
    else:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No new, escalated or spreading GDACS events: {{ outputs.compare.outputs[0].row.unchanged }} unchanged, {{ outputs.compare.outputs[0].row.downgraded }} downgraded."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      GDACS returned {{ outputs.compare.outputs[0].row.events }} {{ inputs.min_alert_level }}+ events ({{ inputs.event_types | join(', ') }}, last {{ inputs.lookback_days }} days), {{ outputs.compare.outputs[0].row.watched_events }} touching watched countries.
      {{ outputs.compare.outputs[0].row.is_first_run ? 'First run, every watched event reported as NEW. ' : '' }}{{ outputs.compare.outputs[0].row.new_events }} new, {{ outputs.compare.outputs[0].row.escalated }} escalated, {{ outputs.compare.outputs[0].row.new_country }} spread to another watched country, {{ outputs.compare.outputs[0].row.downgraded }} downgraded, {{ outputs.compare.outputs[0].row.unchanged }} unchanged; {{ outputs.compare.outputs[0].row.dropped_from_window }} state entries left the window.

outputs:
  - id: events_csv
    type: FILE
    value: "{{ outputs.compare.outputFiles.events_csv }}"
  - id: run_summary
    type: JSON
    value: "{{ outputs.compare.outputs[0].row }}"

extend:
  title: GDACS Disaster Alert Escalation Tracker for Watched Countries
  metaTitle: GDACS Disaster Alert Escalation Tracker | Kestra
  shortDescription: Track Orange and Red GDACS disaster alerts for the countries you care about and get a Slack digest only when an event is new, escalates to Red or spreads to another watched country.
  metaDescription: Poll GDACS for Orange and Red cyclone, earthquake, flood, volcano and drought alerts, track levels in KV and post Slack only on new or escalated events.
  description: |
    Supply-chain, travel-security and humanitarian logistics teams watch GDACS (the Global Disaster Alert and Coordination System of the UN and the European Commission JRC) for alerts in the countries where they have staff, suppliers or stock. Nobody wants to refresh the website to spot that a typhoon went from Orange to Red. This flow asks the GDACS events API for Orange and Red events every three hours, keeps each event's last known level in KV and posts one Slack digest only when something changed for a watched country. No API key.

    ## How it works

    1. A Schedule trigger runs at minute 17 of every third hour.
    2. `previous_state` reads the last known alert score and watched countries per event from KV (missing on the first run).
    3. `fetch_events` makes one `geteventlist/SEARCH` request with `eventlist` (TC;EQ;FL;VO;DR), `alertlevel=Orange;Red`, a `fromDate`/`toDate` window and `pageSize=100` (the maximum). An empty result is HTTP 204, so `failOnEmptyResponse` is off.
    4. `compare` (DuckDB) flattens the GeoJSON, keeps the latest episode per event, builds the country set from `iso3` plus `affectedcountries` (either can be empty on its own), names unnamed earthquakes and floods ("Earthquake in Panama") and labels each event NEW, ESCALATED (e.g. Orange to Red), NEW_COUNTRY (now affects another watched country), DOWNGRADED, UNCHANGED or NOT_WATCHED. Green events are not fetched, so an event that first reaches Orange is NEW.
    5. `save_state` stores every event in the window, so events that leave the window drop out. WARN logs flag the 100-event page cap and invalid country codes.
    6. An `If` logs the alert lines at WARN and posts the Slack digest only when something is new, escalated or has spread.

    ## What you get

    - A Slack digest with linked GDACS reports, level, severity (wind, magnitude, drought area) and dates.
    - Honest levels: GDACS `alertlevel` is the event's peak, so a cyclone that was Red and is now weak says "latest episode Green (peak Red)". Preliminary alerts are marked.
    - An events CSV with every tracked event and its status, plus a `run_summary` output.
    - The first run reports every watched Orange/Red event once as NEW; after that only changes are posted.

    ## Who it's for

    - Supply-chain risk, travel-security and humanitarian logistics teams.
    - Insurance and business-continuity analysts.

    ## Why orchestrate this with Kestra

    - KV state means a re-run never re-posts an unchanged event; retries cover GDACS timeouts.
    - Countries, hazard types and threshold are inputs, so one flow serves several teams with separate state keys.

    ## Prerequisites

    - Outbound HTTPS to `www.gdacs.org`. No API key.
    - DuckDB and Slack plugins.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the digest (optional; without it the alerts stay in the WARN log and the CSV).

    ## Quick start

    1. Add `SLACK_WEBHOOK_URL` as a secret.
    2. Set `watch_countries` to your ISO3 codes, or leave it empty to track every country.
    3. Click **Execute**; a second run reports nothing new.
    4. Keep the schedule enabled.

    ## How to extend

    - Set `min_alert_level` to `Red` for an executive-only channel, with its own `state_key`.
    - Add `WF` (wildfires) to `event_types`, or shorten `lookback_days` if the page cap warning appears.
    - Join the CSV to a supplier master by ISO3 code to list the affected suppliers in the message.

    ## Links

    - [GDACS](https://www.gdacs.org/), the [GDACS API quickstart (PDF)](https://www.gdacs.org/Documents/2025/GDACS_API_quickstart_v1.pdf) and [Swagger reference](https://www.gdacs.org/gdacsapi/swagger/index.html)
    - [DuckDB Queries task](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [HTTP Download task](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
    - [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [Slack incoming webhook task](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
