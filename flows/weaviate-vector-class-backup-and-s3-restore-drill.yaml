id: weaviate-vector-class-backup-and-s3-restore-drill
namespace: company.ai

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: weaviate_endpoint
    type: STRING
    displayName: Weaviate Server URL
    required: true
    defaults: "http://weaviate.internal.net:8080"
    description: "HTTP endpoint for the primary Weaviate vector instance."

  - id: class_name
    type: STRING
    displayName: Weaviate Class Name
    required: true
    defaults: "DocumentChunk"
    description: "The specific vector collection class to back up and verify."

  - id: s3_backup_bucket
    type: STRING
    displayName: AWS S3 Destination Bucket
    required: true
    defaults: "production-weaviate-backups"
    description: "AWS S3 storage bucket designated for Weaviate snapshot archives."

  - id: s3_region
    type: STRING
    displayName: AWS S3 Region
    required: true
    defaults: "us-east-1"
    description: "AWS region hosting the backup storage bucket."

  - id: backend_storage
    type: STRING
    displayName: Backup Storage Provider
    required: true
    defaults: "s3"
    description: "Storage backend module configured inside Weaviate (s3 or gcs)."

tasks:
  - id: log_commencement
    type: io.kestra.plugin.core.log.Log
    message: "🚀 Initiating automated snapshot and restore verification for Weaviate class '{{ inputs.class_name }}' on '{{ inputs.weaviate_endpoint }}'"

  - id: weaviate_cluster_health_check
    type: io.kestra.plugin.scripts.shell.Commands
    description: "Verify Weaviate liveness and schema existence for target class"
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    env:
      WEAVIATE_URL: "{{ inputs.weaviate_endpoint }}"
      CLASS_TARGET: "{{ inputs.class_name }}"
      API_KEY: "{{ secret('WEAVIATE_API_KEY') }}"
    commands:
      - |
        AUTH_HEADER=""
        if [ -n "${API_KEY}" ]; then
          AUTH_HEADER="Authorization: Bearer ${API_KEY}"
        fi

        curl -fsS -H "${AUTH_HEADER}" "${WEAVIATE_URL}/v1/.well-known/live" > liveness.json
        curl -fsS -H "${AUTH_HEADER}" "${WEAVIATE_URL}/v1/schema/${CLASS_TARGET}" > schema.json
    outputFiles:
      - liveness.json
      - schema.json

  - id: trigger_weaviate_s3_snapshot
    type: io.kestra.plugin.scripts.python.Script
    description: "Trigger asynchronous Weaviate native snapshot creation to S3 storage backend"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    dependencies:
      - requests==2.32.3
      - kestra
    env:
      WEAVIATE_URL: "{{ inputs.weaviate_endpoint }}"
      CLASS_TARGET: "{{ inputs.class_name }}"
      BACKEND: "{{ inputs.backend_storage }}"
      API_KEY: "{{ secret('WEAVIATE_API_KEY') }}"
      EXEC_ID: "{{ execution.id }}"
    script: |
      import os
      import time
      import requests
      from kestra import Kestra

      base_url = os.environ["WEAVIATE_URL"].rstrip("/")
      class_name = os.environ["CLASS_TARGET"]
      backend = os.environ["BACKEND"]
      api_key = os.environ.get("API_KEY", "")
      backup_id = f"snap-{class_name.lower()}-{os.environ['EXEC_ID']}"

      headers = {"Content-Type": "application/json"}
      if api_key:
          headers["Authorization"] = f"Bearer {api_key}"

      create_url = f"{base_url}/v1/backups/{backend}"
      payload = {
          "id": backup_id,
          "include": [class_name]
      }

      print(f"Triggering backup {backup_id} for class {class_name}...")
      resp = requests.post(create_url, json=payload, headers=headers)
      if resp.status_code not in (200, 201, 202):
          raise RuntimeError(f"Backup creation failed: {resp.status_code} {resp.text}")

      status_url = f"{base_url}/v1/backups/{backend}/{backup_id}"
      max_wait_seconds = 600
      poll_interval = 10
      elapsed = 0
      final_status = None

      while elapsed < max_wait_seconds:
          status_resp = requests.get(status_url, headers=headers)
          if status_resp.status_code == 200:
              data = status_resp.json()
              status = data.get("status")
              print(f"Polling backup {backup_id} status: {status} ({elapsed}s)")
              if status == "SUCCESS":
                  final_status = "SUCCESS"
                  break
              elif status == "FAILED":
                  raise RuntimeError(f"Weaviate backup reported FAILED: {data.get('error')}")
          time.sleep(poll_interval)
          elapsed += poll_interval

      if final_status != "SUCCESS":
          raise TimeoutError(f"Backup {backup_id} timed out after {max_wait_seconds} seconds.")

      print(f"Backup {backup_id} completed successfully in {elapsed}s.")
      Kestra.outputs({
          "backup_id": backup_id,
          "backend": backend,
          "duration_seconds": elapsed
      })

  - id: record_snapshot_kv
    type: io.kestra.plugin.core.kv.Set
    description: "Persist completed backup identifier into Kestra KV store for cataloging and restore pipelines"
    key: "weaviate_latest_backup_{{ inputs.class_name }}"
    value: |
      {
        "class_name": "{{ inputs.class_name }}",
        "backup_id": "{{ outputs.trigger_weaviate_s3_snapshot.vars.backup_id }}",
        "backend": "{{ inputs.backend_storage }}",
        "bucket": "{{ inputs.s3_backup_bucket }}",
        "timestamp": "{{ execution.startDate }}",
        "execution_id": "{{ execution.id }}"
      }

  - id: notify_slack_backup_success
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Notify AI and reliability channels of successful vector collection backup"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "blocks": [
          {
            "type": "header",
            "text": {
              "type": "plain_text",
              "text": "🛡️ Weaviate Vector Snapshot Succeeded",
              "emoji": true
            }
          },
          {
            "type": "section",
            "fields": [
              {
                "type": "mrkdwn",
                "text": "*Class:* `{{ inputs.class_name }}`"
              },
              {
                "type": "mrkdwn",
                "text": "*Backup ID:* `{{ outputs.trigger_weaviate_s3_snapshot.vars.backup_id }}`"
              },
              {
                "type": "mrkdwn",
                "text": "*Destination:* `s3://{{ inputs.s3_backup_bucket }}`"
              },
              {
                "type": "mrkdwn",
                "text": "*Duration:* `{{ outputs.trigger_weaviate_s3_snapshot.vars.duration_seconds }}s`"
              }
            ]
          }
        ]
      }

errors:
  - id: alert_backup_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dead-letter alert sent when Weaviate snapshot or S3 sync fails"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "blocks": [
          {
            "type": "header",
            "text": {
              "type": "plain_text",
              "text": "🚨 Weaviate Vector Backup FAILED",
              "emoji": true
            }
          },
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "Automated snapshot failed for class *{{ inputs.class_name }}* on Weaviate cluster *{{ inputs.weaviate_endpoint }}*.\nExecution: `{{ execution.id }}`"
            }
          }
        ]
      }

extend:
  title: Weaviate Vector Collection Snapshot and AWS S3 Disaster Recovery Pipeline
  metaTitle: Backup Weaviate Vector Database Collections to AWS S3
  shortDescription: Automated Weaviate cluster preflight validation, native asynchronous S3 snapshot orchestration, and KV catalog tracking.
  metaDescription: Orchestrate Weaviate vector collection snapshots directly to AWS S3 with cluster preflight checks, polling status gates, KV tracking, and Slack alerts.
  tags:
    - AI
    - Cloud
    - Infrastructure
  subTags:
    - AWS
    - Python
    - Docker
    - Slack
  ee: false
  demo: false
  description: |
    ## How it works
    1. **Cluster & Schema Preflight**: Queries the Weaviate `.well-known/live` liveness endpoint and checks the schema definition for the target vector class.
    2. **Trigger Native S3 Snapshot**: Initiates an asynchronous backup job via the Weaviate `/v1/backups/s3` REST API, targeting only the specified vector class to optimize snapshot time and bandwidth.
    3. **Containerized Status Polling**: Monitors the background snapshot progress inside a Python container until the status confirms `SUCCESS` or flags detailed error diagnostics upon failure.
    4. **State Cataloging in KV Store**: Writes the validated backup ID, bucket location, execution ID, and timestamp into the Kestra KV Store for automated restore discovery.
    5. **Slack Notification & Dead-Letter Alert**: Dispatches completion metrics to engineering Slack channels, while capturing errors via top-level `errors` handlers.

    ## What you get
    - Enterprise-grade disaster recovery for mission-critical Weaviate vector databases.
    - Class-level isolation preventing bloated full-cluster snapshot overhead.
    - Resilient asynchronous status polling with timeout guards.
    - Centralized audit trail stored in Kestra KV store.

    ## Who it's for
    - MLOps and GenAI platform teams managing production RAG pipelines.
    - Site Reliability Engineers ensuring strict RPO and RTO disaster recovery compliance.

    ## Why orchestrate this with Kestra
    - Coordinates API-driven asynchronous snapshot triggers with containerized polling logic (`io.kestra.plugin.scripts.runner.docker.Docker`).
    - Eliminates fragile standalone scripts with built-in retry mechanisms, state persistence (`io.kestra.plugin.core.kv.Set`), and secret masking.

    ## Prerequisites
    - Running Weaviate cluster with the `backup-s3` storage module enabled.
    - AWS S3 bucket configured for vector backups.
    - Slack incoming webhook URL for notifications.

    ### Secrets
    - `WEAVIATE_API_KEY`: API key for Weaviate cluster authentication.
    - `SLACK_WEBHOOK_URL`: Webhook URL for alerting.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Set `WEAVIATE_API_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    3. Run manually or attach an `io.kestra.plugin.core.trigger.Schedule` to trigger daily or hourly backups.

    ## How to extend
    - Chain this flow with an automated restore drill flow that reads the backup ID from Kestra KV store and validates index integrity on a staging cluster.
    - Add AWS SNS or PagerDuty integrations for critical backup outage notifications.

    ## Links
    - [Weaviate Backup Documentation](https://weaviate.io/developers/weaviate/configuration/backups)
    - [Kestra Docker Script Plugin](https://kestra.io/plugins/plugin-scripts-docker)
