id: terraform-drift-detection-guard
namespace: company.team
description: |
  Detect Terraform drift on a schedule before it becomes an incident.
  The flow clones your infrastructure repo, runs `terraform plan` with
  detailed exit codes, and alerts Slack only when real drift is found —
  with the plan summary attached. Catches the classic "someone clicked
  in the console" changes that your next `apply` would otherwise silently
  revert or conflict with.

triggers:
  - id: daily_drift_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs daily at 06:00 UTC. Shipped disabled; enable after a first successful manual run.
    cron: "0 6 * * *"
    disabled: true

inputs:
  - id: git_url
    type: STRING
    description: HTTPS URL of the Terraform repository.
    defaults: https://github.com/company/infra.git
  - id: git_branch
    type: STRING
    defaults: main
    description: Branch to check for drift.
  - id: working_dir
    type: STRING
    defaults: terraform/prod
    description: Directory inside the repo containing the Terraform root module.
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region the Terraform code manages.

tasks:
  - id: drift_plan
    type: io.kestra.plugin.terraform.cli.TerraformCLI
    description: Clone the repo and run terraform plan with detailed exit codes (0 = no changes, 2 = drift).
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_REGION: "{{ inputs.aws_region }}"
    beforeCommands:
      - git clone --depth 1 --branch "{{ inputs.git_branch }}" "{{ inputs.git_url }}" infra-repo
    commands:
      - |
        cd infra-repo/{{ inputs.working_dir }}
        terraform init -input=false -no-color
        set +e
        terraform plan -detailed-exitcode -no-color -out=tfplan > plan.txt 2>&1
        CODE=$?
        set -e
        if [ "$CODE" -eq 2 ]; then
          echo "DRIFT_DETECTED"
          grep -E "^(Plan:|  #|  \+|  -|  ~)" plan.txt | head -n 60
        elif [ "$CODE" -eq 0 ]; then
          echo "NO_DRIFT"
        else
          echo "PLAN_FAILED"
          tail -n 40 plan.txt
          exit 1
        fi

  - id: decide_notification
    type: io.kestra.plugin.core.flow.If
    description: Alert on drift, stay quiet-ish when clean.
    condition: "{{ outputs.drift_plan.stdout contains 'DRIFT_DETECTED' }}"
    then:
      - id: notify_drift
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the drift summary to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: *Terraform drift detected* in `{{ inputs.git_url }}` (`{{ inputs.working_dir }}` @ `{{ inputs.git_branch }}`)\n```{{ outputs.drift_plan.stdout }}```"
          }
    else:
      - id: notify_clean
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Confirm no drift.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":white_check_mark: *Terraform drift check clean* — `{{ inputs.working_dir }}` matches the repo state."
          }

extend:
  title: Terraform Drift Detection Guard
  metaTitle: Detect Terraform Drift on a Schedule | Kestra
  shortDescription: Clone your infra repo daily, run terraform plan with detailed exit codes, and get a Slack alert with the plan excerpt only when real drift is found.
  metaDescription: Catch Terraform drift before it becomes an incident — scheduled plan runs with detailed exit codes and Slack alerts only on real changes.
  description: |
    Someone clicks in the AWS console "just this once", and three weeks later your next `terraform apply` wants to revert it — or worse, conflicts with it. Drift is the silent killer of infrastructure-as-code confidence. This blueprint runs `terraform plan` against your repo every day and tells you the moment reality diverges from code.

    ## How it works

    1. A Schedule trigger fires daily at 06:00 UTC (shipped disabled).
    2. The flow clones your infrastructure repo and runs `terraform init` plus `terraform plan -detailed-exitcode`, where exit code 2 means drift and 0 means clean.
    3. An `If` task routes on the result: a Slack alert with the plan excerpt on drift, a quiet confirmation when everything matches.

    ## What you get

    - Drift caught within 24 hours instead of at the next scary apply.
    - Alerts only on real changes — clean runs produce a single confirmation, not noise.
    - The plan excerpt in Slack, so you can judge severity without opening a terminal.
    - A daily record of infra-vs-code agreement for audits.

    ## Who it's for

    Platform and DevOps teams managing AWS (or any) infrastructure with Terraform who have been burned by console click-ops at least once.

    ## Why orchestrate this with Kestra

    Cron plus a shell script gives you an email nobody reads and logs nobody keeps. As a Kestra flow the plan output is captured per execution, failures notify the right channel, and the repo/branch/working-dir are inputs — the same flow guards every environment.

    ## Prerequisites

    - A Terraform repository reachable over HTTPS.
    - AWS credentials (or your provider's credentials) with read permissions for `terraform plan`, exported via env.
    - Terraform CLI available in the execution environment.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key used by the Terraform AWS provider during plan.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key used by the Terraform AWS provider during plan.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the drift alert.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `git_url`, `git_branch`, and `working_dir` to your Terraform root module.
    3. Run manually once and confirm the Slack message.
    4. Enable the daily schedule trigger.

    ## How to extend

    - Auto-create a Jira/GitHub issue when drift is detected, with the plan attached.
    - Post the plan as a PR comment when the drift originates from a proposed change.
    - Add `terraform validate` and `tflint` gates before the plan step.

    ## Links

    - [Kestra Terraform plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [Terraform plan -detailed-exitcode](https://developer.hashicorp.com/terraform/cli/commands/plan)
  tags:
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Monitoring & Alerting
  ee: false
  demo: false
