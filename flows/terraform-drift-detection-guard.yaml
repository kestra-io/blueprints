id: terraform-drift-detection-guard
namespace: company.team
description: |
  Detect Terraform drift daily and remediate it through a human approval gate.
  The flow clones your infra repo, runs terraform plan, tracks drift history in
  the KV store (escalating when drift is ignored), pauses for manual approval,
  applies the approved plan, and verifies the stack is clean — closing the loop
  instead of just sending an alert.

triggers:
  - id: daily_drift_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs daily at 06:00 UTC. Shipped disabled — run manually once, then enable.
    cron: "0 6 * * *"
    disabled: true

inputs:
  - id: git_url
    type: STRING
    description: HTTPS URL of the Terraform repository.
    defaults: https://github.com/company/infra.git
  - id: git_branch
    type: STRING
    description: Branch to check for drift.
    defaults: main
  - id: working_dir
    type: STRING
    description: Directory inside the repo containing the Terraform root module.
    defaults: terraform/prod
  - id: aws_region
    type: STRING
    description: AWS region the Terraform code manages.
    defaults: us-east-1
  - id: state_key
    type: STRING
    description: KV-store key holding this stack's drift history. Change it when one namespace guards several stacks.
    defaults: terraform-drift-guard
  - id: approval_timeout
    type: STRING
    description: ISO-8601 duration the remediation approval stays open before the run moves on (drift stays unremediated).
    defaults: P1D
  - id: escalate_after
    type: INT
    description: Consecutive drift days after which the Slack alert escalates.
    defaults: 3

tasks:
  - id: guard
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Shared workspace so clone, plan, approval, apply and verify all operate on the same checkout and plan file.
    tasks:
      - id: clone
        type: io.kestra.plugin.git.Clone
        description: Shallow-clone the infrastructure repository.
        url: "{{ inputs.git_url }}"
        branch: "{{ inputs.git_branch }}"

      - id: plan
        type: io.kestra.plugin.terraform.cli.TerraformCLI
        description: Init and plan with detailed exit codes (0 = clean, 2 = drift); saves the plan file for the approval gate.
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_REGION: "{{ inputs.aws_region }}"
        commands:
          - |
            cd "{{ inputs.working_dir }}"
            terraform init -input=false -no-color > /dev/null
            set +e
            terraform plan -detailed-exitcode -no-color -out=tfplan > plan.txt 2>&1
            CODE=$?
            set -e
            SUMMARY=$(grep -E "^Plan:" plan.txt | tail -n 1)
            DESTROYS=$(echo "$SUMMARY" | grep -oE "[0-9]+ to destroy" | grep -oE "[0-9]+" || true)
            if [ "$CODE" -eq 2 ]; then
              echo "DRIFT_DETECTED"
              echo "PLAN_SUMMARY: ${SUMMARY:-unknown}"
              if [ -n "$DESTROYS" ] && [ "$DESTROYS" != "0" ]; then echo "SEVERITY: HIGH - destroys planned"; else echo "SEVERITY: MEDIUM - no destroys"; fi
              grep -E "^  # " plan.txt | head -n 40
            elif [ "$CODE" -eq 0 ]; then
              echo "NO_DRIFT"
            else
              echo "PLAN_FAILED"
              tail -n 40 plan.txt
              exit 1
            fi

      - id: load_state
        type: io.kestra.plugin.core.kv.Get
        description: Load this stack's drift history (absent on the very first run).
        key: "{{ inputs.state_key }}"

      - id: route
        type: io.kestra.plugin.core.flow.If
        description: Drift goes through alert, approval, remediate and verify; clean runs just reset the history.
        condition: "{{ outputs.plan.stdout contains 'DRIFT_DETECTED' }}"
        then:
          - id: record_drift
            type: io.kestra.plugin.core.kv.Set
            description: Bump the consecutive-drift counter and stamp this run.
            key: "{{ inputs.state_key }}"
            kvType: JSON
            value: |
              {"consecutive_drift_runs": {{ (outputs.load_state.value.consecutive_drift_runs ?? 0) + 1 }}, "last_drift_at": "{{ execution.startDate }}", "last_clean_at": "{{ outputs.load_state.value.last_clean_at ?? '' }}", "last_remediated_at": "{{ outputs.load_state.value.last_remediated_at ?? '' }}"}

          - id: notify_drift
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Alert with the plan summary and an approval CTA; escalates when drift has been ignored for days.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":warning: *Terraform drift detected* in `{{ inputs.git_url }}` (`{{ inputs.working_dir }}` @ `{{ inputs.git_branch }}`)\n```{{ outputs.plan.stdout }}```\n*Consecutive drift runs:* {{ (outputs.load_state.value.consecutive_drift_runs ?? 0) + 1 }}{% if ((outputs.load_state.value.consecutive_drift_runs ?? 0) + 1) >= inputs.escalate_after %} — :rotating_light: drift ignored {{ (outputs.load_state.value.consecutive_drift_runs ?? 0) + 1 }} runs in a row{% endif %}\nReview the plan above, then approve or deny remediation in the Kestra UI."
              }

          - id: remediation_approval
            type: io.kestra.plugin.core.flow.Pause
            description: Human gate — approve to apply the saved plan, deny (or let it time out) to leave the drift in place.
            pauseDuration: "{{ inputs.approval_timeout }}"
            behavior: WARN
            onResume:
              - id: decision
                type: SELECT
                values:
                  - approve
                  - deny
                defaults: deny
                description: Approve runs terraform apply with the saved plan; deny leaves everything untouched.
              - id: reviewer_note
                type: STRING
                defaults: ""
                description: Note stored with the execution for the audit trail.

          - id: approval_gate
            type: io.kestra.plugin.core.flow.If
            description: Remediate only on an explicit approval; anything else defers gracefully.
            condition: "{{ (outputs.remediation_approval.onResume is defined) and (outputs.remediation_approval.onResume.decision == 'approve') }}"
            then:
              - id: apply_plan
                type: io.kestra.plugin.terraform.cli.TerraformCLI
                description: Apply the exact plan the approver reviewed.
                env:
                  AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
                  AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
                  AWS_REGION: "{{ inputs.aws_region }}"
                commands:
                  - |
                    cd "{{ inputs.working_dir }}"
                    set -o pipefail
                    terraform apply -input=false -no-color tfplan 2>&1 | tail -n 30

              - id: verify_clean
                type: io.kestra.plugin.terraform.cli.TerraformCLI
                description: Re-plan to confirm the apply actually converged the stack.
                env:
                  AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
                  AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
                  AWS_REGION: "{{ inputs.aws_region }}"
                commands:
                  - |
                    cd "{{ inputs.working_dir }}"
                    set +e
                    terraform plan -detailed-exitcode -no-color > verify.txt 2>&1
                    CODE=$?
                    set -e
                    if [ "$CODE" -eq 0 ]; then
                      echo "VERIFY_CLEAN"
                    else
                      echo "VERIFY_STILL_DRIFTED"
                      tail -n 20 verify.txt
                    fi

              - id: remediation_outcome
                type: io.kestra.plugin.core.flow.If
                description: Close the loop in the KV store, and report honestly when the apply did not fully converge.
                condition: "{{ outputs.verify_clean.stdout contains 'VERIFY_CLEAN' }}"
                then:
                  - id: record_remediated
                    type: io.kestra.plugin.core.kv.Set
                    description: Reset the drift counter and stamp the remediation.
                    key: "{{ inputs.state_key }}"
                    kvType: JSON
                    value: |
                      {"consecutive_drift_runs": 0, "last_drift_at": "{{ outputs.load_state.value.last_drift_at ?? '' }}", "last_clean_at": "{{ outputs.load_state.value.last_clean_at ?? '' }}", "last_remediated_at": "{{ execution.startDate }}"}
                  - id: notify_remediated
                    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                    description: Confirm the stack is back in sync.
                    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                    payload: |
                      {
                        "text": ":white_check_mark: *Drift remediated* — `{{ inputs.working_dir }}` @ `{{ inputs.git_branch }}` applied and verified clean.\nReviewer note: {{ outputs.remediation_approval.onResume.reviewer_note ?? 'no note' }}"
                      }
                else:
                  - id: notify_still_drifted
                    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                    description: The apply ran but the stack did not converge — needs a human look.
                    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                    payload: |
                      {
                        "text": ":rotating_light: *Apply completed but drift remains* in `{{ inputs.working_dir }}` — the post-apply plan is not clean. Someone needs to investigate; see the execution logs."
                      }
            else:
              - id: log_deferred
                type: io.kestra.plugin.core.log.Log
                description: Drift stays in place — the next scheduled run will catch it again with a higher consecutive count.
                message: "Remediation not approved ({{ outputs.remediation_approval.onResume.decision ?? 'approval timed out' }}). Drift remains; state kept for escalation."
              - id: notify_deferred
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                description: Record that remediation was deferred.
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                payload: |
                  {
                    "text": ":zzz: *Drift remediation deferred* for `{{ inputs.working_dir }}` ({{ outputs.remediation_approval.onResume.decision ?? 'approval timed out' }}). The drift is still there and will be re-checked on the next run."
                  }
        else:
          - id: record_clean
            type: io.kestra.plugin.core.kv.Set
            description: Reset the drift counter and stamp the clean run.
            key: "{{ inputs.state_key }}"
            kvType: JSON
            value: |
              {"consecutive_drift_runs": 0, "last_drift_at": "{{ outputs.load_state.value.last_drift_at ?? '' }}", "last_clean_at": "{{ execution.startDate }}", "last_remediated_at": "{{ outputs.load_state.value.last_remediated_at ?? '' }}"}
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            description: Quiet confirmation for clean runs.
            message: "Drift check clean — {{ inputs.working_dir }} matches the repo state."

extend:
  title: Terraform Drift Detection Guard
  metaTitle: Terraform Drift Detection with Approval-Gated Remediation | Kestra
  shortDescription: Detect Terraform drift daily, alert on Slack with the plan summary, and remediate through a human approval gate — with KV-tracked drift history and escalation.
  metaDescription: Daily Terraform drift detection with Slack alerts, a human approval gate for remediation, and KV-tracked drift history with escalation.
  description: |
    Someone clicks in the AWS console "just this once", and weeks later your next `terraform apply` tries to revert it — or conflicts with it. This blueprint tracks drift across runs, asks a human before touching anything, applies the approved plan, and verifies the stack converged.

    ## How it works

    1. A Schedule trigger fires daily at 06:00 UTC (shipped disabled — run it manually first).
    2. The flow clones your infra repo and runs `terraform plan -detailed-exitcode -out=tfplan`: exit 2 means drift, 0 means clean, anything else fails loudly.
    3. Drift history loads from the KV store (per stack, configurable key); the consecutive counter bumps on drift and resets on clean.
    4. Slack gets the plan summary with severity, and the alert escalates once drift has been ignored for several runs in a row.
    5. A Pause task opens a human approval gate (24h default). On approval the saved plan is applied and a fresh plan verifies it; deny or expiry leaves the drift alone.
    6. KV history is updated and Slack gets the outcome — including an honest alert if the apply ran but drift remains.

    ## What you get

    - Drift caught within 24 hours, plan excerpt in Slack, no terminal needed to judge severity.
    - Remediation that never runs without a human: explicit approval with an audit note.
    - State across runs: consecutive-drift tracking with escalation and audit timestamps.
    - Verify-after-apply, so a half-converged apply can't silently pass.
    - Graceful deferral: denied or expired approvals keep the drift for the next run.

    ## Who it's for

    Platform and DevOps teams burned by console click-ops who want drift remediation with a human in the loop.

    ## Why orchestrate this with Kestra

    Cron plus a shell script detects drift but can't pause for a human, remember yesterday, or verify its own fix. As a Kestra flow, plan, approval and history live in one auditable lineage.

    ## Prerequisites

    - Terraform repo over HTTPS with a remote backend (plan and apply share state).
    - AWS credentials with plan and apply permissions, Terraform CLI, and a Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY`: used by the Terraform AWS provider.
    - `SLACK_WEBHOOK_URL`: drift alerts, approval requests and outcome notifications.

    ## Quick start

    1. Add the three secrets to your Kestra namespace.
    2. Set `git_url`, `git_branch` and `working_dir` to your Terraform root module.
    3. Run once manually: check the plan, test the approval gate, review Slack.
    4. Enable the daily schedule trigger.

    ## How to extend

    - Auto-create a Jira or GitHub issue on drift with the plan attached.
    - Route approvals to a Slack channel or on-call schedule instead of the Kestra UI.
    - Add `tflint`/Checkov gates before plan, or an OPA check on the plan JSON.

    ## Links

    - [Terraform plugin documentation](https://kestra.io/plugins/plugin-terraform)
    - [Pause task (human approvals)](https://kestra.io/docs/workflow-components/flowable#pause)
    - [KV store](https://kestra.io/docs/concepts/kv-store)
  tags:
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Approval Gates
    - Monitoring & Alerting
  ee: false
  demo: false
