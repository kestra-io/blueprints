id: apigateway-unused-finder
namespace: company.finops

description: |
  Finds API Gateway APIs with zero invocations. Dead REST and HTTP APIs from
  retired services keep stages, custom domains, and usage plans configured —
  and every deploy risk grows with the APIs nobody remembers. This flow checks
  30 days of CloudWatch invocations per API across your regions.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for unused API Gateway APIs.
  - id: traffic_window_days
    type: INT
    defaults: 30
    description: Lookback window in days for the invocation check.

tasks:
  - id: find_unused
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit API Gateway APIs region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List REST and HTTP APIs and check 30-day invocation counts.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            DAYS={{ inputs.traffic_window_days }}
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
            PERIOD=$((DAYS * 86400))
            echo "Checking API Gateway APIs in $REGION (window: last $DAYS days)"
            aws apigateway get-rest-apis --region "$REGION" \
              --query 'items[].[id,name]' --output text > /tmp/apis.txt || true
            aws apigatewayv2 get-apis --region "$REGION" \
              --query 'Items[].[ApiId,Name]' --output text > /tmp/apis2.txt || true
            IDLE_COUNT=0
            IDLE_LIST=""
            while read -r APIID NAME; do
              [ -z "$APIID" ] && continue
              COUNT=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/ApiGateway \
                --metric-name Count \
                --dimensions Name=ApiName,Value="$NAME" \
                --start-time "$START" --end-time "$END" \
                --period "$PERIOD" --statistics Sum \
                --query 'Datapoints[0].Sum' --output text 2>/dev/null)
              case "$COUNT" in ''|'None') COUNT=0;; esac
              COUNT_INT=${COUNT%.*}
              echo "rest api $NAME ($APIID): ${COUNT_INT} invocations in ${DAYS}d"
              if [ "$COUNT_INT" -eq 0 ]; then
                IDLE_LIST="${IDLE_LIST}${NAME} (rest:$APIID), "
                IDLE_COUNT=$((IDLE_COUNT + 1))
              fi
            done < /tmp/apis.txt
            while read -r APIID NAME; do
              [ -z "$APIID" ] && continue
              COUNT=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/ApiGateway \
                --metric-name Count \
                --dimensions Name=ApiId,Value="$APIID" \
                --start-time "$START" --end-time "$END" \
                --period "$PERIOD" --statistics Sum \
                --query 'Datapoints[0].Sum' --output text 2>/dev/null)
              case "$COUNT" in ''|'None') COUNT=0;; esac
              COUNT_INT=${COUNT%.*}
              echo "http api $NAME ($APIID): ${COUNT_INT} invocations in ${DAYS}d"
              if [ "$COUNT_INT" -eq 0 ]; then
                IDLE_LIST="${IDLE_LIST}${NAME} (http:$APIID), "
                IDLE_COUNT=$((IDLE_COUNT + 1))
              fi
            done < /tmp/apis2.txt
            if [ "$IDLE_COUNT" -gt 0 ]; then HAS_IDLE=true; else HAS_IDLE=false; fi
            echo "HAS_IDLE=$HAS_IDLE"
            echo "IDLE_COUNT=$IDLE_COUNT"
            echo "IDLE_APIS=$IDLE_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report idle APIs for decommission review.
        condition: "{{ outputs.audit_region.vars.HAS_IDLE == 'true' }}"
        then:
          - id: slack_idle
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":broom: Unused API Gateway APIs in `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.IDLE_COUNT }}* with zero invocations in 30 days.\n`{{ outputs.audit_region.vars.IDLE_APIS }}`\nReview stages and custom domains before deleting — dead APIs are a deploy-risk and an attack surface."
              }
        else:
          - id: log_busy
            type: io.kestra.plugin.core.log.Log
            message: "No unused API Gateway APIs in {{ outputs.audit_region.vars.REGION_DONE }} — every API was invoked in the window."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: Unused API Gateway Finder
  metaTitle: Find Dead API Gateway APIs | Kestra
  shortDescription: Audit REST and HTTP APIs across regions, check 30 days of CloudWatch invocations per API, and get a Slack report of the dead ones ready for decommission.
  metaDescription: Dead APIs are a deploy risk and attack surface. This flow finds zero-invocation APIs across regions and reports them weekly.
  description: |
    Every retired microservice leaves its API Gateway behind — stages, custom domains, usage plans, and all. Dead APIs don't just clutter the console: they're an attack surface nobody monitors and a deploy risk nobody remembers. This blueprint finds them with real invocation data.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists REST APIs (v1) and HTTP APIs (v2), then pulls the full-window `Count` CloudWatch metric per API.
    4. APIs with zero invocations in the window are flagged dead.
    5. An `If` task posts a Slack report with the dead API names only when something is actually unused.

    ## What you get

    - A weekly list of APIs with zero invocations, split by REST and HTTP.
    - A smaller attack surface — dead APIs stop being forgotten endpoints.
    - Multi-region coverage in one run, covering both API Gateway generations.
    - Silence when every API is live — alerts only on real findings.

    ## Who it's for

    Platform engineers running microservices on API Gateway, where retired services outlive their APIs.

    ## Why orchestrate this with Kestra

    A one-off CLI session finds today's dead APIs and is forgotten by next month. As a scheduled Kestra flow the audit runs itself, the window is an input anyone can tune, every run is logged for audit, and adding a region is one list entry — not a new script.

    ## Prerequisites

    - AWS credentials with `apigateway:GET`, `apigatewayv2` read, and `cloudwatch:GetMetricStatistics` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the API Gateway and CloudWatch calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the API Gateway and CloudWatch calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the decommission report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions you run APIs in.
    3. Run manually once and review the Slack report (or the clean log line).
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Check custom domain mappings before flagging, to avoid noise from domain-level routing.
    - Exclude APIs tagged `Keep=true` for known standby setups.
    - Add 4xx/5xx error-rate checks to also catch APIs that are "alive" but broken.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [API Gateway metrics](https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-metrics-and-dimensions.html)
    - [API Gateway get-rest-apis API](https://docs.aws.amazon.com/cli/latest/reference/apigateway/get-rest-apis.html)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
