id: sonilo-generation-health-gate
namespace: company.team
description: |
  Submit a music generation job to the Sonilo API on a schedule, wait
  for it to finish, classify the returned status as COMPLETED,
  FAILED, UNKNOWN, or UNREACHABLE, log clean generations, and alert
  Slack the moment a job fails or the API cannot be reached.

inputs:
  - id: music_prompt
    type: STRING
    defaults: "Warm analog synths under a quiet piano"
    displayName: "Music Prompt"
    description: "Text prompt describing the music to generate, up to Sonilo's documented 2000-character practical limit."
  - id: generation_duration_seconds
    type: INT
    defaults: 30
    displayName: "Duration (Seconds)"
    description: "Requested length of the generated audio, 5 to 360 seconds."
  - id: output_format
    type: SELECT
    defaults: "wav"
    values:
      - "m4a"
      - "wav"
      - "mp3"
    displayName: "Output Format"
    description: "Audio container for the generated file. wav and mp3 require Sonilo's async mode, which the task selects automatically."

triggers:
  - id: sonilo_health_gate_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Run a canary generation and classify its health every 6 hours."
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      music_prompt: "Warm analog synths under a quiet piano"
      generation_duration_seconds: 30
      output_format: "wav"

tasks:
  - id: generate_music
    type: io.kestra.plugin.sonilo.GenerateMusicFromText
    description: "Submit a text-to-music generation job to Sonilo and wait for it to reach a terminal state (wav/mp3 output forces async mode with internal polling)."
    apiToken: "{{ secret('SONILO_API_TOKEN') }}"
    prompt: "{{ inputs.music_prompt }}"
    duration: "{{ inputs.generation_duration_seconds }}"
    outputFormat: "{{ inputs.output_format }}"
    allowFailure: true

  - id: classify_generation_status
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when no status was returned, COMPLETED when status is succeeded/completed/success, FAILED when status is failed/canceled/cancelled/error, otherwise UNKNOWN. These are Sonilo's own normalized terminal status values."
    format: "{{ outputs.generate_music.status is defined ? ((outputs.generate_music.status == 'succeeded' or outputs.generate_music.status == 'completed' or outputs.generate_music.status == 'success') ? 'COMPLETED' : ((outputs.generate_music.status == 'failed' or outputs.generate_music.status == 'canceled' or outputs.generate_music.status == 'cancelled' or outputs.generate_music.status == 'error') ? 'FAILED' : 'UNKNOWN')) : 'UNREACHABLE' }}"

  - id: route_by_generation_status
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation when generation completed, page Slack when it failed, or page Slack when the API could not be reached."
    value: "{{ outputs.classify_generation_status.value }}"
    cases:
      "COMPLETED":
        - id: log_completed
          type: io.kestra.plugin.core.log.Log
          message: "Sonilo generation completed, task {{ outputs.generate_music.taskId }}, status {{ outputs.generate_music.status }}."
      "FAILED":
        - id: alert_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Sonilo sentinel FAILED: generation task {{ outputs.generate_music.taskId }} ended with status {{ outputs.generate_music.status }} for prompt \"{{ inputs.music_prompt }}\". Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Sonilo sentinel UNREACHABLE: no status was returned for the canary generation (invalid API token, platform outage, or wait timed out). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unknown_status
        type: io.kestra.plugin.core.log.Log
        message: "Completed Sonilo health check with an unrecognized status: {{ outputs.generate_music.status }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit status line recorded on every run regardless of branch, for a continuous generation-health trend in the execution history."
    message: "Sonilo health audit: prompt={{ inputs.music_prompt }}, format={{ inputs.output_format }}, taskId={{ outputs.generate_music.taskId }}, status={{ outputs.classify_generation_status.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the health gate flow itself fails, so a broken check never silently stops monitoring Sonilo generation health."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Sonilo generation health gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). Generation health is now unknown; check the task logs and the Sonilo API manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_generation_status.value }}"

extend:
  title: "Sonilo Generation Health Gate"
  metaTitle: Sonilo Generation Health Gate for Kestra
  shortDescription: Submit a canary generation job to the Sonilo API on a schedule, classify its terminal status, and alert Slack when generation fails or the API is unreachable.
  metaDescription: Gate Sonilo music generation jobs on their terminal status and alert Slack when a job fails or the API cannot be reached.
  description: |
    A generative media pipeline that silently swallows a failed Sonilo job looks the same as one that succeeded, until a downstream video or podcast assembly step opens an empty audio file. This blueprint submits a canary text-to-music generation on a schedule, waits for Sonilo's own terminal status, and pages Slack the moment a job fails or the API itself cannot be reached, instead of letting a bad generation flow downstream unnoticed.

    ## How it works

    1. `generate_music` (`io.kestra.plugin.sonilo.GenerateMusicFromText`) submits `music_prompt` for `generation_duration_seconds` in `output_format`, which forces Sonilo's async mode and internal polling for `wav`/`mp3`. `allowFailure: true` means a connection or authentication failure still lets the flow continue instead of aborting.
    2. `classify_generation_status` (`io.kestra.plugin.core.debug.Return`) checks whether `outputs.generate_music.status` is defined; if not, `UNREACHABLE`. Otherwise it matches the status against Sonilo's own normalized terminal values (`succeeded`/`completed`/`success` for `COMPLETED`, `failed`/`canceled`/`cancelled`/`error` for `FAILED`), falling back to `UNKNOWN` for anything else.
    3. `route_by_generation_status` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `COMPLETED` logs a quiet confirmation, `FAILED` pages Slack with the task id and prompt, `UNREACHABLE` pages Slack separately, and `defaults` logs the raw unrecognized status.
    4. `log_audit_status` records a status line on every run regardless of branch, so the execution history is a continuous generation-health trend.
    5. The `errors` block pages Slack separately if the flow itself fails outright.
    6. The `sonilo_health_gate_schedule` trigger polls every 6 hours with explicit input overrides, shipped `disabled: true` until you add a real API token.

    ## What you get

    - A scheduled canary check for a generative media API with zero custom polling code; the task itself waits for the job.
    - A four-way `status` output (`COMPLETED` / `FAILED` / `UNKNOWN` / `UNREACHABLE`) you can chart or gate other flows on.
    - A Slack page naming the exact task id and status behind a failed generation.
    - A separate failure channel for the gate flow itself, plus a standing audit log line per run.

    ## Who it's for

    - Media and content pipeline teams who generate background music or sound effects with Sonilo as one step in a larger automated production flow.
    - Platform teams who want a generation-health signal before wiring Sonilo output into a downstream video, podcast, or ad-creative assembly step.

    ## Why orchestrate this with Kestra

    Calling the Sonilo API from a script tells you one job's outcome once. This flow keeps every canary check in the execution history, turns the result into a typed output other flows can depend on, and gives you a Switch branch to grow into real remediation (retrying with a simpler prompt, falling back to a stock audio bed, opening a ticket) without rewriting the check itself.

    ## Prerequisites

    - A Sonilo Platform API token, created at [platform.sonilo.com](https://platform.sonilo.com). Sonilo has no cancel endpoint, so a killed task's remote generation can continue and can still be billed; this blueprint uses a short `generation_duration_seconds` to keep canary runs cheap. No self-hostable open-source Docker image exists for Sonilo, so test this blueprint directly against the live API.
    - A Slack incoming webhook for the failed and unreachable alerts.

    ### Secrets

    - `SONILO_API_TOKEN`: Sonilo Platform API token, sent as `Authorization: Bearer`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the failed alert, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_SONILO_API_TOKEN` and `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-api-token>" | base64` and `echo -n "<your-webhook-url>" | base64`.

    ## Quick start

    1. Add the `SONILO_API_TOKEN` and `SLACK_WEBHOOK_URL` secrets.
    2. Leave `music_prompt`, `generation_duration_seconds`, and `output_format` at their defaults for a cheap canary run, or set your own.
    3. Run the flow once and confirm `status` reads `COMPLETED`.
    4. Enable `sonilo_health_gate_schedule`.

    ## How to extend

    - Download and inspect `outputs.generate_music.audioUri` (switch `fetchType` logic or add a follow-up task) to verify the generated file is non-empty, not just that the API reported success.
    - Track generation latency between submission and completion in a KV store to alert on slow-but-successful jobs, not only failures.
    - Fan the canary out across several prompts or output formats with a `Loop` task to catch format-specific regressions.

    ## Links

    - [Sonilo API](https://sonilo.com/)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Data
    - Business
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
