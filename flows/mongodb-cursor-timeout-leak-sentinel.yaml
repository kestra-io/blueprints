id: mongodb-cursor-timeout-leak-sentinel
namespace: company.database

inputs:
  - id: mongo_uri
    type: STRING
    defaults: "mongodb://mongo.internal:27017"
    description: MongoDB connection URI string.
  - id: max_timed_out_cursors
    type: INT
    defaults: 10
    description: Maximum acceptable count of abandoned timed-out cursors over operational window.

tasks:
  - id: audit_cursor_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: mongo:latest
    commands:
      - |
        mongosh --quiet "{{ inputs.mongo_uri }}" --eval '
          const s = db.serverStatus();
          const cursors = s.metrics && s.metrics.cursor ? s.metrics.cursor : { open: { total: 0 }, timedOut: 0 };
          print(JSON.stringify({
            open_cursors: cursors.open ? cursors.open.total : 0,
            timed_out_cursors: cursors.timedOut || 0
          }));
        ' > /tmp/mongo_cursors.json
        
        TIMED_OUT=$(jq '.timed_out_cursors // 0' /tmp/mongo_cursors.json)
        OPEN_CURSORS=$(jq '.open_cursors // 0' /tmp/mongo_cursors.json)
        
        echo "::set-output name=timed_out::$TIMED_OUT::"
        echo "::set-output name=open_cursors::$OPEN_CURSORS::"

  - id: evaluate_cursor_leaks
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_cursor_metrics.vars.timed_out | int > inputs.max_timed_out_cursors }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ MongoDB Cursor Timeout and Memory Leak Alert",
                "text": "Detected *{{ outputs.audit_cursor_metrics.vars.timed_out }}* timed-out MongoDB cursors (currently open cursors: {{ outputs.audit_cursor_metrics.vars.open_cursors }}). Impact: Application code is opening queries with `noCursorTimeout` or failing to close iterate streams, retaining server RAM buffers indefinitely.",
                "footer": "Kestra Database Sentinel • MongoDB Cursors"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MongoDB Cursor Sentinel Execution Failed",
            "text": "The MongoDB cursor metrics query failed. Please verify MongoDB connection URI and host reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  title: MongoDB Cursor Timeout and Server Memory Leak Sentinel
  shortDescription: Audits MongoDB serverStatus cursor metrics to detect abandoned timed-out cursors and server memory retention leaks.
  description: |
    ## How it works
    This workflow connects to the target MongoDB cluster using official `mongosh` inside a containerized runner. It samples `db.serverStatus().metrics.cursor` to evaluate open cursor counts and timed-out cursors. When application batch processing scripts or analytics pipelines fail to close cursor streams properly or specify `noCursorTimeout()`, server resources remain tied up. When timed-out cursors exceed the threshold, a Slack notification is immediately dispatched.

    ## What you get
    - Early warning of unclosed database iterator connections in backend microservices.
    - Prevents gradual server memory exhaustion and OOM kills on MongoDB nodes.
    - Real-time visibility into open vs timed-out cursor counts.

    ## Who it's for
    - Database Administrators (DBAs) and Platform Engineers maintaining MongoDB performance.
    - Application Developers running ETL batch jobs and large collection iterators.

    ## Why orchestrate this with Kestra
    - **Scheduled Audits**: Continuously sample cursor health without standing up separate monitoring daemons.
    - **Containerized Reliability**: Leverages official MongoDB container images for guaranteed CLI compatibility.
    - **Contextual Alerting**: Route actionable warnings directly to engineering channels with zero boilerplate.

    ## Prerequisites
    - MongoDB cluster accessible via connection string with read permissions on `serverStatus`.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure MongoDB URI and Slack webhook secret.
    3. Run the workflow to inspect active cursor metrics.

    ## How to extend
    - Query `currentOp()` to identify client IPs responsible for opening abandoned cursors.
    - Correlate with WiredTiger cache memory consumption.

    ## Links
    - [MongoDB Cursor Metrics Documentation](https://www.mongodb.com/docs/manual/reference/command/serverStatus/#mongodb-serverstatus-metrics.cursor)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
