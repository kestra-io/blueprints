id: mongodb-cursor-timeout-leak-sentinel
namespace: company.database

inputs:
  - id: mongo_uri
    type: STRING
    defaults: "mongodb://mongo.internal:27017"
    description: MongoDB connection URI string.
  - id: max_timed_out_cursors
    type: INT
    defaults: 10
    description: Maximum acceptable count of abandoned timed-out cursors over operational window.

tasks:
  - id: audit_cursor_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pymongo==4.15.3
      - kestra==2.0.0
    script: |
      from pymongo import MongoClient
      import sys
      from kestra import Kestra

      mongo_uri = "{{ inputs.mongo_uri }}"
      try:
          client = MongoClient(mongo_uri, serverSelectionTimeoutMS=5000)
          status = client.admin.command("serverStatus")
          cursors = status.get("metrics", {}).get("cursor", {})

          timed_out = int(cursors.get("timedOut", 0))
          open_cursors = int(cursors.get("open", {}).get("total", 0))

          print(f"Open cursors: {open_cursors}, Timed-out cursors: {timed_out}")

          Kestra.outputs({
              "timed_out": timed_out,
              "open_cursors": open_cursors
          })
      except Exception as e:
          print(f"Error querying MongoDB cursor metrics: {e}", file=sys.stderr)
          sys.exit(1)

  - id: evaluate_cursor_leaks
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_cursor_metrics.vars.timed_out | int > inputs.max_timed_out_cursors }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ MongoDB Cursor Timeout and Memory Leak Alert",
                "text": "Detected *{{ outputs.audit_cursor_metrics.vars.timed_out }}* timed-out MongoDB cursors (currently open cursors: {{ outputs.audit_cursor_metrics.vars.open_cursors }}). Impact: Application code is opening queries with `noCursorTimeout` or failing to close iterate streams, retaining server RAM buffers indefinitely.",
                "footer": "Kestra Database Sentinel • MongoDB Cursors"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MongoDB Cursor Sentinel Execution Failed",
            "text": "The MongoDB cursor metrics query failed. Please verify MongoDB connection URI and host reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

outputs:
  - id: timed_out
    type: INT
    value: "{{ outputs.audit_cursor_metrics.vars.timed_out }}"
  - id: open_cursors
    type: INT
    value: "{{ outputs.audit_cursor_metrics.vars.open_cursors }}"

extend:
  metaDescription: "Audits MongoDB serverStatus cursor metrics to detect abandoned timed-out cursors and server memory retention leaks."
  metaTitle: MongoDB Cursor Timeout and Server Memory Leak Sentinel with Kestra
  title: MongoDB Cursor Timeout and Server Memory Leak Sentinel
  shortDescription: Audits MongoDB serverStatus cursor metrics to detect abandoned timed-out cursors and server memory retention leaks.
  description: |
    ## How it works
    This workflow connects to the target MongoDB cluster using a Python task inside a Docker runner. It samples `db.serverStatus().metrics.cursor` to evaluate open cursor counts and timed-out cursors. When application batch processing scripts or analytics pipelines fail to close cursor streams properly or specify `noCursorTimeout()`, server resources remain tied up. When timed-out cursors exceed the threshold, a Slack notification is immediately dispatched.

    ## What you get
    - Early warning of unclosed database iterator connections in backend microservices.
    - Prevents gradual server memory exhaustion and OOM kills on MongoDB nodes.
    - Real-time visibility into open vs timed-out cursor counts.

    ## Who it's for
    - Database Administrators (DBAs) and Platform Engineers maintaining MongoDB performance.
    - Application Developers running ETL batch jobs and large collection iterators.

    ## Why orchestrate this with Kestra
    - **Scheduled Audits**: Continuously sample cursor health without standing up separate monitoring daemons.
    - **Containerized Reliability**: Leverages official container images for guaranteed environment isolation.
    - **Contextual Alerting**: Route actionable warnings directly to engineering channels with zero boilerplate.

    ## Prerequisites
    - MongoDB cluster accessible via connection string with read permissions on `serverStatus`.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure MongoDB URI and Slack webhook secret.
    3. Run the workflow to inspect active cursor metrics.

    ## How to extend
    - Query `currentOp()` to identify client IPs responsible for opening abandoned cursors.
    - Correlate with WiredTiger cache memory consumption.

    ## Links
    - [MongoDB Cursor Metrics Documentation](https://www.mongodb.com/docs/manual/reference/command/serverStatus/#mongodb-serverstatus-metrics.cursor)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-script-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
