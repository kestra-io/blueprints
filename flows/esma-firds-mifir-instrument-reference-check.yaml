id: esma-firds-mifir-instrument-reference-check
namespace: company.team

description: |
  Pre-submission reference-data gate for MiFIR transaction reports. Every ISIN in the day's
  trade file is looked up in ESMA's FIRDS register in one request, and each trade is checked
  against the record of its trading venue on the trade date: the ISIN must be valid, known to
  FIRDS, admitted on that MIC (or, for off-venue trades, traded on at least one EU venue), not
  terminated before the trade date, and its CFI must match the security master. Exceptions go to
  a CSV, Slack names the new ones, and the execution fails so the report is not submitted.

inputs:
  - id: trades
    type: STRING
    displayName: Trades CSV
    description: |
      CSV with header `trade_id,isin,mic,trade_date,cfi`. `mic` is the segment MIC of the venue, or
      XOFF / XXXX / SINT for trades outside a trading venue. `cfi` is the code from your security
      master and may be empty. The defaults are sample trades on real ISINs; the FIRDS records come
      from the live register. A Flow trigger can pass the upstream file URI instead of the text.
    defaults: |
      trade_id,isin,mic,trade_date,cfi
      T-1001,NL0010273215,XAMS,2026-10-16,ESVUFN
      T-1002,DE0007164600,XETA,2026-10-16,ESVUFB
      T-1003,DE0007164600,XETR,2026-10-16,ESVUFB
      T-1004,DE0001102580,XOFF,2026-10-16,DBFTFB
      T-1005,US0378331005,XOFF,2026-10-16,ESVUFA
      T-1006,GB00B03MLX29,XAMS,2026-10-16,ESXXXR
      T-1007,SE0022867198,XOFF,2026-10-16,OPASPS
      T-1008,INE002A01018,XOFF,2026-10-16,
      T-1009,DE0007164601,XETA,2026-10-16,ESVUFB

  - id: fail_on_exceptions
    type: BOOL
    defaults: true
    description: Fail the execution when any trade has an exception, so a downstream submission flow (Flow trigger on SUCCESS) does not run. Set to false for a report-only run.

triggers:
  - id: after_trade_capture
    type: io.kestra.plugin.core.trigger.Flow
    description: Runs when the end-of-day trade capture flow succeeds and passes its `trades_csv` output (text or file URI) as the trade file.
    inputs:
      trades: "{{ trigger.outputs.trades_csv }}"
    dependsOn:
      - namespace: company.team
        flowId: trade-capture-eod
        states: [SUCCESS]

tasks:
  - id: parse_trades
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Reads the CSV, upper-cases ISIN/MIC/CFI and validates each ISIN (format plus the ISO 6166
      Luhn check digit), so typos are caught without spending a lookup. Builds one Solr query
      `isin:(A OR B ...)` for all distinct valid ISINs.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      trades.csv: "{{ inputs.trades }}"
    outputFiles:
      - trades_parquet
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE raw AS
      SELECT CAST(trade_id AS VARCHAR) AS trade_id,
             upper(trim(CAST(isin AS VARCHAR))) AS isin,
             upper(trim(CAST(mic AS VARCHAR))) AS mic,
             TRY_CAST(trade_date AS DATE) AS trade_date,
             nullif(upper(trim(CAST(cfi AS VARCHAR))), '') AS cfi
      FROM read_csv('trades.csv', header = true, all_varchar = true);

      CREATE TABLE trades AS
      SELECT * EXCLUDE (r),
             isin_format_ok AND list_sum(list_transform(range(1, length(r) + 1), i -> CASE WHEN i % 2 = 0
               THEN (CAST(substring(r, i, 1) AS INTEGER) * 2) % 10 + (CAST(substring(r, i, 1) AS INTEGER) * 2) // 10
               ELSE CAST(substring(r, i, 1) AS INTEGER) END)) % 10 = 0 AS isin_valid
      FROM (
        SELECT *,
               CASE WHEN isin_format_ok THEN reverse(array_to_string(list_transform(string_split(isin, ''),
                 c -> CASE WHEN c BETWEEN 'A' AND 'Z' THEN CAST(ascii(c) - 55 AS VARCHAR) ELSE c END), '')) ELSE '0' END AS r
        FROM (SELECT *, coalesce(regexp_full_match(isin, '[A-Z]{2}[A-Z0-9]{9}[0-9]'), false) AS isin_format_ok FROM raw)
      );

      COPY trades TO '{{ outputFiles.trades_parquet }}' (FORMAT PARQUET);

      SELECT count(*) AS trades,
             count(*) FILTER (WHERE NOT isin_valid) AS invalid_isins,
             count(DISTINCT isin) FILTER (WHERE isin_valid) AS lookup_isins,
             coalesce('isin:(' || string_agg(DISTINCT isin, ' OR ') FILTER (WHERE isin_valid) || ')', 'isin:NONE') AS solr_query
      FROM trades;

  - id: fetch_firds
    type: io.kestra.plugin.core.http.Download
    description: |
      One POST to the FIRDS Solr index for all ISINs (POST so long trade files do not hit URL
      limits). `latest_received_flag:1` drops superseded versions and `fl` keeps the fields the
      checks need. FIRDS holds one record per ISIN and venue, so `rows` is generous; the check
      fails the gate if `numFound` is larger than what came back.
    uri: https://registers.esma.europa.eu/solr/esma_registers_firds/select
    method: POST
    contentType: application/x-www-form-urlencoded
    formData:
      q: "{{ outputs.parse_trades.outputs[0].row.solr_query }}"
      fq: "latest_received_flag:1"
      fl: "isin,mic,status,gnr_full_name,gnr_cfi_code,lei,mrkt_trdng_start_date,mrkt_trdng_trmination_date,publication_date"
      rows: "50000"
      wt: json
    headers:
      User-Agent: kestra-esma-firds-mifir-instrument-reference-check/1.0
    retry:
      type: exponential
      interval: PT10S
      maxInterval: PT2M
      maxAttempts: 4

  - id: previous_exceptions
    type: io.kestra.plugin.core.kv.Get
    key: firds_reference_exceptions
    errorOnMissing: false
    description: JSON array of exceptions already alerted, keyed on (isin, mic, check), with the date first seen. Missing on the first run.

  - id: check
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Joins every trade to the FIRDS records of its ISIN. Cancelled records (status CANC) are
      ignored. A venue record is live on the trade date when the trading start date is on or before
      it and the termination date is empty or on or after it. Off-venue MICs (XOFF, XXXX, SINT)
      pass when the ISIN is live on any venue (traded on a trading venue, TOTV). The first failing
      check wins, in this order INVALID_ISIN, BAD_TRADE_DATE, NOT_IN_FIRDS, NOT_ON_VENUE,
      NOT_YET_ADMITTED, TERMINATED, NOT_TOTV, CFI_MISMATCH.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      trades.parquet: "{{ outputs.parse_trades.outputFiles.trades_parquet }}"
      firds.json: "{{ outputs.fetch_firds.uri }}"
      seen.json: "{{ outputs.previous_exceptions.value ?? '[]' }}"
    outputFiles:
      - report_csv
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE resp AS SELECT CAST(content AS JSON) AS j FROM read_text('firds.json');

      CREATE TABLE firds AS
      SELECT d->>'$.isin' AS isin, d->>'$.mic' AS mic, d->>'$.status' AS status,
             d->>'$.gnr_full_name' AS name, d->>'$.gnr_cfi_code' AS firds_cfi, d->>'$.lei' AS lei,
             CAST(CAST(d->>'$.mrkt_trdng_start_date' AS TIMESTAMP) AS DATE) AS start_date,
             CAST(CAST(d->>'$.mrkt_trdng_trmination_date' AS TIMESTAMP) AS DATE) AS term_date,
             CAST(d->>'$.publication_date' AS TIMESTAMP) AS published
      FROM (SELECT unnest(from_json(json_extract(j, '$.response.docs'), '["JSON"]')) AS d FROM resp)
      WHERE d->>'$.status' <> 'CANC';

      CREATE TABLE checked AS
      SELECT t.trade_id, t.isin, t.mic, t.trade_date, t.cfi,
             any_value(f.name) AS name, any_value(f.lei) AS lei,
             coalesce(max(f.firds_cfi) FILTER (WHERE f.mic = t.mic), max(f.firds_cfi)) AS firds_cfi,
             t.mic IN ('XOFF', 'XXXX', 'SINT') AS off_venue,
             count(f.isin) AS venue_records,
             count(f.isin) FILTER (WHERE f.mic = t.mic) AS records_on_mic,
             count(f.isin) FILTER (WHERE f.mic = t.mic AND f.start_date <= t.trade_date AND (f.term_date IS NULL OR f.term_date >= t.trade_date)) AS live_on_mic,
             count(f.isin) FILTER (WHERE f.mic = t.mic AND f.start_date > t.trade_date) AS future_on_mic,
             count(DISTINCT f.mic) FILTER (WHERE f.start_date <= t.trade_date AND (f.term_date IS NULL OR f.term_date >= t.trade_date)) AS live_venues,
             max(f.term_date) FILTER (WHERE f.mic = t.mic OR t.mic IN ('XOFF', 'XXXX', 'SINT')) AS last_termination,
             string_agg(DISTINCT f.mic, ' ' ORDER BY f.mic) FILTER (WHERE f.start_date <= t.trade_date AND (f.term_date IS NULL OR f.term_date >= t.trade_date) AND f.mic LIKE left(t.mic, 2) || '%') AS similar_live_mics,
             bool_and(t.isin_valid) AS isin_valid
      FROM read_parquet('trades.parquet') t
      LEFT JOIN firds f ON f.isin = t.isin
      GROUP BY t.trade_id, t.isin, t.mic, t.trade_date, t.cfi;

      CREATE TABLE report AS
      SELECT *,
             CASE WHEN NOT isin_valid THEN 'INVALID_ISIN'
                  WHEN trade_date IS NULL THEN 'BAD_TRADE_DATE'
                  WHEN venue_records = 0 THEN 'NOT_IN_FIRDS'
                  WHEN NOT off_venue AND records_on_mic = 0 THEN 'NOT_ON_VENUE'
                  WHEN NOT off_venue AND live_on_mic = 0 AND future_on_mic > 0 THEN 'NOT_YET_ADMITTED'
                  WHEN NOT off_venue AND live_on_mic = 0 THEN 'TERMINATED'
                  WHEN off_venue AND live_venues = 0 THEN 'NOT_TOTV'
                  WHEN cfi IS NOT NULL AND cfi <> firds_cfi THEN 'CFI_MISMATCH'
                  ELSE 'OK' END AS result
      FROM checked;

      ALTER TABLE report ADD COLUMN detail VARCHAR;
      UPDATE report SET detail = CASE result
        WHEN 'INVALID_ISIN' THEN 'ISIN fails the ISO 6166 format or check digit'
        WHEN 'BAD_TRADE_DATE' THEN 'trade_date is not a YYYY-MM-DD date'
        WHEN 'NOT_IN_FIRDS' THEN 'no FIRDS record for this ISIN'
        WHEN 'NOT_ON_VENUE' THEN 'not admitted on ' || mic || coalesce('; live on ' || similar_live_mics, '') || ' (' || live_venues || ' live venues)'
        WHEN 'NOT_YET_ADMITTED' THEN 'trading on ' || mic || ' starts after the trade date'
        WHEN 'TERMINATED' THEN 'terminated on ' || mic || ' on ' || CAST(last_termination AS VARCHAR)
        WHEN 'NOT_TOTV' THEN 'not live on any EU venue on the trade date' || coalesce(', last termination ' || CAST(last_termination AS VARCHAR), '')
        WHEN 'CFI_MISMATCH' THEN 'security master ' || cfi || ' vs FIRDS ' || firds_cfi
        ELSE '' END;

      CREATE TABLE seen AS
      SELECT s->>'$.key' AS key, CAST(s->>'$.first_seen' AS DATE) AS first_seen
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('seen.json'));

      CREATE TABLE exceptions AS
      SELECT r.*, r.isin || '|' || r.mic || '|' || r.result AS key, s.first_seen, s.key IS NULL AS is_new
      FROM report r LEFT JOIN seen s ON s.key = r.isin || '|' || r.mic || '|' || r.result
      WHERE r.result <> 'OK';

      COPY (SELECT r.trade_id, r.isin, r.mic, r.trade_date, r.result, r.detail, r.name, r.lei, r.cfi, r.firds_cfi, r.live_venues, e.first_seen
            FROM report r LEFT JOIN exceptions e USING (trade_id) ORDER BY r.result = 'OK', r.trade_id)
        TO '{{ outputFiles.report_csv }}' (HEADER, DELIMITER ',');

      SELECT (SELECT count(*) FROM report) AS trades,
             (SELECT count(*) FROM report WHERE result = 'OK') AS ok,
             (SELECT count(*) FROM exceptions) AS exceptions,
             (SELECT count(*) FROM exceptions WHERE is_new) AS new_exceptions,
             (SELECT CAST(json_extract(j, '$.response.numFound') AS BIGINT) FROM resp) AS firds_found,
             (SELECT json_array_length(json_extract(j, '$.response.docs')) FROM resp) AS firds_returned,
             (SELECT CAST(json_extract(j, '$.response.numFound') AS BIGINT) > json_array_length(json_extract(j, '$.response.docs')) FROM resp) AS truncated,
             (SELECT CAST(max(published) AS VARCHAR) FROM firds) AS firds_published,
             (SELECT coalesce(string_agg(result || ' ' || count, ', '), 'none') FROM (SELECT result, count(*) AS count FROM report GROUP BY result ORDER BY result)) AS by_result,
             (SELECT coalesce(string_agg((CASE WHEN is_new THEN 'NEW ' ELSE 'open since ' || CAST(first_seen AS VARCHAR) || ' ' END) || trade_id || ' ' || isin || ' @ ' || mic || ' ' || result || ': ' || detail, chr(10) ORDER BY NOT is_new, trade_id), '') FROM exceptions) AS exception_lines,
             (SELECT chr(10) || '```' || coalesce(string_agg((CASE WHEN is_new THEN 'NEW ' ELSE 'open ' END) || trade_id || ' ' || isin || ' @ ' || mic || ' ' || result || ', ' || detail, chr(10) ORDER BY NOT is_new, trade_id), '') || '```' || chr(10) FROM exceptions) AS slack_block,
             (SELECT coalesce(CAST(json_group_array(json_object('key', key, 'first_seen', first_seen)) AS VARCHAR), '[]')
                FROM (SELECT key, coalesce(first_seen, current_date) AS first_seen FROM exceptions)) AS open_now;

  - id: save_exceptions
    type: io.kestra.plugin.core.kv.Set
    description: Keeps only the exceptions still open, so a fixed reference problem that comes back later is reported as new again.
    key: firds_reference_exceptions
    value: "{{ outputs.check.outputs[0].row.open_now }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      FIRDS check of {{ outputs.check.outputs[0].row.trades }} trades ({{ outputs.parse_trades.outputs[0].row.lookup_isins }} ISINs looked up, {{ outputs.check.outputs[0].row.firds_returned }} venue records, FIRDS published {{ outputs.check.outputs[0].row.firds_published }}).
      Results: {{ outputs.check.outputs[0].row.by_result }}. Exceptions {{ outputs.check.outputs[0].row.exceptions }} ({{ outputs.check.outputs[0].row.new_exceptions }} new).
      {{ outputs.check.outputs[0].row.exception_lines }}

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check.outputs[0].row.exceptions > 0 or outputs.check.outputs[0].row.truncated }}"
    then:
      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        runIf: "{{ outputs.check.outputs[0].row.new_exceptions > 0 }}"
        allowFailure: true
        description: Posts only when there is a new exception; open ones are repeated in the message for context. allowFailure keeps the gate result when the webhook is not configured.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": {{ (":no_entry: MiFIR reference data gate: " ~ outputs.check.outputs[0].row.exceptions ~ " of " ~ outputs.check.outputs[0].row.trades ~ " trades fail the FIRDS check (" ~ outputs.check.outputs[0].row.new_exceptions ~ " new)" ~ outputs.check.outputs[0].row.slack_block ~ (kestra.url ?? '') ~ "/ui/executions/" ~ flow.namespace ~ "/" ~ flow.id ~ "/" ~ execution.id) | toJson }}}

      - id: block_submission
        type: io.kestra.plugin.core.execution.Fail
        runIf: "{{ inputs.fail_on_exceptions }}"
        errorMessage: "FIRDS reference check failed: {{ outputs.check.outputs[0].row.by_result }}{{ outputs.check.outputs[0].row.truncated ? '; FIRDS response truncated, raise rows' : '' }}. See the report CSV."
    else:
      - id: all_clear
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.check.outputs[0].row.trades }} trades pass the FIRDS reference check; the transaction report can be submitted."

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.check.outputs[0].row }}"
  - id: report_csv
    type: FILE
    value: "{{ outputs.check.outputFiles.report_csv }}"

extend:
  title: Gate MiFIR Transaction Reports on ESMA FIRDS Instrument Reference Data
  metaTitle: ESMA FIRDS MiFIR Instrument Reference Check with DuckDB | Kestra
  shortDescription: Before the daily MiFIR transaction report goes out, look up every traded ISIN in ESMA FIRDS in one request, check venue admission, termination date and CFI against each trade, and fail the gate with a CSV of exceptions and a Slack alert.
  metaDescription: Check traded ISINs against ESMA FIRDS before MiFIR transaction reporting, venue, termination and CFI checks in DuckDB, exception CSV and Slack gate.
  description: |
    A MiFIR transaction report is rejected when the instrument is not in FIRDS on the trade date, the venue never admitted it, or it was terminated before the trade. This flow runs before submission: it checks every trade of the day against ESMA's FIRDS register in one request and fails the execution when a trade would be rejected, so the submission flow does not start.

    ## How it works

    1. A `Flow` trigger runs the check when `trade-capture-eod` succeeds and passes its `trades_csv` output (CSV text or file URI: `trade_id,isin,mic,trade_date,cfi`).
    2. `parse_trades` (DuckDB) normalises the file and validates each ISIN (ISO 6166 format and check digit), then builds one Solr query `isin:(A OR B ...)`.
    3. `fetch_firds` (HTTP Download) POSTs it to the public FIRDS Solr index with `latest_received_flag:1` and a trimmed `fl` list. FIRDS has one record per ISIN and venue.
    4. `check` (DuckDB) drops cancelled records; a venue record is live when trading started by the trade date and had not terminated. First failing check wins: `INVALID_ISIN`, `BAD_TRADE_DATE`, `NOT_IN_FIRDS`, `NOT_ON_VENUE` (hinting live segment MICs, e.g. XETA for XETR), `NOT_YET_ADMITTED`, `TERMINATED`, `NOT_TOTV` (off-venue XOFF/XXXX/SINT trade of an ISIN live on no EU venue), `CFI_MISMATCH` against your security master.
    5. KV key `firds_reference_exceptions` keeps open exceptions with their first-seen date, so each run marks them NEW or open.
    6. `gate` (If) posts to Slack only for new exceptions and `block_submission` (Fail) fails the run, also when FIRDS returned fewer records than `numFound`. `fail_on_exceptions: false` makes it report-only.

    ## What you get

    - A CSV per trade: result, reason, instrument name, issuer LEI, both CFI codes, live venue count, first-seen date.
    - A failed execution that blocks submission, and Slack alerts for new breaks only.

    ## Who it's for

    - Regulatory reporting and reg ops teams submitting MiFIR / MiFID II transaction reports.
    - Reference data teams who own ISIN, MIC and CFI quality in the security master.

    ## Why orchestrate this with Kestra

    - The `Flow` trigger puts the gate between trade capture and submission without changing either flow.
    - One request and two DuckDB tasks replace a lookup script; KV state, retries and `Fail` give a clear go/no-go history.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack notifications plugin.
    - Outbound HTTPS to `registers.esma.europa.eu`. FIRDS is public and needs no API key.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the gate alert (optional; without it the gate still decides).

    ## Quick start

    1. Click **Execute**. The default trades are sample data on real ISINs (ASML, SAP, a Bund, Apple, the pre-2022 Shell share, an expired option, Reliance Industries, a mistyped SAP ISIN); the FIRDS records come from the live register. Expect 3 OK and 6 NEW exceptions and a failed gate.
    2. Execute again: the 6 exceptions are open, Slack is skipped, the gate still fails.
    3. Point the trigger at your capture flow and add `SLACK_WEBHOOK_URL`.

    ## How to extend

    - Map operating MICs to segment MICs with the ISO 10383 list.
    - Test off-venue derivatives on their underlying (`drv_underlng_isin`).
    - Append each report to a warehouse table to track break rates.

    ## Links

    - [ESMA FIRDS register](https://registers.esma.europa.eu/publication/searchRegister?core=esma_registers_firds) and [FIRDS reference data](https://www.esma.europa.eu/data-reporting/mifir-reporting)
    - [Flow trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.flow) and [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if) and [Fail](https://kestra.io/plugins/core/execution/io.kestra.plugin.core.execution.fail)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Business
  subTags:
    - Policy & Compliance
    - Approval Gates
  ee: false
  demo: false
