id: tflint-terraform-architecture-and-policy-enforcement-gate
namespace: company.platform

inputs:
  - id: terraform_file
    type: FILE
    displayName: "Terraform Configuration File"
    description: "The Terraform configuration file (.tf) to evaluate for cloud provider misconfigurations, invalid instance types, and enterprise architecture rules. Used during manual execution or Subflow chaining; ignored when the webhook trigger fires."

triggers:
  - id: scan_on_pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Allows CI pipelines, GitHub Actions PR workflows, or Atlantis/Spacelift webhooks to POST Terraform configuration files directly to this gate. fetchType: STORE safely streams the payload into Kestra internal storage as trigger.uri rather than exposing untrusted text to string interpolation."
    key: "{{ secret('TFLINT_WEBHOOK_KEY') }}"
    fetchType: STORE
    disabled: true

tasks:
  - id: run_tflint
    type: io.kestra.plugin.scripts.shell.Commands
    description: |
      Runs TFLint inside an isolated container against the provided Terraform configuration.
      Generates a structured JSON diagnostic report capturing invalid cloud provider attributes,
      syntax errors, deprecated resource references, and architecture policy violations.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      entryPoint: []
    containerImage: ghcr.io/terraform-linters/tflint:latest
    commands:
      - "cp {{ trigger.uri is defined ? trigger.uri : inputs.terraform_file }} main.tf"
      - "tflint --init || true"
      - "tflint --format json main.tf > tflint_report.json || true"
      - "cat tflint_report.json"
    outputFiles:
      - "tflint_report.json"
    allowFailure: true

  - id: classify_terraform_compliance
    type: io.kestra.plugin.core.debug.Return
    description: |
      Parses tflint_report.json and classifies the outcome:
      - UNREACHABLE: Diagnostic report was never produced due to a container or I/O failure.
      - BLOCK_SYNTAX: Structural HCL syntax errors or unclosed blocks that prevent Terraform compilation.
      - BLOCK_POLICY: Critical ERROR-level rule violations such as invalid cloud instance types or illegal resource configurations.
      - WARN: Non-blocking WARNING-level findings such as unused variable declarations or naming convention notices.
      - PASS: Clean validation with zero errors or warnings.
    format: "{{ outputs.run_tflint.outputFiles['tflint_report.json'] is defined ? (read(outputs.run_tflint.outputFiles['tflint_report.json']) | jq('if (([.errors[]?] | length) > 0) then \"BLOCK_SYNTAX\" elif (([.issues[]? | select(.rule.severity == \"Error\")] | length) > 0) then \"BLOCK_POLICY\" elif (([.issues[]? | select(.rule.severity == \"Warning\")] | length) > 0) then \"WARN\" else \"PASS\" end') | first) : 'UNREACHABLE' }}"

  - id: route_by_terraform_compliance
    type: io.kestra.plugin.core.flow.Switch
    description: "Branches on the compliance verdict: BLOCK_POLICY dispatches an urgent Slack alert and immediately fails the gate; BLOCK_SYNTAX alerts and halts execution on syntax bugs; WARN alerts team channels without breaking builds; PASS confirms clean validation; UNREACHABLE alerts on diagnostic execution failure."
    value: "{{ outputs.classify_terraform_compliance.value }}"
    cases:
      "BLOCK_POLICY":
        - id: alert_policy_violation
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches an alert detailing the specific cloud provider attribute violations, rule names, and line numbers."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "CRITICAL: Terraform policy gate BLOCKED execution {{ execution.id }} on flow {{ flow.id }}. Cloud provider or architecture rule violation detected: {{ read(outputs.run_tflint.outputFiles['tflint_report.json']) | jq('[.issues[]? | select(.rule.severity == "Error") | "Line " + (.range.start.line|tostring) + " (" + .rule.name + "): " + .message] | join(" | ")') | first }}. Review Terraform configuration and fix provider attributes before merging."
            }
        - id: fail_policy_gate
          type: io.kestra.plugin.core.execution.Fail
          description: "Hard-fails the execution so downstream terraform apply steps or parent release pipelines are stopped immediately."
          errorMessage: "Terraform architecture gate failed: critical policy violation detected. Review execution logs and TFLint report."

      "BLOCK_SYNTAX":
        - id: alert_syntax_error
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Sends an alert detailing Terraform syntax errors and unclosed configuration blocks."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Terraform syntax gate BLOCKED execution {{ execution.id }} on flow {{ flow.id }}. Syntax error: {{ read(outputs.run_tflint.outputFiles['tflint_report.json']) | jq('[.errors[]? | .message] | join(" | ")') | first }}."
            }
        - id: fail_syntax_gate
          type: io.kestra.plugin.core.execution.Fail
          description: "Fails the execution due to Terraform HCL parse errors."
          errorMessage: "Terraform syntax gate failed: invalid HCL syntax detected."

      "WARN":
        - id: alert_linter_warning
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Notifies team of non-breaking warnings (e.g., unused variables or style notices) without blocking the pipeline."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Terraform gate WARNING (execution {{ execution.id }}): Linter issues found: {{ read(outputs.run_tflint.outputFiles['tflint_report.json']) | jq('[.issues[]? | select(.rule.severity == "Warning") | "Line " + (.range.start.line|tostring) + " (" + .rule.name + "): " + .message] | join(" | ")') | first }}."
            }

      "PASS":
        - id: log_clean_terraform
          type: io.kestra.plugin.core.log.Log
          description: "Logs confirmation of clean configuration with zero policy violations or syntax errors."
          message: "Terraform validation passed with zero cloud provider errors, syntax bugs, or architecture warnings."

      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Alerts when TFLint container failed to produce a report due to container error or malformed input."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Terraform gate UNREACHABLE: TFLint container failed to produce tflint_report.json. Check task logs for execution {{ execution.id }}."
            }
        - id: fail_unreachable
          type: io.kestra.plugin.core.execution.Fail
          description: "Fails execution when the static analysis engine could not run."
          errorMessage: "Terraform validation failed to complete. Check TFLint runner logs."

    defaults:
      - id: log_default_status
        type: io.kestra.plugin.core.log.Log
        message: "Completed Terraform compliance evaluation with status: {{ outputs.classify_terraform_compliance.value }}"

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Records persistent audit log entry for passing and warning runs."
    message: "Terraform compliance gate completed: status={{ outputs.classify_terraform_compliance.value }}, execution={{ execution.id }}."

errors:
  - id: alert_gate_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Fires when unexpected execution crashes occur or when a Fail task deliberately fails the gate."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Terraform policy gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). If status is BLOCK_POLICY or BLOCK_SYNTAX, this failure is intentional to protect the deployment pipeline."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_terraform_compliance.value }}"

extend:
  title: "TFLint Terraform Architecture and Policy Enforcement Gate"
  metaTitle: TFLint Terraform Architecture and Policy Enforcement Gate for Kestra
  shortDescription: Validate Terraform configurations with TFLint, block CI/CD pipelines on invalid cloud provider attributes and syntax errors, and warn on naming conventions.
  metaDescription: Block Terraform plans on invalid cloud provider attributes and syntax errors while warning on naming conventions using TFLint.
  description: |
    Terraform configurations manage critical cloud infrastructure, network topologies, and security boundaries. While standard `terraform validate` confirms basic HCL syntax and internal type consistency, it does not check whether declared resource attributes are valid according to actual cloud provider schemas. Consequently, infrastructure pipelines frequently proceed past initial pull request checks only to fail during lengthy `terraform plan` or `terraform apply` executions due to invalid instance types, disallowed storage configurations, or missing enterprise tags.

    This blueprint runs `tflint` inside an isolated container to evaluate Terraform configurations against provider-specific rulesets without requiring active cloud credentials. Rather than treating all findings as binary pass/fail, the flow distinguishes fatal HCL syntax errors and critical provider attribute violations (which immediately fail the gate via `Fail` tasks to halt automated release pipelines) from non-breaking hygiene warnings (such as unused declarations or naming conventions, which notify Slack for engineering awareness without halting builds).

    ## How it works

    1. `scan_on_pr_webhook` (`io.kestra.plugin.core.trigger.Webhook`) allows CI/CD pipelines (such as GitHub Actions, GitLab CI, or Atlantis) to POST Terraform `.tf` files directly to Kestra. `fetchType: STORE` securely streams the payload into Kestra internal storage as `trigger.uri`, preventing untrusted code from undergoing string interpolation in script commands. Manual or parent `Subflow` executions provide the file via the `terraform_file` input.
    2. `run_tflint` (`io.kestra.plugin.scripts.shell.Commands`) executes the `ghcr.io/terraform-linters/tflint:latest` container with `entryPoint: []` to run `tflint --format json` against the configuration, outputting diagnostics to `tflint_report.json`. `allowFailure: true` ensures that non-zero linter exit codes do not abort the execution before structured classification.
    3. `classify_terraform_compliance` (`io.kestra.plugin.core.debug.Return`) inspects the diagnostic report using `jq`:
       - If `tflint_report.json` was not generated, it classifies as `UNREACHABLE`.
       - If the report contains parse or syntax errors (`.errors`), it classifies as `BLOCK_SYNTAX`.
       - If any issue contains `severity == "ERROR"` (e.g., invalid instance type, unsupported provider attribute), it classifies as `BLOCK_POLICY`.
       - If only `severity == "WARNING"` issues remain (e.g., unused variable declarations), it classifies as `WARN`.
       - If zero issues were found, it classifies as `PASS`.
    4. `route_by_terraform_compliance` (`io.kestra.plugin.core.flow.Switch`) branches on the classification:
       - `BLOCK_POLICY`: Sends a detailed Slack alert with rule names and line numbers, then triggers `fail_policy_gate` (`io.kestra.plugin.core.execution.Fail`) to hard-fail the pipeline.
       - `BLOCK_SYNTAX`: Sends an alert detailing syntax parse errors and halts execution via `fail_syntax_gate`.
       - `WARN`: Dispatches an informational Slack notification with the warnings, allowing the execution to succeed.
       - `PASS`: Records confirmation in execution logs.
       - `UNREACHABLE`: Alerts on runner container or storage failure.
    5. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) records a persistent status line in Kestra execution history for continuous compliance tracking.
    6. Root `errors` block alerts Slack whenever an unexpected system fault occurs or when `Fail` tasks deliberately stop the pipeline.

    ## What you get

    - Early detection of cloud provider configuration errors before initiating long-running or expensive `terraform plan` executions.
    - Clear distinction between fatal provider errors/syntax breakages (hard block) and non-breaking code hygiene warnings (Slack notification only).
    - Hard stop: `fail_policy_gate` ensures parent CI/CD flows or Subflow orchestrators halt immediately when a critical policy violation is found.
    - Actionable remediation advice: alerts indicate the exact line number, rule name, and provider-specific error message.
    - Standardized execution output (`status`: `PASS`, `WARN`, `BLOCK_POLICY`, `BLOCK_SYNTAX`, `UNREACHABLE`) for automated downstream routing.

    ## Who it's for

    - Platform Engineers and Cloud Architects enforcing infrastructure-as-code standards across multi-account cloud environments.
    - DevOps engineers looking to prevent broken Terraform configurations from reaching staging or production apply stages.
    - FinOps teams enforcing instance type allowlists and mandatory tag policies before resource provisioning.

    ## Why orchestrate this with Kestra

    Standalone CLI linters produce exit codes, but cannot coordinate multi-tier policy decisions, alert designated team channels with tailored remediation guidance, or halt downstream enterprise release flows. Kestra transforms `tflint` into an automated, auditable compliance gate with persistent execution history, secure credential handling, and webhook-driven CI integration.

    ## Prerequisites

    - Docker runtime available to the Kestra worker to run the `ghcr.io/terraform-linters/tflint:latest` container (no external cloud accounts or paid licenses required).
    - A Terraform configuration file (`.tf`) to evaluate.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `TFLINT_WEBHOOK_KEY`: Secret authentication key for the inbound webhook trigger (`.../executions/webhook/{namespace}/{flowId}/{key}`). Required only if `scan_on_pr_webhook` is enabled.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used to dispatch policy blocks, syntax errors, linter warnings, and system failure alerts.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret (and `TFLINT_WEBHOOK_KEY` if using webhooks) in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Click **Execute**, upload a test Terraform file (for example an AWS instance resource with an invalid `instance_type = "t2.microo"` to observe a `BLOCK_POLICY` outcome), and verify the execution log.
    4. Enable `scan_on_pr_webhook` and configure your repository CI pipeline or pre-commit hook to POST changed Terraform files on pull request events.

    ## How to extend

    - Add custom `.tflint.hcl` rulesets (such as `tflint-ruleset-aws`, `tflint-ruleset-azurerm`, or `tflint-ruleset-google`) to enforce cloud-specific architecture policies.
    - Integrate with Atlantis or GitHub PR comment tasks using `io.kestra.plugin.github.pulls.Comment` to post line-level review annotations directly on pull requests.
    - Store policy violation counts in a central metrics store (e.g., Prometheus or Datadog) to track infrastructure compliance over time.

    ## Links

    - [TFLint Documentation](https://github.com/terraform-linters/tflint)
    - [TFLint Ruleset AWS](https://github.com/terraform-linters/tflint-ruleset-aws)
    - [Kestra Docker Script Runner](https://kestra.io/plugins/scripts/runner/docker/io.kestra.plugin.scripts.runner.docker.docker)
    - [Kestra Fail Task](https://kestra.io/plugins/core/tasks/execution/io.kestra.plugin.core.execution.fail)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false
