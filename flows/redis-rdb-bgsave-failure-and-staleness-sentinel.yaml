id: redis-rdb-bgsave-failure-and-staleness-sentinel
namespace: company.sre

description: |
  Audits Redis RDB snapshot execution status to detect failed bgsave routines, fork OOM issues, and persistent backup gaps.

concurrency:
  limit: 1

inputs:
  - id: redis_host
    type: STRING
    displayName: "Redis Host"
    defaults: "redis.internal"
    description: "Hostname of Redis instance."
  - id: redis_port
    type: INT
    displayName: "Redis Port"
    defaults: 6379
    description: "TCP port for Redis connection."

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: redis:7-alpine
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HOST: "{{ inputs.redis_host }}"
      PORT: "{{ inputs.redis_port }}"
      AUTH_ARGS: "-a {{ secret('REDIS_PASSWORD') }} --no-auth-warning"
    commands:
      - |
        INFO_PERSIST=$(redis-cli -h "$HOST" -p "$PORT" $AUTH_ARGS INFO persistence 2>/dev/null)
        if [ -z "$INFO_PERSIST" ]; then echo "Redis connection failed" >&2; exit 1; fi
        LAST_BGSAVE_STATUS=$(echo "$INFO_PERSIST" | grep "rdb_last_bgsave_status:" | tr -d '\r' | cut -d: -f2)
        RDB_CHANGES_SINCE_SAVE=$(echo "$INFO_PERSIST" | grep "rdb_changes_since_last_save:" | tr -d '\r' | cut -d: -f2)
        IS_ALERT=false
        if [ "$LAST_BGSAVE_STATUS" != "ok" ]; then IS_ALERT=true; fi
        cat <<JSON > output.json
        {"rdb_last_bgsave_status": "$LAST_BGSAVE_STATUS", "changes_since_last_save": $RDB_CHANGES_SINCE_SAVE, "is_alert": $IS_ALERT}
        JSON
    outputFiles:
      - output.json

  - id: evaluate_threshold
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).is_alert }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "text": "🚨 *Redis RDB Bgsave Failure Alert: `{{ inputs.redis_host }}`*\n- *Status*: `{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).rdb_last_bgsave_status }}`"
          }

errors:
  - id: notify_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "text": "❌ *Sentinel probe execution failed for redis-rdb-bgsave-failure-and-staleness-sentinel*"
      }

extend:
  title: Redis rdb background save failure and snapshot staleness sentinel
  shortDescription: Audits Redis RDB snapshot execution status to detect failed bgsave routines, fork OOM issues, and persistent backup gaps.
  description: |
    Audits Redis RDB snapshot execution status to detect failed bgsave routines, fork OOM issues, and persistent backup gaps.

    ## How it works
    1. A schedule trigger or manual execution connects to the target infrastructure service endpoint.
    2. Runs diagnostic status queries inside an isolated container runner to extract health telemetry.
    3. Evaluates health metrics against defined thresholds to flag operational anomalies.
    4. Dispatches actionable alerts to Slack with resource metrics and remediation guidance.

    ## What you get
    - Proactive infrastructure monitoring without managing external monitoring agents.
    - Automated detection of system degradation before outages impact production services.
    - Actionable Slack notifications equipped with diagnostic metrics.

    ## Who it's for
    - Site Reliability Engineers (SREs) and DevOps engineers maintaining high availability.
    - Platform Engineers and Database Administrators operating distributed infrastructure.
    - Operations teams requiring automated incident alerting.

    ## Why orchestrate this with Kestra
    - Runs declarative probes directly with native plugins and container tasks.
    - Securely stores sensitive connection credentials in Kestra namespace secrets.
    - Maintains a complete historical audit log of every health check execution.

    ## Prerequisites
    - Network connectivity to the target service from Kestra worker pods.
    - Service credentials and `SLACK_WEBHOOK` secret configured in the Kestra namespace.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Configure the required namespace secrets.
    3. Run a manual execution to test connectivity.
    4. Enable the schedule trigger for continuous background monitoring.

    ## How to extend
    - Add automated remediation tasks (e.g. restart service, failover replica, purge queues).
    - Route critical alerts to PagerDuty or OpsGenie.
    - Forward historical telemetry to long-term data warehouses.

    ## Links
    - [Kestra Documentation](https://kestra.io/docs)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Databases
  ee: false
  demo: false
