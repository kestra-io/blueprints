id: cla-signature-checker
namespace: company.team

description: |
  Blocks pull requests from authors who have not signed the contributor
  license agreement. A webhook fires the flow when a pull request opens, the
  commit list is read from the GitHub API, and every distinct author login or
  email is checked against a signed CLA roster plus DCO Signed-off-by
  trailers. Anyone still missing gets a GitHub issue requesting the signature
  and a Slack ping to the maintainers, while a clean pull request passes
  quietly. Every run exposes the verdict, the authors checked, the unsigned
  list and the pull request number as typed outputs.

triggers:
  - id: pull_request_opened
    type: io.kestra.plugin.core.trigger.Webhook
    description: Receives the pull request opened event from GitHub or a relay and starts the check for that pull request.
    key: "{{ secret('CLA_WEBHOOK_KEY') }}"
  - id: nightly_resweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled fallback that re-checks a pending pull request each morning until someone switches it on.
    cron: "0 6 * * *"
    disabled: true

inputs:
  - id: repo
    type: STRING
    defaults: acme-inc/platform
    description: Repository that owns the pull request in owner/name form.
  - id: pr_number
    type: INT
    defaults: 4187
    description: Number of the pull request whose commit authors are inspected.
  - id: author_login
    type: STRING
    defaults: octo-contributor
    description: Login that opened the pull request, where a suffix of [bot] selects the automation waiver roster.

tasks:
  # --- 1. read the commit list of the pull request ---
  - id: fetch_commits
    type: io.kestra.plugin.core.http.Request
    description: Reads every commit of the pull request so each author identity can be checked against the roster.
    method: GET
    uri: "https://api.github.com/repos/{{ inputs.repo }}/pulls/{{ inputs.pr_number }}/commits?per_page=100"
    headers:
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "cla-signature-checker"
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT15S
      maxAttempts: 3

  # --- 2. roster fixture and verdict, inside one shared directory ---
  - id: verify_authors
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Keeps the roster file written by the shell step and the Python check that reads it in the same directory.
    tasks:
      - id: write_cla_roster
        type: io.kestra.plugin.scripts.shell.Commands
        description: Writes cla-signers.txt with the roster for this run, because automation accounts cannot sign a contributor license agreement, so a bot author gets the waiver roster and a human author gets the signed roster.
        env:
          IS_BOT: "{{ (inputs.author_login | toJson | jq('endswith(\"[bot]\")') | first) ? 'true' : 'false' }}"
        commands:
          - |
            set -eu
            if [ "${IS_BOT}" = "true" ]; then
              cat > cla-signers.txt <<'EOF'
            # Automation accounts waived by policy
            dependabot[bot]
            renovate[bot]
            github-actions[bot]
            EOF
            else
              cat > cla-signers.txt <<'EOF'
            # Signed contributor license agreement roster
            alice-w
            carol-dev
            maintainer-moe
            EOF
            fi
            echo "roster written for {{ inputs.author_login }} is_bot=${IS_BOT}"

      - id: check_cla
        type: io.kestra.plugin.scripts.python.Script
        description: Reduces the commit payload to distinct author identities and reports who still owes a signature.
        containerImage: python:3.11-slim
        inputFiles:
          commits.json: "{{ outputs.fetch_commits.body | toJson }}"
        script: |
          import json
          import re

          COMMITS_FILE = "commits.json"
          SIGNERS_FILE = "cla-signers.txt"


          def load_payload(path):
              try:
                  with open(path, "r", encoding="utf-8") as handle:
                      raw = handle.read().strip()
              except OSError:
                  return None
              if not raw:
                  return None
              try:
                  data = json.loads(raw)
              except ValueError:
                  return None
              while isinstance(data, str):
                  try:
                      data = json.loads(data)
                  except ValueError:
                      return None
              return data


          def load_signers(path):
              signers = set()
              try:
                  with open(path, "r", encoding="utf-8") as handle:
                      lines = handle.read().splitlines()
              except OSError:
                  return signers
              for line in lines:
                  name = line.strip().lower()
                  if name and not name.startswith("#"):
                      signers.add(name)
              return signers


          def identity(entry):
              author = entry.get("author") or {}
              login = str(author.get("login") or "").strip()
              commit_author = ((entry.get("commit") or {}).get("author")) or {}
              emails = []
              for candidate in (author.get("email"), commit_author.get("email")):
                  email = str(candidate or "").strip().lower()
                  if email and email not in emails:
                      emails.append(email)
              return login, emails


          def signoff_identities(message):
              found = []
              for line in message.splitlines():
                  if line.strip().lower().startswith("signed-off-by:"):
                      value = line.split(":", 1)[1].strip().lower()
                      match = re.search(r"<([^>]+)>", value)
                      found.append(match.group(1).strip() if match else value)
              return found


          payload = load_payload(COMMITS_FILE)
          entries = payload if isinstance(payload, list) else []
          signers = load_signers(SIGNERS_FILE)

          order = []
          signed = {}
          for entry in entries:
              if not isinstance(entry, dict):
                  continue
              login, emails = identity(entry)
              key = login or (emails[0] if emails else "unknown")
              if key not in signed:
                  order.append(key)
                  signed[key] = False
              granted = bool(login) and login.lower() in signers
              granted = granted or any(email in signers for email in emails)
              if not granted:
                  message = str(((entry.get("commit") or {}).get("message")) or "")
                  trail = signoff_identities(message)
                  granted = any(email in trail for email in emails)
                  granted = granted or (bool(login) and login.lower() in trail)
              if granted:
                  signed[key] = True

          checked = len(order)
          unsigned = [key for key in order if not signed[key]]
          if checked == 0:
              unsigned = ["unknown"]
          verdict = "BLOCK" if unsigned else "PASS"
          result = {"verdict": verdict, "unsigned": unsigned, "checked": checked}
          print("::" + json.dumps({"outputs": result}, ensure_ascii=True) + "::")

  # --- 3. the gate ---
  - id: cla_gate
    type: io.kestra.plugin.core.flow.If
    description: Files the signature request and pings Slack only when somebody is missing, otherwise lets the pull request pass.
    condition: "{{ (outputs.check_cla.vars.unsigned | length) > 0 }}"
    then:
      - id: file_signature_request
        type: io.kestra.plugin.github.issues.Create
        description: Opens a tracked issue that lists the authors who still owe a signature.
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.repo }}"
        title: "CLA signature required for pull request {{ inputs.pr_number }}"
        body: |
          ## Contributor license agreement

          Pull request {{ inputs.pr_number }} in `{{ inputs.repo }}` was opened by
          `{{ inputs.author_login }}` and at least one commit author has no
          contributor license agreement on file.

          - Unsigned authors: {{ outputs.check_cla.vars.unsigned | join(', ') }}
          - Authors checked: {{ outputs.check_cla.vars.checked }}
          - Verdict: {{ outputs.check_cla.vars.verdict }}

          Sign the CLA and push an empty commit, or ask a maintainer to re-run
          this check once the signature is recorded.
        labels:
          - cla
          - signature-required
      - id: ping_maintainers
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Pings the compliance channel so a maintainer reviews the pull request before merge.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"channel": "#contributor-compliance", "text": "CLA check blocked pull request {{ inputs.pr_number }} in {{ inputs.repo }}. Unsigned authors {{ outputs.check_cla.vars.unsigned | toJson }} out of {{ outputs.check_cla.vars.checked }} checked."}
    else:
      - id: log_all_clear
        type: io.kestra.plugin.core.log.Log
        description: Records a clean pass, where every checked author of the pull request is on file.
        message: "All {{ outputs.check_cla.vars.checked }} authors of pull request {{ inputs.pr_number }} are signed, verdict {{ outputs.check_cla.vars.verdict }}."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalates any failure of the check to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"channel": "#contributor-compliance", "text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.check_cla.vars.verdict }}"
  - id: checked_authors
    type: INT
    value: "{{ outputs.check_cla.vars.checked }}"
  - id: unsigned
    type: ARRAY
    value: "{{ outputs.check_cla.vars.unsigned | toJson }}"
  - id: pr_number
    type: INT
    value: "{{ inputs.pr_number }}"

extend:
  title: Block unsigned contributors before their pull requests merge
  metaTitle: CLA Signature Checker for Pull Requests in Kestra
  shortDescription: Check every commit author of a newly opened pull request against your CLA roster, open a signature request issue and ping Slack when someone is missing.
  metaDescription: Block pull requests from authors who have not signed the CLA. When a pull request opens, check each commit author, then file a signature issue and ping Slack.
  description: |
    Compliance checks only help when they run before merge, and they never run when they depend on someone remembering to run them. This flow fires the moment a pull request opens, reads the commit list from the GitHub API, reduces it to distinct author identities and checks each one against a signed CLA roster plus DCO Signed-off-by trailers. Anyone who still owes a signature gets a GitHub issue that names them and a Slack ping to the maintainers, while a clean pull request passes with a verdict you can gate on.

    ## How it works

    1. `pull_request_opened` (Webhook) receives the pull request opened event. `nightly_resweep` is a disabled Schedule kept as a fallback for pull requests that need a morning re-check.
    2. `fetch_commits` (`io.kestra.plugin.core.http.Request`) calls `GET /repos/{repo}/pulls/{n}/commits` with the `GITHUB_TOKEN` secret and retries on transient failures.
    3. `verify_authors` (`io.kestra.plugin.core.flow.WorkingDirectory`) gives the roster step and the check one shared directory. Inside it, `write_cla_roster` (`io.kestra.plugin.scripts.shell.Commands`) picks the roster by author type, `human` or `bot`, in one runnable step.
    4. The roster step writes `cla-signers.txt` with a heredoc, one login per line, and `check_cla` (`io.kestra.plugin.scripts.python.Script`) reads it next to the commit payload. A login on the roster or a matching DCO `Signed-off-by` trailer counts as signed, and the task prints one `::{"outputs": ...}::` line carrying `verdict`, `unsigned` and `checked`.
    5. `cla_gate` (`io.kestra.plugin.core.flow.If`) fires when `unsigned` is non-empty: `file_signature_request` (`io.kestra.plugin.github.issues.Create`) opens the signature request issue and `ping_maintainers` posts to Slack. When the list is empty, `log_all_clear` records the pass.

    ## What you get

    - `verdict` (STRING): `BLOCK` when at least one author is missing, `PASS` when every checked author is on file or has signed off.
    - `checked_authors` (INT): distinct author logins or emails inspected on the pull request.
    - `unsigned` (ARRAY): the identities that still owe a signature, empty on a clean run.
    - `pr_number` (INT): the pull request the verdict belongs to, handy when several runs are in flight.

    ## Who it's for

    - Maintainers of repositories that require a contributor license agreement or a DCO sign-off from every author.
    - Platform teams that want the compliance check on the opening event instead of a manual reviewer checklist.

    ## Why orchestrate this with Kestra

    - The check is a chain of steps with a branch in the middle, and Kestra keeps the roster branch, the API retries and the escalation in one versioned file.
    - Failures escalate through the `errors` handler to Slack with the execution URL, so an expired token or an unreachable API is never silent.
    - Outputs are typed and machine readable, so a merge queue can gate on `verdict` instead of scraping logs.

    ## Prerequisites

    - A Kestra instance with the GitHub and Slack plugins installed.
    - A pull request to inspect and a roster of signed logins to compare against.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub token that can read pull request commits and create issues.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the signature request ping and for failure alerts.
    - `CLA_WEBHOOK_KEY`: key the webhook trigger expects from the relay that posts the event.

    ## Quick start

    1. Add the three secrets and import the flow into your namespace.
    2. Point the pull request opened webhook at the trigger URL, or execute manually with `repo`, `pr_number` and `author_login`.
    3. Read `verdict`, `checked_authors` and `unsigned` in the outputs while the issue and Slack tasks do the chasing.

    ## How to extend

    - Replace the heredoc roster with a roster fetched from your identity provider, or with a query task against your HR table.
    - Add another branch to the roster writer for service accounts and route it to its own waiver file.
    - Post the unsigned list to a different channel per repository by templating the Slack payload with `inputs.repo`.

    ## Links

    - [GitHub REST API for pull requests](https://docs.github.com/en/rest/pulls/pulls)
    - [GitHub plugin for Kestra](https://kestra.io/plugins/plugin-github)
  tags:
    - Infrastructure
    - System
  subTags:
    - compliance
    - github
    - webhooks
    - pull-requests
  ee: false
  demo: false
