id: kestra-failed-execution-triage-and-auto-remediation
namespace: company.team

description: |
  Event-driven remediation for failed Kestra executions. A Flow trigger reacts to every FAILED execution under a
  namespace prefix, classifies the error logs with a regex rule table, restarts transient failures within a per-flow
  KV budget, asks a human to replay or skip code and data errors, and escalates the rest. Defaults to a dry run.

inputs:
  - id: dry_run
    type: BOOL
    defaults: true
    description: true (default) classifies, decides and audits, but never labels, restarts, replays or skips anything.

  - id: execution_id
    type: STRING
    defaults: ""
    description: Manual mode only. A FAILED execution id to triage. Leave empty when the Flow trigger starts the run.

  - id: watch_namespace_prefix
    type: STRING
    defaults: company.team
    description: |
      The namespace and its children that this flow may act on (company.team covers company.team.etl, not
      company.teamwork). Keep it equal to the literal in the trigger `when`; it is re-checked before any action.

  - id: classification_rules
    type: JSON
    description: |
      Ordered rules, first match wins. `class` is TRANSIENT, DATA or CODE; `pattern` is an RE2 regex tested
      against every ERROR line of the failed task (and of the Subflow or Loop executions it links to).
      Lines that match nothing are UNKNOWN. Rules that block an automatic restart come first on purpose.
    defaults: |
      [
        {"name": "pebble_expression", "class": "CODE", "pattern": "(?i)unable to find `[^`]+` used in the expression|IllegalVariableEvaluationException|PebbleException|Unexpected token"},
        {"name": "invalid_flow_or_task", "class": "CODE", "pattern": "(?i)invalid (flow|property|task|type)|ConstraintViolation|NullPointerException|ClassCastException|Unrecognized field"},
        {"name": "schema_or_parse", "class": "DATA", "pattern": "(?i)conversion error|could not convert|schema mismatch|invalid input syntax|malformed|unexpected (character|end of input)|column .* (not found|does not exist)|duplicate key|constraint failed"},
        {"name": "rate_limited", "class": "TRANSIENT", "pattern": "(?i)\\b429\\b|too many requests|rate.?limit"},
        {"name": "server_error", "class": "TRANSIENT", "pattern": "(?i)\\b(500|502|503|504)\\b|service unavailable|bad gateway|gateway time-?out"},
        {"name": "network", "class": "TRANSIENT", "pattern": "(?i)timed? ?out|timeout|connection (reset|refused|closed)|broken pipe|unknownhost|name resolution"}
      ]

  - id: max_auto_restarts
    type: INT
    defaults: 3
    min: 0
    max: 20
    description: Automatic restarts allowed per flow inside `budget_window`. 0 disables automatic restarts.

  - id: budget_window
    type: DURATION
    defaults: PT6H
    description: Sliding window of the restart budget. Each restart is a KV key that expires after this duration.

  - id: restart_delay
    type: DURATION
    defaults: PT1M
    description: Wait before an automatic restart, so a rate limit or a short outage has time to clear.

  - id: kestra_api_url
    type: STRING
    defaults: http://localhost:8080
    description: Base URL of this Kestra instance's API, as seen from the worker.

variables:
  tenant: main
  budget_prefix: remediation_budget

checks:
  - when: "{{ inputs.classification_rules | jq('type == \"array\" and length > 0 and ([.[] | select((.class != \"TRANSIENT\" and .class != \"DATA\" and .class != \"CODE\") or ((.pattern // \"\") | tostring | length) == 0)] | length) == 0') | first }}"
    message: classification_rules must be a non-empty array of rules, each with a non-empty pattern and a class of TRANSIENT, DATA or CODE.
    style: ERROR
    behavior: BLOCK_EXECUTION
  - when: "{{ (inputs.watch_namespace_prefix | trim | length) > 0 and not (inputs.watch_namespace_prefix contains '*') and not (inputs.watch_namespace_prefix contains ' ') }}"
    message: watch_namespace_prefix must be one namespace such as company.team; empty or wildcard scopes are refused.
    style: ERROR
    behavior: BLOCK_EXECUTION

concurrency:
  limit: 10
  behavior: QUEUE

sla:
  - id: max_triage_time
    type: MAX_DURATION
    duration: PT5H
    behavior: FAIL
    labels:
      remediation_sla: breached

triggers:
  - id: on_failed_execution
    type: io.kestra.plugin.core.trigger.Flow
    description: |
      `when` is rendered with the variables of the execution that failed, so it uses `flow.*` and `labels`, not
      `trigger.*`. It skips this flow and every execution that already carries a `remediation` label (its own
      restarts, replays and opt-outs), so a remediation never triggers another one.
    dependsOn:
      - states: [FAILED]
        when: "{{ ((flow.namespace ~ '.') | startsWith('company.team.')) and flow.id != 'kestra-failed-execution-triage-and-auto-remediation' and (labels.remediation ?? '') == '' }}"

tasks:
  - id: context
    type: io.kestra.plugin.core.output.OutputValues
    description: |
      The target comes from the Flow trigger, or from `execution_id` in manual mode. Inputs are normalised here once:
      on 2.0.5 an execution created by a Flow trigger gets its input defaults unparsed (the JSON rules stay a string,
      BOOL and INT values arrive as text), so later tasks read these values instead of `inputs.*`.
    values:
      dry_run: "{{ inputs.dry_run == true or (inputs.dry_run ~ '') == 'true' }}"
      rules: "{{ inputs.classification_rules | jq('.') | first | toJson }}"
      prefix: "{{ inputs.watch_namespace_prefix | trim }}"
      max_restarts: "{{ inputs.max_auto_restarts ~ '' }}"
      budget_window: "{{ inputs.budget_window }}"
      restart_delay: "{{ inputs.restart_delay }}"
      execution_id: "{{ (trigger.executionId ?? inputs.execution_id) | trim }}"
      api: "{{ inputs.kestra_api_url | trim }}/api/v1/{{ vars.tenant }}"
      ui: "{{ kestra.url ?? inputs.kestra_api_url }}/ui/{{ vars.tenant }}/executions"
      source: "{{ trigger.executionId is defined ? 'flow_trigger' : 'manual' }}"

  - id: require_target
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.context.values.execution_id == '' }}"
    then:
      - id: no_target
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: Nothing to triage. Run with `execution_id` set to a FAILED execution, or let the Flow trigger start this flow.

  - id: get_execution
    type: io.kestra.plugin.core.http.Request
    description: Hard fail after three attempts. Without the execution's state, labels and task runs, no action is safe.
    uri: "{{ outputs.context.values.api }}/executions/{{ outputs.context.values.execution_id }}"
    options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
    timeout: PT30S
    retry: {type: exponential, interval: PT5S, maxInterval: PT1M, maxAttempts: 3}

  - id: get_error_logs
    type: io.kestra.plugin.core.http.Request
    description: ERROR lines of the failed execution. Hard fail, because acting on a guess is worse than not acting.
    uri: "{{ outputs.context.values.api }}/logs/{{ outputs.context.values.execution_id }}"
    options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
    timeout: PT30S
    params:
      "filters[level][GREATER_THAN_OR_EQUAL_TO]": ERROR
    retry: {type: exponential, interval: PT5S, maxInterval: PT1M, maxAttempts: 3}

  - id: linked_executions
    type: io.kestra.plugin.core.output.OutputValues
    description: |
      A failed Subflow or Loop task only logs "ends in FAILED state" with a link; the real error is in the linked
      execution. Up to 10 linked execution ids are extracted from the ERROR lines.
    values:
      ids: "{{ outputs.get_error_logs.body | jq('[.[] | .message // \"\" | scan(\"execution=.([A-Za-z0-9]+).\") | .[0]] | unique | .[0:10]') | first | toJson }}"

  - id: get_linked_logs
    type: io.kestra.plugin.core.http.Request
    description: |
      ERROR lines of the linked executions in one search. allowFailure, because this is extra evidence; without it
      the classification still runs on the parent's own lines and usually ends as UNKNOWN, which goes to a human.
    runIf: "{{ (fromJson(outputs.linked_executions.values.ids) | length) > 0 }}"
    allowFailure: true
    uri: "{{ outputs.context.values.api }}/logs/search"
    options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
    timeout: PT30S
    params:
      "filters[executionId][IN]": "{{ fromJson(outputs.linked_executions.values.ids) | join(',') }}"
      "filters[level][GREATER_THAN_OR_EQUAL_TO]": ERROR
      size: "200"
    retry: {type: exponential, interval: PT5S, maxInterval: PT1M, maxAttempts: 3}

  - id: count_budget
    type: io.kestra.plugin.core.kv.GetKeys
    description: One KV key per automatic restart of this flow, each with a `ttl`. Expired keys are not listed, so the count is a sliding window.
    prefix: "{{ vars.budget_prefix }}.{{ fromJson(outputs.get_execution.body).namespace }}.{{ fromJson(outputs.get_execution.body).flowId }}."

  - id: classify
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Picks the failed leaf task run, keeps the ERROR lines of its latest attempt plus the linked executions' lines,
      applies the rules in order and decides: ignore, auto_restart, escalate or approval. Hard fail: an invalid
      regex in the rules stops the run here, before anything is touched.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    timeout: PT2M
    parameters:
      execution: "{{ outputs.get_execution.body }}"
      logs: "{{ outputs.get_error_logs.body }}"
      linked_logs: "{{ outputs.get_linked_logs.body is defined ? (fromJson(outputs.get_linked_logs.body).results | toJson) : '[]' }}"
      rules: "{{ outputs.context.values.rules }}"
      prefix: "{{ outputs.context.values.prefix }}"
      self_namespace: "{{ flow.namespace }}"
      self_flow: "{{ flow.id }}"
      budget_used: "{{ outputs.count_budget.keys | length }}"
      max_restarts: "{{ outputs.context.values.max_restarts }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE ex AS SELECT CAST(:execution AS JSON) AS e;
      CREATE TABLE runs AS
      SELECT json_extract_string(t, '$.id') AS run_id, json_extract_string(t, '$.taskId') AS task_id,
             json_extract_string(t, '$.parentTaskRunId') AS parent_id, json_extract_string(t, '$.state.current') AS state,
             coalesce(json_array_length(json_extract(t, '$.attempts')), 1) - 1 AS last_attempt,
             TRY_CAST(json_extract_string(t, '$.state.startDate') AS TIMESTAMPTZ) AS started
      FROM ex, unnest(from_json(coalesce(json_extract(e, '$.taskRunList'), '[]'), '["JSON"]')) u(t);
      CREATE TABLE leaf AS
      SELECT * FROM runs r WHERE state = 'FAILED'
        AND NOT EXISTS (SELECT 1 FROM runs c WHERE c.parent_id = r.run_id AND c.state = 'FAILED');
      CREATE TABLE lines AS
      SELECT json_extract_string(l, '$.executionId') AS execution_id, json_extract_string(l, '$.taskRunId') AS run_id,
             TRY_CAST(json_extract_string(l, '$.attemptNumber') AS INTEGER) AS attempt,
             TRY_CAST(json_extract_string(l, '$.timestamp') AS TIMESTAMPTZ) AS ts, json_extract_string(l, '$.message') AS message
      FROM (SELECT unnest(from_json(:logs, '["JSON"]')) AS l UNION ALL SELECT unnest(from_json(:linked_logs, '["JSON"]')))
      WHERE json_extract_string(l, '$.level') = 'ERROR' AND json_extract_string(l, '$.message') IS NOT NULL;
      CREATE TABLE ctx AS
      SELECT json_extract_string(e, '$.id') AS execution_id, json_extract_string(e, '$.namespace') AS namespace,
             json_extract_string(e, '$.flowId') AS flow_id, TRY_CAST(json_extract_string(e, '$.flowRevision') AS INTEGER) AS flow_revision,
             json_extract_string(e, '$.state.current') AS state, coalesce(json_extract_string(e, '$.kind'), 'NORMAL') AS kind,
             coalesce(json_extract_string(e, '$.trigger.type'), '') AS trigger_type,
             (SELECT json_extract_string(x, '$.value') FROM unnest(from_json(coalesce(json_extract(e, '$.labels'), '[]'), '["JSON"]')) v(x)
               WHERE json_extract_string(x, '$.key') = 'remediation' LIMIT 1) AS remediation_label
      FROM ex;
      CREATE TABLE evidence AS
      SELECT DISTINCT l.execution_id, l.ts, l.message FROM lines l
      LEFT JOIN leaf f ON l.run_id = f.run_id
      WHERE l.execution_id <> (SELECT execution_id FROM ctx) OR l.run_id IS NULL OR coalesce(l.attempt, 0) = f.last_attempt;
      CREATE TABLE rules AS
      WITH a AS (SELECT from_json(:rules, '["JSON"]') AS r)
      SELECT i AS pos, coalesce(json_extract_string(r[i], '$.name'), 'rule ' || i) AS name,
             upper(json_extract_string(r[i], '$.class')) AS class, json_extract_string(r[i], '$.pattern') AS pattern
      FROM a, range(1, len(r) + 1) t(i);
      CREATE TABLE verdict AS
      SELECT r.pos, r.name, r.class, e.message, e.execution_id AS evidence_execution
      FROM rules r JOIN evidence e ON regexp_matches(e.message, r.pattern) ORDER BY r.pos, e.ts LIMIT 1;
      CREATE TABLE decided AS
      SELECT c.*,
             (SELECT task_id FROM leaf ORDER BY started NULLS LAST LIMIT 1) AS failed_task_id,
             (SELECT run_id FROM leaf ORDER BY started NULLS LAST LIMIT 1) AS failed_task_run_id,
             coalesce((SELECT class FROM verdict), 'UNKNOWN') AS failure_class,
             coalesce((SELECT name FROM verdict), 'no rule matched') AS matched_rule,
             left(coalesce((SELECT message FROM verdict), (SELECT message FROM evidence ORDER BY ts LIMIT 1), 'no ERROR line was logged'), 400) AS evidence,
             (SELECT count(*) FROM evidence) AS error_lines,
             CAST(:budget_used AS INTEGER) AS budget_used,
             CASE WHEN NOT starts_with(c.namespace || '.', :prefix || '.') THEN 'outside_watched_prefix'
                  WHEN c.namespace = :self_namespace AND c.flow_id = :self_flow THEN 'own_execution'
                  WHEN coalesce(c.remediation_label, '') <> '' THEN 'already_has_remediation_label'
                  WHEN c.kind <> 'NORMAL' THEN 'execution_kind_' || lower(c.kind)
                  WHEN c.trigger_type IN ('io.kestra.plugin.core.flow.Subflow', 'io.kestra.plugin.core.flow.ForEachItem') THEN 'subflow_child_parent_is_triaged'
                  WHEN c.state <> 'FAILED' THEN 'no_longer_failed_' || lower(c.state)
             END AS ignore_reason
      FROM ctx c;
      SELECT *, CASE WHEN ignore_reason IS NOT NULL THEN 'ignore'
                     WHEN failure_class = 'TRANSIENT' AND budget_used < CAST(:max_restarts AS INTEGER) THEN 'auto_restart'
                     WHEN failure_class = 'TRANSIENT' THEN 'escalate'
                     ELSE 'approval' END AS decision
      FROM decided;

  - id: record_decision
    type: io.kestra.plugin.core.execution.Labels
    description: The audit trail lives on this execution's labels, so the Executions page can filter every decision.
    labels:
      remediation_decision: "{{ outputs.classify.outputs[0].row.decision }}"
      remediation_class: "{{ outputs.classify.outputs[0].row.failure_class }}"
      remediation_target: "{{ outputs.classify.outputs[0].row.execution_id }}"
      remediation_flow: "{{ outputs.classify.outputs[0].row.namespace }}.{{ outputs.classify.outputs[0].row.flow_id }}"
      remediation_dry_run: "{{ outputs.context.values.dry_run }}"

  - id: log_decision
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.context.values.dry_run == 'true' ? 'DRY RUN ' : '' }}{{ outputs.classify.outputs[0].row.namespace }}.{{ outputs.classify.outputs[0].row.flow_id }}
      execution {{ outputs.classify.outputs[0].row.execution_id }} ({{ outputs.classify.outputs[0].row.state }}, failed task {{ outputs.classify.outputs[0].row.failed_task_id ?? 'none' }}):
      class {{ outputs.classify.outputs[0].row.failure_class }} by rule {{ outputs.classify.outputs[0].row.matched_rule }}
      over {{ outputs.classify.outputs[0].row.error_lines }} ERROR line(s), {{ fromJson(outputs.linked_executions.values.ids) | length }} linked execution(s);
      budget {{ outputs.classify.outputs[0].row.budget_used }}/{{ outputs.context.values.max_restarts }};
      decision {{ outputs.classify.outputs[0].row.decision }}{{ outputs.classify.outputs[0].row.ignore_reason is not null ? ' (' ~ outputs.classify.outputs[0].row.ignore_reason ~ ')' : '' }}.
      Evidence: {{ outputs.classify.outputs[0].row.evidence }}

  - id: act
    type: io.kestra.plugin.core.flow.Switch
    description: Only auto_restart and approval change anything, and only when `dry_run` is false.
    value: "{{ outputs.context.values.dry_run == 'true' ? 'dry_run' : outputs.classify.outputs[0].row.decision }}"
    cases:
      auto_restart:
        - id: wait_before_restart
          type: io.kestra.plugin.core.flow.Sleep
          duration: "{{ outputs.context.values.restart_delay }}"

        - id: refresh_before_restart
          type: io.kestra.plugin.core.http.Request
          description: Re-reads the target after the delay; a person may have restarted it in the meantime.
          uri: "{{ outputs.context.values.api }}/executions/{{ outputs.classify.outputs[0].row.execution_id }}"
          options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
          timeout: PT30S
          retry: {type: exponential, interval: PT5S, maxInterval: PT1M, maxAttempts: 3}

        - id: still_failed
          type: io.kestra.plugin.core.flow.If
          condition: "{{ fromJson(outputs.refresh_before_restart.body).state.current == 'FAILED' and (fromJson(outputs.refresh_before_restart.body).labels | jq('[.[] | select(.key == \"remediation\")] | length') | first) == 0 }}"
          then:
            - id: budget_slot
              type: io.kestra.plugin.core.output.OutputValues
              description: The key name holds a UTC timestamp after the flow prefix, so sorting the keys orders the restarts in time.
              values:
                key: "{{ vars.budget_prefix }}.{{ outputs.classify.outputs[0].row.namespace }}.{{ outputs.classify.outputs[0].row.flow_id }}.{{ now() | date(\"yyyyMMdd'T'HHmmssSSS\", timeZone='UTC') }}.{{ outputs.classify.outputs[0].row.execution_id }}"

            - id: reserve_budget
              type: io.kestra.plugin.core.kv.Set
              key: "{{ outputs.budget_slot.values.key }}"
              value: "{{ outputs.classify.outputs[0].row.execution_id }}"
              ttl: "{{ outputs.context.values.budget_window }}"

            - id: confirm_budget
              type: io.kestra.plugin.core.kv.GetKeys
              description: Write, then verify. Up to ten triage runs can be active at once, so two of them may read the same count; only the oldest keys keep their slot.
              prefix: "{{ vars.budget_prefix }}.{{ outputs.classify.outputs[0].row.namespace }}.{{ outputs.classify.outputs[0].row.flow_id }}."

            - id: within_budget
              type: io.kestra.plugin.core.flow.If
              condition: "{{ (outputs.confirm_budget.keys | jq('[sort[] | select(. < \"' ~ outputs.budget_slot.values.key ~ '\")] | length') | first) < (outputs.context.values.max_restarts | number) }}"
              then:
                - id: label_restart
                  type: io.kestra.plugin.core.http.Request
                  description: |
                    Labels the target first, so its next state change cannot fire the trigger again. The labels endpoint
                    replaces the whole label set, so the target's own labels are sent back with it. No retry on POSTs.
                  method: POST
                  uri: "{{ outputs.context.values.api }}/executions/{{ outputs.classify.outputs[0].row.execution_id }}/actions/labels"
                  options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
                  timeout: PT30S
                  contentType: application/json
                  body: "{{ fromJson(outputs.refresh_before_restart.body).labels | jq('[.[] | select(.key | startswith(\"system.\") | not)] + [{\"key\": \"remediation\", \"value\": \"auto-restart\"}, {\"key\": \"remediation_by\", \"value\": \"' ~ execution.id ~ '\"}]') | first | toJson }}"

                - id: restart
                  type: io.kestra.plugin.core.http.Request
                  description: Restarts the same execution from its failed task runs; successful tasks are not run again.
                  method: POST
                  uri: "{{ outputs.context.values.api }}/executions/{{ outputs.classify.outputs[0].row.execution_id }}/actions/restart"
                  options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
                  timeout: PT30S
              else:
                - id: release_budget
                  type: io.kestra.plugin.core.kv.Delete
                  description: Another triage run took the last slot first; this one gives its key back and escalates.
                  key: "{{ outputs.budget_slot.values.key }}"
                  errorOnMissing: false
          else:
            - id: log_handled_elsewhere
              type: io.kestra.plugin.core.log.Log
              message: "Not restarting {{ outputs.classify.outputs[0].row.execution_id }}: it is now {{ fromJson(outputs.refresh_before_restart.body).state.current }} or already has a remediation label."

      approval:
        - id: notify_approval
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: allowFailure, so a missing `SLACK_WEBHOOK_URL` never blocks the approval itself.
          allowFailure: true
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          messageText: ":warning: {{ outputs.classify.outputs[0].row.failure_class }} failure in {{ outputs.classify.outputs[0].row.namespace }}.{{ outputs.classify.outputs[0].row.flow_id }} task `{{ outputs.classify.outputs[0].row.failed_task_id ?? 'n/a' }}`: {{ outputs.classify.outputs[0].row.evidence }}. Choose replay, skip_failed_task or leave_failed within 4 hours: {{ outputs.context.values.ui }}/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"

        - id: ask_human
          type: io.kestra.plugin.core.flow.Pause
          description: "Fix the flow first if needed: replay uses its latest revision. Without an answer within 4 hours the Pause ends in WARNING (`behavior: WARN`) and the target is left as it is."
          pauseDuration: PT4H
          behavior: WARN
          onResume:
            - id: action
              type: SELECT
              displayName: replay (new execution from the failed task, latest revision), skip_failed_task (mark it WARNING and continue), leave_failed
              values: [replay, skip_failed_task, leave_failed]
              defaults: leave_failed
            - id: reason
              type: STRING
              defaults: ""

        - id: refresh_after_approval
          type: io.kestra.plugin.core.http.Request
          description: The approval can come hours later, so the target is read again before acting.
          uri: "{{ outputs.context.values.api }}/executions/{{ outputs.classify.outputs[0].row.execution_id }}"
          options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
          timeout: PT30S
          retry: {type: exponential, interval: PT5S, maxInterval: PT1M, maxAttempts: 3}

        - id: apply_approval
          type: io.kestra.plugin.core.flow.Switch
          value: "{{ fromJson(outputs.refresh_after_approval.body).state.current != 'FAILED' ? 'handled_elsewhere' : (outputs.ask_human.onResume.action ?? 'expired') }}"
          cases:
            replay:
              - id: get_flow
                type: io.kestra.plugin.core.http.Request
                description: Latest revision of the failed flow, so a fix deployed after the failure is used by the replay.
                uri: "{{ outputs.context.values.api }}/flows/{{ outputs.classify.outputs[0].row.namespace }}/{{ outputs.classify.outputs[0].row.flow_id }}"
                options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
                timeout: PT30S
                retry: {type: exponential, interval: PT5S, maxInterval: PT1M, maxAttempts: 3}

              - id: label_replay
                type: io.kestra.plugin.core.http.Request
                description: The replay copies these labels, so it will not fire the trigger either.
                method: POST
                uri: "{{ outputs.context.values.api }}/executions/{{ outputs.classify.outputs[0].row.execution_id }}/actions/labels"
                options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
                timeout: PT30S
                contentType: application/json
                body: "{{ fromJson(outputs.refresh_after_approval.body).labels | jq('[.[] | select(.key | startswith(\"system.\") | not)] + [{\"key\": \"remediation\", \"value\": \"replay\"}, {\"key\": \"remediation_by\", \"value\": \"' ~ execution.id ~ '\"}]') | first | toJson }}"

              - id: replay
                type: io.kestra.plugin.core.http.Request
                method: POST
                uri: "{{ outputs.context.values.api }}/executions/{{ outputs.classify.outputs[0].row.execution_id }}/actions/replay"
                options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
                timeout: PT30S
                params:
                  taskRunId: "{{ outputs.classify.outputs[0].row.failed_task_run_id }}"
                  revision: "{{ fromJson(outputs.get_flow.body).revision }}"

            skip_failed_task:
              - id: label_skip
                type: io.kestra.plugin.core.http.Request
                method: POST
                uri: "{{ outputs.context.values.api }}/executions/{{ outputs.classify.outputs[0].row.execution_id }}/actions/labels"
                options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
                timeout: PT30S
                contentType: application/json
                body: "{{ fromJson(outputs.refresh_after_approval.body).labels | jq('[.[] | select(.key | startswith(\"system.\") | not)] + [{\"key\": \"remediation\", \"value\": \"skip\"}, {\"key\": \"remediation_by\", \"value\": \"' ~ execution.id ~ '\"}]') | first | toJson }}"

              - id: skip_failed_task
                type: io.kestra.plugin.core.http.Request
                description: Sets the failed task run to WARNING; Kestra resumes the execution with the next task.
                method: POST
                uri: "{{ outputs.context.values.api }}/executions/{{ outputs.classify.outputs[0].row.execution_id }}/actions/state"
                options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
                timeout: PT30S
                contentType: application/json
                body: "{{ {'taskRunId': outputs.classify.outputs[0].row.failed_task_run_id, 'state': 'WARNING'} | toJson }}"

            leave_failed:
              - id: label_leave
                type: io.kestra.plugin.core.http.Request
                description: Marks the target as reviewed, so a manual re-triage does not ask again.
                method: POST
                uri: "{{ outputs.context.values.api }}/executions/{{ outputs.classify.outputs[0].row.execution_id }}/actions/labels"
                options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
                timeout: PT30S
                contentType: application/json
                body: "{{ fromJson(outputs.refresh_after_approval.body).labels | jq('[.[] | select(.key | startswith(\"system.\") | not)] + [{\"key\": \"remediation\", \"value\": \"left-failed\"}, {\"key\": \"remediation_by\", \"value\": \"' ~ execution.id ~ '\"}]') | first | toJson }}"
          defaults:
            - id: log_no_approval_action
              type: io.kestra.plugin.core.log.Log
              message: "No approval action: {{ fromJson(outputs.refresh_after_approval.body).state.current != 'FAILED' ? 'the target is now ' ~ fromJson(outputs.refresh_after_approval.body).state.current : 'the approval expired' }}."
    defaults:
      - id: log_no_action
        type: io.kestra.plugin.core.log.Log
        message: "No action taken ({{ outputs.context.values.dry_run == 'true' ? 'dry run, the live decision would be ' : '' }}{{ outputs.classify.outputs[0].row.decision }})."

  - id: action_taken
    type: io.kestra.plugin.core.output.OutputValues
    description: The execution to follow (the restarted or skipped target, or the new replay) and its state count right after the action.
    values:
      kind: "{{ outputs.restart is defined ? 'restart' : (outputs.replay is defined ? 'replay' : (outputs.skip_failed_task is defined ? 'skip' : 'none')) }}"
      follow_id: "{{ outputs.restart is defined ? outputs.classify.outputs[0].row.execution_id : (outputs.replay is defined ? fromJson(outputs.replay.body).id : (outputs.skip_failed_task is defined ? outputs.classify.outputs[0].row.execution_id : '')) }}"
      baseline: "{{ fromJson(outputs.restart.body ?? outputs.replay.body ?? outputs.skip_failed_task.body ?? '{\"state\": {\"histories\": []}}').state.histories | length }}"

  - id: follow_up
    type: io.kestra.plugin.core.flow.If
    description: Waits for the restarted, replayed or skipped execution to finish, so the audit records whether the action worked.
    condition: "{{ outputs.action_taken.values.follow_id != '' }}"
    then:
      - id: wait_for_outcome
        type: io.kestra.plugin.core.flow.LoopUntil
        description: A state counts only once the execution has moved past the state it had right after the action.
        condition: "{{ outputs.poll.body is defined and (['SUCCESS', 'WARNING', 'FAILED', 'KILLED', 'CANCELLED'] contains fromJson(outputs.poll.body).state.current) and (fromJson(outputs.poll.body).state.histories | length) > (outputs.action_taken.values.baseline | number) }}"
        failOnMaxReached: false
        checkFrequency:
          interval: PT15S
          maxDuration: PT30M
        tasks:
          - id: poll
            type: io.kestra.plugin.core.http.Request
            uri: "{{ outputs.context.values.api }}/executions/{{ outputs.action_taken.values.follow_id }}"
            options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
            timeout: PT30S
            retry: {type: exponential, interval: PT5S, maxInterval: PT1M, maxAttempts: 3}

      - id: final_state
        type: io.kestra.plugin.core.http.Request
        uri: "{{ outputs.context.values.api }}/executions/{{ outputs.action_taken.values.follow_id }}"
        options: {auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}}
        timeout: PT30S
        retry: {type: exponential, interval: PT5S, maxInterval: PT1M, maxAttempts: 3}

  - id: outcome
    type: io.kestra.plugin.core.output.OutputValues
    values:
      result: >-
        {%- set row = outputs.classify.outputs[0].row -%}
        {%- set followed = outputs.final_state is defined ? fromJson(outputs.final_state.body).state.current : '' -%}
        {%- if row.decision == 'ignore' -%}ignored
        {%- elseif outputs.context.values.dry_run == 'true' -%}dry_run
        {%- elseif row.decision == 'escalate' -%}budget_exhausted
        {%- elseif outputs.release_budget is defined -%}budget_taken_by_concurrent_run
        {%- elseif row.decision == 'approval' and outputs.ask_human.onResume is not defined -%}approval_expired
        {%- elseif followed == '' -%}{{ (outputs.ask_human.onResume.action ?? '') == 'leave_failed' ? 'left_failed' : 'handled_elsewhere' }}
        {%- elseif followed == 'SUCCESS' or followed == 'WARNING' -%}{{ outputs.action_taken.values.kind }}_succeeded
        {%- elseif followed == 'FAILED' or followed == 'KILLED' or followed == 'CANCELLED' -%}{{ outputs.action_taken.values.kind }}_failed
        {%- else -%}{{ outputs.action_taken.values.kind }}_still_running
        {%- endif -%}
      followed_state: "{{ outputs.final_state is defined ? fromJson(outputs.final_state.body).state.current : '' }}"

  - id: escalate
    type: io.kestra.plugin.core.flow.If
    description: One escalation path for an exhausted budget, a lost budget race, an expired approval and an action that did not fix the failure.
    condition: "{{ ['budget_exhausted', 'budget_taken_by_concurrent_run', 'approval_expired', 'restart_failed', 'restart_still_running', 'replay_failed', 'replay_still_running', 'skip_failed', 'skip_still_running'] contains outputs.outcome.values.result }}"
    then:
      - id: log_escalation
        type: io.kestra.plugin.core.log.Log
        level: ERROR
        message: "ESCALATION {{ outputs.outcome.values.result }}: {{ outputs.classify.outputs[0].row.namespace }}.{{ outputs.classify.outputs[0].row.flow_id }} execution {{ outputs.classify.outputs[0].row.execution_id }}, class {{ outputs.classify.outputs[0].row.failure_class }}, budget {{ outputs.classify.outputs[0].row.budget_used }}/{{ outputs.context.values.max_restarts }}. {{ outputs.context.values.ui }}/{{ outputs.classify.outputs[0].row.namespace }}/{{ outputs.classify.outputs[0].row.flow_id }}/{{ outputs.classify.outputs[0].row.execution_id }}"
      - id: alert_escalation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: ":rotating_light: Needs a human ({{ outputs.outcome.values.result }}): {{ outputs.classify.outputs[0].row.namespace }}.{{ outputs.classify.outputs[0].row.flow_id }} task `{{ outputs.classify.outputs[0].row.failed_task_id ?? 'n/a' }}`, {{ outputs.classify.outputs[0].row.failure_class }}: {{ outputs.classify.outputs[0].row.evidence }} {{ outputs.context.values.ui }}/{{ outputs.classify.outputs[0].row.namespace }}/{{ outputs.classify.outputs[0].row.flow_id }}/{{ outputs.classify.outputs[0].row.execution_id }}"

errors:
  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Triage of {{ outputs.context.values.execution_id ?? 'unknown execution' }} failed in task {{ ((errorLogs() | length) > 0 and (errorLogs()[0].taskId ?? '') != '') ? errorLogs()[0].taskId : 'none' }}: {{ (errorLogs() | length) > 0 ? errorLogs()[0].message : 'no task error was logged' }}.{{ (outputs.label_restart is defined or outputs.label_replay is defined or outputs.label_skip is defined) ? ' The target was already labelled before the action failed, check it by hand.' : '' }} {{ kestra.url ?? inputs.kestra_api_url }}/ui/{{ vars.tenant }}/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: allowFailure so a missing `SLACK_WEBHOOK_URL` does not hide the original error; the same text is in the ERROR log above.
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":x: Failure triage itself failed in `{{ ((errorLogs() | length) > 0 and (errorLogs()[0].taskId ?? '') != '') ? errorLogs()[0].taskId : 'none' }}`: {{ (errorLogs() | length) > 0 ? errorLogs()[0].message : 'no task error was logged' }} (target {{ outputs.context.values.execution_id ?? 'unknown' }}) {{ kestra.url ?? inputs.kestra_api_url }}/ui/{{ vars.tenant }}/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"

finally:
  - id: audit_labels
    type: io.kestra.plugin.core.execution.Labels
    description: Always runs, also after an error, so every triage execution carries its final outcome.
    labels:
      remediation_outcome: "{{ outputs.outcome.values.result ?? 'triage_error' }}"
  - id: audit_log
    type: io.kestra.plugin.core.log.Log
    message: "AUDIT {{ {'target': outputs.context.values.execution_id ?? '', 'source': outputs.context.values.source ?? '', 'dry_run': outputs.context.values.dry_run ?? 'true', 'decision': outputs.classify.outputs[0].row.decision ?? 'none', 'class': outputs.classify.outputs[0].row.failure_class ?? 'none', 'rule': outputs.classify.outputs[0].row.matched_rule ?? 'none', 'ignore_reason': outputs.classify.outputs[0].row.ignore_reason ?? '', 'budget_used': outputs.classify.outputs[0].row.budget_used ?? 0, 'approval': outputs.ask_human.onResume ?? {}, 'action': outputs.action_taken.values.kind ?? 'none', 'followed_execution': outputs.action_taken.values.follow_id ?? '', 'followed_state': outputs.outcome.values.followed_state ?? '', 'outcome': outputs.outcome.values.result ?? 'triage_error'} | toJson }}"

afterExecution:
  - id: notify_outcome
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: |
      Runs once the final state is known. On 2.0.5 an SLA breach ends the run at once and skips `finally`, so this is
      where the breach is reported. Ignored failures and ordinary errors (already alerted by `errors`) stay quiet.
    runIf: "{{ (labels.remediation_sla ?? '') == 'breached' or (execution.state != 'FAILED' and (labels.remediation_decision ?? 'ignore') != 'ignore') }}"
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: "Failure triage {{ (labels.remediation_sla ?? '') == 'breached' ? 'stopped by the 5-hour SLA, the target was left as it was at that moment' : 'finished' }}: target {{ labels.remediation_target ?? 'n/a' }} ({{ labels.remediation_flow ?? 'n/a' }}), class {{ labels.remediation_class ?? 'n/a' }}, decision {{ labels.remediation_decision ?? 'n/a' }}, outcome {{ labels.remediation_outcome ?? 'n/a' }}. {{ kestra.url ?? inputs.kestra_api_url }}/ui/{{ vars.tenant }}/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"

outputs:
  - id: audit
    type: JSON
    value: "{{ {'decision': outputs.classify.outputs[0].row.decision ?? 'none', 'class': outputs.classify.outputs[0].row.failure_class ?? 'none', 'rule': outputs.classify.outputs[0].row.matched_rule ?? 'none', 'target': outputs.context.values.execution_id ?? '', 'outcome': outputs.outcome.values.result ?? 'triage_error', 'followed_execution': outputs.action_taken.values.follow_id ?? ''} | toJson }}"

extend:
  title: Kestra failed execution triage with budgeted auto-restart and approval
  metaTitle: Auto-Remediate Failed Kestra Executions with Triage | Kestra
  shortDescription: Classify every failed Kestra execution from its error logs, restart transient failures within a per-flow KV budget, ask a human to replay or skip code and data errors, and escalate the rest.
  metaDescription: Flow-triggered triage of failed Kestra executions. Regex rules, budgeted auto-restart, approval to replay or skip, loop-safe labels and an audit.
  description: |
    Most failed executions on a busy Kestra instance are not bugs. A partner API answers 503 for a minute, a rate limit kicks in, a connection resets, and somebody on call clicks Restart. The remaining failures need a person: a broken Pebble expression or a file with a bad row fails again however often it is restarted. This flow does that first-line triage. It reacts to every FAILED execution under a namespace prefix, reads the error logs through the Kestra API, classifies them with a rule table you control, and acts: it restarts transient failures within a budget, asks for an approval to replay or skip code and data errors, and escalates when the budget is used up or an action does not help. Every decision is written to labels and to an audit log line.

    The upstream failure alert blueprints send a message and stop, and `auto-resubmit-failed-executions` re-runs every failed flow blindly. This one looks at why the execution failed before touching it, restarts from the failed task instead of re-running the whole flow, keeps a sliding restart budget, and follows each action until it knows whether it worked. The default is `dry_run: true`: it decides and audits but changes nothing.

    ## How it works

    1. The `on_failed_execution` Flow trigger fires for FAILED executions under `company.team` (children included, `company.teamwork` excluded), except this flow and executions that already carry a `remediation` label.
    2. `get_execution` and `get_error_logs` read the execution and its ERROR lines. When the failed task is a `Subflow` or a `Loop`, `get_linked_logs` also reads the linked executions, where the real error is logged.
    3. `classify` (DuckDB) picks the failed leaf task, keeps the lines of its latest attempt, applies the rules in order and decides: `ignore`, `auto_restart`, `approval` or `escalate`.
    4. `auto_restart` waits `restart_delay`, re-reads the target, reserves a budget slot in KV, labels the target and calls `/actions/restart`. `approval` posts a Slack message and pauses with three choices: `replay` (a new execution from the failed task on the latest flow revision), `skip_failed_task` (mark it WARNING and continue) or `leave_failed`.
    5. `follow_up` polls the restarted, replayed or skipped execution until it finishes. `escalate` raises an ERROR log and a Slack alert for an exhausted budget, a lost budget race, an expired approval or an action that did not fix the failure.

    ## Decisions and safety

    - **Classes**: TRANSIENT (429, 5xx, timeouts, refused or reset connections), DATA (conversion and schema errors), CODE (Pebble and invalid flow errors) and UNKNOWN (no rule matched). Only TRANSIENT is restarted without a human; rules that block an automatic restart come first.
    - **Ignored, with the reason in the audit**: namespaces outside the prefix, this flow's own executions, executions that already have a `remediation` label, `Subflow` children (the parent is triaged with the child's error lines), Loop iterations, and executions that are no longer FAILED.
    - **No chain reactions**: the target is labelled `remediation: auto-restart`, `replay` or `skip` before the action, so its next failure does not fire the trigger, and a replay copies the label. Add `remediation: off` to a flow's labels to opt it out.
    - **Budget**: one KV key per restart with `ttl: budget_window`, so the count is a sliding window (3 per 6 hours by default). `max_auto_restarts: 0` turns it into triage only.
    - **Scope**: the prefix is re-checked in `classify`, and `checks` refuse an empty or wildcard prefix before an execution exists.

    ## What this blueprint teaches

    - **Flow trigger `when` context** (`on_failed_execution`): `when` and trigger `inputs` are rendered with the variables of the execution that failed. Use `flow.namespace`, `flow.id` and `labels`; `trigger.namespace` is undefined there. On 2.0.5 the `startsWith` operator seen in some examples does not parse; the `startsWith()` filter does.
    - **Unparsed inputs on trigger-created executions** (`context`): on 2.0.5 these executions get their input defaults as text (JSON stays a string, BOOL and INT become strings). `context` normalises them once.
    - **KV `ttl` as a sliding-window semaphore** (`count_budget`, `budget_slot`, `reserve_budget`, `confirm_budget`, `release_budget`): write, then verify. The keys sort by timestamp, so when concurrent runs overbook, the latest ones give their slot back.
    - **Flow `checks`** (`checks`): invalid rules and wildcard scopes are rejected with HTTP 422 before an execution exists.
    - **`finally`** (`audit_labels`, `audit_log`): the outcome label and the audit line are written after a success, an ignore, an expired approval or an error.
    - **`sla` and `afterExecution`** (`max_triage_time`, `notify_outcome`): an SLA breach fails the run at once and skips `finally`, so `afterExecution` reports it. The SLA also counts paused and queued time.
    - **`concurrency` with `QUEUE`** (`limit: 10`): a failure storm queues triage runs instead of dropping them; a paused approval holds a slot.
    - **`errors` with `errorLogs()`** (`log_failure`, `alert_failure`) and **`Pause` with `onResume`** (`ask_human`, `apply_approval`).

    ## What you get

    - Transient failures restarted from the failed task, successful tasks kept, and a record of whether the restart worked.
    - Code and data failures held for a human with the evidence line, and a replay that picks up the fix.
    - Labels on the triage execution (`remediation_decision`, `remediation_class`, `remediation_outcome`) and on the target (`remediation`, `remediation_by`), searchable from the Executions page, plus an `audit` flow output.

    ## Who it's for

    - Platform and data teams running Kestra with many scheduled flows and an on-call rotation.

    ## Why orchestrate this with Kestra

    The flow uses Kestra's own API, triggers, labels, KV store and approvals, so the remediation policy is versioned YAML and every decision is an execution you can open.

    ## Prerequisites

    - Kestra 2.0 with the DuckDB and Slack plugins, and an API user that can read executions, logs and flows, and restart, replay and label executions.
    - `kestra_api_url` reachable from the worker. Set the prefix in both the trigger `when` and `watch_namespace_prefix`.

    ### Secrets

    - `KESTRA_API_USERNAME` and `KESTRA_API_PASSWORD`: basic-auth user for the API calls (required).
    - `SLACK_WEBHOOK_URL`: approval and escalation messages (optional; every message is also in the logs).

    ## Quick start

    1. Add the secrets and set your prefix in the trigger `when` and in `watch_namespace_prefix`.
    2. Leave `dry_run: true` for a few days and read the `remediation_*` labels to tune the rules.
    3. Add `inputs: {dry_run: false}` to the trigger to let it act.

    ## How to extend

    - Add rules for your own errors, for example a `(?i)deadlock` rule as TRANSIENT.
    - Send escalations to PagerDuty or open a ticket from the `escalate` branch.

    ## Links

    - [Flow trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.flow), [Pause](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause), [LoopUntil](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loopuntil), [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [Kestra API reference](https://kestra.io/docs/api-reference), [Replay](https://kestra.io/docs/how-to-guides/replay)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Incident Response
    - Day 2 Operations
    - Approval Gates
    - Failure Alerting Mechanics
  ee: false
  demo: false
