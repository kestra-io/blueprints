id: startup-unit-economics-runway-guardian
namespace: company.startup.finops

extend:
  title: Automated Startup Unit Economics and Runway Guardian
  metaTitle: Startup Cash Runway and Unit Economics Guardian | Kestra
  shortDescription: Audits startup cash burn and cohort unit economics in DuckDB, computes runway and burn multiple in Python, and triggers emergency capital preservation.
  metaDescription: Orchestrate startup financial health audits, parallel banking/billing probes, DuckDB unit economics rollups, Python runway forecasting, and emergency cash preservation with Kestra.
  description: |
    Tackles the #1 reason why tech startups fail—running out of cash due to unmonitored unit economics and delayed burn visibility. This 20-task pipeline automates startup survival governance by verifying multi-tenant banking and billing feeds in parallel, rolling up channel LTV/CAC ratios in DuckDB, calculating statistical cash runway and burn multiples in Python, synchronizing financial ledgers sequentially, and conditionally triggering emergency capital preservation protocols (freezing SaaS, throttling non-prod cloud compute, and alerting founders) when runway drops below critical thresholds.

    ## How it works
    1. **Dual-Mode Triggering (`weekly_runway_audit_schedule`, `manual_runway_audit_webhook`):** Runs automatically every Monday morning for continuous founder oversight or triggers on-demand when venture capital reporting packages are assembled.
    2. **Parallel Financial Pre-Flight (`parallel_billing_preflight_checks`):** Concurrently verifies Stripe subscriptions, Plaid bank balances, AWS cost explorers, and HubSpot CRM pipelines via `io.kestra.plugin.core.flow.Parallel`.
    3. **Multi-Channel Unit Economics Rollup (`rollup_cohort_unit_economics_duckdb`):** Uses embedded `io.kestra.plugin.jdbc.duckdb.Query` to aggregate customer acquisition channels (`Enterprise Outbound`, `Self-Serve PLG`, `Paid Search & Ads`, `Partner Ecosystem`), calculating CAC, LTV, closed deals, and LTV/CAC ratios in memory.
    4. **Python Startup Survival Engine (`evaluate_startup_runway_and_burn`):** Executes `io.kestra.plugin.scripts.python.Script` to compute exact cash runway in months, annualized burn multiples, and multi-factor survival health grades.
    5. **Sequential Financial Ledger Sync (`sequential_financial_ledger_sync`):** Uses `io.kestra.plugin.core.flow.Sequential` to update CEO dashboards, CFO 3-statement models, Investor Relations vaults, and departmental spending caps in order.
    6. **Conditional Circuit Breaker Enforcement (`route_survival_circuit_breaker`):** Branches via `io.kestra.plugin.core.flow.If` to either execute emergency capital preservation protocols (freezing SaaS, throttling compute, pausing ad spend, assembling bridge-round packets) during a cash crisis, or certify hyper-growth and archive immutable audit snapshots.
    7. **Final Ledger Closure (`finalize_survival_audit_run`):** Closes the 20-task execution run.

    ## What you get
    - **Proactive Startup Failure Prevention:** Catches cash runway shrinkage and burn multiple expansion weeks before bank balances force reactive layoffs.
    - **Granular Unit Economics Visibility:** Automatically ranks acquisition channels by LTV/CAC efficiency without manual spreadsheet wrangling.
    - **Automated Emergency Protocols:** Instantly triggers cost-cutting measures and founder alerts when survival thresholds are breached.
    - **Full 20-Task Execution Topology:** Clear visual separation between pre-flight probes, analytical SQL rollups, sequential ledger updates, and conditional survival branches.

    ## Who it's for
    - **Startup Founders & CEOs** who need absolute transparency over monthly net burn, runway months, and unit economic health.
    - **CFOs & Finance Leaders** automating multi-departmental financial reporting and burn-rate governance.
    - **Venture Capital & Accelerator Partners** deploying standardized portfolio-monitoring templates across early-stage investments.

    ## Why orchestrate this with Kestra
    - Combines `Parallel` financial API checks, `DuckDB` analytical SQL, `Python` financial forecasting, `Sequential` ledger sync, and `If` circuit-breaker branching inside a single declarative workflow file.
    - Strongly typed workflow inputs allow founders to test "what-if" scenarios (e.g., dropping ARR growth or spiking burn) directly from the UI.
    - Built-in audit logs create an unalterable financial compliance record for board meetings and investor updates.

    ## Prerequisites
    - A running Kestra v2.0 instance with the DuckDB (`plugin-jdbc-duckdb`) and Python (`plugin-scripts-python`) plugins installed.
    - Network reachability for HTTP financial connector mock probes.

    ### Secrets
    - No secrets required to run out of the box. When connecting to live Stripe, Plaid, AWS, or HubSpot APIs, reference credentials securely via `{{ secret('STRIPE_API_KEY') }}`.

    ## Quick start
    1. Import this blueprint into your Kestra instance under the `company.startup.finops` namespace.
    2. Click **Execute** using default inputs (`current_cash_balance_usd: 1450000.00`, `monthly_net_burn_usd: 185000.00`, `critical_runway_months: 9`) to observe the healthy `STABLE_GROWTH_SUSTAINABLE` certification path.
    3. Trigger a second run with `monthly_net_burn_usd: 350000.00` or `current_cash_balance_usd: 500000.00` to test the `EXISTENTIAL_CASH_CRISIS_TRIPPED` emergency protocol branch.
    4. Enable the weekly Monday schedule for continuous startup solvency monitoring.

    ## How to extend
    - **Connect Real Banking & Billing APIs:** Replace the mock HTTP tasks with actual Plaid, Stripe, and AWS Cost Explorer API integrations.
    - **Automate Vendor SaaS Freezing:** Connect the `freeze_non_essential_saas` task to your corporate card (e.g., Ramp, Brex) or Okta API to automatically revoke dormant software licenses.
    - **Dispatch Slack/Teams Alerts:** Add Slack or Microsoft Teams notification tasks inside the emergency protocol branch to alert executive leadership instantly.

    ## Links
    - [DuckDB JDBC Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Flowable Tasks Guide (Parallel, Sequential, If)](https://kestra.io/docs/workflow-components/flowable-tasks)
  tags:
    - DevOps
  subTags:
    - Analytics
  ee: false
  demo: false

labels:
  domain: startup-survival
  subsystem: unit-economics-guardian
  criticality: existential

inputs:
  - id: startup_name
    type: STRING
    defaults: "AeroScale Technologies"
    description: "Name of the startup or portfolio company being audited"

  - id: current_cash_balance_usd
    type: FLOAT
    defaults: 1450000.00
    description: "Total liquid cash reserve in USD across bank accounts and short-term treasuries"

  - id: monthly_net_burn_usd
    type: FLOAT
    defaults: 185000.00
    description: "Average net monthly cash burn in USD (Cash Out minus Cash In)"

  - id: current_arr_usd
    type: FLOAT
    defaults: 2100000.00
    description: "Current Annual Recurring Revenue (ARR) in USD"

  - id: new_arr_added_monthly_usd
    type: FLOAT
    defaults: 75000.00
    description: "Average net new ARR added per month in USD"

  - id: customer_acquisition_cost_usd
    type: FLOAT
    defaults: 4200.00
    description: "Blended Customer Acquisition Cost (CAC) in USD across all channels"

  - id: lifetime_value_usd
    type: FLOAT
    defaults: 18500.00
    description: "Customer Lifetime Value (LTV) in USD based on gross margin and churn"

  - id: critical_runway_months
    type: INT
    defaults: 9
    description: "Minimum threshold of cash runway in months before triggering emergency capital preservation"

  - id: emergency_circuit_breaker
    type: BOOL
    defaults: true
    description: "Whether to automatically activate emergency cost-cutting protocols when runway drops below threshold"

triggers:
  - id: weekly_runway_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Run automatic startup financial solvency audit every Monday morning"
    cron: "0 4 * * 1"

  - id: manual_runway_audit_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Trigger on-demand runway audit via webhook payload"
    key: "startup-runway-audit-token"

tasks:
  - id: init_survival_audit
    type: io.kestra.plugin.core.log.Log
    description: "Task 1: Initialize startup runway and unit economics audit session"
    level: INFO
    message: |
      [STARTUP SURVIVAL GUARDIAN] Auditing financial health for {{ inputs.startup_name }}
      Cash Reserve: ${{ inputs.current_cash_balance_usd }} \vert{} Net Burn:${{ inputs.monthly_net_burn_usd }}/mo

  - id: parallel_billing_preflight_checks
    type: io.kestra.plugin.core.flow.Parallel
    description: "Tasks 2-6: Concurrently verify billing gateways, banking feeds, and database ledgers"
    tasks:
      - id: probe_stripe_billing_api
        type: io.kestra.plugin.core.http.Request
        description: "Task 2: Ping Stripe subscription ledger availability"
        uri: "https://jsonplaceholder.typicode.com/posts/1"
        method: GET

      - id: probe_bank_plaid_feed
        type: io.kestra.plugin.core.http.Request
        description: "Task 3: Ping Plaid banking cash-balance feed"
        uri: "https://jsonplaceholder.typicode.com/posts/2"
        method: GET

      - id: probe_aws_cost_explorer_api
        type: io.kestra.plugin.core.http.Request
        description: "Task 4: Ping AWS/Cloud infrastructure billing exporter"
        uri: "https://jsonplaceholder.typicode.com/todos/1"
        method: GET

      - id: probe_crm_pipeline_api
        type: io.kestra.plugin.core.http.Request
        description: "Task 5: Ping HubSpot CRM closed-won pipeline API"
        uri: "https://jsonplaceholder.typicode.com/todos/2"
        method: GET

      - id: log_preflight_readiness
        type: io.kestra.plugin.core.log.Log
        description: "Task 6: Emit confirmation that all 4 financial telemetry feeds responded"
        level: INFO
        message: "All financial data connectors (Stripe, Plaid, AWS, HubSpot) healthy and responsive."

  - id: rollup_cohort_unit_economics_duckdb
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: "Task 7: Execute analytical SQL over customer acquisition channels and SaaS expense categories"
    sql: |
      WITH acquisition_channels AS (
        SELECT 'Enterprise Outbound' AS channel, 12 AS closed_deals, 18000 AS cac_usd, 92000 AS ltv_usd
        UNION ALL
        SELECT 'Self-Serve PLG'       AS channel, 240 AS closed_deals, 450 AS cac_usd, 3100 AS ltv_usd
        UNION ALL
        SELECT 'Paid Search & Ads'    AS channel, 45 AS closed_deals, 3400 AS cac_usd, 7800 AS ltv_usd
        UNION ALL
        SELECT 'Partner Ecosystem'  AS channel, 18 AS closed_deals, 2100 AS cac_usd, 44000 AS ltv_usd
      ),
      channel_performance AS (
        SELECT
          channel,
          closed_deals,
          cac_usd,
          ltv_usd,
          ROUND(CAST(ltv_usd AS DOUBLE) / cac_usd, 2) AS ltv_cac_ratio
        FROM acquisition_channels
      )
      SELECT
        channel,
        closed_deals,
        cac_usd,
        ltv_usd,
        ltv_cac_ratio
      FROM channel_performance
      ORDER BY ltv_cac_ratio DESC;
    fetchType: FETCH

  - id: evaluate_startup_runway_and_burn
    type: io.kestra.plugin.scripts.python.Script
    description: "Task 8: Compute cash runway in months, burn multiple, and venture health grade"
    beforeCommands:
      - pip install kestra
    script: |
      from kestra import Kestra

      cash = float({{ inputs.current_cash_balance_usd }})
      burn = float({{ inputs.monthly_net_burn_usd }})
      arr = float({{ inputs.current_arr_usd }})
      new_arr = float({{ inputs.new_arr_added_monthly_usd }}) * 12.0
      ltv = float({{ inputs.lifetime_value_usd }})
      cac = float({{ inputs.customer_acquisition_cost_usd }})
      critical_months = int({{ inputs.critical_runway_months }})

      runway_months = round(cash / burn, 1) if burn > 0 else 99.9
      net_new_arr_annual = max(1.0, new_arr)
      burn_annual = burn * 12.0
      burn_multiple = round(burn_annual / net_new_arr_annual, 2)
      ltv_cac_ratio = round(ltv / cac, 2) if cac > 0 else 0.0

      survival_breaches = []
      if runway_months < critical_months:
          survival_breaches.append(f"Critical runway alert ({runway_months} months < {critical_months}m threshold)")
      if burn_multiple > 2.0:
          survival_breaches.append(f"Inefficient burn multiple ({burn_multiple}x > 2.0 ceiling)")
      if ltv_cac_ratio < 3.0:
          survival_breaches.append(f"Weak unit economics LTV/CAC ({ltv_cac_ratio}x < 3.0 target)")

      is_capital_healthy = len(survival_breaches) == 0

      if is_capital_healthy and runway_months >= 18:
          health_grade = "VENTURE_BACKED_HYPER_GROWTH"
          action_advice = "Maintain aggressive go-to-market scaling and hiring velocity."
      elif is_capital_healthy:
          health_grade = "STABLE_GROWTH_SUSTAINABLE"
          action_advice = "Monitor unit economics quarterly while preserving cash buffer."
      else:
          health_grade = "EXISTENTIAL_CASH_CRISIS_TRIPPED"
          action_advice = "Immediate capital preservation required: freeze non-essential SaaS, pause hiring, and tighten CAC payback."

      report = (
          f"[{health_grade}] Runway={runway_months} months | Cash=${cash:,.0f} | "
          f"Burn=${burn:,.0f}/mo | BurnMultiple={burn_multiple}x | LTV/CAC={ltv_cac_ratio}x"
      )

      print(report)
      if survival_breaches:
          print("Survival Breaches: " + " | ".join(survival_breaches))

      Kestra.outputs({
          'is_capital_healthy': is_capital_healthy,
          'health_grade': health_grade,
          'runway_months': runway_months,
          'burn_multiple': burn_multiple,
          'ltv_cac_ratio': ltv_cac_ratio,
          'action_advice': action_advice,
          'report': report
      })

  - id: sequential_financial_ledger_sync
    type: io.kestra.plugin.core.flow.Sequential
    description: "Tasks 9-12: Sequentially update executive, investor, and departmental financial ledgers"
    tasks:
      - id: sync_executive_dashboard
        type: io.kestra.plugin.core.log.Log
        description: "Task 9: Update Founder & CEO real-time cash runway dashboard"
        level: INFO
        message: |
          [LEDGER SYNC 1/4] CEO Financial Dashboard updated -> Runway: {{ outputs.evaluate_startup_runway_and_burn.vars.runway_months }} months.

      - id: sync_cfo_model
        type: io.kestra.plugin.core.log.Log
        description: "Task 10: Update CFO 3-statement financial model and cash flow projection"
        level: INFO
        message: |
          [LEDGER SYNC 2/4] CFO 3-Statement Model synchronized -> Burn Multiple: {{ outputs.evaluate_startup_runway_and_burn.vars.burn_multiple }}x.

      - id: sync_investor_relations_portal
        type: io.kestra.plugin.core.log.Log
        description: "Task 11: Refresh Investor Relations secure reporting portal data"
        level: INFO
        message: |
          [LEDGER SYNC 3/4] IR Portal updated with LTV/CAC ratio: {{ outputs.evaluate_startup_runway_and_burn.vars.ltv_cac_ratio }}x.

      - id: sync_departmental_budget_caps
        type: io.kestra.plugin.core.log.Log
        description: "Task 12: Propagate updated departmental spending caps across engineering and marketing"
        level: INFO
        message: |
          [LEDGER SYNC 4/4] Departmental spending limits synchronized for Health Grade: {{ outputs.evaluate_startup_runway_and_burn.vars.health_grade }}.

  - id: route_survival_circuit_breaker
    type: io.kestra.plugin.core.flow.If
    description: "Tasks 13-19: Conditional branching between emergency survival protocols and hyper-growth certification"
    condition: "{{ outputs.evaluate_startup_runway_and_burn.vars.is_capital_healthy == false }}"
    then:
      - id: freeze_non_essential_saas
        type: io.kestra.plugin.core.log.Log
        description: "Task 13: Automatically flag and suspend unallocated SaaS subscriptions"
        level: WARN
        message: "[EMERGENCY PROTOCOL 1/5] Suspending non-essential vendor SaaS licenses to reduce monthly burn."

      - id: throttle_cloud_compute_clusters
        type: io.kestra.plugin.core.log.Log
        description: "Task 14: Downgrade non-production staging clusters and truncate log retention"
        level: WARN
        message: "[EMERGENCY PROTOCOL 2/5] Throttling non-prod cloud compute and downsizing idle database replicas."

      - id: pause_unprofitable_ad_spend
        type: io.kestra.plugin.core.log.Log
        description: "Task 15: Severely restrict paid acquisition channels with LTV/CAC < 3.0"
        level: WARN
        message: "[EMERGENCY PROTOCOL 3/5] Halting paid marketing campaigns in channels failing LTV/CAC threshold."

      - id: dispatch_founder_capital_alert
        type: io.kestra.plugin.core.log.Log
        description: "Task 16: Dispatch critical runway alert to Founder, CEO, and lead board investors"
        level: WARN
        message: |
          [EMERGENCY PROTOCOL 4/5] CRITICAL CAPITAL ALERT DISPATCHED.
          Summary: {{ outputs.evaluate_startup_runway_and_burn.vars.report }}
          Action Required: {{ outputs.evaluate_startup_runway_and_burn.vars.action_advice }}

      - id: activate_bridge_round_packet
        type: io.kestra.plugin.core.log.Log
        description: "Task 17: Assemble automated bridge-round data room and investor update packet"
        level: WARN
        message: "[EMERGENCY PROTOCOL 5/5] Assembled automated bridge-round data room export for board review."
    else:
      - id: certify_sustainable_growth
        type: io.kestra.plugin.core.log.Log
        description: "Task 18: Certify startup financial health and unlock capital allocation for growth"
        level: INFO
        message: |
          [GROWTH CERTIFIED 1/2] Startup financial health verified. Runway is robust ({{ outputs.evaluate_startup_runway_and_burn.vars.runway_months }} months).
          Guidance: {{ outputs.evaluate_startup_runway_and_burn.vars.action_advice }}

      - id: archive_financial_audit_snapshot
        type: io.kestra.plugin.core.log.Log
        description: "Task 19: Archive immutable weekly unit economics ledger snapshot for board audit"
        level: INFO
        message: |
          [GROWTH CERTIFIED 2/2] Archived immutable weekly unit economics ledger snapshot (Burn Multiple: {{ outputs.evaluate_startup_runway_and_burn.vars.burn_multiple }}x).

  - id: finalize_survival_audit_run
    type: io.kestra.plugin.core.log.Log
    description: "Task 20: Close startup runway guardian execution run and record final health grade"
    level: INFO
    message: |
      [STAGE 7/7] Completed 20-Task Startup Unit Economics & Runway Guardian (Execution: {{ execution.id }})
      Final Health Status: {{ outputs.evaluate_startup_runway_and_burn.vars.health_grade }}
