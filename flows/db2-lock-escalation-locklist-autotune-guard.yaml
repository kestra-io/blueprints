id: db2-lock-escalation-locklist-autotune-guard
namespace: company.team

description: |
  Catch DB2 lock escalation before it turns row locks into table locks and starts timing out
  transactions. Lock escalation fires when the lock memory (LOCKLIST) fills up or one application
  passes MAXLOCKS percent of it, so DB2 trades thousands of row locks for one table lock to free
  memory. That table lock blocks everyone else. This flow reads LOCK_ESCALS from MON_GET_DATABASE
  and MON_GET_WORKLOAD, compares it against a KV baseline from the previous run so a rising count
  is told apart from an old one. It also reads whether LOCKLIST and MAXLOCKS are fixed or AUTOMATIC.
  When escalations are rising while the memory is a fixed value it hands LOCKLIST and MAXLOCKS to
  the self tuning memory manager (or applies a bounded bump) through SYSPROC.ADMIN_CMD, then reads
  the configuration again and fails the run if the change did not land. Read-only by default.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: JDBC URL
    defaults: "jdbc:db2://localhost:50000/testdb"

  - id: jdbc_username
    type: STRING
    displayName: Database user
    defaults: "db2inst1"

  - id: jdbc_password
    type: STRING
    displayName: Database password
    description: Defaults to the DB2_PASSWORD secret. Override per run only for local testing.
    defaults: "{{ secret('DB2_PASSWORD') }}"

  - id: escalation_threshold
    type: INT
    displayName: New escalations that count as rising
    description: Lock escalations added since the previous run that make this run a finding. 1 means any new escalation.
    defaults: 1

  - id: remediation_mode
    type: SELECT
    displayName: Remediation mode
    description: automatic hands LOCKLIST and MAXLOCKS to the self tuning memory manager. bump sets the fixed targets below.
    values:
      - automatic
      - bump
    defaults: automatic

  - id: bump_locklist_pages
    type: INT
    displayName: LOCKLIST target in 4K pages (bump mode)
    description: Fixed LOCKLIST size applied in bump mode. 4096 pages is 16 MB of lock memory.
    defaults: 4096

  - id: bump_maxlocks_percent
    type: INT
    displayName: MAXLOCKS target percent (bump mode)
    description: Percent of LOCKLIST one application may hold before it escalates. Applied in bump mode.
    defaults: 20

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, before the configuration is changed.
    defaults: true

variables:
  baseline_key: "db2_lockescal_baseline_{{ inputs.jdbc_url | replace({'.': '_', '-': '_', ':': '_', '/': '_'}) }}"

  escals_sql: |
    SELECT SUM(LOCK_ESCALS) AS LOCK_ESCALS, SUM(LOCK_TIMEOUTS) AS LOCK_TIMEOUTS,
           SUM(LOCK_WAITS) AS LOCK_WAITS, SUM(DEADLOCKS) AS DEADLOCKS
    FROM TABLE(MON_GET_DATABASE(-2))

  workload_sql: |
    SELECT RTRIM(WORKLOAD_NAME) AS WORKLOAD_NAME, SUM(LOCK_ESCALS) AS LOCK_ESCALS
    FROM TABLE(MON_GET_WORKLOAD(CAST(NULL AS VARCHAR(128)), -2))
    GROUP BY WORKLOAD_NAME
    HAVING SUM(LOCK_ESCALS) > 0
    ORDER BY 2 DESC

  config_sql: |
    SELECT RTRIM(NAME) AS NAME, RTRIM(VALUE) AS VALUE, RTRIM(VALUE_FLAGS) AS VALUE_FLAGS,
           RTRIM(DEFERRED_VALUE) AS DEFERRED_VALUE, RTRIM(DEFERRED_VALUE_FLAGS) AS DEFERRED_VALUE_FLAGS
    FROM SYSIBMADM.DBCFG
    WHERE NAME IN ('locklist', 'maxlocks')
    ORDER BY NAME

tasks:
  - id: read_escals
    type: io.kestra.plugin.jdbc.db2.Query
    description: Read-only. Database wide lock escalation, timeout and wait counts from MON_GET_DATABASE.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ inputs.jdbc_username }}"
    password: "{{ inputs.jdbc_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.escals_sql) }}"

  - id: read_workload
    type: io.kestra.plugin.jdbc.db2.Query
    description: Read-only. Lock escalations per workload from MON_GET_WORKLOAD, so the alert can name what is escalating.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ inputs.jdbc_username }}"
    password: "{{ inputs.jdbc_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.workload_sql) }}"

  - id: read_config
    type: io.kestra.plugin.jdbc.db2.Query
    description: Read-only. The current LOCKLIST and MAXLOCKS values and whether each is fixed or AUTOMATIC.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ inputs.jdbc_username }}"
    password: "{{ inputs.jdbc_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.config_sql) }}"

  - id: assess
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      Compare the escalation count against the KV baseline, read the LOCKLIST and MAXLOCKS state,
      decide the verdict and build the remediation command and the messages.
    values:
      items: >-
        {{ {'esc': outputs.read_escals.rows, 'cfg': outputs.read_config.rows, 'wl': outputs.read_workload.rows,
            'base': (kv(render(vars.baseline_key), errorOnMissing=false) ?? {}),
            'thr': inputs.escalation_threshold, 'mode': inputs.remediation_mode, 'bl': inputs.bump_locklist_pages,
            'bm': inputs.bump_maxlocks_percent, 'ar': inputs.auto_remediate, 'dr': inputs.dry_run,
            'armed': (inputs.auto_remediate and not inputs.dry_run), 'url': inputs.jdbc_url} | jq('
          . as $i
          | ($i.esc[0] // {}) as $e
          | (($e.LOCK_ESCALS // 0) | tonumber) as $cur
          | (($e.LOCK_TIMEOUTS // 0) | tonumber) as $timeouts
          | (($e.LOCK_WAITS // 0) | tonumber) as $waits
          | (($e.DEADLOCKS // 0) | tonumber) as $deadlocks
          | (reduce ($i.cfg // [])[] as $r ({}; .[$r.NAME] = $r)) as $cm
          | ($cm.locklist // {}) as $ll
          | ($cm.maxlocks // {}) as $mx
          | (($ll.VALUE // "0") | tonumber) as $ll_val
          | (($mx.VALUE // "0") | tonumber) as $mx_val
          | (($ll.VALUE_FLAGS // "") == "AUTOMATIC") as $ll_auto
          | (($mx.VALUE_FLAGS // "") == "AUTOMATIC") as $mx_auto
          | ($ll_auto and $mx_auto) as $both_auto
          | ($i.base.escals // null) as $base
          | ($base != null) as $has_base
          | (if $has_base then ($cur - ($base | tonumber)) else null end) as $delta
          | ($has_base and ($delta >= $i.thr)) as $rising
          | (if ($i.wl // []) == [] then [] else [ $i.wl[] | {name: .WORKLOAD_NAME, escals: (.LOCK_ESCALS | tonumber)} ] end) as $wls
          | (if ($has_base | not) then "BASELINE" elif ($rising | not) then "OK" elif $both_auto then "TUNED_ALREADY" else "ACTION" end) as $verdict
          | (if $i.mode == "automatic" then "UPDATE DB CFG USING LOCKLIST AUTOMATIC MAXLOCKS AUTOMATIC" else "UPDATE DB CFG USING LOCKLIST \($i.bl) MAXLOCKS \($i.bm)" end) as $cmd
          | ($verdict == "ACTION" and $i.armed) as $will_change
          | (($verdict == "ACTION") or ($verdict == "TUNED_ALREADY")) as $attention
          | ("DB2 lock escalation on " + $i.url + ": LOCK_ESCALS \($cur)"
             + (if $has_base then " (\(if $delta >= 0 then "+" else "" end)\($delta) since the previous run)" else " (first run, baseline recorded)" end)
             + ". LOCKLIST \($ll_val) pages \(if $ll_auto then "AUTOMATIC" else "fixed" end). MAXLOCKS \($mx_val) percent \(if $mx_auto then "AUTOMATIC" else "fixed" end)."
             + " LOCK_TIMEOUTS \($timeouts). LOCK_WAITS \($waits). DEADLOCKS \($deadlocks)."
             + (if ($wls | length) > 0 then " Escalating workloads: " + ([$wls[] | "\(.name) \(.escals)"] | join("; ")) + "." else "" end)) as $core
          | (if $will_change then "Applying " + $cmd + " now." elif $verdict == "ACTION" then "Fix available: " + $cmd + ". No change applied (auto_remediate=\($i.ar) dry_run=\($i.dr))." elif $verdict == "TUNED_ALREADY" then "LOCKLIST and MAXLOCKS are already AUTOMATIC so a configuration change will not help. Look at the escalating workload." elif $verdict == "BASELINE" then "First run. Baseline recorded. Rerun to measure new escalations." else "No new lock escalations since the baseline." end) as $action
          | {verdict: $verdict, cur_escals: $cur, base_escals: $base, delta: $delta, lock_timeouts: $timeouts,
             lock_waits: $waits, deadlocks: $deadlocks, locklist_pages: $ll_val, locklist_flags: ($ll.VALUE_FLAGS // ""),
             maxlocks_percent: $mx_val, maxlocks_flags: ($mx.VALUE_FLAGS // ""), both_automatic: $both_auto,
             rising: $rising, has_baseline: $has_base, threshold: $i.thr, mode: $i.mode, remediation_cmd: $cmd,
             will_change: $will_change, attention: $attention, workloads: $wls,
             baseline: {escals: $cur, at: (now | floor)},
             report: ($core + " Verdict " + $verdict + ". " + $action),
             slack: ($core + " Verdict " + $verdict + ". " + $action)}
          ') | first | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "{{ fromJson(outputs.assess.values.items) | jq('.report') | first }}"

  - id: record_baseline
    type: io.kestra.plugin.core.kv.Set
    description: >-
      Store this run's LOCK_ESCALS so the next run can measure new escalations. No ttl is set:
      an expired KV key throws on read and would lose the baseline silently.
    key: "{{ render(vars.baseline_key) }}"
    kvType: JSON
    value: "{{ fromJson(outputs.assess.values.items) | jq('.baseline') | first | toJson }}"

  - id: route
    type: io.kestra.plugin.core.flow.If
    description: Alert and consider remediation when escalations are rising. Otherwise log and stop.
    condition: "{{ fromJson(outputs.assess.values.items) | jq('if .attention then 1 else 0 end') | first > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': (fromJson(outputs.assess.values.items) | jq('.slack') | first)} | toJson }}

      - id: planned
        type: io.kestra.plugin.core.log.Log
        description: What a remediation run would do, printed on every attention run including a dry one.
        message: >-
          {{ fromJson(outputs.assess.values.items) | jq('"Fix: " + .remediation_cmd + ". " + (if .will_change then "Running it now." else "No change applied this run (auto_remediate and dry_run gate it)." end)') | first }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        description: The configuration change runs only when the verdict is ACTION, auto_remediate is true and dry_run is false.
        condition: "{{ fromJson(outputs.assess.values.items) | jq('if .will_change then 1 else 0 end') | first > 0 }}"
        then:
          - id: apply_config
            type: io.kestra.plugin.jdbc.db2.Query
            description: Change LOCKLIST and MAXLOCKS through ADMIN_CMD. UPDATE DB CFG is a utility command, not plain SQL.
            url: "{{ inputs.jdbc_url }}"
            username: "{{ inputs.jdbc_username }}"
            password: "{{ inputs.jdbc_password }}"
            fetchType: NONE
            sql: "CALL SYSPROC.ADMIN_CMD(:cmd)"
            parameters:
              cmd: "{{ fromJson(outputs.assess.values.items) | jq('.remediation_cmd') | first }}"

          - id: reverify
            type: io.kestra.plugin.jdbc.db2.Query
            description: Read LOCKLIST and MAXLOCKS again. The run fails if the change did not land.
            url: "{{ inputs.jdbc_url }}"
            username: "{{ inputs.jdbc_username }}"
            password: "{{ inputs.jdbc_password }}"
            fetchType: FETCH
            sql: "{{ render(vars.config_sql) }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            condition: >-
              {{ {'rows': outputs.reverify.rows, 'mode': inputs.remediation_mode, 'bl': inputs.bump_locklist_pages, 'bm': inputs.bump_maxlocks_percent} | jq('
                . as $i
                | (reduce ($i.rows // [])[] as $r ({}; .[$r.NAME] = $r)) as $m
                | ($m.locklist // {}) as $ll | ($m.maxlocks // {}) as $mx
                | (if $i.mode == "automatic" then ((($ll.VALUE_FLAGS // "") != "AUTOMATIC") or (($mx.VALUE_FLAGS // "") != "AUTOMATIC")) else ((($ll.VALUE // "0") | tonumber) < $i.bl) or ((($mx.VALUE // "0") | tonumber) < $i.bm) end)
                | if . then 1 else 0 end') | first > 0 }}
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: >-
                  LOCKLIST and MAXLOCKS did not reach the target after ADMIN_CMD. Current state:
                  {{ outputs.reverify.rows | jq('map("\(.NAME) VALUE \(.VALUE) flags \(.VALUE_FLAGS) deferred \(.DEFERRED_VALUE)") | join("; ")') | first }}.
                  A change that shows only in DEFERRED_VALUE needs the database reactivated.
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: >-
                  {{ {'r': outputs.reverify.rows, 'oll': fromJson(outputs.assess.values.items).locklist_pages, 'omx': fromJson(outputs.assess.values.items).maxlocks_percent, 'ofl': fromJson(outputs.assess.values.items).locklist_flags, 'omf': fromJson(outputs.assess.values.items).maxlocks_flags} | jq('
                    . as $i | (reduce ($i.r // [])[] as $x ({}; .[$x.NAME] = $x)) as $m
                    | ($m.locklist // {}) as $ll | ($m.maxlocks // {}) as $mx
                    | "LOCKLIST was \($i.oll) (\($i.ofl)) now \(($ll.VALUE // "?")) (\(($ll.VALUE_FLAGS // "?"))). MAXLOCKS was \($i.omx) (\($i.omf)) now \(($mx.VALUE // "?")) (\(($mx.VALUE_FLAGS // "?"))). Change verified."
                  ') | first }}
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "{{ fromJson(outputs.assess.values.items) | jq('.report') | first }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'DB2 lock escalation guard failed on ' ~ inputs.jdbc_url ~ ' (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Always runs in safe mode. Hourly gives the baseline a short gap so a fresh burst of escalations shows up.
    cron: "20 * * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: DB2 Lock Escalation LOCKLIST Autotune Guard
  shortDescription: Catch rising DB2 lock escalation while LOCKLIST and MAXLOCKS are a fixed value, alert Slack, then hand them to the self tuning memory manager or apply a bounded bump through ADMIN_CMD and verify the change landed.
  metaTitle: DB2 Lock Escalation LOCKLIST Autotune Guard with Kestra
  metaDescription: Catch rising DB2 lock escalation while LOCKLIST and MAXLOCKS are fixed, alert Slack, then set them through ADMIN_CMD and verify the change landed.
  description: |
    Lock escalation is DB2 trading many row locks for one table lock when the lock memory runs
    low. It happens when `LOCKLIST` (the memory set aside for locks) fills up or when a single
    application holds more than `MAXLOCKS` percent of it. DB2 frees memory by replacing an
    application's row locks on a table with a single table lock. That table lock blocks every
    other transaction that touches the table, so throughput collapses and other statements start
    failing with lock timeouts. The `ALTER`, the load or the batch that caused it all succeeded,
    so nothing points at the cause. The symptom is timeouts somewhere else.

    This blueprint reads `LOCK_ESCALS` from `MON_GET_DATABASE` and `MON_GET_WORKLOAD`, compares it
    against the previous run held in Kestra KV so a rising count is told apart from an old one,
    and reads whether `LOCKLIST` and `MAXLOCKS` are a fixed number or `AUTOMATIC`. When escalations
    are rising while the memory is fixed it hands both parameters to the self tuning memory manager,
    or applies a bounded bump, through `SYSPROC.ADMIN_CMD`, then reads the configuration again and
    fails the run if the change did not land.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Verdict | Rule | Fix |
    |---|---|---|
    | `ACTION` | Escalations rose by at least `escalation_threshold` since the baseline while LOCKLIST or MAXLOCKS is a fixed value | Hand them to the self tuning memory manager or bump the fixed value |
    | `TUNED_ALREADY` | Escalations are rising but LOCKLIST and MAXLOCKS are already `AUTOMATIC` | A config change will not help. Look at the escalating workload or DATABASE_MEMORY |
    | `OK` | Fewer than `escalation_threshold` new escalations since the baseline | None |
    | `BASELINE` | First run against this database, so there is nothing to compare against yet | Rerun to measure new escalations |

    `AUTOMATIC` means the self tuning memory manager sizes the parameter from the overall lock
    memory. A fixed `LOCKLIST` that was set years ago for a smaller workload is the usual cause of
    escalation. The guard only arms remediation on `ACTION`, because flipping an already automatic
    parameter changes nothing.

    ## Safety

    - Read-only by default. The configuration is changed only when `auto_remediate` is true, `dry_run`
      is false and the verdict is `ACTION`. Three conditions, all of them.
    - `LOCKLIST` and `MAXLOCKS` are online configurable, so the change takes effect without bouncing
      the database. The guard still reads the live value back and fails the run if it did not move,
      which catches a change that only landed in `DEFERRED_VALUE`.
    - The baseline advances every run, so each run measures the escalations since the previous one.
      A burst that is already past keeps the next run quiet rather than paging forever.
    - DB2 resets these monitor counters when the database is deactivated. After a restart the first
      run sees a count below the baseline, reads it as no new escalations and records the fresh
      baseline, so a restart never shows up as a false finding.

    ## How it works

    1. `read_escals` (`io.kestra.plugin.jdbc.db2.Query`, read-only) sums `LOCK_ESCALS`,
       `LOCK_TIMEOUTS`, `LOCK_WAITS` and `DEADLOCKS` from `MON_GET_DATABASE`. `read_workload` reads
       `LOCK_ESCALS` per workload from `MON_GET_WORKLOAD`. `read_config` reads the `LOCKLIST` and
       `MAXLOCKS` rows from `SYSIBMADM.DBCFG`, including the `VALUE_FLAGS` that say whether each is
       `AUTOMATIC`.
    2. `assess` (`io.kestra.plugin.core.output.OutputValues`) reads the baseline from Kestra KV,
       works out the escalations added since the last run, decides the verdict, builds the
       `ADMIN_CMD` command for the chosen mode and writes the Slack text.
    3. `summary` logs the report. `record_baseline` (`io.kestra.plugin.core.kv.Set`) stores this
       run's `LOCK_ESCALS` for the next run. No ttl is set, because an expired KV key throws on read.
    4. `route` (`io.kestra.plugin.core.flow.If`) stops with a log when there is nothing rising. On a
       finding it posts `alert` to Slack and `planned` prints what a remediation run would change.
       - `remediate_gate` opens only on `ACTION` with `auto_remediate` true and `dry_run` false.
         `apply_config` runs `CALL SYSPROC.ADMIN_CMD('UPDATE DB CFG USING LOCKLIST ... MAXLOCKS ...')`.
       - `reverify` reads `DBCFG` again and `verify_result` fails the run if the live value did not
         reach the target, otherwise `remediated` logs the before and after.
    5. `errors` posts a Slack alert when the flow fails, for example when the database is unreachable.

    ## What you get

    - The escalation count with the growth since the last run, which is what separates a live
      problem from an old one.
    - The `LOCKLIST` and `MAXLOCKS` state, so you can see at a glance whether the memory is fixed or
      tuned.
    - A safe default that only reports. A one step fix hands the memory to the self tuning manager
      or bumps it, with a second read of the configuration as proof the change landed.

    ## Who it's for

    - DBAs chasing lock timeouts that have no obvious cause in the statement that timed out.
    - Platform teams running DB2 who want lock escalation caught on a schedule rather than by a page.
    - Teams evaluating the DB2 plugin who want an example that reads the monitor functions and drives
      `ADMIN_CMD`.

    ## Why orchestrate this with Kestra

    Rising is a difference between two points in time, so it needs somewhere to keep the last count.
    Kestra KV holds the baseline between runs, the schedule sets how far apart the two points are and
    the destructive half sits behind `auto_remediate` and `dry_run`. The configuration change is
    applied and then checked in the same run, with the whole history kept on the execution.

    ## Tested end to end

    On Kestra 2.0.5 OSS against DB2 Community Edition 12.1.5 (`icr.io/db2_community/db2`), database
    `testdb`, with a local HTTP sink standing in for Slack. Escalation was driven for real by setting
    `LOCKLIST 50 MAXLOCKS 10` with the database activated, then updating every row of a 20000 row
    table in one statement, which forces DB2 to escalate the row locks to a single table lock. Every
    run was checked against the DB2 CLI (`SYSIBMADM.DBCFG`, `MON_GET_DATABASE`) as well as the Kestra
    log.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults, first run | Verdict `BASELINE`. LOCK_ESCALS 0. Baseline recorded, no change |
    | 2 | defaults | Verdict `OK`. +0 escalations, LOCKLIST AUTOMATIC, clean branch |
    | 3 | defaults, after driving escalations | Verdict `ACTION`. +3 escalations, LOCKLIST 50 fixed, alert sent, no change (dry run) |
    | 4 | `auto_remediate: true`, `dry_run: false`, `remediation_mode: automatic` | ADMIN_CMD set both AUTOMATIC, reverify read `AUTOMATIC`, CLI confirmed `locklist AUTOMATIC` and `maxlocks AUTOMATIC` |
    | 5 | `auto_remediate: true`, `dry_run: false`, `remediation_mode: bump` | ADMIN_CMD set LOCKLIST 4096 MAXLOCKS 20, reverify read the new values, CLI confirmed `locklist 4096` with `maxlocks 20` |
    | 6 | unreachable port | `read_escals` failed, the `errors` block posted to Slack, the execution is FAILED |

    The detector was shown to fire only on a real problem by run 2 against run 3. Nothing changed
    between them except the escalations driven under a fixed `LOCKLIST`. The verdict moved from
    `OK` to `ACTION`. The DB2 CLI read `locklist 50 NONE` while `LOCK_ESCALS` climbed, so the fixed
    memory with the rising count were both confirmed outside Kestra.

    ## Prerequisites

    - A DB2 user that can read `MON_GET_DATABASE`, `MON_GET_WORKLOAD` and `SYSIBMADM.DBCFG`, plus
      call `SYSPROC.ADMIN_CMD` to `UPDATE DB CFG` for remediation. The instance owner has all of these.
    - Local testing:
      - `docker run -d --name db2 --privileged -p 50000:50000 -e LICENSE=accept -e DB2INST1_PASSWORD=... -e DBNAME=testdb icr.io/db2_community/db2:latest`;
      - set `LOCKLIST 4 MAXLOCKS 10`, create a table with many rows, then update them all in one
        transaction to drive escalation.

    ### Secrets

    - `DB2_PASSWORD`: the database password, used as the default for the `jdbc_password` input.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:db2://localhost:50000/testdb` | Database to read |
    | `jdbc_username` | `db2inst1` | Database user |
    | `jdbc_password` | `{{ secret('DB2_PASSWORD') }}` | Database password |
    | `escalation_threshold` | `1` | New escalations since the baseline that make a run a finding |
    | `remediation_mode` | `automatic` | `automatic` sets AUTOMATIC. `bump` sets the fixed targets below |
    | `bump_locklist_pages` | `4096` | LOCKLIST size in 4K pages applied in bump mode |
    | `bump_maxlocks_percent` | `20` | MAXLOCKS percent applied in bump mode |
    | `auto_remediate` | `false` | Allow the configuration change |
    | `dry_run` | `true` | Must be `false` for a change to apply |

    ## Quick start

    1. Add the `DB2_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, set `jdbc_url` and `jdbc_username`, then run it. The first run records a
       baseline.
    3. Run it again on your schedule and read the escalation growth and the LOCKLIST state.
    4. When you are ready to act, pick `remediation_mode`, then run with `auto_remediate: true` and
       `dry_run: false`.
    5. Enable the `hourly` trigger, which always runs in safe mode.

    ## How to extend

    - Add a `Pause` before `apply_config` so a human approves the memory change in a busy window.
    - Alert only when the escalations per run pass a higher bar, so a single stray escalation stays
      quiet and a real climb pages someone.
    - Also raise `DATABASE_MEMORY` or turn on `SELF_TUNING_MEM` in bump mode, so the self tuning
      manager has room to grow the lock memory.
    - Loop over several databases or members to cover a whole instance.

    ## Links

    - MON_GET_DATABASE table function: https://www.ibm.com/docs/en/db2/11.5?topic=mgf-mon-get-database-table-function
    - Lock escalation and LOCKLIST: https://www.ibm.com/docs/en/db2/11.5?topic=locks-lock-escalation
