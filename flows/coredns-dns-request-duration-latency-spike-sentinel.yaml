id: coredns-dns-request-duration-latency-spike-sentinel
namespace: company.networking

inputs:
  - id: coredns_metrics_url
    type: STRING
    defaults: "http://coredns.kube-system:9153/metrics"
    description: Prometheus scrape endpoint for Kubernetes CoreDNS.

tasks:
  - id: scrape_coredns_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.coredns_metrics_url }}" > /tmp/coredns_telemetry.txt
        
        # Scrape coredns_dns_request_duration_seconds_sum and count to compute average latency
        SUM=$(grep -E "^coredns_dns_request_duration_seconds_sum" /tmp/coredns_telemetry.txt | awk '{sum+=$2} END {print sum+0}')
        COUNT=$(grep -E "^coredns_dns_request_duration_seconds_count" /tmp/coredns_telemetry.txt | awk '{sum+=$2} END {print sum+0}')
        
        AVG_LATENCY=$(awk -v sum="$SUM" -v count="$COUNT" 'BEGIN {if (count>0) print sum/count; else print 0}')
        echo "::set-output name=avg_latency::$AVG_LATENCY::"

  - id: evaluate_dns_latency
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scrape_coredns_metrics.vars.avg_latency | float > 0.050 }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#networking-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 CoreDNS Elevated Request Latency Alert",
                "text": "CoreDNS at `{{ inputs.coredns_metrics_url }}` recorded an average DNS request duration of *{{ outputs.scrape_coredns_metrics.vars.avg_latency }} seconds* (> 50ms)! Cluster-wide microservice inter-communication is experiencing DNS resolution stalls.",
                "footer": "Kestra Networking Sentinel • CoreDNS"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#networking-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ CoreDNS Sentinel Failure",
            "text": "Failed to scrape CoreDNS metrics endpoint. Verify kube-system network access.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Kubernetes CoreDNS for elevated DNS lookup request duration and upstream forwarder latency spikes."
  metaTitle: Kubernetes CoreDNS Request Latency Spike and Upstream RTT Sentinel with Kestra
  title: Kubernetes CoreDNS Request Latency Spike and Upstream RTT Sentinel
  shortDescription: Audits Kubernetes CoreDNS for elevated DNS lookup request duration and upstream forwarder latency spikes.
  description: |
    ## How it works
    This workflow scrapes the Prometheus metrics endpoint of Kubernetes `CoreDNS` (default port `9153`) to audit DNS request duration metrics (`coredns_dns_request_duration_seconds_sum` and `count`). CoreDNS is the backbone of all intra-cluster service discovery. When upstream resolvers throttle requests or connection conntrack races occur (ndots:5 amplification), DNS resolution times spike from sub-millisecond to hundreds of milliseconds, cascading into microservice connection timeouts. This workflow computes average lookup latency and alerts platform teams before widespread failures occur.

    ## What you get
    - Real-time visibility into Kubernetes internal service discovery latency.
    - Prevents cascading microservice request timeouts caused by slow DNS resolution.
    - Actionable metrics on cluster DNS performance.

    ## Who it's for
    - Kubernetes Administrators and Platform Engineers managing CoreDNS deployments.
    - SREs troubleshooting intermittent inter-pod latency and timeout issues.

    ## Why orchestrate this with Kestra
    - **Automated Infrastructure Auditing**: Regularly verifies internal DNS performance without human intervention.
    - **Independent Verification**: Runs externally from the microservice network path.
    - **Direct Team Alerts**: Delivers diagnostic notifications directly to platform channels.

    ## Prerequisites
    - CoreDNS running with Prometheus plugin enabled (standard in Kubernetes).
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input CoreDNS metrics endpoint URL.
    3. Run the workflow to inspect current DNS resolution latency.

    ## How to extend
    - Query `coredns_forward_requests_total` to isolate upstream DNS provider latencies.
    - Automatically scale CoreDNS deployment replicas using Kubernetes API when latency elevates.

    ## Links
    - [CoreDNS Prometheus Plugin Documentation](https://coredns.io/plugins/metrics/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  verified: false
  demo: false
