id: envoy-downstream-cx-destroy-local-with-reset-sentinel
namespace: company.mesh

inputs:
  - id: envoy_stats_url
    type: STRING
    defaults: "http://envoy-ingress.edge:15000/stats/prometheus"
    description: Prometheus scrape endpoint for Envoy proxy admin interface.
  - id: reset_threshold
    type: INT
    defaults: 20
    description: "Maximum allowable local reset connection counter before alerting (default 20)."

tasks:
  - id: query_envoy_resets
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.envoy_stats_url }}" > /tmp/envoy_telemetry.txt
        
        # Scrape downstream_cx_destroy_local_with_reset metric
        RESETS=$(grep -E "downstream_cx_destroy_local_with_reset" /tmp/envoy_telemetry.txt | awk '{sum+=$2} END {print sum+0}')
        echo "::set-output name=resets::$RESETS::"

  - id: evaluate_resets
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_envoy_resets.vars.resets | int > inputs.reset_threshold }}"
    then:
      - id: notify_gateway_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#service-mesh-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Envoy Proxy Local Connection Resets Alert",
                "text": "Envoy proxy at `{{ inputs.envoy_stats_url }}` recorded *{{ outputs.query_envoy_resets.vars.resets }} local connection resets*! Envoy is prematurely closing client connections due to upstream timeout, buffer overflow, or circuit breaker trips.",
                "footer": "Kestra Service Mesh Sentinel • Envoy"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#service-mesh-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Envoy Sentinel Failure",
            "text": "Failed to scrape Envoy admin stats endpoint. Verify admin port accessibility.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Envoy proxy clusters for downstream connection resets and local circuit breaker trips to detect upstream saturation."
  metaTitle: Envoy Proxy Circuit Breaking and Downstream Connection Reset Sentinel with Kestra
  title: Envoy Proxy Circuit Breaking and Downstream Connection Reset Sentinel
  shortDescription: Audits Envoy proxy clusters for downstream connection resets and local circuit breaker trips to detect upstream saturation.
  description: |
    ## How it works
    This workflow connects to the Envoy Proxy admin stats endpoint (`/stats/prometheus`) to inspect `downstream_cx_destroy_local_with_reset`. This metric increments whenever Envoy terminates a client connection prematurely due to internal circuit breaking limits (`max_connections`, `max_pending_requests`), request buffer overflow, or aggressive stream timeouts. Elevated resets degrade end-user experience with abrupt TCP RST packets and HTTP 503 Service Unavailable responses. The workflow tracks reset volume and dispatches alerts before widespread outages occur.

    ## What you get
    - Real-time detection of abrupt connection terminations at the ingress gateway.
    - Prevents silent client dropouts and broken HTTP/2 streams.
    - Quantitative metric evaluation across ingress proxy instances.

    ## Who it's for
    - Ingress Gateway Engineers and Edge Infrastructure Teams.
    - SREs managing Envoy, Emissary-ingress, or Gloo Edge deployments.

    ## Why orchestrate this with Kestra
    - **Continuous Gateway Auditing**: Monitors ingress proxies on a reliable schedule.
    - **Proactive Anomaly Detection**: Identifies upstream saturation before customer tickets arrive.
    - **Automated Incident Escalation**: Delivers incident notifications with context directly to Slack.

    ## Prerequisites
    - Envoy proxy running with admin interface (`/stats/prometheus`) accessible.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Enter your Envoy stats URL and reset threshold.
    3. Run the workflow to inspect reset counts.

    ## How to extend
    - Inspect `upstream_rq_pending_overflow` to confirm exact circuit breaker saturation.
    - Dynamically tune Envoy connection pool settings using control plane APIs.

    ## Links
    - [Envoy Statistics Overview](https://www.envoyproxy.io/docs/envoy/latest/configuration/overview/stats_overview)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Realtime & Streaming
    - Day 2 Operations
  ee: false
  demo: false
