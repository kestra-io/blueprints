    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [HashiCorp Consul Official Documentation and Architecture Guide](https://developer.hashicorp.com/consul/docs)
    - [Consul Telemetry and Prometheus Metrics Configuration Reference](https://developer.hashicorp.com/consul/docs/agent/telemetry)
    - [Troubleshooting Consul Server Consensus and Autopilot Cluster Health](https://developer.hashicorp.com/consul/tutorials/datacenter-operations/autopilot)
