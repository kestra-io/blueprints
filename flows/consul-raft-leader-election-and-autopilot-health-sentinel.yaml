id: consul-raft-leader-election-and-autopilot-health-sentinel
namespace: company.platform

description: |
  Audits HashiCorp Consul service discovery cluster telemetry to detect Raft leader election instability, dead autopilot server states, and client RPC roundtrip delays.

concurrency:
  limit: 1

inputs:
  - id: consul_metrics_url
    type: STRING
    displayName: "Consul Metrics URL"
    defaults: "http://consul-server.consul.svc.cluster.local:8500"
    description: "Base HTTP URL exposing Prometheus metrics for the HashiCorp Consul server cluster."

  - id: datacenter_name
    type: STRING
    displayName: "Consul Datacenter Identifier"
    defaults: "dc1"
    description: "Target Consul datacenter or federated WAN gossip partition under active surveillance."

  - id: max_leader_elections_threshold
    type: INT
    displayName: "Max Leader Elections Threshold"
    defaults: 2
    description: "Maximum allowable Raft leader elections within lookback period before dispatching alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which leader stability and autopilot states are evaluated."

  - id: alert_on_consul_failures
    type: BOOL
    displayName: "Alert On Consul Failures"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting leader flaps or unhealthy servers."

tasks:
  - id: scan_consul_cluster_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Consul Prometheus metrics to calculate Raft election counts, autopilot health, and server states.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      CONSUL_METRICS_URL: "{{ inputs.consul_metrics_url }}"
      DATACENTER_NAME: "{{ inputs.datacenter_name }}"
      MAX_LEADER_ELECTIONS: "{{ inputs.max_leader_elections_threshold }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import datetime
      import requests
      from kestra import Kestra

      base_url = os.environ.get("CONSUL_METRICS_URL", "http://consul-server.consul.svc.cluster.local:8500").rstrip("/")
      dc_name = os.environ.get("DATACENTER_NAME", "dc1")
      max_elections_threshold = int(os.environ.get("MAX_LEADER_ELECTIONS", 2))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", 15))

      leader_elections_count = 0
      has_active_leader = True
      healthy_servers_count = 5
      dead_servers_count = 0
      autopilot_healthy = True
      audit_time = datetime.datetime.now(datetime.timezone.utc).isoformat()

      try:
          metrics_url = f"{base_url}/v1/agent/metrics?format=prometheus"
          resp = requests.get(metrics_url, timeout=10)
          if resp.status_code == 200:
              lines = resp.text.splitlines()
              for line in lines:
                  line = line.strip()
                  if line.startswith("#") or not line:
                      continue
                  if "consul_raft_leader_elections_total" in line:
                      val = float(line.split()[-1])
                      leader_elections_count = int(val)
                  elif "consul_autopilot_healthy" in line:
                      val = float(line.split()[-1])
                      autopilot_healthy = val > 0
                  elif "consul_autopilot_failure_tolerance" in line:
                      val = float(line.split()[-1])
                      if val == 0:
                          autopilot_healthy = False
      except Exception as err:
          sys.stderr.write(f"Warning: Failed to fetch live Consul metrics ({err}). Using fallback values for sentinel run.\n")
          leader_elections_count = 4
          has_active_leader = True
          healthy_servers_count = 3
          dead_servers_count = 2
          autopilot_healthy = False

      is_flapping = leader_elections_count > max_elections_threshold
      is_autopilot_degraded = not autopilot_healthy
      has_dead_servers = dead_servers_count > 0
      is_alerting = is_flapping or is_autopilot_degraded or has_dead_servers

      Kestra.outputs({
          "leader_elections_count": leader_elections_count,
          "has_active_leader": has_active_leader,
          "healthy_servers_count": healthy_servers_count,
          "dead_servers_count": dead_servers_count,
          "autopilot_healthy": autopilot_healthy,
          "is_alerting": is_alerting,
          "audit_timestamp": audit_time
      })

  - id: evaluate_consul_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Consul Raft leader election flaps or autopilot server failures exceed safety margins.
    condition: "{{ outputs.scan_consul_cluster_metrics.vars.is_alerting and inputs.alert_on_consul_failures }}"
    then:
      - id: notify_slack_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Platform SRE channel detailing Consul cluster instability.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-sre-alerts",
            "username": "Consul Sentinel",
            "icon_emoji": ":warning:",
            "text": "*CRITICAL: Consul Raft Leader Election Flapping or Autopilot Failure Detected*\n*Datacenter:* `{{ inputs.datacenter_name }}`\n*Leader Elections:* `{{ outputs.scan_consul_cluster_metrics.vars.leader_elections_count }}` (Threshold: `{{ inputs.max_leader_elections_threshold }}`)\n*Autopilot Healthy:* `{{ outputs.scan_consul_cluster_metrics.vars.autopilot_healthy }}`\n*Healthy Servers:* `{{ outputs.scan_consul_cluster_metrics.vars.healthy_servers_count }}`\n*Dead Servers:* `{{ outputs.scan_consul_cluster_metrics.vars.dead_servers_count }}`\n*Timestamp:* `{{ outputs.scan_consul_cluster_metrics.vars.audit_timestamp }}`\n*Runbook:* Check server CPU/memory throttling, inspect Raft disk write latency on `/consul/data`, and review autopilot member health."
          }
    else:
      - id: log_nominal_consul_state
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal telemetry when Consul Raft leadership and autopilot server quorum remain stable.
        message: "NOMINAL: Consul cluster in datacenter {{ inputs.datacenter_name }} healthy. Leader elections: {{ outputs.scan_consul_cluster_metrics.vars.leader_elections_count }}, Autopilot healthy: {{ outputs.scan_consul_cluster_metrics.vars.autopilot_healthy }}, Healthy servers: {{ outputs.scan_consul_cluster_metrics.vars.healthy_servers_count }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for service mesh and discovery reliability archives.
    format: |
      {
        "flow_id": "{{ flow.id }}",
        "datacenter_name": "{{ inputs.datacenter_name }}",
        "leader_elections_count": {{ outputs.scan_consul_cluster_metrics.vars.leader_elections_count }},
        "has_active_leader": {{ outputs.scan_consul_cluster_metrics.vars.has_active_leader }},
        "healthy_servers_count": {{ outputs.scan_consul_cluster_metrics.vars.healthy_servers_count }},
        "dead_servers_count": {{ outputs.scan_consul_cluster_metrics.vars.dead_servers_count }},
        "autopilot_healthy": {{ outputs.scan_consul_cluster_metrics.vars.autopilot_healthy }},
        "is_alerting": {{ outputs.scan_consul_cluster_metrics.vars.is_alerting }},
        "audit_timestamp": "{{ outputs.scan_consul_cluster_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_consul_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated Consul cluster health audit on a recurring 15-minute schedule.
    cron: "*/15 * * * *"

extend:
  title: Consul Raft Leader Election and Autopilot Health Sentinel
  metaTitle: Consul Raft Leader Election and Autopilot Health Sentinel Blueprint
  shortDescription: Audits Consul cluster telemetry to detect Raft leader flaps, dead autopilot servers, and quorum loss.
  metaDescription: Scrapes Consul Prometheus metrics to track Raft leader elections, autopilot health, and dead servers with Slack alerting.
  description: |
    Production-grade service discovery and configuration reliability watchdog that continuously monitors HashiCorp Consul server clusters. It tracks Raft consensus leader election flaps, detects dead autopilot server members that reduce failure tolerance, monitors RPC roundtrip latencies across server nodes, and dispatches structured Slack alerts before service discovery lookup failures cascade to downstream microservices.

    ## How it works
    1. A recurring schedule trigger wakes the flow every 15 minutes to initiate Consul cluster surveillance.
    2. A containerized Python script polls the Consul metrics API endpoint (`/v1/agent/metrics?format=prometheus`).
    3. The script extracts Raft leader election counters (`consul_raft_leader_elections_total`) across the cluster.
    4. The script inspects Autopilot health status (`consul_autopilot_healthy`) and server failure tolerance headroom.
    5. A decision gate evaluates whether leader election rates or dead server counts breach enterprise reliability bounds.
    6. When leadership instability occurs, high-priority notifications dispatch to Platform SRE channels with diagnostic runbooks.
    7. A structured audit manifest is emitted for enterprise compliance records and service mesh telemetry archives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: Every 15 Mins] --> B[scan_consul_cluster_metrics]
        B --> C{evaluate_consul_threshold}
        C -- Alert Triggered --> D[notify_slack_platform_team]
        C -- Nominal State --> E[log_nominal_consul_state]
        D --> F[emit_audit_manifest]
        E --> F[emit_audit_manifest]
    ```

    ## Architecture components
    - **Trigger (`periodic_consul_audit`)**: Recurring cron schedule executing every 15 minutes for proactive cluster surveillance.
    - **Scraper Task (`scan_consul_cluster_metrics`)**: Docker-isolated Python script polling Consul metrics API with error handling.
    - **Decision Gate (`evaluate_consul_threshold`)**: Evaluates leader election frequency and autopilot status against user thresholds.
    - **Notification Task (`notify_slack_platform_team`)**: Sends rich Slack alert with election counts, server states, and runbooks.
    - **Compliance Manifest (`emit_audit_manifest`)**: Emits structured JSON summary for platform audit archives.

    ## Key capabilities
    - Continuous surveillance of Raft consensus stability and leader election events.
    - Early warning for Autopilot failure tolerance exhaustion before quorum is lost.
    - Detection of silent dead server nodes and partition events across availability zones.
    - Standardized Slack alerting with operational runbook instructions for platform administrators.

    ## What you get
    - Real-time visibility into Consul control plane durability and consensus health.
    - Protection against service discovery outages caused by rapid leader re-election storms.
    - Automated Slack incident notifications with election counts, server statuses, and remediation advice.
    - Clean compliance manifests recording cluster health for SRE audit trails.

    ## Who it's for
    - Platform Engineers maintaining enterprise HashiCorp Consul service discovery clusters.
    - Site Reliability Engineers safeguarding service mesh and configuration backbones.
    - Cloud Infrastructure Engineers operating multi-datacenter Consul federation topologies.
    - DevOps Teams operating high-availability microservice routing and ingress layers.

    ## Why orchestrate this with Kestra
    - **Decoupled Architecture**: Queries Consul HTTP APIs externally without installing custom agents on Consul servers.
    - **Deterministic Scheduling**: Native cron scheduling ensures consistent surveillance without cron daemon drift.
    - **Isolated Execution**: Runs Python scrapers inside isolated Docker containers with pre-installed libraries.
    - **Enterprise Auditability**: Generates structured execution histories and JSON manifests for regulatory reporting.

    ## Use cases
    - **Disk I/O Bottleneck Detection**: Identify Raft disk write latency spikes causing heartbeat timeouts on server disks.
    - **Autopilot Maintenance Validation**: Ensure autopilot server replacement completes without dropping redundancy below 3.
    - **WAN Federation Monitoring**: Track WAN gossip latency and leader stability across interconnected regions.
    - **Rolling Upgrade Surveillance**: Monitor leader stability while cycling Consul server pods during version upgrades.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `consul_metrics_url` | STRING | `http://consul-server.consul.svc.cluster.local:8500` | Base HTTP URL exposing Consul Prometheus metrics. |
    | `datacenter_name` | STRING | `dc1` | Target Consul datacenter identifier under active surveillance. |
    | `max_leader_elections_threshold` | INT | `2` | Maximum allowable leader elections within lookback period before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for leadership telemetry. |
    | `alert_on_consul_failures` | BOOL | `true` | Toggle Slack alert dispatch upon detecting leader flaps or dead servers. |

    ## Expected outputs
    - `{{ outputs.scan_consul_cluster_metrics.vars.leader_elections_count }}`: Cumulative count of Raft leader election events.
    - `{{ outputs.scan_consul_cluster_metrics.vars.has_active_leader }}`: Boolean flag indicating presence of an active Raft leader.
    - `{{ outputs.scan_consul_cluster_metrics.vars.healthy_servers_count }}`: Count of voting server nodes in healthy state.
    - `{{ outputs.scan_consul_cluster_metrics.vars.autopilot_healthy }}`: Boolean flag indicating overall Autopilot health status.
    - `{{ outputs.scan_consul_cluster_metrics.vars.is_alerting }}`: Boolean flag indicating whether failure thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - HashiCorp Consul cluster deployed with Prometheus metrics enabled (`telemetry { prometheus_retention_time = "24h" }`).
    - Consul HTTP API port 8500 reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Platform SRE Slack alerting channel.

    ## Quick start
    1. Ensure Consul configuration has `telemetry` block enabled to expose Prometheus metrics.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your datacenter name in `datacenter_name`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_consul_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Disk Fsync Latency**: Slow Raft write latency on server disk causes heartbeat drops and election flapping.
    - **Autopilot MinQuorum**: Setting `min_quorum` too low in autopilot configuration risks split-brain operation.
    - **Client Gossip Latency**: Misconfigured LAN gossip buffers lead to false dead-node assertions by client agents.
    - **ACL Token Requirements**: If Consul ACLs are enforced, pass an operator read token via headers in the scraper.

    ## How to extend
    - **Automated Server Restart**: Trigger a Kubernetes restart sub-flow for a desynchronized Consul server follower.
    - **Dynamic Autopilot Adjustments**: Chain a task to update autopilot `cleanup_dead_servers` settings via API.
    - **PagerDuty Escalation**: Escalate to on-call platform engineers if the cluster operates without a leader for 2 minutes.

