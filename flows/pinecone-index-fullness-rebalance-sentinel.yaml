id: pinecone-index-fullness-rebalance-sentinel
namespace: company.ai
description: Audits Pinecone serverless or pod-based vector indexes for storage fullness and capacity limits to prevent vector ingestion rejections.

inputs:
  - id: index_host
    type: STRING
    description: "Pinecone index host (e.g. my-index-12345.svc.us-east-1-aws.pinecone.io)."
  - id: fullness_threshold
    type: FLOAT
    defaults: 0.85
    description: "Maximum acceptable index fullness ratio before alerting (default 0.85 = 85%)."

tasks:
  - id: query_index_stats
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      INDEX_HOST: "{{ inputs.index_host }}"
      API_KEY: "{{ secret('PINECONE_API_KEY') }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      host = os.environ["INDEX_HOST"].replace("https://", "").strip("/")
      api_key = os.environ["API_KEY"]

      url = f"https://{host}/describe_index_stats"
      headers = {
          "Api-Key": api_key,
          "Content-Type": "application/json"
      }

      try:
          resp = requests.post(url, headers=headers, json={}, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as err:
          print(f"Error querying Pinecone describe_index_stats: {err}", file=sys.stderr)
          sys.exit(1)

      fullness = float(data.get("indexFullness", 0.0))
      total_vectors = int(data.get("totalVectorCount", 0))

      print(f"Pinecone stats: indexFullness={fullness}, totalVectors={total_vectors}")
      Kestra.outputs({
          "index_fullness": fullness,
          "total_vectors": total_vectors
      })

  - id: evaluate_index_capacity
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_index_stats.vars.index_fullness >= inputs.fullness_threshold }}"
    then:
      - id: notify_ai_platform
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#ai-platform",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Pinecone Vector Index Fullness Saturated Alert",
                "text": "Pinecone index at `{{ inputs.index_host }}` reached *{{ outputs.query_index_stats.vars.index_fullness }}* fullness (threshold {{ inputs.fullness_threshold }})! Total vector count: *{{ outputs.query_index_stats.vars.total_vectors }}*. Further vector upserts will fail or trigger degradation.",
                "footer": "Kestra AI Sentinel • Pinecone"
              }
            ]
          }

outputs:
  - id: index_fullness
    type: FLOAT
    value: "{{ outputs.query_index_stats.vars.index_fullness }}"
  - id: total_vectors
    type: INT
    value: "{{ outputs.query_index_stats.vars.total_vectors }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#ai-platform",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Pinecone Sentinel Failure",
            "text": "Failed to query Pinecone describe_index_stats API. Verify index host and API key permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: Audits Pinecone serverless or pod-based vector indexes for storage fullness and capacity limits to prevent vector ingestion rejections.
  metaTitle: Pinecone Vector Index Fullness and Pod Capacity Sentinel with Kestra
  title: Pinecone Vector Index Fullness and Pod Capacity Sentinel
  shortDescription: Audits Pinecone serverless or pod-based vector indexes for storage fullness and capacity limits to prevent vector ingestion rejections.
  description: |
    ## How it works
    This workflow executes a containerized POST request against the Pinecone data plane API endpoint (`/describe_index_stats`) using a secure API key to monitor the `indexFullness` metric. When fullness exceeds configured bounds, alerts are dispatched to AI platform teams before storage saturation blocks ingestion.

    ## What you get
    - Proactive capacity auditing for mission-critical Pinecone vector indexes.
    - Prevents ingestion pipeline rejections and vector storage failures.
    - Quantitative metrics on total vector counts across all index namespaces.

    ## Who it's for
    - MLOps and Data Platform Engineers operating Pinecone vector search engines.
    - Developers building generative AI and semantic caching solutions.

    ## Why orchestrate this with Kestra
    - **Automated AI Governance**: Continuously monitors vector capacity alongside model pipelines.
    - **Secure API Authentication**: Safely injects Pinecone credentials using Kestra secret store.
    - **Instant Team Escalation**: Delivers incident notifications with index stats directly to Slack.

    ## Prerequisites
    - Pinecone account with an active vector index and API key.
    - Secrets `PINECONE_API_KEY` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Enter your Pinecone index host URL.
    3. Run the flow to evaluate current index fullness and vector volume.

    ## Links
    - [Pinecone Describe Index Stats API](https://docs.pinecone.io/reference/api/2024-07/data-plane/describe_index_stats)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - AI
    - Cloud
  subTags:
    - Agents & Structured Output
    - Infrastructure Automation
  ee: false
  demo: false
