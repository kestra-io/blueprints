id: pinecone-index-fullness-rebalance-sentinel
namespace: company.ai

inputs:
  - id: index_host
    type: STRING
    description: "Pinecone index host (e.g. my-index-12345.svc.us-east-1-aws.pinecone.io)."
  - id: fullness_threshold
    type: FLOAT
    defaults: 0.85
    description: "Maximum acceptable index fullness ratio before alerting (default 0.85 = 85%)."

tasks:
  - id: query_index_stats
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Pinecone describe_index_stats API
        curl -s -X POST "https://{{ inputs.index_host }}/describe_index_stats"           -H "Api-Key: {{ secret('PINECONE_API_KEY') }}"           -H "Content-Type: application/json" > /tmp/pinecone_telemetry.json
        
        FULLNESS=$(jq '.indexFullness // 0.0' /tmp/pinecone_telemetry.json)
        TOTAL_VECTORS=$(jq '.totalVectorCount // 0' /tmp/pinecone_telemetry.json)
        
        echo "::set-output name=index_fullness::$FULLNESS::"
        echo "::set-output name=total_vectors::$TOTAL_VECTORS::"

  - id: evaluate_index_capacity
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_index_stats.vars.index_fullness | float >= inputs.fullness_threshold }}"
    then:
      - id: notify_ai_platform
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#ai-platform",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Pinecone Vector Index Fullness Saturated Alert",
                "text": "Pinecone index at `{{ inputs.index_host }}` reached *{{ outputs.query_index_stats.vars.index_fullness }}* fullness (threshold {{ inputs.fullness_threshold }})! Total vector count: *{{ outputs.query_index_stats.vars.total_vectors }}*. Further vector upserts will fail or trigger degradation.",
                "footer": "Kestra AI Sentinel • Pinecone"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#ai-platform",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Pinecone Sentinel Failure",
            "text": "Failed to query Pinecone describe_index_stats API. Verify index host and API key permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  title: Pinecone Vector Index Fullness and Pod Capacity Sentinel
  shortDescription: Audits Pinecone serverless or pod-based vector indexes for storage fullness and capacity limits to prevent vector ingestion rejections.
  description: |
    ## How it works
    This workflow executes a POST request against the Pinecone data plane API endpoint (`/describe_index_stats`) using a secure API key to monitor the `indexFullness` metric. In pod-based or provisioned Pinecone deployments, `indexFullness` represents the fraction of allocated memory and disk capacity currently occupied by indexed vector embeddings and namespaces. When fullness exceeds 85–90%, upcoming vector batch upserts fail with out-of-capacity exceptions. This workflow tracks capacity proactively and dispatches alerts before storage saturation blocks ingestion.

    ## What you get
    - Proactive capacity auditing for mission-critical Pinecone vector indexes.
    - Prevents ingestion pipeline rejections and vector storage failures.
    - Quantitative metrics on total vector counts across all index namespaces.

    ## Who it's for
    - MLOps and Data Platform Engineers operating Pinecone vector search engines.
    - Developers building generative AI and semantic caching solutions.

    ## Why orchestrate this with Kestra
    - **Automated AI Governance**: Continuously monitors vector capacity alongside model pipelines.
    - **Secure API Authentication**: Safely injects Pinecone credentials using Kestra secret store.
    - **Instant Team Escalation**: Delivers incident notifications with index stats directly to Slack.

    ## Prerequisites
    - Pinecone account with an active vector index and API key.
    - Secrets `PINECONE_API_KEY` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Enter your Pinecone index host URL.
    3. Run the flow to evaluate current index fullness and vector volume.

    ## How to extend
    - Trigger an automatic pod scaling API call via Pinecone Control Plane API when fullness exceeds thresholds.
    - Correlate with downstream LLM generation throughput.

    ## Links
    - [Pinecone Describe Index Stats API](https://docs.pinecone.io/reference/api/2024-07/data-plane/describe_index_stats)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - AI
    - Cloud
  ee: false
  demo: false
