id: headless-cms-seo-and-media-asset-audit-sentinel
namespace: company.marketing

inputs:
  - id: cms_graphql_endpoint
    type: STRING
    displayName: Headless CMS GraphQL Endpoint
    defaults: "https://spacex-production.up.railway.app/"
    description: Headless CMS GraphQL API endpoint URL (e.g. Strapi, Hygraph, Contentful, or Ghost).

  - id: max_incomplete_tolerance
    type: INT
    displayName: Incomplete Content Tolerance
    defaults: 0
    description: Maximum allowable published articles with missing SEO metadata or media assets before triggering an alert.

  - id: articles_batch_limit
    type: INT
    displayName: Articles Batch Limit
    defaults: 25
    description: Maximum number of recent published articles to evaluate per audit.

triggers:
  - id: daily_seo_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily content quality sweep at 10:00 UTC to assert SEO description and cover image completeness. Shipped disabled by default.
    cron: "0 10 * * *"
    disabled: true

tasks:
  - id: fetch_published_articles
    type: io.kestra.plugin.graphql.Request
    description: Query Headless CMS GraphQL API for published articles, slug paths, meta descriptions, and cover image media references.
    uri: "{{ inputs.cms_graphql_endpoint }}"
    headers:
      Authorization: "Bearer {{ secret('CMS_API_TOKEN') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-CMS-SEO-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query GetPublishedArticles {
        articles(limit: {{ inputs.articles_batch_limit }}) {
          id
          title
          slug
          metaDescription
          coverImage {
            url
          }
        }
      }

  - id: evaluate_seo_completeness
    type: io.kestra.plugin.scripts.python.Script
    description: Parse article objects and isolate any published entries lacking meta descriptions or cover images.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      CMS_DATA: "{{ outputs.fetch_published_articles.body | toJson }}"
    script: |
      import os
      import json

      raw_data = json.loads(os.environ.get("CMS_DATA", "{}"))
      articles = raw_data.get("articles") or []

      # Fallback for nested data structures (e.g. data.articles)
      if isinstance(articles, dict):
          articles = articles.get("nodes") or articles.get("data") or []

      incomplete = []
      for art in articles:
          if not isinstance(art, dict):
              continue

          title = art.get("title") or "Untitled"
          slug = art.get("slug") or str(art.get("id"))
          desc = (art.get("metaDescription") or "").strip()
          cover = art.get("coverImage") or {}
          cover_url = cover.get("url") if isinstance(cover, dict) else None

          missing_fields = []
          if not desc:
              missing_fields.append("Missing metaDescription")
          if not cover_url:
              missing_fields.append("Missing coverImage")

          if missing_fields:
              incomplete.append({
                  "title": title,
                  "slug": slug,
                  "issues": ", ".join(missing_fields)
              })

      summary_lines = [
          f"• *{item['title']}* (`/{item['slug']}`) - *Issues:* {item['issues']}"
          for item in incomplete
      ]
      summary_text = "\\n".join(summary_lines) if summary_lines else "All published articles have complete SEO metadata."

      output_payload = {
          "incomplete_count": len(incomplete),
          "incomplete_articles": incomplete,
          "summary_text": summary_text
      }

      print(f'::{"outputs": {json.dumps(output_payload)}}::')

  - id: evaluate_tolerance_breach
    type: io.kestra.plugin.core.flow.If
    description: Check whether incomplete published articles breach the configured tolerance threshold.
    condition: "{{ outputs.evaluate_seo_completeness.vars.incomplete_count > inputs.max_incomplete_tolerance }}"
    then:
      - id: alert_seo_deficiencies
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority Slack notification itemizing published content lacking required SEO elements.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🔍 *HEADLESS CMS AUDIT: Published Content Missing SEO / Media Assets* 🔍\n\n*Endpoint:* `{{ inputs.cms_graphql_endpoint }}`\n*Incomplete Articles Count:* {{ outputs.evaluate_seo_completeness.vars.incomplete_count }}\n*Tolerance:* <= {{ inputs.max_incomplete_tolerance }}\n\n*Articles Requiring Editorial Updates:*\n{{ outputs.evaluate_seo_completeness.vars.summary_text }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* Marketing & Content editorial teams please supply missing meta descriptions and cover banner images to protect search rankings."
          }
    else:
      - id: log_content_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log clean status when all published articles satisfy SEO and media requirements.
        message: "HEALTHY: All evaluated published articles contain valid meta descriptions and cover image media assets."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for marketing content governance.
    message: "Headless CMS SEO audit completed. Total incomplete articles flagged: {{ outputs.evaluate_seo_completeness.vars.incomplete_count }}."

errors:
  - id: alert_on_cms_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Marketing Ops if Headless CMS GraphQL API query fails or token expires.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Headless CMS Sentinel Error*: Execution `{{ execution.id }}` failed to query endpoint `{{ inputs.cms_graphql_endpoint }}`. Check CMS_API_TOKEN permissions."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.evaluate_seo_completeness.vars.incomplete_count > inputs.max_incomplete_tolerance ? 'SEO_DEFICIENCIES_DETECTED' : 'HEALTHY' }}"
  - id: incomplete_count
    type: INT
    value: "{{ outputs.evaluate_seo_completeness.vars.incomplete_count }}"

extend:
  title: Headless CMS published content SEO and media asset audit sentinel
  metaTitle: Headless CMS SEO & Media Asset Sentinel | Kestra
  shortDescription: Content governance sentinel that queries Headless CMS GraphQL API for published articles missing meta descriptions or cover images, alerting editorial teams.
  metaDescription: Audit headless CMS published articles via GraphQL API for missing meta descriptions and hero media assets, alerting marketing teams in Slack to protect SEO.
  description: |
    Protect organic search traffic, click-through rates, and social card rendering by continuously auditing published content across headless CMS platforms. In agile marketing and content teams using headless content management systems (Strapi, Hygraph, Contentful, Ghost), writers frequently publish new blog articles, landing pages, or documentation guides while accidentally leaving meta descriptions blank or omitting required cover banner images. When published incomplete, search engine crawlers penalize page rankings and social platform sharing generates broken card previews. This blueprint runs a daily audit via the CMS GraphQL API (`io.kestra.plugin.graphql.Request`), asserts that both SEO descriptions and cover image URLs are populated, and dispatches a Slack alert to content editors itemizing incomplete articles.

    ## How it works
    1. A `Schedule` trigger executes an audit daily at 10:00 UTC (shipped disabled by default).
    2. Task `fetch_published_articles` queries the headless CMS GraphQL endpoint (`cms_graphql_endpoint`) using an API bearer token (`CMS_API_TOKEN`). It fetches recent published articles with their titles, slugs, meta descriptions, and cover image media references.
    3. Task `evaluate_seo_completeness` (`io.kestra.plugin.scripts.python.Script`) inspects the returned payload:
       - Articles missing non-empty `metaDescription` values or null `coverImage` references are flagged.
       - The task formats a clickable summary string and exports structured metrics via Kestra's stdout protocol.
    4. Task `evaluate_tolerance_breach` (`io.kestra.plugin.core.flow.If`) posts an itemized Slack alert if incomplete articles exceed `inputs.max_incomplete_tolerance`, or logs a healthy message if all articles are complete.
    5. Top-level `errors` handler catches API connectivity or authentication errors.

    ## What you get
    - Automated daily surveillance over SEO metadata quality across published CMS entries.
    - Prevention of broken OpenGraph social cards and lost search engine visibility.
    - Direct Slack notifications routing content editors straight to affected article slugs.
    - Consistent brand standards and media asset compliance across headless web properties.

    ## Who it's for
    - Content Operations and Editorial Leads managing headless CMS platforms.
    - SEO Specialists protecting organic search ranking signals and CTR.
    - Digital Marketing Managers overseeing multi-author publishing workflows.

    ## Why orchestrate this with Kestra
    Auditing published articles manually across dozens of content collections in headless CMS backends is tedious and prone to human oversight. Kestra provides automated, scheduled orchestration that queries the CMS GraphQL API directly, evaluates field nullability in Python, and alerts editorial channels in Slack without writing or hosting custom webhooks.

    ## Prerequisites
    - A Headless CMS instance (Strapi, Hygraph, Contentful, etc.) exposing a GraphQL API.
    - An API Read Token with permissions to query published content.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `CMS_API_TOKEN`: CMS API bearer token passed in the `Authorization: Bearer` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to receive SEO alerts.

    ## Quick start
    1. Store your CMS API token and Slack webhook in Kestra Secrets (`CMS_API_TOKEN` and `SLACK_WEBHOOK_URL`).
    2. Set `cms_graphql_endpoint` to your CMS GraphQL URL (e.g. `https://cms.mycompany.com/graphql`).
    3. Run a manual execution in Kestra to confirm that published articles are retrieved.
    4. Enable the `daily_seo_audit` schedule to activate automated daily SEO monitoring.

    ## How to extend
    - Extend the GraphQL query to check word counts or validate OpenGraph title character lengths.
    - Automatically generate fallback meta descriptions using an AI ChatCompletion task (`io.kestra.plugin.openai.ChatCompletion`).
    - Integrate with Next.js or Nuxt deployment hooks to revalidate static page paths once edits are applied.

    ## Links
    - [GraphQL Specification: Selection Sets](https://spec.graphql.org/draft/#sec-Selection-Sets)
    - [Kestra GraphQL Plugin](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Python Script Task](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Testing & Quality
  ee: false
  demo: false
