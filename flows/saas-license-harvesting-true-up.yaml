id: saas-license-harvesting-true-up
namespace: company.team

description: |
  Monthly SaaS license review: match every paid seat to the HR file and its last login,
  reclaim seats from leavers and inactive users, downgrade users on a tier above what they
  use, and size each renewal before the true-up date so the contract is not renewed for
  seats nobody uses. Reclaimed seats go back to a pool; the savings are tracked month to
  month in KV.

inputs:
  - id: as_of
    type: STRING
    displayName: Review date
    defaults: "2026-10-01"
    validator: ^\d{4}-\d{2}-\d{2}$

  - id: inactive_days
    type: INT
    displayName: Inactive after (days)
    defaults: 60

  - id: renewal_window_days
    type: INT
    displayName: Size renewals due within (days)
    defaults: 90

  - id: growth_buffer_pct
    type: FLOAT
    displayName: Growth buffer (%)
    description: Seats kept above current active use when sizing a renewal.
    defaults: 10.0

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: ISSUES adds an application with no price and a seat assigned twice, which must stop the review.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

variables:
  state_key: saas_license_reviews
  pack_dir: "saas-licenses/{{ inputs.as_of }}"

concurrency:
  limit: 1

tasks:
  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    values:
      reclaimed: >-
        {{ (kv(vars.state_key, errorOnMissing=false) ?? {'reviews': {}}) | jq('[.reviews | to_entries[] | select(.key < "' ~ inputs.as_of ~ '") | .value.reclaimed[]] | unique') | first | toJson }}

  - id: review
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: applications and contracts, seat assignments, last activity per user
      and the HR file (demo generator or your SaaS management tool, SSO and HRIS), then the seat
      actions, the renewal sizing and the savings.
    outputFiles:
      - actions
      - renewals
      - apps
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE d = DATE '{{ inputs.as_of }}';
      -- The demo usage is fixed, so every review date sees the same company.
      SET VARIABLE anchor = DATE '2026-10-01';

      -- =======================================================================
      -- Applications and contracts. Replace with your SaaS management tool.
      -- =======================================================================
      CREATE TABLE apps (app VARCHAR, tier VARCHAR, price_month DOUBLE, contracted_seats INT, renewal_on DATE, owner VARCHAR, tier_rank INT, family VARCHAR);
      INSERT INTO apps VALUES
        ('Design Suite', 'Pro', 55, 60, getvariable('anchor') + 45, 'design-lead@example.com', 2, 'design'),
        ('Design Suite', 'Viewer', 0, 999, getvariable('anchor') + 45, 'design-lead@example.com', 1, 'design'),
        ('Chat', 'Business', 12.5, 300, getvariable('anchor') + 200, 'it@example.com', 1, 'chat'),
        ('CRM', 'Enterprise', 150, 80, getvariable('anchor') + 70, 'revops@example.com', 2, 'crm'),
        ('CRM', 'Sales', 75, 40, getvariable('anchor') + 70, 'revops@example.com', 1, 'crm'),
        ('Video', 'Pro', 15, 200, getvariable('anchor') + 300, 'it@example.com', 1, 'video'),
        ('BI', 'Creator', 70, 30, getvariable('anchor') + 20, 'data-lead@example.com', 2, 'bi'),
        ('BI', 'Viewer', 10, 150, getvariable('anchor') + 20, 'data-lead@example.com', 1, 'bi');
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO apps VALUES ('Whiteboard', 'Team', NULL, 50, getvariable('anchor') + 30, 'it@example.com', 1, 'wb');
      {% endif %}

      -- HR file.
      CREATE TABLE hr AS
      SELECT 'e' || lpad(i::VARCHAR, 3, '0') AS user_id,
             ['Design', 'Sales', 'Sales', 'Engineering', 'Engineering', 'Support', 'Finance', 'Marketing'][1 + i % 8] AS department,
             CASE WHEN i % 41 = 0 THEN getvariable('anchor') - (5 + i % 50)::INT END AS left_on
      FROM range(1, 261) t(i);

      -- Seat assignments with the user's last activity in the app and, for tiered apps,
      -- whether they used a feature only the higher tier has in the last 90 days.
      CREATE TABLE seats AS
      SELECT a.app, a.tier, h.user_id,
             getvariable('anchor') - (CASE WHEN hash(h.user_id || a.app) % 7 = 0 THEN 70 + hash(h.user_id) % 120 ELSE hash(h.user_id || a.app) % 25 END)::INT AS last_active,
             hash(h.user_id || a.app || 'f') % 3 <> 0 AS used_tier_features
      FROM hr h JOIN apps a ON (
          (a.app = 'Design Suite' AND a.tier = 'Pro' AND h.department IN ('Design', 'Marketing')) OR
          (a.app = 'Chat') OR
          (a.app = 'CRM' AND a.tier = 'Enterprise' AND h.department = 'Sales') OR
          (a.app = 'CRM' AND a.tier = 'Sales' AND h.department = 'Support') OR
          (a.app = 'Video' AND h.department IN ('Sales', 'Support', 'Marketing', 'Design')) OR
          (a.app = 'BI' AND a.tier = 'Creator' AND h.department = 'Finance') OR
          (a.app = 'BI' AND a.tier = 'Viewer' AND h.department IN ('Engineering', 'Marketing')))
      WHERE h.user_id NOT IN ('e007', 'e015');
      -- Seats outside the HR file: a contractor and a test account.
      INSERT INTO seats VALUES ('CRM', 'Enterprise', 'contractor-9', getvariable('anchor') - 3, true), ('BI', 'Creator', 'test-bi', getvariable('anchor') - 200, false);
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO seats VALUES ('Chat', 'Business', 'e010', getvariable('anchor') - 1, true);
      {% endif %}
      -- Seats already reclaimed by an earlier review are gone from the app.
      DELETE FROM seats WHERE app || '|' || tier || '|' || user_id IN (SELECT unnest(from_json('{{ outputs.state.values.reclaimed }}', '["VARCHAR"]')));

      -- =======================================================================
      -- Checks.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'NO_PRICE' AS code, app || ' ' || tier AS ref, 'No monthly price: savings and renewal cost cannot be computed' AS detail FROM apps WHERE price_month IS NULL
      UNION ALL SELECT 'DUPLICATE_SEAT', app || ' ' || user_id, count(*) || ' seats for one user in one app' FROM seats GROUP BY app, user_id HAVING count(*) > 1 AND count(DISTINCT tier) = 1
      UNION ALL SELECT 'UNKNOWN_TIER', app || ' ' || tier, 'Seat on a tier not in the contract list' FROM seats s WHERE NOT EXISTS (SELECT 1 FROM apps a WHERE a.app = s.app AND a.tier = s.tier);

      -- =======================================================================
      -- Seat actions. Leavers and seats with no owner are reclaimed now; inactive
      -- seats are reclaimed after notice; a higher tier unused is downgraded.
      -- =======================================================================
      CREATE TABLE s AS
      SELECT s.*, a.price_month, a.tier_rank, a.family, h.left_on, h.user_id IS NOT NULL AS in_hr,
             date_diff('day', s.last_active, getvariable('d')) AS idle_days,
             (SELECT b.tier FROM apps b WHERE b.app = s.app AND b.tier_rank = a.tier_rank - 1) AS lower_tier,
             (SELECT b.price_month FROM apps b WHERE b.app = s.app AND b.tier_rank = a.tier_rank - 1) AS lower_price
      FROM seats s JOIN apps a USING (app, tier) LEFT JOIN hr h USING (user_id);
      CREATE TABLE actions AS
      SELECT app, tier, user_id, idle_days,
             CASE WHEN left_on IS NOT NULL THEN 'RECLAIM_LEAVER'
                  WHEN NOT in_hr THEN 'RECLAIM_NO_OWNER'
                  WHEN idle_days > {{ inputs.inactive_days }} THEN 'RECLAIM_INACTIVE'
                  WHEN lower_tier IS NOT NULL AND NOT used_tier_features THEN 'DOWNGRADE' END AS action,
             CASE WHEN left_on IS NOT NULL THEN 'Left on ' || left_on
                  WHEN NOT in_hr THEN 'Not in the HR file'
                  WHEN idle_days > {{ inputs.inactive_days }} THEN 'No activity for ' || idle_days || ' days: notify, reclaim after 7 days'
                  ELSE 'No ' || tier || ' feature used in 90 days: move to ' || lower_tier END AS reason,
             round(CASE WHEN left_on IS NOT NULL OR NOT in_hr OR idle_days > {{ inputs.inactive_days }} THEN price_month
                        ELSE price_month - lower_price END * 12, 2) AS annual_saving
      FROM s
      WHERE left_on IS NOT NULL OR NOT in_hr OR idle_days > {{ inputs.inactive_days }} OR (lower_tier IS NOT NULL AND NOT used_tier_features);

      -- =======================================================================
      -- Renewal sizing: seats really needed = active seats after the actions,
      -- plus the downgrades moving in, plus the growth buffer.
      -- =======================================================================
      CREATE TABLE per_tier AS
      SELECT a.app, a.tier, a.price_month, a.contracted_seats, a.renewal_on, a.owner,
             (SELECT count(*) FROM s WHERE s.app = a.app AND s.tier = a.tier) AS assigned,
             (SELECT count(*) FROM s JOIN actions x USING (app, tier, user_id) WHERE s.app = a.app AND s.tier = a.tier) AS leaving,
             (SELECT count(*) FROM actions x JOIN s USING (app, tier, user_id) WHERE x.action = 'DOWNGRADE' AND s.app = a.app AND s.lower_tier = a.tier) AS arriving
      FROM apps a;
      CREATE TABLE renewals AS
      SELECT *, assigned - leaving + arriving AS needed,
             CASE WHEN contracted_seats >= 999 THEN NULL ELSE ceil((assigned - leaving + arriving) * (1 + {{ inputs.growth_buffer_pct }} / 100))::INT END AS renew_at,
             CASE WHEN contracted_seats >= 999 THEN 0 ELSE greatest(0, contracted_seats - ceil((assigned - leaving + arriving) * (1 + {{ inputs.growth_buffer_pct }} / 100)))::INT END AS seats_to_cut,
             renewal_on BETWEEN getvariable('d') AND getvariable('d') + {{ inputs.renewal_window_days }} AS renewal_due
      FROM per_tier;
      ALTER TABLE renewals ADD COLUMN contract_saving DOUBLE;
      UPDATE renewals SET contract_saving = round(seats_to_cut * price_month * 12, 2);

      COPY (SELECT * FROM actions ORDER BY action, app, user_id) TO '{{ outputFiles.actions }}' (HEADER, DELIMITER ',');
      COPY (SELECT app, tier, owner, renewal_on, contracted_seats, assigned, leaving, arriving, needed, renew_at, seats_to_cut, contract_saving
            FROM renewals WHERE renewal_due AND contracted_seats < 999 ORDER BY renewal_on, app, tier) TO '{{ outputFiles.renewals }}' (HEADER, DELIMITER ',');
      COPY (SELECT app, tier, contracted_seats, assigned, round(100.0 * (assigned - leaving) / nullif(assigned, 0), 1) AS utilization_pct, price_month FROM renewals ORDER BY app, tier) TO '{{ outputFiles.apps }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM s)::INT AS seats,
        (SELECT string_agg(action || ' ' || n, ', ' ORDER BY action) FROM (SELECT action, count(*) AS n FROM actions GROUP BY action)) AS actions,
        (SELECT format('{:,.0f}', coalesce(sum(annual_saving), 0)::DOUBLE) FROM actions) AS seat_saving,
        (SELECT coalesce(string_agg(app || ' ' || tier || ' renews ' || renewal_on || ': ' || contracted_seats || ' -> ' || renew_at || ' seats', '; ' ORDER BY renewal_on, app, tier), '')
           FROM renewals WHERE renewal_due AND contracted_seats < 999) AS renewals,
        (SELECT format('{:,.0f}', coalesce(sum(contract_saving), 0)::DOUBLE) FROM renewals WHERE renewal_due) AS contract_saving,
        (SELECT coalesce(string_agg(app || ' ' || tier, ', '), '') FROM renewals WHERE contracted_seats < 999 AND assigned - leaving + arriving > contracted_seats) AS over_contract,
        (SELECT to_json(coalesce(list(app || '|' || tier || '|' || user_id ORDER BY app, user_id), [])) FROM actions WHERE action IN ('RECLAIM_LEAVER', 'RECLAIM_NO_OWNER'))::VARCHAR AS reclaimed_now,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref, ', ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.review.outputs | last).row | toJson }}"

  - id: log_review
    type: io.kestra.plugin.core.log.Log
    message: |
      SaaS license review {{ inputs.as_of }} ({{ inputs.scenario }}): {{ outputs.result.values.r | jq('"\(.seats) seats. Actions: \(.actions). Seat savings \(.seat_saving) a year."') | first }}
      {{ outputs.result.values.r | jq('"Renewals in the window: \(if .renewals == "" then "none" else .renewals end). Contract savings \(.contract_saving) a year."') | first }}
      {{ outputs.result.values.r | jq('if .over_contract == "" then "" else "Over contract, true-up exposure: \(.over_contract)" end') | first }}
      Blockers: {{ outputs.result.values.r | jq('.blockers') | first }} {{ outputs.result.values.r | jq('.blocker_detail') | first }}

  - id: evidence_blockers
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.review.outputFiles.blockers }}"

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.blockers > 0') | first }}"
    then:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "License review stopped: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/actions.csv": "{{ outputs.review.outputFiles.actions }}"
      "{{ render(vars.pack_dir) }}/renewals.csv": "{{ outputs.review.outputFiles.renewals }}"
      "{{ render(vars.pack_dir) }}/apps.csv": "{{ outputs.review.outputFiles.apps }}"

  - id: save
    type: io.kestra.plugin.core.kv.Set
    description: Leaver and no-owner seats are reclaimed at once, so the next review no longer sees them. Inactive seats wait for the notice period.
    key: "{{ vars.state_key }}"
    kvType: JSON
    value: >-
      {{ {'old': (kv(vars.state_key, errorOnMissing=false) ?? {'reviews': {}}), 'at': inputs.as_of, 'r': fromJson(outputs.result.values.r)}
         | jq('{reviews: (.old.reviews + {(.at): {reclaimed: (.r.reclaimed_now | fromjson), seat_saving: .r.seat_saving, contract_saving: .r.contract_saving}})}') | first | toJson }}

triggers:
  - id: monthly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 1 * *"
    disabled: true
    inputs:
      as_of: "{{ trigger.date | date('yyyy-MM-dd') }}"

extend:
  title: Reclaim unused SaaS seats and right-size renewals before the true-up date
  metaTitle: SaaS license harvesting and renewal true-up with Kestra and DuckDB
  shortDescription: Match every paid seat to HR and last login, reclaim seats from leavers, unknown and inactive users, downgrade unused premium tiers, and size each renewal on real use before it is signed.
  metaDescription: SaaS license review in Kestra and DuckDB. Reclaim leaver and inactive seats, downgrade unused tiers, size renewals and flag true-up exposure.
  description: |
    A company with a few hundred people usually pays for many seats nobody uses: people who left, people who logged in once, and premium tiers bought for features that are never opened. The money is lost twice: every month on the seats, then again at renewal, when the contract is signed for the same count because nobody had the numbers on time.

    This flow runs every month. It reviews every paid seat, reclaims or downgrades what is not used, and sizes each renewal coming up in the next 90 days on real use.

    It runs with no setup and no network. The demo has 260 employees and five applications with eight tiers. It includes leavers, a contractor and a test account outside HR, inactive users, premium users who never use the premium features, and two renewals due this month.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Seat actions

    | Action | Rule | Saving |
    |---|---|---|
    | `RECLAIM_LEAVER` | The user has left according to HR | The seat, at once |
    | `RECLAIM_NO_OWNER` | The account is not in the HR file (contractor, test account) | The seat, at once |
    | `RECLAIM_INACTIVE` | No activity for `inactive_days` | The seat, after a 7-day notice |
    | `DOWNGRADE` | Higher tier, and no feature of that tier used in 90 days | The price difference |

    ## Renewal sizing

    For each tier renewing within `renewal_window_days`:
    - seats needed = seats assigned - seats leaving + downgrades arriving from the tier above;
    - renew at = seats needed + `growth_buffer_pct`, rounded up;
    - seats to cut = contracted seats - renew at.

    A tier whose need is above its contract is reported as true-up exposure. Downgrades can push the lower tier over its contract, as in the demo's CRM Sales tier: buy those seats before the true-up, at the contract price.

    ## How it works

    1. `state` loads the seats reclaimed by earlier reviews.
    2. `review` (`io.kestra.plugin.jdbc.duckdb.Queries`) holds the contracts, seats, last activity and HR file. It checks the data, then builds the seat actions, the renewal sizing and the utilization per tier.
    3. `log_review` prints the result. `evidence_blockers` stores `blockers.csv`.
    4. `gate` stops on blockers before any other file is written: a tier with no price, a user with two seats on the same tier, a seat on a tier not in the contract list. Otherwise `evidence` stores `actions.csv`, `renewals.csv` and `apps.csv`.
    5. `save` (`io.kestra.plugin.core.kv.Set`) records the seats reclaimed at once. The next review no longer counts them.

    ## Tested end to end

    On Kestra 2.0.5 OSS.

    | Run | Review date | Result |
    |---|---|---|
    | 1 | 2026-10-01 | 708 seats: 15 leavers, 2 with no owner, 88 inactive, 40 downgrades. Seat savings 67,500 a year. 5 tiers renewing: BI Creator 30 to 26, BI Viewer 150 to 100, Design Suite Pro 60 to 47, CRM Enterprise 80 to 47. CRM Sales needs 50 against 40 contracted. Contract savings 77,340 |
    | 2 | 2026-11-01 | 691 seats: the 17 seats reclaimed in October are gone. The October BI renewals are past and no longer listed. Contract savings 67,980 on the 3 remaining |
    | 3 | `ISSUES` | Blocked: Whiteboard has no price, and one user has two Chat seats |

    I recomputed every saving, and the sizing of the 8 renewals in both months, independently in Python from `actions.csv` and `renewals.csv`: every value matches.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `as_of` | `2026-10-01` | Review date |
    | `inactive_days` | `60` | Inactive threshold |
    | `renewal_window_days` | `90` | Renewals sized ahead of time |
    | `growth_buffer_pct` | `10.0` | Seats kept above use |
    | `scenario` | `CLEAN` | Demo only |

    ## Use it with your data

    - Replace `apps`, `seats` and `hr` with your SaaS management tool or the admin APIs of each application, your SSO last-login data and your HRIS.
    - Remove the reclaimed seats through the application's SCIM or admin API from a task after `save`, and send the inactive users their notice.
    - Send `renewals.csv` to procurement, and put the owner of each tier in the loop.

    ## Things to know

    - Last activity comes from the application, not from SSO: a user can sign in every day and never open the tool.
    - Annual contracts usually allow a reduction only at renewal. Reclaimed seats then go back to the pool for new joiners, and the saving shows at the next renewal.

    ## Links

    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb
    - KV store: https://kestra.io/docs/concepts/kv-store
  tags:
    - Business
    - Data
  subTags:
    - Reporting & Digests
    - Scheduling
  ee: false
  demo: true
