id: website-sensitive-file-exposure-audit
namespace: company.team
description: |
  Probe your own websites for files that should never be public: an exposed `.git` directory, `.env`
  files, cloud credentials, database dumps, Spring Boot actuator or PHP info pages, and directory
  listings. Each check matches the file's content, not just the status code, so soft-404 pages do not
  raise false alarms. New exposures and fixes are posted to Slack.

inputs:
  - id: sites
    type: JSON
    displayName: Sites to audit
    description: List of objects with a base URL you own and an owner to mention.
    defaults: |
      [
        {"url": "https://www.example.com", "owner": "@web-team"}
      ]

  - id: timeout_seconds
    type: INT
    displayName: Request timeout (seconds)
    defaults: 10

tasks:
  - id: for_each_site
    type: io.kestra.plugin.core.flow.Loop
    description: Audit every site independently, two at a time to stay gentle on the servers.
    values: "{{ inputs.sites }}"
    concurrencyLimit: 2
    tasks:
      - id: load_previous
        type: io.kestra.plugin.core.kv.Get
        description: Exposures reported at the last run. Missing on the first run.
        key: "exposure_audit_{{ fromJson(item.value).url | slugify }}"
        errorOnMissing: false

      - id: probe
        type: io.kestra.plugin.scripts.python.Script
        description: Request each well-known sensitive path and confirm a finding only when the content matches.
        containerImage: python:3.12-slim
        inputFiles:
          site.json: "{{ item.value }}"
          previous.json: "{{ (outputs.load_previous.value ?? {}) | toJson }}"
        script: |
          import json
          import re
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          def load(name):
              with open(name, encoding="utf-8") as f:
                  data = json.load(f)
              return json.loads(data) if isinstance(data, str) else data

          site = load("site.json")
          previous = load("previous.json") or {}
          base = site["url"].rstrip("/")

          # (path, severity, what it exposes, content check on the first 64 KB)
          CHECKS = [
              ("/.git/HEAD", "critical", "Git repository: the full source history can be downloaded",
               lambda b: re.match(rb"^(ref: refs/|[0-9a-f]{40}\s*$)", b)),
              ("/.git/config", "critical", "Git config, often with the remote URL and credentials",
               lambda b: b"[core]" in b),
              ("/.env", "critical", "Environment file with secrets",
               lambda b: len(re.findall(rb"(?m)^[A-Z][A-Z0-9_]{2,}=", b)) >= 2),
              ("/.aws/credentials", "critical", "AWS access keys",
               lambda b: b"aws_access_key_id" in b.lower()),
              ("/backup.sql", "critical", "Database dump",
               lambda b: re.search(rb"(CREATE TABLE|INSERT INTO)", b, re.I)),
              ("/dump.sql", "critical", "Database dump",
               lambda b: re.search(rb"(CREATE TABLE|INSERT INTO)", b, re.I)),
              ("/wp-config.php.bak", "critical", "WordPress config backup with database password",
               lambda b: b"DB_PASSWORD" in b),
              ("/actuator/env", "high", "Spring Boot actuator environment (configuration and secrets)",
               lambda b: b"propertySources" in b),
              ("/phpinfo.php", "high", "phpinfo() page with server configuration",
               lambda b: b"PHP Version" in b and b"phpinfo" in b.lower()),
              ("/server-status", "high", "Apache server-status with live requests and client IPs",
               lambda b: b"Apache Server Status" in b),
              ("/.DS_Store", "medium", "macOS folder index that lists file names",
               lambda b: b[4:8] == b"Bud1"),
              ("/", "medium", "Directory listing",
               lambda b: re.search(rb"<title>\s*(Index of /|Directory listing for /)", b, re.I)),
          ]

          def fetch(path):
              req = urllib.request.Request(base + path, headers={
                  "User-Agent": "kestra-exposure-audit (authorized self-check)", "Range": "bytes=0-65535"})
              try:
                  with urllib.request.urlopen(req, timeout={{ inputs.timeout_seconds }}) as r:
                      return r.status, r.read(65536)
              except urllib.error.HTTPError as e:
                  return e.code, b""

          findings = {}
          reachable = False
          for path, severity, what, matches in CHECKS:
              try:
                  status, body = fetch(path)
              except Exception as e:
                  print(f"{path}: unreachable ({e.__class__.__name__})")
                  continue
              reachable = True
              if status in (200, 206) and matches(body):
                  findings[path] = f"*{severity}* `{base}{path}`: {what}."

          try:
              status, body = fetch("/.well-known/security.txt")
              m = re.search(rb"(?im)^Expires:\s*(\S+)", body) if status in (200, 206) else None
              if m:
                  expires = datetime.fromisoformat(m.group(1).decode().replace("Z", "+00:00"))
                  if expires < datetime.now(timezone.utc):
                      findings["security.txt"] = f"*low* `{base}/.well-known/security.txt` expired on {expires.date()} (RFC 9116), so researchers may ignore it."
          except Exception:
              pass

          if not reachable:
              raise SystemExit(f"{base} could not be reached at all; check the URL.")

          new = [findings[k] for k in findings if k not in previous]
          resolved = [previous[k] for k in previous if k not in findings]
          print(f"{base}: {len(findings)} exposures ({len(new)} new, {len(resolved)} resolved)")
          print("::" + json.dumps({"outputs": {
              "new": new,
              "resolved": resolved,
              "notify": bool(new or resolved),
              "critical": any("*critical*" in f for f in new),
              "findings": findings,
          }}) + "::")

      - id: if_changed
        type: io.kestra.plugin.core.flow.If
        description: Only post when an exposure appears or is fixed.
        condition: "{{ outputs.probe.vars.notify }}"
        then:
          - id: alert_owner
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Post the confirmed exposures and the fixed ones.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: |
              {{ outputs.probe.vars.critical ? ':rotating_light:' : (outputs.probe.vars.new | length > 0 ? ':warning:' : ':white_check_mark:') }} *Sensitive file audit: {{ fromJson(item.value).url }}* (owner: {{ fromJson(item.value).owner }})
              {% for f in outputs.probe.vars.new %}- {{ f }}
              {% endfor %}{% for f in outputs.probe.vars.resolved %}- Fixed: {{ f }}
              {% endfor %}{{ outputs.probe.vars.new | length > 0 ? 'Block the path at the web server or CDN, then rotate any secret it contained: assume it has already been copied.' : '' }}

      - id: remember_findings
        type: io.kestra.plugin.core.kv.Set
        description: Store the current exposures so each one is posted once. Runs after the alert.
        key: "exposure_audit_{{ fromJson(item.value).url | slugify }}"
        kvType: JSON
        overwrite: true
        value: "{{ outputs.probe.vars.findings | toJson }}"

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: A site that cannot be audited must not look clean.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":warning: Sensitive file audit failed in execution {{ execution.id }} ({{ flow.namespace }}.{{ flow.id }}). Open the failed loop iteration: the site may be down or the URL wrong."

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: A bad deploy can expose files at any time; check daily. Disabled until the Slack secret is set.
    cron: "0 5 * * *"
    disabled: true

extend:
  title: Find Exposed .git, .env and Database Dumps on Your Websites
  shortDescription: Probe your own sites daily for exposed .git directories, .env files, credentials, dumps and debug pages, confirmed by content, and post new exposures to Slack.
  metaTitle: Website Sensitive File Exposure Audit
  metaDescription: Probe your websites daily for exposed .git folders, .env files, cloud keys, SQL dumps and debug pages, confirmed by content, and alert in Slack.
  description: |
    A deploy that copies the whole project folder to the web root, a misconfigured CDN rule, or a
    forgotten debug endpoint can make secrets downloadable by anyone. Scanners on the internet look
    for these paths within hours. This blueprint looks first, on the sites you own, every day.

    It requests a short list of well-known sensitive paths and confirms each finding by its
    content, so a site that answers `200` to every URL (a soft 404) does not cause false alarms:

    | Path | Severity | Confirmed when the response contains |
    | --- | --- | --- |
    | `/.git/HEAD`, `/.git/config` | critical | `ref: refs/` or a commit hash; `[core]` |
    | `/.env` | critical | at least two `NAME=value` lines |
    | `/.aws/credentials` | critical | `aws_access_key_id` |
    | `/backup.sql`, `/dump.sql` | critical | `CREATE TABLE` or `INSERT INTO` |
    | `/wp-config.php.bak` | critical | `DB_PASSWORD` |
    | `/actuator/env` | high | `propertySources` (Spring Boot) |
    | `/phpinfo.php` | high | the phpinfo() page |
    | `/server-status` | high | Apache Server Status |
    | `/.DS_Store` | medium | the `Bud1` file signature |
    | `/` | medium | a directory listing (`Index of /`, or Python's `Directory listing for /`) |

    It also reports a `/.well-known/security.txt` whose `Expires` date has passed (RFC 9116).
    Each exposure is posted once, and again when it is fixed.

    Only audit sites you own or are authorized to test. Requests identify themselves with the
    `kestra-exposure-audit (authorized self-check)` user agent, read at most 64 KB, and run two
    sites at a time.

    ## How it works

    For each entry in `sites` (Loop, two at a time):

    1. `load_previous` reads the exposures reported at the last run from the Kestra KV store.
    2. `probe` requests each path and keeps only the confirmed findings.
    3. `if_changed` skips Slack when nothing changed.
    4. `alert_owner` posts new exposures, ranked by severity, and fixed ones.
    5. `remember_findings` stores the findings, after the alert.

    A site that cannot be reached at all fails its own iteration, and the `errors` branch reports it.

    ## Prerequisites

    - A Slack Incoming Webhook.
    - Network access from the Kestra worker to the sites (public sites, or internal ones from an
      internal worker).

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alerts and failures.

    In the open-source edition, secrets are environment variables on the Kestra container,
    prefixed with `SECRET_` and base64-encoded. See
    [how to manage secrets](https://kestra.io/docs/concepts/secret).

    ## Inputs

    - `sites` (JSON): list of `{"url", "owner"}` objects. Include every hostname that serves its
      own files (the main site, docs, marketing pages, admin panels, staging).
    - `timeout_seconds` (INT, default `10`): the timeout per request.

    ## Quick start

    1. Add the Slack secret and replace the example sites with yours.
    2. Execute the flow. Any exposure that exists today is posted.
    3. Enable `daily`. To add a path, append a line to `CHECKS` in `probe` with its content check.

    When something is found, block the path at the web server or CDN first, then rotate every
    secret the file contained, because it may already have been copied.

    ## Outputs

    - `{{ outputs.probe.vars }}` per iteration: `findings` (path to description), `new`, `resolved`.
    - KV entries `exposure_audit_<site>`: the exposures already reported.

    ## Links

    - [OWASP: Review webserver metafiles for information leakage](https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/01-Information_Gathering/03-Review_Webserver_Metafiles_for_Information_Leakage)
    - [RFC 9116: security.txt](https://www.rfc-editor.org/rfc/rfc9116)
    - [Spring Boot actuator endpoint security](https://docs.spring.io/spring-boot/reference/actuator/endpoints.html#actuator.endpoints.security)
    - [Kestra Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Kestra KV store](https://kestra.io/docs/concepts/kv-store)
    - [Slack Incoming Webhook task](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)

    - This blueprint has been created by [StarKnightt](https://github.com/StarKnightt)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
