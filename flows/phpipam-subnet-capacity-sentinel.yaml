id: phpipam-subnet-capacity-sentinel
namespace: company.team
description: |
  On a schedule, read-only fetch a phpIPAM subnet's usage statistics
  (nothing is created, updated, or deleted) and classify its free address
  capacity as HEALTHY, WARNING, CRITICAL, or UNREACHABLE. Log clean runs
  and page Slack the moment a subnet is close to IP exhaustion.

inputs:
  - id: phpipam_base_url
    type: STRING
    defaults: "https://ipam.example.com"
    displayName: "phpIPAM Base URL"
    description: "Root URL of the phpIPAM instance, without a trailing slash."
  - id: phpipam_app_id
    type: STRING
    defaults: "kestra"
    displayName: "phpIPAM Application ID"
    description: "The API application identifier configured under Administration > API in phpIPAM; appears in the path /api/{appId}/."
  - id: subnet_id
    type: STRING
    defaults: "1"
    displayName: "Subnet ID"
    description: "Numeric ID of the phpIPAM subnet to check."
  - id: warning_free_percent
    type: INT
    defaults: 15
    displayName: "Warning Free Capacity Threshold (percent)"
    description: "At or below this percentage of free addresses, the subnet is classified WARNING."
  - id: critical_free_percent
    type: INT
    defaults: 5
    displayName: "Critical Free Capacity Threshold (percent)"
    description: "At or below this percentage of free addresses, the subnet is classified CRITICAL."

triggers:
  - id: subnet_capacity_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check the subnet every 6 hours. Shipped disabled; enable it once phpipam_base_url/subnet_id point at a real phpIPAM instance and a manual run has been verified.
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      warning_free_percent: 15
      critical_free_percent: 5

tasks:
  - id: get_subnet
    type: io.kestra.plugin.phpipam.ipam.subnet.Get
    description: Retrieve the subnet's current usage statistics by its numeric ID. Does not create, update, or delete anything in phpIPAM.
    baseUrl: "{{ inputs.phpipam_base_url }}"
    appId: "{{ inputs.phpipam_app_id }}"
    auth:
      appToken: "{{ secret('PHPIPAM_APP_TOKEN') }}"
    subnetId: "{{ inputs.subnet_id }}"
    allowFailure: true

  - id: get_subnet_usage
    type: io.kestra.plugin.core.http.Request
    description: Read the subnet's usage counters from the dedicated usage endpoint. The subnet read above returns the subnet record only, with no usage block, so the percentages have to come from here.
    uri: "{{ inputs.phpipam_base_url }}/api/{{ inputs.phpipam_app_id }}/subnets/{{ inputs.subnet_id }}/usage/"
    method: GET
    headers:
      token: "{{ secret('PHPIPAM_APP_TOKEN') }}"
    options:
      allowFailed: true
    allowFailure: true

  - id: classify_subnet_capacity
    type: io.kestra.plugin.core.debug.Return
    description: Classify the subnet's free-address percentage against the two configured thresholds, treating a missing output as a server or subnet lookup failure rather than a healthy subnet.
    format: "{{ (outputs.get_subnet_usage.body is not defined or (outputs.get_subnet_usage.body | jq('.data.freehosts_percent // empty') | first) is not defined) ? 'UNREACHABLE' : ((outputs.get_subnet_usage.body | jq('.data.freehosts_percent | tonumber') | first) <= inputs.critical_free_percent ? 'CRITICAL' : ((outputs.get_subnet_usage.body | jq('.data.freehosts_percent | tonumber') | first) <= inputs.warning_free_percent ? 'WARNING' : 'HEALTHY')) }}"

  - id: route_by_capacity
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log on a subnet with plenty of free capacity, an informational Slack message when capacity is getting low, or a Slack page when the subnet is nearly exhausted or unreachable.
    value: "{{ outputs.classify_subnet_capacity.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "phpIPAM subnet {{ inputs.subnet_id }} ({{ outputs.get_subnet.subnet.subnet }}/{{ outputs.get_subnet.subnet.mask }}) is healthy: {{ outputs.get_subnet_usage.body | jq('.data.freehosts_percent') | first }}% free, above the warning floor of {{ inputs.warning_free_percent }}%."
      "WARNING":
        - id: alert_warning_capacity
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post an informational Slack message when free capacity drops to or below the warning threshold but is not yet critical.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "phpIPAM capacity sentinel WARNING: subnet {{ inputs.subnet_id }} ({{ outputs.get_subnet.subnet.subnet }}/{{ outputs.get_subnet.subnet.mask }}) has only {{ outputs.get_subnet_usage.body | jq('.data.freehosts_percent') | first }}% free addresses ({{ outputs.get_subnet_usage.body | jq('.data.freehosts') | first }} of {{ outputs.get_subnet_usage.body | jq('.data.maxhosts') | first }} total), at or below the warning floor of {{ inputs.warning_free_percent }}%. Plan additional address space before it runs out. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_capacity
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when free capacity drops to or below the critical threshold, meaning the subnet is close to having no addresses left to assign.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "phpIPAM capacity sentinel CRITICAL: subnet {{ inputs.subnet_id }} ({{ outputs.get_subnet.subnet.subnet }}/{{ outputs.get_subnet.subnet.mask }}) has only {{ outputs.get_subnet_usage.body | jq('.data.freehosts_percent') | first }}% free addresses ({{ outputs.get_subnet_usage.body | jq('.data.freehosts') | first }} of {{ outputs.get_subnet_usage.body | jq('.data.maxhosts') | first }} total) left, at or below the critical floor of {{ inputs.critical_free_percent }}%. New devices or DHCP leases may soon fail to get an address. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_subnet
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the subnet lookup could not return usage data at all, indicating the phpIPAM server is unreachable, the token is invalid, or the subnet ID does not exist.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "phpIPAM capacity sentinel UNREACHABLE: fetching subnet {{ inputs.subnet_id }} from {{ inputs.phpipam_base_url }} did not return usage data (server unreachable, token invalid, or subnet not found). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "phpIPAM capacity sentinel completed with an unexpected classification: {{ outputs.classify_subnet_capacity.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record a single audit line for every run regardless of branch taken, so the check's own history stays queryable independent of Slack.
    message: "phpIPAM capacity sentinel audit: subnet_id={{ inputs.subnet_id }} status={{ outputs.classify_subnet_capacity.value }} free_percent={{ outputs.get_subnet_usage.body is defined ? (outputs.get_subnet_usage.body | jq('.data.freehosts_percent') | first) : 'n/a' }} free_hosts={{ outputs.get_subnet_usage.body is defined ? (outputs.get_subnet_usage.body | jq('.data.freehosts') | first) : 'n/a' }} max_hosts={{ outputs.get_subnet_usage.body is defined ? (outputs.get_subnet_usage.body | jq('.data.maxhosts') | first) : 'n/a' }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails outright, so a broken check is never mistaken for a subnet with healthy capacity.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "phpIPAM capacity sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Free capacity on subnet {{ inputs.subnet_id }} is now unknown; check the task logs and the phpIPAM server manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_subnet_capacity.value }}"

extend:
  title: "phpIPAM Subnet Capacity Sentinel"
  shortDescription: Read-only check a phpIPAM subnet's free-address percentage on a schedule and page Slack when it nears exhaustion.
  metaTitle: phpIPAM Subnet Capacity Sentinel for Kestra
  metaDescription: Check a phpIPAM subnet's free IP address capacity on a schedule, change nothing in phpIPAM, and alert Slack before it runs out.
  description: |
    A subnet fills up one lease and one static assignment at a time. Nothing in phpIPAM pages anyone until a new device fails to get an address. This blueprint checks one subnet on a schedule, classifies its free-address percentage against two thresholds and routes the result to a quiet log or to Slack. It only reads from phpIPAM, so it has no approval gate and nothing to roll back.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## How it works

    1. `get_subnet` (`io.kestra.plugin.phpipam.ipam.subnet.Get`) reads the subnet record, which supplies the CIDR shown in the messages. `allowFailure: true` lets the run reach the classifier when this lookup fails.
    2. `get_subnet_usage` (`io.kestra.plugin.core.http.Request`) calls `GET /api/{appId}/subnets/{id}/usage/` with the app token in the `token` header. The Get task in plugin-phpipam 1.0.9 (Kestra 2.0.6) does not request usage counters, so the percentages come from this call. A connection error or an error response is allowed through to the classifier.
    3. `classify_subnet_capacity` (`io.kestra.plugin.core.debug.Return`) reads `data.freehosts_percent` from the response body with jq. A missing body or a missing percentage gives `UNREACHABLE`. A value at or below `critical_free_percent` gives `CRITICAL`, at or below `warning_free_percent` gives `WARNING` and anything else gives `HEALTHY`.
    4. `route_by_capacity` (`io.kestra.plugin.core.flow.Switch`) logs for `HEALTHY`, posts a Slack note for `WARNING` and posts a Slack page for `CRITICAL` and `UNREACHABLE`. A `defaults` branch logs any other value.
    5. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one line per run with the status, the free percent and the host counts, so the history survives a webhook outage.
    6. The `errors` block posts to Slack when the flow itself fails, for example when the response body is not JSON.
    7. `subnet_capacity_schedule` checks every 6 hours. It ships `disabled: true` and pins both thresholds.

    ## What you get

    - A scheduled, read-only capacity check for any phpIPAM subnet.
    - A `status` flow output (`HEALTHY`, `WARNING`, `CRITICAL` or `UNREACHABLE`) that other flows can gate on.
    - One Slack message per severity, each with the free-host count and percentage.
    - An audit log line on every run, separate from Slack.

    ## Who it's for

    - Network teams that run phpIPAM as the IP address management record.
    - Platform teams that need to know a DHCP-serviced subnet is close to full before a VM or device fails to get an address.

    ## Why orchestrate this with Kestra

    phpIPAM shows utilization on its own dashboard, but nothing pages anyone when a subnet crosses a threshold. Kestra gives the schedule, the classification and the Slack call as one execution history. The `Switch` branches can grow into a ticket or a supernet request without changing the check.

    ## Tested end to end

    Not run against a live phpIPAM instance. In this audit the flow passed `/flows/validate` on Kestra 2.0.6 and 2.0.5 with no errors or warnings. On 2.0.6 the classification expression was run against simulated usage bodies: 98.82 gave `HEALTHY`, 10 gave `WARNING`, the string "4.5" gave `CRITICAL`, exactly 5 (the critical floor) gave `CRITICAL` while an error body or a null percentage gave `UNREACHABLE`. A refused connection also gave `UNREACHABLE` and the audit line printed `n/a`. The usage endpoint and its field names were checked against the phpIPAM 1.7.3 source (`api/controllers/Subnets.php`). A body that is not JSON, such as an HTML error page, fails the classifier, so the run fails.

    ## Prerequisites

    - A phpIPAM instance with the API enabled under Administration > API and an application ID.
    - A static app token with read access to the subnet.
    - A Slack incoming webhook.

    ### Secrets

    - `PHPIPAM_APP_TOKEN`: phpIPAM static application token.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for every alert and the failure alert.
    - In Kestra OSS, set each as an environment variable named `SECRET_<NAME>` with a base64 encoded value.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `phpipam_base_url` | `https://ipam.example.com` | Root URL of phpIPAM, no trailing slash |
    | `phpipam_app_id` | `kestra` | API application ID used in `/api/{appId}/` |
    | `subnet_id` | `1` | Numeric phpIPAM ID of the subnet, not the CIDR |
    | `warning_free_percent` | `15` | At or below this free percent the status is `WARNING` |
    | `critical_free_percent` | `5` | At or below this free percent the status is `CRITICAL` |

    ## Quick start

    1. Start phpIPAM with the docker-compose example from the phpIPAM Docker Hub page. Alternatively point `phpipam_base_url` at an existing instance.
    2. In phpIPAM, enable the API under Administration > API and create an application with a static token. Create a section and a small test subnet.
    3. Add the `PHPIPAM_APP_TOKEN` and `SLACK_WEBHOOK_URL` secrets.
    4. Set `phpipam_base_url`, `phpipam_app_id` and `subnet_id`, then run the flow once and read the `status` output.
    5. Enable `subnet_capacity_schedule` once a manual run reads correctly.

    ## How to extend

    - Loop over several `subnet_id` values with `io.kestra.plugin.core.flow.Loop`.
    - Use `io.kestra.plugin.phpipam.ipam.subnet.List` to discover the subnets in a section instead of hardcoding one ID.
    - Chain a `CRITICAL` branch into a ticketing system.
    - Store `status` in the KV store and alert only on a change.

    ## Links

    - [Kestra phpIPAM plugin](https://kestra.io/plugins/plugin-phpipam)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
    - [phpIPAM API documentation](https://phpipam.net/api/api_documentation/)
    - [phpIPAM Docker image](https://hub.docker.com/r/phpipam/phpipam-www)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
