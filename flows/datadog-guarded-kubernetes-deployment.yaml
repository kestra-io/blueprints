id: datadog-guarded-kubernetes-deployment
namespace: company.sre

description: |
  Rolls a new container image out to a Kubernetes Deployment with Datadog as the
  safety net: refuses to start while the service already has monitors in alert,
  mutes only that service's monitors for the rollout window, marks the
  deployment in the Datadog event stream, verifies the service's error metric
  and error logs after a bake period and puts the previous image back
  automatically when the checks fail.

labels:
  team: sre
  system: datadog

inputs:
  - id: service
    type: STRING
    displayName: Service
    description: Datadog `service` tag of the application. Used to find its monitors, metrics and logs.
    defaults: orders
    validator: ^[a-z0-9][a-z0-9_.-]{0,99}$

  - id: environment
    type: STRING
    displayName: Environment
    description: Datadog `env` tag the rollout targets, such as `prod` or `staging`.
    defaults: prod
    validator: ^[a-z0-9][a-z0-9_.-]{0,99}$

  - id: kube_namespace
    type: STRING
    displayName: Kubernetes namespace
    defaults: default
    validator: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$

  - id: deployment
    type: STRING
    displayName: Kubernetes Deployment
    defaults: orders
    validator: ^[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$

  - id: container
    type: STRING
    displayName: Container name
    description: Name of the container in the Deployment whose image is replaced.
    defaults: orders
    validator: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$

  - id: image
    type: STRING
    displayName: New image
    description: Full image reference to roll out. A webhook call can override it with `{"image":"..."}` in its body.
    defaults: ghcr.io/example/orders:1.4.2
    validator: ^[A-Za-z0-9][A-Za-z0-9._/:@-]{0,254}$

  - id: bake_time
    type: DURATION
    displayName: Bake time
    description: How long the new version serves traffic before Datadog is checked.
    defaults: PT5M

  - id: mute_for
    type: DURATION
    displayName: Downtime length
    description: Upper bound of the monitor downtime. The flow cancels it earlier when it finishes; Datadog ends it on its own if the flow never does.
    defaults: PT30M

  - id: error_metric
    type: STRING
    displayName: Error count metric
    description: Datadog metric that counts the service's errors. The flow sums it with `.as_count()` over the bake window, scoped to the service and environment.
    defaults: trace.http.request.errors
    validator: ^[A-Za-z][A-Za-z0-9_.]{0,199}$

  - id: max_error_count
    type: INT
    displayName: Maximum errors in the bake window
    defaults: 10
    min: 0

  - id: check_error_logs
    type: BOOL
    displayName: Check error logs
    description: Count the service's error logs after the rollout. Turn it off when the organization has no Log Management indexes, where Datadog rejects every log search.
    defaults: true

  - id: max_error_logs
    type: INT
    displayName: Maximum error logs in the bake window
    defaults: 20
    min: 0
    max: 9999

  - id: require_metric_data
    type: BOOL
    displayName: Require metric data
    description: Treat a metric query that returns no points as a failed check. Keep it on unless the service reports errors only when they happen.
    defaults: true

variables:
  image: "{{ trigger.body.image ?? inputs.image }}"

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: preflight_alerting_monitors
    type: io.kestra.plugin.datadog.monitors.List
    apiKey: "{{ secret('DATADOG_API_KEY') }}"
    appKey: "{{ secret('DATADOG_APP_KEY') }}"
    description: Lists the service's monitors that already have a group in alert. Deploying on top of an open incident hides whether the new version made it worse.
    monitorTags:
      - "service:{{ inputs.service }}"
    groupStates:
      - alert

  - id: preflight_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.preflight_alerting_monitors.size > 0 }}"
    then:
      - id: refuse_to_deploy
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          {{ outputs.preflight_alerting_monitors.size }} monitor(s) of {{ inputs.service }} are in alert:
          {{ outputs.preflight_alerting_monitors.monitors | jq('map(.name) | join("; ")') | first }}.
          Resolve them before deploying.

  - id: capture_current_image
    type: io.kestra.plugin.scripts.shell.Commands
    description: Checks the requested image reference and reads the image the container runs now, so a failed rollout can be put back exactly, not just to "the previous revision". Nothing has changed yet if this step fails.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      entryPoint: []
    containerImage: alpine/k8s:1.31.0
    env:
      KUBECONFIG_DATA: "{{ secret('KUBECONFIG') }}"
      KUBE_NAMESPACE: "{{ inputs.kube_namespace }}"
      DEPLOYMENT: "{{ inputs.deployment }}"
      CONTAINER: "{{ inputs.container }}"
      NEW_IMAGE: "{{ render(vars.image) }}"
    commands:
      - |
        set -eu
        # The image can come from a webhook body, so check it before using it.
        case "$NEW_IMAGE" in
          ""|*[!A-Za-z0-9._/:@-]*) echo "Refusing image reference: $NEW_IMAGE" >&2; exit 2 ;;
        esac
        umask 077
        printf '%s' "$KUBECONFIG_DATA" > kubeconfig
        export KUBECONFIG="$PWD/kubeconfig"
        current=$(kubectl -n "$KUBE_NAMESPACE" get deployment "$DEPLOYMENT" \
          -o jsonpath="{.spec.template.spec.containers[?(@.name==\"$CONTAINER\")].image}")
        if [ -z "$current" ]; then
          echo "Container $CONTAINER was not found in deployment $KUBE_NAMESPACE/$DEPLOYMENT" >&2
          exit 3
        fi
        echo "Current image: $current"
        echo "::{\"outputs\":{\"previous_image\":\"$current\"}}::"

  - id: mute_service_monitors
    type: io.kestra.plugin.datadog.downtimes.Create
    apiKey: "{{ secret('DATADOG_API_KEY') }}"
    appKey: "{{ secret('DATADOG_APP_KEY') }}"
    description: Mutes only this service's monitors in this environment, with a hard end, so the rollout does not page anyone while pods restart.
    monitorTags:
      - "service:{{ inputs.service }}"
    scope: "env:{{ inputs.environment }}"
    duration: "{{ inputs.mute_for }}"
    muteFirstRecoveryNotification: true
    message: "Kestra deployment {{ execution.id }}: {{ inputs.deployment }} to {{ render(vars.image) }}"

  - id: announce_deployment
    type: io.kestra.plugin.datadog.events.Create
    allowFailure: true
    apiKey: "{{ secret('DATADOG_API_KEY') }}"
    title: "Deploying {{ inputs.service }} to {{ inputs.environment }}"
    text: |
      %%%
      Kestra is rolling `{{ inputs.kube_namespace }}/{{ inputs.deployment }}` from
      `{{ outputs.capture_current_image.vars.previous_image }}` to `{{ render(vars.image) }}`.

      Execution: {{ execution.id }}
      %%%
    alertType: INFO
    sourceTypeName: kestra
    aggregationKey: "deploy-{{ execution.id }}"
    tags:
      - "service:{{ inputs.service }}"
      - "env:{{ inputs.environment }}"
      - "deployment:{{ inputs.deployment }}"

  - id: rollout
    type: io.kestra.plugin.scripts.shell.Commands
    description: Sets the new image and waits for the Deployment to report every replica updated and available.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      entryPoint: []
    containerImage: alpine/k8s:1.31.0
    env:
      KUBECONFIG_DATA: "{{ secret('KUBECONFIG') }}"
      KUBE_NAMESPACE: "{{ inputs.kube_namespace }}"
      DEPLOYMENT: "{{ inputs.deployment }}"
      CONTAINER: "{{ inputs.container }}"
      NEW_IMAGE: "{{ render(vars.image) }}"
    commands:
      - |
        set -eu
        umask 077
        printf '%s' "$KUBECONFIG_DATA" > kubeconfig
        export KUBECONFIG="$PWD/kubeconfig"
        kubectl -n "$KUBE_NAMESPACE" set image "deployment/$DEPLOYMENT" "$CONTAINER=$NEW_IMAGE"
        kubectl -n "$KUBE_NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=600s

  - id: rollout_finished
    type: io.kestra.plugin.core.output.OutputValues
    description: Records when the new version started serving, the start of the window Datadog is checked over.
    values:
      at: "{{ now() | date(\"yyyy-MM-dd'T'HH:mm:ss'Z'\", timeZone='UTC') }}"

  - id: bake
    type: io.kestra.plugin.core.flow.Sleep
    duration: "{{ inputs.bake_time }}"

  - id: verify
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: error_metric
        type: io.kestra.plugin.datadog.metrics.Query
        apiKey: "{{ secret('DATADOG_API_KEY') }}"
        appKey: "{{ secret('DATADOG_APP_KEY') }}"
        query: "sum:{{ inputs.error_metric }}{service:{{ inputs.service }},env:{{ inputs.environment }}}.as_count()"
        from: "{{ outputs.rollout_finished.values.at }}"

      - id: if_checking_logs
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.check_error_logs }}"
        then:
          - id: error_logs
            type: io.kestra.plugin.datadog.logs.Search
            apiKey: "{{ secret('DATADOG_API_KEY') }}"
            appKey: "{{ secret('DATADOG_APP_KEY') }}"
            description: Asks for one more event than allowed, which is enough to tell that the limit was exceeded.
            query: "service:{{ inputs.service }} env:{{ inputs.environment }} status:error"
            from: "{{ outputs.rollout_finished.values.at }}"
            to: now
            maxResults: "{{ inputs.max_error_logs + 1 }}"

  - id: verdict
    type: io.kestra.plugin.core.output.OutputValues
    values:
      error_count: "{{ outputs.error_metric.series | jq('[.[].pointlist[]? | .[1] | select(. != null)] | add // 0') | first }}"
      metric_points: "{{ outputs.error_metric.pointCount }}"
      error_logs: "{{ outputs.error_logs.size ?? 0 }}"

  - id: health_gate
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ (outputs.verdict.values.metric_points | number > 0 or not inputs.require_metric_data)
      and outputs.verdict.values.error_count | number <= inputs.max_error_count
      and outputs.verdict.values.error_logs | number <= inputs.max_error_logs }}
    then:
      - id: announce_success
        type: io.kestra.plugin.datadog.events.Create
        allowFailure: true
        apiKey: "{{ secret('DATADOG_API_KEY') }}"
        title: "Deployed {{ inputs.service }} to {{ inputs.environment }}"
        text: |
          %%%
          `{{ render(vars.image) }}` passed the {{ inputs.bake_time }} bake:
          {{ outputs.verdict.values.error_count }} errors (limit {{ inputs.max_error_count }}),
          {{ outputs.verdict.values.error_logs }} error logs (limit {{ inputs.max_error_logs }}).
          %%%
        alertType: SUCCESS
        sourceTypeName: kestra
        aggregationKey: "deploy-{{ execution.id }}"
        tags:
          - "service:{{ inputs.service }}"
          - "env:{{ inputs.environment }}"
          - "deployment:{{ inputs.deployment }}"

      - id: count_success
        type: io.kestra.plugin.datadog.metrics.Submit
        apiKey: "{{ secret('DATADOG_API_KEY') }}"
        metric: kestra.deployment.outcome
        value: 1
        metricType: COUNT
        tags:
          - "service:{{ inputs.service }}"
          - "env:{{ inputs.environment }}"
          - "outcome:success"
    else:
      - id: fail_health_gate
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          {{ inputs.service }} failed the post-deploy check: {{ outputs.verdict.values.error_count }} errors
          (limit {{ inputs.max_error_count }}), {{ outputs.verdict.values.error_logs }} error logs
          (limit {{ inputs.max_error_logs }}), {{ outputs.verdict.values.metric_points }} metric points.

errors:
  - id: after_failure
    type: io.kestra.plugin.core.flow.If
    description: Rolls back only when the rollout step started. Earlier failures leave the cluster untouched.
    condition: "{{ outputs.rollout is defined }}"
    then:
      - id: roll_back
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          entryPoint: []
        containerImage: alpine/k8s:1.31.0
        env:
          KUBECONFIG_DATA: "{{ secret('KUBECONFIG') }}"
          KUBE_NAMESPACE: "{{ inputs.kube_namespace }}"
          DEPLOYMENT: "{{ inputs.deployment }}"
          CONTAINER: "{{ inputs.container }}"
          PREVIOUS_IMAGE: "{{ outputs.capture_current_image.vars.previous_image }}"
        commands:
          - |
            set -eu
            umask 077
            printf '%s' "$KUBECONFIG_DATA" > kubeconfig
            export KUBECONFIG="$PWD/kubeconfig"
            kubectl -n "$KUBE_NAMESPACE" set image "deployment/$DEPLOYMENT" "$CONTAINER=$PREVIOUS_IMAGE"
            kubectl -n "$KUBE_NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=600s

      - id: announce_rollback
        type: io.kestra.plugin.datadog.events.Create
        allowFailure: true
        apiKey: "{{ secret('DATADOG_API_KEY') }}"
        title: "Rolled back {{ inputs.service }} in {{ inputs.environment }}"
        text: |
          %%%
          Kestra put `{{ outputs.capture_current_image.vars.previous_image }}` back after
          `{{ render(vars.image) }}` failed. Execution: {{ execution.id }}
          %%%
        alertType: ERROR
        sourceTypeName: kestra
        aggregationKey: "deploy-{{ execution.id }}"
        tags:
          - "service:{{ inputs.service }}"
          - "env:{{ inputs.environment }}"
          - "deployment:{{ inputs.deployment }}"

      - id: count_rollback
        type: io.kestra.plugin.datadog.metrics.Submit
        apiKey: "{{ secret('DATADOG_API_KEY') }}"
        metric: kestra.deployment.outcome
        value: 1
        metricType: COUNT
        tags:
          - "service:{{ inputs.service }}"
          - "env:{{ inputs.environment }}"
          - "outcome:rolled_back"
    else:
      - id: announce_blocked
        type: io.kestra.plugin.datadog.events.Create
        allowFailure: true
        apiKey: "{{ secret('DATADOG_API_KEY') }}"
        title: "Deployment of {{ inputs.service }} to {{ inputs.environment }} blocked"
        text: "Kestra did not change the cluster. Execution: {{ execution.id }}"
        alertType: WARNING
        sourceTypeName: kestra
        aggregationKey: "deploy-{{ execution.id }}"
        tags:
          - "service:{{ inputs.service }}"
          - "env:{{ inputs.environment }}"
          - "deployment:{{ inputs.deployment }}"

finally:
  - id: unmute_if_muted
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.mute_service_monitors.downtimeId is defined }}"
    then:
      - id: unmute_service_monitors
        type: io.kestra.plugin.datadog.downtimes.Cancel
        apiKey: "{{ secret('DATADOG_API_KEY') }}"
        appKey: "{{ secret('DATADOG_APP_KEY') }}"
        downtimeId: "{{ outputs.mute_service_monitors.downtimeId }}"
        ignoreNotFound: true

triggers:
  - id: from_ci
    type: io.kestra.plugin.core.trigger.Webhook
    description: Lets a CI pipeline start the guarded rollout once an image is pushed, with `{"image":"registry/app:tag"}` as the body.
    key: "{{ secret('WEBHOOK_KEY') }}"

extend:
  title: Guard a Kubernetes Deployment with Datadog Monitors, Error Checks and Automatic Rollback
  metaTitle: Datadog-Guarded Kubernetes Deployment with Rollback | Kestra
  shortDescription: Roll out a new image only when the service is healthy in Datadog, mute its monitors for the rollout, check its errors after a bake period and put the previous image back on failure.
  metaDescription: Deploy to Kubernetes behind Datadog checks. Block on open alerts, mute monitors, verify errors and logs after rollout, roll back automatically.
  description: |
    Shipping a new image is the moment a service is most likely to break and
    the moment its monitors are least useful: pods restart, alerts flap and
    the on-call engineer gets paged for the deployment itself. This blueprint
    puts Datadog on both sides of a Kubernetes rollout. It refuses to deploy
    on top of an open incident, mutes only that service's monitors with a
    hard end, marks the deployment in the Datadog event stream, then checks
    the service's own error metric and error logs after a bake period. When
    the checks fail, or the rollout itself fails, it puts back the exact image
    that ran before and records the rollback in Datadog.

    ## How it works

    1. A **Webhook** trigger lets a CI pipeline start the flow once an image is pushed, with `{"image": "registry/app:tag"}` as the body. Manual runs use the `image` input.
    2. `preflight_alerting_monitors` (`io.kestra.plugin.datadog.monitors.List`) lists the monitors tagged `service:<service>` that have a group in `alert`. If any are, `preflight_gate` fails the execution with their names and nothing is changed.
    3. `capture_current_image` checks the requested image reference, then reads the image the container runs now with `kubectl get deployment -o jsonpath`. That exact value is what a rollback restores.
    4. `mute_service_monitors` (`io.kestra.plugin.datadog.downtimes.Create`) mutes the service's monitors for the `env:<environment>` groups only, for at most `mute_for`. The downtime has an end, so a crashed worker cannot leave alerts muted.
    5. `announce_deployment` (`io.kestra.plugin.datadog.events.Create`) posts the old and new image to the Datadog event stream, so the rollout is visible on every dashboard that overlays events.
    6. `rollout` runs `kubectl set image` and waits for `kubectl rollout status` to report the Deployment fully available.
    7. `rollout_finished` records the time, `bake` waits `bake_time`, then `verify` (`io.kestra.plugin.core.flow.Parallel`) queries Datadog over exactly the bake window: `metrics.Query` sums `<error_metric>{service,env}.as_count()` and, when `check_error_logs` is on, `logs.Search` counts `status:error` logs.
    8. `health_gate` (`io.kestra.plugin.core.flow.If`) passes when the error total and the error log count are within their limits and, unless `require_metric_data` is off, the metric returned data. A pass posts a success event and submits `kestra.deployment.outcome` with `outcome:success`.
    9. A failed check fails the execution. If the `rollout` step started, the `errors` block restores the captured image, waits for it to roll out, posts an error event and submits `outcome:rolled_back`. A failure before the rollout was announced posts a "blocked" event instead and touches nothing.
    10. The `finally` block cancels the downtime whatever happened, so monitors come back as soon as the flow ends.

    ## What you get

    - No deployment on top of an open alert, with the alerting monitor names in the error message.
    - A scoped downtime for the rollout window instead of muting a whole environment, cancelled as soon as the flow ends.
    - Deployment, success, rollback and blocked events in the Datadog event stream, grouped by execution with an aggregation key.
    - A post-deploy check based on the service's own error metric and error logs, over the bake window only.
    - An exact rollback to the previous image, also when the rollout itself fails or times out.
    - A `kestra.deployment.outcome` count metric tagged by service, environment and outcome, ready for a change failure rate widget.

    ## Who it's for

    - Platform and SRE teams who deploy services to Kubernetes and use Datadog for monitors, APM and logs.
    - Teams that want a deployment safety net without adopting a progressive delivery controller.

    ## Why orchestrate this with Kestra

    A CI job can run `kubectl set image`, but the safety steps around it are what usually go missing: the pre-flight check, the downtime that must always be cancelled, the bake period and the rollback that must run even when the rollout step fails. Kestra expresses them as declarative gates, an `errors` block and a `finally` block, so every path ends with monitors unmuted and a record in Datadog. Concurrency is limited to one execution per flow, so two webhook calls cannot roll out over each other. Secrets stay masked in logs and each execution keeps the monitor list, the query results and the kubectl output for review.

    ## Prerequisites

    - A Kestra 2.0 instance whose workers can run Docker containers. The shell steps use the public `alpine/k8s:1.31.0` image.
    - A Kubernetes cluster and a kubeconfig whose user can `get` and `patch` the Deployment in `kube_namespace`.
    - A Datadog organization where the service's monitors carry the monitor tag `service:<service>` and its metrics and logs carry `service` and `env` tags.
    - An error count metric such as `trace.http.request.errors` from APM. Any count metric scoped by `service` and `env` works.
    - A Datadog application key with the `monitors_read`, `monitors_downtime` and `timeseries_query` scopes, plus `logs_read_data` when `check_error_logs` is on.
    - Log Management with at least one index for the error log check. Without it, set `check_error_logs` to `false`.

    ### Secrets

    - `DATADOG_API_KEY`: Datadog API key, used by every Datadog task.
    - `DATADOG_APP_KEY`: Datadog application key with the scopes above, used to list monitors, manage downtimes and read metrics and logs.
    - `KUBECONFIG`: full kubeconfig file content for the target cluster.
    - `WEBHOOK_KEY`: random string that forms the webhook URL. Anyone who knows it can start a deployment, so treat it as a credential.

    ## Quick start

    1. Add the four secrets to the namespace (in Kestra OSS, as base64-encoded `SECRET_*` environment variables).
    2. If your organization is not on `datadoghq.com`, add `site` (for example `datadoghq.eu`) to each Datadog task.
    3. Set the input defaults to your service, environment, namespace, Deployment, container and error metric.
    4. Execute the flow manually with an image that is already deployed. The checks run, the cluster ends where it started and the events appear in Datadog.
    5. Call the webhook from CI after an image push: `POST /api/v1/main/executions/webhook/company.sre/datadog-guarded-kubernetes-deployment/<WEBHOOK_KEY>` with `{"image": "..."}`.

    ## How to extend

    - Add a `io.kestra.plugin.core.flow.Pause` before `rollout` for an approval step on production.
    - Watch the service after the deployment with the `io.kestra.plugin.datadog.monitors.StateChange` trigger in a separate flow.
    - Add a latency check to `verify`, for example a `metrics.Query` on the p99 of `trace.http.request` with its own limit.
    - Post the rollback to Slack or open an incident in the `errors` block.
    - Loop over several services by calling this flow from a parent flow with `io.kestra.plugin.core.flow.Subflow`.

    ## Pitfalls

    - **The monitor filters use monitor tags.** `monitors.List` and `downtimes.Create` select monitors by `service:<service>` in the monitor definition. Monitors without that tag are neither checked nor muted.
    - **The downtime scope must match the monitor groups.** `env:<environment>` only mutes groups that carry an `env` tag. For monitors that are not grouped by `env`, change `scope` to `*`.
    - **No data fails the check by default.** A service that reports errors only when they happen returns no points on a quiet bake. Turn `require_metric_data` off for such metrics.
    - **Logs are counted up to `max_error_logs + 1`.** The search stops there to save calls; Datadog limits log searches to 300 requests per hour.
    - **Events are best effort.** The event tasks use the Datadog v1 events endpoint and have `allowFailure: true`. Some organizations have that endpoint turned off and answer HTTP 403. The events are then skipped, the execution ends in `WARNING` and every safety step still runs.
    - **Log search needs an index.** Datadog rejects log searches with `No valid indexes specified` in organizations without Log Management indexes. Turn `check_error_logs` off there.
    - **The rollback restores the image, not the whole pod template.** Changes made outside the image are not undone.
    - **The webhook body can only change the image.** Its value is checked against a strict character set before any command uses it, and the shell steps receive values only through environment variables.

    ## Links

    - [Datadog plugin for Kestra](https://kestra.io/plugins/plugin-datadog)
    - [Datadog monitors API](https://docs.datadoghq.com/api/latest/monitors/)
    - [Datadog downtimes API](https://docs.datadoghq.com/api/latest/downtimes/)
    - [Datadog metrics query API](https://docs.datadoghq.com/api/latest/metrics/#query-timeseries-points)
    - [Datadog logs search API](https://docs.datadoghq.com/api/latest/logs/#search-logs)
    - [kubectl rollout](https://kubernetes.io/docs/reference/kubectl/generated/kubectl_rollout/)
    - [Kestra Webhook trigger](https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.webhook)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
