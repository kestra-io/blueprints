id: huggingface-model-release-security-gate
namespace: company.ai
description: |
  Inspect a public Hugging Face model at a requested revision, resolve it to an immutable commit,
  audit weight formats and remote-code configuration, check model-card licensing, and optionally
  archive a structured evidence report. Fail the flow when the configured model-promotion policy is
  violated; never download the model weights as part of the audit.

inputs:
  - id: model_id
    type: STRING
    displayName: Hugging Face model ID
    defaults: Qwen/Qwen3-0.6B
    description: Public Hub repository in owner/model format. Private and gated models are not supported by this unauthenticated blueprint.
  - id: revision
    type: STRING
    displayName: Revision to audit
    defaults: main
    description: Branch, tag, or commit. The report records the exact commit resolved by the Hub API; use a full commit SHA when a revision name contains slashes.
  - id: approved_commit_sha
    type: STRING
    displayName: Approved immutable commit SHA
    defaults: ""
    description: Optional 40-character commit SHA. When supplied, the flow fails if the selected revision no longer resolves to this approved commit.
  - id: allow_legacy_pickle_weights
    type: BOOL
    displayName: Allow legacy pickle-based weights
    defaults: false
    description: If false, pickle-style and ambiguous `.bin` files block. If true, they remain warnings; a legacy-only repository also gets a warning instead of the modern-format block.
  - id: allow_remote_code
    type: BOOL
    displayName: Allow custom remote model code
    defaults: false
    description: If false, a non-empty config.json auto_map is a blocking finding because consumers may need to opt into repository code.
  - id: require_model_card
    type: BOOL
    displayName: Require a model card
    defaults: true
    description: Block if the repository has no README.md model card.
  - id: require_license
    type: BOOL
    displayName: Require declared license metadata
    defaults: true
    description: Block if the Hub API does not return a license identifier in model-card metadata or tags.
  - id: approved_licenses
    type: STRING
    displayName: Optional approved license IDs
    defaults: ""
    description: Optional comma-separated allowlist such as apache-2.0,mit. Leave empty to require a declared license without enforcing an allowlist.
  - id: archive_report
    type: BOOL
    displayName: Archive report to S3
    defaults: false
    description: When enabled, copies the JSON audit report to an S3 evidence bucket. Configure the AWS secrets before enabling.
  - id: evidence_bucket
    type: STRING
    displayName: S3 evidence bucket
    defaults: my-model-audit-evidence
    description: Existing S3 bucket used only when archive_report is enabled.
  - id: evidence_prefix
    type: STRING
    displayName: S3 evidence prefix
    defaults: model-security-audits
    description: Prefix for dated, commit-specific audit reports.
  - id: aws_region
    type: STRING
    displayName: AWS region
    defaults: eu-west-1
    description: S3 bucket region, used only when archive_report is enabled.

triggers:
  - id: weekday_model_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily weekday re-audit of the configured model revision. Enable after secrets and policy inputs have been configured.
    cron: "0 8 * * 1-5"
    disabled: true

tasks:
  - id: validate_request_inputs
    type: io.kestra.plugin.scripts.python.Script
    description: Reject malformed model IDs, revisions, and commit pins before issuing any HTTP request.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      MODEL_ID: "{{ inputs.model_id }}"
      REVISION: "{{ inputs.revision }}"
      APPROVED_COMMIT_SHA: "{{ inputs.approved_commit_sha }}"
    script: |
      import os
      import re

      model_id = os.environ.get("MODEL_ID", "").strip()
      revision = os.environ.get("REVISION", "").strip()
      approved_sha = os.environ.get("APPROVED_COMMIT_SHA", "").strip()

      if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*", model_id):
          raise ValueError("model_id must be a public owner/model pair using letters, digits, dot, underscore, or hyphen")
      if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", revision):
          raise ValueError("revision must be a non-empty branch, tag, or commit without slash or URL characters; use the full commit SHA for refs containing slashes")
      if approved_sha and not re.fullmatch(r"[0-9a-fA-F]{40}", approved_sha):
          raise ValueError("approved_commit_sha must be empty or a 40-character hexadecimal commit SHA")
      print("Model ID, revision, and approved commit input syntax passed validation.")

  - id: fetch_model_metadata
    type: io.kestra.plugin.core.http.Request
    description: Read Hub repository metadata at the requested revision, including the resolved commit SHA, file inventory, and model-card metadata. Only the public API response is fetched; weight files are never downloaded.
    uri: "https://huggingface.co/api/models/{{ inputs.model_id }}/revision/{{ inputs.revision }}"
    method: GET
    params:
      "expand[]":
        - siblings
        - cardData
        - tags
        - private
        - gated
        - sha
    headers:
      Accept: application/json
      User-Agent: Kestra-HuggingFace-Model-Release-Security-Gate/1.0
    timeout: PT30S

  - id: fetch_model_config
    type: io.kestra.plugin.core.http.Request
    description: Fetch config.json from the immutable commit returned by the Hub API, not from a moving branch name.
    uri: "https://huggingface.co/{{ inputs.model_id }}/resolve/{{ outputs.fetch_model_metadata.body.sha }}/config.json"
    method: GET
    headers:
      Accept: application/json
      User-Agent: Kestra-HuggingFace-Model-Release-Security-Gate/1.0
    timeout: PT30S

  - id: audit_model_release
    type: io.kestra.plugin.scripts.python.Script
    description: Evaluate the repository inventory, license/card metadata, config remote-code declarations, optional approved commit pin, and safetensors shard index integrity. Emit a JSON evidence file and a machine-readable verdict.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - kestra
    inputFiles:
      model_info.json: "{{ outputs.fetch_model_metadata.body | toJson }}"
      config.json: "{{ outputs.fetch_model_config.body | toJson }}"
    env:
      MODEL_ID: "{{ inputs.model_id }}"
      REQUESTED_REVISION: "{{ inputs.revision }}"
      APPROVED_COMMIT_SHA: "{{ inputs.approved_commit_sha }}"
      ALLOW_LEGACY_PICKLE: "{{ inputs.allow_legacy_pickle_weights }}"
      ALLOW_REMOTE_CODE: "{{ inputs.allow_remote_code }}"
      REQUIRE_MODEL_CARD: "{{ inputs.require_model_card }}"
      REQUIRE_LICENSE: "{{ inputs.require_license }}"
      APPROVED_LICENSES: "{{ inputs.approved_licenses }}"
    outputFiles:
      - audit-report.json
    script: |
      import json
      import os
      import re
      import urllib.error
      import urllib.parse
      import urllib.request
      from datetime import datetime, timezone
      from pathlib import PurePosixPath

      from kestra import Kestra

      model_id = os.environ["MODEL_ID"].strip()
      requested_revision = os.environ["REQUESTED_REVISION"].strip()
      approved_sha = os.environ.get("APPROVED_COMMIT_SHA", "").strip().lower()
      allow_pickle = os.environ.get("ALLOW_LEGACY_PICKLE", "false").lower() == "true"
      allow_remote_code = os.environ.get("ALLOW_REMOTE_CODE", "false").lower() == "true"
      require_model_card = os.environ.get("REQUIRE_MODEL_CARD", "true").lower() == "true"
      require_license = os.environ.get("REQUIRE_LICENSE", "true").lower() == "true"
      approved_licenses = {x.strip().lower() for x in os.environ.get("APPROVED_LICENSES", "").split(",") if x.strip()}

      with open("model_info.json", encoding="utf-8") as source:
          info = json.load(source)
      with open("config.json", encoding="utf-8") as source:
          config = json.load(source)

      findings = []
      def add(code, severity, message):
          findings.append({"code": code, "severity": severity, "message": message})

      if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*", model_id):
          add("INVALID_MODEL_ID", "BLOCK", "Model ID must be an owner/model pair using letters, digits, dot, underscore, or hyphen.")

      if not isinstance(info, dict):
          raise ValueError("Hub model metadata must be a JSON object")
      if not isinstance(config, dict) or not config:
          add("CONFIG_INVALID", "BLOCK", "Resolved config.json is not a non-empty JSON object.")

      returned_model_id = str(info.get("id", "")).strip()
      if not returned_model_id or returned_model_id.lower() != model_id.lower():
          add("REPOSITORY_ID_MISMATCH", "BLOCK", f"Requested model ID '{model_id}' did not match Hub metadata ID '{returned_model_id or 'missing'}'.")

      is_private = bool(info.get("private", False))
      gated_value = info.get("gated", False)
      is_gated = bool(gated_value) and str(gated_value).strip().lower() not in ("false", "none", "")
      if is_private or is_gated:
          add("REPOSITORY_NOT_PUBLIC", "BLOCK", "Private or gated repositories are outside this unauthenticated blueprint's supported scope.")

      commit_sha = str(info.get("sha", "")).lower()
      if not re.fullmatch(r"[0-9a-f]{40}", commit_sha):
          add("INVALID_RESOLVED_COMMIT", "BLOCK", "Hub API did not return a 40-character immutable commit SHA.")
      elif approved_sha:
          if not re.fullmatch(r"[0-9a-f]{40}", approved_sha):
              add("INVALID_APPROVED_COMMIT_SHA", "BLOCK", "approved_commit_sha must be empty or a 40-character hexadecimal commit SHA.")
          elif commit_sha != approved_sha:
              add("COMMIT_DRIFT", "BLOCK", f"Resolved commit {commit_sha} differs from the configured approved commit {approved_sha}.")
      else:
          add("COMMIT_BASELINE_NOT_CONFIGURED", "WARN", "No approved_commit_sha is configured; this run is pinned to the resolved commit, but later revisions are not compared to an approved baseline.")

      siblings = info.get("siblings") or []
      filenames = sorted({str(item.get("rfilename", "")) for item in siblings if isinstance(item, dict) and item.get("rfilename")})
      filename_set = set(filenames)
      if not siblings:
          add("EMPTY_FILE_INVENTORY", "BLOCK", "Hub metadata contained no repository file inventory.")
      if len(filenames) > 20000:
          add("FILE_INVENTORY_TOO_LARGE", "BLOCK", f"Repository reports {len(filenames)} files, above the safety limit of 20,000.")

      has_card = "README.md" in filename_set or "readme.md" in {f.lower() for f in filename_set}
      if require_model_card and not has_card:
          add("MODEL_CARD_MISSING", "BLOCK", "Repository has no README.md model card.")

      card_data = info.get("cardData") or {}
      license_value = card_data.get("license") if isinstance(card_data, dict) else None
      if isinstance(license_value, list):
          license_value = license_value[0] if license_value else None
      license_id = str(license_value or "").strip().lower()
      if not license_id:
          for tag in (info.get("tags") or []):
              if isinstance(tag, str) and tag.lower().startswith("license:"):
                  license_id = tag.split(":", 1)[1].strip().lower()
                  break
      if require_license and not license_id:
          add("LICENSE_MISSING", "BLOCK", "No license identifier was returned in model-card metadata or Hub tags.")
      if approved_licenses:
          if not license_id:
              add("LICENSE_ALLOWLIST_NO_ID", "BLOCK", "An approved license allowlist is configured, but no license identifier was returned.")
          elif license_id not in approved_licenses:
              add("LICENSE_NOT_APPROVED", "BLOCK", f"License '{license_id}' is outside the configured allowlist.")

      auto_map = config.get("auto_map") if isinstance(config, dict) else None
      remote_code_required = bool(auto_map)
      python_files = [f for f in filenames if f.lower().endswith(".py")]
      if remote_code_required and not allow_remote_code:
          add("REMOTE_CODE_DECLARED", "BLOCK", "config.json contains a non-empty auto_map; loading may require executing custom repository code.")
      elif remote_code_required:
          add("REMOTE_CODE_ALLOWED_BY_POLICY", "WARN", "config.json contains auto_map and remote code is allowed by policy; review the pinned source code before deployment.")

      recognized_extensions = (".safetensors", ".gguf", ".onnx", ".tflite", ".mlmodel")
      recognized_weights = [f for f in filenames if f.lower().endswith(recognized_extensions)]
      unsafe_pickle_files = []
      openvino_xml_stems = {f[:-4].lower() for f in filenames if f.lower().endswith(".xml")}
      for filename in filenames:
          lower = filename.lower()
          base = PurePosixPath(lower).name
          if lower.endswith((".pt", ".pth", ".pkl", ".pickle", ".joblib", ".ckpt")):
              unsafe_pickle_files.append(filename)
          elif lower.endswith(".bin"):
              stem = lower[:-4]
              # OpenVINO .bin files paired with same-stem XML are binary tensors, not PyTorch pickle checkpoints.
              openvino_pair = "openvino" in base and stem in openvino_xml_stems
              if not openvino_pair:
                  # .bin is ambiguous in general, but model-repository .bin files are commonly pickle-backed.
                  # The conservative default is to block unless the filename has a known OpenVINO pairing.
                  unsafe_pickle_files.append(filename)

      if not recognized_weights:
          if allow_pickle and unsafe_pickle_files:
              add("LEGACY_PICKLE_ONLY", "WARN", "No recognized modern weight format was found; legacy pickle-style files were explicitly allowed by policy.")
          else:
              add("NO_RECOGNIZED_WEIGHT_FORMAT", "BLOCK", "No recognized safetensors, GGUF, ONNX, TFLite, or Core ML weight file was found.")
      if unsafe_pickle_files:
          severity = "WARN" if allow_pickle else "BLOCK"
          add("PICKLE_STYLE_WEIGHTS_PRESENT", severity, "Legacy pickle-style weight files detected: " + ", ".join(unsafe_pickle_files[:20]) + (" (list truncated)" if len(unsafe_pickle_files) > 20 else ""))

      index_files = [f for f in filenames if f.lower().endswith(".safetensors.index.json")]
      index_results = []
      if len(index_files) > 10:
          add("TOO_MANY_WEIGHT_INDEXES", "BLOCK", f"Found {len(index_files)} safetensors indexes; the audit limit is 10.")
      if re.fullmatch(r"[0-9a-f]{40}", commit_sha):
          safe_model_path = "/".join(urllib.parse.quote(part, safe="-_.") for part in model_id.split("/"))
          for index_name in index_files[:10]:
              if index_name.startswith("/") or ".." in PurePosixPath(index_name).parts:
                  add("UNSAFE_INDEX_PATH", "BLOCK", f"Refusing to fetch suspicious index path: {index_name}")
                  continue
              url = f"https://huggingface.co/{safe_model_path}/resolve/{commit_sha}/{urllib.parse.quote(index_name, safe='/')}"
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Kestra-HuggingFace-Model-Release-Security-Gate/1.0", "Accept": "application/json"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      raw_index = response.read(2 * 1024 * 1024 + 1)
                  if len(raw_index) > 2 * 1024 * 1024:
                      raise ValueError("index exceeds the 2 MiB safety limit")
                  index_data = json.loads(raw_index.decode("utf-8"))
                  weight_map = index_data.get("weight_map")
                  if not isinstance(weight_map, dict) or not weight_map:
                      raise ValueError("missing or empty weight_map")
                  referenced_shards = sorted(set(str(v) for v in weight_map.values()))
                  unsafe_shards = [
                      name for name in referenced_shards
                      if not name or name.startswith("/") or "\\" in name or ".." in PurePosixPath(name).parts
                  ]
                  missing_shards = [name for name in referenced_shards if name not in filename_set]
                  non_safe_shards = [name for name in referenced_shards if not name.lower().endswith(".safetensors")]
                  if unsafe_shards:
                      add("INDEX_REFERENCES_UNSAFE_SHARD_PATH", "BLOCK", f"{index_name} references unsafe shard path(s): " + ", ".join(unsafe_shards[:20]))
                  if missing_shards:
                      add("INDEX_REFERENCES_MISSING_SHARDS", "BLOCK", f"{index_name} references absent shard(s): " + ", ".join(missing_shards[:20]))
                  if non_safe_shards:
                      add("INDEX_REFERENCES_NON_SAFETENSORS", "BLOCK", f"{index_name} references non-safetensors shard(s): " + ", ".join(non_safe_shards[:20]))
                  index_results.append({
                      "path": index_name,
                      "tensor_count": len(weight_map),
                      "shard_count": len(referenced_shards),
                      "unsafe_shard_count": len(unsafe_shards),
                      "unsafe_shard_names": unsafe_shards[:100],
                      "missing_shard_count": len(missing_shards),
                      "missing_shards": missing_shards[:100],
                      "non_safetensors_shard_count": len(non_safe_shards),
                      "non_safetensors_shards": non_safe_shards[:100],
                  })
              except Exception as exc:
                  add("WEIGHT_INDEX_AUDIT_FAILED", "BLOCK", f"Could not verify {index_name}: {type(exc).__name__}: {exc}")

      blocking = [f for f in findings if f["severity"] == "BLOCK"]
      warnings = [f for f in findings if f["severity"] == "WARN"]
      verdict = "FAIL" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "modelId": model_id,
          "requestedRevision": requested_revision,
          "resolvedCommitSha": commit_sha,
          "immutableModelUrl": f"https://huggingface.co/{model_id}/tree/{commit_sha}" if re.fullmatch(r"[0-9a-f]{40}", commit_sha) else None,
          "private": bool(info.get("private", False)),
          "gated": info.get("gated", False),
          "license": license_id or None,
          "modelCardPresent": has_card,
          "configPresent": any(f.lower() == "config.json" for f in filename_set),
          "remoteCodeDeclared": remote_code_required,
          "pythonFiles": python_files[:100],
          "recognizedWeightFormatFiles": recognized_weights[:100],
          "unsafePickleStyleFileCount": len(unsafe_pickle_files),
          "unsafePickleStyleFiles": unsafe_pickle_files[:100],
          "weightIndexes": index_results,
          "approvedCommitShaConfigured": bool(approved_sha),
          "findings": findings,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
      }
      with open("audit-report.json", "w", encoding="utf-8") as report_file:
          json.dump(report, report_file, indent=2, ensure_ascii=False)
      print(f"Model release audit: {model_id}@{commit_sha} verdict={verdict}; blocking={len(blocking)}, warnings={len(warnings)}")
      Kestra.outputs({
          "model_id": model_id,
          "requested_revision": requested_revision,
          "resolved_commit_sha": commit_sha,
          "immutable_model_url": report["immutableModelUrl"],
          "license": license_id or "unknown",
          "recognized_weight_format_file_count": len(recognized_weights),
          "unsafe_pickle_file_count": len(unsafe_pickle_files),
          "remote_code_declared": remote_code_required,
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "verdict": verdict,
          "findings": findings,
      })

  - id: optionally_archive_report
    type: io.kestra.plugin.core.flow.If
    description: Optionally keep the machine-readable security decision in S3 under a model- and commit-specific path.
    condition: "{{ inputs.archive_report }}"
    then:
      - id: upload_audit_report
        type: io.kestra.plugin.aws.s3.Upload
        description: Archive the JSON evidence report without downloading or uploading model weights.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ inputs.aws_region }}"
        bucket: "{{ inputs.evidence_bucket }}"
        from: "{{ outputs.audit_model_release.outputFiles['audit-report.json'] }}"
        key: "{{ inputs.evidence_prefix }}/{{ inputs.model_id | replace('/', '_') }}/{{ outputs.audit_model_release.vars.resolved_commit_sha }}/audit-report.json"

  - id: evaluate_promotion_policy
    type: io.kestra.plugin.core.flow.If
    description: Fail the execution when blocking findings exist, so downstream deployment flows cannot interpret an alert-only run as approval.
    condition: "{{ outputs.audit_model_release.vars.verdict == 'FAIL' }}"
    then:
      - id: alert_blocked_model
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Send a promotion-blocking alert with the resolved commit and specific policy findings.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |-
          {{ {
            "text": ":rotating_light: Hugging Face model promotion BLOCKED\nModel: " ~ outputs.audit_model_release.vars.model_id ~
              "\nCommit: " ~ outputs.audit_model_release.vars.resolved_commit_sha ~
              "\nBlocking findings: " ~ (outputs.audit_model_release.vars.findings | toJson) ~
              "\nExecution: " ~ execution.id ~
              "\nThe JSON audit report is available in Kestra execution outputs"
          } | toJson }}
      - id: fail_promotion
        type: io.kestra.plugin.core.execution.Fail
        description: Enforce the policy gate after the alert is sent.
        errorMessage: "Model security policy failed for {{ outputs.audit_model_release.vars.model_id }} at commit {{ outputs.audit_model_release.vars.resolved_commit_sha }}. Review audit-report.json."
    else:
      - id: log_model_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Model audit {{ outputs.audit_model_release.vars.verdict }} for {{ outputs.audit_model_release.vars.model_id }} at {{ outputs.audit_model_release.vars.resolved_commit_sha }}. Review warnings in audit-report.json before production promotion."

errors:
  - id: alert_audit_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert on API, configuration retrieval, or workflow failures; these are not reported as a successful model audit.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |-
      {{ {
        "text": ":warning: Hugging Face model audit execution failed\nFlow: " ~ flow.id ~
          "\nExecution: " ~ execution.id ~
          "\nModel input: " ~ inputs.model_id ~
          "\nInspect the execution logs; API or config retrieval failures must not be treated as PASS."
      } | toJson }}

outputs:
  - id: audit_result
    type: JSON
    description: Machine-readable model release verdict, resolved immutable commit, policy findings, and format counts.
    value: "{{ outputs.audit_model_release.vars | toJson }}"

extend:
  title: Hugging Face Model Release Security and Revision Gate
  metaTitle: Hugging Face Model Security and Revision Gate | Kestra
  shortDescription: Resolve a public Hugging Face model to an immutable commit, inspect weight formats and remote-code declarations, enforce licensing and revision policy, and optionally archive evidence to S3.
  metaDescription: Gate Hugging Face model promotion on recognized weight formats, remote-code policy, license metadata, and an optional approved commit SHA.
  description: |
    Gate public Hugging Face model promotion with commit pinning, serialization, remote-code and license checks, plus JSON evidence. Blocking findings alert Slack and fail the run.

    ## How it works

    1. `validate_request_inputs` rejects malformed model IDs, revisions and commit pins before HTTP requests.
    2. `fetch_model_metadata` requests the file inventory, card data, tags, visibility and commit SHA for the revision.
    3. `fetch_model_config` reads `config.json` at that immutable commit.
    4. `audit_model_release` checks licensing, card presence, weight formats, pickle-style files, `auto_map`, commit pinning and shard indexes. It never downloads model weights; extension checks are heuristics, not malware scanning.
    5. `optionally_archive_report` stores evidence in S3 when enabled.
    6. `evaluate_promotion_policy` alerts on blocking findings and fails the run; warnings remain in the report.

    ## What you get

    - Immutable commit URL and structured policy findings.
    - Fail-closed handling for retrieval and index errors.
    - License, remote-code and shard-reference checks.
    - Optional S3 evidence retention.

    ## Who it's for

    - MLOps teams reviewing models before deployment.
    - AI security teams needing evidence.
    - ML engineers tracking approved revisions.

    ## Why orchestrate this with Kestra

    Kestra combines API calls, isolated policy checks, routing, alerts and execution history. Parent flows can require a passing verdict, and scheduled audits can detect revision movement.

    ## Prerequisites

    - Kestra 2.x HTTP, Python Script and Slack plugins; AWS S3 is optional.
    - HTTPS access to `huggingface.co`; only public, ungated repositories are supported.
    - A Slack incoming webhook; AWS credentials are needed only for S3 archiving.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: blocking-finding and failure alerts.
    - `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`: optional S3 report-write access.

    ## Quick start

    1. Set `SLACK_WEBHOOK_URL` and run the default model.
    2. Review `audit-report.json`; set `approved_commit_sha` for drift enforcement.
    3. Optionally set `approved_licenses`; review before enabling code or pickle exceptions.
    4. Enable the weekday trigger after configuration.
    5. Enable S3 archiving only after its bucket and AWS secrets are ready.

    ## How to extend

    - Manage model IDs and commit pins in an approved registry.
    - Add a dedicated pickle/malware scanner for deeper artifact analysis.
    - Require human approval for models allowed to use remote code.
    - Use the verdict as a prerequisite for inference deployment.

