id: kestra-ui-edit-backport-to-git-guard
namespace: company.team
description: Backport UI hotfixes to a Git review branch without overwriting Git-only changes or conflicts. Requires the last deployed Git commit as the shared baseline.
concurrency:
  limit: 1
  behavior: FAIL
inputs:
- id: kestra_url
  type: STRING
  defaults: http://localhost:8080
  description: Managed Kestra instance. Run this guard from a separate operations instance.
- id: kestra_username
  type: STRING
  defaults: admin@kestra.io
- id: kestra_password
  type: SECRET
  defaults: '{{ secret(''KESTRA_PASSWORD'') }}'
- id: repository
  type: STRING
  description: HTTP(S) Git repository URL with a default branch.
- id: git_username
  type: STRING
- id: git_token
  type: SECRET
  defaults: '{{ secret(''GIT_TOKEN'') }}'
- id: managed_namespace
  type: STRING
  defaults: company.production
- id: baseline_commit
  type: STRING
  description: Full 40-character Git SHA last deployed successfully to this namespace. Must be an audited common baseline.
- id: review_branch
  type: STRING
  description: Stable incident branch, for example ui-backport/incident123. Reuse it for safe retries.
- id: git_directory
  type: STRING
  defaults: _flows
  description: Flat directory of <flow-id>.yml files. Child namespaces and other layouts are refused.
- id: protected_flows
  type: ARRAY
  itemType: STRING
  defaults: []
- id: max_flows
  type: INT
  defaults: 500
- id: max_targets
  type: INT
  defaults: 10
- id: dry_run
  type: BOOL
  defaults: true
- id: auto_remediate
  type: BOOL
  defaults: false
variables:
  comparison_script: |
    """Local comparison only; remote reads and writes belong to Kestra plugins."""
    import hashlib, json, os, re, struct, sys
    from pathlib import Path
    import yaml
    
    cfg = json.loads(os.environ['CONFIG'])
    
    def require(ok, message):
        if not ok:
            raise ValueError(message)
    
    def digest(data):
        return hashlib.sha256(data).hexdigest()
    
    def normal(source):
        # Preserve YAML scalar whitespace. Only mirror PushFlows' revision stripping and LF.
        return re.sub(r'^revision:\s*\d+\n?', '', source.replace('\r\n', '\n'), flags=re.M).encode('utf-8')
    
    def validate():
        require(re.fullmatch(r'[a-z0-9][a-z0-9._-]{0,149}', cfg['namespace']), 'Invalid namespace')
        require(re.fullmatch(r'[0-9a-f]{40}', cfg['baseline']), 'Use the full last-deployed commit SHA')
        require(re.fullmatch(r'ui-backport/[A-Za-z0-9][A-Za-z0-9_-]{0,60}', cfg['review']), 'Use an incident-specific ui-backport/ branch')
        require(re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_/-]{0,100}', cfg['directory']) and all(p not in ('', '.', '..') for p in cfg['directory'].split('/')), 'Unsafe Git directory')
        require(1 <= cfg['max_flows'] <= 1000 and 1 <= cfg['max_targets'] <= 100, 'Limits outside supported range')
        require(isinstance(cfg['protected'], list) and all(isinstance(x,str) for x in cfg['protected']), 'Protected IDs must be strings')
    
    class UniqueLoader(yaml.SafeLoader):
        pass
    
    def unique_map(loader, node, deep=False):
        pairs = loader.construct_pairs(node, deep=deep)
        result = {}
        for k,v in pairs:
            require(k not in result, 'Duplicate YAML key')
            result[k] = v
        return result
    
    UniqueLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, unique_map)
    
    def flow(source):
        require(len(source.encode()) <= 1048576, 'Flow exceeds 1 MiB')
        data = yaml.load(source, Loader=UniqueLoader)
        require(isinstance(data, dict), 'Expected flow YAML mapping')
        fid, ns = data.get('id'), data.get('namespace')
        require(isinstance(fid, str) and re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._:-]{0,149}', fid), 'Flow ID is not a literal safe glob')
        return fid, ns, digest(normal(source))
    
    def refs(root):
        git = Path(root)/'.git'
        result = {}
        if (git/'packed-refs').exists():
            for line in (git/'packed-refs').read_text().splitlines():
                if line and line[0] not in '#^':
                    sha, name = line.split(' ')
                    result[name] = sha
        if (git/'refs').exists():
            for path in (git/'refs').rglob('*'):
                if path.is_file():
                    result[path.relative_to(git).as_posix()] = path.read_text().strip()
        return result
    
    def discovery():
        validate()
        head = (Path('main')/'.git/HEAD').read_text().strip()
        require(head.startswith('ref: refs/heads/'), 'Repository has no default branch')
        default = head.split('ref: refs/heads/',1)[1]
        require(default != cfg['review'], 'Review branch is the default branch')
        return {'review_exists': ('refs/remotes/origin/'+cfg['review']) in refs('main'), 'default_branch': default}
    
    def files(root):
        result = {}
        for path in Path(root).rglob('*'):
            rel = path.relative_to(root)
            if rel.parts[0] == '.git':
                continue
            require(not path.is_symlink(), 'Symlink in repository')
            if path.is_file():
                require(path.stat().st_size <= 4194304, 'Repository file exceeds 4 MiB')
                result[rel.as_posix()] = digest(path.read_bytes())
                require(len(result) <= 5000, 'Repository exceeds 5000 files')
        require(not any(x.rsplit('/',1)[-1] == '.kestraignore' for x in result), '.kestraignore can suppress a selected backport')
        return result
    
    def safe_git_index(root):
        # Script artifact transfer can dereference symlinks. Git's index retains their mode.
        data = (Path(root)/'.git/index').read_bytes()
        require(len(data) >= 32 and data[:4] == b'DIRC', 'Missing or invalid Git index')
        version, count = struct.unpack_from('>II', data, 4)
        require(version in (2, 3), 'Unsupported Git index version')
        require(hashlib.sha1(data[:-20]).digest() == data[-20:], 'Corrupt Git index')
        pos = 12
        for _ in range(count):
            start = pos
            require(pos + 62 <= len(data) - 20, 'Truncated Git index entry')
            mode = struct.unpack_from('>I', data, pos + 24)[0]
            require(mode != 0o120000, 'Symlink in repository Git index')
            flags = struct.unpack_from('>H', data, pos + 60)[0]
            pos += 62
            if flags & 0x4000:
                require(version == 3, 'Invalid extended Git index entry')
                pos += 2
            end = data.find(b'\0', pos, len(data) - 20)
            require(end >= pos, 'Unterminated Git index path')
            pos = start + ((end + 1 - start + 7) // 8) * 8
            require(pos <= len(data) - 20, 'Truncated Git index padding')
    
    def tree(root):
        safe_git_index(root)
        result = {}
        folder = Path(root)/cfg['directory']
        if not folder.exists():
            return result
        for path in folder.rglob('*'):
            require(not path.is_symlink(), 'Symlink in flow directory')
            if not path.is_file():
                continue
            require(path.parent == folder and path.suffix == '.yml', 'Use flat <flow-id>.yml layout in Git directory')
            fid, ns, sha = flow(path.read_text())
            require(ns == cfg['namespace'] and path.name == fid+'.yml', 'Git identity/path mismatch')
            require(fid not in result, 'Duplicate flow identity')
            result[fid] = sha
            require(len(result) <= cfg['max_flows'], 'Flow count exceeds max_flows')
        return result
    
    def push_source_safe(source):
        # PushFlows 4.3.0 interpolates this namespace UNESCAPED, even with no target override.
        matches = list(re.finditer(r'(?m)^(\s*namespace:\s*)' + cfg['namespace'], source, re.ASCII))
        if len(matches) > 1:
            return False
        for match in matches:
            prefix = match.group(1)
            indentation = prefix.split('namespace:', 1)[0].rsplit('\n', 1)[-1]
            if indentation.strip('\r') or match.group(0)[len(prefix):] != cfg['namespace']:
                return False
        return True
    
    def live():
        sources = json.loads(Path('live.json').read_text())
        require(len(sources) <= cfg['max_flows'], 'Export count exceeds max_flows')
        result, unsafe = {}, []
        for source in sources.values():
            fid, ns, sha = flow(source)
            if ns == cfg['namespace']:  # Export is a prefix read; children/lookalikes never qualify.
                require(fid not in result, 'Duplicate live identity')
                result[fid] = sha
                if not push_source_safe(source):
                    unsafe.append(fid)
        return result, unsafe
    
    def plan():
        disc = discovery()
        b, g = tree('baseline'), tree('main')
        l, unsafe = live()
        branch = 'review' if disc['review_exists'] else 'main'
        r = tree(branch)
        all_main, all_review = files('main'), files(branch)
        rows, ahead = [], []
        for fid in sorted(set(b)|set(g)|set(l)):
            bh, gh, lh = b.get(fid), g.get(fid), l.get(fid)
            if gh == lh:
                status = 'IN_SYNC'
            elif lh == bh:
                status = 'BEHIND'
            elif gh == bh and lh is not None:
                status = 'AHEAD'
            else:
                status = 'DIVERGED'
            protected = fid in cfg['protected']
            rows.append({'id':fid, 'status':status, 'protected':protected, 'baseline':bh, 'git':gh, 'live':lh})
            if status == 'AHEAD' and not protected:
                ahead.append(fid)
        require(not set(ahead).intersection(unsafe), 'Unsafe native namespace rewrite in eligible flow: ' + ', '.join(sorted(set(ahead).intersection(unsafe))))
        paths = {cfg['directory']+'/'+fid+'.yml' for fid in ahead}
        require({k:v for k,v in all_main.items() if k not in paths} == {k:v for k,v in all_review.items() if k not in paths}, 'Review branch has unrelated edits')
        for fid in ahead:
            require(r.get(fid) in (g.get(fid), l[fid]), 'Review branch contains a conflicting prior backport')
        targets = [fid for fid in ahead if r.get(fid) != l[fid]]
        require(len(targets) <= cfg['max_targets'], 'Target count exceeds max_targets')
        return {'rows':rows, 'targets':targets, 'ahead':ahead, 'live':l, 'git':g, 'baseline':b, 'review':r, 'main_files':all_main, 'review_files':all_review, **disc}
    
    mode = sys.argv[1]
    if mode == 'validate':
        validate(); output={'valid': True}
    elif mode == 'discover':
        output=discovery()
    else:
        output=plan()
        if mode == 'recheck':
            approved=json.loads(Path('approved.json').read_text())
            require(output == approved, 'Stale approval: live, Git, review branch or target set changed')
        elif mode == 'verify':
            approved=json.loads(Path('approved.json').read_text())
            require(output['main_files'] == approved['main_files'], 'Default branch changed')
            require(output['live'] == approved['live'], 'Live definitions changed during backport')
            chosen = set(approved['targets'])
            paths = {cfg['directory']+'/'+fid+'.yml' for fid in chosen}
            require(output['review_exists'], 'Review branch was not created')
            require(all(output['review'].get(fid) == approved['live'][fid] for fid in chosen), 'Backport verification failed')
            require({k:v for k,v in output['review_files'].items() if k not in paths} == {k:v for k,v in approved['review_files'].items() if k not in paths}, 'Protected repository files changed')
    Path('report.json').write_text(json.dumps(output,sort_keys=True))
    print('::' + json.dumps({'outputs':output}, separators=(',',':')) + '::')

tasks:
- id: validate_workspace
  type: io.kestra.plugin.core.flow.WorkingDirectory
  tasks:
  - id: validate_inputs
    type: io.kestra.plugin.scripts.python.Commands
    description: Compare local plugin artifacts; the Git and Kestra plugins do not provide a three-way content-hash join.
    containerImage: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      memory:
        memory: 256MB
    dependencies:
    - PyYAML==6.0.2
    env:
      CONFIG: '{{ {''namespace'': inputs.managed_namespace, ''baseline'': inputs.baseline_commit, ''review'': inputs.review_branch, ''directory'': inputs.git_directory, ''protected'': inputs.protected_flows, ''max_flows'': inputs.max_flows, ''max_targets'': inputs.max_targets} | toJson }}'
    inputFiles:
      guard.py: '{{ vars.comparison_script }}'
    timeout: PT2M
    commands:
    - python guard.py validate
    outputFiles:
    - report.json
- id: initial_workspace
  type: io.kestra.plugin.core.flow.WorkingDirectory
  tasks:
  - id: initial_export
    type: io.kestra.plugin.kestra.flows.Export
    kestraUrl: '{{ inputs.kestra_url }}'
    auth:
      auto: false
      username: '{{ inputs.kestra_username }}'
      password: '{{ inputs.kestra_password }}'
    namespace: '{{ inputs.managed_namespace }}'
  - id: initial_unzip
    type: io.kestra.plugin.compress.ArchiveDecompress
    algorithm: ZIP
    from: '{{ outputs.initial_export.flowsZip }}'
  - id: initial_default
    type: io.kestra.plugin.git.Clone
    url: '{{ inputs.repository }}'
    username: '{{ inputs.git_username }}'
    password: '{{ inputs.git_token }}'
    directory: main
    depth: 1
    cloneAllBranches: true
  - id: initial_baseline
    type: io.kestra.plugin.git.Clone
    url: '{{ inputs.repository }}'
    username: '{{ inputs.git_username }}'
    password: '{{ inputs.git_token }}'
    directory: baseline
    commit: '{{ inputs.baseline_commit }}'
  - id: initial_discover
    type: io.kestra.plugin.scripts.python.Commands
    description: Compare local plugin artifacts; the Git and Kestra plugins do not provide a three-way content-hash join.
    containerImage: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      memory:
        memory: 256MB
    dependencies:
    - PyYAML==6.0.2
    env:
      CONFIG: '{{ {''namespace'': inputs.managed_namespace, ''baseline'': inputs.baseline_commit, ''review'': inputs.review_branch, ''directory'': inputs.git_directory, ''protected'': inputs.protected_flows, ''max_flows'': inputs.max_flows, ''max_targets'': inputs.max_targets} | toJson }}'
    inputFiles:
      guard.py: '{{ vars.comparison_script }}'
    timeout: PT2M
    commands:
    - python guard.py discover
    outputFiles:
    - report.json
  - id: initial_review
    type: io.kestra.plugin.git.Clone
    url: '{{ inputs.repository }}'
    username: '{{ inputs.git_username }}'
    password: '{{ inputs.git_token }}'
    directory: review
    branch: '{{ outputs.initial_discover.vars.review_exists ? inputs.review_branch : outputs.initial_discover.vars.default_branch }}'
  - id: inspect
    type: io.kestra.plugin.scripts.python.Commands
    description: Compare local plugin artifacts; the Git and Kestra plugins do not provide a three-way content-hash join.
    containerImage: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      memory:
        memory: 256MB
    dependencies:
    - PyYAML==6.0.2
    env:
      CONFIG: '{{ {''namespace'': inputs.managed_namespace, ''baseline'': inputs.baseline_commit, ''review'': inputs.review_branch, ''directory'': inputs.git_directory, ''protected'': inputs.protected_flows, ''max_flows'': inputs.max_flows, ''max_targets'': inputs.max_targets} | toJson }}'
    inputFiles:
      guard.py: '{{ vars.comparison_script }}'
      live.json: |-
        {
        {% for entry in outputs.initial_unzip.files %}
        {{ entry.key | toJson }}: {{ read(entry.value) | toJson }}{% if not loop.last %},{% endif %}
        {% endfor %}
        }
    timeout: PT2M
    commands:
    - python guard.py plan
    outputFiles:
    - report.json
- id: report
  type: io.kestra.plugin.core.log.Log
  message: '{{ read(outputs.inspect.outputFiles[''report.json'']) }}'
- id: apply_gate
  type: io.kestra.plugin.core.flow.If
  condition: '{{ inputs.auto_remediate and not inputs.dry_run and (outputs.inspect.vars.targets | length) > 0 }}'
  then:
  - id: approve
    type: io.kestra.plugin.core.flow.Pause
    pauseDuration: PT1H
    onResume:
    - id: approved
      type: BOOL
      defaults: false
  - id: approved_gate
    type: io.kestra.plugin.core.flow.If
    condition: '{{ outputs.approve.onResume.approved ?? false }}'
    then:
    - id: fresh_workspace
      type: io.kestra.plugin.core.flow.WorkingDirectory
      tasks:
      - id: fresh_export
        type: io.kestra.plugin.kestra.flows.Export
        kestraUrl: '{{ inputs.kestra_url }}'
        auth:
          auto: false
          username: '{{ inputs.kestra_username }}'
          password: '{{ inputs.kestra_password }}'
        namespace: '{{ inputs.managed_namespace }}'
      - id: fresh_unzip
        type: io.kestra.plugin.compress.ArchiveDecompress
        algorithm: ZIP
        from: '{{ outputs.fresh_export.flowsZip }}'
      - id: fresh_default
        type: io.kestra.plugin.git.Clone
        url: '{{ inputs.repository }}'
        username: '{{ inputs.git_username }}'
        password: '{{ inputs.git_token }}'
        directory: main
        depth: 1
        cloneAllBranches: true
      - id: fresh_baseline
        type: io.kestra.plugin.git.Clone
        url: '{{ inputs.repository }}'
        username: '{{ inputs.git_username }}'
        password: '{{ inputs.git_token }}'
        directory: baseline
        commit: '{{ inputs.baseline_commit }}'
      - id: fresh_discover
        type: io.kestra.plugin.scripts.python.Commands
        description: Compare local plugin artifacts; the Git and Kestra plugins do not provide a three-way content-hash join.
        containerImage: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          memory:
            memory: 256MB
        dependencies:
        - PyYAML==6.0.2
        env:
          CONFIG: '{{ {''namespace'': inputs.managed_namespace, ''baseline'': inputs.baseline_commit, ''review'': inputs.review_branch, ''directory'': inputs.git_directory, ''protected'': inputs.protected_flows, ''max_flows'': inputs.max_flows, ''max_targets'': inputs.max_targets} | toJson }}'
        inputFiles:
          guard.py: '{{ vars.comparison_script }}'
        timeout: PT2M
        commands:
        - python guard.py discover
        outputFiles:
        - report.json
      - id: fresh_review
        type: io.kestra.plugin.git.Clone
        url: '{{ inputs.repository }}'
        username: '{{ inputs.git_username }}'
        password: '{{ inputs.git_token }}'
        directory: review
        branch: '{{ outputs.fresh_discover.vars.review_exists ? inputs.review_branch : outputs.fresh_discover.vars.default_branch }}'
      - id: recheck
        type: io.kestra.plugin.scripts.python.Commands
        description: Compare local plugin artifacts; the Git and Kestra plugins do not provide a three-way content-hash join.
        containerImage: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          memory:
            memory: 256MB
        dependencies:
        - PyYAML==6.0.2
        env:
          CONFIG: '{{ {''namespace'': inputs.managed_namespace, ''baseline'': inputs.baseline_commit, ''review'': inputs.review_branch, ''directory'': inputs.git_directory, ''protected'': inputs.protected_flows, ''max_flows'': inputs.max_flows, ''max_targets'': inputs.max_targets} | toJson }}'
        inputFiles:
          guard.py: '{{ vars.comparison_script }}'
          live.json: |-
            {
            {% for entry in outputs.fresh_unzip.files %}
            {{ entry.key | toJson }}: {{ read(entry.value) | toJson }}{% if not loop.last %},{% endif %}
            {% endfor %}
            }
          approved.json: '{{ read(outputs.inspect.outputFiles[''report.json'']) }}'
        timeout: PT2M
        commands:
        - python guard.py recheck
        outputFiles:
        - report.json
    - id: push_selected
      type: io.kestra.plugin.git.PushFlows
      description: One commit containing only the freshly rechecked AHEAD flow IDs. Never deletes repository files.
      url: '{{ inputs.repository }}'
      username: '{{ inputs.git_username }}'
      password: '{{ inputs.git_token }}'
      kestraUrl: '{{ inputs.kestra_url }}'
      auth:
        auto: false
        username: '{{ inputs.kestra_username }}'
        password: '{{ inputs.kestra_password }}'
      branch: '{{ inputs.review_branch }}'
      sourceNamespace: '{{ inputs.managed_namespace }}'
      flows: '{{ outputs.recheck.vars.targets | toJson }}'
      gitDirectory: '{{ inputs.git_directory }}'
      includeChildNamespaces: false
      delete: false
      dryRun: false
      commitMessage: Backport approved UI hotfixes from {{ inputs.managed_namespace }}
    - id: after_workspace
      type: io.kestra.plugin.core.flow.WorkingDirectory
      tasks:
      - id: after_export
        type: io.kestra.plugin.kestra.flows.Export
        kestraUrl: '{{ inputs.kestra_url }}'
        auth:
          auto: false
          username: '{{ inputs.kestra_username }}'
          password: '{{ inputs.kestra_password }}'
        namespace: '{{ inputs.managed_namespace }}'
      - id: after_unzip
        type: io.kestra.plugin.compress.ArchiveDecompress
        algorithm: ZIP
        from: '{{ outputs.after_export.flowsZip }}'
      - id: after_default
        type: io.kestra.plugin.git.Clone
        url: '{{ inputs.repository }}'
        username: '{{ inputs.git_username }}'
        password: '{{ inputs.git_token }}'
        directory: main
        depth: 1
        cloneAllBranches: true
      - id: after_baseline
        type: io.kestra.plugin.git.Clone
        url: '{{ inputs.repository }}'
        username: '{{ inputs.git_username }}'
        password: '{{ inputs.git_token }}'
        directory: baseline
        commit: '{{ inputs.baseline_commit }}'
      - id: after_discover
        type: io.kestra.plugin.scripts.python.Commands
        description: Compare local plugin artifacts; the Git and Kestra plugins do not provide a three-way content-hash join.
        containerImage: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          memory:
            memory: 256MB
        dependencies:
        - PyYAML==6.0.2
        env:
          CONFIG: '{{ {''namespace'': inputs.managed_namespace, ''baseline'': inputs.baseline_commit, ''review'': inputs.review_branch, ''directory'': inputs.git_directory, ''protected'': inputs.protected_flows, ''max_flows'': inputs.max_flows, ''max_targets'': inputs.max_targets} | toJson }}'
        inputFiles:
          guard.py: '{{ vars.comparison_script }}'
        timeout: PT2M
        commands:
        - python guard.py discover
        outputFiles:
        - report.json
      - id: after_review
        type: io.kestra.plugin.git.Clone
        url: '{{ inputs.repository }}'
        username: '{{ inputs.git_username }}'
        password: '{{ inputs.git_token }}'
        directory: review
        branch: '{{ outputs.after_discover.vars.review_exists ? inputs.review_branch : outputs.after_discover.vars.default_branch }}'
      - id: verify
        type: io.kestra.plugin.scripts.python.Commands
        description: Compare local plugin artifacts; the Git and Kestra plugins do not provide a three-way content-hash join.
        containerImage: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          memory:
            memory: 256MB
        dependencies:
        - PyYAML==6.0.2
        env:
          CONFIG: '{{ {''namespace'': inputs.managed_namespace, ''baseline'': inputs.baseline_commit, ''review'': inputs.review_branch, ''directory'': inputs.git_directory, ''protected'': inputs.protected_flows, ''max_flows'': inputs.max_flows, ''max_targets'': inputs.max_targets} | toJson }}'
        inputFiles:
          guard.py: '{{ vars.comparison_script }}'
          live.json: |-
            {
            {% for entry in outputs.after_unzip.files %}
            {{ entry.key | toJson }}: {{ read(entry.value) | toJson }}{% if not loop.last %},{% endif %}
            {% endfor %}
            }
          approved.json: '{{ read(outputs.inspect.outputFiles[''report.json'']) }}'
        timeout: PT2M
        commands:
        - python guard.py verify
        outputFiles:
        - report.json
    - id: verified
      type: io.kestra.plugin.core.log.Log
      message: Review branch {{ inputs.review_branch }} contains the approved UI definitions. Default branch and protected repository files verified unchanged.
errors:
- id: alert_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: "{{ secret('SLACK_WEBHOOK_URL') }}"
  messageText: 'UI backport guard failed: {{ flow.id }}, execution {{ execution.id }}. Inspect the report and review branch before retrying.'
triggers:
- id: audit_daily
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 7 * * *
  disabled: true
  inputs:
    dry_run: true
    auto_remediate: false
    repository: https://git.example.com/team/flows.git
    git_username: operations
    baseline_commit: '0000000000000000000000000000000000000000'
    review_branch: ui-backport/audit

extend:
  title: Backport Kestra UI hotfixes to a Git review branch
  shortDescription: Compare live flows with their deployed Git baseline and save approved
    UI edits to a review branch.
  metaTitle: Preserve Kestra UI hotfixes in Git
  metaDescription: Detect UI hotfixes against a deployed Git baseline, backport approved
    flows to a review branch and verify the saved definitions.
  tags:
  - Core
  - Infrastructure
  subTags:
  - Namespace & Git Management
  - GitOps & Flow Sync
  demo: false
  ee: false
  verified: false
  description: |
    ## Safety

    A UI hotfix can disappear on the next Git deployment unless it is reviewed and saved in Git. This guard copies eligible live definitions to an incident branch for review.

    | Guard | What it stops |
    | --- | --- |
    | Audited last-deployed commit | Confusing Git-only changes with UI hotfixes |
    | AHEAD IDs only; explicit protected IDs | Backporting BEHIND, DIVERGED or protected definitions |
    | `dry_run: true`, `auto_remediate: false`; approval defaults false | Unattended writes |
    | Fresh comparison after approval | Applying a plan changed during the Pause |
    | Incident branch and `delete: false` | Writing the default branch or deleting repository files |
    | Single execution; target and inventory caps | Overlapping executions of this flow or oversized batches |
    | Native namespace-text check | Committing source that the native namespace regex could rewrite |
    | Export and clone after push | Reporting success when selected definitions or protected files differ |

    Keep external UI and Git writers paused during the push. `PushFlows` exports again and has no conditional version write; verification detects a concurrent change but cannot undo its review-branch commit.

    ## How it works

    1. `initial_export` uses `io.kestra.plugin.kestra.flows.Export`; `initial_unzip` uses `io.kestra.plugin.compress.ArchiveDecompress`. `initial_default`, `initial_baseline` and `initial_review` use `io.kestra.plugin.git.Clone` to read Git.
    2. `inspect` compares SHA-256 hashes against `baseline_commit`: AHEAD means live changed while Git stayed at baseline; BEHIND means live stayed at baseline while Git changed; DIVERGED covers conflicting changes or live deletions; IN_SYNC means live and Git match. Live-only definitions qualify as AHEAD. CRLF and the top-level numeric revision line are normalized; scalar whitespace is preserved. Python joins local plugin artifacts because these plugins have no three-way hash comparison task.
    3. `approve` pauses for up to one hour. `recheck` repeats the reads and rejects any change to the compared definitions, repository files or target set.
    4. `push_selected` uses `io.kestra.plugin.git.PushFlows` with the exact selected IDs, no child namespaces and no deletes. `verify` re-exports and clones again, failing unless selected branch definitions match the approved UI hashes and protected files match the approved tree.

    ## What you get

    The `inspect` report artifact contains per-flow classification, hashes and pending targets. Successful backports leave the default branch untouched; rerunning against the same incident branch skips definitions already saved exactly. Task failures invoke the Slack handler; concurrency admission failures do not.

    ## Who it's for

    Platform teams that deploy Kestra flows from Git and need to preserve incident edits before the next deployment.

    ## Why orchestrate this with Kestra

    Native export and Git tasks keep remote reads and the write in the execution record alongside approval and verification.

    ## Tested end to end

    Tested on Kestra OSS 2.0.6 with Git plugin 4.3.0, Kestra plugin 2.1.1, Compress 1.3.10, Python scripts 1.16.0, Slack 2.1.1 and Gitea 1.22.6. Independent Git CLI diffs and live API source hashes showed two pending UI hotfixes reduced to zero: only their two files changed on the review branch, with the default commit unchanged. The fixture included Git-only edits, a conflict, a protected UI edit and a child namespace.

    | Case | Execution | Result |
    | --- | --- | --- |
    | Healthy | 68keX0LbCpFf1SLgJQS1H8 | SUCCESS; no targets |
    | Dry run | 1mBPN9BZKbNhLB3DwLdSxh | SUCCESS; two targets, no push |
    | Declined | ICHuS9iKLgzgm1t9kzbQr | SUCCESS; no push |
    | Approved | 23xpTCZ8itQ498943hw8w5 | SUCCESS; both branch hashes match live |
    | Repeat | 7O8ocU9spoiD7s0lHE5bBe | SUCCESS; no new commit |
    | Refused credentials | 4nDU1hCH6pfUnARjCb3XJs | FAILED at native push |
    | Live edit during approval | 20mUfgUbymxTHo2TqLVYm2 | FAILED before push |

    Additional saved cases cover empty exports, a 105-flow inventory, inventory and target caps, a 100-character ID with Unicode and literal template text, unsafe namespace-line refusal and retry, a real Subflow backport, both sides of byte/file limits, symlink/ignore refusal, conflicting prior backports, live-export overflow and post-push verification failure with residual-branch recovery. Healthy, approved and stale-approval cases were repeated against a second fresh Kestra fixture.

    ## Prerequisites

    Run this guard from a separate operations Kestra instance with a Docker task runner and network access to the managed instance and Git server. The comparison tasks use pinned Python 3.12 and PyYAML 6.0.2. Grant the Kestra account export/read access to the managed namespace and the Git account read access plus permission to create and update the review branch; protect the default branch separately. Keep the audited full commit last deployed successfully as `baseline_commit`.

    Use a flat Git directory containing only `<flow-id>.yml` files for the exact managed namespace. Repositories with symlinks, `.kestraignore`, conflicting prior backports or unrelated review-branch edits are refused. The retained Git index must be version 2 or 3; unsupported or corrupt indexes are refused. `PushFlows` uses an unescaped namespace regex even without `targetNamespace`; eligible sources with another matching namespace line, an indented match or a nonliteral match are refused before approval. Nonmatching nested Subflow namespaces remain usable.

    ### Secrets

    - `KESTRA_PASSWORD`: password for the managed instance; default for the secret input.
    - `GIT_TOKEN`: Git password or token; default for the secret input.
    - `SLACK_WEBHOOK_URL`: failure destination, referenced by `{{ secret('SLACK_WEBHOOK_URL') }}`.

    ### Inputs

    | Input | Purpose / default |
    | --- | --- |
    | `kestra_url`, `kestra_username`, `kestra_password` | Managed instance and credentials; URL defaults to `http://localhost:8080` |
    | `repository`, `git_username`, `git_token` | HTTP(S) Git URL and credentials |
    | `managed_namespace` | Exact namespace; `company.production` |
    | `baseline_commit` | Audited full 40-character last-deployed commit |
    | `review_branch` | Stable `ui-backport/<incident>` branch; reuse for retries |
    | `git_directory` | Flat flow directory; `_flows` |
    | `protected_flows` | IDs never selected; empty list |
    | `max_flows` | Inventory cap; 500, allowed 1 to 1000 |
    | `max_targets` | Pending write cap; 10, allowed 1 to 100 |
    | `dry_run`, `auto_remediate` | Safe defaults `true`, `false` |

    ## Quick start

    1. Configure secrets and credentials, confirm the baseline commit and protect the default branch.
    2. Run with safe defaults and inspect `inspect`'s `report.json` artifact, including protected and DIVERGED rows.
    3. Freeze external writers, reuse the incident branch and run with `auto_remediate: true` and `dry_run: false`. Approve only the intended target set.
    4. Review the resulting Git diff before merging through your normal process. On failure, inspect the branch and rerun with the same baseline and branch after resolving the cause.

    ## How to extend

    Add a notification linking to the incident branch or connect successful verification to your Git provider's review workflow. The daily schedule is disabled and supplies safe-mode inputs.

    Limits: this preserves UI edits in Git; it does not deploy or merge them. BEHIND and DIVERGED definitions are report-only. `SyncFlows` has no per-flow selector for a selective restore. Hashes compare source text rather than YAML semantics, so formatting changes can appear as drift. The baseline must be trustworthy. Limits are checked after plugin reads: each flow is capped at 1 MiB, repository files at 4 MiB each and the compared repository at 5000 files. Comparison tasks have two-minute timeouts and 256 MB memory limits. Concurrency applies only to this flow; hold external writers still during push and keep the operations instance separate from the managed instance.

    ## Links

    - [Export](https://kestra.io/plugins/plugin-kestra/flows/io.kestra.plugin.kestra.flows.export)
    - [PushFlows](https://kestra.io/plugins/plugin-git/io.kestra.plugin.git.pushflows)
    - [Clone](https://kestra.io/plugins/plugin-git/io.kestra.plugin.git.clone)

