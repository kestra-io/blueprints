id: multi-jurisdiction-sanctions-list-divergence-report
namespace: company.team

description: |
  Compare the EU, UK and Canadian sanctions lists with each other every day: who is designated in one or two
  jurisdictions but not the others, and what changed since the last run. Names are transliterated and token-sorted
  in Python and matched in DuckDB on name, date of birth and IMO number; possible spelling variants are flagged.
  Decision support for a sanctions analyst, not a legal determination.

inputs:
  - id: programs
    type: STRING
    defaults: russia,belarus,iran,myanmar
    description: Comma-separated sanctions programs to compare. Known values are russia, belarus, iran, myanmar, nicaragua, haiti and moldova. An entry is in scope when one list designates it under one of these programs; it counts as present on another list when that list designates it under any program.

  - id: fuzzy_threshold
    type: FLOAT
    defaults: 0.93
    description: Fuzzy name score (0 to 1). Every word of the shorter normalised name is compared with the closest word of the other name (Jaro-Winkler) and the weakest word counts. From this score a divergence is marked CHECK_SPELLING with the closest name on the other list, instead of DIVERGENT.

  - id: state_key
    type: STRING
    defaults: sanctions_list_divergence_state
    description: KV key holding the divergences of the last run, one entry per in-scope designation.

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * 1-5"
    description: The three lists are republished on working days; a morning run picks up the previous day's designations.

tasks:
  - id: download_lists
    type: io.kestra.plugin.core.flow.Parallel
    description: The three keyless files are independent, so they download at the same time.
    tasks:
      - id: eu
        type: io.kestra.plugin.core.http.Download
        description: EU Financial Sanctions Files consolidated list, CSV format 1.1 (one row per entity, alias, address, birth date and identity document). The server is slow uncompressed (about 25 MB); with gzip it is about 2.5 MB.
        uri: https://webgate.ec.europa.eu/fsd/fsf/public/files/csvFullSanctionsList_1_1/content?token=dG9rZW4tMjAxNw
        headers: {Accept-Encoding: gzip, User-Agent: "kestra-sanctions-list-divergence/1.0 (https://kestra.io)"}
        retry: {type: exponential, interval: PT30S, maxInterval: PT5M, maxAttempts: 3}
      - id: uk
        type: io.kestra.plugin.core.http.Download
        description: UK Sanctions List (FCDO) in CSV, about 50 MB, one row per name variant and address. The first line is the report date.
        uri: https://sanctionslist.fcdo.gov.uk/docs/UK-Sanctions-List.csv
        headers: {Accept-Encoding: gzip, User-Agent: "kestra-sanctions-list-divergence/1.0 (https://kestra.io)"}
        retry: {type: exponential, interval: PT30S, maxInterval: PT5M, maxAttempts: 3}
      - id: ca
        type: io.kestra.plugin.core.http.Download
        description: Consolidated Canadian Autonomous Sanctions List (Special Economic Measures Act and Magnitsky regulations) in XML.
        uri: https://www.international.gc.ca/world-monde/assets/office_docs/international_relations-relations_internationales/sanctions/sema-lmes.xml
        headers: {Accept-Encoding: gzip, User-Agent: "kestra-sanctions-list-divergence/1.0 (https://kestra.io)"}
        retry: {type: exponential, interval: PT30S, maxInterval: PT5M, maxAttempts: 3}

  - id: normalize
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Standard-library Python. Keeps one record per designation (type, program, listing date) and writes match keys:
      every name and alias transliterated from Cyrillic, folded to ASCII, stripped of legal forms, spelling-folded
      (x/ks, kh/h, y/i, double letters) and token-sorted; surname plus date of birth; IMO numbers. Skips UK low-quality
      a.k.a. names. Fails below 1,000 records per list, because a truncated download would look like mass divergence.
    containerImage: python:3.13-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      eu.csv: "{{ outputs.eu.uri }}"
      uk.csv: "{{ outputs.uk.uri }}"
      ca.xml: "{{ outputs.ca.uri }}"
    outputFiles:
      - entities.csv
      - names.csv
    env:
      PROGRAMS: "{{ inputs.programs }}"
    script: |
      import csv, gzip, io, json, os, re, unicodedata
      import xml.etree.ElementTree as ET
      EU_CODES = {"russia": {"UKR", "RUS", "RUSDA"}, "belarus": {"BLR"}, "iran": {"IRN"}, "myanmar": {"MMR"},
                  "nicaragua": {"NIC"}, "haiti": {"HTI"}, "moldova": {"MDA"}}  # UK regime and CA country text contain the name
      asked = [p.strip().lower() for p in os.environ["PROGRAMS"].split(",") if p.strip()]
      wanted, unknown = [p for p in asked if p in EU_CODES], [p for p in asked if p not in EU_CODES]
      CYR = dict(zip("абвгдеёжзийклмнопрстуфхцчшщъыьэюяіїєґў",
                     "a b v g d e e zh z i i k l m n o p r s t u f kh ts ch sh shch _ y _ e yu ya i i ye g u".split()))
      FOLDS = [("x", "ks"), ("kh", "h"), ("ph", "f"), ("w", "v"), ("j", "i"), ("y", "i"), ("ie", "e"), ("ei", "e")]
      LEGAL = set("ooo oao zao pao ao ojsc pjsc cjsc jsc llc ltd limited inc co company corp corporation gmbh plc sa fze "
                  "llp joint stock public open closed liability the of and s aktsionernoe obshchestvo ogranichenoi "
                  "otvetstvenostiu publichnoe zakritoe otkritoe".split())
      def fold(t):  # one spelling for common romanisation variants: Aleksandr/Alexander, Yuri/Iouri, Mikhail/Mihail
          for a, b in FOLDS:
              t = t.replace(a, b)
          return re.sub(r"(.)\1+", r"\1", t)
      LEGAL = {fold(t) for t in LEGAL}
      def tokens(name, entity):
          name = "".join(CYR.get(c, c) for c in name.lower()).replace("_", "")
          name = unicodedata.normalize("NFKD", name).encode("ascii", "ignore").decode()
          return [t for t in map(fold, re.sub(r"[^a-z0-9]+", " ", name).split()) if not (entity and t in LEGAL)]
      def variants(text):  # Canada packs aliases as "A, B, Russian: C" and translations as "Name (English)"
          for part in re.split(r"[;,]", text or ""):
              part = re.sub(r"^\s*[A-Za-z]+\s*:", "", part).strip()
              if part:
                  yield re.sub(r"\([^)]*\)", " ", part).strip()
                  yield from (i for i in re.findall(r"\(([^)]{4,})\)", part))
      def iso(d):
          d = (d or "").strip().lstrip("'")
          m = re.match(r"^(\d{2})/(\d{2})/(\d{4})$", d)
          return f"{m[3]}-{m[2]}-{m[1]}" if m else (d[:10] if re.match(r"^\d{4}-\d{2}-\d{2}", d) else "")
      def program_of(value, src):
          return next((p for p in wanted if (value in EU_CODES[p] if src == "EU" else p in value.lower())), "")
      def text(path):
          raw = open(path, "rb").read()
          return io.StringIO((gzip.decompress(raw) if raw[:2] == b"\x1f\x8b" else raw).decode("utf-8-sig"), newline="")
      ents, keys = {}, set()
      def add(src, sid, typ, prog, listed, display, names, dob="", surname="", imo=""):
          e = ents.setdefault(f"{src}:{sid}", {"src": src, "src_id": sid, "type": typ, "program": "", "listed": "", "name": ""})
          e["program"] = e["program"] or prog
          e["name"] = e["name"] or display.strip()
          e["listed"] = min(x for x in (e["listed"], listed) if x) if (e["listed"] or listed) else ""
          for n in names:
              for v in (variants(n) if src == "CA" else [n]):
                  t = tokens(re.sub(r"IMO\s*\d{7}", " ", v), typ != "individual")  # UK ship names read "IMO 9291262 ('SILVAR')"
                  if len(t) >= (2 if typ == "individual" else 1):
                      keys.add((f"{src}:{sid}", src, typ, "name", " ".join(sorted(set(t)))))
              imo = imo or next(iter(re.findall(r"IMO\s*(\d{7})", n or "")), "")
          if typ == "individual" and len(dob) == 10:
              keys.update((f"{src}:{sid}", src, typ, "dob", f"{dob} {t}") for t in tokens(surname, False) if len(t) >= 4)
          if re.fullmatch(r"\d{7}", (imo or "").strip()):
              keys.add((f"{src}:{sid}", src, "ship", "imo", imo.strip()))
      for r in csv.DictReader(text("eu.csv"), delimiter=";"):
          add("EU", r["Entity_LogicalId"], "individual" if r["Entity_SubjectType_ClassificationCode"] == "person" else "entity",
              program_of(r["Entity_Regulation_Programme"], "EU"), r["Entity_DesignationDate"] or r["Entity_Regulation_PublicationDate"],
              r["NameAlias_WholeName"], [r["NameAlias_WholeName"]], r["BirthDate_BirthDate"], r["NameAlias_LastName"],
              r["Identification_Number"] if r["Identification_TypeCode"] == "imo" else "")
      uk = text("uk.csv")
      uk_date = uk.readline().replace("Report Date:", "").strip()
      for r in csv.DictReader(uk):
          if not r["Alias strength"].lower().startswith("low"):
              full = " ".join(r[f"Name {i}"].strip() for i in range(1, 7) if r[f"Name {i}"].strip())
              add("UK", r["Unique ID"], r["Designation Type"].lower(), program_of(r["Regime Name"], "UK"), iso(r["Date Designated"]),
                  full if r["Name type"].lower() == "primary name" else "", [full, r["Name non-latin script"]],
                  iso(r["D.O.B"]), r["Name 6"], r["IMO number"])
      for rec in ET.parse("ca.xml").getroot().iter("record"):
          g = lambda t: (rec.findtext(t) or "").strip()
          first, last, org, imo = g("GivenName-Prenom"), g("LastName-NomDeFamille"), g("EntityOrShip-EntiteOuNavire"), g("ShipIMONumber-NumeroOMIDuNavire")
          typ = "individual" if first or last else ("ship" if imo else "entity")
          display = f"{first} {last}".strip() or org
          add("CA", f"{g('Country-Pays').split(' /')[0]}/{' '.join(sorted(tokens(display, typ != 'individual')))}", typ,
              program_of(g("Country-Pays"), "CA"), g("DateOfListing-DateDinscription")[:10], display, [display, g("Aliases-Alias")],
              iso(g("DateOfBirthOrShipBuildDate-DateDeNaissanceOuDateDeConstructionDuNavire")), last, imo)
      counts = {s: sum(e["src"] == s for e in ents.values()) for s in ("EU", "UK", "CA")}
      if min(counts.values()) < 1000:
          raise SystemExit(f"A list looks truncated, refusing to compare: {counts}")
      with open("entities.csv", "w", newline="", encoding="utf-8") as fh:
          w = csv.writer(fh)
          w.writerow(["key", "src", "src_id", "type", "program", "listed", "name"])
          w.writerows([k, *e.values()] for k, e in ents.items())
      with open("names.csv", "w", newline="", encoding="utf-8") as fh:
          csv.writer(fh).writerows([("key", "src", "type", "kind", "match_key"), *sorted(keys)])
      print("::" + json.dumps({"outputs": {"counts": counts, "uk_report_date": uk_date, "programs": ",".join(wanted),
                                           "unknown_programs": ",".join(unknown), "match_keys": len(keys)}}) + "::")

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: JSON array of `key|pattern` strings from the last run. Missing on the first run, which is then a BASELINE.

  - id: compare
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Links records that share a match key (plus one hop, so EU-UK-Canada chains connect), derives each in-scope
      designation's presence pattern once (from the first list in EU, UK, CA order), looks for a near-identical
      name on the missing list, and diffs the patterns against the previous run.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      entities.csv: "{{ outputs.normalize.outputFiles['entities.csv'] }}"
      names.csv: "{{ outputs.normalize.outputFiles['names.csv'] }}"
      previous.json: "{{ outputs.previous_state.value ?? '[]' }}"
    outputFiles:
      - divergences_csv
      - state_json
    parameters:
      threshold: "{{ inputs.fuzzy_threshold }}"
    sql: |
      CREATE TABLE e AS SELECT *, list_position(['EU', 'UK', 'CA'], src) AS rk FROM read_csv('entities.csv', all_varchar = true);
      CREATE TABLE n AS SELECT * FROM read_csv('names.csv', all_varchar = true);
      CREATE TABLE link AS SELECT DISTINCT a.key AS k1, b.key AS k2 FROM n a JOIN n b USING (kind, match_key) WHERE a.src <> b.src;
      CREATE TABLE reach AS SELECT k1, k2 FROM link UNION SELECT l1.k1, l2.k2 FROM link l1 JOIN link l2 ON l2.k1 = l1.k2 WHERE l2.k2 <> l1.k1;
      CREATE TABLE scope AS
      SELECT e.key, e.src, e.src_id, e.type, e.program, e.listed, e.name, e.rk,
             bool_or(coalesce(o.src, e.src) = 'EU') OR e.src = 'EU' AS on_eu,
             bool_or(coalesce(o.src, e.src) = 'UK') OR e.src = 'UK' AS on_uk,
             bool_or(coalesce(o.src, e.src) = 'CA') OR e.src = 'CA' AS on_ca,
             coalesce(bool_or(o.program <> '' AND o.rk < e.rk), false) AS has_earlier
      FROM e LEFT JOIN reach r ON r.k1 = e.key LEFT JOIN e o ON o.key = r.k2
      WHERE e.program <> '' GROUP BY e.key, e.src, e.src_id, e.type, e.program, e.listed, e.name, e.rk;
      CREATE TABLE div AS
      SELECT *, concat_ws('+', CASE WHEN on_eu THEN 'EU' END, CASE WHEN on_uk THEN 'UK' END, CASE WHEN on_ca THEN 'CA' END) AS pattern,
             concat_ws('+', CASE WHEN NOT on_eu THEN 'EU' END, CASE WHEN NOT on_uk THEN 'UK' END, CASE WHEN NOT on_ca THEN 'CA' END) AS missing_from
      FROM scope WHERE NOT has_earlier AND NOT (on_eu AND on_uk AND on_ca);
      CREATE TABLE tok AS SELECT DISTINCT key, src, type, match_key, unnest(string_split(match_key, ' ')) AS t FROM n WHERE kind = 'name';
      CREATE TABLE rare AS SELECT t FROM tok WHERE len(t) >= 4 GROUP BY t HAVING count(DISTINCT key) <= 20;
      CREATE TABLE near AS
      SELECT x.key, arg_max(o.src || ' ' || o.name, sim) AS closest, max(sim) AS score
      FROM (SELECT a.key, b.key AS other, max(greatest(
              list_min(list_transform(string_split(a.match_key, ' '), x -> list_max(list_transform(string_split(b.match_key, ' '), y -> jaro_winkler_similarity(x, y))))),
              list_min(list_transform(string_split(b.match_key, ' '), y -> list_max(list_transform(string_split(a.match_key, ' '), x -> jaro_winkler_similarity(x, y))))))) AS sim
            FROM div d JOIN tok a ON a.key = d.key JOIN rare USING (t)
            JOIN tok b ON b.t = a.t AND b.type = a.type AND contains(d.missing_from, b.src)
            WHERE least(len(string_split(a.match_key, ' ')), len(string_split(b.match_key, ' '))) >= 2 GROUP BY ALL) x
      JOIN e o ON o.key = x.other GROUP BY x.key;
      CREATE TABLE prev AS SELECT split_part(s, '|', 1) AS key, split_part(s, '|', 2) AS pattern
      FROM (SELECT unnest(from_json(content, '["VARCHAR"]')) AS s FROM read_text('previous.json'));
      CREATE TABLE report AS
      SELECT d.program, d.pattern, d.missing_from, d.src, d.src_id, d.type, d.name, d.listed,
             CASE WHEN nr.score >= CAST(:threshold AS DOUBLE) THEN 'CHECK_SPELLING' ELSE 'DIVERGENT' END AS status,
             CASE WHEN nr.score >= CAST(:threshold AS DOUBLE) THEN nr.closest END AS closest_on_missing_list, round(nr.score, 3) AS score,
             CASE WHEN (SELECT count(*) FROM prev) = 0 THEN '' WHEN p.key IS NULL THEN 'NEW' WHEN p.pattern <> d.pattern THEN 'WAS ' || p.pattern ELSE '' END AS change,
             d.key
      FROM div d LEFT JOIN near nr USING (key) LEFT JOIN prev p USING (key);
      CREATE TABLE resolved AS
      SELECT p.key, p.pattern, coalesce(e.name, p.key) AS name, CASE WHEN e.key IS NULL THEN 'REMOVED from ' || split_part(p.key, ':', 1) ELSE 'now on all three' END AS outcome
      FROM prev p LEFT JOIN report r USING (key) LEFT JOIN e USING (key) WHERE r.key IS NULL;
      COPY (SELECT * EXCLUDE (key) FROM report ORDER BY program, pattern, status, name) TO '{{ outputFiles.divergences_csv }}' (HEADER);
      COPY (SELECT coalesce(json_group_array(key || '|' || pattern), '[]') FROM report) TO '{{ outputFiles.state_json }}' (HEADER false, QUOTE '', DELIMITER '\t');
      CREATE TABLE lines AS
      SELECT 0 AS o, change || ' ' || program || ', ' || name || ' (' || type || ', ' || src || ' since ' || coalesce(listed, '?') || ') on '
             || pattern || ', missing from ' || missing_from || coalesce(' [check spelling vs ' || closest_on_missing_list || ']', '') AS line
      FROM report WHERE change <> ''
      UNION ALL SELECT 1, 'RESOLVED ' || name || ' (was ' || pattern || ', ' || outcome || ')' FROM resolved;
      CREATE TABLE summary AS
      SELECT (SELECT count(*) FROM prev) = 0 AS is_baseline,
             (SELECT count(*) FROM scope WHERE NOT has_earlier) AS designations,
             (SELECT count(*) FROM report) AS divergences,
             (SELECT count(*) FROM report WHERE status = 'CHECK_SPELLING') AS check_spelling,
             (SELECT count(*) FROM lines) AS changes,
             (SELECT string_agg(program || ' - ' || p, chr(10) ORDER BY program) FROM (
                SELECT program, string_agg(pattern || ' only ' || c, ', ' ORDER BY len(pattern), pattern) AS p
                FROM (SELECT program, pattern, count(*) AS c FROM report GROUP BY ALL) GROUP BY program)) AS by_pattern,
             coalesce((SELECT string_agg(line, chr(10)) FROM (SELECT line FROM lines ORDER BY o, line LIMIT 20)), '') AS change_lines;
      SELECT *, '*Sanctions list divergence, EU / UK / Canada* (decision support for analyst review, not a legal determination)' || chr(10)
             || CASE WHEN is_baseline THEN 'BASELINE run. ' ELSE changes || ' changes since the last run. ' END
             || divergences || ' of ' || designations || ' in-scope designations are not on all three lists (' || check_spelling || ' may be spelling variants).'
             || chr(10) || by_pattern || CASE WHEN change_lines <> '' THEN chr(10) || change_lines ELSE '' END AS report_text
      FROM summary;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.compare.outputFiles.state_json) | trim }}"

  - id: report_changes
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.compare.outputs[0].row.changes > 0 or outputs.compare.outputs[0].row.is_baseline }}"
    then:
      - id: log_changes
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.compare.outputs[0].row.report_text }}"
      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the report green without a webhook; the same text is in the WARN log and the CSV.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": {{ (':scales: ' ~ outputs.compare.outputs[0].row.report_text) | toJson }}}
    else:
      - id: no_changes
        type: io.kestra.plugin.core.log.Log
        message: "No divergence changes since the last run; {{ outputs.compare.outputs[0].row.divergences }} standing divergences."

  - id: warn_unknown_programs
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.normalize.vars.unknown_programs is not empty }}"
    level: WARN
    message: "Unknown programs ignored: {{ outputs.normalize.vars.unknown_programs }}. Known: russia, belarus, iran, myanmar, nicaragua, haiti, moldova."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Records parsed {{ outputs.normalize.vars.counts }} (UK report date {{ outputs.normalize.vars.uk_report_date }}), programs {{ outputs.normalize.vars.programs }}.
      {{ outputs.compare.outputs[0].row.designations }} designations in scope, {{ outputs.compare.outputs[0].row.divergences }} not on all three lists ({{ outputs.compare.outputs[0].row.check_spelling }} CHECK_SPELLING), {{ outputs.compare.outputs[0].row.changes }} changes.

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.compare.outputs[0].row }}"
  - id: divergences_csv
    type: FILE
    value: "{{ outputs.compare.outputFiles.divergences_csv }}"

extend:
  title: Multi-Jurisdiction Sanctions List Divergence Report (EU, UK, Canada)
  metaTitle: EU, UK and Canada Sanctions List Divergence Report with DuckDB | Kestra
  shortDescription: Download the EU, UK and Canadian sanctions lists in parallel, match designations across them by transliterated name, date of birth and IMO number, and report who is designated in one or two jurisdictions but not the others, with daily changes in Slack.
  metaDescription: Daily gap analysis of the EU, UK and Canada sanctions lists, matched by name, birth date and IMO in DuckDB, with changes since the last run in Slack.
  description: |
    Firms active in the EU, the UK and Canada apply three sanctions regimes that do not move together: a Russian bank the EU listed in July may not be on the UK list yet, and Canada designates tankers the others have not. This flow compares the three official lists with each other (no counterparty input) and reports which designations are missing from which jurisdiction, and what changed since the last run. It is decision support for a sanctions analyst, not a legal determination.

    ## How it works

    1. A weekday `Schedule` runs `download_lists` (Parallel): the EU Financial Sanctions Files CSV, the UK Sanctions List CSV and the Canadian Autonomous Sanctions List XML download at the same time, with retries.
    2. `normalize` (standard-library Python) keeps one record per designation and writes match keys: names and aliases transliterated from Cyrillic, folded to ASCII, stripped of legal forms (OOO, JSC, aktsionernoe obshchestvo), spelling-folded (Aleksandr/Alexander) and token-sorted; surname plus date of birth; IMO numbers for ships. It fails if a list parses to under 1,000 records, so a truncated download cannot pose as thousands of divergences.
    3. `compare` (DuckDB) links records sharing a key (plus one hop, so EU-UK-Canada chains connect), gives each in-scope designation a pattern such as `EU only` or `UK+CA only`, and checks each divergence for a near-identical name on the missing list (`CHECK_SPELLING`, otherwise `DIVERGENT`).
    4. Patterns are diffed against the KV state: `NEW`, `WAS ...` (pattern changed) and `RESOLVED` (now on all three lists, or removed at source).
    5. On the baseline or when something changed, an `If` logs the report at WARN and posts it to Slack (`allowFailure: true`).

    ## What you get

    - A CSV with one row per divergence: program, pattern, missing lists, source id, type, name, listing date, status, closest name on the missing list and change.
    - Per-program counts per pattern and a daily list of new, changed and resolved divergences.

    ## Who it's for

    - Sanctions compliance teams at banks, insurers, shippers and traders working across these jurisdictions, and policy analysts tracking regime alignment.

    ## Why orchestrate this with Kestra

    - Parallel downloads with retries and timeouts, so one slow government server does not block the rest.
    - KV state reports each change once; the first run is an explicit baseline.

    ## Prerequisites

    - Kestra 2.0 with the Python script plugin (Docker runner, `python:3.13-slim`), the JDBC DuckDB plugin and the Slack plugin. No API keys.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the report stays in the logs and the CSV).

    ## Quick start

    1. Import the flow and click **Execute**. The first run is a BASELINE with counts per program and pattern.
    2. Run again: with no list change, `no_changes` logs the standing divergences.
    3. Add `SLACK_WEBHOOK_URL`, review `CHECK_SPELLING` rows first, and keep the schedule on.

    ## How to extend

    - Add the UN or US lists as a fourth source with the same key format.
    - Load the daily CSV into a warehouse to chart how fast regimes converge after each package.

    ## Links

    - [Parallel](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.parallel), [Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script), [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries), [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [EU Financial Sanctions Files](https://data.europa.eu/data/datasets/consolidated-list-of-persons-groups-and-entities-subject-to-eu-financial-sanctions), [UK Sanctions List](https://www.gov.uk/government/publications/the-uk-sanctions-list), [Canada Consolidated Autonomous Sanctions List](https://www.international.gc.ca/world-monde/international_relations-relations_internationales/sanctions/consolidated-consolide.aspx)
  tags:
    - Business
  subTags:
    - Policy & Compliance
    - Reporting & Digests
  ee: false
  demo: false
