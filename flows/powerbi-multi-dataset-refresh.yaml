id: powerbi-multi-dataset-refresh
namespace: company.team
description: |
  Refresh several Power BI datasets across workspaces in one run. A ForEach
  iterates over workspace and dataset pairs, refreshes each with a verified
  wait, limits concurrency to protect capacity, and posts a Discord summary.

tasks:
  - id: refresh_each
    type: io.kestra.plugin.core.flow.ForEach
    description: Iterate over workspace and dataset pairs declared as JSON strings, running at most two refreshes at a time so a shared capacity is never saturated by simultaneous refreshes.
    values:
      - '{"group": "9f1c2b8c-12ab-4f3e-9bcd-0af2c5e6d123", "dataset": "5c8b4a1e-7f89-4c33-9dd8-1f23c4567890"}'
      - '{"group": "9f1c2b8c-12ab-4f3e-9bcd-0af2c5e6d123", "dataset": "7d2e5b3f-8a90-4d44-8ee9-2a34d5678901"}'
      - '{"group": "1a2b3c4d-56ef-4a7b-8c9d-0e1f2a3b4c5d", "dataset": "8e3f6c4a-9b01-4e55-9ffa-3b45e6789012"}'
    concurrencyLimit: 2
    tasks:
      - id: refresh_dataset
        type: io.kestra.plugin.powerbi.RefreshGroupDataset
        description: Refresh one dataset from the current iteration value, parsing the workspace and dataset ids from the JSON string; with wait set to true a failed refresh fails the iteration and the flow.
        tenantId: "{{ secret('AZURE_TENANT_ID') }}"
        clientId: "{{ secret('AZURE_CLIENT_ID') }}"
        clientSecret: "{{ secret('AZURE_CLIENT_SECRET') }}"
        groupId: "{{ fromJson(taskrun.value).group }}"
        datasetId: "{{ fromJson(taskrun.value).dataset }}"
        wait: true
        pollDuration: PT15S
        waitDuration: PT45M

  - id: notify
    type: io.kestra.plugin.discord.DiscordIncomingWebhook
    description: Post a single summary to Discord once every dataset in the list has finished refreshing.
    url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
    payload: |
      {
        "username": "Kestra",
        "content": "All Power BI datasets in the refresh list completed successfully (execution {{ execution.id }}). Dashboards across the listed workspaces are fresh."
      }

errors:
  - id: alert_failure
    type: io.kestra.plugin.discord.DiscordIncomingWebhook
    description: Alert Discord when any dataset refresh fails so a single broken model never hides inside a batch run.
    url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
    payload: |
      {
        "username": "Kestra",
        "content": "Power BI multi-dataset refresh FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Open the execution to see which workspace and dataset pair failed."
      }

extend:
  title: Refresh Multiple Power BI Datasets with Bounded Concurrency
  shortDescription: A ForEach over workspace and dataset pairs refreshes several Power BI datasets with a verified wait, two at a time, and posts a Discord summary.
  metaTitle: Multi-Dataset Power BI Refresh with Kestra
  metaDescription: Refresh several Power BI datasets across workspaces with Kestra ForEach. Limit concurrency to protect capacity and post a Discord summary after.
  description: |
    One dataset refresh is a task, ten are an operational headache: scripts with hardcoded id lists, refreshes that pile onto the same capacity, and no idea which one failed. This blueprint declares the whole fleet as data. A `ForEach` iterates over workspace and dataset pairs, `io.kestra.plugin.powerbi.RefreshGroupDataset` refreshes each with a verified wait, and `concurrencyLimit: 2` keeps simultaneous refreshes from saturating a shared capacity.

    ## How it works

    1. `refresh_each` (`io.kestra.plugin.core.flow.ForEach`) iterates over a YAML list of JSON strings, each carrying a `group` (workspace id) and a `dataset` id. Adding a dataset to the fleet is a one line change.
    2. Inside the loop, `refresh_dataset` reads the current pair with `{{ fromJson(taskrun.value).group }}` and `{{ fromJson(taskrun.value).dataset }}`, authenticates with the Azure AD service principal, and refreshes the dataset. With `wait: true` it polls every 15 seconds for up to 45 minutes and fails on a failed refresh state.
    3. `concurrencyLimit: 2` runs at most two refreshes at a time, protecting Premium or Fabric capacity from a refresh stampede.
    4. `notify` posts one Discord summary after the whole list completes; the `errors` block posts a distinct alert when any pair fails, and the execution view shows exactly which iteration broke.

    ## What you get

    - A dataset fleet managed as a list in version control instead of ids scattered across scripts.
    - Bounded parallelism: faster than sequential, safer than all-at-once on shared capacity.
    - Per-dataset verification, because every refresh waits for a terminal state instead of assuming success.
    - One summary message instead of ten, with per-iteration detail preserved in the execution view.

    ## Who it's for

    - BI platform teams responsible for many semantic models across several workspaces.
    - Data engineers consolidating per-dataset refresh scripts into one declarative flow.
    - Capacity admins who need refresh parallelism capped, not unbounded.

    ## Why orchestrate this with Kestra

    Refreshing many datasets from Power BI's own scheduler means many independent timers with no shared view and no coordination. Kestra turns the fleet into one execution: a declarative list, controlled concurrency, per-iteration logs and states, a single summary, and a single failure alert that points at the exact broken pair.

    ## Prerequisites

    - An Azure AD app registration with Power BI API permissions granted, authenticating through the OAuth 2.0 client credentials flow.
    - Service principal access enabled for Power BI in the admin portal, and the service principal added to every workspace in the list.
    - Workspace and dataset ids for each model to refresh.
    - A Discord incoming webhook for the summary and alerts.

    ### Secrets

    - `AZURE_TENANT_ID`: Azure AD tenant id.
    - `AZURE_CLIENT_ID`: Azure AD application (client) id.
    - `AZURE_CLIENT_SECRET`: Azure AD client secret.
    - `DISCORD_WEBHOOK_URL`: Discord incoming webhook URL.

    ## Quick start

    1. Add the four secrets to your Kestra namespace.
    2. Replace the `values` list with your own workspace and dataset pairs.
    3. Execute the flow and watch the iterations run two at a time in the Gantt view.
    4. Check the Discord summary, then add a Schedule trigger if you want the fleet refreshed on a timer.

    ## How to extend

    - Raise or lower `concurrencyLimit` to match your capacity headroom.
    - Move the `values` list to a flow input so different environments refresh different fleets.
    - Add a `name` field to each JSON object and interpolate it into task logs for friendlier iteration labels.
    - Chain the fleet refresh after your warehouse load, as shown in the refresh after ELT blueprint.

    ## Links

    - [Power BI plugin documentation](https://kestra.io/plugins/plugin-powerbi)
    - [ForEach task documentation](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.foreach)
  tags:
    - Business
    - Data
  subTags:
    - Reporting & Digests
    - Day 2 Operations
  ee: false
  demo: false
