id: cassandra-keyspace-replication-factor-floor-guard
namespace: company.team
description: Raise one approved Cassandra replication floor, complete full repair and fail unless all-data previews agree.
concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: keyspace
    type: STRING
    defaults: application
  - id: datacenter
    type: STRING
    defaults: dc1
  - id: nodes
    type: ARRAY
    itemType: STRING
    defaults: [cassandra-1, cassandra-2]
    description: Complete cluster node list, two to five private JMX hosts in one datacenter.
  - id: cql_host
    type: STRING
    defaults: cassandra-1
  - id: cql_port
    type: INT
    defaults: 9042
  - id: cql_username
    type: SECRET
    defaults: "{{ secret('CASSANDRA_USERNAME') }}"
  - id: cql_password
    type: SECRET
    defaults: "{{ secret('CASSANDRA_PASSWORD') }}"
  - id: jmx_port
    type: INT
    defaults: 7199
  - id: jmx_username
    type: SECRET
    defaults: "{{ secret('CASSANDRA_JMX_USERNAME') }}"
  - id: jmx_password
    type: SECRET
    defaults: "{{ secret('CASSANDRA_JMX_PASSWORD') }}"
  - id: replication_floor
    type: INT
    defaults: 2
  - id: lock_keyspace
    type: STRING
    defaults: maintenance
    description: Preprovisioned keyspace holding schema_fence(resource text PRIMARY KEY, owner text), without TTL.
  - id: command_timeout_seconds
    type: INT
    defaults: 120
    description: Per nodetool deadline, 10 to 300 seconds. Timed-out server work requires operator inspection.
  - id: max_tables
    type: INT
    defaults: 16
  - id: docker_network
    type: STRING
    defaults: bridge
  - id: dry_run
    type: BOOL
    defaults: true
  - id: auto_remediate
    type: BOOL
    defaults: false

variables:
  admin_launcher: |
    import java.util.ArrayList;
    import java.util.Arrays;
    class Admin {
      public static void main(String[] args) {
        ArrayList<String> command = new ArrayList<String>();
        command.addAll(Arrays.asList("-h", args[0], "-p", args[1]));
        String user = System.getenv("JMX_USERNAME");
        if (user != null && !user.isEmpty()) {
          command.addAll(Arrays.asList("-u", user, "-pwf", "jmx.password"));
        }
        command.addAll(Arrays.asList(args).subList(2, args.length));
        org.apache.cassandra.tools.NodeTool.main(command.toArray(new String[0]));
      }
    }
  config: >-
    {{ {'keyspace':inputs.keyspace,'lock_keyspace':inputs.lock_keyspace,'datacenter':inputs.datacenter,'nodes':inputs.nodes,'replication_floor':inputs.replication_floor,'max_tables':inputs.max_tables,'command_timeout_seconds':inputs.command_timeout_seconds,'jmx_port':inputs.jmx_port,'cql_port':inputs.cql_port} | toJson }}
  admin_script: |
    import glob, json, os, re, selectors, shlex, socket, subprocess, time
    from pathlib import Path
    cfg = json.loads(os.environ['CONFIG'])
    mode = os.environ['MODE']
    def require(ok, reason):
        if not ok:
            raise RuntimeError(reason)
    def emit(**values):
        print('::' + json.dumps({'outputs': values}) + '::', flush=True)
    def identifier(value):
        return isinstance(value, str) and re.fullmatch(r'[A-Za-z0-9_]{1,48}', value) is not None
    require(identifier(cfg['keyspace']) and not cfg['keyspace'].lower().startswith('system'), 'Unsafe keyspace')
    require(identifier(cfg['lock_keyspace']) and not cfg['lock_keyspace'].lower().startswith('system'), 'Unsafe lock keyspace')
    require(cfg['keyspace'] != cfg['lock_keyspace'], 'Lock keyspace is protected')
    require(isinstance(cfg['datacenter'], str) and re.fullmatch(r'[A-Za-z0-9_]{1,48}', cfg['datacenter']), 'Unsafe datacenter')
    require(isinstance(cfg['nodes'], list) and 2 <= len(cfg['nodes']) <= 5 and len(set(cfg['nodes'])) == len(cfg['nodes']), 'Require two to five unique nodes')
    require(all(isinstance(n, str) and re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]{0,252}', n) for n in cfg['nodes']), 'Unsafe node')
    require(2 <= cfg['replication_floor'] <= 5 and cfg['replication_floor'] <= len(cfg['nodes']), 'RF exceeds node capacity')
    require(1 <= cfg['max_tables'] <= 64 and 10 <= cfg['command_timeout_seconds'] <= 300, 'Invalid work ceiling')
    require(1 <= cfg['jmx_port'] <= 65535 and 1 <= cfg['cql_port'] <= 65535, 'Invalid port')
    if mode == 'inputs':
        emit(valid=True)
        raise SystemExit(0)
    def schema(path):
        rows = json.loads(Path(path).read_text())
        require(len(rows) == 1, 'Keyspace absent or ambiguous')
        row = rows[0]
        rep = row['replication']
        require(rep.get('class') == 'org.apache.cassandra.locator.NetworkTopologyStrategy', 'Only NetworkTopologyStrategy is supported')
        require(set(rep) == {'class', cfg['datacenter']}, 'Require one explicit datacenter with no unrelated policy')
        require(re.fullmatch(r'[1-9][0-9]*', rep[cfg['datacenter']]) is not None, 'Transient or invalid RF')
        rf = int(rep[cfg['datacenter']])
        require(rf <= len(cfg['nodes']), 'Current RF exceeds node capacity')
        tables = json.loads(Path(path.replace('schema', 'tables')).read_text())
        require(0 < len(tables) <= cfg['max_tables'], 'Empty or excessive table set')
        require(all(identifier(t['table_name']) and t.get('id') for t in tables), 'Invalid table identity')
        return {'replication': rep, 'durable_writes': row['durable_writes'], 'tables': sorted(tables, key=lambda t: t['table_name']), 'rf': rf}
    if mode in ('plan', 'reread', 'final_schema'):
        current = schema('schema.json')
        if mode != 'plan':
            before = json.loads(Path('before.json').read_text())
            expected = dict(before['replication'])
            if mode == 'final_schema':
                expected[cfg['datacenter']] = str(max(before['rf'], cfg['replication_floor']))
            require(current['replication'] == expected and current['durable_writes'] == before['durable_writes'] and current['tables'] == before['tables'], 'Schema or table identity changed since approval')
        emit(snapshot=current, below_floor=current['rf'] < cfg['replication_floor'])
        raise SystemExit(0)
    password = os.environ.get('JMX_PASSWORD', '')
    username = os.environ.get('JMX_USERNAME', '')
    require(bool(username) == bool(password), 'JMX needs both credentials or neither')
    require(not re.search(r'\s', username + password), 'JMX password-file credentials cannot contain whitespace')
    if password:
        p = Path('jmx.password')
        p.write_text(username + ' ' + password + '\n')
        p.chmod(0o600)
    compiler = subprocess.run(['java','-cp',':'.join(glob.glob('/opt/cassandra/lib/ecj-*.jar')),'org.eclipse.jdt.internal.compiler.batch.Main','-17','-classpath',':'.join(glob.glob('/opt/cassandra/lib/apache-cassandra-*.jar')),'Admin.java'],capture_output=True,text=True,timeout=30)
    require(compiler.returncode == 0, 'Admin launcher compilation failed: ' + compiler.stderr[-1000:])
    options = subprocess.run(['/bin/sh','-c','. /opt/cassandra/bin/cassandra.in.sh; printf "%s" "$JVM_OPTS"'],capture_output=True,text=True,timeout=10)
    require(options.returncode == 0, 'Native nodetool JVM settings unavailable')
    jvm_options = shlex.split(options.stdout)
    records = []
    def tool(host, *args):
        cmd = ['java', '-Xmx128m', '-XX:ParallelGCThreads=1', *jvm_options, '-Dlogback.configurationFile=logback-tools.xml', '-cp', '.:/etc/cassandra:/opt/cassandra/lib/*', 'Admin', host, str(cfg['jmx_port'])]
        cmd += list(args)
        proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, start_new_session=True)
        selector = selectors.DefaultSelector()
        selector.register(proc.stdout, selectors.EVENT_READ)
        output = bytearray()
        end = time.monotonic() + cfg['command_timeout_seconds']
        try:
            while selector.get_map():
                if time.monotonic() >= end:
                    raise TimeoutError('Nodetool deadline; inspect server repair and retained fence before retry')
                for key, _ in selector.select(min(0.25, max(0, end-time.monotonic()))):
                    chunk = os.read(key.fileobj.fileno(), 65536)
                    if not chunk:
                        selector.unregister(key.fileobj)
                    else:
                        output.extend(chunk)
                        require(len(output) <= 1048576, 'Nodetool output ceiling exceeded')
            code = proc.wait(timeout=2)
            text = output.decode('utf-8', errors='strict')
            for credential in (password, username):
                if credential:
                    text = text.replace(credential, '<redacted>')
            records.append({'host': host, 'operation': list(args), 'exit_code': code, 'output': text})
            Path('operations.json').write_text(json.dumps(records))
            require(code == 0, 'Nodetool failed: ' + text[-1000:])
            return text
        finally:
            if proc.poll() is None:
                import signal
                os.killpg(proc.pid, signal.SIGKILL)
                proc.wait()
            selector.close()
    try:
        ips = [socket.gethostbyname(n) for n in cfg['nodes']]
        require(len(set(ips)) == len(ips), 'Node aliases resolve to duplicate addresses')
        states = []
        hosts = []
        for node in cfg['nodes']:
            status = tool(node, 'status')
            dc = None
            rows = []
            for line in status.splitlines():
                if line.startswith('Datacenter: '):
                    dc = line.split(': ', 1)[1]
                fields = line.split()
                if fields and re.fullmatch(r'[UD][NLJM]', fields[0]):
                    rows.append({'state': fields[0], 'ip': fields[1], 'dc': dc})
            require(len(rows) == len(ips) and {r['ip'] for r in rows} == set(ips), 'Incomplete cluster node list')
            require(all(r['state'] == 'UN' and r['dc'] == cfg['datacenter'] for r in rows), 'Require all nodes UN in declared datacenter')
            info = tool(node, 'info')
            host = re.search(r'^ID\s*:\s*([0-9a-f-]{36})\s*$', info, re.M)
            require(host is not None, 'Missing node host ID')
            hosts.append(host.group(1))
            require('5.0.9' in tool(node, 'version'), 'Pinned Cassandra 5.0.9 required')
            net = tool(node, 'netstats')
            require('Mode: NORMAL' in net and 'Not sending any streams.' in net, 'Node has active streams or is not normal')
            states.append(rows)
        require(len(set(hosts)) == len(hosts), 'Duplicate host ID')
        topology = {'ips': ips, 'host_ids': hosts, 'states': states}
        if Path('topology.json').exists():
            require(topology == json.loads(Path('topology.json').read_text()), 'Topology changed since approval')
        if mode == 'topology':
            emit(topology=topology)
        elif mode in ('preview', 'verify'):
            synchronized = True
            for node in cfg['nodes']:
                output = tool(node, 'repair', '--full', '--preview', '--sequential', '--job-threads', '1', cfg['keyspace'])
                require('previewKind: ALL' in output and 'Repair preview completed successfully' in output, 'Unrecognized full-preview completion')
                clean = 'Previewed data was in sync' in output
                mismatch = 'Total estimated streaming:' in output and 'Mismatching ranges:' in output
                require(clean or mismatch, 'Unknown preview result')
                synchronized = synchronized and clean and not mismatch
            if mode == 'verify':
                require(synchronized, 'Replica data still mismatches after repair')
            emit(in_sync=synchronized, topology=topology)
        elif mode == 'repair':
            for node in cfg['nodes']:
                output = tool(node, 'repair', '--full', '--sequential', '--job-threads', '1', cfg['keyspace'])
                require('Repair completed successfully' in output and 'incremental: false' in output, 'Unrecognized full-repair completion')
            emit(repaired_nodes=len(cfg['nodes']))
        else:
            raise RuntimeError('Unknown operation')
    finally:
        if Path('jmx.password').exists():
            Path('jmx.password').unlink()

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.scripts.python.Script
    pythonVersion: '3.13'
    beforeCommands: ['ln -s /usr/bin/python3 /usr/local/bin/python']
    containerImage: cassandra:5.0.9@sha256:8870ec4d9608abe9160a7d09b51a0f0c13c6a95ea0610266ea58eb7d30a144de
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.docker_network }}"
      entryPoint: []
      memory:
        memory: 512MB
        memorySwap: 512MB
      cpu:
        cpus: 1
    env:
      MODE: inputs
      CONFIG: "{{ render(vars.config) }}"
    script: "{{ vars.admin_script }}"
  - id: read_schema
    type: io.kestra.plugin.cassandra.standard.Query
    timeout: PT30S
    session:
      endpoints:
        - hostname: "{{ inputs.cql_host }}"
          port: "{{ inputs.cql_port }}"
      localDatacenter: "{{ inputs.datacenter }}"
      username: "{{ inputs.cql_username }}"
      password: "{{ inputs.cql_password }}"
    cql: "SELECT replication,durable_writes FROM system_schema.keyspaces WHERE keyspace_name='{{ inputs.keyspace }}'"
    fetchType: FETCH
  - id: read_tables
    type: io.kestra.plugin.cassandra.standard.Query
    timeout: PT30S
    session:
      endpoints:
        - hostname: "{{ inputs.cql_host }}"
          port: "{{ inputs.cql_port }}"
      localDatacenter: "{{ inputs.datacenter }}"
      username: "{{ inputs.cql_username }}"
      password: "{{ inputs.cql_password }}"
    cql: "SELECT table_name,id FROM system_schema.tables WHERE keyspace_name='{{ inputs.keyspace }}' LIMIT 65"
    fetchType: FETCH
  - id: plan
    type: io.kestra.plugin.scripts.python.Script
    pythonVersion: '3.13'
    beforeCommands: ['ln -s /usr/bin/python3 /usr/local/bin/python']
    containerImage: cassandra:5.0.9@sha256:8870ec4d9608abe9160a7d09b51a0f0c13c6a95ea0610266ea58eb7d30a144de
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.docker_network }}"
      entryPoint: []
      memory: {memory: 512MB, memorySwap: 512MB}
      cpu: {cpus: 1}
    env:
      MODE: plan
      CONFIG: "{{ render(vars.config) }}"
    inputFiles:
      schema.json: "{{ outputs.read_schema.rows | toJson }}"
      tables.json: "{{ outputs.read_tables.rows | toJson }}"
    script: "{{ vars.admin_script }}"
  - id: inspect_topology
    type: io.kestra.plugin.scripts.python.Script
    pythonVersion: '3.13'
    beforeCommands: ['ln -s /usr/bin/python3 /usr/local/bin/python']
    description: The CQL plugin has no JMX topology or repair task, so use Cassandra's pinned native nodetool.
    timeout: PT30M
    containerImage: cassandra:5.0.9@sha256:8870ec4d9608abe9160a7d09b51a0f0c13c6a95ea0610266ea58eb7d30a144de
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.docker_network }}"
      entryPoint: []
      memory: {memory: 512MB, memorySwap: 512MB}
      cpu: {cpus: 1}
    env:
      MODE: topology
      CONFIG: "{{ render(vars.config) }}"
      JMX_USERNAME: "{{ inputs.jmx_username }}"
      JMX_PASSWORD: "{{ inputs.jmx_password }}"
    inputFiles:
      Admin.java: "{{ vars.admin_launcher }}"
    outputFiles: [operations.json]
    script: "{{ vars.admin_script }}"
  - id: already_at_floor
    type: io.kestra.plugin.core.flow.If
    condition: "{{ not outputs.plan.vars.below_floor }}"
    then:
      - id: initial_preview
        type: io.kestra.plugin.scripts.python.Script
        pythonVersion: '3.13'
        beforeCommands: ['ln -s /usr/bin/python3 /usr/local/bin/python']
        timeout: PT30M
        containerImage: cassandra:5.0.9@sha256:8870ec4d9608abe9160a7d09b51a0f0c13c6a95ea0610266ea58eb7d30a144de
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          networkMode: "{{ inputs.docker_network }}"
          entryPoint: []
          memory: {memory: 512MB, memorySwap: 512MB}
          cpu: {cpus: 1}
        env:
          MODE: preview
          CONFIG: "{{ render(vars.config) }}"
          JMX_USERNAME: "{{ inputs.jmx_username }}"
          JMX_PASSWORD: "{{ inputs.jmx_password }}"
        inputFiles:
          Admin.java: "{{ vars.admin_launcher }}"
          topology.json: "{{ outputs.inspect_topology.vars.topology | toJson }}"
        outputFiles: [operations.json]
        script: "{{ vars.admin_script }}"
  - id: recovery_needed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.plan.vars.below_floor or not (outputs.initial_preview.vars.in_sync ?? false) }}"
    then:
      - id: report_gap
        type: io.kestra.plugin.core.log.Log
        message: "Replication recovery needed for {{ inputs.keyspace }}. RF={{ outputs.plan.vars.snapshot.rf }}, floor={{ inputs.replication_floor }}, no data coverage assumed from schema."
      - id: write_mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approval
            type: io.kestra.plugin.core.flow.Pause
            pauseDuration: PT1H
            onResume:
              - id: approved
                type: BOOL
                defaults: false
          - id: explicit_approval
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval.onResume.approved ?? false }}"
            then:
              - id: acquire_fence
                type: io.kestra.plugin.cassandra.standard.Query
                timeout: PT30S
                session:
                  endpoints:
                    - hostname: "{{ inputs.cql_host }}"
                      port: "{{ inputs.cql_port }}"
                  localDatacenter: "{{ inputs.datacenter }}"
                  username: "{{ inputs.cql_username }}"
                  password: "{{ inputs.cql_password }}"
                cql: "INSERT INTO {{ inputs.lock_keyspace }}.schema_fence (resource,owner) VALUES ('cluster-schema-repair','{{ execution.id }}') IF NOT EXISTS"
                fetchType: FETCH
              - id: fence_conflict
                type: io.kestra.plugin.core.flow.If
                condition: "{{ not (outputs.acquire_fence.rows[0]['[applied]'] ?? false) }}"
                then:
                  - id: refuse_overlapping_writer
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: Persistent schema fence is held. Inspect its owner and server repairs before operator release.
              - id: reread_schema
                type: io.kestra.plugin.cassandra.standard.Query
                timeout: PT30S
                session:
                  endpoints:
                    - hostname: "{{ inputs.cql_host }}"
                      port: "{{ inputs.cql_port }}"
                  localDatacenter: "{{ inputs.datacenter }}"
                  username: "{{ inputs.cql_username }}"
                  password: "{{ inputs.cql_password }}"
                cql: "SELECT replication,durable_writes FROM system_schema.keyspaces WHERE keyspace_name='{{ inputs.keyspace }}'"
                fetchType: FETCH
              - id: reread_tables
                type: io.kestra.plugin.cassandra.standard.Query
                timeout: PT30S
                session:
                  endpoints:
                    - hostname: "{{ inputs.cql_host }}"
                      port: "{{ inputs.cql_port }}"
                  localDatacenter: "{{ inputs.datacenter }}"
                  username: "{{ inputs.cql_username }}"
                  password: "{{ inputs.cql_password }}"
                cql: "SELECT table_name,id FROM system_schema.tables WHERE keyspace_name='{{ inputs.keyspace }}' LIMIT 65"
                fetchType: FETCH
              - id: stale_approval_gate
                type: io.kestra.plugin.scripts.python.Script
                pythonVersion: '3.13'
                beforeCommands: ['ln -s /usr/bin/python3 /usr/local/bin/python']
                containerImage: cassandra:5.0.9@sha256:8870ec4d9608abe9160a7d09b51a0f0c13c6a95ea0610266ea58eb7d30a144de
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.docker_network }}"
                  entryPoint: []
                  memory: {memory: 512MB, memorySwap: 512MB}
                  cpu: {cpus: 1}
                env:
                  MODE: reread
                  CONFIG: "{{ render(vars.config) }}"
                inputFiles:
                  schema.json: "{{ outputs.reread_schema.rows | toJson }}"
                  tables.json: "{{ outputs.reread_tables.rows | toJson }}"
                  before.json: "{{ outputs.plan.vars.snapshot | toJson }}"
                script: "{{ vars.admin_script }}"
              - id: topology_fence_gate
                type: io.kestra.plugin.scripts.python.Script
                pythonVersion: '3.13'
                beforeCommands: ['ln -s /usr/bin/python3 /usr/local/bin/python']
                timeout: PT30M
                containerImage: cassandra:5.0.9@sha256:8870ec4d9608abe9160a7d09b51a0f0c13c6a95ea0610266ea58eb7d30a144de
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.docker_network }}"
                  entryPoint: []
                  memory: {memory: 512MB, memorySwap: 512MB}
                  cpu: {cpus: 1}
                env:
                  MODE: topology
                  CONFIG: "{{ render(vars.config) }}"
                  JMX_USERNAME: "{{ inputs.jmx_username }}"
                  JMX_PASSWORD: "{{ inputs.jmx_password }}"
                inputFiles:
                  Admin.java: "{{ vars.admin_launcher }}"
                  topology.json: "{{ outputs.inspect_topology.vars.topology | toJson }}"
                outputFiles: [operations.json]
                script: "{{ vars.admin_script }}"
              - id: increase_only
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.stale_approval_gate.vars.below_floor }}"
                then:
                  - id: alter_replication
                    type: io.kestra.plugin.cassandra.standard.Query
                    timeout: PT30S
                    session:
                      endpoints:
                        - hostname: "{{ inputs.cql_host }}"
                          port: "{{ inputs.cql_port }}"
                      localDatacenter: "{{ inputs.datacenter }}"
                      username: "{{ inputs.cql_username }}"
                      password: "{{ inputs.cql_password }}"
                    cql: >-
                      ALTER KEYSPACE "{{ inputs.keyspace }}" WITH replication = {'class':'NetworkTopologyStrategy','{{ inputs.datacenter }}':'{{ inputs.replication_floor }}'}
                    fetchType: NONE
              - id: materialize_replicas
                type: io.kestra.plugin.scripts.python.Script
                pythonVersion: '3.13'
                beforeCommands: ['ln -s /usr/bin/python3 /usr/local/bin/python']
                timeout: PT1H
                containerImage: cassandra:5.0.9@sha256:8870ec4d9608abe9160a7d09b51a0f0c13c6a95ea0610266ea58eb7d30a144de
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.docker_network }}"
                  entryPoint: []
                  memory: {memory: 512MB, memorySwap: 512MB}
                  cpu: {cpus: 1}
                env:
                  MODE: repair
                  CONFIG: "{{ render(vars.config) }}"
                  JMX_USERNAME: "{{ inputs.jmx_username }}"
                  JMX_PASSWORD: "{{ inputs.jmx_password }}"
                inputFiles:
                  Admin.java: "{{ vars.admin_launcher }}"
                  topology.json: "{{ outputs.inspect_topology.vars.topology | toJson }}"
                outputFiles: [operations.json]
                script: "{{ vars.admin_script }}"
              - id: final_schema
                type: io.kestra.plugin.cassandra.standard.Query
                timeout: PT30S
                session:
                  endpoints:
                    - hostname: "{{ inputs.cql_host }}"
                      port: "{{ inputs.cql_port }}"
                  localDatacenter: "{{ inputs.datacenter }}"
                  username: "{{ inputs.cql_username }}"
                  password: "{{ inputs.cql_password }}"
                cql: "SELECT replication,durable_writes FROM system_schema.keyspaces WHERE keyspace_name='{{ inputs.keyspace }}'"
                fetchType: FETCH
              - id: final_tables
                type: io.kestra.plugin.cassandra.standard.Query
                timeout: PT30S
                session:
                  endpoints:
                    - hostname: "{{ inputs.cql_host }}"
                      port: "{{ inputs.cql_port }}"
                  localDatacenter: "{{ inputs.datacenter }}"
                  username: "{{ inputs.cql_username }}"
                  password: "{{ inputs.cql_password }}"
                cql: "SELECT table_name,id FROM system_schema.tables WHERE keyspace_name='{{ inputs.keyspace }}' LIMIT 65"
                fetchType: FETCH
              - id: final_schema_gate
                type: io.kestra.plugin.scripts.python.Script
                pythonVersion: '3.13'
                beforeCommands: ['ln -s /usr/bin/python3 /usr/local/bin/python']
                containerImage: cassandra:5.0.9@sha256:8870ec4d9608abe9160a7d09b51a0f0c13c6a95ea0610266ea58eb7d30a144de
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.docker_network }}"
                  entryPoint: []
                  memory: {memory: 512MB, memorySwap: 512MB}
                  cpu: {cpus: 1}
                env:
                  MODE: final_schema
                  CONFIG: "{{ render(vars.config) }}"
                inputFiles:
                  schema.json: "{{ outputs.final_schema.rows | toJson }}"
                  tables.json: "{{ outputs.final_tables.rows | toJson }}"
                  before.json: "{{ outputs.plan.vars.snapshot | toJson }}"
                script: "{{ vars.admin_script }}"
              - id: verify_full_data
                type: io.kestra.plugin.scripts.python.Script
                pythonVersion: '3.13'
                beforeCommands: ['ln -s /usr/bin/python3 /usr/local/bin/python']
                timeout: PT30M
                containerImage: cassandra:5.0.9@sha256:8870ec4d9608abe9160a7d09b51a0f0c13c6a95ea0610266ea58eb7d30a144de
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.docker_network }}"
                  entryPoint: []
                  memory: {memory: 512MB, memorySwap: 512MB}
                  cpu: {cpus: 1}
                env:
                  MODE: verify
                  CONFIG: "{{ render(vars.config) }}"
                  JMX_USERNAME: "{{ inputs.jmx_username }}"
                  JMX_PASSWORD: "{{ inputs.jmx_password }}"
                inputFiles:
                  Admin.java: "{{ vars.admin_launcher }}"
                  topology.json: "{{ outputs.inspect_topology.vars.topology | toJson }}"
                outputFiles: [operations.json]
                script: "{{ vars.admin_script }}"
              - id: release_fence
                type: io.kestra.plugin.cassandra.standard.Query
                timeout: PT30S
                session:
                  endpoints:
                    - hostname: "{{ inputs.cql_host }}"
                      port: "{{ inputs.cql_port }}"
                  localDatacenter: "{{ inputs.datacenter }}"
                  username: "{{ inputs.cql_username }}"
                  password: "{{ inputs.cql_password }}"
                cql: "DELETE FROM {{ inputs.lock_keyspace }}.schema_fence WHERE resource='cluster-schema-repair' IF owner='{{ execution.id }}'"
                fetchType: FETCH
              - id: fence_release_gate
                type: io.kestra.plugin.core.flow.If
                condition: "{{ not (outputs.release_fence.rows[0]['[applied]'] ?? false) }}"
                then:
                  - id: refuse_lost_fence
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: Fence ownership changed. Inspect the cooperative writer contract.
    else:
      - id: log_healthy
        type: io.kestra.plugin.core.log.Log
        message: "{{ inputs.keyspace }} meets RF floor and full-data previews are in sync across every declared node."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {'text':'Cassandra replica recovery failed for ' ~ inputs.keyspace ~ '. Execution ' ~ execution.id ~ '. If acquired, the persistent schema fence remains. Inspect server repair status before retry.'} | toJson }}

triggers:
  - id: replica_safety_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: 0 6 * * *
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: Repair Cassandra replicas after raising a keyspace RF floor
  shortDescription: Raise one approved Cassandra RF floor, run full repair across a bounded cluster and reject schema-only recovery with all-data preview checks.
  metaTitle: Cassandra RF floor recovery with full repair in Kestra
  metaDescription: Raise a Cassandra keyspace RF floor under a persistent fence, complete full repair and fail if all-data previews still detect missing replicas.
  description: |
    ## Safety
    RF is schema policy, not proof that old data reached new replicas. This flow covers one NetworkTopologyStrategy keyspace on a complete single-datacenter cluster of two to five Cassandra 5.0.9 nodes. All schema, topology and repair administrators must honor the same persistent fence. Nonparticipants remain a residual race.

    ## How it works
    Native CQL reads replication and stable table IDs. All nodes must be UN with distinct host IDs. A keyspace below the floor needs recovery; one already at the floor is checked with full-data preview to catch interrupted repairs. Dry runs do not alter schema or stream data.
    Write mode requires explicit Pause approval. A native CQL LWT acquires a no-TTL fence in a preprovisioned table. Schema, table IDs and topology are reread under it. RF only increases. Pinned nodetool then runs full repair sequentially on every node with one job thread. The CQL plugin has no JMX task, so a bounded Python subprocess drives Cassandra's native admin tool. Final CQL preserves table IDs and durable_writes. Full-data previews must all report in-sync before conditional fence release.

    ## What you get
    Schema evidence, node identities and repair records in execution history. An approved recovery requires the floor and full-data agreement before releasing its fence. Safe-mode success only reports findings. Failed recovery retains its fence for inspection.

    ## Who it's for
    Cassandra operators correcting RF=1 application keyspaces or finishing repairs after an interrupted RF increase in a small controlled maintenance window.

    ## Why orchestrate this with Kestra
    Approval, native CQL mutation, cluster repair and verification share one execution. A rerun detects real replica mismatch even when a previous ALTER landed. Queue concurrency serializes this flow; the database fence coordinates participating external administrators.

    ## Tested end to end
    Certified Kestra 2.0.6 and 2.0.5 runs include a fresh two-node fixture. Dry run, declined approval, repair, repeat, refused ALTER, stale approval and partial recovery passed. SSTables held 12 and 20 partitions before recovery, then 32 each. All 32 protected rows and application values survived. Existing authenticated sessions read 32 rows with either peer stopped; fresh login still needs system_auth quorum.

    ## Prerequisites
    Two to five private Cassandra 5.0.9 nodes in one datacenter. CQL and JMX endpoints must belong to this same trusted cluster. CQL role: ALTER on the target and SELECT, MODIFY on the fence. JMX: info, status, netstats, version and repair. Isolate the admin network. Provision schema_fence(resource text PRIMARY KEY, owner text) without TTL in a replicated maintenance keyspace. All administrators lock cluster-schema-repair before schema, topology or repair work.

    ### Secrets
    CASSANDRA_USERNAME, CASSANDRA_PASSWORD, CASSANDRA_JMX_USERNAME, CASSANDRA_JMX_PASSWORD and SLACK_WEBHOOK_URL. Credentials are SECRET inputs. The JMX password-file is task-local, removed on the normal cleanup path and never an output. Whitespace in JMX credentials is refused. Do not expose unauthenticated JMX publicly.

    ### Inputs
    Set keyspace, datacenter, cql_host, complete nodes and docker_network. Defaults: floor 2, deadline 120 seconds, max_tables 16. Bounds: floor 2 to 5, tables 1 to 64, each command 10 to 300 seconds and output at most 1MiB. System, lock, missing, empty, transient and multi-DC keyspaces are refused.

    ## Quick start
    Provision the fence and minimum roles. Configure secrets and private networking. Run safe mode first. Enable writes only after reviewing the snapshot, then approve true. On failure inspect operations.json, nodetool netstats and server repair status. Confirm no old execution or server repair is active before conditionally removing its exact owner fence. Never automatically expire or steal it. Rerun to reconcile actual RF and replica data.

    ## How to extend
    Per-DC policy needs complete coverage tests. Full preview is point-in-time equality, not hardware durability. It consumes IO in safe mode. A client deadline may leave server repair running; the retained fence is intentional. No automatic retries, topology changes, lock takeover or RF lowering.

    ## Links
    - [Cassandra repair](https://cassandra.apache.org/doc/5.0/cassandra/managing/operating/repair.html)
    - [Cassandra CQL schema](https://cassandra.apache.org/doc/5.0/cassandra/developing/cql/ddl.html)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags: [Data, Infrastructure]
  subTags: [Day 2 Operations, Monitoring & Alerting]
  ee: false
  demo: false
