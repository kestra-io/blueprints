id: kafka-connect-connector-config-drift-guard
namespace: company.team
description: Restore missing fields in an existing Kafka Connect masking policy without removing extra masks.
concurrency:
  limit: 1
  behavior: QUEUE
inputs:
  - id: connect_url
    type: STRING
    defaults: "{{ secret('KAFKA_CONNECT_URL') }}"
  - id: connect_username
    type: STRING
    defaults: "{{ secret('KAFKA_CONNECT_USERNAME') }}"
  - id: connect_password
    type: SECRET
    defaults: "{{ secret('KAFKA_CONNECT_PASSWORD') }}"
  - id: connector_name
    type: STRING
    defaults: orders-sink
  - id: mask_alias
    type: STRING
    defaults: redact
  - id: required_fields
    type: ARRAY
    itemType: STRING
    defaults: [email]
    description: Reviewed top-level field identifiers that must remain masked. Extra live masks are preserved.
  - id: auto_remediate
    type: BOOL
    defaults: false
  - id: dry_run
    type: BOOL
    defaults: true
  - id: slack_url
    type: SECRET
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
tasks:
  - id: validate_scope
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ inputs.connector_name | length == 0 or inputs.connector_name | length > 128 or
      inputs.mask_alias | length == 0 or inputs.mask_alias | length > 32 or
      (inputs.mask_alias | replace({'[A-Za-z0-9_]': ''}, regexp=true) | length) > 0 or
      inputs.required_fields | length == 0 or inputs.required_fields | length > 32 or
      (inputs.required_fields | jq('[.[] | select(type != "string" or (test("^[A-Za-z_][A-Za-z0-9_]{0,63}$") | not))] | length') | first) > 0 or
      (inputs.required_fields | jq('unique | length') | first) != inputs.required_fields | length }}
    then:
      - id: invalid_scope
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: Use one connector name of at most128 characters, an identifier alias and1 to32 unique top-level field identifiers of at most64 characters.
  - id: read_config
    type: io.kestra.plugin.kafka.ConnectorGetConfig
    timeout: PT20S
    connectUrl: "{{ inputs.connect_url }}"
    username: "{{ inputs.connect_username }}"
    password: "{{ inputs.connect_password }}"
    connectorName: "{{ inputs.connector_name }}"
  - id: read_status
    type: io.kestra.plugin.kafka.ConnectorGetStatus
    timeout: PT20S
    connectUrl: "{{ inputs.connect_url }}"
    username: "{{ inputs.connect_username }}"
    password: "{{ inputs.connect_password }}"
    connectorName: "{{ inputs.connector_name }}"
  - id: read_plugins
    type: io.kestra.plugin.core.http.Request
    description: The Kafka plugin has no connector-class inventory task. Read the native worker inventory to distinguish sinks from sources.
    timeout: PT20S
    uri: "{{ inputs.connect_url }}/connector-plugins"
    method: GET
    options:
      auth:
        type: BASIC
        username: "{{ inputs.connect_username }}"
        password: "{{ inputs.connect_password }}"
  - id: policy
    type: io.kestra.plugin.core.output.OutputValues
    values:
      plan: >-
        {{ {'config': outputs.read_config.config, 'alias': inputs.mask_alias, 'required': inputs.required_fields} | jq('. as $r | ("transforms." + .alias + ".") as $p | (.config[$p + "fields"] // "" | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $live | ($r.required - $live) as $missing | {missing: $missing, fields: (($live + $missing) | join(",")), valid: ((($live + $missing) | length) <= 64 and ($live | map(select(. == "" or length > 64)) | length) == 0 and ($live | unique | length) == ($live | length)), expected: ($r.config + {($p + "fields"): (($live + $missing) | join(","))})}') | first | toJson }}
  - id: compatible_policy
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ outputs.read_config.config | toJson | length > 65536 or
      (outputs.read_plugins.body | jq('[.[] | select(.class == ' ~ (outputs.read_config.config['connector.class'] | toJson) ~ ' and .type == "sink")] | length') | first) != 1 or
      ((outputs.read_config.config['transforms'] ?? '') | split(',') | last | trim) != inputs.mask_alias or
      (outputs.read_config.config['transforms.' ~ inputs.mask_alias ~ '.type'] ?? '') != 'org.apache.kafka.connect.transforms.MaskField$Value' or
      outputs.read_config.config['transforms.' ~ inputs.mask_alias ~ '.predicate'] is defined or
      outputs.read_config.config['transforms.' ~ inputs.mask_alias ~ '.replacement'] is defined or
      not fromJson(outputs.policy.values.plan).valid }}
    then:
      - id: incompatible_policy
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: Require a sink with an existing terminal unconditional MaskField$Value, no custom replacement and1 to64 distinct live fields. Config ceiling64KiB. No change made.
  - id: report
    type: io.kestra.plugin.core.log.Log
    message: >-
      Required masking fields absent={{ fromJson(outputs.policy.values.plan).missing | length }}.
      Existing extra masks will be retained. This checks configuration, not previous destination data.
  - id: missing_mask
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.policy.values.plan).missing | length > 0 }}"
    then:
      - id: alert_drift
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        timeout: PT20S
        url: "{{ inputs.slack_url }}"
        payload: "{{ {'text': 'Kafka Connect masking policy is missing ' ~ (fromJson(outputs.policy.values.plan).missing | length) ~ ' required fields. Execution ' ~ execution.id ~ '. Existing output is not repaired.'} | toJson }}"
      - id: live_change
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approve
            type: io.kestra.plugin.core.flow.Pause
            timeout: PT1H
            description: Approve adding the missing masks and restarting tasks. Quiesce all competing connector configuration and deletion automation until this execution ends. This flow cannot fence an independent admin.
            onResume:
              - id: approved
                type: BOOL
                defaults: false
              - id: exclusive_admin
                type: BOOL
                defaults: false
          - id: approved_change
            type: io.kestra.plugin.core.flow.If
            condition: "{{ (outputs.approve.onResume.approved ?? false) and (outputs.approve.onResume.exclusive_admin ?? false) }}"
            then:
              - id: fresh_config
                type: io.kestra.plugin.kafka.ConnectorGetConfig
                timeout: PT20S
                connectUrl: "{{ inputs.connect_url }}"
                username: "{{ inputs.connect_username }}"
                password: "{{ inputs.connect_password }}"
                connectorName: "{{ inputs.connector_name }}"
              - id: fresh_status
                type: io.kestra.plugin.kafka.ConnectorGetStatus
                timeout: PT20S
                connectUrl: "{{ inputs.connect_url }}"
                username: "{{ inputs.connect_username }}"
                password: "{{ inputs.connect_password }}"
                connectorName: "{{ inputs.connector_name }}"
              - id: reject_stale
                type: io.kestra.plugin.core.flow.If
                condition: >-
                  {{ outputs.fresh_config.config != outputs.read_config.config or
                  outputs.fresh_status.connectorState != 'RUNNING' or
                  outputs.fresh_status.tasks | length == 0 or
                  (outputs.fresh_status.tasks | jq('[.[] | select(.state != "RUNNING")] | length') | first) > 0 }}
                then:
                  - id: stale_policy
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: Approved config changed or tasks are not all RUNNING. Reconcile actual state before retrying. No write made.
              - id: restore_fields
                type: io.kestra.plugin.kafka.ConnectorUpdateConfig
                timeout: PT20S
                connectUrl: "{{ inputs.connect_url }}"
                username: "{{ inputs.connect_username }}"
                password: "{{ inputs.connect_password }}"
                connectorName: "{{ inputs.connector_name }}"
                config: "{{ fromJson(outputs.policy.values.plan).expected }}"
              - id: await_running
                type: io.kestra.plugin.core.flow.LoopUntil
                condition: >-
                  {{ outputs.poll_status.connectorState == 'RUNNING' and outputs.poll_status.tasks | length > 0 and (outputs.poll_status.tasks | jq('[.[] | select(.state != "RUNNING")] | length') | first) == 0 }}
                failOnMaxReached: true
                checkFrequency:
                  interval: PT2S
                  maxIterations: 15
                tasks:
                  - id: poll_status
                    type: io.kestra.plugin.kafka.ConnectorGetStatus
                    timeout: PT20S
                    connectUrl: "{{ inputs.connect_url }}"
                    username: "{{ inputs.connect_username }}"
                    password: "{{ inputs.connect_password }}"
                    connectorName: "{{ inputs.connector_name }}"
              - id: verify_config
                type: io.kestra.plugin.kafka.ConnectorGetConfig
                timeout: PT20S
                connectUrl: "{{ inputs.connect_url }}"
                username: "{{ inputs.connect_username }}"
                password: "{{ inputs.connect_password }}"
                connectorName: "{{ inputs.connector_name }}"
              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.verify_config.config != fromJson(outputs.policy.values.plan).expected }}"
                then:
                  - id: ineffective_write
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: Config differs from the exact approved result. Inspect actual config before retrying; no rollback or replay was attempted.
              - id: restored
                type: io.kestra.plugin.core.log.Log
                message: Missing masks restored with extra masks and unrelated config preserved. Tasks report RUNNING. Test a synthetic destination canary before closing the incident.
triggers:
  - id: daily_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true
errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    timeout: PT20S
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: "{{ {'text': 'Kafka Connect masking guard failed. Inspect actual config before another change. Execution ' ~ execution.id} | toJson }}"

extend:
  # SPDX-License-Identifier: Apache-2.0
  title: Restore missing Kafka Connect field masks after a live config edit
  shortDescription: Add missing required fields to an existing terminal MaskField policy while preserving extra masks and unrelated connector configuration.
  metaTitle: Kafka Connect masking configuration drift guard
  metaDescription: Detect missing Kafka Connect field masks, require approval, preserve extra masks and verify the exact config plus running tasks.
  description: |
    ## How it works

    A live edit can remove a MaskField field while the sink still runs and later records expose it. This flow compares required fields with one terminal MaskField$Value policy. It adds missing fields and preserves extra masks plus unrelated config.

    Native config/status reads inspect the sink. Live mode needs both mode inputs, approval and quiesced competing administrators. Fresh full-config and health reads reject stale approvals. ConnectorUpdateConfig preserves the config with one fields-list change. A bounded poll requires RUNNING tasks. Exact verification catches unexpected values.

    ## What you get

    A masking-policy finding and additive repair. Previous output is not repaired. A canary must still check destination data.

    ## Who it's for

    Connect operators with reviewed top-level fields and a terminal unconditional MaskField$Value transform.

    ## Why orchestrate this with Kestra

    Approval separates detection from restart. The execution retains its snapshot, queues runs and makes failed readback visible. External administrators need coordination.

    ## Tested end to end

    Kestra2.0.6 and2.0.5, Kafka plugin1.10.6 and1.10.5, Connect7.9.0. A FileStream/JsonConverter sink committed three records and stayed RUNNING after a hot edit removed email masking. The next synthetic email was exposed. Repair masked later email values, retained the phone mask and amount17. Source records and previous sink output survived. A second fresh fixture reproduced the incident and repair.

    | Case | Execution | Result |
    | --- | --- | --- |
    | Healthy | `3sFDHuhmlFMxMuplkS2pvQ` | SUCCESS |
    | Dry | `V9fJ6tqV73QVkdNtPwpQ9` | SUCCESS |
    | Declined | `6D267MY6gO72lrV415Eefr` | SUCCESS |
    | Repair | `4QMkev4fMmIZvmpxNbSO1W` | SUCCESS |
    | Ineffective200 | `lxatQOZ92iLbmuREex55z` | FAILED |
    | Repeat | `52CPNrR2Uy70WDmMzAmk7i` | SUCCESS |
    | Stale config | `5obRgzC3ey8hYByzJFc1JB` | FAILED |
    | Old repair | `51DNC9o3ivvJWZNimJK1Ds` | SUCCESS |
    | Fresh repair | `sFYHC27W79Sm5qgJJ5fpg` | SUCCESS |

    ## Prerequisites

    REST permission to read plugin inventory and one connector's config/status, plus replace that config in live mode. HTTP inventory fills a missing native plugin task. Configs need credential-provider references because native reads are persisted. Restrict execution access. Enforce a64KiB gateway response ceiling. Native calls time out after20 seconds.

    ### Secrets

    KAFKA_CONNECT_URL, KAFKA_CONNECT_USERNAME and KAFKA_CONNECT_PASSWORD provide REST access. SLACK_WEBHOOK_URL receives alerts. Password and webhook inputs are SECRET.

    ### Inputs

    connector_name selects one existing sink, at most128 characters. mask_alias identifies the existing terminal transform, at most32 identifier characters. required_fields contains1 to32 unique identifiers, each at most64 characters. Extra live masks remain. auto_remediate defaults false and dry_run true. The daily trigger is disabled with safe inputs.

    ## Quick start

    1. Configure secrets and the gateway ceiling. Keep required fields in reviewed flow defaults alongside the connector policy.
    2. Run safely and inspect missing fields.
    3. Quiesce competing connector administrators. Run with auto_remediate=true and dry_run=false. Approve the added masks with approved=true and exclusive_admin=true.
    4. Verify a synthetic destination record. Previously exposed values need a separate incident response.

    ## How to extend

    Add destination-specific synthetic canaries. Keep required fields reviewed with deployments; this is not an arbitrary full-config rollback.

    Limits: one sink, one terminal transform and64 field names. Predicates, custom replacements and nonrunning tasks cannot be changed. Nested fields and schema changes are outside this policy. Restarts can duplicate writes. QUEUE1 covers this flow only. Connect has no config CAS or incarnation ID. Exclusive administration is cooperative; an independent edit in the final round trip can still be overwritten. Failed recovery needs a fresh audit, no blind retry or offset replay.

    ## Links

    - [Kafka MaskField source](https://github.com/apache/kafka/blob/3.9.0/connect/transforms/src/main/java/org/apache/kafka/connect/transforms/MaskField.java)
    - [Kafka Connect REST resource](https://github.com/apache/kafka/blob/3.9.0/connect/runtime/src/main/java/org/apache/kafka/connect/runtime/rest/resources/ConnectorsResource.java)
    - [Kestra Kafka plugin](https://kestra.io/plugins/plugin-kafka)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags: [Data, Infrastructure]
  subTags: [Realtime & Streaming, Day 2 Operations]
  ee: false
  demo: false
