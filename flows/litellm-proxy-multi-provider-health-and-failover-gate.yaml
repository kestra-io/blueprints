id: litellm-proxy-multi-provider-health-and-failover-gate
namespace: company.ai

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: litellm_proxy_url
    type: STRING
    displayName: LiteLLM Proxy URL
    required: true
    defaults: "http://litellm-proxy.internal.net:4000"
    description: "Base HTTP URL of the enterprise LiteLLM Proxy endpoint."

  - id: test_prompt
    type: STRING
    displayName: Canary Prompt
    required: true
    defaults: "Respond with the single word PONG if you receive this message."
    description: "Canary inference query sent across upstream LLM providers to verify health."

  - id: primary_model
    type: STRING
    displayName: Primary Model Routing
    required: true
    defaults: "gpt-4o"
    description: "Primary LLM route audited through the LiteLLM proxy."

  - id: fallback_model
    type: STRING
    displayName: Fallback Model Route
    required: true
    defaults: "gemini-2.5-flash"
    description: "Secondary model route verified if primary route encounters rate limits or latency degradation."

  - id: max_latency_ms
    type: INT
    displayName: Max Latency SLA (ms)
    required: true
    defaults: 2500
    description: "Latency ceiling in milliseconds before flagging provider SLA degradation."

tasks:
  - id: log_audit_start
    type: io.kestra.plugin.core.log.Log
    message: "🚦 Probing LiteLLM proxy routing at '{{ inputs.litellm_proxy_url }}' (Primary: {{ inputs.primary_model }}, Fallback: {{ inputs.fallback_model }})"

  - id: test_primary_route
    type: io.kestra.plugin.scripts.python.Script
    description: "Query primary LLM route via LiteLLM proxy and measure response latency"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    dependencies:
      - requests==2.32.3
      - kestra
    env:
      PROXY_URL: "{{ inputs.litellm_proxy_url }}"
      MODEL: "{{ inputs.primary_model }}"
      PROMPT: "{{ inputs.test_prompt }}"
      PROXY_KEY: "{{ secret('LITELLM_MASTER_KEY') }}"
    script: |
      import os
      import time
      import requests
      from kestra import Kestra

      proxy_url = os.environ["PROXY_URL"].rstrip("/")
      model = os.environ["MODEL"]
      prompt = os.environ["PROMPT"]
      key = os.environ.get("PROXY_KEY", "")

      headers = {"Content-Type": "application/json"}
      if key:
          headers["Authorization"] = f"Bearer {key}"

      url = f"{proxy_url}/chat/completions"
      payload = {
          "model": model,
          "messages": [{"role": "user", "content": prompt}],
          "max_tokens": 10
      }

      start_time = time.time()
      is_success = False
      error_msg = ""
      response_text = ""
      latency_ms = 0

      try:
          resp = requests.post(url, json=payload, headers=headers, timeout=10)
          latency_ms = int((time.time() - start_time) * 1000)
          if resp.status_code == 200:
              data = resp.json()
              response_text = data["choices"][0]["message"]["content"].strip()
              is_success = True
          else:
              error_msg = f"HTTP {resp.status_code}: {resp.text}"
      except Exception as e:
          latency_ms = int((time.time() - start_time) * 1000)
          error_msg = str(e)

      print(f"Primary model {model} probed: success={is_success}, latency={latency_ms}ms, error={error_msg}")

      Kestra.outputs({
          "is_success": is_success,
          "latency_ms": latency_ms,
          "error_msg": error_msg,
          "response": response_text
      })

  - id: evaluate_failover_condition
    type: io.kestra.plugin.core.flow.If
    description: "Evaluate if primary route failed or exceeded SLA, triggering canary test on fallback route"
    condition: "{{ not outputs.test_primary_route.vars.is_success or outputs.test_primary_route.vars.latency_ms > inputs.max_latency_ms }}"
    then:
      - id: log_failover_trigger
        type: io.kestra.plugin.core.log.Log
        message: "⚠️ Primary route {{ inputs.primary_model }} breached SLA or failed (Latency: {{ outputs.test_primary_route.vars.latency_ms }}ms). Validating fallback route {{ inputs.fallback_model }}..."

      - id: test_fallback_route
        type: io.kestra.plugin.scripts.python.Script
        description: "Verify readiness of fallback LLM provider to ensure uninterrupted traffic routing"
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.11-slim
        dependencies:
          - requests==2.32.3
          - kestra
        env:
          PROXY_URL: "{{ inputs.litellm_proxy_url }}"
          MODEL: "{{ inputs.fallback_model }}"
          PROMPT: "{{ inputs.test_prompt }}"
          PROXY_KEY: "{{ secret('LITELLM_MASTER_KEY') }}"
        script: |
          import os
          import time
          import requests
          from kestra import Kestra

          proxy_url = os.environ["PROXY_URL"].rstrip("/")
          model = os.environ["MODEL"]
          prompt = os.environ["PROMPT"]
          key = os.environ.get("PROXY_KEY", "")

          headers = {"Content-Type": "application/json"}
          if key:
              headers["Authorization"] = f"Bearer {key}"

          url = f"{proxy_url}/chat/completions"
          payload = {
              "model": model,
              "messages": [{"role": "user", "content": prompt}],
              "max_tokens": 10
          }

          start = time.time()
          is_healthy = False
          err = ""

          try:
              resp = requests.post(url, json=payload, headers=headers, timeout=10)
              latency = int((time.time() - start) * 1000)
              is_healthy = (resp.status_code == 200)
              if not is_healthy:
                  err = f"HTTP {resp.status_code}: {resp.text}"
          except Exception as e:
              latency = int((time.time() - start) * 1000)
              err = str(e)

          print(f"Fallback model {model}: healthy={is_healthy}, latency={latency}ms")
          Kestra.outputs({
              "is_healthy": is_healthy,
              "latency_ms": latency,
              "error": err
          })

      - id: notify_slack_failover
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Alert AI Platform on-call about primary degradation and fallback health status"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "⚠️ LiteLLM Primary Route Degradation",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Primary Model:* `{{ inputs.primary_model }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Primary Latency:* `{{ outputs.test_primary_route.vars.latency_ms }}ms`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Fallback Model:* `{{ inputs.fallback_model }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Fallback Ready:* `{{ outputs.test_fallback_route.vars.is_healthy }}`"
                  }
                ]
              }
            ]
          }

  - id: record_health_state
    type: io.kestra.plugin.core.kv.Set
    description: "Store gateway health metrics in Kestra KV store for telemetry and dashboard monitoring"
    key: "litellm_proxy_status"
    value: |
      {
        "primary_model": "{{ inputs.primary_model }}",
        "primary_healthy": {{ outputs.test_primary_route.vars.is_success }},
        "primary_latency_ms": {{ outputs.test_primary_route.vars.latency_ms }},
        "timestamp": "{{ execution.startDate }}",
        "execution_id": "{{ execution.id }}"
      }

errors:
  - id: alert_proxy_unreachable
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Immediate alert when the LiteLLM proxy instance itself is unreachable"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "blocks": [
          {
            "type": "header",
            "text": {
              "type": "plain_text",
              "text": "🚨 LiteLLM Proxy Endpoint Outage",
              "emoji": true
            }
          },
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "LiteLLM gateway probe at `{{ inputs.litellm_proxy_url }}` failed completely on execution `{{ execution.id }}`."
            }
          }
        ]
      }

extend:
  title: LiteLLM Proxy Multi-Provider Health and Failover Validation Gate
  metaTitle: LiteLLM Gateway Health Probe and Failover Route Sentinel
  shortDescription: Probes LiteLLM proxy routes, audits SLA latency bounds, verifies fallback models, and posts Slack alerts.
  metaDescription: Validate LiteLLM proxy endpoints, audit primary route latency SLAs, verify fallback model availability, and persist health metrics in Kestra KV store.
  tags:
    - AI
    - Infrastructure
  subTags:
    - Python
    - Docker
    - Slack
  ee: false
  demo: false
  description: |
    ## How it works
    1. **Primary Route Canary Probe**: Sends a minimal token test prompt to the LiteLLM proxy's `/chat/completions` endpoint targeting the primary model.
    2. **Latency & SLA Measurement**: Computes exact round-trip response latency and checks for upstream provider HTTP status codes.
    3. **Automated Fallback Verification**: If the primary provider fails or exceeds the configured latency ceiling, dynamically tests the secondary fallback model route to guarantee high availability.
    4. **Health State Cataloging**: Records provider metrics, response times, and failure diagnostics in Kestra KV store (`io.kestra.plugin.core.kv.Set`).
    5. **Multi-Channel Alerting**: Dispatches diagnostic alerts to Slack with operational recommendations and dead-letter error catching.

    ## What you get
    - Proactive detection of upstream LLM outages before user-facing applications suffer.
    - Automated verification of secondary fallback models.
    - Historical gateway latency telemetry tracked inside Kestra KV store.
    - Zero external dependencies beyond standard containerized Python runners.

    ## Who it's for
    - AI Platform Engineers and SREs managing multi-provider LLM gateways.
    - Teams enforcing strict uptime SLAs across OpenAI, Anthropic, and Google Gemini endpoints.

    ## Why orchestrate this with Kestra
    - Combines containerized HTTP client testing (`io.kestra.plugin.scripts.runner.docker.Docker`) with native conditional logic (`io.kestra.plugin.core.flow.If`).
    - Eliminates bespoke monitoring scripts with automatic state persistence, secret masking, and dead-letter handling.

    ## Prerequisites
    - Running LiteLLM Proxy instance accessible over network.
    - Slack incoming webhook URL for notifications.

    ### Secrets
    - `LITELLM_MASTER_KEY`: Master API key for LiteLLM proxy authentication.
    - `SLACK_WEBHOOK_URL`: Webhook URL for alerting.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Set `LITELLM_MASTER_KEY` and `SLACK_WEBHOOK_URL` in your namespace secrets.
    3. Attach an `io.kestra.plugin.core.trigger.Schedule` to run canary audits every 5 minutes.

    ## How to extend
    - Add an automated update step that alters the LiteLLM routing table config via admin API when primary failure persists.
    - Wire alerts to PagerDuty or OpsGenie for automated incident management.

    ## Links
    - [LiteLLM Proxy Documentation](https://docs.litellm.ai/docs/proxy/overview)
    - [Kestra Docker Script Plugin](https://kestra.io/plugins/plugin-scripts-docker)
