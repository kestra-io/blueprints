id: semgrep-sast-pr-gate
namespace: company.security
description: |
  Gate application source with Semgrep static analysis on every CI push:
  check out the repository, scan it with the community security-audit pack
  inside the official Semgrep container, parse the JSON report, and when
  findings exist open a labeled GitHub issue, alert Slack, and publish a
  failing verdict. Clean scans publish a passing verdict with the stored
  report attached, and a disabled daily schedule ships as a net for
  pushes whose webhook was skipped.

triggers:
  - id: on_push
    type: io.kestra.plugin.core.trigger.Webhook
    description: CI POSTs here on every push carrying the repository, ref, and commit so the SAST scan runs against the code that just landed.
    key: "{{ secret('SAST_WEBHOOK_KEY') }}"
  - id: daily_net
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily 06:00 UTC safety net for pushes whose webhook was skipped - stays disabled until the webhook is proven in your environment.
    cron: "0 6 * * *"
    disabled: true

inputs:
  - id: repository
    type: STRING
    defaults: your-org/your-app
    description: GitHub repository to scan in owner/repo form; also the target where a findings issue is opened.
  - id: ref
    type: STRING
    defaults: main
    description: Branch ref to check out and scan, typically the branch the push targeted.
  - id: commit_sha
    type: STRING
    defaults: HEAD
    description: Commit SHA reported by the push payload, recorded in the issue and Slack alert for traceability; HEAD scans the tip of the ref.

tasks:
  # --- 1. Shared workspace ---
  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the clone, the Semgrep container, and the report parser all see the same files.
    tasks:
      # --- 1a. Fetch source ---
      - id: clone_repository
        type: io.kestra.plugin.git.Clone
        description: Check out the repository at the pushed ref, authenticated with the GitHub token, so the scanner reads real application source.
        url: "https://github.com/{{ inputs.repository }}.git"
        username: x-access-token
        password: "{{ secret('GITHUB_TOKEN') }}"
        branch: "{{ inputs.ref }}"

      # --- 1b. Static analysis scan ---
      - id: run_semgrep
        type: io.kestra.plugin.scripts.shell.Commands
        description: Run Semgrep with the p/security-audit pack in its official container. The trailing || true absorbs the non-zero exit Semgrep returns when findings exist, so the parsed report, not the exit code, drives the gate.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: semgrep/semgrep:latest
        outputFiles:
          - semgrep-report.txt
        commands:
          - semgrep scan --config p/security-audit --json --output semgrep-report.txt || true

      # --- 1c. Parse the report into a verdict ---
      - id: parse_report
        type: io.kestra.plugin.scripts.python.Script
        description: Turn the Semgrep JSON report into a verdict, findings count, error count, the top firing rules, and the scan end time, emitted through the outputs protocol for the gate below.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          import json
          import os
          from collections import Counter

          path = "semgrep-report.txt"
          verdict = "pass"
          findings_count = 0
          error_count = 0
          top_rules = []
          top_rules_summary = "none"
          scan_time = "unknown"

          raw = ""
          if os.path.exists(path):
              with open(path) as f:
                  raw = f.read()

          report = None
          if raw.strip():
              try:
                  report = json.loads(raw)
              except ValueError:
                  report = None

          if isinstance(report, dict):
              results = report.get("results") or []
              errors = report.get("errors") or []
              findings_count = len(results)
              error_count = len(errors)
              ranked = sorted(
                  Counter(r.get("check_id", "unknown") for r in results).items(),
                  key=lambda kv: (-kv[1], kv[0]),
              )
              top_rules = [name for name, _ in ranked[:5]]
              if ranked:
                  top_rules_summary = ", ".join(
                      "%s (%d)" % (name, count) for name, count in ranked[:5]
                  )
              time_block = report.get("time") or {}
              end = time_block.get("end")
              if end:
                  scan_time = str(end)
              verdict = "fail" if findings_count > 0 else "pass"
          else:
              verdict = "error"
              error_count = 1

          print("Semgrep scan %s - %d finding(s), %d error(s)" % (verdict.upper(), findings_count, error_count))
          print("::" + json.dumps({"outputs": {"verdict": verdict, "findings_count": findings_count, "error_count": error_count, "top_rules": top_rules, "top_rules_summary": top_rules_summary, "scan_time": scan_time}}, ensure_ascii=True) + "::")

  # --- 2. Findings gate ---
  - id: check_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch on the parsed findings count - any finding escalates as an issue and a Slack alert, a clean scan just records the all-clear.
    condition: "{{ outputs.parse_report.vars.findings_count > 0 }}"
    then:
      - id: create_issue
        type: io.kestra.plugin.github.issues.Create
        description: Open a labeled GitHub issue naming the repository and the finding count in the title, so SAST debt lands in the same backlog engineers already triage.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.repository }}"
        title: "Semgrep SAST findings in {{ inputs.repository }} - {{ outputs.parse_report.vars.findings_count }} at {{ inputs.commit_sha }}"
        body: |
          ## Semgrep SAST findings

          **{{ outputs.parse_report.vars.findings_count }} finding(s)** in `{{ inputs.repository }}` at commit `{{ inputs.commit_sha }}` (ref `{{ inputs.ref }}`).

          Top rules: {{ outputs.parse_report.vars.top_rules_summary }}.

          Scan errors: {{ outputs.parse_report.vars.error_count }}. Scan finished: {{ outputs.parse_report.vars.scan_time }}.

          Report: {{ outputs.run_semgrep.outputFiles['semgrep-report.txt'] }}

          Execution: {{ execution.id }}

          Triage every finding, fix it or suppress it with a documented reason, then re-run the gate to confirm the count drops.
        labels:
          - security
          - sast
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Escalate to the security channel with the finding count, the top firing rules, and a pointer to the new GitHub issue.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Semgrep SAST found {{ outputs.parse_report.vars.findings_count }} issue(s) in {{ inputs.repository }} at {{ inputs.commit_sha }}: {{ outputs.parse_report.vars.top_rules_summary }}. A labeled GitHub issue has been opened. Execution {{ execution.id }}."
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record the all-clear with the zero finding count and the stored report URI, so a healthy scan still shows up as evidence in the execution history.
        message: "Semgrep scan clean for {{ inputs.repository }} at {{ inputs.commit_sha }} - 0 findings. Report: {{ outputs.run_semgrep.outputFiles['semgrep-report.txt'] }}"

errors:
  - id: notify_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Escalate any failure - clone error, image pull failure, parser crash - because a broken scanner must never read as a clean scan.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }} - Semgrep SAST scan did not complete for {{ inputs.repository }} at {{ inputs.commit_sha }}. Verify GITHUB_TOKEN, Docker access, and worker network. No gate verdict was produced."}

outputs:
  - id: verdict
    type: STRING
    description: Gate verdict from the parsed report - pass when no findings, fail when findings exist, error when the report could not be parsed.
    value: "{{ outputs.parse_report.vars.verdict }}"
  - id: findings_count
    type: INT
    description: Number of Semgrep findings in the scan, e.g. 0 on a clean run.
    value: "{{ outputs.parse_report.vars.findings_count }}"
  - id: top_rules
    type: ARRAY
    description: 'Top five Semgrep rule IDs that fired, ordered by count, e.g. ["python.lang.security.audit.sqlalchemy.sql-string-format", ...].'
    value: "{{ outputs.parse_report.vars.top_rules | toJson }}"
  - id: report_uri
    type: STRING
    description: Internal storage URI of the raw Semgrep JSON report, ready for archival or deeper triage.
    value: "{{ outputs.run_semgrep.outputFiles['semgrep-report.txt'] }}"

extend:
  title: Gate Your Push Pipeline on Semgrep Static Analysis Findings
  shortDescription: On every push, clone the repo, run Semgrep in a container, and escalate findings as a labeled GitHub issue plus a Slack alert.
  metaTitle: Semgrep SAST Gate on Push with GitHub and Slack
  metaDescription: Run Semgrep SAST on every push, parse the report, and escalate findings with a labeled GitHub issue and a Slack alert in Kestra.
  description: |
    Secrets scanners catch leaked keys, but they say nothing about SQL injection, command injection, unsafe deserialization, or the dozen other classes of flaw that live in application source. This blueprint wires Semgrep into your push pipeline. CI POSTs to a keyed webhook, the repository is checked out into a shared working directory, Semgrep runs in its official container with the community p/security-audit pack, and a small Python step turns the JSON report into a verdict with a findings count, the rules that fired, and the scan timestamp. When findings exist the flow opens a labeled GitHub issue and alerts Slack, so SAST debt lands in the team's existing backlog instead of a report nobody opens. A clean scan records the all-clear with a pointer to the stored report, and a disabled daily schedule ships as a net for pushes whose webhook was skipped.

    ## How it works

    1. The `on_push` trigger (`io.kestra.plugin.core.trigger.Webhook`) exposes a keyed URL for your CI push hook to POST to with the repository, ref, and commit.
    2. `daily_net` (`io.kestra.plugin.core.trigger.Schedule`) is a 06:00 UTC daily run shipped disabled. Remove `disabled: true` once the webhook is proven so a missed hook cannot silently skip the gate.
    3. `workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared filesystem for everything that follows, so the scanner sees the clone and the parser sees the report.
    4. `clone_repository` (`io.kestra.plugin.git.Clone`) checks out `{{ inputs.repository }}` at `{{ inputs.ref }}`, authenticating with the `GITHUB_TOKEN` secret.
    5. `run_semgrep` (`io.kestra.plugin.scripts.shell.Commands` on the `io.kestra.plugin.scripts.runner.docker.Docker` runner, image `semgrep/semgrep:latest`) executes `semgrep scan --config p/security-audit --json --output semgrep-report.txt || true`. The trailing `|| true` absorbs the non-zero exit Semgrep returns when findings exist, the JSON report is always written, and the parsed report drives the gate.
    6. `parse_report` (`io.kestra.plugin.scripts.python.Script` on the Process runner) reads the report and emits `verdict`, `findings_count`, `error_count`, `top_rules`, `top_rules_summary`, and `scan_time` as a single-line `::{"outputs": ...}::` JSON payload. A missing or unparseable report yields `verdict: error` rather than a false clean.
    7. `check_findings` (`io.kestra.plugin.core.flow.If`) branches on `findings_count`. Over zero, `create_issue` (`io.kestra.plugin.github.issues.Create`) opens an issue titled with the repository and the count and labeled `security` and `sast`, and `alert_slack` posts the count and top rules. At zero, `log_clean` records the all-clear with the stored report URI.
    8. The `errors` block alerts Slack when the scan itself fails - clone error, image pull failure, parser crash - because a broken scanner looks exactly like a clean repository.

    ## What you get

    - A SAST verdict on every push instead of a weekly report someone forgets to read.
    - A labeled GitHub issue carrying the finding count, top rules, scan time, and a link to the raw report.
    - A Slack escalation so the security channel sees findings while the commit is still fresh.
    - `verdict`, `findings_count`, `top_rules`, and `report_uri` as flow outputs, ready for status checks and dashboards.
    - A scan trail: every execution, clean or dirty, is a dated record in Kestra history with the report archived.
    - A disabled daily schedule as defense in depth against skipped webhooks.

    ## Who it's for

    - Development teams that want Semgrep gating in CI without maintaining CI YAML for it.
    - Security engineers who need every push checked against the security-audit pack with findings tracked as issues.
    - Platform teams already running Kestra who want one declarative file for scan, gate, and escalation.

    ## Why orchestrate this with Kestra

    Semgrep is an excellent scanner, but a scanner nobody configures catches nothing. Kestra supplies the loop around it: an event trigger for every push, a hermetic Docker runner so the tool version lives in the flow, a branch that separates escalation from the all-clear, retries and execution history for every run, and alert routing into GitHub and Slack from one file. A CI job running Semgrep gives developers none of that - it only protects the repositories whose pipelines someone remembered to update, and skipped runs vanish without a trace.

    ## Prerequisites

    - A worker with Docker access for the Semgrep container and Python 3 on the host for the report parser, or switch `parse_report` to a Docker task runner.
    - A GitHub repository that allows cloning and issue creation with the provided token (classic PAT scope `repo`, or fine-grained **Contents: read** plus **Issues: write**).
    - A Slack incoming webhook for the findings escalation and the failure alert.
    - A CI hook that POSTs push events to the webhook URL.

    ### Secrets

    - `GITHUB_TOKEN`: personal access token used both to clone the repository and to open the issue on findings.
    - `SAST_WEBHOOK_KEY`: key segment guarding the webhook URL - anyone with it can trigger a scan, so treat it as a secret.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for escalation and failure alerts.

    ## Quick start

    1. Add the three secrets to your Kestra namespace.
    2. Set `repository` to the `owner/repo` you want gated and `ref` if it is not `main`.
    3. Point your CI push hook at `/api/v1/{tenant}/executions/webhook/{namespace}/semgrep-sast-pr-gate/{SAST_WEBHOOK_KEY}`, or trigger the webhook manually.
    4. Confirm a clean run, then push a commit containing a deliberate weakness (for example an `os.system` call on user input) and confirm the issue, the Slack alert, and the `fail` verdict.
    5. Once the webhook is trusted, remove `disabled: true` from `daily_net` so skipped pushes still get scanned.

    ## How to extend

    - Derive the repository and ref from the push payload instead of inputs with `{{ fromJson(trigger.body).repository.full_name }}` for multi-repo setups.
    - Swap `--config p/security-audit` for a committed `.semgrep.yml` or a different registry pack per repository.
    - Tighten the gate by failing the execution in the `then` branch with `io.kestra.plugin.core.execution.Fail` so branch protection blocks the merge.
    - Fan out across many repositories with `io.kestra.plugin.core.flow.ForEach` over a repository list.
    - Archive the report to S3 with `io.kestra.plugin.aws.s3.Upload` after the parse step for long-term retention.

    ## Links

    - [Semgrep documentation](https://semgrep.dev/docs)
    - [Semgrep registry - security-audit pack](https://semgrep.dev/r/p.security-audit)
    - [Git plugin documentation](https://kestra.io/plugins/plugin-git)
    - [GitHub plugin documentation](https://kestra.io/plugins/plugin-github)
    - [Slack plugin documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - CI/CD & Deployment
  ee: false
  demo: false
