id: pegelonline-rhine-low-water-barge-surcharge-alert
namespace: company.team

description: |
  Track the Rhine reference gauges that barge carriers price low-water surcharges on (Kaub,
  Duisburg-Ruhrort, Maxau). Every two hours the flow reads the gauge metadata and current level
  from the German waterways agency's PEGELONLINE API, pulls seven days of 15-minute levels per
  gauge, maps a smoothed reference level to your surcharge bands, estimates the fairway depth and
  barge load factor, and posts to Slack with the monthly cost impact only when a band changes.

inputs:
  - id: gauges
    type: JSON
    displayName: Reference gauges and surcharge bands
    description: >-
      One object per freight lane: `station` (PEGELONLINE shortname such as `KAUB`, case-insensitive),
      `lane`, `monthly_tonnes`, `base_rate_eur_per_t` and `bands`, a list of `{below_cm, surcharge_pct}`:
      the surcharge applies while the reference level is below `below_cm`. The default bands are EXAMPLE
      bands in the shape carriers publish; every carrier publishes its own table, so replace them with the
      ones in your contract. Tonnes and rates are sample figures, gauge levels come from the live API.
    defaults: |
      [
        {"station": "KAUB", "lane": "Rotterdam - Mainz / Frankfurt (Middle Rhine)", "monthly_tonnes": 12000, "base_rate_eur_per_t": 14.5,
         "bands": [{"below_cm": 150, "surcharge_pct": 10}, {"below_cm": 130, "surcharge_pct": 20}, {"below_cm": 110, "surcharge_pct": 35},
                   {"below_cm": 90, "surcharge_pct": 50}, {"below_cm": 78, "surcharge_pct": 75}, {"below_cm": 60, "surcharge_pct": 100}]},
        {"station": "DUISBURG-RUHRORT", "lane": "Rotterdam - Duisburg (Lower Rhine)", "monthly_tonnes": 20000, "base_rate_eur_per_t": 6.0,
         "bands": [{"below_cm": 270, "surcharge_pct": 10}, {"below_cm": 240, "surcharge_pct": 20}, {"below_cm": 210, "surcharge_pct": 35},
                   {"below_cm": 180, "surcharge_pct": 50}, {"below_cm": 150, "surcharge_pct": 75}, {"below_cm": 120, "surcharge_pct": 100}]},
        {"station": "MAXAU", "lane": "Rotterdam - Karlsruhe / Basel (Upper Rhine)", "monthly_tonnes": 5000, "base_rate_eur_per_t": 21.0,
         "bands": [{"below_cm": 450, "surcharge_pct": 10}, {"below_cm": 420, "surcharge_pct": 20}, {"below_cm": 390, "surcharge_pct": 35},
                   {"below_cm": 360, "surcharge_pct": 50}, {"below_cm": 330, "surcharge_pct": 75}, {"below_cm": 290, "surcharge_pct": 100}]}
      ]

  - id: reference_hours
    type: INT
    displayName: Reference level window (hours)
    description: The band is chosen on the mean level of the last N hours, not the latest 15-minute value, so a single noisy reading at a band edge does not flip the surcharge.
    defaults: 6

  - id: stale_hours
    type: INT
    displayName: Stale after (hours)
    description: A gauge whose newest reading is older than this keeps its previous band and is reported as stale instead of being re-priced.
    defaults: 6

  - id: barge
    type: JSON
    displayName: Barge draft profile
    description: Used for the load-factor estimate. `design_draft_cm` is the fully laden draft, `light_draft_cm` the empty draft, `underkeel_cm` the clearance you keep. The defaults approximate a 110 m Rhine motor tanker.
    defaults: '{"design_draft_cm": 300, "light_draft_cm": 70, "underkeel_cm": 20}'

  - id: state_key
    type: STRING
    displayName: KV state key
    description: KV key holding the last band per gauge. Use one key per gauge list.
    defaults: rhine_low_water_bands

triggers:
  - id: every_2_hours
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "5 */2 * * *"
    description: Low water moves in centimetres per day, so every two hours is plenty; minute 5 lets the quarter-hour value arrive first.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: fetch_stations
    type: io.kestra.plugin.core.http.Download
    description: |
      One request for all gauges: `ids` takes shortnames, and `includeCharacteristicValues=true` returns the
      published reference levels of the water level (`W`) series, including GlW (equivalent low-water level) and
      TuGLW (guaranteed fairway depth at GlW). Unknown shortnames are silently left out of the response.
    uri: https://pegelonline.wsv.de/webservices/rest-api/v2/stations.json
    params:
      ids: "{% for g in inputs.gauges %}{{ g.station | trim }}{% if not loop.last %},{% endif %}{% endfor %}"
      timeseries: W
      includeTimeseries: "true"
      includeCurrentMeasurement: "true"
      includeCharacteristicValues: "true"
    headers:
      User-Agent: kestra-pegelonline-rhine-low-water-barge-surcharge-alert/1.0 (https://kestra.io)
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempts: 4

  - id: match_gauges
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Joins the input lanes to the stations PEGELONLINE returned (by upper-cased shortname, so `Köln` matches `KÖLN`), keeps the characteristic values needed later, and lists unknown stations.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      stations.json: "{{ outputs.fetch_stations.uri }}"
      gauges.json: "{{ inputs.gauges | toJson }}"
    outputFiles:
      - gauges_parquet
    sql: |
      CREATE TABLE cfg AS
      SELECT row_number() OVER () AS ord, upper(trim(g->>'$.station')) AS station, coalesce(g->>'$.lane', g->>'$.station') AS lane,
             coalesce(TRY_CAST(g->>'$.monthly_tonnes' AS DOUBLE), 0) AS monthly_tonnes,
             coalesce(TRY_CAST(g->>'$.base_rate_eur_per_t' AS DOUBLE), 0) AS base_rate,
             CAST(coalesce(g->'$.bands', '[]') AS VARCHAR) AS bands
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS g FROM read_text('gauges.json'));

      CREATE TABLE st AS
      SELECT s->>'$.uuid' AS uuid, upper(s->>'$.shortname') AS station, s->>'$.longname' AS longname,
             s->>'$.water.longname' AS water, TRY_CAST(s->>'$.km' AS DOUBLE) AS river_km, s->>'$.remark' AS remark,
             s->'$.timeseries[0]' AS ts
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('stations.json'));

      CREATE TABLE cv AS
      SELECT uuid, max(TRY_CAST(v->>'$.value' AS DOUBLE)) FILTER (WHERE v->>'$.shortname' = 'GlW') AS glw_cm,
             max(TRY_CAST(v->>'$.value' AS DOUBLE)) FILTER (WHERE v->>'$.shortname' = 'TuGLW') AS fairway_at_glw_cm,
             max(TRY_CAST(v->>'$.value' AS DOUBLE)) FILTER (WHERE v->>'$.shortname' = 'NNW') AS record_low_cm
      FROM (SELECT uuid, unnest(from_json(coalesce(json_extract(ts, '$.characteristicValues'), '[]'), '["JSON"]')) AS v FROM st)
      GROUP BY uuid;

      CREATE TABLE matched AS
      SELECT c.*, st.uuid, st.longname, st.water, st.river_km, st.remark, cv.glw_cm, cv.fairway_at_glw_cm, cv.record_low_cm,
             st.ts->>'$.currentMeasurement.stateMnwMhw' AS agency_state
      FROM cfg c LEFT JOIN st USING (station) LEFT JOIN cv USING (uuid);

      COPY (SELECT * FROM matched WHERE uuid IS NOT NULL ORDER BY ord) TO '{{ outputFiles.gauges_parquet }}' (FORMAT PARQUET);

      SELECT count(*) FILTER (WHERE uuid IS NOT NULL) AS known_count,
             count(*) FILTER (WHERE uuid IS NULL) AS unknown_count,
             coalesce(string_agg(station, ', ' ORDER BY ord) FILTER (WHERE uuid IS NULL), '') AS unknown_stations,
             coalesce(CAST(to_json(list(json_object('uuid', uuid, 'station', station, 'reference_hours', {{ inputs.reference_hours }})
               ORDER BY ord) FILTER (WHERE uuid IS NOT NULL)) AS VARCHAR), '[]') AS loop_items
      FROM matched;

  - id: require_known
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ outputs.match_gauges.outputs[0].row.known_count == 0 }}"
    errorMessage: "None of the stations is known to PEGELONLINE: {{ outputs.match_gauges.outputs[0].row.unknown_stations }}"

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: Last band per gauge. Missing on the first run (BASELINE), when every gauge already in a surcharge band alerts once.

  - id: per_gauge
    type: io.kestra.plugin.core.flow.Loop
    description: Seven days of 15-minute water levels per gauge (PEGELONLINE has no multi-station history call), summarised in DuckDB. Values the summary needs travel in the loop item.
    values: "{{ outputs.match_gauges.outputs[0].row.loop_items }}"
    concurrencyLimit: 3
    tasks:
      - id: fetch_levels
        type: io.kestra.plugin.core.http.Download
        uri: "https://pegelonline.wsv.de/webservices/rest-api/v2/stations/{{ fromJson(item.value).uuid }}/W/measurements.json"
        params:
          start: P7D
        headers:
          User-Agent: kestra-pegelonline-rhine-low-water-barge-surcharge-alert/1.0 (https://kestra.io)
        retry:
          type: exponential
          interval: PT30S
          maxInterval: PT5M
          maxAttempts: 4

      - id: summarise_levels
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: Levels can be negative (below gauge zero, e.g. Emmerich in a drought), so only non-numeric values are dropped. The trend is the least-squares slope of the last 72 hours in cm/day.
        url: "jdbc:duckdb:"
        fetchType: FETCH_ONE
        inputFiles:
          levels.json: "{{ outputs.fetch_levels.uri }}"
        sql: |
          SET TimeZone = 'UTC';
          CREATE TABLE m AS
          SELECT CAST(x->>'$.timestamp' AS TIMESTAMPTZ) AS ts, TRY_CAST(x->>'$.value' AS DOUBLE) AS cm
          FROM (SELECT unnest(from_json(content, '["JSON"]')) AS x FROM read_text('levels.json'))
          WHERE TRY_CAST(x->>'$.value' AS DOUBLE) IS NOT NULL;
          WITH t AS (SELECT max(ts) AS latest FROM m)
          SELECT '{{ fromJson(item.value).uuid }}' AS uuid, count(*) AS readings,
                 strftime(max(ts), '%Y-%m-%d %H:%M UTC') AS latest_at,
                 round(date_diff('minute', max(ts), now()) / 60.0, 1) AS age_h,
                 arg_max(cm, ts) AS latest_cm,
                 round(avg(cm) FILTER (WHERE ts > latest - to_hours({{ fromJson(item.value).reference_hours }})), 1) AS reference_cm,
                 min(cm) AS min_7d_cm, max(cm) AS max_7d_cm,
                 round(regr_slope(cm, epoch(ts)) FILTER (WHERE ts > latest - to_hours(72)) * 86400, 1) AS trend_cm_per_day,
                 arg_max(cm, ts) - arg_min(cm, abs(epoch(ts) - epoch(latest - to_hours(24)))) AS change_24h_cm
          FROM m, t;
    outputs:
      - id: stats
        type: STRING
        value: "{{ outputs.summarise_levels.outputs[0].row | toJson }}"

  - id: evaluate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Picks the band for the reference level (the highest surcharge whose `below_cm` the level is under, so band
      order in the input does not matter), the threshold the level must rise back above for relief, the next worse
      band and the days until it at the current trend. Fairway depth = TuGLW + (level - GlW), the agency's guaranteed
      depth shifted by how far the gauge is from GlW; load factor is the share of the barge's payload draft that fits.
      Stale gauges keep their previous band.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      gauges.parquet: "{{ outputs.match_gauges.outputFiles.gauges_parquet }}"
      stats.json: "[{% for it in outputs.per_gauge.outputs %}{{ it.outputs.stats }}{% if not loop.last %},{% endif %}{% endfor %}]"
      state.json: "{{ outputs.previous_state.value ?? '[]' }}"
    outputFiles:
      - bands_csv
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE g AS SELECT * FROM read_parquet('gauges.parquet');
      CREATE TABLE s AS SELECT * FROM read_json('stats.json', format = 'array');
      CREATE TABLE prev AS
      SELECT p->>'$.station' AS station, TRY_CAST(p->>'$.surcharge_pct' AS DOUBLE) AS prev_pct, p->>'$.since' AS prev_since
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS p FROM read_text('state.json'));

      CREATE TABLE b AS
      SELECT station, TRY_CAST(x->>'$.below_cm' AS DOUBLE) AS below_cm, TRY_CAST(x->>'$.surcharge_pct' AS DOUBLE) AS pct
      FROM (SELECT station, unnest(from_json(bands, '["JSON"]')) AS x FROM g);

      CREATE TABLE e AS
      SELECT g.ord, g.station, g.lane, g.longname, g.water, g.river_km, g.remark, g.agency_state, g.record_low_cm,
             g.monthly_tonnes, g.base_rate, s.readings, s.latest_at, s.age_h, s.latest_cm, s.reference_cm, s.min_7d_cm,
             s.trend_cm_per_day, s.change_24h_cm, p.prev_pct, p.prev_since,
             s.age_h IS NULL OR s.age_h > {{ inputs.stale_hours }} AS stale,
             coalesce((SELECT max(pct) FROM b WHERE b.station = g.station AND s.reference_cm < b.below_cm), 0) AS live_pct,
             (SELECT min(below_cm) FROM b WHERE b.station = g.station AND s.reference_cm < b.below_cm) AS relief_above_cm,
             (SELECT max(below_cm) FROM b WHERE b.station = g.station AND s.reference_cm >= b.below_cm) AS next_band_below_cm,
             (SELECT arg_max(pct, below_cm) FROM b WHERE b.station = g.station AND s.reference_cm >= b.below_cm) AS next_band_pct,
             round(g.fairway_at_glw_cm + s.reference_cm - g.glw_cm) AS fairway_depth_cm
      FROM g LEFT JOIN s USING (uuid) LEFT JOIN prev p ON p.station = g.station;

      CREATE TABLE r AS
      SELECT *,
             CASE WHEN stale THEN coalesce(prev_pct, 0) ELSE live_pct END AS surcharge_pct,
             NOT stale AND live_pct <> coalesce(prev_pct, 0) AS changed,
             CASE WHEN trend_cm_per_day < 0 AND next_band_below_cm IS NOT NULL
                  THEN round((reference_cm - next_band_below_cm) / -trend_cm_per_day, 1) END AS days_to_next_band,
             round(greatest(0, least(1, (fairway_depth_cm - {{ inputs.barge.underkeel_cm }} - {{ inputs.barge.light_draft_cm }})
                   / ({{ inputs.barge.design_draft_cm }} - {{ inputs.barge.light_draft_cm }}))) * 100) AS load_factor_pct
      FROM e;

      COPY (
        SELECT station, lane, water, river_km, latest_at AS latest_utc, age_h, stale, latest_cm, reference_cm, change_24h_cm,
               trend_cm_per_day, min_7d_cm, record_low_cm, agency_state, surcharge_pct, prev_pct AS previous_pct, changed,
               relief_above_cm, next_band_below_cm, next_band_pct, days_to_next_band, fairway_depth_cm, load_factor_pct,
               monthly_tonnes, base_rate AS base_rate_eur_per_t,
               round(monthly_tonnes * base_rate * surcharge_pct / 100) AS surcharge_eur_per_month, remark
        FROM r ORDER BY ord
      ) TO '{{ outputFiles.bands_csv }}' (HEADER, DELIMITER ',');

      SELECT count(*) AS gauges,
             (SELECT count(*) FROM prev) = 0 AS is_baseline,
             count(*) FILTER (WHERE changed) AS changes,
             count(*) FILTER (WHERE stale) AS stale,
             CAST(round(sum(monthly_tonnes * base_rate * surcharge_pct / 100)) AS BIGINT) AS total_surcharge_eur_per_month,
             string_agg(station || ' ' || coalesce(CAST(reference_cm AS VARCHAR), 'n/a') || ' cm, ' || CAST(surcharge_pct AS INT) || ' pct' || CASE WHEN stale THEN ' (stale, band held)' ELSE '' END, '; ' ORDER BY ord) AS status_line,
             coalesce(CAST(to_json(list(json_object(
               'station', station, 'lane', lane, 'reference_cm', reference_cm, 'latest_cm', latest_cm, 'latest_at', latest_at,
               'change_24h', change_24h_cm, 'trend', trend_cm_per_day, 'pct', CAST(surcharge_pct AS INT), 'prev_pct', CAST(coalesce(prev_pct, 0) AS INT),
               'relief_above', CAST(relief_above_cm AS INT), 'next_below', CAST(next_band_below_cm AS INT), 'next_pct', CAST(next_band_pct AS INT), 'days_to_next', days_to_next_band,
               'depth', CAST(fairway_depth_cm AS INT), 'load', CAST(load_factor_pct AS INT), 'record_low', CAST(record_low_cm AS INT),
               'eur_month', CAST(round(monthly_tonnes * base_rate * surcharge_pct / 100) AS BIGINT),
               'delta_eur_month', CAST(round(monthly_tonnes * base_rate * (surcharge_pct - coalesce(prev_pct, 0)) / 100) AS BIGINT)
             ) ORDER BY ord) FILTER (WHERE changed)) AS VARCHAR), '[]') AS change_list,
             CAST(to_json(list(json_object('station', station, 'surcharge_pct', CAST(surcharge_pct AS INT),
               'since', CASE WHEN changed OR prev_since IS NULL THEN strftime(now(), '%Y-%m-%dT%H:%M:%SZ') ELSE prev_since END) ORDER BY ord)) AS VARCHAR) AS new_state
      FROM r;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.evaluate.outputs[0].row.new_state }}"

  - id: on_band_change
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.outputs[0].row.changes > 0 }}"
    then:
      - id: compose
        type: io.kestra.plugin.core.debug.Return
        format: |-
          *Rhine low-water surcharge update*{{ outputs.evaluate.outputs[0].row.is_baseline ? ' (baseline)' : '' }}: {{ outputs.evaluate.outputs[0].row.changes }} band change(s), example bands, check your carrier's table.
          {% for c in fromJson(outputs.evaluate.outputs[0].row.change_list) %}{{ c.pct > c.prev_pct ? ':warning:' : ':white_check_mark:' }} *{{ c.station }}* ({{ c.lane }}): {{ c.reference_cm }} cm ({{ c.change_24h >= 0 ? '+' : '' }}{{ c.change_24h }} cm/24 h, trend {{ c.trend }} cm/day), surcharge {{ c.prev_pct }}% -> *{{ c.pct }}%*, {{ c.delta_eur_month >= 0 ? '+' : '' }}{{ c.delta_eur_month }} EUR/month (now {{ c.eur_month }} EUR/month).{% if c.depth is not null %} Fairway about {{ c.depth }} cm, load factor about {{ c.load }}%.{% endif %}{% if c.relief_above is not null %} Relief above {{ c.relief_above }} cm.{% endif %}{% if c.days_to_next is not null %} Next band ({{ c.next_pct }}% below {{ c.next_below }} cm) in about {{ c.days_to_next }} days at this trend.{% endif %}{% if c.record_low is not null and c.reference_cm < c.record_low %} Below the published record low of {{ c.record_low }} cm.{% endif %}
          {% endfor %}Total surcharge on these lanes: {{ outputs.evaluate.outputs[0].row.total_surcharge_eur_per_month }} EUR/month.
      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the run green when `SLACK_WEBHOOK_URL` is not set; the message is still logged and the CSV written.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: "{{ outputs.compose.value }}"
      - id: log_change
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.compose.value }}"
    else:
      - id: log_no_change
        type: io.kestra.plugin.core.log.Log
        message: "No band change: {{ outputs.evaluate.outputs[0].row.status_line }}."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.evaluate.outputs[0].row.gauges }} gauges, {{ outputs.evaluate.outputs[0].row.changes }} band changes,
      {{ outputs.evaluate.outputs[0].row.stale }} stale{{ outputs.evaluate.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}.
      {{ outputs.evaluate.outputs[0].row.status_line }}. Surcharge {{ outputs.evaluate.outputs[0].row.total_surcharge_eur_per_month }} EUR/month.
      {% if outputs.match_gauges.outputs[0].row.unknown_count > 0 %}Unknown stations skipped: {{ outputs.match_gauges.outputs[0].row.unknown_stations }}.{% endif %}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.evaluate.outputs[0].row | toJson }}"
  - id: bands_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.bands_csv }}"

extend:
  title: Rhine Low-Water Barge Surcharge Alert from PEGELONLINE Gauge Levels
  metaTitle: Rhine Low-Water Barge Surcharge Alert with PEGELONLINE and DuckDB | Kestra
  shortDescription: Every two hours, read the Kaub, Duisburg-Ruhrort and Maxau gauges from PEGELONLINE, map a smoothed level to your carrier's low-water surcharge bands, estimate fairway depth and barge load factor, and post the monthly cost impact to Slack when a band changes.
  metaDescription: Map live Rhine gauge levels from PEGELONLINE to barge low-water surcharge bands, with load factor, cost impact, KV state and Slack alerts on band changes.
  description: |
    When the Rhine runs low, barges sail part-loaded and carriers add a low-water surcharge priced in bands of the level at a reference gauge (Kaub, Duisburg-Ruhrort, Maxau). This flow reads those gauges from PEGELONLINE, the open API of the German waterways administration, maps a smoothed level to your surcharge bands and tells Slack when a band changes, with the cost per month per lane. The default bands are EXAMPLE bands; every carrier publishes its own table, so replace them with your contract's. Default tonnes and freight rates are sample data; the gauge levels come from the live API.

    ## How it works

    1. A `Schedule` trigger runs every two hours with `concurrency.limit: 1`.
    2. `fetch_stations` makes one request for all gauges with `includeCharacteristicValues=true`, which adds each gauge's GlW (equivalent low-water level), TuGLW (guaranteed fairway depth at GlW) and NNW (record low).
    3. `match_gauges` (DuckDB) joins your lanes to the stations by upper-cased shortname and lists unknown names, which PEGELONLINE silently drops. `require_known` fails the run if none match.
    4. `per_gauge` (Loop) downloads seven days of 15-minute levels per gauge and computes in DuckDB the mean of the last `reference_hours` (one noisy reading at a band edge does not flip the surcharge), the 24-hour change and a 72-hour trend. Negative levels are valid and kept.
    5. `evaluate` (DuckDB) picks each gauge's band (input order does not matter), the level needed for relief and the days to the next worse band at the current trend. Fairway depth is TuGLW + (level - GlW); load factor is the share of payload draft that fits. A gauge silent for `stale_hours` keeps its band.
    6. `save_state` (KV Set) stores the band per gauge. `on_band_change` (If) posts one Slack message with every change, the EUR per month delta, depth and load factor. On the BASELINE run every gauge already in a band alerts once.

    ## What you get

    - Slack alerts only when a surcharge band changes, in either direction, with the money impact per lane.
    - A per-gauge CSV per run (level, trend, band, relief level, next band, fairway depth, load factor, EUR per month) as a flow output.
    - Unknown station names reported instead of silently dropped; stale gauges held rather than re-priced.

    ## Who it's for

    - Chemical, steel, agri and energy shippers moving bulk or liquid cargo by Rhine barge.
    - Logistics procurement and freight controllers who accrue low-water surcharges.

    ## Why orchestrate this with Kestra

    - Bands are an input, so each carrier contract is a flow copy, not a code change.
    - KV state turns a two-hourly poll into change-only alerts without a database; retries cover API hiccups.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins.
    - Outbound HTTPS to `pegelonline.wsv.de`. No API key is needed.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for band-change alerts (optional; without it the Slack task warns and the run continues).

    ## Quick start

    1. Import the flow and click **Execute**. The first run is the baseline and alerts for every gauge already in a band.
    2. Execute again: `No band change` unless a level crossed a band edge.
    3. Replace `gauges` with your carrier's bands, tonnes and rates, add `SLACK_WEBHOOK_URL` and enable the schedule.

    ## How to extend

    - Add the ELWIS water-level forecasts for Kaub to warn before a band is reached.
    - Write the CSV to your warehouse to accrue surcharges per shipment, or trigger a rail or truck quote when the load factor falls below a threshold.

    ## Links

    - [PEGELONLINE REST API](https://pegelonline.wsv.de/webservice/dokuRestapi)
    - [DuckDB Queries task](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Slack incoming webhook task](https://kestra.io/plugins/plugin-slack/slack-notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
