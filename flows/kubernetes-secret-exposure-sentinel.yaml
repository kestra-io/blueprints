id: kubernetes-secret-exposure-sentinel
namespace: company.team
description: |
  List Deployments in a namespace, flag any whose pod template injects a
  Secret through a plain environment variable (secretKeyRef) rather than a
  mounted volume, alert Slack on breach, and conditionally annotate the
  flagged Deployments for review. auto_remediate and dry_run are two
  independent gates; no container spec, env var, or Secret is ever changed.

triggers:
  - id: periodic_exposure_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every hour. Shipped disabled; enable it once k8s_namespace points at a real cluster and a manual run has been verified. Always fires in safe mode (auto_remediate false, dry_run true) regardless of this flow's own defaults.
    cron: "0 * * * *"
    disabled: true
    inputs:
      auto_remediate: "false"
      dry_run: "true"

inputs:
  - id: k8s_namespace
    type: STRING
    displayName: "Kubernetes Namespace"
    defaults: "default"
    description: Namespace whose Deployments are audited for Secret-as-env-var exposure.

  - id: max_env_secret_refs
    type: INT
    displayName: "Max Allowed Exposed Deployments"
    defaults: 0
    description: Breach when the count of Deployments injecting a Secret via a plain env var exceeds this number. Default 0 means any such Deployment at all is a breach.

  - id: auto_remediate
    type: SELECT
    displayName: "Auto Remediate"
    defaults: "false"
    values:
      - "false"
      - "true"
    description: If "true" and exposed Deployments are found, annotate each one with a review flag via kubectl Patch (still gated by dry_run below). If "false", the risk is only reported.

  - id: dry_run
    type: SELECT
    displayName: "Dry Run"
    defaults: "true"
    values:
      - "true"
      - "false"
    description: If "true", remediation is only logged, no annotation is applied. Must be explicitly "false", together with auto_remediate "true", for the flag to actually be written.

tasks:
  - id: list_deployments
    type: io.kestra.plugin.kubernetes.kubectl.Get
    description: Fetches every Deployment in k8s_namespace with fetchType STORE, which returns a uri pointing to the raw kubectl JSON (a DeploymentList, carrying the full spec.template.spec for every Deployment) - verified from the plugin's own output schema. FETCH/FETCH_ONE mode only return metadataItems/statusItems, not the pod template spec this audit needs.
    connection:
      masterUrl: "{{ secret('K8S_MASTER_URL') }}"
      oauthToken: "{{ secret('K8S_TOKEN') }}"
    namespace: "{{ inputs.k8s_namespace }}"
    resourceType: deployments
    fetchType: STORE

  - id: evaluate_secret_exposure
    type: io.kestra.plugin.scripts.python.Script
    description: Reads the raw DeploymentList and flags any Deployment whose pod template has a container with env[].valueFrom.secretKeyRef set - a Secret injected as a plain environment variable, which is more easily leaked through kubectl describe, process dumps, or verbose logging than a Secret mounted as a volume. There is no structured policy-evaluation task in this plugin, so the check runs here against the raw spec the Get task actually returns.
    inputFiles:
      deployments.json: "{{ outputs.list_deployments.uri }}"
    script: |
      import json
      from kestra import Kestra

      with open("deployments.json") as f:
          data = json.load(f)

      flagged = set()
      for dep in data.get("items", []):
          name = dep.get("metadata", {}).get("name")
          containers = dep.get("spec", {}).get("template", {}).get("spec", {}).get("containers", []) or []
          for c in containers:
              for env in (c.get("env") or []):
                  value_from = env.get("valueFrom") or {}
                  if value_from.get("secretKeyRef"):
                      flagged.add(name)
                      break

      flagged_deployments = sorted(flagged)

      Kestra.outputs({
          "flagged_count": len(flagged_deployments),
          "flagged_deployments": flagged_deployments,
      })

  - id: evaluate_exposure_gate
    type: io.kestra.plugin.core.flow.If
    description: Breach when at least one Deployment injects a Secret through a plain env var.
    condition: "{{ outputs.evaluate_secret_exposure.vars.flagged_count > inputs.max_env_secret_refs }}"
    then:
      - id: route_remediation
        type: io.kestra.plugin.core.flow.Switch
        description: auto_remediate only decides whether remediation is considered at all; dry_run, checked separately below, decides whether the annotation is actually written.
        value: "{{ inputs.auto_remediate }}"
        cases:
          "true":
            - id: check_dry_run
              type: io.kestra.plugin.core.flow.If
              condition: "{{ inputs.dry_run == \"false\" }}"
              then:
                - id: flag_exposed_deployments
                  type: io.kestra.plugin.core.flow.Loop
                  description: Annotate each flagged Deployment one at a time, so one failed patch never blocks the rest of the batch.
                  values: "{{ outputs.evaluate_secret_exposure.vars.flagged_deployments }}"
                  concurrencyLimit: 4
                  tasks:
                    - id: annotate_exposed_deployment
                      type: io.kestra.plugin.kubernetes.kubectl.Patch
                      description: A JSON_MERGE patch adding only an annotation, matching this plugin's own documented Secret-rotation example. It never touches spec.template, env, or any Secret - it only marks the Deployment for human review.
                      connection:
                        masterUrl: "{{ secret('K8S_MASTER_URL') }}"
                        oauthToken: "{{ secret('K8S_TOKEN') }}"
                      namespace: "{{ inputs.k8s_namespace }}"
                      resourceType: deployments
                      resourceName: "{{ item.value }}"
                      patchStrategy: JSON_MERGE
                      patch: |
                        {
                          "metadata": {
                            "annotations": {
                              "security.kestra.io/secret-env-exposure": "flagged"
                            }
                          }
                        }
                - id: log_remediation_applied
                  type: io.kestra.plugin.core.log.Log
                  message: "Annotated {{ outputs.evaluate_secret_exposure.vars.flagged_count }} Deployment(s) in {{ inputs.k8s_namespace }} with security.kestra.io/secret-env-exposure=flagged."
              else:
                - id: log_dry_run_remediation
                  type: io.kestra.plugin.core.log.Log
                  message: "DRY RUN: would annotate {{ outputs.evaluate_secret_exposure.vars.flagged_count }} Deployment(s) in {{ inputs.k8s_namespace }} with security.kestra.io/secret-env-exposure=flagged (dry_run is true). No change made."
          "false":
            - id: log_remediation_disabled
              type: io.kestra.plugin.core.log.Log
              message: "auto_remediate is false: {{ outputs.evaluate_secret_exposure.vars.flagged_count }} Deployment(s) in {{ inputs.k8s_namespace }} inject a Secret via a plain env var, but no annotation was attempted."
      - id: alert_secret_exposure_risk
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Always alert on any risk, independent of whether it was remediated.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Kubernetes secret exposure sentinel: {{ outputs.evaluate_secret_exposure.vars.flagged_count }} Deployment(s) in namespace {{ inputs.k8s_namespace }} inject a Secret via a plain environment variable instead of a mounted volume. auto_remediate: {{ inputs.auto_remediate }}. dry_run: {{ inputs.dry_run }}. Remediated: {{ inputs.auto_remediate == \"true\" and inputs.dry_run == \"false\" }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_exposure_healthy
        type: io.kestra.plugin.core.log.Log
        message: "{{ inputs.k8s_namespace }} is healthy: 0 Deployment(s) inject a Secret via a plain environment variable."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status line for every run, independent of which branch fired, so the execution history always shows the headline numbers.
    message: "Secret exposure audit complete for {{ inputs.k8s_namespace }}. flagged_count={{ outputs.evaluate_secret_exposure.vars.flagged_count }}. threshold={{ inputs.max_env_secret_refs }}. auto_remediate={{ inputs.auto_remediate }}. dry_run={{ inputs.dry_run }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the flow itself fails outside the handled branches, for example an unreachable API server or a token without rights to list Deployments.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Kubernetes secret exposure sentinel FAILED in execution {{ execution.id }} for namespace {{ inputs.k8s_namespace }}. The exposure audit did not complete; investigate before trusting the last known exposure status."
      }

extend:
  title: "Kubernetes Secret Exposure Sentinel"
  shortDescription: Audit Deployments for Secrets injected as plain environment variables instead of mounted volumes, alert Slack on breach, and optionally annotate the offending Deployments for review.
  metaTitle: Kubernetes Secret Exposure Sentinel with Kestra
  metaDescription: "Audit Kubernetes Deployments for Secrets injected as env vars instead of volumes, alert on breach, and flag them for review."
  description: |
    A Secret mounted as a volume lives only as a file inside the container's filesystem.
    The same Secret injected through `env[].valueFrom.secretKeyRef` lives in the
    container's process environment - visible to `kubectl describe pod`, inherited by every
    child process, and far more likely to end up in a crash dump or a verbose log line. CIS
    Kubernetes Benchmark guidance flags this pattern, but nothing in the cluster itself
    alerts you when a new Deployment ships with it. This blueprint lists every Deployment
    in a namespace, flags the ones whose pod template exposes a Secret this way, alerts
    Slack on breach, and can mark the offending Deployments with a review annotation -
    never touching the container spec, the environment variable, or the Secret itself.

    ## How it works

    1. `periodic_exposure_check` (`io.kestra.plugin.core.trigger.Schedule`) runs hourly, always forcing `auto_remediate: "false"` and `dry_run: "true"` through its own `inputs:` override regardless of this flow's defaults. Shipped disabled so you can validate a manual run first.
    2. `list_deployments` (`io.kestra.plugin.kubernetes.kubectl.Get`) fetches every Deployment in `k8s_namespace` with `fetchType: STORE`, returning a `uri` to the raw `DeploymentList` JSON - the only fetch mode that carries the full `spec.template.spec` this audit needs; `FETCH`/`FETCH_ONE` only return `metadataItems`/`statusItems`.
    3. `evaluate_secret_exposure` (`io.kestra.plugin.scripts.python.Script`) walks every container in every Deployment's pod template and flags any Deployment with at least one `env[].valueFrom.secretKeyRef`, emitting `flagged_count` and `flagged_deployments` through `Kestra.outputs`.
    4. `evaluate_exposure_gate` (`io.kestra.plugin.core.flow.If`) flags a breach whenever `flagged_count > max_env_secret_refs`.
       - `then` (breach): `route_remediation` (`io.kestra.plugin.core.flow.Switch` on `auto_remediate`) either considers remediation (`"true"`, gated again by `dry_run` through `check_dry_run`) or only logs that remediation is disabled (`"false"`). When both gates allow it, `flag_exposed_deployments` (`io.kestra.plugin.core.flow.Loop`) runs `annotate_exposed_deployment` (`io.kestra.plugin.kubernetes.kubectl.Patch`, `JSON_MERGE`) for each flagged Deployment, adding only a `security.kestra.io/secret-env-exposure: "flagged"` annotation. `alert_secret_exposure_risk` always fires to Slack regardless of which path ran.
       - `else` (compliant): `log_exposure_healthy` records a clean check.
    5. `log_audit_complete` always runs last, printing the headline numbers regardless of which branch fired.
    6. The `errors` block alerts Slack separately if the flow itself fails - an unreachable API server or insufficient RBAC must not read as "no breach".

    ## What you get

    - A concrete, named list of Deployments exposing a Secret as a plain env var, not a generic "review your manifests" reminder.
    - Remediation that only ever adds a metadata annotation; the Deployment's containers, env vars, and the Secret itself are never modified.
    - Two independent gates (`auto_remediate`, `dry_run`) between "exposure detected" and "Deployment actually flagged".
    - A final status log every run, breach or not, so the execution history doubles as a secret-hygiene trend for the namespace.

    ## Who it's for

    - Platform and security teams enforcing CIS Kubernetes Benchmark-style controls who need a continuous check, not a one-time manifest review.
    - AppSec engineers who want new Deployments caught automatically instead of relying on PR review to catch a `secretKeyRef` in an `env:` block.
    - SREs who want this as a pre-production gate before a namespace goes live.

    ## Why orchestrate this with Kestra

    `kubectl get` and `kubectl patch` are one-shot commands with no memory of the last check, no threshold logic, and no notification path. Kestra supplies the schedule, the exposure classification as a first-class branch, two independent authorization gates before anything is annotated, and an execution history that shows exactly when a Deployment started exposing a Secret this way and whether it was flagged.

    ## Prerequisites

    - A reachable Kubernetes API server and a token with rights to get Deployments and, if remediation runs, patch them, in `k8s_namespace`.
    - A Slack incoming webhook for alerts.

    Local testing:
    `docker run -d --name k8s-secret-sentinel -p 6444:6443 rancher/k3s:latest server --tls-san=localhost --disable=traefik` (or any local cluster - k3s, kind, minikube - reachable from the Kestra Worker).
    `docker network connect YOUR_KESTRA_NETWORK k8s-secret-sentinel` (only needed if the Kestra Worker runs in a separate Docker network than this container; the exact master URL and token still need to be pulled from your chosen local cluster's own kubeconfig, which varies by tool - this has not been exercised end to end in this environment).

    ### Secrets

    - `K8S_MASTER_URL`: Kubernetes API server URL, matching this plugin's own documented connection pattern (see `kubernetes-vault-rotation-restart.yaml`).
    - `K8S_TOKEN`: OAuth token used to authenticate against the cluster.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_secret_exposure_risk` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_K8S_TOKEN=$(echo -n '<your-cluster-token>' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `k8s_namespace` (STRING, default `default`): namespace audited.
    - `max_env_secret_refs` (INT, default `0`): breach threshold; `0` means any exposed Deployment at all breaches.
    - `auto_remediate` (SELECT: `"false"`, `"true"`; default `"false"`): must be `"true"` for the annotation to even be considered.
    - `dry_run` (SELECT: `"true"`, `"false"`; default `"true"`): must be explicitly `"false"`, together with `auto_remediate: "true"`, for the annotation to actually be written.

    ### Outputs

    - `outputs.list_deployments.uri`: the raw `DeploymentList` JSON for every run.
    - `outputs.evaluate_secret_exposure.vars.flagged_count` / `.flagged_deployments`: the computed exposure result for every run.

    ## Quick start

    1. Point `k8s_namespace` at a namespace with at least one Deployment whose container defines `env: [{name: ..., valueFrom: {secretKeyRef: {...}}}]`.
    2. Add the `K8S_MASTER_URL`, `K8S_TOKEN`, and `SLACK_WEBHOOK_URL` secrets.
    3. Run the flow manually with the defaults (`auto_remediate: "false"`) and confirm `alert_secret_exposure_risk` fires naming the expected Deployment(s), and that `log_remediation_disabled` logs without annotating anything.
    4. Run once with `auto_remediate: "true"` and `dry_run: "true"` and confirm `log_dry_run_remediation` describes the annotation without applying it.
    5. Run once with `auto_remediate: "true"` and `dry_run: "false"` and confirm with `kubectl get deployment <name> -o jsonpath='{.metadata.annotations}'` that the flagged Deployment now carries `security.kestra.io/secret-env-exposure: flagged`.
    6. Enable `periodic_exposure_check` once you trust the check; it always runs in the safe `auto_remediate: "false"` / `dry_run: "true"` mode regardless of what you leave the flow's own defaults set to.

    ## How to extend

    - Extend `evaluate_secret_exposure` to also check `envFrom[].secretRef` (bulk Secret-to-env injection), which this audit does not currently walk.
    - Loop over several `k8s_namespace` values with `io.kestra.plugin.core.flow.Loop` (`ForEach` is deprecated) to sweep an entire cluster in one run.
    - Route the remediation branch through a `Pause` approval task instead of (or alongside) the static `auto_remediate` input, for a human-reviewed flag on production namespaces.
    - Pair this with a separate, manually-reviewed migration that moves the flagged Secret references from `env` to a mounted volume - this blueprint deliberately only flags for review rather than attempting that structural edit automatically.

    ## Pitfalls

    - **`kubectl.Get`'s `FETCH`/`FETCH_ONE` modes do not carry the pod template spec.** Verified from the plugin's own documented output schema: those modes return only `metadataItems`/`statusItems` (and `metadataItem`/`statusItem`). This blueprint uses `fetchType: STORE` specifically because it is the only mode that returns the full raw object JSON, including `spec.template.spec.containers[].env`.
    - **`outputFiles` is not a documented property of `kubectl.Get`.** An existing in-repo flow sets it alongside `fetchType: STORE` without apparently using it; this blueprint omits it and reads the stored result through the documented `uri` output instead, to avoid relying on an unverified property.
    - **The annotation patch only ever touches `metadata.annotations`.** Verified against this plugin's own documented Secret-rotation example, which also uses `patchStrategy: JSON_MERGE`; a `JSON_MERGE` patch replaces only the keys present in the patch body, so `spec.template`, every container's `env`, and the referenced Secret are all left exactly as they were.
    - **A real local-cluster command was not exercised end to end in this environment.** The `docker run` command above starts a k3s server, but the exact `K8S_MASTER_URL`/`K8S_TOKEN` values must be pulled from that cluster's own generated kubeconfig, which was not done here; treat the command as a starting point, not a proven one-liner.
    - **`auto_remediate` and `dry_run` are independent gates, not a single boolean.** Both must be `"true"`/`"false"` respectively for the annotation `Loop` to run; setting only one leaves the other still blocking.
    - **`Switch` case keys `"true"`/`"false"` are quoted strings.** `auto_remediate` renders as the literal string `"true"` or `"false"`; unquoted `true:`/`false:` YAML map keys would parse as booleans instead and would not match.

    ## Links

    - [plugin-kubernetes documentation](https://kestra.io/plugins/plugin-kubernetes)
    - [Kubernetes kubectl Get task reference](https://kestra.io/plugins/plugin-kubernetes/kubectl/io.kestra.plugin.kubernetes.kubectl.get)
    - [CIS Kubernetes Benchmark](https://www.cisecurity.org/benchmark/kubernetes)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Policy & Compliance
  ee: false
  demo: false
