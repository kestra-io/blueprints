id: msme-45-day-payment-watch
namespace: company.team
description: |
  Watch unpaid bills from micro and small enterprise (MSME) suppliers against the
  MSMED Act payment deadline (15 days, or the agreed period up to 45 days). Under
  section 37(2)(g) of the Income-tax Act, 2025 (section 43B(h) of the 1961 Act), an expense still unpaid past that deadline
  at the end of the financial year is not deductible until it is paid, and the
  supplier is owed compound interest at three times the RBI bank rate.

inputs:
  - id: payables
    type: FILE
    required: false
    description: CSV of purchase bills with the columns bill_no, vendor_id, bill_date, acceptance_date, amount, paid_amount and agreed_credit_days (leave agreed_credit_days empty when there is no written agreement). Leave the input empty to use the built-in sample.
  - id: vendor_master
    type: FILE
    required: false
    description: CSV of suppliers with the columns vendor_id, vendor_name, udyam_number, enterprise_type (micro, small or medium) and activity (manufacturing, services or trading). Leave empty to use the built-in sample.
  - id: as_of
    type: STRING
    required: false
    description: Date to check on, as YYYY-MM-DD. Leave empty to use today.
  - id: warn_within_days
    type: INT
    defaults: 7
    description: Flag bills whose deadline falls within this many days.
  - id: bank_rate_pct
    type: FLOAT
    defaults: 5.5
    description: RBI bank rate in percent, used for the section 16 interest estimate (three times this rate, compounded monthly). Check the current rate on rbi.org.in.
  - id: notify_slack
    type: BOOL
    defaults: false
    description: Post the findings to Slack when a bill is overdue or due soon. Requires the SLACK_WEBHOOK_URL secret.

triggers:
  - id: daily_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every morning at 09:00 IST so the payments team sees what to pay today. Shipped disabled; enable it once the flow reads your real payables and vendor master.
    cron: "0 9 * * *"
    timezone: Asia/Kolkata
    disabled: true
  - id: on_payables_export
    type: io.kestra.plugin.core.trigger.Flow
    description: Event-based. Check the bills as soon as the flow that exports your payables (from your ERP or accounting database) succeeds, using the file it outputs. Shipped disabled; set the namespace, flow id and output name of your export flow.
    disabled: true
    inputs:
      payables: "{{ trigger.outputs.payables_file }}"
    dependsOn:
      - namespace: company.team
        flowId: export-payables
        states: [SUCCESS]

tasks:
  - id: sample_payables
    type: io.kestra.plugin.core.storage.Write
    description: Twelve bills with one example of every case the check handles. Dates are relative to today so the sample always shows the same picture. Only used when payables is empty.
    extension: .csv
    content: |
      bill_no,vendor_id,bill_date,acceptance_date,amount,paid_amount,agreed_credit_days
      B-101,V01,{{ now() | dateAdd(-52, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(-50, 'DAYS') | date('yyyy-MM-dd') }},184000,0,45
      B-102,V02,{{ now() | dateAdd(-24, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(-22, 'DAYS') | date('yyyy-MM-dd') }},36500,0,
      B-103,V03,{{ now() | dateAdd(-41, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(-40, 'DAYS') | date('yyyy-MM-dd') }},92000,0,45
      B-104,V04,{{ now() | dateAdd(-70, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(-70, 'DAYS') | date('yyyy-MM-dd') }},210000,0,60
      B-105,V05,{{ now() | dateAdd(-80, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(-79, 'DAYS') | date('yyyy-MM-dd') }},48000,0,30
      B-106,V06,{{ now() | dateAdd(-90, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(-90, 'DAYS') | date('yyyy-MM-dd') }},75000,0,
      B-107,V01,{{ now() | dateAdd(-35, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(-33, 'DAYS') | date('yyyy-MM-dd') }},120000,60000,45
      B-108,V07,{{ now() | dateAdd(-60, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(-60, 'DAYS') | date('yyyy-MM-dd') }},26000,0,
      B-109,V08,{{ now() | dateAdd(-12, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(-10, 'DAYS') | date('yyyy-MM-dd') }},15800,0,
      B-110,V02,{{ now() | dateAdd(-5, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(-4, 'DAYS') | date('yyyy-MM-dd') }},9800,0,
      B-111,V03,{{ now() | dateAdd(-100, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(-98, 'DAYS') | date('yyyy-MM-dd') }},64000,64000,45
      B-112,V09,{{ now() | dateAdd(-30, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(-30, 'DAYS') | date('yyyy-MM-dd') }},51000,0,

  - id: sample_vendor_master
    type: io.kestra.plugin.core.storage.Write
    description: The suppliers the sample bills belong to. Udyam numbers are synthetic. Only used when vendor_master is empty.
    extension: .csv
    content: |
      vendor_id,vendor_name,udyam_number,enterprise_type,activity
      V01,Sahyadri Precision Castings,UDYAM-MH-26-0012345,small,manufacturing
      V02,Kaveri Packaging Works,UDYAM-KA-03-0045678,micro,manufacturing
      V03,Nilgiri IT Services,UDYAM-TN-02-0098765,small,services
      V04,Deccan Fabricators,UDYAM-TS-20-0011223,micro,manufacturing
      V05,Coromandel Logistics,UDYAM-TN-05-0076543,small,services
      V06,Ganga Electricals,,micro,manufacturing
      V07,Shree Balaji Traders,UDYAM-RJ-17-0033221,micro,trading
      V08,Malabar Food Products,UDYAM-KL-07-12345,micro,manufacturing
      V09,Thar Solar Components,UDYAM-RJ-11-0055667,medium,manufacturing

  - id: check_payables
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Join every bill to its supplier and apply the MSMED Act deadline in DuckDB, without calling any external service. The per-bill report is exported to CSV and the last query returns the summary.
    inputFiles:
      bills.csv: "{{ inputs.payables ?? outputs.sample_payables.uri }}"
      vendors.csv: "{{ inputs.vendor_master ?? outputs.sample_vendor_master.uri }}"
    outputFiles:
      - msme_payables_report.csv
    fetchType: FETCH_ONE
    sql: |
      CREATE TABLE params AS
      SELECT
        coalesce(TRY_CAST(NULLIF(trim('{{ inputs.as_of ?? '' }}'), '') AS DATE), current_date) AS as_of,
        {{ inputs.warn_within_days }} AS warn_days,
        {{ inputs.bank_rate_pct }} AS bank_rate;

      CREATE TABLE params2 AS
      SELECT
        *,
        CASE WHEN month(as_of) <= 3 THEN make_date(year(as_of), 3, 31) ELSE make_date(year(as_of) + 1, 3, 31) END AS fy_end
      FROM params;

      CREATE TABLE vendors AS
      SELECT
        trim(vendor_id) AS vendor_id,
        trim(vendor_name) AS vendor_name,
        upper(trim(coalesce(udyam_number, ''))) AS udyam_number,
        lower(trim(coalesce(enterprise_type, ''))) AS enterprise_type,
        lower(trim(coalesce(activity, ''))) AS activity
      FROM read_csv('{{ workingDir }}/vendors.csv', header = true, all_varchar = true);

      CREATE TABLE bills AS
      SELECT
        trim(b.bill_no) AS bill_no,
        trim(b.vendor_id) AS vendor_id,
        TRY_CAST(b.bill_date AS DATE) AS bill_date,
        coalesce(TRY_CAST(b.acceptance_date AS DATE), TRY_CAST(b.bill_date AS DATE)) AS acceptance_date,
        TRY_CAST(b.amount AS DECIMAL(15, 2)) AS amount,
        coalesce(TRY_CAST(NULLIF(trim(b.paid_amount), '') AS DECIMAL(15, 2)), 0) AS paid_amount,
        TRY_CAST(NULLIF(trim(b.agreed_credit_days), '') AS INTEGER) AS agreed_days
      FROM read_csv('{{ workingDir }}/bills.csv', header = true, all_varchar = true) AS b;

      CREATE TABLE checked AS
      SELECT
        b.*,
        v.vendor_name,
        v.udyam_number,
        v.enterprise_type,
        v.activity,
        b.amount - b.paid_amount AS outstanding,
        regexp_full_match(coalesce(v.udyam_number, ''), 'UDYAM-[A-Z]{2}-[0-9]{2}-[0-9]{7}') AS udyam_valid,
        v.enterprise_type IN ('micro', 'small') AND v.activity <> 'trading' AS covered,
        least(coalesce(b.agreed_days, 15), 45) AS credit_days,
        b.acceptance_date + least(coalesce(b.agreed_days, 15), 45) AS due_date,
        p.as_of,
        p.warn_days,
        p.bank_rate,
        p.fy_end
      FROM bills AS b
      LEFT JOIN vendors AS v USING (vendor_id)
      CROSS JOIN params2 AS p;

      CREATE TABLE report AS
      SELECT
        bill_no,
        vendor_id,
        coalesce(vendor_name, 'UNKNOWN VENDOR') AS vendor_name,
        udyam_number,
        enterprise_type,
        activity,
        acceptance_date,
        credit_days,
        due_date,
        amount,
        paid_amount,
        outstanding,
        CASE
          WHEN vendor_name IS NULL THEN 'CHECK_VENDOR'
          WHEN outstanding <= 0 THEN 'PAID'
          WHEN NOT covered THEN 'NOT_COVERED'
          WHEN NOT udyam_valid THEN 'CHECK_VENDOR'
          WHEN as_of > due_date THEN 'OVERDUE'
          WHEN due_date - as_of <= warn_days THEN 'DUE_SOON'
          ELSE 'ON_TRACK'
        END AS status,
        CASE WHEN covered AND outstanding > 0 AND as_of > due_date THEN as_of - due_date ELSE 0 END AS days_overdue,
        CASE
          WHEN covered AND udyam_valid AND outstanding > 0 AND as_of > due_date
            THEN round(outstanding * (pow(1 + 3 * bank_rate / 1200, (as_of - due_date) / 30.0) - 1), 2)
          ELSE 0
        END AS interest_estimate,
        covered AND udyam_valid AND outstanding > 0 AND due_date <= fy_end AS deduction_at_risk_on_fy_end,
        concat_ws(' | ',
          CASE WHEN vendor_name IS NULL THEN 'vendor not in the master' END,
          CASE WHEN vendor_name IS NOT NULL AND covered AND NOT udyam_valid THEN 'Udyam number missing or malformed, confirm the supplier''s MSME status' END,
          CASE WHEN activity = 'trading' THEN 'trader: not covered by section 15 of the MSMED Act' END,
          CASE WHEN enterprise_type = 'medium' THEN 'medium enterprise: not covered by the 45-day rule' END,
          CASE WHEN agreed_days > 45 THEN 'agreed credit of ' || agreed_days || ' days is capped at 45 by law' END,
          CASE WHEN agreed_days IS NULL AND covered THEN 'no written agreement: 15-day limit' END,
          CASE WHEN paid_amount > 0 AND outstanding > 0 THEN 'part-paid' END
        ) AS notes
      FROM checked;

      COPY (
        SELECT *
        FROM report
        ORDER BY CASE status WHEN 'OVERDUE' THEN 1 WHEN 'DUE_SOON' THEN 2 WHEN 'CHECK_VENDOR' THEN 3 WHEN 'ON_TRACK' THEN 4 WHEN 'NOT_COVERED' THEN 5 ELSE 6 END, due_date
      ) TO '{{ outputFiles["msme_payables_report.csv"] }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT as_of FROM params2)::VARCHAR AS as_of,
        (SELECT fy_end FROM params2)::VARCHAR AS fy_end,
        count(*) AS total_bills,
        count(*) FILTER (WHERE status = 'OVERDUE') AS overdue_count,
        coalesce(sum(outstanding) FILTER (WHERE status = 'OVERDUE'), 0) AS overdue_amount,
        count(*) FILTER (WHERE status = 'DUE_SOON') AS due_soon_count,
        coalesce(sum(outstanding) FILTER (WHERE status = 'DUE_SOON'), 0) AS due_soon_amount,
        count(*) FILTER (WHERE status = 'CHECK_VENDOR') AS check_vendor_count,
        round(coalesce(sum(interest_estimate), 0), 2) AS interest_estimate_total,
        coalesce(sum(outstanding) FILTER (WHERE deduction_at_risk_on_fy_end), 0) AS deduction_at_risk_amount,
        coalesce(string_agg(bill_no || ' ' || vendor_name || ' Rs ' || outstanding || ', ' || days_overdue || ' days late', ' | ' ORDER BY days_overdue DESC) FILTER (WHERE status = 'OVERDUE'), '') AS overdue_details,
        coalesce(string_agg(bill_no || ' ' || vendor_name || ' Rs ' || outstanding || ', due ' || due_date, ' | ' ORDER BY due_date) FILTER (WHERE status = 'DUE_SOON'), '') AS due_soon_details,
        coalesce(string_agg(bill_no || ' ' || vendor_name || ': ' || notes, ' | ') FILTER (WHERE status = 'CHECK_VENDOR'), '') AS check_vendor_details
      FROM report;

  - id: route_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch on the result. Overdue and soon-due bills are logged with amounts, and optionally sent to Slack; a clean run is logged so the execution history shows every daily check.
    condition: "{{ outputs.check_payables.outputs[0].row.overdue_count > 0 or outputs.check_payables.outputs[0].row.due_soon_count > 0 }}"
    then:
      - id: log_findings
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          MSME payments to act on (as of {{ outputs.check_payables.outputs[0].row.as_of }}):
          OVERDUE {{ outputs.check_payables.outputs[0].row.overdue_count }} bills, Rs {{ outputs.check_payables.outputs[0].row.overdue_amount }}: {{ outputs.check_payables.outputs[0].row.overdue_details }}
          DUE SOON {{ outputs.check_payables.outputs[0].row.due_soon_count }} bills, Rs {{ outputs.check_payables.outputs[0].row.due_soon_amount }}: {{ outputs.check_payables.outputs[0].row.due_soon_details }}
          Section 16 interest estimate so far: Rs {{ outputs.check_payables.outputs[0].row.interest_estimate_total }}
          Not deductible for the year ending {{ outputs.check_payables.outputs[0].row.fy_end }} unless paid by then: Rs {{ outputs.check_payables.outputs[0].row.deduction_at_risk_amount }}
          Suppliers to confirm: {{ outputs.check_payables.outputs[0].row.check_vendor_details }}
      - id: slack_enabled
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: notify_slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: "MSME payments: {{ outputs.check_payables.outputs[0].row.overdue_count }} overdue (Rs {{ outputs.check_payables.outputs[0].row.overdue_amount }}), {{ outputs.check_payables.outputs[0].row.due_soon_count }} due within {{ inputs.warn_within_days }} days (Rs {{ outputs.check_payables.outputs[0].row.due_soon_amount }}). Overdue: {{ outputs.check_payables.outputs[0].row.overdue_details }}"
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        message: "No MSME bill is overdue or due within {{ inputs.warn_within_days }} days ({{ outputs.check_payables.outputs[0].row.total_bills }} bills checked)."

errors:
  - id: log_check_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    description: Make a failed check loud, so a run that checked nothing is never mistaken for a clean one.
    message: "MSME payment check FAILED in {{ flow.namespace }}.{{ flow.id }} (execution {{ execution.id }}). No bill was checked. Check the columns of payables and vendor_master."

outputs:
  - id: msme_payables_report
    type: FILE
    description: Per-bill CSV with the deadline, status (OVERDUE, DUE_SOON, CHECK_VENDOR, ON_TRACK, NOT_COVERED or PAID), days overdue, interest estimate, year-end risk flag and notes, most urgent first.
    value: "{{ outputs.check_payables.outputFiles['msme_payables_report.csv'] }}"
  - id: check_summary
    type: JSON
    description: 'Counts, amounts and details, e.g. {"overdue_count": 3, "overdue_amount": 342000, "deduction_at_risk_amount": 401200, ...}.'
    value: "{{ outputs.check_payables.outputs[0].row | toJson }}"

extend:
  title: Track MSME Supplier Payments Against the 45-Day Rule (Section 37(2)(g), formerly 43B(h))
  shortDescription: Daily check of unpaid bills from micro and small suppliers against the MSMED Act deadline, with section 16 interest and the year-end tax deduction at risk.
  metaTitle: MSME 45-Day Payment Rule Check (Section 37(2)(g) / 43B(h)) with Kestra
  metaDescription: Track MSME supplier bills against the 45-day payment rule, estimate section 16 interest and flag bills that risk the tax deduction under section 37(2)(g).
  description: |
    Since 1 April 2024, the Income-tax law links a business's tax deduction to how fast it pays its micro and small suppliers. Under section 15 of the MSMED Act, a bill must be paid within the agreed credit period, never more than 45 days from acceptance, or within 15 days when there is no written agreement. A bill still unpaid past that deadline at the end of the financial year is not deductible that year, and section 16 gives the supplier compound interest at three times the RBI bank rate. Payables teams usually find out at year-end, when the auditor asks. The rule was section 43B(h) of the Income-tax Act, 1961 and continues as section 37(2)(g) of the Income-tax Act, 2025, in force from 1 April 2026. This blueprint checks every bill every morning, tells the payments team what is overdue and what falls due this week, estimates the interest, and shows how much of the year's deduction is at risk. Everything runs locally in DuckDB: no ERP credentials and no supplier data leaving your Kestra instance.

    ## How it works

    1. `sample_payables` and `sample_vendor_master` (`io.kestra.plugin.core.storage.Write`) write twelve bills and nine suppliers with one example of every case. Dates are relative to today, so the sample always shows the same picture. They are used only when the matching input is empty.
    2. `check_payables` (`io.kestra.plugin.jdbc.duckdb.Queries`) joins each bill to its supplier and works out the deadline: the agreed credit days capped at 45, or 15 days when no agreement is given, counted from the acceptance date. It then sets a status per bill:
       - `OVERDUE`: a micro or small supplier with a valid Udyam number, money still owed, and the deadline passed. Also estimates section 16 interest (three times the bank rate, compounded monthly).
       - `DUE_SOON`: the deadline falls within `warn_within_days`.
       - `CHECK_VENDOR`: the supplier is not in the master, or claims micro/small status without a valid `UDYAM-XX-00-0000000` number.
       - `NOT_COVERED`: medium enterprises and traders, which the rule does not cover.
       - `ON_TRACK` and `PAID`.
    3. `route_findings` (`io.kestra.plugin.core.flow.If`) logs the overdue and soon-due bills with amounts, the interest estimate and the deduction at risk for the current financial year, and a nested `If` posts a summary to Slack when `notify_slack` is `true`. A clean run is logged as well.
    4. The `errors` block logs a failed check loudly, so a run that checked nothing is never mistaken for a clean one.
    5. The `daily_check` `Schedule` trigger (09:00 IST, shipped disabled) runs it every morning.
    6. The `on_payables_export` `Flow` trigger (shipped disabled) is the event-based option: it starts the check as soon as the flow that exports your payables (`export-payables` in `company.team`) succeeds, and passes its `payables_file` output in as `payables`.

    ## What you get

    - `outputs.msme_payables_report`: CSV with `bill_no`, `vendor_name`, `udyam_number`, `enterprise_type`, `activity`, `acceptance_date`, `credit_days`, `due_date`, `amount`, `paid_amount`, `outstanding`, `status`, `days_overdue`, `interest_estimate`, `deduction_at_risk_on_fy_end` and `notes`, most urgent first.
    - `outputs.check_summary`: JSON with `overdue_count`, `overdue_amount`, `due_soon_count`, `due_soon_amount`, `check_vendor_count`, `interest_estimate_total`, `deduction_at_risk_amount`, `fy_end` and the details of each group.
    - With the sample data: overdue bills (a 45-day agreement passed, a 60-day agreement capped at 45, a bill with no agreement past 15 days, a part-paid bill), bills due within the week, a supplier claiming micro status without a Udyam number, a malformed Udyam number, a trader and a medium enterprise reported as not covered, and a bill already paid.

    ## Who it's for

    - Accounts payable and finance teams in India that buy from micro and small enterprises.
    - CFOs and tax teams that want the section 37(2)(g) position before the year-end close, not after the audit.
    - CA firms that review payables for many clients.

    ## Why orchestrate this with Kestra

    A spreadsheet can find late bills once. Kestra runs the check every morning on the latest export, keeps each day's report in the execution history as evidence of the payment discipline, branches on the result, and alerts the people who release payments. The inputs are plain files, so the same flow can read the payables export from your ERP, S3, SFTP or Google Drive, or be followed by a step that schedules the payments.

    ## Prerequisites

    - Nothing for the demo: the sample bills and suppliers are built in.
    - For your own data: a payables export and a supplier master with the columns below, including each supplier's Udyam number, size and activity from its Udyam certificate.

    ### Inputs

    - `payables` (FILE, optional): `bill_no`, `vendor_id`, `bill_date`, `acceptance_date` (date the goods or services were accepted; falls back to `bill_date`), `amount`, `paid_amount` and `agreed_credit_days` (empty when there is no written agreement).
    - `vendor_master` (FILE, optional): `vendor_id`, `vendor_name`, `udyam_number`, `enterprise_type` (`micro`, `small` or `medium`) and `activity` (`manufacturing`, `services` or `trading`).
    - `as_of` (STRING, optional): date to check on, `YYYY-MM-DD`; defaults to today.
    - `warn_within_days` (INT, default `7`): how early to flag a coming deadline.
    - `bank_rate_pct` (FLOAT, default `5.5`): RBI bank rate for the interest estimate. Check the current rate on the RBI website.
    - `notify_slack` (BOOL, default `false`): post a summary to Slack when something needs paying.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL. Only needed when `notify_slack` is `true`.

    ## Quick start

    1. Save the flow and run it with the default inputs.
    2. Open the logs of `log_findings` and download `msme_payables_report` from the Outputs tab.
    3. Run it again with your own payables export and supplier master.
    4. Optional: add the `SLACK_WEBHOOK_URL` secret and set `notify_slack` to `true`.
    5. Point the inputs at your real sources and set `disabled: false` on `daily_check`.

    ## Common pitfalls

    - The deadline runs from acceptance (or deemed acceptance) of the goods or services, not from the bill date. Export the goods receipt or acceptance date when you have it.
    - Medium enterprises and pure traders are not covered, even when the supplier shows a Udyam number. Keep `enterprise_type` and `activity` in the master up to date from the supplier's Udyam certificate.
    - The interest figure is an estimate at a single bank rate. The law applies the rate in force at each monthly rest; use it to prioritise, not to settle a claim.
    - A bill paid late within the same financial year is still deductible that year, but interest is owed. Check how your tax adviser treats your specific cases.

    ## How to extend

    - Read bills and suppliers straight from your ERP database (Postgres, MySQL, SQL Server) instead of files.
    - Add a `Pause` approval step and a payment file for the overdue bills, or chain it with a bank payout pre-check before upload.
    - Send each supplier a payment-date confirmation with a `ForEach` over the due-soon bills.
    - Produce the half-yearly MSME Form I list of dues outstanding for more than 45 days.

    ## Links

    - [Income-tax Act, 2025 (Income Tax Department)](https://incometaxindia.gov.in/)
    - [MSMED Act 2006 sections 15 and 16 (Ministry of MSME)](https://www.dcmsme.gov.in/publications/LegalFramework.pdf)
    - [Udyam registration (Ministry of MSME)](https://udyamregistration.gov.in/)
    - [Kestra DuckDB plugin](https://kestra.io/plugins/plugin-jdbc/duckdb)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    - This blueprint has been created by [Ankith-m1006](https://github.com/Ankith-m1006)
  tags:
    - Business
    - Data
  subTags:
    - Policy & Compliance
    - Testing & Quality
  ee: false
  demo: false
