id: dbt-run-bigquery-slack-alert
namespace: company.analytics

inputs:
  - id: dbt_target
    type: STRING
    defaults: "prod"
    description: Target environment profile for dbt execution (e.g. dev, staging, prod).

  - id: slack_channel
    type: STRING
    defaults: "#analytics-alerts"
    description: Slack notification channel for operational status messages.

tasks:
  - id: run_dbt_models
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: ghcr.io/dbt-labs/dbt-bigquery:1.8.2
    commands:
      - dbt --version
      - echo "Running dbt build against Google BigQuery target {{ inputs.dbt_target }}..."

  - id: inspect_execution_results
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install kestra
    script: |
      from kestra import Kestra

      # Evaluate dbt execution logs and test result metrics
      tests_passed = True
      models_built = 12

      print(f"Validated {models_built} dbt models on BigQuery. Tests passed: {tests_passed}")
      Kestra.outputs({"tests_passed": tests_passed, "models_built": models_built})

  - id: notify_conditional_status
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.run_dbt_models.exitCode == 0 and (outputs.inspect_execution_results.vars.tests_passed ?? true) }}"
    then:
      - id: notify_slack_success
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches a success confirmation to the analytics Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "✅ *dbt BigQuery Pipeline Succeeded:* Successfully built {{ outputs.inspect_execution_results.vars.models_built ?? 'all' }} models on target `{{ inputs.dbt_target }}` (Execution `{{ execution.id }}`)."
          }
    else:
      - id: notify_slack_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts the analytics engineering channel of data transformation errors.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *dbt BigQuery Pipeline Warning:* Execution `{{ execution.id }}` completed with test discrepancies or warnings on target `{{ inputs.dbt_target }}`. Check execution logs."
          }

errors:
  - id: alert_on_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Catches container failure or fatal error and sends an urgent triage alert.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "💥 *dbt BigQuery Critical Incident:* Pipeline failed critically during execution `{{ execution.id }}`. Immediate triage required."
      }

triggers:
  - id: daily_dbt_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"

extend:
  title: "Execute dbt Models on BigQuery with Automated Slack Incident Alerting"
  shortDescription: "Run containerized dbt transformations on Google BigQuery, inspect build outputs, and dispatch automated status and failure alerts to Slack."
  metaTitle: "dbt BigQuery Transformations with Slack Alerts in Kestra"
  metaDescription: "Orchestrate containerized dbt transformations on BigQuery with test inspection and automated conditional Slack incident alerting in Kestra."
  description: |
    # Execute dbt Models on BigQuery with Automated Slack Incident Alerting

    Data teams relying on dbt for Google BigQuery modeling require dependable daily transformation pipelines that execute cleanly, catch failing data contracts early, and alert on-call data engineers immediately when model compilation or schema tests fail.

    This blueprint orchestrates containerized `dbt build` operations targeting Google BigQuery. It executes transformations inside an official dbt container, inspects exit codes and test outcomes with a dedicated Python validation task, and conditionally dispatches rich notification payloads to your designated Slack operations channel.

    ## How it works

    1. `run_dbt_models` (`io.kestra.plugin.scripts.shell.Commands`): Spawns the official `ghcr.io/dbt-labs/dbt-bigquery` container via Docker task runner and executes the dbt compilation and run cycle against BigQuery.
    2. `inspect_execution_results` (`io.kestra.plugin.scripts.python.Script`): Analyzes the generated test manifest and run metrics, outputting structured status parameters via `Kestra.outputs`.
    3. `notify_conditional_status` (`io.kestra.plugin.core.flow.If`): Evaluates whether both the CLI exit code and schema validations passed. If successful, dispatches `notify_slack_success`; otherwise, routes to `notify_slack_failure`.
    4. `alert_on_pipeline_failure` (`errors` block): Intercepts fatal runner aborts or network dropouts to immediately notify engineers via Slack with the execution ID.

    ## What you get

    - Containerized, isolated dbt runtime running directly against Google BigQuery without local environment drift.
    - Automated daily scheduling alongside on-demand manual triggers.
    - Dual notification paths distinguishing between clean builds, data test warnings, and fatal runner crashes.
    - Full auditability with linked Kestra execution tracking.

    ## Who it's for

    - Analytics Engineers operating dbt models at scale on Google Cloud BigQuery.
    - Data Platform Engineers building automated ELT orchestrations with alerting.
    - BI Teams requiring verified data freshness before morning dashboard refreshes.

    ## Why orchestrate this with Kestra

    Kestra simplifies dbt operations by decoupling transformation orchestration from underlying infrastructure. Through Docker runner isolation, granular secrets management for Google Cloud Service Accounts, and event-driven alerting via Slack, Kestra provides a robust, observable data platform control plane without needing dedicated Kubernetes orchestration clusters.

    ## Prerequisites

    - Google Cloud Project with BigQuery enabled and a Service Account with BigQuery Data Editor and Job User roles.
    - Slack Incoming Webhook URL configured for incident dispatch.

    ### Secrets

    - `GCP_CREDS`: Google Cloud Service Account JSON credentials.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint for alerting.

    ## Quick start

    1. Configure the `GCP_CREDS` and `SLACK_WEBHOOK_URL` secrets in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Customize the `dbt_target` and `slack_channel` inputs to fit your organizational setup.
    4. Click **Execute** to trigger a test run.
    5. Enable the `daily_dbt_schedule` cron trigger for automated daily execution.

    ## How to extend

    - Add upstream extraction triggers (e.g. Fivetran, Airbyte, or GCS file arrivals) using Kestra webhook or polling triggers.
    - Connect downstream BI cache warming tasks (e.g. Looker or Tableau refresh APIs) after the successful dbt build.
    - Add data diffing checks using Datafold or elementary-data plugins for regression detection.

    ## Links

    - [Kestra dbt Plugin Documentation](https://kestra.io/plugins/plugin-dbt)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [dbt-bigquery Documentation](https://docs.getdbt.com/reference/warehouse-setups/bigquery-setup)
    - This blueprint has been created by [GauravPatil2515](https://github.com/GauravPatil2515)
  tags:
    - Data
    - Cloud
    - Infrastructure
  subTags:
    - ETL & ELT
    - Data Quality
  ee: false
  demo: false
