id: gcp-cloud-run-container-instance-spillover-sentinel
namespace: company.cloud

inputs:
  - id: project_id
    type: STRING
    description: Google Cloud Project ID.
  - id: service_name
    type: STRING
    description: Google Cloud Run service name to audit.
  - id: region
    type: STRING
    defaults: "us-central1"
    description: GCP region where the service is deployed.
  - id: max_instance_ceiling
    type: INT
    defaults: 100
    description: Configured maxScale container instance ceiling.

tasks:
  - id: query_cloud_run_instances
    type: io.kestra.plugin.gcp.gcloud.GCloudCLI
    projectId: "{{ inputs.project_id }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    commands:
      - |
        START_TIME=$(date -u -v-15M +%Y-%m-%dT%H:%M:%SZ)
        FILTER="metric.type="run.googleapis.com/container/instance_count" AND resource.labels.service_name="{{ inputs.service_name }}""
        
        gcloud monitoring timeseries list \
          --filter="$FILTER" \
          --interval-start-time="$START_TIME" \
          --format=json > /tmp/run_instances.json
        
        MAX_ACTIVE=$(jq '[.[]?.points[]?.value.int64Value // 0] | max // 0' /tmp/run_instances.json)
        
        echo "::set-output name=max_active::$MAX_ACTIVE::"

  - id: evaluate_instance_ceiling
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_cloud_run_instances.vars.max_active | int >= (inputs.max_instance_ceiling * 90 / 100) }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#gcp-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Google Cloud Run Autoscaling Ceiling Alert",
                "text": "Cloud Run service `{{ inputs.service_name }}` in `{{ inputs.region }}` reached *{{ outputs.query_cloud_run_instances.vars.max_active }} active instances* (configured maxScale: {{ inputs.max_instance_ceiling }})! Impact: The serverless service cannot scale out further, leading to HTTP 429 / 503 request drops and extreme queue delays under traffic surges.",
                "footer": "Kestra Cloud Sentinel • Cloud Run"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#gcp-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Google Cloud Run Container Instance Autoscaling Ceiling Sentinel Pipeline Failure",
            "text": "Failed to query Cloud Monitoring for Cloud Run instance telemetry. Check service account permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Google Cloud Run Container Instance Autoscaling Ceiling Sentinel
  shortDescription: Monitors Google Cloud Run instance counts against configured maxScale ceilings to detect autoscaling exhaustion.
  description: |
    ## How it works
    This workflow executes `gcloud monitoring timeseries list` to inspect `run.googleapis.com/container/instance_count` for the specified Cloud Run service. When incoming request concurrency surges beyond capacity and active containers reach the configured `maxScale` setting, Cloud Run cannot spawn additional container instances. Additional requests queue up until concurrency limits exceed, throwing HTTP 429 or 503 errors. Slack is notified when instances approach 90% of the ceiling.

    ## What you get
    - Immediate detection of Cloud Run autoscaling ceiling exhaustion.
    - Prevents customer request drops and latency degradation under sudden traffic spikes.
    - Clear visibility into peak active container counts over 15-minute intervals.

    ## Who it's for
    - SREs and DevOps Engineers maintaining serverless web services and APIs.
    - Cloud Infrastructure Architects setting autoscaling policies on Google Cloud.

    ## Why orchestrate this with Kestra
    - **Native Cloud Run Telemetry**: Tracks live container instance counts without sidecars.
    - **Continuous Health Auditing**: Run scheduled 15-minute verification across critical services.
    - **Automated Scale Adjustments**: Chain directly into `gcloud run services update --max-instances` workflows.

    ## Prerequisites
    - Google Cloud Run service deployed with Cloud Monitoring enabled.
    - Secrets `GCP_SERVICE_ACCOUNT` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint into Kestra.
    2. Configure project ID, service name, and maxScale ceiling.
    3. Run the flow to audit container instance autoscaling.

    ## How to extend
    - Automatically increase `maxScale` via gcloud command upon persistent traffic growth.
    - Monitor `run.googleapis.com/request_latencies` alongside instance counts.

    ## Links
    - [Google Cloud Run Metrics Documentation](https://cloud.google.com/run/docs/monitoring)
    - [Kestra GCloud Plugin](https://kestra.io/plugins/plugin-gcp/io.kestra.plugin.gcp.gcloud.gcloudcli)
  tags:
    - Cloud
    - Infrastructure
  ee: false
  demo: false
