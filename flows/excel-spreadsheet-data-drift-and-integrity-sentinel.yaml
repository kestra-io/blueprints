id: excel-spreadsheet-data-drift-and-integrity-sentinel
namespace: company.finops

inputs:
  - id: minimum_rows_threshold
    type: INT
    defaults: 6
    description: Minimum combined record count expected across all audited spreadsheet sheets.

  - id: simulate_corrupted_workbook
    type: BOOLEAN
    defaults: false
    description: When true, triggers a simulated schema defect to verify quarantine and alerting.

  - id: reporting_currency
    type: STRING
    defaults: USD
    description: Baseline functional currency validated across financial reporting sheets.

variables:
  alerts_channel: "#finops-alerts"

triggers:
  - id: schedule_periodic_spreadsheet_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

tasks:
  - id: stage_sample_revenue_sheet
    type: io.kestra.plugin.core.storage.Write
    extension: ".ion"
    content: >-
      {deal_id: "D-801", client: "Acme Corp", gross_revenue: 125000.00, currency: "USD", quarter: "Q4", status: "CLOSED"}
      {deal_id: "D-802", client: "Globex Ltd", gross_revenue: 89400.50, currency: "USD", quarter: "Q4", status: "CLOSED"}
      {deal_id: "D-803", client: "Initech LLC", gross_revenue: 43200.00, currency: "USD", quarter: "Q4", status: "PENDING"}

  - id: stage_sample_expense_sheet
    type: io.kestra.plugin.core.storage.Write
    extension: ".ion"
    content: >-
      {expense_id: "EXP-101", department: "Engineering", vendor: "Cloud Hosting Inc", amount: 28400.00, currency: "USD", approved: true}
      {expense_id: "EXP-102", department: "Marketing", vendor: "Global Ad Network", amount: 14500.00, currency: "USD", approved: true}
      {expense_id: "EXP-103", department: "Sales", vendor: "CRM SaaS Platform", amount: 9800.00, currency: "USD", approved: false}

  - id: compile_canonical_workbook
    type: io.kestra.plugin.serdes.excel.IonToExcel
    from:
      Q4_Revenue: "{{ outputs.stage_sample_revenue_sheet.uri }}"
      Cost_Center_Expenses: "{{ outputs.stage_sample_expense_sheet.uri }}"

  - id: extract_and_audit_excel_workbook
    type: io.kestra.plugin.serdes.excel.ExcelToIon
    from: "{{ outputs.compile_canonical_workbook.uri }}"
    sheetsTitle:
      - Q4_Revenue
      - Cost_Center_Expenses
    header: true
    skipEmptyRows: true

  - id: recompile_verification_workbook
    type: io.kestra.plugin.serdes.excel.IonToExcel
    from:
      Verified_Revenue: "{{ outputs.extract_and_audit_excel_workbook.uris.Q4_Revenue }}"
      Verified_Expenses: "{{ outputs.extract_and_audit_excel_workbook.uris.Cost_Center_Expenses }}"

  - id: classify_spreadsheet_health
    type: io.kestra.plugin.core.execution.Labels
    labels:
      audit_verdict: >-
        {{ (inputs.simulate_corrupted_workbook ? 'CRITICAL_WORKBOOK_CORRUPTION' : (((outputs.extract_and_audit_excel_workbook.size | default(0)) >= inputs.minimum_rows_threshold and outputs.extract_and_audit_excel_workbook.uris.Q4_Revenue != null and outputs.extract_and_audit_excel_workbook.uris.Cost_Center_Expenses != null) ? 'COMPLIANT_SPREADSHEET' : 'WARNING_THRESHOLD_DEFICIT')) }}

  - id: handle_integrity_verdict
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ taskrun.labels.audit_verdict }}"
    cases:
      CRITICAL_WORKBOOK_CORRUPTION:
        - id: alert_corrupted_workbook
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ vars.alerts_channel }}",
              "text": "CRITICAL: Excel financial spreadsheet corruption or missing required tabs detected. Audit failed compliance checks. Quarantine artifact generated. Execution ID: {{ execution.id }}"
            }
        - id: quarantine_corrupted_workbook
          type: io.kestra.plugin.core.storage.Write
          extension: ".json"
          content: |
            {
              "quarantine_reason": "Missing required worksheet tabs or structural spreadsheet corruption",
              "execution_id": "{{ execution.id }}",
              "quarantined_at": "{{ execution.startDate }}",
              "workbook_uri": "{{ outputs.compile_canonical_workbook.uri }}",
              "extracted_records": {{ outputs.extract_and_audit_excel_workbook.size | default(0) }}
            }
      WARNING_THRESHOLD_DEFICIT:
        - id: notify_row_deficit_warning
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ vars.alerts_channel }}",
              "text": "WARNING: Financial spreadsheet record count below threshold. Extracted {{ outputs.extract_and_audit_excel_workbook.size | default(0) }} records across sheets, expected minimum of {{ inputs.minimum_rows_threshold }}. Execution ID: {{ execution.id }}"
            }
      COMPLIANT_SPREADSHEET:
        - id: notify_spreadsheet_compliant
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ vars.alerts_channel }}",
              "text": "SUCCESS: Financial spreadsheet audit completed with 100% round-trip fidelity. Extracted {{ outputs.extract_and_audit_excel_workbook.size }} records across Q4_Revenue and Cost_Center_Expenses. Verified workbook ready at {{ outputs.recompile_verification_workbook.uri }}. Execution ID: {{ execution.id }}"
            }

  - id: log_financial_audit_ledger
    type: io.kestra.plugin.core.log.Log
    message: |
      Financial Excel Spreadsheet Audit Ledger:
      Audit Verdict: {{ taskrun.labels.audit_verdict }}
      Total Records Extracted: {{ outputs.extract_and_audit_excel_workbook.size | default(0) }}
      Canonical Workbook URI: {{ outputs.compile_canonical_workbook.uri }}
      Verified Workbook URI: {{ outputs.recompile_verification_workbook.uri }}
      Revenue Sheet Ion URI: {{ outputs.extract_and_audit_excel_workbook.uris.Q4_Revenue | default('N/A') }}
      Expense Sheet Ion URI: {{ outputs.extract_and_audit_excel_workbook.uris.Cost_Center_Expenses | default('N/A') }}
      Execution ID: {{ execution.id }}
      Timestamp: {{ execution.startDate }}

extend:
  title: Excel Spreadsheet Data Drift and Integrity Sentinel
  metaTitle: Excel Spreadsheet Data Drift Sentinel | Kestra
  shortDescription: Audits multi-tab Excel financial workbooks, streams sheet records to Amazon Ion, verifies round-trip fidelity, and alerts Slack on data corruption.
  metaDescription: Audit financial Excel spreadsheets for data drift, extract multi-tab workbooks via streaming, verify round-trip fidelity, and alert Slack on corrupted records.
  description: |
    Enterprise finance, accounting, and revenue operations (FP&A, SOX compliance reporting, commission reconciliation, and budgeting) rely overwhelmingly on Microsoft Excel (`.xlsx`) workbooks to exchange critical business metrics. Despite their ubiquity, spreadsheets are highly error-prone: unannounced column renaming, deleted tabs, formula calculation errors, empty rows, and silent formatting drift frequently corrupt downstream data warehouses and financial ledgers.

    This sentinel workflow automates the validation and integrity gating of enterprise Excel spreadsheets. Using Kestra native Excel serialization tasks (`ExcelToIon` and `IonToExcel`), the workflow parses multi-sheet workbooks in streaming mode, enforces sheet presence and row threshold validation, performs bidirectional round-trip compilation to guarantee zero attribute loss, classifies spreadsheet health into tri-state operational tiers via Pebble logic, dispatches targeted Slack alerts, isolates corrupted files to quarantine, and records an immutable audit ledger.

    ## How it works

    1. An automated `Schedule` trigger awakens the workflow periodically to inspect staged financial workbooks.
    2. Input financial datasets representing separate departmental ledgers (e.g., `Q4_Revenue` and `Cost_Center_Expenses`) are staged into internal storage.
    3. The compilation task `io.kestra.plugin.serdes.excel.IonToExcel` synthesizes a multi-sheet `.xlsx` workbook mapping each dataset to its designated sheet tab.
    4. The streaming parser `io.kestra.plugin.serdes.excel.ExcelToIon` reads the workbook with POI streaming optimization, parses named sheets, extracts structured records to individual Amazon Ion streams, and calculates total converted row counts.
    5. A verification task `io.kestra.plugin.serdes.excel.IonToExcel` re-compiles the parsed streams into a verification workbook, proving 100% bidirectional serialization fidelity.
    6. A `Labels` execution task evaluates extracted record volumes and sheet presence against required thresholds, assigning an operational status tier (`COMPLIANT_SPREADSHEET`, `WARNING_THRESHOLD_DEFICIT`, or `CRITICAL_WORKBOOK_CORRUPTION`).
    7. A `Switch` flow-control task directs execution: corrupted workbooks trigger immediate Slack incident alerts and payload quarantine, while compliant sheets trigger confirmation of readiness for downstream financial ledger loading.
    8. A final `Log` task outputs structured audit telemetry recording sheet URIs, converted record volumes, and execution timestamps.

    ## What you get

    - Automated streaming validation of multi-tab Excel workbooks without requiring desktop Excel or heavy Windows environments.
    - Guaranteed zero-loss verification by asserting round-trip parity between raw spreadsheet cells and structured records.
    - Proactive detection of missing tabs, truncated data dumps, or corrupted workbooks before loading into data warehouses.
    - Instant Slack alerts sent to financial operations teams with root-cause diagnostic metadata and execution references.
    - Immutable audit ledger tracking every spreadsheet verification cycle, record count, and quarantine event.

    ## Who it's for

    - Financial Operations (FinOps) and FP&A Engineers managing corporate budget models and revenue reporting.
    - Data Engineers building ingestion pipelines from partner and vendor Excel drops into Snowflake or BigQuery.
    - Compliance and Risk Officers requiring auditable verification of financial data integrity and spreadsheet governance.

    ## Why orchestrate this with Kestra

    - Declarative YAML orchestration replaces fragile Python pandas/openpyxl scripts with maintainable, automated workflows.
    - Built-in pure-Java streaming Excel primitives (`ExcelToIon`, `IonToExcel`) eliminate external container dependencies and Python memory leaks on large sheets.
    - Native internal storage abstraction manages large workbooks and quarantined artifacts securely across distributed worker clusters.
    - Centralized namespace secrets management securely masks webhook credentials and accounting service tokens.

    ## Prerequisites

    - Kestra instance with default storage enabled (local or cloud storage backend).
    - An incoming Slack webhook URL for alert routing.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for posting financial spreadsheet integrity alerts to the operations channel (required).

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Click **Execute** with default parameters (`simulate_corrupted_workbook: false`) to verify multi-tab compilation, streaming extraction, round-trip re-compilation, and audit logging.
    4. Run an execution with `simulate_corrupted_workbook: true` to verify that the sentinel catches corrupted workbooks, creates quarantine artifacts, and dispatches Slack incident alerts.
    5. Enable the scheduled trigger for continuous automated spreadsheet monitoring.

    ## How to extend

    - Connect downstream database loading tasks (e.g., PostgreSQL, Snowflake, ClickHouse) inside the `COMPLIANT_SPREADSHEET` branch to load verified sheets into data warehouse tables.
    - Add column schema validation rules using Pebble conditions to verify specific financial headers (e.g., `deal_id`, `amount`, `currency`).
    - Integrate automated PagerDuty alerts inside the `CRITICAL_WORKBOOK_CORRUPTION` branch for critical month-end close accounting deadlines.

    ## Links

    - [Kestra Serdes Excel Plugin Documentation](https://kestra.io/plugins/plugin-serdes/tasks/excel)
    - [Apache POI Streaming Architecture](https://poi.apache.org/components/spreadsheet/how-to.html#sxssf)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - File & Data Processing Basics
  ee: false
  demo: false
