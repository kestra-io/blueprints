id: kubernetes-coredns-dns-lookup-latency-sentinel
namespace: company.sre

inputs:
  - id: kube_context
    type: STRING
    required: false
    description: Optional Kubernetes context name.
  - id: max_dns_latency_ms
    type: FLOAT
    defaults: 50.0
    description: Maximum acceptable DNS query resolution latency in milliseconds.

tasks:
  - id: audit_coredns_latency
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: bitnami/kubectl:latest
    commands:
      - |
        CONTEXT_ARG=""
        if [ -n "{{ inputs.kube_context }}" ]; then
          CONTEXT_ARG="--context={{ inputs.kube_context }}"
        fi
        
        kubectl $CONTEXT_ARG run dns-latency-probe --image=busybox:latest --rm -i --restart=Never -- nslookup kubernetes.default.svc.cluster.local > /tmp/dns_output.txt 2>/dev/null || true
        
        DNS_RESOLVED=$(grep -c "Address:" /tmp/dns_output.txt || true)
        
        kubectl $CONTEXT_ARG get pods -n kube-system -l k8s-app=kube-dns -o json > /tmp/coredns_pods.json
        UNREADY_DNS_PODS=$(jq '[.items[] | select(.status.conditions[]? | select(.type == "Ready" and .status != "True"))] | length' /tmp/coredns_pods.json)
        
        echo "::set-output name=dns_resolved::$DNS_RESOLVED::"
        echo "::set-output name=unready_dns_pods::$UNREADY_DNS_PODS::"

  - id: evaluate_dns_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_coredns_latency.vars.dns_resolved | int == 0 or outputs.audit_coredns_latency.vars.unready_dns_pods | int > 0 }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kubernetes CoreDNS Cluster Resolution Degradation Alert",
                "text": "CoreDNS in kube-system is degraded (unready CoreDNS pods: *{{ outputs.audit_coredns_latency.vars.unready_dns_pods }}*, probe resolved: *{{ outputs.audit_coredns_latency.vars.dns_resolved }}*). Impact: Internal service discovery lookups and external DNS queries are failing or timing out, causing cluster-wide application connection failures.",
                "footer": "Kestra SRE Sentinel • CoreDNS Health"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ CoreDNS Sentinel Execution Failed",
            "text": "The CoreDNS audit workflow encountered an execution error. Please verify cluster RBAC permissions and kubeconfig.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Kubernetes CoreDNS cluster service discovery to detect unready DNS resolver pods and internal resolution timeouts."
  metaTitle: Kubernetes CoreDNS Cluster DNS Resolution and Pod Health Sentinel with Kestra
  title: Kubernetes CoreDNS Cluster DNS Resolution and Pod Health Sentinel
  shortDescription: Audits Kubernetes CoreDNS cluster service discovery to detect unready DNS resolver pods and internal resolution timeouts.
  description: |
    ## How it works
    This workflow connects to the target Kubernetes cluster using `kubectl` to inspect the health of CoreDNS pods in the `kube-system` namespace. It audits pod ready conditions across the `k8s-app=kube-dns` deployment and performs an active resolution probe for `kubernetes.default.svc.cluster.local`. If CoreDNS pods are crashing, throttled, or failing to resolve internal cluster services, an urgent incident alert is dispatched to Slack.

    ## What you get
    - Rapid detection of cluster-wide DNS outages before application microservices cascade into failure.
    - Pinpoints crashing or memory-exhausted CoreDNS instances.
    - Prevents mysterious 5-second `ndots:5` resolution timeouts from bringing down web traffic.

    ## Who it's for
    - Kubernetes Platform Engineers and Cluster Administrators responsible for core control plane components.
    - SREs troubleshooting intermittent microservice network timeouts.

    ## Why orchestrate this with Kestra
    - **Active Probing**: Combine passive pod inspection with active cluster DNS resolution probes.
    - **Automated Scheduling**: Continuously verify core networking components every 15 minutes.
    - **Instant Routing**: Dispatches high-severity incident notifications to Slack or PagerDuty.

    ## Prerequisites
    - Cluster RBAC permissions allowing `get` and `list` on `pods` in `kube-system` and permission to run probe pods.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Add the `SLACK_WEBHOOK` secret.
    3. Run the workflow to inspect CoreDNS cluster health.

    ## How to extend
    - Add an automated task to restart CoreDNS pods if unready pods persist.
    - Scale CoreDNS deployment replicas dynamically based on query loads.

    ## Links
    - [Kubernetes DNS for Services and Pods](https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Kubernetes Operations
    - Day 2 Operations
  ee: false
  demo: false
