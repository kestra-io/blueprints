id: lambda-unused-functions-finder
namespace: company.finops

description: |
  Finds Lambda functions with zero invocations in the last 30 days — dead code
  still sitting in your account — and flags functions paying for provisioned
  concurrency they never use. Reports memory sizing waste for the quiet ones.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for unused Lambda functions.
  - id: lookback_days
    type: INT
    defaults: 30
    description: Invocation window in days; zero invocations in this window counts as unused.
  - id: gb_second_usd
    type: STRING
    defaults: "0.0000166667"
    description: Lambda price per GB-second in USD. Used to estimate rightsizing waste.

tasks:
  - id: check_functions
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit Lambda functions region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List functions, check 30-day invocations and provisioned concurrency per function.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            DAYS={{ inputs.lookback_days }}
            GBSEC="{{ inputs.gb_second_usd }}"
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
            PERIOD=$((DAYS * 86400))
            echo "Checking Lambda functions in $REGION (invocation window: last $DAYS days)"
            aws lambda list-functions --region "$REGION" \
              --query 'Functions[].[FunctionName,MemorySize,Runtime]' --output json > /tmp/fns.json
            DEAD_LIST=""
            DEAD_COUNT=0
            PC_WASTE_LIST=""
            while IFS= read -r line; do
              FN=$(echo "$line" | python3 -c "import json,sys;print(json.load(sys.stdin)[0])")
              MEM=$(echo "$line" | python3 -c "import json,sys;print(json.load(sys.stdin)[1])")
              RT=$(echo "$line" | python3 -c "import json,sys;print(json.load(sys.stdin)[2])")
              INV=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/Lambda --metric-name Invocations \
                --dimensions Name=FunctionName,Value="$FN" \
                --start-time "$START" --end-time "$END" \
                --period "$PERIOD" --statistics Sum \
                --query 'Datapoints[0].Sum' --output text 2>/dev/null)
              case "$INV" in ''|'None') INV=0;; esac
              INV_INT=${INV%.*}
              PC=$(aws lambda get-provisioned-concurrency-config --region "$REGION" \
                --function-name "$FN" --qualifier '$LATEST' \
                --query 'RequestedProvisionedConcurrentExecutions' --output text 2>/dev/null || echo "0")
              case "$PC" in ''|'None') PC=0;; esac
              if [ "$INV_INT" -eq 0 ]; then
                DEAD_LIST="${DEAD_LIST}${FN} (${MEM}MB ${RT}), "
                DEAD_COUNT=$((DEAD_COUNT + 1))
                if [ "${PC%.*}" -gt 0 ] 2>/dev/null; then
                  PC_WASTE_LIST="${PC_WASTE_LIST}${FN} pays for ${PC} provisioned concurrent executions with ZERO invocations, "
                fi
              fi
            done < <(python3 -c "import json;[print(json.dumps(f)) for f in json.load(open('/tmp/fns.json'))]")
            if [ "$DEAD_COUNT" -gt 0 ]; then HAS_DEAD=true; else HAS_DEAD=false; fi
            echo "HAS_DEAD=$HAS_DEAD"
            echo "DEAD_COUNT=$DEAD_COUNT"
            echo "DEAD_FUNCTIONS=$DEAD_LIST"
            echo "PC_WASTE=$PC_WASTE_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report dead functions, stay quiet when everything is invoked.
        condition: "{{ outputs.audit_region.vars.HAS_DEAD == 'true' }}"
        then:
          - id: slack_dead
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":ghost: Lambda audit `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.DEAD_COUNT }}* function(s) with ZERO invocations in 30 days:\n`{{ outputs.audit_region.vars.DEAD_FUNCTIONS }}`\nProvisioned-concurrency waste: `{{ outputs.audit_region.vars.PC_WASTE }}`\nDelete the dead ones; remove provisioned concurrency from anything not serving traffic."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "Every Lambda function in {{ outputs.audit_region.vars.REGION_DONE }} was invoked in the last {{ inputs.lookback_days }} days."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: Lambda Unused Functions Finder
  metaTitle: Find Unused Lambda Functions | Kestra
  shortDescription: Audit Lambda functions across regions, flag zero-invocation functions over 30 days, and catch provisioned concurrency paid for but never used.
  metaDescription: Dead Lambda functions and idle provisioned concurrency waste money. This flow finds them via CloudWatch and reports weekly.
  description: |
    Lambda functions are easy to create and easy to forget. The function itself costs nothing when idle — but provisioned concurrency bills by the hour whether traffic arrives or not, and every dead function is clutter that slows down audits and incident response. This blueprint finds functions with zero invocations in 30 days and calls out the expensive ones.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists every function and pulls the 30-day `Invocations` sum from CloudWatch.
    4. Functions with zero invocations are flagged, and each is checked for provisioned concurrency config — paying for warm instances nobody calls is the real money leak.
    5. An `If` task posts a Slack report only when dead functions exist.

    ## What you get

    - A weekly list of never-invoked functions with memory size and runtime, so cleanup is a quick review.
    - Explicit callouts for provisioned concurrency on dead functions — the highest-value finding.
    - Multi-region coverage in one run, silence on clean weeks.

    ## Who it's for

    Serverless teams whose function count grew faster than their decommissioning discipline.

    ## Why orchestrate this with Kestra

    A console click-through doesn't scale past a dozen functions. As a scheduled flow the audit covers every region, the lookback window is an input, findings land where the team already looks (Slack), and the report doubles as the decommission ticket.

    ## Prerequisites

    - AWS credentials with `lambda:ListFunctions`, `lambda:GetProvisionedConcurrencyConfig`, and `cloudwatch:GetMetricStatistics`.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the Lambda and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the Lambda and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the dead-function report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to your serverless regions.
    3. Run manually once and review the dead-function list before deleting anything.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Add `Duration` p99 per invoked function to rightsizing memory on the live ones.
    - Auto-remove provisioned concurrency configs from zero-invocation functions.
    - Cross-check dead functions against API Gateway routes and EventBridge rules before deleting.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [Lambda pricing](https://aws.amazon.com/lambda/pricing/)
    - [Lambda get-metric-statistics dimensions](https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
