id: legal-hold-notice
namespace: company.team

description: |
  When counsel issues a legal hold, the scope bucket must be locked and every
  custodian must acknowledge before the deadline, not weeks later. A webhook
  receives the hold notice carrying matter_id, the custodian list, the storage
  scope and hold_until, and a disabled weekly schedule stands ready as the
  compliance sweep. A python step validates the payload, computes days_left and
  checks the acknowledgement register for custodians who never signed off, then
  a best-effort PUT applies the retention lock to the scope bucket. Pending
  acknowledgements or a failed lock open a GitHub tracking issue, an email to
  legal ops, a Slack alert and one ack-request email per pending custodian,
  while a secured hold is logged quietly. Each run exposes the verdict, the
  matter id, the custodian count and the pending acknowledgements as typed
  outputs.

triggers:
  - id: legal_hold_issued
    type: io.kestra.plugin.core.trigger.Webhook
    description: Counsel's eDiscovery tool POSTs here the moment a hold is issued, so the retention lock and the acknowledgement chase start immediately.
    key: "{{ secret('LEGAL_HOLD_WEBHOOK_KEY') }}"
  - id: weekly_compliance_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled weekly net that would re-check open holds every Monday morning until someone switches it on.
    cron: "0 6 * * 1"
    disabled: true

inputs:
  - id: storage_endpoint
    type: STRING
    defaults: https://storage.internal.acme-example.com/v1/buckets
    description: Base URL of the object retention API that the scope bucket lock is PUT against.
  - id: github_repository
    type: STRING
    defaults: acme-corp/legal-compliance
    description: Repository that receives the tracking issue when a hold has a gap.
  - id: legal_ops_email
    type: STRING
    defaults: legal-ops@acme-example.com
    description: Legal operations mailbox that is emailed whenever a hold needs attention.

tasks:
  # --- 1. validate the hold notice against the acknowledgement register ---
  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the register written by the shell step is the exact file the python validator reads.
    tasks:
      - id: write_hold_register
        type: io.kestra.plugin.scripts.shell.Commands
        description: Writes holds.json from a heredoc of five register rows across two matters, mixing acknowledged and pending custodians so the validator always has a gap to find.
        commands:
          - |
            cat > holds.json <<'HOLDS_EOF'
            {
              "register": [
                {"matter_id": "MAT-2026-0142", "custodian": "alice.nguyen@example.com", "acknowledged": true},
                {"matter_id": "MAT-2026-0142", "custodian": "bob.okafor@example.com", "acknowledged": false},
                {"matter_id": "MAT-2026-0142", "custodian": "carla.diaz@example.com", "acknowledged": true},
                {"matter_id": "MAT-2026-0142", "custodian": "dev.patel@example.com", "acknowledged": false},
                {"matter_id": "MAT-2025-0988", "custodian": "erin.wu@example.com", "acknowledged": true}
              ]
            }
            HOLDS_EOF
            wc -c holds.json

      - id: validate_hold
        type: io.kestra.plugin.scripts.python.Script
        description: Validates the hold payload, computes days_left from hold_until, checks holds.json for custodians missing an acknowledgement and emits the verdict payload.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          HOLD_PAYLOAD: "{{ (trigger.body ?? {}) | toJson }}"
        script: |
          import json
          import os
          from datetime import date

          HOLDS_FILE = "holds.json"

          raw = os.environ.get("HOLD_PAYLOAD", "").strip()
          payload = None
          if raw:
              try:
                  payload = json.loads(raw)
                  while isinstance(payload, str):
                      payload = json.loads(payload)
              except ValueError:
                  payload = None
          if not isinstance(payload, dict):
              payload = {}

          matter_id = str(payload.get("matter_id") or "").strip()
          scope = str(payload.get("scope") or "").strip()
          hold_until_raw = str(payload.get("hold_until") or "").strip()

          custodians = []
          raw_custodians = payload.get("custodians")
          if isinstance(raw_custodians, list):
              for entry in raw_custodians:
                  name = str(entry or "").strip()
                  if name and name not in custodians:
                      custodians.append(name)

          days_left = None
          if hold_until_raw:
              try:
                  days_left = (date.fromisoformat(hold_until_raw[:10]) - date.today()).days
              except ValueError:
                  days_left = None

          acknowledged = set()
          try:
              with open(HOLDS_FILE, "r", encoding="utf-8") as handle:
                  register = json.load(handle)
              rows = register.get("register") if isinstance(register, dict) else None
              if isinstance(rows, list):
                  for row in rows:
                      if not isinstance(row, dict):
                          continue
                      if str(row.get("matter_id") or "").strip() != matter_id:
                          continue
                      if row.get("acknowledged") is True:
                          acknowledged.add(str(row.get("custodian") or "").strip().lower())
          except (OSError, ValueError):
              acknowledged = set()

          pending_ack = [name for name in custodians if name.lower() not in acknowledged]

          hold_valid = bool(matter_id) and bool(scope) and bool(custodians) and days_left is not None
          if not hold_valid:
              verdict = "INVALID_PAYLOAD"
          elif pending_ack:
              verdict = "ACKS_PENDING"
          else:
              verdict = "HOLD_ACTIVE"

          print("legal hold %s scope=%s days_left=%s custodians=%d pending_ack=%d" % (
              matter_id or "unknown", scope or "unknown", days_left, len(custodians), len(pending_ack)))
          print("::" + json.dumps({"outputs": {
              "verdict": verdict,
              "matter_id": matter_id,
              "custodians": len(custodians),
              "pending_ack": pending_ack,
          }}, ensure_ascii=True) + "::")

  # --- 2. apply the retention lock, best-effort ---
  - id: lock_scope_bucket
    type: io.kestra.plugin.core.http.Request
    description: Best-effort PUT that applies the retention lock to the matter's scope bucket, where a rejected or unreachable call widens the escalation instead of failing the run.
    method: PUT
    uri: "{{ inputs.storage_endpoint }}/{{ trigger.body.scope ?? 'unscoped' }}"
    headers:
      Authorization: "Bearer {{ secret('STORAGE_ADMIN_TOKEN') }}"
      Content-Type: "application/json"
    body: |
      {"matter_id": "{{ trigger.body.matter_id ?? 'unknown' }}", "hold_until": "{{ trigger.body.hold_until ?? 'unknown' }}", "mode": "governance"}
    allowFailure: true
    retry:
      type: exponential
      interval: PT2S
      maxAttempts: 2

  # --- 3. the gap gate ---
  - id: escalation_gate
    type: io.kestra.plugin.core.flow.If
    description: Escalates whenever at least one custodian still owes an acknowledgement or the retention lock did not return success, otherwise records the hold as secured.
    condition: >-
      {{ (outputs.validate_hold.vars.pending_ack | length) > 0
         or (outputs.lock_scope_bucket.code is not defined)
         or (outputs.lock_scope_bucket.code != 200 and outputs.lock_scope_bucket.code != 204) }}
    then:
      - id: open_hold_gap_issue
        type: io.kestra.plugin.github.issues.Create
        description: Opens one tracking issue listing the pending custodians and the lock outcome, so the chase leaves a backlog record counsel can audit.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "Legal hold {{ outputs.validate_hold.vars.matter_id }} needs attention - {{ outputs.validate_hold.vars.pending_ack | length }} acknowledgement(s) pending"
        body: |
          ## Legal hold follow-up

          Matter **{{ outputs.validate_hold.vars.matter_id }}** scoped on
          `{{ trigger.body.scope ?? 'unscoped' }}` carries a hold until
          `{{ trigger.body.hold_until ?? 'unknown date' }}`.

          - Verdict: {{ outputs.validate_hold.vars.verdict }}
          - Custodians on notice: {{ outputs.validate_hold.vars.custodians }}
          - Pending acknowledgements: {{ outputs.validate_hold.vars.pending_ack | length }}
          - Pending custodians: {% if outputs.validate_hold.vars.pending_ack | length > 0 %}{{ outputs.validate_hold.vars.pending_ack | join(', ') }}{% else %}none, the retention lock is the open item{% endif %}
          - Retention lock HTTP status: {{ outputs.lock_scope_bucket.code ?? 'no response' }}

          Execution: {{ execution.id }}

          Chase each pending custodian, re-apply the retention lock if it failed, and close this issue once the matter reads fully acknowledged with a live lock.
        labels:
          - legal-hold
          - compliance

      - id: notify_legal_ops
        type: io.kestra.plugin.email.MailSend
        description: Emails the legal operations mailbox that the hold has a gap, naming the matter, the pending custodians and the lock status.
        from: "{{ secret('SMTP_FROM') }}"
        to: "{{ inputs.legal_ops_email }}"
        host: "{{ secret('SMTP_HOST') }}"
        username: "{{ secret('SMTP_USERNAME') }}"
        password: "{{ secret('SMTP_PASSWORD') }}"
        port: 465
        subject: "Legal hold {{ outputs.validate_hold.vars.matter_id }} - {{ outputs.validate_hold.vars.pending_ack | length }} custodian acknowledgement(s) pending"
        htmlTextContent: |
          <p>Legal operations,</p>
          <p>Matter <strong>{{ outputs.validate_hold.vars.matter_id }}</strong> was issued a hold scoped on <strong>{{ trigger.body.scope ?? 'an unscoped bucket' }}</strong> running until <strong>{{ trigger.body.hold_until ?? 'an unknown date' }}</strong>.</p>
          <p>Custodians on notice: {{ outputs.validate_hold.vars.custodians }}. Still missing an acknowledgement: {% if outputs.validate_hold.vars.pending_ack | length > 0 %}{{ outputs.validate_hold.vars.pending_ack | join(', ') }}{% else %}none, the retention lock is the open item{% endif %}.</p>
          <p>Retention lock returned HTTP {{ outputs.lock_scope_bucket.code ?? 'no response' }}.</p>
          <p>Execution {{ execution.id }}</p>

      - id: alert_slack
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Posts the hold gap summary so counsel sees the pending acknowledgements and the lock status at once.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "LEGAL HOLD GAP: matter {{ outputs.validate_hold.vars.matter_id }} ({{ outputs.validate_hold.vars.custodians }} custodians, verdict {{ outputs.validate_hold.vars.verdict }}) has {{ outputs.validate_hold.vars.pending_ack | length }} pending acknowledgement(s){% if outputs.validate_hold.vars.pending_ack | length > 0 %}: {{ outputs.validate_hold.vars.pending_ack | join(', ') }}{% endif %}. Retention lock HTTP {{ outputs.lock_scope_bucket.code ?? 'no response' }}. Execution {{ execution.id }}."}

      - id: chase_pending_custodians
        type: io.kestra.plugin.core.flow.Loop
        description: Walks the pending custodians one by one so each person is chased about their own missing acknowledgement instead of a generic list.
        values: "{{ outputs.validate_hold.vars.pending_ack }}"
        concurrencyLimit: 1
        tasks:
          - id: send_ack_request
            type: io.kestra.plugin.email.MailSend
            description: Asks a single custodian to acknowledge the legal hold, naming the matter and the hold_until date.
            from: "{{ secret('SMTP_FROM') }}"
            to: "{{ item.value }}"
            host: "{{ secret('SMTP_HOST') }}"
            username: "{{ secret('SMTP_USERNAME') }}"
            password: "{{ secret('SMTP_PASSWORD') }}"
            port: 465
            subject: "Action required - acknowledge legal hold {{ outputs.validate_hold.vars.matter_id }}"
            htmlTextContent: |
              <p>{{ item.value }},</p>
              <p>You are named as a custodian on legal hold <strong>{{ outputs.validate_hold.vars.matter_id }}</strong>, which runs until <strong>{{ trigger.body.hold_until ?? 'the stated hold_until date' }}</strong>. The acknowledgement register shows no sign-off from you yet.</p>
              <p>Acknowledge the hold with your legal contact so the matter can be marked fully acknowledged.</p>
              <p>Execution {{ execution.id }}</p>
    else:
      - id: log_hold_secured
        type: io.kestra.plugin.core.log.Log
        description: Records the clean outcome, where every custodian has acknowledged and the retention lock succeeded.
        message: "Legal hold {{ outputs.validate_hold.vars.matter_id }} is secured - verdict {{ outputs.validate_hold.vars.verdict }}, {{ outputs.validate_hold.vars.custodians }} custodians acknowledged, retention lock HTTP {{ outputs.lock_scope_bucket.code }}."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.validate_hold.vars.verdict }}"
  - id: matter_id
    type: STRING
    value: "{{ outputs.validate_hold.vars.matter_id }}"
  - id: custodians
    type: INT
    value: "{{ outputs.validate_hold.vars.custodians }}"
  - id: pending_ack
    type: ARRAY
    value: "{{ outputs.validate_hold.vars.pending_ack | toJson }}"

extend:
  title: Lock the scope bucket and chase custodian acknowledgements when a legal hold lands
  metaTitle: Lock Buckets and Chase Custodian Acknowledgements for Legal Holds
  shortDescription: Validate an issued legal hold, lock the scope bucket, email every custodian still missing an acknowledgement and escalate to GitHub, legal ops and Slack.
  metaDescription: On a legal hold notice, validate the payload, lock the scope bucket, email custodians missing acknowledgement and escalate to GitHub, legal ops and Slack.
  description: |
    Legal holds decay quietly. A matter is opened, the scope bucket is supposed to be locked, custodians are supposed to sign an acknowledgement, and weeks later nobody can prove either happened. This flow fires the moment counsel's tool posts the hold notice, validates the notice, computes how many days remain until hold_until, checks the acknowledgement register for custodians who never signed off and applies the retention lock to the scope bucket as a best-effort PUT. Pending acknowledgements or a failed lock open a GitHub tracking issue, email legal ops, alert Slack and send one ack-request email per pending custodian; a fully acknowledged hold with a live lock is logged as secured.

    ## How it works

    1. `legal_hold_issued` (`io.kestra.plugin.core.trigger.Webhook`) receives the hold notice with `matter_id`, `custodians`, `scope` and `hold_until`. `weekly_compliance_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * 1`) sits disabled as the net to switch on for a Monday morning re-check of open holds.
    2. `workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared directory for the register fixture and the validator that consumes it.
    3. `write_hold_register` (`io.kestra.plugin.scripts.shell.Commands`) drops `holds.json` from a heredoc of five rows across two matters, mixing acknowledged and pending custodians so the fixture always holds a gap to find.
    4. `validate_hold` (`io.kestra.plugin.scripts.python.Script`) parses the webhook payload from `HOLD_PAYLOAD`, requires `matter_id`, `scope`, a non-empty `custodians` list and a parseable `hold_until`, computes `days_left` against today, filters the register rows for the matter and collects every custodian without an acknowledged sign-off. It prints one `::{"outputs": ...}::` line carrying `verdict` (`INVALID_PAYLOAD`, `ACKS_PENDING` or `HOLD_ACTIVE`), `matter_id`, `custodians` and `pending_ack`.
    5. `lock_scope_bucket` (`io.kestra.plugin.core.http.Request`) sends a best-effort `PUT` with the `STORAGE_ADMIN_TOKEN` bearer header to `{{ inputs.storage_endpoint }}/<scope>`, asking the storage layer to govern the bucket until `hold_until`. `allowFailure: true` keeps a rejection or timeout from killing the run - it only widens the gate.
    6. `escalation_gate` (`io.kestra.plugin.core.flow.If`) branches when `pending_ack` is non-empty or the lock did not return 200/204. In the escalation branch `open_hold_gap_issue` (`io.kestra.plugin.github.issues.Create`) files one labeled tracking issue, `notify_legal_ops` (`io.kestra.plugin.email.MailSend`) emails the legal ops mailbox, `alert_slack` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts the gap summary, and `chase_pending_custodians` (`io.kestra.plugin.core.flow.Loop`) runs `send_ack_request` (`io.kestra.plugin.email.MailSend`) once per pending custodian. The quiet branch records the secured hold with `log_hold_secured` (`io.kestra.plugin.core.log.Log`).
    7. The `errors` handler pings Slack when the run itself breaks, because a silent failure looks exactly like a hold nobody processed.

    ## What you get

    - `verdict` (STRING): `ACKS_PENDING` when the payload is valid but custodians still owe an acknowledgement, `HOLD_ACTIVE` when every named custodian has acknowledged, `INVALID_PAYLOAD` when the notice is missing `matter_id`, `scope`, a custodian list or a parseable `hold_until`.
    - `matter_id` (STRING): the legal matter the verdict belongs to, echoed back for dashboards and audits.
    - `custodians` (INT): distinct custodians named on the hold notice.
    - `pending_ack` (ARRAY): the custodian addresses with no acknowledged sign-off for this matter, empty when the hold is fully acknowledged.
    - One ack-request email per pending custodian, one GitHub tracking issue, one legal ops email and one Slack summary when the gate fires, and a log line only when it does not.

    ## Who it's for

    - Legal operations and eDiscovery teams who issue holds and need provable acknowledgement plus a locked retention scope before the deadline.
    - Compliance officers who want the storage lock and the acknowledgement chase automated from the notice instead of a spreadsheet.
    - Platform teams supporting counsel with a webhook-driven, auditable pipeline that leaves a paper trail through email, GitHub and Slack.

    ## Why orchestrate this with Kestra

    A hold notice landing in an inbox only works when somebody acts on it that day. Kestra supplies the intake webhook and the disabled weekly schedule, the validation step that separates a usable notice from a broken one, the best-effort lock whose failure still routes correctly, and the loop that turns one notice into one email per pending custodian. The verdict, matter id, custodian count and pending list are typed outputs, so a matter dashboard can read hold state without scraping logs, and the `errors` handler keeps a broken run visible.

    ## Prerequisites

    - A Kestra instance with the email, GitHub and Slack plugins available to the worker.
    - An object storage admin API that accepts a governance PUT on a bucket path and issues a bearer token for it.
    - An SMTP relay reachable from the worker, with a sender address allowed to use it.
    - A GitHub personal access token able to open issues in the compliance repository.
    - A Slack incoming webhook for the gap summary and for failure alerts.
    - An acknowledgement register shaped as `holds.json` with `register` rows of `matter_id`, `custodian` and `acknowledged`, supplied through the heredoc fixture or replaced with an export task.

    ### Secrets

    - `LEGAL_HOLD_WEBHOOK_KEY`: key segment guarding the webhook URL, so only the eDiscovery tool can issue a hold.
    - `STORAGE_ADMIN_TOKEN`: bearer token sent to the retention API by `lock_scope_bucket`.
    - `SMTP_FROM`, `SMTP_HOST`, `SMTP_USERNAME`, `SMTP_PASSWORD`: SMTP relay and credentials used by `notify_legal_ops` and `send_ack_request`.
    - `GITHUB_TOKEN`: token used by `open_hold_gap_issue` to file the tracking issue.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the gap summary and for failure alerts.

    ## Quick start

    1. Add the eight secrets to your namespace and import the flow.
    2. Point `storage_endpoint` at your retention API, `github_repository` at the repo that should receive hold issues, and `legal_ops_email` at the legal operations mailbox.
    3. Execute the flow once against the fixture and read `verdict`, `matter_id`, `custodians` and `pending_ack` in the outputs.
    4. Point the eDiscovery tool at `/api/v1/{tenant}/executions/webhook/{namespace}/legal-hold-notice/LEGAL_HOLD_WEBHOOK_KEY`, posting `matter_id`, `custodians`, `scope` and `hold_until`, then confirm the lock PUT, the tracking issue, the legal ops email, the Slack summary and one ack-request per pending custodian.
    5. Switch on `weekly_compliance_sweep` when you want open holds re-checked every Monday morning.

    ## How to extend

    - Replace the heredoc register with an export from the matter management system, or a `jdbc` query against the holds database, and keep the same python verdict.
    - Add a second gate on `days_left` from the validator log to page counsel directly when the hold deadline is inside a week.
    - Send the ack-request emails through a different relay or an e-signature provider by swapping `send_ack_request` while keeping the loop values.
    - Feed `verdict` into a matter dashboard flow so an unacknowledged hold is visible on a wall board.

    ## Links

    - [Email MailSend task](https://kestra.io/plugins/plugin-email/io.kestra.plugin.email.mailsend)
    - [GitHub issues Create task](https://kestra.io/plugins/plugin-github/io.kestra.plugin.github.issues.create)
    - [HTTP Request task](https://kestra.io/plugins/plugin-core/core.http.request)
    - [Loop task documentation](https://kestra.io/docs/workflow-components/tasks/flow-control/loop)
  tags:
    - Business
  subTags:
    - legal-hold
    - compliance
    - retention
    - notifications
    - webhooks
  ee: false
  demo: false
