id: redis-slowlog-latency-sentinel
namespace: company.dataops

inputs:
  - id: redis_host
    type: STRING
    defaults: redis.internal
    description: Hostname of the Redis instance.
  - id: redis_port
    type: INT
    defaults: 6379
    description: TCP port of the Redis instance.
  - id: max_execution_time_microseconds
    type: INT
    defaults: 50000
    description: Maximum permissible command execution duration in microseconds before alerting (default 50ms).

tasks:
  - id: inspect_slowlog
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install redis kestra
    env:
      REDIS_HOST: "{{ inputs.redis_host }}"
      REDIS_PORT: "{{ inputs.redis_port }}"
      REDIS_PASSWORD: "{{ secret('REDIS_PASSWORD') }}"
      MAX_EXEC_TIME_US: "{{ inputs.max_execution_time_microseconds }}"
    script: |
      import os
      import sys
      import redis
      from kestra import Kestra

      host = os.environ.get("REDIS_HOST", "redis.internal")
      port = int(os.environ.get("REDIS_PORT", "6379"))
      password = os.environ.get("REDIS_PASSWORD") or None
      threshold_us = int(os.environ.get("MAX_EXEC_TIME_US", "50000"))

      try:
          r = redis.Redis(host=host, port=port, password=password, socket_connect_timeout=10, socket_timeout=10)
          entries = r.slowlog_get(10)
      except Exception as e:
          print(f"Error querying Redis slowlog at {host}:{port}: {e}", file=sys.stderr)
          sys.exit(1)

      slow_entries = []
      for entry in entries:
          duration_us = entry.get("duration", 0)
          if duration_us >= threshold_us:
              slow_entries.append(entry)

      count = len(slow_entries)
      alert_triggered = count > 0

      print(f"Redis slow queries: count={count}, alert={alert_triggered}")
      Kestra.outputs({
          "slow_commands_count": count,
          "alert_triggered": alert_triggered
      })

  - id: evaluate_slow_queries
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_slowlog.vars.alert_triggered }}"
    then:
      - id: alert_app_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *Redis Slow Query Alert*: Detected {{ outputs.inspect_slowlog.vars.slow_commands_count }} commands exceeding {{ inputs.max_execution_time_microseconds }}us on {{ inputs.redis_host }}. Review application query patterns to prevent blocking the Redis event loop."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Redis Sentinel Execution Failure*: Failed to retrieve slowlog from {{ inputs.redis_host }}."
      }

triggers:
  - id: scheduled_slowlog_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

outputs:
  - id: slow_commands_count
    type: INT
    value: "{{ outputs.inspect_slowlog.vars.slow_commands_count }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.inspect_slowlog.vars.alert_triggered }}"

extend:
  metaDescription: "Audits Redis slowlog entries to identify long-running, blocking commands that freeze the single-threaded event loop."
  metaTitle: Redis Slowlog Query Latency and Execution Time Sentinel with Kestra
  title: Redis Slowlog Query Latency and Execution Time Sentinel
  shortDescription: Audits Redis slowlog entries to identify long-running, blocking commands that freeze the single-threaded event loop.
  description: |
    ## How it works
    This sentinel connects to Redis using `redis-cli` and queries `SLOWLOG GET` to inspect recent command execution times. It isolates commands whose execution duration exceeds configured latency budgets, warning developers against calling heavy operations like `KEYS *`, unindexed `SMEMBERS`, or large `HGETALL` lookups.

    ## What you get
    - Real-time detection of expensive blocking commands in application code.
    - Early prevention of thread lockups and cascading connection timeouts.
    - Automated Slack incident delivery detailing slow command names and execution times in milliseconds.

    ## Who it's for
    - Backend application developers and software architects designing Redis caching patterns.
    - SREs troubleshooting intermittent Redis response latency spikes.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled database health checks with fine-grained error management and notification routing.

    ## Prerequisites
    - Redis server access on configured port.
    - Secrets `REDIS_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure host, port, and credentials.
    3. Run manually to check current slowlog entries.

    ## How to extend
    - Automatically reset slowlog via `SLOWLOG RESET` after audit recording.
    - Correlate slow commands with client IP addresses from `CLIENT LIST`.
    - Forward slow query logs to Elasticsearch or BigQuery for historical analysis.

    ## Links
    - [Redis Slowlog Documentation](https://redis.io/commands/slowlog/)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
