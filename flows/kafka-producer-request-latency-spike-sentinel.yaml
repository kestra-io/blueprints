id: kafka-producer-request-latency-spike-sentinel
namespace: company.data

inputs:
  - id: kafka_broker_host
    type: STRING
    defaults: "kafka-0.internal"
    description: Apache Kafka broker hostname or IP address.
  - id: kafka_jmx_exporter_port
    type: INT
    defaults: 9404
    description: Prometheus JMX Exporter port exposing Kafka broker metrics.
  - id: latency_p99_threshold_ms
    type: INT
    defaults: 250
    description: Maximum acceptable 99th percentile produce request latency in milliseconds.

tasks:
  - id: scrape_produce_latency_metrics
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    script: |
      import sys
      import requests
      from kestra import Kestra

      url = f"http://{{ inputs.kafka_broker_host }}:{{ inputs.kafka_jmx_exporter_port }}/metrics"
      print(f"Scraping produce request latency metrics from {url}...")
      try:
          resp = requests.get(url, timeout=15)
          resp.raise_for_status()
      except Exception as e:
          print(f"ERROR: Failed to scrape Prometheus metrics from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      p99_latency = None
      for line in resp.text.splitlines():
          line = line.strip()
          if not line or line.startswith('#'):
              continue
          if 'kafka_network_requestmetrics_totaltimems' in line and 'request="Produce"' in line and 'quantile="0.99"' in line:
              parts = line.split()
              if len(parts) >= 2:
                  try:
                      p99_latency = float(parts[-1])
                      break
                  except ValueError:
                      pass

      if p99_latency is None:
          print(f"ERROR: Produce p99 latency metric not found in {url}", file=sys.stderr)
          sys.exit(1)

      print(f"Scraped Produce p99 latency: {p99_latency} ms")
      Kestra.outputs({"p99_latency_ms": p99_latency})

  - id: evaluate_produce_latency
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scrape_produce_latency_metrics.vars.p99_latency_ms | float > inputs.latency_p99_threshold_ms }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#kafka-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kafka Producer Request Latency Spike Alert",
                "text": "Kafka broker `{{ inputs.kafka_broker_host }}` recorded a Produce request p99 latency spike of *{{ outputs.scrape_produce_latency_metrics.vars.p99_latency_ms }}ms* (Threshold: {{ inputs.latency_p99_threshold_ms }}ms). Impact: Upstream producers are experiencing write timeouts, thread starvation, and buffer exhaustion.",
                "footer": "Kestra Streaming Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#kafka-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Kafka Producer Request Latency Spike Sentinel Pipeline Failure",
            "text": "Failed to scrape Kafka broker produce latency metrics. Please check network routes and exporter health.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: p99_latency_ms
    type: FLOAT
    description: 99th percentile produce request latency in milliseconds.
    value: "{{ outputs.scrape_produce_latency_metrics.vars.p99_latency_ms }}"

extend:
  metaDescription: "Monitors Apache Kafka broker produce request latency metrics to detect storage bottlenecks and ingestion delays."
  metaTitle: Apache Kafka Producer Request Latency Spike Sentinel with Kestra
  title: Apache Kafka Producer Request Latency Spike Sentinel
  shortDescription: Monitors Apache Kafka broker produce request latency metrics to detect storage bottlenecks and ingestion delays.
  description: |
    ## How it works
    This workflow scrapes the broker's Prometheus JMX endpoint for `kafka_network_requestmetrics_totaltimems` with label `request="Produce"` and quantile `0.99`. Produce request latency measures the total time from when a produce request is received until acknowledgment is sent back to the producer. When disk I/O bottlenecks or ISR replication delays spike latency above the threshold, Slack is notified immediately.

    ## What you get
    - Real-time detection of produce request latency degradation across Kafka brokers.
    - Prevents producer buffer pool exhaustion and upstream application backpressure.
    - High-resolution p99 latency metrics delivered directly to alerting channels.

    ## Who it's for
    - Streaming Platform Architects and SREs managing high-throughput Kafka deployments.
    - Application teams building latency-sensitive microservices publishing to Kafka.

    ## Why orchestrate this with Kestra
    - **Native Metric Scraping**: Efficiently ingest and evaluate Prometheus metrics within Kestra.
    - **Configurable SLA Guardrails**: Tune latency thresholds per cluster and environment.
    - **Automated Root-Cause Correlation**: Trigger diagnostic flows to identify slow disks or lagging followers.

    ## Prerequisites
    - Kafka broker exposing JMX request metrics via Prometheus exporter.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure broker host and JMX port.
    3. Run the workflow to inspect produce request latency.

    ## How to extend
    - Monitor FetchConsumer and FetchFollower request latency quantiles.
    - Correlate with OS-level disk await times using node_exporter.

    ## Links
    - [Apache Kafka Monitoring Documentation](https://kafka.apache.org/documentation/#monitoring)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - ELT & Data Landing
  ee: false
  demo: false
