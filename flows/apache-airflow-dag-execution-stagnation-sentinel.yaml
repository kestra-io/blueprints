id: apache-airflow-dag-execution-stagnation-sentinel
namespace: company.orchestration

inputs:
  - id: airflow_url
    type: STRING
    defaults: "http://airflow.internal:8080"
    description: Base URL of Apache Airflow webserver / REST API.
  - id: max_queued_runs
    type: INT
    defaults: 15
    description: "Maximum allowable queued DAG runs before alerting (default 15)."

tasks:
  - id: inspect_dag_runs
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Airflow REST API for queued DAG runs
        curl -s -u "{{ inputs.airflow_user }}:{{ secret('AIRFLOW_PASSWORD') }}"           "{{ inputs.airflow_url }}/api/v1/dags/~/dagRuns?state=queued" > /tmp/airflow_telemetry.json
        
        QUEUED_COUNT=$(jq '.total_entries // 0' /tmp/airflow_telemetry.json)
        echo "::set-output name=queued_count::$QUEUED_COUNT::"

  - id: evaluate_scheduling_stagnation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_dag_runs.vars.queued_count | int > inputs.max_queued_runs }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#orchestration-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Apache Airflow Scheduler Stagnation Alert",
                "text": "Airflow instance at `{{ inputs.airflow_url }}` has *{{ outputs.inspect_dag_runs.vars.queued_count }} queued DAG runs*! Airflow scheduler has hung, Celery/Kubernetes executor worker slots are exhausted, or database connection pool starvation is delaying task scheduling.",
                "footer": "Kestra Orchestration Sentinel • Apache Airflow"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#orchestration-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Airflow Sentinel Failure",
            "text": "Failed to query Airflow REST API. Verify airflow credentials and URL.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Apache Airflow DAG Run Queued Stagnation and Scheduler Lag Sentinel
  shortDescription: Audits Apache Airflow REST API for stalled queued DAG runs and scheduler heartbeats to prevent pipeline delays.
  description: |
    ## How it works
    This workflow queries the Apache Airflow Stable REST API (`/api/v1/dags/~/dagRuns?state=queued`) to monitor the total volume of DAG runs stuck in the `queued` state. In Apache Airflow, when scheduler processes crash, experience database deadlock contention, or when worker slots (Celery, KubernetesExecutor) are exhausted by long-running sensor tasks, DAG runs pile up in the queue without transitioning to `running`. This workflow tracks queued runs and alerts data engineering teams before batch SLA breaches occur.

    ## What you get
    - Real-time detection of scheduler deadlocks and worker starvation in Apache Airflow.
    - Prevents cascading ETL pipeline delays across data warehouse and BI jobs.
    - Quantitative tracking of queued DAG runs across the entire Airflow instance.

    ## Who it's for
    - Data Platform Engineers and Airflow Administrators.
    - Analytics Engineers responsible for timely pipeline execution.

    ## Why orchestrate this with Kestra
    - **Cross-Orchestrator Governance**: Monitor legacy Airflow pipelines from a modern, reliable Kestra control plane.
    - **Decoupled Architecture**: Scrapes Airflow REST endpoints without dependencies on internal Airflow workers.
    - **Instant Team Escalation**: Delivers structured notifications with queued run counts directly to Slack.

    ## Prerequisites
    - Apache Airflow (v2.0+) instance with REST API enabled.
    - Secrets `AIRFLOW_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Airflow URL, user, and queued threshold.
    3. Run the workflow to inspect queued DAG runs.

    ## How to extend
    - Query `/api/v1/health` to verify Airflow scheduler heartbeat timestamp.
    - Automatically trigger a scheduler container restart via Kubernetes API if queued runs persist.

    ## Links
    - [Apache Airflow REST API Documentation](https://airflow.apache.org/docs/apache-airflow/stable/stable-rest-api-ref.html)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
