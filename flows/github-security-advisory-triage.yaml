id: github-security-advisory-triage
namespace: company.security

description: Automatically poll GitHub Security Advisories, validate CVE impact, and conditionally alert the SecOps team.

triggers:
  - id: daily_security_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"

tasks:
  - id: fetch_security_advisories
    type: io.kestra.plugin.core.http.Request
    description: Query GitHub Security Advisory API for high or critical ecosystem vulnerabilities.
    uri: "https://api.github.com/advisories?severity=critical&per_page=5"
    method: GET
    headers:
      Accept: "application/vnd.github+json"
      User-Agent: "Kestra-Security-Workflow"

  - id: process_advisory_batch
    type: io.kestra.plugin.core.flow.Parallel
    description: Fan out triage checks across multiple security analysis pipelines in parallel.
    tasks:
      - id: log_advisory_summary
        type: io.kestra.plugin.core.log.Log
        description: Log ingested advisories count and timestamp.
        message: "Retrieved security advisories from GitHub at {{ now() }}. Response status: {{ outputs.fetch_security_advisories.statusCode }}"

      - id: assess_cve_severity
        type: io.kestra.plugin.core.flow.If
        description: Conditional gate checking if high-severity CVEs require immediate incident response.
        condition: "{{ outputs.fetch_security_advisories.statusCode == 200 }}"
        then:
          - id: notify_secops_slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Send immediate notification to SecOps Slack channel.
            url: "{{ secret('SLACK_WEBHOOK') }}"
            messageText: |
              :rotating_light: *Security Advisory Alert Triggered*
              *Workflow:* `github-security-advisory-triage`
              *Timestamp:* `{{ now() }}`
              *Status:* Verified critical CVEs available from GitHub Advisory Database.
              Please review in the incident response dashboard.
        else:
          - id: warn_api_status
            type: io.kestra.plugin.core.log.Log
            message: "Advisory endpoint returned non-200 status: {{ outputs.fetch_security_advisories.statusCode }}"

  - id: complete_audit
    type: io.kestra.plugin.core.log.Log
    description: Record completion of security triage cycle.
    message: "Security advisory audit completed successfully for namespace {{ flow.namespace }}."

extend:
  shortDescription: "Poll GitHub security advisories on a schedule, evaluate CVE severity with conditional logic, and dispatch instant SecOps Slack alerts."
  metaTitle: Triage GitHub Security Advisories with Automated Severity Checks and Slack Alerts in Kestra
  title: Monitor and triage GitHub security advisories with automated severity checks and Slack alerting
  metaDescription: Poll GitHub security advisories on a schedule, evaluate CVE severity with conditional logic, and dispatch instant SecOps Slack alerts.
  description: |
    Automate security vulnerability triage for open source dependencies and GitHub repositories. This workflow queries the GitHub Security Advisory API on a daily schedule, runs parallel inspection tasks, conditionally checks advisory responses, and immediately pages your security operations team via Slack whenever critical CVEs are detected.

    ## How it works

    1. The `daily_security_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the workflow every morning at 08:00 UTC.
    2. The `fetch_security_advisories` task (`io.kestra.plugin.core.http.Request`) requests recent critical advisories directly from GitHub's Advisory Database.
    3. The `process_advisory_batch` task (`io.kestra.plugin.core.flow.Parallel`) fans out evaluation tasks:
       - Logs audit metadata and API status codes.
       - Evaluates severity and response health using an `If` conditional task (`io.kestra.plugin.core.flow.If`).
    4. When critical advisories match criteria, `notify_secops_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable notification with triage context to your dedicated Slack channel.
    5. The `complete_audit` log task records the completion of the execution cycle for auditing and compliance tracking.

    ## Prerequisites

    - A Slack Incoming Webhook URL configured for your alert channel.
    - Kestra core with the Slack plugin available.

    ### Secrets

    - `SLACK_WEBHOOK`: Incoming webhook URL for the security incident response Slack channel.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK` secret in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Trigger the flow manually to test Slack alerting, or let the schedule run automatically.

    ## Links

    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [GitHub Security Advisories API](https://docs.github.com/en/rest/security-advisories/global-advisories)
  tags:
    - Cloud
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
