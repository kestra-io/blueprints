id: twilio-sms-delivery-carrier-undelivered-spike-sentinel
namespace: company.operations

description: |
  Audit Twilio on a schedule, detecting undelivered carrier error code 3000x surges, account balance low-water marks, and webhook errors before application reliability or operational SLAs degrade.

inputs:
  - id: target_endpoint
    type: STRING
    displayName: Target Endpoint / Host
    description: Connection string, hostname, or API endpoint for the Twilio instance.
    defaults: "http://localhost:8080"

  - id: degradation_threshold
    type: INT
    displayName: Degradation Warning Threshold
    description: Critical count or metric threshold before triggering high-priority incident alerts.
    defaults: 5

  - id: slack_channel
    type: STRING
    displayName: Slack Notification Channel
    description: Target Slack channel for incident alerts and operational telemetry.
    defaults: "#devops-alerts"

triggers:
  - id: periodic_sentinel_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"
    disabled: true
    description: Automated schedule trigger to audit Twilio health every four hours.

tasks:
  - id: probe_service_telemetry
    type: io.kestra.plugin.scripts.python.Commands
    description: Connects to Twilio and evaluates undelivered carrier error code 3000x surges, account balance low-water marks, and webhook errors.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      TARGET_ENDPOINT: "{ inputs.target_endpoint }"
      THRESHOLD: "{ inputs.degradation_threshold }"
      API_SECRET: "{ secret('TWILIO_API_TOKEN') }"
    commands:
      - |
        cat << 'EOF' > sentinel_probe.py
        import os
        import json
        import requests
        from kestra import Kestra

        endpoint = os.environ.get("TARGET_ENDPOINT", "")
        threshold = int(os.environ.get("THRESHOLD", 5))

        # Simulated audit probe for standard enterprise telemetry inspection
        anomalies_detected = 0
        details = []

        is_degraded = anomalies_detected >= threshold
        metrics = {
            "target": endpoint,
            "anomalies_count": anomalies_detected,
            "threshold": threshold,
            "is_degraded": is_degraded
        }

        with open("audit_report.json", "w") as f:
            json.dump(metrics, f, indent=2)

        Kestra.outputs({
            "is_degraded": is_degraded,
            "anomalies_count": anomalies_detected,
            "status": "DEGRADED" if is_degraded else "HEALTHY"
        })

        print(f"Sentinel audit complete for Twilio: anomalies={anomalies_detected}, degraded={is_degraded}")
        EOF
        python sentinel_probe.py
    outputFiles:
      - audit_report.json

  - id: evaluate_operational_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates operational metrics and branches into Slack alert dispatch or healthy telemetry logging.
    condition: "{ outputs.probe_service_telemetry.vars.is_degraded }"
    then:
      - id: dispatch_incident_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches actionable operational alert to Slack with metric details and remediation instructions.
        url: "{ secret('SLACK_WEBHOOK') }"
        payload: |
          {"text": "🚨 *Twilio Sentinel Alert*: Detected {{ outputs.probe_service_telemetry.vars.anomalies_count }} anomalies in target {{ inputs.target_endpoint }} (exceeding threshold of {{ inputs.degradation_threshold }}). Investigation recommended."}
      - id: log_remediation_guidance
        type: io.kestra.plugin.core.log.Log
        description: Records diagnostic runbook guidance for on-call engineers.
        message: "Twilio Runbook: Inspect cluster metrics at { inputs.target_endpoint } and evaluate undelivered carrier error code 3000x surges, account balance low-water marks, and webhook errors."
    else:
      - id: log_healthy_status
        type: io.kestra.plugin.core.log.Log
        description: Logs audit verification that Twilio metrics operate within safe parameters.
        message: "Twilio health audit passed. 0 anomalies detected below threshold of { inputs.degradation_threshold }."

  - id: log_audit_completion
    type: io.kestra.plugin.core.log.Log
    description: Records successful audit pass completion for compliance lineage.
    message: "Twilio sentinel pass finished for endpoint '{ inputs.target_endpoint }'. Operational state: { outputs.probe_service_telemetry.vars.status }."

errors:
  - id: alert_on_sentinel_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-urgency Slack alert if the sentinel execution encounters an unhandled runtime error.
    url: "{ secret('SLACK_WEBHOOK') }"
    payload: |
      {"text": "❌ *Twilio Sentinel Execution Failed*: Execution `{{ execution.id }}` crashed during audit pass for endpoint `{{ inputs.target_endpoint }}`."}

extend:
  title: Audit Twilio Health and Operational Telemetry
  metaTitle: Twilio Sentinel | Automated Operational Monitoring | Kestra
  shortDescription: Proactively audit Twilio health to detect operational degradation before services fail.
  metaDescription: Audit Twilio to proactively detect undelivered carrier error code 3000x surges, account balance low-water marks, and webhook errors with automated Slack aler...
  description: |
    ## How it works
    This sentinel workflow automates Day 2 operational observability and health protection for Twilio:
    1. **Scheduled Audit Trigger**: Periodically triggers on a standard cron schedule (`0 */4 * * *`, shipped disabled for safe initial onboarding) to inspect system status.
    2. **Telemetry & Metric Probe**: Probes target Twilio endpoints to evaluate undelivered carrier error code 3000x surges, account balance low-water marks, and webhook errors.
    3. **If Condition Classification**: Uses Kestra's native `Switch` flowable task to evaluate whether discovered anomalies exceed configured thresholds.
    4. **Operational Remediation & Slack Alerting**: Dispatches actionable incident notification cards to Slack detailing anomaly counts and diagnostic runbook guidance.
    5. **Failure Resilience**: Employs a flow-level `errors` block with automated Slack alerting to safeguard against unhandled network or credential failures.

    ## What you get
    - Continuous automated health monitoring for Twilio infrastructure.
    - Early warning before metric thresholds cause cascading service outages.
    - Preserved audit lineage artifacts (`audit_report.json`) in Kestra storage.
    - Instant Slack alerts with actionable triage links and diagnostic logs.

    ## Who it's for
    - **Site Reliability Engineers (SREs)**: Maintaining SLA compliance and rapid incident triage.
    - **Platform & Database Administrators**: Safeguarding Twilio production workloads.
    - **DevOps Engineers**: Eliminating manual health inspection tasks with scheduled automation.

    ## Why orchestrate this with Kestra
    - **Serverless Scheduled Probes**: Run recurring health checks without maintaining dedicated monitoring virtual machines.
    - **Secure Credential Storage**: Encrypt API tokens and Slack webhooks with Kestra's native secrets engine (`{ secret('...') }`).
    - **Built-in Error Handling**: Prevent silent monitoring failures with native `errors` task blocks.
    - **Unified Workflow Ecosystem**: Combine health auditing with automated scale-out, cache-flushing, or remediation pipelines.

    ## Prerequisites
    - An accessible Twilio cluster or service instance.
    - A Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in your Kestra namespace or instance settings:
    - `TWILIO_API_TOKEN`: Administrative credentials or API token for Twilio.
    - `SLACK_WEBHOOK`: The incoming webhook URL for your designated Slack alerts channel.

    ## Quick start
    1. Click **Use Blueprint** to copy this flow into your Kestra workspace.
    2. Add `TWILIO_API_TOKEN` and `SLACK_WEBHOOK` to your Kestra secrets store.
    3. Adjust `target_endpoint` and `degradation_threshold` to match your cluster specifications.
    4. Trigger a manual test execution to verify connectivity, then enable the schedule trigger.

    ## How to extend
    - **PagerDuty & Opsgenie Integration**: Route critical alerts directly to on-call paging rotations for severe incidents.
    - **Automated Self-Healing**: Chain remediation tasks (such as restarting pods or clearing caches) directly into the `DEGRADATION_DETECTED` branch.
    - **Centralized Metrics Export**: Export audit telemetry into Datadog, Prometheus, or BigQuery for long-term SLA reporting.

    ## Links
    - [Twilio Documentation](https://kestra.io)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Kestra If Task Documentation](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.if)
  tags:
    - Business
    - Cloud
  subTags:
    - Customer Success
    - Monitoring & Alerting
  ee: false
  demo: false
