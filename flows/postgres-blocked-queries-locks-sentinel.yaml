id: postgres-blocked-queries-locks-sentinel
namespace: company.database

inputs:
  - id: db_host
    type: STRING
    defaults: "postgres.internal"
    description: PostgreSQL database server hostname or IP.
  - id: db_port
    type: INT
    defaults: 5432
    description: PostgreSQL server port.
  - id: db_name
    type: STRING
    defaults: "postgres"
    description: PostgreSQL database name.
  - id: db_user
    type: STRING
    defaults: "postgres"
    description: PostgreSQL administrative user.
  - id: blocked_count_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of blocked queries waiting on row/table locks.

tasks:
  - id: query_blocked_locks
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.db_host }}:{{ inputs.db_port }}/{{ inputs.db_name }}"
    username: "{{ inputs.db_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
          blocked_locks.pid AS blocked_pid,
          blocking_locks.pid AS blocking_pid,
          blocked_activity.usename AS blocked_user,
          blocking_activity.usename AS blocking_user,
          ROUND(EXTRACT(EPOCH FROM (now() - blocked_activity.query_start))) AS blocked_duration_sec,
          SUBSTRING(blocked_activity.query, 1, 100) AS blocked_query,
          SUBSTRING(blocking_activity.query, 1, 100) AS blocking_query
      FROM pg_catalog.pg_locks blocked_locks
      JOIN pg_catalog.pg_stat_activity blocked_activity ON blocked_activity.pid = blocked_locks.pid
      JOIN pg_catalog.pg_locks blocking_locks 
          ON blocking_locks.locktype = blocked_locks.locktype
          AND blocking_locks.database IS NOT DISTINCT FROM blocked_locks.database
          AND blocking_locks.relation IS NOT DISTINCT FROM blocked_locks.relation
          AND blocking_locks.page IS NOT DISTINCT FROM blocked_locks.page
          AND blocking_locks.tuple IS NOT DISTINCT FROM blocked_locks.tuple
          AND blocking_locks.virtualxid IS NOT DISTINCT FROM blocked_locks.virtualxid
          AND blocking_locks.transactionid IS NOT DISTINCT FROM blocked_locks.transactionid
          AND blocking_locks.classid IS NOT DISTINCT FROM blocked_locks.classid
          AND blocking_locks.objid IS NOT DISTINCT FROM blocked_locks.objid
          AND blocking_locks.objsubid IS NOT DISTINCT FROM blocked_locks.objsubid
          AND blocking_locks.pid != blocked_locks.pid
      JOIN pg_catalog.pg_stat_activity blocking_activity ON blocking_activity.pid = blocking_locks.pid
      WHERE NOT blocked_locks.granted
        AND EXTRACT(EPOCH FROM (now() - blocked_activity.query_start)) > 30;
    fetchType: FETCH

  - id: evaluate_lock_contention
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_blocked_locks.rows | length > inputs.blocked_count_threshold }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 PostgreSQL Active Lock Contention and Blocked Queries Alert",
                "text": "Detected *{{ outputs.query_blocked_locks.rows | length }}* query execution(s) blocked waiting on locks held by other sessions. Blocked queries: {{ outputs.query_blocked_locks.rows }}. Impact: Cascading database connection pool exhaustion and application request timeouts.",
                "footer": "Kestra Database Sentinel • Postgres Locks"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Postgres Blocked Locks Sentinel Execution Failed",
            "text": "The PostgreSQL lock contention query failed. Please verify database credentials and network reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: PostgreSQL Active Lock Contention and Blocked Queries Sentinel
  shortDescription: Audits PostgreSQL pg_locks and pg_stat_activity to detect queries blocked waiting on locks held by long-running transactions.
  description: |
    ## How it works
    This workflow connects to PostgreSQL via the native JDBC plugin and cross-references `pg_locks` with `pg_stat_activity`. It identifies queries stuck in an ungranted lock state (`NOT blocked_locks.granted`) for more than 30 seconds and determines the exact PID and query of the blocking transaction. When blocked queries exceed the threshold, an urgent Slack alert is dispatched with comprehensive locking telemetry.

    ## What you get
    - Real-time detection of locking conflicts and query deadlocks before application connection pools saturate.
    - Pinpoints both blocked query and offending blocking transaction.
    - Actionable session PIDs to enable swift DBA intervention.

    ## Who it's for
    - Database Administrators (DBAs) and Backend Engineers diagnosing transaction lock contention.
    - SREs maintaining production database uptime and low query latency.

    ## Why orchestrate this with Kestra
    - **Native SQL Execution**: Uses official `io.kestra.plugin.jdbc.postgresql.Query` without external CLI dependencies.
    - **Automated Scheduling**: Continuously monitor database concurrency every 15 minutes.
    - **Remediation Ready**: Easily extend the workflow to automatically terminate blocking queries after a safety timeout.

    ## Prerequisites
    - PostgreSQL database credentials with access to `pg_locks` and `pg_stat_activity`.
    - Secrets `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure database host and secrets.
    3. Run the workflow to inspect active lock contention.

    ## How to extend
    - Add an automated branch to execute `SELECT pg_cancel_backend(blocking_pid)` on prolonged blockers.
    - Correlate with table schema migrations (e.g., `ALTER TABLE` operations).

    ## Links
    - [PostgreSQL Viewing Locks](https://www.postgresql.org/docs/current/view-pg-locks.html)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
