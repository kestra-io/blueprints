id: dbt-duckdb-slim-ci-modified-models-pipeline
namespace: company.team

description: |
  Run dbt Slim CI against embedded DuckDB, compiling and testing only modified models
  and their downstream dependencies between a base branch and a candidate pull request.

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: repository_url
    type: STRING
    displayName: Repository URL
    description: HTTPS URL of the Git repository containing the dbt project.
    defaults: https://github.com/dbt-labs/jaffle_shop_duckdb
    validator: '^https://[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?$'

  - id: project_dir
    type: STRING
    displayName: Project Directory
    description: Subdirectory inside the repository where dbt_project.yml resides. Use . for repository root.
    defaults: .
    validator: '^[A-Za-z0-9_./-]+$'

  - id: base_ref
    type: STRING
    displayName: Base Git Ref
    description: Base branch, tag, or commit SHA used as the comparison baseline.
    defaults: duckdb
    validator: '^[A-Za-z0-9_./-]+$'

  - id: head_ref
    type: STRING
    displayName: Head Git Ref
    description: Candidate branch, tag, or commit SHA containing the modifications to test.
    defaults: duckdb
    validator: '^[A-Za-z0-9_./-]+$'

  - id: threads
    type: INT
    displayName: dbt Threads
    description: Number of concurrent threads for dbt execution.
    defaults: 4

  - id: fail_on_zero_selection
    type: BOOLEAN
    displayName: Fail on Zero Selection
    description: Fail the pipeline if no models are modified or selected.
    defaults: false

variables:
  repo_url: "{{ (trigger.body is defined and trigger.body.pull_request is defined and (trigger.body.action in ['opened', 'synchronize', 'reopened'])) ? trigger.body.pull_request.head.repo.clone_url : inputs.repository_url }}"
  base_ref: "{{ (trigger.body is defined and trigger.body.pull_request is defined and (trigger.body.action in ['opened', 'synchronize', 'reopened'])) ? trigger.body.pull_request.base.ref : inputs.base_ref }}"
  head_ref: "{{ (trigger.body is defined and trigger.body.pull_request is defined and (trigger.body.action in ['opened', 'synchronize', 'reopened'])) ? trigger.body.pull_request.head.ref : inputs.head_ref }}"

triggers:
  - id: github_pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Trigger Slim CI runs automatically from GitHub pull_request webhook events.
    key: "{{ secret('DBT_SLIM_CI_WEBHOOK_KEY') }}"
    when: "{{ (trigger.body.action ?? '') in ['opened', 'synchronize', 'reopened'] }}"
    inputs:
      repository_url: "{{ trigger.body.pull_request.head.repo.clone_url }}"
      base_ref: "{{ trigger.body.pull_request.base.ref }}"
      head_ref: "{{ trigger.body.pull_request.head.ref }}"

tasks:
  - id: validate_request
    type: io.kestra.plugin.core.flow.If
    description: Validate repository URL and git ref values before executing git clones or container commands.
    condition: "{{ vars.repo_url startsWith 'https://' and not (vars.repo_url contains ' ') and not (vars.repo_url contains ';') and not (vars.repo_url contains '&') and not (vars.repo_url contains '|') and not (vars.repo_url contains '`') and not (vars.repo_url contains '$') and not (vars.base_ref contains ' ') and not (vars.base_ref contains ';') and not (vars.base_ref contains '&') and not (vars.base_ref contains '|') and not (vars.base_ref contains '`') and not (vars.base_ref contains '$') and not (vars.head_ref contains ' ') and not (vars.head_ref contains ';') and not (vars.head_ref contains '&') and not (vars.head_ref contains '|') and not (vars.head_ref contains '`') and not (vars.head_ref contains '$') }}"
    else:
      - id: reject_invalid_request
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Request rejected: repository_url must use HTTPS and git refs must not contain spaces or shell metacharacters."

  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Shared workspace containing the base repository checkout, candidate checkout, and DuckDB database files.
    tasks:
      - id: clone_base
        type: io.kestra.plugin.git.Clone
        description: Clone the baseline reference into the base subdirectory.
        url: "{{ vars.repo_url }}"
        branch: "{{ vars.base_ref }}"
        directory: base
        retry:
          type: exponential
          maxAttempt: 3
          interval: PT5S
          maxInterval: PT30S

      - id: clone_head
        type: io.kestra.plugin.git.Clone
        description: Clone the candidate pull request reference into the head subdirectory.
        url: "{{ vars.repo_url }}"
        branch: "{{ vars.head_ref }}"
        directory: head
        retry:
          type: exponential
          maxAttempt: 3
          interval: PT5S
          maxInterval: PT30S

      - id: build_baseline
        type: io.kestra.plugin.dbt.cli.DbtCLI
        description: Build baseline seeds, models, and manifest in the base workspace to establish the comparison state.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: ghcr.io/kestra-io/dbt-duckdb:latest
        commands:
          - |
            set -e
            cd "base/{{ inputs.project_dir }}"
            if [ -f packages.yml ] || [ -f dependencies.yml ]; then
              dbt deps
            fi
            dbt seed --threads {{ inputs.threads }}
            dbt build --threads {{ inputs.threads }}
            dbt parse
        outputFiles:
          - "base/{{ inputs.project_dir }}/target/manifest.json"

      - id: slim_ci_pipeline
        type: io.kestra.plugin.dbt.cli.DbtCLI
        description: Compute modified models against baseline state, build selected models into the copied DuckDB database, and export run results.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: ghcr.io/kestra-io/dbt-duckdb:latest
        commands:
          - |
            set -e
            WORKSPACE_ROOT="$(pwd)"
            BASE_TARGET="$WORKSPACE_ROOT/base/{{ inputs.project_dir }}/target"
            BASE_DIR="$WORKSPACE_ROOT/base/{{ inputs.project_dir }}"
            HEAD_DIR="$WORKSPACE_ROOT/head/{{ inputs.project_dir }}"

            # Copy baseline DuckDB file so unchanged upstream models already exist
            mkdir -p "$HEAD_DIR"
            cp "$BASE_DIR"/*.duckdb "$HEAD_DIR/" 2>/dev/null || true

            cd "$HEAD_DIR"
            if [ -f packages.yml ] || [ -f dependencies.yml ]; then
              dbt deps
            fi

            mkdir -p target
            touch target/all_models.txt target/selected_models.txt

            # Generate candidate manifest
            dbt parse

            # Count total models in the project
            dbt --quiet ls --resource-type model > target/all_models.txt
            TOTAL_MODELS=$(grep -cve '^\s*$' target/all_models.txt || true)

            # Identify modified models and downstream dependencies
            dbt --quiet ls --resource-type model --select "state:modified+" --state "$BASE_TARGET" > target/selected_models.txt || true
            SELECTED_MODELS=$(grep -cve '^\s*$' target/selected_models.txt || true)
            SKIPPED_MODELS=$(( TOTAL_MODELS - SELECTED_MODELS ))

            echo "=================================================="
            echo "dbt Slim CI Analysis:"
            echo "Total models in project: $TOTAL_MODELS"
            echo "Selected models (state:modified+): $SELECTED_MODELS"
            echo "Skipped models: $SKIPPED_MODELS"
            echo "=================================================="

            BUILD_EXIT_CODE=0
            if [ "$SELECTED_MODELS" -eq 0 ]; then
              echo "Zero models modified between baseline ({{ vars.base_ref }}) and candidate ({{ vars.head_ref }})."
              cat <<'EOF' > target/run_results.json
            {
              "metadata": {"dbt_version": "1.8.0"},
              "results": [],
              "elapsed_time": 0.0,
              "args": {}
            }
            EOF
            else
              echo "Selected models for build:"
              cat target/selected_models.txt
              echo "Executing dbt build for selected models and downstream dependencies..."
              dbt build --select "state:modified+" --state "$BASE_TARGET" --threads {{ inputs.threads }} || BUILD_EXIT_CODE=$?
            fi

            if [ ! -f target/run_results.json ]; then
              cat <<'EOF' > target/run_results.json
            {
              "metadata": {"dbt_version": "1.8.0"},
              "results": [],
              "elapsed_time": 0.0,
              "args": {}
            }
            EOF
            fi

            cat <<EOF > "$WORKSPACE_ROOT/ci_summary.json"
            {
              "models_in_project": $TOTAL_MODELS,
              "models_selected": $SELECTED_MODELS,
              "models_skipped": $SKIPPED_MODELS,
              "build_exit_code": $BUILD_EXIT_CODE
            }
            EOF

            cp target/run_results.json "$WORKSPACE_ROOT/run_results.json"
            cp target/all_models.txt "$WORKSPACE_ROOT/all_models.txt"
            cp target/selected_models.txt "$WORKSPACE_ROOT/selected_models.txt"
        outputFiles:
          - ci_summary.json
          - run_results.json
          - all_models.txt
          - selected_models.txt

  - id: report
    type: io.kestra.plugin.core.output.OutputValues
    description: Parse dbt artifacts and export metrics for models selected, models skipped, run status counts, execution time, and failed unique IDs.
    values:
      models_in_project: >-
        {{ (fromJson(read(outputs.slim_ci_pipeline.outputFiles['ci_summary.json'])).models_in_project) | number }}
      models_selected: >-
        {{ (fromJson(read(outputs.slim_ci_pipeline.outputFiles['ci_summary.json'])).models_selected) | number }}
      models_skipped: >-
        {{ (fromJson(read(outputs.slim_ci_pipeline.outputFiles['ci_summary.json'])).models_skipped) | number }}
      build_exit_code: >-
        {{ (fromJson(read(outputs.slim_ci_pipeline.outputFiles['ci_summary.json'])).build_exit_code) | number }}
      pass_count: >-
        {{ (fromJson(read(outputs.slim_ci_pipeline.outputFiles['run_results.json'])).results | jq('[.[] | select(.status == "pass" or .status == "success")] | length')) | first | number }}
      fail_count: >-
        {{ (fromJson(read(outputs.slim_ci_pipeline.outputFiles['run_results.json'])).results | jq('[.[] | select(.status == "fail")] | length')) | first | number }}
      error_count: >-
        {{ (fromJson(read(outputs.slim_ci_pipeline.outputFiles['run_results.json'])).results | jq('[.[] | select(.status == "error")] | length')) | first | number }}
      skip_count: >-
        {{ (fromJson(read(outputs.slim_ci_pipeline.outputFiles['run_results.json'])).results | jq('[.[] | select(.status == "skipped")] | length')) | first | number }}
      total_execution_time: >-
        {{ (fromJson(read(outputs.slim_ci_pipeline.outputFiles['run_results.json'])).elapsed_time // 0.0) | number }}
      failed_unique_ids: >-
        {{ (fromJson(read(outputs.slim_ci_pipeline.outputFiles['run_results.json'])).results | jq('[.[] | select(.status == "fail" or .status == "error") | .unique_id]')) | first }}

  - id: log_summary
    type: io.kestra.plugin.core.log.Log
    description: Emit structured log summary of the Slim CI run results.
    message: |
      dbt Slim CI Summary:
      - Repository: {{ vars.repo_url }} (Base: {{ vars.base_ref }}, Head: {{ vars.head_ref }})
      - Models: in_project={{ outputs.report.values.models_in_project }}, selected={{ outputs.report.values.models_selected }}, skipped={{ outputs.report.values.models_skipped }}
      - Results: pass={{ outputs.report.values.pass_count }}, fail={{ outputs.report.values.fail_count }}, error={{ outputs.report.values.error_count }}, skip={{ outputs.report.values.skip_count }}
      - Total execution time: {{ outputs.report.values.total_execution_time }}s
      - Build exit code: {{ outputs.report.values.build_exit_code }}
      - Failed IDs: {{ outputs.report.values.failed_unique_ids }}

  - id: assert_clean_run
    type: io.kestra.plugin.core.flow.If
    description: Fail the pipeline gate if any selected model or test failed, dbt exited with an error, or fail_on_zero_selection was violated.
    condition: "{{ outputs.report.values.fail_count > 0 or outputs.report.values.error_count > 0 or outputs.report.values.build_exit_code != 0 or (inputs.fail_on_zero_selection and outputs.report.values.models_selected == 0) }}"
    then:
      - id: fail_gate
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "dbt Slim CI gate failed: fail_count={{ outputs.report.values.fail_count }}, error_count={{ outputs.report.values.error_count }}, build_exit_code={{ outputs.report.values.build_exit_code }}, models_selected={{ outputs.report.values.models_selected }}. Failed nodes: {{ outputs.report.values.failed_unique_ids }}"

extend:
  title: Run dbt Slim CI on DuckDB for Modified Models and Tests
  metaTitle: dbt Slim CI on DuckDB with Kestra
  shortDescription: Run dbt Slim CI against embedded DuckDB, compiling and testing only modified models and downstream dependencies.
  metaDescription: Run dbt Slim CI on DuckDB to build only modified models and downstream dependencies, compute skipped model counts, and gate pull requests.
  description: |
    dbt Slim CI is a continuous integration pattern that tests only the models and tests changed in a pull request rather than rebuilding the entire project. By comparing the pull request code against a baseline manifest, dbt detects modified nodes and builds only those models plus their downstream dependencies (`state:modified+`). In this blueprint, Kestra clones both the base branch and candidate branch into a single working directory, executes a baseline build against an embedded DuckDB database, and copies that database to the candidate workspace. This baseline-clone approach allows downstream modified models to query unchanged upstream tables immediately without re-running upstream seeds or requiring warehouse deferral configs. Unlike full-project dbt pipelines that rebuild every model on every commit, this flow computes and reports the exact count of modified versus skipped models and fails the pipeline if any selected model or data test fails. Note that this blueprint compiles the baseline on each run, making it ideal for small to medium projects; enterprise-scale warehouses typically pull a pre-compiled production manifest from object storage.

    ## How it works

    1. The Webhook trigger `github_pr_webhook` receives GitHub `pull_request` webhook payloads (`opened`, `synchronize`, `reopened`), extracting repository URL, base ref, and head ref. Alternatively, users trigger the flow manually with configurable inputs.
    2. Input validation verifies that the repository URL is HTTPS and that Git refs contain only safe alphanumeric and delimiter characters before any clone or container execution.
    3. `workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) encapsulates all Git and dbt tasks in a shared filesystem.
    4. `clone_base` and `clone_head` (`io.kestra.plugin.git.Clone`) clone the baseline branch and pull request branch into separate `base` and `head` subdirectories, with exponential retry policies for network resilience.
    5. `build_baseline` (`io.kestra.plugin.dbt.cli.DbtCLI`) runs inside the official `ghcr.io/kestra-io/dbt-duckdb:latest` container, executing `dbt deps` (if packages exist), `dbt seed`, `dbt build`, and `dbt parse` in the base directory. This produces the baseline DuckDB database file and `base/target/manifest.json`.
    6. `run_slim_ci` (`io.kestra.plugin.dbt.cli.DbtCLI`) copies the compiled baseline DuckDB database to the `head` workspace so unchanged upstream tables already exist. It runs `dbt parse` on the candidate code and inspects the state comparison with `dbt ls --select state:modified+ --state <base target dir>`. If zero models changed, it finishes cleanly (or fails if `fail_on_zero_selection` is true). If changes exist, it builds only modified models and downstream dependencies with `dbt build --select state:modified+ --state <base target dir>`.
    7. `report` (`io.kestra.plugin.core.output.OutputValues`) extracts metrics from `ci_summary.json` and `run_results.json`: models in project, models selected, models skipped, pass/fail/error/skip counts, execution duration, and failed unique IDs.
    8. `log_summary` (`io.kestra.plugin.core.log.Log`) prints the structured run brief, and `assert_clean_run` (`io.kestra.plugin.core.flow.If`) halts the pipeline with `io.kestra.plugin.core.execution.Fail` if any selected model or data test failed.

    ## What you get

    - Computes which models changed between base and head branches using real dbt `state:modified+` comparison.
    - Saves compute by skipping compilation and execution of unchanged upstream models.
    - Seamless upstream resolution on DuckDB by reusing the compiled baseline database file without cloud deferral hacks.
    - Comprehensive artifact parsing exposing selected, total, and skipped model counts alongside test execution metrics.
    - Automated pull request gating that halts execution and lists failed model and test identifiers.

    ## Who it's for

    - Analytics engineers maintaining dbt models on DuckDB or MotherDuck.
    - Data platform teams looking to implement fast, cost-effective CI gates for dbt pull requests.
    - Teams seeking reproducible local or CI testing without spinning up cloud data warehouses.

    ## Why orchestrate this with Kestra

    - Orchestrates multi-step Git checkouts, containerized dbt CLI runs, and artifact parsing in a single declarative YAML flow.
    - Built-in `WorkingDirectory` mounts provide zero-overhead shared storage between Git clones and dbt execution steps.
    - Native Webhook triggers seamlessly integrate with GitHub pull request events while supporting manual execution.
    - Structured `OutputValues` and logging turn opaque dbt JSON artifacts into first-class UI metrics and audit trails.

    ## Prerequisites

    - A Kestra worker with Docker access enabled (`io.kestra.plugin.scripts.runner.docker.Docker`) to run the `ghcr.io/kestra-io/dbt-duckdb` container image.
    - Network connectivity to clone the target Git repository.

    ### Secrets

    - `DBT_SLIM_CI_WEBHOOK_KEY`: Secret authentication key required to authorize incoming GitHub pull request webhook triggers.

    ## Quick start

    1. Create the `DBT_SLIM_CI_WEBHOOK_KEY` secret in your Kestra namespace.
    2. Import this blueprint and click **Execute** with default inputs (`https://github.com/dbt-labs/jaffle_shop_duckdb` on branch `duckdb`).
    3. Verify that the flow executes, detects 0 modified models between identical branches, and skips building unchanged models.
    4. Configure a GitHub webhook pointing to your Kestra webhook trigger URL for pull request events (`opened`, `synchronize`, `reopened`).
    5. Open a pull request that edits a dbt model and verify that only the edited model and its downstream dependents run.

    ## How to extend

    - Add a Slack or Microsoft Teams notification task in the failure branch to alert data engineers on failed CI runs.
    - Post execution summaries back to GitHub as pull request comments using the GitHub API plugin.
    - Adapt profiles to test MotherDuck databases by setting the path to `md:<database>` and adding a MotherDuck token secret.

    ## Links

    - [Kestra dbt CLI Plugin](https://kestra.io/plugins/plugin-dbt)
    - [Kestra Git Plugin](https://kestra.io/plugins/plugin-git)
    - [dbt Slim CI Documentation](https://docs.getdbt.com/docs/deploy/continuous-integration)
    - [dbt DuckDB Adapter](https://github.com/jwills/dbt-duckdb)
  tags:
    - Data
  subTags:
    - dbt Transformations
    - Testing & Quality
  ee: false
  demo: false
