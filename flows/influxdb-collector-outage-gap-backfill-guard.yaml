id: influxdb-collector-outage-gap-backfill-guard
namespace: company.team
description: Restore an empty historical telemetry interval from a sealed immutable collector archive and verify original
  point identities and values.
concurrency:
  limit: 1
  behavior: QUEUE
inputs:
- id: archive_url
  type: STRING
  defaults: "{{ secret('COLLECTOR_ARCHIVE_URL') }}"
- id: archive_username
  type: STRING
  defaults: archive_reader
- id: archive_password
  type: SECRET
  defaults: "{{ secret('COLLECTOR_ARCHIVE_PASSWORD') }}"
- id: influxdb_url
  type: STRING
  defaults: "{{ secret('INFLUXDB_URL') }}"
- id: influxdb_org
  type: STRING
  defaults: "{{ secret('INFLUXDB_ORG') }}"
- id: influxdb_token
  type: SECRET
  defaults: "{{ secret('INFLUXDB_TOKEN') }}"
- id: batch_id
  type: STRING
  defaults: incident-01
  validator: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$
- id: bucket
  type: STRING
  defaults: telemetry
  validator: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
- id: measurement
  type: STRING
  defaults: telemetry
  validator: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
- id: auto_remediate
  type: BOOL
  defaults: false
- id: dry_run
  type: BOOL
  defaults: true
- id: slack_webhook_url
  type: SECRET
  defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
variables:
  source_sql: |-
    WITH selected AS (
     SELECT * FROM collector_archive.batch WHERE batch_id = '{{ inputs.batch_id }}'
    ), bounded AS (
     SELECT p.* FROM collector_archive.points p JOIN selected b USING(batch_id)
     ORDER BY time_ns,device,site LIMIT 1001
    ), packed AS (
     SELECT count(*) AS n,
     coalesce(json_agg(json_build_object('time_ns',time_ns::text,'device',device,'site',site,'value',value,'valid',valid) ORDER BY time_ns,device,site)::text,'[]') AS records,
     coalesce(bool_and(time_ns >= b.start_ns AND time_ns < b.stop_ns AND length(device) BETWEEN 1 AND 128 AND length(site) BETWEEN 1 AND 128 AND value BETWEEN -1e12 AND 1e12),false) AS rows_ok
     FROM bounded p JOIN selected b USING(batch_id)
    ), locks AS (
     SELECT count(*) AS protected_tables FROM pg_class c JOIN pg_namespace ns ON ns.oid=c.relnamespace
     WHERE ns.nspname='collector_archive' AND c.relname IN ('batch','points') AND c.relkind='r' AND NOT c.relrowsecurity
     AND NOT (SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname=current_user)
     AND NOT has_table_privilege(current_user,c.oid,'INSERT,UPDATE,DELETE,TRUNCATE,TRIGGER')
     AND c.relowner <> (SELECT oid FROM pg_roles WHERE rolname=current_user)
     AND EXISTS (SELECT 1 FROM pg_trigger t JOIN pg_proc f ON f.oid=t.tgfoid
       WHERE t.tgrelid=c.oid AND NOT t.tgisinternal AND t.tgenabled='O' AND t.tgtype=62
       AND f.prosrc = ' BEGIN RAISE EXCEPTION ''Sealed collector archive is immutable''; END ')
    )
    SELECT b.batch_id,b.measurement,b.start_ns::text,b.stop_ns::text,b.sealed,p.n,p.records,
     b.sealed AND b.measurement='{{ inputs.measurement }}' AND p.rows_ok AND p.n BETWEEN 1 AND 1000 AND b.stop_ns>b.start_ns
     AND b.stop_ns-b.start_ns<=3600000000000 AND b.stop_ns<=extract(epoch FROM now()-interval '1 hour')*1e9
     AND locks.protected_tables=2 AND NOT has_schema_privilege(current_user,'collector_archive','CREATE') AS safe,
     (SELECT array_agg(attname::text ORDER BY attnum) FROM pg_attribute WHERE attrelid='collector_archive.points'::regclass AND attnum>0 AND NOT attisdropped) = ARRAY['batch_id','time_ns','device','site','value','valid'] AS schema_ok,
     EXISTS (SELECT 1 FROM pg_index WHERE indrelid='collector_archive.points'::regclass AND indisprimary AND indisvalid AND indkey::text='1 2 3 4') AS identity_unique,
     'collector_archive.batch'::regclass::oid::text AS batch_oid,'collector_archive.points'::regclass::oid::text AS points_oid
    FROM selected b CROSS JOIN packed p CROSS JOIN locks
  target_flux: |-
    import "array"
    import "types"
    meta = buckets() |> filter(fn:(r)=>r.name == {{ inputs.bucket | toJson }}) |> findRecord(fn:(key)=>true,idx:0)
    s = time(v: {{ outputs.source.row.start_ns }})
    e = time(v: {{ outputs.source.row.stop_ns }})
    safe = meta.id == "{{ outputs.bucket_identity.row.bucket_id }}" and (meta.retentionPeriod == 0 or int(v:s) > int(v:now()) - meta.retentionPeriod + 3600000000000)
    start = if safe then s else die(msg:"Bucket identity or retention changed")
    data = from(bucket:{{ inputs.bucket | toJson }}) |> range(start:start,stop:e)
     |> filter(fn:(r)=>r._measurement == {{ inputs.measurement | toJson }})
    unexpected = data |> keys() |> filter(fn:(r)=>not contains(value:r._value,set:["_start","_stop","_measurement","_field","device","site"])) |> group() |> findColumn(fn:(key)=>true,column:"_value")
    data |> map(fn:(r)=>({time_ns:string(v:int(v:r._time)),device:if exists r.device then r.device else "",site:if exists r.site then r.site else "",field:r._field,value:string(v:r._value),
     schema_ok:exists r.device and exists r.site and length(arr:unexpected)==0 and ((r._field == "value" and types.isType(v:r._value,type:"float")) or (r._field == "valid" and types.isType(v:r._value,type:"bool")))})) |> group() |> limit(n:2001)
tasks:
- id: source
  type: io.kestra.plugin.jdbc.postgresql.Query
  url: '{{ inputs.archive_url }}'
  username: '{{ inputs.archive_username }}'
  password: '{{ inputs.archive_password }}'
  sql: '{{ render(vars.source_sql) }}'
  fetchType: FETCH_ONE
  timeout: PT30S
- id: require_sealed_archive
  type: io.kestra.plugin.core.execution.Fail
  condition: '{{ outputs.source.size != 1 or not (outputs.source.row.safe ?? false) or not (outputs.source.row.schema_ok ??
    false) or not (outputs.source.row.identity_unique ?? false) }}'
  errorMessage: Archive absent, mutable, unsealed, oversized, invalid or too recent. No backfill.
- id: bucket_identity
  type: io.kestra.plugin.influxdb.FluxQuery
  connection:
    url: '{{ inputs.influxdb_url }}'
    token: '{{ inputs.influxdb_token }}'
    connectTimeout: PT5S
    readTimeout: PT15S
  org: '{{ inputs.influxdb_org }}'
  query: |-
    import "array"
    b = buckets() |> filter(fn:(r)=>r.name == {{ inputs.bucket | toJson }}) |> findRecord(fn:(key)=>true,idx:0)
    array.from(rows:[{bucket_id:b.id}])
  fetchType: FETCH_ONE
  timeout: PT25S
- id: detect
  type: io.kestra.plugin.influxdb.FluxQuery
  connection:
    url: '{{ inputs.influxdb_url }}'
    token: '{{ inputs.influxdb_token }}'
    connectTimeout: PT5S
    readTimeout: PT15S
  org: '{{ inputs.influxdb_org }}'
  query: '{{ render(vars.target_flux) }}'
  fetchType: FETCH
  timeout: PT25S
- id: report
  type: io.kestra.plugin.core.log.Log
  message: Batch {{ inputs.batch_id }} retains {{ outputs.source.row.n }} samples; destination has {{ outputs.detect.size
    }} field records. Only empty intervals can be repaired.
- id: empty_gap
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.detect.size == 0 }}'
  then:
  - id: repair_enabled
    type: io.kestra.plugin.core.flow.If
    condition: '{{ inputs.auto_remediate and not inputs.dry_run }}'
    then:
    - id: approval
      type: io.kestra.plugin.core.flow.Pause
      pauseDuration: PT15M
      onResume:
      - id: approved
        type: BOOL
        defaults: false
      - id: immutable_replay_contract
        type: BOOL
        defaults: false
        description: Archive owner guarantees sealed data cannot change and all concurrent historical writers replay these
          exact archived values.
    - id: approved_repair
      type: io.kestra.plugin.core.flow.If
      condition: '{{ outputs.approval.onResume.approved ?? false }}'
      then:
      - id: require_replay_contract
        type: io.kestra.plugin.core.execution.Fail
        condition: '{{ not (outputs.approval.onResume.immutable_replay_contract ?? false) }}'
        errorMessage: Identical immutable replay contract was not confirmed.
      - id: source_recheck
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: '{{ inputs.archive_url }}'
        username: '{{ inputs.archive_username }}'
        password: '{{ inputs.archive_password }}'
        sql: '{{ render(vars.source_sql) }}'
        fetchType: FETCH_ONE
        timeout: PT30S
      - id: reject_stale_source
        type: io.kestra.plugin.core.execution.Fail
        condition: '{{ outputs.source_recheck.size != 1 or (outputs.source.row | toJson) != (outputs.source_recheck.row |
          toJson) }}'
        errorMessage: Archive identity, bounds, permissions or exact rows changed after approval.
      - id: archive_file
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: '{{ inputs.archive_url }}'
        username: '{{ inputs.archive_username }}'
        password: '{{ inputs.archive_password }}'
        sql: |-
          SELECT to_char(to_timestamp((time_ns/1000000000)::double precision) AT TIME ZONE 'UTC','YYYY-MM-DD"T"HH24:MI:SS') || '.' || lpad((time_ns%1000000000)::text,9,'0') || 'Z' AS time,
           device,site,value::text AS value,valid
          FROM collector_archive.points WHERE batch_id='{{ inputs.batch_id }}' ORDER BY time_ns,device,site LIMIT 1001
        fetchType: STORE
        timeout: PT30S
      - id: prewrite
        type: io.kestra.plugin.influxdb.FluxQuery
        connection:
          url: '{{ inputs.influxdb_url }}'
          token: '{{ inputs.influxdb_token }}'
          connectTimeout: PT5S
          readTimeout: PT15S
        org: '{{ inputs.influxdb_org }}'
        query: '{{ render(vars.target_flux) }}'
        fetchType: FETCH
        timeout: PT25S
      - id: still_empty
        type: io.kestra.plugin.core.flow.If
        condition: '{{ outputs.prewrite.size == 0 }}'
        then:
        - id: load_original_points
          type: io.kestra.plugin.influxdb.Load
          connection:
            url: '{{ inputs.influxdb_url }}'
            token: '{{ inputs.influxdb_token }}'
            connectTimeout: PT5S
            readTimeout: PT15S
          org: '{{ inputs.influxdb_org }}'
          bucket: '{{ outputs.bucket_identity.row.bucket_id }}'
          measurement: '{{ inputs.measurement }}'
          from: '{{ outputs.archive_file.uri }}'
          tags:
          - device
          - site
          timeField: time
          chunk: 100
          timeout: PT30S
        - id: verify
          type: io.kestra.plugin.influxdb.FluxQuery
          connection:
            url: '{{ inputs.influxdb_url }}'
            token: '{{ inputs.influxdb_token }}'
            connectTimeout: PT5S
            readTimeout: PT15S
          org: '{{ inputs.influxdb_org }}'
          query: '{{ render(vars.target_flux) }}'
          fetchType: FETCH
          timeout: PT25S
        - id: require_exact_recovery
          type: io.kestra.plugin.core.execution.Fail
          condition: |-
            {{ not ({'source': outputs.source.row.records, 'actual': outputs.verify.rows} | toJson | jq('
             . as $x |
             ($x.source|fromjson|map(. as $p|[{time_ns:$p.time_ns,device:$p.device,site:$p.site,field:"value",value:($p.value|tostring),schema_ok:true},{time_ns:$p.time_ns,device:$p.device,site:$p.site,field:"valid",value:($p.valid|tostring),schema_ok:true}])|flatten|sort_by(.time_ns,.device,.site,.field)) as $expected |
             ($x.actual|map(del(.result,.table)|if .field=="value" then .value=(.value|tonumber|tostring) else . end)|sort_by(.time_ns,.device,.site,.field)) == $expected') | first) }}
          errorMessage: Backfill does not equal archived timestamps, tags and field values. Inspect the occupied interval;
            no automatic partial retry.
        - id: recovered
          type: io.kestra.plugin.core.log.Log
          message: Restored {{ outputs.source.row.n }} original samples with exact timestamps, tags and field values.
        else:
        - id: arrived_during_approval
          type: io.kestra.plugin.core.log.Log
          message: Destination interval became occupied. Skipped Load and preserved all arrived data.
      else:
      - id: declined
        type: io.kestra.plugin.core.log.Log
        message: Approval declined. No write.
    else:
    - id: read_only
      type: io.kestra.plugin.core.log.Log
      message: Read-only gap report. No write.
  else:
  - id: occupied
    type: io.kestra.plugin.core.log.Log
    message: Existing data protects this interval. No Load, including partial intervals and completed retries.
errors:
- id: alert_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ inputs.slack_webhook_url }}'
  payload: '{{ {''text'':''Collector archive backfill failed. Inspect execution '' ~ execution.id ~ '' and preserve archive
    data.''} | toJson }}'
  timeout: PT15S
triggers:
- id: daily_report
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 15 6 * * *
  disabled: true
  inputs:
    auto_remediate: false
    dry_run: true
extend:
  # SPDX-License-Identifier: Apache-2.0
  title: Restore empty InfluxDB intervals from a sealed collector archive
  shortDescription: Recover original telemetry samples from an immutable PostgreSQL archive after approval and verify exact
    point identities and values.
  metaTitle: InfluxDB collector archive gap backfill with Kestra
  metaDescription: Backfill an empty InfluxDB interval from a sealed PostgreSQL collector archive with approval, stale-state
    checks and exact point verification.
  tags:
  - Data
  subTags:
  - ELT & Data Landing
  - Day 2 Operations
  ee: false
  demo: false
  description: |
    ## Safety

    The collector's sealed PostgreSQL archive is authoritative. Every concurrent historical writer must replay those same values. InfluxDB merges duplicate point fields, so an unrelated correction arriving after the last empty read can be overwritten without being detectable afterward. Approval confirms this operating contract; it does not enforce destination fencing.

    ## How it works

    PostgreSQL Query checks the sealed batch, role, triggers, identities and bounds. `detect` uses FluxQuery to inspect every destination field in the interval. Only zero records are eligible. `approval` requires both explicit approval and the immutable replay contract. A complete source recheck precedes Query STORE and native Load. If a point arrived during approval, Load is skipped. `verify` compares original nanosecond timestamps, device/site tags, floating-point values and boolean validity fields. Extra tags, fields or mismatches fail recovery.

    ## What you get

    Original samples restored without aggregation or new timestamps.

    ## Who it's for

    Telemetry teams with a sealed PostgreSQL collector archive and deterministic replays into InfluxDB 2.x.

    ## Why orchestrate this with Kestra

    Kestra coordinates approval and verification across both systems. The disabled Schedule forces read-only inputs; failed runs alert Slack.

    ## Tested end to end

    Kestra 2.0.6 with InfluxDB plugin 1.5.7 and PostgreSQL plugin 2.3.0, plus key cases on 2.0.5 with InfluxDB plugin 1.5.6. InfluxDB OSS 2.7.12 and PostgreSQL 16 were used. CLI reads checked data; a fresh fixture repeated the main paths.

    Repair restored 3 samples with 6 typed fields. All 3 archive rows and 6 protected destination fields survived. Arrival during approval skipped Load. Identical arrival at the write boundary conserved the same samples. A surviving wrong value failed verification despite an unchanged count. An interrupted 1000-point Load retained 100 points; retry wrote nothing into that partial interval.

    | Case | Execution |
    | --- | --- |
    | Repair | `1njOUFXUIBjHcEBkGc5S4b` |
    | Arrival during approval | `5tAZ6nqvLhyWssq8RqG6XA` |
    | Same-count wrong value | `1SqoIhJ1k9b3lOYTqgrjSu` |
    | Interrupted Load | `6u5ubctyQdGUZqlhoCDK9s` |

    ## Prerequisites

    The archive schema is fixed: `collector_archive.batch` has batch_id, measurement, start_ns, stop_ns and sealed; `points` has batch_id, time_ns, device, site, value and valid with a primary key on its first four columns. Both tables require enabled statement triggers that reject INSERT, UPDATE, DELETE and TRUNCATE with function body ` BEGIN RAISE EXCEPTION 'Sealed collector archive is immutable'; END `. A different archive is refused.

    Use a non-owner, non-superuser role with schema USAGE and table SELECT only. InfluxDB needs read and write on the destination bucket, including its metadata. Archive owners and administrators remain trusted.

    ### Secrets

    COLLECTOR_ARCHIVE_URL, COLLECTOR_ARCHIVE_PASSWORD, INFLUXDB_URL, INFLUXDB_ORG, INFLUXDB_TOKEN and SLACK_WEBHOOK_URL. Password, token and webhook inputs are SECRET.

    ### Inputs

    Set archive_url, archive_username, batch_id, bucket and measurement. Defaults are archive_reader, incident-01 and telemetry. Repair requires auto_remediate=true and dry_run=false.

    ## Quick start

    1. Confirm the archive contract and scoped permissions, then add secrets.
    2. Run in safe mode and inspect the retained batch and destination report.
    3. Enable repair and approve only when all historical writers use identical archived values.
    4. Read the restored points independently; investigate any failed or occupied partial interval.

    ## How to extend

    Adapt the archive schema only with matching detection, Load projection and exact verification tests.

    Limits: one batch, 1000 samples, a one-hour interval at least one hour old, finite values within +/-1e12 and tags of 1 to 128 characters. Queries return at most 2001 field records. Bucket identity and retention are rechecked. Tasks time out within 30 seconds; approval expires after 15 minutes. Executions of this flow queue, without locking other writers. Existing and partial intervals are protected, not repaired. Source completeness is the archive owner's responsibility. Data appears in execution outputs.

    ## Links

    - [Duplicate points](https://docs.influxdata.com/influxdb/v2/write-data/best-practices/duplicate-points/)
    - [Plugin](https://kestra.io/plugins/plugin-influxdb)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
