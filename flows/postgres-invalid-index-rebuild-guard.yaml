id: postgres-invalid-index-rebuild-guard
namespace: company.team

description: |
  Find PostgreSQL indexes left INVALID by a failed or cancelled CREATE INDEX CONCURRENTLY or
  REINDEX CONCURRENTLY. They are still maintained on every write but never used by queries.
  Report them to Slack, and optionally rebuild each one with REINDEX INDEX CONCURRENTLY, after
  checking that a unique index has no duplicate keys left (a rebuild would fail and leave one
  more invalid index). Leftover _ccnew indexes are dropped. A second audit verifies the result.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: JDBC URL
    defaults: "jdbc:postgresql://localhost:5432/app"

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for REINDEX or DROP INDEX to run.
    defaults: true

variables:
  audit_sql: |
    SELECT i.indexrelid::regclass::text AS index_name,
           i.indrelid::regclass::text AS table_name,
           i.indisunique AS is_unique,
           pg_get_indexdef(i.indexrelid) AS definition,
           pg_relation_size(i.indexrelid) AS size_bytes,
           CASE WHEN c.relname ~ '_ccnew[0-9]*$' THEN 'LEFTOVER_CCNEW' ELSE 'INVALID' END AS kind,
           CASE WHEN c.relname ~ '_ccnew[0-9]*$' THEN format('DROP INDEX CONCURRENTLY %s', i.indexrelid::regclass)
                ELSE format('REINDEX INDEX CONCURRENTLY %s', i.indexrelid::regclass) END AS fix_sql,
           CASE WHEN i.indisunique AND c.relname !~ '_ccnew[0-9]*$' AND i.indexprs IS NULL THEN
             format('SELECT count(*) AS duplicate_keys FROM (SELECT 1 FROM %s %s GROUP BY %s HAVING count(*) > 1) d',
                    i.indrelid::regclass,
                    CASE WHEN i.indpred IS NULL THEN '' ELSE 'WHERE ' || pg_get_expr(i.indpred, i.indrelid) END,
                    (SELECT string_agg(quote_ident(a.attname), ', ' ORDER BY k.ord)
                       FROM unnest(i.indkey::int2[]) WITH ORDINALITY k(attnum, ord)
                       JOIN pg_attribute a ON a.attrelid = i.indrelid AND a.attnum = k.attnum))
           END AS duplicate_check_sql
      FROM pg_index i
      JOIN pg_class c ON c.oid = i.indexrelid
      JOIN pg_namespace n ON n.oid = c.relnamespace
     WHERE NOT i.indisvalid AND n.nspname NOT IN ('pg_catalog', 'information_schema') AND n.nspname !~ '^pg_toast'
     ORDER BY 1

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Read-only catalog query over pg_index. Statements are built with regclass and quote_ident.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Invalid index audit on {{ inputs.jdbc_url }}: {{ outputs.audit.size }} indexes.
      {% for r in outputs.audit.rows %}{{ r.kind }} {{ r.index_name }} on {{ r.table_name }}{{ r.is_unique ? ' (unique)' : '' }}: {{ r.definition }}. {% endfor %}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'PostgreSQL ' ~ inputs.jdbc_url ~ ': ' ~ outputs.audit.size ~ ' invalid indexes, still written on every insert and update but never used: ' ~ (outputs.audit.rows | jq('map("\(.index_name) on \(.table_name)") | join(", ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Rebuilding now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            concurrencyLimit: 1
            description: One index at a time. A unique index is rebuilt only when no duplicate key is left.
            values: "{{ outputs.audit.rows | toJson }}"
            outputs:
              - id: result
                type: STRING
                value: >-
                  {{ fromJson(item.value).index_name }}: {% if (outputs.duplicates.row.duplicate_keys ?? 0) > 0 %}SKIPPED, {{ outputs.duplicates.row.duplicate_keys }} duplicate keys must be fixed first{% elseif outputs.fix is defined and fromJson(item.value).kind == 'LEFTOVER_CCNEW' %}dropped{% elseif outputs.fix is defined %}rebuilt{% else %}FAILED, see the logs{% endif %}
            tasks:
              - id: one
                type: io.kestra.plugin.core.flow.Sequential
                allowFailure: true
                tasks:
                  - id: duplicates
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    runIf: "{{ (fromJson(item.value).duplicate_check_sql ?? '') != '' }}"
                    url: "{{ inputs.jdbc_url }}"
                    username: "{{ secret('POSTGRES_USERNAME') }}"
                    password: "{{ secret('POSTGRES_PASSWORD') }}"
                    fetchType: FETCH_ONE
                    sql: "{{ fromJson(item.value).duplicate_check_sql }}"

                  - id: fix
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    runIf: "{{ (outputs.duplicates.row.duplicate_keys ?? 0) == 0 }}"
                    url: "{{ inputs.jdbc_url }}"
                    username: "{{ secret('POSTGRES_USERNAME') }}"
                    password: "{{ secret('POSTGRES_PASSWORD') }}"
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).fix_sql }}"

          - id: reaudit
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ inputs.jdbc_url }}"
            username: "{{ secret('POSTGRES_USERNAME') }}"
            password: "{{ secret('POSTGRES_PASSWORD') }}"
            fetchType: FETCH
            sql: "{{ render(vars.audit_sql) }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            description: Every index reported rebuilt or dropped must be gone from the second audit, and no new invalid index may appear.
            condition: >-
              {{ {'res': outputs.remediate.outputs ?? [], 'after': outputs.reaudit.rows ?? [], 'before': outputs.audit.rows} | jq('
                 ([.res[] | .outputs.result | select(test(": (rebuilt|dropped)$")) | split(":")[0]]) as $done
                 | ([.before[].index_name]) as $b | ([.after[] | .index_name | select(. as $x | ($done | index($x)) != null or ($b | index($x)) == null)] | length)
                   + (if (.res | length) < (.before | length) then 1 else 0 end)') | first > 0 }}
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "An index reported as fixed is still invalid, a new invalid index appeared, or an iteration did not report a result: {{ outputs.reaudit.rows | jq('map(.index_name) | join(\", \")') | first }}."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: >-
                  {% for r in outputs.remediate.outputs %}{{ r.outputs.result }}. {% endfor %}Invalid indexes left: {{ outputs.reaudit.size }}.

          - id: skipped_notice
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            runIf: "{{ outputs.remediate.outputs | jq('map(select(.outputs.result | contains(\"SKIPPED\") or contains(\"FAILED\"))) | length') | first > 0 }}"
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {{ {'text': 'PostgreSQL ' ~ inputs.jdbc_url ~ ': indexes not rebuilt: ' ~ (outputs.remediate.outputs | jq('map(.outputs.result | select(contains("SKIPPED") or contains("FAILED"))) | join("; ")') | first) ~ '.'} | toJson }}
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No invalid index."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'PostgreSQL invalid index guard failed on ' ~ inputs.jdbc_url ~ ' (execution ' ~ execution.id ~ '). Index state unknown, check the logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode.
    cron: "0 5 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: PostgreSQL Invalid Index Rebuild Guard
  shortDescription: Find PostgreSQL indexes left INVALID by a failed concurrent build, check unique ones for duplicate keys, rebuild them with REINDEX CONCURRENTLY, drop _ccnew leftovers and verify.
  metaTitle: PostgreSQL Invalid Index Rebuild Guard with Kestra
  metaDescription: Detect invalid PostgreSQL indexes after failed concurrent builds, check duplicates, REINDEX CONCURRENTLY, drop _ccnew leftovers and re-audit.
  description: |
    `CREATE INDEX CONCURRENTLY` and `REINDEX CONCURRENTLY` do not roll back when they fail. A statement timeout, a cancelled migration or a duplicate key leaves the index in the catalog, marked `INVALID`. From then on, PostgreSQL updates it on every insert and update but never uses it for a query. The table is slower to write, and the index the migration was meant to add is missing. Nothing reports it: the migration tool logged one error, and the next deploy moved on.

    This blueprint lists every invalid index. It alerts Slack, and can rebuild each one without blocking writes. A unique index is rebuilt only after a check that no duplicate key is left, since otherwise the rebuild would fail and leave yet another invalid index. A second audit verifies the result.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Kind | What it is | Fix |
    |---|---|---|
    | `INVALID` | An index left by a failed `CREATE INDEX CONCURRENTLY` or `REINDEX CONCURRENTLY` | `REINDEX INDEX CONCURRENTLY` |
    | `INVALID` on a unique index with duplicates | The build failed on duplicate keys, which are still there | Skipped, with the number of duplicate keys to fix first |
    | `LEFTOVER_CCNEW` | The `<name>_ccnew` copy left by a cancelled `REINDEX CONCURRENTLY` | `DROP INDEX CONCURRENTLY` |

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.postgresql.Query`, read-only) returns every index with `indisvalid = false`, outside system schemas. For each one it returns:
       - its definition and kind;
       - the fix statement, built with `regclass` so names are quoted by PostgreSQL;
       - for a unique index, a duplicate-key count query over its columns and partial-index predicate.
    2. `summary` logs every finding.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs it.
       - **findings:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`) handles one index at a time. For a unique index, `duplicates` counts duplicate keys, and `fix` runs only when there are none.
         - `reaudit` runs the audit again. `verify_result` fails if an index reported as fixed is still invalid, a new invalid index appeared, or an iteration did not report a result.
         - `skipped_notice` posts the indexes that were skipped or failed.
    4. `errors` alerts Slack when the audit cannot run.

    ## What you get

    - A daily list of the indexes that cost write time and serve no query.
    - Rebuilds that do not block writes, and never start on a unique index that would fail again.
    - Cleanup of the `_ccnew` copies that cancelled rebuilds leave behind.

    ## Who it's for

    - Teams that run schema migrations with concurrent index builds on large tables.
    - DBAs and platform teams responsible for many PostgreSQL databases.
    - Teams evaluating the PostgreSQL plugin who want an example of a catalog query driving maintenance statements one by one.

    ## Why orchestrate this with Kestra

    Finding invalid indexes is one query, but fixing them safely is a sequence: check duplicates first, rebuild one index at a time so a failure stays isolated, then check again. Kestra runs that sequence on a schedule, behind two gates. It reports skipped indexes to the owners, and keeps an execution history of what was rebuilt where.

    ## Tested end to end

    On Kestra 2.0.5 OSS against PostgreSQL 16, with a local HTTP sink standing in for Slack:
    - `orders` (200,000 rows) has a unique index on `ref` that failed on 10 duplicate keys;
    - `events` (600,000 rows) has an index whose concurrent build was cancelled by a statement timeout.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 2 invalid indexes reported, alert sent |
    | 2 | `auto_remediate: true`, `dry_run: false` | `events_payload_idx` rebuilt and valid. `orders_ref_uq` skipped: 10 duplicate keys, Slack notice sent. Verified |
    | 3 | duplicates deleted, and a `REINDEX CONCURRENTLY` cancelled by a timeout | Reports `orders_ref_uq` and the leftover `events_payload_idx_ccnew` |
    | 4 | same, dry run | Nothing changed: 2 invalid indexes still in `pg_index` |
    | 5 | same, remediate | `_ccnew` dropped, `orders_ref_uq` rebuilt. `psql` shows both valid, 0 invalid left |
    | 6 | defaults | Clean |
    | 7 | unreachable database | `errors` alert sent |

    ## Prerequisites

    - For the audit, any role can read the catalog. For remediation, the table owner or a superuser. PostgreSQL 12 or later for `REINDEX CONCURRENTLY`.
    - Local testing:
      - `docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=pg postgres:16`;
      - create a table with duplicate values, then run `CREATE UNIQUE INDEX CONCURRENTLY` on it.

    ### Secrets

    - `POSTGRES_USERNAME` / `POSTGRES_PASSWORD`: credentials used by every query.
    - `SLACK_WEBHOOK_URL`: used by `alert`, `skipped_notice` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:postgresql://localhost:5432/app` | Database |
    | `auto_remediate` | `false` | Allow rebuilds and drops |
    | `dry_run` | `true` | Must be `false` for a statement to run |

    ## Quick start

    1. Add the `POSTGRES_USERNAME`, `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow and set `jdbc_url`.
    3. Run it once and read the invalid indexes.
    4. Run it with `auto_remediate: true` and `dry_run: false`, outside peak hours: a concurrent rebuild reads the whole table.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Trigger the flow at the end of your migration pipeline, so a failed concurrent build is caught right away.
    - Loop over a list of JDBC URLs to check every database of a cluster.
    - List the duplicate keys of a skipped unique index in the Slack notice, so the owner can fix them.
    - Add a `Pause` for approval before rebuilding indexes on very large tables.

    ## Links

    - Building indexes concurrently: https://www.postgresql.org/docs/current/sql-createindex.html#SQL-CREATEINDEX-CONCURRENTLY
    - PostgreSQL plugin: https://kestra.io/plugins/plugin-jdbc-postgres
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
