id: whisper-audio-transcript-notes
namespace: company.team
description: |
  Transcribe an audio file with faster-whisper in a container, emit the
  transcript, and only alert Slack when the audio actually produced speech.

triggers:
  - id: new_recording_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call from your storage or upload pipeline when a new recording lands.
    key: transcribe-audio
  - id: weekly_batch
    type: io.kestra.plugin.core.trigger.Schedule
    description: Optional weekly re-transcription of a URL; shipped disabled.
    cron: "0 6 * * 2"
    disabled: true

inputs:
  - id: audio_url
    type: STRING
    defaults: https://example.com/sample.mp3
    description: Direct URL to the audio file (mp3, wav, m4a).
  - id: language
    type: STRING
    defaults: en
    description: Expected language code; set empty string for auto-detect.
  - id: model_size
    type: STRING
    defaults: base
    description: faster-whisper model size — tiny, base, small, medium, large-v3.

tasks:
  - id: transcribe
    type: io.kestra.plugin.scripts.shell.Commands
    description: Download the audio and run faster-whisper inside the official image; emit segment count, duration, and the transcript path via the stdout outputs protocol. Empty transcripts are a first-class result, not an exception.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        set -eu
        pip install --quiet faster-whisper==1.0.3
        apt-get update -qq >/dev/null 2>&1 || true
        apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
        curl -fsSL "{{ inputs.audio_url }}" -o audio.bin
        python3 -c "
        import json
        from faster_whisper import WhisperModel
        model = WhisperModel('{{ inputs.model_size }}', device='cpu', compute_type='int8')
        segments, info = model.transcribe('audio.bin', language='{{ inputs.language }}' or None)
        texts = [s.text.strip() for s in segments]
        with open('transcript.txt', 'w') as f:
            f.write('\n'.join(texts))
        spoken = sum(len(t) for t in texts) > 0
        print(f'duration {info.duration:.1f}s, segments {len(texts)}')
        print('::' + json.dumps({'outputs': {'segments': len(texts), 'duration': round(info.duration, 1), 'has_speech': spoken}}) + '::')
        "
    outputFiles:
      - transcript.txt

  - id: check_transcript
    type: io.kestra.plugin.core.flow.If
    description: Speech present → transcript notification; empty → a separate alert so silence is never confused with success.
    condition: "{{ outputs.transcribe.vars.has_speech }}"
    then:
      - id: notify_transcript_ready
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Announce the transcript with segment count and duration.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":microphone: Transcript ready for {{ inputs.audio_url }} — {{ outputs.transcribe.vars.segments }} segments over {{ outputs.transcribe.vars.duration }}s ({{ inputs.model_size }} model). Execution {{ execution.id }}."
          }
    else:
      - id: alert_empty_transcript
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: A silent recording is usually a mic problem — say so explicitly.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: Transcription of {{ inputs.audio_url }} produced NO speech ({{ outputs.transcribe.vars.duration }}s of audio). Check the recording source or language setting. Execution {{ execution.id }}."
          }

errors:
  - id: alert_transcription_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when transcription itself fails — a crash must not look like an empty transcript.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Transcription FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.audio_url }}. Check the audio URL and model_size."
      }

outputs:
  - id: transcription_meta
    type: JSON
    description: 'Segment count, duration, and speech flag, e.g. {"segments": 42, "duration": 318.5, "has_speech": true}.'
    value: "{{ outputs.transcribe.vars | toJson }}"

extend:
  title: Transcribe Audio with faster-whisper
  shortDescription: Downloads audio, transcribes it with faster-whisper in a container, and alerts on empty or failed transcriptions.
  metaTitle: Audio Transcription with faster-whisper
  metaDescription: Containerized faster-whisper transcription pipeline that notifies on ready, empty, or failed results.
  description: |
    Meeting recordings, voicemails, walkthrough videos — someone always has to listen. This blueprint downloads the audio, runs faster-whisper in a container, writes `transcript.txt`, and tells Slack the outcome: ready, empty (likely a mic problem), or failed (likely a bad URL). Every path says something, so silence never masquerades as success.

    ## How it works

    1. `transcribe` (`io.kestra.plugin.scripts.shell.Commands` on Docker) installs faster-whisper + ffmpeg, downloads the audio, transcribes with the chosen model size, writes `transcript.txt`, and emits `segments`, `duration`, `has_speech` via the `::{"outputs": ...}::` protocol.
    2. `check_transcript` (`io.kestra.plugin.core.flow.If`) branches: speech found → `notify_transcript_ready`; no speech → `alert_empty_transcript`.
    3. The `errors` block alerts Slack on hard failures.
    4. Triggers: a `Webhook` (`transcribe-audio`) for upload pipelines plus a disabled weekly `Schedule`.

    ## What you get

    - `transcript.txt` as an execution artifact.
    - Three-way outcome reporting: ready / empty / failed.
    - `transcription_meta` JSON for routing transcripts onward.

    ## Who it's for

    - Teams recording standups, interviews, or support calls.
    - Support teams archiving voicemail with searchable text.
    - Anyone replacing "I'll transcribe it later" with a flow.

    ## Why orchestrate this with Kestra

    Whisper gives you a transcript; the flow adds the download, the artifacts, the branch on empty, the alerts, and the trigger wiring — and the next step (summarize with an LLM, push to a doc, index in search) is one task away.

    ## Prerequisites

    - Outbound access to the audio URL and PyPI (model download on first run).
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for ready/empty/failure alerts.

    ## Quick start

    1. Add the Slack webhook secret.
    2. Set `audio_url` and pick a `model_size` (base is a good first run).
    3. Run once and read `transcription_meta` plus `transcript.txt`.
    4. Wire the `transcribe-audio` webhook into your upload pipeline.

    ## How to extend

    - Pipe `transcript.txt` into an LLM summarization task.
    - ForEach over several audio URLs.
    - Store transcripts to S3 via an upload task.

    ## Links

    - [faster-whisper](https://github.com/SYSTRAN/faster-whisper)
    - [Kestra output files](https://kestra.io/docs/workflow-components/taskrunner)
    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - AI
    - Data
  subTags:
    - Transcription
    - Media Processing
  ee: false
  demo: false
