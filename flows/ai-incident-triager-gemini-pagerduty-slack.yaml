id: ai-incident-triager-gemini-pagerduty-slack
namespace: company.sre

inputs:
  - id: service_name
    type: STRING
    displayName: Service Name
    required: true
    defaults: "payment-gateway"
    description: "The name of the service experiencing an anomaly or failure."

  - id: raw_error_logs
    type: STRING
    displayName: Raw Error Logs
    required: true
    defaults: "ConnectionTimeout: upstream database replica db-east-02 failed health check after 30000ms. Error 504 Gateway Timeout on /v1/charge."
    description: "Raw stack trace or log excerpt captured during the incident."

  - id: severity_hint
    type: SELECT
    displayName: Severity Hint
    values: ["LOW", "MEDIUM", "HIGH", "CRITICAL"]
    defaults: "HIGH"
    description: "Initial automated alert severity level from monitoring source."

tasks:
  - id: log_incident_received
    type: io.kestra.plugin.core.log.Log
    message: "🚨 Triaging incoming incident on service: {{ inputs.service_name }} (Initial Severity: {{ inputs.severity_hint }})"

  - id: gemini_root_cause_analysis
    type: io.kestra.plugin.gemini.StructuredOutputCompletion
    description: "Perform LLM log parsing and structured incident triage using Google Gemini"
    apiKey: "{{ secret('GEMINI_API_KEY') }}"
    model: "gemini-2.5-flash"
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    prompt: |
      You are a Principal Site Reliability Engineer (SRE).
      Analyze the following production incident logs:

      Service: {{ inputs.service_name }}
      Reported Severity: {{ inputs.severity_hint }}
      Raw Error Logs:
      {{ inputs.raw_error_logs }}

      Analyze the likely root cause, produce a concise summary, recommend immediate actionable recovery steps, and evaluate if this requires on-call engineer paging.
    jsonResponseSchema: |
      {
        "type": "object",
        "properties": {
          "summary": {
            "type": "string",
            "description": "Concise 1-sentence summary of the incident"
          },
          "root_cause_hypothesis": {
            "type": "string",
            "description": "Likely culprit behind the failure"
          },
          "recommended_actions": {
            "type": "array",
            "items": { "type": "string" },
            "description": "2-3 immediate recovery steps for the on-call engineer"
          },
          "escalate_to_pagerduty": {
            "type": "boolean",
            "description": "True if critical service impairment requires human intervention"
          }
        },
        "required": ["summary", "root_cause_hypothesis", "recommended_actions", "escalate_to_pagerduty"]
      }

  - id: notify_slack_channel
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Post structured AI root cause analysis to incident channel"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "blocks": [
          {
            "type": "header",
            "text": {
              "type": "plain_text",
              "text": "🚨 Incident Triage: {{ inputs.service_name }}",
              "emoji": true
            }
          },
          {
            "type": "section",
            "fields": [
              {
                "type": "mrkdwn",
                "text": "*Severity:* {{ inputs.severity_hint }}"
              },
              {
                "type": "mrkdwn",
                "text": "*Execution ID:* `{{ execution.id }}`"
              }
            ]
          },
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "*🤖 AI Analysis Summary:*\n{{ outputs.gemini_root_cause_analysis.predictions | first | jq('.summary') | first }}\n\n*Likely Root Cause:*\n{{ outputs.gemini_root_cause_analysis.predictions | first | jq('.root_cause_hypothesis') | first }}"
            }
          }
        ]
      }

  - id: check_and_escalate
    type: io.kestra.plugin.core.flow.If
    description: "Conditionally page on-call if AI marks as requiring immediate human escalation"
    condition: "{{ (outputs.gemini_root_cause_analysis.predictions | first | jq('.escalate_to_pagerduty') | first == true) or (inputs.severity_hint == 'CRITICAL') }}"
    then:
      - id: trigger_pagerduty_incident
        type: io.kestra.plugin.pagerduty.PagerDutyAlert
        url: "https://events.pagerduty.com/v2/enqueue"
        payload: |
          {
            "routing_key": "{{ secret('PAGERDUTY_ROUTING_KEY') }}",
            "event_action": "trigger",
            "dedup_key": "kestra-incident-{{ inputs.service_name }}-{{ execution.id }}",
            "payload": {
              "summary": "[CRITICAL SRE ALERT] {{ inputs.service_name }}: {{ outputs.gemini_root_cause_analysis.predictions | first | jq('.summary') | first }}",
              "source": "kestra-flow-{{ flow.id }}",
              "severity": "critical",
              "custom_details": {
                "execution_id": "{{ execution.id }}",
                "service": "{{ inputs.service_name }}",
                "recommended_actions": "{{ outputs.gemini_root_cause_analysis.predictions | first | jq('.recommended_actions') | first }}"
              }
            }
          }

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dead-letter alerting if triage workflow fails"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Kestra Triage Pipeline Failed!* Execution `{{ execution.id }}` encountered an unhandled error. Please inspect logs manually."
      }

extend:
  title: AI Incident Triager with Gemini, PagerDuty, and Slack
  metaTitle: AI Incident Triager with Gemini, PagerDuty, and Slack | Kestra
  shortDescription: Automate SRE incident triage using Google Gemini structured output, posting root-cause summaries to Slack and conditionally paging PagerDuty.
  metaDescription: Automate incident triage with Gemini structured outputs, broadcasting root-cause analysis to Slack and paging on-call engineers via PagerDuty.
  description: |
    Production incidents demand rapid diagnostics, but manual triage of raw stack traces and error logs creates delays and escalates alert fatigue. This blueprint implements an automated, AI-assisted incident triage pipeline that parses raw error logs with Google Gemini, outputs structured root-cause hypotheses, broadcasts real-time findings to Slack, and conditionally triggers PagerDuty alerts for critical service disruptions.

    ## How it works

    1. **Log Reception**: The flow accepts incoming incident details including the affected service name, initial severity hint, and raw error stack traces.
    2. **Gemini Structured Analysis**: The `gemini_root_cause_analysis` task (`io.kestra.plugin.gemini.StructuredOutputCompletion`) analyzes the raw error logs against strict JSON schema definitions to extract a summary, root cause hypothesis, actionable recovery steps, and an escalation verdict.
    3. **Slack War Room Broadcast**: The `notify_slack_channel` task (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) formats the structured findings and posts them directly to the incident response channel.
    4. **Conditional Escalation**: The `check_and_escalate` task (`io.kestra.plugin.core.flow.If`) evaluates whether the AI identified critical impact or if the initial alert was flagged as CRITICAL. When triggered, it creates a deduplicated incident in PagerDuty via `trigger_pagerduty_incident` (`io.kestra.plugin.pagerduty.PagerDutyAlert`).
    5. **Pipeline Resilience**: An `errors` block ensures a dead-letter notification is immediately dispatched to Slack if the triage pipeline encounters an unhandled exception.

    ## What you get

    - Sub-second root cause diagnosis from raw logs without manual intervention.
    - Zero glue-code JSON schema enforcement with Gemini structured outputs.
    - Automatic deduplicated paging to PagerDuty only when human intervention is truly necessary.
    - Dead-letter error handling guaranteeing observability over the triage pipeline itself.

    ## Who it's for

    - Site Reliability Engineers (SREs) and DevOps teams managing on-call rotations.
    - Platform teams seeking to reduce Mean Time to Resolution (MTTR) and alert noise.
    - Incident response coordinators needing consistent, structured incident briefing notes.

    ## Why orchestrate this with Kestra

    Kestra natively handles retry policies, secret protection, native AI plugin execution, and conditional logic in declarative YAML. By using native Gemini, Slack, and PagerDuty plugins, no custom container builds or external scripts are required.

    ## Prerequisites

    - A Google Gemini API key.
    - A Slack Incoming Webhook URL.
    - A PagerDuty technical service with an Events API v2 integration key.

    ### Secrets

    - `GEMINI_API_KEY`: API key for Google Gemini model inference.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for incident announcements.
    - `PAGERDUTY_ROUTING_KEY`: 32-character PagerDuty Events API v2 Integration Key.

    ## Quick start

    1. Configure `GEMINI_API_KEY`, `SLACK_WEBHOOK_URL`, and `PAGERDUTY_ROUTING_KEY` in your Kestra namespace secrets.
    2. Execute this flow with the default input values to verify the triage and notification output.
    3. Connect your monitoring tools (Prometheus Alertmanager, Datadog, or Grafana) to trigger this flow on alert creation.

    ## How to extend

    - Add automated remediation actions (e.g. restart Kubernetes deployment or flush cache) in the escalation branch.
    - Integrate vector search or historical incident databases to cross-reference previous incident post-mortems.
    - Route non-critical findings into Jira Service Management or Linear tickets.

    ## Links

    - [Kestra Gemini Plugin](https://kestra.io/plugins/plugin-gemini)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra PagerDuty Plugin](https://kestra.io/plugins/plugin-pagerduty)
  tags:
    - AI
    - Infrastructure
  subTags:
    - Agents & Structured Output
    - Incident Response
    - Monitoring & Alerting
  ee: false
  demo: false
