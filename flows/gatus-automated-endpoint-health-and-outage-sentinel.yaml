id: gatus-automated-endpoint-health-and-outage-sentinel
namespace: company.platform

description: |
  Continuously monitors Gatus automated service health dashboards, audits endpoint availability and error rates across critical microservices, and dispatches actionable Slack incident alerts upon service failure or health check degradation.

inputs:
  - id: gatus_url
    type: STRING
    displayName: Gatus Endpoint URL
    defaults: "http://localhost:8080"
    description: "Base HTTP URL of the Gatus service health monitoring instance."

  - id: target_service_group
    type: STRING
    displayName: Target Service Group
    defaults: "core"
    description: "Gatus endpoint group to evaluate for microservice availability."

  - id: slack_channel
    type: STRING
    displayName: SRE Alert Channel
    defaults: "#infra-alerts"
    description: "Slack channel for routing endpoint outage and health alerts."

triggers:
  - id: scheduled_sentinel_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */1 * * *"
    disabled: true
    inputs:
      gatus_url: "http://localhost:8080"
      target_service_group: "core"

tasks:
  - id: probe_gatus_health
    type: io.kestra.plugin.core.http.Request
    description: "Queries Gatus /healthz to verify monitoring dashboard engine availability."
    uri: "{{ inputs.gatus_url }}/healthz"
    method: GET

  - id: probe_endpoint_statuses
    type: io.kestra.plugin.core.http.Request
    description: "Retrieves endpoint status evaluations and response metrics from Gatus REST API."
    uri: "{{ inputs.gatus_url }}/api/v1/endpoints/statuses"
    method: GET

  - id: evaluate_service_health
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates Gatus engine reachability and endpoint status metrics using Pebble conditionals."
    value: |
      {% if outputs.probe_gatus_health.code != 200 %}
      ENGINE_UNREACHABLE
      {% elseif outputs.probe_endpoint_statuses.code != 200 %}
      STATUS_API_ERROR
      {% elseif outputs.probe_endpoint_statuses.body is empty %}
      NO_ENDPOINTS_CONFIGURED
      {% else %}
      COMPLIANT
      {% endif %}
    cases:
      COMPLIANT:
        - id: log_compliant_state
          type: io.kestra.plugin.core.log.Log
          level: INFO
          message: "Gatus monitoring service at {{ inputs.gatus_url }} is operational and active endpoint health checks are succeeding."

      ENGINE_UNREACHABLE:
        - id: alert_engine_offline
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "Gatus Health Dashboard Offline",
                  "text": "CRITICAL: Gatus health dashboard at `{{ inputs.gatus_url }}` is unreachable (HTTP status `{{ outputs.probe_gatus_health.code }}`).\nAutomated endpoint health monitoring and status aggregation are offline.",
                  "footer": "Kestra Sentinel | Platform Reliability"
                }
              ]
            }
        - id: log_engine_offline
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "CRITICAL: Gatus monitoring engine at {{ inputs.gatus_url }} returned HTTP status {{ outputs.probe_gatus_health.code }}."

      STATUS_API_ERROR:
        - id: alert_status_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#E65100",
                  "title": "Gatus Status API Failure",
                  "text": "WARNING: Gatus endpoint statuses API failed with HTTP status `{{ outputs.probe_endpoint_statuses.code }}` on `{{ inputs.gatus_url }}`.",
                  "footer": "Kestra Sentinel | Platform Reliability"
                }
              ]
            }

      NO_ENDPOINTS_CONFIGURED:
        - id: alert_no_endpoints
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#F57C00",
                  "title": "Gatus Endpoint Configuration Warning",
                  "text": "WARNING: Gatus returned an empty endpoint list from `{{ inputs.gatus_url }}/api/v1/endpoints/statuses`.\nVerify Gatus configuration and target group definitions.",
                  "footer": "Kestra Sentinel | Platform Reliability"
                }
              ]
            }

  - id: record_audit_log
    type: io.kestra.plugin.core.log.Log
    description: "Emits a permanent execution audit log recording Gatus health evaluation outcomes."
    level: INFO
    message: "Completed Gatus endpoint health audit on {{ inputs.gatus_url }}. Engine code={{ outputs.probe_gatus_health.code }}, Status API code={{ outputs.probe_endpoint_statuses.code }}."

extend:
  title: Gatus Automated Endpoint Health and Outage Sentinel
  metaTitle: Gatus Service Health and Outage Sentinel | Kestra
  shortDescription: Audits Gatus automated service health dashboards, monitors endpoint status and error rates, and dispatches Slack incident alerts.
  metaDescription: Audit Gatus automated service health endpoints, detect microservice failures or latency spikes, and dispatch automated Slack incident alerts with Kestra.
  description: |
    Continuously monitors Gatus automated service health dashboards, audits endpoint availability and error rates across critical microservices, and dispatches actionable Slack incident alerts upon service failure or health check degradation.

    ## How it works

    1. A recurrent `Schedule` trigger initiates the sentinel audit workflow hourly (disabled initially for on-demand configuration).
    2. The `probe_gatus_health` task queries `/healthz` on the Gatus instance to verify dashboard and monitoring controller readiness.
    3. The `probe_endpoint_statuses` task calls `/api/v1/endpoints/statuses` to retrieve real-time health evaluations, response times, and failure records across configured services.
    4. The `evaluate_service_health` task uses Pebble conditionals inside a `Switch` task to classify health into `COMPLIANT`, `ENGINE_UNREACHABLE`, `STATUS_API_ERROR`, or `NO_ENDPOINTS_CONFIGURED`.
    5. When failures or outages are detected, contextual Slack notifications are posted via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` with diagnostic details, and an audit trail is preserved in Kestra's execution history.

    ## What you get

    - Automated operational surveillance over Gatus automated service health monitoring engines.
    - Proactive alerts when endpoint health checks fail or response latencies degrade across microservices.
    - Contextual incident routing to dedicated SRE and platform engineering Slack channels.
    - Automated deployment gate capability to verify service health before proceeding with CD rollouts.
    - Revision-controlled, searchable execution history providing an immutable operational audit log.

    ## Who it's for

    - Platform Engineers and SREs maintaining automated service health dashboards and status pages.
    - DevOps Teams operating automated deployment pipelines requiring service availability verification.
    - System Administrators governing microservice uptime and endpoint health evaluations.

    ## Why orchestrate this with Kestra

    - **Declarative Service Governance**: Define endpoint monitoring cadences, target groups, and notification channels in revision-controlled YAML blueprints.
    - **Native Secret Isolation**: Inject Slack incoming webhook credentials securely using Kestra namespace secrets via `{{ secret(...) }}` without plaintext exposure.
    - **Multi-Branch Flow Routing**: Isolate dashboard engine outages from API query errors using native `Switch` tasks.
    - **Auditable Execution Telemetry**: Maintain complete execution logs and HTTP diagnostic status codes across every audit run.

    ## Prerequisites

    - A running Gatus service health monitoring instance (accessible over HTTP) with REST API enabled (default port 8080).
    - Network reachability from the Kestra worker or runner environment to the Gatus HTTP endpoint.
    - A Slack Incoming Webhook URL configured with permission to post into your target operations channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for routing operational alerts and incidents.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance (e.g., under namespace `company.platform`).
    3. Click **Execute** with default parameters or supply your custom `gatus_url` and `target_service_group`.
    4. Verify that execution logs display successful HTTP 200 response codes under the **Executions** tab.
    5. Activate the `scheduled_sentinel_audit` trigger to establish recurrent automated service health monitoring.

    ## How to extend

    - **Automated Deployment Gate**: Chain this flow as a pre-flight deployment gate in CI/CD pipelines to block Canary rollouts whenever critical endpoints fail.
    - **PagerDuty Escalation**: Route `ENGINE_UNREACHABLE` events directly to on-call schedules in PagerDuty or Opsgenie.
    - **Automated Pod Restart**: Trigger a Kubernetes pod restart workflow when specific microservice endpoints report persistent connection failures.
    - **Multi-Instance Aggregation**: Wrap the endpoint status probe inside a `ForEach` task to evaluate Gatus instances across staging, canary, and production environments.

    ## Links

    - [Gatus Documentation](https://gatus.io/)
    - [Gatus GitHub Repository](https://github.com/TwiN/gatus)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
