id: supabase-database-connection-pool-and-stale-lock-sentinel
namespace: company.data

inputs:
  - id: connection_saturation_threshold_percent
    type: FLOAT
    defaults: 80.0
    description: Percentage of max connections active before dispatching a pool saturation alert.
  - id: stale_transaction_threshold_seconds
    type: INT
    defaults: 60
    description: Age in seconds of idle in transaction queries before flagging as stuck or orphaned locks.
  - id: alert_on_breach
    type: BOOLEAN
    defaults: true
    description: Whether to dispatch a Slack notification when connection saturation or stale locks are detected.

tasks:
  - id: inspect_connection_pool_and_locks
    type: io.kestra.plugin.scripts.python.Script
    description: Connects to Supabase PostgreSQL and queries pg_stat_activity to evaluate connection saturation and stale locks.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install psycopg2-binary
    env:
      DB_URL: "{{ secret('SUPABASE_DB_URL') }}"
      DB_HOST: "{{ secret('SUPABASE_DB_HOST') }}"
      DB_PORT: "{{ secret('SUPABASE_DB_PORT') ?? '5432' }}"
      DB_NAME: "{{ secret('SUPABASE_DB_NAME') ?? 'postgres' }}"
      DB_USER: "{{ secret('SUPABASE_DB_USER') ?? 'postgres' }}"
      DB_PASSWORD: "{{ secret('SUPABASE_DB_PASSWORD') }}"
      SATURATION_THRESHOLD: "{{ inputs.connection_saturation_threshold_percent }}"
      STALE_THRESHOLD: "{{ inputs.stale_transaction_threshold_seconds }}"
    script: |
      import os
      import json
      import psycopg2
      from psycopg2.extras import RealDictCursor
      from urllib.parse import urlparse
      from kestra import Kestra

      db_url = os.environ.get("DB_URL", "").strip()
      saturation_threshold = float(os.environ.get("SATURATION_THRESHOLD", "80.0"))
      stale_threshold = int(os.environ.get("STALE_THRESHOLD", "60"))

      if db_url:
          conn = psycopg2.connect(db_url, connect_timeout=15, sslmode="require")
      else:
          host = os.environ.get("DB_HOST")
          port = os.environ.get("DB_PORT", "5432")
          dbname = os.environ.get("DB_NAME", "postgres")
          user = os.environ.get("DB_USER", "postgres")
          password = os.environ.get("DB_PASSWORD")
          conn = psycopg2.connect(
              host=host,
              port=port,
              dbname=dbname,
              user=user,
              password=password,
              connect_timeout=15,
              sslmode="require"
          )

      conn.autocommit = True
      cursor = conn.cursor(cursor_factory=RealDictCursor)

      # 1. Inspect max_connections and active counts
      cursor.execute("SHOW max_connections;")
      max_connections = int(cursor.fetchone()["max_connections"])

      cursor.execute("""
          SELECT state, count(*) as count
          FROM pg_stat_activity
          WHERE backend_type = 'client backend'
          GROUP BY state;
      """)
      state_counts = {row["state"] or "unknown": row["count"] for row in cursor.fetchall()}
      total_active_clients = sum(state_counts.values())

      saturation_pct = round((total_active_clients / max_connections) * 100, 2) if max_connections > 0 else 0.0

      # 2. Inspect stale idle in transaction queries holding locks
      cursor.execute("""
          SELECT
              pid,
              usename,
              client_addr::text,
              state,
              ROUND(EXTRACT(EPOCH FROM (now() - state_change))::numeric, 1) as idle_seconds,
              LEFT(query, 200) as query_sample
          FROM pg_stat_activity
          WHERE state = 'idle in transaction'
            AND backend_type = 'client backend'
            AND EXTRACT(EPOCH FROM (now() - state_change)) > %s
          ORDER BY state_change ASC
          LIMIT 10;
      """, (stale_threshold,))
      stale_transactions = cursor.fetchall()

      # 3. Inspect long-running active queries
      cursor.execute("""
          SELECT
              pid,
              usename,
              client_addr::text,
              ROUND(EXTRACT(EPOCH FROM (now() - query_start))::numeric, 1) as duration_seconds,
              LEFT(query, 200) as query_sample
          FROM pg_stat_activity
          WHERE state = 'active'
            AND backend_type = 'client backend'
            AND EXTRACT(EPOCH FROM (now() - query_start)) > %s
            AND query NOT ILIKE '%%pg_stat_activity%%'
          ORDER BY query_start ASC
          LIMIT 10;
      """, (stale_threshold,))
      long_running_queries = cursor.fetchall()

      cursor.close()
      conn.close()

      is_pool_saturated = saturation_pct >= saturation_threshold
      has_stale_locks = len(stale_transactions) > 0
      is_breached = is_pool_saturated or has_stale_locks

      oldest_stale_pid = stale_transactions[0]["pid"] if stale_transactions else None
      remediation_sql = f"SELECT pg_terminate_backend({oldest_stale_pid});" if oldest_stale_pid else "No stuck transactions."

      Kestra.outputs({
          "max_connections": max_connections,
          "total_active_clients": total_active_clients,
          "saturation_pct": saturation_pct,
          "is_pool_saturated": is_pool_saturated,
          "stale_locks_count": len(stale_transactions),
          "has_stale_locks": has_stale_locks,
          "long_running_count": len(long_running_queries),
          "is_breached": is_breached,
          "oldest_stale_pid": oldest_stale_pid,
          "remediation_sql": remediation_sql,
          "stale_transactions": json.dumps(stale_transactions, default=str),
          "long_running_queries": json.dumps(long_running_queries, default=str)
      })

  - id: check_saturation_and_locks
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Supabase pool saturation exceeds threshold or stale transaction locks are present.
    condition: "{{ outputs.inspect_connection_pool_and_locks.vars.is_breached and inputs.alert_on_breach }}"
    then:
      - id: notify_slack_pool_incident
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency pool saturation or deadlock alert to database on-call Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#db-incidents",
            "attachments": [
              {
                "color": "#E53935",
                "title": "🚨 Supabase Connection Pool & Stale Lock Alert",
                "text": "Supabase PostgreSQL capacity degradation detected. Serverless backends risk encountering connection refusal or transaction serialization deadlock.",
                "fields": [
                  {
                    "title": "Pool Saturation",
                    "value": "{{ outputs.inspect_connection_pool_and_locks.vars.saturation_pct }}% ({{ outputs.inspect_connection_pool_and_locks.vars.total_active_clients }} / {{ outputs.inspect_connection_pool_and_locks.vars.max_connections }})",
                    "short": true
                  },
                  {
                    "title": "Stale 'Idle in Transaction' Locks",
                    "value": "{{ outputs.inspect_connection_pool_and_locks.vars.stale_locks_count }} transactions",
                    "short": true
                  },
                  {
                    "title": "Long Running Queries (>{{ inputs.stale_transaction_threshold_seconds }}s)",
                    "value": "{{ outputs.inspect_connection_pool_and_locks.vars.long_running_count }} queries",
                    "short": true
                  },
                  {
                    "title": "Recommended Remediation",
                    "value": "`{{ outputs.inspect_connection_pool_and_locks.vars.remediation_sql }}`",
                    "short": false
                  }
                ],
                "footer": "Kestra Supabase Database Sentinel"
              }
            ]
          }
    else:
      - id: log_healthy_pool_metrics
        type: io.kestra.plugin.core.log.Log
        description: Logs healthy operational connection metrics when within configured capacity bounds.
        message: "Supabase connection pool healthy: {{ outputs.inspect_connection_pool_and_locks.vars.total_active_clients }}/{{ outputs.inspect_connection_pool_and_locks.vars.max_connections }} slots used ({{ outputs.inspect_connection_pool_and_locks.vars.saturation_pct }}%), 0 stale locks detected."

  - id: export_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured telemetry dictionary for historical capacity monitoring and SLO reporting.
    format:
      timestamp: "{{ execution.startDate }}"
      max_connections: "{{ outputs.inspect_connection_pool_and_locks.vars.max_connections }}"
      total_active_clients: "{{ outputs.inspect_connection_pool_and_locks.vars.total_active_clients }}"
      saturation_pct: "{{ outputs.inspect_connection_pool_and_locks.vars.saturation_pct }}"
      stale_locks_count: "{{ outputs.inspect_connection_pool_and_locks.vars.stale_locks_count }}"
      is_breached: "{{ outputs.inspect_connection_pool_and_locks.vars.is_breached }}"

errors:
  - id: alert_on_database_inspection_failure
    type: io.kestra.plugin.core.log.Log
    description: Logs diagnostic context if database connectivity or telemetry query fails.
    message: "Supabase sentinel failed during execution {{ execution.id }} on task {{ errorLogs()[0]['taskId'] ?? 'unknown' }}: {{ errorLogs()[0]['message'] ?? 'Check connection credentials and network access' }}"

triggers:
  - id: periodic_supabase_pool_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule auditing Supabase connection pool and transaction lock telemetry every 10 minutes.
    cron: "*/10 * * * *"

extend:
  title: Supabase Database Connection Pool and Stale Lock Sentinel
  metaTitle: Supabase Connection Pool and Stale Lock Sentinel | Kestra
  shortDescription: Audits Supabase PostgreSQL connection pool saturation and detects stale uncommitted locks to prevent backend connection exhaustion.
  metaDescription: Audits Supabase Postgres connection pool saturation and detects stale uncommitted transaction locks, alerting platform teams before connection exhaustion.
  description: |
    Modern web and mobile applications using Supabase rely on serverless functions (Next.js API routes, AWS Lambda, Supabase Edge Functions) that open numerous concurrent database connections. Without strict pooling, bursty traffic can rapidly exhaust PostgreSQL `max_connections`, triggering `FATAL: remaining connection slots are reserved for non-replication superuser connections` and causing cascading application downtime. Furthermore, orphaned backend processes that remain `idle in transaction` hold critical row and table locks indefinitely, blocking subsequent write queries. This sentinel polls Supabase database telemetry on a recurring schedule, evaluates connection pool saturation percentage, detects uncommitted transaction locks, and dispatches diagnostic incident alerts to Slack before application outages occur.

    ## How it works

    1. **Scheduled interrogation**: Triggers every 10 minutes via `io.kestra.plugin.core.trigger.Schedule` or runs on-demand during production incident investigations.
    2. **Connection pool telemetry**: Connects to the primary database or Supavisor pooler using SSL and interrogates `SHOW max_connections` alongside `pg_stat_activity`.
    3. **Lock & stale transaction inspection**: Queries for client backends in `idle in transaction` state exceeding the configured age threshold, extracting transaction duration, client IP, and query text.
    4. **Saturation evaluation**: An `io.kestra.plugin.core.flow.If` task evaluates whether active client connections exceed the configurable threshold (default 80%) or if stale locks are detected.
    5. **Slack incident dispatch**: Sends an operational alert to `#db-incidents` containing active client ratios, lock counts, and remediation guidance.
    6. **Audit manifest export**: Outputs a structured JSON payload for historical capacity planning and SLA reporting.

    ## What you get

    - Early warning before serverless connection spikes exhaust PostgreSQL `max_connections`.
    - Automated detection of orphaned `idle in transaction` connections that hold exclusive table locks.
    - Diagnostic query samples and process IDs (PIDs) directly in Slack alerts to accelerate mean time to resolution (MTTR).

    ## Who it's for

    - Backend and Full-Stack Engineers deploying serverless applications on Supabase.
    - Database Administrators and Site Reliability Engineers ensuring PostgreSQL uptime.
    - Platform Teams managing connection poolers like Supavisor or PgBouncer.

    ## Why orchestrate this with Kestra

    - **Zero-code infrastructure overhead**: Replaces brittle external bash monitoring scripts with a declarative, auditable workflow.
    - **Native alerting and condition handling**: Leverages built-in conditional flow logic and official notification plugins.
    - **Encrypted credential management**: Safeguards PostgreSQL connection credentials within Kestra's encrypted secret vault.

    ## Prerequisites

    - Outbound TCP network access from Kestra workers to your Supabase host on port 5432 (direct session) or port 6543 (Supavisor transaction pooler).
    - A PostgreSQL user role with permissions to query `pg_stat_activity` (e.g. `postgres` or any role with `pg_read_all_stats`).
    - A Slack Incoming Webhook configured for database incident alerts.

    ### Secrets

    - `SUPABASE_DB_URL`: Direct or pooled PostgreSQL connection URI (e.g., `postgresql://postgres.[ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres?sslmode=require`). Alternatively, configure individual host and password secrets below.
    - `SUPABASE_DB_HOST`: Hostname of your Supabase database instance (e.g., `db.[ref].supabase.co`).
    - `SUPABASE_DB_PASSWORD`: PostgreSQL password for the database user.
    - `SUPABASE_DB_PORT`: Database port (defaults to `5432` for direct connection or `6543` for connection pooler).
    - `SUPABASE_DB_USER`: PostgreSQL user name (defaults to `postgres`).
    - `SUPABASE_DB_NAME`: Database name (defaults to `postgres`).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch alerts.

    ## Quick start

    1. Add `SUPABASE_DB_URL` (or individual host/password secrets) and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance under `company.data`.
    3. Click **Execute** with default parameters to run an immediate health check of your Supabase connection pool.
    4. Enable the `periodic_supabase_pool_monitor` schedule trigger.

    ## How to extend

    - **Automated stale query termination**: Add a remediation step using `pg_terminate_backend(pid)` to automatically kill queries remaining idle in transaction for more than 15 minutes.
    - **PagerDuty escalation**: Route critical pool saturation (>95%) to PagerDuty or Opsgenie for immediate on-call incident response.
    - **Supabase Management API integration**: Correlate connection saturation with CPU and disk IOPS metrics via Supabase Platform APIs.

    ## Links

    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Supabase Connection Management Documentation](https://supabase.com/docs/guides/database/connecting-to-postgres)
    - [PostgreSQL pg_stat_activity Documentation](https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STAT-ACTIVITY-VIEW)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
