id: elasticsearch-forcemerge-deleted-docs-reclaim-guard
namespace: company.team

description: |
  Find cold Elasticsearch indices wasting disk on deleted documents, run
  POST /<index>/_forcemerge?only_expunge_deletes=true behind a dry run and
  an approval gate to compact those segments, then re-read _stats and fail
  the run if the deleted-doc ratio did not come back down. The flow refuses
  any index that is still being written to, which is the Elasticsearch
  force-merge footgun.

inputs:
  - id: elasticsearch_url
    type: STRING
    defaults: "http://localhost:9200"
    description: Base URL of the Elasticsearch cluster, scheme host and port.
  - id: elasticsearch_username
    type: STRING
    defaults: ""
    description: Overrides the ELASTICSEARCH_USERNAME secret when set. Leave empty to use the secret. On a cluster with security disabled set any value, because it is ignored there and the secret is then not read.
  - id: elasticsearch_password
    type: STRING
    defaults: ""
    description: Overrides the ELASTICSEARCH_PASSWORD secret when set. Leave empty to use the secret. On a cluster with security disabled set any value, because it is ignored there and the secret is then not read.
  - id: index_pattern
    type: STRING
    defaults: "*"
    description: Index or pattern to inspect. Defaults to every index.
  - id: include_system_indices
    type: BOOL
    defaults: false
    description: >-
      When true, dot-prefixed and hidden indices are inspected too. Off by default because those belong to Elasticsearch and its plugins.
  - id: min_deleted_pct
    type: INT
    defaults: 20
    description: >-
      An index is flagged once its deleted documents are at least this percent of all documents still held in its segments (live plus deleted). Force merge expunge only rewrites a segment whose deletes are above index.merge.policy.expunge_deletes_allowed (10 percent by default), so keep this above that.
  - id: min_total_docs
    type: INT
    defaults: 1000
    description: >-
      Ignore an index that holds fewer than this many documents (live plus deleted). A tiny index wastes little disk and a high ratio on it is noise.
  - id: require_write_block
    type: BOOL
    defaults: true
    description: >-
      When true an index must carry index.blocks.write or index.blocks.read_only to be eligible, which is positive proof it stopped taking writes (the state ILM sets before its own force-merge). When false an index with no block still qualifies if it showed no write activity across the probe window.
  - id: write_probe_wait
    type: DURATION
    defaults: PT10S
    description: >-
      Gap between the two indexing samples used to tell whether an index is still receiving writes. If indexing.index_total moves across this window the index is refused. Raise it on a cluster written in bursts.
  - id: max_merge_per_run
    type: INT
    defaults: 10
    description: >-
      The flow refuses to force merge when more indices than this are eligible in one pass. Force merge is heavy IO, so a long list is kicked back for review rather than run all at once.
  - id: verify_wait
    type: DURATION
    defaults: PT5S
    description: >-
      Settle time after the force merge before re-reading _stats. Force merge is synchronous so this is a small margin, not a poll.
  - id: dry_run
    type: BOOL
    defaults: true
    description: When true the flow only reports, it never force merges an index.
  - id: auto_remediate
    type: BOOL
    defaults: false
    description: When true and dry_run is false the flow force merges the eligible indices after approval.

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scan for deleted-doc bloat every night in safe report-only mode. Force merge is heavy IO, so it runs off peak.
    cron: "0 3 * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

tasks:
  - id: detect_cluster
    type: io.kestra.plugin.elasticsearch.Request
    description: Read cluster health for context and as the baseline reachability check.
    connection:
      hosts:
        - "{{ inputs.elasticsearch_url }}"
      basicAuth:
        username: "{{ inputs.elasticsearch_username != '' ? inputs.elasticsearch_username : secret('ELASTICSEARCH_USERNAME') }}"
        password: "{{ inputs.elasticsearch_password != '' ? inputs.elasticsearch_password : secret('ELASTICSEARCH_PASSWORD') }}"
    method: GET
    endpoint: "_cluster/health"

  - id: detect_stats_before
    type: io.kestra.plugin.elasticsearch.Request
    description: >-
      First _stats sample. Reads primary-shard doc counts for the deleted ratio and the indexing counters for the write-activity probe. Primaries are read so a replica does not double count the same documents.
    connection:
      hosts:
        - "{{ inputs.elasticsearch_url }}"
      basicAuth:
        username: "{{ inputs.elasticsearch_username != '' ? inputs.elasticsearch_username : secret('ELASTICSEARCH_USERNAME') }}"
        password: "{{ inputs.elasticsearch_password != '' ? inputs.elasticsearch_password : secret('ELASTICSEARCH_PASSWORD') }}"
    method: GET
    endpoint: "{{ inputs.index_pattern }}/_stats/docs,indexing"
    parameters:
      expand_wildcards: "open,hidden"
      filter_path: "indices.*.primaries.docs.count,indices.*.primaries.docs.deleted,indices.*.primaries.indexing.index_total,indices.*.primaries.indexing.index_current"

  - id: detect_settings
    type: io.kestra.plugin.elasticsearch.Request
    description: Read the write blocks and the hidden flag for every matching index, so a cold index is told apart from a live one and system indices can be filtered out.
    connection:
      hosts:
        - "{{ inputs.elasticsearch_url }}"
      basicAuth:
        username: "{{ inputs.elasticsearch_username != '' ? inputs.elasticsearch_username : secret('ELASTICSEARCH_USERNAME') }}"
        password: "{{ inputs.elasticsearch_password != '' ? inputs.elasticsearch_password : secret('ELASTICSEARCH_PASSWORD') }}"
    method: GET
    endpoint: "{{ inputs.index_pattern }}/_settings/index.blocks.write,index.blocks.read_only,index.blocks.read_only_allow_delete,index.hidden"
    parameters:
      flat_settings: "true"
      expand_wildcards: "open,hidden"

  - id: probe_wait
    type: io.kestra.plugin.core.flow.Sleep
    description: >-
      Wait between the two indexing samples. If indexing.index_total climbs across this gap the index is still taking writes and must not be force merged.
    duration: "{{ inputs.write_probe_wait }}"

  - id: detect_stats_after
    type: io.kestra.plugin.elasticsearch.Request
    description: Second _stats sample. The doc counts for the ratio come from this later read and index_total here against the first read is the write-activity signal.
    connection:
      hosts:
        - "{{ inputs.elasticsearch_url }}"
      basicAuth:
        username: "{{ inputs.elasticsearch_username != '' ? inputs.elasticsearch_username : secret('ELASTICSEARCH_USERNAME') }}"
        password: "{{ inputs.elasticsearch_password != '' ? inputs.elasticsearch_password : secret('ELASTICSEARCH_PASSWORD') }}"
    method: GET
    endpoint: "{{ inputs.index_pattern }}/_stats/docs,indexing"
    parameters:
      expand_wildcards: "open,hidden"
      filter_path: "indices.*.primaries.docs.count,indices.*.primaries.docs.deleted,indices.*.primaries.indexing.index_total,indices.*.primaries.indexing.index_current"

  - id: check_reads
    type: io.kestra.plugin.core.flow.If
    description: >-
      The Request task reports task success on any HTTP status, so every read is gated on its status here. A 404 on the pattern would otherwise pass for a healthy cluster with nothing to reclaim.
    condition: "{{ outputs.detect_cluster.status != 200 or outputs.detect_stats_before.status != 200 or outputs.detect_settings.status != 200 or outputs.detect_stats_after.status != 200 }}"
    then:
      - id: fail_reads
        type: io.kestra.plugin.core.execution.Fail
        description: Fail when the cluster could not be read so nothing downstream acts on a partial picture.
        errorMessage: >-
          Could not read the cluster. health {{ outputs.detect_cluster.status }}, stats before {{ outputs.detect_stats_before.status }}, settings {{ outputs.detect_settings.status }}, stats after {{ outputs.detect_stats_after.status }}.

  - id: plan
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      Build the candidate list. An index is a candidate when its deleted share of held docs is at least min_deleted_pct and it holds at least min_total_docs. Each candidate is then marked eligible only when it is not receiving writes (index_total steady across the probe, no in-flight indexing), carries no disk read-only block and has a write block unless require_write_block is off.
    values:
      cluster_status: "{{ outputs.detect_cluster.response | jq('.status') | first }}"
      inspected: "{{ outputs.detect_stats_after.response | jq('(.indices // {}) | length') | first }}"
      candidates_json: >-
        {{ {'a': outputs.detect_stats_after.response, 'b': outputs.detect_stats_before.response, 's': outputs.detect_settings.response, 'inc': inputs.include_system_indices, 'minpct': inputs.min_deleted_pct, 'mindocs': inputs.min_total_docs, 'reqblock': inputs.require_write_block} | toJson | jq('. as $r | ($r.a.indices // {}) as $A | ($r.b.indices // {}) as $B | ($r.s // {}) as $S | [ $A | to_entries[] | .key as $k | .value.primaries as $p | (($p.docs.count) // 0) as $cnt | (($p.docs.deleted) // 0) as $del | ($cnt + $del) as $held | (if $held > 0 then ($del * 100 / $held) else 0 end) as $ratio | select($ratio >= $r.minpct) | select($held >= $r.mindocs) | (($p.indexing.index_total) // 0) as $ta | (($p.indexing.index_current) // 0) as $ca | ($B[$k].primaries.indexing.index_total) as $tb | ((($S[$k].settings["index.blocks.write"]) // "false") == "true") as $wb | ((($S[$k].settings["index.blocks.read_only"]) // "false") == "true") as $ro | ((($S[$k].settings["index.blocks.read_only_allow_delete"]) // "false") == "true") as $rod | ((($S[$k].settings["index.hidden"]) // "false") == "true") as $hid | ($wb or $ro) as $blk | (if $tb == null then true else ($ta > $tb) end) as $moved | ($ca > 0) as $inflight | (($rod | not) and ($moved | not) and ($inflight | not) and ($blk or ($r.reqblock | not))) as $elig | (if $elig then "" else (if $rod then "disk read-only block set (index.blocks.read_only_allow_delete), do not force merge under disk pressure" else (if $moved then "indexing.index_total moved across the probe window, the index is still receiving writes" else (if $inflight then "indexing operations are in flight (index_current above zero)" else "no write block present and require_write_block is true, so there is no proof the index stopped taking writes" end) end) end) end) as $reason | {index: $k, count: $cnt, deleted: $del, held: $held, blk: $blk, diskblk: $rod, moved: $moved, cur: $ca, eligible: $elig, reason: $reason, system: (($k | startswith(".")) or $hid)} ] | map(select($r.inc or (.system == false)))') | first | toJson }}

  - id: summary
    type: io.kestra.plugin.core.output.OutputValues
    description: Split the candidates into the eligible merge set and the refused set and build a readable line for each. The percent is printed as a truncated integer so a float like 50.0 never reaches the log.
    values:
      merge_json: "{{ outputs.plan.values.candidates_json | jq('[.[] | select(.eligible)]') | first | toJson }}"
      refused_json: "{{ outputs.plan.values.candidates_json | jq('[.[] | select(.eligible | not)]') | first | toJson }}"
      merge_names: >-
        {{ outputs.plan.values.candidates_json | jq('[.[] | select(.eligible) | .index + " (" + (.held|tostring) + " held, " + (.deleted|tostring) + " deleted, " + ((.deleted * 100 / .held)|tostring|split(".")|.[0]) + " percent)"] | join(" | ")') | first }}
      refused_names: >-
        {{ outputs.plan.values.candidates_json | jq('[.[] | select(.eligible | not) | .index + " (" + ((.deleted * 100 / .held)|tostring|split(".")|.[0]) + " percent deleted, REFUSED: " + .reason + ")"] | join(" | ")') | first }}

  - id: report
    type: io.kestra.plugin.core.log.Log
    description: Record the cluster context, the eligible merge set, the refused set and the mode.
    message: |
      Deleted-doc reclaim scan on pattern {{ inputs.index_pattern }}.
      Cluster status {{ outputs.plan.values.cluster_status }}. Indices inspected: {{ outputs.plan.values.inspected }}.
      Threshold: {{ inputs.min_deleted_pct }} percent deleted, minimum {{ inputs.min_total_docs }} docs held. require_write_block={{ inputs.require_write_block }}.
      Eligible to force merge: {{ outputs.summary.values.merge_json | jq('length') | first }}. {{ outputs.summary.values.merge_names }}
      Refused because they are not provably read-only: {{ outputs.summary.values.refused_json | jq('length') | first }}. {{ outputs.summary.values.refused_names }}
      This compacts segments to drop already-deleted docs. It deletes no live data and is not a retention flow.
      Mode dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }} max_merge_per_run={{ inputs.max_merge_per_run }} write_probe_wait={{ inputs.write_probe_wait }}.

  - id: alert_detected_gate
    type: io.kestra.plugin.core.flow.If
    description: Alert Slack the moment bloat is found, before and apart from any remediation decision, so a plain scan or a dry run both alert.
    condition: "{{ (outputs.plan.values.candidates_json | jq('length') | first) > 0 }}"
    then:
      - id: alert_detected
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the eligible and refused indices and whether a force merge will run on this pass. The payload is built as a map then serialized so an index name cannot break the JSON.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {{ {'text': 'Elasticsearch deleted-doc reclaim guard: ' ~ (outputs.plan.values.candidates_json | jq('length') | first) ~ ' index(es) on pattern ' ~ inputs.index_pattern ~ ' hold more than ' ~ inputs.min_deleted_pct ~ ' percent deleted docs wasting disk. Eligible to force merge: ' ~ (outputs.summary.values.merge_json | jq('length') | first) ~ '. ' ~ outputs.summary.values.merge_names ~ '. Refused as not provably read-only: ' ~ (outputs.summary.values.refused_json | jq('length') | first) ~ '. ' ~ outputs.summary.values.refused_names ~ '. dry_run=' ~ inputs.dry_run ~ ' auto_remediate=' ~ inputs.auto_remediate ~ '.'} | toJson }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    description: Act only when an eligible index is present and the operator asked for a real change.
    condition: "{{ (outputs.summary.values.merge_json | jq('length') | first) > 0 and inputs.auto_remediate and not inputs.dry_run }}"
    then:
      - id: cap_gate
        type: io.kestra.plugin.core.flow.If
        description: >-
          Force merge only while the eligible list is small. Force merge is heavy IO, so a long list is kicked back rather than run all at once, which would saturate the cluster.
        condition: "{{ (outputs.summary.values.merge_json | jq('length') | first) <= inputs.max_merge_per_run }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Hold the run until a human approves the force merge. It is heavy IO on the data path, so it never starts on its own.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: >-
                  Set true to force merge the eligible indices to expunge deletes. Anything else leaves them untouched.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            description: Run the force merge only on an explicit approval. An unanswered gate never reads as approval.
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: remediate_forcemerge
                type: io.kestra.plugin.core.flow.Loop
                description: >-
                  Remediation loop. One POST _forcemerge?only_expunge_deletes=true per eligible index, concurrencyLimit 1 so the merges run in turn and never pile heavy IO on the cluster at once. allowFailure so one rejected merge does not stop the pass and the re-read stays the real gate.
                concurrencyLimit: 1
                values: "{{ outputs.summary.values.merge_json }}"
                tasks:
                  - id: forcemerge_one
                    type: io.kestra.plugin.elasticsearch.Request
                    description: Compact one index, expunging only segments whose deletes are above the index expunge threshold. only_expunge_deletes does not force one giant segment, so it does not create the segment that can never merge again.
                    allowFailure: true
                    connection:
                      hosts:
                        - "{{ inputs.elasticsearch_url }}"
                      basicAuth:
                        username: "{{ inputs.elasticsearch_username != '' ? inputs.elasticsearch_username : secret('ELASTICSEARCH_USERNAME') }}"
                        password: "{{ inputs.elasticsearch_password != '' ? inputs.elasticsearch_password : secret('ELASTICSEARCH_PASSWORD') }}"
                    method: POST
                    endpoint: "{{ fromJson(item.value).index }}/_forcemerge"
                    parameters:
                      only_expunge_deletes: "true"

                  - id: forcemerge_log
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      POST {{ fromJson(item.value).index }}/_forcemerge?only_expunge_deletes=true on {{ fromJson(item.value).deleted }} deleted of {{ fromJson(item.value).held }} held returned HTTP {{ outputs.forcemerge_one.status }}.

              - id: settle
                type: io.kestra.plugin.core.flow.Sleep
                description: Small settle before the re-read. Force merge is synchronous so the segment stats are already updated, this is only a margin.
                duration: "{{ inputs.verify_wait }}"

              - id: reverify_stats
                type: io.kestra.plugin.elasticsearch.Request
                description: Re-read primary doc counts so the verdict comes from the cluster itself, not from the force merge call returning 200.
                connection:
                  hosts:
                    - "{{ inputs.elasticsearch_url }}"
                  basicAuth:
                    username: "{{ inputs.elasticsearch_username != '' ? inputs.elasticsearch_username : secret('ELASTICSEARCH_USERNAME') }}"
                    password: "{{ inputs.elasticsearch_password != '' ? inputs.elasticsearch_password : secret('ELASTICSEARCH_PASSWORD') }}"
                method: GET
                endpoint: "{{ inputs.index_pattern }}/_stats/docs"
                parameters:
                  expand_wildcards: "open,hidden"
                  filter_path: "indices.*.primaries.docs.count,indices.*.primaries.docs.deleted"

              - id: verify_plan
                type: io.kestra.plugin.core.output.OutputValues
                description: >-
                  Keep the merged indices whose deleted ratio is still at or above the threshold, meaning the space did not come back. It also records the before and after counts so the drop is on the record.
                values:
                  still_json: >-
                    {{ {'t': outputs.summary.values.merge_json, 'r': outputs.reverify_stats.response, 'minpct': inputs.min_deleted_pct} | toJson | jq('. as $x | ($x.t | fromjson) as $t | ($x.r.indices // {}) as $A | [ $t[] | .index as $i | ($A[$i].primaries // {}) as $p | (($p.docs.count) // 0) as $cnt | (($p.docs.deleted) // 0) as $del | ($cnt + $del) as $held | (if $held > 0 then ($del * 100 / $held) else 0 end) as $ratio | select($ratio >= $x.minpct) | {index: $i, count: $cnt, deleted: $del, held: $held, pct: ($ratio|tostring|split(".")|.[0])} ]') | first | toJson }}
                  still_names: >-
                    {{ {'t': outputs.summary.values.merge_json, 'r': outputs.reverify_stats.response, 'minpct': inputs.min_deleted_pct} | toJson | jq('. as $x | ($x.t | fromjson) as $t | ($x.r.indices // {}) as $A | [ $t[] | .index as $i | ($A[$i].primaries // {}) as $p | (($p.docs.count) // 0) as $cnt | (($p.docs.deleted) // 0) as $del | ($cnt + $del) as $held | (if $held > 0 then ($del * 100 / $held) else 0 end) as $ratio | select($ratio >= $x.minpct) | ($i + " (" + ($del|tostring) + " deleted of " + ($held|tostring) + " held, " + ($ratio|tostring|split(".")|.[0]) + " percent)") ] | join(" | ")') | first }}
                  after_summary: >-
                    {{ {'t': outputs.summary.values.merge_json, 'r': outputs.reverify_stats.response} | toJson | jq('. as $x | ($x.t | fromjson) as $t | ($x.r.indices // {}) as $A | [ $t[] | .index as $i | ($i + ": deleted " + (.deleted|tostring) + " to " + ((($A[$i].primaries.docs.deleted) // -1)|tostring) + ", held " + (.held|tostring) + " to " + (((($A[$i].primaries.docs.count) // 0) + (($A[$i].primaries.docs.deleted) // 0))|tostring)) ] | join(" | ")') | first }}

              - id: verify_report
                type: io.kestra.plugin.core.log.Log
                description: Record the state after the pass so the audit trail carries the result.
                message: |
                  After the pass on pattern {{ inputs.index_pattern }}.
                  Reclaim per index: {{ outputs.verify_plan.values.after_summary }}.
                  Still over the {{ inputs.min_deleted_pct }} percent threshold of the {{ outputs.summary.values.merge_json | jq('length') | first }} merged: {{ outputs.verify_plan.values.still_json | jq('length') | first }}. {{ outputs.verify_plan.values.still_names }}

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                description: Pass only when every merged index dropped below the threshold, otherwise fail loudly.
                condition: "{{ outputs.reverify_stats.status != 200 or (outputs.verify_plan.values.still_json | jq('length') | first) > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    description: Fail when an index is still over the threshold so a merge that reclaimed nothing is never reported as green.
                    errorMessage: >-
                      {{ outputs.verify_plan.values.still_json | jq('length') | first }} of {{ outputs.summary.values.merge_json | jq('length') | first }} merged index(es) are still at or above {{ inputs.min_deleted_pct }} percent deleted: {{ outputs.verify_plan.values.still_names }}. Re-read status {{ outputs.reverify_stats.status }}. only_expunge_deletes rewrites a segment only when its deletes are above index.merge.policy.expunge_deletes_allowed and it skips a segment past max_merged_segment, so a segment set either side of those keeps its deletes. Check those settings on the index.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    description: Record that every merged index came back under the threshold.
                    message: >-
                      Reclaimed and verified. {{ outputs.summary.values.merge_json | jq('length') | first }} index(es) were above {{ inputs.min_deleted_pct }} percent deleted, 0 of them after the merge. {{ outputs.verify_plan.values.after_summary }}.
            else:
              - id: not_approved
                type: io.kestra.plugin.core.log.Log
                description: Record that approval was withheld so nothing was merged.
                message: >-
                  Approval not granted, so no index was force merged. {{ outputs.summary.values.merge_json | jq('length') | first }} index(es) are still carrying deleted-doc bloat: {{ outputs.summary.values.merge_names }}.
        else:
          - id: refuse_report
            type: io.kestra.plugin.core.log.Log
            description: Record that the flow refused to act because too many indices were eligible at once.
            message: >-
              Refusing to force merge. {{ outputs.summary.values.merge_json | jq('length') | first }} index(es) are eligible against max_merge_per_run {{ inputs.max_merge_per_run }}. Force merge is heavy IO, so narrow index_pattern or raise max_merge_per_run once you have reviewed the list. Eligible: {{ outputs.summary.values.merge_names }}.
          - id: fail_cap
            type: io.kestra.plugin.core.execution.Fail
            description: Fail so the alert fires, force merging a list this long at once would saturate the cluster.
            errorMessage: >-
              {{ outputs.summary.values.merge_json | jq('length') | first }} eligible index(es) exceed max_merge_per_run {{ inputs.max_merge_per_run }}, so nothing was merged. Narrow the pattern or raise the cap after review.
    else:
      - id: report_only
        type: io.kestra.plugin.core.log.Log
        description: Record a no-change outcome, either nothing is eligible, everything was refused as still being written to or the run is in report mode.
        message: >-
          No force merge on pattern {{ inputs.index_pattern }}. Eligible {{ outputs.summary.values.merge_json | jq('length') | first }}, refused {{ outputs.summary.values.refused_json | jq('length') | first }}, dry_run {{ inputs.dry_run }}, auto_remediate {{ inputs.auto_remediate }}.

errors:
  - id: alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack on any failure so a refused pass or a merge that reclaimed nothing is never silent.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {'text': 'elasticsearch-forcemerge-deleted-docs-reclaim-guard failed in flow ' ~ flow.id ~ ' (execution ' ~ execution.id ~ ') on pattern ' ~ inputs.index_pattern ~ '. One of these happened: the cluster could not be read, more indices were eligible than max_merge_per_run allows, a merged index was still over the deleted threshold afterwards. Check the execution logs.'} | toJson }}

extend:
  title: Reclaim Deleted-Doc Disk in Cold Elasticsearch Indices with Force Merge
  shortDescription: Find cold Elasticsearch indices wasting disk on deleted docs, expunge those segments with a gated force merge, then re-read _stats and fail if the space did not come back. Live write indices are refused.
  metaTitle: Elasticsearch Force Merge Deleted-Doc Reclaim Guard with Kestra
  metaDescription: Find cold Elasticsearch indices wasting disk on deleted docs, expunge them with a gated force merge, then verify the space came back from _stats.
  description: |
    In Elasticsearch a delete or an update does not remove a document. It marks the old one deleted inside its Lucene segment. That space comes back only when segments merge. An index that saw heavy updates or deletes and is no longer written to keeps those deleted docs and their small segments for as long as it exists, because background merges deprioritise a cold index. The disk stays spent and every search still walks the dead docs. This blueprint reads `_stats`, flags the indices whose deleted docs are a large share of what their segments still hold, then runs `POST /<index>/_forcemerge?only_expunge_deletes=true` behind a dry run and a human approval to compact just those segments, re-reads `_stats` and fails the run if the ratio did not come down.

    This is segment compaction. It expunges documents that are already deleted. It removes no live data, so it is not a retention flow.

    ## Safety

    - Never force merge an index that is still being written to. A force merge on a live write index rewrites its segments and new writes then land in fresh small segments that the merged ones no longer absorb cheaply, which is the Elasticsearch force-merge footgun. So an index is eligible only when it is provably cold: `indexing.index_total` did not move across a probe window, no indexing is in flight and (by default) it carries `index.blocks.write` or `index.blocks.read_only`, which is the state ILM itself sets before its own force-merge step. Everything else is refused, listed in the report and the Slack alert, never merged.
    - `only_expunge_deletes=true` is the safer force-merge variant. It rewrites only segments whose deletes are above `index.merge.policy.expunge_deletes_allowed` and it does not force the index into one giant segment, so it never creates the single huge segment that `max_num_segments=1` leaves behind and that can never merge again. The flow uses this variant on purpose.
    - An index under a disk read-only block (`index.blocks.read_only_allow_delete`) is refused. Force merge needs temporary disk headroom, so running it while the cluster is low on disk makes the pressure worse.
    - `max_merge_per_run` refuses the pass when the eligible list is long, because force merge is heavy IO and a long list usually means the pattern is too wide for one run.

    ## Findings

    - `io.kestra.plugin.elasticsearch.Request` reports task success on any HTTP status, so a 4xx is silent. Every read is gated on `outputs.<id>.status`. The force merge verdict comes from a re-read of `_stats`, never from a 200.
    - The same task deserializes the response body into a map, so a `_cat` endpoint with `format=json` fails the task on its JSON array. All counts here come from `_stats`, which is a JSON object.
    - The ratio is read from `primaries`, not `total`. A replica mirrors its primary, so `total` would count the same deleted docs once per copy and inflate the figure.
    - A force merge can return 200 and reclaim nothing. If `expunge_deletes_allowed` is set above the index's actual deleted ratio, no segment qualifies and the deletes stay. The re-read is what catches that, which is why the run fails on it rather than trusting the call.

    ## How it works

    1. `detect_cluster` (`io.kestra.plugin.elasticsearch.Request`) reads `GET _cluster/health` for context and reachability.
    2. `detect_stats_before` reads `GET {index_pattern}/_stats/docs,indexing` for primary doc counts and the indexing counters. `detect_settings` reads the write blocks plus the hidden flag.
    3. `probe_wait` (`io.kestra.plugin.core.flow.Sleep`) waits `write_probe_wait`, then `detect_stats_after` takes the second sample.
    4. `check_reads` (`io.kestra.plugin.core.flow.If`) fails the run when any read did not return 200.
    5. `plan` (`io.kestra.plugin.core.output.OutputValues`) keeps the indices at or above `min_deleted_pct` holding at least `min_total_docs`, then marks each eligible only when it is not taking writes, has no disk block and has a write block unless `require_write_block` is off.
    6. `summary` splits the candidates into the eligible merge set and the refused set. `report` logs both with the reclaim they represent and the mode. `alert_detected` posts a Slack findings alert whenever anything is flagged, before any remediation decision.
    7. `route` acts only when an index is eligible, `auto_remediate` is true and `dry_run` is false. `cap_gate` then refuses unless the eligible count is at or under `max_merge_per_run`, logging the refusal and failing so the alert fires.
    8. `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run until a human resumes it with `approved` true. `remediate_forcemerge` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) sends one `POST {index}/_forcemerge?only_expunge_deletes=true` per eligible index.
    9. `settle` waits `verify_wait`, then `reverify_stats` re-reads the doc counts. `verify_result` fails the run when any merged index is still at or above the threshold.
    10. The `errors` block posts a Slack alert on any failure. A disabled `Schedule` trigger runs the scan every night in report-only mode.

    ## What you get

    - Disk back from indices that were paying for documents nobody can read.
    - A refusal to force merge any index still taking writes, so the force-merge footgun cannot happen through this flow.
    - A threshold in percent of held docs instead of a guess, with a floor so a tiny index is never flagged.
    - Proof the space came back, from a re-read of `_stats`, not from the merge call returning 200.
    - Slack on detection and Slack on failure, both through a secret.
    - Outputs to chain on: `outputs.summary.values.merge_json` holds the eligible indices, `outputs.summary.values.refused_json` the ones still taking writes, `outputs.verify_plan.values.still_json` whatever stayed over the threshold after a pass.

    ## Who it's for

    - Platform and SRE teams whose Elasticsearch disk keeps climbing on indices that stopped taking writes weeks ago.
    - Anyone running time-based indices that get a bulk `_update_by_query` or `_delete_by_query` for a correction or a GDPR erasure, which leaves a pile of deleted docs behind.
    - Teams who want the ILM warm-phase force-merge step as a safe, approved, verified one-off against indices ILM is not managing.

    ## Why orchestrate this with Kestra

    Force merge is one call and easy to point at the wrong index, where it quietly harms a live index instead of helping a cold one. The value is the sequence around it: prove the index is cold, show it to a human, hold for approval, run the merge, then read the system again to decide whether the run passed. A flow records all of that against one execution id, with the read-only default, the write-safety gate and the `Pause` making a careless merge hard.

    ## Tested end to end

    Verified on Kestra 2.0.5 against Elasticsearch 8.15.3 with security disabled, on a single node. A cold index was created, filled, then had half its documents removed with `_delete_by_query` and was set `index.blocks.write: true`, which left it holding a high deleted ratio with no further writes. A second cold index was given a low deleted ratio to prove precision. A third index was kept under a steady write stream with a high deleted ratio, to prove the write-safety refusal. The clean, detect, dry-run, approved-remediation, declined-approval, refused-active-index, re-verify-fails and failure paths were all run. The flagged cold index went from a high deleted ratio to near zero, the low-ratio index was never touched, the actively written index was refused and reported rather than merged. Every count was confirmed with a direct call to the Elasticsearch `_stats` API and the segment count from `_cat/segments`, not read off the Kestra log. An index whose `index.merge.policy.expunge_deletes_allowed` was set above its deleted ratio made the re-verify step fail the run as designed, because the merge reclaimed nothing.

    ## Prerequisites

    - A reachable Elasticsearch cluster. For a secured cluster, credentials allowed to read cluster health, index stats and index settings and to call `_forcemerge`.
    - A Slack incoming webhook for the findings and failure alerts.

    ### Secrets

    - `ELASTICSEARCH_USERNAME`: username for basic auth, when the cluster has security enabled.
    - `ELASTICSEARCH_PASSWORD`: password for basic auth, when the cluster has security enabled.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for alerts.

    ### Inputs

    - `elasticsearch_url`: base URL of the cluster.
    - `elasticsearch_username` and `elasticsearch_password`: empty by default, so the secrets apply. Set both to any value on a cluster with security off.
    - `index_pattern`: index or pattern to inspect, `*` by default.
    - `include_system_indices`: set true to inspect dot-prefixed and hidden indices too.
    - `min_deleted_pct`: flag an index at or above this percent deleted of held docs. Keep it above the 10 percent `expunge_deletes_allowed` default.
    - `min_total_docs`: ignore an index holding fewer than this many docs.
    - `require_write_block`: when true an index must carry a write block to be eligible, the strongest proof it is cold.
    - `write_probe_wait`: gap between the two indexing samples that detects writes.
    - `max_merge_per_run`: the flow refuses to merge more than this many indices in one pass.
    - `verify_wait`: settle time before the re-read.
    - `dry_run` and `auto_remediate`: the two safety gates. A merge runs only when `auto_remediate` is true and `dry_run` is false, then only after the `Pause` is resumed with `approved` true.

    ## Quick start

    1. Add the Slack webhook secret plus the Elasticsearch credentials if your cluster is secured.
    2. Set `elasticsearch_url` and run once with the defaults to see which cold indices are over the threshold and which are refused as still live.
    3. Set `index.blocks.write: true` on an index you have finished writing or set `require_write_block` to false if you want the write-activity probe to stand on its own.
    4. Run with `auto_remediate` true and `dry_run` false, then resume the `Pause` with `approved` true to compact the eligible indices.
    5. Set `disabled: false` on the `nightly` trigger to scan every night in report-only mode.

    ## How to extend

    - Point `index_pattern` at one family such as `logs-2024-*` to scope a pass to indices you know are closed to writes.
    - Set `require_write_block` to false and raise `write_probe_wait` on a cluster where cold indices are not block-marked, so the activity probe alone decides.
    - Chain a flow off this flow's FAILED state to open a ticket when a merge reclaims nothing, since that points at a merge-policy setting rather than a one-off.
    - Add a step that sets `index.blocks.write: true` on an index before merging it, turning this into the full ILM warm-phase readonly-then-forcemerge sequence for indices ILM is not managing.

