id: oidc-signing-key-rollover-guard
namespace: company.team
description: Check a trusted OIDC provider's signing keys before removing a key or deploying clients that depend on it.
inputs:
  - id: discovery_url
    type: STRING
    description: Full HTTPS URL of the OIDC discovery document. Verify this URL through your identity provider.
    defaults: https://accounts.google.com/.well-known/openid-configuration
  - id: expected_issuer
    type: STRING
    description: Exact issuer claim used by your OIDC clients. The discovery issuer must match it.
    defaults: https://accounts.google.com
  - id: jwks_url
    type: STRING
    description: Approved HTTPS key-set URL. The discovery document must name this exact URL.
    defaults: https://www.googleapis.com/oauth2/v3/certs
  - id: required_kids
    type: STRING
    description: Comma-separated key IDs that must remain available during your planned overlap window. Get the IDs from a trusted client or rollout manifest.
  - id: minimum_signing_keys
    type: INT
    defaults: 1
    description: Minimum number of usable public signing keys, from 1 to 100.
triggers:
  - id: periodic_key_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled until the URLs, approved key IDs, Slack webhook, and BLOCK handling have been tested.
    cron: "0 */6 * * *"
    disabled: true
tasks:
  - id: get_discovery
    type: io.kestra.plugin.core.http.Request
    description: Fetch the provider's issuer and JWKS URL through its HTTPS discovery endpoint.
    uri: "{{ inputs.discovery_url }}"
    method: GET
    options:
      followRedirects: false
      maxContentLength: 1048576
    headers:
      Accept: application/json
  - id: get_key_set
    type: io.kestra.plugin.core.http.Request
    description: Fetch the key set at the independently configured URL; never follow a JWKS URL chosen only by a remote discovery response.
    uri: "{{ inputs.jwks_url }}"
    method: GET
    options:
      followRedirects: false
      maxContentLength: 1048576
    headers:
      Accept: application/json
  - id: assess_key_overlap
    type: io.kestra.plugin.scripts.node.Script
    description: Check issuer and JWKS URL pins, public signing keys, duplicate identifiers and the required key IDs. Save the evidence before the gate.
    containerImage: node:22-alpine
    env:
      DISCOVERY_URL: "{{ inputs.discovery_url }}"
      EXPECTED_ISSUER: "{{ inputs.expected_issuer }}"
      JWKS_URL: "{{ inputs.jwks_url }}"
      REQUIRED_KIDS: "{{ inputs.required_kids }}"
      MINIMUM_SIGNING_KEYS: "{{ inputs.minimum_signing_keys }}"
    inputFiles:
      discovery.json: "{{ outputs.get_discovery.body }}"
      jwks.json: "{{ outputs.get_key_set.body }}"
    outputFiles:
      - oidc-key-rollover-report.json
    script: |
      const fs = require('fs');
      const MAX_DOCUMENT_BYTES = 1024 * 1024;
      function object(value) {
        return value !== null && typeof value === 'object' && !Array.isArray(value);
      }
      function readJson(filename) {
        const raw = fs.readFileSync(filename, 'utf8');
        if (Buffer.byteLength(raw, 'utf8') > MAX_DOCUMENT_BYTES) throw Error('Oversized OIDC document');
        let doc = JSON.parse(raw);
        if (typeof doc === 'string') doc = JSON.parse(doc);
        if (!object(doc)) throw Error('OIDC document must be a JSON object');
        return doc;
      }
      function httpsUrl(value, label) {
        if (typeof value !== 'string' || value.length > 2048) throw Error('Invalid ' + label);
        let url;
        try { url = new URL(value); } catch { throw Error('Invalid ' + label); }
        if (url.protocol !== 'https:' || !url.hostname || url.username || url.password || url.hash)
          throw Error(label + ' must be HTTPS without credentials or fragment');
        return value;
      }
      function requiredKeys(raw) {
        if (typeof raw !== 'string' || raw.length > 8192) throw Error('Invalid required_kids input');
        const kids = raw.split(',').map(x => x.trim());
        if (!kids.length || kids.length > 100 || kids.some(x => !x || x.length > 256))
          throw Error('Provide 1-100 nonempty required key IDs');
        if (new Set(kids).size !== kids.length) throw Error('Duplicate required key ID');
        return kids;
      }
      function signingKey(key) {
        if (!object(key) || typeof key.kid !== 'string' || !key.kid || key.kid.length > 256)
          return false;
        if (key.use !== undefined && key.use !== 'sig') return false;
        if (key.key_ops !== undefined && (!Array.isArray(key.key_ops) || !key.key_ops.includes('verify')))
          return false;
        if (key.kty === 'RSA') return typeof key.n === 'string' && !!key.n && typeof key.e === 'string' && !!key.e;
        if (key.kty === 'EC') return typeof key.crv === 'string' && !!key.crv && typeof key.x === 'string' && !!key.x && typeof key.y === 'string' && !!key.y;
        if (key.kty === 'OKP') return (key.crv === 'Ed25519' || key.crv === 'Ed448') && typeof key.x === 'string' && !!key.x;
        return false;
      }
      function assess(discovery, jwks, config) {
        const reasons = [];
        if (discovery.issuer !== config.expectedIssuer) reasons.push('Discovery issuer differs from the expected issuer');
        if (discovery.jwks_uri !== config.jwksUrl) reasons.push('Discovery JWKS URL differs from the approved URL');
        if (!Array.isArray(jwks.keys) || jwks.keys.length > 500) throw Error('Invalid JWKS keys array');
        const accepted = jwks.keys.filter(signingKey);
        const ids = accepted.map(key => key.kid);
        if (new Set(ids).size !== ids.length) reasons.push('Duplicate signing key IDs');
        if (ids.length < config.minimumSigningKeys) reasons.push('Too few usable public signing keys');
        const missing = config.requiredKids.filter(kid => !ids.includes(kid));
        if (missing.length) reasons.push('Required signing key IDs are absent');
        return {
          status: reasons.length ? 'BLOCK' : 'PASS',
          issuer: config.expectedIssuer,
          jwks_url: config.jwksUrl,
          keys_returned: jwks.keys.length,
          public_signing_keys: accepted.length,
          required_kids: config.requiredKids,
          present_signing_kids: ids,
          missing_required_kids: missing,
          reasons
        };
      }
      function main() {
        httpsUrl(process.env.DISCOVERY_URL, 'discovery_url');
        const issuer = httpsUrl(process.env.EXPECTED_ISSUER, 'expected_issuer');
        const jwksUrl = httpsUrl(process.env.JWKS_URL, 'jwks_url');
        const requiredKids = requiredKeys(process.env.REQUIRED_KIDS);
        const min = Number(process.env.MINIMUM_SIGNING_KEYS);
        if (!Number.isSafeInteger(min) || min < 1 || min > 100) throw Error('minimum_signing_keys must be 1-100');
        const result = assess(readJson('discovery.json'), readJson('jwks.json'), {
          expectedIssuer: issuer, jwksUrl, requiredKids, minimumSigningKeys: min
        });
        fs.writeFileSync('oidc-key-rollover-report.json', JSON.stringify(result, null, 2));
        console.log('::' + JSON.stringify({outputs: {
          status: result.status,
          missing_count: result.missing_required_kids.length,
          signing_key_count: result.public_signing_keys,
          reason_count: result.reasons.length
        }}) + '::');
        console.log('OIDC key rollover preflight: ' + result.status);
      }
      if (require.main === module) main();
  - id: publish_report
    type: io.kestra.plugin.core.output.OutputValues
    description: Publish the verdict and complete JSON evidence before a BLOCK fails the execution.
    values:
      status: "{{ outputs.assess_key_overlap.vars.status }}"
      report_uri: "{{ outputs.assess_key_overlap.outputFiles['oidc-key-rollover-report.json'] }}"
      missing_count: "{{ outputs.assess_key_overlap.vars.missing_count }}"
  - id: key_overlap_gate
    type: io.kestra.plugin.core.flow.If
    description: Stop downstream deployments when the issuer, key source, or required signing-key overlap is not safe.
    condition: "{{ outputs.assess_key_overlap.vars.status == 'BLOCK' }}"
    then:
      - id: alert_key_overlap
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Report a blocked rollover. The saved JSON report contains the exact reasons.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text":"OIDC signer rollover BLOCKED for {{ inputs.expected_issuer }}. Missing key IDs: {{ outputs.assess_key_overlap.vars.missing_count }}. Findings: {{ outputs.assess_key_overlap.vars.reason_count }}. Execution: {{ execution.id }}. Review the JSON report."}
      - id: stop_deployment
        type: io.kestra.plugin.core.execution.Fail
        description: Fail the preflight so dependent releases cannot interpret missing keys as a passing check.
        errorMessage: "OIDC key rollover preflight BLOCKED. Review oidc-key-rollover-report.json."
    else:
      - id: log_overlap_ready
        type: io.kestra.plugin.core.log.Log
        message: "OIDC key overlap PASS for {{ inputs.expected_issuer }}. Required key IDs were present at check time."
errors:
  - id: log_failed_check
    type: io.kestra.plugin.core.log.Log
    message: "OIDC key rollover check failed or blocked; no deployment approval. Execution {{ execution.id }}."
extend:
  title: Gate OIDC Signing-Key Rollovers with a Pinned JWKS
  metaTitle: OIDC JWKS Signing-Key Rollover Safety Gate
  shortDescription: Block a risky OIDC signing-key rollover if the provider no longer publishes key IDs required by your clients.
  metaDescription: Check a pinned OIDC issuer and JWKS for required signing keys. Save evidence, alert Slack, and stop unsafe releases.
  description: |
    Check OpenID Connect signing-key overlap before a client rollout or
    planned key retirement. The expected issuer, JWKS URL, and required key
    IDs must come from an independent, trusted configuration. This does not
    cryptographically verify a JWT, and PASS cannot guarantee future key availability.

    ## How it works

    1. get_discovery reads the configured OIDC discovery document over HTTPS.
    2. get_key_set reads the separately approved JWKS endpoint over HTTPS.
       Both requests reject redirects and limit the response body to 1 MiB.
    3. assess_key_overlap checks the exact issuer and JWKS URL values, the
       public signing-key shapes, key-ID uniqueness, and required key IDs.
       It writes a complete JSON report for both PASS and BLOCK decisions.
    4. publish_report exposes the verdict and report URI.
    5. key_overlap_gate alerts Slack and fails the execution on BLOCK.
       Malformed JSON, invalid configuration, and network failures fail the
       execution before the gate; they never produce PASS.

    ## What you get

    - A PASS/BLOCK preflight to use as a dependency of identity-aware releases.
    - A JSON report with present and missing key IDs, counts, and reasons.
    - Slack alerts for completed BLOCK decisions and a failed execution.

    ## Who it's for

    - Identity engineers managing issuer signing-key rotation.
    - Platform teams deploying services that verify OIDC ID tokens.
    - Security engineers reviewing SSO and API authentication changes.

    ## Why orchestrate this with Kestra

    Make signer overlap checks repeatable before deployment or on a schedule.
    The saved report gives operators evidence rather than a green HTTP probe.
    Kestra can block later tasks and notify responders about a failed preflight.

    ## Prerequisites

    - A Kestra worker with outbound HTTPS access to both public OIDC endpoints.
    - The Node Script and Slack notification plugins.
    - An independently approved issuer, JWKS endpoint URL, and list of key IDs.
    - A Slack webhook to receive completed BLOCK alerts.

    ### Secrets

    - SLACK_WEBHOOK_URL: incoming Slack webhook for a blocked preflight.
      No OIDC private keys or client credentials are required.

    ## Quick start

    1. Create SLACK_WEBHOOK_URL as a Kestra secret.
    2. Set discovery_url, expected_issuer, jwks_url, and required_kids.
       Get required_kids from a reviewed application rollout manifest or
       an approved list of key IDs, not from the live JWKS being checked.
    3. Run manually for a healthy issuer. Check
       outputs.publish_report.values.report_uri for the full JSON report.
    4. Repeat with a missing required_kids entry. Confirm the report is BLOCK,
       Slack receives an alert, and the execution fails.
    5. Enable the six-hour schedule only after setting valid defaults for
       required_kids and testing both paths. Defaults for the public Google
       endpoints are examples; use your own identity provider in production.

    ## How to extend

    - Compare the approved issuer's JWT signature algorithms with a client
      allowlist as part of a separate token-validation test.
    - Add a two-sample grace period before paging during planned rotations.
    - Persist reports for a history of signing-key overlap across releases.

    ## Limits

    - This verifies only public key metadata and key-ID availability at one point.
    - It does not prove key possession, verify signatures, test token expiry,
      check revocation, or fetch a token for an end-to-end sign-in test.
    - Signed JWTs can also be issued without a kid; this workflow requires
      IDs because it explicitly gates a key-ID based rotation strategy.
    - An operator must update required_kids after a reviewed retirement;
      copying the current JWKS into the trusted manifest defeats the gate.

    ## Links

    - [OpenID Connect Discovery](https://openid.net/specs/openid-connect-discovery-1_0.html)
    - [JSON Web Key Set](https://www.rfc-editor.org/rfc/rfc7517)
    - [Kestra HTTP Request plugin](https://kestra.io/plugins/core/io.kestra.plugin.core.http.Request)
    - [Kestra Node Script plugin](https://kestra.io/plugins/plugin-scripts-node/io.kestra.plugin.scripts.node.Script)
    - Created by [vivekyarra](https://github.com/vivekyarra).
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Policy & Compliance
    - Infrastructure Automation
  ee: false
  demo: false
