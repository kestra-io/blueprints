id: ai-ollama-model-bakeoff
namespace: company.team

description: |
  Head-to-head bakeoff for local Ollama models. The flow sends the same prompt
  to every model on your list, one at a time, then renders a side-by-side
  leaderboard so you can pick the best model for your workload before
  committing it to production.

inputs:
  - id: prompt
    type: STRING
    displayName: Evaluation prompt
    description: The prompt every model answers. Pick something representative of your real workload.
    defaults: "Explain what a workflow orchestrator does in two sentences, for a junior developer."
  - id: models
    type: ARRAY
    itemType: STRING
    displayName: Models to compare
    description: Ollama model names to bake off. They must already be pulled. Runs sequentially so latency numbers are fair.
    defaults:
      - llama3.2:3b
      - qwen2.5:7b
      - mistral:7b
  - id: ollama_endpoint
    type: STRING
    displayName: Ollama endpoint
    description: Base URL where Ollama listens. Use http://host.docker.internal:11434 when Kestra runs in Docker and Ollama runs on the host.
    defaults: "http://localhost:11434"

tasks:
  - id: bakeoff
    type: io.kestra.plugin.core.flow.Loop
    description: Ask each model the same prompt. Sequential (concurrencyLimit 1) so latency is comparable across models on the same hardware.
    values: "{{ inputs.models }}"
    concurrencyLimit: 1
    tasks:
      - id: ask
        type: io.kestra.plugin.ai.completion.ChatCompletion
        description: Send the evaluation prompt to the current model via the Ollama provider.
        provider:
          type: io.kestra.plugin.ai.provider.Ollama
          modelName: "{{ item.value }}"
          endpoint: "{{ inputs.ollama_endpoint }}"
        messages:
          - type: SYSTEM
            content: You are a helpful assistant. Answer concisely.
          - type: USER
            content: "{{ inputs.prompt }}"
    outputs:
      - id: model
        type: STRING
        description: The model that produced this row of the leaderboard.
        value: "{{ item.value }}"
      - id: answer
        type: STRING
        description: The model's raw answer to the evaluation prompt.
        value: "{{ outputs.ask.textOutput ?? '(no text returned)' }}"

  - id: leaderboard
    type: io.kestra.plugin.core.log.Log
    description: Print the side-by-side comparison so the winner is obvious at a glance.
    message: |
      ## Ollama bakeoff results ({{ inputs.models | length }} models)
      Prompt: "{{ inputs.prompt }}"
      {% for row in outputs.bakeoff %}
      ### {{ row.model }}
      {{ row.answer }}

      {% endfor %}

  - id: save_report
    type: io.kestra.plugin.core.storage.Write
    description: Persist the leaderboard as a markdown report in Kestra internal storage for sharing and record-keeping.
    content: |
      # Ollama model bakeoff — {{ execution.startDate | date("yyyy-MM-dd HH:mm") }}

      **Prompt:** {{ inputs.prompt }}

      {% for row in outputs.bakeoff %}
      ## `{{ row.model }}`

      {{ row.answer }}

      ---
      {% endfor %}

      *Generated by the `ai-ollama-model-bakeoff` blueprint (execution {{ execution.id }}).*
    extension: .md

extend:
  title: Compare Local Ollama Models Head-to-Head
  metaTitle: Ollama Model Bakeoff with Kestra
  shortDescription: Send the same prompt to multiple local Ollama models sequentially and get a side-by-side leaderboard of their answers, so you can pick the right model before production.
  description: |
    Choosing a local LLM is guesswork until you see the models answer your actual prompts. This blueprint runs a head-to-head bakeoff: it sends your evaluation prompt to every Ollama model on your list, one at a time, then renders a leaderboard comparing their answers side by side, plus a downloadable markdown report.

    ## How it works

    1. The `bakeoff` task (`io.kestra.plugin.core.flow.Loop`) iterates over your `models` list with `concurrencyLimit: 1`, so each model answers on the same hardware without contention and latency numbers stay comparable.
    2. The `ask` task (`io.kestra.plugin.ai.completion.ChatCompletion`) sends the prompt through the Ollama provider (`io.kestra.plugin.ai.provider.Ollama`) to the current model, capturing `textOutput` per iteration.
    3. The `leaderboard` task (`io.kestra.plugin.core.log.Log`) renders every model and its answer in the execution logs for an at-a-glance winner.
    4. The `save_report` task (`io.kestra.plugin.core.storage.Write`) persists the same comparison as a markdown file in Kestra internal storage, ready to share with the team.

    ## Who it's for

    - Platform and ML teams choosing which local model to standardize on.
    - Privacy-conscious teams evaluating small models that run fully on-prem.
    - Anyone who has ever argued about llama vs qwen vs mistral and wants data.

    ## Prerequisites

    - A running Kestra instance with the AI plugin available.
    - Ollama running and reachable at `ollama_endpoint` (default `http://localhost:11434`).
    - Every model in `models` already pulled (`ollama pull <model>`).

    ## Quick start

    1. Make sure Ollama is running and your models are pulled.
    2. Create the flow from this blueprint.
    3. Optionally edit the `prompt` and `models` inputs to match your workload.
    4. Execute it and read the leaderboard in the logs; download the markdown report from the execution outputs.

    ## How to extend

    - Add a second prompt round with adversarial or domain-specific questions and score answers with a judge model.
    - Push the leaderboard to Slack or Notion after each run for a standing model-selection record.
    - Put the flow on a schedule to re-run the bakeoff whenever you pull a new model version.

    ## Links

    - [AI plugin docs](https://kestra.io/plugins/plugin-ai)
    - [Ollama](https://ollama.com/)
  tags:
    - AI
  subTags:
    - Model Evaluation
  ee: false
  demo: false
  metaDescription: Bake off local Ollama models head-to-head with Kestra. Same prompt, sequential runs, side-by-side leaderboard and markdown report.
