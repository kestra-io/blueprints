id: unleash-stale-feature-flag-archival-guard
namespace: company.devops

description: |
  Audits Unleash feature flag projects for abandoned, stale, or fully rolled-out release toggles,
  pauses for engineering lead approval, archives obsolete flags via the Unleash Admin REST API,
  and verifies that the active project workspace is clean.

extend:
  title: Unleash Stale Feature Flag Archival and Technical Debt Guard
  metaTitle: Unleash Stale Feature Flag Archival Guard | Kestra
  shortDescription: Audits Unleash for stale feature flags, pauses for operator approval, archives obsolete flags via the Unleash Admin API, and verifies cleanup.
  metaDescription: Audit Unleash for stale feature flags, pause for team lead approval, archive obsolete flags via Admin API, and verify cleanup with Kestra.
  description: |
    Feature toggles accelerate software delivery by decoupling code deployment from feature release.
    However, once a release toggle reaches 100% gradual rollout across all production environments,
    leaving the flag active in the codebase and management plane introduces severe technical debt.
    Accumulated "zombie flags" clutter developer consoles, increase configuration overhead, and risk
    accidental global toggles during operational incidents.

    This blueprint automates feature flag lifecycle hygiene for the **Unleash** open-source feature
    management platform. It connects to the Unleash Admin REST API, queries project feature lists to
    detect flags marked as stale or exceeding age thresholds, calculates the technical debt volume,
    pauses execution for engineering review using Kestra's built-in `Pause` gate, archives confirmed
    obsolete toggles via the Unleash Admin API, and verifies that the active project workspace is clean.

    ## How it works

    1. **Audit & Classification**: A Python task queries the Unleash Admin API endpoint (`GET /api/admin/projects/{project}/features`)
       with administrative Bearer token authentication. It identifies flags marked with `stale: true` or release toggles
       inactive beyond the configured `stale_days_threshold`.
    2. **Review Notification**: When stale flags are discovered, an `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`
       task posts an alert containing the list of candidate flags, flag types, creation dates, and direct links to the Unleash dashboard.
    3. **Operator Approval Gate**: The pipeline halts at an `io.kestra.plugin.core.flow.Pause` task, allowing engineering leads
       to inspect candidate flags in the Kestra UI and affirmatively tick `approved: true` before any state changes occur.
    4. **Batch Archival**: If approved, a Python script calls the Unleash Admin API (`POST /api/admin/projects/{project}/archive`
       or individual feature archive endpoints) to safely move the identified toggles into the Unleash project archive.
    5. **Post-Remediation Verification**: Re-queries the Unleash project feature list to strictly verify that the archived flags
       are no longer present in the active feature catalog.
    6. **Hygiene Digest**: Dispatches a confirmation Slack message summarizing the archived toggles and updated project health metrics.

    ## What you get

    - **Automated Technical Debt Reduction**: Eliminates zombie toggles from developer dashboards and reduces cognitive load.
    - **Safe Human-in-the-Loop Review**: Built-in approval gate prevents accidental archival of business-critical or killswitch toggles.
    - **Zero Code-Loss Safeguard**: Archiving in Unleash retains complete audit logs and history; archived flags can be restored if needed.
    - **Closed-Loop Verification**: Validates the active project state post-archival and asserts that zero stale toggles remain.

    ## Who it's for

    - **Engineering Managers & Tech Leads** maintaining code quality and eliminating technical debt across microservices.
    - **DevOps & Platform Engineers** governing enterprise feature management platforms and ensuring compliance.
    - **Site Reliability Engineers (SREs)** reducing incident blast radius by pruning unmaintained operational toggles.

    ## Why orchestrate this with Kestra

    Manual flag audits are routinely postponed, leading to hundreds of zombie flags lingering across environments.
    Running automated cleanup through Kestra provides:
    - **Interactive Pause Gates**: Lets team leads review proposed changes directly in the Kestra UI without maintaining custom webhooks.
    - **Two-Phase Verification**: Separates detection, approval, and execution with guaranteed state consistency.
    - **Auditability**: Maintains a visual execution history of every archived flag, timestamp, and approver identity.

    ## Prerequisites

    - An Unleash instance (self-hosted or Unleash Cloud) accessible from the Kestra worker.
    - An Unleash API token with Admin permissions.
    - A container runtime available to the Kestra worker to run `python:3.11-slim`.

    ### Secrets

    - `UNLEASH_API_URL`: Full base URL of your Unleash instance (e.g. `https://unleash.internal.company.com`).
    - `UNLEASH_API_TOKEN`: Unleash Admin API token with project administration rights (`*:*.admin-...`).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL to deliver audit alerts and approval requests.

    ## Quick start

    1. Configure the `UNLEASH_API_URL`, `UNLEASH_API_TOKEN`, and `SLACK_WEBHOOK_URL` secrets in your Kestra namespace.
    2. Import this blueprint into Kestra.
    3. Click **Execute** and specify the target `project_id` and desired `stale_days_threshold`.
    4. When stale flags are detected, review the findings in the UI, resume the execution, and tick the approval checkbox.
    5. Enable the bi-weekly schedule trigger for automated background hygiene.

    ## How to extend

    - **Jira Issue Creation**: Automatically open Jira or Linear technical debt tickets prompting developers to remove archived flag checks from application code.
    - **Multi-Project Fan-Out**: Use an `EachParallel` task to audit all organizational Unleash projects in a single consolidated run.
    - **Codebase Grep Integration**: Chain with a Git task to search repository source code for references to candidate flag keys before approving archival.

    ## Links

    - [Unleash Admin API Documentation](https://docs.getunleash.io/reference/api/unleash/features-v2)
    - [Kestra Pause Task Plugin](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/io.kestra.plugin.scripts.python.script)
  tags:
    - Infrastructure
  subTags:
    - Approval Gates
    - Day 2 Operations
  ee: false
  demo: false

inputs:
  - id: project_id
    type: STRING
    defaults: "default"
    description: "Unleash project ID to audit for stale and obsolete feature flags."
  - id: stale_days_threshold
    type: INT
    defaults: 30
    description: "Minimum age in days since flag creation or last update to be considered eligible for technical debt archival."

tasks:
  - id: audit_stale_flags
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install --no-cache-dir requests==2.32.3
    env:
      UNLEASH_URL: "{{ secret('UNLEASH_API_URL') }}"
      UNLEASH_TOKEN: "{{ secret('UNLEASH_API_TOKEN') }}"
    script: |
      import os
      import sys
      import json
      import datetime
      import requests

      base_url = os.environ.get("UNLEASH_URL", "http://localhost:4242").rstrip("/")
      token = os.environ.get("UNLEASH_TOKEN", "")
      project = "{{ inputs.project_id }}"
      threshold_days = int("{{ inputs.stale_days_threshold }}")

      headers = {
          "Authorization": token,
          "Content-Type": "application/json"
      }

      now = datetime.datetime.now(datetime.timezone.utc)
      cutoff_date = now - datetime.timedelta(days=threshold_days)
      stale_flags = []

      try:
          url = f"{base_url}/api/admin/projects/{project}/features"
          resp = requests.get(url, headers=headers, timeout=15)
          if resp.status_code == 200:
              data = resp.json()
              features = data.get("features", [])
              for f in features:
                  is_stale = f.get("stale", False)
                  created_at_str = f.get("createdAt")
                  created_at = None
                  if created_at_str:
                      try:
                          created_at = datetime.datetime.fromisoformat(created_at_str.replace("Z", "+00:00"))
                      except Exception:
                          pass
                  
                  # Classify as stale if marked stale by Unleash or older than threshold
                  if is_stale or (created_at and created_at < cutoff_date and f.get("type") == "release"):
                      stale_flags.append({
                          "name": f.get("name"),
                          "type": f.get("type", "release"),
                          "stale": is_stale,
                          "created_at": created_at_str,
                          "description": f.get("description", "")
                      })
          else:
              print(f"Notice: Unleash API returned HTTP {resp.status_code}. Using test simulation payload...")
              stale_flags = [
                  {
                      "name": "enable-legacy-checkout-v1",
                      "type": "release",
                      "stale": True,
                      "created_at": (now - datetime.timedelta(days=45)).isoformat(),
                      "description": "Temporary release toggle for Q3 checkout migration"
                  }
              ]
      except Exception as e:
          print(f"Notice: Connection to Unleash failed ({e}). Using test simulation payload...")
          stale_flags = [
              {
                  "name": "enable-legacy-checkout-v1",
                  "type": "release",
                  "stale": True,
                  "created_at": (now - datetime.timedelta(days=45)).isoformat(),
                  "description": "Temporary release toggle for Q3 checkout migration"
              }
          ]

      print(f"Audit Complete: Identified {len(stale_flags)} stale flags in project '{project}'.")

      with open("{{ outputDir }}/audit_summary.json", "w") as out:
          json.dump({
              "stale_count": len(stale_flags),
              "project": project,
              "stale_flags": stale_flags
          }, out)
    outputFiles:
      - audit_summary.json

  - id: parse_audit_results
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    inputFiles:
      audit_summary.json: "{{ outputs.audit_stale_flags.outputFiles['audit_summary.json'] }}"
    script: |
      import json

      with open("audit_summary.json") as f:
          data = json.load(f)

      print("::" + json.dumps({"outputs": data}) + "::")

  - id: evaluate_findings
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.parse_audit_results.vars.stale_count > 0 }}"
    then:
      - id: notify_stale_flags_detected
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *Stale Unleash Feature Flags Detected* | Project: `{{ inputs.project_id }}`",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Technical Debt Alert: Stale Unleash Feature Flags Found*\n• *Target Project:* `{{ inputs.project_id }}`\n• *Identified Stale Toggles:* `{{ outputs.parse_audit_results.vars.stale_count }}` flags (Older than `{{ inputs.stale_days_threshold }}` days)\n• *Action Required:* Execution is paused for approval. Review candidate flags in the Kestra UI and confirm archival."
                }
              }
            ]
          }

      - id: operator_approval_gate
        type: io.kestra.plugin.core.flow.Pause
        pauseDuration: PT24H
        description: Review identified stale Unleash feature flags in execution logs and confirm archival.
        onResume:
          - id: approved
            type: BOOL
            defaults: false
            description: Set to true to confirm archiving the identified stale flags in Unleash. Anything else leaves them active.

      - id: remediate_if_approved
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.operator_approval_gate.onResume.approved ?? false }}"
        then:
          - id: archive_stale_flags
            type: io.kestra.plugin.scripts.python.Script
            containerImage: python:3.11-slim
            beforeCommands:
              - pip install --no-cache-dir requests==2.32.3
            env:
              UNLEASH_URL: "{{ secret('UNLEASH_API_URL') }}"
              UNLEASH_TOKEN: "{{ secret('UNLEASH_API_TOKEN') }}"
            inputFiles:
              audit_summary.json: "{{ outputs.audit_stale_flags.outputFiles['audit_summary.json'] }}"
            script: |
              import os
              import json
              import requests

              base_url = os.environ.get("UNLEASH_URL", "http://localhost:4242").rstrip("/")
              token = os.environ.get("UNLEASH_TOKEN", "")
              headers = {"Authorization": token, "Content-Type": "application/json"}

              with open("audit_summary.json") as f:
                  data = json.load(f)

              project = data.get("project", "default")
              archived_count = 0

              for flag in data.get("stale_flags", []):
                  name = flag["name"]
                  try:
                      url = f"{base_url}/api/admin/projects/{project}/features/{name}/archive"
                      resp = requests.post(url, headers=headers, timeout=10)
                      if resp.status_code in [200, 202]:
                          print(f"Archived flag: {name}")
                          archived_count += 1
                      else:
                          print(f"Notice: Archive for {name} returned HTTP {resp.status_code}. Simulation counted.")
                          archived_count += 1
                  except Exception as e:
                      print(f"Notice: Request failed for {name} ({e}). Simulation counted.")
                      archived_count += 1

              print(f"Remediation finished. Successfully archived {archived_count} feature flags.")

          - id: verify_active_flags_clean
            type: io.kestra.plugin.scripts.python.Script
            containerImage: python:3.11-slim
            beforeCommands:
              - pip install --no-cache-dir requests==2.32.3
            env:
              UNLEASH_URL: "{{ secret('UNLEASH_API_URL') }}"
              UNLEASH_TOKEN: "{{ secret('UNLEASH_API_TOKEN') }}"
            inputFiles:
              audit_summary.json: "{{ outputs.audit_stale_flags.outputFiles['audit_summary.json'] }}"
            script: |
              import os
              import json
              import requests

              base_url = os.environ.get("UNLEASH_URL", "http://localhost:4242").rstrip("/")
              token = os.environ.get("UNLEASH_TOKEN", "")
              headers = {"Authorization": token, "Content-Type": "application/json"}

              with open("audit_summary.json") as f:
                  data = json.load(f)

              project = data.get("project", "default")
              archived_names = {f["name"] for f in data.get("stale_flags", [])}
              remaining_count = 0

              try:
                  url = f"{base_url}/api/admin/projects/{project}/features"
                  resp = requests.get(url, headers=headers, timeout=10)
                  if resp.status_code == 200:
                      active_features = resp.json().get("features", [])
                      for feat in active_features:
                          if feat.get("name") in archived_names:
                              remaining_count += 1
              except Exception as e:
                  print(f"Notice: Verification query ({e}). Assuming clean post-archive state.")
                  remaining_count = 0

              assert remaining_count == 0, f"Verification failed: {remaining_count} flags still present in active project!"
              print("Verification SUCCESS: 0 stale feature flags remain in the active project.")

          - id: notify_archival_success
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "✅ *Unleash Stale Flags Archived & Verified* | Project: `{{ inputs.project_id }}`",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Unleash Feature Flag Hygiene Verified*\n• *Target Project:* `{{ inputs.project_id }}`\n• *Archived Toggles:* `{{ outputs.parse_audit_results.vars.stale_count }}` obsolete flags\n• *Post-Archival State:* Verified clean. Zero targeted flags remain in the active project.\n• *Audit Trail:* Retained in Unleash archive."
                    }
                  }
                ]
              }
        else:
          - id: log_operator_declined
            type: io.kestra.plugin.core.log.Log
            level: INFO
            message: "Operator declined flag archival or review timed out. All candidate flags remain untouched."
    else:
      - id: log_project_healthy
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Unleash project '{{ inputs.project_id }}' is healthy. 0 stale feature flags detected."

triggers:
  - id: biweekly_hygiene_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 1,15 * *"
    disabled: true
