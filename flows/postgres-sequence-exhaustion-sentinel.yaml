id: postgres-sequence-exhaustion-sentinel
namespace: company.team
description: |
  Automated PostgreSQL primary key sequence exhaustion sentinel. Audits pg_sequences across databases
  against integer capacity boundaries and alerts DBAs before sequence overflow halts application insert writes.

concurrency:
  limit: 1

inputs:
  - id: postgres_url
    type: STRING
    displayName: PostgreSQL JDBC URL
    defaults: "jdbc:postgresql://postgres.internal:5432/production"
    description: "JDBC connection URL for the target PostgreSQL database."

  - id: postgres_username
    type: STRING
    displayName: Database Username
    defaults: "db_monitor"
    description: "Database user with permissions to query pg_sequences system catalog."

  - id: capacity_warning_percentage
    type: FLOAT
    displayName: Capacity Warning Threshold
    defaults: 80.0
    description: "Percentage of sequence capacity used before raising an operational alert (e.g. 80.0 = 80%)."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#dba-alerts"
    description: "Slack channel destination for sequence capacity warning alerts."

triggers:
  - id: daily_sequence_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audits sequence capacity daily at 06:00 UTC."
    cron: "0 6 * * *"

tasks:
  - id: query_sequence_inventory
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: "Queries pg_sequences catalog to calculate current utilization percentage of every sequence."
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.postgres_username }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        schemaname,
        sequencename,
        data_type,
        last_value,
        max_value,
        ROUND((last_value::numeric / NULLIF(max_value, 0)::numeric) * 100, 2) AS usage_percent
      FROM pg_sequences
      WHERE last_value IS NOT NULL
        AND max_value > 0
      ORDER BY usage_percent DESC;

  - id: analyze_sequence_capacities
    type: io.kestra.plugin.scripts.python.Script
    description: "Filters sequences approaching maximum capacity limits and compiles remediation instructions."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      sequences.json: "{{ outputs.query_sequence_inventory.rows | default('[]') | json }}"
    outputFiles:
      - sequence_risk_report.json
    script: |
      import json
      from kestra import Kestra

      with open("sequences.json", "r", encoding="utf-8") as f:
          sequences = json.load(f)

      threshold = float("{{ inputs.capacity_warning_percentage }}")
      critical_sequences = []

      for s in sequences:
          schema = s.get("schemaname", "public")
          seq_name = s.get("sequencename", "unknown")
          data_type = s.get("data_type", "bigint")
          last_val = s.get("last_value", 0)
          max_val = s.get("max_value", 1)
          usage_pct = float(s.get("usage_percent", 0.0))

          if usage_pct >= threshold:
              critical_sequences.append({
                  "full_sequence": f"{schema}.{seq_name}",
                  "data_type": data_type,
                  "last_value": last_val,
                  "max_value": max_val,
                  "usage_percent": usage_pct,
                  "remediation": f"ALTER SEQUENCE {schema}.{seq_name} AS bigint;" if data_type != "bigint" else "Archive old partitions or reset sequence."
              })

      risk_detected = len(critical_sequences) > 0

      report = {
          "total_sequences_checked": len(sequences),
          "warning_threshold_pct": threshold,
          "critical_sequences_count": len(critical_sequences),
          "critical_sequences": critical_sequences,
          "risk_detected": risk_detected
      }

      with open("sequence_risk_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "risk_detected": risk_detected,
          "critical_count": len(critical_sequences),
          "top_sequence": critical_sequences[0]["full_sequence"] if critical_sequences else "None",
          "top_usage_pct": critical_sequences[0]["usage_percent"] if critical_sequences else 0.0,
          "top_data_type": critical_sequences[0]["data_type"] if critical_sequences else "None"
      })

  - id: evaluate_risk_trigger
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether any sequences breached the capacity warning threshold."
    condition: "{{ outputs.analyze_sequence_capacities.vars.risk_detected }}"
    then:
      - id: alert_dba_sequence_exhaustion
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches sequence capacity exhaustion alert card to DBA channel via Slack."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*PostgreSQL Auto-Increment Sequence Capacity Exhaustion Alert*\n• *Cluster Endpoint*: `{{ inputs.postgres_url }}`\n• *Sequences Exceeding Threshold*: {{ outputs.analyze_sequence_capacities.vars.critical_count }}\n• *Top At-Risk Sequence*: `{{ outputs.analyze_sequence_capacities.vars.top_sequence }}`\n• *Current Utilization*: {{ outputs.analyze_sequence_capacities.vars.top_usage_pct }}% of max capacity (Data Type: `{{ outputs.analyze_sequence_capacities.vars.top_data_type }}`)\n• *Operational Impact*: When a sequence reaches its maximum value, subsequent `INSERT` statements fail with `integer out of range`, halting application write transactions.\n• *Recommended Remediation*: Schedule schema migration to alter sequence and underlying table column to `bigint` before sequence reaches 100% capacity."
          }

    else:
      - id: log_compliant_sequences_status
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation of safe sequence capacity margins."
        message: "PostgreSQL sequence audit compliant. All sequences are operating comfortably below {{ inputs.capacity_warning_percentage }}% capacity."

  - id: export_sequence_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON sequence audit manifest for capacity planning."
    format: |
      {
        "pipeline": "postgres-sequence-exhaustion-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "critical_count": {{ outputs.analyze_sequence_capacities.vars.critical_count }},
        "status": "{{ outputs.analyze_sequence_capacities.vars.risk_detected ? 'EXHAUSTION_WARNING' : 'HEALTHY' }}"
      }

extend:
  shortDescription: "Audits pg_sequences to detect primary key sequences approaching integer capacity limits."
  title: "PostgreSQL Sequence Exhaustion Sentinel"
  metaTitle: "PostgreSQL Sequence Exhaustion Sentinel | Kestra Blueprint"
  metaDescription: "Monitors PostgreSQL primary key sequences to alert database administrators before 32-bit integer sequence overflow halts application insert writes."
  description: |
    In PostgreSQL applications, primary keys are traditionally created using `serial` (a 32-bit integer sequence capped at 2,147,483,647). As business transaction volumes expand, high-write tables, such as audit logs, payment transactions, and telemetry events, quietly consume billions of sequence values.

    When a sequence reaches its maximum integer limit, PostgreSQL throws a fatal runtime exception: `ERROR: nextval: reached maximum value of sequence`. Subsequent `INSERT` statements are rejected, causing immediate application outages for end users.

    Migrating a high-traffic table from a 32-bit integer to a 64-bit `bigint` under emergency outage conditions requires downtime and exclusive locks. This blueprint implements a proactive sentinel that audits `pg_sequences` daily, detects sequences crossing 80% capacity, and alerts database administrators with exact remediation steps months before outages occur.

    ## How it works

    1. **Scheduled Daily Audit**: The `daily_sequence_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) executes every morning at 06:00 UTC.
    2. **Sequence Metadata Query**: The `query_sequence_inventory` task (`io.kestra.plugin.jdbc.postgresql.Query`) queries `pg_sequences` for `last_value`, `max_value`, and data type definitions.
    3. **Python Capacity Scoring**: The `analyze_sequence_capacities` task (`io.kestra.plugin.scripts.python.Script`) filters sequences exceeding `capacity_warning_percentage` and compiles `sequence_risk_report.json`.
    4. **Condition Branching**: The `evaluate_risk_trigger` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether any critical sequences were detected.
    5. **Slack Alert Dispatch**: When sequences approach capacity, `alert_dba_sequence_exhaustion` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable triage card with migration recommendations.
    6. **Capacity Manifest**: The `export_sequence_manifest` task records sequence capacity metrics for compliance tracking.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Daily 06:00 UTC] --> B[query_sequence_inventory: PostgreSQL]
        B --> C[analyze_sequence_capacities: Python Capacity Analyzer]
        C --> D{Sequence Capacity Exceeded?}
        D -- Yes --> E[alert_dba_sequence_exhaustion: Slack]
        D -- No --> F[log_compliant_sequences_status: Log]
        E --> G[export_sequence_manifest: Return JSON]
        F --> G
    ```

    ## Use cases

    - **Application Write Outage Prevention**: Avoid fatal sequence overflow runtime errors on high-write transactional tables.
    - **Proactive Schema Migration Planning**: Identify sequences needing migration from integer to bigint months ahead of capacity limits.
    - **Automated Multi-Schema Auditing**: Inspect all system and application sequences across every namespace in PostgreSQL.

    ## What you get

    - Proactive detection of primary key sequence exhaustion before production outages happen.
    - Automated catalog-wide scan of all PostgreSQL schemas and sequences.
    - Precise calculation of percentage utilized, current value, and maximum value.
    - Actionable migration guidance detailing column and sequence type alterations.

    ## Who it is for

    - PostgreSQL Database Administrators managing high-volume production tables.
    - Backend Engineering Leads designing scalable database schemas.
    - Site Reliability Engineers preventing unexpected database write lockups.

    ## Why orchestrate this with Kestra

    Ad-hoc SQL scripts often get forgotten until an integer overflow brings down an entire payment or user-registration flow. Kestra automates the inspection, analysis, and alerting into a scheduled, auditable workflow with zero ongoing maintenance.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `postgres_url` | STRING | `jdbc:postgresql://...` | JDBC URL of PostgreSQL database. |
    | `postgres_username` | STRING | `db_monitor` | Monitoring database user with catalog access. |
    | `capacity_warning_percentage` | FLOAT | `80.0` | Warning threshold percentage (e.g. 80.0 = 80%). |
    | `slack_channel` | STRING | `#dba-alerts` | Slack channel destination for alerts. |

    ## Expected outputs

    - `{{ outputs.analyze_sequence_capacities.vars.risk_detected }}`: Boolean flag indicating if any sequence breached the threshold.
    - `{{ outputs.analyze_sequence_capacities.vars.top_sequence }}`: Schema-qualified name of the sequence with highest utilization.
    - `{{ outputs.analyze_sequence_capacities.vars.top_usage_pct }}`: Utilization percentage of the top offender.
    - `{{ outputs.analyze_sequence_capacities.outputFiles['sequence_risk_report.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - PostgreSQL server (version 10 or later) accessible via JDBC (port 5432).
    - Database user credentials configured in Kestra secrets.
    - Slack Incoming Webhook configured for your DBA operations channel.

    ### Secrets

    - `POSTGRES_PASSWORD`: Password for the PostgreSQL database user.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI to perform an initial sequence utilization audit.
    4. Review execution outputs to inspect sequence utilization percentages.

    ## Common pitfalls and troubleshooting

    - **Altering Sequence vs Column**: Upgrading a sequence with `ALTER SEQUENCE ... AS bigint` is insufficient if the underlying table column is still defined as `integer`; both must be migrated to `bigint`.
    - **Table Lock on Type Change**: Running `ALTER TABLE t ALTER COLUMN id TYPE bigint` requires an exclusive table rewrite lock on older PostgreSQL versions; plan schema migrations during scheduled maintenance or use shadow columns.
    - **Negative Sequences**: Sequences configured with negative steps or cycling behavior require custom boundary calculations.

    ## How to extend

    - Add `io.kestra.plugin.jdbc.postgresql.Query` to inspect foreign key columns pointing to the expiring primary key sequence to ensure related tables are migrated concurrently.
    - Track sequence consumption velocity over 30 days to calculate estimated days until 100% capacity.
    - Integrate with Jira to automatically file schema migration tickets for engineering teams.

    ## Links

    - Kestra PostgreSQL Plugin Documentation: https://kestra.io/plugins/plugin-jdbc-postgres
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - PostgreSQL Sequences Catalog Documentation: https://www.postgresql.org/docs/current/view-pg-sequences.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
