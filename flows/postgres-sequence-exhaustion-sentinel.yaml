id: postgres-sequence-exhaustion-sentinel
namespace: company.team

inputs:
  - id: postgres_url
    type: STRING
    defaults: "jdbc:postgresql://postgres.internal:5432/production"
    description: "JDBC connection URL for the target PostgreSQL database."

  - id: postgres_username
    type: STRING
    defaults: "db_monitor"
    description: "Database user with permissions to query pg_sequences system catalog."

  - id: capacity_warning_percentage
    type: FLOAT
    defaults: 80.0
    description: "Percentage of sequence capacity used before raising an operational alert (80.0 = 80%)."

  - id: slack_webhook_url
    type: STRING
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
    description: "Slack Incoming Webhook URL for sequence capacity alerts."

tasks:
  - id: query_sequence_inventory
    type: io.kestra.plugin.jdbc.postgres.Query
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.postgres_username }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        schemaname,
        sequencename,
        data_type,
        last_value,
        max_value,
        ROUND((last_value::numeric / NULLIF(max_value, 0)::numeric) * 100, 2) AS usage_percent
      FROM pg_sequences
      WHERE last_value IS NOT NULL
        AND max_value > 0
      ORDER BY usage_percent DESC;

  - id: analyze_sequence_capacities
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      sequences.json: "{{ outputs.query_sequence_inventory.rows | default('[]') | json }}"
    outputFiles:
      - sequence_risk_report.json
    script: |
      import json
      from kestra import Kestra

      with open("sequences.json", "r", encoding="utf-8") as f:
          sequences = json.load(f)

      threshold = float("{{ inputs.capacity_warning_percentage }}")
      critical_sequences = []

      for s in sequences:
          schema = s.get("schemaname", "public")
          seq_name = s.get("sequencename", "unknown")
          data_type = s.get("data_type", "bigint")
          last_val = s.get("last_value", 0)
          max_val = s.get("max_value", 1)
          usage_pct = float(s.get("usage_percent", 0.0))

          if usage_pct >= threshold:
              critical_sequences.append({
                  "full_sequence": f"{schema}.{seq_name}",
                  "data_type": data_type,
                  "last_value": last_val,
                  "max_value": max_val,
                  "usage_percent": usage_pct,
                  "remediation": f"ALTER SEQUENCE {schema}.{seq_name} AS bigint;" if data_type != "bigint" else "Archive old partitions or reset sequence."
              })

      risk_detected = len(critical_sequences) > 0

      report = {
          "total_sequences_checked": len(sequences),
          "warning_threshold_pct": threshold,
          "critical_sequences_count": len(critical_sequences),
          "critical_sequences": critical_sequences,
          "risk_detected": risk_detected
      }

      with open("sequence_risk_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "risk_detected": risk_detected,
          "critical_count": len(critical_sequences),
          "top_sequence": critical_sequences[0]["full_sequence"] if critical_sequences else "None",
          "top_usage_pct": critical_sequences[0]["usage_percent"] if critical_sequences else 0.0
      })

  - id: evaluate_risk_trigger
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.analyze_sequence_capacities.vars.risk_detected }}"
    then:
      - id: alert_dba_sequence_exhaustion
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ inputs.slack_webhook_url }}"
        payload: |
          {
            "text": "PostgreSQL Sequence Capacity Warning: Found {{ outputs.analyze_sequence_capacities.vars.critical_count }} sequence(s) exceeding {{ inputs.capacity_warning_percentage }}% capacity threshold. Primary sequence affected: `{{ outputs.analyze_sequence_capacities.vars.top_sequence }}` ({{ outputs.analyze_sequence_capacities.vars.top_usage_pct }}% used). Alter sequence data type to bigint before primary key integer overflow halts application writes."
          }

  - id: log_sequence_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "PostgreSQL sequence audit completed. Critical sequences count: {{ outputs.analyze_sequence_capacities.vars.critical_count }}. Top usage: {{ outputs.analyze_sequence_capacities.vars.top_usage_pct }}%."

triggers:
  - id: daily_sequence_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"

extend:
  title: "PostgreSQL Sequence Exhaustion Sentinel"
  shortDescription: "Audits pg_sequences to detect primary key sequences approaching integer capacity limits."
  metaTitle: "PostgreSQL Sequence Exhaustion Sentinel | Kestra Blueprint"
  metaDescription: "Monitors PostgreSQL primary key sequences to alert database administrators before 32-bit integer sequence overflow halts application insert writes."
  tags:
    - Data
    - System
  ee: false
  demo: false
  description: |
    ### What It Does
    This blueprint monitors PostgreSQL sequences via `pg_sequences` to catch auto-incrementing primary keys nearing maximum integer capacity (e.g., standard 32-bit `integer` limit of 2,147,483,647). When sequences reach high capacity (default: 80%), it alerts engineering teams with remediation steps to migrate columns to `bigint` before application insert statements fail.

    ### Prerequisites
    - Network connectivity to target PostgreSQL instance via JDBC port (5432).
    - Database user credentials configured in secret `POSTGRES_PASSWORD`.
    - Slack Incoming Webhook configured in secret `SLACK_WEBHOOK_URL`.

    ### Quick Start
    1. Set your database connection in `postgres_url`.
    2. Specify the monitoring user in `postgres_username`.
    3. Configure `capacity_warning_percentage` according to your application growth velocity.
    4. Run on a daily schedule to proactively guard against integer overflow incidents.

    ### Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `postgres_url` | STRING | `jdbc:postgresql://...` | JDBC URL of PostgreSQL database |
    | `postgres_username` | STRING | `db_monitor` | Monitoring database user |
    | `capacity_warning_percentage` | FLOAT | `80.0` | Alert threshold percentage |
    | `slack_webhook_url` | STRING | `{{ secret('SLACK_WEBHOOK_URL') }}` | Slack notification destination |

    ### Expected Outputs
    - `outputs.analyze_sequence_capacities.vars.risk_detected`: Boolean indicating whether any sequence breached the threshold.
    - `outputs.analyze_sequence_capacities.vars.top_sequence`: Schema-qualified name of the sequence with highest utilization.
    - `outputs.analyze_sequence_capacities.outputFiles['sequence_risk_report.json']`: Detailed JSON report of all sequences.

    ### Common Pitfalls
    - Changing a primary key column from `integer` to `bigint` on a busy table requires an exclusive table lock; plan schema migrations using non-blocking techniques or maintenance windows.
    - Sequences created with `NO CYCLE` will throw an error immediately upon reaching `max_value`.
