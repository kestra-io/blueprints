id: local-website-health-prospector
namespace: company.team
description: |
  Grade a list of local business websites the way a prospect researcher
  would, automatically. For every site on the list the flow checks whether
  it loads at all, whether it uses HTTPS, whether a customer can find a
  phone number, whether there is any contact path (a form or a contact
  page), and whether it is built for phones (a viewport tag). Each site
  gets a health score out of 100 and a plain list of what is wrong. The
  run ends with a call list: the worst-scoring sites first, because a
  business whose website is broken is a business that needs a new one.

triggers:
  - id: weekly_prospect_run
    type: io.kestra.plugin.core.trigger.Schedule
    description: Monday 08:00, so a fresh graded prospect list is waiting before the week's outreach starts.
    cron: "0 8 * * 1"

inputs:
  - id: websites
    type: STRING
    defaults: "https://example.com, https://www.google.com, https://www.wikipedia.org"
    description: Comma-separated list of website URLs to grade — your prospect list. Bare domains work too; https:// is assumed when no scheme is given.
  - id: hot_lead_ceiling
    type: INT
    defaults: 70
    description: Sites scoring below this number count as hot leads and land on the call list.

tasks:
  # --- 1. grade every site ---
  - id: check_sites
    type: io.kestra.plugin.scripts.python.Script
    description: Visit each site once, run the five health checks (loads, HTTPS, phone number, contact path, mobile viewport), score it out of 100, write the full report to prospects.json, and publish the hot leads and totals as outputs.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.12-slim
    env:
      WEBSITES: "{{ inputs.websites }}"
      HOT_LEAD_CEILING: "{{ inputs.hot_lead_ceiling }}"
    outputFiles:
      - prospects.json
    script: |
      import json
      import os
      import re
      import ssl
      import urllib.error
      import urllib.request

      ceiling = int(os.environ.get("HOT_LEAD_CEILING", "70"))
      raw = os.environ.get("WEBSITES", "")
      urls = [u.strip() for u in re.split(r"[,\n]", raw) if u.strip()]

      PHONE_RE = re.compile(
          r"(\+?1[\s.\-]?)?(\(\d{3}\)|\d{3})[\s.\-]?\d{3}[\s.\-]?\d{4}"
      )

      def grade(url):
          target = url if "://" in url else "https://" + url
          problems = []
          score = 100
          try:
              ctx = ssl.create_default_context()
              req = urllib.request.Request(
                  target, headers={"User-Agent": "Mozilla/5.0 (Kestra prospector)"}
              )
              with urllib.request.urlopen(req, timeout=10, context=ctx) as resp:
                  final_url = resp.geturl()
                  html = resp.read().decode("utf-8", errors="ignore")
          except Exception as exc:
              return {
                  "url": url,
                  "score": 0,
                  "problems": "site does not load (%s)" % type(exc).__name__,
              }
          if not final_url.startswith("https://"):
              score -= 30
              problems.append("no HTTPS")
          if 'href="tel:' not in html and not PHONE_RE.search(html):
              score -= 25
              problems.append("no phone number a customer can call")
          if "<form" not in html and "contact" not in html.lower():
              score -= 25
              problems.append("no contact form or contact page")
          if 'name="viewport"' not in html:
              score -= 20
              problems.append("not built for phones (no viewport tag)")
          return {
              "url": url,
              "score": max(score, 0),
              "problems": "; ".join(problems) if problems else "healthy",
          }

      report = [grade(u) for u in urls]
      hot = sorted(
          [r for r in report if r["score"] < ceiling],
          key=lambda r: r["score"],
      )

      with open("prospects.json", "w", encoding="utf-8") as handle:
          json.dump(report, handle, indent=2)

      print("checked=%d hot_leads=%d ceiling=%d" % (len(report), len(hot), ceiling))
      print("::" + json.dumps({"outputs": {
          "checked": len(report),
          "hot_count": len(hot),
          "hot_leads": hot,
          "report": report,
      }}) + "::")

  # --- 2. call-list gate ---
  - id: call_list_gate
    type: io.kestra.plugin.core.flow.If
    description: Branch on whether any site scored under the hot-lead ceiling, so a run with prospects prints the call list and a clean run says so in one line.
    condition: "{{ outputs.check_sites.vars.hot_count > 0 }}"
    then:
      # --- 3. one call-list line per hot lead, worst first ---
      - id: log_hot_leads
        type: io.kestra.plugin.core.flow.Loop
        description: Walk the hot leads one at a time, worst score first, and log each as its own call-list line with its problems spelled out.
        values: "{{ outputs.check_sites.vars.hot_leads }}"
        concurrencyLimit: 1
        tasks:
          - id: log_hot_lead
            type: io.kestra.plugin.core.log.Log
            description: Log a single hot lead for the call list.
            message: "CALL FIRST: {{ item.value.url }} - health score {{ item.value.score }}/100 - problems: {{ item.value.problems }}"
    else:
      # --- 4. nothing to call about ---
      - id: log_all_healthy
        type: io.kestra.plugin.core.log.Log
        description: Record the clean outcome so the run history still proves the list was checked.
        message: "Prospect run clean: every site scored {{ inputs.hot_lead_ceiling }} or better. No calls to make from this list."

  # --- 5. run summary ---
  - id: log_summary
    type: io.kestra.plugin.core.log.Log
    description: Close the run with the totals, so the execution log reads as a finished report.
    message: "Prospect run complete: {{ outputs.check_sites.vars.checked }} sites graded, {{ outputs.check_sites.vars.hot_count }} hot lead(s) under a score of {{ inputs.hot_lead_ceiling }}. Full report saved as prospects.json."

extend:
  shortDescription: Grade a list of local business websites for the problems that lose customers — down, no HTTPS, no phone number, no contact path, not mobile-ready — and get a worst-first call list.
  title: Local Website Health Prospector — Grade Business Websites and Build a Call List
  metaTitle: Website Health Prospector Blueprint — Automated Prospect Research with Kestra
  metaDescription: A Kestra blueprint that grades local business websites on five customer-facing checks, scores each out of 100, and logs a worst-first call list of the sites that need help.
  description: |
    Prospecting for web-design clients starts with research: open a business's website, notice it loads slowly, has no phone number, or looks broken on a phone, and write it down. That is an hour of tab-clicking for every ten businesses. This blueprint does the first pass automatically. Give it your prospect list and it grades every site on the five problems that actually lose a local business customers, then hands you the call list — worst sites first, each with its problems spelled out in plain words.

    ## How it works

    1. The `io.kestra.plugin.core.trigger.Schedule` trigger fires Monday at 08:00 (run it manually any time).
    2. The `check_sites` task (`io.kestra.plugin.scripts.python.Script`, the non-core scripts plugin) visits each URL from the `websites` input once and checks: does it load, is the final address HTTPS, is there a callable phone number (`tel:` link or a printed number), is there a contact path (a form or a contact mention), and is there a mobile viewport tag. Each miss deducts from 100; a site that does not load scores 0. The full report is saved as `prospects.json` and the hot leads are published as outputs.
    3. The `call_list_gate` task (`io.kestra.plugin.core.flow.If`) branches on the hot-lead count — sites under the `hot_lead_ceiling` input (default 70).
    4. With hot leads, a `io.kestra.plugin.core.flow.Loop` logs one `CALL FIRST:` line per lead, worst score first, with its problems listed. Without any, one log line records the clean run.
    5. A final log task closes the execution with the totals, so the log reads as a finished report.

    ## What you get

    - A graded prospect list: every site scored out of 100 with its specific problems in plain language — the talking points for the call are written for you.
    - A worst-first call list in the execution log, plus the complete report as a downloadable `prospects.json` artifact.
    - An honest empty state: a healthy list logs one clean line instead of silence, so a quiet week is never confused with a broken flow.
    - Zero setup for a first run: the default list grades three public sites with a mix of scores, so every branch of the flow is visible immediately.

    ## Who it's for

    - Web designers, freelancers, and small agencies who prospect local businesses and want the research done before the coffee is.
    - Sales reps who need a reason to call that is specific, true, and checkable ("your site has no phone number on it") instead of a generic pitch.
    - Anyone learning Kestra who wants one flow that combines a script, a branch, and a loop over real-world data.

    ## Prerequisites

    - A Kestra instance with the Python script plugin available and a Docker task runner.
    - A list of website URLs. No accounts, no API keys, no secrets — the checks read public pages only.

    ### Secrets

    This blueprint uses no secrets and stores nothing about the sites it grades beyond the run's own report artifact.

    ## Quick start

    1. Create the flow and run it with the defaults — the three sample sites produce a mix of scores, so you see both the call list and the scoring.
    2. Replace the `websites` input with your own prospect list (comma-separated URLs; bare domains work) and run again.
    3. Adjust `hot_lead_ceiling` if you want a stricter or looser definition of a hot lead, then let the Monday schedule take over.

    ## How to extend

    - Add more checks to the Python step — page weight, a title tag, a copyright year in the footer (a site still saying 2019 is a talking point), or a Google Maps / reviews link.
    - Swap the log loop for a notification task (Slack, email) or a task that appends the hot leads to a CRM or a spreadsheet.
    - Feed the list from another flow — a places search or a directory scrape — so the prospector grades new businesses as they are discovered.

    ## Links

    - [Python scripts plugin](https://kestra.io/plugins/plugin-script-python)
  tags:
    - Getting Started
  subTags:
    - Scheduling
  ee: false
  demo: false
