
id: echovault-git-memory-reconstruction
namespace: company.ai

description: |
  EchoVault reconstructs traceable knowledge from a Git repository.
  It extracts text statements, fingerprints source content, and flags
  possible conflicts for human review.

inputs:
  - id: repository_url
    type: STRING
    defaults: https://github.com/kestra-io/blueprints

  - id: repository_branch
    type: STRING
    defaults: main

tasks:
  - id: repository_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_knowledge_repository
        type: io.kestra.plugin.git.Clone
        url: "{{ inputs.repository_url }}"
        branch: "{{ inputs.repository_branch }}"
        depth: 1

      - id: extract_evidence
        type: io.kestra.plugin.scripts.python.Script
        description: Extract evidence from cloned Markdown and text files.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        outputFiles:
          - reconstruction.json
          - reconstruction.md
        script: |
          import hashlib
          import json
          import re
          from pathlib import Path
          from collections import defaultdict

          root = Path(".")
          supported = {".md", ".txt"}

          files = sorted(
              p for p in root.rglob("*")
              if p.is_file()
              and p.suffix.lower() in supported
              and ".git" not in p.parts
          )

          claims = []
          sources = []

          for path in files:
              try:
                  raw = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              if not raw.strip():
                  continue

              digest = hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()

              sources.append({
                  "path": path.as_posix(),
                  "source_sha256": digest
              })

              segments = [
                  s.strip()
                  for s in re.split(r"(?<=[.!?])\s+|\n+", raw)
                  if s.strip()
              ]

              for sentence in segments:
                  claims.append({
                      "segment": len(claims) + 1,
                      "source_path": path.as_posix(),
                      "text": sentence,
                      "status": "unverified_source_claim",
                      "source_sha256": digest
                  })

          groups = defaultdict(list)

          for claim in claims:
              words = re.findall(
                  r"\b[\w-]+\b", claim["text"].lower()
              )
              if len(words) >= 3:
                  key = " ".join(words[:3])
                  groups[key].append(claim)

          conflicts = []

          for key, group in groups.items():
              distinct = list(dict.fromkeys(
                  c["text"] for c in group
              ))
              if len(distinct) > 1:
                  conflicts.append({
                      "matching_prefix": key,
                      "statements": distinct,
                      "status": "possible_conflict_needs_human_review"
                  })

          result = {
              "schema_version": "1.2",
              "source_count": len(sources),
              "sources": sources,
              "claim_count": len(claims),
              "claims": claims,
              "possible_conflicts": conflicts,
              "conflict_count": len(conflicts),
              "limitations": [
                  "Claims are not independently verified.",
                  "Prefix matching is heuristic, not proof of contradiction.",
                  "Only Markdown and text files are processed.",
                  "Potential conflicts require human review."
              ]
          }

          Path("reconstruction.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          report = [
              "# EchoVault Evidence Report",
              "",
              f"- Sources processed: {len(sources)}",
              f"- Extracted statements: {len(claims)}",
              f"- Potential conflicts: {len(conflicts)}",
              "",
              "## Source fingerprints",
              ""
          ]

          for source in sources:
              report.extend([
                  f"### {source['path']}",
                  "",
                  f"- SHA-256: `{source['source_sha256']}`",
                  ""
              ])

          report.extend(["## Extracted evidence", ""])

          for claim in claims:
              report.extend([
                  f"### Segment {claim['segment']}",
                  "",
                  f"- Source: `{claim['source_path']}`",
                  "",
                  claim["text"],
                  "",
                  f"- Status: `{claim['status']}`",
                  ""
              ])

          report.extend(["## Potential conflicts", ""])

          if conflicts:
              for conflict in conflicts:
                  report.extend([
                      f"### Candidate: {conflict['matching_prefix']}",
                      ""
                  ])
                  for statement in conflict["statements"]:
                      report.append(f"- {statement}")
                  report.extend([
                      "",
                      f"- Status: `{conflict['status']}`",
                      ""
                  ])
          else:
              report.append(
                  "No potential conflicts identified by this heuristic."
              )

          Path("reconstruction.md").write_text(
              "\n".join(report),
              encoding="utf-8"
          )

  - id: evidence_gate
    type: io.kestra.plugin.core.flow.If
    description: Route when a repository URL is provided.
    condition: "{{ inputs.repository_url != '' }}"
    then:
      - id: evidence_found
        type: io.kestra.plugin.core.log.Log
        message: |
          EchoVault generated its evidence report.
          Review reconstruction.json and reconstruction.md.
    else:
      - id: no_evidence
        type: io.kestra.plugin.core.log.Log
        message: "No repository URL was provided."

  - id: completion_log
    type: io.kestra.plugin.core.log.Log
    message: "EchoVault repository reconstruction completed."

triggers:
  - id: scheduled_reconstruction
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 1 1 *"
