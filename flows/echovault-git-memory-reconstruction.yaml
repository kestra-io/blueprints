
id: echovault-git-memory-reconstruction
namespace: company.ai

description: |
  EchoVault reconstructs traceable knowledge from a Git repository.
  It extracts statements, fingerprints source content, builds a
  downstream memory index, and flags possible conflicts for review.

inputs:
  - id: repository_url
    type: STRING
    defaults: https://github.com/kestra-io/blueprints

  - id: repository_branch
    type: STRING
    defaults: main

tasks:
  - id: repository_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_knowledge_repository
        type: io.kestra.plugin.git.Clone
        url: "{{ inputs.repository_url }}"
        branch: "{{ inputs.repository_branch }}"
        depth: 1

      - id: extract_evidence
        type: io.kestra.plugin.scripts.python.Script
        description: Extract traceable claims from Markdown and text files.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        outputFiles:
          - reconstruction.json
          - reconstruction.md
        script: |
          import hashlib
          import json
          import re
          from pathlib import Path
          from collections import defaultdict

          root = Path(".")
          supported = {".md", ".txt"}
          claims = []
          sources = []

          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              if path.suffix.lower() not in supported:
                  continue
              if ".git" in path.parts:
                  continue

              try:
                  raw = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue

              if not raw.strip():
                  continue

              digest = hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()
              relative = path.as_posix()

              sources.append({
                  "path": relative,
                  "source_sha256": digest
              })

              segments = [
                  s.strip()
                  for s in re.split(r"(?<=[.!?])\s+|\n+", raw)
                  if s.strip()
              ]

              for segment in segments:
                  claims.append({
                      "segment": len(claims) + 1,
                      "text": segment,
                      "source_path": relative,
                      "source_sha256": digest,
                      "status": "unverified_source_claim"
                  })

          groups = defaultdict(list)
          for claim in claims:
              words = re.findall(
                  r"\b[\w-]+\b", claim["text"].lower()
              )
              if len(words) >= 3:
                  groups[" ".join(words[:3])].append(claim)

          conflicts = []
          for prefix, group in groups.items():
              statements = list(dict.fromkeys(
                  item["text"] for item in group
              ))
              if len(statements) > 1:
                  conflicts.append({
                      "matching_prefix": prefix,
                      "statements": statements,
                      "status": "possible_conflict_needs_human_review"
                  })

          result = {
              "schema_version": "1.2",
              "source_count": len(sources),
              "sources": sources,
              "claim_count": len(claims),
              "claims": claims,
              "possible_conflicts": conflicts,
              "conflict_count": len(conflicts),
              "limitations": [
                  "Claims are not independently verified.",
                  "Prefix matching is heuristic, not proof of contradiction.",
                  "Only Markdown and text files are processed.",
                  "Potential conflicts require human review."
              ]
          }

          Path("reconstruction.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          report = [
              "# EchoVault Evidence Report",
              "",
              f"- Sources processed: {len(sources)}",
              f"- Extracted statements: {len(claims)}",
              f"- Potential conflicts: {len(conflicts)}",
              "",
              "## Extracted evidence",
              ""
          ]

          for claim in claims:
              report.extend([
                  f"## Segment {claim['segment']}",
                  "",
                  f"- Source: `{claim['source_path']}`",
                  f"- SHA-256: `{claim['source_sha256']}`",
                  f"- Status: `{claim['status']}`",
                  "",
                  claim["text"],
                  ""
              ])

          report.extend(["## Potential conflicts", ""])
          for conflict in conflicts:
              report.extend([
                  f"### Candidate: {conflict['matching_prefix']}",
                  ""
              ])
              for statement in conflict["statements"]:
                  report.append(f"- {statement}")
              report.extend([
                  "",
                  f"- Status: `{conflict['status']}`",
                  ""
              ])

          if not conflicts:
              report.append(
                  "No potential conflicts identified by this heuristic."
              )

          Path("reconstruction.md").write_text(
              "\n".join(report) + "\n",
              encoding="utf-8"
          )

      - id: build_downstream_memory
        type: io.kestra.plugin.scripts.python.Script
        description: Build a structured memory index and human review queue.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        inputFiles:
          reconstruction.json: "{{ outputs.extract_evidence.outputFiles['reconstruction.json'] }}"
        outputFiles:
          - memory_index.json
          - review_queue.json
          - memory_brief.md
        script: |
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("reconstruction.json").read_text(encoding="utf-8")
          )
          claims = evidence.get("claims", [])
          conflicts = evidence.get("possible_conflicts", [])

          memory = {
              "schema_version": "1.0",
              "source_count": evidence.get("source_count", 0),
              "claim_count": len(claims),
              "claims": claims
          }

          review_queue = {
              "status": "requires_human_review",
              "items": conflicts
          }

          Path("memory_index.json").write_text(
              json.dumps(memory, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          Path("review_queue.json").write_text(
              json.dumps(review_queue, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          brief = [
              "# EchoVault Downstream Memory Brief",
              "",
              f"- Sources: {memory['source_count']}",
              f"- Claims: {len(claims)}",
              f"- Potential conflicts: {len(conflicts)}",
              "",
              "Claims remain unverified until reviewed.",
              "Potential conflicts are heuristic signals, not proven contradictions."
          ]

          Path("memory_brief.md").write_text(
              "\n".join(brief) + "\n",
              encoding="utf-8"
          )

          print(
              f"Prepared {len(claims)} claims and "
              f"{len(conflicts)} review candidates."
          )

  - id: evidence_gate
    type: io.kestra.plugin.core.flow.If
    description: Route based on whether a repository URL is provided.
    condition: "{{ inputs.repository_url != '' }}"
    then:
      - id: evidence_found
        type: io.kestra.plugin.core.log.Log
        message: |
          Evidence extraction completed.
          Review the evidence and downstream memory artifacts.
    else:
      - id: no_evidence
        type: io.kestra.plugin.core.log.Log
        message: "No repository URL was provided."

  - id: completion_log
    type: io.kestra.plugin.core.log.Log
    message: "EchoVault reconstruction and downstream processing completed."

triggers:
  - id: scheduled_reconstruction
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 1 1 *"

extend:
  title: EchoVault Git Memory Reconstruction
  metaTitle: EchoVault Git Memory Reconstruction | Kestra
  shortDescription: Reconstruct traceable project knowledge from Git documentation and prepare it for downstream review.
  metaDescription: Extract claims from Git documentation, preserve source fingerprints, and build a downstream memory index and human review queue.
  description: |
    ## Operational use case

    Who runs it: Project maintainers and knowledge engineers who need traceable knowledge extracted from a Git repository.

    When to run it: Run the flow manually after meaningful repository updates, or adjust the included annual schedule to match the project's review cadence.

    What happens with the result: reconstruction.json and reconstruction.md preserve extracted claims and their source fingerprints. memory_index.json provides a structured index for browsing claims, review_queue.json identifies possible conflicts for human investigation, and memory_brief.md summarizes the results. Reviewers should check claims against their source files before trusting them. EchoVault does not automatically resolve conflicts or verify claims as facts.
        Engineering and documentation teams use EchoVault before releases,
    after migrations, or during scheduled documentation reviews. It
    reconstructs traceable claims from a repository and prepares structured
    memory artifacts for downstream knowledge tools and human reviewers.

    ## How it works

    1. Configure the repository URL and branch.
    2. Clone the repository into a Kestra working directory.
    3. Extract statements with source paths and SHA-256 fingerprints.
    4. Build a downstream memory index and potential-conflict review queue.
    5. Generate a readable brief for a documentation owner.

    ## What you get

    - reconstruction.json and reconstruction.md evidence reports.
    - memory_index.json for downstream knowledge applications.
    - review_queue.json for potential conflicts requiring human review.
    - memory_brief.md summarizing reconstructed knowledge.

    ## Who it's for

    Engineering teams, documentation owners, and developers prototyping
    traceable repository-based knowledge workflows.

    ## Why orchestrate this with Kestra

    Kestra coordinates repository ingestion, extraction, downstream processing,
    scheduling, execution history, and task outputs in one observable workflow.

    ## Prerequisites

    - Kestra with the Git plugin installed.
    - Python Script plugin and Process task runner.
    - Network access and sufficient storage for the repository.

    ### Secrets

    Public repositories require no credentials. Configure private repository
    authentication securely. Never hard-code access tokens.

    ## Quick start

    1. Import this YAML into Kestra.
    2. Set repository_url and repository_branch.
    3. Execute the flow and inspect task output files.
    4. Review potential conflicts manually before relying on claims.

    ## How to extend

    Add file-size limits, more document formats, persistent approved-memory
    storage, human approval tasks, and reviewer notifications.

    ## Links

    - https://github.com/kestra-io/blueprints
    - https://kestra.io/plugins/plugin-git
    - https://kestra.io/plugins/plugin-script-python
  tags:
    - Data
  subTags:
    - File & Data Processing Basics
  ee: false
  verified: false
  demo: true

