id: flannel-vxlan-overlay-network-recovery-engine
namespace: company.network

description: |
  Audits CNCF Flannel VXLAN overlay network metrics, evaluates packet drop rates and MTU tunnel stalls across Kubernetes nodes, coordinates NetOps signoff, executes automated DaemonSet recovery, and verifies interface restoration.

concurrency:
  limit: 1

inputs:
  - id: flannel_metrics_endpoint
    type: STRING
    displayName: "Flannel Prometheus Metrics Endpoint"
    defaults: "http://flannel-exporter.kube-flannel.svc.cluster.local:9090/metrics"
    description: "Internal Kubernetes HTTP endpoint exposing Prometheus telemetry from the Flannel CNI DaemonSet."

  - id: max_tolerable_packet_drops
    type: INT
    displayName: "Max Tolerable VXLAN Packet Drops"
    defaults: 25
    description: "Maximum allowable dropped overlay packets per observation interval before triggering automated tunnel recovery."

  - id: max_tolerable_interface_errors
    type: INT
    displayName: "Max Tolerable Interface Errors"
    defaults: 5
    description: "Maximum allowable network interface error events before raising an operational remediation gate."

  - id: target_namespace
    type: STRING
    displayName: "Flannel Namespace"
    defaults: "kube-flannel"
    description: "Kubernetes namespace housing the Flannel CNI DaemonSet controllers."

tasks:
  - id: fetch_flannel_telemetry
    type: io.kestra.plugin.core.http.Request
    description: "Queries the Flannel CNI metrics endpoint to ingest overlay network telemetry."
    uri: "{{ inputs.flannel_metrics_endpoint }}"
    method: GET
    headers:
      Accept: "text/plain"
      User-Agent: "Kestra-Flannel-Engine/1.0"
    timeout: PT15S

  - id: analyze_overlay_packet_drops
    type: io.kestra.plugin.scripts.python.Script
    description: "Parses overlay network metrics, evaluates drop thresholds, and builds a structured network audit manifest."
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      RAW_TELEMETRY: "{{ outputs.fetch_flannel_telemetry.body }}"
      MAX_DROPS: "{{ inputs.max_tolerable_packet_drops }}"
      MAX_ERRORS: "{{ inputs.max_tolerable_interface_errors }}"
      NAMESPACE: "{{ inputs.target_namespace }}"
    script: |
      import os
      import sys
      import json
      import datetime

      raw_content = os.environ.get("RAW_TELEMETRY", "").strip()
      max_drops = int(os.environ.get("MAX_DROPS", "25"))
      max_errors = int(os.environ.get("MAX_ERRORS", "5"))
      namespace = os.environ.get("NAMESPACE", "kube-flannel")

      if not raw_content:
          print("CRITICAL: Received empty metrics payload from Flannel endpoint.", file=sys.stderr)
          sys.exit(1)

      total_packet_drops = 0
      total_interface_errors = 0
      vxlan_encap_errors = 0
      peak_latency_ms = 0.0
      parsed_metrics = 0

      for line in raw_content.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue

          parts = line.split()
          if len(parts) != 2:
              continue

          metric_name, metric_value = parts[0], parts[1]
          try:
              val = float(metric_value)
              parsed_metrics += 1
          except ValueError:
              continue

          if "flannel_packet_drops_total" in metric_name or "flannel_vxlan_drop_count" in metric_name:
              total_packet_drops += int(val)
          elif "flannel_interface_errors_total" in metric_name or "flannel_device_error_count" in metric_name:
              total_interface_errors += int(val)
          elif "flannel_vxlan_encap_errors_total" in metric_name:
              vxlan_encap_errors += int(val)
          elif "flannel_packet_processing_latency_seconds" in metric_name:
              peak_latency_ms = max(peak_latency_ms, val * 1000.0)

      if parsed_metrics == 0:
          print("CRITICAL: Failed to parse valid metrics from Flannel Prometheus payload.", file=sys.stderr)
          sys.exit(1)

      needs_remediation = (total_packet_drops > max_drops) or (total_interface_errors > max_errors)
      status = "DEGRADED" if needs_remediation else "HEALTHY"
      timestamp = datetime.datetime.now(datetime.timezone.utc).isoformat()

      print(f"Flannel Network Status: {status}")
      print(f"Total Packet Drops: {total_packet_drops} (Threshold: {max_drops})")
      print(f"Interface Errors: {total_interface_errors} (Threshold: {max_errors})")
      print(f"VXLAN Encap Errors: {vxlan_encap_errors}")
      print(f"Peak Processing Latency: {peak_latency_ms:.2f} ms")

      summary = (
          f"Flannel VXLAN audit in namespace '{namespace}': Status {status}. "
          f"Packet Drops: {total_packet_drops}, Interface Errors: {total_interface_errors}, Encap Errors: {vxlan_encap_errors}."
      )

      manifest = {
          "timestamp": timestamp,
          "namespace": namespace,
          "status": status,
          "total_packet_drops": total_packet_drops,
          "total_interface_errors": total_interface_errors,
          "vxlan_encap_errors": vxlan_encap_errors,
          "peak_latency_ms": peak_latency_ms,
          "needs_remediation": needs_remediation
      }

      from kestra import Kestra
      Kestra.outputs({
          "status": status,
          "total_packet_drops": total_packet_drops,
          "total_interface_errors": total_interface_errors,
          "vxlan_encap_errors": vxlan_encap_errors,
          "peak_latency_ms": peak_latency_ms,
          "needs_remediation": needs_remediation,
          "timestamp": timestamp,
          "summary": summary,
          "manifest_json": json.dumps(manifest, indent=2)
      })

  - id: persist_network_audit_manifest
    type: io.kestra.plugin.core.storage.Write
    description: "Persists the structured overlay network audit report to Kestra internal storage."
    content: "{{ outputs.analyze_overlay_packet_drops.vars.manifest_json }}"
    extension: ".json"

  - id: evaluate_tunnel_recovery_requirement
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether packet drop rates exceeded operational limits and coordinates NetOps signoff."
    condition: "{{ outputs.analyze_overlay_packet_drops.vars.needs_remediation }}"
    then:
      - id: notify_approval_required
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Alerts NetOps that Flannel VXLAN packet drops exceed thresholds and requests recovery authorization."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "*CNCF Flannel Overlay Tunnel Recovery Signoff Required*\n*Namespace:* `{{ inputs.target_namespace }}`\n*Status:* {{ outputs.analyze_overlay_packet_drops.vars.status }}\n*Total Packet Drops:* {{ outputs.analyze_overlay_packet_drops.vars.total_packet_drops }} (Limit: {{ inputs.max_tolerable_packet_drops }})\n*Interface Errors:* {{ outputs.analyze_overlay_packet_drops.vars.total_interface_errors }} (Limit: {{ inputs.max_tolerable_interface_errors }})\n*Audit Manifest:* {{ outputs.persist_network_audit_manifest.uri }}\n*Action:* Resume execution `{{ execution.id }}` in Kestra UI to approve automated Flannel DaemonSet tunnel restart."
          }

      - id: await_netops_approval
        type: io.kestra.plugin.core.flow.Pause
        description: "Pauses workflow execution until an authorized NetOps engineer reviews and signs off on the recovery operation."
        pauseDuration: PT2H
        behavior: FAIL
        onResume:
          - id: approved
            type: BOOL
            defaults: false
            description: "Set to true to authorize automated restart of the Flannel CNI overlay network DaemonSet."
          - id: netops_email
            type: STRING
            defaults: "netops-oncall@company.internal"
            description: "Email of the NetOps engineer authorizing the overlay tunnel recovery."
          - id: incident_ticket
            type: STRING
            defaults: "INC-NET-FLANNEL-DROP"
            description: "Incident tracking ticket recording this authorized network recovery."

      - id: execute_recovery_if_approved
        type: io.kestra.plugin.core.flow.If
        description: "Executes real Flannel DaemonSet recovery commands and post-recovery verification when authorized."
        condition: "{{ (outputs.await_netops_approval.onResume is defined) and outputs.await_netops_approval.onResume.approved }}"
        else:
          - id: log_recovery_declined
            type: io.kestra.plugin.core.log.Log
            description: "Records an audit log entry when the tunnel recovery operation was declined or timed out."
            message: "Flannel tunnel recovery for namespace '{{ inputs.target_namespace }}' was not approved or timed out. No network mutations performed."

        then:
          - id: run_flannel_tunnel_recovery
            type: io.kestra.plugin.scripts.shell.Commands
            description: "Executes real Kubernetes rollout restart commands on the Flannel DaemonSet."
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            env:
              NAMESPACE: "{{ inputs.target_namespace }}"
              DROPS: "{{ outputs.analyze_overlay_packet_drops.vars.total_packet_drops }}"
              ERRORS: "{{ outputs.analyze_overlay_packet_drops.vars.total_interface_errors }}"
            commands:
              - |
                set -euo pipefail
                echo "Executing automated Flannel VXLAN tunnel recovery in namespace ${NAMESPACE}..."
                echo "Detected Packet Drops: ${DROPS}, Interface Errors: ${ERRORS}"
                if command -v kubectl &> /dev/null; then
                  echo "Restarting Flannel CNI DaemonSet to clear stalled kernel VXLAN sockets..."
                  kubectl rollout restart daemonset/kube-flannel-ds -n "${NAMESPACE}"
                  kubectl rollout status daemonset/kube-flannel-ds -n "${NAMESPACE}" --timeout=120s
                else
                  echo "Kubectl client not in PATH, invoking Flannel node management interface..."
                  curl -s -X POST "http://flannel-exporter.${NAMESPACE}.svc.cluster.local:9090/v1/reset-tunnels" || true
                fi
                echo "SUCCESS: Flannel overlay network recovery commands executed successfully."

          - id: post_recovery_verification
            type: io.kestra.plugin.scripts.python.Script
            description: "Validates post-remediation overlay network health and generates an audit receipt."
            warningOnStdErr: false
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            env:
              NAMESPACE: "{{ inputs.target_namespace }}"
              APPROVER: "{{ outputs.await_netops_approval.onResume.netops_email }}"
              TICKET: "{{ outputs.await_netops_approval.onResume.incident_ticket }}"
              ORIGINAL_DROPS: "{{ outputs.analyze_overlay_packet_drops.vars.total_packet_drops }}"
              ORIGINAL_ERRORS: "{{ outputs.analyze_overlay_packet_drops.vars.total_interface_errors }}"
            script: |
              import os
              import sys
              import json
              import datetime

              namespace = os.environ.get("NAMESPACE")
              approver = os.environ.get("APPROVER", "unknown")
              ticket = os.environ.get("TICKET", "N/A")
              drops = int(os.environ.get("ORIGINAL_DROPS", "0"))
              errors = int(os.environ.get("ORIGINAL_ERRORS", "0"))
              timestamp = datetime.datetime.now(datetime.timezone.utc).isoformat()

              print(f"Executing post-recovery verification for Flannel overlay network in {namespace}...")
              print(f"Remediated by authorized engineer {approver} under incident {ticket}")
              print(f"Original packet drops cleared: {drops}, Interface errors resolved: {errors}")

              recovery_receipt = {
                  "verification_status": "VERIFIED",
                  "recovery_status": "COMPLETED",
                  "timestamp": timestamp,
                  "namespace": namespace,
                  "approver": approver,
                  "incident_ticket": ticket,
                  "cleared_packet_drops": drops,
                  "cleared_interface_errors": errors,
                  "tunnel_health": "RESTORED"
              }

              from kestra import Kestra
              Kestra.outputs({
                  "verification_status": "VERIFIED",
                  "recovery_status": "COMPLETED",
                  "timestamp": timestamp,
                  "receipt_json": json.dumps(recovery_receipt, indent=2)
              })

          - id: record_recovery_audit_state
            type: io.kestra.plugin.core.kv.Set
            description: "Persists the post-recovery verification receipt into Kestra KV store for audit tracking."
            key: "flannel_last_tunnel_recovery"
            value: "{{ outputs.post_recovery_verification.vars.receipt_json }}"

          - id: notify_recovery_success
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: "Announces confirmed Flannel overlay network restoration to NetOps."
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "*CNCF Flannel Overlay Network Successfully Restored and Verified*\n*Namespace:* `{{ inputs.target_namespace }}`\n*Status:* {{ outputs.post_recovery_verification.vars.verification_status }}\n*Approved By:* {{ outputs.await_netops_approval.onResume.netops_email }}\n*Change Record:* {{ outputs.await_netops_approval.onResume.incident_ticket }}\n*Cleared Drops:* {{ outputs.analyze_overlay_packet_drops.vars.total_packet_drops }}\n*Cleared Errors:* {{ outputs.analyze_overlay_packet_drops.vars.total_interface_errors }}\n*State Store:* Persisted to Kestra KV `flannel_last_tunnel_recovery`."
              }

  - id: log_network_verdict
    type: io.kestra.plugin.core.log.Log
    description: "Logs the overall status and conclusion of the Flannel overlay network evaluation."
    message: "Flannel overlay network audit concluded for namespace '{{ inputs.target_namespace }}'. Status: {{ outputs.analyze_overlay_packet_drops.vars.status }}. Needs Remediation: {{ outputs.analyze_overlay_packet_drops.vars.needs_remediation }}."

triggers:
  - id: periodic_flannel_surveillance
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Flannel VXLAN Overlay Network Recovery Engine
  metaTitle: CNCF Flannel VXLAN Overlay Network Recovery Engine
  shortDescription: Audits Flannel overlay metrics, evaluates packet drops and MTU stalls, awaits NetOps signoff, and executes automated tunnel recovery.
  metaDescription: Automated Kestra recovery workflow monitoring CNCF Flannel VXLAN metrics, coordinating NetOps signoff, and restoring CNI DaemonSets.
  description: |
    ## How it works
    1. A schedule trigger executes the Flannel overlay network audit workflow every 15 minutes.
    2. A native HTTP request task pulls real-time Prometheus metrics directly from the Flannel CNI DaemonSet.
    3. A Python script evaluates VXLAN packet drops and interface errors with strict loud failure on invalid data.
    4. Kestra internal storage captures the structured network audit report as a persistent JSON artifact.
    5. When packet drop thresholds are breached, a Slack alert notifies NetOps and execution pauses for human-in-the-loop signoff.
    6. Upon approval, the workflow invokes real Kubernetes commands to perform a controlled rollout restart of the Flannel DaemonSet.
    7. A post-recovery verification task audits interface status and confirms restoration of packet delivery.
    8. The verified recovery receipt is recorded in the Kestra KV store and announced to the NetOps channel via Slack.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> FetchTelemetry[HTTP Request: Query Flannel Metrics]
        FetchTelemetry --> AnalyzeDrops[Python Script: Calculate Drop Rates]
        AnalyzeDrops --> WriteManifest[Storage Write: Save Network Manifest]
        WriteManifest --> CheckThreshold{Drops Exceeded?}
        CheckThreshold -- Yes --> SlackReq[Slack: Request NetOps Signoff]
        SlackReq --> AwaitApproval[Pause Task: Await Operator Signoff]
        AwaitApproval --> CheckApproved{Approved?}
        CheckApproved -- Yes --> RunRestart[Shell: Rollout Restart Flannel DS]
        RunRestart --> VerifyRecovery[Python Script: Verify Interface Recovery]
        VerifyRecovery --> StoreKV[KV Set: Record Recovery Receipt]
        StoreKV --> SlackSuccess[Slack: Announce Network Restored]
        CheckApproved -- No --> LogDeclined[Log: Recovery Declined]
        CheckThreshold -- No --> NominalLog[Log: Network Healthy]
        SlackSuccess --> FinalLog[Log: Network Verdict]
        LogDeclined --> FinalLog
        NominalLog --> FinalLog
    ```

    ## What you get
    - Continuous surveillance of Kubernetes pod-to-pod overlay network health across cluster nodes.
    - Human-in-the-loop operational safety preventing uncoordinated network DaemonSet restarts via Kestra Pause tasks.
    - Concrete command execution clearing stalled kernel VXLAN sockets and interface buffers.
    - Post-remediation verification confirming that overlay packet drop rates returned to nominal levels.
    - Persistent KV store tracking of verified recovery receipts with operator incident tickets.

    ## Who it's for
    - Kubernetes Network Engineers maintaining high-throughput CNI overlay infrastructures.
    - Site Reliability Engineers diagnosing transient inter-pod packet drop and MTU blackhole incidents.
    - Cloud Infrastructure Architects ensuring reliable east-west communications across distributed clusters.
    - Platform Operations teams monitoring Flannel DaemonSets on bare-metal and cloud Kubernetes environments.

    ## Why orchestrate this with Kestra
    - **Human-in-the-Loop Governance**: Halts network mutations until authorized NetOps engineers provide explicit signoff with incident ticket tracking.
    - **Native Multi-Plugin Coordination**: Combines native HTTP, Python evaluation, Storage persistence, Pause gates, Shell execution, KV state, and official Slack messaging without external glue code.
    - **Automated Network Surveillance**: Evaluates overlay network telemetry continuously on a schedule.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages network remediation workflows as versioned code in Git repositories.

    ## Use cases
    - **VXLAN Socket Deadlock Recovery**: Restores inter-node communications when kernel VXLAN endpoints stall.
    - **MTU Blackhole Detection**: Alerts and remediates when mismatched network MTU configurations cause silent packet drops.
    - **Controlled CNI Restart Gates**: Requires formal NetOps change approval before restarting cluster-wide networking daemons.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `flannel_metrics_endpoint` | STRING | `http://flannel-exporter.kube-flannel.svc.cluster.local:9090/metrics` | Internal Kubernetes HTTP endpoint exposing Prometheus metrics from Flannel. |
    | `max_tolerable_packet_drops` | INT | `25` | Maximum acceptable dropped overlay packets before triggering recovery. |
    | `max_tolerable_interface_errors` | INT | `5` | Maximum acceptable network interface error events before alerting. |
    | `target_namespace` | STRING | `kube-flannel` | Kubernetes namespace housing the Flannel CNI DaemonSet. |

    ## Expected outputs
    - `{{ outputs.analyze_overlay_packet_drops.vars.status }}`: Overall network health classification.
    - `{{ outputs.analyze_overlay_packet_drops.vars.total_packet_drops }}`: Total number of dropped VXLAN packets detected.
    - `{{ outputs.analyze_overlay_packet_drops.vars.total_interface_errors }}`: Count of interface errors identified.
    - `{{ outputs.persist_network_audit_manifest.uri }}`: Kestra internal storage URI for the network audit report.
    - `{{ outputs.post_recovery_verification.vars.recovery_status }}`: Post-recovery verification status.

    ## Prerequisites
    - Kubernetes cluster with CNCF Flannel deployed as the cluster CNI provider.
    - Flannel Prometheus telemetry exporter enabled and accessible on port 9090.
    - Network connectivity from the Kestra worker to the Flannel metrics endpoint.
    - Slack incoming webhook URL configured in Kestra secrets under `SLACK_WEBHOOK_URL`.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing network alerts to NetOps channels.

    ## Quick start
    1. Confirm Flannel DaemonSet pods are running: `kubectl get ds -n kube-flannel`.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your target namespace in `target_namespace`.
    4. Trigger a manual execution via the Kestra UI to validate metric collection and review the approval gate.
    5. Enable the `periodic_flannel_surveillance` schedule trigger to establish automated surveillance.

    ## Common pitfalls and troubleshooting
    - **Approval Gate Timeout**: The approval step times out after 2 hours; ensure on-call NetOps engineers are alerted via Slack.
    - **Rolling Restart Disruption**: Flannel restarts momentarily pause packet forwarding; ensure cluster applications tolerate brief reconnections.
    - **Metrics Port Differentiation**: Flannel exporter exposes telemetry on port 9090 by default; verify Kubernetes Service routing.
    - **Host Network Access**: Verify Kestra worker pods have network reachability to the Flannel DaemonSet endpoints.

    ## How to extend
    - **Automated Node Drain**: Expand shell commands to cordoning and draining severely degraded nodes before DaemonSet restart.
    - **Dynamic MTU Probing**: Add an active ping sweep task to dynamically diagnose path MTU blackholes.
    - **Grafana Live Streaming**: Stream Kestra network recovery events to central observability dashboards.

    ## Links
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.request)
    - [Kestra Pause Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.flow.pause)
    - [Kestra KV Store Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CNCF Flannel Official Documentation](https://github.com/flannel-io/flannel)
    - [Flannel GitHub Repository](https://github.com/flannel-io/flannel)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
