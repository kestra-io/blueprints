id: adanos-asset-sentiment-drift-sentinel
namespace: company.team
description: |
  Pull an asset's current sentiment score from the Adanos Market
  Sentiment API on a schedule, classify it as BEARISH_RISK,
  BULLISH_SPIKE, NORMAL, or UNREACHABLE against configured thresholds,
  log clean checks, and alert Slack the moment sentiment swings to an
  extreme or the API cannot be reached.

inputs:
  - id: asset_symbol
    type: STRING
    defaults: "TSLA"
    displayName: "Asset Symbol"
    description: "Stock ticker (e.g. TSLA) or crypto symbol (e.g. BTC) to track."
  - id: asset_type
    type: SELECT
    defaults: "STOCK"
    values:
      - "STOCK"
      - "CRYPTO"
    displayName: "Asset Type"
    description: "Whether the symbol is a stock ticker or a crypto token. Crypto currently supports the Reddit source only."
  - id: sentiment_source
    type: SELECT
    defaults: "REDDIT"
    values:
      - "REDDIT"
      - "X"
      - "NEWS"
      - "POLYMARKET"
    displayName: "Sentiment Source"
    description: "Data source Adanos aggregates sentiment from. Stocks support REDDIT, X, NEWS, and POLYMARKET; crypto supports REDDIT only."
  - id: bearish_sentiment_threshold
    type: FLOAT
    defaults: -0.3
    displayName: "Bearish Sentiment Threshold"
    description: "sentiment_score at or below this value is classified BEARISH_RISK."
  - id: bullish_sentiment_threshold
    type: FLOAT
    defaults: 0.3
    displayName: "Bullish Sentiment Threshold"
    description: "sentiment_score at or above this value is classified BULLISH_SPIKE (possible hype or pump risk)."

triggers:
  - id: adanos_sentiment_drift_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Check sentiment drift for the tracked asset every 4 hours."
    cron: "0 */4 * * *"
    disabled: true
    inputs:
      asset_symbol: "TSLA"
      asset_type: "STOCK"
      sentiment_source: "REDDIT"
      bearish_sentiment_threshold: -0.3
      bullish_sentiment_threshold: 0.3

tasks:
  - id: fetch_asset_sentiment
    type: io.kestra.plugin.adanos.GetAssetSentiment
    description: "Fetch the current sentiment summary for the tracked asset from the Adanos Market Sentiment API, a read-only hosted API with a free API key tier (no self-hostable Docker image exists for this service)."
    apiKey: "{{ secret('ADANOS_API_KEY') }}"
    assetType: "{{ inputs.asset_type }}"
    source: "{{ inputs.sentiment_source }}"
    symbol: "{{ inputs.asset_symbol }}"
    fetchType: FETCH
    allowFailure: true

  - id: classify_sentiment_drift
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when the API returned no body, BEARISH_RISK or BULLISH_SPIKE when sentiment_score crosses a configured threshold, otherwise NORMAL."
    format: "{{ outputs.fetch_asset_sentiment.body is defined ? (outputs.fetch_asset_sentiment.body.sentiment_score <= inputs.bearish_sentiment_threshold ? 'BEARISH_RISK' : (outputs.fetch_asset_sentiment.body.sentiment_score >= inputs.bullish_sentiment_threshold ? 'BULLISH_SPIKE' : 'NORMAL')) : 'UNREACHABLE' }}"

  - id: route_by_drift
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation when sentiment is normal, page Slack when it swings to an extreme, or page Slack when the API could not be reached."
    value: "{{ outputs.classify_sentiment_drift.value }}"
    cases:
      "NORMAL":
        - id: log_normal
          type: io.kestra.plugin.core.log.Log
          message: "Sentiment for {{ inputs.asset_symbol }} is within normal range: {{ outputs.fetch_asset_sentiment.body.sentiment_score }}."
      "BEARISH_RISK":
        - id: alert_bearish_risk
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Adanos sentinel BEARISH_RISK: {{ inputs.asset_symbol }} sentiment_score is {{ outputs.fetch_asset_sentiment.body.sentiment_score }}, at or below the bearish threshold of {{ inputs.bearish_sentiment_threshold }} (source {{ inputs.sentiment_source }}, buzz_score {{ outputs.fetch_asset_sentiment.body.buzz_score }}, mentions {{ outputs.fetch_asset_sentiment.body.mentions }}). Execution {{ execution.id }}."
            }
      "BULLISH_SPIKE":
        - id: alert_bullish_spike
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Adanos sentinel BULLISH_SPIKE: {{ inputs.asset_symbol }} sentiment_score is {{ outputs.fetch_asset_sentiment.body.sentiment_score }}, at or above the bullish threshold of {{ inputs.bullish_sentiment_threshold }} (source {{ inputs.sentiment_source }}, buzz_score {{ outputs.fetch_asset_sentiment.body.buzz_score }}, mentions {{ outputs.fetch_asset_sentiment.body.mentions }}). Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Adanos sentinel UNREACHABLE: no sentiment body returned for {{ inputs.asset_symbol }} (rate limit, invalid API key, or unsupported asset/source combination). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed Adanos sentiment check for {{ inputs.asset_symbol }} with status: {{ outputs.classify_sentiment_drift.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit status line recorded on every run regardless of branch, for a continuous sentiment trend in the execution history."
    message: "Adanos sentiment audit: symbol={{ inputs.asset_symbol }}, type={{ inputs.asset_type }}, source={{ inputs.sentiment_source }}, status={{ outputs.classify_sentiment_drift.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the sentinel flow itself fails, so a broken check never silently stops monitoring sentiment drift."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Adanos sentiment drift sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Sentiment status for {{ inputs.asset_symbol }} is now unknown; check the task logs and the Adanos API manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_sentiment_drift.value }}"

extend:
  title: "Adanos Asset Sentiment Drift Sentinel"
  metaTitle: Adanos Asset Sentiment Drift Sentinel for Kestra
  shortDescription: Pull an asset's sentiment score from the Adanos API on a schedule, classify bearish or bullish drift against thresholds, and alert Slack on extremes.
  metaDescription: Monitor asset sentiment drift via the Adanos Market Sentiment API and alert Slack when sentiment crosses bearish or bullish thresholds.
  description: |
    Public sentiment around a stock or crypto asset can swing from normal to extreme between two checks, and nothing surfaces that drift until a trader or compliance analyst happens to look. This blueprint pulls Adanos's sentiment summary for a tracked asset on a schedule, classifies the current `sentiment_score` against bearish and bullish thresholds, and pages Slack the moment sentiment swings to an extreme or the API itself cannot be reached.

    ## How it works

    1. `fetch_asset_sentiment` (`io.kestra.plugin.adanos.GetAssetSentiment`) calls the Adanos Market Sentiment API for `asset_symbol` from `sentiment_source`, with `allowFailure: true` so a connection or authentication failure still lets the flow continue instead of aborting.
    2. `classify_sentiment_drift` (`io.kestra.plugin.core.debug.Return`) checks whether `outputs.fetch_asset_sentiment.body` is defined; if not, `UNREACHABLE`. Otherwise it compares `body.sentiment_score` directly against `bearish_sentiment_threshold` and `bullish_sentiment_threshold` and returns `BEARISH_RISK`, `BULLISH_SPIKE`, or `NORMAL`.
    3. `route_by_drift` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `NORMAL` logs a quiet confirmation, `BEARISH_RISK` and `BULLISH_SPIKE` each page Slack with the score, buzz, and mention count, `UNREACHABLE` pages Slack separately, and `defaults` logs the raw outcome.
    4. `log_audit_status` records a status line on every run regardless of branch, so the execution history is a continuous sentiment trend.
    5. The `errors` block pages Slack separately if the flow itself fails outright.
    6. The `adanos_sentiment_drift_schedule` trigger polls every 4 hours with explicit input overrides, shipped `disabled: true` until you add a real API key.

    ## What you get

    - A scheduled, API-native sentiment drift check with zero custom client code.
    - A four-way `status` output (`NORMAL` / `BEARISH_RISK` / `BULLISH_SPIKE` / `UNREACHABLE`) you can chart or gate other flows on.
    - A Slack page carrying the exact sentiment score, buzz score, and mention count behind an extreme reading.
    - A separate failure channel for the sentinel flow itself, plus a standing audit log line per run.

    ## Who it's for

    - Trading desks and research teams who want an orchestrator-side alert when public sentiment around a tracked asset moves to an extreme, without polling a dashboard.
    - Compliance and risk teams building a lightweight sentiment-drift paper trail alongside other market-risk checks.

    ## Why orchestrate this with Kestra

    A dashboard shows sentiment when someone looks at it; this flow watches it continuously. Every check is recorded in the execution history, the result becomes a typed output other flows can depend on, and the Switch branch is one edit away from real remediation (pausing an automated strategy, opening a ticket, notifying a trading desk) instead of a one-off script.

    ## Prerequisites

    - A free Adanos API key, created at [adanos.org/register](https://adanos.org/register). The four core sentiment tasks, including `GetAssetSentiment`, are available on the free plan; see [adanos.org/pricing](https://adanos.org/pricing) for current request quotas.
    - A Slack incoming webhook for the drift and unreachable alerts.
    - Adanos is a hosted read-only API, not a self-hostable service, so there is no Docker image to run locally for this blueprint; test it directly against the live free-tier API with a real `ADANOS_API_KEY`.

    ### Secrets

    - `ADANOS_API_KEY`: Adanos API key, sent only in the `X-API-Key` header.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the drift alerts, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_ADANOS_API_KEY` and `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-api-key>" | base64` and `echo -n "<your-webhook-url>" | base64`.

    ## Quick start

    1. Add the `ADANOS_API_KEY` and `SLACK_WEBHOOK_URL` secrets.
    2. Set `asset_symbol`, `asset_type`, and `sentiment_source` to the asset you want to track.
    3. Run the flow once and confirm `status` reads `NORMAL`, `BEARISH_RISK`, or `BULLISH_SPIKE` depending on live sentiment.
    4. Enable `adanos_sentiment_drift_schedule`.

    ## How to extend

    - Loop over a list of symbols with a `Loop` task to monitor a whole watchlist from one flow.
    - Store `sentiment_score` in a KV store or time-series table and alert only on a sharp change between runs instead of an absolute threshold.
    - Add `ListTrendingAssets` or `CompareAssets` as a companion task to contextualize one asset's score against the broader market.

    ## Links

    - [Adanos Market Sentiment API](https://adanos.org/)
    - [Adanos API documentation](https://api.adanos.org/docs)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Data
    - Business
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
