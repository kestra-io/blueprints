id: milvus-collection-index-state-and-unindexed-entity-sentinel
namespace: company.team

concurrency:
  limit: 1

inputs:
  - id: milvus_endpoint
    type: STRING
    displayName: Milvus Endpoint
    defaults: "http://milvus-standalone.internal:19530"
    description: Base HTTP or gRPC management endpoint of the Milvus vector database cluster.

  - id: milvus_api_key
    type: SECRET
    displayName: Milvus API Key
    description: Secret containing the optional token or API key for Milvus authentication.

  - id: collection_filter
    type: STRING
    displayName: Collection Filter
    defaults: ""
    description: Optional substring filter for Milvus collection names to inspect. If empty, all collections are audited.

  - id: max_unindexed_entities_threshold
    type: INT
    displayName: Max Unindexed Entities Threshold
    defaults: 5000
    description: Maximum permissible entities residing in unindexed growing segments before alerting.

  - id: alert_on_failed_indexes
    type: BOOL
    displayName: Alert on Failed Index Builds
    defaults: true
    description: Whether to alert immediately if any vector index build has failed or stalled.

tasks:
  - id: audit_milvus_indexes
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates Milvus vector database REST API to audit collection indexing states and growing segment sizes.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      MILVUS_ENDPOINT: "{{ inputs.milvus_endpoint }}"
      MILVUS_API_KEY: "{{ inputs.milvus_api_key }}"
      COLLECTION_FILTER: "{{ inputs.collection_filter }}"
      MAX_UNINDEXED: "{{ inputs.max_unindexed_entities_threshold }}"
      ALERT_FAILED: "{{ inputs.alert_on_failed_indexes }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      endpoint = os.environ.get("MILVUS_ENDPOINT", "http://milvus:19530").rstrip("/")
      api_key = os.environ.get("MILVUS_API_KEY", "").strip()
      filter_name = os.environ.get("COLLECTION_FILTER", "").strip().lower()
      max_unindexed = int(os.environ.get("MAX_UNINDEXED", "5000"))
      alert_failed = os.environ.get("ALERT_FAILED", "true").lower() == "true"

      headers = {"Content-Type": "application/json"}
      if api_key:
          headers["Authorization"] = f"Bearer {api_key}"

      collections_url = f"{endpoint}/v2/vectordb/collections/list"
      print(f"Connecting to Milvus endpoint at: {endpoint}...")

      try:
          resp = requests.post(collections_url, json={}, headers=headers, timeout=15)
          resp.raise_for_status()
          collections_data = resp.json().get("data", [])
      except Exception as err:
          print(f"ERROR: Failed to connect to Milvus API at {collections_url}: {err}", file=sys.stderr)
          sys.exit(1)

      total_audited = 0
      failed_indexes = []
      high_unindexed_collections = []

      for col_name in collections_data:
          if filter_name and filter_name not in col_name.lower():
              continue

          total_audited += 1

          # Query index state and stats
          try:
              idx_resp = requests.post(f"{endpoint}/v2/vectordb/indexes/describe", json={"collectionName": col_name}, headers=headers, timeout=10)
              idx_data = idx_resp.json() if idx_resp.status_code == 200 else {}
              index_state = idx_data.get("data", [{}])[0].get("state", "Finished") if idx_data.get("data") else "Finished"

              stats_resp = requests.post(f"{endpoint}/v2/vectordb/collections/get_stats", json={"collectionName": col_name}, headers=headers, timeout=10)
              stats_data = stats_resp.json() if stats_resp.status_code == 200 else {}
              unindexed_count = int(stats_data.get("data", {}).get("row_count", 0))
          except Exception as e:
              print(f"Warning: Failed to query stats for collection {col_name}: {e}")
              index_state = "Finished"
              unindexed_count = 0

          if alert_failed and index_state not in ("Finished", "None"):
              failed_indexes.append({
                  "collection": col_name,
                  "index_state": index_state,
                  "field_name": "vector_embedding"
              })

          if unindexed_count > max_unindexed:
              high_unindexed_collections.append({
                  "collection": col_name,
                  "unindexed_entities": unindexed_count,
                  "threshold": max_unindexed
              })

      degraded = len(failed_indexes) > 0 or len(high_unindexed_collections) > 0
      print(f"Milvus audit complete. Collections: {total_audited}, Degraded: {degraded}")

      Kestra.outputs({
          "total_audited": total_audited,
          "is_degraded": degraded,
          "failed_indexes_count": len(failed_indexes),
          "high_unindexed_count": len(high_unindexed_collections)
      })

  - id: check_indexing_health
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether any collection exhibits failed indexes or excessive unindexed entity counts.
    condition: "{{ outputs.audit_milvus_indexes.vars.is_degraded }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to designated Slack webhook when Milvus indexes stall.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#mlops-alerts",
            "username": "Milvus Sentinel",
            "icon_emoji": ":warning:",
            "text": "*CRITICAL: Milvus Index Degradation Detected*\n*Cluster:* `{{ inputs.milvus_endpoint }}`\n*Total Collections Audited:* `{{ outputs.audit_milvus_indexes.vars.total_audited }}`\n*Failed Indexes Count:* `{{ outputs.audit_milvus_indexes.vars.failed_indexes_count }}`\n*High Unindexed Collections Count:* `{{ outputs.audit_milvus_indexes.vars.high_unindexed_count }}`"
          }
    else:
      - id: log_nominal_state
        type: io.kestra.plugin.core.log.Log
        description: Emits confirmation that all audited Milvus collection indexes and segment allocations operate within SLA.
        message: "Milvus collection indexing nominal on {{ inputs.milvus_endpoint }}. Audited {{ outputs.audit_milvus_indexes.vars.total_audited }} collections. Zero index failures or threshold breaches."

  - id: export_milvus_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured index audit report for long-term SIEM retention or vector quality scorecards.
    format:
      total_audited: "{{ outputs.audit_milvus_indexes.vars.total_audited }}"
      is_degraded: "{{ outputs.audit_milvus_indexes.vars.is_degraded }}"
      failed_indexes_count: "{{ outputs.audit_milvus_indexes.vars.failed_indexes_count }}"
      high_unindexed_count: "{{ outputs.audit_milvus_indexes.vars.high_unindexed_count }}"

outputs:
  - id: total_audited
    type: INT
    value: "{{ outputs.audit_milvus_indexes.vars.total_audited }}"
  - id: is_degraded
    type: BOOLEAN
    value: "{{ outputs.audit_milvus_indexes.vars.is_degraded }}"
  - id: failed_indexes_count
    type: INT
    value: "{{ outputs.audit_milvus_indexes.vars.failed_indexes_count }}"
  - id: high_unindexed_count
    type: INT
    value: "{{ outputs.audit_milvus_indexes.vars.high_unindexed_count }}"

triggers:
  - id: scheduled_hourly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recurring schedule evaluating Milvus indexing health every hour.
    cron: "0 * * * *"

extend:
  title: Milvus Collection Index State and Unindexed Entity Sentinel
  metaTitle: Milvus Collection Index State and Unindexed Entity Sentinel Blueprint
  shortDescription: Audits Milvus vector database collections to verify index completeness, detect build failures, and surface unindexed entity backlogs.
  metaDescription: Audits Milvus vector database collections to verify index completeness, detect build failures, and surface unindexed entity backlogs before RAG query latency spikes.
  description: |
    Audits Milvus vector database collections to verify index completeness, detect build failures, and surface unindexed entity backlogs before RAG query latency spikes.
  tags:
    - Data
    - AI
