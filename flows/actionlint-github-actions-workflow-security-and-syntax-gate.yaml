id: actionlint-github-actions-workflow-security-and-syntax-gate
namespace: company.devops

inputs:
  - id: workflow_file
    type: FILE
    displayName: "GitHub Actions Workflow File"
    description: "The GitHub Actions workflow YAML file (.github/workflows/*.yml) to evaluate for script injection vulnerabilities, syntax errors, and schema contract violations. Used when running manually or chaining as a Subflow; ignored when the webhook trigger fires."

triggers:
  - id: scan_on_pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Allows GitHub Actions PR workflows, pre-commit webhooks, or centralized repository scanners to POST workflow files directly to this gate. fetchType: STORE safely streams the POST body into Kestra internal storage as trigger.uri rather than exposing untrusted text to string interpolation."
    key: "{{ secret('ACTIONLINT_WEBHOOK_KEY') }}"
    fetchType: STORE
    disabled: true

tasks:
  - id: run_actionlint
    type: io.kestra.plugin.scripts.shell.Commands
    description: |
      Runs actionlint inside an isolated container against the provided workflow definition.
      Generates a structured JSON diagnostic report capturing untrusted input script injection
      vulnerabilities (CWE-78), syntax errors, expression type mismatches, and linter warnings.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      entryPoint: []
    containerImage: rhysd/actionlint:latest
    commands:
      - "cp {{ trigger.uri is defined ? trigger.uri : inputs.workflow_file }} workflow.yaml"
      - "actionlint -format '{{json .}}' workflow.yaml > actionlint_report.json || true"
      - "cat actionlint_report.json"
    outputFiles:
      - "actionlint_report.json"
    allowFailure: true

  - id: classify_workflow_compliance
    type: io.kestra.plugin.core.debug.Return
    description: |
      Parses actionlint_report.json and classifies the outcome:
      - UNREACHABLE: Diagnostic report was never produced due to container error or storage failure.
      - BLOCK_SECURITY: Critical script injection vulnerability detected where untrusted context expressions are interpolated directly into shell run: commands.
      - BLOCK_SYNTAX: Structural YAML syntax errors, missing required schema keys, or invalid expression property accesses.
      - WARN: Non-blocking linter findings such as deprecated runner labels or shellcheck style notices.
      - PASS: Clean workflow validation with zero findings.
    format: "{{ outputs.run_actionlint.outputFiles['actionlint_report.json'] is defined ? (read(outputs.run_actionlint.outputFiles['actionlint_report.json']) | jq('if (. | length) == 0 then \"PASS\" elif ([.[] | select(.message | test(\"untrusted\"; \"i\"))] | length) > 0 then \"BLOCK_SECURITY\" elif ([.[] | select(.kind == \"syntax-check\" or (.kind == \"expression\" and (.message | test(\"untrusted\"; \"i\") | not)))] | length) > 0 then \"BLOCK_SYNTAX\" else \"WARN\" end') | first) : 'UNREACHABLE' }}"

  - id: route_by_workflow_compliance
    type: io.kestra.plugin.core.flow.Switch
    description: "Branches on the compliance verdict: BLOCK_SECURITY sends a high-priority Slack alert and immediately fails the gate; BLOCK_SYNTAX alerts and halts execution on syntax bugs; WARN alerts team channels without breaking builds; PASS confirms clean validation; UNREACHABLE alerts on diagnostic execution failure."
    value: "{{ outputs.classify_workflow_compliance.value }}"
    cases:
      "BLOCK_SECURITY":
        - id: alert_security_violation
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches an urgent security alert specifying the exact line number, vulnerable context expression, and remediation guidance."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "CRITICAL: GitHub Actions workflow security gate BLOCKED execution {{ execution.id }} on flow {{ flow.id }}. Script injection vulnerability detected: {{ read(outputs.run_actionlint.outputFiles['actionlint_report.json']) | jq('[.[] | select(.message | test(\"untrusted\"; \"i\")) | \"Line \" + (.line|tostring) + \": \" + .message] | join(\" | \")') | first }}. Immediate remediation: Do not interpolate untrusted expressions directly into shell run: commands; pass them via an intermediate environment variable."
            }
        - id: fail_security_gate
          type: io.kestra.plugin.core.execution.Fail
          description: "Hard-fails the execution so downstream release steps or parent pipelines blocking on this gate are stopped immediately."
          errorMessage: "GitHub Actions workflow security gate failed: untrusted input injection vulnerability detected. Review execution logs and actionlint report."

      "BLOCK_SYNTAX":
        - id: alert_syntax_error
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Sends an alert detailing workflow syntax errors and schema contract violations."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "GitHub Actions workflow syntax gate BLOCKED execution {{ execution.id }} on flow {{ flow.id }}. Syntax or structural error: {{ read(outputs.run_actionlint.outputFiles['actionlint_report.json']) | jq('[.[] | select(.kind == \"syntax-check\" or (.kind == \"expression\" and (.message | test(\"untrusted\"; \"i\") | not))) | \"Line \" + (.line|tostring) + \": \" + .message] | join(\" | \")') | first }}."
            }
        - id: fail_syntax_gate
          type: io.kestra.plugin.core.execution.Fail
          description: "Fails the execution due to workflow syntax errors."
          errorMessage: "GitHub Actions workflow syntax gate failed: invalid syntax or unresolvable expression detected."

      "WARN":
        - id: alert_linter_warning
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Notifies team of workflow linter warnings (e.g. deprecated runner labels, unused actions) without blocking the pipeline."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "GitHub Actions workflow gate WARNING (execution {{ execution.id }}): Linter issues found: {{ read(outputs.run_actionlint.outputFiles['actionlint_report.json']) | jq('[.[] | \"Line \" + (.line|tostring) + \": \" + .message] | join(\" | \")') | first }}."
            }

      "PASS":
        - id: log_clean_workflow
          type: io.kestra.plugin.core.log.Log
          description: "Logs confirmation of clean workflow validation with zero findings."
          message: "GitHub Actions workflow validation passed with zero security vulnerabilities, syntax errors, or linter warnings."

      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Alerts when actionlint container failed to produce a report due to container error or malformed input."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "GitHub Actions workflow gate UNREACHABLE: actionlint container failed to produce actionlint_report.json. Check task logs for execution {{ execution.id }}."
            }
        - id: fail_unreachable
          type: io.kestra.plugin.core.execution.Fail
          description: "Fails execution when the static analysis engine could not run."
          errorMessage: "GitHub Actions workflow scan failed to complete. Check actionlint runner logs."

    defaults:
      - id: log_default_status
        type: io.kestra.plugin.core.log.Log
        message: "Completed GitHub Actions workflow compliance evaluation with status: {{ outputs.classify_workflow_compliance.value }}"

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Records persistent audit log entry for passing and warning runs."
    message: "Workflow compliance gate completed: status={{ outputs.classify_workflow_compliance.value }}, execution={{ execution.id }}."

errors:
  - id: alert_gate_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Fires when unexpected execution crashes occur or when a Fail task deliberately fails the gate."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "GitHub Actions workflow security gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). If status is BLOCK_SECURITY or BLOCK_SYNTAX, this failure is intentional to protect the deployment pipeline."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_workflow_compliance.value }}"

extend:
  title: "actionlint GitHub Actions Workflow Security and Syntax Gate"
  metaTitle: actionlint GitHub Actions Workflow Security and Syntax Gate for Kestra
  shortDescription: Validate GitHub Actions workflows with actionlint, block CI pipelines on critical script injection vulnerabilities and syntax errors, and warn on runner deprecations.
  metaDescription: Block GitHub Actions workflows on script injection vulnerabilities and syntax errors while warning on runner deprecations using actionlint.
  description: |
    GitHub Actions workflow files control privileged execution environments with direct access to cloud credentials, deployment keys, and package registry tokens. When workflow definitions unsafely interpolate untrusted context expressions like pull request titles, commit messages, or issue comments directly into inline shell scripts (`run:` steps), attackers can execute arbitrary commands in CI runners (CWE-78 script injection). Furthermore, invalid expression syntax, unresolvable context properties, and deprecated runner labels frequently break automated release trains midway through deployment.

    This blueprint runs `actionlint` in an isolated container to parse GitHub Actions workflow definitions against strict schemas, evaluate expression types, and detect script injection vulnerabilities. Rather than treating all findings identically, the workflow separates critical script injection exposures and fatal syntax errors (which immediately fail the gate via `Fail` tasks to halt downstream CI pipelines) from non-blocking linter warnings (such as deprecated runner labels or shellcheck style notices, which page Slack for developer awareness without breaking builds).

    ## How it works

    1. `scan_on_pr_webhook` (`io.kestra.plugin.core.trigger.Webhook`) allows CI pull request workflows or repository pre-commit hooks to POST changed workflow files directly to Kestra. `fetchType: STORE` safely streams the payload into Kestra internal storage as `trigger.uri`, preventing untrusted YAML content from being exposed to command-line string interpolation. Manual or parent `Subflow` executions provide the workflow via the `workflow_file` input.
    2. `run_actionlint` (`io.kestra.plugin.scripts.shell.Commands`) executes the `rhysd/actionlint:latest` container with `entryPoint: []` to run `actionlint -format '{{json .}}'` against the workflow file, writing findings to `actionlint_report.json`. `allowFailure: true` ensures that linter exit code 1 (indicating issues were detected) does not abort the execution before structured classification.
    3. `classify_workflow_compliance` (`io.kestra.plugin.core.debug.Return`) inspects the diagnostic report using `jq`:
       - If `actionlint_report.json` was not generated, it classifies as `UNREACHABLE`.
       - If findings contain untrusted context interpolations (`is potentially untrusted` / script injection), it classifies as `BLOCK_SECURITY`.
       - If findings contain syntax or structural expression errors (`kind == "syntax-check"` or unresolvable properties), it classifies as `BLOCK_SYNTAX`.
       - If only linter warnings remain (e.g., deprecated runner labels), it classifies as `WARN`.
       - If zero issues were found, it classifies as `PASS`.
    4. `route_by_workflow_compliance` (`io.kestra.plugin.core.flow.Switch`) branches on the classification:
       - `BLOCK_SECURITY`: Sends an urgent Slack alert detailing the exact line and vulnerability, then fires `fail_security_gate` (`io.kestra.plugin.core.execution.Fail`) to hard-fail the pipeline.
       - `BLOCK_SYNTAX`: Sends a syntax failure alert to Slack and fires `fail_syntax_gate`.
       - `WARN`: Dispatches an informational Slack notification with the findings for backlog cleanup, allowing the execution to succeed.
       - `PASS`: Records confirmation in execution logs.
       - `UNREACHABLE`: Alerts on runner container or storage failure.
    5. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) records a persistent status line in Kestra execution history for continuous compliance tracking.
    6. Root `errors` block alerts Slack whenever an unexpected system fault occurs or when `Fail` tasks deliberately stop the pipeline.

    ## What you get

    - Automated prevention of CWE-78 script injection vulnerabilities in GitHub Actions workflows before malicious or vulnerable pull requests merge.
    - Clear distinction between fatal security risks/syntax errors (hard block) and non-breaking linter hygiene warnings (Slack notification only).
    - Hard stop: `fail_security_gate` ensures parent CI/CD flows or Subflow orchestrators halt immediately when a critical security issue is found.
    - Actionable remediation advice: alerts indicate the exact line number, vulnerable variable, and instruction to pass values through environment variables.
    - Standardized execution output (`status`: `PASS`, `WARN`, `BLOCK_SECURITY`, `BLOCK_SYNTAX`, `UNREACHABLE`) for automated downstream routing.

    ## Who it's for

    - Platform Engineers and SecOps teams enforcing software supply-chain security and workflow standards across corporate GitHub organizations.
    - DevOps and CI/CD maintainers who need automated gates to catch broken workflow syntax before running expensive deployment pipelines.
    - Security champions looking to eliminate untrusted input interpolation in GitHub Actions without relying solely on manual PR reviews.

    ## Why orchestrate this with Kestra

    Standalone CLI linters emit exit codes, but cannot coordinate multi-tier security decisions, alert designated team channels with tailored remediation guidance, or halt downstream enterprise release flows. Kestra transforms `actionlint` into an automated, auditable compliance gate with persistent execution history, secure credential handling, and webhook-driven CI integration.

    ## Prerequisites

    - Docker runtime available to the Kestra worker to run the `rhysd/actionlint:latest` container (no external licenses or paid accounts required).
    - A GitHub Actions workflow YAML file to evaluate.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `ACTIONLINT_WEBHOOK_KEY`: Secret authentication key for the inbound webhook trigger (`.../executions/webhook/{namespace}/{flowId}/{key}`). Required only if `scan_on_pr_webhook` is enabled.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used to dispatch security blocks, syntax errors, linter warnings, and system failure alerts.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret (and `ACTIONLINT_WEBHOOK_KEY` if using webhooks) in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Click **Execute**, upload a test workflow YAML file (for example a workflow interpolating `${{ github.event.issue.title }}` inside a `run:` step to observe a `BLOCK_SECURITY` outcome), and verify the execution log.
    4. Enable `scan_on_pr_webhook` and configure your repository CI pipeline or pre-commit hook to POST changed workflow files on pull request events.

    ## How to extend

    - Add an automated GitHub PR review comment task using `io.kestra.plugin.github.pulls.Comment` to post inline line annotations directly on the pull request.
    - Pass an enterprise `.actionlint.yaml` configuration file as an optional input to enforce custom runner labels, private composite action schemas, or organization-specific shellcheck rules.
    - Integrate with a centralized security metrics dashboard or Datadog/Prometheus to track workflow security compliance trends over time.

    ## Links

    - [actionlint Documentation](https://github.com/rhysd/actionlint)
    - [GitHub Security Hardening Guide for GitHub Actions](https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections)
    - [Kestra Docker Script Runner](https://kestra.io/plugins/scripts/runner/docker/io.kestra.plugin.scripts.runner.docker.docker)
    - [Kestra Fail Task](https://kestra.io/plugins/core/tasks/execution/io.kestra.plugin.core.execution.fail)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false
