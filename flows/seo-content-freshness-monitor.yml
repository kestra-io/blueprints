id: seo-content-freshness-monitor
namespace: company.content

description: |
  Monitor sitemap URLs for stale content, score freshness with Python, and alert Slack.

inputs:
  - id: sitemap_url
    type: STRING
    description: Public sitemap.xml URL to audit
    defaults: https://example.com/sitemap.xml
  - id: stale_days
    type: INT
    description: Days after which a page counts as stale
    defaults: 90

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every Monday at 8 AM UTC
    cron: "0 8 * * 1"
  - id: on_demand_audit
    type: io.kestra.plugin.core.trigger.Webhook
    description: Trigger an on-demand freshness audit from CI or a CMS webhook
    key: "{{ secret('CONTENT_WEBHOOK_KEY') }}"

tasks:
  - id: fetch_sitemap
    type: io.kestra.plugin.core.http.Request
    description: Download the sitemap.xml and store it for parsing
    uri: "{{ inputs.sitemap_url }}"
    method: GET
  - id: score_freshness
    type: io.kestra.plugin.scripts.python.Script
    description: Parse sitemap lastmod dates and flag pages older than the stale threshold
    inputFiles:
      sitemap.xml: "{{ outputs.fetch_sitemap.body }}"
    script: |
      import re, json, datetime
      with open("sitemap.xml", errors="ignore") as f:
          xml = f.read()
      urls = re.findall(r"<loc>(.*?)</loc>", xml)
      lastmods = re.findall(r"<lastmod>(.*?)</lastmod>", xml)
      cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days={{ inputs.stale_days }})
      stale = []
      for i, u in enumerate(urls):
          lm = lastmods[i] if i < len(lastmods) else None
          try:
              dt = datetime.datetime.fromisoformat(lm.replace("Z", "+00:00")) if lm else None
          except Exception:
              dt = None
          if dt is None or dt < cutoff:
              stale.append({"url": u, "lastmod": lm})
      print(f"::{{stale_count}}::{len(stale)}")
      with open("stale.json", "w") as out:
          json.dump({"total": len(urls), "stale": stale[:50], "stale_count": len(stale)}, out, indent=2)
    outputFiles:
      - stale.json
  - id: fanout_checks
    type: io.kestra.plugin.core.flow.Parallel
    description: Run freshness logging and stale-page sampling side by side
    tasks:
      - id: log_audit_summary
        type: io.kestra.plugin.core.log.Log
        description: Log total versus stale page counts for the run
        message: "Audited sitemap {{ inputs.sitemap_url }} — see {{ outputs.score_freshness.outputFiles['stale.json'] }}"
      - id: sample_stale_pages
        type: io.kestra.plugin.core.http.Request
        description: Probe the first sitemap URL to confirm the site still responds
        uri: "{{ inputs.sitemap_url }}"
        method: HEAD
  - id: decide_alert
    type: io.kestra.plugin.core.flow.If
    description: Only notify Slack when at least one stale page was detected
    condition: "{{ json(read(outputs.score_freshness.outputFiles['stale.json'])).stale_count > 0 }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the stale-content summary to the content channel
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": ":newspaper: SEO freshness audit for {{ inputs.sitemap_url }} found stale pages. Report: {{ outputs.score_freshness.outputFiles['stale.json'] }}"}

extend:
  title: SEO Content Freshness Monitor
  metaTitle: SEO Content Freshness Monitor with Kestra
  shortDescription: Audit sitemap freshness weekly and alert Slack about stale pages.
  description: |
    Short summary: audits a sitemap.xml on a schedule or via webhook, scores each URL against a staleness threshold, and posts a Slack alert with the report.

    Prerequisites:
      - Secrets:
        - SLACK_WEBHOOK_URL: Slack incoming webhook for content alerts (required)
        - CONTENT_WEBHOOK_KEY: key securing the on-demand webhook trigger (required)
      - Services: public sitemap.xml URL, Python runner in Kestra.

    Inputs:
      - sitemap_url (STRING, default https://example.com/sitemap.xml): sitemap to audit.
      - stale_days (INT, default 90): age threshold; allowed values 1-730.

    Outputs:
      - outputs.score_freshness.outputFiles['stale.json']: JSON with total, stale_count, and up to 50 stale URLs.

    Quick start:
      1. Set secrets SLACK_WEBHOOK_URL and CONTENT_WEBHOOK_KEY.
      2. Upload the flow and adjust sitemap_url and stale_days inputs.
      3. Enable the weekly schedule and run once manually.

    How to extend:
      - Lower stale_days per section or feed per-URL thresholds from a CSV.
      - Add an EachSequential loop that re-fetches every stale URL and records HTTP status.
      - Route critical staleness to Jira or your CMS update queue.

    Links:
      - [Slack plugin docs](https://kestra.io/plugins/plugin-slack)
      - [HTTP Request docs](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
      - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - Marketing
    - Scheduling
  ee: false
  demo: false
  metaDescription: Audit sitemap freshness weekly, flag stale pages, and alert Slack via Kestra.
