id: druid-segment-availability-gate
namespace: company.team
description: |
  Query Druid's sys.segments metadata table on a schedule, flag any segment
  that is published (used) but not currently available on any Historical
  or realtime task, classify the result as HEALTHY, AT_RISK, or
  UNREACHABLE, log clean audits, and alert Slack the moment a silent data
  gap is found or the cluster cannot be reached.

inputs:
  - id: druid_url
    type: STRING
    displayName: "Druid Avatica JDBC URL"
    defaults: "jdbc:avatica:remote:url=http://druid-router:8888/druid/v2/sql/avatica/;transparent_reconnection=true"
    description: "JDBC Avatica connection string, matching this plugin's own documented format (see druid-to-pandas.yaml)."
  - id: max_unavailable_segments
    type: INT
    displayName: "Max Allowed Unavailable Segments"
    defaults: 0
    description: "Breach when the count of published-but-unavailable segments exceeds this number. Default 0 means any such segment at all is a breach."

triggers:
  - id: druid_segment_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audit segment availability every 30 minutes. Shipped disabled; enable it once druid_url points at a real cluster and a manual run has been verified."
    cron: "*/30 * * * *"
    disabled: true
    inputs:
      druid_url: "jdbc:avatica:remote:url=http://druid-router:8888/druid/v2/sql/avatica/;transparent_reconnection=true"
      max_unavailable_segments: 0

tasks:
  - id: audit_segment_availability
    type: io.kestra.plugin.jdbc.druid.Query
    description: "Counts rows in sys.segments where is_published = 1 and is_available = 0 - a segment Druid considers used but which no Historical or realtime task is currently serving, meaning queries against that datasource silently return incomplete results. Both columns and their exact semantics are verified from Druid's own SQL metadata table documentation. plugin-jdbc-druid has no dedicated cluster-health task, so this uses its native SQL query task against Druid's own system table, matching the pattern this repo already uses for Cassandra's system_auth.roles and system_schema.keyspaces."
    url: "{{ inputs.druid_url }}"
    sql: "SELECT COUNT(*) AS unavailable_count FROM sys.segments WHERE is_published = 1 AND is_available = 0"
    fetchType: FETCH_ONE
    allowFailure: true

  - id: classify_availability_risk
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when the query produced no row, AT_RISK when the unavailable count exceeds max_unavailable_segments, otherwise HEALTHY."
    format: "{{ outputs.audit_segment_availability.row is defined ? (outputs.audit_segment_availability.row.unavailable_count > inputs.max_unavailable_segments ? 'AT_RISK' : 'HEALTHY') : 'UNREACHABLE' }}"

  - id: route_by_availability
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation when healthy, page Slack when a published segment is unavailable, or page Slack when the cluster could not be queried."
    value: "{{ outputs.classify_availability_risk.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "No published segment on {{ inputs.druid_url }} is currently unavailable."
      "AT_RISK":
        - id: alert_at_risk
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Druid segment availability gate AT_RISK: {{ outputs.audit_segment_availability.row.unavailable_count }} published segment(s) on {{ inputs.druid_url }} are not currently available (threshold {{ inputs.max_unavailable_segments }}). Queries against the affected datasource(s) may be silently returning incomplete results. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Druid segment availability gate UNREACHABLE: the query against sys.segments on {{ inputs.druid_url }} returned no row (connection failure or the Broker/Router is down). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed Druid segment availability audit with status: {{ outputs.classify_availability_risk.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit status line recorded on every run regardless of branch, for a continuous data-completeness trend in the execution history."
    message: "Druid segment availability audit: url={{ inputs.druid_url }}, status={{ outputs.classify_availability_risk.value }}, threshold={{ inputs.max_unavailable_segments }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the sentinel flow itself fails, so a broken audit never silently stops monitoring segment availability."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Druid segment availability gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). Segment availability status is now unknown; check the task logs and the cluster manually."
      }

extend:
  title: "Druid Segment Availability Gate"
  shortDescription: Audit Druid's sys.segments for published segments that are not currently available, alert Slack on a silent data gap, and classify cluster reachability.
  metaTitle: Druid Segment Availability Gate with Kestra
  metaDescription: "Audit Druid sys.segments for published-but-unavailable segments and alert Slack before queries silently return incomplete results."
  description: |
    Druid's own documentation draws a sharp line between two different flags on every
    segment: `is_published` (the metadata store considers it used) and `is_available`
    (some Historical or realtime task is actually serving it right now). A segment can be
    published and still unavailable - a Historical crashed mid-reassignment, a load rule
    changed before balancing finished, a deep storage blip during startup - and when that
    happens, a query against that datasource does not error. It just quietly returns fewer
    rows than it should. This blueprint queries `sys.segments` for exactly that gap,
    classifies the cluster's state, and alerts Slack the moment it appears or the cluster
    cannot be reached.

    ## How it works

    1. `druid_segment_audit_schedule` (`io.kestra.plugin.core.trigger.Schedule`) runs every 30 minutes, shipped disabled so you can validate a manual run first.
    2. `audit_segment_availability` (`io.kestra.plugin.jdbc.druid.Query`) runs `SELECT COUNT(*) AS unavailable_count FROM sys.segments WHERE is_published = 1 AND is_available = 0` with `fetchType: FETCH_ONE` and `allowFailure: true`, so an unreachable cluster produces no row instead of failing the task outright.
    3. `classify_availability_risk` (`io.kestra.plugin.core.debug.Return`) classifies the result as `UNREACHABLE` (no row), `AT_RISK` (`unavailable_count > max_unavailable_segments`), or `HEALTHY`.
    4. `route_by_availability` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` logs a clean check, `AT_RISK` pages Slack with the unavailable count, `UNREACHABLE` pages Slack that the cluster could not be queried, and the `defaults:` block catches any unexpected classification value.
    5. `log_audit_status` always runs last, printing the classification regardless of which branch fired.
    6. The `errors` block alerts Slack separately if the flow itself fails outside these handled branches.

    ## What you get

    - A direct, Druid-native answer to "is any published segment actually missing from query results right now", not an inference from dashboard latency or error rates.
    - A three-way classification (`HEALTHY`/`AT_RISK`/`UNREACHABLE`) so a broken audit is never mistaken for a healthy cluster.
    - A final status log every run, so the execution history doubles as a data-completeness trend for the cluster.
    - A worked example of auditing Druid's `sys.segments` metadata table through the plugin's plain SQL `Query` task.

    ## Who it's for

    - Platform and data engineering teams running self-hosted Druid who need an early signal when segment availability silently degrades.
    - SREs who want a pre-production gate confirming every published segment is actually being served before cutting traffic over.
    - Anyone evaluating the Druid plugin who wants a worked example of `sys.segments` auditing alongside this repo's existing Cassandra `system_auth.roles`/`system_schema.keyspaces` sentinels.

    ## Why orchestrate this with Kestra

    `sys.segments` is a live, read-only snapshot; querying it by hand in the Druid console answers one moment in time and notifies nobody. Kestra supplies the schedule, the three-way risk classification as a first-class branch, and an execution history that shows exactly when a published segment first went unavailable and for how long it stayed that way.

    ## Prerequisites

    - A reachable Druid cluster with the SQL Avatica JDBC endpoint enabled (the default on the Router or Broker process).
    - A Slack incoming webhook for alerts.

    Local testing:
    `docker run -d --name druid-availability-gate -p 8889:8888 -e DRUID_SINGLE_NODE_CONF=micro-quickstart apache/druid:latest`
    `docker network connect YOUR_KESTRA_NETWORK druid-availability-gate` (only needed if the Kestra Worker runs in a separate Docker network than this container; set `druid_url` to use `druid-availability-gate` as the host from inside that network, or `localhost:8889` from the host). Druid's official single-node quickstart image bundles ZooKeeper, the metadata store, and every Druid process in one container for local evaluation; production clusters run these as separate services, matching Druid's own deployment documentation.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_at_risk`, `alert_unreachable`, and the `errors` block.
    - This blueprint's `druid_url` carries no embedded credentials, matching this plugin's own documented example (`druid-to-pandas.yaml`), which targets an unauthenticated local Avatica endpoint. For a secured cluster, add `username`/`password` properties to `audit_segment_availability` from `{{ secret(...) }}` values rather than hardcoding them.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_SLACK_WEBHOOK_URL=$(echo -n 'https://hooks.slack.com/...' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `druid_url` (STRING, default `jdbc:avatica:remote:url=http://druid-router:8888/druid/v2/sql/avatica/;transparent_reconnection=true`): Avatica JDBC connection string.
    - `max_unavailable_segments` (INT, default `0`): breach threshold; `0` means any published-but-unavailable segment at all breaches.

    ### Outputs

    - `outputs.audit_segment_availability.row.unavailable_count`: the raw count for every successful run (absent when the cluster is unreachable).
    - `outputs.classify_availability_risk.value`: `HEALTHY`, `AT_RISK`, or `UNREACHABLE` for every run.

    ## Quick start

    1. Start Druid locally with the command above and load the bundled Wikipedia sample dataset through the Druid console, or point `druid_url` at an existing cluster.
    2. Add the `SLACK_WEBHOOK_URL` secret.
    3. Run the flow manually and confirm `log_healthy` fires against a normally-balanced cluster.
    4. To exercise `AT_RISK`, stop a Historical process mid-rebalance in a non-production cluster (or lower `max_unavailable_segments` below the cluster's current transient unavailable count, if any) and re-run; confirm `alert_at_risk` fires with the expected count.
    5. Enable `druid_segment_audit_schedule` once you trust the check.

    ## How to extend

    - Group the audit by `datasource` (`SELECT datasource, COUNT(*) ... GROUP BY datasource`) to name which datasource is affected in the Slack alert, instead of only a cluster-wide count.
    - Loop over several `druid_url` values with `io.kestra.plugin.core.flow.Loop` (`ForEach` is deprecated) to sweep a multi-cluster fleet in one run.
    - Add a second audit against `is_overshadowed = 1 AND is_available = 1` to also catch segments still being served after they should have been superseded, a different kind of staleness risk `sys.segments` can also surface.
    - Cross-reference `sys.servers` to report which Historical processes are currently under-serving, for a fuller incident brief alongside the Slack alert.

    ## Pitfalls

    - **This blueprint does not attempt automated remediation.** Druid's segment-serving assignment is managed by the Coordinator's own balancing and load-rule logic; the Overlord's `markUsed`/`markUnused` APIs change whether a segment is *considered* used, not whether it is *currently being served*, and would be the wrong fix for this specific gap. No safe, verified single-call remediation for "published but unavailable" was found in Druid's own API reference, so this blueprint only audits and alerts.
    - **`is_available = 0` does not mean the segment is lost.** Verified from Druid's own documentation: it only means no Historical or realtime task is serving it *right now* - often transient during rebalancing, a rolling restart, or cluster scale-down. A single `AT_RISK` reading is a prompt to check the Coordinator console, not necessarily evidence of data loss.
    - **`allowFailure: true` on `audit_segment_availability` is what lets `UNREACHABLE` be classified instead of failing the execution outright**, matching this repo's own `cassandra-replication-audit-gate.yaml` pattern: a connection failure produces an undefined `row` output rather than aborting the flow, which `classify_availability_risk` reads as `UNREACHABLE`.
    - **`is_published`/`is_available`/`is_overshadowed` are returned as `0`/`1` longs, not SQL booleans.** Verified from Druid's own SQL metadata table reference; the `= 1` / `= 0` comparisons in this blueprint's query match that documented representation exactly.
    - **`Switch` case keys are quoted strings matching the classifier's exact output.** `"HEALTHY"`, `"AT_RISK"`, and `"UNREACHABLE"` must match `classify_availability_risk.value` verbatim; the `defaults:` block exists specifically to catch any value that does not match one of those three cases.

    ## Links

    - [plugin-jdbc-druid documentation](https://kestra.io/plugins/plugin-jdbc-druid)
    - [Druid SQL metadata tables reference](https://druid.apache.org/docs/latest/querying/sql-metadata-tables/)
    - [Druid data management API reference](https://druid.apache.org/docs/latest/api-reference/data-management-api/)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
