id: wikidata-org-name-entity-resolution
namespace: company.team

description: |
  Resolve the free-text organisation names in a CRM or vendor master to Wikidata QIDs
  with the Wikidata reconciliation service (the OpenRefine reconciliation API). Names
  are reconciled in one batched request with a type and country filter, confident
  matches are linked automatically and enriched with LEI, official website and
  dissolution date, and everything else lands in a review queue for a data steward.
  Records that resolve to the same QID are flagged as duplicates. Decisions are kept
  in the KV store, so a re-run only sends new or renamed records.

inputs:
  - id: records_csv
    type: STRING
    description: 'CSV with the header `record_id,name,country` (country as ISO 3166-1 alpha-2, optional). A webhook JSON body with a `records_csv` field overrides it. The defaults mix clear matches, ambiguous names, dissolved companies, a duplicate pair, an unknown company and an empty name.'
    defaults: |
      record_id,name,country
      ACC-1001,Siemens AG,DE
      ACC-1002,Apple,US
      ACC-1003,Mercury,
      ACC-1004,Wirecard,DE
      ACC-1005,Northern Rock,GB
      ACC-1006,Acme Widgets Ltd,GB
      ACC-1007,Infosys Limited,IN
      ACC-1008,Lufthansa,DE
      ACC-1009,Shell,GB
      ACC-1010,Apple Inc.,US
      ACC-1011,SIEMENS AG ,DE
      ACC-1012,,FR

  - id: steward_decisions
    type: STRING
    defaults: ""
    description: Review-queue answers, `record_id=QID` to confirm a match or `record_id=NONE` to reject it, separated by semicolons (e.g. `ACC-1008=Q9325;ACC-1005=NONE`).

  - id: entity_type
    type: STRING
    defaults: Q43229
    description: Wikidata class the candidates must be an instance of (Q43229 organization; Q4830453 business is narrower).

  - id: auto_link_score
    type: FLOAT
    defaults: 95
    description: Top candidate score (0-100) needed to auto-link when the service itself does not flag `match`.

  - id: min_margin
    type: FLOAT
    defaults: 10
    description: Points the top candidate must lead the runner-up by to auto-link. Ties (several items called "Mercury") always go to review.

  - id: min_score
    type: FLOAT
    defaults: 50
    description: Below this score the best candidate is discarded and the record is NO_MATCH.

  - id: max_queries
    type: INT
    defaults: 50
    description: Distinct names reconciled per run. The rest are DEFERRED and picked up by the next run, which keeps each request small for the shared service.

triggers:
  - id: on_crm_export
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('ORG_RESOLUTION_WEBHOOK_KEY') }}"
    description: The CRM export job POSTs JSON with `records_csv` (and optionally `steward_decisions`) when accounts are created or renamed.

  - id: nightly_backlog
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 2 * * *"
    description: Works through DEFERRED records left by large exports.

tasks:
  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    key: wikidata_org_resolution
    errorOnMissing: false
    description: JSON array with one row per record_id (status, QID, score, LEI, website). Missing on the first run, which is the baseline.

  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Compares the incoming records with the stored state and decides an action per record:
      QUERY (new, renamed or deferred), KEEP, CONFIRM / REJECT (steward answer) or INVALID (empty
      name). Names are normalised (trim, case-fold) and keyed by md5(name|country), so "Siemens AG"
      and "SIEMENS AG " cost one query. The batch is a JSON object of reconciliation queries.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      records.csv: "{{ trigger.body.records_csv ?? inputs.records_csv }}"
      state.json: "{{ outputs.previous_state.value ?? '[]' }}"
    outputFiles:
      - base
    parameters:
      decisions: "{{ trigger.body.steward_decisions ?? inputs.steward_decisions }}"
      entity_type: "{{ inputs.entity_type }}"
      max_queries: "{{ inputs.max_queries }}"
    sql: |
      CREATE TABLE rec AS
      SELECT trim(record_id) AS record_id, trim(coalesce(name, '')) AS name,
             upper(trim(coalesce(country, ''))) AS country
      FROM read_csv('records.csv', header = true, all_varchar = true)
      WHERE trim(coalesce(record_id, '')) <> '';

      CREATE TABLE prev AS
      SELECT s->>'$.record_id' AS record_id, s->>'$.name' AS name, s->>'$.country' AS country, s->>'$.status' AS status
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('state.json'));

      INSERT INTO rec SELECT record_id, name, country FROM prev
      WHERE status = 'DEFERRED' AND record_id NOT IN (SELECT record_id FROM rec);

      CREATE TABLE dec AS
      SELECT trim(split_part(d, '=', 1)) AS record_id, upper(trim(split_part(d, '=', 2))) AS answer
      FROM unnest(string_split(:decisions, ';')) AS t(d) WHERE d LIKE '%=%';

      CREATE TABLE base AS
      SELECT r.*, lower(regexp_replace(r.name, '\s+', ' ', 'g')) AS norm_name,
             md5(lower(regexp_replace(r.name, '\s+', ' ', 'g')) || '|' || r.country) AS qkey,
             CASE WHEN r.name = '' THEN 'INVALID'
                  WHEN d.answer = 'NONE' THEN 'REJECT'
                  WHEN d.answer LIKE 'Q%' THEN 'CONFIRM'
                  WHEN p.record_id IS NULL OR p.status = 'DEFERRED'
                    OR lower(p.name) <> lower(r.name) OR p.country <> r.country THEN 'QUERY'
                  ELSE 'KEEP' END AS action,
             d.answer
      FROM rec r LEFT JOIN prev p USING (record_id) LEFT JOIN dec d USING (record_id);

      CREATE TABLE batch AS
      SELECT qkey, any_value(name) AS name, any_value(country) AS country
      FROM base WHERE action = 'QUERY' GROUP BY qkey ORDER BY qkey LIMIT CAST(:max_queries AS INTEGER);

      UPDATE base SET action = 'DEFERRED' WHERE action = 'QUERY' AND qkey NOT IN (SELECT qkey FROM batch);

      COPY base TO '{{ outputFiles.base }}' (FORMAT PARQUET);

      SELECT
        (SELECT count(*) FROM base) AS records,
        (SELECT count(*) FROM batch) AS queries,
        (SELECT count(*) FROM base WHERE action = 'DEFERRED') AS deferred,
        (SELECT count(*) FROM prev) = 0 AS is_baseline,
        (SELECT coalesce(CAST(json_group_object(qkey, json_object('query', name, 'type', :entity_type, 'limit', 3,
            'properties', CASE WHEN length(country) = 2 THEN json_array(json_object('pid', 'P17/P297', 'v', country)) ELSE json_array() END)) AS VARCHAR), '{}')
           FROM batch) AS queries_json,
        (SELECT coalesce(CAST(json_group_array(answer) AS VARCHAR), '[]') FROM base WHERE action = 'CONFIRM') AS confirm_ids;

  - id: call_wikidata
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.plan.outputs[0].row.queries > 0 or outputs.plan.outputs[0].row.confirm_ids != '[]' }}"
    then:
      - id: reconcile
        type: io.kestra.plugin.core.http.Request
        description: One POST for the whole batch. Each query carries the type filter and, when a country is known, a `P17/P297` (country ISO code) property that lifts candidates in that country.
        uri: https://wikidata-reconciliation.wmcloud.org/en/api
        method: POST
        contentType: application/x-www-form-urlencoded
        formData:
          queries: "{{ outputs.plan.outputs[0].row.queries_json }}"
        headers:
          User-Agent: kestra-wikidata-org-name-entity-resolution/1.0 (https://kestra.io/blueprints)
        options:
          timeout:
            connectTimeout: PT20S
            readIdleTimeout: PT3M
        retry:
          type: exponential
          interval: PT20S
          maxInterval: PT2M
          maxAttempts: 3

      - id: enrich
        type: io.kestra.plugin.core.http.Request
        description: Data extension for every top candidate plus the steward-confirmed QIDs, in one call. P1278 is the LEI, P856 the official website, P576 the dissolution date.
        uri: https://wikidata-reconciliation.wmcloud.org/en/api
        method: POST
        contentType: application/x-www-form-urlencoded
        formData:
          extend: "{{ {'ids': outputs.reconcile.body | jq('[.[] | .result[0].id // empty] + ' ~ outputs.plan.outputs[0].row.confirm_ids ~ ' | unique') | first, 'properties': [{'id': 'P1278'}, {'id': 'P856'}, {'id': 'P576'}]} | toJson }}"
        headers:
          User-Agent: kestra-wikidata-org-name-entity-resolution/1.0 (https://kestra.io/blueprints)
        options:
          timeout:
            readIdleTimeout: PT2M
        retry:
          type: constant
          interval: PT20S
          maxAttempts: 3

  - id: resolve
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Scores each queried name: AUTO_LINKED when the service flags `match` or the top score clears
      `auto_link_score` with at least `min_margin` over the runner-up; REVIEW when candidates are close
      or the linked item is dissolved; NO_MATCH when nothing scores `min_score`. Records sharing a
      linked QID get `duplicate_of`. Writes the golden table, the review queue and the new state.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      base.parquet: "{{ outputs.plan.outputFiles.base }}"
      state.json: "{{ outputs.previous_state.value ?? '[]' }}"
      rec.json: "{{ outputs.reconcile.body ?? '{}' }}"
      ext.json: "{{ outputs.enrich.body ?? '{\"rows\": {} }' }}"
    outputFiles:
      - golden_csv
      - review_csv
    parameters:
      auto_link_score: "{{ inputs.auto_link_score }}"
      min_margin: "{{ inputs.min_margin }}"
      min_score: "{{ inputs.min_score }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE base AS SELECT * FROM 'base.parquet';
      CREATE TABLE prev AS SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('state.json');
      CREATE TABLE rj AS SELECT CAST(content AS JSON) AS j FROM read_text('rec.json');
      CREATE TABLE ej AS SELECT json_extract(CAST(content AS JSON), '$.rows') AS j FROM read_text('ext.json');

      CREATE TABLE cand AS
      SELECT k AS qkey, from_json(json_extract(j, '$."' || k || '".result'), '["JSON"]') AS c
      FROM rj, unnest(json_keys(j)) AS t(k);

      CREATE TABLE top AS
      SELECT qkey, c[1]->>'$.id' AS qid, c[1]->>'$.name' AS label, c[1]->>'$.description' AS qdesc,
             CAST(c[1]->>'$.score' AS DOUBLE) AS score, CAST(c[1]->>'$.match' AS BOOLEAN) AS svc_match,
             CAST(c[1]->>'$.score' AS DOUBLE) - coalesce(CAST(c[2]->>'$.score' AS DOUBLE), 0) AS margin,
             c[2]->>'$.name' AS runner_up
      FROM cand;

      CREATE TABLE ext AS
      SELECT k AS qid,
             (SELECT string_agg(x->>'$.str', '|') FROM unnest(from_json(json_extract(j, '$."' || k || '".P1278'), '["JSON"]')) AS u(x)) AS lei,
             (SELECT x->>'$.str' FROM unnest(from_json(json_extract(j, '$."' || k || '".P856'), '["JSON"]')) AS u(x)
               ORDER BY length(x->>'$.str'), x->>'$.str' LIMIT 1) AS website,
             CAST(left(json_extract(j, '$."' || k || '".P576')->>'$[0].date', 10) AS DATE) AS dissolved
      FROM ej, unnest(json_keys(j)) AS t(k);

      CREATE TABLE fresh AS
      SELECT b.record_id, b.name, b.country, b.action,
             coalesce(t.label, CASE WHEN p.s->>'$.qid' = b.answer THEN p.s->>'$.label' END) AS label,
             coalesce(t.qdesc, CASE WHEN p.s->>'$.qid' = b.answer THEN p.s->>'$.qdesc' END) AS qdesc, round(t.score, 1) AS score, round(t.margin, 1) AS margin,
             CASE b.action WHEN 'CONFIRM' THEN b.answer WHEN 'QUERY' THEN t.qid END AS qid,
             CASE WHEN b.action = 'INVALID' THEN 'INVALID' WHEN b.action = 'DEFERRED' THEN 'DEFERRED'
                  WHEN b.action = 'REJECT' THEN 'REJECTED' WHEN b.action = 'CONFIRM' THEN 'CONFIRMED'
                  WHEN t.qid IS NULL OR t.score < CAST(:min_score AS DOUBLE) THEN 'NO_MATCH'
                  WHEN (t.svc_match OR (t.score >= CAST(:auto_link_score AS DOUBLE) AND t.margin >= CAST(:min_margin AS DOUBLE)))
                       AND x.dissolved IS NULL THEN 'AUTO_LINKED'
                  ELSE 'REVIEW' END AS status,
             CASE WHEN b.action = 'INVALID' THEN 'empty name'
                  WHEN b.action IN ('CONFIRM', 'REJECT') THEN 'steward decision'
                  WHEN b.action = 'QUERY' THEN nullif(concat_ws('; ',
                    CASE WHEN x.dissolved IS NOT NULL THEN 'dissolved ' || x.dissolved END,
                    CASE WHEN NOT coalesce(t.svc_match, false) AND t.margin < CAST(:min_margin AS DOUBLE) THEN 'close runner-up ' || t.runner_up END), '') END AS reason
      FROM base b LEFT JOIN top t ON t.qkey = b.qkey AND b.action = 'QUERY' LEFT JOIN ext x ON x.qid = t.qid
      LEFT JOIN prev p ON p.s->>'$.record_id' = b.record_id
      WHERE b.action <> 'KEEP';

      CREATE TABLE golden AS
      WITH merged AS (
        SELECT f.record_id, f.name, f.country, f.status, f.qid, f.label, f.qdesc, f.score, f.margin, f.reason,
               x.lei, x.website, x.dissolved, current_date AS resolved_at
        FROM fresh f LEFT JOIN ext x ON x.qid = f.qid AND f.status IN ('AUTO_LINKED', 'CONFIRMED', 'REVIEW')
        UNION ALL BY NAME
        SELECT s->>'$.record_id' AS record_id, s->>'$.name' AS name, s->>'$.country' AS country, s->>'$.status' AS status,
               s->>'$.qid' AS qid, s->>'$.label' AS label, s->>'$.qdesc' AS qdesc, CAST(s->>'$.score' AS DOUBLE) AS score,
               CAST(s->>'$.margin' AS DOUBLE) AS margin, s->>'$.reason' AS reason, s->>'$.lei' AS lei, s->>'$.website' AS website,
               CAST(s->>'$.dissolved' AS DATE) AS dissolved, CAST(s->>'$.resolved_at' AS DATE) AS resolved_at
        FROM prev WHERE s->>'$.record_id' NOT IN (SELECT record_id FROM fresh))
      SELECT *, CASE WHEN status IN ('AUTO_LINKED', 'CONFIRMED') AND qid IS NOT NULL
                     THEN nullif(min(record_id) OVER (PARTITION BY qid, status IN ('AUTO_LINKED', 'CONFIRMED')), record_id) END AS duplicate_of
      FROM merged;

      COPY (SELECT * FROM golden ORDER BY record_id) TO '{{ outputFiles.golden_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM golden WHERE status = 'REVIEW' ORDER BY record_id) TO '{{ outputFiles.review_csv }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM fresh WHERE action = 'QUERY') AS resolved_now,
        (SELECT count(*) FILTER (WHERE status = 'AUTO_LINKED') FROM golden) AS auto_linked,
        (SELECT count(*) FILTER (WHERE status = 'CONFIRMED') FROM golden) AS confirmed,
        (SELECT count(*) FILTER (WHERE status = 'REVIEW') FROM golden) AS in_review,
        (SELECT count(*) FILTER (WHERE status = 'NO_MATCH') FROM golden) AS no_match,
        (SELECT count(*) FILTER (WHERE status IN ('INVALID', 'REJECTED', 'DEFERRED')) FROM golden) AS other,
        (SELECT count(DISTINCT qid) FROM golden WHERE duplicate_of IS NOT NULL) AS duplicate_clusters,
        (SELECT count(*) FROM fresh WHERE status = 'REVIEW') AS new_review,
        (SELECT coalesce(string_agg(record_id || ' "' || name || '" -> ' || label || ' (' || qid || ', score ' || score || coalesce(', ' || reason, '') || ')', chr(10) ORDER BY record_id), '')
           FROM fresh WHERE status = 'REVIEW') AS review_lines,
        (SELECT chr(10) || '```' || coalesce(string_agg(record_id || '  ' || name || ' -> ' || qid || ' ' || label || coalesce(' (' || reason || ')', ''), chr(10) ORDER BY record_id), '') || '```'
           FROM fresh WHERE status = 'REVIEW') AS review_block,
        (SELECT coalesce(string_agg(record_id || ' = ' || duplicate_of || ' (' || qid || ')', '; '), '') FROM golden WHERE duplicate_of IS NOT NULL) AS duplicates,
        (SELECT CAST(json_group_array(json_object('record_id', record_id, 'name', name, 'country', country, 'status', status, 'qid', qid,
            'label', label, 'qdesc', qdesc, 'score', score, 'margin', margin, 'reason', reason, 'lei', lei, 'website', website,
            'dissolved', dissolved, 'resolved_at', resolved_at)) AS VARCHAR) FROM golden) AS state_json;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: wikidata_org_resolution
    value: "{{ outputs.resolve.outputs[0].row.state_json }}"

  - id: review_queue
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.resolve.outputs[0].row.new_review > 0 }}"
    then:
      - id: log_review
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.resolve.outputs[0].row.new_review }} record(s) need a steward decision:\n{{ outputs.resolve.outputs[0].row.review_lines }}"

      - id: notify_steward
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the run green when the webhook secret is not set; the queue is still in review_csv.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": {{ ('*Wikidata org resolution*: ' ~ outputs.resolve.outputs[0].row.new_review ~ ' new record(s) for review. Answer with `steward_decisions` (record_id=QID or record_id=NONE). Execution ' ~ execution.id ~ outputs.resolve.outputs[0].row.review_block) | toJson }}}
    else:
      - id: nothing_to_review
        type: io.kestra.plugin.core.log.Log
        message: No new records for review ({{ outputs.resolve.outputs[0].row.in_review }} still open in the queue).

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      {{ outputs.plan.outputs[0].row.records }} records{{ outputs.plan.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}, {{ outputs.plan.outputs[0].row.queries }} names reconciled, {{ outputs.plan.outputs[0].row.deferred }} deferred.
      Auto-linked {{ outputs.resolve.outputs[0].row.auto_linked }}, confirmed {{ outputs.resolve.outputs[0].row.confirmed }}, in review {{ outputs.resolve.outputs[0].row.in_review }}, no match {{ outputs.resolve.outputs[0].row.no_match }}, invalid/rejected/deferred {{ outputs.resolve.outputs[0].row.other }}.
      Duplicate clusters {{ outputs.resolve.outputs[0].row.duplicate_clusters }}: {{ outputs.resolve.outputs[0].row.duplicates }}

outputs:
  - id: golden_csv
    type: FILE
    value: "{{ outputs.resolve.outputFiles.golden_csv }}"
  - id: review_csv
    type: FILE
    value: "{{ outputs.resolve.outputFiles.review_csv }}"

extend:
  title: Resolve CRM Organisation Names to Wikidata QIDs with a Steward Review Queue
  metaTitle: Wikidata Organisation Name Entity Resolution with Review Queue | Kestra
  shortDescription: Batch-reconcile free-text organisation names against Wikidata, auto-link confident matches with LEI and website, flag duplicates and dissolved companies, and queue ambiguous names for a data steward.
  metaDescription: Reconcile CRM organisation names to Wikidata QIDs in one batch, auto-link confident matches, enrich with LEI, flag duplicates and queue ambiguous names.
  description: |
    CRM and vendor-master tables hold hand-typed organisation names: "Apple" and "Apple Inc." as two accounts, a supplier that went bankrupt years ago. This flow resolves each record to a Wikidata QID with the Wikidata reconciliation service (the OpenRefine reconciliation API), auto-links confident matches, queues the rest for a steward and keeps every decision in the KV store.

    ## How it works

    1. `on_crm_export` (Webhook) receives `records_csv` (and optionally `steward_decisions`) from your export job; `nightly_backlog` (Schedule) works through deferred records.
    2. `previous_state` (KV Get) loads the stored decision per `record_id`.
    3. `plan` (DuckDB) normalises names, keys them by `md5(name|country)` so duplicates cost one query, and assigns an action: QUERY (new, renamed or deferred), KEEP, CONFIRM / REJECT (steward answer) or INVALID. Names beyond `max_queries` are DEFERRED.
    4. `call_wikidata` (If) runs only when there is work. `reconcile` POSTs all queries in one request, filtered by `entity_type` and boosted by country via the `P17/P297` property path. `enrich` calls the data-extension endpoint once for the LEI (P1278), website (P856) and dissolution date (P576).
    5. `resolve` (DuckDB): AUTO_LINKED when the service flags `match` or the top score clears `auto_link_score` with `min_margin` over the runner-up; REVIEW when tied or dissolved; NO_MATCH below `min_score`. Linked records sharing a QID get `duplicate_of`.
    6. `save_state` (KV Set) stores the merged state, keeping records absent from a partial export.
    7. `review_queue` (If) logs and posts only the new review items to Slack; `summary` logs the counts.

    ## What you get

    - `golden_csv`: per record status, QID, label, score, margin, LEI(s), website, dissolution date and `duplicate_of`.
    - `review_csv`: the open queue with the reason (tied candidates, dissolved).
    - Requests only for new, renamed or deferred records.

    ## Who it's for

    - CRM, MDM and vendor-master data stewards deduplicating accounts.
    - Analytics engineers joining CRM data to LEI, sanctions or ESG datasets.

    ## Why orchestrate this with Kestra

    - KV state turns a one-off cleanup into an incremental job; webhook and schedule share one flow.
    - Retries with backoff absorb the service's slow cold starts; `allowFailure` keeps runs green without Slack.

    ## Prerequisites

    - Kestra 2.0 with the DuckDB and Slack plugins.
    - Outbound HTTPS to `wikidata-reconciliation.wmcloud.org` (no API key). It is a shared service, so keep `max_queries` modest.

    ### Secrets

    - `ORG_RESOLUTION_WEBHOOK_KEY`: key in the webhook URL your export job calls (required for the webhook trigger).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the review queue (optional).

    ## Quick start

    1. Execute with the defaults: 10 names for 12 records, 6 auto-linked (two duplicate pairs), 4 in review (Mercury and Lufthansa tied, Wirecard and Northern Rock dissolved), 1 no match, 1 invalid.
    2. Execute again: 0 names reconciled.
    3. Set `steward_decisions` to `ACC-1008=Q9325;ACC-1005=NONE`: Lufthansa is CONFIRMED, Northern Rock REJECTED.
    4. Replace `records_csv` with your export, add the secrets and point your export job at the webhook.

    ## How to extend

    - Write `golden_csv` back to the CRM, or upsert it into a warehouse table.
    - Re-check NO_MATCH records monthly, or extend with P452 (industry) and P159 (headquarters).

    ## Links

    - [Wikidata reconciliation service](https://wikidata-reconciliation.wmcloud.org/) and [Reconciliation API specification](https://reconciliation-api.github.io/specs/latest/)
    - [HTTP Request](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request) and [Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - Day 2 Operations
  ee: false
  demo: false
