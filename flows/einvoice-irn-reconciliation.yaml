id: einvoice-irn-reconciliation
namespace: company.team
description: |
  Reconcile your sales register with the e-invoices registered on the GST Invoice
  Registration Portal (IRP): B2B and export invoices with no IRN, the 30-day reporting
  limit for businesses with turnover of Rs 10 crore or more, values and buyer GSTINs that
  differ, and documents cancelled on the IRP but still active in your books.

inputs:
  - id: sales_register
    type: FILE
    required: false
    description: CSV of sales documents from your books with the columns doc_no, doc_type (INV, CRN or DBN), doc_date, supply_type (B2B, EXP or B2C), buyer_gstin, taxable_value, tax_amount and status (active or cancelled). Leave empty to use the built-in sample.
  - id: irp_export
    type: FILE
    required: false
    description: CSV of e-invoices from the IRP or your GSP with the columns irn, ack_date, doc_no, doc_type, doc_date, buyer_gstin, taxable_value, tax_amount and irn_status (ACT or CNL). Leave empty to use the built-in sample.
  - id: aato_crore
    type: FLOAT
    defaults: 12
    description: Your aggregate annual turnover in crore rupees. At 10 or more, documents must be reported to the IRP within 30 days of the document date.
  - id: warn_within_days
    type: INT
    defaults: 5
    description: Flag documents without an IRN whose 30-day window closes within this many days.
  - id: tolerance
    type: FLOAT
    defaults: 1
    description: Rupees of rounding difference to ignore when comparing values.
  - id: as_of
    type: STRING
    required: false
    description: Date to check on, as YYYY-MM-DD. Leave empty to use today.
  - id: notify_slack
    type: BOOL
    defaults: false
    description: Post the findings to Slack when something needs attention. Requires the SLACK_WEBHOOK_URL secret.

triggers:
  - id: daily_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every evening at 19:00 IST so missing IRNs are generated the same day. Shipped disabled; enable it once the flow reads your real sales register and IRP export.
    cron: "0 19 * * *"
    timezone: Asia/Kolkata
    disabled: true
  - id: on_sales_register_export
    type: io.kestra.plugin.core.trigger.Flow
    description: Event-based. Run as soon as the flow that exports your sales register succeeds, using the file it outputs. Shipped disabled; set the namespace, flow id and output name of your own export flow.
    disabled: true
    inputs:
      sales_register: "{{ trigger.outputs.sales_register_file }}"
    dependsOn:
      - namespace: company.team
        flowId: export-sales-register
        states: [SUCCESS]

tasks:
  - id: sample_sales_register
    type: io.kestra.plugin.core.storage.Write
    description: Twelve sales documents with one example of every case the reconciliation handles. GSTINs are synthetic and dates are relative to today. Only used when sales_register is empty.
    extension: .csv
    content: |
      doc_no,doc_type,doc_date,supply_type,buyer_gstin,taxable_value,tax_amount,status
      INV/26-27/0412,INV,{{ now() | dateAdd(-20, 'DAYS') | date('yyyy-MM-dd') }},B2B,29AABCK1234L1Z5,250000.00,45000.00,active
      INV/26-27/0413,INV,{{ now() | dateAdd(-18, 'DAYS') | date('yyyy-MM-dd') }},B2B,27AADCS5678M1ZQ,118000.00,21240.00,active
      INV/26-27/0414,INV,{{ now() | dateAdd(-27, 'DAYS') | date('yyyy-MM-dd') }},B2B,33AAFCT9012N1Z2,64000.00,11520.00,active
      INV/26-27/0415,INV,{{ now() | dateAdd(-34, 'DAYS') | date('yyyy-MM-dd') }},B2B,24AAHCV3456P1ZX,92000.00,16560.00,active
      INV/26-27/0416,INV,{{ now() | dateAdd(-6, 'DAYS') | date('yyyy-MM-dd') }},B2B,07AAJCD7890Q1Z8,45000.00,8100.00,active
      INV/26-27/0417,INV,{{ now() | dateAdd(-5, 'DAYS') | date('yyyy-MM-dd') }},B2C,,1800.00,324.00,active
      INV/26-27/0418,INV,{{ now() | dateAdd(-4, 'DAYS') | date('yyyy-MM-dd') }},EXP,,310000.00,0.00,active
      INV/26-27/0419,INV,{{ now() | dateAdd(-12, 'DAYS') | date('yyyy-MM-dd') }},B2B,29AABCK1234L1Z5,75000.00,13500.00,active
      INV/26-27/0420,INV,{{ now() | dateAdd(-3, 'DAYS') | date('yyyy-MM-dd') }},B2B,32AAKCM2468R1Z4,56000.00,10080.00,active
      CRN/26-27/0031,CRN,{{ now() | dateAdd(-9, 'DAYS') | date('yyyy-MM-dd') }},B2B,27AADCS5678M1ZQ,18000.00,3240.00,active
      INV/26-27/0421,INV,{{ now() | dateAdd(-2, 'DAYS') | date('yyyy-MM-dd') }},B2B,19ABCDE1234F,22000.00,3960.00,active
      INV/26-27/0422,INV,{{ now() | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd') }},B2B,09AALCP1357S1Z6,38000.00,6840.00,cancelled

  - id: sample_irp_export
    type: io.kestra.plugin.core.storage.Write
    description: The e-invoices registered on the IRP for the sample period. IRNs are synthetic. Only used when irp_export is empty.
    extension: .csv
    content: |
      irn,ack_date,doc_no,doc_type,doc_date,buyer_gstin,taxable_value,tax_amount,irn_status
      8c1f0e2a9b7d4c3e5f6a7b8c9d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f7a8b9c0,{{ now() | dateAdd(-20, 'DAYS') | date('yyyy-MM-dd') }},INV/26-27/0412,INV,{{ now() | dateAdd(-20, 'DAYS') | date('yyyy-MM-dd') }},29AABCK1234L1Z5,250000.00,45000.00,ACT
      1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e,{{ now() | dateAdd(-17, 'DAYS') | date('yyyy-MM-dd') }},INV/26-27/0413,INV,{{ now() | dateAdd(-18, 'DAYS') | date('yyyy-MM-dd') }},27AADCS5678M1ZQ,108000.00,19440.00,ACT
      2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f,{{ now() | dateAdd(-6, 'DAYS') | date('yyyy-MM-dd') }},INV/26-27/0416,INV,{{ now() | dateAdd(-6, 'DAYS') | date('yyyy-MM-dd') }},07AAJCD7890Q1Z8,45000.00,8100.00,ACT
      3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a,{{ now() | dateAdd(-4, 'DAYS') | date('yyyy-MM-dd') }},INV/26-27/0418,INV,{{ now() | dateAdd(-4, 'DAYS') | date('yyyy-MM-dd') }},URP,310000.00,0.00,ACT
      4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b,{{ now() | dateAdd(-11, 'DAYS') | date('yyyy-MM-dd') }},INV/26-27/0419,INV,{{ now() | dateAdd(-12, 'DAYS') | date('yyyy-MM-dd') }},29AABCK1234L1Z5,75000.00,13500.00,CNL
      5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c,{{ now() | dateAdd(-3, 'DAYS') | date('yyyy-MM-dd') }},INV/26-27/0420,INV,{{ now() | dateAdd(-3, 'DAYS') | date('yyyy-MM-dd') }},32AAKCM2468R1Z9,56000.00,10080.00,ACT
      6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d,{{ now() | dateAdd(-8, 'DAYS') | date('yyyy-MM-dd') }},CRN/26-27/0031,CRN,{{ now() | dateAdd(-9, 'DAYS') | date('yyyy-MM-dd') }},27AADCS5678M1ZQ,18000.00,3240.00,ACT
      7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e,{{ now() | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd') }},INV/26-27/0422,INV,{{ now() | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd') }},09AALCP1357S1Z6,38000.00,6840.00,ACT
      8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f,{{ now() | dateAdd(-15, 'DAYS') | date('yyyy-MM-dd') }},INV/26-27/0399,INV,{{ now() | dateAdd(-15, 'DAYS') | date('yyyy-MM-dd') }},29AABCK1234L1Z5,41000.00,7380.00,ACT

  - id: reconcile
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Match documents between the books and the IRP by document type and number and check the 30-day rule in DuckDB, without calling the IRP. The per-document report is exported to CSV and the last query returns the summary.
    inputFiles:
      books.csv: "{{ inputs.sales_register ?? outputs.sample_sales_register.uri }}"
      irp.csv: "{{ inputs.irp_export ?? outputs.sample_irp_export.uri }}"
    outputFiles:
      - einvoice_recon.csv
    fetchType: FETCH_ONE
    sql: |
      CREATE TABLE params AS
      SELECT
        coalesce(TRY_CAST(NULLIF(trim('{{ inputs.as_of ?? '' }}'), '') AS DATE), current_date) AS as_of,
        {{ inputs.aato_crore }} >= 10 AS thirty_day_rule,
        {{ inputs.warn_within_days }} AS warn_days,
        {{ inputs.tolerance }} AS tol;

      CREATE TABLE books AS
      SELECT
        upper(regexp_replace(trim(doc_no), '\s', '', 'g')) AS doc_no,
        upper(trim(doc_type)) AS doc_type,
        TRY_CAST(doc_date AS DATE) AS doc_date,
        upper(trim(supply_type)) AS supply_type,
        upper(trim(coalesce(buyer_gstin, ''))) AS buyer_gstin,
        TRY_CAST(taxable_value AS DECIMAL(15, 2)) AS taxable_value,
        TRY_CAST(tax_amount AS DECIMAL(15, 2)) AS tax_amount,
        lower(trim(coalesce(status, 'active'))) AS book_status
      FROM read_csv('{{ workingDir }}/books.csv', header = true, all_varchar = true);

      CREATE TABLE irp AS
      SELECT
        lower(trim(irn)) AS irn,
        TRY_CAST(ack_date AS DATE) AS ack_date,
        upper(regexp_replace(trim(doc_no), '\s', '', 'g')) AS doc_no,
        upper(trim(doc_type)) AS doc_type,
        TRY_CAST(doc_date AS DATE) AS irp_doc_date,
        upper(trim(coalesce(buyer_gstin, ''))) AS irp_gstin,
        TRY_CAST(taxable_value AS DECIMAL(15, 2)) AS irp_taxable,
        TRY_CAST(tax_amount AS DECIMAL(15, 2)) AS irp_tax,
        upper(trim(irn_status)) AS irn_status
      FROM read_csv('{{ workingDir }}/irp.csv', header = true, all_varchar = true);

      CREATE TABLE joined AS
      SELECT
        coalesce(b.doc_no, i.doc_no) AS doc_no,
        coalesce(b.doc_type, i.doc_type) AS doc_type,
        coalesce(b.doc_date, i.irp_doc_date) AS doc_date,
        b.supply_type,
        b.buyer_gstin,
        i.irp_gstin,
        b.taxable_value,
        i.irp_taxable,
        b.tax_amount,
        i.irp_tax,
        b.book_status,
        i.irn,
        i.ack_date,
        i.irn_status,
        b.doc_no IS NOT NULL AS in_books,
        i.doc_no IS NOT NULL AS on_irp,
        p.as_of,
        p.thirty_day_rule,
        p.warn_days,
        p.tol
      FROM books AS b
      FULL OUTER JOIN irp AS i ON b.doc_no = i.doc_no AND b.doc_type = i.doc_type
      CROSS JOIN params AS p;

      CREATE TABLE report AS
      SELECT
        doc_no,
        doc_type,
        doc_date,
        supply_type,
        buyer_gstin,
        taxable_value,
        irp_taxable,
        irn,
        irn_status,
        CASE WHEN thirty_day_rule AND supply_type IN ('B2B', 'EXP') THEN doc_date + 30 END AS irn_deadline,
        CASE
          WHEN NOT in_books THEN 'NOT_IN_BOOKS'
          WHEN book_status = 'cancelled' AND irn_status = 'ACT' THEN 'CANCEL_ON_IRP'
          WHEN book_status = 'cancelled' THEN 'OK'
          WHEN supply_type = 'B2C' AND on_irp THEN 'NOT_NEEDED'
          WHEN supply_type = 'B2C' THEN 'OK'
          WHEN NOT on_irp AND thirty_day_rule AND as_of - doc_date > 30 THEN 'IRN_WINDOW_CLOSED'
          WHEN NOT on_irp AND thirty_day_rule AND doc_date + 30 - as_of <= warn_days THEN 'IRN_DUE_SOON'
          WHEN NOT on_irp THEN 'IRN_MISSING'
          WHEN irn_status = 'CNL' THEN 'CANCELLED_ON_IRP'
          WHEN abs(taxable_value - irp_taxable) > tol OR abs(tax_amount - irp_tax) > tol
            OR (supply_type = 'B2B' AND buyer_gstin <> irp_gstin) THEN 'MISMATCH'
          WHEN supply_type = 'B2B' AND NOT regexp_full_match(buyer_gstin, '[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]') THEN 'CHECK_GSTIN'
          ELSE 'OK'
        END AS status,
        concat_ws(' | ',
          CASE WHEN NOT in_books THEN 'e-invoice registered on the IRP but not in your sales register' END,
          CASE WHEN in_books AND NOT on_irp AND supply_type IN ('B2B', 'EXP') AND book_status = 'active' THEN 'no IRN for a ' || supply_type || ' document' END,
          CASE WHEN in_books AND NOT on_irp AND thirty_day_rule AND as_of - doc_date > 30 AND supply_type IN ('B2B', 'EXP') AND book_status = 'active' THEN 'more than 30 days old: the IRP will no longer accept it, so it is not a valid tax invoice' END,
          CASE WHEN book_status = 'cancelled' AND irn_status = 'ACT' THEN 'cancelled in your books but still active on the IRP' END,
          CASE WHEN irn_status = 'CNL' AND book_status = 'active' THEN 'cancelled on the IRP but active in your books: issue a new invoice or correct the books' END,
          CASE WHEN supply_type = 'B2C' AND on_irp THEN 'B2C invoices do not need an IRN' END,
          CASE WHEN in_books AND on_irp AND abs(taxable_value - irp_taxable) > tol THEN 'taxable value Rs ' || taxable_value || ' in books vs Rs ' || irp_taxable || ' on the IRP' END,
          CASE WHEN in_books AND on_irp AND abs(tax_amount - irp_tax) > tol THEN 'tax Rs ' || tax_amount || ' in books vs Rs ' || irp_tax || ' on the IRP' END,
          CASE WHEN in_books AND on_irp AND supply_type = 'B2B' AND buyer_gstin <> irp_gstin THEN 'buyer GSTIN ' || buyer_gstin || ' in books vs ' || irp_gstin || ' on the IRP' END,
          CASE WHEN supply_type = 'B2B' AND in_books AND NOT regexp_full_match(coalesce(buyer_gstin, ''), '[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]') THEN 'buyer GSTIN is missing or malformed' END,
          CASE WHEN on_irp AND NOT regexp_full_match(coalesce(irn, ''), '[0-9a-f]{64}') THEN 'IRN is not a 64-character hash' END
        ) AS notes
      FROM joined;

      COPY (
        SELECT *
        FROM report
        ORDER BY CASE status
          WHEN 'IRN_WINDOW_CLOSED' THEN 1 WHEN 'IRN_DUE_SOON' THEN 2 WHEN 'IRN_MISSING' THEN 3 WHEN 'CANCEL_ON_IRP' THEN 4
          WHEN 'CANCELLED_ON_IRP' THEN 5 WHEN 'MISMATCH' THEN 6 WHEN 'NOT_IN_BOOKS' THEN 7 WHEN 'CHECK_GSTIN' THEN 8
          WHEN 'NOT_NEEDED' THEN 9 ELSE 10 END, doc_date
      ) TO '{{ outputFiles["einvoice_recon.csv"] }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT as_of FROM params)::VARCHAR AS as_of,
        (SELECT thirty_day_rule FROM params) AS thirty_day_rule,
        count(*) AS documents,
        count(*) FILTER (WHERE status = 'OK') AS ok_count,
        count(*) FILTER (WHERE status IN ('IRN_WINDOW_CLOSED', 'IRN_DUE_SOON', 'IRN_MISSING')) AS missing_irn_count,
        coalesce(sum(taxable_value + 0) FILTER (WHERE status IN ('IRN_WINDOW_CLOSED', 'IRN_DUE_SOON', 'IRN_MISSING')), 0) AS missing_irn_value,
        count(*) FILTER (WHERE status = 'IRN_WINDOW_CLOSED') AS window_closed_count,
        count(*) FILTER (WHERE status NOT IN ('OK', 'NOT_NEEDED')) AS attention_count,
        coalesce(string_agg(doc_no || ' ' || status || ': ' || notes, ' || ' ORDER BY doc_date) FILTER (WHERE status NOT IN ('OK', 'NOT_NEEDED')), '') AS attention_details
      FROM report;

  - id: route_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch on the result. Missing IRNs, closed windows, cancellations and mismatches are logged with the document numbers, and optionally sent to Slack; a clean run is logged as well.
    condition: "{{ outputs.reconcile.outputs[0].row.attention_count > 0 }}"
    then:
      - id: log_findings
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          E-invoice reconciliation (as of {{ outputs.reconcile.outputs[0].row.as_of }}, 30-day rule {{ outputs.reconcile.outputs[0].row.thirty_day_rule ? 'applies' : 'does not apply' }}): {{ outputs.reconcile.outputs[0].row.attention_count }} of {{ outputs.reconcile.outputs[0].row.documents }} documents need attention.
          Without an IRN: {{ outputs.reconcile.outputs[0].row.missing_irn_count }} documents, Rs {{ outputs.reconcile.outputs[0].row.missing_irn_value }} taxable ({{ outputs.reconcile.outputs[0].row.window_closed_count }} past the 30-day window).
          {{ outputs.reconcile.outputs[0].row.attention_details }}
      - id: slack_enabled
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: notify_slack
            type: io.kestra.plugin.slack.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: "E-invoice check: {{ outputs.reconcile.outputs[0].row.attention_count }} documents need attention, {{ outputs.reconcile.outputs[0].row.missing_irn_count }} without an IRN ({{ outputs.reconcile.outputs[0].row.window_closed_count }} past the 30-day window). {{ outputs.reconcile.outputs[0].row.attention_details }}"
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        message: "E-invoices reconciled: all {{ outputs.reconcile.outputs[0].row.documents }} documents match the IRP."

errors:
  - id: log_recon_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    description: Make a failed reconciliation loud, so a run that checked nothing is never mistaken for a clean one.
    message: "E-invoice reconciliation FAILED in {{ flow.namespace }}.{{ flow.id }} (execution {{ execution.id }}). Nothing was reconciled. Check the columns of sales_register and irp_export."

outputs:
  - id: einvoice_recon
    type: FILE
    description: Per-document CSV with the IRN, IRN status, 30-day deadline, values on both sides, status (IRN_WINDOW_CLOSED, IRN_DUE_SOON, IRN_MISSING, CANCEL_ON_IRP, CANCELLED_ON_IRP, MISMATCH, NOT_IN_BOOKS, CHECK_GSTIN, NOT_NEEDED or OK) and notes, most urgent first.
    value: "{{ outputs.reconcile.outputFiles['einvoice_recon.csv'] }}"
  - id: recon_summary
    type: JSON
    description: 'Counts, values and details, e.g. {"documents": 13, "missing_irn_count": 3, "window_closed_count": 1, ...}.'
    value: "{{ outputs.reconcile.outputs[0].row | toJson }}"

extend:
  title: Reconcile Sales Invoices With GST E-Invoices (IRN) and the 30-Day Rule
  shortDescription: Daily check of B2B and export invoices against the IRP, catching missing IRNs, the 30-day reporting limit, value and GSTIN mismatches and cancellations on one side only.
  metaTitle: GST E-Invoice (IRN) Reconciliation and 30-Day Rule Check with Kestra
  metaDescription: 'Compare your sales register with e-invoices on the IRP: missing IRNs, the 30-day limit, value and GSTIN mismatches and one-sided cancellations.'
  description: |
    In India, every business with aggregate turnover above Rs 5 crore must register its B2B and export invoices, credit notes and debit notes on the Invoice Registration Portal (IRP) and get an IRN. An invoice that should have an IRN but does not is not a valid tax invoice, and the buyer cannot claim input tax credit on it. Since 1 April 2025, businesses with turnover of Rs 10 crore or more must report each document within 30 days of its date, after which the IRP rejects it. Gaps creep in when billing and e-invoicing are separate steps: an invoice that was never pushed, a value edited in the books after the IRN was generated, a cancellation done on one side only. This blueprint compares the sales register with the IRP export every evening and lists what to fix before the 30-day window closes. Everything runs locally in DuckDB: no IRP or GSP credentials and no customer data leaving your Kestra instance.

    ## How it works

    1. `sample_sales_register` and `sample_irp_export` (`io.kestra.plugin.core.storage.Write`) write twelve sales documents and nine IRP records with one example of every case. Dates are relative to today. They are used only when the matching input is empty.
    2. `reconcile` (`io.kestra.plugin.jdbc.duckdb.Queries`) matches documents by type and number (spaces removed, case ignored) with a full outer join and gives each one a status:
       - `IRN_WINDOW_CLOSED`, `IRN_DUE_SOON`, `IRN_MISSING`: a B2B or export document with no IRN; with `aato_crore` of 10 or more, past or close to the 30-day limit.
       - `CANCEL_ON_IRP`: cancelled in the books but still active on the IRP.
       - `CANCELLED_ON_IRP`: cancelled on the IRP but still active in the books.
       - `MISMATCH`: taxable value, tax or buyer GSTIN differs between the books and the IRP.
       - `NOT_IN_BOOKS`: an e-invoice on the IRP with no matching document in the books.
       - `CHECK_GSTIN`: a B2B buyer GSTIN that is missing or malformed.
       - `NOT_NEEDED`: an IRN generated for a B2C invoice, which does not need one.
    3. `route_findings` (`io.kestra.plugin.core.flow.If`) logs every document that needs attention with the reason, and a nested `If` posts a summary to Slack when `notify_slack` is `true`. A clean run is logged as well.
    4. The `errors` block logs a failed reconciliation loudly, so a run that checked nothing is never mistaken for a clean one.
    5. The `daily_check` `Schedule` trigger (19:00 IST, shipped disabled) runs it every evening so missing IRNs are generated the same day.
    6. The `on_sales_register_export` `Flow` trigger (shipped disabled) is the event-based option: it starts the check as soon as the flow that exports your sales register (`export-sales-register` in `company.team`) succeeds, and passes its `sales_register_file` output in as `sales_register`.

    ## What you get

    - `outputs.einvoice_recon`: CSV with `doc_no`, `doc_type`, `doc_date`, `supply_type`, `buyer_gstin`, `taxable_value`, `irp_taxable`, `irn`, `irn_status`, `irn_deadline`, `status` and `notes`, most urgent first.
    - `outputs.recon_summary`: JSON with `documents`, `ok_count`, `missing_irn_count`, `missing_irn_value`, `window_closed_count`, `attention_count` and `attention_details`.
    - With the sample data: an invoice 34 days old with no IRN (window closed), one 27 days old (due soon), a value edited in the books after the IRN, a document cancelled on the IRP but active in the books, one cancelled in the books but active on the IRP, a buyer GSTIN that differs by one character, a malformed buyer GSTIN, an e-invoice not in the books, an export invoice correctly matched, a credit note matched, and a B2C invoice that needs no IRN.

    ## Who it's for

    - Finance and GST teams of businesses with turnover above Rs 5 crore, and especially Rs 10 crore or more under the 30-day rule.
    - CA firms and GST practitioners reviewing e-invoicing compliance for clients.
    - Businesses that bill from one system and generate IRNs from another (ERP and GSP, or billing software and the IRP portal).

    ## Why orchestrate this with Kestra

    The 30-day rule turns a monthly GST review into a daily job. Kestra runs the reconciliation every evening on the latest exports, keeps each day's report in the execution history as evidence for audits and notices, branches on the result, and alerts the team that can generate the missing IRNs. The inputs are plain files, so the same flow can read the sales register from your ERP database and the IRP data from your GSP's export, S3 or SFTP.

    ## Prerequisites

    - Nothing for the demo: the sample documents are built in.
    - For your own data: a sales register export and an e-invoice export from the IRP or your GSP, with the columns below.

    ### Inputs

    - `sales_register` (FILE, optional): `doc_no`, `doc_type` (`INV`, `CRN` or `DBN`), `doc_date`, `supply_type` (`B2B`, `EXP` or `B2C`), `buyer_gstin`, `taxable_value`, `tax_amount` and `status` (`active` or `cancelled`).
    - `irp_export` (FILE, optional): `irn`, `ack_date`, `doc_no`, `doc_type`, `doc_date`, `buyer_gstin`, `taxable_value`, `tax_amount` and `irn_status` (`ACT` or `CNL`).
    - `aato_crore` (FLOAT, default `12`): your aggregate annual turnover in crore; the 30-day rule applies from 10.
    - `warn_within_days` (INT, default `5`): how early to flag a closing window.
    - `tolerance` (FLOAT, default `1`): rupees of rounding to ignore.
    - `as_of` (STRING, optional): date to check on, `YYYY-MM-DD`; defaults to today.
    - `notify_slack` (BOOL, default `false`): post a summary to Slack when something needs attention.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL. Only needed when `notify_slack` is `true`.

    ## Quick start

    1. Save the flow and run it with the default inputs.
    2. Open the logs of `log_findings` and download `einvoice_recon` from the Outputs tab.
    3. Set `aato_crore` to your turnover and run it with your own exports.
    4. Optional: add the `SLACK_WEBHOOK_URL` secret and set `notify_slack` to `true`.
    5. Point the inputs at your real sources and set `disabled: false` on `daily_check`.

    ## Common pitfalls

    - Document numbers must match exactly between the books and the IRP. The check ignores spaces and case, but not prefixes or leading zeros.
    - An IRN can be cancelled on the IRP only within 24 hours of generation. After that, issue a credit note instead and record it on both sides.
    - The GSTIN check validates the format, not that the GSTIN is active. Verify new buyers on the GST portal.
    - Turnover thresholds and time limits are notified by the GST Council and CBIC and can change. Check the current notifications.

    ## How to extend

    - Pull the e-invoices from your GSP's API with an `HTTP` request instead of a file.
    - Generate IRNs for the `IRN_DUE_SOON` documents automatically through your GSP.
    - Compare the IRP data with the GSTR-1 auto-populated from it before filing.
    - Open a task for the billing team for each document that needs attention with a `ForEach`.

