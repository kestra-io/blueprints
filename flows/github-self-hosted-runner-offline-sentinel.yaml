id: github-self-hosted-runner-offline-sentinel
namespace: company.devops

description: |
  Audits GitHub organization self-hosted runner fleets via GitHub API,
  identifies offline or unresponsive CI/CD compute nodes, files an automated
  infrastructure ticket, and alerts the platform engineering team on Slack.

inputs:
  - id: github_organization
    type: STRING
    displayName: GitHub Organization
    defaults: my-enterprise-org

  - id: target_repository
    type: STRING
    displayName: Infrastructure Issue Tracking Repository
    defaults: my-enterprise-org/platform-engineering

triggers:
  - id: check_runner_health_hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

tasks:
  - id: probe_offline_runners
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates GitHub API for all registered organization self-hosted runners in offline status
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    script: |
      import os
      import requests
      from kestra import Kestra

      org = "{{ inputs.github_organization }}"
      token = os.environ.get("GITHUB_TOKEN")

      headers = {
          "Authorization": f"Bearer {token}",
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28"
      }

      url = f"https://api.github.com/orgs/{org}/actions/runners"
      response = requests.get(url, headers=headers, timeout=30)
      if response.status_code != 200:
          print(f"GitHub API returned error {response.status_code}: {response.text}")
          response.raise_for_status()

      data = response.json()
      runners = data.get("runners", [])
      
      offline_runners = [
          {
              "id": r.get("id"),
              "name": r.get("name"),
              "os": r.get("os"),
              "status": r.get("status"),
              "busy": r.get("busy")
          }
          for r in runners if r.get("status") == "offline"
      ]

      offline_count = len(offline_runners)
      print(f"Total runners: {len(runners)}, Offline runners: {offline_count}")

      Kestra.outputs({
          "total_runners": len(runners),
          "offline_count": offline_count,
          "has_offline": offline_count > 0,
          "offline_runners": offline_runners
      })

  - id: branch_on_offline_runners
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether any self-hosted runners are offline
    condition: "{{ outputs.probe_offline_runners.vars.has_offline == true }}"
    then:
      - id: create_runner_incident_issue
        type: io.kestra.plugin.github.issues.Create
        description: Logs a prioritized GitHub issue tracking offline CI/CD runner nodes
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.target_repository }}"
        title: "[CI/CD Alert] Offline Self-Hosted Runners Detected ({{ outputs.probe_offline_runners.vars.offline_count }} Nodes Unresponsive)"
        body: |
          ## 🚨 GitHub Self-Hosted Runner Fleet Degradation

          The automated CI/CD fleet sentinel detected **{{ outputs.probe_offline_runners.vars.offline_count }}** offline runners in organization `{{ inputs.github_organization }}`.

          ### Offline Nodes:
          {% for r in outputs.probe_offline_runners.vars.offline_runners %}
          - **ID:** `{{ r.id }}` - **Name:** `{{ r.name }}` (OS: `{{ r.os }}`)
          {% endfor %}

          Please verify AWS EC2 / Kubernetes runner daemon states and system logs.
          *Generated automatically by Kestra CI/CD Fleet Sentinel.*

      - id: alert_devops_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts platform engineering on Slack with offline node count and issue hyperlink
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🚨 *GitHub Self-Hosted Runners Offline Alert*\n*Organization:* `" ~ inputs.github_organization ~ "`\n*Offline Count:* *" ~ outputs.probe_offline_runners.vars.offline_count ~ "* of " ~ outputs.probe_offline_runners.vars.total_runners ~ "\n*Triage Ticket:* <" ~ (outputs.create_runner_incident_issue.issueUrl ?? "#") ~ "|View GitHub Issue>"
          } | toJson }}

    else:
      - id: log_fleet_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.probe_offline_runners.vars.total_runners }} self-hosted runners in {{ inputs.github_organization }} are online and healthy."

  - id: log_fleet_summary
    type: io.kestra.plugin.core.log.Log
    description: Final audit status log recording runner fleet availability
    message: "Runner fleet audit completed for {{ inputs.github_organization }}. Offline nodes: {{ outputs.probe_offline_runners.vars.offline_count }}."

errors:
  - id: alert_probe_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when the runner probe script encounters an unexpected failure
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *GitHub Runner Sentinel Failed* in execution `" ~ execution.id ~ "`. Unable to query GitHub Actions API for organization `" ~ inputs.github_organization ~ "`."
      } | toJson }}

extend:
  title: "GitHub Self-Hosted Runner Fleet Offline Sentinel"
  shortDescription: "Audit GitHub Actions self-hosted runners hourly, detect offline nodes, file GitHub infrastructure tickets, and alert Slack."
  metaTitle: "GitHub Self-Hosted Runner Offline Sentinel with Kestra"
  metaDescription: "Monitor GitHub self-hosted runner health with Kestra. Automatically detect offline CI/CD nodes, create GitHub issues, and alert DevOps on Slack."
  description: |
    Enterprise software engineering teams rely on self-hosted GitHub Actions runners hosted across private AWS EC2 instances, GCP VMs, or Kubernetes clusters. When runner processes crash, disk volumes fill up, or host machines lose network reachability, jobs queue indefinitely and block continuous delivery pipelines. This blueprint queries GitHub's Actions API hourly for organization self-hosted runners, detects nodes in an `offline` status, files a prioritized GitHub tracking issue with full node metadata, and alerts on-call DevOps engineers via Slack.

    ## How it works

    1. `check_runner_health_hourly` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every hour (shipped disabled for safe verification).
    2. `probe_offline_runners` (`io.kestra.plugin.scripts.python.Script`) interrogates the GitHub Actions REST API (`GET /orgs/{org}/actions/runners`) and extracts nodes with `status == 'offline'`.
    3. `branch_on_offline_runners` (`io.kestra.plugin.core.flow.If`) evaluates whether any nodes are offline (`has_offline == true`):
       - `then`: Automatically files a GitHub tracking issue via `create_runner_incident_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the DevOps Slack channel via `alert_devops_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_fleet_healthy`) confirming full fleet availability.
    4. `log_fleet_summary` (`io.kestra.plugin.core.log.Log`) logs the final node counts.
    5. The `errors` block alerts Slack if API tokens expire or GitHub API limits are reached.

    ## What you get

    - Automated, scheduled auditing of self-hosted CI/CD infrastructure.
    - Rapid detection of silent runner process crashes before developers report blocked PR builds.
    - Consolidated GitHub incident tickets with node names, operating systems, and runner IDs.
    - Immediate Slack notifications with direct ticket hyperlinks.

    ## Who it's for

    - Platform Engineers and DevOps teams maintaining private CI/CD infrastructure.
    - Site Reliability Engineers safeguarding developer productivity and deployment throughput.
    - Engineering Managers monitoring continuous integration stability.

    ## Why orchestrate this with Kestra

    Kestra coordinates external API inspection, data filtering, conditional escalation, and chat notifications inside a unified, declarative pipeline. It injects personal access tokens securely, handles transient API failures, and maintains full execution logs without maintaining custom cron scripts or serverless bots.

    ## Prerequisites

    - A GitHub Organization with self-hosted runners configured under Organization Settings.
    - A GitHub Personal Access Token or GitHub App token with `admin:org` (read runners) and `repo` permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `GITHUB_TOKEN`: Token used to query GitHub Actions runner APIs and open tracking issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for platform alerts.

    ## Inputs

    - `github_organization` (STRING, default `my-enterprise-org`): Name of the GitHub organization hosting the self-hosted runner pool.
    - `target_repository` (STRING, default `my-enterprise-org/platform-engineering`): Target GitHub repository for logging runner downtime issues.

    ## Outputs

    - `outputs.probe_offline_runners.vars.total_runners`: Total number of registered runners in the organization.
    - `outputs.probe_offline_runners.vars.offline_count`: Count of runners currently in offline state.
    - `outputs.probe_offline_runners.vars.offline_runners`: List of offline runner objects (`id`, `name`, `os`, `status`, `busy`).

    ## Quick start

    1. Configure the `GITHUB_TOKEN` and `SLACK_WEBHOOK` secrets in your Kestra namespace.
    2. Import this flow and set `github_organization` and `target_repository` to match your organization.
    3. Run the flow manually to verify runner status querying and Slack notification delivery.
    4. Enable the `check_runner_health_hourly` trigger for continuous fleet health monitoring.

    ## How to extend

    - Add an automated AWS Auto Scaling or Kubernetes pod restart task to automatically remediate downed nodes.
    - Route critical alerts to PagerDuty or Opsgenie if more than 50% of the fleet drops offline.
    - Filter runners by labels (e.g., `production-gpu`) to prioritize mission-critical build infrastructure.

    ## Links

    - [GitHub Actions Runners API Documentation](https://docs.github.com/en/rest/actions/self-hosted-runners)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Infrastructure
    - Core
  subTags:
    - CI/CD & Automation
    - Monitoring & Alerting
  ee: false
  demo: false
