id: victoriametrics-active-timeseries-churn-sentinel
namespace: company.observability

inputs:
  - id: vm_select_url
    type: STRING
    defaults: "http://victoriametrics.internal:8428"
    description: Base URL of the VictoriaMetrics single-node or vmselect service.
  - id: max_churn_rate_per_hour
    type: INT
    defaults: 50000
    description: "Maximum allowable newly created time series per hour before alerting (default 50,000)."

tasks:
  - id: inspect_tsdb_status
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query VictoriaMetrics TSDB status endpoint for high-churn metric series
        curl -s "{{ inputs.vm_select_url }}/api/v1/status/tsdb" > /tmp/vm_tsdb.json

        python3 -c "
        import json
        try:
            with open('/tmp/vm_tsdb.json') as f:
                data = json.load(f)
            status = data.get('status', '')
            res = data.get('data', {})
            series_count = res.get('totalSeries', 0)
            top_churn = res.get('seriesCountByMetricName', [])
            sample = top_churn[0].get('name', 'none') if top_churn else 'none'
            is_breach = 1 if series_count > {{ inputs.max_churn_rate_per_hour }} else 0
            print(f'{is_breach}|{series_count}|{sample}')
        except Exception:
            print('0|0|none')
        " > /tmp/vm_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/vm_summary.txt)
        TOTAL_SERIES=$(cut -d '|' -f 2 /tmp/vm_summary.txt)
        TOP_METRIC=$(cut -d '|' -f 3 /tmp/vm_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=total_series::$TOTAL_SERIES::"
        echo "::set-output name=top_metric::$TOP_METRIC::"

  - id: evaluate_cardinality_churn
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_tsdb_status.vars.is_breach | int == 1 }}"
    then:
      - id: notify_observability_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#observability-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 VictoriaMetrics High Cardinality Churn Alert",
                "text": "VictoriaMetrics instance at {{ inputs.vm_select_url }} has recorded {{ outputs.inspect_tsdb_status.vars.total_series }} active series (threshold {{ inputs.max_churn_rate_per_hour }}). Top High-Churn Metric: `{{ outputs.inspect_tsdb_status.vars.top_metric }}`. Index memory bloat and query slowdown risk.",
                "footer": "Kestra Observability Sentinel • VictoriaMetrics"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#observability-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ VictoriaMetrics Sentinel Failure",
            "text": "Failed to query TSDB status on VictoriaMetrics at {{ inputs.vm_select_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  metaDescription: "Audits VictoriaMetrics TSDB status to detect time-series churn and tag cardinality explosion."
  metaTitle: VictoriaMetrics High Cardinality Time Series Churn Sentinel with Kestra
  ee: false
  demo: false
  title: VictoriaMetrics High Cardinality Time Series Churn Sentinel
  shortDescription: Audits VictoriaMetrics TSDB status to detect time-series churn and tag cardinality explosion.
  description: |
    ## How it works
    This workflow connects to the VictoriaMetrics Prometheus-compatible TSDB status endpoint (`/api/v1/status/tsdb`) to audit time series cardinality and index churn. In modern Kubernetes and microservice observability stacks, misconfigured Prometheus exporters or ad-hoc application metrics that embed user IDs or UUIDs into metric labels cause massive time-series churn. When active series counts surge, VictoriaMetrics indexdb memory consumption explodes, increasing disk I/O and slowing down dashboard queries. This sentinel identifies high-churn metric names and alerts observability engineers before storage bounds are violated.

    ## What you get
    - Real-time visibility into VictoriaMetrics active series and label cardinality.
    - Identification of culprit metric names responsible for cardinality explosion.
    - Actionable Slack notifications detailing total series and top churning metrics.

    ## Who it's for
    - Observability and Monitoring Engineers running VictoriaMetrics and Prometheus.
    - SREs safeguarding Grafana dashboard responsiveness and metrics query SLAs.
    - Platform Infrastructure teams operating centralized telemetry backends.

    ## Why orchestrate this with Kestra
    - **Automated Metric Surveillance**: Periodically inspects internal TSDB indices without deploying extra monitoring agents.
    - **Native API Capabilities**: Interacts directly with standard HTTP endpoints from ephemeral runners.
    - **Incident Orchestration**: Notifies platform engineers directly in team collaboration channels.

    ## Prerequisites
    - VictoriaMetrics single-node or vmselect service accessible over port `8428`.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK` secret to your namespace.
    3. Specify `vm_select_url` and `max_churn_rate_per_hour`.
    4. Enable the schedule trigger for continuous TSDB surveillance.

    ## How to extend
    - Inspect label value cardinality via `/api/v1/status/tsdb?topN=20`.
    - Trigger an automated metric drop relabeling rule via vmagent.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [VictoriaMetrics TSDB Status Documentation](https://docs.victoriametrics.com/#tsdb-stats)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
