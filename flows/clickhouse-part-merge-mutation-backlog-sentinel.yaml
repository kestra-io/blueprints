id: clickhouse-part-merge-mutation-backlog-sentinel
namespace: company.dataops

inputs:
  - id: clickhouse_host
    type: STRING
    displayName: ClickHouse Hostname
    required: true
    defaults: "clickhouse-cluster.internal.net"
    description: "Host address of the ClickHouse database cluster."

  - id: clickhouse_port
    type: INT
    displayName: Native Port
    required: true
    defaults: 9000
    description: "ClickHouse native connection port (default 9000 or 9440 for TLS)."

  - id: database_name
    type: STRING
    displayName: Database Name
    required: true
    defaults: "analytics"
    description: "Target database to evaluate for part merge bottlenecks and pending mutations."

  - id: unmerged_parts_threshold
    type: INT
    displayName: Unmerged Parts Threshold
    required: true
    defaults: 250
    description: "Maximum active parts per partition before flagging severe merge stagnation."

tasks:
  - id: log_sentinel_commencement
    type: io.kestra.plugin.core.log.Log
    message: "🔍 Evaluating ClickHouse part merges & mutation queues for database '{{ inputs.database_name }}' on {{ inputs.clickhouse_host }}"

  - id: query_merge_and_mutation_metrics
    type: io.kestra.plugin.jdbc.clickhouse.Query
    description: "Query system.parts and system.mutations tables to calculate unmerged parts and stalled alter mutations"
    url: "jdbc:clickhouse://{{ inputs.clickhouse_host }}:{{ inputs.clickhouse_port }}/{{ inputs.database_name }}"
    username: "{{ secret('CLICKHOUSE_USERNAME') }}"
    password: "{{ secret('CLICKHOUSE_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT
          countIf(active = 1) AS total_active_parts,
          max(parts_per_partition) AS max_parts_in_single_partition,
          (
              SELECT count()
              FROM system.mutations
              WHERE is_done = 0 AND database = '{{ inputs.database_name }}'
          ) AS pending_mutations_count
      FROM (
          SELECT
              table,
              partition,
              active,
              count() OVER (PARTITION BY table, partition) AS parts_per_partition
          FROM system.parts
          WHERE database = '{{ inputs.database_name }}' AND active = 1
      )
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: check_merge_saturation
    type: io.kestra.plugin.core.flow.If
    description: "Evaluate if unmerged parts or mutation backlogs exceed operational thresholds"
    condition: "{{ (outputs.query_merge_and_mutation_metrics.row.max_parts_in_single_partition >= inputs.unmerged_parts_threshold) or (outputs.query_merge_and_mutation_metrics.row.pending_mutations_count >= 10) }}"
    then:
      - id: alert_merge_tree_degradation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Post critical database alert with mitigation runbook actions"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚨 ClickHouse MergeTree Stagnation Detected",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Database:* `{{ inputs.database_name }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Host:* `{{ inputs.clickhouse_host }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Max Parts in Partition:* `{{ outputs.query_merge_and_mutation_metrics.row.max_parts_in_single_partition }}` (Limit: {{ inputs.unmerged_parts_threshold }})"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Pending Mutations:* `{{ outputs.query_merge_and_mutation_metrics.row.pending_mutations_count }}`"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "⚠️ *Risk:* 'Too many parts in all data parts in table' exception is imminent. High parts degrade query latency and risk blocking real-time inserts. Review background pool settings and run `OPTIMIZE TABLE ... FINAL` if necessary."
                }
              }
            ]
          }

    else:
      - id: log_cluster_healthy
        type: io.kestra.plugin.core.log.Log
        description: "Log healthy part merge telemetry"
        message: "✅ ClickHouse MergeTree state is healthy. Active parts: {{ outputs.query_merge_and_mutation_metrics.row.total_active_parts }}, Max parts in partition: {{ outputs.query_merge_and_mutation_metrics.row.max_parts_in_single_partition }}, Pending mutations: {{ outputs.query_merge_and_mutation_metrics.row.pending_mutations_count }}."

errors:
  - id: alert_sentinel_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Emergency notification if ClickHouse sentinel monitoring fails"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *ClickHouse Sentinel Failure:* Execution `{{ execution.id }}` failed to connect to `{{ inputs.clickhouse_host }}`."
      }

triggers:
  - id: hourly_health_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: ClickHouse MergeTree Part Merge and Mutation Backlog Sentinel
  metaTitle: ClickHouse Part Merge & Mutation Backlog Sentinel with Slack Alerts | Kestra
  shortDescription: Monitor ClickHouse MergeTree part saturation and pending mutations to prevent insert-blocking bottlenecks with Slack alerts.
  metaDescription: Audit ClickHouse system.parts and system.mutations tables for unmerged part spikes and alert Slack before insert queries are throttled.
  description: |
    ClickHouse is designed for ultra-fast real-time ingestion, but micro-batch inserts and unoptimized mutations create fragmented data parts faster than background merges can consolidate them. When active parts exceed thresholds, ClickHouse rejects writes with `TOO_MANY_PARTS` exceptions. This blueprint runs automated health audits across `system.parts` and `system.mutations`, detects partition fragmentation, and alerts data engineering teams via Slack before queries degrade or ingestion halts.

    ## How it works

    1. **Connection Inputs**: Accepts the ClickHouse cluster endpoint, database name, and unmerged parts threshold (default 250 parts).
    2. **Telemetry Inspection**: The `query_merge_and_mutation_metrics` task (`io.kestra.plugin.jdbc.clickhouse.Query`) executes an analytical query against `system.parts` and `system.mutations` with retries to compute total active parts, max parts per partition, and uncompleted mutations.
    3. **Saturation Gate**: The `check_merge_saturation` task (`io.kestra.plugin.core.flow.If`) evaluates whether partition saturation or mutation backlogs violate defined limits.
    4. **Slack Alert Dispatch**: If fragmentation is high, `alert_merge_tree_degradation` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) immediately broadcasts a detailed diagnosis card with actionable remediation advice.
    5. **Pipeline Resilience**: An `errors` handler guarantees dead-letter notifications if JDBC connections time out.

    ## What you get

    - Proactive detection of ClickHouse write-throttling bottlenecks.
    - Zero glue-code SQL telemetry monitoring via native ClickHouse JDBC drivers.
    - Actionable Slack alerts highlighting exact partition fragmentation and mutation backlogs.
    - Scheduled hourly auditing capability ready to enable.

    ## Who it's for

    - Data Engineers and Database Administrators managing ClickHouse analytics warehouses.
    - SRE and Platform teams supporting high-throughput event streaming ingestion pipelines.
    - Infrastructure teams operating self-hosted or ClickHouse Cloud clusters.

    ## Why orchestrate this with Kestra

    Kestra coordinates JDBC connectivity, secret masking, retry backoffs, conditional branching, and multi-channel alerting into a single declarative DAG with full execution history and zero custom daemon maintenance.

    ## Prerequisites

    - A running ClickHouse instance or ClickHouse Cloud service with user query permissions on `system` tables.
    - A Slack Incoming Webhook URL.

    ### Secrets

    - `CLICKHOUSE_USERNAME`: ClickHouse database user.
    - `CLICKHOUSE_PASSWORD`: ClickHouse database password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for database operational alerts.

    ## Quick start

    1. Configure `CLICKHOUSE_USERNAME`, `CLICKHOUSE_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Run the flow with your ClickHouse cluster host and database name.
    3. Verify the execution logs and confirm part metrics are returned.
    4. Enable the `hourly_health_audit` schedule for automated continuous monitoring.

    ## How to extend

    - Add an automated `OPTIMIZE TABLE ... FINAL` task within an approval branch for non-production environments.
    - Page on-call engineers via PagerDuty if partition part counts exceed 300.
    - Export historical part counts into Prometheus or Grafana for capacity planning.

    ## Links

    - [ClickHouse System Parts Documentation](https://clickhouse.com/docs/en/operations/system-tables/parts)
    - [Kestra ClickHouse Plugin](https://kestra.io/plugins/plugin-jdbc-clickhouse)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Database
    - Infrastructure
  subTags:
    - ClickHouse
    - Monitoring & Alerting
  ee: false
  demo: false
