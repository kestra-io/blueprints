id: frankfurter-supported-currencies-lakehouse-loader
namespace: company.analytics
description: Ingests European Central Bank sovereign currency symbols, country designations, and monetary units from Frankfurter API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: frankfurter-supported-currencies-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://api.frankfurter.app/currencies"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = ""
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for code, name in items.items():
            current_ids.append(code)
            records.append({
                'currency_code': str(code),
                'currency_name': str(name),
                'is_new': bool(code not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE sovereign_currencies (
                currency_code VARCHAR,
                currency_name VARCHAR,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO sovereign_currencies SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY sovereign_currencies TO 'sovereign_currencies.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    SUBSTRING(currency_code, 1, 1) AS initial_letter,
                    COUNT(*) AS currency_count
                FROM sovereign_currencies
                GROUP BY 1
                ORDER BY currency_count DESC
            ) TO 'currencies_by_letter.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM sovereign_currencies WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM sovereign_currencies").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - sovereign_currencies.parquet
      - currencies_by_letter.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['sovereign_currencies.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "Frankfurter Sovereign Currencies Catalog sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
