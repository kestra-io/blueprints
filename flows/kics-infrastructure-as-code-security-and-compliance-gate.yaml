id: kics-infrastructure-as-code-security-and-compliance-gate
namespace: company.security

inputs:
  - id: iac_file
    type: FILE
    displayName: "Infrastructure as Code File"
    description: "The Infrastructure as Code manifest (Terraform .tf, Kubernetes .yaml, Helm template, or CloudFormation template) to scan for security vulnerabilities and compliance misconfigurations. Used during manual execution or Subflow chaining; ignored when the webhook trigger fires."

triggers:
  - id: scan_on_pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Allows CI pipelines (e.g., GitHub Actions, GitLab CI, or Atlantis pre-apply hooks) to POST IaC files directly to this gate. fetchType: STORE safely streams the payload into Kestra internal storage as trigger.uri rather than exposing untrusted text to string interpolation."
    key: "{{ secret('KICS_WEBHOOK_KEY') }}"
    fetchType: STORE
    disabled: true

tasks:
  - id: run_kics
    type: io.kestra.plugin.scripts.shell.Commands
    description: |
      Runs Checkmarx KICS inside an isolated container against the provided Infrastructure as Code manifest.
      Evaluates the configuration against thousands of security queries covering encryption, access control,
      network security, and CIS benchmarks, generating a structured JSON diagnostic report.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      entryPoint: []
    containerImage: checkmarx/kics:latest
    commands:
      - "cp {{ trigger.uri is defined ? trigger.uri : inputs.iac_file }} target_file"
      - "/app/bin/kics scan -p target_file -o . --output-name kics-report --report-formats json || true"
      - "cat kics-report.json"
    outputFiles:
      - "kics-report.json"
    allowFailure: true

  - id: classify_iac_compliance
    type: io.kestra.plugin.core.debug.Return
    description: |
      Parses kics-report.json and classifies the outcome:
      - UNREACHABLE: Diagnostic report was never produced due to a container or I/O failure.
      - BLOCK_HIGH: One or more CRITICAL or HIGH severity security vulnerabilities detected (e.g. unencrypted data storage, public administrative port exposure, or unrestricted IAM permissions). KICS's severity_counters has six levels (CRITICAL, HIGH, MEDIUM, LOW, INFO, TRACE); both CRITICAL and HIGH block, since CRITICAL is the single most severe tier and omitting it would let the worst findings silently pass.
      - WARN_COMPLIANCE: Medium, Low, Informational, or Trace compliance findings detected (e.g. missing tags, suboptimal retention windows), which should be tracked in the backlog without blocking deployments.
      - PASS: All resources comply with security standards with zero findings.
    format: "{{ outputs.run_kics.outputFiles['kics-report.json'] is defined ? (read(outputs.run_kics.outputFiles['kics-report.json']) | jq('if (.total_counter == 0 or .total_counter == null) then \"PASS\" elif (((.severity_counters.CRITICAL // 0) + (.severity_counters.HIGH // 0)) > 0) then \"BLOCK_HIGH\" elif (((.severity_counters.MEDIUM // 0) + (.severity_counters.LOW // 0) + (.severity_counters.INFO // 0) + (.severity_counters.TRACE // 0)) > 0) then \"WARN_COMPLIANCE\" else \"PASS\" end') | first) : 'UNREACHABLE' }}"

  - id: route_by_iac_compliance
    type: io.kestra.plugin.core.flow.Switch
    description: "Branches on the compliance verdict: BLOCK_HIGH dispatches an urgent Slack alert and immediately fails the gate via Fail to halt deployment; WARN_COMPLIANCE alerts Slack with non-blocking findings for backlog triage; PASS confirms clean validation; UNREACHABLE alerts on diagnostic execution failure."
    value: "{{ outputs.classify_iac_compliance.value }}"
    cases:
      "BLOCK_HIGH":
        - id: alert_high_vulnerability
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches a high-priority security alert detailing the specific HIGH severity vulnerabilities, query titles, and line numbers."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "CRITICAL: IaC security gate BLOCKED execution {{ execution.id }} on flow {{ flow.id }}. Critical or high-severity infrastructure security vulnerability detected: {{ read(outputs.run_kics.outputFiles['kics-report.json']) | jq('[.queries[]? | select(.severity == "HIGH" or .severity == "CRITICAL") | "Query: " + .query_name + " (Line " + ((.files[0].line // "N/A")|tostring) + "): " + .description] | join(" | ")') | first }}. Remediation required before provisioning to production."
            }
        - id: fail_high_gate
          type: io.kestra.plugin.core.execution.Fail
          description: "Hard-fails the execution so downstream terraform apply steps or parent release pipelines are halted immediately."
          errorMessage: "Infrastructure as Code security gate failed: HIGH severity security vulnerability detected. Review KICS report."

      "WARN_COMPLIANCE":
        - id: alert_compliance_warning
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Sends an alert detailing medium or low severity compliance notices without breaking the deployment pipeline."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "IaC compliance gate WARNING (execution {{ execution.id }}): Non-blocking findings detected: {{ read(outputs.run_kics.outputFiles['kics-report.json']) | jq('[.queries[]? | select(.severity != "HIGH" and .severity != "CRITICAL") | "[" + .severity + "] " + .query_name] | unique | join(", ")') | first }}."
            }

      "PASS":
        - id: log_clean_iac
          type: io.kestra.plugin.core.log.Log
          description: "Logs confirmation of clean configuration with zero security vulnerabilities or compliance notices."
          message: "Infrastructure as Code validation passed: zero security vulnerabilities or compliance flaws detected by KICS."

      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Alerts when KICS container failed to produce a report due to container error or malformed input."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "IaC security gate UNREACHABLE: KICS container failed to produce kics-report.json. Check task logs for execution {{ execution.id }}."
            }
        - id: fail_unreachable
          type: io.kestra.plugin.core.execution.Fail
          description: "Fails execution when the static analysis engine could not run."
          errorMessage: "Infrastructure as Code security scan failed to complete. Check KICS runner logs."

    defaults:
      - id: log_default_status
        type: io.kestra.plugin.core.log.Log
        message: "Completed IaC security and compliance evaluation with status: {{ outputs.classify_iac_compliance.value }}"

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Records persistent audit log entry for passing and warning runs."
    message: "IaC security gate completed: status={{ outputs.classify_iac_compliance.value }}, execution={{ execution.id }}."

errors:
  - id: alert_gate_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Fires when unexpected execution crashes occur or when a Fail task deliberately fails the gate."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "IaC security gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). If status is BLOCK_HIGH, this failure is intentional to protect cloud infrastructure."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_iac_compliance.value }}"

extend:
  title: "KICS Infrastructure as Code Security and Compliance Gate"
  metaTitle: KICS Infrastructure as Code Security and Compliance Gate for Kestra
  shortDescription: Scan Terraform, Kubernetes, and CloudFormation templates with Checkmarx KICS, block CI/CD pipelines on HIGH severity security flaws, and warn on compliance drift.
  metaDescription: Block IaC deployments on HIGH severity vulnerabilities and warn on compliance drift using Checkmarx KICS.
  description: |
    Infrastructure as Code (IaC) templates define the security posture of cloud environments. Subtle misconfigurations, such as publicly accessible S3 buckets, unencrypted databases, missing egress firewalls, or wildcard IAM policies, frequently bypass manual pull request reviews and result in exposed cloud infrastructure.

    This blueprint runs Checkmarx KICS in an isolated container to parse Terraform, Kubernetes, Helm, and CloudFormation files against thousands of community and industry-standard security queries. Rather than halting builds on harmless formatting or low-level informational recommendations, the flow operationalizes KICS severity tiers: it immediately hard-blocks deployment pipelines via Fail tasks on HIGH severity security vulnerabilities (posting root-cause descriptions and line numbers to Slack), while routing medium and low severity findings as informational notifications to keep security backlogs updated without stalling continuous delivery.

    ## How it works

    1. `scan_on_pr_webhook` (`io.kestra.plugin.core.trigger.Webhook`) allows CI/CD pipelines (such as GitHub Actions, GitLab CI, or Atlantis pre-apply hooks) to POST IaC files directly to Kestra. `fetchType: STORE` securely streams the payload into Kestra internal storage as `trigger.uri`, preventing untrusted template code from undergoing string interpolation in shell scripts. Manual or parent `Subflow` executions provide the file via the `iac_file` input.
    2. `run_kics` (`io.kestra.plugin.scripts.shell.Commands`) executes the `checkmarx/kics:latest` container with `entryPoint: []` to run `/app/bin/kics scan -p target_file -o . --output-name kics-report --report-formats json` against the manifest, outputting diagnostics to `kics-report.json`. `allowFailure: true` ensures that non-zero linter exit codes do not abort the execution before structured classification.
    3. `classify_iac_compliance` (`io.kestra.plugin.core.debug.Return`) inspects `kics-report.json` using `jq`:
       - If `kics-report.json` was not generated, it classifies as `UNREACHABLE`.
       - If the report contains one or more findings with `severity == "HIGH"`, it classifies as `BLOCK_HIGH`.
       - If only `MEDIUM`, `LOW`, or `INFO` severity findings exist, it classifies as `WARN_COMPLIANCE`.
       - If zero findings were detected (`total_counter == 0`), it classifies as `PASS`.
    4. `route_by_iac_compliance` (`io.kestra.plugin.core.flow.Switch`) branches on the classification:
       - `BLOCK_HIGH`: Sends an urgent Slack alert detailing the exact query title, line number, and vulnerability description, then triggers `fail_high_gate` (`io.kestra.plugin.core.execution.Fail`) to hard-fail the pipeline.
       - `WARN_COMPLIANCE`: Dispatches an informational Slack notification detailing medium/low findings for sprint backlog triage, allowing the execution to succeed.
       - `PASS`: Records confirmation in execution logs.
       - `UNREACHABLE`: Alerts on runner container or storage failure.
    5. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) records a persistent status line in Kestra execution history for continuous cloud security auditing.
    6. Root `errors` block alerts Slack whenever an unexpected system fault occurs or when `Fail` tasks deliberately stop the pipeline.

    ## What you get

    - Early prevention of critical cloud security vulnerabilities before infrastructure provisioning starts.
    - Clear operational separation between dangerous vulnerabilities (hard block) and compliance warnings (Slack notification only).
    - Hard stop: `fail_high_gate` ensures parent CI/CD flows or Subflow orchestrators halt immediately when a HIGH severity vulnerability is detected.
    - Actionable remediation advice: alerts indicate the exact query title, line number, and description of the security defect.
    - Standardized execution output (`status`: `PASS`, `WARN_COMPLIANCE`, `BLOCK_HIGH`, `UNREACHABLE`) for automated downstream routing.

    ## Who it's for

    - Platform Engineers and SecOps teams enforcing security baselines across multi-cloud infrastructure repositories.
    - DevOps engineers looking to prevent insecure Terraform, Kubernetes, or CloudFormation manifests from reaching deployment stages.
    - Security auditors requiring an immutable execution history of infrastructure compliance checks for SOC 2 and ISO 27001 compliance.

    ## Why orchestrate this with Kestra

    Standalone CLI scanners produce exit codes, but cannot coordinate multi-tier policy decisions, alert designated team channels with tailored remediation guidance, or halt downstream enterprise release flows. Kestra transforms KICS into an automated, auditable compliance gate with persistent execution history, secure credential handling, and webhook-driven CI integration.

    ## Prerequisites

    - Docker runtime available to the Kestra worker to run the `checkmarx/kics:latest` container (no live cloud credentials or paid license keys required).
    - An Infrastructure as Code manifest file (`.tf`, `.yaml`, `.json`) to evaluate.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `KICS_WEBHOOK_KEY`: Secret authentication key for the inbound webhook trigger (`.../executions/webhook/{namespace}/{flowId}/{key}`). Required only if `scan_on_pr_webhook` is enabled.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used to dispatch security blocks, compliance warnings, and system failure alerts.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret (and `KICS_WEBHOOK_KEY` if using webhooks) in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Click **Execute**, upload a test Terraform file (for example an S3 bucket configuration with `acl = "public-read"` to observe a `BLOCK_HIGH` outcome), and verify the execution log.
    4. Enable `scan_on_pr_webhook` and configure your repository CI pipeline or pre-commit hook to POST changed IaC files on pull request events.

    ## How to extend

    - Pass a custom `.kics.config` file to scan specific CIS benchmark categories or ignore false positives using query exclude flags.
    - Integrate with Atlantis or GitHub PR comment tasks using `io.kestra.plugin.github.pulls.Comment` to post line-level review annotations directly on pull requests.
    - Chain this gate ahead of a cloud deployment pipeline to ensure only verified, compliant infrastructure manifests can execute `terraform apply`.

    ## Links

    - [Checkmarx KICS Documentation](https://docs.kics.io/)
    - [KICS GitHub Repository](https://github.com/Checkmarx/kics)
    - [Kestra Docker Script Runner](https://kestra.io/plugins/scripts/runner/docker/io.kestra.plugin.scripts.runner.docker.docker)
    - [Kestra Fail Task](https://kestra.io/plugins/core/tasks/execution/io.kestra.plugin.core.execution.fail)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false
