id: concussion-return-to-play-tracker
namespace: company.athletics
description: |
  Track every suspected concussion from removal from play to full return. A
  report opens a case, the athlete moves through the graduated return-to-sport
  stages with a minimum time per stage, each stage is signed off by a named
  person, full contact needs an uploaded medical clearance, and every step is
  kept as an audit trail.

labels:
  team: athletics
  use-case: return-to-play

inputs:
  - id: mode
    type: SELECT
    displayName: Action
    description: "`report` opens a case. `advance` asks for the next due sign-off (the 15-minute schedule does this). `sweep` posts reminders (daily)."
    values:
      - report
      - advance
      - sweep
    defaults: report
  - id: athlete
    type: STRING
    displayName: Athlete name
    required: false
  - id: team
    type: STRING
    displayName: Team
    required: false
  - id: guardian_email
    type: STRING
    displayName: Parent or guardian email
    description: Receives the removal notice, each stage change and the final clearance.
    required: false
  - id: reported_by
    type: STRING
    displayName: Reported by
    required: false
  - id: red_flags
    type: MULTISELECT
    displayName: Red-flag signs observed
    description: Any of these needs emergency care now. The flow alerts but never replaces calling emergency services.
    values:
      - Loss of consciousness
      - Repeated vomiting
      - Severe or worsening headache
      - Seizure
      - Slurred speech
      - Weakness or numbness in arms or legs
      - Increasing confusion or agitation
    required: false
  - id: case_id
    type: STRING
    displayName: Case ID (advance only)
    description: Ask for this case's sign-off now, if its minimum time has passed.
    required: false

variables:
  # Graduated return-to-sport strategy (Amsterdam 2022 consensus). Replace with your league's protocol if it differs.
  stages:
    - Symptom-limited daily activity
    - Light aerobic exercise
    - Sport-specific exercise
    - Non-contact training drills
    - Full-contact practice
    - Return to competition
  # Stage that needs a written medical clearance before it can start.
  clearance_before_stage: 5
  min_hours_per_stage: 24
  # After "not attempted yet" or an unanswered form, ask again after this many hours.
  snooze_hours: 12
  # Show athlete names in Slack. Off by default: Slack only gets the case ID, team and stage.
  slack_show_names: false
  trainer_email: athletic.trainer@example.org
  mail_from: return-to-play@example.org
  smtp_host: smtp.example.org
  smtp_port: 587
  smtp_transport: SMTP_TLS

triggers:
  - id: incident_report
    type: io.kestra.plugin.core.trigger.Webhook
    description: Point your incident form (Google Forms, Jotform, Typeform) here. The JSON body uses the same field names as the inputs.
    key: "{{ secret('RTP_WEBHOOK_KEY') }}"

  - id: due_sign_offs
    type: io.kestra.plugin.core.trigger.Schedule
    description: Every 15 minutes, open the sign-off form for one case whose minimum time in its stage has passed.
    cron: "*/15 * * * *"
    inputs:
      mode: advance

  - id: daily_reminders
    type: io.kestra.plugin.core.trigger.Schedule
    description: Remind the trainer about unanswered sign-offs and cases that stopped progressing.
    cron: "0 8 * * *"
    inputs:
      mode: sweep

tasks:
  - id: by_mode
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ inputs.mode ?? 'report' }}"
    cases:
      report:
        - id: open_case
          type: io.kestra.plugin.scripts.python.Script
          description: Validate the report, refuse a second open case for the same athlete, and build the case record.
          dependencies:
            - kestra
          inputFiles:
            report.json: |
              {"athlete": {{ (trigger.body.athlete ?? inputs.athlete ?? '') | toJson }},
               "team": {{ (trigger.body.team ?? inputs.team ?? '') | toJson }},
               "guardian_email": {{ (trigger.body.guardian_email ?? inputs.guardian_email ?? '') | toJson }},
               "reported_by": {{ (trigger.body.reported_by ?? inputs.reported_by ?? '') | toJson }},
               "red_flags": {{ (trigger.body.red_flags ?? inputs.red_flags ?? []) | toJson }},
               "open_case": {{ kv(('rtp-open-' ~ ((trigger.body.athlete ?? inputs.athlete ?? '') | trim) ~ '-' ~ ((trigger.body.team ?? inputs.team ?? '') | trim)) | slugify, errorOnMissing=false) | toJson }},
               "execution": {{ execution.id | toJson }}, "stages": {{ vars.stages | toJson }}}
          script: |
            import json, re
            from datetime import datetime, timezone
            from kestra import Kestra

            r = json.load(open("report.json"))
            missing = [f for f in ("athlete", "team", "guardian_email", "reported_by") if not str(r[f]).strip()]
            if missing:
                raise SystemExit("The report is missing: " + ", ".join(missing))
            if not re.fullmatch(r"[^@\s]+@[^@\s]+\.[^@\s]+", r["guardian_email"].strip()):
                raise SystemExit(f"Guardian email looks invalid: {r['guardian_email']}")
            if r["open_case"]:
                raise SystemExit(f"{r['athlete']} ({r['team']}) already has an open case: {r['open_case']}. Continue that case instead.")
            flags = r["red_flags"] if isinstance(r["red_flags"], list) else [f for f in str(r["red_flags"]).split(",") if f.strip()]
            now = datetime.now(timezone.utc).isoformat(timespec="seconds")
            case_id = f"RTP-{now[:10].replace('-', '')}-{r['execution'][:4].upper()}"
            case = {"case_id": case_id, "athlete": r["athlete"].strip(), "team": r["team"].strip(),
                    "guardian_email": r["guardian_email"].strip(), "reported_by": r["reported_by"].strip(),
                    "red_flags": flags, "opened": now, "stage": 1, "stage_started": now, "status": "active",
                    "snooze_until": "", "history": [{"at": now, "event": "Removed from play and case opened",
                                                     "by": r["reported_by"].strip(), "execution": r["execution"]}]}
            Kestra.outputs({"case": case, "case_id": case_id, "red_flags": flags})

        - id: label_case
          type: io.kestra.plugin.core.execution.Labels
          labels:
            case: "{{ outputs.open_case.vars.case_id }}"
            stage: "1"

        - id: red_flag_alert
          type: io.kestra.plugin.core.flow.If
          description: Red-flag signs need emergency care, not a return-to-play plan.
          condition: "{{ outputs.open_case.vars.red_flags | length > 0 }}"
          then:
            - id: urgent_slack
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              retry:
                type: constant
                interval: PT10S
                maxAttempts: 3
              messageText: "🚨 *{{ outputs.open_case.vars.case_id }}* ({{ outputs.open_case.vars.case.team }}): red-flag signs were reported. Make sure the athlete gets emergency care now; this alert does not replace calling emergency services."

        - id: notify_guardian
          type: io.kestra.plugin.email.MailSend
          description: Tell the parent or guardian the athlete was removed from play and what happens next.
          host: "{{ vars.smtp_host }}"
          port: "{{ vars.smtp_port }}"
          transportStrategy: "{{ vars.smtp_transport }}"
          username: "{{ secret('RTP_SMTP_USERNAME') }}"
          password: "{{ secret('RTP_SMTP_PASSWORD') }}"
          from: "{{ vars.mail_from }}"
          to: "{{ outputs.open_case.vars.case.guardian_email }}"
          cc: "{{ vars.trainer_email }}"
          subject: "{{ outputs.open_case.vars.case.athlete }} was removed from play ({{ outputs.open_case.vars.case_id }})"
          retry:
            type: exponential
            interval: PT30S
            maxInterval: PT5M
            maxAttempts: 4
          plainTextContent: |
            Hello,

            {{ outputs.open_case.vars.case.athlete }} ({{ outputs.open_case.vars.case.team }}) was removed from play today after a suspected head injury, reported by {{ outputs.open_case.vars.case.reported_by }}.

            Please have {{ outputs.open_case.vars.case.athlete }} evaluated by a healthcare provider and follow their advice. Seek emergency care right away if you notice repeated vomiting, a severe or worsening headache, seizures, slurred speech, weakness or numbness, or increasing confusion.

            Return to sport happens in {{ vars.stages | length }} stages, at least {{ vars.min_hours_per_stage }} hours each, starting with: {{ vars.stages[0] }}. Full-contact practice needs a written medical clearance. You will get an email at each stage change.

            Case reference: {{ outputs.open_case.vars.case_id }}
            Questions: {{ vars.trainer_email }}

        - id: notify_trainers
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          retry:
            type: constant
            interval: PT10S
            maxAttempts: 3
          messageText: "🩹 *{{ outputs.open_case.vars.case_id }}*{% if vars.slack_show_names %} {{ outputs.open_case.vars.case.athlete }}{% endif %} ({{ outputs.open_case.vars.case.team }}) removed from play. Stage 1 ({{ vars.stages[0] }}) can be signed off after {{ vars.min_hours_per_stage }} hours."

        - id: save_case
          type: io.kestra.plugin.core.kv.Set
          description: Saved only after the notices went out, so a failed run can simply be submitted again.
          key: "{{ ('rtp-case-' ~ outputs.open_case.vars.case_id) | lower }}"
          kvType: JSON
          value: "{{ outputs.open_case.vars.case | toJson }}"

        - id: mark_open
          type: io.kestra.plugin.core.kv.Set
          description: One open case per athlete and team.
          key: "{{ ('rtp-open-' ~ outputs.open_case.vars.case.athlete ~ '-' ~ outputs.open_case.vars.case.team) | slugify }}"
          value: "{{ outputs.open_case.vars.case_id }}"

      advance:
        - id: list_cases
          type: io.kestra.plugin.core.kv.GetKeys
          prefix: rtp-case-

        - id: pick_due
          type: io.kestra.plugin.scripts.python.Script
          description: Pick one open case whose minimum time in its stage has passed and that isn't already waiting for a sign-off.
          dependencies:
            - kestra
          inputFiles:
            cases.json: "[{% for k in outputs.list_cases.keys %}{{ kv(k) | toJson }}, {% endfor %}null]"
            settings.json: |
              {"min_hours": {{ vars.min_hours_per_stage }}, "case_id": {{ (inputs.case_id ?? '') | toJson }},
               "stages": {{ vars.stages | toJson }}, "clearance_before": {{ vars.clearance_before_stage }},
               "execution": {{ execution.id | toJson }}}
          script: |
            import json
            from datetime import datetime, timedelta, timezone
            from kestra import Kestra

            cases = [c for c in json.load(open("cases.json")) if c]
            s = json.load(open("settings.json"))
            now = datetime.now(timezone.utc)

            def due(c):
                ready = datetime.fromisoformat(c["stage_started"]) + timedelta(hours=float(s["min_hours"]))
                snooze = datetime.fromisoformat(c["snooze_until"]) if c.get("snooze_until") else now
                return max(ready, snooze)

            open_cases = [c for c in cases if c["status"] == "active"]
            if s["case_id"]:
                open_cases = [c for c in open_cases if c["case_id"].lower() == s["case_id"].strip().lower()]
            ready = sorted((c for c in open_cases if due(c) <= now), key=due)
            if not ready:
                print(f"{len(open_cases)} open case(s), none due for a sign-off yet.")
                Kestra.outputs({"found": False})
                raise SystemExit(0)
            c = ready[0]
            stage = c["stage"]
            Kestra.outputs({"found": True, "case": c, "case_id": c["case_id"], "stage": stage,
                            "awaiting": dict(c, status="awaiting", awaiting_execution=s["execution"]),
                            "stage_name": s["stages"][stage - 1],
                            "next_name": s["stages"][stage] if stage < len(s["stages"]) else "fully returned",
                            "needs_clearance": stage + 1 == s["clearance_before"],
                            "waiting": len(ready) - 1})

        - id: nothing_due
          type: io.kestra.plugin.core.flow.If
          condition: "{{ not outputs.pick_due.vars.found }}"
          then:
            - id: no_sign_off_due
              type: io.kestra.plugin.core.execution.Exit
              state: SUCCESS

        - id: label_stage
          type: io.kestra.plugin.core.execution.Labels
          labels:
            case: "{{ outputs.pick_due.vars.case_id }}"
            stage: "{{ outputs.pick_due.vars.stage }}"

        - id: mark_awaiting
          type: io.kestra.plugin.core.kv.Set
          description: Mark the case as waiting for this execution's form, so the next run picks a different case.
          key: "{{ ('rtp-case-' ~ outputs.pick_due.vars.case_id) | lower }}"
          kvType: JSON
          value: "{{ outputs.pick_due.vars.awaiting | toJson }}"

        - id: ask_trainer
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          retry:
            type: constant
            interval: PT10S
            maxAttempts: 3
          messageText: |
            📝 *{{ outputs.pick_due.vars.case_id }}*{% if vars.slack_show_names %} {{ outputs.pick_due.vars.case.athlete }}{% endif %} ({{ outputs.pick_due.vars.case.team }}): stage {{ outputs.pick_due.vars.stage }} ({{ outputs.pick_due.vars.stage_name }}) can be signed off.{% if outputs.pick_due.vars.needs_clearance %} Moving on to {{ outputs.pick_due.vars.next_name | lower }} needs a written medical clearance.{% endif %}
            {{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}

        - id: sign_off
          type: io.kestra.plugin.core.flow.Pause
          description: The athletic trainer or physician records the stage outcome. Without an answer within 7 days the form closes and the case is asked again later.
          pauseDuration: P7D
          behavior: RESUME
          onResume:
            - id: outcome
              type: SELECT
              displayName: Stage outcome
              values:
                - Completed without symptoms
                - Symptoms returned
                - Not attempted yet
              defaults: Not attempted yet
            - id: signed_by
              type: STRING
              displayName: Your name and role
              required: false
            - id: notes
              type: STRING
              displayName: Notes (stay in Kestra, never sent to Slack)
              required: false
            - id: clearance
              type: FILE
              displayName: Written medical clearance (needed before full contact)
              required: false
            - id: clinician
              type: STRING
              displayName: Clinician who signed the clearance
              required: false

        - id: decide
          type: io.kestra.plugin.scripts.python.Script
          description: Apply the protocol. Advance one stage, drop back one stage when symptoms return, or keep the stage. Full contact is refused without a clearance.
          dependencies:
            - kestra
          inputFiles:
            case.json: "{{ outputs.pick_due.vars.case | toJson }}"
            answer.json: |
              {"outcome": {{ (outputs.sign_off.onResume.outcome ?? 'Not attempted yet') | toJson }},
               "signed_by": {{ (outputs.sign_off.onResume.signed_by ?? '') | toJson }},
               "notes": {{ (outputs.sign_off.onResume.notes ?? '') | toJson }},
               "clearance": {{ (outputs.sign_off.onResume.clearance ?? '') | toJson }},
               "clinician": {{ (outputs.sign_off.onResume.clinician ?? '') | toJson }},
               "execution": {{ execution.id | toJson }}, "stages": {{ vars.stages | toJson }},
               "clearance_before": {{ vars.clearance_before_stage }}, "snooze_hours": {{ vars.snooze_hours }}}
          script: |
            import json
            from datetime import datetime, timedelta, timezone
            from kestra import Kestra

            c = json.load(open("case.json"))
            a = json.load(open("answer.json"))
            stages, stage = a["stages"], c["stage"]
            now = datetime.now(timezone.utc)
            entry = {"at": now.isoformat(timespec="seconds"), "stage": stage, "outcome": a["outcome"],
                     "by": a["signed_by"].strip(), "notes": a["notes"].strip(), "execution": a["execution"]}
            snooze = (now + timedelta(hours=float(a["snooze_hours"]))).isoformat(timespec="seconds")
            outcome, changed, closed = a["outcome"], False, False

            if outcome == "Completed without symptoms" and not entry["by"]:
                outcome, message = "Not attempted yet", "Not advanced: a sign-off needs the name and role of the person signing."
            elif outcome == "Completed without symptoms" and stage + 1 == a["clearance_before"] and not (a["clearance"] and a["clinician"].strip()):
                outcome, message = "Not attempted yet", f"Not advanced: {stages[stage].lower()} needs a written medical clearance and the clinician's name."
            elif outcome == "Completed without symptoms":
                message = f"Stage {stage} ({stages[stage - 1]}) completed without symptoms."
            elif outcome == "Symptoms returned":
                message = f"Symptoms returned during stage {stage}. Back to stage {max(1, stage - 1)} once symptom-free for 24 hours."
            else:
                message = "No change: stage not attempted yet, or the form was not answered within 7 days."

            if outcome == "Completed without symptoms":
                if a["clearance"]:
                    entry.update(clearance=a["clearance"], clinician=a["clinician"].strip())
                changed = True
                if stage >= len(stages):
                    closed = True
                    c.update(status="closed", closed=entry["at"])
                    message += " Fully returned to competition; case closed."
                else:
                    c.update(stage=stage + 1, stage_started=entry["at"], snooze_until="")
                    message += f" Now at stage {stage + 1}: {stages[stage]}."
            elif outcome == "Symptoms returned":
                changed = True
                c.update(stage=max(1, stage - 1), stage_started=entry["at"], snooze_until="")
            else:
                c["snooze_until"] = snooze
            if not closed:
                c["status"] = "active"
            c.pop("awaiting_execution", None)
            entry["result"] = message
            c["history"].append(entry)
            print(message)
            Kestra.outputs({"case": c, "message": message, "changed": changed, "closed": closed,
                            "stage_name": stages[c["stage"] - 1]})

        - id: save_progress
          type: io.kestra.plugin.core.kv.Set
          key: "{{ ('rtp-case-' ~ outputs.pick_due.vars.case_id) | lower }}"
          kvType: JSON
          value: "{{ outputs.decide.vars.case | toJson }}"

        - id: post_outcome
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          retry:
            type: constant
            interval: PT10S
            maxAttempts: 3
          messageText: "{% if outputs.decide.vars.closed %}✅{% elseif outputs.decide.vars.changed %}➡️{% else %}⏸️{% endif %} *{{ outputs.pick_due.vars.case_id }}* ({{ outputs.pick_due.vars.case.team }}): {{ outputs.decide.vars.message }}"

        - id: tell_guardian
          type: io.kestra.plugin.core.flow.If
          description: Email the parent or guardian whenever the stage changes.
          condition: "{{ outputs.decide.vars.changed }}"
          then:
            - id: stage_email
              type: io.kestra.plugin.email.MailSend
              host: "{{ vars.smtp_host }}"
              port: "{{ vars.smtp_port }}"
              transportStrategy: "{{ vars.smtp_transport }}"
              username: "{{ secret('RTP_SMTP_USERNAME') }}"
              password: "{{ secret('RTP_SMTP_PASSWORD') }}"
              from: "{{ vars.mail_from }}"
              to: "{{ outputs.decide.vars.case.guardian_email }}"
              cc: "{{ vars.trainer_email }}"
              subject: "{{ outputs.decide.vars.case.athlete }}: {% if outputs.decide.vars.closed %}cleared to return to competition{% else %}now at stage {{ outputs.decide.vars.case.stage }} of {{ vars.stages | length }}{% endif %} ({{ outputs.pick_due.vars.case_id }})"
              retry:
                type: exponential
                interval: PT30S
                maxInterval: PT5M
                maxAttempts: 4
              plainTextContent: |
                Hello,

                Update on {{ outputs.decide.vars.case.athlete }}'s return to sport ({{ outputs.pick_due.vars.case_id }}):
                {{ outputs.decide.vars.message }}

                {% if outputs.decide.vars.closed %}Full timeline:
                {% for h in outputs.decide.vars.case.history %}- {{ h.at | slice(0, 16) | replace({'T': ' '}) }}: {{ h.result ?? h.event }}{% if h.by is defined and h.by != '' %} ({{ h.by }}){% endif %}{% if h.clinician is defined %} Medical clearance from {{ h.clinician }} on file.{% endif %}
                {% endfor %}{% else %}Next stage: {{ outputs.decide.vars.stage_name }}, for at least {{ vars.min_hours_per_stage }} hours. If symptoms come back, stop the activity and tell the trainer.{% endif %}

                Questions: {{ vars.trainer_email }}

        - id: close_case
          type: io.kestra.plugin.core.flow.If
          condition: "{{ outputs.decide.vars.closed }}"
          then:
            - id: audit_report
              type: io.kestra.plugin.scripts.python.Script
              description: Write the case timeline, with every sign-off and the clearance, as a file to keep with the athlete's records.
              dependencies:
                - kestra
              inputFiles:
                case.json: "{{ outputs.decide.vars.case | toJson }}"
              outputFiles:
                - "*.md"
              script: |
                import json
                c = json.load(open("case.json"))
                lines = [f"# Return-to-play record {c['case_id']}", "",
                         f"- Athlete: {c['athlete']} ({c['team']})", f"- Opened: {c['opened']} by {c['reported_by']}",
                         f"- Closed: {c['closed']}", f"- Red flags at report: {', '.join(c['red_flags']) or 'none'}", "",
                         "| When (UTC) | Stage | Outcome | Signed by | Notes | Clearance | Execution |", "|---|---|---|---|---|---|---|"]
                for h in c["history"]:
                    lines.append("| {} | {} | {} | {} | {} | {} | {} |".format(
                        h["at"], h.get("stage", "-"), h.get("result") or h.get("event", ""), h.get("by", ""),
                        h.get("notes", "").replace("|", "/"),
                        f"{h['clinician']} ({h['clearance']})" if h.get("clinician") else "", h["execution"]))
                open(f"{c['case_id']}.md", "w").write("\n".join(lines) + "\n")

            - id: release_athlete
              type: io.kestra.plugin.core.kv.Delete
              description: Allow a new case for this athlete in the future.
              key: "{{ ('rtp-open-' ~ outputs.decide.vars.case.athlete ~ '-' ~ outputs.decide.vars.case.team) | slugify }}"
              errorOnMissing: false

      sweep:
        - id: list_open
          type: io.kestra.plugin.core.kv.GetKeys
          prefix: rtp-case-

        - id: find_stalled
          type: io.kestra.plugin.scripts.python.Script
          description: Find sign-off forms left open for 2 days and cases that haven't changed stage in 7 days.
          dependencies:
            - kestra
          inputFiles:
            cases.json: "[{% for k in outputs.list_open.keys %}{{ kv(k) | toJson }}, {% endfor %}null]"
          script: |
            import json
            from datetime import datetime, timedelta, timezone
            from kestra import Kestra

            now = datetime.now(timezone.utc)
            lines = []
            for c in (c for c in json.load(open("cases.json")) if c and c["status"] != "closed"):
                last = datetime.fromisoformat(c["history"][-1]["at"])
                started = datetime.fromisoformat(c["stage_started"])
                if c["status"] == "awaiting" and now - last > timedelta(days=2):
                    lines.append(f"• *{c['case_id']}* ({c['team']}): stage {c['stage']} sign-off waiting since {last:%b %d}")
                elif now - started > timedelta(days=7):
                    lines.append(f"• *{c['case_id']}* ({c['team']}): still at stage {c['stage']} after {(now - started).days} days")
            Kestra.outputs({"count": len(lines), "digest": "\n".join(lines)})

        - id: remind
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          runIf: "{{ outputs.find_stalled.vars.count > 0 }}"
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          retry:
            type: constant
            interval: PT10S
            maxAttempts: 3
          messageText: |
            ⏰ *Return-to-play cases needing attention*
            {{ outputs.find_stalled.vars.digest }}

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert with the failed task, the error and a link. The case record is saved only after each step succeeds, so the case is never left half-updated.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    messageText: |
      ❌ *Return-to-play tracker FAILED* ({{ inputs.mode ?? 'report' }}; flow {{ flow.namespace }}.{{ flow.id }}, execution {{ execution.id }}).
      Failed task: {{ (errorLogs() | length) > 0 ? errorLogs()[0].taskId : 'unknown' }}. Error: {{ ((errorLogs() | length) > 0 and (errorLogs()[0].message ?? 'null') != 'null') ? errorLogs()[0].message : 'see the execution logs' }}
      {% if (inputs.mode ?? 'report') == 'report' %}No case was saved for this report; submit it again once the problem is fixed.{% else %}Sign-offs are saved before the emails, so check whether the guardian was told.{% endif %}
      {{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}

outputs:
  - id: case_id
    type: STRING
    displayName: Case ID
    value: "{{ outputs.open_case.vars.case_id ?? outputs.pick_due.vars.case_id ?? '' }}"
  - id: result
    type: STRING
    displayName: Result
    value: "{{ outputs.decide.vars.message ?? '' }}"

extend:
  title: Concussion Return-to-Play Tracker with Graduated Stages, Trainer Sign-Offs and Medical Clearance
  metaTitle: Concussion Return-to-Play Tracker for Sports Teams
  shortDescription: Open a case when an athlete is removed from play, move them through graduated return-to-sport stages with a minimum time and a named sign-off at each step, require a medical clearance before full contact, and keep the whole trail.
  metaDescription: Track concussion return-to-play in Kestra with graduated stages, trainer sign-offs, required medical clearance, guardian emails and an audit trail.
  description: |
    Every US state requires youth athletes with a suspected concussion to be removed from play, return in graduated stages, and have written medical clearance before full contact. Most schools and clubs still track this on paper, so stages get skipped, clearances go missing, and nobody can show the record later. This flow runs the protocol: it opens a case, times each stage, asks a named person to sign it off, and keeps every step.

    ## How it works

    1. `incident_report` (`Webhook`) or the Execute form opens a case. `open_case` refuses a second open case for the same athlete, red-flag signs trigger an urgent alert, and the guardian gets a removal notice (`email.MailSend`).
    2. `due_sign_offs` (`Schedule`, every 15 minutes) picks one case whose minimum time in its stage has passed, labels the execution with `case` and `stage`, and opens the `sign_off` form (`Pause`): outcome, signer, notes, and a clearance file.
    3. `decide` applies the protocol in code: advance one stage, drop back one stage when symptoms return, or keep the stage. Leaving the stage before full contact needs an uploaded clearance and the clinician's name.
    4. Each stage change emails the guardian. After the last stage, `audit_report` writes the full timeline as a file and the case closes.
    5. `daily_reminders` flags sign-offs left open for 2 days and cases stuck for 7.

    ## What you get

    - A case record in the KV store with every sign-off, its signer and time, notes and the clearance.
    - Executions filtered by the `case` label show the whole history.
    - Slack gets case IDs, teams and stages only; health details stay in Kestra.

    ## Who it's for

    - Athletic trainers, team physicians and safety officers in schools, clubs and leagues.

    ## Why orchestrate this with Kestra

    Timers, forms, uploads, audit logs and alerts are built in, so every athlete gets the same protocol.

    ## Prerequisites

    - An SMTP account and a Slack incoming webhook. Set `smtp_*`, `mail_from` and `trainer_email` in `variables`.

    ### Secrets

    - `RTP_SMTP_USERNAME`, `RTP_SMTP_PASSWORD`: send guardian and trainer emails.
    - `SLACK_WEBHOOK_URL`: case notices, sign-off requests and alerts.
    - `RTP_WEBHOOK_KEY`: key in the incident form's webhook URL.

    ## Quick start

    1. Add the secrets and set `variables`.
    2. Execute with `mode: report` for a test athlete, using your own email as the guardian.
    3. Run `mode: advance` after the stage time to see the sign-off form.
    4. Point your incident form at `/api/v1/main/executions/webhook/company.athletics/concussion-return-to-play-tracker/<RTP_WEBHOOK_KEY>`.

    Outputs: `{{ outputs.case_id }}` and `{{ outputs.result }}`.

    ## How to extend

    - Replace `stages`, `min_hours_per_stage` and `clearance_before_stage` with your league's protocol.
    - Send the audit report to your athlete records system or a secure bucket.

    This flow tracks a protocol; it never gives medical advice or replaces a clinician.

    ## Links

    - [Pause task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
    - [Email plugin](https://kestra.io/plugins/plugin-email)
    - [Consensus statement on concussion in sport (Amsterdam 2022)](https://bjsm.bmj.com/content/57/11/695)
    - [CDC HEADS UP](https://www.cdc.gov/heads-up/)
    - This blueprint has been created by [Biplab Bera](https://github.com/bishalbera)
  tags:
    - Business
  subTags:
    - Approval Gates
    - Policy & Compliance
  ee: false
  demo: false
