id: kestra-subflow-interface-change-gate
namespace: company.platform

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: shared_namespace
    type: STRING
    defaults: company.shared
    description: Namespace of the reusable flows that other flows call as subflows. Only these flows are checked and deployed.
  - id: caller_namespace_prefix
    type: STRING
    defaults: company
    description: Root namespace to scan for callers. Every flow in it and its child namespaces is checked.
  - id: candidate_source
    type: STRING
    required: false
    description: YAML of a new version of one flow from shared_namespace. Leave empty to audit the live flows instead.
  - id: allow_breaking
    type: BOOL
    defaults: false
    description: Wait for an approval instead of failing when the candidate breaks existing callers.
  - id: dry_run
    type: BOOL
    defaults: true
    description: Only check the candidate. Set to false to deploy it when the check passes.
  - id: max_flows
    type: INT
    defaults: 1000
    min: 1
    max: 10000
    description: Upper bound on the number of caller flows scanned. The run fails rather than skip callers above it.
  - id: kestra_url
    type: URI
    defaults: http://localhost:8080
    description: Base URL of the Kestra API.

variables:
  tenant: main
  # Input: {library, callers, candidate, shared}. Output: one record per call site into the shared namespace.
  interface_check: |
    def key: .namespace + "/" + .id;
    def iface: {disabled: (.disabled == true), inputs: (.inputs // []), outputs: [(.outputs // [])[] | .id]};
    def among($list; $x): ($list | map(select(. == $x)) | length) > 0;
    .shared as $shared | .candidate as $cand
    | ([.library[] | {key: key, value: iface}] | from_entries) as $live
    | (if $cand == null then $live else $live + {($cand | key): ($cand | iface)} end) as $iface
    | ([.callers[] | select($cand == null or key != ($cand | key))] + (if $cand == null then [] else [$cand] end)) as $flows
    | [ $flows[] as $f
        | ($f | tostring) as $text
        | $f | .. | objects | select(.type? == "io.kestra.plugin.core.flow.Subflow")
        | . as $t
        | {caller: ($f | key), task: $t.id, subflow: ($t.namespace + "/" + $t.flowId)} as $site
        | if (($t.namespace + $t.flowId) | contains("{")) then
            [$site + {severity: "UNVERIFIED", problem: "namespace or flowId is an expression, check this call by hand"}]
          elif $t.namespace != $shared then []
          elif $iface[$site.subflow] == null then
            [$site + {severity: "BREAKING", problem: "the subflow does not exist"}]
          else
            $iface[$site.subflow] as $i
            | ([($t.inputs // {}) | keys[]]) as $passed
            | ([$i.inputs[] | .id]) as $declared
            | ($live[$site.subflow].inputs // []) as $before
            | [ (if $i.disabled then $site + {severity: "BREAKING", problem: "the subflow is disabled"} else empty end),
                ($i.inputs[] | select(.required != false and .defaults == null) | .id
                  | select(among($passed; .) | not)
                  | $site + {severity: "BREAKING", problem: ("required input " + . + " is not passed")}),
                ($passed[] | select(among($declared; .) | not)
                  | $site + {severity: "WARNING", problem: ("passes input " + . + " that the subflow does not declare, the value is ignored")}),
                ($i.inputs[] | . as $new | select(among($passed; $new.id))
                  | ($before[] | select(.id == $new.id and .type != $new.type))
                  | $site + {severity: "WARNING", problem: ("input " + $new.id + " changes type from " + .type + " to " + $new.type)}),
                ([$text | scan("outputs[.]" + $t.id + "[.]outputs[.]([A-Za-z0-9_-]+)") | .[0]] | unique[]
                  | select(among($i.outputs; .) | not)
                  | $site + {severity: "BREAKING", problem: ("reads output " + . + " that the subflow does not return")}) ]
            | if length == 0 then [$site + {severity: "OK", problem: ""}] else . end
          end
        | .[] ]

tasks:
  - id: candidate_checks
    type: io.kestra.plugin.core.flow.If
    description: Validates the candidate with Kestra's own flow validator before anything else uses it.
    condition: "{{ inputs.candidate_source is not empty }}"
    then:
      - id: validate_candidate
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.kestra_url }}/api/v1/{{ vars.tenant }}/flows/validate"
        method: POST
        contentType: application/x-yaml
        body: "{{ inputs.candidate_source }}"
        options:
          auth:
            type: BASIC
            username: "{{ secret('KESTRA_USERNAME') }}"
            password: "{{ secret('KESTRA_PASSWORD') }}"
        retry:
          type: constant
          interval: PT10S
          maxAttempts: 3

      - id: check_candidate
        type: io.kestra.plugin.core.execution.Assert
        description: One valid flow from the shared namespace, and never this gate itself.
        conditions:
          - "{{ (fromJson(outputs.validate_candidate.body) | length) == 1 }}"
          - "{{ (fromJson(outputs.validate_candidate.body) | first).constraints is empty }}"
          - "{{ (fromJson(outputs.validate_candidate.body) | first).namespace == inputs.shared_namespace }}"
          - "{{ (fromJson(outputs.validate_candidate.body) | first).flow != flow.id or inputs.shared_namespace != flow.namespace }}"
        errorMessage: "The candidate must be exactly one valid flow of namespace {{ inputs.shared_namespace }}: {{ outputs.validate_candidate.body }}"

      - id: live_candidate
        type: io.kestra.plugin.core.http.Request
        description: Current source of the flow the candidate replaces. A 404 means the candidate is a new flow.
        uri: "{{ inputs.kestra_url }}/api/v1/{{ vars.tenant }}/flows/{{ inputs.shared_namespace }}/{{ (fromJson(outputs.validate_candidate.body) | first).flow }}?source=true"
        options:
          allowFailed: true
          auth:
            type: BASIC
            username: "{{ secret('KESTRA_USERNAME') }}"
            password: "{{ secret('KESTRA_PASSWORD') }}"

      - id: check_live_lookup
        type: io.kestra.plugin.core.execution.Assert
        conditions:
          - "{{ outputs.live_candidate.code == 200 or outputs.live_candidate.code == 404 }}"
        errorMessage: "Could not read the live version of the candidate (HTTP {{ outputs.live_candidate.code }})"

  - id: library
    type: io.kestra.plugin.kestra.flows.List
    description: Current inputs and outputs of every flow in the shared namespace.
    kestraUrl: "{{ inputs.kestra_url }}"
    tenantId: "{{ vars.tenant }}"
    namespace: "{{ inputs.shared_namespace }}"
    auth:
      username: "{{ secret('KESTRA_USERNAME') }}"
      password: "{{ secret('KESTRA_PASSWORD') }}"
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: callers
    type: io.kestra.plugin.core.http.Request
    description: Every flow under the caller prefix, with its tasks, in one bounded page.
    uri: "{{ inputs.kestra_url }}/api/v1/{{ vars.tenant }}/flows/search?page=1&size={{ inputs.max_flows }}&filters%5Bnamespace%5D%5BPREFIX%5D={{ inputs.caller_namespace_prefix }}"
    options:
      auth:
        type: BASIC
        username: "{{ secret('KESTRA_USERNAME') }}"
        password: "{{ secret('KESTRA_PASSWORD') }}"
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: check_scan_complete
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ (fromJson(outputs.callers.body)).total <= inputs.max_flows }}"
    errorMessage: "{{ (fromJson(outputs.callers.body)).total }} flows match {{ inputs.caller_namespace_prefix }}, more than max_flows ({{ inputs.max_flows }}). Raise max_flows so no caller is skipped."

  - id: analysis
    type: io.kestra.plugin.core.output.OutputValues
    values:
      findings: "{{ {'library': outputs.library.flows, 'callers': (fromJson(outputs.callers.body)).results, 'candidate': (inputs.candidate_source is empty ? null : yaml(inputs.candidate_source)), 'shared': inputs.shared_namespace} | jq(vars.interface_check) | first | toJson }}"

  - id: verdict
    type: io.kestra.plugin.core.output.OutputValues
    description: BLOCKED and AUDIT_BROKEN fail the run. UNCHANGED makes a repeated deploy a no-op.
    values:
      sites: "{{ outputs.analysis.values.findings | jq('[.[] | .caller + \"/\" + .task] | unique | length') | first }}"
      broken_sites: "{{ outputs.analysis.values.findings | jq('[.[] | select(.severity == \"BREAKING\") | .caller + \"/\" + .task] | unique | length') | first }}"
      breaking: "{{ outputs.analysis.values.findings | jq('[.[] | select(.severity == \"BREAKING\")] | length') | first }}"
      warnings: "{{ outputs.analysis.values.findings | jq('[.[] | select(.severity == \"WARNING\" or .severity == \"UNVERIFIED\")] | length') | first }}"
      decision: >-
        {%- set breaking = outputs.analysis.values.findings | jq('[.[] | select(.severity == "BREAKING")] | length') | first -%}
        {%- if inputs.candidate_source is empty -%}{{ breaking > 0 ? 'AUDIT_BROKEN' : 'AUDIT_OK' }}
        {%- elseif breaking > 0 and not inputs.allow_breaking -%}BLOCKED
        {%- elseif outputs.live_candidate.code == 200 and (fromJson(outputs.live_candidate.body)).source | trim == inputs.candidate_source | trim -%}UNCHANGED
        {%- elseif inputs.dry_run -%}CHECKED
        {%- elseif breaking > 0 -%}APPROVAL
        {%- else -%}DEPLOY{%- endif -%}

  - id: report
    type: io.kestra.plugin.core.log.Log
    level: "{{ (outputs.verdict.values.breaking | number) > 0 ? 'ERROR' : ((outputs.verdict.values.warnings | number) > 0 ? 'WARN' : 'INFO') }}"
    message: |-
      {{ outputs.verdict.values.decision }}: {{ outputs.verdict.values.sites }} call sites into {{ inputs.shared_namespace }}, {{ outputs.verdict.values.breaking }} breaking problems in {{ outputs.verdict.values.broken_sites }} of them, {{ outputs.verdict.values.warnings }} findings to review.
      {%- for f in fromJson(outputs.analysis.values.findings) %}{% if f.severity != 'OK' %}
      {{ f.severity }} {{ f.caller }} task {{ f.task }} -> {{ f.subflow }}: {{ f.problem }}{% endif %}{% endfor %}

  - id: gate
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.verdict.values.decision }}"
    cases:
      BLOCKED:
        - id: block_change
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "Not deployed: the candidate breaks {{ outputs.verdict.values.broken_sites }} call sites. Fix the callers first, or rerun with allow_breaking to ask for approval."
      AUDIT_BROKEN:
        - id: fail_audit
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "{{ outputs.verdict.values.broken_sites }} call sites into {{ inputs.shared_namespace }} fail at runtime. See the report task for each caller and task."
      APPROVAL:
        - id: approve_breaking_change
          type: io.kestra.plugin.core.flow.Pause
          description: Resume to deploy a change that breaks the listed callers. Without approval within 8 hours, the run is cancelled and nothing is deployed.
          pauseDuration: PT8H
          behavior: CANCEL
    defaults:
      - id: nothing_blocks
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.verdict.values.decision }}: no call site blocks this run."

  - id: release
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.verdict.values.decision == 'DEPLOY' or outputs.verdict.values.decision == 'APPROVAL' }}"
    then:
      - id: deploy
        type: io.kestra.plugin.core.http.Request
        description: Updates the flow, or creates it when it is new.
        uri: "{{ inputs.kestra_url }}/api/v1/{{ vars.tenant }}/flows{{ outputs.live_candidate.code == 200 ? '/' ~ inputs.shared_namespace ~ '/' ~ (fromJson(outputs.validate_candidate.body) | first).flow : '' }}"
        method: "{{ outputs.live_candidate.code == 200 ? 'PUT' : 'POST' }}"
        contentType: application/x-yaml
        body: "{{ inputs.candidate_source }}"
        options:
          auth:
            type: BASIC
            username: "{{ secret('KESTRA_USERNAME') }}"
            password: "{{ secret('KESTRA_PASSWORD') }}"

      - id: deployed
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.kestra_url }}/api/v1/{{ vars.tenant }}/flows/{{ inputs.shared_namespace }}/{{ (fromJson(outputs.validate_candidate.body) | first).flow }}?source=true"
        options:
          auth:
            type: BASIC
            username: "{{ secret('KESTRA_USERNAME') }}"
            password: "{{ secret('KESTRA_PASSWORD') }}"

      - id: check_deployed
        type: io.kestra.plugin.core.execution.Assert
        conditions:
          - "{{ (fromJson(outputs.deployed.body)).source | trim == inputs.candidate_source | trim }}"
        errorMessage: "The live source of {{ (fromJson(outputs.validate_candidate.body) | first).flow }} does not match the candidate after the deploy. Another change may have landed at the same time."

      - id: summary
        type: io.kestra.plugin.core.log.Log
        message: "Deployed {{ inputs.shared_namespace }}.{{ (fromJson(outputs.validate_candidate.body) | first).flow }} revision {{ (fromJson(outputs.deployed.body)).revision }} ({{ outputs.verdict.values.broken_sites }} breaking call sites approved)."

outputs:
  - id: decision
    type: STRING
    value: "{{ outputs.verdict.values.decision ?? 'NOT_EVALUATED' }}"
  - id: findings
    type: JSON
    value: "{{ outputs.analysis.values.findings ?? '[]' }}"

triggers:
  - id: nightly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"

extend:
  title: Gate Kestra Subflow Changes Against Every Caller Before Deploying
  metaTitle: Kestra Subflow Interface Change Gate with Caller Checks | Kestra
  shortDescription: Check a new version of a shared subflow against every flow that calls it, block changes that would make callers fail, and deploy safe ones. A nightly audit finds call sites that are already broken.
  metaDescription: Block Kestra subflow changes that break callers via missing inputs, removed outputs or deleted flows. Deploy safe changes and audit call sites nightly.
  description: |
    Kestra saves a subflow that adds a required input, drops an output, or is disabled or deleted while other flows still call it. The callers then fail at run time. This flow checks every call site first.

    ## How it works
    1. With `candidate_source`, Kestra's own validator checks the candidate. It must be one valid flow of `shared_namespace`, and never this gate.
    2. The Kestra plugin lists the flows in `shared_namespace`, and one bounded API search returns every flow under `caller_namespace_prefix`. Above `max_flows` the run fails rather than skip callers.
    3. A jq check walks every `Subflow` task, including those nested in `Parallel`, `If` or `errors`. It flags a required input that is not passed, a read output the subflow no longer returns, and a disabled or missing subflow. It also warns about ignored inputs, input type changes and calls built from expressions.
    4. A `Switch` acts on the result. A breaking candidate fails the run, or with `allow_breaking` waits 8 hours for approval. A safe candidate is deployed when `dry_run` is false and its source is read back to confirm. An identical candidate is a no-op.
    5. The nightly schedule runs the same check on the live flows and fails if any call site is broken.

    ## What you get
    - The caller, task and reason for each problem, and the `decision` and `findings` outputs for CI.
    - No deploy until callers are fixed or someone approves the break.
    - Repeated runs with the same candidate never create a new revision.

    ## Who it's for
    Platform teams that maintain shared subflows other teams call.

    ## Why orchestrate this with Kestra
    It reads the live flow definitions through the Kestra API, and gets approval, retries, concurrency limits and history for free.

    ## Prerequisites
    - Kestra 2.x with API access to read flows and to create or update flows in `shared_namespace`.
    - The [Kestra plugin](https://kestra.io/plugins/plugin-kestra).

    ### Secrets
    - `KESTRA_USERNAME`: user for basic auth against the Kestra API (required).
    - `KESTRA_PASSWORD`: password of that user (required).

    ## Quick start
    1. Add the two secrets and set `kestra_url`, `shared_namespace` and `caller_namespace_prefix`.
    2. Run it once without a candidate to audit today's call sites.
    3. From CI, pass the changed file as `candidate_source`, for example with `curl -F candidate_source=<flows/my-subflow.yaml`. Keep `dry_run` true for pull requests and set it to false on merge.
    4. Enable the `nightly_audit` schedule.

    ## How to extend
    - Send a Slack or email alert from the failing case, or open an issue per broken caller.
    - Treat input type changes as breaking for stricter teams.

    Limitations: calls whose namespace or flowId is an expression are listed for review, not checked. Output reads are matched in the `outputs.<task>.outputs.<name>` form. The `subflow()` Pebble function is not covered.

    ## Links
    - [Subflow task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.Subflow)
    - [Kestra flows.List task](https://kestra.io/plugins/plugin-kestra/flows/io.kestra.plugin.kestra.flows.list)
    - [Flow inputs](https://kestra.io/docs/workflow-components/inputs) and [outputs](https://kestra.io/docs/workflow-components/outputs)
    - [Pause task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.Pause)
    - [Kestra API reference](https://kestra.io/docs/api-reference/open-source)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false
