id: open-meteo-marine-oceanographic-lakehouse-loader
namespace: company.analytics
description: Ingests oceanographic wave heights, swell periods, and wave directions from Open-Meteo Marine API into Parquet lakehouse storage via DuckDB, tracking maritime swell alerts in Kestra KV store.

inputs:
  - id: latitude
    type: FLOAT
    description: Marine maritime coastal observation latitude.
    defaults: 34.0522

  - id: longitude
    type: FLOAT
    description: Marine maritime coastal observation longitude.
    defaults: -118.2437

  - id: station_label
    type: STRING
    description: Human-readable identifier for coastal monitoring sector.
    defaults: "Southern California Marine Sector"

  - id: rough_sea_wave_height_meters
    type: FLOAT
    description: Wave height threshold in meters to flag severe rough sea conditions.
    defaults: 2.5

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking previous peak significant wave heights.
    defaults: openmeteo_marine_monitored_wave_state

variables:
  default_state: "0.0"

triggers:
  - id: daily_marine_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_marine
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            prior_peak = float(json.loads(raw_state)) if raw_state else 0.0
        except Exception:
            prior_peak = 0.0

        lat = float("{{ inputs.latitude }}")
        lon = float("{{ inputs.longitude }}")
        label = "{{ inputs.station_label }}"
        rough_threshold = float("{{ inputs.rough_sea_wave_height_meters }}")

        url = f"https://marine-api.open-meteo.com/v1/marine?latitude={lat}&longitude={lon}&hourly=wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_period"
        headers = {"User-Agent": "KestraMarineLakehouse/1.0 (oceanography-ops@kestra.io)"}

        records = []
        rough_sea_intervals = []
        observed_peak = 0.0

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                hourly = data.get("hourly", {})
                times = hourly.get("time", [])
                wave_heights = hourly.get("wave_height", [])
                wave_dirs = hourly.get("wave_direction", [])
                wave_periods = hourly.get("wave_period", [])
                swell_heights = hourly.get("swell_wave_height", [])
                swell_periods = hourly.get("swell_wave_period", [])

                for i in range(len(times)):
                    t_str = times[i]
                    wh = float(wave_heights[i]) if i < len(wave_heights) and wave_heights[i] is not None else 0.0
                    wd = float(wave_dirs[i]) if i < len(wave_dirs) and wave_dirs[i] is not None else 0.0
                    wp = float(wave_periods[i]) if i < len(wave_periods) and wave_periods[i] is not None else 0.0
                    sh = float(swell_heights[i]) if i < len(swell_heights) and swell_heights[i] is not None else 0.0
                    sp = float(swell_periods[i]) if i < len(swell_periods) and swell_periods[i] is not None else 0.0

                    if wh > observed_peak:
                        observed_peak = wh

                    is_rough = wh >= rough_threshold

                    records.append({
                        "sector_label": label,
                        "latitude": lat,
                        "longitude": lon,
                        "forecast_time": t_str,
                        "wave_height_m": wh,
                        "wave_direction_deg": wd,
                        "wave_period_s": wp,
                        "swell_height_m": sh,
                        "swell_period_s": sp,
                        "is_rough_sea": is_rough,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_rough:
                        rough_sea_intervals.append({"time": t_str, "height_m": wh})
        except Exception as e:
            print(f"Error fetching Open-Meteo Marine forecast: {e}")

        with open("marine_forecast.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE marine_oceanography AS SELECT * FROM read_json_auto('marine_forecast.json')")
            con.execute("COPY marine_oceanography TO 'marine_oceanography_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY marine_oceanography TO 'marine_oceanography_archive.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE marine_oceanography (
                    sector_label VARCHAR,
                    latitude DOUBLE,
                    longitude DOUBLE,
                    forecast_time VARCHAR,
                    wave_height_m DOUBLE,
                    wave_direction_deg DOUBLE,
                    wave_period_s DOUBLE,
                    swell_height_m DOUBLE,
                    swell_period_s DOUBLE,
                    is_rough_sea BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY marine_oceanography TO 'marine_oceanography_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY marine_oceanography TO 'marine_oceanography_archive.csv' (HEADER, DELIMITER ',')")

        summary = {
            "forecast_intervals_count": len(records),
            "peak_wave_height_m": observed_peak,
            "rough_sea_intervals_count": len(rough_sea_intervals),
            "rough_sea_intervals": rough_sea_intervals[:5],
            "updated_state": observed_peak
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - marine_oceanography_archive.parquet
      - marine_oceanography_archive.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_marine.vars.updated_state | toJson }}"

  - id: check_rough_sea
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_marine.vars.rough_sea_intervals_count > 0 }}"
    then:
      - id: notify_rough_sea
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "🌊 Rough Sea Advisory: {{ outputs.ingest_and_transform_marine.vars.rough_sea_intervals_count }} forecast hours exceed {{ inputs.rough_sea_wave_height_meters }}m wave height threshold (peak {{ outputs.ingest_and_transform_marine.vars.peak_wave_height_m }}m)."

outputs:
  - id: peak_wave_height
    type: FLOAT
    value: "{{ outputs.ingest_and_transform_marine.vars.peak_wave_height_m }}"
  - id: rough_sea_count
    type: INT
    value: "{{ outputs.ingest_and_transform_marine.vars.rough_sea_intervals_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_marine.outputFiles['marine_oceanography_archive.parquet'] }}"

extend:
  title: Open-Meteo Marine Oceanographic Swell Lakehouse Loader with DuckDB
  metaTitle: Open-Meteo Marine Oceanographic Lakehouse Loader | Kestra
  shortDescription: Ingests oceanographic wave heights, swell periods, and wave directions from Open-Meteo Marine API into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Open-Meteo Marine API for coastal wave forecasts, convert oceanographic swell models into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, oceanographic harmonization, and analytical persistence of marine wave heights,
    swell directions, swell wave periods, and coastal maritime sea conditions from Open-Meteo Marine into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`openmeteo_marine_monitored_wave_state`) for previous peak wave height benchmarks.
    2. **Marine API Extraction**: Queries the official Open-Meteo Marine REST API (`marine-api.open-meteo.com/v1/marine`) across maritime coordinates.
    3. **DuckDB Oceanographic Normalization**: Unpacks hourly significant wave heights, swell periods, and directions into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized oceanographic records into columnar Parquet and CSV files for maritime logistics, offshore wind engineering, and harbor risk modeling.
    5. **Rough Sea Detection & State Commitment**: Detects hazardous sea condition intervals, issues safety advisories, and commits peak wave heights to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of global marine and oceanographic forecast models.
    - Columnar Parquet datasets queryable with DuckDB, GIS toolchains, Snowflake, or ClickHouse.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Offshore Energy and Wind Farm Operations Engineers monitoring structural wave loads.
    - Maritime Shipping Logistics Coordinators planning coastal passage routes.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical oceanographic states across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `marine-api.open-meteo.com`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting harbor masters on rough sea advisories.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Configure coastal `latitude` and `longitude`.
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `daily_marine_sync` schedule for automated daily updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition daily marine forecast runs.
    - Connect a maritime ship tracking (AIS) step in DuckDB to correlate route delays with wave heights.

    ## Links

    - [Open-Meteo Marine API Documentation](https://open-meteo.com/en/docs/marine-weather-api)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
