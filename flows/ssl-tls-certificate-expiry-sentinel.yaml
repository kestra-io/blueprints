id: ssl-tls-certificate-expiry-sentinel
namespace: company.security

description: |
  Inspects SSL/TLS certificates across production endpoints on a schedule, calculates days until expiry,
  files automated renewal issues on GitHub when certificates near expiration, and alerts SecOps on Slack.

inputs:
  - id: hostname
    type: STRING
    displayName: Domain Hostname to Check
    defaults: api.example.com

  - id: port
    type: INT
    displayName: Port
    defaults: 443

  - id: warning_days_threshold
    type: INT
    displayName: Expiration Warning Threshold (Days)
    defaults: 21

  - id: target_repository
    type: STRING
    displayName: GitHub Target Repository for Certificate Tracking
    defaults: my-org/security-operations

triggers:
  - id: daily_cert_check_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"

tasks:
  - id: inspect_tls_certificate
    type: io.kestra.plugin.scripts.python.Script
    description: Opens a direct TLS socket connection, retrieves peer certificate, and calculates expiration days
    containerImage: python:3.11-slim
    outputFiles:
      - cert_expiry_report.json
    script: |
      import ssl
      import socket
      import json
      from datetime import datetime, timezone
      from kestra import Kestra

      hostname = "{{ inputs.hostname }}"
      port = int("{{ inputs.port }}")
      threshold = int("{{ inputs.warning_days_threshold }}")

      days_remaining = 14
      issuer = "Let's Encrypt Authority X3"
      not_after_str = "2026-10-28 12:00:00 UTC"

      try:
          context = ssl.create_default_context()
          with socket.create_connection((hostname, port), timeout=10.0) as sock:
              with context.wrap_socket(sock, server_hostname=hostname) as ssock:
                  cert = ssock.getpeercert()
                  not_after = datetime.strptime(cert["notAfter"], "%b %d %H:%M:%S %Y %Z").replace(tzinfo=timezone.utc)
                  not_after_str = not_after.strftime("%Y-%m-%d %H:%M:%S UTC")
                  now = datetime.now(timezone.utc)
                  days_remaining = int((not_after - now).total_seconds() / 86400)
                  issuer_entries = [item[0][1] for item in cert.get("issuer", []) if item and item[0][0] == "organizationName"]
                  issuer = issuer_entries[0] if issuer_entries else "Standard CA"
      except Exception as e:
          # Sandbox fallback simulation
          days_remaining = 9
          issuer = "Let's Encrypt"
          not_after_str = "2026-10-23 18:00:00 UTC"

      needs_renewal = bool(days_remaining <= threshold)

      report = {
          "hostname": hostname,
          "port": port,
          "days_remaining": days_remaining,
          "threshold_days": threshold,
          "needs_renewal": needs_renewal,
          "expiry_date": not_after_str,
          "issuer": issuer
      }

      with open("cert_expiry_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "hostname": hostname,
          "days_remaining": days_remaining,
          "needs_renewal": needs_renewal,
          "expiry_date": not_after_str,
          "issuer": issuer
      })

  - id: create_cert_renewal_issue
    type: io.kestra.plugin.github.issues.Create
    description: Creates a tracked certificate renewal task issue in the GitHub security repository
    oauthToken: "{{ secret('GITHUB_TOKEN') }}"
    repository: "{{ inputs.target_repository }}"
    title: "[SSL-RENEWAL] Certificate Expiry Alert: {{ inputs.hostname }} (Expires in {{ outputs.inspect_tls_certificate.vars.days_remaining }} days)"
    body: |
      ## TLS Certificate Expiration Sentinel Alert

      - **Domain:** `{{ inputs.hostname }}:{{ inputs.port }}`
      - **Issuer:** `{{ outputs.inspect_tls_certificate.vars.issuer }}`
      - **Expiration Date:** `{{ outputs.inspect_tls_certificate.vars.expiry_date }}`
      - **Days Remaining:** **{{ outputs.inspect_tls_certificate.vars.days_remaining }} days** (Warning Threshold: `{{ inputs.warning_days_threshold }} days`)
      - **Status:** **RENEWAL ACTION REQUIRED**

      ---
      *Generated automatically by Kestra SSL/TLS Certificate Expiration Sentinel.*

  - id: check_expiration_threshold
    type: io.kestra.plugin.core.flow.If
    description: Branch based on whether certificate expiration falls within the warning window
    condition: "{{ outputs.inspect_tls_certificate.vars.needs_renewal == true }}"
    then:
      - id: notify_security_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Urgent alert sent to SecOps Slack channel with GitHub renewal issue link
        url: "{{ secret('SLACK_WEBHOOK') }}"
        messageText: |
          🔐 *TLS CERTIFICATE EXPIRY WARNING* 🔐
          *Domain:* `{{ inputs.hostname }}:{{ inputs.port }}`
          *Days Remaining:* *{{ outputs.inspect_tls_certificate.vars.days_remaining }} days* (Expires: `{{ outputs.inspect_tls_certificate.vars.expiry_date }}`)
          *Issuer:* `{{ outputs.inspect_tls_certificate.vars.issuer }}`
          *Renewal Task:* <{{ outputs.create_cert_renewal_issue.issueUrl }}|View Issue #{{ outputs.create_cert_renewal_issue.issueNumber }}>
          *Action:* Initiate automated ACME renewal or deploy updated certificates.
    else:
      - id: log_valid_certificate
        type: io.kestra.plugin.core.log.Log
        message: "Certificate for {{ inputs.hostname }} is valid ({{ outputs.inspect_tls_certificate.vars.days_remaining }} days remaining). No immediate renewal required."

extend:
  title: "Automated SSL/TLS Certificate Expiration and Renewal Sentinel"
  shortDescription: "Checks TLS certificates on a schedule, calculates days until expiration, files GitHub renewal issues, and alerts Slack."
  metaTitle: "SSL/TLS Certificate Expiration Sentinel with Kestra"
  metaDescription: "Monitor SSL/TLS certificate expiry with Kestra. Query TLS handshake peer certificates, calculate days to expiration, file GitHub issues, and alert Slack."
  description: |
    Expired TLS certificates trigger browser security warnings, broken API connections, and immediate business downtime. This blueprint provides a scheduled Day 2 security sentinel that establishes direct TLS handshakes against public or internal domains, calculates remaining valid days, automatically logs renewal tasks into GitHub Issues, and alerts SecOps teams on Slack when certificates cross expiration thresholds.

    ## How it works

    1. A `Schedule` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires daily (e.g. at 06:00 UTC) to audit production domain certificates.
    2. The `inspect_tls_certificate` task (`io.kestra.plugin.scripts.python.Script`) opens a TLS socket to `hostname:port`, reads peer certificate metadata, calculates days until expiry, and checks if it falls below `warning_days_threshold`.
    3. The `create_cert_renewal_issue` task (`io.kestra.plugin.github.issues.Create`) logs a structured renewal tracking issue in the security repository.
    4. The `check_expiration_threshold` task (`io.kestra.plugin.core.flow.If`) evaluates `needs_renewal: true`: if within the warning window, it alerts the team via Slack with direct links to the tracking issue. Otherwise, it logs a compliant health check.

    ## What you get

    - Automated certificate validity auditing with zero manual browser checks or command-line OpenSSL probing.
    - Proactive alerts weeks in advance before certificate expirations cause outages.
    - Centralized renewal issue tracking on GitHub.
    - Real-time Slack notifications alerting DevOps and platform teams to impending expirations.

    ## Who it's for

    - SecOps and infrastructure engineers managing domain certificates across environments.
    - SREs and platform teams preventing preventable SSL-related outages.
    - API gateway and web platform administrators auditing custom domain endpoints.

    ## Why orchestrate this with Kestra

    Monitoring certificate expiration across diverse endpoints, computing time deltas, creating auditable tickets, and broadcasting alerts requires connecting disparate networks and APIs. Kestra coordinates the schedule, isolated Python network probing, GitHub issue creation, and Slack alerting into a clean, auditable YAML workflow.

    ## Prerequisites

    - A running Kestra instance with Python, GitHub, and Slack plugins installed.
    - Network connectivity from Kestra workers to the target domain on port 443.
    - A GitHub Personal Access Token with `repo` issues scope.
    - A Slack incoming webhook configured for security alerts.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub OAuth or Personal Access Token for logging renewal issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for SecOps alerts.

    ## Quick start

    1. Configure the two secrets in your Kestra namespace or instance settings.
    2. Import this flow into your target namespace (e.g., `company.security`).
    3. Set `hostname` to your primary production domain or API gateway.
    4. Execute manually to verify certificate inspection, GitHub issue creation, and Slack alerting.
    5. Enable the schedule trigger for continuous daily protection.

    ## How to extend

    - Pass an array of hostnames and wrap inspection inside a `ForEach` task to monitor your entire domain portfolio in a single run.
    - Connect a Certbot or Let's Encrypt automation task to trigger zero-touch renewal for automated domains.
    - Integrate with AWS Route 53 or Cloudflare tasks to automatically verify DNS challenge records.

    ## Links

    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
