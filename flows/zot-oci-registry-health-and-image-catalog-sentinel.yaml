id: zot-oci-registry-health-and-image-catalog-sentinel
namespace: company.platform

description: "Continuously audits Zot OCI container image registry availability, monitors image repository catalog growth, alerts via Slack, and prevents unmanaged container storage bloat."

inputs:
  - id: zot_host
    type: STRING
    defaults: "localhost"
    description: "Hostname or IP address of the Zot OCI registry instance."

  - id: zot_port
    type: INT
    defaults: 5000
    description: "HTTP port for the Zot registry REST API and OCI distribution endpoint (default: 5000)."

  - id: max_repository_count
    type: INT
    defaults: 50
    description: "Threshold limit for total registered image repositories before flagging a catalog capacity breach (default: 50)."

  - id: dry_run
    type: BOOL
    defaults: true
    description: "Safety gate: when true, audits registry health and emits alerts without triggering automated retention or tag prunes."

  - id: slack_channel
    type: STRING
    defaults: "#devops-alerts"
    description: "Target Slack channel for Zot registry outages and catalog quota warnings."

triggers:
  - id: periodic_zot_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_registry_v2_endpoint
    type: io.kestra.plugin.core.http.Request
    description: "Polls standard OCI /v2/ ping endpoint to verify Zot distribution daemon responsiveness and protocol compliance."
    uri: "http://{{ inputs.zot_host }}:{{ inputs.zot_port }}/v2/"
    method: GET
    options:
      timeout:
        readIdleTimeout: PT15S

  - id: probe_catalog_repositories
    type: io.kestra.plugin.core.http.Request
    description: "Queries /v2/_catalog to retrieve the inventory of container image repositories hosted on the registry."
    uri: "http://{{ inputs.zot_host }}:{{ inputs.zot_port }}/v2/_catalog"
    method: GET
    options:
      timeout:
        readIdleTimeout: PT15S

  - id: classify_registry_status
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates OCI API response codes and repository counts to classify registry state into REGISTRY_UNAVAILABLE, CATALOG_QUOTA_EXCEEDED, or HEALTHY."
    value: >-
      {% if outputs.probe_registry_v2_endpoint.code != 200 %}
      REGISTRY_UNAVAILABLE
      {% elif (fromJson(outputs.probe_catalog_repositories.body).repositories ?? []) | length > inputs.max_repository_count %}
      CATALOG_QUOTA_EXCEEDED
      {% else %}
      HEALTHY
      {% endif %}
    cases:
      REGISTRY_UNAVAILABLE:
        - id: alert_registry_unavailable_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches high-priority Slack incident alert when Zot registry is unresponsive or returning non-200 HTTP codes."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":rotating_light: *Zot OCI Registry Degraded: Distribution Endpoint Unresponsive*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Zot OCI Registry Distribution Outage*\n*Registry:* `http://{{ inputs.zot_host }}:{{ inputs.zot_port }}/v2/`\n*HTTP Code:* `{{ outputs.probe_registry_v2_endpoint.code }}`\n*Impact:* Container image pushes and `docker pull` operations are failing across CI/CD runners and Kubernetes nodes."
                  }
                }
              ]
            }

      CATALOG_QUOTA_EXCEEDED:
        - id: alert_catalog_quota_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches capacity alert when total hosted repositories breach the defined threshold limit."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":warning: *Zot OCI Registry Capacity Warning: Repository Quota Exceeded*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Zot Registry Repository Catalog Quota Exceeded*\n*Registry:* `http://{{ inputs.zot_host }}:{{ inputs.zot_port }}`\n*Total Repositories:* `{{ (fromJson(outputs.probe_catalog_repositories.body).repositories ?? []) | length }}`\n*Max Quota:* `{{ inputs.max_repository_count }}`\n*Action:* Audit ephemeral CI image repositories or activate garbage collection."
                  }
                }
              ]
            }

        - id: check_catalog_prune_guard
          type: io.kestra.plugin.core.flow.If
          description: "Safety check ensuring automated catalog diagnostic and cleanup routines only proceed when dry-run is disabled."
          condition: "{{ inputs.dry_run == true }}"
          then:
            - id: log_dry_run_prune_audit
              type: io.kestra.plugin.core.log.Log
              message: "Dry-run active: catalog quota breach logged without mutating image manifests or deleting repositories."
          else:
            - id: log_remediation_intent
              type: io.kestra.plugin.core.log.Log
              message: "Live mode: catalog quota breached for Zot registry on {{ inputs.zot_host }}. Ready for automated garbage collection."

      HEALTHY:
        - id: log_healthy_state
          type: io.kestra.plugin.core.log.Log
          description: "Logs nominal status when OCI distribution endpoint is responsive and repository count remains within quota."
          message: "Zot OCI registry is healthy on {{ inputs.zot_host }}:{{ inputs.zot_port }}. Evaluated {{ (fromJson(outputs.probe_catalog_repositories.body).repositories ?? []) | length }} repositories within quota."

  - id: log_registry_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Emits immutable audit record documenting evaluated repository counts, HTTP status, and workflow lineage."
    message: "Zot OCI registry audit complete for http://{{ inputs.zot_host }}:{{ inputs.zot_port }}. Status: {{ outputs.classify_registry_status.value | trim }} | Total Repos: {{ (fromJson(outputs.probe_catalog_repositories.body).repositories ?? []) | length }} | Execution: {{ execution.id }}"

errors:
  - id: alert_zot_network_outage
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatches emergency Slack notification if the Zot registry container is offline, network-partitioned, or unreachable."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": ":fire: *Zot OCI Registry Network Failure*",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": ":fire: *Zot OCI Registry Network Failure*\nFailed to connect to Zot registry daemon at `http://{{ inputs.zot_host }}:{{ inputs.zot_port }}`. The container may have crashed, storage volume detached, or network routes disconnected."
            }
          }
        ]
      }

extend:
  title: Zot OCI Registry Health & Image Catalog Sentinel
  metaTitle: Zot OCI Registry Health & Catalog Sentinel | Kestra
  shortDescription: Continuously audit Zot OCI container image registry availability, track repository catalog depth, and alert on storage quota breaches.
  metaDescription: Audit Zot OCI container image registry health, track repository catalog depth, and alert via Slack to prevent Docker and Kubernetes image pull failures.
  description: |
    Zot is a production-grade, vendor-neutral OCI (Open Container Initiative) image registry written in Go by the Linux Foundation and Cisco as a fast, secure, and lightweight alternative to Harbor or Docker Distribution. Designed for edge computing, Kubernetes clusters, and enterprise CI/CD environments, Zot provides full support for OCI distribution specs, Helm charts, and multi-architecture container artifacts. In busy CI/CD pipelines, automated build agents push hundreds of transient container tags and ephemeral test images weekly. If the registry distribution endpoint degrades or unmanaged repositories exhaust underlying volume storage, Docker daemon pushes stall and Kubernetes pods fail into `ImagePullBackOff` loops. This blueprint deploys an automated sentinel that verifies Zot daemon responsiveness, audits repository catalog growth against enterprise quotas, routes Slack alerts, and enforces safe operational safeguards.

    ## How it works

    1. `periodic_zot_audit` (`io.kestra.plugin.core.trigger.Schedule`) initiates scheduled monitoring every 15 minutes. Shipped disabled so initial connectivity can be verified manually.
    2. `probe_registry_v2_endpoint` (`io.kestra.plugin.core.http.Request`) invokes `GET /v2/` to ensure the core OCI distribution specification API is functional and responsive.
    3. `probe_catalog_repositories` (`io.kestra.plugin.core.http.Request`) invokes `GET /v2/_catalog` to inspect all hosted container image repositories.
    4. `classify_registry_status` (`io.kestra.plugin.core.flow.Switch`) analyzes probe results:
       - `REGISTRY_UNAVAILABLE`: Fires if `/v2/` returns a non-200 code or network error, triggering an immediate incident notification via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
       - `CATALOG_QUOTA_EXCEEDED`: Fires when total hosted repositories exceed `max_repository_count`, warning the DevOps channel and evaluating safe cleanup logging.
       - `HEALTHY`: Confirms that the OCI registry is fully responsive and operating with healthy storage headroom.
    5. `log_registry_audit_summary` (`io.kestra.plugin.core.log.Log`) writes an immutable record of catalog depth and execution lineage.
    6. Global `errors` handler catches connection refusals or container crashes, firing an emergency alert to Slack.

    ## What you get

    - Automated surveillance of Zot OCI registry responsiveness and container repository catalog growth.
    - Proactive alerts on Slack before repository bloat exhausts storage volumes and halts deployment pipelines.
    - Safe dry-run guarding: default `dry_run: true` prevents inadvertent image deletions or mutations during audits.
    - Comprehensive audit trail in Kestra tracking registry health history and repository inventory over time.

    ## Who it's for

    - Platform Engineers and SREs maintaining internal container registries for edge nodes and Kubernetes clusters.
    - DevOps Teams operating continuous delivery pipelines pushing Docker and OCI images continuously.
    - Security and Infrastructure Teams auditing image repository inventories and container storage capacity.

    ## Why orchestrate this with Kestra

    Zot serves OCI API endpoints but does not feature native scheduled alerting, webhook routing, or conditional operational workflows. Using custom cron scripts introduces maintenance overhead, hard-coded secrets, and zero execution visibility. Kestra provides a declarative YAML workflow with native scheduling, credential masking, conditional branching, and full execution observability.

    ## Prerequisites

    - A running Zot OCI registry instance (version 1.4.0+) accessible over HTTP. Zot provides an official open-source Docker image (`ghcr.io/project-zot/zot-linux-amd64:latest`) requiring zero commercial licensing.
    - An incoming Slack webhook URL for operational notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for registry alerts and incident routing.

    ## Quick start

    1. Start a local Zot OCI container registry container:
       ```bash
       docker run -d --name zot-test -p 5000:5000 ghcr.io/project-zot/zot-linux-amd64:latest
       ```
    2. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    3. Import this blueprint into Kestra and run an execution with default inputs (`dry_run: true`).
    4. Confirm that `log_healthy_state` records a successful OCI ping and zero repository warnings.
    5. Test alerting by stopping the container (`docker stop zot-test`) and re-executing the flow to verify `alert_zot_network_outage`.
    6. Enable `periodic_zot_audit` to activate continuous 15-minute registry health monitoring.

    ## How to extend

    - Add automated image vulnerability scanning triggers using Trivy via `io.kestra.plugin.scripts.shell.Commands`.
    - Integrate with PagerDuty using `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for high-severity registry outages.
    - Add automated garbage collection tasks to purge untagged image blobs when storage thresholds are reached.

    ## Links

    - [Zot Official Documentation](https://zotregistry.dev/)
    - [Zot GitHub Repository](https://github.com/project-zot/zot)
    - [OCI Distribution Specification](https://github.com/opencontainers/distribution-spec)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  demo: false
