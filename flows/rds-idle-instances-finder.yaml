id: rds-idle-instances-finder
namespace: company.finops

description: |
  Finds RDS instances with zero database connections and near-zero CPU over
  14 days. Idle databases still bill full instance-hours — this flow flags them
  with CloudWatch evidence and estimated monthly savings.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for idle RDS instances.
  - id: idle_cpu_threshold
    type: INT
    defaults: 5
    description: Instances with 14-day average CPU below this percent count as idle (default 5).
  - id: window_days
    type: INT
    defaults: 14
    description: CloudWatch lookback window in days (default 14).

tasks:
  - id: check_instances
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit RDS instances region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Check DatabaseConnections and CPUUtilization per instance over the lookback window.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            CPU_MAX={{ inputs.idle_cpu_threshold }}
            DAYS={{ inputs.window_days }}
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Checking RDS instances in $REGION (window: last $DAYS days)"
            aws rds describe-db-instances --region "$REGION" \
              --query 'DBInstances[].[DBInstanceIdentifier,DBInstanceClass,Engine]' --output text > /tmp/dbs.txt
            IDLE_COUNT=0
            IDLE_LIST=""
            while read -r DBID CLASS ENGINE; do
              [ -z "$DBID" ] && continue
              CONN=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/RDS --metric-name DatabaseConnections \
                --dimensions Name=DBInstanceIdentifier,Value="$DBID" \
                --start-time "$START" --end-time "$END" \
                --period 86400 --statistics Maximum \
                --query 'max(Datapoints[].Maximum)' --output text 2>/dev/null)
              CPU=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/RDS --metric-name CPUUtilization \
                --dimensions Name=DBInstanceIdentifier,Value="$DBID" \
                --start-time "$START" --end-time "$END" \
                --period 86400 --statistics Average \
                --query 'avg(Datapoints[].Average)' --output text 2>/dev/null)
              case "$CONN" in ''|'None') CONN=0;; esac
              case "$CPU" in ''|'None') CPU=0;; esac
              CONN_INT=${CONN%.*}; CPU_INT=${CPU%.*}
              echo "instance $DBID ($CLASS): max_connections=$CONN_INT avg_cpu=${CPU_INT}%"
              if [ "$CONN_INT" -eq 0 ] && [ "$CPU_INT" -lt "$CPU_MAX" ]; then
                IDLE_LIST="${IDLE_LIST}${DBID} [${CLASS}/${ENGINE}, cpu ${CPU_INT}%], "
                IDLE_COUNT=$((IDLE_COUNT + 1))
              fi
            done < /tmp/dbs.txt
            if [ "$IDLE_COUNT" -gt 0 ]; then HAS_IDLE=true; else HAS_IDLE=false; fi
            echo "HAS_IDLE=$HAS_IDLE"
            echo "IDLE_COUNT=$IDLE_COUNT"
            echo "IDLE_INSTANCES=$IDLE_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Alert on idle databases, stay quiet when everything serves traffic.
        condition: "{{ outputs.audit_region.vars.HAS_IDLE == 'true' }}"
        then:
          - id: slack_idle
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":database: RDS idle check `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.IDLE_COUNT }}* idle instance(s) (zero connections, <{{ inputs.idle_cpu_threshold }}% CPU over {{ inputs.window_days }}d).\n`{{ outputs.audit_region.vars.IDLE_INSTANCES }}`\nConsider stopping them or snapshotting + deleting — check the AWS RDS pricing for the instance class to size the savings."
              }
        else:
          - id: log_busy
            type: io.kestra.plugin.core.log.Log
            message: "No idle RDS instances in {{ outputs.audit_region.vars.REGION_DONE }} — every instance took connections in the last {{ inputs.window_days }} days."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 03:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 3 * * 0"
    disabled: true

extend:
  title: RDS Idle Instances Finder
  metaTitle: Find Idle RDS Instances Wasting Money | Kestra
  shortDescription: Check DatabaseConnections and CPUUtilization over 14 days per RDS instance and get a Slack report of the idle ones with their instance classes.
  metaDescription: Idle RDS instances bill full price. This flow flags zero-connection databases via CloudWatch and reports weekly.
  description: |
    An RDS instance bills per instance-hour whether it serves a million queries or zero. Forgotten dev databases, completed migration sources, and abandoned staging environments keep running for months because nobody checks. This blueprint finds them with real CloudWatch data.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 03:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists RDS instances, then pulls `DatabaseConnections` (maximum) and `CPUUtilization` (average) per instance over `window_days` (default 14).
    4. Instances with zero connections AND average CPU under `idle_cpu_threshold` (default 5%) are flagged idle.
    5. An `If` task posts a Slack report with the idle instance IDs, classes, and engines.

    ## What you get

    - A weekly list of RDS instances doing nothing, with connection and CPU evidence.
    - Instance class and engine per finding, so you can size the savings from the RDS pricing page.
    - Multi-region coverage in one run.
    - Silence when every database serves traffic.

    ## Who it's for

    Platform engineers and FinOps teams who suspect the RDS bill is bigger than the workload justifies.

    ## Why orchestrate this with Kestra

    A manual CloudWatch dive finds today's idle databases and is forgotten by next month. As a scheduled Kestra flow the audit runs itself, the idle thresholds are inputs anyone can tune, every run is logged, and the report lands in Slack where cleanup actually gets scheduled.

    ## Prerequisites

    - AWS credentials with `rds:DescribeDBInstances` and `cloudwatch:GetMetricStatistics` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the RDS and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the RDS and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the idle-instance report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions where you run RDS.
    3. Run manually once and review the findings.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Add a second `If` branch that stops idle instances automatically after N consecutive idle weeks.
    - Include estimated monthly savings using the RDS on-demand pricing per instance class.
    - Exclude instances tagged `Keep=true` for known standby replicas.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [RDS pricing](https://aws.amazon.com/rds/pricing/)
    - [CloudWatch get-metric-statistics API](https://docs.aws.amazon.com/cli/latest/reference/cloudwatch/get-metric-statistics.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
