id: netlify-production-failure-rollback-approval
namespace: company.platform

inputs:
  - id: site_id
    type: STRING
    displayName: Netlify Site ID or Subdomain
    description: Unique site identifier (UUID) or subdomain (e.g. acme-web.netlify.app) of the Netlify project to monitor.
    defaults: my-netlify-site.netlify.app

  - id: target_deploy_id
    type: STRING
    displayName: Target Rollback Deploy ID
    description: Identifier (24-character hexadecimal ID) of the verified healthy build to restore if production is failing.
    defaults: 6512a4b8f9e0c123456789ab

  - id: slack_webhook_uri
    type: URI
    displayName: Slack Webhook URI
    description: Webhook endpoint used to alert operators and deliver the approval link.
    defaults: https://kestra.io/api/mock

tasks:
  - id: check_latest_production_deploy
    type: io.kestra.plugin.core.http.Request
    description: Query the Netlify Deploys API for the active production deployment status.
    uri: "https://api.netlify.com/api/v1/sites/{{ inputs.site_id }}/deploys?per_page=1"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('NETLIFY_AUTH_TOKEN') }}"

  - id: evaluate_deploy_health
    type: io.kestra.plugin.core.flow.If
    description: Check whether the latest deployment is in an error state.
    condition: "{{ (fromJson(outputs.check_latest_production_deploy.body)[0].state ?? '') == 'error' }}"
    then:
      - id: notify_operator_of_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch a Slack notification alerting engineers of production downtime and providing the approval link.
        url: "{{ inputs.slack_webhook_uri }}"
        messageText: |
          :rotating_light: *Netlify Production Deployment Failure Detected*
          *Site:* `{{ inputs.site_id }}`
          *Failed Deploy ID:* `{{ fromJson(outputs.check_latest_production_deploy.body)[0].id ?? 'unknown' }}`
          *Error Details:* `{{ fromJson(outputs.check_latest_production_deploy.body)[0].error_message ?? 'Build or publish failure' }}`
          *Target Rollback Candidate:* `{{ inputs.target_deploy_id }}`
          *Action Required:* Review the failure and authorize instant traffic rollback in Kestra UI:
          http://localhost:8080/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}

      - id: pause_for_rollback_approval
        type: io.kestra.plugin.core.flow.Pause
        description: Pause flow execution to require human sign-off before executing production rollback.
        onResume:
          - id: approved
            type: BOOL
            description: Set to true to approve immediate traffic rollback.
            defaults: true
          - id: approval_reason
            type: STRING
            description: Operational context or incident ticket number for the rollback decision.
            defaults: "Approved production rollback after build failure"

      - id: execute_rollback_if_approved
        type: io.kestra.plugin.core.flow.If
        description: Execute the rollback if the operator provided approval.
        condition: "{{ outputs.pause_for_rollback_approval.onResume.approved ?? false }}"
        then:
          - id: trigger_netlify_rollback
            type: io.kestra.plugin.core.http.Request
            description: Trigger Netlify Restore REST API to redirect production traffic to the designated healthy deploy.
            uri: "https://api.netlify.com/api/v1/sites/{{ inputs.site_id }}/deploys/{{ inputs.target_deploy_id }}/restore"
            method: POST
            headers:
              Authorization: "Bearer {{ secret('NETLIFY_AUTH_TOKEN') }}"

          - id: log_rollback_success
            type: io.kestra.plugin.core.log.Log
            message: "Production rollback triggered successfully for site {{ inputs.site_id }} to deploy {{ inputs.target_deploy_id }}."
        else:
          - id: log_rollback_cancelled
            type: io.kestra.plugin.core.log.Log
            message: "Rollback authorization rejected or bypassed by operator. Production remains unchanged."
    else:
      - id: log_deploy_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Active production deploy for site {{ inputs.site_id }} is healthy (state: {{ fromJson(outputs.check_latest_production_deploy.body)[0].state ?? 'ready' }})."

extend:
  title: Netlify Production Deployment Failure Check with Rollback Approval Gate
  metaTitle: Netlify Production Failure Check & Rollback Approval Gate on Kestra
  shortDescription: Inspect Netlify production deploys for errors, alert Slack with execution link, pause for human approval, and restore verified healthy deploy.
  metaDescription: Monitor Netlify production deployments for errors, trigger Slack incident alerts, pause for operator approval, and restore previous healthy deploy with Kestra.
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false
  description: |
    Automated continuous delivery to platforms like Netlify accelerates release velocity, but bad production deployments,
    runtime asset bundle errors, or build script regressions can instantly degrade customer-facing digital applications.
    While CI pipelines catch compilation bugs, post-merge publish failures or unexpected environment drift frequently break
    live traffic.

    This blueprint implements an intelligent deployment surveillance and emergency recovery workflow. It continuously
    inspects the Netlify Deploys API for production errors, alerts engineering teams via Slack with a direct navigation link
    to the Kestra execution modal, halts execution with a durable human-in-the-loop approval gate (`io.kestra.plugin.core.flow.Pause`),
    and executes an atomic rollback via Netlify's Restore endpoint (`POST /deploys/{id}/restore`) upon operator confirmation.

    ## How it works

    1. `check_latest_production_deploy` (`io.kestra.plugin.core.http.Request`) invokes Netlify's REST API (`GET /api/v1/sites/{site_id}/deploys`) to inspect the active production deployment state.
    2. `evaluate_deploy_health` (`io.kestra.plugin.core.flow.If`) inspects the response to verify whether `state` is `error`.
    3. `notify_operator_of_failure` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a Slack alert with incident metadata and a direct URL to the execution.
    4. `pause_for_rollback_approval` (`io.kestra.plugin.core.flow.Pause`) holds execution until an on-call engineer reviews the failure and confirms the rollback decision.
    5. `execute_rollback_if_approved` (`io.kestra.plugin.core.flow.If`) checks the approval status.
    6. `trigger_netlify_rollback` (`io.kestra.plugin.core.http.Request`) invokes Netlify's Restore API (`POST /api/v1/sites/{site_id}/deploys/{target_deploy_id}/restore`) to redirect production traffic to the designated healthy deployment.
    7. `log_rollback_success` or `log_rollback_cancelled` (`io.kestra.plugin.core.log.Log`) records the full audit trail.

    ## What you get

    - Zero-glue-code automated production deployment surveillance using native HTTP and flow plugins.
    - Human-in-the-loop approval gate preventing accidental or unintended production rollbacks.
    - Instant incident notification in Slack with direct navigation to the execution approval modal.
    - Full audit logging of who authorized the rollback and the rationale recorded in execution state.

    ## Who it's for

    - Platform Engineers and DevOps teams managing mission-critical Netlify web applications.
    - Site Reliability Engineers (SREs) establishing automated rollback guardrails with human sign-off.
    - Engineering Leads needing an auditable approval trail for production traffic diversions.

    ## Why orchestrate this with Kestra

    Building custom rollback scripts inside CI jobs or serverless functions often creates hidden failure modes, lacks
    native human-in-the-loop approval modals, and provides poor execution visibility. Kestra provides declarative flow
    control, built-in secret management, durable state pausing (`io.kestra.plugin.core.flow.Pause`), and unified execution
    tracking without managing custom webhook infrastructure.

    ## Prerequisites

    - A Netlify account with site administration permissions.
    - A configured Slack Incoming Webhook URL.

    ### Secrets

    - `NETLIFY_AUTH_TOKEN`: Netlify Personal Access Token with site read and deploy restore permissions.

    ## Quick start

    1. Add `NETLIFY_AUTH_TOKEN` to your Kestra namespace secrets.
    2. Configure `site_id` to match your Netlify site ID or subdomain.
    3. Specify `target_deploy_id` with the ID of your last verified production build (`24-char hex ID`).
    4. Set `slack_webhook_uri` to your team's Slack incoming webhook URL.
    5. Trigger the flow manually or attach a schedule trigger (`io.kestra.plugin.core.trigger.Schedule`) for recurring surveillance.

    ## How to extend

    - **Automated target discovery**: Prepend an API call to dynamically query and select the most recent deployment in `ready` state.
    - **Incident management integration**: Pair Slack alerting with `io.kestra.plugin.pagerduty.Incident` to page on-call responders during high-severity outages.
    - **Multi-environment guard**: Parameterize the target environment to safeguard staging and preview branch deployments across diverse teams.

    ## Links

    - [Netlify Deploys REST API Documentation](https://docs.netlify.com/api/get-started/#deploys)
    - [Netlify Restore Deploy Endpoint Reference](https://open-api.netlify.com/#tag/deploy/operation/restoreSiteDeploy)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Pause Task Documentation](https://kestra.io/plugins/plugin-core/tasks/flow/io.kestra.plugin.core.flow.pause)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
