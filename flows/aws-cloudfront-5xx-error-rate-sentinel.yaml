id: aws-cloudfront-5xx-error-rate-sentinel
namespace: company.cloud

inputs:
  - id: distribution_id
    type: STRING
    description: Amazon CloudFront distribution ID.
  - id: error_rate_threshold_pct
    type: FLOAT
    defaults: 5.0
    description: Maximum acceptable percentage of 5XX error rate at edge locations.

tasks:
  - id: query_cloudfront_telemetry
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "us-east-1"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        START_TIME=$(date -u -v-15M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "15 minutes ago" +%Y-%m-%dT%H:%M:%SZ)
        END_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        
        aws cloudwatch get-metric-data           --metric-data-queries '[{"Id":"err5xx","MetricStat":{"Metric":{"Namespace":"AWS/CloudFront","MetricName":"5xxErrorRate","Dimensions":[{"Name":"DistributionId","Value":"{{ inputs.distribution_id }}"},{"Name":"Region","Value":"Global"}]},"Period":900,"Stat":"Average"}}]'           --start-time "$START_TIME"           --end-time "$END_TIME"           --output json > /tmp/cf_telemetry.json
        
        ERROR_RATE=$(jq '.MetricDataResults[0].Values[0] // 0' /tmp/cf_telemetry.json)
        
        echo "::set-output name=error_rate::$ERROR_RATE::"

  - id: evaluate_edge_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_cloudfront_telemetry.vars.error_rate | float > inputs.error_rate_threshold_pct }}"
    then:
      - id: notify_edge_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#edge-network-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 AWS CloudFront 5XX Edge Error Rate Spike Alert",
                "text": "CloudFront distribution `{{ inputs.distribution_id }}` recorded an average 5XX error rate of *{{ outputs.query_cloudfront_telemetry.vars.error_rate }}%*, exceeding threshold *{{ inputs.error_rate_threshold_pct }}%*. Impact: Global edge points of presence are serving HTTP 502/503/504 errors to visitors, indicating origin pool failure or misconfigured SSL handshakes.",
                "footer": "Kestra Edge Sentinel • AWS CloudFront"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#edge-network-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ CloudFront Sentinel Execution Failed",
            "text": "The CloudFront metric query workflow encountered an error. Please verify AWS credentials and distribution ID.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      distribution_id: replace-with-your-distribution-id

extend:
  metaDescription: "Audits Amazon CloudFront global metrics to detect edge 5XX error rate spikes and origin server reachability failures."
  metaTitle: AWS CloudFront Edge 5XX Error Rate and Origin Availability Sentinel with Kestra
  title: AWS CloudFront Edge 5XX Error Rate and Origin Availability Sentinel
  shortDescription: Audits Amazon CloudFront global metrics to detect edge 5XX error rate spikes and origin server reachability failures.
  description: |
    ## How it works
    This workflow connects to Amazon CloudWatch (us-east-1 global endpoint) via the AWS CLI plugin to monitor the `5xxErrorRate` metric for the target CloudFront distribution. When origin web servers, ALBs, or S3 origins crash, return gateway errors, or fail TLS handshakes, CloudFront propagates 5XX errors globally. When the error percentage exceeds the operational limit, an alert is sent to Slack with distribution details.

    ## What you get
    - Global visibility into CDN delivery health across worldwide edge locations.
    - Proactive alerts before global visitors experience site-wide outages.
    - Immediate differentiation between origin outages and regional network issues.

    ## Who it's for
    - CDN and Edge Infrastructure Engineers responsible for global content delivery and web availability.
    - SREs managing high-traffic web applications, e-commerce stores, and media streaming platforms.

    ## Why orchestrate this with Kestra
    - **Native CloudWatch Polling**: Direct AWS CLI integration with zero external agent overhead.
    - **Automated Origin Failover**: Can be extended to automatically update CloudFront origin group failover settings.
    - **Multi-Distribution Monitoring**: Easily parameterize and monitor all corporate CDN distributions.

    ## Prerequisites
    - AWS IAM credentials with `cloudwatch:GetMetricData` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Supply your CloudFront distribution ID and configure secrets.
    3. Run the workflow to verify edge distribution health.

    ## How to extend
    - Query `OriginLatency` alongside error rates to identify sluggish origins.
    - Automatically create CloudFront cache invalidations for updated assets.

    ## Links
    - [Amazon CloudFront Metrics in CloudWatch](https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/monitoring-using-cloudwatch.html)
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - Infrastructure Automation
  ee: false
  verified: false
  demo: false
