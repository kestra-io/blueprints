id: github-commit-signature-verification-gate
namespace: company.team

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: repository
    type: STRING
    displayName: GitHub Repository
    defaults: "kestra-io/kestra"
    description: GitHub repository in owner/repo format to audit for commit signatures.
    validator: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"

  - id: branch
    type: STRING
    displayName: Target Branch
    defaults: "main"
    description: Branch reference or commit SHA to inspect for recent changes.
    validator: "^[A-Za-z0-9_./-]+$"

  - id: lookback_hours
    type: INT
    displayName: Lookback Window (Hours)
    defaults: 6
    min: 1
    max: 168
    description: Time window in hours to audit commits back from execution time. Matches the 6-hour schedule interval.

  - id: max_commits
    type: INT
    displayName: Max Commits to Query
    defaults: 100
    min: 1
    max: 100
    description: Maximum number of commits to retrieve per API query (GitHub REST API page ceiling).

  - id: max_entries
    type: INT
    displayName: Max Entries in Slack Digest
    defaults: 15
    min: 1
    max: 50
    description: Maximum individual unverified commits displayed in the Slack message before truncating.

  - id: ignore_authors
    type: STRING
    displayName: Ignored Authors
    defaults: ""
    required: false
    description: Optional comma-separated list of GitHub logins or author names to exclude from signature gating.

  - id: slack_channel
    type: STRING
    displayName: Slack Alert Channel
    defaults: "#devops-alerts"
    description: Destination Slack channel receiving unverified commit digest notifications.

variables:
  since: "{{ now() | dateAdd(inputs.lookback_hours * -1, 'HOURS') | date(\"yyyy-MM-dd'T'HH:mm:ss'Z'\") }}"

triggers:
  - id: periodic_signature_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled 6-hour signature compliance sweep across recent commits. Shipped disabled by default.
    cron: "0 */6 * * *"
    disabled: true

tasks:
  - id: fetch_commits
    type: io.kestra.plugin.core.http.Request
    description: Fetch recent commits on the specified branch within the lookback window from the GitHub REST API.
    method: GET
    uri: "https://api.github.com/repos/{{ inputs.repository }}/commits?sha={{ inputs.branch }}&since={{ vars.since }}&per_page={{ inputs.max_commits }}"
    headers:
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "Kestra-Commit-Signature-Gate"
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT15S
      maxAttempts: 3

  - id: analyze_commits
    type: io.kestra.plugin.core.output.OutputValues
    description: Inspect commit verification status, filter out ignored authors, and compute summary metrics.
    values:
      total_checked: "{{ (outputs.fetch_commits.body ?? []) | length }}"
      is_truncated: "{{ ((outputs.fetch_commits.body ?? []) | length) >= inputs.max_commits }}"
      unverified_count: >-
        {{ ({'commits': (outputs.fetch_commits.body ?? []), 'ignore': inputs.ignore_authors} | jq('(.ignore | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $ig | [.commits[]? | (.author.login // .commit.author.name // "unknown") as $a | select((.commit.verification.verified != true) and (($ig | index($a)) == null))] | length') | first) }}
      reasons_summary: >-
        {{ ({'commits': (outputs.fetch_commits.body ?? []), 'ignore': inputs.ignore_authors} | jq('(.ignore | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $ig | [.commits[]? | (.author.login // .commit.author.name // "unknown") as $a | select((.commit.verification.verified != true) and (($ig | index($a)) == null))] | group_by(.commit.verification.reason // "unsigned") | map("\(length) \(.[0].commit.verification.reason // "unsigned")") | join(", ")') | first) }}
      slack_message: |-
        {{ ({'commits': (outputs.fetch_commits.body ?? []), 'ignore': inputs.ignore_authors, 'max_entries': inputs.max_entries, 'max_commits': inputs.max_commits, 'repo': inputs.repository, 'branch': inputs.branch, 'hours': inputs.lookback_hours, 'since': vars.since} | jq('(.ignore | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $ig | (.commits // []) as $all | .max_entries as $max_e | .max_commits as $max_c | .repo as $repo | .branch as $branch | .hours as $hours | .since as $since | ($all | map(. as $c | ($c.author.login // $c.commit.author.name // "unknown") as $author | select(($c.commit.verification.verified != true) and (($ig | index($author)) == null)) | {sha: ($c.sha[:7]), author: $author, reason: ($c.commit.verification.reason // "unsigned"), message: ($c.commit.message | split("\n")[0] | if length > 72 then .[:69] + "..." else . end | gsub("@channel"; "@ channel") | gsub("@here"; "@ here")), url: $c.html_url})) as $unv | ($unv | group_by(.reason) | map("\(length) \(.[0].reason)") | join(", ")) as $reasons | (["⚠️ *GitHub Commit Signature Verification Gate: Unverified Commits Detected*", "• *Repository:* `\($repo)`", "• *Branch:* `\($branch)`", "• *Window:* Last \($hours) hour(s) (since `\($since)`)", "• *Commits Audited:* \($all | length)", "• *Unverified Commits:* *\($unv | length)*", "• *Reasons Breakdown:* \($reasons)", (if ($all | length) >= $max_c then "⚠️ *Note:* The API returned \($max_c) commits (the query limit); additional commits in this time window may not have been audited." else empty end), "", "*Unverified Commits:*", ($unv[:$max_e][] | "• <\(.url)|`\(.sha)`> - *\(.reason)* by `\(.author)`: \(.message)"), (if ($unv | length) > $max_e then "• ... and \($unv | length - $max_e) more unverified commit(s)." else empty end)] | join("\n"))') | first) }}

  - id: evaluate_unverified_commits
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether unverified or unsigned commits were identified.
    condition: "{{ (outputs.analyze_commits.values.unverified_count | number) > 0 }}"
    then:
      - id: send_slack_digest
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch Slack digest detailing unverified commits, reasons, authors, and commit links.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: "{{ {'channel': inputs.slack_channel, 'text': outputs.analyze_commits.values.slack_message} | toJson }}"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT10S
          maxAttempts: 3

      - id: log_unverified_summary
        type: io.kestra.plugin.core.log.Log
        description: Log summary of unverified commits and reasons breakdown.
        message: |
          ⚠️ GitHub Commit Signature Verification Gate Alert
          • Repository: {{ inputs.repository }} (branch: {{ inputs.branch }})
          • Commits Audited: {{ outputs.analyze_commits.values.total_checked }}
          • Unverified Commits: {{ outputs.analyze_commits.values.unverified_count }}
          • Reasons Breakdown: {{ outputs.analyze_commits.values.reasons_summary }}
          {% if outputs.analyze_commits.values.is_truncated %}
          ⚠️ Note: The API returned {{ inputs.max_commits }} commits (the query limit); additional commits in this time window may not have been audited.
          {% endif %}
    else:
      - id: log_clean_verification
        type: io.kestra.plugin.core.log.Log
        description: Log clean audit status when all commits in the lookback window are verified.
        message: |
          ✅ GitHub Commit Signature Verification Gate Passed
          • Repository: {{ inputs.repository }} (branch: {{ inputs.branch }})
          • Commits Audited: {{ outputs.analyze_commits.values.total_checked }}
          • Window: Last {{ inputs.lookback_hours }} hour(s) (since {{ vars.since }})
          • Status: All audited commits have valid cryptographic signatures. No Slack notification required.
          {% if outputs.analyze_commits.values.is_truncated %}
          ⚠️ Note: The API returned {{ inputs.max_commits }} commits (the query limit); additional commits in this time window may not have been audited.
          {% endif %}

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack if the signature verification gate encounters unexpected API or network errors.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: "{{ {'channel': inputs.slack_channel, 'text': '❌ *GitHub Commit Signature Verification Gate Error*\nFlow `' ~ flow.id ~ '` execution `' ~ execution.id ~ '` failed unexpectedly while auditing repository `' ~ inputs.repository ~ '`. Check task execution logs for details.'} | toJson }}"

extend:
  title: Verify GitHub Commit Signatures and Alert on Unverified Commits
  metaTitle: Verify GitHub Commit Signatures & Alert on Unsigned Commits | Kestra
  shortDescription: Audit recent GitHub commits for cryptographic GPG and SSH signatures, aggregate verification reasons, and alert Slack on unsigned code.
  metaDescription: Audit GitHub branch commits for valid GPG/SSH signatures via REST API. Alert Slack on unsigned or unverified commits with reasons and direct commit links.
  tags:
    - Infrastructure
    - Core
  subTags:
    - GitOps & Flow Sync
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
  description: |
    Software supply chain security mandates that all source code changes committed to shared repository
    branches are cryptographically signed with trusted GPG, SSH, or S/MIME developer keys. When developers
    push unsigned commits or when local signing configurations lapse (expired subkeys, unverified committer
    emails, or unregistered public keys), unverified code enters the integration stream without attribution.
    This increases exposure to author spoofing, credential leaks, and compliance violations during security audits.

    This blueprint implements an automated compliance gate that periodically inspects recent GitHub commits
    on target branches through the GitHub REST API. It evaluates the cryptographic verification status of every
    commit, filters out allowed service or bot accounts, aggregates failure reasons, and dispatches an
    actionable digest to Slack only when unverified commits are discovered. Clean inspection runs log audit
    metrics and complete quietly without creating notification fatigue.

    ## How it works

    1. `periodic_signature_audit` (`io.kestra.plugin.core.trigger.Schedule`) triggers the audit on a 6-hour
       cron cadence (`0 */6 * * *`). The 6-hour lookback window matches the schedule interval so consecutive
       runs inspect continuous, non-overlapping windows of commit history.
    2. `fetch_commits` (`io.kestra.plugin.core.http.Request`) invokes the GitHub REST API endpoint
       `GET /repos/{owner}/{repo}/commits` with query parameters `sha`, `since`, and `per_page: 100`. It
       authenticates via `GITHUB_TOKEN` and applies an exponential retry policy for API rate limits and transient
       5xx errors. Any non-2xx response status fails the task immediately.
    3. `analyze_commits` (`io.kestra.plugin.core.output.OutputValues`) processes the commit payload using Pebble
       and jq expressions:
       - Parses the `commit.verification` object for each commit (`verified`, `reason`).
       - Excludes authors listed in `inputs.ignore_authors`.
       - Classifies commits where `verified` is not true.
       - Truncates commit messages to 72 characters, sanitizes newline characters, and neutralizes `@channel` and
         `@here` mention tags to protect alert channels.
       - Assembles an itemized Slack markdown digest capped at `inputs.max_entries` with an overflow count.
       - Detects if total commits reached `inputs.max_commits`, signaling that commit volume approached query limits.
    4. `evaluate_unverified_commits` (`io.kestra.plugin.core.flow.If`) evaluates `unverified_count > 0`:
       - When unverified commits exist, `send_slack_digest` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`)
         delivers the digest to Slack with clickable commit links and author attributions, followed by
         `log_unverified_summary`.
       - When all commits are cryptographically verified, `log_clean_verification` logs compliance metrics and
         no Slack alert is dispatched.
    5. The `errors` block catches unexpected failures (such as GitHub authentication errors or invalid repositories)
       and routes an operational alert to Slack.

    ## What you get

    - Automated cryptographic verification of developer commits without installing local Git CLI agents.
    - Identification of distinct GitHub verification failure reasons (`unsigned`, `unknown_key`, `expired_key`,
      `unverified_email`, `bad_email`, `malformed_signature`, `invalid`).
    - Commits authored through the GitHub web UI or verified GitHub Apps are recognized and validated automatically.
    - Direct mrkdwn hyperlinks to each offending commit for immediate peer review and developer remediation.
    - Built-in pagination warning when commit frequency in the lookback window reaches the maximum query ceiling.
    - Noise-free operation: alerts fire strictly when policy breaches occur.

    ## Who it's for

    - Platform Engineers and DevSecOps teams enforcing SLSA Level 2+ provenance and SOC 2 source integrity.
    - Security Architects monitoring repositories where branch protection rules allow unsigned commits or web edits.
    - Engineering Managers tracking cryptographic signature adoption across distributed squads.

    ## Why orchestrate this with Kestra

    While GitHub repository rulesets can block unsigned commits at push time, they provide no historical visibility,
    no aggregated digest reporting, and cannot be easily phased into active repositories where immediate push-blocking
    would disrupt ongoing sprints. Orchestrating this gate with Kestra provides an out-of-band audit sentinel that
    monitors commit hygiene, alerts teams without breaking build pipelines, tracks compliance over time in execution
    history, and adapts lookback windows declaratively in YAML.

    ## Prerequisites

    - Target GitHub repository (public or private).
    - Incoming Slack webhook endpoint for alert delivery.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub personal access token (classic or fine-grained) with `Contents: Read` permission
      for private repositories, or public access permissions for public repositories.
    - `SLACK_WEBHOOK_URL`: Incoming Slack webhook URL used to dispatch compliance digests and error notifications.

    ## Quick start

    1. Configure `GITHUB_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. Push an unsigned commit to a test repository branch (or leave default `kestra-io/kestra`).
    4. Click **Execute** in Kestra with your test repository and branch to observe the inspection.
    5. Verify execution logs: if unsigned commits exist, confirm delivery of the Slack digest card; if all commits
       are signed, confirm `log_clean_verification` completed silently.
    6. Enable the `periodic_signature_audit` trigger to activate continuous 6-hour automated sweeps.

    ## How to extend

    - Automated branch protection escalation: Trigger an automated subflow to enforce GitHub branch ruleset
      signing requirements when unverified commits persist across consecutive audit windows.
    - Multi-repository sweep: Enclose the flow within a `ForEach` loop over a repository inventory list to audit
      dozens of team repositories in parallel.
    - PagerDuty and Microsoft Teams bridges: Add parallel notification tasks to escalate critical signing lapses
      on protected production branches.

