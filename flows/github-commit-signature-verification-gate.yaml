id: github-commit-signature-verification-gate
namespace: company.team

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: repository
    type: STRING
    displayName: GitHub Repository
    defaults: "kestra-io/kestra"
    description: Manual-run fallback. GitHub repository in owner/repo format. Ignored when the pull_request webhook triggers the flow.
    validator: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"

  - id: pr_number
    type: INT
    displayName: Pull Request Number
    defaults: 1
    min: 1
    description: Manual-run fallback. Pull request to gate. Ignored when the pull_request webhook triggers the flow.

  - id: max_commits
    type: INT
    displayName: Max Commits to Check
    defaults: 100
    min: 1
    max: 100
    description: Commits fetched per API page (GitHub REST API ceiling is 100). Larger pull requests are only checked up to this count and a warning is logged.

  - id: max_entries
    type: INT
    displayName: Max Entries in Slack Message
    defaults: 15
    min: 1
    max: 50
    description: Maximum individual unverified commits listed in the optional Slack message before truncating.

  - id: ignore_authors
    type: STRING
    displayName: Ignored Authors
    defaults: ""
    required: false
    description: Optional comma-separated list of GitHub logins or author names to exclude from the gate.

  - id: slack_channel
    type: STRING
    displayName: Slack Alert Channel
    defaults: "#devops-alerts"
    description: Destination channel for the optional Slack notification.

triggers:
  - id: pull_request_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Receives the GitHub pull_request event. Only the opened, synchronize and reopened actions are gated, everything else is skipped.
    key: "{{ secret('GITHUB_PR_WEBHOOK_KEY') }}"

tasks:
  - id: gate_pull_request
    type: io.kestra.plugin.core.flow.If
    description: Run the gate for manual executions and for the pull_request actions opened, synchronize and reopened. Other actions and GitHub ping events are skipped.
    condition: "{{ (trigger.body ?? null) is null or ((trigger.body.pull_request ?? null) is not null and (trigger.body.action ?? '') in ['opened', 'synchronize', 'reopened']) }}"
    then:
      - id: fetch_pull
        type: io.kestra.plugin.core.http.Request
        description: Manual runs only. Read the pull request to find its head commit SHA.
        runIf: "{{ (trigger.body ?? null) is null }}"
        method: GET
        uri: "https://api.github.com/repos/{{ inputs.repository }}/pulls/{{ inputs.pr_number }}"
        headers:
          Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"
          User-Agent: "Kestra-Commit-Signature-Gate"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT15S
          maxAttempts: 3

      - id: resolve_target
        type: io.kestra.plugin.core.output.OutputValues
        description: Take repository, pull request number and head SHA from the webhook payload, falling back to the manual inputs.
        values:
          repository: "{{ trigger.body.pull_request.base.repo.full_name ?? inputs.repository }}"
          pr_number: "{{ trigger.body.pull_request.number ?? inputs.pr_number }}"
          head_sha: "{{ trigger.body.pull_request.head.sha ?? outputs.fetch_pull.body.head.sha }}"

      - id: validate_target
        type: io.kestra.plugin.core.flow.If
        description: Reject malformed repository, pull request number or head SHA values before they are used in an API path.
        condition: "{{ not (outputs.resolve_target.values.repository matches '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') or not (outputs.resolve_target.values.pr_number matches '^[0-9]+$') or not (outputs.resolve_target.values.head_sha matches '^[0-9a-f]{40}$') }}"
        then:
          - id: reject_target
            type: io.kestra.plugin.core.execution.Fail
            description: Stop before any API call because the target values are malformed.
            errorMessage: "Invalid target: repository '{{ outputs.resolve_target.values.repository }}', pull request '{{ outputs.resolve_target.values.pr_number }}', head SHA '{{ outputs.resolve_target.values.head_sha }}'."

      - id: fetch_commits
        type: io.kestra.plugin.core.http.Request
        description: List the commits of the pull request from the GitHub REST API. Each commit carries its commit.verification object.
        method: GET
        uri: "https://api.github.com/repos/{{ outputs.resolve_target.values.repository }}/pulls/{{ outputs.resolve_target.values.pr_number }}/commits?per_page={{ inputs.max_commits }}"
        headers:
          Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"
          User-Agent: "Kestra-Commit-Signature-Gate"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT15S
          maxAttempts: 3

      - id: analyze_commits
        type: io.kestra.plugin.core.output.OutputValues
        description: Inspect commit verification status, filter out ignored authors, and compute the summary and the report text.
        values:
          total_checked: "{{ (outputs.fetch_commits.body ?? []) | length }}"
          is_truncated: "{{ ((outputs.fetch_commits.body ?? []) | length) >= inputs.max_commits }}"
          unverified_count: >-
            {{ ({'commits': (outputs.fetch_commits.body ?? []), 'ignore': inputs.ignore_authors} | jq('(.ignore | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $ig | [.commits[]? | (.author.login // .commit.author.name // "unknown") as $a | select((.commit.verification.verified != true) and (($ig | index($a)) == null))] | length') | first) }}
          reasons_summary: >-
            {{ ({'commits': (outputs.fetch_commits.body ?? []), 'ignore': inputs.ignore_authors} | jq('(.ignore | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $ig | [.commits[]? | (.author.login // .commit.author.name // "unknown") as $a | select((.commit.verification.verified != true) and (($ig | index($a)) == null))] | group_by(.commit.verification.reason // "unsigned") | map("\(length) \(.[0].commit.verification.reason // "unsigned")") | join(", ")') | first) }}
          report: |-
            {{ ({'commits': (outputs.fetch_commits.body ?? []), 'ignore': inputs.ignore_authors, 'max_entries': inputs.max_entries, 'max_commits': inputs.max_commits, 'repo': outputs.resolve_target.values.repository, 'pr': outputs.resolve_target.values.pr_number} | jq('(.ignore | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $ig | (.commits // []) as $all | .max_entries as $max_e | .max_commits as $max_c | .repo as $repo | .pr as $pr | ($all | map(. as $c | ($c.author.login // $c.commit.author.name // "unknown") as $author | select(($c.commit.verification.verified != true) and (($ig | index($author)) == null)) | {sha: ($c.sha[:7]), author: $author, reason: ($c.commit.verification.reason // "unsigned"), message: ($c.commit.message | split("\n")[0] | if length > 72 then .[:69] + "..." else . end | gsub("@channel"; "@ channel") | gsub("@here"; "@ here")), url: $c.html_url})) as $unv | ($unv | group_by(.reason) | map("\(length) \(.[0].reason)") | join(", ")) as $reasons | (["❌ *Commit Signature Gate failed for <https://github.com/\($repo)/pull/\($pr)|\($repo)#\($pr)>*", "• *Commits Audited:* \($all | length)", "• *Unverified Commits:* *\($unv | length)*", "• *Reasons Breakdown:* \($reasons)", (if ($all | length) >= $max_c then "⚠️ *Note:* Only the first \($max_c) commits were audited (the API page limit); later commits were not checked." else empty end), "", ($unv[:$max_e][] | "• <\(.url)|`\(.sha)`> - *\(.reason)* by `\(.author)`: \(.message)"), (if ($unv | length) > $max_e then "• ... and \($unv | length - $max_e) more unverified commit(s)." else empty end)] | join("\n"))') | first) }}

      - id: evaluate_unverified_commits
        type: io.kestra.plugin.core.flow.If
        description: Fail the gate when any commit is unverified. The commit status is posted first so the pull request shows the result even though the execution ends in FAILED.
        condition: "{{ (outputs.analyze_commits.values.unverified_count | number) > 0 }}"
        then:
          - id: post_failure_status
            type: io.kestra.plugin.core.http.Request
            description: Set the failure commit status on the pull request head commit.
            method: POST
            uri: "https://api.github.com/repos/{{ outputs.resolve_target.values.repository }}/statuses/{{ outputs.resolve_target.values.head_sha }}"
            contentType: application/json
            headers:
              Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
              Accept: "application/vnd.github+json"
              X-GitHub-Api-Version: "2022-11-28"
              User-Agent: "Kestra-Commit-Signature-Gate"
            body: "{{ {'state': 'failure', 'context': 'kestra/commit-signature-gate', 'description': ((outputs.analyze_commits.values.unverified_count ~ ' of ' ~ outputs.analyze_commits.values.total_checked ~ ' commit(s) not verified: ' ~ outputs.analyze_commits.values.reasons_summary) | abbreviate(140)), 'target_url': appLink()} | toJson }}"
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT10S
              maxAttempts: 3

          - id: send_slack_notification
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Optional Slack message listing the unverified commits. The commit status is the main output, so a Slack failure never blocks the gate.
            allowFailure: true
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: "{{ {'channel': inputs.slack_channel, 'text': outputs.analyze_commits.values.report} | toJson }}"

          - id: log_unverified_summary
            type: io.kestra.plugin.core.log.Log
            description: Log the unverified commits and the reasons breakdown.
            level: WARN
            message: "{{ outputs.analyze_commits.values.report }}"

          - id: fail_gate
            type: io.kestra.plugin.core.execution.Fail
            description: End the execution as FAILED so the unverified commits are visible in monitoring and downstream automation.
            errorMessage: "{{ outputs.analyze_commits.values.unverified_count }} of {{ outputs.analyze_commits.values.total_checked }} commit(s) in {{ outputs.resolve_target.values.repository }}#{{ outputs.resolve_target.values.pr_number }} are not verified ({{ outputs.analyze_commits.values.reasons_summary }})."
        else:
          - id: post_success_status
            type: io.kestra.plugin.core.http.Request
            description: Set the success commit status on the pull request head commit.
            method: POST
            uri: "https://api.github.com/repos/{{ outputs.resolve_target.values.repository }}/statuses/{{ outputs.resolve_target.values.head_sha }}"
            contentType: application/json
            headers:
              Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
              Accept: "application/vnd.github+json"
              X-GitHub-Api-Version: "2022-11-28"
              User-Agent: "Kestra-Commit-Signature-Gate"
            body: "{{ {'state': 'success', 'context': 'kestra/commit-signature-gate', 'description': (outputs.analyze_commits.values.total_checked ~ ' commit(s) checked, all verified'), 'target_url': appLink()} | toJson }}"
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT10S
              maxAttempts: 3

          - id: log_clean_verification
            type: io.kestra.plugin.core.log.Log
            description: Log the clean result.
            message: |
              ✅ Commit Signature Gate passed for {{ outputs.resolve_target.values.repository }}#{{ outputs.resolve_target.values.pr_number }}
              • Commits Audited: {{ outputs.analyze_commits.values.total_checked }}
              • Status: All audited commits have valid signatures.
              {% if outputs.analyze_commits.values.is_truncated %}
              ⚠️ Note: Only the first {{ inputs.max_commits }} commits were audited (the API page limit); later commits were not checked.
              {% endif %}
    else:
      - id: log_skipped_event
        type: io.kestra.plugin.core.log.Log
        description: Record that the event was not a gated pull_request action.
        message: "Skipped GitHub event: action '{{ trigger.body.action ?? 'none' }}' is not opened, synchronize or reopened."

errors:
  - id: post_error_status
    type: io.kestra.plugin.core.http.Request
    description: Set an error commit status when the gate itself broke, so the pull request is not left without a result. Skipped when the failure status was already posted or the repository or head SHA is unusable.
    runIf: "{{ (outputs.post_failure_status.code ?? null) is null and (outputs.resolve_target.values.head_sha ?? '') matches '^[0-9a-f]{40}$' and (outputs.resolve_target.values.repository ?? '') matches '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }}"
    method: POST
    uri: "https://api.github.com/repos/{{ outputs.resolve_target.values.repository }}/statuses/{{ outputs.resolve_target.values.head_sha }}"
    contentType: application/json
    headers:
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "Kestra-Commit-Signature-Gate"
    body: "{{ {'state': 'error', 'context': 'kestra/commit-signature-gate', 'description': 'The signature gate could not complete. Check the Kestra execution.', 'target_url': appLink()} | toJson }}"

  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Optional Slack alert when the gate hits an API or network error. Not sent for a deliberate gate failure.
    runIf: "{{ (outputs.post_failure_status.code ?? null) is null }}"
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: "{{ {'channel': inputs.slack_channel, 'text': '❌ *Commit Signature Gate Error*\nFlow `' ~ flow.id ~ '` execution `' ~ execution.id ~ '` failed unexpectedly. Check task execution logs for details.'} | toJson }}"

extend:
  title: Gate GitHub Pull Requests on Verified Commit Signatures
  metaTitle: Gate GitHub Pull Requests on Verified Commit Signatures | Kestra
  shortDescription: Webhook CI gate that checks every commit of a GitHub pull request for a verified signature, sets a commit status and fails the execution when one is not.
  metaDescription: Gate GitHub pull requests on verified GPG/SSH commit signatures. A webhook sets a commit status and fails the Kestra execution on unsigned commits.
  tags:
    - Infrastructure
    - Core
  subTags:
    - CI/CD & Deployment
    - GitOps & Flow Sync
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
  description: |
    Software supply chain security mandates that code merged into shared branches is cryptographically signed
    with trusted GPG, SSH, or S/MIME keys. Commits with a lapsed key, an unverified committer email, or no
    signature enter the integration stream without reliable attribution, which exposes you to author spoofing
    and fails compliance audits.

    This blueprint is a CI gate for pull requests. GitHub calls a Kestra webhook whenever a pull request is
    opened, updated, or reopened. The flow lists the pull request's commits, reads the `commit.verification`
    data GitHub already computes for each of them, and sets a commit status on the head commit. When any commit
    is not verified, the status is `failure` and the Kestra execution ends in `FAILED`, so the gate can be a
    required status check on the branch.

    ## How it works

    1. `pull_request_webhook` (`io.kestra.plugin.core.trigger.Webhook`) is keyed by `GITHUB_PR_WEBHOOK_KEY`.
       `gate_pull_request` (`io.kestra.plugin.core.flow.If`) only lets the `opened`, `synchronize` and `reopened`
       actions through. Other actions and GitHub `ping` events are logged and skipped. Manual executions
       use the `repository` and `pr_number` inputs instead.
    2. `resolve_target` (`io.kestra.plugin.core.output.OutputValues`) reads the repository, pull request number and
       head SHA from `trigger.body.pull_request`. For manual runs, `fetch_pull` first reads the head SHA from the API.
       `validate_target` checks all three values against strict patterns and fails before any status call if one is malformed.
    3. `fetch_commits` (`io.kestra.plugin.core.http.Request`) calls `GET /repos/{owner}/{repo}/pulls/{n}/commits`
       with an exponential retry.
    4. `analyze_commits` (`io.kestra.plugin.core.output.OutputValues`) uses Pebble and jq to find commits where
       `commit.verification.verified` is not true, skip authors listed in `ignore_authors`, group the failures by reason
       (`unsigned`, `unknown_key`, `expired_key`, `unverified_email` and so on), and build the report. Commit
       messages are shortened and `@channel` / `@here` are neutralized.
    5. `evaluate_unverified_commits` (`io.kestra.plugin.core.flow.If`) branches on the count:
       - Unverified commits: `post_failure_status` posts `POST /repos/{owner}/{repo}/statuses/{sha}` with state
         `failure` and the context `kestra/commit-signature-gate`. The optional `send_slack_notification` and
         `log_unverified_summary` follow, then `fail_gate` (`io.kestra.plugin.core.execution.Fail`) ends the execution
         in `FAILED`. The status is posted before the `Fail` task so the pull request always shows the result.
       - All verified: `post_success_status` posts state `success` and the execution ends normally.
    6. The `errors` block sets an `error` status if the gate itself broke (for example an API outage), so the pull
       request is not left waiting. It does nothing after a deliberate failure, so it never overwrites the `failure` status.

    The status is set with `io.kestra.plugin.core.http.Request` because the Kestra GitHub plugin has no
    commit status task.

    ## What you get

    - A real pre-merge gate: a commit status on the pull request and a `FAILED` execution when a commit is unverified.
    - Failure reasons grouped per commit, so authors know whether to sign, register a key, or fix their email.
    - Pull requests with only signed commits (or only ignored automation accounts) pass with a `success` status.
    - Optional Slack message with a link to each offending commit. It is not the main output and never blocks the gate.
    - A warning when the pull request has more commits than one API page, since the later ones were not checked.

    ## Who it's for

    - Platform Engineers and DevSecOps teams enforcing SLSA Level 2+ provenance and SOC 2 source integrity.
    - Repository owners who want a signature check on pull requests without maintaining a GitHub Actions workflow.

    ## Why orchestrate this with Kestra

    Branch rulesets can require signed commits on push, but they do not give you a reasoned report, an ignore list for
    automation accounts, or a central execution history of every check. Kestra keeps the policy in declarative YAML,
    retries transient API errors, masks the tokens, and records each decision as an execution.

    ## Prerequisites

    - A GitHub repository (public or private) where you can add a webhook.
    - A Slack incoming webhook only if you keep the optional notification.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub token that can read the repository's pull requests and commits and write commit statuses.
      For a fine-grained token: `Pull requests: Read`, `Contents: Read` and `Commit statuses: Read and write`.
      For a classic token: `repo:status`, plus `repo` for private repositories.
    - `GITHUB_PR_WEBHOOK_KEY`: Random string that forms the last segment of the Kestra webhook URL.
    - `SLACK_WEBHOOK_URL`: Incoming Slack webhook URL for the optional notification and the gate error alert.

    ## Quick start

    1. Configure `GITHUB_TOKEN`, `GITHUB_PR_WEBHOOK_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. In the repository settings, add a webhook with the payload URL
       `https://<your-kestra-host>/api/v1/executions/webhook/<namespace>/github-commit-signature-verification-gate/<key>`,
       content type `application/json`, and the **Pull requests** event only.
    4. Open a pull request containing an unsigned commit and confirm the `kestra/commit-signature-gate` status turns red
       and the execution is `FAILED`.
    5. Push a signed commit or ask the author to sign, and confirm the status turns green.
    6. Optionally mark `kestra/commit-signature-gate` as a required status check in a branch ruleset to block merges.
       You can also run the flow manually with a `repository` and `pr_number` to test it.

    ## How to extend

    - Add `io.kestra.plugin.github.issues.Comment` after `post_failure_status` to leave a PR comment that lists the
      offending commits (pull requests are issues in the GitHub API).
    - Gate `push` events on protected branches by listing commits with `GET /repos/{owner}/{repo}/commits`.
    - Escalate repeated lapses to PagerDuty or Microsoft Teams with a parallel notification task.

    ## Links

    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Webhook Trigger Documentation](https://kestra.io/plugins/plugin-core/triggers/io.kestra.plugin.core.trigger.webhook)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [GitHub REST API: List Commits on a Pull Request](https://docs.github.com/en/rest/pulls/pulls#list-commits-on-a-pull-request)
    - [GitHub REST API: Create a Commit Status](https://docs.github.com/en/rest/commits/statuses#create-a-commit-status)
    - [GitHub Documentation: About Commit Signature Verification](https://docs.github.com/en/authentication/managing-commit-signature-verification/about-commit-signature-verification)
