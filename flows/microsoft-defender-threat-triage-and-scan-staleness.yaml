id: microsoft-defender-threat-triage-and-scan-staleness
namespace: company.team
description: |
  Audit Microsoft Defender on a Windows host for active detections by severity,
  scan staleness and signature age, triage every open detection, and alert Slack
  when protection needs attention.

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every morning so overnight detections and stale scans surface with the shift.
    cron: "0 7 * * *"

inputs:
  - id: fullScanMaxAgeDays
    type: INT
    description: Maximum acceptable age of the last full scan in days before it counts as stale.
    defaults: 7
  - id: signatureMaxAgeHours
    type: INT
    description: Maximum acceptable age of the antivirus signatures in hours before they count as stale.
    defaults: 24
  - id: includeResolvedThreats
    type: BOOL
    description: Include the resolved threat history from Get-MpThreat alongside live detections.
    defaults: false

tasks:
  - id: collect_defender_state
    type: io.kestra.plugin.scripts.powershell.Script
    description: Read Defender protection state, live detections, scan times and signature age, score the gaps, and emit the verdict.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    outputFiles:
      - defender_state.json
    env:
      FULL_SCAN_MAX_AGE_DAYS: "{{ inputs.fullScanMaxAgeDays }}"
      SIGNATURE_MAX_AGE_HOURS: "{{ inputs.signatureMaxAgeHours }}"
      INCLUDE_RESOLVED: "{{ inputs.includeResolvedThreats }}"
    script: |
      $fullScanMaxAgeDays = [int]$env:FULL_SCAN_MAX_AGE_DAYS
      $sigMaxAgeHours = [int]$env:SIGNATURE_MAX_AGE_HOURS
      $includeResolved = $env:INCLUDE_RESOLVED -eq 'true'
      $now = Get-Date

      $cs = Get-MpComputerStatus -ErrorAction SilentlyContinue
      if (-not $cs) {
        $payload = @{ outputs = @{ verdict = 'UNAVAILABLE'; detections_active = 0; high_count = 0; medium_count = 0; low_count = 0; full_scan_age_hours = -1; quick_scan_age_hours = -1; signature_age_hours = -1; gaps = @('defender-module-missing'); machine = $env:COMPUTERNAME; av_enabled = $false; rtp_enabled = $false; detections = @() } }
        Write-Output ('::' + ($payload | ConvertTo-Json -Compress -Depth 5) + '::')
        exit 0
      }

      $quickAgeHours = if ($cs.QuickScanEndTime) { [math]::Round(($now - $cs.QuickScanEndTime).TotalHours, 1) } else { -1 }
      $fullAgeHours = if ($cs.FullScanEndTime) { [math]::Round(($now - $cs.FullScanEndTime).TotalHours, 1) } else { -1 }
      $sigAgeHours = if ($cs.AntivirusSignatureLastUpdated) { [math]::Round(($now - $cs.AntivirusSignatureLastUpdated).TotalHours, 1) } else { -1 }

      $detections = @(Get-MpThreatDetection -ErrorAction SilentlyContinue)
      $threats = @(Get-MpThreat -ErrorAction SilentlyContinue)
      $sevById = @{}
      foreach ($t in $threats) { $sevById["$($t.ThreatID)"] = "$($t.Severity)" }

      $detectionRows = @()
      foreach ($d in $detections) {
        $tid = "$($d.ThreatID)"
        $detectionRows += [pscustomobject]@{
          threatId  = $tid
          severity  = if ($sevById.ContainsKey($tid)) { $sevById[$tid] } else { 'Unknown' }
          process   = "$($d.ProcessName)"
          firstSeen = if ($d.InitialDetectionTime) { $d.InitialDetectionTime.ToUniversalTime().ToString('o') } else { '' }
          lastSeen  = if ($d.LastThreatStatusTime) { $d.LastThreatStatusTime.ToUniversalTime().ToString('o') } else { '' }
          resources = (($d.Resources | Select-Object -First 5) -join '; ')
        }
      }
      $high = @($detectionRows | Where-Object { $_.severity -eq 'High' }).Count
      $medium = @($detectionRows | Where-Object { $_.severity -eq 'Medium' }).Count
      $low = @($detectionRows | Where-Object { $_.severity -eq 'Low' }).Count

      $gaps = @()
      if (-not $cs.AntivirusEnabled) { $gaps += 'antivirus-disabled' }
      if (-not $cs.RealTimeProtectionEnabled) { $gaps += 'real-time-protection-disabled' }
      if ($fullAgeHours -lt 0) { $gaps += 'full-scan-never-run' }
      elseif ($fullAgeHours -gt ($fullScanMaxAgeDays * 24)) { $gaps += 'full-scan-stale' }
      if ($sigAgeHours -lt 0 -or $sigAgeHours -gt $sigMaxAgeHours) { $gaps += 'signatures-stale' }
      if ($detectionRows.Count -gt 0) { $gaps += 'active-detections' }
      if ($includeResolved -and $threats.Count -gt 0) { $gaps += 'resolved-threat-records-present' }

      $verdict = if ($high -gt 0) { 'BREACH' } elseif ($gaps.Count -gt 0) { 'ATTENTION' } else { 'PROTECTED' }

      $report = [pscustomobject]@{
        machine          = $env:COMPUTERNAME
        collectedAtUtc   = $now.ToUniversalTime().ToString('o')
        antivirusEnabled = $cs.AntivirusEnabled
        realtimeEnabled  = $cs.RealTimeProtectionEnabled
        tamperProtected  = $cs.IsTamperProtected
        quickScanEnd     = if ($cs.QuickScanEndTime) { $cs.QuickScanEndTime.ToUniversalTime().ToString('o') } else { $null }
        fullScanEnd      = if ($cs.FullScanEndTime) { $cs.FullScanEndTime.ToUniversalTime().ToString('o') } else { $null }
        signatureUpdated = if ($cs.AntivirusSignatureLastUpdated) { $cs.AntivirusSignatureLastUpdated.ToUniversalTime().ToString('o') } else { $null }
        verdict          = $verdict
        gaps             = $gaps
        detections       = $detectionRows
        resolvedThreats  = if ($includeResolved) { $threats } else { @() }
      }
      $reportPath = Join-Path '{{ outputDir }}' 'defender_state.json'
      $report | ConvertTo-Json -Depth 6 | Set-Content -Path $reportPath -Force

      $payload = @{
        outputs = @{
          verdict              = $verdict
          detections_active    = $detectionRows.Count
          high_count           = $high
          medium_count         = $medium
          low_count            = $low
          full_scan_age_hours  = $fullAgeHours
          quick_scan_age_hours = $quickAgeHours
          signature_age_hours  = $sigAgeHours
          gaps                 = $gaps
          machine              = $env:COMPUTERNAME
          av_enabled           = [bool]$cs.AntivirusEnabled
          rtp_enabled          = [bool]$cs.RealTimeProtectionEnabled
          detections           = $detectionRows
        }
      }
      Write-Output ('::' + ($payload | ConvertTo-Json -Compress -Depth 5) + '::')

  - id: per_detection_triage
    type: io.kestra.plugin.core.flow.Loop
    description: Log one triage line per live detection so severity, process and first-seen time are visible in the execution history.
    values: "{{ outputs.collect_defender_state.vars.detections }}"
    concurrencyLimit: 1
    tasks:
      - id: log_detection_triage
        type: io.kestra.plugin.core.log.Log
        description: Record one detection's severity, process and timeline for the shift handover.
        message: "Defender triage: severity {{ item.severity }} threat {{ item.threatId }} process {{ item.process }} first seen {{ item.firstSeen }} last seen {{ item.lastSeen }} on {{ outputs.collect_defender_state.vars.machine }}."

  - id: alert_if_attention
    type: io.kestra.plugin.core.flow.If
    description: Alert when the verdict is not PROTECTED, otherwise record a clean protection state.
    condition: "{{ outputs.collect_defender_state.vars.verdict != 'PROTECTED' }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the verdict, the detection counts and the protection gaps to the ops channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "Defender audit {{ outputs.collect_defender_state.vars.verdict }} on {{ outputs.collect_defender_state.vars.machine }}: {{ outputs.collect_defender_state.vars.detections_active }} active detection(s) (high {{ outputs.collect_defender_state.vars.high_count }}, medium {{ outputs.collect_defender_state.vars.medium_count }}, low {{ outputs.collect_defender_state.vars.low_count }}). Gaps {{ outputs.collect_defender_state.vars.gaps }}. Full scan age hours {{ outputs.collect_defender_state.vars.full_scan_age_hours }}, signature age hours {{ outputs.collect_defender_state.vars.signature_age_hours }}. Execution {{ execution.id }}."}
      - id: log_attention_summary
        type: io.kestra.plugin.core.log.Log
        description: Record the attention verdict with every gap in the execution log.
        message: "Defender verdict {{ outputs.collect_defender_state.vars.verdict }} on {{ outputs.collect_defender_state.vars.machine }}: {{ outputs.collect_defender_state.vars.detections_active }} detection(s), gaps {{ outputs.collect_defender_state.vars.gaps }}, full scan age hours {{ outputs.collect_defender_state.vars.full_scan_age_hours }}, signature age hours {{ outputs.collect_defender_state.vars.signature_age_hours }}."
    else:
      - id: log_protected
        type: io.kestra.plugin.core.log.Log
        description: Record that protection is healthy with no gaps.
        message: "Defender verdict PROTECTED on {{ outputs.collect_defender_state.vars.machine }}: no active detections, scans and signatures inside thresholds, antivirus and real-time protection enabled."

errors:
  - id: alert_slack_on_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Ping the on-call channel when the audit itself fails so a broken collector never stays silent.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    allowFailure: true
    payload: |
      {"text": "Defender audit failed on {{ outputs.collect_defender_state.vars.machine ?? execution.id }}: {{ errorLogs() }}. Execution {{ execution.id }}."}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.collect_defender_state.vars.verdict }}"
  - id: detections_active
    type: INT
    value: "{{ outputs.collect_defender_state.vars.detections_active }}"
  - id: high_count
    type: INT
    value: "{{ outputs.collect_defender_state.vars.high_count }}"
  - id: full_scan_age_hours
    type: INT
    value: "{{ outputs.collect_defender_state.vars.full_scan_age_hours }}"
  - id: signature_age_hours
    type: INT
    value: "{{ outputs.collect_defender_state.vars.signature_age_hours }}"
  - id: gaps
    type: JSON
    value: "{{ outputs.collect_defender_state.vars.gaps }}"
  - id: machine
    type: STRING
    value: "{{ outputs.collect_defender_state.vars.machine }}"

extend:
  shortDescription: Audit Microsoft Defender for active detections by severity, scan staleness and signature age, triage each detection, and alert Slack when protection needs attention.
  title: Microsoft Defender Threat Triage and Scan Staleness Audit
  metaTitle: Microsoft Defender Detection Triage with Scan Staleness Checks and Slack Alerts
  metaDescription: Audit Microsoft Defender for active detections, scan staleness and signature age, then alert Slack when protection needs attention.
  description: |
    Microsoft Defender already knows everything that matters on a Windows host - which threats were detected, which process touched them, whether real-time protection is still on, and when the last full scan actually ran - but the answers live in cmdlets that nobody runs after the machine is handed over. A host can go months without a full scan, or sit with a live medium-severity detection in quarantine that nobody triaged, and nothing escalates. This blueprint turns `Get-MpComputerStatus`, `Get-MpThreatDetection` and `Get-MpThreat` into a scored daily audit: it checks protection state, ages the scans and signatures against your thresholds, triages every live detection by severity, and posts one Slack alert only when the verdict is not `PROTECTED`.

    ## How it works
    1. The `daily` trigger (`io.kestra.plugin.core.trigger.Schedule`) runs the audit every morning at 07:00. Manual runs accept `fullScanMaxAgeDays`, `signatureMaxAgeHours` and `includeResolvedThreats` as inputs.
    2. The `collect_defender_state` task (`io.kestra.plugin.scripts.powershell.Script` on the Process task runner) reads the host's own Defender state with `Get-MpComputerStatus`, ages the last quick scan, full scan and signature update, joins every live detection from `Get-MpThreatDetection` to the severity reported by `Get-MpThreat`, and scores the gaps: disabled antivirus, disabled real-time protection, a full scan that never ran or is stale, stale signatures, and active detections. Any high-severity detection forces a `BREACH` verdict, any gap forces `ATTENTION`, otherwise the host is `PROTECTED`. The full snapshot lands in `defender_state.json` and the verdict is emitted as task variables.
    3. The `per_detection_triage` task (`io.kestra.plugin.core.flow.Loop`) walks the live detections and logs one triage line per detection - severity, threat id, process, first and last seen - so the execution history doubles as a triage trail. On a clean host the loop is empty and simply skips.
    4. The `alert_if_attention` task (`io.kestra.plugin.core.flow.If`) branches on the verdict: anything other than `PROTECTED` posts one Slack message with the detection counts, the gaps and the scan ages; a healthy host writes a single all-clear log line instead.
    5. The `errors` handler posts a Slack notice with `allowFailure: true`, so a broken collector or a missing Defender module escalates instead of failing silently. If the Defender cmdlets are unavailable the collector emits an `UNAVAILABLE` verdict rather than erroring the run.

    ## What you get
    - A daily protection verdict per host: `PROTECTED`, `ATTENTION`, `BREACH` or `UNAVAILABLE`, with the gaps spelled out.
    - A per-detection triage trail in the execution history with severity, process and timeline.
    - One Slack alert per host that needs attention instead of one alert per detection.
    - A `defender_state.json` artifact on every execution with the full snapshot for audit evidence.

    ## Who it's for
    - Windows fleet operators who rely on Defender but have no scheduled visibility into detections, scan cadence or signature age.
    - Security teams that need per-host evidence that protection was enabled and scans ran inside the compliance window.
    - Administrators who want triage context - severity, process, first-seen - attached to the alert instead of a bare count.

    ## Why orchestrate this with Kestra
    The Defender cmdlets are easy to run once and impossible to remember at 07:00 every day across a fleet. Kestra gives the audit a schedule, typed thresholds, an execution history that keeps every snapshot and triage line, and a conditional escalation that stays silent on healthy hosts. The same definition can be fanned out over hosts with a Loop, and the verdict becomes an execution output you can assert on in downstream compliance flows instead of a script output nobody stored.

    ## Prerequisites
    - A Windows Kestra worker with the Process task runner available, since the audit must read the host's own Defender state and the default Docker runner cannot see it.
    - PowerShell 5.1 or pwsh with the Defender PowerShell module available, plus a Slack incoming webhook stored as the `SLACK_WEBHOOK_URL` secret.
    - Note that on hosts where Defender is disabled by a third-party antivirus the collector reports `UNAVAILABLE` with the `defender-module-missing` gap rather than failing.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by the attention alert and by the on-error handler.

    ## Quick start
    1. Add the `SLACK_WEBHOOK_URL` secret to the namespace and deploy the flow on a Windows worker.
    2. Run it manually with the default thresholds and inspect the verdict, the gaps and `defender_state.json` in the outputs tab.
    3. Set `fullScanMaxAgeDays` to 0 once to watch the stale-scan path fire end to end through Slack.
    4. Leave the schedule at 07:00 or align it with your patch window, then extend the collector to fan out over a host list.

    ## How to extend
    - Fan the audit out over a fleet by wrapping the collector in `io.kestra.plugin.core.flow.Loop` over a CMDB host list and targeting each host over WinRM.
    - Turn `includeResolvedThreats` on to keep resolved threat history in the artifact for weekly trend lines.
    - Escalate a `BREACH` verdict to ServiceNow or Jira with the existing plugin tasks instead of Slack.
    - Assert on the emitted `verdict` output from a parent compliance flow so a non-compliant host blocks a deployment pipeline.
    - Add scheduled quick-scan triggering by pairing this flow with a `Get-MpScan` task when `quick_scan_age_hours` crosses your threshold.

    ## Links
    - PowerShell script task: https://kestra.io/plugins/plugin-script-powershell
    - Get-MpComputerStatus: https://learn.microsoft.com/powershell/module/defender/get-mpcomputerstatus
    - Get-MpThreatDetection: https://learn.microsoft.com/powershell/module/defender/get-mpthreatdetection
    - Schedule trigger: https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.schedule
  tags:
    - Infrastructure
    - System
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
