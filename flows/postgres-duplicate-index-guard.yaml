id: postgres-duplicate-index-guard
namespace: company.team

description: |
  Find PostgreSQL indexes that are exact duplicates of another index, or redundant because
  another index on the same table starts with the same columns. Every one of them costs disk,
  write time and vacuum time while the planner uses the other. Alert Slack with the space
  wasted, and optionally drop each redundant index with DROP INDEX CONCURRENTLY, never one that
  backs a constraint, is unique, or is the one kept, then audit again to verify.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: JDBC URL
    defaults: "jdbc:postgresql://localhost:5432/app"

  - id: drop_prefix_redundant
    type: BOOL
    displayName: Also drop prefix-redundant indexes
    description: An index on (a) is redundant with one on (a, b) for lookups, but larger multi-column entries make it slower to scan. Off means exact duplicates only are dropped, prefix ones are reported.
    defaults: false

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for DROP INDEX to run.
    defaults: true

variables:
  audit_sql: |
    WITH idx AS (
      SELECT i.indexrelid, i.indrelid, c.relname AS index_name, array(SELECT unnest(i.indkey::int2[])) AS cols, i.indisunique, i.indisprimary,
             coalesce(pg_get_expr(i.indexprs, i.indrelid), '') AS exprs, coalesce(pg_get_expr(i.indpred, i.indrelid), '') AS pred,
             array(SELECT unnest(i.indclass::oid[])) AS opclasses, array(SELECT unnest(i.indcollation::oid[])) AS collations, am.amname,
             pg_relation_size(i.indexrelid) AS bytes,
             EXISTS (SELECT 1 FROM pg_constraint k WHERE k.conindid = i.indexrelid) AS backs_constraint,
             coalesce(s.idx_scan, 0) AS scans
        FROM pg_index i
        JOIN pg_class c ON c.oid = i.indexrelid
        JOIN pg_am am ON am.oid = c.relam
        JOIN pg_namespace n ON n.oid = c.relnamespace
        LEFT JOIN pg_stat_user_indexes s ON s.indexrelid = i.indexrelid
       WHERE i.indisvalid AND n.nspname NOT IN ('pg_catalog', 'information_schema') AND n.nspname !~ '^pg_toast'
    ), pairs AS (
      SELECT a.*, b.index_name AS kept_index, b.indexrelid AS kept_oid,
             CASE WHEN a.cols = b.cols AND a.exprs = b.exprs AND a.opclasses = b.opclasses AND a.collations = b.collations THEN 'DUPLICATE' ELSE 'PREFIX_REDUNDANT' END AS kind
        FROM idx a
        JOIN idx b ON b.indrelid = a.indrelid AND b.indexrelid <> a.indexrelid AND b.amname = a.amname AND b.pred = a.pred AND b.exprs = a.exprs
       WHERE a.amname = 'btree' AND NOT a.indisprimary AND NOT a.backs_constraint
         AND array_length(a.cols, 1) <= array_length(b.cols, 1)
         AND b.cols[1:array_length(a.cols, 1)] = a.cols
         AND b.opclasses[1:array_length(a.cols, 1)] = a.opclasses
         AND b.collations[1:array_length(a.cols, 1)] = a.collations
         AND (NOT a.indisunique OR (b.indisunique AND a.cols = b.cols))
         AND (a.cols <> b.cols OR a.exprs <> b.exprs
              OR (b.indisprimary OR b.backs_constraint OR (b.indisunique AND NOT a.indisunique)
                  OR (a.indisunique = b.indisunique AND NOT a.backs_constraint AND NOT b.backs_constraint AND a.indexrelid > b.indexrelid)))
    )
    SELECT DISTINCT ON (indexrelid) indexrelid::regclass::text AS index_name, indrelid::regclass::text AS table_name, kind, kept_index,
           pg_get_indexdef(indexrelid) AS definition, pg_get_indexdef(kept_oid) AS kept_definition,
           bytes, pg_size_pretty(bytes) AS size, scans,
           CASE WHEN kind = 'DUPLICATE' OR {{ inputs.drop_prefix_redundant }} THEN format('DROP INDEX CONCURRENTLY IF EXISTS %s', indexrelid::regclass) END AS fix_sql
      FROM pairs
     ORDER BY indexrelid, kind, kept_index

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Read-only. Same table, access method, columns, expressions, predicate, operator classes and
      collations. Primary keys, unique indexes kept by a constraint and the kept side of a pair are never dropped.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Duplicate index audit on {{ inputs.jdbc_url }}: {{ outputs.audit.size }} redundant indexes,
      {{ outputs.audit.rows | jq('map(.bytes) | add // 0 | . / 1048576 | . * 10 | floor | . / 10') | first }} MB.
      {% for r in outputs.audit.rows %}{{ r.kind }} {{ r.index_name }} ({{ r.size }}, {{ r.scans }} scans) covered by {{ r.kept_index }}{{ (r.fix_sql ?? '') == '' ? ', report only' : '' }}. {% endfor %}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'PostgreSQL ' ~ inputs.jdbc_url ~ ': ' ~ outputs.audit.size ~ ' redundant indexes, written on every change and never needed: ' ~ (outputs.audit.rows | jq('map("\(.index_name) (\(.kind), \(.size)) covered by \(.kept_index)") | join("; ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Dropping now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.audit.rows | jq('map(select(.fix_sql != null)) | length') | first > 0 }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            description: One DROP INDEX CONCURRENTLY at a time. Sequential, so two duplicates of each other are never dropped together.
            concurrencyLimit: 1
            values: "{{ outputs.audit.rows | jq('map(select(.fix_sql != null) | .fix_sql)') | first | toJson }}"
            tasks:
              - id: drop
                type: io.kestra.plugin.jdbc.postgresql.Query
                allowFailure: true
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('POSTGRES_USERNAME') }}"
                password: "{{ secret('POSTGRES_PASSWORD') }}"
                fetchType: NONE
                sql: "{{ item.value }}"

          - id: reaudit
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ inputs.jdbc_url }}"
            username: "{{ secret('POSTGRES_USERNAME') }}"
            password: "{{ secret('POSTGRES_PASSWORD') }}"
            fetchType: FETCH
            sql: "{{ render(vars.audit_sql) }}"

          - id: kept_check
            type: io.kestra.plugin.jdbc.postgresql.Query
            description: Every index named as kept must still exist and be valid.
            url: "{{ inputs.jdbc_url }}"
            username: "{{ secret('POSTGRES_USERNAME') }}"
            password: "{{ secret('POSTGRES_PASSWORD') }}"
            fetchType: FETCH_ONE
            sql: >-
              SELECT count(*) AS missing FROM unnest(ARRAY[{{ outputs.audit.rows | jq('map(select(.fix_sql != null) | .kept_index) | unique | map("\u0027" + gsub("\u0027"; "\u0027\u0027") + "\u0027") | join(",")') | first }}]::text[]) k(name)
               WHERE to_regclass(k.name) IS NULL OR NOT EXISTS (SELECT 1 FROM pg_index i WHERE i.indexrelid = to_regclass(k.name) AND i.indisvalid)

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            condition: >-
              {{ outputs.kept_check.row.missing > 0 or ({'b': outputs.audit.rows, 'a': outputs.reaudit.rows ?? []} | jq('([.a[].index_name]) as $a | [.b[] | select(.fix_sql != null) | .index_name | select(. as $x | $a | index($x))] | length') | first > 0) }}
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "After the drops, a kept index is missing ({{ outputs.kept_check.row.missing }}) or a dropped index is still reported. Check the remediate logs."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Dropped and verified: {{ outputs.audit.rows | jq('map(select(.fix_sql != null) | "\(.index_name) (\(.size))") | join(", ")') | first }}.
                  Every kept index is still valid. Left for review: {{ outputs.reaudit.rows | jq('if length == 0 then "none" else map("\(.kind) \(.index_name)") | join(", ") end') | first }}.
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No duplicate or redundant index."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'PostgreSQL duplicate index guard failed on ' ~ inputs.jdbc_url ~ ' (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode.
    cron: "0 3 * * 0"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: PostgreSQL Duplicate Index Guard
  shortDescription: Find PostgreSQL indexes that duplicate another index or are a prefix of one, report the space and write cost, and optionally drop them with DROP INDEX CONCURRENTLY, keeping constraint and unique indexes, then verify.
  metaTitle: PostgreSQL Duplicate Index Guard with Kestra
  metaDescription: Find duplicate and prefix-redundant PostgreSQL indexes, alert Slack with the space wasted, drop them concurrently and verify the kept index remains.
  description: |
    Duplicate indexes pile up quietly. A migration adds an index the ORM already created. Someone adds a plain index next to a unique constraint on the same column. An index on `(customer_id)` sits next to one on `(customer_id, created)` that serves the same lookups. Each extra index is written on every `INSERT` and `UPDATE`, vacuumed, backed up and replicated, while the planner uses the other one.

    This blueprint finds exact duplicates and prefix-redundant indexes, with their size and scan count. It alerts Slack, and can drop them with `DROP INDEX CONCURRENTLY`, one at a time. It then checks that each index it kept is still there and valid, and that the dropped ones are gone.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## What counts as redundant

    Two btree indexes on the same table are compared on columns, expressions, predicate, operator classes and collations:

    | Kind | Rule | Dropped by default |
    |---|---|---|
    | `DUPLICATE` | Same columns, expressions, predicate, operator classes and collations | Yes |
    | `PREFIX_REDUNDANT` | Its columns are the leading columns of another index with the same predicate | Only with `drop_prefix_redundant: true` |

    Which index is kept:
    - A primary key, an index backing a constraint, and a unique index are always kept over a plain index. They are never dropped as the redundant side.
    - A unique index is never treated as redundant with a non-unique one.
    - Partial and expression indexes are only compared with indexes having the same predicate and expressions.

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.postgresql.Query`, read-only) compares every pair of valid btree indexes on each table with the rules above. It returns each redundant index with the index that covers it, both definitions, the size, `idx_scan` since the last stats reset, and a `DROP INDEX CONCURRENTLY IF EXISTS` statement built with `regclass`.
    2. `summary` logs every finding and the total space.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs it.
       - **findings:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `remediate` (`concurrencyLimit: 1`) drops one index at a time. Two duplicates of each other are never dropped together.
         - `reaudit` runs the audit again, and `kept_check` confirms that every kept index still exists and is valid.
         - `verify_result` fails if a kept index is missing or a dropped one is still reported.
    4. `errors` alerts Slack when the audit cannot run.

    ## What you get

    - Every index that costs writes and space without serving a query the other index does not.
    - Drops that never touch primary keys, constraint indexes or unique indexes, and never remove both sides of a pair.
    - A check that the index left in place is still valid after the run.

    ## Who it's for

    - Teams with schemas built over years of migrations and ORM-generated indexes.
    - DBAs reducing write amplification, WAL volume and backup size.
    - Teams evaluating the PostgreSQL plugin who want an example of a catalog analysis driving `DROP INDEX CONCURRENTLY`.

    ## Why orchestrate this with Kestra

    Duplicates come back with every migration. Kestra runs the comparison every week, sends the redundant indexes and the space they take to Slack, and drops them behind `auto_remediate` and `dry_run`, one at a time. It verifies that the covering index survived, and keeps a history of every index removed.

    ## Tested end to end

    On Kestra 2.0.5 OSS against PostgreSQL 16, with a local HTTP sink standing in for Slack. Indexes added on top of the existing ones:
    - on `orders`: `orders_customer_idx2` (same as `orders_customer_idx`), `orders_ref_plain` (same column as the unique `orders_ref_uq`), and `orders_customer_created_idx (customer_id, created)`;
    - on `events`: `(kind)` and `(lower(kind))`;
    - on `shipments`: `(carrier)` and `(carrier) WHERE carrier = 'ups'`.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 3 findings, 7 MB. `orders_customer_idx2` duplicates `orders_customer_idx`, `orders_ref_plain` duplicates the unique `orders_ref_uq`, `orders_customer_idx` is a prefix of `orders_customer_created_idx` (report only). The expression and partial indexes are not flagged. Alert sent |
    | 2 | `auto_remediate: true`, `dry_run: true` | Same report, 6 indexes still on `orders` |
    | 3 | `auto_remediate: true`, `dry_run: false` | The 2 duplicates dropped. `orders_customer_idx` and `orders_ref_uq` checked as still valid. A query on `customer_id` still uses an index |
    | 4 | `drop_prefix_redundant: true` | `orders_customer_idx` dropped. `EXPLAIN` for `customer_id = 42` now uses `orders_customer_created_idx` |
    | 5 | defaults | Clean |
    | 6 | unreachable database | `errors` alert sent |

    ## Prerequisites

    - For the audit, any role can read the catalog and statistics. For remediation, the owner of the tables.
    - `idx_scan` counts since the last statistics reset. Read it with that in mind on a freshly restarted server.
    - Local testing:
      - `docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=pg postgres:16`;
      - create the same index twice under two names.

    ### Secrets

    - `POSTGRES_USERNAME` / `POSTGRES_PASSWORD`: credentials used by every query.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:postgresql://localhost:5432/app` | Database |
    | `drop_prefix_redundant` | `false` | Also drop prefix-redundant indexes |
    | `auto_remediate` | `false` | Allow `DROP INDEX` |
    | `dry_run` | `true` | Must be `false` for an index to be dropped |

    ## Quick start

    1. Add the `POSTGRES_USERNAME`, `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow and set `jdbc_url`.
    3. Run it once and review each redundant index and the one that covers it.
    4. Run it with `auto_remediate: true` and `dry_run: false` to drop the exact duplicates.
    5. Enable the `weekly` trigger, which always runs in safe mode.

    ## How to extend

    - Save each dropped index definition to a table or a namespace file, so it can be recreated in one statement.
    - Combine with `idx_scan` on replicas, where read traffic may use an index the primary never does.
    - Loop over a list of JDBC URLs to check every database of a cluster.
    - Ask for approval with a `Pause` before dropping indexes larger than a threshold.

    ## Links

    - Index types and multicolumn indexes: https://www.postgresql.org/docs/current/indexes-multicolumn.html
    - PostgreSQL plugin: https://kestra.io/plugins/plugin-jdbc-postgres
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
