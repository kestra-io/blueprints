id: searxng-engine-health-and-rate-limit-sentinel
namespace: company.ai

description: |
  Continuously monitors SearXNG metasearch instance health and upstream search engine availability, detects provider rate-limiting and engine suspensions, and dispatches actionable Slack incident alerts to protect AI RAG pipelines.

inputs:
  - id: searxng_host
    type: STRING
    displayName: SearXNG Instance Host
    defaults: "http://searxng.internal:8080"
    description: "Base HTTP URL of the target SearXNG metasearch server instance."

  - id: test_query
    type: STRING
    displayName: Synthetic Validation Query
    defaults: "kestra workflow orchestrator"
    description: "Query string used by the probe task to evaluate metasearch reachability and upstream response parsing."

  - id: monitored_engines
    type: STRING
    displayName: Monitored Upstream Engines
    defaults: "google,duckduckgo,bing,wikipedia"
    description: "Comma-separated list of critical search engines that must remain active and responsive."

  - id: min_expected_results
    type: INT
    displayName: Minimum Expected Results
    defaults: 1
    description: "Minimum count of aggregated search results required for a probe to be considered healthy."

  - id: slack_channel
    type: STRING
    displayName: Operational Slack Channel
    defaults: "#ai-ops"
    description: "Target Slack channel or webhook destination for engine degradation and incident alerts."

triggers:
  - id: scheduled_sentinel_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"
    disabled: true
    inputs:
      searxng_host: "http://searxng.internal:8080"
      test_query: "kestra workflow orchestrator"
      monitored_engines: "google,duckduckgo,bing,wikipedia"
      min_expected_results: 1
      slack_channel: "#ai-ops"

tasks:
  - id: probe_instance_health
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.searxng_host }}/healthz"
    method: GET
    headers:
      Accept: application/json
    timeout: PT15S
    description: "Queries the SearXNG healthz endpoint to verify HTTP service availability and process readiness."

  - id: probe_synthetic_search
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.searxng_host }}/search?q={{ inputs.test_query | urlencode }}&format=json"
    method: GET
    headers:
      Accept: application/json
    timeout: PT30S
    description: "Executes a live synthetic query against SearXNG's JSON API to measure upstream provider response latency and capture unresponsive engines."

  - id: route_engine_health_status
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {% set search_data = outputs.probe_synthetic_search.body %}
      {% set unresponsive = search_data.unresponsive_engines | default([]) %}
      {% set result_count = search_data.number_of_results | default(0) %}
      {% set critical_engines = inputs.monitored_engines | split(',') %}
      {% set critical_down = [] %}
      {% for item in unresponsive %}
        {% set engine_name = item[0] | default(item) %}
        {% if engine_name in critical_engines %}
          {% set _ = critical_down.add(engine_name) %}
        {% endif %}
      {% endfor %}
      {% if result_count < inputs.min_expected_results %}
        SEARCH_EMPTY
      {% elseif critical_down | length > 0 %}
        DEGRADED
      {% else %}
        COMPLIANT
      {% endif %}
    cases:
      COMPLIANT:
        - id: log_compliant_status
          type: io.kestra.plugin.core.log.Log
          message: "SearXNG metasearch instance '{{ inputs.searxng_host }}' is healthy. Aggregated {{ outputs.probe_synthetic_search.body.number_of_results | default(0) }} results with zero critical engine outages."

      DEGRADED:
        - id: alert_engine_degraded_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#FFA726",
                  "title": "⚠️ SearXNG Engine Degradation Detected",
                  "text": "Upstream search engine rate-limiting or outages detected on `{{ inputs.searxng_host }}`.\n*Unresponsive Engines:* `{{ outputs.probe_synthetic_search.body.unresponsive_engines | default([]) }}`\n*Results Aggregated:* `{{ outputs.probe_synthetic_search.body.number_of_results | default(0) }}`\n*Synthetic Query:* `{{ inputs.test_query }}`",
                  "footer": "Kestra Sentinel | AI RAG Availability Gate"
                }
              ]
            }

        - id: log_degraded_status
          type: io.kestra.plugin.core.log.Log
          message: "One or more monitored upstream engines are unresponsive on '{{ inputs.searxng_host }}'. Investigation required."

      SEARCH_EMPTY:
        - id: alert_search_empty_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#E53935",
                  "title": "❌ SearXNG Zero Results Outage",
                  "text": "SearXNG returned 0 search results for query `{{ inputs.test_query }}` on `{{ inputs.searxng_host }}`. Upstream providers may be blocked by CAPTCHA or IP rate-limiting.\n*Unresponsive Engines:* `{{ outputs.probe_synthetic_search.body.unresponsive_engines | default([]) }}`",
                  "footer": "Kestra Sentinel | Metasearch Outage Alert"
                }
              ]
            }

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Completed SearXNG metasearch health audit on {{ inputs.searxng_host }} at {{ now() }}. Number of results: {{ outputs.probe_synthetic_search.body.number_of_results | default(0) }}."

errors:
  - id: alert_probe_failure_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "attachments": [
          {
            "color": "#D32F2F",
            "title": "🚨 SearXNG Sentinel Probe Failure",
            "text": "The SearXNG health probe encountered an unhandled network error or connection timeout connecting to `{{ inputs.searxng_host }}`.\n*Execution ID:* `{{ flow.executionId }}`\n*Error Message:* `{{ flow.errorMessage | default('Unknown execution error') }}`",
            "footer": "Kestra Orchestrator | Automated Incident Management"
          }
        ]
      }

extend:
  title: SearXNG Metasearch Engine Health and Upstream Rate-Limit Sentinel
  metaTitle: SearXNG Metasearch Engine Health & Rate-Limit Sentinel | Kestra
  shortDescription: Audits SearXNG metasearch instance health, detects upstream provider rate-limiting and engine suspensions, and dispatches actionable Slack incident alerts.
  metaDescription: Audit SearXNG metasearch instance health, detect upstream provider rate-limits and suspended engines, and dispatch automated Slack incident alerts.
  description: |
    Automated health gate and availability sentinel that monitors SearXNG privacy-preserving metasearch instances against upstream engine rate-limiting, CAPTCHA blocks, and engine suspensions. Dispatches structured Slack incident notifications to prevent silent degradation of AI search agents and RAG retrieval pipelines.

    ## How it works

    1. A recurrent scheduled trigger initiates the metasearch audit every 4 hours, or triggers on-demand via webhook or manual dispatch before downstream AI runs.
    2. The `probe_instance_health` task queries `GET /healthz` on the target SearXNG instance to confirm HTTP reachability and base process readiness.
    3. The `probe_synthetic_search` task runs a live synthetic search query against `GET /search?q=...&format=json` to evaluate end-to-end response parsing, latency, and provider aggregation.
    4. Pebble expressions inspect the returned JSON payload, evaluating `number_of_results` against `min_expected_results` and cross-referencing `unresponsive_engines` against the `monitored_engines` allowlist.
    5. The `route_engine_health_status` flow-control Switch evaluates the classified operational state:
       - `COMPLIANT`: Logs clean audit metrics when all monitored providers respond successfully and return sufficient results.
       - `DEGRADED`: Formats and dispatches a rich Slack warning detailing which upstream engines are unresponsive or suspended.
       - `SEARCH_EMPTY`: Dispatches a critical Slack outage alert notifying AI platform engineers that zero results were aggregated, indicating universal bot blocking or IP blacklisting.
    6. A final `log_audit_summary` task records execution audit telemetry, while an `errors` block intercepts connection timeouts or gateway failures with automated Slack escalations.

    ## What you get

    - Early warning detection for upstream search engine rate-limiting (HTTP 429) and bot-detection IP blocks.
    - Zero-downtime visibility into SearXNG engine suspensions before downstream RAG agents fail.
    - Automated Slack incident routing with detailed diagnostic attachments listing specific failing providers.
    - Continuous synthetic search verification validating real-time response payload formatting.
    - Centralized audit trail of metasearch reliability metrics preserved in Kestra's execution history.

    ## Who it's for

    - AI Engineers and Data Scientists building agentic search and retrieval-augmented generation (RAG) pipelines.
    - Platform Engineers and SREs hosting self-managed SearXNG metasearch clusters.
    - DevOps Teams operating privacy-focused search infrastructure and web scraping gateways.

    ## Why orchestrate this with Kestra

    - **Declarative YAML Configuration**: Maintain search engine health policies, monitored provider lists, and alert thresholds in version-controlled workflows.
    - **Native Secret Isolation**: Securely store Slack Incoming Webhook endpoints in namespace secret stores using `{{ secret(...) }}` without plaintext exposure.
    - **Proactive Failure Gates**: Integrate this sentinel as an upstream dependency before running scheduled RAG ingestion batches to prevent incomplete data gathering.
    - **Resilient Flow-Control**: Combine Kestra's native `Switch`, `Log`, and `errors` tasks to distinguish between local container failures and upstream provider rate-limits.

    ## Prerequisites

    - A running SearXNG instance (accessible over HTTP/HTTPS) with JSON output format enabled (`search.formats: [html, json]`).
    - Network connectivity from the Kestra worker or runner environment to the SearXNG server.
    - A Slack Incoming Webhook URL configured with permissions to post into your target operations channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for operational alerts.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance under your desired namespace (e.g., `company.ai`).
    3. Click **Execute** with default inputs or provide your custom `searxng_host` to validate connectivity against your instance.
    4. Review execution logs under the **Executions** tab to confirm that synthetic search results and engine metrics are parsed correctly.
    5. Enable the `scheduled_sentinel_audit` trigger to establish recurrent 4-hour automated metasearch health evaluations.

    ## How to extend

    - **Automated Engine Toggling**: Extend the degraded branch with an HTTP request to reload SearXNG configuration or rotate outbound proxy IPs when rate limits occur.
    - **Proxy Pool Health Check**: Add parallel probe tasks to verify upstream Tor, SOCKS5, or residential proxy gateway reachability.
    - **PagerDuty Escalation**: Route critical zero-result outages directly to on-call engineers via PagerDuty or Opsgenie.
    - **Multi-Query Canary Suite**: Expand the synthetic validation into a Kestra `ForEach` loop testing varied search categories (e.g., general, science, news, IT).

    ## Links

    - [SearXNG Documentation](https://docs.searxng.org/)
    - [SearXNG GitHub Repository](https://github.com/searxng/searxng)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
