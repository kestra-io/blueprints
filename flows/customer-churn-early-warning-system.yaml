id: customer-churn-early-warning-system
namespace: company.customer.success

extend:
  title: Proactive Customer Churn Early Warning and Retention Playbook System
  metaTitle: Customer Churn Early Warning and Automated Retention Pipeline | Kestra
  shortDescription: Audits tenant usage telemetry and support tickets in DuckDB, computes churn risk scores in Python, and triggers automated CSM interventions.
  metaDescription: Orchestrate customer churn prevention, parallel telemetry fetching, DuckDB usage rollups, Python risk scoring, and CSM retention playbooks with Kestra.
  description: |
    Tackles the silent killer of subscription and SaaS businesses—customer churn that goes unnoticed until cancellation notices arrive. This production workflow acts as an automated Customer Success early warning system by harvesting auth logs and support ticket ledgers concurrently via Parallel, rolling up feature adoption trends in memory using DuckDB, computing multi-factor churn probability scores in Python, synchronizing CRM health tags sequentially, and branching via If to automatically trigger high-priority CSM intervention playbooks when accounts flash red.

    ## How it works
    1. **Dual-Mode Triggering (`weekly_churn_risk_scan`, `manual_account_audit_webhook`):** Runs an automated scan every Monday morning or triggers on-demand when accounts approach contract renewal windows.
    2. **Parallel Telemetry Harvest (`parallel_telemetry_harvest`):** Concurrently pings authentication activity logs, support ticket ledgers, and feature adoption metric streams via `io.kestra.plugin.core.flow.Parallel`.
    3. **DuckDB Usage Rollup (`rollup_usage_metrics_duckdb`):** Uses embedded `io.kestra.plugin.jdbc.duckdb.Query` to analyze feature adoption scores and active user counts across core dashboards, analytics, and integrations.
    4. **Python Churn Risk Engine (`evaluate_churn_probability_score`):** Executes `io.kestra.plugin.scripts.python.Script` to calculate a 0–100 Churn Risk Score based on inactivity days, active user drops, and open support escalations.
    5. **Sequential CRM Sync (`sequential_crm_ledger_sync`):** Uses `io.kestra.plugin.core.flow.Sequential` to update HubSpot CRM risk tags, success dashboard tiers, and staged retention playbooks in order.
    6. **Conditional CSM Intervention (`route_churn_intervention_playbook`):** Branches via `io.kestra.plugin.core.flow.If` to either dispatch urgent alerts and create high-priority CSM intervention tasks for at-risk accounts, or log a stable account health status.
    7. **Ledger Closure (`finalize_churn_audit_run`):** Closes the audit execution run.

    ## What you get
    - **Proactive Revenue Protection:** Catch declining product usage and support friction weeks before customers decide to churn.
    - **Data-Driven Risk Scoring:** Combine inactivity days, seat utilization drop-offs, and ticket escalations into a single actionable risk index.
    - **Automated CSM Playbooks:** Instantly alert account managers and stage tailored retention actions when MRR is at stake.
    - **Full Execution Visibility:** Clean, modular task topology for easy monitoring and auditability.

    ## Who it's for
    - **Customer Success & Account Management Teams** looking to automate retention workflows and prevent silent churn.
    - **SaaS Founders & Revenue Leaders** wanting real-time visibility into account health and renewal risks.
    - **Data & Ops Engineers** building robust business intelligence and alerting pipelines.

    ## Why orchestrate this with Kestra
    - Combines `Parallel` telemetry checks, `DuckDB` analytical SQL, `Python` scoring logic, `Sequential` CRM sync, and `If` conditional routing in a single declarative file.
    - Strongly typed inputs let success teams simulate different churn scenarios directly from the UI.
    - Built-in audit logs provide a clear history of every retention intervention.

    ## Prerequisites
    - A running Kestra v2.0 instance with the DuckDB (`plugin-jdbc-duckdb`) and Python (`plugin-scripts-python`) plugins installed.
    - Network reachability for HTTP telemetry connector mock probes.

    ### Secrets
    - No secrets required to run out of the box. When connecting to live HubSpot, Salesforce, or Zendesk APIs, reference credentials via `{{ secret('HUBSPOT_API_KEY') }}`.

    ## Quick start
    1. Import this blueprint into your Kestra instance under the `company.customer.success` namespace.
    2. Click **Execute** using default inputs (`days_since_last_login: 14`, `open_support_escalations: 3`) to observe the `MODERATE_RENEWAL_RISK` intervention path.
    3. Run a test with `days_since_last_login: 28` and `active_users_pct_drop: 0.70` to trigger the `HIGH_URGENCY_CHURN_RISK` alert branch.
    4. Enable the weekly Monday schedule for continuous retention monitoring.

    ## How to extend
    - **Connect Live CRM & Support APIs:** Replace mock HTTP tasks with real HubSpot, Salesforce, or Zendesk API integrations.
    - **Automate Re-Engagement Emails:** Add SendGrid, Resend, or Customer.io tasks inside the intervention branch to email at-risk accounts automatically.
    - **Trigger Slack/Teams Alerts:** Attach Slack webhook tasks to notify CSM channels instantly when an account enters the high-risk tier.

    ## Links
    - [DuckDB JDBC Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Flowable Tasks Guide (Parallel, Sequential, If)](https://kestra.io/docs/workflow-components/flowable-tasks)
  tags:
    - DevOps
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false

labels:
  domain: customer-success
  subsystem: churn-prevention
  criticality: high-growth

inputs:
  - id: account_id
    type: STRING
    defaults: "act_enterprise_9984"
    description: "Unique identifier for the B2B SaaS customer account being audited"

  - id: company_name
    type: STRING
    defaults: "Acme Logistics Global"
    description: "Display name of the customer organization"

  - id: monthly_recurring_revenue_usd
    type: FLOAT
    defaults: 2400.00
    description: "Monthly Recurring Revenue (MRR) at stake for this account in USD"

  - id: days_since_last_login
    type: FLOAT
    defaults: 14.0
    description: "Number of days since any user from this tenant last logged into the platform"

  - id: active_users_pct_drop
    type: FLOAT
    defaults: 0.38
    description: "Percentage drop in active users over the last 30 days (0.0 to 1.0)"

  - id: open_support_escalations
    type: INT
    defaults: 3
    description: "Number of active, unresolved support escalations or high-priority bug tickets"

  - id: contract_renewal_days
    type: INT
    defaults: 45
    description: "Number of days remaining until the customer's annual subscription renewal date"

triggers:
  - id: weekly_churn_risk_scan
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Run automated churn risk scan across all active customer accounts every Monday"
    cron: "0 5 * * 1"

  - id: manual_account_audit_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Trigger on-demand account retention audit via webhook payload"
    key: "churn-risk-audit-token"

tasks:
  - id: init_churn_audit
    type: io.kestra.plugin.core.log.Log
    description: "Task 1: Initialize churn early warning audit session"
    level: INFO
    message: |
      [CHURN EARLY WARNING] Starting retention health scan for account: {{ inputs.company_name }} ({{ inputs.account_id }})
      MRR: ${{ inputs.monthly_recurring_revenue_usd }} | Days Inactive: {{ inputs.days_since_last_login }}

  - id: parallel_telemetry_harvest
    type: io.kestra.plugin.core.flow.Parallel
    description: "Tasks 2-5: Concurrently fetch login telemetry, support ticket logs, and feature usage event streams"
    tasks:
      - id: fetch_auth_activity_log
        type: io.kestra.plugin.core.http.Request
        description: "Task 2: Fetch tenant authentication activity and last-seen timestamps"
        uri: "https://jsonplaceholder.typicode.com/posts/1"
        method: GET

      - id: fetch_support_ticket_ledger
        type: io.kestra.plugin.core.http.Request
        description: "Task 3: Fetch open support tickets and escalation history"
        uri: "https://jsonplaceholder.typicode.com/posts/2"
        method: GET

      - id: fetch_feature_adoption_metrics
        type: io.kestra.plugin.core.http.Request
        description: "Task 4: Fetch feature adoption scores and active user counts"
        uri: "https://jsonplaceholder.typicode.com/todos/1"
        method: GET

      - id: log_telemetry_harvest_success
        type: io.kestra.plugin.core.log.Log
        description: "Task 5: Confirm all telemetry data connectors responded successfully"
        level: INFO
        message: "Successfully harvested telemetry streams for account {{ inputs.account_id }}."

  - id: rollup_usage_metrics_duckdb
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: "Task 6: Roll up historical feature adoption and seat utilization trends using embedded DuckDB SQL"
    sql: |
      WITH tenant_feature_usage AS (
        SELECT 'Core Dashboard' AS feature, 85 AS adoption_score, 12 AS active_users
        UNION ALL
        SELECT 'Advanced Analytics' AS feature, 22 AS adoption_score, 2 AS active_users
        UNION ALL
        SELECT 'API Integrations' AS feature, 60 AS adoption_score, 5 AS active_users
        UNION ALL
        SELECT 'Scheduled Reports' AS feature, 10 AS adoption_score, 0 AS active_users
      )
      SELECT
        feature,
        adoption_score,
        active_users,
        CASE WHEN adoption_score < 30 THEN 'CRITICAL_DROP' ELSE 'HEALTHY' END AS feature_status
      FROM tenant_feature_usage
      ORDER BY adoption_score ASC;
    fetchType: FETCH

  - id: evaluate_churn_probability_score
    type: io.kestra.plugin.scripts.python.Script
    description: "Task 7: Calculate composite Churn Risk Score and determine required retention playbook"
    beforeCommands:
      - pip install kestra
    script: |
      from kestra import Kestra

      account = "{{ inputs.company_name }}"
      mrr = float({{ inputs.monthly_recurring_revenue_usd }})
      days_inactive = float({{ inputs.days_since_last_login }})
      drop_pct = float({{ inputs.active_users_pct_drop }})
      tickets = int({{ inputs.open_support_escalations }})
      renewal_days = int({{ inputs.contract_renewal_days }})

      inactivity_score = min(40.0, (days_inactive / 30.0) * 40.0)
      usage_score = min(30.0, drop_pct * 100.0 * 0.30)
      ticket_score = min(30.0, (tickets / 5.0) * 30.0)

      risk_score = round(inactivity_score + usage_score + ticket_score, 1)
      is_at_risk = risk_score >= 50.0 or (renewal_days <= 60 and risk_score >= 35.0)

      if risk_score >= 75.0:
          risk_tier = "HIGH_URGENCY_CHURN_RISK"
          playbook = "Immediate CSM Executive Outreach + Custom Training Session + Discount Incentive"
      elif is_at_risk:
          risk_tier = "MODERATE_RENEWAL_RISK"
          playbook = "Automated Email Re-engagement Sequence + Support Ticket Escalation Review"
      else:
          risk_tier = "HEALTHY_RETENTION"
          playbook = "Standard automated touchpoint / quarterly business review (QBR) invite"

      summary = f"[{risk_tier}] Account: {account} | Risk Score: {risk_score}/100 | MRR at Stake: ${mrr:,.0f}"
      print(summary)
      print(f"Recommended Playbook: {playbook}")

      Kestra.outputs({
          'risk_score': risk_score,
          'is_at_risk': is_at_risk,
          'risk_tier': risk_tier,
          'playbook': playbook,
          'summary': summary
      })

  - id: sequential_crm_ledger_sync
    type: io.kestra.plugin.core.flow.Sequential
    description: "Tasks 8-10: Sequentially update CRM, customer success platform, and internal alerts"
    tasks:
      - id: sync_hubspot_crm_risk_tag
        type: io.kestra.plugin.core.log.Log
        description: "Task 8: Update HubSpot account risk score property"
        level: INFO
        message: "[CRM SYNC 1/3] HubSpot account risk score updated to {{ outputs.evaluate_churn_probability_score.vars.risk_score }}/100."

      - id: sync_customer_success_portal
        type: io.kestra.plugin.core.log.Log
        description: "Task 9: Update Customer Success platform health tier"
        level: INFO
        message: "[CRM SYNC 2/3] Success dashboard tier updated to: {{ outputs.evaluate_churn_probability_score.vars.risk_tier }}."

      - id: log_retention_playbook_ready
        type: io.kestra.plugin.core.log.Log
        description: "Task 10: Stage recommended retention playbook in task ledger"
        level: INFO
        message: "[CRM SYNC 3/3] Retention playbook staged: {{ outputs.evaluate_churn_probability_score.vars.playbook }}."

  - id: route_churn_intervention_playbook
    type: io.kestra.plugin.core.flow.If
    description: "Tasks 11-14: Conditional branching between urgent CSM intervention and healthy account logging"
    condition: "{{ outputs.evaluate_churn_probability_score.vars.is_at_risk == true }}"
    then:
      - id: dispatch_csm_urgent_alert
        type: io.kestra.plugin.core.log.Log
        description: "Task 11: Dispatch high-priority alert to assigned Customer Success Manager"
        level: WARN
        message: |
          [RETENTION ALERT DISPATCHED] Account {{ inputs.company_name }} is flashing red!
          Summary: {{ outputs.evaluate_churn_probability_score.vars.summary }}
          Assigned Playbook: {{ outputs.evaluate_churn_probability_score.vars.playbook }}

      - id: create_csm_task_ticket
        type: io.kestra.plugin.core.log.Log
        description: "Task 12: Create high-priority intervention task ticket for CSM follow-up"
        level: WARN
        message: "[ACTION CREATED] Created high-priority intervention task for assigned Customer Success Manager."
    else:
      - id: log_account_healthy_status
        type: io.kestra.plugin.core.log.Log
        description: "Task 13: Log that customer account is operating within healthy retention parameters"
        level: INFO
        message: |
          [ACCOUNT HEALTHY] {{ inputs.company_name }} is stable. Risk Score: {{ outputs.evaluate_churn_probability_score.vars.risk_score }}/100.

      - id: archive_healthy_account_snapshot
        type: io.kestra.plugin.core.log.Log
        description: "Task 14: Archive quarterly health check snapshot to audit ledger"
        level: INFO
        message: "[ARCHIVED] Stored quarterly health check audit snapshot for account {{ inputs.account_id }}."

  - id: finalize_churn_audit_run
    type: io.kestra.plugin.core.log.Log
    description: "Task 15: Close churn early warning audit run and record final risk tier"
    level: INFO
    message: "Completed Churn Early Warning audit for {{ inputs.company_name }}. Final Risk Tier: {{ outputs.evaluate_churn_probability_score.vars.risk_tier }}"
