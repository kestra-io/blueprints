id: typesense-collection-alias-zero-downtime-reindex
namespace: company.team

description: |
  Orchestrate zero-downtime search collection rebuilds in Typesense using collection aliasing.
  Creates a versioned collection with the updated schema, bulk indexes catalog records,
  validates search recall and facet distributions with canary queries, and atomically swaps
  the production alias with zero dropped queries.

inputs:
  - id: typesense_host
    type: STRING
    displayName: Typesense Host
    description: Hostname or IP address of the Typesense node or load balancer.
    defaults: "localhost"

  - id: catalog_feed_url
    type: STRING
    displayName: Catalog Feed URL
    description: HTTP(S) URL returning the product catalog JSON to index. The default is a public demo endpoint returning real sample products; swap in your PIM or commerce platform export URL for production use.
    defaults: "https://dummyjson.com/products?limit=100"

  - id: typesense_port
    type: STRING
    displayName: Typesense Port
    description: HTTP API port of the Typesense instance (8108 by default).
    defaults: "8108"

  - id: alias_name
    type: STRING
    displayName: Production Alias Name
    description: Virtual alias queried by frontend applications and storefront search bars.
    defaults: "products"

  - id: min_expected_docs
    type: INT
    displayName: Minimum Expected Documents
    description: Minimum number of successfully indexed documents required to approve alias cutover.
    defaults: 5

  - id: canary_query
    type: STRING
    displayName: Canary Search Query
    description: High-value storefront search query used to validate full-text search recall on the staged collection.
    defaults: "wireless headphones"

  - id: canary_min_hits
    type: INT
    displayName: Canary Minimum Hits
    description: Minimum document matches expected from the canary full-text query.
    defaults: 1

  - id: canary_facet_field
    type: STRING
    displayName: Canary Facet Field
    description: Facet field to evaluate for valid category distribution and indexing integrity.
    defaults: "category"

  - id: retire_previous_collection
    type: BOOL
    displayName: Retire Previous Collection
    description: If true, permanently drops the superseded collection after cutover. If false, preserves it for instant rollback.
    defaults: false

triggers:
  - id: reindex_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook endpoint for CI/CD pipelines, PIM updates, or catalog ETL triggers.
    key: "{{ secret('TYPESENSE_REINDEX_WEBHOOK_KEY') }}"
    disabled: true

  - id: weekly_reindex_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled maintenance trigger for weekly zero-downtime catalog re-indexing. Disabled by default.
    cron: "0 2 * * 0"
    disabled: true

tasks:
  - id: inspect_current_alias
    type: io.kestra.plugin.core.http.Request
    description: Read the current target collection of the production alias to preserve it for safe rollback tracking.
    uri: "http://{{ inputs.typesense_host }}:{{ inputs.typesense_port }}/aliases/{{ inputs.alias_name }}"
    method: GET
    headers:
      X-TYPESENSE-API-KEY: "{{ secret('TYPESENSE_API_KEY') }}"
    options:
      allowFailed: true
    allowFailure: true

  - id: stage_new_collection
    type: io.kestra.plugin.core.http.Request
    description: Create a fresh versioned collection with explicit field definitions and facet indexing before ingesting documents.
    uri: "http://{{ inputs.typesense_host }}:{{ inputs.typesense_port }}/collections"
    method: POST
    contentType: application/json
    headers:
      X-TYPESENSE-API-KEY: "{{ secret('TYPESENSE_API_KEY') }}"
    body: |
      {
        "name": "{{ inputs.alias_name }}_v{{ execution.id | slice(0, 8) }}",
        "fields": [
          {"name": "id", "type": "string"},
          {"name": "name", "type": "string"},
          {"name": "description", "type": "string"},
          {"name": "brand", "type": "string", "facet": true},
          {"name": "category", "type": "string", "facet": true},
          {"name": "price", "type": "float", "facet": true},
          {"name": "popularity", "type": "float"},
          {"name": "in_stock", "type": "bool", "facet": true}
        ],
        "default_sorting_field": "popularity"
      }

  - id: download_catalog_feed
    type: io.kestra.plugin.core.http.Download
    description: Download the source product catalog JSON into Kestra internal storage. The demo endpoint returns real sample products; swap in your PIM or commerce platform export URL for production use.
    uri: "{{ inputs.catalog_feed_url }}"

  - id: prepare_catalog_payload
    type: io.kestra.plugin.scripts.python.Script
    description: Reshape the downloaded catalog into line-delimited JSON matching the Typesense collection schema.
    inputFiles:
      catalog.json: "{{ outputs.download_catalog_feed.uri }}"
    outputFiles:
      - catalog.jsonl
    script: |
      import json

      with open("catalog.json", encoding="utf-8") as f:
          data = json.load(f)

      count = 0
      with open("catalog.jsonl", "w", encoding="utf-8") as out:
          for p in data["products"]:
              doc = {
                  "id": str(p["id"]),
                  "name": p["title"],
                  "description": p["description"],
                  "brand": p.get("brand") or "unbranded",
                  "category": p["category"],
                  "price": float(p["price"]),
                  "popularity": float(p.get("rating", 0)),
                  "in_stock": int(p.get("stock", 0)) > 0,
              }
              out.write(json.dumps(doc) + "\n")
              count += 1

      print(f"Staged {count} catalog items into catalog.jsonl")

  - id: bulk_index_catalog
    type: io.kestra.plugin.typesense.BulkIndex
    description: Stream catalog documents into the staged versioned collection in chunked HTTP batches.
    host: "{{ inputs.typesense_host }}"
    port: "{{ inputs.typesense_port }}"
    apiKey: "{{ secret('TYPESENSE_API_KEY') }}"
    collection: "{{ inputs.alias_name }}_v{{ execution.id | slice(0, 8) }}"
    https: false
    from: "{{ outputs.prepare_catalog_payload.outputFiles['catalog.jsonl'] }}"
    chunk: 100

  - id: run_canary_search
    type: io.kestra.plugin.typesense.Search
    description: Execute verification search query against staged collection to confirm full-text recall and latency SLAs.
    host: "{{ inputs.typesense_host }}"
    port: "{{ inputs.typesense_port }}"
    apiKey: "{{ secret('TYPESENSE_API_KEY') }}"
    collection: "{{ inputs.alias_name }}_v{{ execution.id | slice(0, 8) }}"
    https: false
    query: "{{ inputs.canary_query }}"
    queryBy: "name,description,category"

  - id: run_canary_facet_search
    type: io.kestra.plugin.typesense.FacetSearch
    description: Query facet distributions on staged collection to ensure faceting structures are intact before cutover.
    host: "{{ inputs.typesense_host }}"
    port: "{{ inputs.typesense_port }}"
    apiKey: "{{ secret('TYPESENSE_API_KEY') }}"
    collection: "{{ inputs.alias_name }}_v{{ execution.id | slice(0, 8) }}"
    https: false
    query: "*"
    queryBy: "name"
    facetBy: "{{ inputs.canary_facet_field }}"

  - id: evaluate_cutover_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluate indexing thresholds; conditionally perform atomic alias swap or abort and roll back.
    condition: "{{ (outputs.bulk_index_catalog.size >= inputs.min_expected_docs) and (outputs.run_canary_search.totalHits >= inputs.canary_min_hits) }}"
    then:
      - id: atomic_alias_cutover
        type: io.kestra.plugin.core.http.Request
        description: Atomically update the production alias pointer in Typesense memory without interrupting search traffic.
        uri: "http://{{ inputs.typesense_host }}:{{ inputs.typesense_port }}/aliases/{{ inputs.alias_name }}"
        method: PUT
        contentType: application/json
        headers:
          X-TYPESENSE-API-KEY: "{{ secret('TYPESENSE_API_KEY') }}"
        body: |
          {
            "collection_name": "{{ inputs.alias_name }}_v{{ execution.id | slice(0, 8) }}"
          }

      - id: evaluate_previous_collection_cleanup
        type: io.kestra.plugin.core.flow.If
        description: Check whether the superseded collection should be permanently dropped or preserved for rollback.
        condition: "{{ inputs.retire_previous_collection and (outputs.inspect_current_alias.code == 200) and (fromJson(outputs.inspect_current_alias.body).collection_name != (inputs.alias_name ~ '_v' ~ (execution.id | slice(0, 8)))) }}"
        then:
          - id: delete_superseded_collection
            type: io.kestra.plugin.core.http.Request
            description: Drop previous physical collection to reclaim cluster RAM and storage capacity.
            uri: "http://{{ inputs.typesense_host }}:{{ inputs.typesense_port }}/collections/{{ fromJson(outputs.inspect_current_alias.body).collection_name }}"
            method: DELETE
            headers:
              X-TYPESENSE-API-KEY: "{{ secret('TYPESENSE_API_KEY') }}"

        else:
          - id: log_retention_decision
            type: io.kestra.plugin.core.log.Log
            description: Log collection preservation status for operational auditability.
            message: >-
              Previous collection {{ outputs.inspect_current_alias.code == 200 ? fromJson(outputs.inspect_current_alias.body).collection_name : 'none' }} retained for rollback safety.

      - id: log_cutover_success
        type: io.kestra.plugin.core.log.Log
        description: Record successful zero-downtime cutover metadata into Kestra execution logs.
        message: >-
          SUCCESS: Typesense alias '{{ inputs.alias_name }}' atomically cut over to '{{ inputs.alias_name }}_v{{ execution.id | slice(0, 8) }}' (Indexed: {{ outputs.bulk_index_catalog.size }} docs, Canary hits: {{ outputs.run_canary_search.totalHits }}).

    else:
      - id: abort_and_delete_staged_collection
        type: io.kestra.plugin.core.http.Request
        description: Validation failed. Delete defective staged collection to avoid disk sprawl; live alias is untouched.
        uri: "http://{{ inputs.typesense_host }}:{{ inputs.typesense_port }}/collections/{{ inputs.alias_name }}_v{{ execution.id | slice(0, 8) }}"
        method: DELETE
        headers:
          X-TYPESENSE-API-KEY: "{{ secret('TYPESENSE_API_KEY') }}"

      - id: alert_canary_gate_failure
        type: io.kestra.plugin.core.log.Log
        description: Emit error audit log detailing why the staged collection failed validation criteria.
        level: ERROR
        message: >-
          REINDEX ABORTED: Staged collection '{{ inputs.alias_name }}_v{{ execution.id | slice(0, 8) }}' failed canary validation (Indexed: {{ outputs.bulk_index_catalog.size }}/{{ inputs.min_expected_docs }}, Canary hits: {{ outputs.run_canary_search.totalHits }}/{{ inputs.canary_min_hits }}). Live alias '{{ inputs.alias_name }}' remains active.

errors:
  - id: emergency_cleanup_staged_collection
    type: io.kestra.plugin.core.http.Request
    description: Safety task ensuring orphaned staged collection is deleted if an unhandled error terminates the flow.
    uri: "http://{{ inputs.typesense_host }}:{{ inputs.typesense_port }}/collections/{{ inputs.alias_name }}_v{{ execution.id | slice(0, 8) }}"
    method: DELETE
    options:
      allowFailed: true
    allowFailure: true
    headers:
      X-TYPESENSE-API-KEY: "{{ secret('TYPESENSE_API_KEY') }}"

  - id: log_fatal_failure
    type: io.kestra.plugin.core.log.Log
    description: Record execution failure details in workflow logs.
    level: ERROR
    message: >-
      FATAL: Zero-downtime reindexing pipeline failed unexpectedly during execution {{ execution.id }}. Production alias was protected.

extend:
  title: Zero-Downtime Typesense Collection Reindexing and Alias Cutover Gate
  metaTitle: Typesense Zero-Downtime Collection Alias Reindex | Kestra
  shortDescription: Rebuild Typesense search collections without downtime. Create a versioned collection, bulk index records, verify search and facet canaries, and atomically swap the alias.
  metaDescription: Rebuild Typesense search collections without downtime. Create a versioned collection, bulk index records, verify canaries, and atomically swap the alias.
  description: |
    Production search engines power revenue-critical user experiences like e-commerce storefronts, SaaS navigation, and documentation search. In Typesense, modifying an existing schema (such as adding facet fields, updating token separators, or re-weighting ranking fields) cannot be performed in-place on a live collection without locking queries or risking corrupt search results.

    This blueprint implements the industry-standard Zero-Downtime Collection Aliasing pattern for Typesense. It creates an isolated, versioned physical collection, ingests and bulk-indexes incoming records using `io.kestra.plugin.typesense.BulkIndex`, and executes automated search recall and facet distribution canaries via `io.kestra.plugin.typesense.Search` and `io.kestra.plugin.typesense.FacetSearch`. Only when every quality gate passes does Kestra atomically re-point the production alias (`PUT /aliases/{alias_name}`) in Typesense memory. If any canary fails, the staged collection is purged immediately, ensuring that customer-facing search queries never experience a single dropped request or degraded result set.

    ## How it works

    1. `inspect_current_alias` (`io.kestra.plugin.core.http.Request`) queries `GET /aliases/{{ inputs.alias_name }}` to capture the name of the currently active physical collection for rollback reference and optional post-cutover retirement.
    2. `stage_new_collection` (`io.kestra.plugin.core.http.Request`) declares a new timestamped versioned collection `{{ inputs.alias_name }}_v{{ execution.id | slice(0, 8) }}` with the required field schema, sorting parameters, and facet definitions.
    3. `download_catalog_feed` (`io.kestra.plugin.core.http.Download`) fetches the product catalog from `catalog_feed_url` into Kestra internal storage. `prepare_catalog_payload` (`io.kestra.plugin.scripts.python.Script`) reshapes it into line-delimited JSON (`catalog.jsonl`) matching the staged collection's schema.
    4. `bulk_index_catalog` (`io.kestra.plugin.typesense.BulkIndex`) streams the JSONL records into the newly staged versioned collection in chunked HTTP batches, returning the verified count of indexed documents under `outputs.bulk_index_catalog.size`.
    5. `run_canary_search` (`io.kestra.plugin.typesense.Search`) executes a representative full-text search against the new collection, validating query response latency and ensuring hit counts meet `inputs.canary_min_hits`.
    6. `run_canary_facet_search` (`io.kestra.plugin.typesense.FacetSearch`) runs an aggregation search against `inputs.canary_facet_field` to confirm that faceted navigation structures indexed correctly.
    7. `evaluate_cutover_gate` (`io.kestra.plugin.core.flow.If`) branches on the canary outcomes:
       - **Then (Validation Passed)**: `atomic_alias_cutover` issues `PUT /aliases/{{ inputs.alias_name }}` with `{"collection_name": "<new_collection>"}`, switching live traffic in an instant memory operation. If `retire_previous_collection` is enabled, `delete_superseded_collection` drops the old collection; otherwise, it is retained for instant manual rollback.
       - **Else (Validation Failed)**: `abort_and_delete_staged_collection` purges the staged collection from the cluster, leaving the live alias completely untouched.
    8. The flow-level `errors` block intercepts any unhandled task failures and guarantees cleanup of orphaned staged collections so disk capacity is never leaked.

    ## What you get

    - Zero downtime for customer queries during schema upgrades, catalog rebuilds, and full data reloads.
    - Automated canary gating that prevents broken or empty collections from reaching the storefront.
    - Atomic alias switching via Typesense's native `/aliases` API.
    - Safe collection retirement options with rollback protection.
    - Self-contained execution that cleans up staged artifacts on both success and failure.

    ## Who it's for

    - Search Platform Engineers managing Typesense, Meilisearch, or Elasticsearch clusters.
    - E-commerce Operations Teams requiring uninterrupted storefront search during catalog refreshes.
    - Data Engineers orchestrating ETL-to-search pipelines with schema evolution.

    ## Why orchestrate this with Kestra

    Scripting zero-downtime reindexing with bash or ad-hoc scripts frequently leads to ghost collections, failed rollbacks, or unnoticed canary failures when scripts crash halfway through. Kestra manages the complete multi-step lifecycle with state tracking, native secret masking, flow control branching, and automated error handlers. If network glitches or API errors occur during bulk ingestion, Kestra can retry transient operations while guaranteeing that defective collections never receive production traffic.

    ## Prerequisites

    - A running Typesense cluster (v0.25+ or v27+) reachable by the Kestra worker.
    - An admin API key with permission to create collections, manage aliases, and index documents.

    ### Secrets

    - `TYPESENSE_API_KEY`: Typesense administrative API key used for authentication across all tasks.
    - `TYPESENSE_REINDEX_WEBHOOK_KEY`: Secret authentication key for the event-driven webhook trigger.

    ## Quick start

    1. Start a local Typesense container with Docker:

       ```bash
       docker run -d -p 8108:8108 \
         -v /tmp/typesense-data:/data \
         typesense/typesense:27.1 \
         --data-dir /data \
         --api-key=test-typesense-api-key \
         --enable-cors
       ```

    2. Configure the required secrets in your Kestra namespace:
       - `TYPESENSE_API_KEY`: `test-typesense-api-key`
       - `TYPESENSE_REINDEX_WEBHOOK_KEY`: `secret-webhook-key-12345`
    3. Execute the flow manually in Kestra with the default `catalog_feed_url` (a public demo endpoint) or trigger it via the webhook endpoint once enabled.
    4. Verify in the execution logs that the versioned collection was staged, passed canary queries, and atomically assumed the `products` alias.

    ## How to extend

    - Point `catalog_feed_url` at your PIM or commerce platform's export endpoint, and adjust the field mapping in `prepare_catalog_payload` to match its JSON shape.
    - Add automated Slack or PagerDuty notification tasks inside the `then` and `else` blocks to broadcast cutover summaries to your engineering team.
    - Enable the `reindex_webhook` and `weekly_reindex_schedule` triggers to run automated off-peak maintenance sweeps once `catalog_feed_url` points at a real feed.

    ## Links

    - [Typesense Plugin Documentation](https://kestra.io/plugins/plugin-typesense)
    - [Typesense Collection Aliases API Guide](https://typesense.org/docs/latest/api/collection-aliases.html)
    - [Typesense Bulk Document Import API](https://typesense.org/docs/latest/api/documents.html#import-documents)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - Day 2 Operations
  ee: false
  demo: false
