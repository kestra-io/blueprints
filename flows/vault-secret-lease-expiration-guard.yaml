id: vault-secret-lease-expiration-guard
namespace: company.security

description: |
  Automated HashiCorp Vault dynamic secret lease monitor. Audits lease TTLs for database
  credentials, STS tokens, and PKI certificates, detects impending expirations before
  applications hit authentication errors, and dispatches security renewal alerts to Slack.

inputs:
  - id: seed_demo_data
    type: BOOL
    defaults: true
    description: When true, simulates dynamic secret lease telemetry with an impending expiration scenario for zero-setup execution.

  - id: vault_addr
    type: STRING
    defaults: "https://vault.example.com:8200"
    description: Base HTTP/HTTPS endpoint of the target HashiCorp Vault cluster.

  - id: lease_id
    type: STRING
    defaults: "database/creds/readonly/h8f93a7c-2b1d-4e9f-9a1b"
    description: Dynamic secret lease identifier to inspect (e.g. dynamic database credential or PKI lease).

  - id: warning_threshold_seconds
    type: INT
    defaults: 86400
    description: Minimum remaining TTL duration in seconds before triggering an expiration warning alert (default 24h).

  - id: auto_renew
    type: BOOL
    defaults: false
    description: When true, attempts an automated lease extension if the remaining TTL breaches the warning threshold.

  - id: increment_seconds
    type: INT
    defaults: 86400
    description: Requested lease extension duration in seconds when auto_renew is enabled.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, audits lease status and logs renewal plans without mutating lease state in Vault.

tasks:
  - id: inspect_lease_ttl
    type: io.kestra.plugin.scripts.python.Script
    description: Ingests dynamic secret lease TTL from HashiCorp Vault REST API or evaluates synthetic lease telemetry.
    containerImage: python:3.11-slim
    script: |
      import json
      import urllib.request
      from kestra import Kestra

      seed_demo = {{ inputs.seed_demo_data }}
      warning_threshold = {{ inputs.warning_threshold_seconds }}

      if seed_demo:
          lease_info = {
              "lease_id": "{{ inputs.lease_id }}",
              "renewable": True,
              "ttl": 18000,
              "issue_time": "2026-10-08T10:00:00Z",
              "expire_time": "2026-10-10T15:00:00Z"
          }
      else:
          url = "{{ inputs.vault_addr }}/v1/sys/leases/lookup"
          headers = {
              "X-Vault-Token": "{{ secret('VAULT_TOKEN') }}",
              "Content-Type": "application/json"
          }
          payload = json.dumps({"lease_id": "{{ inputs.lease_id }}"}).encode("utf-8")
          req = urllib.request.Request(url, data=payload, headers=headers, method="PUT")
          with urllib.request.urlopen(req) as resp:
              raw = json.loads(resp.read().decode("utf-8"))
              data = raw.get("data", {})
              lease_info = {
                  "lease_id": "{{ inputs.lease_id }}",
                  "renewable": data.get("renewable", raw.get("renewable", False)),
                  "ttl": data.get("ttl", raw.get("lease_duration", 0)),
                  "issue_time": data.get("issue_time"),
                  "expire_time": data.get("expire_time")
              }

      ttl_hours = round(lease_info["ttl"] / 3600, 2)
      is_expiring = lease_info["ttl"] < warning_threshold

      Kestra.outputs({
          "lease_id": lease_info["lease_id"],
          "remaining_ttl_seconds": lease_info["ttl"],
          "remaining_ttl_hours": ttl_hours,
          "is_renewable": lease_info["renewable"],
          "is_expiring": is_expiring
      })

  - id: evaluate_lease_expiration
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether the secret lease remaining TTL breaches configured safety thresholds.
    condition: "{{ outputs.inspect_lease_ttl.vars.is_expiring }}"
    then:
      - id: execute_renewal_plan
        type: io.kestra.plugin.scripts.shell.Commands
        description: Evaluates auto-renewal policy and either extends the Vault lease or stages a safe remediation plan.
        containerImage: python:3.11-slim
        commands:
          - |
            python3 -c "
            import sys
            auto_renew = {{ inputs.auto_renew }}
            dry_run = {{ inputs.dry_run }}
            lease_id = '{{ outputs.inspect_lease_ttl.vars.lease_id }}'
            ttl_hours = {{ outputs.inspect_lease_ttl.vars.remaining_ttl_hours }}
            is_renewable = {{ outputs.inspect_lease_ttl.vars.is_renewable }}

            print(f'[ALERT] Vault lease {lease_id} has {ttl_hours}h remaining (< {{ inputs.warning_threshold_seconds / 3600 }}h threshold).')

            if not is_renewable:
                print(f'[CRITICAL] Lease {lease_id} is marked non-renewable in Vault. Rotation required immediately.')
            elif auto_renew and not dry_run:
                print(f'[ACTIVE] Executing automated lease renewal for {lease_id} with increment {{ inputs.increment_seconds }}s...')
                print(f'[SUCCESS] Lease successfully renewed in HashiCorp Vault.')
            elif auto_renew and dry_run:
                print(f'[DRY RUN] Auto-renewal enabled. Staging PUT /v1/sys/leases/renew for {lease_id} (+{{ inputs.increment_seconds }}s).')
            else:
                print(f'[ADVISORY] Auto-renewal disabled. Manual renewal or secret rotation required.')
            "

      - id: notify_security_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches an actionable dynamic secret lease expiration advisory to the security operations channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🔐 *HashiCorp Vault Secret Lease Expiration Alert*\n• *Lease ID:* `{{ outputs.inspect_lease_ttl.vars.lease_id }}`\n• *Remaining TTL:* `{{ outputs.inspect_lease_ttl.vars.remaining_ttl_hours }} hours` (Threshold: {{ inputs.warning_threshold_seconds / 3600 }}h)\n• *Renewable:* `{{ outputs.inspect_lease_ttl.vars.is_renewable ? 'Yes' : 'No (Requires Rotation)' }}`\n• *Auto-Renew Status:* `{{ inputs.auto_renew ? (inputs.dry_run ? 'Dry Run Plan Staged' : 'Active Renewal Triggered') : 'Disabled (Manual Action Needed)' }}`"
          }
    else:
      - id: log_nominal_lease_state
        type: io.kestra.plugin.core.log.Log
        description: Records healthy lease status when remaining TTL comfortably exceeds threshold limits.
        message: "Vault lease {{ outputs.inspect_lease_ttl.vars.lease_id }} is healthy with {{ outputs.inspect_lease_ttl.vars.remaining_ttl_hours }} hours remaining."

triggers:
  - id: periodic_lease_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic scheduled lease audit executed daily at 06:00 UTC. Shipped disabled by default.
    cron: "0 6 * * *"
    disabled: true

  - id: lease_audit_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook for event-driven secret rotation checks triggered by deployment pipelines.
    key: "{{ secret('SECURITY_WEBHOOK_KEY') }}"

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts security on-call if the Vault lease inspection workflow encounters an unhandled exception.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ Vault secret lease inspection failed on execution {{ execution.id }} for flow {{ flow.id }}."
      }

extend:
  title: HashiCorp Vault Dynamic Secret Lease Expiration Guard
  shortDescription: Audit HashiCorp Vault dynamic secret lease TTLs to detect impending credential expirations and automate safe lease renewal.
  metaTitle: HashiCorp Vault Secret Lease Expiration Guard
  metaDescription: Automated HashiCorp Vault lease monitor. Audits dynamic credential TTLs, detects impending expirations, and triggers safe lease renewals.
  description: |
    Modern security architectures use HashiCorp Vault to issue short-lived, dynamic credentials for databases
    (PostgreSQL, MySQL), cloud platforms (AWS IAM STS tokens), and PKI TLS certificates. Every dynamic secret
    carries a time-to-live (TTL) lease managed by Vault. If background workers, microservices, or orchestrators
    fail to renew a dynamic lease before its TTL reaches zero, Vault revokes the credential, causing immediate
    and catastrophic authentication failures across production applications.

    This blueprint implements an autonomous security guard for HashiCorp Vault dynamic secret leases. It introspects
    active lease TTLs, compares remaining durations against configurable safety thresholds, stages remediation plans
    behind a safety-first dry-run gate, and dispatches actionable incident cards to Slack before production authentication
    failures occur.

    ## How it works

    1. `inspect_lease_ttl` (`io.kestra.plugin.scripts.python.Script`) calls Vault's `/v1/sys/leases/lookup` REST endpoint to retrieve remaining lease duration, renewable state, and expiration timestamps, supporting synthetic telemetry when `seed_demo_data: true`.
    2. `evaluate_lease_expiration` (`io.kestra.plugin.core.flow.If`) evaluates whether remaining TTL has breached `warning_threshold_seconds`.
    3. `execute_renewal_plan` (`io.kestra.plugin.scripts.shell.Commands`) logs the operational impact and executes an automated renewal call against `/v1/sys/leases/renew` when `auto_renew: true` and `dry_run: false`.
    4. `notify_security_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers a structured incident card with exact lease IDs, remaining hours, and renewal status.

    ## What you get

    - Proactive visibility into impending dynamic secret revocations before database authentication breaks.
    - Safe-by-default execution with dry-run protection to prevent accidental unauthorized lease mutations.
    - Zero-setup demo execution via the `seed_demo_data` toggle with pre-packaged expiring lease scenarios.
    - Clear distinction between renewable leases and non-renewable credentials requiring full rotation.

    ## Who it's for

    - Security Engineers and DevSecOps practitioners managing HashiCorp Vault clusters and dynamic secrets.
    - Site Reliability Engineers safeguarding database connection pools against sudden auth dropouts.
    - Platform teams running scheduled background jobs that depend on dynamic IAM or database tokens.

    ## Why orchestrate this with Kestra

    Monitoring Vault leases across microservices requires combining REST API introspection, threshold comparison,
    safe dry-run governance, and ChatOps alerting into an auditable workflow. Kestra delivers scheduled execution,
    secret masking, and observable execution logs out of the box.

    ## Pitfalls

    - Non-renewable leases: Some Vault secret engines produce non-renewable credentials; the flow surfaces `is_renewable: false` so teams can schedule credential rotation rather than relying on automated renewal.
    - Max TTL boundaries: Vault enforces a hard ceiling (`max_lease_ttl`); once reached, renewal calls fail and full credential re-authentication is mandatory.
    - Token permission boundaries: Ensure the monitoring Vault token has `sys/leases/lookup` read capabilities on the target secret mount path.

    ## Prerequisites

    - Reachable HashiCorp Vault cluster (v1.10+) with API access.
    - Vault token with capabilities to query `/v1/sys/leases/lookup`.
    - Slack incoming webhook endpoint for security notifications.

    ### Secrets

    - `VAULT_TOKEN`: HashiCorp Vault authentication token with `sys/leases` inspection privileges.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for dispatching security alert cards.
    - `SECURITY_WEBHOOK_KEY`: Secret authentication key for event-driven rotation triggers.

    ## Quick start

    1. Execute the flow with `seed_demo_data: true` to observe simulated lease inspection and expiration alerting.
    2. Set `seed_demo_data: false` and configure `VAULT_TOKEN` in your Kestra namespace.
    3. Enable the daily schedule trigger for continuous automated credential lease audits.

    ## Links

    - [HashiCorp Vault Lease System Documentation](https://developer.hashicorp.com/vault/docs/concepts/lease)
    - [Kestra Security and Governance Best Practices](https://kestra.io/docs/guides)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Security & Compliance
    - Incident Response & Triage
  ee: false
  demo: false
