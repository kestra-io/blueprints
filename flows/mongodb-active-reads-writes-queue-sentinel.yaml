id: mongodb-active-reads-writes-queue-sentinel
namespace: company.data

inputs:
  - id: mongo_uri
    type: STRING
    defaults: "mongodb://mongodb.internal:27017"
    description: MongoDB connection string URI.
  - id: active_clients_threshold
    type: INT
    defaults: 20
    description: Maximum acceptable concurrent active reading/writing clients before alerting.

tasks:
  - id: query_active_queues
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pymongo==4.15.3
      - kestra==2.0.0
    script: |
      from pymongo import MongoClient
      import sys
      from kestra import Kestra

      mongo_uri = "{{ inputs.mongo_uri }}"
      try:
          client = MongoClient(mongo_uri, serverSelectionTimeoutMS=5000)
          db = client.admin
          status = db.command("serverStatus")
          active = status.get("globalLock", {}).get("activeClients", {})
          current_ops = db.command("currentOp", {"active": True, "secs_running": {"$gte": 5}}).get("inprog", [])

          total_active = int(active.get("total", 0))
          readers = int(active.get("readers", 0))
          writers = int(active.get("writers", 0))
          slow_ops = len(current_ops)

          print(f"Total active: {total_active}, readers: {readers}, writers: {writers}, slow ops: {slow_ops}")

          Kestra.outputs({
              "total_active": total_active,
              "readers": readers,
              "writers": writers,
              "slow_ops": slow_ops
          })
      except Exception as e:
          print(f"Error querying MongoDB active queues: {e}", file=sys.stderr)
          sys.exit(1)

  - id: evaluate_queue_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_active_queues.vars.total_active | int >= inputs.active_clients_threshold or outputs.query_active_queues.vars.slow_ops | int > 5 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#mongodb-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 MongoDB Concurrency Queue Saturation Alert",
                "text": "MongoDB node `{{ inputs.mongo_uri }}` active queue is saturated! Active clients: *{{ outputs.query_active_queues.vars.total_active }}* (Readers: *{{ outputs.query_active_queues.vars.readers }}*, Writers: *{{ outputs.query_active_queues.vars.writers }}*). Long-running operations (>5s): *{{ outputs.query_active_queues.vars.slow_ops }}*. Impact: Unindexed queries or write lock contention are queuing client requests, leading to application timeouts.",
                "footer": "Kestra Database Sentinel • MongoDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#mongodb-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MongoDB Active Reads and Writes Queue Saturation Sentinel Pipeline Failure",
            "text": "Failed to query MongoDB active queues. Check host reachability and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: total_active
    type: INT
    value: "{{ outputs.query_active_queues.vars.total_active }}"
  - id: readers
    type: INT
    value: "{{ outputs.query_active_queues.vars.readers }}"
  - id: writers
    type: INT
    value: "{{ outputs.query_active_queues.vars.writers }}"
  - id: slow_ops
    type: INT
    value: "{{ outputs.query_active_queues.vars.slow_ops }}"

extend:
  metaDescription: "Monitors MongoDB globalLock active client queues and slow operations to detect query concurrency saturation."
  metaTitle: MongoDB Active Reads and Writes Queue Saturation Sentinel with Kestra
  title: MongoDB Active Reads and Writes Queue Saturation Sentinel
  shortDescription: Monitors MongoDB globalLock active client queues and slow operations to detect query concurrency saturation.
  description: |
    ## How it works
    This workflow inspects `db.serverStatus().globalLock.activeClients` and queries `db.currentOp` for active operations running for more than 5 seconds via a Python script in Docker. When application traffic spikes or unindexed queries perform large collection scans, active reading and writing threads accumulate, exhausting WiredTiger execution tickets. When active client queues saturate, an incident alert is sent to Slack.

    ## What you get
    - Real-time visibility into active concurrent query threads in MongoDB.
    - Detection of long-running operations (>5s) causing thread head-of-line blocking.
    - Prevents cascading HTTP 504 timeouts across frontend microservices.

    ## Who it's for
    - SREs and Backend Engineers maintaining high-traffic MongoDB clusters.
    - Database Administrators diagnosing sudden latency degradation.

    ## Why orchestrate this with Kestra
    - **Live Concurrency Telemetry**: Sample active clients and slow operations in real time.
    - **Early Bottleneck Isolation**: Differentiate between read-heavy spikes and write lock contention.
    - **Automated Notification**: Rapid escalation to on-call database engineers.

    ## Prerequisites
    - MongoDB server accessible from Kestra worker.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure `mongo_uri` and queue threshold.
    3. Run the workflow to inspect concurrency health.

    ## How to extend
    - Automatically capture detailed `currentOp()` query shapes for slow operations into Slack.
    - Terminate queries exceeding extreme duration limits (`db.killOp()`) for authorized workflows.

    ## Links
    - [MongoDB currentOp Documentation](https://www.mongodb.com/docs/manual/reference/method/db.currentOp/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-script-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - ELT & Data Landing
  ee: false
  demo: false
