id: aws-iam-inactive-access-key-sentinel
namespace: company.security

inputs:
  - id: max_inactive_days_threshold
    type: INT
    defaults: 90
    description: Maximum allowable days since last use before an active access key is categorized as dormant.

tasks:
  - id: audit_iam_access_keys
    type: io.kestra.plugin.aws.cli.AwsCLI
    runner: PROCESS
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws iam list-users --output json > iam_users.json
        python3 -c "
        import json, subprocess, datetime
        with open('iam_users.json') as f:
            users = json.load(f).get('Users', [])
        dormant_keys = []
        now = datetime.datetime.utcnow()
        for u in users[:25]:
            user_name = u.get('UserName')
            keys_cmd = f'aws iam list-access-keys --user-name {user_name} --output json'
            res = subprocess.run(keys_cmd, shell=True, capture_output=True, text=True)
            if res.returncode == 0:
                keys = json.loads(res.stdout).get('AccessKeyMetadata', [])
                for k in keys:
                    if k.get('Status') == 'Active':
                        key_id = k.get('AccessKeyId')
                        used_cmd = f'aws iam get-access-key-last-used --access-key-id {key_id} --output json'
                        u_res = subprocess.run(used_cmd, shell=True, capture_output=True, text=True)
                        if u_res.returncode == 0:
                            last_used_info = json.loads(u_res.stdout).get('AccessKeyLastUsed', {})
                            last_date_str = last_used_info.get('LastUsedDate')
                            if last_date_str:
                                last_date = datetime.datetime.strptime(last_date_str[:10], '%Y-%m-%d')
                                days_inactive = (now - last_date).days
                                if days_inactive >= {{ inputs.max_inactive_days_threshold }}:
                                    dormant_keys.append({
                                        'user': user_name,
                                        'key_id': key_id,
                                        'days_inactive': days_inactive
                                    })
                            else:
                                created_date_str = k.get('CreateDate')[:10]
                                created_date = datetime.datetime.strptime(created_date_str, '%Y-%m-%d')
                                days_since_created = (now - created_date).days
                                if days_since_created >= {{ inputs.max_inactive_days_threshold }}:
                                    dormant_keys.append({
                                        'user': user_name,
                                        'key_id': key_id,
                                        'days_inactive': days_since_created
                                    })
        result = {
            'dormant_keys_count': len(dormant_keys),
            'dormant_keys': dormant_keys[:5],
            'alert_triggered': len(dormant_keys) > 0
        }
        with open('iam_summary.json', 'w') as out:
            json.dump(result, out)
        print('IAM audit:', result)
        "
    outputFiles:
      - iam_summary.json

  - id: evaluate_dormant_keys
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.audit_iam_access_keys.outputFiles['iam_summary.json'])).alert_triggered }}"
    then:
      - id: alert_secops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":shield: *AWS IAM Hygiene Alert*: Found {{ json(read(outputs.audit_iam_access_keys.outputFiles['iam_summary.json'])).dormant_keys_count }} active access keys unused for over {{ inputs.max_inactive_days_threshold }} days. Deactivate or delete dormant credentials to minimize attack surfaces."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *IAM Sentinel Execution Failure*: Failed to audit IAM user access keys."
      }

triggers:
  - id: weekly_iam_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true

extend:
  title: AWS IAM Dormant Access Key and Credential Hygiene Sentinel
  shortDescription: Audits AWS IAM user access keys to identify dormant or stale credentials unused for over 90 days.
  description: |
    ## How it works
    This sentinel leverages `AwsCLI` to list IAM users and inspect their active programmatic access keys. It queries `get-access-key-last-used` to determine exact last-activity timestamps, warning security administrators about forgotten credentials that expand the account attack surface.

    ## What you get
    - Continuous validation of IAM credential lifecycle and rotation policies.
    - Early prevention of credential stuffing and API key exfiltration risks.
    - Automated Slack delivery tracking user names, key IDs, and days of inactivity.

    ## Who it's for
    - Security operations (SecOps) teams and cloud governance administrators.
    - Compliance officers auditing CIS AWS Foundations Benchmark compliance.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled operational health checks with native error handling, secret injection, and multi-channel alerting.

    ## Prerequisites
    - AWS IAM credentials with `iam:ListUsers`, `iam:ListAccessKeys`, and `iam:GetAccessKeyLastUsed` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure threshold days and credentials.
    3. Run manually to check current dormant credentials.

    ## How to extend
    - Automatically deactivate dormant keys via `iam:UpdateAccessKey --status Inactive` after a grace period.
    - Enforce multi-factor authentication (MFA) verification across all console users concurrently.
    - Export IAM credential reports to S3 or AWS Security Hub.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [AWS IAM Best Practices](https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html)
  tags:
    - Cloud
    - Business
  subTags:
    - Governance & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
