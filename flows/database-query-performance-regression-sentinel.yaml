id: database-query-performance-regression-sentinel
namespace: company.data.performance

description: |
  Automated database query performance regression sentinel and slow-query optimizer.
  Audits slow-query execution times and p99 latencies in DuckDB, computes query plan cost metrics
  in Python, coordinates engineering notifications sequentially, and conditionally triggers
  automated query cancellation or missing-index alerts.

labels:
  domain: data-performance
  subsystem: query-sentinel
  criticality: high-availability

inputs:
  - id: database_instance_id
    type: STRING
    defaults: "postgres-primary-prod-01"
  - id: slow_query_threshold_ms
    type: INT
    defaults: 500
  - id: observed_max_query_latency_ms
    type: INT
    defaults: 1250
  - id: active_connection_count
    type: INT
    defaults: 142
  - id: max_connection_limit
    type: INT
    defaults: 200

triggers:
  - id: hourly_query_performance_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

  - id: manual_query_audit_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "query-sentinel-webhook-token"

tasks:
  - id: init_query_sentinel_session
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: |
      [QUERY SENTINEL] Analyzing query performance on instance {{ inputs.database_instance_id }}
      Max Latency: {{ inputs.observed_max_query_latency_ms }}ms (Threshold: {{ inputs.slow_query_threshold_ms }}ms)

  - id: parallel_database_telemetry_probes
    type: io.kestra.plugin.core.flow.Parallel
    description: "Concurrently verify database primary instance and slow-query log collector availability"
    tasks:
      - id: probe_primary_postgres_health
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "PostgreSQL primary instance healthz check returned OK."

      - id: probe_slow_query_log_collector
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Slow-query log collector stream responsive."

  - id: rollup_slow_queries_duckdb
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: "Roll up top slow-running queries and execution counts in memory using DuckDB"
    sql: |
      WITH slow_query_telemetry AS (
        SELECT 'SELECT * FROM users JOIN orders WHERE ...' AS query_fingerprint, 'public.orders' AS target_table, 1250 AS p99_latency_ms, 480 AS execution_count
        UNION ALL
        SELECT 'SELECT SUM(amount) FROM ledger WHERE ...' AS query_fingerprint, 'public.ledger' AS target_table, 820 AS p99_latency_ms, 1250 AS execution_count
        UNION ALL
        SELECT 'SELECT * FROM audit_logs ORDER BY ...' AS query_fingerprint, 'public.audit_logs' AS target_table, 610 AS p99_latency_ms, 95 AS execution_count
      )
      SELECT
        query_fingerprint,
        target_table,
        p99_latency_ms,
        execution_count
      FROM slow_query_telemetry
      ORDER BY p99_latency_ms DESC;
    fetchType: FETCH

  - id: evaluate_query_execution_cost
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: |
      Evaluated slow queries. Max latency: {{ inputs.observed_max_query_latency_ms }}ms.
      Connection pool utilization: {{ inputs.active_connection_count }} / {{ inputs.max_connection_limit }} ({{ (inputs.active_connection_count / inputs.max_connection_limit) * 100 }}%)

  - id: sequential_engineering_notification_sync
    type: io.kestra.plugin.core.flow.Sequential
    description: "Sequentially update database telemetry dashboard and engineering Slack channel"
    tasks:
      - id: notify_slack_db_reliability_channel
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Dispatched database performance regression report to SRE Slack channel."

      - id: update_db_performance_dashboard
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Updated Grafana DB performance dashboard metrics for {{ inputs.database_instance_id }}."

  - id: route_query_remediation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.observed_max_query_latency_ms > inputs.slow_query_threshold_ms }}"
    then:
      - id: execute_query_optimization_alert
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "Performance regression detected! Max query latency ({{ inputs.observed_max_query_latency_ms }}ms) exceeds threshold. Dispatching missing-index and query plan optimization alert."
    else:
      - id: log_optimal_query_performance
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "All database queries executing within normal latency tolerances."

  - id: finalize_query_sentinel_run
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "Completed database query performance sentinel run for execution {{ execution.id }}"