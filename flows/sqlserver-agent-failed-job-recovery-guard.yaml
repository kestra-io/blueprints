id: sqlserver-agent-failed-job-recovery-guard
namespace: company.team

description: |
  Find SQL Server Agent jobs that stopped protecting the instance. A maintenance
  job that was disabled during an incident and never re-enabled or whose last run
  failed, simply does not run, so there is no error to see, only the slow build up
  of whatever it was preventing: an unbacked up database, a log that never
  truncates, an integrity check that never runs. The audit reads sysjobs and
  sysjobhistory in msdb and flags only the jobs on an operator allowlist that are
  disabled or whose last outcome was failure. Behind a safe by default gate and a
  human approval it re-enables the disabled ones with sp_update_job, starts each
  one now with sp_start_job, polls sysjobactivity until the run finishes, then
  re-reads sysjobhistory and fails the run if any targeted job is still disabled or
  its fresh run failed again. Jobs off the allowlist are never touched, so a job
  disabled on purpose stays disabled.

inputs:
  - id: url
    type: STRING
    displayName: JDBC URL
    description: Points at the SQL Server instance. The audit reads msdb, so connecting to the instance is enough.
    defaults: "jdbc:sqlserver://localhost:1433"

  - id: user
    type: STRING
    displayName: SQL Server login
    defaults: sa

  - id: password
    type: STRING
    displayName: SQL Server password
    description: Defaults to the SQLSERVER_PASSWORD secret. Override only for local testing.
    defaults: "{{ secret('SQLSERVER_PASSWORD') }}"

  - id: managed_jobs
    type: STRING
    displayName: Managed job allowlist
    description: Comma separated list of Agent job names that must stay enabled and succeeding, the real scheduled maintenance (backups, log backups, index rebuilds, integrity checks). Only these are flagged and only these are ever re-enabled or re-run. A job not on this list is left alone, so a job disabled on purpose is never blanket enabled.
    defaults: ""

  - id: include_failed
    type: BOOL
    displayName: Also flag last run failures
    description: Keep true to flag an allowlisted job whose last outcome was failure, not only the disabled ones. Set false to flag disabled jobs only.
    defaults: true

  - id: max_wait
    type: DURATION
    displayName: Maximum wait for started jobs
    description: How long to poll sysjobactivity for the started jobs to finish before the run gives up and fails. Raise it for a long index rebuild or integrity check.
    defaults: PT3M

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Allow the re-enable and start statements to run.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, before any statement runs.
    defaults: true

variables:
  audit_sql: |
    SELECT
      j.name AS job_name,
      j.enabled,
      CASE WHEN j.enabled = 0 THEN 1 ELSE 0 END AS is_disabled,
      lh.run_status AS last_run_status,
      CASE lh.run_status
        WHEN 1 THEN 'Succeeded'
        WHEN 0 THEN 'Failed'
        WHEN 2 THEN 'Retry'
        WHEN 3 THEN 'Canceled'
        WHEN 4 THEN 'InProgress'
        ELSE 'NeverRun' END AS last_outcome,
      CONCAT(CHAR(39), REPLACE(j.name, CHAR(39), CHAR(39) + CHAR(39)), CHAR(39)) AS job_literal,
      CONCAT('EXEC msdb.dbo.sp_update_job @job_name = N', CHAR(39), REPLACE(j.name, CHAR(39), CHAR(39) + CHAR(39)), CHAR(39), ', @enabled = 1') AS enable_sql,
      CONCAT('EXEC msdb.dbo.sp_start_job @job_name = N', CHAR(39), REPLACE(j.name, CHAR(39), CHAR(39) + CHAR(39)), CHAR(39)) AS start_sql
    FROM msdb.dbo.sysjobs j
    JOIN STRING_SPLIT('{{ inputs.managed_jobs | replace({"'": "''"}) }}', ',') s
      ON j.name = LTRIM(RTRIM(s.value))
    OUTER APPLY (
      SELECT TOP 1 h.run_status
      FROM msdb.dbo.sysjobhistory h
      WHERE h.job_id = j.job_id AND h.step_id = 0
      ORDER BY h.instance_id DESC
    ) lh
    WHERE j.enabled = 0{% if inputs.include_failed %}
       OR lh.run_status = 0{% endif %}
    ORDER BY j.name

  state_sql: |
    SELECT
      j.name AS job_name,
      j.enabled,
      lh.run_status AS last_run_status,
      CASE lh.run_status
        WHEN 1 THEN 'Succeeded'
        WHEN 0 THEN 'Failed'
        WHEN 2 THEN 'Retry'
        WHEN 3 THEN 'Canceled'
        WHEN 4 THEN 'InProgress'
        ELSE 'NeverRun' END AS last_outcome
    FROM msdb.dbo.sysjobs j
    OUTER APPLY (
      SELECT TOP 1 h.run_status
      FROM msdb.dbo.sysjobhistory h
      WHERE h.job_id = j.job_id AND h.step_id = 0
      ORDER BY h.instance_id DESC
    ) lh
    WHERE j.name IN ({{ outputs.targets.values.name_list }})
    ORDER BY j.name

  verify_sql: |
    SELECT
      j.name AS job_name,
      j.enabled,
      lh.run_status AS last_run_status,
      CASE lh.run_status
        WHEN 1 THEN 'Succeeded'
        WHEN 0 THEN 'Failed'
        WHEN 2 THEN 'Retry'
        WHEN 3 THEN 'Canceled'
        WHEN 4 THEN 'InProgress'
        ELSE 'NeverRun' END AS last_outcome
    FROM msdb.dbo.sysjobs j
    OUTER APPLY (
      SELECT TOP 1 h.run_status
      FROM msdb.dbo.sysjobhistory h
      WHERE h.job_id = j.job_id AND h.step_id = 0
      ORDER BY h.instance_id DESC
    ) lh
    WHERE j.name IN ({{ outputs.targets.values.name_list }})
      AND (j.enabled = 0 OR lh.run_status IS NULL OR lh.run_status <> 1)
    ORDER BY j.name

  poll_sql: |
    SELECT COUNT(*) AS running
    FROM msdb.dbo.sysjobactivity a
    JOIN msdb.dbo.sysjobs j ON j.job_id = a.job_id
    WHERE a.session_id = (SELECT MAX(session_id) FROM msdb.dbo.syssessions)
      AND a.start_execution_date IS NOT NULL
      AND a.stop_execution_date IS NULL
      AND j.name IN ({{ outputs.targets.values.name_list }})

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.sqlserver.Query
    description: Read-only. Reads sysjobs for the enabled flag and sysjobhistory for the last job outcome (step_id 0 is the job level row). It keeps only jobs named on the managed_jobs allowlist that are disabled or, with include_failed on, whose last outcome was failure. Each row carries the sp_update_job and sp_start_job statements built in T-SQL with the job name escaped.
    url: "{{ inputs.url }}"
    username: "{{ inputs.user }}"
    password: "{{ inputs.password }}"
    trustServerCertificate: true
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: targets
    type: io.kestra.plugin.core.output.OutputValues
    description: The per job plan and the escaped name list for the re-reads. Every statement and every name literal is built in T-SQL so the server does the quoting.
    values:
      plan: "{{ outputs.audit.rows | jq('map({job: .job_name, disabled: .is_disabled, enable: .enable_sql, start: .start_sql})') | first | toJson }}"
      name_list: "{{ outputs.audit.rows | jq('map(.job_literal) | join(\",\")') | first }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      SQL Server Agent job audit on {{ inputs.url }}: {{ outputs.audit.size }} managed job(s) disabled{% if inputs.include_failed %} or last failed{% endif %}.
      {{ outputs.audit.rows | jq('map("\(.job_name) enabled=\(.enabled) last=\(.last_outcome)") | join("; ")') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'SQL Server ' ~ inputs.url ~ ': ' ~ outputs.audit.size ~ ' managed Agent job(s) not protecting the instance: ' ~ (outputs.audit.rows | jq('map("\(.job_name) enabled=\(.enabled) last=\(.last_outcome)") | join("; ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Waiting for approval to re-enable and run them.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: Hold the run until a human approves. Re-running a maintenance job has real side effects, a backup writes and an index rebuild locks, so the sequence never starts on its own.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                required: false
                description: Set true to re-enable and start the listed jobs. Anything else leaves them alone.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: remediate
                type: io.kestra.plugin.core.flow.Loop
                description: Serial on purpose. concurrencyLimit 1 keeps two sp_start_job calls from overlapping. Each statement runs as its own autocommitting Query. Every flagged job is re-enabled first (idempotent on an already enabled job) then started now.
                concurrencyLimit: 1
                values: "{{ outputs.targets.values.plan }}"
                tasks:
                  - id: enable_job
                    type: io.kestra.plugin.jdbc.sqlserver.Query
                    description: Re-enable the job through msdb.dbo.sp_update_job. A job disabled during an incident starts running on its schedule again. Setting enabled on an already enabled job is a harmless no-op.
                    url: "{{ inputs.url }}"
                    username: "{{ inputs.user }}"
                    password: "{{ inputs.password }}"
                    trustServerCertificate: true
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).enable }}"

                  - id: start_job
                    type: io.kestra.plugin.jdbc.sqlserver.Query
                    description: Start the job now through msdb.dbo.sp_start_job so there is a fresh outcome to judge. sp_start_job is asynchronous, it only requests the run, so the next step waits for it to finish.
                    url: "{{ inputs.url }}"
                    username: "{{ inputs.user }}"
                    password: "{{ inputs.password }}"
                    trustServerCertificate: true
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).start }}"

              - id: settle
                type: io.kestra.plugin.core.flow.Sleep
                description: A short settle so SQL Server Agent has picked up the start requests and sysjobactivity reflects the fresh runs before the poll reads it.
                duration: PT5S

              - id: wait_for_jobs
                type: io.kestra.plugin.core.flow.LoopUntil
                description: >-
                  Poll sysjobactivity for the current Agent session until no targeted job is still executing or max_wait runs out. A job is running when its current session row has a start but no stop. failOnMaxReached is true, so a job that never finishes in time fails the run loudly rather than being judged on a stale outcome.
                condition: "{{ outputs.poll_running.rows[0].running == 0 }}"
                checkFrequency:
                  interval: PT5S
                  maxDuration: "{{ inputs.max_wait }}"
                failOnMaxReached: true
                tasks:
                  - id: poll_running
                    type: io.kestra.plugin.jdbc.sqlserver.Query
                    description: Count the targeted jobs still executing in the current Agent session.
                    url: "{{ inputs.url }}"
                    username: "{{ inputs.user }}"
                    password: "{{ inputs.password }}"
                    trustServerCertificate: true
                    fetchType: FETCH
                    sql: "{{ render(vars.poll_sql) }}"

              - id: after_state
                type: io.kestra.plugin.jdbc.sqlserver.Query
                description: Read the enabled flag and the latest outcome back for every job the run touched, whatever the result.
                url: "{{ inputs.url }}"
                username: "{{ inputs.user }}"
                password: "{{ inputs.password }}"
                trustServerCertificate: true
                fetchType: FETCH
                sql: "{{ render(vars.state_sql) }}"

              - id: state_log
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Before: {{ outputs.audit.rows | jq('map("\(.job_name) enabled=\(.enabled) last=\(.last_outcome)") | join("; ")') | first }}.
                  After: {{ outputs.after_state.rows | jq('map("\(.job_name) enabled=\(.enabled) last=\(.last_outcome)") | join("; ")') | first }}.

              - id: reverify
                type: io.kestra.plugin.jdbc.sqlserver.Query
                description: Re-read sysjobs and sysjobhistory for the jobs the run touched and return only the ones still disabled or whose fresh outcome is not success. A job started here has a completed run by now, so its latest outcome is the fresh one.
                url: "{{ inputs.url }}"
                username: "{{ inputs.user }}"
                password: "{{ inputs.password }}"
                trustServerCertificate: true
                fetchType: FETCH
                sql: "{{ render(vars.verify_sql) }}"

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.reverify.size > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: "Still not protected after the re-enable and run: {{ outputs.reverify.rows | jq('map(\"\\(.job_name) enabled=\\(.enabled) last=\\(.last_outcome)\") | join(\", \")') | first }}. A re-run that fails again is a real finding, not a flow bug. Open the job history for the failing step, fix the underlying cause (a missing backup path, a broken login, a full disk), then run again."
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: "Re-enabled and ran: {{ fromJson(outputs.targets.values.plan) | jq('map(.job) | join(\", \")') | first }}. Every targeted job is now enabled and its fresh run succeeded."
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: "Approval was not given, so nothing was re-enabled or started. The findings stand: {{ outputs.audit.rows | jq('map(\"\\(.job_name) enabled=\\(.enabled) last=\\(.last_outcome)\") | join(\", \")') | first }}."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: >-
          Nothing matched on {{ inputs.url }}: every managed job is enabled{% if inputs.include_failed %} and its last run succeeded{% endif %}.{% if inputs.managed_jobs == '' %} The managed_jobs allowlist is empty, so no job is in scope. Set it to the backup, log backup, index and integrity jobs that must stay live.{% endif %}

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'SQL Server Agent failed job recovery guard failed on ' ~ inputs.url ~ ' (execution ' ~ execution.id ~ '). The audit could not run, a re-enable or start was rejected, a job did not finish in time or a targeted job is still disabled or failing. Check the logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Always runs in safe mode (audit only).
    cron: "0 6 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: SQL Server Agent Failed Job Recovery Guard
  shortDescription: Find SQL Server Agent maintenance jobs that are disabled or last failed on an operator allowlist, alert Slack, then re-enable and re-run them behind an approval and re-read sysjobhistory to confirm the fresh run succeeded.
  metaTitle: SQL Server Agent Failed Job Recovery Guard with Kestra
  metaDescription: Flag allowlisted Agent jobs disabled or last failed in msdb, alert Slack, then re-enable and re-run them behind an approval, then re-read sysjobhistory.
  description: |
    SQL Server Agent jobs are the instance's scheduled maintenance: full backups,
    log backups, index rebuilds, statistics updates, integrity checks. When one of
    them stops running the instance stops being protected. Because the job
    simply does not run there is no error anywhere to see. A job gets disabled
    during an incident at 2am and nobody re-enables it. A job's last run failed on
    a full disk and no alert was wired up. Either way the only visible effect is
    the slow accumulation of whatever the job was preventing: a database with no
    recent backup, a transaction log that never truncates, fragmentation that never
    gets rebuilt. The gap is usually found during the next incident, which is the
    worst time to find it.

    This blueprint reads `msdb.dbo.sysjobs` for the enabled flag and
    `msdb.dbo.sysjobhistory` for the last job outcome and flags the jobs that are
    either disabled or whose last run failed. It flags only the jobs you name on an
    allowlist, the real scheduled maintenance that must stay live, so a job that was
    disabled on purpose and left off the list is never touched. It alerts Slack.
    When you allow it and a human approves the run, it re-enables the disabled jobs
    with `sp_update_job`, starts each one now with `sp_start_job`, polls
    `sysjobactivity` until the runs finish, then reads `sysjobhistory` again and
    fails the run if any targeted job is still disabled or its fresh run failed
    again.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Only jobs named on the `managed_jobs` allowlist are ever flagged, re-enabled or started. A disabled job that is not on the list is left exactly as it is, because the flow cannot know it was not disabled on purpose.
    - Read-only by default. `dry_run` is `true` and `auto_remediate` is `false`, so a normal run only reads `msdb` and alerts.
    - A write happens only when `auto_remediate` is `true`, `dry_run` is `false` **and** a human resumes the `Pause` with `approved: true`. A pause resumed without an answer reads as a refusal.
    - Re-running a maintenance job has real side effects. A backup job writes a backup, an index rebuild takes locks, an integrity check reads the whole database. The approval gate exists so the sequence never starts in a busy window on its own.
    - The remediation loop has `concurrencyLimit: 1`, so two `sp_start_job` calls never overlap.
    - A re-run that fails again is treated as a real finding, not a flow bug. The re-read surfaces the fresh failure and fails the run honestly rather than retrying blindly, so the underlying cause gets looked at.
    - `sp_start_job` is asynchronous. The flow waits for the started jobs to finish in `sysjobactivity` before it judges them, so it never reads a stale outcome from before the re-run.

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.sqlserver.Query`, read-only) joins `sysjobs` to the allowlist with `STRING_SPLIT`, reads the last job level outcome (`step_id = 0`) from `sysjobhistory` with an `OUTER APPLY` and keeps the jobs that are disabled or, with `include_failed` on, last failed. Each row carries its own `sp_update_job` and `sp_start_job` statement, built in T-SQL with the job name escaped.
    2. `targets` (`io.kestra.plugin.core.output.OutputValues`) collects the per job plan and the escaped name list for the re-reads. `summary` (`io.kestra.plugin.core.log.Log`) logs each flagged job with its enabled flag and last outcome.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs that every managed job is enabled and last succeeded or that the allowlist is empty.
       - **findings:** `alert` posts the flagged jobs to Slack.
         - `remediate_gate` runs only when `auto_remediate` is `true` and `dry_run` is `false`.
         - `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run until a human resumes it.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs `sp_update_job @enabled = 1` then `sp_start_job` for each flagged job.
         - `settle` (`io.kestra.plugin.core.flow.Sleep`) waits briefly for Agent to pick up the runs, then `wait_for_jobs` (`io.kestra.plugin.core.flow.LoopUntil`) polls `sysjobactivity` until no targeted job is still executing.
         - `after_state` reads the enabled flag and latest outcome back for every touched job and `state_log` logs the before and after side by side.
         - `reverify` returns only the jobs still disabled or not succeeding. `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` if there are any.
         - `declined` logs the findings untouched when the approval was refused.
    4. `errors` posts a Slack alert when the audit cannot run, a statement is rejected, a job does not finish in time or a targeted job is still disabled or failing.

    ## What you get

    - A read of the one thing normal monitoring never shows: a maintenance job that is not running, told apart from one that ran and failed.
    - An allowlist so the flow acts only on the jobs you declared must be live. A job disabled on purpose stays disabled.
    - A fix that re-enables and actually runs each job, so you find out now whether it works, not at the next backup window.
    - A second read of `sysjobhistory` that fails the run when a job is still disabled or its fresh run failed again, so a job that cannot recover is never reported as fixed.
    - A Slack alert on the findings and a separate alert on failure.

    ## Who it's for

    - DBAs who want to know that every backup, log backup, index and integrity job is enabled and succeeding, without opening Agent on each instance.
    - Platform teams who had an incident, disabled a job to get through it and need a standing check that catches the one nobody re-enabled.
    - On-call engineers who want a job failure to surface and get re-run under control, with the re-run failing loudly if the cause is still there.
    - Anyone evaluating the SQL Server plugin who wants an example that drives `msdb` stored procedures and waits on `sysjobactivity` behind an approval.

    ## Why orchestrate this with Kestra

    The hard part is not re-enabling a job, it is knowing which jobs matter, doing it under control and proving it worked. Blanket enabling every disabled job would turn jobs back on that someone disabled for a reason. Running a maintenance job blind can drop a heavy rebuild into a busy afternoon. Trusting that `sp_start_job` succeeded says nothing, because it only requests the run. Kestra reads the real state from `msdb` first, acts only on an allowlist, gates the change behind two inputs and a human approval, runs the jobs one at a time, waits for them to finish, then reads `sysjobhistory` again and fails loudly if a job is still disabled or failing. The Slack alert says what was found and whether anything changed. The run history keeps every before and after.

    ## Tested end to end

    On Kestra 2.0.5 against SQL Server 2022 (16.0.4295.3) on Linux with `MSSQL_AGENT_ENABLED=True`, a local HTTP sink standing in for Slack. Four Agent jobs were seeded, each with one target server and one step. `w34sqljob_backup_ok` is enabled, its step succeeds and it was run once (healthy control, must never be flagged). `w34sqljob_index_disabled` has a step that waits six seconds then succeeds and was then disabled. `w34sqljob_integrity_fail` is enabled with a step that always `RAISERROR`s and was run once so its last outcome is a real failure. `w34sqljob_adhoc_disabled` is disabled and left off the allowlist (disabled on purpose control). Every number below was read back with `sqlcmd` against `msdb.dbo.sysjobs` and `sysjobhistory`, not from the flow log.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | allowlist `backup_ok,index_disabled,integrity_fail`, defaults | 2 flagged: `index_disabled` enabled=0, `integrity_fail` last=Failed. `backup_ok` not flagged. Slack said "No change applied". `sqlcmd` confirmed `index_disabled` still disabled |
    | 2 | same, `auto_remediate: true`, `dry_run: true` | still 2 flagged, still "No change applied". The dry run blocked the write with `auto_remediate` on |
    | 3 | same, `auto_remediate: true`, `dry_run: false`, pause resumed `approved: false` | `declined` logged the findings. `sqlcmd` confirmed `index_disabled` still disabled, `integrity_fail` still last=Failed |
    | 4 | allowlist `backup_ok,index_disabled`, `auto_remediate: true`, `dry_run: false`, `approved: true` | `index_disabled` re-enabled and run, the poll waited one iteration for the six second step, fresh outcome Succeeded. `reverify` returned 0 rows. `sqlcmd`: **`index_disabled` enabled 0 to 1, last NeverRun to Succeeded** |
    | 5 | allowlist `backup_ok` only | 0 flagged, `clean` branch. A healthy allowlisted job is never flagged |
    | 6 | allowlist `backup_ok,index_disabled,integrity_fail`, `auto_remediate: true`, `dry_run: false`, `approved: true` | `integrity_fail` re-run, fresh outcome Failed again. `reverify` returned it and `remediation_failed` **failed the run**. The `errors` block posted to Slack |
    | 7 | allowlist empty | 0 flagged, `clean` branch said the allowlist is empty |
    | 8 | unreachable host | `audit` failed on the TCP connection and the `errors` block posted to Slack |

    Across every run `w34sqljob_adhoc_disabled` stayed `enabled = 0` and was never read or touched, which proves the allowlist gates the action. `w34sqljob_backup_ok` stayed `enabled = 1` with last `Succeeded` throughout, which proves the audit does not flag a healthy job.

    ## Prerequisites

    - A SQL Server instance you can reach over JDBC with SQL Server Agent running (`MSSQL_AGENT_ENABLED=True` on the Linux image).
    - A login that can read `msdb.dbo.sysjobs`, `sysjobhistory` and `sysjobactivity` and that can run `sp_update_job` and `sp_start_job`. Membership of `SQLAgentOperatorRole` in `msdb` is enough, as is `sysadmin`.
    - A Slack incoming webhook.

    ### Secrets

    - `SQLSERVER_PASSWORD`: password for the login in `user`. The `password` input defaults to this secret.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook, used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `url` | `jdbc:sqlserver://localhost:1433` | SQL Server instance to check |
    | `user` | `sa` | SQL Server login |
    | `password` | `{{ secret('SQLSERVER_PASSWORD') }}` | Password for the login |
    | `managed_jobs` | empty | Comma separated allowlist of job names that must stay live |
    | `include_failed` | `true` | Also flag an allowlisted job whose last run failed |
    | `max_wait` | `PT3M` | How long to wait for started jobs to finish |
    | `auto_remediate` | `false` | Allow the statements to run |
    | `dry_run` | `true` | Must be `false` for a statement to run |

    ## Quick start

    1. Add the `SQLSERVER_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, set `url` and `user`, then set `managed_jobs` to the exact names of the backup, log backup, index and integrity jobs that must stay enabled.
    3. Run it once with the defaults and read which managed jobs are disabled or last failed.
    4. Run with `auto_remediate: true` and `dry_run: false` and approve the pause to re-enable and run them. Read the re-verify result.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Build the allowlist from a naming convention instead of a fixed list, by matching `sysjobs.name` against a `LIKE` pattern in the audit, so a new maintenance job is covered the day it is created.
    - Flag a job whose schedule is disabled, not only the job, by reading `sysschedules.enabled` through `sysjobschedules`.
    - Flag a job that has not run in longer than its interval, by reading the next and last run from `sysjobschedules` and `sysjobhistory`, so a job that silently stopped firing is caught too.
    - Post the failing step's `message` from `sysjobhistory` to Slack so an on-call engineer sees why a job failed without opening the server.
    - Raise `max_wait` for an instance whose maintenance jobs run for many minutes, so the poll does not give up before a long rebuild finishes.

