id: aws-apprunner-service-active-instance-scaling-sentinel
namespace: company.cloud

description: Audits AWS App Runner services for active container instance saturation and provisioned concurrency limits.

concurrency:
  limit: 1

inputs:
  - id: awsRegion
    type: STRING
    displayName: AWS Region
    defaults: us-east-1
    description: Target AWS region hosting App Runner services.

  - id: serviceArn
    type: STRING
    displayName: App Runner Service ARN
    defaults: arn:aws:apprunner:us-east-1:123456789012:service/payment-api/abc123def456
    description: Amazon Resource Name (ARN) of the App Runner service to audit.

  - id: maxActiveInstancesThreshold
    type: INT
    displayName: Max Active Instances Threshold
    defaults: 20
    description: Maximum active container instance count threshold before flagging autoscaling saturation.

  - id: requestConcurrencyThreshold
    type: FLOAT
    displayName: Request Concurrency Threshold
    defaults: 80.0
    description: Average concurrent requests per active instance triggering scaling alerts.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: https://hooks.slack.com/services/T00/B00/XXXX
    description: Encrypted Slack Incoming Webhook endpoint for alerting platform SRE teams.

tasks:
  - id: evaluate_apprunner_scaling
    type: io.kestra.plugin.scripts.python.Script
    description: Queries AWS CloudWatch metrics for App Runner ActiveInstances and Concurrency.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.awsRegion }}"
    script: |
      import os
      import json
      from datetime import datetime, timedelta, timezone
      import boto3

      service_arn = "{{ inputs.serviceArn }}"
      service_name = service_arn.split('/')[-2] if '/' in service_arn else "unknown-service"
      max_instances_threshold = {{ inputs.maxActiveInstancesThreshold }}
      concurrency_threshold = {{ inputs.requestConcurrencyThreshold }}

      cloudwatch = boto3.client('cloudwatch', region_name=os.getenv('AWS_DEFAULT_REGION'))

      end_time = datetime.now(timezone.utc)
      start_time = end_time - timedelta(minutes=30)

      instance_metric = cloudwatch.get_metric_data(
          MetricDataQueries=[
              {
                  'Id': 'm1',
                  'MetricStat': {
                      'Metric': {
                          'Namespace': 'AWS/AppRunner',
                          'MetricName': 'ActiveInstances',
                          'Dimensions': [{'Name': 'ServiceName', 'Value': service_name}]
                      },
                      'Period': 300,
                      'Stat': 'Maximum'
                  },
                  'ReturnData': True
              },
              {
                  'Id': 'm2',
                  'MetricStat': {
                      'Metric': {
                          'Namespace': 'AWS/AppRunner',
                          'MetricName': 'Concurrency',
                          'Dimensions': [{'Name': 'ServiceName', 'Value': service_name}]
                      },
                      'Period': 300,
                      'Stat': 'Average'
                  },
                  'ReturnData': True
              }
          ],
          StartTime=start_time,
          EndTime=end_time
      )

      active_instances = 0
      avg_concurrency = 0.0

      for result in instance_metric.get('MetricDataResults', []):
          if result['Id'] == 'm1' and result['Values']:
              active_instances = int(max(result['Values']))
          elif result['Id'] == 'm2' and result['Values']:
              avg_concurrency = float(sum(result['Values']) / len(result['Values']))

      is_saturated = active_instances >= max_instances_threshold or avg_concurrency >= concurrency_threshold

      report = {
          'service_name': service_name,
          'service_arn': service_arn,
          'active_instances': active_instances,
          'avg_concurrency': round(avg_concurrency, 2),
          'max_instances_threshold': max_instances_threshold,
          'concurrency_threshold': concurrency_threshold,
          'is_saturated': is_saturated,
          'recommended_action': f'aws apprunner update-service --service-arn {service_arn} --auto-scaling-configuration-arn <NEW_SCALING_ARN>' if is_saturated else 'No scaling intervention needed.'
      }

      with open('scaling_report.json', 'w') as f:
          json.dump(report, f)

      print(f'Audited App Runner service {service_name}: {active_instances} active instances, {avg_concurrency:.2f} concurrency.')

  - id: check_scaling_saturation
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether App Runner instance or concurrency thresholds were breached.
    condition: "{{ json(read('scaling_report.json')).is_saturated }}"
    then:
      - id: notify_slack_saturation_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority scaling saturation alert to Platform SRE team on Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "AWS App Runner Scaling Alert: Service *{{ json(read('scaling_report.json')).service_name }}* reached active instance capacity ceiling! Active Instances: {{ json(read('scaling_report.json')).active_instances }}/{{ inputs.maxActiveInstancesThreshold }}, Concurrency: {{ json(read('scaling_report.json')).avg_concurrency }}. Runbook: {{ json(read('scaling_report.json')).recommended_action }}"
          }
    else:
      - id: log_healthy_scaling_state
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal autoscaling metrics when App Runner instances operate within limits.
        message: "App Runner service {{ json(read('scaling_report.json')).service_name }} is operating nominally with {{ json(read('scaling_report.json')).active_instances }} active instances and {{ json(read('scaling_report.json')).avg_concurrency }} average concurrency."

  - id: export_scaling_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured autoscaling diagnostic report for downstream workflow consumption.
    format: "{{ json(read('scaling_report.json')) }}"

triggers:
  - id: hourly_apprunner_scaling_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled hourly audit evaluating App Runner instance scaling headroom.
    cron: "15 * * * *"

extend:
  title: AWS App Runner Service Active Instance Scaling Sentinel
  shortDescription: Audits AWS App Runner active instances and concurrency to alert SREs on autoscaling ceiling saturation.
  metaTitle: AWS App Runner Service Active Instance Scaling Sentinel | Kestra
  metaDescription: Audits AWS App Runner active container instances and concurrency metrics to detect autoscaling saturation and notify platform teams via Slack.
  description: |
    Audits AWS App Runner regional container services for active instance exhaustion and concurrent request saturation.

    ## How it works
    1. Triggers hourly on schedule to poll CloudWatch telemetry for AWS App Runner services.
    2. Executes a containerized Python script querying `AWS/AppRunner` metric namespace for `ActiveInstances` and `Concurrency`.
    3. Calculates peak instance counts and average request concurrency across a 30-minute rolling evaluation window.
    4. Evaluates if active instances reached the configured threshold or request concurrency exceeded bounds using an `If` condition.
    5. Dispatches an alert to Slack with the service ARN and AWS CLI update commands when autoscaling ceiling is reached.
    6. Logs nominal metrics and exports an audit manifest for audit trails.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: 15 * * * *] --> B[Task: evaluate_apprunner_scaling]
        B --> C{Task: check_scaling_saturation}
        C -- Threshold Breached --> D[Task: notify_slack_saturation_alert]
        C -- Nominal Operation --> E[Task: log_healthy_scaling_state]
        D --> F[Task: export_scaling_manifest]
        E --> F
    ```

    ## Use cases
    - **Production API Autoscaling Ceilings**: Detect when containerized microservices hit the App Runner `MaxSize` instance limit during traffic spikes.
    - **Noisy Neighbor Concurrency Isolation**: Identify when high concurrent requests cause container queueing before requests encounter HTTP 504 gateway timeouts.
    - **Platform SRE Capacity Planning**: Maintain longitudinal visibility into peak instance usage across business hours to right-size minimum and maximum autoscaling configurations.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `awsRegion` | `STRING` | `us-east-1` | Target AWS region hosting App Runner services. |
    | `serviceArn` | `STRING` | `arn:aws:apprunner:...` | Amazon Resource Name (ARN) of the App Runner service to audit. |
    | `maxActiveInstancesThreshold` | `INT` | `20` | Maximum active container instance count threshold before flagging autoscaling saturation. |
    | `requestConcurrencyThreshold` | `FLOAT` | `80.0` | Average concurrent requests per active instance triggering scaling alerts. |
    | `slackWebhookUri` | `SECRET` | `None` | Encrypted Slack Incoming Webhook endpoint for alerting platform SRE teams. |

    ## Expected outputs
    Primary execution outputs exported by `export_scaling_manifest`:
    - `service_name`: Parsed identifier of the App Runner service.
    - `active_instances`: Maximum active container instances recorded in the evaluation window.
    - `avg_concurrency`: Mean request concurrency per container instance.
    - `is_saturated`: Boolean flag indicating whether scaling thresholds were breached.
    - `recommended_action`: Exact AWS CLI command to adjust autoscaling configuration.

    Example expression: `{{ outputs.export_scaling_manifest.value.is_saturated }}`

    ## Prerequisites
    - An active AWS Account with deployed AWS App Runner services.
    - IAM credentials with `apprunner:DescribeService` and `cloudwatch:GetMetricData` permissions.
    - A Slack Incoming Webhook channel URL configured in Kestra secrets.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Ensure `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` secrets are registered in Kestra.
    2. Deploy this flow into your target Kestra namespace.
    3. Set `serviceArn` to the target App Runner service ARN you wish to monitor.
    4. Execute the flow manually or allow the hourly schedule trigger to run automated checks.

    ## Common pitfalls and troubleshooting
    - **Metric Latency**: App Runner CloudWatch metrics report at 1-minute to 5-minute intervals. Using an evaluation window under 10 minutes can produce incomplete readings.
    - **Zero Metric Data on Inactive Services**: If an App Runner service receives zero incoming requests, `Concurrency` metrics report empty. The Python task handles empty datasets gracefully by defaulting to zero.
    - **Custom Domain vs Direct Domain**: This workflow monitors container instances at the App Runner service level regardless of whether requests arrive via default domains or custom CNAME associations.

    ## How to extend
    - **Automated Scale Up**: Integrate an AWS CLI task to automatically call `apprunner:UpdateService` and bind a higher-capacity `AutoScalingConfigurationArn`.
    - **Multi-Service Scanning**: Extend the Python script with `apprunner.list_services` to audit every App Runner service in the AWS region sequentially.
    - **PagerDuty Escalation**: Route high concurrency saturation alerts directly into PagerDuty for immediate on-call engineer paging.

    ## Links
    - [AWS App Runner Documentation](https://docs.aws.amazon.com/apprunner/)
    - [AWS CloudWatch Metrics for App Runner](https://docs.aws.amazon.com/apprunner/latest/dg/monitor-cw.html)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - Monitoring & Alerting
  ee: false
  demo: false
