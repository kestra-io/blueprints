id: mysql-sort-merge-passes-sentinel
namespace: company.dataops

inputs:
  - id: mysql_host
    type: STRING
    defaults: mysql.internal
    description: Hostname of the MySQL database instance.
  - id: mysql_port
    type: INT
    defaults: 3306
    description: TCP port of the MySQL database instance.
  - id: mysql_database
    type: STRING
    defaults: mysql
    description: Database name to connect to.
  - id: mysql_username
    type: STRING
    defaults: kestra_monitor
    description: MySQL monitoring username.
  - id: max_sort_merge_passes_threshold
    type: INT
    defaults: 100
    description: Maximum permissible sort merge passes before alerting.

tasks:
  - id: query_sort_metrics
    type: io.kestra.plugin.jdbc.mysql.Query
    url: "jdbc:mysql://{{ inputs.mysql_host }}:{{ inputs.mysql_port }}/{{ inputs.mysql_database }}"
    username: "{{ inputs.mysql_username }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    sql: |
      SELECT 
        VARIABLE_NAME, 
        CAST(VARIABLE_VALUE AS UNSIGNED) AS METRIC_VALUE 
      FROM performance_schema.global_status 
      WHERE VARIABLE_NAME IN ('Sort_merge_passes', 'Created_tmp_disk_tables');
    fetchType: FETCH

  - id: evaluate_sort_spillover
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_sort_metrics.rows[1].METRIC_VALUE > inputs.max_sort_merge_passes_threshold }}"
    then:
      - id: alert_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *MySQL Sort Disk Spill Alert*: Database {{ inputs.mysql_host }} reported {{ outputs.query_sort_metrics.rows[1].METRIC_VALUE }} sort merge passes. Queries are sorting data in temporary disk files. Increasing `sort_buffer_size` or optimizing `ORDER BY` indexes is recommended."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *MySQL Sentinel Execution Failure*: Failed to query sort status on {{ inputs.mysql_host }}."
      }

triggers:
  - id: scheduled_sort_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: MySQL Sort Merge Passes and Temporary Disk Table Sentinel
  shortDescription: Audits MySQL global status to detect sort operations spilling to disk and unindexed temporary table creation.
  description: |
    ## How it works
    This sentinel evaluates MySQL `performance_schema.global_status` for `Sort_merge_passes` and `Created_tmp_disk_tables`. It detects when sorting buffers are insufficient to accommodate query result sets in memory, warning DBAs before disk I/O bottlenecks degrade analytical and reporting queries.

    ## What you get
    - Real-time detection of memory-constrained `ORDER BY` and `GROUP BY` queries.
    - Early warning against disk I/O saturation caused by temporary disk table creation.
    - Actionable recommendations to resize `sort_buffer_size` or tune query indexes.

    ## Who it's for
    - Database administrators and backend performance engineers tuning MySQL OLTP workloads.
    - SREs troubleshooting query latency spikes.

    ## Why orchestrate this with Kestra
    Kestra runs automated database observability checks natively using JDBC connectivity, executing scheduled audits without intermediate monitoring agents.

    ## Prerequisites
    - MySQL database instance with `performance_schema` accessible.
    - Secrets `MYSQL_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure database host, port, and credentials.
    3. Run manually to check current sort merge counts.

    ## How to extend
    - Query `events_statements_summary_by_digest` to find the exact queries causing the highest sort merge passes.
    - Compare `Sort_rows` and `Sort_scan` for comprehensive sort profiling.
    - Export sort metrics to Datadog or Prometheus.

    ## Links
    - [Kestra MySQL Plugin](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [MySQL Sort Buffer Optimization](https://dev.mysql.com/doc/refman/8.0/en/order-by-optimization.html)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
