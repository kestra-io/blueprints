    - [SurrealDB DEFINE INDEX](https://surrealdb.com/docs/surrealql/statements/define/indexes)
    - [SurrealDB INFO statement](https://surrealdb.com/docs/surrealql/statements/info)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
    - [Sibling blueprint: surreal-db](https://github.com/kestra-io/blueprints/blob/main/flows/surreal-db.yaml)
    - [Sibling blueprint: surreal-db-slack](https://github.com/kestra-io/blueprints/blob/main/flows/surreal-db-slack.yaml)
  tags:
    - Data
    - Infrastructure
    - Core
  subTags:
    - Day 2 Operations
  ee: false
  demo: false
