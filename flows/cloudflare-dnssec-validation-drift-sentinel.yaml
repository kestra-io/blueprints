id: cloudflare-dnssec-validation-drift-sentinel
namespace: company.team

inputs:
  - id: zone_id
    type: STRING
    description: Cloudflare Zone ID to audit.

tasks:
  - id: query_dnssec_status
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        set -euo pipefail
        python3 -c "
        import requests, json, sys

        zone_id = '{{ inputs.zone_id }}'
        token = '{{ secret('CLOUDFLARE_API_TOKEN') }}'
        headers = {
            'Authorization': f'Bearer {token}',
            'Content-Type': 'application/json'
        }
        url = f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dnssec'

        try:
            resp = requests.get(url, headers=headers, timeout=15)
            resp.raise_for_status()
            data = resp.json()
            status = data.get('result', {}).get('status', 'unknown')
            result = {
                'zone_id': zone_id,
                'dnssec_status': status,
                'is_active': status == 'active'
            }
            with open('dnssec_summary.json', 'w') as out:
                json.dump(result, out)
            print('Cloudflare DNSSEC audit:', result)
        except Exception as err:
            sys.stderr.write(f'Cloudflare DNSSEC query error: {err}\n')
            sys.exit(1)
        "
    outputFiles:
      - dnssec_summary.json

  - id: evaluate_dnssec_state
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.query_dnssec_status.outputFiles['dnssec_summary.json'])).dnssec_status != 'active' }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#security-ops",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Cloudflare DNSSEC Validation Drift Alert",
                "text": "Cloudflare Zone `{{ inputs.zone_id }}` reported DNSSEC status *{{ fromJson(read(outputs.query_dnssec_status.outputFiles['dnssec_summary.json'])).dnssec_status }}*! DNSSEC cryptographic signing is inactive or delegation signer (DS) records at the registrar are missing/broken, exposing domains to DNS hijacking.",
                "footer": "Kestra Cloud Sentinel • Cloudflare DNSSEC"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#security-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Cloudflare DNSSEC Sentinel Failure",
            "text": "Failed to query Cloudflare DNSSEC API. Verify zone ID and API token permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true

extend:
  metaDescription: "Audits Cloudflare DNS zones for DNSSEC activation and DS record validation drift to prevent DNS spoofing."
  metaTitle: Cloudflare DNSSEC Cryptographic Validation and Drift Sentinel with Kestra
  title: Cloudflare DNSSEC Cryptographic Validation and Drift Sentinel
  shortDescription: Audits Cloudflare DNS zones for DNSSEC activation and DS record validation drift to prevent DNS spoofing.
  description: |
    ## How it works
    This workflow connects to the Cloudflare REST API (`/zones/{zone_id}/dnssec`) using an API bearer token to audit the operational status of Domain Name System Security Extensions (DNSSEC). DNSSEC cryptographically signs DNS records with public key cryptography to protect users from DNS cache poisoning, man-in-the-middle spoofing, and rogue redirection. If registrar delegation signer (DS) records are misconfigured, domain nameservers drift, or DNSSEC is accidentally disabled (`status != "active"`), DNS resolvers fail to validate signatures. This workflow audits DNSSEC state and alerts security teams immediately.

    ## What you get
    - Continuous validation of DNSSEC signing and registrar chain of trust.
    - Prevents DNS spoofing, hijacking, and domain resolution outages.
    - Clear visibility into DNSSEC operational states across corporate zones.

    ## Who it's for
    - Cloud Security Engineers and Network Domain Administrators.
    - DevSecOps Specialists managing enterprise DNS architectures.

    ## Why orchestrate this with Kestra
    - **Continuous Security Governance**: Automates periodic cryptographic audits on a weekly schedule.
    - **Secure Token Handling**: Safely passes Cloudflare API tokens via Kestra secret store.
    - **Direct Team Alerts**: Escalates validation drift directly to security operations channels.

    ## Prerequisites
    - Cloudflare account with Zone ID and API token with `Zone.DNS` read permissions.
    - Secrets `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input target Cloudflare Zone ID.
    3. Run the workflow to inspect DNSSEC activation status.

    ## How to extend
    - Iterate across all corporate Cloudflare zones dynamically using `/zones` API.
    - Query public DNS over HTTPS (DoH) resolvers (e.g. 1.1.1.1, 8.8.8.8) to verify external cryptographic resolution.

    ## Links
    - [Cloudflare DNSSEC API Documentation](https://developers.cloudflare.com/api/resources/dnssec/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
  ee: false
  demo: false
