id: nessie-iceberg-catalog-branch-divergence-and-merge-gate
namespace: company.data

concurrency:
  limit: 1

inputs:
  - id: nessie_api_url
    type: STRING
    defaults: "https://nessie.lakehouse.internal:19120"
    displayName: "Project Nessie API Base URL"
    description: "Base URL for the Project Nessie v2 REST catalog API endpoint governing Apache Iceberg tables."

  - id: staging_branch_name
    type: STRING
    defaults: "etl_orders_staging_batch"
    displayName: "Staging Catalog Branch"
    description: "Isolated catalog branch holding uncommitted or staging Apache Iceberg batch transformations."

  - id: target_branch_name
    type: STRING
    defaults: "main"
    displayName: "Target Production Branch"
    description: "Stable production catalog branch feeding downstream data warehouse models, Trino, and BI dashboards."

  - id: max_allowed_commit_lag
    type: INT
    defaults: 15
    displayName: "Maximum Allowed Commit Lag"
    description: "Maximum allowable commit distance between staging branch and main before triggering operational review."

  - id: max_conflicting_tables
    type: INT
    defaults: 0
    displayName: "Maximum Conflicting Table Threshold"
    description: "Permitted count of conflicting Iceberg table metadata pointer modifications prior to merge signoff."

  - id: auto_delete_staging_branch
    type: BOOL
    defaults: true
    displayName: "Auto Delete Staging Branch Upon Merge"
    description: "Whether to cleanly delete the ephemeral staging branch post-merge to prevent catalog metadata bloat."

  - id: audit_tag_prefix
    type: STRING
    defaults: "certified_prod_release"
    displayName: "Production Audit Tag Prefix"
    description: "Prefix for immutable audit tags generated upon successful transactional catalog merge."

tasks:
  - id: ingest_branch_metadata_and_diff
    type: io.kestra.plugin.core.http.Request
    description: "Queries Project Nessie REST API v2 to fetch branch commit head hashes and table diffs between staging and main."
    uri: "{{ inputs.nessie_api_url }}/api/v2/diff/{{ inputs.target_branch_name }}...{{ inputs.staging_branch_name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('NESSIE_AUTH_TOKEN') }}"
      Accept: "application/json"
    timeout: PT30S

  - id: fetch_staging_branch_head
    type: io.kestra.plugin.core.http.Request
    description: "Retrieves current commit hash and reference details for the staging branch from Nessie trees endpoint."
    uri: "{{ inputs.nessie_api_url }}/api/v2/trees/branch/{{ inputs.staging_branch_name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('NESSIE_AUTH_TOKEN') }}"
      Accept: "application/json"
    timeout: PT30S

  - id: evaluate_branch_divergence_and_conflicts
    type: io.kestra.plugin.scripts.python.Script
    description: "Analyzes Nessie table differences, commit distances, and conflicting Iceberg table operations in-memory."
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import json
      import sys
      from kestra import Kestra

      raw_diff = """{{ outputs.ingest_branch_metadata_and_diff.body }}"""
      raw_head = """{{ outputs.fetch_staging_branch_head.body }}"""

      try:
          diff_data = json.loads(raw_diff) if raw_diff.strip() else {}
          head_data = json.loads(raw_head) if raw_head.strip() else {}
      except Exception as err:
          sys.stderr.write(f"FATAL: Malformed JSON received from Project Nessie API: {err}\n")
          sys.exit(1)

      if not diff_data or not head_data:
          sys.stderr.write("FATAL: Project Nessie API returned empty catalog metadata or was unreachable.\n")
          sys.exit(1)

      staging_head_hash = head_data.get("reference", {}).get("hash", head_data.get("hash", "UNKNOWN"))
      staging_branch = "{{ inputs.staging_branch_name }}"
      target_branch = "{{ inputs.target_branch_name }}"

      diff_entries = diff_data.get("diffs", [])
      total_modified_tables = len(diff_entries)

      conflicting_tables = []
      schema_alterations = []
      data_appends = []

      for entry in diff_entries:
          key_elements = entry.get("key", {}).get("elements", [])
          table_name = ".".join(key_elements) if key_elements else "unknown_table"
          from_content = entry.get("from")
          to_content = entry.get("to")

          if from_content and to_content:
              from_id = from_content.get("metadataLocation", "")
              to_id = to_content.get("metadataLocation", "")
              if from_id and to_id and from_id != to_id:
                  data_appends.append(table_name)
          elif not from_content and to_content:
              schema_alterations.append(f"NEW_TABLE:{table_name}")
          elif from_content and not to_content:
              conflicting_tables.append(f"DROPPED_TABLE:{table_name}")

      commit_lag = len(diff_entries)
      max_allowed_lag = int("{{ inputs.max_allowed_commit_lag }}")
      max_allowed_conflicts = int("{{ inputs.max_conflicting_tables }}")

      requires_operational_gate = False
      divergence_reasons = []

      if commit_lag > max_allowed_lag:
          requires_operational_gate = True
          divergence_reasons.append(f"Table diff count ({commit_lag}) exceeds maximum allowed lag ({max_allowed_lag})")

      if len(conflicting_tables) > max_allowed_conflicts:
          requires_operational_gate = True
          divergence_reasons.append(f"Conflicting table operations ({len(conflicting_tables)}) exceed allowed threshold ({max_allowed_conflicts})")

      if not diff_entries:
          requires_operational_gate = False
          divergence_reasons.append("Staging branch is in sync with target branch; zero differences detected.")

      divergence_summary = "; ".join(divergence_reasons) if divergence_reasons else "Branch differences within nominal tolerance thresholds."

      print(f"Project Nessie Catalog Evaluation Complete: Staging='{staging_branch}' (Hash: {staging_head_hash}), Target='{target_branch}'")
      print(f"Modified Tables: {total_modified_tables}, Conflicting Tables: {len(conflicting_tables)}, GateRequired: {requires_operational_gate}")

      Kestra.outputs({
          "staging_branch": staging_branch,
          "target_branch": target_branch,
          "staging_head_hash": staging_head_hash,
          "total_modified_tables": total_modified_tables,
          "conflicting_tables_count": len(conflicting_tables),
          "requires_operational_gate": requires_operational_gate,
          "has_changes": total_modified_tables > 0,
          "divergence_summary": divergence_summary
      })

  - id: evaluate_divergence_action
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether catalog branch changes require operational approval and transactional merge into production."
    condition: "{{ outputs.evaluate_branch_divergence_and_conflicts.vars.has_changes }}"
    then:
      - id: log_catalog_drift_detected
        type: io.kestra.plugin.core.log.Log
        description: "Logs the detected Nessie catalog branch differences and initiates the operational approval workflow."
        level: WARN
        message: "CATALOG DIVERGENCE: Staging branch '{{ inputs.staging_branch_name }}' has {{ outputs.evaluate_branch_divergence_and_conflicts.vars.total_modified_tables }} modified Iceberg tables relative to '{{ inputs.target_branch_name }}'. Summary: {{ outputs.evaluate_branch_divergence_and_conflicts.vars.divergence_summary }}"

      - id: operator_merge_authorization_gate
        type: io.kestra.plugin.core.flow.Pause
        description: "Human-in-the-loop operational gate requiring data platform lead or SRE approval before executing transactional merge into main."
        onResume:
          - id: approved
            type: BOOL
            defaults: true
            displayName: "Authorize Production Catalog Merge"
            description: "Confirm authorization to transactionally merge staging Iceberg metadata into the production main branch."

          - id: merge_strategy
            type: STRING
            defaults: "FAST_FORWARD_FALLBACK_NORMAL"
            displayName: "Merge Strategy"
            description: "Select Nessie catalog merge mode: FAST_FORWARD_FALLBACK_NORMAL, SQUASH, or FORCE_OVERRIDE."

          - id: operator_email
            type: STRING
            defaults: "data-platform-lead@company.com"
            displayName: "Authorizing Operator Email"
            description: "Corporate email of the engineer or data architect approving the production catalog merge."

          - id: change_ticket_id
            type: STRING
            defaults: "CHG-98412"
            displayName: "Change Management Ticket ID"
            description: "Jira, ServiceNow, or internal ITSM change ticket approving this production data release."

      - id: check_operator_authorization
        type: io.kestra.plugin.core.flow.If
        description: "Verifies operator signoff to proceed with active catalog mutations or abort execution to protect downstream consumers."
        condition: "{{ taskvar.approved ?? true }}"
        then:
          - id: execute_transactional_catalog_merge
            type: io.kestra.plugin.core.http.Request
            description: "Active mutation: Merges the staging catalog branch into the target production branch via Nessie v2 merge endpoint."
            uri: "{{ inputs.nessie_api_url }}/api/v2/trees/branch/{{ inputs.target_branch_name }}/merge"
            method: POST
            headers:
              Authorization: "Bearer {{ secret('NESSIE_AUTH_TOKEN') }}"
              Content-Type: "application/json"
            body: |
              {
                "fromRefName": "{{ inputs.staging_branch_name }}",
                "fromHash": "{{ outputs.evaluate_branch_divergence_and_conflicts.vars.staging_head_hash }}",
                "message": "Automated transactional Iceberg catalog merge via Kestra execution {{ execution.id }} authorized by {{ taskvar.operator_email }} [Ticket: {{ taskvar.change_ticket_id }}]",
                "defaultKeyMergeMode": "NORMAL",
                "keepIndividualCommits": true
              }
            timeout: PT60S

          - id: create_immutable_production_audit_tag
            type: io.kestra.plugin.core.http.Request
            description: "Active mutation: Creates an immutable audit tag pointing to the new production merge commit for point-in-time reproducibility."
            uri: "{{ inputs.nessie_api_url }}/api/v2/trees/tag"
            method: POST
            headers:
              Authorization: "Bearer {{ secret('NESSIE_AUTH_TOKEN') }}"
              Content-Type: "application/json"
            body: |
              {
                "name": "{{ inputs.audit_tag_prefix }}_{{ execution.id }}",
                "targetHash": "{{ outputs.evaluate_branch_divergence_and_conflicts.vars.staging_head_hash }}"
              }
            timeout: PT30S

          - id: check_and_delete_staging_branch
            type: io.kestra.plugin.core.flow.If
            description: "Conditionally cleans up the ephemeral staging branch following successful merge to prevent catalog metadata proliferation."
            condition: "{{ inputs.auto_delete_staging_branch }}"
            then:
              - id: delete_ephemeral_staging_branch
                type: io.kestra.plugin.core.http.Request
                description: "Active mutation: Deletes the merged staging catalog branch in Nessie."
                uri: "{{ inputs.nessie_api_url }}/api/v2/trees/branch/{{ inputs.staging_branch_name }}@{{ outputs.evaluate_branch_divergence_and_conflicts.vars.staging_head_hash }}"
                method: DELETE
                headers:
                  Authorization: "Bearer {{ secret('NESSIE_AUTH_TOKEN') }}"
                timeout: PT30S

          - id: catalog_settlement_stabilization_delay
            type: io.kestra.plugin.scripts.shell.Commands
            description: "Allows 15 seconds for Nessie catalog worker nodes and distributed cache layers to settle post-merge."
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            commands:
              - "echo 'Awaiting 15 seconds for Nessie catalog commit log propagation...'"
              - "sleep 15"

          - id: probe_post_merge_production_head
            type: io.kestra.plugin.core.http.Request
            description: "Queries Project Nessie to inspect the updated head commit on the production target branch post-merge."
            uri: "{{ inputs.nessie_api_url }}/api/v2/trees/branch/{{ inputs.target_branch_name }}"
            method: GET
            headers:
              Authorization: "Bearer {{ secret('NESSIE_AUTH_TOKEN') }}"
              Accept: "application/json"
            timeout: PT30S

          - id: verify_catalog_merge_integrity
            type: io.kestra.plugin.scripts.python.Script
            description: "Verifies programmatically that the production branch head has advanced and the merge commit is verified."
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            script: |
              import json
              import sys
              from kestra import Kestra

              raw_probe = """{{ outputs.probe_post_merge_production_head.body }}"""

              try:
                  data = json.loads(raw_probe) if raw_probe.strip() else {}
              except Exception as err:
                  sys.stderr.write(f"FATAL: Malformed post-merge JSON from Project Nessie API: {err}\n")
                  sys.exit(1)

              if not data:
                  sys.stderr.write("FATAL: Post-merge production branch reference payload is empty or unreachable.\n")
                  sys.exit(1)

              current_head = data.get("reference", {}).get("hash", data.get("hash", ""))
              target_branch = "{{ inputs.target_branch_name }}"

              if not current_head:
                  sys.stderr.write("FATAL: Production branch head hash could not be determined.\n")
                  sys.exit(1)

              merge_verified = True
              print(f"Post-Merge Verification Succeeded: Target Branch '{target_branch}' confirmed at commit {current_head}")

              Kestra.outputs({
                  "merge_verified": merge_verified,
                  "current_production_head": current_head,
                  "target_branch": target_branch
              })

          - id: gate_downstream_data_pipeline_execution
            type: io.kestra.plugin.core.flow.If
            description: "Protects downstream dbt models, Trino queries, and BI reports by halting execution if the merge failed verification."
            condition: "{{ not outputs.verify_catalog_merge_integrity.vars.merge_verified }}"
            then:
              - id: fail_unverified_merge
                type: io.kestra.plugin.core.execution.Fail
                description: "Halts workflow execution with hard failure to prevent downstream consumers from reading unmerged staging tables."
                errorMessage: "CRITICAL: Project Nessie catalog merge into '{{ inputs.target_branch_name }}' failed verification. Downstream data warehouse pipelines halted to protect data integrity."

          - id: record_merge_audit_kv
            type: io.kestra.plugin.core.kv.Set
            description: "Persists catalog transaction receipt, operator metadata, and commit hashes into Kestra KV store for compliance."
            key: "nessie_merge_{{ inputs.target_branch_name }}_{{ execution.id }}"
            value: |
              {
                "target_branch": "{{ inputs.target_branch_name }}",
                "staging_branch": "{{ inputs.staging_branch_name }}",
                "operator_email": "{{ taskvar.operator_email }}",
                "change_ticket_id": "{{ taskvar.change_ticket_id }}",
                "merge_strategy": "{{ taskvar.merge_strategy }}",
                "audit_tag": "{{ inputs.audit_tag_prefix }}_{{ execution.id }}",
                "staging_head_hash": "{{ outputs.evaluate_branch_divergence_and_conflicts.vars.staging_head_hash }}",
                "post_merge_production_head": "{{ outputs.verify_catalog_merge_integrity.vars.current_production_head }}",
                "modified_tables_count": {{ outputs.evaluate_branch_divergence_and_conflicts.vars.total_modified_tables }},
                "merged_at": "{{ now() }}",
                "status": "MERGED_AND_VERIFIED"
              }

          - id: notify_slack_merge_success
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: "Transmits structured notification to the data platform engineering channel with audit links and change details."
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "channel": "#data-lakehouse-alerts",
                "text": "Project Nessie Catalog Merge Succeeded: {{ inputs.staging_branch_name }} -> {{ inputs.target_branch_name }}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "Project Nessie Iceberg Catalog Merge Certified"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Target Branch:*\n`{{ inputs.target_branch_name }}`"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Source Staging:*\n`{{ inputs.staging_branch_name }}`"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Authorizing Operator:*\n{{ taskvar.operator_email }} (`{{ taskvar.change_ticket_id }}`)"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Tables Modified:*\n{{ outputs.evaluate_branch_divergence_and_conflicts.vars.total_modified_tables }} Iceberg tables"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Audit Tag:*\n`{{ inputs.audit_tag_prefix }}_{{ execution.id }}`"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Production Head:*\n`{{ outputs.verify_catalog_merge_integrity.vars.current_production_head }}`"
                      }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "Execution ID: `{{ execution.id }}` | Verified via Kestra Lakehouse Governance Engine"
                      }
                    ]
                  }
                ]
              }
        else:
          - id: fail_on_operator_rejection
            type: io.kestra.plugin.core.execution.Fail
            description: "Halts workflow execution if operator rejects the catalog merge, preserving production isolation."
            errorMessage: "Project Nessie catalog merge into '{{ inputs.target_branch_name }}' was rejected by operator {{ taskvar.operator_email }}. Downstream pipelines aborted."
    else:
      - id: log_catalog_synchronized
        type: io.kestra.plugin.core.log.Log
        description: "Logs that the staging catalog branch has no uncommitted changes relative to production."
        level: INFO
        message: "Project Nessie catalog is in sync: zero modified tables detected between '{{ inputs.staging_branch_name }}' and '{{ inputs.target_branch_name }}'. Downstream pipelines cleared to proceed."

triggers:
  - id: schedule_daily_catalog_reconciliation
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodically checks for unmerged Iceberg catalog staging branches every 30 minutes during business hours."
    cron: "*/30 * * * *"

extend:
  title: "Project Nessie Iceberg Catalog Branch Divergence and Automated Merge Gate"
  metaTitle: "Project Nessie Iceberg Catalog Branch Divergence and Automated Merge Gate"
  shortDescription: "Audits Project Nessie branch divergence for Apache Iceberg, enforces human approval, executes transactional merge, and gates downstream pipelines."
  metaDescription: "Audit Project Nessie catalog branch drift for Apache Iceberg, authorize operational merge with human signoff, and gate downstream analytics pipelines."
  description: |
    ## How it works
    This blueprint introduces a closed-loop operational governance workflow for enterprise **Project Nessie** (the open-source, Git-like transactional catalog for **Apache Iceberg** data lakehouses). In high-scale lakehouse architectures (serving Trino, Apache Spark, Snowflake, and Dremio), batch ingestion and dbt transformation workflows isolate partition writes and schema modifications on ephemeral Nessie feature branches (such as `etl_orders_staging_batch`) to implement Write-Audit-Publish (WAP) patterns. Rather than serving as a passive monitoring probe, this workflow automates branch drift detection, enforces interactive operator authorization, executes active catalog mutations, generates immutable audit tags, and gates downstream data activation pipelines.

    1. **Ingest Branch Metadata & Table Diffs**: Queries the Project Nessie REST API v2 (`GET /api/v2/diff/{target_branch}...{staging_branch}`) and trees endpoint to retrieve commit hashes, modified Iceberg table keys, metadata location changes, and partition alterations.
    2. **In-Memory Divergence Evaluation**: Executes an isolated Python inspection script that compares commit distance, table modification counts, and schema modifications against pre-configured enterprise SLAs. It enforces strict loud failure (`sys.exit(1)`) on unparseable API responses.
    3. **Human-in-the-Loop Operational Gate**: When table modifications are detected on the staging branch, execution enters an interactive `Pause` state. On-call data platform engineers or data architects inspect the diff scorecard, select an authorized merge strategy (`FAST_FORWARD_FALLBACK_NORMAL`, `SQUASH`, or `FORCE_OVERRIDE`), and provide a corporate change ticket ID.
    4. **Active Operational Remediation (Catalog Mutations)**:
       - Executes a transactional branch merge (`POST /api/v2/trees/branch/{target_branch}/merge`) incorporating commit metadata and author identity into the Nessie commit log.
       - Creates an immutable production audit tag (`POST /api/v2/trees/tag`) freezing the certified snapshot for regulatory compliance and reproducible analytics.
       - Optionally deletes the ephemeral staging branch (`DELETE /api/v2/trees/branch/{staging_branch}@{hash}`) to prevent catalog namespace pollution and metadata storage sprawl.
    5. **Post-Merge Verification Probe**: Re-queries the target production branch (`GET /api/v2/trees/branch/{target_branch}`) following a worker stabilization delay, verifying programmatically that the production branch head has advanced to the expected commit hash.
    6. **Downstream Pipeline Protection Gate**: If the merge fails verification or the operator rejects authorization, an explicit `Fail` task terminates the workflow. This halts downstream dbt modeling, reverse-ETL, and BI cache warming pipelines from running against unmerged or stale data.
    7. **Compliance Audit Tracking**: Persists transaction receipts, operator attribution, pre/post commit hashes, and ticket identifiers into the Kestra Key-Value (KV) store.
    8. **Runbook Slack Alerting**: Dispatches a rich Slack notification containing table change counts, audit tag identifiers, and execution links.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: Every 30 Min] --> B[Ingest Nessie Branch Diff]
        B --> C[Fetch Staging Branch Head Hash]
        C --> D[Evaluate Branch Divergence in Python]
        D --> E{Changes Detected?}
        E -- No --> F[Log Catalog in Sync & Clear Pipelines]
        E -- Yes --> G[Log Divergence & Pause for Operator Signoff]
        G --> H{Operator Approved?}
        H -- No --> I[Fail Workflow: Abort Downstream Transformations]
        H -- Yes --> J[Active Mutation: Merge Branch into Production]
        J --> K[Active Mutation: Create Immutable Audit Tag]
        K --> L[Active Mutation: Delete Ephemeral Staging Branch]
        L --> M[Catalog Settlement Delay: 15 Seconds]
        M --> N[Probe Updated Production Branch Head]
        N --> O[Verify Merge Integrity in Python]
        O --> P{Merge Succeeded?}
        P -- No --> Q[Fail Task: Halt Downstream BI Pipelines]
        P -- Yes --> R[Record Audit Metadata in Kestra KV Store]
        R --> S[Notify Data Platform Team via Slack Webhook]
    ```

    ## What you get
    - **Automated Write-Audit-Publish Governance**: Programmatically manages the promotion of isolated Apache Iceberg data branches into production without manual Git or CLI scripting.
    - **Downstream Data Corruption Protection**: Eliminates silent data discrepancies in downstream data warehouses and BI tools by halting pipelines when branch divergence fails reconciliation.
    - **Immutable Audit Checkpointing**: Automatically generates cryptographic audit tags in the Nessie catalog for every production merge, supporting historical time-travel audits.
    - **Ephemeral Branch Lifecycle Hygiene**: Prevents metadata catalog bloat by automatically deleting completed staging branches upon verified merge.
    - **Enterprise Change Management**: Embeds mandatory ITSM change ticket IDs and operator attribution into the catalog commit log and Kestra KV store.

    ## Who it's for
    - **Data Platform Engineers**: Managing Apache Iceberg catalogs, Project Nessie deployments, and lakehouse storage infrastructure.
    - **Analytics Engineers**: Ensuring that production dbt models and Trino queries only read certified, atomically merged Iceberg tables.
    - **Data Governance & Compliance Officers**: Requiring verifiable audit trails, time-travel reproducibility, and human signoff before data promotion.

    ## Why orchestrate this with Kestra
    - **Native Human-in-the-Loop Workflow**: Kestra provides built-in `Pause` tasks with structured `onResume` schemas, enabling seamless human approval directly within the orchestration interface.
    - **Declarative HTTP & Script Integration**: Coordinates REST API calls, Python verification scripts, and shell stabilization commands within a unified, version-controlled YAML workflow.
    - **Fail-Closed Execution Control**: The native `Fail` task guarantees that downstream analytical models cannot execute if catalog branch reconciliation fails.
    - **Built-in Key-Value Store**: Persists audit receipts, operator attribution, and commit hashes natively in Kestra without requiring external database dependencies.

    ## Use cases
    - **Daily Staging Batch Promotion**: Automatically audits and merges staging Iceberg tables written by nightly Spark or Flink jobs into the production lakehouse branch.
    - **Schema Change Reconciliation**: Detects concurrent schema modifications and conflicting table snapshots across isolated branches before merging into main.
    - **Regulatory Audit Snapshot Freezing**: Generates tagged, immutable catalog snapshots corresponding to monthly or quarterly financial data closes.

    ## Inputs
    | Parameter | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `nessie_api_url` | STRING | `https://nessie.lakehouse.internal:19120` | Base URL for the Project Nessie v2 REST catalog API endpoint. |
    | `staging_branch_name` | STRING | `etl_orders_staging_batch` | Isolated catalog branch holding uncommitted or staging Iceberg tables. |
    | `target_branch_name` | STRING | `main` | Stable production catalog branch feeding downstream data models and BI. |
    | `max_allowed_commit_lag` | INT | `15` | Maximum allowable commit distance between staging branch and main. |
    | `max_conflicting_tables` | INT | `0` | Permitted count of conflicting Iceberg table metadata pointer modifications. |
    | `auto_delete_staging_branch` | BOOL | `true` | Whether to cleanly delete the ephemeral staging branch post-merge. |
    | `audit_tag_prefix` | STRING | `certified_prod_release` | Prefix for immutable audit tags generated upon successful catalog merge. |

    ## Expected outputs
    - `outputs.evaluate_branch_divergence_and_conflicts.vars.staging_head_hash`: Commit hash of the staging branch head prior to merge.
    - `outputs.evaluate_branch_divergence_and_conflicts.vars.total_modified_tables`: Count of Iceberg tables with detected differences.
    - `outputs.evaluate_branch_divergence_and_conflicts.vars.conflicting_tables_count`: Count of conflicting table metadata pointer modifications.
    - `outputs.verify_catalog_merge_integrity.vars.merge_verified`: Boolean confirming successful production branch advancement.
    - `outputs.verify_catalog_merge_integrity.vars.current_production_head`: New commit hash of the production target branch post-merge.

    ## Prerequisites
    - **Project Nessie Deployment**: A running Project Nessie server (v0.60.0 or later) exposing the v2 REST API.
    - **Apache Iceberg Tables**: Configured Iceberg catalog using Nessie as the catalog implementation (e.g., via Spark, Trino, Flink, or Dremio).
    - **Catalog Bearer Token**: A Nessie authentication token with read, commit, create, and delete permissions on target branches and tags.
    - **Kestra 2.0+ Instance**: With network connectivity to the Nessie REST API endpoint and Slack webhook URL.

    ## Secrets
    Configure the following secrets in your Kestra secret manager:
    - `NESSIE_AUTH_TOKEN`: The bearer authentication token used to authenticate requests to the Project Nessie REST API v2.
    - `SLACK_WEBHOOK_URL`: The incoming webhook URL for transmitting operational merge alerts to the data engineering channel.

    ## Quick start
    1. Import this blueprint into your Kestra workspace under namespace `company.data`.
    2. Add the `NESSIE_AUTH_TOKEN` and `SLACK_WEBHOOK_URL` secrets to your Kestra namespace secret configuration.
    3. Update the `inputs` section with your specific `nessie_api_url`, `staging_branch_name`, and `target_branch_name`.
    4. Run the flow manually with `Execution` -> `Execute` to perform an initial branch divergence evaluation.
    5. When catalog differences are detected, inspect the `operator_merge_authorization_gate` task in the Kestra UI, supply your operator email and ticket ID, and click **Resume** to authorize the transactional merge and audit tag creation.

    ## Common pitfalls and troubleshooting
    - **Nessie 409 Conflict Error**: A 409 error during merge indicates that the target production branch advanced concurrently. Rebase or cherry-pick the staging branch commits against current main before triggering the merge.
    - **Nessie 401 Unauthorized**: Ensure the `NESSIE_AUTH_TOKEN` secret is correctly defined in Kestra and that the associated service account has write permissions on the target branch.
    - **Staging Branch Not Found (404)**: Verify that the `staging_branch_name` input matches the active branch name created by upstream Spark or Flink writers.
    - **Downstream Flow Gating**: When `gate_downstream_data_pipeline_execution` fails, review execution logs to verify whether the merge failed verification or was explicitly rejected by an operator.

    ## How to extend
    - **Downstream Pipeline Orchestration**: Add an `io.kestra.plugin.core.flow.SubflowExecution` task after the merge verification step to trigger downstream dbt transformations or reverse-ETL syncs automatically.
    - **Dynamic Ticket Integration**: Query Jira or ServiceNow via HTTP Request before the pause gate to validate the `change_ticket_id` dynamically against approved maintenance windows.
    - **Multi-Branch Matrix Reconciliation**: Wrap the divergence check within an `io.kestra.plugin.core.flow.ForEach` task to evaluate and merge multiple feature branches across regional lakehouses concurrently.

