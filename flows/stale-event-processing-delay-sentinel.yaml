id: stale-event-processing-delay-sentinel
namespace: company.team

description: |
  Reusable Kestra Blueprint for detecting stale or delayed events.

  The workflow receives an event through a webhook, validates its timestamp,
  evaluates the processing delay against a configurable freshness threshold,
  logs whether the event is fresh or stale, and generates a structured
  monitoring event.

inputs:
  - id: max_delay_minutes
    type: INT
    defaults: 15
    description: Maximum allowed event processing delay in minutes.

tasks:
  - id: inspect_event
    type: io.kestra.plugin.core.log.Log
    message: |
      STALE EVENT PROCESSING SENTINEL

      Event received successfully.

      Event payload:
      {{ trigger.body }}

  - id: validate_timestamp
    type: io.kestra.plugin.core.flow.If
    condition: "{{ trigger.body.event_timestamp is not null }}"

    then:
      - id: evaluate_delay
        type: io.kestra.plugin.core.flow.If
        condition: >-
          {{
            (
              trigger.body.event_timestamp
              | date(existingFormat="iso_zoned_date_time")
              | timestampMilli
            )
            <
            (
              now()
              | dateAdd(-inputs.max_delay_minutes, "MINUTES")
              | timestampMilli
            )
          }}

        then:
          - id: stale_event_detected
            type: io.kestra.plugin.core.log.Log
            message: |
              STALE EVENT DETECTED

              Event timestamp:
              {{ trigger.body.event_timestamp }}

              Maximum allowed delay:
              {{ inputs.max_delay_minutes }} minutes

              Current time:
              {{ now() }}

              The event is older than the allowed processing delay.

          - id: generate_stale_event
            type: io.kestra.plugin.datagen.core.Generate
            generator:
              type: io.kestra.plugin.datagen.generators.JsonObjectGenerator
              value:
                event_type: "stale_event_detected"
                event_timestamp: "{{ trigger.body.event_timestamp }}"
                max_delay_minutes: "{{ inputs.max_delay_minutes }}"
                execution_id: "{{ execution.id }}"
                check_time: "{{ execution.startDate }}"

        else:
          - id: fresh_event_detected
            type: io.kestra.plugin.core.log.Log
            message: |
              FRESH EVENT DETECTED

              Event timestamp:
              {{ trigger.body.event_timestamp }}

              Maximum allowed delay:
              {{ inputs.max_delay_minutes }} minutes

              Current time:
              {{ now() }}

              The event is within the allowed processing delay.

          - id: generate_fresh_event
            type: io.kestra.plugin.datagen.core.Generate
            generator:
              type: io.kestra.plugin.datagen.generators.JsonObjectGenerator
              value:
                event_type: "fresh_event_detected"
                event_timestamp: "{{ trigger.body.event_timestamp }}"
                max_delay_minutes: "{{ inputs.max_delay_minutes }}"
                execution_id: "{{ execution.id }}"
                check_time: "{{ execution.startDate }}"

    else:
      - id: missing_event_timestamp
        type: io.kestra.plugin.core.log.Log
        message: |
          STALE EVENT SENTINEL WARNING

          The received event does not contain an event_timestamp.
          The event cannot be evaluated for processing delay.

triggers:
  - id: event_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: stale-event-sentinel

extend:
  title: Stale Event Processing Delay Sentinel
  shortDescription: Detect delayed events and identify stale event payloads using a configurable processing-delay threshold.
  metaTitle: Stale Event Processing Delay Sentinel with Kestra
  metaDescription: Detect stale or delayed events with a configurable timestamp threshold, log freshness results, and generate structured monitoring events.
  description: |
    Event-driven workflows can process outdated events when upstream systems
    are delayed, queues build up, or event delivery is interrupted.

    This Blueprint receives events through a webhook, checks for an event
    timestamp, and compares the timestamp with a configurable maximum
    processing delay.

    The workflow distinguishes between:
    - FRESH: the event is within the configured processing-delay threshold.
    - STALE: the event exceeds the allowed processing delay.
    - MISSING TIMESTAMP: the event cannot be evaluated because its timestamp
      is absent.

    Fresh and stale events produce structured monitoring events containing
    the event timestamp, configured delay threshold, execution ID, and
    check time. Events without a timestamp generate a warning.

    The max_delay_minutes input defaults to 15 minutes and can be adjusted
    for different event-processing requirements.

    ## Features

    - Receive events through a webhook.
    - Validate the presence of an event timestamp.
    - Compare event age against a configurable delay threshold.
    - Distinguish fresh, stale, and missing-timestamp events.
    - Generate structured monitoring events for fresh and stale events.
    - Log a warning when the timestamp is missing.

    ## Prerequisites

    - A running Kestra instance.
    - Access to the Kestra webhook endpoint.

    ## Quick start

    1. Import this flow into Kestra.
    2. Send a webhook event containing an event_timestamp.
    3. Configure max_delay_minutes for your processing-delay requirement.
    4. Inspect the execution logs and generated monitoring event.

    ## Expected results

    - FRESH: the event is within the configured delay threshold.
    - STALE: the event exceeds the configured delay threshold.
    - MISSING TIMESTAMP: a warning is logged because the timestamp is absent.

  tags:
    - Core
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false