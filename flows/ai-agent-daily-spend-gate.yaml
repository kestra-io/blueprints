id: ai-agent-daily-spend-gate
namespace: company.team
description: |
  Refuse new AI agent work once the day's spend budget is reached, before any
  agent call runs, and record completed runs' real spend so the next gate
  decision sees it. The gate reads a daily spend ledger from the Kestra KV
  store, keyed by scope and UTC date, and fails the execution when the
  recorded spend has reached the daily budget, so no new agent work starts.
  A run with no ledger entry yet counts as zero spent. A ledger entry the gate
  cannot parse, a unit that does not match, or a record call without a real
  spend figure all fail closed instead of passing silently. This flow never
  prices tokens and never runs an agent itself: whoever records a run passes
  that run's actual billed spend, and the flow only adds and compares.

inputs:
  - id: mode
    type: STRING
    displayName: Mode
    description: Gate mode checks the ledger before agent work starts and fails when the daily budget is reached; record mode adds one completed run's real billed spend to the ledger. Any other value fails closed.
    defaults: gate
  - id: scope
    type: STRING
    displayName: Ledger scope
    description: One ledger per scope, so separate agents, teams, or projects do not share a budget. The scope is sanitised into the ledger key (anything outside letters, digits, underscore, and hyphen becomes an underscore).
    defaults: default
  - id: daily_budget
    type: FLOAT
    displayName: Daily budget
    description: Maximum spend allowed per UTC day, in the spend_unit below. A run is refused once recorded spend reaches this figure, so a budget of 10 with 10 already spent refuses the next run.
    defaults: 10
  - id: spend_unit
    type: STRING
    displayName: Spend unit
    description: Currency or unit every figure in this ledger is expressed in, for example USD. The gate refuses rather than compare figures recorded in a different unit.
    defaults: USD
  - id: run_spend
    type: FLOAT
    displayName: Completed run spend
    description: Required only in record mode, the completed run's actual billed spend, in the spend_unit above, taken from the provider's usage or billing record. Never guess this figure. Left empty in gate mode.
    required: false
  - id: ledger_key_prefix
    type: STRING
    displayName: Ledger key prefix
    description: Prefix of the KV ledger key. The full key is the prefix, the scope, and the current UTC date, joined with underscores.
    defaults: agent_daily_spend

tasks:
  - id: day_key
    type: io.kestra.plugin.scripts.python.Script
    description: Build the ledger key for today in UTC. The date is computed here, in Python, so the daily boundary is exactly midnight UTC and does not depend on the server timezone. The key is the prefix, the sanitised scope, and the UTC date.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.12-slim
    env:
      LEDGER_KEY_PREFIX: "{{ inputs.ledger_key_prefix }}"
      SCOPE: "{{ inputs.scope }}"
    script: |
      import datetime
      import json
      import os
      import re


      def emit(outputs):
          print("::" + json.dumps({"outputs": outputs}) + "::")


      def main():
          prefix = os.environ.get("LEDGER_KEY_PREFIX", "agent_daily_spend")
          scope = os.environ.get("SCOPE", "default")
          safe_scope = re.sub(r"[^A-Za-z0-9_-]", "_", scope) or "default"
          utc_date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          emit({
              "ledger_key": prefix + "_" + safe_scope + "_" + utc_date,
              "utc_date": utc_date,
          })


      main()

  - id: load_ledger
    type: io.kestra.plugin.core.kv.Get
    description: Read today's ledger entry from the KV store in this flow's namespace. errorOnMissing is false, so a day with no recorded spend yet reads as empty and the gate below treats it as zero spent, stated plainly in its verdict.
    key: "{{ outputs.day_key.vars.ledger_key }}"
    errorOnMissing: false

  - id: evaluate
    type: io.kestra.plugin.scripts.python.Script
    description: Parse the ledger entry and decide. Gate mode passes only when recorded spend is strictly below the daily budget; at or over budget it refuses, before any agent work starts. Record mode adds the completed run's real billed spend to the ledger total and hands the new total to the write task. An unparseable ledger entry, a spent figure that is not a non-negative number, a unit mismatch, a missing or negative run spend in record mode, a negative budget, or an unknown mode all yield INCONCLUSIVE, which the gate task below turns into a failure, so an unreadable state never passes.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.12-slim
    env:
      MODE: "{{ inputs.mode }}"
      LEDGER_RAW: "{{ outputs.load_ledger.value ?? '' }}"
      LEDGER_KEY: "{{ outputs.day_key.vars.ledger_key }}"
      UTC_DATE: "{{ outputs.day_key.vars.utc_date }}"
      DAILY_BUDGET: "{{ inputs.daily_budget }}"
      SPEND_UNIT: "{{ inputs.spend_unit }}"
      RUN_SPEND: "{{ inputs.run_spend ?? '' }}"
    script: |
      import json
      import os


      def emit(outputs):
          print("::" + json.dumps({"outputs": outputs}) + "::")


      def number(value):
          if isinstance(value, bool):
              return None
          if isinstance(value, (int, float)):
              return float(value)
          return None


      def fmt(value):
          return "%g" % value


      def main():
          mode = os.environ.get("MODE", "")
          raw = os.environ.get("LEDGER_RAW", "")
          ledger_key = os.environ.get("LEDGER_KEY", "")
          utc_date = os.environ.get("UTC_DATE", "")
          unit = os.environ.get("SPEND_UNIT", "")
          try:
              budget = float(os.environ.get("DAILY_BUDGET", ""))
          except ValueError:
              budget = -1.0
          base = {
              "budget": budget,
              "unit": unit,
              "ledger_key": ledger_key,
              "utc_date": utc_date,
          }
          if budget < 0:
              emit(dict(base, verdict="INCONCLUSIVE", spent=0.0, new_spent=0.0,
                         remaining=0.0,
                         reason="daily_budget must not be negative"))
              return
          if raw == "" or raw is None:
              spent = 0.0
              fresh = True
          else:
              try:
                  entry = json.loads(raw)
              except ValueError:
                  emit(dict(base, verdict="INCONCLUSIVE", spent=0.0, new_spent=0.0,
                             remaining=0.0,
                             reason="ledger entry for key " + ledger_key + " could not be parsed as JSON, refusing rather than passing on an unreadable ledger"))
                  return
              if not isinstance(entry, dict):
                  emit(dict(base, verdict="INCONCLUSIVE", spent=0.0, new_spent=0.0,
                             remaining=0.0,
                             reason="ledger entry for key " + ledger_key + " is not a JSON object, refusing rather than passing on an unreadable ledger"))
                  return
              spent = number(entry.get("spent"))
              if spent is None or spent < 0:
                  emit(dict(base, verdict="INCONCLUSIVE", spent=0.0, new_spent=0.0,
                             remaining=0.0,
                             reason="ledger entry for key " + ledger_key + " has no usable non-negative spent figure, refusing rather than passing on unknown spend"))
                  return
              if entry.get("unit") != unit:
                  emit(dict(base, verdict="INCONCLUSIVE", spent=spent, new_spent=spent,
                             remaining=max(budget - spent, 0.0),
                             reason="ledger entry for key " + ledger_key + " is recorded in " + str(entry.get("unit")) + ", not in " + unit + ", refusing rather than mixing units"))
                  return
              fresh = False
          if mode == "gate":
              if spent >= budget:
                  emit(dict(base, verdict="REFUSED", spent=spent, new_spent=spent,
                             remaining=0.0,
                             reason="recorded spend " + fmt(spent) + " " + unit + " has reached the daily budget of " + fmt(budget) + " " + unit + (" (no ledger entry yet, counted as zero spent)" if fresh else "") + "; no new agent work starts today under this scope"))
              else:
                  emit(dict(base, verdict="PASS", spent=spent, new_spent=spent,
                             remaining=budget - spent,
                             reason="recorded spend " + fmt(spent) + " " + unit + " is below the daily budget of " + fmt(budget) + " " + unit + (" (no ledger entry yet, counted as zero spent)" if fresh else "") + "; " + fmt(budget - spent) + " " + unit + " remains"))
          elif mode == "record":
              run_raw = os.environ.get("RUN_SPEND", "")
              if run_raw in ("", "None", "null"):
                  emit(dict(base, verdict="INCONCLUSIVE", spent=spent, new_spent=spent,
                             remaining=max(budget - spent, 0.0),
                             reason="record mode requires run_spend, the completed run's actual billed spend; refusing to record an unknown figure as zero"))
                  return
              try:
                  run_spend = float(run_raw)
              except ValueError:
                  emit(dict(base, verdict="INCONCLUSIVE", spent=spent, new_spent=spent,
                             remaining=max(budget - spent, 0.0),
                             reason="run_spend could not be parsed as a number, refusing to record an unknown figure"))
                  return
              if run_spend < 0:
                  emit(dict(base, verdict="INCONCLUSIVE", spent=spent, new_spent=spent,
                             remaining=max(budget - spent, 0.0),
                             reason="run_spend must not be negative, refusing to record it"))
                  return
              new_spent = spent + run_spend
              emit(dict(base, verdict="RECORDED", spent=spent, new_spent=new_spent,
                         remaining=max(budget - new_spent, 0.0),
                         reason="recorded " + fmt(run_spend) + " " + unit + " for one completed run; ledger total for " + utc_date + " is now " + fmt(new_spent) + " " + unit))
          else:
              emit(dict(base, verdict="INCONCLUSIVE", spent=spent, new_spent=spent,
                         remaining=max(budget - spent, 0.0),
                         reason="unknown mode '" + mode + "', expected gate or record, refusing rather than guessing"))


      main()

  - id: refuse_gate
    type: io.kestra.plugin.core.flow.If
    description: The enforcement point. A REFUSED or INCONCLUSIVE verdict fails the execution here, before any agent work starts, with a message naming the recorded spend, the budget, the unit, the ledger key, and the reason. Only PASS and RECORDED verdicts continue.
    condition: "{{ outputs.evaluate.vars.verdict == 'REFUSED' or outputs.evaluate.vars.verdict == 'INCONCLUSIVE' }}"
    then:
      - id: budget_refused
        type: io.kestra.plugin.core.execution.Fail
        description: Stop the run. Nothing downstream runs, so a refused day cannot start new agent work and an unreadable ledger cannot silently pass.
        errorMessage: "Daily spend gate {{ outputs.evaluate.vars.verdict }} for ledger {{ outputs.evaluate.vars.ledger_key }} ({{ outputs.evaluate.vars.utc_date }} UTC): recorded spend {{ outputs.evaluate.vars.spent }} {{ outputs.evaluate.vars.unit }}, daily budget {{ outputs.evaluate.vars.budget }} {{ outputs.evaluate.vars.unit }}. Reason: {{ outputs.evaluate.vars.reason }}"

  - id: record_spend
    type: io.kestra.plugin.core.flow.If
    description: In record mode only, write the new ledger total back to the same KV key, so the next gate decision sees this run's spend. Gate mode skips this task entirely and the ledger is untouched.
    condition: "{{ outputs.evaluate.vars.verdict == 'RECORDED' }}"
    then:
      - id: write_ledger
        type: io.kestra.plugin.core.kv.Set
        description: Overwrite today's ledger entry with the new total, the spend unit, the UTC date, and the recording execution id.
        key: "{{ outputs.day_key.vars.ledger_key }}"
        kvType: JSON
        value: '{"spent": {{ outputs.evaluate.vars.new_spent }}, "unit": "{{ inputs.spend_unit }}", "date": "{{ outputs.day_key.vars.utc_date }}", "recorded_by_execution": "{{ execution.id }}"}'

  - id: deliver
    type: io.kestra.plugin.core.debug.Return
    description: Report the decision. In gate mode this runs only on a PASS verdict and the caller may now start agent work; in record mode it confirms the new ledger total.
    format: "Daily spend gate {{ outputs.evaluate.vars.verdict }} for ledger {{ outputs.evaluate.vars.ledger_key }} ({{ outputs.evaluate.vars.utc_date }} UTC): recorded spend {{ outputs.evaluate.vars.spent }} {{ outputs.evaluate.vars.unit }}, daily budget {{ outputs.evaluate.vars.budget }} {{ outputs.evaluate.vars.unit }}, remaining {{ outputs.evaluate.vars.remaining }} {{ outputs.evaluate.vars.unit }}. {{ outputs.evaluate.vars.reason }}"

outputs:
  - id: verdict
    type: STRING
    description: PASS when the day is under budget, REFUSED when recorded spend reached the budget, RECORDED when a run's spend was written, INCONCLUSIVE when the gate could not establish the spend and refused to guess.
    value: "{{ outputs.evaluate.vars.verdict }}"
  - id: spent
    type: FLOAT
    description: Recorded spend for today before this run, zero when no ledger entry exists yet.
    value: "{{ outputs.evaluate.vars.spent }}"
  - id: new_spent
    type: FLOAT
    description: Ledger total after this run in record mode, otherwise equal to spent.
    value: "{{ outputs.evaluate.vars.new_spent }}"
  - id: remaining
    type: FLOAT
    description: Daily budget minus the applicable spend total, floored at zero.
    value: "{{ outputs.evaluate.vars.remaining }}"
  - id: budget
    type: FLOAT
    description: The daily budget this decision was checked against.
    value: "{{ outputs.evaluate.vars.budget }}"
  - id: unit
    type: STRING
    description: The spend unit every figure in this decision is expressed in.
    value: "{{ outputs.evaluate.vars.unit }}"
  - id: ledger_key
    type: STRING
    description: The KV ledger key read or written by this run.
    value: "{{ outputs.evaluate.vars.ledger_key }}"
  - id: utc_date
    type: STRING
    description: The UTC date the ledger key belongs to.
    value: "{{ outputs.evaluate.vars.utc_date }}"
  - id: reason
    type: STRING
    description: Plain-language explanation of the verdict, including the figures behind it.
    value: "{{ outputs.evaluate.vars.reason }}"

extend:
  shortDescription: Refuse new AI agent work once the day's spend budget is reached
  title: AI Agent Daily Spend Gate
  metaTitle: AI Agent Daily Spend Gate | Kestra
  description: |
    ## What it does

    This flow is a pre-run, cross-call budget gate for AI agent work. Run it in
    `gate` mode before any agent work starts: it reads a daily spend ledger
    from the Kestra KV store, keyed by scope and UTC date, and fails the
    execution when the recorded spend for today has reached the daily budget,
    so no new agent call runs and no new tokens are bought. Run it in `record`
    mode after a run completes, passing that run's actual billed spend, and it
    adds the figure to the same ledger key, so the next gate decision sees it.
    A day with no ledger entry yet counts as zero spent, stated plainly in the
    verdict. A ledger entry the gate cannot parse, a unit that does not match
    the configured unit, or a record call without a real spend figure all fail
    closed instead of passing silently. The flow never prices tokens and never
    runs an agent itself: it only adds and compares figures the caller supplies
    from a real billing record, so no spend figure in it is invented.

    ## Prerequisites

    - A Kestra instance with the KV store enabled in the namespace this flow
      runs in. The ledger lives in that namespace's KV store under a key of the
      form `agent_daily_spend_<scope>_<UTC date>`, for example
      `agent_daily_spend_default_2026-10-30`.
    - A real source for each completed run's billed spend, such as the model
      provider's usage or billing record, to pass as `run_spend` in record
      mode. This flow does not convert token counts into money: token prices
      differ by model and change, so any conversion done here would be a guess.
    - A caller that honours the verdict: run this flow (directly, or as a
      subflow) before the agent flow, start agent work only on a PASS verdict,
      and run it again in record mode once the agent run finishes.

    ### Secrets

    None. This flow carries no secrets and no sample data.

    ## How it works

    1. `day_key` (`io.kestra.plugin.scripts.python.Script`) builds the ledger
       key for today in UTC and sanitises the scope into it, so the daily
       boundary is exactly midnight UTC regardless of server timezone.
    2. `load_ledger` (`io.kestra.plugin.core.kv.Get`) reads that key with
       `errorOnMissing: false`, so a day with no recorded spend yet reads as
       empty instead of erroring.
    3. `evaluate` (`io.kestra.plugin.scripts.python.Script`) parses the ledger
       entry, which must be a JSON object with a non-negative `spent` number
       and a `unit` matching `spend_unit`. In gate mode it passes only when
       recorded spend is strictly below `daily_budget` (default 10 USD), and
       refuses at or over budget. In record mode it adds `run_spend` to the
       recorded total. Anything unreadable, mismatched, missing, or negative
       yields INCONCLUSIVE.
    4. `refuse_gate` (`io.kestra.plugin.core.flow.If`) fails the execution on
       a REFUSED or INCONCLUSIVE verdict, with a message naming the recorded
       spend, the budget, the unit, the ledger key, and the reason. This is
       the enforcement point, and it sits before any agent work, because this
       flow contains no agent task at all: the agent flow only starts if the
       caller sees a PASS verdict.
    5. `record_spend` (`io.kestra.plugin.core.flow.If`) runs only on a
       RECORDED verdict and writes the new total back with
       `io.kestra.plugin.core.kv.Set` under the same key, so the next gate
       decision sees this run's spend.
    6. `deliver` (`io.kestra.plugin.core.debug.Return`) reports the verdict
       with the spend, budget, remaining budget, ledger key, and reason.

    ## How to adapt it

    - Give each agent, team, or project its own `scope` so budgets do not
      leak across them, and set `daily_budget` and `spend_unit` per scope to
      match the provider's billing unit.
    - Wire the gate as a subflow call at the top of an agent flow, and the
      record call at the end of it, passing the run's billed spend from the
      provider's usage record. If the agent flow itself fails partway, record
      the partial run's billed spend anyway: unrecorded spend is spend the
      next gate cannot see.
    - Add a notification (Slack, email, or a GitHub issue) on the REFUSED
      branch if a refused day should page someone instead of only failing.
    - Note the honest limit: the ledger is a read-modify-write on one KV key,
      so two record runs finishing at the same instant can overwrite each
      other and lose one figure. Where that matters, serialise record runs
      (for example, one scheduled record flow that drains a queue) instead of
      recording concurrently.
    - This gate caps spend across calls; it does not cap a single call. Pair
      it with per-call limits on the agent or provider configuration for a
      runaway single call, which is a different control from this one.

  tags:
    - AI
  subTags:
    - Agents & Structured Output
  ee: false
  demo: false
  metaDescription: "Refuse new AI agent work once the day's spend budget is reached, before any agent call runs, and record each completed run's real spend for the next gate decision."
