id: ai-huggingface-trending-models-gemini-telegram
namespace: company.team

triggers:
  - id: daily_digest_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    disabled: true

tasks:
  - id: fetch_trending_models
    type: io.kestra.plugin.core.http.Request
    description: "Pull the five most-liked models of the past seven days from the public Hugging Face API."
    uri: "https://huggingface.co/api/models?sort=likes7d&direction=-1&limit=5"
    method: GET

  - id: analyze_models_with_gemini
    type: io.kestra.plugin.gemini.StructuredOutputCompletion
    description: "Send the raw model metadata to Gemini and get back a structured developer briefing with a ready-to-post Telegram message."
    apiKey: "{{ secret('GEMINI_API_KEY') }}"
    model: "gemini-3.5-flash-lite"
    prompt: |
      You are an AI research analyst. Analyze the following list of top trending open-source AI models from Hugging Face.

      For each model produce:
      - **Model name** and author
      - One-line summary of what it does
      - Primary architecture (e.g. Transformer, Diffusion, MoE)
      - Why it is trending this week

      Format the output as a clean Telegram-compatible Markdown message with bullet points.

      Raw models payload:
      {{ outputs.fetch_trending_models.body }}
    jsonResponseSchema: |
      {
        "type": "object",
        "properties": {
          "digest_date": {
            "type": "string",
            "description": "ISO date of the digest"
          },
          "model_count": {
            "type": "integer",
            "description": "Number of models analyzed"
          },
          "top_highlights": {
            "type": "string",
            "description": "One-paragraph executive summary of this week's trends"
          },
          "formatted_telegram_message": {
            "type": "string",
            "description": "Full Telegram-ready Markdown message with per-model bullet points"
          }
        },
        "required": ["formatted_telegram_message", "top_highlights"]
      }

  - id: verify_and_notify
    type: io.kestra.plugin.core.flow.If
    description: "Gate the notification: only post to Telegram when Gemini returned a valid digest."
    condition: "{{ outputs.analyze_models_with_gemini.predictions | first | jq('.formatted_telegram_message') | first != null }}"
    then:
      - id: send_telegram_digest
        type: io.kestra.plugin.telegram.TelegramSend
        description: "Post the formatted AI digest to the configured Telegram channel."
        channel: "{{ secret('TELEGRAM_CHANNEL_ID') }}"
        token: "{{ secret('TELEGRAM_BOT_TOKEN') }}"
        payload: |
          *Hugging Face Trending AI Models, Daily Digest*

          {{ outputs.analyze_models_with_gemini.predictions | first | jq('.top_highlights') | first }}

          {{ outputs.analyze_models_with_gemini.predictions | first | jq('.formatted_telegram_message') | first }}

          _Powered by Kestra + Google Gemini_

      - id: log_success
        type: io.kestra.plugin.core.log.Log
        message: "Digest sent to Telegram for execution {{ execution.id }}."
    else:
      - id: log_skip
        type: io.kestra.plugin.core.log.Log
        message: "Gemini returned no digest; Telegram notification skipped."

extend:
  title: "Daily Hugging Face Trending AI Models Digest to Telegram via Google Gemini"
  metaTitle: "Hugging Face Trending Models to Telegram with Gemini and Kestra"
  shortDescription: "Fetch the week's hottest open-source AI models from Hugging Face, distil them into an engineer-friendly briefing with Google Gemini, and broadcast it to Telegram, fully automated."
  metaDescription: "Automate daily AI intelligence: pull trending Hugging Face models, summarize with Google Gemini structured outputs, and deliver to Telegram with Kestra."
  tags:
    - AI
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  verified: false
  demo: false
  description: |
    New foundation models, fine-tunes, and multimodal architectures land on Hugging Face every day. Manually checking the trending page is easy to forget and hard to share with a team. This blueprint turns that browse-and-forward routine into a zero-touch pipeline: discover, summarize, deliver.

    ## How it works

    1. `fetch_trending_models` (`io.kestra.plugin.core.http.Request`) queries the public Hugging Face API for the five models with the most likes over the past seven days.
    2. `analyze_models_with_gemini` (`io.kestra.plugin.gemini.StructuredOutputCompletion`) feeds the raw metadata into `gemini-3.5-flash-lite` with a `jsonResponseSchema` that enforces a typed response: an executive highlight paragraph plus a per-model Telegram-ready Markdown message.
    3. `verify_and_notify` (`io.kestra.plugin.core.flow.If`) gates the notification, Telegram is only called when Gemini actually produced a digest.
    4. `send_telegram_digest` (`io.kestra.plugin.telegram.TelegramSend`) posts the formatted digest to your channel or group chat.
    5. A disabled `daily_digest_schedule` (`io.kestra.plugin.core.trigger.Schedule`) provides the `0 8 * * *` cron so you can enable it for fully unattended morning delivery.

    ## What you get

    - **Automated discovery** of trending open-source models without manual browsing.
    - **Structured AI summaries**, architecture, use-case, and trending reason per model, not raw JSON.
    - **Conditional delivery**, no empty messages hit the channel when the API or Gemini returns nothing.
    - **Zero infrastructure**, runs entirely on Kestra with no additional compute to maintain.

    ## Who it's for

    - AI engineers and ML researchers tracking the open-source ecosystem.
    - Engineering leads who want a daily team briefing without writing a script.
    - Developer communities and Telegram groups focused on AI news.

    ## Quick start

    1. Add three secrets to your Kestra namespace: `GEMINI_API_KEY`, `TELEGRAM_BOT_TOKEN`, `TELEGRAM_CHANNEL_ID`.
    2. Run the flow manually and confirm the Telegram message arrives.
    3. Enable `daily_digest_schedule` by setting `disabled: false` and adjust the cron to your timezone.

    ## How to extend

    - Swap Telegram for Slack (`io.kestra.plugin.slack`) or Discord (`io.kestra.plugin.discord`) by replacing the notification task.
    - Increase the `limit` query parameter to cover more models, or change `sort` to `downloads` for a different ranking.
    - Add a `Loop` over multiple Hugging Face tags (e.g. `text-generation`, `image-classification`) and fan out one digest per domain.
    - Store each digest in a KV store or database to build a searchable archive of weekly AI trends.

    ## Prerequisites

    - A Google Gemini API key ([Google AI Studio](https://aistudio.google.com)).
    - A Telegram Bot token (create one via [@BotFather](https://t.me/BotFather)).
    - A Telegram channel username (`@my_channel`) or numeric chat ID.

    ### Secrets

    | Secret | Description |
    |---|---|
    | `GEMINI_API_KEY` | API key for Google AI Studio |
    | `TELEGRAM_BOT_TOKEN` | Bot token from BotFather |
    | `TELEGRAM_CHANNEL_ID` | Channel username or chat ID |

    ## Links

    - [plugin-gemini docs](https://kestra.io/plugins/plugin-gemini)
    - [plugin-telegram docs](https://kestra.io/plugins/plugin-telegram)
    - [Hugging Face Models API](https://huggingface.co/docs/hub/api)
