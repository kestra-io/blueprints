id: runtime-end-of-life-guard
namespace: company.team

description: |
  Scan a repository for pinned runtime, database and base OS versions, check each one against
  endoflife.date, and open one GitHub issue per version that is past or close to end of life.

inputs:
  - id: repository
    type: STRING
    displayName: Repository to scan
    description: GitHub repository in owner/repo form. The default is a public repo of Docker Compose samples with many old pins.
    defaults: docker/awesome-compose

  - id: branch
    type: STRING
    displayName: Branch
    description: Branch to check out. Usually your default branch, since that is what ships.
    defaults: master

  - id: warn_days
    type: INT
    displayName: Warning window in days
    description: A version whose end-of-life date is this many days away or fewer is reported as eol_soon. Six months leaves time to plan an upgrade.
    defaults: 180

  - id: issue_repository
    type: STRING
    displayName: Repository that receives the issues
    description: Where issues are opened, commented and closed, in owner/repo form. Often the same as the scanned repository.
    defaults: your-org/your-repo

  - id: max_issues
    type: INT
    displayName: Max issues per run
    description: Safety cap on new or escalated versions handled per run, worst first. The rest stay out of the saved state, so the next run picks them up.
    defaults: 10

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Log every issue the flow would open, comment on or close without calling GitHub. Leave this on until the report looks right.
    defaults: true

variables:
  # Dry runs keep their own state, so switching to live runs still opens every issue.
  state_key: "runtime_eol_{{ inputs.repository | replace({'/': '_', '-': '_', '.': '_'}) }}{{ inputs.dry_run ? '_dry_run' : '' }}"

concurrency:
  limit: 1
  behavior: QUEUE

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: End-of-life dates move slowly, so once a week is enough. Shipped disabled; enable it after a manual run looks right.
    cron: "0 7 * * 1"
    disabled: true

  - id: on_push
    type: io.kestra.plugin.core.trigger.Webhook
    description: Event-based scan. Point a GitHub push webhook (or a CI step) at this URL so a Dockerfile or compose change is checked the moment it lands. The key guards the URL, so keep it in a secret.
    key: "{{ secret('EOL_GUARD_WEBHOOK_KEY') }}"

tasks:
  - id: read_state
    type: io.kestra.plugin.core.kv.Get
    description: Versions this flow already reported for the repository, with the status they had. Missing on the first run, which starts from nothing.
    key: "{{ render(vars.state_key) }}"
    errorOnMissing: false

  - id: scan_repository
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One directory so the version scan sees the files the clone just checked out.
    tasks:
      - id: clone_repository
        type: io.kestra.plugin.git.Clone
        description: Shallow checkout of the branch. Add username and password (a token) for a private repository.
        url: "https://github.com/{{ inputs.repository }}.git"
        branch: "{{ inputs.branch }}"
        depth: 1

      - id: find_pinned_versions
        type: io.kestra.plugin.scripts.python.Script
        description: >
          Walks the checkout and lists every pinned version it can read: Dockerfile FROM lines,
          image references in compose files, Kubernetes manifests and Helm values, setup-python,
          setup-node and setup-go versions in CI files, .python-version, .nvmrc, .node-version,
          .tool-versions and the go directive in go.mod. Debian and Ubuntu codenames in a tag
          (node:18-bullseye, eclipse-temurin:17-jre-focal) count as a base OS pin too. Floating
          tags such as latest or lts are listed separately, since there is no version to check.
          Standard library only, so no pip install.
        containerImage: python:3.12-slim
        outputFiles:
          - inventory.json
        script: |
          import json
          import os
          import re

          IMAGE_PRODUCTS = {
              "python": "python",
              "node": "nodejs",
              "golang": "go",
              "postgres": "postgresql",
              "mysql": "mysql",
              "mariadb": "mariadb",
              "redis": "redis",
              "valkey/valkey": "valkey",
              "mongo": "mongodb",
              "nginx": "nginx",
              "httpd": "apache-http-server",
              "haproxy": "haproxy",
              "traefik": "traefik",
              "alpine": "alpine-linux",
              "ubuntu": "ubuntu",
              "debian": "debian",
              "ruby": "ruby",
              "php": "php",
              "rust": "rust",
              "eclipse-temurin": "eclipse-temurin",
              "amazoncorretto": "amazon-corretto",
              "tomcat": "tomcat",
              "rabbitmq": "rabbitmq",
              "memcached": "memcached",
              "elasticsearch": "elasticsearch",
              "docker.elastic.co/elasticsearch/elasticsearch": "elasticsearch",
              "logstash": "logstash",
              "docker.elastic.co/logstash/logstash": "logstash",
              "kibana": "kibana",
              "docker.elastic.co/kibana/kibana": "kibana",
              "grafana/grafana": "grafana",
              "prom/prometheus": "prometheus",
              "quay.io/keycloak/keycloak": "keycloak",
              "jenkins/jenkins": "jenkins",
              "wordpress": "wordpress",
              "nextcloud": "nextcloud",
              "drupal": "drupal",
              "mcr.microsoft.com/dotnet/sdk": "dotnet",
              "mcr.microsoft.com/dotnet/aspnet": "dotnet",
              "mcr.microsoft.com/dotnet/runtime": "dotnet",
              "mcr.microsoft.com/dotnet/runtime-deps": "dotnet",
          }
          TOOL_PRODUCTS = {
              "python": "python",
              "nodejs": "nodejs",
              "node": "nodejs",
              "golang": "go",
              "go": "go",
              "ruby": "ruby",
              "php": "php",
              "rust": "rust",
              "terraform": "terraform",
              "kubectl": "kubernetes",
          }
          SETUP_KEYS = {"python-version": "python", "node-version": "nodejs", "go-version": "go"}
          SKIP_DIRS = {".git", "node_modules", "vendor", ".venv", "venv", "dist", "build", "target"}
          # Debian and Ubuntu codenames that show up as image tag suffixes, e.g. node:18-bullseye or eclipse-temurin:17-jre-focal.
          BASE_OS = {
              "stretch": "debian", "buster": "debian", "bullseye": "debian", "bookworm": "debian", "trixie": "debian",
              "xenial": "ubuntu", "bionic": "ubuntu", "focal": "ubuntu", "jammy": "ubuntu", "noble": "ubuntu",
          }
          FLOATING = {"", "latest", "lts", "stable", "current", "alpine", "slim", "mainline"}

          findings = []
          floating = []


          def record(product, version, path, line, source):
              findings.append({"product": product, "version": version, "file": path, "line": line, "source": source})


          def split_image(ref):
              ref = ref.strip().strip("'\"")
              if "${" in ref or "$" in ref:
                  return None, None
              ref = ref.split("@", 1)[0]
              name, tag = ref, ""
              last = ref.rsplit("/", 1)[-1]
              if ":" in last:
                  name, tag = ref.rsplit(":", 1)
              for prefix in ("docker.io/library/", "docker.io/", "library/"):
                  if name.startswith(prefix):
                      name = name[len(prefix):]
              return name, tag


          def check_image(ref, path, line, source):
              name, tag = split_image(ref)
              if name is None or name not in IMAGE_PRODUCTS:
                  return
              product = IMAGE_PRODUCTS[name]
              for token in tag.split("-"):
                  if token in BASE_OS and not (product == BASE_OS[token] and tag.startswith(token)):
                      record(BASE_OS[token], "codename:" + token, path, line, "base OS of " + ref.strip())
              match = re.match(r"v?(\d+(?:\.\d+)*)", tag)
              if match:
                  record(product, match.group(1), path, line, source)
                  return
              if product in ("debian", "ubuntu") and tag.split("-")[0] in BASE_OS:
                  record(product, "codename:" + tag.split("-")[0], path, line, source)
                  return
              floating.append({"product": product, "image": ref.strip(), "file": path, "line": line})


          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
              for fname in files:
                  path = os.path.relpath(os.path.join(root, fname), ".")
                  lower = fname.lower()
                  is_dockerfile = lower == "dockerfile" or lower.startswith("dockerfile.") or lower.endswith(".dockerfile")
                  is_yaml = lower.endswith((".yml", ".yaml"))
                  is_pin = lower in (".python-version", ".nvmrc", ".node-version", ".tool-versions", "go.mod")
                  if not (is_dockerfile or is_yaml or is_pin):
                      continue
                  try:
                      with open(path, encoding="utf-8", errors="replace") as fh:
                          lines = fh.read().splitlines()
                  except OSError:
                      continue
                  stages = set()
                  for n, raw in enumerate(lines, start=1):
                      text = raw.split("#", 1)[0].strip() if not is_dockerfile else raw.strip()
                      if is_dockerfile and re.match(r"(?i)^from\s", text):
                          parts = [p for p in text.split()[1:] if not p.startswith("--")]
                          if not parts:
                              continue
                          if len(parts) >= 3 and parts[1].lower() == "as":
                              stages.add(parts[2].lower())
                          if parts[0].lower() in stages or parts[0].lower() == "scratch":
                              continue
                          check_image(parts[0], path, n, "Dockerfile FROM")
                      elif is_yaml:
                          image = re.match(r"^-?\s*image:\s*(\S+)", text)
                          if image:
                              check_image(image.group(1), path, n, "image reference")
                              continue
                          setup = re.match(r"^-?\s*(python-version|node-version|go-version):\s*(.+)$", text)
                          if setup:
                              product = SETUP_KEYS[setup.group(1)]
                              for value in re.findall(r"v?(\d+(?:\.\d+)*)", setup.group(2).replace("'", " ").replace('"', " ")):
                                  record(product, value, path, n, "CI setup " + setup.group(1))
                      elif lower in (".python-version", ".nvmrc", ".node-version") and text:
                          product = "python" if lower == ".python-version" else "nodejs"
                          value = re.match(r"v?(\d+(?:\.\d+)*)", text)
                          if value:
                              record(product, value.group(1), path, n, lower)
                      elif lower == ".tool-versions" and text:
                          parts = text.split()
                          if len(parts) >= 2 and parts[0] in TOOL_PRODUCTS:
                              value = re.match(r"v?(\d+(?:\.\d+)*)", parts[1])
                              if value:
                                  record(TOOL_PRODUCTS[parts[0]], value.group(1), path, n, ".tool-versions")
                      elif lower == "go.mod":
                          value = re.match(r"^go\s+(\d+\.\d+)", text)
                          if value:
                              record("go", value.group(1), path, n, "go.mod")

          with open("inventory.json", "w", encoding="utf-8") as fh:
              json.dump({"findings": findings, "floating": floating}, fh, indent=2)
          print("version pins found: {}, floating tags: {}".format(len(findings), len(floating)))

  - id: check_end_of_life
    type: io.kestra.plugin.scripts.python.Script
    description: >
      Fetches the release cycles of each product once from the endoflife.date API, matches
      every pinned version to its cycle, and classifies the cycle as eol, eol_soon or
      supported. A cycle is actionable when it is new to the risk list or moved from
      eol_soon to eol since the saved state, so a version already reported stays quiet.
      Writes a Markdown report of everything it found.
    containerImage: python:3.12-slim
    env:
      WARN_DAYS: "{{ inputs.warn_days }}"
      MAX_ISSUES: "{{ inputs.max_issues }}"
    inputFiles:
      inventory.json: "{{ outputs.find_pinned_versions.outputFiles['inventory.json'] }}"
      previous.json: "{{ outputs.read_state.value ?? '' }}"
    outputFiles:
      - eol-report.md
    script: |
      import datetime
      import json
      import os
      import urllib.error
      import urllib.request

      WARN_DAYS = int(os.environ.get("WARN_DAYS", "180"))
      MAX_ISSUES = max(0, int(os.environ.get("MAX_ISSUES", "10")))
      API = os.environ.get("EOL_API", "https://endoflife.date/api/v1/products/")
      TODAY = datetime.datetime.now(datetime.timezone.utc).date()
      RANK = {"eol": 2, "eol_soon": 1, "supported": 0}

      with open("inventory.json", encoding="utf-8") as fh:
          inventory = json.load(fh)

      previous = {}
      if os.path.exists("previous.json"):
          text = open("previous.json", encoding="utf-8").read().strip()
          if text:
              previous = json.loads(text)

      releases = {}
      lookup_errors = []
      for product in sorted({f["product"] for f in inventory["findings"]}):
          request = urllib.request.Request(API + product + "/", headers={"User-Agent": "kestra-runtime-eol-guard"})
          try:
              with urllib.request.urlopen(request, timeout=30) as resp:
                  releases[product] = json.load(resp)["result"]["releases"]
          except urllib.error.HTTPError as err:
              lookup_errors.append("{} (HTTP {})".format(product, err.code))
      if len(lookup_errors) == len({f["product"] for f in inventory["findings"]}) and lookup_errors:
          raise SystemExit("endoflife.date lookups all failed: " + ", ".join(lookup_errors))


      def match_cycle(product, version):
          cycles = releases.get(product, [])
          if version.startswith("codename:"):
              word = version.split(":", 1)[1]
              for rel in cycles:
                  if (rel.get("codename") or "").lower().split(" ")[0] == word:
                      return rel
              return None
          best = None
          for rel in cycles:
              name = rel["name"]
              if version == name or version.startswith(name + "."):
                  if best is None or len(name) > len(best["name"]):
                      best = rel
          if best is None:
              # A major-only tag such as mysql:8 floats to the newest 8.x cycle. Releases are listed newest first.
              for rel in cycles:
                  if rel["name"].startswith(version + "."):
                      return rel
          return best


      cycles = {}
      untracked = []
      for item in inventory["findings"]:
          rel = match_cycle(item["product"], item["version"])
          if rel is None:
              if item["product"] in releases:
                  untracked.append(item)
              continue
          key = "{}@{}".format(item["product"], rel["name"])
          entry = cycles.setdefault(key, {
              "key": key,
              "product": item["product"],
              "cycle": rel["name"],
              "eol_date": rel.get("eolFrom"),
              "is_eol": bool(rel.get("isEol")),
              "latest": (rel.get("latest") or {}).get("name"),
              "locations": [],
          })
          entry["locations"].append("{}:{} ({}, {})".format(item["file"], item["line"], item["source"], item["version"]))

      for entry in cycles.values():
          days = None
          if entry["eol_date"]:
              days = (datetime.date.fromisoformat(entry["eol_date"]) - TODAY).days
          entry["days_left"] = days
          if entry["is_eol"] or (days is not None and days < 0):
              entry["status"] = "eol"
          elif days is not None and days <= WARN_DAYS:
              entry["status"] = "eol_soon"
          else:
              entry["status"] = "supported"

      ordered = sorted(cycles.values(), key=lambda e: (-RANK[e["status"]], e["days_left"] if e["days_left"] is not None else 99999, e["key"]))
      at_risk = [e for e in ordered if e["status"] != "supported"]
      # Only a runtime that is new to the risk list, or that moved from eol_soon to eol, needs a person to look at it.
      actionable = [e for e in at_risk if RANK[e["status"]] > RANK.get(previous.get(e["key"], "supported"), 0)]
      selected = actionable[:MAX_ISSUES]
      deferred = actionable[MAX_ISSUES:]
      cleared = sorted(k for k, s in previous.items() if s != "supported" and (k not in cycles or cycles[k]["status"] == "supported"))

      # The next baseline records handled runtimes only, so anything over the cap is reported again next run.
      handled = {e["key"] for e in selected}
      state = {}
      for e in at_risk:
          if e["key"] in handled:
              state[e["key"]] = e["status"]
          elif e["key"] in previous:
              state[e["key"]] = previous[e["key"]]

      lines = ["# Runtime end-of-life report", "", "Checked on {} UTC against endoflife.date. Warning window: {} days.".format(TODAY, WARN_DAYS), ""]
      lines.append("| Runtime | Cycle | Status | EOL date | Days left | Latest patch | Where |")
      lines.append("| --- | --- | --- | --- | --- | --- | --- |")
      for e in ordered:
          lines.append("| {} | {} | {} | {} | {} | {} | {} |".format(
              e["product"], e["cycle"], e["status"], e["eol_date"] or "not set", "" if e["days_left"] is None else e["days_left"],
              e["latest"] or "", "<br>".join(e["locations"])))
      if untracked:
          lines += ["", "## Versions endoflife.date does not track", ""]
          lines += ["- {} {} at {}:{}".format(u["product"], u["version"], u["file"], u["line"]) for u in untracked]
      if inventory["floating"]:
          lines += ["", "## Floating tags (no version to check)", ""]
          lines += ["- `{}` at {}:{}".format(f["image"], f["file"], f["line"]) for f in inventory["floating"]]
      if lookup_errors:
          lines += ["", "## Lookups that failed", ""] + ["- " + e for e in lookup_errors]
      with open("eol-report.md", "w", encoding="utf-8") as fh:
          fh.write("\n".join(lines) + "\n")


      def issue_view(e):
          when = "reached end of life on {}".format(e["eol_date"]) if e["status"] == "eol" else "reaches end of life on {} ({} days left)".format(e["eol_date"], e["days_left"])
          if e["status"] == "eol" and not e["eol_date"]:
              when = "is marked end of life"
          return json.dumps({
              "key": e["key"],
              "title": "End of life: {} {}".format(e["product"], e["cycle"]),
              "status": e["status"],
              "summary": "{} {} {}".format(e["product"], e["cycle"], when),
              "latest": e["latest"] or "unknown",
              "locations": "\n".join("- `{}`".format(loc) for loc in e["locations"]),
              "product": e["product"],
          })


      verdict = {
          "runtimes_checked": len(ordered),
          "eol_count": sum(1 for e in ordered if e["status"] == "eol"),
          "eol_soon_count": sum(1 for e in ordered if e["status"] == "eol_soon"),
          "floating_count": len(inventory["floating"]),
          "untracked_count": len(untracked),
          "actionable_count": len(actionable),
          "selected_count": len(selected),
          "deferred_count": len(deferred),
          "has_actionable": len(selected) > 0,
          "selected_json": [issue_view(e) for e in selected],
          "at_risk_list": ", ".join("{} ({})".format(e["key"], e["status"]) for e in at_risk) or "none",
          "has_cleared": len(cleared) > 0,
          "cleared_json": [json.dumps({"key": k, "title": "End of life: " + k.replace("@", " ")}) for k in cleared],
          "cleared_list": ", ".join(cleared) or "none",
          "state_json": json.dumps(state, sort_keys=True),
      }
      print("::" + json.dumps({"outputs": verdict}) + "::")
      print("checked={runtimes_checked} eol={eol_count} eol_soon={eol_soon_count} actionable={actionable_count} selected={selected_count}".format(**verdict))

  - id: log_summary
    type: io.kestra.plugin.core.log.Log
    description: Full counts next to what this run handles, so a capped run never reads as complete.
    message: |
      {{ inputs.repository }}@{{ inputs.branch }}: {{ outputs.check_end_of_life.vars.runtimes_checked }} runtime cycle(s) checked, {{ outputs.check_end_of_life.vars.eol_count }} past end of life, {{ outputs.check_end_of_life.vars.eol_soon_count }} within {{ inputs.warn_days }} days.
      At risk: {{ outputs.check_end_of_life.vars.at_risk_list }}
      New or escalated since the last run: {{ outputs.check_end_of_life.vars.actionable_count }}, handled now: {{ outputs.check_end_of_life.vars.selected_count }}, left for the next run: {{ outputs.check_end_of_life.vars.deferred_count }}.
      No longer at risk: {{ outputs.check_end_of_life.vars.cleared_list }}
      Floating tags: {{ outputs.check_end_of_life.vars.floating_count }}. Versions endoflife.date does not track: {{ outputs.check_end_of_life.vars.untracked_count }}.

  - id: report_at_risk
    type: io.kestra.plugin.core.flow.If
    description: Open or update one issue per new or escalated version.
    condition: "{{ outputs.check_end_of_life.vars.has_actionable }}"
    then:
      - id: at_risk_mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.dry_run }}"
        then:
          - id: planned_issues
            type: io.kestra.plugin.core.flow.Loop
            values: "{{ outputs.check_end_of_life.vars.selected_json }}"
            concurrencyLimit: 1
            tasks:
              - id: would_report
                type: io.kestra.plugin.core.log.Log
                message: |
                  DRY RUN would open or comment on "{{ fromJson(item.value).title }}" in {{ inputs.issue_repository }}:
                  {{ fromJson(item.value).summary }}. Latest patch of the cycle: {{ fromJson(item.value).latest }}.
                  {{ fromJson(item.value).locations }}
        else:
          - id: sync_issues
            type: io.kestra.plugin.core.flow.Loop
            values: "{{ outputs.check_end_of_life.vars.selected_json }}"
            concurrencyLimit: 1
            tasks:
              - id: find_open_issue
                type: io.kestra.plugin.github.issues.Search
                description: The title is stable per product and cycle, so an issue left open by an earlier run is found and updated instead of duplicated.
                oauthToken: "{{ secret('GITHUB_TOKEN') }}"
                repository: "{{ inputs.issue_repository }}"
                query: "in:title \"{{ fromJson(item.value).title }}\""
                open: true
                fetchType: FETCH_ONE

              - id: open_or_update
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.find_open_issue.size == 0 }}"
                then:
                  - id: open_issue
                    type: io.kestra.plugin.github.issues.Create
                    description: One issue per product cycle, listing every file that pins it.
                    oauthToken: "{{ secret('GITHUB_TOKEN') }}"
                    repository: "{{ inputs.issue_repository }}"
                    title: "{{ fromJson(item.value).title }}"
                    labels:
                      - dependencies
                      - end-of-life
                    body: |
                      {{ fromJson(item.value).summary }}. After that date the project ships no more security fixes for it.

                      Pinned in `{{ inputs.repository }}` on `{{ inputs.branch }}`:

                      {{ fromJson(item.value).locations }}

                      Latest patch of this cycle: `{{ fromJson(item.value).latest }}`. Support windows for every cycle: https://endoflife.date/{{ fromJson(item.value).product }}

                      Opened by the Kestra flow `{{ flow.id }}`, execution `{{ execution.id }}`. The same flow closes this issue once no file pins this version any more.
                else:
                  - id: comment_escalation
                    type: io.kestra.plugin.github.issues.Comment
                    description: The issue is already open, so the change of status (usually eol_soon to eol) goes in as a comment.
                    oauthToken: "{{ secret('GITHUB_TOKEN') }}"
                    repository: "{{ inputs.issue_repository }}"
                    issueNumber: "{{ outputs.find_open_issue.row.number }}"
                    body: |
                      Status is now **{{ fromJson(item.value).status }}**: {{ fromJson(item.value).summary }}.

                      {{ fromJson(item.value).locations }}

                      Kestra execution `{{ execution.id }}`.

  - id: close_cleared
    type: io.kestra.plugin.core.flow.If
    description: Close the issues of versions that no file pins any more, so the backlog shrinks after each upgrade.
    condition: "{{ outputs.check_end_of_life.vars.has_cleared }}"
    then:
      - id: cleared_mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.dry_run }}"
        then:
          - id: planned_closes
            type: io.kestra.plugin.core.log.Log
            message: "DRY RUN would close the open issue for each of these in {{ inputs.issue_repository }}: {{ outputs.check_end_of_life.vars.cleared_list }}"
        else:
          - id: close_issues
            type: io.kestra.plugin.core.flow.Loop
            values: "{{ outputs.check_end_of_life.vars.cleared_json }}"
            concurrencyLimit: 1
            tasks:
              - id: find_cleared_issue
                type: io.kestra.plugin.github.issues.Search
                oauthToken: "{{ secret('GITHUB_TOKEN') }}"
                repository: "{{ inputs.issue_repository }}"
                query: "in:title \"{{ fromJson(item.value).title }}\""
                open: true
                fetchType: FETCH_ONE

              - id: close_when_found
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.find_cleared_issue.size > 0 }}"
                then:
                  - id: comment_cleared
                    type: io.kestra.plugin.github.issues.Comment
                    description: Say why the issue closes before closing it.
                    oauthToken: "{{ secret('GITHUB_TOKEN') }}"
                    repository: "{{ inputs.issue_repository }}"
                    issueNumber: "{{ outputs.find_cleared_issue.row.number }}"
                    body: "No file in `{{ inputs.repository }}` on `{{ inputs.branch }}` pins this version any more. Closing from Kestra execution `{{ execution.id }}`."

                  - id: close_issue
                    type: io.kestra.plugin.core.http.Request
                    description: Closing goes over the GitHub REST API, because plugin-github has no task that changes an issue's state.
                    method: PATCH
                    uri: "https://api.github.com/repos/{{ inputs.issue_repository }}/issues/{{ outputs.find_cleared_issue.row.number }}"
                    contentType: application/json
                    headers:
                      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
                      Accept: application/vnd.github+json
                      X-GitHub-Api-Version: "2022-11-28"
                    body: '{"state": "closed", "state_reason": "completed"}'

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: Last on purpose. A failed run leaves the saved state alone, so nothing is marked as reported unless the issue step finished.
    key: "{{ render(vars.state_key) }}"
    kvType: STRING
    overwrite: true
    value: "{{ outputs.check_end_of_life.vars.state_json }}"

errors:
  - id: state_untouched
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Runtime end-of-life check failed for {{ inputs.repository }}@{{ inputs.branch }}. The saved state under {{ render(vars.state_key) }} was not changed, so the next run reports the same versions again."

outputs:
  - id: eol_count
    type: INT
    description: Runtime cycles already past end of life, e.g. 24.
    value: "{{ outputs.check_end_of_life.vars.eol_count }}"
  - id: eol_soon_count
    type: INT
    description: Runtime cycles reaching end of life inside the warning window, e.g. 1.
    value: "{{ outputs.check_end_of_life.vars.eol_soon_count }}"
  - id: actionable_count
    type: INT
    description: Cycles new to the risk list or escalated since the last run, e.g. 3.
    value: "{{ outputs.check_end_of_life.vars.actionable_count }}"
  - id: report
    type: FILE
    description: Markdown table of every pinned version with its cycle, status, end-of-life date and the files that pin it.
    value: "{{ outputs.check_end_of_life.outputFiles['eol-report.md'] }}"

extend:
  title: Track end-of-life runtimes in a repository as GitHub issues
  shortDescription: Find every pinned runtime, database and base OS version in a repository, check it against endoflife.date, and keep one GitHub issue open per version that is past or near end of life.
  metaTitle: Runtime end-of-life guard with endoflife.date, Git and GitHub issues
  metaDescription: Scan Dockerfiles, compose files, CI and version files for pinned runtimes, check them on endoflife.date, and track EOL versions as GitHub issues.
  description: |
    Old runtimes rarely break anything on the day support ends. `python:3.9` keeps building, `postgres:12` keeps starting, and `node:14` keeps serving traffic. They just stop getting security fixes, and nobody notices until a scanner or an auditor does. The versions are all written down in the repository already, in Dockerfiles, compose files, CI workflows and version files. This flow reads them, checks each one against [endoflife.date](https://endoflife.date), and keeps one GitHub issue open per version that is past or close to its end-of-life date.

    It only speaks up when something changes. A version is reported once when it enters the warning window and once more when it actually reaches end of life. When a commit moves every file off that version, the flow closes the issue itself.

    This blueprint was created by [Sarcastic-Soul](https://github.com/Sarcastic-Soul).

    ## How it works

    1. `read_state` (`io.kestra.plugin.core.kv.Get`) loads the versions this flow already reported for the repository, with the status each one had. The first run starts from nothing.
    2. `scan_repository` (`io.kestra.plugin.core.flow.WorkingDirectory`) keeps the next two tasks in one directory.
    3. `clone_repository` (`io.kestra.plugin.git.Clone`) does a shallow checkout of `branch`.
    4. `find_pinned_versions` (`io.kestra.plugin.scripts.python.Script`) walks the checkout and reads:
       - `FROM` lines in Dockerfiles, skipping build stage names and `scratch`
       - `image:` lines in any YAML file, which covers compose files, Kubernetes manifests and Helm values
       - `python-version`, `node-version` and `go-version` in CI workflows
       - `.python-version`, `.nvmrc`, `.node-version`, `.tool-versions` and the `go` line in `go.mod`
       - Debian and Ubuntu codenames inside a tag, so `eclipse-temurin:17-jre-focal` is also reported as Ubuntu 20.04
       Tags such as `latest`, `lts` or no tag at all are listed as floating, because there is no version to check.
    5. `check_end_of_life` (`io.kestra.plugin.scripts.python.Script`) calls the endoflife.date API once per product, matches each version to its release cycle (`3.9.2` to Python `3.9`, `mysql:8` to the newest `8.x`), and marks the cycle `eol`, `eol_soon` (inside `warn_days`) or `supported`. It compares the result with the saved state and picks the cycles that are new to the risk list or went from `eol_soon` to `eol`, worst first, up to `max_issues`. It reads `inventory.json` from the scan task's output files and writes `eol-report.md`, a table of every version it found.
    6. `log_summary` (`io.kestra.plugin.core.log.Log`) prints the full counts next to what this run handles.
    7. `report_at_risk` (`io.kestra.plugin.core.flow.If`) loops over the picked cycles with `io.kestra.plugin.core.flow.Loop`. In a dry run it logs the issue it would open. Otherwise it searches for an open issue with the same title (`io.kestra.plugin.github.issues.Search`), then opens one (`io.kestra.plugin.github.issues.Create`) or adds a comment about the new status (`io.kestra.plugin.github.issues.Comment`).
    8. `close_cleared` (`io.kestra.plugin.core.flow.If`) handles versions that no file pins any more. It comments on the open issue and closes it with a `PATCH` through `io.kestra.plugin.core.http.Request`, because `plugin-github` has no task that changes an issue's state.
    9. `save_state` (`io.kestra.plugin.core.kv.Set`) saves the new state last, so a failed run changes nothing and the next run reports the same versions again.

    Two triggers start it: a weekly `Schedule` (shipped disabled) and a `Webhook` you can call from a GitHub push webhook or a CI step, so a change to a Dockerfile is checked as soon as it lands. `concurrency.limit: 1` queues a webhook run that arrives during the weekly run, so two runs never write the saved state at the same time.

    ## What you get

    - One GitHub issue per runtime cycle that is past or near end of life, titled `End of life: <product> <cycle>`, listing every file and line that pins it.
    - A comment on that issue when its status gets worse, and an automatic close when the version is gone from the repository.
    - `eol-report.md`, a Markdown table of every pinned version with its cycle, status, end-of-life date, days left and latest patch, plus the floating tags and the versions endoflife.date does not track.
    - Flow outputs `eol_count`, `eol_soon_count`, `actionable_count` and `report` for dashboards or a parent flow.

    ## Who it's for

    - Platform and DevOps teams who own many Dockerfiles and compose files across services.
    - Maintainers who want "Node 18 is out of support" to show up in their issue tracker, not in an incident review.
    - Security and compliance teams who need proof that unsupported software is tracked.

    ## Why orchestrate this with Kestra

    The check is a small script. Kestra adds what turns it into a process: a schedule and a push webhook, the KV store as memory between runs so people are not told the same thing every week, a dry-run switch, a cap per run, a queue so overlapping runs do not race, and an execution history with the report attached to every run.

    ## Prerequisites

    - A worker that can run Docker containers. Both script tasks use the public `python:3.12-slim` image and only the Python standard library.
    - Outbound HTTPS to `github.com` and `endoflife.date`. The endoflife.date API needs no key.
    - For live issues, a GitHub token with **Issues: read and write** on `issue_repository` (classic token scope `repo`, or `public_repo` for a public repository).

    ### Secrets

    - `GITHUB_TOKEN`: searches, opens, comments on and closes issues. Only read when `dry_run` is `false`.
    - `EOL_GUARD_WEBHOOK_KEY`: the key part of the webhook URL. Only needed if you use the `on_push` trigger.

    ### Inputs

    - `repository` (STRING, default `docker/awesome-compose`): repository to scan, as `owner/repo`.
    - `branch` (STRING, default `master`): branch to check out.
    - `warn_days` (INT, default `180`): days before an end-of-life date when a version counts as `eol_soon`.
    - `issue_repository` (STRING, default `your-org/your-repo`): repository that receives the issues.
    - `max_issues` (INT, default `10`): most new or escalated cycles handled in one run. The rest wait for the next run.
    - `dry_run` (BOOL, default `true`): log instead of calling GitHub.

    ## Quick start

    1. Save the flow and execute it with the defaults. It scans `docker/awesome-compose` in dry-run mode and logs about ten issues it would open, such as `End of life: python 3.9` and `End of life: ubuntu 20.04`.
    2. Open the **Outputs** tab and preview `report` (or `outputs.check_end_of_life.outputFiles['eol-report.md']`) to see every version it found.
    3. Execute it again. The first ten are now in the saved state, so this run reports the next batch, and a third run reports nothing new.
    4. Delete the `runtime_eol_docker_awesome_compose_dry_run` key in the namespace KV store to start over. Dry runs keep their own state key, so the first live run still opens every issue.
    5. Point `repository`, `branch` and `issue_repository` at your own code, add the `GITHUB_TOKEN` secret, set `dry_run` to `false`, and enable the `weekly` trigger.
    6. Optional: add `EOL_GUARD_WEBHOOK_KEY` and register `https://<your-kestra-host>/api/v1/main/executions/webhook/company.team/runtime-end-of-life-guard/<key>` as a push webhook in GitHub.

    ## How to extend

    - Add images to `IMAGE_PRODUCTS` in `find_pinned_versions` for products your stack uses (endoflife.date tracks over 400). The key is the image name, the value is the product name in the endoflife.date URL.
    - Scan private repositories by adding `username` and `password: "{{ secret('GITHUB_TOKEN') }}"` to `clone_repository`.
    - Run it over many repositories with a parent flow that calls this one through `io.kestra.plugin.core.flow.Subflow` inside a `Loop`.
    - Send `eol-report.md` to Slack or email each week, or open Jira tickets instead of GitHub issues.
    - Turn floating tags into findings of their own if your policy says every image must be pinned.
    - Note that a Ubuntu LTS shows as `eol` when standard support ends, even if you pay for extended security updates.

    ## Links

    - endoflife.date API: https://endoflife.date/docs/api/v1/
    - Git plugin: https://kestra.io/plugins/plugin-git
    - GitHub plugin: https://kestra.io/plugins/plugin-github
    - Python script tasks: https://kestra.io/plugins/plugin-script-python
    - Kestra KV store: https://kestra.io/docs/concepts/kv-store
    - Webhook trigger: https://kestra.io/docs/workflow-components/triggers/webhook-trigger
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Policy & Compliance
  ee: false
  demo: false
