id: aws-orphaned-security-group-and-eni-cleanup-gate
namespace: company.platform
description: |
  Audit AWS VPCs for orphaned security groups and unattached Elastic Network Interfaces
  (ENIs). Resolve inter-security-group rule dependencies, verify network attachments,
  exempt default and protected groups, calculate infrastructure risk, generate JSON and
  Markdown audit reports, and safely gate deletions behind two-stage human approval.

inputs:
  - id: region
    type: STRING
    defaults: "us-east-1"
    displayName: "AWS Region"
    description: "Target AWS region to audit and reclaim orphaned network resources in."

  - id: endpoint_url
    type: STRING
    required: false
    displayName: "AWS Endpoint URL (Optional)"
    description: "Custom endpoint URL for local emulators such as LocalStack or Moto (e.g. `http://localhost:4566`). Leave blank for real AWS."

  - id: aws_inventory_file
    type: FILE
    required: false
    displayName: "Offline AWS Inventory File"
    description: "Optional pre-generated AWS network inventory JSON file. When provided, evaluates retention against this dataset directly without requiring live AWS credentials or network access."

  - id: min_age_days
    type: INT
    defaults: 14
    displayName: "Minimum Age in Days"
    description: "Safety grace period: resources younger than this threshold are never deleted (protects in-flight Terraform/CloudFormation stacks)."

  - id: keep_tag_key
    type: STRING
    defaults: "keep"
    displayName: "Keep Tag Key"
    description: "Tag key used to permanently exempt security groups or network interfaces from automated deletion (also checks `DoNotDelete` and `Production`)."

  - id: protected_sg_patterns
    type: STRING
    defaults: "^(default|.*-default|k8s-.*|eks-.*|launch-wizard-.*)$"
    displayName: "Protected Security Group Regex"
    description: "Regular expression pattern matching security group names that are permanently protected from deletion (including AWS default security groups)."

  - id: max_deletions_per_run
    type: INT
    defaults: 20
    displayName: "Maximum Deletions Per Run"
    description: "Blast-radius safeguard: maximum number of orphaned resources (SGs + ENIs) that can be deleted in a single execution."

  - id: dry_run
    type: BOOL
    defaults: true
    displayName: "Dry Run Mode"
    description: "When true (default), audits the region and generates the deletion plan without performing deletions."

  - id: enable_deletion
    type: BOOL
    defaults: false
    displayName: "Enable Deletion Gate"
    description: "Safety opt-in switch: must be explicitly set to true alongside dry_run=false to proceed to the approval gate and deletion step."

  - id: notify_slack
    type: BOOL
    defaults: false
    displayName: "Notify Slack"
    description: "Whether to dispatch Slack notifications with orphaned resource counts and execution outcomes."

  - id: slack_webhook_url
    type: STRING
    required: false
    displayName: "Slack Webhook URL"
    description: "Slack incoming webhook URL for notifications. If omitted, falls back to the SLACK_WEBHOOK_URL secret."

tasks:
  - id: scan_or_load_inventory
    type: io.kestra.plugin.scripts.python.Script
    description: Discover security groups and network interfaces from AWS EC2 API or load provided offline inventory.
    containerImage: python:3.12-slim
    beforeCommands:
      - pip install --quiet --disable-pip-version-check boto3==1.35.40
    inputFiles:
      uploaded_inventory.json: "{{ inputs.aws_inventory_file ?? '' }}"
    outputFiles:
      - raw_aws_network_inventory.json
    env:
      AWS_REGION: "{{ inputs.region }}"
      AWS_ENDPOINT_URL: "{{ inputs.endpoint_url ?? '' }}"
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') ?? '' }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_SESSION_TOKEN: "{{ secret('AWS_SESSION_TOKEN') ?? '' }}"
    script: |
      import json
      import os
      import sys

      def main():
          uploaded_file = "uploaded_inventory.json"
          if os.path.exists(uploaded_file) and os.path.getsize(uploaded_file) > 0:
              print(f"Loading provided offline AWS inventory from '{uploaded_file}'...")
              try:
                  with open(uploaded_file, "r", encoding="utf-8") as src, open("raw_aws_network_inventory.json", "w", encoding="utf-8") as dst:
                      dst.write(src.read())
                  print("Offline inventory successfully staged.")
                  return
              except Exception as exc:
                  print(f"[ERROR] Failed to read uploaded inventory file: {exc}", file=sys.stderr)
                  sys.exit(1)

          import boto3
          region = os.environ.get("AWS_REGION", "us-east-1")
          endpoint_url = os.environ.get("AWS_ENDPOINT_URL", "").strip() or None

          session_kwargs = {"region_name": region}
          ak = os.environ.get("AWS_ACCESS_KEY_ID", "").strip()
          sk = os.environ.get("AWS_SECRET_ACCESS_KEY", "").strip()
          st = os.environ.get("AWS_SESSION_TOKEN", "").strip()
          if ak and sk:
              session_kwargs["aws_access_key_id"] = ak
              session_kwargs["aws_secret_access_key"] = sk
              if st:
                  session_kwargs["aws_session_token"] = st

          session = boto3.Session(**session_kwargs)
          ec2 = session.client("ec2", endpoint_url=endpoint_url)

          print(f"Scanning EC2 security groups and network interfaces in region: {region}...")
          try:
              sg_paginator = ec2.get_paginator("describe_security_groups")
              sgs = []
              for page in sg_paginator.paginate():
                  sgs.extend(page.get("SecurityGroups", []))

              eni_paginator = ec2.get_paginator("describe_network_interfaces")
              enis = []
              for page in eni_paginator.paginate():
                  enis.extend(page.get("NetworkInterfaces", []))

              # Convert datetime objects to ISO strings for serialization
              def default_serializer(obj):
                  if hasattr(obj, "isoformat"):
                      return obj.isoformat()
                  raise TypeError(f"Type {type(obj)} not serializable")

              inventory = {
                  "security_groups": sgs,
                  "network_interfaces": enis
              }

              with open("raw_aws_network_inventory.json", "w", encoding="utf-8") as f:
                  json.dump(inventory, f, default=default_serializer, indent=2)

              print(f"Discovered {len(sgs)} security groups and {len(enis)} network interfaces.")
          except Exception as exc:
              print(f"[ERROR] AWS EC2 API scan failed: {exc}", file=sys.stderr)
              sys.exit(1)

      if __name__ == "__main__":
          main()

  - id: analyze_orphaned_network_resources
    type: io.kestra.plugin.scripts.python.Script
    description: Evaluate dependencies and identify truly orphaned security groups and unattached ENIs.
    containerImage: python:3.12-slim
    inputFiles:
      raw_aws_network_inventory.json: "{{ outputs.scan_or_load_inventory.outputFiles['raw_aws_network_inventory.json'] }}"
    outputFiles:
      - orphan_network_resources_plan.json
      - orphan_network_resources_audit.md
    env:
      MIN_AGE_DAYS: "{{ inputs.min_age_days }}"
      KEEP_TAG_KEY: "{{ inputs.keep_tag_key }}"
      PROTECTED_SG_PATTERNS: "{{ inputs.protected_sg_patterns }}"
      MAX_DELETIONS_PER_RUN: "{{ inputs.max_deletions_per_run }}"
    script: |
      import json
      import os
      import re
      import sys
      from datetime import datetime, timezone

      def parse_iso_time(ts_str):
          if not ts_str:
              return None
          try:
              cleaned = str(ts_str).replace("Z", "+00:00")
              return datetime.fromisoformat(cleaned)
          except Exception:
              return None

      def main():
          inventory_file = "raw_aws_network_inventory.json"
          if not os.path.exists(inventory_file):
              print(f"[ERROR] Inventory file '{inventory_file}' not found.", file=sys.stderr)
              sys.exit(1)

          if os.path.getsize(inventory_file) == 0:
              print(f"[ERROR] Inventory file '{inventory_file}' is empty (0 bytes).", file=sys.stderr)
              sys.exit(1)

          min_age_str = os.environ.get("MIN_AGE_DAYS", "14")
          keep_key = os.environ.get("KEEP_TAG_KEY", "keep").strip().lower()
          protected_regex_str = os.environ.get("PROTECTED_SG_PATTERNS", "^(default|.*-default|k8s-.*|eks-.*|launch-wizard-.*)$")
          max_del_str = os.environ.get("MAX_DELETIONS_PER_RUN", "20")

          try:
              min_age = int(min_age_str)
              max_del = int(max_del_str)
          except (ValueError, TypeError) as exc:
              print(f"[ERROR] Invalid numeric parameters: {exc}", file=sys.stderr)
              sys.exit(1)

          if min_age < 0:
              print("[ERROR] min_age_days must be non-negative.", file=sys.stderr)
              sys.exit(1)
          if max_del <= 0:
              print("[ERROR] max_deletions_per_run must be greater than zero.", file=sys.stderr)
              sys.exit(1)

          try:
              protected_regex = re.compile(protected_regex_str)
          except re.error as exc:
              print(f"[ERROR] Invalid protected_sg_patterns regex: {exc}", file=sys.stderr)
              sys.exit(1)

          try:
              with open(inventory_file, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"[ERROR] Failed to parse inventory JSON: {exc}", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data, dict):
              print(f"[ERROR] Root inventory must be an object/dict, got {type(data).__name__}.", file=sys.stderr)
              sys.exit(1)

          security_groups = data.get("security_groups", [])
          network_interfaces = data.get("network_interfaces", [])

          if not isinstance(security_groups, list) or not isinstance(network_interfaces, list):
              print("[ERROR] 'security_groups' and 'network_interfaces' must be lists.", file=sys.stderr)
              sys.exit(1)

          now = datetime.now(timezone.utc)

          # Step 1: Map all SGs attached to any network interface
          attached_sg_ids = set()
          for eni in network_interfaces:
              if not isinstance(eni, dict):
                  continue
              groups = eni.get("groups") or eni.get("Groups") or []
              for g in groups:
                  if isinstance(g, dict) and "GroupId" in g:
                      attached_sg_ids.add(g["GroupId"])
                  elif isinstance(g, str):
                      attached_sg_ids.add(g)

          # Step 2: Map all SGs referenced in rules of any SG
          referenced_sg_ids = set()
          for sg in security_groups:
              if not isinstance(sg, dict):
                  continue
              rules = (sg.get("ip_permissions") or sg.get("IpPermissions") or []) + \
                      (sg.get("ip_permissions_egress") or sg.get("IpPermissionsEgress") or [])
              for r in rules:
                  if not isinstance(r, dict):
                      continue
                  pairs = r.get("user_id_group_pairs") or r.get("UserIdGroupPairs") or []
                  for p in pairs:
                      if isinstance(p, dict) and "GroupId" in p:
                          referenced_sg_ids.add(p["GroupId"])

          orphaned_sgs = []
          retained_sgs = []

          for sg in security_groups:
              if not isinstance(sg, dict):
                  continue
              sg_id = str(sg.get("group_id") or sg.get("GroupId") or "unknown")
              sg_name = str(sg.get("group_name") or sg.get("GroupName") or "unknown")
              vpc_id = str(sg.get("vpc_id") or sg.get("VpcId") or "unknown")
              desc = str(sg.get("description") or sg.get("Description") or "")

              tags = sg.get("tags") or sg.get("Tags") or []
              tag_dict = {}
              if isinstance(tags, list):
                  for t in tags:
                      if isinstance(t, dict) and "Key" in t and "Value" in t:
                          tag_dict[t["Key"].lower()] = t["Value"]
              elif isinstance(tags, dict):
                  tag_dict = {k.lower(): v for k, v in tags.items()}

              created_at_str = sg.get("created_at") or sg.get("CreatedAt") or ""
              created_at = parse_iso_time(created_at_str)
              age_days = (now - created_at).days if created_at else 999

              sg_record = {
                  "resource_type": "SecurityGroup",
                  "id": sg_id,
                  "name": sg_name,
                  "vpc_id": vpc_id,
                  "description": desc,
                  "age_days": age_days,
                  "tags": tag_dict
              }

              if sg_name.lower() == "default":
                  sg_record["decision"] = "RETAIN"
                  sg_record["reason"] = "AWS default VPC security group is permanently protected."
                  retained_sgs.append(sg_record)
                  continue

              if protected_regex.search(sg_name):
                  sg_record["decision"] = "RETAIN"
                  sg_record["reason"] = f"Security group name matches protected pattern."
                  retained_sgs.append(sg_record)
                  continue

              if keep_key in tag_dict or "donotdelete" in tag_dict or "production" in tag_dict:
                  sg_record["decision"] = "RETAIN"
                  sg_record["reason"] = f"Protected by retention tag."
                  retained_sgs.append(sg_record)
                  continue

              if sg_id in attached_sg_ids:
                  sg_record["decision"] = "RETAIN"
                  sg_record["reason"] = "Attached to one or more network interfaces (in-use)."
                  retained_sgs.append(sg_record)
                  continue

              if sg_id in referenced_sg_ids:
                  sg_record["decision"] = "RETAIN"
                  sg_record["reason"] = "Referenced in ingress/egress rules of another security group."
                  retained_sgs.append(sg_record)
                  continue

              if age_days < min_age:
                  sg_record["decision"] = "RETAIN"
                  sg_record["reason"] = f"Security group age ({age_days}d) is within grace window (< {min_age}d)."
                  retained_sgs.append(sg_record)
                  continue

              sg_record["decision"] = "CANDIDATE_FOR_DELETION"
              sg_record["reason"] = f"Orphaned: 0 attached ENIs, 0 rule references, age ({age_days}d) >= {min_age}d."
              orphaned_sgs.append(sg_record)

          unattached_enis = []
          retained_enis = []

          for eni in network_interfaces:
              if not isinstance(eni, dict):
                  continue
              eni_id = str(eni.get("network_interface_id") or eni.get("NetworkInterfaceId") or "unknown")
              status = str(eni.get("status") or eni.get("Status") or "").lower()
              vpc_id = str(eni.get("vpc_id") or eni.get("VpcId") or "unknown")
              desc = str(eni.get("description") or eni.get("Description") or "")
              attachment = eni.get("attachment") or eni.get("Attachment")

              tags = eni.get("tag_set") or eni.get("TagSet") or eni.get("tags") or eni.get("Tags") or []
              tag_dict = {}
              if isinstance(tags, list):
                  for t in tags:
                      if isinstance(t, dict) and "Key" in t and "Value" in t:
                          tag_dict[t["Key"].lower()] = t["Value"]
              elif isinstance(tags, dict):
                  tag_dict = {k.lower(): v for k, v in tags.items()}

              created_at_str = eni.get("created_at") or eni.get("CreatedAt") or ""
              created_at = parse_iso_time(created_at_str)
              age_days = (now - created_at).days if created_at else 999

              eni_record = {
                  "resource_type": "NetworkInterface",
                  "id": eni_id,
                  "status": status,
                  "vpc_id": vpc_id,
                  "description": desc,
                  "age_days": age_days,
                  "tags": tag_dict
              }

              if status != "available" or attachment is not None:
                  eni_record["decision"] = "RETAIN"
                  eni_record["reason"] = f"Network interface is attached/in-use (status: {status})."
                  retained_enis.append(eni_record)
                  continue

              if keep_key in tag_dict or "donotdelete" in tag_dict:
                  eni_record["decision"] = "RETAIN"
                  eni_record["reason"] = f"Protected by retention tag."
                  retained_enis.append(eni_record)
                  continue

              if age_days < min_age:
                  eni_record["decision"] = "RETAIN"
                  eni_record["reason"] = f"Unattached ENI age ({age_days}d) is within grace window (< {min_age}d)."
                  retained_enis.append(eni_record)
                  continue

              eni_record["decision"] = "CANDIDATE_FOR_DELETION"
              eni_record["reason"] = f"Unattached ENI (status: available, no attachment) older than {min_age}d ({age_days}d)."
              unattached_enis.append(eni_record)

          # Plan order: Unattached ENIs first, then orphaned SGs (avoids dependency lock)
          all_candidates = unattached_enis + orphaned_sgs
          planned_deletions = all_candidates[:max_del]
          deferred_deletions = all_candidates[max_del:]

          total_planned = len(planned_deletions)

          if total_planned > 0:
              verdict = "ACTION_PLANNED"
              action_required = "APPROVAL_REQUIRED"
              summary = f"Identified {len(all_candidates)} orphaned network resources ({len(orphaned_sgs)} SGs, {len(unattached_enis)} ENIs). Planned {total_planned} deletions (capped by max_deletions_per_run={max_del})."
          else:
              verdict = "CLEAR"
              action_required = "NONE"
              summary = f"All {len(security_groups)} security groups and {len(network_interfaces)} network interfaces satisfy retention and dependency policies. No orphaned resources found."

          report_payload = {
              "timestamp": now.isoformat(),
              "verdict": verdict,
              "action_required": action_required,
              "statistics": {
                  "total_security_groups": len(security_groups),
                  "total_network_interfaces": len(network_interfaces),
                  "orphaned_sgs_found": len(orphaned_sgs),
                  "unattached_enis_found": len(unattached_enis),
                  "total_candidates_found": len(all_candidates),
                  "planned_deletions_count": total_planned,
                  "deferred_deletions_count": len(deferred_deletions)
              },
              "thresholds": {
                  "min_age_days": min_age,
                  "keep_tag_key": keep_key,
                  "protected_sg_patterns": protected_regex_str,
                  "max_deletions_per_run": max_del
              },
              "planned_deletions": planned_deletions,
              "deferred_deletions": deferred_deletions,
              "summary": summary
          }

          with open("orphan_network_resources_plan.json", "w", encoding="utf-8") as f:
              json.dump(report_payload, f, indent=2)

          md_lines = [
              "# AWS Orphaned Security Groups & Unattached ENIs Audit Report",
              "",
              f"**Audit Timestamp:** `{report_payload['timestamp']}`  ",
              f"**Verdict:** `{verdict}`  ",
              f"**Action Required:** `{action_required}`  ",
              "",
              "## Network Hygiene Summary",
              "",
              "| Metric | Count |",
              "|:---|:---|",
              f"| **Total Security Groups Scanned** | {len(security_groups)} |",
              f"| **Total Network Interfaces Scanned** | {len(network_interfaces)} |",
              f"| **Orphaned Security Groups (0 ENIs, 0 Rules)** | **{len(orphaned_sgs)}** |",
              f"| **Unattached Network Interfaces (Status: Available)** | **{len(unattached_enis)}** |",
              f"| **Planned Deletions (Capped)** | **{total_planned}** |",
              f"| **Deferred Deletions (Next Run)** | {len(deferred_deletions)} |",
              "",
              "## Policy Thresholds Applied",
              "",
              f"- **Minimum Age Grace Period:** `{min_age}` days",
              f"- **Keep Tag Key:** `{keep_key}`",
              f"- **Protected SG Patterns:** `{protected_regex_str}`",
              f"- **Max Deletions Per Run (Blast-Radius Limit):** `{max_del}` resources",
              ""
          ]

          if planned_deletions:
              md_lines.append("## Planned Resource Deletions (Dry-Run Preview)")
              md_lines.append("")
              md_lines.append("| Type | Resource ID | Name / Description | VPC ID | Age | Rationale |")
              md_lines.append("|:---|:---|:---|:---|:---|:---|")
              for item in planned_deletions:
                  label = item.get("name") or item.get("description") or "-"
                  md_lines.append(f"| `{item['resource_type']}` | `{item['id']}` | {label} | `{item['vpc_id']}` | {item['age_days']}d | {item['reason']} |")
              md_lines.append("")

          if deferred_deletions:
              md_lines.append(f"## Deferred Deletions ({len(deferred_deletions)} items capped by blast-radius limit)")
              md_lines.append("")
              md_lines.append(f"> Deletion ceiling `max_deletions_per_run={max_del}` capped this batch. Remaining resources will be evaluated in the next scheduled execution.")
              md_lines.append("")

          md_lines.append("## Operational Safety & Audit Notes")
          md_lines.append("")
          if planned_deletions:
              md_lines.append("- Review the candidate list above before confirming the approval gate.")
              md_lines.append("- Unattached ENIs are deleted before security groups to prevent dependency locks.")
              md_lines.append("- Tag any resource with `keep=true` or `DoNotDelete=true` to permanently exempt it.")
          else:
              md_lines.append("- All VPC security groups and network interfaces satisfy hygiene policies.")
              md_lines.append("- Continue regular automated audits to prevent infrastructure debt and quota exhaustion.")
          md_lines.append("")

          with open("orphan_network_resources_audit.md", "w", encoding="utf-8") as f:
              f.write("\n".join(md_lines) + "\n")

          kestra_outputs = {
              "verdict": verdict,
              "action_required": action_required,
              "total_security_groups": len(security_groups),
              "total_network_interfaces": len(network_interfaces),
              "orphaned_sgs_count": len(orphaned_sgs),
              "unattached_enis_count": len(unattached_enis),
              "planned_deletions_count": total_planned,
              "deferred_deletions_count": len(deferred_deletions),
              "summary": summary
          }
          print("::" + json.dumps({"outputs": kestra_outputs}) + "::")

      if __name__ == "__main__":
          main()

  - id: check_slack_plan_notification
    type: io.kestra.plugin.core.flow.If
    description: Dispatch Slack alert when orphaned network resources are identified.
    condition: "{{ inputs.notify_slack and outputs.analyze_orphaned_network_resources.vars.planned_deletions_count > 0 }}"
    then:
      - id: send_slack_plan_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post structured network orphan audit summary to Slack.
        url: "{{ inputs.slack_webhook_url ?? secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: *AWS Orphaned Network Resources Alert - {{ inputs.region }}*\n• *Verdict:* `{{ outputs.analyze_orphaned_network_resources.vars.verdict }}`\n• *Orphaned Security Groups:* `{{ outputs.analyze_orphaned_network_resources.vars.orphaned_sgs_count }}`\n• *Unattached ENIs:* `{{ outputs.analyze_orphaned_network_resources.vars.unattached_enis_count }}`\n• *Planned Deletions:* `{{ outputs.analyze_orphaned_network_resources.vars.planned_deletions_count }}`\n• *Mode:* `{{ inputs.dry_run ? 'DRY-RUN (Advisory)' : 'APPROVAL-GATED EXECUTION' }}`\n• *Summary:* {{ outputs.analyze_orphaned_network_resources.vars.summary }}\n• *Execution ID:* `{{ execution.id }}`"
          }

  - id: reclamation_execution_gate
    type: io.kestra.plugin.core.flow.If
    description: Execute deletions only when dry_run=false, enable_deletion=true, and candidates are planned.
    condition: "{{ not inputs.dry_run and inputs.enable_deletion and outputs.analyze_orphaned_network_resources.vars.planned_deletions_count > 0 }}"
    then:
      - id: pause_for_human_approval
        type: io.kestra.plugin.core.flow.Pause
        description: Requires explicit human operator approval before deleting orphaned security groups and ENIs.
        timeout: PT24H
        onResume:
          - id: approved
            type: BOOLEAN
            displayName: "Approve Deletion Execution"
            description: "Set to true to confirm deletion of planned orphaned network resources."
          - id: approval_reason
            type: STRING
            displayName: "Approval Reason / Ticket"
            description: "Change ticket ID or approval rationale for compliance audit logging."

      - id: execute_approved_deletions
        type: io.kestra.plugin.scripts.python.Script
        description: Execute deletion of approved unattached ENIs and orphaned security groups via AWS API.
        containerImage: python:3.12-slim
        beforeCommands:
          - pip install --quiet --disable-pip-version-check boto3==1.35.40
        inputFiles:
          orphan_network_resources_plan.json: "{{ outputs.analyze_orphaned_network_resources.outputFiles['orphan_network_resources_plan.json'] }}"
        outputFiles:
          - deletion_execution_outcomes.json
        env:
          IS_APPROVED: "{{ outputs.pause_for_human_approval.onResume.approved }}"
          AWS_REGION: "{{ inputs.region }}"
          AWS_ENDPOINT_URL: "{{ inputs.endpoint_url ?? '' }}"
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') ?? '' }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_SESSION_TOKEN: "{{ secret('AWS_SESSION_TOKEN') ?? '' }}"
        script: |
          import json
          import os
          import sys

          def main():
              is_approved = os.environ.get("IS_APPROVED", "false").lower() == "true"
              if not is_approved:
                  print("Deletion execution rejected or unapproved by operator. No resources deleted.")
                  result = {
                      "execution_status": "REJECTED_BY_OPERATOR",
                      "executed_deletions_count": 0,
                      "deletion_errors_count": 0,
                      "results": []
                  }
                  with open("deletion_execution_outcomes.json", "w", encoding="utf-8") as f:
                      json.dump(result, f, indent=2)
                  print("::" + json.dumps({"outputs": result}) + "::")
                  return

              plan_file = "orphan_network_resources_plan.json"
              with open(plan_file, "r", encoding="utf-8") as f:
                  plan_data = json.load(f)

              planned_items = plan_data.get("planned_deletions", [])
              region = os.environ.get("AWS_REGION", "us-east-1")
              endpoint_url = os.environ.get("AWS_ENDPOINT_URL", "").strip() or None

              import boto3
              session_kwargs = {"region_name": region}
              ak = os.environ.get("AWS_ACCESS_KEY_ID", "").strip()
              sk = os.environ.get("AWS_SECRET_ACCESS_KEY", "").strip()
              st = os.environ.get("AWS_SESSION_TOKEN", "").strip()
              if ak and sk:
                  session_kwargs["aws_access_key_id"] = ak
                  session_kwargs["aws_secret_access_key"] = sk
                  if st:
                      session_kwargs["aws_session_token"] = st

              session = boto3.Session(**session_kwargs)
              ec2 = session.client("ec2", endpoint_url=endpoint_url)

              success_count = 0
              error_count = 0
              outcomes = []

              for item in planned_items:
                  res_type = item.get("resource_type")
                  res_id = item.get("id")
                  print(f"Deleting {res_type}: {res_id}...")

                  try:
                      if res_type == "NetworkInterface":
                          ec2.delete_network_interface(NetworkInterfaceId=res_id)
                      elif res_type == "SecurityGroup":
                          ec2.delete_security_group(GroupId=res_id)
                      success_count += 1
                      outcomes.append({
                          "resource_type": res_type,
                          "id": res_id,
                          "status": "DELETED"
                      })
                  except Exception as exc:
                      error_count += 1
                      outcomes.append({
                          "resource_type": res_type,
                          "id": res_id,
                          "status": "ERROR",
                          "error": str(exc)
                      })

              execution_summary = {
                  "execution_status": "COMPLETED_WITH_ERRORS" if error_count > 0 else "SUCCESS",
                  "executed_deletions_count": success_count,
                  "deletion_errors_count": error_count,
                  "results": outcomes
              }

              with open("deletion_execution_outcomes.json", "w", encoding="utf-8") as f:
                  json.dump(execution_summary, f, indent=2)

              print("::" + json.dumps({"outputs": execution_summary}) + "::")

          if __name__ == "__main__":
              main()

      - id: check_slack_execution_result
        type: io.kestra.plugin.core.flow.If
        description: Post execution completion summary to Slack.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: send_slack_execution_alert
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Notify Slack of network resource cleanup outcomes.
            url: "{{ inputs.slack_webhook_url ?? secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":white_check_mark: *AWS Network Resource Cleanup Executed - {{ inputs.region }}*\n• *Status:* `{{ outputs.execute_approved_deletions.vars.execution_status }}`\n• *Deleted Resources:* `{{ outputs.execute_approved_deletions.vars.executed_deletions_count }}`\n• *Failed Deletions:* `{{ outputs.execute_approved_deletions.vars.deletion_errors_count }}`\n• *Approver:* `{{ outputs.pause_for_human_approval.onResume.approval_reason ?? 'Operator' }}`\n• *Execution ID:* `{{ execution.id }}`"
              }
    else:
      - id: log_dry_run_outcome
        type: io.kestra.plugin.core.log.Log
        description: Log audit completion status when running in dry-run mode or when no deletions are planned.
        message: >-
          AWS orphaned network resources audit finished in advisory/dry-run mode for '{{ inputs.region }}'.
          Planned candidate deletions: {{ outputs.analyze_orphaned_network_resources.vars.planned_deletions_count }}.
          Summary: {{ outputs.analyze_orphaned_network_resources.vars.summary }}

outputs:
  - id: verdict
    type: STRING
    description: Audit verdict (CLEAR, ACTION_PLANNED).
    value: "{{ outputs.analyze_orphaned_network_resources.vars.verdict }}"

  - id: planned_deletions_count
    type: INT
    description: Count of orphaned network resources planned for deletion.
    value: "{{ outputs.analyze_orphaned_network_resources.vars.planned_deletions_count }}"

  - id: orphaned_sgs_count
    type: INT
    description: Count of orphaned security groups detected.
    value: "{{ outputs.analyze_orphaned_network_resources.vars.orphaned_sgs_count }}"

  - id: unattached_enis_count
    type: INT
    description: Count of unattached network interfaces detected.
    value: "{{ outputs.analyze_orphaned_network_resources.vars.unattached_enis_count }}"

  - id: plan_json
    type: FILE
    description: Detailed JSON deletion plan and dependency metrics.
    value: "{{ outputs.analyze_orphaned_network_resources.outputFiles['orphan_network_resources_plan.json'] }}"

  - id: audit_md
    type: FILE
    description: Human-readable Markdown summary audit report.
    value: "{{ outputs.analyze_orphaned_network_resources.outputFiles['orphan_network_resources_audit.md'] }}"

extend:
  title: "AWS Orphaned Security Group and Unattached ENI Cleanup Safety Gate"
  shortDescription: Audit AWS VPC security groups and network interfaces, detect orphaned firewall rules and unattached ENIs, and safely gate deletions behind human approval.
  metaTitle: AWS Orphaned Security Group & ENI Cleanup Gate | Kestra
  metaDescription: "Audit AWS VPC security groups and unattached network interfaces, detect orphaned rules, and safely gate deletions behind human approval."
  description: |
    Cloud infrastructure environments accumulate abandoned AWS security groups and unattached
    Elastic Network Interfaces (ENIs) after ephemeral stacks, test environments, and old Terraform
    deployments are destroyed. Unused security groups clutter firewall configurations, increase audit
    complexity under CIS AWS Benchmark 4.16, and can exhaust AWS VPC security group quotas (default 2,500).
    Similarly, unattached ENIs (`status: available`) left behind by detached load balancers or terminated
    Lambda VPC functions needlessly consume private IP addresses and incur carrier IP charges.

    Blindly deleting security groups with ad-hoc scripts frequently causes outages:
    - If another security group references an SG in an ingress/egress rule, deletion fails with `DependencyViolation`.
    - If any network interface remains attached, deletion fails with `ResourceInUse`.
    - Deleting the default VPC security group is strictly prohibited by AWS.

    This blueprint provides an enterprise safety gate that maps all network interface attachments and
    inter-group rule dependencies before planning any deletions. It includes configurable age thresholds,
    blast-radius limits, downloadable JSON/Markdown audit reports, Slack notifications, and interactive human
    approval.

    ## How it works

    1. **Inventory Collection**: `scan_or_load_inventory` queries `ec2:DescribeSecurityGroups` and `ec2:DescribeNetworkInterfaces` across the target AWS region, or loads an offline inventory JSON file (`aws_inventory_file`) for air-gapped evaluation and CI validation.
    2. **Dependency & Graph Analysis**: `analyze_orphaned_network_resources` maps all inter-resource relationships:
       - **Attached ENIs**: Security groups attached to any active or stopped ENI are classified as in-use and retained.
       - **Rule Dependencies**: Any security group referenced as a source or destination in ingress/egress rules of another security group is preserved.
       - **Default & Protected Groups**: AWS default security groups and names matching `protected_sg_patterns` (e.g. `k8s-*`, `eks-*`, `launch-wizard-*`) are permanently protected.
       - **Retention Tags**: Resources tagged with `keep` (configurable), `DoNotDelete`, or `Production` are exempted.
       - **Grace Period**: Resources younger than `min_age_days` (default: 14 days) are retained to protect in-flight provisioning stacks.
       - **Unattached ENIs**: Network interfaces with `status: available` and no active attachment older than `min_age_days` are flagged for cleanup.
    3. **Blast-Radius Protection**: If candidate resources exceed `max_deletions_per_run` (default: 20), only the first 20 are planned, safely deferring remainder to future executions.
    4. **Audit Reporting**: Outputs machine-readable `orphan_network_resources_plan.json` and human-readable `orphan_network_resources_audit.md`.
    5. **Slack Alerting**: Posts structured notifications with candidate counts and VPC breakdown when `notify_slack: true`.
    6. **Approval & Execution Gate**: In default mode (`dry_run: true`), reports findings without deleting anything. When `dry_run: false` and `enable_deletion: true`, enters a Kestra `Pause` task requiring explicit operator sign-off before executing deletions via `ec2:DeleteNetworkInterface` (unattached ENIs first) and `ec2:DeleteSecurityGroup` (orphaned SGs second).

    ## What you get

    - Automated discovery of orphaned security groups and unattached ENIs.
    - Full dependency mapping preventing broken firewall rules and `DependencyViolation` errors.
    - Default security group protection and configurable tag exemption (`keep=true`).
    - Blast-radius limits capping max deletions per execution.
    - Downloadable JSON and Markdown audit reports.
    - Slack notifications for planned candidate batches and verified execution outcomes.

    ## Who it's for

    - Platform, DevOps, and Cloud Security engineers maintaining AWS VPC hygiene and CIS compliance.
    - Network engineers reclaiming exhausted VPC subnet IP space held by lingering ENIs.
    - SRE teams establishing safe, approval-gated cloud garbage collection routines.

    ## Why orchestrate this with Kestra

    Ad-hoc cron cleanup scripts lack dependency graph awareness, interactive approvals, and immutable audit logs. Orchestrating AWS network hygiene in Kestra provides:
    - **Safe Two-Stage Execution**: Decouple discovery and dry-run auditing from destructive deletion.
    - **Interactive Approvals**: Hold execution with Kestra's `Pause` task until an engineer inspects the generated Markdown plan.
    - **Auditable History**: Retain complete records of every audit report, approver identity, and deleted resource ID.

    ## Policy Defaults & Safety Scope

    - **Policy Defaults**: `min_age_days: 14` and `max_deletions_per_run: 20` are baseline safety defaults. Adjust them according to your organization's release cadence.
    - **Execution Sequence**: Unattached ENIs are deleted prior to security groups to ensure any residual interface attachment locks are cleared.

    ## Prerequisites & Secrets

    - **AWS IAM Permissions**: `ec2:DescribeSecurityGroups`, `ec2:DescribeNetworkInterfaces`, `ec2:DeleteSecurityGroup`, and `ec2:DeleteNetworkInterface`.
    - **AWS Credentials**: `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` secrets (optional `AWS_SESSION_TOKEN`).
    - **Slack Webhook**: Required only when `notify_slack: true`. Provide via `slack_webhook_url` input or `SLACK_WEBHOOK_URL` secret.

    ## Quick start

    1. Set `region` to your target AWS region (e.g. `us-east-1`).
    2. Leave `dry_run: true` to generate an initial advisory audit report without deleting any resources.
    3. Execute the flow and review `orphan_network_resources_audit.md` in the Outputs tab.
    4. To enforce cleanup, set `dry_run: false`, `enable_deletion: true`, resume the paused execution upon review, and confirm execution outcomes.

    ## How to extend

    - **Multi-Region Sweeps**: Wrap this flow with Kestra's `ForEach` task to sweep all AWS regions in your account.
    - **Terraform State Cross-Check**: Compare discovered orphan IDs against active Terraform remote state files before deletion.
    - **Automated Ticketing**: Automatically open Jira or ServiceNow tickets when orphaned resources exceed threshold limits.

    ## Links

    - [CIS AWS Foundations Benchmark](https://www.cisecurity.org/benchmark/amazon_web_services)
    - [AWS EC2 DescribeSecurityGroups API](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DescribeSecurityGroups.html)
    - [AWS EC2 DescribeNetworkInterfaces API](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DescribeNetworkInterfaces.html)
    - [Kestra Pause Task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.pause)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
