id: dagster-stuck-queued-run-terminator
namespace: company.dataengineering

description: >-
  Detect and terminate Dagster job runs stuck in QUEUED state beyond operational SLAs,
  clearing agent queue deadlocks with automated GraphQL remediation and safe dry-run controls.

inputs:
  - id: dagster_graphql_url
    type: URI
    displayName: Dagster GraphQL Endpoint
    defaults: "http://dagster-webserver:3000/graphql"
    description: URL of the Dagster GraphQL webserver endpoint.

  - id: max_queued_minutes
    type: INT
    displayName: Max Queued Minutes
    defaults: 30
    description: Maximum allowable elapsed minutes for a run in QUEUED state before it is considered stuck.

  - id: auto_terminate
    type: SELECT
    displayName: Auto Terminate
    defaults: "false"
    values:
      - "false"
      - "true"
    description: When true and dry-run is false, automatically terminate identified stuck queued runs.

  - id: dry_run
    type: SELECT
    displayName: Dry Run
    defaults: "true"
    values:
      - "true"
      - "false"
    description: If true, only audit and report stuck runs without issuing terminate mutations.

triggers:
  - id: queue_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Dagster queued runs every 20 minutes. Shipped disabled by default.
    cron: "*/20 * * * *"
    disabled: true

tasks:
  - id: query_queued_runs
    type: io.kestra.plugin.core.http.Request
    description: Query Dagster GraphQL API for all job runs currently in QUEUED state.
    uri: "{{ inputs.dagster_graphql_url }}"
    method: POST
    contentType: application/json
    headers:
      Content-Type: application/json
      Authorization: "Bearer {{ secret('DAGSTER_TOKEN') }}"
    body: |
      {
        "query": "query QueuedRunsQuery($filter: RunsFilter!) { runsOrError(filter: $filter) { __typename ... on Runs { results { id runId jobName status creationTime } } ... on PythonError { message stack } } }",
        "variables": {
          "filter": {
            "statuses": ["QUEUED"]
          }
        }
      }

  - id: evaluate_stuck_runs
    type: io.kestra.plugin.scripts.python.Script
    description: Identify queued runs exceeding the elapsed SLA threshold and extract execution details.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      RESPONSE_BODY: "{{ outputs.query_queued_runs.body }}"
      MAX_MINUTES: "{{ inputs.max_queued_minutes }}"
    script: |
      import os
      import json
      import time
      from kestra import Kestra

      raw = os.environ.get("RESPONSE_BODY", "{}")
      max_mins = int(os.environ.get("MAX_MINUTES", 30))
      data = json.loads(raw)

      runs_data = data.get("data", {}).get("runsOrError", {})
      results = runs_data.get("results", [])

      now = time.time()
      threshold_seconds = max_mins * 60
      stuck_runs = []

      for r in results:
          creation_time = r.get("creationTime") or now
          elapsed_seconds = now - creation_time
          if elapsed_seconds > threshold_seconds:
              stuck_runs.append({
                  "run_id": r.get("runId", ""),
                  "job_name": r.get("jobName", "unknown"),
                  "elapsed_minutes": int(elapsed_seconds / 60)
              })

      summary = f"Detected {len(stuck_runs)} Dagster run(s) stuck in QUEUED state for over {max_mins} minutes."
      formatted_lines = [f"• Job `{s['job_name']}` (Run `{s['run_id']}`): Queued for {s['elapsed_minutes']}m" for s in stuck_runs]

      Kestra.outputs({
          "stuck_run_count": len(stuck_runs),
          "stuck_runs": stuck_runs,
          "summary": summary,
          "details_formatted": "\n".join(formatted_lines) if formatted_lines else "Queue healthy. No stuck runs found."
      })

  - id: route_queue_condition
    type: io.kestra.plugin.core.flow.Switch
    description: Branch based on whether any stuck queued runs were identified.
    value: "{{ outputs.evaluate_stuck_runs.vars.stuck_run_count > 0 ? 'STUCK' : 'CLEAR' }}"
    cases:
      "CLEAR":
        - id: log_queue_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Dagster run queue is healthy. Zero runs exceeded the {{ inputs.max_queued_minutes }}m threshold."

      "STUCK":
        - id: evaluate_remediation_gate
          type: io.kestra.plugin.core.flow.If
          description: Check if automated termination is armed and dry-run is turned off.
          condition: "{{ inputs.auto_terminate == 'true' and inputs.dry_run == 'false' }}"
          then:
            - id: terminate_stuck_runs_loop
              type: io.kestra.plugin.core.flow.ForEach
              description: Iterate over each identified stuck run and send a terminateRun mutation.
              values: "{{ outputs.evaluate_stuck_runs.vars.stuck_runs }}"
              tasks:
                - id: terminate_single_run
                  type: io.kestra.plugin.core.http.Request
                  description: Issue GraphQL terminateRun mutation for the target runId.
                  uri: "{{ inputs.dagster_graphql_url }}"
                  method: POST
                  contentType: application/json
                  headers:
                    Content-Type: application/json
                    Authorization: "Bearer {{ secret('DAGSTER_TOKEN') }}"
                  body: |
                    {
                      "query": "mutation TerminateStuckRun($runId: String!) { terminateRun(runId: $runId) { __typename ... on TerminateRunSuccess { run { runId status } } ... on TerminateRunFailure { message } ... on PythonError { message } } }",
                      "variables": {
                        "runId": "{{ taskrun.value.run_id }}"
                      }
                    }

                - id: log_termination_event
                  type: io.kestra.plugin.core.log.Log
                  message: "Issued termination for stuck Dagster run {{ taskrun.value.run_id }} (Job: {{ taskrun.value.job_name }})."

            - id: verify_queue_drain
              type: io.kestra.plugin.core.http.Request
              description: Re-query queued runs to confirm zombie runs were terminated.
              uri: "{{ inputs.dagster_graphql_url }}"
              method: POST
              contentType: application/json
              headers:
                Content-Type: application/json
                Authorization: "Bearer {{ secret('DAGSTER_TOKEN') }}"
              body: |
                {
                  "query": "query ConfirmQueueDrain { runsOrError(filter: { statuses: [QUEUED] }) { ... on Runs { results { runId } } } }"
                }
          else:
            - id: notify_slack_stuck_queue_alert
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              description: Dispatch alert to Slack when stuck runs are detected in dry-run or disarmed mode.
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "channel": "#data-platform-alerts",
                  "username": "Kestra Queue Sentinel",
                  "icon_emoji": ":hourglass_flowing_sand:",
                  "attachments": [
                    {
                      "color": "#e0a800",
                      "title": "Dagster Runs Stuck in QUEUED State (Remediation Gated)",
                      "text": "{{ outputs.evaluate_stuck_runs.vars.summary }}\n\n{{ outputs.evaluate_stuck_runs.vars.details_formatted }}",
                      "fields": [
                        {
                          "title": "Auto Terminate Armed",
                          "value": "{{ inputs.auto_terminate == 'true' and inputs.dry_run == 'false' }}",
                          "short": true
                        },
                        {
                          "title": "SLA Threshold",
                          "value": "{{ inputs.max_queued_minutes }} minutes",
                          "short": true
                        }
                      ],
                      "footer": "Kestra Orchestrator",
                      "ts": "{{ now() | date('X') }}"
                    }
                  ]
                }

errors:
  - id: alert_on_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Post an emergency notification if the queue audit flow fails to execute.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#data-platform-alerts",
        "username": "Kestra Orchestrator Alert",
        "icon_emoji": ":rotating_light:",
        "text": "Execution *{{ execution.id }}* of *{{ flow.id }}* failed while checking Dagster queued runs."
      }

outputs:
  - id: stuck_run_count
    type: INT
    value: "{{ outputs.evaluate_stuck_runs.vars.stuck_run_count }}"
  - id: summary
    type: STRING
    value: "{{ outputs.evaluate_stuck_runs.vars.summary }}"

extend:
  title: Dagster Stuck Queued Run Terminator
  metaTitle: Dagster Stuck Queued Run Terminator | Kestra
  shortDescription: Detect runs stuck in Dagster QUEUED state and safely terminate deadlocked jobs.
  metaDescription: Audit Dagster runs stuck in QUEUED status via GraphQL, identify agent deadlocks, and terminate zombie runs with automated dry-run safety gates.
  description: |
    Monitors Dagster's run queue for jobs trapped in `QUEUED` state beyond allowed operational SLAs. Concurrency slot deadlocks, crashed daemon workers, or unavailable compute instances frequently leave Dagster runs stranded in the queue, preventing subsequent pipeline runs from claiming execution slots. This blueprint audits the queue, isolates zombie runs, and optionally terminates them via GraphQL mutations with explicit dry-run safety gates.

    ## How it works
    1. Issues a GraphQL `QueuedRunsQuery` with `statuses: ["QUEUED"]` to fetch all waiting runs and creation timestamps.
    2. Runs an isolated Python task runner to compute elapsed time against the `max_queued_minutes` SLA threshold.
    3. Evaluates flow branching: if no runs exceed the threshold, logs confirmation and safely completes.
    4. When stuck runs are detected and `auto_terminate: true` / `dry_run: false` are set, iterates over each run using `io.kestra.plugin.core.flow.ForEach`.
    5. Issues a `terminateRun` GraphQL mutation for each deadlocked run and verifies that the queue has drained.
    6. Emits structured Slack alerts with diagnostic breakdowns if termination is disarmed or running in dry-run mode.

    ## What you get
    - Elimination of silent queue deadlocks and starvation of downstream critical pipelines.
    - Automated clearing of orphaned runs without manual webserver interaction.
    - Two-phase execution control: report-only dry run vs. active remediation.
    - Detailed run-level audit trails with elapsed execution durations.

    ## Who it's for
    - Platform Engineers maintaining Dagster instance throughput and concurrency slots.
    - Data Engineers running high-frequency asset schedules.
    - SREs responsible for data platform reliability and SLA adherence.

    ## Why orchestrate this with Kestra
    Dagster daemons can queue runs faster than workers can process them, leading to head-of-line blocking when a run's worker fails to launch. Kestra acts as the external supervisor: observing the queue state, applying timeout policies, and invoking administrative GraphQL mutations to clear deadlocks and keep pipelines flowing.

    ## Prerequisites
    - Dagster GraphQL endpoint accessible over HTTP/HTTPS.
    - A configured Slack incoming webhook URL for notifications.

    ### Secrets
    - `DAGSTER_TOKEN`: Bearer token for Dagster GraphQL webserver authentication.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Define `DAGSTER_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Adjust `max_queued_minutes` (default: 30 minutes) to match your workload SLA.
    3. Execute the flow manually with `dry_run: true` to view any currently queued runs.
    4. When ready for autonomous remediation, configure `auto_terminate: true` and `dry_run: false`.
    5. Enable the `queue_audit_schedule` trigger to run audits every 20 minutes.

    ## How to extend
    - Chain an automated Slack notification to the job owner tagged in the Dagster run.
    - Add logic to scale up Kubernetes worker deployment replicas before opting to terminate.
    - Export queued run counts into Prometheus or CloudWatch metrics via Kestra tasks.

    ## Links
    - [Dagster Run Queue Documentation](https://docs.dagster.io/deployment/run-monitoring-and-retries)
    - [Dagster GraphQL Run Mutations](https://docs.dagster.io/deployment/apis/graphql)
    - [Kestra ForEach Flow Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.flow.foreach)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Day 2 Operations
    - Incident Response
  ee: false
  demo: false
