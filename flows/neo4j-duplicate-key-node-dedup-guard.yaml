id: neo4j-duplicate-key-node-dedup-guard
namespace: company.team

description: |
  Find values of a business key that are carried by more than one node of the same label
  in Neo4j, report them to Slack and after approval keep one node per key and remove the
  surplus, then re-read the graph and fail the run if a key the flow claimed is still
  duplicated. A surplus node that owns relationships is never deleted, it is reported for
  a human, so no edge is lost. Once the label is clean the flow can create the uniqueness
  constraint that could not be created while the duplicates existed.

inputs:
  - id: url
    type: STRING
    displayName: Neo4j Bolt URL
    defaults: "bolt://localhost:7687"

  - id: user
    type: STRING
    displayName: Neo4j user
    defaults: "neo4j"

  - id: password
    type: STRING
    displayName: Neo4j password
    description: Defaults to the NEO4J_PASSWORD secret. Override only for local testing.
    defaults: "{{ secret('NEO4J_PASSWORD') }}"

  - id: label
    type: STRING
    displayName: Node label to check
    description: Only nodes carrying this label are grouped. One label per run.
    defaults: "Account"

  - id: key_property
    type: STRING
    displayName: Business key property
    description: >-
      The property that should identify one node. Nodes where it is null are skipped,
      because a missing key is a different problem.
    defaults: "account_id"

  - id: keeper_rule
    type: SELECT
    displayName: Which node is kept
    description: >-
      most_connected_then_oldest keeps the node with the most relationships, so the edges
      survive without being moved. Ties go to the oldest timestamp. oldest keeps
      the oldest node whatever its degree, which is stricter about provenance but refuses
      more keys, because a surplus node that owns relationships is never deleted.
    values:
      - most_connected_then_oldest
      - oldest
    defaults: most_connected_then_oldest

  - id: keeper_timestamp_property
    type: STRING
    displayName: Timestamp property that breaks ties
    description: >-
      The node with the lowest value of this property wins the tie. Nodes missing the
      property sort last. Equal values fall back to the lowest elementId, so the choice is
      deterministic and two runs keep the same node.
    defaults: "created_at"

  - id: max_keys
    type: INT
    displayName: Maximum duplicated keys handled per run
    description: Caps how much one run touches. Keys beyond the cap are reported and left for the next run.
    defaults: 50

  - id: create_unique_constraint
    type: BOOL
    displayName: Create the uniqueness constraint once the label is clean
    description: >-
      When true the flow creates
      the node property uniqueness constraint so the duplicates cannot come back. It is
      skipped with a log while any key is still duplicated, because the constraint would be
      rejected.
    defaults: false

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, before anything is written.
    defaults: true

tasks:
  - id: validate_target
    type: io.kestra.plugin.core.execution.Assert
    description: Label and property names are interpolated into Cypher inside backticks and single quotes, so a name carrying a quote, backtick or backslash is refused before any query runs.
    conditions:
      - "{{ inputs.label | length > 0 and inputs.key_property | length > 0 and inputs.keeper_timestamp_property | length > 0 }}"
      - "{{ (inputs.label ~ inputs.key_property ~ inputs.keeper_timestamp_property) | replace({'[`\\x27\\\\]': ''}, regexp=true) == (inputs.label ~ inputs.key_property ~ inputs.keeper_timestamp_property) }}"
    errorMessage: label, key_property and keeper_timestamp_property must be non-empty and must not contain a backtick, single quote or backslash.

  - id: audit
    type: io.kestra.plugin.neo4j.Query
    description: >-
      Read-only. Groups the label by the business key, keeps the key values held by more
      than one node, then orders each group by the keeper rule. Returns the keeper, the
      surplus element ids, how many relationships the surplus owns and whether the key can
      be cleaned without touching an edge.
    url: "{{ inputs.url }}"
    username: "{{ inputs.user }}"
    password: "{{ inputs.password }}"
    storeType: FETCH
    query: |
      MATCH (n:`{{ inputs.label }}`)
      WHERE n['{{ inputs.key_property }}'] IS NOT NULL
      WITH n['{{ inputs.key_property }}'] AS key_value, collect(n) AS nodes
      WHERE size(nodes) > 1
      UNWIND nodes AS dup
      WITH key_value, dup, size([(dup)--() | 1]) AS degree
      ORDER BY key_value,
               CASE WHEN '{{ inputs.keeper_rule }}' = 'most_connected_then_oldest' THEN -degree ELSE 0 END,
               (dup['{{ inputs.keeper_timestamp_property }}'] IS NULL),
               dup['{{ inputs.keeper_timestamp_property }}'],
               elementId(dup)
      WITH key_value, collect({id: elementId(dup), degree: degree, stamp: toString(dup['{{ inputs.keeper_timestamp_property }}'])}) AS ordered
      WITH key_value, head(ordered) AS keeper, tail(ordered) AS surplus, size(ordered) AS node_count
      RETURN toString(key_value) AS key_value,
             node_count,
             size(surplus) AS surplus_count,
             keeper.id AS keeper_id,
             keeper.degree AS keeper_degree,
             keeper.stamp AS keeper_stamp,
             [s IN surplus | s.id] AS surplus_ids,
             [s IN surplus WHERE s.degree > 0 | s.id] AS connected_surplus_ids,
             reduce(t = 0, s IN surplus | t + s.degree) AS surplus_relationships,
             size([s IN surplus WHERE s.degree > 0]) = 0 AS actionable
      ORDER BY surplus_count DESC, key_value
      LIMIT {{ inputs.max_keys }}

  - id: constraint_state
    type: io.kestra.plugin.neo4j.Query
    description: >-
      Read-only. Lists any node property uniqueness constraint that already covers this
      label and key. When one exists the database is already rejecting duplicates, so a
      finding means the duplicates predate the constraint.
    url: "{{ inputs.url }}"
    username: "{{ inputs.user }}"
    password: "{{ inputs.password }}"
    storeType: FETCH
    query: |
      SHOW CONSTRAINTS YIELD name, type, entityType, labelsOrTypes, properties
      WHERE type = 'UNIQUENESS' AND entityType = 'NODE'
        AND '{{ inputs.label }}' IN labelsOrTypes
        AND '{{ inputs.key_property }}' IN properties
      RETURN name, type, labelsOrTypes, properties

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Neo4j duplicate key audit on {{ inputs.url }} for (:{{ inputs.label }}) key {{ inputs.key_property }}, keeper rule {{ inputs.keeper_rule }}:
      {{ outputs.audit.size }} duplicated key(s). Uniqueness constraint already present: {{ outputs.constraint_state.size > 0 }}.
      {% for r in outputs.audit.rows %}{{ r.key_value }}: {{ r.node_count }} nodes, {{ r.surplus_count }} surplus, {{ r.surplus_relationships }} relationship(s) owned by the surplus, cleanable {{ r.actionable }}. {% endfor %}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Neo4j ' ~ inputs.url ~ ': ' ~ outputs.audit.size ~ ' value(s) of ' ~ inputs.key_property ~ ' are carried by more than one (:' ~ inputs.label ~ ') node. Surplus nodes: ' ~ (outputs.audit.rows | jq('[.[].surplus_count] | add | tostring') | first) ~ ', of which ' ~ (outputs.audit.rows | jq('[.[].connected_surplus_ids | length] | add | tostring') | first) ~ ' own relationships and will not be deleted. Worst: ' ~ (outputs.audit.rows | jq('.[0] | .key_value + " (" + (.node_count|tostring) + " nodes)"') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Removing the relationship-free surplus after approval.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: review_queue
        type: io.kestra.plugin.core.log.Log
        description: >-
          Names the keys this flow refuses to clean. A surplus node that owns relationships
          cannot be deleted without destroying those edges, so it is handed to a human who
          decides where each edge belongs.
        message: >-
          Keys left for a human because the surplus owns relationships:
          {{ outputs.audit.rows | jq('[.[] | select(.actionable == false) | .key_value + " (" + ((.connected_surplus_ids|length)|tostring) + " connected surplus node(s), " + (.surplus_relationships|tostring) + " relationship(s))"] | if length == 0 then "none" else join(", ") end') | first }}.
          Move or re-point the relationships of any key listed here onto the keeper, then run this flow again.

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approve
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Deleting a node cannot be undone, so a human approves first. Resume with
              approved true to remove the relationship-free surplus, false to leave the
              graph exactly as it is.
            onResume:
              - id: approved
                type: BOOL
                defaults: false

          - id: apply_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approve.onResume.approved ?? false }}"
            then:
              - id: remediate_keys
                type: io.kestra.plugin.core.flow.Loop
                description: >-
                  One key per iteration, sequentially. Remediating two keys at once would
                  have two transactions competing for locks on the same label with no
                  benefit, so concurrencyLimit is 1.
                concurrencyLimit: 1
                values: "{{ outputs.audit.rows | jq('[.[] | select(.actionable == true) | {key: (.key_value|tostring), ids: (.surplus_ids|tojson)}]') | first }}"
                tasks:
                  - id: delete_surplus
                    type: io.kestra.plugin.neo4j.Query
                    description: >-
                      Deletes only the surplus nodes the audit listed for this key. It takes only
                      those that still own no relationship when the delete runs. The degree
                      is read again inside the delete transaction, so a node that gained an
                      edge during the approval window is skipped. The statement uses plain
                      DELETE, never DETACH DELETE, so if a node did gain an edge Neo4j
                      refuses the delete rather than destroying the edge.
                    url: "{{ inputs.url }}"
                    username: "{{ inputs.user }}"
                    password: "{{ inputs.password }}"
                    storeType: FETCH
                    allowFailure: true
                    query: |
                      MATCH (n:`{{ inputs.label }}`)
                      WHERE elementId(n) IN {{ fromJson(item.value).ids }}
                      WITH n, size([(n)--() | 1]) AS degree, elementId(n) AS dead_id
                      WHERE degree = 0
                      DELETE n
                      RETURN count(dead_id) AS deleted_count, collect(dead_id) AS deleted_ids

                  - id: deleted
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Key {{ fromJson(item.value).key }}: deleted {{ outputs.delete_surplus.rows[0].deleted_count ?? 0 }} of the {{ fromJson(item.value).ids | length }} audited surplus node(s).

              - id: reaudit
                type: io.kestra.plugin.neo4j.Query
                description: Read-only. Runs the same detection again, so the verification reads the graph instead of trusting the delete counts.
                url: "{{ inputs.url }}"
                username: "{{ inputs.user }}"
                password: "{{ inputs.password }}"
                storeType: FETCH
                query: |
                  MATCH (n:`{{ inputs.label }}`)
                  WHERE n['{{ inputs.key_property }}'] IS NOT NULL
                  WITH n['{{ inputs.key_property }}'] AS key_value, collect(n) AS nodes
                  WHERE size(nodes) > 1
                  RETURN toString(key_value) AS key_value,
                         size(nodes) AS node_count,
                         size(nodes) - 1 AS surplus_count
                  ORDER BY surplus_count DESC, key_value
                  LIMIT {{ inputs.max_keys }}

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                description: Fail if a key the audit marked cleanable still has more than one node.
                condition: >-
                  {{ {'before': outputs.audit.rows, 'after': (outputs.reaudit.rows ?? [])} | jq('([.before[] | select(.actionable == true) | (.key_value|tostring)] | unique) as $t | [.after[] | (.key_value|tostring)] | unique | [.[] | select(. as $x | ($t | index($x)) != null)] | length') | first > 0 }}
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: "Keys still duplicated after the cleanup: {{ {'before': outputs.audit.rows, 'after': outputs.reaudit.rows} | jq('([.before[] | select(.actionable == true) | (.key_value|tostring)] | unique) as $t | [.after[] | (.key_value|tostring)] | unique | [.[] | select(. as $x | ($t | index($x)) != null)] | join(\", \")') | first }}. A writer that inserts another node for the key during the approval window leaves it duplicated. A relationship attached to an audited surplus node makes that node undeletable. A user without delete rights on the label cannot remove a node. Check the graph and the loader that writes these nodes."
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Cleaned {{ outputs.audit.rows | jq('[.[] | select(.actionable == true)] | length | tostring') | first }} key(s) on (:{{ inputs.label }}).
                      Surplus nodes removed: {{ outputs.audit.rows | jq('[.[] | select(.actionable == true) | .surplus_count] | add // 0 | tostring') | first }}.
                      Keys still duplicated anywhere in scope: {{ outputs.reaudit.size }}.
                      {{ outputs.audit.rows | jq('[.[] | select(.actionable == true) | .key_value + ": " + (.node_count|tostring) + " nodes before, kept " + .keeper_id + " holding " + (.keeper_degree|tostring) + " relationship(s)"] | if length == 0 then "No key was cleanable" else join(". ") end') | first }}.
            else:
              - id: approval_denied
                type: io.kestra.plugin.core.log.Log
                message: "Approval not granted, no node was deleted. The audit list stands."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No value of {{ inputs.key_property }} is carried by more than one (:{{ inputs.label }}) node in {{ inputs.url }}."

  - id: constraint_gate
    type: io.kestra.plugin.core.flow.If
    description: >-
      The point of the cleanup is the constraint the duplicates were blocking. This runs on
      every path, including a run that found nothing, so the constraint can also be added to
      a label that is already clean.
    condition: "{{ inputs.create_unique_constraint and inputs.auto_remediate and not inputs.dry_run }}"
    then:
      - id: final_key_check
        type: io.kestra.plugin.neo4j.Query
        description: Read-only. Counts duplicated keys across the whole label, ignoring the max_keys cap, because the constraint covers every node not just the audited batch.
        url: "{{ inputs.url }}"
        username: "{{ inputs.user }}"
        password: "{{ inputs.password }}"
        storeType: FETCH
        query: |
          MATCH (n:`{{ inputs.label }}`)
          WHERE n['{{ inputs.key_property }}'] IS NOT NULL
          WITH n['{{ inputs.key_property }}'] AS key_value, count(*) AS nodes
          WHERE nodes > 1
          RETURN count(*) AS duplicated_keys, coalesce(sum(nodes - 1), 0) AS surplus_nodes

      - id: constraint_decide
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.final_key_check.rows[0].duplicated_keys == 0 }}"
        then:
          - id: create_constraint
            type: io.kestra.plugin.neo4j.Query
            description: >-
              Creates the node property uniqueness constraint that the duplicates made
              impossible. From here the database rejects the second node for a key, so the
              ingest bug fails loudly instead of growing the graph.
            url: "{{ inputs.url }}"
            username: "{{ inputs.user }}"
            password: "{{ inputs.password }}"
            storeType: NONE
            query: |
              CREATE CONSTRAINT `{{ inputs.label | lower }}_{{ inputs.key_property | lower }}_unique` IF NOT EXISTS
              FOR (n:`{{ inputs.label }}`) REQUIRE n.`{{ inputs.key_property }}` IS UNIQUE

          - id: verify_constraint
            type: io.kestra.plugin.neo4j.Query
            description: Read-only. Reads the constraint back from the database rather than trusting that the create statement ran.
            url: "{{ inputs.url }}"
            username: "{{ inputs.user }}"
            password: "{{ inputs.password }}"
            storeType: FETCH
            query: |
              SHOW CONSTRAINTS YIELD name, type, entityType, labelsOrTypes, properties
              WHERE type = 'UNIQUENESS' AND entityType = 'NODE'
                AND '{{ inputs.label }}' IN labelsOrTypes
                AND '{{ inputs.key_property }}' IN properties
              RETURN name, labelsOrTypes, properties

          - id: constraint_verified
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.verify_constraint.size > 0 }}"
            then:
              - id: constraint_present
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Uniqueness constraint in place on (:{{ inputs.label }} {{ inputs.key_property }}): {{ outputs.verify_constraint.rows[0].name }}.
                  Duplicate keys at creation time: {{ outputs.final_key_check.rows[0].duplicated_keys }}. A second node for the same key is now rejected by the database.
            else:
              - id: constraint_missing
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "The uniqueness constraint on (:{{ inputs.label }} {{ inputs.key_property }}) is not in SHOW CONSTRAINTS after the create statement ran. Check that the user holds the schema privilege on this database."
        else:
          - id: constraint_blocked
            type: io.kestra.plugin.core.log.Log
            message: >-
              Constraint not created. {{ outputs.final_key_check.rows[0].duplicated_keys }} key(s) on (:{{ inputs.label }}) are still carried by more than one node
              ({{ outputs.final_key_check.rows[0].surplus_nodes }} surplus node(s)), so CREATE CONSTRAINT would be rejected with "Both Node(x) and Node(y) have the label and property value".
              These are the keys whose surplus owns relationships, which this flow refuses to delete. Re-point those relationships, then run again.

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Neo4j duplicate key node guard failed on ' ~ inputs.url ~ ' for (:' ~ inputs.label ~ ') key ' ~ inputs.key_property ~ ' (execution ' ~ execution.id ~ '). Duplicate state unknown, check the logs.'} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, always in safe mode.
    cron: "0 5 * * 1"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true
      create_unique_constraint: false

extend:
  title: Neo4j Duplicate Key Node Dedup Guard
  shortDescription: Find business key values carried by more than one Neo4j node, keep one node per key after approval, never delete a node that owns relationships, then re-read the graph and create the uniqueness constraint the duplicates were blocking.
  metaTitle: Neo4j Duplicate Key Node Dedup Guard with Kestra
  metaDescription: Find Neo4j nodes sharing a business key, keep one per key after approval, re-read the graph, then create the uniqueness constraint the duplicates blocked.
  description: |
    A label with no uniqueness constraint will take as many nodes for a key as you send it.
    One `CREATE` where a `MERGE` was meant, one retried load, one import replayed after a
    partial failure. Now `(:Account {account_id: 'ACC-1001'})` exists three times. Every
    lookup by that key returns several nodes, every count is inflated. A `MERGE` from
    then on matches every one of them.

    The obvious fix makes it worse. `CREATE CONSTRAINT ... IS UNIQUE` is rejected while the
    duplicates exist: `Both Node(3) and Node(4) have the label Account and property
    account_id = 'ACC-1001'`. So the constraint cannot be added until the data is clean,
    which makes this cleanup the prerequisite rather than a tidy-up. The flow finishes
    by creating that constraint once the label is clean.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    Deleting a node is not reversible, so three things sit between a finding and any delete:
    `auto_remediate` must be true, `dry_run` must be false and a human must resume a `Pause`
    with `approved: true`. The default run only reports.

    **A duplicate that owns relationships is never deleted.** That is the decision this flow
    makes. It is the whole reason it is safe to run. `DETACH DELETE` would remove the
    node and silently take its edges with it, which can destroy the only record that an
    account held a card or that a user wrote a document. So the flow splits the surplus in
    two:

    - Surplus nodes that own no relationship are deleted with a plain `DELETE`.
    - Surplus nodes that own relationships are not touched. Their key is reported in the
      `review_queue` log with the edge count. A human decides where each edge belongs.
      Nothing is merged automatically.

    Two things enforce that. The delete statement selects on `size([(n)--() | 1]) = 0`, read
    again inside the delete transaction rather than taken from the audit, so a node that
    gained an edge during the approval window drops out. And the statement is a plain
    `DELETE`, so if such a node were selected anyway Neo4j refuses the whole statement with
    `Cannot delete node<4>, because it still has relationships`. The failure is loud, the
    edge survives, the re-read then fails the run.

    The keeper is deterministic. Under the default `most_connected_then_oldest` the node
    holding the most relationships is kept, so the edges survive where they are and the key
    becomes cleanable instead of blocked. Ties go to the lowest
    `keeper_timestamp_property`, then the lowest `elementId`. Under `oldest` the age wins
    whatever the degree, which is stricter about provenance but refuses more keys, because a
    connected surplus node is still never deleted.

    ## How it works

    1. `audit` (`io.kestra.plugin.neo4j.Query`, read-only) groups the label by the key, keeps the values held by more than one node, orders each group by the keeper rule and returns the keeper, the surplus element ids, the relationship count owned by the surplus plus an `actionable` flag that is true only when no surplus node owns an edge. `max_keys` caps the batch.
    2. `constraint_state` reads `SHOW CONSTRAINTS` and reports whether a uniqueness constraint already covers this label and key.
    3. `summary` logs every duplicated key with its node count, its surplus, the edges that surplus owns and whether it is cleanable.
    4. `route` (`io.kestra.plugin.core.flow.If` on `outputs.audit.size > 0`):
       - **clean:** `clean` logs that no key is duplicated.
       - **findings:** `alert` posts the key count, the total surplus, how much of that surplus owns relationships and the worst key to Slack.
         - `review_queue` names the keys the flow refuses to clean, with their edge counts.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `approve` is a `Pause`. A human resumes it with `approved` true or false.
         - `remediate_keys` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) takes one cleanable key per iteration and deletes its relationship-free surplus nodes by element id.
         - `reaudit` runs the detection again against the graph.
         - `verify_result` fails the run if a key the audit marked cleanable still has more than one node.
    5. `constraint_gate` runs on every path when `create_unique_constraint`, `auto_remediate` and not `dry_run` are all set. `final_key_check` counts duplicated keys across the whole label, then `create_constraint` adds the uniqueness constraint and `verify_constraint` reads it back from `SHOW CONSTRAINTS`. When a key still stands in the way, `constraint_blocked` logs how many.
    6. `errors` alerts Slack when the flow itself fails, for example an unreachable instance or a user without delete rights, so a failed audit is never read as "nothing wrong".

    ## What you get

    - The key values that are genuinely duplicated, with the node count per key, straight from Cypher.
    - A split between the duplicates that can be removed safely and the ones that own data, so a cleanup never costs you an edge.
    - A keeper rule you can state in a review: most connected, then oldest, then lowest element id.
    - Three gates before an irreversible delete, plus a plain `DELETE` as the last line of defence.
    - Proof the cleanup landed: the graph is read again and the run fails if a key it claimed is still duplicated, which is what happens when a writer inserts another node during the approval window.
    - The uniqueness constraint created at the end, so the same duplicates cannot come back.

    ## Who it's for

    - Teams loading a graph from a relational source, a CSV drop or an event stream, where a retry or a `CREATE` in place of a `MERGE` leaves a key duplicated.
    - Anyone who tried to add `IS UNIQUE` to an existing label and found the statement rejected by data already in the database.
    - Graph engineers whose `MERGE` statements started returning one row per duplicate.
    - Platform teams who want duplicates found on a schedule and cleaned only with an approval, with the relationship-owning cases escalated rather than swallowed.

    ## Why orchestrate this with Kestra

    The detection is one Cypher query. Doing something about it safely is a sequence: group
    the label, work out which duplicates own data, tell the team, wait for a human, delete
    only the safe ones with a keeper rule you can defend, read the graph again, fail if the
    cleanup did not take, then add the constraint that was blocked. Kestra runs that on a
    schedule behind two gates plus an approval, keeps the history of which keys were cleaned
    and when. It alerts Slack on the finding and on a failure. A cron job with a
    `DETACH DELETE` in it has no approval step, no proof it worked, no record of the edges it
    destroyed.

    ## Tested end to end

    On Kestra 2.0.5 OSS against Neo4j 5 Community, with a local HTTP sink standing in for
    Slack. The graph was seeded with six `:Account` nodes: `ACC-1001` three times where the
    newest of the three owns an `:OWNS` edge to a `:Card`, `ACC-1002` twice where both nodes
    own an `:OWNS` edge, plus `ACC-1003` once. `cypher-shell` counted nodes per key before and
    after every run.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults, graph clean | 0 keys, `clean` logged. No alert |
    | 2 | defaults, seeded duplicates | `ACC-1001` and `ACC-1002` reported, `ACC-1003` not. Alert sent, nothing deleted |
    | 3 | `auto_remediate: true`, `dry_run: true` | Same report, delete held. `cypher-shell` still counts 3, 2 and 1 |
    | 4 | `auto_remediate: true`, `dry_run: false`, approved false | Report, nothing deleted |
    | 5 | `auto_remediate: true`, `dry_run: false`, approved true | `ACC-1001` 3 nodes to 1, its `:OWNS` edge intact on the keeper. `ACC-1002` refused and reported, both edges intact. `ACC-1003` untouched |
    | 6 | `keeper_rule: oldest` on the same graph | `ACC-1001` becomes uncleanable, because the oldest node is not the one holding the edge, so the flow refuses it instead of deleting the connected node |
    | 7 | a writer inserts another node for a cleaned key during the approval window | The surplus is deleted, the new node keeps the key duplicated, `verify_result` fails the run and names the key |
    | 8 | `create_unique_constraint: true` with `ACC-1002` still duplicated | `constraint_blocked` logged, no constraint created |
    | 9 | `create_unique_constraint: true` on the cleaned label | Constraint created, read back from `SHOW CONSTRAINTS`. A later insert of a duplicate key is rejected by the database |
    | 10 | unreachable URL | `audit` failed, `errors` alert sent |

    Exact execution ids and the before and after node counts per key are in the pull request
    notes.

    ## Prerequisites

    - A reachable Neo4j 5.x instance. The flow uses plain Cypher (`MATCH`, `collect`, `tail`, `DELETE`, `SHOW CONSTRAINTS`, `CREATE CONSTRAINT`). Node property uniqueness constraints are available in Community as well as Enterprise.
    - For the audit, a user that can read the label. For remediation, a user allowed to delete nodes. For the constraint step, the schema privilege on the database.
    - A Slack incoming webhook for alerts.
    - Local testing:
      - `docker run -d --name neo4j -p 7687:7687 -e NEO4J_AUTH=neo4j/testpassword neo4j:5`;
      - seed a duplicate: `cypher-shell -u neo4j -p testpassword "CREATE (:Account {account_id:'ACC-1001', created_at:'2026-01-01'}), (:Account {account_id:'ACC-1001', created_at:'2026-02-01'});"`.

    ### Secrets

    - `NEO4J_PASSWORD`: password for the Neo4j user, the default for the `password` input.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`, for example `SECRET_NEO4J_PASSWORD=$(echo -n 'testpassword' | base64)`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `url` | `bolt://localhost:7687` | Bolt endpoint |
    | `user` | `neo4j` | Neo4j user |
    | `password` | `{{ secret('NEO4J_PASSWORD') }}` | Password, from the secret by default |
    | `label` | `Account` | Node label to group |
    | `key_property` | `account_id` | The business key that should identify one node |
    | `keeper_rule` | `most_connected_then_oldest` | `most_connected_then_oldest` or `oldest` |
    | `keeper_timestamp_property` | `created_at` | Tie-break, lowest value wins |
    | `max_keys` | `50` | Cap on duplicated keys handled per run |
    | `create_unique_constraint` | `false` | Add the uniqueness constraint once the label is clean |
    | `auto_remediate` | `false` | Allow the delete |
    | `dry_run` | `true` | Must be `false` before anything is written |

    ## Quick start

    1. Add the `NEO4J_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, set `url` and `user`, then set `label` and `key_property` to the key your ingest is supposed to be idempotent on.
    3. Run it with the defaults. Read the report: which keys are duplicated, how many of those duplicates own relationships.
    4. Deal with the `review_queue` keys by hand. Re-point their relationships onto the node you want to keep, so the next run can finish them.
    5. Run it with `auto_remediate: true` and `dry_run: false`, approve the `Pause`, then the relationship-free surplus is deleted and verified.
    6. Once the label comes back clean, run it once more with `create_unique_constraint: true` to add the constraint the duplicates were blocking.
    7. Enable the `weekly` trigger, which always runs in safe mode.

    ## How to extend

    - Point the relationships at the keeper before deleting, with an explicit `MATCH (dup)-[r:OWNS]->(x) MERGE (keeper)-[:OWNS]->(x)` per relationship type you are willing to move, then let the next run delete the emptied duplicates.
    - Merge properties onto the keeper first, so it inherits values only the duplicates carried.
    - Add a second key to the grouping for a composite business key, for example tenant plus account.
    - Open a ticket for every `review_queue` key instead of logging it, so the manual cases are tracked.
    - Drive the ingest fix from the same flow by failing the build when the duplicate count rises between runs.
    - Swap the delete for an archive, writing the surplus nodes to a file or another label before removing them.

